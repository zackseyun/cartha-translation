translation:
  language: bn
  text: ঈশ্বর যখন প্রথমে আকাশমণ্ডল ও পৃথিবী সৃষ্টি করলেন[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'প্রচলিতভাবে এটি একটি পূর্ণ বাক্য হিসেবে অনূদিত হয়: ‘আদিতে ঈশ্বর আকাশমণ্ডল ও পৃথিবী সৃষ্টি করলেন।’ হিব্রুতে নির্দিষ্ট পদবিহীন בְּרֵאשִׁית-এর পর ক্রিয়া בָּרָא থাকায় বাক্যাংশটি আরও স্বাভাবিকভাবে একটি নির্ভরশীল কালবাচক উপবাক্য হিসেবে পড়া যায়; আদিপুস্তক ২:৪খ-তেও অনুরূপ গঠন আছে। সে পাঠে মূল বাক্যটি ৩ পদে: ‘ঈশ্বর বললেন, “আলো হোক।”’'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: আদিতে, যখন … সৃষ্টি করলেন
  rationale: নির্দিষ্টতাসূচক পদবিহীন בְּרֵאשִׁית-এর পর সমাপিকা ক্রিয়া בָּרָא এসেছে; তাই এটি স্বাভাবিকভাবে একটি নির্ভরশীল কালবাচক উপবাক্য হিসেবে পড়া যায়। ‘আদিতে’ רֵאשִׁית-এর অর্থ ধরে রাখে, আর ‘যখন’ বাক্যটির নির্ভরশীল গঠন স্পষ্ট করে।
- source_word: בָּרָא
  choice: সৃষ্টি করলেন
  rationale: হিব্রু বাইবেলে এটি ঈশ্বরের সৃষ্টিকর্ম বোঝানোর প্রচলিত ক্রিয়া। ‘সৃষ্টি করলেন’ সরাসরি ও স্বাভাবিক বাংলা এবং সৃষ্টির প্রক্রিয়া সম্বন্ধে অতিরিক্ত কিছু আরোপ করে না।
- source_word: אֱלֹהִים
  choice: ঈশ্বর
  rationale: শব্দটির রূপ বহুবচন হলেও এখানে এর সঙ্গে একবচন ক্রিয়া ব্যবহৃত হয়েছে; তাই একবচন ‘ঈশ্বর’ যথাযথ।
- source_word: אֵת
  choice: '[অনূদিত নয়; নির্দিষ্ট প্রত্যক্ষ কর্মের নির্দেশক]'
  rationale: হিব্রুতে אֵת নির্দিষ্ট প্রত্যক্ষ কর্মকে চিহ্নিত করে; বাংলায় এর স্বতন্ত্র প্রতিশব্দের প্রয়োজন নেই।
- source_word: הַשָּׁמַיִם
  choice: আকাশমণ্ডল
  rationale: হিব্রু শব্দটি রূপগতভাবে বহুবচন। আধুনিক বাংলায় ‘আকাশমণ্ডল’ একটি স্বাভাবিক সমষ্টিবাচক রূপ, যা পৃথিবীর বিপরীতে ঊর্ধ্বজগতের বিস্তার বোঝায় এবং ‘আকাশমণ্ডল ও পৃথিবী’ যুগলটিকে সমগ্র সৃষ্টিজগতের নির্দেশক হিসেবে ধরে রাখে।
- source_word: הָאָרֶץ
  choice: পৃথিবী
  rationale: אָרֶץ প্রসঙ্গভেদে ‘দেশ/ভূমি’ বা ‘পৃথিবী’ হতে পারে। আকাশমণ্ডলের সঙ্গে এই বিশ্বজনীন যুগলে ‘পৃথিবী’ই যথাযথ।
theological_decisions:
- issue: প্রারম্ভিক বাক্যাংশের বাক্যগঠন
  choice: 'নির্ভরশীল কালবাচক উপবাক্য: ‘আদিতে, যখন ঈশ্বর আকাশমণ্ডল ও পৃথিবী সৃষ্টি করলেন—’'
  alternative: 'স্বতন্ত্র পূর্ণ বাক্য: ‘আদিতে ঈশ্বর আকাশমণ্ডল ও পৃথিবী সৃষ্টি করলেন।’'
  rationale: নির্দিষ্টতাসূচক পদবিহীন בְּרֵאשִׁית, তার পরবর্তী সমাপিকা ক্রিয়া בָּרָא, এবং আদিপুস্তক ২:৪খ ও হোশেয় ১:২-এর অনুরূপ কালবাচক সূচনা—এসব নির্ভরশীল উপবাক্য পাঠকে সমর্থন করে। তবে প্রাচীন অনুবাদ ও দীর্ঘ অনুবাদ-ঐতিহ্যে স্বতন্ত্র পূর্ণ বাক্যের পাঠও সুপ্রতিষ্ঠিত; তাই সেটি পাদটীকায় সংরক্ষিত হয়েছে, কোনো ধর্মতাত্ত্বিক সিদ্ধান্ত দিয়ে অস্পষ্টতাটি মুছে দেওয়া হয়নি।
translation_notes:
  register: 'আধুনিক প্রমিত বাংলায় স্বাভাবিক, মর্যাদাপূর্ণ ও সাধারণ পাঠকের বোধগম্য ভাষা ব্যবহার করা হয়েছে। দীর্ঘ ড্যাশটি ইচ্ছাকৃত: এটি দেখায় যে ১ পদে শুরু হওয়া কালবাচক উপবাক্যটি পরবর্তী বাক্যের দিকে এগিয়ে যায়। ‘আকাশমণ্ডল’ প্রচলিত ধর্মীয় শব্দভাণ্ডারের সঙ্গে পরিচিত হলেও এখানে তা সমষ্টিবাচক ও বিশ্বজনীন অর্থে ব্যবহৃত হয়েছে।'
