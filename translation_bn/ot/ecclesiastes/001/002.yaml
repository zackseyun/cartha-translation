  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: bn
  text: কোহেলেত বলেন, “নিঃশ্বাসের নিঃশ্বাস[a], নিঃশ্বাসের নিঃশ্বাস—সবই কেবল নিঃশ্বাস।”[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: হিব্রু הֶבֶל (হেভেল) শব্দের আক্ষরিক অর্থ ‘নিঃশ্বাস’ বা ‘বাষ্প’। উপদেশক গ্রন্থে শব্দটি ক্ষণস্থায়ী, অধরা এবং প্রত্যাশার সঙ্গে ঘটনার অমিল—এই তিনটি সম্পর্কিত ভাব একসঙ্গে বহন করে। তাই এখানে ‘অসারতা’, ‘নিষ্ফলতা’ বা ‘অর্থহীনতা’র মতো একমাত্রিক বিমূর্ত শব্দের বদলে মূলের মূর্ত চিত্র রাখা হয়েছে। ‘নিঃশ্বাসের নিঃশ্বাস’ হিব্রু ভাষায় চূড়ান্ত মাত্রা বোঝানোর গঠন, যেমন ‘গানের গান’ বা ‘রাজাদের রাজা’।
    reason: চূড়ান্ত মাত্রাসূচক হিব্রু গঠনের বাংলা সমান্তরাল উদাহরণ সংশোধন করা হয়েছে।
  - marker: b
    text: ‘কোহেলেত’ একটি হিব্রু উপাধি বা নাম; প্রচলিতভাবে একে ‘শিক্ষক’ বা ‘প্রচারক’ বলা হয়। প্রতিটি অনুবাদ এর অর্থের পরিসর কিছুটা সংকুচিত করে, তাই এখানে হিব্রু রূপটি লিপ্যন্তর করা হয়েছে।
    reason: আরও স্বাভাবিক আধুনিক বাংলা পরিভাষা ব্যবহার করা হয়েছে।
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: নিঃশ্বাস
  rationale: শব্দটি আক্ষরিকভাবে নিঃশ্বাস বা বাষ্প বোঝায় এবং উপদেশক গ্রন্থে ক্ষণস্থায়ী, অধরা ও প্রত্যাশা-বিপরীত—এই পরস্পর-সম্পর্কিত ভাবগুলো একসঙ্গে বহন করে। ‘অসারতা’ বা ‘অর্থহীনতা’র মতো বিমূর্ত শব্দ একটি মাত্র দিককে প্রধান করে; ‘নিঃশ্বাস’ মূলের দৃশ্যকল্প ও বহুমাত্রিকতা বজায় রাখে।
- source_word: הֲבֵל הֲבָלִים
  choice: নিঃশ্বাসের নিঃশ্বাস
  rationale: মূলের গঠনটি চূড়ান্ত মাত্রা প্রকাশকারী ‘X-এর X’ রীতি। এই অনুবাদ সেই গঠন এবং নিঃশ্বাসের মূর্ত চিত্র—দুটিই সংরক্ষণ করে।
- source_word: אָמַר
  choice: বলেন
  rationale: যদিও হিব্রু ক্রিয়ার রূপটি সম্পন্ন ক্রিয়া নির্দেশ করতে পারে, সাহিত্যিক উক্তি-সূত্রে এটি বর্তমানকালের ঘোষণার মতো কাজ করে। বাংলায় ‘বলেন’ সেই জীবন্ত, চলমান ঘোষণাভঙ্গি প্রকাশ করে।
- source_word: קֹהֶלֶת
  choice: কোহেলেত
  rationale: হিব্রু উপাধি/নামটি প্রতিবর্ণীকরণ করা হয়েছে, যাতে ‘শিক্ষক’, ‘প্রচারক’ বা ‘সমাবেশকারী’—কোনো একটি ব্যাখ্যা আগেভাগে চাপিয়ে দেওয়া না হয়।
- source_word: הַכֹּל
  choice: সবই
  rationale: হিব্রু পদটির সর্বব্যাপী ও সমষ্টিগত জোর আধুনিক বাংলায় স্বাভাবিকভাবে প্রকাশ করে।
- source_word: הָבֶל
  choice: কেবল নিঃশ্বাস
  rationale: বিধেয় স্থানে ‘কেবল’ শব্দটি হিব্রুর মূল্যায়নমূলক ও প্রত্যাশা-ভঙ্গকারী অভিঘাত বাংলায় স্পষ্ট করে; নইলে ‘সবই নিঃশ্বাস’ বস্তুগত সংজ্ঞার মতো শোনাতে পারে।
theological_decisions:
- issue: উপদেশক গ্রন্থের কেন্দ্রীয় প্রতিমা הֶבֶל-এর অনুবাদ
  choice: মূর্ত প্রতিমা রেখে ‘নিঃশ্বাসের নিঃশ্বাস’ এবং বিধেয় স্থানে ‘কেবল নিঃশ্বাস’
  alternative: অসারতা; অর্থহীনতা; নিষ্ফলতা; ক্ষণস্থায়ী; অধরা; বাষ্প
  rationale: ‘অর্থহীনতা’ নৈরাশ্যবাদী সিদ্ধান্ত আরোপ করতে পারে, ‘অসারতা’ আধুনিক পাঠকের কাছে বিমূর্ত ও একমাত্রিক, আর ‘নিষ্ফলতা’ কেবল লক্ষ্যভঙ্গের ভাবকে সামনে আনে। ‘নিঃশ্বাস’ ক্ষণস্থায়িত্ব, অধরতা ও অভিজ্ঞতার বিদ্রূপাত্মক অমিল—সবগুলোকে প্রসঙ্গের মধ্যে বিকশিত হতে দেয়।
translation_notes:
  register: ভাষা আধুনিক মান্য বাংলা, তবে মূলের কাব্যিক পুনরুক্তি ও গম্ভীর ঘোষণাভঙ্গি রক্ষার জন্য বাক্যটি সামান্য উন্নত সাহিত্যিক ছন্দে রাখা হয়েছে। ড্যাশ বক্তার পরিচয়সূচক মধ্যবর্তী অংশকে আলাদা করে, আর সেমিকোলন শেষ সর্বব্যাপী রায়টির জোর বজায় রাখে।
