source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: bn
  text: আদিতে[a] বাক্য ছিলেন, আর বাক্য ঈশ্বরের সঙ্গে ছিলেন, আর বাক্য ঈশ্বর ছিলেন।[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: b
    text: অথবা, ‘বাক্য ঐশ্বরিক ছিলেন’; কিংবা, ‘ঈশ্বর যা, বাক্যও তা-ই ছিলেন।’ শেষ উপবাক্যে গ্রিক ‘ঈশ্বর’ শব্দটি আর্টিকেলবিহীন এবং ক্রিয়ার আগে রয়েছে। অনেক ব্যাখ্যায় এর গুণবাচক তাৎপর্য দেখা হয়; মূল অনুবাদে গ্রিকের সংক্ষিপ্ত ও জোরালো ভাষাই রাখা হয়েছে।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: আদিতে
  rationale: এটি সংক্ষিপ্ত ও স্বাভাবিক বাংলা এবং আদিপুস্তক ১:১-এর সূচনার প্রতিধ্বনি বজায় রাখে।
- source_word: ἦν
  choice: ছিলেন
  rationale: εἰμί ক্রিয়ার অসমাপিকা অতীত রূপটি এখানে অস্তিত্বের ধারাবাহিকতা বোঝায়। ব্যক্তিসত্তাসম্পন্ন ‘বাক্য’-এর প্রতি সম্মানসূচক বাংলা রীতি অনুসারে ‘ছিলেন’ ব্যবহৃত হয়েছে; এতে মূলের পুনরাবৃত্ত ছন্দও বজায় থাকে।
- source_word: ὁ λόγος
  choice: বাক্য
  rationale: λόγος এখানে যোহনের রচনায় বিশেষ খ্রিস্টতাত্ত্বিক উপাধি। ‘বাক্য’ বলা হলে ঈশ্বরের বলা কথা ও প্রকাশ—উভয়ের অনুরণন থাকে, কিন্তু ‘বার্তা’, ‘যুক্তি’ বা অপরিবর্তিত ‘লোগোস’-এর মতো অতিরিক্ত ব্যাখ্যা আরোপিত হয় না।
- source_word: πρὸς τὸν θεόν
  choice: ঈশ্বরের সঙ্গে
  rationale: πρός সম্পর্ক, সান্নিধ্য ও অভিমুখের ভাব বহন করতে পারে। এই প্রসঙ্গে ‘ঈশ্বরের সঙ্গে’ স্বাভাবিক বাংলায় ব্যক্তিগত সম্পর্ক ও স্বাতন্ত্র্য প্রকাশ করে; ‘ঈশ্বরের দিকে’ অতিরিক্ত আক্ষরিক, আর ‘ঈশ্বরের উপস্থিতিতে’ ব্যাখ্যামূলক বিস্তার।
- source_word: τὸν θεόν
  choice: ঈশ্বর
  rationale: নির্দিষ্ট আর্টিকেলসহ পদটি ঈশ্বরকে নির্দিষ্ট ব্যক্তিসত্তা হিসেবে নির্দেশ করে। বাংলায় ‘ঈশ্বর’ নামবাচক ব্যবহারে আলাদা নির্দেশক প্রয়োজন হয় না।
- source_word: θεὸς ἦν ὁ λόγος
  choice: বাক্য ঈশ্বর ছিলেন
  rationale: 'ক্রিয়ার আগে আর্টিকেলবিহীন θεός প্রধানত গুণবাচক: বাক্যের প্রকৃতি ঈশ্বরীয়—বরং ঈশ্বরেরই প্রকৃতি—বলে ঘোষণা করে, কিন্তু আগের অংশের ‘ঈশ্বর’-এর সঙ্গে বাক্যকে একই ব্যক্তিসত্তা বলে মিশিয়ে দেয় না। ‘বাক্য ঈশ্বর ছিলেন’ মূলের শব্দক্রম ও দৃঢ় ঘোষণাকে যথাসম্ভব স্বাভাবিক বাংলায় রাখে।'
theological_decisions:
- issue: শেষ উপবাক্যে আর্টিকেলবিহীন বিধেয় θεός-এর অনুবাদ
  choice: বাক্য ঈশ্বর ছিলেন
  alternative: বাক্য ঐশ্বরিক ছিলেন; অথবা, ঈশ্বর যা, বাক্যও তা-ই ছিলেন
  rationale: গ্রিক বাক্যগঠনে θεός এখানে গুণবাচকভাবে বাক্যের পূর্ণ ঈশ্বরত্ব ঘোষণা করে, একই সঙ্গে আগের উপবাক্যে উল্লিখিত ঈশ্বর থেকে তাঁর ব্যক্তিগত স্বাতন্ত্র্য বজায় রাখে। মূল পাঠে সরাসরি ‘ঈশ্বর’ রাখা হয়েছে; বিকল্পগুলো অর্থের গুণবাচক দিকটি স্পষ্ট করলেও ‘ঐশ্বরিক’ পূর্ণ তাৎপর্যকে দুর্বল করতে পারে এবং দ্বিতীয়টি অনুবাদের চেয়ে ব্যাখ্যা বেশি।
translation_notes:
  register: আধুনিক মান্য বাংলায় সংক্ষিপ্ত, মর্যাদাপূর্ণ ও শ্রুতিমধুর রূপ রাখা হয়েছে। ‘আর’ পুনরাবৃত্তি মূল গ্রিকের καί-নির্ভর ছন্দ সংরক্ষণ করে। ‘বাক্য’-এর জন্য ‘ছিলেন’ ব্যবহার ব্যক্তিসত্তা ও বাংলা সম্মানসূচক রীতিকে স্বাভাবিকভাবে প্রকাশ করে; মূলের ধর্মতাত্ত্বিক টানাপোড়েন ব্যাখ্যা দিয়ে মুছে ফেলা হয়নি।
