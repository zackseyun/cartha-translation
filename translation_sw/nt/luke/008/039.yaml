  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: sw
  text: “Rudi nyumbani kwako, ukasimulie yote ambayo Mungu amekutendea.” Basi akaenda zake, akitangaza katika jiji lote yote ambayo Yesu aliyomtendea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε εἰς τὸν οἶκόν σου
  choice: Rudi nyumbani kwako
  rationale: Amri ya kurudi mahali pake inaelezwa kwa Kiswahili cha kawaida; ‘nyumbani’ huwasilisha vizuri οἶκος kama mahali anapoishi bila kulazimisha maana ya jengo pekee.
- source_word: διηγοῦ
  choice: ukasimulie
  rationale: Kitenzi hiki kina maana ya kueleza au kusimulia kwa kina; ‘ukasimulie’ ni cha asili katika mfululizo wa amri baada ya ‘Rudi’.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: yote ambayo Mungu amekutendea
  rationale: ὅσα huweza kumaanisha ‘yote ambayo’ au ‘mambo ambayo.’ Tafsiri hii huepuka kuongeza kivumishi kisichotajwa wazi kama ‘makuu,’ huku ikihifadhi ukubwa wa tendo unaoeleweka kutokana na muktadha.
- source_word: ἀπῆλθεν
  choice: akaenda zake
  rationale: Huonyesha kuondoka kwake mahali pale; ‘akaenda zake’ ni simulizi la kawaida na hudumisha wazo la kuondoka.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: katika jiji lote
  rationale: Huwasilisha maana ya kutangaza kote katika eneo zima la jiji.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: Huhifadhi maana ya kutangaza hadharani bila kuifanya lazima kuwa mahubiri rasmi.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: yote ambayo Yesu alikuwa amemtendea
  rationale: Huakisi kwa karibu kifungu cha kwanza kuhusu Mungu na kutumia wakati unaofaa katika mtiririko wa simulizi.
theological_decisions:
- issue: Ulinganifu kati ya ‘Mungu’ katika amri ya Yesu na ‘Yesu’ katika tangazo la mtu huyo
  choice: Kuhifadhi maneno ‘Mungu amekutendea’ na ‘Yesu alikuwa amemtendea’ bila maelezo ya ziada
  alternative: Kusawazisha vifungu vyote viwili kwa kutumia ‘Mungu’ au ‘Yesu,’ au kuongeza ‘yaani, Yesu’
  rationale: Matini yenyewe inaweka Mungu na Yesu katika ulinganifu wa kisimulizi. Tafsiri inapaswa kuhifadhi uzito na mvutano huo wa kitheolojia bila kuufafanua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Jiji’ limetumiwa kwa πόλις; ‘mji’ pia lingewezekana, lakini ‘jiji lote’ ni wazi na la asili katika muktadha huu.
