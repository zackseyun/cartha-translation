id: LUK.8.29
reference: Luke 8:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: sw
  text: Kwa maana Yesu alikuwa ameiamuru roho mchafu imtoke mtu huyo. Kwa maana kwa muda mrefu ilikuwa imemkamata, naye alikuwa akifungwa kwa minyororo na pingu, akilindwa; na alipokuwa akivunja vifungo hivyo, alikuwa akisukumwa na pepo huyo kwenda maeneo ya ukiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda nyikani.” Kigiriki kina wingi, kihalisi “kwenda maeneo ya ukiwa” au “maeneo yasiyokaliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: alikuwa ameamuru
  rationale: Wakati uliotangulia unaonyesha kuwa amri ya Yesu ndiyo iliyotangulia jibu la pepo, huku hali ya nyuma ya simulizi ikihifadhiwa.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: roho mchafu
  rationale: Ni istilahi ya kawaida na ya moja kwa moja ya Agano Jipya, na huhifadhi wazo la uchafu lililomo katika ἀκάθαρτος.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: amtoke mtu huyo
  rationale: Ni Kiswahili cha kawaida kinachoeleza kuondoka kwa roho kutoka ndani ya mtu bila kupoteza maana ya ἀπό.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: mara nyingi
  rationale: Wingi wa χρόνοις pamoja na muktadha wa kufungwa mara kwa mara unaunga mkono matukio yaliyorudiwa, ingawa maana ya muda mrefu pia inawezekana.
- source_word: συνηρπάκει
  choice: ilikuwa imemkamata
  rationale: Huwasilisha tendo la ghafla na lenye nguvu la kumshika na kumtawala.
- source_word: ἐδεσμεύετο
  choice: alikuwa akifungwa
  rationale: Huhifadhi hali ya kurudiwa au kuzoeleka inayodokezwa na wakati usiotimilika, bila kuongeza wazi mtendaji ambaye hajatajwa.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: kwa minyororo na pingu
  rationale: Hutofautisha minyororo ya kawaida na vizuizi vya mikono au miguu kwa lugha inayoeleweka kwa wasomaji wa sasa.
- source_word: φυλασσόμενος
  choice: na kulindwa
  rationale: Hueleza mazingira ya kufungwa kwake kwa mtindo mfupi na wa kawaida.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: lakini alikuwa akikata vifungo hivyo
  rationale: ‘Vifungo’ ni pana kuliko ‘minyororo’ na huepuka marudio; ‘lakini’ huonyesha utofauti unaoeleweka katika muktadha bila kubadili hoja.
- source_word: ἠλαύνετο
  choice: akamsukuma kwenda
  rationale: Huwasilisha mwendo wa kulazimishwa na unaorudiwa, si kwenda kwa hiari.
- source_word: ὑπὸ τοῦ δαιμονίου
  choice: pepo huyo
  rationale: ‘Pepo’ ni istilahi ya kawaida ya kibiblia ya Kiswahili kwa kiumbe cha kiroho cha kishetani; kiwakilishi huonyesha kuwa ndiye anayemtawala.
- source_word: εἰς τὰς ἐρήμους
  choice: mahali pasipokaliwa
  rationale: Huhifadhi wingi na maana ya maeneo yaliyoachwa au yasiyokaliwa bila kuyafanya lazima kuwa jangwa la kijiografia.
theological_decisions:
- issue: Istilahi za nguvu za kishetani
  choice: Kutafsiri ἀκάθαρτον πνεῦμα kuwa ‘roho mchafu’ na δαιμόνιον kuwa ‘pepo’
  alternative: ‘roho mbaya’ au maelezo ya hali ya kisaikolojia
  rationale: Simulizi linawasilisha utendaji wa kiumbe cha kiroho binafsi; tafsiri ya moja kwa moja huhifadhi madai ya maandishi bila kuyapunguza kuwa mfano au ugonjwa pekee.
- issue: Uhusiano kati ya kuvunja vifungo na kusukumwa na pepo
  choice: Kutumia ‘lakini ... kisha’ ili kutoa mfuatano wa kawaida wa Kiswahili
  alternative: Kuunganisha kwa ‘na’ pekee
  rationale: Kigiriki kina καί na kishirikishi, ambavyo vinaweza kuonyesha mfuatano na utofauti wa kimuktadha; Kiswahili kinahitaji muunganisho ulio wazi zaidi, lakini tafsiri haidai kwamba kuvunja vifungo ndiko kulikosababisha kusukumwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umelegezwa kiasi ili kuepuka sentensi nzito, huku marudio ya ‘Kwa maana’ yakihifadhi kazi ya γάρ. Alama ya tanbihi [a] imewekwa mara moja katika matini.
