revisions:
- from: Kwa maana Yesu alikuwa ameamuru roho mchafu amtoke mtu huyo. Kwa maana ilikuwa imemkamata mara nyingi; naye alikuwa akifungwa kwa minyororo na pingu na kulindwa, lakini alikuwa akikata vifungo hivyo, kisha pepo huyo akamsukuma kwenda mahali pasipokaliwa.[a]
  to: Kwa maana Yesu alikuwa ameiamuru roho mchafu imtoke mtu huyo. Kwa maana kwa muda mrefu ilikuwa imemkamata, naye alikuwa akifungwa kwa minyororo na pingu, akilindwa; na alipokuwa akivunja vifungo hivyo, alikuwa akisukumwa na pepo huyo kwenda maeneo ya ukiwa.[a]
  rationale: Tafsiri imerekebishwa kwa kuipa πολλοῖς χρόνοις maana yake ya msingi ya muda mrefu, kubadili muundo wa mwisho kuwa kauli ya kutendwa yenye hali ya kuendelea, na kuondoa “lakini” na “kisha,” ambazo huongeza mahusiano yasiyoelezwa na Kigiriki. Tanbihi imesahihishwa ili ilingane na wingi wa matini iliyotafsiriwa.
