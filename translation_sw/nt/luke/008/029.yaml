review_pass:
  verdict: revise
  source_fidelity: Marekebisho yanahitajika ili kuwakilisha kwa usahihi πολλοῖς χρόνοις kama muda ulioendelea (“kwa muda mrefu”), si idadi ya matukio (“mara nyingi”), na ili kuhifadhi hali ya kurudiwa/kuendelea ya vitenzi visiotimilika katika sehemu ya mwisho. Kiunganishi καί hakihitaji “lakini” wala “kisha.”
  naturalness: Matini iliyorekebishwa ni Kiswahili Sanifu cha kisimulizi na hutenganisha kwa uwazi tendo la Yesu, historia ya mtu huyo, na msukumo wa pepo. “Maeneo ya ukiwa” ni ya asili na huhifadhi wingi wa τὰς ἐρήμους.
  terminology: “Roho mchafu” na “pepo” ni istilahi za kawaida za kibiblia na zinahifadhi tofauti ya maneno ya Kigiriki bila kupunguza madai ya simulizi. “Minyororo na pingu” na “vifungo” hutofautisha vizuizi mahususi na neno pana δεσμά.
  issues:
  - severity: high
    issue: “mara nyingi” kwa πολλοῖς χρόνοις
    rationale: Usemi huu wa dative ya χρόνοις kwa kawaida hueleza muda (“kwa muda mrefu”). Ingawa mazingira yanaweza kudokeza hali za kurudiwa, “mara nyingi” hubadilisha msisitizo wa msingi wa usemi na haupaswi kuchaguliwa bila tanbihi ya kutosha.
  - severity: medium
    issue: “lakini ... kisha” huongeza uhusiano wa upinzani na mfuatano
    rationale: Kigiriki kina καί pamoja na kishirikishi διαρρήσσων; hakisemi “lakini” wala “kisha.” Muungano wa kawaida “na” huhifadhi uhusiano usiofafanuliwa zaidi.
  - severity: medium
    issue: “akamsukuma” haionyeshi vizuri ἠλαύνετο
    rationale: 'ἠλαύνετο ni kauli ya kutendwa, wakati usiotimilika: mtu huyo alikuwa akisukumwa/akiendeshwa kwa kulazimishwa na pepo. “Akamsukuma” hufanya tendo la mara moja na kubadili mtazamo wa kisarufi.'
  - severity: low
    issue: “mahali pasipokaliwa” ni umoja huku τὰς ἐρήμους ni wingi
    rationale: “Maeneo ya ukiwa” huhifadhi wingi na maana ya maeneo yasiyokaliwa, bila kulazimisha jiografia ya jangwa.
