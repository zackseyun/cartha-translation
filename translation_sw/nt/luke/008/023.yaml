base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: sw
  text: Walipokuwa wakisafiri kwa mashua, yeye akalala. Dhoruba kali ya upepo ikashuka juu ya ziwa, mashua ikawa inajaa maji[a], nao walikuwa hatarini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wao walikuwa wakijaa maji.” Kigiriki hutumia umbo la wingi; huenda maana inayokusudiwa ni kwamba mashua ilikuwa ikijaa maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Walipokuwa wakisafiri kwa mashua
  rationale: Kirai huru cha hali ya umilikishi chenye kitenzi-umbo cha wakati uliopo kinaonyesha tendo lililokuwa likiendelea wakati huo. Kutaja mashua kunafanya maana ya kusafiri majini iwe wazi na ya kawaida kwa Kiswahili.
- source_word: ἀφύπνωσεν
  choice: yeye akalala
  rationale: Kitenzi cha wakati uliopita kinaweza kuwa na maana ya kuanza kulala. “Akalala” ni usemi wa kawaida unaowasilisha kuingia usingizini; kiwakilishi “yeye” kinaendeleza msisitizo wa mhusika anayejulikana katika muktadha.
- source_word: κατέβη
  choice: ikashuka
  rationale: Huhifadhi taswira halisi ya dhoruba kushuka kuelekea ziwani na inafaa kwa upepo unaoshuka kutoka maeneo ya juu.
- source_word: λαῖλαψ ἀνέμου
  choice: Dhoruba kali ya upepo
  rationale: λαῖλαψ huonyesha tufani au dhoruba yenye nguvu, na ἀνέμου hubainisha upepo. “Dhoruba kali ya upepo” huhifadhi ukali na kipengele cha upepo.
- source_word: εἰς τὴν λίμνην
  choice: juu ya ziwa
  rationale: Ingawa εἰς kwa kawaida ni “ndani ya/kuelekea,” pamoja na kitenzi cha kushuka na tukio la hali ya hewa, “juu ya ziwa” ni Kiswahili cha kawaida kinachohifadhi eneo la tukio.
- source_word: συνεπληροῦντο
  choice: mashua ikaanza kujaa maji
  rationale: Umbo la wingi katika Kigiriki linaweza kueleweka kuwa watu walikuwa wakijaa maji au, kwa maana iliyodokezwa, mashua yao ilikuwa ikijaa. Kiswahili kinahitaji mhusika ulio wazi; “mashua ikaanza kujaa maji” huwasilisha tukio linalokusudiwa kwa kawaida bila kutumia usemi usio wa asili.
- source_word: ἐκινδύνευον
  choice: wakawa hatarini
  rationale: Huwasilisha wazi hali yao ya kuendelea kukabili hatari kwa Kiswahili cha sasa na kinachoeleweka.
theological_decisions: []
translation_notes:
