base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: sw
  text: na Yoana, mke wa Kuza, msimamizi wa mali za Herode, na Susana, na wanawake wengine wengi, waliokuwa wakiwahudumia[a] kwa mali zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “walimhudumia” badala ya “waliwahudumia.”
    reason: textual_variant
  - marker: b
    text: Au “kwa walivyokuwa navyo” au “kwa rasilimali zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: mke wa
  rationale: Katika kirai kinachomtambulisha Yoana na kufuatiwa na jina la Kuza katika hali ya umilikaji, neno hili kwa kawaida humaanisha ‘mke wa.’
- source_word: ἐπιτρόπου
  choice: msimamizi wa mali za
  rationale: Neno hili humaanisha mtu aliyewekwa kusimamia shughuli au mali za mwingine. ‘Msimamizi wa mali za Herode’ ni wazi na linafaa katika mazingira ya jumba au milki ya Herode.
- source_word: ἕτεραι πολλαί
  choice: wanawake wengine wengi
  rationale: Umbo la kike la wingi linawarejelea wanawake waliotajwa; kulitaja wazi neno ‘wanawake’ huleta maana ya asili kwa uwazi katika Kiswahili.
- source_word: διηκόνουν
  choice: waliokuwa wakiwahudumia
  rationale: Huhifadhi maana pana ya kutoa huduma bila kuingiza maana maalumu ya cheo cha kidini; kirai kinachofuata kinaonyesha kwamba mali zao zilitumika katika huduma hiyo.
- source_word: αὐτοῖς
  choice: wakiwahudumia
  rationale: Kiambishi cha wingi ‘-wa-’ kinafuata matini iliyotolewa yenye αὐτοῖς, ikirejelea Yesu pamoja na wale waliokuwa naye.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: kwa mali zao
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kutumia mali au rasilimali zilizokuwa zao wenyewe. Tanbihi huhifadhi uwezekano mpana wa ‘walivyokuwa navyo’ au ‘rasilimali zao.’
theological_decisions:
- issue: Mrejelewa wa αὐτοῖς
  choice: 'wingi: wanawake waliwahudumia Yesu na wale waliokuwa pamoja naye'
  alternative: 'umoja: wanawake walimhudumia Yesu'
  rationale: Matini ya SBLGNT iliyotolewa ina kiwakilishi cha wingi αὐτοῖς. Tafsiri inafuata usomaji huo, huku tanbihi ikitaja usomaji wa umoja katika baadhi ya hati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuza’ na ‘Susana’ ni maumbo yanayosomeka kwa urahisi; ‘Herode’ linafuata matumizi yaliyozoeleka katika Kiswahili cha Biblia. Muundo umeweka wazi kwamba ‘wengine wengi’ ni wanawake.
