  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: sw
  text: Kwa maana hakuna jambo lililofichika ambalo halitadhihirika[a], wala hakuna siri ambayo haitajulikana[b] na kufunuliwa wazi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “halitakuwa wazi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa hakika itajulikana”; muundo wa Kigiriki unasisitiza kwamba hakuna siri itakayobaki bila kujulikana.
    reason: lexical_alternative
  - marker: c
    text: Au, “kujitokeza hadharani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: jambo lililofichika
  rationale: Neno hili huonyesha kitu kilichofichwa au kisichoonekana. “Lililofichika” ni Kiswahili cha kawaida na linadumisha utofauti mdogo na ἀπόκρυφον katika sehemu ya pili.
- source_word: φανερὸν γενήσεται
  choice: halitakuwa dhahiri
  rationale: 'Muundo huu unaonyesha badiliko la hali: jambo lililofichika litafikia hali ya kuwa wazi au dhahiri. Muundo wa sentensi wenye “hakuna ... ambalo halita-” unahifadhi kauli ya jumla ya Kigiriki.'
- source_word: ἀπόκρυφον
  choice: jambo lililositirika
  rationale: “Lililositirika” humaanisha jambo lililofichwa lisijulikane na kwa kiasi fulani hutofautiana na “lililofichika,” huku ulinganifu wa vifungu viwili ukibaki.
- source_word: οὐ μὴ γνωσθῇ
  choice: halitajulikana
  rationale: Katika sentensi nzima, ukanushi huu ndani ya kishazi tegemezi unasisitiza kwamba hakuna jambo la siri litakalobaki bila kujulikana. Kiswahili hiki ni cha kawaida, na tanbihi inaeleza nguvu ya muundo wa Kigiriki.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: kuwekwa wazi
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza jambo kufunuliwa au kujitokeza wazi, bila kulazimisha nahau ya Kigiriki neno kwa neno.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unatoa sababu au ufafanuzi wa kauli iliyotangulia.
theological_decisions:
- issue: Upeo wa kauli kuhusu kufunuliwa
  choice: Kauli ya jumla kwamba yaliyofichika au kusitirika yatafunuliwa hatimaye
  alternative: Kuieleza mahsusi kuwa inahusu hukumu ya mwisho, au kuifunga tu na kufunuliwa kwa mafundisho ya Yesu katika mazingira ya karibu
  rationale: Mstari wenyewe hautaji wakati wala tukio maalumu. Tafsiri inadumisha upana huo na haiamui kimya-kimya kati ya matumizi ya sasa, ya kimuktadha, au ya mwisho wa nyakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vifungu viwili umehifadhiwa, pamoja na tofauti ndogo kati ya “lililofichika” na “lililositirika.”
