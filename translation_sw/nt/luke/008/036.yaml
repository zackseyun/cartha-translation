  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: sw
  text: Nao wale walioona waliwaeleza jinsi yule aliyekuwa amepagawa na pepo alivyookolewa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyoponywa” au “alivyowekwa huru.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kuponya, au kuweka huru, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: waliwaeleza
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kusimulia. “Waliwaeleza” ni Kiswahili cha kawaida kinachofaa kwa simulizi la mashahidi na kinaonyesha wazi waliopokea taarifa hiyo.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani. “Nao” huunganisha sentensi kwa mtiririko wa kawaida wa Kiswahili.
- source_word: αὐτοῖς
  choice: -wa- katika “waliwaeleza”
  rationale: Kiwakilishi cha yambwa ndani ya kitenzi kinaonyesha kwa kawaida na kwa uwazi kwamba taarifa ilitolewa kwao.
- source_word: οἱ ἰδόντες
  choice: wale walioona
  rationale: Inawakilisha moja kwa moja kishiriki chenye kibainishi kinachowataja watu walioshuhudia yaliyotokea, bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: πῶς
  choice: jinsi
  rationale: “Jinsi” linaweza kuonyesha namna au tukio lenyewe lilivyotokea, na hivyo linahifadhi upana wa πῶς katika muktadha huu.
- source_word: ἐσώθη
  choice: alivyookolewa
  rationale: σῴζω inaweza kumaanisha kuokoa, kuponya, au kukomboa. “Aliokolewa” huhifadhi maana pana ya kuondolewa katika hatari au hali mbaya, huku tanbihi ikitaja maana nyingine zinazowezekana katika muktadha huu.
- source_word: ὁ δαιμονισθείς
  choice: yule aliyekuwa amepagawa na pepo
  rationale: Kauli hii ya kawaida na yenye heshima inaonyesha kwamba mtu huyo alikuwa chini ya nguvu za pepo. “Aliyekuwa amepagawa” pia huonyesha kuwa hiyo ilikuwa hali yake ya awali, si hali yake baada ya tukio.
theological_decisions:
- issue: Maana ya ἐσώθη (σῴζω) katika muktadha wa kufukuzwa kwa pepo na kurejeshwa kwa mtu
  choice: alivyookolewa
  alternative: alivyoponywa; alivyowekwa huru
  rationale: Kitenzi cha Kigiriki kinaweza kurejelea kuokolewa, kuponywa, au kukombolewa. Matini kuu inatumia “alivyookolewa” ili kuhifadhi upana wa neno hilo bila kulifanya lihusu wokovu wa kiroho pekee; tanbihi inadumisha uwezekano wa uponyaji au kuwekwa huru unaofaa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi; “pepo” limetumiwa kwa maana ya roho waovu kulingana na muktadha. Tanbihi inalinda upana wa maana ya σῴζω.
