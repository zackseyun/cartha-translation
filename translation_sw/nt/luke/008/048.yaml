base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: sw
  text: Lakini akamwambia, “Binti, imani yako imekuokoa[a]; nenda kwa amani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imekuponya” au “imefanya uwe mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuponya na pia kuokoa.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Binti
  rationale: Neno la mwito limehifadhiwa kwa namna ya asili na yenye upole; linaonyesha ukaribu na huruma bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: πίστις
  choice: imani
  rationale: Hili ndilo neno la kawaida na lenye uzito wa kiteolojia katika Kiswahili; katika muktadha huu linamaanisha kumwamini Yesu.
- source_word: σέσωκέν
  choice: imekuokoa
  rationale: Huhifadhi maana pana ya kitenzi σῴζω, ambacho kinaweza kumaanisha kuokoa na pia kuponya. Muktadha wa kuponywa umeelezwa katika tanbihi bila kuifupisha maana ya matini kuu.
- source_word: πορεύου
  choice: nenda
  rationale: Ni amri fupi, ya kawaida, na ya moja kwa moja katika Kiswahili cha sasa.
- source_word: εἰς εἰρήνην
  choice: kwa amani
  rationale: Ni msemo wa asili wa Kiswahili unaoeleza kuondoka ukiwa katika hali na baraka ya amani.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mpito wenye utofauti mdogo kati ya hofu ya mwanamke na jibu la Yesu lenye kumhakikishia.
theological_decisions:
- issue: Upana wa maana ya σῴζω katika muktadha wa uponyaji
  choice: imekuokoa
  alternative: imekuponya; imefanya uwe mzima
  rationale: Tukio linahusu uponyaji wa mwili, lakini kitenzi cha Kigiriki kina maana pana zaidi ya kupona kimwili pekee. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikibainisha maana inayotokana wazi na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupoteza uradidi na uzito wa matini ya Kigiriki.
