lexical_decisions:
- source_word: καὶ ἰδού
  choice: Tazama
  rationale: Hudumisha ishara ya kisimulizi inayovuta usikivu, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: mkuu wa sinagogi
  rationale: Huonyesha nafasi yake ya uongozi katika sinagogi bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: Akaanguka miguuni pa Yesu
  rationale: Hufuata picha halisi ya tendo la kuanguka karibu na miguu ya Yesu na ni usemi wa asili katika Kiswahili.
- source_word: παρεκάλει
  choice: kumsihi
  rationale: Huwasilisha ombi lake la dhati na la kuendelea bila kulifanya kuwa amri.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: aingie nyumbani kwake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ombi la Yesu kuingia katika nyumba yake.
