  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: sw
  text: Mwanamke huyo alipoona kwamba hakuwa amepita bila kutambuliwa[a], alikuja huku akitetemeka, akaanguka mbele yake[b], na akaeleza mbele ya watu wote sababu iliyomfanya amguse na jinsi alivyoponywa mara moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo alilofanya halikuwa limebaki siri” au “hakupita bila kutambuliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaanguka miguuni pake.” Kigiriki kinasema “akaanguka mbele yake” bila kutaja miguu waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: alipoona
  rationale: Kishiriki cha aoristi kinaweka mazingira ya kitendo kikuu; “alipoona” ni Kiswahili cha kawaida chenye maana ya wakati.
- source_word: οὐκ ἔλαθεν
  choice: hakuwa amebaki bila kutambuliwa
  rationale: Kauli hii inaonyesha kwamba jambo lake halikupita bila kugunduliwa; tafsiri hii inadumisha maana hiyo bila kumtaja moja kwa moja aliyelitambua.
- source_word: τρέμουσα
  choice: huku akitetemeka
  rationale: Inahifadhi hali ya kimwili na kihisia iliyoelezwa na kishiriki bila kuifasiri kuwa hofu peke yake.
- source_word: προσπεσοῦσα αὐτῷ
  choice: akaanguka mbele yake
  rationale: Inafuata moja kwa moja wazo la kuanguka mbele ya mtu, bila kuongeza “miguuni” ambayo haikutajwa wazi katika Kigiriki.
- source_word: δι’ ἣν αἰτίαν
  choice: sababu ya
  rationale: Ni usemi wa asili unaowasilisha sababu iliyomfanya amguse.
- source_word: ἥψατο αὐτοῦ
  choice: kumgusa
  rationale: Kitenzi ἅπτομαι pamoja na umilikaji hapa humaanisha kugusa.
- source_word: ἀπήγγειλεν
  choice: kueleza
  rationale: Katika mazingira haya kitenzi humaanisha kutoa taarifa hadharani; “kueleza” ni cha asili na hakiongezi uzito usio lazima.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: mbele ya watu wote
  rationale: Inawasilisha kwa uwazi maana ya kuwa katika uwepo wa watu wote waliokusanyika.
- source_word: ὡς ἰάθη
  choice: jinsi alivyoponywa
  rationale: “Jinsi” huhifadhi ὡς na kuanzisha maelezo ya kuponywa kwake bila kulazimisha tofauti kati ya namna na ukweli wa uponyaji.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha kwamba uponyaji ulitokea papo hapo.
theological_decisions:
- issue: Asili ya maelezo ya hadharani ya mwanamke
  choice: 'Kutafsiri kwa maelezo ya kisimulizi tu: alitetemeka, akaanguka mbele yake, na kueleza kilichotokea.'
  alternative: Kutaja wazi kwamba alitubu au alimwabudu Yesu.
  rationale: Kigiriki hakisemi wazi kwamba alitubu au aliabudu. Mkao wake unaweza kuonyesha unyenyekevu, heshima, au kusihi, lakini tafsiri haipaswi kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, na alama zote za tanbihi zimewekwa katika matini kuu.
