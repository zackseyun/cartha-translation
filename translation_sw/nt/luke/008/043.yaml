base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: sw
  text: Na mwanamke mmoja aliyekuwa akivuja damu kwa miaka kumi na miwili[a], ambaye alikuwa ametumia mali yake yote kwa matabibu[b][c], hakuweza kuponywa na yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, alikuwa na mtiririko wa damu kwa miaka kumi na miwili.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki βίος hapa lina maana ya mali au rasilimali zake za kujikimu, si uhai wake wa kibayolojia.
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati za kale huacha maneno kwamba alikuwa ametumia mali yake yote kwa matabibu.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: Kulikuwa na mwanamke ambaye alikuwa
  rationale: Muundo wa kishiriki umetolewa kwa sentensi ya usuli iliyo ya kawaida katika masimulizi ya Kiswahili.
- source_word: ἐν ῥύσει αἵματος
  choice: ametokwa damu
  rationale: Hii ni namna ya kawaida na yenye heshima ya kueleza hali ya kuendelea kuvuja damu bila kuongeza utambuzi wa kitabibu usiotajwa.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: kwa miaka kumi na miwili
  rationale: Kirai hiki kinaonyesha muda ambao hali hiyo iliendelea.
- source_word: ἰατροῖς
  choice: kwa waganga
  rationale: Katika Kiswahili sanifu, 'waganga' linaweza kumaanisha watabibu; tanbihi inazuia dhana ya waganga wa jadi au wachawi.
- source_word: προσαναλώσασα
  choice: alikuwa ametumia
  rationale: Wakati timilifu unaonyesha matumizi yaliyotangulia kutoweza kuponywa.
- source_word: ὅλον τὸν βίον
  choice: mali yake yote
  rationale: βίος hapa ni riziki au rasilimali za maisha, si uhai wake wa kibayolojia.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: hakuna mtu aliyeweza kumponya
  rationale: Tafsiri hii ya kawaida huhifadhi hali ya kutoweza kuponywa na kauli ya kutendwa kwa kumtaja mtendaji asiyeweza kupatikana.
theological_decisions:
- issue: Je, kushindwa kwa matabibu kunapaswa kusisitizwa zaidi ya maneno ya Kigiriki?
  choice: lakini hakuna mtu aliyeweza kumponya
  alternative: lakini waganga hawakuweza kumponya
  rationale: Chanzo kinasema hakuweza kuponywa na yeyote; hakimtaji moja kwa moja kila tabibu kuwa ndiye aliyeshindwa, hivyo tafsiri haiongezi lawama.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa ili zisomeke kwa urahisi, huku uhusiano wa kimantiki wa chanzo ukihifadhiwa. 'Ametokwa damu' ni usemi wa kawaida usio mkali kupita kiasi; 'mali yake yote' inaeleza maana ya βίος kwa uwazi.
