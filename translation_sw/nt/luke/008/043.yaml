  source_fidelity: Rasimu inaakisi kwa ujumla hali ya kuvuja damu kwa miaka kumi na miwili, matumizi ya rasilimali zake kwa matabibu, na kutoweza kuponywa na yeyote. Hata hivyo, “lakini” huongeza kiunganishi cha ukinzani ambacho hakipo wazi katika Kigiriki, na “ametokwa damu” inaweza kusikika kama tukio lililotimia badala ya hali ya muda mrefu.
  naturalness: “Waganga” linaweza kueleweka kuwa watabibu, lakini katika Kiswahili sanifu cha sasa lina utata usio wa lazima. “Matabibu” ni wazi na wa kawaida zaidi katika muktadha huu. Muundo mmoja wa sentensi pia unafuata uhusiano wa vishazi vya chanzo bila kupoteza usomaji wa kawaida.
  terminology: “Matabibu” hutoa ἰατροῖς kwa usahihi bila kuhitaji kufafanua kwamba si wachawi. “Mali yake yote” hufaa kwa βίος katika muktadha huu, yaani rasilimali/maisha yake ya kujikimu, si uhai wa kibayolojia.
