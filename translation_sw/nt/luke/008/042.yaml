  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: sw
  text: kwa sababu alikuwa na binti yake wa pekee[a], mwenye umri wa karibu miaka kumi na miwili[b], naye alikuwa akifa. Alipokuwa akienda, makundi ya watu yalikuwa yakimsonga sana[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “binti yake mmoja tu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “karibu miaka kumi na miwili.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kigiriki kinaweza kudokeza kwamba watu walimsonga kwa kubanana sana, karibu wamponde.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: binti yake wa pekee
  rationale: Katika muundo huu neno linaonyesha kwamba huyo alikuwa binti wake pekee, si wazo maalumu kuhusu namna ya kuzaliwa kwake.
- source_word: ὡς ἐτῶν δώδεκα
  choice: mwenye umri wa karibu miaka kumi na miwili
  rationale: ὡς pamoja na idadi huonyesha makadirio; “karibu” linahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἀπέθνῃσκεν
  choice: alikuwa akifa
  rationale: Kauli ya wakati usiotimilika inaonyesha hali ya kufa iliyokuwa ikiendelea, wala si kwamba tayari alikuwa amekufa.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Alipokuwa akienda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uleule; tafsiri haiongezi mahali alipokuwa akienda, ingawa muktadha unaonyesha alikuwa njiani kwenda nyumbani kwa Yairo.
- source_word: οἱ ὄχλοι
  choice: makundi ya watu
  rationale: Huhifadhi wingi wa nomino ya Kigiriki kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: συνέπνιγον
  choice: yalikuwa yakimsonga sana
  rationale: Kitenzi kinaonyesha watu waliobanana na kumsonga kwa nguvu; “sana” huwasilisha uzito huo bila kudai moja kwa moja kwamba walikuwa wakimponda.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi kuwa hali ya binti ndiyo sababu ya ombi la haraka lililotajwa katika mstari uliotangulia.
- source_word: αὐτῷ
  choice: alikuwa na
  rationale: Dativi pamoja na ἦν ni usemi wa umilikaji, unaotafsiriwa kwa kawaida katika Kiswahili kwa “alikuwa na.”
theological_decisions: []
