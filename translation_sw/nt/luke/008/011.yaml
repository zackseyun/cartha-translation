  text: 'Na huu ndio mfano: Mbegu ni neno la Mungu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ndiyo maana ya mfano.” Kigiriki kinasema kwa karibu zaidi, “Huu ndio mfano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ni
  rationale: Kitenzi kishirikishi kinatafsiriwa moja kwa moja kuwa “ni,” bila kuongeza wazo la “maana” ambalo halikutajwa wazi katika Kigiriki.
- source_word: δὲ
  choice: Basi
  rationale: Neno hili linaonyesha mpito wa upole kutoka kwenye mfano kwenda kwenye maelezo yake; “Basi” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: αὕτη ἡ παραβολή
  choice: mfano huo ni huu
  rationale: Muundo huu unahifadhi usemi wa Kigiriki kwamba mfano “ni huu,” huku “huo” ukirejelea mfano uliotangulia na “huu” ukitambulisha maelezo yanayofuata.
- source_word: ὁ σπόρος
  choice: mbegu
  rationale: “Mbegu” ni tafsiri ya moja kwa moja na inaweza kutumiwa kwa maana ya kijumla, kama nomino ya umoja ya Kigiriki.
- source_word: ὁ λόγος
  choice: neno
  rationale: “Neno” linahifadhi maana ya ujumbe uliotolewa na Mungu pamoja na mwangwi wa kawaida wa kibiblia, bila kulipanua kuwa “ujumbe.”
- source_word: τοῦ θεοῦ
  choice: la Mungu
  rationale: Muundo wa umilikaji “la Mungu” unawakilisha kwa ukaribu hali ya genitivi ya Kigiriki bila kuifafanua kiuteuzi kuwa “kutoka kwa Mungu.”
theological_decisions:
- issue: Iwapo παραβολή ifafanuliwe kuwa “maana ya mfano”
  choice: mfano huo ni huu
  alternative: maana ya mfano huo ni hii
  rationale: Ingawa muktadha unaonyesha kwamba Yesu anaeleza maana ya mfano, Kigiriki kinasema moja kwa moja kwamba “mfano ... ni huu.” Tafsiri inahifadhi mvutano huo badala ya kuingiza nomino “maana” katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Usemi “mfano huo ni huu” umechaguliwa makusudi ili kuhifadhi muundo wa chanzo, ingawa “maana ya mfano huo ni hii” ungekuwa wazi zaidi kimuktadha.
