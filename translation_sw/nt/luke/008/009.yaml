lexical_decisions:
- source_word: Ἐπηρώτων
  choice: wakamwuliza
  rationale: Kitenzi cha wakati usiotimilika kinaweza kuonyesha tendo lililoendelea au lililorudiwa, lakini katika simulizi hili umbo la Kiswahili “wakamwuliza” linaendeleza mfululizo wa matukio kwa ufasaha bila kubadili maana ya msingi.
- source_word: δὲ
  choice: Kisha
  rationale: Ni kiunganishi hafifu cha simulizi; “Kisha” kinaonyesha mwendelezo wa tukio bila kulazimisha maana ya upinzani.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hili ndilo tamko la kawaida na la asili la Kiswahili kwa wafuasi wanaojifunza chini ya Yesu.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: mfano huo ulikuwa na maana gani
  rationale: Ingawa muundo wa Kigiriki unasema kwa karibu zaidi “mfano huu ungekuwa nini,” muktadha unaonyesha kuwa wanafunzi waliuliza kuhusu maana yake; tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi umbo la karibu zaidi na Kigiriki.
- source_word: παραβολή
  choice: mfano
  rationale: “Mfano” ni neno la kawaida la kibiblia na la Kiswahili kwa simulizi au ulinganisho unaofundisha jambo.
- source_word: εἴη
  choice: ulikuwa na maana
  rationale: Hali ya optative katika swali lisilo la moja kwa moja baada ya kitenzi cha wakati uliopita inaelezwa kwa Kiswahili cha kawaida kama swali kuhusu maana ya mfano.
