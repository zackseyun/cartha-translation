translation:
  language: sw
  text: Kisha wanafunzi wake wakamwuliza mfano huu ulikuwa na maana gani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “mfano huu ungekuwa nini.”
