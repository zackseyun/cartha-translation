base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: sw
  text: Basi zingatieni jinsi mnavyosikiliza. Kwa maana yeyote aliye na kitu atapewa zaidi; na yeyote asiye na kitu, hata kile anachodhani kuwa anacho[a] kitaondolewa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata kile ambacho anaonekana kuwa nacho kitaondolewa kwake.”
    reason: 'Mbadala wa kileksika: δοκέω inaweza kumaanisha “kudhani” au “kuonekana.”'
lexical_decisions:
- source_word: βλέπετε
  choice: zingatieni
  rationale: Amri hii inataka wasikilizaji wawe makini, si waone kwa macho tu. “Zingatieni” ni ya kawaida, yenye heshima, na inaleta uzito wa onyo.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha agizo na mafundisho yaliyotangulia kuhusu kusikia na kuitikia. “Basi” linaonyesha hitimisho hilo kwa Kiswahili cha kawaida.
- source_word: πῶς ἀκούετε
  choice: jinsi mnavyosikiliza
  rationale: πῶς inahusu namna, na “kusikiliza” linaonyesha usikivu wa makusudi kuliko kusikia sauti tu.
- source_word: ὃς ἂν ... ἔχῃ
  choice: yeyote aliye na kitu
  rationale: Muundo wenye ἄν na hali tegemezi unaeleza sharti la jumla lisilomhusu mtu mmoja maalumu. “Kitu” kinawekwa ili sentensi ya Kiswahili ikamilike bila kufafanua kitu hicho ni nini.
- source_word: δοθήσεται αὐτῷ
  choice: atapewa zaidi
  rationale: Kiyunani hakitaji kitu kinachotolewa, lakini mlingano wa msemo unaashiria ongezeko. “Zaidi” huifanya kauli ieleweke kwa Kiswahili bila kuamua ni nini kinachoongezwa.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: yeyote asiye na kitu
  rationale: Huhifadhi hali ya jumla na upinzani uliopo kati ya mwenye kitu na asiye na kitu.
- source_word: ὃ δοκεῖ ἔχειν
  choice: kile anachodhani kuwa anacho
  rationale: δοκέω inaweza kumaanisha “kudhani” au “kuonekana.” Matini kuu inatumia “kudhani” kwa uwazi wa Kiswahili, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: kitaondolewa kwake
  rationale: Hali ya kutendwa ya αἴρω hapa inaonyesha kunyang’anywa au kuondolewa kwa kitu alicho nacho.
- source_word: αὐτῷ / αὐτοῦ
  choice: atapewa / kwake
  rationale: Kiswahili hakilazimiki kuonyesha jinsia katika viwakilishi hivi; umoja wa mtu wa jumla umehifadhiwa kwa miundo ya umoja.
theological_decisions:
- issue: Maana ya msemo kuhusu kuwa na kitu au kutokuwa nacho
  choice: Msemo umeachwa katika muktadha wake wa jinsi mtu anavyosikiliza na kupokea neno la Yesu, bila kutaja wazi kitu kinachomilikiwa.
  alternative: Kuufafanua kuwa fundisho mahususi kuhusu majaaliwa, kustahili, mali, au uwakili.
  rationale: Aya yenyewe inatoa kanuni yenye mvutano inayohusiana na kusikiliza. Tafsiri haipaswi kuibana ndani ya mfumo fulani wa kiteolojia au kuifanya ihusu mali bila ushahidi wa moja kwa moja katika matini.
- issue: Utata wa δοκεῖ ἔχειν
  choice: 'Matini kuu: “anachodhani kuwa anacho.”'
  alternative: “Anachoonekana kuwa nacho.”
  rationale: Kitenzi δοκέω kinakubali maana zote mbili. Matini kuu inatoa usemi ulio wazi zaidi kwa wasomaji wa sasa, na tanbihi inalinda maana mbadala ya kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Wingi katika “zingatieni” na “mnavyosikiliza” unafuata amri ya Kiyunani iliyo katika wingi, huku msemo unaofuata ukibaki katika umoja wa jumla.
