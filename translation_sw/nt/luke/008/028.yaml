  naturalness: Kiswahili cha simulizi ni fasaha kwa jumla. Hata hivyo, “Una shughuli gani nami?” ni usemi unaowezekana lakini una ladha ya kisasa na unaweza kueleweka kama swali kuhusu kazi au shughuli. “Una nini nami?” ni nahau fupi, ya kawaida, na inayobeba kwa karibu zaidi mkazo wa idiomu ya Kigiriki.
  terminology: “Mungu Aliye Juu Zaidi” haina usahihi wa kawaida wa cheo hiki katika Kiswahili, kwa kuwa “zaidi” kwa kawaida huleta ulinganisho. “Mungu Aliye Juu Sana” hutoa kwa kawaida na kwa usahihi cheo τοῦ θεοῦ τοῦ ὑψίστου (“Mungu Aliye Juu Zaidi/Most High God”) bila kuongeza tafsiri ya kimafundisho.
