reference: Luke 8:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: sw
  text: Lakini alipomwona Yesu, alipiga kelele, akaanguka mbele yake, akasema kwa sauti kubwa, “Una nini nami,[a] Yesu, Mwana wa Mungu Aliye Juu Sana? Ninakusihi, usinitese.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana halisi zaidi, “Kuna nini kati yangu na wewe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipomwona
  rationale: Kirai hiki cha wakati kinaonyesha jambo lililotangulia matendo makuu; “alipomwona” ni Kiswahili cha kawaida na huhifadhi uhusiano huo wa wakati.
- source_word: ἀνακράξας
  choice: alipiga kelele
  rationale: Kitenzi hiki kinaonyesha mlio mkubwa wa ghafla. “Alipiga kelele” ni cha kawaida katika simulizi na hakifuti usemi unaofuata wa kusema kwa sauti kubwa.
- source_word: προσέπεσεν αὐτῷ
  choice: akaanguka mbele yake
  rationale: Huhifadhi wazo la kuanguka mbele ya mtu bila kuongeza kwamba alianguka miguuni pake au kifudifudi, mambo ambayo hayajasemwa wazi katika Kigiriki.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya namna alivyosema.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Una shughuli gani nami
  rationale: Nahau hii inaonyesha kupinga kuingiliwa au kutaka kujitenga. Tafsiri hii ni ya sasa na inayoeleweka, huku tafsiri iliyo karibu zaidi na muundo wa Kigiriki ikitolewa katika tanbihi.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Mwana wa Mungu Aliye Juu Zaidi
  rationale: Huhifadhi cheo kamili anachotumia mzungumzaji bila kuongeza ufafanuzi wa kimafundisho.
- source_word: δέομαί σου
  choice: Ninakusihi
  rationale: Huonyesha ombi la dhati na la haraka kwa lugha yenye heshima lakini inayoeleweka kwa urahisi.
- source_word: μή με βασανίσῃς
  choice: usinitese
  rationale: “Kutesa” hufikisha maana pana ya maumivu au adhabu kali bila kuibana iwe mateso ya kimwili pekee.
theological_decisions:
- issue: Kauli ya kumtambua Yesu
  choice: Yesu, Mwana wa Mungu Aliye Juu Zaidi
  alternative: Yesu, Mwana wa Mungu Mkuu
  rationale: Tafsiri iliyochaguliwa huhifadhi utambulisho kamili uliomo katika τοῦ θεοῦ τοῦ ὑψίστου na haitanui kauli hiyo kuwa kanuni ya baadaye ya mafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi lenye hadhi lakini la kawaida. Mfuatano wa vitenzi umetolewa kwa “alipomwona … alipiga … akaanguka … akasema” ili simulizi lisikike kwa ufasaha. Alama ya tanbihi imewekwa baada ya nahau inayofafanuliwa.
