source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: sw
  text: Naye akasema, “Ninyi mmejaliwa kuzijua siri[a] za ufalme wa Mungu, lakini wengine hufundishwa kwa mifano, ili wakitazama wasione, na wakisikia wasielewe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafumbo.” Neno la Kigiriki humaanisha kweli za ufalme wa Mungu zilizofichwa kwa baadhi ya watu na kufunuliwa kwa wengine; si mafumbo yasiyoweza kueleweka.
    reason: lexical_alternative
  - marker: b
    text: Maneno “wakitazama wasione, na wakisikia wasielewe” yanatoa mwangwi wa Isaya 6:9–10. Yanaweza kueleweka kuwa yanaonyesha kusudi la Mungu katika hukumu, matokeo yake, au yote mawili.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: mmejaliwa
  rationale: Kauli timilifu tendwa inaonyesha kwamba wamepewa neema au fursa ambayo matokeo yake yanaendelea; muundo wa Kiswahili hauitaji kumtaja mtoaji, sawa na Kigiriki.
- source_word: γνῶναι
  choice: kuzijua
  rationale: Huhifadhi maana ya kujua na kuitofautisha na συνιῶσιν, iliyotafsiriwa ‘waelewe’ baadaye katika mstari.
- source_word: τὰ μυστήρια
  choice: siri
  rationale: Katika muktadha huu ni kweli za Mungu zilizofichwa kisha kufunuliwa, si mambo ya fumbo yasiyoweza kueleweka. ‘Siri’ ni ya kawaida na wazi katika Kiswahili; tanbihi inadokeza ‘mafumbo’ kama mbadala.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: za ufalme wa Mungu
  rationale: Ni usemi wa kawaida wa kibiblia unaoweza kujumuisha utawala wa Mungu na eneo au jamii inayotawaliwa naye.
- source_word: τοῖς δὲ λοιποῖς
  choice: lakini kwa wengine
  rationale: λοιποί ni wale wengine/waliosalia. ‘Wengine’ ni ya asili katika Kiswahili na haileti usemi wa Marko ‘walio nje’ ndani ya Luka.
- source_word: ἐν παραβολαῖς
  choice: ni kwa mifano
  rationale: Kigiriki kina kishazi cha mkato. Kitenzi ‘ni’ kinaongezwa ili Kiswahili kiwe kamili, huku ‘kwa mifano’ kikihifadhi namna ya kufundisha.
- source_word: ἵνα
  choice: ili
  rationale: Huhifadhi mvutano wa kusudi na matokeo bila kuamua moja kwa moja kati yake.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: wakitazama wasione
  rationale: Huhifadhi urudiaji wa kitenzi cha kuona katika Kigiriki na mwangwi wa Isaya, bila kutafsiri kitenzi cha pili kwa neno la kiufafanuzi kama ‘watambue’.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: wakisikia wasielewe
  rationale: Hutofautisha kusikia kwa masikio na kuelewa maana; ni Kiswahili cha kawaida na cha moja kwa moja.
theological_decisions:
- issue: Nguvu ya kishazi cha ἵνα katika mwangwi wa Isaya 6:9–10
  choice: ili
  alternative: hata ikawa kwamba / kwa matokeo kwamba
  rationale: ‘Ili’ huacha wazi uzito wa lugha ya kusudi huku muktadha pia ukiruhusu matokeo ya hukumu. Tafsiri hailegezi wala kuamua kimadhehebu mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ninyi’ imetumiwa kwa msisitizo unaoonekana katika ὑμῖν; ‘mmejaliwa’ ni ya kawaida lakini yenye hadhi, na huhifadhi wazo la kupokea bila kumtaja wazi mtoaji. Kishazi kifupi cha Kigiriki kimekamilishwa kwa ‘ni’ ili sentensi iwe ya asili katika Kiswahili.
