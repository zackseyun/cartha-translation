  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: sw
  text: Naye akaambiwa, “Mama yako na ndugu zako wa kiume wamesimama nje, wakitaka kukuona.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: akaambiwa
  rationale: Kitenzi cha kutendwa katika wakati uliopita kinaonyesha kwamba taarifa ilifikishwa kwake; ‘akaambiwa’ ni ya kawaida na ya asili katika masimulizi ya Kiswahili.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi; ‘Ndipo’ huunganisha tukio hili kwa mtiririko wa habari bila kuleta utofautishaji mkali.
- source_word: αὐτῷ
  choice: a- katika ‘akaambiwa’
  rationale: Yule aliyepokea taarifa anaonyeshwa kwa kiambishi cha mtendewa katika kitenzi cha Kiswahili, hivyo hakuna haja ya kuongeza ‘yeye’.
- source_word: μήτηρ
  choice: Mama
  rationale: ‘Mama’ ni neno la kawaida, lenye heshima, na linaloeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: ἀδελφοί
  choice: ndugu zako wa kiume
  rationale: Neno la Kigiriki ni wingi wa kiume na kwa kawaida humaanisha ndugu wa kiume. Ufafanuzi ‘wa kiume’ unaepusha utata wa neno la Kiswahili ‘ndugu,’ ambalo peke yake linaweza kumaanisha jamaa wa aina nyingi.
- source_word: ἑστήκασιν
  choice: wamesimama
  rationale: Kauli timilifu inaonyesha hali iliyopo iliyotokana na tendo la kusimama; ‘wamesimama’ huhifadhi vizuri hali hiyo kwa Kiswahili.
- source_word: ἔξω
  choice: nje
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha mahali bila kuongeza jengo au eneo ambalo halikutajwa wazi.
- source_word: ἰδεῖν
  choice: kukuona
  rationale: Maana ya msingi ni ‘kuona’; kiambishi ‘ku-’ kinaonyesha kwamba Yesu ndiye waliyetamani kumwona.
- source_word: θέλοντες
  choice: wakitaka
  rationale: Muundo huu unaonyesha tamanio linaloambatana na hali yao ya kusimama nje, kwa lugha ya kawaida ya Kiswahili.
theological_decisions:
- issue: Maana ya ἀδελφοί kuhusu familia ya Yesu
  choice: ndugu zako wa kiume
  alternative: jamaa zako
  rationale: Tafsiri inahifadhi maana ya kawaida na ya kiume ya neno la Kigiriki bila kuamua mijadala ya kimafundisho kuhusu uhusiano wao halisi na Yesu. ‘Jamaa’ ingelipanua maana kuliko ilivyo lazima katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili huku sauti ya kutendwa, hali ya kusimama nje, na kusudi la kutaka kumwona Yesu vikihifadhiwa.
