source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: sw
  text: Kisha akawaambia, “Imani yenu iko wapi[a]?” Nao wakaogopa na kushangaa, wakisema wao kwa wao, “Huyu basi ni nani, hata anaamuru pepo na maji, navyo vinamtii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kumtumaini kwenu kuko wapi?” Hapa “imani” inaweza kumaanisha pia kumtumaini Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: iko wapi
  rationale: Huhifadhi swali la moja kwa moja kuhusu mahali au kuwapo kwa imani yao, bila kulifasiri kuwa ‘Kwa nini hamna imani?’
- source_word: πίστις
  choice: imani
  rationale: ‘Imani’ ndiyo tafsiri ya kawaida na pana; katika muktadha huu inahusisha kumtumaini Yesu wakati wa hatari.
- source_word: φοβηθέντες
  choice: wakaogopa
  rationale: Huwasilisha kwa Kiswahili cha asili tendo la kuingiwa na hofu linaloambatana na mshangao wao, bila kuongeza kiwango cha hofu kisichotajwa.
- source_word: ἐθαύμασαν
  choice: kushangaa
  rationale: ‘Kushangaa’ huonyesha mshangao wenye kustaajabu kwa lugha ya kawaida na yenye hadhi.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Huyu basi ni nani
  rationale: ‘Basi’ huhifadhi nguvu ya ἄρα ya hitimisho au mshangao baada ya muujiza.
- source_word: ἐπιτάσσει
  choice: anaamuru
  rationale: Ni tafsiri ya moja kwa moja ya kutoa amri; haileti wazo la ‘kukemea’ kutoka mstari uliotangulia.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: pepo na maji
  rationale: Hufuata kwa karibu wingi wa ‘pepo’ na umoja wa ‘maji’ katika maandishi ya Luka, bila kubadili maji kuwa mawimbi au bahari.
- source_word: ὑπακούουσιν αὐτῷ
  choice: vinamtii
  rationale: Kitenzi ‘kutii’ huonyesha wazi kwamba nguvu hizi za uumbaji zinakubali amri yake; kiambishi ‘vi-’ kinarejelea pepo na maji kama ngeli ya vi-.
theological_decisions:
- issue: Maana ya πίστις katika muktadha unaoweza kusisitiza kumtumaini Yesu
  choice: imani
  alternative: tumaini / kumtumaini
  rationale: ‘Imani’ hudumisha istilahi pana ya kibiblia, huku tanbihi ikihifadhi maana ya kimuktadha ya kumtumaini Yesu bila kuifunga tafsiri kwenye maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Nao wakaogopa na kushangaa’ ni wa asili zaidi katika Kiswahili kuliko kuiga moja kwa moja kirai tegemezi cha Kigiriki, huku ukihifadhi matendo yote mawili na mfuatano wa simulizi.
