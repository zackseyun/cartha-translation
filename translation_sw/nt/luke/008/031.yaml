  text: Nao waliendelea kumsihi asiwaamuru waende katika kilindi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shimo lisilo na mwisho.” Neno la Kigiriki linaweza kumaanisha kina kikubwa; hapa huenda linarejelea kilindi kama mahali pa kufungiwa roho waovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: waliendelea kumsihi
  rationale: Kauli ya wakati usiotimilika inaonyesha ombi lililoendelea au lililorudiwa; ‘waliendelea kumsihi’ huwasilisha hali hiyo na uzito wa ombi lao.
- source_word: ἐπιτάξῃ
  choice: asiwaamuru
  rationale: Kitenzi hiki huonyesha agizo lenye mamlaka; ‘amuru’ huhifadhi wazi mamlaka ya Yesu juu yao.
- source_word: ἄβυσσον
  choice: shimo lisilo na mwisho
  rationale: Katika muktadha wa pepo, neno hili linamaanisha kilindi au shimo la ulimwengu wa roho linalohusishwa na kifungo; tafsiri hii ni ya kawaida na inayoeleweka katika Kiswahili bila kuongeza maelezo yasiyomo katika mstari.
- source_word: ἀπελθεῖν
  choice: waende
  rationale: Kitenzi cha mwendo pamoja na mahali panapotajwa hutafsiriwa kwa kawaida kuwa ‘waende’; hakuna haja ya kuongeza ‘waondoke.’
- source_word: ἵνα μὴ
  choice: asi-
  rationale: Baada ya kitenzi cha kusihi, muundo huu unaeleza maudhui hasi ya ombi; Kiswahili huuwasilisha kwa kawaida kwa kiima tegemezi hasi ‘asiwaamuru.’
- source_word: αὐτοῖς
  choice: -wa-
  rationale: Kiambishi cha yambwa ‘-wa-’ katika ‘asiwaamuru’ kinawakilisha wale wanaoathiriwa na amri, yaani pepo.
theological_decisions:
- issue: Maana ya ἄβυσσος katika muktadha wa pepo
  choice: shimo lisilo na mwisho, likidokeza mahali pa kifungo cha viumbe waovu wa rohoni
  alternative: kilindi kwa maana ya kina kikubwa kwa ujumla
  rationale: Muktadha unaonyesha pepo wakihofu amri ya Yesu. Tafsiri hii huhifadhi maana ya ulimwengu wa roho bila kufafanua zaidi ya yale Luka anayotaja; tanbihi inadumisha uwezekano wa maana ya msingi ‘kilindi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waliendelea kumsihi’ hudhihirisha tendo endelevu, huku ‘asiwaamuru waende’ ikiwa ya asili na wazi.
