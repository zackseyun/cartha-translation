base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: sw
  text: Lakini mbegu iliyoanguka katika udongo mzuri ni wale ambao, baada ya kusikia neno kwa moyo wa unyofu na wema, hulishika kwa uthabiti na kuzaa matunda kwa ustahimilivu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: ile iliyo katika udongo mzuri
  rationale: Muundo wa Kigiriki ni wa udondoshaji na katika muktadha unarejelea mbegu iliyopandwa. Kiswahili kinaweza kuhifadhi muundo huo kwa njia ya asili bila kulazimika kuongeza neno “mbegu”.
- source_word: καλῇ γῇ
  choice: udongo mzuri
  rationale: γῆ hapa ni ardhi inayopokea mbegu; “udongo” huhifadhi picha ya kilimo kwa usahihi na kwa lugha ya kawaida.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: ni wale ambao
  rationale: Huu ni utambulisho wa kundi linalowakilishwa na udongo mzuri; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: kwa moyo mwema na mzuri
  rationale: “Moyo” huhifadhi maana ya mtu wa ndani. Vivumishi viwili vya Kigiriki vina maana zinazokaribiana; “mwema na mzuri” huhifadhi sifa zote mbili bila kuingiza wazo finyu la kusema kweli pekee.
- source_word: ἀκούσαντες τὸν λόγον
  choice: baada ya kulisikia neno
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kwamba kusikia hutangulia kulishika neno na kuzaa matunda.
- source_word: κατέχουσιν
  choice: hulishika kwa uthabiti
  rationale: κατέχω hapa ni kudumisha au kushikilia kwa nguvu, si kuwa nalo tu; “kwa uthabiti” huonyesha udumifu huo.
- source_word: καρποφοροῦσιν
  choice: kuzaa matunda
  rationale: Usemi huu huhifadhi moja kwa moja taswira ya kilimo na maana yake ya kimfano.
- source_word: ἐν ὑπομονῇ
  choice: kwa uvumilivu
  rationale: ὑπομονή ni ustahimilivu wenye kudumu. “Kwa uvumilivu” ni usemi wa kawaida unaoonyesha namna wanavyozaa matunda.
theological_decisions:
- issue: Sifa ya kimaadili ya moyo unaolipokea neno
  choice: kwa moyo mwema na mzuri
  alternative: kwa moyo wa unyofu na wema
  rationale: Tafsiri inadumisha sifa chanya mbili za moyo bila kueleza chanzo chake au kuingiza msimamo wa kimadhehebu kuhusu kustahili, kuzaliwa upya, au mpangilio wa wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wazi kwa msomaji wa kawaida, huku taswira ya udongo, neno, kushika kwa uthabiti, na kuzaa matunda ikihifadhiwa.
