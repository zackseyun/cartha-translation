  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: sw
  text: 'Umati mkubwa ulipokuwa ukikusanyika, na watu walipokuwa wakimjia kutoka mji baada ya mji, alisema kwa mfano[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alisema katika mfano.” Kauli ya Kigiriki διὰ παραβολῆς inaweza kueleweka kuwa inaonyesha njia aliyotumia au namna alivyosema.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: ulipokuwa ukikusanyika
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea; tafsiri hii inaonyesha umati uliokuwa katika mchakato wa kukusanyika.
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno tofauti)
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha tofauti kubwa. Mtiririko huo unaelezwa kwa kawaida katika Kiswahili bila kulazimisha kiunganishi cha ziada.
- source_word: ὄχλου πολλοῦ
  choice: umati mkubwa
  rationale: Hii ni tafsiri ya kawaida na ya sasa ya umati wenye watu wengi.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: watu kutoka mji baada ya mji wakimjia
  rationale: Kauli hii inadumisha maana ya mgawanyo ya κατὰ πόλιν—watu walikuwa wakija kutoka miji mbalimbali, mji mmoja baada ya mwingine.
- source_word: πρὸς αὐτόν
  choice: wakimjia
  rationale: Kitenzi hiki kinaonyesha kwa kawaida mwendo wao kumwelekea Yesu, huku kiwakilishi cha nafsi kikibaki wazi katika muktadha.
- source_word: εἶπεν
  choice: alisema
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki katika simulizi.
- source_word: διὰ παραβολῆς
  choice: kwa mfano
  rationale: διά pamoja na hali ya umilikaji inaweza kuonyesha njia au namna; ‘kwa mfano’ ni kifupi, cha asili, na kinadumisha uwezekano huo bila kuufafanua kupita kiasi.
