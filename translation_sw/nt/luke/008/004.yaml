translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mji baada ya mji’ limetumiwa kuwasilisha kwa kawaida nguvu ya mgawanyo ya κατὰ πόλιν. Alama ya tanbihi imewekwa baada ya ‘mfano,’ ambako tofauti ya kileksika inahusika.
