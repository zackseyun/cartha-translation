  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: sw
  text: Akamjia kwa nyuma, akagusa upindo wa vazi lake[a], na mara moja mtiririko wa damu yake ukakoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ukingo au kishada cha vazi lake.
    reason: Neno la Kigiriki linaweza kumaanisha ukingo, upindo, au kishada cha vazi.
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Akamjia kwa nyuma
  rationale: Kauli hii inaonyesha kwamba mwanamke alimkaribia Yesu akiwa upande wake wa nyuma; muundo wa Kiswahili unaweka tendo hilo kabla ya kugusa kama ilivyo katika Kigiriki.
- source_word: ἥψατο
  choice: akagusa
  rationale: Kitenzi hiki katika muktadha huu kinamaanisha kugusa, bila kulazimisha wazo la kushika kwa nguvu.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: upindo wa vazi lake
  rationale: “Upindo” huonyesha sehemu ya pembeni au ya chini ya vazi bila kuamua kwa uhakika kama kinachokusudiwa ni ukingo, pindo lililoshonwa, au kishada; “vazi” ni neno la kawaida lisilobainisha kupita kiasi aina ya nguo.
- source_word: παραχρῆμα
  choice: mara
  rationale: “Mara” huwasilisha kwa lugha ya kawaida matokeo yaliyotokea papo hapo.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: mtiririko wa damu yake ukakoma
  rationale: Tafsiri hii inahifadhi taswira ya Kigiriki ya mtiririko wa damu uliosimama, huku ikiwa wazi na yenye heshima katika Kiswahili cha sasa.
theological_decisions:
- issue: Huenda κράσπεδον ikamaanisha ukingo wa kawaida wa vazi au kishada kinachohusiana na mavazi ya Kiyahudi.
  choice: upindo katika matini kuu
  alternative: ukingo au kishada cha vazi
  rationale: Aya yenyewe haibainishi kwa uhakika kwamba kishada cha kidini ndicho kinachokusudiwa. “Upindo” huhifadhi upana wa maana, na tanbihi inaonyesha uwezekano mahususi zaidi bila kuuingiza kwa lazima katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi, lugha ya sasa na yenye heshima. Muundo “mtiririko wa damu” unafuata matini ya Kigiriki kwa karibu bila kutumia maelezo ya kitabibu yasiyokuwamo.
