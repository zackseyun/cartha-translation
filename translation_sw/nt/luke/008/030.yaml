  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: sw
  text: Yesu akamwuliza, “Jina lako ni nani?” Naye akasema, “Legioni,”[a] kwa sababu pepo wengi walikuwa wamemwingia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legioni” linatokana na neno la Kilatini lililotaja kikosi kikubwa cha jeshi la Roma; hapa jina hilo linaonyesha kwamba pepo wengi walikuwa wamemwingia mtu huyo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: akamwuliza
  rationale: Kitenzi hiki kinaanzisha swali la moja kwa moja. “Akamwuliza” ni simulizi la kawaida na la asili katika Kiswahili, huku kiambishi -mw- kikihifadhi kwamba Yesu alimwuliza huyo mtu.
- source_word: δὲ
  choice: Naye
  rationale: Katika sehemu ya pili, δέ inaonyesha mwendelezo na mabadiliko ya msemaji. “Naye” huleta mpito huo kwa Kiswahili cha asili bila kuutilia mkazo kupita kiasi. δέ ya kwanza imewakilishwa na mfuatano wa kitenzi “akamwuliza.”
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Jina lako ni nani?
  rationale: Hii ndiyo njia ya kawaida ya kuuliza jina katika Kiswahili. Inawasilisha maana ya msemo wa Kigiriki bila kuiga muundo wake kwa ugumu.
- source_word: Λεγιών
  choice: Legioni
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili. Pia linadumisha uhusiano wake na neno la Kilatini lililotaja kikosi kikubwa cha jeshi la Roma.
- source_word: ὅτι
  choice: kwa sababu
  rationale: ὅτι hapa inatoa sababu ya jina “Legioni”; “kwa sababu” huonyesha uhusiano huo wa kisababishi waziwazi.
- source_word: εἰσῆλθεν
  choice: walikuwa wamemwingia
  rationale: Ingawa Kigiriki kina umbo la wakati uliopita, muundo huu wa Kiswahili unaonyesha kwa asili kwamba kuingia kwa pepo kulitangulia kutajwa kwa jina hilo. Wingi wa kitenzi unafuata sarufi ya Kiswahili pamoja na “pepo wengi.”
- source_word: δαιμόνια πολλὰ
  choice: pepo wengi
  rationale: “Pepo” ni neno la kawaida la Kiswahili kwa viumbe waovu wa kiroho katika muktadha huu, na “wengi” huhifadhi msisitizo wa wingi.
- source_word: εἰς αὐτόν
  choice: wamemwingia
  rationale: Kiambishi cha yambwa -mw- pamoja na kitenzi “kuingia” kinahifadhi wazo la mwendo wa kuingia ndani yake.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμόνια katika muktadha wa mtu kuingiwa na pepo
  choice: pepo
  alternative: roho waovu
  rationale: “Pepo” ndilo neno la moja kwa moja na linaloeleweka katika Kiswahili kwa viumbe wa kiroho wanaotajwa hapa. Halipunguzi madai ya simulizi kwamba viumbe hao walimwingia mtu huyo.
- issue: Uhusiano wa wakati wa εἰσῆλθεν na maelezo ya jina
  choice: walikuwa wamemwingia
  alternative: walimwingia
  rationale: Muundo wenye “walikuwa wame-” unaweka wazi kwamba kuingia kwa pepo kulitokea kabla ya jibu “Legioni,” bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akamwuliza … Naye akasema” ni wa asili katika usimulizi. Tanbihi ya kitamaduni pekee imetumika; tanbihi mbadala ya Kiingereza haikufuati kwa uwazi sehemu iliyoalamishwa katika matini iliyotolewa, kwa hiyo haijaingizwa kama dai la tofauti ya matini.
