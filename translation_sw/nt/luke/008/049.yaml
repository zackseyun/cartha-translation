  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: sw
  text: Alipokuwa bado anasema, mtu mmoja kutoka kwa kiongozi wa sinagogi akaja, akisema, “Binti yako amekufa; usimsumbue mwalimu tena.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Alipokuwa bado anasema
  rationale: Muundo wa genitivi huru unaonyesha tendo linaloendelea wakati tendo jingine linapotokea; “bado” huhifadhi nguvu ya ἔτι kwa Kiswahili cha kawaida.
- source_word: ἔρχεταί τις
  choice: mtu mmoja akaja
  rationale: Kitenzi cha wakati wa sasa wa kihistoria kimetafsiriwa kwa wakati wa masimulizi wa Kiswahili. τις humtaja mtu asiyeainishwa, hivyo “mtu mmoja” ni usemi wa asili.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: kutoka kwa kiongozi wa sinagogi
  rationale: παρά pamoja na genitivi huonyesha chanzo, na ἀρχισυνάγωγος humaanisha msimamizi au kiongozi mkuu wa sinagogi. “Kiongozi wa sinagogi” ni wazi na si ya kizamani.
- source_word: λέγων
  choice: na kusema
  rationale: Kirai hiki kinaunganisha kuja kwa mjumbe na ujumbe alioutoa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Τέθνηκεν
  choice: amekufa
  rationale: Wakati timilifu wa Kigiriki unaeleza tukio la kufa pamoja na hali yake inayoendelea; “amekufa” huhifadhi maana zote mbili kwa kawaida katika Kiswahili.
- source_word: ἡ θυγάτηρ σου
  choice: Binti yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiwakilishi cha umilikaji.
- source_word: μηκέτι
  choice: tena
  rationale: Katika katazo, “tena” huonyesha kwamba tendo hilo lisiendelee kuanzia sasa.
- source_word: σκύλλε
  choice: usimsumbue
  rationale: σκύλλω hapa humaanisha kumsumbua au kumtaabisha mtu. “Usimsumbue” ni ya kawaida, yenye heshima, na inafaa uzito wa hali hiyo.
- source_word: τὸν διδάσκαλον
  choice: mwalimu
  rationale: διδάσκαλος ni cheo cha kawaida chenye maana ya “mwalimu”; tafsiri hii haiongezi cheo cha kitheolojia kisichotajwa wazi katika kifungu.
theological_decisions:
- issue: Cheo ἀρχισυνάγωγος kinachomhusu Yairo
  choice: kiongozi wa sinagogi
  alternative: mkuu wa sinagogi
  rationale: Hiki ni cheo cha kiutawala katika sinagogi, si cheo cha kidini cha baadaye. “Kiongozi wa sinagogi” kinaeleweka katika Kiswahili cha sasa bila kuingiza dhana za madhehebu.
- issue: Tafsiri ya διδάσκαλος
  choice: mwalimu
  alternative: bwana
  rationale: Neno la Kigiriki linamaanisha kwa kawaida “mwalimu.” Kulitafsiri hivyo huhifadhi cheo kilichotumiwa katika mstari bila kuongeza mkazo wa kikristolojia ambao haujawekwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imefuata mtiririko wa simulizi wa Kiswahili huku ikihifadhi uhusiano wa wakati, chanzo cha mjumbe, na uzito wa taarifa. Herufi ndogo katika “mwalimu” huhifadhi maana ya cheo cha kawaida cha Kigiriki badala ya kukifanya jina maalumu.
