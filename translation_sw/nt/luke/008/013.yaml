base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: sw
  text: Wale walio juu ya mwamba ni wale ambao, wanaposikia, hulipokea neno kwa furaha. Lakini hawa hawana mzizi; huamini kwa muda, na wakati wa majaribu[a] huacha imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa kupimwa,” “wakati wa dhiki,” au “wakati wa kishawishi.” Neno la Kigiriki linaweza kumaanisha jaribio, kupimwa, dhiki, au kishawishi, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: juu ya mwamba
  rationale: Hufuata picha halisi ya mwamba katika mfano bila kuibadili kuwa udongo wenye miamba.
- source_word: ἀκούσωσιν
  choice: wanaposikia
  rationale: Hutoa kwa Kiswahili cha kawaida hali ya jumla inayoletwa na ὅταν pamoja na kitenzi cha aoristi tegemezi.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Ni usemi wa kawaida unaohifadhi wazi hali ya furaha inayofuatana na kulipokea neno.
- source_word: δέχονται τὸν λόγον
  choice: hulipokea neno
  rationale: ‘Kulipokea neno’ huhifadhi nahau ya kibiblia na maana ya kuukubali ujumbe uliotangazwa.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: hawana mzizi
  rationale: Huhifadhi umoja wa ῥίζαν na sitiari fupi ya mmea.
- source_word: πρὸς καιρὸν
  choice: kwa muda
  rationale: Hueleza kipindi chenye kikomo kwa lugha ya kawaida bila kuongeza muda maalumu.
- source_word: πιστεύουσιν
  choice: huamini
  rationale: Ni kilinganishi cha moja kwa moja na cha kutoegemea upande wa kitheolojia kwa πιστεύουσιν.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: wakati wa jaribu
  rationale: ‘Jaribu’ linaweza kurejelea majaribio, dhiki ya kupimwa, au kishawishi, hivyo linadumisha upana wa πειρασμός.
- source_word: ἀφίστανται
  choice: hujitenga
  rationale: Hueleza kuondoka au kujiondoa katika kile walichokuwa wamekiamini bila kutumia istilahi nzito ya kitaalamu ya uasi-imani.
theological_decisions:
- issue: Ikiwa πιστεύουσιν inaonyesha imani ya wokovu au imani ya juu juu tu
  choice: huamini
  alternative: huonekana kuamini; huamini kwa juu juu
  rationale: Andiko linasema wanaamini kwa muda kisha hujitenga, lakini halitatui moja kwa moja mabishano ya kitheolojia kuhusu aina ya imani yao. Tafsiri inadumisha mvutano huo.
- issue: Maana ya πειρασμός katika muktadha huu
  choice: jaribu
  alternative: kujaribiwa; majaribu; kishawishi
  rationale: Neno la Kigiriki linaweza kumaanisha kupimwa, dhiki, au kushawishiwa. ‘Jaribu’ ni pana vya kutosha, na tanbihi inaweka wazi uwezekano huo.
- issue: Uzito wa ἀφίστανται
  choice: hujitenga
  alternative: huanguka; huacha imani; huasi
  rationale: ‘Hujitenga’ huhifadhi maana nzito ya kuondoka bila kutaja wazi hitimisho la kimadhehebu kuhusu uasi-imani au uwezekano wa kupoteza wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mfano na mvutano wa kitheolojia vimedumishwa bila kuongeza ufafanuzi wa kimadhehebu.
