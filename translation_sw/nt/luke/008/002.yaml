id: LUK.8.2
reference: Luke 8:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: sw
  text: 'na baadhi ya wanawake[a] waliokuwa wameponywa kutokana na pepo wabaya na magonjwa: Maria, aliyeitwa Magdalene, ambaye pepo saba walikuwa wamemtoka[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawake fulani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye pepo saba walikuwa wametoka ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: baadhi ya wanawake
  rationale: Kirai hiki huonyesha kundi lisilotajwa kwa ukamilifu. ‘Baadhi ya wanawake’ ni Kiswahili cha kawaida na cha wazi; ‘wanawake fulani’ pia kinawezekana.
- source_word: τεθεραπευμέναι
  choice: waliokuwa wameponywa
  rationale: Muundo wa ἦσαν pamoja na participio timilifu tendwa unaonyesha uponyaji uliokuwa umetokea tayari na ambao matokeo yake yaliendelea kuwapo.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: kutokana na pepo wabaya
  rationale: πνεύματα πονηρά humaanisha viumbe wa kiroho waovu; tafsiri haibadili usemi huo kuwa ‘pepo wachafu,’ kwa kuwa neno la Kigiriki hapa ni πονηρός, si ἀκάθαρτος.
- source_word: καὶ ἀσθενειῶν
  choice: na magonjwa
  rationale: ἀσθένεια katika muktadha huu hurejelea udhaifu au maradhi ya mwili. ‘Magonjwa’ ni neno la kawaida na linaweka tofauti kati ya hali hizo na pepo wabaya.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: aliyeitwa Magdalene
  rationale: Participio καλουμένη humtambulisha Maria kwa jina au sifa ya ‘Magdalene.’ Muundo huu ni mfupi, wa kawaida, na mwaminifu kwa Kigiriki.
- source_word: ἀφ’ ἧς
  choice: ambaye ... walikuwa wamemtoka
  rationale: ἀπό pamoja na kiwakilishi rejeshi huonyesha kuondoka kutoka kwa mtu huyo. Kiswahili ‘wamemtoka’ huwasilisha maana hiyo kwa ufasaha.
- source_word: δαιμόνια ἑπτὰ
  choice: pepo saba
  rationale: δαιμόνια hutaja pepo hasa, na hivyo tofauti yake na neno pana zaidi πνεύματα lililotumiwa mapema inahifadhiwa kadiri Kiswahili kinavyoruhusu.
- source_word: ἐξεληλύθει
  choice: walikuwa wamemtoka
  rationale: Wakati uliopita timilifu unaonyesha kwamba pepo hao walikuwa tayari wameondoka kabla ya wakati unaosimuliwa.
theological_decisions:
- issue: Lugha kuhusu mateso yanayosababishwa na pepo
  choice: Kutaja ‘pepo wabaya’ na ‘pepo saba’ kama viumbe binafsi wa kiroho
  alternative: Kuchukulia maneno hayo kama sitiari ya hali za kisaikolojia au kimwili
  rationale: Kigiriki hutofautisha πνεύματα πονηρά na δαιμόνια na ἀσθένειαι (‘magonjwa’). Tafsiri inahifadhi tofauti hiyo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama [a] imewekwa baada ya kirai kinachohusika, ‘baadhi ya wanawake,’ na [b] baada ya ‘wamemtoka.’
