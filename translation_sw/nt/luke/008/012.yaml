  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: sw
  text: Wale walio kando ya njia ni wale waliosikia; kisha Ibilisi huja na kuondoa neno[a] mioyoni mwao, ili wasiamini na kuokolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Neno” hapa linamaanisha ujumbe wa Mungu uliotangazwa katika mfano huu.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: kando ya njia
  rationale: Kirai hiki kinahifadhi taswira ya mahali pembeni mwa njia kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἀκούσαντες
  choice: waliosikia
  rationale: Kauli hii inaonyesha watu waliokwisha kusikia ujumbe; wakati uliopita unalingana na kitenzi-shirikishi cha aoristi.
- source_word: εἶτα
  choice: kisha
  rationale: Neno hili linaonyesha hatua inayofuata katika mfuatano.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Hapa neno hilo linamtaja yule kiumbe mwovu binafsi; “Ibilisi” ndiyo istilahi sanifu na inayoeleweka katika Kiswahili.
- source_word: αἴρει
  choice: kuliondoa
  rationale: Kitenzi kina maana ya kuondoa au kuchukua kitu kutoka mahali kilipo, bila kulazimisha wazo la kunyakua kwa nguvu.
- source_word: τὸν λόγον
  choice: neno
  rationale: “Neno” linahifadhi usemi wa kibiblia, huku tanbihi ikifafanua kuwa hapa linamaanisha ujumbe uliotangazwa.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: mioyoni mwao
  rationale: Wingi wa “mioyo” unaakisi αὐτῶν na unaonyesha kitovu cha fikira, nia na mwitikio wa kila mmoja.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: ili wasiamini na kuokolewa
  rationale: Muundo huu unahifadhi kusudi la kuondolewa kwa neno na uhusiano wa karibu kati ya kuamini na kuokolewa bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: πιστεύσαντες
  choice: waamini
  rationale: “Kuamini” ndiyo maana ya moja kwa moja katika muktadha huu na haipunguzi tendo hilo kuwa ufahamu wa kiakili tu.
- source_word: σωθῶσιν
  choice: kuokolewa
  rationale: Katika muktadha huu kitenzi kinahusu wokovu, si kuponywa au kuokolewa katika hatari ya muda tu.
theological_decisions:
- issue: Uhusiano wa kuamini na kuokolewa
  choice: ili wasiamini na kuokolewa
  alternative: ili wasije wakaamini na kuokolewa
  rationale: Tafsiri inaacha kauli ya Kigiriki isimame kwamba kusudi la Ibilisi ni kuzuia kuamini na kuokolewa, bila kuamua mijadala ya kimadhehebu kuhusu namna imani na wokovu vinavyohusiana.
- issue: Nguvu ya ἵνα μή
  choice: ili wasiamini
  alternative: kusudi wasije wakaamini
  rationale: “Ili wasiamini” hudhihirisha kusudi linalohusishwa na tendo la Ibilisi, bila kuligeuza kuwa matokeo yasiyokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kando ya njia,” “kisha,” na “mioyoni mwao” ni miundo ya kawaida isiyo ya kizamani. Wakati uliopo katika “huja” na “kuliondoa” unaendeleza namna Yesu anavyoeleza utendaji unaowakilishwa katika mfano.
