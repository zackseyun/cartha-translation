  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: sw
  text: Wachungaji wa nguruwe walipoona yaliyotokea, wakakimbia na kutoa habari mjini na mashambani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha “mashamba”; hapa, kwa kulinganisha na mji, linarejelea maeneo ya mashambani au vijijini yanayozunguka mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: walipoona
  rationale: Kirai cha wakati kinaonyesha kwa Kiswahili cha kawaida kuwa kuona kulitangulia kukimbia na kutoa habari.
- source_word: οἱ βόσκοντες
  choice: wachungaji wa nguruwe
  rationale: Katika muktadha hawa ni watu waliokuwa wakilichunga kundi la nguruwe; kutaja nguruwe huepuka dhana kwamba walikuwa wachungaji wa kondoo.
- source_word: τὸ γεγονός
  choice: yaliyotokea
  rationale: Huwasilisha kwa lugha ya kawaida tukio lililokuwa limetimia, kama inavyoonyeshwa na kauli timilifu ya γίνομαι.
- source_word: ἔφυγον
  choice: wakakimbia
  rationale: Hutoa maana ya kuondoka kwa haraka kwa hofu au hatari bila kuongeza wazo la kufanikiwa kuponyoka.
- source_word: ἀπήγγειλαν
  choice: kutoa habari
  rationale: Hueleza kitendo cha kuripoti au kusimulia yaliyotokea; kitu kilichoripotiwa kinaeleweka kutokana na muktadha.
- source_word: εἰς τὴν πόλιν
  choice: mjini
  rationale: Kwa kuhusishwa na kutoa habari, εἰς inaelekeza kwenye eneo ambako habari ilifikishwa; “mjini” ni ya asili katika Kiswahili.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: na mashambani
  rationale: Katika ulinganifu na mji, ἀγροί humaanisha maeneo ya vijijini au mashambani, si mashamba fulani tu.
