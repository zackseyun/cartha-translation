  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: sw
  text: Siku moja katika siku zile, yeye alipanda mashua pamoja na wanafunzi wake. Akawaambia, “Tuvuke hadi ng’ambo ya ziwa.”[a] Wakaondoka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuvuke kwenda upande wa pili wa ziwa.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki hapa kinaweza kumaanisha kuondoka kwa mashua au kuanza safari majini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: Siku moja katika siku zile
  rationale: Hii ni njia ya asili ya Kiswahili ya kuanzisha tukio lililotokea katika kipindi kilichotajwa tayari. Haiongezi neno la wakati lisilokuwamo katika Kigiriki, na huepuka usemi mzito ‘ikawa kwamba’.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: yeye na wanafunzi wake walipanda mashua
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba yeye pamoja na wanafunzi wake waliingia mashuani. ‘Mashua’ linafaa kwa πλοῖον bila kudokeza chombo kikubwa kuliko kinachokusudiwa.
- source_word: εἶπεν πρὸς αὐτούς
  choice: Akawaambia
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya kusema kwao moja kwa moja.
- source_word: Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης
  choice: Tuvuke hadi ng’ambo ya ziwa
  rationale: ‘Tuvuke’ huhifadhi pendekezo la nafsi ya kwanza wingi, na ‘ng’ambo ya ziwa’ huonyesha upande wa pili wa ziwa kwa Kiswahili cha kawaida.
- source_word: ἀνήχθησαν
  choice: Wakaondoka
  rationale: Katika muktadha huu kitenzi kina maana ya kuondoka kwa chombo majini au kuanza safari. ‘Wakaondoka’ ni wazi na hakiongezi wazo mahususi kama kung’oa nanga ambalo halijasemwa.
