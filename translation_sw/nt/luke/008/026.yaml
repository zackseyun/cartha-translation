  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: sw
  text: Wakasafiri kwa mashua hadi eneo la Wagerasi[a], lililo ng’ambo ya Galilaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na masimulizi sambamba ya Injili yanasema “Wagadara” au “Wagergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: wakasafiri kwa mashua hadi
  rationale: Kitenzi hiki humaanisha kusafiri kwa njia ya maji kuelekea mahali fulani, mara nyingi hadi kufika pwani. Tafsiri hii inaweka wazi njia ya usafiri na mwisho wa safari bila kulazimisha wazo la kushuka ambalo si la lazima katika Kiswahili.
- source_word: χώραν
  choice: eneo
  rationale: Neno hili hapa linaonyesha wilaya au sehemu ya nchi, si taifa la kisasa; “eneo” ni la kawaida na sahihi katika Kiswahili.
- source_word: Γερασηνῶν
  choice: Wagerasi
  rationale: Hili ni jina la watu wa Gerasa katika umbo la kawaida la majina ya wakazi kwa Kiswahili. Usomaji wa matini chanzo umehifadhiwa katika andiko kuu.
- source_word: ἥτις
  choice: lililo
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu “eneo”; “lililo” huunganisha sentensi hiyo kwa njia ya asili na iliyo wazi.
- source_word: ἀντιπέρα
  choice: ng’ambo ya
  rationale: Neno hili humaanisha upande wa pili au mahali panapokabiliana na mahali pengine. “Ng’ambo ya” linafaa kwa uhusiano wa maeneo yaliyotenganishwa na maji.
- source_word: Γαλιλαίας
  choice: Galilaya
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali Galilaya.
theological_decisions:
- issue: Tofauti ya majina ya mahali katika hati na masimulizi sambamba ya Injili
  choice: Wagerasi
  alternative: Wagadara au Wagergesa
  rationale: Matini ya SBLGNT ina Γερασηνῶν, kwa hiyo andiko kuu linafuata “Wagerasi.” Usomaji mwingine umewekwa katika tanbihi ili kuonyesha ushahidi wa kimatini bila kuyapatanisha kimya kimya masimulizi hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kwa mashua” huepuka neno la kiufundi la ubaharia, na “ng’ambo ya” ni usemi wa kawaida wa kijiografia.
