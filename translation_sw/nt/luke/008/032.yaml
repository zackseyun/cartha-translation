base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: sw
  text: Kulikuwa huko na kundi kubwa la nguruwe[c] likila mlimani[a]. Nao[b] wakamsihi awaruhusu waingie ndani ya nguruwe hao, naye akawaruhusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ubavuni mwa mlima.”
    reason: lexical_alternative
  - marker: b
    text: “Nao” hapa inawahusu pepo, yaani roho wachafu, wanaotajwa katika muktadha unaozunguka mstari huu; tafsiri nyingine huwataja wazi.
    reason: alternative_reading
  - marker: c
    text: Au, “nguruwe wengi” au “kundi kubwa la nguruwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: kundi kubwa la nguruwe
  rationale: “Kundi” ni neno la kawaida kwa mkusanyiko wa wanyama, na “kubwa” linaeleza kwa njia ya asili kwamba nguruwe walikuwa wengi au kundi lilikuwa la ukubwa wa kutosha.
- source_word: βοσκομένη
  choice: likila
  rationale: Katika muktadha wa nguruwe, “likila” ni ya kawaida na pana kuliko “likichunga,” ambalo linaweza kudokeza hasa ulaji wa majani.
- source_word: ἐν τῷ ὄρει
  choice: mlimani
  rationale: Hufuata maana ya ὄρος kwa karibu na ni usemi wa kawaida wa Kiswahili; “ubavuni mwa mlima” pia yawezekana kimuktadha.
- source_word: παρεκάλεσαν
  choice: wakamsihi
  rationale: “Kusihi” huonyesha ombi la nguvu na la dhati, sawasawa na uzito wa kitenzi cha Kigiriki.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: awaruhusu / akawaruhusu
  rationale: Kurudia mzizi “ruhusu” kunahifadhi ulinganifu kati ya ombi lao na jibu lake.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: waingie ndani ya nguruwe hao
  rationale: Hueleza wazi mwendo wa kuingia ndani ya nguruwe na kuhifadhi rejeo la ἐκείνους, “hao.”
- source_word: δὲ / καὶ
  choice: Kulikuwa huko … Nao … naye
  rationale: Viunganishi vimetolewa kwa mtiririko wa kawaida wa masimulizi ya Kiswahili bila kuongeza kiashiria cha wakati kisichokuwapo katika chanzo.
theological_decisions:
- issue: Mhusika wa wingi katika παρεκάλεσαν (“walimsihi”)
  choice: Kiwakilishi “Nao” kimeachwa bila kuwataja wazi, kama katika mstari wa Kigiriki.
  alternative: “Pepo wakamsihi” au “roho wachafu wakamsihi.”
  rationale: Muktadha unaonyesha kwamba wanaosihi ni pepo au roho wachafu, lakini mstari wenyewe hautaji nomino hiyo. Kuweka kiwakilishi huhifadhi hali hiyo ya chanzo bila kuificha kwa msomaji, kwa msaada wa tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili masimulizi yasomeke kwa urahisi. “Likila” ni usemi wa kawaida kwa nguruwe, huku “mlimani” na “wakamsihi” vikidumisha uzito wa lugha ya chanzo.
