  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: sw
  text: Umati wote kutoka eneo la kandokando la Wagerasi ukamwomba aondoke kwao, kwa sababu walikuwa wameshikwa na hofu kubwa.[a] Naye akaingia mashuani, akarudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa walisikwa na hofu kubwa.”
    reason: Mbadala wa kileksika unaowasilisha nguvu ya συνείχοντο.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: ukamwomba
  rationale: Katika muktadha huu ἐρωτάω ina maana ya kuomba mtu afanye jambo. “Kumwomba” ni ya kawaida na yenye heshima bila kuongeza uzito wa “kumsihi.”
- source_word: ἅπαν τὸ πλῆθος
  choice: umati wote
  rationale: Huhifadhi maana ya jumla ya ἅπαν na kutoa Kiswahili cha kawaida kwa kundi lililokusanyika.
- source_word: τῆς περιχώρου
  choice: kutoka eneo lililozunguka
  rationale: περίχωρος ni eneo au wilaya inayozunguka mahali husika; “kutoka” huonyesha kwa uwazi umati ulipotoka.
- source_word: τῶν Γερασηνῶν
  choice: la Wagerasi
  rationale: Kivumishi hiki kimetumiwa kama jina la watu au eneo linalohusishwa nao. “Wagerasi” hufuata usomaji Γερασηνῶν wa matini iliyotolewa.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: aondoke kwao
  rationale: Hueleza kwa Kiswahili cha asili ombi kwamba Yesu aondoke katika eneo lao, huku ikihifadhi mwelekeo wa ἀπό.
- source_word: φόβῳ μεγάλῳ
  choice: na hofu kubwa
  rationale: Ni tafsiri ya moja kwa moja ya ukubwa wa hofu bila kufafanua chanzo au aina yake.
- source_word: συνείχοντο
  choice: walikuwa wameshikwa
  rationale: συνέχω hapa huonyesha kutawaliwa au kushikiliwa kwa nguvu na hali fulani; “wameshikwa” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: akaingia katika mashua
  rationale: Hutoa tendo la kupanda au kuingia mashuani kwa lugha iliyo wazi; kutokuwapo kwa kibainishi katika Kigiriki hakulazimishi mashua fulani.
- source_word: ὑπέστρεψεν
  choice: akarudi
  rationale: Ni tafsiri fupi na ya kawaida ya tendo la kurudi au kwenda nyuma.
theological_decisions:
- issue: Sababu na aina ya hofu ya wakazi wa eneo la Wagerasi
  choice: Aya inasema tu kwamba hofu kubwa iliwashika na ikawachochea kumwomba Yesu aondoke.
  alternative: Kuitambulisha hofu hiyo moja kwa moja kuwa kicho kwa nguvu za Mungu, uadui, au wasiwasi kuhusu hasara ya kiuchumi.
  rationale: Matini haifafanui aina au chanzo kamili cha hofu hiyo; tafsiri haiongezi maelezo ya kitheolojia au kijamii yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo umehifadhi mwendo wa simulizi.
