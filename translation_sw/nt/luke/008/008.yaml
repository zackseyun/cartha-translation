id: LUK.8.8
reference: Luke 8:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: sw
  text: Mbegu nyingine ikaanguka kwenye udongo mzuri[a], na ilipokua, ikazaa mara mia. Alipokuwa akisema hayo, akaita kwa sauti, “Mwenye masikio ya kusikia, na asikie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Mbegu nyingine
  rationale: Nomino inayodokezwa na muktadha ni mbegu; kuitaja wazi kunafanya Kiswahili kiwe cha kawaida bila kubadili mhusika wa mfano.
- source_word: γῆν τὴν ἀγαθήν
  choice: udongo mzuri
  rationale: Katika mfano wa kilimo, γῆ humaanisha udongo unaofaa kwa mbegu, si nchi kwa maana pana.
- source_word: φυὲν
  choice: ilipokua
  rationale: Kauli hii huonyesha ukuaji unaotangulia kuzaa; muundo wa 'ilipokua' ni wa asili na huhifadhi mfuatano huo.
- source_word: ἐποίησεν καρπὸν
  choice: ikazaa
  rationale: Katika Kiswahili, 'kuzaa' ni usemi wa kawaida kwa mmea kutoa mazao na unawakilisha wazo la kutoa matunda bila tafsiri ngumu ya neno kwa neno.
- source_word: ἑκατονταπλασίονα
  choice: mara mia
  rationale: Huwasilisha kwa wazi ongezeko au mavuno yenye kipimo cha mara mia.
- source_word: ταῦτα λέγων
  choice: Alipokuwa akisema hayo
  rationale: Huhifadhi kitendo kinachoendelea wakati mmoja na kuita kwake kwa sauti.
- source_word: ἐφώνει
  choice: akaita kwa sauti
  rationale: Hutoa maana ya kusema kwa sauti kubwa au yenye msisitizo bila kulazimisha wazo la kupiga kelele.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Mwenye masikio ya kusikia
  rationale: Ni muundo wa Kiswahili ulio wa kawaida, wa jumla, na usiohusisha jinsia; pia huhifadhi maana ya uwezo au utayari wa kusikia.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Huhifadhi amri ya nafsi ya tatu kwa mtindo wa Kiswahili wenye uzito wa himizo.
theological_decisions:
- issue: Lugha wakilishi katika himizo la Yesu
  choice: Mwenye masikio ya kusikia, na asikie
  alternative: Yeye aliye na masikio ya kusikia, na asikie
  rationale: Kigiriki kinamlenga mtu yeyote, si mwanaume pekee. 'Mwenye' huhifadhi umoja na maana ya jumla bila kuingiza jinsia isiyokusudiwa.
- issue: Maana ya kusikia katika tamko la mwisho
  choice: Kuhifadhi maneno 'ya kusikia' na 'asikie'
  alternative: Mwenye masikio, na afahamu
  rationale: Kurudiwa kwa mzizi ἀκούω ni sehemu ya msisitizo wa maandishi. Tafsiri haibadilishi 'kusikia' kuwa 'kuelewa,' ingawa himizo hilo linaweza kudokeza usikivu wa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka kwa sauti, huku ukihifadhi mfuatano wa vitendo na himizo lenye msisitizo.
