  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: sw
  text: Yesu aliporudi, umati ulimkaribisha[a], kwa maana wote walikuwa wakimngojea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimpokea”; kitenzi cha Kigiriki kinaweza kumaanisha kumpokea au kumkaribisha mtu, na hapa kina maana chanya.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakimtarajia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: aliporudi
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kiamb冠 unaonyesha wakati; Kiswahili cha kawaida huutoa kwa kiambishi cha wakati -po-. δέ ni kiunganishi chepesi cha simulizi na hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ὑποστρέφειν
  choice: aliporudi
  rationale: ὑποστρέφω humaanisha kurudi; umbo hili ni la kawaida, wazi, na linafaa mfululizo wa simulizi.
- source_word: ἀπεδέξατο
  choice: ulimkaribisha
  rationale: Katika muktadha huu ἀποδέχομαι ni kumpokea mtu kwa mtazamo chanya. ‘Ulimkaribisha’ huonyesha maana hiyo kwa Kiswahili cha sasa bila kuongeza ‘kwa furaha,’ jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: ὄχλος ni kundi kubwa la watu waliokusanyika; ‘umati’ ni neno la kawaida na lenye hadhi katika Kiswahili sanifu.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: kwa maana wote walikuwa wakimngojea
  rationale: γάρ hutoa sababu ya kumkaribisha, na muundo ‘walikuwa wakimngojea’ huhifadhi hali endelevu ya προσδοκῶντες. ‘Kumngojea’ linafaa mazingira ya watu waliokuwa wakisubiri kuwasili kwake.
- source_word: πάντες
  choice: wote
  rationale: ‘Wote’ huhifadhi msisitizo wa Kigiriki kwamba watu wote katika umati walikuwa wakimngojea.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
