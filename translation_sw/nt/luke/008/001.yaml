id: LUK.8.1
reference: Luke 8:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: sw
  text: Baada ya hayo, ikawa kwamba Yesu alikuwa akisafiri kutoka mji mmoja hadi mwingine na kutoka kijiji kimoja hadi kingine[a], akihubiri na kutangaza habari njema ya ufalme wa Mungu[b]. Wale Kumi na Wawili walikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akipitia mji mmoja baada ya mwingine na kijiji kimoja baada ya kingine.”
    reason: lexical_alternative
  - marker: b
    text: Au, “utawala wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Baada ya hayo, ikawa kwamba
  rationale: Muundo huu unahifadhi kiashirio cha simulizi ἐγένετο na kuonyesha mfuatano wa matukio bila kudai kwa nguvu kwamba muda ulikuwa mfupi sana.
- source_word: αὐτὸς
  choice: Yesu
  rationale: Ingawa Kigiriki kina kiwakilishi cha nafsi, kutaja Yesu kwa jina kunafanya rejeleo liwe wazi na la kawaida katika Kiswahili, kwa kuwa aya inaanza sehemu mpya.
- source_word: διώδευεν
  choice: alikuwa akisafiri
  rationale: Muundo wa wakati unaoendelea unaakisi hali ya tendo la kudumu au kurudiwa inayowasilishwa na imperfekti ya Kigiriki.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: kutoka mji mmoja hadi mwingine na kutoka kijiji kimoja hadi kingine
  rationale: 'Hii inawasilisha nguvu ya mgawanyo ya κατά pamoja na nomino za umoja: kusafiri mahali pamoja baada ya pengine.'
- source_word: κηρύσσων
  choice: akihubiri
  rationale: Katika muktadha huu neno linaonyesha kutangaza ujumbe hadharani; “akihubiri” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: εὐαγγελιζόμενος
  choice: kutangaza habari njema
  rationale: Uteuzi huu unatofautisha kitenzi hiki na κηρύσσων na kuhifadhi dhana yake ya kuleta au kutangaza habari njema.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi mpana na wa kawaida unaoweza kujumuisha utawala wa Mungu na eneo au hali ya ufalme wake bila kuufanya uwe dhana moja tu.
- source_word: οἱ δώδεκα
  choice: Wale Kumi na Wawili
  rationale: Inahifadhi jina la kundi linalotambulika bila kuongeza “wanafunzi” au “mitume,” maneno ambayo hayapo katika aya hii.
- source_word: σὺν αὐτῷ
  choice: walikuwa pamoja naye
  rationale: Hii inawasilisha wazi maana ya kuandamana na Yesu na kukamilisha kishazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: “Ufalme wa Mungu” huhifadhi upana wa maana ya βασιλεία, ambayo inaweza kuelekeza kwenye utawala wenyewe na pia uhalisi wa ufalme, badala ya kuibana iwe “utawala” pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa ili isomeke kwa urahisi, huku mwendelezo wa tendo na tofauti kati ya κηρύσσων na εὐαγγελιζόμενος vikihifadhiwa.
source_grounding:
  english_pob_role: consult_only
