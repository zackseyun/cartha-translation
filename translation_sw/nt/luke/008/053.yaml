  text: And they were laughing at him, because they knew that she had died.
translation:
  language: sw
  text: Nao walikuwa wakimcheka, kwa sababu walijua kwamba alikuwa amekufa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: walikuwa wakimcheka
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea, huku kitenzi hiki kikibeba maana ya kumcheka mtu kwa dharau.
- source_word: αὐτοῦ
  choice: -m- katika “wakimcheka”
  rationale: Kiwakilishi hiki ni yambwa la mtu aliyechekwa; Kiswahili hukionyesha kiasili kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: εἰδότες
  choice: kwa sababu walijua
  rationale: Ingawa ni umbo la kushiriki linaloweza kutafsiriwa “wakijua,” katika muktadha linaeleza sababu ya wao kumcheka Yesu; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa neno hili linaanzisha yaliyomo katika jambo walilojua, si sababu nyingine.
- source_word: ἀπέθανεν
  choice: alikuwa amekufa
  rationale: Kitenzi kinaonyesha tukio la kufa lililokuwa limekwisha kabla ya wao kumcheka; wakati timilifu wa Kiswahili unaonyesha mpangilio huo wa kisimulizi.
theological_decisions:
- issue: Iwapo kumtaja wazi msichana ingawa Kigiriki hakina nomino katika kishazi hiki
  choice: Kutumia “alikuwa amekufa,” huku mhusika akieleweka kutokana na muktadha
  alternative: “msichana alikuwa amekufa” au “mtoto alikuwa amekufa”
  rationale: Kigiriki kina kitenzi cha nafsi ya tatu umoja bila nomino iliyotajwa wazi. Kiswahili pia kinaweza kuhifadhi ufupi huo bila kuongeza neno lisilokuwamo katika kishazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walikuwa wakimcheka” hudumisha hali ya tendo lililokuwa likiendelea na pia maana ya dharau; “Nao” huunganisha mstari huu kwa kawaida na simulizi lililotangulia.
