  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: sw
  text: Alipofika katika nyumba ile, hakumruhusu mtu yeyote aingie pamoja naye isipokuwa Petro, Yohana, Yakobo, na baba na mama wa msichana huyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoto.” Neno la Kigiriki linaweza kumaanisha mtoto kwa ujumla, lakini muktadha unamtambulisha mtoto huyo kuwa msichana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν ... εἰς τὴν οἰκίαν
  choice: Alipofika nyumbani
  rationale: Kirai hiki kinaonyesha tukio lililotangulia kwa wakati. “Alipofika nyumbani” ni Kiswahili cha kawaida kinachowasilisha kufika kwake katika nyumba hiyo bila tafsiri ngumu ya neno kwa neno.
- source_word: οὐκ ἀφῆκεν
  choice: hakumruhusu
  rationale: Katika muktadha huu ἀφίημι humaanisha kuruhusu. Umbo la umoja linaendana na “mtu yeyote,” huku maana ikihusu watu wote wengine.
- source_word: εἰσελθεῖν τινα σὺν αὐτῷ
  choice: mtu yeyote kuingia pamoja naye
  rationale: Katika sentensi hasi, τινα lina maana ya jumla ya “mtu yeyote”; σὺν αὐτῷ linaeleza kuingia pamoja na Yesu.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Baada ya kauli hasi, kirai hiki kinaonyesha waliotengwa na katazo, si sharti.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petro, Yohana, Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili. Orodha ya Kiswahili haitaji kurudia “na” kati ya kila jina.
- source_word: τῆς παιδὸς
  choice: msichana
  rationale: παῖς linaweza kumaanisha mtoto kwa ujumla, lakini hapa linaambatana na kibainishi cha kike, na muktadha unamtambulisha mtoto huyo kuwa binti wa Yairo.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: baba yake msichana ... na mama yake
  rationale: Tafsiri hii inawataja baba na mama mmoja mmoja kama Kigiriki, badala ya kuwajumlisha kwa neno “wazazi,” na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Umahususi wa παῖς katika muktadha
  choice: msichana
  alternative: mtoto
  rationale: Hakuna hoja ya kimadhehebu inayohusika. Ingawa nomino παῖς inaweza kuwa ya jumla, kibainishi cha kike na muktadha wa binti wa Yairo vinaunga mkono “msichana,” huku tafsiri pana zaidi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Nyumbani” hapa linarejelea nyumba iliyotajwa katika tukio, si lazima makao ya kudumu ya Yesu.
