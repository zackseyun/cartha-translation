base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: sw
  text: Lakini yeye akamshika mkono, akaita kwa sauti, akisema, “Mtoto, inuka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Lakini yeye
  rationale: δὲ inaonyesha geuko dogo katika simulizi, huku αὐτός ikiwakilishwa wazi kwa ‘yeye’ bila kuongeza mkazo wa ‘mwenyewe’.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: akamshika mkono
  rationale: Hii ni njia ya kawaida na ya asili katika Kiswahili ya kueleza tendo la kuushika mkono wake, bila ukali unaoweza kudokezwa na ‘kukamata kwa nguvu’.
- source_word: ἐφώνησεν
  choice: akaita kwa sauti
  rationale: Kitenzi kinaonyesha mwito uliotolewa kwa sauti inayosikika; ‘akaita kwa sauti’ ni wazi bila kudokeza kilio cha huzuni.
- source_word: λέγων
  choice: akisema
  rationale: Inahifadhi kirai shiriki kinachoanzisha maneno ya moja kwa moja na ni cha asili katika usimulizi wa Kiswahili.
- source_word: Ἡ παῖς
  choice: Mtoto
  rationale: παῖς inaweza kumaanisha mtoto kwa ujumla au msichana katika muktadha huu. ‘Mtoto’ huhifadhi upana huo wa maana na sauti ya upole bila kuingiza maneno ya masimulizi sambamba.
- source_word: ἔγειρε
  choice: inuka
  rationale: Amri hii ya moja kwa moja inaweza kumaanisha kuinuka au kuamka. ‘Inuka’ ni ya sasa, yenye heshima, na inafaa katika muktadha wa kurudishwa kwa uhai.
theological_decisions:
- issue: Namna Yesu anavyomwita binti huyo
  choice: Mtoto
  alternative: Msichana
  rationale: ‘Mtoto’ huhifadhi uwezekano wa maana wa παῖς, ilhali muktadha unaonyesha kwamba mtoto huyo ni wa kike; tafsiri haipaswi kuoanisha kimyakimya na maneno ya masimulizi sambamba.
- issue: Tafsiri ya amri ἔγειρε
  choice: inuka
  alternative: amka
  rationale: ‘Inuka’ huhifadhi amri ya kuinuka na pia inafaa katika tukio la kurudishwa kwa uhai, bila kulazimisha maana finyu ya kuamka usingizini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa simulizi la Kigiriki lakini inaepuka muundo mzito au wa kizamani.
