  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: sw
  text: Wazazi wake wakastaajabu, lakini yeye akawaagiza wasimwambie mtu yeyote jambo lililotokea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστησαν
  choice: wakastaajabu
  rationale: Kitenzi hiki hapa kinaonyesha kushikwa na mshangao mkubwa. “Wakastaajabu” ni Kiswahili cha kawaida chenye hadhi na kinadumisha nguvu ya mwitikio bila kuongeza wazo lisilo wazi la kupoteza fahamu.
- source_word: γονεῖς
  choice: wazazi
  rationale: Hili ndilo neno la moja kwa moja na la kawaida la Kiswahili kwa wazazi wa mtoto.
- source_word: παρήγγειλεν
  choice: akawaagiza
  rationale: Kitenzi kina nguvu ya kutoa agizo au amri. “Akawaagiza” kinahifadhi uzito wa maelekezo bila kudokeza ukali usiotajwa katika muktadha.
- source_word: μηδενὶ
  choice: mtu yeyote
  rationale: Pamoja na ukanushi katika “wasimwambie,” usemi huu unatoa kwa kawaida maana ya kutomwambia mtu yeyote.
- source_word: εἰπεῖν
  choice: wasimwambie
  rationale: Kwa kuwa kuna yambwa ya mtu, Kiswahili cha kawaida hutumia “kumwambia” badala ya “kusema.” Muundo wa ukanushi unalingana na katazo la Kigiriki.
- source_word: τὸ γεγονός
  choice: jambo lililotokea
  rationale: Kirai hiki ni participio timilifu iliyotumiwa kama nomino na kinarejelea tukio lililokuwa limetokea. “Jambo lililotokea” ni wazi na kinadumisha kwa kiasi muundo halisi wa chanzo.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji mdogo kati ya mshangao wa wazazi na agizo la Yesu.
theological_decisions:
- issue: Usiri wa Kimasihi na upeo wa agizo la Yesu
  choice: Kutafsiri moja kwa moja kuwa aliwaagiza wasimwambie mtu yeyote jambo lililotokea.
  alternative: Kulieleza kama amri mahsusi ya usiri wa Kimasihi au kama agizo la muda na lenye upeo mdogo.
  rationale: Mstari wenyewe hautoi sababu, muda, wala mipaka ya agizo. Tafsiri haipaswi kuingiza maelezo ya kitheolojia ambayo hayajasemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. “Wakastaajabu” na “akawaagiza” ni maneno ya kawaida katika simulizi la kibiblia bila kuwa ya kizamani. Hakuna tanbihi iliyohitajika kwa kuwa mbadala za kileksika zinaweza kuwakilishwa vya kutosha katika matini.
