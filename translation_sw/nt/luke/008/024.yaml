  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: sw
  text: Basi wakamwendea, wakamwamsha wakisema, “Bwana, Bwana, tunaangamia!” Naye alipoamka, akakemea upepo na msukosuko wa maji; upepo na msukosuko wa maji vikakoma, kukawa shwari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: wakamwendea
  rationale: Inaonyesha kwamba walimsogelea Yesu, huku tendo hilo likitangulia na kuandamana kwa kawaida na kumwamsha.
- source_word: διήγειραν
  choice: wakamwamsha
  rationale: Ni Kiswahili cha sasa na cha kawaida kwa tendo la kumtoa mtu usingizini.
- source_word: Ἐπιστάτα
  choice: Mkuu
  rationale: Katika Luka ni jina la heshima linalotambua mamlaka ya Yesu; “Mkuu” huhifadhi wazo hilo bila kulifanya kuwa cheo cha kidini kisichomo katika matini.
- source_word: ἀπολλύμεθα
  choice: tunaangamia
  rationale: Huhifadhi hali inayoendelea na uzito wa hatari ya kifo iliyokuwa karibu.
- source_word: διεγερθεὶς
  choice: alipoamka
  rationale: Ni uwasilishaji wa kawaida wa kishiriki hiki katika Kiswahili, bila kusisitiza isivyohitajika iwapo aliamka mwenyewe au aliamshwa.
- source_word: ἐπετίμησεν
  choice: akaukemea
  rationale: Huhifadhi nguvu ya amri yenye mamlaka ambayo kitenzi hiki huwa nayo katika masimulizi ya Injili.
- source_word: ἀνέμῳ
  choice: upepo
  rationale: Ni maana ya moja kwa moja ya neno la Kiyunani bila kuongeza dhana ya dhoruba ndani ya neno lenyewe.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: msukosuko wa maji
  rationale: “Msukosuko” huonyesha mchafuko na mawimbi makali ya maji huku ikihifadhi muundo unaotaja maji badala ya kuufupisha kuwa “mawimbi” pekee.
- source_word: ἐπαύσαντο
  choice: navyo vikakoma
  rationale: Kiambishi cha wingi hurejelea upepo na msukosuko wa maji kama mambo mawili yaliyounganishwa, sawasawa na kitenzi cha wingi cha Kiyunani.
- source_word: ἐγένετο γαλήνη
  choice: kukawa shwari
  rationale: Ni Kiswahili cha asili kinachoeleza hali ya utulivu iliyotokea baada ya upepo na maji kukoma.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la kumwita Yesu Ἐπιστάτα
  choice: Mkuu
  alternative: Mwalimu
  rationale: “Mkuu” huonyesha heshima na mamlaka yanayotambuliwa katika jina hili la pekee kwa Luka, bila kulipunguza kuwa jukumu la kufundisha tu.
- issue: Mamlaka ya Yesu juu ya uumbaji katika ἐπετίμησεν
  choice: akaukemea
  alternative: akauamuru kwa ukali
  rationale: “Akaukemea” huhifadhi lugha yenye nguvu ya matini kuhusu mamlaka ya Yesu juu ya upepo na maji bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi ni mwepesi lakini unahifadhi mfuatano, wingi wa ἐπαύσαντο, na nguvu ya ἐπετίμησεν.
