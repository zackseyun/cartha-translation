  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: sw
  text: 'Yule mtu ambaye pepo walikuwa wamemtoka aliendelea kumsihi Yesu awe pamoja naye; lakini Yesu akamtuma aende zake, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: aliendelea kumsihi
  rationale: Kauli ya wakati usiotimilifu huonyesha ombi lililoendelea au kurudiwa; “aliendelea kumsihi” ni ya kawaida na huhifadhi uzito wa ombi.
- source_word: ὁ ἀνὴρ
  choice: yule mtu
  rationale: Inamrejelea mtu wa kiume aliyetajwa tayari; “yule mtu” ni ya asili katika masimulizi ya Kiswahili bila kupoteza rejeo hilo.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: ambaye pepo walikuwa wamemtoka
  rationale: Muundo huu huhifadhi kwamba kutoka kwa pepo kulitokea kabla ya ombi. “Walikuwa wamemtoka” ni Kiswahili cha kawaida kinachofaa muktadha wa kutoa pepo.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: “Pepo” ndilo neno la kawaida la Kiswahili kwa viumbe hawa wa kiroho katika muktadha wa Agano Jipya, bila kupunguza dai la simulizi.
- source_word: εἶναι σὺν αὐτῷ
  choice: awe pamoja naye
  rationale: Ni tafsiri ya moja kwa moja na ya asili, bila kuongeza maana ya kuandamana au kubaki ambayo haijaelezwa wazi.
- source_word: ἀπέλυσεν
  choice: akamruhusu aende zake
  rationale: Katika muktadha huu Yesu hakukubali ombi la mtu huyo bali alimwagiza aondoke. Usemi huu ni wa asili kuliko “akamfukuza,” ambao ungeongeza ukali usiokuwamo lazima katika kitenzi.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi umbo la kitenzi-shirikishi kinachoanzisha maneno yanayofuata na ni laini katika masimulizi ya Kiswahili.
theological_decisions:
- issue: Maana ya τὰ δαιμόνια katika simulizi la kutoa pepo
  choice: pepo
  alternative: roho waovu
  rationale: Neno “pepo” linahifadhi rejeo la moja kwa moja kwa viumbe wa kiroho wanaotajwa katika matini, badala ya kulifanya kuwa maelezo ya jumla.
- issue: Mtendaji wa ἀπέλυσεν ambaye hakutajwa kwa jina katika aya hii
  choice: Yesu
  alternative: akamruhusu aende zake
  rationale: Muktadha unatambulisha wazi kwamba anayesihiwa na anayemruhusu mtu aende ni Yesu. Kutaja jina huepusha utata wa viwakilishi katika Kiswahili, ingawa Kigiriki kina kiwakilishi kinachoeleweka kwa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika katika aya hii.
