  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: sw
  text: Alipotua nchi kavu,[a] mtu mmoja kutoka mjini aliyekuwa na mapepo alikutana naye. Kwa muda mrefu alikuwa hajavaa nguo,[b] na hakuishi katika nyumba, bali makaburini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliposhuka na kufika nchi kavu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hakuwa amevaa vazi lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: Aliposhuka na kukanyaga nchi kavu
  rationale: Muundo wa kirai tegemezi unaonyesha wakati na unamhusu Yesu. Tafsiri hii inaweka wazi kushuka kwake kutoka chomboni bila kuingiza neno lisilosemwa wazi kama ‘ufukwe’.
- source_word: ὑπήντησεν
  choice: alikutana naye
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo la kukutana moja kwa moja.
- source_word: ἀνήρ τις
  choice: mtu mmoja
  rationale: ‘Mtu mmoja’ huakisi kutokutajwa kwa jina kunakoletwa na τις na ni simulizi la kawaida la Kiswahili; muktadha unaonyesha kuwa ni mwanamume.
- source_word: ἐκ τῆς πόλεως
  choice: kutoka mjini
  rationale: Hueleza asili au uhusiano wa mtu huyo na mji kwa Kiswahili cha kawaida.
- source_word: ἔχων δαιμόνια
  choice: aliyekuwa na pepo
  rationale: Inafuata kwa karibu maana halisi ya ‘kuwa na pepo’ bila kuongeza dhana yenye nguvu zaidi ya kumilikiwa.
- source_word: χρόνῳ ἱκανῷ
  choice: kwa muda mrefu
  rationale: Huwasilisha kwa lugha ya asili ya Kiswahili kipindi kikubwa cha muda.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: hakuwa amevaa nguo
  rationale: Huwasilisha hali iliyodumu ya kutovaa nguo kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: wala hakuwa akikaa nyumbani
  rationale: Kauli ya mazoea ‘hakuwa akikaa’ inaakisi hali endelevu ya kitenzi cha Kigiriki; ‘nyumbani’ ni ya kawaida kuliko ‘katika nyumba’ hapa.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: bali makaburini
  rationale: ‘Makaburini’ ni usemi wa kawaida unaotaja mahali pa maziko bila kulazimisha kwamba alikuwa ndani ya kaburi moja.
theological_decisions:
- issue: Tafsiri ya δαιμόνια katika muktadha wa mateso ya kiroho
  choice: pepo
  alternative: roho wachafu
  rationale: Neno la chanzo ni δαιμόνια, si πνεύματα ἀκάθαρτα; ‘pepo’ ndilo neno la moja kwa moja na huepuka kuchanganya misemo miwili tofauti.
- issue: Iwapo ἔχων δαιμόνια itafsiriwe kwa usemi wa kumilikiwa
  choice: aliyekuwa na pepo
  alternative: aliyepagawa na pepo
  rationale: Chanzo kinasema kihalisi kwamba alikuwa ‘na pepo.’ Tafsiri iliyochaguliwa huhifadhi kauli hiyo bila kuamua zaidi namna ya uhusiano wao naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa kwa uwazi wa simulizi; viunganishi ‘wala’ na ‘bali’ vinadumisha mfululizo na utofautishaji wa Kigiriki.
