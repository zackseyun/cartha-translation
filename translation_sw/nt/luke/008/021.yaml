  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: sw
  text: Lakini akajibu, akawaambia, “Mama yangu na ndugu zangu wa kiume[a] ni wale wanaolisikia neno la Mungu na kulitenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya jumla, “ndugu zangu.” Kigiriki husema “ndugu wa kiume,” ingawa matumizi ya kauli hii yanaweza kuwahusu pia wengine zaidi ya wanaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: Lakini akajibu, akawaambia
  rationale: Inahifadhi kiunganishi δέ pamoja na jozi ya kisimulizi ‘akajibu, akasema kwao,’ lakini ‘akawaambia’ ni Kiswahili cha kawaida kinachoonyesha wazi walengwa wa maneno.
- source_word: Μήτηρ μου
  choice: Mama yangu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino ya umoja pamoja na kiwakilishi cha umilikaji.
- source_word: ἀδελφοί μου
  choice: ndugu zangu[a]
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linalofaa katika muktadha wa uhusiano wa kifamilia; tanbihi inaonyesha kwamba umbo la Kigiriki ni la kiume na linaweza kutafsiriwa ‘ndugu zangu wa kiume.’
- source_word: οὗτοί εἰσιν οἱ
  choice: ni wale wanao-
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida kundi linalofafanuliwa na vitenzi vinavyofuata, bila urudiaji usio wa kawaida wa ‘hawa ... wale.’
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Inahifadhi muundo wa Kigiriki na istilahi yenye uzito wa kibiblia, huku ikibaki wazi kwa wasomaji wa kawaida.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: wanaolisikia ... na kulitenda
  rationale: Vitenzi vya wakati wa sasa vinaonyesha sifa inayoendelea ya kundi hilo. ‘Kulitenda’ huhifadhi maana ya kufanya au kutekeleza neno bila kuibana kuwa utii pekee.
theological_decisions:
- issue: Upeo wa familia ambayo Yesu anaitambulisha
  choice: Kauli inawatambulisha mama na ndugu za Yesu kuwa wale wanaolisikia neno la Mungu na kulitenda, bila kusema kwamba ameikataa familia yake ya kuzaliwa.
  alternative: Kuitafsiri kauli kama kukataa kabisa mama na ndugu zake wa kuzaliwa.
  rationale: Andiko linapanua dhana ya uhusiano wa kifamilia kwa msingi wa kuitikia neno la Mungu, lakini halisemi wazi kwamba Yesu anaikana familia yake ya damu.
- issue: Upeo wa ἀδελφοί
  choice: Kutumia ‘ndugu zangu’ katika matini na kueleza umbo la kiume katika tanbihi.
  alternative: Kutumia ‘ndugu zangu wa kiume’ katika matini kuu.
  rationale: Kigiriki ni wingi wa kiume na kinawakumbusha wasomaji ndugu zake halisi wa kiume, lakini matumizi ya kauli yanaweza kwenda zaidi ya wanaume pekee. Kiswahili ‘ndugu’ huhifadhi kwa kiasi fulani upana huo bila kulazimisha hitimisho la kitheolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo ‘akajibu, akawaambia’ umehifadhi ladha ya kisimulizi ya chanzo; ‘ni wale wanao-’ umechaguliwa badala ya muundo mgumu wa ‘ndio hawa: wale ambao.’'
