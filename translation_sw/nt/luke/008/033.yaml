  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: sw
  text: Ndipo wale pepo wakamtoka yule mtu na kuwaingia wale nguruwe. Kundi hilo likateremka kwa kasi mteremko mkali[a] hadi ziwani, likazama na kufa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuteremka jabali” au “kupita ukingo wa mteremko”; neno la Kigiriki linaweza kumaanisha mteremko wenye ukali mkubwa.
    reason: Huonyesha uwezekano wa taswira ya jabali au ukingo mkali bila kudai kwamba eneo hilo lilikuwa jabali lililonyooka.
lexical_decisions:
- source_word: ἐξελθόντα
  choice: wakamtoka
  rationale: Kauli hii inaonyesha kwamba pepo walitoka ndani ya mtu, na umbo la mfuatano linaunganisha tendo hili kwa kawaida na tendo kuu lililofuata.
- source_word: τὰ δαιμόνια
  choice: wale pepo
  rationale: Neno la Kigiriki linamaanisha pepo, si usemi mpana zaidi ‘roho wachafu’; ‘wale’ huwarejelea pepo waliotajwa katika muktadha.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: yule mtu
  rationale: Kiambishi cha yambwa katika ‘wakamtoka’ pamoja na ‘yule mtu’ kinaonyesha kwa kawaida kwamba walitoka ndani ya mtu aliyekuwa ametajwa.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: kuwaingia wale nguruwe
  rationale: Huu ni usemi wa Kiswahili wa kawaida unaoonyesha kuingia ndani ya wanyama hao bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: χοίρους
  choice: nguruwe
  rationale: ‘Nguruwe’ ni neno la kawaida, sahihi na linaloeleweka katika Kiswahili cha sasa.
- source_word: ὥρμησεν
  choice: likakimbia kwa kasi
  rationale: Usemi huu unaonyesha mwendo wa ghafula na wenye nguvu wa kundi bila kudokeza sababu au nia yake.
- source_word: ἡ ἀγέλη
  choice: kundi hilo
  rationale: ‘Kundi’ ni jina la kawaida la mkusanyiko wa wanyama, na ‘hilo’ huunganisha wazi na wale nguruwe.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: kuteremka mteremko mkali[a]
  rationale: Tafsiri hii huhifadhi mwendo wa kuelekea chini na hali ya eneo kuwa lenye mwinuko mkali bila kulazimisha picha ya jabali lililonyooka kabisa.
- source_word: λίμνην
  choice: ziwa
  rationale: λίμνη humaanisha ziwa; hivyo ‘ziwani’ huhifadhi uchaguzi wa neno la Luka badala ya ‘baharini.’
- source_word: ἀπεπνίγη
  choice: likazama
  rationale: Katika muktadha wa kundi kuingia ziwani, kitenzi hiki kinaonyesha kwamba kundi lilikufa kwa kuzama; ‘likazama’ ni usemi mfupi na wa kawaida wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya δαιμόνια katika simulizi la mtu aliyekuwa na pepo
  choice: pepo
  alternative: roho wachafu
  rationale: Maandishi hapa yanatumia δαιμόνια, hivyo tafsiri inadumisha tofauti yake ya kileksia na usemi mwingine wa Kigiriki unaomaanisha ‘roho wachafu.’
- issue: Kiwango cha umahususi wa κρημνός
  choice: mteremko mkali
  alternative: jabali; genge
  rationale: Neno hilo linaonyesha sehemu yenye mwinuko mkali kuelekea chini, lakini si lazima liwe jabali lililonyooka; tafsiri hii haiongezi hali ya eneo kuliko maandishi yanavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zinaboresha uwazi wa mfuatano wa matukio. ‘Wakamtoka’ na ‘kuwaingia’ ni miundo ya kawaida inayobeba kwa ufupi mwendo wa kutoka ndani ya mtu na kuingia ndani ya nguruwe.
