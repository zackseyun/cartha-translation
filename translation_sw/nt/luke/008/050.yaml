  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: sw
  text: Lakini Yesu aliposikia hayo, akamjibu, “Usiogope; amini tu[a], naye ataokolewa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe na imani tu” au “tegemea tu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ataponywa” au “atakuwa mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kunusuru, au kuponya; katika muktadha huu kinahusisha kurejeshwa kutoka ukingoni mwa kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kitenzi-tegemezi cha wakati uliopita kinaonyesha tendo lililotangulia; “hayo” linaweka wazi jambo lililosikiwa kutokana na muktadha bila kuongeza maana mpya.
- source_word: ἀπεκρίθη αὐτῷ
  choice: akamjibu
  rationale: Ni Kiswahili cha kawaida na fasaha kinachoonyesha wazi kwamba Yesu alimjibu Yairo.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Huhifadhi katazo la moja kwa moja na uzito wa agizo la Yesu kwa lugha ya kawaida.
- source_word: μόνον πίστευσον
  choice: amini tu
  rationale: “Tu” linaonyesha upekee unaoletwa na μόνον, huku “amini” likitoa agizo la πιστεύω kwa ufupi na kawaida.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Huhifadhi upana wa σῴζω, ambalo linaweza kumaanisha kuokoa, kuponya, au kurejesha hali njema; muktadha unahusu kuokolewa kutoka kifoni.
theological_decisions:
- issue: Tafsiri ya πιστεύω katika agizo la Yesu
  choice: amini
  alternative: kuwa na imani; tumaini
  rationale: “Amini” ndilo neno la moja kwa moja kwa πιστεύω, lakini tanbihi huhifadhi maana ya kumtegemea au kumtumaini Yesu, si kukubali jambo kiakili tu.
- issue: Tafsiri ya σωθήσεται katika muktadha wa ugonjwa na kifo
  choice: ataokolewa
  alternative: ataponywa; atakuwa mzima
  rationale: “Ataokolewa” huhifadhi uhusiano mpana wa kileksia wa σῴζω badala ya kuifupisha maana kuwa uponyaji wa mwili pekee. Njia nyingine zinazolingana na muktadha zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “aliposikia hayo, akamjibu” ni wa kawaida katika simulizi, na “naye ataokolewa” huweka wazi kuwa anayelengwa ni binti bila kulazimika kurudia nomino.
