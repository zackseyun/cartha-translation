  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: sw
  text: Nyingine ikaanguka juu ya mwamba[a], na baada ya kuchipua, ikanyauka kwa sababu haikuwa na unyevunyevu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mwamba.” Kigiriki kina neno la umoja “mwamba,” kikihifadhi taswira ya mbegu kutua juu ya uso wa mwamba badala ya kutumia usemi mpana “ardhi yenye mawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Nyingine
  rationale: Kivumishi hiki cha umoja kisicho na nomino kinarejelea mbegu nyingine katika mfululizo wa mfano; “nyingine” ni ya kawaida na huacha nomino “mbegu” ieleweke kutokana na muktadha.
- source_word: κατέπεσεν
  choice: ikaanguka
  rationale: Huwasilisha kwa kawaida tendo la mbegu kuanguka, bila kuongeza msisitizo usiokuwapo katika Kigiriki.
- source_word: ἐπὶ τὴν πέτραν
  choice: juu ya mwamba
  rationale: πέτρα ni umoja, “mwamba,” si usemi mpana “ardhi yenye mawe”; “juu ya” huhifadhi taswira ya mbegu kutua kwenye uso wa mwamba.
- source_word: φυὲν
  choice: baada ya kuchipua
  rationale: Kauli shirikishi hutangulia kitenzi kikuu kwa wakati; usemi huu huonyesha wazi mfuatano wa mbegu kuchipua kisha kunyauka.
- source_word: ἐξηράνθη
  choice: ikanyauka
  rationale: Katika muktadha wa mmea, “kunyauka” ni Kiswahili cha kawaida kinachoonyesha kukauka na kufa kwa kukosa unyevu.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: kwa sababu haikuwa na
  rationale: διά pamoja na infinitivu yenye kibainishi huonyesha sababu; tafsiri hii huhifadhi uhusiano huo wa kisababishi kwa lugha ya kawaida.
- source_word: ἰκμάδα
  choice: unyevunyevu
  rationale: Neno hili humaanisha unyevu unaohitajika kwa ukuaji; “unyevunyevu” ni wazi na haliongezi wazo mahususi la utomvu.
theological_decisions: []
