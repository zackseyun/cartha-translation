  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: sw
  text: Basi watu wakatoka kwenda kuona yaliyotokea. Wakaja kwa Yesu, wakamkuta yule mtu ambaye pepo walikuwa wamemtoka[a], ameketi miguuni pa Yesu, amevaa nguo na ana akili timamu[b]. Nao wakaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala za kale zina kitenzi cha wingi, yaani, “pepo walikuwa wamemtoka.” Matini iliyochapishwa ina kitenzi cha umoja pamoja na kiima cha wingi, lakini maana haibadiliki.
    reason: textual_variant
  - marker: b
    text: Au “anafikiri sawasawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wakatoka
  rationale: Kitenzi hiki kinaonyesha watu wakitoka walikokuwa ili kwenda kuchunguza tukio; “wakatoka” ni simulizi la kawaida na la moja kwa moja.
- source_word: τὸ γεγονός
  choice: yaliyotokea
  rationale: Kivumishi-tendo cha wakati timilifu kilichotumiwa kama nomino kinamaanisha jambo lililokwisha kutokea; “yaliyotokea” ni Kiswahili cha asili na wazi.
- source_word: τὸν ἄνθρωπον
  choice: yule mtu
  rationale: Muktadha unamtambulisha mwanamume maalumu aliyetajwa tayari; “yule mtu” hudumisha rejeo hilo kwa kawaida.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: ambaye pepo walikuwa wamemtoka
  rationale: Wakati uliopita timilifu unaonyesha kuwa kutoka kwa pepo kulitangulia kumkuta kwao. Muundo huu pia unaonyesha wazi kuwa pepo walimtoka mtu huyo.
- source_word: δαιμόνια
  choice: pepo
  rationale: Katika muktadha huu “pepo” ni neno la kawaida la Kiswahili kwa viumbe waovu wa kiroho wanaotolewa kwa mtu, bila kupunguza simulizi kuwa ugonjwa au sitiari.
- source_word: ἱματισμένον
  choice: amevaa nguo
  rationale: Hali yake ya sasa inatofautishwa na uchi wake wa awali; “amevaa nguo” ni wazi na ya kawaida kuliko tafsiri ngumu ya neno kwa neno.
- source_word: σωφρονοῦντα
  choice: ana akili timamu
  rationale: Kirai hiki kinaeleza kurejea kwa uwezo wa kufikiri na kujitawala kwa utulivu, bila kuingiza istilahi za kisasa za kitabibu.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: miguuni pa Yesu
  rationale: Hii ni njia ya kawaida na yenye hadhi ya kueleza mahali alipoketi karibu na miguu ya Yesu; haiongezi kwa lazima maana ya uanafunzi au kujisalimisha.
theological_decisions:
- issue: Maana ya δαιμόνια katika simulizi la kutoa pepo
  choice: pepo
  alternative: roho waovu
  rationale: “Pepo” huhifadhi uhalisia wa viumbe wa kiroho katika simulizi na ni neno linaloeleweka kwa wasomaji wa Kiswahili; halibadili tukio kuwa ugonjwa wa kawaida au sitiari.
- issue: Maana ya σωφρονοῦντα baada ya pepo kutoka
  choice: ana akili timamu
  alternative: anafikiri sawasawa
  rationale: Tafsiri hii inaonyesha kurudishwa kwa utimamu wa mawazo na kujitawala, huku ikiepuka utambuzi maalumu wa kitabibu ambao maandishi hayataji.
- issue: Umbo la kitenzi ἐξῆλθεν pamoja na kiima cha wingi τὰ δαιμόνια
  choice: pepo walikuwa wamemtoka
  alternative: pepo alikuwa amemtoka
  rationale: Kiswahili huhitaji upatanisho wa kawaida wa wingi. Tofauti ya hati kuhusu kitenzi cha umoja au wingi imeelezwa katika tanbihi bila kubadili maana ya msingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kigiriki imegawanywa kwa upole ili simulizi lisomeke kwa urahisi bila kuondoa uhusiano wa matukio.
