base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: sw
  text: Mbegu nyingine ikaanguka katikati ya miiba, na miiba ikakua pamoja nayo, ikaizonga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: Mbegu nyingine
  rationale: Kivumishi hiki cha umoja wa kati kimetumiwa kama nomino na katika muktadha kinarejelea mbegu; kutaja “mbegu” huifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: ἔπεσεν
  choice: ikaanguka
  rationale: Huhifadhi tendo rahisi la kisimulizi na huunganisha tukio hili kwa mtiririko wa mfano.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: katikati ya miiba
  rationale: Huwakilisha moja kwa moja wazo la kuwa ndani au miongoni mwa mimea yenye miiba, kwa lugha ya kawaida ya Kiswahili.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: miiba
  rationale: Katika picha hii ya kilimo, “miiba” ni neno la kawaida linaloweza kumaanisha mimea yenye miiba bila kulazimisha aina maalumu ya kichaka.
- source_word: συμφυεῖσαι
  choice: ikakua pamoja nayo
  rationale: Huhifadhi maana ya miiba kukua sambamba na mbegu; “nayo” inarejelea mbegu na inapatana na ngeli yake.
- source_word: ἀπέπνιξαν
  choice: kuisonga
  rationale: “Kusonga” ni usemi wa kawaida wa Kiswahili kwa mimea mingine kuzuia ukuaji wa mmea kwa kuibana au kuinyima nafasi na rasilimali, na huhifadhi sitiari ya kunyonga.
- source_word: αὐτό
  choice: -i- katika “kuisonga”
  rationale: Kiambishi cha yambwa cha ngeli ya mbegu kinarejelea mbegu kwa njia ya asili katika Kiswahili.
