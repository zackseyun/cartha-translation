  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Mtu fulani amenigusa, kwa maana nilitambua kwamba nguvu zimetoka kwangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Mtu fulani amenigusa
  rationale: Huhifadhi mhusika asiyeainishwa (τις) na kitendo cha kugusa kilichokamilika (ἥψατο) kwa Kiswahili cha kawaida.
- source_word: ἔγνων
  choice: nilijua
  rationale: Kitenzi hiki hapa kinaeleza ufahamu wa Yesu kwamba nguvu zilikuwa zimetoka kwake; “nilijua” hufuata maana ya msingi bila kuongeza namna alivyotambua.
- source_word: δύναμιν
  choice: nguvu
  rationale: “Nguvu” ni neno la kawaida na lenye hadhi kwa δύναμις katika muktadha wa nguvu ya kuponya.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: zimetoka kwangu
  rationale: 'Huwakilisha hali iliyotokana na kitendo kilichotimia: nguvu zilikuwa zimetoka kwa Yesu. Upatanisho wa ngeli wa “nguvu” katika Kiswahili sanifu ni “zimetoka”.'
theological_decisions:
- issue: Jinsi Yesu alivyofahamu kutoka kwa nguvu
  choice: nilijua kwamba nguvu zimetoka kwangu
  alternative: nilihisi kwamba nguvu zimetoka kwangu
  rationale: ἔγνων humaanisha “nilijua/nilitambua,” si lazima hisia ya kimwili; tafsiri haiongezi maelezo ambayo maandishi hayatoi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa moja kwa moja wa usemi umehifadhiwa bila istilahi za kimadhehebu.
