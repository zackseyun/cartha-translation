  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: sw
  text: Mpanzi alitoka kwenda kupanda mbegu zake. Alipokuwa akipanda, baadhi ya mbegu zilianguka kando ya njia, zikakanyagwa, na ndege wa angani wakazila kabisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: alitoka
  rationale: Kitenzi hiki katika wakati uliopita kinaonyesha kuwa mpanzi aliondoka kwenda kufanya kazi yake; “alitoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ὁ σπείρων
  choice: mpanzi
  rationale: Kivumishi-tendo chenye kibainishi kimetumiwa kama nomino; “mpanzi” ni neno la kawaida na linalofaa katika mfano huu.
- source_word: τοῦ σπεῖραι
  choice: kwenda kupanda
  rationale: Muundo huu unaonyesha kusudi baada ya kitenzi cha mwendo. “Kwenda kupanda” huwasilisha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: τὸν σπόρον αὐτοῦ
  choice: mbegu zake
  rationale: σπόρος humaanisha mbegu ya kupandwa. Wingi ni wa kawaida katika Kiswahili kwa mbegu zinazotawanywa, ingawa Kigiriki kimetumia umoja wa kijumla.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: alipokuwa akipanda
  rationale: Muundo wenye ἐν na kitenzi-jina unaonyesha tendo lililokuwa likiendelea wakati tendo jingine lilipotokea.
- source_word: ὃ μὲν
  choice: baadhi ya mbegu
  rationale: Muundo huu unarejelea sehemu moja ya mbegu kwa namna ya mgawanyo; kutaja “mbegu” wazi kunazuia utata usio wa lazima katika Kiswahili.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: zilianguka kando ya njia
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha mahali penye kuambatana na njia; “kando ya njia” ni tafsiri wazi na ya sasa.
- source_word: κατεπατήθη
  choice: zikakanyagwa
  rationale: Hii ni kauli tendwa ya καταπατέω na humaanisha kukanyagwa; tafsiri haiongezi mtendaji ambaye chanzo hakumtaji.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: Huu ni msemo wa kawaida unaomaanisha ndege warukao angani. “Wa angani” ni Kiswahili asilia kinachohifadhi taswira ya οὐρανός.
- source_word: κατέφαγεν αὐτό
  choice: wakazila kabisa
  rationale: κατεσθίω ina nguvu ya kula na kumaliza. “Wakazila kabisa” huleta msisitizo huo kwa lugha ya kawaida.
theological_decisions: []
