  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi imetumia upatanisho wa wingi kwa “mbegu” kwa kuwa huo ndio mtindo asilia wa Kiswahili, huku ikihifadhi maana ya umoja wa kijumla wa Kigiriki.
