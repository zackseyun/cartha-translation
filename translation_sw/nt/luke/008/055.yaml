  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: sw
  text: Roho yake ikarudi[a], naye akainuka mara moja. Kisha Yesu akaagiza apewe kitu cha kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pumzi yake ikarudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: ikarudi
  rationale: Kitenzi hiki kinaonyesha kurudi kwa roho ya msichana; “ikarudi” ni cha kawaida na kinadumisha picha halisi ya Kigiriki bila kuongeza ufafanuzi.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: roho yake
  rationale: Katika muktadha wa kufufuliwa kutoka kwa wafu, “roho yake” inadumisha maana pana na uzito wa πνεῦμα. Maana ya “pumzi yake” bado inawezekana na imewekwa katika tanbihi.
- source_word: ἀνέστη
  choice: akainuka
  rationale: “Akainuka” ni Kiswahili cha kawaida kinachoeleza tendo la msichana kuinuka mara baada ya uhai wake kurudi.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: Kirai hiki kinaonyesha kwamba tendo hilo lilitokea bila kuchelewa.
- source_word: διέταξεν
  choice: akaagiza
  rationale: “Akaagiza” linaonyesha mamlaka ya maagizo hayo bila ukali usio wa lazima.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: apewe kitu cha kula
  rationale: Tafsiri hii inaonyesha wazi mtendwa wa kike na maana ya φαγεῖν, ‘kula,’ kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya πνεῦμα katika muktadha wa kufufuliwa
  choice: roho yake ikarudi
  alternative: pumzi yake ikarudi
  rationale: “Roho” inadumisha upana wa maana na mvutano wa kitheolojia wa neno la Kigiriki badala ya kulifupisha kuwa tendo la kupumua tu; hata hivyo, “pumzi” ni uwezekano halisi wa kileksia na umetajwa katika tanbihi.
- issue: Mtendaji asiye tajwa wazi katika διέταξεν
  choice: Yesu akaagiza
  alternative: akaagiza
  rationale: Kigiriki kinaacha kiwakilishi cha mtendaji kikiwa ndani ya kitenzi, lakini muktadha unamtambulisha Yesu wazi. Kutaja jina lake kunaleta uwazi wa kawaida katika Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimeunganishwa kwa mtiririko wa masimulizi wa Kiswahili, huku maana ya Kigiriki na uwezekano wa πνεῦμα zikihifadhiwa.
