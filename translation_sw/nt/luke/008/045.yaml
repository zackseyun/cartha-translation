  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: sw
  text: Yesu akasema, “Ni nani aliyenigusa?” Wote walipokuwa wakikana, Petro akasema, “Mwalimu, makundi ya watu yanakuzingira na kukusonga[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanakusongamana kukuzunguka na kukubana.”
    reason: Mbadala huu huonyesha kwa pamoja wazo la umati kumzunguka Yesu na kumsukuma kwa karibu katika vitenzi συνέχω na ἀποθλίβω.
lexical_decisions:
- source_word: ἁψάμενός
  choice: aliyenigusa
  rationale: Katika muktadha huu kitenzi ἅπτω katika kauli ya kati kinaonyesha kugusa kimwili. “Aliyenigusa” ni ya kawaida na huhifadhi uhusiano wa moja kwa moja na Yesu.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Wote walipokuwa wakikana
  rationale: Muundo wa participle ya wakati uliopo unaonyesha tendo lililokuwa likiendelea. “Walipokuwa wakikana” huhifadhi hali hiyo bila kuongeza kitu kisichosemwa wazi; jambo walilokana linaeleweka kutokana na swali la Yesu.
- source_word: Ἐπιστάτα
  choice: Mkuu
  rationale: Ni neno la heshima linalotambua mamlaka ya Yesu. “Mkuu” huepuka kulifanya kuwa “Bwana” (κύριος) au “Mwalimu” huku likihifadhi maana ya mtu mwenye mamlaka.
- source_word: ὄχλοι
  choice: makundi ya watu
  rationale: Huhifadhi wingi wa nomino ya Kigiriki na kueleza kwa lugha ya kawaida watu wengi waliomzunguka Yesu.
- source_word: συνέχουσίν
  choice: yanakuzingira
  rationale: Kitenzi hiki hapa kinaonyesha kuzungukwa na kubanwa na watu; “yanakuzingira” huhifadhi picha ya kuwa katikati yao.
- source_word: ἀποθλίβουσιν
  choice: kukusonga
  rationale: Kitenzi kinaonyesha shinikizo la mwili kutoka kwa umati. “Kukusonga” ni cha kawaida na kina nguvu ya kutosha bila kuzidisha kuwa kuponda.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la heshima Ἐπιστάτα
  choice: Mkuu
  alternative: Mwalimu; Bwana
  rationale: Neno la Kigiriki ni Ἐπιστάτα, si κύριος. “Mkuu” linaonyesha heshima na mamlaka bila kuingiza cheo chenye uzito zaidi wa kikristo kuliko kilicho wazi katika mstari huu, wala kulifanya liwe hasa jukumu la kufundisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetolewa kwa mtiririko wa kawaida, huku hali endelevu ya kukana na tofauti kati ya kuzingira na kusonga zikihifadhiwa.
