  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: sw
  text: Wote walikuwa wakilia na kumwombolezea. Lakini yeye akasema, “Msilie, kwa maana hajafa, bali analala[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amelala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: walikuwa wakilia
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: πάντες
  choice: Wote
  rationale: Linahifadhi wazi maana ya ujumla wa waombolezaji wote kwa usemi mfupi na wa kawaida.
- source_word: ἐκόπτοντο αὐτήν
  choice: kumwombolezea
  rationale: Katika muktadha wa kifo, kitenzi hiki humaanisha kuomboleza, wakati mwingine kwa kujipiga kifua. Tafsiri hii inawasilisha maana bila kuongeza ishara ya kimwili ambayo haikutajwa wazi.
- source_word: Μὴ κλαίετε
  choice: Msilie
  rationale: Ni katazo la kawaida na la moja kwa moja; katika muktadha linaweza pia kumaanisha waache tendo la kulia lililokuwa likiendelea.
- source_word: οὐ γὰρ
  choice: kwa maana ... haja-
  rationale: Muundo huu unaonyesha kuwa kauli inayofuata ndiyo sababu ya amri ya kutolia.
- source_word: ἀπέθανεν
  choice: hajafa
  rationale: Kauli hii ya kawaida ya Kiswahili inaunganisha tendo la kufa na hali ya sasa, sambamba na utofautishaji unaofuata.
- source_word: καθεύδει
  choice: analala
  rationale: Wakati wa sasa wa kitenzi umetafsiriwa kwa hali inayoendelea, hivyo kudumisha taswira ya kulala badala ya kuibadili kuwa maelezo ya hali pekee.
theological_decisions:
- issue: Kauli ya Yesu kwamba msichana hajafa bali analala
  choice: Kudumisha maneno ya moja kwa moja “hajafa, bali analala” na taswira yake ya usingizi.
  alternative: “Hajafa kabisa, bali amelala tu” au “Anaonekana kuwa amekufa, lakini kwa kweli amelala.”
  rationale: Matini inawasilisha namna Yesu mwenyewe anavyoeleza hali ya msichana. Tafsiri haipaswi kuamua kimya kimya ikiwa ni usingizi wa kawaida au maelezo ya kifo kwa kuzingatia kurejeshwa kwake uhai; inadumisha mvutano huo wa simulizi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kumwombolezea” ni neno linaloeleweka katika muktadha wa msiba na haliongezi bila msingi desturi maalumu ya kujipiga kifua.
