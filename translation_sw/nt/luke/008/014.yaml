id: LUK.8.14
reference: Luke 8:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: sw
  text: Ile iliyoanguka katikati ya miiba ni wale waliosikia; lakini wanapoendelea na safari yao, wanasongwa na mahangaiko[a], utajiri na anasa za maisha, nao hawazai matunda yakakomaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasiwasi.”
    reason: lexical_alternative
  - marker: b
    text: Au “hawatoi matunda yaliyoiva” au “hawafikishi matunda kwenye ukamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: Ile iliyoanguka
  rationale: Kirai hiki cha umoja kisicho na jinsia kinarejelea mbegu katika mfano bila kuongeza wazi nomino “mbegu,” ambayo haipo katika mstari huu.
- source_word: ἀκάνθας
  choice: miiba
  rationale: Ni tafsiri ya kawaida na ya asili katika muktadha wa kilimo, na inadumisha taswira ya mfano.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ni wale waliosikia
  rationale: Huwatambulisha kwa uwazi wale ambao tayari walisikia, huku ikihifadhi thamani ya tendo lililotimizwa ya kitenzi kishirikishi cha wakati uliopita.
- source_word: ὑπὸ μεριμνῶν
  choice: wanasongwa na mahangaiko
  rationale: “Mahangaiko” huonyesha shughuli na mawazo yanayolemea; “wasiwasi” pia inawezekana na imetajwa katika tanbihi.
- source_word: πλούτου
  choice: utajiri
  rationale: Huwasilisha wingi wa mali kama nguvu inayosonga, bila kuongeza hukumu ya kifundisho isiyosemwa wazi.
- source_word: ἡδονῶν τοῦ βίου
  choice: anasa za maisha
  rationale: “Anasa” ni neno la sasa na linaloeleweka kwa starehe zinazovutia katika maisha ya kawaida; “maisha” hapa huwakilisha βίος.
- source_word: πορευόμενοι
  choice: wanapoendelea na safari yao
  rationale: Huhifadhi wazo la mwendo unaoendelea bila kulifafanua kupita kiasi kuwa historia yote ya maisha.
- source_word: συμπνίγονται
  choice: wanasongwa
  rationale: Huhifadhi taswira hai ya mimea inayosongwa na miiba pamoja na hali ya kutendwa ya kitenzi cha Kiyunani.
- source_word: οὐ τελεσφοροῦσιν
  choice: hawazai matunda yakakomaa
  rationale: Huhifadhi taswira ya kuzaa matunda na wazo kwamba matunda hayafikii ukomavu au utimilifu.
theological_decisions:
- issue: Hali ya wale wanaosikia lakini wanasongwa na mambo ya maisha
  choice: Maneno yanaonyesha kwamba hawazai matunda yanayofikia ukomavu, bila kuamua hadhi yao ya mwisho ya kiroho.
  alternative: Kuwatafsiri wazi kuwa hawakuzaliwa upya, kuwa waamini wa kweli waliopoteza uzaaji, au kuwa watu walioanza vizuri kisha wakaasi.
  rationale: Mstari unaeleza kushindwa kwao kwa taswira ya kilimo lakini hauamui moja kwa moja mabishano ya baadaye kuhusu kuzaliwa upya, uasi, au kudumu katika imani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha mfululizo wa mahangaiko, utajiri na anasa, pamoja na taswira ya kusongwa na kutokomaa kwa matunda.
