id: LUK.8.16
reference: Luke 8:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: sw
  text: Hakuna mtu ambaye, baada ya kuwasha taa, huifunika kwa chombo au huiweka chini ya kitanda, bali huiweka juu ya kinara cha taa, ili wanaoingia waione nuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: taa
  rationale: Neno la kawaida na la asili katika Kiswahili kwa taa ndogo inayowashwa; linaeleweka bila kulazimisha aina mahususi ya mafuta.
- source_word: σκεύει
  choice: chombo
  rationale: Huhifadhi upana wa neno la Kigiriki, linaloweza kumaanisha chombo au kifaa bila kubainisha aina yake.
- source_word: κλίνης
  choice: kitanda
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mahali pa kulalia.
- source_word: λυχνίας
  choice: kinara cha taa
  rationale: Hutofautisha kifaa cha kuiinulia taa na taa yenyewe, na kuwasilisha kazi ya λυχνία kwa uwazi.
- source_word: οἱ εἰσπορευόμενοι
  choice: wanaoingia
  rationale: Huhifadhi kishazi cha Kigiriki kinachowataja watu wanaoingia, bila kuongeza mahali pasipotajwa wazi.
- source_word: τὸ φῶς
  choice: nuru
  rationale: Neno la heshima na la kawaida katika muktadha wa kibiblia; linahifadhi taswira ya mwanga unaoonekana.
theological_decisions:
- issue: Ikiwa msemaji anatoa amri au anaeleza jambo la kawaida
  choice: 'Kauli ya jumla: “Hakuna mtu anayewasha…”'
  alternative: Amri ya moja kwa moja kuhusu kutoficha nuru
  rationale: Muundo wa Kigiriki Οὐδεὶς ... καλύπτει/τίθησιν ni kauli ya jumla kuhusu tendo la kawaida, si amri ya moja kwa moja.
- issue: Maana ya mfano wa taa na nuru
  choice: Mfano umeachwa bila ufafanuzi wa kiteolojia ndani ya mstari
  alternative: Kutaja nuru kuwa injili, ushuhuda, au ufunuo
  rationale: Mstari wenyewe unatoa taswira bila kutaja wazi rejeo lake; tafsiri haipaswi kutatua kimya kimya maana inayotegemea muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Sentensi mbili zinatumika ili kuepuka msururu mzito, huku uhusiano wa kinyume wa ἀλλά ukihifadhiwa kwa “Badala yake.” Hakuna kiashiria cha tanbihi kwa sababu hakuna tanbihi.
