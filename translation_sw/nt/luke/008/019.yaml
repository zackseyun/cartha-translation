  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: sw
  text: Kisha mama yake na ndugu zake wa kiume[b] wakamjia, lakini hawakuweza kumfikia[a] kwa sababu ya umati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukutana naye” au “kumkaribia.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “ndugu zake”; wengine hulielewa neno hilo kwa maana pana zaidi ya “jamaa zake,” lakini maandishi yenyewe yanasema “ndugu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Kisha ... wakamjia
  rationale: Kauli hii inaendeleza simulizi na kueleza kuja kwao alikokuwa Yesu. ‘Wakamjia’ ni Kiswahili cha kawaida na hakiongezi kusudi lisilotajwa kama vile ‘kuja kumwona.’
- source_word: ἡ μήτηρ
  choice: mama yake
  rationale: Neno la kawaida la uhusiano wa kifamilia; kimuktadha ni mama yake Yesu.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ndugu zake wa kiume
  rationale: ἀδελφοί ni wingi wa kiume. Kwa kuwa ‘ndugu’ peke yake katika Kiswahili inaweza kumaanisha wa kiume au wa kike na pia jamaa kwa upana, ‘wa kiume’ huhifadhi taarifa ya kisarufi bila kuamua kwa tafsiri uhusiano wao mahsusi wa kifamilia.
- source_word: οὐκ ἠδύναντο
  choice: hawakuweza
  rationale: Hutoa kwa kawaida hali ya kutoweza iliyomo katika kitenzi cha Kigiriki.
- source_word: συντυχεῖν αὐτῷ
  choice: kumfikia
  rationale: Katika muktadha wa kuzuiwa na umati, ‘kumfikia’ huonyesha kutoweza kufika alikokuwa na kukutana naye, huku uwezekano wa maana ‘kukutana naye’ ukihifadhiwa katika tanbihi.
- source_word: διὰ τὸν ὄχλον
  choice: kwa sababu ya umati
  rationale: διά pamoja na hali ya accusative hapa huonyesha sababu; tafsiri hii ni wazi na ya kawaida.
theological_decisions:
- issue: Uhusiano hasa wa οἱ ἀδελφοὶ αὐτοῦ na Yesu
  choice: ndugu zake wa kiume
  alternative: jamaa zake; ndugu zake
  rationale: Maandishi yanasema ἀδελφοί lakini hayaelezi kama walikuwa ndugu wa tumbo moja, ndugu wa kambo, au jamaa wengine. Tafsiri inahifadhi neno la uhusiano na jinsia yake bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Umati’ ni neno linaloeleweka kwa watu wengi na linafaa katika simulizi. Viashiria vya tanbihi vimewekwa mara tu baada ya maneno yanayohusika.
