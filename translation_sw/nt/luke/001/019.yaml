  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: sw
  text: Malaika akamjibu, “Mimi ni Gabrieli, ninayesimama mbele za Mungu; nilitumwa kusema nawe na kukutangazia habari hizi njema[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kukutangazia mambo haya kama habari njema.” Kigiriki kwa neno kwa neno: “kukutangazia habari njema mambo haya”; “mambo haya” yanarejelea ujumbe ambao Gabrieli ametoka kuutangaza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akamjibu
  rationale: Kirai cha hali cha aoristi kinaanzisha maneno ya moja kwa moja; katika simulizi la Kiswahili, kitenzi cha mfululizo “akamjibu” ni cha kawaida na kinaonyesha kuwa malaika alimjibu Zekaria.
- source_word: ἄγγελος
  choice: Malaika
  rationale: Muktadha na kujitambulisha kwake kuwa Gabrieli vinaonyesha kuwa huyu ni kiumbe wa mbinguni, si mjumbe wa kawaida.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Mimi ni Gabrieli
  rationale: Kiwakilishi cha wazi “Mimi” kinahifadhi msisitizo wa Ἐγώ, na jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ὁ παρεστηκὼς
  choice: ninayesimama
  rationale: Huhifadhi wazo la hali inayoendelea la Gabrieli kusimama akiwa tayari katika huduma, bila kulazimisha tafsiri ya wakati uliopita.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Usemi huu wa kawaida na wenye heshima unaonyesha kuwapo mbele ya Mungu, pamoja na taswira ya mtumishi katika baraza la kifalme.
- source_word: ἀπεστάλην
  choice: Nilitumwa
  rationale: Huhifadhi kauli tendwa na tendo la kutumwa kwa agizo la Mungu.
- source_word: λαλῆσαι πρὸς σὲ
  choice: kusema nawe
  rationale: Ni usemi wa asili unaohifadhi maana ya kuzungumza moja kwa moja na Zekaria.
- source_word: εὐαγγελίσασθαί σοι
  choice: kukutangazia habari ... njema
  rationale: Kitenzi kinamaanisha kutangaza habari njema; “kutangazia” kinahifadhi tendo la kutangaza bila kutumia istilahi ya baadaye iliyozoeleka ya “injili.”
- source_word: ταῦτα
  choice: habari hizi njema
  rationale: “Hizi” inaelekeza kwenye ujumbe alioutoa Gabrieli, huku mpangilio huu ukiwa wa asili katika Kiswahili; maana ya kihalisi zaidi imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri εὐαγγελίζω katika tangazo la malaika
  choice: kutangazia habari njema
  alternative: kuhubiria injili
  rationale: “Habari njema” huhifadhi maana ya kawaida na uzito wa kitheolojia wa kitenzi bila kuifanya hapa kuwa istilahi maalumu ya ujumbe wa Kikristo wa baadaye.
- issue: Hali ya Gabrieli mbele za Mungu
  choice: ninayesimama mbele za Mungu
  alternative: niliyesimama mbele za Mungu
  rationale: Kauli hii inadumisha nguvu endelevu ya umbo timilifu la Kigiriki na hadhi ya Gabrieli kama anayehudumu mbele za Mungu, bila kuongeza maelezo yasiyomo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “akamjibu” ni wa kawaida, huku “mbele za Mungu” na “Nilitumwa” vikihifadhi uzito wa kauli bila kuwa vya kizamani.
