id: LUK.1.31
reference: Luke 1:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: sw
  text: Na tazama, utachukua mimba na kuzaa mwana wa kiume, nawe utamwita Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, utampa jina Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha kazi ya ἰδού ya kuelekeza fikira na uzito wa tangazo, huku likiwa la kawaida na lenye heshima katika Kiswahili.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: utachukua mimba
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili kwa kutungwa kwa mimba. Inawasilisha maana kamili ya kirai cha Kigiriki bila tafsiri isiyo ya asili kama ‘utatunga mimba tumboni’.
- source_word: τέξῃ
  choice: kuzaa
  rationale: Kitenzi hiki ni kilinganishi cha moja kwa moja na cha kawaida cha τίκτω katika muktadha wa kumzaa mtoto.
- source_word: υἱόν
  choice: mwana
  rationale: ‘Mwana’ linahifadhi maana mahsusi ya mtoto wa kiume ya υἱός na linafaa kwa mtindo wenye heshima wa simulizi hili.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: utamwita
  rationale: Katika Kiswahili, ‘utamwita Yesu’ ni njia ya asili na wazi ya kueleza tendo la kumpa jina. Tafsiri ya neno kwa neno ‘utaita jina lake Yesu’ si ya kawaida na inaweza kueleweka vibaya kuwa jina ndilo linaloitwa.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Agano Jipya.
theological_decisions:
- issue: Namna ya kutafsiri fomula ya kumpa jina καλέσεις τὸ ὄνομα αὐτοῦ
  choice: utamwita Yesu
  alternative: utampa jina Yesu
  rationale: Hakuna tofauti ya kimafundisho inayohusika. Chaguo kuu ni fupi, la asili, na linadumisha amri ya Mariamu kumpa mtoto jina; tanbihi inaweka wazi maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Na tazama’ linahifadhi alama ya mazungumzo na uzito wa tangazo la Kigiriki, huku ‘utachukua mimba’ na ‘utamwita Yesu’ zikiepuka miundo isiyo ya kawaida katika Kiswahili.
