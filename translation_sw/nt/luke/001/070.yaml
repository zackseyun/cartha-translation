  text: kama alivyosema kupitia kinywa cha manabii wake watakatifu tangu zamani,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu nyakati za kale.” Kirai hiki kinaweza kumaanisha zamani za mbali. Wengine hukielewa kwa mkazo zaidi kuwa “tangu milele,” lakini kutajwa kwa manabii hapa kunapendelea maana ya “tangu zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha ulinganifu wa jambo lililotangulia na yale ambayo Mungu alisema hapo awali; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: ἐλάλησεν
  choice: alivyosema
  rationale: Kitenzi hiki kinaeleza tendo la Mungu la kusema wakati uliopita na kinaungana kwa kawaida na muundo wa Kiswahili ‘kama alivyosema.’
- source_word: διὰ στόματος
  choice: kupitia kinywa
  rationale: Inahifadhi taswira halisi ya usemi wa kibiblia kuhusu Mungu kusema kwa kuwatumia manabii kama wajumbe wake.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: manabii wake watakatifu
  rationale: Kivumishi ἁγίων kinawaelezea manabii kuwa waliotengwa kwa ajili ya Mungu; mpangilio huu ni wa asili katika Kiswahili.
- source_word: ἀπ’ αἰῶνος
  choice: wa tangu zamani
  rationale: Katika muktadha wa manabii, kirai hiki kinaelekea kumaanisha nyakati za kale, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: αὐτοῦ
  choice: wake
  rationale: 'Kiwakilishi kinamrejelea Mungu: hao ni manabii wake ambao kupitia kwao alisema.'
theological_decisions:
- issue: Maana ya ἀπ’ αἰῶνος
  choice: tangu zamani
  alternative: tangu nyakati za kale; tangu milele
  rationale: Kutajwa kwa manabii kunapendelea maana ya kipindi cha kale katika historia kuliko kauli ya kimetafizikia kuhusu umilele; hata hivyo, tanbihi inataja upana wa kirai hicho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Usemi ‘kupitia kinywa’ umehifadhiwa kwa sababu ni taswira muhimu ya upatanishi wa hotuba ya kinabii.
