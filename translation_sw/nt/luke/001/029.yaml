  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: sw
  text: Lakini yeye alifadhaishwa sana kwa sababu ya ujumbe huo[a], akaendelea kujiuliza salamu hii ilikuwa ya namna gani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa neno hilo” au “kwa kauli hiyo.” Neno la Kigiriki λόγος linaweza kumaanisha neno, kauli, au ujumbe.
    reason: lexical_alternative
  - marker: b
    text: Au “akaendelea kutafakari.” Muundo wa wakati usiotimilika wa Kigiriki unaonyesha tafakari ya ndani iliyoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofautishaji mdogo kutoka salamu ya malaika kwenda mwitikio wa Maria.
- source_word: ἐπὶ τῷ λόγῳ
  choice: na maneno hayo
  rationale: Katika muktadha λόγος inahusu yaliyosemwa katika salamu, si neno moja tu; muundo huu wa Kiswahili unaonyesha chanzo cha kufadhaika kwake.
- source_word: διεταράχθη
  choice: alifadhaishwa sana
  rationale: Kitenzi kinaonyesha kushtuka au kuvurugika kwa nguvu, na “sana” kinawasilisha uzito huo kwa Kiswahili cha kawaida.
- source_word: διελογίζετο
  choice: akaendelea kutafakari
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha fikira za ndani zilizoendelea, jambo linalowasilishwa wazi kwa “akaendelea kutafakari.”
- source_word: ποταπὸς
  choice: ya namna gani
  rationale: Inaashiria swali kuhusu aina au tabia ya salamu hiyo.
- source_word: εἴη
  choice: ilikuwa
  rationale: Katika usemi tegemezi wa Kiswahili, “ilikuwa ya namna gani” ni ya asili; hali ya kutokuwa na uhakika inadokezwa na tendo la kutafakari na swali lenyewe.
- source_word: ἀσπασμὸς οὗτος
  choice: salamu hiyo
  rationale: Inarejelea moja kwa moja salamu maalumu ambayo malaika alikuwa ametoka kuitoa.
theological_decisions:
- issue: Asili ya mwitikio wa Maria
  choice: Maria anafadhaishwa na yaliyosemwa katika salamu na anaendelea kutafakari maana yake, bila kutajwa kuwa ana dhambi, kutokuamini, au kosa la kimaadili.
  alternative: Kufadhaika kwake kulitokana hasa na kumwona malaika, au kulionyesha kutokuamini.
  rationale: Kigiriki kinaunganisha kufadhaika na λόγος, yaani yaliyosemwa, na kinaonyesha tafakari ya ndani bila kutoa hukumu ya kitheolojia juu ya mwitikio wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maneno hayo” ni ya asili katika muktadha wa salamu iliyotamkwa; “akaendelea kutafakari” huhifadhi hali endelevu ya kitenzi cha Kigiriki.
