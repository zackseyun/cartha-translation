base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: sw
  text: Ameonyesha nguvu kwa mkono wake[a]; amewatawanya wenye kiburi katika mawazo ya mioyo yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amefanya matendo makuu kwa mkono wake.” Kigiriki husema kihalisi “amefanya nguvu,” nahau inayomaanisha kudhihirisha uweza.
    reason: lexical_alternative
  - marker: b
    text: Au, “amewatawanya wenye majivuno kwa nia ya mioyo yao,” au “katika fikira za mioyo yao.” Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: Ameonyesha nguvu
  rationale: Muungano huu wa maneno unamaanisha kudhihirisha au kutumia uweza. Kiswahili ‘ameonyesha nguvu’ ni cha asili na kinahifadhi wazo la nguvu iliyodhihirishwa, huku hali timilifu ikionyesha tendo lililotimizwa lenye umuhimu unaoendelea.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: kwa mkono wake
  rationale: ἐν ina kazi ya kuonyesha chombo hapa, na βραχίων ni mkono kama ishara ya uweza wa Mungu. ‘Kwa mkono wake’ huhifadhi sitiari ya kibiblia kwa Kiswahili cha kawaida.
- source_word: διεσκόρπισεν
  choice: amewatawanya
  rationale: Kitenzi hiki humaanisha kutawanya au kusambaza. Kiambishi cha watendwa ‘-wa-’ kinaonyesha wazi kwamba wanaotawanywa ni watu wenye kiburi.
- source_word: ὑπερηφάνους
  choice: wenye kiburi
  rationale: Kivumishi hiki kimetumiwa kama nomino kutaja watu wenye majivuno. ‘Wenye kiburi’ ni wazi, cha kawaida, na chenye uzito wa kimaadili unaofaa.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: katika mawazo ya mioyo yao
  rationale: Tafsiri hii inadumisha usemi wa Kisemiti unaounganisha fikira na moyo kama kitovu cha nia na maisha ya ndani, bila kuamua kimya kimya kama διανοίᾳ inaonyesha eneo au chombo.
theological_decisions:
- issue: Namna ya kutafsiri vitenzi vya wakati uliopita katika Wimbo wa Maria
  choice: 'Kutumia hali timilifu: ‘ameonyesha’ na ‘amewatawanya’'
  alternative: 'Kutumia wakati uliopita sahili: ‘alionyesha’ na ‘aliwatawanya’'
  rationale: Vitenzi vya Kigiriki vya aoristi vinaweza kutangaza matendo ya Mungu kama yaliyotimia, ya muhtasari, au hata kwa nguvu ya kinabii. Hali timilifu ya Kiswahili inadumisha tendo lililotimizwa pamoja na umuhimu wake unaoendelea bila kulifanya kuwa kauli ya wakati wote.
- issue: Uhusiano wa διανοίᾳ na ‘wenye kiburi’
  choice: ‘katika mawazo ya mioyo yao’
  alternative: ‘kwa sababu ya nia ya mioyo yao’ au ‘kwa mawazo ya mioyo yao’
  rationale: Muundo wa Kigiriki unaweza kueleweka kama eneo la kiburi chao au kwa namna ya chombo/nia inayohusiana na kutawanywa kwao. Tafsiri kuu inadumisha muundo na utata huo badala ya kuchagua uhusiano mmoja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mkono’ unahifadhi taswira ya kibiblia ya mkono wa Mungu; ‘mawazo ya mioyo yao’ inadumisha mvutano wa usemi wa asili bila kuurahisisha kupita kiasi.
