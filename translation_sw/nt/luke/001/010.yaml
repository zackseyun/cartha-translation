  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: sw
  text: Na umati wote wa watu ulikuwa ukisali nje wakati wa kufukiza uvumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa sadaka ya uvumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: umati wote
  rationale: Muundo huu unasisitiza kundi zima lililokusanyika; “umati wote” ni Kiswahili cha kawaida na huhifadhi wazo la kundi kubwa kwa ujumla.
- source_word: τοῦ λαοῦ
  choice: wa watu
  rationale: Huhifadhi maana ya “watu” bila kuongeza waziwazi “Israeli,” jambo ambalo muktadha unaweza kudokeza lakini maandishi hayasemi moja kwa moja.
- source_word: ἦν ... προσευχόμενον
  choice: ulikuwa ukisali
  rationale: Huwakilisha tendo lililokuwa likiendelea, kama linavyoonyeshwa na muundo wa kitenzi ἦν pamoja na kirai endelevu προσευχόμενον.
- source_word: ἔξω
  choice: nje
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza “nje ya patakatifu,” ingawa hilo linaeleweka kutokana na muktadha.
- source_word: τῇ ὥρᾳ
  choice: wakati wa
  rationale: Katika Kiswahili, “wakati wa” ni ya asili zaidi hapa kuliko “saa ya,” huku ikihifadhi maana ya muda uliowekwa wa ibada.
- source_word: τοῦ θυμιάματος
  choice: kufukiza uvumba
  rationale: Katika mazingira ya Hekalu, neno hili linarejelea uvumba katika tendo la ibada; “kufukiza uvumba” huwasilisha kwa uwazi tukio hilo bila kulifanya kuwa fundisho maalumu la kidhehebu.
theological_decisions:
- issue: Istilahi ya ibada ya Hekalu katika θυμίαμα
  choice: kufukiza uvumba
  alternative: sadaka ya uvumba
  rationale: Tafsiri iliyochaguliwa inaonyesha tendo la kiibada la kuchoma au kufukiza uvumba. “Sadaka ya uvumba” pia inawezekana kimuktadha, lakini inaweza kusisitiza zaidi dhana ya sadaka kuliko neno lenyewe linavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Umati” hufaa kwa kundi kubwa lililokusanyika, na “ulikuwa ukisali” huonyesha tendo endelevu la pamoja bila kuongeza neno “pamoja.”
