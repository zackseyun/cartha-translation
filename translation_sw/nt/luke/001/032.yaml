  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: sw
  text: Huyu atakuwa mkuu, naye ataitwa Mwana wa Aliye Juu Zaidi[a]; na Bwana Mungu atampa kiti cha enzi cha Daudi, baba yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atapewa jina la Mwana wa Aliye Juu Zaidi.”
    reason: Tofauti hii huonyesha kwamba κληθήσεται inaweza kueleza kuitwa kwa cheo au kupewa jina.
  - marker: b
    text: “Baba yake” hapa humaanisha Daudi kama baba au mtangulizi wa ukoo wa kifalme wa Yesu katika nasaba ya Daudi.
    reason: Maelezo ya kiukoo huzuia neno hilo kueleweka kuwa Daudi ndiye baba wa karibu wa Yesu, bila kubadili lugha ya mstari.
lexical_decisions:
- source_word: οὗτος
  choice: Huyu
  rationale: Kiwakilishi cha kuonyesha kimetafsiriwa moja kwa moja na kwa njia ya kawaida katika Kiswahili; kinamrejelea mtoto aliyetangazwa.
- source_word: ἔσται μέγας
  choice: atakuwa mkuu
  rationale: Huhifadhi wakati ujao na upana wa μέγας, unaoweza kuonyesha ukuu, hadhi, na umuhimu bila kuufupisha kuwa nguvu peke yake.
- source_word: υἱὸς Ὑψίστου
  choice: Mwana wa Aliye Juu Zaidi
  rationale: Huhifadhi cheo cha kimwana na cheo cha Mungu Ὕψιστος kwa Kiswahili cha kawaida, chenye heshima na mwangwi wa kibiblia.
- source_word: κληθήσεται
  choice: ataitwa
  rationale: Ni tafsiri ya kawaida ya kauli tendwa ya wakati ujao na hapa inaonyesha jina au cheo atakachotambuliwa nacho.
- source_word: κύριος ὁ θεὸς
  choice: Bwana Mungu
  rationale: Hutafsiri κύριος kama “Bwana” bila kutumia umbo linalodokeza kwa lazima Tetragramatoni, ambayo haipo katika maandishi ya Kigiriki.
- source_word: δώσει αὐτῷ
  choice: atampa
  rationale: Muundo huu ni wa asili katika Kiswahili na huonyesha wazi kwamba Mungu ndiye mtoaji na huyo mwana ndiye mpokeaji.
- source_word: τὸν θρόνον Δαυὶδ
  choice: kiti cha enzi cha Daudi
  rationale: Huhifadhi lugha ya kifalme na uhusiano wa umilikaji katika ahadi ya ukoo wa Daudi.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: baba yake
  rationale: Huhifadhi neno la moja kwa moja πατήρ na lugha ya ukoo wa kifalme badala ya kulifafanua ndani ya mstari kuwa “babu yake wa ukoo” au “mzee wake wa kale.”
theological_decisions:
- issue: Cheo cha Kikristo katika υἱὸς Ὑψίστου
  choice: Mwana wa Aliye Juu Zaidi
  alternative: mwana wa Aliye Juu Zaidi
  rationale: Herufi kubwa zinaonyesha matumizi ya kichwa maalumu katika muktadha huu bila kuongeza maelezo ya baadaye ya kimafundisho au kudhoofisha dai la kimwana.
- issue: Maana ya κύριος katika κύριος ὁ θεὸς
  choice: Bwana Mungu
  alternative: BWANA Mungu
  rationale: Kigiriki kina κύριος, si jina la Kiebrania la Mungu; kwa hiyo “Bwana” huhifadhi maandishi yaliyopo bila kuyabainisha kupita kiasi.
- issue: Uhusiano wa Daudi kama πατήρ
  choice: baba yake
  alternative: babu yake wa ukoo
  rationale: Maandishi yenyewe yanatumia lugha ya ubaba kwa maana ya ukoo. Tafsiri inaacha sitiari hiyo ya kidinasti ikiwa wazi, huku tanbihi ikieleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. “Huyu” huhifadhi msisitizo wa kiwakilishi cha Kigiriki, na “kiti cha enzi” huhifadhi taswira rasmi ya kifalme.
