  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: sw
  text: kwa sababu ameutazama hali ya unyonge[a] wa mtumwa wake wa kike[b]. Kwa maana, tazama, tangu sasa vizazi vyote watanihesabu kuwa mwenye heri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unyenyekevu” au “kudhalilishwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “mjakazi wake” au “mtumishi wake wa kike.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: ameangalia
  rationale: Muundo huu unaonyesha Mungu ameelekeza uangalifu wake kwa Maria, ukiwa na maana ya kumjali kwa neema. Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea ambalo matokeo yake yanaendelea kuwa muhimu katika sifa za Maria.
- source_word: ταπείνωσιν
  choice: hali ya chini
  rationale: Neno hilo hapa linaelekea kueleza hali ya Maria ya kuwa mtu wa hadhi ya chini na asiye na umaarufu, si sifa ya unyenyekevu wa moyoni pekee wala fedheha pekee.
- source_word: δούλης
  choice: mtumwa wake wa kike
  rationale: Tafsiri hii inahifadhi maana ya mwanamke aliye chini ya mamlaka na anayemilikiwa na bwana wake, huku ikionyesha wazi jinsia ya neno la Kigiriki.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha msisitizo wa kishairi unaoelekeza usikivu wa msomaji bila kutumia lugha ya kizamani.
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mwelekeo wa wakati kuanzia sasa na kuendelea.
- source_word: μακαριοῦσίν με
  choice: vitaniita mwenye baraka
  rationale: Kitenzi kina maana ya kumtangaza au kumtambua mtu kuwa amebarikiwa; usemi huu unaweka wazi kwamba vizazi vitamkiri Maria kuwa mtu aliyepokea baraka.
- source_word: πᾶσαι αἱ γενεαί
  choice: vizazi vyote
  rationale: Tafsiri hii fupi na ya kawaida inaonyesha mfululizo wa vizazi bila kuongeza neno 'vijavyo,' ambalo tayari linadokezwa na 'tangu sasa.'
theological_decisions:
- issue: Jinsi ya kutafsiri Maria anapojiita δούλη
  choice: mtumwa wake wa kike
  alternative: mjakazi wake; mtumishi wake wa kike
  rationale: Chaguo hili halipunguzi lugha ya Maria ya kuwa chini ya mamlaka ya Mungu na kuwa wake kabisa, wala haliingizi madai ya baadaye ya kimafundisho kuhusu Maria. Tanbihi inatoa istilahi laini zaidi zinazowezekana.
- issue: Maana ya ταπείνωσις katika wimbo wa Maria
  choice: hali ya chini
  alternative: unyenyekevu; kudhalilishwa
  rationale: Muktadha unaonyesha hali ya chini ya Maria kijamii na kutokuwa na cheo, lakini neno la asili linaweza pia kuhusishwa na unyenyekevu au udhalilishaji. Tafsiri kuu haifungi maana katika upande mmoja pekee.
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima na ladha ya kishairi inayofaa Wimbo wa Maria. “Kwa maana tazama” inadumisha uhusiano wa hoja na msisitizo wa ἰδοὺ γὰρ. “Mwenye baraka” huepuka uwezekano wa kuelewa “aliyebarikiwa” kama tendo la wakati uliopita pekee.
