  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: sw
  text: Lakini malaika akamwambia, “Usiogope, Zakaria, kwa sababu ombi lako limesikiwa[a], na mke wako Elisabeti atakuzalia mwana, nawe utampa jina Yohana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dua yako imesikiwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “utaliita jina lake Yohana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: Lakini malaika akamwambia
  rationale: ‘Lakini’ linaonyesha badiliko dogo la mtiririko linaloletwa na δέ baada ya kutajwa kwa hofu ya Zakaria; ‘akamwambia’ ni simulizi la kawaida na la asili kwa εἶπεν πρὸς αὐτόν.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili cha sasa.
- source_word: Ζαχαρία
  choice: Zakaria
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: διότι
  choice: kwa sababu
  rationale: Linaonyesha wazi sababu ya Zakaria kutopaswa kuogopa.
- source_word: εἰσηκούσθη ἡ δέησίς σου
  choice: ombi lako limesikiwa
  rationale: ‘Ombi’ linahifadhi maana ya δέησις kama maombi au haja inayowasilishwa kwa Mungu, na ‘limesikiwa’ linadumisha kauli ya kutendwa bila kumtaja wazi mtendaji.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: mke wako Elisabeti
  rationale: Katika muktadha huu γυνή pamoja na kiwakilishi cha umilikaji humaanisha wazi ‘mke,’ si ‘mwanamke’ kwa ujumla.
- source_word: γεννήσει υἱόν σοι
  choice: atakuzalia mwana
  rationale: Kauli hii ya Kiswahili ni ya asili, inaonyesha kwamba Elisabeti ndiye atakayezaa, na inahifadhi dative σοι kama ahadi inayomhusu Zakaria.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: utampa jina Yohana
  rationale: Hii ni tafsiri ya asili ya nahau ya Kigiriki ‘utaliita jina lake Yohana’ bila kupoteza wazo la kumpa mtoto jina lililoagizwa.
theological_decisions:
- issue: Mtendaji asiyeelezwa katika ‘ombi lako limesikiwa’
  choice: Kauli ya kutendwa imehifadhiwa bila kumtaja Mungu moja kwa moja.
  alternative: ‘Mungu amelisikia ombi lako.’
  rationale: Muktadha wa sala unaashiria kwamba Mungu ndiye aliyesikia, lakini Kigiriki hakimtajii wazi. Tafsiri haifafanui zaidi ya matini.
- issue: Nguvu ya kauli καλέσεις kuhusu jina
  choice: ‘utampa jina Yohana’
  alternative: ‘ni lazima umpe jina Yohana’
  rationale: Kauli ya baadaye inaweza kufanya kazi kama tangazo lenye mamlaka au agizo katika muktadha huu. Tafsiri inahifadhi umbo la baadaye na haiongezi maneno ya ulazima.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Zakaria, Elisabeti, na Yohana.'
