  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: sw
  text: Ikawa, Elisabeti aliposikia salamu[a] ya Maria, mtoto akaruka tumboni mwa Elisabeti, naye Elisabeti akajazwa Roho Mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maamkizi.”
    reason: Mbadala wa kimsamiati kwa ἀσπασμός; “salamu” ni wa kawaida zaidi, huku “maamkizi” yakielekea kwenye tendo au maneno ya kumsalimu mtu.
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuendeleza simulizi; “Ikawa” inahifadhi kazi yake ya kisimulizi kwa ufupi na kwa lugha yenye hadhi.
- source_word: ὡς
  choice: aliposikia
  rationale: Muundo wa “alipo-” unaonyesha kwa njia ya kawaida ya Kiswahili kwamba tendo lililofuata lilitokea Elisabeti aliposikia salamu.
- source_word: ἀσπασμός
  choice: salamu
  rationale: Neno hili linarejelea maneno ya Maria ya kumsalimu Elisabeti. “Salamu” ni la kawaida na wazi katika Kiswahili cha sasa.
- source_word: Μαρίας
  choice: ya Maria
  rationale: Kiambishi cha Kigiriki kinachoonyesha umilikaji kimetafsiriwa kwa muundo wa kawaida wa Kiswahili, “salamu ya Maria.”
- source_word: ἐσκίρτησεν
  choice: akaruka
  rationale: Kitenzi kinaonyesha mwendo wa ghafla na wenye nguvu; “akaruka” kinahifadhi uhai wa taswira bila kuongeza sababu au hisia ambazo hazikutajwa wazi.
- source_word: βρέφος
  choice: mtoto
  rationale: Katika muktadha huu neno linamtaja Yohana ambaye bado yumo tumboni. “Mtoto” ni neno la kawaida, sahihi, na lenye hadhi.
- source_word: κοιλία
  choice: tumboni mwake
  rationale: Katika muktadha huu linamaanisha mahali mtoto alimo ndani ya mama; “tumboni mwake” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo wazi.
- source_word: ἐπλήσθη
  choice: akajazwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na kudokeza tendo kutoka nje bila kumtaja mtendaji ambaye maandishi hayamtaji.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika matumizi ya Luka, kirai hiki kinamrejelea Roho wa Mungu. Herufi kubwa zinaonyesha rejeleo hilo kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Rejeleo la πνεύματος ἁγίου
  choice: Roho Mtakatifu, yaani Roho wa Mungu
  alternative: roho takatifu
  rationale: Katika Luka–Matendo kirai hiki kwa kawaida kinamrejelea Roho wa Mungu, na hapa muktadha unaelekea kwenye uvuvio wa kinabii. Tafsiri haiongezi maelezo ya kimadhehebu.
- issue: Tafsiri ya βρέφος inapomtaja Yohana ambaye hajazaliwa
  choice: mtoto
  alternative: kichanga
  rationale: Neno la Kigiriki linaweza kumaanisha mtoto mchanga aliyezaliwa au ambaye bado hajazaliwa. “Mtoto” linabaki la kawaida na pana vya kutosha kwa muktadha huu bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ikawa ... aliposikia” unahifadhi ladha ya simulizi la Luka bila kutumia lugha nzito kupita kiasi. Kiunganishi “naye” kinatofautisha kwa uwazi mtoto na Elisabeti katika kishazi cha mwisho.
