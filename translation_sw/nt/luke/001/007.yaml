  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: sw
  text: Nao hawakuwa na mtoto, kwa sababu Elisabeti alikuwa tasa, na wote wawili walikuwa wazee sana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakiwa wamesonga mbele katika siku zao”; yaani, walikuwa wazee.
    reason: Nahau ya Kigiriki inaeleza kwamba walikuwa wamefikia uzee; tanbihi huhifadhi taswira yake ya kihalisi.
lexical_decisions:
- source_word: τέκνον
  choice: mtoto
  rationale: Nomino ya umoja τέκνον inamaanisha mtoto mmoja; “mtoto” ni ya kawaida na haiingizi wingi usiokuwapo katika Kigiriki.
- source_word: καθότι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu ya wao kutokuwa na mtoto; “kwa sababu” ni wazi na ya kawaida katika Kiswahili.
- source_word: στεῖρα
  choice: tasa
  rationale: στεῖρα inaeleza hali ya kutoweza kuzaa, si tu matokeo ya kutokuwa na mtoto. “Tasa” ni neno fupi, sahihi, na linaloeleweka katika Kiswahili sanifu.
- source_word: ἀμφότεροι
  choice: wote wawili
  rationale: Maneno haya yanasisitiza kuwa jambo hilo liliwahusu Zekaria na Elisabeti kwa pamoja.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: walikuwa wameendelea sana kwa umri
  rationale: Hii ni nahau ya heshima inayomaanisha kwamba walikuwa wazee. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha wazo la kuwa wamefikia hatua ya mbali maishani.
- source_word: οὐκ ἦν αὐτοῖς
  choice: hawakuwa na
  rationale: Kigiriki kinasema kwa muundo wa umilikaji, kihalisi “hakuwapo kwao”; Kiswahili cha kawaida huueleza kwa “hawakuwa na.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” linaendeleza simulizi kwa kawaida; “tasa” linatofautisha hali ya kutoweza kuzaa na matokeo yaliyotajwa tayari. Alama ya tanbihi imewekwa baada ya kishazi cha umri, ambacho ndicho tanbihi inachofafanua.
