  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: sw
  text: Naye mtoto aliendelea kukua na kuimarika rohoni[a], naye alikuwa katika maeneo ya nyika[b] mpaka siku ya kujitokeza kwake hadharani kwa Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho.” Kigiriki kinaweza kumaanisha kuimarika kwa ndani au kiroho kwa ujumla, au kuimarika kunakohusiana hasa na Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au, “nyikani.” Kigiriki ni cha wingi, kihalisi “katika maeneo ya nyika” au “katika sehemu zisizokaliwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mpaka siku ya kujidhihirisha kwake mbele ya Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: mtoto
  rationale: Neno hili humrejelea Yohana akiwa katika umri mdogo bila kulazimisha hatua mahususi ya umri kama vile ‘kijana’.
- source_word: ηὔξανε
  choice: akaendelea kukua
  rationale: Kauli ya wakati usiotimilika inaonyesha ukuaji uliokuwa ukiendelea.
- source_word: ἐκραταιοῦτο
  choice: kuimarika
  rationale: Huwasilisha mchakato unaoendelea wa kupata nguvu bila kuamua kama maana ni tendwa (‘aliimarishwa’) au hali (‘alizidi kuwa imara’).
- source_word: πνεύματι
  choice: rohoni
  rationale: Huhifadhi maana pana ya kuimarika kwa upande wa roho bila kutaja wazi Roho Mtakatifu, jambo ambalo Kigiriki hakilisemi moja kwa moja hapa.
- source_word: ἐν ταῖς ἐρήμοις
  choice: katika maeneo ya nyika
  rationale: Huhifadhi wingi wa Kigiriki na maana ya sehemu mbalimbali zisizokaliwa, bila kuifanya iwe jangwa kijiografia pekee.
- source_word: ἀναδείξεως
  choice: kujitokeza kwake hadharani
  rationale: Neno linaashiria kuonyeshwa au kuanza kuonekana mbele ya watu; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: kwa Israeli
  rationale: Hueleza Israeli kuwa watu ambao mbele yao au kwao Yohana alijitokeza, huku ukibaki mfupi na wa asili.
theological_decisions:
- issue: Maana ya πνεύματι katika kukua kwa Yohana
  choice: rohoni
  alternative: katika Roho
  rationale: Kigiriki hakina kibainishi wala hakimtaji Roho Mtakatifu waziwazi hapa. Tafsiri kuu huhifadhi maana pana ya nguvu ya ndani au ya kiroho, na tanbihi hutunza uwezekano wa rejeo mahususi kwa Roho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa kawaida, huku hali endelevu ya vitenzi vya Kigiriki, wingi wa ἐρήμοις, na utata wa πνεύματι vikihifadhiwa.
