lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kishazi cha kusudi kwa Kiswahili cha kawaida na kuhifadhi nguvu ya kusudi.
- source_word: ἐπιγνῷς
  choice: ujue
  rationale: Hutoa maana ya kutambua au kujua kwa hakika bila kuzidisha wazo la kujua kikamilifu.
- source_word: περὶ ὧν ... λόγων
  choice: wa mambo
  rationale: Katika muktadha huu λόγων inaelekea kurejelea yaliyomo katika mafundisho; “mambo” ni ya asili zaidi kuliko tafsiri halisi ya “maneno.”
- source_word: κατηχήθης
  choice: uliyofundishwa
  rationale: Huwasilisha mafundisho yaliyopokelewa, huenda kwa mdomo, bila kuingiza istilahi ya baadaye ya kikanisa.
- source_word: τὴν ἀσφάλειαν
  choice: uhakika
  rationale: “Uhakika” huhifadhi wigo wa maana unaoweza kuhusisha kuwa jambo ni la kutegemewa na pia kuwa na hakika nalo.
theological_decisions:
- issue: Kusudi la Luka kuhusu mafundisho aliyopokea Theofilo
  choice: uhakika wa mambo
  alternative: kutegemeka kwa mambo
  rationale: ἀσφάλεια inaweza kuelekeza kwa uhakika wa anayejua au kutegemeka kwa yale aliyofundishwa. Matini kuu haifungi maana kwa upande mmoja tu, na tanbihi inaonyesha maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya heshima, na ya kawaida. “Uliyofundishwa” ni wazi kwa wasomaji wa sasa, huku tanbihi zikihifadhi upana wa istilahi za Kigiriki.
