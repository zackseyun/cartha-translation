  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: sw
  text: Siku hizo Maria akainuka, akaenda kwa haraka katika nchi ya milima, hadi mji wa Yuda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hadi mji katika Uyahudi.” Neno la Kigiriki πόλις linaweza kumaanisha mji au mji mdogo, na Ἰούδα huenda likamaanisha eneo la Yuda au Uyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: akaondoka
  rationale: Kitenzi hiki cha wakati uliopita kinatangulia tendo kuu na katika muktadha huu kinaonyesha Maria kuinuka na kuanza safari; “akaondoka” ni Kiswahili cha kawaida kinachohifadhi mfuatano wa simulizi bila kuongeza maelezo.
- source_word: δὲ
  choice: mfuatano wa simulizi unaowasilishwa kwa kiambishi “aka-”
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi. Kiswahili hakihitaji neno tofauti hapa; mfuatano wa vitenzi vya “aka-” unatoa uhusiano huo kwa kawaida.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Siku hizo
  rationale: Hii ni namna ya asili na yenye hadhi ya kuwasilisha rejeo la wakati bila kulipanua.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: πορεύομαι hapa humaanisha kwenda au kusafiri; “akaenda” ni pana, ya kawaida, na inafaa muktadha.
- source_word: εἰς τὴν ὀρεινὴν
  choice: katika eneo la milima
  rationale: ὀρεινή likitumika kama nomino humaanisha eneo la nyanda za milima; tafsiri hii ni wazi kwa wasomaji wa Kiswahili na haidai mlima mmoja.
- source_word: μετὰ σπουδῆς
  choice: kwa haraka
  rationale: σπουδή linaweza kuonyesha haraka, juhudi, au bidii. Katika muktadha wa safari, “kwa haraka” huhifadhi maana inayowezekana zaidi bila kudokeza sababu.
- source_word: εἰς πόλιν Ἰούδα
  choice: kwenye mji mmoja wa Yuda
  rationale: πόλις linaweza kumaanisha mji wa ukubwa mbalimbali, na mahali hapa hapatajwi kwa jina. “Mji mmoja” huonyesha kutokuwa maalumu; “wa Yuda” huhifadhi muundo wa Kigiriki na uwezekano wa maana ya eneo.
theological_decisions:
- issue: Utambulisho wa Ἰούδα
  choice: Yuda kama jina la eneo au sehemu ya kikabila
  alternative: Uyahudi kama jina pana la eneo, au mji ulioitwa Yuda
  rationale: Katika muktadha huu Ἰούδα inaeleweka kwa kawaida kuwa eneo la Yuda. Kutumia “Yuda” kunabaki karibu na umbo la chanzo huku tanbihi ikihifadhi uwezekano wa tafsiri ya eneo la Uyahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “akaondoka, akaenda” unafaa simulizi la Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika, na tanbihi inalinda utata wa πόλις na Ἰούδα.
