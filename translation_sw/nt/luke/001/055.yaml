source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: sw
  text: kama alivyowaambia baba zetu[a], Abrahamu na uzao wake[b], milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kigiriki kinasema kihalisi “baba zetu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wazao wake”; kihalisi, “mbegu yake.” Neno la Kigiriki liko katika umoja lakini linaweza kumaanisha uzao au wazao kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha kwamba tendo lililotangulia lilitokea sawasawa na ahadi ya Mungu; “kama” ni ya kawaida na ya asili katika Kiswahili.
- source_word: ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν
  choice: alivyosema na baba zetu
  rationale: Muundo “kusema na” huwasilisha tendo la kusema kwa waliotangulia. “Baba zetu” huhifadhi usemi wa kiume wa Kigiriki na mwangwi wake wa historia ya agano; “mababu zetu” limetolewa kama uwezekano katika tanbihi.
- source_word: τῷ Ἀβραὰμ
  choice: kwa Abrahamu
  rationale: Hurejesha kwa kawaida yule ambaye ahadi ilinenwa kwake, huku jina likifuata umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: kwa uzao wake
  rationale: “Uzao” ni nomino ya umoja yenye maana ya kijumla, hivyo huhifadhi vyema upana wa σπέρμα kuliko kuibadili moja kwa moja kuwa wingi “wazao.”
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili kwa maana ya kudumu bila mwisho katika muktadha huu.
theological_decisions:
- issue: Usemi wa πατέρας ἡμῶν katika historia ya agano
  choice: baba zetu
  alternative: mababu zetu
  rationale: “Baba zetu” hufuata kwa karibu umbo la kiume la chanzo na huhifadhi mwangwi wa mababa wa Israeli, huku tanbihi ikionyesha maana pana ya mababu.
- issue: Maana ya σπέρματι αὐτοῦ katika ahadi kwa Abrahamu
  choice: uzao wake
  alternative: wazao wake / mbegu yake
  rationale: “Uzao” huhifadhi nomino ya umoja yenye maana ya kijumla na haifungi kifungu kwa mtu mmoja wala kwa wingi pekee. “Mbegu” ni halisi zaidi lakini si ya kawaida kwa maana hii katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi uhusiano wa kifungu hiki na mstari uliotangulia pamoja na utata wa kijumla wa “uzao.”
