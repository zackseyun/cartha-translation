id: LUK.1.6
reference: Luke 1:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: sw
  text: Wote wawili walikuwa waadilifu mbele za Mungu[a], wakiishi bila lawama kwa kufuata amri na maagizo yote ya Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machoni pa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “wakienenda bila lawama katika amri na maagizo yote ya Bwana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: waadilifu
  rationale: Neno hili linahifadhi maana ya uadilifu wa kimaadili na uaminifu kwa Mungu, bila kulifanya kuwa tamko la kutokuwa na dhambi kabisa.
- source_word: ἀμφότεροι
  choice: wote wawili
  rationale: Linakazia wazi kwamba maelezo haya yanawahusu Zekaria na Elisabeti kwa pamoja.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hali yao ilitathminiwa machoni pa Mungu, si kwa viwango vya wanadamu tu.
- source_word: πορευόμενοι
  choice: wakiishi
  rationale: Katika muktadha huu kitenzi cha kwenda au kutembea ni sitiari ya mwenendo wa maisha; “wakiishi” huwasilisha maana hiyo kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: kwa kufuata amri ... yote
  rationale: Muundo huu unaeleza maisha yaliyoongozwa na utiifu kwa amri zote; “kwa kufuata” ni wa asili katika Kiswahili na huhifadhi wigo kamili wa πάσαις.
- source_word: δικαιώμασιν
  choice: maagizo
  rationale: “Maagizo” yanaeleweka kwa urahisi na yanadumisha tofauti kiasi na “amri,” huku yakirejelea masharti au kanuni zilizowekwa na Bwana.
- source_word: τοῦ κυρίου
  choice: ya Bwana
  rationale: Huu ni uwasilishaji wa kawaida wa genitivi na wa κύριος, ambayo hapa inamtaja Mungu wa Israeli.
- source_word: ἄμεμπτοι
  choice: bila lawama
  rationale: Linahifadhi nguvu ya kivumishi cha Kigiriki, likieleza mwenendo usiostahili kulaumiwa bila kufafanua kwamba walikuwa wakamilifu kabisa bila dhambi.
- source_word: ἦσαν δὲ
  choice: walikuwa
  rationale: δέ ni kiunganishi hafifu cha masimulizi ambacho hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili; wingi wa kitenzi umehifadhiwa.
theological_decisions:
- issue: Ikiwa ἄμεμπτοι inamaanisha kutokuwa na dhambi kabisa
  choice: Imetafsiriwa “bila lawama,” ikieleza mwenendo wao bila kuongeza dai la ukamilifu usio na dhambi.
  alternative: Kutafsiri kwa maneno yanayodokeza kwamba hawakuwa na dhambi yoyote.
  rationale: Muktadha unahusianisha kutokuwa kwao na lawama na kufuata amri na maagizo ya Bwana. Tafsiri inadumisha kauli yenye nguvu ya maandiko bila kutatua zaidi ya yanavyosema mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakiishi” limetumiwa badala ya “wakienenda” katika maandishi makuu ili sitiari ya mwenendo wa maisha ieleweke kwa wasomaji wa kawaida; tafsiri ya karibu zaidi na muundo wa Kigiriki imehifadhiwa katika tanbihi.
