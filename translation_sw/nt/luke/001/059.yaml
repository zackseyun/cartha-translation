  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: sw
  text: Ikawa, siku ya nane wakaja kumtahiri mtoto, nao walikuwa wakimwita[a] Zekaria kwa jina la baba yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimwita Zekaria.” Kitenzi cha Kigiriki kinaweza kuonyesha kwamba walikuwa katika harakati za kumpa jina hilo au walikusudia kufanya hivyo, jambo linaloafikiana na pingamizi katika mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “walikuwa wakimwita kwa jina la baba yake, Zekaria.” Hii inarejelea desturi ya kumpa mtoto jina la mtu wa familia.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni kauli ya kawaida ya Luka ya kuanzisha tukio; “Ikawa” ni ya heshima na ya kisimulizi bila kuwa nzito kupita kiasi.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: siku ya nane
  rationale: Hutoa wakati maalumu kwa Kiswahili cha kawaida na kudumisha mpangilio wa chanzo.
- source_word: ἦλθον
  choice: wakaja
  rationale: Hudumisha mhusika wa wingi asiyeainishwa katika Kigiriki bila kuongeza kwamba walikuwa jamaa au majirani.
- source_word: περιτεμεῖν
  choice: kumtahiri
  rationale: Infinitivu inaonyesha kusudi; umbo hili ni la moja kwa moja na linaonyesha mtoto ndiye anayefanyiwa tendo.
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: Ni tafsiri ya kawaida na wazi ya παιδίον katika muktadha huu.
- source_word: ἐκάλουν
  choice: walikuwa wakimwita
  rationale: Hudumisha hali ya tendo lililokuwa likiendelea au likikusudiwa, ambayo inaafikiana na pingamizi katika mstari unaofuata.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: kwa jina la
  rationale: Kauli hii ya asili inaonyesha kumwita mtoto kwa jina la mtu mwingine; Kiswahili hiki ni cha asili na kinaacha ufafanuzi wa desturi kwenye tanbihi.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: baba yake
  rationale: Ni umilikaji wa kawaida na wa asili katika Kiswahili.
- source_word: Ζαχαρίαν
  choice: Zekaria
  rationale: Ni umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili na linahusiana wazi na jina la Kiebrania.
theological_decisions:
- issue: Hali ya kitenzi ἐκάλουν
  choice: walikuwa wakimwita
  alternative: walimwita
  rationale: Tafsiri haifanyi kitendo kuwa uamuzi uliokamilika; inadumisha uwezekano wa jaribio au mchakato unaokatizwa katika mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Ikawa” limetumiwa kwa mtindo wa Luka; “walikuwa wakimwita” linadumisha hali isiyokamilika ya kitenzi cha Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
