  text: 'Naye Zakaria, baba yake, akajazwa Roho Mtakatifu, akatabiri, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Inaendeleza simulizi na kumtambulisha Zakaria kama mhusika wa tendo linalofuata kwa Kiswahili cha kawaida.
- source_word: Ζαχαρίας
  choice: Zakaria
  rationale: Hili ndilo umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba yake
  rationale: Ni tafsiri ya kawaida na wazi ya kirai cha Kigiriki, ikirejelea baba ya mtoto aliyetajwa katika muktadha.
- source_word: ἐπλήσθη
  choice: akajazwa
  rationale: Inahifadhi hali tendwa ya kitenzi na kuonyesha tukio lililotokea wakati huo.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Baada ya 'akajazwa,' Kiswahili hakihitaji kihusishi; herufi kubwa zinaonyesha kuwa anayerejelewa ni Roho wa Mungu katika simulizi la Luka.
- source_word: ἐπροφήτευσεν
  choice: akatoa unabii
  rationale: Ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili, huku ukihifadhi maana ya kusema ujumbe wa kinabii.
- source_word: λέγων
  choice: akisema
  rationale: Inatanguliza moja kwa moja maneno ya unabii yanayofuata na kuhifadhi uhusiano wa kisarufi wa kishiriki cha Kigiriki.
theological_decisions:
- issue: Mrejelewa wa πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika Luka–Matendo, kirai hiki katika mazingira ya uvuvio wa Mungu humrejelea Roho Mtakatifu; tafsiri hii inafuata matumizi ya simulizi bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku hali tendwa ya 'akajazwa' na nguvu ya kinabii ya kitenzi zikihifadhiwa.
