  source_fidelity: 'Matini inafuata Kigiriki kwa uaminifu: ‘alipotoka’ huonyesha ἐξελθών, ‘hakuweza kusema nao’ huhifadhi kutoweza kusema, ‘wakatambua’ huonyesha ἐπέγνωσαν, na ‘maono ndani ya patakatifu’ hudumisha ὀπτασίαν ἐν τῷ ναῷ. ‘Akaendelea kuwafanyia ishara’ huwasilisha tendo endelevu la ἦν διανεύων, na ‘akabaki bubu’ huonyesha hali endelevu ya διέμενεν κωφός bila kulazimisha maana ya kutosikia.'
