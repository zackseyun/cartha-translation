id: LUK.1.22
reference: Luke 1:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: sw
  text: Lakini alipotoka, hakuweza kusema nao, nao wakatambua kwamba alikuwa ameona maono ndani ya patakatifu[a]. Akaendelea kuwafanyia ishara, naye akabaki bubu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya Hekalu.” Neno la Kigiriki hapa humaanisha hasa patakatifu penyewe, badala ya eneo lote la Hekalu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha mtu asiyeweza kusema na, katika baadhi ya miktadha, linaweza pia kumaanisha mtu asiyeweza kusikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: alipotoka
  rationale: 'Kitenzi kishirikishi cha wakati uliopita kinatangulia kitenzi kikuu na hapa kwa kawaida huonyesha wakati na mfuatano: ‘alipotoka.’'
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: hakuweza kusema
  rationale: Huhifadhi wazi maana ya kutokuwa na uwezo inayotolewa na δύναμαι pamoja na kitenzi-jina, huku ikiwa Kiswahili cha kawaida.
- source_word: ἐπέγνωσαν
  choice: wakatambua
  rationale: Katika muktadha huu walifikia ufahamu kutokana na hali waliyomwona nayo; ‘wakatambua’ huwasilisha utambuzi huo wa ghafla katika simulizi.
- source_word: ὀπτασίαν
  choice: maono
  rationale: Neno hili hapa linaonyesha tukio la kuona jambo la kiungu au la ufunuo; ‘maono’ ni neno la kawaida na lililo wazi.
- source_word: ἐν τῷ ναῷ
  choice: ndani ya patakatifu
  rationale: ναός kwa kawaida hurejelea jengo takatifu la ndani, si eneo lote la Hekalu. ‘Patakatifu’ hudumisha tofauti hiyo.
- source_word: διανεύων
  choice: akaendelea kuwafanyia ishara
  rationale: Muundo wa ἦν pamoja na kitenzi kishirikishi huonyesha tendo lililoendelea; ‘akaendelea’ huleta hali hiyo kwa Kiswahili cha asili.
- source_word: διέμενεν
  choice: akabaki
  rationale: Huwasilisha hali iliyoendelea kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: κωφός
  choice: bubu
  rationale: Muktadha wa karibu unasisitiza kutoweza kusema. ‘Bubu’ huonyesha hali hiyo bila kuamua kimya kimya kwamba pia hakuweza kusikia.
theological_decisions:
- issue: Maana ya κωφός kuhusiana na hukumu ya Zekaria
  choice: bubu
  alternative: kiziwi na bubu
  rationale: Mstari huu unataja wazi kutoweza kusema na kufanya ishara. Kwa kuwa κωφός wakati mwingine inaweza kuhusisha kutosikia, tanbihi huhifadhi uwezekano huo bila kuuingiza kama jambo la hakika katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia ‘alipotoka,’ ‘wakatambua,’ na ‘akaendelea’ ili kudumisha mfuatano na mwendelezo wa matendo bila kuwa wa kikale au mgumu.
