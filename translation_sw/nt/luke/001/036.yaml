  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: sw
  text: Na tazama, Elisabeti, jamaa yako, naye pia amepata mimba ya mtoto wa kiume katika uzee wake; na huu ni mwezi wake wa sita, yeye aliyeitwa tasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni mwito wa kumwelekeza msikilizaji kwenye jambo la kushangaza au muhimu; “tazama” ni ya heshima na ya kawaida katika simulizi la Biblia.
- source_word: συγγενίς
  choice: jamaa
  rationale: Neno linaonyesha mwanamke mwenye uhusiano wa kifamilia bila kubainisha kiwango kamili cha undugu; “jamaa” huhifadhi upana huo.
- source_word: συνείληφεν υἱὸν
  choice: amepata mimba ya mtoto wa kiume
  rationale: Huwasilisha wazi kutungwa kwa mimba na jinsia ya mtoto kama ilivyo katika Kigiriki, kwa lugha ya kawaida ya Kiswahili.
- source_word: ἐν γήρει αὐτῆς
  choice: katika uzee wake
  rationale: Tafsiri ya moja kwa moja inayohifadhi msisitizo wa umri mkubwa wa Elisabeti.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: yeye aliyeitwa tasa
  rationale: Huhifadhi kauli ya kutambulika au kuitwa tasa, badala ya kuibadili kuwa dai la moja kwa moja lisilo na kipengele cha sifa aliyojulikana nayo.
theological_decisions:
- issue: Uhusiano wa kifamilia kati ya Maria na Elisabeti
  choice: jamaa yako
  alternative: binamu yako
  rationale: Kigiriki συγγενίς hakibainishi kwamba alikuwa binamu; tafsiri pana huepuka kuongeza kiwango cha undugu kisichotajwa.
- issue: Maana ya “aliyeitwa tasa”
  choice: aliyeitwa tasa
  alternative: aliyekuwa tasa
  rationale: Muundo wa Kigiriki unasisitiza jinsi alivyokuwa akiitwa au kujulikana; umehifadhiwa bila kuamua zaidi hali yake ya kitabibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umefanywa kuwa wa asili bila kuondoa msisitizo wa “hata Elisabeti” wala mvutano wa kauli “aliyeitwa tasa.”
