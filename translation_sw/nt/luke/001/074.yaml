lexical_decisions:
- source_word: ἀφόβως
  choice: bila hofu
  rationale: Kirai hiki kinatoa kwa Kiswahili cha kawaida maana ya kutenda bila kuogopa; kielezi mbadala ‘kwa ujasiri bila hofu’ kingeongeza wazo lisilo wazi katika neno la Kigiriki.
- source_word: ἐκ χειρὸς
  choice: kutoka mikononi mwa
  rationale: Hii ni nahau inayoonyesha kuondolewa chini ya mamlaka au udhibiti wa mtu. ‘Mikononi mwa’ huhifadhi taswira ya kibiblia na ni ya kawaida katika Kiswahili.
- source_word: ἐχθρῶν
  choice: adui zetu
  rationale: Ingawa Kigiriki hakina kiwakilishi cha umilikaji hapa, muktadha wa unabii huu unawahusu watu wa Mungu na adui zao; ‘zetu’ huweka wazi rejeo la wingi linalodokezwa na muktadha.
- source_word: ῥυσθέντας
  choice: baada ya kuokolewa
  rationale: Kivumishi-tendo timilifu cha hali ya kutendwa kinaonyesha ukombozi unaotangulia kumtumikia Mungu. ‘Baada ya kuokolewa’ huonyesha uhusiano huo wa wakati kwa Kiswahili cha asili.
- source_word: λατρεύειν
  choice: tumtumikie
  rationale: Neno hili linaweza kumaanisha huduma inayotolewa kwa Mungu, ikiwa pamoja na ibada. ‘Tumtumikie’ huhifadhi upana wa utii na ibada bila kuifupisha maana kuwa tendo la ibada pekee.
- source_word: αὐτῷ
  choice: -m- katika ‘tumtumikie’
  rationale: Kiwakilishi hiki kinamrejelea Mungu; kwa sarufi ya Kiswahili huwakilishwa kwa kiambishi cha yambwa ‘-m-’ ndani ya kitenzi.
theological_decisions:
- issue: Upeo wa λατρεύειν inapomhusu Mungu
  choice: tumtumikie
  alternative: tumwabudu
  rationale: ‘Tumtumikie’ hujumuisha huduma ya ibada na utii wa maisha yote, huku ‘tumwabudu’ ikiwezekana lakini inaweza kuifanya maana ionekane kuwa ibada ya kidini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘ili sisi ... tumtumikie’ unaendeleza sentensi kutoka mstari uliotangulia; ‘mikononi mwa’ huhifadhi nahau ya chanzo.
