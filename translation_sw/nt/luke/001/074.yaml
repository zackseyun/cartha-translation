  text: ili sisi, baada ya kuokolewa kutoka mikononi mwa adui zetu,[b] tumtumikie[c] bila hofu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kuogopa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “baada ya kukombolewa kutoka katika mamlaka ya adui zetu.”
    reason: lexical_alternative
  - marker: c
    text: Neno linalotafsiriwa “tumtumikie” linaweza pia kutafsiriwa “tumwabudu,” hasa katika muktadha wa huduma inayotolewa kwa Mungu.
