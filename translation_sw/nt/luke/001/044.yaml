id: LUK.1.44
reference: Luke 1:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: sw
  text: Kwa maana tazama, sauti ya salamu yako ilipoingia masikioni mwangu, mtoto aliruka kwa shangwe tumboni mwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Kihisishi hiki kinadumisha nguvu ya kuvuta usikivu kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: ὡς ἐγένετο
  choice: ilipoingia
  rationale: Katika muundo huu inaonyesha wakati tukio lilipotokea; pamoja na ‘sauti’ na ‘masikioni’ tafsiri hii ni ya asili na inadumisha mwelekeo wa εἰς.
- source_word: φωνὴ τοῦ ἀσπασμοῦ σου
  choice: sauti ya salamu yako
  rationale: ‘Sauti’ inadumisha msisitizo wa jambo lililosikika, huku ‘salamu’ ikiwa neno la kawaida na sahihi kwa ἀσπασμός.
- source_word: εἰς τὰ ὦτά μου
  choice: masikioni mwangu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha sauti iliyofika ndani ya masikio bila tafsiri nzito ya neno kwa neno.
- source_word: ἐσκίρτησεν
  choice: aliruka
  rationale: Kitenzi hiki kinaonyesha mwendo wa ghafla wa mtoto tumboni na kinaeleweka kwa urahisi.
- source_word: ἐν ἀγαλλιάσει
  choice: kwa shangwe
  rationale: ‘Shangwe’ inaonyesha furaha kuu na ya kushangilia iliyo katika ἀγαλλίασις, badala ya furaha ya kawaida tu.
- source_word: τὸ βρέφος
  choice: mtoto
  rationale: βρέφος humaanisha mtoto mchanga au aliye tumboni; ‘mtoto’ ni neno la kawaida, sahihi, na lisilolazimisha hitimisho la ziada.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: tumboni mwangu
  rationale: Katika muktadha wa ujauzito, usemi huu wa Kiswahili ni wa asili na unaonyesha wazi mahali mtoto alikokuwa.
theological_decisions:
- issue: Jinsi ya kutafsiri βρέφος kwa Yohana ambaye bado yuko tumboni
  choice: mtoto
  alternative: mtoto mchanga
  rationale: ‘Mtoto’ inadumisha jinsi andiko lenyewe linavyomtaja bila kuingiza dai la ziada la kimadhehebu; ‘mtoto mchanga’ lingeweza kusikika kana kwamba tayari amezaliwa.
- issue: Nguvu ya ἐν ἀγαλλιάσει
  choice: kwa shangwe
  alternative: kwa furaha
  rationale: ‘Kwa shangwe’ inadumisha maana ya furaha kubwa ya kushangilia bila kueleza chanzo chake au hali ya ndani zaidi ya inavyosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili huku kiunganishi cha ufafanuzi, mvuto wa ‘tazama,’ taswira ya kusikia, na nguvu ya shangwe vikidumishwa.
