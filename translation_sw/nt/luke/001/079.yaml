  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: sw
  text: kuwaangazia wale walioketi gizani na uvulini mwa mauti[a], na kuiongoza miguu yetu kwenye njia ya amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvuli wa kifo”; wengine hulielewa fungu hili kwa maana pana zaidi ya “giza nene,” lakini Kigiriki kinataja wazi “mauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: kuwaangazia
  rationale: Neno hili linahifadhi taswira ya nuru inayowafikia walio gizani na ni la kawaida katika Kiswahili cha sasa.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: wale wanaoketi gizani
  rationale: ‘Wanaoketi’ linadumisha picha halisi ya kitenzi kishirikishi καθημένοις badala ya kuibadili kuwa ‘wanaoishi’.
- source_word: σκότει
  choice: gizani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayoweza kubeba maana halisi na ya kisitiari bila kuifafanua kupita kiasi.
- source_word: σκιᾷ θανάτου
  choice: katika uvuli wa mauti
  rationale: Tafsiri hii inadumisha kutajwa wazi kwa mauti pamoja na taswira ya uvuli na mwangwi wake wa lugha ya Maandiko.
- source_word: τοῦ κατευθῦναι
  choice: kuielekeza
  rationale: Kitenzi hiki kinaonyesha kusudi la kuiongoza miguu katika upande au njia inayofaa bila kulazimisha maana ya ‘kunyoosha’.
- source_word: τοὺς πόδας ἡμῶν
  choice: miguu yetu
  rationale: Tafsiri halisi inadumisha sitiari ya kimwili na nguvu ya kishairi ya kifungu.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: kwenye njia ya amani
  rationale: ‘Njia ya amani’ inadumisha sitiari ya ὁδός kwa Kiswahili cha kawaida; ‘kwenye’ huwasilisha mwendo unaoelekezwa kuingia katika njia hiyo.
theological_decisions:
- issue: Iwapo taswira za giza, uvuli wa mauti, miguu na njia zifafanuliwe kiimani katika tafsiri
  choice: Kudumisha taswira hizo bila kuzifafanua katika matini kuu
  alternative: kuwaangazia walio katika ujinga wa kiroho na mauti, na kutuongoza katika mwenendo unaoleta amani
  rationale: Kifungu ni cha kishairi na kina mwangwi wa Maandiko. Kudumisha taswira zake kunaepusha kuamua kimyakimya ikiwa zinamaanisha ujinga wa kiroho, hatari ya kufa, mwenendo wa kimaadili au maana hizo kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mauti’ limetumiwa badala ya ‘kifo’ katika matini kuu ili kuhifadhi uzito wa kishairi wa usemi; ‘kifo’ limetajwa kama namna nyingine katika tanbihi. Kiunganishi ‘na’ kabla ya kishazi cha pili kinaweka wazi uratibu wa makusudi mawili katika Kiswahili.
