    text: Au, “mtoto wake.” Neno la Kigiriki pais linaweza kumaanisha “mtumishi” au “mtoto”; hapa “mtumishi” limependelewa kwa sababu Agano la Kale humwita Israeli mtumishi wa Mungu.
