lexical_decisions:
- source_word: ἀντελάβετο (ἀντιλαμβάνομαι)
  choice: amemsaidia
  rationale: Kitenzi hiki hapa kina maana ya kushika ili kusaidia au kutegemeza. “Amemsaidia” ni Kiswahili cha kawaida kinachoeleza kwa ufupi tendo la Mungu la kuja kumsaidia Israeli.
- source_word: Ἰσραήλ
  choice: Israeli
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili; katika muktadha huu linarejelea kwa pamoja watu wa Israeli.
- source_word: παιδὸς (παῖς)
  choice: mtumishi
  rationale: Neno hili linaweza kumaanisha “mtumishi” au “mtoto.” Hapa “mtumishi” linafaa zaidi kutokana na mtindo wa Maandiko ya Agano la Kale unaomwita Israeli mtumishi wa Mungu, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: αὐτοῦ
  choice: wake
  rationale: 'Kiwakilishi hiki cha umilikaji kinamrejelea Mungu: Israeli ni mtumishi wake.'
- source_word: μνησθῆναι (μιμνῄσκομαι)
  choice: akikumbuka
  rationale: Kauli hii inaunganisha msaada wa Mungu na kukumbuka kwake. “Akikumbuka” ni ya asili katika Kiswahili na haibani uhusiano huo kuwa kusudi, matokeo, au hali inayoandamana pekee.
- source_word: ἐλέους (ἔλεος)
  choice: rehema
  rationale: “Rehema” ni tafsiri ya moja kwa moja na ya kawaida; inaweza pia kubeba wazo la huruma na uaminifu wa Mungu katika agano, jambo linaloelezwa katika tanbihi bila kulipanua ndani ya matini.
theological_decisions:
- issue: Maana ya παῖς inapomhusu Israeli
  choice: Israeli, mtumishi wake
  alternative: Israeli, mtoto wake
  rationale: Muktadha wa uaminifu wa Mungu kwa agano unaendana na lugha ya Septuajinti na Isaya inayomwita Israeli mtumishi wa Mungu. Kwa kuwa παῖς linaweza pia kumaanisha “mtoto,” uwezekano huo umehifadhiwa katika tanbihi.
- issue: Nguvu ya μνησθῆναι ἐλέους
  choice: akikumbuka rehema
  alternative: ili kukumbuka rehema; kwa kukumbuka rehema
  rationale: Kauli hii inaonyesha kukumbuka kwa Mungu kunakoonekana katika tendo lake la rehema. Tafsiri inabaki fupi na haiamui zaidi ya lazima kama infinitivu hiyo inaonyesha kusudi, matokeo, au hali inayoandamana na tendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kishairi kwa kuwa ni sehemu ya wimbo wa Maria. Alama zote za tanbihi zimewekwa katika matini kuu.
