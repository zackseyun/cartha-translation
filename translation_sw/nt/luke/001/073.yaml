  text: kiapo alichomwapia Abrahamu, baba yetu[a], ili atujalie
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzee wetu wa ukoo.” Kigiriki kinasema kihalisi “baba yetu,” kikihifadhi lugha ya agano kuhusu Abrahamu.
