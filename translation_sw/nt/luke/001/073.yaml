lexical_decisions:
- source_word: ὅρκον
  choice: kiapo
  rationale: Ni shamirisho kinachoendeleza sintaksia ya mstari uliotangulia na kinarejelea kiapo mahususi kilichotajwa katika muktadha.
- source_word: ὃν ὤμοσεν
  choice: alichomwapia
  rationale: Muundo huu wa Kiswahili unaunganisha kiwakilishi rejeshi na kitenzi cha kuapa kwa njia ya kawaida, huku ukidumisha wazo kwamba Mungu alimwapia Abrahamu.
- source_word: πρὸς Ἀβραὰμ
  choice: Abrahamu
  rationale: Pamoja na kitenzi cha kuapa, πρός humwelekeza msikilizaji wa kiapo; kiambishi -mw- katika “alichomwapia” kinawasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: τὸν πατέρα ἡμῶν
  choice: baba yetu
  rationale: Hudumisha lugha halisi ya kifamilia na ya agano kuhusu Abrahamu; “babu yetu” au “m祖 wetu” kungeeleza ukoo lakini kungepunguza mwangwi wa lugha ya kibiblia.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: ili atujalie
  rationale: Artikeli pamoja na kitenzi-jina inaweza kueleza kusudi au matokeo. “Ili atujalie” ni ya asili, yenye hadhi, na huacha sentensi wazi kwa maudhui yanayoendelea katika mstari unaofuata.
theological_decisions:
- issue: Lugha ya agano kuhusu Abrahamu
  choice: baba yetu
  alternative: babu yetu / mhenga wetu
  rationale: “Baba yetu” huhifadhi nahau ya kifamilia na ya agano iliyo katika Kigiriki bila kuongeza dai la kimadhehebu; tanbihi inafafanua uwezekano wa maana ya ukoo.
- issue: Uhusiano wa τοῦ δοῦναι na kiapo
  choice: ili atujalie
  alternative: akatujalia / kutujalia
  rationale: Kigiriki kinaweza kueleweka kwa upande wa kusudi au matokeo. “Ili” ni tafsiri ya kawaida ya kisintaksia hapa, bila kufafanua mapema kitu kinachotolewa, ambacho kinafuata katika mstari unaofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa wimbo wa Zakaria. “Atujalie” limechaguliwa badala ya “atupe” ili kudumisha mtindo ulioinuliwa bila kuwa wa kizamani.
