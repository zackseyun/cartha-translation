  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: sw
  text: kwa sababu ya huruma ya kina ya Mungu wetu, ambayo kwa njia yake mapambazuko[a] kutoka juu yatatutembelea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alfajiri.” Neno la Kigiriki ἀνατολή pia linaweza kudokeza jina la kimasihi “Chipukizi” katika Agano la Kale la Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: kwa sababu ya
  rationale: Pamoja na nomino katika hali ya accusative, διά inaonyesha sababu au msingi; “kwa sababu ya” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: σπλάγχνα ἐλέους
  choice: huruma ya kina
  rationale: Kirahisi ni taswira ya viungo vya ndani pamoja na rehema, nahau inayomaanisha huruma inayotoka ndani kabisa. “Huruma ya kina” ni ya asili na inaeleweka bila kutumia tafsiri sisisi isiyo ya kawaida.
- source_word: θεοῦ ἡμῶν
  choice: ya Mungu wetu
  rationale: Inahifadhi uhusiano wa umilikaji kwa mpangilio wa kawaida wa Kiswahili.
- source_word: ἐν οἷς
  choice: ambayo kwayo
  rationale: Kirai hiki kinarejelea huruma ya Mungu kama msingi au njia inayohusiana na ujio unaofuata; “ambayo kwayo” kinahifadhi uhusiano huo bila kuufafanua kupita kiasi.
- source_word: ἐπισκέψεται
  choice: yatatutembelea
  rationale: Kitenzi ni cha wakati ujao na kinaweza kumaanisha kutembelea kwa kusudi la kusaidia. “Yatatutembelea” kinahifadhi taswira ya asili na kuacha muktadha uonyeshe kwamba kutembelea huku ni kwa neema na wokovu.
- source_word: ἀνατολὴ
  choice: mapambazuko
  rationale: Katika muktadha wa nuru wa mstari unaofuata, maana ya kuchomoza kwa mwanga au alfajiri ndiyo inayoonekana kuwa ya msingi. “Mapambazuko” ni neno la kawaida, lenye hadhi, na linahifadhi taswira ya kishairi.
- source_word: ἐξ ὕψους
  choice: kutoka juu
  rationale: Ni tafsiri ya karibu na ya kawaida ya kirai kinachoelekeza kwenye makao ya juu bila kukipanua moja kwa moja kuwa “kutoka mbinguni.”
theological_decisions:
- issue: Maana ya ἀνατολή katika muktadha wa Kimasihi
  choice: mapambazuko
  alternative: alfajiri; Chipukizi; yule anayechomoza
  rationale: Muktadha wa Luka 1:78–79 unasisitiza mwanga unaowafikia waliomo gizani, hivyo taswira ya mapambazuko ndiyo ya msingi. Hata hivyo, matumizi ya ἀνατολή katika Agano la Kale la Kigiriki yanaweza kudokeza pia jina la Kimasihi “Chipukizi”; uwezekano huo umehifadhiwa katika tanbihi badala ya kulazimishwa katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya kishairi ya mapambazuko yanayotembelea watu imehifadhiwa, huku nahau ya Kigiriki kuhusu huruma ya ndani ikitolewa kwa lugha inayoeleweka.
