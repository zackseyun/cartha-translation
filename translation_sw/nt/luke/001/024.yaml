  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: sw
  text: Baada ya siku hizo[a], Elisabeti, mke wake, alipata mimba; akajificha kwa miezi mitano[b], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya siku hizi.” Kiwakilishi cha Kigiriki kinaweza kutafsiriwa hivyo, ingawa “siku hizo” ni cha kawaida zaidi katika usimuliaji wa Kiswahili unaorejelea wakati uliopita.
    reason: lexical_alternative
  - marker: b
    text: Au, “akajificha” au “akajitenga na watu.” Umbo la kitenzi cha Kigiriki linaonyesha kuwa tendo hilo liliendelea katika kipindi cha miezi mitano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Baada ya siku hizo
  rationale: μετά pamoja na hali ya kushutumiwa huonyesha mfuatano wa wakati. Ingawa ταύτας kwa msingi ni ‘hizi,’ katika usimuliaji wa Kiswahili ‘siku hizo’ ni usemi wa kawaida wa kurejelea kipindi kilichotangulia. δέ ni kiunganishi hafifu na hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: συνέλαβεν
  choice: alipata mimba
  rationale: Katika muktadha huu συλλαμβάνω humaanisha kutunga mimba. ‘Alipata mimba’ ni Kiswahili cha kawaida, wazi na chenye heshima.
- source_word: Ἐλισάβετ
  choice: Elisabeti
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: mkewe
  rationale: γυνή inaweza kumaanisha ‘mwanamke’ au ‘mke’; pamoja na kiwakilishi kimilikishi na katika muktadha huu, maana ni wazi kuwa ‘mke wake.’ ‘Mkewe’ ni umbo la asili na fasaha katika Kiswahili.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: akaendelea kujificha
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea. ‘Akaendelea kujificha’ huhifadhi maana ya kujisitiri mwenyewe na hali endelevu ya tendo hilo.
- source_word: μῆνας πέντε
  choice: kwa miezi mitano
  rationale: Hali ya kushutumiwa huonyesha muda uliodumu; ‘kwa’ huwasilisha kwa kawaida kipindi hicho katika Kiswahili.
- source_word: λέγουσα
  choice: akisema,
  rationale: Umbo la kushiriki linaunganisha moja kwa moja na maneno ya Elisabeti katika mstari unaofuata. ‘Akisema’ huhifadhi uhusiano huo bila kuligeuza kuwa tendo jipya lililojitegemea.
