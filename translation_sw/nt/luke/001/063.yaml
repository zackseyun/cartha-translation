  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: sw
  text: 'Baada ya kuomba kibao cha kuandikia, aliandika hivi: “Yohana ndilo jina lake.”[a] Nao wote wakastaajabu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo wa kawaida zaidi, “Jina lake ni Yohana.” Kigiriki kinasema kwa karibu zaidi, “Yohana ndilo jina lake,” na hivyo kusisitiza jina katika tamko la Zekaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτήσας
  choice: baada ya kuomba
  rationale: Kitenzi shiriki cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; usemi huu unaweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: πινακίδιον
  choice: kibao cha kuandikia
  rationale: Neno hili linamaanisha kibao kidogo kilichotumiwa kuandikia; tafsiri hii ni wazi na inaepuka maana nyingine za neno “kibao.”
- source_word: ἔγραψεν λέγων
  choice: aliandika hivi
  rationale: Ingawa muundo wa Kigiriki unasema kwa karibu zaidi “aliandika, akisema,” Kiswahili hutambulisha maneno yaliyoandikwa kwa kawaida na kwa ufasaha kwa kusema “aliandika hivi.”
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Yohana ndilo jina lake
  rationale: Mpangilio huu unaweka jina “Yohana” mbele na kuhifadhi msisitizo wa tamko la Zekaria, huku ukiwa wa asili katika Kiswahili.
- source_word: ἐθαύμασαν πάντες
  choice: Wote wakastaajabu
  rationale: “Wakastaajabu” huonyesha mshangao wao, na “wote” huhifadhi msisitizo wa kundi zima.
theological_decisions:
- issue: Kauli kuhusu jina la mtoto
  choice: Yohana ndilo jina lake
  alternative: Jina lake litakuwa Yohana
  rationale: Kigiriki kina wakati wa sasa, “ndilo jina lake,” si wakati ujao. Tafsiri hiyo haiingizi wazo lisilotajwa kwamba jina hilo bado lingetolewa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wenye “ndilo” umehifadhi msisitizo wa jina bila kuwa mgumu.
