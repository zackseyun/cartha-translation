  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: sw
  text: Malaika akamwambia, “Usiogope, Maria, kwa maana umepata kibali mbele za Mungu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: akamwambia
  rationale: Katika simulizi, kitenzi hiki kinaingiza maneno ya moja kwa moja yaliyoelekezwa kwa Maria; “akamwambia” ni Kiswahili cha kawaida na huonyesha mtiririko wa matukio.
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika muktadha wa simulizi la kuzaliwa kwa Yesu, huyu ni kiumbe wa mbinguni, hivyo “malaika” ni sahihi kuliko neno la jumla “mjumbe.”
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Hii ni njia ya kawaida, ya moja kwa moja, na ya sasa ya kutoa katazo hilo kwa Kiswahili.
- source_word: Μαριάμ
  choice: Maria
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia na matumizi ya kawaida.
- source_word: εὗρες
  choice: umepata
  rationale: 'Kauli timilifu ya Kiswahili huwasilisha tendo lililotokea pamoja na hali yake ya sasa: Maria sasa yuko katika hali ya kuwa amepata kibali.'
- source_word: χάριν
  choice: kibali
  rationale: Katika nahau εὑρίσκω χάριν παρά, “kibali” huonyesha kukubaliwa au kutazamwa kwa wema bila kuingiza maana maalumu za kimadhehebu zinazoweza kuhusishwa na “neema.”
- source_word: παρὰ τῷ θεῷ
  choice: mbele za Mungu
  rationale: Hii ni nahau ya asili ya Kiswahili inayowasilisha maana ya kupata kibali machoni au katika uwepo wa Mungu.
theological_decisions:
- issue: Tafsiri ya χάριν katika muktadha unaomhusu Maria
  choice: kibali
  alternative: neema
  rationale: Kirai cha Kigiriki εὗρες χάριν παρὰ τῷ θεῷ ni nahau ya “kupata kibali mbele za Mungu.” “Kibali” huhifadhi maana ya uhusiano uliopo katika kirai bila kulazimisha juu ya mstari huu mafundisho ya baadaye kuhusu Maria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi “akamwambia” na nahau “mbele za Mungu” ni wa kawaida na wa asili.
