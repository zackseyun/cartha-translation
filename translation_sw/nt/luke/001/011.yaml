base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: sw
  text: Ndipo malaika wa Bwana akamtokea, akiwa amesimama upande wa kulia wa madhabahu ya uvumba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: akamtokea
  rationale: Katika simulizi, umbo hili la ὁράω lina maana ya ‘kutokea’ au kuonekana kwa mtu. ‘Akamtokea’ ni Kiswahili cha kawaida kinachoonyesha wazi aliyeshuhudia tukio hilo.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi. ‘Ndipo’ linaonyesha hatua inayofuata bila kulifanya neno hilo kuwa kiunganishi cha kupingana.
- source_word: αὐτῷ
  choice: -m- katika ‘akamtokea’
  rationale: Kiambishi cha yambwa ‘-m-’ kinawakilisha dative αὐτῷ na kuweka wazi kwamba malaika alimtokea yeye.
- source_word: ἄγγελος
  choice: malaika
  rationale: Muktadha wa ono ndani ya hekalu unaonyesha kwamba huyu ni kiumbe wa mbinguni, si mjumbe wa kawaida.
- source_word: κυρίου
  choice: wa Bwana
  rationale: Hii ni tafsiri ya kawaida na yenye heshima ya ἄγγελος κυρίου, bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: ἑστὼς
  choice: akiwa amesimama
  rationale: Kirai hiki kinaeleza hali na mkao wa malaika wakati alipotokea.
- source_word: ἐκ δεξιῶν
  choice: upande wa kulia wa
  rationale: Kauli hii inaonyesha mahali aliposimama malaika kwa uhusiano na madhabahu.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: madhabahu ya uvumba
  rationale: Hili linatambulisha madhabahu husika kuwa madhabahu ya uvumba, kwa usemi mfupi na wa kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Tafsiri ya κύριος katika kirai ἄγγελος κυρίου
  choice: Bwana
  alternative: BWANA
  rationale: ‘Bwana’ huhifadhi cheo cha Kigiriki κύριος. Maandishi ya Kigiriki hapa hayasemi wazi jina la Mungu kwa herufi nne, kwa hiyo ‘BWANA’ lingeingiza uamuzi wa ziada wa kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akamtokea’ ni wa asili zaidi kuliko ‘alionekana kwake,’ huku ‘akiwa amesimama’ ikihifadhi taarifa ya kishiriki kuhusu mkao wa malaika.
