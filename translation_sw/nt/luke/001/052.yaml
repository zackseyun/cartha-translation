  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: sw
  text: Amewashusha watawala[a] kutoka kwenye viti vya enzi, na amewainua wanyenyekevu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye nguvu.” Neno la Kigiriki linaweza kumaanisha kwa upana zaidi watu wenye uwezo au nguvu, ingawa kutajwa kwa viti vya enzi kunaunga mkono maana ya watawala.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wa hali ya chini.” Neno la Kigiriki linaweza kumaanisha watu wanyenyekevu na/au watu wenye hali ya chini katika jamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: amewashusha
  rationale: Kitenzi hiki kinaonyesha kuwaondoa watu kutoka mahali pa juu au cheo cha juu. Kauli timilifu ya Kiswahili inaonyesha tendo la Mungu lililotimizwa lenye matokeo yanayoendelea, bila kudokeza kwa lazima mapinduzi ya kutumia nguvu.
- source_word: δυνάστας
  choice: watawala
  rationale: Neno linaweza kumaanisha wenye nguvu au watawala. Kutajwa kwa viti vya enzi kunafanya maana ya watawala ionekane zaidi katika muktadha huu.
- source_word: ἀπὸ θρόνων
  choice: kutoka kwenye viti vya enzi
  rationale: Tafsiri hii inadumisha taswira halisi ya viti vya kifalme bila kuongeza kimyakimya kwamba ni viti vyao wenyewe.
- source_word: ὕψωσεν
  choice: amewainua
  rationale: ‘Kuinua’ ni lugha ya kawaida na yenye hadhi inayohifadhi maana ya kuwapa cheo au hali ya juu, pamoja na taswira ya mabadiliko kutoka chini kwenda juu.
- source_word: ταπεινούς
  choice: wanyenyekevu
  rationale: Neno la Kigiriki linaweza kuelekeza kwenye unyenyekevu au hali duni ya kijamii. ‘Wanyenyekevu’ ni la kawaida na linafaa katika wimbo huu, huku tanbihi ikihifadhi maana nyingine inayowezekana.
theological_decisions:
- issue: Wakati na hali ya vitenzi vya aoristi katika Wimbo wa Maria
  choice: 'Kutumia kauli timilifu: ‘amewashusha ... amewainua’'
  alternative: 'Kauli ya wakati uliopita: ‘aliwashusha ... aliwainua’'
  rationale: Kauli timilifu ya Kiswahili inawasilisha matendo ya Mungu kama yaliyotimizwa na yenye umuhimu unaoendelea, bila kuamua kama maneno hayo ni taarifa ya matukio maalumu ya zamani, muhtasari wa matendo ya Mungu, au usemi wa kinabii.
- issue: Maana ya ταπεινούς
  choice: ‘wanyenyekevu,’ huku maana ya hali ya chini ikitajwa katika tanbihi
  alternative: ‘walio hali ya chini’ au ‘wanyonge’
  rationale: Muktadha wa ugeuzaji wa hali za kijamii unaruhusu maana ya watu wa hali ya chini, lakini neno pia linaweza kuhusisha unyenyekevu. Tafsiri na tanbihi kwa pamoja zinahifadhi mvutano huo bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, rahisi kueleweka na yenye hadhi ya kishairi. ‘Viti vya enzi’ inadumisha taswira ya kifalme ya maandishi ya Kigiriki.
