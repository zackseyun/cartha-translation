  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: sw
  text: Naye Mariamu akasema, “Nafsi yangu humtukuza[a] Bwana,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “inatangaza ukuu wa Bwana.”
    reason: Njia nyingine ya kuwasilisha maana ya μεγαλύνει kwa uwazi zaidi, huku tafsiri kuu ikihifadhi usemi mfupi wa kishairi.
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinahifadhi mtiririko wa simulizi na kuunganisha kauli ya Mariamu na yaliyotangulia bila kuongeza maana mahsusi ya wakati.
- source_word: εἶπεν
  choice: akasema
  rationale: Hii ndiyo tafsiri ya kawaida na ya kiasili ya kitenzi hiki katika utangulizi wa kauli ndani ya simulizi.
- source_word: Μαριάμ
  choice: Mariamu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu na mapokeo ya Biblia ya Kiswahili.
- source_word: Μεγαλύνει
  choice: humtukuza
  rationale: Kitenzi hiki kinaonyesha tendo la kumsifu Mungu kuwa mkuu. Umbo la mazoea ‘humtukuza’ linawasilisha wakati wa sasa wa Kigiriki kwa Kiswahili cha kishairi na cha kawaida.
- source_word: ἡ ψυχή μου
  choice: Nafsi yangu
  rationale: Tafsiri hii inahifadhi usemi wa kishairi na wa kibiblia badala ya kuufupisha kuwa ‘mimi’ au kuufafanua kupita kiasi.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Hapa κύριος ni cheo cha heshima kinachomrejelea Mungu; ‘Bwana’ ndiyo tafsiri ya kawaida, yenye uzito wa kibiblia na inayofaa katika wimbo wa sifa.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: Katika muktadha huu neno hilo ni cheo cha kimungu na lina mwangwi wa lugha ya sifa katika Maandiko. ‘Bwana’ huhifadhi uzito huo kuliko tafsiri inayolenga tu mamlaka ya kawaida.
- issue: Usemi wa kianthropolojia ἡ ψυχή μου
  choice: Nafsi yangu
  alternative: Mimi
  rationale: ‘Nafsi yangu’ inahifadhi lugha ya kishairi na mvutano wake wa kimaana bila kuamua kwamba ψυχή ni kiwakilishi tu cha mtu mzima au istilahi mahsusi ya kisaikolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nafsi yangu’ na ‘Bwana’ huhifadhi mwangwi wa kibiblia bila kutumia lugha ya kizamani.
