id: LUK.1.15
reference: Luke 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: sw
  text: Kwa maana atakuwa mkuu mbele za Bwana, naye hatakunywa kamwe divai wala kileo[a], na atajazwa Roho Mtakatifu hata tangu akiwa tumboni mwa mama yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kileo” hapa ni kinywaji chenye kulevya kisicho divai.
    reason: cultural_note
  - marker: b
    text: Au, “hata kutoka tumboni mwa mama yake,” au “hata alipokuwa bado tumboni mwa mama yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: mkuu
  rationale: “Mkuu” ni lugha ya kawaida na yenye heshima, na huhifadhi wazo la ukubwa na umuhimu bila kufafanua kupita kiasi aina ya ukuu wake.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: mbele za Bwana
  rationale: Usemi huu wa Kiswahili huhifadhi maana ya kuwa machoni au katika tathmini ya Bwana; “Bwana” hapa kwa kawaida humrejelea Mungu.
- source_word: οἶνον καὶ σίκερα
  choice: divai wala kileo
  rationale: “Divai” ni kisawe cha moja kwa moja cha οἶνος; “kileo” huonyesha kinywaji chenye kulevya kisicho divai bila kukifungamanisha na aina moja maalumu.
- source_word: οὐ μὴ πίῃ
  choice: hatakunywa kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi tegemezi unakanusha kwa mkazo sana. “Hatakunywa kamwe” huhifadhi umbo la taarifa ya wakati ujao pamoja na msisitizo wake.
- source_word: πνεύματος ἁγίου
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Luka usemi huu humrejelea Roho wa Mungu; herufi kubwa ni matumizi ya kawaida ya Kiswahili kwa jina hili.
- source_word: πλησθήσεται
  choice: atajazwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na kuonyesha tendo linalofanywa juu yake.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: hata tangu akiwa tumboni mwa mama yake
  rationale: Huhifadhi msisitizo wa ἔτι na mwanzo wa mapema sana unaoonyeshwa na ἐκ, huku “akiwa tumboni” ikibakiza uwezekano wa maana ya kipindi cha kabla ya kuzaliwa.
theological_decisions:
- issue: Nguvu ya οὐ μὴ πίῃ katika tangazo la kinabii
  choice: hatakunywa kamwe
  alternative: asinywe kamwe
  rationale: Tafsiri iliyochaguliwa inadumisha taarifa ya kinabii ya wakati ujao na msisitizo mkali wa ukanushaji, bila kuibadili moja kwa moja kuwa amri ingawa muktadha unaweza kudokeza wakfu maalumu.
- issue: Rejeleo la πνεύματος ἁγίου
  choice: Roho Mtakatifu kama Roho wa Mungu
  alternative: roho takatifu kama nguvu au hali isiyo ya nafsi
  rationale: Matumizi ya Luka na muktadha wa karibu yanaunga mkono rejeleo la Roho wa Mungu; tafsiri haiingizi ufafanuzi zaidi ya kile kifungu kinachosema.
- issue: Wakati unaoonyeshwa na ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: hata tangu akiwa tumboni mwa mama yake
  alternative: hata kutoka tumboni mwa mama yake, yaani tangu kuzaliwa
  rationale: Kigiriki kinaweza kusisitiza chanzo cha mapema sana na pia kueleweka kuwa akiwa bado tumboni. Tafsiri na tanbihi huhifadhi upeo huo badala ya kuamua kimya kimya wakati mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Mbele za Bwana” limetumiwa kama tamko la kibiblia linaloeleweka; “hatakunywa kamwe” hudumisha ukanushaji wa wakati ujao wenye mkazo. Alama zote za tanbihi zimewekwa katika matini kuu.
