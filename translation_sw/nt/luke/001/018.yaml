base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: sw
  text: Zekaria akamwambia malaika, “Nitajuaje jambo hili? Kwa maana mimi ni mzee, na mke wangu amefikia umri mkubwa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “amesonga mbele katika siku zake”; usemi huu humaanisha kwamba alikuwa amezeeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... πρὸς τὸν ἄγγελον
  choice: akamwambia malaika
  rationale: Katika Kiswahili, kitenzi “kumwambia” huonyesha kwa kawaida na kwa ufupi kuwa maneno yanaelekezwa kwa mtu fulani; “malaika” ndilo neno linalofaa katika muktadha huu.
- source_word: Κατὰ τί γνώσομαι τοῦτο;
  choice: Nitajuaje jambo hili?
  rationale: Huhifadhi wazo la kujua baadaye na swali kuhusu msingi au njia ya kupata uhakika, bila kuongeza waziwazi ombi la ishara ambalo halitajwi moja kwa moja katika maneno haya.
- source_word: ἐγὼ γάρ εἰμι πρεσβύτης
  choice: Kwa maana mimi ni mzee
  rationale: πρεσβύτης humaanisha mwanamume mwenye umri mkubwa, si mwenye cheo cha uzee; “mimi ni mzee” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἡ γυνή μου
  choice: mke wangu
  rationale: Katika muktadha wa umilikaji na ndoa ya Zekaria, γυνή humaanisha “mke,” si “mwanamke” kwa ujumla.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: pia amezeeka sana
  rationale: Hii ni Kiswahili cha kawaida kinachowasilisha maana ya nahau ya Kigiriki kwamba mke wake alikuwa amefikia umri mkubwa. Taswira halisi ya “kusonga katika siku zake” imeelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἄγγελος
  choice: malaika
  alternative: mjumbe
  rationale: Ingawa ἄγγελος yaweza kumaanisha “mjumbe,” muktadha unamtambulisha anayesema kuwa Gabrieli, hivyo “malaika” ndiyo maana inayokusudiwa bila kuongeza maelezo ya kimadhehebu.
- issue: Asili ya swali la Zekaria
  choice: Nitajuaje jambo hili?
  alternative: Nitapata ishara gani ya kuthibitisha jambo hili?
  rationale: Tafsiri haiongezi neno “ishara” wala “kuthibitisha,” kwa kuwa hayapo wazi katika sentensi ya Kigiriki; hivyo mvutano kati ya kuuliza njia na kutafuta uhakika unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “akamwambia” unafaa katika simulizi, na “amezeeka sana” huepuka usemi usio wa kawaida huku tanbihi ikihifadhi taswira ya Kigiriki.
