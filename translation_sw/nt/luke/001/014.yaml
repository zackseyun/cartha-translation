lexical_decisions:
- source_word: ἔσται ... σοι
  choice: Utakuwa na
  rationale: Muundo huu ni wa kawaida na wa asili katika Kiswahili kwa kuonyesha kwamba furaha na shangwe zitakuwa sehemu ya uzoefu wa mhusika.
- source_word: χαρά
  choice: furaha
  rationale: Neno la kawaida na linaloeleweka kwa maana ya χαρά.
- source_word: ἀγαλλίασις
  choice: shangwe
  rationale: Linahifadhi tofauti na 'furaha' na kuonyesha hisia yenye nguvu ya kushangilia.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino; kutaja 'watu' ni Kiswahili cha asili na wazi.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: kwa kuzaliwa kwake
  rationale: Muundo huu unaweza kueleweka kuwa kuzaliwa kwake ndiko kutakakokuwa tukio au sababu ya kufurahi, hivyo unahifadhi kwa kiasi fulani upana wa ἐπί pamoja na dative.
- source_word: χαρήσονται
  choice: watafurahi
  rationale: Ni tafsiri ya kawaida ya kitenzi χαίρω na inadumisha uhusiano wake na 'furaha'.
