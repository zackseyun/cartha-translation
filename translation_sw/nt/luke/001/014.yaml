  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: sw
  text: Utakuwa na furaha na shangwe, na watu wengi watafurahi kwa kuzaliwa kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa kuzaliwa kwake.” Kirai cha Kigiriki kinaweza kuonyesha tukio la kufurahi au sababu ya kufurahi.
