id: LUK.1.3
reference: Luke 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: sw
  text: Nami, kwa kuwa nimefuatilia kwa makini mambo yote tangu mwanzo[a], nimeona vema kukuandikia kwa mpangilio[b], Mheshimiwa Theofilo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa nimechunguza kila jambo kwa makini tangu mwanzo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mfuatano.” Huenda usemi huu ukamaanisha mpangilio wenye utaratibu, si lazima mfuatano mkali wa matukio kulingana na wakati.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: nimeona vema
  rationale: Nahau hii huonyesha uamuzi uliofikiwa baada ya kufikiri; “nimeona vema” ni ya asili katika Kiswahili na inadumisha uzito rasmi wa dibaji.
- source_word: κἀμοὶ
  choice: nami
  rationale: “Nami” huonyesha kuwa mwandishi anajiunga na wale waliotajwa kabla yake na kuhifadhi msisitizo wa καί.
- source_word: παρηκολουθηκότι
  choice: kwa kuwa nimefuatilia
  rationale: Kitenzi kinaweza kumaanisha kufuatilia kwa karibu au kuchunguza. “Nimefuatilia” ni sawia ya moja kwa moja, huku “kwa makini” ikionyesha kazi ya uchunguzi.
- source_word: ἄνωθεν
  choice: tangu mwanzo
  rationale: Katika muktadha huu wa kusimulia historia, maana ya wakati—kuanzia mwanzo—ndiyo inayofaa kuliko “kutoka juu.”
- source_word: πᾶσιν
  choice: mambo yote
  rationale: Hurejelea kwa upana matukio na habari zinazozungumziwa; “mambo yote” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀκριβῶς
  choice: kwa makini
  rationale: Hueleza uangalifu na usahihi wa kufuatilia bila kudai ukamilifu usiosemwa na matini.
- source_word: καθεξῆς
  choice: kwa mpangilio
  rationale: Chaguo hili huhifadhi wazo la utaratibu wa uwasilishaji bila kulazimisha maana ya mfuatano mkali wa nyakati.
- source_word: σοι γράψαι
  choice: kukuandikia
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida tendo la kuandika kwa ajili ya mpokeaji aliyetajwa.
- source_word: κράτιστε
  choice: Mheshimiwa
  rationale: Ni neno rasmi la heshima linalofaa kwa namna hii ya kumwita mtu mwenye hadhi, bila kuongeza cheo kisichotajwa.
- source_word: Θεόφιλε
  choice: Theofilo
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya καθεξῆς kuhusiana na mpangilio wa kihistoria
  choice: kwa mpangilio
  alternative: kwa mfuatano; kwa mpangilio wa wakati
  rationale: Neno la Kigiriki linaweza kueleza mfuatano au mpangilio wenye utaratibu, lakini halilazimishi dai la kwamba kila jambo limepangwa kwa kufuata kabisa nyakati. Tafsiri hii inadumisha uwezekano huo bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni rasmi na yenye hadhi inayofaa dibaji ya kazi ya kihistoria, lakini bado ni wazi na ya kawaida kwa msomaji wa leo.
