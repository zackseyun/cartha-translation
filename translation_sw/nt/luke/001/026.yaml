base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: sw
  text: Katika mwezi wa sita[a], malaika Gabrieli alitumwa kutoka kwa Mungu kwenda katika mji wa Galilaya, ulioitwa Nazareti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mwezi wa sita wa ujauzito wa Elisabeti; tazama Luka 1:24, 36.
    reason: cross_reference
  - marker: b
    text: Au, “kwenda katika mji ulioko Galilaya, ulioitwa Nazareti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Katika mwezi wa sita
  rationale: Kirai cha ἐν pamoja na hali ya dativu kinaonyesha wakati. δέ ni kiunganishi hafifu; hakihitaji neno la ziada katika Kiswahili hapa. Tafsiri inahifadhi rejeo lisilotajwa wazi la mwezi huo.
- source_word: ἀπεστάλη
  choice: alitumwa
  rationale: Kitenzi hiki ni aoristi tendwa; “alitumwa” kinahifadhi kauli tendwa na maana ya kupewa utume bila kuongeza ufafanuzi.
- source_word: ὁ ἄγγελος
  choice: malaika
  rationale: Katika muktadha huu ἄγγελος ni kiumbe wa mbinguni, hivyo “malaika” ni sahihi kuliko “mjumbe.”
- source_word: Γαβριὴλ
  choice: Gabrieli
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: kutoka kwa Mungu
  rationale: 'ἀπό pamoja na jenitivi inaonyesha hasa chanzo: malaika alitumwa kutoka kwa Mungu. Hii haibadili kirai kuwa usemi unaosisitiza tu mtendaji.'
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: kwenda katika mji mmoja wa Galilaya
  rationale: εἰς huonyesha mahali anakoelekea. “Mji mmoja wa Galilaya” ni wa kawaida katika Kiswahili na huhifadhi muundo wa jenitivi wa Kigiriki.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: ulioitwa Nazareti
  rationale: Muundo huu una maana halisi ya “ambao jina lake [lilikuwa] Nazareti.” “Ulioitwa Nazareti” ni wa asili na wazi katika Kiswahili.
theological_decisions:
- issue: Rejeo la “mwezi wa sita”
  choice: Limeachwa kuwa “mwezi wa sita” katika matini, huku tanbihi ikieleza kuwa muktadha unahusu mwezi wa sita wa ujauzito wa Elisabeti.
  alternative: Kulieleza moja kwa moja katika matini kuwa mwezi wa sita wa ujauzito wa Elisabeti, au kulichukulia kama mwezi wa sita wa mwaka.
  rationale: Muktadha wa Luka 1:24, 36 unaonyesha ujauzito wa Elisabeti, lakini mstari huu wenyewe hautaji rejeo hilo wazi. Tafsiri inahifadhi ufupi na kiwango cha uwazi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Gabrieli,” “Galilaya,” na “Nazareti” ni maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia.
