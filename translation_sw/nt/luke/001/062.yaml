translation:
  language: sw
  text: Basi wakamwashiria baba yake, wakimuuliza alitaka mtoto aitwe jina gani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na muundo wa Kigiriki: “Basi wakamwashiria baba yake, wakimuuliza ni jina gani ambalo angependa mtoto aitwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνένευον
  choice: wakamwashiria
  rationale: Kitenzi hiki humaanisha kuwasiliana kwa ishara. “Wakamwashiria” ni Kiswahili cha kawaida kinachoonyesha kuwa ishara zilielekezwa kwa baba yake.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi; “Basi” huonyesha mwendelezo huo kwa kawaida.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: baba yake
  rationale: Nomino katika hali ya dative humtaja mtu aliyeelekezewa ishara; kiambishi -mw- katika “wakamwashiria” tayari huwasilisha maana ya “kwa,” hivyo “baba yake” ni ya asili katika Kiswahili.
- source_word: τὸ τί ἂν θέλοι
  choice: waulize alitaka
  rationale: Kirai hiki kinatambulisha swali lisilo la moja kwa moja kuhusu jambo ambalo baba angependa. “Waulize alitaka” huweka wazi kusudi la ishara kwa Kiswahili cha kawaida, ingawa wazo la “kuuliza” linadokezwa na muundo badala ya kutajwa kwa kitenzi tofauti katika Kigiriki.
- source_word: καλεῖσθαι αὐτό
  choice: mtoto aitwe jina gani
  rationale: Muundo wa Kigiriki ni wa kutendwa, “aitwe.” Kumtaja “mtoto” huondoa utata wa kiwakilishi kwa njia ya kawaida, na “jina gani” huwasilisha kwa asili maana ya jina ambalo angeitwa.
