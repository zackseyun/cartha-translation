  text: Zakaria alifadhaika alipomwona[a], na hofu ikamwangukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akimwona.” Kivumishi-tenzi cha Kigiriki ἰδών kinaweza kutafsiriwa kwa namna ya moja kwa moja zaidi, lakini “alipomwona” huonyesha vizuri maana yake ya wakati katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: alifadhaika
  rationale: Kitenzi hiki kinaonyesha kuvurugika au kushtuka moyoni. “Alifadhaika” ni Kiswahili cha kawaida kinachohifadhi hali hiyo bila kuifanya iwe hofu kali, kwa kuwa hofu inatajwa wazi katika sehemu inayofuata.
- source_word: Ζαχαρίας
  choice: Zakaria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi ya Kiswahili sanifu.
- source_word: ἰδών
  choice: alipomwona
  rationale: Kivumishi-tenzi cha wakati uliopita kina nguvu ya wakati katika muktadha huu. Kiambishi cha yambwa “-m-” kinamrejelea malaika aliyetajwa katika mstari uliotangulia.
- source_word: φόβος
  choice: hofu
  rationale: “Hofu” ni tafsiri ya moja kwa moja isiyoongeza ukali ambao nomino yenyewe hailazimishi.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: ikamwangukia
  rationale: Hifadhi taswira ya Kigiriki ya hofu ‘kumwangukia’ mtu, huku usemi ukiendelea kueleweka katika Kiswahili cha kibiblia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na taswira ya hofu kumwangukia Zakaria vimehifadhiwa bila kuongeza maelezo ya kitheolojia.
