  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: sw
  text: Naye ataitawala nyumba ya Yakobo milele[a], na ufalme wake hautakuwa na mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa zama zote.” Nahau ya Kigiriki εἰς τοὺς αἰῶνας inaeleza muda usio na mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: atatawala
  rationale: Kitenzi hiki cha wakati ujao humaanisha kutumia mamlaka ya kifalme. “Atatawala” ni Kiswahili cha kawaida na cha heshima; muktadha wa “ufalme wake” unaweka wazi kwamba ni utawala wa kifalme.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: juu ya nyumba ya Yakobo
  rationale: Kirai hiki kinaonyesha mamlaka juu ya kundi linaloitwa “nyumba ya Yakobo.” Muundo wa kibiblia umehifadhiwa bila kuufasiri moja kwa moja kuwa Israeli au watu wa Mungu.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: Nahau hii ya Kigiriki inaeleza muda usio na mwisho. “Milele” ni tafsiri ya asili na inayoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: βασιλείας
  choice: ufalme
  rationale: Neno linaweza kumaanisha utawala au ufalme. Hapa “ufalme” linaendana kwa ufasaha na kauli kwamba hautakuwa na mwisho, huku likihifadhi maana ya mamlaka ya kifalme.
- source_word: οὐκ ἔσται τέλος
  choice: hautakuwa na mwisho
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kwa msisitizo kwamba ufalme huo hautafikia mwisho, na inahifadhi maana ya wakati ujao.
theological_decisions:
- issue: Upeo wa “nyumba ya Yakobo”
  choice: Kuhifadhi “nyumba ya Yakobo” bila kuipanua kuwa “Israeli” au “watu wa Mungu.”
  alternative: watu wa Israeli; watu wa Mungu
  rationale: Hili ni jina la kimapokeo lenye maana ya agano. Kulihifadhi kunafuata maneno ya tangazo la malaika na hakulazimishi hitimisho fulani la kiteolojia kuhusu upeo wake.
- issue: Muda wa utawala
  choice: Kutafsiri εἰς τοὺς αἰῶνας kuwa “milele” na kusema kwamba ufalme wake “hautakuwa na mwisho.”
  alternative: kwa zama zote; hata zama zote
  rationale: Aya inaonyesha utawala na ufalme usio na mwisho. “Milele” huwasilisha maana hiyo wazi katika Kiswahili cha kawaida, huku tanbihi ikionyesha umbo la karibu zaidi na nahau ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Usemi wa kibiblia “nyumba ya Yakobo” umehifadhiwa kwa sababu ya uzito wake wa kimaagano.
