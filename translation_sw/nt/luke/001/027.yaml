  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: sw
  text: kwa bikira aliyekuwa ameposwa[a] na mwanaume ambaye jina lake lilikuwa Yusufu, wa nyumba ya Daudi; na jina la bikira huyo lilikuwa Mariamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa amefungamanishwa kwa ahadi rasmi ya ndoa.” Neno la Kigiriki linaonyesha hali rasmi ya posa kabla ya ndoa kukamilishwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mariam,” umbo linalokaribia zaidi jina la Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: bikira
  rationale: Neno hili linatoa maana ya kawaida ya Kigiriki hapa, yaani mwanamke ambaye hajawahi kufanya ngono, na marudio yake katika mstari yanahifadhi msisitizo wa Luka.
- source_word: ἐμνηστευμένην
  choice: aliyekuwa ameposwa
  rationale: Muundo wa Kigiriki unaonyesha hali iliyokwisha kuanzishwa ya kufungamanishwa rasmi kwa ahadi ya ndoa. ‘Ameposwa’ ni lugha ya Kiswahili inayoeleweka na yenye uzito zaidi kuliko uchumba wa kawaida wa kisasa.
- source_word: ἀνδρὶ
  choice: na mwanamume
  rationale: Hapa neno linafaa kutafsiriwa ‘mwanamume’ badala ya ‘mume,’ kwa kuwa kifungu kinazungumzia hali ya kuposwa kabla ya maisha kamili ya ndoa.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: ambaye jina lake lilikuwa Yusufu
  rationale: Hii ni tafsiri ya kawaida na wazi ya mtindo wa Kigiriki wa kutaja jina; ‘Yusufu’ ni umbo lililozoeleka katika Kiswahili.
- source_word: ἐξ οἴκου Δαυίδ
  choice: wa nyumba ya Daudi
  rationale: ‘Nyumba ya Daudi’ inahifadhi lugha ya kifalme na ya ukoo iliyomo katika οἶκος bila kuibadilisha moja kwa moja kuwa ufafanuzi wa ‘ukoo.’
- source_word: Μαριάμ
  choice: Mariamu
  rationale: ‘Mariamu’ ni umbo la jina lililozoeleka katika Biblia ya Kiswahili, huku tanbihi ikionyesha umbo linalokaribia zaidi Kigiriki.
theological_decisions:
- issue: Iwapo παρθένος itafsiriwe kwa namna inayohifadhi maana ya ubikira katika simulizi la Luka
  choice: bikira
  alternative: mwanamke kijana
  rationale: Maana ya kawaida ya neno la Kigiriki na muktadha wa karibu vinaunga mkono ‘bikira.’ Tafsiri hii inahifadhi umuhimu wa maneno ya Luka bila kuongeza dai lisilokuwamo katika mstari.
- issue: Uhusiano wa Yusufu na nyumba ya Daudi
  choice: wa nyumba ya Daudi
  alternative: wa ukoo wa Daudi
  rationale: Tafsiri iliyochaguliwa inahifadhi sitiari ya chanzo ya ‘nyumba,’ yenye maana ya kifamilia na kifalme, bila kuifupisha kuwa ukoo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ameposwa’ linaonyesha ahadi rasmi ya ndoa kwa lugha inayoeleweka; ‘nyumba ya Daudi’ linahifadhi msemo wa kibiblia na wa kifalme. Majina Yusufu, Daudi, na Mariamu yanafuata maumbo yaliyozoeleka katika Kiswahili.
