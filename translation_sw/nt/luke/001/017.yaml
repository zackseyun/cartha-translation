id: LUK.1.17
reference: Luke 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: sw
  text: Naye atakwenda mbele yake katika roho na nguvu za Eliya,[a] ili kuelekeza mioyo ya baba kwa watoto,[b] na kuwaelekeza wasiotii kwenye busara ya wenye haki,[c] ili kumtayarishia Bwana watu walio tayari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Katika roho na nguvu za Eliya” humaanisha huduma na uwezeshaji wa kinabii kama wa Eliya; si lazima kumaanisha kwamba Eliya mwenyewe amerudi kihalisi.
    reason: cross_reference
  - marker: b
    text: Au, “mioyo ya baba kuelekea watoto.” Kauli hii ina mwangwi wa Malaki 4:6 na inaweza kudokeza kupatanishwa tena kwa familia.
    reason: lexical_alternative
  - marker: c
    text: Au, “waingie katika ufahamu wa wenye haki” au “wafuate mtazamo wa wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: atakwenda mbele zake
  rationale: Kauli hii inahifadhi maana ya kutangulia mbele ya mtu katika utume bila kumtaja wazi anayerejelewa na kiwakilishi αὐτοῦ.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: katika roho na nguvu za Eliya
  rationale: Tafsiri hii inadumisha muundo wa Kigiriki na kueleza huduma ya kinabii yenye tabia na uwezeshaji unaohusishwa na Eliya, bila kudai kwamba mhusika ndiye Eliya mwenyewe.
- source_word: ἐπιστρέψαι
  choice: kuigeuza … na kuwageuza
  rationale: Kitenzi hiki cha kusudi kina maana ya kugeuza au kuelekeza upya. Kurudiwa kwake kwa Kiswahili kunafanya wazi kwamba pia kinawahusu wasiotii.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: mioyo ya akina baba iwaelekee watoto
  rationale: Kauli hii ni ya kawaida kwa Kiswahili na huhifadhi mwelekeo wa mioyo kuelekea watoto pamoja na mwangwi wa Malaki 4:6.
- source_word: ἀπειθεῖς
  choice: wasiotii
  rationale: Neno hili linaweza kueleza ukaidi au kukataa kushawishika; “wasiotii” linahifadhi maana pana ya kimaadili inayolingana na “wenye haki.”
- source_word: ἐν φρονήσει δικαίων
  choice: waielekee busara ya wenye haki
  rationale: Baada ya wazo la kugeuza, ἐν hapa linaeleweka kimwelekeo au kama kuingia katika namna ya kufikiri. “Busara” linaonyesha ufahamu wa kimaadili na wa vitendo.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: kumtayarishia Bwana watu walio tayari
  rationale: Kitenzi cha kusudi na hali inayotokana na maandalizi yote mawili yamehifadhiwa kwa Kiswahili cha kawaida; κύριος limetafsiriwa “Bwana” bila kufafanua zaidi rejeo lake.
theological_decisions:
- issue: Utambulisho na jukumu katika lugha inayomhusu Eliya
  choice: Yohana anaelezwa akihudumu katika roho na nguvu za Eliya.
  alternative: Kuelewa kwamba Eliya mwenyewe amerudi kihalisi.
  rationale: Kigiriki kinasema “katika roho na nguvu za Eliya,” jambo linaloonyesha mwendelezo na uwezeshaji wa kinabii, si lazima utambulisho wa mtu yuleyule.
- issue: Anayerejelewa na “yake” na “Bwana”
  choice: Kuhifadhi kiwakilishi “yake” na cheo “Bwana” kama vilivyo katika mstari wa Kigiriki.
  alternative: Kutaja wazi “Masihi” au “Yesu” katika matini kuu.
  rationale: Muktadha husaidia kutambua rejeo, lakini mstari wenyewe hautoi jina. Kutolipanua kunahifadhi mvutano na ufupi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Mbele zake” huhifadhi kauli ya chanzo bila kufafanua rejeo; “akina baba” ni usemi wa kawaida wa kundi la baba; na urudiaji wa “kuwageuza” unaweka wazi uhusiano wa kisarufi ambao Kigiriki kinaweza kuuacha ukieleweka.
