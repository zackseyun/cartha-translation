  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: sw
  text: Kwa kuwa watu wengi wamechukua hatua ya kutunga simulizi kuhusu mambo yaliyotimizwa miongoni mwetu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yaliyokamilishwa” au “yaliyothibitishwa kikamilifu miongoni mwetu.”
    reason: Mshiriki πεπληροφορημένων unaweza kueleza kutimizwa au kukamilishwa kwa mambo, na pia, katika matumizi fulani, kuthibitishwa kwake kikamilifu.
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Kwa kuwa
  rationale: Huanzisha dibaji rasmi kwa kutoa msingi wa sentensi inayofuata; ni Kiswahili cha kawaida lakini chenye hadhi inayofaa.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Nomino ‘watu’ imeongezwa kwa uwazi wa kawaida wa Kiswahili bila kuongeza wazo la ‘wengine,’ ambalo halijaelezwa wazi katika Kigiriki.
- source_word: ἐπεχείρησαν
  choice: wamechukua hatua
  rationale: Huonyesha kuanzisha na kushughulikia kazi bila kudokeza kwamba juhudi hiyo ilishindwa, kama ambavyo ‘wamejaribu’ ingeweza kudokeza.
- source_word: ἀνατάξασθαι
  choice: kutunga
  rationale: Katika muktadha huu neno linahusu kuandaa au kuunda kwa mpangilio kazi ya kisimulizi; ‘kutunga’ ni ya asili na haibani maana kwa kukusanya vyanzo pekee.
- source_word: διήγησιν
  choice: simulizi
  rationale: Huwasilisha maelezo ya matukio kwa mtindo wa kifasihi na kihistoria unaofaa dibaji ya Luka.
- source_word: περὶ
  choice: kuhusu
  rationale: Ni kiunganishi cha kawaida na chenye hadhi kinachoonyesha mada ya simulizi.
- source_word: τῶν πεπληροφορημένων
  choice: yaliyotimizwa
  rationale: Huhifadhi umbo la kutendwa na maana inayowezekana zaidi ya mambo kufikishwa kwenye utimilifu, huku maana nyingine halali zikihifadhiwa katika tanbihi.
- source_word: ἐν ἡμῖν
  choice: miongoni mwetu
  rationale: Huonyesha kwamba mambo hayo yalitokea katika mazingira ya jumuiya bila kufafanua kupita kiasi ‘sisi’ ni akina nani.
- source_word: πραγμάτων
  choice: mambo
  rationale: Ni neno pana linaloweza kujumuisha matukio, matendo, na hali halisi zinazosimuliwa; linaakisi upana wa πρᾶγμα.
theological_decisions:
- issue: Maana ya πεπληροφορημένων katika dibaji ya Luka
  choice: yaliyotimizwa
  alternative: yaliyokamilishwa; yaliyothibitishwa kikamilifu
  rationale: Pamoja na πραγμάτων, maana ya mambo yaliyofikishwa kwenye utimilifu au kukamilishwa inafaa zaidi katika muktadha wa matukio yanayosimuliwa. Hata hivyo, neno linaweza pia kueleweka kwa maana ya kuthibitishwa kikamilifu, kwa hiyo uwezekano huo haujafutwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza sentensi ya dibaji hadi aya zinazofuata; kwa hiyo aya hii inaishia kwa koma. Alama ya tanbihi [a] imewekwa katika maandishi.
