  text: ili kuwapa watu wake maarifa ya wokovu katika msamaha wa dhambi zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa njia ya msamaha wa dhambi zao” au “kwa msamaha wa dhambi zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: ili kuwapa
  rationale: Infinitivu yenye kiambishi huonyesha kusudi linalotegemea mstari uliotangulia; “ili kuwapa” huwasilisha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: γνῶσιν
  choice: ujuzi
  rationale: “Ujuzi” huhifadhi maana ya kujua au kuwa na ufahamu bila kufafanua kupita kiasi aina ya maarifa yanayokusudiwa.
- source_word: σωτηρίας
  choice: wa wokovu
  rationale: Muundo “ujuzi wa wokovu” unawakilisha uhusiano wa genitivi na unafaa muktadha wa Luka.
- source_word: τῷ λαῷ αὐτοῦ
  choice: watu wake
  rationale: Dativu huonyesha wapokeaji wa ujuzi huo; “watu wake” ni usemi wa asili unaohifadhi uhusiano wa kimiliki.
- source_word: ἐν ἀφέσει
  choice: katika kusamehewa
  rationale: “Katika” huhifadhi upana wa ἐν, ambao unaweza kueleza mazingira au namna, bila kuamua kwamba maana ni ya njia pekee.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: dhambi zao
  rationale: Wingi wa ἁμαρτιῶν umehifadhiwa katika “dhambi,” na “zao” inarejelea watu wake.
theological_decisions:
- issue: Uhusiano wa wokovu na msamaha wa dhambi
  choice: Wokovu unajulikana katika uhusiano wa karibu na kusamehewa dhambi.
  alternative: 'Kirai kinaweza kueleweka zaidi kama njia: wokovu unajulikana “kwa njia ya” kusamehewa dhambi.'
  rationale: ἐν pamoja na dativu inaweza kubeba vivuli vya maana vinavyokaribiana, kama mazingira au njia. “Katika” huhifadhi mvutano huo bila kuubana kwa tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ujuzi wa wokovu” huhifadhi muundo wa chanzo, huku “kusamehewa dhambi zao” ikiwa ya kawaida na inayoeleweka kwa wasomaji wengi.
