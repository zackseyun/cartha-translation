  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: sw
  text: Wakati wa Elisabeti kujifungua ulipotimia,[a] akazaa mwana wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Wakati wa Elisabeti kujifungua ulipofika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (imewakilishwa kwa mtiririko wa sentensi bila kiunganishi cha pekee)
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi. Katika Kiswahili, mpito huo unaeleweka kiasili bila kuongeza neno la wakati lisilokuwamo wazi katika chanzo.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: wakati ... ulipotimia
  rationale: Huhifadhi wazo la kipindi kufikia utimilifu wake, huku likiwa la kawaida na lenye kueleweka katika Kiswahili.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: wa Elisabeti kujifungua
  rationale: Muundo huu unaonyesha kuwa kipindi kilichotimia ni kile cha Elisabeti kujifungua; kurudia jina huondoa utata wa kiwakilishi kwa njia ya kawaida.
- source_word: ἐγέννησεν
  choice: akazaa
  rationale: Kitenzi cha kisimulizi kinaonyesha tendo lililokamilika na kinaendeleza mfuatano wa matukio kwa ufasaha.
- source_word: υἱόν
  choice: mwana
  rationale: Neno la Kigiriki linamaanisha mwana wa kiume, si mtoto kwa ujumla; ‘mwana’ huhifadhi maana hiyo kwa lugha yenye hadhi.
- source_word: Ἐλισάβετ
  choice: Elisabeti
  rationale: Hili ni umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
