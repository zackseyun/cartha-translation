id: LUK.1.64
reference: Luke 1:64
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: sw
  text: Mara hiyo kinywa chake kikafunguka, na ulimi wake pia[a], naye akaanza kusema[b], akimbariki Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri husema, ‘na ulimi wake ukafunguliwa.’ Lakini Kigiriki kinasema kihalisi, ‘na ulimi wake pia,’ huku kurejeshwa kwa uwezo wake wa kusema kukidokezwa bila kuongeza kitenzi kingine.
    reason: lexical_alternative
  - marker: b
    text: Au ‘naye alikuwa akisema.’ Kitenzi cha Kigiriki kinaweza kukazia kuendelea kusema badala ya kuanza kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: kikafunguka
  rationale: Kitenzi cha hali ya kutendwa katika Kigiriki kinaonyesha kufunguliwa kwa ghafla kwa kinywa chake. Kiswahili cha kawaida hutumia ‘kinywa kikafunguka’ kwa hali hii bila kulazimika kumtaja mtendaji.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi, si lazima kiashirie upinzani.
- source_word: στόμα
  choice: kinywa
  rationale: Ni neno la moja kwa moja la kiungo cha mwili na linafaa katika muktadha wa kurejeshwa kwa uwezo wa kusema.
- source_word: παραχρῆμα
  choice: mara hiyo
  rationale: Linaonyesha kwamba jambo lilitokea papo hapo, mara tu baada ya lililotangulia.
- source_word: γλῶσσα
  choice: ulimi wake pia
  rationale: Tafsiri hii inataja ulimi waziwazi kama Kigiriki na kuhifadhi muundo wake wa kidokezo bila kuongeza moja kwa moja kwamba ‘ulifunguliwa’ au ‘ulifunguliwa vifungo.’
- source_word: ἐλάλει
  choice: akaanza kusema
  rationale: Kauli ya wakati usiotimilika inaweza kueleza tendo linaloendelea au kuanza kwa kusema. Baada ya kipindi cha kuwa bubu, kuanza kusema ndiyo maana ya kimuktadha iliyo ya asili zaidi, huku uwezekano mwingine ukielezwa katika tanbihi.
- source_word: εὐλογῶν
  choice: akimbariki
  rationale: Hili ndilo linganifu la karibu la εὐλογέω na linaonyesha tendo lililoambatana na kusema kwake; ‘akimsifu’ ni tafsiri ya kimuktadha inayowezekana lakini si ya moja kwa moja sawa na hii.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya tendo la kubariki na hutafsiriwa kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya εὐλογῶν anapofanyiwa Mungu
  choice: akimbariki Mungu
  alternative: akimsifu Mungu
  rationale: ‘Akimbariki’ huhifadhi kwa karibu zaidi usemi wa Kigiriki bila kuufanya moja kwa moja kuwa ‘kusifu,’ ingawa katika muktadha kumbariki Mungu kunahusisha kumsifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘na ulimi wake pia’ umehifadhiwa kwa makusudi ili kutoingiza maneno yasiyokuwapo wazi katika Kigiriki; tanbihi inafafanua usemi huo. Alama za tanbihi zimepangwa kulingana na sehemu zinazohusika katika maandishi.
