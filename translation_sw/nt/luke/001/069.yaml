  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: sw
  text: naye ametuinulia pembe ya wokovu katika nyumba ya Daudi mtumishi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwokozi mwenye nguvu.” Neno kwa neno, “pembe ya wokovu,” ni taswira ya kibiblia inayomaanisha nguvu kuu ya kuokoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: ametuinulia
  rationale: Kauli ya wakati uliopita katika Kigiriki inaeleza tendo la Mungu kama lililotimizwa; wakati timilifu wa Kiswahili unafaa katika muktadha huu wa sifa. Kitenzi “kuinulia” pia kinahifadhi nahau ya kibiblia ya Mungu kumleta mkombozi.
- source_word: κέρας σωτηρίας
  choice: pembe ya wokovu
  rationale: Tafsiri hii inahifadhi taswira halisi ya kibiblia ya pembe kama ishara ya nguvu na ushindi unaoleta wokovu, bila kuifupisha moja kwa moja kuwa cheo cha “Mwokozi mwenye nguvu.”
- source_word: ἡμῖν
  choice: -tu- katika “ametuinulia”
  rationale: Kiambishi cha yambwa “-tu-” kinaonyesha kwa kawaida kwamba tendo hilo limefanywa kwa faida yetu.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: katika nyumba ya Daudi
  rationale: “Nyumba” hapa humaanisha ukoo au nasaba ya kifalme, lakini usemi wa asili umehifadhiwa ili kudumisha mwangwi wa agano la Daudi.
- source_word: παιδὸς αὐτοῦ
  choice: mtumishi wake
  rationale: Katika matumizi haya ya kibiblia, παῖς humtaja Daudi katika uhusiano wake na Mungu kama mtumishi wake, si kama mtoto mdogo.
theological_decisions:
- issue: Kuhifadhi taswira ya “pembe ya wokovu” au kuitafsiri moja kwa moja kuwa “Mwokozi mwenye nguvu”
  choice: Taswira “pembe ya wokovu” imehifadhiwa katika matini kuu.
  alternative: Mwokozi mwenye nguvu
  rationale: Taswira halisi ya Kigiriki ina mizizi katika lugha ya Agano la Kale kuhusu nguvu za kifalme na ukombozi wa ushindi. Kuihifadhi hudumisha uhusiano huo wa kifasihi na kitheolojia, huku tanbihi ikisaidia wasomaji kuelewa maana yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye heshima. Muundo “ametuinulia” ni wa kawaida na unaunganisha kwa ufupi tendo na walengwa wake. “Nyumba ya Daudi” imehifadhiwa kama nahau ya kibiblia ya ukoo wa kifalme; tanbihi inafafanua taswira isiyo ya kawaida ya “pembe ya wokovu.”
