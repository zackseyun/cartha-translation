  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: sw
  text: Naye atawafanya wengi wa wana wa Israeli wamgeukie Bwana Mungu wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “Waisraeli.” Kigiriki kinasema “wana wa Israeli,” kikihifadhi usemi wa jadi wa kiagano.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi kutoka mstari uliotangulia, huku kiwakilishi cha nafsi kikimtaja mhusika anayezungumziwa.
- source_word: πολλοὺς
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino; “wengi” ni tafsiri fupi na ya kawaida.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: miongoni mwa wana wa Israeli
  rationale: Muundo wa Kigiriki unaonyesha kwamba ni wengi kutoka katika kundi hilo. “Wana wa Israeli” huhifadhi usemi wa jadi wa agano na umbo la kiume la υἱῶν.
- source_word: ἐπιστρέψει
  choice: atawageuza
  rationale: Kitenzi ni cha wakati ujao na kina mtendaji anayesababisha wengine wageuke; tafsiri hii huhifadhi nguvu yake ya kutendeka bila kutumia neno lenye tafsiri ya ziada kama “atawaongoa.”
- source_word: ἐπὶ
  choice: wamwelekee
  rationale: Pamoja na ἐπιστρέφω na hali ya accusative, kihusishi huonyesha kuelekezwa kwa mtu; Kiswahili cha asili huunganisha wazo hilo katika “wamwelekee.”
- source_word: κύριον
  choice: Bwana
  rationale: Katika muktadha huu neno linamtaja Mungu wa Israeli, si bwana wa kibinadamu, na lina uzito wa kiagano.
- source_word: τὸν θεὸν αὐτῶν
  choice: Mungu wao
  rationale: Ni maelezo yanayofafanua “Bwana” na kuhifadhi usemi wa uhusiano wa agano.
theological_decisions:
- issue: Tafsiri ya usemi wa agano τῶν υἱῶν Ἰσραὴλ
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” hufuata umbo la kiume la Kigiriki na kuhifadhi mwangwi wa usemi wa jadi wa Maandiko, huku tanbihi ikionyesha tafsiri mbadala za kawaida.
- issue: Rejeleo la κύριον τὸν θεὸν αὐτῶν
  choice: Bwana, Mungu wao
  alternative: bwana wao
  rationale: Kirai cha maelezo “Mungu wao” kinabainisha kwamba κύριον hapa ni Mungu wa Israeli na kuhifadhi uzito wa kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. “Naye” huendeleza mtiririko wa simulizi; “wamwelekee” hufanya sentensi iwe ya kawaida kwa Kiswahili huku “atawageuza” ikihifadhi usababishaji wa kitenzi cha Kigiriki.
