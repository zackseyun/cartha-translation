  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: sw
  text: Na watu walikuwa wakimngojea Zekaria, nao walikuwa wakishangaa kwa kukawia kwake hekaluni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jengo takatifu la hekalu.” Neno la Kigiriki hapa linarejelea kwa usahihi zaidi jengo la hekalu lenyewe, si viwanja vyote vya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: watu
  rationale: Nomino hii ya jumla inarejelea watu waliokusanyika nje; “watu” ni ya kawaida na ya asili katika Kiswahili.
- source_word: προσδοκῶν
  choice: walikuwa wakimngojea
  rationale: Muundo pamoja na ἦν unaonyesha tendo lililokuwa likiendelea; tafsiri hii inadumisha hali hiyo.
- source_word: Ζαχαρίαν
  choice: Zekaria
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: ἐθαύμαζον
  choice: walishangaa
  rationale: Kitenzi kinaonyesha mshangao wao ulioendelea bila kuongeza sababu nyingine isiyotajwa na matini.
- source_word: ἐν τῷ χρονίζειν
  choice: kwa kuwa alikawia
  rationale: Muundo huu wa kisarufi unaonyesha hali iliyosababisha mshangao wao, yaani kuchukua muda mrefu kuliko walivyotarajia.
- source_word: ναῷ
  choice: mle patakatifu
  rationale: ναός hapa inarejelea jengo takatifu la hekalu lenyewe, si eneo lote la viwanja vya hekalu; “patakatifu” hudumisha utofautishaji huo.
- source_word: αὐτόν
  choice: ali-
  rationale: Kiwakilishi hiki ni mtenda wa χρονίζειν; katika Kiswahili kinawakilishwa kiasili na kiambishi cha nafsi katika “alikawia.”
theological_decisions:
- issue: Upeo wa maana ya ναός
  choice: mle patakatifu
  alternative: hekaluni
  rationale: Muktadha wa huduma ya kikuhani na matumizi ya ναός huonyesha sehemu takatifu ya jengo la hekalu, tofauti na viwanja vyake vyote. Tanbihi inatoa neno pana zaidi linalofahamika kwa urahisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakati huo” huunganisha sentensi kwa kawaida bila kubadili maana; “mle” huonyesha mahali palipotajwa tayari. Tanbihi imewekwa baada ya kirai kinachohusika.
