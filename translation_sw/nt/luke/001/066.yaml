id: LUK.1.66
reference: Luke 1:66
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: sw
  text: Wote waliosikia mambo hayo wakayaweka mioyoni mwao, wakisema, “Basi, mtoto huyu atakuwa nini?”[a] Kwa maana mkono wa Bwana ulikuwa pamoja naye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoto huyu atakuja kuwa mtu wa namna gani?” Kitenzi cha Kigiriki ni “atakuwa,” lakini katika muktadha swali linahusu utambulisho au jukumu lake la baadaye.
    reason: lexical_alternative
  - marker: b
    text: “Mkono wa Bwana” ni nahau ya kibiblia inayoweza kumaanisha nguvu, kibali, au uongozi wa Mungu unaotenda kazi.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: wakayaweka mioyoni mwao
  rationale: Huhifadhi sitiari ya Kigiriki ya kuyaweka mambo moyoni, huku ikionyesha kuyatunza na kuyatafakari kwa makusudi.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Wote waliosikia mambo hayo
  rationale: Kirai hiki kinawahusu watu wote waliosikia matukio yaliyotangulia; “mambo hayo” linaweka wazi rejeo linaloeleweka katika muktadha.
- source_word: Τί ἄρα
  choice: Basi, ... nini?
  rationale: “Basi” linaonyesha hitimisho au swali linalotokana na mambo yaliyotokea, kama ἄρα.
- source_word: τὸ παιδίον τοῦτο
  choice: mtoto huyu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya παιδίον τοῦτο bila kusisitiza umri au jinsia zaidi ya maandishi.
- source_word: ἔσται
  choice: atakuwa
  rationale: Hufuata kitenzi rahisi cha Kigiriki “atakuwa” na kuhifadhi uwazi wake kuhusu utambulisho au jukumu la mtoto la baadaye.
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Katika muktadha huu kirai kinaanzisha sababu ya swali la watu; “Kwa maana” ni Kiswahili cha asili kinachobeba uhusiano huo.
- source_word: χεὶρ κυρίου
  choice: mkono wa Bwana
  rationale: Huhifadhi nahau na sitiari ya kibiblia badala ya kuifafanua kwa maana moja tu kama msaada, nguvu, au kibali.
- source_word: κυρίου
  choice: Bwana
  rationale: Hapa κύριος humrejelea Mungu na inatafsiriwa kwa neno la heshima la kawaida katika Kiswahili cha Biblia.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Μετά pamoja na umilikishi humaanisha “pamoja na”; kiwakilishi kinamrejelea mtoto bila kuongeza ufafanuzi usiotajwa.
theological_decisions:
- issue: Maana ya nahau “mkono wa Bwana ulikuwa pamoja naye”
  choice: Kuhifadhi sitiari kama kauli ya utendaji, kibali, nguvu, au uongozi wa Mungu bila kuibana kwa maana moja.
  alternative: “Bwana alikuwa akimsaidia” au “nguvu za Mungu zilikuwa juu yake.”
  rationale: Maandishi yanaonyesha ushiriki hai wa Mungu katika maisha ya mtoto, lakini hayasemi ikiwa hasa ni ulinzi, uwezeshaji, kibali, uongozi, au yote hayo. Sitiari inahifadhi upana huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari za msingi za Kigiriki zikihifadhiwa. Alama za tanbihi zimewekwa baada ya vifungu vinavyozifafanua.
