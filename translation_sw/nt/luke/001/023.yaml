  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: sw
  text: Ikawa, siku za huduma yake zilipotimia, alikwenda nyumbani kwake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye nyumba yake.” Neno la Kigiriki linaweza kumaanisha nyumba yenyewe au, kwa maana pana zaidi, makao yake au watu wa nyumbani kwake.
    reason: lexical_alternative
  - marker: b
    text: “Huduma” hapa ni zamu ya Zekaria ya kutekeleza wajibu wake wa ukuhani hekaluni.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Katika muundo huu, καὶ ἐγένετο ni fomula ya masimulizi ya Luka. Kiswahili cha kawaida huwasilisha mwendelezo huo kwa kishazi cha wakati bila kusema ‘ikawa kwamba,’ ambako kungekuwa kuzito na kwa kizamani.
- source_word: ὡς
  choice: -lipo-
  rationale: Kiambishi cha wakati katika ‘zilipotimia’ kinawasilisha ὡς kwa Kiswahili cha kawaida na kwa usahihi.
- source_word: ἐπλήσθησαν
  choice: zilitimia
  rationale: Kitenzi hiki kinaonyesha kwamba siku zilizowekwa zilifikia ukomo wake; ‘zilitimia’ huhifadhi dhana ya kufikia utimilifu wa muda bila kudokeza tu kwamba kazi ilikatishwa.
- source_word: λειτουργίας
  choice: huduma
  rationale: ‘Huduma’ ni neno la kawaida na lenye heshima. Katika muktadha huu ni wajibu wa Zekaria wa kuhudumu kama kuhani hekaluni, jambo linalofafanuliwa katika tanbihi.
- source_word: ἀπῆλθεν
  choice: alikwenda
  rationale: ‘Alikwenda’ ni tafsiri ya kawaida na ya moja kwa moja ya kitendo cha kuondoka kwenda mahali pengine.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: ‘Nyumbani kwake’ ni Kiswahili asilia na kinaweza kuelekeza kwenye nyumba yenyewe au nyumbani/wanakaya kwa maana pana, kama οἶκος.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Fomula ya Kigiriki καὶ ἐγένετο imewasilishwa kwa muundo asilia wa kishazi cha wakati badala ya kaliki nzito ‘ikawa kwamba.’ Alama za tanbihi zimewekwa baada ya sentensi ili zisivuruge usomaji.
