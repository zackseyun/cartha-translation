base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: sw
  text: katika utakatifu na uadilifu mbele zake siku zetu zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: katika
  rationale: Kihusishi hiki kinaonyesha hali au namna ya kumtumikia Mungu, na kinahifadhi muundo wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: ὁσιότητι
  choice: utakatifu
  rationale: Neno hili linasisitiza maisha matakatifu na uchaji katika uhusiano na Mungu; “utakatifu” ni la asili na lenye hadhi katika muktadha huu.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha sifa mbili.
- source_word: δικαιοσύνῃ
  choice: uadilifu
  rationale: Katika muktadha huu wa mwenendo mbele za Mungu, “uadilifu” linaeleza kuwa sawa na kunyoofu kimaadili, huku maana mbadala ya “haki” ikihifadhiwa katika tanbihi.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele zake
  rationale: Usemi huu wa kawaida una maana ya kuwa machoni au katika uwepo wake, yaani Mungu.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: siku zetu zote
  rationale: Tafsiri hii ni ya asili, inafuata maneno ya Kigiriki, na inaonyesha muda wote wa maisha bila kuongeza neno lisilokuwamo moja kwa moja katika matini.
theological_decisions:
- issue: Tafsiri ya δικαιοσύνη katika muktadha wa maadili usio wa Paulo
  choice: uadilifu
  alternative: haki
  rationale: Kwa kuambatana na “utakatifu” na kueleza mwenendo mbele za Mungu, “uadilifu” linaonyesha kwa uwazi unyoofu wa kimaadili. “Haki” pia inawezekana, hasa inaposisitizwa hali ya kuwa sawa au kutenda kwa haki, kwa hiyo imehifadhiwa kama maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kwa sababu mstari huu unaendeleza sentensi iliyoanza katika mistari iliyotangulia; “mbele zake” linarejelea Mungu.
