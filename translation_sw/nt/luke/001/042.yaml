  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: sw
  text: Akapaza sauti kwa nguvu, akasema,[a] “Umebarikiwa wewe miongoni mwa wanawake, na limebarikiwa tunda la tumbo lako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapaza kilio kikubwa.”
    reason: 'Tofauti ya kileksika: κραυγῇ μεγάλῃ inaweza kutafsiriwa kwa ukaribu zaidi kuwa “kilio kikubwa,” ingawa katika Kiswahili inaweza kudokeza huzuni.'
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: akapaza sauti
  rationale: Kitenzi hiki kinaonyesha kusema kwa sauti yenye nguvu. ‘Akapaza sauti’ ni Kiswahili cha kawaida kinachoonyesha ukubwa wa sauti bila kudokeza huzuni au kilio.
- source_word: κραυγῇ μεγάλῃ
  choice: sauti kubwa
  rationale: Kirai hiki kinaeleza namna alivyosema. ‘Sauti kubwa’ ni cha asili katika Kiswahili na kinahifadhi nguvu na usikikaji wa usemi.
- source_word: Εὐλογημένη
  choice: umebarikiwa
  rationale: Hali timilifu ya neno la Kiyunani inaonyesha kwamba baraka hiyo iko juu yake. ‘Umebarikiwa’ hudumisha kauli ya baraka bila kuongeza mafundisho yasiyosemwa na andiko.
- source_word: ἐν γυναιξίν
  choice: miongoni mwa wanawake
  rationale: Tafsiri hii inahifadhi ulinganisho wa Maria na wanawake kwa ujumla bila kuongeza neno ‘wote,’ ambalo halipo wazi katika Kiyunani.
- source_word: εὐλογημένος
  choice: amebarikiwa
  rationale: Muundo huu unalingana na ‘umebarikiwa’ na kuhifadhi usambamba wa baraka kwa Maria na kwa uzao alioubeba.
- source_word: ὁ καρπὸς
  choice: uzao
  rationale: Katika muktadha huu καρπός ni taswira ya mtoto aliye tumboni. ‘Uzao’ ni neno la Kiswahili linaloeleweka na kuhifadhi sitiari kwa njia ya asili zaidi kuliko ‘tunda.’
- source_word: τῆς κοιλίας σου
  choice: wa tumbo lako
  rationale: Katika muktadha wa ujauzito κοιλία linahusu tumbo la uzazi. Kirai ‘uzao wa tumbo lako’ ni cha heshima, wazi, na kinadumisha picha ya kimama.
theological_decisions:
- issue: Namna ya kutafsiri kauli ya baraka kwa Maria
  choice: Umebarikiwa wewe miongoni mwa wanawake
  alternative: Wewe ni mbarikiwa miongoni mwa wanawake
  rationale: Kauli iliyochaguliwa inawasilisha baraka ya Elisabeti kwa Maria bila kupunguza wala kupanua nafasi yake kwa kuingiza kauli za kimafundisho ambazo hazimo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa baraka na usambamba wa vifungu viwili umehifadhiwa.
