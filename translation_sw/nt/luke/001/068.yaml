  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: sw
  text: “Ahimidiwe Bwana, Mungu wa Israeli, kwa sababu amewajilia[a] watu wake na kuwaletea ukombozi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuja kuwasaidia”; neno la Kigiriki linalotafsiriwa “amewajilia” ni usemi wa kibiblia unaoonyesha kwamba Mungu amewaangalia watu wake kwa makini na kuingilia hali yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ahimidiwe
  rationale: Katika tamko hili la sifa, neno hili linamaanisha kumtangaza Mungu kuwa anastahili sifa. “Ahimidiwe” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi nguvu ya baraka na sifa.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo cha Mungu, na hapa inadumisha mwangwi wa lugha ya Maandiko kuhusu Mungu wa Israeli.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: Mungu wa Israeli
  rationale: Inahifadhi moja kwa moja jina la kibiblia linalomtambulisha Bwana kuwa Mungu wa Israeli.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha sababu ya kumsifu Mungu na ni ya wazi katika Kiswahili cha sasa.
- source_word: ἐπεσκέψατο
  choice: amewajilia
  rationale: Kitenzi kinaeleza kuja kwa Mungu kwa uangalifu na kwa kusudi la kutenda. “Amewajilia” huhifadhi taswira ya kibiblia ya ujio wa Mungu bila kuifupisha kuwa msaada pekee.
- source_word: ἐποίησεν λύτρωσιν
  choice: kuwaletea ukombozi
  rationale: Tafsiri hii ya kawaida huwasilisha tendo na matokeo ya msemo wa Kigiriki, ambao kihalisi ni ‘alifanya ukombozi,’ bila kuwa mgumu katika Kiswahili.
- source_word: λύτρωσιν
  choice: ukombozi
  rationale: Neno hili huhifadhi maana ya kuachiliwa au kuokolewa, pamoja na uzito wake wa kitheolojia katika muktadha wa wokovu.
- source_word: τῷ λαῷ αὐτοῦ
  choice: watu wake
  rationale: Huwatambulisha wazi walengwa na wanufaika wa tendo la Mungu. Kiambishi cha yambwa katika “kuwaletea” kinaonyesha kwamba ukombozi umeletwa kwa ajili yao.
theological_decisions:
- issue: Lugha ya Mungu kuwajilia watu wake
  choice: amewajilia
  alternative: amekuja kuwasaidia
  rationale: Tafsiri inadumisha sitiari ya kibiblia ya Mungu kuja kwa watu wake na kuingilia hali yao kwa wokovu, badala ya kuifafanua kwa maana nyembamba ya msaada tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ahimidiwe” linafaa kwa tamko la ibada, huku “amewajilia” likihifadhi lugha ya Maandiko na linafafanuliwa katika tanbihi.
