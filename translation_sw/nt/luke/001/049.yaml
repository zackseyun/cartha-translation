id: LUK.1.49
reference: Luke 1:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: sw
  text: kwa sababu Mwenye Nguvu amenifanyia mambo makuu, na takatifu ni jina lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na jina lake ni takatifu.” Kigiriki kinaweka “takatifu” kabla ya “jina lake” ili kulikazia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha sababu ya Maria kumtukuza Bwana katika mstari uliotangulia na kuhifadhi wazi uhusiano wa kisababishi.
- source_word: ἐποίησέν μοι
  choice: amenifanyia
  rationale: Wakati uliopita wa Kigiriki unaonyesha tendo lililotimizwa lenye umuhimu wa sasa, na kiambishi “-ni-” pamoja na “-fanyia” kinaonyesha kwa kawaida kwamba tendo hilo lilifanywa kwa manufaa ya Maria.
- source_word: μεγάλα
  choice: mambo makuu
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; “mambo makuu” ni Kiswahili cha kawaida kinachobaki na upana wa maana ya matendo makubwa bila kuibana.
- source_word: ὁ δυνατός
  choice: Mwenye Nguvu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama cheo cha Mungu. “Mwenye Nguvu” ni jina la heshima lililo wazi na la kawaida katika Kiswahili.
- source_word: ἅγιον
  choice: takatifu
  rationale: Hueleza jina la Mungu kuwa takatifu; neno hili huhifadhi maana ya utakatifu na kutengwa kwa ajili ya Mungu.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; haipanui kimafafanuzi maana ya kibiblia ya “jina.”
theological_decisions:
- issue: Kutafsiri ὁ δυνατός kama cheo cha Mungu
  choice: Mwenye Nguvu
  alternative: yeye aliye na nguvu
  rationale: Muundo wa Kigiriki unakitumia kivumishi kama nomino na cheo cha heshima. Herufi kubwa inaonyesha matumizi hayo bila kuongeza fundisho lisilokuwamo katika maandishi.
- issue: Mpangilio wa maneno katika καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: na takatifu ni jina lake
  alternative: na jina lake ni takatifu
  rationale: Kuweka “takatifu” mwanzo kunahifadhi mkazo wa mpangilio wa Kigiriki na bado kunaeleweka katika mtindo wa sifa wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kishairi katika kishazi cha mwisho umehifadhiwa kwa ajili ya mkazo, huku tanbihi ikitoa mpangilio wa kawaida zaidi wa Kiswahili.
