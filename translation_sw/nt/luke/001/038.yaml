  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: sw
  text: Maria akasema, “Tazama, mimi ni mtumishi wa Bwana[a]. Na iwe kwangu kulingana na neno lako[b].” Malaika akaondoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumwa wa kike wa Bwana.” Neno la Kigiriki δούλη linaweza kumaanisha mtumwa wa kike au mtumishi; hapa “mtumishi” limetumiwa kwa sababu muktadha unasisitiza kujisalimisha kwa unyenyekevu kwa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au “Na yatendeke kwangu kama ulivyosema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: akasema
  rationale: Kiunganishi hiki ni chepesi; katika Kiswahili mtiririko wa simulizi unaonyeshwa kwa kawaida na kiambishi cha mfululizo -ka- bila kulazimisha maana mahsusi ya wakati.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno hili linahifadhi msisitizo na uzito wa Maria kujitambulisha, huku likibaki linaeleweka katika Kiswahili sanifu.
- source_word: δούλη
  choice: mtumishi
  rationale: Neno la Kigiriki ni la jinsia ya kike na linaweza kumaanisha mtumwa wa kike au mtumishi. “Mtumishi” linaeleza unyenyekevu na kujisalimisha kwa Maria kwa Mungu kwa lugha ya kawaida yenye heshima; maana yenye nguvu zaidi imeonyeshwa katika tanbihi.
- source_word: κυρίου
  choice: wa Bwana
  rationale: Hili ndilo namna ya kawaida na ya wazi ya kuonyesha uhusiano wa Maria na Mungu, huku ikihifadhi “Bwana” kama cheo cha kimungu.
- source_word: γένοιτό μοι
  choice: Na iwe kwangu
  rationale: Kauli hii huwasilisha ombi au ridhaa ya hiari, si taarifa tu ya jambo la baadaye. Muundo huu unahifadhi mvutano huo bila kuongeza maelezo.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: kama ulivyosema
  rationale: Katika muktadha huu ῥῆμα ni ujumbe maalumu ambao malaika ametoka kuusema. Kiswahili hiki ni cha asili na kinaonyesha kwamba Maria anakubali jambo litokee kwa kupatana na ujumbe huo.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: akaondoka kwake
  rationale: Ni hitimisho la kawaida la kisimulizi linaloonyesha malaika aliondoka mahali alipokuwa pamoja na Maria.
- source_word: ὁ ἄγγελος
  choice: malaika
  rationale: Katika simulizi hili neno linamaanisha kiumbe wa mbinguni, si mjumbe wa kibinadamu.
theological_decisions:
- issue: Maana ya Maria kujiita δούλη
  choice: mtumishi wa Bwana
  alternative: mtumwa wa kike wa Bwana
  rationale: Neno lenyewe linaweza kuonyesha hali ya utumwa, lakini hapa linasisitiza hasa unyenyekevu na kujisalimisha kwa Maria kwa mapenzi ya Mungu. Tanbihi inahifadhi maana yenye nguvu zaidi bila kuifanya taasisi ya utumwa kuwa kiini cha mstari.
- issue: Nguvu ya γένοιτό μοι
  choice: Na iwe kwangu kama ulivyosema
  alternative: Na yatendeke kwangu kulingana na neno lako
  rationale: Hali ya optative inaonyesha ridhaa yenye hiari au ombi, wala si utabiri wa kawaida. Tafsiri iliyochaguliwa ni ya asili katika Kiswahili na haiongezi kauli ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” linadumisha uzito wa kauli bila kuwa la mazungumzo mno; “kama ulivyosema” linafanya ridhaa ya Maria isikike kwa urahisi kwa msomaji wa kawaida.
