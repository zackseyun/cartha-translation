translation:
  language: sw
  text: na roho yangu imeshangilia katika Mungu, Mwokozi wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yangu imemfurahia Mungu, Mwokozi wangu.”
    reason: Mbadala wa kileksia kwa ἠγαλλίασεν na uhusiano wa ἐπὶ τῷ θεῷ.
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha mstari huu na uliotangulia na kuhifadhi ulinganifu wa kishairi.
- source_word: ἠγαλλίασεν
  choice: imemfurahia
  rationale: Kitenzi hiki huonyesha furaha kubwa na yenye msisimko. ‘Imemfurahia’ ni Kiswahili cha kawaida kinachowasilisha kwa ufasaha kuelekezwa kwa furaha hiyo kwa Mungu; tanbihi inahifadhi maana mbadala yenye mkazo wa kushangilia.
- source_word: τὸ πνεῦμά μου
  choice: roho yangu
  rationale: ‘Roho yangu’ huhifadhi neno tofauti na ‘nafsi yangu’ la mstari uliotangulia bila kulazimisha hitimisho kuhusu uhusiano wake wa kianthropolojia.
- source_word: ἐπὶ τῷ θεῷ
  choice: Mungu
  rationale: Pamoja na ἀγαλλιάω, ἐπί + dativu huonyesha msingi au sababu ya furaha. Muundo ‘imemfurahia Mungu’ ni wa asili katika Kiswahili na hudumisha mwelekeo wa uhusiano bila kutumia kirai kizito.
- source_word: σωτῆρί μου
  choice: Mwokozi wangu
  rationale: ‘Mwokozi’ ndilo neno la moja kwa moja na lililozoeleka katika matumizi ya Agano Jipya, huku ‘wangu’ ikihifadhi uhusiano binafsi unaoonyeshwa na Kigiriki.
theological_decisions:
- issue: Kumtaja Mungu kuwa Mwokozi wa Maria
  choice: Mungu, Mwokozi wangu
  alternative: Mungu, Mkombozi wangu
  rationale: Kigiriki kinamtambulisha Mungu moja kwa moja kuwa Mwokozi wa Maria. Tafsiri inadumisha dai hilo bila kulipunguza au kuongeza hitimisho la kimadhehebu.
- issue: Uhusiano wa ‘roho yangu’ na ‘nafsi yangu’ katika ulinganifu wa mistari
  choice: Kuhifadhi ‘roho yangu’ kama neno tofauti
  alternative: Kutafsiri yote mawili kwa neno lilelile au kama ‘utu wangu wa ndani’
  rationale: Ulinganifu wa kishairi unaonyesha mwingiliano wa maana, lakini maandishi ya Kigiriki yanatumia maneno tofauti. Kuyahifadhi huepuka kutatua kimya kimya mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Koma baada ya ‘Mungu’ inaonyesha kwamba ‘Mwokozi wangu’ ni jina la ufafanuzi linalomtambulisha Mungu.
