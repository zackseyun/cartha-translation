  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: sw
  text: Imekuwaje nimepata heshima hii[a], kwamba mama wa Bwana wangu aje kwangu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki: “Hili limenitoka wapi...?” Huu ni usemi wa mshangao kwa kupewa heshima kama hiyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: Imekuwaje nimepata heshima hii
  rationale: Kwa neno, usemi huu ni kama ‘hili limenitoka wapi?’ lakini katika muktadha unaonyesha mshangao wa Elisabeti kwa kupewa heshima isiyotarajiwa. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi mshangao huo.
- source_word: ἵνα ἔλθῃ
  choice: kwamba ... aje
  rationale: ἵνα hapa hutambulisha jambo linalomshangaza Elisabeti. Hali ya utegemezi ‘aje’ hudumisha hisia ya mshangao kwa njia ya asili katika Kiswahili.
- source_word: ἡ μήτηρ
  choice: mama
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya μήτηρ.
- source_word: τοῦ κυρίου μου
  choice: wa Bwana wangu
  rationale: ‘Bwana wangu’ huhifadhi cheo κύριος, umilikaji wa μου, na uzito wa heshima wa kauli ya Elisabeti bila kuongeza maelezo ya baadaye ya kiteolojia.
- source_word: πρὸς ἐμέ
  choice: kwangu
  rationale: Huwakilisha mwendo kuelekea kwa Elisabeti kwa Kiswahili cha kawaida bila kuongeza wazo la ‘nyumbani kwangu,’ ambalo halijasemwa wazi katika Kigiriki.
theological_decisions:
- issue: Tafsiri ya κυρίου katika ἡ μήτηρ τοῦ κυρίου μου
  choice: mama wa Bwana wangu
  alternative: mama wa mkuu wangu
  rationale: ‘Bwana’ huhifadhi uzito wa cheo κύριος na nguvu yake ya kikristolojia katika simulizi bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Iwapo usemi πόθεν μοι τοῦτο utafsiriwe neno kwa neno au kwa maana yake ya kimuktadha
  choice: Imekuwaje nimepata heshima hii
  alternative: Hili limenitoka wapi
  rationale: Tafsiri ya neno kwa neno ingekuwa isiyo wazi katika Kiswahili cha sasa. Chaguo kuu linaonyesha mshangao kwa fadhila au heshima aliyopokea Elisabeti, huku tanbihi ikihifadhi umbo halisi la usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. ‘Imekuwaje’ na ‘nimepata heshima hii’ huwasilisha mshangao wa usemi wa Kigiriki kwa ufasaha, huku tanbihi ikihifadhi tafsiri yake ya karibu zaidi na maneno ya asili.
