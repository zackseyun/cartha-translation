base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: sw
  text: Hofu[a] ikawapata wote waliokuwa wakiishi karibu nao, na katika nchi yote ya milima ya Yudea mambo haya yote[b] yalikuwa yakizungumziwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hofu” hapa inaweza pia kuhusisha maana ya kicho kutokana na kuona wazi utendaji wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “maneno haya yote” au “habari hizi zote.” Neno la Kigiriki linaweza kurejelea maneno yaliyosemwa au mambo na matukio yaliyokuwa yakizungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: Hofu ikawapata wote
  rationale: Hii ni tafsiri ya asili katika Kiswahili ya mwanzo wa hali ya hofu iliyowajia watu wote, huku ikihifadhi nguvu ya tukio katika msemo wa Kigiriki.
- source_word: φόβος
  choice: Hofu
  rationale: Neno hili linaweza kumaanisha hofu au kicho. “Hofu” ndilo chaguo la moja kwa moja na linaacha muktadha uonyeshe pia hisia ya kicho mbele ya utendaji wa Mungu.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: wote waliokuwa wakiishi karibu nao
  rationale: Kirai hiki kinaeleza watu waliokaa karibu nao. Tafsiri hii ni wazi na haibani maana kuwa “majirani” pekee.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: katika eneo lote la milima la Yudea
  rationale: ἡ ὀρεινή linarejelea eneo la vilima au nyanda za juu. “Eneo la milima” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: διελαλεῖτο
  choice: yakawa yakizungumziwa
  rationale: Kauli tendwa ya wakati usiotimilika inaonyesha kwamba mazungumzo hayo yaliendelea na kuenea miongoni mwa watu.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: mambo hayo yote
  rationale: ῥήματα hapa linaweza kurejelea maneno, habari, au matukio yanayosimuliwa. “Mambo hayo yote” linafaa katika muhtasari huu wa kisimulizi bila kuondoa upana wa maana.
theological_decisions:
- issue: Maana ya φόβος kama mwitikio kwa utendaji wa Mungu
  choice: Hofu
  alternative: kicho; hofu yenye kicho
  rationale: Tafsiri rahisi ya “hofu” inahifadhi mvutano wa maana katika neno la Kigiriki bila kulipanua kwa tafsiri ya kimadhehebu; tanbihi inaonyesha kuwa kicho kinaweza kuhusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo “yakawa yakizungumziwa” unaonyesha mazungumzo yaliyoendelea, na “Yudea” linafuata umbo la jina linalotumiwa sana katika tafsiri za Kiswahili.
