  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: sw
  text: Na rehema yake ni kwa wale wanaomcha, kizazi baada ya kizazi[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka kizazi hadi kizazi.” Kigiriki kinasema kwa maana halisi “kwa vizazi na vizazi,” kikionyesha rehema inayoendelea katika vizazi vinavyofuatana.
    reason: lexical_alternative
  - marker: b
    text: “Wale wanaomcha” ni wale wanaoishi kwa kicho na heshima mbele za Mungu; pia inaweza kutafsiriwa “wale wanaomheshimu kwa kicho.”
    reason: lexical_alternative
  - marker: c
    text: Au “Na rehema yake, kizazi baada ya kizazi, ni kwa wale wanaomcha.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔλεος
  choice: rehema
  rationale: Neno hili huonyesha huruma au wema anaotendewa mwenye uhitaji. “Rehema” ni tafsiri ya moja kwa moja, ya kawaida, na inayofaa muktadha wa wimbo wa Maria.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: kizazi baada ya kizazi
  rationale: Kirai hiki kinaonyesha kwamba rehema ya Mungu inaendelea katika vizazi vinavyofuatana. Usemi huu ni wa asili katika Kiswahili na unaepuka kutafsiri εἰς kana kwamba inaonyesha mahali pa kuanzia.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: kwa wale wanaomcha
  rationale: Dativo inaonyesha wanaopokea rehema. “Kumcha” huhifadhi uzito wa lugha ya kibiblia na, Mungu akiwa ndiye anayelengwa, hujumuisha hofu yenye staha na unyenyekevu badala ya woga wa kawaida tu.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi kinaendeleza mtiririko wa kishairi wa wimbo wa Maria na kuunganisha mstari huu na uliotangulia.
- source_word: αὐτοῦ / αὐτόν
  choice: yake / -m- katika “wanaomcha”
  rationale: Viwakilishi vyote vinamtaja Mungu katika muktadha. Kiswahili huonyesha kiwakilishi cha yambwa ndani ya kitenzi “wanaomcha” bila kuongeza maelezo ya kiufafanuzi.
theological_decisions:
- issue: Maana ya kumwogopa au kumcha Mungu
  choice: wanaomcha
  alternative: wanaomheshimu kwa kicho; wanaomwogopa
  rationale: φοβουμένοις inaweza kumaanisha hofu yenye staha na uchaji Mungu, si hofu ya kutishwa tu. “Wanaomcha” huhifadhi mvutano na uzito wa neno la asili bila kulifanya kuwa heshima pekee wala woga pekee.
- issue: Uhusiano kati ya muda wa rehema na wanaoipokea
  choice: kwa wale wanaomcha, kizazi baada ya kizazi
  alternative: kizazi baada ya kizazi kwa wale wanaomcha
  rationale: Kigiriki kinaweza kuweka mkazo kwa kuonyesha kwanza mwendelezo katika vizazi kisha wanaopokea rehema. Mpangilio uliochaguliwa ni wa asili zaidi katika Kiswahili huku tanbihi ikihifadhi mpangilio mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Wanaomcha” ni usemi mfupi na wa kawaida katika lugha ya kibiblia ya Kiswahili, lakini tanbihi inafafanua maana yake ya kicho. Alama zote za tanbihi zimewekwa katika matini kuu.
