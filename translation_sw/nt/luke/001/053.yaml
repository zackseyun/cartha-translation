  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: sw
  text: Amewashibisha wenye njaa kwa vitu vyema, na matajiri amewaacha waende bila kitu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikono mitupu.”
    reason: Njia nyingine ya kutafsiri κενούς kwa Kiswahili cha picha zaidi.
lexical_decisions:
- source_word: πεινῶντας
  choice: wenye njaa
  rationale: Kirai cha hali kimetumiwa kama nomino; “wenye njaa” ni Kiswahili cha kawaida na kinadumisha maana halisi bila kuongeza ukali wa “wanaokufa njaa.”
- source_word: ἐνέπλησεν
  choice: amewashibisha
  rationale: Kitenzi kina maana ya kujaza au kushibisha. Kwa watu wenye njaa, “amewashibisha” ni ya asili zaidi katika Kiswahili, huku ikihifadhi wazo la kujazwa kikamilifu. Wakati timilifu “ame-” unafaa mtindo wa matendo ya Mungu yaliyotimizwa katika wimbo huu.
- source_word: ἀγαθῶν
  choice: kwa vitu vyema
  rationale: Hiki kinaonyesha yaliyotumika kuwajaza au kuwashibisha. “Vitu vyema” ni pana na hakiongezi wazo la zawadi ambalo halijaelezwa wazi.
- source_word: πλουτοῦντας
  choice: matajiri
  rationale: Kirai cha hali kimetumiwa kama nomino; “matajiri” ni kifupi, cha kawaida, na kinadumisha utofautishaji wa kijamii dhidi ya wenye njaa.
- source_word: ἐξαπέστειλεν
  choice: amewaondoa
  rationale: Kitenzi cha Kigiriki kinaonyesha kuwapeleka au kuwaondoa waende. “Amewaondoa” ni cha asili katika muktadha huu na hakiongezi wazo la kufukuzwa kwa utaratibu rasmi.
- source_word: κενούς
  choice: bila kitu
  rationale: Kivumishi kinaeleza hali ya matajiri walipoondolewa. “Bila kitu” ni cha asili na kinaacha maana ikiwa pana; “mikono mitupu” ni tafsiri ya picha iliyo wazi zaidi na imetolewa katika tanbihi.
theological_decisions:
- issue: Mgeuko wa hali za kijamii na kitheolojia katika wimbo wa Maria
  choice: Kudumisha utofautishaji halisi kati ya “wenye njaa” na “matajiri” bila kuugeuza kuwa wa kiroho pekee.
  alternative: Kutafsiri “wenye njaa” kuwa wenye uhitaji wa kiroho, au “matajiri” kuwa wenye kujitosheleza au wenye kiburi.
  rationale: Aya inataja hali halisi za njaa na utajiri katika mada ya Luka ya Mungu kugeuza hali za watu. Tafsiri haipunguzi uwezekano wa matumizi ya kiroho, lakini haiingizi maana hiyo ndani ya maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kueleweka kwa wasomaji wa kawaida; “amewashibisha” huchaguliwa badala ya tafsiri ngumu isiyo ya asili ya “amewajaza” inapohusu watu wenye njaa.
