  text: For no word from God will be impossible[a].
translation:
  language: sw
  text: Kwa maana hakuna neno kutoka kwa Mungu lisilowezekana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa Mungu hakuna jambo lisilowezekana.”
    reason: Tafsiri hii mbadala inahifadhi uelewa wa jadi wa παρά kama “kwa Mungu” na wa πᾶν ῥῆμα kwa maana pana ya “jambo lolote.”
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, kiunganishi hiki kinatoa msingi wa kauli iliyotangulia ya Gabrieli; “Kwa maana” kinaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: οὐκ ἀδυνατήσει
  choice: hakuna ... litakaloshindikana
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida wazo la wakati ujao kwamba hakuna neno litakalokuwa lisilowezekana au litakaloshindwa kutimia.
- source_word: παρὰ τοῦ θεοῦ
  choice: kutoka kwa Mungu
  rationale: παρά pamoja na hali ya genitivi inaweza kuonyesha chanzo. Ikiunganishwa na ῥῆμα, tafsiri hii inaonyesha neno linalotoka kwa Mungu bila kuondoa uwezekano wa maana ya jadi “kwa Mungu,” ambayo imewekwa katika tanbihi.
- source_word: πᾶν
  choice: hakuna ...
  rationale: Ingawa πᾶν kimsingi ni “kila,” pamoja na kitenzi kilichokanushwa maana yake ya ujumla inatolewa kwa Kiswahili cha kawaida kwa muundo “hakuna ... litakaloshindikana.”
- source_word: ῥῆμα
  choice: neno
  rationale: “Neno” linadumisha rejeo la tamko lililonenwa na linafaa katika muktadha wa ujumbe wa Gabrieli. “Jambo” ni pana zaidi, na “ahadi” ingeongeza ufafanuzi usio wazi moja kwa moja katika neno la Kigiriki.
theological_decisions:
- issue: Maana ya kishazi παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Hakuna neno kutoka kwa Mungu litakaloshindikana.
  alternative: Hakuna jambo litakalokuwa lisilowezekana kwa Mungu.
  rationale: Maana zote mbili zinawezekana kisarufi. Maandishi makuu yanadumisha ῥῆμα kama “neno” na kueleza παρά kama chanzo, jambo linalofaa katika muktadha wa neno alilotangaza Gabrieli. Tafsiri ya jadi inayokazia uwezo wa Mungu imehifadhiwa katika tanbihi ili kutatua kimabavu utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Litakaloshindikana” ni ya kawaida zaidi kuliko muundo mzito “litakalokuwa lisilowezekana,” huku tanbihi ikihifadhi tafsiri mbadala.
