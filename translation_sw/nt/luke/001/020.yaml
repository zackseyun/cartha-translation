id: LUK.1.20
reference: Luke 1:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: sw
  text: Na tazama, utakuwa kimya na hutaweza kusema mpaka siku mambo haya yatakapotokea, kwa sababu hukuyaamini maneno yangu, ambayo yatatimia kwa wakati wao uliowekwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi ishara ya ghafla ya kuvuta fikira na uzito wa tangazo la malaika kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: ἔσῃ σιωπῶν
  choice: utakuwa kimya
  rationale: Inawasilisha hali ya baadaye inayotokana na hukumu, huku kishazi kinachofuata kikifafanua kwamba si ukimya wa hiari.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: usiweze kusema
  rationale: Inahifadhi maana ya kutokuwa na uwezo wa kusema na kuonyesha kwamba ukimya huo umelazimishwa.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: mpaka siku mambo haya yatakapotokea
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kikomo cha wakati na kutokea kwa mambo yaliyotangazwa.
- source_word: ἀνθ’ ὧν
  choice: kwa sababu
  rationale: Katika muktadha huu inaeleza sababu ya Zakaria kupokonywa uwezo wa kusema.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: hukuyaamini maneno yangu
  rationale: Kitenzi πιστεύω pamoja na maneno kama kitu kinachoaminiwa kinarejelea kutokubali kuwa yaliyosemwa ni ya kweli; 'maneno yangu' huhifadhi λόγοι kwa uasilia.
- source_word: πληρωθήσονται
  choice: yatatimia
  rationale: Ni njia ya kawaida na yenye heshima ya kusema kwamba maneno yaliyotamkwa yatafikia utimilifu wake, bila kupunguza uhakika wa ahadi.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: kwa wakati wake uliowekwa
  rationale: καιρός hapa ni wakati unaofaa au uliopangwa, si wakati wa kalenda tu; umoja wa Kiswahili 'wakati wake' hurejelea utimilifu wa ujumbe mzima.
theological_decisions:
- issue: Hali ya hukumu ya Zakaria
  choice: 'Kudumisha vipengele vyote viwili: atakuwa kimya na hatakuwa na uwezo wa kusema.'
  alternative: Kueleza ukimya huo kama kunyamaza kwa hiari tu.
  rationale: Muungano wa σιωπῶν na μὴ δυνάμενος λαλῆσαι unaonyesha hali ya kutoweza kusema iliyowekwa juu yake, si agizo tu la kunyamaza.
- issue: Wakati wa kutimia kwa maneno
  choice: kwa wakati wake uliowekwa
  alternative: kwa wakati wake unaofaa
  rationale: Tafsiri hii huhifadhi wazo la wakati maalumu bila kueleza wazi zaidi ya Kiyunani ni nani aliyeuweka, hivyo haitatui kimyakimya jambo ambalo matini imelidokeza tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'Na tazama' una uzito wa tangazo la malaika; 'usiweze kusema' unaweka wazi kuwa si ukimya wa hiari. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kileksika zimewasilishwa wazi katika matini.
