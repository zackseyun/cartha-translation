  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: sw
  text: akaingia katika nyumba ya Zekaria, akamsalimu Elisabeti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi hiki kinaonyesha kuingia mahali; “akaingia” ni cha kawaida katika masimulizi ya Kiswahili na huendeleza mfuatano wa matendo kutoka mstari uliotangulia.
- source_word: οἶκον
  choice: nyumba
  rationale: Katika muundo huu wenye εἰς, neno linarejelea mahali halisi pa kuingia; “nyumba” ndilo chaguo la moja kwa moja na la kawaida.
- source_word: Ζαχαρίου
  choice: Zekaria
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linatambulika kwa urahisi na wasomaji wa Afrika Mashariki.
- source_word: ἠσπάσατο
  choice: akamsalimu
  rationale: Neno ἀσπάζομαι hapa linamaanisha kutoa salamu. “Akamsalimu” ni la asili na haliongezi wazo la ukaribisho au sherehe ambalo muktadha haulazimishi.
- source_word: Ἐλισάβετ
  choice: Elisabeti
  rationale: Hili ni umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: καὶ
  choice: aka-
  rationale: Viunganishi viwili vya καί vinaonyesha mfuatano wa matendo. Kiswahili cha masimulizi huuwakilisha kwa kawaida na kiambishi cha mfululizo “aka-” katika “akaingia” na “akamsalimu,” badala ya kurudia “na” kwa namna isiyo ya asili.
theological_decisions: []
translation_notes:
  register: Tafsiri imetumia Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa kisimulizi. Muundo wa vitenzi vya mfululizo “aka-” unahifadhi uhusiano wa matendo mawili uliowasilishwa na καί, huku “katika nyumba ya” ukibaki karibu na muundo wa Kigiriki bila kuwa mzito.
