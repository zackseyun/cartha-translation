base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: sw
  text: Malaika akamjibu, “Roho Mtakatifu atakuja juu yako, na nguvu za Aliye Juu Zaidi zitakufunika kwa kivuli; kwa hiyo, yule mtakatifu atakayezaliwa[a] ataitwa Mwana wa Mungu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtoto atakayezaliwa.” Kirai cha Kigiriki τὸ γεννώμενον kwa maana halisi ni “yule anayezaliwa” au “kile kinachozaliwa.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, “Mwana wa Mungu” haina kibainishi kabla ya neno “Mwana.” Hata hivyo, katika muktadha huu kirai hicho kinatumika kama cheo, si kumaanisha mwana mmoja tu miongoni mwa wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Malaika akamjibu
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba malaika alijibu na kwamba jibu lilielekezwa kwake, bila kurudia kwa uzito ‘akajibu akamwambia.’
- source_word: Πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Kirai hiki kinamtaja Roho wa Mungu kama mtendaji wa tendo linalofuata; herufi kubwa zinaonyesha matumizi yake kama jina la heshima la kimungu.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: atakujilia
  rationale: ‘Atakujilia’ ni Kiswahili cha sasa na cha kawaida kinachoonyesha kuja juu ya mtu kwa utendaji wenye nguvu, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: δύναμις Ὑψίστου
  choice: nguvu za Aliye Juu Zaidi
  rationale: ‘Aliye Juu Zaidi’ linahifadhi matumizi ya Ὑψίστου kama cheo cha Mungu, huku ‘nguvu za’ likiwa tamko la kawaida la Kiswahili.
- source_word: ἐπισκιάσει σοι
  choice: zitakufunika kwa kivuli
  rationale: Tafsiri hii inadumisha taswira ya kivuli na uwepo wa kimungu, bila kuingiza maelezo ya kibiolojia au kingono yasiyomo katika matini.
- source_word: διὸ καὶ
  choice: kwa hiyo
  rationale: Katika Kiswahili, ‘kwa hiyo’ linaeleza kwa kawaida uhusiano wa matokeo. Nguvu ya καί inaonekana katika muunganiko wa tendo la Roho na utambulisho wa mtoto, bila kulazimisha neno ‘pia’ lisilo la kawaida hapa.
- source_word: τὸ γεννώμενον ἅγιον
  choice: yule mtakatifu atakayezaliwa
  rationale: Tamko hili linabaki karibu na maana ya ‘yule aliye mtakatifu anayezaliwa’ na linamtambulisha kwa kawaida mtoto anayezungumziwa. Tanbihi inadumisha uwezekano wa kutafsiri kirai kwa kutumia ‘mtoto.’
- source_word: κληθήσεται
  choice: ataitwa
  rationale: Kitenzi hiki kinahifadhi hali ya kutendwa ya καλέω na kinaweza kumaanisha kupewa jina au kutambuliwa kwa cheo hicho.
- source_word: υἱὸς θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muktadha huu kirai kinafanya kazi kama cheo. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘the/a,’ na ‘Mwana wa Mungu’ linaeleza cheo hicho kwa kawaida bila kudokeza kuwa ni mwana mmoja tu miongoni mwa wengine.
theological_decisions:
- issue: Uwakilishi wa Πνεῦμα ἅγιον kama rejeo la kimungu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha unamwonyesha Roho wa Mungu kuwa mtendaji katika kutungwa mimba kwa Yesu; tafsiri haimgeuzi kuwa nguvu isiyo na nafsi, wala haiongezi ufafanuzi zaidi ya matini.
- issue: Nguvu ya kicheo katika υἱὸς θεοῦ
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Ingawa υἱός haina kibainishi katika Kigiriki, muktadha unaipa kirai hiki nguvu ya cheo. Herufi kubwa katika Kiswahili zinaonyesha matumizi hayo bila kutegemea mfumo wa vibainishi vya Kiingereza.
- issue: Kuhifadhi lugha ya sitiari kuhusu tendo la Mungu
  choice: zitakufunika kwa kivuli
  alternative: zitakufunika
  rationale: Chaguo hili linahifadhi taswira ya ἐπισκιάσει na staha ya matini, bila kutoa maelezo ya kimwili au ya kimekanika ambayo Kigiriki hakitoi.
- issue: Uhusiano wa ἅγιον na τὸ γεννώμενον
  choice: yule mtakatifu atakayezaliwa
  alternative: mtoto atakayezaliwa atakuwa mtakatifu
  rationale: Sarufi inaweza kuwasilishwa kwa kumtaja ‘yule mtakatifu’ au kwa kufanya ‘mtakatifu’ kuwa kiarifu. Matini kuu inafuata mtiririko wa karibu wa kirai cha Kigiriki, huku tanbihi ikihifadhi njia nyingine ya kawaida ya kukieleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. ‘Aliye Juu Zaidi’ na ‘Mwana wa Mungu’ yametumiwa kama vyeo vya kimungu. Alama za tanbihi zimewekwa baada ya virai vinavyoelezewa, kwa kuwa nafasi zake katika safu ya Kiingereza iliyotolewa hazikulingana na yaliyomo katika tanbihi.
