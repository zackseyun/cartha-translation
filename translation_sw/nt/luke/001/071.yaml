  text: wokovu kutoka kwa adui zetu na kutoka mkononi mwa wote wanaotuchukia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi kutoka kwa adui zetu na kutoka katika mamlaka ya wote wanaotuchukia.”
    reason: Neno la Kigiriki linaweza kumaanisha “wokovu” au “ukombozi,” na msemo “kutoka mkononi mwa” unaweza kuelezwa kuwa “kutoka katika mamlaka ya.”
lexical_decisions:
- source_word: σωτηρίαν
  choice: wokovu
  rationale: Neno “wokovu” linahifadhi uzito mpana wa kinabii na kitheolojia katika wimbo wa Zekaria, huku katika muktadha huu likiwa pia na maana halisi ya kuokolewa kutoka kwa maadui.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: kutoka kwa adui zetu
  rationale: Muundo huu unaonyesha kutenganishwa au kuokolewa kutoka kwa maadui. “Kutoka kwa adui zetu” ni Kiswahili cha kawaida bila kuongeza wazo la mamlaka ambalo halikutajwa wazi katika kishazi hiki.
- source_word: ἐκ χειρὸς
  choice: kutoka mkononi mwa
  rationale: Hii inahifadhi sitiari ya kibiblia ya “mkono” kama udhibiti au mamlaka, nayo inaeleweka vizuri katika Kiswahili.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: wote wanaotuchukia
  rationale: Kishiriki cha wakati wa sasa kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha watu ambao chuki yao ni ya kuendelea au ni tabia yao.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha moja kwa moja vishazi viwili bila kuvipa uhusiano mwingine wa kifasiri.
theological_decisions:
- issue: Asili ya wokovu ulioahidiwa katika unabii wa Zekaria
  choice: Kutumia “wokovu” huku maneno yanayofuata yakitaja wazi kuokolewa kutoka kwa maadui
  alternative: Kutafsiri kama ukombozi wa kisiasa pekee au wokovu wa kiroho pekee
  rationale: Mstari huu unazungumzia maadui na wanaowachukia watu wa Mungu, lakini matumizi ya “wokovu” katika Luka yana upeo mpana wa ukombozi. Tafsiri haifungi maana katika upande wa kisiasa pekee wala wa kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sitiari ya kibiblia “mkononi mwa” imehifadhiwa kwa kuwa ni ya kawaida na inaeleweka.
