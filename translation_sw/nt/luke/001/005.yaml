id: LUK.1.5
reference: Luke 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: sw
  text: Wakati wa Herode, mfalme wa Yudea, kulikuwa na kuhani mmoja aliyeitwa Zakaria, wa zamu ya Abiya[a]; naye alikuwa na mke kutoka miongoni mwa binti za Haruni[b], ambaye jina lake lilikuwa Elisabeti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Zamu ya Abiya” ilikuwa mojawapo ya vikundi vya makuhani vilivyopangiwa nyakati tofauti za kuhudumu hekaluni.
    reason: cultural_note
  - marker: b
    text: Au, “aliyetokana na ukoo wa Haruni.” Kigiriki kinasema kihalisi “kutoka miongoni mwa binti za Haruni,” usemi unaoonyesha nasaba ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Wakati wa ... kulikuwa na
  rationale: Muundo huu unawasilisha kwa Kiswahili cha kawaida fomula ya Kigiriki ya kuanzisha simulizi pamoja na kipindi chake, bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Herode, mfalme wa Yudea
  rationale: Hutambulisha cheo na eneo la utawala wa Herode kwa uwazi; “Yudea” linafaa kwa mazingira haya ya kihistoria.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: kuhani mmoja aliyeitwa Zakaria
  rationale: “Mmoja” huonyesha nguvu ya kutotajwa awali ya τις, huku “aliyeitwa” ikiwa namna ya kawaida ya Kiswahili ya kutaja jina.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: wa zamu ya Abiya
  rationale: ἐφημερία ni kikundi cha makuhani kilichopangiwa zamu ya huduma. “Zamu ya Abiya” ni fupi, ya kawaida, na inadumisha maana ya taasisi hiyo; maelezo yanawekwa katika tanbihi.
- source_word: γυνὴ αὐτῷ
  choice: naye alikuwa na mke
  rationale: Dativi αὐτῷ ina maana ya umilikaji; “alikuwa na mke” ni Kiswahili cha asili kinachowasilisha maana hiyo.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: kutoka miongoni mwa binti za Haruni
  rationale: Inahifadhi taswira halisi ya kifamilia ya Kigiriki, huku tanbihi ikifafanua kuwa usemi huo unamaanisha ukoo wa Haruni.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: ambaye jina lake lilikuwa Elisabeti
  rationale: Ni uwasilishaji wa kawaida na wazi wa fomula ya kutaja jina, na kiwakilishi kinamhusu mke bila utata.
- source_word: Ἡρῴδης / Ζαχαρίας / Ἀβιά / Ἀαρών / Ἐλισάβετ
  choice: Herode / Zakaria / Abiya / Haruni / Elisabeti
  rationale: Haya ni maumbo ya majina yaliyozoeleka katika Kiswahili sanifu cha Biblia na yanaendana na mfumo wa sauti wa Kiswahili.
theological_decisions:
- issue: Usemi wa nasaba ya Elisabeti
  choice: kutoka miongoni mwa binti za Haruni
  alternative: aliyetokana na ukoo wa Haruni
  rationale: Chaguo linahifadhi usemi halisi θυγατέρων Ἀαρών na msisitizo wake wa nasaba ya kikuhani bila kuongeza dai la kimafundisho. Tanbihi inaeleza maana ya kinahau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nusu koloni inadumisha mshikamano wa sentensi moja ya Kigiriki bila kuifanya sentensi ya Kiswahili kuwa nzito kupita kiasi.
