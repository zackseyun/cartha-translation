  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: sw
  text: Maria akakaa pamoja naye karibu miezi mitatu[a], kisha akarudi nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “takriban miezi mitatu”; neno la Kigiriki ὡς likitumiwa pamoja na muda linaweza kuonyesha makadirio.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: akakaa
  rationale: Kitenzi μένω hapa kinaonyesha kuendelea kukaa mahali kwa kipindi fulani; “akakaa” ni Kiswahili cha kawaida na cha asili katika simulizi.
- source_word: δὲ
  choice: kisha
  rationale: δέ ni kiunganishi chepesi cha simulizi. Katika muktadha huu, “kisha” huendeleza mtiririko kwa kawaida bila kudokeza tofauti yenye nguvu.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili sanifu.
- source_word: σὺν αὐτῇ
  choice: pamoja naye
  rationale: σύν pamoja na hali ya dative huonyesha kuandamana au kuwa pamoja; “pamoja naye” ni wazi na huhifadhi kiwakilishi cha maandishi ya chanzo.
- source_word: ὡς μῆνας τρεῖς
  choice: karibu miezi mitatu
  rationale: ὡς kabla ya kipimo cha muda huweza kuonyesha makadirio; “karibu miezi mitatu” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: ὑπέστρεψεν
  choice: akarudi
  rationale: Kitenzi kina maana ya kurudi mahali pa awali; “akarudi” kinafaa mtiririko wa simulizi.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: nyumbani kwake
  rationale: οἶκος hapa ni mahali anapoishi, si lazima watu wa nyumba; “nyumbani kwake” ni usemi wa asili wa Kiswahili kwa mwendo wa kurudi nyumbani.
