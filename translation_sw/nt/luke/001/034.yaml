  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: sw
  text: Lakini Maria akamwambia malaika, “Jambo hili litakuwaje, kwa kuwa sijawahi kuwa na uhusiano wa kimwili na mwanamume[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema kwa neno kwa neno, “simjui mwanamume.” Huu ni usemi wa staha unaorejelea mahusiano ya kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofauti mdogo kutoka tangazo la malaika hadi swali la Maria, bila kufanya upinzani huo kuwa mkali kupita kiasi.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: πρὸς τὸν ἄγγελον
  choice: akamwambia malaika
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili; katika muktadha huu ἄγγελος ni kiumbe wa mbinguni, hivyo ‘malaika’ linafaa kuliko ‘mjumbe.’
- source_word: Πῶς ἔσται τοῦτο
  choice: Jambo hili litakuwaje
  rationale: Huhifadhi swali kuhusu namna jambo lililotangazwa litakavyotimia, kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Huanzisha sababu ya swali la Maria kwa mtindo wa heshima na wa kawaida.
- source_word: ἄνδρα
  choice: mwanamume
  rationale: ἀνήρ hapa inaweza kumaanisha mwanamume au mume. ‘Mwanamume’ huhifadhi upana wa neno na haibani maana kuwa hali ya ndoa pekee.
- source_word: οὐ γινώσκω
  choice: simjui
  rationale: Huhifadhi wakati wa sasa na tamathali ya staha ya Kigiriki, huku tanbihi ikieleza kwamba katika muktadha huu inahusu uhusiano wa kingono.
theological_decisions:
- issue: Kauli ya Maria na kuchukuliwa mimba kwa Yesu
  choice: Kuhifadhi tamathali ‘simjui mwanamume’ katika matini kuu
  alternative: kwa kuwa sijawahi kuwa na uhusiano wa kingono na mwanamume; kwa kuwa mimi ni bikira
  rationale: Kigiriki hakitumii moja kwa moja neno ‘bikira’ katika mstari huu, bali kinatumia usemi wa staha unaomaanisha kwamba Maria hajafanya ngono na mwanamume. Tafsiri hii huhifadhi usemi wa chanzo na tanbihi hufafanua maana yake bila kuongeza zaidi ya yaliyoandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Jambo hili litakuwaje’ ni cha asili zaidi kuliko kunakili mpangilio wa Kigiriki moja kwa moja; ‘simjui mwanamume’ huhifadhi tamathali na utata wa kileksia wa chanzo.
