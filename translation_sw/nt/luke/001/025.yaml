  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: sw
  text: Kwa maana hivi ndivyo Bwana amenitendea katika siku zile alipoangalia kuniondolea fedheha yangu[a] miongoni mwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aibu yangu” au “suto langu.” Neno la Kigiriki linasisitiza fedheha au kuvunjiwa heshima mbele ya jamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hutambulisha maelezo au sababu ya kauli ya Elisabeti; ni ya kawaida na inaendeleza uhusiano na muktadha.
- source_word: Οὕτως μοι πεποίηκεν
  choice: hivi ndivyo ... alivyonitendea
  rationale: Muundo huu wa Kiswahili unaonyesha kwa mkazo namna Bwana alivyomtendea Elisabeti na kuwasilisha maana ya kitenzi kipana ποιέω pamoja na dative μοι.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo κύριος kinapomtaja Mungu katika muktadha huu.
- source_word: ἐν ἡμέραις αἷς
  choice: katika siku
  rationale: Inahifadhi usemi wa wakati bila kuongeza kihisishi cha kuonyesha kama ‘hizi,’ ambacho hakipo wazi katika Kigiriki.
- source_word: ἐπεῖδεν
  choice: aliponiangalia
  rationale: Inadumisha taswira ya kumwangalia mtu kwa makini au kwa kujali, huku yambwa ‘ni’ ikieleweka kutokana na muktadha.
- source_word: ἀφελεῖν
  choice: ili kuondoa
  rationale: Inawasilisha infinitive kama kusudi bila kuigeuza kuwa sentensi huru.
- source_word: ὄνειδός μου
  choice: fedheha yangu
  rationale: ‘Fedheha’ inaonyesha hali ya kuvunjiwa heshima mbele ya jamii, si hisia ya ndani pekee.
- source_word: ἐν ἀνθρώποις
  choice: miongoni mwa watu
  rationale: Inaonyesha mazingira ya kijamii ambamo fedheha hiyo ilikuwapo, na ἀνθρώποις hapa inawahusu watu kwa ujumla.
theological_decisions:
- issue: Anayerejelewa na κύριος
  choice: Bwana, akimaanisha Mungu
  alternative: Hakuna tafsiri nyingine kuu katika muktadha huu
  rationale: Muktadha unahusu tendo la Mungu la kuondoa fedheha iliyohusiana na kutokuwa na mtoto; tafsiri haiongezi utambulisho mwembamba usiotajwa hapa.
- issue: Maana ya kijamii ya ὄνειδος
  choice: fedheha yangu
  alternative: aibu yangu; lawama yangu
  rationale: ‘Fedheha’ inadumisha uzito wa kuvunjiwa heshima hadharani na haifanyi neno hilo lihusu hisia binafsi tu.
- issue: Uhusiano wa ἀφελεῖν na ἐπεῖδεν
  choice: ili kuondoa
  alternative: na kuondoa
  rationale: Kigiriki kinaweza kueleweka kwa upande wa kusudi au matokeo; ‘ili’ hudumisha kwa karibu muundo wa infinitive bila kupanua maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Alivyonitendea’ na ‘miongoni mwa watu’ ni miundo ya kawaida; ‘fedheha’ imechaguliwa ili kudumisha mwelekeo wa kijamii wa neno la Kigiriki.
