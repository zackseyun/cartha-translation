  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: sw
  text: Heri yeye aliyeamini kwamba yatatimizwa yale aliyoambiwa kutoka kwa Bwana[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu yatatimizwa yale aliyoambiwa kutoka kwa Bwana.” Neno la Kigiriki linaweza kuwa na maana ya sababu, ingawa hapa maana ya “kwamba” inaelekea zaidi.
    reason: alternative_reading
  - marker: b
    text: Au, “kutakuwa na utimilifu wa yale aliyoambiwa kutoka kwa Bwana”; pia, “ukamilisho” au “utimizwaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: heri
  rationale: ‘Heri’ ni neno la kawaida na lenye uzito wa kidini katika Kiswahili cha Biblia kwa hali ya mtu anayepokea kibali na baraka; halipunguzi maana kuwa hisia ya furaha tu.
- source_word: ἡ πιστεύσασα
  choice: yule aliyeamini
  rationale: Muundo huu unawakilisha kirai cha kisifa chenye kibainishi na tendo la imani lililotajwa kama tukio lililotimia, huku ukisomeka kwa urahisi katika Kiswahili.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaeleweka vizuri zaidi kuwa inaanzisha maudhui ya kile alichoamini, ingawa maana ya kisababishi ‘kwa sababu’ bado inawezekana na imehifadhiwa katika tanbihi.
- source_word: τελείωσις
  choice: yatatimizwa
  rationale: Kitenzi ‘kutimizwa’ kinaeleza kufikishwa kwenye ukamilifu kwa maneno ya ahadi na ni cha asili zaidi katika sentensi ya Kiswahili kuliko nomino nzito kama ‘utimizo.’
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: yale aliyoambiwa
  rationale: Hii huhifadhi rejeo la mambo yaliyokuwa yamesemwa kwake na sauti tendwa, kwa Kiswahili cha kawaida na fasaha.
- source_word: παρὰ κυρίου
  choice: kutoka kwa Bwana
  rationale: παρά pamoja na umilikishi huonyesha chanzo; ujumbe ulitoka kwa Bwana. Kiswahili hiki kinahifadhi wazo la asili ya maneno bila kulazimisha kuwa Bwana aliyasema moja kwa moja bila mjumbe.
- source_word: κυρίου
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida la Kiswahili kwa κύριος, na katika muktadha huu linamtaja Mungu wa Israeli kama chanzo cha ahadi.
theological_decisions:
- issue: Uhusiano kati ya kuhesabiwa kwa Maria kuwa mwenye heri, imani yake, na neno lililoahidiwa
  choice: Maria anatajwa kuwa mwenye heri, naye aliamini kwamba yale yaliyotoka kwa Bwana yangetimizwa.
  alternative: Maria ni mwenye heri kwa sababu yale aliyoambiwa kutoka kwa Bwana yatatimizwa, huku ὅτι ikisomwa kwa maana ya kisababishi.
  rationale: Mpangilio wa Kigiriki unaelekea zaidi kufanya ὅτι itangulize maudhui ya imani yake. Tafsiri hii inadumisha msisitizo wa Luka juu ya kuliamini neno la Mungu bila kuingiza madai ya kimafundisho yaliyo nje ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi na kidini lakini kinachoeleweka kwa msomaji wa kawaida. ‘Naye heri yule’ huhifadhi kiunganishi καί na mtindo wa tamko la baraka; ‘kutoka kwa Bwana’ huhifadhi wazo la chanzo katika παρὰ κυρίου.
