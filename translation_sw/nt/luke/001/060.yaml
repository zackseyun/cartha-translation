  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: sw
  text: Mama yake akajibu, “Hapana, bali ataitwa Yohana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα ... εἶπεν
  choice: akajibu
  rationale: Muundo wa Kigiriki una kishiriki ‘akijibu’ pamoja na kitenzi ‘akasema’; katika Kiswahili, ‘akajibu’ huanzisha maneno ya moja kwa moja kwa ufasaha bila kurudia ‘akasema’.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: mama yake
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaohifadhi rejeleo maalumu la mama wa mtoto.
- source_word: Οὐχί
  choice: Hapana
  rationale: Katika mazungumzo haya, neno hili ni jibu thabiti la kukataa jina lililopendekezwa.
- source_word: ἀλλὰ
  choice: bali
  rationale: ‘Bali’ linaonyesha wazi kwamba mama anasahihisha wazo lililotangulia, si kuongeza tu taarifa nyingine.
- source_word: κληθήσεται
  choice: ataitwa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa ya kitenzi cha Kigiriki, pamoja na maana ya kupewa jina.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
