  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: sw
  text: Nawe pia, mtoto, utaitwa nabii wa Aliye Juu Sana, kwa maana utatangulia mbele za Bwana[a] kuzitayarisha njia zake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “mbele za Bwana” yanaweza kumaanisha kumtangulia mtu au kuhudumu mbele yake.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa ahadi za kinabii kuhusu kuitayarisha njia mbele za Bwana (linganisha Isa 40:3; Mal 3:1). Katika simulizi la Luka, jambo hili linatimizwa katika huduma ya Yohana kabla ya Yesu.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Nawe pia
  rationale: Muundo huu unaanzisha hatua mpya huku ukimkazia anayesemeshwa; “pia” inadumisha wazo la nyongeza kwa Kiswahili cha kawaida.
- source_word: παιδίον
  choice: mtoto
  rationale: Ni neno la kumwita Yohana akiwa mchanga; “mtoto” ni la kawaida na haliongezi maelezo yasiyolazimishwa na Kigiriki.
- source_word: προφήτης
  choice: nabii
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa προφήτης.
- source_word: Ὑψίστου
  choice: wa Aliye Juu Zaidi
  rationale: Inadumisha cheo cha heshima cha Mungu na uhusiano wa kimilikishi katika usemi “nabii wa...”
- source_word: κληθήσῃ
  choice: utaitwa
  rationale: Kitenzi hiki cha wakati ujao na hali ya kutendwa kinaonyesha kuitwa, kutambuliwa, au kuteuliwa kwa jina hilo.
- source_word: προπορεύσῃ
  choice: utatangulia
  rationale: Kitenzi kina maana ya kwenda mbele ya mwingine; “utatangulia” ni cha asili na kinafaa kwa huduma ya mtangulizi.
- source_word: ἐνώπιον κυρίου
  choice: mbele za Bwana
  rationale: “Mbele za” kinaweza kuhusisha kumtangulia mtu au kuwa na kuhudumu mbele yake, hivyo kinahifadhi upana wa maana wa ἐνώπιον.
- source_word: ἑτοιμάσαι
  choice: kuzitayarisha
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kutangulia kwake; kiambishi “-zi-” kinarejelea “njia” za wingi.
- source_word: ὁδοὺς αὐτοῦ
  choice: njia zake
  rationale: Wingi wa Kigiriki umedumishwa, pamoja na mwangwi wa lugha ya kinabii kuhusu kuzitayarisha njia za Bwana.
theological_decisions:
- issue: Anayerejelewa kwa cheo “Bwana” katika unabii wa mtangulizi
  choice: Bwana
  alternative: Mungu; au Yesu Bwana
  rationale: Maneno hayo yana mwangwi wa unabii wa Agano la Kale kuhusu kuitayarisha njia mbele za Bwana, huku simulizi la Luka likionyesha huduma ya Yohana ikimtangulia Yesu. Tafsiri haibani maana kwa upande mmoja, bali inadumisha mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili lakini unadumisha wingi wa “njia,” cheo “Aliye Juu Zaidi,” na utata halisi wa “mbele za Bwana.” Alama ya tanbihi [a] imewekwa kwenye kirai inachokifafanua badala ya baada ya “pia,” ambako haingelingana na maudhui ya tanbihi.
