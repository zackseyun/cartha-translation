  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: sw
  text: Nao wakamwambia, “Hakuna mtu yeyote katika jamaa yako anayeitwa kwa jina hili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: wakamwambia
  rationale: Katika simulizi, kitenzi cha kusema pamoja na mtendajiwa huwasilishwa kwa Kiswahili cha kawaida na kwa ufupi kama “wakamwambia.”
- source_word: Οὐδείς ἐστιν
  choice: Hakuna mtu yeyote
  rationale: Huwasilisha kwa wazi ukataaji wa jumla unaoonyeshwa na Οὐδείς bila kupunguza nguvu yake.
- source_word: ἐκ τῆς συγγενείας σου
  choice: katika jamaa yako
  rationale: “Jamaa yako” hapa humaanisha kundi la ndugu au ukoo wa mtu, nayo “katika” huonyesha maana ya sehemu ya kundi iliyomo katika ἐκ.
- source_word: ὃς καλεῖται
  choice: anayeitwa
  rationale: Hufuata maana ya kawaida ya kaλέω katika hali ya kutendwa inapotumiwa kuhusu jina la mtu.
- source_word: τῷ ὀνόματι τούτῳ
  choice: jina hilo
  rationale: Hii ndiyo njia ya kawaida na ya asili katika Kiswahili ya kurejelea jina lililotajwa muda mfupi uliopita.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jamaa yako” limetumiwa kwa maana ya ndugu au ukoo, si familia ya nyumbani pekee. Hakuna tanbihi inayohitajika kwa sababu maana hiyo imewasilishwa wazi katika matini.
