  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: sw
  text: Kulingana na desturi ya ukuhani, kura ilimwangukia afukize uvumba alipoingia katika patakatifu pa Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «hekalu la Bwana.» Neno la Kigiriki ναός mara nyingi humaanisha jengo la hekalu, hasa patakatifu, badala ya viwanja vyote vya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: kwa kufuata desturi ya huduma ya ukuhani
  rationale: Kirai hiki kinaonyesha kutenda kulingana na utaratibu uliokubalika wa kazi ya kikuhani. ‘Huduma ya ukuhani’ huhifadhi maana ya cheo na utendaji wa kikuhani kwa Kiswahili cha kawaida.
- source_word: ἔλαχε
  choice: alichaguliwa kwa kura
  rationale: Kitenzi kinaonyesha kupata jukumu kwa njia ya kupiga kura; tafsiri hii inaeleweka kwa urahisi na inaweka wazi njia ya uteuzi.
- source_word: τοῦ θυμιᾶσαι
  choice: ili afukize uvumba
  rationale: Infinitivu inaonyesha jukumu alilopata, nalo ni kuchoma au kutoa uvumba. ‘Kufukiza uvumba’ ni usemi wa kawaida na sahihi katika muktadha wa ibada.
- source_word: εἰσελθὼν
  choice: baada ya kuingia
  rationale: Partisipio la aoristi linaweza kuonyesha tendo lililotangulia kufukiza uvumba. ‘Baada ya kuingia’ linaeleza uhusiano huo wa wakati kwa njia ya asili bila kuongeza maelezo yasiyokuwapo.
- source_word: εἰς τὸν ναὸν
  choice: katika patakatifu
  rationale: ναός hapa inaelekea kumaanisha jengo la ndani la hekalu, hasa mahali ambapo uvumba ulifukizwa, si eneo lote la viwanja vya hekalu. ‘Patakatifu’ linahifadhi utofautisho huo.
- source_word: τοῦ κυρίου
  choice: pa Bwana
  rationale: κύριος inamrejelea Mungu katika muktadha wa hekalu; ‘Bwana’ ndiyo tafsiri ya kawaida, yenye heshima na isiyoingiza tofauti ya maandishi ambayo Kigiriki hakionyeshi.
theological_decisions:
- issue: Maana ya ναός katika muktadha wa ibada hekaluni
  choice: patakatifu
  alternative: hekalu
  rationale: Ingawa ναός linaweza kutafsiriwa kwa neno pana ‘hekalu,’ kwa kawaida hutaja jengo la ndani au patakatifu tofauti na viwanja vyote vya hekalu. Kwa kuwa Zekaria aliingia kufukiza uvumba, ‘patakatifu’ linaonyesha mahali panapokusudiwa kwa usahihi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi utaratibu wa kikuhani, uteuzi kwa kura, na maana mahususi ya ναός.
