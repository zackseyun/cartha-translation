  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: sw
  text: Ikawa[a], alipokuwa akihudumu kama kuhani mbele za Mungu kufuatana na utaratibu wa kundi lake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ikawa, alipokuwa akifanya huduma ya ukuhani mbele za Mungu katika zamu ya kundi lake.”
    reason: Mbadala huu hueleza ἱερατεύειν kama kufanya huduma ya ukuhani na huonyesha upande wa zamu unaohusishwa na kundi la makuhani.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni fomula ya masimulizi inayoanzisha hatua mpya. “Ikawa” inadumisha nguvu hiyo kwa ufupi bila kuongeza neno la wakati lisilokuwamo wazi katika chanzo; δὲ hapa ni kiunganishi hafifu na haiashirii upinzani mkali.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: alipokuwa akihudumu kama kuhani
  rationale: Muundo wa ἐν pamoja na kitenzi-jina una maana ya wakati, yaani “alipokuwa.” Kitenzi ἱερατεύω kinamaanisha kutekeleza huduma ya ukuhani.
- source_word: τάξει
  choice: kwa zamu
  rationale: Katika muktadha wa huduma ya Hekalu, neno hili linaonyesha utaratibu uliowekwa wa kuhudumu. “Kwa zamu” linaeleweka kwa urahisi na linaendana na mfumo wa makundi ya makuhani.
- source_word: ἐφημερίας
  choice: kundi lake
  rationale: Linarejelea kundi la makuhani lililopangiwa kipindi maalumu cha huduma. “Kundi lake” linaweka wazi upande wa kitaasisi bila kutumia istilahi ya kizamani.
- source_word: ἔναντι τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba huduma hiyo ilifanywa katika uwepo wa Mungu.
theological_decisions:
- issue: Istilahi ya huduma ya kikuhani ya Zekaria Hekaluni
  choice: akihudumu kama kuhani mbele za Mungu kwa zamu ya kundi lake
  alternative: akifanya huduma ya ukuhani mbele za Mungu kulingana na utaratibu wa kundi lake
  rationale: Chaguo kuu linahifadhi mazingira ya kihistoria ya huduma ya Hekalu na mpangilio wa makundi ya makuhani bila kuingiza dhana za baadaye za madhehebu. Tanbihi inadumisha uwezekano wa kuelewa τάξις kama “utaratibu” badala ya kusisitiza zamu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Alama ya koma mwishoni imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
