  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: sw
  text: Majirani zake na jamaa zake waliposikia kwamba Bwana alikuwa amemwonyesha rehema kuu, wakafurahi pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: majirani
  rationale: Neno hili linamaanisha watu walioishi katika eneo lililomzunguka; “majirani” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: συγγενεῖς
  choice: jamaa zake
  rationale: Hurejelea watu wa ukoo au ndugu wa damu; “jamaa zake” ni wazi na ya kawaida katika muktadha huu.
- source_word: ἐμεγάλυνεν
  choice: alikuwa amemwonyesha ... kuu
  rationale: Ingawa kitenzi hiki kimsingi kina wazo la kufanya kuwa kubwa au kutukuza, pamoja na ἔλεος na μετ’ αὐτῆς kinaunda usemi unaomaanisha kumwonyesha rehema kwa kiwango kikubwa. Tafsiri hii ni ya asili bila kupoteza nguvu ya usemi.
- source_word: κύριος
  choice: Bwana
  rationale: Hapa ni cheo mahususi cha Mungu; “Bwana” ndiyo tafsiri ya kawaida na yenye hadhi.
- source_word: ἔλεος
  choice: rehema
  rationale: “Rehema” huwasilisha huruma na fadhili kwa uaminifu na pia hudumisha msamiati muhimu wa simulizi la utotoni katika Luka.
- source_word: μετ’ αὐτῆς
  choice: amemwonyesha
  rationale: Katika muundo huu, maana ya kimuktadha ni rehema ya Bwana iliyodhihirishwa kwake; umbo la Kiswahili lenye kiambishi cha mtendewa linaeleza uhusiano huo kwa kawaida.
- source_word: συνέχαιρον αὐτῇ
  choice: wakafurahi pamoja naye
  rationale: Huhifadhi wazi maana ya kufurahi kwa pamoja na mtu mwingine, badala ya kuifanya kuwa pongezi tu.
theological_decisions:
- issue: Tafsiri ya usemi ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Bwana alikuwa amemwonyesha rehema kuu
  alternative: Bwana alikuwa ameifanya rehema yake kuwa kuu kwake
  rationale: Tafsiri iliyochaguliwa inatoa maana ya usemi wa Kigiriki kwa Kiswahili cha asili. Mbadala wa karibu zaidi na muundo wa Kigiriki ni mzito na unaweza kudokeza kwamba rehema yenyewe ilibadilika ukubwa; “rehema kuu” huhifadhi nguvu ya μεγαλύνω bila kulazimisha Kiswahili kisicho cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa kutumia “waliposikia ... wakafurahi,” huku mpangilio wa matukio na maana ya matini ya Kigiriki vikihifadhiwa.
