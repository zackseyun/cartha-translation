  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: sw
  text: Akaingia mahali alipokuwa, akamwambia, “Salamu, uliyepewa neema[a]! Bwana yu pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uliyependelewa sana,” “uliyejaliwa neema,” au kwa mapokeo, “uliyejaa neema.” Kigiriki humaanisha mtu aliyeonyeshwa neema au kibali.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: Akaingia mahali alipokuwa
  rationale: Kirai hiki kinaonyesha kuingia na kumkaribia Maria. Kiswahili hiki ni cha kawaida na hakiongezi mahali maalumu pasipotajwa katika Kigiriki.
- source_word: Χαῖρε
  choice: Salamu
  rationale: Ingawa kimuundo ni amri yenye maana ya ‘furahi,’ hapa neno hilo linatumika kama salamu ya kawaida. ‘Salamu’ huwasilisha kazi yake katika muktadha kwa Kiswahili cha sasa.
- source_word: κεχαριτωμένη
  choice: uliyepewa neema
  rationale: Ni participio timilifu ya kutendwa, ikimweleza Maria kuwa mpokeaji wa neema au kibali alichopewa; tafsiri hii huhifadhi hali ya kutendwa bila kudokeza kuwa neema hiyo ni sifa ya asili iliyo ndani yake.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni cheo cha kawaida cha Mungu katika muktadha huu na hudumisha mwendelezo wa matumizi ya kibiblia.
- source_word: μετὰ σοῦ
  choice: yu pamoja nawe
  rationale: Kigiriki hakina kitenzi kishirikishi kilichoandikwa, lakini Kiswahili hukihitaji. ‘Yu pamoja nawe’ ni usemi wa heshima unaoeleweka na huhifadhi maana ya kuwapo kwa Bwana pamoja na Maria.
theological_decisions:
- issue: Tafsiri ya κεχαριτωμένη katika kifungu chenye unyeti wa kimafundisho kuhusu Maria
  choice: uliyepewa neema
  alternative: uliyependelewa sana; uliyejaa neema
  rationale: Kigiriki humweleza Maria kama mtu aliyefanyiwa tendo la neema au kibali. Chaguo hili hudumisha maana hiyo ya kutendwa bila kuingiza mafundisho ya baadaye yasiyosemwa wazi na kifungu; mbadala muhimu umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ‘akaingia… akamwambia’ ni wa kawaida katika simulizi za kibiblia. ‘Yu pamoja nawe’ huhifadhi hadhi ya usemi bila kuwa wa kizamani kupita kiasi.
