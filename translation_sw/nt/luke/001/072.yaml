lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: kuwatendea rehema
  rationale: Muungano huu wa maneno una maana ya kuonyesha au kutenda rehema. “Kuwatendea rehema” ni Kiswahili cha asili kinachohifadhi pia wazo la tendo, si hisia pekee.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: baba zetu
  rationale: Ingawa μετά pamoja na hali milikishi kwa kawaida ni “pamoja na,” hapa inaonyesha wale ambao rehema inawahusu. “Baba zetu” huhifadhi lugha ya kiume na mwangwi wa wazee wa Israeli katika historia ya agano.
- source_word: μνησθῆναι
  choice: kulikumbuka
  rationale: Kitenzi kinatafsiriwa moja kwa moja kuwa “kukumbuka.” Kiambishi “-li-” kinarejelea agano na kufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: διαθήκης
  choice: agano
  rationale: Katika muktadha huu neno linamaanisha agano la Mungu, si wosia wala mapatano ya kawaida.
- source_word: ἁγίας
  choice: takatifu
  rationale: “Takatifu” ndilo neno la moja kwa moja na la kawaida kwa sifa ya agano lililowekwa wakfu kwa Mungu.
- source_word: αὐτοῦ
  choice: lake
  rationale: Kiwakilishi kinamrejelea Mungu; umbo “lake” linapatana kisarufi na nomino “agano” bila kuongeza jina lisilokuwamo katika Kigiriki.
theological_decisions:
- issue: Kukumbuka kwa Mungu kama tendo la agano
  choice: kulikumbuka agano lake takatifu
  alternative: kutenda kwa uaminifu kulingana na agano lake takatifu
  rationale: Katika lugha ya Biblia, Mungu “kukumbuka” mara nyingi humaanisha pia kuchukua hatua kwa uaminifu kwa sababu ya ahadi yake. Hata hivyo, Kigiriki chenyewe kinasema “kukumbuka,” kwa hiyo tafsiri haibadili maana hiyo kuwa “kutimiza” au maelezo mengine.
- issue: Maana ya πατέρων ἡμῶν
  choice: baba zetu
  alternative: mababu zetu / wahenga wetu
  rationale: Neno la Kigiriki ni la kiume na hapa linawarejelea mababa wa Israeli. “Baba zetu” huhifadhi umbo hilo na uhusiano wake na historia ya agano, huku tanbihi ikifafanua marejeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuwatendea rehema” ni lugha inayoeleweka na yenye mwangwi wa kibiblia; “baba zetu” imehifadhiwa ili kutoondoa lugha ya kiume ya chanzo, na maana yake imefafanuliwa katika tanbihi.
