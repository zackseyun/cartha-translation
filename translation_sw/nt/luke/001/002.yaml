  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: sw
  text: kama vile wale ambao tangu mwanzo walikuwa mashahidi wa kujionea na wakawa watumishi wa neno walivyotukabidhi mambo hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe.” Neno la Kigiriki λόγος linaweza kumaanisha “neno,” “ujumbe,” au “simulizi”; hapa huenda linamaanisha ujumbe uliotangazwa kuhusu Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Inaonyesha ulinganisho na ulinganifu na kauli iliyotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: παρέδοσαν
  choice: walivyotukabidhi
  rationale: Kitenzi hiki hapa kinaeleza kupitishwa kwa habari au mapokeo kwa wengine; “kukabidhi” huhifadhi wazo la upokezaji wenye mamlaka bila kuifanya sentensi kuwa nzito.
- source_word: ἡμῖν
  choice: -tu- (walivyotukabidhi)
  rationale: Kiambishi cha yambwa “-tu-” kinawakilisha kwa kawaida yambwa pokezi ya Kigiriki, yaani “kwetu/sisi.”
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: wale ambao tangu mwanzo
  rationale: Hutambulisha kundi la watu waliokuwapo na kuhusika tangu mwanzo, huku ikihifadhi maana ya wakati.
- source_word: αὐτόπται
  choice: mashahidi waliojionea wenyewe
  rationale: Hutoa kwa uwazi maana ya watu walioona matukio hayo moja kwa moja; “waliojionea wenyewe” ni Kiswahili kinachoeleweka kuliko neno la kiufundi pekee.
- source_word: ὑπηρέται
  choice: watumishi
  rationale: Huonyesha watu waliotumikia neno au ujumbe, bila kuingiza dhana ya cheo rasmi cha kanisa.
- source_word: γενόμενοι
  choice: wakawa
  rationale: 'Huhifadhi mfuatano unaodokezwa na participio ya Kigiriki: walikuwa mashahidi waliojionea, kisha wakawa watumishi, badala ya kusawazisha hali hizo mbili kuwa za wakati mmoja tu.'
- source_word: τοῦ λόγου
  choice: wa neno
  rationale: “Neno” huhifadhi upana wa λόγος na usemi wa jadi; katika muktadha huu yaelekea ni ujumbe uliotangazwa kuhusu Yesu.
theological_decisions:
- issue: Kirejeo cha τοῦ λόγου
  choice: neno
  alternative: ujumbe
  rationale: Muktadha unaelekea kumaanisha ujumbe unaohusu Yesu, si lazima Logos kama jina la Kristo. Tafsiri kuu inahifadhi upana wa neno la Kigiriki, na tanbihi inaonyesha maana mbadala inayowezekana.
- issue: Uhusiano wa γενόμενοι na αὐτόπται καὶ ὑπηρέται
  choice: walikuwa mashahidi waliojionea wenyewe na wakawa watumishi
  alternative: walikuwa mashahidi waliojionea wenyewe na watumishi
  rationale: “Wakawa” hudumisha wazo la kuwa au kuja kuwa watumishi, bila kudai kwamba majukumu yote mawili yalianza kwa wakati uleule.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umeunganishwa na mstari uliotangulia kwa “kama vile.” “Mambo hayo” hufanya yambwa linalodokezwa na muktadha liwe wazi kwa msomaji wa Kiswahili.
