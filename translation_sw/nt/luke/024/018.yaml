  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Tafsiri inadumisha sauti ya mshangao katika swali na maana ya παροικεῖς ya kukaa kama mgeni, bila kuongeza ufafanuzi wa kimadhehebu.
