  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: sw
  text: Ndipo mmoja wao, aliyeitwa Kleopa, akamjibu, “Je, wewe peke yako ndiye unayeishi Yerusalemu kama mgeni[a], na hujui mambo yaliyotokea humo siku hizi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wewe peke yako ndiye mgeni katika Yerusalemu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuishi mahali kama mtu wa nje au mkazi wa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ndipo ... akamjibu
  rationale: Kiunganishi δέ kinaendeleza simulizi kwa upole, na umbo la Kiswahili ‘akamjibu’ linaunganisha kitenzi kishirikishi na tendo kuu kwa njia ya kawaida.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: mmoja wao, aliyeitwa Kleopa
  rationale: ‘Mmoja wao’ huweka wazi kutokana na muktadha kwamba ni mmoja wa wale wawili; ὀνόματι hutambulisha jina lake.
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamjibu
  rationale: Ingawa kwa karibu ni ‘akamwambia,’ muundo mzima ἀποκριθεὶς ... εἶπεν ni utangulizi wa jibu; Kiswahili cha kawaida huepuka kurudia ‘akajibu akamwambia.’
- source_word: Σὺ μόνος
  choice: wewe peke yako ndiye
  rationale: Huhifadhi msisitizo wa kiwakilishi Σὺ na upekee unaoonyeshwa na μόνος.
- source_word: παροικεῖς
  choice: mgeni anayekaa
  rationale: Kitenzi kina maana ya kukaa mahali kama mtu wa nje au mkazi wa muda. ‘Mgeni anayekaa’ huhifadhi wazo la ukaaji pamoja na hali ya kuwa si mwenyeji.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la jina la mahali linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: οὐκ ἔγνως
  choice: ambaye hajui
  rationale: Aoristi hapa inaeleza hali ya kutofahamu matukio ya karibuni; ‘hajui’ ni Kiswahili cha sasa na cha asili kwa swali hili.
- source_word: τὰ γενόμενα
  choice: mambo yaliyotokea
  rationale: Huwakilisha kishirikishi kilichotumika kama nomino na kurejelea matukio ya karibuni bila kuyaainisha zaidi.
- source_word: ἐν αὐτῇ
  choice: humo
  rationale: Hurejelea Yerusalemu kwa njia fupi na ya kawaida, huku ikihifadhi maana ya ‘ndani yake.’
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: siku hizi
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea siku hizi za karibuni katika muktadha.
