id: LUK.24.37
reference: Luke 24:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: sw
  text: Lakini walishtuka na kuingiwa na hofu, wakidhani kwamba walikuwa wakiona roho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzimu.” Neno la Kigiriki ni πνεῦμα, ambalo kwa maana ya moja kwa moja zaidi ni “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: walishtuka
  rationale: Kitenzi hiki kinaonyesha mshtuko wa ghafla; “walishtuka” ni Kiswahili cha kawaida na hakizidishi maana kwa kuingiza hofu ambayo tayari imetajwa baadaye.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaonyesha badiliko lenye utofauti mdogo kati ya Yesu kuwatokea na mwitikio wao; “Lakini” linafaa katika mtiririko huu.
- source_word: ἔμφοβοι γενόμενοι
  choice: kuingiwa na hofu
  rationale: Usemi huu unaonyesha kuanza kuwa katika hali ya hofu; “kuingiwa na hofu” huhifadhi maana hiyo ya kuingia katika hali mpya.
- source_word: ἐδόκουν
  choice: wakidhani
  rationale: Hutoa dhana au fikira yao wakati huo bila kudokeza uhakika.
- source_word: πνεῦμα
  choice: roho
  rationale: “Roho” ndilo neno la moja kwa moja na pana kwa πνεῦμα; halilazimishi dhana za kitamaduni zinazoweza kuambatana na “mzimu.”
- source_word: θεωρεῖν
  choice: walikuwa wakiona
  rationale: Muundo huu unaakisi hali inayoendelea ya kitenzi cha wakati uliopo katika kishamirisho tegemezi baada ya ἐδόκουν.
theological_decisions:
- issue: Tafsiri ya πνεῦμα katika simulizi la Yesu aliyefufuka kuwatokea wanafunzi
  choice: roho
  alternative: mzimu
  rationale: “Roho” ni karibu zaidi na neno la Kigiriki na huhifadhi wazo lao potovu kwamba walikuwa wakiona kiumbe kisicho na mwili, bila kuingiza dhana maalumu za jadi zinazoweza kuhusishwa na “mzimu.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mfuatano wa mshtuko, kuingiwa na hofu, na dhana yao, huku ikibaki ya kawaida kwa wasomaji wengi.
