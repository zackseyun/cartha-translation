  text: Nao walikuwa wakizungumza wao kwa wao kuhusu mambo haya yote yaliyotokea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao walikuwa wakiongea wao kwa wao kuhusu matukio haya yote yaliyotukia.”
    reason: 'Mbadala wa kileksika: ὡμίλουν inaweza kutafsiriwa “wakiongea,” na τῶν συμβεβηκότων τούτων kama “matukio haya yote yaliyotukia.”'
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kawaida bila kuongeza maana ya wakati isiyomo wazi katika Kigiriki.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi cha wazi katika Kigiriki kimewakilishwa kwa namna ya kawaida katika Kiswahili; hakihitaji msisitizo mzito wa ‘wao wenyewe’ katika muktadha huu.
- source_word: ὡμίλουν
  choice: walikuwa wakizungumza
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea; ‘walikuwa wakizungumza’ ni ya sasa, ya kawaida, na haidokezi hotuba rasmi.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Usemi huu unaonyesha mazungumzo ya kupokezana kati yao na ni wa kawaida katika Kiswahili sanifu.
- source_word: περὶ
  choice: kuhusu
  rationale: Hapa neno hili linatambulisha mada ya mazungumzo; ‘kuhusu’ ni sawia na wazi.
- source_word: πάντων
  choice: yote
  rationale: Neno hili linaonyesha jumla ya mambo yaliyokuwa mada ya mazungumzo.
- source_word: τῶν συμβεβηκότων τούτων
  choice: mambo haya yaliyokuwa yametokea
  rationale: Kirai hiki kinaeleza matukio yaliyokwisha kutokea lakini yenye umuhimu unaoendelea katika simulizi; muundo huu ni wa asili na unahifadhi hali hiyo.
