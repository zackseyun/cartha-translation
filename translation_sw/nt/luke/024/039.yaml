base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: sw
  text: Angalieni mikono yangu na miguu yangu; ni mimi mwenyewe.[a] Niguseni, mwone,[b] kwa maana roho[c] haina nyama na mifupa, kama mnavyoniona nina nyama na mifupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kwamba mimi ndiye.” Usemi wa Kigiriki unasisitiza utambulisho: “mimi mwenyewe ndiye.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Nipapaseni.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mzimu.” Neno la Kigiriki ni “roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Angalieni / mwone
  rationale: Kitenzi hiki ni agizo la wingi la kutazama mara moja. “Angalieni” linafaa kwa kukagua mikono na miguu, huku “mwone” likitoa Kiswahili cha kawaida katika agizo la pili.
- source_word: χεῖράς ... πόδας
  choice: mikono ... miguu
  rationale: Majina halisi ya viungo vya mwili yametafsiriwa moja kwa moja; katika muktadha yanathibitisha utambulisho wa Yesu kwa mwili.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ni mimi mwenyewe
  rationale: Muundo wa Kigiriki unasisitiza utambulisho wa Yesu. Kiswahili hiki ni cha kawaida na kinahifadhi msisitizo bila kuingiza maana nyingine ya kiteolojia.
- source_word: ψηλαφήσατέ
  choice: Niguseni
  rationale: Kitenzi humaanisha kugusa au kupapasa ili kuthibitisha kwa hisi. “Niguseni” ni wazi na cha kawaida; uwezekano mpana zaidi umeelezwa katika tanbihi.
- source_word: πνεῦμα
  choice: roho
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili na linahifadhi maana pana ya Kigiriki; “mzimu” lingeweza kuwa la kiutamaduni na lenye maana finyu zaidi.
- source_word: σάρκα καὶ ὀστέα
  choice: nyama na mifupa
  rationale: Hapa σάρξ linarejelea sehemu halisi ya mwili, si matumizi ya mfano. “Nyama na mifupa” ni usemi wa kawaida wa Kiswahili unaohifadhi utofautishaji wa kimwili.
- source_word: καθὼς
  choice: kama
  rationale: Huanzisha ulinganisho kati ya kile ambacho roho haina na kile wanafunzi wanachokiona kwa Yesu.
- source_word: θεωρεῖτε
  choice: mnavyoniona
  rationale: Kitenzi kinaweza kumaanisha kuona kwa makini. “Mnavyoniona” ni cha kawaida na kinadumisha ushahidi wa kuona katika muktadha.
- source_word: ἔχοντα
  choice: mimi kuwa nayo
  rationale: Kirai hiki kinamrejelea Yesu akiwa na nyama na mifupa. Muundo huu unahifadhi rejeo la wazi bila kurudia majina hayo kwa uzito usio wa lazima.
theological_decisions:
- issue: Kauli ya Yesu kuhusu uhalisi wa mwili wake baada ya kufufuka
  choice: 'Lugha ya moja kwa moja kuhusu mwili imehifadhiwa: “roho haina nyama na mifupa kama mnavyoniona mimi kuwa nayo.”'
  alternative: Tafsiri yenye kufifisha utofautishaji kati ya roho na mwili
  rationale: Kigiriki kinasisitiza uthibitisho kwa kuona na kugusa, pamoja na maneno “nyama na mifupa.” Tafsiri haiongezi maelezo ya kimadhehebu wala kupunguza mkazo wa andiko juu ya uwepo halisi wa Yesu kwa mwili.
- issue: Uhusiano wa ὅτι na agizo la kuangalia
  choice: 'Imetolewa kama kauli huru yenye msisitizo: “ni mimi mwenyewe.”'
  alternative: “ili mjue kwamba ni mimi mwenyewe” au “kwa maana ni mimi mwenyewe”
  rationale: ὅτι inaweza kueleweka kama ikitambulisha jambo la kutambuliwa au kama yenye maana ya sababu. Kauli huru ni ya asili katika Kiswahili, inahifadhi msisitizo wa utambulisho, na huepuka kulazimisha mojawapo ya mahusiano hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Angalieni” na “niguseni” ni maumbo ya wingi yanayolingana na wanafunzi wanaosemeshwa. Muundo wa sentensi umewekwa wa kawaida kwa wasomaji wa leo huku msisitizo, uthibitisho wa kihisi, na uwezekano wa kisintaksia wa Kigiriki vikihifadhiwa.
