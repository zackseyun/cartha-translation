base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: sw
  text: Lakini sisi tulikuwa tumetumaini kwamba yeye ndiye atakayeikomboa Israeli.[a] Lakini, pamoja na hayo yote,[b] leo ni siku ya tatu tangu mambo haya yalipotokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba yeye ndiye aliyekuwa atakuja kuikomboa Israeli.” Kigiriki kina kitenzi cha wakati wa sasa (“ni”) katika maudhui ya tumaini lao la wakati uliopita.
    reason: alternative_reading
  - marker: b
    text: Maneno “kuikomboa Israeli” yanaweza kumaanisha kwa upana ukombozi wa Kimasihi walioutarajia; andiko halisemi wazi kama walimaanisha uhuru wa kisiasa, wokovu wa kiroho, au yote mawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Lakini sisi
  rationale: δέ inaonyesha tofauti na habari iliyotangulia, huku ἡμεῖς ikisisitiza wahusika; ‘Lakini sisi’ huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: ἠλπίζομεν
  choice: tulikuwa tumetumaini
  rationale: Kauli ya wakati usiotimilika inaonyesha tumaini lililodumu wakati uliopita na ambalo sasa linaonekana kuvunjika.
- source_word: ὅτι αὐτός ἐστιν
  choice: kwamba yeye ndiye
  rationale: Muundo huu wa Kiswahili ni wa kawaida na hauhitaji kuonyesha wakati katika kishirikishi; hivyo huhifadhi wazi dai kuhusu utambulisho bila kulazimisha ‘alikuwa’.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: aliye karibu kuikomboa
  rationale: μέλλων pamoja na kitenzi-jina huonyesha tendo lililotarajiwa au lililokuwa karibu kutokea; ‘aliye karibu kuikomboa’ hudumisha mtazamo huo wa mbele.
- source_word: λυτροῦσθαι τὸν Ἰσραήλ
  choice: kuikomboa Israeli
  rationale: ‘Kukomboa’ huhifadhi maana ya kuweka huru pamoja na mwangwi wa ukombozi wa agano, bila kubainisha kuwa ni ukombozi wa kisiasa au wa kiroho pekee.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Zaidi ya hayo yote
  rationale: Fungu hili linaongeza jambo jingine la kuvunja moyo; tafsiri hii ni ya asili na huonyesha nguvu yake ya nyongeza.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: leo ni siku ya tatu
  rationale: ἄγει ni nahau ya kupita kwa wakati; ‘leo ni siku ya tatu’ hutoa maana hiyo kwa Kiswahili cha sasa kwa uwazi.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: tangu mambo haya yatukie
  rationale: ‘Tangu’ huonyesha mwanzo wa kuhesabu muda, na ‘yatukie’ hutafsiri kwa kawaida mambo yaliyotokea.
theological_decisions:
- issue: Maana ya tumaini la Kimasihi katika ‘kuikomboa Israeli’
  choice: Kuhifadhi ‘kuikomboa Israeli’ bila kufafanua aina ya ukombozi
  alternative: Kuwaokoa Israeli kisiasa; kuwaokoa Israeli kiroho
  rationale: Andiko halibainishi kama ukombozi unaokusudiwa ni wa kisiasa, wa kiroho, au unahusisha yote mawili; tafsiri inahifadhi mvutano huo.
- issue: Nguvu ya wakati katika ἐστιν baada ya ἠλπίζομεν
  choice: Kutumia ‘yeye ndiye’ na ‘aliye karibu’
  alternative: ‘yeye ndiye aliyekuwa aende kuikomboa’ au ‘alikuwa ndiye’
  rationale: Kiswahili hakilazimishi wakati kwenye ‘ndiye’; hivyo muundo huu unaweza kuhifadhi dai la Kigiriki la wakati wa sasa ndani ya maudhui ya tumaini la zamani bila kuwa mgumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tulikuwa tumetumaini’ huonyesha tumaini endelevu la zamani; ‘yeye ndiye’ ni ya asili na husaidia kuhifadhi kutokubadilishwa kwa ἐστιν. Alama zote za tanbihi zimewekwa katika matini kuu.
