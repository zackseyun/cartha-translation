  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: sw
  text: Akakichukua[a] na kukila mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema tu “akachukua” na “akala,” bila kutaja yambwa; yambwa inaeleweka kutokana na mstari uliotangulia kuwa ni kipande cha samaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kawaida bila kuongeza msisitizo wa wakati usio wazi katika Kigiriki.
- source_word: λαβὼν
  choice: akakichukua
  rationale: Ni kitenzi-jina cha aoristi kinachoonyesha tendo lililotangulia kula. Kiambishi cha yambwa “-ki-” kinarejelea kipande cha samaki kilichotajwa katika mstari uliotangulia.
- source_word: ἐνώπιον αὐτῶν
  choice: mbele yao
  rationale: Usemi huu wa kawaida unaonyesha kwamba tendo lilifanyika wakiwa wanaona, na hivyo huhifadhi uzito wa ushahidi wa tukio.
- source_word: ἔφαγεν
  choice: kukila
  rationale: Kitenzi cha aoristi kinasimulia tendo lililokamilika; kiambishi “-ki-” kinaweka wazi yambwa inayoeleweka kutokana na mstari uliotangulia.
theological_decisions:
- issue: Iwapo yambwa iliyodokezwa katika Kigiriki iwekwe wazi
  choice: Kiambishi cha yambwa “-ki-” kimetumiwa katika vitenzi vyote viwili, kikirejelea kipande cha samaki.
  alternative: Akachukua, akala mbele yao.
  rationale: Kigiriki hakitaji yambwa moja kwa moja kwa sababu inaeleweka kutokana na mstari uliotangulia. Kiswahili cha kawaida hunufaika kwa kuiweka wazi kwa kiambishi cha yambwa. Hii haiongezi wazo jipya wala haifafanui zaidi maana ya kitheolojia; inabainisha tu tendo lililosimuliwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mbele yao” ni usemi wa kawaida na unaoeleweka kwa urahisi; muundo wa mfululizo “akakichukua na kukila” huhifadhi mtiririko wa simulizi.
