  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: sw
  text: na bila kuupata mwili wake[a], walikuja wakisema kwamba walikuwa pia wameona maono ya malaika[b], ambao wanasema kwamba yuko hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa uwezekano wake ni mdogo, “walikuja wakisema kwamba walikuwa wameona maono ya malaika na kwamba wao wanasema yuko hai,” kwa kuchukulia “ambao wanasema” kuwa kunawarejelea wanawake badala ya malaika.
    reason: alternative_reading
  - marker: b
    text: Au “wakisema kwamba walikuwa wameona hata maono ya malaika.”
    reason: alternative_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: kwa kuwa hawakuukuta
  rationale: Kirai cha kitenzi kishirikishi cha wakati uliopita, kikiwa katika wingi wa kike na kuwarejelea wanawake, kimetafsiriwa kwa uhusiano wa sababu unaoeleweka kiasili katika Kiswahili; ukanushi μή umehifadhiwa katika “hawaku-”.
- source_word: τὸ σῶμα αὐτοῦ
  choice: mwili wake
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja katika muktadha wa kaburi na ufufuo.
- source_word: ἦλθον λέγουσαι
  choice: walikuja wakisema
  rationale: “Walikuja” huhifadhi maana ya moja kwa moja ya ἦλθον bila kuongeza “walirudi,” nayo “wakisema” huwakilisha kitenzi kishirikishi λέγουσαι kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaongeza habari ya maono juu ya kutokuwapo kwa mwili; “pia” huonyesha nyongeza hiyo kwa lugha ya kawaida bila kuitilia mkazo kupita kiasi.
- source_word: ὀπτασίαν ἀγγέλων
  choice: maono ya malaika
  rationale: ὀπτασία humaanisha jambo lililoonekana kwa namna ya maono; “maono ya malaika” huhifadhi asili yake isiyo ya kawaida na uwezekano wa kuona malaika katika maono.
- source_word: ἑωρακέναι
  choice: walikuwa wameona
  rationale: Kitenzi-jina cha wakati timilifu katika usemi ulioripotiwa kimetolewa kwa wakati timilifu wa zamani, kikionyesha kuona kulikotangulia kuja kwao.
- source_word: οἳ λέγουσιν
  choice: ambao wanasema
  rationale: Kiwakilishi cha uhusiano cha wingi wa kiume kinawarejelea kwa kawaida zaidi “malaika”; wakati uliopo wa λέγουσιν umehifadhiwa kwa “wanasema.”
- source_word: αὐτὸν ζῆν
  choice: kwamba yuko hai
  rationale: Muundo wa kitenzi-jina umetafsiriwa kama kishazi kamili cha Kiswahili; “yuko hai” ni usemi wa kawaida unaohifadhi dai la kuwa anaishi.
theological_decisions:
- issue: Mrejelewa wa οἳ λέγουσιν
  choice: 'Kiwakilishi “ambao” kinawarejelea malaika: “malaika, ambao wanasema kwamba yuko hai.”'
  alternative: 'Kukichukulia kiwakilishi kuwa kinawarejelea wanawake: “walikuja wakisema ... kwamba wanasema yuko hai.”'
  rationale: Kisintaksia, nomino iliyo karibu zaidi na kiwakilishi cha wingi wa kiume οἳ ni ἀγγέλων, “malaika,” na usomaji huu unapatana na simulizi la karibu. Usomaji mwingine umehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “walikuja wakisema” umehifadhi mfuatano wa Kigiriki bila kuwa mgumu, na “yuko hai” ni wa kawaida kuliko “anaishi” katika muktadha huu.
