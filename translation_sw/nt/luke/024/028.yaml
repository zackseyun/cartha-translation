  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: sw
  text: Nao wakakaribia kijiji walikokuwa wakienda, naye akafanya kana kwamba anaendelea mbele zaidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alijifanya kana kwamba anaendelea mbele zaidi” au “akatoa mwonekano kwamba anaendelea na safari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: wakakaribia
  rationale: Kitenzi hiki kinaonyesha kwamba walifika karibu na mahali fulani; “wakakaribia” ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo kuelekea kijijini.
- source_word: κώμην
  choice: kijiji
  rationale: κώμη kwa kawaida ni makazi madogo kuliko mji; “kijiji” ndilo neno la kawaida na linalofaa katika muktadha huu.
- source_word: οὗ ἐπορεύοντο
  choice: walichokuwa wakiendea
  rationale: Muundo huu unaonyesha mahali walipokusudia kufika na mwendo wao uliokuwa ukiendelea; “walichokuwa wakiendea” ni wa kawaida na sahihi.
- source_word: προσεποιήσατο
  choice: akafanya kana kwamba
  rationale: Usemi huu unaonyesha kwamba alitoa taswira ya kufanya jambo fulani. “Akafanya kana kwamba” huhifadhi maana hiyo bila kusisitiza zaidi ya Kigiriki kwamba kulikuwa na udanganyifu.
- source_word: πορρώτερον
  choice: mbali zaidi
  rationale: Hiki ni kielezi cha kulinganisha kinachoonyesha umbali mkubwa zaidi katika safari.
- source_word: πορεύεσθαι
  choice: angeendelea na safari kwenda
  rationale: Kitenzi-jina hiki kinataja mwendo ulioonekana kuwa ungeendelea. “Angeendelea na safari kwenda” huwasilisha maana hiyo kwa Kiswahili cha kawaida katika muundo wa “kana kwamba.”
theological_decisions:
- issue: Jinsi ya kutafsiri προσεποιήσατο kuhusu tendo la Yesu
  choice: akafanya kana kwamba angeendelea na safari kwenda mbali zaidi
  alternative: alijifanya kwamba angeenda mbali zaidi
  rationale: Tafsiri iliyochaguliwa inadumisha mvutano wa simulizi—Yesu alitoa taswira kwamba angeendelea—bila kuamua kimya-kimya kwamba tendo lake lilikuwa udanganyifu. Neno “alijifanya” limewekwa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “Nao… naye…” unadumisha mwendelezo wa simulizi, huku “akafanya kana kwamba” ukihifadhi utata wa neno la Kigiriki bila lugha nzito au ya kimadhehebu.
