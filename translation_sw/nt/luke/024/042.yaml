lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Kiunganishi δέ ni chepesi, na οἱ imetumiwa kama kiwakilishi cha watu waliotajwa katika muktadha. “Nao” huendeleza simulizi kwa Kiswahili cha kawaida bila kuingiza wazo la upinzani mkali.
- source_word: ἐπέδωκαν αὐτῷ
  choice: wakampa
  rationale: Kitenzi ἐπιδίδωμι hapa kina maana ya kumpa au kumkabidhi. Muundo “wakampa” unaunganisha kwa kawaida kitenzi na yambwa ya mtu katika Kiswahili.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: kipande cha samaki wa kuokwa
  rationale: μέρος ni “kipande” au “sehemu,” huku ἰχθύος ὀπτοῦ ikibainisha kwamba ni kipande cha samaki aliyeandaliwa kwa kuokwa au kuchomwa. “Samaki wa kuokwa” ni usemi wazi, mfupi, na wa kawaida unaohifadhi namna ya maandalizi.
theological_decisions:
- issue: Muundo wa maandishi ya Luka 24:42
  choice: 'Kutafsiri maandishi ya SBLGNT pekee: “kipande cha samaki wa kuokwa.”'
  alternative: Baadhi ya hati za baadaye zinaongeza maneno yanayotaja sega la asali.
  rationale: Chanzo kilichotolewa kinaishia na μέρος na hakina nyongeza kuhusu sega la asali. Nyongeza hiyo imehifadhiwa katika tanbihi kwa uwazi kuhusu tofauti ya maandishi, bila kuiingiza katika maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Nao wakampa” huendeleza mfululizo wa simulizi kwa ulaini, na “samaki wa kuokwa” huepuka neno la kiufundi lisilo la lazima.
