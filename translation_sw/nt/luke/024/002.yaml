  text: And they found the stone rolled away from the tomb,
translation:
  language: sw
  text: Nao wakalikuta jiwe limeviringishwa mbali na kaburi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: wakalikuta
  rationale: Kitenzi cha wakati uliopita, nafsi ya tatu wingi; kiambishi cha yambwa -li- kinarejelea jiwe, na mtenda anayeeleweka kutokana na mstari uliotangulia ni wale wanawake.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi, si alama ya upinzani mkali. “Nao” huunganisha tukio hili kwa kawaida na mstari uliotangulia.
- source_word: τὸν λίθον
  choice: jiwe
  rationale: Katika muktadha wa maziko, λίθος ni jiwe lililotumika kufunga kaburi. Kiswahili hakihitaji kibainishi tofauti cha maana ya “the” hapa.
- source_word: ἀποκεκυλισμένον
  choice: limeviringishwa mbali
  rationale: Hali timilifu tendwa inaonyesha kwamba jiwe lilikuwa tayari limeondolewa kwa kuliviringisha na lilibaki katika hali hiyo. “Limeviringishwa mbali” huhifadhi tendo na matokeo yake.
- source_word: ἀπὸ τοῦ μνημείου
  choice: na kaburi
  rationale: μνημεῖον hapa ni kaburi, na ἀπό huonyesha kwamba jiwe lilikuwa limeondolewa kutoka kwenye kaburi; muundo “mbali na kaburi” ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Mtenda wa kitenzi hajaandikwa tena wazi katika Kigiriki
  choice: Nao wakalikuta jiwe limeviringishwa mbali na kaburi
  alternative: Likapatikana jiwe limeviringishwa mbali na kaburi
  rationale: Wingi wa kitenzi cha Kigiriki unawarejelea wanawake wa mstari uliotangulia. “Nao waka-” huonyesha rejeleo hilo bila kuongeza utambulisho au maelezo ya kitheolojia yasiyokuwamo katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye “Nao waka-” unasomeka kwa urahisi na huhifadhi mwendelezo wa aya iliyotangulia; hakuna tanbihi inayohitajika.
