  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: sw
  text: akisema kwamba Mwana wa Adamu lazima akabidhiwe mikononi mwa watu wenye dhambi[a], asulubiwe, na siku ya tatu afufuke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atiwe mikononi mwa watu wenye dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au “ainuke.” Kigiriki kina kauli tendi, si kauli ya kutendwa “afufuliwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaendeleza uhusiano na agizo la kukumbuka maneno yake katika mstari uliotangulia.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Kiswahili na linahifadhi mwangwi wake wa kibiblia.
- source_word: ὅτι δεῖ
  choice: kwamba ... lazima
  rationale: Neno δεῖ linaonyesha ulazima, katika Luka likihusishwa na kutimizwa kwa mpango wa Mungu, wala si utabiri tu.
- source_word: παραδοθῆναι εἰς χεῖρας
  choice: atiwe mikononi mwa
  rationale: Usemi huu wa kawaida wa Kiswahili unahifadhi taswira ya kutiwa chini ya mamlaka ya wengine na maana ya kutolewa au kukabidhiwa.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: watu wenye dhambi
  rationale: ἀνθρώπων humaanisha wanadamu au watu; Kiswahili hiki ni cha kawaida na hakiongezi jinsia ambayo nomino yenyewe hailazimishi kisemantiki.
- source_word: σταυρωθῆναι
  choice: asulubiwe
  rationale: Hili ni neno sahihi na lililozoeleka kwa tendo la kuuawa msalabani, huku likihifadhi hali ya kutendwa.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Hii ndiyo namna ya kawaida na wazi ya kuonyesha wakati unaotajwa na dative ya Kigiriki.
- source_word: ἀναστῆναι
  choice: afufuke
  rationale: Kitenzi cha Kigiriki ni cha kauli tendi; ‘afufuke’ kinahifadhi maana ya kuinuka kutoka kwa wafu bila kukibadili kuwa kauli ya kutendwa ‘afufuliwe.’
theological_decisions:
- issue: Nguvu ya δεῖ katika utabiri wa mateso ya Yesu
  choice: lazima, ikionyesha ulazima ndani ya mpango wa Mungu
  alternative: angetolewa, kama utabiri rahisi wa jambo la baadaye
  rationale: Katika Luka, δεῖ mara nyingi huonyesha ulazima wa kutimizwa kwa kusudi la Mungu. Tafsiri ‘lazima’ inadumisha uzito huo bila kuufafanua kupita maandishi.
- issue: Kauli ya ἀναστῆναι
  choice: afufuke
  alternative: afufuliwe
  rationale: Maandishi yana umbo la kauli tendi. ‘Afufuke’ huhifadhi umbo hilo, huku ‘afufuliwe’ lingeingiza kauli ya kutendwa inayopatikana katika vifungu vingine lakini si hapa.
- issue: Utambulisho wa ἀνθρώπων ἁμαρτωλῶν
  choice: watu wenye dhambi
  alternative: wanaume wenye dhambi
  rationale: Nomino ἄνθρωπος inaweza kutaja watu kwa ujumla, tofauti na ἀνήρ inayosisitiza wanaume. Muktadha hauhitaji tafsiri iongeze jinsia, ingawa wahusika wa moja kwa moja katika kukamatwa na kusulubiwa walikuwa wanaume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa mstari unabaki kuwa sehemu ya sentensi inayoendelea kutoka mstari uliotangulia; ‘atiwe mikononi mwa’ huhifadhi nahau na taswira ya Kigiriki.
