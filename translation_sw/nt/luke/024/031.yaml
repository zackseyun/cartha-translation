  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: sw
  text: Ndipo macho yao yakafumbuliwa, nao wakamtambua; naye akawa haonekani machoni pao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatoweka mbele yao” au “akatoweka wasimwone.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: yakafumbuliwa
  rationale: Kauli tendwa ya wakati uliopita inahifadhi wazo kwamba uwezo wao wa kuona na kuelewa uliwezeshwa, haukutokana nao wenyewe. ‘Kufumbuliwa macho’ ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: οἱ ὀφθαλμοὶ
  choice: macho yao
  rationale: Muundo huu ni wa asili katika Kiswahili na unawakilisha nomino ‘macho’ pamoja na umilikishi αὐτῶν.
- source_word: ἐπέγνωσαν
  choice: wakamtambua
  rationale: Katika muktadha huu kitenzi kinaonyesha kumtambua mtu ambaye hapo awali hawakujua ni nani, si kujua tu habari zake.
- source_word: ἄφαντος
  choice: akaacha kuonekana
  rationale: Huwasilisha hali ya kutokuonekana bila kudai namna hasa ambayo Yesu aliondoka au akawa asiyeonekana.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: kwao
  rationale: '‘Kwao’ huhifadhi uhusiano wa tukio na waonaji: hawakuendelea kumwona, bila kutumia tafsiri sisisi isiyo ya kawaida katika Kiswahili.'
- source_word: δὲ
  choice: Ndipo
  rationale: Hutambulisha hatua inayofuata katika simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Namna Yesu alivyoacha kuonekana
  choice: akaacha kuonekana kwao
  alternative: akatoweka mbele yao; akatoweka wasimwone
  rationale: Tafsiri hii inafuata ἄφαντος ἐγένετο na kudumisha fumbo la simulizi bila kubainisha kama alitoweka kimwili, akawa asiyeonekana, au aliondoka kwa njia nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘macho yao yakafumbuliwa’ unadumisha taswira ya Kigiriki, huku ‘akaacha kuonekana kwao’ ukihifadhi kutobainishwa kwa namna ya tukio.
