  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: sw
  text: Nao wakaambiana, “Je, moyo wetu[a] haukuwa ukiwaka ndani yetu alipokuwa akizungumza nasi njiani[b], alipokuwa akitufungulia Maandiko[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mioyo yetu”; Kigiriki kina umoja, “moyo wetu.”
    reason: lexical_alternative
  - marker: b
    text: Au “barabarani.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, alipokuwa akifanya maana ya Maandiko iwe wazi kwetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: wakaambiana
  rationale: Kitenzi hiki cha kutendeana kinaeleza kwa Kiswahili cha kawaida kwamba walisema wao kwa wao, bila kurudia maneno yasiyo ya lazima.
- source_word: Οὐχὶ
  choice: Je, ... haukuwa
  rationale: Muundo huu unabaki kuwa swali la balagha linalotarajia jibu la kukubali.
- source_word: ἡ καρδία ἡμῶν
  choice: moyo wetu
  rationale: Umoja wa neno la Kigiriki umehifadhiwa; hapa unaweza kuonyesha mwitikio wao wa ndani walioushiriki pamoja.
- source_word: καιομένη
  choice: ukiwaka
  rationale: Inahifadhi sitiari ya kuwaka bila kuifasiri moja kwa moja kuwa msisimko wa kihisia, mwanga wa kiroho, au ufahamu.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Ni usemi wa kawaida unaohifadhi maana ya tukio lililotendeka katika utu wao wa ndani.
- source_word: ἐλάλει
  choice: alipokuwa akizungumza
  rationale: Muundo wa kuendelea unatilia maanani hali ya tendo linaloendelea iliyo katika wakati usiotimilika wa Kigiriki.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni Kiswahili cha kawaida kinachoweza kumaanisha wakiwa safarini au barabarani katika muktadha wa kwenda Emau.
- source_word: διήνοιγεν
  choice: alipokuwa akitufungulia
  rationale: Inahifadhi sitiari ya kufungua na pia hali ya tendo linaloendelea, huku muktadha ukionyesha kuwa maana ya Maandiko ilikuwa ikifanywa wazi.
- source_word: τὰς γραφάς
  choice: Maandiko
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa maandishi matakatifu yanayorejelewa katika muktadha huu.
theological_decisions:
- issue: Sitiari ya moyo kuwaka
  choice: moyo wetu haukuwa ukiwaka ndani yetu
  alternative: mioyo yetu haikuguswa sana / tulihisi moto ndani yetu
  rationale: Sitiari ya chanzo imehifadhiwa bila kuamua ikiwa tukio hilo lilikuwa hasa la kihisia, kiroho, au kiakili.
- issue: Maana ya kufunguliwa kwa Maandiko
  choice: akitufungulia Maandiko
  alternative: akitufafanulia Maandiko
  rationale: Tafsiri inadumisha sitiari ya kufungua badala ya kuibadili kabisa kuwa ufafanuzi, ingawa tanbihi inaeleza maana yake katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida na unaweka nguvu ya swali la balagha; nyakati zinadumisha matendo yaliyokuwa yakiendelea.
