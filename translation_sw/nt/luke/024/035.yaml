base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: sw
  text: Nao wenyewe walikuwa wakisimulia mambo yaliyotokea njiani, na jinsi alivyotambuliwa nao[a] katika kuumega mkate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyofanywa ajulikane kwao.” Kigiriki kinatumia kitenzi katika hali ya kutendwa, ambacho kinaweza kusisitiza ama wao kumtambua au yeye kufanywa ajulikane kwao.
    reason: alternative_reading
  - marker: b
    text: Au, “katika kuumega mkate ule.” Kigiriki kinaweza kueleweka kwa maana ya jumla zaidi, lakini muktadha unarejelea mlo mahususi uliosimuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: wao wenyewe
  rationale: Kiwakilishi cha kusisitiza kimedumishwa ili kuonyesha kwamba wanafunzi hao wawili sasa walitoa simulizi lao wenyewe.
- source_word: ἐξηγοῦντο
  choice: walikuwa wakisimulia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea na maana ya kusimulia au kutoa taarifa ya matukio.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: mambo yaliyotokea njiani
  rationale: Kigiriki kina usemi mfupi usiotaja kitenzi; kuongeza ‘yaliyotokea’ kunafanya Kiswahili kiwe cha kawaida bila kuongeza jambo jipya katika muktadha.
- source_word: ὁδῷ
  choice: njiani
  rationale: Hii ni tafsiri ya kawaida na ya asili kwa safari inayosimuliwa.
- source_word: ὡς
  choice: jinsi
  rationale: Neno hili linaanzisha maelezo kuhusu namna au tukio la kumtambua Yesu.
- source_word: ἐγνώσθη
  choice: alivyofunuliwa kwao
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na dokezo kwamba kujulikana kwake hakukutokana tu na utambuzi wao wenyewe, bila kufafanua kupita kiasi mtendaji wa tendo hilo.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: katika kuumega ule mkate
  rationale: Huhifadhi muundo wa nomino wa Kigiriki kwa Kiswahili cha asili na kuelekeza kwenye mkate mahususi wa chakula kilichotangulia.
- source_word: ἄρτου
  choice: mkate
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa ἄρτος katika muktadha huu.
theological_decisions:
- issue: Ikiwa ἐγνώσθη itafsiriwe kama utambuzi wa kibinadamu tu au kwa hali ya kutendwa inayodumisha dokezo la kufunuliwa
  choice: alivyofunuliwa kwao
  alternative: alivyotambuliwa nao
  rationale: Kitenzi cha Kigiriki kiko katika hali ya kutendwa. Tafsiri iliyochaguliwa inadumisha mvutano kati ya wao kumtambua na yeye kufanywa ajulikane kwao, bila kudai wazi kwamba ni hali ya kutendwa ya kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walikuwa wakisimulia’ ni cha kawaida na kinaonyesha tendo linaloendelea; ‘ule mkate’ hurejelea kwa urahisi mkate wa tukio lililotangulia.
