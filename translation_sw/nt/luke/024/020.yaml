  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: sw
  text: na jinsi makuhani wetu wakuu na watawala wetu walivyomkabidhi kwa hukumu ya kifo na wakamsulubisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως τε
  choice: na jinsi ... walivyo-
  rationale: Muundo huu unaendeleza simulizi la mstari uliotangulia na kuwasilisha jambo linalosimuliwa kwa Kiswahili cha kawaida.
- source_word: παρέδωκαν
  choice: walimtia mikononi mwa wenye mamlaka
  rationale: Kitenzi kina maana ya kumkabidhi au kumweka chini ya mamlaka ya wengine. Kauli hii inaonyesha kukabidhiwa kwa ajili ya hatua ya kisheria bila kuipa maana finyu ya kusaliti.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wetu wakuu
  rationale: Hili ni jina la kundi la viongozi wa juu wa kikuhani, si madai kwamba kulikuwa na makuhani wakuu wengi wenye cheo hicho kwa wakati mmoja.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: watawala wetu
  rationale: Neno linarejelea viongozi wenye mamlaka; kiwakilishi 'wetu' kimehifadhi utambulisho wa wasemaji na watu wao.
- source_word: εἰς κρίμα θανάτου
  choice: ili ahukumiwe kifo
  rationale: κρίμα hapa ni hukumu au uamuzi wa kimahakama unaoleta kifo. Kiswahili hiki ni cha asili na kinahifadhi mwelekeo wa kukabidhiwa kwake.
- source_word: ἐσταύρωσαν
  choice: wakamsulubisha
  rationale: Kitenzi tendaji kinawahesabia viongozi hao tendo na wajibu wa kusulubisha, bila kuongeza katika matini maelezo ya namna Waroma walivyotekeleza adhabu.
theological_decisions:
- issue: Uhusika wa viongozi katika kuuawa kwa Yesu
  choice: wakamsulubisha
  alternative: wakasababisha asulubishwe
  rationale: Kigiriki kina kitenzi tendaji chenye makuhani wakuu na watawala kama wahusika. Tafsiri ya moja kwa moja inadumisha uzito wa uwajibikaji wao, huku tanbihi ikionyesha uwezekano wa kueleza utekelezaji kupitia mamlaka nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umechaguliwa kuwa rahisi kueleweka kwa msomaji wa kawaida huku ukihifadhi lugha ya kimahakama na uwajibikaji unaoonyeshwa na Kigiriki.
