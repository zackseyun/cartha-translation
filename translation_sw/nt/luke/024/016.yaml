translation:
  language: sw
  text: Lakini macho yao yalizuiwa wasimtambue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “macho yao yalishikiliwa wasimtambue,” au, “macho yao yalizuiwa wasiweze kumtambua.” Kigiriki hakimtaji mtendaji katika kauli hii ya kutendwa.
    reason: Mbadala wa kimsamiati na ufafanuzi kwamba mtendaji katika kauli ya kutendwa hakutajwa.
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: 'Kiunganishi hiki kinaonyesha maendeleo yenye utofauti: Yesu alikuwa pamoja nao, lakini hawakumtambua.'
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτῶν
  choice: macho yao
  rationale: Tafsiri hii inahifadhi taswira halisi ya macho iliyopo katika Kigiriki badala ya kuifanya kuwa kauli dhahania kuhusu ufahamu wao.
- source_word: ἐκρατοῦντο
  choice: yalizuiwa
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha kwamba macho yao yalikuwa yameshikiliwa au yamezuiwa, bila kumtaja mtendaji. ‘Yalizuiwa’ ni Kiswahili cha kawaida na hakiongezi mtendaji ambaye Kigiriki hakumtaji.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: kumtambua
  rationale: Katika muktadha huu, ἐπιγινώσκω humaanisha kumtambua au kujua utambulisho wa mtu, si kujua kwa ujumla. Muundo ‘yalizuiwa kumtambua’ unaeleza matokeo bila kulazimisha tafsiri finyu ya kusudi.
- source_word: αὐτόν
  choice: -m- (katika ‘kumtambua’)
  rationale: Kiambishi cha yambwa ‘-m-’ kinamrejelea Yesu kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo mtendaji aliyezuia utambuzi atajwe
  choice: 'Kuacha mtendaji bila kutajwa: ‘macho yao yalizuiwa kumtambua.’'
  alternative: Kusema wazi ‘Mungu aliyazuia macho yao’ au kubadili kuwa ‘hawakuweza kumtambua.’
  rationale: Kigiriki kimetumia hali ya kutendwa bila kumtaja mtendaji. Tafsiri haimtaji Mungu moja kwa moja wala kuondoa hali hiyo ya kutendwa, hivyo inadumisha utata na mvutano wa kiteolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida, huku ikihifadhi taswira ya ‘macho yao’ na hali ya kutendwa ya Kigiriki.
