  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: sw
  text: Na tazama, ninawapelekea ahadi ya Baba yangu. Lakini kaeni mjini mpaka mvikwe nguvu kutoka juu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: tazama
  rationale: Kihisishi hiki kinavuta fikira za wasikilizaji; “tazama” ni tafsiri ya moja kwa moja, yenye hadhi na inayoeleweka katika Kiswahili sanifu.
- source_word: ἐξαποστέλλω
  choice: ninaituma
  rationale: Wakati wa sasa wa kitenzi umehifadhiwa. Kiambishi “-i-” kinarejelea “ahadi” bila kuongeza maelezo ambayo hayamo wazi katika mstari.
- source_word: ἐπαγγελίαν
  choice: ahadi
  rationale: “Ahadi” huhifadhi maana ya neno la Kigiriki na kutatua kimakusudi kutotaja hapa ikiwa ni ahadi yenyewe au kile kilichoahidiwa.
- source_word: καθίσατε
  choice: kaeni
  rationale: Katika muktadha huu kitenzi kina maana ya kubaki au kukaa mahali; “kaeni” ni ya asili na bado iko karibu na taswira ya chanzo.
- source_word: ἐν τῇ πόλει
  choice: mjini
  rationale: Chanzo kinasema “katika mji” bila kutaja Yerusalemu katika mstari huu; tafsiri haiongezi jina kutokana na muktadha.
- source_word: ἐνδύσησθε
  choice: mvikwe
  rationale: Huhifadhi kauli tendwa na sitiari ya kuvikwa, badala ya kuibadili kuwa “mpokee” au “mjazwe.”
- source_word: ἐξ ὕψους δύναμιν
  choice: nguvu kutoka juu
  rationale: 'Huhifadhi mpangilio wa maana wa chanzo: nguvu ina asili yake “juu,” bila kufafanua zaidi ya maandishi.'
theological_decisions:
- issue: Utambulisho wa “ahadi ya Baba”
  choice: Imeachwa kama “ahadi ya Baba yangu.”
  alternative: “Roho Mtakatifu aliyeahidiwa na Baba yangu”
  rationale: Muktadha mpana unaweza kuelekeza kwa Roho Mtakatifu, lakini mstari huu wenyewe unasema “ahadi”; kutaja Roho moja kwa moja kungeondoa metonimia na kuongeza ufafanuzi.
- issue: Sitiari ya kuvikwa nguvu
  choice: Imehifadhiwa kama “mvikwe nguvu.”
  alternative: “mpokee nguvu” au “mjazwe nguvu”
  rationale: Kauli ya chanzo inaunganisha nguvu na vazi; kuhifadhi sitiari huepuka kuamua kimafundisho namna nguvu hiyo inavyotolewa au kutenda kazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Na tazama” huhifadhi msisitizo wa ἰδού; “juu yenu” huhifadhi mwelekeo wa ἐφ’ ὑμᾶς, na “kutoka juu” hutofautisha chanzo cha nguvu.
