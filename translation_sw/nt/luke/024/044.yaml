id: LUK.24.44
reference: Luke 24:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: sw
  text: 'Kisha akawaambia, “Haya ndiyo maneno yangu niliyowaambia nilipokuwa bado pamoja nanyi: ni lazima yote yaliyoandikwa[a] katika Sheria ya Musa, Manabii na Zaburi kunihusu[c] yatimizwe.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yote yaliyoandikwa.”
    reason: lexical_alternative
  - marker: b
    text: “Sheria ya Musa, Manabii na Zaburi” huenda inarejelea migawanyo mikuu ya Maandiko ya Israeli. “Zaburi” inaweza kumaanisha kitabu cha Zaburi hasa, au kwa upana zaidi sehemu ya Maandiko.
    reason: cultural_note
  - marker: c
    text: Au, “kuhusu mimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Kisha akawaambia
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; ‘Kisha’ hutoa mtiririko wa kawaida. ‘Akawaambia’ ni Kiswahili asilia kwa kitenzi cha kusema pamoja na πρὸς αὐτούς.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Haya ndiyo maneno yangu
  rationale: Muundo huu unaonyesha kwa msisitizo maneno aliyokuwa amewaambia; ‘maneno’ ni ulinganifu wa moja kwa moja wa λόγοι.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: niliyowaambia
  rationale: Ingawa kihalisi ni ‘niliyonena kwenu,’ ‘niliyowaambia’ ni ya kawaida na sahihi katika Kiswahili bila kupoteza wazo la kusema kwao.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: nilipokuwa bado pamoja nanyi
  rationale: Huhifadhi maana ya wakati ya kishiriki, ἔτι kama ‘bado,’ na σύν kama ‘pamoja na.’
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: ni lazima ... yatimizwe
  rationale: ‘Ni lazima’ huhifadhi nguvu ya ulazima katika δεῖ, na ‘yatimizwe’ ni kauli tendwa inayofaa kwa πληρωθῆναι katika muktadha wa Maandiko.
- source_word: πάντα τὰ γεγραμμένα
  choice: yote yaliyoandikwa
  rationale: Huhifadhi wingi usio na jinsia na maana jumuishi ya πάντα kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: katika Sheria ya Musa, Manabii na Zaburi
  rationale: Majina yenye herufi kubwa yanaonyesha sehemu zinazotambulika za Maandiko. Orodha ya Kiswahili hutumia koma na ‘na’ ya mwisho kwa mtiririko wa kawaida, bila kupoteza vikundi vitatu vya Kigiriki.
- source_word: περὶ ἐμοῦ
  choice: kunihusu
  rationale: Ni usemi wa sasa na wa kawaida unaowasilisha maana ya περί pamoja na kiwakilishi cha nafsi ya kwanza.
theological_decisions:
- issue: Nguvu na upeo wa ulazima wa kutimizwa kwa Maandiko
  choice: ni lazima ... yatimizwe
  alternative: yalipaswa kutimizwa
  rationale: Kauli iliyochaguliwa huhifadhi ulazima wenye uzito wa δεῖ bila kueleza zaidi namna au nadharia ya utimilifu.
- issue: Utambulisho wa ‘Sheria ya Musa, Manabii na Zaburi’
  choice: Kutaja vikundi hivyo kama sehemu za Maandiko na kueleza uwezekano wake katika tanbihi
  alternative: Kufanya ‘Zaburi’ kuwa jina la moja kwa moja la Maandiko yote katika sehemu ya tatu
  rationale: Maneno yanaweza kuelekeza kwenye migawanyo mikuu ya Maandiko ya Israeli, lakini haijulikani kabisa kama ‘Zaburi’ hapa ni kitabu chenyewe tu au jina pana la Maandiko mengine; tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio umewekwa wa kawaida kwa Kiswahili, huku ulazima, kauli tendwa na utata wa marejeo ya ‘Zaburi’ vikihifadhiwa.
