lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: walipoingia
  rationale: Kauli ya wakati inaonyesha tendo lililotangulia na inarejelea wale wanawake; “walipoingia” ni Kiswahili cha kawaida na cha asili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza simulizi huku kikionyesha tofauti ndogo kati ya kuingia kwao na jambo lisilotarajiwa walilolikuta.
- source_word: οὐχ εὗρον
  choice: hawakuukuta
  rationale: Hii inawasilisha kwa njia ya kawaida kitenzi cha wakati uliopita kilichokanushwa. “Kuukuta” linafaa kwa kitu kilichotarajiwa kuwa mahali fulani.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: “Mwili” ndilo neno la kawaida na la moja kwa moja kwa σῶμα; haliongezi ufafanuzi wa kimapokeo usiokuwamo katika matini hii.
theological_decisions:
- issue: Iwapo kutaja mwili huo ulikuwa wa nani
  choice: mwili
  alternative: mwili wa Bwana Yesu
  rationale: Matini ya Kigiriki iliyotolewa ina “mwili” tu. Tafsiri haiongezi maneno ya usomaji mrefu unaopatikana katika baadhi ya hati, lakini tofauti hiyo inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Kiambishi cha yambwa katika “hawakuukuta” kinarejelea “mwili” na kudumisha usemi wa asili.
