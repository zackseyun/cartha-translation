  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: sw
  text: Lakini siku ya kwanza ya juma[a], mapema sana alfajiri, walifika kaburini wakileta viungo vya manukato waliyoandaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya Kigiriki, “katika siku ya kwanza ya Sabato”; hapa “Sabato” iko katika wingi katika Kigiriki. Ni nahau inayomaanisha siku ya kwanza ya juma.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Lakini siku ya kwanza ya juma
  rationale: Kirai hiki ni nahau ya Kisemiti/Kigiriki cha Koine inayomaanisha siku ya kwanza ya juma. Tafsiri ya maana ni wazi na ya kawaida katika Kiswahili, huku tanbihi ikihifadhi umbo la karibu zaidi na maneno ya asili.
- source_word: ὄρθρου βαθέως
  choice: alfajiri na mapema sana
  rationale: Kirai hiki husisitiza kwamba ilikuwa alfajiri ya mapema kabisa. Usemi huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa wakati bila kutumia tafsiri ngumu kama “alfajiri yenye kina.”
- source_word: ἐπὶ τὸ μνῆμα
  choice: kaburini
  rationale: Pamoja na kitenzi cha mwendo, ἐπί inaonyesha kuelekea mahali. “Kaburini” ni tafsiri ya kawaida na inayofaa kwa kaburi la kuzikia katika muktadha huu.
- source_word: ἦλθον
  choice: walifika
  rationale: Kitenzi kinaeleza kufika kwao kaburini. “Walifika” huepuka utata wa kielekezi kati ya “walikuja” na “walikwenda” na ni cha asili katika simulizi la Kiswahili.
- source_word: φέρουσαι
  choice: wakileta
  rationale: Kishiriki hiki kinaonyesha tendo lililoendelea wakati mmoja na kufika kwao; “wakileta” hudumisha uhusiano huo kwa ufasaha.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: manukato waliyokuwa wametayarisha
  rationale: ἀρώματα ni vitu vyenye harufu nzuri vilivyotumiwa katika maandalizi ya maziko. “Manukato” ni neno linaloeleweka kwa urahisi, na “waliyokuwa wametayarisha” huonyesha kwamba maandalizi yalitangulia kufika kwao.
theological_decisions:
- issue: Nahau ya wakati τῇ μιᾷ τῶν σαββάτων katika simulizi la ufufuo
  choice: siku ya kwanza ya juma
  alternative: siku ya kwanza ya Sabato
  rationale: Maana ya kawaida ya nahau hiyo ndiyo inayotafsiriwa katika maandishi makuu. Umbo halisi zaidi limewekwa katika tanbihi ili lisitumiwe kuingiza dai maalumu la kimadhehebu au la kalenda ambalo Kigiriki hakilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Alfajiri na mapema sana” hutoa msisitizo wa Kigiriki kwa usemi wa kawaida wa Kiswahili.
