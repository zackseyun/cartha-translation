  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: sw
  text: wakisema[a], “Bwana amefufuliwa kweli na amemtokea Simoni!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Bwana amefufuka kweli” au “Bwana alifufuliwa kweli.” Kielezi na kitenzi cha Kigiriki vinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana; maandishi makuu yanahifadhi kauli tendwa ya Kigiriki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: wakisema
  rationale: Ni kauli ya wakati uliopo yenye umbo la kushiriki, wingi wa kiume; “wakisema” hudumisha uhusiano wake na sentensi inayotangulia bila kuongeza mhusika mpya.
- source_word: ὅτι
  choice: alama za kunukuu
  rationale: Hapa ὅτι inatanguliza yaliyosemwa moja kwa moja; alama za kunukuu ni njia ya kawaida na ya asili katika Kiswahili.
- source_word: ὄντως
  choice: kweli
  rationale: Neno hili linasisitiza uhakika wa taarifa; “kweli” ni la kawaida, wazi, na lenye uzito unaofaa.
- source_word: ἠγέρθη
  choice: amefufuliwa
  rationale: Ni aoristi tendwa ya ἐγείρω. “Amefufuliwa” huhifadhi kauli tendwa ya Kigiriki na kueleza matokeo yenye umuhimu wa sasa kwa Kiswahili cha kawaida.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Hapa κύριος ni cheo cha Yesu; “Bwana” ndilo neno la kawaida la Kiswahili linalohifadhi uzito wa cheo hicho.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha uthibitisho wa kufufuliwa na kumtokea Simoni.
- source_word: ὤφθη
  choice: amemtokea
  rationale: Ingawa umbo la Kigiriki ni tendwa, katika muktadha wa matukio baada ya ufufuo lina maana ya kujionyesha au kumtokea mtu. “Amemtokea” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: Σίμωνι
  choice: Simoni
  rationale: Ni jina la mtu katika hali ya dative; “Simoni” huhifadhi jina lililotajwa bila kulipanua kuwa “Simoni Petro.”
theological_decisions:
- issue: Kauli ya kitenzi cha ufufuo
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kigiriki kimetumia kauli tendwa. “Amefufuliwa” huihifadhi bila kuamua wazi mtendaji ambaye hajasemwa katika mstari huu.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: Katika muktadha huu ni cheo cha Kikristo kwa Yesu; “Bwana” huhifadhi maana na uzito wake bila kuidhoofisha.
- issue: Kauli ya ὤφθη
  choice: amemtokea
  alternative: ameonekana na Simoni
  rationale: “Amemtokea” ni usemi wa kawaida wa Kiswahili kwa kujidhihirisha kwa mtu na huepuka tafsiri ngumu ya neno kwa neno, bila kuongeza kwamba Simoni alimwona kwa namna fulani maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Amefufuliwa” huhifadhi kauli tendwa ya chanzo, huku “amemtokea” ikitoa Kiswahili cha kawaida kwa ὤφθη katika simulizi za kujidhihirisha baada ya ufufuo.
