  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: sw
  text: Naye akawaambia, “Mambo gani?” Wakamwambia, “Mambo yanayomhusu Yesu Mnazareti[a], ambaye alikuwa[b] mtu, nabii mwenye nguvu katika matendo na maneno mbele za Mungu na watu wote,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yesu wa Nazareti.” Kigiriki: “Yesu Mnazareti.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye akawa mtu, nabii mwenye nguvu.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kihalisi zaidi kuwa “akawa,” lakini hapa “alikuwa” ni Kiswahili cha kawaida zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Mambo gani?
  rationale: Huhifadhi wingi wa kiulizi hicho na kurejelea mambo yaliyotajwa katika muktadha, huku ikiwa Kiswahili cha kawaida.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Mambo yanayomhusu Yesu
  rationale: Huakisi kwa uwazi muundo wa Kigiriki unaomaanisha mambo kuhusu Yesu bila kuongeza dhana ya matukio isiyotajwa moja kwa moja.
- source_word: Ναζαρηνοῦ
  choice: Mnazareti
  rationale: Ni jina la kumtambulisha Yesu kwa uhusiano wake na Nazareti na linaakisi matumizi ya kiwakilishi cha Kigiriki; ‘Yesu wa Nazareti’ ni mbadala wa kawaida zaidi.
- source_word: ἐγένετο
  choice: alikuwa
  rationale: Katika muundo huu wa kumweleza mtu, kitenzi hicho kina maana ya hali au utambulisho uliodhihirika; ‘alikuwa’ ni ya asili kuliko ‘akawa’ na huepuka wazo lisilokusudiwa kwamba alianza kuwa mwanadamu wakati fulani.
- source_word: ἀνὴρ προφήτης
  choice: mtu, nabii
  rationale: 'Huhifadhi nomino zote mbili katika uhusiano wa ufafanuzi: Yesu anaelezwa kuwa mtu, yaani nabii, bila kuondoa ἀνήρ.'
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: mwenye nguvu katika matendo na maneno
  rationale: Hutoa kwa Kiswahili fasaha nguvu iliyodhihirika katika yale aliyofanya na kusema, huku ikihifadhi jozi ya matendo na maneno.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: mbele za Mungu na watu wote
  rationale: Huhifadhi wazo la kuwa mbele ya macho au katika uwepo wa Mungu na watu wote, yaani ushuhuda wa kimungu na wa hadharani.
theological_decisions:
- issue: Kutafsiri ἀνὴρ katika maelezo kumhusu Yesu
  choice: mtu, nabii
  alternative: nabii
  rationale: Maandishi ya Kigiriki yanajumuisha ἀνήρ waziwazi. Kutafsiri ‘mtu, nabii’ huhifadhi maelezo ya wasemaji kuhusu ubinadamu na huduma ya kinabii ya Yesu bila kuyaongeza au kuyapunguza.
- issue: Kufasiri ἐγένετο bila kudokeza kwamba Yesu alianza kuwa mwanadamu
  choice: alikuwa
  alternative: akawa mtu, nabii
  rationale: Ingawa ἐγένετο kwa kawaida inaweza kumaanisha ‘akawa,’ katika sentensi hii ‘alikuwa’ huwasilisha kwa kawaida maelezo ya wasemaji kuhusu Yesu na huepuka maana ya kimetafizikia isiyolazimishwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Naye akawaambia’ na ‘Wakamwambia’ hudumisha mwendo wa simulizi; ‘mbele za Mungu’ huhifadhi mtindo wa kibiblia unaoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
