  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: sw
  text: Hayupo hapa, bali amefufuliwa.[a] Kumbukeni jinsi alivyowaambia alipokuwa bado Galilaya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amefufuka.” Kitenzi cha Kigiriki kiko katika kauli tendwa (“amefufuliwa”); tafsiri nyingi hukitafsiri kwa kitenzi kisicho tendwa ili kueleza tukio la ufufuo.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Hayupo hapa
  rationale: Kigiriki hakitaji wazi mtendaji, lakini muktadha unaonyesha kuwa anayezungumziwa ni Yesu. “Hayupo hapa” ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya mahali ya ὧδε.
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi hiki kinaonyesha utofautishaji wa moja kwa moja kati ya kutokuwapo kwake kaburini na kufufuliwa kwake.
- source_word: ἠγέρθη
  choice: amefufuliwa
  rationale: Hili ni kitenzi cha wakati uliopita katika kauli tendwa. “Amefufuliwa” huhifadhi kauli tendwa na hudokeza tendo la Mungu bila kumtaja moja kwa moja.
- source_word: μνήσθητε
  choice: Kumbukeni
  rationale: Amri ya wingi imetafsiriwa kwa mwito wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: jinsi alivyosema nanyi
  rationale: “Jinsi” huwasilisha ὡς kwa kawaida, na “alisema nanyi” huhifadhi tendo la kusema lililoelekezwa kwa wanawake hao bila kufafanua zaidi yaliyosemwa.
- source_word: ἔτι ὢν ἐν τῇ Γαλιλαίᾳ
  choice: alipokuwa bado Galilaya
  rationale: Kishazi hiki cha wakati ni cha asili katika Kiswahili; “bado” huhifadhi maana ya ἔτι, na Galilaya ni jina la mahali linalotumiwa kwa kawaida.
theological_decisions:
- issue: Ufasiri wa kitenzi cha ufufuo ἠγέρθη
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa ili kubakiza dokezo la tendo la Mungu na kuepuka kubadili kimya kimya muundo kuwa kauli isiyo tendwa. Ufasiri mbadala “amefufuka” unaeleza tukio hilo kwa Kiswahili cha kawaida na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Kauli tendwa “amefufuliwa” imehifadhiwa kwa uaminifu kwa muundo wa Kigiriki, huku tanbihi ikitoa ufasiri wa kawaida “amefufuka.”
