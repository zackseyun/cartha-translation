  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: sw
  text: Je, haikuwa lazima Masihi ateseke mambo haya na kuingia katika utukufu wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta”; hapa limetafsiriwa “Masihi” kwa sababu ya muktadha wa kutimizwa kwa Maandiko.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Je, haikuwa lazima
  rationale: Huanzisha swali linalotarajia jibu la kukubali; muundo huu ni wa kawaida katika Kiswahili na huhifadhi nguvu ya swali la Kigiriki.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea mateso yaliyokuwa yakizungumziwa na kinahifadhi maana ya kuonyesha.
- source_word: ἔδει
  choice: ilikuwa lazima
  rationale: Huonyesha ulazima unaohusiana na mpango wa Mungu na utimilifu wa Maandiko, bila kufafanua zaidi ya matini.
- source_word: παθεῖν
  choice: ateseke kwa
  rationale: Kitenzi πάσχω kinatafsiriwa moja kwa moja kuwa 'kuteseka'; 'kwa mambo haya' ni muundo wa asili wa Kiswahili kwa kurejelea mambo yaliyompata.
- source_word: τὸν χριστὸν
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha mtiwa-mafuta katika muktadha wa utimilifu wa Maandiko; 'Masihi' huhifadhi maana hiyo kwa wasomaji wa Kiswahili.
- source_word: καὶ
  choice: na
  rationale: Huunganisha vitenzi viwili bila kuongeza wazi mpangilio wa wakati ambao Kigiriki hakikusema moja kwa moja.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: kuingia katika utukufu wake
  rationale: Huhifadhi wazo la kuingia katika hali au eneo la utukufu pamoja na kiwakilishi cha umilikaji.
- source_word: δόξαν
  choice: utukufu
  rationale: Hili ndilo neno la kawaida na linalofaa katika muktadha wa kufufuka na kuinuliwa.
- source_word: αὐτοῦ
  choice: wake
  rationale: Hutafsiri kiwakilishi cha umilikaji moja kwa moja bila kukipanua kwa ufafanuzi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo katika muktadha wa utimilifu wa Maandiko, hivyo 'Masihi' huonyesha maana yake badala ya kulitumia kama jina tu.
- issue: Nguvu ya ἔδει
  choice: ilikuwa lazima
  alternative: alipaswa
  rationale: Kauli hii huhifadhi ulazima wa mpango wa Mungu na wa Maandiko bila kuugeuza kuwa wajibu wa kawaida tu au kueleza chanzo chake moja kwa moja ndani ya sentensi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali limeundwa kwa njia ya kawaida inayotarajia jibu la kukubali; istilahi za kitheolojia zimehifadhiwa bila kuingiza msimamo wa dhehebu.
