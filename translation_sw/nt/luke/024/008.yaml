lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi muendelezo rahisi wa simulizi bila kuongeza waziwazi maana ya wakati kama ‘Ndipo’.
- source_word: ἐμνήσθησαν
  choice: wakayakumbuka
  rationale: Kitenzi hiki hapa kina maana tendaji ya kukumbuka; umbo la ‘waka-’ linaunganisha tukio hili kwa kawaida na simulizi lililotangulia.
- source_word: τῶν ῥημάτων
  choice: maneno
  rationale: ῥήματα hurejelea maneno yaliyosemwa au mambo yaliyosemwa. ‘Maneno’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kiwakilishi cha umilikaji kinahifadhi namna ya Kigiriki ya kumrejelea Yesu bila kuweka jina lake moja kwa moja katika mstari.
