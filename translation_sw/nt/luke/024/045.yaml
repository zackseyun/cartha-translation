lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Inaonyesha mfuatano wa matukio katika simulizi kwa Kiswahili cha kawaida na kifupi.
- source_word: διήνοιξεν
  choice: akafungua
  rationale: Inadumisha sitiari ya moja kwa moja ya ‘kufungua’ badala ya kuifafanua kuwa aliwawezesha tu.
- source_word: αὐτῶν τὸν νοῦν
  choice: akili zao
  rationale: νοῦς hapa ni uwezo wa kufikiri na kuelewa; ‘akili zao’ ni usemi wa asili wa Kiswahili na unabaki kuwa kitu kinachofunguliwa katika sitiari hiyo.
- source_word: τοῦ συνιέναι
  choice: ili waelewe
  rationale: Kitenzi-jina chenye kibainishi kinaweza kuonyesha kusudi au matokeo; ‘ili waelewe’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: τὰς γραφάς
  choice: Maandiko
  rationale: Katika muktadha huu neno hilo linarejelea maandiko matakatifu ya Israeli; ‘Maandiko’ ni istilahi iliyozoeleka na yenye hadhi inayofaa.
theological_decisions:
- issue: Namna ya tendo la Yesu la kufungua ufahamu
  choice: Kudumisha maneno ya moja kwa moja ‘akafungua akili zao’ bila kuongeza maelezo ya kimafundisho.
  alternative: Aliwawezesha kuelewa; aliwafafanulia Maandiko.
  rationale: Kigiriki kinasema moja kwa moja kwamba alifungua akili zao wapate kuelewa Maandiko. Tafsiri inadumisha dai hilo bila kulipunguza kuwa ufafanuzi tu wala kuliingiza katika mfumo fulani wa baadaye wa mafundisho.
- issue: Uhusiano wa τοῦ συνιέναι na tendo kuu
  choice: ‘ili waelewe,’ likionyesha kusudi bila kutenganisha kabisa uwezekano wa matokeo.
  alternative: ‘wapate kuelewa’; ‘kwa kuelewa.’
  rationale: Muundo wa Kigiriki unaweza kubeba wazo la kusudi au matokeo. ‘Ili waelewe’ ni wa asili na unaacha uhusiano huo bila maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo ni mfupi na wa kisimulizi; sitiari ya kufungua akili imehifadhiwa.
