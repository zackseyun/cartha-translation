id: LUK.24.52
reference: Luke 24:52
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: sw
  text: Nao, baada ya kumwabudu[a][b], wakarudi Yerusalemu wakiwa na furaha kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati hazina maneno “baada ya kumwabudu.”
    reason: textual_variant
  - marker: b
    text: Au, “baada ya kumsujudia” au “baada ya kuinama mbele yake ili kumpa heshima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa urahisi; “Nao” pia kinaunganisha vizuri na kiwakilishi cha wazi kinachofuata.
- source_word: αὐτοὶ
  choice: wao (iliyowakilishwa katika “Nao” na kiambishi cha kitenzi)
  rationale: Kiswahili hakihitaji kiwakilishi huru hapa; “Nao” pamoja na “wa-” huhifadhi rejeo na msisitizo wa kiasi bila kufanya sentensi kuwa nzito.
- source_word: προσκυνήσαντες αὐτόν
  choice: baada ya kumwabudu
  rationale: Muundo huu unaonyesha kwamba tendo hilo lilitangulia kurudi kwao. Katika muktadha wa Yesu aliyefufuka na kupaa, “kumwabudu” linafaa, huku maana nyingine zinazowezekana zikionyeshwa katika tanbihi.
- source_word: ὑπέστρεψαν
  choice: wakarudi
  rationale: “Wakarudi” ni usemi wa kawaida wa kisimulizi na huonyesha tendo lililofuata.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Baada ya “kurudi,” Kiswahili cha kawaida hakihitaji kihusishi cha mwelekeo kabla ya jina la mahali.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: wakiwa na furaha kubwa
  rationale: Usemi huu ni wa asili katika Kiswahili na huhifadhi nomino “furaha” pamoja na uzito wa kivumishi “kubwa.”
theological_decisions:
- issue: Maana ya προσκυνέω inapomhusu Yesu aliyefufuka
  choice: kumwabudu
  alternative: kumsujudia; kuinama mbele yake ili kumpa heshima
  rationale: Muktadha wa baada ya ufufuo na kupaa unaunga mkono maana ya ibada, lakini neno la Kigiriki linaweza pia kueleza kusujudu au kutoa heshima; uwezekano huo haujafichwa.
- issue: Kutokuwapo kwa προσκυνήσαντες αὐτόν katika baadhi ya hati
  choice: Maneno yamejumuishwa katika matini na kutolewa tanbihi
  alternative: Kuyaacha nje ya matini
  rationale: SBLGNT inayotolewa inajumuisha maneno haya lakini inayatia alama ya kutokuwa na uhakika wa kimatini; kwa hiyo yamehifadhiwa huku ushahidi wa tofauti ukielezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wa kawaida, wa heshima na unaoeleweka kwa wasomaji wa sasa. “Nao” na “wakarudi” huleta mtiririko wa asili bila kuongeza maana isiyokuwapo katika Kigiriki.
