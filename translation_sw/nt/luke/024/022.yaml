lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Lakini pia
  rationale: 'Inahifadhi nguvu ya upinzani na nyongeza: kauli inaunganishwa na kuvunjika moyo kulikotajwa kabla, huku ikiongeza jambo la kushangaza.'
- source_word: γυναῖκές τινες
  choice: baadhi ya wanawake
  rationale: Ni Kiswahili cha kawaida na cha sasa kinachoonyesha idadi isiyotajwa ya wanawake.
- source_word: ἐξ ἡμῶν
  choice: miongoni mwetu
  rationale: Inaonyesha kwamba wanawake hao walikuwa sehemu ya kundi la wanafunzi, si kwamba walitoka tu mahali walipokuwa wasemaji.
- source_word: ἐξέστησαν ἡμᾶς
  choice: walitushangaza
  rationale: Kitenzi kinaweza kuonyesha mshangao mkubwa au kuvurugika. Chaguo hili linadumisha nguvu yake bila kuamua kwamba wasemaji waliamini au walikataa habari hiyo.
- source_word: γενόμεναι
  choice: walifika
  rationale: Pamoja na ὀρθριναὶ na kirai kinachofuata, participio hii inaeleza kuwapo kwa wanawake kaburini mapema; ‘walifika’ huwasilisha kwa Kiswahili cha kawaida wazo la kwenda na kufika huko.
- source_word: ὀρθριναὶ
  choice: asubuhi na mapema
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati wa mapema sana asubuhi bila kulazimisha dakika mahususi ya mapambazuko.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu ἐπί pamoja na hali ya kuelekea inaashiria kufika kwenye kaburi; ‘kaburini’ ni ya kawaida na inafaa kwa mahali Yesu alipokuwa amezikwa.
theological_decisions:
- issue: Nguvu ya ἐξέστησαν katika taarifa kuhusu ufufuo
  choice: walitushangaza
  alternative: walitustaajabisha; walitufadhaisha
  rationale: ‘Walitushangaza’ inaacha wazi kama mshangao huo ulihusisha kustaajabu au kufadhaika, na hivyo inadumisha mvutano wa simulizi bila kuingiza imani au kutokuamini kusikosemwa wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Alama [a] imewekwa baada ya neno inalolifafanua, na [b] baada ya kirai cha wakati. Nukta mkato inadumisha uhusiano wa karibu kati ya mshangao na kufika kwa wanawake kaburini, huku koma ya mwisho ikionyesha kwamba sentensi inaendelea katika mstari unaofuata.
