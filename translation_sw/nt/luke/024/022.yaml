review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative-additive opening, the women’s membership in the group, and the strong surprise expressed by ἐξέστησαν. However, “walifika kaburini” narrows the participial description to arrival, whereas γενόμεναι ὀρθριναὶ ἐπὶ τὸ μνημεῖον more naturally presents their early visit/going to the tomb. The semicolon also makes the participial circumstance read as an independent coordinate assertion.
  naturalness: The wording is otherwise clear, idiomatic Standard East African Swahili. “Walikwenda kaburini mapema asubuhi” is natural and more closely represents the source’s circumstantial participle.
  terminology: “Kaburi/kaburini” is appropriate for μνημεῖον in this burial context. “Walitushangaza” suitably retains the narrative ambiguity of ἐξέστησαν without deciding between amazement and bewilderment.
  issues:
  - severity: low
    issue: “Walifika” is more specific than the Greek participial expression.
    rationale: It focuses on arrival rather than the women’s being/going early at the tomb. “Walikwenda” better retains the motion-to-the-tomb sense reflected by ἐπὶ with the accusative and avoids adding emphasis on the moment of arrival.
  - severity: low
    issue: The semicolon over-separates the circumstantial participial clause.
    rationale: The Greek participle is dependent on the main verb. A comma preserves the close syntactic and narrative connection more effectively.
  revised_text: Lakini pia baadhi ya wanawake miongoni mwetu walitushangaza[a], walikwenda kaburini mapema asubuhi[b],
  revised_footnotes:
  - marker: a
    text: Au, “walitustaajabisha” au “walitufadhaisha.” Kitenzi cha Kigiriki kinaweza kueleza mshangao mkubwa au kuvurugika.
    reason: lexical_alternative
  - marker: b
    text: Au, “alfajiri.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the overly specific “walifika” with “walikwenda,” which more faithfully expresses the women’s early movement to the tomb, and replaces the semicolon with a comma to retain the dependent, circumstantial force of the Greek participle. No theological interpretation is added.
