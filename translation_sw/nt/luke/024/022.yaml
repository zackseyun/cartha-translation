  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: sw
  text: Lakini pia baadhi ya wanawake miongoni mwetu walitushangaza[a], walikwenda kaburini mapema asubuhi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitustaajabisha” au “walitufadhaisha.” Kitenzi cha Kigiriki kinaweza kueleza mshangao mkubwa au kuvurugika.
