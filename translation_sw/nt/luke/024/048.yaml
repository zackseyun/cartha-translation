  text: You are witnesses of these things[a].
translation:
  language: sw
  text: Ninyi ni mashahidi wa mambo haya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ufupi, “Ninyi ni mashahidi wa haya.” Kiwakilishi cha Kigiriki kinarejelea matukio ambayo Yesu ametoka kuyataja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi katika Kigiriki kwa ajili ya msisitizo. “Ninyi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἐστε
  choice: ni
  rationale: Kitenzi cha wakati wa sasa cha ‘kuwa’ kimetafsiriwa kwa kiunganishi cha kawaida cha Kiswahili “ni”.
- source_word: μάρτυρες
  choice: mashahidi
  rationale: Neno hili hapa linamaanisha watu wanaotoa ushuhuda kuhusu yale waliyoona na kusikia; “mashahidi” ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: τούτων
  choice: wa mambo haya
  rationale: Kiwakilishi kionyeshi cha wingi katika hali ya umilikaji kinarejelea matukio ambayo Yesu ametoka kuyataja. “Wa mambo haya” huonyesha uhusiano huo kwa uwazi na kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya jukumu la wanafunzi kama μάρτυρες
  choice: Mstari unawatambulisha wanafunzi kuwa watoa-ushuhuda kuhusu matukio yaliyotajwa karibuni.
  alternative: Kulielewa neno hilo kwa maana ya baadaye ya Mkristo anayekufa kwa ajili ya imani.
  rationale: Katika muktadha wa karibu, Yesu anazungumzia ushuhuda kuhusu mateso yake, kufufuka kwake, na ujumbe utakaotangazwa. Tafsiri haipaswi kuingiza hapa maana ya baadaye ya kufa kwa ajili ya imani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kiwakilishi “Ninyi” kimetumiwa kuhifadhi msisitizo wa ὑμεῖς.
