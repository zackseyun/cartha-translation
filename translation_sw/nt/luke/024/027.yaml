  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: sw
  text: Kisha, akianzia kwa Musa na Manabii wote[b], aliwafafanulia katika Maandiko yote mambo yaliyomhusu yeye mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwatafsiria” au “aliwaelezea kwa kina.” Kitenzi cha Kigiriki kinaweza kumaanisha kufasiri kwa undani.
    reason: lexical_alternative
  - marker: b
    text: “Musa na Manabii wote” inarejelea maandishi ya Maandiko yanayohusishwa na Musa pamoja na vitabu vya kinabii.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: akianzia kwa Musa
  rationale: Kirai hiki kinaonyesha mahali pa kuanzia katika ufafanuzi wa Maandiko. Kiswahili hiki ni cha kawaida na hakimaanishi kwamba Yesu alianza tu na mtu Musa badala ya maandishi yanayohusishwa naye.
- source_word: πάντων τῶν προφητῶν
  choice: Manabii wote
  rationale: Hapa inaelekea kurejelea sehemu ya Maandiko inayojulikana kama Manabii, sambamba na Musa; herufi kubwa na tanbihi vinaonyesha maana hiyo bila kuibana kupita kiasi.
- source_word: διερμήνευσεν
  choice: aliwafafanulia
  rationale: Kitenzi kina maana ya kueleza au kufasiri kwa kina. 'Aliwafafanulia' ni Kiswahili cha asili kinachowasilisha tendo la kuwafungulia maana ya Maandiko.
- source_word: αὐτοῖς
  choice: aliwa-...-ulia
  rationale: Kiambishi cha watendewa katika 'aliwafafanulia' kinawakilisha kwa kawaida dative αὐτοῖς, yaani, aliwafafanulia wao.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: katika Maandiko yote
  rationale: γραφή katika muktadha huu ni Maandiko Matakatifu. Tafsiri inadumisha upana wa πάσαις na lugha ya kikanoni bila kuongeza neno lisilokuwamo moja kwa moja.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: mambo yaliyomhusu yeye mwenyewe
  rationale: Muundo huu mpana unaweza kujumuisha vifungu, mada, au mambo yanayomhusu Yesu. 'Yeye mwenyewe' huhifadhi msisitizo wa kiwakilishi rejeshi bila kuainisha mambo hayo kuwa unabii wa moja kwa moja pekee.
theological_decisions:
- issue: Upeo wa ufafanuzi wa Yesu wa Maandiko
  choice: Yesu alifafanua katika Maandiko yote mambo yaliyomhusu yeye mwenyewe, bila kutaja aina moja tu ya uhusiano huo
  alternative: Kuyatafsiri mambo hayo kuwa unabii wa moja kwa moja wa Kimasihi pekee, au kudai kwamba kila kifungu binafsi kinamhusu moja kwa moja
  rationale: Maneno ya Kigiriki yanaonyesha upeo mpana wa mambo yanayomhusu Yesu katika Maandiko, lakini hayaelezi kama yote ni unabii wa moja kwa moja, vielelezo, au mada nyingine. Tafsiri inadumisha upana na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umehifadhi mwendo wa sentensi ya Kigiriki, huku 'aliwafafanulia' ikitumika kwa uasilia. Alama zote za tanbihi zimewekwa katika maandishi makuu.
