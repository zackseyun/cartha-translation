  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: sw
  text: Ikawa, walipokuwa wakizungumza na kujadiliana[a], Yesu mwenyewe akawakaribia, akawa akisafiri pamoja nao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kubishana” au “kuhojiana”; neno la Kigiriki linaweza kudokeza mjadala mkali zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawakaribia na akaenda pamoja nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kisimulizi inayotambulika katika Kiswahili cha Biblia na inaonyesha mpito wa tukio bila kutumia lugha nzito isiyo ya kawaida.
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: walipokuwa wakizungumza
  rationale: Muundo wa ἐν pamoja na kitenzi-jina una maana ya wakati; 'walipokuwa' huonyesha kitendo kilichokuwa kikiendelea, na 'wakizungumza' ni tafsiri ya kawaida ya ὁμιλέω.
- source_word: συζητεῖν
  choice: kujadiliana
  rationale: Neno hili linaweza kumaanisha kujadiliana kwa kina, kubishana, au kuhojiana; 'kujadiliana' huhifadhi upana huo bila kudokeza uhasama kwa lazima.
- source_word: αὐτὸς Ἰησοῦς
  choice: Yesu mwenyewe
  rationale: '''Mwenyewe'' huhifadhi msisitizo wa αὐτός unaomtambulisha wazi yule aliyewakaribia.'
- source_word: ἐγγίσας
  choice: akawakaribia
  rationale: Hueleza mwendo wa Yesu kuelekea karibu nao kabla au sambamba na kuandamana nao; kiambishi cha yambwa '-wa-' kinaonyesha kwamba aliwakaribia wao.
- source_word: συνεπορεύετο
  choice: akaendelea kutembea pamoja nao
  rationale: Huhifadhi hali endelevu ya kitenzi cha wakati usiotimilifu na maana ya kusafiri kwa kuandamana nao.
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... aka- ... aka-
  rationale: Mfuatano wa Kiswahili wenye viambishi vya simulizi 'aka-' unaonyesha uhusiano na maendeleo ya matendo kwa njia ya asili.
theological_decisions:
- issue: Msisitizo wa utambulisho wa yule aliyewakaribia
  choice: Yesu mwenyewe
  alternative: Yesu
  rationale: Kiwakilishi αὐτός kinasisitiza kwamba aliyewakaribia alikuwa Yesu mwenyewe; msisitizo huu wa kisarufi umehifadhiwa bila kuongeza hitimisho la kimafundisho.
- issue: Uhusiano wa matendo ya kukaribia na kuandamana
  choice: akawakaribia, akaendelea kutembea pamoja nao
  alternative: akakaribia, akatembea pamoja nao
  rationale: Tafsiri hii huhifadhi kwa kadiri ya kawaida tofauti kati ya tendo la kukaribia na mwendo unaoendelea wa kuandamana, bila kulazimisha mpangilio mkali kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. 'Ikawa' inadumisha mtindo wa simulizi bila kuwa ya kizamani kupita kiasi; 'akaendelea kutembea pamoja nao' ni ya kawaida na hudumisha hali endelevu ya συνεπορεύετο. Alama zote za tanbihi zimewekwa katika matini kuu.
