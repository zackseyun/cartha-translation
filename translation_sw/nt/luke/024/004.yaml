  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: sw
  text: Ikawa walipokuwa wamechanganyikiwa kuhusu jambo hilo, tazama, wanaume wawili wakasimama karibu nao, wamevaa mavazi yaliyometameta kama radi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi yaliyong’aa sana.” Neno la Kigiriki linaashiria kumetameta kama radi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni kauli ya kawaida ya Luka ya kuingiza tukio; “ikawa” huihifadhi kwa Kiswahili cha simulizi bila kutumia lugha ya kizamani kupita kiasi.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: walipokuwa wamechanganyikiwa
  rationale: Muundo huu una maana ya wakati, na ἀπορέω huonyesha kutatizika au kukosa kuelewa la kufanya, si kushangaa tu.
- source_word: περὶ τούτου
  choice: kuhusu jambo hilo
  rationale: Hurejelea kwa uwazi jambo lililotangulia na ni usemi wa kawaida wa Kiswahili.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi alama ya hotuba inayovuta fikira kwa tukio jipya la ghafla, bila kuibadili moja kwa moja kuwa kielezi “ghafla.”
- source_word: ἄνδρες δύο
  choice: wanaume wawili
  rationale: ἀνήρ hapa huwasilisha wahusika kama wanaume; utambulisho wao kama wajumbe wa mbinguni haujaingizwa moja kwa moja katika mstari huu.
- source_word: ἐπέστησαν αὐταῖς
  choice: wakasimama karibu nao
  rationale: Huhifadhi maana ya kuwapo au kusimama kando yao, huku muktadha na “tazama” vikidokeza ujio wa kushtukiza.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: wamevaa mavazi yaliyometameta kama radi
  rationale: Huwasilisha mavazi pamoja na picha halisi ya mng’ao wa umeme/radi kwa lugha inayoeleweka na yenye hadhi.
theological_decisions:
- issue: Utambulisho wa wale watu wawili
  choice: wanaume wawili
  alternative: malaika wawili
  rationale: Mstari wenyewe unawaita ἄνδρες δύο, “wanaume wawili.” Ingawa muktadha unaonyesha kuwa ni wajumbe wa mbinguni, tafsiri haileti utambulisho huo kutoka mistari mingine.
- issue: Nguvu ya picha ya ἀστραπτούσῃ
  choice: yaliyometameta kama radi
  alternative: yenye kung’aa sana
  rationale: Picha ya radi/umeme imo katika neno la Kigiriki na inafaa kuhifadhiwa badala ya kuifanya tu kuwa mng’ao wa jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Ikawa” na “tazama” zinahifadhi mtindo wa simulizi wa Luka; “wamechanganyikiwa” ni ya kawaida na huonyesha hali ya kutatizika. Alama [a] imewekwa baada ya kirai kinachohusika.
