  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: sw
  text: Ikawa kwamba, alipokuwa akiwabariki, aliondoka kwao, naye akachukuliwa kwenda mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina maneno “naye akachukuliwa kwenda mbinguni.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi ya Luka; “Ikawa” inaashiria kutokea kwa tukio kwa Kiswahili fasaha bila kutumia lugha nzito.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: alipokuwa akiwabariki
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati wa kuondoka kwake; “alipokuwa akiwabariki” huwasilisha ulinganifu huo wa wakati kwa kawaida.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: aliondoka kati yao
  rationale: Kitenzi kinaonyesha kutengana au kuondoka. Kauli hii ni ya kawaida na inaweka wazi kwamba Yesu aliacha kuwa pamoja nao.
- source_word: ἀνεφέρετο
  choice: akachukuliwa juu
  rationale: Umbo la kitenzi lina maana ya kupelekwa juu na linadumisha hali ya kutendwa bila kutaja wazi mtendaji.
- source_word: εἰς τὸν οὐρανόν
  choice: kwenda mbinguni
  rationale: Katika muktadha huu οὐρανός ni makao ya mbinguni, si anga inayoonekana tu; “kwenda mbinguni” ni usemi wa kawaida na unaoeleweka.
theological_decisions:
- issue: 'Kifungu chenye tofauti ya maandishi: καὶ ἀνεφέρετο εἰς τὸν οὐρανόν'
  choice: Kimejumuishwa katika matini kuu, huku tofauti ya hati ikibainishwa katika tanbihi.
  alternative: Kukiacha kifungu “naye akachukuliwa juu kwenda mbinguni.”
  rationale: SBLGNT inakiweka kifungu katika mabano kuonyesha kutokuwa na uhakika wa kimatini. Kwa kuwa kipo katika matini chanzo iliyotolewa, kimetafsiriwa, lakini ushahidi wa kukosekana kwake katika baadhi ya hati umehifadhiwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi ni mwepesi kueleweka; “mbinguni” limetumiwa kwa maana ya heaven, na hali ya kutendwa katika ἀνεφέρετο imehifadhiwa.
