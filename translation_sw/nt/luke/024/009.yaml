  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: sw
  text: Wanawake hao waliporudi kutoka kaburini, waliwapa wale kumi na mmoja na wengine wote habari za mambo hayo yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: waliporudi
  rationale: Muundo wa wakati wenye kiunganishi unaonyesha tendo la kurudi lililotangulia tendo kuu la kueleza, kwa Kiswahili cha kawaida na cha asili.
- source_word: μνημείου
  choice: kaburini
  rationale: Katika muktadha wa kuzikwa na kufufuka kwa Yesu, ‘kaburi’ ndilo neno la kawaida na sahihi kwa mahali alipowekwa.
- source_word: ἀπήγγειλαν
  choice: waliwaeleza
  rationale: Kitenzi hiki kina maana ya kupeleka taarifa au kusimulia jambo. ‘Waliwaeleza’ kinafaa kwa taarifa iliyotolewa kwa kundi maalumu bila kudokeza tangazo la hadhara.
- source_word: ταῦτα πάντα
  choice: mambo hayo yote
  rationale: Huhifadhi nguvu ya kiashiria na maana jumuishi ya πάντα kwa mtiririko wa kawaida wa Kiswahili, kikirejelea mambo yaliyotangulia kusimuliwa.
- source_word: τοῖς ἕνδεκα
  choice: wale kumi na mmoja
  rationale: Huhifadhi jina la kundi lililotumiwa katika Kigiriki bila kuongeza neno ‘mitume,’ ambalo halipo katika mstari huu.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: wengine wote
  rationale: Hutofautisha wale kumi na mmoja na watu wengine wote waliokuwa pamoja nao, bila kubainisha zaidi ya maandishi.
theological_decisions:
- issue: Mhusika wa kauli ya kike ya wingi
  choice: Wanawake hao
  alternative: Wao
  rationale: Kigiriki kinabainisha kwa sarufi kuwa watendaji ni wanawake waliotajwa katika muktadha uliotangulia. Kwa kuwa Kiswahili hakibainishi jinsia katika kiwakilishi cha wingi, kutaja ‘Wanawake hao’ kunawasilisha habari hiyo ya kisarufi bila kubadili mhusika.
- issue: Jina la kundi la kitume
  choice: wale kumi na mmoja
  alternative: wale mitume kumi na mmoja
  rationale: Maandishi ya Kigiriki yanasema tu ‘wale kumi na mmoja.’ Kutotaja ‘mitume’ huepuka kuongeza nomino isiyokuwamo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi inadumisha mlolongo wa kurudi kisha kutoa taarifa, huku ikibainisha wanawake kwa sababu taarifa hiyo imekodishwa katika sarufi ya Kigiriki lakini si katika viwakilishi vya Kiswahili.
