lexical_decisions:
- source_word: καὶ
  choice: Baada ya
  rationale: Kiunganishi kinaunganishwa kwa kawaida na kirai shirikishi kinachofuata ili kueleza mfuatano wa matendo bila kuongeza maana isiyokuwapo.
- source_word: τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai shirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; “hayo” hurejelea maneno yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἔδειξεν
  choice: akawaonyesha
  rationale: Kitenzi hiki humaanisha kufanya kitu kionekane; umbo lenye kiambishi cha yambwa ni la kawaida na wazi katika Kiswahili.
- source_word: αὐτοῖς
  choice: -wa-
  rationale: Yambwa “wao” imewakilishwa kwa kawaida ndani ya kitenzi “akawaonyesha.”
- source_word: τὰς χεῖρας
  choice: mikono yake
  rationale: Ingawa Kigiriki kina kibainishi, Kiswahili hutumia kimilikishi kwa kawaida kuonyesha kuwa ni mikono ya Yesu mwenyewe.
- source_word: τοὺς πόδας
  choice: miguu yake
  rationale: “Miguu” ni sawia ya moja kwa moja katika muktadha wa mwili; kimilikishi cha pamoja “yake” kinaeleweka kwa viungo vyote viwili.
theological_decisions:
- issue: Hali ya kiuhakiki wa matini ya sentensi nzima
  choice: Imejumuishwa katika matini kuu pamoja na tanbihi ya tofauti ya miswada
  alternative: Kuiacha sentensi nzima
  rationale: SBLGNT imeweka mstari mzima katika mabano, ikionyesha shaka kubwa ya kimatini. Kwa kuwa maneno yametolewa katika matini chanzo, yametafsiriwa huku tofauti hiyo muhimu ikielezwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, na tanbihi inalinda uwazi kuhusu tofauti ya matini.
