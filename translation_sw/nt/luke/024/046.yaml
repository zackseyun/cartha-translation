  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: sw
  text: 'Naye akawaambia, “Hivi ndivyo ilivyoandikwa: Masihi[a] atateseka na kufufuka kutoka kwa wafu[b] siku ya tatu,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Cheo cha Kigiriki Χριστός kimetafsiriwa “Masihi” hapa kwa sababu kinatumika kama cheo, si kama jina.
    reason: alternative_reading
  - marker: b
    text: Au kwa tafsiri halisi zaidi, “kutoka miongoni mwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Kauli timilifu tendwa inatumika kama tamko la Maandiko kuhusu jambo ambalo limeandikwa na bado lina mamlaka. “Ilivyoandikwa” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: παθεῖν
  choice: atateseka
  rationale: Kitenzi-jina hiki kinaeleza yaliyomo katika Maandiko. “Atateseka” huhifadhi hali ya kutenda ya Kigiriki bila kuongeza wazo la lazima ambalo halijaelezwa wazi katika kishazi hiki.
- source_word: τὸν χριστόν
  choice: Masihi
  rationale: Neno Χριστός lenye kibainishi hapa ni cheo cha mtiwa-mafuta aliyeahidiwa, si jina tu; “Masihi” huhifadhi mazingira ya Kiyahudi na ya kimaandiko.
- source_word: ἀναστῆναι
  choice: kufufuka
  rationale: Kitenzi-jina hiki ni cha hali ya kutenda na hapa kina maana ya kuinuka tena kutoka kwa wafu. “Kufufuka” ni usemi wa kawaida wa Kiswahili na hakibadili umbo hilo kuwa tendwa.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huu ni usemi wa kawaida kuhusu ufufuo. “Kutoka kwa wafu” ni wazi na wa asili kwa Kiswahili, huku tafsiri halisi zaidi ikiwekwa katika tanbihi.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Hii ni dativu ya wakati; “siku ya tatu” ni namna ya kawaida ya kuieleza kwa Kiswahili.
- source_word: οὕτως
  choice: Hivi ndivyo
  rationale: Usemi huu huhifadhi maana ya namna au yaliyomo katika kile kilichoandikwa na una sauti yenye hadhi inayofaa kwa utangulizi wa Maandiko.
- source_word: ὅτι
  choice: ':'
  rationale: Alama ya nukta mbili baada ya “ilivyoandikwa” hutambulisha kwa kawaida yaliyomo katika maandishi hayo kwa Kiswahili, bila kuhitaji “kwamba” isiyo laini baada ya “Hivi ndivyo.”
theological_decisions:
- issue: Tafsiri ya Χριστός katika muhtasari wa mateso na ufufuo
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo hapa. “Masihi” huhifadhi dhana ya mtiwa-mafuta aliyeahidiwa katika Maandiko; tafsiri iliyozoeleka ya “Kristo” imetajwa katika tanbihi.
- issue: Hali ya kitenzi ἀναστῆναι kinachohusu ufufuo
  choice: kufufuka kutoka kwa wafu
  alternative: kufufuliwa kutoka kwa wafu
  rationale: Umbo la Kigiriki ni la kutenda, hivyo tafsiri kuu hailibadili kuwa la kutendwa. Agano Jipya linaweza kusema Yesu alifufuka au alifufuliwa, lakini hapa umbo lililopo linapaswa kuhifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Muundo “Hivi ndivyo ilivyoandikwa” huhifadhi sauti ya kimaandiko bila kuwa wa kizamani. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
