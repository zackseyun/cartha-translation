  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: sw
  text: Na tazama, siku hiyo hiyo wawili kati yao walikuwa wakienda kwenye kijiji kilichokuwa umbali wa stadia sitini[a] kutoka Yerusalemu, kilichoitwa Emau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadion ilikuwa kipimo cha kale cha umbali; stadia sitini ni karibu kilomita 11.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiashiria cha kisimulizi cha Luka kinachovuta usikivu, kwa lugha yenye hadhi na inayoeleweka.
- source_word: δύο ἐξ αὐτῶν
  choice: wawili kati yao
  rationale: Inaonyesha kwa kawaida maana ya kwamba watu hao wawili walitoka katika kundi lililotajwa katika muktadha, bila kulifafanua zaidi ya maandishi.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: siku iyo hiyo
  rationale: Inahifadhi msisitizo wa Kigiriki kwamba safari hiyo ilitokea siku ileile.
- source_word: ἦσαν πορευόμενοι
  choice: walikuwa wakienda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita, sawasawa na muundo wa kitenzi cha Kigiriki.
- source_word: εἰς κώμην
  choice: kwenye kijiji
  rationale: Neno “kijiji” linawakilisha κώμη kwa usahihi, na “kwenye” ni usemi wa kawaida wa Kiswahili unaoonyesha walikokuwa wakielekea.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: kilichokuwa umbali wa stadia sitini kutoka Yerusalemu
  rationale: Inahifadhi kipimo cha kale cha maandishi ya chanzo; makadirio kwa kipimo cha kisasa yametolewa katika tanbihi.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: kilichoitwa Emau
  rationale: Ni tafsiri ya kawaida na wazi ya Kiswahili ya kishazi kinachotaja jina la kijiji, bila kuongeza habari.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wazi na wenye hadhi. “Na tazama” imeachwa ili kuhifadhi nguvu ya kisimulizi, huku kipimo cha kale “stadia” kikifafanuliwa katika tanbihi.
