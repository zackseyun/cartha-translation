  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: sw
  text: Naye akawaambia, “Enyi wasiofahamu, wenye mioyo mizito kuamini yote ambayo manabii wamesema!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Naye akawaambia
  rationale: Hutoa utangulizi wa masimulizi kwa Kiswahili cha kawaida; ‘naye’ huwakilisha καὶ αὐτός bila kuongeza msisitizo usio wa lazima.
- source_word: Ὦ ἀνόητοι
  choice: Enyi msio na ufahamu
  rationale: ‘Enyi’ huhifadhi nguvu ya mwito wa Ὦ, na ‘msio na ufahamu’ huonyesha upungufu wa kuelewa unaokusudiwa na ἀνόητοι bila kuufanya kuwa hukumu ya upotovu wa kimaadili pekee.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: mlio wazito wa moyo
  rationale: Huhifadhi taswira ya moyo kama utu wa ndani na wazo la uzito au uchelewaji, badala ya kuifupisha kuwa tatizo la akili tu.
- source_word: τοῦ πιστεύειν
  choice: kuamini
  rationale: Infinitivu inaeleza jambo ambalo mioyo yao ilikuwa mizito kulifanya; ‘kuamini’ ni usemi wa asili na sahihi.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: yote ambayo
  rationale: Huhifadhi upeo kamili wa πᾶσιν kwa Kiswahili kinachoeleweka vizuri.
- source_word: ἐλάλησαν
  choice: wamesema
  rationale: Wakati timilifu wa Kiswahili huonyesha kwamba manabii walikwisha kusema na ushuhuda wao bado una umuhimu katika muktadha huu.
- source_word: οἱ προφῆται
  choice: manabii
  rationale: Ni istilahi ya kawaida na sahihi kwa mashahidi wa kinabii wanaorejelewa.
theological_decisions:
- issue: Asili ya karipio la Yesu
  choice: Karipio linahusu ukosefu wa ufahamu pamoja na uzito wa utu wa ndani katika kuamini ushuhuda wote wa manabii.
  alternative: Kulieleza kama hukumu ya kimaadili pekee au kama tatizo la kiakili pekee.
  rationale: Muungano wa ἀνόητοι, βραδεῖς τῇ καρδίᾳ na πιστεύειν unahusisha ufahamu na imani. Tafsiri inadumisha mvutano huo kwa kutaja ‘ufahamu,’ ‘moyo,’ na ‘kuamini.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘wazito wa moyo’ umehifadhi nahau ya Kigiriki na maana ya utu wa ndani; hakuna tanbihi inayohitajika kwa mstari huu.
