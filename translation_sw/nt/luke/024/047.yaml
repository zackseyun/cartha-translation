  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: sw
  text: na kwamba toba kwa ajili ya msamaha wa dhambi[a] ihubiriwe kwa jina lake kwa mataifa yote[b], kuanzia Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “toba na msamaha wa dhambi”; Kigiriki kinaweza kueleweka kuwa haya ni mambo mawili yanayohubiriwa.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa watu wa mataifa yote.” Neno la Kigiriki linaweza pia kumaanisha “watu wasio Wayahudi” katika baadhi ya miktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: ihubiriwe
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kutangazwa kwa ujumbe hadharani; “ihubiriwe” ni Kiswahili cha kawaida na chenye heshima kinachofaa muktadha huu.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: katika jina lake
  rationale: Kauli hii inadumisha wazo la mamlaka na msingi unaopatikana katika nafsi ya Yesu, kwa usemi wa kawaida wa Kiswahili.
- source_word: μετάνοιαν
  choice: toba
  rationale: “Toba” hueleza kugeuka kwa ndani na mwenendo, si kubadili mawazo tu, na ndiyo istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: kwa ajili ya msamaha wa dhambi
  rationale: Uamuzi huu unaonyesha uhusiano wa karibu kati ya toba na msamaha bila kufafanua zaidi ya maandishi; uwezekano wa kusoma nomino hizo kama vipengele viwili unahifadhiwa katika tanbihi.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: kwa mataifa yote
  rationale: “Mataifa yote” huhifadhi upeo wa ulimwengu mzima wa agizo na haibani maana kuwa watu wasio Wayahudi peke yao.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: kuanzia Yerusalemu
  rationale: Kauli hii inaonyesha kwa kawaida na kwa usahihi mahali ambapo utangazaji ungeanzia.
theological_decisions:
- issue: Uhusiano kati ya toba na msamaha katika ujumbe unaohubiriwa
  choice: “toba kwa ajili ya msamaha wa dhambi”
  alternative: “toba na msamaha wa dhambi” kama vipengele viwili vinavyoratibiwa
  rationale: Kigiriki kinaruhusu uhusiano wa karibu kati ya toba na msamaha, lakini pia kinaweza kueleweka kuwa vinatajwa kama mambo mawili. Tafsiri kuu inaonyesha uhusiano huo bila kuweka mpangilio kamili wa wokovu, na tanbihi huhifadhi uwezekano mwingine.
- issue: Maana ya ἔθνη
  choice: “mataifa yote”
  alternative: “watu wa mataifa yote” au “watu wasio Wayahudi wote”
  rationale: Muktadha unaonyesha upeo wa ujumbe kwa ulimwengu mzima. “Mataifa” huhifadhi maana pana na haiifanyi sentensi ihusu wasio Wayahudi pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama [b][a] unafuata sehemu husika za maandishi: [b] baada ya “mataifa yote” na [a] baada ya ujumbe mzima unaoweza kufasiriwa kwa namna mbili.'
