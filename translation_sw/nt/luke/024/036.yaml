lexical_decisions:
- source_word: Ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi cha kuonyesha cha wingi wa kati kinarejelea mambo yaliyokuwa yakizungumziwa; “mambo hayo” huhifadhi wingi na kiungo cha mazungumzo yaliyotangulia.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Walipokuwa wakisema
  rationale: Muundo wa genitivi huru wenye kitenzi-jina cha wakati wa sasa unaonyesha tendo la kusema lililokuwa likiendelea wakati tukio jingine lilipotokea. Muundo huu wa Kiswahili unaonyesha uambatano huo kwa kawaida.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Kiwakilishi hiki kimesisitizwa katika Kigiriki; “yeye mwenyewe” huhifadhi msisitizo wa kuwapo kwake binafsi.
- source_word: ἔστη
  choice: akasimama
  rationale: Aoristi ya ἵστημι inaeleza kuchukua nafasi ya kusimama. “Akasimama” ni tafsiri ya moja kwa moja bila kuongeza wazo la kuonekana au kuja ambalo halijasemwa wazi.
- source_word: ἐν μέσῳ αὐτῶν
  choice: katikati yao
  rationale: Kirai hiki kinaonyesha kuwa alisimama ndani ya kundi, miongoni mwao. “Katikati yao” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi picha ya mahali.
theological_decisions:
- issue: Iwapo maneno marefu ya mapokeo ya Bizanti, “akawaambia, ‘Amani iwe kwenu,’” yaingizwe katika matini kuu
  choice: Yameachwa nje ya matini kuu kwa kufuata SBLGNT iliyotolewa.
  alternative: 'Kuingiza: “akawaambia, ‘Amani iwe kwenu.’”'
  rationale: Matini ya Kigiriki iliyotolewa inaishia kwa “katikati yao” na haina salamu hiyo. Tofauti hiyo muhimu ya hati imehifadhiwa katika tanbihi badala ya kulandanisha kifungu na mapokeo ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Walipokuwa wakisema” ni ya asili zaidi kuliko muundo mzito wa neno kwa neno, huku “yeye mwenyewe” na “katikati yao” zikihifadhi msisitizo na taswira ya Kigiriki.
