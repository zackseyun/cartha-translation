  text: While they were saying these things[a], he himself stood among them.
translation:
  language: sw
  text: Walipokuwa wakisema mambo hayo, yeye mwenyewe akasimama katikati yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati huongeza, “akawaambia, ‘Amani iwe kwenu.’”
