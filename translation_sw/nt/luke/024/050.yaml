  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: sw
  text: Kisha akawatoa nje hadi karibu na Bethania[a]; akainua mikono yake, akawabariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka Bethania” au “kuelekea Bethania”; usemi wa Kigiriki una maana pana kidogo, neno kwa neno, “mpaka kuelekea Bethania.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: akawaongoza
  rationale: Kitenzi ἐξάγω kina maana ya kuwaongoza au kuwapeleka watu nje. Katika muktadha huu, “akawaongoza” ni Kiswahili cha kawaida na huhifadhi wazo la Yesu kwenda mbele akiwaelekeza wanafunzi.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ kinaendeleza simulizi bila kuonyesha upinzani mkubwa; “Kisha” huonyesha hatua inayofuata kwa ufasaha.
- source_word: ἕως πρὸς Βηθανίαν
  choice: mpaka karibu na Bethania
  rationale: Muungano ἕως πρός unaonyesha mwendo uliofika upande au eneo la Bethania. Tafsiri hii huhifadhi kutokuwa bayana kama walifika ndani ya kijiji chenyewe, huku tanbihi ikionyesha uwezekano mwingine.
- source_word: Βηθανίαν
  choice: Bethania
  rationale: Hili ni umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: ἐπάρας
  choice: akainua
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kitendo kilichotangulia au kuambatana kwa karibu na kubariki. Mfuatano “akainua ... akawabariki” ni wa asili katika Kiswahili.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: mikono yake
  rationale: Huhifadhi wingi wa “mikono” na ishara ya mwili iliyotajwa katika chanzo.
- source_word: εὐλόγησεν
  choice: akawabariki
  rationale: εὐλογέω hapa ni kutenda au kutamka baraka juu ya wanafunzi. “Akawabariki” ni tafsiri ya moja kwa moja na haiongezi mfumo maalumu wa kiliturujia.
- source_word: αὐτούς
  choice: -wa- katika akawabariki
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea wanafunzi kwa njia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Asili ya tendo la Yesu la kuwabariki wanafunzi
  choice: akawabariki
  alternative: akatamka baraka juu yao
  rationale: Usemi sahili huhifadhi tendo lenyewe bila kulipanua kuwa kaida maalumu ya kikuhani au kulipunguza kuwa kuwatakia mema tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa vitenzi mfululizo unaendana na simulizi la Kiswahili, na tanbihi huhifadhi utata wa ἕως πρός.
