  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: sw
  text: Ikawa, alipoketi kula pamoja nao[a], alichukua mkate, akabariki, kisha akaumega na kuanza kuwapa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “alipoegama kula pamoja nao.” Wakati huo watu walikuwa na desturi ya kuegama mezani walipokula.
    reason: cultural_note
  - marker: b
    text: Au, “akaendelea kuwapa.” Wakati wa kitenzi cha Kigiriki unaweza kusisitiza tendo lililokuwa likiendelea; “kuanza kuwapa” huonyesha mwanzo wa tendo hilo katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Huhifadhi fomula ya Luka ya kuendeleza simulizi bila kutumia maelezo marefu au kuiondoa.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: alipoketi kula pamoja nao
  rationale: Muundo wenye ἐν na kitenzi-jina una maana ya wakati, ‘alipo/wakati.’ Ingawa κατακλίνω hasa huonyesha kuegama wakati wa kula, ‘kuketi kula’ ni Kiswahili cha kawaida na kinachoeleweka; desturi ya kale imefafanuliwa katika tanbihi.
- source_word: λαβὼν τὸν ἄρτον
  choice: alichukua mkate
  rationale: Kishirikishi kimetafsiriwa kwa kitenzi kamili ili simulizi lisomeke kwa ufasaha, huku mpangilio wa matendo ukihifadhiwa.
- source_word: εὐλόγησεν
  choice: akabariki
  rationale: Huhifadhi maana ya kutamka baraka katika muktadha wa chakula bila kubainisha kimya kimya ikiwa aliyebarikiwa ni Mungu au mkate, kwa kuwa kiarifu cha Kigiriki hakitaji mtendewa waziwazi hapa.
- source_word: κλάσας
  choice: kisha akaumega
  rationale: Kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia utoaji; ‘kisha’ huweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: ἐπεδίδου
  choice: na kuanza kuwapa
  rationale: Wakati usiotimilika wa Kigiriki unaweza kuonyesha tendo linaloendelea au mwanzo wake. Tafsiri hii inaonyesha mwanzo wa kugawa mkate katika hatua hii ya simulizi, huku uwezekano mwingine ukitajwa katika tanbihi.
theological_decisions:
- issue: Uwezekano wa matendo haya kueleweka kuwa na maana ya Meza ya Bwana au sakramenti
  choice: Kutumia lugha ya kawaida ya mlo bila kuongeza tafsiri ya kisakramenti
  alternative: Kutumia maneno yanayohusisha tukio hili moja kwa moja na Meza ya Bwana
  rationale: Mfuatano wa kuchukua, kubariki, kumega na kuwapa unaweza kukumbusha milo mingine ya Yesu, lakini mstari wenyewe hautambui tukio hili waziwazi kuwa ibada ya sakramenti. Tafsiri huhifadhi matendo yenyewe bila kuongeza msimamo wa dhehebu.
- issue: Mtendewa wa εὐλόγησεν
  choice: Kuacha ‘akabariki’ bila mtendewa aliyetajwa wazi
  alternative: ‘akaubariki mkate’ au ‘akambariki Mungu’
  rationale: Kigiriki hakitaji mtendewa wazi katika kifungu hiki. Kuongeza ‘mkate’ au ‘Mungu’ kungeamua jambo ambalo sarufi na muktadha huliruhusu libaki kwa kiasi fulani wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ikawa’ huhifadhi mtindo wa simulizi wa Luka; ‘alipoketi kula’ ni ya asili zaidi kuliko ‘alipoegama mezani,’ huku tanbihi ikihifadhi picha ya desturi ya karne ya kwanza.
