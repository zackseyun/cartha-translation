review_pass:
  verdict: revise
  source_fidelity: Draft follows the Greek sequence and preserves the distinction between finding the tomb as the women reported and not seeing Jesus. The fronted Greek object pronoun αὐτόν need not be represented by an independent Swahili pronoun, since the object marker in hawakumwona already retains the reference.
  naturalness: The clause “lakini yeye hawakumwona” is understandable but marked and less natural in current Standard East African Swahili. “Lakini hawakumwona” is idiomatic and unambiguous in context. Recasting “mambo yakiwa” as “mambo yalikuwa” is also smoother narrative Swahili.
  terminology: Kaburini is an established, natural rendering of μνημεῖον in this resurrection context. No theological terminology or names require adjustment.
  issues:
  - severity: low
    issue: Marked object-pronoun order in the final clause
    rationale: “Lakini yeye hawakumwona” awkwardly fronts an independent object pronoun. The verbal object marker in “hawakumwona” conveys “him” naturally and adequately.
  - severity: low
    issue: Less fluent expression of the reported condition
    rationale: “Wakakuta mambo yakiwa” is comprehensible, but “wakakuta mambo yalikuwa” is more natural in a past narrative while preserving the Greek's unexpressed details.
  revised_text: Na baadhi ya wale waliokuwa pamoja nasi walikwenda kaburini, wakakuta mambo yalikuwa kama vile wanawake walivyosema, lakini hawakumwona.
