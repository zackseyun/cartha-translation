  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: sw
  text: Na baadhi ya wale waliokuwa pamoja nasi walikwenda kaburini, wakakuta mambo yalikuwa kama vile wanawake walivyosema, lakini hawakumwona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: wakaenda
  rationale: Kitenzi hiki kinasimulia kwenda kwao mahali palipotajwa; “wakaenda” ni cha kawaida na hakisisitizi kuondoka kuliko kufika.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: baadhi ya wale waliokuwa pamoja nasi
  rationale: Huhifadhi wazo la sehemu ya kundi lililokuwa pamoja na wasemaji bila kufasiri zaidi kuwa ni marafiki au wanafunzi.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni mahali Yesu alipozikwa; “kaburini” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: εὗρον
  choice: wakakuta
  rationale: “Wakakuta” huonyesha kwa kawaida kwamba walipofika waliona hali iliyokuwapo, sawasawa na maana ya kitenzi katika simulizi.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: mambo yakiwa kama vile wanawake walivyosema
  rationale: Kiswahili kinahitaji kijalizo kinachoeleweka baada ya “wakakuta”; “mambo yakiwa” kinaeleza hali bila kuainisha maelezo ambayo Kigiriki hakuyataji.
- source_word: αὐτὸν
  choice: yeye
  rationale: Kiwakilishi kinadumishwa badala ya kutaja Yesu waziwazi, hivyo kuhifadhi mshikamano wa Kigiriki.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha utofauti kati ya kuthibitishwa kwa taarifa ya wanawake na kutomwona Yesu.
- source_word: οὐκ εἶδον
  choice: hawakumwona
  rationale: Hutafsiri ὁράω kama “kuona,” si “kukuta,” na kudumisha kundi lilelile kuwa kiima.
theological_decisions:
- issue: Maneno ya simulizi la ufufuo
  choice: Waliokwenda kaburini walikuta hali ikilingana na taarifa ya wanawake, lakini hawakumwona Yesu mwenyewe.
  alternative: Kueleza kwa undani walichokuta au kuoanisha taarifa hii na masimulizi mengine.
  rationale: Tafsiri inadumisha tofauti iliyomo katika Kigiriki kati ya kukuta hali iliyoripotiwa na kutomwona Yesu, bila kuongeza maelezo kutoka masimulizi sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo “wakaenda ... wakakuta” unasomeka kwa kawaida katika simulizi. Hakuna tanbihi inayohitajika.
