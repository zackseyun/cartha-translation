  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: sw
  text: Walipoingiwa na hofu na kuinamisha nyuso zao hadi ardhini, wale watu wakawaambia, “Kwa nini mnamtafuta aliye hai miongoni mwa wafu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: walipokuwa wameingiwa na hofu
  rationale: Muundo huu unaonyesha hali iliyotokea kabla au pamoja na tendo kuu. ‘Wameingiwa na hofu’ ni Kiswahili cha kawaida chenye nguvu inayofaa bila kuzidisha maana.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: kuinamisha nyuso zao mpaka chini
  rationale: Huhifadhi taswira halisi ya kuinamisha nyuso kuelekea ardhini, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: εἶπαν πρὸς αὐτάς
  choice: wale watu wakawaambia
  rationale: Kiswahili kinahitaji urejeo ulio wazi zaidi ili kuepuka mkanganyiko wa viwakilishi; ‘wale watu’ huwarejelea wanaume wawili waliotajwa katika muktadha wa mstari uliotangulia bila kuongeza utambulisho wa kimalaika.
- source_word: Τί ζητεῖτε
  choice: Kwa nini mnamtafuta
  rationale: Ingawa τί kwa msingi ni ‘nini,’ katika swali hili inaleta changamoto kuhusu sababu ya kumtafuta mahali hapo; ‘kwa nini’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: τὸν ζῶντα
  choice: aliye hai
  rationale: Kirai cha Kigiriki ni kishirikishi chenye matumizi ya nomino, cha umoja na kinachomhusu mtu. ‘Aliye hai’ huhifadhi utofauti wake na wafu bila kuongeza maelezo.
- source_word: μετὰ τῶν νεκρῶν
  choice: miongoni mwa wafu
  rationale: μετά pamoja na jenitivi hapa ina maana ya kuwa pamoja na au katikati ya wafu; ‘miongoni mwa wafu’ ndiyo usemi wa kawaida unaofaa muktadha.
theological_decisions:
- issue: Dokezo la ufufuo katika τὸν ζῶντα
  choice: aliye hai
  alternative: yule aliye hai
  rationale: Tafsiri inamwonyesha Yesu kuwa hai tofauti na wafu na hivyo kuhifadhi nguvu ya muktadha wa ufufuo, bila kuongeza maelezo yasiyomo katika Kigiriki.
- issue: Utambulisho wa wasemaji
  choice: wale watu
  alternative: wakawaambia
  rationale: Muktadha wa karibu unawataja kama wanaume wawili; tafsiri haijawaita malaika, hivyo haijaingiza ufafanuzi wa kitheolojia ambao mstari huu wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa matukio umewekwa kwa mtiririko wa asili wa Kiswahili, huku swali kuu na utofauti kati ya aliye hai na wafu vikihifadhiwa.
