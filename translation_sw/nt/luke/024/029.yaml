  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muunganisho “Naye” unawakilisha καὶ kwa mtiririko wa kawaida wa simulizi.
