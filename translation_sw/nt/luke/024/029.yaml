  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: sw
  text: Lakini wakamsihi sana[a], wakisema, “Kaa pamoja nasi, kwa maana jioni inakaribia, na mchana tayari umeelekea kwisha[b].” Naye akaingia ili akae pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamsisitiza sana.”
    reason: lexical_alternative
  - marker: b
    text: Au “siku tayari imekwenda sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: wakamsihi sana
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kusihi kwa nguvu na kwa msisitizo, si kumlazimisha kimwili.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Kaa pamoja nasi
  rationale: Ombi hili linamhimiza abaki na kukaa nao; usemi huu ni wa kawaida na unaeleweka katika muktadha wa ukarimu.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: kwa maana jioni inakaribia
  rationale: Huhifadhi maana ya kuelekea wakati wa jioni bila kusema kwamba jioni imefika kabisa.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: mchana tayari umeelekea kwisha
  rationale: Huhifadhi taswira ya wakati wa mchana uliopungua na kuelekea mwisho kwa Kiswahili cha asili.
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuingia mahali palipodokezwa na simulizi.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: ili akae pamoja nao
  rationale: Muundo wa infinitivu unaonyesha kusudi, na tafsiri hii inadumisha uhusiano wake na ombi la awali.
