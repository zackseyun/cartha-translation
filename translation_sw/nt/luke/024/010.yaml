id: LUK.24.10
reference: Luke 24:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: sw
  text: Wanawake hao walikuwa Maria Magdalene, Yoana, Maria mama yake Yakobo[a], na wanawake wengine waliokuwa pamoja nao. Walikuwa wakiwaambia mitume mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi, “Maria wa Yakobo.” Huenda maana yake ni “Maria mama yake Yakobo,” ingawa “Maria mke wa Yakobo” pia inawezekana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Wanawake hao walikuwa
  rationale: Kauli hii inawatambulisha wanawake waliotajwa katika muktadha. 'Wanawake hao' huweka rejeleo wazi kwa Kiswahili, huku δέ ikibaki kama mpito hafifu usiohitaji kiunganishi tofauti.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Maria Magdalene
  rationale: Hili ndilo umbo la kawaida la jina na utambulisho huu katika Kiswahili cha Biblia.
- source_word: Ἰωάννα
  choice: Yoana
  rationale: Unukuzi wa kawaida na unaotambulika wa jina hili kwa Kiswahili.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Maria mama yake Yakobo[a]
  rationale: Kirai halisi ni 'Maria wa Yakobo' na hakitaji uhusiano wazi. 'Mama yake Yakobo' ndiyo maana inayowezekana zaidi katika mtindo huu wa kumtambulisha mtu, lakini tanbihi inalinda utata wa Kigiriki.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: wanawake wengine waliokuwa pamoja nao
  rationale: Kivumishi kina umbo la kike wingi; kutaja 'wanawake' wazi ni asili na kunaondoa utata katika Kiswahili.
- source_word: ἔλεγον
  choice: Walikuwa wakiwaeleza
  rationale: Wakati usiotimilika unaonyesha tendo lililokuwa likiendelea au kurudiwa; muundo huu unaihifadhi hali hiyo.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: mitume
  rationale: '''Mitume'' ni istilahi sanifu ya Kiswahili kwa ἀπόστολοι na hapa inarejelea kundi la mitume wa Yesu.'
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea matukio pamoja na ujumbe uliotangulia.
theological_decisions:
- issue: Utambulisho wa Μαρία ἡ Ἰακώβου
  choice: Maria mama yake Yakobo
  alternative: Maria wa Yakobo; au Maria mke wa Yakobo
  rationale: Kigiriki hakisemi wazi uhusiano kati ya Maria na Yakobo. Katika namna hii ya utambulisho, 'mama yake Yakobo' inaelekea zaidi na ni wazi kwa msomaji, lakini uwezekano wa kuwa mke wake umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili kuakisi vishazi viwili vya Kigiriki kwa mtiririko wa kawaida. Kiashiria cha tanbihi [a] kimewekwa mara tu baada ya jina linalohusika.
