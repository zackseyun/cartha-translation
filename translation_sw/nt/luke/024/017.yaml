  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: sw
  text: Akawaambia, “Ni mambo gani haya mnayojadiliana mnapotembea?” Wakasimama, wakiwa na huzuni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi unaonyesha kuendelea kwa tukio na kuelekeza usemi kwao, bila kugeuza kitenzi ‘alisema’ kuwa ‘aliuliza,’ ingawa usemi wenyewe ni swali.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Ni mambo gani haya
  rationale: Katika muktadha huu λόγοι inahusu jambo la mazungumzo, si maneno yaliyojitenga. ‘Mambo gani haya’ ni Kiswahili cha kawaida huku ‘maneno gani haya’ ikihifadhiwa katika tanbihi kama tafsiri iliyo karibu zaidi na umbo la Kigiriki.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: mnayojadiliana ninyi kwa ninyi
  rationale: Kitenzi kinaonyesha mazungumzo ya kurudishiana mawazo. ‘Mnayojadiliana ninyi kwa ninyi’ huhifadhi maana hiyo ya kuheshimiana bila kutumia ‘mnayobadilishana maneno,’ ambayo kwa Kiswahili mara nyingi hudokeza ugomvi.
- source_word: περιπατοῦντες
  choice: mnapotembea
  rationale: Huonyesha kwamba mazungumzo yalikuwa yakiendelea wakati huohuo walipokuwa wakitembea.
- source_word: ἐστάθησαν
  choice: Wakasimama
  rationale: Katika muktadha wa kutembea, kitenzi hiki humaanisha kwamba waliacha kwenda na kusimama; ‘wakasimama’ ni fupi na ya kawaida katika simulizi.
- source_word: σκυθρωποί
  choice: nyuso zao zikiwa na huzuni
  rationale: Kivumishi hiki hueleza sura yenye huzuni au iliyokunjamana. Tafsiri hii huonyesha wazi kwamba huzuni ilionekana katika nyuso zao.
