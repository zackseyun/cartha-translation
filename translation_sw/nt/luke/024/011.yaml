base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: sw
  text: Maneno hayo yalionekana kwao kuwa upuuzi[a], nao hawakuwaamini wanawake hao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama hadithi isiyo na maana” au “kama maneno ya mtu anayeweweseka.” Neno la Kigiriki λῆρος linamaanisha usemi unaodhaniwa kuwa hauna maana au ni wa kipuuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: yalionekana
  rationale: Katika muundo huu wa kutathmini, kitenzi kinaonyesha jinsi maneno hayo yalivyowajia au yalivyohukumiwa na wao, si mwonekano wa macho.
- source_word: ἐνώπιον αὐτῶν
  choice: kwao
  rationale: Ingawa maana ya moja kwa moja ni ‘mbele yao,’ hapa Kiswahili cha kawaida hutumia ‘kwao’ kuonyesha mtazamo wao katika tathmini hiyo.
- source_word: ὡσεὶ λῆρος
  choice: kuwa upuuzi
  rationale: Neno λῆρος humaanisha usemi unaodhaniwa kuwa hauna maana, wa kipumbavu, au kama maneno ya mtu anayeweweseka; ‘upuuzi’ ni wazi na la kawaida, huku ‘kuwa’ ikitoa ulinganisho wa ὡσεὶ kwa kawaida katika Kiswahili.
- source_word: τὰ ῥήματα ταῦτα
  choice: maneno hayo
  rationale: ‘Maneno’ hufuata ῥήματα kwa karibu, na ‘hayo’ hurejelea kwa kawaida katika Kiswahili maneno yaliyotangulia kutajwa.
- source_word: ἠπίστουν
  choice: hawakuwaamini
  rationale: Muundo huu unawasilisha kutokuamini kulikokuwa kukiendelea wakati huo bila kuongeza wazo la kukataa kwa makusudi.
- source_word: αὐταῖς
  choice: wanawake hao
  rationale: Kiwakilishi cha Kigiriki ni cha kike na cha wingi, kikirejelea wanawake wa muktadha wa karibu. Kwa kuwa viwakilishi vya Kiswahili havionyeshi jinsia, kutaja ‘wanawake hao’ kunazuia utata bila kuingiza mhusika mpya.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi tathmini ya wahusika na hali ya kutokuamini inayoendelea, bila kudokeza kwamba walikataa kwa makusudi.
