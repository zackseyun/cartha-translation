id: LUK.24.41
reference: Luke 24:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: sw
  text: Nao walipokuwa bado hawaamini kwa sababu ya furaha na wakistaajabu[a], akawaambia, “Je, mna chochote cha kula hapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na wakishangaa.”
    reason: Neno θαυμαζόντων linaweza kueleza kustaajabu au kushangaa; “wakistaajabu” huhifadhi zaidi wazo la mshangao wenye kuvutiwa.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Nao walipokuwa bado
  rationale: “Bado” huonyesha hali inayoendelea, na “nao” pamoja na “walipokuwa” huunganisha sentensi kwa ulaini huku ikitambulisha hali iliyokuwa ikiendelea.
- source_word: ἀπιστούντων
  choice: hawaamini
  rationale: Umbo hili linaonyesha hali iliyoendelea wakati huo; “hawaamini” ni Kiswahili cha kawaida na halidokezi lazima kutokuamini kulikokomaa au kwa kudumu.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: kwa sababu ya furaha
  rationale: Hapa ἀπό huonyesha sababu au chanzo. Tafsiri hii inahifadhi hali ya kushangaza kwamba furaha yao ilichangia ugumu wao wa kuamini.
- source_word: θαυμαζόντων
  choice: wakistaajabu
  rationale: Neno hili linaonyesha mshangao wenye kustaajabu unaoendelea, sambamba na hali yao ya kutokuamini.
- source_word: Ἔχετέ τι βρώσιμον ἐνθάδε
  choice: Je, mna chochote cha kula hapa?
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi swali la wazi, maana ya kitu kinachofaa kuliwa, na mahali panapoonyeshwa na ἐνθάδε.
theological_decisions:
- issue: Hali ya wanafunzi walipomwona Yesu aliyefufuka
  choice: Kutokuamini kwao kunaelezwa kuwa kulisababishwa na furaha huku wakistaajabu.
  alternative: Kusisitiza tu kwamba hawakuamini, bila kuhusianisha hali hiyo na furaha yao.
  rationale: Matini inaunganisha ἀπιστούντων na ἀπὸ τῆς χαρᾶς pamoja na θαυμαζόντων. Tafsiri haifanyi hali yao kuwa kukataa kwa ukaidi, wala haiondoi kutokuamini kwao; inadumisha mvutano wa kihisia uliopo katika chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku ukiendeleza kwa uangalifu hali mbili zinazoendelea: kutokuamini na kustaajabu.'
