  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: sw
  text: Akawaambia, “Kwa nini mmefadhaika, na kwa nini mashaka yanazuka mioyoni mwenu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawazo” au “hoja” badala ya “mashaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu τί inauliza sababu ya hali yao; ‘Kwa nini’ ni Kiswahili cha kawaida na sahihi.
- source_word: τεταραγμένοι
  choice: mmefadhaika
  rationale: Neno hili linaeleza hali yao ya sasa ya kusumbuka na kutaharuki moyoni, bila kuzidisha maana.
- source_word: διαλογισμοὶ
  choice: mashaka
  rationale: Katika muktadha wa mwonekano wa Yesu, neno linaonyesha kusitasita na kutokuwa na uhakika; hata hivyo, maana pana ya ‘mawazo’ au ‘hoja’ imehifadhiwa katika tanbihi.
- source_word: ἀναβαίνουσιν
  choice: yanazuka
  rationale: Ingawa maana ya msingi ni ‘kupanda,’ hapa linatumika kwa jambo linalotokea ndani ya mtu; ‘yanazuka’ ni usemi wa asili wa Kiswahili.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: mioyoni mwenu
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa umoja wa Kigiriki unaotumiwa kwa maana ya kugawanya kwa kundi lenye watu wengi.
- source_word: καρδία
  choice: moyo
  rationale: ‘Moyo’ huhifadhi taswira ya kibiblia ya utu wa ndani, ikijumuisha fikira, nia na hisia, badala ya kuibana kuwa akili peke yake.
theological_decisions:
- issue: Maana ya kiantropolojia ya καρδία
  choice: mioyoni
  alternative: akilini / ndani yenu
  rationale: ‘Mioyoni’ huhifadhi mtazamo wa kibiblia ambapo moyo ni kitovu cha mawazo, nia na hisia, bila kuingiza ufafanuzi mwembamba wa kisaikolojia.
- issue: Nguvu ya διαλογισμοί katika muktadha
  choice: mashaka
  alternative: mawazo / hoja
  rationale: ‘Mashaka’ yanafaa kwa hali ya wanafunzi ya kutokuwa na uhakika, lakini tanbihi inahifadhi upana halisi wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa swali na taswira ya ‘moyo’ vimehifadhiwa kwa uasilia.
