  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: sw
  text: Nao wakainuka saa ileile, wakarudi Yerusalemu, wakawakuta wale Kumi na Mmoja na wale waliokuwa pamoja nao wakiwa wamekusanyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “wakiwa wamekusanywa.” Kauli hii inaonyesha kwamba tayari walikuwa wamekusanyika walipokutwa.'
