lexical_decisions:
- source_word: ἀναστάντες
  choice: wakainuka
  rationale: Kitenzi hiki kinaonyesha kwamba waliinuka kabla ya kurudi; tafsiri hii inahifadhi tendo la kimwili bila kulipanua kuwa tayari wameondoka.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: saa ileile
  rationale: Kirai hiki kinarejelea wakati huohuo kwa msisitizo, badala ya kutoa tu maana ya jumla ya ‘mara moja.’
- source_word: ὑπέστρεψαν
  choice: wakarudi
  rationale: Hii ndiyo maana ya kawaida ya kurudi mahali walikotoka katika simulizi la safari.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: εὗρον
  choice: wakawakuta
  rationale: Katika muktadha huu, kitenzi kina maana ya kuwakuta watu waliokuwa tayari mahali hapo.
- source_word: ἠθροισμένους
  choice: wakiwa wamekusanyika
  rationale: Kauli hii inaonyesha hali ambayo kundi lote lilikuwa nayo walipokutwa; Kiswahili hiki ni cha kawaida na kinahifadhi hali iliyotokana na kukusanyika.
- source_word: τοὺς ἕνδεκα
  choice: wale Kumi na Mmoja
  rationale: Tafsiri hii inadumisha jina la kundi lililotumiwa na Luka bila kuongeza neno ‘mitume’ lisilopo katika mstari.
- source_word: τοὺς σὺν αὐτοῖς
  choice: wale waliokuwa pamoja nao
  rationale: Kauli hii inarejelea wengine waliokuwa pamoja na wale Kumi na Mmoja bila kubainisha utambulisho wao zaidi ya maandishi.
theological_decisions:
- issue: Kutajwa kwa ‘wale Kumi na Mmoja’ ingawa huenda si kila mshiriki aliyekuwapo wakati huo
  choice: Kudumisha jina la kundi ‘wale Kumi na Mmoja’
  alternative: ‘mitume kumi na mmoja’ au ‘wanafunzi waliobaki’
  rationale: Kigiriki kinatumia jina la kundi τοὺς ἕνδεκα. Kulitafsiri moja kwa moja huepuka kuongeza cheo au kupatanisha maelezo kuhusu idadi halisi ya waliokuwapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi na chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi unaonyesha kwamba ‘wakiwa wamekusanyika’ inawahusu wale Kumi na Mmoja pamoja na wale waliokuwa nao.
