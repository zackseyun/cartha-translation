  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: sw
  text: Nao walikuwa daima hekaluni wakimbariki Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimsifu Mungu.” Kitenzi cha Kigiriki ni “kubariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuunganisha mstari huu wa mwisho na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἦσαν
  choice: walikuwa
  rationale: Wakati usiotimilika unaonyesha hali iliyoendelea; maana hiyo inaimarishwa na neno “daima.”
- source_word: διὰ παντός
  choice: daima
  rationale: Nahau hii ina maana ya kuendelea au kwa nyakati zote; “daima” ni fupi, ya asili, na inaonyesha desturi yao iliyoendelea.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hapa ni eneo lote la Hekalu, si patakatifu pa ndani pekee. “Hekaluni” ni tafsiri ya kawaida na yenye upana unaofaa katika muktadha huu.
- source_word: εὐλογοῦντες
  choice: wakimbariki
  rationale: Kitenzi εὐλογέω kimsingi ni kubariki au kusema mema juu ya mtu. Mungu akiwa mtendewa, “wakimbariki” huhifadhi umbo la Kigiriki, ingawa “wakimsifu” pia ni maana inayowezekana katika matumizi haya.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya εὐλογοῦντες na hutafsiriwa kwa kawaida kuwa “Mungu.”
theological_decisions:
- issue: Lugha ya ibada katika εὐλογοῦντες τὸν θεόν
  choice: wakimbariki Mungu
  alternative: wakimsifu Mungu
  rationale: Tafsiri “wakimbariki Mungu” huhifadhi kitenzi mahsusi εὐλογέω badala ya kukibadilisha kimya kuwa kitenzi cha kawaida cha kusifu. Tanbihi inaonyesha maana nyingine ya asili katika muktadha wa kumwabudu Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo “Nao walikuwa daima...” huhifadhi hali endelevu ya simulizi; “hekaluni” inaeleweka kwa wasomaji wa kawaida bila kudokeza patakatifu pa ndani pekee.
