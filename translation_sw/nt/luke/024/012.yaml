review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Peter's rising, running to the tomb, stooping to look, seeing only the linen cloths, and departing in amazement. However, “mpaka kaburini” is less precise and less idiomatic than a directional expression, and “akaondoka, akienda kwake” is awkward while over-specifying πρὸς ἑαυτόν as a destination. “Akaenda zake” naturally conveys his departure without resolving the debated nuance beyond the Greek.
  naturalness: The historical present “anaona” is understandable and suitably reflects βλέπει. The revised wording improves idiomatic flow, removes the redundant departure construction, and uses “pekée” appropriately with “vitambaa.”
  terminology: “Kaburi,” “vitambaa vya kitani,” and “akistaajabia” are accurate, natural Standard East African Swahili choices. No theological term requires alteration.
  issues:
  - severity: medium
    issue: “mpaka kaburini” for ἐπὶ τὸ μνημεῖον
    rationale: “Mpaka” can suggest running until reaching a limit and is less direct than the Greek directional sense. “Kwenda kaburini” is clearer and more idiomatic without implying entry.
  - severity: medium
    issue: “akaondoka, akienda kwake” for ἀπῆλθεν πρὸς ἑαυτόν
    rationale: The construction is stylistically awkward, and “kwake” can specify Peter's home more strongly than the Greek phrase warrants. “Akaenda zake” gives a natural departure expression while leaving the exact nuance open.
  - severity: low
    issue: “peke yake” modifying plural “vitambaa”
    rationale: '“Pekee” is the more natural invariant restrictive form here: the linen cloths alone were seen.'
  revised_text: Lakini Petro akainuka, akakimbia kwenda kaburini; akainama na kuchungulia ndani, anaona vitambaa vya kitani pekee. Kisha akaenda zake, akistaajabia yaliyotokea.[a]
