  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: sw
  text: Lakini Petro akainuka, akakimbia kwenda kaburini; akainama na kuchungulia ndani, anaona vitambaa vya kitani pekee. Kisha akaenda zake, akistaajabia yaliyotokea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina mstari huu.
    reason: Mstari huu una ushahidi wa maandishi unaotofautiana; dokezo humjulisha msomaji bila kuondoa matini ya SBLGNT au kulazimisha hitimisho la kiteolojia.
lexical_decisions:
- source_word: μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu ni kaburi la Yesu; umbo la mahali linaonyesha mwisho wa mwendo bila kulazimisha maana ya kuingia ndani.
- source_word: παρακύψας
  choice: alipoinama na kuchungulia ndani
  rationale: Huwakilisha tendo la kuinama ili kutazama ndani ya kaburi.
- source_word: ὀθόνια
  choice: vitambaa vya kitani
  rationale: Ni vitambaa vya kitani vilivyotumiwa katika maziko; tafsiri hii huhifadhi maana ya kitu bila kuongeza maelezo yasiyotajwa.
- source_word: μόνα
  choice: peke yake
  rationale: Husisitiza kwamba vitambaa pekee ndivyo vilivyoonekana.
- source_word: βλέπει
  choice: anaona
  rationale: Huhifadhi wakati uliopo wa kihistoria wa Kigiriki na mabadiliko yake ya kimtindo ndani ya simulizi.
- source_word: πρὸς αὑτόν
  choice: akienda kwake
  rationale: Kirai hiki kinaweza kumaanisha kwamba Petro aliondoka kwenda kwake; tafsiri haikifanyi kimaanishe hali ya ndani pekee.
- source_word: θαυμάζων
  choice: huku akistaajabia
  rationale: Huonyesha mshangao mkubwa na kutafakari juu ya tukio, bila kudai kwamba tayari aliamini.
theological_decisions:
- issue: Hali ya Petro baada ya kuona vitambaa
  choice: akistaajabia yaliyotokea
  alternative: akiamini kwamba Yesu amefufuka
  rationale: Kifungu kinasema Petro alistaajabu, lakini hakisemi wazi kwamba wakati huo alifikia imani kamili kuhusu ufufuo.
- issue: Maana ya πρὸς αὑτόν
  choice: akienda kwake
  alternative: akijiuliza moyoni
  rationale: Muundo unaweza kueleweka kwa zaidi ya njia moja; ‘kwake’ huhifadhi maana ya mwendo inayopatana na ἀπῆλθεν bila kuingiza tafsiri ya kisaikolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa usomaji wa kawaida huku mfuatano wa matendo ukihifadhiwa. Wakati uliopo wa kihistoria katika ‘anaona’ umeachwa kwa makusudi.
