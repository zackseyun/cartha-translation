  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: sw
  text: Alipoulizwa na Mafarisayo ufalme wa Mungu ungekuja lini, aliwajibu akasema, “Ufalme wa Mungu hauji kwa ishara zinazoonekana[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uangalizi,” “kwa namna inayoweza kuonekana,” au “kwa namna inayoweza kufuatiliwa kwa makini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Alipoulizwa na Mafarisayo
  rationale: Muundo wa wakati wenye kauli tendwa unawakilisha aoristi ya kauli tendwa na ὑπό pamoja na mtendaji wake. δέ ni kiunganishi hafifu cha mazungumzo; hakutafsiriwa kwa neno maalumu hapa ili Kiswahili kisibebeshwe mpito mzito kuliko uliomo katika muktadha.
- source_word: πότε ἔρχεται
  choice: ungekuja lini
  rationale: “Lini” linaonyesha swali la wakati, na “ungekuja” ni Kiswahili cha kawaida katika swali lisilo la moja kwa moja baada ya kitenzi cha wakati uliopita, huku kikihifadhi mwelekeo wa kuja kwa ufalme.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni ulinganifu wa moja kwa moja, unaotambulika, na unaohifadhi uzito wa usemi wa Agano Jipya.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: aliwajibu akasema
  rationale: Vitenzi vyote viwili vimehifadhiwa kwa muundo wa Kiswahili unaosikika kwa kawaida bila kuondoa uradidi wa simulizi ya Kigiriki.
- source_word: Οὐκ ἔρχεται
  choice: hauji
  rationale: Wakati wa sasa unaeleza namna ya kuja kwa ufalme kwa kauli fupi na ya kawaida ya Kiswahili.
- source_word: μετὰ παρατηρήσεως
  choice: kwa ishara zinazoonekana
  rationale: παρατήρησις linaweza kumaanisha kutazama, kuchunguza, au kuangalia kwa makini. Katika muktadha huu usemi unaeleza kuja kunakoweza kufuatiliwa kwa dalili za nje; tafsiri hii ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi uwezekano mpana wa neno.
theological_decisions:
- issue: Maana ya Yesu kukataa namna fulani ya kuja kwa ufalme
  choice: Yesu anasema ufalme wa Mungu hauji kwa namna yenye ishara za nje zinazoweza kuangaliwa na kufuatiliwa.
  alternative: Yesu anakataa utazamaji wa kibinadamu kwa ujumla, au anakataa kabisa ishara zote za nyakati za mwisho.
  rationale: μετὰ παρατηρήσεως inaelekea kueleza kitu kinachotazamwa au kuchunguzwa kwa makini. Tafsiri haifanyi mstari huu kuwa tangazo pana kwamba hakuna ishara zozote, wala haitatui mapema mvutano kuhusu jinsi ufalme ulivyo au utakavyodhihirika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alipoulizwa” huhifadhi kauli tendwa ya chanzo; “aliwajibu akasema” huhifadhi vitenzi vyote viwili. Alama ya tanbihi imewekwa mara tu baada ya usemi unaofafanuliwa.
