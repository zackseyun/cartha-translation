id: LUK.17.12
reference: Luke 17:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: sw
  text: Alipokuwa akiingia katika kijiji fulani, wanaume kumi wenye ugonjwa wa ngozi[a] walikutana naye. Walisimama kwa mbali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye ukoma.” Neno la Kigiriki linaweza kutaja magonjwa mbalimbali ya ngozi, si lazima ugonjwa unaoitwa ukoma katika tiba ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Alipokuwa akiingia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati wanaume hao walipokutana naye, sawa na participle ya wakati uliopo katika genitive absolute.
- source_word: εἴς τινα κώμην
  choice: katika kijiji fulani
  rationale: Neno “fulani” linaakisi hali ya kutotajwa wazi kwa kijiji inayotolewa na τινα, bila kudokeza kwamba kijiji hicho hakikuwa maalumu.
- source_word: ἀπήντησαν
  choice: walikutana naye
  rationale: Hii ni tafsiri ya kawaida na ya asili ya ἀπαντάω katika muktadha huu, bila kuongeza maelezo yasiyotajwa kuhusu mwendo wao.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: wanaume kumi wenye ugonjwa wa ngozi[a]
  rationale: “Wanaume kumi” huhifadhi ἄνδρες, huku “wenye ugonjwa wa ngozi” likiepuka kuifanya λεπροί kuwa utambuzi sahihi wa ugonjwa wa ukoma wa kisasa; maelezo ya chini yanahifadhi tafsiri ya jadi.
- source_word: οἳ ἔστησαν
  choice: Walisimama
  rationale: Huhifadhi maana rahisi ya ἵστημι. Kugawa kuwa sentensi mpya kunaleta Kiswahili cha asili bila kubadili mhusika.
- source_word: πόρρωθεν
  choice: kwa mbali[b]
  rationale: Ni usemi mfupi na wa kawaida wa Kiswahili unaoonyesha umbali uliomo katika πόρρωθεν.
theological_decisions:
- issue: Maana ya jina la hali λεπροί
  choice: wenye ugonjwa wa ngozi
  alternative: wenye ukoma
  rationale: Neno la kale linaweza kutaja hali mbalimbali za ngozi na halipaswi kulazimishwa kuwa utambuzi wa ugonjwa unaoitwa ukoma katika tiba ya kisasa. Maelezo ya chini yanahifadhi uwezekano wa tafsiri ya jadi bila kuondoa utata wa kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya pili imewekwa kando ili mtiririko uwe wa asili, huku uhusiano wa matendo na mpangilio wa habari wa Kigiriki ukihifadhiwa.
