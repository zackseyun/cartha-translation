  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: sw
  text: Lakini kwanza ni lazima apate mateso mengi na akataliwe na kizazi hiki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: kwanza
  rationale: Inaonyesha kutangulia kwa wakati na kudumisha mpangilio wa matukio kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa linaonyesha tofauti au mpito wenye ukinzani wa kiasi na yaliyotangulia.
- source_word: δεῖ
  choice: lazima
  rationale: Linahifadhi wazo la ulazima, ambalo katika Luka mara nyingi hudokeza kusudi la Mungu, bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: αὐτὸν
  choice: a- (yeye)
  rationale: Kiwakilishi hiki ni mtendaji wa vitenzi-jina katika Kigiriki; katika Kiswahili kinaonyeshwa kiasili kwa kiambishi cha nafsi katika 'ateseke' na 'kukataliwa' chini ya 'lazima'.
- source_word: πολλὰ παθεῖν
  choice: ateseke kwa mambo mengi
  rationale: Linadumisha upana wa mateso mbalimbali unaoonyeshwa na nomino-kivumishi cha wingi πολλὰ, badala ya kuufanya usemi kuwa wa jumla tu kama 'ateseke sana'.
- source_word: ἀποδοκιμασθῆναι
  choice: kukataliwa
  rationale: Kitenzi hiki huonyesha kukataliwa baada ya kupimwa au kutathminiwa; 'kukataliwa' ni wazi na cha kawaida katika muktadha huu.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: na kizazi hiki
  rationale: Pamoja na kitenzi cha kutendwa, ἀπό linamtaja mtendaji au chanzo cha kukataliwa; 'na' ni njia ya kawaida ya Kiswahili kuonyesha mtendaji wa tendo katika hali ya kutendwa.
theological_decisions:
- issue: Nguvu ya δεῖ kuhusiana na mateso ya Mwana wa Adamu
  choice: lazima
  alternative: ni lazima kwake; kueleza wazi kuwa hayo ni mapenzi au mpango wa Mungu
  rationale: '''Lazima'' linahifadhi uzito wa ulazima na uwezekano wa kusudi la Mungu unaopatikana mara nyingi katika matumizi ya Luka, bila kuingiza maelezo ya kitheolojia ambayo mstari wenyewe hauyasemi wazi.'
- issue: Rejeo la kiwakilishi αὐτόν
  choice: Kudumisha rejeo kwa Mwana wa Adamu kupitia kiambishi cha nafsi 'a-'
  alternative: kumtaja tena wazi kama 'Mwana wa Adamu'
  rationale: Chanzo kinatumia kiwakilishi, kwa hiyo tafsiri haiongezi jina, lakini muktadha unabaki kuonyesha anayerejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo 'ateseke kwa mambo mengi' unafuata maana ya Kigiriki huku ukiepuka lugha ya kidhehebu.
