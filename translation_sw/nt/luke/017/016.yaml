  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: sw
  text: Akaanguka kifudifudi miguuni pake, akimshukuru. Naye alikuwa Msamaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: akaanguka kifudifudi
  rationale: Muunganiko huu unaeleza kuanguka uso chini katika hali ya unyenyekevu. ‘Kifudifudi’ ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha mkao huo bila kuongeza tafsiri ya nia.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: miguuni pake
  rationale: Katika muktadha huu wa kusujudu, ‘miguuni pake’ ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuwa chini karibu na miguu ya Yesu.
- source_word: εὐχαριστῶν αὐτῷ
  choice: akimshukuru
  rationale: Umbo la kitenzi endelevu linaonyesha tendo lililoambatana na kuanguka kwake. ‘Akimshukuru’ huhifadhi wakati huo sambamba na kumwelekezea Yesu shukrani.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Naye alikuwa Msamaria
  rationale: ‘Naye’ huakisi msisitizo wa αὐτός na kuleta kwa kawaida ufunuo wenye mshangao kuhusu utambulisho wa mtu huyo.
- source_word: Σαμαρίτης
  choice: Msamaria
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa jamii ya Wasamaria, na linahifadhi umuhimu wa kijamii na kisimulizi wa utambulisho huo.
theological_decisions:
- issue: Msisitizo wa kisimulizi kuhusu utambulisho wa mtu aliyeponywa
  choice: Naye alikuwa Msamaria
  alternative: Na mtu huyo alikuwa Msamaria
  rationale: Kauli fupi huhifadhi uzito wa ufunuo kwamba aliyerudi kushukuru alikuwa mtu wa kundi lililoonekana kuwa la nje, bila kuongeza maelezo ya kimadhehebu au ya kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye hadhi. ‘Kifudifudi’ huonyesha wazi mkao wa uso chini; ‘Naye’ huhifadhi msisitizo wa sentensi ya mwisho bila kuufanya mzito.
