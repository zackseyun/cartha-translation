  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: sw
  text: Nawaambia, usiku huo watu wawili watakuwa kitandani kimoja; mmoja atachukuliwa[a], na mwingine ataachwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atachukuliwa pamoja.” Kitenzi chenyewe hapa hakibainishi ikiwa kuchukuliwa huko ni kwa ukombozi au kwa hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataachwa nyuma.” Usemi mfupi “ataachwa” umetumiwa katika andiko kuu ili kutoingiza dhana za baadaye kuhusu mwisho wa nyakati ambazo hazijaelezwa wazi katika Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Nawaambia
  rationale: Ni usemi wa kawaida wa kumwelekea moja kwa moja mtu zaidi ya mmoja; umbo la ‘wa-’ linahifadhi wingi wa ὑμῖν na Kiswahili hiki ni cha asili.
- source_word: ταύτῃ τῇ νυκτί
  choice: usiku huo
  rationale: Kirai hiki kinaelekeza kwenye usiku maalumu unaozungumziwa. ‘Usiku huo’ ni usemi wa kawaida wa Kiswahili na unahifadhi rejeo hilo.
- source_word: ἔσονται δύο
  choice: watu wawili watakuwa
  rationale: Neno ‘watu’ linaweka wazi kwa njia ya kawaida kwamba wawili wanaotajwa ni watu, bila kubadili maana ya namba na wakati ujao.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: katika kitanda kimoja
  rationale: κλίνη inaweza kuwa kitanda au kochi; muktadha wa usiku unaunga mkono ‘kitanda.’ ‘Katika kitanda kimoja’ ni Kiswahili cha kawaida kinachoeleza mahali walipo.
- source_word: ὁ εἷς
  choice: mmoja
  rationale: Neno hili linamtaja mmoja kati ya wale wawili na linafungamana kwa kawaida na ‘mwingine.’
- source_word: παραλημφθήσεται
  choice: atachukuliwa
  rationale: Kauli ya kutendwa ya wakati ujao ina maana ya kuchukuliwa au kuchukuliwa pamoja. ‘Atachukuliwa’ ni fupi na haibainishi bila msingi kama kuchukuliwa huko ni kwa wokovu au kwa hukumu.
- source_word: ὁ ἕτερος
  choice: mwingine
  rationale: Hutofautisha mtu wa pili na wa kwanza; ‘mwingine’ ndiyo namna ya kawaida ya Kiswahili katika jozi ya ‘mmoja … mwingine.’
- source_word: ἀφεθήσεται
  choice: ataachwa
  rationale: Katika utofautishaji huu na παραλημφθήσεται, maana inayofaa ni kuachwa. Tafsiri fupi ‘ataachwa’ haiongezi dhana maalumu za kieskatolojia zinazoweza kuletwa na ‘ataachwa nyuma.’
theological_decisions:
- issue: Ikiwa anayechukuliwa anaokolewa na anayeachwa anahukumiwa, au kinyume chake
  choice: 'Andiko kuu linabaki bila kuamua: “mmoja atachukuliwa, na mwingine ataachwa.”'
  alternative: Kusema wazi ama kwamba anayechukuliwa anapelekwa kwenye wokovu, ama kwamba anachukuliwa kwa hukumu.
  rationale: Vitenzi vya Kigiriki katika aya hii pekee haviamui kusudi la kuchukuliwa wala hali ya yule anayeachwa. Tafsiri kwa hiyo inahifadhi utata na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa ‘mmoja … mwingine’ unadumisha ulinganifu wa Kigiriki, na alama zote za tanbihi zimewekwa kwenye maneno husika.
