translation:
  language: sw
  text: Nao mitume wakamwambia Bwana, “Tuongezee imani[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Ongeza kwetu imani.” Kitenzi cha Kigiriki ni “ongeza”; katika muktadha huu maana yake ni kuongeza kiwango cha imani.
    reason: lexical_alternative
  - marker: b
    text: “Imani” hapa inaweza pia kueleweka kuwa “kumtumaini” au “kumtegemea”; katika miktadha mingine neno hilo linaweza kumaanisha “uaminifu,” ingawa maana hiyo siyo inayowezekana zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi mwendelezo rahisi wa simulizi bila kuongeza dhana maalumu ya wakati.
- source_word: εἶπαν
  choice: wakamwambia
  rationale: Wakati uliopita wa kisimulizi umetafsiriwa kwa umbo la kawaida la Kiswahili; kiambishi cha yambwa kinaonyesha kwamba walimwambia Bwana.
- source_word: οἱ ἀπόστολοι
  choice: mitume
  rationale: “Mitume” ndilo neno la kawaida na sahihi katika Kiswahili kwa kundi la watu waliotumwa na Yesu.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: “Bwana” huhifadhi uzito wa cheo κύριος katika simulizi la Luka na ni namna ya kawaida ya kumrejelea Yesu.
- source_word: Πρόσθες ἡμῖν
  choice: Tuongezee
  rationale: Kitenzi cha Kigiriki humaanisha kihalisi “ongeza,” na pamoja na ἡμῖν kinatoa ombi la kuongeza walicho nacho; “tuongezee” ni usemi wa asili wa Kiswahili.
- source_word: πίστιν
  choice: imani
  rationale: “Imani” ndilo neno la kawaida katika muktadha huu, likiwa na wazo la kumwamini au kumtegemea Mungu.
theological_decisions:
- issue: Tafsiri ya κύριος inapomrejelea Yesu
  choice: Bwana
  alternative: mkuu / mwenye mamlaka
  rationale: “Bwana” huhifadhi maana ya heshima na uzito wa kikristo wa cheo hiki bila kuipunguza kuwa mamlaka ya kawaida tu.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini au uaminifu
  rationale: Katika ombi hili, maana inayowezekana zaidi ni imani katika maana ya kumwamini Mungu. Hata hivyo, ukaribu wake na dhana ya kumtegemea umeelezwa katika tanbihi, bila kuifanya “uaminifu” kuwa maana kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao ... wakamwambia” ni mtiririko wa kawaida wa kisimulizi, na “tuongezee imani” ni ombi fupi linalosikika kwa urahisi huku likifuata kwa karibu muundo na maana ya Kigiriki.
