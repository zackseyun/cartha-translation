  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: sw
  text: Jihadharini ninyi wenyewe.[a] Ndugu yako[b] akitenda dhambi, mkemee; naye akitubu, msamehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina maneno, “Ndugu yako akikutendea dhambi, mkemee.”
    reason: textual_variant
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la umoja wa kiume, lakini hapa linaweza kumaanisha kwa upana zaidi mwanafunzi mwenzako.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Jihadharini ninyi wenyewe
  rationale: Kauli ya amri ya wakati uliopo inatoa wito wa kuendelea kuwa macho. “Ninyi wenyewe” inadumisha maana ya kujitazama bila kuamua ikiwa mkazo ni wa mtu binafsi au wa jumuiya.
- source_word: ἁμάρτῃ
  choice: akitenda dhambi
  rationale: Maandishi ya SBLGNT hayana kirai kinachomaanisha “dhidi yako”; kwa hiyo tafsiri kuu inaacha kitendo hicho kikiwa na maana pana kama ilivyo katika Kigiriki.
- source_word: ὁ ἀδελφός σου
  choice: Ndugu yako
  rationale: “Ndugu” ni neno la kawaida na lenye heshima katika Kiswahili, nalo linafaa kwa mtu mmoja wa jumuiya ya wanafunzi; tanbihi inaeleza umbo la kiume la Kigiriki na uwezekano wa maana pana.
- source_word: ἐπιτίμησον αὐτῷ
  choice: mkemee
  rationale: Kitenzi hiki kinaonyesha maonyo au masahihisho ya moja kwa moja yenye uzito, si ushauri mpole tu.
- source_word: μετανοήσῃ
  choice: akitubu
  rationale: “Kutubu” ni sawasawa na maana ya kimaadili na kimahusiano ya μετανοέω katika muktadha huu.
- source_word: ἄφες αὐτῷ
  choice: msamehe
  rationale: Katika uhusiano kati ya watu, ἀφίημι hapa humaanisha kuondolea kosa, yaani kusamehe.
theological_decisions:
- issue: Iwapo maneno “dhidi yako” yaongezwe baada ya “akitenda dhambi”
  choice: Hayajawekwa katika maandishi makuu
  alternative: Ndugu yako akikutendea dhambi, mkemee
  rationale: Maandishi yaliyotolewa yanasema ἐὰν ἁμάρτῃ ὁ ἀδελφός σου bila εἰς σέ au maneno mengine yenye maana ya “dhidi yako.” Maana pana imehifadhiwa katika maandishi makuu, na tofauti ya hati imeonyeshwa katika tanbihi.
- issue: Jinsi ya kutafsiri ἀδελφός ya umoja wa kiume
  choice: Ndugu yako
  alternative: Muumini mwenzako
  rationale: Kigiriki kina nomino ya umoja wa kiume. “Ndugu yako” hudumisha picha ya uhusiano wa kifamilia katika jumuiya ya wanafunzi, huku tanbihi ikieleza kuwa rejeo linaweza kuwa pana zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “akitenda … akitubu” ni wa kawaida na unaonyesha hali inayoweza kutokea; “mkemee” na “msamehe” hudumisha nguvu ya amri bila kuwa wa kizamani.
