  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: sw
  text: Alipowaona, akawaambia, “Nendeni mkajionyeshe mbele ya makuhani.[a]” Walipokuwa wakienda, wakatakaswa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Agizo la kujionyesha mbele ya makuhani linarejelea uchunguzi wa kikuhani uliotakiwa kwa mtu aliyetakaswa kutokana na ugonjwa wa ngozi; tazama Walawi 14.
    reason: cross_reference
  - marker: b
    text: Au, “wakafanywa kuwa safi.” Kitenzi cha Kigiriki kinaweza kumaanisha kutakaswa kimwili na kwa usafi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Alipowaona
  rationale: Kivumishi-jina cha wakati uliopita kimetafsiriwa kama kishazi cha wakati kwa Kiswahili cha kawaida; kiwakilishi cha yambwa ‘-wa-’ kinatokana na muktadha na αὐτοῖς inayofuata.
- source_word: Πορευθέντες
  choice: Nendeni
  rationale: Ingawa kimaumbo ni kivumishi-jina, hapa kinatumika pamoja na amri inayofuata; ‘Nendeni mkajionyeshe’ ni amri ya kawaida inayohifadhi mfuatano wa vitendo.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: mkajionyeshe
  rationale: Usemi huu unaeleweka kwa kawaida kuwa wajionyeshe ili wakaguliwe na makuhani; umbo la kujirejelea limehifadhiwa.
- source_word: τοῖς ἱερεῦσιν
  choice: kwa makuhani
  rationale: ‘Kwa’ linaonyesha watu ambao walipaswa kwenda mbele yao, nao ni makuhani waliokuwa na jukumu la kuwachunguza.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: Ikawa walipokuwa wakienda
  rationale: 'Tafsiri hii inahifadhi ἐγένετο na pia hali ya vitendo viwili kutokea kwa wakati mmoja: kutakaswa kulitokea walipokuwa njiani.'
- source_word: ἐκαθαρίσθησαν
  choice: wakatakaswa
  rationale: Kitenzi καθαρίζω kinaweza kuhusisha kuondolewa kwa ugonjwa na hali ya kuwa safi kidini; ‘wakatakaswa’ huhifadhi upana huo kuliko ‘wakaponywa’.
theological_decisions:
- issue: Lugha ya utakaso katika muktadha wa ugonjwa wa ngozi na usafi wa kidini
  choice: wakatakaswa
  alternative: wakaponywa; wakafanywa kuwa safi
  rationale: Kigiriki kinasisitiza kutakaswa, jambo linalojumuisha kurejeshwa kwa mwili na pia hali ya usafi inayoweza kuthibitishwa na makuhani. Tafsiri haibani maana iwe uponyaji wa mwili pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nendeni mkajionyeshe’ ni cha kawaida na wazi; ‘Ikawa’ huhifadhi muundo wa simulizi wa Kigiriki bila kufanya sentensi kuwa nzito.
