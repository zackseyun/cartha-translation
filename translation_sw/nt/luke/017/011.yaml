  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: sw
  text: Ikawa, alipokuwa akisafiri kwenda Yerusalemu, yeye alikuwa akipita kati ya Samaria na Galilaya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akipita katikati ya Samaria na Galilaya.” Usemi wa Kigiriki unaweza kueleweka kuwa alikuwa akisafiri kati ya maeneo hayo mawili au kupitia eneo la mpakani lililoyatenganisha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuanzisha tukio; “Ikawa” huihifadhi kwa lugha fupi, ya simulizi na yenye hadhi.
- source_word: ἐν τῷ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: alipokuwa akisafiri kwenda Yerusalemu
  rationale: Muundo huu unaonyesha kitendo kinachoendelea wakati mmoja na kitendo kikuu; tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha safari yenye kuendelea.
- source_word: αὐτός
  choice: Yesu
  rationale: Kiswahili mara nyingi hufaidika kwa kutaja mhusika wazi baada ya kishazi tegemezi; jina linapatikana wazi katika muktadha na haliongezi mhusika mpya.
- source_word: διήρχετο
  choice: alikuwa akipitia
  rationale: Hali ya wakati usiotimilika inaonyesha mwendo uliokuwa ukiendelea; “alikuwa akipitia” huhifadhi hali hiyo.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: katika eneo la mpakani mwa Samaria na Galilaya
  rationale: Usemi wa Kigiriki unaweza kuelekeza kwenye mwendo katikati ya maeneo hayo, yaani katika ukanda unaoyatenganisha, bila kudai kwamba alipita ndani kabisa ya yote mawili.
theological_decisions:
- issue: Mahali na mwelekeo wa safari kati ya Samaria na Galilaya
  choice: katika eneo la mpakani mwa Samaria na Galilaya
  alternative: katikati ya Samaria na Galilaya
  rationale: 'Kigiriki kina utata wa kijiografia: kinaweza kumaanisha kupita kati ya mikoa hiyo au kupitia ukanda wa katikati/mpakani. Tafsiri kuu ni ya kawaida zaidi kwa Kiswahili, huku tanbihi ikihifadhi uwezekano mwingine.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ikawa” huhifadhi ladha ya simulizi ya Luka bila kutumia lugha nzito kupita kiasi; “eneo la mpakani” linaeleweka kwa wasomaji wa kawaida na tanbihi inalinda utata wa asili.
