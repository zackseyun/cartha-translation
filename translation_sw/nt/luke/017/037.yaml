base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: sw
  text: Nao wakamjibu, “Wapi, Bwana?” Akawaambia, “Palipo na mwili[b], ndipo tumbusi[a] watakusanyika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tai.” Neno la Kigiriki linaweza kumaanisha tai, lakini katika muktadha wa ndege wanaokusanyika penye mwili, “tumbusi” huwasilisha maana inayowezekana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “maiti.” Neno “mwili” linaweza kumaanisha mwili uliokufa katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες ... λέγουσιν
  choice: Nao wakamjibu
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida tendo la kujibu linalotanguliza swali lao, bila tafsiri nzito ya neno kwa neno.
- source_word: Ποῦ
  choice: Wapi
  rationale: Ni swali fupi na la moja kwa moja kuhusu mahali, sawasawa na kielezi cha Kigiriki.
- source_word: κύριε
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na linalofaa kwa κύριε kama namna ya kumwita Yesu katika muktadha huu.
- source_word: Ὅπου
  choice: Palipo na
  rationale: Hutoa muundo wa kimethali wa mahali kwa Kiswahili cha kawaida bila kuongeza ufafanuzi wa kiutafsiri.
- source_word: σῶμα
  choice: mwili
  rationale: Huhifadhi maana ya msingi ya σῶμα na kuacha muktadha wa ndege wala mizoga udokeze kuwa ni mwili uliokufa; ‘mzoga’ imewekwa kama uwezekano katika tanbihi.
- source_word: ἀετοὶ
  choice: tai wala mizoga
  rationale: Katika taswira ya ndege wanaokusanyika penye mwili, maana inayowezekana zaidi ni ndege wala mizoga. Usemi huu ni wazi kwa msomaji wa sasa, huku ‘tai’ ikiwekwa kama tafsiri mbadala katika tanbihi.
- source_word: ἐπισυναχθήσονται
  choice: watakapokusanywa
  rationale: Huhifadhi hali ya kutendwa na wakati ujao wa kitenzi cha Kigiriki, pamoja na sauti nzito ya msemo huu.
theological_decisions:
- issue: Maana ya mfano kuhusu mwili na ndege wala mizoga
  choice: Taswira imetafsiriwa moja kwa moja bila kutaja rejeo lake mahususi.
  alternative: Kuufafanua kuwa unahusu hukumu ya mwisho, majeshi ya Roma, au kanuni ya jumla ya hukumu isiyoepukika.
  rationale: Kigiriki hakimtambulishi anayelengwa na mfano huo. Tafsiri inaacha mvutano na utata wa kitheolojia uliopo katika chanzo badala ya kuamua tafsiri fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kama msemo mfupi wenye uzito. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
