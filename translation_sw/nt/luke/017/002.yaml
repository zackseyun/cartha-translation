  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: sw
  text: Ingekuwa afadhali kwake kama jiwe la kusagia[a] lingefungwa shingoni mwake, naye atupwe baharini, kuliko kumsababisha mmoja wa hawa wadogo ajikwae[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana maalumu zaidi, “jiwe kubwa la kusagia.” Maneno ya Kigiriki yanaweza kutaja jiwe zito zaidi lililotumiwa katika kinu.
    reason: lexical_alternative
  - marker: b
    text: Au “kumsababisha mmoja wa hawa wadogo atende dhambi.” Kitenzi cha Kigiriki kinahusisha kumsababisha mtu aanguke katika dhambi au maangamizi ya kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Ingekuwa afadhali kwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba matokeo hayo yangekuwa bora kwake kuliko lile linalolinganishwa nalo.
- source_word: λίθος μυλικὸς
  choice: jiwe la kusagia
  rationale: Hutaja jiwe la kinu kwa lugha ya kawaida na inayoeleweka; uwezekano wa kuwa jiwe kubwa zaidi umewekwa katika tanbihi.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: lingefungwa shingoni mwake
  rationale: Huwasilisha kwa kawaida hali ya jiwe kuwekwa na kubaki shingoni katika muundo huu wa masharti.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: naye akatupwa baharini
  rationale: Hutoa tendo lililokamilishwa la kutupwa baharini kwa Kiswahili fasaha ndani ya ulinganisho huu.
- source_word: σκανδαλίσῃ
  choice: kumsababisha ... aanguke katika dhambi
  rationale: Huhifadhi picha ya kuanguka huku ikifafanua kwamba hapa ni kuanguka katika dhambi au maangamizi ya kiroho, si kujikwaa kimwili tu.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: mmoja wa hawa wadogo
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuamua kwamba ni watoto pekee au waamini/wanafunzi pekee.
- source_word: ἢ ἵνα
  choice: kuliko
  rationale: Huwasilisha moja kwa moja na kwa kawaida ulinganisho kati ya matokeo mawili.
theological_decisions:
- issue: Wanaorejelewa na ‘hawa wadogo’
  choice: hawa wadogo
  alternative: watoto hawa; waamini/wanafunzi hawa wanyenyekevu
  rationale: Kifungu hakitambulishi wazi kundi hilo zaidi ya kuwaita ‘hawa wadogo’; tafsiri haipaswi kulibana kwa watoto pekee au waamini pekee.
- issue: Maana ya σκανδαλίσῃ
  choice: aanguke katika dhambi
  alternative: ajikwae; atende dhambi
  rationale: Kitenzi kinaweza kumaanisha kusababisha kuanguka katika dhambi au uharibifu wa kiroho. Tafsiri inahifadhi sitiari ya kuanguka na kutoa maana yake ya kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti na ulinganisho umewekwa wazi; ‘hawa wadogo’ umeachwa kwa upana wake wa asili. Alama zote za tanbihi zimewekwa katika matini kuu.
