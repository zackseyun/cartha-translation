  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: sw
  text: Je, hakuna aliyepatikana kurudi na kumpa Mungu utukufu isipokuwa mgeni huyu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu huyu wa taifa jingine” au “mgeni huyu”; neno la Kigiriki humaanisha mtu wa umma au taifa lingine, aliye nje ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὑρέθησαν
  choice: hakuna mwingine aliyepatikana
  rationale: Muundo wa swali la balagha umetafsiriwa kwa Kiswahili cha kawaida huku maana ya kitenzi cha kutendwa, ‘kupatikana,’ ikihifadhiwa. ‘Mwingine’ inaonyesha kwamba, mbali na mtu huyu, hakuna aliyepatikana.
- source_word: ὑποστρέψαντες
  choice: kuwa amerudi
  rationale: Muundo huu unaonyesha kwamba kurudi kulitangulia tendo la kumpa Mungu utukufu, na unasikika kwa kawaida baada ya ‘aliyepatikana.’
- source_word: δοῦναι δόξαν
  choice: kumpa ... utukufu
  rationale: Nahau ya Kigiriki imehifadhiwa kwa usemi wa kibiblia unaoeleweka, ‘kumpa Mungu utukufu,’ badala ya kuipunguza kuwa ‘kumsifu’ pekee.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Kiswahili hutumia jina ‘Mungu’ bila kuhitaji kuwakilisha kibainishi cha Kigiriki kwa neno tofauti.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika muundo huu wa kuondoa wengine, ‘isipokuwa’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀλλογενής
  choice: mgeni
  rationale: Neno hili humaanisha mtu wa taifa au jamii nyingine, hapa mtu aliye nje ya Israeli. ‘Mgeni’ ni fupi na ya kawaida, huku tanbihi ikifafanua maana ya kikabila/kijamii.
- source_word: οὗτος
  choice: huyu
  rationale: Kiashiria kimehifadhiwa ili kuonyesha mkazo wa ‘mgeni huyu.’
theological_decisions:
- issue: Hadhi ya mtu aliyeponywa kama mtu wa nje kwa upande wa taifa na dini
  choice: mgeni huyu
  alternative: mtu huyu wa taifa jingine; mtu huyu asiye wa Israeli
  rationale: Tafsiri inahifadhi kinaya cha kwamba aliyerudi kumheshimu Mungu alikuwa mtu wa nje, bila kuongeza maelezo ya kimadhehebu. Ingawa muktadha unamtaja kuwa Msamaria, jina hilo halijaingizwa katika mstari huu kwa sababu halimo hapa katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na nahau ‘kumpa Mungu utukufu’ zimehifadhiwa.
