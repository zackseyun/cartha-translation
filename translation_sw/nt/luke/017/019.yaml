lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Muundo huu ni wa kawaida na wa asili katika masimulizi ya Kiswahili, na unaonyesha wazi kwamba Yesu alisema maneno hayo kwake bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: Ἀναστὰς
  choice: Inuka
  rationale: Hiki ni kitendo chenye nguvu ya amri kinachoandamana na amri inayofuata; “Inuka” ni kifupi, chenye heshima, na cha kawaida katika Kiswahili.
- source_word: πορεύου
  choice: uende
  rationale: “Uende” huendeleza kwa kawaida amri iliyoanza kwa “Inuka” na kuwasilisha maana ya kwenda bila kuongeza wazo la ziada kama “nenda zako.”
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya msingi na inayofaa zaidi hapa. Neno la Kigiriki linaweza pia kuonyesha tumaini au uaminifu, lakini katika muktadha huu mwitikio wa kumtumaini Yesu ndio unaoonekana zaidi.
- source_word: σέσωκέν
  choice: imekuokoa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa, kuponya, au kufanya mtu awe mzima. “Imekuokoa” huhifadhi upana wa maana na hali ya matokeo yanayoendelea iliyo katika wakati timilifu wa Kigiriki, hasa kwa kuwa wale kumi walikuwa tayari wametakaswa kimwili.
theological_decisions:
- issue: Maana ya σέσωκέν σε katika muktadha wa uponyaji
  choice: imekuokoa
  alternative: imekuponya; imekufanya uwe mzima
  rationale: Ingawa kitenzi kinaweza kurejelea uponyaji wa mwili, tofauti kati ya wale kumi waliotakaswa na yule mmoja aliyerudi kumtukuza Mungu inaruhusu maana pana zaidi. Tafsiri hii inadumisha mvutano kati ya uponyaji na wokovu badala ya kuufunga usemi katika maana moja tu.
- issue: Maana ya πίστις katika kauli ya Yesu
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Katika muktadha huu “imani” inaeleweka kuwa mwitikio wa mtu wa kumtumaini Yesu. Hata hivyo, uwezekano wa maana zinazohusiana kama tumaini au uaminifu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisasa, wa kawaida, na wenye heshima. Muundo “Inuka, uende” unasikika wa asili bila kuwa wa mazungumzo kupita kiasi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
