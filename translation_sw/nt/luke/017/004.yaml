  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: sw
  text: Na akikukosea mara saba kwa siku, na mara saba akarudi kwako[a] akisema, “Ninatubu,” utamsamehe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akuelekee tena.” Kitenzi cha Kigiriki kinaweza kumaanisha kurudi au kugeuka kuelekea mtu.
