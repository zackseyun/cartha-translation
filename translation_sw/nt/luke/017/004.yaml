lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: mara saba kwa siku
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha idadi ya matukio ndani ya siku, bila kuongeza wazo la siku fulani.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: akikukosea
  rationale: Katika muktadha huu, kitenzi pamoja na εἰς σέ humaanisha kumtendea mtu dhambi au kosa. ‘Akikukosea’ ni usemi wa kawaida na unaoeleweka kwa kosa linalomlenga msemaji.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: akakurudia
  rationale: ἐπιστρέφω inaweza kumaanisha kurudi au kugeuka. ‘Akakurudia’ inafaa katika muktadha wa mkosaji anayemjia tena aliyemkosea, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kishiriki unaoonyesha jambo analosema wakati wa kumrudia.
- source_word: Μετανοῶ
  choice: Ninatubu
  rationale: Huhifadhi maana ya kukiri toba, si huzuni au kuomba radhi tu, na pia inaakisi hali ya sasa ya kitenzi cha Kigiriki.
- source_word: ἀφήσεις αὐτῷ
  choice: utamsamehe
  rationale: Muundo wa wakati ujao wa Kiswahili unaakisi future indicative ya Kigiriki, ambayo katika muktadha huu ina nguvu ya agizo.
theological_decisions:
- issue: Nguvu ya ἀφήσεις iliyo katika future indicative
  choice: utamsamehe
  alternative: lazima umsamehe; msamehe
  rationale: Katika mafundisho haya, muundo huo ni agizo au wajibu, si utabiri tu. ‘Utamsamehe’ huhifadhi umbo la baadaye huku muktadha ukitoa nguvu ya amri; tanbihi inaweka wazi uwezekano wa kutafsiri wajibu huo moja kwa moja.
- issue: Maana ya Μετανοῶ
  choice: Ninatubu
  alternative: Ninasikitika; nimebadili nia
  rationale: Neno hilo linataja toba, si hisia ya masikitiko pekee. Tafsiri hii huhifadhi uzito wa kimaadili na kiroho bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akikukosea’ ni cha kawaida kuliko tafsiri ya neno kwa neno ya ‘akikutenda dhambi,’ na kinafaa kwa kosa linalofanywa dhidi ya mtu. Alama za tanbihi zimewekwa mara baada ya maneno yanayohusika.
