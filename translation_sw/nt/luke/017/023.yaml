  rationale: The revision removes the erroneous third-person plural object from the introductory verb, preserves the source’s terse paired location cries without adding ‘yuko,’ and leaves the object of ‘pursue/follow’ unstated in the main text. The footnote offers the more explicit, natural alternative while accurately noting the Greek ambiguity.
