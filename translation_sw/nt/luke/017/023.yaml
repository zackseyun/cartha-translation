review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly renders ὑμῖν (‘to you’) with the third-person plural object marker in “watawaambia.” Also, “yuko” supplies a person and existential assertion not expressed in the Greek deictic cries. The object of διώξητε is unstated and should not be fixed as ‘them’ in the main text where a natural objectless Swahili rendering is available.
  naturalness: “Watawaambia ninyi” is grammatical but unnecessarily marked. “Watawaambia” alone means ‘they will tell them,’ not ‘they will say to you.’ “Msiende wala msifuatilie” is concise, intelligible Standard East African Swahili in this warning context.
  terminology: “Tazama,” “kule,” “hapa,” and “msiende” are appropriate. “Msifuatilie” retains the broad sense of διώξητε without selecting a specific implicit object.
  issues:
  - severity: high
    issue: “watawaambia” does not represent ὑμῖν correctly.
    rationale: 'The -wa- object marker is third-person plural (‘them’). The Greek addresses the disciples/readers: ‘they will say to you.’'
  - severity: medium
    issue: “yuko” adds an unstated subject/person to the deictic exclamations.
    rationale: The Greek reads literally, ‘Look, there! Look, here!’ In context an alleged person is understood, but the wording itself does not state ‘he is.’
  - severity: medium
    issue: “msiwafuate” supplies a plural personal object for διώξητε.
    rationale: The Greek leaves the object unexpressed. The supplied ‘them’ narrows the possible reference to the speakers rather than preserving the warning’s syntactic openness.
  revised_text: Nao watawaambia, “Tazama, kule!” au, “Tazama, hapa!” Msiende wala msifuatilie.[a]
  revised_footnotes:
  - marker: a
    text: 'Au: “Msiende wala msiwafuate.” Kigiriki hakitaji waziwazi yambwa la kitenzi “fuatilia.”'
    reason: lexical_alternative
  revision_rationale: The revision removes the erroneous third-person plural object from the introductory verb, preserves the source’s terse paired location cries without adding ‘yuko,’ and leaves the object of ‘pursue/follow’ unstated in the main text. The footnote offers the more explicit, natural alternative while accurately noting the Greek ambiguity.
