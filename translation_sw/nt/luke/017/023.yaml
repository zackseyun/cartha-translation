  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: sw
  text: Nao watawaambia, “Tazama, kule!” au, “Tazama, hapa!” Msiende wala msifuatilie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Msiende wala msiwafuate.” Kigiriki hakitaji waziwazi yambwa la kitenzi “fuatilia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: watawaambia
  rationale: Kitenzi cha wakati ujao cha λέγω kinaanzisha maneno ya moja kwa moja; “watawaambia” ni Kiswahili cha kawaida na huonyesha wazi walengwa wa kauli.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuelekeza usikivu. “Tazama” lina hadhi, linaeleweka kwa urahisi, na linafaa kwa madai yanayoelekeza watu mahali fulani.
- source_word: ἐκεῖ / ὧδε
  choice: kule / hapa
  rationale: Jozi hii inahifadhi utofauti wa mahali pa mbali na pa karibu kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: μὴ ἀπέλθητε
  choice: Msiende
  rationale: Katazo hili linazuia kwenda mahali panapoonyeshwa. “Msiende” ni la asili katika muktadha bila kuongeza wazo maalumu la kutoka nje.
- source_word: μηδὲ διώξητε
  choice: wala msiwafuate
  rationale: διώκω hapa ina maana ya kufuata au kuandama. Kiswahili kwa kawaida huhitaji kiambishi cha yambwa; “-wa-” kinarejelea kwa kawaida wale wanaotoa madai, ingawa Kigiriki hakitaji yambwa waziwazi.
theological_decisions:
- issue: Yambwa lisilotajwa la διώξητε
  choice: Kutumia “msiwafuate” na kueleza katika tanbihi kwamba Kigiriki hakitaji yambwa
  alternative: “wala msifuatilie”
  rationale: Hii inaleta Kiswahili cha kawaida huku tanbihi ikihifadhi utata wa kimuundo wa Kigiriki; haibainishi zaidi ikiwa kinachofuatwa ni watu, madai, au taarifa zao.
- issue: Kinachodokezwa na kauli za mahali
  choice: “yuko kule / yuko hapa”
  alternative: “kule / hapa” bila kitenzi wala kiwakilishi
  rationale: Katika Kiswahili, “Tazama, kule!” pekee inaweza kueleweka kama agizo la kutazama upande fulani badala ya dai kwamba mtu yuko huko. “Yuko” hutoa maana inayodokezwa na muktadha bila kumtaja mhusika kwa jina au kuongeza tafsiri ya kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja; “kule/hapa” huhifadhi utofauti wa vielezi vya mahali, na tanbihi huhifadhi kutotajwa kwa yambwa katika Kigiriki.
