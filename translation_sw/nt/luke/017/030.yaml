  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: sw
  text: Ndivyo itakavyokuwa siku ambayo Mwana wa Adamu atakapofunuliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vivyo hivyo” au “Kwa namna hiyo hiyo.” Nahau ya Kigiriki inarejelea mifano iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Ndivyo itakavyokuwa
  rationale: Nahau hii inarejelea mifano iliyotangulia na kuonyesha kwamba mambo yatatokea kwa namna hiyo hiyo. Muundo huu ni wa asili katika Kiswahili na, pamoja na ἔσται, unadumisha mwelekeo wa wakati ujao.
- source_word: ἔσται
  choice: itakavyokuwa
  rationale: Kitenzi hiki ni cha wakati ujao wa εἰμί. Kimeunganishwa na kauli tangulizi katika muundo wa kawaida wa Kiswahili unaomaanisha ‘ndivyo mambo yatakavyokuwa.’
- source_word: ᾗ ἡμέρᾳ
  choice: siku ambayo
  rationale: Dativu hii yenye maana ya wakati hueleza siku hususa ambapo jambo litatokea. ‘Siku ambayo’ ni Kiswahili cha kawaida na huendeleza uhusiano wa sentensi bila kuongeza wazo lisilokuwapo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina maalumu ambalo Yesu hutumia kujitaja katika Injili. Tafsiri hii iliyozoeleka inadumisha mwangwi wake wa kimasiya na wa kiapokaliptiki unaohusiana na Danieli 7.
- source_word: ἀποκαλύπτεται
  choice: atakapofunuliwa
  rationale: Kitenzi ni cha kutendwa na humaanisha kufunuliwa au kuwekwa wazi. Muundo wa Kiswahili wenye ‘-takapo-’ unafaa ndani ya kishazi kinachotaja siku ya baadaye, huku ‘funuliwa’ ikidumisha wazo la udhihirisho badala ya kulibadili kuwa kuja tu.
theological_decisions:
- issue: Tafsiri ya jina la kieskatolojia ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ hudumisha jina linalotambulika katika Injili na uhusiano wake na Danieli 7. ‘Mwanadamu’ lingeweza kueleweka kama jina la jumla na hivyo kudhoofisha uzito wa kimasiya na wa kiapokaliptiki wa kauli hii.
- issue: Maana ya ἀποκαλύπτεται katika muktadha
  choice: atakapofunuliwa
  alternative: atakapokuja / atakapotokea
  rationale: Kitenzi chenyewe kinaeleza kufunuliwa au kuwekwa wazi, si mwendo wa kuja pekee. Ingawa muktadha unahusu udhihirisho wa mwisho wa Mwana wa Adamu, ‘atakapokuja’ kingeingiza wazo tofauti la kileksia, na ‘atakapotokea’ kingepunguza dhana ya kufunuliwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Ndivyo itakavyokuwa’ ni wa asili kwa wasomaji wa kawaida na unaunganisha mstari huu na mifano iliyotangulia bila kufafanua zaidi ya matini.
