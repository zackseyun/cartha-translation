  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: sw
  text: Je, anamshukuru mtumwa huyo kwa sababu alifanya yale aliyoamriwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi” badala ya “mtumwa” (Kigiriki doulos).
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Je, ...?
  rationale: μή pamoja na kitenzi cha hali elekezi huanzisha swali linalotarajia jibu la kukataa. Muundo wa kawaida wa swali kwa “Je” unafaa katika Kiswahili, huku muktadha ukionyesha kwamba jibu linalotarajiwa ni “hapana.”
- source_word: ἔχει χάριν
  choice: anamshukuru
  rationale: Nahau ἔχειν χάριν τινί hapa humaanisha kuwa na au kuonyesha shukrani kwa mtu; “anamshukuru” ni tafsiri ya kawaida na fupi.
- source_word: τῷ δούλῳ
  choice: mtumwa huyo
  rationale: δοῦλος katika mfano huu ni mtu aliye chini ya mamlaka ya bwana na mwenye wajibu wa kutekeleza maagizo. “Mtumwa” huhifadhi uzito wa hali hiyo kuliko “mtumishi”; “huyo” humrejelea mtu aliyetajwa katika muktadha.
- source_word: ὅτι
  choice: kwa sababu
  rationale: ὅτι huanzisha sababu inayodaiwa ya shukrani, hivyo “kwa sababu” ni kiunganishi cha wazi na cha asili.
- source_word: ἐποίησεν
  choice: alifanya
  rationale: ποιέω hapa hueleza kutekeleza maagizo; “alifanya” ni sahili, ya kawaida, na inaeleweka pamoja na kishazi kinachofuata.
- source_word: τὰ διαταχθέντα
  choice: yale aliyoamriwa
  rationale: Kirai hiki ni umbo la kushirikisha lililotumika kama nomino, yaani mambo yaliyoamriwa. “Yale aliyoamriwa” ni Kiswahili cha asili na huhifadhi wazo la amri bila kuongeza mtendaji wa amri.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika muktadha wa bwana na mtumwa
  choice: mtumwa
  alternative: mtumishi
  rationale: Hoja ya mfano inategemea hali ya mtu aliye chini ya mamlaka na mwenye wajibu wa kutii. “Mtumwa” huhifadhi tofauti hiyo ya mamlaka na hali halisi ya kijamii inayodhaniwa na mfano, bila kuifanya kuwa laini zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Swali limeachwa la balagha, likitarajia jibu la kukataa bila kuliongeza waziwazi.
