  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: sw
  text: Vivyo hivyo ninyi pia, mtakapofanya yote mliyoamriwa, semeni, “Sisi ni watumwa tusiostahili[a]; tumefanya yale tuliyowajibika kufanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wasio na faida” au “watumwa wasiofaa.” Kivumishi cha Kigiriki kinaweza kumaanisha kutokuwa na faida au kutokuwa na haki ya kudai malipo.
    reason: lexical_alternative
  - marker: b
    text: Au “tumefanya yaliyokuwa wajibu wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo ninyi pia
  rationale: Inaunganisha matumizi haya moja kwa moja na mfano uliotangulia na kuhifadhi msisitizo wa καὶ ὑμεῖς.
- source_word: ὅταν ποιήσητε
  choice: mtakapofanya
  rationale: Muundo huu wa Kiswahili unaonyesha tendo la wakati ujao litakalotimizwa kabla ya agizo la kusema.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: yote mliyoamriwa
  rationale: ‘Kuamriwa’ huhifadhi mamlaka iliyo katika διατάσσω, huku ‘yote’ ikitoa maana nzima kwa Kiswahili cha kawaida.
- source_word: λέγετε
  choice: semeni
  rationale: Ni agizo la moja kwa moja kwa wingi na linafaa katika muktadha huu wa mafundisho.
- source_word: Δοῦλοι
  choice: watumwa
  rationale: Mfano unaotangulia unahusu wazi uhusiano wa bwana na mtumwa; ‘watumwa’ huhifadhi hali hiyo ya kijamii na nguvu ya hoja kuliko ‘watumishi.’
- source_word: ἀχρεῖοί
  choice: tusiostahili
  rationale: Huwasilisha kwamba watumwa hawawezi kudai sifa au malipo ya ziada kwa kutimiza wajibu wao, bila kuamua kimya kimya kwamba wao hawana thamani kabisa. Tanbihi huhifadhi maana mbadala za ‘wasio na faida’ na ‘wasiofaa.’
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: yale tuliyowajibika kufanya
  rationale: ‘Kuwajibika’ huhifadhi maana ya deni au wajibu katika ὀφείλω kwa lugha ya sasa na iliyo wazi.
- source_word: πεποιήκαμεν
  choice: tumefanya
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu kwa kauli ya sasa.
theological_decisions:
- issue: Tafsiri ya δοῦλοι katika mfano wa uanafunzi
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha wa karibu ni wa bwana na mtumwa, kwa hiyo hali ya kutokuwa huru ni sehemu muhimu ya mfano. ‘Watumwa’ haiingizi fundisho la dhehebu bali huhifadhi nguvu ya lugha ya chanzo.
- issue: Maana ya ἀχρεῖοι
  choice: tusiostahili
  alternative: wasio na faida; wasiofaa
  rationale: Katika muktadha, hoja kuu ni kwamba kutii hakumpi mtu dai la kupata sifa au malipo ya ziada. Chaguo hili huepuka kuifanya kauli imaanishe bila shaka kwamba wanafunzi hawana thamani yoyote, huku tanbihi ikihifadhi upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni wa kawaida kwa wasomaji wengi, na alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya maandishi.
