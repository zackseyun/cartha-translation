  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: sw
  text: Ndipo Yesu akajibu, “Je, wale kumi hawakutakaswa[a]? Lakini wale tisa wako wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakufanywa safi?”
    reason: Njia nyingine ya kutafsiri ἐκαθαρίσθησαν kwa karibu zaidi na taswira ya kuwa safi.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ndipo Yesu akajibu
  rationale: Muundo huu ni fomula ya simulizi inayotanguliza maneno ya Yesu. Kiswahili cha kawaida hakihitaji kurudia ‘akajibu, akasema’; ‘Ndipo Yesu akajibu’ huonyesha mwendelezo wa simulizi na kuitikia kwake kwa lugha ya asili.
- source_word: Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν;
  choice: Je, wale kumi hawakutakaswa?
  rationale: Οὐχί huanzisha swali linalotarajia jibu la kukubali. Muundo ‘Je, ... hawaku-?’ unadumisha nguvu hiyo ya balagha. ‘Wale kumi’ hurejelea kundi maalumu lililotajwa katika muktadha bila kuongeza neno ‘wote,’ ambalo halijaandikwa wazi katika Kigiriki.
- source_word: ἐκαθαρίσθησαν
  choice: walitakaswa
  rationale: Kitenzi καθαρίζω humaanisha kusafisha au kufanya kuwa safi; katika habari ya ukoma kinahusisha kuondolewa kwa ugonjwa pamoja na hali ya unajisi. ‘Walitakaswa’ huhifadhi maana pana kuliko ‘waliponywa’ pekee.
- source_word: οἱ δὲ ἐννέα ποῦ;
  choice: Lakini wale tisa wako wapi?
  rationale: δέ hapa huleta tofauti kati ya yule mmoja aliyerudi na wale tisa. ‘Lakini’ huwasilisha tofauti hiyo kwa uwazi, na ‘wako wapi?’ ni Kiswahili cha kawaida kwa swali la mahali.
theological_decisions:
- issue: Maana ya καθαρίζω katika kuponywa kwa wenye ukoma
  choice: Imetafsiriwa ‘kutakaswa’
  alternative: kuponywa; kufanywa safi
  rationale: Neno la Kigiriki linaweza kujumuisha kuondolewa kwa ugonjwa na kurejeshwa katika hali ya usafi. ‘Kutakaswa’ huhifadhi mwingiliano huo bila kuifanya maana kuwa ya uponyaji wa mwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Swali la balagha na tofauti kati ya mmoja na wale tisa zimehifadhiwa.
