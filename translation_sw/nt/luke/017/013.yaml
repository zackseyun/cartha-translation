  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: sw
  text: Nao wakapaza sauti zao[a], wakisema, “Yesu, Mkuu[b], utuhurumie!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “wakainua sauti zao.”
    reason: lexical_alternative
  - marker: b
    text: “Mkuu” hutafsiri neno la Kigiriki epistata, namna ya kumwita mwenye mamlaka; si neno la kawaida la “Bwana” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi rahisi kinachoendeleza simulizi; “Nao” pia hudumisha kiwakilishi cha wazi αὐτοὶ bila kuongeza nguvu ya wakati.
- source_word: αὐτοὶ
  choice: wao (katika “Nao”)
  rationale: Kiwakilishi hicho kimetajwa wazi katika Kigiriki. Muundo “Nao” unawakilisha msisitizo wake kwa Kiswahili cha kawaida bila kutumia “wao wenyewe,” ambayo ingekuwa nzito kupita kiasi hapa.
- source_word: ἦραν φωνὴν
  choice: wakapaza sauti zao
  rationale: Ni nahau ya kuita kwa sauti kubwa. “Kupaza sauti” ni Kiswahili cha kawaida na hudumisha taswira ya kuinua sauti.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi hali ya kitenzi-shirikishi na kuunganika kwa kawaida na “wakapaza sauti zao.”
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Ni umbo la mwito la jina Ἰησοῦς; “Yesu” ndilo jina la kawaida katika Kiswahili.
- source_word: ἐπιστάτα
  choice: Mkuu
  rationale: Neno la kumwita mwenye mamlaka au usimamizi. “Mkuu” huonyesha mamlaka bila kulichanganya na κύριος, ambalo kwa kawaida hutafsiriwa “Bwana.”
- source_word: ἐλέησον
  choice: utuhurumie
  rationale: Ombi la moja kwa moja la huruma na msaada; “utuhurumie” ni la asili, la heshima, na lina uzito unaofaa katika Kiswahili.
- source_word: ἡμᾶς
  choice: -tu- katika “utuhurumie”
  rationale: Kiwakilishi cha yambwa ‘sisi’ huwakilishwa kwa kawaida na kiambishi cha yambwa -tu- katika kitenzi cha Kiswahili.
theological_decisions:
- issue: Tafsiri ya ἐπιστάτα kama cheo cha Yesu
  choice: Mkuu
  alternative: Bwana; Mwalimu
  rationale: Neno la Kigiriki ni ἐπιστάτης, si κύριος. “Bwana” lingefifisha tofauti hiyo na lingeweza kuingiza maana nzito zaidi ya kikristolojia kuliko neno lenyewe. “Mwalimu” nalo kwa kawaida huwakilisha διδάσκαλος. “Mkuu” hudumisha wazo la mamlaka bila kuyalinganisha maneno hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi taswira ya Kigiriki na tofauti ya istilahi za vyeo.
