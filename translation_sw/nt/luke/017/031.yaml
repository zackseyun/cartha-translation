id: LUK.17.31
reference: Luke 17:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: sw
  text: Siku hiyo, mtu yeyote atakayekuwa juu ya paa la nyumba[a], huku vitu vyake vikiwa ndani ya nyumba, asishuke kuvichukua; vivyo hivyo, aliye shambani asirudi nyuma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paa linalotajwa hapa ni paa tambarare la nyumba, ambalo katika mazingira hayo lilifikiwa na kutumiwa kama sehemu ya shughuli za nyumbani.
    reason: cultural_note
  - marker: b
    text: Au kwa kufafanua zaidi, “asirudi kuchukua vitu alivyoacha nyuma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku hiyo
  rationale: Hii ni njia ya kawaida na ya asili katika Kiswahili ya kuonyesha wakati maalumu unaotajwa.
- source_word: ὃς ἔσται
  choice: mtu yeyote atakayekuwa
  rationale: Huhifadhi maana ya jumla ya kiwakilishi pamoja na hali ya wakati ujao katika kitenzi.
- source_word: ἐπὶ τοῦ δώματος
  choice: juu ya paa la nyumba
  rationale: δώμα hapa ni paa tambarare la nyumba lililoweza kufikiwa na kutumiwa; tafsiri hii ni wazi kwa msomaji wa Kiswahili.
- source_word: τὰ σκεύη αὐτοῦ
  choice: vitu vyake
  rationale: Katika muktadha huu σκεύη humaanisha mali au vitu vinavyoweza kuchukuliwa. “Vitu vyake” ni ya kawaida na haibani maana kwa aina fulani ya mali.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: asishuke kuvichukua
  rationale: Huwasilisha katazo lenye nguvu na kusudi la kushuka, bila kuongeza kwamba lazima avibebe kwenda mahali pengine.
- source_word: ὁ ἐν ἀγρῷ
  choice: aliye shambani
  rationale: Ni usemi mfupi na wa asili unaomtaja mtu mwakilishi aliye shambani.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Hudumisha ulinganifu kati ya makatazo hayo mawili.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: asirudi nyuma
  rationale: Hii ni idiomu ya asili ya Kiswahili inayowasilisha kitendo cha kugeuka au kurudi kule alikotoka; tanbihi inadokeza maana inayoweza kuhusisha vilivyoachwa nyuma.
theological_decisions:
- issue: Taswira ya uharaka wa kieskatolojia
  choice: Kudumisha maagizo halisi ya kutoshuka na kutorudi nyuma katika siku hiyo
  alternative: Kuyafafanua kwa jumla kuwa onyo la kutoshikamana na mali
  rationale: Kigiriki kinatoa hali halisi na makatazo ya moja kwa moja. Kuyadumisha huepuka kuingiza mafunzo ya jumla yasiyosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “huku” huonyesha kwa uwazi kwamba vitu viko ndani wakati mtu yuko juu ya paa.
