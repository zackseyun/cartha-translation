id: LUK.17.22
reference: Luke 17:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: sw
  text: Kisha akawaambia wanafunzi[a], “Siku zinakuja ambapo mtatamani kuona mojawapo ya siku za Mwana wa Adamu[b], na hamtaiona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani kinasema “wanafunzi,” bila kuongeza wazi “wake.”
    reason: lexical_alternative
  - marker: b
    text: “Siku za Mwana wa Adamu” zinaweza kurejelea wakati wa kuwapo na kazi yake, au hasa kufunuliwa kwake wakati ujao; usemi wa Kiyunani hauwekei maana mipaka kamili.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Kisha akawaambia
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; “Kisha” ni ya kawaida katika Kiswahili. “Akawaambia” huwasilisha kwa kawaida tendo la kusema kwa watu waliotajwa.
- source_word: πρὸς τοὺς μαθητάς
  choice: wanafunzi
  rationale: Kiyunani kina kibainishi lakini hakina kiwakilishi wazi cha umilikaji; kwa hiyo tafsiri haiongezi “wake.”
- source_word: Ἐλεύσονται ἡμέραι
  choice: Siku zinakuja
  rationale: Huu ni usemi wa kinabii unaotaja wakati ujao; “Siku zinakuja” ni wa asili na huhifadhi msisitizo huo.
- source_word: ἐπιθυμήσετε
  choice: mtatamani
  rationale: Kitenzi hiki kinaonyesha hamu kubwa; “mtatamani” ni wazi, cha sasa, na chenye uzito unaofaa.
- source_word: μίαν τῶν ἡμερῶν
  choice: mojawapo ya siku
  rationale: 'Huhifadhi muundo wa sehemu katika Kiyunani: siku moja kutoka katika siku kadhaa.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: za Mwana wa Adamu
  rationale: Huhifadhi kwa uhalisi cheo anachotumia Yesu na mwangwi wake wa kiteolojia na wa maandiko.
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: kuona ... na hamtaiona
  rationale: “Kuona” ni tafsiri ya moja kwa moja na ya kawaida. “Na” huhifadhi καί bila kuongeza nguvu ya upinzani; kiambishi “-i-” kinarejelea siku mojawapo inayotamaniwa.
theological_decisions:
- issue: Maana ya “siku za Mwana wa Adamu”
  choice: Usemi umeachwa ukiwa mpana na wenye uzito wa kieskatolojia, bila kuufungamanisha na kipindi kimoja tu.
  alternative: Unaweza kumaanisha siku za huduma na kuwapo kwa Yesu duniani, au hasa wakati ujao wa kufunuliwa kwa Mwana wa Adamu.
  rationale: Muktadha unaruhusu mwangwi wa hamu ya kuwapo kwake na wa kufunuliwa kwake wakati ujao. Tafsiri halisi ya usemi huo huhifadhi mvutano huu badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupunguza uzito wa kinabii au utata halisi wa usemi.
