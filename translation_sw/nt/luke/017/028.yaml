  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: sw
  text: 'Vivyo hivyo, kama ilivyotokea katika siku za Loti: watu walikuwa wakila, wakinywa, wakinunua, wakiuza, wakipanda, na wakijenga.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Kielezi hiki kinaunganisha mfano wa Loti na ulinganisho uliotangulia na kuhifadhi maana ya kufanana kwa hali hizo.
- source_word: καθὼς
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho wa namna; “kama” ni la kawaida na la asili katika Kiswahili.
- source_word: ἐγένετο
  choice: ilivyotokea
  rationale: Kitenzi kina maana ya tukio lililotokea; muundo huu unaungana kwa ufasaha na “kama” bila kutumia lugha ya kizamani.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: katika siku za Loti
  rationale: Nahau hii ya wakati inaeleza kipindi kilichohusishwa na Loti na inadumisha usemi wa kibiblia unaoeleweka.
- source_word: ἤσθιον
  choice: walikuwa wakila
  rationale: Kauli ya wakati usiotimilika inaonyesha shughuli iliyokuwa ikiendelea au kufanywa kwa kawaida.
- source_word: ἔπινον
  choice: wakinywa
  rationale: Muundo wa “waki-” unaendeleza orodha ya shughuli za kawaida zilizokuwa zikiendelea.
- source_word: ἠγόραζον
  choice: wakinunua
  rationale: Hii ni tafsiri ya kawaida na wazi ya shughuli ya kibiashara inayoonyeshwa na kitenzi.
- source_word: ἐπώλουν
  choice: wakiuza
  rationale: Imewekwa sambamba na “wakinunua” ili kuhifadhi jozi ya shughuli za sokoni katika chanzo.
- source_word: ἐφύτευον
  choice: wakipanda
  rationale: Kitenzi kinarejelea shughuli halisi ya kilimo na muundo huu unaonyesha hali yake ya kuendelea.
- source_word: ᾠκοδόμουν
  choice: kujenga
  rationale: Katika muktadha huu kitenzi kina maana halisi ya kufanya ujenzi; “kujenga” ni kifupi na cha asili mwishoni mwa orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Msururu wa vitenzi vya wakati usiotimilika umetafsiriwa kwa “walikuwa waki-” kisha maumbo ya “waki-” ili kuhifadhi hali ya shughuli zinazoendelea bila kufanya sentensi kuwa nzito. Jina Λώτ limetolewa kwa umbo la Kiswahili “Loti.”
