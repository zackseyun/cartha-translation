base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: sw
  text: Kisha akawaambia wanafunzi wake, “Haiwezekani mambo ya kukwaza[a] yasije; lakini ole wake mtu yule ambaye kupitia kwake mambo hayo huja!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vikwazo,” “mambo yanayosababisha watu kutenda dhambi,” au “vishawishi vya kutenda dhambi.” Neno la Kigiriki σκάνδαλα linamaanisha mambo yanayowakwaza au kuwaangusha watu kimaadili au kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Kisha akawaambia
  rationale: δέ ni kiunganishi chepesi katika simulizi. “Kisha” linaendeleza simulizi kwa Kiswahili cha kawaida bila kulifanya kuwa neno la upinzani mkali; “akawaambia” linaeleza kwa kawaida tendo la kusema kwa wanafunzi.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” ni tafsiri ya kawaida ya μαθηταί, na “wake” linawakilisha wazi αὐτοῦ iliyomo katika matini ya Kigiriki.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Haiwezekani
  rationale: Tafsiri hii inadumisha muundo wa kauli ya Kigiriki kwamba kutotokea kwa mambo hayo hakuwezekani, badala ya kuigeuza moja kwa moja kuwa “hayana budi.”
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: vikwazo visije
  rationale: Muundo huu unaweka wazi kuwa jambo lisilowezekana ni kutokuja kwa σκάνδαλα. Kiswahili “visije” ni cha kawaida na kinadumisha ukanushaji wa kitenzi cha Kigiriki.
- source_word: σκάνδαλα
  choice: vikwazo
  rationale: “Vikwazo” kinadumisha kwa kiasi kikubwa picha ya jambo linalomkwaza au kumwangusha mtu, bila kufupisha maana iwe kukasirika tu au kuishia katika aina moja tu ya kishawishi. Tanbihi inaeleza upana wa maana ya kimaadili na kiroho.
- source_word: πλὴν οὐαὶ
  choice: lakini ole wake
  rationale: “Lakini” linaonyesha ugeuzi kutoka kwa kutoweza kuepukika kwa vikwazo hadi hukumu juu ya anayevipitisha; “ole wake” ni usemi wa kawaida na wenye uzito wa onyo.
- source_word: δι’ οὗ
  choice: yule ambaye vinakuja kupitia kwake
  rationale: Hii inadumisha nafsi ya umoja na wazo la Kigiriki la kitu kuja kupitia mtu fulani, bila kuongeza jinsia isiyohitajika wala kumfanya mtu huyo kuwa sababu ya moja kwa moja kwa namna ambayo matini haisemi wazi.
- source_word: ἔρχεται
  choice: vinakuja
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja, kinarejelea kwa dhana σκάνδαλα; Kiswahili kinahitaji upatanisho wa ngeli na “vikwazo,” kwa hiyo “vinakuja” ni laini na sahihi.
theological_decisions:
- issue: Maana ya σκάνδαλα katika mafundisho ya kimaadili
  choice: Imetafsiriwa “vikwazo” katika matini kuu
  alternative: mambo ya kukwaza; vishawishi vya kutenda dhambi; mambo yanayosababisha dhambi
  rationale: Neno hilo linaweza kumaanisha mambo yanayowafanya wengine wajikwae au waanguke kimaadili au kiroho. “Vikwazo” kinahifadhi picha na upana huo badala ya kuamua kimya kimya ikiwa mkazo ni kishawishi, kosa, au mtego.
- issue: Rejeleo la mtu mmoja katika δι’ οὗ
  choice: yule ambaye ... kupitia kwake
  alternative: mtu ambaye ... kupitia kwake; yeye ambaye ... kupitia kwake
  rationale: Tafsiri hii inahifadhi rejeleo la mwakilishi mmoja bila kuingiza jinsia mahususi isiyolazimu katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida huku ikihifadhi muundo wa kutowezekana katika Kigiriki na sitiari pana ya σκάνδαλα.
