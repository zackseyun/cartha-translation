  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: sw
  text: Kwa maana kama vile umeme unapomulika kutoka upande mmoja wa anga hadi upande mwingine[a], huangaza, ndivyo Mwana wa Adamu atakavyokuwa katika siku yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “kutoka sehemu moja iliyo chini ya mbingu hadi sehemu nyingine iliyo chini ya mbingu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “siku yake.” Usemi huu unamaanisha wakati unaohusishwa na Mwana wa Adamu, bila kuufafanua zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: Inadumisha nguvu ya ufafanuzi ya γάρ na kuanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: umeme unapomulika
  rationale: “Umeme” ni neno la kawaida kwa mwanga wa radi, na “unapomulika” linawasilisha tendo hai la kitenzi kishirikishi bila kulichanganya na ngurumo.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: kutoka upande mmoja wa anga hadi upande mwingine
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha mwendo unaoonekana kuvuka anga lote; tanbihi inahifadhi urudiaji wa karibu zaidi na muundo wa Kigiriki wa “chini ya mbingu.”
- source_word: λάμπει
  choice: huangaza
  rationale: Inatofautisha λάμπει na ἀστράπτουσα huku ikihifadhi uhusiano wa vitendo hivyo viwili vya mwanga.
- source_word: οὕτως ἔσται
  choice: ndivyo ... atakavyokuwa
  rationale: Inahifadhi muundo wa ulinganisho na wakati ujao kwa Kiswahili sanifu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka na iliyo wazi ya cheo hiki, bila kukifafanua kwa namna ya kimadhehebu.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: katika siku yake
  rationale: Inahifadhi kihusishi na umilikaji wa Kigiriki, na kuacha upeo wa “siku” ukiwa mpana kama ulivyo katika matini.
theological_decisions:
- issue: Maana ya “Mwana wa Adamu ... katika siku yake” katika muktadha wa mambo ya mwisho
  choice: katika siku yake
  alternative: wakati wa kuja kwake; siku ya hukumu
  rationale: Matini inasema tu “katika siku yake”; kuitaja moja kwa moja kuwa kuja kwake au siku ya hukumu kungeongeza ufafanuzi ambao haujaelezwa wazi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Anga” limetumiwa katika picha ya umeme kwa uasili; tanbihi inadumisha muundo halisi zaidi wa “chini ya mbingu.”
