  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: sw
  text: Bwana akasema, “Kama mngekuwa na imani kama punje ya haradali, mngeuambia mti huu wa mforosadi[a], ‘Ng’olewa, ukapandwe baharini,’ nao ungewatii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mti wa sikamini,” jina la jadi linalotokana na neno la Kigiriki; hapa linamaanisha aina ya mti wa mforosadi.
    reason: Mbadala wa kileksika unahifadhi jina la jadi huku ukitofautisha mti huu na mkuyu.
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya cheo κύριος katika simulizi la Luka, bila kuipunguza kuwa ‘Mwalimu’ au ‘Mkuu.’
- source_word: πίστιν
  choice: imani
  rationale: Katika muktadha huu neno linaelekea kumaanisha imani au tumaini linalomweelekea Mungu, si hasa uaminifu wa kitabia.
- source_word: ὡς κόκκον σινάπεως
  choice: kama punje ya haradali
  rationale: Huhifadhi ulinganisho wa ὡς bila kuufafanua kimya kimya kuwa unahusu udogo pekee.
- source_word: συκαμίνῳ
  choice: mti wa mforosadi
  rationale: συκάμινος ni mti wa mulberry; ‘mti wa mforosadi’ ni jina linaloeleweka kwa Kiswahili na halichanganyi mti huu na mkuyu.
- source_word: ἐλέγετε ἂν
  choice: mngeuambia
  rationale: Huwakilisha usemi wa uwezekano chini ya sharti kwa Kiswahili cha kawaida, huku kiambishi ‘-u-’ kikirejelea mti.
- source_word: Ἐκριζώθητι
  choice: Ng’olewa
  rationale: Huhifadhi amri ya kutendwa ya Kigiriki kwa usemi mfupi na wa asili.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: kupandwa baharini
  rationale: Huhifadhi picha ya kushangaza ya kupandwa baharini bila kuongeza wazo la ‘kuhamishwa’ ambalo halijaelezwa wazi.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: ungewatii
  rationale: ‘Kutii’ linafaa kwa muktadha wa amri; umoja wa ngeli ya mti na wingi wa ‘ninyi’ umehifadhiwa.
theological_decisions:
- issue: Maana ya πίστις katika usemi kuhusu tendo lisilowezekana
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unahusu kumtegemea Mungu kwa imani, lakini tafsiri haiongezi maelezo ya kimadhehebu kuhusu aina au kiwango cha imani.
- issue: Nguvu ya sharti Εἰ ἔχετε pamoja na ἄν
  choice: Kama mngekuwa na imani … mngeuambia
  alternative: Kama mna imani … mngeuambia
  rationale: Muundo wa Kiswahili wenye ‘-nge-’ unaonyesha hali ya kudhaniwa inayotolewa na vitenzi vyenye ἄν, bila kugeuza kauli kuwa ahadi ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Punje ya haradali’ na ‘mti wa mforosadi’ ni wazi kwa msomaji wa kawaida; ulinganisho na taswira ya kupandwa baharini zimehifadhiwa bila kufafanuliwa kupita maandishi.
