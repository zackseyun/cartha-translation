  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: sw
  text: Lakini siku ile Loti alipotoka Sodoma, moto na kiberiti vilinyesha kutoka mbinguni na kuwaangamiza wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Lakini siku ile
  rationale: Kirai hiki kinaonyesha wakati, ‘siku ile/alipotoka.’ δέ inahifadhiwa kwa ‘lakini’ ili kuendeleza utofautishaji wa upole na mfano uliotangulia.
- source_word: ἐξῆλθεν
  choice: alipotoka
  rationale: Kitenzi hiki kinaeleza kutoka mahali kwa namna ya moja kwa moja; muundo wa ‘alipotoka’ unaunganisha kwa kawaida sentensi ya wakati katika Kiswahili.
- source_word: Λὼτ
  choice: Loti
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: ἀπὸ Σοδόμων
  choice: Sodoma
  rationale: Jina la mahali linatolewa kwa umbo lake la kawaida la Kiswahili; pamoja na ‘alipotoka,’ maana ya ‘kutoka Sodoma’ iko wazi bila kurudia kihusishi.
- source_word: ἔβρεξεν
  choice: vilinyesha
  rationale: Kitenzi cha Kigiriki kimetumiwa kama mvua inayonyesha vitu vilivyotajwa. Kiswahili cha kawaida huruhusu ‘moto na kiberiti vilinyesha,’ bila kuongeza mtendaji ambaye hakutajwa wazi katika Kigiriki.
- source_word: πῦρ καὶ θεῖον
  choice: moto na kiberiti
  rationale: θεῖον ni salfa/kiberiti. ‘Kiberiti’ ni neno la kawaida na linaloeleweka katika Kiswahili, na linahifadhi taswira ya Mwanzo 19:24.
- source_word: ἀπ’ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: ‘Mbinguni’ huhifadhi nahau ya kibiblia na mwangwi wa simulizi la Mwanzo, bila kufafanua zaidi ya maandishi.
- source_word: ἀπώλεσεν πάντας
  choice: na kuwaangamiza wote
  rationale: ἀπόλλυμι hapa ina maana ya kuangamiza. Kiambishi ‘-wa-’ kinaonyesha watu wanaorejelewa, na ‘wote’ kinawakilisha πάντας.
theological_decisions:
- issue: Utoaji wa θεῖον katika muktadha wa hukumu
  choice: kiberiti
  alternative: salfa
  rationale: ‘Kiberiti’ ni neno la Kiswahili linalotambulika katika usemi wa kibiblia na linafikisha maana ya elementi ya salfa bila kupunguza taswira ya hukumu.
- issue: Utoaji wa οὐρανός
  choice: mbinguni
  alternative: angani
  rationale: ‘Mbinguni’ huhifadhi nahau ya Maandiko na uhusiano na Mwanzo 19:24. Hailazimishi ufafanuzi wa ziada kuhusu namna ya hukumu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inahifadhi mfuatano wa matukio pamoja na taswira kali ya maandishi ya Kigiriki.
