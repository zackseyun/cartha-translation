  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: sw
  text: Lakini ni nani kati yenu ambaye, akiwa na mtumwa[a] anayelima au kuchunga mifugo, atamwambia anapoingia kutoka shambani, “Njoo mara moja, uketi ule[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi”; neno la Kigiriki doulos linamaanisha mtumwa aliye chini ya mamlaka ya bwana, si mfanyakazi wa kuajiriwa.
    reason: alternative_reading
  - marker: b
    text: “Uketi ule” hurejelea kula; kitenzi cha Kigiriki hueleza desturi ya kale ya kujilaza wakati wa mlo.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: mtumwa
  rationale: Neno hili humaanisha mtu aliye chini ya mamlaka ya bwana wake, si mfanyakazi wa kuajiriwa. “Mtumwa” linahifadhi uzito wa kijamii na tofauti ya mamlaka iliyo muhimu katika mfano huu.
- source_word: ἀροτριῶντα
  choice: anayelima
  rationale: Kitenzi kinarejelea kazi ya kulima kwa jembe; “anayelima” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ποιμαίνοντα
  choice: kuchunga mifugo
  rationale: Kitenzi humaanisha kufanya kazi ya mchungaji au kutunza kundi. “Kuchunga mifugo” ni cha asili katika Kiswahili na hakiongezi aina ya mnyama ambayo Kigiriki hakuitaji.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: anaporudi kutoka shambani
  rationale: Kirai kinaonyesha wakati mtumwa anapoingia baada ya kazi ya shambani. “Anaporudi kutoka shambani” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐρεῖ αὐτῷ
  choice: atamwambia mtumwa huyo
  rationale: Hutoa kwa uwazi maana ya wakati ujao ya “atamwambia”; kurudia “mtumwa huyo” huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: Εὐθέως
  choice: mara moja
  rationale: Huhifadhi wazo la kutenda bila kuchelewa na ni usemi wa kawaida wa Kiswahili.
- source_word: παρελθὼν
  choice: Njoo
  rationale: Katika muundo huu, tendo la kuja linaambatana na amri ya kuchukua nafasi ya kula; “Njoo” ni ya asili na huhifadhi wazo la kusogea.
- source_word: ἀνάπεσε
  choice: ujilaze mezani ule
  rationale: Kitenzi kinarejelea kujilaza kwa ajili ya mlo kulingana na desturi ya kale. Tafsiri hii huhifadhi picha ya kihistoria, huku tanbihi ikifafanua maana yake.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mazingira ya nyumba ya mfano
  choice: mtumwa
  alternative: mtumishi
  rationale: Hoja ya mfano inategemea uhusiano usio sawa wa mamlaka kati ya bwana na mtumwa. “Mtumwa” huhifadhi nguvu hiyo ya kijamii na ya balagha bila kuingiza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, huku virai vikifanywa vya kawaida kwa msomaji wa leo. Alama zote za tanbihi zimewekwa katika matini.
