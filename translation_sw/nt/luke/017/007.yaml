  terminology: “Mtumwa” ni sahihi kwa δοῦλος katika muktadha huu na tanbihi yake inaeleza mbadala bila kupunguza nguvu ya kijamii ya neno. “Kuchunga mifugo” kwa ποιμαίνειν ni pana ipasavyo, kwa kuwa Kigiriki hakitaji aina ya wanyama.
