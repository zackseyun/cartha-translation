  to: Lakini ni nani kati yenu ambaye, akiwa na mtumwa[a] anayelima au kuchunga mifugo, atamwambia anapoingia kutoka shambani, “Njoo mara moja, uketi ule[b]”?
  rationale: Marekebisho yanaondoa usemi usio wa kawaida “ujilaze mezani ule,” yanafanya uhusiano wa kisarufi katika swali la balagha uwe wazi, na yanahifadhi dokezo la kihistoria la kula kwa kujilaza katika tanbihi. Maana ya kifungu, ikiwemo udokezo wa mlo katika ἀνάπεσε, haijabadilishwa.
