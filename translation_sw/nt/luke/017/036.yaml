  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: sw
  text: Watu wawili[a] watakuwa shambani; mmoja atachukuliwa, na mwingine ataachwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki, zikiwemo Sinaiticus na Vaticanus za karne ya nne, wala katika tafsiri za kale za Kikopti. Hata hivyo, unapatikana katika mapokeo ya Magharibi, kama vile Codex Bezae ya karne ya tano, katika mapokeo ya Kibizanti ya walio wengi, na katika Vulgata ya Kilatini. Huenda waandishi wa nakala wa baadaye waliuongeza ili kupatanisha kifungu hiki na Mathayo 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: Δύο
  choice: Watu wawili
  rationale: Ingawa Kigiriki kinasema tu “wawili,” Kiswahili cha kawaida huhitaji kutaja “watu” ili sentensi iwe wazi na ya asili bila kubainisha jinsia isiyotajwa wazi katika neno hili.
- source_word: παραληφθήσεται
  choice: atachukuliwa
  rationale: Kauli hii ya kutendwa hudumisha maana ya kuchukuliwa au kuambatanishwa na mwingine, na pia huhifadhi kutokubainika kwa anayemchukua na hatima yake.
- source_word: ἀφεθήσεται
  choice: ataachwa
  rationale: Hutoa tofauti ya moja kwa moja na “atachukuliwa” na kuhifadhi maana ya kuachwa bila kuamua ikiwa ni kuachwa nyuma, kusamehewa, au kutelekezwa.
- source_word: ὁ ἕτερος
  choice: mwingine
  rationale: Katika jozi iliyotajwa tayari, “mwingine” humaanisha mtu wa pili kati ya hao wawili kwa Kiswahili cha asili.
- source_word: ἐν τῷ ἀγρῷ
  choice: shambani
  rationale: Ni usemi wa kawaida na sahihi kwa mahali pa kazi ya kilimo, unaolingana na maana ya ἀγρός katika muktadha huu.
theological_decisions:
- issue: Utambulisho na hatima ya anayechukuliwa na anayeachwa
  choice: Kutumia “atachukuliwa” na “ataachwa” bila maelezo ya ziada
  alternative: Kufafanua kuwa mmoja anaokolewa au anahukumiwa, na mwingine anaachwa nyuma
  rationale: Mstari wenyewe hautaji wazi nani anayechukua wala kama kuchukuliwa au kuachwa ni wokovu au hukumu; tafsiri inadumisha mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watu wawili” ni wazi na jumuishi; miundo ya kauli ya kutendwa inalinda kutokubainika kwa mtendaji katika Kigiriki.
