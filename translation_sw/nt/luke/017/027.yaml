base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: sw
  text: Walikuwa wakila, wakinywa, wakioa na wakiolewa,[a] mpaka siku ile Noa alipoingia ndani ya safina, na gharika ikaja ikawaangamiza wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa ufupi zaidi, “walikuwa wakifunga ndoa.” Kigiriki kinatofautisha vitenzi viwili: kimoja cha kutenda (“wakioa”) na kingine cha kutendwa (“wakiolewa”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον
  choice: walikuwa wakila
  rationale: Muundo wa ‘walikuwa waki-’ unaonyesha tendo la kawaida lililokuwa likiendelea wakati uliopita, kama inavyodokezwa na njeo ya Kigiriki.
- source_word: ἔπινον
  choice: wakinywa
  rationale: Inaendeleza mfululizo wa matendo ya kawaida yaliyokuwa yakiendelea, kwa Kiswahili cha asili bila kurudia ‘walikuwa’.
- source_word: ἐγάμουν
  choice: wakioa
  rationale: Kitenzi hiki ni cha kutenda na katika muktadha huu kwa kawaida humaanisha kuchukua mwenzi wa ndoa; ‘kuoa’ hukitofautisha na kitenzi kinachofuata.
- source_word: ἐγαμίζοντο
  choice: kuolewa
  rationale: Kauli ya kutendwa inadumishwa kwa ‘kuolewa,’ na hivyo kuhifadhi utofauti wa vitenzi viwili vya Kigiriki kuhusu ndoa.
- source_word: ἄχρι ἧς ἡμέρας
  choice: mpaka siku ile
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kikomo cha muda wa matendo yaliyokuwa yakiendelea.
- source_word: εἰσῆλθεν
  choice: alipoingia ndani ya
  rationale: Huwasilisha tukio lililokamilika na kuunganisha kwa kawaida kishazi cha wakati na ‘mpaka siku ile.’
- source_word: κιβωτόν
  choice: safina
  rationale: ‘Safina’ ndilo neno la kawaida la kibiblia la chombo cha Noa, tofauti na mashua ya kawaida.
- source_word: κατακλυσμός
  choice: gharika
  rationale: Ni neno la kawaida na fasaha la Kiswahili kwa mafuriko makubwa ya simulizi la Noa.
- source_word: ἀπώλεσεν πάντας
  choice: kuwaangamiza wote
  rationale: Kiambishi ‘wa-’ kinaweka wazi kuwa wanaorejelewa ni watu, huku ‘wote’ kikihifadhi ukamilifu wa hukumu.
theological_decisions:
- issue: Kutafsiri vitenzi viwili vinavyohusu ndoa kwa namna tofauti
  choice: wakioa na kuolewa
  alternative: wakifunga ndoa
  rationale: Kigiriki kina vitenzi viwili tofauti, kimoja cha kutenda na kingine cha kutendwa. Kuvitofautisha kunahifadhi muundo wa chanzo bila kuongeza maana ya kimadhehebu.
- issue: Hali ya matendo katika mfululizo wa mwanzo
  choice: walikuwa wakila, wakinywa, wakioa na kuolewa
  alternative: walikula, walikunywa, walioa na kuolewa
  rationale: Vitenzi vya Kigiriki vya wakati usiotimilifu vinaonyesha shughuli za kawaida zilizoendelea hadi hukumu ilipofika ghafla.
- issue: Uhusiano wa kuja kwa gharika na matokeo yake
  choice: Ndipo gharika ikaja na kuwaangamiza wote
  alternative: na gharika ikaja, ikawaangamiza wote
  rationale: ‘Ndipo’ huonyesha kwa kawaida mfuatano wa ghafla baada ya Noa kuingia safinani, bila kubadili maana ya kitheolojia ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘walikuwa waki-’ unahifadhi hali endelevu ya vitenzi vya Kigiriki, huku vitenzi vinavyofuata vikishirikiana na kisaidizi hicho kwa mtiririko wa asili. ‘Safina’ na ‘gharika’ ni maneno yanayotambulika kirahisi katika simulizi la Noa.
