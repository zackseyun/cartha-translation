  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: sw
  text: Wala hawatasema, “Tazama, hapa!” au, “Kule!” Kwa maana tazama, ufalme wa Mungu umo katikati yenu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umo ndani yenu.” Kirai cha Kigiriki kinaweza kumaanisha kuwa ndani ya mtu au kuwa miongoni mwa watu, yaani “katikati yenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Wala hawatasema
  rationale: Huendeleza ukanushaji wa sentensi iliyotangulia kwa Kiswahili cha kawaida na kuhifadhi wakati ujao wa ἐροῦσιν.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: “Tazama, uko hapa!” au, “Uko kule!”
  rationale: Tazama ni mwito wa kuuelekeza usikivu; uko hapa/uko kule hufanya rejeo la ufalme lieleweke kwa kawaida huku likihifadhi ulinganifu wa vielezi vya mahali.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli inayofuata ndiyo sababu ya kutotafuta ufalme kwa kuonyeshwa mahali fulani.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi mwito wa msisitizo katika Kigiriki kwa lugha ya sasa yenye heshima.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri iliyo wazi na ya kawaida inayohifadhi maana za utawala na milki bila kuamua upande mmoja tu.
- source_word: ἐντὸς ὑμῶν
  choice: umo katikati yenu
  rationale: Muktadha una hadhira ya wingi na unazungumzia mahali panapoweza kuonyeshwa; tafsiri hii huonyesha uwepo miongoni mwao. Maana nyingine inayowezekana imehifadhiwa katika tanbihi.
- source_word: ἐστιν
  choice: umo
  rationale: Kitenzi hiki cha mahali ni cha kawaida katika Kiswahili na huwasilisha kuwapo kwa ufalme katikati yao.
theological_decisions:
- issue: Maana ya ἐντὸς ὑμῶν
  choice: ufalme wa Mungu umo katikati yenu
  alternative: ufalme wa Mungu umo ndani yenu
  rationale: Kirai cha Kigiriki kinaweza kueleweka kwa maana ya ndani au kwa maana ya kuwa miongoni mwa kundi. Kwa kuwa Yesu anazungumza na watu wengi na muktadha unahusu kutaja mahali, maana ya “katikati yenu” imewekwa katika matini; uwezekano wa “ndani yenu” umehifadhiwa katika tanbihi ili kutoondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wala hawatasema” huunganisha mstari huu na ukanushaji uliotangulia; “tazama” huhifadhi msisitizo wa ἰδοὺ bila kutumia lugha ya kizamani.
