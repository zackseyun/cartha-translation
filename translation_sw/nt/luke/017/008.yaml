id: LUK.17.8
reference: Luke 17:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: sw
  text: Badala yake, je, hatamwambia, ‘Niandalie chakula, jifunge vazi lako kwa ajili ya kazi[a], kisha unihudumie mpaka nitakapokuwa nimekula na kunywa[b]; baada ya hayo, wewe utakula na kunywa’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, funga au kunja vazi lako ili uwe tayari kuhudumu.
    reason: cultural_note
  - marker: b
    text: Au, “mpaka nitakapokula na kunywa.” Kigiriki kinaweza kutafsiriwa kwa namna hiyo ya moja kwa moja; maneno “nitakapokuwa nimekula na kunywa” yanakazia kwamba kitendo hicho kitakamilika kabla ya wewe kula na kunywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Badala yake, je, hata-
  rationale: Muundo huu unaanzisha swali la balagha lenye kutarajia jibu la kukubali na unaonyesha tofauti na uwezekano uliotajwa katika mstari uliotangulia.
- source_word: ἐρεῖ αὐτῷ
  choice: hatamwambia
  rationale: Huhifadhi maana ya msingi ya ‘atasema kwake’ kwa Kiswahili cha kawaida na cha asili.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Niandalie chakula cha jioni
  rationale: δειπνέω inahusu kula mlo wa jioni; muundo wa Kiswahili unaeleza kwa kawaida kile ambacho mwenye kusema anataka aandalie.
- source_word: περιζωσάμενος
  choice: jifunge tayari kwa kazi
  rationale: Huhifadhi picha ya kujifunga vazi huku ikionyesha kusudi lake la kujiandaa kufanya huduma; tanbihi inaeleza desturi hiyo.
- source_word: διακόνει μοι
  choice: unihudumie
  rationale: Katika muktadha huu kitenzi kinamaanisha kumhudumia mtu mezani, bila kukipa maana maalumu ya kikanisa.
- source_word: ἕως φάγω καὶ πίω
  choice: mpaka nitakapokuwa nimekula na kunywa
  rationale: Muundo huu unaonyesha kikomo cha wakati na kukamilika kwa kula na kunywa kabla ya zamu ya mwingine.
- source_word: μετὰ ταῦτα
  choice: baada ya hayo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: wewe utakula na kunywa
  rationale: Wakati ujao umehifadhiwa, na ‘wewe’ limetajwa wazi ili kuakisi msisitizo wa σύ.
theological_decisions:
- issue: Istilahi ya nafasi ya kijamii katika mfano
  choice: Kutotaja ‘mtumishi’ au ‘mtumwa’ ndani ya mstari huu, bali kutumia viwakilishi kama Kigiriki kinavyofanya.
  alternative: Kuongeza ‘mtumishi huyo’ au ‘mtumwa huyo’ kwa ufafanuzi.
  rationale: Ingawa muktadha wa mstari uliotangulia unamtaja δοῦλος, mstari huu wenyewe unatumia viwakilishi na amri. Kutoongeza nomino kunahifadhi ushahidi wa chanzo bila kuficha uhusiano unaoonekana katika amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa; lugha ya huduma ni ya kawaida, si ya kikanisa. Alama zote za tanbihi zimewekwa katika matini kuu.
