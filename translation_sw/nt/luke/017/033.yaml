id: LUK.17.33
reference: Luke 17:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: sw
  text: Yeyote atakayetafuta kuuhifadhi uhai wake[a] ataupoteza, lakini yeyote atakayeupoteza ataudumisha hai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yake.” Hapa neno la Kigiriki ψυχή huenda linamaanisha uhai wa mtu au mtu mwenyewe, badala ya nafsi isiyo ya mwili.
    reason: lexical_alternative
  - marker: b
    text: Au, “atauhifadhi ukiwa hai”; kwa kawaida, “atauokoa.” Kitenzi cha Kigiriki humaanisha kudumisha au kuhifadhi kitu kikiwa hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: atakayetafuta
  rationale: Kitenzi hiki kinaonyesha jitihada yenye kusudi, si tamanio tu; ‘atakayetafuta’ ni ya kawaida na inadumisha maana hiyo.
- source_word: ψυχὴν
  choice: uhai
  rationale: Katika muktadha huu ψυχή inaelekea kumaanisha uhai wa mtu au yeye mwenyewe, si sehemu isiyo ya mwili peke yake. ‘Uhai’ pia inaendana na wazo la kuupoteza na kuudumisha hai.
- source_word: περιποιήσασθαι
  choice: kuuhifadhi
  rationale: Infinitivu ya kati ina maana ya kuhifadhi au kujipatia usalama wa kitu kwa ajili yako mwenyewe; ‘kuuhifadhi’ ni wazi na ya kawaida katika Kiswahili.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ataupoteza / atakayeupoteza
  rationale: ‘Kupoteza’ inadumisha kwa uthabiti kinaya cha usemi huu bila kuongeza maelezo ya kitafsiri kama ‘kuutoa’ au ‘kuangamiza.’
- source_word: ζῳογονήσει
  choice: ataudumisha hai
  rationale: ζῳογονέω humaanisha kuendeleza au kuhifadhi kitu kikiwa hai. ‘Ataudumisha hai’ inaonyesha wazi tofauti na ‘ataupoteza’ bila kuifananisha tu na kitenzi cha kawaida cha ‘kuokoa.’
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Yeyote atakaye... lakini yeyote atakaye...
  rationale: Muundo huu unaeleza sharti la jumla, na δέ hapa huonyesha tofauti; ‘lakini’ inadhihirisha ulinganifu wa kinaya.
theological_decisions:
- issue: Maana ya ψυχή katika usemi huu wa Yesu
  choice: Imetafsiriwa ‘uhai’
  alternative: nafsi
  rationale: Muktadha unahusu mtu kujaribu kujihifadhi katika wakati wa hukumu na kinaya cha kuupoteza uhai ili hatimaye ubaki hai. ‘Nafsi’ lingeweza kueleweka kwa namna finyu kuwa sehemu ya mtu isiyo ya mwili, jambo ambalo muktadha haulazimishi.
- issue: Tafsiri ya ζῳογονήσει
  choice: ataudumisha hai
  alternative: atauokoa; atauhifadhi
  rationale: Kitenzi cha Kigiriki si kitenzi cha kawaida cha ‘kuokoa,’ bali kina maana ya kudumisha au kuhifadhi kitu kikiwa hai. Tafsiri hii inaacha mkazo huo uwe wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Uhai’ umetumiwa badala ya ‘maisha’ ili viwakilishi vya umoja virejelee wazi nomino hiyo na kudumisha ulinganifu wa sentensi.
