  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: sw
  text: Wanawake wawili watakuwa wakisaga pamoja[a]; mmoja atachukuliwa[b], lakini mwingine ataachwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pamoja.” Kirai cha Kigiriki kinaweza kumaanisha “pamoja” au “mahali pamoja.”
    reason: lexical_alternative
  - marker: b
    text: Neno “atachukuliwa” lenyewe halibainishi ikiwa kuchukuliwa huko ni kwa wokovu au kwa hukumu; maana hiyo huamuliwa na muktadha mpana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: watakuwa
  rationale: Wakati ujao wa εἰμί unaanzisha tukio; pamoja na kishirikishi kinachofuata, “watakuwa wakisaga” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati ujao.
- source_word: δύο / ἀλήθουσαι
  choice: wanawake wawili wakisaga
  rationale: δύο ni “wawili,” na umbo la kike la ἀλήθουσαι linaonyesha kwamba wanaotajwa ni wanawake. Kitenzi kinamaanisha kusaga, kwa kawaida nafaka.
- source_word: ἐπὶ τὸ αὐτό
  choice: pamoja
  rationale: Kirai hiki kinaweza kumaanisha kuwa pamoja au kuwa mahali pamoja; “pamoja” ni cha asili katika muktadha huu huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: παραλημφθήσεται
  choice: atachukuliwa
  rationale: Huhifadhi hali ya kutendwa na maana ya msingi bila kuamua ikiwa kuchukuliwa huko ni kwa wokovu au kwa hukumu.
- source_word: ἡ δὲ ἑτέρα
  choice: lakini mwingine
  rationale: δέ huonyesha utofautishaji, na ἑτέρα humtaja mwanamke wa pili kati ya wale wawili.
- source_word: ἀφεθήσεται
  choice: ataachwa
  rationale: Ni tafsiri ya moja kwa moja ya hali ya kutendwa, bila kuongeza wazo la kuachwa nyuma au kutelekezwa.
theological_decisions:
- issue: Ikiwa kuchukuliwa na kuachwa kunapaswa kutafsiriwa kuwa wokovu au hukumu.
  choice: “mmoja atachukuliwa, lakini mwingine ataachwa” bila kufafanua matokeo ya kitheolojia
  alternative: “mmoja atachukuliwa kwa hukumu na mwingine ataokolewa,” au “mmoja atachukuliwa kwa wokovu na mwingine ataachwa kwa hukumu”
  rationale: Mstari wenyewe unaeleza kutenganishwa tu. Maana ya kuchukuliwa na kuachwa inabaki kujulikana kutokana na muktadha mpana na inabishaniwa; kwa hiyo tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watakuwa wakisaga” ni usemi wa kawaida unaoonyesha tendo linaloendelea katika wakati ujao; “wanawake” imewekwa wazi kwa sababu kishirikishi cha Kigiriki ni cha kike.
