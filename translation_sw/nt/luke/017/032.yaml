  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: sw
  text: Mkumbukeni mke wa Lutu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii ni rejeo kwa Mwanzo 19:26, ambapo mke wa Lutu alitazama nyuma wakati wa maangamizi ya Sodoma.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Mkumbukeni
  rationale: Kitenzi hiki ni amri ya wakati wa sasa kwa wingi. “Mkumbukeni” ni Kiswahili cha kawaida na cha moja kwa moja kinachowahimiza wasikilizaji wote kumweka mtu huyo na yaliyompata akilini.
- source_word: τῆς γυναικὸς
  choice: mke
  rationale: Ingawa γυνή inaweza kumaanisha “mwanamke” au “mke,” uhusiano wake na jina Loti hapa unaonyesha wazi maana ya “mke.” Muundo “mke wa Loti” ni wa asili katika Kiswahili na pia unafuata kwa karibu muundo wa Kigiriki.
- source_word: Λώτ
  choice: Loti
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
theological_decisions:
- issue: Namna ya kutoa onyo linalorejelea simulizi la Mwanzo
  choice: Mkumbukeni mke wa Loti.
  alternative: Mwekeni akilini mke wa Loti.
  rationale: Tafsiri imehifadhi amri fupi na ya moja kwa moja ya Yesu bila kufafanua ndani ya mstari jambo ambalo chanzo kimeliacha kuwa dokezo. Maelezo ya tukio la Mwanzo yametolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima, ya sasa, na inayoeleweka kwa urahisi. Tanbihi ya Kiingereza kuhusu muundo halisi “the wife of Lot” haikuhitajika kwa kuwa “mke wa Loti” ndiyo muundo wa kawaida wa Kiswahili na pia unaakisi genitivi ya Kigiriki.
