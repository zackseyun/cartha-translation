  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: sw
  text: Na kama vile ilivyotukia katika siku za Noa, ndivyo itakavyokuwa pia katika siku za Mwana wa Adamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanadamu.” Cheo hiki cha Kigiriki ambacho kwa kawaida hutafsiriwa “Mwana wa Adamu” huenda kikawa na mwangwi wa Danieli 7; hapa kimehifadhiwa kwa sababu ya maana yake iliyozoeleka ya kimasiya na wa mwisho wa nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Kifungu hiki kinaanzisha ulinganisho wenye mkazo; “kama vile” ni cha kawaida na huendana vizuri na “ndivyo.”
- source_word: ἐγένετο
  choice: ilivyotukia
  rationale: Kitenzi hiki hapa kinarejelea mambo yaliyotokea wakati wa Noa. “Ilivyotukia” kinahifadhi maana ya tukio kwa lugha ya sasa bila kutumia msemo wa kizamani.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: katika siku za Noa
  rationale: Huu ni msemo wa wakati ulio wazi na wa kawaida katika Kiswahili, huku ukifuata muundo wa Kigiriki kwa karibu.
- source_word: οὕτως
  choice: ndivyo
  rationale: Neno hili linaanzisha upande wa pili wa ulinganisho; “ndivyo” ni la asili katika muundo “kama vile … ndivyo …”
- source_word: ἔσται
  choice: itakavyokuwa
  rationale: Linahifadhi maana ya wakati ujao ya hali bila kuongeza maelezo kuhusu namna matukio yatakavyotokea.
- source_word: καὶ
  choice: pia
  rationale: “Pia” linadumisha upanuzi na mkazo wa καί ya pili katika ulinganisho.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika mapokeo ya Kibiblia ya Kiswahili; linahifadhi muundo wa maneno na mwangwi unaowezekana wa Danieli 7 bila kuufanya msemo huo kuwa maelezo ya kawaida tu kuhusu binadamu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la cheo τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” linahifadhi jina la cheo la Kikristo lililozoeleka, umbo la msemo wa Kigiriki, na mwangwi wake wa kimasiya na wa matukio ya mwisho unaowezekana kutoka Danieli 7. “Mwanadamu” linaweza kueleza ubinadamu kwa ufasaha zaidi, lakini linaweza kufifisha matumizi yake kama jina la cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa “kama vile … ndivyo …” unatoa ulinganisho wa asili na wazi. Alama ya tanbihi imewekwa baada ya “Mwana wa Adamu,” ambako maelezo yake yanahusika.
