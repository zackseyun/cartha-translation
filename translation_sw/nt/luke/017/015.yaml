  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: sw
  text: Lakini mmoja wao, alipoona kwamba ameponywa, alirudi huku akimtukuza Mungu kwa sauti kubwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Lakini mmoja wao
  rationale: Kirai hiki kina maana ya sehemu ya kundi, ‘mmoja wao.’ δέ hapa inaonyesha tofauti ya kimasimulizi kati yake na wale wengine tisa; ‘Lakini’ ni unganisho la kawaida na la asili katika Kiswahili.
- source_word: ἰδὼν
  choice: alipoona
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha kuona kulikotangulia au kuambatana kwa karibu na kurudi kwake. ‘Alipoona’ huwasilisha uhusiano huo wa wakati kwa Kiswahili cha asili bila kuueleza kupita kiasi.
- source_word: ὅτι ἰάθη
  choice: kwamba ameponywa
  rationale: ἰάθη ni hali tendwa ya ἰάομαι na humaanisha kuponywa. ‘Amـeponywa’ huonyesha kwamba uponyaji ulikuwa umetimia na matokeo yake yalionekana alipoutambua.
- source_word: ὑπέστρεψεν
  choice: alirudi
  rationale: Katika masimulizi, ὑποστρέφω kwa kawaida humaanisha kurudi. ‘Alirudi’ ni fupi, wazi, na ya kawaida katika Kiswahili.
- source_word: μετὰ φωνῆς μεγάλης
  choice: kwa sauti kubwa
  rationale: Hii ni nahau ya kusema au kupaza sauti kwa nguvu. ‘Kwa sauti kubwa’ ni tafsiri ya asili na sahihi katika Kiswahili cha sasa.
- source_word: δοξάζων τὸν θεόν
  choice: huku akimtukuza Mungu
  rationale: δοξάζω humaanisha kumtukuza au kumpa utukufu. ‘Akimtukuza Mungu’ huhifadhi lugha ya utukufu na pia inajumuisha wazo la kumsifu; ‘huku’ huonyesha tendo lililoendelea wakati wa kurudi.
theological_decisions:
- issue: Tafsiri ya τὸν θεόν
  choice: Mungu
  alternative: Hakuna upanuzi wa kimafundisho
  rationale: Aya inasema tu kwamba mtu aliyeponywa alimtukuza Mungu. ‘Mungu’ humwakilisha θεός kwa usahihi bila kuongeza maelezo ya kimafundisho.
- issue: Maana ya δοξάζων
  choice: akimtukuza
  alternative: akimsifu
  rationale: ‘Akimtukuza’ huhifadhi uhusiano wa moja kwa moja na dhana ya utukufu, huku ‘akimsifu’ ikiwa maana halali ya kimuktadha. Hakuna haja ya kuamua kwamba tendo hilo lilikuwa sifa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Muundo ‘huku akimtukuza’ unaendeleza mtiririko wa kitenzi-jina cha Kigiriki. Hakuna tanbihi iliyoongezwa kwa sababu ‘akimtukuza’ ni wazi, na tofauti ya ‘akimsifu’ haihitaji tanbihi ya lazima katika aya hii.
