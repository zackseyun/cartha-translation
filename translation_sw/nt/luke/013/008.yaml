  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: sw
  text: Lakini akajibu, akamwambia, “Bwana, uuache mwaka huu pia[a], mpaka nichimbe udongo kuuzunguka na niweke samadi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uache ubaki mwaka huu pia,” au “uuhifadhi mwaka huu pia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “niweke mbolea.” Samadi ni mbolea inayotokana na kinyesi cha wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: akajibu, akamwambia
  rationale: Muundo huu unahifadhi vipengele vya ‘kujibu’ na ‘kusema’ vilivyomo katika Kigiriki, huku ukibaki wa kawaida katika masimulizi ya Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni namna ya kawaida ya heshima kwa mwenye mamlaka na inafaa kwa mwenye shamba anayezungumziwa katika mfano huu, bila kulazimisha maana ya moja kwa moja ya kimungu.
- source_word: ἄφες αὐτὴν
  choice: liache
  rationale: Kitenzi ἀφίημι hapa humaanisha kukiacha kibaki; ‘liache’ ni kifupi, cha asili, na hakiongezi wazi wazo la kukisamehe au kukinusuru ambalo ni la kudokezwa tu katika muktadha.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: mwaka huu pia
  rationale: Huhifadhi maana halisi ya ombi la kukiacha katika mwaka huu pia, badala ya kufafanua moja kwa moja kuwa ‘mwaka mmoja zaidi.’
- source_word: ἕως ὅτου
  choice: mpaka
  rationale: ‘Mpaka’ huonyesha kipindi kinachoendelea hadi matendo yaliyokusudiwa yafanywe na ni ya kawaida katika Kiswahili.
- source_word: σκάψω περὶ αὐτὴν
  choice: nichimbe kulizunguka
  rationale: Huhifadhi picha halisi ya kuchimba udongo kuzunguka mti bila kuibadili kuwa maelezo mapana kama ‘kulima’ au ‘kulainisha udongo.’
- source_word: βάλω κόπρια
  choice: kuweka samadi
  rationale: ‘Samadi’ hutaja kwa uhalisi mbolea ya kinyesi inayomaanishwa na κόπρια, na ‘kuweka’ huakisi kitenzi cha kawaida βάλω bila kuongeza mahali pasipotajwa wazi katika kishazi hiki.
theological_decisions:
- issue: Maana ya Κύριε katika mazungumzo ya mfano
  choice: Bwana
  alternative: Mkuu; bwana wangu
  rationale: Katika mfano huu ni neno la heshima kwa mwenye shamba. ‘Bwana’ hudumisha maana hiyo na matumizi mapana ya κύριος bila kudai kwamba msemaji anamwita Mungu moja kwa moja.
- issue: Kiwakilishi cha kike αὐτὴν na ngeli ya Kiswahili
  choice: liache; kulizunguka
  alternative: uuache; kuuzunguka
  rationale: Muktadha unarejelea mtini, lakini Kigiriki hutumia kiwakilishi kinacholingana na nomino ya kike. Kiswahili hufuata ngeli ya nomino inayowakilishwa; ‘li-’ linaeleweka kwa kurejelea ‘tini’ au ‘mti wa tini’ kama kitu kilichotajwa katika muktadha. Hata hivyo, ‘mtini’ wa ngeli ya m-/mi- ungeweza kuleta ‘u-’; uchaguzi huu unategemea rejeo la mti kama ‘tini’ katika muktadha wa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Samadi’ limechaguliwa ili kuhifadhi picha ya kilimo ya maandishi ya Kigiriki.
