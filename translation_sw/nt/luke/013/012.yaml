  source_fidelity: The temporal clause and the perfect passive sense are substantially preserved. However, “Mama” is not the closest equivalent of the Greek vocative Γύναι; it introduces a culturally specific respectful/maternal form of address not expressed in the source.
  naturalness: The sentence is clear and idiomatic in standard East African Swahili. “Mwanamke” is suitable in this direct-address setting and is not inherently discourteous in biblical narrative.
