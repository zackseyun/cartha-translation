  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: sw
  text: Lakini Yesu alipomwona, alimwita na kumwambia, “Mwanamke, umefunguliwa kutoka katika udhaifu wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς
  choice: Lakini Yesu alipomwona
  rationale: Kirai cha wakati “alipomwona” kinawasilisha kwa Kiswahili cha kawaida tendo la kitenzi kishirikishi cha wakati uliopita ἰδών, huku δέ ikionyesha mwendelezo wenye tofauti ndogo kwa “Lakini.”
- source_word: προσεφώνησεν καὶ εἶπεν αὐτῇ
  choice: alimwita na kumwambia
  rationale: “Alimwita” linaonyesha kwamba Yesu alimwelekezea mwito, na “kumwambia” linahifadhi wazi yule aliyesemeshwa bila kuwa zito katika Kiswahili.
- source_word: Γύναι
  choice: Mama
  rationale: Katika Kiswahili cha Afrika Mashariki, “Mama” ni mwito wa heshima na wa kawaida kwa mwanamke mtu mzima; huepuka ukali unaoweza kusikika katika “Mwanamke” bila kuongeza wazo la undugu wa kimwili.
- source_word: ἀπολέλυσαι
  choice: umefunguliwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililotimizwa lenye matokeo yanayoendelea. “Umefunguliwa” huhifadhi picha ya kuachiliwa kutoka kifungoni, muhimu pia katika muktadha wa mstari wa 16.
- source_word: τῆς ἀσθενείας σου
  choice: kutoka katika udhaifu wako
  rationale: “Udhaifu” huhifadhi upana wa ἀσθένεια kuliko kulibana kuwa ugonjwa au ulemavu wa aina fulani, ingawa muktadha unaonyesha hali ya mwili.
theological_decisions:
- issue: Asili ya hali ya mwanamke katika ἀσθένεια
  choice: udhaifu
  alternative: ugonjwa; ulemavu
  rationale: Neno la Kigiriki linaweza kumaanisha udhaifu au maradhi. Tafsiri pana haiongezi utambuzi maalumu wa kitabibu na inaacha muktadha ueleze hali hiyo.
- issue: Nguvu ya ἀπολέλυσαι kama timilifu tendwa
  choice: umefunguliwa
  alternative: uko huru; umeponywa
  rationale: “Umefunguliwa” huhifadhi tendo la kuachiliwa na hali yake ya sasa, bila kubadili kitenzi kuwa neno la moja kwa moja la uponyaji ambalo halipo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa asili huku ikibaki rahisi kueleweka kwa wasomaji wa kawaida.
