  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: sw
  text: Alikuwa akifundisha katika mojawapo ya masinagogi siku ya Sabato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku za Sabato”; Kigiriki kimetumia umbo la wingi ambalo mara nyingi hutumika kiidioma kumaanisha “siku ya Sabato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Alikuwa akifundisha
  rationale: Muundo wa kitenzi ἦν pamoja na kivumishi-tendo διδάσκων unaonyesha tendo lililokuwa likiendelea wakati uliopita. Kiswahili cha kawaida huwasilisha maana hiyo kwa ‘alikuwa akifundisha.’ Kiunganishi δέ hapa ni cha kuendeleza simulizi, na si lazima kitafsiriwe kwa neno tofauti.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: katika mojawapo ya masinagogi
  rationale: Usemi huu wa sehemu ya jumla unamaanisha kwamba alikuwa katika sinagogi moja kati ya kadhaa. ‘Sinagogi’ limehifadhiwa kwa kuwa linataja mahali na taasisi mahususi ya Kiyahudi.
- source_word: ἐν τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa σάββασιν ina umbo la wingi, katika Kigiriki cha Koine mara nyingi hutumiwa kiidioma kumaanisha siku moja ya Sabato. ‘Siku ya Sabato’ ni usemi wa asili na ulio wazi kwa msomaji wa Kiswahili; uwezekano wa wingi umewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye heshima. Tafsiri inadumisha hali ya tendo lililokuwa likiendelea na mazingira mahususi ya sinagogi bila kuongeza kiashiria cha wakati au kiunganishi kisichohitajika.
