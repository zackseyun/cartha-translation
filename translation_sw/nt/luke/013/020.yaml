  text: Akasema tena, “Nitaulinganisha ufalme wa Mungu na nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Aka-
  rationale: Kiambishi cha masimulizi “aka-” kinaunganisha tendo hili na yaliyotangulia kwa njia ya kawaida katika Kiswahili, bila kuongeza mkazo usiokuwamo katika Kigiriki.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” huonyesha kurudiwa kwa kusema na ni tafsiri ya moja kwa moja na ya kawaida ya πάλιν.
- source_word: εἶπεν
  choice: akasema
  rationale: Kitenzi hiki cha masimulizi hutanguliza maneno ya moja kwa moja; “akasema” ni cha asili na chenye heshima katika Kiswahili.
- source_word: Τίνι
  choice: na nini
  rationale: Hapa kiwakilishi cha kuuliza cha hali ya utoaji kinaonyesha kitu cha kulinganishia, si mtu; muundo wa Kiswahili “kulinganisha ... na nini” unawasilisha maana hiyo kwa kawaida.
- source_word: ὁμοιώσω
  choice: nitaulinganisha
  rationale: Wakati ujao nafsi ya kwanza umetafsiriwa wazi, huku swali likibaki na nguvu ya kutafakari kuhusu mfano unaofaa.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Kauli hii ya Kibiblia huhifadhi upana wa βασιλεία, unaoweza kuhusisha utawala wa Mungu na eneo au hali ambamo utawala huo unatambuliwa.
theological_decisions:
- issue: Tafsiri ya βασιλεία katika usemi kuhusu utawala wa Mungu
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: “Ufalme wa Mungu” ni usemi uliozoeleka wa Kibiblia na huhifadhi upana wa maana ya neno la Kigiriki bila kuufanya urejelee tendo la kutawala pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye heshima. Mpangilio wa swali umefanywa wa asili katika Kiswahili huku ukihifadhi swali la balagha na wakati ujao wa kitenzi cha Kigiriki.
