id: LUK.13.19
reference: Luke 13:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: sw
  text: Unafanana na mbegu ya haradali ambayo mtu mmoja aliichukua na kuitupa katika bustani yake. Ikakua, ikawa mti[a], na ndege wa angani[b] wakafanya viota katika matawi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi, “ikawa mti,” kikidumisha taswira ya ukuaji mkubwa katika mfano huu.
    reason: lexical_alternative
  - marker: b
    text: Au “ndege wa mbinguni”; kwa kawaida pia hutafsiriwa “ndege wa hewani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Unafanana na
  rationale: Kivumishi cha kike ὁμοία kinarejelea ‘ufalme wa Mungu’ katika mstari uliotangulia. ‘Unafanana na’ ni lugha ya kawaida ya Kiswahili na inadumisha muundo wa ulinganisho.
- source_word: κόκκῳ σινάπεως
  choice: mbegu ya haradali
  rationale: κόκκος inaweza kumaanisha punje au mbegu; ‘mbegu ya haradali’ ndiyo usemi wa kawaida na sahihi katika muktadha huu.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ambayo mtu mmoja aliichukua
  rationale: ἄνθρωπος humtaja mtu mmoja katika mfano. ‘Mtu mmoja’ ni ya asili katika Kiswahili na haitoi madai ya jinsia yaliyo wazi kuliko neno lenyewe la Kigiriki.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: aliitupa katika bustani yake
  rationale: ‘Aliitupa’ inadumisha uhai wa βάλλω kuliko ‘aliweka,’ huku ‘bustani yake’ ikiwakilisha κῆπος na ἑαυτοῦ kwa uwazi.
- source_word: ηὔξησεν
  choice: ikakua
  rationale: Hii ndiyo maana rahisi ya ukuaji katika muktadha, na muundo wa ‘ika-’ unaendeleza mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: ἐγένετο εἰς δένδρον
  choice: ikawa mti
  rationale: Tafsiri hii inadumisha neno δένδρον, ‘mti,’ pamoja na taswira iliyokuzwa ya mfano bila kuibadili kuwa kichaka.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: ‘Wa angani’ huonyesha maana ya mahali ya οὐρανός hapa kwa Kiswahili cha asili; ‘wa mbinguni’ ingeweza kudokeza maana ya kitheolojia isiyokusudiwa.
- source_word: κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ
  choice: wakafanya viota katika matawi yake
  rationale: Katika muktadha wa ndege na matawi, ‘wakafanya viota’ huwasilisha kwa uwazi wazo la kukaa au kujisitiri linalobebwa na κατασκηνόω. Wingi wa Kiswahili unalingana na kiima ‘ndege.’
theological_decisions:
- issue: Jinsia ya ἄνθρωπος
  choice: mtu mmoja
  alternative: mwanamume mmoja
  rationale: ἄνθρωπος kimsingi humaanisha binadamu au mtu na, ingawa umbo lake ni la kisarufi la kiume, muktadha huu haumlazimishi mhusika kutajwa wazi kuwa mwanamume. ‘Mtu mmoja’ huhifadhi maana bila kuongeza ufafanuzi wa jinsia.
- issue: Taswira ya δένδρον katika mfano wa mbegu ya haradali
  choice: mti
  alternative: kichaka kikubwa
  rationale: Maandishi ya Kigiriki yanasema δένδρον, ‘mti.’ Tafsiri inadumisha taswira hiyo yenye msisitizo wa ukuaji badala ya kuirekebisha kwa hoja za kibotania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya ‘bustani yake’ ili iwe rahisi kueleweka bila kupoteza mfuatano wa simulizi. Viambishi vya ‘ika-’ vinadumisha mwendo wa matendo ya Kigiriki.
