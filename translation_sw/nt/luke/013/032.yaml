  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: sw
  text: Akawaambia, “Nendeni mkamwambie yule mbweha, ‘Tazama, ninawafukuza pepo na ninaponya leo na kesho, na siku ya tatu ninakamilishwa[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninafikia lengo langu,” “nafikishwa kwenye ukamilisho,” au “ninamaliza mwendo wangu.” Kigiriki kinaweza kumaanisha kufikishwa kwenye ukamilisho, yaelekea kikirejelea kukamilika kwa utume wa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: mbweha
  rationale: Neno hilo humaanisha mnyama mbweha na hapa limetumiwa kwa njia ya sitiari. Tafsiri ya moja kwa moja inadumisha sitiari na sauti ya dharau bila kuifafanua kupita kiasi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni kiashiria cha kuvuta fikira kwa maneno yanayofuata. “Tazama” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia.
- source_word: ἐκβάλλω δαιμόνια
  choice: ninawafukuza pepo
  rationale: Huu ni usemi wa kawaida wa Kiswahili kuhusu kutoa pepo, nao unadumisha nguvu ya kitenzi ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: kuwaponya watu
  rationale: Tafsiri hii ya maana ni ya asili zaidi katika Kiswahili kuliko “kutimiza uponyaji.” Inawasilisha tendo la kuleta uponyaji huku ikiepuka lugha nzito isiyo ya kawaida.
- source_word: σήμερον καὶ αὔριον
  choice: leo na kesho
  rationale: Inadumisha maneno ya wakati ya Kigiriki na pia uwezekano kwamba ni usemi wa kipindi kifupi kilichowekwa.
- source_word: τῇ τρίτῃ
  choice: siku ya tatu
  rationale: Hii ndiyo namna wazi na ya kawaida ya kuonyesha wakati unaokusudiwa na usemi wa Kigiriki.
- source_word: τελειοῦμαι
  choice: ninakamilishwa
  rationale: Inadumisha hali ya kutendwa ya kitenzi na wazo la kufikishwa kwenye ukamilisho bila kuamua wazi ikiwa kinachorejelewa ni mwisho wa huduma, kifo, ufufuo, au kutimizwa kwa utume wote.
theological_decisions:
- issue: Maana ya τελειοῦμαι kuhusiana na utume wa Yesu na uwezekano wa kudokeza kifo au ufufuo wake
  choice: ninakamilishwa
  alternative: ninafikia lengo langu; ninakamilisha kazi yangu; nafikishwa kwenye ukamilisho
  rationale: Kigiriki kinaweza kumaanisha kufikishwa kwenye ukamilisho au kufikia mwisho uliokusudiwa. Tafsiri kuu inadumisha hali ya kutendwa na mvutano wa kitheolojia bila kutaja ufufuo au tukio jingine moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yule mbweha” inadumisha sitiari na sauti ya dharau; “kuwaponya watu” hutoa Kiswahili cha kawaida badala ya muundo mzito wa nomino. Alama ya tanbihi imewekwa mara baada ya “ninakamilishwa,” neno linalohusika.
