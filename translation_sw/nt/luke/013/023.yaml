lexical_decisions:
- source_word: δέ
  choice: Naye / aka-
  rationale: Ni kiunganishi chepesi kinachoendeleza simulizi; muundo wa Kiswahili wenye “aka-” na “naye” unaendeleza mtiririko bila kusisitiza tofauti.
- source_word: τις
  choice: mtu mmoja
  rationale: Hurejelea mtu asiyetajwa; “mtu mmoja” ni ya kawaida na huhifadhi kutokujulikana kwake.
- source_word: αὐτῷ
  choice: akamwuliza
  rationale: Kiambishi “-mw-” huhifadhi maana ya “kwake” katika usemi wa asili bila kuongeza jina la Yesu ndani ya mstari.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριε na inaweza kubeba heshima ya kawaida au uzito mkubwa zaidi wa kimasiha, kama ilivyo wazi kwa tafsiri tofauti katika muktadha.
- source_word: εἰ
  choice: je
  rationale: Katika swali hili, “je” huanzisha swali la moja kwa moja kwa Kiswahili cha kawaida na kwa uaminifu.
- source_word: ὀλίγοι
  choice: wachache tu
  rationale: Hueleza idadi ndogo; “wachache tu” huwasilisha kwa kawaida mkazo wa swali kuhusu uchache.
- source_word: οἱ σῳζόμενοι
  choice: wanaookolewa
  rationale: Huhifadhi umbo la sasa la kutendwa na wazo la wale walio katika hali au mchakato wa kuokolewa, bila kulazimisha mfumo maalumu wa kisoteriolojia.
- source_word: πρὸς αὐτούς
  choice: akawaambia
  rationale: Kiambishi “-wa-” huonyesha kwa kawaida kuwa aliwaambia watu wengi, na hivyo huhifadhi wingi wa αὐτούς.
theological_decisions:
- issue: Uzito wa κύριε kama namna ya kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa; Bwana wangu
  rationale: “Bwana” huhifadhi uwezekano wa kuwa heshima ya kawaida au jina lenye uzito wa juu zaidi, bila kuamua kimya kimya maana moja tu.
- issue: Aspekti ya σῳζόμενοι
  choice: wanaookolewa
  alternative: watakaookolewa; waliookolewa
  rationale: “Wanaookolewa” huhifadhi wakati/aspekti ya sasa na sauti tendwa ya Kigiriki, badala ya kuifanya iwe tukio la wakati ujao au tendo lililokamilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Mtu mmoja akamwuliza” ni wa asili zaidi kuliko kutenganisha “akamwambia” na swali, huku ukihifadhi tendo la kumwelekea yeye. Hakuna tanbihi iliyohitajika, kwa kuwa “Bwana” na “wanaookolewa” huhifadhi utata na aspekti muhimu moja kwa moja katika matini.
