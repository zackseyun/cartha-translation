  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: sw
  text: Hata hivyo, lazima niendelee na safari yangu leo, kesho, na siku inayofuata[a], kwa sababu haiwezekani[b] kwa nabii kuangamia nje ya Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “leo, kesho, na siku inayofuata” huenda ni nahau inayomaanisha kipindi kifupi kilichowekwa, wala si lazima siku tatu kamili za kalenda.
    reason: cultural_note
  - marker: b
    text: Au “haiwezi kuwa” au “haifikiriki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Hata hivyo
  rationale: Huonyesha utofautishaji wenye nguvu na kauli iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: δεῖ με
  choice: lazima
  rationale: Huwasilisha ulazima unaomhusu Yesu bila kufafanua zaidi chanzo cha ulazima huo.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: leo, kesho, na siku inayofuata
  rationale: Huhifadhi mfuatano wa nyakati ulio wazi katika Kigiriki huku ukibaki wa kawaida katika Kiswahili.
- source_word: πορεύεσθαι
  choice: niendelee na safari yangu
  rationale: Hutoa maana ya kwenda au kusonga mbele katika muktadha wa safari, si tendo la kuondoka mara moja tu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya ulazima uliotajwa.
- source_word: οὐκ ἐνδέχεται
  choice: haiwezekani
  rationale: Huhifadhi lugha ya kutowezekana au kutofikirika bila kuamua kimya kimya kama kauli hiyo ni ya moja kwa moja au ya kinaya.
- source_word: προφήτην
  choice: nabii
  rationale: Nomino isiyo na kibainishi imetumiwa kwa maana ya jumla; Kiswahili hakihitaji kiambishi cha kutafsiri ‘a’.
- source_word: ἀπολέσθαι
  choice: aangamie
  rationale: Huhifadhi uzito na upana wa ἀπόλλυμι kuliko ‘afe’ pekee, huku muktadha ukidokeza kifo cha nabii.
- source_word: ἔξω Ἰερουσαλήμ
  choice: nje ya Yerusalemu
  rationale: Ni usemi wa mahali ulio wazi, wa moja kwa moja, na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Nguvu ya kauli kwamba nabii hawezi kuangamia nje ya Yerusalemu
  choice: Imetafsiriwa kama ‘haiwezekani,’ ikiacha wazi mvutano kati ya kutowezekana halisi, kutofaa, na kinaya cha kinabii.
  alternative: ‘Haifikiriki’ au ‘haiwezekani kabisa’
  rationale: οὐκ ἐνδέχεται inaweza kueleza jambo lisilowezekana au lisilokubalika kwa kufikiriwa. Tafsiri kuu haifanyi kauli hiyo kuwa dai la kimetafizikia wala kuifupisha kuwa kejeli tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka kwa urahisi na chenye hadhi. Mfuatano wa sentensi ya Kigiriki umehifadhiwa kadiri unavyosikika kwa kawaida katika Kiswahili; alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.
