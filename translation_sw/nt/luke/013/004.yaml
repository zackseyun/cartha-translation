id: LUK.13.4
reference: Luke 13:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: sw
  text: Au wale kumi na wanane ambao mnara wa Siloamu uliwaangukia na kuwaua—je, mnadhani kwamba hao walikuwa na deni kubwa zaidi kuliko watu wengine wote wanaoishi Yerusalemu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa na hatia kubwa zaidi” au “walikuwa wakosaji wabaya zaidi.” Kigiriki kinasema kihalisi “wadeni,” huenda kwa maana ya deni la kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Inaingiza mfano mwingine katika hoja inayoendelea, huku ikidumisha mtiririko wa swali.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: wale kumi na wanane
  rationale: Inafuata muundo wa kiashiria na idadi bila kuongeza kwamba wote walikuwa wanaume.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: mnara wa Siloamu uliwaangukia
  rationale: Inahifadhi wazo la moja kwa moja la mnara kuanguka juu yao na kutaja mahali kwa njia ya asili katika Kiswahili.
- source_word: ἀπέκτεινεν αὐτούς
  choice: na kuwaua
  rationale: Ni usemi wa kawaida na wa moja kwa moja kwa kifo kilichosababishwa na janga hilo.
- source_word: δοκεῖτε ὅτι
  choice: mnadhani kwamba
  rationale: Inadumisha swali la moja kwa moja ambalo Yesu anawauliza wasikilizaji wake.
- source_word: ὀφειλέται
  choice: wadeni
  rationale: Inahifadhi sitiari ya Kigiriki ya watu wenye deni au wajibu, ambayo katika muktadha huu huenda ikahusu hatia ya kimaadili, bila kuibadilisha moja kwa moja kuwa ‘wenye dhambi.’
- source_word: ἐγένοντο
  choice: walikuwa
  rationale: Katika Kiswahili, ‘walikuwa’ huwasilisha hali inayolinganishwa kwa ufasaha zaidi kuliko tafsiri halisi isiyo ya kawaida ya ‘walipata kuwa.’
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: zaidi kuliko watu wengine wote
  rationale: Inatoa nguvu ya ulinganisho ya παρά kwa Kiswahili cha kawaida; ‘watu’ hapa inafaa kwa maana ya jumla ya ἀνθρώπους.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: wanaoishi Yerusalemu
  rationale: Ni tafsiri ya kawaida ya kishiriki cha wakati uliopo, ikionyesha wakazi wa Yerusalemu.
theological_decisions:
- issue: Maana ya ὀφειλέται katika muktadha huu
  choice: wadeni
  alternative: wenye hatia kubwa zaidi; wakosaji wabaya zaidi; wenye dhambi zaidi
  rationale: Neno hilo kwa maana ya msingi ni ‘wadeni,’ lakini hapa linaweza kuonyesha deni au wajibu wa kimaadili. Kulihifadhi kama ‘wadeni’ kunadumisha sitiari na tofauti yake na neno la wazi la ‘wenye dhambi’ katika mstari uliotangulia.
- issue: Upeo wa ἀνθρώπους
  choice: watu
  alternative: wanaume
  rationale: Katika muktadha huu neno linawahusu wakazi wa Yerusalemu kwa jumla, si lazima wanaume peke yao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umewekwa wazi na wa kawaida, huku sitiari isiyo ya kawaida ya ‘wadeni’ ikihifadhiwa na kufafanuliwa katika tanbihi.
