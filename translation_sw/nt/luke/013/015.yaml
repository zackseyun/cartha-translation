  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: sw
  text: Lakini Bwana akamjibu, akasema, “Enyi wanafiki! Je, kila mmoja wenu siku ya Sabato hafungui ng’ombe wake au punda wake kutoka kwenye hori[a], kisha kumwongoza kwenda kumpa maji?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kulishia.” Neno la Kigiriki linaweza kumaanisha hori au mahali pa kuwekea chakula cha wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni cheo cha kawaida cha Yesu katika simulizi la Luka na kinahifadhi uzito wake wa kikristo bila kukipanua.
- source_word: Ὑποκριταί
  choice: Enyi wanafiki!
  rationale: Wingi wa kimwito umetafsiriwa kwa ukali wa karipio la moja kwa moja katika Kiswahili cha asili.
- source_word: ἕκαστος ὑμῶν
  choice: kila mmoja wenu
  rationale: Kinahifadhi maana ya kugawa tendo kwa kila mtu mmoja mmoja.
- source_word: τῷ σαββάτῳ
  choice: siku ya Sabato
  rationale: Ni usemi wa kawaida na wazi wa wakati katika Kiswahili.
- source_word: λύει
  choice: hamfungui
  rationale: Katika muktadha wa mnyama aliyefungwa horini, ‘kufungua’ huwasilisha tendo la kufungua kamba kwa lugha ya kawaida.
- source_word: βοῦν
  choice: ng’ombe
  rationale: βοῦς inaweza kumaanisha mnyama wa jamii ya ng’ombe kwa upana; ‘ng’ombe’ ni ya asili na haibani maana kwa fahali aliyehasiwa pekee.
- source_word: ὄνον
  choice: punda
  rationale: Ni neno la kawaida na sahihi la Kiswahili.
- source_word: φάτνης
  choice: hori
  rationale: ‘Hori’ ni mahali au chombo cha kulishia mnyama na linafaa kwa picha ya kumfungua mnyama kutoka hapo.
- source_word: ἀπαγαγὼν
  choice: kisha kumwongoza kwenda
  rationale: Kielezi hiki cha aoristi kinaonyesha hatua inayofuata baada ya kumfungua; muundo huu ni wa asili katika swali la Kiswahili.
- source_word: ποτίζει
  choice: kumpa maji
  rationale: Kitenzi kina maana ya kumpa kiumbe kitu cha kunywa; ‘kumpa maji’ ni wazi na cha kawaida.
theological_decisions:
- issue: Cheo κύριος kinapotumiwa kwa Yesu katika simulizi
  choice: Bwana
  alternative: bwana mkubwa
  rationale: ‘Bwana’ kinahifadhi cheo cha kisimulizi na uzito wake wa kikristo; ‘bwana mkubwa’ kingeshusha au kubadili maana ya cheo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umehifadhi hoja ya Yesu kuhusu tendo ambalo wasikilizaji wake hulifanya siku ya Sabato.
