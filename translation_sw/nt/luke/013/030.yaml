base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: sw
  text: Na tazama, kuna walio wa mwisho watakaokuwa wa kwanza, na kuna walio wa kwanza watakaokuwa wa mwisho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linavuta fikira za msomaji kwenye kauli inayofuata. “Tazama” ni fupi, yenye heshima, na inafaa katika usemi wa kibiblia bila kubadili maana kuwa amri ya kutazama kwa macho pekee.
- source_word: ἔσχατοι
  choice: walio wa mwisho
  rationale: Huhifadhi wazo la nafasi ya mwisho au hadhi ya chini na pia ulinganifu wake wa moja kwa moja na “walio wa kwanza,” bila kulifasiri kuwa ubora wa kimaadili.
- source_word: πρῶτοι
  choice: walio wa kwanza
  rationale: Ni kinyume cha moja kwa moja na cha kawaida cha “walio wa mwisho,” na huhifadhi muundo wa kimithali wa kauli hii.
- source_word: οἳ ἔσονται
  choice: ambao watakuwa
  rationale: Kishazi rejeshi chenye kitenzi cha wakati ujao kimetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: εἰσὶν
  choice: kuna walio
  rationale: “Kuna walio” huonyesha kwa kawaida katika Kiswahili maana ya uwepo iliyomo katika εἰσὶν pamoja na vivumishi vilivyotumika kama nomino.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kimehifadhiwa ili kudumisha uwiano wa sehemu mbili za kauli.
theological_decisions:
- issue: Upeo wa kauli kuhusu kugeuzwa kwa hali
  choice: Kauli imetafsiriwa kama kanuni ya jumla kuhusu walio wa mwisho kuwa wa kwanza na walio wa kwanza kuwa wa mwisho.
  alternative: Kuifanya ihusu kwa wazi Wayahudi na watu wa mataifa, unyenyekevu na kiburi, au viwango katika hukumu ya mwisho.
  rationale: Muktadha unahusu kuingia katika ufalme wa Mungu, lakini maneno ya Kigiriki hayaelezi moja kwa moja kundi au aina moja ya hadhi. Tafsiri inadumisha upana na mvutano huo bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye heshima. Marudio ya “kuna walio” na ulinganifu wa “wa mwisho/wa kwanza” yamedumishwa kwa sababu ni sehemu ya mkazo na muundo wa kauli ya Kigiriki.
