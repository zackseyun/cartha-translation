  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: sw
  text: Tazama, nyumba yenu imeachwa.[a][b] Nami ninawaambia, hakika hamtaniona mpaka wakati utakapofika ambapo mtasema,[c][d] “Amebarikiwa yule anayekuja kwa jina la Bwana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba yenu imetelekezwa.” Kitenzi cha Kigiriki kinaweza kudokeza kuachwa au, katika muktadha wa hukumu, kuachiwa adhabu.
    reason: lexical_alternative
  - marker: b
    text: Huenda “nyumba yenu” inarejelea Yerusalemu, hasa hekalu lake, lakini Kigiriki kinasema tu “nyumba yenu.”
    reason: alternative_reading
  - marker: c
    text: Maneno “Amebarikiwa yule anayekuja kwa jina la Bwana” yana mwangwi wa Zaburi 118:26.
    reason: cross_reference
  - marker: d
    text: Baadhi huelewa maneno haya kuwa yanahusu Yesu kuingia Yerusalemu kwa ushindi; wengine huyahusisha na kumtambua kwake wakati ujao. Kigiriki chenyewe hakilazimishi wakati mmoja hususa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta fikira na kuanzisha tamko zito; “Tazama” ni la kawaida katika mtindo wa kibiblia bila kuwa gumu kueleweka.
- source_word: ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν
  choice: nyumba yenu mmeachiwa
  rationale: Huhifadhi hali ya kutendwa na uhusiano wa dative katika Kiswahili cha kawaida, bila kuamua ikiwa maana hasa ni kuachwa, kutelekezwa, au kutolewa kwa hukumu.
- source_word: λέγω δὲ ὑμῖν
  choice: Nami ninawaambia
  rationale: “Nami” huonyesha mwendelezo wenye mpito mdogo wa δέ kwa kawaida zaidi hapa kuliko kuingiza upinzani mkali.
- source_word: οὐ μὴ ἴδητέ με
  choice: hakika hamtaniona
  rationale: “Hakika” pamoja na hali ya baadaye hasi huwasilisha msisitizo mkubwa wa οὐ μή kwa Kiswahili cha asili.
- source_word: ἕως ἥξει ὅτε
  choice: mpaka wakati utakapofika ambapo
  rationale: Hutoa maana ya kirai cha wakati kwa uwazi, huku ikiepuka tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
- source_word: εἴπητε
  choice: mtasema
  rationale: Hali ya baadaye inafaa baada ya “wakati utakapofika” na huonyesha tukio linalotarajiwa bila kulifungamanisha na wakati maalumu wa kitheolojia.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Amebarikiwa yule anayekuja
  rationale: Huhifadhi muundo wa baraka na mwangwi wa Zaburi 118:26; “yule anayekuja” ni ya asili na haifanyi kirai hicho kuwa cheo maalumu bila ulazima.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Hiki ndicho kirai cha kawaida cha kibiblia katika Kiswahili na huwasilisha kuja kwa mamlaka au uwakilishi wa Bwana.
theological_decisions:
- issue: Kirejelewa cha “nyumba yenu”
  choice: Kimeachwa kama “nyumba yenu” katika matini kuu
  alternative: hekalu; Yerusalemu; nyumba au taifa la Israeli
  rationale: Muktadha unaelekeza kwa Yerusalemu na hasa hekalu lake, lakini Kigiriki kinasema tu “nyumba yenu.” Tafsiri haipaswi kubana kirejelewa ambacho matini imekiacha kipana.
- issue: Wakati unaokusudiwa na kauli ya mwisho
  choice: Kauli imetafsiriwa kama tukio la baadaye bila kutaja ni wakati gani
  alternative: kuingia kwa ushindi Yerusalemu; kukiri kwa Yerusalemu au Israeli wakati ujao; kumtambua Yesu atakaporudi
  rationale: Maneno ya Kigiriki hayalazimishi mojawapo ya tafsiri hizi peke yake; kuacha wakati wazi huhifadhi utata na mvutano wa kitheolojia wa matini.
- issue: Nguvu ya ἀφίεται
  choice: “mmeachiwa”
  alternative: “metelekezwa” au “imeachwa ukiwa”
  rationale: “Mmeachiwa” huhifadhi uwezekano wa maana ya hukumu bila kuingiza “ukiwa,” neno lisilopatikana katika matini ya SBLGNT ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nyumba yenu mmeachiwa” ni wa kawaida na huhifadhi dative ya Kigiriki; “hakika hamtaniona” huwasilisha ukanushi wenye msisitizo. Alama zote za tanbihi zimewekwa kwenye matini kuu.
