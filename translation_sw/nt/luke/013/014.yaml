  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: sw
  text: Lakini kiongozi wa sinagogi akajibu, akiwa amekasirika kwa sababu Yesu aliponya siku ya Sabato, akauambia umati, “Kuna siku sita ambazo ni lazima kufanya kazi. Basi, njooni siku hizo mpate kuponywa, wala si siku ya Sabato.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Lakini ... akauambia
  rationale: δὲ inaonyesha tofauti na tendo la Yesu lililotangulia. Katika Kiswahili, maana ya ἀποκριθεὶς kama kuitikia hali iliyotokea inaeleweka kwa mfuatano wa simulizi bila tafsiri ngumu ya ‘akajibu’, kwa kuwa hakutanguliwa na swali la moja kwa moja.
- source_word: ὁ ἀρχισυνάγωγος
  choice: kiongozi wa sinagogi
  rationale: Hutaja msimamizi wa mambo ya sinagogi, si mtawala wa kiraia. ‘Kiongozi wa sinagogi’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: ἀγανακτῶν
  choice: akiwa amekasirika
  rationale: Huwasilisha hasira au kuchukizwa sana. ‘Akiwa amekasirika’ ni ya asili na inaeleweka kwa wasomaji wengi bila kuongeza dai kwamba hasira yake ilikuwa ya haki.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: kwa sababu Yesu alikuwa ameponya siku ya Sabato
  rationale: ὅτι ni ya kisababishi hapa, na ‘alikuwa ameponya’ huonyesha kuwa uponyaji ulitangulia maneno ya kiongozi.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: akauambia umati
  rationale: Imperfect ἔλεγεν inaweza kuonyesha usemi unaoendelea, lakini katika tukio hili Kiswahili cha simulizi hutumia kwa kawaida ‘akauambia’ bila kulazimisha wazo la kurudia-rudia.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Kuna siku sita ambazo kazi inapaswa kufanywa
  rationale: Muundo huu unahifadhi dai la wajibu katika δεῖ na pia unasikika kwa kawaida kuliko ‘ambazo ni lazima kufanya kazi.’
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Basi, njooni siku hizo mponywe
  rationale: οὖν ni hitimisho (‘basi’), ἐρχόμενοι ni mwito wa kuja, na θεραπεύεσθε hapa ina maana ya kupokea uponyaji.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: wala si siku ya Sabato
  rationale: Huhifadhi katazo lenye kulinganisha siku hizo sita na siku ya Sabato, kwa usemi wa Kiswahili ulio wazi.
theological_decisions:
- issue: Kauli ya kiongozi kuhusu kazi na uponyaji siku ya Sabato
  choice: 'Maneno yake yametafsiriwa kama pingamizi lake mwenyewe: ‘Kuna siku sita ambazo kazi inapaswa kufanywa.’'
  alternative: Kuyafafanua maneno yake moja kwa moja kuwa ya kinafiki au kuyawasilisha kana kwamba msimulizi anathibitisha kanuni yake.
  rationale: Mstari unaripoti msimamo wa kiongozi bila kuuidhinisha wala kuuhukumu kwa maelezo yaliyoongezwa. Hivyo mvutano wa simulizi unabaki kwa muktadha kuufunua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘sinagogi,’ ‘Sabato,’ na ‘umati’ kama istilahi zinazoeleweka katika usomaji wa Biblia, huku ikiepuka tafsiri ngumu isiyo ya kawaida.
