  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: sw
  text: Naye akawajibu, “Je, mnadhani kwamba Wagalilaya hawa walikuwa wenye dhambi kuliko Wagalilaya wengine wote kwa sababu walipatwa na mambo hayo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akawajibu
  rationale: Muundo huu wa kawaida wa Kiswahili unawakilisha kwa asili nahau ya Kigiriki ‘akijibu, alisema’ bila marudio yasiyo ya lazima.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: wenye dhambi kuliko Wagalilaya wengine wote
  rationale: ‘Kuliko’ linaonyesha ulinganisho wa παρὰ, na ‘wengine wote’ linaweka wazi kwamba hawa pia walikuwa Wagalilaya.
- source_word: ἐγένοντο
  choice: walikuwa
  rationale: Katika kirai hiki, γίνομαι pamoja na kiarifu cha nomino hueleza hali au jinsi walivyohesabiwa, si lazima mabadiliko ya kuwa wenye dhambi; ‘walikuwa’ ni Kiswahili cha kawaida na hakidai kwamba tukio hilo liliwafanya wawe wenye dhambi.
- source_word: ταῦτα πεπόνθασιν
  choice: walipatwa na mambo hayo
  rationale: Huhifadhi rejeo la jumla la ‘mambo hayo’ na hali ya kupatwa na mateso bila kuongeza maelezo yasiyomo katika mstari.
theological_decisions:
- issue: Je, mateso yao yalithibitisha kwamba walikuwa wenye dhambi zaidi?
  choice: Swali limeachwa wazi katika mstari huu, likiunganisha dhana hiyo na sababu ‘kwa sababu walipatwa na mambo hayo.’
  alternative: Kutafsiri kwa namna inayokanusha dhana hiyo moja kwa moja ndani ya swali.
  rationale: Yesu anatoa jibu katika mstari unaofuata; mstari huu wenyewe unauliza kuhusu hitimisho linalotokana na mateso yao, hivyo tafsiri haipaswi kutanguliza jibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Naye akawajibu’ ni simulizi la kawaida; swali limeundwa kwa uwazi na bila istilahi nzito.
