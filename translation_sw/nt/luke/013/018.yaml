  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: sw
  text: Kwa hiyo, alikuwa akisema, “Ufalme wa Mungu[a] unafanana na nini? Na niulinganishe na nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utawala wa Mungu,” kwa kukazia tendo la Mungu kutawala badala ya eneo la ufalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: alikuwa akisema
  rationale: Wakati usiotimilifu unaonyesha usemi uliokuwa ukiendelea katika simulizi; muundo huu wa Kiswahili unahifadhi hali hiyo kwa njia ya kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaendeleza hoja kutokana na muktadha uliotangulia; “Kwa hiyo” kinahifadhi nguvu yake ya kimantiki.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: unafanana na nini?
  rationale: Huu ni usemi wa kuuliza ulinganisho; tafsiri hii ni ya kawaida na ya wazi katika Kiswahili.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Hili ni neno la kibiblia lililozoeleka na linaweza kujumuisha eneo la ufalme pamoja na utawala wa Mungu bila kuufunga usemi kwenye maana moja tu.
- source_word: καὶ
  choice: Nami
  rationale: Katika maswali mawili sambamba, “Nami” huunganisha swali la pili kwa kawaida huku ikihifadhi nafsi ya kwanza ya kitenzi kinachofuata.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: niulinganishe na nini?
  rationale: Muundo huu unahifadhi nguvu ya swali la kujadiliana la kitenzi cha wakati ujao na kurejelea “ufalme” kwa kiambishi cha ngeli kinachofaa.
theological_decisions:
- issue: Tafsiri ya βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: Kirai kinaweza kumaanisha ufalme kama milki na pia tendo la Mungu kutawala. “Ufalme wa Mungu” huhifadhi usemi wa kibiblia uliozoeleka na uwanja wake wa kimfano, huku tanbihi ikionyesha maana ya kiutendaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa maswali mawili umehifadhiwa, pamoja na hali endelevu ya kitenzi cha mwanzo.
