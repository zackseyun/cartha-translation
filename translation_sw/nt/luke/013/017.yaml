  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: sw
  text: Alipokuwa akisema mambo haya, wote waliokuwa wakimpinga waliaibishwa, nao umati wote ulikuwa ukifurahia mambo yote matukufu yaliyokuwa yakitendwa naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yote ya ajabu” au “mambo yote yenye fahari.” Kigiriki kinasema “mambo matukufu,” usemi mpana unaoweza kujumuisha matendo yake yenye nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Alipokuwa akisema mambo haya
  rationale: Muundo huu unaonyesha kuwa matendo hayo yalitokea wakati Yesu akiendelea kusema, na unatoa Kiswahili cha kawaida bila kupoteza hali endelevu ya kitenzi cha Kigiriki.
- source_word: κατῃσχύνοντο
  choice: waliaibishwa
  rationale: Huhifadhi maana ya kutendwa na hali ya kuaibika hadharani iliyosababishwa na maneno ya Yesu; muktadha unaonyesha hali hiyo ilijitokeza alipokuwa akisema.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: waliokuwa wakimpinga
  rationale: Huhifadhi nguvu ya kitenzi na hali ya upinzani uliokuwa ukiendelea, badala ya kutumia tu nomino kama 'wapinzani wake'.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Ni Kiswahili cha kawaida kinachowakilisha kundi zima kama umoja.
- source_word: ἔχαιρεν
  choice: ulikuwa ukifurahia
  rationale: Hali ya kuendelea katika kitenzi cha Kigiriki inaonyeshwa kwa muundo wa Kiswahili 'ulikuwa ukifurahia'.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: mambo yote ya utukufu
  rationale: Huhifadhi upana wa ἔνδοξος bila kuibana maana iwe miujiza pekee; inaweza kumaanisha mambo yenye utukufu, fahari, au kustaajabisha.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: yaliyokuwa yakitendwa naye
  rationale: Huonyesha matendo yaliyokuwa yakiendelea na humtaja Yesu moja kwa moja kuwa mtendaji; 'naye' ni muundo wa asili na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Asili ya “mambo ya utukufu”
  choice: mambo yote ya utukufu
  alternative: mambo yote ya ajabu; mambo yote yenye fahari
  rationale: Kigiriki kinatumia ἐνδόξοις, neno pana kuliko 'miujiza.' Tafsiri hii hailazimishi matendo yaeleweke kuwa miujiza pekee, ingawa uponyaji katika muktadha unajumuishwa.
- issue: Utendaji katika ὑπ’ αὐτοῦ
  choice: yaliyokuwa yakitendwa naye
  alternative: yaliyokuwa yakitendeka kupitia kwake
  rationale: ὑπό pamoja na hali ya umilikishi humtambulisha Yesu kama mtendaji. 'Naye' huhifadhi utendaji huo bila kuugeuza kuwa chombo kisicho cha moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya kuendelea imetumiwa kwa kiasi ili kuonyesha hali ya vitenzi vya Kigiriki bila kufanya sentensi iwe nzito. Alama ya tanbihi imewekwa baada ya kirai kinachoelezwa.
