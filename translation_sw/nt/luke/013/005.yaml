base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: sw
  text: La, nawaambia; lakini msipotubu, ninyi nyote mtaangamia vivyo hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaangamia kwa namna hiyo hiyo.” Neno la Kigiriki linalotafsiriwa “vivyo hivyo” linaweza kuelekeza kwenye hukumu ya namna inayofanana, kwa kuzingatia matukio yaliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: La
  rationale: Ni jibu la moja kwa moja lenye msisitizo kwa swali linalodokezwa na muktadha uliotangulia; “La” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni kauli ya kawaida katika Luka; “nawaambia” ni ya asili katika Kiswahili na inadumisha uhusiano wa msemaji na wasikilizaji.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: Lakini msipo-
  rationale: Muundo wa “Lakini msipotubu” unaonyesha kwa kawaida na kwa nguvu sharti hasi linaloletwa na maneno ya Kigiriki.
- source_word: μετανοῆτε
  choice: msipotubu
  rationale: “Kutubu” linaonyesha mwito wa kumgeukia Mungu bila kuufanya kuwa majuto ya kihisia tu au mabadiliko ya kiakili pekee.
- source_word: πάντες
  choice: ninyi nyote
  rationale: “Ninyi nyote” linaweka wazi kwamba onyo linawahusu wasikilizaji wote, kama πάντες inavyosisitiza.
- source_word: ὡσαύτως
  choice: vivyo hivyo
  rationale: “Vivyo hivyo” linaweza kumaanisha kwa kulinganishwa au kwa namna hiyo hiyo, hivyo linahifadhi upana wa maana ya Kigiriki bila kubainisha kupita kiasi kipengele cha ulinganisho.
- source_word: ἀπολεῖσθε
  choice: mtaangamia
  rationale: “Kuangamia” linawasilisha uzito wa uharibifu au maangamizi unaokusudiwa, bila kuupunguza kuwa kifo cha mwili tu.
theological_decisions:
- issue: Maana ya toba katika onyo la Yesu
  choice: Kutumia “msipotubu” bila kuifafanua toba kuwa majuto ya ndani tu au mfumo kamili wa mafundisho kuhusu uongofu.
  alternative: msipobadili nia zenu; msipomrudia Mungu
  rationale: Kitenzi cha Kigiriki kinatoa mwito mzito wa toba mbele za Mungu. “Kutubu” kinahifadhi uzito huo wa kibiblia huku kikiacha upeo kamili wa neno wazi.
- issue: Nguvu ya ὡσαύτως ἀπολεῖσθε
  choice: Kutafsiri “mtaangamia vivyo hivyo” na kudumisha ulinganisho wa hukumu bila kuamua ikiwa msisitizo ni namna, uhakika, au ghafla yake.
  alternative: mtaangamia kwa namna iyo hiyo; mtakufa vivyo hivyo
  rationale: Muktadha unawalinganisha wasikilizaji na watu waliotajwa katika matukio yaliyotangulia, lakini kipengele halisi cha ulinganisho hakijaelezwa kikamilifu. Tafsiri inalinda utata huo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili fupi zinadumisha nguvu ya jibu na onyo. “La” linafaa zaidi kuliko “Hapana” katika jibu hili rasmi, na “ninyi nyote” linaonyesha wazi upeo wa πάντες.
