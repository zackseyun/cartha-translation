  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: sw
  text: Naye alikuwa akipita katika miji na vijiji, akifundisha na kuendelea na safari yake kuelekea Yerusalemu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda Yerusalemu.”
    reason: Mbadala huu unawakilisha maana ya moja kwa moja zaidi ya εἰς, huku maandishi makuu yakisisitiza mwelekeo wa safari inayoendelea.
lexical_decisions:
- source_word: διεπορεύετο
  choice: alikuwa akipita
  rationale: Kauli ya wakati usiotimilika inaonyesha mwendo uliokuwa ukiendelea; muundo huu wa Kiswahili unadumisha hali hiyo ya kuendelea kupita sehemu mbalimbali.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: katika miji na vijiji
  rationale: κατά pamoja na hali ya kushutumiwa hapa inaonyesha kupita katika makazi mbalimbali. “Miji na vijiji” inadumisha tofauti kati ya makazi makubwa na madogo kwa Kiswahili cha kawaida.
- source_word: διδάσκων
  choice: akifundisha
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha shughuli iliyoambatana na safari; “akifundisha” ni fupi na ya asili.
- source_word: πορείαν ποιούμενος
  choice: akiendelea na safari yake
  rationale: Nahau hii ina maana ya kufanya au kuendeleza safari. Tafsiri hii inaonyesha mwendo wenye kusudi bila kulazimisha Kiswahili cha neno kwa neno.
- source_word: εἰς Ἱεροσόλυμα
  choice: kuelekea Yerusalemu
  rationale: εἰς inaweza kuonyesha kikomo cha mwendo, lakini katika muhtasari huu wa safari msisitizo ni mwelekeo na maendeleo ya safari, si kwamba tayari amewasili.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
theological_decisions:
- issue: Mwelekeo wa safari ya Yesu kwenda Yerusalemu
  choice: kuelekea Yerusalemu
  alternative: kwenda Yerusalemu
  rationale: “Kuelekea” inadumisha picha ya safari inayoendelea katika simulizi la Luka bila kudai kuwasili mara moja. Tanbihi inahifadhi uwezekano wa kutafsiri εἰς moja kwa moja zaidi kuwa “kwenda.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “alikuwa akipita” unaonyesha tendo linaloendelea, na “huku akiendelea na safari yake” unaunganisha kwa kawaida kufundisha na mwendo wa Yesu.
