id: LUK.13.27
reference: Luke 13:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: sw
  text: Naye atawaambia, “Sijui mmetoka wapi. Ondokeni kwangu, ninyi nyote watenda maovu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninyi nyote watenda yasiyo ya haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: atawaambia
  rationale: Muundo wa Kigiriki una kitenzi cha kusema pamoja na kirai-shirikishi chenye maana inayorudiwa. Kiswahili cha kawaida huunganisha wazo hilo kwa kitenzi kimoja, ‘atawaambia,’ ambacho pia kinaonyesha walengwa wa maneno hayo.
- source_word: οἶδα
  choice: Sijui
  rationale: Huhifadhi maana ya msingi ya ‘kujua’ bila kuifanya wazi zaidi kuwa ‘kutambua,’ ingawa katika muktadha huu kauli hiyo inaashiria kutowakubali kuwa watu wake.
- source_word: πόθεν ἐστέ
  choice: mmetoka wapi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha asili au mahali wanakotoka.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Ondokeni kwangu
  rationale: Amri hii huonyesha kujitenga kwa uamuzi na msemaji; ‘ondokeni kwangu’ ni ya kawaida, nzito, na inaeleweka wazi.
- source_word: πάντες ἐργάται
  choice: ninyi nyote watenda
  rationale: ‘Ninyi nyote’ huleta wazi nguvu ya mwito wa moja kwa moja, na ‘watenda’ huonyesha watu wanaozoea kufanya jambo fulani.
- source_word: ἀδικίας
  choice: maovu
  rationale: Katika muungano ‘watenda maovu,’ chaguo hili ni la asili na linaloeleweka kwa urahisi, huku likibeba maana pana ya matendo yasiyo ya haki au mabaya.
theological_decisions:
- issue: Maana ya ἀδικίας katika kauli ya hukumu
  choice: maovu
  alternative: yasiyo ya haki; uovu
  rationale: ἀδικία linaweza kumaanisha ukosefu wa haki, uovu, au tendo baya. ‘Watenda maovu’ huhifadhi upana wa lawama ya kimaadili bila kuingiza wazo maalumu la kuvunja sheria, ambalo lingekaribia zaidi ἀνομία.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa Kigiriki ἐρεῖ λέγων umesawazishwa kuwa ‘atawaambia’ ili kuepuka marudio yasiyo ya kawaida katika Kiswahili. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
