  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: sw
  text: Nao watakuja kutoka mashariki na magharibi, na kutoka kaskazini na kusini, nao wataketi mezani[a] katika ufalme wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakaa kwa kujiegemeza.” Neno la Kigiriki linarejelea hasa mkao wa kujiegemeza wakati wa kula karamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: watakuja
  rationale: Wakati ujao wa ἥκω una maana ya kuja au kufika; “watakuja” ni ya kawaida na inaendana vizuri na maelezo ya maeneo yanayofuata.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: kutoka mashariki na magharibi
  rationale: Nomino hizi za wingi, kihalisi “maawio” na “machweo,” ni nahau ya pande za dunia; Kiswahili cha kawaida hutumia “mashariki na magharibi.”
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: kutoka kaskazini na kusini
  rationale: Kauli hii inaendeleza mtiririko wa pande nne za dunia kwa Kiswahili cha asili na wazi.
- source_word: ἀνακλιθήσονται
  choice: wataketi mezani
  rationale: Katika muktadha wa karamu, ἀνακλίνω humaanisha kujiegemeza au kulala kwa ubavu wakati wa kula. “Wataketi mezani” huwasilisha kwa kawaida ushiriki katika mlo kwa msomaji wa leo, huku tanbihi ikihifadhi picha mahsusi ya desturi ya kale.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: Hii ni tafsiri sanifu na ya moja kwa moja inayohifadhi uzito wa kitheolojia na kieskatolojia wa βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Picha ya karamu katika ufalme wa wakati ujao
  choice: Kuhifadhi rejeleo la mlo kwa “wataketi mezani,” pamoja na tanbihi kuhusu kujiegemeza mezani.
  alternative: wataketi katika ufalme wa Mungu
  rationale: Kitenzi cha Kigiriki kinaibua picha ya kushiriki katika karamu, si kuingia au kuketi tu. Tafsiri hii inalinda picha hiyo bila kuongeza maelezo ya kimafundisho yasiyotajwa.
- issue: Upeo wa pande zote za dunia
  choice: Kutaja pande nne moja kwa moja bila kubainisha kabila au taifa la wanaokuja.
  alternative: Kufafanua wazi kuwa ni watu wa Mataifa kutoka mataifa yote
  rationale: Maneno yanaonyesha ukusanyaji kutoka kila upande, lakini mstari wenyewe hauwataji wazi watu wa Mataifa; hivyo tafsiri haipaswi kufasiri zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” inadumisha viunganishi vya Kigiriki bila kufanya sentensi kuwa nzito. “Wataketi mezani” ni ya kawaida zaidi kuliko “watajiegemeza mezani” katika maandishi makuu, huku tanbihi ikihifadhi usahihi wa kihistoria wa picha ya karamu.
