  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: sw
  text: 'Akasema mfano huu: “Mtu mmoja alikuwa na mtini uliopandwa katika shamba lake la mizabibu; akaja kutafuta matunda kwenye mtini huo, lakini hakuyapata.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: Kisha akawaambia
  rationale: Kauli ya wakati usiotimilika inawasilisha tendo la kusimulia katika mtiririko wa habari, na δέ ni kiunganishi chepesi. ‘Kisha akawaambia’ ni ya kawaida katika masimulizi ya Kiswahili na inadokeza kuwa mfano uliwaelekezwa wasikilizaji.
- source_word: ταύτην τὴν παραβολήν
  choice: mfano huu
  rationale: ‘Mfano’ ndilo neno la kawaida na sahihi kwa παραβολή katika mafundisho ya Yesu.
- source_word: Συκῆν εἶχέν τις
  choice: Mtu mmoja alikuwa na mtini
  rationale: τις ni kiwakilishi kisichobainisha mtu fulani; ‘mtu mmoja’ ni njia ya kawaida ya Kiswahili ya kumtambulisha mhusika wa simulizi bila kuongeza utambulisho maalumu.
- source_word: πεφυτευμένην
  choice: uliokuwa umepandwa
  rationale: Kauli timilifu tendwa inaonyesha mtini ukiwa katika hali iliyotokana na kupandwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: katika shamba lake la mizabibu
  rationale: ἀμπελών ni eneo lililopandwa mizabibu; ‘shamba la mizabibu’ ni wazi na la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: ἦλθεν ζητῶν
  choice: Akaja kutafuta
  rationale: Muundo wa kitenzi pamoja na kishirikishi unaonyesha kuja akiwa na shughuli au kusudi la kutafuta; Kiswahili huuwasilisha kwa kawaida kwa ‘akaja kutafuta’.
- source_word: καρπὸν ἐν αὐτῇ
  choice: matunda juu yake
  rationale: Ingawa καρπόν ni umoja wa kijumla, Kiswahili kwa kawaida hutumia ‘matunda’ kwa mazao ya mti. ‘Juu yake’ inaeleza kwa kawaida mahali matunda yanapopatikana kwenye mti.
- source_word: καὶ οὐχ εὗρεν
  choice: lakini hakupata
  rationale: καί hapa huleta matokeo yanayokinzana na matarajio; ‘lakini’ huonyesha uhusiano huo kwa uwazi bila kuongeza maana. Kitu kilichokosekana kinaeleweka kuwa matunda yaliyotajwa.
theological_decisions:
- issue: Mhusika asiyeainishwa anayewakilishwa na τις
  choice: Mtu mmoja
  alternative: Mtu fulani
  rationale: Kigiriki hakimtambulishi mhusika wala kumpa umuhimu wa kiteolojia. ‘Mtu mmoja’ hudumisha hali yake ya kutotajwa jina na mtindo wa kawaida wa mfano.
- issue: Uwezekano wa maana ya kiishara ya matunda
  choice: matunda
  alternative: mazao
  rationale: ‘Matunda’ huhifadhi maana halisi katika simulizi na pia mwangwi mpana wa kiishara bila kuufafanua mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi ni ya kim自然 katika usimulizi wa mdomo na usomaji wa hadharani; hakuna istilahi ya dhehebu iliyoingizwa.
