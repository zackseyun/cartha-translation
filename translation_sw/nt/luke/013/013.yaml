  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: sw
  text: Akamwekea mikono, naye mara moja akanyooka[a] na kumtukuza Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasimama wima” au “akawekwa sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: akamwekea mikono
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza tendo la kuweka mikono juu ya mtu; kiambishi -m- kinamrejelea mwanamke, na mwenye mikono anaeleweka kuwa Yesu.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: Huonyesha kwamba jambo lilitokea papo hapo, bila kuchelewa.
- source_word: ἀνωρθώθη
  choice: akanyooka
  rationale: Katika muktadha wa mwanamke aliyekuwa amepinda, kitenzi hiki kinaeleza kurudishwa katika hali ya kuwa wima. Kiswahili 'akanyooka' ni cha kawaida na hakiongezi neno 'tena,' ambalo halijaelezwa wazi katika Kigiriki.
- source_word: ἐδόξαζεν
  choice: kumtukuza
  rationale: Huhifadhi maana nzito ya δοξάζω ya kumpa Mungu utukufu; muundo unaoendelea baada ya 'na' unasomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya kitendo cha kutukuza na ndiyo tafsiri ya kawaida.
theological_decisions:
- issue: Matokeo ya uponyaji yanayoelezwa na ἀνωρθώθη
  choice: akanyooka
  alternative: akawekwa sawa; akasimama wima; akanyooka tena
  rationale: Muktadha unaonyesha uponyaji wa mwili wa mwanamke aliyekuwa amepinda. 'Akanyooka' huwasilisha urejesho huo bila kubainisha zaidi namna ulivyotendeka; 'tena' haijawekwa katika matini kuu kwa kuwa haipo wazi katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akamwekea mikono' na 'akanyooka' ni maneno ya kawaida yanayoeleweka kwa urahisi huku yakibaki karibu na ushahidi wa Kigiriki.
