id: LUK.13.25
reference: Luke 13:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: sw
  text: Baada ya mwenye nyumba kusimama na kufunga mlango, nanyi mtaanza kusimama nje na kubisha mlango, mkisema, ‘Bwana, tufungulie.’ Ndipo atawajibu, ‘Siwajui ninyi, mnatoka wapi.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Baada ya
  rationale: 'Kifungu hiki kinaanzisha wakati usioainishwa: baada ya au mara tu tendo linalofuata linapotokea. ‘Baada ya’ ni Kiswahili cha kawaida na huhifadhi mpangilio wa matukio.'
- source_word: ἐγερθῇ
  choice: kusimama
  rationale: Hapa kitenzi humaanisha kuinuka kutoka kuketi au kulala, si kufufuka kutoka kwa wafu. ‘Kusimama’ ni cha asili katika muktadha huu.
- source_word: ὁ οἰκοδεσπότης
  choice: mwenye nyumba
  rationale: Neno hili humaanisha mwenye mamlaka juu ya nyumba. ‘Mwenye nyumba’ ni usemi wa kawaida wa Kiswahili na unaweza kumaanisha mwenye nyumba au mkuu wake kulingana na muktadha.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: kufunga mlango
  rationale: Kitenzi kina maana ya kufunga au kuziba njia. ‘Kufunga mlango’ hudokeza uamuzi wa kuwazuia walioko nje bila kuongeza kwamba uliwekwa kufuli.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: mtaanza kusimama nje
  rationale: Huhifadhi kitenzi ‘kuanza,’ hali ya kusimama, na mahali ‘nje,’ huku wakati ujao ukifaa mfuatano wa sentensi ya Kiswahili.
- source_word: κρούειν τὴν θύραν
  choice: kubisha mlango
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kugonga mlango ili walio ndani wafungue.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi maana ya kawaida ya κύριος na mwangwi wake wa kitheolojia, huku katika mfano huu pia ikiweza kueleweka kama namna ya kumwita mwenye mamlaka kwa heshima.
- source_word: ἄνοιξον ἡμῖν
  choice: tufungulie
  rationale: ‘Tufungulie’ ni ombi fupi na la asili la Kiswahili; kitu kinachofunguliwa, yaani mlango, kinaeleweka wazi kutokana na muktadha.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: atawajibu
  rationale: Muundo wa Kigiriki wa ‘akijibu atasema’ unatolewa kwa kawaida na kwa usahihi kama ‘atawajibu.’
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Siwajui ninyi, wala sijui mnatoka wapi
  rationale: Tafsiri hii huhifadhi kiwakilishi cha moja kwa moja ὑμᾶς pamoja na swali la asili πόθεν, lakini hutumia ‘wala sijui’ ili Kiswahili kisomeke kwa kawaida bila kufuta mvutano wa kauli ya Kigiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριε katika mfano
  choice: Bwana
  alternative: Mheshimiwa; mwenye nyumba
  rationale: ‘Bwana’ ni linganisho la kawaida la κύριος na halifungi maana yake kwa heshima ya kijamii pekee wala kulazimisha utambulisho wa msemaji zaidi ya maandishi.
- issue: Nguvu ya Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Siwajui ninyi, wala sijui mnatoka wapi
  alternative: Sijui ninyi ni wa wapi
  rationale: Chaguo kuu huhifadhi vipengele vyote viwili vya Kigiriki—kutowajua wao na kutokujua walikotoka—bila kuvifanya kuwa dai moja tu kuhusu mahali walikotoka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka sauti ya mfano na onyo lake bila kuongeza maelezo ya kimadhehebu.
