  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: sw
  text: Jitahidini kuingia kupitia mlango mwembamba[a], kwa sababu nawaambia, wengi watatafuta kuingia na hawataweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupitia lango jembamba.” Kigiriki cha Luka kinasema “mlango” (θύρα), ilhali kifungu sambamba katika Mathayo kinatumia “lango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Jitahidini
  rationale: Amri hii inaonyesha juhudi kubwa na ya dhati. “Jitahidini” ni Kiswahili cha kawaida chenye uzito unaofaa, bila kuongeza wazo la kustahili wokovu kwa matendo.
- source_word: εἰσελθεῖν
  choice: kuingia
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kitenzi, nayo imetumiwa kwa namna ileile katika sehemu zote mbili za mstari.
- source_word: διὰ τῆς στενῆς θύρας
  choice: kupitia mlango mwembamba
  rationale: θύρα kwa kawaida ni “mlango,” tofauti na neno la “lango” lililotumiwa katika kifungu sambamba cha Mathayo. “Mwembamba” huhifadhi maana ya στενῆς.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya amri iliyotangulia.
- source_word: πολλοί
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinatafsiriwa kwa kawaida kuwa “wengi.”
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni njia ya asili na yenye hadhi ya kuwasilisha kauli ya Yesu kwa Kiswahili cha sasa.
- source_word: ζητήσουσιν
  choice: watatafuta
  rationale: “Watatafuta” huhifadhi maana ya msingi ya ζητέω na tofauti yake na juhudi kubwa inayoelezwa na Ἀγωνίζεσθε.
- source_word: οὐκ ἰσχύσουσιν
  choice: hawataweza
  rationale: Katika muktadha huu kitenzi kinamaanisha kutokuwa na uwezo wa kutimiza jambo, hivyo “hawataweza” ni wazi na ya moja kwa moja.
theological_decisions:
- issue: Juhudi ya mwanadamu katika lugha ya wokovu
  choice: Kuhifadhi amri “Jitahidini” bila kuipunguza nguvu wala kuieleza kuwa msingi wa kustahili wokovu.
  alternative: “Jaribuni kuingia” au “Fanyeni kila juhudi kuingia.”
  rationale: Mstari unaamuru juhudi ya dhati na pia unaonya kwamba wengi watatafuta kuingia lakini hawataweza. Tafsiri inahifadhi mvutano huo bila kuamua mabishano kuhusu neema, matendo, uhuru wa mwanadamu, au ukuu wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kueleweka na chenye hadhi. “Jitahidini” linaelekezwa kwa watu wengi, kama umbo la Kigiriki. “Mlango mwembamba” limehifadhiwa badala ya kuoanisha Luka kimyakimya na Mathayo.
