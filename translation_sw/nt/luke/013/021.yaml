  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: sw
  text: Unafanana na chachu[a] ambayo mwanamke mmoja aliichukua na kuificha[b] katika vipimo vitatu vya unga[c], mpaka unga wote ukachachuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamira.” Neno la Kigiriki linamaanisha kitu kinachotumiwa kuchachusha donge.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuichanganya ndani ya.” Kitenzi cha Kigiriki kwa maana ya moja kwa moja ni “kuficha” au “kusitiri.”
    reason: lexical_alternative
  - marker: c
    text: Kwa Kigiriki, “sata tatu,” yaani kiasi kikubwa cha unga. Sata kilikuwa kipimo cha kale cha vitu vikavu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Unafanana na
  rationale: Kivumishi hiki kinaanzisha ulinganisho na kinarejelea nomino ya kike ya muktadha uliotangulia, yaani ufalme. Kiswahili cha kawaida hutumia ‘unafanana na’ bila kurudia nomino hiyo katika aya hii.
- source_word: ζύμῃ
  choice: chachu
  rationale: ‘Chachu’ ni neno la kawaida la Kiswahili kwa kitu kinachochachusha donge, na linahifadhi taswira ya kale bila kudokeza mahsusi bidhaa ya kisasa ya viwandani.
- source_word: λαβοῦσα γυνὴ
  choice: ambayo mwanamke mmoja aliichukua
  rationale: Muundo huu unatoa kwa Kiswahili cha kawaida tendo la kitenzi kishirikishi cha Kigiriki na unaonyesha kuwa γυνή hapa ni mwanamke asiyeainishwa.
- source_word: ἔκρυψεν
  choice: kuificha
  rationale: Hili linahifadhi maana ya moja kwa moja ya kitenzi cha Kigiriki, ‘kuficha,’ badala ya kukibadili kimyakimya kuwa ‘kuchanganya,’ ingawa tendo hilo katika picha ya upishi linahusisha kuitia chachu ndani ya unga.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: katika vipimo vitatu vya unga
  rationale: ‘Vipimo vitatu’ kinaeleweka kwa msomaji wa kawaida, huku maelezo ya kipimo cha kale sata yakihifadhiwa katika tanbihi.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Hiki ni kiunganishi cha wakati kilicho cha kawaida na cha asili katika Kiswahili.
- source_word: ἐζυμώθη ὅλον
  choice: unga wote ukachachuka
  rationale: Kauli hii ya Kiswahili inaeleza kwa kawaida hali ya kiasi chote kuchachushwa na inahifadhi msisitizo wa ὅλον, ‘chote.’
theological_decisions:
- issue: Maana ya mfano ya chachu katika mfano huu
  choice: Kutumia ‘chachu’ kwa maana isiyoegemea upande wowote bila kuingiza tafsiri hasi au chanya katika maandishi.
  alternative: Kufafanua chachu kuwa ishara ya uovu, au kuwa ishara chanya ya kuenea kwa ufalme.
  rationale: Aya yenyewe inatoa picha ya chachu inayopenya kiasi chote. Tafsiri inapaswa kuhifadhi picha hiyo na mvutano wake wa kitheolojia bila kuamua mjadala wa ufasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa ‘kuificha’ umehifadhiwa kwa uaminifu kwa Kigiriki, huku tanbihi ikitoa usemi wa kawaida zaidi katika muktadha wa upishi.
