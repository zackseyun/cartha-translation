base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: sw
  text: Na tazama, kulikuwa na mwanamke aliyekuwa na roho ya udhaifu[a] kwa miaka kumi na minane, naye alikuwa amepinda wala hakuweza kujinyoosha kabisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho iliyomlemaza.” Kigiriki kinataja wazi “roho,” jambo linaloweza kuashiria kwamba hali yake ilihusisha utendaji wa kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili la kuvuta usikivu linahifadhi uhai wa simulizi kwa lugha yenye heshima na inayoeleweka.
- source_word: γυνὴ
  choice: mwanamke
  rationale: Muktadha unamtambulisha mwanamke ambaye hakuwa ametajwa kabla.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: aliyekuwa na roho ya udhaifu
  rationale: Muundo huu unahifadhi kutajwa wazi kwa “roho” na maana pana ya udhaifu, bila kuamua zaidi ya maandishi kuhusu namna ya usababisho wa kiroho.
- source_word: ἔτη δεκαοκτώ
  choice: kwa miaka kumi na minane
  rationale: “Kwa” huonyesha muda kwa njia ya kawaida katika Kiswahili.
- source_word: συγκύπτουσα
  choice: alikuwa amepinda
  rationale: Hueleza hali yake ya mwili kwa uwazi bila kuongeza kiwango kisichotajwa.
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: wala hakuweza kujinyoosha kabisa
  rationale: Huhifadhi kutoweza kwake kurudi katika mkao ulionyooka pamoja na msisitizo wa εἰς τὸ παντελές.
theological_decisions:
- issue: Ikiwa πνεῦμα ἀσθενείας iondolewe au ifafanuliwe kuwa hali ya kimatibabu tu
  choice: Kuhifadhi “roho ya udhaifu” katika matini kuu
  alternative: roho iliyomlemaza; udhaifu uliosababishwa na roho
  rationale: Kigiriki kinataja πνεῦμα waziwazi, lakini hakilazimishi hapa dai mahususi zaidi la kupagawa na pepo; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” ni mwito wa kisimulizi wa kuvuta usikivu; “roho ya udhaifu” huhifadhi kwa makusudi upekee na utata wa usemi wa Kigiriki.
