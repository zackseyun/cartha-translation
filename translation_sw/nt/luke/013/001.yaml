  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: sw
  text: Wakati huo, baadhi ya watu waliokuwa hapo walikuwa wakimweleza kuhusu Wagalilaya ambao Pilato alikuwa amechanganya damu yao na dhabihu zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amechanganya pamoja na dhabihu zao.”
    reason: Njia nyingine ya kuwasilisha ἔμιξεν (“alichanganya”); huhifadhi taswira kali ya Kigiriki bila kufafanua zaidi namna tukio lilivyotendeka.
lexical_decisions:
- source_word: Παρῆσαν
  choice: waliokuwapo
  rationale: Kauli ya wakati usiotimilika hapa inaeleza kuwapo kwa watu fulani, si kuwasili kwao.
- source_word: δέ
  choice: Wakati huohuo
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi; hapa kimewasilishwa kwa njia ya asili pamoja na kishazi cha wakati kinachofuata bila kuongeza wazo la ‘sasa.’
- source_word: τινες
  choice: baadhi ya watu
  rationale: Huwataja watu kadhaa bila kuwabainisha; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Wakati huohuo
  rationale: Huhusianisha tukio hili moja kwa moja na wakati wa mazungumzo yaliyotangulia na kuhifadhi msisitizo wa αὐτῷ.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: walimpa habari
  rationale: Kitenzi hiki kina wazo la kumfikishia mtu taarifa, si kusema tu; muundo wa Kiswahili unaeleza tendo hilo kwa ufasaha.
- source_word: περὶ τῶν Γαλιλαίων
  choice: kuhusu Wagalilaya
  rationale: περί pamoja na hali ya umilikishi hutambulisha mada ya habari hiyo.
- source_word: ὧν τὸ αἷμα
  choice: ambao ... damu yao
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida kiwakilishi husishi na uhusiano wa umilikishi wa Kigiriki.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἔμιξεν
  choice: alikuwa amechanganya
  rationale: Kuchanganya hutoa maana ya msingi ya μίγνυμι; wakati timilifu uliopita unaonyesha kuwa kitendo kilitangulia taarifa iliyotolewa.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: na dhabihu zao
  rationale: μετά pamoja na hali ya umilikishi ina maana ya ‘na,’ huku ‘dhabihu zao’ ikihifadhi αὐτῶν bila kufafanua kama walikuwa wakizitoa wakati huo.
theological_decisions:
- issue: Maana ya kihistoria na kimaadili ya tendo la Pilato
  choice: Kueleza moja kwa moja kwamba Pilato alikuwa amechanganya damu ya Wagalilaya na dhabihu zao.
  alternative: Kupanua kwa maelezo, ‘aliwaua walipokuwa wakitoa dhabihu.’
  rationale: Kigiriki kinaripoti tukio hilo kwa maneno makali lakini hakielezi namna lilivyotendeka wala maana yake ya kiteolojia. Tafsiri haiongezi maelezo yasiyosemwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walimpa habari’ ni lugha ya kawaida inayoonyesha utoaji wa taarifa, na ‘Wagalilaya’ pamoja na ‘Pilato’ ni maumbo yanayotambulika kwa urahisi.
