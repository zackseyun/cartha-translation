reference: Luke 13:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: sw
  text: Saa ileile, baadhi ya Mafarisayo wakamjia na kumwambia, “Ondoka, uende zako kutoka hapa, kwa sababu Herode anataka kukuua.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Saa ileile
  rationale: Kirai hiki kinaonyesha wakati mahususi na wa papo hapo; “saa ileile” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa αὐτῇ.
- source_word: προσῆλθάν
  choice: wakamjia
  rationale: Kitenzi kina maana ya kuja karibu au kumkaribia mtu; “wakamjia” kinaonyesha kwa kawaida kwamba walimkaribia Yesu.
- source_word: τινες Φαρισαῖοι
  choice: baadhi ya Mafarisayo
  rationale: τινες haitaji Mafarisayo hao ni akina nani; “baadhi ya” huhifadhi hali hiyo ya kutotajwa kwa usahihi.
- source_word: λέγοντες αὐτῷ
  choice: na kumwambia
  rationale: Kirai cha hali kinatolewa kwa mtiririko wa kawaida wa masimulizi ya Kiswahili bila kubadili uhusiano wake na kitendo cha kumjia.
- source_word: Ἔξελθε
  choice: Ondoka
  rationale: Amri hii inamtaka Yesu aondoke mahali hapo; “ondoka” ni ya moja kwa moja na ya kawaida bila ukali wa ziada.
- source_word: καὶ πορεύου ἐντεῦθεν
  choice: uende zako kutoka hapa
  rationale: “Uende zako” huonyesha kuendelea na safari kwa kuondoka, huku “kutoka hapa” ikihifadhi maana ya ἐντεῦθεν; pia hudumisha vitendo viwili vya ἔξελθε na πορεύου.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya onyo kwa uwazi.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Hili ndilo umbo la kawaida la jina hilo katika matumizi ya Biblia ya Kiswahili.
- source_word: θέλει
  choice: anataka
  rationale: θέλω hapa hueleza kutaka au kutamani; “anataka” hakiongezi wazo lenye nguvu zaidi la mpango uliokwisha kuamuliwa.
- source_word: ἀποκτεῖναι
  choice: kukuua
  rationale: Kitenzi hiki humaanisha kuua; umbo la yambwa “kukuua” ni la asili katika sentensi hii na halidokezi lazima hukumu rasmi ya kifo.
theological_decisions:
- issue: Nia ya Mafarisayo katika kutoa onyo
  choice: Kauli yao imetafsiriwa moja kwa moja kama ilivyosimuliwa, bila kutaja kama walikuwa waaminifu au wadanganyifu.
  alternative: Kueleza kwamba walikuwa wakimwonya Yesu kwa dhati, au kwamba walikuwa wakijaribu kumtisha ili aondoke.
  rationale: Kigiriki kinaripoti walichosema lakini hakifafanui nia yao; tafsiri inaacha uwazi huo wa kisimulizi kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wakamjia na kumwambia” ni wa kawaida katika masimulizi; “uende zako” hapa ni agizo la kuondoka na kuendelea na safari, si usemi wa dharau.
