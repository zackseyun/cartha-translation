  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: sw
  text: Huko kutakuwa na kilio na kusaga meno, mtakapowaona Abrahamu, Isaka, Yakobo na manabii wote wakiwa katika ufalme wa Mungu, lakini ninyi wenyewe mkitupwa nje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkifukuzwa nje.” Kitenzi cha Kigiriki kinaonyesha kutolewa kwa nguvu na kutengwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Huko
  rationale: Kielezi hiki cha mahali kinaelekeza kwenye mahali pa kutengwa au hukumu; “huko” ni cha kawaida na kinaweka rejeo la mahali wazi.
- source_word: ὁ κλαυθμὸς
  choice: kilio
  rationale: “Kilio” ni tafsiri ya kawaida na yenye hadhi ya maombolezo au kulia katika muktadha huu wa hukumu, bila kuzidisha maana kuwa lazima ni kupiga yowe.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Ni msemo wa Kiswahili unaoeleweka unaohifadhi picha halisi ya kung’ang’aniza meno kwa uchungu au ghadhabu.
- source_word: ὅταν ὄψησθε
  choice: mtakapowaona
  rationale: Muundo huu unaonyesha tukio maalumu la wakati ujao na kwa kawaida hutafsiriwa kiasili kwa “mtakapowaona” katika Kiswahili.
- source_word: πάντας τοὺς προφήτας
  choice: manabii wote
  rationale: Inahifadhi kwa uwazi msisitizo wa πάντας, “wote.”
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: wakiwa katika ufalme wa Mungu
  rationale: “Ufalme wa Mungu” huhifadhi istilahi kuu ya kibiblia; “wakiwa” huunganisha kwa Kiswahili cha asili kile wanachoona kuhusu mababu na manabii.
- source_word: ὑμᾶς δὲ
  choice: lakini ninyi wenyewe
  rationale: “Lakini” huonyesha utofautishaji wa δέ, na “ninyi wenyewe” huleta msisitizo wa kiwakilishi ὑμᾶς.
- source_word: ἐκβαλλομένους ἔξω
  choice: mkitupwa nje
  rationale: “Mkitupwa” huhifadhi kauli tendwa na nguvu ya kufukuzwa, huku “nje” ikihifadhi ἔξω na picha ya kutengwa.
theological_decisions:
- issue: Hali ya picha ya hukumu
  choice: Kuhifadhi lugha halisi ya kilio, kusaga meno, na kutupwa nje bila kuipunguza au kuifafanua zaidi ya mstari.
  alternative: Kutafsiri kwa ufafanuzi kama “huzuni kuu” au “hukumu ya mwisho.”
  rationale: Mstari unaonyesha kutengwa na ufalme pamoja na maumivu yanayotokana nayo, lakini wenyewe hauelezi mfumo kamili wa fundisho la hukumu. Tafsiri huhifadhi picha na mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili bila kupoteza utofautishaji mkali kati ya walio katika ufalme na “ninyi wenyewe” mnaotupwa nje.
