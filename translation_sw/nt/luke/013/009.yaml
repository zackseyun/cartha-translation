base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: sw
  text: Na kama mti huo ukizaa matunda wakati ujao—vema; lakini mti huo usipozaa, utaukata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἂν μὲν
  choice: Na kama
  rationale: κἂν (καί + ἐάν) huendeleza usemi na kuanzisha sharti; μέν hutayarisha utofautishaji unaofuata kwa δέ. “Na kama” ni Kiswahili cha kawaida kinachohifadhi uhusiano na sharti.
- source_word: ποιήσῃ καρπὸν
  choice: ukizaa matunda
  rationale: Katika muktadha wa kilimo, ποιέω pamoja na καρπός humaanisha kuzaa au kutoa matunda. Kiswahili kwa kawaida husema mti “huzaa matunda.”
- source_word: εἰς τὸ μέλλον
  choice: wakati ujao
  rationale: Kirai hiki kwa karibu humaanisha “kwa wakati ujao” au “katika wakati unaokuja.” Chaguo hili haliongezi kwa uhakika kipindi mahususi cha “mwaka ujao,” ambacho hakitajwi wazi katika mstari huu.
- source_word: εἰ δὲ μήγε
  choice: lakini usipozaa
  rationale: Hutoa upande wa pili wa sharti kwa ufupi. Kitenzi “kuzaa” kimerudiwa kwa uwazi wa kawaida wa Kiswahili, ingawa katika Kigiriki kinaeleweka kutokana na kishazi kilichotangulia.
- source_word: ἐκκόψεις αὐτήν
  choice: utaukata
  rationale: ἐκκόπτω katika muktadha huu ni kuukata na kuuondoa mti. Kiambishi “-u-” kinarejelea mtini uliotajwa katika muktadha.
theological_decisions:
- issue: Maana ya wakati katika kucheleweshwa kwa hukumu ya mwenye shamba
  choice: Mstari unabaki na matokeo yenye sharti na kirai cha jumla “wakati ujao,” bila kuweka “mwaka ujao” katika matini kuu.
  alternative: Kutafsiri εἰς τὸ μέλλον kuwa “mwaka ujao” kutokana na “mwaka huu” katika mstari uliotangulia.
  rationale: Kigiriki cha mstari huu hakitaji wazi “mwaka ujao,” bali kinatumia usemi wa wakati unaokuja. Hili linahifadhi onyo la hukumu iliyocheleweshwa lakini inayoweza kutekelezwa bila kuongeza umahususi usio wazi katika maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kilimo umehifadhiwa, na “ni vema” huwakilisha jibu linaloeleweka lakini lisilotajwa wazi baada ya upande wa kwanza wa sharti.
