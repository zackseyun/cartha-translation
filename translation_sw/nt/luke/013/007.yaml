id: LUK.13.7
reference: Luke 13:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: sw
  text: Kisha akamwambia mtunza shamba la mizabibu, “Tazama, kwa miaka mitatu sasa nimekuwa nikija kutafuta matunda kwenye mtini huu, lakini sijapata. Ukate. Kwa nini hata unaifanya ardhi isiwe na faida?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini hata unaifanya ardhi isizae?” Kitenzi cha Kigiriki kinaweza kumaanisha kuifanya ardhi isiwe na manufaa au isizae, si kuifanya ichukuliwe tu kuwa nafasi inayotumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: mtunza shamba la mizabibu
  rationale: Neno hili humaanisha mtu anayelilima na kulitunza shamba la mizabibu; tafsiri hii ni wazi kwa wasomaji wa Kiswahili na inadumisha mazingira ya shamba hilo.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Linavuta usikivu kwa msisitizo kwa lugha ya heshima na inayoeleweka.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: kwa miaka mitatu sasa
  rationale: Inaonyesha muda ulioanzia zamani na kuendelea hadi wakati wa kusema.
- source_word: ἔρχομαι ζητῶν
  choice: nimekuwa nikija kutafuta
  rationale: Inaonyesha tendo lililorudiwa au kuendelea katika kipindi cha miaka mitatu.
- source_word: καρπὸν
  choice: matunda
  rationale: Inadumisha maana halisi ya kilimo katika mfano bila kuingiza tafsiri ya kitheolojia.
- source_word: συκῇ
  choice: mtini
  rationale: Hili ndilo jina la kawaida na sahihi la mti unaotajwa.
- source_word: οὐχ εὑρίσκω
  choice: sijapata
  rationale: Kwa Kiswahili, kauli hii inatoa kwa kawaida muhtasari wa utafutaji wa mara kwa mara ambao haukufanikiwa hadi sasa.
- source_word: ἔκκοψον αὐτήν
  choice: Ukate
  rationale: Amri ya moja kwa moja ya kuukata mti; kiwakilishi cha ngeli katika kitenzi kinaonyesha mtini unaorejelewa.
- source_word: ἱνατί καὶ τὴν γῆν καταργεῖ
  choice: Kwa nini uendelee hata kuufanya udongo usizae?
  rationale: καταργεῖ inaweza kumaanisha kuufanya udongo usiwe na manufaa au uzalishaji. Tafsiri hii inadumisha maana hiyo yenye nguvu kuliko wazo la kuchukua nafasi tu, huku καί ikiwakilishwa na “hata.”
theological_decisions:
- issue: Taswira ya mfano dhidi ya ufafanuzi wa wazi wa kitheolojia
  choice: Kudumisha lugha halisi ya kilimo
  alternative: Kutaja moja kwa moja kutokuwa na matunda ya kiroho
  rationale: Chanzo kinatoa mfano wa kilimo; tafsiri haipaswi kuingiza ndani ya mstari maana ya kitheolojia ambayo msomaji anapaswa kuitambua kutokana na muktadha.
- issue: Maana ya καταργεῖ kuhusu udongo
  choice: kuufanya udongo usizae
  alternative: kuutumia bure udongo / kuchukua nafasi ardhini
  rationale: Kitenzi kinaweza kueleza kuufanya udongo usiwe na manufaa au uzalishaji. Maana hii imewekwa katika maandishi, huku wazo mbadala la kutumia nafasi au rasilimali likihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mtunza shamba la mizabibu” ni wazi kuliko istilahi adimu ya kitaalamu. Muundo “nimekuwa nikija” unaonyesha ziara zilizorudiwa, na taswira ya kilimo imehifadhiwa bila kuifasiri kidhehebu.
