  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: sw
  text: La, nawaambia; lakini msipotubu, ninyi nyote mtaangamia vivyo hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia hiyo hiyo.” Usemi “vivyo hivyo” unaweza kurejelea hukumu ya ghafula ya aina inayofanana, si lazima namna ileile kabisa ya kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: La
  rationale: Jibu hili linakataa kwa uthabiti dhana iliyodokezwa katika muktadha uliotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa moja kwa moja na wa asili unaohifadhi msisitizo wa Yesu kwa wasikilizaji wake.
- source_word: ἀλλ’
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya dhana iliyokataliwa na onyo linalofuata.
- source_word: ἐὰν μὴ
  choice: msipo-
  rationale: Muundo wa sharti hasi katika Kiswahili unaeleza kwa kawaida maana ya ‘isipokuwa’ katika sentensi hii.
- source_word: μετανοῆτε
  choice: msipotubu
  rationale: ‘Kutubu’ ni neno la kawaida na lililo wazi kwa mabadiliko ya nia na mwelekeo mbele za Mungu; halipunguzi maana kuwa kubadili mawazo kiakili tu.
- source_word: πάντες
  choice: ninyi nyote
  rationale: Kiwakilishi pamoja na ‘nyote’ kinasisitiza kwamba onyo linawahusu wasikilizaji wote.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Kinahifadhi ulinganisho na matukio yaliyotajwa kabla bila kulazimisha kwamba namna ya maangamizi iwe sawa kabisa.
- source_word: ἀπολεῖσθε
  choice: mtaangamia
  rationale: Neno hili linahifadhi uzito wa onyo la hukumu bila kuifanya maana iwe kifo cha mwili pekee au kufafanua moja kwa moja hukumu ya milele.
theological_decisions:
- issue: Upeo wa ἀπολεῖσθε katika onyo la Yesu
  choice: mtaangamia
  alternative: mtakufa; mtaangamizwa; mtahukumiwa milele
  rationale: Kigiriki kinaonya juu ya maangamizi yanayohusiana na kutotubu, lakini hakifafanui hapa namna au upeo wake. ‘Mtaangamia’ huhifadhi mvutano huo wa kiteolojia.
- issue: Maana ya μετανοῆτε
  choice: msipotubu
  alternative: msipobadili mawazo yenu; msipogeuka
  rationale: Katika muktadha huu neno linahusu badiliko la ndani na la kimaadili mbele za Mungu, si marekebisho ya fikra pekee. ‘Kutubu’ ni la asili na haliongezi fundisho la dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi jibu kali, sharti la kutubu, msisitizo wa ‘nyote,’ na utata halisi wa ‘vivyo hivyo’ na ‘mtaangamia.’
