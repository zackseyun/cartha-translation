  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: sw
  text: Je, huyu mwanamke, binti ya Abrahamu, ambaye Shetani alimfunga—tazama—kwa miaka kumi na minane, hakupaswa kufunguliwa kutoka katika kifungo hiki siku ya Sabato?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: binti ya Abrahamu
  rationale: Inahifadhi istiari ya ukoo na hadhi ya agano iliyomo katika Kigiriki bila kuifafanua kupita kiasi.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: alikuwa amemfunga / kufunguliwa / kifungo
  rationale: Inadumisha uhusiano wa kimakusudi wa maneno ya kufunga, kufungua, na kifungo katika sentensi.
- source_word: ἰδού
  choice: tazama
  rationale: Inawakilisha kihisishi cha kuvuta fikira kilichopo wazi katika matini chanzo, hata ingawa matumizi yake hapa ni ya msisitizo.
- source_word: οὐκ ἔδει
  choice: hakupaswa
  rationale: Swali hasi la Kiswahili linaendeleza maana ya ulazima au kufaa inayotarajia jibu la kukubali.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: siku ya Sabato
  rationale: Ni tafsiri ya kawaida, wazi, na yenye heshima ya kirai cha Kigiriki.
theological_decisions:
- issue: Maana ya “binti ya Abrahamu”
  choice: Kuacha usemi huo kama ulivyo
  alternative: Kufafanua kuwa ni Myahudi au mtu wa imani
  rationale: Matini haitaji moja kwa moja ni kipengele gani cha utambulisho wa Abrahamu kinachosisitizwa; tafsiri inadumisha upana huo.
- issue: Uhusiano wa Shetani na ugonjwa wa mwanamke
  choice: Kusema moja kwa moja kuwa Shetani alikuwa amemfunga
  alternative: Kulegeza kuwa Shetani alikuwa chanzo cha mateso yake
  rationale: Huu ndio usemi wa moja kwa moja wa chanzo, nao unapaswa kuhifadhiwa bila kuongeza maelezo ya jinsi uhusiano huo ulivyofanya kazi.
- issue: Kufunguliwa siku ya Sabato
  choice: Kuhifadhi swali la balagha kuhusu kufaa kwa tendo hilo
  alternative: Kulibadili kuwa tamko kwamba ilikuwa halali kumponya
  rationale: Kigiriki kinauliza kuhusu ulazima au kufaa, si kutoa kanuni iliyofafanuliwa kwa istilahi nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa swali la balagha umehifadhiwa, na vistari virefu vinatenga “tazama” kama msisitizo wa kati ya sentensi.
