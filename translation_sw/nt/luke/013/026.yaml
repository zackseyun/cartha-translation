source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: sw
  text: Ndipo mtaanza kusema, ‘Tulikula na kunywa mbele yako, nawe ulifundisha katika barabara zetu[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘katika viwanja vyetu vya umma’; neno la Kigiriki linaweza kumaanisha barabara pana au maeneo ya wazi ya umma ndani ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἄρξεσθε λέγειν
  choice: mtakapoanza kusema
  rationale: Inahifadhi maana ya kuanza kufanya jambo iliyo katika kitenzi ἄρχω pamoja na kitenzi-jina λέγειν, badala ya kufupisha kuwa ‘mtasema’ tu.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Tulikula na kunywa
  rationale: Vitenzi vya wakati uliopita vimetafsiriwa kwa wakati uliopita sahili, huku uhusiano wa vitendo hivyo viwili ukihifadhiwa kwa Kiswahili cha kawaida.
- source_word: ἐνώπιόν σου
  choice: mbele yako
  rationale: Ni usemi wa asili unaoonyesha kuwa walikula na kunywa akiwa hapo; hauongezi wazo kwamba aliwakubali au alikuwa na ushirika wa kweli nao.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: katika barabara zetu
  rationale: πλατεῖαι inaweza kumaanisha barabara pana au maeneo ya wazi ya umma mjini. ‘Barabara zetu’ ni ya kawaida na inaendeleza mazingira ya hadharani bila kuyafanya kuwa viwanja hasa.
- source_word: ἐδίδαξας
  choice: ulifundisha
  rationale: Inawakilisha kitenzi cha wakati uliopita kwa urahisi na kuhifadhi dai lao kwamba alifundisha hadharani mahali walipoishi.
theological_decisions:
- issue: Maana ya hoja ya wasemaji kuhusu uhusiano wao na Yesu
  choice: Maneno yanaonyesha ukaribu wao wa nje tu—walikula na kunywa mbele yake, naye alifundisha katika maeneo yao—bila kudokeza kwamba aliwatambua kuwa watu wake.
  alternative: Tafsiri huru ingeweza kufanya kula na kunywa kuonekane kama ushirika uliokubaliwa au uhusiano wa kweli.
  rationale: Kigiriki kinawasilisha madai ya kuwa karibu naye, si uthibitisho wa Yesu kwamba aliwakubali. Tafsiri inadumisha mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ndipo mtakapoanza kusema’ ni cha asili katika muktadha huu, na ‘mbele yako’ huhifadhi dai la kuwa katika uwepo wake bila kulipanua kitheolojia.
