review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the sequence, the ingressive force of ἄρξεσθε λέγειν, the past shared eating and drinking, the speakers’ appeal to proximity to Jesus, and his public teaching in their locality. However, mtakapoanza is formally a temporal-relative form ('when you begin') and is less direct than the Greek future indicative in this context.
  naturalness: The wording is otherwise natural, clear Standard East African Swahili and retains an appropriately dignified biblical register. Mtaanza kusema is more straightforward and idiomatic here than mtakapoanza kusema.
  terminology: Mbele yako suitably conveys ἐνώπιόν σου without implying accepted fellowship. Barabara zetu is an acceptable general rendering of πλατείαις, and the footnote responsibly gives the public-square/broad-street alternative.
  issues:
  - severity: low
    issue: The future form in the opening clause is temporal-relative rather than a plain future.
    rationale: Ndipo mtakapoanza kusema can be read as 'then, when you begin to say,' whereas τότε ἄρξεσθε λέγειν is directly, 'Then you will begin to say.' Replacing it with Ndipo mtaanza kusema preserves the Greek syntax and force more precisely.
