id: LUK.13.34
reference: Luke 13:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: sw
  text: “Yerusalemu, Yerusalemu,[a] wewe unayewaua manabii na kuwapiga kwa mawe wale waliotumwa kwako—ni mara ngapi nilitaka kuwakusanya watoto wako kama vile kuku anavyowakusanya vifaranga wake chini ya mabawa yake,[b] lakini hamkutaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye huua ... na kupiga kwa mawe.” Kigiriki hutumia vishiriki vya wakati uliopo, vinavyomwonyesha Yerusalemu kwa matendo yake ya kawaida dhidi ya wajumbe wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ndege ... watoto wake.” Neno la Kigiriki ὄρνις linaweza kuwa na maana pana kuliko “kuku,” ingawa taswira ya mzazi anayekusanya makinda chini ya mabawa yake hufanya “kuku” iwe tafsiri ya asili hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Yerusalemu, Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili, na urudiaji umehifadhiwa ili kudumisha mkazo na sauti ya maombolezo.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: wewe unayewaua ... na kuwapiga kwa mawe
  rationale: Vishiriki vya wakati uliopo vinaitambulisha Yerusalemu kwa mwenendo wake wa kawaida. Muundo wa ‘wewe unaye-’ ni wa asili katika Kiswahili na huhifadhi maelezo hayo yaliyo hai.
- source_word: τοὺς προφήτας
  choice: manabii
  rationale: Hili ni neno la kawaida na linaloeleweka kwa προφήτας katika Kiswahili.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: wale waliotumwa kwako
  rationale: Huhifadhi hali ya kutendwa ya kishiriki cha Kigiriki na kuelekeza usemi kwa Yerusalemu kama nafsi ya pili.
- source_word: ποσάκις
  choice: Ni mara ngapi
  rationale: Ni usemi wa kawaida wa Kiswahili unaofaa katika swali la kimajazi lenye sauti ya huzuni.
- source_word: ἠθέλησα
  choice: nilitaka
  rationale: Huwasilisha kwa uwazi nia au tamaa ya msemaji bila kuongeza hitimisho la kitheolojia.
- source_word: ἐπισυνάξαι
  choice: kuwakusanya
  rationale: Kitenzi hiki kinatoa maana ya kuwaleta pamoja, huku kiambishi cha yambwa kikiwarejelea watoto kwa njia ya kawaida katika Kiswahili.
- source_word: τὰ τέκνα σου
  choice: watoto wako
  rationale: Huhifadhi taswira ya Yerusalemu kama mji-mama bila kufafanua zaidi watu wanaokusudiwa.
- source_word: ὃν τρόπον
  choice: kama vile
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoanzisha ulinganisho.
- source_word: ὄρνις
  choice: kuku
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha ndege kwa ujumla, taswira ya mzazi anayekusanya makinda chini ya mabawa inaeleweka kwa kawaida hapa kama kuku.
- source_word: τὴν ἑαυτῆς νοσσιὰν
  choice: vifaranga wake
  rationale: Katika Kiswahili, ‘vifaranga wake’ ni taswira ya asili na wazi ya makinda ya kuku, na hufikisha maana ya kundi la makinda katika muktadha huu.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: lakini hamkutaka
  rationale: ‘Lakini’ huonyesha vizuri tofauti kati ya nia ya msemaji na kukataa kwa kundi linaloelekezewa; wingi wa kitenzi umehifadhiwa.
theological_decisions:
- issue: Rejeleo la ‘watoto wako’
  choice: watoto wako
  alternative: wakazi wa Yerusalemu; watu wa Israeli wanaowakilishwa na mji
  rationale: Kigiriki kinazungumza na Yerusalemu kwa kuufanya mji kuwa kama mama na hakifafanui zaidi utambulisho wa watoto. Tafsiri inadumisha upana huo.
- issue: Tofauti ya nia katika ἠθέλησα / οὐκ ἠθελήσατε
  choice: nilitaka ... hamkutaka
  alternative: nilitamani ... hamkuwa tayari
  rationale: Maneno haya yanahifadhi lugha ya wazi ya kutaka na kukataa bila kuamua mjadala mpana kuhusu mapenzi ya Mungu na mwitikio wa binadamu.
- issue: Mabadiliko kutoka umoja wa Yerusalemu kwenda wingi wa wanaokataa
  choice: kwako ... hamkutaka
  alternative: kwako ... hukutaka
  rationale: Kigiriki hutumia umoja kumwelekea Yerusalemu katika sehemu ya kwanza, kisha wingi katika ἠθελήσατε. Kiswahili kimehifadhi badiliko hilo lenye umuhimu wa kimatini badala ya kulisawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki wa maombolezo yenye mkazo. Alama ya mshangao baada ya ‘kwako’ inasaidia kutenganisha mwito wa maombolezo na kauli inayofuata bila kupoteza mtiririko. Hakuna tanbihi iliyoongezwa kwa sababu ‘kuku’ na ‘vifaranga’ ni tafsiri ya asili katika muktadha, ingawa upana wa kimsamiati wa ὄρνις umeandikwa katika maamuzi ya kileksika.
