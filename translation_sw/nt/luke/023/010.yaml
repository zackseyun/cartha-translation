  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: sw
  text: Nao wakuu wa makuhani na waandishi walikuwa wamesimama pale, wakimshtaki kwa ukali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakimletea mashtaka kwa msisitizo mkubwa” / “wakimshtaki vikali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: walikuwa wamesimama pale
  rationale: 'Umbo hili linaeleza hali iliyokuwapo wakati huo: walikuwapo eneo hilo wakiwa wamesimama. Kiswahili hiki ni cha kawaida na kinahifadhi kazi ya kusawiri tukio.'
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si alama ya utofautishaji mkali. “Nao” linaunganisha wahusika hawa na tukio linaloendelea.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unawahusu wenye mamlaka ya juu miongoni mwa makuhani, bila kudokeza kwamba watu wengi walishikilia kwa wakati mmoja cheo cha kuhani mkuu.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Hili ni neno la moja kwa moja na lililozoeleka katika simulizi za Injili kwa wataalamu wa Maandiko na sheria, bila kupanua maana kupita kiasi.
- source_word: εὐτόνως
  choice: kwa ukali
  rationale: Kielezi hiki kinaonyesha nguvu na msisitizo mkubwa. Katika muktadha wa mashtaka yenye uhasama, “kwa ukali” ni Kiswahili cha asili na kinachoeleweka kwa urahisi.
- source_word: κατηγοροῦντες
  choice: wakimshtaki
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha tendo lililoendelea sambamba na kusimama kwao. “Kumshtaki” huhifadhi maana ya kisheria na ya kisimulizi.
- source_word: αὐτοῦ
  choice: -m- katika “wakimshtaki”
  rationale: Hali ya umilikishi baada ya κατηγορέω humaanisha mtu anayeshtakiwa; kiambishi cha Kiswahili “-m-” kinawasilisha maana hiyo kwa njia ya kawaida.
