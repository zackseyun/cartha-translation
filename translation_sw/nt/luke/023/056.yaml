  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: sw
  text: Kisha, baada ya kurudi[a], walitayarisha manukato na mafuta ya kunukia[b]. Siku ya Sabato walipumzika kulingana na amri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliporudi.” Kiambajina cha Kigiriki kinaonyesha kwamba walirudi kabla ya kutayarisha vitu hivyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “marhamu zenye harufu nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: waliporudi
  rationale: Kitenzi-jina cha Kigiriki kinaonyesha kwamba kurudi kulitokea kabla ya kutayarisha; “waliporudi” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ kinaendeleza simulizi kwa upole; “Kisha” kinaonyesha hatua inayofuata bila kutia mkazo usiokuwamo.
- source_word: ἡτοίμασαν
  choice: walitayarisha
  rationale: Ni tafsiri ya kawaida na ya asili ya tendo la kuandaa vitu kwa matumizi yaliyokusudiwa.
- source_word: ἀρώματα
  choice: manukato
  rationale: Katika muktadha wa maziko, neno hili humaanisha vitu vyenye harufu nzuri vilivyotumiwa kwa mwili; “manukato” ni neno linaloeleweka kwa urahisi.
- source_word: μύρα
  choice: mafuta ya kunukia
  rationale: Neno μύρον humaanisha mafuta au marhamu yenye harufu nzuri. “Mafuta ya kunukia” ni ya asili kwa Kiswahili na yanatofautisha kitu hiki na ἀρώματα.
- source_word: τὸ μὲν σάββατον
  choice: Siku ya Sabato
  rationale: Kirai hiki ni usemi wa wakati. “Siku ya Sabato” ni wazi na ya kawaida katika Kiswahili.
- source_word: ἡσύχασαν
  choice: walipumzika
  rationale: Katika muktadha wa Sabato, kitenzi hiki humaanisha kuacha shughuli na kupumzika.
- source_word: κατὰ τὴν ἐντολήν
  choice: kulingana na amri
  rationale: Tafsiri hii inadumisha umoja wa ἐντολήν na wazo la kutenda kwa kufuata amri hiyo bila kuongeza ufafanuzi katika matini kuu.
theological_decisions:
- issue: Amri inayorejelewa
  choice: kuacha matini iseme tu “amri”
  alternative: kupanua kuwa “amri ya Musa kuhusu Sabato”
  rationale: Muktadha unaelekeza kwa amri ya Torati kuhusu kuitunza Sabato, lakini matini yenyewe inasema tu “amri.” Tafsiri inadumisha usemi huo bila kuingiza ufafanuzi wa kitheolojia katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kwa msomaji wa kawaida, huku ikihifadhi mfuatano wa matendo, tofauti kati ya manukato na mafuta ya kunukia, na usemi mfupi “amri” wa matini ya Kigiriki.
