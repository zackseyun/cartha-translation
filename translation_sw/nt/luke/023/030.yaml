base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: sw
  text: Ndipo wataanza kusema kwa milima[a], “Tuangukieni,” na kwa vilima[b], “Tufunikeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yanarejelea lugha ya kinabii kuhusu hukumu, hasa Hosea 10:8.
    reason: cross_reference
  - marker: b
    text: Au, “Tuficheni.” Kitenzi hicho kihalisi humaanisha “funikeni,” lakini katika muktadha huu pia kina maana ya kufichwa dhidi ya hukumu inayokuja.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano wa wakati unaotokana na muktadha uliotangulia, kwa Kiswahili cha asili na kifupi.
- source_word: ἄρξονται λέγειν
  choice: wataanza kuiambia
  rationale: Huhifadhi maana ya kuanza kufanya jambo; umoja wa kisarufi katika “kuiambia milima” ni matumizi ya kawaida ya Kiswahili kwa kundi la vitu.
- source_word: τοῖς ὄρεσιν
  choice: milima
  rationale: Hutofautisha ὄρη, milima, na βουνοί, vilima, katika kishazi kinachofuata.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Tuangukieni
  rationale: Amri ya wingi pamoja na kiambishi cha mtendewa -tu- na kiishio cha mahali -ieni huwasilisha kwa ufupi maana ya ‘angukeni juu yetu.’
- source_word: τοῖς βουνοῖς
  choice: vilima
  rationale: βουνός kwa kawaida ni kilima; uchaguzi huu unadumisha tofauti na ὄρος.
- source_word: Καλύψατε ἡμᾶς
  choice: Tufunikeni
  rationale: Huhifadhi maana halisi ya ‘funikeni’ huku muktadha ukiruhusu pia wazo la kufichwa.
theological_decisions:
- issue: Lugha ya kinabii kuhusu hukumu
  choice: Kudumisha kilio halisi kinachoelekezwa kwa milima na vilima bila maelezo ya ziada katika matini kuu.
  alternative: Kutafsiri kwa ufafanuzi kuwa ni ombi la kufichwa dhidi ya hukumu inayokuja.
  rationale: Kauli hii inarejelea taswira ya kinabii, hasa Hosea 10:8; tafsiri hudumisha taswira thabiti na mvutano wake wa kitheolojia bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndipo” na maumbo ya amri “Tuangukieni” na “Tufunikeni” yanadumisha uzito wa kauli ya kinabii bila kuwa ya kizamani.
