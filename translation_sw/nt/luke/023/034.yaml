base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: sw
  text: Lakini Yesu alikuwa akisema[a], “Baba, wasamehe, kwa maana hawajui wanachofanya.” Nao wakagawana mavazi yake, wakipiga kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale hazina maneno haya: “Baba, wasamehe, kwa maana hawajui wanachofanya.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Kauli ya wakati uliopita usiotimilika inadokeza tendo lililokuwa likiendelea au lililorudiwa; tafsiri hii inahifadhi hali hiyo kuliko ‘alisema’.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni nomino ya mwito wa moja kwa moja; ‘Baba’ ni ya asili na haiongezi kiwakilishi cha umilikaji kisichokuwapo katika Kigiriki.
- source_word: ἄφες
  choice: wasamehe
  rationale: Katika sala kwa Mungu kuhusu wakosaji, maana inayofaa ya ἀφίημι ni kusamehe.
- source_word: αὐτοῖς
  choice: wa- (katika ‘wasamehe’)
  rationale: Kiwakilishi hiki hakibainishi kwa undani kundi linalorejelewa; kiambishi cha yambwa ‘wa-’ kinahifadhi kutobainishwa huko kwa Kiswahili cha kawaida.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: kwa maana hawajui wanachofanya
  rationale: ‘Hawajui’ hutafsiri moja kwa moja maana ya οἴδασιν bila kuongeza wazo la kutokuelewa.
- source_word: διαμεριζόμενοι
  choice: wakayagawana
  rationale: Muktadha unaonyesha kuwa mavazi yaligawanywa miongoni mwao; ‘gawana’ ni ya asili na sahihi katika Kiswahili.
- source_word: ἱμάτια
  choice: mavazi
  rationale: Neno hili hurejelea vitu vya kuvaliwa; ‘mavazi’ lina hadhi inayofaa simulizi na linaeleweka kwa urahisi.
- source_word: ἔβαλον κλήρους
  choice: kwa kupiga kura
  rationale: ‘Kupiga kura’ ni usemi wa kawaida wa Kiswahili kwa desturi ya kale ya kutumia kura kuamua mgawanyo.
- source_word: δὲ
  choice: Lakini / Kisha
  rationale: δὲ ya kwanza inaleta mpito wenye utofautishaji mdogo, na ya pili inaendeleza simulizi; Kiswahili cha asili kinahitaji uteuzi kulingana na muktadha.
theological_decisions:
- issue: Uasilia wa kauli ‘Baba, wasamehe, kwa maana hawajui wanachofanya’
  choice: Kauli imejumuishwa katika matini kuu
  alternative: Baadhi ya hati za kale zinaiacha kauli hiyo
  rationale: SBLGNT inaichapisha kauli katika matini huku ikiashiria tofauti ya kihati. Rasimu inaifuata matini iliyotolewa na kueleza tofauti hiyo muhimu katika tanbihi bila kuamua mvutano wa kimatini kwa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘alikuwa akisema’ umehifadhi hali endelevu ya kitenzi cha Kigiriki; ‘wakayagawana ... kwa kupiga kura’ ni mtiririko wa asili wa simulizi.
