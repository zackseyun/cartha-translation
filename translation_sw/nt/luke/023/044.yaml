  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: sw
  text: Ilikuwa tayari yapata saa sita[a], na giza likatanda juu ya nchi yote[b] mpaka saa tisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kuanzia yapata saa sita mchana hadi saa tisa alasiri.
    reason: cultural_note
  - marker: b
    text: Au, “dunia yote.” Neno la Kigiriki γῆ linaweza kumaanisha “nchi” au “dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: Hudumisha maana kwamba wakati huo ulikuwa tayari umefikiwa katika mtiririko wa simulizi.
- source_word: ὡσεὶ
  choice: yapata
  rationale: Huonyesha ukadiriaji wa wakati, si saa kamili; ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: ὥρα ἕκτη
  choice: saa sita
  rationale: Huhifadhi namna ya kutaja wakati iliyo katika matini ya chanzo; maelezo ya wakati wa kisasa yametolewa katika tanbihi.
- source_word: σκότος
  choice: giza
  rationale: Ni tafsiri ya kawaida, wazi, na ya moja kwa moja katika muktadha huu.
- source_word: ἐγένετο
  choice: likaja
  rationale: Huhifadhi nguvu ya kitendo cha γίνομαι na ni msemo wa asili kwa giza kutokea.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: juu ya nchi yote
  rationale: γῆ inaweza kumaanisha nchi au dunia. 'Nchi' haipanui bila lazima upeo wa tukio, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἕως ὥρας ἐνάτης
  choice: mpaka saa tisa
  rationale: Huhifadhi usemi wa wakati wa chanzo kwa ulinganifu na 'saa sita'; ufafanuzi wa saa za kisasa umo katika tanbihi.
theological_decisions:
- issue: Upeo wa γῆ katika taarifa kuhusu giza
  choice: nchi
  alternative: dunia
  rationale: Nomino ya Kigiriki inaweza kuwa na maana ya eneo la nchi au dunia nzima. Matini kuu inatumia maana iliyozuiliwa zaidi kimuktadha, na tanbihi inahifadhi uwezekano mpana ili kutosuluhisha mvutano wa kitheolojia kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa saa katika matini kuu umehifadhiwa kwa kuwa 'saa sita' na 'saa tisa' tayari hueleweka kiasili katika mfumo wa saa wa Kiswahili; tanbihi inaondoa utata kwa kutaja mchana na alasiri.
