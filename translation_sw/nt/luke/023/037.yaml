id: LUK.23.37
reference: Luke 23:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: sw
  text: na wakisema, “Ikiwa wewe ndiye Mfalme wa Wayahudi[a], jiokoe mwenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mfalme wa Wayudea.” Neno la Kigiriki Ἰουδαίων linaweza kumaanisha Wayahudi au Wayudea, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: wakisema
  rationale: Kirai cha Kiswahili kinaendeleza tendo la wahusika wa mstari uliotangulia kwa njia ya kawaida; ‘wakisema’ huhifadhi maana ya participio bila kuongeza moja kwa moja dhihaka ambayo inatokana na muktadha.
- source_word: Εἰ σὺ εἶ
  choice: Ikiwa wewe ndiye
  rationale: ‘Ikiwa’ huhifadhi changamoto ya masharti, na ‘wewe ndiye’ huonyesha msisitizo wa kiwakilishi cha Kigiriki kwa Kiswahili cha kawaida.
- source_word: ὁ βασιλεὺς
  choice: Mfalme
  rationale: Hiki ni cheo mahususi cha kifalme; herufi kubwa inasaidia kukitambua kama cheo kinachotumiwa kumhusu Yesu katika simulizi.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Katika simulizi la mateso, hili ndilo jina la kisiasa na la Kimasihi linalotumiwa katika shtaka na dhihaka. ‘Wayahudi’ ni tafsiri ya kawaida, huku maana ya ‘Wayudea’ ikihifadhiwa katika tanbihi.
- source_word: σῶσον σεαυτόν
  choice: jiokoe mwenyewe
  rationale: ‘Jiokoe’ hutoa amri ya nafsi-rejeshi kwa kawaida, na ‘mwenyewe’ huhifadhi msisitizo wa σεαυτόν pamoja na changamoto ya wasemaji.
theological_decisions:
- issue: Tafsiri ya cheo βασιλεὺς τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  alternative: mfalme wa Wayudea
  rationale: ‘Mfalme wa Wayahudi’ hudumisha cheo chenye uzito wa kisiasa na wa Kimasihi katika muktadha wa kusulubiwa. ‘Wayudea’ ni uwezekano halisi wa kijiografia au kikabila wa Ἰουδαίων, kwa hiyo umeonyeshwa katika tanbihi bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Ikiwa wewe ndiye’ ni wa kawaida na huonyesha msisitizo wa kauli ya dhihaka bila kuongeza neno ‘dhihaka’ kwenye kitenzi.
