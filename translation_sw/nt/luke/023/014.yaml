id: LUK.23.14
reference: Luke 23:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: sw
  text: Akawaambia, “Mlimleta mtu huyu kwangu mkisema kwamba alikuwa akiwapotosha watu. Na tazameni, baada ya kumhoji mbele yenu, sikupata kwa mtu huyu kosa lolote katika mambo mnayomshtaki.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikupata kwa mtu huyu msingi wowote wa yale mnayomshtaki.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Mlimleta ... kwangu
  rationale: Inaonyesha tendo lililokamilika la viongozi kumleta Yesu kwa Pilato, kwa Kiswahili cha kawaida na chenye mazingira ya kisheria.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: mtu huyu
  rationale: Humrejelea mwanaume huyu mahususi bila kuongeza maana isiyokuwamo katika neno la Kigiriki.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: mkisema kwamba alikuwa akiwapotosha watu
  rationale: Muundo huu unaonyesha kuwa huo ulikuwa wasilisho au dai lao. ‘Kuwapotosha’ huhifadhi maana ya kuwaongoza watu katika njia isiyofaa bila kuimarisha dai kuwa uchochezi.
- source_word: τὸν λαόν
  choice: watu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa kundi la watu kwa ujumla katika muktadha huu.
- source_word: ἰδοὺ
  choice: tazameni
  rationale: Ni kiashiria cha hotuba kinachovuta usikivu wa wasikilizaji; ‘tazameni’ huhifadhi nguvu hiyo kwa sajili yenye heshima.
- source_word: ἐνώπιον ὑμῶν
  choice: mbele yenu
  rationale: Husisitiza kwamba uchunguzi wa Pilato ulifanyika wazi wakiwa pale.
- source_word: ἀνακρίνας
  choice: baada ya kumhoji
  rationale: Katika muktadha wa mahakama, kitenzi hiki huonyesha uchunguzi kwa kuuliza maswali. ‘Kumhoji’ ni cha asili na huhifadhi maana ya kiuchunguzi.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: sijaona ... msingi wowote
  rationale: Hutoa kauli ya matokeo ya uchunguzi kwa Kiswahili asilia huku ikiandaa maana ya kisheria ya αἴτιον.
- source_word: αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: msingi wowote wa mashtaka mnayomleta dhidi yake
  rationale: 'Huhifadhi mazingira ya kisheria: Pilato anatangaza kwamba madai yaliyotolewa hayana msingi uliothibitishwa, si kutoa tamko pana kuhusu hali yote ya kimaadili ya Yesu.'
theological_decisions:
- issue: Asili ya tamko la Pilato
  choice: Kauli ya kisheria kwamba hakuna msingi wa mashtaka yao uliopatikana
  alternative: Sijaona hatia yoyote kwa mtu huyu
  rationale: Msamiati wa mstari ni wa uchunguzi na mashitaka ya kisheria. Tafsiri iliyochaguliwa haipanui tamko kuwa hukumu kamili ya kimaadili iliyo nje ya mashtaka yaliyowasilishwa.
- issue: Maana ya ἀποστρέφοντα
  choice: akiwapotosha watu
  alternative: akiwageuza watu waache njia yao
  rationale: Kitenzi kinaweza kumaanisha kugeuza au kupotosha. Katika shtaka hili, ‘kuwapotosha’ ni cha asili, lakini maana mbadala ya kugeuza haipaswi kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mahakama umehifadhiwa. Kiashiria [a] kimewekwa baada ya kauli inayohusika.
