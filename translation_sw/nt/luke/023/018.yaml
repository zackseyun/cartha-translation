  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: sw
  text: Lakini wote wakapiga kelele kwa pamoja wakisema, “Mwondoe huyu[a], na umwachilie Baraba kwa ajili yetu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mbali na huyu!” Amri ya Kigiriki inaweza kutafsiriwa kwa ufupi zaidi, lakini maana yake ni kwamba wanadai aondolewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: wakapiga kelele
  rationale: Kitenzi hiki kinaonyesha kilio au kelele kubwa; usemi huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya mwito wao.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa kiunganishi kinaonyesha tofauti na hatua iliyotangulia katika simulizi.
- source_word: παμπληθεὶ
  choice: wote ... kwa pamoja
  rationale: Huwasilisha tendo la umati mzima kwa ushirika bila kuongeza wazo la umoja kamili wa nia kuliko maandishi yanavyosema.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha moja kwa moja maneno yaliyokuwa ndani ya kelele zao.
- source_word: Αἶρε
  choice: Mwondoe
  rationale: Amri ya αἴρω katika muktadha huu inadai Yesu aondolewe; tafsiri hii ni fupi, ya asili, na haielezi wazi namna ya kuondolewa ambayo neno lenyewe halitaji.
- source_word: τοῦτον
  choice: huyu
  rationale: Kiwakilishi cha kuonyesha kinahifadhi rejeo la moja kwa moja, na huenda la dharau, kwa Yesu.
- source_word: ἀπόλυσον
  choice: utufungulie
  rationale: Katika muktadha wa mfungwa, kufungulia ni Kiswahili cha kawaida kwa kumwachilia mtu kutoka kifungoni; umbo lenye -tu- linaonyesha wanufaika wa tendo hilo.
- source_word: ἡμῖν
  choice: -tu- katika “utufungulie”
  rationale: Yambwa ya kunufaika imewasilishwa kiasili ndani ya kitenzi cha Kiswahili.
- source_word: τὸν Βαραββᾶν
  choice: Baraba
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Nguvu ya amri Αἶρε
  choice: Mwondoe huyu
  alternative: Mbali na huyu
  rationale: Tafsiri kuu inahifadhi amri ya kumwondoa bila kutaja wazi kuuawa, huku tanbihi ikionyesha usemi mfupi unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye hadhi. “Wakapiga kelele” hudumisha nguvu ya kilio cha umati, na “utufungulie” ni usemi wa kawaida katika muktadha wa kumwachilia mfungwa.
