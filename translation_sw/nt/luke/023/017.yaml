  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: sw
  text: Ilimbidi awaachilie mtu mmoja wakati wa sikukuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu wote haupatikani katika hati kadhaa za kale zaidi za Kigiriki (zikiwemo Papirasi 75 ya karne ya tatu na Vaticanus ya karne ya nne), wala katika tafsiri za kale za Kikopti. Unapatikana katika hati nyingine muhimu za kale (kama Sinaiticus ya karne ya nne), katika mapokeo ya Kilatini, na katika hati nyingi za baadaye za Kizantini. Huenda waandishi waliuongeza ili kuoanisha simulizi la Luka na desturi ya kumwachilia mfungwa inayotajwa katika Mathayo 27:15 na Marko 15:6. Baadhi ya hati huweka sentensi hii baada ya mstari wa 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: Ilimbidi
  rationale: Nahau hii inaonyesha ulazima au wajibu uliomkabili. “Ilimbidi” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kudai wazi ikiwa ulazima huo ulikuwa wa kisheria au wa kimila.
- source_word: ἀπολύειν
  choice: kumwachilia
  rationale: Katika muktadha wa kisheria na wa kifungo, kitenzi hiki humaanisha kumtoa mtu chini ya ulinzi au kifungo.
- source_word: αὐτοῖς
  choice: kwa ajili yao
  rationale: Huhifadhi maana ya kwamba kuachiliwa huko kulifanywa kwa manufaa au kwa ombi la watu, bila kuifanya kiwakilishi hiki kuwa yule mtu aliyeachiliwa.
- source_word: κατὰ ἑορτήν
  choice: wakati wa sikukuu
  rationale: Kirai hiki kinaonyesha desturi iliyofuatwa katika kila tukio la sikukuu; “wakati wa sikukuu” ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: ἕνα
  choice: mtu mmoja
  rationale: Ingawa Kigiriki kinasema kihalisi “mmoja,” muktadha wa kumwachilia mfungwa unaruhusu kuongeza “mtu” kwa uwazi wa kawaida bila kuainisha jinsia isivyohitajika.
