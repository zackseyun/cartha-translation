  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: sw
  text: Wanawake waliokuwa wamekuja naye kutoka Galilaya wakafuata, wakaona kaburi na jinsi mwili wake ulivyowekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandamana naye kutoka Galilaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: wakafuata
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaendelezwa kwa kitenzi cha masimulizi chenye kiambishi -ka-, ambacho kwa kawaida huonyesha tendo linalofuata katika Kiswahili.
- source_word: δέ
  choice: hakikutafsiriwa kwa neno la pekee
  rationale: δέ hapa ni kiunganishi hafifu cha masimulizi; mtiririko wa Kiswahili na matumizi ya -ka- yanatosha bila kuongeza ‘basi’ au ‘na’.
- source_word: αἱ γυναῖκες
  choice: Wanawake
  rationale: Muktadha tayari unatambulisha kundi hili; Kiswahili hakihitaji kibainishi kinacholingana na ‘the’.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: waliokuwa wamekuja pamoja naye kutoka Galilaya
  rationale: Muundo huu unaonyesha tendo lililotangulia na unahifadhi asili yao, Galilaya, pamoja na wazo la kuja wakiwa pamoja naye.
- source_word: ἐθεάσαντο
  choice: wakaona
  rationale: ‘Wakaona’ ni ya kawaida na inaendeleza mfuatano wa masimulizi; kishazi kinachofuata kinaonyesha kwa wazi walichokiangalia.
- source_word: τὸ μνημεῖον
  choice: kaburi
  rationale: ‘Kaburi’ ni neno la kawaida na sahihi katika muktadha wa maziko.
- source_word: ὡς ἐτέθη
  choice: jinsi ... ulivyolazwa humo
  rationale: ‘Jinsi’ huhifadhi maana ya namna, na ‘ulivyolazwa’ ni usemi wa heshima unaofaa kwa kuwekwa kwa mwili kaburini; ‘humo’ huweka wazi mahali panaporejelewa bila kubadili maana.
- source_word: τὸ σῶμα αὐτοῦ
  choice: mwili wake
  rationale: Huu ni usemi wa kawaida na wazi wa umilikaji katika Kiswahili.
theological_decisions:
- issue: Mfuatano wa κατακολουθήσασαι na ἐθεάσαντο
  choice: wakafuata, wakaona
  alternative: baada ya kufuata ... wakaona
  rationale: Uratibu kwa vitenzi vya -ka- ni wa asili katika masimulizi ya Kiswahili na huhifadhi mfuatano wa matendo bila kulazimisha uhusiano wa ziada wa kimantiki.
- issue: Maana ya συνεληλυθυῖαι ... αὐτῷ
  choice: wamekuja pamoja naye
  alternative: walioandamana naye
  rationale: Chaguo kuu huhifadhi kwa karibu wazo la kuja pamoja naye; mbadala unawezekana lakini unaweza kusisitiza zaidi tendo la kuandamana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa simulizi la maziko. Alama ya tanbihi [a] imewekwa katika maandishi makuu.
