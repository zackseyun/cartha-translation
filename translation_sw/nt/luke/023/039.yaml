  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: sw
  text: Mmoja wa wale wahalifu waliokuwa wametundikwa alikuwa akimtukana, akisema, “Je, wewe si ndiye Masihi[a]? Jiokoe mwenyewe, na utuokoe sisi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kristo.” Kigiriki: ho christos.'
    reason: Tafsiri mbadala ya cheo cha Kigiriki Χριστός.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Mmoja
  rationale: δέ ni kiunganishi hafifu cha kuendeleza au kutofautisha simulizi; muktadha wa Kiswahili haudai kielezi cha ziada kama ‘basi’.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: wa wale wahalifu waliokuwa wametundikwa
  rationale: ‘Wahalifu’ ni tafsiri ya kawaida ya κακούργων, na ‘waliokuwa wametundikwa’ huhifadhi maana ya κρεμασθέντων bila kuongeza kitenzi mahususi zaidi kuliko kilicho katika Kigiriki.
- source_word: ἐβλασφήμει αὐτόν
  choice: alikuwa akimtukana
  rationale: Katika muktadha huu kitenzi kinamaanisha kumsema Yesu kwa dharau; muundo ‘alikuwa akimtukana’ pia huonyesha tendo linaloendelea la wakati usiotimilika.
- source_word: λέγων
  choice: akisema
  rationale: Ni utangulizi wa kawaida na wa asili wa maneno ya moja kwa moja katika simulizi la Kiswahili.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός
  choice: Je, wewe si ndiye Masihi[a]?
  rationale: Swali huhifadhi matarajio ya jibu la kukubali pamoja na sauti ya kejeli; ‘ndiye’ husisitiza kiwakilishi σὺ, na ‘Masihi’ huonyesha kuwa Χριστός ni cheo.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Jiokoe mwenyewe, na utuokoe sisi pia
  rationale: Huhifadhi amri, kujirejelea kwa σεαυτόν, na msisitizo wa ombi lenye maslahi binafsi kwa kujumuisha ‘sisi pia’.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός ni cheo kinachorejelea mfalme mteule wa Mungu, si jina tu; ‘Masihi’ huhifadhi maana hiyo na mazingira yake ya Kiyahudi bila kufuta uwezekano wa tafsiri ya jadi ‘Kristo’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘alikuwa akimtukana’ unaeleweka kwa wasomaji wa kawaida na huhifadhi hali ya tendo linaloendelea; swali la kejeli limeachwa wazi bila kulifafanua zaidi.
