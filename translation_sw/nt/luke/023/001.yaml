base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: sw
  text: Kisha, umati wao wote waliinuka, wakampeleka Yesu kwa Pilato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kusanyiko lao lote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa simulizi; “Kisha” ni cha kawaida katika Kiswahili na kinaonyesha tukio linalofuata bila kuongeza ufasiri mzito.
- source_word: ἀναστὰν
  choice: likainuka
  rationale: Kitenzi hiki cha wakati uliopita kinaeleza tendo lililotangulia tendo kuu. Muundo “likainuka, wakampeleka” ni wa asili katika Kiswahili na huhifadhi mfuatano wa matendo.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: kusanyiko lao lote
  rationale: πλῆθος humaanisha kundi kubwa au mkusanyiko. Katika mazingira haya ya shauri, “kusanyiko” linaonyesha kundi lililokusanyika bila kulifanya rasmi zaidi ya Kigiriki; ἅπαν na αὐτῶν zimewakilishwa na “lote” na “lao.”
- source_word: ἤγαγον
  choice: wakampeleka
  rationale: ἄγω inaweza kumaanisha kuongoza au kupeleka. “Wakampeleka” ni ya kawaida kwa kumpeleka mtu aliye chini ya ulinzi hadi kwa mwenye mamlaka.
- source_word: αὐτὸν
  choice: Yesu
  rationale: Ingawa Kigiriki kina kiwakilishi “yeye,” kutaja “Yesu” huzuia utata unaoweza kusababishwa na viambishi vya ngeli tofauti katika sentensi ya Kiswahili, bila kubadili rejeleo.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: kwa Pilato
  rationale: ἐπί pamoja na hali ya accusative baada ya kitenzi cha mwendo huonyesha kuelekea kwa mtu. “Kwa Pilato” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri mhusika wa pamoja katika mazingira ya shauri
  choice: kusanyiko lao lote
  alternative: umati wao wote
  rationale: “Kusanyiko” linafaa kwa kundi lililokuwa limekusanyika katika shauri, lakini halidai wazi kwamba lilikuwa taasisi rasmi. “Umati” pia unawezekana, kwa kuwa πλῆθος inaweza kumaanisha kundi kubwa la watu; tofauti hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo wa vitenzi mfululizo umechaguliwa ili kuonyesha kwamba kundi lilisimama kwanza, kisha likampeleka Yesu kwa Pilato.
