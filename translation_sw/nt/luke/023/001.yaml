review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence, collective scope, destination, and identification of Pilate. However, the singular collective subject “kusanyiko lao lote” followed by plural “wakampeleka” is less well aligned grammatically in Swahili with the Greek’s collective noun and plural finite verb.
  naturalness: “Kisha, umati wao wote waliinuka, wakampeleka Yesu kwa Pilato” is idiomatic Standard East African Swahili and makes the plural action of leading Jesus clear.
  terminology: “Umati” is the most direct ordinary equivalent for πλῆθος here. “Kusanyiko” remains a legitimate contextual alternative and is retained in the footnote without over-specifying a formal judicial institution.
  issues:
  - severity: low
    issue: Collective-subject agreement is awkward in the draft.
    rationale: “Kusanyiko lao lote likainuka, wakampeleka” shifts from a singular noun-class verb to a plural human subject without an explicit noun. Greek itself has a collective noun with a plural verb, but Swahili is clearer with the human-plural rendering “umati ... waliinuka, wakampeleka.”
  - severity: low
    issue: The primary term “kusanyiko” is somewhat narrower than πλῆθος.
    rationale: πλῆθος primarily denotes a multitude or large group. “Umati” represents this directly; “kusanyiko” is suitably preserved as an alternative.
  revised_text: Kisha, umati wao wote waliinuka, wakampeleka Yesu kwa Pilato.[a]
  revised_footnotes:
