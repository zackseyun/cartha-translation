revisions:
- from: Kisha kusanyiko lao lote likainuka, wakampeleka Yesu kwa Pilato.[a]
  to: Kisha, umati wao wote waliinuka, wakampeleka Yesu kwa Pilato.[a]
  rationale: The revision uses “umati” for the collective πλῆθος and plural verbs for the people comprising that group, producing clear and natural Swahili while retaining the source’s sequence and collective force. “Yesu” appropriately clarifies the pronoun’s referent in Swahili narrative.
  reviewer_model: gpt-5.6-terra
