  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: sw
  text: Mtu huyu akaenda kwa Pilato na kumwomba mwili wa Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Mtu huyu
  rationale: Kiwakilishi hiki cha kuonyesha kinamrejelea Yosefu wa Arimathaya aliyetajwa katika mstari uliotangulia. “Mtu huyu” kinahifadhi nguvu hiyo ya urejeleo kwa Kiswahili cha kawaida.
- source_word: προσελθὼν
  choice: akaenda kwa
  rationale: Kitenzi hiki katika hali ya participle ya aoristi kinaonyesha tendo linalotangulia ombi. Muundo wa masimulizi “akaenda kwa” ni wa asili na unaonyesha mfuatano wa matendo bila uzito usio wa lazima.
- source_word: τῷ Πιλάτῳ
  choice: kwa Pilato
  rationale: Dativi humtaja mtu aliyefikiwa. “Kwa Pilato” ni usemi wa kawaida wa Kiswahili; hakuna sababu ya kuongeza jina “Pontio,” ambalo halimo katika mstari huu.
- source_word: ᾐτήσατο
  choice: kumwomba
  rationale: Katika muktadha huu αἰτέω ya kati ina maana ya kuomba apewe kitu. “Kumwomba” humtaja kwa kawaida mtu aliyeombwa, huku kitu kilichoombwa kikifuata kama yambwa.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: σῶμα ni “mwili.” Ingawa ni mwili wa mtu aliyekufa, tafsiri “maiti” ingeweka wazi zaidi jambo ambalo neno la Kigiriki lenyewe halisemwi kwa ukali huo.
- source_word: τοῦ Ἰησοῦ
  choice: wa Yesu
  rationale: Genitivi inaonyesha uhusiano au umilikaji kwa njia ya moja kwa moja. “Mwili wa Yesu” ni Kiswahili sahihi na cha asili.
