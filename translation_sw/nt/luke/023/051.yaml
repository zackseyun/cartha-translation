  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: sw
  text: Mtu huyu hakuwa amekubaliana na shauri lao wala kitendo chao[a]—alitoka Arimathaya, mji wa Wayahudi, naye alikuwa akiungojea ufalme wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa ameidhinisha uamuzi wao wala tendo lao.”
    reason: Njia nyingine halali ya kutafsiri συγκατατεθειμένος, βουλῇ, na πράξει kwa lugha rasmi zaidi.
lexical_decisions:
- source_word: οὗτος
  choice: Mtu huyu
  rationale: Kiashiria hiki kinamrejelea Yusufu kwa msisitizo; “Mtu huyu” ni wazi na cha kawaida katika Kiswahili.
- source_word: συγκατατεθειμένος
  choice: hakuwa amekubaliana
  rationale: Muundo huu unaonyesha msimamo uliokuwapo tayari wa kutokubaliana au kutotoa kibali; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
- source_word: βουλῇ
  choice: mpango
  rationale: Katika muktadha huu neno hilo linaelekea kumaanisha azimio au mpango wao, si baraza lenyewe kama taasisi.
- source_word: πράξει
  choice: kitendo
  rationale: Neno hili linarejelea jambo walilolitenda, na hivyo linatofautisha utekelezaji na mpango wao.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: alitoka Arimathea, mji wa Wayahudi
  rationale: Tafsiri hii inafuata muundo wa ufafanuzi wa Kigiriki na haibadili “wa Wayahudi” kuwa maelezo mahususi zaidi ya kikabila au kijiografia.
- source_word: προσεδέχετο
  choice: alikuwa akiungojea
  rationale: Muundo huu unaonyesha hali endelevu ya kungoja kwa matarajio, kama ilivyo katika kitenzi cha wakati usiotimilika.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi wa kawaida, wazi, na wenye uzito unaolingana na matumizi ya Luka.
theological_decisions:
- issue: Jinsi Yusufu alivyojitenga na jukumu la baraza katika kifo cha Yesu
  choice: Kusema kwamba hakukubaliana na mpango wao wala kitendo chao
  alternative: Kusema kwamba hakupiga kura kuunga mkono uamuzi wao
  rationale: Kigiriki kinaeleza kutokubaliana kwake na mpango pamoja na kitendo chao, lakini hakitaji wazi utaratibu wa kupiga kura; kwa hiyo tafsiri haiongezi dhana hiyo ya kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wala” huonyesha kwa kawaida kwamba kutokubaliana kulihusu mpango wao na kitendo chao. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja na tofauti hiyo ya kileksika.
