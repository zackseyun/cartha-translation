  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: sw
  text: Ilikuwa siku ya Maandalizi, na Sabato ilikuwa inaanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “Sabato ilikuwa ikipambazuka.” Kitenzi cha Kigiriki kinaweza kumaanisha “kupambazuka” au “kuanza”; hapa kinarejelea kuanza kwa Sabato jioni.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: Maandalizi
  rationale: Katika matumizi ya Kiyahudi ya Kigiriki, neno hili hutaja siku ya kujiandaa kabla ya Sabato. Herufi kubwa inalihifadhi kama jina la siku maalumu bila kulibadili moja kwa moja kuwa “Ijumaa.”
- source_word: σάββατον
  choice: Sabato
  rationale: Muktadha unaonyesha kwamba ni Sabato ya kila juma. Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza.
- source_word: ἐπέφωσκεν
  choice: ilikuwa inaanza
  rationale: Ingawa kitenzi hiki kwa maana ya moja kwa moja kinaweza kuhusishwa na kupambazuka, hapa kinaeleza kuanza kwa Sabato jioni. Tafsiri hii inaepusha wazo lisilo sahihi kwamba ilikuwa asubuhi, huku maana ya moja kwa moja ikihifadhiwa katika tanbihi.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Ilikuwa siku ya Maandalizi
  rationale: Muundo huu ni wa kawaida na wenye heshima katika Kiswahili, nao unahifadhi maana ya siku iliyotengwa kwa maandalizi.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kimehifadhiwa ili kuonyesha uratibu rahisi wa masimulizi ya Luka.
theological_decisions:
- issue: Maana ya ἐπέφωσκεν kuhusu kuanza kwa Sabato
  choice: Sabato ilikuwa inaanza jioni
  alternative: Sabato ilikuwa ikipambazuka
  rationale: Kwa hesabu ya siku ya Kiyahudi, Sabato huanza jioni. “Ilikuwa inaanza” huhifadhi rejeo hilo la wakati bila kuficha kwamba kitenzi cha Kigiriki kina taswira ya kupambazuka; taswira hiyo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Siku ya Maandalizi” ni wazi kwa msomaji wa kawaida na huhifadhi istilahi ya kalenda ya Kiyahudi; “ilikuwa inaanza” ni ya kawaida na haidokezi kimakosa kuwa tukio lilitokea asubuhi.
