  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: sw
  text: Yule jemadari alipoona yaliyotukia, alimtukuza Mungu akisema, “Hakika, mtu huyu alikuwa mwenye haki.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakuwa na hatia” au “alikuwa mwadilifu.” Neno la Kigiriki linaweza kumaanisha kuwa mwenye haki kimaadili au kutokuwa na hatia kisheria katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: alipoona
  rationale: Kauli ya wakati inawasilisha kitenzi-shirikishi cha aoristi kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: δὲ
  choice: (haijatafsiriwa moja kwa moja)
  rationale: Kiunganishi hiki chepesi kinaendeleza simulizi; Kiswahili hakihitaji kiunganishi cha ziada hapa.
- source_word: ὁ ἑκατοντάρχης
  choice: yule jemadari
  rationale: “Jemadari” ni neno la kawaida la Kiswahili kwa mkuu wa askari mia; “yule” linaonyesha mhusika maalumu anayetajwa katika muktadha.
- source_word: τὸ γενόμενον
  choice: yaliyotukia
  rationale: Hurejelea mambo yaliyokuwa yametokea na kushuhudiwa; wingi wa kimuktadha ni wa kawaida katika Kiswahili.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: alimtukuza Mungu
  rationale: Huhifadhi maana thabiti ya kumpa Mungu utukufu; wakati uliopita rahisi ni wa asili katika simulizi la Kiswahili bila kulazimisha kipengele cha mwendelezo.
- source_word: λέγων
  choice: akisema
  rationale: Muundo wa mfululizo wa vitenzi unahifadhi uhusiano wa kitenzi-shirikishi na kutambulisha maneno yaliyosemwa kwa ufasaha.
- source_word: Ὄντως
  choice: Hakika
  rationale: Huonyesha uthibitisho wenye mkazo kwa lugha ya sasa na yenye heshima.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: mtu huyu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayomrejelea Yesu kama mtu huyu.
- source_word: δίκαιος
  choice: mwenye haki
  rationale: Huhifadhi maana ya kimaadili na kiteolojia ya neno la Kigiriki, huku uwezekano wa maana ya kutokuwa na hatia ukielezwa katika tanbihi.
- source_word: ἦν
  choice: alikuwa
  rationale: Ni wakati uliopita unaofaa katika simulizi.
theological_decisions:
- issue: Maana ya δίκαιος katika kauli ya jemadari
  choice: mwenye haki
  alternative: asiye na hatia; mwadilifu
  rationale: “Mwenye haki” huhifadhi uzito wa kimaadili na kiteolojia bila kuingiza ungamo pana zaidi lisilosemwa na mstari. Kwa kuwa muktadha wa hukumu unaweza pia kuonyesha kutokuwa na hatia, maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili katika simulizi, na utata halisi wa δίκαιος umehifadhiwa kwa tanbihi.
