base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: sw
  text: Kwa maana, ikiwa wanatenda mambo haya kwa mti mbichi[a][b], itakuwaje kwa mti mkavu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuni mbichi … kwa kuni kavu.” Neno la Kigiriki linaweza kumaanisha mti, kuni, au mbao.
    reason: lexical_alternative
  - marker: b
    text: 'Picha hii huenda inatoa hoja kutoka jambo dogo kwenda jambo kubwa zaidi: ikiwa mambo kama haya yanafanywa kwa kilicho “mbichi,” itakuwaje kwa kilicho “kavu”?'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu, neno hili linaanzisha sababu ya onyo na maombolezo yaliyotangulia, huku likihifadhi nguvu yake ya kisababishi.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: kwa mti mbichi
  rationale: Kauli hii inadumisha picha ya kimethali ya ξύλον kilicho na unyevunyevu au uhai. Kiswahili cha ‘mti mbichi’ ni kifupi na cha kueleweka, na hakilazimishi kuwa maana ni kuni, mbao, au mti ulio hai.
- source_word: ὑγρῷ
  choice: mbichi
  rationale: Neno la Kigiriki linaweza kumaanisha yenye unyevunyevu au yenye majimaji. Katika ulinganisho na ξηρός, ‘mbichi’ huwasilisha kwa kawaida tofauti kati ya kitu ambacho hakijakauka na kilicho kavu.
- source_word: ξύλῳ
  choice: mti
  rationale: ξύλον linaweza kumaanisha mti, kuni, au mbao. ‘Mti’ huhifadhi picha bila kuifunga kabisa kwa dhana ya kuni zinazochomwa, huku tanbihi ikionyesha uwezekano mwingine wa kileksia.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Wingi wa kiwakilishi cha Kigiriki umehifadhiwa, na rejeo lake pana kwa matendo yanayotendeka halijabanwa kwa ufafanuzi maalumu.
- source_word: ποιοῦσιν
  choice: wanatenda
  rationale: Kitenzi cha wakati wa sasa kimetafsiriwa kwa hali ya sasa. Kiima kisichotajwa wazi katika Kigiriki kimewasilishwa kwa ‘wana-’ bila kuwatambulisha wahusika kwa namna ya kiufafanuzi.
- source_word: ἐν τῷ ξηρῷ
  choice: kwa mti mkavu
  rationale: Kirai hiki kinarudia upande wa pili wa picha kwa uwazi na kudumisha ulinganifu wa mti mbichi na mti mkavu.
- source_word: τί γένηται
  choice: itakuwaje
  rationale: Swali hili la balagha linaeleza matokeo yanayotarajiwa kwa Kiswahili cha kawaida, bila kubadili nguvu ya hali tegemezi ya Kigiriki kuwa maelezo ya moja kwa moja.
theological_decisions:
- issue: Picha ya mti mbichi na mti mkavu
  choice: Picha imehifadhiwa bila kuwataja wahusika wanaowakilishwa na kila mti.
  alternative: Kumtambua Yesu waziwazi kuwa mti mbichi na Yerusalemu au watu wake kuwa mti mkavu; au kuieleza moja kwa moja kuwa hoja ya kutoka jambo dogo kwenda kubwa.
  rationale: Kauli hiyo ya kimethali huenda inaelekeza kutoka mateso ya Yesu yasiyo ya haki kwenda kwenye hukumu kubwa inayokuja, lakini warejelewa wake kamili hawajasemwa wazi. Tafsiri inadumisha mvutano huo wa kitheolojia badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanatenda’ lina uzito unaofaa kwa muktadha bila kuwa la kizamani, na ‘itakuwaje’ ni swali la kawaida na lenye nguvu. Mpangilio wa maneno umehifadhi ulinganifu wa kimethali wa Kigiriki.
