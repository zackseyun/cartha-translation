id: LUK.23.8
reference: Luke 23:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: sw
  text: Herode alipomwona Yesu, alifurahi sana, kwa maana kwa muda mrefu alikuwa akitaka kumwona kwa sababu alikuwa akisikia habari kumhusu, naye alitumaini kuona ishara fulani ikitendwa na Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “muujiza fulani.” Kigiriki kinasema “ishara” (σημεῖον), neno linaloweza kumaanisha tendo la kimiujiza linaloonekana kuwa ishara yenye maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: alifurahi sana
  rationale: Huwasilisha kitenzi cha kufurahi pamoja na msisitizo wa λίαν kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: kwa muda mrefu
  rationale: Ni usemi wa muda ulioendelea; tafsiri hii haisemi kwa usahihi usiokuwamo kwamba ilikuwa miaka mingi.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: alikuwa ametaka kumwona
  rationale: Muundo huu unaonyesha kwamba tamaa hiyo ilikuwa imekuwapo kwa kipindi kilichotangulia tukio la kumwona Yesu.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: kwa sababu alikuwa akisikia habari zake
  rationale: Muundo wa kisababishi umetafsiriwa wazi, huku hali endelevu ya infinitivu ya wakati uliopo ikidokeza taarifa zilizokuwa zikimfikia mara kwa mara.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: alitumaini kumwona akifanya ishara fulani
  rationale: ‘Alitumaini’ huhifadhi maana ya kutarajia kwa hamu, na ‘ishara’ huhifadhi upana wa σημεῖον badala ya kuifupisha moja kwa moja kuwa muujiza.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: akifanya
  rationale: Katika Kiswahili, ujenzi tendaji wenye mhusika yuleyule ni wa asili zaidi kuliko ‘ikifanywa naye’ na bado unaonyesha kwamba Herode alitarajia Yesu ndiye angefanya ishara.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: Herode alipomwona Yesu
  rationale: Hufanya uhusiano wa wakati wa participio ya aoristi kuwa wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya σημεῖον
  choice: ishara
  alternative: muujiza
  rationale: Neno la Kigiriki linaweza kumaanisha tendo la kimiujiza linalotazamwa kama ishara yenye maana. ‘Ishara’ huhifadhi istilahi na mvutano huo bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili; ‘habari zake’ humaanisha taarifa kuhusu Yesu, na ‘akifanya ishara’ huepuka ujenzi wa kipasivu usio wa asili.
