  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: sw
  text: Na tazama, mtu mmoja aitwaye Yosefu, ambaye alikuwa mjumbe wa baraza, mtu mwema na mwadilifu[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiunganishi na usemi wa kuvuta fikira katika simulizi ya Luka bila kuufanya kuwa wa kawaida kupita kiasi.
- source_word: ἀνὴρ
  choice: mtu mmoja
  rationale: Katika muktadha huu neno linamtaja mwanamume fulani; Kiswahili hutumia kwa kawaida ‘mtu mmoja’ kumtambulisha mhusika mpya, huku jina Yosefu likionyesha jinsia yake wazi.
- source_word: ὀνόματι Ἰωσὴφ
  choice: aitwaye Yosefu
  rationale: Ni Kiswahili cha asili na wazi kwa kirai cha Kidativu kinachotambulisha jina la mtu.
- source_word: βουλευτὴς ὑπάρχων
  choice: ambaye alikuwa mjumbe wa Baraza
  rationale: ‘Mjumbe wa Baraza’ linaeleza kwa uwazi kwamba Yosefu alikuwa mmoja wa wajumbe wa baraza linalohusika katika simulizi; kishazi hicho pia kinawasilisha vizuri hali inayoonyeshwa na participio ὑπάρχων.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: mtu mwema na mwenye haki
  rationale: Kurudiwa kwa ‘mtu’ kunahifadhi msisitizo wa kurudiwa kwa ἀνήρ. ‘Mwema’ linatafsiri ἀγαθός, na ‘mwenye haki’ linahifadhi upana wa δίκαιος unaoweza kuhusisha unyoofu wa kimaadili na uadilifu.
theological_decisions:
- issue: Tafsiri ya δίκαιος katika maelezo ya tabia ya Yosefu
  choice: mwenye haki
  alternative: mwadilifu
  rationale: ‘Mwenye haki’ linadumisha mwangwi mpana wa kibiblia wa kuwa mnyofu mbele za Mungu na wanadamu bila kulifanya neno hili kuwa dai maalumu la kimafundisho. ‘Mwadilifu’ pia linawezekana, hasa ikiwa msisitizo unaeleweka kuwa tabia ya haki katika mwenendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya mkato mrefu mwishoni imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
