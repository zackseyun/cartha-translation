  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: sw
  text: Naye akasema, “Yesu, unikumbuke utakapokuja katika ufalme wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika hati nyingine, “utakapokuja kuingia katika ufalme wako.” Matini ya SBLGNT husoma “katika ufalme wako.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumrejelea msemaji kwa Kiswahili cha kawaida bila kuongeza nguvu ya kimantiki isiyokuwamo.
- source_word: ἔλεγεν
  choice: akasema
  rationale: Ingawa kitenzi hiki ni cha wakati uliopita usiotimilika, katika utangulizi wa usemi wa simulizi Kiswahili hutumia kwa kawaida “akasema”; “alikuwa akisema” kingesisitiza mwendelezo usio lazima hapa.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Ni hali ya kumwita mhusika kwa jina moja kwa moja; umbo la kawaida la jina hili kwa Kiswahili ni “Yesu.”
- source_word: μνήσθητί μου
  choice: unikumbuke
  rationale: Hii ni ombi la moja kwa moja la kumkumbuka msemaji. Katika muktadha huo linaweza kudokeza kumjali au kumtendea kwa fadhili, lakini maana hiyo haijaongezwa wazi katika matini.
- source_word: ὅταν ἔλθῃς
  choice: utakapokuja
  rationale: Muundo huu huonyesha tukio la baadaye linalotarajiwa; “utakapokuja” ni wa asili na huhifadhi maana ya “wakati utakapokuja.”
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: katika ufalme wako
  rationale: “Katika” hufuata moja kwa moja ἐν na huhifadhi uwezekano wa kuelewa kuja akiwa katika utawala wake au kuja katika mazingira ya ufalme wake, bila kubadili kimya kimya kuwa mwendo wa kuingia.
- source_word: βασιλείᾳ
  choice: ufalme
  rationale: “Ufalme” ni neno la kawaida na lenye heshima, na linaweza kumaanisha eneo la kifalme pamoja na utawala wa mfalme kulingana na muktadha.
theological_decisions:
- issue: Maana ya wakati na namna ya kuja kwa Yesu katika ufalme wake
  choice: Ombi linaelekezwa kwa Yesu kuhusu kuja kwake kwa wakati ujao katika ufalme wake, bila kufafanua ratiba au mfumo kamili wa matukio ya mwisho.
  alternative: Kauli inaweza kueleweka kuwa Yesu anakuja katika mamlaka yake ya kifalme, au anafika katika ufalme uliotimilika.
  rationale: Aya inahusisha wazi ufalme wa baadaye na Yesu, lakini haielezi kwa undani wakati, namna, wala mpangilio wa kutimizwa kwake; tafsiri haipaswi kuamua mambo hayo.
- issue: Nguvu ya kihusishi ἐν baada ya ἔλθῃς
  choice: katika ufalme wako
  alternative: kwenda/kuingia katika ufalme wako; pamoja na ufalme wako
  rationale: Matini ya SBLGNT ina ἐν, kwa kawaida “katika,” si εἰς, “kuingia katika.” Hivyo “katika” huhifadhi vizuri zaidi muundo na utata wa matini iliyochaguliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Sentensi ni fupi na ya asili kwa usomaji wa Biblia wa watu wote; hakuna istilahi ya dhehebu iliyoingizwa.
