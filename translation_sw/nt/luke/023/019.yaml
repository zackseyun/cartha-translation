lexical_decisions:
- source_word: ὅστις
  choice: ambaye
  rationale: Kiwakilishi hiki kinamrejelea Baraba aliyetajwa katika muktadha; “ambaye” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: διὰ
  choice: kwa sababu ya
  rationale: Ikiwa na hali ya kushutumiwa, kihusishi hiki kinaonyesha sababu ya kufungwa kwake; “kwa sababu ya” ni wazi na ya kawaida katika Kiswahili.
- source_word: στάσιν
  choice: uasi
  rationale: Hapa neno hili linaashiria vurugu au harakati za kupinga mamlaka ya kiraia. “Uasi” ni neno la kawaida linalohifadhi maana ya kisiasa, huku tanbihi ikitaja uwezekano wa “maasi.”
- source_word: τινὰ
  choice: fulani
  rationale: Neno hili linaonyesha jambo lisilotajwa kwa umahususi; “fulani” linahifadhi maana hiyo.
- source_word: γενομένην ἐν τῇ πόλει
  choice: uliokuwa umetokea mjini
  rationale: Kishiriki hiki kinauelezea uasi kuwa tukio lililotokea mjini. “Mjini” ni ya asili katika Kiswahili bila kulitaja Yerusalemu, ambalo halitajwi wazi katika Kigiriki.
- source_word: φόνον
  choice: mauaji
  rationale: φόνος humaanisha kuua kwa jinai. Katika Kiswahili cha kawaida, “mauaji” linafaa katika muktadha huu wa shtaka la jinai bila kudai idadi ya waliouawa.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: alikuwa ametupwa gerezani
  rationale: Tafsiri hii inahifadhi nguvu ya kitenzi βάλλω na hali timilifu ya tukio lililotangulia, huku ikibaki ya kawaida katika Kiswahili.
