base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: sw
  text: Lakini wao walizidi kusisitiza[a], wakisema, “Anawachochea watu kwa kufundisha katika Yudea yote[b], kuanzia Galilaya hadi hapa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walisisitiza kwa nguvu zaidi.” Kitenzi cha Kigiriki kinaonyesha msisitizo wenye kuendelea au kuongezeka.
    reason: lexical_alternative
  - marker: b
    text: “Yudea” huenda likamaanisha eneo la Yudea hasa, au katika baadhi ya miktadha eneo pana la Wayahudi linalozungumziwa hapa. Maneno haya yanakazia jinsi shughuli yake ilivyoenea.
    reason: cultural_note
  - marker: c
    text: Au, “mpaka mahali hapa.” Maneno haya yanaonyesha mwendo kutoka Galilaya hadi mahali walipokuwa mbele ya Pilato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: wakazidi kusisitiza
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha shinikizo lililoendelea au kuongezeka; usemi huu ni wa asili katika Kiswahili na unabeba nguvu ya madai yao.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha moja kwa moja yaliyomo katika msisitizo wao na kuhifadhi uhusiano wa kishiriki.
- source_word: Ἀνασείει
  choice: anawachochea
  rationale: Neno hilo humaanisha kuwaamsha au kuwavuruga watu kwa namna inayoweza kuleta ghasia. “Anawachochea” linafaa katika shtaka hili bila kulifanya moja kwa moja kuwa kosa maalumu la uasi.
- source_word: τὸν λαὸν
  choice: watu
  rationale: Hurejelea umma kwa upana, si umati maalumu uliokusanyika.
- source_word: διδάσκων
  choice: kwa kufundisha
  rationale: Hapa kishiriki kinaweza kueleza namna au njia inayodaiwa kutumiwa kuwachochea watu; “kwa kufundisha” huonyesha uhusiano huo wazi na kwa Kiswahili cha kawaida.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: katika Uyahudi wote
  rationale: κατά pamoja na jenitivi inaonyesha eneo lote ambamo shughuli hiyo ilienea.
- source_word: Ἰουδαίας
  choice: Uyahudi
  rationale: Hili ndilo jina la kawaida la eneo la Judea katika Kiswahili cha Biblia; muktadha unaweza kuruhusu maana ya eneo mahususi au eneo pana la Wayahudi.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: akianzia Galilaya
  rationale: Huhifadhi Galilaya kama mahali shughuli hiyo ilipoanzia na kutoa Kiswahili cha asili.
- source_word: ἕως ὧδε
  choice: hadi hapa
  rationale: Huhifadhi rejeo la mahali walipokuwa mbele ya Pilato na mwendo wa shtaka kutoka Galilaya mpaka mahali hapo.
theological_decisions:
- issue: Asili ya shtaka dhidi ya Yesu
  choice: “Anawachochea watu”
  alternative: “Anawafanya watu waasi” au “anawapotosha watu”
  rationale: Tafsiri inadumisha shtaka la kuwavuruga au kuwaamsha watu bila kuingiza kosa mahususi zaidi la kisiasa kuliko ἀνασείει linavyodai.
- issue: Uhusiano wa kufundisha na kuchochea
  choice: “kwa kufundisha”
  alternative: “huku akifundisha”
  rationale: Kishiriki διδάσκων kinaweza kueleza namna au njia ya kitendo kinachodaiwa. “Kwa kufundisha” linaonyesha uwezekano huo bila kuongeza maudhui ya mafundisho.
- issue: Upeo wa Ἰουδαία
  choice: “Uyahudi wote”
  alternative: “nchi yote ya Wayahudi”
  rationale: Jina la mahali linahifadhiwa huku tanbihi ikitaja uwezekano wa maana pana; hivyo utata wa kijiografia hauamuliwi kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku “wakazidi kusisitiza” na “hadi hapa” vikihifadhi mwendelezo na nguvu ya shtaka. Alama zote za tanbihi zimewekwa katika matini kwa mpangilio wa marejeo.
