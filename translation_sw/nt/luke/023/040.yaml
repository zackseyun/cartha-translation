  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: sw
  text: Lakini yule mwingine akajibu, akamkemea, akasema, “Je, hata wewe humwogopi Mungu, kwa kuwa uko chini ya hukumu hiyo hiyo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya adhabu ileile” au “katika hukumu ileile.” Neno la Kigiriki κρίμα linaweza kumaanisha hukumu, uamuzi wa mahakama, au adhabu iliyotolewa; hapa linarejelea matokeo ya hukumu ambayo wote wawili wanashiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Lakini yule mwingine akamjibu
  rationale: δέ inaonyesha tofauti ndogo kati ya mwitikio wa mhalifu huyu na wa mwenzake; ἀποκριθείς inaanzisha jibu lake, na ὁ ἕτερος humtambulisha kuwa yule mwingine kati ya wawili hao.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: kwa kumkemea
  rationale: Muundo huu unaonyesha kuwa jibu lake lilikuwa kemeyo kwa yule mwingine. Kiswahili hakihitaji kurudia kitenzi cha kusema baada ya ‘akamjibu,’ kwa kuwa usemi wa moja kwa moja unaofuata unatosha.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Je, hata wewe humwogopi Mungu
  rationale: ‘Hata’ huhifadhi msisitizo wa οὐδέ, na ‘wewe’ huhifadhi msisitizo wa kiwakilishi σὺ. ‘Kumwogopa Mungu’ ni nahau ya kibiblia yenye uzito wa uwajibikaji wa kimaadili na heshima kwa Mungu.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa ὅτι inatoa msingi wa kemeyo hiyo, hivyo ‘kwa kuwa’ huonyesha uhusiano wa kisababishi kwa njia ya kawaida.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: uko chini ya hukumu iyo hiyo
  rationale: ‘Chini ya hukumu’ ni Kiswahili cha kawaida kinachoonyesha hali ya kuwa umehukumiwa. κρίμα inaweza kurejelea hukumu, uamuzi wa mahakama, au adhabu iliyotolewa; muktadha wa kusulubiwa unaelekeza kwenye matokeo ya hukumu wanayoshiriki.
theological_decisions:
- issue: Maana ya kumwogopa Mungu katika kemeyo
  choice: humwogopi Mungu
  alternative: humheshimu Mungu; humchi Mungu
  rationale: Tafsiri ya moja kwa moja ‘kumwogopa Mungu’ huhifadhi uzito wa usemi wa chanzo bila kuupunguza kuwa heshima tu wala kuupanua kwa maelezo ya kimafundisho.
- issue: Maana ya κρίμα katika hali ya wahalifu hao
  choice: hukumu
  alternative: adhabu; hatia; uamuzi wa mahakama
  rationale: ‘Hukumu’ huhifadhi upana wa neno la Kigiriki huku muktadha ukionyesha hukumu ya adhabu ambayo wote wawili wako chini yake. Tanbihi huhifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘Je, hata wewe...?’ huhifadhi nguvu ya swali la kemeyo, na ‘uko chini ya hukumu’ ni usemi wa kawaida wa kisheria bila kuficha upana wa κρίμα.
