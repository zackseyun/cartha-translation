  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: sw
  text: Naye akamwambia[a], “Kweli ninakuambia, leo utakuwa pamoja nami katika paradiso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, ingawa uwezekano wake ni mdogo: “Kweli ninakuambia leo, utakuwa pamoja nami katika paradiso.” Hati za kale za Kigiriki hazikuwa na uakifishaji wa kisasa; usomaji huu mwingine unaunganisha “leo” na “ninakuambia,” badala ya “utakuwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Kweli
  rationale: Katika semi za Yesu, neno hili linaanzisha tamko la hakika na lenye mamlaka. “Kweli” ni Kiswahili cha sasa na cha kawaida kinachohifadhi uzito huo.
- source_word: σοι λέγω
  choice: ninakuambia
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kauli hii ya mazungumzo katika Kiswahili.
- source_word: σήμερον
  choice: leo
  rationale: Kielezi hiki kinaeleweka kwa kawaida kuwa kinafafanua wakati wa kuwa pamoja na Yesu katika paradiso. Kwa kuwa maandishi ya awali hayakuwa na uakifishaji wa kisasa, uwezekano mwingine umewekwa katika tanbihi.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Tafsiri hii ya asili katika Kiswahili inahifadhi wazo la kuwa katika ushirika na Yesu.
- source_word: ἔσῃ
  choice: utakuwa
  rationale: Hii inaonyesha kwa uwazi na kwa Kiswahili cha kawaida wakati ujao wa kitenzi εἰμί.
- source_word: παραδείσῳ
  choice: paradiso
  rationale: “Paradiso” ni istilahi iliyozoeleka katika Kiswahili kwa mahali pa baraka panapotajwa katika muktadha huu, bila kuongeza maelezo ambayo hayamo katika maandishi.
theological_decisions:
- issue: Uhusiano wa σήμερον (“leo”) katika kauli ambayo maana yake hutegemea uakifishaji na inaweza kuathiri fundisho kuhusu hali baada ya kifo
  choice: Kuunganisha “leo” na “utakuwa pamoja nami katika paradiso”
  alternative: Kuunganisha “leo” na “ninakuambia”
  rationale: Maandishi ya kale ya Kigiriki hayakuwa na uakifishaji wa kisasa. Mpangilio wa kawaida zaidi wa maneno na mtiririko wa sentensi unaonyesha kuwa “leo” hufafanua wakati ambapo mtu huyo atakuwa pamoja na Yesu katika paradiso. Hata hivyo, tafsiri nyingine inayowezekana imehifadhiwa katika tanbihi ili kutatua kimya kimya mvutano wa kitafsiri na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Naye akamwambia” huhifadhi muendelezo wa simulizi, na “pamoja nami” ni ya asili zaidi kuliko “nami” peke yake katika muktadha huu.
