  text: Lakini Pilato, baada ya kuwaita pamoja makuhani wakuu, viongozi, na watu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaashiria mpito wenye utofauti mdogo katika simulizi, kikirejesha jambo kwa hatua ya Pilato.
- source_word: συγκαλεσάμενος
  choice: aliwaita pamoja
  rationale: Kitenzi hiki kinaeleza kuwaita watu wakusanyike; Kiswahili hutumia sentensi yenye kitenzi kikuu kwa mtiririko wa asili huku mpangilio wa matukio ukiachwa ueleweke katika muktadha.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Wingi huu unawahusu viongozi wa kikuhani, si watu kadhaa waliokuwa kila mmoja kuhani mkuu wa pekee.
- source_word: ἄρχοντας
  choice: viongozi
  rationale: Katika muktadha huu neno linawahusu wenye nafasi ya uongozi au mamlaka; ‘viongozi’ ni la asili na haliongezi wazo la wafalme au watawala wa kisiasa.
- source_word: λαὸν
  choice: watu
  rationale: Neno lina maana ya watu kwa ujumla kama kundi, bila kulibana kuwa umati tu.
