lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki huonyesha kurudiwa kwa tendo; “tena” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti nyepesi katika simulizi, hasa kati ya msimamo wa umati na nia ya Pilato.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: προσεφώνησεν
  choice: akawaambia
  rationale: Kitenzi kinaweza kumaanisha kusema na watu au kuwaita kwa sauti. Katika muktadha huu, “akawaambia” ni cha asili na huonyesha kwamba Pilato aliuhutubia umati bila kuongeza kwa lazima wazo la kupaza sauti.
- source_word: θέλων
  choice: akitaka
  rationale: Huhifadhi hali ya kitenzi kishirikishi inayoonyesha nia ya Pilato wakati uleule alipowaambia.
- source_word: ἀπολῦσαι
  choice: kumwachilia
  rationale: Neno hili linafaa katika muktadha wa kisheria na wa mtu aliye chini ya ulinzi, likimaanisha kumruhusu aende huru.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa.
