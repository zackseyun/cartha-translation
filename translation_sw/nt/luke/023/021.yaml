  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: sw
  text: Lakini wao waliendelea kupiga kelele wakisema, “Msulubishe! Msulubishe!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Mwueni msalabani! Mwueni msalabani!”
    reason: Mbadala huu unafafanua kwamba kusulubisha hapa ni kutekeleza hukumu ya kifo msalabani.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini wao
  rationale: Kiwakilishi hiki kinawarejelea watu waliotajwa katika muktadha, na δέ inaonyesha tofauti ndogo na maneno yaliyotangulia.
- source_word: ἐπεφώνουν
  choice: waliendelea kupiga kelele
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au kurudiwa, huku kitenzi kikidokeza kuita kwa sauti kubwa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kauli hii shirikishi inaonyesha tendo lililofanyika wakati mmoja na kupiga kelele na kutambulisha yaliyosemwa.
- source_word: Σταύρου σταύρου
  choice: Msulubishe! Msulubishe!
  rationale: Amri imerudiwa ili kuonyesha msisitizo na shinikizo la umati. Kiswahili huweka kiambishi cha mtendewa katika kila amri kwa uwazi na uasilia.
- source_word: αὐτόν
  choice: -m- katika “Msulubishe”
  rationale: Kiwakilishi cha yambwa ‘yeye’ kinawakilishwa kwa kawaida na kiambishi cha yambwa -m- ndani ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Maana ya σταύρου kama njia ya kuuawa
  choice: Msulubishe
  alternative: Mwue msalabani
  rationale: Kitenzi cha Kigiriki kinamaanisha hasa kumuua mtu kwa kumsulubisha. ‘Msulubishe’ ni neno sahihi, fupi, na lililozoeleka bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Kurudiwa kwa amri na mwendelezo wa kelele vimehifadhiwa.
