  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: sw
  text: Akawaambia mara ya tatu[a], “Kwa nini? Mtu huyu amefanya uovu gani? Sikuona kosa lolote kwake linalostahili kifo.[b] Kwa hiyo, baada ya kumwadhibu[c], nitamwachilia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni uovu gani ambao mtu huyu amefanya?” Neno la mwanzo la Kigiriki linaweza kueleweka kama swali fupi la kupinga linalotanguliza swali kamili.
    reason: lexical_alternative
  - marker: b
    text: Au, “sababu yoyote ya kumuua,” “jambo lolote linalostahili kifo,” au “msingi wowote wa hukumu ya kifo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “baada ya kumwadhibu”; huenda kwa maana mahususi zaidi, “baada ya kumpiga mijeledi.” Neno la Kigiriki linamaanisha adhabu ya kinidhamu, lakini lenyewe halitaji aina kamili ya adhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: mara ya tatu
  rationale: Hii ni hali ya kielezi inayoonyesha kurudiwa kwa tendo; “mara ya tatu” ni Kiswahili cha kawaida na huhifadhi msisitizo wa simulizi.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Kwa nini? Mtu huyu amefanya uovu gani?
  rationale: Τί inaweza kuwa swali fupi la kupinga linalotangulia swali kamili. Kutenganisha “Kwa nini?” na swali linalofuata huhifadhi mtiririko huo, huku “uovu” ikihifadhi uzito wa kimaadili wa κακόν.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: kosa lolote linalostahili hukumu ya kifo
  rationale: Katika muktadha wa kisheria, αἴτιον inaashiria kosa, sababu, au msingi wa hukumu. Usemi huu unaeleza wazi kwamba Pilato hakuona jambo linalostahili adhabu ya kifo.
- source_word: εὗρον ἐν αὐτῷ
  choice: Sijaona kwake
  rationale: Kauli hasi ya Kiswahili “sijaona kwake” huwasilisha matokeo ya uchunguzi wa Pilato yenye umuhimu wa wakati huo, na hudumisha wazo la kitu kupatikana ndani au kwa mtu huyo bila kuongeza “dhidi yake.”
- source_word: παιδεύσας
  choice: baada ya kumwadhibu
  rationale: Katika muktadha huu kitenzi kinamaanisha kumpa adhabu ya kinidhamu, si kumfundisha tu. “Kumwadhibu” ni ya asili na ya jumla vya kutosha kutotaja aina mahususi ya adhabu ambayo neno lenyewe halibainishi.
- source_word: ἀπολύσω
  choice: nitamwachilia
  rationale: Katika muktadha wa kimahakama, ἀπολύω humaanisha kumwachilia au kumweka huru; “nitamwachilia” ni ya kawaida na wazi.
theological_decisions:
- issue: Aina ya hatua aliyopendekeza Pilato katika παιδεύσας
  choice: Kutafsiri kwa ujumla kuwa adhabu bila kutaja aina yake mahususi.
  alternative: “baada ya kumpiga mijeledi” au “baada ya kumrudi”
  rationale: Pilato anamtangaza Yesu kuwa hastahili kifo lakini bado anapendekeza adhabu nyepesi kuliko kuuawa. Neno la Kigiriki linaruhusu maana mbalimbali za kurudi au kuadhibu; tafsiri kuu haipaswi kuingiza kwa lazima aina mahususi ya adhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kimahakama lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo huhifadhi protesti fupi ya Pilato, uzito wa kimaadili wa “uovu,” na mvutano wa kumwadhibu mtu ambaye ametangazwa kutokuwa na kosa linalostahili kifo.
