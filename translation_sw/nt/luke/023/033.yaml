  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: sw
  text: Walipofika mahali paitwapo Fuvu[a], hapo walimsulubisha yeye pamoja na wale wahalifu, mmoja upande wa kulia na mwingine upande wa kushoto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali panapoitwa Fuvu.” Neno la Kigiriki Κρανίον maana yake halisi ni “fuvu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mmoja kutoka upande wa kulia na mwingine kutoka upande wa kushoto.” Kigiriki hakisemi wazi “upande wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: walipofika
  rationale: Katika simulizi hili, aoristi ya ἔρχομαι pamoja na ἐπί + accusative inaeleza kufika mahali; “walipofika” ni Kiswahili cha kawaida na huunganisha kwa asili na tendo lililofuata.
- source_word: ἐπὶ τὸν τόπον
  choice: mahali
  rationale: Baada ya “walipofika,” uelekeo na kufika tayari vimeelezwa, hivyo “mahali” huepuka urudiaji usio wa lazima huku ikihifadhi maana.
- source_word: τὸν καλούμενον Κρανίον
  choice: paitwapo Fuvu
  rationale: Κρανίον maana yake halisi ni “fuvu.” Muundo “mahali paitwapo” ni wa asili na wenye hadhi katika Kiswahili, na kutafsiri jina hili huhifadhi maana yake badala ya kulinakili kifonetiki.
- source_word: ἐσταύρωσαν
  choice: walimsulubisha
  rationale: “Kusulubisha” ndilo neno sanifu na sahihi kwa σταυρόω; haliongezi maelezo ya namna ya kufungwa au kupigiliwa ambayo kitenzi chenyewe hakuyataji wazi.
- source_word: κακούργους
  choice: wahalifu
  rationale: κακοῦργος humaanisha mtu anayefanya uovu au mhalifu. “Wahalifu” ni neno la sasa, wazi, na halibani maana kuwa “wanyang’anyi” au “waasi.”
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: mmoja upande wa kulia na mwingine upande wa kushoto
  rationale: Muundo huu hugawa wahalifu wawili kwa nafasi zao. Tafsiri haiongezi “yake,” kwa kuwa ingawa inafahamika kutokana na muktadha, haijaandikwa wazi katika Kigiriki.
theological_decisions:
- issue: Tafsiri ya Κρανίον
  choice: Fuvu
  alternative: mahali paitwapo Fuvu la Kichwa; Kranioni
  rationale: Neno hilo la mahali limetokana na nomino ya kawaida yenye maana “fuvu.” Kutafsiri maana yake kunafuata ushahidi wa Kigiriki na hakupachiki jina la jadi kutoka vifungu sambamba.
- issue: Maelezo ya watu wawili waliosulubishwa pamoja na Yesu
  choice: wahalifu
  alternative: watenda maovu; wanyang’anyi
  rationale: Neno la Luka κακοῦργοι ni pana kuliko “wanyang’anyi” au “waasi.” “Wahalifu” huepuka kulinganisha kimabavu istilahi ya Luka na zile za Injili nyingine.
- issue: Uhusiano wa Yesu na wahalifu katika kusulubishwa
  choice: walimsulubisha yeye pamoja na wale wahalifu
  alternative: walimsulubisha yeye na wahalifu
  rationale: “Pamoja na” huonyesha wazi kuwa wahalifu pia walisulubishwa bila kubadili usawa wa kisarufi wa καί, huku “yeye” ikihifadhi msisitizo wa αὐτόν.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Paitwapo” linafaa kwa mahali na lina mtindo wa kifasihi unaoeleweka; “wahalifu” ni wazi kwa wasomaji wa kawaida. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
