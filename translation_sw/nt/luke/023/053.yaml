base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: sw
  text: Baada ya kumshusha, akamzungushia kitambaa cha kitani, na akamweka katika kaburi lililochongwa mwambani[a], ambamo bado mtu yeyote hakuwa amelazwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi lililochongwa katika mwamba.”
    reason: lexical_alternative
  - marker: b
    text: Au “ambamo mtu yeyote alikuwa hajawahi kulazwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: Kisha akamshusha
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba alimshusha Yesu kabla ya kumfunika na kumweka kaburini. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza mfuatano wa matendo.
- source_word: ἐνετύλιξεν
  choice: akamfunika
  rationale: Katika muktadha wa maziko, ἐντυλίσσω humaanisha kuzungushia au kufunika mwili kwa kitambaa. ‘Akamfunika’ ni ya asili na haiongezi maelezo yasiyokuwamo katika Kigiriki.
- source_word: σινδόνι
  choice: kwa kitambaa cha kitani
  rationale: Hii ni hali ya chombo; σινδών ni kitambaa cha kitani ambacho kingeweza kutumiwa katika maziko. Tafsiri hii ni wazi kuliko neno la kitaalamu.
- source_word: ἔθηκεν
  choice: akamweka
  rationale: τίθημι hapa ni kumweka mtu mahali fulani. ‘Akamweka’ ni ya kawaida na yenye heshima katika simulizi la maziko.
- source_word: μνήματι
  choice: katika kaburi
  rationale: μνῆμα ni mahali pa kuzikia au kaburi. ‘Kaburi’ ni neno la kawaida na linafaa kwa mazingira ya karne ya kwanza.
- source_word: λαξευτῷ
  choice: lililochongwa mwambani
  rationale: λαξευτός hueleza kitu kilichochongwa au kuchimbwa katika jiwe. ‘Lililochongwa mwambani’ linaonyesha kwa kawaida kwamba kaburi lilitengenezwa ndani ya mwamba.
- source_word: οὗ
  choice: ambamo
  rationale: Kielezi hiki cha uhusiano kinarejelea sehemu ya ndani ya kaburi. ‘Ambamo’ ni sahihi na ya asili katika Kiswahili sanifu.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: hakuna mtu aliyekuwa amelazwa bado
  rationale: Muundo huu unasema kwamba kufikia wakati huo hakuna mtu aliyekuwa amewekwa humo akiwa amelala. ‘Amelazwa bado’ linafaa kwa muktadha wa maziko na linahifadhi maana ya οὔπω, ‘bado/hadi wakati huo.’
theological_decisions:
- issue: Maelezo ya maziko na aina ya kaburi
  choice: Yosefu alimweka Yesu katika kaburi lililochongwa mwambani, ambalo halikuwa limetumiwa kumlaza mtu yeyote hadi wakati huo.
  alternative: Yosefu alimweka Yesu katika kaburi la kuchongwa ambamo hakuna mtu aliyewahi kulala.
  rationale: Aya hii inatoa maelezo ya kihistoria kuhusu maziko. Tafsiri inadumisha habari ya kaburi lililochongwa na kutotumiwa kwake hapo awali bila kuingiza maelezo kutoka simulizi sambamba au madai ya ziada ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi ‘akamshusha, akamfunika, na akamweka’ unasomeka kwa urahisi katika simulizi. ‘Kitambaa cha kitani’ huepuka neno la kitaalamu lisilo la lazima, huku ‘kaburi lililochongwa mwambani’ likihifadhi mazingira halisi ya maandishi.
