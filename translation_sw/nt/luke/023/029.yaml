id: LUK.23.29
reference: Luke 23:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: sw
  text: Kwa maana tazama, siku zinakuja ambazo watu watasema, “Heri wanawake tasa, na matumbo ambayo hayakuzaa, na matiti ambayo hayakunyonyesha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Kiashirio hiki kinavuta fikira kwa uzito kuelekea siku zinazokuja; “tazama” ni cha heshima na kinachotambulika katika Kiswahili cha Biblia.
- source_word: Μακάριαι
  choice: Heri
  rationale: “Heri” huwasilisha tamko la kuwa katika hali inayohesabiwa kuwa njema, si hisia ya furaha tu.
- source_word: αἱ στεῖραι
  choice: wanawake tasa
  rationale: Kivumishi kilichotumika kama nomino kinamaanisha wanawake wasioweza kuzaa; kutaja “wanawake” huifanya sentensi iwe wazi na ya kawaida.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: matumbo ambayo hayakuzaa
  rationale: Hudumisha taswira halisi ya “matumbo” na urudiaji wa kishairi, bila kuibadili kuwa maelezo ya jumla kuhusu wanawake.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: matiti ambayo hayakunyonyesha
  rationale: Katika muktadha huu ἔθρεψαν hurejelea kulisha mtoto kwa maziwa ya mama; “kunyonyesha” ni usemi wa asili na sahihi.
theological_decisions:
- issue: Tamko la “Heri” kuhusu wanawake tasa
  choice: Limehifadhiwa kama tamko la kinabii ndani ya maneno yatakayosemwa wakati wa maafa yajayo.
  alternative: Kulieleza moja kwa moja kuwa utasa ni baraka ya kudumu.
  rationale: Muktadha na muundo wa Kigiriki vinaonyesha mgeuko wa kutisha wa hali katika siku zijazo; tafsiri haipaswi kuligeuza kuwa fundisho la jumla kuhusu utasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa “wanawake tasa… matumbo… matiti” umehifadhiwa ili kutunza msisitizo na taswira ya chanzo.
