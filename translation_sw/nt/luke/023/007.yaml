  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: sw
  text: Alipofahamu kwamba Yesu alikuwa chini ya mamlaka ya Herode[a], alimpeleka kwa Herode, ambaye pia alikuwa huko Yerusalemu siku hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya mamlaka ya Herode.” Usemi wa Kigiriki unarejelea jurisdiksheni, yaani eneo la utawala au mamlaka ya Herode ya kushughulikia shauri hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Alipofahamu
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; muundo huu wa Kiswahili unaonyesha kwa kawaida maana ya ‘baada ya/ wakati alipofahamu’.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Yesu alikuwa chini ya mamlaka ya kisheria ya Herode
  rationale: Katika muktadha huu, ἐξουσία ni eneo au mamlaka ya kiutawala na kimahakama ya Herode. Jina ‘Yesu’ linaondoa utata wa viwakilishi unaoweza kutokea katika Kiswahili.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: alimpeleka kwa Herode
  rationale: Kitenzi kinaweza kuwa na kidokezo cha kuwasilisha mtu au kesi kwa mwenye mamlaka, lakini ‘alimpeleka’ ni wazi na cha kawaida; muktadha wa kisheria tayari umeelezwa.
- source_word: ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις
  choice: ambaye yeye pia alikuwa Yerusalemu
  rationale: ‘Yeye pia’ huhifadhi msisitizo wa καὶ αὐτόν kwamba Herode naye alikuwapo Yerusalemu.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: siku hizo
  rationale: Hii ni njia ya kawaida ya kisimulizi katika Kiswahili ya kurejelea kipindi hicho.
theological_decisions:
- issue: Maana ya kisiasa na kisheria ya ἐξουσία kuhusu Herode
  choice: mamlaka ya kisheria
  alternative: mamlaka; eneo la utawala
  rationale: Muktadha unahusu mamlaka ya Herode Antipa juu ya eneo alikotoka Yesu na uwezo wake wa kushughulikia shauri hilo, si mamlaka ya kiroho au nguvu kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mamlaka ya kisheria’ ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi ya kitaalamu ‘mamlaka ya kimahakama,’ huku tanbihi ikihifadhi maana mbadala ya eneo la utawala.
