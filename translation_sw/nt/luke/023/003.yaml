id: LUK.23.3
reference: Luke 23:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: sw
  text: Ndipo Pilato akamwuliza, “Je, wewe ndiye Mfalme wa Wayahudi[a]?” Yesu akamjibu, “Wewe umesema hivyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi au watu wa Yudea, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ni wewe unayesema hivyo,” au “Ndiyo, ni kama unavyosema.” Jibu la Kigiriki ni fupi na linaweza kueleweka kama ukubali wenye tahadhari.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ndipo
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole na kuonyesha hatua inayofuata, bila kudokeza upinzani mkali.
- source_word: ἠρώτησεν αὐτόν
  choice: akamwuliza
  rationale: Hii ni tafsiri ya kawaida na ya asili ya tendo la Pilato la kumwelekezea Yesu swali.
- source_word: λέγων
  choice: imewasilishwa kwa kuanzisha maneno ya swali moja kwa moja
  rationale: Katika Kiswahili, kuongeza ‘akisema’ baada ya ‘akamwuliza’ kungekuwa marudio yasiyo ya lazima; alama za usemi na swali lenyewe zinahifadhi kazi yake katika sentensi.
- source_word: Σὺ εἶ
  choice: Je, wewe ndiye
  rationale: Muundo huu unaonyesha wazi kuwa ni swali na pia unahifadhi msisitizo wa kiwakilishi Σὺ.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: Neno hili linaonyesha moja kwa moja cheo cha kifalme kinachochunguzwa; ‘mtawala’ lingedhoofisha dai hilo.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Hiki ndicho cheo cha kawaida na kinachofaa katika muktadha huu, huku maana mbadala ya kijiografia ‘watu wa Yudea’ ikihifadhiwa katika tanbihi.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Yesu akamjibu
  rationale: Kitenzi ‘akamjibu’ kinawasilisha kwa Kiswahili cha asili maana ya kushughulikia swali na kusema kwake, bila marudio mazito ya ‘akijibu ... alisema.’ Jina ‘Yesu’ linaweka wazi mhusika anayejibu.
- source_word: Σὺ λέγεις
  choice: Wewe umesema hivyo
  rationale: 'Tafsiri hii inahifadhi ufupi na hali isiyo ya moja kwa moja ya jibu: Yesu hakatai cheo hicho, lakini anakihusisha na kauli ya Pilato.'
theological_decisions:
- issue: Nguvu ya jibu la Yesu Σὺ λέγεις
  choice: 'Kauli yenye ukubali ulio na tahadhari: ‘Wewe umesema hivyo.’'
  alternative: ‘Ndiyo, ni kama unavyosema’ au ‘Ni wewe unayesema hivyo.’
  rationale: Kigiriki ni kifupi na kinaweza kueleweka kama ukubali wenye sifa fulani, wala si ‘ndiyo’ iliyo wazi kabisa. Tafsiri kuu inalinda mvutano huo bila kulifanya dai la Yesu kuwa kali zaidi au dhaifu zaidi kuliko maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni wa kawaida kwa wasomaji wa leo; marudio ya kisemiti ‘akamwuliza akisema’ yameepukwa kwa ufasaha, na jibu la Yesu limeachwa fupi ili kuhifadhi utata wake wa kimakusudi.
