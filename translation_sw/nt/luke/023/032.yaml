  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: sw
  text: Wengine wawili, waliokuwa wahalifu[a], walikuwa wakipelekwa pamoja naye ili wauawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watenda maovu.” Neno la Kigiriki linamaanisha watu waliotenda mabaya na walio chini ya hukumu ya jinai.
    reason: lexical_alternative
  - marker: b
    text: Au, “watekelezwe kwa hukumu.” Kigiriki kinasema kuuawa bila kutaja njia ya kifo hapa, ingawa muktadha unaonyesha kusulubiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: walikuwa wakipelekwa
  rationale: Kauli ya kutendwa katika wakati usiotimilifu inaonyesha kitendo kilichokuwa kikiendelea; ‘walikuwa wakipelekwa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi chepesi cha kuendeleza simulizi. Mtiririko wa Kiswahili hauhitaji ‘na’ mwanzoni mwa sentensi.
- source_word: καὶ
  choice: pamoja na wazo la ‘wengine’
  rationale: καί inaonyesha kwamba watu hao walijumuishwa pamoja na Yesu. Katika Kiswahili, ‘Wengine wawili ... pamoja naye’ huwasilisha wazo hilo kwa kawaida bila kuongeza neno lisilo la lazima.
- source_word: ἕτεροι
  choice: wengine
  rationale: Neno hili linawatofautisha watu hao na Yesu. ‘Wengine’ ni wazi na la kawaida.
- source_word: κακοῦργοι
  choice: wah alifu
  rationale: Neno la Kigiriki humaanisha watu waliotenda maovu makubwa, na hapa ni watu walio chini ya hukumu ya jinai. ‘Wahalifu’ ni neno la sasa na linaloeleweka; katika maandishi limeandikwa kwa usahihi kama ‘wahalifu’.
- source_word: δύο
  choice: wawili
  rationale: Namba hii inarejelea watu; kwa hiyo upatanisho wa ngeli wa Kiswahili unahitaji ‘wawili’.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Huonyesha kuandamana au kuwa pamoja; ‘pamoja naye’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: ἀναιρεθῆναι
  choice: ili wauawe
  rationale: Kitenzi hiki hapa humaanisha kuondolewa kwa kuuliwa. ‘Ili wauawe’ huhifadhi kusudi na kauli ya kutendwa bila kutaja njia ya kifo ambayo kitenzi chenyewe hakitaji.
theological_decisions:
- issue: Ikiwa tafsiri itaje kusulubiwa katika ἀναιρεθῆναι
  choice: ili wauawe
  alternative: ili wasulubiwe
  rationale: Muktadha unaonyesha kwamba wangesulubiwa, lakini kitenzi chenyewe kinamaanisha kuuawa na hakitaji njia hiyo. Tafsiri pana huhifadhi upeo wa Kigiriki.
- issue: Ikiwa ‘wengine wawili’ iwafanye waonekane kuwa wahalifu wengine kama Yesu
  choice: waliokuwa wahalifu
  alternative: wahalifu wengine wawili
  rationale: Muundo wa Kigiriki unaweza kusikika kwa namna yenye utata, lakini κακοῦργοι inawatambulisha wale wawili. Muundo wa Kiswahili ‘waliokuwa wahalifu’ huepuka kudai kimakosa kwamba Yesu pia alikuwa mhalifu, bila kuficha kwamba wale wawili walihukumiwa kama wahalifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘walikuwa wakipelekwa’ unasomeka kwa kawaida huku ukihifadhi hali endelevu ya kitenzi cha Kigiriki. Alama za tanbihi [a] na [b] zimewekwa mara baada ya maneno yanayofafanuliwa.
