source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: sw
  text: Nao wakaanza kumshtaki wakisema, “Tumemkuta mtu huyu akipotosha taifa letu[a], akitukataza kulipa kodi kwa Kaisari[b], na akisema kwamba yeye mwenyewe ndiye Masihi, mfalme.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akilipotosha taifa letu,” “akilivuruga taifa letu,” au “akiliongoza taifa letu katika njia potovu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki φόρους linamaanisha kodi au ushuru uliolipwa kwa mtawala wa Roma.
    reason: cultural_note
  - marker: c
    text: Au, “akidai kwamba yeye mwenyewe ni Kristo, mfalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Nao wakaanza kumshtaki
  rationale: Muundo huu unahifadhi maana ya kuanza kutoa mashtaka katika muktadha wa kesi; kiwakilishi cha Kiswahili katika kitenzi kinawakilisha αὐτοῦ kwa kawaida.
- source_word: Τοῦτον
  choice: mtu huyu
  rationale: Hii ni lugha ya kawaida ya Kiswahili kwa kumwonyesha mtu anayeshtakiwa, huku ikihifadhi nguvu ya kumrejelea moja kwa moja.
- source_word: εὕραμεν
  choice: Tumemwona
  rationale: Katika shtaka hili, maana ni kwamba walimkuta au walithibitisha kwa madai yao kuwa alikuwa akifanya mambo yaliyotajwa; “tumemwona” ni ya asili bila kuongeza uhakika wa kisheria usio katika Kigiriki.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: akipotosha taifa letu
  rationale: “Kupotosha” huhifadhi wazo pana la kugeuza watu kutoka njia inayofaa bila kulazimisha maana mahsusi ya uasi wa kisiasa; “taifa” linafaa kwa shtaka mbele ya Pilato.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: akitukataza kulipa kodi kwa Kaisari
  rationale: Kitenzi “kukataza” kinaonyesha dai la kuzuia kwa amri, na “kodi” ni neno wazi la kisasa kwa φόρους; “-tu-” huonyesha mhusika anayeeleweka wa kulipa.
- source_word: αὑτὸν χριστὸν βασιλέα εἶναι
  choice: kwamba yeye mwenyewe ndiye Masihi, mfalme
  rationale: “Yeye mwenyewe” huhifadhi msisitizo wa αὑτόν; “Masihi” hutafsiri Χριστός kama cheo cha kifalme, na apposisheni “mfalme” huacha uhusiano wa maneno hayo mawili wazi.
theological_decisions:
- issue: Tafsiri ya χριστόν katika shtaka lenye uzito wa kisiasa
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno linafanya kazi kama cheo cha mtiwa-mafuta mwenye madai ya kifalme, si kama jina tu; “Masihi” huhifadhi mazingira hayo ya Kiyahudi na kisiasa.
- issue: Uhusiano wa χριστόν na βασιλέα
  choice: Masihi, mfalme
  alternative: Masihi mfalme; Kristo, mfalme
  rationale: Kigiriki kina virai viwili vya kijalizo ambavyo vinaweza kueleweka kwa ukaribu bila kueleza kabisa uhusiano wake. Koma huhifadhi mvutano huo badala ya kuvifanya moja kwa moja kuwa cheo kimoja kisichogawanyika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtindo wa shtaka rasmi lakini inatumia maneno yanayoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini.
