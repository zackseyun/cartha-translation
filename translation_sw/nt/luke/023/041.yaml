  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: sw
  text: Nasi, kwa kweli, tunaadhibiwa kwa haki, kwa maana tunapokea adhabu inayolingana na yale tuliyotenda; lakini huyu hakutenda jambo lolote lisilofaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutenda kosa lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: kwa haki
  rationale: Kirai hiki kinaonyesha kwamba adhabu yao ni ya haki na inastahili, huku kikihifadhi maana ya kimahakama ya kielezi cha Kigiriki.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: kwa maana tunapata yale yanayostahili matendo yetu
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la matokeo yanayolingana na yale waliyotenda, bila kupoteza uhusiano wa sababu.
- source_word: ἀπολαμβάνομεν
  choice: tunapata
  rationale: Wakati wa sasa unaonyesha kwamba sasa wanayapokea matokeo hayo; “tunapata” ni ya asili na wazi katika muktadha huu.
- source_word: οὗτος
  choice: huyu
  rationale: Kiwakilishi hiki kinahifadhi nguvu ya uonyeshaji na utofautishaji kati ya Yesu na wahalifu hao bila kuongeza nomino isiyokuwamo katika Kigiriki.
- source_word: οὐδὲν ἄτοπον
  choice: jambo lolote lisilofaa
  rationale: Huhifadhi upana wa ἄτοπον, yaani jambo lisilofaa au baya, bila kuibana kuwa kosa la jinai pekee.
- source_word: ἔπραξεν
  choice: hakutenda
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha tendo lililofanywa na kinaendana kwa asili na tamko la kutokuwa na hatia.
theological_decisions:
- issue: Tamko la mhalifu kuhusu kutokuwa na hatia kwa Yesu
  choice: lakini huyu hakutenda jambo lolote lisilofaa
  alternative: lakini mtu huyu hakufanya kosa lolote
  rationale: Tafsiri iliyochaguliwa inatoa ushuhuda wa wazi kwamba Yesu hakufanya jambo lisilofaa katika muktadha huu, lakini haiongezi dai pana la kimafundisho wala kuifanya ἄτοπον kuwa istilahi ya jinai pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili bila kuondoa utofautishaji wa Kigiriki kati ya “sisi” na “huyu.”
