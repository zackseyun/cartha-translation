  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: sw
  text: Lakini hata Herode hakumwona kuwa na hatia, kwa maana alimrudisha kwetu.[a] Na tazama, hakuna jambo lolote linalostahili hukumu ya kifo alilotenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale zina: “kwa maana niliwatuma kwake.”'
    reason: 'Tofauti ya hati za kale hubadili mtumaji na anayeturudiwa: maandishi yaliyotumika hapa yanasema Herode alimrudisha Yesu kwa Pilato, ilhali usomaji mwingine unasema Pilato aliwatuma wasikilizaji wake kwa Herode.'
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Wala Herode pia hakumwona kuwa na hatia
  rationale: Muundo wa Kigiriki una kauli iliyodondoshwa ambayo hukamilishwa kutokana na muktadha wa hukumu ya Pilato katika mstari uliotangulia. Kiswahili cha kawaida huhitaji kuifanya wazi; “pia” huonyesha kwamba Herode naye alifikia uamuzi huohuo.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: kwa maana alimrudisha kwetu
  rationale: Katika muktadha huu wa kisheria, ἀναπέμπω humaanisha kumrudisha au kumpeleka tena. “Kwa maana” huonyesha kwamba kurudishwa kwa Yesu kunathibitisha kauli kuhusu uamuzi wa Herode.
- source_word: καὶ ἰδοὺ
  choice: Tazama
  rationale: “Tazama” ni tamko la heshima na linaloeleweka linalovuta fikira kwenye hitimisho la Pilato, bila kutumia lugha ya kizamani kupita kiasi.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: jambo lolote linalostahili adhabu ya kifo
  rationale: 'Kauli hii ina nguvu ya kimahakama: hakuna tendo linalostahili hukumu ya kifo. Kutaja “adhabu” huifanya maana hiyo iwe wazi kwa msomaji wa Kiswahili.'
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: mtu huyu hakutenda
  rationale: Dativi αὐτῷ inaeleweka hapa kwa maana ya mtendaji wa tendo. Kiswahili cha utendaji ni cha asili zaidi kuliko muundo wa kutendwa na kinaweka wazi kwamba Pilato anazungumzia matendo yanayodaiwa kufanywa na Yesu.
theological_decisions:
- issue: Maana ya αὐτῷ pamoja na πεπραγμένον
  choice: 'Mtendaji: “mtu huyu hakutenda”'
  alternative: 'Rejeleo: “hakuna jambo kama hilo lililopatikana kwake”'
  rationale: Muktadha ni tangazo la Pilato kwamba Yesu hakufanya kosa linalostahili kifo. Tafsiri hii huwasilisha uamuzi huo bila kudokeza kimakosa kwamba jambo fulani lilitendwa dhidi yake.
- issue: Kauli iliyodondoshwa baada ya οὐδὲ Ἡρῴδης
  choice: Kukamilisha kwa “hakumwona kuwa na hatia”
  alternative: 'Kuacha kifupi: “Wala Herode pia”'
  rationale: Kigiriki huchukua wazo la mstari uliotangulia, ambako Pilato anasema hakupata sababu ya mashtaka. Kukamilisha kauli hiyo ni lazima kwa Kiswahili fasaha na hakubadili hoja ya kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Herode” linafuata umbo la kawaida la jina hilo katika Biblia za Kiswahili. “Tazama” hudumisha msisitizo wa ἰδού.
