  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: sw
  text: Kulikuwa pia na maandishi[a] juu yake:[b] “Huyu ndiye Mfalme wa Wayahudi.”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara,” “tangazo,” au “shtaka lililoandikwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “hapo juu yake.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki ni, kwa kufuata mpangilio wa maneno, “Mfalme wa Wayahudi, huyu.”
    reason: lexical_alternative
  - marker: d
    text: Katika miktadha mingine, “Wayahudi” linaweza kutafsiriwa “watu wa Yudea”; lakini katika kichwa hiki kilichowekwa wakati wa kusulubiwa, “Wayahudi” ndiyo tafsiri ya kawaida na inayofaa muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: maandishi
  rationale: Neno hili linamaanisha ujumbe ulioandikwa na kuwekwa mahali pa kuonekana. “Maandishi” ni Kiswahili cha kawaida na hakilazimishi maana finyu ya shtaka rasmi au kibao.
- source_word: ἐπ’ αὐτῷ
  choice: juu yake
  rationale: Katika mazingira ya kusulubiwa, usemi huu unaonyesha mahali maandishi yalipowekwa kuhusiana na Yesu. “Juu yake” ni wa kawaida na huhifadhi uwezekano wa maana ya ‘over/above him’ bila kutaja kitu kisichotajwa moja kwa moja katika mstari.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Huyu ndiye Mfalme wa Wayahudi
  rationale: Kigiriki hakina kitenzi kilichoandikwa, na οὗτος ina mkazo wa kuonyesha mtu huyu. “Huyu ndiye” ni muundo wa asili wa Kiswahili unaohifadhi mkazo huo.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Katika cheo hiki cha kusulubiwa, “Mfalme wa Wayahudi” ndiyo maana inayofaa kimuktadha na iliyozoeleka. “Watu wa Yudea” inawezekana katika miktadha mingine lakini haifai zaidi hapa.
- source_word: δὲ καὶ
  choice: pia
  rationale: Muunganiko huu unaongeza taarifa nyingine katika simulizi. “Pia” huwasilisha nguvu yake ya nyongeza kwa Kiswahili fasaha bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Asili na kusudi la maandishi ya kusulubiwa
  choice: Kutoa taarifa na maneno ya maandishi kama yalivyo, bila kuyaeleza kuwa kejeli, shtaka rasmi, au ungamo la Kimasihi.
  alternative: Kuyaita moja kwa moja shtaka rasmi au kuongeza kwamba yalikuwa ya kejeli au ya kisiasa.
  rationale: Mstari wenyewe unataja kuwapo na yaliyomo katika maandishi, lakini hauelezi wazi nia yake. Tafsiri inapaswa kuacha mvutano huo wa kisimulizi na kiteolojia bila kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida. “Maandishi” huepuka lugha ya kitaalamu kupita kiasi, huku “Huyu ndiye” ikihifadhi mkazo wa demonstrativi ya Kigiriki.
