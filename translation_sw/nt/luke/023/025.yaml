  to: Basi akamwachilia yule mtu aliyekuwa ametupwa gerezani kwa sababu ya uasi na uuaji[a], ambaye walikuwa wakimwomba aachiliwe; lakini akamkabidhi Yesu kwa mapenzi yao[b].
