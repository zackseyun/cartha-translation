  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa karibu maana ya Kigiriki: kuachiliwa kwa mfungwa, sababu ya kifungo chake, na Yesu kukabidhiwa kulingana na mapenzi ya umati. Hata hivyo, “ambaye walikuwa wakimwomba” bila kukamilisha kitendo inaweza kusikika kana kwamba umati ulikuwa ukimwomba mtu huyo mwenyewe, badala ya kumwomba Pilato amwachilie. “Uuaji” pia huwakilisha vizuri zaidi φόνον (umoja) kuliko “mauaji.”'
  naturalness: Muundo wa simulizi ni wa asili na wa kiwango sanifu. Ufafanuzi mfupi “aachiliwe” hufanya rejeleo la ombi lieleweke kwa Kiswahili bila kubadilisha maana ya muktadha.
  terminology: “Uasi,” “gerezani,” “akamwachilia,” “akamkabidhi,” na “mapenzi yao” zinafaa katika Kiswahili Sanifu cha Afrika Mashariki na zinadumisha rejesta ya simulizi la kisheria. Alama za tanbihi zinahitaji kutofautishwa; rasimu ina alama [a] mara mbili.
  issues:
  - severity: medium
    issue: Alama ya tanbihi [a] imetumika mara mbili, na hakuna tanbihi tofauti kwa “mapenzi yao.”
    rationale: Hii husababisha hitilafu ya kimuundo na kumwacha msomaji bila tanbihi inayolingana na mbadala wa τῷ θελήματι αὐτῶν.
  - severity: medium
    issue: “Ambaye walikuwa wakimwomba” haielezi kwa uwazi walikuwa wakimwomba nini.
    rationale: Kwa matumizi ya kawaida ya Kiswahili, inaweza kueleweka kuwa walikuwa wakimsihi mtu huyo. Kuongeza “aachiliwe” huonyesha kwa wazi kwamba alikuwa mtu ambaye umati ulimwomba Pilato aachilie, sambamba na muktadha wa ὃν ᾐτοῦντο.
  - severity: low
    issue: “Mauaji” ni wingi, ilhali φόνον ni umoja.
    rationale: “Uuaji” huhifadhi umoja wa nomino ya Kigiriki bila kupunguza maana ya uhalifu unaotajwa.
