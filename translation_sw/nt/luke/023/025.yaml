  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: sw
  text: Basi akamwachilia yule mtu aliyekuwa ametupwa gerezani kwa sababu ya uasi na uuaji[a], ambaye walikuwa wakimwomba aachiliwe; lakini akamkabidhi Yesu kwa mapenzi yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “aliyekuwa ametiwa gerezani.” Kigiriki kina taswira yenye nguvu zaidi: “aliyekuwa ametupwa gerezani.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kile walichotaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: akamwachilia
  rationale: Kitenzi hiki katika muktadha wa kisheria kinamaanisha kumfungua au kumwachilia mfungwa; “akamwachilia” ni Kiswahili cha kawaida na sahihi.
- source_word: διὰ στάσιν καὶ φόνον
  choice: kwa sababu ya uasi na mauaji
  rationale: διά pamoja na hali ya accusative inaonyesha sababu. στάσις hapa ni uasi wa kisiasa au ghasia dhidi ya utawala, si mabishano ya kawaida; φόνος inaweza kumaanisha uuaji au mauaji, na “mauaji” inafaa kwa mtiririko huu.
- source_word: βεβλημένον εἰς φυλακήν
  choice: aliyekuwa ametupwa gerezani
  rationale: Kauli timilifu tendwa ya βάλλω ina taswira yenye nguvu ya kutupwa gerezani. Tafsiri hii huhifadhi uhai wa Kigiriki kuliko “aliyekuwa amefungwa.”
- source_word: ὃν ᾐτοῦντο
  choice: ambaye walikuwa wakimwomba
  rationale: Wakati usiotimilifu wa αἰτέω unaonyesha ombi lililokuwa likiendelea. “Walikuwa wakimwomba” huhifadhi hali hiyo bila kuongeza wazo la kudai kwa nguvu.
- source_word: παρέδωκεν
  choice: akamkabidhi
  rationale: παραδίδωμι hapa ina maana ya kumkabidhi mtu kwa mamlaka au uamuzi wa wengine; “akamkabidhi” ni ya asili na huhifadhi maana ya uhamisho wa kimahakama.
- source_word: τῷ θελήματι αὐτῶν
  choice: kwa mapenzi yao
  rationale: θέλημα ni mapenzi, nia, au kile wanachotaka. “Kwa mapenzi yao” huhifadhi uzito wa hiari na nia uliomo katika Kigiriki.
- source_word: δὲ ... δὲ
  choice: Basi ... lakini
  rationale: δέ ya kwanza inaendeleza simulizi, na ya pili inaweka utofauti kati ya kuachiliwa kwa mfungwa na kukabidhiwa kwa Yesu.
theological_decisions:
- issue: Utofauti kati ya mwasi aliyeachiliwa na Yesu aliyekabidhiwa
  choice: Utofauti umewekwa wazi kwa “lakini,” bila kuongeza lugha ya badala au fundisho la upatanisho.
  alternative: Kuongeza “badala ya Yesu” au “mahali pake.”
  rationale: Mstari unasimulia uamuzi wa Pilato na mapenzi ya umati, lakini hausemi wazi kwamba mtu huyo aliachiliwa kama mbadala wa Yesu kwa maana ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza simulizi kwa urahisi huku ukihifadhi utofauti na nguvu ya maneno ya Kigiriki.
