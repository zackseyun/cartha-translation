translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Kauli ya Pilato imewasilishwa kwa istilahi wazi ya kisheria bila kuondoa maana mbadala ya neno αἴτιον.
