  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: sw
  text: Ndipo Pilato akawaambia makuhani wakuu na makutano, “Sioni sababu yoyote ya kumshtaki mtu huyu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Sioni kosa lolote kwa mtu huyu.” Neno la Kigiriki αἴτιον linaweza kumaanisha “kosa,” lakini hapa lina maana ya kisheria: hakuna msingi halali wa shtaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ndipo
  rationale: Ni kiunganishi chepesi kinachoendeleza simulizi; “Ndipo” linaonyesha mwendelezo wa tukio kwa Kiswahili cha kawaida bila kulazimisha maana ya upinzani.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: εἶπεν πρὸς
  choice: akawaambia
  rationale: Muundo huu una maana ya kusema au kuwaambia watu fulani; “akawaambia” ni wa asili na unaonyesha wazi walengwa walio katika wingi.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hurejelea viongozi wa ngazi ya juu wa ukuhani, wala si watu kadhaa walioshika kwa wakati mmoja cheo cha kuhani mkuu.
- source_word: ὄχλους
  choice: makutano
  rationale: Neno hili la Kiswahili linafaa kwa makundi ya watu waliokusanyika na linaakisi wingi wa neno la Kigiriki.
- source_word: Οὐδὲν εὑρίσκω
  choice: Sioni ... yoyote
  rationale: Hii ni kauli ya sasa ya tathmini ya Pilato; “sioni” ni ya asili katika Kiswahili na huhifadhi nguvu ya ukanushaji.
- source_word: αἴτιον
  choice: sababu yoyote ya kumshtaki
  rationale: Katika muktadha huu wa kisheria, neno hilo linamaanisha msingi halali wa shtaka. Tafsiri hii inaweka wazi maana hiyo huku tanbihi ikihifadhi uwezekano wa maana ya “kosa.”
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: mtu huyu
  rationale: Pamoja na kitenzi na kirai cha shtaka, Kiswahili cha asili husema “kumshtaki mtu huyu” badala ya kufuata kihalisi kihusishi chenye maana ya “ndani ya.”
