  terminology: “Watu wote waliomjua” ni tafsiri inayowezekana ya γνωστοὶ αὐτῷ, ingawa “watu aliowafahamu” katika tanbihi hubadilisha mtazamo wa uhusiano na haisaidii vizuri maana ya “watu waliofahamiana naye / marafiki zake.” Galilaya imeandikwa sawasawa.
