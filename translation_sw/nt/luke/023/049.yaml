base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: sw
  text: Lakini watu wote waliomjua, na wanawake waliomfuata kutoka Galilaya, walikuwa wamesimama kwa mbali wakitazama mambo hayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: walikuwa wamesimama
  rationale: 'Muundo huu unaonyesha hali ya kuendelea katika tukio: walibaki wamesimama, si tendo la ghafula la kusimama.'
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofautishaji mdogo kutoka tukio lililotangulia kwenda kwa watazamaji.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: watu wote waliomjua
  rationale: Usemi huu ni wa kawaida na unaeleweka kwa urahisi, huku ukiepuka kuufanya uhusiano huo kuwa urafiki wa karibu kuliko maana ya Kigiriki inavyolazimu.
- source_word: μακρόθεν
  choice: kwa mbali
  rationale: Hueleza umbali wa mahali na ni usemi wa kawaida katika Kiswahili cha sasa.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: wanawake waliokuwa wamefuatana naye
  rationale: Kitenzi kinaonyesha wanawake waliokuwa wameandamana naye katika safari; 'wamefuatana naye' huhifadhi wazo la kuambatana bila kulazimisha maana finyu ya kiufundi.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: kutoka Galilaya
  rationale: Hutaja mahali walikoanzia kuandamana naye.
- source_word: ὁρῶσαι ταῦτα
  choice: wakitazama mambo hayo
  rationale: Huhifadhi tendo la kuona lililoendelea pamoja na wingi wa ταῦτα, 'mambo hayo.'
theological_decisions: []
