  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha makundi yote mawili ya mashahidi na hali yao ya kuendelea kusimama na kutazama.
