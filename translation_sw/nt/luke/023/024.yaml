translation:
  language: sw
  text: Na Pilato akatoa uamuzi kwamba dai lao litekelezwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pilato akaamua kwamba ombi lao litendeke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na hapa kinaonyesha hatua iliyofuata kutokana na shinikizo lililotangulia, bila kuongeza maana isiyokuwamo katika muktadha.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: ἐπέκρινεν
  choice: akaamua
  rationale: Kitenzi hiki kina maana ya kutoa uamuzi wa kimahakama. “Akaamua” ni Kiswahili cha kawaida na fasaha, huku tanbihi ikihifadhi usemi rasmi zaidi wa kutoa hukumu.
- source_word: γενέσθαι
  choice: litekelezwe
  rationale: Katika muundo huu wa kisarufi, kitenzi hiki kinaonyesha kwamba jambo lililoombwa liruhusiwe litendeke. “Litekelezwe” huwasilisha kwa kawaida utekelezaji wa dai bila kulifanya kuwa hukumu ya adhabu pekee.
- source_word: τὸ αἴτημα
  choice: dai
  rationale: Neno linaweza kumaanisha ombi, dai, au maombi rasmi. “Dai” linafaa kwa sababu muktadha unaonyesha shinikizo kubwa la watu, huku likibaki ndani ya wigo wa maana wa neno la Kigiriki.
- source_word: αὐτῶν
  choice: lao
  rationale: Kiwakilishi hiki cha umilikaji kinawarejelea wale waliokuwa wakisisitiza ombi lao kwa Pilato.
theological_decisions:
- issue: Maana ya kimahakama ya hatua ya Pilato
  choice: Pilato akaamua kwamba dai lao litekelezwe
  alternative: Pilato akatoa hukumu kwamba ombi lao litekelezwe
  rationale: Tafsiri kuu inaonyesha kwamba Pilato alitoa uamuzi rasmi wa kukubali walichodai, bila kuongeza wazo mahsusi la kutoa adhabu ambalo kitenzi hakilazimishi. Tanbihi inahifadhi namna rasmi zaidi ya kueleza uamuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Basi” hudumisha mtiririko wa simulizi; “dai” huonyesha nguvu ya shinikizo la muktadha; tanbihi huhifadhi lafudhi rasmi ya kimahakama.
