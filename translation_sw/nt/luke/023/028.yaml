  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: sw
  text: Lakini Yesu akawageukia, akasema, “Enyi Binti za Yerusalemu[a], msinililie mimi; bali jililieni ninyi wenyewe na watoto wenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wanawake wa Yerusalemu.” Kigiriki kinasema kwa maana halisi “Binti za Yerusalemu,” mwito wa mtindo wa kinabii ambao umedumishwa katika matini kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Lakini Yesu akawageukia
  rationale: Kitenzi cha Kiswahili ‘akawageukia’ kinaonyesha Yesu aligeuza mwili na kuelekea kwao; ‘Lakini’ linaonyesha mpito wenye utofautishaji mdogo unaoletwa na δέ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Enyi Binti za Yerusalemu
  rationale: Tafsiri hii inadumisha taswira halisi ya kifamilia na mwangwi wa lugha ya kinabii, huku ‘Enyi’ likifanya usemi wa moja kwa moja kuwa wa kawaida na wenye heshima katika Kiswahili.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: msinililie mimi
  rationale: ‘Msinililie’ ni usemi wa kawaida unaoonyesha kumlilia mtu; ‘mimi’ limedumishwa ili kuonyesha mkazo na ulinganifu na ‘ninyi wenyewe’.
- source_word: πλὴν
  choice: bali
  rationale: '‘Bali’ linaonyesha sahihisho lenye utofautishaji: wasimlilie Yesu, bali wajililie wao wenyewe.'
- source_word: ἐφ’ ἑαυτὰς κλαίετε
  choice: jililieni ninyi wenyewe
  rationale: Muundo wa kujirejelea unadumisha maana ya kulia kwa ajili yao wenyewe na ulinganifu wake na ‘msinililie mimi’.
- source_word: τὰ τέκνα ὑμῶν
  choice: watoto wenu
  rationale: Hii ni tafsiri wazi, ya kawaida, na inayofaa muktadha wa kifamilia.
theological_decisions:
- issue: Tafsiri ya mwito Θυγατέρες Ἰερουσαλήμ
  choice: Binti za Yerusalemu
  alternative: Wanawake wa Yerusalemu
  rationale: ‘Binti za Yerusalemu’ inadumisha nahau ya kibiblia yenye mwangwi wa kinabii na kijumuiya bila kuongeza fundisho lisilokuwamo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku ukidumisha utofautishaji, mkazo, na mwangwi wa kinabii wa matini ya Kigiriki.
