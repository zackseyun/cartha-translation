  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: sw
  text: Walipokuwa wakimpeleka Yesu, walimkamata Simoni fulani, mtu wa Kirene, aliyekuwa akitoka mashambani[a]. Wakamtwika msalaba[b] ili aubebe nyuma ya Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitoka shambani.” Neno la Kigiriki linaweza kumaanisha shamba maalumu au, kwa maana pana zaidi, eneo la mashambani nje ya mji.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya watu huelewa “msalaba” hapa kuwa hasa “boriti ya msalaba,” lakini andiko la Kigiriki linasema tu “msalaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: walipokuwa wakimpeleka Yesu
  rationale: Kitenzi ἀπάγω humaanisha kuongoza au kumpeleka mtu kutoka mahali fulani, mara nyingi akiwa chini ya ulinzi. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kwamba Yesu alikuwa akipelekwa.
- source_word: ἐπιλαβόμενοι
  choice: walimkamata
  rationale: Katika muktadha huu ἐπιλαμβάνομαι inaonyesha kumshika mtu kwa nguvu au kwa mamlaka. “Walimkamata” huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: Simoni fulani, mtu wa Kirene
  rationale: Neno τινα linamtambulisha mtu ambaye hakutajwa hapo awali, na Κυρηναῖον linaonyesha uhusiano wake na mji wa Kirene. “Mtu wa Kirene” ni wazi na haliongezi dai lisilosemwa kwamba alikuwa mkazi wa kudumu.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: aliyekuwa akitoka mashambani
  rationale: ἀγρός inaweza kumaanisha shamba maalumu au eneo la mashambani nje ya mji. “Akitoka mashambani” ni ya asili na inadumisha maana pana inayofaa muktadha.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: wakamtwika msalaba
  rationale: ἐπιτίθημι hapa ni kuweka mzigo juu ya mtu. Kitenzi “kumtwika” kinaeleza kwa ufupi na kwa kawaida kwamba msalaba uliwekwa juu ya Simoni kama mzigo wa kubeba.
- source_word: τὸν σταυρὸν
  choice: msalaba
  rationale: σταυρός humaanisha msalaba. Tafsiri hii haibainishi “boriti ya msalaba,” jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: φέρειν
  choice: ili aubebe
  rationale: φέρω hapa ina maana ya kubeba kitu. “Aubebe” ni Kiswahili cha kawaida na kinadumisha maana ya kimwili.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: nyuma ya Yesu
  rationale: ὄπισθεν kimsingi huonyesha mahali, yaani kuwa nyuma ya mtu. Tafsiri hii inadumisha taswira ya msafara bila kuipa kauli maana ya ziada.
theological_decisions:
- issue: Iwapo σταυρός itafsiriwe kwa maana maalumu zaidi kuwa boriti ya msalaba
  choice: msalaba
  alternative: boriti ya msalaba
  rationale: Andiko la Kigiriki linatumia σταυρός, si neno maalumu linalotaja boriti. “Msalaba” hudumisha maana ya moja kwa moja na huepuka kuingiza ujenzi upya wa kihistoria usioelezwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wakamtwika” ni tamko la asili linaloonyesha mzigo uliowekwa juu ya Simoni. Alama za tanbihi [a] na [b] zimewekwa baada ya maneno yanayohusika moja kwa moja.
