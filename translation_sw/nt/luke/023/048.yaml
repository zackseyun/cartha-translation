  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: sw
  text: Makundi yote ya watu yaliyokuwa yamekusanyika ili kutazama tukio hilo[a], baada ya kuona yaliyotokea, yalikuwa yakirudi huku wakijipiga vifua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya jambo hili la kutazamwa.”
    reason: lexical_alternative
  - marker: b
    text: Kujipiga vifua kulikuwa ishara ya huzuni, maombolezo, au mshtuko.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: yaliyokuwa yamekusanyika
  rationale: Huwasilisha hali ya watu waliokuwa wamekuja pamoja mahali hapo, kwa Kiswahili cha kawaida na bila kusisitiza kupita kiasi kiambishi σύν-.
- source_word: ὄχλοι
  choice: makundi yote ya watu
  rationale: Huhifadhi wingi wa neno la Kiyunani ὄχλοι kwa usemi wa Kiswahili unaoeleweka kwa urahisi kuliko kutumia nomino ya umoja ‘umati’.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: ili kushuhudia tukio hilo[a]
  rationale: Hueleza kwa lugha ya asili kusudi la kukusanyika kwao na wazo la tukio lililotazamwa hadharani. Tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na maana ya ‘jambo la kutazamwa’.
- source_word: θεωρήσαντες
  choice: baada ya kuona
  rationale: 'Huhifadhi mpangilio wa tendo: kwanza waliona yaliyotokea, kisha wakaanza kurudi.'
- source_word: τὰ γενόμενα
  choice: yaliyotokea
  rationale: Ni usemi mfupi na wa kawaida unaowasilisha maana ya mambo yaliyokuwa yametendeka.
- source_word: τύπτοντες τὰ στήθη
  choice: huku wakijipiga vifua
  rationale: Huhifadhi tendo halisi la mwili na hali yake inayoendelea wakati walipokuwa wakirudi, bila kutaja moja kwa moja hisia au hali yao ya kiroho.
- source_word: ὑπέστρεφον
  choice: yalikuwa yakirudi
  rationale: Muundo huu unaonyesha hali endelevu ya kitenzi cha wakati usiotimilika katika Kiyunani, badala ya kulifanya tendo kuwa tukio moja lililokamilika mara moja.
theological_decisions:
- issue: Maana ya kihisia na kiroho ya kujipiga vifua
  choice: Tafsiri inaacha tendo lenyewe liseme bila kulifafanua kuwa toba, hatia, huzuni, au mshtuko pekee.
  alternative: Kusema wazi kwamba walitubu au kwamba walihuzunika na kushtuka.
  rationale: Kiyunani kinaeleza ishara ya mwili lakini hakitafsiri moja kwa moja hali yao ya ndani. Hivyo mvutano na uwazi wa matini vinahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Makundi yote ya watu’ huhifadhi wingi wa Kiyunani, na ‘yalikuwa yakirudi’ hudumisha hali endelevu ya tendo.
