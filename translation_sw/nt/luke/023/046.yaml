base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: sw
  text: Yesu akapaza sauti kwa nguvu, akasema, “Baba, naiweka roho yangu mikononi mwako.”[a][b] Baada ya kusema hayo, akatoa pumzi yake ya mwisho.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naikabidhi roho yangu.” Kitenzi hicho kinaweza kumaanisha kuweka kitu katika uangalizi wa mwingine.
    reason: lexical_alternative
  - marker: b
    text: 'Kauli hii inarejelea Zaburi 31:5 katika tafsiri ya Kigiriki ya Maandiko: “Naiweka roho yangu mikononi mwako.”'
    reason: cross_reference
  - marker: c
    text: Au, “akafa” au “akakata roho.” Kihalisi, kitenzi hicho kinahusiana na kutoa pumzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: akapaza sauti kubwa
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwamba Yesu alisema kwa sauti yenye nguvu na inayosikika, bila kudokeza lazima hasira.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja; hakuna kiwakilishi cha umilikaji ‘yangu’ katika Kigiriki.
- source_word: εἰς χεῖράς σου
  choice: mikononi mwako
  rationale: Huhifadhi wingi wa ‘mikono’ na nahau ya kibiblia ya kukabidhi kitu chini ya ulinzi au mamlaka ya mwingine.
- source_word: παρατίθεμαι
  choice: naiweka
  rationale: Katika muktadha huu kitenzi cha kati kina maana ya kuweka kitu katika uangalizi wa mwingine. ‘Naiweka ... mikononi mwako’ ni ya kawaida na yenye hadhi katika Kiswahili; tanbihi huhifadhi maana mbadala ya kukabidhi.
- source_word: τὸ πνεῦμά μου
  choice: roho yangu
  rationale: ‘Roho’ huhifadhi upana na uzito wa πνεῦμα katika sala hii kuliko ‘pumzi’ pekee, bila kufafanua zaidi hali ya roho.
- source_word: τοῦτο δὲ εἰπών
  choice: Baada ya kusema hayo
  rationale: Huonyesha kwa kawaida kwamba kusema kulitangulia tendo kuu.
- source_word: ἐξέπνευσεν
  choice: akakata roho
  rationale: Ni nahau ya Kiswahili inayoeleweka kwa kufa na bado ina uhusiano wa picha na kutoa pumzi ya mwisho.
theological_decisions:
- issue: Maana ya πνεῦμά μου katika kauli ya mwisho ya Yesu
  choice: roho yangu
  alternative: pumzi yangu
  rationale: Muktadha wa Yesu kumwomba Baba na kujiweka kwa makusudi chini ya uangalizi wake unaunga mkono ‘roho,’ huku maana ya neno isifungwe kwa maelezo ya kimadhehebu.
- issue: Nguvu ya παρατίθεμαι
  choice: naiweka
  alternative: naikabidhi
  rationale: Kauli ya wakati uliopo ni tendo la kukabidhi linalofanywa kwa maneno hayo. Tafsiri hii ni ya kawaida kwa Kiswahili na tanbihi inaonyesha wazi wazo la kuweka katika uangalizi.
- issue: Dokezo la Zaburi 31:5
  choice: Kuhifadhi usemi ‘mikononi mwako’ na kueleza dokezo katika tanbihi
  alternative: Kutaja Zaburi ndani ya mstari
  rationale: Dokezo la Maandiko linahifadhiwa bila kuongeza maneno yasiyokuwapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akapaza sauti kubwa’ ni wa kawaida, ‘mikononi mwako’ huhifadhi nahau ya kibiblia, na ‘akakata roho’ ni usemi unaoeleweka kwa wasomaji wa kawaida.
