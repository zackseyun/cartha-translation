id: LUK.23.35
reference: Luke 23:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: sw
  text: Nao watu walikuwa wamesimama wakitazama. Hata viongozi walikuwa wakimkejeli, wakisema, “Aliwaokoa wengine; na ajiokoe mwenyewe, ikiwa huyu ndiye Masihi wa Mungu, Mteule.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: walikuwa wamesimama
  rationale: Muundo huu unaonyesha hali iliyoendelea katika mandhari bila kudokeza kwamba watu ndipo waliposimama.
- source_word: θεωρῶν
  choice: wakitazama
  rationale: Kitenzi hiki kinaonyesha kwamba watu waliendelea kuangalia yaliyokuwa yakitendeka.
- source_word: ἐξεμυκτήριζον
  choice: walikuwa wakimkejeli
  rationale: ‘Kumkejeli’ huwasilisha dharau na mzaha wa kudhalilisha unaobebwa na kitenzi cha Kigiriki; kiwakilishi ‘-m-’ kinatokana na muktadha.
- source_word: ἄρχοντες
  choice: viongozi
  rationale: Katika muktadha huu neno linawahusu wenye mamlaka miongoni mwa watu, bila kulifanya mahsusi zaidi kuliko chanzo.
- source_word: Ἄλλους ἔσωσεν
  choice: Aliwaokoa wengine
  rationale: ‘Aliwaokoa’ huhifadhi maana ya kuokoa na marudio ya mzizi huo katika kejeli inayofuata.
- source_word: σωσάτω ἑαυτόν
  choice: na ajiokoe mwenyewe
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa amri ya nafsi ya tatu na unahifadhi marudio ya wazo la kuokoa.
- source_word: εἰ οὗτός ἐστιν
  choice: ikiwa huyu ndiye
  rationale: ‘Huyu’ huhifadhi nguvu ya kiashiria cha οὗτός, ambayo katika kejeli hii inaweza kusikika kuwa ya dharau.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Masihi wa Mungu
  rationale: Χριστός limetumiwa hapa kama cheo; ‘Masihi’ huhifadhi maana yake ya kimasiya kwa Kiswahili cha kawaida.
- source_word: ὁ ἐκλεκτός
  choice: Mteule
  rationale: Neno hili linatumika kama cheo sambamba na ‘Masihi wa Mungu’; herufi kubwa inaonyesha matumizi hayo bila kuongeza tafsiri ya kidhehebu.
theological_decisions:
- issue: Uwasilishaji wa Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kishazi hiki ni cheo cha kimasiya, si matumizi yaliyo kama jina la kawaida; ‘Masihi’ huonyesha hilo wazi.
- issue: Nguvu ya ὁ ἐκλεκτός
  choice: Mteule
  alternative: Yule Aliyechaguliwa
  rationale: ‘Mteule’ ni fupi, ya heshima, na inaeleweka kama cheo, huku ikihifadhi dai la kiteolojia ndani ya kejeli bila kulifafanua zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ya kwanza imehifadhiwa kama maelezo ya mandhari; kejeli ya viongozi na marudio ya wazo la kuokoa yameachwa yaonekane wazi. Hakuna tanbihi iliyowekwa kwa sababu tofauti kati ya ‘Masihi’ na ‘Kristo’ ni uamuzi wa istilahi, si tofauti halisi ya usomaji katika matini iliyotolewa.
