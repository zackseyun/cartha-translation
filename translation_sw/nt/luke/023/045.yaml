id: LUK.23.45
reference: Luke 23:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: sw
  text: jua likakosa kutoa mwanga,[a] na pazia la hekalu likapasuka katikati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jua likatiwa giza.” Wengine hutafsiri, “jua likapatwa,” lakini hilo hutaja kwa uhakika zaidi aina ya tukio kuliko Kigiriki kinavyodai.
    reason: alternative_reading
  - marker: b
    text: Au, “likapasuka katikati hadi kuwa vipande viwili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: jua likakosa kutoa mwanga
  rationale: Kirai hiki cha hali huru katika umilikishi kinaonyesha hali iliyoambatana na tukio linalofuata. Kitenzi ἐκλείπω kinaweza kumaanisha kukoma, kushindwa, au kupungukiwa. Tafsiri hii ni ya kawaida kwa Kiswahili na inaeleza matokeo katika muktadha bila kudai kwamba lilikuwa tukio maalumu la kupatwa kwa jua.
- source_word: ἐσχίσθη
  choice: likapasuka
  rationale: Hii ni hali tendwa ya wakati uliopita ya σχίζω. Kwa kitambaa au pazia, “kupasuka” ni Kiswahili cha kawaida na huonyesha kwamba kiliraruliwa bila kutaja mtendaji.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi; “na” hudumisha uhusiano huo bila kuleta upinzani mkali.
- source_word: τὸ καταπέτασμα
  choice: pazia
  rationale: καταπέτασμα ni pazia lililotenganisha sehemu za patakatifu. “Pazia” ni neno la sasa, linaloeleweka kwa urahisi, na halihitaji msamiati wa kidhehebu.
- source_word: τοῦ ναοῦ
  choice: la hekalu
  rationale: ναός hapa huelekea kumaanisha jengo la patakatifu lenyewe, si eneo lote la hekalu. “La hekalu” ni usemi wa kawaida na unaotambulika katika muktadha huu.
- source_word: μέσον
  choice: katikati
  rationale: Neno hili linaonyesha mahali au namna ya kupasuka. “Katikati” hufuata maandishi kwa karibu bila kuongeza wazi matokeo ya “vipande viwili.”
theological_decisions:
- issue: Maana ya ἐκλιπόντος kuhusu jua
  choice: Imetafsiriwa bila istilahi ya kiufundi kuwa “jua likakosa kutoa mwanga.”
  alternative: jua likatiwa giza; jua likapatwa
  rationale: Maandishi yanaeleza kutokuwepo kwa mwanga wakati wa kifo cha Yesu, lakini hayalazimishi maelezo ya kisayansi ya kupatwa kwa jua. Tafsiri isiyo ya kiufundi huhifadhi tukio na pia upeo wa maana wa kitenzi.
- issue: Tafsiri ya καταπέτασμα
  choice: pazia
  alternative: utaji
  rationale: “Pazia” ni la kawaida na lenye heshima katika Kiswahili cha sasa. Linabeba maana ya kitambaa cha kutenganisha bila kuingiza istilahi maalumu ya mapokeo.
- issue: Maana ya μέσον
  choice: katikati
  alternative: katikati hadi kuwa vipande viwili
  rationale: Maandishi yenyewe yanasema katikati; ingawa kupasuka vipande viwili kunaeleweka kwa kawaida, tafsiri kuu haiongezi matokeo hayo kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, rahisi kueleweka, na yenye hadhi. Muundo umefanywa kuwa wa kawaida katika Kiswahili huku ukihifadhi mfuatano wa hali ya jua na kupasuka kwa pazia. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya maandishi.
