id: LUK.23.12
reference: Luke 23:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: sw
  text: Siku hiyo hiyo, Herode na Pilato wakawa marafiki[a], kwa maana hapo awali walikuwa na uadui kati yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaanza kuwa na uhusiano wa kirafiki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakihasimiana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: wakawa
  rationale: Kitenzi hiki kinaonyesha badiliko la hali ya uhusiano; “wakawa” ni Kiswahili cha kawaida na sahihi.
- source_word: φίλοι
  choice: marafiki
  rationale: Nomino hii inaeleza kuwa Herode na Pilato wakawa marafiki au washirika; “marafiki” huhifadhi usemi wa moja kwa moja wa Kigiriki.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Herode na Pilato
  rationale: Muundo wa Kigiriki unawahusisha wote wawili; kiunganishi “na” kinatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: Siku hiyo hiyo
  rationale: Kurudiwa kwa “hiyo” kunahifadhi msisitizo wa siku ile ile bila kufanya sentensi kuwa nzito.
- source_word: μετ’ ἀλλήλων
  choice: kati yao
  rationale: Katika muktadha wa uhusiano wa watu wawili, “kati yao” ni usemi wa asili unaoonyesha uhusiano wa pande zote.
- source_word: προϋπῆρχον
  choice: hapo awali walikuwa
  rationale: Kauli hii inaonyesha hali iliyoendelea kuwapo kabla ya tukio la siku hiyo; “hapo awali walikuwa” huhifadhi utofautishaji wa wakati.
- source_word: ἐν ἔχθρᾳ
  choice: na uadui
  rationale: “Uadui” huhifadhi nomino ya Kigiriki na kueleza hali ya uhasama bila kuiongezea tafsiri ya nia.
- source_word: ὄντες πρὸς αὑτούς
  choice: kati yao
  rationale: Usemi huu unaonyesha uadui wa pande zote; “kati yao” ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya badiliko la uhusiano kati ya Herode na Pilato
  choice: Maandishi yanasema wakawa marafiki siku hiyo bila kueleza ikiwa ulikuwa urafiki wa karibu au ushirika wa kisiasa.
  alternative: “Wakaanza kuwa na uhusiano wa kirafiki” linaweza kuonyesha badiliko dhaifu zaidi kuliko urafiki kamili.
  rationale: φίλοι inaweza kumaanisha marafiki au washirika katika mazingira haya. Tafsiri kuu inafuata maana ya moja kwa moja, huku tanbihi ikihifadhi uwezekano dhaifu zaidi bila kuingiza sababu ya kitheolojia au kisiasa ambayo mstari hauitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umeanza na “Siku hiyo hiyo” ili kuhifadhi msisitizo wa Kigiriki kwa njia ya asili. “Herode” na “Pilato” ni maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
