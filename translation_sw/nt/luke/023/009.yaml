  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: sw
  text: Basi akamhoji kwa muda mrefu[a], lakini yeye hakumjibu neno lolote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa maneno mengi” au “kwa maswali mengi.” Kirai cha Kigiriki kinakazia kwamba alimhoji kwa maneno mengi, yaani kwa muda mrefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: akamhoji
  rationale: Kitenzi hiki kinaonyesha kuuliza kwa kina, na hali yake ya wakati usiotimilika inaashiria tendo lililoendelea au lililorudiwa. Kirai “kwa muda mrefu” kinabeba wazi wazo hilo la kuendelea.
- source_word: δὲ
  choice: Basi ... lakini
  rationale: δὲ ya kwanza ni kiunganishi chepesi cha simulizi, kilichotafsiriwa “Basi”; ya pili inaonyesha tofauti kati ya kuhojiwa na kutokujibu, hivyo “lakini” linafaa.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: kwa muda mrefu
  rationale: Kwa neno moja moja ni kama “kwa maneno mengi,” lakini katika muktadha kirai hiki kinasisitiza urefu au wingi wa mahojiano. Tafsiri hii ni ya kawaida katika Kiswahili na haiwekei λόγοις maana finyu ya “maswali” pekee.
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi hiki kina mkazo mdogo unaomtofautisha Yesu na yule aliyekuwa akimhoji; “yeye” baada ya “lakini” kinahifadhi tofauti hiyo kwa njia ya kawaida.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: hakumjibu neno lolote
  rationale: Hii inahifadhi maana ya moja kwa moja kwamba hakumjibu chochote, huku “neno lolote” likitoa Kiswahili cha kawaida na chenye hadhi.
