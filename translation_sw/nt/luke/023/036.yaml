base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: sw
  text: Askari nao wakamdhihaki, wakimkaribia na kumtolea divai chachu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siki.” Neno la Kigiriki linamaanisha divai chachu, kinywaji cha kawaida na cha bei nafuu; kwa desturi mara nyingi limetafsiriwa “siki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: wakamdhihaki
  rationale: Kitenzi hiki kinaonyesha dhihaka ya uhasama na kudharau; “kumdhihaki” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: δὲ … καὶ
  choice: nao
  rationale: Muunganiko huu unaendeleza simulizi na kuwaongeza askari miongoni mwa waliokuwa wakimdhihaki Yesu; “nao” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: οἱ στρατιῶται
  choice: Askari
  rationale: “Askari” ndilo neno la kawaida na wazi kwa wanajeshi katika tukio hili la utekelezaji wa hukumu.
- source_word: προσερχόμενοι
  choice: walimkaribia
  rationale: Hueleza mwendo wao kuelekea karibu na Yesu. Muundo wa Kiswahili unaunganisha tendo hili kwa kawaida na tendo la kumpa kinywaji.
- source_word: ὄξος
  choice: divai chachu
  rationale: Neno hili linamaanisha divai yenye uchachu, kinywaji cha bei nafuu kilichokuwa cha kawaida. “Divai chachu” huepuka dhana ya siki ya kupikia pekee.
- source_word: προσφέροντες αὐτῷ
  choice: na kumpa
  rationale: Katika muktadha huu, walileta kinywaji hicho kwake ili anywe; “kumpa” ni ya kawaida na inawasilisha tendo bila kuongeza nia yao.
theological_decisions:
- issue: Nia ya askari walipompa Yesu ὄξος
  choice: Tendo limeelezwa ndani ya tukio la dhihaka bila kufafanuliwa kuwa huruma au ukatili wa ziada.
  alternative: Kulieleza moja kwa moja kuwa tendo la huruma, au kuwa kitendo cha kumtesa na kumkejeli pekee.
  rationale: Muktadha unaonyesha askari wakimdhihaki Yesu, lakini mstari wenyewe haufafanui zaidi nia yao katika kutoa kinywaji hicho. Tafsiri inaacha mvutano huo ubaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakamdhihaki” na “walimkaribia na kumpa” ni wazi kwa msomaji wa kawaida; “divai chachu” ni sahihi zaidi kuliko “siki” peke yake katika matumizi ya kisasa.
