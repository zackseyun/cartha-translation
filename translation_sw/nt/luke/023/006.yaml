  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: sw
  text: Lakini Pilato aliposikia hayo, akauliza kama mtu huyo ni Mgalilaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko dogo au utofautishaji katika simulizi; “Lakini” linafaa katika mwendelezo huu.
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kirai hiki cha kishiriki cha wakati uliopita kinaonyesha jambo lililotangulia swali la Pilato. “Hayo” limetolewa na muktadha ili Kiswahili kiwe cha kawaida.
- source_word: ἐπηρώτησεν
  choice: akauliza
  rationale: Kitenzi hiki humaanisha kuuliza au kuhoji; “akauliza” ni cha kawaida na kinaendeleza mfuatano wa simulizi.
- source_word: εἰ
  choice: kama
  rationale: Hutambulisha swali lisilo la moja kwa moja; “kama” ni matumizi ya kawaida katika Kiswahili.
- source_word: ὁ ἄνθρωπος
  choice: mtu huyo
  rationale: Ingawa kwa muundo ni “mtu yule/huyo,” rejeo lake tayari linajulikana katika muktadha. “Mtu huyo” ni la asili bila kumtaja Yesu moja kwa moja mahali ambapo Kigiriki hakufanyi hivyo.
- source_word: Γαλιλαῖός
  choice: Mgalilaya
  rationale: Kivumishi hiki kinapotumiwa kama kiarifu kinaonyesha utambulisho wa kikanda; nomino “Mgalilaya” ndiyo sawa ya moja kwa moja katika Kiswahili.
- source_word: ἐστιν
  choice: alikuwa
  rationale: Ingawa Kigiriki kina wakati wa sasa, Kiswahili kwa kawaida hutumia wakati uliopita katika swali lisilo la moja kwa moja baada ya kitenzi cha wakati uliopita.
