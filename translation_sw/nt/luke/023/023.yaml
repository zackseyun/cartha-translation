  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: sw
  text: Lakini wao waliendelea kusisitiza kwa sauti kubwa[a], wakitaka asulubiwe, na sauti zao zikashinda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kelele kubwa ... na kelele zao zikashinda.” Kigiriki kinarudia neno lilelile linalomaanisha “sauti,” ambalo katika muktadha huu linaweza pia kutafsiriwa “kelele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: waliendelea kusisitiza
  rationale: Kauli ya wakati usiotimilika inaonyesha shinikizo lililoendelea; “waliendelea kusisitiza” ni Kiswahili cha kawaida kinachohifadhi udumifu na msisitizo mkali wa ombi lao.
- source_word: φωναῖς μεγάλαις
  choice: kwa sauti kubwa
  rationale: Kirai hiki kinaeleza jinsi walivyosisitiza. “Kwa sauti kubwa” ni cha asili na hakifafanui kupita kiasi ikiwa sauti hizo zilikuwa vilio au kelele.
- source_word: αἰτούμενοι
  choice: wakitaka
  rationale: Katika muktadha huu wa shinikizo kwa Pilato, “wakitaka” huwasilisha ombi lao lenye nguvu bila kulifanya moja kwa moja kuwa amri; “wakiomba” lingeweza kusikika kama sala katika Kiswahili.
- source_word: αὐτὸν σταυρωθῆναι
  choice: asulubiwe
  rationale: Umbo la kutendwa limehifadhiwa kwa kiambishi cha kutendwa “-w-,” na kishazi hiki kinaeleza walichotaka afanyiwe Yesu.
- source_word: κατίσχυον
  choice: zikashinda
  rationale: Kitenzi kinaonyesha sauti zao kupata nguvu na hatimaye kutawala uamuzi. “Zikashinda” ni fupi, ya asili, na inaendana na mtiririko wa simulizi.
- source_word: αἱ φωναὶ αὐτῶν
  choice: sauti zao
  rationale: Kurudia “sauti” kunahifadhi marudio ya φωνή katika Kigiriki na kuweka mkazo juu ya nguvu ya kilio chao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku ikihifadhi marudio ya “sauti” na mwendelezo wa shinikizo katika maandishi ya Kigiriki.
