  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: sw
  text: Kwa hiyo, baada ya kumwadhibu[a], nitamwachilia huru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumtia adabu.” Kitenzi hiki kinaweza kumaanisha kutoa adhabu ya kurekebisha. Baadhi hulielewa hapa kuwa kupiga mijeledi, ingawa neno la Kigiriki lenyewe lina maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: baada ya kumwadhibu
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa maana ya wakati, ‘baada ya...’. Katika muktadha huu wa hukumu, παιδεύω ina maana ya kutoa adhabu, lakini neno lenyewe halitaji wazi aina maalumu ya adhabu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na maneno yaliyotangulia; ‘Kwa hiyo’ hudumisha nguvu hiyo ya kimantiki kwa Kiswahili cha kawaida.
- source_word: αὐτόν
  choice: kum-
  rationale: Kiambishi cha yambwa ‘-m-’ kinamrejelea Yesu kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: ἀπολύσω
  choice: nitamwachilia huru
  rationale: Katika mazingira ya kisheria na kifungo, maana ni kumweka mtu huru; ‘nitamwachilia huru’ ni usemi wa asili na ulio wazi.
theological_decisions:
- issue: Upeo wa maana ya παιδεύω katika pendekezo la Pilato
  choice: kumwadhibu
  alternative: kumtia adabu; kumpiga mijeledi
  rationale: Muktadha wa kesi unahitaji maana ya adhabu, si elimu au malezi. Tafsiri haibainishi kuwa ni kupigwa mijeledi, kwa kuwa kitenzi cha Kigiriki chenyewe kina maana pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi kama ulivyo katika chanzo, na haubainishi aina ya adhabu kuliko inavyoruhusiwa na Kigiriki.
