  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: sw
  text: Lakini Herode pia, pamoja na askari wake, walimtendea kwa dharau na kumdhihaki. Baada ya kumvika vazi la fahari[a], akamrudisha kwa Pilato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vazi linalong'aa.” Neno la Kigiriki linaweza kumaanisha lenye kung'aa au la fahari; huenda vazi hilo lilikuwa sehemu ya dhihaka kwa kumpa Yesu mwonekano wa heshima ya bandia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: alimdharau
  rationale: Kitenzi hiki kinaonyesha kumwona mtu kuwa asiye na thamani na kumtendea kwa dharau; katika muktadha huu, “alimdharau” ni usemi wa kawaida na wenye hadhi unaoonyesha fedheha ya wazi.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: pamoja na askari wake
  rationale: στράτευμα hapa inaweza kumaanisha wanajeshi au kikosi; “askari wake” ni wazi na ya asili katika simulizi.
- source_word: ἐμπαίξας
  choice: kumdhihaki
  rationale: Neno hili humaanisha kumcheka au kumfanyia mtu mzaha wa kumfedhehesha; “kumdhihaki” linafaa kwa hadhi ya simulizi la mateso.
- source_word: περιβαλὼν
  choice: akamvika
  rationale: Kirai hiki humaanisha kumwekea mtu vazi; “akamvika” ni Kiswahili cha asili na kinaonyesha wazi kwamba Herode ndiye aliyemvisha Yesu.
- source_word: ἐσθῆτα λαμπρὰν
  choice: vazi la fahari
  rationale: ἐσθής ni vazi, na λαμπρός inaweza kumaanisha lenye kung'aa, la fahari, au la kifahari. “Vazi la fahari” huhifadhi wazo la mwonekano wa heshima bila kulifanya kwa lazima kuwa joho la kifalme.
- source_word: ἀνέπεμψεν
  choice: kumrudisha
  rationale: Katika muktadha huu wa kimahakama, kitenzi kina maana ya kumpeleka tena kwa mamlaka ya awali; “kumrudisha” ni sahihi na ya kawaida.
- source_word: τῷ Πιλάτῳ
  choice: kwa Pilato
  rationale: “Pilato” ndilo umbo la kawaida la jina hili katika Kiswahili, na “kwa” linaonyesha kumrudisha mtu kwa mamlaka husika.
theological_decisions:
- issue: Maana ya dhihaka iliyohusishwa na vazi
  choice: Kutafsiri kwa namna inayohifadhi kinaya cha heshima ya bandia bila kueleza zaidi ya Kigiriki.
  alternative: Kulieleza moja kwa moja kuwa joho la kifalme, au kulihusisha hasa na wazimu au upuuzi.
  rationale: Mstari unasema wazi kwamba Yesu alidharauliwa na kudhihakiwa, hivyo vazi la fahari linaweza kuwa sehemu ya dhihaka hiyo. Hata hivyo, Kigiriki hakisemi wazi kwamba lilikuwa joho la kifalme; tafsiri haipaswi kuongeza ufafanuzi huo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” linaunganisha kwa kawaida vitendo vilivyoelezwa kwa vivumishi vya tendo vya Kigiriki, bila kuficha kwamba Herode na askari wake walihusika katika dharau na dhihaka.
