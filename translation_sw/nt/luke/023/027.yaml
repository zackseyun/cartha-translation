  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: sw
  text: Umati mkubwa wa watu ulimfuata, pamoja na wanawake waliokuwa wakijipiga vifua na kumwombolezea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: ulimfuata
  rationale: Wakati usiotimilika unaonyesha tendo lililokuwa likiendelea katika simulizi; Kiswahili cha kawaida kinaweza kutumia wakati uliopita hapa bila kupoteza mwendelezo wa tukio.
- source_word: δὲ
  choice: kiunganishi cha kuendeleza simulizi, hakikutafsiriwa kwa neno tofauti
  rationale: δὲ inaendeleza simulizi, lakini katika Kiswahili sentensi hii haihitaji kuanza na “na” au “basi.”
- source_word: αὐτῷ
  choice: -m- katika “ulimfuata”
  rationale: Kwa ἀκολουθέω, kiwakilishi hiki humrejelea Yesu kama yule aliyefuatwa.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: umati mkubwa wa watu
  rationale: Hii ni tafsiri ya kawaida na wazi ya kishazi kinachoeleza kundi kubwa la watu.
- source_word: καὶ γυναικῶν
  choice: pamoja na wanawake
  rationale: Inaonyesha kuwa wanawake walikuwa miongoni mwa waliokuwa wakifuatana naye na huandaa wazi rejeo la kiwakilishi cha kike kinachofuata.
- source_word: αἳ
  choice: waliokuwa
  rationale: Rejeo limefungamanishwa moja kwa moja na “wanawake,” kwa kuzingatia kiwakilishi cha kike cha wingi katika Kigiriki.
- source_word: ἐκόπτοντο
  choice: wakijipiga vifua
  rationale: Katika muktadha wa maombolezo, kitenzi hiki hueleza desturi ya kujipiga kifua kwa huzuni; tafsiri hii ni wazi kuliko “wakijipiga wenyewe.”
- source_word: ἐθρήνουν
  choice: kumwombolezea
  rationale: Kitenzi kinaonyesha maombolezo ya huzuni, mara nyingi yanayotolewa kwa sauti; “kumwombolezea” ni cha kawaida na chenye hadhi.
- source_word: αὐτόν
  choice: -mw- katika “kumwombolezea”
  rationale: Kiwakilishi humrejelea Yesu kama mtu ambaye wanawake walikuwa wakimwombolezea.
theological_decisions: []
