  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi wazi kwamba wanawake—si lazima umati wote—ndio waliokuwa wakijipiga vifua na kumwombolezea.
