id: LUK.7.25
reference: Luke 7:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: sw
  text: Lakini mlitoka kwenda kuona nini? Mtu aliyevaa mavazi laini?[a] Tazama, wale wanaovaa mavazi ya fahari na kuishi kwa anasa wako katika majumba ya kifalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi maridadi.” Usemi huu unarejelea nguo laini na za gharama zinazohusishwa na anasa, si udhaifu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au, “nyua za wafalme.” Kigiriki kinarejelea makao ya kifalme au mazingira ya ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi cha kupinga kinachoendeleza mfululizo wa maswali ya balagha kwa namna ya kawaida katika Kiswahili.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: mlitoka kwenda kuona nini?
  rationale: Muundo huu unaonyesha tendo la wakati uliopita na kusudi la kutoka, huku ukibaki swali la kawaida na linaloeleweka.
- source_word: ἄνθρωπον
  choice: Mtu
  rationale: Katika muktadha huu nomino inamtaja mwanamume mmoja, lakini ‘mtu’ ni ya asili katika swali hili na haifuti rejeo la kimuktadha kwa Yohana.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: aliyevaa mavazi laini
  rationale: Huhifadhi picha halisi ya mavazi laini na maridadi yanayohusishwa na maisha ya anasa, bila kuingiza maana ya udhaifu wa kimaadili.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno la kuvuta uangalifu kwa mtindo wenye hadhi lakini unaoeleweka katika Kiswahili cha Biblia.
- source_word: οἱ ... ὑπάρχοντες
  choice: wale ... wanaovaa ... na kuishi
  rationale: Muundo wa Kiswahili unaunganisha hali mbili zinazotajwa—mavazi ya fahari na maisha ya anasa—kwa uwazi wa kawaida.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: wanaovaa mavazi ya fahari
  rationale: ‘Ya fahari’ huwasilisha uzuri wa gharama na hadhi ya kijamii inayodokezwa na ἐνδόξῳ.
- source_word: τρυφῇ
  choice: kuishi kwa anasa
  rationale: Huwasilisha si vitu vya kifahari pekee bali hali au mtindo wa maisha ya starehe na anasa.
- source_word: ἐν τοῖς βασιλείοις
  choice: katika majumba ya kifalme
  rationale: Huwasilisha makao au mazingira ya kifalme na kuhifadhi wingi wa nomino ya Kigiriki.
theological_decisions:
- issue: Maana ya μαλακοῖς katika muktadha
  choice: Mavazi laini na maridadi yanayohusishwa na anasa
  alternative: Mavazi yanayoashiria udhaifu au uanamke
  rationale: Muktadha unatofautisha maisha makali ya jangwani na maisha ya kifahari ya kifalme; hauwasilishi hukumu kuhusu uanamke au udhaifu wa kimaadili.
- issue: Mazingira yanayotajwa na βασιλείοις
  choice: majumba ya kifalme
  alternative: nyua za wafalme
  rationale: Neno linaweza kuelekeza kwenye makao ya kifalme au mazingira ya ikulu; tafsiri kuu inatumia usemi mpana na wa kawaida, huku dokezo likihifadhi uwezekano wa ‘nyua za wafalme.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha yamehifadhiwa, na msamiati umechaguliwa ili ueleweke kwa wasomaji wa kawaida bila kupoteza picha ya mavazi ya kifahari na mazingira ya kifalme.
