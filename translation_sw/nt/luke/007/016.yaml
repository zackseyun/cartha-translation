base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: sw
  text: Hofu ikawashika wote, nao wakawa wakimtukuza Mungu, wakisema, “Nabii mkuu ametokea miongoni mwetu[a], na Mungu amewatembelea[b] watu wake.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameinuliwa miongoni mwetu,” ikikazia kwamba Mungu ndiye aliyemwinua nabii huyo.
    reason: lexical_alternative
  - marker: b
    text: Hapa “amewatembelea” ni lugha ya kibiblia inayomaanisha kwamba Mungu amewajia watu wake kwa uangalifu na kujali.
    reason: cultural_note
  - marker: c
    text: 'Au maneno hayo yanaweza kuakifishwa hivi: “Nabii mkuu ametokea miongoni mwetu,” na, “Mungu amewatembelea watu wake.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: Hofu ikawashika wote
  rationale: Hii ni Kiswahili cha kawaida kinachohifadhi taswira ya hofu kuwakamata watu wote kwa ghafla. Neno “hofu” linadumisha mvutano wa maana ya φόβος bila kuifasiri moja kwa moja kuwa kicho tu.
- source_word: δὲ
  choice: nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole; “nao” huunganisha tendo linalofuata kwa Kiswahili cha asili bila kusisitiza mno mfuatano wa wakati.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: wakaendelea kumtukuza Mungu
  rationale: Kauli hii inaonyesha tendo lililoendelea, kulingana na hali ya kitenzi cha Kigiriki. “Kumtukuza” huhifadhi maana ya δοξάζω kwa karibu zaidi kuliko “kumsifu” peke yake.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha kwa ufupi na kwa kawaida maneno ambayo kwayo walimtukuza Mungu.
- source_word: Προφήτης μέγας
  choice: Nabii mkuu
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye heshima ya usemi huu.
- source_word: ἠγέρθη
  choice: ametokea
  rationale: Katika muktadha wa nabii, “ametokea” ni Kiswahili cha kawaida kinachomaanisha kwamba nabii ameinuka au amejitokeza kati ya watu. Uwezekano wa maana ya kutokezwa au kuinuliwa na Mungu umehifadhiwa katika tanbihi.
- source_word: ἐν ἡμῖν
  choice: miongoni mwetu
  rationale: Huwasilisha wazi maana ya kuwepo kwa nabii katikati ya jumuiya hiyo.
- source_word: Ἐπεσκέψατο
  choice: amewatembelea
  rationale: Huhifadhi lugha ya kibiblia ya Mungu kuja kwa watu wake akiwaelekea kwa uangalifu na kwa kusudi, bila kuibana maana kuwa msaada au wokovu pekee.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida ya θεός.
- source_word: τὸν λαὸν αὐτοῦ
  choice: watu wake
  rationale: Ni Kiswahili cha asili kinachohifadhi pia mwangwi wa uhusiano wa Mungu na watu walio wake.
theological_decisions:
- issue: Maana ya φόβος baada ya muujiza
  choice: hofu
  alternative: kicho
  rationale: “Hofu” hudumisha nguvu na mvutano wa neno la Kigiriki. Muktadha unaweza kuonyesha hofu yenye kicho, lakini tafsiri haipaswi kuamua hilo kimyakimya.
- issue: Maana ya ἠγέρθη kuhusu nabii
  choice: ametokea
  alternative: ameinuliwa
  rationale: “Ametokea” ni ya asili kwa Kiswahili katika usemi kuhusu nabii aliyejitokeza, huku tanbihi ikihifadhi uwezekano wa kauli tendwa unaodokeza tendo la Mungu.
- issue: Maana ya Ἐπεσκέψατο kama tendo la Mungu
  choice: amewatembelea
  alternative: amewajia ili kuwasaidia
  rationale: “Amewatembelea” huhifadhi taswira pana ya kibiblia ya ujio wa Mungu kwa uangalifu na kusudi, badala ya kuifafanua mapema kuwa aina moja tu ya msaada.
- issue: Uhusiano wa vifungu viwili vinavyoanza na ὅτι
  choice: vimewasilishwa kama tamko moja lililounganishwa kwa “na”
  alternative: vimewasilishwa kama matamko mawili tofauti
  rationale: Kigiriki kinaweza kuakifishwa kama maudhui mawili sambamba ya walichokuwa wakisema. Tamko moja ni la kawaida zaidi kwa Kiswahili, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakaendelea kumtukuza” hutiririsha vizuri hali ya tendo linaloendelea; “ametokea miongoni mwetu” ni ya kawaida kwa wasomaji wengi, huku tanbihi zikihifadhi utata wa kauli tendwa na maana pana ya lugha ya kutembelea kwa Mungu.
