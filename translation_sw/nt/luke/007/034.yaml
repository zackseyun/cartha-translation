  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: sw
  text: Mwana wa Adamu amekuja akila na kunywa, nanyi mnasema, “Tazama, mtu mlafi na mlevi, rafiki wa watoza ushuru na wenye dhambi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: amekuja
  rationale: Kauli timilifu inaonyesha kwamba amekuja na hali hiyo ina umuhimu wa sasa; Kiswahili ‘amekuja’ huwasilisha nguvu hiyo kwa kawaida.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya jina hili la kujitaja kwa Yesu na inadumisha mwangwi wake wa kiunabii na wa Kikristo bila kulifafanua kupita kiasi.
- source_word: ἐσθίων καὶ πίνων
  choice: akila na kunywa
  rationale: Vitenzi hivi tegemezi vinaeleza namna iliyoambatana na kuja kwake; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati uliopo na nafsi ya pili wingi vinawakilishwa moja kwa moja na kwa kawaida.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Linadumisha nguvu ya kuonyesha na kushangaa ya neno la Kigiriki kwa lugha yenye heshima na inayotambulika.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Neno limetajwa wazi katika chanzo na Kiswahili linaweza kulihifadhi kwa kawaida katika mfululizo huu wa shutuma.
- source_word: φάγος
  choice: mlafi
  rationale: Ni nomino ya kawaida yenye maana ya kula kupita kiasi na inadumisha ukali wa shutuma.
- source_word: οἰνοπότης
  choice: mnywaji wa divai
  rationale: Hufuata maana ya moja kwa moja ya nomino ya Kigiriki, ‘mnywaji wa divai,’ huku muktadha wa shutuma ukitoa maana hasi bila kulazimisha tafsiri mahususi zaidi ya ‘mlevi.’
- source_word: φίλος
  choice: rafiki
  rationale: Nomino hii inaingia kwa kawaida katika mfululizo wa maelezo bila kuhitaji kibainishi katika Kiswahili.
- source_word: τελωνῶν
  choice: watoza ushuru
  rationale: Ni tafsiri ya kawaida, ya sasa, na iliyo wazi kwa maafisa au wakandarasi waliokusanya ushuru.
- source_word: ἁμαρτωλῶν
  choice: wenye dhambi
  rationale: Inadumisha lebo ya kijamii na kidini iliyotumiwa na wapinzani, kwa Kiswahili cha kawaida na chenye kueleweka.
theological_decisions:
- issue: Tafsiri ya jina ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: ‘Mwana wa Adamu’ ni jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili na linahifadhi uzito wake kama jina la Yesu pamoja na uwezekano wa mwangwi wa Danieli, bila kuligeuza kuwa maelezo ya kawaida tu kuhusu ubinadamu.
- issue: Nguvu ya shutuma οἰνοπότης
  choice: mnywaji wa divai
  alternative: mlevi
  rationale: Chanzo kinasema kihalisi mtu anayekunywa divai, katika muktadha wa kashfa. Tafsiri hii inadumisha shutuma na pia kuepuka kuamua kimya kimya kwamba neno lenyewe lazima limaanishe utegemezi wa pombe au ulevi wa kudumu.
- issue: Hali ya kauli dhidi ya Yesu
  choice: imewasilishwa kama maneno ya wapinzani
  alternative: maelezo ya msimulizi kuhusu tabia ya Yesu
  rationale: Alama za usemi wa moja kwa moja na ‘mnasema’ zinaweka wazi kuwa hizi ni shutuma zinazonukuliwa, si hukumu ya msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi mlingano kati ya kuja kwa Mwana wa Adamu, namna yake ya kula na kunywa, na shutuma kali zinazofuata. Hakuna tanbihi inayohitajika kwa kuwa tafsiri ya moja kwa moja ya ἄνθρωπος na οἰνοπότης inasomeka kwa kawaida katika matini kuu.
