  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: sw
  text: Nao wale waliokuwa wameegemea mezani pamoja naye wakaanza kusema wao kwa wao[a], “Huyu ni nani hata anasamehe dhambi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaanza kusema mioyoni mwao.” Usemi wa Kigiriki unaweza kumaanisha kutafakari kwa faragha au kuzungumza miongoni mwa wageni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Muundo wa ἄρχω pamoja na kitenzi-jina unaonyesha mwanzo wa tendo; “wakaanza” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo.
- source_word: οἱ συνανακείμενοι
  choice: wale waliokuwa wameegemea mezani pamoja naye
  rationale: Kirai hiki kinarejelea wageni waliokula pamoja na Yesu kwa desturi ya kale ya kuegemea mezani; tafsiri hii huhifadhi mazingira ya mlo na maana ya kushiriki pamoja.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: kusemezana wao kwa wao
  rationale: Nahau hiyo inaweza kumaanisha kusema ndani ya nafsi zao au kuzungumza miongoni mwao. Kwa kuwa wahusika ni wengi, “kusemezana wao kwa wao” inafaa katika mazingira haya bila kuondoa uwezekano wa tafakari ya faraghani, ambao umeonyeshwa katika tanbihi.
- source_word: Τίς οὗτός ἐστιν
  choice: Huyu ni nani
  rationale: Kigiriki hakina neno “mtu”; muundo mfupi huhifadhi ukali na mshangao wa swali.
- source_word: καὶ
  choice: hata
  rationale: Hapa καί ina nguvu ya kupandisha mshangao; “hata” huonyesha kwamba wageni walishangazwa na kufikia kwake hatua ya kusamehe dhambi.
- source_word: ἁμαρτίας ἀφίησιν
  choice: anasamehe dhambi
  rationale: Katika muktadha huu ἀφίημι ni usemi wa kawaida wa kuondoa hatia ya dhambi; “anasamehe dhambi” ni tafsiri wazi, ya asili, na yenye uzito unaofaa.
theological_decisions:
- issue: Dokezo la mamlaka ya Yesu ya kusamehe dhambi
  choice: 'Kuhifadhi swali la wageni bila kulifafanulia hitimisho: “Huyu ni nani hata anasamehe dhambi?”'
  alternative: Huyu ni mtu gani, ambaye hata anasamehe dhambi?
  rationale: Mstari unaibua swali kuhusu utambulisho na mamlaka ya Yesu lakini hautoi jibu la moja kwa moja. Tafsiri huhifadhi mshangao na mvutano huo wa kiteolojia bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuegemea mezani” huhifadhi mazingira ya kihistoria ya mlo; “kusemezana wao kwa wao” ni ya kawaida na inaonyesha mawasiliano ya kundi, huku tanbihi ikihifadhi utata wa Kigiriki.
