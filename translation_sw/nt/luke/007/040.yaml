  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: sw
  text: Yesu akajibu, akamwambia, “Simoni, nina jambo la kukuambia.” Naye akasema, “Mwalimu, sema.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana, sema.” Neno la Kigiriki Διδάσκαλε kwa maana ya moja kwa moja zaidi ni “Mwalimu,” na εἰπέ ni “sema” au “nena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Kitenzi hiki cha kisimulizi kinaonyesha kwamba Yesu aliitikia hali au mawazo ya Simoni. “Akajibu” huhifadhi mtindo wa Kigiriki bila kudai kwamba Simoni alikuwa ametamka swali.
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamwambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya λέγω pamoja na πρὸς na yambwa katika Kiswahili cha kisimulizi.
- source_word: Σίμων
  choice: Simoni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: nina jambo la kukuambia
  rationale: Husema kwa Kiswahili cha kawaida kwamba Yesu ana jambo analotaka kumweleza Simoni, huku ikiwakilisha σοί waziwazi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo maana ya moja kwa moja ya διδάσκαλος, yaani mtu anayefundisha; haliongezi wazo lenye nguvu zaidi la mamlaka lililo katika tafsiri kama “Bwana” au “Mkuu.”
- source_word: εἰπέ
  choice: sema
  rationale: Amri hii fupi inaomba Yesu aendelee kusema. Kiswahili “sema” huhifadhi ufupi na uwazi wa Kigiriki bila kulazimika kuongeza yambwa lisilotajwa.
- source_word: φησίν
  choice: akasema
  rationale: Ingawa Kigiriki kimetumia wakati uliopo wa kihistoria, wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akajibu, akamwambia” huhifadhi vitenzi viwili vya Kigiriki kwa namna inayoeleweka; “nina jambo la kukuambia” ni ya asili zaidi kuliko tafsiri ya neno kwa neno. Alama ya tanbihi imewekwa baada ya kauli inayohusika.
