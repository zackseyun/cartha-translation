id: LUK.7.8
reference: Luke 7:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: sw
  text: Kwa maana mimi pia ni mtu niliyewekwa chini ya mamlaka, nami nina askari walio chini yangu. Namwambia huyu, ‘Nenda,’ naye huenda; na mwingine, ‘Njoo,’ naye huja; na mtumwa wangu[a], ‘Fanya hivi,’ naye hufanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘mtumishi.’ Neno la Kigiriki doulos humaanisha mtu aliye chini ya mwingine katika hali ya utumwa au umiliki, ingawa katika baadhi ya miktadha linaweza kutafsiriwa kwa maana ya jumla zaidi kuwa ‘mtumishi.’
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: ‘Kwa maana’ hudumisha nguvu ya γάρ ya kutoa sababu, huku ‘hata’ ikiwakilisha καί na kuonyesha ulinganisho wa akida na hali anayozungumzia.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: niliyewekwa chini ya mamlaka
  rationale: Kauli hii huhifadhi hali ya kutendwa katika τασσόμενος na wazo la nafasi iliyopangwa ndani ya mlolongo wa mamlaka.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: nami nina askari walio chini yangu
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi wazi uhusiano wa mamlaka bila kuongeza ‘chini ya amri yangu,’ jambo ambalo lingekuwa la kufasiri zaidi.
- source_word: λέγω τούτῳ
  choice: Namwambia huyu
  rationale: ‘Huyu’ huhifadhi nguvu ya kiashiria cha τούτῳ na mtindo wa mfano unaofuata.
- source_word: Πορεύθητι / πορεύεται
  choice: ‘Nenda,’ naye huenda
  rationale: Amri na itikio lake zimetafsiriwa kwa maneno mepesi na yanayolingana; hali ya mazoea ya wakati wa sasa imewasilishwa kwa ‘huenda.’
- source_word: Ἔρχου / ἔρχεται
  choice: ‘Njoo,’ naye huja
  rationale: Huhifadhi usambamba wa amri na utekelezaji wake kwa Kiswahili cha kawaida.
- source_word: τῷ δούλῳ μου
  choice: mtumwa wangu
  rationale: δοῦλος humaanisha mtu aliye katika hali ya kumilikiwa au kufungwa chini ya mwingine. Kwa kuwa uhusiano wa mamlaka ni muhimu katika mfano huu, ‘mtumwa’ huhifadhi hali hiyo kuliko ‘mtumishi.’
- source_word: Ποίησον τοῦτο / ποιεῖ
  choice: ‘Fanya hivi,’ naye hufanya
  rationale: ‘Hivi’ ni ya asili katika amri ya Kiswahili na huwasilisha τοῦτο bila kuongeza jambo lisilokuwamo katika chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri δοῦλος katika mfano wa akida
  choice: mtumwa
  alternative: mtumishi
  rationale: Aya haitoi fundisho kuhusu utumwa, lakini hadhi ya kuwa chini ya mamlaka ni sehemu kuu ya mfano. ‘Mtumwa’ huonyesha wazi zaidi hali ya kijamii ya δοῦλος, huku ‘mtumishi’ ikiwekwa katika tanbihi kama tafsiri mbadala inayowezekana kulingana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi huhifadhi mlolongo wa mamlaka na usambamba wa amri na utekelezaji, huku ‘huenda/huja/hufanya’ ukionyesha matokeo ya kawaida au yanayotarajiwa.
