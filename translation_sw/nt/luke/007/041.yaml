base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: sw
  text: Watu wawili walikuwa wadaiwa wa mkopeshaji fulani wa fedha. Mmoja alimdai dinari mia tano[a], na mwingine dinari hamsini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa sarafu ya fedha ya Roma, ambayo kwa kawaida ilikuwa sawa na ujira wa takribani siku moja wa mfanyakazi.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: watu wawili walikuwa na deni
  rationale: Huwataja watu wenye deni; muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa kuliko nomino nzito kama “wadeni wawili”.
- source_word: δανιστῇ τινι
  choice: kwa mkopeshaji fulani wa fedha
  rationale: δανιστής ni mtu anayekopesha fedha, na τινι humtambulisha mhusika fulani asiyepewa jina.
- source_word: ὤφειλεν
  choice: alikuwa na deni la
  rationale: Wakati usiotimilifu unaeleza hali ya deni iliyokuwapo; muundo huu ni wa asili katika Kiswahili.
- source_word: δηνάρια
  choice: dinari
  rationale: Huhifadhi jina la kihistoria la sarafu au kipimo cha fedha badala ya kulibadili kuwa sarafu ya jumla au thamani ya kisasa.
- source_word: πεντακόσια
  choice: mia tano
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo katika Kiswahili.
- source_word: ἕτερος
  choice: mwingine
  rationale: Huwiana kwa kawaida na “mmoja” katika utofautishaji wa watu wawili.
- source_word: πεντήκοντα
  choice: hamsini
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo; “dinari” imerudiwa kwa uwazi wa kawaida katika Kiswahili.
