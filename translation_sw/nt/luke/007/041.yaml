translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi ya kihistoria “dinari” imehifadhiwa na kufafanuliwa katika tanbihi.
