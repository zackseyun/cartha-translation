base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: sw
  text: Na tazama, mwanamke mmoja aliyekuwa katika mji ule, mwenye dhambi,[a] baada ya kupata habari kwamba Yesu alikuwa ameelemea mezani[b] nyumbani kwa yule Farisayo, alileta chupa ya alabasta yenye manukato.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema tu “mwenye dhambi” na hakibainishi dhambi yake.
    reason: lexical_alternative
  - marker: b
    text: Yaani, alikuwa ameegemea mezani kulingana na desturi ya kula mlo rasmi wakati huo.
    reason: cultural_note
  - marker: c
    text: Au “chupa ya alabasta yenye mafuta yenye harufu nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi kazi ya neno hili kama kiashiria cha simulizi kinachovuta usikivu na kuingiza jambo la kushangaza kwa mtindo wa kawaida wa Kiswahili cha Biblia.
- source_word: γυνὴ
  choice: mwanamke
  rationale: Muktadha unaonyesha maana ya kawaida ya mwanamke, si mke.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: kulikuwa na mwanamke katika mji ule, ambaye
  rationale: Inadumisha wazo la kuwa ndani ya mji bila kulipanua kuwa 'aliyeishi' au 'aliyetoka' humo, mambo ambayo Kigiriki hakisemi wazi.
- source_word: ἁμαρτωλός
  choice: mwenye dhambi
  rationale: Inadumisha sifa ya jumla ya mwanamke kuwa mwenye dhambi bila kubainisha aina ya dhambi yake.
- source_word: ἐπιγνοῦσα
  choice: alipopata habari
  rationale: Ni usemi wa asili unaoonyesha kwamba alikuja kujua jambo hilo kabla ya kuleta chupa.
- source_word: κατάκειται
  choice: alikuwa ameketi mezani
  rationale: Katika Kiswahili cha kawaida, usemi huu unaeleza kushiriki mlo kwa uwazi; tanbihi inafafanua kwamba desturi ya wakati huo ilikuwa kuegemea mezani.
- source_word: ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου
  choice: nyumbani kwa yule Farisayo
  rationale: Ni muundo wa kawaida wa Kiswahili unaohifadhi rejeo la Farisayo husika.
- source_word: κομίσασα
  choice: alileta
  rationale: Inatoa kwa kifupi na kwa kawaida tendo kuu la kuja na kitu hicho.
- source_word: ἀλάβαστρον μύρου
  choice: chupa ya alabasta yenye manukato
  rationale: Inahifadhi aina ya chombo na yaliyomo kwa lugha inayoeleweka; 'manukato' yanaweza kurejelea mafuta au marhamu yenye harufu nzuri.
theological_decisions:
- issue: Sifa ya kimaadili ya mwanamke
  choice: mwenye dhambi
  alternative: mwanamke mwenye maisha maovu; kahaba
  rationale: Kigiriki kinamwita ἁμαρτωλός lakini hakitaji dhambi yake. Tafsiri haimtambui kuwa kahaba wala kuingiza aina fulani ya uasherati ambayo haijasemwa.
- issue: Mhusika wa kiume katika ὅτι κατάκειται
  choice: Yesu
  alternative: alikuwa ameketi mezani
  rationale: Kiswahili kinahitaji rejeo lililo wazi zaidi kuliko kiwakilishi kisicho na mtangulizi ndani ya mstari huu; muktadha wa karibu unamtambulisha wazi kuwa Yesu, bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa kwa mtiririko wa asili. 'Tazama' huhifadhi msisitizo wa kisimulizi; 'yule Farisayo' hutoa rejeo mahususi kwa njia ya kawaida. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
