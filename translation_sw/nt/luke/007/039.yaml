  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: sw
  text: Yule Farisayo aliyemwalika Yesu alipoona hayo, alisema moyoni mwake, “Kama mtu huyu angekuwa nabii, angejua huyo mwanamke anayemgusa ni nani na ni wa aina gani[a], kwamba yeye ni mwenye dhambi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani na ni mwanamke wa aina gani.” Maneno haya hukazia utambulisho wa mwanamke huyo na tabia au sifa yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu yeye ni mwenye dhambi.” Kifungu hiki kinaweza kueleweka kuwa jambo ambalo angejua au sababu ya tathmini ya Farisayo kuhusu mwanamke huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: alipoona hayo
  rationale: Kishiriki cha aoristi kinaonyesha mazingira ya wakati ya kitenzi kikuu; “hayo” hurejelea kwa kawaida kitendo kilichotangulia. δέ huendeleza simulizi bila kulazimisha kiunganishi tofauti.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: Yule Farisayo aliyekuwa amemwalika Yesu
  rationale: Katika muktadha wa chakula, καλέω humaanisha kumwalika. Jina “Yesu” limetumiwa badala ya kiwakilishi ili kuondoa utata wa mlolongo wa viwakilishi katika Kiswahili.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: alisema moyoni mwake
  rationale: Hii ni nahau ya usemi wa ndani; Kiswahili hiki ni cha kawaida na huhifadhi wazo la kusema bila sauti.
- source_word: Οὗτος
  choice: mtu huyu
  rationale: Huonyesha namna Farisayo anavyojitenga na Yesu, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: Kama mtu huyu angekuwa nabii, angejua
  rationale: Muundo wa “ange- ... ange-” huwasilisha sharti linalopingana na dhana ya msemaji.
- source_word: τίς καὶ ποταπὴ
  choice: ni mwanamke gani na wa aina gani
  rationale: 'Huhifadhi vipengele vyote viwili: utambulisho wake na tabia au sifa yake.'
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: huyu anayemgusa
  rationale: Wakati wa sasa wa ἅπτεται unaonyesha mguso unaoendelea katika tukio.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: kwamba yeye ni mwenye dhambi
  rationale: “Kwamba” huhifadhi uwezekano wa kifungu kuwa maudhui ya kile ambacho nabii angejua; tanbihi pia inaonyesha uwezekano wa maana ya sababu.
theological_decisions:
- issue: Nguvu ya sharti kuhusu Yesu kuwa nabii
  choice: Kama mtu huyu angekuwa nabii, angejua
  alternative: Kama mtu huyu ni nabii, angejua
  rationale: εἰ ἦν pamoja na ἐγίνωσκεν ἂν kwa kawaida huonyesha sharti lisilo halisi kulingana na dhana ya Farisayo. Tafsiri inadumisha mashaka yake bila kuyathibitisha kuwa kweli.
- issue: Uhusiano wa ὅτι ἁμαρτωλός ἐστιν na kauli iliyotangulia
  choice: kwamba yeye ni mwenye dhambi
  alternative: kwa sababu yeye ni mwenye dhambi
  rationale: Kifungu kinaweza kusikika kama maudhui ya kile ambacho Yesu angejua au kama sababu ya tathmini ya Farisayo; maandishi makuu na tanbihi yanahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwenye dhambi” ni ya kawaida na inayoeleweka; muundo wa sentensi umewekwa wazi bila kuondoa utata halisi wa ὅτι.
