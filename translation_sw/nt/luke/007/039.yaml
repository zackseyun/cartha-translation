  to: Yule Farisayo aliyemwalika Yesu alipoona hayo, alisema moyoni mwake, “Kama mtu huyu angekuwa nabii, angejua huyo mwanamke anayemgusa ni nani na ni wa aina gani[a], kwamba yeye ni mwenye dhambi.[b]”
