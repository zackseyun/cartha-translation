id: LUK.7.9
reference: Luke 7:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: sw
  text: Yesu aliposikia mambo hayo, alimstaajabia mtu huyo. Kisha akaugeukia umati uliokuwa ukimfuata, akasema, “Ninawaambia, hata katika Israeli sijapata imani ya namna hii[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imani kubwa namna hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Yesu aliposikia mambo hayo
  rationale: Kirai cha wakati chenye kitenzi cha wakati uliopita kinatolewa kwa muundo wa kawaida wa Kiswahili, huku δέ ikiachwa kudokezwa kama mpito mwepesi wa simulizi.
- source_word: ἐθαύμασεν αὐτόν
  choice: alimstaajabia mtu huyo
  rationale: ‘Kumstaajabia’ huonyesha mshangao wenye kuvutiwa; ‘mtu huyo’ huweka wazi kuwa kiwakilishi kinamrejelea yule jemadari bila kurudia cheo chake.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: Kisha akaugeukia umati uliokuwa ukimfuata
  rationale: Muundo huu ni wa kawaida katika simulizi la Kiswahili na unahifadhi tendo la kugeuka pamoja na hali endelevu ya umati kumfuata Yesu.
- source_word: Λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Huu ni usemi wa moja kwa moja na wa sasa unaowaelekea watu wengi, kama ilivyo katika Kigiriki.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: hata katika Israeli
  rationale: ‘Hata’ pamoja na kauli hasi ya ‘sijapata’ huwasilisha nguvu ya οὐδέ, yaani ‘si hata katika Israeli.’
- source_word: τοσαύτην πίστιν
  choice: imani ya namna hii
  rationale: ‘Imani’ ni maana inayofaa ya πίστις hapa, na ‘ya namna hii’ huhifadhi wazo la kiwango au sifa inayosisitizwa na τοσαύτην bila kulifunga kwa tafsiri moja tu.
- source_word: εὗρον
  choice: sijapata
  rationale: Kauli timilifu hasi ya Kiswahili inaeleza kwamba Yesu hajakutana na imani kama hiyo hadi wakati wa kusema.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini au kumwamini Yesu
  rationale: Muktadha unaonyesha kutegemea mamlaka ya Yesu. ‘Imani’ huhifadhi istilahi pana ya Agano Jipya bila kuigeuza kuwa sifa ya uaminifu wa jemadari.
- issue: Kiwango kinachoonyeshwa na τοσαύτην
  choice: imani ya namna hii
  alternative: imani kubwa namna hii
  rationale: Kigiriki kinaweza kusisitiza aina, kiwango, au ukubwa wa imani. Matini kuu huhifadhi upana huo, huku footnote ikitoa tafsiri ya wazi zaidi ya kiwango.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. ‘Umati’ na ‘alimstaajabia’ vinafaa kwa matini ya Biblia bila kuwa vya kizamani. Alama ya footnote imewekwa moja kwa moja baada ya kirai kinachohusika.
