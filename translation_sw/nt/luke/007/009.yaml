  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: participle ya wakati («aliposikia»), mshangao wa Yesu kwa jemadari, kuugeukia umati uliokuwa ukimfuata, na kauli ya kulinganisha kwamba hata ndani ya Israeli Yesu hajapata imani ya kiwango hiki. Kauli «sijapata» inafaa kueleza uzoefu hadi wakati wa kutamka, ingawa εὗρον ni aoristi.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na cha masimulizi ya Kibiblia. «Alimstaajabia mtu huyo» na «akaugeukia umati uliokuwa ukimfuata» ni miundo ya kawaida na iliyo wazi. «Imani ya namna hii» husikika asilia katika muktadha huu.
  terminology: «Yesu», «Israeli», «umati», na «imani» ni istilahi zinazofaa. «Imani» huhifadhi πίστις bila kuifungamanisha kwa tafsiri finyu ya «tumaini» au «uaminifu». Tanbihi imefungwa vizuri baada ya kirai kinachoelezwa na hutoa mbadala halali wa kiwango cha τοσαύτην.
