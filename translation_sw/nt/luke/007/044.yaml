  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: sw
  text: Naye akamgeukia yule mwanamke, akamwambia Simoni, “Unamwona mwanamke huyu? Niliingia nyumbani mwako; hukunipa maji kwa ajili ya miguu yangu[a], lakini yeye aliilowanisha miguu yangu kwa machozi yake na akazifuta kwa nywele zake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na Kigiriki, “hukunipa maji kwenye miguu yangu.” Maana yake ni desturi ya kumpa mgeni maji ya kuosha miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: akamgeukia yule mwanamke
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa uwazi kwamba Yesu aligeuza mwelekeo wake kuelekea mwanamke kabla ya kusema.
- source_word: τῷ Σίμωνι ἔφη
  choice: akamwambia Simoni
  rationale: Hii ni tafsiri ya kawaida ya kisimulizi ya kitenzi ἔφη, huku mtendewa Simoni akitajwa wazi.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Unamwona mwanamke huyu?
  rationale: Inahifadhi swali la moja kwa moja na nguvu ya kielekezi ταύτην, ambacho kinamwelekeza Simoni kwa mwanamke aliyepo hapo.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Niliingia nyumbani mwako
  rationale: ‘Nyumbani mwako’ ni Kiswahili cha asili kwa οἰκίαν katika muktadha wa mwenyeji anayempokea mgeni.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: hukunipa maji kwa ajili ya miguu yangu
  rationale: Inataja maji na kusudi lake bila kuongeza wazi kitendo cha kuosha, ambacho hakisemwi moja kwa moja katika Kigiriki.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: amelowanisha miguu yangu kwa machozi yake
  rationale: ‘Amelowanisha’ huwasilisha maana ya βρέχω kwa ufasaha; wakati timilifu wa Kiswahili unaonyesha tendo lililotokea na matokeo yake yanayoonekana katika tukio.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: kuifuta kwa nywele zake
  rationale: ‘Kuifuta’ ni usemi wa kawaida unaorejelea miguu kama sehemu moja ya mwili, na ‘kwa nywele zake’ huhifadhi njia iliyotumiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inabaki karibu na mpangilio wa Kigiriki lakini inatumia miundo ya kawaida ya kisimulizi ya Kiswahili. Kiunganishi ‘lakini’ cha kwanza kinaweka tofauti inayodokezwa na mfuatano wa kauli; cha pili kinawakilisha δέ na kusisitiza tofauti kati ya Simoni na mwanamke.
