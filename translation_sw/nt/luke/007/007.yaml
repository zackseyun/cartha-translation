  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: sw
  text: Kwa hiyo, hata mimi sikujiona kuwa ninastahili kuja kwako. Lakini sema neno, naye mtumishi wangu aponywe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mvulana wangu” au “mtoto wangu”; neno la Kigiriki linaweza kumaanisha mtoto, mvulana, au mtumishi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: οὐδὲ
  choice: hata ... siku-
  rationale: 'Muundo huu unasisitiza ukanushi: hakujiona hata kuwa anastahili kwenda mwenyewe.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: mimi sikujiona kuwa ninastahili
  rationale: Huhifadhi maana ya kujihesabu au kujiona mwenye kustahili, pamoja na msisitizo wa kiwakilishi nafsi.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: kuja kwako
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kumkaribia Yesu binafsi.
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Hutanguliza ombi linalotofautiana na kauli iliyotangulia.
- source_word: εἰπὲ λόγῳ
  choice: sema neno tu
  rationale: Hutoa kwa Kiswahili cha asili wazo la kusema neno lenye mamlaka; “tu” huonyesha kwamba kusema pekee kunatosha bila kudai kuwapo kwa kibainishi katika Kigiriki.
- source_word: ἰαθήτω
  choice: na aponywe
  rationale: Huhifadhi hali ya amri ya nafsi ya tatu na sauti tendwa, badala ya kuibadili kuwa taarifa ya wakati ujao.
- source_word: ὁ παῖς μου
  choice: mtumishi wangu
  rationale: Katika simulizi la mkuu wa jeshi, uhusiano wa mamlaka unaunga mkono maana ya mtumishi, huku maana nyingine halisi zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya παῖς katika simulizi la mkuu wa jeshi
  choice: mtumishi wangu
  alternative: mvulana wangu; mtoto wangu
  rationale: Neno hilo lina wigo mpana, lakini muktadha wa mtu aliye chini ya mamlaka ya mkuu wa jeshi unapendelea “mtumishi.” Tanbihi inalinda uwezekano wa maana ya umri au ukaribu bila kuingiza hitimisho lisilo wazi katika maandishi.
- issue: Nguvu ya kisarufi ya ἰαθήτω
  choice: na aponywe
  alternative: ataponywa
  rationale: Kitenzi cha Kigiriki ni amri tendwa ya nafsi ya tatu, si taarifa ya wakati ujao; tafsiri inahifadhi ombi lenye nguvu ya amri bila kulifanya kuwa utabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “sema neno tu” ni wa kawaida na unaonyesha imani katika mamlaka ya usemi wa Yesu; “na aponywe” huhifadhi amri tendwa ya Kigiriki.
