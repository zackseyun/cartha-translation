  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: sw
  text: Alipomaliza kusema maneno yake yote watu wakimsikia, aliingia Kapernaumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Baada ya
  rationale: Katika muktadha huu kiunganishi kinaonyesha mfuatano wa wakati, si sababu; “Baada ya” ni ya asili katika masimulizi ya Kiswahili.
- source_word: ἐπλήρωσεν
  choice: kumaliza kusema
  rationale: Pamoja na ῥήματα, kitenzi hiki kina maana ya kukamilisha kusema, wala si ‘kutimiza’ unabii au ahadi.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: maneno yake yote
  rationale: Huhifadhi kwa karibu maana na umbo la Kigiriki bila kubadili rejeo kuwa ‘mambo haya yote.’
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: watu wakisikia
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwamba maneno hayo yalisemwa watu wakiwa wanayasikia, bila tafsiri ngumu ya moja kwa moja ya ‘masikioni mwa watu.’
- source_word: λαοῦ
  choice: watu
  rationale: Neno hili lina nguvu ya kijumla; “watu” halibani maana kuwa umati maalumu.
- source_word: εἰσῆλθεν
  choice: aliingia
  rationale: Hii ndiyo maana ya moja kwa moja na ya asili ya kitenzi katika muktadha wa kwenda mjini.
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Tahajia ya Kiswahili inayotumika kwa jina hili la mahali.
