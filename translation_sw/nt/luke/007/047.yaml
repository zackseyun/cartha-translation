id: LUK.7.47
reference: Luke 7:47
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: sw
  text: Kwa sababu hiyo, nakuambia[a], dhambi zake nyingi zimesamehewa, kwa sababu alipenda sana. Lakini anayesamehewa kidogo hupenda kidogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hiyo alipenda sana.” Kiunganishi cha Kigiriki kinaweza kueleweka kwa namna inayoonyesha kwamba upendo wake ni ushahidi wa hali yake ya kusamehewa, badala ya kuwa sababu ya kusamehewa kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kuunganisha hoja kwa njia ya kisababishi au hitimisho; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha uhusiano huo bila kuwa nzito.
- source_word: ἀφέωνται
  choice: zimesamehewa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo; ‘zimesamehewa’ hudumisha maana hiyo.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: dhambi zake nyingi
  rationale: Hii ni mpangilio wa kawaida wa Kiswahili unaowasilisha kwa uwazi wingi wa dhambi zake.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huhifadhi nguvu ya kisababishi ya kiunganishi cha Kigiriki na mvutano uliomo katika kauli, bila kuufafanua kwa tafsiri pana.
- source_word: ἠγάπησεν πολύ
  choice: alipenda sana
  rationale: Wakati uliopita unaafikiana na aoristi katika muktadha, na ‘sana’ huwasilisha kiwango kikubwa cha upendo kwa Kiswahili cha kawaida.
- source_word: ᾧ δὲ
  choice: Lakini anaye-
  rationale: Huwasilisha urejeleo wa jumla bila kuingiza jinsia ya kiume isiyolazimishwa na Kigiriki; ‘lakini’ hudumisha utofautishaji.
- source_word: ὀλίγον ἀφίεται
  choice: anayesamehewa kidogo
  rationale: Huwasilisha kauli tendwa na kiasi kidogo kwa ufupi na kwa Kiswahili cha asili.
- source_word: ὀλίγον ἀγαπᾷ
  choice: hupenda kidogo
  rationale: Huhifadhi ulinganifu wa kimethali kati ya kusamehewa kidogo na kupenda kidogo.
theological_decisions:
- issue: Iwapo ὅτι (‘kwa sababu’) humaanisha kwamba upendo wa mwanamke ndio uliostahili au kusababisha msamaha wake
  choice: Kutafsiri ὅτι kuwa ‘kwa sababu,’ huku sentensi ikiachwa na mvutano wake wa asili na upendo wake ukiweza kueleweka kama ushahidi wa hali ya kusamehewa.
  alternative: Kutafsiri kwa uhuru zaidi kuwa ‘kwa hiyo alipenda sana,’ ili kuonyesha wazi kwamba upendo wake ni matokeo au ushahidi wa msamaha.
  rationale: Mfano unaotangulia na mstari wa 50 unaonyesha uhusiano kati ya msamaha na upendo, lakini mstari huu unatumia kiunganishi chenye sura ya kisababishi. Tafsiri kuu huheshimu muundo wa Kigiriki, na tanbihi huhifadhi uwezekano wa usomaji wa kiushahidi bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa sentensi ya pili umehifadhi nguvu ya kimethali na ulinganifu wa Kigiriki.
