  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: sw
  text: 'Wao ni kama watoto walioketi sokoni, wanaoitana wao kwa wao na kusema: ‘Tuliwapigia filimbi, nanyi hamkucheza; tuliimba wimbo wa maombolezo[a], nanyi hamkulia.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuliomboleza.” Kitenzi cha Kigiriki kinaweza kumaanisha kuomboleza au kuimba wimbo wa maombolezo, kutia ndani maombolezo ya mazishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Wamefanana na
  rationale: Ni usemi wa kawaida wa Kiswahili unaoanzisha mlinganisho bila kuongeza tafsiri ya mfano huo.
- source_word: παιδίοις
  choice: watoto
  rationale: Neno hili linawahusu watoto kwa ujumla bila kubainisha jinsia au umri zaidi ya maandishi.
- source_word: ἐν ἀγορᾷ
  choice: sokoni
  rationale: ἀγορά hapa ni eneo la wazi la umma ambako biashara na shughuli za kijamii zilifanyika; ‘sokoni’ ni ya asili na inaeleweka.
- source_word: καθημένοις
  choice: walioketi
  rationale: Huwasilisha hali ya watoto katika eneo hilo kwa lugha ya kawaida yenye heshima.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: kuitana wao kwa wao
  rationale: Huhifadhi tendo la kuitana kwa sauti na maana ya kufanyiana tendo hilo.
- source_word: ἃ λέγει
  choice: wakisema
  rationale: Muundo huu ni wa asili katika Kiswahili na huepuka kulazimisha kutolingana kwa umoja wa kitenzi cha Kigiriki na wingi wa watoto.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Tuliwapigia filimbi
  rationale: αὐλέω hutaja hasa kupiga filimbi au ala ya bomba; tafsiri hii inahifadhi ala hiyo waziwazi.
- source_word: οὐκ ὠρχήσασθε
  choice: hamkucheza
  rationale: Hutoa tendo halisi la kucheza bila kulifasiri kuwa kusherehekea.
- source_word: ἐθρηνήσαμεν
  choice: tuliimba wimbo wa maombolezo
  rationale: Katika muktadha wa mchezo wa watoto, tafsiri hii huhifadhi wazo la kutekeleza maombolezo na kulinganisha tendo hilo na kupiga filimbi.
- source_word: οὐκ ἐκλαύσατε
  choice: hamkulia
  rationale: κλαίω humaanisha kulia; ‘hamkulia’ ni ya kawaida na huhifadhi mwitikio halisi unaotarajiwa.
theological_decisions:
- issue: Kuhifadhi nguvu ya mfano wa matendo mawili yanayotofautiana bila kufasiri matumizi yake mapema
  choice: 'Kutumia matendo halisi: ‘tuliwapigia filimbi,’ ‘hamkucheza,’ ‘tuliimba wimbo wa maombolezo,’ na ‘hamkulia’'
  alternative: Kutumia lugha ya kufasiri kama ‘tulisherehekea’ na ‘tuliomboleza’
  rationale: Aya yenyewe inatoa mfano kwa picha halisi; lugha ya matendo huhifadhi mvutano na humwachia msomaji kufuata matumizi ya Yesu katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Sokoni’ na ‘walioketi’ ni vya asili kwa wasomaji wengi; sentensi imehifadhi picha halisi na ulinganifu wa kauli za watoto.
