id: LUK.7.27
reference: Luke 7:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: sw
  text: 'Huyu ndiye ambaye imeandikwa kumhusu: “Tazama, ninamtuma mjumbe wangu[a] mbele ya uso wako[b], naye ataitayarisha njia yako mbele yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “mjumbe” linaweza pia kutafsiriwa “malaika,” lakini hapa linamhusu Yohana, ambaye ni mjumbe wa kibinadamu.
    reason: lexical_alternative
  - marker: b
    text: Kwa lugha ya kawaida zaidi, “mbele yako.” Kigiriki kinasema kihalisi “mbele ya uso wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Huyu ndiye
  rationale: Muundo huu unaonyesha kwa mkazo kwamba anayezungumziwa ni Yohana, huku ukiwa wa kawaida katika Kiswahili.
- source_word: περὶ οὗ γέγραπται
  choice: ambaye imeandikwa kumhusu
  rationale: Unadumisha kauli ya kunukuu Maandiko na hali ya tendo lililokamilika lenye matokeo yanayoendelea, bila kuongeza mhusika asiyetajwa katika Kigiriki.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno hili linaendeleza uzito wa mwito wa kinabii wa kuelekeza fikira kwenye tangazo linalofuata.
- source_word: ἀποστέλλω
  choice: ninamtuma
  rationale: Wakati wa sasa unawasilishwa kwa uhai na uwazi, na kiambishi cha yambwa kinafaa kwa mjumbe aliye mtu.
- source_word: ἄγγελόν
  choice: mjumbe
  rationale: Katika muktadha huu neno linamhusu Yohana, mjumbe wa kibinadamu; “malaika” lingeweza kupotosha ingawa ni maana nyingine inayowezekana ya neno la Kigiriki.
- source_word: πρὸ προσώπου σου
  choice: mbele ya uso wako
  rationale: Unahifadhi taswira halisi ya “uso” katika Kigiriki na msingi wa nukuu ya Agano la Kale, huku njia ya kawaida zaidi ikitolewa katika tanbihi.
- source_word: κατασκευάσει
  choice: ataitayarisha
  rationale: Inaonyesha wazi tendo la wakati ujao la kuifanya njia iwe tayari.
- source_word: τὴν ὁδόν σου
  choice: njia yako
  rationale: “Njia” ni neno la kawaida na linafaa kwa matumizi halisi na ya kinabii.
- source_word: ἔμπροσθέν σου
  choice: mbele yako
  rationale: Ni tafsiri ya kawaida ya kirai cha mwisho na inakitofautisha na taswira ya awali ya “mbele ya uso wako.”
theological_decisions:
- issue: Matumizi ya maneno ya Maandiko kuhusu mjumbe kwa Yohana katika uhusiano wake na Yesu
  choice: Kudumisha viwakilishi vya nafsi ya pili—“uso wako,” “njia yako,” na “mbele yako”—bila maelezo ya ziada
  alternative: Kuongeza kwa ufafanuzi kwamba mjumbe anaitayarisha njia ya Bwana au ya Masihi
  rationale: Kigiriki kinatumia viwakilishi hivi moja kwa moja. Kuvihifadhi kunaacha uzito na mvutano wa kitheolojia wa jinsi Yesu anavyoitumia nukuu hii bila kuingiza ufafanuzi usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “mbele ya uso wako” imehifadhiwa kwa sababu ya umuhimu wake katika nukuu, na maana nyepesi zaidi imewekwa katika tanbihi.
