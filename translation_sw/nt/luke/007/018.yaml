  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: sw
  text: Wanafunzi wake wakamweleza Yohana habari za mambo hayo yote. Naye Yohana akawaita wawili fulani kati ya wanafunzi wake,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sentensi ya Kigiriki inaendelea katika mstari unaofuata; koma hapa huhifadhi maana yake ambayo bado haijakamilika.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: wakamweleza
  rationale: Kitenzi hiki humaanisha kupeleka taarifa au habari. “Wakamweleza” ni Kiswahili cha kawaida cha simulizi na kinaonyesha kuwa wanafunzi walimfikishia Yohana habari walizopata.
- source_word: Ἰωάννῃ
  choice: Yohana
  rationale: Ni yambwa isiyo ya moja kwa moja katika Kigiriki; katika muundo wa Kiswahili wa “kumweleza,” jina linafuata bila kihusishi “kwa.”
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” huhifadhi uhusiano wa kujifunza chini ya mwalimu unaokusudiwa na μαθηταί katika Injili.
- source_word: περὶ πάντων τούτων
  choice: habari za mambo hayo yote
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa taarifa ilihusu mambo yote yaliyotangulia, huku ukihifadhi msisitizo wa πάντων, “yote.”
- source_word: προσκαλεσάμενος
  choice: akawaita
  rationale: Kitenzi kishirikishi cha kati kinaonyesha kuwa Yohana alichukua hatua ya kuwaita waje kwake. “Akawaita” ni cha kawaida na hakiongezi urasmi usiokuwamo katika neno la Kigiriki.
- source_word: δύο τινὰς
  choice: wawili fulani
  rationale: “Wawili fulani” huhifadhi maana isiyoainisha watu hao ya τινάς badala ya kuifuta kabisa.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: kati ya wanafunzi wake
  rationale: 'Hii inaonyesha wazi matumizi ya genitivi ya sehemu: wale wawili walichaguliwa kutoka katika kundi la wanafunzi wake.'
- source_word: ὁ Ἰωάννης
  choice: Naye Yohana
  rationale: Kigiriki humtaja Yohana wazi kuwa mtendaji baada ya kishirikishi. “Naye Yohana” huhifadhi utambulisho huo na kuunganisha sentensi kwa mtiririko wa kawaida wa Kiswahili.
