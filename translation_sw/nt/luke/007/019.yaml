  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: sw
  text: Akawatuma kwa Bwana, akisema, “Je, wewe ndiye Yule Anayekuja[a], au tumtarajie mwingine?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule Ajaye.” Usemi wa Kigiriki unaweza pia kueleweka kama maelezo ya kawaida, “yule anayekuja,” lakini katika muktadha huu huenda umetumiwa kama cheo cha Kimasihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Akawatuma
  rationale: Kitenzi cha wakati uliopita kinasimulia tendo la kutuma. Kiambishi -wa- kinawarejelea wale wanafunzi wawili waliotajwa katika muktadha wa karibu, ingawa nomino yao haijarudiwa katika mstari huu.
- source_word: πρὸς τὸν κύριον
  choice: kwa Bwana
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha kuelekea kwa mtu. “Bwana” ni tafsiri ya kawaida na yenye uzito unaofaa ya κύριος inapomtaja Yesu.
- source_word: λέγων
  choice: akisema
  rationale: Kauli endelevu inaunganisha tendo la kutuma na maneno ya ujumbe; Kiswahili “akisema” huhifadhi uhusiano huo kwa ufupi na kwa kawaida.
- source_word: Σὺ εἶ ὁ ἐρχόμενος
  choice: wewe ndiye Yule Ajaye
  rationale: Muundo wa swali unatolewa kwa Kiswahili cha kawaida, huku “Yule Ajaye” ukihifadhi umbo la kauli tendaji ya sasa iliyotumiwa kama nomino na uwezekano wake wa kuwa cheo cha Kimasihi.
- source_word: ἄλλον
  choice: mwingine
  rationale: Hii ndiyo yambwa ya moja kwa moja na inadokeza mtu mwingine bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: προσδοκῶμεν
  choice: tumtarajie
  rationale: Hali ya kuuliza kwa kutafakari inaelezwa kwa kiima tegemezi cha Kiswahili, kikitoa maana ya “je, inatupasa kumtarajia” bila kuongeza kitenzi cha wajibu waziwazi.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: bwana mkuu
  rationale: “Bwana” huhifadhi matumizi ya kawaida ya κύριος na uzito wake wa heshima na wa Kikristo katika simulizi la Luka; “bwana mkuu” ingeongeza neno lisilokuwapo.
- issue: Iwapo ὁ ἐρχόμενος itafsiriwe kama cheo au maelezo ya kawaida
  choice: Yule Ajaye
  alternative: yule anayekuja
  rationale: Katika muktadha huu usemi huo unaweza kufanya kazi kama jina la utambulisho la yule aliyekuwa akitarajiwa. Herufi kubwa zinaashiria matumizi ya kicheo bila kufuta maana halisi ya “yule anayekuja”; tanbihi inahifadhi uwezekano wa usomaji wa kimaelezo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Tumtarajie” ni cha kawaida na sahihi zaidi kwa maana ya kutazamia mtu kuliko tafsiri inayosisitiza tu kitendo cha kumngojea. Alama ya tanbihi [a] imewekwa mara moja baada ya usemi unaohusika.
