  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: sw
  text: Yule aliyekuwa amekufa akaketi, akaanza kusema, naye Yesu akamkabidhi kwa mama yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamrudisha kwa mama yake” au “akamkabidhi tena kwa mama yake.” Kigiriki hutumia tu kitenzi cha “kumpa”; maana ya kumrudisha inadokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: akaketi
  rationale: Kitenzi hiki kinaonyesha kuinuka kutoka hali ya kulala na kuketi. “Akaketi” ni Kiswahili cha kawaida na hakiongezi kwamba alisimama.
- source_word: ὁ νεκρός
  choice: yule aliyekuwa amekufa
  rationale: Kirai hiki humtambulisha kijana kwa hali yake ya awali ya kuwa mfu, huku kuepuka neno la kitabibu kama “maiti,” ambalo lingekuwa lisilo la kawaida baada ya kuhuishwa.
- source_word: ἤρξατο λαλεῖν
  choice: akaanza kusema
  rationale: Huhifadhi maana ya kuanza kwa tendo la kusema na inafaa kwa mtindo wa simulizi.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: akampa mama yake
  rationale: Hutafsiri δίδωμι kwa maana yake ya moja kwa moja, “kumpa,” bila kuongeza wazi “akamrudisha,” ingawa urejesho unaeleweka kutokana na muktadha.
theological_decisions:
- issue: Kama tafsiri ieleze wazi kwamba Yesu alimrudisha mwana kwa mama yake
  choice: akampa mama yake
  alternative: akamrudisha kwa mama yake / akamkabidhi tena kwa mama yake
  rationale: Muktadha unaonyesha urejesho baada ya kufufuliwa, lakini Kigiriki kinasema tu “alimpa.” Tafsiri rahisi huhifadhi usemi wa chanzo bila kuficha maana inayodokezwa na simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mfuatano wa vitenzi vya ‘aka-’ unatoa mtiririko wa kawaida wa matukio. Kiwakilishi “naye” kinabainisha mabadiliko ya mtendaji kwenda kwa Yesu.
