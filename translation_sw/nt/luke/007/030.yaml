  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: sw
  text: Lakini Mafarisayo na wataalamu wa Sheria walilikataa kusudi la Mungu kwao,[a] bila kubatizwa naye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shauri la Mungu dhidi yao wenyewe,” au “mpango wa Mungu kuwahusu.”
    reason: alternative_reading
  - marker: b
    text: Yaani, Yohana Mbatizaji.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: wataalamu wa Sheria
  rationale: Neno hili linawataja watu waliobobea katika Sheria ya Musa. “Wataalamu wa Sheria” ni wazi kwa wasomaji wa kisasa na halichanganyi kundi hili na wanasheria wa mahakama za leo.
- source_word: βουλὴν
  choice: kusudi
  rationale: βoulē hapa linaweza kumaanisha kusudi, mpango, au shauri. “Kusudi” linaeleza nia ya Mungu kwa lugha ya kawaida bila kulazimisha maana ya ushauri au amri isiyoweza kupingwa.
- source_word: ἠθέτησαν
  choice: walilikataa
  rationale: Kitenzi hiki kina maana ya kukataa, kuweka kando, au kubatilisha. “Walilikataa” kinaeleza moja kwa moja mwitikio wao kwa kusudi la Mungu.
- source_word: εἰς ἑαυτούς
  choice: kwa ajili yao wenyewe
  rationale: Kirai hiki kinaonyesha kuwa kusudi la Mungu liliwahusu wao binafsi. Tafsiri hii ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: wakiwa hawajabatizwa naye
  rationale: Muundo huu unahifadhi hali ya kishirikishi ya Kigiriki bila kuamua wazi kwamba kutobatizwa ndiko kulikosababisha kukataa kwao.
- source_word: αὐτοῦ
  choice: naye
  rationale: Kiwakilishi kinarejelea Yohana kulingana na muktadha. Kukihifadhi kama kiwakilishi kunafuata maandishi ya Kigiriki; tanbihi inafafanua rejeo lake.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ linaonyesha tofauti kati yao na wale waliotajwa katika mstari uliotangulia; “Lakini” linaonyesha tofauti hiyo wazi.
theological_decisions:
- issue: Maana ya kusudi la Mungu kuhusiana na Mafarisayo na wataalamu wa Sheria
  choice: kusudi la Mungu kwa ajili yao wenyewe
  alternative: shauri la Mungu dhidi yao; mpango wa Mungu kuwahusu wao wenyewe
  rationale: Tafsiri hii inaonyesha kwamba walikataa kusudi la Mungu lililowahusu binafsi, bila kutatua kimakusudi mvutano wa kiteolojia kuhusu jinsi mapenzi ya Mungu yanavyoweza kukataliwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Sheria” imeandikwa kwa herufi kubwa kuonyesha Sheria ya Musa.
