base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: sw
  text: Saa ile[a] aliwaponya watu wengi waliokuwa wakisumbuliwa na magonjwa, mateso makali[b] na roho waovu; naye akawajalia vipofu wengi kuona.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Saa ileile.” Usemi wa Kigiriki unaweza kusisitiza kwamba jambo hilo lilitokea papo hapo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kutafsiriwa “mapigo” au “madhara makali”; kihalisi linaweza kumaanisha viboko, na kwa maana pana mateso makali ya mwili.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “akawajalia kuona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Saa ile
  rationale: Huhifadhi rejeo mahususi la wakati katika Kigiriki huku likibaki wazi na la kawaida katika Kiswahili.
- source_word: ἐθεράπευσεν
  choice: aliwaponya
  rationale: Kitenzi hiki humaanisha kuponya au kutibu; “aliwaponya” kinafaa kwa muktadha wa matendo ya uponyaji ya Yesu.
- source_word: πολλοὺς
  choice: watu wengi
  rationale: Ingawa nomino haijatajwa wazi katika Kigiriki, Kiswahili cha kawaida huhitaji kuonyesha kwamba wanaoponywa ni watu.
- source_word: ἀπὸ νόσων
  choice: waliokuwa na magonjwa
  rationale: Muundo huu wa asili unaeleza watu kuondolewa katika hali ya magonjwa; Kiswahili hiki kinafikisha maana hiyo bila kutumia muundo mgumu wa “kutokana na magonjwa.”
- source_word: μαστίγων
  choice: mateso makali
  rationale: Neno linaweza kumaanisha viboko kihalisi, lakini hapa limetumiwa kwa hali kali za mateso ya mwili; “mateso makali” linaeleweka kwa urahisi katika muktadha wa uponyaji.
- source_word: πνευμάτων πονηρῶν
  choice: roho waovu
  rationale: Hili ni tafsiri ya moja kwa moja ya “roho waovu” na halibadilishi usemi huo kuwa maelezo ya magonjwa yasiyo ya kiroho.
- source_word: τυφλοῖς πολλοῖς
  choice: vipofu wengi
  rationale: Hutaja wapokeaji wengi waliokuwa vipofu bila kuwafanya wanaume peke yao.
- source_word: ἐχαρίσατο
  choice: akawajalia
  rationale: “Kujalia” huhifadhi wazo la kutoa kwa neema au kwa ukarimu lililomo katika χαρίζομαι.
- source_word: βλέπειν
  choice: kuona
  rationale: Hufuata kwa karibu kitenzi-jina cha Kigiriki na ni usemi wa asili baada ya “akawajalia.”
theological_decisions:
- issue: Asili ya roho waovu na mamlaka ya Yesu juu yao
  choice: Kutaja “roho waovu” kama hali halisi ya kiroho ambayo Yesu aliwaondolea watu
  alternative: Kufasiri usemi huo kuwa picha tu ya magonjwa ya akili au ya mwili
  rationale: πνευμάτων πονηρῶν ni usemi wa wazi wa viumbe au nguvu binafsi za kiroho zilizo ovu. Tafsiri inadumisha maana hiyo bila kuipunguza wala kuongeza maelezo ya kimadhehebu.
- issue: Nuansi ya neema katika ἐχαρίσατο
  choice: akawajalia
  alternative: akawapa uwezo wa kuona
  rationale: “Akawajalia” huhifadhi tendo la kutoa kwa ukarimu bila kufanya maelezo ya ziada kuhusu namna ya muujiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi hudumisha mpangilio na mvutano wa maandishi ya Kigiriki, huku “watu wengi waliokuwa na...” ukifanya uhusiano wa ἀπό na hali hizo ueleweke kwa Kiswahili cha kawaida.
