id: LUK.7.20
reference: Luke 7:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: sw
  text: 'Wale wanaume walipofika kwake, wakasema, “Yohana Mbatizaji ametutuma kwako na ujumbe huu: ‘Je, wewe ndiye Yule Ajaye[a], au tumtarajie mwingine?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayepaswa kuja.”
    reason: Njia nyingine ya kutafsiri ὁ ἐρχόμενος kwa kuonyesha kwa uwazi zaidi maana ya yule ambaye kuja kwake kunatarajiwa.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: walipofika kwake
  rationale: Kishazi hiki cha wakati kinaonyesha kuwasili kwao kwake na kinaendeleza masimulizi kwa Kiswahili cha kawaida.
- source_word: οἱ ἄνδρες
  choice: wale wanaume
  rationale: Neno ἀνήρ hapa linawataja wajumbe wa kiume hasa; “wanaume” linahifadhi maana hiyo bila kuongeza habari isiyokuwamo.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Yohana Mbatizaji
  rationale: “Mbatizaji” ni jina la cheo linaloeleweka vizuri katika Kiswahili na linaonyesha tendo linalotajwa na βαπτιστής.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: ametutuma kwako na ujumbe huu
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kusudi la kutumwa na kuanzisha maneno ya Yohana bila kubadili ujumbe kuwa maelezo ya msimulizi.
- source_word: ὁ ἐρχόμενος
  choice: Yule Ajaye
  rationale: Kirai hiki kinaweza kufanya kazi kama cheo cha yule aliyekuwa akitarajiwa. “Yule Ajaye” kinahifadhi ufupi, hali ya matarajio, na uzito wake bila kutaja wazi zaidi utambulisho ambao mstari wenyewe hauutaji.
- source_word: ἄλλον προσδοκῶμεν
  choice: tumtarajie mwingine
  rationale: Kitenzi προσδοκάω kina maana ya kumngojea au kumtarajia mtu; “tumtarajie” ni cha kawaida katika swali hili na kinabaki karibu na maana ya chanzo.
theological_decisions:
- issue: Nguvu ya Kimasihi ya ὁ ἐρχόμενος
  choice: Yule Ajaye
  alternative: yule anayepaswa kuja
  rationale: Tafsiri iliyochaguliwa inadumisha uwezekano wa kirai kuwa cheo cha Kimasihi huku ikiendelea kuakisi maana ya msingi ya ‘kuja.’ Haiongezi neno “Masihi,” ambalo halimo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na ujumbe huu” huondoa ugumu wa kunakili kihalisi kishiriki λέγων, huku nukuu ya moja kwa moja ikihifadhi ujumbe wenyewe. Herufi kubwa katika “Yule Ajaye” zinaashiria matumizi yake kama cheo bila kuongeza ufafanuzi wa kimadhehebu.
