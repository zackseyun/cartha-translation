  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: sw
  text: Na habari hii kumhusu ikaenea katika Yudea yote na katika eneo lote la jirani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taarifa hii kumhusu” au “neno hili kumhusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ikaenea
  rationale: Katika muktadha wa habari inayosambaa, ‘ikaenea’ ni Kiswahili cha kawaida kinachowasilisha vizuri nahau ya Kigiriki yenye maana halisi ya ‘ikatoka.’
- source_word: ὁ λόγος οὗτος
  choice: habari hii
  rationale: Hapa λόγος humaanisha habari au taarifa kuhusu tendo la Yesu, si neno moja lililotamkwa; ‘habari hii’ ni ya asili na wazi kwa wasomaji wa kisasa.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: katika Yudea yote
  rationale: Muundo huu huhifadhi upeo wa eneo lote huku ukitumia Kiswahili cha kawaida pamoja na kitenzi ‘ikaenea.’
- source_word: περὶ αὐτοῦ
  choice: kumhusu
  rationale: ‘Kumhusu’ ni tafsiri fupi na ya kawaida ya περί pamoja na hali ya kumiliki, ikidumisha kwamba habari hiyo ilikuwa juu yake Yesu.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: eneo lote linaloizunguka
  rationale: ‘Eneo’ huwasilisha περίχωρος kwa uwazi, na ‘linaloizunguka’ huonyesha kuwa ni eneo lililo karibu na Yudea bila kulifanya kuwa wilaya rasmi.
- source_word: καὶ ... καὶ
  choice: Na ... na
  rationale: Kurudia kiunganishi kunahifadhi uratibu na nguvu ya kujumlisha maeneo mawili katika Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikaenea’ ni ya kiasili zaidi kuliko tafsiri halisi ‘ikatoka’ katika muktadha wa habari zinazosambaa. Kirejeleo cha ‘linaloizunguka’ ni Yudea, kama inavyodokezwa na mfuatano wa sentensi.
