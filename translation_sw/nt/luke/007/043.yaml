base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: sw
  text: Simoni akajibu, “Nadhani[a] ni yule ambaye alimfutia deni kubwa zaidi.[b]” Yesu akamwambia, “Umeamua kwa usahihi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ninakisia”; neno la Kigiriki linaonyesha hitimisho linalotolewa kwa tahadhari.
    reason: lexical_alternative
  - marker: b
    text: Au “yule ambaye alimsamehe zaidi”; kitenzi cha Kigiriki kinaweza kumaanisha kusamehe au kufuta deni kwa neema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς Σίμων εἶπεν
  choice: Simoni akajibu
  rationale: Muundo wa Kigiriki wenye kishirikishi pamoja na kitenzi cha kusema ni njia ya kawaida ya kutambulisha jibu; Kiswahili cha kawaida huuwasilisha kwa kifupi kama “akajibu.”
- source_word: Ὑπολαμβάνω
  choice: Nadhani
  rationale: “Nadhani” huonyesha hitimisho la tahadhari au kutokuwa na uhakika kamili, kama ilivyo katika kitenzi cha Kigiriki hapa.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: yule aliyefutiwa deni kubwa zaidi
  rationale: Katika muktadha wa mfano wa wadaiwa, χαρίζομαι ina maana ya kuondoa deni kwa neema. Muundo wa kutendwa “aliyefutiwa” pia huhifadhi yule mnufaika anayeonyeshwa na kiwakilishi cha dative ᾧ.
- source_word: Ὀρθῶς
  choice: kwa usahihi
  rationale: Hutoa maana ya “kwa njia iliyo sahihi” kwa Kiswahili cha sasa na huambatana kiasili na “umeamua.”
- source_word: ἔκρινας
  choice: umeamua
  rationale: κρίνω hapa inahusu tathmini au uamuzi wa Simoni, si hukumu ya mahakama. Wakati timilifu wa Kiswahili unaonyesha uamuzi ambao ametoka kuufanya na ambao bado una umuhimu katika jibu la Yesu.
theological_decisions:
- issue: Maana ya msamaha katika mfano wa deni
  choice: Kutumia “aliyefutiwa deni kubwa zaidi” katika matini kuu
  alternative: “aliyemsamehe zaidi”
  rationale: Muktadha wa karibu unazungumzia kufutiwa deni, na tafsiri hii inaweka wazi picha ya mfano bila kupoteza wazo la tendo la neema. Tanbihi huhifadhi uwezekano wa lugha pana ya kusamehe, ambao unaunganisha mfano na msamaha wa dhambi katika kifungu kinachozunguka.
- issue: Utambulisho wa msemaji katika kishazi cha mwisho
  choice: Kutaja “Yesu”
  alternative: “Naye akamwambia”
  rationale: Kigiriki hutumia kiwakilishi pekee, lakini katika Kiswahili kutaja Yesu huondoa uwezekano wa mkanganyiko baada ya Simoni kutajwa, bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nadhani” ni cha kawaida bila kuwa cha mazungumzo kupita kiasi; “kufutiwa deni” ni usemi unaoeleweka kwa urahisi katika muktadha wa mfano.
