  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: sw
  text: “Basi, watu wa kizazi hiki niwafananishe na nini? Wanafanana na nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: Katika muktadha huu ἄνθρωποι humaanisha watu kwa ujumla, si wanaume pekee; ‘watu’ ni ya kawaida na sahihi katika Kiswahili.
- source_word: τῆς γενεᾶς ταύτης
  choice: wa kizazi hiki
  rationale: Huhifadhi maana ya kundi la watu wa wakati huu bila kufafanua zaidi ya maandishi.
- source_word: ὁμοιώσω / ὅμοιοι
  choice: niwafananishe / wanafanana
  rationale: Hurudisha kwa kawaida katika Kiswahili uhusiano wa kitenzi na kivumishi uliopo katika Kigiriki.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha hitimisho au mwendelezo kutoka hoja iliyotangulia.
theological_decisions:
- issue: Upeo wa ‘watu wa kizazi hiki’
  choice: Kifungu kimeachwa kikirejelea kwa upana watu wa kizazi hiki.
  alternative: Kukitafsiri kuwa viongozi, wapinzani, au wanaume pekee.
  rationale: Mstari wenyewe hautaji kundi dogo zaidi; ufafanuzi huo ungetatua kimya kimya upeo ambao muktadha unapaswa kuamua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa kawaida kwa Kiswahili huku maswali mawili ya Kigiriki yakihifadhiwa.
