id: LUK.7.10
reference: Luke 7:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: sw
  text: Nao wale waliokuwa wametumwa waliporudi kwenye nyumba, walimkuta yule mtumwa[a] akiwa na afya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi,” kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: waliporudi
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; muundo wa “waliporudi” unaonyesha wakati na mfuatano huo kwa Kiswahili cha kawaida.
- source_word: εἰς τὸν οἶκον
  choice: kwenye nyumba
  rationale: Kirai hiki kinaonyesha mwendo kuelekea au kuingia mahali; “kwenye nyumba” huhifadhi mahali halisi bila kudhani kwamba ilikuwa nyumba yao wenyewe.
- source_word: οἱ πεμφθέντες
  choice: wale waliokuwa wametumwa
  rationale: Muundo huu huhifadhi hali ya kutendwa ya kitenzi πέμπω na hautii jina la kufasiri kama “wajumbe.”
- source_word: εὗρον
  choice: walimkuta
  rationale: Katika simulizi hii, “walimkuta” ni tafsiri ya kawaida na ya asili ya εὑρίσκω, ikimaanisha hali waliyoikuta walipofika.
- source_word: τὸν δοῦλον
  choice: yule mtumwa
  rationale: δοῦλος humaanisha mtu aliye chini ya mamlaka ya mwingine kama mtumwa; “mtumwa” huhifadhi wazi hadhi hiyo ya kijamii kuliko “mtumishi.”
- source_word: ὑγιαίνοντα
  choice: akiwa na afya
  rationale: ὑγιαίνω humaanisha kuwa mwenye afya au hali nzuri. “Akiwa na afya” huhifadhi maana hiyo bila kuongeza moja kwa moja neno la kufasiri “ameponywa.”
theological_decisions:
- issue: Tafsiri ya δοῦλος katika simulizi la kupona
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha haumwonyeshi kama mfanyakazi wa kuajiriwa tu, bali kama mtu aliye chini ya mamlaka ya akida. “Mtumwa” huhifadhi uzito wa neno la Kigiriki, huku “mtumishi” ikitajwa katika tanbihi kama tafsiri nyingine inayowezekana katika matumizi mapana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida katika simulizi; “kwenye nyumba” huepuka kufasiri οἶκος kuwa lazima “nyumbani,” na “akiwa na afya” huepuka kuongeza wazi dhana ya kuponywa ambayo haimo katika kitenzi chenyewe.
