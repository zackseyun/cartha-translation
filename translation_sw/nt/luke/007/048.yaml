  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: sw
  text: Kisha akamwambia, “Dhambi zako zimesamehewa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaonyesha tendo la kusamehe lililokamilika ambalo matokeo yake yanaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: akamwambia
  rationale: Kitenzi hiki ni aoristi ya λέγω, ‘sema.’ Katika muktadha huu, ‘akamwambia’ ni Kiswahili cha kawaida kinachoonyesha wazi kwamba maneno yanaelekezwa kwa huyo mwanamke.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani. ‘Kisha’ kinaendeleza mtiririko kwa kawaida.
- source_word: αὐτῇ
  choice: -mw- katika ‘akamwambia’
  rationale: Kiwakilishi hiki cha dativu kinamtaja mwanamke kama anayeelekezewa maneno; Kiswahili hukiwakilisha kwa kiambishi cha yambwa ‘-mw-’ ndani ya kitenzi.
- source_word: Ἀφέωνταί
  choice: zimesamehewa
  rationale: Ni perfekt timilifu tendwa ya ἀφίημι. ‘Zimesamehewa’ huonyesha tendo la kusamehe lililokamilika pamoja na hali yake inayoendelea, kwa lugha ya kawaida na yenye hadhi.
- source_word: σου
  choice: zako
  rationale: Kiwakilishi hiki cha umilikaji kinahusiana na ‘dhambi’; ‘zako’ ndilo umbo la kawaida la Kiswahili kwa nafsi ya pili umoja katika ngeli hii.
- source_word: αἱ ἁμαρτίαι
  choice: Dhambi
  rationale: ‘Dhambi’ hutoa maana ya makosa ya kimaadili mbele za Mungu. Kiswahili hakihitaji kutafsiri kibainishi cha Kigiriki kwa neno tofauti hapa.
theological_decisions:
- issue: Nguvu ya perfekt timilifu tendwa Ἀφέωνταί katika tangazo la msamaha
  choice: Dhambi zako zimesamehewa.
  alternative: Dhambi zako ziko katika hali ya kusamehewa.
  rationale: ‘Zimesamehewa’ huhifadhi kwa njia ya kawaida ya Kiswahili wazo la tendo lililokamilika lenye matokeo yanayoendelea. Hailazimishi ufafanuzi wa wakati au mtendaji ambao Kigiriki hakutaji wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. ‘Akamwambia’ ni ya asili zaidi kuliko kutenganisha ‘akasema kwake,’ huku ‘zimesamehewa’ ikihifadhi vizuri hali inayotokana na tendo lililokamilika.
