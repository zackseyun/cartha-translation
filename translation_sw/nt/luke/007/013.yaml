  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: sw
  text: Bwana alipomwona, akamhurumia sana, akamwambia, “Usilie.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Acha kulia.” Kigiriki kinaweza kueleweka kuwa ni katazo la kulia au agizo la kuacha maombolezo yaliyokuwa yakiendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipomwona
  rationale: Kirai cha wakati kinaonyesha kwamba kumwona kulitangulia tendo kuu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Hapa κύριος ni cheo cha Yesu katika simulizi la Luka; “Bwana” huhifadhi uzito huo bila kukifanya kuwa “bwana mkubwa” au “mkuu.”
- source_word: ἐσπλαγχνίσθη
  choice: akamhurumia sana
  rationale: Kitenzi hiki huonyesha huruma ya ndani na yenye nguvu. “Akam hurumia sana” kwa maana ya “akamhurumia sana” ni usemi wa asili unaohifadhi nguvu hiyo.
- source_word: ἐπ’ αὐτῇ
  choice: -m- katika akamhurumia
  rationale: Kiambishi cha yambwa humtambulisha mwanamke kuwa mlengwa wa huruma, kama ἐπί pamoja na dativu katika muktadha huu.
- source_word: εἶπεν αὐτῇ
  choice: akamwambia
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa “alisema kwake,” unaohifadhi kwamba maneno yalielekezwa kwa mwanamke huyo.
- source_word: Μὴ κλαῖε
  choice: Usilie
  rationale: Huhifadhi maana ya κλαίω na pia kutokubainisha kupita kiasi ikiwa ni katazo la jumla au agizo la kuacha kulia kunakoendelea.
theological_decisions:
- issue: Kutafsiri κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: mkuu / bwana
  rationale: “Bwana” huhifadhi matumizi ya Luka yenye uzito wa kikristo kuhusu Yesu bila kuongeza dai ambalo mstari wenyewe haulitamki wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa asili katika simulizi; “akamhurumia sana” hufikisha nguvu ya hisia ya kitenzi cha Kigiriki. Alama ya tanbihi imewekwa baada ya nukuu inayohusika.
