id: LUK.7.33
reference: Luke 7:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: sw
  text: Kwa maana Yohana Mbatizaji amekuja bila kula mkate wala kunywa divai, nanyi mnasema, “Ana pepo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Amepagawa na pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: amekuja
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuja kwa Yohana kama tendo lililotokea lenye umuhimu unaoendelea katika hoja hii; “amekuja” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatanguliza maelezo ya kauli iliyotangulia; “Kwa maana” ni cha asili na chenye hadhi katika muktadha huu.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Yohana Mbatizaji
  rationale: “Mbatizaji” linaonyesha wazi kazi inayotajwa na βαπτιστής na linamtambulisha Yohana bila kutegemea jina la dhehebu.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: bila kula mkate wala kunywa divai
  rationale: Muundo huu wa Kiswahili ni wa kawaida, unaonyesha mwenendo wa kujinyima wa Yohana, na unahifadhi maneno mahususi “mkate” na “divai” bila kuyapanua kuwa chakula na kinywaji kwa ujumla.
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati wa sasa unaonyesha jibu au shtaka la kawaida la wasikilizaji; “mnasema” ni usemi wa moja kwa moja na wa asili.
- source_word: Δαιμόνιον ἔχει
  choice: Ana pepo
  rationale: Hili linafuata kwa karibu muundo wa Kigiriki, “ana pepo,” na kuhifadhi nguvu ya shtaka bila kulifafanua zaidi ndani ya matini.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμόνιον katika shtaka dhidi ya Yohana
  choice: pepo
  alternative: roho mchafu
  rationale: δαιμόνιον humaanisha pepo katika muktadha huu. “Roho mchafu” ni usemi unaohusiana lakini tofauti na ambao haujatumiwa katika mstari huu, hivyo haujaingizwa kwa kulinganisha istilahi.
- issue: Jinsi ya kueleza Δαιμόνιον ἔχει
  choice: Ana pepo
  alternative: Amepagawa na pepo
  rationale: Matini kuu inahifadhi muundo wa moja kwa moja wa chanzo. Usemi wa “amepagawa na pepo” ni wa kawaida zaidi lakini unaeleza hali inayodokezwa na shtaka, kwa hiyo umetolewa katika tanbihi kama mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida; “bila kula … wala kunywa …” ni ya asili huku ikihifadhi vipengele halisi vya chanzo. Alama ya tanbihi imewekwa baada ya shtaka linalohusika.
