  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: sw
  text: Kwa kuwa hawakuwa na uwezo wa kulipa, aliwaondolea wote wawili deni.[a] Basi, ni yupi kati yao atakayempenda zaidi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwasamehe wote wawili kwa hiari.” Kitenzi cha Kigiriki kinaweza kumaanisha kumpa mtu kitu kwa hiari au kumwondolea deni.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Kwa kuwa hawakuwa na uwezo wa kulipa
  rationale: 'Kirai huru cha hali katika umilikishi kinaeleza sababu au mazingira: wadaiwa hawakuwa na uwezo wa kulipa deni. Kiswahili hiki ni cha kawaida na hakidai kwamba hawakuwa na mali yoyote kabisa.'
- source_word: ἀμφοτέροις
  choice: wote wawili
  rationale: Hurejelea wazi wadaiwa hao wawili na ni usemi wa kawaida wa Kiswahili.
- source_word: ἐχαρίσατο
  choice: aliwasamehe ... kwa neema
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa kwa ukarimu au kuondolea deni. 'Aliwasamehe' huhifadhi uhusiano kati ya msamaha wa deni na msamaha katika muktadha mpana, huku 'kwa neema' ikionyesha tendo la hiari lenye fadhili.
- source_word: τίς οὖν αὐτῶν
  choice: Basi, ni yupi kati yao
  rationale: '''Basi'' huhifadhi hitimisho linaloletwa na οὖν, na ''ni yupi kati yao'' ni swali la asili katika Kiswahili.'
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: atakayempenda zaidi
  rationale: Huhifadhi wakati ujao wa kitenzi na ulinganisho wa kiwango cha upendo bila kuongeza maana nyingine.
theological_decisions:
- issue: Tafsiri ya χαρίζομαι katika mfano wa deni na msamaha
  choice: aliwasamehe wote wawili kwa neema
  alternative: aliwaondolea wote wawili madeni yao
  rationale: Muktadha wa karibu ni kufutwa kwa deni, lakini mfano huo pia unaelekeza kwenye msamaha na upendo. Tafsiri kuu huhifadhi pande zote mbili kwa kadiri iwezekanavyo, na tanbihi inaweka wazi maana ya kifedha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kwa kuwa' huonyesha uhusiano wa sababu kwa uwazi; 'kwa neema' huwasilisha wazo la tendo la hiari lenye fadhili bila kutumia lugha ya kimadhehebu.
