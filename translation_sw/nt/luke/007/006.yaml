id: LUK.7.6
reference: Luke 7:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: sw
  text: Basi Yesu akaenda pamoja nao. Lakini Yesu alipokuwa tayari karibu na nyumba, mkuu wa askari mia akatuma rafiki zake wamwambie, “Bwana[a], usijisumbue, kwa maana sistahili[b] kwamba uingie chini ya paa langu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa.” Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, na pia linaweza kudokeza kutambuliwa kwa mamlaka ya Yesu.
    reason: alternative_reading
  - marker: b
    text: Au “sifai” / “sina sifa zinazofaa.” Neno la Kigiriki linaweza kumaanisha kufaa, kutosha, au kustahili; hapa linaonyesha unyenyekevu wa mkuu wa askari mbele ya Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: akaenda
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha Yesu akiwa safarini; “akaenda” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: σὺν αὐτοῖς
  choice: pamoja nao
  rationale: Kinahifadhi wazi maana ya kuandamana nao.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: alipokuwa tayari si mbali na nyumba
  rationale: Muundo huu unaonyesha wakati na hali, huku ukihifadhi usemi wa Kigiriki “si mbali” badala ya kuufanya tu “karibu.”
- source_word: ἔπεμψεν φίλους
  choice: akatuma rafiki zake
  rationale: Ni tafsiri ya asili inayotambulisha marafiki kuwa wa mkuu wa askari; “wamwambie” huwasilisha kusudi la kutumwa kwao.
- source_word: ὁ ἑκατοντάρχης
  choice: mkuu wa askari mia
  rationale: Ni usemi unaoeleweka kwa msomaji wa kawaida na unaohifadhi maana halisi ya cheo cha ofisa aliyesimamia takriban askari mia.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi namna ya heshima ya kumwita Yesu pamoja na uwezekano wa kutambua mamlaka yake, bila kulazimisha maana moja tu.
- source_word: μὴ σκύλλου
  choice: usijisumbue
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaomaanisha asijitie taabuni au usumbufu.
- source_word: ἱκανός εἰμι
  choice: sistahili
  rationale: Katika muktadha huu neno linaonyesha unyenyekevu na kutokujiona anafaa, ingawa maana ya kutotosha au kutofuzu bado inawezekana.
- source_word: ἵνα ... εἰσέλθῃς
  choice: uingie
  rationale: Kiima tegemezi cha Kiswahili kinaeleza jambo ambalo mkuu huyo anasema hastahili litendwe kwake.
- source_word: ὑπὸ τὴν στέγην μου
  choice: chini ya dari yangu
  rationale: Inahifadhi picha halisi ya Kigiriki ya kuingia chini ya paa la mtu, ambayo kwa kawaida humaanisha kuingia nyumbani kwake.
theological_decisions:
- issue: Maana ya κύριος anapotumiwa Yesu moja kwa moja
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” inaweza kuwa namna ya heshima na pia inaweza kudokeza kutambuliwa kwa mamlaka ya Yesu. Tafsiri hii inalinda uwezekano huo bila kudai kwamba hapa lazima iwe ungamo kamili la kiungu.
- issue: Maana ya ἱκανός katika usemi wa mkuu wa askari
  choice: sistahili
  alternative: sifai / sina sifa zinazofaa
  rationale: Muktadha unaonyesha unyenyekevu mbele ya Yesu; hata hivyo, tanbihi inahifadhi wigo wa maana unaohusu kufaa, kutosha, au kuwa na sifa zinazohitajika.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkuu wa askari mia” umetumiwa badala ya istilahi ya kale “akida” ili cheo kieleweke mara moja. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja: “Bwana[a]” na “sistahili[b].”'
