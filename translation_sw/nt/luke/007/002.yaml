  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: sw
  text: Mtumwa[a] wa akida mmoja alikuwa mgonjwa na karibu kufa, naye akida huyo alimthamini sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi” kulingana na muktadha; hapa “mtumwa” limetumiwa ili kuhifadhi uhusiano wa utumwa unaodokezwa na neno hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: wa akida mmoja
  rationale: Muundo huu unaonyesha kuwa mtumwa alikuwa wa akida fulani, huku ‘mmoja’ ikihifadhi hali ya kutotajwa wazi ya τινος. ‘Akida’ ni neno la kawaida la Kiswahili la cheo hiki cha kijeshi.
- source_word: δέ
  choice: haikutafsiriwa kwa neno maalumu
  rationale: δέ hapa ni kiunganishi hafifu cha simulizi. Katika mstari huu Kiswahili cha asili hakihitaji ‘basi’ au ‘sasa,’ ambazo zingeweza kusisitiza uhusiano usiotajwa wazi.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika mazingira ya nyumba ya karne ya kwanza, neno hili linaonyesha hali ya mtu aliye chini ya mamlaka na umiliki wa mwingine; ‘mtumwa’ huhifadhi maana hiyo kuliko ‘mtumishi.’
- source_word: κακῶς ἔχων
  choice: alikuwa mgonjwa
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya nahau inayomaanisha kuwa katika hali mbaya kiafya.
- source_word: ἤμελλεν τελευτᾶν
  choice: karibu kufa
  rationale: μέλλω pamoja na kitenzi-jina hapa huonyesha kwamba kifo kilikuwa kinakaribia. Usemi huu ni wa asili katika Kiswahili.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: naye alikuwa wa thamani sana kwa akida huyo
  rationale: ἔντιμος huonyesha kuthaminiwa sana au kuwa wa thamani. Tafsiri hii huhifadhi heshima na thamani aliyokuwa nayo mbele ya akida bila kulazimisha maana ya hisia za kimapenzi au kifamilia.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mazingira ya utumwa wa nyumbani
  choice: mtumwa
  alternative: mtumishi
  rationale: ‘Mtumwa’ huhifadhi uhusiano wa kisheria na kijamii uliomo katika δοῦλος. ‘Mtumishi’ linaweza kueleweka kama mfanyakazi wa hiari na hivyo kupunguza kipengele hicho; hata hivyo, limewekwa katika tanbihi kama tafsiri nyingine inayowezekana kulingana na matumizi ya neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili; ‘akida huyo’ imejirudia ili kuondoa utata wa kiwakilishi.
