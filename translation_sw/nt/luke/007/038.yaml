id: LUK.7.38
reference: Luke 7:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: sw
  text: Naye akasimama nyuma yake, kando ya miguu yake, huku akilia. Akaanza kulowesha miguu yake kwa machozi yake, huku akiifuta kwa nywele za kichwa chake. Aliendelea kuibusu miguu yake[a] na kuipaka mafuta yenye harufu nzuri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliibusu miguu yake tena na tena”; kitenzi cha Kigiriki kina maana ya msisitizo, na wakati wake unaweza kuonyesha tendo lililoendelea au kurudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “marhamu yenye manukato”; neno la Kigiriki linamaanisha mafuta au marhamu yenye harufu nzuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: akasimama
  rationale: Kitenzi kishirikishi cha aoristi kinaweka tukio katika mfululizo; Kiswahili cha masimulizi hutumia kwa kawaida ‘akasimama’.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: nyuma yake, karibu na miguu yake
  rationale: Huhifadhi maana zote mbili za kuwa nyuma yake na mahali karibu na miguu yake, kwa kuzingatia mkao wa kula mezani wa wakati huo.
- source_word: κλαίουσα
  choice: akilia
  rationale: Hutoa kwa lugha ya kawaida tendo la kulia linaloendelea.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: akaanza kuilowesha ... kwa machozi yake
  rationale: ‘Akaanza’ huhifadhi mwanzo wa tendo, na ‘kuilowesha’ hutoa βρέχειν bila kutia chumvi kuwa kulichovya kabisa.
- source_word: ἐξέμασσεν
  choice: kuifuta
  rationale: Hutoa tendo la kufuta au kukausha; muktadha unaonyesha machozi yalifutwa kwa nywele zake.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: kwa nywele za kichwa chake
  rationale: Huhifadhi usemi kamili na wenye taswira wa Kigiriki huku ukibaki wa asili katika Kiswahili.
- source_word: κατεφίλει
  choice: aliendelea kuibusu
  rationale: Huonyesha tendo linaloendelea au kurudiwa lililodokezwa na imperfect na kitenzi chenye nguvu, bila kuongeza tafsiri ya hisia kama ‘kwa shauku’.
- source_word: ἤλειφεν
  choice: kuipaka
  rationale: Katika muktadha wa miguu na mafuta, ‘kuipaka’ ni ya kawaida na wazi kuliko ‘kuitia mafuta’ au istilahi yenye maana finyu ya kidini.
- source_word: τῷ μύρῳ
  choice: mafuta yenye harufu nzuri
  rationale: μύρον ni mafuta au marhamu yenye manukato; usemi huu unaeleweka kwa urahisi na haudai kimakosa kuwa ni manukato ya kisasa ya majimaji.
theological_decisions:
- issue: Matendo ya mwanamke kwa miguu ya Yesu
  choice: Matendo halisi ya kulowesha, kufuta, kubusu, na kupaka mafuta yamehifadhiwa wazi.
  alternative: Kuyafupisha kwa usemi wa kutafsiri kama ‘alimwonyesha ibada’ au kupunguza ukaribu na marudio ya kubusu.
  rationale: Andiko linasimulia vitendo vya unyenyekevu na hisia kali bila kutoa hapa ufafanuzi wa kidhehebu; tafsiri haipaswi kuongeza wala kupunguza maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa masimulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa kwa mtiririko wa asili, huku matendo yanayoendelea na taswira halisi ya mstari zikihifadhiwa.
