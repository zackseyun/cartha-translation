  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: sw
  text: Lakini mlitoka kwenda kuona nini? Nabii? Ndiyo, nawaambia, na zaidi ya nabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu kikubwa kuliko nabii.” Usemi wa Kigiriki wa kulinganisha unaweza kutafsiriwa hivyo kwa namna iliyo halisi zaidi, lakini “zaidi ya nabii” ni Kiswahili cha asili zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi cha upinzani kinachoendeleza mfululizo wa maswali ya balagha kwa Kiswahili cha kawaida.
- source_word: τί
  choice: nini
  rationale: Kiwakilishi cha kuuliza ni yambwa la tendo la kuona; maana hapa ni “nini,” si “kwa nini.”
- source_word: ἐξήλθατε ἰδεῖν
  choice: mlitoka kwenda kuona
  rationale: Muundo huu unaonyesha kitendo cha kutoka kwa kusudi la kuona, huku ukihifadhi wakati uliopita na wingi wa wanaosemeshwa.
- source_word: προφήτην
  choice: Nabii
  rationale: Nomino ya kawaida iliyotumiwa kwa kudondosha maneno mengine katika swali fupi la balagha.
- source_word: ναί
  choice: Ndiyo
  rationale: Jibu la uthibitisho lililo wazi na la kawaida katika Kiswahili.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Kauli ya moja kwa moja kwa watu wengi, iliyo ya asili katika Kiswahili cha sasa.
- source_word: καὶ περισσότερον προφήτου
  choice: na zaidi ya nabii
  rationale: Inahifadhi kiunganishi na ulinganisho wa Kigiriki bila kufafanua aina hasa ya ukuu unaokusudiwa.
theological_decisions:
- issue: Utambulisho na hadhi ya Yohana Mbatizaji katika maelezo ya Yesu
  choice: Yesu anamthibitisha kuwa nabii na kuwa zaidi ya nabii, bila kutaja katika aya hii hasa jinsi alivyo zaidi.
  alternative: Kusema kwamba ndiye nabii mkuu kuliko wote au kufafanua hapa kwamba ndiye mjumbe wa nyakati za mwisho.
  rationale: Aya yenyewe inatoa kauli fupi ya ulinganisho; ufafanuzi zaidi unatokana na muktadha na haupaswi kuingizwa kimya kimya katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha na kauli fupi yenye mkazo umehifadhiwa.
