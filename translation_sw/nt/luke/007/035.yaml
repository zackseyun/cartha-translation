  language: sw
  text: Lakini hekima ilithibitishwa kuwa sahihi na watoto wake wote[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilionyeshwa kuwa sahihi” au “ilitambuliwa kuwa sahihi.”
    reason: lexical_alternative
  - marker: b
    text: “Watoto” ni sitiari kwa wale wanaoonyesha hekima kuwa sahihi kwa mwitikio wao au mwenendo wao.
