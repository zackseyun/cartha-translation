    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Lakini
  rationale: Katika muktadha huu καί inaonyesha utofautishaji baada ya kukosolewa kwa kizazi hicho; “Lakini” huwasilisha utofautishaji huo kwa Kiswahili cha kawaida.
- source_word: ἐδικαιώθη
  choice: imethibitishwa kuwa ya kweli
  rationale: Hapa δικαιόω haizungumzii kuhesabiwa haki kwa maana ya kimahakama, bali kuonyeshwa au kukubaliwa kuwa sahihi. Kauli hii huhifadhi hali ya kutendwa na maana ya kuthibitishwa hadharani.
- source_word: σοφία
  choice: hekima
  rationale: “Hekima” ndiyo tafsiri ya kawaida na ya moja kwa moja; taswira yake kama mwenye watoto imehifadhiwa.
- source_word: ἀπὸ πάντων
  choice: na ... wote
  rationale: Pamoja na kitenzi cha kutendwa, ἀπό inaweza kuonyesha wahusika au chanzo cha uthibitisho. “Na” ni ya asili katika Kiswahili hapa.
- source_word: τέκνων
  choice: watoto
  rationale: Maana ya moja kwa moja ya τέκνων ni “watoto.” Tafsiri hii huhifadhi sitiari badala ya kuifasiri kama wafuasi, matokeo, au matendo.
- source_word: αὐτῆς
  choice: wake
  rationale: Kiwakilishi humrejelea σοφία. “Wake” huonyesha uhusiano wa watoto na hekima huku ikidumisha uhuishaji wa hekima kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya “watoto” wa hekima
  choice: Sitiari imehifadhiwa katika matini kuu kama “watoto wake.”
  alternative: Matokeo au matunda ya hekima; au kupatanisha usemi huu na “matendo yake” katika Mathayo 11:19.
  rationale: Matini ya Kigiriki ya Luka ina τέκνων, “watoto.” Kuihifadhi huepuka kutatua kimya kimya utata wa sitiari na huwaacha wasomaji waone kwamba hekima inathibitishwa na wale wanaoitikia au kuishi kulingana nayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku sitiari ya “watoto wa hekima,” hali ya kutendwa, na utofautishaji wa muktadha vikihifadhiwa.
