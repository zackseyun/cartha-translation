  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: sw
  text: 'Naye akawajibu, akawaambia, “Nendeni mkamweleze Yohana mambo mliyoona na kuyasikia: vipofu wanaona[a], viwete wanatembea, wenye ukoma wanatakaswa, viziwi wanasikia, wafu wanafufuliwa, na maskini wanatangaziwa habari njema[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vipofu wanaona tena.” Kitenzi cha Kigiriki kinaweza kumaanisha kuona juu, kupata uwezo wa kuona, au kuona tena; hapa kinamaanisha kupata uwezo wa kuona.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “habari njema inahubiriwa kwa maskini.” Kigiriki kimetumia kauli ya kutendwa: maskini wanatangaziwa habari njema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akawajibu
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aliwapa jibu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Nendeni mkamweleze
  rationale: Kirai hiki kinawasilisha tendo la kwenda linaloandamana na amri ya kupeleka taarifa; Kiswahili hutumia kwa kawaida mfuatano wa ‘nendeni mkamweleze.’
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: mambo mliyoona na kuyasikia
  rationale: Huhifadhi mambo mawili yaliyoshuhudiwa, kuona na kusikia, kwa Kiswahili cha kawaida.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: vipofu wanaona
  rationale: Katika muktadha huu ἀναβλέπω humaanisha kupata au kurudishiwa uwezo wa kuona; ‘wanaona’ ni fupi na ya asili, huku tanbihi ikihifadhi uwezekano wa ‘wanaona tena.’
- source_word: χωλοὶ περιπατοῦσιν
  choice: viwete wanatembea
  rationale: Ni ulinganifu wa moja kwa moja unaoeleweka katika Kiswahili sanifu.
- source_word: λεπροὶ καθαρίζονται
  choice: wenye ukoma wanatakaswa
  rationale: ‘Wanatakaswa’ huhifadhi maana pana ya καθαρίζονται inayohusisha kuwa safi, si kuponywa kimwili tu; ‘wenye ukoma’ ni lugha yenye staha.
- source_word: κωφοὶ ἀκούουσιν
  choice: viziwi wanasikia
  rationale: Pamoja na kitenzi ‘kusikia,’ κωφοί hapa humaanisha viziwi.
- source_word: νεκροὶ ἐγείρονται
  choice: wafu wanafufuliwa
  rationale: Kauli ya kutendwa huhifadhi wakala bila kutajwa, kama ilivyo katika Kigiriki.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: maskini wanahubiriwa habari njema
  rationale: Huhifadhi kauli ya kutendwa ya Kigiriki na wazo la kutangaziwa habari njema bila kumtaja wakala.
theological_decisions:
- issue: Orodha ya matendo kama ushahidi wa utambulisho na utume wa Yesu
  choice: Matendo ya kurejesha yamesemwa moja kwa moja bila kuongeza tamko dhahiri kwamba yanatimiza unabii wa Kimasihi.
  alternative: Kuongeza lugha ya utimilifu ili kudhihirisha zaidi madokezo ya Isaya.
  rationale: Aya yenyewe inaagiza matendo yaliyoonekana na kusikiwa yaripotiwe kwa Yohana; haifafanui hitimisho la kitheolojia kwa maneno ya moja kwa moja.
- issue: Kauli za kutendwa katika orodha
  choice: Kutumia ‘wanatakaswa,’ ‘wanafufuliwa,’ na ‘wanahubiriwa’ bila kumtaja mtendaji.
  alternative: Kutaja wazi Mungu au Yesu kuwa ndiye mtendaji.
  rationale: Kigiriki hakimtaji mtendaji katika kauli hizi; kutomtaja kunahifadhi tahadhari na mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wenye ukoma’ limetumiwa badala ya jina linaloweza kuwabana watu katika hali yao. Miundo ya kauli ya kutendwa imehifadhiwa pale inapobeba tahadhari muhimu ya matini.
