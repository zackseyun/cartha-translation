id: LUK.7.46
reference: Luke 7:46
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: sw
  text: Hukupaka kichwa changu mafuta, lakini huyu mwanamke amepaka miguu yangu mafuta yenye harufu nzuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “manukato” au “marhamu yenye harufu nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: mafuta
  rationale: Ni hali ya ala kutoka ἔλαιον. “Mafuta” ni tafsiri ya kawaida na ya asili katika Kiswahili; kutaja “mafuta ya zeituni” kungeongeza ubainisho usiohitajika katika muktadha huu.
- source_word: ἤλειψας / ἤλειψεν
  choice: hukupaka / amepaka
  rationale: ἀλείφω humaanisha kupaka mafuta au marhamu. “Kupaka” ni lugha ya sasa na ya kawaida, na huepuka kuingiza wazo la ibada rasmi ambalo “kutia mafuta” linaweza kudokeza. Wakati timilifu katika “amepaka” unaonyesha kuwa tendo hilo lina umuhimu katika tukio la sasa.
- source_word: κεφαλήν μου
  choice: kichwa changu
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kiwakilishi cha umilikaji.
- source_word: αὕτη δὲ
  choice: lakini huyu mwanamke
  rationale: αὕτη humwelekeza kwa msisitizo mwanamke aliyepo. “Huyu mwanamke” huweka wazi mhusika na kuhifadhi utofautishaji na “wewe” wa kishazi cha kwanza.
- source_word: μύρῳ
  choice: mafuta yenye harufu nzuri
  rationale: μύρον ni mafuta au marhamu yenye manukato. Usemi huu ni wazi kwa wasomaji wa kawaida na huhifadhi utofauti kati ya mafuta ya kawaida na mafuta yenye harufu nzuri.
- source_word: τοὺς πόδας μου
  choice: miguu yangu
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi pamoja na kiwakilishi cha umilikaji.
theological_decisions:
- issue: Utofautishaji wa heshima ya kijamii katika karipio la Yesu
  choice: Kutumia “kupaka” ili kueleza tendo la ukarimu na heshima bila kulipa maana ya lazima ya kuwekwa wakfu kidini.
  alternative: Kutumia “kutia mafuta,” ambako katika baadhi ya miktadha kunaweza kusikika kama tendo rasmi la kidini au kifalme.
  rationale: Muktadha unatofautisha kutotoa kwa mwenyeji tendo la kawaida la heshima na heshima kubwa aliyoonyesha mwanamke. Tafsiri haipaswi kuamua kuwa tendo hili lilikuwa sakramenti au kuwekwa wakfu rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
