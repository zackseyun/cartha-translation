id: LUK.7.5
reference: Luke 7:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: sw
  text: Kwa maana analipenda taifa letu, naye mwenyewe alitujengea sinagogi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alifanya sinagogi lijengwe kwa ajili yetu.” Kigiriki kinasema tu “alijenga”; huenda ikamaanisha kwamba alihusika mwenyewe katika ujenzi au kwamba aliufadhili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: analipenda
  rationale: Kitenzi “kupenda” kinadumisha nguvu ya ἀγαπᾷ bila kuipunguza kuwa nia njema tu; kiambishi “-li-” kinarejelea “taifa letu.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba maneno haya yanatoa sababu ya ombi la wazee katika mstari uliotangulia.
- source_word: τὸ ἔθνος ἡμῶν
  choice: taifa letu
  rationale: “Taifa” linaakisi maana ya jamii ya Kiyahudi kama watu wenye utambulisho wa pamoja, huku “letu” likihifadhi umilikaji ulio wazi katika Kigiriki.
- source_word: τὴν συναγωγήν
  choice: sinagogi
  rationale: “Sinagogi” ni neno la kawaida na mahususi kwa mahali/taasisi ya mikutano ya Kiyahudi; Kigiriki hakina kiwakilishi cha umilikaji hapa.
- source_word: αὐτὸς
  choice: mwenyewe
  rationale: Linahifadhi msisitizo wa kiwakilishi cha Kigiriki kwamba yeye ndiye aliyehusika na ujenzi au ufadhili wake.
- source_word: ᾠκοδόμησεν
  choice: alitujengea
  rationale: Kitenzi hiki kinawasilisha tendo lililokamilika la kujenga, na umbo la kutendea linaunganisha kwa Kiswahili cha kawaida wazo la kujenga kwa manufaa ya jamii; halibainishi ikiwa alifanya kazi mwenyewe au aliifadhili.
- source_word: ἡμῖν
  choice: -tu-...-ea
  rationale: Dhamira ya manufaa ya ἡμῖν imewasilishwa kiasili kwa kiambishi cha mtendewa/manufaa katika “alitujengea,” yaani, alijenga kwa ajili yetu.
theological_decisions:
- issue: Kiwango cha ushiriki wa akida katika ujenzi
  choice: alitujengea
  alternative: alifanya sinagogi lijengwe kwa ajili yetu
  rationale: Kigiriki kinasema tu kwamba yeye “alijenga” kwa ajili yao; tafsiri kuu haipaswi kuamua kama alijenga binafsi au alikuwa mfadhili aliyeagiza ujenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kwa maana” hudumisha uhusiano wa hoja, na “naye mwenyewe” huhifadhi msisitizo wa αὐτός. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
