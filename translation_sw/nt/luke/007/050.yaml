base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: sw
  text: Kisha akamwambia yule mwanamke, “Imani yako[a] imekuokoa[b]; nenda kwa amani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kumtumaini kwako kumekuokoa”; uwezekano mdogo hapa ni “Uaminifu wako umekuokoa.”
    reason: lexical_alternative
  - marker: b
    text: Au “imekuponya.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kunusuru, au kuponya; lakini hapa muktadha unasisitiza msamaha na wokovu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: akamwambia
  rationale: Kitenzi hiki cha kisimulizi kina maana ya ‘alisema’; kwa kuwa kinafuatwa na πρὸς τὴν γυναῖκα, ‘akamwambia’ ni Kiswahili cha kawaida na huonyesha wazi anayeelekezewa maneno.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkubwa. ‘Kisha’ huunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: πρὸς τὴν γυναῖκα
  choice: yule mwanamke
  rationale: γυνή humaanisha mwanamke anayejulikana katika tukio hili, si mke. ‘Yule mwanamke’ hudumisha rejeo lake katika simulizi.
- source_word: Ἡ πίστις σου
  choice: Imani yako
  rationale: Katika muktadha huu πίστις ni mwitikio wake wa kumwamini Yesu. ‘Imani yako’ ni tafsiri wazi na ya kawaida; maana zinazowezekana za kumtumaini na uaminifu zimehifadhiwa katika tanbihi.
- source_word: σέσωκέν σε
  choice: imekuokoa
  rationale: Kauli timilifu ya σῴζω inaonyesha tendo lililotimia lenye matokeo yanayoendelea. Muktadha wa msamaha unaunga mkono ‘imekuokoa,’ huku uwezekano wa ‘imekuponya’ ukihifadhiwa katika tanbihi.
- source_word: πορεύου
  choice: nenda
  rationale: Amri ya πορεύομαι inatafsiriwa kwa kawaida na kwa ufupi kuwa ‘nenda.’
- source_word: εἰς εἰρήνην
  choice: kwa amani
  rationale: Ingawa εἰς kwa msingi huonyesha kuingia au kuelekea, usemi mzima ni nahau ya kuondoka katika hali ya amani. ‘Nenda kwa amani’ ni Kiswahili cha asili na chenye heshima.
theological_decisions:
- issue: Maana ya σῴζω katika uhusiano na msamaha na wokovu
  choice: imekuokoa
  alternative: imekuponya
  rationale: Muktadha mpana wa Luka 7:36–50 unasisitiza msamaha wa dhambi na mwitikio wa imani wa mwanamke. ‘Imekuokoa’ huhifadhi uzito huo bila kudai zaidi ya andiko; maana ya kuponywa, ambayo kitenzi hicho kinaweza kuwa nayo katika miktadha mingine, imeonyeshwa katika tanbihi.
- issue: Maana ya πίστις katika kauli ya Yesu
  choice: imani yako
  alternative: kumtumaini kwako; uaminifu wako
  rationale: Hapa neno linaeleweka zaidi kama imani au kumtumaini Yesu kuliko sifa ya uaminifu wa mwanamke. Tafsiri kuu haifungi kabisa wigo wa neno, na tanbihi huhifadhi tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘akamwambia’ ni wa kawaida katika usimulizi, na ‘nenda kwa amani’ huhifadhi nahau ya kuagana bila kuwa mgumu kupita kiasi.
