base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: sw
  text: Na watu wote waliposikia hayo, pamoja na watoza ushuru, walikiri kwamba Mungu ni mwenye haki,[a] wakiwa wamebatizwa kwa ubatizo wa Yohana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri rasmi zaidi, “walimhesabia Mungu kuwa mwenye haki.” Maana yake ni kwamba walikiri kuwa Mungu alikuwa sahihi.
    reason: lexical_alternative
  - marker: b
    text: 'Kirai hiki kinaweza pia kueleweka kuwa kinaonyesha sababu: “kwa sababu walikuwa wamebatizwa kwa ubatizo wa Yohana.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Kirai hiki cha umoja chenye maana ya jumla kinatafsiriwa kwa Kiswahili cha kawaida kuwa “watu wote,” hivyo kudumisha upana wa maana bila kuwa na muundo usio wa kawaida.
- source_word: ἀκούσας
  choice: waliposikia hayo
  rationale: Kitenzi-jina cha wakati uliopita kinaeleweka hapa kwa maana ya wakati. Neno “hayo” linaonyesha jambo lililosikiwa katika muktadha uliotangulia.
- source_word: οἱ τελῶναι
  choice: watoza ushuru
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili cha sasa kwa watu waliokusanya ushuru.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: walikiri kwamba Mungu ni mwenye haki
  rationale: Hapa δικαιόω haimaanishi kwamba watu walimfanya Mungu awe mwenye haki, bali kwamba walitambua na kukiri kuwa yeye ni mwenye haki na yuko sahihi. Tafsiri hii ni wazi huku ikidumisha maana ya hukumu iliyomo katika neno hilo.
- source_word: βαπτισθέντες
  choice: wakiwa wamebatizwa
  rationale: Muundo huu unadumisha kitenzi-jina tendwa kama hali inayohusiana na tendo kuu bila kulazimisha maana ya sababu au wakati peke yake.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: kwa ubatizo wa Yohana
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaodumisha uhusiano wa ubatizo huo na Yohana.
theological_decisions:
- issue: Maana ya ἐδικαίωσαν τὸν θεόν (“walimhesabia Mungu haki”)
  choice: Watu walikiri kwamba Mungu ni mwenye haki na yuko sahihi.
  alternative: Tafsiri rasmi zaidi ni “walimhesabia Mungu kuwa mwenye haki.”
  rationale: Mstari unaeleza jinsi watu walivyoitikia ujumbe wa Mungu na ubatizo wa Yohana, wala si kwamba walibadili hali ya Mungu au kumfanya awe mwenye haki.
- issue: Nguvu ya kitenzi-jina βαπτισθέντες
  choice: 'Kimetafsiriwa kama hali inayoambatana na tendo kuu: “wakiwa wamebatizwa.”'
  alternative: 'Kinaweza kueleweka kwa maana ya sababu: “kwa sababu walikuwa wamebatizwa kwa ubatizo wa Yohana.”'
  rationale: Muundo wa Kigiriki unaweza kudokeza sababu katika muktadha, lakini haulazimishi maana hiyo. Tafsiri kuu inadumisha uhusiano bila kuamua sintaksia kupita ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Pamoja na” inaonyesha kwamba watoza ushuru walikuwa miongoni mwa watu hao bila kuongeza msisitizo usiokuwamo katika Kigiriki.
