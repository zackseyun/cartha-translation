  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: sw
  text: Aliposikia habari za Yesu, aliwatuma wazee wa Wayahudi kwa Yesu, akimwomba aje amwokoe mtumwa wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi wake.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi” kulingana na muktadha; hapa “mtumwa” limetumiwa kuhifadhi hali ya utumwa inayodokezwa na neno hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Aliposikia
  rationale: Kitenzi hiki cha utegemezi kinaonyesha jambo lililotangulia tendo kuu; “aliposikia” ni Kiswahili cha kawaida na huhifadhi uhusiano wa wakati.
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi hafifu; mtiririko wa sentensi ya Kiswahili unaonyesha muungano huo bila kulazimisha “lakini” au “basi.”
- source_word: περὶ τοῦ Ἰησοῦ
  choice: habari za Yesu
  rationale: Usemi huu wa kawaida wa Kiswahili unamaanisha kusikia kumhusu Yesu.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: aliwatuma ... waende kwa Yesu
  rationale: Muundo huu unabainisha kwa kawaida kwamba wazee ndio waliotumwa kwa Yesu, bila kuongeza kwamba walikuwa “wajumbe” ingawa walitekeleza kazi hiyo.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: wazee wa Wayahudi
  rationale: “Wazee” hapa hurejelea viongozi wanaotambulika katika jamii, na umilikishi “wa Wayahudi” hufuata uhusiano wa maneno ya Kigiriki bila kuufanya kuwa rasmi zaidi kuliko andiko.
- source_word: ἐρωτῶν αὐτὸν
  choice: wakimwomba
  rationale: Katika muktadha huu ἐρωτάω ina maana ya kutoa ombi kwa heshima; “wakimwomba” ni ya asili kuliko “wakimuuliza.” Wingi unapatana na wazee waliotumwa kutekeleza ombi la akida.
- source_word: ὅπως ἐλθὼν
  choice: aje
  rationale: Huhifadhi maudhui na kusudi la ombi kwa muundo mfupi na wa kawaida wa Kiswahili.
- source_word: διασώσῃ
  choice: amwokoe
  rationale: διασῴζω inaweza kumaanisha kuokoa, kunusuru, au katika muktadha wa ugonjwa kuponya. “Amwokoe” huhifadhi upana wa neno huku muktadha ukionyesha hatari ya ugonjwa.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: mtumwa wake
  rationale: “Mtumwa” huhifadhi hali ya mtu aliyekuwa chini ya mamlaka na umiliki wa akida katika mfumo wa kijamii wa wakati huo; “mtumishi” linaweza kuficha hali hiyo.
theological_decisions:
- issue: Maana ya δοῦλος katika mazingira ya nyumba ya akida
  choice: mtumwa
  alternative: mtumishi
  rationale: Andiko linaonyesha mtu aliye chini ya mamlaka ya akida, na δοῦλος kwa kawaida hubeba hali ya utumwa, si huduma ya hiari tu. Hata hivyo, “mtumishi” linawekwa katika tanbihi kwa kuwa linawezekana pale mkazo unapokuwa juu ya kazi au uhusiano wa nyumbani.
- issue: Maana ya διασώσῃ katika muktadha wa ugonjwa
  choice: amwokoe
  alternative: amponye
  rationale: Neno la Kigiriki lina maana pana kuliko uponyaji pekee, ingawa ugonjwa katika muktadha unafanya uponyaji uwe matokeo yanayokusudiwa. Tafsiri haipaswi kulifanya hapa kuwa neno la kiufundi la wokovu wa kiroho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa jina “Yesu” kunaondoa utata wa viwakilishi unaoweza kutokea katika Kiswahili. Alama ya tanbihi imewekwa baada ya “mtumwa wake,” ambapo tofauti ya tafsiri inahusika.
