  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: sw
  text: Heri yule asiyejikwaa kwa sababu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiyekwazwa nami,” au “asiyechukizwa nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: amebarikiwa
  rationale: Huhifadhi uzito wa kidini wa kauli ya heri/baraka ya Yesu; katika muundo huu, ‘amebarikiwa’ ni ya asili na yenye hadhi kuliko ‘ana furaha.’
- source_word: ὃς ἐὰν μή
  choice: yule ambaye ha-
  rationale: Huwasilisha kiwakilishi cha mtu mmoja kama mwakilishi pamoja na sharti la jumla kwa Kiswahili cha sasa na cha asili.
- source_word: σκανδαλισθῇ
  choice: hajikwazi
  rationale: Huhifadhi picha ya kujikwaa na uwezekano wa kuchukizwa au kuanguka kiimani bila kuifunga maana katika hisia za kukasirika pekee. Ingawa Kigiriki kina umbo la kutendwa, Kiswahili hutumia kitenzi cha kujirejelea kwa ufasaha katika nahau hii.
- source_word: ἐν ἐμοί
  choice: kwa sababu yangu
  rationale: Katika nahau hii, ἐν ἐμοί humtaja Yesu kuwa sababu au chanzo cha tukio la kujikwaa; tafsiri hii ni wazi na ya asili kuliko ‘ndani yangu.’
theological_decisions:
- issue: Hatari ya kupunguza maana ya kukwazwa na Yesu kuwa kutokubaliana au kukasirika tu
  choice: 'Kuhifadhi taswira ya kujikwaa: ‘hajikwazi kwa sababu yangu’'
  alternative: ‘hachukizwi nami’ au ‘haanguki kwa sababu yangu’
  rationale: Kauli hiyo inahusisha kuchukizwa na Yesu kwa namna inayoweza kuwa kikwazo cha imani. ‘Kujikwaa’ huhifadhi mvutano huo bila kuamua kwamba maana ni hisia tu au kuasi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Naye’ huendeleza καί ya mwanzo kwa mtiririko wa kifungu.
