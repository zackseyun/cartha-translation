base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: sw
  text: Hukunipa busu[a], lakini mwanamke huyu, tangu nilipoingia, hajaacha kuibusu miguu yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “busu la salamu”; busu lilikuwa tendo la kawaida la kumkaribisha mgeni.
    reason: cultural_note
  - marker: b
    text: 'Kitenzi hiki kinaweza kudokeza kubusu kwa upendo au kwa kurudia-rudia: “kuifunika miguu yangu kwa mabusu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά μοι οὐκ ἔδωκας
  choice: Hukunipa busu
  rationale: Muundo huu unahifadhi picha ya Kigiriki ya ‘kumpa mtu busu’ huku ukiwa wazi na wa kawaida katika Kiswahili. Busu la salamu linaelezwa katika tanbihi bila kuingizwa moja kwa moja katika matini.
- source_word: αὕτη δὲ
  choice: lakini ... mwanamke huyu
  rationale: Kiashiria αὕτη kinamrejelea mwanamke aliyepo katika tukio na kinamweka katika utofauti na mwenyeji; ‘mwanamke huyu’ huifanya rejea hiyo iwe wazi kwa Kiswahili cha kawaida.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: tangu nilipoingia
  rationale: Tafsiri hii inatoa maana ya wakati ya kirai hicho kwa Kiswahili cha asili na bila kuongeza mahali pasipotajwa wazi.
- source_word: οὐ διέλιπεν
  choice: hajaacha
  rationale: Kauli ya wakati timilifu inaonyesha kwamba tendo lilianza Yesu alipoingia na likaendelea mpaka wakati wa kusema.
- source_word: καταφιλοῦσά μου τοὺς πόδας
  choice: kuibusu miguu yangu
  rationale: Kitenzi καταφιλέω kinaweza kudokeza busu za upendo au za kurudiwa. Matini kuu inatumia ‘kuibusu,’ nayo tanbihi inahifadhi nguvu hiyo ya kitenzi bila kulazimisha tafsiri moja.
theological_decisions:
- issue: Maana ya kitamaduni ya busu
  choice: Kutaja tendo lenyewe katika matini na kueleza desturi ya ukarimu katika tanbihi.
  alternative: Hukunipa busu la salamu
  rationale: Kigiriki kinataja busu bila kulifafanua moja kwa moja kuwa la salamu. Uamuzi huu unahifadhi tofauti kati ya maneno ya matini na maelezo ya kitamaduni.
- issue: Nguvu ya kitenzi καταφιλέω
  choice: Kutumia ‘kuibusu’ katika matini na kutaja uwezekano wa busu za kurudiwa au za upendo katika tanbihi.
  alternative: kuifunika miguu yangu kwa busu
  rationale: Kitenzi kinaweza kuwa na nguvu zaidi kuliko ‘kubusu’ tu, lakini kiwango halisi cha msisitizo hakipaswi kufungwa kwa namna moja katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha utofauti kati ya mwenyeji ambaye hakutoa busu na mwanamke ambaye aliendelea kuibusu miguu ya Yesu.
