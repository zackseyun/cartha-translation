  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: sw
  text: 'Baada ya wajumbe wa Yohana kuondoka, alianza kusema kwa makutano kuhusu Yohana: “Mlitoka kwenda nyikani kutazama[a] nini? Mwanzi unaotikiswa na upepo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuona” au “kutazama kwa makini.”
    reason: Neno la Kigiriki linaweza kumaanisha kuona au kutazama kwa makini.
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Baada ya ... kuondoka
  rationale: Kirai hiki cha kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba wajumbe waliondoka kabla Yesu hajaanza kusema.
- source_word: ἀγγέλων
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Yohana, si viumbe wa mbinguni.
- source_word: Ἰωάννου
  choice: wa Yohana / kuhusu Yohana
  rationale: Huwakilisha umilikaji katika sehemu ya kwanza na mhusika anayezungumziwa katika sehemu ya pili.
- source_word: ἤρξατο λέγειν
  choice: alianza kusema
  rationale: Inahifadhi maana ya kuanza kwa hotuba bila kuongeza mhusika ambaye Kigiriki hakumtaji moja kwa moja.
- source_word: πρὸς τοὺς ὄχλους
  choice: na umati wa watu
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kueleza kusema kwa watu wengi waliokusanyika; ingawa Kigiriki kina wingi, Kiswahili hutumia kwa kawaida nomino ya mkusanyiko ‘umati wa watu.’
- source_word: περὶ Ἰωάννου
  choice: kuhusu Yohana
  rationale: Hutoa maana ya kawaida ya kusema juu ya mtu fulani.
- source_word: Τί ἐξήλθατε
  choice: Mlitoka ... nini?
  rationale: Τί inauliza kitu walichokwenda kukitazama, si sababu yao hasa.
- source_word: εἰς τὴν ἔρημον
  choice: kwenda nyikani
  rationale: ‘Nyikani’ hueleza eneo lisilokaliwa sana linalohusishwa na huduma ya Yohana, bila kulazimisha picha ya jangwa la mchanga.
- source_word: θεάσασθαι
  choice: kutazama
  rationale: Neno hili linaweza kumaanisha kuona au kutazama kwa makini; ‘kutazama’ ni la kawaida na linadumisha lengo la kwenda kwao.
- source_word: κάλαμον
  choice: mwanzi
  rationale: Ni mmea unaonyumbishwa kwa urahisi, hivyo picha halisi na nguvu yake ya kisitiari zinahifadhiwa.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: unaotikiswa na upepo
  rationale: Huwasilisha kwa uwazi mwendo wa mwanzi unaosababishwa na upepo na kudumisha nguvu ya swali la balagha.
theological_decisions:
- issue: Nguvu ya kisitiari ya swali la balagha kuhusu Yohana
  choice: Kudumisha picha halisi, “Mwanzi unaotikiswa na upepo?”
  alternative: Mtu dhaifu au anayebadilika-badilika?
  rationale: Andiko lenyewe linatoa picha na kuwaachia wasikilizaji waelewe maana yake kuhusu Yohana; tafsiri haipaswi kufafanua sitiari ndani ya matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyikani’ na ‘mwanzi’ ni maneno yanayoeleweka kwa urahisi na yanahifadhi mazingira pamoja na picha ya asili. Kiashiria cha tanbihi [a] kimewekwa moja kwa moja baada ya neno linalohusika.
