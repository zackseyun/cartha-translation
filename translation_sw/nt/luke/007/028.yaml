id: LUK.7.28
reference: Luke 7:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: sw
  text: Nawaambia,[a] kati ya waliozaliwa na wanawake[b] hakuna aliye mkuu kuliko Yohana; lakini aliye mdogo zaidi[c] katika ufalme wa Mungu ni mkuu kuliko yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “Ninawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “waliozaliwa na wanawake” ni nahau inayowarejelea wanadamu kwa ujumla.
    reason: cultural_note
  - marker: c
    text: Au “yule aliye mdogo zaidi katika ufalme wa Mungu.” Muundo wa Kigiriki unaweza kutafsiriwa wazi zaidi kwa kishazi hiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Nawaambia
  rationale: Kauli ya moja kwa moja na ya kawaida katika Kiswahili cha sasa; inahifadhi nguvu ya usemi wa wakati wa sasa wa Kigiriki.
- source_word: μείζων
  choice: mkuu kuliko
  rationale: Inahifadhi ulinganisho bila kufafanua isivyostahili ikiwa ukuu huu ni wa cheo, umuhimu, au sifa nyingine.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: kati ya waliozaliwa na wanawake
  rationale: Tafsiri ya karibu na matini inayohifadhi ladha ya nahau ya Kisemiti huku ikieleweka kwa wasomaji wa Kiswahili.
- source_word: Ἰωάννου
  choice: Yohana
  rationale: Jina la kibiblia lililozoeleka katika Kiswahili.
- source_word: οὐδείς ἐστιν
  choice: hakuna aliye
  rationale: Muundo wa Kiswahili wa kawaida unaowasilisha wazi kauli ya kutokuwapo kwa mtu anayemzidi Yohana.
- source_word: ὁ δὲ μικρότερος
  choice: lakini aliye mdogo zaidi
  rationale: Kivumishi linganishi chenye kibainishi kinatumika kama nomino. Muundo huu huhifadhi maana ya ulinganisho na marejeo ya mtu bila kuigeuza kuwa superlative kali kupita kiasi.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: Ni usemi wa kawaida wa kibiblia katika Kiswahili na unahifadhi muundo wa mahali wa ἐν.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ni mkuu kuliko yeye
  rationale: Huwasilisha ulinganisho na Yohana kwa Kiswahili sanifu bila kuongeza msingi wa ukuu huo.
theological_decisions:
- issue: Maana ya ulinganisho kati ya Yohana na aliye mdogo zaidi katika ufalme wa Mungu
  choice: Kuhifadhi ulinganisho wa kushangaza bila kueleza ukuu huo unahusu nini hasa.
  alternative: Kuutafsiri ukuu kama fursa ya agano, hadhi ya kiroho, ubora wa maadili, au nafasi katika historia ya ukombozi.
  rationale: Matini ya Kigiriki haitaji msingi wa ulinganisho. Tafsiri haipaswi kuingiza ufafanuzi wa kimadhehebu wala kutatua mvutano wa kiteolojia uliopo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa asili huku nahau ya chanzo na fumbo la ulinganisho vikihifadhiwa.
