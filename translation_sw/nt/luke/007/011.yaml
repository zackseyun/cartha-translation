  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: sw
  text: Ikawa siku iliyofuata Yesu akaenda katika mji ulioitwa Naini[a]. Wanafunzi wake na umati mkubwa walikuwa wakienda pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “muda mfupi baadaye” badala ya “siku iliyofuata.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuanzisha tukio; “Ikawa” ni ya kifasihi lakini bado inaeleweka katika masimulizi ya Biblia.
- source_word: ἐν τῷ ἑξῆς
  choice: siku iliyofuata
  rationale: Katika muktadha huu kifungu hicho kinaelekea kumaanisha siku iliyofuata; tofauti ya maandishi inayosema “muda mfupi baadaye” imeelezwa katika tanbihi.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: Hutoa kwa kawaida tendo la kwenda katika mfululizo wa simulizi.
- source_word: εἰς πόλιν
  choice: katika mji
  rationale: πόλις inaweza kuwa mji mkubwa au mdogo; “mji” ni neno la kawaida na linalofaa kwa Naini, huku “katika” likidokeza kuingia kulikomo katika εἰς.
- source_word: καλουμένην Ναΐν
  choice: ulioitwa Naini
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutaja jina la mahali; Ναΐν limetoholewa kuwa “Naini” kwa mujibu wa matumizi yaliyozoeleka ya Kiswahili.
- source_word: συνεπορεύοντο
  choice: walikuwa wakienda pamoja naye
  rationale: Muundo huu unahifadhi hali endelevu ya kitenzi cha wakati usiotimilika pamoja na wazo la kuandamana naye safarini.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Wanafunzi wake
  rationale: Ni tafsiri ya kawaida, wazi na ya asili ya kirai hiki.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: “Umati” hutoa maana ya kundi kubwa la watu, na “mkubwa” huakisi πολύς.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Jina “Yesu” limewekwa wazi badala ya kiwakilishi pekee ili sentensi ijisimamie kwa kawaida katika Kiswahili bila kubadili rejeleo la Kigiriki.
