  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: sw
  text: Walipofika kwa Yesu, walimsihi kwa bidii wakisema, “Anastahili umfanyie jambo hili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: walipofika
  rationale: Kirai hiki cha hali kinaonyesha kufika kwao kwa Yesu; “walipofika” ni Kiswahili cha kawaida na huonyesha uhusiano wa wakati na kitenzi kikuu.
- source_word: παρεκάλουν
  choice: walimsihi
  rationale: Katika muktadha huu παρακαλέω ni kutoa ombi la heshima lakini lenye msisitizo. “Walimsihi” huhifadhi uzito wa ombi bila kulifanya kuwa amri.
- source_word: σπουδαίως
  choice: kwa bidii
  rationale: Kielezi hiki huonyesha juhudi, uzito, na dhati. “Kwa bidii” ni usemi wa asili unaoeleza namna walivyomsihi.
- source_word: Ἄξιός
  choice: anastahili
  rationale: ἄξιος hapa humtathmini mtu kuwa mwenye kustahili jambo analoombewa; “anastahili” ni wazi na ya kawaida kuliko tafsiri ngumu zaidi ya neno kwa neno.
- source_word: ᾧ
  choice: umfanyie
  rationale: Kiwakilishi cha urejeshi katika hali ya dative kinamrejelea yule jemadari. Kiambishi “-m-” pamoja na hali ya kutendea katika “umfanyie” huonyesha kwa kawaida kwamba jambo linafanywa kwa ajili yake.
- source_word: παρέξῃ
  choice: umfanyie
  rationale: παρέχω inaweza kumaanisha kutoa, kumpatia, au kutenda jambo kwa mtu. Katika Kiswahili, “umfanyie jambo hili” ni ya asili na hufaa kwa ombi linalorejelewa bila kuliongeza maelezo.
- source_word: τοῦτο
  choice: jambo hili
  rationale: τοῦτο hurejelea tendo lililoombwa katika muktadha. “Jambo hili” huhifadhi urejeleo huo kwa uwazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “anastahili umfanyie jambo hili” huhifadhi dai la wazee kuhusu kustahili kwa jemadari bila kuongeza msingi wa dai hilo au kulitatua kitheolojia.
