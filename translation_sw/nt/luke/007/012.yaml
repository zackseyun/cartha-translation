  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: sw
  text: Alipokaribia lango la mji, tazama, mtu aliyekufa alikuwa akichukuliwa kwenda nje; alikuwa mwana pekee wa mama yake[a], na mama huyo alikuwa mjane, huku umati mkubwa wa watu wa mjini ukiwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wake mmoja tu.”
    reason: Njia nyingine halali ya kutafsiri μονογενής kwa kusisitiza kwamba hakuwa na mwana mwingine.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Alipokaribia
  rationale: Muundo huu unaonyesha wakati na tendo la kumwelekea lango kwa Kiswahili cha kawaida; nguvu hafifu ya δέ inaendelezwa na mtiririko wa simulizi bila kulazimisha kiunganishi tofauti.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: lango la mji
  rationale: Ni usemi wa kawaida na sahihi kwa lango la kuingilia au kutoka katika mji.
- source_word: καὶ ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha dhima ya ἰδού ya kuvuta fikira kwenye tukio la ghafula, ingawa lina ladha rasmi inayofaa simulizi la Biblia.
- source_word: ἐξεκομίζετο
  choice: alikuwa akichukuliwa kwenda nje
  rationale: Hali ya kuendelea ya kitenzi cha wakati uliopita inadumishwa, na ‘kwenda nje’ inaonyesha wazi kuwa msafara ulikuwa ukitoka mjini.
- source_word: τεθνηκώς
  choice: mtu aliyekuwa amekufa
  rationale: Hii inaonyesha hali ya mtu baada ya kufa bila kutumia ‘maiti,’ ambalo linaweza kupunguza uzito wa kibinadamu wa simulizi.
- source_word: μονογενὴς υἱός
  choice: mwana pekee
  rationale: Katika muktadha huu μονογενής humaanisha kwamba huyu ndiye mwana wa pekee wa mama yake; haitumiki hapa kwa maana maalumu ya Kikristo kuhusu Kristo.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: wa mama yake
  rationale: Dativu inaonyesha uhusiano—alikuwa mwana pekee wa mama huyo—na Kiswahili huueleza kwa kiunganishi ‘wa.’
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: naye mama huyo alikuwa mjane
  rationale: Kutaja tena ‘mama huyo’ kunaondoa utata wa kiwakilishi na kudumisha mkazo wa αὐτή juu ya hali yake.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: umati mkubwa wa watu kutoka mjini
  rationale: ἱκανός hapa huonyesha idadi kubwa au ya kutosha kuonekana; ‘umati mkubwa’ ni Kiswahili cha asili kisichotia chumvi, na ‘kutoka mjini’ huonyesha asili ya umati.
- source_word: ἦν σὺν αὐτῇ
  choice: ulikuwa pamoja naye
  rationale: Hii inadumisha moja kwa moja wazo la kuandamana naye bila kuongeza maelezo ambayo hayajasemwa wazi.
theological_decisions:
- issue: Maana ya μονογενής katika muktadha usio wa Kikristo moja kwa moja
  choice: mwana pekee
  alternative: mwana wake mmoja tu
  rationale: Hapa neno linaeleza uhusiano wa kifamilia wa mjane na mwanawe, si fundisho maalumu kuhusu Kristo. Tafsiri kuu ni fupi na ya kawaida, huku tanbihi ikihifadhi njia nyingine ya kueleza upekee huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa ili simulizi lisomeke kwa urahisi, huku ‘tazama’ ikihifadhi ishara ya ghafla ya maandishi ya Kigiriki. Alama ya tanbihi imewekwa baada ya maneno yanayohusika moja kwa moja.
