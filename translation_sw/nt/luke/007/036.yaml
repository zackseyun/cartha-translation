base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: sw
  text: Mmoja wa Mafarisayo alikuwa akimwomba ale pamoja naye[a]. Baada ya kuingia nyumbani mwa yule Farisayo, Yesu akajiegemeza mezani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “akimwomba ili ale pamoja naye.”
    reason: lexical_alternative
  - marker: b
    text: 'Yaani, alichukua mkao uliokuwa wa kawaida wakati wa karamu rasmi: kula akiwa amejiegemeza badala ya kuketi wima.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: alikuwa akimwomba
  rationale: Kauli ya wakati uliopita usiotimilika inadokeza tendo lililoendelea; muundo huu unahifadhi hali hiyo bila kuifanya moja kwa moja kuwa ‘alimwalika.’
- source_word: δέ
  choice: —
  rationale: Ni kiunganishi hafifu cha kusogeza simulizi mbele; katika Kiswahili hapa hakihitaji kutafsiriwa kwa neno maalumu.
- source_word: τις ... τῶν Φαρισαίων
  choice: mmoja wa Mafarisayo
  rationale: Huu ni muundo wa sehemu ya kundi, na tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: ale pamoja naye
  rationale: Inahifadhi maana ya ombi lenye kusudi bila kutumia neno lenye tafsiri pana zaidi la ‘kumwalika.’
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: Baada ya kuingia nyumbani mwa yule Farisayo
  rationale: Kirai cha kitenzi kishirikishi kinaonyesha kuwa kuingia kulitangulia tendo kuu; ‘nyumbani’ ni Kiswahili asilia kwa makao ya mtu.
- source_word: κατεκλίθη
  choice: akakaa kula akiwa amejiegemeza
  rationale: Kitenzi kinarejelea mkao wa kuegemea wakati wa chakula; tafsiri hii huepuka kutoa picha isiyo sahihi ya kuketi wima au kujilaza juu ya meza.
