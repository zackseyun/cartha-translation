  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Jina ‘Yesu’ limetajwa katika sentensi ya pili ili kuondoa utata wa kiwakilishi katika Kiswahili; haliongezi mhusika mpya. Alama zote za tanbihi zimewekwa katika matini kuu.
