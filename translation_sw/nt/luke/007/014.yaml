base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: sw
  text: Kisha akakaribia, akagusa machela ya maiti[a]. Wabebaji wakasimama. Naye akasema, “Kijana, ninakuambia, inuka!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeneza.” Neno la Kigiriki linamaanisha machela au kitanda cha kubebea maiti katika msafara wa mazishi; si lazima liwe jeneza lililofungwa kama yale ya kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akakaribia
  rationale: Kitenzi hiki kinaonyesha Yesu alisogea karibu kabla ya kugusa machela. “Akakaribia” ni Kiswahili cha kawaida na kinahifadhi mfuatano wa matendo.
- source_word: ἥψατο
  choice: akagusa
  rationale: Katika muktadha huu neno linaweza kumaanisha kugusa au kushika. “Akagusa” haliongezi wazo la kushika kwa muda ambalo maandishi hayalazimishi.
- source_word: σοροῦ
  choice: machela ya maiti[a]
  rationale: Neno hili linataja chombo au kitanda cha kubebea maiti katika msafara wa mazishi, si lazima jeneza lililofungwa la kisasa. Tafsiri hii inaeleza kifaa hicho kwa uwazi.
- source_word: οἱ δὲ βαστάζοντες
  choice: wale waliokuwa wameyabeba
  rationale: Kirai hiki kinawataja watu waliokuwa wakibeba machela. Kiwakilishi cha yambwa “-ya-” kinarejelea “machela” kwa njia ya kawaida katika Kiswahili.
- source_word: ἔστησαν
  choice: wakasimama
  rationale: Hapa kitenzi kinaonyesha kwamba wabebaji waliacha kusonga na kubaki mahali. “Wakasimama” kinabeba maana hiyo kwa ufupi na kwa kawaida.
- source_word: Νεανίσκε
  choice: Kijana
  rationale: Hii ni namna ya moja kwa moja ya kumwita mwanamume kijana, na ni ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: σοὶ λέγω
  choice: ninakuambia
  rationale: Huhifadhi msisitizo wa Yesu kumwelekezea kijana maneno yake moja kwa moja bila kuongeza maelezo.
- source_word: ἐγέρθητι
  choice: inuka
  rationale: Amri hii inaweza kueleweka kama kuinuka au kuamshwa. “Inuka” ni amri ya moja kwa moja, ya heshima na yenye uzito unaofaa katika tukio hili.
theological_decisions:
- issue: Namna ya kutafsiri amri ya Yesu kwa kijana aliyekufa
  choice: “inuka”
  alternative: “amka” au “uinuliwe”
  rationale: “Inuka” huhifadhi amri ya moja kwa moja na mamlaka ya maneno ya Yesu bila kuingiza ufafanuzi wa ziada kuhusu namna muujiza ulivyotokea. Pia huepuka kufanya amri hiyo isikike kama kauli ya kutendwa isiyo ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ni mwepesi kueleweka, huku maneno ya Yesu yakibaki ya moja kwa moja na yenye uzito.
