lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo wa ukoo wa Luka, kiambishi cha umilikaji kinachorudiwa pamoja na kila jina kinaendeleza kwa ufupi maana ya uhusiano wa mwana na mzazi. Kutaja “mwana wa” kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: Μαθουσαλά
  choice: Methusela
  rationale: Hili ni umbo la jina linalotambulika katika mapokeo ya Biblia ya Kiswahili na linamtambulisha wazi mtu anayelingana na yule wa ukoo wa Agano la Kale.
- source_word: Ἑνώχ
  choice: Henoko
  rationale: Umbo la kawaida la jina hili katika Biblia ya Kiswahili, linalosomeka kwa urahisi na kumtambulisha mtu husika.
- source_word: Ἰάρετ
  choice: Yaredi
  rationale: Umbo la Kibiblia lililozoeleka katika Kiswahili, huku likiwakilisha jina la Kigiriki kwa namna inayotamkika kiasili.
- source_word: Μαλελεήλ
  choice: Mahalaleli
  rationale: Umbo linalotambulika la jina la mhusika wa ukoo wa Mwanzo limetumiwa ili msomaji aone uhusiano huo bila kupoteza utambulisho wa jina.
- source_word: Καϊνάμ
  choice: Kainamu
  rationale: Uhawilishaji huu unafuata kwa karibu umbo la jina lililomo katika maandishi ya Kigiriki ya Luka, badala ya kulisawazisha kimya kimya na umbo la ukoo wa Agano la Kale.
theological_decisions:
- issue: Ufupisho wa ukoo katika viambishi vya umilikaji vinavyorudiwa
  choice: Kurudia “mwana wa” mbele ya kila jina
  alternative: Kutumia mfululizo wa “wa” pekee
  rationale: Maana ya uhusiano wa ukoo inaeleweka kutokana na muktadha wa Kigiriki. Kuiweka wazi kunaleta Kiswahili cha kawaida bila kuongeza dai la kiteolojia lisilokuwamo katika kifungu.
- issue: Jinsi ya kuandika Καϊνάμ katika ukoo wa Luka
  choice: Kuweka “Kainamu” katika matini kuu
  alternative: Kainani au Kenani
  rationale: Matini ya Kigiriki ina jina Καϊνάμ; kwa hiyo limedumishwa badala ya kusawazishwa na maumbo ya majina yanayopatikana katika mapokeo fulani ya Agano la Kale. Maumbo mengine yametajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na ulio wazi. Kurudiwa kwa “mwana wa” kunahifadhi muundo wa nasaba na kufanya uhusiano wa kila jina ueleweke. Alama ya tanbihi imewekwa baada ya jina Kainamu, ambalo ndilo linalohusika na maelezo hayo.
