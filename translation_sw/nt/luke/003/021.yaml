  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: sw
  text: Ikawa, watu wote walipobatizwa, Yesu naye akiwa amebatizwa na akiomba, mbingu zikafunguka[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga likafunguka.” Neno la Kigiriki linaweza kumaanisha anga linaloonekana au mbingu; katika muktadha huu wa ufunuo, “mbingu” inafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Kauli hii ya kisimulizi huendeleza simulizi kwa njia ya kawaida bila kuongeza neno la wazi linalomaanisha ‘sasa.’
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: watu wote walipobatizwa
  rationale: Muundo wenye ἐν na kitenzi-jina una maana ya wakati; ‘walipobatizwa’ ni Kiswahili cha kawaida kinachodumisha maana hiyo.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: Yesu naye akiwa amebatizwa
  rationale: ‘Naye’ inadumisha nguvu ya nyongeza ya καί, huku ‘akiwa amebatizwa’ ikihifadhi hali iliyotangulia tendo la kuomba bila kuifanya kuwa kitenzi kikuu.
- source_word: καὶ προσευχομένου
  choice: na akiomba
  rationale: Hii huonyesha tendo linaloendelea wakati mbingu ilipofunguka.
- source_word: ἀνεῳχθῆναι
  choice: ikafunguka
  rationale: Kiswahili hutumia kwa kawaida umbo la kitendo lisilo la kutendwa kwa kitu kinachofunguka; tafsiri hii haiongezi wazo lenye nguvu zaidi la kupasuka.
- source_word: τὸν οὐρανὸν
  choice: mbingu
  rationale: Katika muktadha huu wa ufunuo, ‘mbingu’ huelekeza kwa kufaa kwenye makao ya Mungu, huku uwezekano wa maana ya anga ukitajwa katika tanbihi.
theological_decisions:
- issue: Maana ya οὐρανός katika tukio la ubatizo
  choice: mbingu
  alternative: anga
  rationale: Muktadha unaofuata wa kushuka kwa Roho na sauti ya Mungu unaunga mkono maana ya ‘mbingu,’ lakini neno la Kigiriki linaweza pia kumaanisha anga linaloonekana; uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unadumisha mfuatano wa matendo katika Kigiriki na kuacha aya iendelee hadi inayofuata kwa koma ya mwisho.
