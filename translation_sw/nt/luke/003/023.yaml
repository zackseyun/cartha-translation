base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: sw
  text: Naye Yesu mwenyewe, alipoanza[a], alikuwa na karibu miaka thelathini, akiwa mwana—kama ilivyodhaniwa[b]—wa Yosefu, wa Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akianza.” Kigiriki hakisemi wazi “huduma yake,” ingawa muktadha unaashiria maana hiyo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa kawaida watu walimwona Yesu kuwa mwana wa Yosefu.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka tukio la ubatizo; “Naye” ni cha kawaida na cha asili katika Kiswahili.
- source_word: αὐτὸς
  choice: mwenyewe
  rationale: Kinahifadhi msisitizo wa kiwakilishi cha Kigiriki katika maneno “Yesu mwenyewe.”
- source_word: ἀρχόμενος
  choice: alipoanza
  rationale: Ni usemi wa asili unaohifadhi wazo la kuanza bila kuongeza “huduma yake,” maneno ambayo hayapo wazi katika Kigiriki.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: alikuwa na umri wa karibu miaka thelathini
  rationale: Huu ni usemi wa kawaida wa kutaja umri na unahifadhi makadirio yanayoonyeshwa na ὡσεὶ.
- source_word: ὢν υἱός
  choice: akiwa ... mwana
  rationale: “Akiwa” hudumisha uhusiano wa kishiriki na taarifa inayotangulia, huku “mwana” ikitambulisha nasaba.
- source_word: ὡς ἐνομίζετο
  choice: kama ilivyodhaniwa
  rationale: Inaonyesha kwamba huo ulikuwa mtazamo wa watu, si dai la moja kwa moja la Luka kuhusu ubaba wa kibayolojia.
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: Ni umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: τοῦ Ἠλὶ
  choice: mwana wa Eli
  rationale: Kigiriki kinaendeleza mfululizo wa vimilikishi vya nasaba kwa kuacha neno “mwana”; kuliongeza hapa kunafanya maana iwe wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa maneno “kama ilivyodhaniwa” na kuitwa kwa Yesu mwana wa Yosefu
  choice: Maneno hayo yamewekwa kama maelezo ya kati yanayostahili kuitwa kwa Yesu mwana wa Yosefu.
  alternative: Kuyatia katika mtiririko bila kutenganishwa, au kuyafafanua wazi kuwa Yosefu alikuwa baba wa kisheria tu.
  rationale: Muundo huu unaonyesha dhana ya watu kuhusu uhusiano wa Yesu na Yosefu, bila kudai ubaba wa kibayolojia wala kuingiza ufafanuzi wa kitheolojia ambao mstari huu hautoi moja kwa moja.
- issue: Kama neno “huduma” liongezwe baada ya “alipoanza”
  choice: Halijaongezwa katika maandishi makuu.
  alternative: “alipoanza huduma yake”
  rationale: Muktadha unaelekea kuashiria mwanzo wa shughuli ya Yesu hadharani, lakini nomino “huduma” haipo katika Kigiriki; hivyo utata halisi umehifadhiwa.
- issue: Ufafanuzi wa mfululizo wa nasaba katika τοῦ Ἠλὶ
  choice: “mwana wa Eli” limetumiwa kama neno linaloeleweka kuwa linamhusu Yosefu.
  alternative: “wa Eli”
  rationale: “Wa Eli” kingekuwa karibu zaidi na umbo la Kigiriki lakini si wazi wala cha asili vya kutosha katika Kiswahili. Neno “mwana” limejazwa kwa mujibu wa elipsisi ya kawaida ya orodha ya nasaba, bila kuamua mijadala mingine kuhusu asili ya nasaba hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Naye” hudumisha mwendelezo wa simulizi; “umri wa karibu miaka thelathini” ni usemi wa sasa na wa kawaida. Alama za koma zinatenganisha maelezo ya kati bila kuvunja mtiririko wa nasaba.
