  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: sw
  text: mwana wa Aminadabu[a], mwana wa Admini, mwana wa Arni, mwana wa Hesroni, mwana wa Peresi, mwana wa Yuda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “mwana wa Aminadabu, mwana wa Admini, mwana wa Aramu,” na nyingine zinaacha “Admini” na kusema “mwana wa Aminadabu, mwana wa Aramu.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika orodha hii ya ukoo, kifungu cha uhusiano kilichotangulia kinaeleweka kurudiwa pamoja na kila jina. “Mwana wa” huweka uhusiano huo wazi kwa Kiswahili cha kawaida na kuhifadhi muundo wa orodha.
- source_word: Ἀμιναδάβ
  choice: Aminadabu
  rationale: Umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili na linalowakilisha jina la Kigiriki.
- source_word: Ἀδμίν
  choice: Admini
  rationale: Unukuzi wa jina la Kigiriki kama lilivyo katika matini ya SBLGNT; tofauti ya hati haijaingizwa kimya kimya katika matini kuu.
- source_word: Ἀρνί
  choice: Arni
  rationale: Unukuzi wa usomaji wa SBLGNT. Usomaji mwingine, “Aramu,” umehifadhiwa katika tanbihi.
- source_word: Ἑσρώμ
  choice: Hezroni
  rationale: Umbo la Kiswahili linalotambulika kutokana na jina lilelile katika Agano la Kale, badala ya umbo linalofuata Kigiriki moja kwa moja zaidi.
- source_word: Φαρές
  choice: Peresi
  rationale: Umbo la Kiswahili linalolingana na jina la mhusika huyu katika Agano la Kale na kusaidia utambuzi wake katika Biblia nzima.
- source_word: Ἰούδα
  choice: Yuda
  rationale: Umbo la Kiswahili lililozoeleka kwa babu wa kabila la Yuda katika muktadha wa ukoo.
