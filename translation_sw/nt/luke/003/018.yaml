  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: sw
  text: Basi, Yohana alikuwa akiwahimiza watu kwa mambo mengine mengi[a] na kuwatangazia habari njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maonyo mengine mengi.” Kigiriki hakitaji wazi nomino inayohusishwa na “mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: mengi
  rationale: Kivumishi cha wingi cha jinsi isiyo na uhai kimetumiwa kama nomino; hapa kinarejelea mambo au maonyo mengi aliyoyatoa Yohana.
- source_word: μὲν οὖν
  choice: Basi
  rationale: Neno hili linaendeleza simulizi na kuonyesha mpito au hitimisho; “Basi” ni la kawaida na halizidishi uzito wa viunganishi vya Kigiriki.
- source_word: καὶ ἕτερα
  choice: mengine ... pia
  rationale: Hueleza mambo ya ziada; pamoja na Πολλὰ, muundo huu unaonyesha maonyo mengi zaidi ya yale yaliyotajwa.
- source_word: παρακαλῶν
  choice: kwa maonyo
  rationale: Katika muktadha wa mahubiri ya kinabii ya Yohana, παρακαλέω ina maana ya kuonya, kusihi, au kuhimiza. “Maonyo” yanabeba wito wa kimaadili bila kuondoa kabisa maana ya kuhimiza.
- source_word: εὐηγγελίζετο
  choice: alikuwa akiwatangazia ... habari njema
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililoendelea; usemi huu pia huhifadhi maana ya kutangaza habari njema.
- source_word: τὸν λαόν
  choice: watu
  rationale: “Watu” ndiyo tafsiri ya moja kwa moja na ya kawaida, bila kuibana maana iwe umati tu au kuongeza waziwazi ‘Israeli,’ jambo ambalo halijasemwa hapa.
theological_decisions:
- issue: Nguvu ya εὐηγγελίζετο katika huduma ya Yohana
  choice: alikuwa akiwatangazia watu habari njema
  alternative: alikuwa akiwahubiria watu / alikuwa akiwatangazia watu
  rationale: Kigiriki chenyewe kinaeleza ujumbe wa Yohana kuwa habari njema, hata ingawa una maonyo; tafsiri inadumisha mvutano huo badala ya kuufanya ujumbe wake kuwa mahubiri ya jumla tu.
- issue: Maana ya παρακαλῶν
  choice: kwa maonyo
  alternative: akiwahimiza / akiwasihi
  rationale: Muktadha wa wito wa Yohana wa kutubu unaipa kauli hii nguvu ya onyo na himizo. Tanbihi inadumisha uwezekano wa kutafsiri kishiriki hicho kama tendo la kuwahimiza watu kwa mambo mengine mengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “alikuwa akiwatangazia” unaonyesha tendo lililoendelea, na jina “Yohana” limewekwa wazi kwa ajili ya mtiririko wa kawaida wa Kiswahili ingawa Kigiriki kina kiima kilichodokezwa.
