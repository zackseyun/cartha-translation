  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: sw
  text: Watu walipokuwa wakingoja kwa hamu, na wote wakijiuliza mioyoni mwao kuhusu Yohana iwapo labda yeye ndiye Masihi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kristo.” Kigiriki: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: walipokuwa wakingoja kwa hamu
  rationale: Kirai huru cha hali ya wakati kinaweka mazingira ya simulizi; “wakingoja kwa hamu” linaonyesha tendo linaloendelea pamoja na matarajio.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno maalumu)
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza simulizi; mtiririko wa Kiswahili hapa hauhitaji “basi” au “lakini,” ambayo ingeongeza msisitizo usiokuwapo.
- source_word: τοῦ λαοῦ
  choice: watu
  rationale: “Watu” ni tafsiri ya kawaida na ya moja kwa moja ya kundi linalorejelewa; katika muundo huu wa Kiswahili halihitaji kibainishi sawa na “the.”
- source_word: διαλογιζομένων πάντων
  choice: wote wakijiuliza
  rationale: Kitenzi kinaonyesha kutafakari au kujadiliana ndani ya nafsi. Pamoja na “mioyoni mwao,” “wakijiuliza” ni Kiswahili cha asili kinachohifadhi wazo la tafakari ya ndani.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: mioyoni mwao
  rationale: Tafsiri hii huhifadhi picha ya kibiblia ya moyo kama kitovu cha mawazo na tafakari, bila kuifupisha kuwa akili pekee.
- source_word: περὶ τοῦ Ἰωάννου
  choice: kuhusu Yohana
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya περί pamoja na hali ya umilikaji.
- source_word: μήποτε αὐτὸς εἴη
  choice: kama labda yeye ndiye
  rationale: “Kama labda” huhifadhi hali ya swali lisilo la moja kwa moja na uwezekano wa kusita; “yeye” huhifadhi msisitizo wa αὐτός.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetiwa mafuta ambaye watu walimtarajia, hivyo “Masihi” hudumisha mazingira ya Kiyahudi na maana ya cheo.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unahusu matarajio ya watu kuhusu utambulisho wa Yohana; kwa hiyo neno hili linafanya kazi waziwazi kama cheo, si kama jina la kawaida. Tanbihi inahifadhi tafsiri nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi unabaki wazi kama kishazi kinachoendelea hadi mstari unaofuata, kama ilivyo katika chanzo cha Kigiriki.
