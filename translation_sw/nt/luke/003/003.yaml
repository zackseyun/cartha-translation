lexical_decisions:
- source_word: ἦλθεν
  choice: akaenda
  rationale: Katika muktadha wa simulizi, kitenzi hiki kinaeleza Yohana akielekea na kuzunguka eneo hilo. ‘Akaenda’ ni Kiswahili cha kawaida na cha asili; ‘akaja’ kingetegemea mahali pa mtazamaji pasipotajwa wazi.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: katika eneo lote la kandokando ya Yordani
  rationale: ‘Eneo lote’ linaakisi πᾶσαν περίχωρον, na ‘la kandokando ya Yordani’ linaeleza kwa lugha ya kawaida eneo linaloizunguka Yordani bila kufanya tungo kuwa nzito.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: Neno hili lina wazo la kutoa ujumbe hadharani. ‘Akitangaza’ linahifadhi nguvu hiyo na halilifungi neno kwenye matumizi ya kanisani pekee; ‘akihubiri’ pia linawezekana.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: ‘Ubatizo’ ndilo neno la kawaida na lililo wazi katika Kiswahili kwa tendo linalotajwa hapa.
- source_word: μετανοίας
  choice: wa toba
  rationale: Muundo huu unahifadhi uhusiano wa karibu kati ya ubatizo na toba bila kufafanua kupita kiasi aina ya uhusiano huo.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: kwa ajili ya msamaha wa dhambi
  rationale: Hii ni tafsiri ya kawaida na wazi ya kirai hicho. Inahifadhi mwelekeo unaoonyeshwa na εἰς bila kuamua ikiwa ubatizo ni njia, ishara, au tangazo la msamaha.
theological_decisions:
- issue: Uhusiano kati ya ubatizo, toba, na msamaha
  choice: ubatizo wa toba kwa ajili ya msamaha wa dhambi
  alternative: ubatizo unaoonyesha toba inayoongoza kwenye msamaha; ubatizo ambao kwa huo toba inaonyeshwa kwa ajili ya msamaha
  rationale: Muundo wa Kigiriki βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν unaacha uhusiano huo ukiwa na mvutano wa kitheolojia. Tafsiri haijabainisha kama ubatizo ni njia ya kupata msamaha, ushahidi wake, ishara yake, au tangazo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kueleweka kwa msomaji wa kawaida huku ikihifadhi mpangilio na mvutano wa maana wa matini ya Kigiriki.
