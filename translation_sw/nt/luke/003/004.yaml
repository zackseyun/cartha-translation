id: LUK.3.4
reference: Luke 3:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: sw
  text: 'Kama ilivyoandikwa katika kitabu cha maneno ya nabii Isaya: “Sauti ya mtu anayepaza sauti nyikani[a], ‘Itayarisheni njia ya Bwana[b]; nyosheni mapito yake.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kirai “nyikani” kinaweza kuhusishwa na “anayepaza sauti,” kama ilivyo hapa, au na amri inayofuata: “Sauti ya mtu anayepaza sauti, ‘Nyikani itayarisheni njia ya Bwana.’”'
    reason: alternative_reading
  - marker: b
    text: Au, “BWANA.” Nukuu hii inaakisi Isaya 40:3, ambapo matini ya Kiebrania ina jina la Mungu YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Hutoa kwa Kiswahili cha kawaida fomula ya kutambulisha nukuu ya Maandiko na kudumisha hali ya jambo lililoandikwa ambalo bado lina mamlaka.
- source_word: ἐν βίβλῳ λόγων
  choice: katika kitabu cha maneno
  rationale: Huhifadhi nomino zote mbili za Kigiriki; “kitabu” ni neno la kawaida na linaloeleweka, ingawa hati ya kale ingeweza kuwa gombo.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: ya nabii Isaya
  rationale: Hutambulisha kwa njia ya asili kwamba maneno hayo yanatoka kwa Isaya, ambaye ni nabii.
- source_word: Φωνὴ βοῶντος
  choice: Sauti ya mtu anayepaza sauti
  rationale: Huhifadhi wazo la sauti ya mtu anayetoa mwito mkubwa bila kutumia “anayelia,” ambalo katika Kiswahili linaweza kueleweka hasa kuwa analia machozi.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: “Nyikani” ni fasiri fupi na ya asili ya eneo lisilokaliwa, inayofaa mazingira ya kinabii na huduma ya Yohana.
- source_word: Ἑτοιμάσατε
  choice: Itayarisheni
  rationale: Huhifadhi amri ya wingi na wazo la kufanya njia iwe tayari.
- source_word: τὴν ὁδὸν κυρίου
  choice: njia ya Bwana
  rationale: Huhifadhi sitiari ya kutayarisha barabara kwa ajili ya ujio wa Bwana na muundo wa kawaida wa lugha ya Maandiko.
- source_word: κυρίου
  choice: Bwana
  rationale: Hufuata neno la Kigiriki κύριος moja kwa moja; usuli wa jina la Mungu YHWH katika Isaya umeelezwa katika tanbihi bila kuubadili kimyakimya matini ya Luka.
- source_word: εὐθείας ποιεῖτε
  choice: nyosheni
  rationale: Kitenzi hiki cha amri huwasilisha kwa Kiswahili cha asili tendo la kufanya mapito yawe manyoofu.
- source_word: τὰς τρίβους αὐτοῦ
  choice: mapito yake
  rationale: “Mapito” hudumisha ulinganifu na “njia” pamoja na sitiari ya maandalizi ya barabara.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος katika nukuu ya Isaya ambayo katika Kiebrania inamtaja YHWH
  choice: Bwana
  alternative: BWANA
  rationale: Matini ya Kigiriki ya Luka ina κύριος, kwa hiyo matini kuu inatafsiri “Bwana.” Tanbihi inahifadhi usuli wa YHWH katika Isaya na haizuii mwangwi wa kikristo katika muktadha wa Luka.
- issue: Mahali pa kuhusisha kirai “nyikani”
  choice: na tendo la kupaza sauti
  alternative: na amri ya kuitayarisha njia
  rationale: Mpangilio wa Kigiriki katika nukuu ya Luka kwa kawaida huhusisha kirai hicho na mtu anayepaza sauti, lakini uakifishaji haukuwamo katika hati za kwanza na Isaya 40:3 inaweza kueleweka kwa uhusiano mwingine; tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kinabii bila kuwa kigumu. “Anayepaza sauti” huepuka utata wa “anayelia,” na “nyikani” pamoja na “mapito” hudumisha taswira ya maandalizi ya njia.
