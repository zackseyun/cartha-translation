  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: sw
  text: 'Akaongeza tendo hili pia kwa maovu hayo yote: akamfunga Yohana gerezani[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kigiriki kwa karibu zaidi, “Akaongeza hili pia juu ya yote.” Maana ni kwamba Herode aliongeza tendo hili katika maovu yake mengine yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: Akaongeza
  rationale: Kitenzi hiki kinaonyesha kwamba Herode aliongeza tendo jingine katika matendo yaliyotangulia; “akaongeza” ni cha kawaida na kinahifadhi maana ya mkusanyiko.
- source_word: τοῦτο
  choice: tendo hili
  rationale: Kiwakilishi hiki kinaelekeza kwenye kitendo kinachotajwa baadaye, yaani kumfunga Yohana. Neno “tendo” limeongezwa kwa uwazi wa Kiswahili kutokana na muktadha.
- source_word: ἐπὶ πᾶσιν
  choice: kwa maovu hayo yote
  rationale: Kirai hiki kina maana ya kuongeza jambo juu ya yote yaliyotangulia. Muktadha wa mstari wa 19 unataja maovu ya Herode, hivyo tafsiri hii inaweka wazi rejeo hilo bila kubadili maana.
- source_word: κατέκλεισεν
  choice: akamfunga
  rationale: Kitenzi hiki humaanisha kumfungia au kumweka mtu kifungoni. “Akamfunga” ni cha asili katika Kiswahili na, pamoja na “gerezani,” kinaonyesha kufungwa kwake.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἐν φυλακῇ
  choice: gerezani
  rationale: Katika muktadha huu φυλακή ni mahali pa kifungo; “gerezani” ni tafsiri ya kawaida na inayoeleweka kwa urahisi.
theological_decisions:
- issue: Rejeo na nguvu ya ἐπὶ πᾶσιν
  choice: Kirai hiki kinamaanisha kwamba Herode aliongeza kitendo hiki katika maovu yake yote yaliyotangulia.
  alternative: 'Kinaweza kutafsiriwa kwa kufuata maneno ya Kigiriki kwa karibu zaidi: “juu ya yote” au “zaidi ya hayo yote.”'
  rationale: Muktadha wa karibu unataja maovu ya Herode, kisha kifungo cha Yohana kinatajwa kama ovu jingine aliloongeza. Tafsiri inafanya uhusiano huo uwe wazi lakini tanbihi inahifadhi namna ya usemi wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unahifadhi wazo la kuongeza ovu jingine, huku tanbihi ikionyesha usemi wa karibu zaidi na Kigiriki.
