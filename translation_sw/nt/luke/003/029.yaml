  text: mwana wa Yesu, mwana wa Eliezeri, mwana wa Yorimu, mwana wa Mathati, mwana wa Lawi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Umbo la kawaida la Kiswahili la jina la Kigiriki Ἰησοῦς; hapa ni jina la babu katika nasaba, bila kulibadili kuwa Yoshua au Jeshua.
- source_word: Ἐλιέζερ
  choice: Eliezeri
  rationale: Unukuzi wa kawaida unaosomeka kwa Kiswahili na unaohifadhi utambulisho wa jina.
- source_word: Ἰωρίμ
  choice: Yorimu
  rationale: Unukuzi unaofuata matamshi ya Kigiriki huku ukitumia tahajia asilia ya Kiswahili.
- source_word: Μαθθάτ
  choice: Mathati
  rationale: Unukuzi wa jina la Kigiriki kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: Λευί
  choice: Lawi
  rationale: Hili ndilo umbo lililozoeleka katika Biblia za Kiswahili kwa jina Levi.
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika nasaba hii, kihusishi cha umilikaji cha Kigiriki kinaashiria uhusiano wa kizazi; 'mwana wa' hufanya maana iliyodokezwa iwe wazi na ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Utambulisho wa Ἰησοῦ katika nasaba
  choice: Yesu
  alternative: Yeshua/Jeshua au Yoshua
  rationale: Maandishi ya Kigiriki yana jina lilelile Ἰησοῦ bila kulitofautisha kwa tahajia. Kutumia 'Yesu' kunafuata moja kwa moja umbo la Kigiriki na desturi ya Kiswahili bila kudai kwamba mtu huyu ni Yesu Kristo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa nasaba na majina yaliyorekebishwa ili yatamkike kwa urahisi. Koma ya mwisho imehifadhiwa kwa kuwa mstari huu ni sehemu ya orodha inayoendelea.
