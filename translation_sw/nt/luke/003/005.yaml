  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: sw
  text: Kila bonde litajazwa[a], na kila mlima na kila kilima vitashushwa; yaliyopinda yatanyooka[b], na sehemu zenye ukorofi zitakuwa barabara laini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kila korongo litajazwa.”
    reason: lexical_alternative
  - marker: b
    text: Mstari huu unatoa mwangwi wa Isaya 40:4 na kutumia taswira ya kutengeneza barabara ili kutayarisha njia ya Bwana.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Kila bonde
  rationale: φάραγξ inaweza kumaanisha bonde, korongo au ufa mkubwa wa ardhi. “Bonde” ni neno la kawaida na la asili katika Kiswahili, nalo linafaa katika picha ya kusawazisha ardhi.
- source_word: πληρωθήσεται
  choice: litajazwa
  rationale: Ni kitenzi cha wakati ujao katika kauli tendwa; “litajazwa” kinawasilisha moja kwa moja picha ya bonde kujazwa.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: kila mlima na kilima
  rationale: Maneno yote mawili yamehifadhiwa ili kuonyesha sehemu kubwa na ndogo za ardhi zilizoinuka na kudumisha ukamilifu wa kishairi wa chanzo.
- source_word: ταπεινωθήσεται
  choice: kitashushwa
  rationale: Katika muktadha huu neno linamaanisha ardhi iliyoinuka kushushwa. Tafsiri hii huhifadhi picha halisi bila kuigeuza moja kwa moja kuwa fundisho la kimaadili kuhusu kunyenyekezwa.
- source_word: τὰ σκολιά
  choice: palipopinda
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino bila kutaja wazi njia au mahali. “Palipopinda” ni usemi wa asili unaohifadhi hali hiyo bila kuongeza nomino isiyokuwapo wazi katika Kigiriki.
- source_word: εἰς εὐθείαν
  choice: patakuwa pamenyooka
  rationale: 'Muundo huu unaonyesha matokeo ya mabadiliko: sehemu iliyopinda inakuwa imenyooka. Kiswahili hiki ni cha kawaida na hudumisha taswira ya kutengeneza njia.'
- source_word: αἱ τραχεῖαι
  choice: palipoparuza
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na kinaonyesha sehemu zisizo laini. “Palipoparuza” huacha nomino ikiwa haijatajwa, kama ilivyo katika chanzo, huku ikitoa maana wazi kwa msomaji.
- source_word: εἰς ὁδοὺς λείας
  choice: patakuwa barabara laini
  rationale: ὁδούς hutaja barabara au njia waziwazi, na λείας humaanisha laini au tambarare. “Barabara laini” ni usemi wa sasa na unaoeleweka katika picha ya kutayarisha njia.
theological_decisions:
- issue: Taswira ya kinabii na ya kijiografia kutoka Isaya 40:4 iliyonukuliwa katika Luka
  choice: Kuhifadhi taswira halisi ya ardhi na utengenezaji wa barabara
  alternative: Kuifafanua moja kwa moja kuwa wenye kiburi watanyenyekezwa au kuwa maisha ya watu yatabadilishwa kiroho
  rationale: Ingawa taswira hii inaweza kuwa na maana za kitheolojia, maneno ya Luka yanatumia lugha halisi ya mabonde, milima na njia. Kuihifadhi huepuka kuingiza ufafanuzi fulani ndani ya tafsiri na hudumisha nguvu ya kishairi ya nukuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vipashio vinavyolingana, na lugha ya ardhi na barabara imeachwa kuwa halisi badala ya kufafanuliwa kiroho.
