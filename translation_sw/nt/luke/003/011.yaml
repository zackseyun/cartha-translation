  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: sw
  text: Naye akajibu, akawaambia, “Mwenye nguo mbili[a] na amgawie asiye na nguo, na mwenye chakula afanye vivyo hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi.” Neno la Kigiriki linamaanisha kanzu, yaani vazi la msingi lililovaliwa karibu na mwili.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Naye akawajibu
  rationale: Kiswahili cha masimulizi huunganisha kwa kawaida kishirikishi ‘akijibu’ na kitenzi ‘alisema’ katika ‘akawajibu.’ ‘Naye’ linaonyesha uunganisho hafifu wa δέ bila kudokeza upinzani mkali.
- source_word: Ὁ ἔχων
  choice: Mwenye
  rationale: Neno hili linaonyesha mtu yeyote aliye na kitu kinachotajwa, linadumisha umoja wa uwakilishi, na halilazimishi jinsia ambayo Kigiriki huitumia kwa maana ya jumla.
- source_word: δύο χιτῶνας
  choice: mavazi mawili ya ndani
  rationale: χιτών ni vazi la msingi lililovaliwa karibu na mwili, si koti la nje wala shati la kisasa hasa. Usemi huu unaeleweka katika Kiswahili cha sasa huku tanbihi ikieleza mazingira ya kale.
- source_word: μεταδότω
  choice: na amgawie
  rationale: Muundo wa ‘na’ pamoja na hali tegemezi unawasilisha amri ya nafsi ya tatu kwa njia ya kawaida na yenye nguvu katika Kiswahili. Kitenzi ‘gawia’ kinaonyesha kumpa mwingine sehemu ya alivyo nayo.
- source_word: τῷ μὴ ἔχοντι
  choice: asiye na vazi
  rationale: Kitu kinachokosekana kinatolewa na muktadha. Kutaja ‘vazi’ wazi kunazuia utata na kudumisha tofauti kati ya mwenye mawili na asiye na hata moja.
- source_word: βρώματα
  choice: chakula
  rationale: Hili ni neno pana kwa vitu vya kuliwa; nomino ya jumla ‘chakula’ ndiyo sawa ya kawaida na wazi katika Kiswahili.
- source_word: ὁμοίως ποιείτω
  choice: afanye vivyo hivyo
  rationale: Usemi huu unaendeleza amri ileile kwa mwenye chakula na kudumisha ulinganifu wa mifano miwili.
theological_decisions:
- issue: Umoja wa uwakilishi na jinsia katika ὁ ἔχων
  choice: Mwenye ... mwenye
  alternative: Yeye aliye na ... yeye aliye na
  rationale: Vishirikishi vya Kigiriki viko katika umoja wa kiume lakini vinatumika kwa maana ya jumla. ‘Mwenye’ hudumisha umoja huo bila kuingiza jinsia isiyokusudiwa na bila kubadili amri kuwa ya kundi pekee.
- issue: Nguvu ya amri katika μεταδότω na ποιείτω
  choice: na amgawie ... afanye vivyo hivyo
  alternative: anapaswa kumgawia ... anapaswa kufanya vivyo hivyo
  rationale: Hali ya kuamuru katika Kigiriki ni agizo la moja kwa moja. Muundo wa Kiswahili uliochaguliwa unadumisha nguvu hiyo bila kuugeuza kuwa pendekezo dhaifu au kauli ya wajibu iliyoelezwa kinadharia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inafaa kusomwa hadharani. ‘Mavazi ya ndani’ hapa hayamaanishi hasa chupi za kisasa; tanbihi inaeleza aina ya vazi la kale.
