id: LUK.3.22
reference: Luke 3:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: sw
  text: 'na Roho Mtakatifu akashuka juu yake katika umbo la mwili kama njiwa, na sauti ikatoka mbinguni: “Wewe ni Mwanangu mpendwa; ninapendezwa nawe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata wakati wa kitenzi cha Kigiriki kwa karibu zaidi, “nilipendezwa nawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: akashuka
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matukio na kuhifadhi wazi mwendo wa kutoka juu kwenda chini.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa, na lenye heshima katika Kiswahili sanifu.
- source_word: σωματικῷ εἴδει
  choice: kwa umbo la mwili
  rationale: Tafsiri hii inaonyesha udhihirisho wenye sura inayoonekana, bila kuongeza kwamba Roho aligeuka na kuwa kiumbe fulani.
- source_word: ὡς περιστερὰν
  choice: kama njiwa
  rationale: Neno ὡς linaweka ulinganisho; ‘kama njiwa’ huhifadhi tashbihi bila kudai kwamba Roho alikuwa njiwa halisi.
- source_word: ἐπ’ αὐτόν
  choice: juu yake
  rationale: Inaonyesha kwamba kushuka kulielekezwa kwa Yesu na kuhifadhi picha ya kitu kutua juu yake.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: sauti ikatoka mbinguni
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kutokea kwa sauti yenye asili ya mbinguni.
- source_word: Σὺ εἶ ὁ υἱός μου
  choice: Wewe ni Mwanangu
  rationale: ‘Wewe’ huhifadhi msisitizo wa kiwakilishi cha Kigiriki, na ‘Mwanangu’ ni umbo la kawaida la umilikaji katika anwani ya moja kwa moja.
- source_word: ὁ ἀγαπητός
  choice: mpendwa
  rationale: Neno hili ni fupi, lenye heshima, na linawasilisha upendo maalumu unaoonyeshwa katika tamko hilo.
- source_word: ἐν σοὶ εὐδόκησα
  choice: ninapendezwa nawe
  rationale: Kiswahili cha kawaida hutumia ‘-pendezwa na’ katika maana hii. Wakati wa sasa unaonyesha hali ya kibali katika tamko, huku wakati wa aoristi wa Kigiriki ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Asili ya udhihirisho wa Roho
  choice: Roho alishuka kwa umbo linaloonekana, kwa namna iliyolinganishwa na njiwa.
  alternative: Roho alishuka akiwa njiwa halisi.
  rationale: Muundo σωματικῷ εἴδει ὡς περιστερὰν unaunganisha udhihirisho wa kuonekana na tashbihi; ‘kama njiwa’ huepuka dai la ziada kuhusu kubadilika kwa asili ya Roho.
- issue: Nguvu na wakati wa εὐδόκησα
  choice: ninapendezwa nawe
  alternative: nilipendezwa nawe
  rationale: Tamko la sasa ni la asili katika Kiswahili na huwasilisha kibali kinachotangazwa, lakini aoristi ya Kigiriki inaweza kutafsiriwa kwa wakati uliopita; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa mfululizo wa matukio na tamko la moja kwa moja. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo, si baada ya ‘njiwa’.
