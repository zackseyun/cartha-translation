  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: sw
  text: Pepeto lake[a] liko mkononi mwake, ili asafishe kabisa uwanja wake wa kupuria na kukusanya ngano katika ghala lake[b]; lakini makapi atayateketeza kwa moto usiozimika.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “koleo la kupepetea” au, kijadi, “kipepeo cha kupepetea.” Neno la Kigiriki hurejelea chombo kinachotumiwa kurusha nafaka hewani ili kuitenganisha na makapi.
    reason: lexical_alternative
  - marker: b
    text: Au “bohari lake” au “hazina yake ya nafaka.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa moto ambao hauwezi kuzimwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pepeto
  rationale: Ni chombo cha kilimo kinachotumiwa kurusha nafaka hewani ili kuitenganisha na makapi; “pepeto” ni istilahi ya Kiswahili inayofaa katika muktadha huu.
- source_word: διακαθᾶραι
  choice: asafishe kabisa
  rationale: Kitenzi chenye kiambishi cha msisitizo kinaonyesha kusafisha kikamilifu; tafsiri hii inadumisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἅλωνα
  choice: uwanja wa kupuria
  rationale: Ni eneo ambako nafaka hupurwa na kupepetwa; msemo huu ni wazi na unahifadhi taswira ya kilimo.
- source_word: συναγαγεῖν
  choice: kukusanya
  rationale: Huwasilisha moja kwa moja tendo la kuileta pamoja nafaka iliyotenganishwa.
- source_word: σῖτον
  choice: ngano
  rationale: Ingawa neno linaweza kumaanisha nafaka kwa upana, katika muktadha huu ngano ndiyo tofauti ya kawaida na makapi.
- source_word: ἀποθήκην
  choice: ghala
  rationale: Humaanisha mahali pa kuhifadhia mazao; “ghala” ni neno la kawaida, sahihi, na lisiloainisha zaidi ya maandishi.
- source_word: ἄχυρον
  choice: makapi
  rationale: Katika upepetaji, haya ni maganda na mabaki yasiyofaa yanayotenganishwa na nafaka; “makapi” ni sahihi kuliko “majani.”
- source_word: κατακαύσει
  choice: atayateketeza
  rationale: Kitenzi kinaonyesha kuchoma kabisa; “kuteketeza” huhifadhi maana ya kuangamiza kwa moto.
- source_word: πυρὶ ἀσβέστῳ
  choice: kwa moto usiozimika
  rationale: Huhifadhi maana ya moto ambao hauwezi kuzimwa bila kuongeza maelezo ya kimafundisho.
- source_word: οὗ
  choice: yake ... mwake
  rationale: Kiwakilishi cha uhusiano cha umilikaji kinaelekezwa kwa yule ajaye; muundo wa Kiswahili unaonyesha umilikaji huo kwa kawaida.
theological_decisions:
- issue: Taswira ya hukumu katika mfano wa kilimo
  choice: Kudumisha utenganisho wa ngano na makapi pamoja na moto usiozimika, bila kufafanua zaidi namna au upeo wa hukumu hiyo.
  alternative: Kuitafsiri wazi kuwa hukumu ya muda juu ya Israeli pekee, au kuiunda kuwa tamko kamili la fundisho lililoratibiwa kuhusu adhabu ya mwisho.
  rationale: Maandishi yenyewe yanaonyesha wokovu na hukumu kupitia kukusanywa kwa ngano na kuteketezwa kwa makapi. Tafsiri inahifadhi mvutano na uzito huo bila kuingiza mfumo wa kimafundisho usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kilimo zimehifadhiwa ili taswira ya kupuria na kupepeta ibaki wazi. Alama zote za tanbihi zimewekwa katika maandishi makuu.
