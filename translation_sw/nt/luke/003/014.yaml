id: LUK.3.14
reference: Luke 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: sw
  text: Nao askari walikuwa wakimuuliza, “Na sisi tufanye nini?” Akawaambia, “Msimnyang’anye mtu yeyote kwa vitisho[a], wala msimshtaki kwa uongo, na mridhike na malipo yenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kuashiria kumtikisa au kumtisha mtu; hapa kinamaanisha kutumia nguvu, vitisho, au mamlaka vibaya ili kujipatia mali.
    reason: lexical_alternative
  - marker: b
    text: Au, “mshahara wenu.” Neno la Kigiriki lilitumiwa hasa kwa malipo au mahitaji yaliyotolewa kwa askari.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: askari
  rationale: Kirai hiki kinamaanisha watu waliokuwa wakitumikia katika jeshi; “askari” ni tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Na sisi tufanye nini?
  rationale: Huhifadhi msisitizo wa καὶ ἡμεῖς kwamba wao pia, pamoja na makundi mengine, waliuliza jambo la kufanya, huku ikiwa ya asili katika Kiswahili.
- source_word: διασείσητε
  choice: msimnyang’anye ... kwa vitisho
  rationale: Kitenzi kinaashiria kutumia nguvu, vitisho, au mamlaka vibaya ili kupata mali; usemi huu unaeleza maana hiyo bila kutumia lugha ya mtaani.
- source_word: συκοφαντήσητε
  choice: msimshtaki kwa uongo
  rationale: Hutoa maana ya kumshitaki au kumtuhumu mtu isivyo kweli; haisukumii tafsiri kwenye maana nyembamba zaidi ya usaliti wa vitisho.
- source_word: ἀρκεῖσθε
  choice: mridhike
  rationale: Amri ya wakati uliopo inahimiza hali ya kudumu ya kutosheka na kile wanachopokea.
- source_word: ὀψωνίοις
  choice: malipo
  rationale: Neno lilitumiwa kwa malipo au posho za askari; “malipo” ni pana, ya sasa, na linafaa zaidi kuliko kulifupisha kuwa chakula pekee.
theological_decisions:
- issue: Maagizo ya kimaadili kwa askari
  choice: Yohana anawakataza askari kutumia mamlaka vibaya na anawaagiza waridhike na malipo yao.
  alternative: Kusoma mstari huu kana kwamba unawahukumu au kuwaamuru waache utumishi wa kijeshi.
  rationale: Andiko linawapa askari maagizo ya moja kwa moja kuhusu unyang’anyi, mashtaka ya uongo, na tamaa; halisemi waache kazi yao. Tafsiri haiingizi hitimisho pana lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Na sisi tufanye nini?” ni ya asili na huhifadhi msisitizo wa wao pia. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
