lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfuatano huu wa ukoo, umbo la umilikishi linalorudiwa linaendeleza kauli iliyodokezwa ya ‘mwana wa’; kulitaja wazi kunafanya uhusiano wa ukoo ueleweke kwa Kiswahili cha kawaida.
- source_word: Συμεὼν
  choice: Simeoni
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: Ἰούδα
  choice: Yuda
  rationale: Jina la Kigiriki linaweza kuwakilisha jina lilelile la Kisemiti ambalo katika mapokeo mengine hutofautishwa kama Judah au Judas; ‘Yuda’ ni umbo la kawaida na lisiloleta utata usio wa lazima katika Kiswahili.
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: Ἰωνὰμ
  choice: Yonamu
  rationale: Linawakilisha kwa karibu umbo la SBLGNT Ἰωνάμ huku likifuata muundo wa asili wa majina katika Kiswahili.
- source_word: Ἐλιακὶμ
  choice: Eliakimu
  rationale: Umbo la Kiswahili linalosomeka kwa urahisi na linalowakilisha jina la Kisemiti kwa kawaida.
