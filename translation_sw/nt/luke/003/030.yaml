  text: mwana wa Simeoni, mwana wa Yuda[a], mwana wa Yosefu, mwana wa Yonamu[b], mwana wa Eliakimu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili la Kigiriki linaweza pia kuandikwa “Yudasi” katika baadhi ya mapokeo ya tafsiri; hapa “Yuda” linafaa zaidi katika muktadha huu wa ukoo.
