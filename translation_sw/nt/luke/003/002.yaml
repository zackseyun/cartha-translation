  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: sw
  text: wakati wa ukuhani mkuu wa Anasi na Kayafa[a], neno la Mungu lilimjia Yohana, mwana wa Zakaria, akiwa nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “katika ukuhani mkuu wa Anasi na Kayafa.” Luka anawataja wote wawili, ingawa cheo chenyewe kiko katika umoja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: wakati wa ukuhani mkuu wa Anasi na Kayafa
  rationale: ἐπί pamoja na jenitivi hapa inaonyesha wakati. Muundo huu ni wa asili katika Kiswahili na unahifadhi umoja wa ἀρχιερέως huku ukitaja Anasi na Kayafa wote wawili.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: neno la Mungu lilimjia
  rationale: Huu ni msemo wa kinabii unaoeleza ufunuo kutoka kwa Mungu. “Lilimjia” linaonyesha kwa kawaida kwamba neno hilo lilifikishwa kwa Yohana, bila kutafsiri ἐγένετο kwa ugumu kama “lilitokea.”
- source_word: ἐπὶ Ἰωάννην
  choice: lilimjia Yohana
  rationale: ἐπί pamoja na akusativi inaonyesha neno likimfikia mtu; “lilimjia Yohana” ni Kiswahili cha kawaida na huunganika vizuri na msemo wa kinabii.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: mwana wa Zekaria
  rationale: Kirai hiki cha ufafanuzi kinamtambulisha Yohana anayekusudiwa na kudumisha mtindo rasmi wa simulizi.
- source_word: ἐν τῇ ἐρήμῳ
  choice: akiwa nyikani
  rationale: ἔρημος hapa ni eneo lisilokaliwa sana linalohusishwa na huduma ya Yohana, si lazima jangwa la mchanga. “Nyikani” ni sahihi na ya kawaida katika muktadha wa kibiblia.
theological_decisions:
- issue: Jinsi ya kutafsiri kutajwa kwa Anasi na Kayafa pamoja na ἀρχιερέως iliyo katika umoja
  choice: wakati wa ukuhani mkuu wa Anasi na Kayafa
  alternative: wakati Anasi na Kayafa walipokuwa makuhani wakuu
  rationale: Tafsiri inahifadhi “ukuhani mkuu” katika umoja, kama ilivyo katika Kigiriki, huku ikiwataja watu wote wawili. Hivyo haisawazishi kimya kimya mvutano wa kihistoria na wa kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyikani” limetumiwa badala ya “jangwani” ili kutoashiria lazima eneo la mchanga. Alama ya tanbihi [a] imewekwa baada ya majina yanayohusika.
