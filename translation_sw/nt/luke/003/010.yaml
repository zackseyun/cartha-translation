  text: Watu waliokusanyika walikuwa wakimwuliza, “Basi, tufanye nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ukawa ukimuuliza
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea au lililorudiwa; muundo huu wa Kiswahili unawasilisha hali hiyo kwa kawaida.
- source_word: οἱ ὄχλοι
  choice: umati
  rationale: Ingawa Kigiriki kina wingi, katika Kiswahili cha kawaida watu wengi waliokusanyika huitwa kwa jina la jumla ‘umati’; maana ya kundi kubwa la watu inabaki wazi.
- source_word: λέγοντες
  choice: '[imewasilishwa moja kwa moja kwa nukuu]'
  rationale: Katika Kiswahili, kitenzi ‘kuuliza’ kinaweza kufuatiwa moja kwa moja na swali; kutafsiri pia ‘wakisema’ kungekuwa sahihi kimuundo lakini si lazima na kungepunguza unaturali.
- source_word: Τί οὖν
  choice: Basi, ... nini?
  rationale: ‘Basi’ linaonyesha hitimisho au mwitikio unaotokana na maonyo yaliyotangulia, sawasawa na οὖν.
- source_word: ποιήσωμεν
  choice: tufanye
  rationale: Hali tegemezi ya Kiswahili inafaa kwa swali la kujadiliana linalotaka kujua hatua inayopasa kuchukuliwa, bila kuongeza wajibu usiotajwa wazi.
