translation:
  language: sw
  text: Akawaambia, “Msikusanye zaidi ya kiasi kilichoagizwa kwenu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Msifanye chochote zaidi ya mlichoagizwa.” Katika muktadha huu, kitenzi hicho kinahusu hasa kazi yao ya kukusanya kodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Akawaambia
  rationale: Kiunganishi δέ ni cha mpito hafifu; muundo wa simulizi ‘Akawaambia’ unaendeleza mazungumzo kwa Kiswahili cha kawaida bila kusisitiza utofauti.
- source_word: εἶπεν πρὸς αὐτούς
  choice: Akawaambia
  rationale: Huu ni uwasilishaji wa kawaida na wa asili wa λέγω + πρός kwa Kiswahili, ukijumuisha msemaji na walengwa.
- source_word: Μηδὲν πλέον
  choice: zaidi ya kiasi
  rationale: Maneno haya yanakataza kuzidisha kiwango kinachoruhusiwa; ‘zaidi ya kiasi’ yanaeleweka kwa urahisi katika muktadha wa ukusanyaji.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: ya kiasi mlichoagizwa
  rationale: διατεταγμένον ni kauli tendwa timilifu yenye maana ya kile kilichoamriwa au kupangwa rasmi. ‘Mlichoagizwa’ huhifadhi wazo la agizo rasmi, huku ‘kiasi’ kikifafanuliwa na muktadha wa kodi.
- source_word: πράσσετε
  choice: Msikusanye
  rationale: Ingawa πράσσω kwa msingi humaanisha ‘kufanya,’ katika muktadha wa watoza kodi wa mstari uliotangulia inahusu shughuli yao ya kukusanya kodi. ‘Msikusanye’ huifanya maana hiyo ya kimuktadha kuwa wazi na ya asili.
theological_decisions:
- issue: Kuweka wazi tendo linalodokezwa na πράσσετε
  choice: Msikusanye zaidi ya kiasi mlichoagizwa.
  alternative: Msifanye zaidi ya mlichoagizwa.
  rationale: Mstari uliotangulia unaonyesha kuwa wanaosemeshwa ni watoza kodi. Kutaja ukusanyaji huleta uwazi wa kimuktadha bila kuongeza dai la kiteolojia; tanbihi huhifadhi tafsiri rasmi na pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msikusanye’ ni wazi kwa wasomaji wa kawaida; ‘mlichoagizwa’ hudumisha uzito wa agizo rasmi bila kutumia lugha ngumu.
