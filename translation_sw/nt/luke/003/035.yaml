  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaorudiwa wa “mwana wa” ni wa asili katika nasaba na unaweka wazi maana iliyodokezwa na Kigiriki. Alama zote za tanbihi zimewekwa katika matini.
