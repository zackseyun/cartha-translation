  text: mwana wa Serugi[a], mwana wa Reu, mwana wa Pelegi, mwana wa Eberi, mwana wa Shela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “wa Seruki, wa Ragau, wa Faleki, wa Eberi, wa Sala.” Katika nasaba ya Luka, mfululizo huu wa maumbo ya umilikishi umefupishwa; maneno “mwana wa” yameongezwa kutokana na muktadha ili maana iwe wazi kwa Kiswahili.'
    reason: lexical_alternative
  - marker: b
    text: 'Majina yametolewa hapa kwa maumbo yao ya kawaida katika Agano la Kale la Kiswahili: Serugi, Reu, Pelegi, Eberi na Shela.'
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika nasaba hii, umbo la umilikishi linalorudiwa linaendeleza uhusiano wa mwana na baba unaoeleweka kutokana na muktadha. Kiswahili cha kawaida huhitaji uhusiano huo kuwekwa wazi.
- source_word: Σεροὺχ
  choice: Serugi
  rationale: Jina hili linatolewa kwa umbo la Kiswahili linalotambulika na linalolingana na jina la mhusika huyo katika nasaba ya Agano la Kale.
- source_word: Ῥαγαὺ
  choice: Reu
  rationale: Ingawa umbo la Kigiriki ni Ragau, huyu ndiye Reu wa nasaba ya Mwanzo; umbo hili hudumisha utambulisho wake katika Maandiko.
- source_word: Φάλεκ
  choice: Pelegi
  rationale: Ni umbo la Kiswahili la jina Peleg, linalounganisha wazi nasaba ya Luka na ile ya Mwanzo.
- source_word: Ἔβερ
  choice: Eberi
  rationale: Umbo hili la Kiswahili linawakilisha jina la mhusika Eber wa nasaba ya Mwanzo.
- source_word: Σαλὰ
  choice: Shela
  rationale: Ingawa Kigiriki kina Sala, jina hili linamrejelea Shela wa nasaba ya Mwanzo; umbo la Kiswahili linadumisha utambulisho huo.
