lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo huu wa nasaba, kiambishi cha umilikaji cha Kigiriki kinaendeleza maana ya ‘mwana wa’ iliyoanzishwa katika muktadha; kukirudia huifanya nasaba iwe wazi na ya kawaida kwa Kiswahili.
- source_word: Ἰεσσαὶ
  choice: Yese
  rationale: Umbo la jina lililozoeleka katika Biblia za Kiswahili kwa Jesse.
- source_word: Ἰωβὴλ
  choice: Obedi
  rationale: Ingawa SBLGNT hapa ina umbo la Kigiriki Ἰωβήλ, mtu anayelengwa katika nasaba hii ni Obedi; umbo la Kiswahili linalotambulika linafuata jina hilo badala ya kuiga tahajia isiyo ya kawaida ya maandishi haya.
- source_word: Βόος
  choice: Boazi
  rationale: Umbo la kawaida la Kiswahili kwa Boaz.
- source_word: Σαλὰ
  choice: Sala
  rationale: Uhawilishaji wa moja kwa moja wa umbo la jina katika SBLGNT, bila kulisawazisha kimyakimya na Salmoni wa nasaba nyingine.
- source_word: Ναασσὼν
  choice: Nashoni
  rationale: Umbo la kawaida la Kiswahili kwa Nahshon, likihifadhi utambulisho wa jina la kibiblia.
theological_decisions:
- issue: Uhusiano wa nasaba unaodokezwa na mfululizo wa viambishi vya umilikaji
  choice: Kurudia ‘mwana wa’ kwa kila jina
  alternative: Kutaja majina pekee kwa mfululizo, au kutumia ‘wa’ tu
  rationale: Muktadha wa Luka 3:23–38 huonyesha kwamba kila τοῦ inaendeleza uhusiano wa nasaba; ‘mwana wa’ huwasilisha maana hiyo wazi bila kuongeza fundisho la kidhehebu.
- issue: Jina Σαλὰ na ulinganishaji na nasaba nyingine
  choice: Sala
  alternative: Salmoni
  rationale: Maandishi yaliyotolewa yanasoma Σαλὰ. Tafsiri inahifadhi ushahidi huo badala ya kuoanisha mstari kimyakimya na Mathayo 1 au nasaba za Agano la Kale.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wenye hadhi, na unaofaa mfululizo wa nasaba. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili, huku ‘Sala’ ikihifadhi usomaji wa chanzo.
