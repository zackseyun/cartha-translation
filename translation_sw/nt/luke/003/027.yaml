  rationale: Kigiriki kinarudia kiambishi cha umilikaji, huku uhusiano wa mwana ukieleweka kutokana na muundo wa nasaba katika muktadha. Kuutaja wazi kwa Kiswahili kunatoa maana iliyodokezwa bila kuongeza dai jipya la kiteolojia.
- issue: Utambulisho wa Σαλαθιὴλ
  choice: Shealtieli
  alternative: Salathieli
  rationale: “Shealtieli” linaonyesha jina la Agano la Kale ambalo kwa kawaida hutambuliwa kuwa sawa na umbo la Kigiriki Σαλαθιὴλ, huku tanbihi ikihifadhi umbo mbadala la moja kwa moja.
