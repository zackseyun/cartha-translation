  rationale: Katika nasaba hii, umbo la umilikaji linalorudiwa kabla ya kila jina linategemea uhusiano uliowekwa na muktadha. Kutaja “mwana wa” huwasilisha maana hiyo kwa Kiswahili cha kawaida na wazi.
- source_word: Ἰωανὰν
  choice: Yoanani
  rationale: Jina limetoholewa kwa namna inayolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: Ῥησὰ
  choice: Resa
  rationale: Jina limetoholewa moja kwa moja kutoka kwa umbo la Kigiriki kwa tahajia ya kawaida ya Kiswahili.
- source_word: Ζοροβαβὲλ
  choice: Zerubabeli
  rationale: Hili ni umbo linalotambulika katika matumizi ya Biblia ya Kiswahili na huunganisha jina hili na mhusika anayejulikana katika Agano la Kale.
- source_word: Σαλαθιὴλ
  choice: Shealtieli
  rationale: Umbo hili linalotokana na jina la Kiebrania hudumisha utambulisho wake na jina linalojulikana katika Agano la Kale; umbo la Kigiriki linaweza kutoholewa moja kwa moja kuwa Salathieli.
- source_word: Νηρὶ
  choice: Neri
  rationale: Jina limetoholewa moja kwa moja na kwa kawaida katika Kiswahili.
