  choice: Kainamu amebaki katika matini kuu.
  alternative: Baadhi ya mapokeo humwacha Kainamu ili ukoo huu ulingane zaidi na maumbo fulani ya ukoo katika Agano la Kale.
  rationale: Matini ya SBLGNT katika Luka 3:36 ina Καϊνάμ. Tafsiri inafuata ushahidi huu wa Kigiriki badala ya kuupatanisha kimya kimya na mapokeo mengine ya ukoo.
translation_notes:
