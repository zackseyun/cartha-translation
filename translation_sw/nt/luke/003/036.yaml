lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo huu wa ukoo, alama ya umilikaji ya Kigiriki imetumiwa kwa ufupisho kwa maana ya uhusiano wa kizazi uliowekwa wazi na muktadha. Kurudia “mwana wa” kunafanya uhusiano huo ueleweke kwa Kiswahili cha kawaida.
- source_word: Καϊνὰμ
  choice: Kainamu
  rationale: Jina limeandikwa kwa kufuata umbo la Kigiriki huku sauti ya mwisho ikihifadhiwa kwa namna inayotamkika kwa urahisi katika Kiswahili.
- source_word: Ἀρφαξὰδ
  choice: Arfaksadi
  rationale: Uandishi huu unafuata umbo la Kigiriki katika Luka na kanuni za tahajia ya Kiswahili; umbo la Agano la Kale linalotokana zaidi na Kiebrania linaweza kutofautiana.
- source_word: Σὴμ
  choice: Shemu
  rationale: Hili ni umbo la jina lililozoeleka katika Kiswahili na linalolingana na jina la kibiblia la Kiebrania.
- source_word: Νῶε
  choice: Noa
  rationale: “Noa” ni umbo la jina lililozoeleka katika Biblia za Kiswahili na linaeleweka kwa wasomaji wa kawaida.
- source_word: Λάμεχ
  choice: Lameki
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
theological_decisions:
