  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: sw
  text: Basi aliendelea kuwaambia makundi ya watu waliokuwa wakitoka ili wabatizwe naye, “Enyi uzao wa nyoka wenye sumu, ni nani aliyewaonya kuikimbia ghadhabu inayokuja?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Kauli ya wakati uliopita isiotimilifu inaonyesha usemi uliokuwa ukiendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Inaunganisha simulizi na yaliyotangulia kwa njia ya kawaida na yenye hadhi.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: umati wa watu waliokuwa wakitoka
  rationale: Kirai elezi kinaonyesha watu wengi waliokuwa wakitoka kwenda kwa Yohana.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: kwenda kubatizwa naye
  rationale: Inahifadhi kusudi la kutoka kwao na hali ya kutendwa; 'naye' hapa humaanisha 'na yeye,' yaani Yohana.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Enyi uzao wa nyoka wenye sumu
  rationale: γέννημα ni kile kilichozaliwa au kuzalishwa, na ἔχιδνα ni nyoka mwenye sumu; tafsiri hii huhifadhi taswira kali bila kutumia jina la aina ya nyoka lisiloeleweka kwa wasomaji wengi.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ni nani aliyewaonya
  rationale: Katika muktadha wa hatari ya hukumu inayokaribia, kitenzi kina maana ya kutoa onyo au maelekezo.
- source_word: φυγεῖν
  choice: kuikimbia
  rationale: Huhifadhi taswira halisi ya kukimbia ili kuepuka hatari.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: ghadhabu inayokuja
  rationale: μέλλουσα huonyesha jambo linalokuja au linalokaribia; 'ghadhabu' huhifadhi neno pana bila kufafanua zaidi aina ya hukumu.
theological_decisions:
- issue: Maana ya ὀργή katika onyo la Yohana
  choice: ghadhabu inayokuja
  alternative: hukumu ya Mungu inayokuja
  rationale: Neno 'ghadhabu' linahifadhi kwa upana lugha ya chanzo kuhusu hukumu ya Mungu bila kuibana iwe tukio fulani la kihistoria au mpangilio maalumu wa nyakati za mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Umati wa watu' ni la kawaida kuliko 'makutano'; 'nyoka wenye sumu' linaeleweka kwa upana. Hakuna tanbihi iliyohitajika, kwa kuwa tanbihi za Kiingereza zilizotolewa hazilingani sawasawa na viashiria katika matini yake na tofauti zake zinaweza kuwakilishwa wazi katika tafsiri ya Kiswahili.
