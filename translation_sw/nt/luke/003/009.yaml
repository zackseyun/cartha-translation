base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: sw
  text: Na tayari shoka limewekwa kwenye mzizi wa miti.[a] Kwa hiyo, kila mti usiozaa tunda zuri[b] hukatwa na hutupwa motoni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shoka tayari liko kwenye mzizi wa miti.”
    reason: lexical_alternative
  - marker: b
    text: Au, “usiotoa tunda zuri.”
    reason: lexical_alternative
  - marker: c
    text: Au, “na kutupwa ndani ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Hata sasa
  rationale: Huonyesha kwamba hukumu iko karibu na tayari imeanza kutishia; “hata sasa” ni Kiswahili cha kawaida kinachobeba nguvu ya ἤδη pamoja na msisitizo wa καί.
- source_word: ἡ ἀξίνη
  choice: shoka
  rationale: Ni jina la kawaida na linaloeleweka kwa chombo cha kukatia katika mfano huu wa hukumu.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: limewekwa kwenye mizizi ya miti
  rationale: Huhifadhi picha ya shoka lililo tayari kukata. “Mizizi” inalingana kwa kawaida na wingi wa “miti,” ingawa Kigiriki kina umoja wa kijumla “mzizi.”
- source_word: πᾶν οὖν δένδρον
  choice: Kwa hiyo, kila mti
  rationale: “Kwa hiyo” huonyesha hitimisho linalotokana na onyo lililotangulia, huku “kila mti” ikihifadhi upeo wa πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: usiozaa matunda mazuri
  rationale: Katika Kiswahili, miti “huzaa” matunda; usemi huu ni wa asili na huhifadhi maana ya matokeo mema. Wingi “matunda” ni wa kawaida zaidi kuliko umoja katika Kiswahili.
- source_word: ἐκκόπτεται
  choice: hukatwa
  rationale: Huwasilisha tendo la kuuangusha au kuuondoa mti bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: εἰς πῦρ βάλλεται
  choice: na kutupwa motoni
  rationale: “Kutُpwa motoni” ni usemi wa sasa na wa kawaida unaohifadhi ukali wa picha ya hukumu.
theological_decisions:
- issue: Picha ya hukumu kwa mfano
  choice: Kuhifadhi mfano wa shoka, miti, matunda na moto bila kufafanua moto kuwa aina fulani mahususi ya hukumu
  alternative: Kuutaja moto waziwazi kuwa jehanamu, au kuufanya uwe hukumu ya kihistoria pekee
  rationale: Mstari unaonya juu ya hukumu kali na iliyo karibu, lakini wenyewe haufafanui kikamilifu iwapo moto huo ni hukumu ya wakati huu, ya mwisho, au zote mbili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hata sasa” huleta uzito wa onyo, na “motoni” ni ya asili zaidi kuliko usemi mrefu katika matini kuu. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
