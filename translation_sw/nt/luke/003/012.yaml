base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: sw
  text: Hata watoza ushuru walikuja kubatizwa, wakamwambia, “Mwalimu, tufanye nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: walikuja
  rationale: 'Kauli ya wakati uliopita ya ἔρχομαι inaeleza tukio kwa urahisi: walikuja.'
- source_word: δὲ καὶ τελῶναι
  choice: Hata watoza ushuru
  rationale: δὲ pamoja na καὶ inaendeleza simulizi huku ikisisitiza kujumuishwa kwa watoza ushuru; “Hata” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: βαπτισθῆναι
  choice: kubatizwa
  rationale: 'Kitenzi-jina cha kutendwa kinaonyesha kusudi la kuja kwao: ili wabatizwe.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: wakamwambia
  rationale: Tafsiri hii huhifadhi maana ya kusema kwa mtu na kuunganisha kwa kawaida hatua inayofuata katika simulizi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Neno hili la kumwita mtu linamtambua kama anayefundisha bila kuongeza cheo kingine.
- source_word: τί ποιήσωμεν
  choice: tufanye nini?
  rationale: Kiima cha utegemezi chenye maana ya kutafakari hatua inayofaa kinaelezwa kwa kawaida na kwa ufupi kwa “tufanye nini?”
theological_decisions:
- issue: Kujumuishwa kwa kundi lililodharauliwa kijamii katika mwito wa Yohana wa kutubu
  choice: “Hata watoza ushuru”
  alternative: “Watoza ushuru pia”
  rationale: “Hata” huhifadhi nguvu ya kimuktadha ya kujumuishwa kwa kundi hili bila kuongeza hukumu au maelezo ya kitheolojia yasiyokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. “Watoza ushuru” ni wazi kwa wasomaji wa kawaida; “wakamwambia” hutoa mtiririko wa kawaida wa simulizi.
