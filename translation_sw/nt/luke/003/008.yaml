id: LUK.3.8
reference: Luke 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: sw
  text: Kwa hiyo, zaeni matunda yanayoendana na toba[a], wala msianze kusema miongoni mwenu[b], ‘Baba yetu ni Abrahamu,’ kwa maana ninawaambia kwamba Mungu anaweza kumwinulia Abrahamu watoto kutoka katika mawe haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matunda yafaayo toba.” Kigiriki kina neno “matunda” katika wingi na kinakazia mwenendo unaolingana na toba ya kweli.
    reason: lexical_alternative
  - marker: b
    text: Au, “mioyoni mwenu” au “nafsini mwenu.” Maneno haya yanaweza kurejelea mawazo yao ya ndani au yale waliyosemezana katika kundi lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: zaeni
  rationale: Ingawa kitenzi kwa kawaida humaanisha ‘fanyeni,’ muungano wake na ‘matunda’ huwasilishwa kwa Kiswahili cha kawaida kwa ‘zaeni,’ huku amri ya hatua thabiti ikihifadhiwa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na onyo lililotangulia.
- source_word: καρποὺς
  choice: matunda
  rationale: Wingi wa Kigiriki umehifadhiwa, ukielekeza kwenye matendo au matokeo mbalimbali yanayoonyesha toba.
- source_word: ἀξίους τῆς μετανοίας
  choice: yanayostahili toba
  rationale: Huhifadhi wazo la matunda yanayolingana na toba ya kweli bila kudokeza kwamba matendo hayo huinunua msamaha.
- source_word: μὴ ἄρξησθε λέγειν
  choice: wala msianze kusema
  rationale: Huhifadhi katazo la kuanza kutoa dai hili la kujitetea.
- source_word: ἐν ἑαυτοῖς
  choice: miongoni mwenu
  rationale: Huweza kumaanisha maneno ndani ya nafsi au mazungumzo ndani ya kundi; chaguo hili ni la kawaida na linaacha uwezekano huo wazi kupitia tanbihi.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Baba yetu ni Abrahamu
  rationale: Ni Kiswahili cha asili kinachohifadhi dai lao la kutegemea ukoo wa Abrahamu.
- source_word: λέγω γὰρ ὑμῖν
  choice: kwa maana ninawaambia
  rationale: Huhifadhi uhusiano wa hoja na kauli yenye msisitizo.
- source_word: δύναται ὁ θεὸς
  choice: Mungu anaweza
  rationale: Hueleza wazi uwezo wa Mungu kwa lugha ya kawaida na yenye uzito.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: kumwinulia Abrahamu watoto kutoka katika mawe haya
  rationale: ‘Kumwinulia’ huhifadhi taswira ya ἐγεῖραι na maana ya Mungu kuwatokeza watoto kwa ajili ya Abrahamu kwa njia isiyotarajiwa.
theological_decisions:
- issue: Maana ya ‘matunda yanayostahili toba’
  choice: Matendo ya nje yanayolingana na kuonyesha toba ya kweli.
  alternative: ‘Matunda yanayoendana na toba’ au ‘matunda yafaayo toba.’
  rationale: Kigiriki husisitiza ulinganifu kati ya mwenendo na toba, bila kusema kwamba matendo yanastahilisha msamaha.
- issue: Kutegemea kuwa wazao wa Abrahamu
  choice: Kauli inakataa ukoo wa kimwili kuwa msingi wa kutosha wa usalama mbele za Mungu.
  alternative: Kuifanya sentensi itaje wazi ‘wazao wa kweli’ wa Abrahamu.
  rationale: Maandishi yanathibitisha uhuru na uwezo wa Mungu wa kumwinulia Abrahamu watoto, lakini hayatumii hapa kirai ‘wazao wa kweli’; hivyo hakijaongezwa.
- issue: Maana ya ‘watoto kwa Abrahamu’
  choice: ‘Kumwinulia Abrahamu watoto.’
  alternative: ‘Kuwafanya watoto wa Abrahamu.’
  rationale: Chaguo lililochukuliwa huhifadhi dative τῷ Ἀβραάμ na sitiari ya ‘kuinua,’ bila kufafanua kupita kiasi namna ya uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Zaeni matunda’ ni nahau inayoeleweka katika muktadha huu; ‘Abrahamu’ linafuata umbo lililozoeleka katika Biblia za Kiswahili. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
