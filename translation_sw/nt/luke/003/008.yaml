    text: Au, “mioyoni mwenu” au “nafsini mwenu.” Maneno haya yanaweza kurejelea mawazo yao ya ndani au yale waliyosemezana katika kundi lao.
    reason: lexical_alternative
  revision_rationale: The revision replaces only the potentially misleading expression ‘yanayostahili toba’ with ‘yanayoendana na toba,’ which directly communicates the required correspondence between conduct and repentance. It preserves the Greek plural ‘matunda,’ the ambiguity of ἐν ἑαυτοῖς through the text and footnote, the Abrahamic claim, and the ‘raise up’ imagery.
