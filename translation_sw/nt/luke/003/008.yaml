review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to produce fruit, the warning against invoking Abrahamic ancestry, and God's ability to raise up children for Abraham from the stones. However, ‘yanayostahili toba’ can naturally suggest fruit that deserves or merits repentance, rather than conduct corresponding to repentance, which is the force of ἀξίους τῆς μετανοίας.
  naturalness: The register is clear, modern Standard East African Swahili. ‘Zaeni matunda,’ ‘msianze kusema,’ and ‘miongoni mwenu’ are natural in this biblical exhortation. ‘Kumwinulia Abrahamu watoto’ is an established-sounding and intelligible way to retain the ‘raise up’ imagery.
  terminology: Use ‘yanayoendana na toba’ for the correspondence/suitability expressed by ἀξίους. ‘Toba,’ ‘Mungu,’ and ‘Abrahamu’ are appropriate standard biblical terminology. The two footnote anchors are correctly placed and retained.
  issues:
  - severity: medium
    issue: ‘yanayostahili toba’ is semantically misleading for ἀξίους τῆς μετανοίας.
    rationale: In ordinary Swahili, -stahili commonly conveys deserving or meriting. The Greek calls for fruits fitting or consistent with repentance; it does not say that the fruits deserve repentance or establish its merit.
  revised_text: Kwa hiyo, zaeni matunda yanayoendana na toba[a], wala msianze kusema miongoni mwenu[b], ‘Baba yetu ni Abrahamu,’ kwa maana ninawaambia kwamba Mungu anaweza kumwinulia Abrahamu watoto kutoka katika mawe haya.
