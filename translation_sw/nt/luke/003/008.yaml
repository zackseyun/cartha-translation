  to: Kwa hiyo, zaeni matunda yanayoendana na toba[a], wala msianze kusema miongoni mwenu[b], ‘Baba yetu ni Abrahamu,’ kwa maana ninawaambia kwamba Mungu anaweza kumwinulia Abrahamu watoto kutoka katika mawe haya.
