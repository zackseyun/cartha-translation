lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo huu wa nasaba, kibainishi cha hali ya umilikaji kimerudiwa kwa ufupisho, huku uhusiano wa kuwa mwana ukieleweka kutokana na muktadha. Kiswahili huhitaji uhusiano huo kusemwa wazi ili sentensi iwe ya kawaida na yenye kueleweka.
- source_word: Μάαθ
  choice: Maathi
  rationale: Jina limetoholewa kutoka umbo la Kigiriki kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: Ματταθίου
  choice: Matathia
  rationale: Jina la mtu limetoholewa kutoka Ματταθίας; umbo la Kiswahili linaepuka uradidi wa konsonanti usio wa kawaida huku likihifadhi utambulisho wa jina.
- source_word: Σεμεῒν
  choice: Semeini
  rationale: Jina limetoholewa kwa kufuata kwa karibu umbo la Kigiriki na kupewa mwisho unaotamkika kwa urahisi katika Kiswahili.
- source_word: Ἰωσὴχ
  choice: Yoseki
  rationale: Jina limetoholewa kutoka umbo la Kigiriki Ἰωσήχ; sauti ya mwisho chi imetolewa kwa 'ki', umbo linalotamkika kiasili katika Kiswahili.
- source_word: Ἰωδὰ
  choice: Yoda
  rationale: Jina limetoholewa moja kwa moja kutoka Ἰωδά, kwa kutumia Y kuwakilisha sauti ya mwanzo ya iota kabla ya vokali.
