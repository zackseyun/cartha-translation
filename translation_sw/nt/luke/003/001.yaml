id: LUK.3.1
reference: Luke 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: sw
  text: Katika mwaka wa kumi na tano wa utawala wa Kaisari Tiberio[a], Pontio Pilato alipokuwa akitawala Yudea, na Herode akiwa tetrarki wa Galilaya, Filipo, ndugu yake, akiwa tetrarki wa eneo la Iturea na Trakoniti, na Lisania akiwa tetrarki wa Abilene[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kipindi cha mwaka wa kumi na tano wa utawala wake.”
    reason: lexical_alternative
  - marker: b
    text: “Tetrarki” alikuwa mtawala wa eneo chini ya mamlaka ya Roma.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: Katika mwaka wa kumi na tano
  rationale: Hutoa kwa Kiswahili cha kawaida mpangilio wa wakati unaoonyeshwa na kirai cha Kigiriki, bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: δὲ
  choice: haikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha utofautishaji mkubwa; mtiririko huo unaeleweka kwa kuanza moja kwa moja na maelezo ya wakati.
- source_word: ἡγεμονίας
  choice: utawala
  rationale: Kwa Kaisari Tiberio, neno hili linaonyesha kipindi cha kutawala kwake; “utawala” ni la asili na lenye heshima katika Kiswahili.
- source_word: Τιβερίου Καίσαρος
  choice: Kaisari Tiberio
  rationale: Jina na cheo vimetolewa kwa mpangilio uliozoeleka katika Kiswahili.
- source_word: ἡγεμονεύοντος
  choice: alipokuwa akitawala
  rationale: Huhifadhi hali ya kitenzi na uhusiano wake wa kimazingira na maelezo makuu ya wakati, badala ya kukibadili kuwa cheo tu.
- source_word: τῆς Ἰουδαίας
  choice: Yudea
  rationale: Ni umbo la kawaida la Kiswahili la jina la eneo hilo na linafuata moja kwa moja kitenzi “akitawala.”
- source_word: τετρααρχοῦντος
  choice: akiwa tetrarki wa
  rationale: Huhifadhi cheo mahususi cha kihistoria badala ya kukipanua kuwa “mtawala” kwa ujumla; tanbihi inakifafanua kwa msomaji.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filipo ndugu yake
  rationale: Huhifadhi kwa ufupi uhusiano wa Filipo na Herode bila kuongeza ufafanuzi usio wa lazima.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: eneo la Iturea na Trakoniti
  rationale: “Eneo” linawakilisha χώρας na kuzuia majina hayo yasionekane kama majina ya nchi huru za kisasa.
- source_word: Λυσανίου ... τῆς Ἀβιληνῆς
  choice: Lisania ... wa Abilene
  rationale: Majina yametoholewa kwa Kiswahili, na uhusiano wa mtawala na eneo lake umetolewa kwa muundo wa kawaida.
theological_decisions:
- issue: Tafsiri ya cheo cha kisiasa τετρααρχοῦντος
  choice: akiwa tetrarki wa
  alternative: akiwa mtawala wa; akitawala
  rationale: Kutumia “tetrarki” kunahifadhi umahususi wa kihistoria wa cheo hicho bila kukifanya kuwa cheo kingine au kukipunguza kuwa utawala wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu na mfuatano wa watawala umehifadhiwa kwa sababu mstari unaendelea katika aya inayofuata; maumbo ya “alipokuwa” na “akiwa” yanaifanya orodha isomeke kwa kawaida.
