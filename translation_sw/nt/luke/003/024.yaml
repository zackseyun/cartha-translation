  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: sw
  text: mwana wa Mathati[a], mwana wa Lawi, mwana wa Melki, mwana wa Yanai, mwana wa Yosefu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “wa Mathati, wa Lawi, wa Melki, wa Yanai, wa Yosefu.” Kigiriki kinaendeleza ukoo kwa kurudia maumbo ya umilikaji, huku maneno “mwana wa” yakidokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo huu wa ukoo, kibainishi cha umilikaji kinachorudiwa pamoja na kila jina kinadokeza uhusiano wa mwana uliowekwa wazi na muktadha. Kutaja “mwana wa” kunafanya maana ieleweke kwa Kiswahili cha kawaida.
- source_word: Μαθθὰτ
  choice: Mathati
  rationale: Jina limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili, huku likihifadhi umbo la Kigiriki Μαθθάτ.
- source_word: Λευὶ
  choice: Lawi
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Λευί.
- source_word: Μελχὶ
  choice: Melki
  rationale: Jina limetoholewa moja kwa moja kutoka Μελχί kwa tahajia ya Kiswahili.
- source_word: Ἰανναὶ
  choice: Yanai
  rationale: Tahajia hii inawakilisha Ἰανναί kwa sauti za Kiswahili bila kulirahisisha kuwa Yana.
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Ἰωσήφ.
theological_decisions:
- issue: Udondoshaji wa maneno katika ukoo
  choice: Kurudia “mwana wa” mbele ya kila jina
  alternative: Kutumia mfululizo rasmi zaidi, “wa Mathati, wa Lawi, wa Melki, wa Yanai, wa Yosefu”
  rationale: Kigiriki kina mfululizo wa maumbo ya umilikaji unaotegemea muundo wa ukoo katika muktadha. Kurudia “mwana wa” huweka wazi uhusiano unaodokezwa bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yanayofaa tahajia na matamshi ya Kiswahili.
