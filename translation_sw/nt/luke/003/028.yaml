lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika orodha hii ya ukoo, τοῦ inayorudiwa kabla ya kila jina ni muundo wa mkato unaoendeleza uhusiano wa ‘mwana wa’ kutoka muktadha. Kiswahili huhitaji uhusiano huo kusemwa wazi ili sentensi iwe ya kawaida na inayoeleweka.
- source_word: Μελχὶ
  choice: Melki
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, ambapo herufi k huwakilisha sauti ya Kigiriki χ katika umbo hili lililozoeleka.
- source_word: Ἀδδὶ
  choice: Adi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili; konsonanti maradufu ya Kigiriki haijahifadhiwa kwa kuwa si lazima katika tahajia ya kawaida ya Kiswahili.
- source_word: Κωσὰμ
  choice: Kosamu
  rationale: Jina limetoholewa moja kwa moja kutoka Kigiriki, kwa k badala ya umbo la Kiingereza lenye c, na vokali ya mwisho imeongezwa ili liwe rahisi kutamkwa kwa Kiswahili.
- source_word: Ἐλμαδὰμ
  choice: Elmadamu
  rationale: Jina limetoholewa kutoka Kigiriki na kupewa vokali ya mwisho kwa matamshi ya kawaida ya Kiswahili.
- source_word: Ἢρ
  choice: Eri
  rationale: Jina limetoholewa kwa Kiswahili kwa kuongeza vokali ya mwisho ili kuepuka konsonanti r mwishoni, huku umbo la jina likibaki kutambulika.
