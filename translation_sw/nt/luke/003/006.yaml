  text: and all flesh will see the salvation of God[a][b].
translation:
  language: sw
  text: Na wanadamu wote wataona wokovu wa Mungu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mwili.” Kigiriki kinasema kihalisi “kila mwili,” kikitoa mwangwi wa Isaya 40:5; hapa kinamaanisha wanadamu wote.
    reason: lexical_alternative
  - marker: b
    text: Au “wokovu kutoka kwa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: wataona
  rationale: Kitenzi hiki ni cha wakati ujao na hapa kina maana ya moja kwa moja ya kuona. “Wataona” ni Kiswahili cha kawaida na huhifadhi taswira halisi ya kuona.
- source_word: πᾶσα σὰρξ
  choice: wote wenye mwili
  rationale: Kirai hiki cha kinabii, chenye asili ya Kisemiti na mwangwi wa Isaya 40:5, kinamaanisha wanadamu wote. “Wote wenye mwili” huhifadhi taswira ya mwili huku kikieleweka kwa urahisi kuliko tafsiri ya neno kwa neno “kila mwili”; maana ya “wanadamu wote” imefafanuliwa katika tanbihi.
- source_word: σωτήριον
  choice: wokovu
  rationale: Neno hili limetumiwa kama nomino na linaashiria tendo au njia ya Mungu ya kuokoa kwa upana. “Wokovu” ni neno la kawaida, lenye hadhi, na huhifadhi mwangwi wa maandiko ya kinabii.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: “Wa Mungu” huhifadhi muundo wa hali ya umilikaji wa Kigiriki bila kuamua kimyakimya ikiwa maana mahsusi ni umilikaji au chanzo. “Kutoka kwa Mungu” limetolewa kama uwezekano katika tanbihi.
theological_decisions:
- issue: Maana ya nahau πᾶσα σὰρξ
  choice: 'Wigo wa wanadamu wote: wote wenye mwili wataona wokovu wa Mungu.'
  alternative: Kuisoma kwa maana halisi zaidi kuwa viumbe wote wenye miili.
  rationale: Katika muktadha wa nukuu ya Isaya, kirai hiki kinawahusu wanadamu wote. Tafsiri kuu huhifadhi taswira ya “mwili” na mwangwi wa kinabii bila kuficha maana yake ya kijumla.
- issue: Uhusiano unaoonyeshwa na τοῦ θεοῦ
  choice: wokovu wa Mungu
  alternative: wokovu kutoka kwa Mungu
  rationale: Hali ya umilikaji inaweza kuonyesha wokovu ambao ni wa Mungu au ambao chanzo chake ni Mungu. Muundo mpana umehifadhiwa katika matini kuu, na maana ya chanzo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wote wenye mwili” kimetumiwa badala ya “kila mwili,” ambalo si la kawaida katika Kiswahili, ili kuhifadhi kwa kiasi taswira ya chanzo na wakati huohuo kutoa maana inayoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
