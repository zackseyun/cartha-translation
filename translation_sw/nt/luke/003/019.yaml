  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: sw
  text: Lakini Herode, mtawala wa jimbo, alipokuwa akikemewa[a] na yeye kwa habari ya Herodia, mke wa ndugu yake, na kwa habari ya maovu yote ambayo Herode alikuwa amefanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipokuwa akionywa” au “makosa yake yalipokuwa yakifichuliwa.” Neno la Kigiriki linaweza kumaanisha kukemea kwa sababu ya kosa au kulifichua kosa hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: mtawala wa jimbo
  rationale: Hili linaonyesha cheo cha Herode kama mtawala wa eneo maalumu bila kutumia neno la kitaalamu lisiloeleweka kwa wasomaji wengi. Ingawa kihistoria cheo hicho kilihusishwa na utawala wa sehemu ya nchi, hapa hakilazimishi maana halisi ya ‘robo.’
- source_word: ἐλεγχόμενος
  choice: alipokuwa akikemewa
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au lililoambatana na matukio yanayosimuliwa, na ‘kukemewa’ huhifadhi uzito wa maonyo ya kimaadili. Tanbihi inadokeza pia maana ya kufichuliwa kwa kosa.
- source_word: ὑπ’ αὐτοῦ
  choice: naye
  rationale: Kiwakilishi cha Kigiriki kimehifadhiwa badala ya kumtaja Yohana moja kwa moja; rejeleo lake linapatikana katika muktadha.
- source_word: περὶ Ἡρῳδιάδος
  choice: kwa habari ya Herodia
  rationale: Kauli hii ni ya kawaida na yenye heshima katika Kiswahili, nayo inadumisha uhusiano wa περὶ unaorudiwa katika sehemu inayofuata.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: mke wa ndugu yake
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi uhusiano muhimu katika shtaka bila kufafanua zaidi ya maandishi.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: na kwa habari ya maovu yote ambayo Herode alikuwa amefanya
  rationale: Tafsiri hii hudumisha kurudiwa kwa ‘kwa habari ya,’ ujumla wa ‘yote,’ na wingi wa matendo maovu. Jina Herode limerudiwa kama katika Kigiriki.
- source_word: πονηρῶν
  choice: maovu
  rationale: ‘Maovu’ ni neno la kawaida, wazi, na lenye uzito unaofaa kwa matendo mabaya ya kimaadili yanayotajwa hapa.
- source_word: δὲ
  choice: Lakini
  rationale: ‘Lakini’ huonyesha badiliko lenye utofautishaji kutoka simulizi lililotangulia na ni kiunganishi cha kawaida mwanzoni mwa sentensi.
theological_decisions:
- issue: Uzito wa kimaadili wa ukosoaji wa Yohana dhidi ya Herode
  choice: alipokuwa akikemewa
  alternative: alipokuwa akionywa; makosa yake yalipokuwa yakifichuliwa
  rationale: ‘Kukemewa’ huhifadhi hali ya shutuma ya kinabii na kimaadili katika ἐλέγχω bila kuigeuza kuwa hukumu ya kisheria au kuongeza maelezo ya kiteolojia yasiyosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa ikiishia kwa koma kwa sababu mstari huu unaendelea moja kwa moja katika Luka 3:20. Alama ya tanbihi imewekwa baada ya ‘akikemewa,’ ambako maelezo yake ya kileksia yanahusika.
