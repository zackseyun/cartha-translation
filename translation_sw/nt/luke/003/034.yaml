  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: sw
  text: mwana wa Yakobo, mwana wa Isaka, mwana wa Abrahamu, mwana wa Tera[a], mwana wa Nahori[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina jina “Thara”; hapa limetolewa kama “Tera” ili kulinganisha na umbo linalofahamika katika Agano la Kale.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina jina “Nachor”; hapa limetolewa kama “Nahori” ili kulinganisha na umbo linalofahamika katika Agano la Kale.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: mwana wa
  rationale: Katika mfululizo huu wa ukoo, kiungo cha uhusiano wa mwana kinaeleweka kutokana na muundo wa mistari inayozunguka. Kiswahili huhitaji uhusiano huo utajwe wazi ili orodha ieleweke kwa urahisi.
- source_word: Ἰακώβ
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la babu huyo wa Israeli.
- source_word: Ἰσαάκ
  choice: Isaka
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la Agano la Kale.
- source_word: Ἀβραάμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida na linalotambulika katika Kiswahili.
- source_word: Θάρα
  choice: Tera
  rationale: Ingawa Kigiriki kina umbo Thara, Tera linapatana na umbo la jina la mtu huyu linalofahamika katika Agano la Kale la Kiswahili.
- source_word: Ναχώρ
  choice: Nahori
  rationale: Nahori ni umbo la Kiswahili linalotambulika la jina la mtu huyu wa Agano la Kale, badala ya kunakili moja kwa moja tahajia ya Kigiriki.
theological_decisions:
- issue: Kuweka wazi uhusiano wa mwana katika ukoo wenye usemi uliodondoshwa
  choice: Kurudia “mwana wa” kwa kila jina
  alternative: Kutumia “wa” pekee mbele ya kila jina
  rationale: Kigiriki hurudia tu kibainishi katika hali ya umilikaji pamoja na kila jina, huku uhusiano wa mwana ukieleweka kutokana na muktadha mpana wa ukoo. Kuweka “mwana wa” wazi huhifadhi maana ya nasaba bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Kurudiwa kwa “mwana wa” kunadumisha mpangilio wa ukoo na uwazi wa mahusiano.
