  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: sw
  text: mwana wa Enoshi,[a] mwana wa Sethi, mwana wa Adamu, mwana wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hurudia tu muundo wa umilikaji: “wa Enoshi, wa Sethi, wa Adamu, wa Mungu”; maneno “mwana wa” yameongezwa kwa kufuata muundo uliokwisha kuwekwa wa ukoo huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: mwana wa Enoshi
  rationale: Muundo wa umilikaji unaorudiwa unaendeleza orodha ya ukoo, ambapo neno la uhusiano ‘mwana’ linaeleweka kutokana na muktadha. ‘Enoshi’ ni umbo la Kiswahili la jina hilo la kibiblia.
- source_word: τοῦ Σὴθ
  choice: mwana wa Sethi
  rationale: Kama ilivyo kwa majina mengine katika ukoo huu, muundo huu unaonyesha uhusiano wa mwana na mzazi. ‘Sethi’ ni umbo la kawaida la Kiswahili la jina hili.
- source_word: τοῦ Ἀδὰμ
  choice: mwana wa Adamu
  rationale: Muundo uleule wa ukoo unaendelea. Ἀδάμ limetafsiriwa kama jina maalumu ‘Adamu,’ si kama nomino ya kawaida ‘mtu.’
- source_word: τοῦ θεοῦ
  choice: mwana wa Mungu
  rationale: Kirai cha mwisho kinafuata muundo uleule wa orodha ya ukoo. Kutaja ‘mwana wa Mungu’ kunahifadhi hitimisho lenye mkazo la Luka bila kufafanua zaidi aina ya uhusiano huo.
theological_decisions:
- issue: Jinsi ya kutafsiri kirai cha mwisho τοῦ θεοῦ katika ukoo wa Adamu
  choice: mwana wa Mungu
  alternative: wa Mungu; aliyetoka kwa Mungu
  rationale: Kwa muundo, Kigiriki kina kirai cha umilikaji tu, lakini katika mfululizo huu uhusiano unaodokezwa ni wa mwana. Tafsiri hii inadumisha mpangilio wa kifasihi na mvutano wa kiteolojia bila kuingiza maelezo yasiyosemwa kuhusu namna ya uwana wa Adamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina yametumia maumbo yanayotambulika kwa urahisi katika matumizi ya Biblia ya Kiswahili, huku sentensi ikidumisha urahisi wa orodha ya ukoo.
