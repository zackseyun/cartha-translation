  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: sw
  text: Yohana akawajibu wote, akisema, “Mimi nawabatiza kwa maji[a], lakini anakuja aliye na nguvu kuliko mimi[b], ambaye sistahili kufungua kamba ya viatu vyake. Yeye atawabatiza katika Roho Mtakatifu[c] na moto[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya maji.” Hali ya nomino ya Kigiriki inaweza kuonyesha njia inayotumiwa au kitu ambamo ubatizo unafanyika.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliye hodari kuliko mimi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa Roho Mtakatifu na moto.” Kigiriki kinasema “katika Roho Mtakatifu na moto,” na kihusishi hicho kinaweza kueleweka kwa zaidi ya njia moja.
    reason: lexical_alternative
  - marker: d
    text: “Moto” unaweza kueleweka kuwa wa utakaso, wa hukumu, au sehemu ya taswira moja ya ubatizo katika Roho na moto; tafsiri imeacha usemi huo kama ulivyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Yohana akawajibu wote, akisema
  rationale: Muundo huu unahifadhi maana ya kujibu, kishiriki cha kusema, na πᾶσιν (‘wote’) kwa Kiswahili cha simulizi kilicho wazi na cha kawaida.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: Mimi nawabatiza kwa maji
  rationale: ‘Mimi’ pamoja na ‘lakini’ katika kishazi kinachofuata huonyesha mkazo na ulinganisho wa μέν...δέ. ‘Kwa maji’ ni usemi wa kawaida wa Kiswahili na unaweza kueleza njia au kitu ambamo ubatizo unafanyika.
- source_word: βαπτίζω / βαπτίσει
  choice: nawabatiza / atawabatiza
  rationale: ‘Batiza’ ni neno la kawaida na linalofaa katika simulizi la Injili; huepuka kulazimisha ufafanuzi wa namna mahsusi ya tendo ambao mstari huu hauuelezi.
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: lakini anakuja aliye na nguvu kuliko mimi
  rationale: ‘Lakini’ huonyesha utofautishaji wa δέ, wakati ‘anakuja’ huhifadhi hali ya sasa yenye wazo la ukaribu. ‘Aliye na nguvu kuliko mimi’ huonyesha wazi ulinganisho wa ἰσχυρότερος.
- source_word: οὗ οὐκ εἰμὶ ἱκανός
  choice: ambaye sistahili
  rationale: Katika kauli hii ya unyenyekevu, ἱκανός ina maana ya kustahili au kufaa; ‘sistahili’ ni ya asili na huwasilisha maana hiyo vizuri.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: kufungua kamba ya viatu vyake
  rationale: Tafsiri hii inawasilisha tendo la hali ya chini la kufungua kamba ya viatu kwa lugha ya sasa na iliyo wazi, huku ikihifadhi umoja wa ‘kamba’ na wingi wa ‘viatu’ katika Kigiriki.
- source_word: αὐτός
  choice: Yeye
  rationale: Kiwakilishi hiki chenye mkazo kinatofautisha yule anayekuja na Yohana. ‘Yeye’ huonyesha mkazo huo kwa Kiswahili bila kuongeza maneno.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: ‘Katika’ huhifadhi kwa karibu ἐν na kuacha wazi kama maana yake ni njia, mazingira, au kitu ambamo ubatizo unafanyika. Herufi kubwa zinaonyesha kuwa anatajwa Roho wa Mungu.
- source_word: καὶ πυρί
  choice: na moto
  rationale: Usemi umeachwa bila ufafanuzi wa ziada, kwa kuwa mstari wenyewe hausemi wazi kama moto ni utakaso, hukumu, au sehemu ya taswira moja ya ubatizo katika Roho na moto.
theological_decisions:
- issue: Maana ya ‘atawabatiza katika Roho Mtakatifu na moto’
  choice: Kudumisha usemi wa moja kwa moja bila kubainisha maana ya ‘moto’.
  alternative: Kutafsiri moto kuwa utakaso pekee, au kutenganisha ubatizo katika Roho kwa kundi moja na ubatizo wa hukumu kwa kundi jingine.
  rationale: Maneno ya Kigiriki ni mafupi na yanaacha uwezekano wa kuelewa moto kama utakaso, hukumu, au sehemu ya taswira moja ya Roho na moto. Tafsiri haipaswi kuamua mjadala huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa simulizi umetumia ‘akawajibu’ na ‘akisema,’ huku maneno ya kitheolojia na utata halisi wa ἐν pamoja na ‘moto’ vikihifadhiwa bila kuingiza msimamo wa dhehebu.
