lexical_decisions:
- source_word: φέρετε
  choice: mle
  rationale: Amri ya wingi yenye maana ya kuleta kitu kuelekea mahali pa msemaji; “mle” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: μόσχον τὸν σιτευτόν
  choice: ndama aliyenoneshwa
  rationale: μόσχος ni ndama au ng’ombe mchanga, na σιτευτός humaanisha aliyelishwa ili anene kwa ajili ya tukio maalumu. Usemi huu ni wa kawaida na unadumisha wazo la maandalizi ya karamu.
- source_word: θύσατε
  choice: mchinjeni
  rationale: Kitenzi kinaweza kumaanisha kuchinja mnyama, na katika miktadha mingine kutoa dhabihu. Katika simulizi hili, “mchinjeni” huonyesha maandalizi ya chakula bila kulazimisha maana ya ibada.
- source_word: φαγόντες
  choice: tule
  rationale: Ingawa umbo la Kigiriki ni kishirikishi cha wakati uliopita, hapa linaungana kimawazo na mwaliko unaofuata; “tule” ni Kiswahili cha asili kinachoonyesha mwito wa pamoja.
- source_word: εὐφρανθῶμεν
  choice: kusherehekea
  rationale: Hili ni ombi au mwito wa nafsi ya kwanza wingi, likimaanisha kufurahi au kusherehekea. Katika mazingira ya karamu, “kusherehekea” ni wazi na ya asili.
- source_word: καὶ ... καὶ
  choice: Na ... kisha ... na
  rationale: Viunganishi vinaonyesha mfululizo wa maagizo na mwito wa mwisho. “Na” pamoja na “kisha” huleta mtiririko wa kawaida wa Kiswahili bila kubadili uhusiano wa matendo.
theological_decisions:
- issue: Dokezo linalowezekana la dhabihu katika θύσατε
  choice: Imetafsiriwa “mchinjeni” kama agizo la kuandaa mnyama kwa karamu.
  alternative: “Mtoeni dhabihu” ili kuonyesha uwezekano wa maana ya kiibada.
  rationale: Ingawa θύω inaweza kuwa na maana ya kutoa dhabihu, muktadha unalenga sherehe ya nyumbani na mlo wa pamoja. “Mchinjeni” hudumisha maana ya wazi ya simulizi bila kuingiza ibada isiyotajwa moja kwa moja; tanbihi huhifadhi uwezekano wa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Ndama aliyenoneshwa” ni wazi kuliko usemi wa kiufundi, na “mchinjeni” ni wa kawaida katika muktadha wa kuandaa karamu.
