base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: sw
  text: Akamwambia, “Mwanangu[a], wewe uko pamoja nami sikuzote, na vyote vilivyo vyangu ni vyako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtoto wangu.” Neno la Kigiriki ni mwito wa kifamilia wenye upendo unaomaanisha “mtoto,” ingawa anayesemeshwa hapa ni mwana wa kiume.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Mwanangu
  rationale: Katika Kiswahili, “mwanangu” ni mwito wa kawaida, wa kifamilia na wenye upendo kutoka kwa mzazi kwa mtoto wake, hata akiwa mtu mzima. Ingawa kiambishi cha umilikaji hakijaandikwa wazi katika Kigiriki, Kiswahili cha kawaida huhitaji namna hii katika mwito; “mtoto” peke yake ingesikika isiyo ya kawaida na inaweza kudokeza umri mdogo.
- source_word: πάντοτε
  choice: sikuzote
  rationale: “Sikuzote” huwasilisha maana ya kuwa pamoja wakati wote kwa lugha ya kawaida na yenye hadhi.
- source_word: μετ’ ἐμοῦ
  choice: uko pamoja nami
  rationale: Huhifadhi maana ya ushirika au kuwa na mtu, na ni muundo wa asili katika Kiswahili.
- source_word: πάντα τὰ ἐμὰ
  choice: vyote vilivyo vyangu
  rationale: Huwakilisha kwa upana mali na vitu vyote vya baba bila kuifinya maana kuwa urithi wa kisheria pekee.
- source_word: σά ἐστιν
  choice: ni vyako
  rationale: Hufuata kwa karibu kauli ya Kigiriki na kuhifadhi upana wa maana ya umiliki au kupatikana kwa mwana.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Akamwambia
  rationale: Muundo huu wa masimulizi ni wa kawaida katika Kiswahili na unaweza kubeba mwendelezo pamoja na tofauti nyepesi inayodokezwa na δέ bila kusisitiza mno neno “lakini.”
theological_decisions:
- issue: Mwito wa kifamilia katika jibu la baba
  choice: “Mwanangu” kama mwito wenye upendo usiokazia jinsia kuliko chanzo
  alternative: “Mtoto” au “Mwanangu wa kiume”
  rationale: τέκνον hukazia uhusiano wa mzazi na mtoto na upendo kuliko neno mahususi la Kigiriki la “mwana.” “Mwanangu” ni mwito wa asili wa Kiswahili katika muktadha huu; tafsiri haiongezi maelezo ya kiume ambayo neno lenyewe la Kigiriki halitamki, ingawa anayesemeshwa ni mwana wa kiume katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwanangu” ni mwito wa asili kwa mwana aliye mtu mzima; sentensi nyingine imewekwa wazi na rahisi bila kuondoa upana wa maana ya mali ya baba.
