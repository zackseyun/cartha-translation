base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: sw
  text: Lakini alipojirudia[a], alisema, “Ni waajiriwa wangapi wa baba yangu wana mkate wa kutosha na kubaki[b], lakini mimi ninaangamia hapa kwa njaa[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipozirudia fahamu zake.” Kigiriki, “alipokuja kwa nafsi yake mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wana mkate mwingi wa kubaki.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ninakufa hapa kwa njaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: alipozinduka na kutambua hali yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kurejea katika ufahamu timamu na kutambua hali yake. Taswira halisi ya Kigiriki, ‘alipokuja ndani yake mwenyewe,’ si ya kawaida katika Kiswahili, hivyo imewekwa katika tanbihi.
- source_word: ἔφη
  choice: alisema
  rationale: Wakati uliopita wa kisimulizi unawasilishwa kwa kawaida kwa ‘alisema.’
- source_word: μίσθιοι
  choice: wafanyakazi ... walioajiriwa
  rationale: Neno linamaanisha watu wanaofanya kazi kwa ujira, si watumwa wa nyumbani; tafsiri hii inadumisha tofauti hiyo.
- source_word: περισσεύονται ἄρτων
  choice: walio na mikate tele
  rationale: Inadumisha maana ya kuwa na mkate mwingi unaozidi mahitaji kwa lugha ya asili na inayoeleweka.
- source_word: ἄρτων
  choice: mikate
  rationale: Neno halisi ni mkate; halijapanuliwa kimyakimya kuwa ‘chakula.’
- source_word: λιμῷ
  choice: kwa njaa
  rationale: Katika muktadha huu linaonyesha njaa kali kama sababu ya kuangamia au kufa, si lazima hali pana ya baa la njaa.
- source_word: ὧδε
  choice: hapa
  rationale: Linaonyesha hali na mahali alipo sasa, likisisitiza utofauti na wafanyakazi wa baba yake.
- source_word: ἀπόλλυμαι
  choice: ninakufa
  rationale: Kitenzi cha wakati wa sasa kinaonyesha hali inayoendelea kuelekea maangamizi. ‘Ninakufa’ ni ya asili katika Kiswahili; uwezekano mpana wa ‘ninaangamia’ umehifadhiwa katika tanbihi.
