  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia usemi wa kawaida badala ya tafsiri isiyo ya asili ya nahau ya Kigiriki, huku maana halisi ikihifadhiwa katika tanbihi. Mpangilio wa alama za tanbihi umefuata mahali pa maneno yanayohusika.
