  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: sw
  text: Sistahili tena kuitwa mwana wako. Unifanye kuwa kama mmoja wa wafanyakazi wako wa ujira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmoja wa watumishi wako wa kuajiriwa” au “mmoja wa vibarua wako.” Neno la Kigiriki linamaanisha wafanyakazi wanaolipwa ujira, si watumwa wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: tena
  rationale: 'Katika muundo hasi “Sistahili tena,” neno hili linaonyesha kwamba hali ya awali imebadilika: sasa hajioni kuwa anastahili.'
- source_word: ἄξιος
  choice: stahili
  rationale: “Kustahili” linaendeleza maana ya kufaa au kuwa na haki ya hadhi fulani katika muktadha wa heshima na uhusiano.
- source_word: κληθῆναι
  choice: kuitwa
  rationale: Huhifadhi kauli tendwa na maana ya kutambuliwa au kuhesabiwa kwa jina au hadhi hiyo.
- source_word: υἱός
  choice: mwana
  rationale: Neno la Kigiriki ni la kiume katika umoja na hapa linataja moja kwa moja uhusiano wake kama mwana wa baba.
- source_word: ποίησόν
  choice: Nifanye
  rationale: Amri hii inaomba baba amweke katika hali au nafasi mpya; “Nifanye” ni ya moja kwa moja kuliko tafsiri elezi kama “unitendee.”
- source_word: ὡς
  choice: kama
  rationale: 'Hutambulisha ulinganisho: anaomba kuwekwa katika hali inayofanana na ya mmoja wa wafanyakazi hao.'
- source_word: ἕνα τῶν μισθίων σου
  choice: mmoja wa wafanyakazi wako wa kuajiriwa
  rationale: μίσθιος ni mfanyakazi anayefanya kazi kwa ujira, tofauti na mtumwa wa nyumbani; usemi huu unaweka wazi tofauti hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Lugha ya hadhi katika ungamo la mwana
  choice: Kuhifadhi “stahili” na “mwana” bila kupunguza nguvu ya uhusiano na hadhi.
  alternative: Sifai tena kuitwa mtoto wako.
  rationale: Kauli inahusu kujiona kwake kuwa hastahili hadhi ya mwana, si hisia ya aibu kwa ujumla tu. Tafsiri haiongezi hitimisho la kiteolojia lisilosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye heshima. “Wafanyakazi wa kuajiriwa” limetumiwa ili kudumisha dhana ya kulipwa ujira; “vibarua” ni fupi na ya kawaida zaidi lakini katika baadhi ya mazingira inaweza kudokeza hasa kazi ya muda au ya mikono.
