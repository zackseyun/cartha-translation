  text: Then he said[a], “A certain man had two sons.”
translation:
  language: sw
  text: Kisha akasema, “Mtu mmoja alikuwa na wana wawili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: akasema
  rationale: Aoristi ya λέγω inaanzisha sehemu inayofuata ya mafundisho ya Yesu; umbo la mfululizo ‘akasema’ ni la kawaida katika masimulizi ya Kiswahili.
- source_word: δέ
  choice: Kisha
  rationale: Kiunganishi hiki chepesi kinaonyesha mwendelezo au mpito wa mazungumzo; ‘Kisha’ huleta mtiririko wa kawaida bila kudokeza utofautishaji mkali.
- source_word: Ἄνθρωπός τις
  choice: Mtu mmoja
  rationale: τις humtambulisha mtu bila kumtaja. ‘Mtu mmoja’ ni usemi wa kawaida wa Kiswahili katika mwanzo wa mfano na huhifadhi hali hiyo ya kutokutajwa; jinsia yake ya kiume inadhihirika pia kwa kuwa ana wana wawili.
- source_word: εἶχεν
  choice: alikuwa na
  rationale: Imperfekti ya ἔχω inaeleza hali iliyokuwapo kama msingi wa mfano; ‘alikuwa na’ ni tafsiri ya kawaida na ya asili kwa Kiswahili.
- source_word: δύο
  choice: wawili
  rationale: Nambari ya msingi imepatana kisarufi na nomino ya ngeli ya watu.
- source_word: υἱούς
  choice: wana
  rationale: υἱούς humaanisha wana wa kiume, si watoto kwa ujumla. ‘Wana’ huhifadhi maana hiyo na uhusiano wa kifamilia ulio muhimu katika mfano.
theological_decisions:
- issue: Maana ya kutaja bila kubainisha katika Ἄνθρωπός τις
  choice: Mtu mmoja
  alternative: Mtu fulani
  rationale: ‘Mtu mmoja’ huhifadhi utambulisho usiotajwa wa mhusika wa mfano kwa Kiswahili cha kawaida, bila kuongeza maana ya fumbo au kumhusisha na mtu maalumu. ‘Mtu fulani’ inawezekana, lakini katika muktadha huu inaweza kusikika kama msemaji anamfahamu mtu huyo binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Sentensi imehifadhi ufupi na mtindo wa ufunguzi wa mfano katika Kigiriki.
