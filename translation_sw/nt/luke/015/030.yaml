  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: sw
  text: Lakini huyu mwanao alipokuja—yule aliyekula mali yako akiwa pamoja na makahaba—ulimchinjia ndama aliyenoneshwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyeteketeza riziki yako”; kitenzi cha Kigiriki kina taswira kali, kihalisi “aliyekula mpaka kwisha,” na nomino hiyo inaweza kumaanisha riziki, mali, au urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... alipo-
  rationale: Muundo huu unaunganisha maana ya wakati ya ὅτε na utofautishaji wa δέ, na unasikika kwa kawaida katika Kiswahili.
- source_word: ὁ υἱός σου οὗτος
  choice: huyu mwanao
  rationale: Unahifadhi kiashiria οὗτος na sauti ya kujitenga kihisia; kaka hasemi ‘ndugu yangu.’
- source_word: ὁ καταφαγών
  choice: yule aliyekula
  rationale: ‘Kula’ huhifadhi taswira kali ya κατεσθίω kwa Kiswahili cha kawaida; maelezo ya tanbihi yanaonyesha maana pana ya ‘kula kabisa/teketeza.’
- source_word: σου τὸν βίον
  choice: mali yako
  rationale: Katika muktadha huu βίος ni rasilimali au mali ya kuishi, si uhai wa kibayolojia. ‘Mali yako’ ni ya kawaida na inaendana na urithi uliogawanywa katika simulizi.
- source_word: μετὰ πορνῶν
  choice: pamoja na makahaba
  rationale: Ni tafsiri ya moja kwa moja, ya kisasa, na isiyolainisha shtaka la kaka mkubwa.
- source_word: ἦλθεν
  choice: alipokuja
  rationale: Huhifadhi maana sahili ya ‘kuja’ bila kuongeza wazi wazo la ‘kurudi,’ ingawa muktadha unalidokeza.
- source_word: ἔθυσας
  choice: ulimchinjia
  rationale: Kitenzi hiki kinaonyesha kuchinja mnyama kwa ajili ya karamu na kiambishi cha utendea kinaonyesha mnufaika αὐτῷ, bila kudokeza dhabihu ya ibada.
- source_word: τὸν σιτευτὸν μόσχον
  choice: ndama aliyenoneshwa
  rationale: Ni usemi wazi na wa kawaida kwa ndama aliyelishwa kwa kusudi la kuwa tayari kwa karamu.
- source_word: αὐτῷ
  choice: ulimchinjia
  rationale: Kiambishi cha utendea -ia katika ‘ulimchinjia’ kinawasilisha kwa kawaida kwamba ndama alichinjwa kwa ajili yake.
theological_decisions:
- issue: Ikiwa shtaka la kaka mkubwa litolewe kama ukweli uliothibitishwa au kama maneno yake mwenyewe
  choice: Shtaka limetafsiriwa moja kwa moja bila kuongeza viashiria vya shaka.
  alternative: ‘anayedaiwa kula mali yako’ au ‘baada ya kufuja mali yako kwa maisha ya uasherati’
  rationale: Kigiriki kinanukuu shtaka la kaka mkubwa bila kuthibitisha kwa sauti ya msimulizi kwamba kila undani ni kweli. Kutafsiri maneno yake moja kwa moja huhifadhi mvutano wa kisimulizi bila kuyaidhinisha wala kuyapunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Huyu mwanao’ huhifadhi dharau na kujitenga kwa msemaji. Mistari mirefu imetenganishwa kwa vistari ili shtaka la kati lisomeke kwa uwazi.
