  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: sw
  text: Naye anapoingia nyumbani[a], anawakusanya rafiki zake na majirani zake, akiwaambia, “Furahini pamoja nami[b], kwa sababu nimempata kondoo wangu aliyepotea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata maneno ya Kigiriki kwa karibu zaidi: “anapoingia ndani ya nyumba.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Shangilieni pamoja nami.” Amri ya Kigiriki ina maana ya kushiriki furaha ya mtu mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: anapoingia nyumbani
  rationale: Kirai kishirikishi cha aoristi kinaeleza wakati wa tendo kuu. ‘Anapoingia nyumbani’ ni Kiswahili cha kawaida na chenye maana ya kuingia katika nyumba yake, huku tanbihi ikihifadhi umbo halisi zaidi la Kigiriki.
- source_word: συγκαλεῖ
  choice: anawaita pamoja
  rationale: Kitenzi hiki humaanisha kuwaita watu wakusanyike pamoja. Tafsiri hii inadumisha picha ya kuwaita bila ukali unaoweza kuambatana na ‘anawaamuru waje.’
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: rafiki zake na majirani zake
  rationale: Haya ndiyo maneno ya kawaida na ya moja kwa moja katika Kiswahili; viambishi vya umilikaji vinaonyesha uhusiano unaodokezwa katika muktadha.
- source_word: λέγων αὐτοῖς
  choice: na kuwaambia
  rationale: Muundo huu unaunganisha kwa kawaida mwito na maneno yanayofuata katika Kiswahili.
- source_word: Συγχάρητέ μοι
  choice: Furahini pamoja nami
  rationale: Amri hii ni ya wingi na inawataka walioitwa washiriki furaha ya msemaji; ‘pamoja nami’ huhifadhi wazo la kufurahi kwa pamoja.
- source_word: ὅτι εὗρον
  choice: kwa sababu nimempata
  rationale: ὅτι inatoa sababu ya mwito wa kufurahi. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: kondoo wangu aliyekuwa amepotea
  rationale: Tafsiri hii huhifadhi nomino pamoja na kishazi kinachoifafanua, badala ya kufupisha kuwa ‘kondoo wangu aliyepotea,’ na huonyesha hali ya awali ya kupotea kabla ya kupatikana.
theological_decisions:
- issue: Taswira ya mfano kuhusu kilichopotea na kupatikana
  choice: Kudumisha picha halisi ya ‘kondoo wangu aliyekuwa amepotea’
  alternative: Kondoo wangu aliyepotea; mwenye dhambi aliyeokolewa
  rationale: Mstari wenyewe unasimulia mfano kwa picha ya kondoo. Tafsiri haipaswi kuingiza ndani ya mstari ufafanuzi wa kitheolojia unaotolewa na muktadha unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumbani’ ni usemi wa kawaida kuliko ‘ndani ya nyumba,’ huku tanbihi ikihifadhi tafsiri ya karibu zaidi. Matumizi ya ‘nimempata’ yanakubalika kwa kondoo aliye hai na kusisitiza kuwa amepatikana.
