  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: sw
  text: Mafarisayo pamoja na walimu wa Sheria walikuwa wakinung’unika wakisema, “Mtu huyu huwakaribisha[a] wenye dhambi na hula pamoja nao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, huwapokea.
    reason: Mbadala huu unaonyesha tafsiri ya karibu zaidi ya προσδέχεται, huku “huwakaribisha” ikitoa kwa Kiswahili cha sasa wazo la kuwapokea kwa nia njema.
lexical_decisions:
- source_word: διεγόγγυζον
  choice: walikuwa wakinung’unika
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au kurudiwa; ‘walikuwa wakinung’unika’ pia inadumisha wazo la malalamiko yaliyosemwa kwa sauti ya chini.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: Mafarisayo pamoja na walimu wa Sheria
  rationale: ‘Pamoja na’ linaonyesha nguvu ya muundo τε ... καί unaounganisha makundi yote mawili. Katika muktadha huu γραμματεῖς ni wataalamu na walimu wa Sheria ya Kiyahudi, si waandishi kwa maana ya kawaida ya kisasa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi hiki tegemezi kinaonyesha kwamba maneno yao yaliambatana na kunung’unika kwao; ‘wakisema’ ni muundo wa kawaida na wa asili wa Kiswahili.
- source_word: Οὗτος
  choice: Mtu huyu
  rationale: Huhifadhi nguvu ya kiwakilishi cha kuonyesha na sauti ya kujitenga au kubeza iliyopo katika shtaka lao, bila kutumia ‘yeye’ lisilo na mkazo huo.
- source_word: ἁμαρτωλοὺς
  choice: wenye dhambi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowataja watu waliowekwa katika kundi la kijamii na kidini la ‘watenda-dhambi,’ bila kuongeza ufafanuzi usiokuwapo katika Kigiriki.
- source_word: προσδέχεται
  choice: huwakaribisha
  rationale: Wakati uliopo katika kauli ya jumla ya shtaka unaelezwa kwa ‘hu-’; ‘karibisha’ linaonyesha kuwapokea kwa nia njema na kwa lugha ya asili ya Kiswahili. Tanbihi inadumisha mbadala wa karibu zaidi wa ‘wapokea.’
- source_word: συνεσθίει αὐτοῖς
  choice: na kula pamoja nao
  rationale: Hutoa moja kwa moja maana ya kula pamoja na watu hao na inadumisha uzito wa ushirika wa mezani bila kuingiza maelezo ya ziada.
theological_decisions:
- issue: Uzito wa kijamii na kitheolojia wa Yesu kushirikiana na wenye dhambi
  choice: Shtaka limetafsiriwa wazi kwamba anawakaribisha wenye dhambi na kula pamoja nao.
  alternative: Mtu huyu huwapokea wenye dhambi na kula pamoja nao.
  rationale: Tafsiri inadumisha kashfa iliyodhaniwa na wasemaji kuhusu kuwapokea na kushiriki nao mezani, lakini haiongezi hukumu kuhusu maana ya matendo ya Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walimu wa Sheria’ linaepusha maana potovu ya kisasa ya ‘waandishi,’ na ‘Mtu huyu’ inadumisha sauti ya shtaka. Alama ya tanbihi imewekwa moja kwa moja baada ya neno linalohusika.
