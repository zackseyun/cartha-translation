  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: sw
  text: Lakini baba akawaambia watumwa wake[a], “Haraka, leteni joho bora zaidi[b] na mmvike. Mwekeni pete[c] kwenye mkono wake na sandali miguuni pake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.” Neno la Kigiriki doulous humaanisha watumwa au watumishi waliofungwa katika nyumba; “watumwa” limetumiwa hapa ili kuhifadhi uhalisi huo wa kijamii.
    reason: alternative_reading
  - marker: b
    text: Kisisisi, “joho la kwanza”; katika muktadha huu yaelekea kumaanisha joho bora zaidi au lililo kuu.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema tu “pete.” Wengine huielewa kuwa pete ya muhuri iliyoonyesha kurejeshwa kwa hadhi, lakini hilo halijaelezwa wazi katika neno lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: watumwa
  rationale: Neno δοῦλος humaanisha watu walio katika hali ya utumwa au utumishi wa kufungwa. “Watumwa” linahifadhi wazi uhalisi huo wa kijamii katika nyumba hii.
- source_word: Ταχὺ
  choice: Haraka
  rationale: Limetumiwa kama kielezi cha kuhimiza hatua ya mara moja; “Haraka” ni la kawaida na linaonyesha msisitizo wa baba.
- source_word: ἐξενέγκατε
  choice: leteni
  rationale: Kitenzi kina maana ya kuleta kitu kutoka ndani au mahali kilipohifadhiwa. Katika Kiswahili, “leteni” linaeleza tendo hilo kwa kawaida bila ulazima wa kuongeza “nje,” ambayo hapa ingeweza kusikika kama joho lipelekwe nje.
- source_word: στολὴν τὴν πρώτην
  choice: joho bora zaidi
  rationale: στολή ni vazi refu au joho, na πρώτη hapa yaelekea kumaanisha lililo la kwanza kwa cheo au ubora, si la kwanza katika mpangilio.
- source_word: ἐνδύσατε αὐτόν
  choice: mmvike
  rationale: Hii ni amri ya kumvika mtu vazi lililotajwa. “Mmvike” ni fupi, wazi, na ya asili katika Kiswahili.
- source_word: δακτύλιον
  choice: pete
  rationale: Neno la Kigiriki linasema pete tu, wala halibainishi kuwa ni pete ya muhuri.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: mkononi
  rationale: Katika muktadha wa uvaaji, Kiswahili hutumia kwa kawaida “mkononi” badala ya tafsiri sisisi ya kihusishi εἰς.
- source_word: ὑποδήματα
  choice: sandali
  rationale: Neno hili linataja viatu vya kufungwa chini ya mguu, hasa sandali katika mazingira ya kale ya Mediterania; “sandali” linahifadhi umahususi huo.
- source_word: εἰς τοὺς πόδας
  choice: miguuni
  rationale: “Miguuni” ni usemi wa kawaida wa Kiswahili kwa kitu kinachovaliwa kwenye miguu.
- source_word: δὲ
  choice: Lakini
  rationale: δέ linaonyesha mpito wenye utofautishaji mdogo kati ya maneno ya mwana na hatua ya baba; “Lakini” linaonyesha mgeuko huo wa simulizi.
theological_decisions:
- issue: Kutafsiri δούλους kama “watumwa” au “watumishi”
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” linaonyesha hadhi ya kufungwa iliyomo katika δοῦλος na kuhifadhi uhalisi wa kijamii wa simulizi bila kuuficha kwa neno pana zaidi “watumishi.”
- issue: Kutafsiri πρώτη katika στολὴν τὴν πρώτην kwa maana ya mpangilio au ubora
  choice: joho bora zaidi
  alternative: joho la kwanza
  rationale: Katika muktadha huu, kirai hicho yaelekea kutaja joho lililo kuu kwa ubora au hadhi, si tu la kwanza katika mfuatano. Tanbihi inahifadhi uwezekano wa maana ya kisisi.
- issue: Iwapo δακτύλιον iongezwe kuwa “pete ya muhuri”
  choice: pete
  alternative: pete ya muhuri
  rationale: Ingawa pete inaweza kueleweka kuwa ishara ya kurejeshwa kwa hadhi au mamlaka, maandishi ya Kigiriki hayaisemi wazi kuwa pete ya muhuri; hivyo tafsiri haiongezi wazo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi za amri zinahifadhi haraka ya baba. “Joho” linafaa zaidi kuliko “vazi” la kijumla kwa στολή, na “sandali” linadumisha mazingira ya kale bila kufanya lugha kuwa ngumu.
