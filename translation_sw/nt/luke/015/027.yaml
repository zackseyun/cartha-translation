base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: sw
  text: Akamwambia, “Ndugu yako amefika, na baba yako amemchinja ndama aliyenoneshwa, kwa sababu amempokea tena akiwa salama na mwenye afya njema.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa mwenye afya njema.” Neno la Kigiriki linaweza kumaanisha “mwenye afya njema”; katika muktadha huu linaweza pia kueleza kuwa amerudi salama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: amerudi
  rationale: Katika muktadha wa mwana aliyekuwa mbali na sasa yupo nyumbani, neno hili linaonyesha kwamba amefika na yupo hapo; ‘amerudi’ ni la kawaida na linafaa kwa simulizi hili.
- source_word: ἔθυσεν
  choice: amemchinja
  rationale: Kitenzi kinamaanisha kuchinja mnyama, hapa kwa ajili ya karamu; ‘amemchinja’ ni sahihi bila kudokeza lazima dhabihu rasmi ya ibada.
- source_word: μόσχον τὸν σιτευτόν
  choice: ndama aliyenoneshwa
  rationale: Kirai hiki kinamtaja ndama aliyelishwa na kunoneshwa hasa kwa tukio maalumu la sherehe.
- source_word: ὑγιαίνοντα
  choice: akiwa mzima salama
  rationale: Kauli hii huhusu kuwa mwenye afya au hali njema; katika muktadha wa kurudi kutoka mbali, ‘mzima salama’ huwasilisha maana pana kwa Kiswahili cha kawaida huku tanbihi ikihifadhi maana nyembamba zaidi.
- source_word: ἀπέλαβεν
  choice: amempokea tena
  rationale: Kitenzi kina wazo la kumpokea au kumpata mtu tena; ‘amempokea tena’ linahifadhi maana ya kurejezwa kwa uhusiano bila kuongeza tafsiri ya kiteolojia.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: Akamwambia,
  rationale: Muundo wa Kiswahili ‘Akamwambia’ huwasilisha kiunganishi chepesi, mhusika anayesemeshwa, na utangulizi wa maneno ya moja kwa moja kwa njia ya kawaida.
