  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. ‘Mzima salama’ ni usemi wa sasa unaoeleweka kwa urahisi; tanbihi inaweka wazi maana mbadala ya moja kwa moja zaidi.
