id: LUK.15.7
reference: Luke 15:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: sw
  text: Ninawaambia, vivyo hivyo[a] kutakuwa na furaha mbinguni kwa ajili ya mwenye dhambi mmoja anayetubu kuliko kwa ajili ya watu tisini na tisa wenye haki[b] ambao hawana haja ya kutubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hivyo” au “kwa njia hiyo.” Maneno haya yanaunganisha furaha ya mbinguni na hoja ya mfano uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Maandishi yanasema “wenye haki.” Katika muktadha, maneno hayo yanaweza kueleweka moja kwa moja au kama kinaya; tafsiri haikulazimishi mojawapo ya tafsiri hizo.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Ni kauli ya moja kwa moja na ya kawaida katika Kiswahili, ikihifadhi usemi wa Yesu kwa wasikilizaji wake.
- source_word: οὕτως
  choice: vivyo hivyo
  rationale: Inaunganisha kauli hii na mfano uliotangulia na kuonyesha ulinganifu wake kwa Kiswahili cha kawaida.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: kutakuwa na furaha mbinguni
  rationale: Inahifadhi maana ya wakati ujao na mahali pa furaha bila kutaja kwa ziada ni nani hasa anayefurahi.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: kwa ajili ya mwenye dhambi mmoja
  rationale: Katika muundo huu ἐπί huonyesha sababu au tukio linaloleta furaha; ‘kwa ajili ya’ ni ya asili katika Kiswahili.
- source_word: μετανοοῦντι
  choice: anayetubu
  rationale: Kitenzi ‘kutubu’ ni cha kawaida, sahihi, na kinaonyesha tendo endelevu la kishiriki cha wakati wa sasa.
- source_word: ἢ
  choice: kuliko
  rationale: Katika muktadha huu inaunganisha vipengele vya ulinganisho; ‘kuliko’ huwasilisha maana hiyo wazi.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: watu tisini na tisa wenye haki
  rationale: Kivumishi cha Kigiriki kimetumika kama nomino; ‘watu’ huongezwa kwa ufasaha bila kuamua kama usemi huo una kinaya.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: ambao hawana haja ya kutubu
  rationale: Ni Kiswahili cha asili kinachohifadhi dai la maandishi kwamba watu hao hawahitaji toba.
theological_decisions:
- issue: Ikiwa ‘wenye haki’ ni watu wenye haki kweli au ni usemi wa kinaya kuhusu wanaojiona kuwa wenye haki
  choice: Kuhifadhi ‘wenye haki’ bila kuongeza ufafanuzi ndani ya maandishi.
  alternative: ‘wanaojiona kuwa wenye haki’ au kuweka alama za kunukuu kuonyesha kinaya
  rationale: δικαίοις inasema ‘wenye haki’ bila kuonyesha kinaya waziwazi. Tafsiri inahifadhi mvutano wa kimuktadha badala ya kuuamua.
- issue: Maana ya furaha kuwa ‘mbinguni’
  choice: 'Kutafsiri mahali tu: ‘mbinguni.’'
  alternative: ‘mbele za malaika wa Mungu’ au ‘miongoni mwa malaika mbinguni’
  rationale: Aya hii inataja mahali pa furaha lakini haitaji wazi wanaofurahi. Kutaja Mungu au malaika kama watendaji kungezidi maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa wasomaji wa kawaida, huku ukihifadhi ulinganisho, mahali pa furaha, na utata wa kimuktadha wa ‘wenye haki.’
