  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: sw
  text: Lakini ilibidi kusherehekea na kufurahi, kwa sababu huyu ndugu yako alikuwa amekufa, naye akawa hai tena[a]; alikuwa amepotea, naye amepatikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “aliishi” au “akawa hai.” Katika mfano huu, usemi huo yaelekea ni wa kimfano kuhusu kurejeshwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: tufanye sherehe
  rationale: Katika muktadha wa karamu, usemi huu unaeleza kusherehekea kwa furaha. Kiswahili cha wingi kinaeleweka kutokana na mazingira, ingawa Kigiriki hakitaji mhusika wazi.
- source_word: χαρῆναι
  choice: kufurahi
  rationale: Limehifadhi tamko la pili la furaha lililo sambamba na εὐφρανθῆναι bila kuyaunganisha kuwa wazo moja.
- source_word: ἔδει
  choice: ilibidi
  rationale: Huonyesha ulazima wa kimaadili au unaotokana na hali; ni wa kawaida na wenye nguvu katika Kiswahili cha sasa.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: huyu ndugu yako
  rationale: Huhifadhi kiashiria οὗτος pamoja na uhusiano unaosisitizwa na σου kwa mpangilio wa kawaida wa Kiswahili.
- source_word: νεκρὸς ἦν
  choice: alikuwa amekufa
  rationale: Huhifadhi picha halisi ya kifo bila kueleza moja kwa moja maana yake ya kimfano katika mfano huu.
- source_word: ἔζησεν
  choice: amekuwa hai tena
  rationale: Huhifadhi utofauti wa kufa na kuwa hai na kuonyesha urejesho unaodokezwa na muktadha; tanbihi inaonyesha kuwa Kigiriki kinasema kwa ufupi zaidi.
- source_word: ἀπολωλὼς
  choice: alikuwa amepotea
  rationale: Huwasilisha hali inayotokana na kupotea, maana inayofaa katika mfululizo wa mifano ya Luka 15.
- source_word: εὑρέθη
  choice: amepatikana
  rationale: Kauli tendwa imehifadhiwa, na wakati timilifu wa Kiswahili unaonyesha umuhimu wa sasa wa kupatikana kwake.
theological_decisions:
- issue: Iwapo maana ya kimfano ya ἔζησεν ielezwe wazi kuwa urejesho
  choice: amekuwa hai tena
  alternative: aliishi / akawa hai
  rationale: Tafsiri inadumisha picha ya kifo na uhai iliyomo katika chanzo bila kuibadili kuwa maelezo ya moja kwa moja ya toba, urejesho, au ufufuo wa mwili.
- issue: Nguvu ya ἔδει
  choice: ilibidi
  alternative: ilifaa
  rationale: Ilibidi huhifadhi nguvu ya ulazima wa kimaadili au wa hali, huku mbadala laini zaidi ukibaki uwezekano halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi; picha za kufa, kuwa hai, kupotea na kupatikana zimehifadhiwa bila kuzifafanua kupita kiasi.
