id: LUK.15.21
reference: Luke 15:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: sw
  text: Lakini yule mwana akamwambia, “Baba, nimetenda dhambi dhidi ya mbingu[a] na mbele yako. Sistahili tena kuitwa mwanao.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, “dhidi ya mbingu” hutumia “mbingu” kama njia ya heshima ya kumrejelea Mungu; tafsiri nyingine hufafanua kauli hiyo kuwa “dhidi ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinaendeleza maneno ya mwana kwa kauli yenye maana, “Unifanye kama mmoja wa wafanyakazi wako wa kuajiriwa,” kwa kufanana na mstari wa 19; matini ya SBLGNT inamalizia sentensi kwa “mwanao.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Lakini ... akamwambia
  rationale: δέ ni kiunganishi chepesi; “Lakini” linaonyesha mgeuko wa simulizi na tofauti kati ya tendo la baba lililotangulia na ungamo la mwana bila kuifanya tofauti hiyo kuwa kali kupita kiasi.
- source_word: ὁ υἱὸς αὐτῷ
  choice: yule mwana akamwambia
  rationale: “Yule mwana” humrejelea mwana ambaye tayari anajulikana katika simulizi, na kiambishi -mw- katika “akamwambia” huhifadhi maana ya αὐτῷ kwa Kiswahili cha kawaida.
- source_word: Πάτερ
  choice: Baba
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya nomino ya mwito Πάτερ; hakuna haja ya kuongeza “yangu,” ambalo halipo wazi katika Kigiriki.
- source_word: ἥμαρτον
  choice: nimetenda dhambi
  rationale: Kauli hii ni ungamo la kosa lililotendwa lenye matokeo ya sasa. “Nimetenda dhambi” ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: εἰς τὸν οὐρανὸν
  choice: dhidi ya mbingu
  rationale: Maneno ya Kigiriki yamehifadhiwa badala ya kufasiriwa moja kwa moja kuwa “dhidi ya Mungu.” Katika muktadha huu “mbingu” ni njia ya heshima ya kumrejelea Mungu.
- source_word: καὶ ἐνώπιόν σου
  choice: na mbele yako
  rationale: ἐνώπιον humaanisha “mbele ya” au “katika uwepo wa.” “Mbele yako” huhifadhi picha na maana ya uhusiano bila kuibadili kwa ufafanuzi kuwa “dhidi yako.”
- source_word: οὐκέτι
  choice: tena
  rationale: Katika sentensi hasi “Sistahili tena,” neno “tena” hutoa kwa kawaida maana ya “si ... tena” au “no longer.”
- source_word: ἄξιος
  choice: nastahili
  rationale: Kitenzi “kustahili” hutoa maana ya kufaa au kuwa na hadhi inayostahiki katika ungamo hili la mwana.
- source_word: κληθῆναι
  choice: kuitwa
  rationale: Hii ni tafsiri ya kawaida ya kauli tendwa ya καλέω na inafaa katika muktadha wa hadhi ya kifamilia.
- source_word: υἱός σου
  choice: mwanao
  rationale: “Mwanao” ni Kiswahili cha asili kinachohifadhi uhusiano wa kifamilia na kimilikishi uliomo katika Kigiriki.
theological_decisions:
- issue: Maana ya “mbingu” katika ungamo
  choice: Kuhifadhi “dhidi ya mbingu” kama njia ya heshima ya kuashiria dhambi dhidi ya Mungu.
  alternative: Kutafsiri moja kwa moja kuwa “dhidi ya Mungu.”
  rationale: Kigiriki kinasema “dhidi ya mbingu.” Kuihifadhi kauli hiyo hutanguliza ushahidi wa lugha asili na kuacha maana yake ya heshima ionekane bila kuifafanua kupita maandishi.
- issue: Urefu wa maneno ya mwana katika mstari huu
  choice: Kumalizia kauli kwa “mwanao,” kulingana na matini ya SBLGNT iliyotolewa.
  alternative: Kuongeza “Unifanye kama mmoja wa wafanyakazi wako wa kuajiriwa,” kama inavyoonekana katika baadhi ya hati na kama alivyopanga kusema katika mstari wa 19.
  rationale: Matini ya msingi iliyotolewa inamalizia kauli hapa. Tofauti ya hati imeonyeshwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Yule mwana” husaidia urejeleo wa kisimulizi, huku “Sistahili tena kuitwa mwanao” likiwa tamko la kawaida na lenye uzito wa ungamo. Alama za tanbihi zimewekwa baada ya “mbingu” na mwisho wa kauli ili zihusiane wazi na masuala yanayoelezwa.
