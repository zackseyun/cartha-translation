  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: sw
  text: Lakini alikasirika, naye hakutaka kuingia ndani.[a] Basi baba yake akatoka nje, akamsihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakupenda kuingia ndani” au “alikataa kuingia ndani.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “akamsihi” kinaweza pia kutafsiriwa “akamshawishi” au “akamwomba sana”; wakati usiotimilifu unaweza kudokeza ombi lililoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: alikasirika
  rationale: Kitenzi hiki katika muktadha kinaonyesha kuingia katika hali ya hasira; ‘alikasirika’ ni Kiswahili cha kawaida na hakizidishi nguvu kama ‘alighadhabika sana.’
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi cha kwanza kinaonyesha utofauti mdogo kati ya sherehe iliyotangulia na mwitikio wa mwana mkubwa.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: hakutaka kuingia ndani
  rationale: Huhifadhi maana ya kutokuwa na nia ya kuingia bila kuifanya kwa lazima kuwa kukataa waziwazi.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Basi baba yake
  rationale: δὲ ya pili inaendeleza simulizi na kutambulisha mwitikio wa baba; ‘Basi’ ni ya asili katika Kiswahili hapa.
- source_word: ἐξελθὼν
  choice: akatoka nje
  rationale: Inaonyesha baba akiondoka ndani ya nyumba kwenda mahali mwana alikokuwa.
- source_word: παρεκάλει
  choice: na kuendelea kumsihi
  rationale: ‘Kumsihi’ huonyesha ombi la dhati, na ‘kuendelea’ hubainisha hali ya tendo linaloendelea au kurudiwa inayodokezwa na wakati usiotimilifu.
- source_word: αὐτόν
  choice: -m- katika kumsihi
  rationale: Kiambishi cha yambwa kinamrejelea mwana mkubwa kwa njia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Toni ya ombi la baba katika mfano
  choice: kumsihi
  alternative: kumhimiza; kumwomba sana
  rationale: ‘Kumsihi’ huhifadhi juhudi ya baba yenye dhati na neema bila kuingiza maana ya kimafundisho isiyosemwa moja kwa moja na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na unaeleweka kwa wasomaji wengi; ‘ndani’ na ‘nje’ zinaweka wazi mwelekeo wa mwendo bila kuongeza habari mpya.
