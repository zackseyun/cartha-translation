lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Akamwita
  rationale: Kitenzi hiki kinaonyesha kwamba alimwita mtu aje kwake kabla ya kumuuliza; ‘akamwita’ ni ya asili na inahifadhi mfuatano wa matendo.
- source_word: παίδων
  choice: watumishi
  rationale: Ingawa παῖς inaweza kumaanisha mtoto au mtumishi, mazingira ya nyumba hii yanaonyesha kwamba hapa ni mtumishi.
- source_word: ἐπυνθάνετο
  choice: akamuuliza
  rationale: Hiki ni kitenzi cha kuuliza ili kupata habari. Kauli ‘akamuuliza’ ni ya kawaida katika Kiswahili na inafaa katika mfululizo huu wa simulizi.
- source_word: τί ἂν εἴη ταῦτα
  choice: mambo hayo yangeweza kuwa nini
  rationale: Kauli hii inahifadhi swali lisilo la moja kwa moja pamoja na hali ya kutokuwa na uhakika, bila kulifafanua moja kwa moja kuwa swali kuhusu maana.
