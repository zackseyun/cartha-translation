  text: Akaita mmoja wa watumishi, akamuuliza mambo hayo yalikuwa nini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mambo hayo yalimaanisha nini.” Kigiriki kwa karibu zaidi: “mambo haya yalikuwa nini?”'
