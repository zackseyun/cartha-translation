  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: sw
  text: Naye alitamani kujaza tumbo lake kwa maganda ya karobu[a] ambayo nguruwe walikuwa wakila, wala hakuna mtu aliyekuwa akimpa chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maganda”; neno la Kigiriki linamaanisha hasa maganda ya mti wa karobu, ambayo kwa kawaida yalitumiwa kuwa chakula cha mifugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: alitamani
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tamaa iliyoendelea; “alitamani” ni ya kawaida na inaonyesha hamu kubwa katika muktadha wa njaa.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: kujaza tumbo lake
  rationale: Huhifadhi taswira halisi ya kujaza tumbo badala ya tafsiri ya kimahusiano kama “kushibisha njaa yake.”
- source_word: ἀπὸ τῶν κερατίων
  choice: kwa maganda ya karobu
  rationale: Katika Kiswahili, “kujaza ... kwa” ni muundo wa asili; κεράτια humaanisha hasa maganda ya karobu yaliyotumiwa kama chakula cha wanyama.
- source_word: οἱ χοῖροι
  choice: nguruwe
  rationale: Ni neno la kawaida, la sasa, na linaloeleweka wazi katika Kiswahili Sanifu.
- source_word: ἤσθιον
  choice: walikuwa wakila
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama hali ya kitenzi cha Kigiriki isiyotimilika.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: hakuna mtu aliyekuwa akimpa chochote
  rationale: “Aliyekuwa akimpa” huhifadhi wazo la hali iliyoendelea, na “chochote” huweka wazi kitu kilichodokezwa lakini hakikutajwa katika Kigiriki.
