id: LUK.15.8
reference: Luke 15:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: sw
  text: Au ni mwanamke gani aliye na drakma kumi ambaye, akipoteza drakma moja[a], hatawasha taa, hatafagia nyumba, wala kuitafuta kwa uangalifu[b] mpaka aipate?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drakma ilikuwa sarafu ya fedha ya Kigiriki.
    reason: cultural_note
  - marker: b
    text: Au, “kwa bidii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Au
  rationale: Inaunganisha mfano huu na mfano uliotangulia bila kuongeza maneno yasiyomo katika Kigiriki.
- source_word: τίς γυνὴ
  choice: ni mwanamke gani
  rationale: Ni namna ya kawaida ya Kiswahili ya kuanzisha swali la balagha linalotarajia jibu chanya.
- source_word: δραχμὰς
  choice: drakma
  rationale: Inahifadhi jina mahususi la sarafu ya kale badala ya kulifanya neno la jumla kama ‘sarafu’; maelezo ya kitamaduni yametolewa katika tanbihi.
- source_word: ἔχουσα δέκα
  choice: aliye na drakma kumi
  rationale: Muundo wa kirejeshi ni wa kawaida katika Kiswahili na unawakilisha kirai cha Kigiriki cha hali ya kuwa navyo.
- source_word: ἐὰν ἀπολέσῃ
  choice: akipoteza
  rationale: Kiambishi ‘-ki-’ kinaeleza hali ya sharti ya jumla kwa ufupi na kwa lugha ya kawaida.
- source_word: δραχμὴν μίαν
  choice: drakma moja
  rationale: Inahifadhi aina ya sarafu na mkazo kwamba ni moja tu iliyopotea.
- source_word: οὐχὶ
  choice: hatawasha
  rationale: Huwasilisha swali la balagha linalotarajia kukubaliwa kwamba bila shaka mwanamke huyo atafanya mambo yanayotajwa.
- source_word: ἅπτει λύχνον
  choice: kuwasha taa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kuwasha chanzo cha mwanga; hakuna ulazima wa kuifanya taa hiyo kuwa mahususi.
- source_word: σαροῖ τὴν οἰκίαν
  choice: kufagia nyumba
  rationale: Inahifadhi tendo halisi na mazingira ya nyumbani kwa lugha rahisi ya sasa.
- source_word: ζητεῖ ἐπιμελῶς
  choice: kuitafuta kwa uangalifu
  rationale: Kiwakilishi ‘-i-’ kinarejelea drakma, na ‘kwa uangalifu’ kinaonyesha namna makini ya kutafuta huku ‘kwa bidii’ ikibaki kuwa tafsiri halali mbadala.
- source_word: ἕως οὗ εὕρῃ
  choice: mpaka aipate
  rationale: Inaonyesha kikomo cha tendo la kutafuta na kumtaja drakma kwa kiwakilishi kinachofaa.
