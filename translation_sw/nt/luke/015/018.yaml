id: LUK.15.18
reference: Luke 15:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: sw
  text: Nitaondoka niende kwa baba yangu, nami nitamwambia, ‘Baba, nimefanya dhambi dhidi ya mbingu[a] na mbele yako[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya Mungu”; hapa “mbingu” huenda ni njia ya heshima ya kumrejelea Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “machoni pako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Nitaondoka
  rationale: Kitenzi hiki kwa umbo la kitenzi-tegemezi hutaja hatua ya kwanza katika azimio la mwana. Katika Kiswahili cha kawaida, “nitaondoka” huonyesha kuinuka ili kuanza safari bila kutoa wazo lisilokusudiwa la kuamka usingizini.
- source_word: πορεύσομαι
  choice: niende
  rationale: Hutaja kwenda kuelekea kwa baba. Baada ya “nitaondoka,” muundo “niende” ni wa asili katika Kiswahili na unaendeleza azimio lake.
- source_word: πρὸς τὸν πατέρα μου
  choice: kwa baba yangu
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha mwendo unaomwelekea mtu; “kwa baba yangu” ni usemi wa kawaida wa Kiswahili kwa kwenda mahali alipo mtu.
- source_word: ἐρῶ αὐτῷ
  choice: nitamwambia
  rationale: Ni usemi wa wakati ujao wenye yambwa ya mtu. “Nitamwambia” ni wa kawaida na huwasilisha moja kwa moja maneno atakayosema kwake.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja. “Baba” huhifadhi namna ya mwana kumwita baba yake bila kuongeza kimilikishi kisichopo katika Kigiriki.
- source_word: ἥμαρτον
  choice: nimefanya dhambi
  rationale: Ingawa ni aoristi, katika ungamo tendo lililofanyika lina matokeo ya sasa. “Nimefanya dhambi” ni ungamo la asili katika Kiswahili na linaonyesha uzito huo wa sasa.
- source_word: εἰς τὸν οὐρανὸν
  choice: dhidi ya mbingu
  rationale: Neno halisi ni “mbingu,” huenda likiwa njia ya heshima ya kumrejelea Mungu. Tafsiri hii huhifadhi usemi wa chanzo badala ya kuubadili moja kwa moja kuwa ufafanuzi.
- source_word: ἐνώπιόν σου
  choice: mbele yako
  rationale: ἐνώπιον humaanisha mbele ya mtu, katika uwepo wake au machoni pake. “Mbele yako” huhifadhi tofauti kati ya kifungu hiki na “dhidi ya mbingu.”
theological_decisions:
- issue: Ikiwa “mbingu” ifasiriwe wazi kuwa “Mungu” katika matini kuu
  choice: 'Kuhifadhi “mbingu”: “nimefanya dhambi dhidi ya mbingu”'
  alternative: “nimefanya dhambi dhidi ya Mungu”
  rationale: Ingawa “mbingu” huenda ni njia ya heshima ya kumrejelea Mungu, Kigiriki kinatumia οὐρανός. Kuihifadhi kunawawezesha wasomaji kuona usemi wa chanzo na huepuka kutatua kimya kimya maana yake ya kitheolojia.
- issue: Ikiwa ἐνώπιόν σου isawazishwe na kifungu kilichotangulia kuwa “dhidi yako”
  choice: “mbele yako”
  alternative: “dhidi yako”
  rationale: Matini hubadili kwa makusudi muundo kutoka εἰς hadi ἐνώπιον. “Mbele yako” huhifadhi tofauti hiyo na maana ya kuwa katika uwepo au machoni pa baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Nitaondoka niende” ni wa kawaida na unaeleweka kwa urahisi; “dhidi ya mbingu” ni wa kimakusudi zaidi ili kuhifadhi nahau na utata wa matini asili. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
