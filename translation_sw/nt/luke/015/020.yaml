  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: sw
  text: Basi akainuka, akaenda kwa baba yake. Lakini alipokuwa bado mbali, baba yake alimwona, akajawa na huruma; akakimbia, akamwangukia shingoni, akambusu kwa upendo mwingi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kudokeza busu la upendo lenye msisitizo, labda akambusu mara nyingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: akaondoka
  rationale: Katika muktadha huu kitenzi kinaonyesha hatua ya mwana kuinuka na kuanza kutekeleza uamuzi wake; “akaondoka” ni ya asili katika simulizi la Kiswahili na haijirudii kwa uzito pamoja na kitenzi kinachofuata.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: akaenda kwa baba yake
  rationale: ἔρχομαι inaweza kumaanisha kuja au kwenda kutegemea mtazamo. “Akaenda kwa baba yake” hufuata kwa kawaida mtazamo wa mwana anayeondoka alikokuwa, huku ἑαυτοῦ ikitafsiriwa kwa kawaida kuwa “yake.”
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: alipokuwa bado mbali
  rationale: Huhifadhi hali ya wakati mmoja inayoonyeshwa na genitive absolute na maana ya umbali bila kuongeza kipimo kisichotajwa.
- source_word: ἐσπλαγχνίσθη
  choice: akajawa na huruma
  rationale: Huonyesha huruma ya ndani yenye nguvu na inasikika kwa kawaida na kwa heshima katika Kiswahili cha sasa.
- source_word: δραμὼν
  choice: akakimbia
  rationale: Ni tafsiri ya moja kwa moja ya tendo la kukimbia na huhifadhi mwendo wa haraka wa simulizi.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: akamwangukia shingoni
  rationale: Huhifadhi taswira halisi ya nahau ya Kigiriki bila kuipanua moja kwa moja kuwa “akamkumbatia,” ingawa kukumbatia kunaeleweka katika tendo hilo.
- source_word: κατεφίλησεν
  choice: akambusu kwa shauku
  rationale: Kitenzi chenye kiambishi kinaweza kuonyesha busu la upendo lenye nguvu, na huenda pia busu la kurudiwa. “Kwa shauku” huhifadhi uzito wa hisia bila kulazimisha maana ya kurudia.
theological_decisions:
- issue: Namna huruma ya baba inavyoonyeshwa katika mfano
  choice: Kuitoa kwa lugha yenye hisia wazi bila kuifanya moja kwa moja kuwa ufafanuzi wa kimafundisho kuhusu Mungu.
  alternative: Kupunguza nguvu ya hisia, au kuongeza maelezo yanayomtambulisha baba moja kwa moja na Mungu.
  rationale: Matendo ya baba katika mstari wenyewe yana nguvu na uanzilishi wa huruma. Tafsiri inayahifadhi bila kuingiza hitimisho la kialegoria lisilotamkwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Mfuatano wa “aka-” unahifadhi kasi ya simulizi. Alama [a] imewekwa baada ya kishazi kinachohusika.
