translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Akajishikiza kwa” limechaguliwa ili kuhifadhi uzito wa ἐκολλήθη, huku tanbihi ikionyesha tafsiri mbadala. Kiwakilishi katika “naye akamtuma” humrejelea raia aliyetajwa, kama inavyodai muktadha.
