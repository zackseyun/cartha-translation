  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: sw
  text: Basi akaenda akajiambatanisha na raia mmoja wa nchi ile[a]. Raia huyo akamtuma katika mashamba yake kuchunga nguruwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajishikamanisha na” au “akajishikiza kwa.” Kitenzi cha Kigiriki hudokeza kujifunga kwa karibu na mtu, hata kwa kumtegemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: akaenda
  rationale: Kitenzi hiki cha hali ya kushiriki kinatangulia tendo kuu na kueleza kwenda kwake; “akaenda” ni cha kawaida na huhifadhi mfuatano wa matendo.
- source_word: ἐκολλήθη
  choice: akajishikiza kwa
  rationale: Kitenzi hiki kina wazo la kujiambatanisha kwa karibu, hata kwa utegemezi. “Akajishikiza kwa” hudokeza hali hiyo bila kuifanya iwe ajira ya kawaida tu.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: kwa raia mmoja
  rationale: πολίτης humaanisha mwanachama au raia wa jumuiya ya kisiasa; “raia mmoja” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: τῆς χώρας ἐκείνης
  choice: wa nchi ile
  rationale: χώρα inaweza kuwa nchi, eneo, au ardhi; “nchi ile” inafaa muktadha wa simulizi na inadumisha uhusiano na nchi ya mbali iliyotajwa awali.
- source_word: ἔπεμψεν
  choice: akamtuma
  rationale: Tafsiri ya moja kwa moja ya πέμπω; kiambishi cha mtenda katika muktadha kinamrejelea raia aliyetajwa.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: katika mashamba yake
  rationale: ἀγρός hapa ni shamba au eneo la kilimo/malisho. Wingi “mashamba” huhifadhi umbo la chanzo.
- source_word: βόσκειν
  choice: kuchunga
  rationale: βόσκω ni kulisha au kuchunga mifugo; “kuchunga nguruwe” ni usemi wa asili wa Kiswahili unaojumuisha kuwapeleka malishoni na kuwatunza.
- source_word: χοίρους
  choice: nguruwe
  rationale: Neno la kawaida na la kisasa la Kiswahili kwa χοῖρος.
