id: LUK.15.13
reference: Luke 15:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: sw
  text: Baada ya siku chache[a], mwana mdogo akakusanya kila kitu, akaondoka kwenda nchi ya mbali. Huko akatapanya mali yake[b], akiishi maisha ya ovyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya siku zisizo nyingi.” Huo ndio muundo halisi wa usemi wa Kigiriki.
    reason: lexical_alternative
  - marker: b
    text: Au “miliki yake” au “utajiri wake.”
    reason: lexical_alternative
  - marker: c
    text: Au “akiishi kwa ubadhirifu” au “akiishi kiholela.” Maandishi hayataji hapa dhambi fulani maalumu, bali yanaeleza maisha ya ovyo na yasiyo na kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Baada ya siku chache
  rationale: Ni Kiswahili cha kawaida na cha asili kwa usemi wa Kigiriki wenye maana halisi ya “baada ya siku zisizo nyingi”; tanbihi inahifadhi muundo huo wa chanzo.
- source_word: συναγαγὼν πάντα
  choice: akakusanya kila kitu
  rationale: Inadumisha wazo la kukusanya vyote kabla ya kuondoka bila kudai wazi kwamba aligeuza mali yote kuwa fedha.
- source_word: ὁ νεώτερος υἱός
  choice: mwana mdogo
  rationale: Ni tafsiri ya kawaida ya mwana aliye mdogo kwa umri katika muktadha wa wana wawili.
- source_word: ἀπεδήμησεν
  choice: akaondoka kwenda
  rationale: Inaonyesha kuondoka na kusafiri kwenda mahali pengine; kirai kinachofuata kinaeleza umbali wa mahali hapo.
- source_word: εἰς χώραν μακράν
  choice: nchi ya mbali
  rationale: Ni usemi wa asili na unaoeleweka kwa χώραν μακράν bila kubainisha eneo lisilotajwa.
- source_word: διεσκόρπισεν
  choice: akatapanya
  rationale: Kitenzi hiki kwa habari ya mali humaanisha kuitumia vibaya au kuipoteza; “akatapanya” huhifadhi pia taswira ya msingi ya kutawanya.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: mali yake
  rationale: “Mali” ni neno pana linaloweza kujumuisha miliki, utajiri na vitu alivyokuwa navyo, bila kuongeza ubainifu usiokuwapo katika chanzo.
- source_word: ζῶν ἀσώτως
  choice: akiishi maisha ya ovyo
  rationale: Inaeleza mwenendo usio na kiasi wala uwajibikaji bila kuingiza aina maalumu ya dhambi ambayo mstari huu hautaji.
theological_decisions:
- issue: Iwapo ζῶν ἀσώτως itafsiriwe kuwa dhambi fulani maalumu
  choice: akiishi maisha ya ovyo
  alternative: akiishi kwa uasherati / katika ufisadi
  rationale: Kielezi ἀσώτως kinaonyesha maisha ya kupotoka, ubadhirifu au kutowajibika kwa upana. Mstari wenyewe hautaji uasherati au kosa jingine maalumu, kwa hiyo tafsiri pana inalinda utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “akakusanya… akaondoka… akatapanya” unasimulia matukio kwa ufasaha, huku “maisha ya ovyo” ikibaki wazi na kuepuka kuingiza dhambi maalumu isiyotajwa.
