id: LUK.15.9
reference: Luke 15:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: sw
  text: Naye akiisha kuipata, anawaita pamoja rafiki zake wa kike na majirani zake, akisema, “Furahini pamoja nami, kwa sababu nimeipata drakma[a] niliyokuwa nimeipoteza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drakma ilikuwa sarafu ya fedha ya Kigiriki, ambayo katika mazingira mengi ilikuwa na thamani inayokaribia ujira wa siku moja wa mfanyakazi.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: akiisha kuipata
  rationale: Kirai cha kitenzi cha wakati uliopita kinarejelea mwanamke na kuonyesha kwamba kuipata sarafu kulitangulia kuwaita wengine; kiambishi -i- kinarejelea drakma iliyotajwa katika muktadha.
- source_word: συγκαλεῖ
  choice: anawaita pamoja
  rationale: Wakati wa sasa wa Kigiriki unaipa simulizi uhai; tafsiri hii pia huhifadhi wazo la kuwaita watu wakusanyike pamoja.
- source_word: φίλας
  choice: rafiki zake wa kike
  rationale: Umbo la Kigiriki ni la kike na la wingi, hivyo jinsia ya marafiki imewekwa wazi kwa Kiswahili cha kawaida.
- source_word: γείτονας
  choice: majirani zake
  rationale: Neno lina maana ya majirani; Kiswahili hakihitaji kutaja jinsia yao, jambo ambalo lingeongeza ufafanuzi usiolazimishwa na umbo lenyewe.
- source_word: λέγουσα
  choice: akisema
  rationale: Kirai hiki huanzisha maneno ya moja kwa moja kwa namna fupi na ya asili katika Kiswahili.
- source_word: Συγχάρητέ μοι
  choice: Furahini pamoja nami
  rationale: Amri ya wingi inawaalika wasikilizaji washiriki furaha ya mwanamke, huku ikihifadhi dhana ya kufurahi pamoja.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya mwaliko wa kufurahi.
- source_word: εὗρον
  choice: nimeipata
  rationale: Kauli ya kwanza umoja inaeleza tendo lililokamilika ambalo matokeo yake yapo wazi wakati mwanamke anapozungumza; timilifu ya Kiswahili ni ya asili hapa.
- source_word: δραχμὴν
  choice: drakma
  rationale: Jina mahususi la sarafu limehifadhiwa badala ya kulifanya kuwa ‘sarafu’ kwa ujumla; tanbihi inaeleza maana yake ya kitamaduni.
- source_word: ἣν ἀπώλεσα
  choice: niliyokuwa nimeipoteza
  rationale: Kirai rejeshi kinaitambulisha drakma na kuonyesha wazi kwamba kupoteza kulitangulia kuipata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Wakati wa sasa katika “anawaita” huhifadhi uhai wa kihistoria wa συγκαλεῖ, na “rafiki zake wa kike” huhifadhi jinsia iliyo wazi katika φίλας.
