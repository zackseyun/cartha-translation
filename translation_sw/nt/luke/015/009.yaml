  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: kirai cha awali kinaonyesha kupatikana kwa sarafu kabla ya mwito, wakati wa sasa wa kisimulizi katika “anawaita” umehifadhiwa, na wito wa wingi “Furahini pamoja nami” unalingana na Συγχάρητέ μοι. “Niliyokuwa nimeipoteza” huwasilisha kwa wazi upotevu uliotangulia kupatikana, bila kuongeza maana.'
