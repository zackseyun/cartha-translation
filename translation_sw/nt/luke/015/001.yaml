id: LUK.15.1
reference: Luke 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: sw
  text: Watoza ushuru na wenye dhambi wote walikuwa wakimkaribia ili kumsikiliza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakija karibu naye.” Muundo wa Kigiriki unaonyesha tendo lililokuwa likiendelea au kurudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ … ἐγγίζοντες
  choice: walikuwa wakimkaribia
  rationale: Muundo wa kitenzi ἦσαν pamoja na kitenzi-jina cha wakati uliopo unaonyesha tendo lililokuwa likiendelea au kurudiwa. Kiswahili ‘walikuwa wakimkaribia’ kinahifadhi hali hiyo kwa lugha ya kawaida. δέ haijatafsiriwa kwa kiunganishi maalumu kwa kuwa hapa hasa inaendeleza simulizi, na sentensi ya Kiswahili ni ya asili bila kuongeza neno la wakati.
- source_word: πάντες
  choice: wote
  rationale: ‘Wote’ inahusu makundi yote mawili yaliyotajwa na kuhifadhi msisitizo wa ukubwa wa kundi lililomjia Yesu.
- source_word: οἱ τελῶναι
  choice: watoza ushuru
  rationale: Hili ni neno la kawaida na linaloeleweka kwa watu waliokusanya ushuru au mapato chini ya utawala wa wakati huo.
- source_word: οἱ ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Usemi huu wa Kiswahili unawakilisha nomino ya Kigiriki inayowataja watu waliohesabiwa kuwa watenda dhambi, bila kuongeza maelezo ya kijamii au ya kimaadili yasiyosemwa wazi.
- source_word: ἀκούειν αὐτοῦ
  choice: ili kumsikiliza
  rationale: Kitenzi kisicho na kikomo kinaonyesha kusudi la kuwakaribia; ‘kumsikiliza’ linaonyesha kwa kawaida kusikia kwa makusudi mafundisho yake.
theological_decisions:
- issue: Maana ya kijamii na kidini ya ‘watoza ushuru na wenye dhambi’
  choice: Makundi yote mawili yametajwa moja kwa moja bila ufafanuzi wa ziada.
  alternative: watoza ushuru na watu wengine waliotengwa; watoza ushuru na wenye dhambi mashuhuri
  rationale: Kigiriki kinataja makundi haya bila kuyaeleza zaidi. Tafsiri ya moja kwa moja inadumisha mvutano wa simulizi bila kuingiza tafsiri ya kimadhehebu au maelezo ya kijamii yasiyokuwamo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walikuwa wakimkaribia’ ni wazi kwa wasomaji wa kawaida na huhifadhi hali endelevu ya Kigiriki; ‘wenye dhambi’ hudumisha istilahi ya simulizi bila kuipanua.
