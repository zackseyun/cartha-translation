lexical_decisions:
- source_word: εὑρὼν
  choice: akiisha kumpata
  rationale: Kirai hiki cha kitenzi katika hali ya aoristi kinaonyesha tendo linalotangulia tendo kuu. Kiswahili huhitaji yambwa; kiambishi “-m-” kinamrejelea kondoo aliyepotea katika muktadha uliotangulia.
- source_word: ἐπιτίθησιν
  choice: humweka
  rationale: Wakati uliopo wa Kigiriki unaendeleza usimulizi kwa uhai. Hali ya mazoea yenye “hu-” inafaa katika swali la mfano kuhusu kile mchungaji hufanya, na “weka” huonyesha kumweka kondoo juu ya mabega.
- source_word: ἐπὶ τοὺς ὤμους
  choice: mabegani
  rationale: ἐπί pamoja na hali ya accusative inaonyesha kusogezwa na kuwekwa juu ya mabega. “Mabegani” ni usemi wa kawaida na huhifadhi wingi wa ὤμους.
- source_word: αὐτοῦ
  choice: mwake
  rationale: Kiwakilishi hiki kinamrejelea mchungaji kama mwenye mabega, si kondoo.
- source_word: χαίρων
  choice: huku akifurahi
  rationale: Kirai cha wakati uliopo kinaonyesha hali inayoandamana na tendo kuu. “Huku akifurahi” huhifadhi uhusiano huo bila kuibadili kuwa maelezo ya namna pekee.
theological_decisions:
- issue: Yambwa lisilotajwa wazi baada ya εὑρὼν
  choice: Kumrejelea kondoo kwa kiambishi cha yambwa katika “kumpata”
  alternative: “akiisha kupata” bila yambwa dhahiri
  rationale: Kigiriki kinaacha yambwa lieleweke kutokana na muktadha, lakini Kiswahili cha kawaida hutumia kiambishi cha yambwa kwa kiumbe maalumu. Hili haliongezi tafsiri ya kitheolojia; linabainisha tu rejeo la kondoo aliyepotea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mabegani mwake” ni usemi wa asili; muundo “huku akifurahi” huhifadhi msisitizo wa furaha inayoandamana na tendo.
