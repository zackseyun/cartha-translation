  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: sw
  text: Naye akiisha kumpata[a], humweka mabegani mwake huku akifurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kondoo aliyepotea anayetajwa katika muktadha uliotangulia.
