lexical_decisions:
- source_word: εἶπεν
  choice: akawaambia
  rationale: Kitenzi hiki cha wakati uliopita kinatambulisha usemi; pamoja na πρὸς αὐτούς, “akawaambia” ni Kiswahili cha kawaida kinachoonyesha tendo la kusema na waelekezewa.
- source_word: δὲ
  choice: Basi
  rationale: δὲ ni kiunganishi chepesi cha simulizi. “Basi” linaunganisha jibu la Yesu na manung’uniko yaliyotangulia bila kuongeza wazo kali la upinzani.
- source_word: πρὸς αὐτοὺς
  choice: -waambia
  rationale: πρός pamoja na hali ya accusative hutaja waelekezewa wa maneno; kiambishi “-wa-” katika “akawaambia” kinawasilisha maana hiyo kwa njia ya asili katika Kiswahili.
- source_word: τὴν παραβολὴν ταύτην
  choice: mfano huu
  rationale: Katika muktadha wa Injili, παραβολή ni simulizi au ulinganisho wa kufundishia; “mfano” ni neno la kawaida na lililozoeleka katika Kiswahili, huku “huu” likihifadhi demonstrative ταύτην.
- source_word: λέγων
  choice: 'akisema:'
  rationale: Participle hii inatambulisha yaliyomo katika mfano. “Akisema:” huhifadhi muundo huo na kuongoza kwa kawaida kwenda katika nukuu inayofuata.
