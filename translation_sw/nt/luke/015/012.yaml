  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: sw
  text: Yule mdogo kati yao akamwambia baba yake, “Baba, nipe sehemu ya mali inayoniangukia.”[a] Basi baba akawagawia riziki yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya mali iliyo yangu” au “fungu linalonipasa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, “maisha/riziki yake” (βίον); hapa neno hilo linamaanisha mali au njia za baba za kujikimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: yule mdogo kati yao
  rationale: Kivumishi cha kulinganisha kimetumiwa kama nomino, ‘yule mdogo [kati yao]’. ‘Mwana’ inaeleweka kutokana na muktadha lakini haijasemwa wazi katika mstari huu.
- source_word: δός μοι
  choice: nipe
  rationale: Hii ni amri/ombi la moja kwa moja na ndiyo tafsiri ya kawaida na ya asili ya Kiswahili.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: sehemu ... inayoniangukia
  rationale: ‘Inayoniangukia’ huhifadhi wazo la fungu linalompasa au analostahili kupata, bila kulifanya kuwa dai la kisheria lililo wazi zaidi kuliko Kigiriki.
- source_word: οὐσία
  choice: mali
  rationale: Katika muktadha wa urithi, neno hili linamaanisha mali au milki; ‘mali’ ni la kawaida, pana, na linaloeleweka kwa urahisi.
- source_word: διεῖλεν
  choice: akawagawia
  rationale: Kitenzi kina maana ya kugawanya au kugawia; ‘akawagawia’ huonyesha kwa Kiswahili cha asili kwamba mali iligawanywa kwa watu hao.
- source_word: αὐτοῖς
  choice: akawagawia
  rationale: Kiambishi ‘-wa-’ kinawakilisha wingi wa ‘kwao’; muktadha unaonyesha baba aliwagawia wale wana wawili, bila kuhitaji kuongeza ‘kati yao’.
- source_word: βίον
  choice: riziki yake
  rationale: βίος hapa ni mali au njia za kujikimu zilizotegemeza maisha ya baba. ‘Riziki yake’ huhifadhi uhusiano wa neno hilo na maisha na mahitaji ya kuishi, huku tanbihi ikieleza maana ya kimuktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo ‘yule mdogo kati yao’ huhifadhi kwamba Kigiriki hakitaji wazi ‘mwana’ katika mstari huu. ‘Riziki’ imetumiwa kwa maana pana ya njia za kuishi, si chakula pekee, na tanbihi inaondoa uwezekano wa kutoeleweka.
