  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Alama zote za tanbihi zimewekwa katika matini kuu; [b] imewekwa baada ya kirai kinachoifafanua.
