  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: sw
  text: Vivyo hivyo[a], nawaambia, kuna furaha mbele ya malaika wa Mungu[b] kwa ajili ya mwenye dhambi mmoja anayetubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hivyo” au “Kwa namna hiyo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwepo wa malaika wa Mungu.” Maneno haya hayasemi wazi kwamba malaika wenyewe ndio wanaofurahi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Hurejelea kwa kulinganisha mfano uliotangulia na matumizi yake; ni Kiswahili cha kawaida na huhifadhi nguvu ya ulinganisho.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Huhifadhi usemi wa moja kwa moja kwa wingi kwa njia ya asili katika Kiswahili.
- source_word: γίνεται χαρά
  choice: kuna furaha
  rationale: Hueleza kutokea au kuwapo kwa furaha kwa Kiswahili cha kawaida bila kufanya sentensi kuwa nzito.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Huhifadhi maana ya kuwapo au kutokea katika uwepo wa wengine bila kuwataja malaika waziwazi kuwa watendaji wa kufurahi.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: malaika wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na yenye hadhi ya muundo wa Kigiriki.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: kwa ajili ya mwenye dhambi mmoja
  rationale: Hutaja mtu anayekuwa sababu au tukio la furaha; ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya kihusishi.
- source_word: μετανοοῦντι
  choice: anayetubu
  rationale: Kishirikishi cha wakati uliopo kinamfafanua mwenye dhambi katika tendo au hali ya kutubu, bila kupanua maana kiteolojia.
theological_decisions:
- issue: Maana ya lugha ya toba
  choice: anayetubu
  alternative: anayebadili nia; anayerudi
  rationale: Neno hili huhifadhi upana wa dhana ya kibiblia ya toba bila kuifafanua kwa namna inayobana maana yake au kuingiza fundisho la ziada.
- issue: Mahali au mtendaji wa furaha
  choice: kuna furaha mbele ya malaika wa Mungu
  alternative: malaika wa Mungu wanafurahi; kuna furaha miongoni mwa malaika wa Mungu
  rationale: Kigiriki kinasema furaha iko au hutokea ‘mbele ya’ malaika, bila kusema wazi kuwa malaika wenyewe ndio wanaofurahi; tafsiri hii huhifadhi utata huo halisi.
