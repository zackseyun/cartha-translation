id: LUK.15.24
reference: Luke 15:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: sw
  text: kwa sababu huyu mwanangu alikuwa amekufa, naye amekuwa hai tena[a]; alikuwa amepotea, naye amepatikana[b]. Basi wakaanza kusherehekea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa hai tena.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alipatikana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huanzisha sababu ambayo baba anatoa ya kufanya sherehe, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: οὗτος ὁ υἱός μου
  choice: huyu mwanangu
  rationale: Huhifadhi msisitizo wa kiashiria οὗτος na uhusiano wa upendo unaoonyeshwa na μου, huku ikiwa sentensi ya asili katika Kiswahili.
- source_word: νεκρὸς ἦν
  choice: alikuwa amekufa
  rationale: Huhifadhi lugha kali ya kifo bila kuifafanua kuwa ni ya kiroho au kijamii, na huonyesha hali iliyotangulia urejesho.
- source_word: ἀνέζησεν
  choice: amekuwa hai tena
  rationale: Hutoa maana ya kuishi tena na pia huonyesha hali ya sasa iliyotokana na urejesho, bila kutumia neno la kiufundi.
- source_word: ἦν ἀπολωλὼς
  choice: alikuwa amepotea
  rationale: Huhifadhi taswira kuu ya kilichopotea na kupatikana katika sura hii, pamoja na hali iliyokuwapo kabla ya kupatikana.
- source_word: εὑρέθη
  choice: amepatikana
  rationale: Huhifadhi kauli tendwa na haimtaji aliyempata, hivyo kutodhibiti uwazi wa wakala katika Kigiriki.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: wakaanza kusherehekea
  rationale: Huhifadhi mwanzo wa tendo unaoonyeshwa na ἤρξαντο; 'kusherehekea' ni lugha ya sasa inayofaa mazingira ya karamu na furaha.
theological_decisions:
- issue: Nguvu ya kisitiari ya ‘kufa’ na ‘kuwa hai tena’ katika mfano
  choice: Kuhifadhi lugha yenyewe ya kifo na uhai bila kuifafanua zaidi.
  alternative: Kutafsiri kwa maelezo kama ‘alikuwa kama amekufa kwa kutengwa, naye amerudishwa kiroho au kijamii.’
  rationale: Maneno ya baba yana nguvu ya kisitiari katika hadithi, lakini maandishi yenyewe yanatumia kwa makusudi mkabala mkali wa kifo na uhai. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa ‘huyu mwanangu’ ni wa asili na huhifadhi msisitizo. ‘Basi wakaanza’ huunganisha matokeo ya kauli ya baba na kuanza kwa sherehe.
