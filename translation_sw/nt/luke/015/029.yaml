  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: sw
  text: Lakini akamjibu baba yake, ‘Tazama, kwa miaka mingi hivi nimekuwa nikikutumikia kama mtumwa, na sijawahi kuvunja amri yako; lakini hujawahi kunipa hata mwana-mbuzi ili nisherehekee pamoja na rafiki zangu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: akamjibu baba yake
  rationale: Muundo huu wa kawaida wa Kiswahili unatoa maana ya nahau ya Kigiriki ‘akajibu, akasema’ bila uradidi usio wa lazima.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo kinachosisitiza malalamiko yanayofuata; ‘Tazama’ ni cha heshima na bado kinaeleweka katika Kiswahili cha sasa.
- source_word: τοσαῦτα ἔτη
  choice: miaka yote hii
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili wazo la kipindi kirefu linalosisitizwa na msemaji.
- source_word: δουλεύω σοι
  choice: nimekutumikia kama mtumwa
  rationale: δουλεύω ni kutumikia katika hali ya mtumwa au ya utegemezi mkubwa. Kauli hii inaonyesha jinsi mwana mkubwa anavyoitazama kwa uchungu huduma yake, bila kudai kwamba alikuwa mtumwa kihalisi.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: wala sijawahi kamwe kuvunja amri yako
  rationale: παρέρχομαι pamoja na ἐντολή humaanisha kuikiuka au kutoitii amri. ‘Kuvunja amri’ ni Kiswahili wazi na cha kawaida.
- source_word: ἔδωκας ἔριφον
  choice: kunipa hata mwana-mbuzi
  rationale: ἔριφος ni mbuzi mchanga. ‘Mwana-mbuzi’ ni sahihi na wazi, huku ‘hata’ ikionyesha udogo wa zawadi katika malalamiko hayo.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: ili nisherehekee pamoja na rafiki zangu
  rationale: Kishazi kinaonyesha kusudi, na εὐφραίνομαι katika muktadha huu ni kufurahi kwa sherehe au karamu.
theological_decisions:
- issue: Nguvu ya maana ya δουλεύω katika malalamiko ya mwana mkubwa
  choice: nimekutumikia kama mtumwa
  alternative: nimekutumikia
  rationale: Tafsiri kuu inahifadhi maana kali ya kundi la maneno ya δοῦλος na sauti ya uchungu ya mwana mkubwa. Neno ‘kama’ huepuka kugeuza malalamiko yake kuwa dai lisilo na utata kwamba yeye ni mtumwa kihalisi; mbadala laini umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli ya moja kwa moja imehifadhi msisitizo na uchungu wa mwana mkubwa bila kufanya lugha kuwa ya kale au kuingiza hitimisho la kimadhehebu.
