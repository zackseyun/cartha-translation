id: LUK.15.4
reference: Luke 15:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: sw
  text: Ni mtu gani kati yenu ambaye ana kondoo mia moja, na mmoja wao akipotea, hatawaacha wale tisini na tisa uwandani[a] na kwenda kumtafuta kondoo aliyepotea mpaka ampate?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyikani.” Neno la Kigiriki linaweza kumaanisha eneo la wazi, eneo la malisho, au mahali pasipokaliwa.
    reason: Njia mbadala ya kileksika kwa ἐρήμῳ, ambalo lina wigo mpana wa maana.
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Ni mtu gani kati yenu
  rationale: Muundo huu huhifadhi swali la balagha na mfano wa mtu mmoja. Neno “mtu” ni la kawaida na la asili katika Kiswahili, bila kuweka jinsia ambayo ἄνθρωπος haitilii mkazo katika muktadha huu.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: aliye na kondoo mia moja
  rationale: Ni tafsiri ya wazi na ya kawaida ya kishazi ambacho humtambulisha mwenye kundi.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: akimpoteza mmoja wao
  rationale: Huwasilisha tukio la kondoo mmoja kupotea kutoka katika kundi bila kudokeza kwamba mwenye kondoo alimwangamiza kwa makusudi.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: ambaye hatawaacha wale tisini na tisa
  rationale: Huhifadhi umbo hasi la swali la balagha, ambalo linatarajia jibu la kukubali.
- source_word: ἐν τῇ ἐρήμῳ
  choice: uwandani[a]
  rationale: “Uwandani” huonyesha eneo la wazi nje ya makazi na linafaa katika mazingira ya uchungaji, huku tanbihi ikihifadhi uwezekano wa maana ya nyika au eneo lisilokaliwa.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλός
  choice: kwenda kumtafuta yule aliyepotea
  rationale: Kiswahili cha asili huhitaji kueleza kusudi la kwenda; “kumtafuta” linaendana na kishazi kinachofuata, “mpaka ampate,” na “yule aliyepotea” huhifadhi hali inayoonyeshwa na participio timilifu.
- source_word: ἕως εὕρῃ αὐτό
  choice: mpaka ampate
  rationale: Ni usemi mfupi na wa kawaida unaoonyesha kwamba utafutaji unaendelea hadi kondoo apatikane.
theological_decisions:
- issue: Lugha ya mwakilishi katika swali la mfano
  choice: Kutumia “mtu”
  alternative: Kutumia “mwanamume” au kuanza kwa “nani” pekee
  rationale: ἄνθρωπος humtaja mtu mmoja katika mfano lakini hapa haitilii mkazo jinsia yake. “Mtu” hufuata maana ya neno la Kigiriki na ni lugha ya kawaida ya Kiswahili bila kupanua wala kupunguza wale wanaowakilishwa na swali.
- issue: Mahali walipoachwa kondoo tisini na tisa
  choice: Kutafsiri ἐρήμῳ kuwa “uwandani” na kuhifadhi upana wake katika tanbihi
  alternative: “nyikani,” “jangwani,” au “mahali pa malisho”
  rationale: Neno la Kigiriki lina wigo mpana na halilazimishi picha ya jangwa kame wala malisho mahsusi. Chaguo hili linaacha mvutano wa simulizi bila kudai maelezo ambayo aya haitoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la balagha limehifadhiwa; sentensi inatumia mtiririko wa kawaida wa simulizi na kuepuka istilahi za kimadhehebu.
