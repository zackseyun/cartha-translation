  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: sw
  text: Lakini baada ya kutumia kila kitu, njaa kali ikatokea katika nchi ile, naye akaanza kuwa na uhitaji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: baada ya kutumia kila kitu
  rationale: Muundo wa genitive absolute wenye kitenzi-jina cha aoristi unaelezwa kwa kawaida kama kishazi cha wakati. “Kutumia” linafuata maana ya δαπανάω bila kuongeza hukumu ya “kutapanya,” ambayo muktadha unaweza kuidokeza lakini kitenzi chenyewe hailazimishi.
- source_word: δέ
  choice: Lakini
  rationale: 'δέ huonyesha hatua mpya yenye utofauti katika simulizi: kutoka kuwa na mali hadi kuingia katika shida.'
- source_word: ἐγένετο
  choice: ikatokea
  rationale: Pamoja na λιμός, γίνομαι huonyesha kutokea au kuanza kwa tukio; “ikatokea” ni Kiswahili cha kawaida na wazi.
- source_word: λιμὸς ἰσχυρά
  choice: njaa kali
  rationale: ἰσχυρός hapa huongeza uzito wa λιμός; “njaa kali” ni usemi wa kawaida wa Kiswahili unaoonyesha ukali wa njaa.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: katika nchi ile
  rationale: κατά pamoja na accusative inaweza kuonyesha eneo ambamo jambo linaenea. “Katika nchi ile” ni usemi wa asili unaohifadhi χώρα kama nchi/eneo bila kulazimisha kwa wazi maana ya nchi nzima.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: naye akaanza kuwa na uhitaji
  rationale: ἤρξατο pamoja na infinitive huonyesha mwanzo wa hali, na ὑστερεῖσθαι hapa ni kukosa mahitaji au kuwa mhitaji. “Naye” pia huakisi αὐτός iliyo wazi na kuonyesha kwamba njaa ilimgusa yeye binafsi.
