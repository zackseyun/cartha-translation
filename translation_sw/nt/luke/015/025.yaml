id: LUK.15.25
reference: Luke 15:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: sw
  text: Mwanawe mkubwa alikuwa shambani. Alipokuwa akija na kuikaribia nyumba, alisikia muziki na dansi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muziki wa ala na vikundi vya wachezaji.” Maneno ya Kigiriki yanaweza kumaanisha hasa utendaji wa muziki na vikundi vinavyocheza.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: alikuwa
  rationale: δέ inaashiria mwendelezo au mpito wa simulizi bila kulazimisha utofautishaji; Kiswahili cha kawaida hakihitaji kiunganishi cha ziada hapa.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: mwanawe mkubwa
  rationale: πρεσβύτερος ni hali ya kulinganisha, yaani mwana aliye mkubwa kuliko yule mwingine, si lazima mzaliwa wa kwanza miongoni mwa watoto wengi.
- source_word: ἐν ἀγρῷ
  choice: shambani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuwa katika shamba au eneo la kilimo.
- source_word: ὡς ἐρχόμενος
  choice: alipokuwa akija
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati alipokaribia; hauongezi wazo lisilotajwa wazi la kurudi.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: kuikaribia nyumba
  rationale: Inawasilisha kwa kawaida tendo la kufika karibu na nyumba bila kuongeza kwamba alikuwa tayari ameingia.
- source_word: ἤκουσεν
  choice: alisikia
  rationale: Kitenzi cha simulizi katika wakati uliopita kinatafsiriwa kwa urahisi bila kuongeza maana ya kuanza kusikia.
- source_word: συμφωνίας
  choice: muziki
  rationale: Neno linaweza kumaanisha sauti au utendaji wa muziki, hasa wa ala; “muziki” ni pana, wazi, na halileti wazo la kisasa la simfoni.
- source_word: χορῶν
  choice: dansi
  rationale: Neno linaweza kurejelea dansi au vikundi vya wanaocheza. “Dansi” huhifadhi maana ya tukio bila kuamua kabisa kama msisitizo ni tendo au wachezaji.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi. Sentensi mbili zinatoa mtiririko wa asili wa simulizi. “Dansi” limetumiwa kwa maana ya kucheza kwa kufuata muziki, huku tanbihi ikihifadhi uwezekano wa “vikundi vya wachezaji.”
