translation:
  language: sw
  text: 'na kwamba,


    “Watakuchukua mikononi mwao,


    ili usije ukagonga mguu wako kwenye jiwe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili usije ukajikwaa kwa jiwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: na kwamba
  rationale: Huendeleza nukuu ya Maandiko kutoka mstari uliotangulia na kutambulisha sehemu nyingine ya yaliyomo katika nukuu hiyo.
- source_word: Ἐπὶ χειρῶν
  choice: mikononi mwao
  rationale: Ni Kiswahili cha kawaida kinachohifadhi taswira ya kubebwa kwa mikono, bila kulazimisha muundo usio wa asili wa ‘juu ya mikono yao.’
- source_word: ἀροῦσίν σε
  choice: watakuchukua
  rationale: Kitenzi αἴρω hapa kina maana ya kuinua na kubeba; ‘watakuchukua mikononi mwao’ huwasilisha tendo hilo kwa lugha ya sasa na inayoeleweka.
- source_word: μήποτε
  choice: ili usije
  rationale: Huonyesha kusudi la kuzuia jambo lisitokee, kwa muundo wa kawaida wa Kiswahili.
- source_word: προσκόψῃς
  choice: ukajikwaa
  rationale: Katika kishazi kinachotaja mguu na jiwe, neno hili linaweza kueleza mguu kugonga kitu na mtu kujikwaa; uchaguzi huu ni wa asili katika Kiswahili huku tanbihi ikihifadhi maana halisi zaidi ya kugonga.
- source_word: πρὸς λίθον
  choice: kwenye jiwe
  rationale: Pamoja na προσκόπτω, πρός huonyesha kugusana na kitu; ‘kwenye jiwe’ ni usemi wa kawaida katika Kiswahili.
- source_word: τὸν πόδα σου
  choice: mguu wako
  rationale: Umoja wa neno la Kigiriki umehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa nukuu ya Zaburi huku taswira ya ulinzi wa malaika ikihifadhiwa
  choice: Watakuchukua mikononi mwao
  alternative: Watakuinua kwa mikono yao
  rationale: Chaguo kuu ni la kawaida na wazi kwa msomaji wa sasa, huku likihifadhi maana ya kuinuliwa au kubebwa; haliongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mpangilio wa kishairi unaonyesha kuwa maneno hayo ni mwendelezo wa nukuu ya Maandiko.
