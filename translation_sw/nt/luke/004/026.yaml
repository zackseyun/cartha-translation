base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: sw
  text: Naye Eliya hakutumwa kwa yeyote kati yao, isipokuwa kwa Sarepta ya Sidoni, kwa mwanamke mjane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Sarepta ya Sidoni”; kwa kawaida hutambuliwa kuwa Sarefathi ya Agano la Kale (1 Wafalme 17:9).'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: hakutumwa
  rationale: Kauli tendwa ya πέμπω imetafsiriwa kwa kauli tendwa ya Kiswahili, bila kumtaja mtumaji ambaye Kigiriki hakumtaji wazi.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: kwa yeyote kati yao
  rationale: Katika sentensi hasi, ‘hakutumwa kwa yeyote kati yao’ ni Kiswahili cha kawaida kinachohifadhi maana ya kutengwa kwa wote waliotajwa.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hapa ni kishazi cha kuonyesha upekee, si sharti; ‘isipokuwa’ kinawasilisha maana hiyo kwa uwazi.
- source_word: Σάρεπτα
  choice: Sarepta
  rationale: Uhamishaji huu unafuata umbo la Kigiriki katika Luka; tanbihi inaunganisha mahali hapa na Sarefathi ya Agano la Kale.
- source_word: τῆς Σιδωνίας
  choice: katika eneo la Sidoni
  rationale: Genitivi hii inahusianisha Sarepta na eneo la Sidoni; tafsiri hii ya mahali ni ya asili katika Kiswahili na haidai kwamba mji huo ulikuwa ndani ya jiji lenyewe la Sidoni.
- source_word: πρὸς γυναῖκα χήραν
  choice: kwa mwanamke mjane
  rationale: Inahifadhi nomino γυναῖκα na kivumishi/apposisheni χήραν kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mtumaji wa Eliya anayedokezwa na kauli tendwa
  choice: 'Kuhifadhi kauli tendwa bila kumtaja mtumaji: ‘Eliya hakutumwa’'
  alternative: 'Kumtaja Mungu wazi: ‘Mungu hakumtuma Eliya’'
  rationale: Muktadha unadokeza utendaji wa Mungu, lakini maandishi ya Kigiriki hayamtaji mtumaji; tafsiri haiongezi jambo hilo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili zaidi kwa Kiswahili huku msisitizo wa kutotumwa kwa yeyote isipokuwa mjane huyo ukihifadhiwa.
