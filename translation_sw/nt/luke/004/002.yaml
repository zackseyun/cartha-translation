  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: sw
  text: kwa siku arobaini, huku akijaribiwa[a] na Ibilisi. Hakula chochote katika siku hizo, na zilipokwisha, akawa na njaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akipimwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kujaribiwa” au “kupimwa”; hapa “kujaribiwa” inafaa zaidi kwa sababu anayefanya hivyo ni Ibilisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: kwa siku arobaini
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha muda unaoendelea, na inawakilisha hali ya akusativi ya muda katika Kigiriki.
- source_word: πειραζόμενος
  choice: huku akijaribiwa
  rationale: Kitenzi cha Kigiriki kinaweza kumaanisha kujaribiwa kwa kishawishi au kupimwa. Kwa kuwa mtendaji ni Ibilisi, maana ya kishawishi inafaa zaidi; tanbihi inahifadhi maana nyingine inayowezekana.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: na Ibilisi
  rationale: Katika muktadha huu διάβολος ni jina au cheo kinachomtambulisha adui huyo binafsi; “Ibilisi” ndilo neno la kawaida na linaloeleweka wazi katika Kiswahili.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Hakula chochote
  rationale: Usemi huu wa kawaida unahifadhi ukanushaji kamili na mkazo wa kwamba hakula kitu hata kimoja.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: katika siku hizo
  rationale: Hueleza kipindi kile cha siku arobaini kwa Kiswahili cha kawaida bila kuongeza maana.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: zilipokwisha
  rationale: Kishazi hiki cha wakati ni cha asili katika Kiswahili na kinaonyesha kwamba siku hizo zilifikia mwisho.
- source_word: ἐπείνασεν
  choice: akawa na njaa
  rationale: Huwasilisha kwa kawaida hali au kuanza kwa njaa baada ya kumalizika kwa siku hizo, bila kutumia lugha nzito.
theological_decisions:
- issue: Maana ya πειραζόμενος kuhusu tukio la Yesu jangwani
  choice: akijaribiwa
  alternative: akipimwa
  rationale: “Akijaribiwa” inafaa zaidi kwa sababu Ibilisi ndiye mtendaji na muktadha unaelekea kwenye kishawishi. Hata hivyo, maana ya “kupimwa” inawezekana kimsamiati, kwa hiyo imehifadhiwa katika tanbihi bila kufafanua kwa mfumo fulani wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “huku akijaribiwa” unaunganisha hali inayoendelea na kipindi cha siku arobaini; sentensi ya pili imeanza kwa “Hakula” ili kuepuka “Na” isiyo ya lazima katika Kiswahili huku uhusiano wa mawazo ukibaki wazi.
