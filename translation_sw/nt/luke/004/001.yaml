id: LUK.4.1
reference: Luke 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: sw
  text: Naye Yesu, akiwa amejaa Roho Mtakatifu, alirudi kutoka Yordani, naye alikuwa akiongozwa na Roho[a] nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho.” Usemi wa Kigiriki unaweza kutafsiriwa kihalisi hivyo, ingawa hapa yaelekea unamaanisha kwamba Roho alikuwa akimwongoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: akiwa amejaa Roho Mtakatifu
  rationale: Neno πλήρης pamoja na hali ya umilikishi humaanisha kuwa na kitu kwa wingi au kwa ukamilifu. “Akiwa amejaa Roho Mtakatifu” ni Kiswahili cha asili, hudumisha hali inayoelezwa, wala halidokezi kwamba kujazwa kulitokea wakati huo tu.
- source_word: ὑπέστρεψεν
  choice: alirudi
  rationale: Kitenzi ὑποστρέφω hapa kina maana ya kurudi; “alirudi” ni tafsiri fupi na ya kawaida.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: kutoka Yordani
  rationale: Kigiriki kinataja Yordani bila kuongeza neno “mto.” Kiswahili kinaweza kutumia jina hilo moja kwa moja, huku muktadha ukionyesha mahali panaporejelewa.
- source_word: ἤγετο
  choice: alikuwa akiongozwa
  rationale: Kauli ya kutendwa katika wakati usiotimilifu inaonyesha tendo lililokuwa likiendelea. “Alikuwa akiongozwa” huhifadhi hali hiyo ya kuendelea.
- source_word: ἐν τῷ πνεύματι
  choice: na Roho
  rationale: 'Pamoja na ἄγω katika kauli ya kutendwa, ἐν inaweza kueleweka kwa maana ya chombo au mtendaji: Roho ndiye anayemwongoza Yesu. “Na Roho” ni usemi wazi na wa kawaida katika Kiswahili.'
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: ἔρημος hurejelea eneo lisilokaliwa, pori au jangwa. “Nyikani” huhifadhi upana huo bila kudokeza lazima eneo la mchanga.
- source_word: δὲ
  choice: Naye
  rationale: δέ ni kiunganishi chepesi cha mpito katika simulizi. “Naye” huunganisha mstari huu na yaliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Mhusika anayerejelewa na πνεῦμα katika ἐν τῷ πνεύματι
  choice: Roho Mtakatifu ndiye anayemwongoza Yesu
  alternative: hali ya ndani ya kiroho ya Yesu
  rationale: Kirai kilichotangulia mara moja, “amejaa Roho Mtakatifu,” na msisitizo wa Luka kuhusu utendaji wa Roho vinaonyesha kwa kawaida kwamba ni Roho yuleyule anayemwongoza Yesu. Tafsiri haitoi madai ya ziada nje ya mstari.
- issue: Maana ya ἐν katika ἐν τῷ πνεύματι
  choice: na Roho
  alternative: katika Roho
  rationale: Muundo wa Kigiriki unaweza kutafsiriwa kihalisi “katika Roho,” lakini katika muktadha wa kitenzi cha kutendwa unaelekea kuonyesha Roho kama mwongozaji. Tanbihi huhifadhi uwezekano wa muundo wa kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyikani” ni neno linaloeleweka katika mtindo wa kibiblia na halibani mazingira kuwa jangwa la mchanga. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
