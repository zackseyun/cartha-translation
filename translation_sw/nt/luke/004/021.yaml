  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: sw
  text: Ndipo akaanza kuwaambia, “Leo Andiko hili limetimia mnapolisikia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “masikioni mwenu.”
    reason: Inaonyesha muundo halisi wa nahau ya Kiyunani nyuma ya tafsiri ya kawaida ya Kiswahili “mnapolisikia.”
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: Ndipo akaanza kuwaambia
  rationale: ‘Ndipo’ linaonyesha mwendelezo wa simulizi bila kuweka upinzani mkali; ‘akaanza kuwaambia’ linawakilisha kwa Kiswahili cha kawaida muundo wa kuanza kusema kwa watu waliokuwapo.
- source_word: Σήμερον
  choice: Leo
  rationale: Neno hili limewekwa kwa msisitizo mwanzoni mwa tamko na linaendeleza hali ya utimilifu unaotangazwa wakati huo.
- source_word: πεπλήρωται
  choice: limetimia
  rationale: Kauli timilifu ya Kiyunani inaonyesha tendo lililokamilika lenye matokeo ya sasa. ‘Limetimia’ huhifadhi maana hiyo na pia upatanisho wa kisarufi na ‘Andiko.’
- source_word: ἡ γραφὴ αὕτη
  choice: Andiko hili
  rationale: Katika muktadha huu γραφή ni sehemu ya Maandiko iliyosomwa muda mfupi uliopita. Umoja ‘Andiko hili’ huhifadhi idadi na rejeleo la moja kwa moja la Kiyunani.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: mnapolisikia
  rationale: Hili ni tamko la nahau ambalo kwa neno ni ‘masikioni mwenu.’ ‘Mnapolisikia’ linaeleza kwa Kiswahili cha kawaida kwamba utimilifu unatokea katika kusikia kwao huku likihifadhi uhusiano wake na tangazo walilosikia.
theological_decisions:
- issue: Asili ya dai la utimilifu
  choice: Tamko limetafsiriwa kama tangazo la sasa kwamba Andiko limetimia, bila kuongeza mhusika au namna ya utimilifu.
  alternative: ‘Leo unabii huu umetimia kwangu mnapolisikia.’
  rationale: Kiyunani kinasema ‘Andiko hili’ limetimia katika kusikia kwao, lakini hakisemi wazi ‘unabii’ wala ‘kwangu/kupitia mimi.’ Muktadha unaweza kuelekeza huko, lakini tafsiri haipaswi kufanya maana hiyo kuwa wazi zaidi kuliko mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndipo akaanza kuwaambia’ ni mtiririko wa kawaida wa simulizi; ‘Andiko hili’ huhifadhi rejeleo la umoja bila kuongeza neno ‘unabii.’
