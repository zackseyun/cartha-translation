  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: sw
  text: Jua lilipokuwa linatua[a], wote waliokuwa na watu waliokuwa wagonjwa kwa magonjwa mbalimbali waliwaleta kwake; naye akaweka mikono yake juu ya kila mmoja wao na kuwaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jua lilipokuwa likitua.” Kigiriki kinatumia muundo wa genitivi huru wenye kitenzi-jina cha wakati wa sasa, unaoonyesha wakati ambapo matukio haya yalifanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Jua lilipokuwa likitua
  rationale: Muundo wa genitivi huru wenye kitenzi-jina cha wakati wa sasa unaonyesha wakati unaoendelea sambamba na matukio mengine. Kiswahili hiki kinahifadhi hali ya jua kuwa katika mchakato wa kutua.
- source_word: ἅπαντες ὅσοι
  choice: wote waliokuwa
  rationale: Muunganiko huu unasisitiza ujumla wa wahusika; “wote waliokuwa” ni wa kawaida na unaendeleza sentensi kwa uwazi.
- source_word: εἶχον ἀσθενοῦντας
  choice: waliokuwa na wagonjwa
  rationale: Hapa ἔχω pamoja na kitenzi-jina ina maana ya kuwa na watu wagonjwa katika kaya au chini ya uangalizi wao; tafsiri haidai uhusiano maalumu ambao maandishi hayataji.
- source_word: νόσοις ποικίλαις
  choice: wenye magonjwa mbalimbali
  rationale: Kirai kinaeleza aina tofauti za maradhi yaliyowapata wagonjwa. “Magonjwa mbalimbali” ni Kiswahili cha kawaida na sahihi.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: waliwaleta kwake
  rationale: Katika muktadha wa kuwapeleka wagonjwa kwa Yesu ili waponywe, “waliwaleta kwake” ni ya asili kuliko “waliwaongoza kwake.”
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: kila mmoja wao
  rationale: Usemi huu wa ugawaji unasisitiza kwamba kila mgonjwa alihudumiwa mmoja mmoja.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: akaweka mikono yake juu ya
  rationale: Hii inahifadhi tendo halisi la kuweka mikono juu ya kila mtu bila kuongeza maana ya kiibada isiyotajwa hapa.
- source_word: ἐθεράπευεν
  choice: kuwaponya
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea au kurudiwa kwa kila mmoja; muktadha wa “kila mmoja wao” unaleta maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuweka mikono juu ya wagonjwa
  choice: akaweka mikono yake juu ya kila mmoja wao
  alternative: alikuwa akiwawekea mikono kila mmoja wao
  rationale: Tafsiri inahifadhi tendo la Yesu la kimwili na uangalifu wake kwa kila mtu bila kulifanya moja kwa moja kuwa ibada au desturi ya baadaye ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Likitua” limetumiwa kwa jua kwa mtiririko wa kawaida; tanbihi inatoa “linatua” kama namna mbadala. Sentensi inadumisha msisitizo wa kila mgonjwa kuhudumiwa mmoja mmoja.
