  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: sw
  text: Kisha akalikunja gombo[a] na akalirudisha kwa mhudumu[b], akaketi. Macho ya wote waliokuwa katika sinagogi yalikuwa yamemkazia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitabu.” Neno la Kigiriki linaweza kumaanisha hati iliyoandikwa kwa ujumla, lakini katika mazingira haya ya sinagogi lilikuwa gombo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mhudumu wa sinagogi aliyekuwa na jukumu la kushughulikia magombo.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: akalikunja
  rationale: Kitenzi hiki kinaeleza kulikunja tena gombo baada ya kusoma; katika muktadha huu si kufunga kitabu cha kurasa.
- source_word: βιβλίον
  choice: gombo
  rationale: Ingawa neno hili linaweza kumaanisha maandishi au kitabu kwa ujumla, maandiko ya Isaya yaliyotumiwa katika sinagogi la karne ya kwanza yalikuwa katika umbo la gombo.
- source_word: ἀποδοὺς
  choice: kumrudishia
  rationale: Kitenzi kinaonyesha kukirudisha kitu kwa mwenye jukumu la kukitunza baada ya kutumiwa.
- source_word: ὑπηρέτῃ
  choice: mhudumu
  rationale: Katika mazingira ya sinagogi, huyu ni mhudumu aliyesaidia katika ibada na kushughulikia magombo; ‘mhudumu’ huepuka maana potovu ya mtumwa au afisa.
- source_word: ἐκάθισεν
  choice: akaketi
  rationale: Ni simulizi la moja kwa moja la tendo lililofuata, kwa lugha ya kawaida na yenye staha.
- source_word: πάντων
  choice: kila mtu
  rationale: Huhifadhi maana ya watu wote waliokuwapo bila kuleta muundo mzito katika Kiswahili.
- source_word: οἱ ὀφθαλμοὶ
  choice: alikuwa amemkazia macho
  rationale: Nahau ya Kiswahili ‘kumkazia macho’ huhifadhi taswira ya macho na maana ya kumtazama mtu kwa makini.
- source_word: ἀτενίζοντες
  choice: amemkazia macho
  rationale: Huonyesha mtazamo wa makini na unaoendelea bila kudokeza uadui.
- source_word: συναγωγῇ
  choice: sinagogi
  rationale: Muktadha unaonyesha mahali na taasisi ya ibada ya Kiyahudi, hivyo ‘sinagogi’ ndiyo tafsiri iliyo wazi.
theological_decisions:
- issue: Umbo la kihistoria la βιβλίον katika ibada ya sinagogi
  choice: gombo
  alternative: kitabu
  rationale: ‘Gombo’ linaonyesha kwa usahihi umbo la maandiko yaliyosomwa katika sinagogi la karne ya kwanza, bila kubadili maana ya kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘amemkazia macho’ ni wa kawaida na huwasilisha kwa uwazi uzito wa mtazamo unaoelezwa na Kigiriki.
