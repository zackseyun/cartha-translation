base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: sw
  text: Kisha aliondoka katika sinagogi, akaingia nyumbani kwa Simoni. Mama mkwe wa Simoni alikuwa ameshikwa na homa kali, nao wakamwuliza kuhusu yeye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamuomba kwa ajili yake.” Kigiriki kinasema kihalisi, “walimwuliza kuhusu yeye”; katika muktadha huenda maneno hayo yanadokeza ombi la msaada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Kisha aliondoka katika sinagogi
  rationale: Kirai hiki kinaonyesha tendo lililotangulia kuingia nyumbani kwa Simoni. Katika Kiswahili, “aliondoka katika sinagogi” huwasilisha mwendo kutoka mahali hapo kwa lugha ya kawaida bila kulazimisha usemi mgumu wa neno kwa neno kama “akiinuka kutoka sinagogini.”
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: akaingia nyumbani kwa Simoni
  rationale: Huwasilisha wazi kuingia ndani ya makao ya Simoni; “nyumbani kwa Simoni” ni usemi wa asili na wa kawaida katika Kiswahili.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: Mama mkwe wa Simoni
  rationale: πενθερά humaanisha hasa mama mkwe. Tafsiri inataja uhusiano huo moja kwa moja bila kuongeza hitimisho jingine.
- source_word: ἦν συνεχομένη
  choice: alikuwa ameshikwa
  rationale: Muundo wa hali tendwa unaonyesha kwamba ugonjwa ulikuwa umemshika au kumlemea. “Alikuwa ameshikwa” huhifadhi picha hiyo kwa Kiswahili kinachoeleweka.
- source_word: πυρετῷ μεγάλῳ
  choice: na homa kali
  rationale: μέγας hapa huonyesha uzito wa homa. “Homa kali” ni usemi wa kawaida wa Kiswahili na haudai kwa lazima kipimo maalumu cha joto.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: wakamwomba kwa ajili yake
  rationale: ἐρωτάω inaweza kumaanisha kuuliza au kuomba, na muktadha unaelekea kwenye ombi lililotolewa kwa niaba ya mwanamke huyo. Tafsiri hii haitaji wazi tendo maalumu walilotaka afanye; tofauti ya karibu zaidi na muundo halisi imewekwa katika tanbihi.
theological_decisions:
- issue: Maana inayodokezwa na kutajwa kwa mama mkwe wa Simoni
  choice: Kutafsiri uhusiano huo moja kwa moja kuwa “Mama mkwe wa Simoni.”
  alternative: Kupanua habari hiyo kwa kusema wazi kwamba Simoni alikuwa ameoa.
  rationale: Neno la Kigiriki linataja mama mkwe, lakini mstari wenyewe haupanui hoja kuhusu hali ya ndoa ya Simoni. Tafsiri haipaswi kuongeza hitimisho la ufafanuzi ndani ya matini.
- issue: Kiwango cha uwazi wa ombi katika ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: “wakamwomba kwa ajili yake”
  alternative: “wakamwomba amponye” au “wakamwomba amsaidie”
  rationale: Muktadha unaashiria ombi la msaada, lakini Kigiriki hakitaji moja kwa moja kuponya au kusaidia. Chaguo kuu huhifadhi ombi la niaba yake bila kulifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. “Nyumbani kwa Simoni,” “ameshikwa na homa kali,” na “kwa ajili yake” ni miundo inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa kwenye kirai kinachohusika moja kwa moja.
