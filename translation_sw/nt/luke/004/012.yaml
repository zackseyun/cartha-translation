  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: sw
  text: Yesu akamjibu, “Imesemwa:[a] ‘Usimjaribu Bwana Mungu wako.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri nyingi zilizozoeleka husema “Imeandikwa.” Hata hivyo, Kigiriki hapa kinasema kihalisi “Imesemwa.”
    reason: alternative_reading
  - marker: b
    text: Hii ni nukuu kutoka Kumbukumbu la Torati 6:16, ambako Kiebrania kina jina la Mungu YHWH, ambalo mara nyingi hutafsiriwa “BWANA.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: akamjibu
  rationale: Muundo huu wa Kigiriki, unaochanganya kitenzi tegemezi na kitenzi kikuu, kwa kawaida humaanisha ‘alimjibu’ au ‘akajibu.’ ‘Akamjibu’ ni Kiswahili cha kawaida na pia hudokeza kuwa alimjibu yule aliyekuwa akizungumza naye.
- source_word: ὅτι
  choice: —
  rationale: Baada ya ‘akamjibu,’ Kiswahili hakihitaji kiunganishi ‘kwamba’ kabla ya maneno yaliyonukuliwa moja kwa moja.
- source_word: Εἴρηται
  choice: Imesemwa
  rationale: Hii ni kauli tendwa ya wakati timilifu ya λέγω, yenye maana ya kwamba jambo hilo limesemwa na linabaki kuwa na mamlaka. ‘Imesemwa’ hufuata kitenzi cha Kigiriki kuliko ‘Imeandikwa.’
- source_word: Οὐκ ἐκπειράσεις
  choice: Usimjaribu
  rationale: ἐκπειράζω humaanisha kumweka mtu katika jaribio au kumjaribu kwa makusudi. ‘Usimjaribu’ ni kauli fupi na ya kawaida katika Kiswahili, na katika muktadha huu haimaanishi kumshawishi Mungu atende dhambi.
- source_word: κύριον
  choice: Bwana
  rationale: κύριος limetafsiriwa kwa neno la kawaida ‘Bwana,’ kwa kuzingatia umbo la nukuu ya Kigiriki.
- source_word: τὸν θεόν σου
  choice: Mungu wako
  rationale: Tafsiri hii huhifadhi nafsi ya pili umoja na muundo wa agano katika nukuu ya Kumbukumbu la Torati.
theological_decisions:
- issue: Kauli ya kutanguliza nukuu ya Maandiko (Εἴρηται)
  choice: Imesemwa
  alternative: Imeandikwa; Imekwisha kusemwa
  rationale: Nakala ya Kigiriki inatumia λέγω (‘sema’), si γράφω (‘andika’). Kwa hiyo matini kuu huhifadhi ‘Imesemwa,’ huku tafsiri iliyozoeleka ya ‘Imeandikwa’ ikitajwa katika tanbihi.
- issue: Tafsiri ya κύριος katika nukuu ya Kumbukumbu la Torati 6:16
  choice: Bwana
  alternative: BWANA
  rationale: Luka ana κύριος katika Kigiriki, hivyo matini kuu inafuata ‘Bwana.’ Hata hivyo, chanzo cha Kiebrania cha nukuu hii kina jina la Mungu YHWH, jambo linaloelezwa katika tanbihi bila kubadili umbo la Kigiriki kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Akamjibu’ ni simulizi la kawaida, ‘Imesemwa’ huhifadhi tofauti ya Kigiriki, na ‘Usimjaribu’ huhifadhi nguvu ya katazo bila kuongeza ufafanuzi wa kimadhehebu.
