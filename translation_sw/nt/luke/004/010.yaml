lexical_decisions:
- source_word: γέγραπται γὰρ
  choice: Kwa maana imeandikwa
  rationale: Kauli hii ni ya kawaida na yenye hadhi katika kunukuu Maandiko; “kwa maana” inadumisha uhusiano wa maelezo na mstari uliotangulia, na “imeandikwa” inaonyesha kwamba yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: malaika wake
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kirai cha umilikaji katika Kiswahili.
- source_word: ἐντελεῖται
  choice: atawaamuru
  rationale: Kitenzi hiki cha wakati ujao kinamaanisha kutoa amri au agizo; “atawaamuru” ni wazi na hudumisha nguvu ya kauli ya Kigiriki.
- source_word: περὶ σοῦ
  choice: kuhusu wewe
  rationale: 'Huwakilisha kwa karibu maana ya περί pamoja na hali ya umilikaji: kuhusu au juu yako, bila kuibadili kimya kimya kuwa “kwa ajili yako.”'
- source_word: τοῦ διαφυλάξαι σε
  choice: wakulinde
  rationale: Muundo huu unaeleza kusudi au lengo la amri. “Wakulinde” ni Kiswahili cha asili kinachobeba maana ya kukuhifadhi au kukuweka salama.
theological_decisions:
- issue: Namna ya kutafsiri nukuu ya Zaburi katika maneno ya Ibilisi
  choice: Kutafsiri kwa ukaribu maneno yaliyomo katika Luka bila kuongeza sehemu nyingine ya Zaburi 91:11
  alternative: Kukamilisha nukuu kwa maneno ya ziada kutoka katika Zaburi
  rationale: Luka ameandika sehemu hii tu ya nukuu. Kuacha nukuu katika upeo huo huhifadhi uadilifu wa maandishi na hakupachiki maneno yasiyopo katika Kigiriki cha mstari huu.
- issue: Uhusiano wa τοῦ διαφυλάξαι σε na amri inayotolewa
  choice: wakulinde
  alternative: ili wakulinde
  rationale: Kigiriki kinaweza kueleweka kama kusudi au matokeo ya agizo. Kiswahili “wakulinde” hudumisha uhusiano huo kwa njia ya asili bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa asili kwa msomaji wa kawaida huku ukihifadhi muundo wa nukuu ya Maandiko na maana ya Kigiriki.
