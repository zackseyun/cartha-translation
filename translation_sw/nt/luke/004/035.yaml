reference: Luke 4:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: sw
  text: Yesu akamkemea, akisema, “Nyamaza, umtoke!” Kisha huyo pepo akamwangusha katikati yao, akamtoka bila kumdhuru hata kidogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: akamkemea
  rationale: ‘Kukemea’ huonyesha kauli kali yenye mamlaka. Kiambishi cha yambwa -m- kinaweza kumrejelea pepo, ambaye anawasilishwa kama kiumbe anayesemeshwa moja kwa moja.
- source_word: Φιμώθητι
  choice: Nyamaza
  rationale: Ingawa kitenzi kina taswira ya kufungwa kinywa, katika amri ya kuzuia usemi maana ya kawaida na ya asili ni ‘Nyamaza.’
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: umtoke
  rationale: Hii ni amri ya moja kwa moja kwa pepo kutoka ndani ya mtu; ‘umtoke’ ni Kiswahili cha asili na hudumisha yule anayelengwa na amri.
- source_word: ῥίψαν αὐτὸν
  choice: akamwangusha
  rationale: Kitenzi ῥίπτω huonyesha kumtupa au kumwangusha kwa nguvu; muktadha unaonyesha mtu aliangushwa, bila kudokeza kwamba alijeruhiwa.
- source_word: εἰς τὸ μέσον
  choice: katikati yao
  rationale: Kirai humaanisha ‘katikati’; ‘yao’ hufanya mahali hapo kueleweka kwa Kiswahili na kurejelea watu waliokuwapo, ingawa neno hilo linadokezwa na muktadha.
- source_word: τὸ δαιμόνιον
  choice: huyo pepo
  rationale: ‘Pepo’ ni neno la kawaida la Kiswahili kwa δαιμόνιον katika muktadha huu. ‘Huyo’ humtambulisha yule pepo aliyekwisha kutajwa.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: bila kumdhuru hata kidogo
  rationale: Usemi huu unaweka wazi kwamba, licha ya kumwangusha mtu huyo, pepo hakumletea madhara yoyote.
theological_decisions:
- issue: Jinsi ya kuwasilisha δαιμόνιον katika simulizi la kutoa pepo
  choice: Kutafsiri kama ‘pepo’ na kudumisha kwamba Yesu anamwambia moja kwa moja kiumbe mwovu anayemtoka mtu.
  alternative: Kutafsiri kwa dhana isiyo ya nafsi, kama ‘nguvu mbaya’ au ‘ugonjwa wa akili.’
  rationale: Nakala ya Kigiriki ina mazungumzo ya moja kwa moja, amri, na kutoka kwa pepo; tafsiri haipaswi kuondoa namna simulizi lenyewe linavyowasilisha tukio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye viambishi ‘aka-’ unatoa mtiririko wa asili. Hakuna tanbihi iliyowekwa kwa sababu ‘Nyamaza’ na ‘bila kumdhuru hata kidogo’ zinawasilisha maana kwa uwazi bila kupoteza jambo muhimu la kifungu.
