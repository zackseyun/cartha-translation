  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: sw
  text: Akashuka hadi Kapernaumu, mji wa Galilaya. Naye alikuwa akiwafundisha siku za Sabato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina umbo la wingi, “Sabato.” Huenda linaashiria Sabato zilizojirudia. Kwa usemi wa kawaida zaidi, inaweza kutafsiriwa, “siku ya Sabato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: akashuka kwenda
  rationale: Kitenzi hiki kinaonyesha mwendo wa kushuka. “Akashuka kwenda” huhifadhi mwelekeo huo na pia husikika kwa kawaida katika Kiswahili.
- source_word: Καφαρναοὺμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: mji wa Galilaya
  rationale: Muundo huu unafuata uhusiano wa nomino katika Kigiriki bila kulazimisha maana finyu ya mahali; kwa Kiswahili unaeleweka kwa kawaida kuwa mji ulioko Galilaya.
- source_word: ἦν διδάσκων
  choice: alikuwa akiwafundisha
  rationale: Muundo wa “alikuwa aki-” huhifadhi hali ya tendo lililokuwa likiendelea au kurudiwa.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “akiwafundisha” huhifadhi kiwakilishi cha Kigiriki bila kuongeza utambulisho wa watu hao.
- source_word: ἐν τοῖς σάββασιν
  choice: siku za Sabato
  rationale: Wingi wa “siku” huhifadhi uwezekano wa matukio ya Sabato yaliyokuwa yakirudiwa, huku usemi ukibaki wa kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo wingi wa σάββασιν ulainishwe kuwa Sabato moja
  choice: siku za Sabato
  alternative: siku ya Sabato
  rationale: Wingi katika matini ya Kigiriki unaelekea kuonyesha desturi au matukio yaliyotokea mara kadhaa. Tafsiri kuu imeuhifadhi bila kudai kwa uhakika zaidi ya yale yanayosemwa na matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha” na “naye” zinaendeleza simulizi kwa ufasaha; “alikuwa akiwafundisha” huhifadhi mwendelezo wa tendo.
