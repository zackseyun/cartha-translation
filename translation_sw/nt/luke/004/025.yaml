  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: sw
  text: 'Lakini nawaambia kweli: kulikuwa na wajane wengi katika Israeli katika siku za Eliya, wakati mbingu zilipofungwa kwa miaka mitatu na miezi sita, ikawa na njaa kubwa katika nchi yote.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: Lakini nawaambia kweli
  rationale: Inawasilisha mkazo wa uthibitisho wa Yesu kwa Kiswahili cha kawaida na chenye heshima; δέ imetafsiriwa “Lakini” ili kuhifadhi utofautishaji na kauli iliyotangulia.
- source_word: χῆραι
  choice: wajane
  rationale: Ni kisawe cha moja kwa moja na cha kawaida cha wanawake waliofiwa na waume.
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: mbingu ilipofungwa
  rationale: Inahifadhi taswira ya Kigiriki ya mbingu kufungwa, yaani mvua kuzuiwa, bila kuifafanua kupita kiasi ndani ya matini.
- source_word: λιμὸς μέγας
  choice: njaa kali
  rationale: “Kali” ni usemi wa asili wa Kiswahili kwa ukubwa na ukali wa njaa.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: katika nchi yote
  rationale: Katika muktadha huu γῆ linaelekea kumaanisha eneo/nchi iliyoathiriwa; “nchi yote” huhifadhi upeo wa kauli bila kudai lazima dunia nzima.
theological_decisions:
- issue: Sababu ya mbingu kufungwa
  choice: Taswira ya “mbingu ilipofungwa” imehifadhiwa bila kutaja mtendaji.
  alternative: Mungu alifunga mbingu / mvua haikunyesha
  rationale: Kitenzi cha Kigiriki ni cha kutendwa na hakimtaji mtendaji; tafsiri haiongezi utambulisho wala haibadili taswira kuwa maelezo.
- issue: Upeo wa njaa
  choice: katika nchi yote
  alternative: duniani kote / katika eneo lote
  rationale: γῆ linaweza kumaanisha ardhi, nchi, au dunia. Muktadha wa Israeli na simulizi la Eliya unaunga mkono “nchi,” huku “yote” ikihifadhi πᾶσαν.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Mpangilio umewekwa wa asili kwa msomaji wa kawaida huku marudio ya muda na uzito wa kauli yakihifadhiwa.
