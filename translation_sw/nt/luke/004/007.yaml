  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: sw
  text: Basi, kama utaniabudu mbele yangu[a], yote yatakuwa yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utanisujudia mbele yangu.” Kitenzi cha Kigiriki kinaweza kumaanisha kusujudu au kuabudu; hapa “kuabudu” limetumiwa kwa sababu muktadha unahusu kumpa Ibilisi heshima ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: u- (katika utaniabudu)
  rationale: Kiwakilishi cha nafsi ya pili umoja kimesisitizwa katika Kigiriki. Kiswahili hukibeba kiasili katika kiambishi cha kitenzi; kutaja “wewe” hapa kungeweza kuwa nzito bila ulazima.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au sharti linalotokana na ahadi iliyotangulia.
- source_word: ἐὰν
  choice: kama
  rationale: Huanzisha sharti; “kama” ni la kawaida na la wazi katika Kiswahili cha sasa.
- source_word: προσκυνήσῃς
  choice: utaniabudu
  rationale: Kitenzi kinaweza kumaanisha kusujudu au kuabudu. Katika muktadha huu tendo hilo ni heshima ya kidini inayodaiwa na Ibilisi, hivyo “kuabudu” linaonyesha uzito wake huku tanbihi ikihifadhi maana nyingine.
- source_word: ἐνώπιον ἐμοῦ
  choice: -ni- (katika utaniabudu)
  rationale: Maana ya “mbele yangu” imewasilishwa kwa kawaida kwa yambwa “ni” katika kitenzi. Hii huepuka usemi usio wa kawaida “uniabudu mbele yangu” bila kupoteza mhusika anayepokea ibada.
- source_word: ἔσται σοῦ πᾶσα
  choice: yote yatakuwa yako
  rationale: πᾶσα ya kike umoja hurejelea kwa muhtasari vitu vilivyotajwa katika mstari uliotangulia. Kiswahili hutumia “yote” kwa rejeo hilo na “yatakuwa yako” kuonyesha umiliki wa wakati ujao.
theological_decisions:
- issue: Ikiwa προσκυνέω itafsiriwe kama tendo la mwili lisiloegemea upande wowote au kama heshima ya kidini
  choice: kuabudu
  alternative: kusujudu mbele yangu
  rationale: Jibu la Yesu katika mstari unaofuata linaonyesha kwamba kishawishi kinahusu kumpa Ibilisi ibada inayomstahili Mungu. Hata hivyo, tanbihi inadumisha uwezekano wa maana halisi ya kusujudu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa kawaida; “yote” huhifadhi rejeo la muhtasari la Kigiriki kwa falme na utukufu uliotajwa katika mstari uliotangulia.
