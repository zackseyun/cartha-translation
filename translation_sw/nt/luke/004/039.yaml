  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: sw
  text: Akasimama juu yake, akaikemea homa ile, nayo ikamwacha.[a] Mara moja mwanamke huyo akainuka, akaanza kuwahudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani kinaitaja homa kuwa kitu kilichokemewa na pia ndiyo kiima kinachoeleweka cha “ikamwacha”; yaani, “homa ikamwacha.” Hii haimaanishi lazima kwamba homa ilikuwa na utu au ilikuwa pepo.
    reason: Kufafanua muundo wa sentensi unaoifanya homa kuwa kitu kilichokemewa na pia kiima kinachoondoka, bila kudokeza chanzo cha kipepo.
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: Akasimama karibu naye
  rationale: Kifungu hiki kinaonyesha kwamba Yesu alisimama mahali pa karibu, akiwa juu ya mwanamke aliyekuwa amelala. Kiswahili cha moja kwa moja ‘alisimama juu yake’ kingeweza kueleweka kimakosa kuwa alimkanyaga; ‘karibu naye’ kinatoa picha ya kawaida ya tukio bila kuongeza tendo kama kuinama.
- source_word: ἐπετίμησεν
  choice: akaikemea
  rationale: ‘Kukemea’ huhifadhi uzito na mamlaka ya kitenzi cha Kiyunani, na hapa homa ndiyo kitu kinachokemewa.
- source_word: τῷ πυρετῷ
  choice: ile homa
  rationale: Neno la Kiyunani linaitaja homa yenyewe, si kwa ujumla ugonjwa wa mwanamke. ‘Ile’ inafaa kwa homa iliyotajwa katika muktadha uliotangulia.
- source_word: ἀφῆκεν αὐτήν
  choice: nayo ikamwacha
  rationale: Kiima kinachoeleweka ni homa. Muundo huu wa Kiswahili unaonyesha wazi kuwa homa ndiyo iliyoondoka bila kuifanya kuwa kiumbe au pepo.
- source_word: παραχρῆμα
  choice: Mara moja
  rationale: Usemi huu wa kawaida unaonyesha kwamba kupona kwake na kuitikia kwake hakukuchelewa.
- source_word: ἀναστᾶσα
  choice: mwanamke huyo akainuka
  rationale: ‘Akainuka’ ni lugha ya kawaida kwa mtu aliyekuwa amelala kisha akaamka. Kutaja tena ‘mwanamke huyo’ kunaondoa utata wa kiima baada ya kutaja homa.
- source_word: διηκόνει
  choice: akaanza kuwahudumia
  rationale: Wakati usiotimilika wa kitenzi unaweza kuonyesha mwanzo na kuendelea kwa tendo; ‘akaanza kuwahudumia’ ni ya kawaida na huepuka maana finyu ya huduma ya kiofisi au ya kidini.
- source_word: αὐτοῖς
  choice: kuwahudumia
  rationale: Kiambishi ‘wa-’ kinawakilisha kwa kawaida kundi la watu waliokuwapo.
theological_decisions:
- issue: Je, kukemewa kwa homa kunapaswa kutafsiriwa kuwa homa ilikuwa pepo au ilikuwa imetajwa kana kwamba ni mtu?
  choice: Kuhifadhi kauli ya moja kwa moja ‘akaikemea ile homa’
  alternative: ‘akaiamuru homa iondoke’ au ‘akaukemea ugonjwa’
  rationale: Kiyunani kinasema Yesu aliikemea homa. Tafsiri haielezi kama hii ni tashihisi au dalili ya chanzo cha kipepo, hivyo inadumisha mamlaka ya Yesu na mvutano wa kifungu bila kuingiza hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zinafuata mwendo wa haraka wa simulizi. ‘Akasimama karibu naye’ imechaguliwa badala ya ‘juu yake’ ili kuepuka maana potovu ya kusimama kwa miguu juu ya mwili, huku nafasi ya Yesu karibu na mgonjwa ikihifadhiwa.
