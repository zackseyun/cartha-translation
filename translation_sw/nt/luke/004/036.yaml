  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: sw
  text: Mshangao ukawapata wote, wakawa wakizungumza wao kwa wao, wakisema, “Ni neno gani hili,[a] kwamba kwa mamlaka na nguvu anaziamuru roho wachafu, nazo zinatoka?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ni ujumbe gani huu?” Neno la Kigiriki logos linaweza kumaanisha “neno,” “ujumbe,” au “jambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: wakastaajabu
  rationale: Kitenzi hiki cha Kiswahili huwasilisha hali ya mshangao mkubwa kwa lugha ya kawaida na yenye hadhi.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: Wote wakastaajabu
  rationale: Muundo wa asili unaeleza mshangao uliowapata wote; Kiswahili asilia huieleza hali hiyo moja kwa moja badala ya kufuata nahau ya Kigiriki neno kwa neno.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: wakaambiana
  rationale: Huwasilisha mazungumzo ya wao kwa wao; mfuatano wa kitenzi katika simulizi la Kiswahili unatosha hapa bila kulazimisha hali endelevu isiyo ya kawaida.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Ni neno gani hili
  rationale: ‘Neno’ huhifadhi upana wa λόγος, ambao hapa unaweza kuelekeza kwenye tamko, amri, au ujumbe wa Yesu.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: kwa mamlaka na nguvu
  rationale: ‘Kwa’ huonyesha namna au chombo, huku mpangilio wa ‘mamlaka na nguvu’ ukifuata Kigiriki na kutofautisha haki ya kuamuru na uwezo wenye matokeo.
- source_word: ἐπιτάσσει
  choice: anaziamuru
  rationale: Huhifadhi wakati wa sasa wenye uhai na maana ya kutoa amri; kiambishi cha yambwa kinaelekea kwa roho.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: roho wachafu
  rationale: Ni usemi wa kawaida wa kibiblia katika Kiswahili na huhifadhi wazo la uchafu lililo katika ἀκάθαρτος bila kuligeuza kuwa maelezo ya kisaikolojia.
- source_word: ἐξέρχονται
  choice: zinatoka
  rationale: Huwasilisha kwa urahisi roho kuondoka ndani ya mtu na huhifadhi wakati wa sasa wa Kigiriki.
theological_decisions:
- issue: Utambulisho wa viumbe katika tukio la kutoa pepo
  choice: roho wachafu
  alternative: roho zisizo safi
  rationale: ‘Roho wachafu’ huhifadhi istilahi na mfumo wa simulizi wa Injili bila kuupunguza kuwa sitiari au hali ya kisaikolojia.
- issue: Upana wa maana ya λόγος
  choice: neno
  alternative: ujumbe
  rationale: ‘Neno’ halifungi maana kwa ujumbe wa mafundisho pekee, bali linaweza pia kumaanisha tamko au amri yenye mamlaka katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Ni neno gani hili’ umeachwa kwa makusudi ili kuhifadhi mshangao na utata wa λόγος. Alama ya tanbihi imewekwa baada ya nukuu kwa kuwa inafafanua usemi ulio ndani yake.
