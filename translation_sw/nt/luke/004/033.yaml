  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: sw
  text: Katika sinagogi kulikuwa na mtu mwenye roho ya pepo mchafu[a], naye akapiga kelele kwa sauti kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia maneno yote mawili, “roho” na “pepo,” na kwa muundo wake wa kisarufi linaweza kutafsiriwa kihalisi, “roho ya pepo mchafu.”
    reason: lexical_clarification
lexical_decisions:
- source_word: συναγωγῇ
  choice: sinagogi
  rationale: Ni neno la kawaida na sahihi kwa mahali pa Wayahudi pa kukusanyika na kuabudu.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika Kiswahili, “mtu” ni neno la kawaida kwa mwanadamu mmoja; muktadha unaendelea kumtambulisha kama mwanamume bila kulazimisha neno lisilo la lazima hapa.
- source_word: ἔχων
  choice: mwenye
  rationale: Hufuata kwa karibu maana ya “akiwa na” bila kuongeza ufafanuzi wa kiutafsiri kama “aliyepagawa na.”
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: roho ya pepo mchafu
  rationale: Huhifadhi maneno yote mawili, “roho” na “pepo.” Kisarufi, δαιμονίου na ἀκαθάρτου yanalingana katika hali ya umilikishi, kwa hiyo “mchafu” imehusishwa moja kwa moja na “pepo,” huku uhusiano wa maneno hayo ukiendelea kuwa usio wa kawaida kama katika Kigiriki.
- source_word: ἀνέκραξεν
  choice: akapiga kelele
  rationale: Ni usemi wa sasa na wa kawaida wa Kiswahili unaoonyesha kilio au mwito wa ghafla wenye nguvu.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Huhifadhi picha halisi ya sauti yenye ukubwa badala ya kutumia kielezi pekee.
theological_decisions:
- issue: Namna ya kutafsiri istilahi za pepo
  choice: roho ya pepo mchafu
  alternative: roho chafu ya pepo
  rationale: Kigiriki kinataja wazi πνεῦμα na δαιμόνιον. Tafsiri iliyochaguliwa haiifupishi kuwa “roho mbaya,” wala haiongezi dai la kimafundisho kama “aliyepagawa.” Pia inafuata ulinganifu wa kisarufi wa δαιμονίου ἀκαθάρτου bila kuficha ugumu wa usemi wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. “Sinagogi” ni istilahi inayotambulika, na “akapiga kelele kwa sauti kubwa” ni ya asili zaidi katika Kiswahili cha sasa kuliko tafsiri ya neno kwa neno kama “akalia kwa sauti kubwa.”
