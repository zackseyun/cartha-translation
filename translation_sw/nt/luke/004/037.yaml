translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Habari zake zikaenea’ ni usemi wa kawaida unaoeleweka; tanbihi huhifadhi tafsiri ya karibu zaidi na muundo wa Kigiriki. Alama ya tanbihi [a] imewekwa katika matini.
