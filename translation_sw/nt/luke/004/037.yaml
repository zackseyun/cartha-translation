translation:
  language: sw
  text: Na habari kumhusu zilikuwa zikienea kila mahali katika eneo la kandokando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na taarifa kumhusu ilikuwa ikitoka kuelekea kila mahali katika eneo la kandokando.”
    reason: Njia nyingine ya kutafsiri ἦχος na ἐξεπορεύετο kwa ukaribu zaidi na picha ya taarifa ‘kutoka.’
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa urahisi bila kuongeza maana ya sababu au wakati.
- source_word: ἐξεπορεύετο
  choice: zikaenea
  rationale: Kitenzi cha wakati uliopita usiotimilika kinaonyesha habari ikiendelea kutoka na kusambaa; Kiswahili cha simulizi hutumia kwa kawaida mfuatano wa ‘-ka-’, huku ‘enea’ ikiwasilisha maana ya mchakato huo kwa ufasaha.
- source_word: ἦχος
  choice: habari
  rationale: Ingawa neno linaweza kumaanisha sauti, katika muundo huu linarejelea taarifa iliyosambaa kumhusu Yesu; ‘habari’ ni ya kawaida na wazi.
- source_word: περὶ αὐτοῦ
  choice: zake
  rationale: ‘Habari zake’ ni Kiswahili cha kawaida chenye maana ya habari kumhusu yeye.
- source_word: εἰς πάντα τόπον
  choice: kila mahali
  rationale: Huhifadhi maana ya mgawanyo ya ‘kila mahali’ kwa Kiswahili cha kawaida, badala ya tafsiri nzito ya ‘kwenda katika kila mahali’.
- source_word: τῆς περιχώρου
  choice: katika eneo lililozunguka
  rationale: Huwasilisha eneo la kandokando linalozunguka mahali pa tukio kwa lugha ya kijiografia inayoeleweka.
