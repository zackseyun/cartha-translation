  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: sw
  text: Ibilisi akamwambia, “Nitakupa mamlaka hii yote na utukufu[a] wa falme hizo, kwa sababu nimekabidhiwa mamlaka hiyo, nami humpa mamlaka hiyo mtu yeyote ninayemtaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fahari.” Neno la Kigiriki hapa linaweza kumaanisha utukufu, fahari, au adhama.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Ibilisi
  rationale: Katika simulizi hili neno hilo ni jina la kawaida la Shetani kama nafsi, si maelezo ya kietimolojia ‘mchongezi.’
- source_word: Σοὶ δώσω
  choice: Nitakupa
  rationale: Huwasilisha ahadi ya moja kwa moja kwa Kiswahili cha kawaida; kiambishi -ku- kinaonyesha wazi anayelengwa, bila mpangilio mzito usio wa kawaida.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: ‘Mamlaka’ huonyesha haki au uwezo wa kutawala, maana inayofaa katika muktadha wa falme, bila kuelekeza tu kwenye nguvu za kimwili.
- source_word: ταύτην ἅπασαν
  choice: hii yote
  rationale: Huhifadhi demonstrativi na msisitizo wa ujumla wa mamlaka iliyoonyeshwa.
- source_word: δόξαν αὐτῶν
  choice: utukufu wa falme hizo
  rationale: ‘Utukufu’ huhifadhi upana na mwangwi wa δόξα; ‘wa falme hizo’ huweka wazi kwamba kiwakilishi cha wingi kinarejelea falme zilizotajwa katika mstari uliotangulia.
- source_word: παραδέδοται
  choice: nimekabidhiwa mamlaka hiyo
  rationale: Huhifadhi hali ya kutendwa na matokeo yanayoendelea ya wakati timilifu; kurudia ‘mamlaka hiyo’ huondoa utata wa kirejeleo katika Kiswahili bila kuthibitisha uhalali wa dai hilo.
- source_word: ᾧ ἂν θέλω
  choice: mtu yeyote ninayemtaka
  rationale: Hutoa maana ya mtu asiyeainishwa ambaye msemaji anadai kuwa ana hiari ya kumchagua.
- source_word: δίδωμι αὐτήν
  choice: ninampa
  rationale: Wakati wa sasa unaonyesha tendo la kawaida au la jumla; muktadha na ngeli ya kitenzi huonyesha kuwa mamlaka ndiyo inayotolewa.
theological_decisions:
- issue: Ikiwa tafsiri ithibitishe dai la Ibilisi kwamba ana mamlaka juu ya falme
  choice: Kauli imetafsiriwa moja kwa moja kama maneno ya Ibilisi bila maelezo ya kuikubali au kuipunguza.
  alternative: Kuongeza maneno kama ‘anadai’ au ‘inasemekana kwamba nimekabidhiwa.’
  rationale: Kigiriki kinatoa usemi wa moja kwa moja wa Ibilisi. Utambulisho wa msemaji unatosha kuonyesha kwamba hili ni dai lake; tafsiri haipaswi kutatua mvutano wa kitheolojia kwa kuhariri kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku ‘mamlaka’ na ‘utukufu’ zikihifadhi istilahi pana za chanzo.
