translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia “kitabu cha kukunjwa” badala ya istilahi isiyo ya kawaida kwa wasomaji wengi, huku tanbihi ikihifadhi uwezekano mpana wa neno la Kigiriki.
