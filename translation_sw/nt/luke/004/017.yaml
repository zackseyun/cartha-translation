  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: sw
  text: 'Akakabidhiwa gombo la nabii Isaya[a]. Baada ya kulifunua, akapata mahali palipoandikwa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitabu.” Neno la Kigiriki βιβλίον linaweza kumaanisha hati iliyoandikwa kwa ujumla, lakini katika mazingira haya ya sinagogi linaelekea kumaanisha gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: akapewa
  rationale: Kauli tendwa ya kitenzi hiki ina maana ya kupewa au kukabidhiwa. “Akapewa” ni ya kawaida na ya asili katika Kiswahili bila kuongeza mkazo usiomo katika Kigiriki.
- source_word: βιβλίον
  choice: kitabu cha kukunjwa
  rationale: Katika mazingira ya sinagogi ya karne ya kwanza, neno hili linaelekea kumaanisha maandishi yaliyokuwa katika umbo la gombo, si kitabu cha kurasa cha kisasa. “Kitabu cha kukunjwa” kinaeleweka kwa wasomaji wa kawaida na kuonyesha umbo hilo la kihistoria.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: cha nabii Isaya
  rationale: Muundo huu unabainisha kwamba maandishi hayo ni ya nabii Isaya na unahifadhi cheo chake cha kinabii kwa Kiswahili cha kawaida.
- source_word: ἀναπτύξας
  choice: baada ya kukifungua
  rationale: Kitenzi hiki huonyesha kufungua au kukunjua gombo, na tendo lake linatangulia tendo kuu la kupata mahali. “Baada ya” linaonyesha wazi mpangilio huo.
- source_word: εὗρεν
  choice: akapata
  rationale: Hii ni tafsiri ya kawaida ya εὑρίσκω katika muktadha huu, bila kudokeza kwamba kulitafuta kulikuwa kugumu.
- source_word: τὸν τόπον
  choice: mahali
  rationale: Tafsiri hii inahifadhi taswira halisi ya sehemu au eneo ndani ya maandishi, badala ya kuifasiri moja kwa moja kuwa “kifungu.”
- source_word: οὗ ἦν γεγραμμένον
  choice: palipoandikwa hivi
  rationale: Muundo huu unaanzisha nukuu inayofuata. “Palipoandikwa” huakisi hali ya jambo lililokwisha kuandikwa, na “hivi” huunganisha sentensi kwa kawaida na nukuu inayofuata.
