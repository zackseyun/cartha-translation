  text: But he[a], passing through their midst, went on his way.
translation:
  language: sw
  text: Lakini yeye akapita katikati yao[a], akaendelea na safari yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kiini chao.” Kigiriki kinaeleza Yesu akipita katikati ya umati bila kusema jinsi jambo hilo lilivyotokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi kimetajwa wazi na kina msisitizo kiasi. Kiswahili kinaweza kukiacha, lakini kukihifadhi kama “yeye” kunaonyesha utofautishaji kati ya Yesu na umati bila kuongeza uzito usio wa lazima.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo kati ya nia ya uadui ya umati katika mstari uliotangulia na kuondoka kwa Yesu bila kuzuiwa.
- source_word: διελθὼν
  choice: akapita
  rationale: Kitenzi hiki kinaeleza mwendo wa kupitia eneo fulani. Muundo wa “aka-” unaunganisha tendo hilo kwa njia ya kawaida na kitenzi kikuu katika simulizi la Kiswahili.
- source_word: διὰ μέσου αὐτῶν
  choice: katikati yao
  rationale: Kirai hiki kinaonyesha kwamba Yesu alipita katikati ya kundi lenyewe; ni usemi wa kawaida, wazi na wenye kuhifadhi taswira ya mahali.
- source_word: ἐπορεύετο
  choice: akaendelea na safari yake
  rationale: Wakati usiotimilifu unaonyesha mwendo unaoendelea. Usemi huu wa Kiswahili unawasilisha kwamba Yesu aliendelea kwenda zake, badala ya kusema tu kwamba aliondoka.
theological_decisions:
- issue: Ikiwa mstari udokeze wazi kwamba kutoroka kwa Yesu kulikuwa muujiza
  choice: 'Lugha isiyoeleza jinsi jambo hilo lilivyotokea: “akapita katikati yao”'
  alternative: Lugha inayosema au kudokeza wazi kwamba alipita kwa njia ya kimiujiza
  rationale: Kigiriki kinaeleza Yesu akipita katikati ya umati bila kutaja jinsi alivyoweza kufanya hivyo. Tafsiri inahifadhi kutokubainishwa huko na haiingizi maelezo ya kitheolojia yasiyotamkwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akaendelea na safari yake” ni cha kawaida na kinaonyesha mwendo unaoendelea; tanbihi inalinda kutokubainishwa kwa namna ya kupita kwake.
