  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: sw
  text: Kisha akamwongoza hadi Yerusalemu, akamweka juu ya kilele cha hekalu[a][b], akamwambia, “Ikiwa wewe ni Mwana wa Mungu[c], jitupe chini kutoka hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya bawa la hekalu.” Neno la Kiyunani linaweza kumaanisha ncha iliyochomoza au sehemu ya juu ya jengo la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiyunani ἱερόν linamaanisha eneo lote la hekalu, si patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: c
    text: Au, “Kwa kuwa wewe ni Mwana wa Mungu.” Muundo wa sharti katika Kiyunani unaweza kueleweka hivyo, lakini hapa umetafsiriwa “Ikiwa” ili kudumisha changamoto ya mjaribu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν
  choice: akamwongoza
  rationale: Kitenzi ἄγω kina maana ya kuongoza au kupeleka. “Akamwongoza” linaonyesha kwa kawaida mwendo unaoongozwa bila kuongeza namna ambayo haikutajwa.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ linaendeleza mfululizo wa simulizi; “Kisha” ni kiunganishi cha kawaida na cha wazi katika Kiswahili.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἔστησεν
  choice: akamweka
  rationale: Katika muundo huu ἵστημι lina maana ya kumweka mtu mahali fulani; “akamweka” ni la asili kuliko tafsiri ya neno kwa neno inayodokeza kumsimamisha tu.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: juu ya kilele
  rationale: Katika muktadha wa jengo, πτερύγιον linamaanisha ncha iliyochomoza au sehemu ya juu. “Kilele” kinaeleweka kwa urahisi, huku maana halisi zaidi ikiwekwa katika tanbihi.
- source_word: τοῦ ἱεροῦ
  choice: cha hekalu
  rationale: ἱερόν linarejelea eneo lote la hekalu, si patakatifu pa ndani pekee. “Hekalu” ni neno la kawaida, na upana wa maana yake umefafanuliwa katika tanbihi.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ikiwa wewe ni Mwana wa Mungu
  rationale: “Ikiwa” linadumisha hali ya sharti na changamoto ya mjaribu bila kuamua kimyakimya kwamba maana ni “kwa kuwa.” “Mwana wa Mungu” linahifadhi hadhi ya kipekee ya usemi huo.
- source_word: βάλε σεαυτὸν
  choice: jitupe
  rationale: Amri ya βάλλω hapa inamaanisha kujirusha. “Jitupe” ni fupi, ya sasa, na ya kawaida katika Kiswahili.
- source_word: ἐντεῦθεν κάτω
  choice: chini kutoka hapa
  rationale: Usemi huu unaonyesha mwendo wa kushuka kuanzia mahali walipo; mpangilio huu ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri changamoto kuhusu utambulisho wa Yesu
  choice: Ikiwa wewe ni Mwana wa Mungu
  alternative: Kwa kuwa wewe ni Mwana wa Mungu
  rationale: Muundo wa Kiyunani unaweza katika baadhi ya miktadha kuwa na nguvu inayokaribia “kwa kuwa,” lakini hapa “ikiwa” linahifadhi changamoto ya jaribu na mvutano wa simulizi bila kudokeza kwamba msimulizi ana shaka kuhusu utambulisho wa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Maneno “akamwongoza,” “kilele,” na “jitupe” yanaeleweka kwa wasomaji wa kawaida bila kuwa ya kizamani; tanbihi zinahifadhi tofauti za kileksika na mvutano wa usemi wa sharti.
