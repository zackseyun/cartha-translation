  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: sw
  text: Naye alikuwa akihubiri katika masinagogi ya Yudea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Galilaya” badala ya “Yudea.” Matini kuu inafuata usomaji “Yudea” katika matini ya Kigiriki iliyotumika hapa.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: alikuwa akihubiri
  rationale: Muundo wa kitenzi ἦν pamoja na kitenzi-jina κηρύσσων unaonyesha tendo lililokuwa likiendelea au kurudiwa wakati uliopita; “alikuwa akihubiri” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: κηρύσσων
  choice: akihubiri
  rationale: κῆρύσσω humaanisha kutangaza hadharani. Katika mazingira ya huduma ya sinagogini, “kuhubiri” ni usemi wa kawaida unaodumisha wazo la kutangaza ujumbe kwa watu.
- source_word: εἰς τὰς συναγωγάς
  choice: katika masinagogi
  rationale: Ingawa εἰς mara nyingi humaanisha kuelekea au kuingia ndani, hapa inaonyesha mahali au mazingira ambamo tendo la kuhubiri lilifanyika; “katika” ni ya asili na wazi katika Kiswahili.
- source_word: συναγωγάς
  choice: masinagogi
  rationale: Katika muktadha huu συναγωγή hurejelea mahali au mikutano ya ibada ya Wayahudi; “masinagogi” ni istilahi sanifu na inayotambulika.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Toleo la SBLGNT linasoma Ἰουδαίας, yaani “Yudea.” Tafsiri inadumisha usomaji huu badala ya kuupatanisha na muktadha unaotaja Galilaya.
theological_decisions:
- issue: Jina la eneo τῆς Ἰουδαίας licha ya muktadha unaohusu Galilaya
  choice: Yudea
  alternative: Galilaya; au kuelewa Yudea kwa maana pana ya nchi ya Wayahudi
  rationale: Usomaji wa matini ya Kigiriki iliyotumika ni “Yudea.” Mvutano wa kijiografia hauondolewi kwa kuupatanisha kimya kimya; tofauti ya matini imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Naye” huunganisha aya hii na simulizi iliyotangulia; “alikuwa akihubiri” huhifadhi tendo endelevu au la kurudiwa. Istilahi “masinagogi” na jina “Yudea” zimetumika kwa namna inayofahamika katika matumizi ya Biblia ya Kiswahili.
