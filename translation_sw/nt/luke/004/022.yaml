  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: sw
  text: Wote walikuwa wakisema mema kumhusu na wakistaajabia maneno yenye neema yaliyokuwa yakitoka kinywani mwake.[a] Wakasema, “Je, huyu si mwana wa Yosefu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya neema.” Yaani, maneno yaliyotawaliwa na neema, fadhili, au mvuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: wakasema mema juu yake
  rationale: Katika muktadha huu usemi huo unaelekea kuonyesha ushuhuda au maoni ya kumpendelea Yesu, sambamba na kustaajabu kwao, bila kuufanya kuwa ushuhuda wa kisheria.
- source_word: ἐθαύμαζον
  choice: kustaajabia
  rationale: Kitenzi hiki kinaonyesha mwitikio wa mshangao unaoendelea; ‘kustaajabia’ ni Kiswahili cha kawaida kinachobeba mshangao na kuvutiwa.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: maneno yenye neema
  rationale: Kirai kinaweza kueleza maneno yaliyotawaliwa na neema, fadhili, au mvuto. ‘Yenye neema’ ni cha asili na huhifadhi upana huo bila kulazimisha maana moja ya kiteolojia.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: yaliyotoka kinywani mwake
  rationale: Huhifadhi taswira halisi ya maneno kutoka kinywani pake kwa Kiswahili fasaha na kinachoeleweka.
- source_word: Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Je, huyu si mwana wa Yosefu?
  rationale: Muundo wa swali unatarajia jibu la ndiyo. Tafsiri hii huhifadhi nguvu yake ya balagha na ni ya kawaida katika Kiswahili sanifu.
theological_decisions:
- issue: Kumtaja Yesu kuwa mwana wa Yosefu kwa kuzingatia kutungwa kwake na bikira
  choice: Kauli ya umati imetafsiriwa moja kwa moja kuwa ‘mwana wa Yosefu’ bila ufafanuzi wa ziada.
  alternative: Kuongeza maneno kama ‘aliyedhaniwa kuwa mwana wa Yosefu’ ili kuzuia kutokuelewa.
  rationale: Aya inanukuu mtazamo wa umati, si ufafanuzi wa msimulizi. Kuongeza sifa kungeondoa mvutano wa simulizi na kuingiza ufafanuzi usiomo katika kauli hii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakasema mema juu yake’ ni wazi kwa wasomaji wa kawaida; ‘maneno yenye neema’ huhifadhi uwezekano wa maana ya sifa ya maneno bila kutumia msamiati wa kidhehebu.
