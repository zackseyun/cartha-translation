base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: sw
  text: Na katika Israeli, wakati wa Elisha nabii, kulikuwa na watu wengi wenye ukoma[a], wala hakuna hata mmoja wao aliyetakaswa isipokuwa Naamani, yule Msiria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la asili linaweza kurejelea ukoma au hali mbalimbali za ngozi zilizohesabiwa kuwa najisi katika nyakati za Biblia.
    reason: Huzuia kulinganisha kwa moja kwa moja istilahi ya kale na ugonjwa wa kisasa wa Hansen, bila kudai kwamba hali hizo zote zilikuwa kali.
lexical_decisions:
- source_word: λεπροὶ
  choice: watu wengi wenye ukoma
  rationale: Nomino iliyodokezwa na kivumishi cha Kiyunani imeelezwa kwa Kiswahili cha kawaida kinachowatanguliza watu badala ya kuwaita kwa ugonjwa wao. Neno “ukoma” linadumisha istilahi ya kawaida ya Biblia, huku tanbihi ikionya kuwa matumizi ya kale yanaweza kuwa mapana kuliko ugonjwa unaoitwa ukoma leo.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: katika Israeli
  rationale: Kirai hiki kinaonyesha mahali au mazingira kwa upana bila kuongeza kwa dhahiri “nchi” au “watu wa” Israeli.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: wakati wa nabii Elisha
  rationale: ἐπί pamoja na umilikishi ina maana ya kipindi cha wakati; mpangilio huu ni wa asili na wazi katika Kiswahili.
- source_word: ἐκαθαρίσθη
  choice: aliyetakaswa
  rationale: Kitenzi hiki kinahifadhi lugha ya kibiblia ya kutakaswa kutokana na ukoma, inayoweza kuhusisha kuondolewa kwa ugonjwa na hali ya unajisi; “aliyeponywa” ingefinya maana hiyo kuwa ya kitabibu pekee.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika muktadha huu kirai hicho kinaweka ubaguzi mmoja baada ya kauli hasi.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Naamani, yule Msiria
  rationale: “Yule Msiria” inadumisha utambulisho wenye msisitizo unaotolewa na kibainishi cha Kiyunani na kuonyesha wazi kwamba aliyetakaswa alikuwa mtu wa Siria.
theological_decisions:
- issue: Maana ya lugha ya kutakaswa kuhusiana na ukoma
  choice: aliyetakaswa
  alternative: aliyeponywa; aliyesafishwa
  rationale: “Aliyetakaswa” huhifadhi mvutano wa maana ya kimwili na ya hali ya unajisi uliomo katika matumizi ya kibiblia bila kudai zaidi ya andiko.
- issue: Uzito wa utambulisho wa Naamani kwa taifa lake
  choice: Naamani, yule Msiria
  alternative: Naamani, Msiria mmoja; Naamani Msiria
  rationale: 'Kibainishi “yule” kinahifadhi nguvu ya usemi wa Kiyunani: kati ya wengi waliokuwa Israeli, mtu aliyetakaswa alikuwa yule mgeni anayejulikana kutoka Siria.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wenye ukoma” ni cha kawaida na kinaheshimu utu kuliko kuwataja watu kana kwamba ugonjwa ndio utambulisho wao. Muundo “hakuna hata mmoja” unatoa mkazo wa οὐδείς kwa njia ya asili.
