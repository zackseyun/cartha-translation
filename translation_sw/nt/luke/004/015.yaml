id: LUK.4.15
reference: Luke 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: sw
  text: Naye alikuwa akifundisha katika masinagogi yao, huku akitukuzwa na watu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku akisifiwa na watu wote,” au, “huku akiheshimiwa na watu wote.” Neno la Kigiriki δοξαζόμενος linaweza kumaanisha kusifiwa au kuheshimiwa hadharani; “akitukuzwa” huhifadhi uhusiano wake na lugha ya utukufu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumtaja Yesu kwa kawaida bila kuongeza mkazo usio wa lazima.
- source_word: ἐδίδασκεν
  choice: alikuwa akifundisha
  rationale: Muundo huu unaonyesha tendo lililoendelea au lililokuwa desturi wakati uliopita, sawasawa na hali ya kitenzi cha Kigiriki cha wakati usiotimilika.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: katika masinagogi yao
  rationale: Tafsiri hii ya mahali ni ya moja kwa moja na inahifadhi kiwakilishi 'yao,' ambacho katika muktadha kinarejelea jamii za Galilaya.
- source_word: δοξαζόμενος
  choice: huku akitukuzwa
  rationale: ‘Kutukuzwa’ huhifadhi uhusiano wa kitenzi δοξάζω na wazo la utukufu, huku muundo wa ‘huku’ ukionyesha tendo lililoandamana na kufundisha kwake. Katika muktadha neno hilo pia linaweza kumaanisha kusifiwa au kuheshimiwa.
- source_word: ὑπὸ πάντων
  choice: na watu wote
  rationale: ‘Na’ inaonyesha mtendaji wa tendo katika kauli tendwa, na ‘watu wote’ ni Kiswahili cha kawaida kinachoeleza mapokezi mazuri yaliyoenea bila kulazimisha maana ya kila mtu mmoja mmoja.
theological_decisions:
- issue: Maana ya δοξαζόμενος inapotumiwa kumhusu Yesu
  choice: huku akitukuzwa na watu wote
  alternative: huku akisifiwa na watu wote; huku akiheshimiwa na watu wote
  rationale: ‘Akitukuzwa’ inadumisha uzito na uhusiano wa neno na lugha ya utukufu, lakini tanbihi inaonyesha kwamba katika muktadha huu linaweza kueleza sifa au heshima ya hadharani. Hivyo tafsiri haigeuzi mapokezi mazuri ya watu kuwa dai pana zaidi la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Masinagogi’ ni neno linalotambulika kwa mahali pa ibada ya Kiyahudi; muundo ‘alikuwa akifundisha’ ni wa kawaida na unahifadhi hali ya tendo linaloendelea au la desturi.
