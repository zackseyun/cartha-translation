  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: sw
  text: Baada ya Ibilisi kumaliza majaribu yote[a], akamwacha mpaka wakati ufaao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupimwa.” Neno la Kigiriki linaweza kumaanisha kushawishiwa au kupimwa, ingawa hapa kwa kuwa Ibilisi ndiye anayehusika, maana ya kushawishiwa ndiyo inayofaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Baada ya kumaliza
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; usemi huu unaonyesha wazi mpangilio huo kwa Kiswahili cha kawaida.
- source_word: πάντα πειρασμόν
  choice: kila jaribu
  rationale: Muundo wa πᾶς pamoja na nomino ya umoja unaweza kueleweka kwa namna ya mgawanyo kuwa ‘kila jaribu’; katika muktadha huu, ‘jaribu’ linafaa kwa sababu Ibilisi anajaribu kumshawishi Yesu aache utii.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Katika simulizi hili neno linamtaja adui wa kiroho kama nafsi maalumu; ‘Ibilisi’ ndiyo tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: alimwacha
  rationale: Hapa ἀφίστημι humaanisha kuondoka au kujitenga na mtu. ‘Alimwacha’ ni ya asili katika Kiswahili na huhifadhi maana bila uzito usio wa lazima.
- source_word: ἄχρι καιροῦ
  choice: mpaka wakati mwingine unaofaa
  rationale: καιρός humaanisha wakati unaofaa au fursa maalumu, si wakati tu kwa ujumla. ‘Wakati mwingine unaofaa’ huonyesha kwamba kuondoka kwake kulikuwa kwa muda na kwamba angeweza kurudi wakati wa fursa.
theological_decisions:
- issue: Maana ya πειρασμός katika tukio la Yesu
  choice: jaribu
  alternative: majaribio / kupimwa
  rationale: Neno la Kigiriki linaweza kumaanisha kishawishi cha kutenda mabaya au kupimwa. Kwa kuwa mhusika anayefanya tendo ni Ibilisi na anajaribu kumtoa Yesu katika utii, ‘jaribu’ linafaa zaidi katika matini kuu; maana ya kupimwa imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo umewekwa wazi na wa kawaida kwa wasomaji wengi, huku utata halisi wa πειρασμός ukihifadhiwa katika tanbihi.
