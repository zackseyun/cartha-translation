id: LUK.4.4
reference: Luke 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: sw
  text: Yesu akamjibu, “Imeandikwa:[b] ‘Mwanadamu[a] hataishi kwa mkate pekee.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu”; hapa neno hilo linamhusu kila binadamu.
    reason: lexical_alternative
  - marker: b
    text: Yesu ananukuu Kumbukumbu la Torati 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: akamjibu
  rationale: Kitenzi pamoja na πρός + accusative ni nahau ya kujibu mtu; “akamjibu” ni Kiswahili cha kawaida na pia kinaendeleza masimulizi.
- source_word: Γέγραπται
  choice: Imeandikwa
  rationale: Hii ni kauli ya kawaida ya kunukuu Maandiko. Wakati timilifu wa Kigiriki unaonyesha kuwa yaliyoandikwa yanaendelea kuwa na uzito; “Imeandikwa” huhifadhi maana hiyo kwa lugha ya kawaida.
- source_word: ὅτι
  choice: ':'
  rationale: Hapa ὅτι inatanguliza nukuu. Nukta mbili ni njia ya asili ya kufanya hivyo katika Kiswahili.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: kwa mkate pekee
  rationale: ἐπί inaonyesha kile ambacho uhai unategemea, na “kwa mkate pekee” ni wazi, ya asili, na hudumisha msisitizo wa μόνῳ.
- source_word: ζήσεται
  choice: hataishi
  rationale: Wakati ujao wa Kigiriki unawakilishwa moja kwa moja na hali ya wakati ujao ya Kiswahili.
- source_word: ὁ ἄνθρωπος
  choice: Mwanadamu
  rationale: Neno hili ni umoja wenye maana ya jumla, likimwakilisha kila binadamu. “Mwanadamu” hudumisha umoja huo bila kuifanya kauli imhusu mwanamume pekee.
theological_decisions:
- issue: Maana ya jumla ya ὁ ἄνθρωπος katika nukuu ya Maandiko
  choice: Mwanadamu
  alternative: Mtu
  rationale: Kigiriki kina umoja unaowakilisha wanadamu kwa ujumla. “Mwanadamu” huhifadhi umoja na mwangwi wa lugha ya Maandiko; “mtu” pia ni tafsiri halali yenye maana ileile ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamjibu” ni cha asili katika usimulizi, na “mkate pekee” kinaeleweka kwa urahisi bila kupunguza msisitizo wa chanzo.
