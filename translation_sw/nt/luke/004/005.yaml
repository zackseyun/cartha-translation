  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: sw
  text: Baada ya kumpeleka juu, alimwonyesha falme zote za ulimwengu unaokaliwa na watu[a] kwa muda mfupi sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “za ulimwengu.” Neno la Kigiriki mara nyingi humaanisha ulimwengu unaokaliwa na watu, na katika baadhi ya mazingira linaweza kumaanisha hasa ulimwengu uliostaarabika au ulimwengu wa dola.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kufumba na kufumbua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: baada ya kumpeleka juu
  rationale: Huhifadhi tendo la kumpeleka juu na mfuatano wa kishiriki cha wakati uliopita, bila kuingiza mlima au mahali pengine ambapo Luka hajapataja.
- source_word: ἔδειξεν
  choice: alimwonyesha
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi δείκνυμι katika simulizi.
- source_word: πάσας τὰς βασιλείας
  choice: falme zote
  rationale: Hapa βασιλεία katika wingi humaanisha falme au maeneo yanayotawaliwa, si dhana ya kifalme kwa ujumla.
- source_word: τῆς οἰκουμένης
  choice: za ulimwengu unaokaliwa na watu
  rationale: Huhifadhi wazo mahususi la οἰκουμένη kama ulimwengu wenye wakazi, bila kulibana kimakosa kuwa Dola ya Roma pekee.
- source_word: ἐν στιγμῇ χρόνου
  choice: kwa kitambo kidogo sana
  rationale: Ni Kiswahili cha kawaida kinachoonyesha muda mfupi mno unaokusudiwa na στιγμή, bila kutumia neno 'dakika' ambalo linaweza kueleweka kuwa kipimo cha sekunde sitini.
theological_decisions:
- issue: Jinsi falme zilivyoonyeshwa
  choice: Kueleza tu kwamba alimwonyesha falme zote, bila kufafanua namna jambo hilo lilivyotokea.
  alternative: Kusema kwamba ilikuwa ni maono, tukio la kimiujiza, au mtazamo halisi kutoka mahali pa juu.
  rationale: Kigiriki hakielezi mbinu iliyotumiwa; kwa hiyo tafsiri inadumisha utata wa simulizi badala ya kuamua jambo ambalo andiko halijasema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo ni wa kawaida katika simulizi na huepuka kuingiza 'mlima' kutoka kifungu sambamba cha Mathayo.
