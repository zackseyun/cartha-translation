reference: Luke 4:43
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: sw
  text: Lakini akawaambia, “Ni lazima nitangaze habari njema ya ufalme wa Mungu katika miji mingine pia, kwa sababu nilitumwa kwa kusudi hilo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Lakini akawaambia
  rationale: δέ inaonyesha tofauti nyepesi na nia ya umati katika muktadha; ‘akawaambia’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: katika miji mingine pia
  rationale: καί ina maana ya nyongeza, ἕτεραις huonyesha miji tofauti na ule wa sasa, na πόλεσιν ni wingi wa ‘mji.’ Muundo huu ni wa asili katika Kiswahili na unaonyesha kuenea kwa huduma yake hadi maeneo mengine.
- source_word: εὐαγγελίσασθαί
  choice: nitangaze habari njema
  rationale: Kitenzi hiki humaanisha kuleta au kutangaza habari njema. Tafsiri hii inahifadhi tendo la kutangaza bila kulifanya neno la kiufundi la kidini kupita kiasi.
- source_word: δεῖ
  choice: Ni lazima
  rationale: δεῖ huonyesha ulazima wenye nguvu, ambao katika Luka mara nyingi unahusiana na kusudi la Mungu. ‘Ni lazima’ ni wazi na ya kawaida bila kumtaja moja kwa moja anayesababisha ulazima huo.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: habari njema ya ufalme wa Mungu
  rationale: ‘Ufalme wa Mungu’ ni usemi mkuu katika Luka. Muundo huu unahifadhi maana ya utawala au milki ya Mungu bila kuamua kati ya vipengele hivyo.
- source_word: ἐπὶ τοῦτο
  choice: kwa kusudi hilo
  rationale: Kirai hiki kinaonyesha lengo au kusudi. ‘Kwa kusudi hilo’ kinaweka wazi uhusiano wake na utume wa kutangaza habari njema.
- source_word: ἀπεστάλην
  choice: nilitumwa
  rationale: Hii ni hali tendwa ya wakati uliopita ya ἀποστέλλω. ‘Nilitumwa’ huhifadhi lugha ya utume bila kuongeza utambulisho wa aliyetuma, ambao haukutajwa wazi katika mstari.
theological_decisions:
- issue: Nguvu ya kauli ya utume wa Yesu
  choice: Tafsiri inaonyesha ulazima wa kutangaza ufalme wa Mungu katika miji mingi na inahifadhi hali tendwa ya ‘nilitumwa.’
  alternative: Kusema wazi kwamba Mungu ndiye aliyemtuma au kwamba huu ni ‘ulazima wa kimungu.’
  rationale: δεῖ inaweza kudokeza ulazima unaotokana na kusudi la Mungu, na ἀπεστάλην inaweza kumdokeza Mungu kuwa mtumaji. Hata hivyo, mstari haumtambui mtumaji moja kwa moja, kwa hiyo tafsiri haiongezi maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Kutangaza habari njema’ kinaeleweka kwa wasomaji wa kawaida, huku ‘ufalme wa Mungu’ ukihifadhi istilahi kuu ya Luka. Hakuna tanbihi iliyowekwa kwa sababu mbadala za kimsamiati hazibadili maana kwa kiwango kinachohitaji maelezo, na alama za tanbihi katika safu ya Kiingereza hazilingani na mahali pa maneno yanayofafanuliwa.
