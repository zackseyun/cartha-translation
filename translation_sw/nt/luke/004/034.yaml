  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: sw
  text: “Aah! Tuna nini nawe,[a] Yesu wa Nazareti?[b] Je, umekuja kutuangamiza?[c] Ninajua wewe ni nani—Mtakatifu wa Mungu.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno ya moja kwa moja, “Nini kwetu na kwako?” Huu ni msemo wa Kisemiti unaoonyesha kujitenga au kupinga kwa ukali.
    reason: cultural_note
  - marker: b
    text: Au, “Yesu Mnazareti.”
    reason: lexical_alternative
  - marker: c
    text: Wingi wa “tu-” katika “kutuangamiza” haujafafanuliwa katika Kigiriki. Huenda pepo anajinena kwa wingi wa uwakilishi, au anajumuisha wengine katika ulimwengu wa pepo.
    reason: alternative_reading
  - marker: d
    text: 'Au, “Mtakatifu wa Mungu,” kwa mpangilio wa maneno unaosisitiza umilikaji: “Mtakatifu wake Mungu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Aah!
  rationale: Ni kilio cha ghafla cha hofu au kupinga. “Aah!” huhifadhi mshangao huo bila kuingiza moja kwa moja tafsiri pana ya “Tuache!”
- source_word: τί ἡμῖν καὶ σοί
  choice: Tuna nini nawe
  rationale: Huu ni msemo wenye asili ya Kisemiti unaoonyesha kujitenga au kupinga. Kauli hii ni ya kawaida katika Kiswahili na huhifadhi umbali wa kimahusiano unaokusudiwa.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Yesu wa Nazareti
  rationale: Ni mwito unaomtambulisha Yesu kwa uhusiano wake na Nazareti; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: umekuja kutuangamiza
  rationale: Wakati timilifu wa Kiswahili unaonyesha kuja ambako matokeo yake yanaonekana sasa, huku “kuangamiza” ikitoa maana ya uharibifu kamili bila kuongeza ufafanuzi wa kimafundisho.
- source_word: οἶδά σε τίς εἶ
  choice: Ninajua wewe ni nani
  rationale: Hutoa dai la kumtambua Yesu kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Mtakatifu wa Mungu
  rationale: Huhifadhi cheo muhimu cha Kikristo na uhusiano wake na Mungu bila kukipanua kimafundisho.
theological_decisions:
- issue: Wingi wa kiwakilishi ἡμᾶς katika usemi wa pepo
  choice: Umehifadhiwa kama “tu-” katika “kutuangamiza” bila kutaja wanaohusika.
  alternative: Kufafanua kwamba pepo ananena kwa niaba ya pepo wengine, au kwa niaba yake pamoja na mtu aliyepagawa.
  rationale: Kigiriki hakitaji wazi upeo wa wingi huo; tafsiri huhifadhi utata huo badala ya kuutatua.
- issue: Cheo ὁ ἅγιος τοῦ θεοῦ
  choice: Mtakatifu wa Mungu
  alternative: Yule Mtakatifu wa Mungu; Mtakatifu wa kutoka kwa Mungu
  rationale: Muundo uliochaguliwa huhifadhi uzito wa cheo na uhusiano unaoelezwa na genitivi bila kuingiza ufafanuzi wa baadaye wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Usemi “Tuna nini nawe” umechaguliwa ili kuhifadhi muundo na nguvu ya msemo wa chanzo bila kuwa mgumu kupita kiasi.
