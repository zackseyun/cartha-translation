  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: sw
  text: Akasema, “Kwa kweli, nawaambia, hakuna nabii anayekubaliwa kwao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mji wake wa nyumbani,” “katika eneo lake la nyumbani,” au “katika nchi yake.” Neno la Kigiriki πατρίς linaweza kumaanisha mahali pa asili ya mtu, eneo lake la nyumbani, au nchi yake; katika muktadha huu, Nazareti ndiyo mazingira ya karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Akasema
  rationale: δέ ni kiunganishi chepesi katika mtiririko wa simulizi; Kiswahili cha kawaida hakihitaji kukitaja kwa neno tofauti hapa.
- source_word: Ἀμὴν
  choice: Kwa kweli
  rationale: Katika kauli za Yesu, ἀμήν hutanguliza uthibitisho wenye uzito; “Kwa kweli” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni kauli ya moja kwa moja kwa watu wengi, na “nawaambia” ni ya asili na sahihi katika Kiswahili.
- source_word: οὐδεὶς προφήτης
  choice: hakuna nabii
  rationale: Hili ni fumbo la kawaida la Kiswahili linalowasilisha ukanushaji wa jumla bila kupunguza nguvu ya asili.
- source_word: δεκτός
  choice: anayekubaliwa
  rationale: Neno hili linadokeza kupokewa kwa ridhaa au kukubalika; “anayekubaliwa” huhifadhi maana pana kuliko “anayekaribishwa.”
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: katika mji wake wa nyumbani
  rationale: πατρίς linaweza kumaanisha mahali alikozaliwa au kukulia, eneo lake, au nchi yake. Katika muktadha wa Nazareti, “mji wake wa nyumbani” linafaa zaidi.
