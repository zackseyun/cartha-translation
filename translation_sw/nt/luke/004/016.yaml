  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: sw
  text: Akafika Nazara[a], ambako alilelewa; na, kama ilivyokuwa desturi yake, aliingia katika sinagogi siku ya Sabato, akasimama ili asome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nazareti.” Kigiriki hapa kinasema Nazara.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Huwakilisha moja kwa moja umbo la jina la mahali lililo katika maandishi ya Kigiriki ya mstari huu; jina linalofahamika zaidi, Nazareti, limewekwa katika tanbihi.
- source_word: τεθραμμένος
  choice: alikuwa amelelewa
  rationale: Kitenzi hiki katika hali ya timilifu tendwa kinaeleza mahali ambapo Yesu alipata malezi yake; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: kama ilivyokuwa desturi yake
  rationale: Huhifadhi maana ya tendo alilokuwa na kawaida ya kufanya kwa lugha asilia ya Kiswahili.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Siku ya Sabato
  rationale: Ingawa Kigiriki kina umbo la wingi katika nahau hii, maana yake hapa ni siku moja ya Sabato.
- source_word: συναγωγήν
  choice: sinagogi
  rationale: Katika mazingira haya ya Kiyahudi, neno hili linamaanisha mahali pa kusanyikia kwa ibada na mafundisho; 'sinagogi' ndilo neno sanifu na lililo wazi.
- source_word: ἀνέστη ἀναγνῶναι
  choice: akasimama ili asome
  rationale: 'Huhifadhi kusudi linaloonyeshwa na kitenzi pamoja na kitenzi-jina: alisimama kwa lengo la kusoma.'
theological_decisions:
- issue: Uwasilishaji wa jina la mahali Ναζαρά
  choice: Nazara
  alternative: Nazareti
  rationale: Uamuzi huu unafuata umbo halisi la jina katika Kigiriki cha mstari huu bila kulisawazisha kimyakimya na umbo linalofahamika zaidi; umbo la kawaida limetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza mfuatano wa matendo katika Kigiriki. Kiunganishi 'Kisha' kinawakilisha καί kwa njia ya asili katika mwanzo huu wa simulizi.
