translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumia ‘aka-’ na hali endelevu ili kuonyesha mfuatano wa matendo na vitendo vilivyokuwa vikiendelea. Viambishi vya tanbihi vimewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya mahali palipojitenga na [b] baada ya kitendo cha kuzuia.'
