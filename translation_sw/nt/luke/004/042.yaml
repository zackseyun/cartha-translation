base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: sw
  text: Kulipopambazuka, alitoka akaenda mahali pasipokuwa na watu[a]. Nao makutano walikuwa wakimtafuta; wakaja mpaka alipokuwa, na walikuwa wakijaribu kumzuia[b] asiondoke kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘mahali pa upweke’ au ‘mahali pa nyika.’ Neno la Kigiriki linaeleza mahali pa faragha au pasipokaliwa na watu.
    reason: lexical_alternative
  - marker: b
    text: Au, ‘kumshikilia’ au ‘kumzuia kuondoka.’ Maana ni kwamba makutano walijaribu kumzuia asiondoke kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Kulipopambazuka
  rationale: Kirai hiki hutoa mpito wa wakati unaomaanisha siku ilipoanza. ‘Kulipopambazuka’ ni Kiswahili cha kawaida na chenye heshima kinachowasilisha maana hiyo kwa ufupi.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: alitoka akaenda
  rationale: Mfuatano huu unaonyesha kutoka kwanza na kisha kwenda mahali fulani. Muundo wa ‘aka-’ unawasilisha vizuri mfuatano huo bila urudiaji usio wa kawaida.
- source_word: εἰς ἔρημον τόπον
  choice: mahali pasipokuwa na watu
  rationale: Katika muktadha huu ἔρημος hueleza mahali pa upweke au pasipokaliwa, wala si lazima jangwa lenye ukame.
- source_word: οἱ ὄχλοι
  choice: makutano
  rationale: ‘Makutano’ ni neno la Kiswahili la kibiblia linaloeleweka na linalorejelea umati wa watu; pia huhifadhi wingi wa Kigiriki.
- source_word: ἐπεζήτουν αὐτόν
  choice: walikuwa wakimtafuta
  rationale: Muundo endelevu unahifadhi hali ya tendo lililokuwa likiendelea iliyo katika kitenzi cha wakati usiotimilika.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: walipomfikia
  rationale: ἕως αὐτοῦ hapa inaonyesha kuwa walifika mahali alipokuwa. ‘Walimfikia’ ni ya asili na sahihi katika Kiswahili.
- source_word: κατεῖχον αὐτὸν
  choice: wakawa wakijaribu kumzuia
  rationale: κατέχω inaweza kumaanisha kushikilia au kuzuia. Muktadha unaonyesha jitihada za kumzuia asiondoke bila kulazimisha wazo kwamba walimshika kimwili.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: asiondoke kwao
  rationale: 'Muundo huu unaeleza kile walichotaka kuzuia: kuondoka kwake kutoka kwao. Tafsiri hii ni ya kawaida na huweka wazi maana hiyo.'
