  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: sw
  text: Wote waliokuwa katika sinagogi waliposikia mambo hayo, walijawa na hasira kali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walijawa na ghadhabu.” Neno la Kigiriki θυμός linaweza kumaanisha hasira kali au ghadhabu.
