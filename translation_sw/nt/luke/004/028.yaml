lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: walijawa
  rationale: Kitenzi hiki ni aoristi tendwa ya πίμπλημι na hapa humaanisha kujazwa na hali fulani. “Walijawa” ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kutafsiri kwa kuongeza maana.
- source_word: πάντες
  choice: wote waliokuwa
  rationale: πάντες huwahusu kwa ujumla watu waliokuwamo katika sinagogi. “Wote waliokuwa” huifanya rejea hiyo iwe wazi na ya asili katika Kiswahili.
- source_word: θυμοῦ
  choice: na hasira kali
  rationale: θυμός hapa ni hasira yenye nguvu. “Hasira kali” huonyesha ukali wake kwa lugha ya sasa bila kulazimisha maana ya juu zaidi ya “ghadhabu” au “jazba.”
- source_word: ἐν τῇ συναγωγῇ
  choice: katika sinagogi
  rationale: Kirai hiki hutaja mahali walipokuwa watu hao. “Katika sinagogi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀκούοντες
  choice: waliposikia
  rationale: Kirai participio cha wakati uliopo hutaja tukio lililoambatana na tendo kuu na sababu yake ya karibu. “Waliposikia” huwasilisha uhusiano wa wakati kwa Kiswahili fasaha.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki cha wingi hurejelea yaliyosemwa na Yesu hapo kabla. “Mambo hayo” huhifadhi upana wa rejea bila kuibana kuwa “maneno hayo.”
