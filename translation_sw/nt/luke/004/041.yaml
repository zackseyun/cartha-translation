id: LUK.4.41
reference: Luke 4:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: sw
  text: Pepo pia walikuwa wakiwatoka watu wengi, wakipiga kelele na kusema, “Wewe ni Mwana wa Mungu!” Lakini Yesu aliwakemea, wala hakuwaacha waseme, kwa sababu walijua kwamba yeye ni Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός linamaanisha “Masihi,” yaani “Mtiwa-Mafuta.”
    reason: Huhifadhi tafsiri nyingine iliyozoeleka ya cheo Χριστός na kufafanua maana yake ya msingi.
lexical_decisions:
- source_word: δαιμόνια
  choice: Pepo
  rationale: Neno hili linamaanisha pepo waovu moja kwa moja. Tafsiri hii huepuka kuongeza “wachafu,” kwa kuwa usemi huo haupo katika Kigiriki cha aya hii, na pia huepuka kuchanganya pepo hawa na Shetani mwenyewe.
- source_word: ἐξήρχετο
  choice: walikuwa wakiwatoka
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likitokea tena na tena; muundo huu wa Kiswahili unaonyesha mwendelezo huo.
- source_word: ἀπὸ πολλῶν
  choice: watu wengi
  rationale: Kigiriki kinaacha nomino inayorejelewa ikiwa imefichika, lakini muktadha unaonyesha kuwa ni watu. Kiswahili cha kawaida huhitaji kuitaja wazi ili sentensi isomeke kwa urahisi.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: wakipiga kelele na kusema
  rationale: 'Huhifadhi vitendo vyote viwili: kutoa sauti kubwa na kutamka maneno yaliyofuata.'
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Huhifadhi cheo kamili cha kikristo kilicho katika chanzo bila kukifafanua au kukichanganya na cheo kinachotokea baadaye katika aya.
- source_word: ἐπιτιμῶν
  choice: aliwakemea
  rationale: “Kukemea” hutoa maana ya karipio au amri kali yenye mamlaka katika muktadha huu.
- source_word: οὐκ εἴα
  choice: hakuwaruhusu
  rationale: Hutoa kwa kawaida maana ya Yesu kutowapa ruhusa ya kuendelea kusema; muktadha wa tendo linalojirudia tayari umeonyeshwa katika sehemu ya kwanza ya sentensi.
- source_word: τὸν χριστὸν
  choice: Masihi
  rationale: Χριστός hapa ni cheo kinachomaanisha Mtiwa-Mafuta, si jina la kawaida. “Masihi” huhifadhi kazi hiyo ya cheo katika simulizi.
- source_word: αὐτὸν εἶναι
  choice: kwamba yeye ndiye
  rationale: Muundo huu wa kawaida wa Kiswahili unasisitiza utambulisho wa Yesu kuwa ndiye Masihi bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Utafsiri wa Χριστός katika utambulisho unaojulikana na pepo
  choice: Masihi
  alternative: Kristo
  rationale: Katika aya hii neno linafanya kazi kama cheo. “Masihi” huonyesha maana hiyo moja kwa moja, huku “Kristo” ikihifadhiwa katika tanbihi kama tafsiri nyingine iliyozoeleka.
- issue: Uhusiano kati ya “Mwana wa Mungu” na “Masihi”
  choice: Vyeo vyote viwili vimehifadhiwa tofauti
  alternative: Kuvichanganya kuwa maelezo au cheo kimoja
  rationale: Pepo wanamwita Yesu “Mwana wa Mungu,” kisha msimulizi anasema walijua yeye ni Masihi. Chanzo kinavitaja kwa namna tofauti, kwa hiyo tafsiri haivisawazishi wala kueleza zaidi uhusiano wake.
- issue: Kutajwa kwa Yesu kama mtendaji wa ἐπιτιμῶν na οὐκ εἴα
  choice: Lakini Yesu aliwakemea na hakuwaruhusu
  alternative: Lakini akiwakemea, hakuwaruhusu
  rationale: Kigiriki kinategemea muktadha kwa mtendaji, ambaye ni Yesu. Kumtaja kwa jina katika Kiswahili kunazuia utata wa kiwakilishi baada ya pepo kuwa kiima cha kishazi kilichotangulia, bila kubadili maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “walikuwa wakiwatoka watu wengi” unaonyesha tendo lililojirudia, na “wakipiga kelele” huhifadhi ukali wa κραυγάζοντα bila kuliongeza. Alama ya tanbihi imewekwa baada ya “Masihi,” ambako maelezo yake yanahusika.
