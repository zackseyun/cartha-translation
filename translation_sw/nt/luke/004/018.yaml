  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: sw
  text: “Roho wa Bwana yuko juu yangu, kwa sababu amenitia mafuta ili niwatangazie maskini habari njema. Amenituma kuwatangazia mateka kuachiliwa huru[a], na vipofu kupata kuona tena, na kuwatuma waliokandamizwa[b] waende huru,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “kuachiliwa huru” linaweza pia kumaanisha “msamaha”; hapa muktadha wa mateka na waliokandamizwa unaunga mkono maana ya kuachiliwa huru.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wale waliovunjwa”; “waliokandamizwa” huwasilisha maana ya usemi huo katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: Roho wa Bwana yu juu yangu
  rationale: Muundo huu unaakisi kwa karibu usemi wa Kigiriki na mwangwi wake wa kinabii, huku kitenzi “yu” kikikamilisha sentensi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οὗ εἵνεκεν
  choice: kwa sababu
  rationale: Huwasilisha wazi uhusiano wa sababu bila uzito usio wa lazima.
- source_word: ἔχρισέν με
  choice: amenitia mafuta
  rationale: Huhifadhi taswira halisi ya kupakwa mafuta na maana yake ya kuwekwa wakfu kwa kazi maalumu, badala ya kuifafanua kimadhehebu.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: niwatangazie maskini habari njema
  rationale: “Kutangaza habari njema” ni lugha ya sasa inayoeleweka na inadumisha wazo la ujumbe unaotolewa hadharani; “maskini” haibainishi kupita kiasi ikiwa umaskini ni wa mali au hali ya kijamii.
- source_word: ἀπέσταλκέν με κηρύξαι
  choice: amenituma kuwatangazia
  rationale: Wakati timilifu wa Kigiriki unaonyeshwa kwa “amenituma,” na “kutangazia” huhifadhi wazo la tangazo la hadharani.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: mateka kuachiliwa huru
  rationale: Katika muktadha wa mateka, ἄφεσις hasa hudokeza kuachiliwa au ukombozi. “Kuachiliwa huru” ni usemi wa asili wa Kiswahili na pia huacha nafasi ya maana pana ya neno hilo.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: vipofu kupata kuona tena
  rationale: “Kuona tena” huonyesha kwa usahihi wazo la kupata au kurudishiwa uwezo wa kuona.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: kuwaacha waliokandamizwa waende huru
  rationale: Usemi huu ni wa asili kwa Kiswahili, unadumisha mwendo unaodokezwa na ἀποστεῖλαι, na kuwasilisha hali ya kuachiliwa iliyo katika ἐν ἀφέσει. “Waliokandamizwa” hutoa maana ya kimuktadha ya wale waliovunjwa au kusagwa.
theological_decisions:
- issue: Maana ya ἄφεσις katika nukuu hii ya Isaya
  choice: kuachiliwa huru / kwenda huru
  alternative: msamaha
  rationale: Kutajwa kwa mateka na waliokandamizwa kunaelekeza hasa kwenye kuachiliwa na ukombozi. Hata hivyo, kwa kuwa ἄφεσις pia hutumiwa kumaanisha msamaha, maana hiyo mbadala imehifadhiwa katika tanbihi badala ya kuondolewa kimya kimya.
- issue: Maana ya τεθραυσμένους
  choice: waliokandamizwa
  alternative: waliovunjwa
  rationale: Kihalisi neno hilo linaeleza watu waliovunjwa au kusagwa. Katika muktadha huu wa ukombozi, “waliokandamizwa” huwasilisha maana ya kimuktadha kwa lugha ya kawaida bila kuficha taswira halisi, ambayo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unalinda mwangwi wa maandiko ya kinabii bila kuwa mgumu kupita kiasi. Alama [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
