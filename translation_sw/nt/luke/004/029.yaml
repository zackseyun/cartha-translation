id: LUK.4.29
reference: Luke 4:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: sw
  text: Wakainuka, wakamtoa nje ya mji kwa nguvu, wakampeleka mpaka ukingo wa mlima ambao mji wao ulikuwa umejengwa juu yake, ili wamtupie chini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili wamwangushe kutoka juu.” Kitenzi cha Kigiriki kinamaanisha kumtupa mtu chini kutoka mahali pa juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: Wakainuka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha umati ukianza kuchukua hatua; “wakainuka” ni cha kawaida na huhifadhi mwendo wa kimwili.
- source_word: ἐξέβαλον
  choice: wakamtoa nje ... kwa nguvu
  rationale: ἐκβάλλω hapa ni kuwafukuza au kuwatoa kwa nguvu. Usemi huu unaonyesha uhasama bila kutumia lugha yenye maana maalumu ya kidini.
- source_word: πόλεως
  choice: mji
  rationale: “Mji” ni neno la kawaida la Kiswahili linalofaa kwa πόλις na kwa Nazareti katika muktadha huu.
- source_word: ἤγαγον
  choice: wakampeleka
  rationale: ἄγω kwa msingi ni kuongoza au kupeleka. “Wakampeleka” ni ya asili katika muktadha huu na haiongezi wazo la kumburuta lisilotajwa wazi.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: mpaka ukingo wa mlima
  rationale: ὀφρύς kwa sitiari ni ukingo au sehemu ya juu iliyo kama paji; “ukingo wa mlima” hueleweka kwa urahisi na huhifadhi maana ya mahali pa juu penye mpaka.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: ambao mji wao ulikuwa umejengwa juu yake
  rationale: Huhifadhi hali ya kutendwa ya pluperfect na αὐτῶν ya umilikaji bila kurahisisha uhusiano wa mlima na mji.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: ili wamtupie chini
  rationale: Muundo wa ὥστε pamoja na infinitivu katika muktadha huu unaonyesha kusudi lililokusudiwa. κατακρημνίζω ni kumtupa mtu chini kutoka mahali pa juu; tafsiri haiongezi neno “jabali” ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Kiwango cha vurugu na nia ya umati
  choice: Kuonyesha matumizi ya nguvu na kusudi la kumtupa Yesu chini bila kusema moja kwa moja “walitaka kumuua.”
  alternative: Kutumia “wakamburuta” au “ili wamuue kwa kumtupa kutoka jabalini.”
  rationale: Mlolongo wa vitendo na κατακρημνίσαι unaonyesha nia kali yenye kuweza kuua, lakini tafsiri inapaswa kuiacha itokee kutoka kwa maandishi badala ya kuongeza maelezo yasiyotajwa wazi.
- issue: Nguvu ya ὥστε pamoja na infinitivu
  choice: “ili,” ikionyesha kusudi katika muktadha.
  alternative: “hata wakawa karibu kumtupa chini” au “kwa matokeo ya kumtupa chini.”
  rationale: Muktadha wa kuwapeleka hadi ukingoni unaunga mkono kusudi, ingawa muundo wa Kigiriki unaweza katika mazingira mengine kueleza matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya Maandiko. “Kwa nguvu” huweka wazi uhasama wa ἐξέβαλον; “ukingo wa mlima” ni wa kawaida kuliko taswira ya moja kwa moja ya “paji la mlima.” Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
