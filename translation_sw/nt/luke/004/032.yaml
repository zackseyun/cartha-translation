  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: sw
  text: Nao walistaajabishwa na mafundisho yake, kwa sababu neno lake[a] lilikuwa na mamlaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe wake ulikuwa na mamlaka,” au, “alisema kwa mamlaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: walistaajabishwa
  rationale: Kitenzi cha hali isiyotimilika kinaonyesha mwitikio wao uliokuwa ukiendelea; “walistaajabishwa” linaendeleza uzito wa mshangao huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: na mafundisho yake
  rationale: Kirai hiki kinaonyesha jambo lililowafanya wastaajabu. “Mafundisho yake” linaweza kumaanisha tendo na maudhui ya kufundisha bila kutumia neno la kitaalamu kama “itikadi.”
- source_word: διδαχῇ
  choice: mafundisho
  rationale: Neno hili linaweza kumaanisha tendo la kufundisha au yaliyofundishwa; “mafundisho” linahifadhi upana huo katika muktadha wa sinagogi.
- source_word: ἐν ἐξουσίᾳ
  choice: lilikuwa na mamlaka
  rationale: Usemi huu unaeleza sifa ya maneno ya Yesu kuwa yenye nguvu na haki ya kuamuru. “Lilikuwa na mamlaka” ni wa asili na hauongezi maelezo ya chanzo cha mamlaka hiyo.
- source_word: ὁ λόγος αὐτοῦ
  choice: neno lake
  rationale: “Neno lake” linahifadhi umoja na ufupi wa Kigiriki, likirejelea usemi au ujumbe wa Yesu; njia mbadala za kawaida zaidi zimeonyeshwa katika tanbihi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleza sababu ya kustaajabu kwao, hivyo “kwa sababu” kinaweka wazi uhusiano huo.
theological_decisions:
- issue: Asili ya mamlaka ya Yesu katika kusema
  choice: neno lake lilikuwa na mamlaka
  alternative: ujumbe wake ulikuwa na mamlaka; alisema kwa mamlaka
  rationale: Aya inathibitisha mamlaka ya usemi wa Yesu lakini haielezi hapa chanzo kamili cha mamlaka hiyo. Tafsiri inaacha dai hilo kama lilivyo bila kuingiza ufafanuzi wa ziada wa kikristo kuhusu asili yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nao” linaunganisha aya na simulizi lililotangulia. Tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja ili kuonyesha uwezekano wa kutafsiri λόγος kama “ujumbe” au “aliyosema.”
