  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: sw
  text: Kisha Ibilisi akamwambia[a], “Ikiwa wewe ni Mwana wa Mungu, liambie jiwe hili liwe mkate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kuwa wewe ni Mwana wa Mungu.” Sharti la Kigiriki linaweza kueleweka kuwa linakubali dai hilo kwa ajili ya changamoto, lakini matini kuu inadumisha muundo wa sharti.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Kisha
  rationale: Ni kiunganishi hafifu kinachoendeleza simulizi; “Kisha” ni ya kawaida na inaonyesha mwendelezo bila kukazia mno mpangilio wa wakati.
- source_word: διάβολος
  choice: Ibilisi
  rationale: Katika muktadha huu neno hilo ni jina linalotambulika la kiumbe binafsi anayemjaribu Yesu; “Ibilisi” ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: Εἰ
  choice: Ikiwa
  rationale: Inahifadhi wazi muundo wa sharti na mvutano wa changamoto, bila kuamua kimya kwamba maana yake lazima iwe “Kwa kuwa.”
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muktadha huu ni cheo maalumu cha kikristolojia, si maana isiyo maalumu ya “mwana mmoja wa Mungu.”
- source_word: εἰπὲ
  choice: liambie
  rationale: Kitenzi cha kusema hapa kinaelekezwa kwa jiwe na kinaanzisha agizo; “liambie” ni Kiswahili cha kawaida na hakiongezi nguvu ya “amuru” ambayo haijasemwa moja kwa moja.
- source_word: τῷ λίθῳ τούτῳ
  choice: jiwe hili
  rationale: “Jiwe” ndilo neno la kawaida kwa λίθος, na kiashiria “hili” kimehifadhiwa.
- source_word: ἵνα γένηται
  choice: liwe
  rationale: Baada ya “liambie,” muundo wa Kiswahili wa hali ya kutegemea unaeleza kwa kawaida maudhui ya agizo na maana ya kuwa kitu kingine.
- source_word: ἄρτος
  choice: mkate
  rationale: Ni tafsiri ya moja kwa moja; “chakula” ni pana mno, na “mkate mmoja” au “donge la mkate” kungeongeza umahususi usiopo katika Kigiriki.
theological_decisions:
- issue: Nguvu ya kishazi cha sharti εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ikiwa wewe ni Mwana wa Mungu
  alternative: Kwa kuwa wewe ni Mwana wa Mungu
  rationale: Tafsiri kuu inadumisha muundo wa sharti wa Kigiriki na mvutano wa kishawishi bila kukanusha uana wa Yesu. Tanbihi inaonyesha uwezekano wa kuelewa msingi wa changamoto kuwa umekubaliwa kwa ajili ya hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ibilisi,” “Mwana wa Mungu,” na “jiwe hili liwe mkate” ni misemo ya kawaida ya kibiblia bila kuwa ya kizamani.
