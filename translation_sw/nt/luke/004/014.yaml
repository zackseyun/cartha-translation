  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: sw
  text: Yesu akarudi Galilaya katika nguvu za Roho, na taarifa[a] kumhusu ikaenea katika eneo lote la jirani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “habari,” “umaarufu,” au “uvumi.” Neno la Kigiriki linaweza kumaanisha taarifa inayosambaa sana bila kubainisha ikiwa ni nzuri au mbaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: akarudi
  rationale: Kitenzi hiki kinaonyesha kurudi mahali fulani katika mtiririko wa simulizi; “akarudi” ni Kiswahili cha kawaida na huhifadhi mwelekeo huo.
- source_word: ἐν τῇ δυνάμει
  choice: katika nguvu
  rationale: Muundo huu unahifadhi kwa kiasi kikubwa usemi wa Kigiriki na hauamui kimyakimya kama nguvu hizo ni chombo, namna, au hali ya kurudi kwake Yesu.
- source_word: τοῦ πνεύματος
  choice: za Roho
  rationale: Muktadha wa Luka 4 unaonyesha kuwa anayelengwa ni Roho Mtakatifu, lakini neno “Mtakatifu,” ambalo halipo wazi katika mstari huu, halijaongezwa.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: Baada ya “akarudi,” jina la mahali linaonyesha kwa kawaida na kwa uwazi mahali alikokwenda bila kuhitaji kihusishi cha ziada.
- source_word: φήμη
  choice: taarifa
  rationale: “Taarifa” inaweza kumaanisha habari inayosambaa bila kuipa moja kwa moja maana chanya ya sifa au maana hasi ya uvumi.
- source_word: ἐξῆλθεν
  choice: ikaenea
  rationale: Ingawa maana ya msingi ni “ikatoka,” “ikaenea” huwasilisha kwa Kiswahili cha kawaida sitiari ya taarifa kwenda sehemu mbalimbali.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: katika eneo lote la kandokando
  rationale: Usemi huu unaonyesha kuenea kote katika wilaya au eneo lililozunguka, kwa lugha inayoeleweka katika Kiswahili cha sasa.
- source_word: περὶ αὐτοῦ
  choice: kumhusu
  rationale: “Kumhusu” ni usemi wa kawaida unaowasilisha kwa usahihi maana ya taarifa kuwa juu ya Yesu.
theological_decisions:
- issue: Anayerejelewa na πνεύματος
  choice: Roho, yaani Roho Mtakatifu katika muktadha
  alternative: roho isiyotajwa wazi kuwa Roho Mtakatifu
  rationale: Muktadha wa karibu wa Luka 4 unamtambulisha Roho Mtakatifu kama anayehusika. Hata hivyo, tafsiri kuu inahifadhi tu “Roho” kwa sababu kivumishi “Mtakatifu” hakipo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “katika nguvu za Roho” umehifadhiwa ili kuepuka kufasiri kupita kiasi uhusiano wa nguvu hizo na kurudi kwa Yesu; “ikaenea” imetumiwa kwa ufasaha wa kawaida wa Kiswahili.
