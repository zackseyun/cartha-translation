translation:
  language: sw
  text: kutangaza mwaka wa kibali cha Bwana[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutangaza mwaka wa fadhili za Bwana.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “kutangaza mwaka uliokubalika wa Bwana.” Maneno haya yanatoa mwangwi wa Isaya 61:2 na huenda yakadokeza Yubile.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: kutangaza
  rationale: Kitenzi hiki kinadumisha maana ya kutolea watu tangazo rasmi na la wazi; hakipunguzi maana kuwa mahubiri pekee.
- source_word: ἐνιαυτὸν
  choice: mwaka
  rationale: Neno hili kwa kawaida humaanisha mwaka. Pia linahifadhi mwangwi wa Isaya 61:2 bila kulipanua kuwa kipindi kwa ujumla.
- source_word: κυρίου
  choice: wa Bwana
  rationale: Muundo wa umilikaji ni wa kawaida na wa heshima katika Kiswahili, nao unadumisha jina la cheo κύριος bila kulifanya moja kwa moja kuwa jina la Mungu lililoandikwa BWANA.
- source_word: δεκτόν
  choice: wa kibali
  rationale: Katika muktadha huu neno linaonyesha wakati unaokubaliwa au unaoleta fadhili. ‘Wa kibali’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha wazo la fadhili za Mungu, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya ‘uliokubalika.’
theological_decisions:
- issue: Mwangwi wa Isaya 61:2 na uwezekano wa kurejelea Yubile
  choice: Kuhifadhi ‘mwaka’ bila kuongeza ‘Yubile’ katika matini kuu.
  alternative: kutangaza Yubile ya Bwana
  rationale: Maneno ya Kigiriki yanarejelea Isaya 61:2 na yanaweza kuamsha wazo la Yubile, lakini hayasemi ‘Yubile’ waziwazi. Tafsiri haipaswi kuingiza ufafanuzi huo katika matini.
- issue: Uhusiano wa δεκτόν na κυρίου
  choice: mwaka wa kibali cha Bwana
  alternative: mwaka uliokubalika kwa Bwana
  rationale: Muundo mkuu unaonyesha mwaka unaotambulishwa na kibali au fadhili za Bwana, lakini tanbihi inadumisha uwezekano wa kuuelewa kama mwaka unaokubalika kwa Bwana.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: BWANA
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida ya κύριος na haibainishi kupita kiasi desturi ya kuwakilisha jina la Mungu kwa herufi kubwa katika dondoo la Isaya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kibali’ huepuka ugumu wa muundo wa kimapokeo huku ikihifadhi uhusiano wa kifungu na fadhili za Bwana.
