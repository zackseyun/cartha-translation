  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: sw
  text: 'Naye akawaambia, “Bila shaka mtaniambia methali hii: ‘Tabibu, jiponye mwenyewe.’ Yote tuliyosikia yaliyotokea Kapernaumu[a], yafanye hapa pia katika kwao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, Kigiriki kina kihusishi εἰς, kwa kawaida “kwenda” au “kuingia,” mbele ya “Kapernaumu”; lakini katika muktadha huu maana yake ni ya mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Bila shaka
  rationale: Huwasilisha msisitizo wa kielezi hiki na uhakika wa Yesu kuhusu jambo watakalosema.
- source_word: ἐρεῖτέ μοι
  choice: mtaniambia
  rationale: Huhifadhi wakati ujao wa kitenzi na muundo wa kusema jambo kwa mtu kwa Kiswahili cha kawaida.
- source_word: παραβολὴν
  choice: methali
  rationale: Hapa neno hili linarejelea kauli fupi ya kimethali, si mfano wa kisimulizi.
- source_word: Ἰατρέ
  choice: Tabibu
  rationale: Ni jina la mtaalamu wa tiba katika hali ya mwito, na lina hadhi inayofaa kauli ya kimethali.
- source_word: θεράπευσον σεαυτόν
  choice: jiponye mwenyewe
  rationale: Huhifadhi amri ya moja kwa moja na wazo la mtu kujiponya.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Mambo yote tuliyosikia kuwa yalitokea
  rationale: Huhifadhi upana wa ὅσα, habari iliyosikiwa, na maana ya matukio yaliyotokea bila kuyafanya moja kwa moja kuwa matendo ya Yesu katika tafsiri.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: Kapernaumu
  rationale: Katika muktadha wa matukio kutokea, maana ni ya mahali; Kiswahili huonyesha maana hiyo kwa jina la mahali bila kihusishi.
- source_word: ποίησον καὶ ὧδε
  choice: yafanye hapa pia
  rationale: Kiwakilishi cha y- hurejelea mambo yaliyotajwa, huku 'hapa pia' ikihifadhi καὶ ὧδε kwa Kiswahili asilia.
- source_word: ἐν τῇ πατρίδι σου
  choice: katika mji wako wa nyumbani
  rationale: Katika muktadha wa Nazareti, πατρίς ni mahali au mji alikokulia, si taifa kwa maana ya kisasa.
theological_decisions:
- issue: Maana ya παραβολή katika muktadha huu
  choice: methali
  alternative: mfano; msemo
  rationale: Kauli ‘Tabibu, jiponye mwenyewe’ ni usemi mfupi wa kimethali, si mfano wa kisimulizi; uchaguzi huu hauingizi msimamo wa kimadhehebu.
- issue: Uhusiano wa γενόμενα na matendo yaliyofanywa
  choice: yalitokea
  alternative: yalifanywa
  rationale: Umbo la γενόμενα linasema mambo yaliyotokea; ‘yalitokea’ huhifadhi usemi huo usioeleza wazi mtendaji, ingawa muktadha unaweza kuelekeza kwenye matendo ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tabibu’ hudumisha ladha ya kimethali; ‘mji wako wa nyumbani’ ni wazi kwa wasomaji wa kawaida. Alama ya tanbihi [a] ipo katika matini kuu.
