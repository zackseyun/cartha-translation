  terminology: «Methali» ni chaguo sahihi kwa παραβολή katika kauli hii fupi. «Tabibu» lina hadhi inayofaa na linaeleweka katika Kiswahili Sanifu. Kapernaumu limedumishwa. Tanbihi imerekebishwa ili isitoe tafsiri isiyo ya kisarufi ya «yalitokea kwenda/ndani ya Kapernaumu», bali ieleze thamani ya εἰς kwa uwazi.
