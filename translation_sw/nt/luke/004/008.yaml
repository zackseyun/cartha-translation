base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: sw
  text: 'Yesu akamjibu, “Imeandikwa: ‘Utamwabudu[a] Bwana Mungu wako, na utamtumikia yeye peke yake.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “Utamsujudia Bwana Mungu wako.”
    reason: lexical_alternative
  - marker: b
    text: Nukuu hii inaakisi Kumbukumbu la Torati 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: akamjibu
  rationale: Muundo wa Kigiriki wenye kitenzi-shirikishi na kitenzi kikuu unaeleza jibu la Yesu. “Akamjibu” ni Kiswahili cha simulizi kilicho cha kawaida na huhifadhi maana ya kuitikia na kumwelekea mhusika aliyetangulia.
- source_word: Γέγραπται
  choice: Imeandikwa
  rationale: Hii ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko; pia hudokeza kwamba yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: Κύριον
  choice: Bwana
  rationale: Katika nukuu hii inayomhusu Mungu, “Bwana” huhifadhi uzito wa jina la heshima na mamlaka bila kuingiza moja kwa moja umbo la jina la Kiebrania ambalo halimo katika matini ya Kigiriki.
- source_word: τὸν θεόν σου
  choice: Mungu wako
  rationale: Tafsiri ya moja kwa moja inayohifadhi uhusiano unaoonyeshwa na kiwakilishi cha umilikaji.
- source_word: προσκυνήσεις
  choice: Mwabudu
  rationale: Katika muktadha wa ibada inayomstahili Mungu pekee, “mwabudu” huwasilisha maana kuu kwa Kiswahili cha sasa. Hali ya amri inafaa kwa nukuu hii ya agizo, ingawa umbo la Kigiriki ni la wakati ujao.
- source_word: λατρεύσεις
  choice: umtumikie
  rationale: Kitenzi hiki humaanisha kumtolea Mungu huduma ya kidini. “Umtumikie” ni cha asili na muktadha wa kuabudu huweka wazi uzito wa huduma hiyo.
- source_word: αὐτῷ μόνῳ
  choice: yeye peke yake
  rationale: Mpangilio huu unasisitiza kwamba huduma hiyo ni kwa Mungu na si kwa mwingine yeyote.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Maandiko inayomhusu Mungu
  choice: Bwana
  alternative: BWANA
  rationale: Matini ya Agano Jipya hapa ina κύριον. “Bwana” hutafsiri neno hilo bila kuingiza katika matini kuu umbo maalumu la jina la Kiebrania.
- issue: Nguvu ya προσκυνέω katika muktadha wa ibada
  choice: Mwabudu
  alternative: Msujudie
  rationale: “Mwabudu” huonyesha wazi tendo la kidini linalokusudiwa katika muktadha huu; “msujudie” huhifadhi zaidi picha ya kuinama, hivyo imewekwa katika tanbihi kama uwezekano wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “akamjibu” ni wa kawaida, huku nukuu ikitumia hali ya amri ili agizo la Maandiko lisikike kwa uwazi na uasili.
