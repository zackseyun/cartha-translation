base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: sw
  text: Akawatuma wajumbe wamtangulie[a]. Nao wakaenda, wakaingia katika kijiji cha Wasamaria[b] ili kumfanyia maandalizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “mbele ya uso wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kijiji cha Kisamaria.” Kigiriki kinasema kwa namna ya moja kwa moja zaidi, “kijiji cha Wasamaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Kitenzi hiki cha wakati uliopita kinamaanisha ‘alituma’; kiambishi cha watendwa ‘-wa-’ kinawarejelea wajumbe na kinafanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: ἀγγέλους
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa kwenda kijijini, si viumbe wa mbinguni; ‘wajumbe’ ndiyo maana inayofaa ya ἄγγελοι hapa.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: wamtangulie
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nahau inayomaanisha kwenda mbele yake kabla hajafika, bila kulazimisha usemi halisi ‘mbele ya uso wake.’
- source_word: πορευθέντες
  choice: wakaenda
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kuingia; ‘wakaenda’ linaendeleza mfuatano wa matendo kwa kawaida katika simulizi la Kiswahili.
- source_word: εἰσῆλθον
  choice: na kuingia
  rationale: Huwakilisha tendo la kuingia huku likiunganishwa kwa kawaida na ‘wakaenda.’
- source_word: κώμην
  choice: kijiji
  rationale: κώμη kwa kawaida ni makazi madogo kuliko mji, hivyo ‘kijiji’ ni chaguo sahihi.
- source_word: Σαμαριτῶν
  choice: cha Wasamaria
  rationale: Huhifadhi muundo wa wingi wa Kigiriki unaoeleza kijiji cha watu wa Samaria, badala ya kuufupisha moja kwa moja kuwa kivumishi.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: ili kumfanyia maandalizi
  rationale: ὡς pamoja na kitenzi-jina hapa huonyesha kusudi. Usemi huu ni wa kawaida katika Kiswahili na hauainishi maandalizi ambayo Kigiriki pia kinayaacha bila kutajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. ‘Nao wakaenda na kuingia’ huhifadhi mfuatano wa matendo bila kutumia muundo mzito wa kishirikishi, na ‘kumfanyia maandalizi’ huacha kitu kilichoandaliwa bila kutajwa kama ilivyo katika Kigiriki.
