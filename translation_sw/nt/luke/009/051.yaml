  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: sw
  text: Ikawa, siku za kuchukuliwa kwake juu[a] zilipokuwa zikitimia, yeye mwenyewe akauelekeza uso wake kwa uthabiti[b] kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupaa kwake.” Kigiriki husema kwa maana ya moja kwa moja “kuchukuliwa kwake juu.”
    reason: alternative_reading
  - marker: b
    text: Kauli “akauelekeza uso wake kwa uthabiti” inaonyesha kwamba alikuwa ameazimia kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni mpito wa kisimulizi unaotambulisha tukio jipya. “Ikawa” huhifadhi ladha ya kisimulizi bila kuongeza neno la wazi la wakati kama “sasa,” ambalo halimo katika Kigiriki.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: siku ... zilipokuwa zikitimia
  rationale: Muundo huu una maana ya wakati, na kitenzi cha hali inayoendelea huhifadhi wazo la kipindi kilichokuwa kikifikia utimilifu wake.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: za kuchukuliwa kwake
  rationale: Huhifadhi maana pana na ya moja kwa moja ya ἀνάλημψις, yaani kuchukuliwa juu, bila kuifunga mapema kwa kupaa pekee.
- source_word: καὶ αὐτὸς
  choice: yeye mwenyewe
  rationale: Huwakilisha msisitizo wa kiwakilishi αὐτός katika kifungu hiki.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: akauelekeza uso wake kwa uthabiti
  rationale: Huhifadhi taswira ya uso huku ikifanya maana ya azimio thabiti ieleweke kwa msomaji wa Kiswahili cha sasa.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: kwenda Yerusalemu
  rationale: Hutoa kwa lugha ya kawaida kusudi na mwelekeo wa safari unaoonyeshwa na muundo wa Kigiriki.
theological_decisions:
- issue: Upeo wa maana ya τῆς ἀναλήμψεως αὐτοῦ
  choice: kuchukuliwa kwake
  alternative: kupaa kwake
  rationale: Neno la Kigiriki linaweza kuelekeza hasa kwenye kupaa, lakini pia linaweza kutazama kwa upana mwendo wa Yesu kuelekea kifo, ufufuo na kutukuzwa. Tafsiri pana huhifadhi mvutano huo, huku maana ya jadi ikiwekwa katika tanbihi.
- issue: Nguvu ya nahau τὸ πρόσωπον ἐστήρισεν
  choice: akauelekeza uso wake kwa uthabiti
  alternative: akaazimia kabisa
  rationale: Taswira ya uso imehifadhiwa pamoja na maana yake ya azimio thabiti, bila kuifanya kuwa kauli tambarare isiyo na mwangwi wa lugha ya kinabii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ikawa” kimetumiwa kama mpito wa kisimulizi; taswira ya uso imehifadhiwa lakini imefafanuliwa kwa “kwa uthabiti” ili nahau ieleweke kwa kawaida.
