base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: sw
  text: Kwa maana yeyote atakayeniaibikia mimi na maneno yangu, Mwana wa Adamu atamwaibikia mtu huyo[a] atakapokuja katika utukufu wake na wa Baba na wa malaika watakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na maneno ya Kigiriki: “Mwana wa Adamu atamwaibikia huyo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Muundo wa Kigiriki unaweza pia kutafsiriwa: “atakapokuja katika utukufu wake, na katika utukufu wa Baba na wa malaika watakatifu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Kwa maana yeyote
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na “yeyote” huwakilisha vizuri uhusiano usio maalumu wa ὃς ... ἄν.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: atakayenionea aibu ... atamwonea aibu
  rationale: “Kumwonea mtu aibu” ni Kiswahili cha kawaida kinachohifadhi maana ya kuona aibu kwa habari ya mtu na pia urudiano wa kitenzi kilekile katika sehemu zote mbili.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: mimi na maneno yangu
  rationale: “Maneno yangu” ni tafsiri ya moja kwa moja ya τοὺς ἐμοὺς λόγους, bila kuipanua kuwa “mafundisho” au “ninayosema.” Kiwakilishi “mimi” kinatoa mkazo wa asili.
- source_word: τοῦτον
  choice: mtu huyo
  rationale: Huonyesha kwa uwazi kwamba kiwakilishi elekezi kinamrejelea “yeyote” aliyetajwa awali, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya muundo wa Kigiriki.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni namna iliyozoeleka ya kutafsiri cheo hiki katika Kiswahili na huhifadhi mwangwi wake wa kimaandiko bila kufafanua zaidi.
- source_word: ὅταν ἔλθῃ
  choice: atakapokuja
  rationale: Hutoa maana ya wakati ujao ya ὅταν pamoja na aoristi tegemezi kwa Kiswahili cha kawaida.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: katika utukufu wake, na wa Baba, na wa malaika watakatifu
  rationale: Huhifadhi uratibu wa genitivi unaotegemea “utukufu,” bila kuamua kimya-kimya kama maandishi yanakusudia utukufu mmoja wa pamoja au namna zilizotofautishwa za utukufu.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: malaika watakatifu
  rationale: Ni tafsiri wazi na ya moja kwa moja ya kivumishi na nomino.
theological_decisions:
- issue: Mwitikio unaolingana wa aibu
  choice: Kutumia “kumwonea aibu” katika vifungu vyote viwili
  alternative: Kutafsiri sehemu ya pili kama “atamkataa” au “hatamkiri”
  rationale: Kigiriki hurudia kitenzi kilekile; tafsiri inahifadhi urudiano huo na haiongezi maana kali zaidi ya kukataa ambayo haijasemwa moja kwa moja.
- issue: Utukufu wa Mwana wa Adamu, Baba, na malaika watakatifu
  choice: “katika utukufu wake, na wa Baba, na wa malaika watakatifu”
  alternative: “katika utukufu wake na katika utukufu wa Baba na wa malaika watakatifu”
  rationale: Muundo uliochaguliwa unabaki karibu na msururu wa Kigiriki na kuhifadhi mvutano wa iwapo “utukufu” unaeleweka kwa pamoja au kwa mahusiano yaliyotofautishwa, bila kuingiza hitimisho la kimadhehebu.
- issue: Rejeo la umoja baada ya “yeyote”
  choice: “mtu huyo”
  alternative: “yeye” au kurudia “yeyote”
  rationale: Kiswahili hakihitaji kuendeleza jinsia ya kisarufi ya Kigiriki. “Mtu huyo” huhifadhi umoja na rejeo la wazi bila kudokeza kwamba onyo linawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kumwonea aibu” ni usemi wa asili unaofaa kwa mhusika ambaye mtu anaona aibu kuhusishwa naye. Uakifishaji katika kifungu cha utukufu umetumiwa kusaidia usomaji bila kufuta utata halisi wa muundo wa Kigiriki.
