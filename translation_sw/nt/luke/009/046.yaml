  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: sw
  text: Kisha mjadala ukazuka miongoni mwao kuhusu ni nani kati yao ambaye angekuwa mkuu zaidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazo lilizuka miongoni mwao,” au “Mabishano yakazuka miongoni mwao.”
    reason: Neno la Kigiriki linaweza kumaanisha wazo au fikira, mjadala, au mabishano.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: ukazuka
  rationale: Ingawa maana ya msingi ni ‘uliingia,’ pamoja na διαλογισμός kitenzi hiki kinaelezwa kwa Kiswahili cha kawaida kama jambo ‘kuzuka.’
- source_word: δὲ
  choice: Kisha
  rationale: Kiunganishi hiki kinaonyesha mwendelezo mpole wa simulizi; ‘Kisha’ kinafaa katika muktadha huu.
- source_word: διαλογισμὸς
  choice: mjadala
  rationale: Neno linaweza kumaanisha kuwaza, kujadiliana, au kubishana. ‘Mjadala’ linahifadhi uwezekano wa mazungumzo yenye mvutano bila kuzidisha wazi kiwango cha ugomvi.
- source_word: ἐν αὐτοῖς
  choice: miongoni mwao
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kwamba jambo lilitokea ndani ya kundi lao.
- source_word: τὸ τίς ἂν εἴη
  choice: kuhusu ni nani ... ambaye angekuwa
  rationale: Muundo huu unaanzisha yaliyokuwa mada ya mjadala, huku ‘angekuwa’ kikihifadhi kwa kawaida wazo la uwezekano lililomo katika ἄν pamoja na hali ya kutamani.
- source_word: μείζων
  choice: mkuu zaidi
  rationale: Ingawa ni umbo la kulinganisha, katika muktadha wa cheo ndani ya kundi maana yake ni yule aliye mkuu kuliko wengine; ‘mkuu zaidi’ linaeleza hilo kwa kawaida.
- source_word: αὐτῶν
  choice: kati yao
  rationale: Kirai hiki kinaonyesha kundi ambalo watu wake wanalinganishwa.
theological_decisions:
- issue: Hali ya mwingiliano wa wanafunzi
  choice: mjadala
  alternative: mabishano; mawazo
  rationale: Kigiriki kinaweza kuonyesha fikira ya ndani au majadiliano ya kundi. Muktadha wa ushindani kuhusu ukuu unaunga mkono majadiliano yenye mvutano, lakini ‘mjadala’ halilazimishi maana kali ya ugomvi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi na unahifadhi utata wa διαλογισμός kupitia tanbihi.
