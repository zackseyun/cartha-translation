  terminology: “Mwalimu” ni anwani ya heshima iliyozoeleka na ya kiasili kwa Ἐπιστάτα katika Kiswahili, bila kulinganisha neno hili moja kwa moja na “Bwana” (κύριε). “Vibanda” linafaa kwa σκηνάς; tanbihi irejee mbadala za kimsamiati bila kudai mwangwi wa sikukuu kuwa hakika.
