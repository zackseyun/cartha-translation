  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: sw
  text: 'Walipokuwa wakiondoka kwake, Petro akamwambia Yesu, “Mwalimu, ni vizuri sisi tuwe hapa. Tujenge vibanda vitatu[a]: kimoja chako, kimoja cha Musa, na kimoja cha Eliya.” Hakujua alichokuwa akisema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahema” au “makao ya muda.” Neno la Kigiriki skēnai humaanisha makao ya muda na huenda likawa na mwangwi wa taswira ya sikukuu za kibiblia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Walipokuwa wakiondoka kwake
  rationale: Muundo huu wa kisimulizi unaonyesha tendo lililokuwa likiendelea wakati huo. Kiswahili hiki ni cha asili na kinaweka wazi kwamba Musa na Eliya walikuwa wakiondoka kwa Yesu bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: Ἐπιστάτα
  choice: Bwana
  rationale: Katika Luka, neno hili ni namna ya heshima ya kumwita Yesu kama mwenye mamlaka. “Bwana” ni la kawaida na lenye hadhi katika Kiswahili; “Mwalimu” lingeweza kulichanganya na διδάσκαλος na kupunguza wazo la mamlaka.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ni vizuri sisi kuwa hapa
  rationale: Tafsiri hii inahifadhi tathmini ya καλόν na msisitizo wa ἡμᾶς kwa Kiswahili kinachoeleweka.
- source_word: ποιήσωμεν
  choice: Na tutengeneze
  rationale: Kauli hii inatoa pendekezo linalowahusisha wasemaji. “Tutengeneze” huhifadhi maana pana ya ποιέω bila kudai hasa ujenzi wa kudumu.
- source_word: σκηνὰς
  choice: vibanda
  rationale: Neno hili linaweza kumaanisha makao ya muda, vibanda, au mahema. “Vibanda” linafaa kwa makao ya muda na linaweza kuhifadhi mwangwi wa Sikukuu ya Vibanda bila kuufanya kuwa hakika.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Hakujua alichokuwa akisema
  rationale: Huhifadhi kutokujua kwa Petro na hali ya tendo linaloendelea katika λέγει; halibadilishi maana kuwa tu kwamba hakuelewa.
theological_decisions:
- issue: Maana ya σκηνάς katika simulizi la kubadilika sura na uwezekano wa mwangwi wa sikukuu
  choice: vibanda
  alternative: mahema; makao ya muda; maskani
  rationale: Aya haitaji wazi Sikukuu ya Vibanda wala Maskani ya ibada. “Vibanda” ni tafsiri ya moja kwa moja inayofaa kwa makao ya muda, huku tanbihi ikihifadhi njia nyingine na uwezekano wa mwangwi wa taswira ya sikukuu.
- issue: Cheo Ἐπιστάτα anachotumia Petro kwa Yesu
  choice: Bwana
  alternative: Mkuu; Mwalimu
  rationale: “Bwana” huwasilisha heshima na mamlaka kwa Kiswahili cha kawaida bila kulazimisha maana ya kiufundi ya “Mwalimu.” Hata hivyo, haitumiki hapa kuthibitisha dai maalumu la kiteolojia zaidi ya namna ya heshima ya kumwita Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kisimulizi ni mwepesi kusomeka; majina Musa na Eliya yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili. Tanbihi imewekwa baada ya “vibanda vitatu” ili kuonyesha wazi neno linalofafanuliwa.
