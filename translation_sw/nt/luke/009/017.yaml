base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: sw
  text: 'Nao wote wakala wakashiba, na vipande vilivyobaki vikakusanywa: vikapu kumi na viwili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: wakala
  rationale: Wakati uliopita wa masimulizi unaeleza tukio moja kwa moja; “wakala” ni Kiswahili cha kawaida na cha asili.
- source_word: ἐχορτάσθησαν
  choice: wakashiba
  rationale: Kitenzi hiki kinaonyesha kwamba walikula mpaka wakatosheka; “wakashiba” ni cha asili na kinaeleweka vizuri kuliko tafsiri ya neno kwa neno ya hali tendwa.
- source_word: πάντες
  choice: wote
  rationale: Kinahifadhi msisitizo kwamba kila mmoja katika umati alikula na kushiba.
- source_word: ἤρθη
  choice: vikakusanywa
  rationale: Ingawa maana ya msingi inaweza kuwa “vikainuliwa,” katika muktadha huu hali tendwa inaeleza kukusanywa kwa masazo; “vikakusanywa” ni wazi na ya kawaida.
- source_word: τὸ περισσεῦσαν
  choice: vilivyobaki
  rationale: Kirai hiki cha kishiriki chenye kibainishi kinatumika kama nomino na kumaanisha kile kilichosalia.
- source_word: αὐτοῖς
  choice: haijawekwa wazi katika tafsiri
  rationale: Dativu hii ina uhusiano usio wazi kabisa—inaweza kueleweka kama kilichowabakia au kwa kuhusishwa nao. Kuiwakilisha kwa “kwa ajili yao” kungetoa maana isiyo ya kawaida na huenda ikafafanua kupita kiasi; muktadha wa sentensi unadumisha uhusiano huo.
- source_word: κλασμάτων
  choice: vipande
  rationale: κλάσματα ni vipande vilivyovunjwa, hasa vya chakula; “vipande” ni neno la kawaida na muktadha tayari unaonyesha kwamba ni mabaki ya chakula.
- source_word: κόφινοι δώδεκα
  choice: vikapu kumi na viwili
  rationale: Tafsiri hii ni sahihi, wazi, na haiingizi maelezo ya nyenzo za vikapu ambayo maandishi hayahitaji.
theological_decisions: []
