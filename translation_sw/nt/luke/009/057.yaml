  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: sw
  text: Walipokuwa wakienda njiani, mtu mmoja akamwambia, “Nitakufuata popote utakapoenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Walipokuwa wakienda
  rationale: Muundo wa genitivi huru wenye kitenzi-ushiriki cha wakati wa sasa unaonyesha tendo lililokuwa likiendelea wakati wa kauli iliyofuata; Kiswahili hiki ni cha asili na kinahifadhi maana hiyo ya wakati mmoja.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Huwasilisha kwa ufupi na kwa Kiswahili cha kawaida mazingira halisi ya safari bila kuondoa mwangwi wa dhamira ya safari katika Luka.
- source_word: εἶπέν τις πρὸς αὐτόν
  choice: mtu mmoja akamwambia
  rationale: τις ni kiwakilishi kisichotaja mtu mahususi; “mtu mmoja” hakiongezi jinsia, na “akamwambia” ni njia ya kawaida ya kutafsiri usemi ulioelekezwa kwake.
- source_word: Ἀκολουθήσω σοι
  choice: Nitakufuata
  rationale: Wakati ujao unaonyesha azimio au ahadi, huku “kufuata” ikihifadhi maana ya mwendo halisi na mwangwi wa uanafunzi bila ufafanuzi wa ziada.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: popote utakapoenda
  rationale: ὅπου pamoja na ἐάν na hali tegemezi huonyesha mahali popote bila kikomo. Ingawa ἀπέρχομαι inaweza kumaanisha kuondoka, hapa “kwenda” ni ya asili na inafaa kwa ahadi ya kumfuata.
theological_decisions:
- issue: Mwangwi wa uanafunzi katika ἀκολουθέω
  choice: Nitakufuata
  alternative: Nitakuwa mwanafunzi wako popote utakapoenda
  rationale: “Kufuata” huhifadhi kwa pamoja maana halisi ya kwenda nyuma yake na maana pana ya uanafunzi katika muktadha wa Luka, bila kuingiza ufafanuzi usiotamkwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. “Njiani” na “popote utakapoenda” ni miundo ya kawaida inayoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika kwa kuwa tofauti ya “kwenda/kuondoka” haibadili maana kuu na inaweza kuhifadhiwa vizuri katika tafsiri ya kawaida.
