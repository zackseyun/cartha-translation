  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: sw
  text: Yatieni maneno haya masikioni mwenu, kwa maana Mwana wa Adamu yuko karibu kukabidhiwa[a] mikononi mwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusalitiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kukabidhi,” “kumtia mtu mikononi mwa wengine,” au katika miktadha fulani, “kusaliti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Yatieni ... masikioni mwenu
  rationale: Kauli ya amri ya wingi inahifadhi mwito wa moja kwa moja na taswira halisi ya Kigiriki ya kuweka maneno ‘masikioni,’ yaani kuyasikiliza kwa makini na kuyakumbuka. Kiwakilishi cha msisitizo ὑμεῖς kinaeleweka kwa umbo la amri na muktadha bila kulazimisha ‘ninyi wenyewe,’ ambayo ingekuwa nzito kwa Kiswahili.
- source_word: τοὺς λόγους τούτους
  choice: maneno haya
  rationale: Hurejelea kauli maalumu ambayo Yesu anakaribia kuitoa; ‘maneno haya’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὁ γὰρ
  choice: kwa maana
  rationale: Inaonyesha sababu ya agizo la kusikiliza kwa makini na kuhifadhi uhusiano wa maelezo ulioletwa na γάρ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Kiswahili; linahifadhi usemi wa asili, utata wake, na mwangwi unaowezekana wa Danieli 7.
- source_word: μέλλει
  choice: yuko karibu
  rationale: Huwasilisha tendo linalokaribia kutokea bila kuongeza wazo lenye nguvu zaidi la kuamuliwa na hatima.
- source_word: παραδίδοσθαι
  choice: kukabidhiwa
  rationale: Kauli tendwa inaonyesha kutiwa chini ya mamlaka ya wengine. ‘Kukabidhiwa’ ni pana kuliko ‘kusalitiwa’ na haiweki mapema maana moja tu ya kitenzi.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: mikononi mwa watu
  rationale: Inahifadhi nahau ya kuingizwa chini ya uwezo wa wengine. ‘Watu’ ni tafsiri ya kawaida ya ἀνθρώπων katika muktadha huu; ‘wanaume’ ingepunguza maana isivyofaa kwa sababu Kiswahili hakihitaji kuiga jinsia ya kisarufi ya Kigiriki.
theological_decisions:
- issue: Jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ huhifadhi umbo la jina la cheo, utata wake wa kikristo, na uhusiano wake unaowezekana na Danieli 7 bila kulifafanua kupita kiasi.
- issue: Upeo wa maana ya παραδίδοσθαι
  choice: kukabidhiwa
  alternative: kusalitiwa
  rationale: Unabii huu unahusu kwa upana kuwekwa kwa Yesu chini ya mamlaka ya watu, wala si tendo la Yuda pekee. Tafsiri pana inahifadhi mvutano na maendeleo ya simulizi.
- issue: Maana ya ἀνθρώπων
  choice: watu
  alternative: wanadamu
  rationale: ‘Watu’ ni ya asili na jumuishi katika Kiswahili, huku ikiendeleza tofauti kati ya Mwana wa Adamu na wale ambao atatiwa mikononi mwao. ‘Wanaume’ ingeleta ubainishaji wa kijinsia ambao si lazima katika maana ya hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘masikioni mwenu’ imehifadhiwa kwa makusudi; ‘mikononi mwa watu’ ni nahau ya kawaida inayoonyesha kuwekwa chini ya mamlaka yao.
