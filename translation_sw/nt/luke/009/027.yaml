  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: sw
  text: 'Lakini nawaambia kweli: baadhi ya waliosimama hapa[a] hawataonja mauti[b] kamwe mpaka watakapouona ufalme wa Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “Wapo baadhi ya wale waliosimama hapa.”'
    reason: lexical_alternative
  - marker: b
    text: “Kuonja mauti” ni msemo unaomaanisha “kupatwa na kifo” au “kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Lakini nawaambia kweli
  rationale: “Lakini” linawakilisha kiunganishi δέ, na “nawaambia kweli” linadumisha ἀληθῶς kama kielezi kwa Kiswahili cha kawaida na chenye heshima.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: baadhi ya walio hapa
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi maana ya watu fulani miongoni mwa wale waliokuwa wamesimama hapo pamoja na Yesu, bila kulazimisha muundo wa Kigiriki.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: hawataonja mauti kamwe
  rationale: “Kamwe” linaonyesha ukanushi wenye mkazo wa οὐ μή, huku “kuonja mauti” likihifadhi sitiari ya Kigiriki badala ya kuibadili moja kwa moja kuwa “kufa.”
- source_word: ἕως ἂν ἴδωσιν
  choice: mpaka watakapouona
  rationale: Muundo huu wa wakati ujao ni wa kawaida katika Kiswahili na unaonyesha kikomo kinachotazamiwa katika ἕως ἄν pamoja na kitenzi tegemezi.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo neno la kawaida na lenye upana unaofaa kwa βασιλεία, bila kulipunguza kuwa utawala pekee.
theological_decisions:
- issue: Maana ya “kuuona ufalme wa Mungu” katika muktadha
  choice: Usemi umeachwa bila ufafanuzi wa kiimani unaouchagulia tukio fulani.
  alternative: Kuufafanua kuwa kugeuka sura kwa Yesu, ufufuo na kupaa kwake, kuanguka kwa Yerusalemu, au kuenea kwa kanisa.
  rationale: Kigiriki hakitambulishi wazi tukio linalokusudiwa. Kudumisha usemi wenyewe kunahifadhi uwezekano na mvutano wa kitheolojia bila kuingiza mtazamo maalumu wa nyakati za mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mauti” limetumiwa ili kuhifadhi sitiari ya “kuonja,” huku tanbihi ikieleza maana yake ya kawaida.
