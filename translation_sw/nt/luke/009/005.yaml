  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: sw
  text: Na wote wasiwowapokea[a], mnapotoka katika mji huo, yakung’uteni vumbi kutoka miguuni mwenu, liwe ushuhuda dhidi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiowakaribisha.” Kitenzi hiki kinaweza kumaanisha kuwapokea na pia kuwakaribisha wajumbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: wote ambao hawatawapokea
  rationale: Muundo huu unaendeleza maana ya jumla na isiyoainishwa ya ὅσοι ἂν. Kitenzi ‘kupokea’ kinaweza kujumuisha kuwakubali na kuwakaribisha wajumbe bila kuifanya maana iwe ukarimu wa malazi tu.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: mtakapotoka katika mji huo
  rationale: Kishirikishi kinaonyesha tendo linaloambatana kwa wakati na amri kuu. ‘Mji’ ni neno la kawaida la Kiswahili linaloweza kutaja town au city, hivyo linaendeleza upana wa πόλις.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: vumbi kutoka miguuni mwenu
  rationale: ‘Vumbi’ linaonyesha udongo mwembamba uliolegea, na ‘kutoka miguuni mwenu’ linahifadhi mahali vumbi lilipokuwa.
- source_word: ἀποτινάσσετε
  choice: yakung’uteni
  rationale: Amri ya wingi ‘yakung’uteni’ inaonyesha tendo la kuondoa vumbi kwa kulitikisa kwa nguvu na inafaa kwa ishara inayokusudiwa hapa.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: liwe ushuhuda dhidi yao
  rationale: ‘Ushuhuda’ linahifadhi maana ya jambo linalotoa ushahidi, huku ‘dhidi yao’ likionyesha nguvu ya tahadhari au hukumu ya ἐπί pamoja na hali ya kushtaki katika muktadha huu.
theological_decisions:
- issue: Nguvu ya ishara ya kukung’uta vumbi
  choice: liwe ushuhuda dhidi yao
  alternative: liwe ishara kwao; liwe tangazo la hukumu ya mwisho juu yao
  rationale: Maneno ya Kigiriki yanaonyesha jambo zito kuliko ishara isiyoegemea upande wowote, lakini mstari wenyewe hautamki wazi hukumu ya mwisho. Tafsiri inaendeleza mvutano huo bila kuongeza hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mji’ limechaguliwa bila tanbihi kwa kuwa katika Kiswahili linaweza kutaja makao ya ukubwa mbalimbali na hivyo halilazimishi tofauti ya Kiingereza kati ya ‘town’ na ‘city’.
