id: LUK.9.19
reference: Luke 9:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: sw
  text: Nao wakajibu, “Yohana Mbatizaji; wengine, Eliya; na wengine, kwamba mmoja wa manabii wa kale amefufuka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ameinuka.” Kitenzi cha Kigiriki kinaweza pia kueleweka kwa maana hii pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: wakajibu
  rationale: Muundo wa kishirikishi pamoja na kitenzi kikuu ni nahau yenye athari ya Kisemiti; ‘wakajibu’ huwasilisha maana yake kwa Kiswahili cha kawaida bila kurudia ‘wakajibu wakasema.’
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohana Mbatizaji
  rationale: ‘Mbatizaji’ ni jina la utambulisho linaloeleweka na huonyesha kazi inayotajwa na βαπτιστής.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: wengine ... na wengine
  rationale: Urudiaji wa ‘wengine’ unahifadhi mpangilio wa majibu tofauti; kiunganishi ‘na’ kinafanya orodha isomeke kwa kawaida.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: mmoja wa manabii wa kale
  rationale: Huwasilisha hali isiyobainishwa ya τις na uhusiano wa kundi katika τῶν ἀρχαίων kwa Kiswahili cha asili na kilicho wazi.
- source_word: ἀνέστη
  choice: amefufuka
  rationale: Katika muktadha wa mtu wa zamani kuonekana tena, ‘amefufuka’ ndiyo lugha ya kawaida ya Kiswahili na inadumisha mwangwi wa kufufuka, huku tanbihi ikitaja uwezekano mpana zaidi wa ‘ameinuka.’
theological_decisions:
- issue: Ikiwa ἀνέστη itafsiriwe kwa namna inayosema wazi kufufuka
  choice: amefufuka
  alternative: ameinuka
  rationale: Muktadha unahusu dhana ya watu kwamba nabii wa zamani amerudi akiwa hai, hivyo ‘amefufuka’ inaeleweka kwa urahisi. Hata hivyo, kwa kuwa kitenzi cha Kigiriki kinaweza pia kumaanisha kuinuka au kutokea, njia hiyo pana zaidi imehifadhiwa katika tanbihi badala ya kuondoa mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kama jibu la orodha kwa mtindo wa kawaida, huku urudiaji wa ‘wengine’ ukihifadhiwa.
