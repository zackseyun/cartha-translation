  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: sw
  text: Ikawa, alipokuwa akisali akiwa peke yake[a], wanafunzi walikuwa pamoja naye. Akawauliza, “Makutano ya watu husema mimi ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa faraghani.” Kirai cha Kigiriki kinaweza kumaanisha kujitenga na wengine, si lazima kutokuwa kabisa na mtu mwingine karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya masimulizi inayotumiwa kwa kawaida katika Luka; “Ikawa” huhifadhi kazi yake ya kuendeleza simulizi kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: alipokuwa akisali
  rationale: Muundo wa infinitivu wenye ἐν unaonyesha tendo lililokuwa likiendelea wakati huo; “alipokuwa akisali” ni wa asili na sahihi.
- source_word: κατὰ μόνας
  choice: akiwa peke yake
  rationale: Kirai hiki kinaweza kumaanisha kuwa mtu yuko peke yake au faraghani. Chaguo hili ni fupi na huhifadhi mvutano wa kifungu.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: wanafunzi walikuwa pamoja naye
  rationale: Huhifadhi maana rahisi ya kuwapo pamoja bila kuongeza kwamba walimjia au kwamba walikuwa karibu tu.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Akawauliza
  rationale: Kiswahili kwa kawaida hakihitaji kurudia “akisema” baada ya “akauliza”; kitenzi hiki kinawasilisha kwa ufasaha tendo la kuuliza lililofuatwa na swali la moja kwa moja.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Umati unasema mimi ni nani?
  rationale: Huu ni mpangilio wa kawaida wa swali lisilo la moja kwa moja katika Kiswahili, huku “umati” ukiwakilisha οἱ ὄχλοι kama kundi la watu.
theological_decisions:
- issue: Mvutano unaoonekana kati ya Yesu kusali peke yake na wanafunzi kuwa pamoja naye
  choice: 'Kutafsiri vifungu vyote viwili moja kwa moja: alikuwa akisali akiwa peke yake, na wanafunzi walikuwa pamoja naye.'
  alternative: Kutafsiri κατὰ μόνας kuwa “faraghani” au kuongeza kwamba wanafunzi walikuwa karibu ili kuondoa mvutano.
  rationale: Kigiriki kinaacha mvutano au undani huu wazi. Tafsiri haiamui kimyakimya jinsi upweke wake wa kusali ulivyohusiana na kuwapo kwa wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ikawa” hudumisha mtiririko wa masimulizi ya Luka bila kutumia lugha nzito; “akisali” ni ya kawaida na wazi. Alama ya tanbihi [a] imewekwa katika matini kuu.
