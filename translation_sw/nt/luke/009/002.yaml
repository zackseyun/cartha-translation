  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: sw
  text: Akawatuma watangaze ufalme wa Mungu[a] na kuwaponya wagonjwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawala wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya nakala za kale hazina neno “wagonjwa.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Kitenzi hiki kinaonyesha kuwatuma kwa kazi maalumu; katika Kiswahili, kiambishi cha mahali au neno la ziada linalolingana na ‘out’ halihitajiki ili maana hiyo ieleweke.
- source_word: κηρύσσειν
  choice: watangaze
  rationale: ‘Kutangaza’ huwasilisha tendo la kutoa ujumbe hadharani bila kuuwekea maana finyu ya shughuli ya kidini inayoweza kuambatana na ‘kuhubiri’.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo neno la kawaida la kibiblia katika Kiswahili, nalo linaweza kujumuisha mamlaka na eneo la utawala bila kuifinya maana kuwa tendo la kutawala pekee.
- source_word: ἰᾶσθαι
  choice: kuwaponya
  rationale: ‘Kuponya’ ni kitenzi cha kawaida na cha moja kwa moja kwa kurejesha afya katika muktadha huu.
- source_word: τοὺς ἀσθενεῖς
  choice: wagonjwa
  rationale: Ingawa ἀσθενής inaweza kumaanisha walio dhaifu, kuambatana kwake na ἰᾶσθαι hapa kunaonyesha watu wenye maradhi.
theological_decisions:
- issue: Maana ya βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: ‘Ufalme wa Mungu’ huhifadhi upana wa kirai, ambacho kinaweza kuelekeza kwa mamlaka ya Mungu kutawala na pia uhalisi unaotokana na utawala huo. ‘Utawala wa Mungu’ ni mbadala halali wa kileksika lakini unaweza kusisitiza tendo la kutawala kwa namna finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Akawatuma watangaze ... na kuwaponya ...’ ni wa asili katika masimulizi na hudumisha uhusiano wa kusudi wa vitenzi vya Kigiriki.
