  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: sw
  text: Takriban siku nane[a] baada ya maneno hayo[b], aliwachukua Petro, Yohana na Yakobo, akapanda mlimani kusali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “karibu siku nane”; neno lililotumiwa linaonyesha kwamba muda huu ni wa kukadiriwa.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kauli hizo.” Neno la Kigiriki λόγους linaweza kumaanisha “maneno” au “kauli” hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[haikutafsiriwa kwa neno maalumu]'
  rationale: Hapa ni kiunganishi cha usimulizi. Muundo wa sentensi ya Kiswahili unaendeleza simulizi kwa kawaida bila kuongeza neno la wakati kama “basi” au “wakati huo,” ambalo halipo wazi katika chanzo.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: baada ya maneno hayo
  rationale: “Maneno” ni tafsiri ya kawaida na pana ya λόγους, na hapa hurejelea yale yaliyosemwa mara tu kabla ya tukio hili; haibani maana kuwa mafundisho pekee.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: takriban siku nane
  rationale: “Takriban” huhifadhi ukadiriaji unaoonyeshwa na ὡσεὶ badala ya kufanya muda huo uonekane kamili kabisa.
- source_word: παραλαβὼν
  choice: aliwachukua
  rationale: Kitenzi hiki katika muktadha kina maana ya kuwachukua waandamane naye. Umbo la kitenzi cha Kiswahili linaonyesha kwamba watu watatu ndio waliochukuliwa.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petro, Yohana na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili, na orodha imeundwa kwa mtindo wa kawaida wa Kiswahili bila kupoteza washiriki wowote.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: akapanda mlimani
  rationale: “Akapanda” huhifadhi mwendo wa kwenda juu, na “mlimani” ni usemi wa asili wa Kiswahili unaoonyesha alikoelekea bila kudai kwamba mlima huo umetajwa tayari.
- source_word: προσεύξασθαι
  choice: kusali
  rationale: Kiswahili “kusali” huonyesha kwa ufupi na kwa kawaida kusudi la kupanda mlimani, kama infinitivu ya Kigiriki inavyofanya.
theological_decisions:
- issue: Ukadiriaji wa muda ukilinganishwa na masimulizi sambamba
  choice: takriban siku nane
  alternative: siku nane
  rationale: Neno ὡσεὶ linaonyesha ukadiriaji. Tafsiri hailiondoi wala kujaribu kulinganisha idadi hii kimya kimya na masimulizi mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Sentensi haiongezi jina la mhusika ambalo halipo katika mstari wa Kigiriki; kiima kinaeleweka kutokana na muktadha. “Kusali” limechaguliwa kama neno la kawaida na linaloeleweka kwa upana.
