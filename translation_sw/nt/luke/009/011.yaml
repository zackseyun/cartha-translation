id: LUK.9.11
reference: Luke 9:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: sw
  text: Lakini makundi ya watu yalipopata habari hiyo, yakamfuata. Naye akawakaribisha, akawa akizungumza nao kuhusu ufalme wa Mungu na kuwaponya wale waliohitaji uponyaji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliohitaji matibabu.” Neno la Kigiriki θεραπεία linaweza kumaanisha “uponyaji,” “matibabu,” au “huduma ya tiba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Lakini makundi ya watu
  rationale: “Lakini” linaonyesha mpito wenye utofautishaji mdogo unaoletwa na δέ, na “makundi ya watu” linahifadhi wingi wa ὄχλοι kwa Kiswahili cha kawaida.
- source_word: γνόντες
  choice: yalipopata habari hiyo
  rationale: Kirai hiki cha hali kimetolewa kama kishazi cha wakati, kikionyesha kwamba makundi hayo yalijua mahali au mwendo wa Yesu ndipo yakamfuata.
- source_word: ἠκολούθησαν αὐτῷ
  choice: yakamfuata
  rationale: Hili ni tamko la kawaida na la moja kwa moja la tendo la kumfuata Yesu, bila kulazimisha maana ya kiufundi ya uanafunzi.
- source_word: ἀποδεξάμενος αὐτούς
  choice: akawakaribisha
  rationale: “Akawakaribisha” linaonyesha kumpokea mtu kwa moyo mzuri, maana inayofaa ya ἀποδέχομαι katika muktadha huu.
- source_word: ἐλάλει αὐτοῖς
  choice: akawa akizungumza nao
  rationale: Muundo huu unaonyesha tendo lililoendelea, sawasawa na hali ya kitenzi cha Kigiriki cha wakati usiotimilika.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: kuhusu ufalme wa Mungu
  rationale: Ni tafsiri wazi na iliyozoeleka ya kirai hiki muhimu cha Injili.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: wale waliohitaji uponyaji
  rationale: “Uponyaji” linafaa kwa muktadha na hudumisha muundo wa nomino; tanbihi inahifadhi uwezekano wa maana ya “matibabu” au “huduma ya tiba.”
- source_word: ἰᾶτο
  choice: kuwaponya
  rationale: Kitenzi hiki kinaeleza tendo la Yesu la kuwaponya, huku muundo unaotegemea “akawa” ukiruhusu maana ya tendo lililoendelea.
theological_decisions:
- issue: Tafsiri ya βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: “Ufalme wa Mungu” ni kirai cha kibiblia kilichozoeleka na sahihi; hakifungi maana kwa eneo la mahali pekee, huku kikidumisha uthabiti wa istilahi katika Injili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “akawa akizungumza” unahifadhi hali ya tendo linaloendelea bila kufanya sentensi kuwa nzito.
