  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipashio vya Kigiriki: makundi yalipopata habari yakamfuata Yesu; yeye akayapokea kwa ukarimu, akaendelea kusema nao kuhusu ufalme wa Mungu, na akawaponya wenye haja ya uponyaji. Hali ya tendo inayoendelea katika ἐλάλει na ἰᾶτο imetolewa kwa kuridhisha kwa “akawa akizungumza” na “kuwaponya.”'
