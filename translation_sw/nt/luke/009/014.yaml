  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: sw
  text: Kwa maana walikuwako wanaume wapatao elfu tano.[a] Akawaambia wanafunzi wake, “Wafanyeni waketi kwa kuegemea katika makundi ya watu wapatao hamsini kila moja.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “wanaume,” yaani watu wa kiume waliokomaa, si umati wote; wanawake na watoto hawajahesabiwa katika idadi hii.
    reason: lexical_alternative
  - marker: b
    text: Au “Waketisheni katika makundi ya watu wapatao hamsini kila moja.” Kitenzi cha Kigiriki hasa hudokeza kukaa kwa kuegemea wakati wa kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: wapatao
  rationale: Huonyesha makadirio, si idadi kamili; “wapatao” ni Kiswahili sanifu na cha kawaida kwa matumizi yote mawili katika mstari huu.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno hili linataja hasa watu wa kiume waliokomaa, wala si watu kwa ujumla.
- source_word: πεντακισχίλιοι
  choice: elfu tano
  rationale: Ni uhamisho wa moja kwa moja na wa kawaida wa idadi hiyo katika Kiswahili.
- source_word: Κατακλίνατε
  choice: Waketisheni
  rationale: Katika muktadha wa Kiswahili, “waketisheni” ni agizo la kawaida la kuwafanya watu wakae kwa ajili ya kula; kidokezo maalumu cha kulala au kuegemea mezani kinaelezwa katika tanbihi.
- source_word: κλισίας
  choice: kwa makundi
  rationale: Wingi huu unaonyesha watu waliopangwa katika vikundi; “kwa makundi” ni usemi wazi na wa asili.
- source_word: ἀνὰ πεντήκοντα
  choice: ya watu wapatao hamsini kila moja
  rationale: Hufanya wazi maana ya ugawaji wa watu katika kila kundi, huku ikihifadhi makadirio ya ὡσεὶ.
- source_word: γὰρ ... δὲ
  choice: Kwa maana ... Aka-
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na kiambishi cha masimulizi “Aka-” huendeleza simulizi kwa njia ya kawaida kwa δέ.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: Huhifadhi wazi kiwakilishi cha umilikaji kilichomo katika Kigiriki.
