base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: sw
  text: Wanafunzi Yakobo na Yohana walipoona jambo hilo, wakasema, “Bwana, unataka tuamuru moto ushuke kutoka mbinguni na uwaangamize?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona jambo hilo
  rationale: Kauli ya wakati huwasilisha kwa Kiswahili cha kawaida tendo lililotangulia; ‘jambo hilo’ linaelekeza kwenye kukataliwa katika mstari uliotangulia bila kuongeza wazo jipya.
- source_word: δὲ
  choice: imeingizwa katika mtiririko wa ‘walipoona’
  rationale: Hapa δέ ni kiunganishi cha kuendeleza simulizi; hakihitaji neno tofauti katika Kiswahili kwa kuwa uhusiano wake unaonekana katika kishazi cha wakati.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: Wanafunzi Yakobo na Yohana
  rationale: Muundo huu unawatambulisha Yakobo na Yohana kuwa wanafunzi wanaotajwa, kwa lugha fupi na ya kawaida.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni jina la heshima linalofaa kwa κύριος wakati Yesu anaposemeshwa moja kwa moja.
- source_word: θέλεις
  choice: unataka
  rationale: Kitenzi θέλω hapa kinaonyesha kutaka au kusudia; ‘unataka’ ni cha kawaida na wazi.
- source_word: εἴπωμεν
  choice: tuamuru
  rationale: Ingawa maana ya msingi ni ‘tuseme,’ pamoja na kishamirishi ‘moto ushuke’ matumizi yake yana nguvu ya kusababisha au kuagiza; ‘tuamuru’ ni Kiswahili cha asili kuliko ‘tuuambie moto.’
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: moto ushuke kutoka mbinguni
  rationale: Inahifadhi picha halisi ya moto unaoshuka kutoka mbinguni na mwangwi wa hukumu ya kinabii.
- source_word: ἀναλῶσαι
  choice: kuwaangamiza
  rationale: ἀναλίσκω inaweza kumaanisha kuteketeza au kuangamiza. ‘Kuwaangamiza’ huwasilisha matokeo ya moto kwa Kiswahili wazi bila kudai kwamba kuchomwa pekee ndilo wazo.
- source_word: αὐτούς
  choice: kuwa-
  rationale: Kiambishi cha ngeli ya watu katika ‘kuwaangamiza’ kinawarejelea wakazi Wasamaria waliokataa kumpokea Yesu.
theological_decisions:
- issue: Yambwa lisilotajwa la ‘walipoona’
  choice: jambo hilo
  alternative: walipoona
  rationale: Kigiriki hakitaji yambwa wazi, lakini muktadha unarejelea kukataliwa kwa Yesu katika mstari uliotangulia. Nyongeza hii ndogo huleta Kiswahili cha kawaida bila kufasiri zaidi ya muktadha.
- issue: Nguvu ya pendekezo la wanafunzi
  choice: tuamuru moto ushuke
  alternative: tuseme moto ushuke; tuuite moto ushuke
  rationale: Kigiriki hutumia λέγω, ‘kusema,’ si kitenzi maalumu cha kuamuru. Hata hivyo, muundo huu unaonyesha usemi wenye kusudi la kuleta tukio hilo; ‘tuamuru’ huwasilisha maana hiyo kwa Kiswahili cha kawaida. Tanbihi inalinda usemi halisi na uwezekano wa ‘kuuita.’
- issue: Maana ya ἀναλῶσαι katika taswira ya moto
  choice: kuwaangamiza
  alternative: kuwateketeza
  rationale: ‘Kuwaangamiza’ huhifadhi wazo pana la kuharibu kabisa, huku ‘kuwateketeza’ ikisisitiza zaidi njia ya moto. Muktadha wa moto unaendelea kuifanya taswira hiyo iwe wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa swali na vitenzi umewekwa wa kawaida katika mazungumzo, huku taswira ya hukumu kutoka mbinguni ikihifadhiwa.
