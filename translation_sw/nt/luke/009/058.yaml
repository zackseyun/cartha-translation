id: LUK.9.58
reference: Luke 9:58
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: sw
  text: Yesu akamwambia, “Mbweha wana mashimo[a], na ndege wa angani wana viota[b], lakini Mwana wa Adamu[c] hana mahali pa kulaza kichwa chake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maficho.” Neno la Kigiriki humaanisha mashimo au makao ya wanyama.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kumaanisha “mahali pa kutua” au “makao.”
    reason: lexical_alternative
  - marker: c
    text: “Mwana wa Adamu” ni jina ambalo Yesu hutumia kujitaja, na huenda linarejelea Danieli 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: mbweha
  rationale: Ni jina la kawaida la mnyama huyu katika Kiswahili; hakuna sababu ya kulifanya kuwa neno la jumla zaidi.
- source_word: φωλεοὺς
  choice: mashimo
  rationale: Neno hili humaanisha maficho au makao ya wanyama. “Mashimo” ni la kawaida kwa makao ya mbweha na linahifadhi picha halisi ya chanzo.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: Hutafsiri kwa kawaida maana ya ‘ndege wa mbinguni/angani’ bila kudokeza kwamba hapa οὐρανός lazima imaanishe makao ya Mungu.
- source_word: κατασκηνώσεις
  choice: viota
  rationale: Ingawa neno lina maana pana ya mahali pa kukaa au kutua, katika muktadha wa ndege “viota” ni tafsiri ya kawaida na inayoeleweka wazi.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina ambalo Yesu anatumia kujitaja; namna hii iliyozoeleka inahifadhi usemi wa chanzo na mwangwi wake unaowezekana wa Danieli 7:13–14.
- source_word: οὐκ ἔχει ποῦ
  choice: hana mahali pa
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuwasilisha usemi uliokanushwa wenye maana ya kutokuwa na mahali.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: kulaza kichwa chake
  rationale: Inahifadhi picha halisi ya kuinamisha au kulaza kichwa na pia hudokeza mahali pa kupumzika au kulala.
- source_word: δὲ
  choice: lakini
  rationale: Inaonyesha tofauti kati ya wanyama wenye makao na Mwana wa Adamu asiye na mahali pa kulaza kichwa.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ni simulizi la kawaida na la asili katika Kiswahili, likihifadhi mhusika, kitendo, na anayeelekezewa maneno.
theological_decisions:
- issue: Tafsiri ya jina la Yesu υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: “Mwana wa Adamu” ni usemi unaotambulika katika mapokeo ya Biblia ya Kiswahili na unahifadhi muundo wa jina pamoja na uwezekano wa mwangwi wa Danieli 7:13–14, bila kulifafanua kupita kiasi ndani ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Muundo wa sentensi umefanywa wa kawaida katika simulizi la Kiswahili, huku tofauti na picha kuu za Kigiriki zikihifadhiwa.
