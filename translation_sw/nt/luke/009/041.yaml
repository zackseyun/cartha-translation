  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: sw
  text: Lakini Yesu akajibu, “Enyi kizazi kisicho na imani na kilichopotoka! Nitakuwa pamoja nanyi na kuwavumilia mpaka lini? Mlete mwanao hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: kizazi
  rationale: Ni ulinganifu wa moja kwa moja na wa kawaida kwa kundi la watu wa wakati huo, huku ukihifadhi uzito wa karipio.
- source_word: ἄπιστος
  choice: kisicho na imani
  rationale: Huonyesha ukosefu wa imani kwa uwazi bila kuibana maana kuwa kutokuamini dai fulani pekee.
- source_word: διεστραμμένη
  choice: kilichopotoka
  rationale: Huhifadhi taswira ya kitu kilichogeuzwa au kupotoshwa na pia maana yake ya kimaadili, bila kuongeza maelezo ya kimadhehebu.
- source_word: ἀνέξομαι ὑμῶν
  choice: kuwavumilia
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuendelea kustahimili hali au mwenendo wa watu wanaozungumziwa.
- source_word: προσάγαγε ὧδε
  choice: Mlete ... hapa
  rationale: Amri ya moja kwa moja na ya asili kwa Kiswahili; kiambishi cha yambwa kinamrejelea mwana.
theological_decisions:
- issue: Walengwa wa karipio “kizazi kisicho na imani na kilichopotoka”
  choice: Walengwa hawakubainishwa zaidi ya wingi unaoonekana katika “nanyi.”
  alternative: Kulielekeza karipio kwa wanafunzi pekee, umati pekee, au taifa zima.
  rationale: Kigiriki kinatumia ὑμᾶς kwa wingi lakini aya yenyewe haitaji kwa usahihi kundi linalokusudiwa; tafsiri inadumisha upana huo.
- issue: Mvutano katika swali la Yesu
  choice: 'Kutafsiri kwa swali la moja kwa moja: “Nitakuwa pamoja nanyi na kuwavumilia mpaka lini?”'
  alternative: Kulilegeza kuwa maelezo ya huzuni au uvumilivu bila swali.
  rationale: Huhifadhi karipio, huzuni, na mvutano wa usemi wa Kigiriki bila kueleza kwa ziada sababu au kikomo chake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Enyi” linafaa katika mwito wa karipio kwa kundi, na mpangilio umewekwa wa asili bila kuondoa nguvu ya maneno ya Yesu.
