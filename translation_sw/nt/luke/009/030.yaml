  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: sw
  text: Na tazama, wanaume wawili walikuwa wakizungumza naye; nao walikuwa Musa na Eliya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Linahifadhi kiashiria cha Luka cha kuvuta fikira kwa tukio la ghafla na lenye uhai; ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: ἄνδρες δύο
  choice: wanaume wawili
  rationale: ἀνήρ hapa humaanisha wanaume, na wahusika hao wanatambulishwa wazi kuwa Musa na Eliya.
- source_word: συνελάλουν
  choice: walikuwa wakizungumza
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama ilivyo katika wakati usiotimilifu wa Kigiriki, huku ukisomeka kwa Kiswahili cha sasa.
- source_word: αὐτῷ
  choice: naye
  rationale: Pamoja na συλλαλέω, dative humtaja mtu anayezungumza pamoja na wengine; 'naye' linatoa maana ya mazungumzo ya pande mbili.
- source_word: οἵτινες
  choice: nao
  rationale: Katika muktadha huu kiwakilishi kinawatambulisha wale wanaume wawili. 'Nao walikuwa' ni Kiswahili cha asili na huhifadhi utambulisho wa moja kwa moja bila kuongeza msisitizo usio lazima.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo linalotambulika kwa kawaida la jina la nabii huyo katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa watu wawili katika tukio la kugeuka sura
  choice: Wanaume hao wawili wanatambulishwa moja kwa moja kuwa Musa na Eliya.
  alternative: Kuongeza maelezo kuhusu maana yao ya kiishara au ya nyakati za mwisho.
  rationale: Andiko lenyewe linatoa utambulisho wa moja kwa moja tu; tafsiri haiongezi ufafanuzi wa kiteolojia ambao haupo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. 'Na tazama' huhifadhi nguvu ya kisimulizi ya καὶ ἰδοὺ, huku 'walikuwa wakizungumza naye' ikihifadhi tendo linaloendelea.
