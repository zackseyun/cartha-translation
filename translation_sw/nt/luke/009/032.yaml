id: LUK.9.32
reference: Luke 9:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: sw
  text: Petro na wale waliokuwa pamoja naye walikuwa wamelemewa na usingizi; lakini walipoamka kabisa[a], waliona utukufu wake na wale wanaume wawili waliosimama pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuamka” au “walipokuwa macho kabisa.” Kitenzi cha Kigiriki ni adimu na huenda kinakazia kuwa walifikia hali ya kuwa macho kabisa, badala ya kumaanisha kwamba waliendelea kukesha wakati wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: walikuwa wamelemewa na usingizi
  rationale: Muundo huu hudokeza hali ya kulemewa au kushinikizwa na usingizi, yenye nguvu kuliko kusema tu kwamba walikuwa na usingizi; pia unahifadhi sitiari ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: διαγρηγορήσαντες
  choice: walipoamka kabisa
  rationale: Katika muktadha huu kitenzi hiki adimu kinaelekea kumaanisha kufikia hali ya kuwa macho kabisa baada ya kulemewa na usingizi. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” ni tafsiri ya kawaida ya δόξα na huhifadhi uzito wake wa kibiblia na kitheolojia katika tukio la kugeuka sura.
- source_word: τοὺς δύο ἄνδρας
  choice: wale wanaume wawili
  rationale: ἀνήρ hapa humaanisha watu wawili wazima wa kiume, yaani Musa na Eliya kwa mujibu wa muktadha. “Wale wanaume wawili” ni wazi na ya kawaida.
- source_word: συνεστῶτας αὐτῷ
  choice: waliosimama pamoja naye
  rationale: Kishirikishi hiki kinaonyesha kuwapo au kusimama karibu naye; tafsiri hii huhifadhi taswira inayoonekana katika simulizi.
- source_word: δὲ
  choice: lakini
  rationale: δὲ ya pili inaonyesha utofauti kati ya kulemewa na usingizi na baadaye kuona. δὲ ya kwanza haijahitaji kiunganishi maalumu katika Kiswahili, kwa kuwa mtiririko wa sentensi unaeleweka bila kuongeza neno lisilo la lazima.
theological_decisions:
- issue: Tafsiri ya δόξα katika tukio la kugeuka sura
  choice: utukufu wake
  alternative: fahari yake / mng’ao wake
  rationale: “Utukufu” hudumisha uhusiano mpana wa kibiblia bila kufafanua kupita kiasi hali ya kile walichokiona.
- issue: Maana ya διαγρηγορήσαντες
  choice: walipoamka kabisa
  alternative: baada ya kuamka / wakiwa wameendelea kukesha
  rationale: Chaguo hili linafaa zaidi baada ya maelezo kwamba walikuwa wamelemewa na usingizi, lakini tanbihi huhifadhi utata wa kitenzi hicho adimu badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye heshima. “Walikuwa wamelemewa na usingizi” huhifadhi nguvu ya sitiari ya chanzo; “walipoamka kabisa” ni rahisi kueleweka, huku tanbihi ikihifadhi utata wa kileksika.
