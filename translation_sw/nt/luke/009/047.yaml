  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: sw
  text: Lakini Yesu, akijua mawazo yaliyokuwa mioyoni mwao[a], akamshika mtoto na kumsimamisha kando yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu: “mawazo ya moyo wao.” Kigiriki kina “moyo” katika umoja pamoja na kiwakilishi kinachowahusu watu wengi.'
