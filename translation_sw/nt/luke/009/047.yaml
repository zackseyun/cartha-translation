lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Katika muktadha huu kitenzi kinaonyesha utambuzi wa ndani. “Akijua” ni cha kawaida na hakielezi Yesu alipataje ujuzi huo.
- source_word: διαλογισμὸν
  choice: mawazo
  rationale: Neno linaweza kumaanisha fikira au hoja ya ndani. “Mawazo” ni Kiswahili cha kawaida na linafaa kwa mjadala wa ndani unaotajwa katika muktadha.
- source_word: τῆς καρδίας αὐτῶν
  choice: yaliyokuwa mioyoni mwao
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza mawazo ya ndani. Wingi wa “mioyo” unaafikiana na kiwakilishi cha watu wengi, huku tanbihi ikihifadhi umbo la pekee la Kigiriki.
- source_word: ἐπιλαβόμενος
  choice: akamshika
  rationale: “Akamshika” huhifadhi tendo halisi la kumkamata au kumshika mtoto, bila kutumia usemi mzito usio wa kawaida.
- source_word: παιδίον
  choice: mtoto
  rationale: “Mtoto” ni neno wazi na la kawaida; chanzo hakilazimishi kuongeza “mdogo.”
- source_word: ἔστησεν
  choice: kumsimamisha
  rationale: Kitenzi cha Kigiriki hapa ni cha kusababisha mtu asimame. “Kumsimamisha” huhifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: παρ’ ἑαυτῷ
  choice: kando yake
  rationale: Usemi huu unaonyesha kwamba Yesu alimweka mtoto karibu na upande wake. Kiswahili “kando yake” ni kifupi na cha kawaida.
theological_decisions:
- issue: Ujuzi wa Yesu kuhusu mawazo ya ndani
  choice: Aya inasema kwamba Yesu alijua mawazo yao bila kueleza njia aliyotumia kuyajua.
  alternative: Kueleza wazi kuwa ulikuwa ujuzi wa kiungu usio na mipaka, au utambuzi wa kawaida wa kibinadamu.
  rationale: Chanzo kinathibitisha ujuzi wa Yesu lakini hakifafanui ulitokana na nini; tafsiri haipaswi kuamua jambo hilo kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa “akijua … akamshika … na kumsimamisha” ni wa kawaida katika simulizi, huku picha halisi ya mtoto kusimamishwa ikihifadhiwa.
