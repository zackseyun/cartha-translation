lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuunganisha tendo hili na agizo lililotangulia; “Nao” ni ya kawaida na fasaha katika Kiswahili cha masimulizi.
- source_word: ἐποίησαν οὕτως
  choice: wakafanya hivyo
  rationale: Kirai hiki kinarejelea kutekelezwa kwa agizo la Yesu katika mstari uliotangulia na kuhifadhi maana ya “walifanya kwa namna hiyo.”
- source_word: καὶ
  choice: waka-
  rationale: Kiambishi cha mfululizo “waka-” kinaonyesha tendo linalofuata katika simulizi bila kuongeza uhusiano wa sababu.
- source_word: κατέκλιναν
  choice: wakawaketisha
  rationale: Kitenzi cha Kigiriki kina maana ya kuwafanya watu wakae au waegemee kwa ajili ya kula; “kuwaketisha” ni cha asili katika Kiswahili cha sasa na kinahifadhi maana sababishi.
- source_word: ἅπαντας
  choice: wote
  rationale: Neno hili linasisitiza kuwa hakuna aliyeachwa; “wote” linaonyesha ujumla huo kwa ufupi na kwa kawaida.
