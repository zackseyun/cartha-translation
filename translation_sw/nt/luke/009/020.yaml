id: LUK.9.20
reference: Luke 9:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: sw
  text: Akawaambia, “Lakini ninyi mnasema mimi ni nani?” Petro akajibu, “Masihi wa Mungu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo wa Mungu.”'
    reason: Mbadala wa kileksika unaohifadhi namna ya jadi ya kutaja χριστός.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi hiki kimetajwa wazi na kina mkazo wa kulinganisha wanafunzi na maoni ya wengine; ‘ninyi’ huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: τίνα με λέγετε εἶναι
  choice: mnasema mimi ni nani
  rationale: Hii ni njia ya kawaida na iliyo wazi ya Kiswahili ya kuwasilisha usemi tegemezi wa Kigiriki bila kufuata muundo wake kwa ugumu.
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Muundo wa Kigiriki wenye kishiriki na kitenzi kikuu hutolewa kwa kitenzi kimoja cha kawaida; maana ya kujibu inahifadhiwa.
- source_word: χριστόν
  choice: Masihi
  rationale: Hapa neno hili ni cheo kinachomtambulisha Yesu kama mtiwa-mafuta aliyeahidiwa, si jina la kawaida; ‘Masihi’ linaonyesha kazi yake kama cheo.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi moja kwa moja uhusiano wa kimilikishi unaoonyeshwa na hali ya genitivi katika Kigiriki.
- source_word: δέ
  choice: Lakini
  rationale: Katika swali, kiunganishi kinaonyesha tofauti kati ya jibu la wanafunzi na maoni yaliyotangulia; ‘lakini’ huonyesha tofauti hiyo kwa kawaida. Kiunganishi cha kwanza hakikutafsiriwa kando kwa sababu ‘Akawaambia’ huendeleza simulizi kwa ufasaha.
theological_decisions:
- issue: Tafsiri ya χριστός katika ungamo la Petro
  choice: Masihi
  alternative: Kristo
  rationale: Neno linatumika hapa kama cheo katika matarajio ya Israeli kuhusu mtiwa-mafuta wa Mungu. ‘Masihi’ hutafsiri cheo hicho; ‘Kristo’ imehifadhiwa katika tanbihi kama istilahi mbadala ya jadi bila kulazimisha tofauti ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ninyi’ imeachwa wazi ili kuhifadhi mkazo wa Kigiriki, huku ‘akajibu’ ikiepuka mtindo mzito wa tafsiri ya neno kwa neno.
