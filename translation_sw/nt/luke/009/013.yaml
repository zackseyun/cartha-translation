  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: sw
  text: Lakini akawaambia, “Ninyi[a] wapeni kitu cha kula.” Nao wakasema, “Hatuna zaidi ya mikate mitano na samaki wawili—isipo kuwa labda sisi twende tukanunue chakula kwa ajili ya watu hawa wote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kusisitiza zaidi, “Ninyi wenyewe wapeni kitu cha kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Ninyi wapeni chakula
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida amri ya kuwapa kitu cha kula, huku kiwakilishi cha wazi ὑμεῖς kikihifadhiwa kwa “Ninyi” ili kuonyesha msisitizo.
- source_word: πλεῖον ἢ
  choice: zaidi ya
  rationale: Pamoja na ukanushi “Hatuna,” usemi huu unaonyesha kwamba walichokuwa nacho hakikuzidi idadi iliyotajwa.
- source_word: ἄρτοι πέντε
  choice: mikate mitano
  rationale: ἄρτοι hapa ni mikate inayohesabika; “mikate mitano” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: ἰχθύες δύο
  choice: samaki wawili
  rationale: “Samaki wawili” ni tafsiri ya kawaida ya wingi huu katika muktadha wa viumbe wanaohesabika.
- source_word: εἰ μήτι
  choice: isipokuwa labda
  rationale: “Isipokuwa” huleta wazo la jambo la pekee, na “labda” huhifadhi kidokezo cha uwezekano au pingamizi la balagha kilichopo katika μήτι.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: sisi wenyewe twende tukanunue
  rationale: Kitenzi-shirikishi πορευθέντες kinawekwa kwa Kiswahili cha kawaida kama mfululizo wa vitendo, na ἡμεῖς inaonyeshwa kwa “sisi wenyewe” ili kuhifadhi msisitizo wake.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: watu hawa wote
  rationale: “Watu hawa wote” huhifadhi maana ya jumla ya λαός, kiashirio τοῦτον, na wazo la ujumla katika πάντα bila kuifasiri lazima kuwa “umati.”
- source_word: βρώματα
  choice: chakula
  rationale: Ingawa nomino ya Kigiriki ni wingi, Kiswahili kwa kawaida hutumia nomino ya jumla “chakula” katika muktadha huu.
theological_decisions:
- issue: Msisitizo katika amri ya Yesu na sauti ya jibu la wanafunzi
  choice: Kuhifadhi msisitizo wa ὑμεῖς kwa “Ninyi,” bila kuongeza ukali, kejeli, au lawama.
  alternative: “Ninyi wenyewe wapeni kitu cha kula,” ambalo lingeufanya msisitizo kuwa wazi zaidi lakini lingeweza kusikika nzito kuliko inavyohitajika.
  rationale: Maandishi yana amri ya moja kwa moja na jibu la kivitendo. Tafsiri inahifadhi msisitizo wa kiwakilishi bila kuingiza hisia ambazo Kigiriki hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nao” hudumisha mtiririko wa simulizi; “tikanunue” ni muundo wa kawaida unaounganisha kwenda na kununua. Alama [a] imewekwa baada ya kishazi cha utangulizi kwa kuwa tanbihi inahusu namna ya kutafsiri amri inayofuata.
