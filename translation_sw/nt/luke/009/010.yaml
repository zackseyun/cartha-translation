  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: sw
  text: Mitume waliporudi, walimsimulia mambo yote waliyokuwa wamefanya. Naye akawachukua pamoja naye, akaondoka nao kwa faragha kwenda katika mji unaoitwa Bethsaida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kando.” Kirai hiki kinaonyesha kujitenga na umati, si lazima kuwa peke yao kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: waliporudi
  rationale: Kirai cha wakati kinaonyesha kwamba kurudi kwao kulitangulia kusimulia; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: οἱ ἀπόστολοι
  choice: Mitume
  rationale: Hili ndilo jina la kawaida la kundi lililotumwa na Yesu katika muktadha huu wa Luka.
- source_word: διηγήσαντο αὐτῷ
  choice: walimsimulia
  rationale: Kitenzi kina wazo la kueleza au kutoa habari kwa mpangilio; kiambishi cha yambwa kinamrejelea Yesu kwa kawaida katika Kiswahili.
- source_word: ὅσα ἐποίησαν
  choice: mambo yote waliyokuwa wamefanya
  rationale: ὅσα inajumuisha yote waliyofanya, na wakati wa kitenzi unaonyesha matendo yaliyotangulia kusimulia kwao.
- source_word: παραλαβὼν αὐτούς
  choice: akawachukua pamoja naye
  rationale: Hutoa wazi maana ya kuwachukua wawe waandamani wake, si kuwakamata au kuwaondoa tu.
- source_word: ὑπεχώρησεν
  choice: akaenda nao
  rationale: Katika muktadha huu kitenzi kinaonyesha kuondoka au kujitenga na shughuli ya hadharani; “akaenda nao” ni ya asili, huku “faraghani” ikihifadhi wazo la kujitenga.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Inaonyesha kujitenga na umati au kwenda kwa namna isiyo ya hadharani, bila kudokeza kwamba Yesu alikuwa peke yake, kwa kuwa mitume walikuwa pamoja naye.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: mji unaoitwa Bethsaida
  rationale: πόλις hutaja makazi ya mjini bila kulazimisha ukubwa maalumu; “mji unaoitwa” ni usemi wa kawaida wa Kiswahili.
- source_word: Βηθσαϊδά
  choice: Bethsaida
  rationale: Unukuzi wa kawaida wa jina hili la mahali katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya κατ’ ἰδίαν wakati mitume wanaandamana na Yesu
  choice: faraghani
  alternative: kando; peke yake
  rationale: “Faraghani” huhifadhi wazo la kujitenga na umati bila kuleta mkanganyiko kwamba Yesu alikuwa peke yake kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umetumia mfululizo wa vitenzi vya “aka-” kwa mtiririko wa kawaida.
