  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: sw
  text: Lakini akamwambia[a], “Waache wafu wawazike wafu wao wenyewe; lakini wewe, nenda ukautangaze ufalme wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda neno “wafu” katika matumizi ya kwanza lina maana ya mfano—watu wasioitikia mambo ya kiroho—lakini katika matumizi ya pili linawahusu waliokufa kimwili. Kigiriki kinatumia neno lilelile katika sehemu zote mbili, na tafsiri imehifadhi athari hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Waache
  rationale: Amri hii ni fupi na yenye nguvu, ikimtaka aachane na jukumu alilotaja; ‘waache’ pia inaendana kiasili na kirai kinachofuata katika Kiswahili.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: wafu ... wafu wao wenyewe
  rationale: Kurudiwa kwa ‘wafu’ kunahifadhi fumbo kali la Kigiriki bila kufafanua kimya kimya kuwa matumizi ya kwanza ni ya kiroho na la pili ni ya kimwili.
- source_word: θάψαι
  choice: wawazike
  rationale: Hueleza tendo ambalo wafu wanaachwa walifanye; muundo wa Kiswahili ‘waache ... wawazike’ ni wa kawaida na wazi.
- source_word: ἑαυτῶν
  choice: wao wenyewe
  rationale: ‘Wao wenyewe’ huhifadhi msisitizo wa kiwakilishi jirejezi cha Kigiriki.
- source_word: ἀπελθὼν
  choice: nenda uka-
  rationale: Ingawa ni kitenzi-shirikishi katika Kigiriki, mlolongo wa Kiswahili ‘nenda ukautangaze’ huwasilisha kwa ufasaha kitendo cha kwenda kinachotangulia kutangaza.
- source_word: διάγγελλε
  choice: ukautangaze
  rationale: Huwasilisha tangazo la wazi na linaloenezwa; muundo huu pia unaonyesha mwito wa kwenda mahali pengine na kutoa ujumbe huo.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni usemi wa kibiblia uliozoeleka na unaoeleweka, huku ukihifadhi maana ya utawala wa Mungu katika muktadha.
theological_decisions:
- issue: Maana ya ‘wafu’ katika matumizi ya kwanza na ya pili
  choice: Kuhifadhi neno ‘wafu’ katika sehemu zote mbili bila kuongeza ‘kiroho’ katika matini kuu.
  alternative: Waache waliokufa kiroho wawazike wafu wao wenyewe.
  rationale: Kauli ya Yesu ni ya makusudi yenye ukali na fumbo. Huenda matumizi ya kwanza yanawahusu wasioitikia kiroho na la pili waliokufa kimwili, lakini Kigiriki kinatumia neno lilelile; tafsiri inahifadhi mvutano huo badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘nenda ukautangaze’ ni wa asili na huepuka tafsiri ngumu ya moja kwa moja ya kitenzi-shirikishi.
