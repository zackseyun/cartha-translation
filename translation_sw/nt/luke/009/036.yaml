base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: sw
  text: Sauti hiyo ilipotokea, Yesu alipatikana peke yake.[a] Nao wakanyamaza, na katika siku hizo hawakumwambia mtu yeyote jambo lolote kuhusu yale waliyokuwa wameyaona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu peke yake ndiye aliyebaki,” au “Yesu tu ndiye aliyeonekana.” Kigiriki kinasema kihalisi, “Yesu alipatikana peke yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Sauti hiyo ilipotokea
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha wakati, yaani ‘wakati/sauti ilipotokea.’ ‘Ilipotokea’ ni Kiswahili cha kawaida kinachohifadhi wazo la kutokea kwa sauti bila kuongeza maelezo.
- source_word: φωνή
  choice: sauti
  rationale: Katika muktadha huu neno hilo linamaanisha sauti ya mbinguni iliyosema; ‘sauti’ ndilo neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: εὑρέθη
  choice: alionekana akiwa
  rationale: Ingawa maana ya karibu kabisa ni ‘alipatikana,’ katika simulizi hili ‘alionekana akiwa’ ni ya asili zaidi kwa Kiswahili na inaeleza hali iliyodhihirika baada ya sauti, bila kusema moja kwa moja kwamba wengine walitoweka.
- source_word: μόνος
  choice: peke yake
  rationale: Kauli hii inaonyesha kwamba Yesu ndiye aliyekuwapo peke yake; ‘peke yake’ ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἐσίγησαν
  choice: wakanyamaza
  rationale: Kitenzi hiki kinamaanisha kuwa au kukaa kimya. ‘Wakanyamaza’ kinafaa kwa mfululizo wa matukio ya simulizi na hakiongezi sababu ya ukimya wao.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: hawakumwambia mtu yeyote
  rationale: ἀπαγγέλλω hapa ni kutoa habari au kusimulia. ‘Hawakumwambia mtu yeyote’ ni Kiswahili cha kawaida na huhifadhi ukanushi kamili.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku hizo
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha wakati na inadumisha kutokubainishwa kwa muda hususa.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: jambo lolote kuhusu yale waliyokuwa wameyaona
  rationale: Muundo huu unahifadhi uhusiano kati ya yale yaliyoonekana na jambo ambalo hawakulisimulia. Wakati wa ‘waliyokuwa wameyaona’ unaonyesha kwamba kuona kulitangulia ukimya na kutosimulia.
theological_decisions:
- issue: Maana ya Yesu kuwa peke yake baada ya sauti ya mbinguni
  choice: 'Kutafsiri kwa maelezo ya tukio: ‘Yesu alionekana akiwa peke yake’'
  alternative: ‘Yesu peke yake ndiye aliyebaki’ au ‘walimwona Yesu tu’
  rationale: Kigiriki kinasema kwa namna iliyozuilika kwamba Yesu ‘alipatikana/akaonekana peke yake.’ Tafsiri haipaswi kuamua wazi ikiwa msisitizo ni kubaki kwake au kile wanafunzi walichokiona, wala kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa simulizi umetumia ‘Nao wakanyamaza’ kuendeleza mtiririko wa matukio. Tanbihi inalinda maana halisi na uwezekano wa tafsiri nyingine wa εὑρέθη bila kufanya maandishi makuu yasikike kama tafsiri ngumu.
