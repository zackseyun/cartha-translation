  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: sw
  text: na wengine kwamba Eliya ametokea, na wengine kwamba nabii mmoja wa manabii wa kale amefufuka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: wengine ... wengine
  rationale: Kwa kutegemea muundo wa taarifa unaoendelea kutoka mstari uliotangulia, Kiswahili cha kawaida hutaja makundi ya watoa maoni kwa “wengine ... wengine” badala ya muundo mzito wa “na baadhi ... na wengine.”
- source_word: δὲ ... δὲ
  choice: na ... na
  rationale: Hapa δέ inaongeza maoni mengine katika orodha bila kuonyesha upinzani mkali.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha yaliyomo katika kila taarifa.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyu katika Kiswahili.
- source_word: ἐφάνη
  choice: alikuwa ametokea
  rationale: Kitenzi hiki hapa kina maana ya kuonekana au kujitokeza; kauli timilifu inaonyesha jambo lililodaiwa kuwa limetokea kabla ya taarifa hizi.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: nabii fulani wa zamani
  rationale: “Fulani” huhifadhi hali ya kutotajwa kwa nabii huyo, na “wa zamani” huonyesha kwamba alikuwa wa nyakati za kale bila kulazimisha maana ya “mmoja kati ya.”
- source_word: ἀνέστη
  choice: alikuwa amefufuka
  rationale: Katika muktadha huu kitenzi kinamaanisha kuinuka kutoka kwa wafu; “amefufuka” ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kubadili dai kuwa kauli tendwa.
theological_decisions:
- issue: Asili ya dai kuhusu nabii wa zamani
  choice: alikuwa amefufuka
  alternative: alikuwa amerudi; alikuwa amefufuliwa
  rationale: Tafsiri inadumisha maana ya kuinuka kutoka kwa wafu iliyo katika ἀνέστη, bila kuthibitisha dai la watu wala kutaja mtendaji aliyemfufua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umehifadhiwa kama mwendelezo wa kisarufi wa Luka 9:7; kwa hiyo unaanza kwa “na wengine.”
