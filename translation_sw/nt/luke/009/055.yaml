translation:
  language: sw
  text: Lakini akageuka, akawakemea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za baadaye zinaongeza: “na akasema, ‘Hamjui ninyi ni wa roho ya namna gani; kwa maana Mwana wa Adamu hakuja kuangamiza maisha ya watu, bali kuyaokoa.’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: akageuka
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha Yesu aligeuka kuwaelekea wanafunzi kabla ya kuwakemea; muundo wa mfululizo wenye “aka-” ni wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo na ombi la wanafunzi katika muktadha uliotangulia; “Lakini” linaifanya tofauti hiyo iwe wazi bila kuitia nguvu kupita kiasi.
- source_word: ἐπετίμησεν
  choice: akawakemea
  rationale: Neno hili linamaanisha kukaripia au kusahihisha kwa ukali. “Kukemea” ni la asili katika muktadha huu na linadumisha uzito wa tendo hilo.
- source_word: αὐτοῖς
  choice: -wa- (akawakemea)
  rationale: Kiwakilishi cha wingi kinawarejelea Yakobo na Yohana, au wanafunzi waliozungumziwa katika muktadha. Kiswahili hukionyesha kiasili kwa kiambishi cha yambwa “-wa-” ndani ya kitenzi.
theological_decisions:
- issue: Nyongeza ndefu ya maandishi inayopatikana katika hati fulani za baadaye
  choice: 'Kutafsiri tu maandishi mafupi ya SBLGNT: “Lakini akageuka, akawakemea.”'
  alternative: “Lakini akageuka, akawakemea na kusema, ‘Hamjui ninyi ni wa roho ya namna gani; kwa maana Mwana wa Adamu hakuja kuangamiza maisha ya watu, bali kuyaokoa.’”
  rationale: Maandishi ya chanzo yaliyotolewa yana usomaji mfupi pekee. Nyongeza hiyo haijaingizwa katika andiko kuu, lakini imehifadhiwa katika tanbihi kwa kuwa ni tofauti kubwa na inayojulikana katika mapokeo ya hati na tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye staha. Muundo “akageuka, akawakemea” ni wa kawaida katika simulizi na unaakisi kwa ufupi uhusiano wa kishirikishi na kitenzi kikuu katika Kigiriki.
