base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: sw
  text: Herode, tetrarki, alisikia yote yaliyokuwa yakitendeka, naye alikuwa na shaka kwa sababu baadhi ya watu walikuwa wakisema kwamba Yohana alikuwa amefufuliwa kutoka kwa wafu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana alikuwa amefufuka kutoka kwa wafu.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa; kihalisi, “alikuwa amefufuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: alisikia
  rationale: Kitenzi hiki kinaeleza kupokea habari za matukio; pamoja na kirai kinachofuata, Kiswahili cha kawaida ‘alisikia yote yaliyokuwa yakitendeka’ kinawasilisha maana hiyo bila kulazimika kuongeza ‘habari za’.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno la pekee
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mgawanyo wa sentensi katika Kiswahili unatoa mtiririko wa kawaida bila kuongeza wazo la wakati au upinzani usio wazi katika chanzo.
- source_word: ὁ τετραάρχης
  choice: mtawala wa robo ya nchi
  rationale: Hili linahifadhi maana ya cheo cha kihistoria cha τετραάρχης kwa lugha inayoeleweka, badala ya kukifanya cheo cha jumla kama ‘mfalme’.
- source_word: τὰ γινόμενα πάντα
  choice: yote yaliyokuwa yakitendeka
  rationale: Muundo huu wa kuendelea unaonyesha jumla ya matukio yaliyokuwa yakiendelea kutokea.
- source_word: διηπόρει
  choice: alikuwa amepigwa na bumbuazi
  rationale: Usemi huu unaonyesha hali kubwa ya kutatizika na kutokuwa na uhakika, bila kuifanya kuwa hofu au huzuni tu.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: kwa sababu baadhi ya watu walikuwa wakisema
  rationale: Muundo wa sababu umehifadhiwa wazi. Kiswahili tendaji hapa ni cha kawaida zaidi kuliko muundo ‘ilikuwa ikisemwa na baadhi,’ huku wakala asiyeainishwa kikamilifu akibaki ‘baadhi ya watu’.
- source_word: ἠγέρθη
  choice: alikuwa amefufuliwa
  rationale: Umbo la kutendwa katika Kigiriki limehifadhiwa kwa ‘amefufuliwa,’ na wakati wa kitendo uliotangulia hali ya Herode unaonyeshwa kwa ‘alikuwa ame-’.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili kwa lugha ya ufufuo, huku ukihifadhi wazo la kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Maneno ya ufufuo katika taarifa kuhusu Yohana
  choice: alikuwa amefufuliwa kutoka kwa wafu
  alternative: alikuwa amefufuka kutoka kwa wafu
  rationale: Chanzo kina kitenzi cha kutendwa, kwa hiyo tafsiri kuu inakihifadhi badala ya kukibadili kuwa kitenzi kisicho cha kutendwa. Tanbihi inaonyesha tafsiri nyingine ya kawaida bila kuondoa utofauti huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye staha. Sentensi ndefu ya Kigiriki imegawanywa mara mbili ili iwe rahisi kusomeka. Cheo cha Herode kimefafanuliwa kwa maneno yanayoeleweka badala ya kutumia istilahi ngeni ‘tetrarki.’
