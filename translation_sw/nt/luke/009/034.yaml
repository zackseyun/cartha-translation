base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: sw
  text: Alipokuwa akisema mambo hayo, wingu[b] likatokea na kuanza kuwafunika[a]; nao wakaogopa walipoingia ndani ya wingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wingu likatokea likawafunika.” Kitenzi kinaweza kutafsiriwa kwa urahisi bila kusisitiza kwamba tendo hilo lilianza.
    reason: lexical_alternative
  - marker: b
    text: Huenda wingu hili linakumbusha matukio ya Agano la Kale yanayoonyesha uwepo wa Mungu waziwazi, ingawa aya yenyewe haisemi hivyo moja kwa moja.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Alipokuwa akisema mambo hayo
  rationale: Muundo wa genitivi huru wenye kitenzi-ushiriki cha wakati wa sasa unaonyesha tendo lililokuwa likiendelea wakati huo; “mambo hayo” huhifadhi wingi wa ταῦτα na kurejelea maneno ya Petro yaliyotangulia.
- source_word: ἐγένετο νεφέλη
  choice: wingu likatokea
  rationale: ἐγένετο hapa hutambulisha kutokea au kufika kwa wingu. “Likatokea” ni Kiswahili cha kawaida bila kudai lilitoka wapi.
- source_word: ἐπεσκίαζεν
  choice: kuanza kuwafunika
  rationale: Wakati usiotimilifu unaweza kueleza tendo lililoanza au lililokuwa likiendelea. “Kuwafunika” ni ya kawaida kwa wingu na huhifadhi wazo la kuwagubika, bila kuongeza utambulisho wa wingu.
- source_word: ἐφοβήθησαν
  choice: wakaogopa
  rationale: Huonyesha kuingiwa na hofu katika mwendelezo wa simulizi; “wakaogopa” ni fupi na ya kawaida.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: walipoingia ndani ya wingu
  rationale: Muundo wenye kitenzi-jina hutaja wakati unaoambatana na kuingia kwao; “ndani ya wingu” huhifadhi mwendo wa εἰς kuelekea ndani, si kuwa chini yake tu.
theological_decisions:
- issue: Asili ya wingu na tendo lake
  choice: Kutafsiri kwa maelezo tu kuwa wingu lilitokea na kuanza kuwafunika
  alternative: Kulieleza wazi kuwa wingu hilo ni uwepo au utukufu wa Mungu
  rationale: Muktadha unaweza kukumbusha matukio ya Agano la Kale yanayohusisha uwepo wa Mungu, lakini aya yenyewe haitambulishi wingu moja kwa moja. Tafsiri inahifadhi taswira na mvutano huo bila kuingiza hitimisho la kitheolojia katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. “Kuwafunika” ni rahisi kueleweka kuliko “kuwatia kivuli,” huku “ndani ya wingu” ikihifadhi taswira ya mwendo wa kuingia ndani yake. Alama zote za tanbihi zimewekwa katika matini kuu.
