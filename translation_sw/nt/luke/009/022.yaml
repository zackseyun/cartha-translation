  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: sw
  text: akisema[a], “Ni lazima Mwana wa Adamu ateseke mambo mengi, akataliwe na wazee, wakuu wa makuhani, na waandishi, auawe, na siku ya tatu afufuliwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni lazima Mwana wa Adamu ateseke mambo mengi …”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὼν
  choice: akisema
  rationale: Kitenzi-tegemezi hiki kinatanguliza maneno ya Yesu na kudumisha uhusiano wake na simulizi iliyotangulia.
- source_word: Δεῖ
  choice: Ni lazima
  rationale: Huwasilisha ulazima unaodokeza mpango wa Mungu bila kueleza zaidi chanzo chake.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri ya cheo hiki iliyozoeleka katika Kiswahili na huhifadhi mwangwi wake wa kibiblia.
- source_word: πολλὰ παθεῖν
  choice: ateseke mambo mengi
  rationale: Huhifadhi wingi na upana wa mateso unaoonyeshwa na πολλὰ.
- source_word: ἀποδοκιμασθῆναι
  choice: akataliwe
  rationale: Hueleza kukataliwa rasmi baada ya kuhukumiwa kuwa hafai, huku ikidumisha kauli ya kutendwa.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: na wazee, viongozi wa makuhani na waandishi
  rationale: Katika muundo wa kauli ya kutendwa, ‘na’ hutambulisha wahusika wanaomkataa kwa njia ya kawaida ya Kiswahili.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Huhifadhi jina la kundi rasmi la viongozi wa Kiyahudi.
- source_word: ἀρχιερέων
  choice: viongozi wa makuhani
  rationale: Wingi huu unarejelea tabaka la viongozi wa kikuhani, si lazima makuhani wakuu wengi wenye wadhifa mmoja.
- source_word: γραμματέων
  choice: waandishi
  rationale: Ni istilahi ya moja kwa moja ya kundi hili la wataalamu wa maandiko, bila kuipanua kimafafanuzi kuwa walimu wa sheria.
- source_word: ἀποκτανθῆναι
  choice: auawe
  rationale: Huhifadhi kauli ya kutendwa na kueleza kifo cha kusababishwa na wengine kwa uwazi.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Ni usemi wa kawaida wa Kiswahili kwa dati ya wakati na huhifadhi fomula ya kifungu.
- source_word: ἐγερθῆναι
  choice: afufuliwe
  rationale: Huhifadhi kauli ya kutendwa na kudokeza tendo la Mungu bila kumtaja wazi kama mtendaji.
theological_decisions:
- issue: Kauli ya kutendwa katika kitenzi cha ufufuo
  choice: afufuliwe
  alternative: afufuke
  rationale: Kigiriki kina kitenzi-jina cha kauli ya kutendwa; ‘afufuliwe’ huhifadhi hali hiyo na wazo la tendo la Mungu bila kutaja mtendaji.
- issue: Nguvu ya Δεῖ
  choice: Ni lazima
  alternative: Mwana wa Adamu hana budi
  rationale: ‘Ni lazima’ huhifadhi muundo usiotaja mtendaji na ulazima wa matukio katika mpango wa Mungu bila kufafanua zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vya hali tegemezi huonyesha matukio yote yaliyo chini ya ‘Ni lazima.’ Istilahi za makundi ya uongozi zimehifadhiwa bila kuingiza maelezo ya kimadhehebu.
