id: LUK.9.39
reference: Luke 9:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: sw
  text: Na tazama,[a] roho humshika; ghafla anapiga kelele, nayo humtia degedege huku akitokwa na povu. Haiondoki kwake ila kwa shida, huku ikimponda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho mwovu” au “pepo”; hapa Kigiriki kinasema tu “roho.”
    reason: Usomaji mbadala unaeleza maana inayodokezwa na muktadha bila kuiingiza katika matini kuu.
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linahifadhi msisitizo na uhai wa maelezo ya baba kwa Kiswahili cha kawaida chenye hadhi.
- source_word: πνεῦμα
  choice: roho
  rationale: Kigiriki kinasema tu “roho” bila kivumishi “mwovu” wala nomino “pepo”; tafsiri haiongezi ubainisho unaotokana tu na muktadha.
- source_word: λαμβάνει
  choice: humshika
  rationale: Katika muktadha huu, “humshika” huonyesha nguvu ya ghafla inayomtawala mtu bila kutumia maelezo marefu.
- source_word: ἐξαίφνης κράζει
  choice: ghafla anapiga kelele
  rationale: Huhifadhi hali ya ghafla na kumwacha mvulana kuwa mtendaji wa kitenzi, kama inavyodokezwa na sarufi ya Kigiriki.
- source_word: σπαράσσει αὐτὸν
  choice: humtia degedege
  rationale: Ni usemi wa Kiswahili unaoeleza wazi kutikisika kwa mwili kwa nguvu katika muktadha huu.
- source_word: μετὰ ἀφροῦ
  choice: huku akitokwa na povu
  rationale: Huonyesha kwamba kutokwa na povu kunatokea pamoja na degedege bila kudai kwamba roho yenyewe ndiyo inayotoa povu.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: haiondoki kwake ila kwa shida
  rationale: Huhifadhi wazo la kuondoka kwa taabu au kwa nadra bila kulazimisha tafsiri moja ya kipekee ya μόγις.
- source_word: συντρῖβον αὐτόν
  choice: huku ikimponda
  rationale: Huhifadhi ukali wa tendo la kumdhuru lililo katika kitenzi cha Kigiriki bila kubainisha aina fulani ya jeraha.
theological_decisions:
- issue: Kuitambulisha πνεῦμα waziwazi kuwa pepo katika matini kuu
  choice: roho
  alternative: roho mwovu; pepo
  rationale: Ingawa muktadha mpana unaonyesha kiumbe wa kiroho mwenye uadui, aya hii yenyewe inatumia neno lisilo mahususi πνεῦμα. Matini kuu inadumisha kiwango hicho cha ubainisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Vitenzi vya wakati wa sasa vinadumisha uhai wa simulizi la Kigiriki. Muundo umegawanywa kwa alama za uakifishaji ili usomeke kwa urahisi bila kupoteza mfululizo wa matendo.
