  to: Lakini Herode akasema, “Yohana mimi nilimkata kichwa; lakini huyu ninayesikia mambo hayo kumhusu ni nani?” Naye aliendelea kutafuta kumwona.[a]
  rationale: Revision removes the unsupported addition “nafasi” while preserving the imperfect’s ongoing or repeated force with “aliendelea kutafuta.” It also makes the relative clause more natural in Swahili without adding an identification or inference beyond the Greek text.
