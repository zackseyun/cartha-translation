review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys Herod’s emphatic reference to John, the question concerning the person about whom he hears such things, and the imperfect sense of Herod’s continued effort to see him. However, “nafasi” (‘opportunity/chance’) adds an element not stated by ἐζήτει ἰδεῖν αὐτόν.
  naturalness: The revised wording is idiomatic Standard East African Swahili and retains a direct, restrained narrative register. “Mambo hayo kumhusu” naturally expresses ‘such things about whom.’
  terminology: Herode and Yohana are established Swahili biblical forms. “Kumkata kichwa” accurately retains the specific meaning of ἀπεκεφάλισα without euphemism or added interpretation.
  issues:
  - severity: medium
    issue: “kutafuta nafasi ya kumwona” adds ‘opportunity/chance.’
    rationale: The Greek says only that he was seeking to see him; it does not explicitly state that Herod was seeking an opportunity or occasion. The added noun narrows and expands the sense unnecessarily.
  - severity: low
    issue: “mambo kama haya juu yake” is somewhat less direct and natural than “mambo hayo kumhusu.”
    rationale: τοιαῦτα means ‘such things’; “mambo hayo” preserves this demonstrative sense, while “kumhusu” is an idiomatic rendering of περὶ οὗ in this context.
  revised_text: Lakini Herode akasema, “Yohana mimi nilimkata kichwa; lakini huyu ninayesikia mambo hayo kumhusu ni nani?” Naye aliendelea kutafuta kumwona.[a]
  revised_footnotes:
  - marker: a
    text: Au, “alikuwa akitafuta kumwona.” Wakati usiotimilika wa kitenzi cha Kigiriki unaweza kuonyesha tendo lililokuwa likiendelea au lililorudiwa.
    reason: lexical_alternative
  revision_rationale: Revision removes the unsupported addition “nafasi” while preserving the imperfect’s ongoing or repeated force with “aliendelea kutafuta.” It also makes the relative clause more natural in Swahili without adding an identification or inference beyond the Greek text.
