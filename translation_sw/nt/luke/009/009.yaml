  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: sw
  text: Lakini Herode akasema, “Yohana mimi nilimkata kichwa; lakini huyu ninayesikia mambo hayo kumhusu ni nani?” Naye aliendelea kutafuta kumwona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akitafuta kumwona.” Wakati usiotimilika wa kitenzi cha Kigiriki unaweza kuonyesha tendo lililokuwa likiendelea au lililorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza simulizi huku kikionyesha tofauti ndogo kati ya taarifa iliyotangulia na jibu la Herode.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: Ἰωάννην ἐγὼ
  choice: Yohana, mimi
  rationale: Kiwakilishi cha wazi ἐγώ kimehifadhiwa kwa mkazo wa Herode kwamba yeye ndiye aliyemkata Yohana kichwa.
- source_word: ἀπεκεφάλισα
  choice: nilimkata kichwa
  rationale: Kitenzi kinamaanisha hasa kuua kwa kukata kichwa; wakati uliopita rahisi unalingana vizuri na aoristi bila kuongeza ufafanuzi wa wakati.
- source_word: τίς δέ ἐστιν οὗτος
  choice: lakini huyu ... ni nani?
  rationale: Muundo huu unahifadhi swali la moja kwa moja na sauti ya Herode ya kutomfahamu mtu anayezungumziwa, bila kuongeza neno lisilokuwapo kama ‘mtu’.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: ninayesikia mambo kama haya juu yake
  rationale: Tafsiri hii inaacha ‘mambo kama haya’ kuwa kauli pana kama ilivyo katika Kigiriki, badala ya kuifasiri moja kwa moja kuwa taarifa fulani.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: aliendelea kutafuta nafasi ya kumwona
  rationale: Wakati usiotimilika unaonyesha tendo lenye kuendelea, na usemi huu wa kawaida wa Kiswahili unaeleza jitihada endelevu za Herode za kumwona Yesu.
theological_decisions:
- issue: Kauli ya Herode kuhusu Yohana na swali lake kuhusu Yesu
  choice: Kauli na swali zimetafsiriwa moja kwa moja bila kutaja hofu au dhana kwamba Yohana amefufuka.
  alternative: Kufafanua kwamba Herode alihofia au alidhani Yesu alikuwa Yohana aliyefufuka.
  rationale: Muktadha uliotangulia unaonyesha mkanganyiko wa Herode, lakini mstari huu wenyewe unasema tu kwamba alimkata Yohana kichwa na anauliza mtu anayesikia habari zake ni nani. Tafsiri haiongezi hitimisho la kiteolojia au la kisimulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa uwe wa kawaida kwa msomaji wa leo huku mkazo wa ‘mimi’ na hali ya tendo linaloendelea vikihifadhiwa.
