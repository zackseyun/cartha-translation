  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: sw
  text: Lakini akawakemea na kuwaamuru wasimwambie mtu yeyote jambo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini akawaonya kwa ukali na kuwaagiza wasimwambie mtu yeyote jambo hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: akawakemea
  rationale: Kitenzi ἐπιτιμάω kinaweza kumaanisha kukemea au kuonya kwa ukali. “Akawakemea” kinahifadhi uzito na ukali wa neno, huku mbadala ukiwekwa katika tanbihi kwa sababu muktadha unaweza pia kueleweka kama onyo kali.
- source_word: παρήγγειλεν
  choice: kuwaamuru
  rationale: παραγγέλλω hapa ni kutoa agizo lenye mamlaka; “kuwaamuru” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: μηδενὶ
  choice: mtu yeyote
  rationale: Pamoja na ukanushi wa “wasimwambie,” neno hili linaeleza kwamba habari hiyo isielezwe kwa mtu hata mmoja.
- source_word: λέγειν
  choice: wasimwambie
  rationale: Katika muundo wenye mtu anayepokea ujumbe na τοῦτο kama yaliyosemwa, “kumwambia” ni ya asili zaidi kwa Kiswahili kuliko tafsiri finyu ya “kusema.”
- source_word: τοῦτο
  choice: jambo hilo
  rationale: Kiwakilishi hiki kinaelekeza nyuma kwenye ungamo la Petro. “Jambo hilo” huhifadhi urejeo bila kuufafanua kupita maandishi.
- source_word: δὲ
  choice: Lakini
  rationale: δέ inaonyesha tofauti nyepesi kati ya ungamo lililotangulia na jibu la Yesu; “Lakini” huonyesha tofauti hiyo kwa uwazi.
theological_decisions:
- issue: Nguvu ya katazo la Yesu baada ya ungamo la Petro
  choice: Katazo kali la kutomfunulia mtu yeyote jambo hilo katika hatua hii ya simulizi
  alternative: Onyo la upole zaidi la kutolitaja jambo hilo
  rationale: Muunganiko wa ἐπιτιμήσας na παρήγγειλεν unaonyesha zaidi ya ombi la kawaida. Tafsiri inadumisha mvutano wa simulizi bila kuingiza nadharia ya kitheolojia isiyotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawakemea” na “kuwaamuru” vinahifadhi ukali wa kauli ya Kigiriki; tanbihi inadumisha uwezekano halisi wa kutafsiri ἐπιτιμήσας kuwa onyo kali.
