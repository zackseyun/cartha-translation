  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: sw
  text: Kwa maana, mtu atafaidika nini akiupata ulimwengu wote, lakini akipoteza yeye mwenyewe au akipata hasara? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “nafsi yake” au “maisha yake.” Kigiriki: “yeye mwenyewe.” Andiko linatumia kiwakilishi rejeshi, wala si neno la kawaida linalomaanisha “nafsi” au “maisha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Kwa maana, mtu atafaidika nini
  rationale: Huhifadhi swali la balagha na nguvu ya γὰρ ya kutoa msingi wa kauli iliyotangulia; “atafaidika nini” ni Kiswahili cha kawaida kinachoeleza manufaa au faida.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu ἄνθρωπος humwakilisha mwanadamu yeyote; “mtu” ni sawa kisemantiki na ni ya kawaida katika Kiswahili bila kupunguza upeo wa rejeo.
- source_word: κερδήσας
  choice: akiupata
  rationale: Muundo wa “aki-” unaonyesha hali ya kudhaniwa katika swali; “kuupata” huwasilisha kupata kitu kama faida bila kurudia neno “faida” kwa namna isiyo ya kawaida.
- source_word: τὸν κόσμον ὅλον
  choice: ulimwengu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai hiki, ikionyesha jumla ya yale ambayo mtu angeweza kujipatia duniani.
- source_word: ἑαυτόν
  choice: nafsi yake
  rationale: Katika Kiswahili, “nafsi yake” inaweza kumaanisha mtu mwenyewe, si lazima sehemu isiyo ya mwili pekee; tanbihi inahifadhi ukweli kwamba Kigiriki kimetumia kiwakilishi rejeshi chenye maana halisi ya “mwenyewe.”
- source_word: ἀπολέσας
  choice: akajipoteza
  rationale: Huhifadhi wazo la kupoteza mtu mwenyewe na muundo tendaji wa kitenzi.
- source_word: ἢ ζημιωθείς
  choice: au akapata hasara katika nafsi yake
  rationale: “Au” huhifadhi utenganishi wa ἢ, na kirai hiki huonyesha hali tendwa ya kupata hasara bila kukifanya kitenzi kuwa sawa kabisa na “kujipoteza.”
theological_decisions:
- issue: Maana ya ἑαυτόν kuhusu hatima ya mwanadamu
  choice: nafsi yake, ikifafanuliwa kuwa ‘yeye mwenyewe’
  alternative: roho yake; maisha yake
  rationale: Kigiriki kina kiwakilishi rejeshi ἑαυτόν, wala si ψυχή. Tafsiri na tanbihi huepuka kuifunga maana katika fundisho kuhusu roho isiyo ya mwili au maisha ya sasa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, huku tofauti kati ya kupoteza na kupata hasara ikibaki wazi.
