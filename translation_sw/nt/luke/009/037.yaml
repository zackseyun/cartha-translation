  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: sw
  text: Siku iliyofuata[a], walipokwisha shuka kutoka mlimani, umati mkubwa ulikutana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku inayofuata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Hapa ni mpito wa kawaida wa simulizi. Kiswahili kinaweza kuendeleza simulizi kwa kawaida bila kuongeza “ikawa” au “basi,” ambazo zingefanya usemi kuwa mzito au kuongeza msisitizo usiokusudiwa.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Siku iliyofuata
  rationale: Kirai hiki cha wakati kinamaanisha siku inayofuata. Tafsiri hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: κατελθόντων αὐτῶν
  choice: walipokuwa wameshuka
  rationale: Muundo huu unatoa mazingira ya tendo kuu na unaonyesha kuwa kushuka kwao kulikuwa kumetimia wakati umati ulipokutana naye.
- source_word: ἀπὸ τοῦ ὄρους
  choice: kutoka mlimani
  rationale: ὄρος hapa inafaa kutafsiriwa “mlima”; muundo wa mahali “mlimani” ni wa kawaida katika Kiswahili.
- source_word: συνήντησεν αὐτῷ
  choice: ulikutana naye
  rationale: Huhifadhi maana ya moja kwa moja ya kukutana naye bila kuongeza wazi kusudi la kwenda kumpokea, ambalo ingawa linawezekana kileksika halijaelezwa kwa lazima hapa.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: “Umati” huwakilisha kundi kubwa la watu, na “mkubwa” huhifadhi nguvu ya πολύς kwa Kiswahili cha kawaida na chenye hadhi.
