  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: sw
  text: Lakini hawakuelewa usemi huo[a], nao ulikuwa umefichwa kwao ili wasiutambue[b]; nao waliogopa kumuuliza kuhusu usemi huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno,” “kauli,” au “jambo” kwa neno la Kigiriki ῥῆμα.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki husema kwamba usemi huo “ulikuwa umefichwa kutoka kwao,” bila kutaja ni nani aliyeuficha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: hawakuelewa
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba wanafunzi hawakufahamu maana ya maneno ya Yesu, si kwamba hawakuwa na taarifa tu.
- source_word: ῥῆμα
  choice: usemi
  rationale: Hurejelea jambo maalumu ambalo Yesu alikuwa amesema. “Usemi” ni Kiswahili cha kawaida kinachodumisha wazo la maneno yaliyotamkwa; tanbihi inaonyesha maana nyingine zinazowezekana.
- source_word: παρακεκαλυμμένον
  choice: ulikuwa umefichwa
  rationale: Muundo huu unaonyesha hali iliyotokana na kufichwa. Tafsiri ya kauli tendwa haimtaji aliyeficha, kama ilivyo katika Kigiriki.
- source_word: ἀπ’ αὐτῶν
  choice: kwao
  rationale: Katika Kiswahili, “umefichwa kwao” huwasilisha kwa kawaida kwamba jambo hilo lilikataliwa kufikiwa au kutambuliwa nao, bila kutumia muundo mzito wa “kutoka kwao.”
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: ili wasiutambue
  rationale: “Kutambua” hudumisha tofauti kwa kiasi na “kuelewa” iliyotumika kwa ἠγνόουν na kueleza kutoliona au kutolipata jambo kwa ufahamu.
- source_word: ἐφοβοῦντο
  choice: waliogopa
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha hali yao ya hofu.
- source_word: ἐρωτῆσαι
  choice: kumuuliza
  rationale: Katika muktadha huu ni kumwuliza Yesu ili kupata ufafanuzi; “kumuuliza” ni ya kawaida na wazi.
theological_decisions:
- issue: Mtendaji wa kufichwa kwa usemi
  choice: Kauli tendwa “ulikuwa umefichwa kwao” imedumishwa bila kumtaja aliyeficha.
  alternative: Kutaja wazi kwamba Mungu aliuficha, au kusema tu kwamba usemi haukuwa wazi kwao.
  rationale: Kigiriki hakimtaji mtendaji. Kutomtaja kunahifadhi utata na mvutano wa kiteolojia wa kifungu bila kuingiza hitimisho lisilotolewa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kauli tendwa umehifadhiwa ili kutoongeza mtendaji ambaye matini haimtaji.
