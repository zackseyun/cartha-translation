id: LUK.9.59
reference: Luke 9:59
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: sw
  text: Kisha akamwambia mtu mwingine, “Nifuate.” Lakini mtu huyo akasema, “Bwana, niruhusu niende kwanza nikamzike baba yangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: mtu mwingine
  rationale: Neno hili humaanisha mwingine aliye tofauti na waliotajwa; kuongeza “mtu” kunafanya Kiswahili kiwe wazi na cha kawaida bila kubainisha zaidi ya maandishi.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kutoa amri ya kumfuata mtu kwa Kiswahili; haiingizi maana ya ziada kuhusu muda wa tendo.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya heshima na pia uzito unaoweza kuwa wa kiteolojia katika kumwita Yesu, bila kuamua upande mmoja tu wa maana hizo.
- source_word: ἐπίτρεψόν μοι
  choice: niruhusu
  rationale: Kitenzi hiki ni ombi la kupewa ruhusa; “niruhusu” ni cha asili, wazi, na chenye heshima katika Kiswahili cha sasa.
- source_word: ἀπελθόντι πρῶτον
  choice: niende kwanza
  rationale: Tafsiri hii inaonyesha kwamba kwenda kunatangulia tendo la kumzika baba, huku ikibaki ya kawaida katika Kiswahili.
- source_word: θάψαι τὸν πατέρα μου
  choice: nikamzike baba yangu
  rationale: “Nikamzike” kwa kawaida huonyesha kwenda kisha kutekeleza kusudi hilo, na hivyo kuwasilisha vizuri uhusiano wa kwenda na kumzika baba.
theological_decisions:
- issue: Maana ya κύριος anapotumiwa kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa; Mwalimu
  rationale: “Bwana” hudumisha kwa pamoja heshima ya msemaji na uwezekano wa maana pana ya jina hilo katika simulizi la Luka; “Mheshimiwa” angepunguza uzito wa kiteolojia, na “Mwalimu” si maana ya moja kwa moja ya κύριος.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Mtu huyo” huepusha marudio yasiyo wazi ya kiwakilishi pekee. Hakuna tanbihi iliyowekwa kwa sababu mbadala wa Kiingereza uliotolewa unaonyesha tofauti ya mpangilio wa maneno ambayo Kiswahili cha asili hakiwezi kuibainisha kwa manufaa bila kuunda tofauti ya maana; alama yake pia haikulingana na mahali pa mbadala huo.
