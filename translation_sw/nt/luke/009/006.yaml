  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: sw
  text: Basi wakaondoka, wakasafiri kutoka kijiji kimoja hadi kingine[a], wakitangaza habari njema[b] na wakiponya kila mahali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapita katika vijiji.” Usemi wa Kigiriki unaweza kusisitiza mwendo wao katika vijiji kimoja baada ya kingine.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakihubiri Injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: wakaondoka
  rationale: Kirai shiriki hiki kinaanzisha hatua iliyofuata baada ya kutumwa kwao; “wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuondoka na kuanza safari.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi na kuonyesha hatua inayotokana na agizo lililotangulia; “Basi” huleta mtiririko huo kwa kawaida.
- source_word: διήρχοντο
  choice: wakapita
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha mwendo ulioendelea katika maeneo mbalimbali; pamoja na kirai kinachofuata, “wakapita” huwasilisha kusafiri kwao kutoka sehemu moja hadi nyingine.
- source_word: κατὰ τὰς κώμας
  choice: kijiji kimoja baada ya kingine
  rationale: κατά pamoja na hali ya kushutumiwa ina maana ya mgawanyo hapa, yaani mwendo baina ya vijiji mbalimbali. Tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: εὐαγγελιζόμενοι
  choice: wakitangaza habari njema
  rationale: Kirai hiki kinaonyesha kutangaza ujumbe mwema. “Habari njema” ni wazi kwa wasomaji wa kawaida bila kulazimisha istilahi ya kikanisa.
- source_word: θεραπεύοντες
  choice: kuponya watu
  rationale: Katika muktadha huu kitenzi kinahusu kuwaponya wagonjwa. Kiongezi “watu” kinafanya Kiswahili kiwe cha kawaida bila kubadili mhusika anayelengwa na tendo.
- source_word: πανταχοῦ
  choice: kila mahali
  rationale: Kielezi hiki kinasisitiza kwamba huduma yao ilifanyika katika kila sehemu walikokwenda; “kila mahali” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya εὐαγγελιζόμενοι katika utume wa wanafunzi
  choice: wakitangaza habari njema
  alternative: wakihubiri Injili
  rationale: Tafsiri iliyochaguliwa inahifadhi tendo la kutangaza ujumbe mwema bila kuingiza maana ya kiistilahi iliyositawi baadaye kuliko inavyodaiwa na mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida, lugha ya sasa na yenye heshima. Mpangilio wa alama za tanbihi umefuata mahali pa maneno yanayofafanuliwa.
