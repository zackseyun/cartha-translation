  text: Nao hawakumpokea[a], kwa sababu uso wake ulikuwa ukielekea Yerusalemu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumkaribisha.” Kitenzi kinaweza kumaanisha kupokea, kukaribisha, au kukubali; hapa yaelekea kinamaanisha kukataa kumpokea kwa ukarimu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno, “uso wake ulikuwa ukienda kuelekea Yerusalemu.” Huu ni usemi unaoweza kuonyesha mwelekeo thabiti au azimio la kwenda huko.
