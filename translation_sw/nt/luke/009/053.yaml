lexical_decisions:
- source_word: ἐδέξαντο
  choice: hawakumkaribisha
  rationale: Katika muktadha huu wa safari, δέχομαι inaelekea kumaanisha kumpokea kwa ukarimu; “hawakumkaribisha” ni Kiswahili cha kawaida kinachoonyesha kukataa kumpokea bila kulazimisha wazo la malazi pekee.
- source_word: τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον
  choice: alikuwa akielekea
  rationale: Kwa neno ni “uso wake ulikuwa ukienda,” lakini huu ni usemi wenye maana ya kwamba yeye alikuwa ameelekeza safari yake upande fulani. Tafsiri hii ni ya asili katika Kiswahili na bado inadumisha mwelekeo wa safari bila kuongeza wazi wazo la azimio ambalo halijasemwa moja kwa moja katika kirai hiki.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Pamoja na kitenzi “kuelekea,” jina la mahali linaonyesha kwa kawaida kikomo na mwelekeo wa safari; hakuna haja ya kuongeza kihusishi kingine.
- source_word: ὅτι
  choice: kwa sababu
  rationale: ὅτι hapa inatoa sababu ya wao kutomkaribisha; “kwa sababu” ni kiunganishi wazi na cha kawaida.
theological_decisions:
- issue: Nguvu ya usemi “uso wake ulikuwa ukienda Yerusalemu”
  choice: Kutafsiri maana yake kwa “alikuwa akielekea Yerusalemu,” huku usemi halisi ukihifadhiwa katika tanbihi.
  alternative: “Uso wake ulikuwa ukielekea Yerusalemu” au “alikuwa ameazimia kwenda Yerusalemu.”
  rationale: Usemi huo unaonyesha mwelekeo wake kwenda Yerusalemu, lakini “ameazimia” unaweza kueleza kwa nguvu zaidi kuliko maneno ya aya hii yenyewe, nayo tafsiri ya neno kwa neno kuhusu uso si ya asili katika Kiswahili. Tanbihi huhifadhi taswira na uwezekano wa maana ya dhamira thabiti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Lakini” linafaa kwa mtiririko wa simulizi wa aya hii kuliko “na,” na “alikuwa akielekea” ni ya kawaida zaidi kuliko kuhamisha moja kwa moja usemi wa Kiyunani kuhusu uso.
