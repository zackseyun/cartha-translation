translation:
  language: sw
  text: Nao wakaenda katika kijiji kingine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijiji tofauti.” Kivumishi cha Kigiriki kinaweza kusisitiza utofauti, si tu kwamba ni kijiji kingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi mwendelezo rahisi wa simulizi bila kuongeza wazi maana ya wakati ambayo haimo katika Kigiriki.
- source_word: ἐπορεύθησαν
  choice: wakaenda
  rationale: Kitenzi πορεύομαι hapa kina maana ya kwenda au kusafiri; “wakaenda” ni Kiswahili cha kawaida na kinafaa kwa mwendo wa simulizi.
- source_word: εἰς
  choice: katika
  rationale: Pamoja na kitenzi cha mwendo, εἰς huonyesha mahali wanakoelekea; “katika kijiji” ni usemi wa asili unaoonyesha kuingia au kuelekea mahali hapo.
- source_word: ἑτέραν
  choice: kingine
  rationale: ἕτερος inaweza kumaanisha kingine au tofauti; “kingine” ni ya kawaida huku dokezo la chini likihifadhi uwezekano wa msisitizo wa utofauti.
- source_word: κώμην
  choice: kijiji
  rationale: κώμη hurejelea makazi madogo ya kijijini, si mji mkubwa; “kijiji” ndiyo tafsiri sahihi na ya kawaida.
