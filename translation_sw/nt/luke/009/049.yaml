base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: sw
  text: Yohana akajibu, “Bwana, tulimwona mtu akitoa pepo kwa jina lako, nasi tulijaribu kumzuia kwa sababu hafuatani nasi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu hatufuati sisi.” Kigiriki kinasema kihalisi “pamoja nasi,” jambo ambalo huenda likasisitiza kwamba mtu huyo hakuwa katika kundi la wanafunzi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Yohana akajibu
  rationale: Muundo huu ni mpito wa kawaida wa simulizi. Kiswahili cha ‘Yohana akajibu’ kinaendeleza mtiririko wa habari kwa kawaida bila kulazimisha δέ kuwa ‘lakini,’ ilhali muktadha hauonyeshi tofauti kali.
- source_word: Ἐπιστάτα
  choice: Bwana
  rationale: Katika Luka, hili ni jina la kumwita Yesu linalotambua mamlaka na uongozi wake. ‘Bwana’ ni mwito wa kawaida na wenye heshima katika Kiswahili; ‘Mwalimu’ ungeelekeza zaidi kwenye kazi ya kufundisha, na ‘Mkuu’ haisikiki kawaida hapa.
- source_word: εἴδομέν τινα
  choice: tulimwona mtu
  rationale: τινα humtaja mtu bila kumtambua kwa jina. ‘Mtu’ ni usemi wa kawaida wa Kiswahili na haulingizi maelezo yasiyokuwapo katika chanzo.
- source_word: ἐν τῷ ὀνόματί σου
  choice: kwa jina lako
  rationale: Usemi huu unaonyesha kutenda kwa kutegemea jina au mamlaka ya Yesu. ‘Kwa jina lako’ ni usemi wa kawaida wa Kiswahili unaobakiza uzito wa maana hiyo.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: akitoa pepo
  rationale: ‘Kutoa pepo’ ni usemi wa kawaida na unaoeleweka kwa tendo la kuwafukuza pepo kutoka kwa watu. Kiswahili hakihitaji kurudia neno linalolingana na ‘nje’ ili kutoa maana ya ἐκβάλλω katika muktadha huu.
- source_word: ἐκωλύομεν αὐτόν
  choice: tulijaribu kumzuia
  rationale: Wakati usiotimilika wa Kigiriki unaweza kuonyesha jaribio au tendo lililokuwa likiendelea. ‘Tulijaribu kumzuia’ unabaki wazi kwamba wanafunzi walifanya jitihada za kumkomesha bila kudai kwamba walifanikiwa.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: kwa sababu hafuati pamoja nasi
  rationale: Neno μετά lina maana ya ‘pamoja na,’ si tu kwamba mtu huyo hawafuati wanafunzi kama viongozi wake. Tafsiri hii inabakiza kitenzi cha ‘kufuata’ na pia wazo la kutokuwa katika kundi lao, ingawa muundo wake si wa kawaida kabisa katika Kiswahili.
theological_decisions:
- issue: Utata kuhusu mtu huyo alikuwa akimfuata nani na uhusiano wake na kundi la wanafunzi
  choice: hafuati pamoja nasi
  alternative: hatufuati
  rationale: Chanzo kinasema kihalisi ‘hafuati pamoja nasi.’ Tafsiri iliyochaguliwa haidai kwamba mtu huyo alimkataa Yesu; malalamiko ya Yohana yanaweza kulenga kutoshirikiana kwake na kundi la wanafunzi. Tanbihi inaonyesha uwezekano mwingine bila kuondoa mvutano huo wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi ni wa simulizi la kawaida; ‘hafuati pamoja nasi’ umehifadhiwa kwa makusudi ili kutunza upekee na utata wa usemi wa Kigiriki.
