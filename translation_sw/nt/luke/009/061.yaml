id: LUK.9.61
reference: Luke 9:61
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: sw
  text: Mtu mwingine pia akasema, “Nitakufuata, Bwana, lakini kwanza niruhusu niwaage watu wa nyumbani kwangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: mtu mwingine
  rationale: Humtambulisha mtu wa ziada aliye tofauti na wasemaji waliotangulia; Kiswahili huhitaji nomino ‘mtu’ ili usemi uwe wazi na wa kawaida.
- source_word: Ἀκολουθήσω
  choice: nitakufuata
  rationale: Wakati ujao unaeleza nia ya msemaji, na umbo lenye kiambishi cha yambwa ni la kawaida katika Kiswahili.
- source_word: κύριε
  choice: Bwana
  rationale: Huhifadhi heshima ya kumwita Yesu na uzito wa kitheolojia unaowezekana bila kuufanya usemi kuwa ‘bwana’ kwa maana ya heshima ya kawaida tu au ‘Mwalimu.’
- source_word: πρῶτον
  choice: kwanza
  rationale: Huonyesha wazi jambo analotaka litangulie kabla ya kumfuata Yesu.
- source_word: ἐπίτρεψόν μοι
  choice: niruhusu
  rationale: Ni ombi la ruhusa; ‘niruhusu’ ni la asili, wazi, na lenye heshima katika Kiswahili cha sasa.
- source_word: ἀποτάξασθαι
  choice: niwaage
  rationale: Katika muktadha huu kitenzi humaanisha kuagana na watu; ‘niwaage’ ni kifupi na cha kawaida bila kudokeza kupanga mali au shughuli.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: watu wa nyumbani kwangu
  rationale: Kirai cha Kigiriki kinawalenga watu walio nyumbani au wanaohusiana na nyumba ya msemaji. Tafsiri hii ni ya asili na haibani maana kwa wale waliomo ndani ya jengo wakati huo pekee.
- source_word: δὲ καὶ
  choice: pia akasema
  rationale: ‘Pia’ huhifadhi nguvu ya kuongeza mfano mwingine, huku mtiririko wa simulizi ukiwa wa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya κύριε anaposemewa Yesu
  choice: Bwana
  alternative: bwana; Mwalimu
  rationale: ‘Bwana’ huhifadhi uwezekano wa kuwa cheo cha heshima na pia uzito mpana wa kitheolojia katika Luka, bila kuamua kimya-kimya kwamba ni heshima ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mtu mwingine pia’ ni wazi na cha kawaida; ‘watu wa nyumbani kwangu’ huwasilisha maana ya watu wa nyumbani bila kudai kwamba wote ni jamaa au kwamba walikuwa ndani ya jengo wakati huo.
