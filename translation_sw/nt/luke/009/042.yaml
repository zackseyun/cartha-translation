  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: sw
  text: Lakini alipokuwa bado akikaribia, yule pepo alimwangusha chini na kumtia degedege. Yesu akamkemea yule roho mchafu, akamponya mtoto huyo, kisha akamrudisha kwa baba yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamkabidhi tena kwa baba yake.”
    reason: ἀποδίδωμι inaweza kusisitiza ama kumrejesha mtu ama kumkabidhi tena kwa mwenye wajibu juu yake.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Lakini alipokuwa bado akikaribia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huohuo; ‘bado’ inawakilisha ἔτι, na ‘lakini’ ni kiunganishi chepesi cha simulizi kwa δέ bila kutia ukinzani mkali.
- source_word: τὸ δαιμόνιον
  choice: yule pepo
  rationale: ‘Pepo’ ni neno la kawaida katika Kiswahili cha Biblia kwa kiumbe mwovu wa kiroho; ‘yule’ humrejelea pepo aliyetajwa katika muktadha.
- source_word: ἔρρηξεν αὐτὸν
  choice: alimwangusha chini
  rationale: Huwasilisha kitendo cha ghafla na cha nguvu cha kumtupa mvulana chini bila kutumia tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
- source_word: συνεσπάραξεν
  choice: kumtia degedege
  rationale: Kitenzi kinaeleza mikazo mikali ya mwili. Kauli hii ni ya kawaida na inaeleweka, bila kutangaza utambuzi wa kudumu wa kitabibu.
- source_word: ἐπετίμησεν
  choice: akamkemea
  rationale: ‘Kukemea’ huhifadhi wazo la Yesu kusema kwa mamlaka dhidi ya roho huyo.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: yule roho mchafu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi lugha ya uchafu wa kiroho na pia tofauti ya usemi kati ya δαιμόνιον na πνεῦμα ἀκάθαρτον.
- source_word: ἰάσατο τὸν παῖδα
  choice: akamponya mtoto huyo
  rationale: ‘Akamponya’ ni sawa la kawaida la ἰάσατο, na ‘mtoto huyo’ huhifadhi upana wa παῖς bila kulazimisha umri maalumu zaidi ya muktadha.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: akamrudisha kwa baba yake
  rationale: Hutoa maana ya kumrejesha mtoto kwa baba yake kwa Kiswahili cha kawaida; uwezekano wa maana halisi zaidi ya ‘kumkabidhi tena’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Lugha ya mateso yanayosababishwa na pepo
  choice: 'Kutafsiri δαιμόνιον na πνεῦμα ἀκάθαρτον kama kiumbe binafsi cha kiroho: ‘pepo’ na ‘roho mchafu.’'
  alternative: Kutumia lugha isiyo binafsi kama ‘nguvu mbaya’ au kuitafsiri hali hiyo kama ugonjwa wa kawaida tu.
  rationale: Nakala ya Kigiriki humwonyesha mtendaji binafsi wa kiroho ambaye Yesu anamkemea. Wakati huohuo, kauli kwamba Yesu alimponya mtoto imehifadhiwa, hivyo vipengele vyote viwili—kukombolewa na kuponywa—vinabaki bila kimoja kufuta kingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kisimulizi na inaeleweka kwa msomaji wa kawaida. ‘Degedege’ limetumiwa kueleza mikazo mikali ya mwili katika tukio hili, si kuweka utambuzi wa kudumu wa kitabibu.
