base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: sw
  text: Na tazama, mwanaume mmoja kutoka katika umati akaita kwa sauti kubwa akisema, “Mwalimu, nakuomba umwangalie mwanangu, kwa sababu ndiye mtoto wangu wa pekee.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wangu wa pekee.” Kigiriki husema kihalisi, “ndiye wa pekee kwangu”; kwa kuwa tayari ametajwa kuwa mwana, tafsiri zote mbili zinawezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi kazi ya neno hili ya kuvuta usikivu katika simulizi la Luka kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀνὴρ
  choice: mtu mmoja
  rationale: Katika muktadha huu mtu huyo anatambulishwa baadaye kama baba kupitia ‘mwanangu’; ‘mtu mmoja’ ni ya asili katika simulizi la Kiswahili bila kufuta taarifa ya kimuktadha.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: kutoka katika umati
  rationale: Inaonyesha kwamba mtu huyo alikuwa mmoja wa watu waliokusanyika na sauti yake ilitoka miongoni mwao.
- source_word: ἐβόησεν
  choice: akapaza sauti
  rationale: Inaeleza mwito wa sauti kubwa na wa haraka bila kuongeza wazo lisilokuwapo katika Kigiriki.
- source_word: λέγων
  choice: akisema
  rationale: Inahifadhi muunganiko wa kishiriki katika mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hii ndiyo maana ya moja kwa moja ya Διδάσκαλος na haiongezi dhana ya mamlaka inayoweza kudokezwa na ‘Bwana’.
- source_word: δέομαί σου
  choice: nakuomba
  rationale: Katika muktadha wa baba mwenye dhiki, ‘nakuomba’ hubeba ombi la dhati; hali ya haraka pia inaonekana katika kupaza sauti.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: umwangalie
  rationale: Hapa si kutazama kwa macho tu bali kumpa uangalifu; ‘umwangalie’ ni ya asili na inaweza kubeba maana hiyo pana.
- source_word: τὸν υἱόν μου
  choice: mwanangu
  rationale: ‘Mwanangu’ katika matumizi haya kwa kawaida humaanisha mwana wa kiume na ni tafsiri ya asili ya υἱόν μου.
- source_word: μονογενής
  choice: mtoto wangu wa pekee
  rationale: Neno linaonyesha kwamba huyu ndiye mtoto wake mmoja tu. Kwa kuwa tayari ametajwa kuwa mwana, tafsiri hii huhifadhi mkazo wa upekee bila marudio yasiyo ya lazima.
- source_word: μοί ἐστιν
  choice: ndiye ... wangu
  rationale: Dativi pamoja na εἰμί ina maana ya umilikaji; muundo huu wa Kiswahili unaeleza kiasili kwamba huyo ndiye mtoto wake pekee.
theological_decisions:
- issue: Upeo wa maana ya μονογενής
  choice: mtoto wangu wa pekee
  alternative: mwana wangu wa pekee
  rationale: Kigiriki kinaweza kueleweka kuwa ndiye mtoto wake pekee au, kwa kuzingatia nomino ‘mwana’ iliyotangulia, mwana wake wa pekee. Maandishi yanatumia tafsiri ya kwanza na tanbihi inahifadhi ya pili bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi unabaki wazi na wa kawaida; ‘tazama’ huhifadhi alama ya kuvuta usikivu ya Luka, na tanbihi huhifadhi utata halisi wa μονογενής.
