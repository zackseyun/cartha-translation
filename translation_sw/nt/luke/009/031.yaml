  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: sw
  text: Nao walionekana katika utukufu, walikuwa wakizungumza kuhusu kuondoka kwake, ambako alikuwa karibu kukutimiza huko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόξῃ
  choice: katika utukufu
  rationale: Hudumisha maana ya kuonekana katika hali yenye utukufu bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: kuondoka kwake
  rationale: Neno ἔξοδος lina maana ya kuondoka na hapa linaweza kudokeza pia kifo na utimilifu wa kazi ya Yesu; tafsiri hii huhifadhi upana huo bila kuufunga kuwa ‘kifo’ pekee.
- source_word: ἤμελλεν
  choice: alikuwa karibu
  rationale: Huonyesha jambo lililokuwa linakaribia kutokea, kama muundo wa Kigiriki unavyodokeza.
- source_word: πληροῦν
  choice: kutimiza
  rationale: Huhifadhi dhana ya kulifikisha jambo kwenye ukamilifu au utimilifu, badala ya ‘kutekeleza’ tu.
- source_word: ἐν Ἰερουσαλήμ
  choice: huko Yerusalemu
  rationale: Ni usemi wa kawaida wa Kiswahili unaobainisha mahali ambapo kuondoka huko kungetimizwa.
theological_decisions:
- issue: Maana ya ἔξοδος kuhusiana na matukio ya Yerusalemu
  choice: kuondoka kwake
  alternative: kifo chake
  rationale: ‘Kuondoka’ huhifadhi utata na wigo wa neno la Kigiriki, ambalo linaweza kujumuisha mateso, kifo, ufufuo, na kupaa bila kuamua kimya-kimya kuwa linamaanisha kifo pekee.
- issue: Nguvu ya πληροῦν
  choice: kutimiza
  alternative: kutekeleza
  rationale: ‘Kutimiza’ huhifadhi mkazo wa chanzo kwamba kuondoka huko ni jambo linalofikishwa kwenye utimilifu, pamoja na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kuwa mgumu; hakuna tanbihi iliyohitajika.
