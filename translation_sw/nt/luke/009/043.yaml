  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: sw
  text: 'Watu wote walishangazwa na ukuu wa Mungu.[a] Lakini watu wote walipokuwa wakiyastaajabia mambo yote aliyokuwa akifanya, aliwaambia wanafunzi wake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adhama ya Mungu.” Neno la Kigiriki μεγαλειότης linaweza kumaanisha ukuu, adhama, au enzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: walistaajabu sana
  rationale: Kitenzi hiki kinaonyesha mshangao mkubwa na hali iliyoendelea; “walistaajabu sana” ni Kiswahili cha kawaida kinachohifadhi uzito huo.
- source_word: πάντες
  choice: watu wote
  rationale: Huweka wazi kwamba mwitikio huo uliwahusu wote waliokuwapo.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: kwa ukuu wa Mungu
  rationale: “Ukuu” ni neno la kawaida na lenye heshima linaloweza kumaanisha ukubwa, utukufu au adhama ya Mungu; “kwa” linaonyesha sababu au msingi wa kustaajabu.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Lakini wote walipokuwa wakishangaa
  rationale: Muundo wa Kigiriki unaonyesha jambo lililokuwa likiendelea wakati Yesu alianza kusema. “Wakishangaa” linatofautishwa na “walistaajabu sana” ili kuhifadhi tofauti kati ya θαυμάζω na ἐκπλήσσομαι.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: kwa mambo yote aliyokuwa akifanya
  rationale: Huhifadhi wingi wa “mambo yote” na hali endelevu ya wakati usiotimilika katika ἐποίει.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: aliwaambia wanafunzi wake
  rationale: Ni usemi wa asili wa Kiswahili kwa utangulizi huu wa simulizi, huku kiwakilishi cha mtenda kikieleweka kutokana na muktadha.
theological_decisions:
- issue: Mtendaji anayerejelewa katika οἷς ἐποίει na εἶπεν
  choice: Kiwakilishi kisichotajwa wazi kinamrejelea Yesu kulingana na muktadha
  alternative: Kumtaja Yesu wazi katika tafsiri
  rationale: Kigiriki hakirudii jina la Yesu, ingawa muktadha unamtambulisha kuwa ndiye aliyekuwa akitenda na kusema. Kutotaja jina hapa kunahifadhi mtindo wa chanzo na pia hudumisha tofauti yenye maana kati ya ukuu unaohusishwa na Mungu na matendo yanayofanywa na Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia sentensi nyepesi kueleweka, huku ikihifadhi tofauti ya nguvu kati ya kustaajabu sana na kushangaa.
