  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: marudio ya δέχομαι yanahifadhiwa kwa “kumkaribisha”; παιδίον ni “mtoto”; ἐπὶ τῷ ὀνόματί μου ni “kwa jina langu”; na τὸν ἀποστείλαντά με imeachwa bila kumtaja Baba au Mungu moja kwa moja. “Aliye mdogo kuliko wote miongoni mwenu” huwasilisha kwa usahihi hali ya chini inayokusudiwa na μικρότερος katika muktadha huu, na “huyo ndiye mkuu” huhifadhi msisitizo wa οὗτός ἐστιν μέγας.'
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye mtiririko wa kawaida wa simulizi na mafundisho. “Akawaambia,” “Yeyote...,” na “Kwa maana...” vinafaa kwa rejesta ya kifungu. Kurudiwa kwa “kumkaribisha” ni la makusudi na ni la asili katika kauli hii.
