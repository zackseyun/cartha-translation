  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: sw
  text: Akawaambia, “Yeyote anayemkaribisha mtoto huyu kwa jina langu[a], ananikaribisha mimi; na yeyote anayenikaribisha mimi, anamkaribisha yule aliyenituma. Kwa maana aliye mdogo kuliko wote miongoni mwenu—huyo ndiye mkuu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa msingi wa jina langu” au “kwa sababu ya jina langu”; usemi huu unaonyesha kumkaribisha mtoto kwa uhusiano na jina, mamlaka, au uwakilishi wa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: -karibisha
  rationale: Kitenzi hiki huweza kumaanisha kupokea, kukubali, au kukaribisha. Katika muktadha wa mtoto, “kumkaribisha” ni Kiswahili cha kawaida kinachoonyesha kumpokea mtu kwa ukarimu na kumkubali; kurudiwa kwake kunahifadhi mnyororo wa maana katika kauli ya Yesu.
- source_word: παιδίον
  choice: mtoto
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili; muktadha hautaki lazima kuongeza “mdogo.”
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Usemi huu unahifadhi uhusiano na jina, mamlaka, na uwakilishi wa Yesu bila kuufupisha kuwa wema wa kawaida tu.
- source_word: τὸν ἀποστείλαντά με
  choice: yule aliyenituma
  rationale: Kirai hiki cha Kiswahili ni cha asili na kinahifadhi rejeo la mtu bila kumtaja wazi kuwa Baba au Mungu wakati Kigiriki hakufanyi hivyo hapa.
- source_word: μικρότερος
  choice: aliye mdogo kuliko wote
  rationale: Umbo la kulinganisha linaelekea kwenye hadhi ya chini katika kundi, si lazima umri au ukubwa wa mwili. “Mdogo kuliko wote” huwasilisha hali hiyo bila kuongeza neno lisilo katika matini.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: miongoni mwenu
  rationale: Hii inaonyesha kwa ufasaha nafasi ya mtu ndani ya kundi; wazo la wote tayari limo katika “mdogo kuliko wote.”
- source_word: οὗτός ἐστιν μέγας
  choice: huyo ndiye mkuu
  rationale: “Huyo” na “ndiye” zinahifadhi mkazo wa kiwakilishi cha Kigiriki, huku “mkuu” ikieleza ukubwa wa hadhi badala ya ukubwa wa mwili.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Yeyote ... na yeyote
  rationale: Muundo huu wa Kiswahili unaonyesha sharti la jumla lisilomhusu mtu mmoja maalumu.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Akawaambia
  rationale: Huu ni muunganiko wa kawaida wa simulizi katika Kiswahili unaowasilisha καί na tendo la kusema kwao bila kuongeza maelezo.
theological_decisions:
- issue: Rejeo la “yule aliyenituma”
  choice: Rejeo lisilo wazi kwa Baba/Mungu limeachwa kama lilivyo katika matini.
  alternative: “Baba aliyenituma” au “Mungu aliyenituma”
  rationale: Kigiriki kinatumia kishazi cha kishiriki bila kumtaja Baba moja kwa moja; tafsiri inahifadhi dai la kutumwa kwa Yesu bila kulipanua.
- issue: Maana ya kumkaribisha mtoto “kwa jina langu”
  choice: Kumkaribisha kunawekwa katika uhusiano na jina, mamlaka, au uwakilishi wa Yesu.
  alternative: “kwa ajili yangu” au “kwa sababu mtoto huyo ni wangu”
  rationale: “Kwa jina langu” huhifadhi upana wa maana ya usemi wa Kigiriki na haushushi kauli kuwa ukarimu wa kawaida pekee.
- issue: Kitendawili cha ukuu
  choice: Ukuu unahusishwa na kuwa wa hadhi ya chini kabisa miongoni mwa jumuiya.
  alternative: “aliye mchanga kuliko wote”
  rationale: μικρότερος katika muktadha huu inaeleweka vizuri zaidi kwa hadhi na unyenyekevu kuliko umri pekee; tafsiri haiondoi mvutano wa “mdogo” kuwa “mkuu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kumkaribisha” limetumiwa kwa uthabiti mara tatu ili kuhifadhi marudio na uhusiano wa kimantiki wa matini ya Kigiriki. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai kinachofafanuliwa.
