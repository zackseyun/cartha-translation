  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Hakuna mtu ambaye ameweka mkono wake kwenye plau[a] na kuangalia nyuma hafai kwa ufalme wa Mungu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye ameweka mkono wake juu ya plau.” Picha ni ya mtu anayeanza kazi ya kulima kwa plau, kisha anaelekeza uangalifu wake nyuma.
    reason: lexical_alternative
  - marker: b
    text: “Hafai” pia yaweza kutafsiriwa “si mwafaka” au “hafai kutumiwa” kwa ufalme wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Hakuna mtu
  rationale: Huhifadhi maana ya jumla ya kiwakilishi hasi bila kuibana kwa jinsia.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: anayeweka mkono wake kwenye jembe
  rationale: Huhifadhi picha halisi ya kuanza kulima; muundo wa Kiswahili ni wa kawaida na unaeleweka.
- source_word: ἄροτρον
  choice: jembe
  rationale: Katika Kiswahili cha Afrika Mashariki, “jembe” ni neno la kawaida kwa kifaa cha kulimia; muktadha unaonyesha tendo la kulima.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: kutazama nyuma
  rationale: Huhifadhi picha halisi pamoja na wazo la moyo au uangalifu uliogawanyika, bila kutafsiri zaidi kuwa kuacha kabisa.
- source_word: εὔθετός
  choice: anayefaa
  rationale: Hutoa maana ya kufaa au kuwa mwafaka kwa kusudi fulani, bila kuamua kwamba kauli hiyo inamaanisha moja kwa moja kustahili wokovu au kuwa na manufaa katika huduma.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: kwa ufalme wa Mungu
  rationale: Huhifadhi usemi wa kawaida wa kibiblia na uhusiano wa dativu unaoambatana na εὔθετος.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti au jibu la kusahihisha kwa upole katika muktadha uliotangulia.
theological_decisions:
- issue: Maana ya εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: “anayefaa kwa ufalme wa Mungu,” ikiacha wazi aina kamili ya kufaa inayokusudiwa
  alternative: “anayefaa kuitumikia serikali ya Mungu” au “anayestahili kuingia katika ufalme wa Mungu”
  rationale: Kivumishi cha Kigiriki huonyesha kufaa au kuwa mwafaka. Tafsiri haipaswi kuifanya kauli iwe hasa kuhusu huduma pekee wala hukumu ya mwisho na wokovu, kwa kuwa maandishi yenyewe hayaelezi hivyo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jembe” limetumiwa kwa maana ya kifaa cha kulimia kinachotajwa katika picha hii. Alama zote za tanbihi zimewekwa katika maandishi makuu.
