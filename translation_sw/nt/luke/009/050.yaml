  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: sw
  text: Lakini Yesu akamwambia, “Msimzuie, kwa maana yeyote ambaye hayuko dhidi yenu yuko upande wenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Lakini Yesu akamwambia
  rationale: δέ inaunganisha jibu la Yesu na pingamizi lililotangulia kwa utofautishaji wa kiasi. Muundo huu wa Kiswahili ni wa kawaida na unahifadhi kiwakilishi cha Kigiriki bila kutaja Yohana moja kwa moja.
- source_word: Μὴ κωλύετε
  choice: Msimzuie
  rationale: κωλύω hapa humaanisha kumzuia mtu asiendelee kutenda. Kitenzi cha nafsi ya pili wingi kinahifadhiwa kwa kiambishi m-, na kiambishi -m- kinamrejelea yule mtu aliyetajwa katika mstari uliotangulia.
- source_word: ὃς γὰρ
  choice: kwa maana yeyote
  rationale: γάρ inatoa sababu, nayo ὃς hapa inaweza kueleza kanuni yenye matumizi mapana; “yeyote” huwasilisha nguvu hiyo bila kuifunga kwa mtu mmoja pekee.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: asiye dhidi yenu
  rationale: κατά pamoja na jenitivi huonyesha upinzani. “Dhidi yenu” huhifadhi nafsi ya pili wingi na maana ya kuwa mpinzani.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: yuko upande wenu
  rationale: ὑπέρ hapa huonyesha kuwa upande wa mtu au kumuunga mkono. “Yuko upande wenu” ni Kiswahili cha asili na huweka wazi ulinganifu wa kinyume na “dhidi yenu.”
theological_decisions:
- issue: Upeo wa kauli ya Yesu
  choice: Kuitafsiri kama kanuni ya jumla kwa kutumia “yeyote.”
  alternative: “Yule asiye dhidi yenu yuko upande wenu,” ambayo inaweza kueleweka kuwa inamhusu hasa mtu huyo.
  rationale: Kiwakilishi cha uhusiano ὃς kinaweza kumrejelea mtu wa tukio hili huku pia kikitoa kanuni pana. “Yeyote” huhifadhi upeo huo bila kuongeza fundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Msimzuie” linaonyesha wazi kuwa Yesu anawaambia zaidi ya mtu mmoja wamwache mtu mmoja. Hakuna tanbihi iliyoongezwa kwa sababu chaguo hilo ni wazi na la kawaida katika muktadha.
