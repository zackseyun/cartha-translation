  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: sw
  text: Akawaambia wote, “Mtu yeyote akitaka kuja nyuma yangu, na ajikane mwenyewe, auchukue msalaba wake kila siku, na anifuate.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Akawaambia
  rationale: Katika muktadha huu, hali ya kutokamilika ya kitenzi inaonyesha Yesu alikuwa akizungumza nao; Kiswahili cha masimulizi hutumia kwa kawaida “akawaambia” bila kulazimisha usemi usio wa asili kama “alikuwa akiwaambia.”
- source_word: πρὸς πάντας
  choice: wote
  rationale: Huhifadhi wigo wa hadhira yote kwa lugha fupi na ya kawaida.
- source_word: Εἴ τις θέλει
  choice: Mtu yeyote akitaka
  rationale: “Mtu yeyote” huwakilisha umoja wa kijumla wa τις, na “akitaka” hutoa kwa kawaida maana ya hiari iliyo katika θέλει.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: kuja nyuma yangu
  rationale: Huhifadhi taswira ya kuja nyuma ya Yesu na haitangulizi maana ya kitenzi cha mwisho, “anifuate.”
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: na ajikane mwenyewe
  rationale: “Ajikane” ni amri ya nafsi ya tatu inayolingana na ἀρνησάσθω; “mwenyewe” huweka wazi nguvu ya kirejeshi ya ἑαυτόν.
- source_word: ἀράτω
  choice: auchukue
  rationale: Hutoa maana ya kuuchukua msalaba, badala ya kuibadili kuwa kubeba tu au kuvumilia.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: msalaba wake
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi neno halisi “msalaba” na umilikaji bila kuongeza ufafanuzi.
- source_word: καθ’ ἡμέραν
  choice: kila siku
  rationale: Ni Kiswahili cha asili na sahihi kwa wazo la tendo la siku kwa siku.
- source_word: ἀκολουθείτω μοι
  choice: kisha anifuate
  rationale: “Anifuate” huhifadhi amri ya nafsi ya tatu; “kisha” huunganisha wito huu na maagizo yaliyotangulia kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya lugha ya “msalaba” katika uanafunzi
  choice: Kudumisha neno halisi “msalaba.”
  alternative: Kulifafanua kuwa mateso, mzigo, au kujitoa mhanga.
  rationale: σταυρός ni kitu halisi chenye pia uzito wa kisitiari. Tafsiri haipaswi kuamua mapema au kupunguza maana hiyo kuwa ufafanuzi mmoja.
- issue: Umoja wa kijumla katika τις na maumbo ya amri yanayofuata
  choice: Kutumia “mtu yeyote” na kuendeleza umoja katika “ajikane,” “auchukue,” na “anifuate.”
  alternative: Kutumia wingi, kama “watu wakitaka ... wajikane.”
  rationale: Kigiriki hutumia umoja wa kijumla. Kiswahili kinaweza kuuhifadhi kwa asili bila kulazimika kuweka kiwakilishi chenye jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa umoja wa kijumla umehifadhiwa kwa njia isiyo na ubainishaji wa jinsia, kwa hiyo tanbihi ya Kiingereza kuhusu “him/them” haihitajiki katika Kiswahili.
