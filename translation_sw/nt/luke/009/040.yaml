lexical_decisions:
- source_word: ἐδεήθην
  choice: Niliwasihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati na la kusisitiza; “niliwasihi” ni Kiswahili cha kawaida chenye uzito kuliko “niliwaomba” bila kuwa cha kale.
- source_word: τῶν μαθητῶν σου
  choice: wanafunzi wako
  rationale: “Wanafunzi” huhifadhi uhusiano wa mwalimu na wanafunzi unaokusudiwa na μαθητής na ni istilahi iliyozoeleka katika Injili.
- source_word: ἵνα ἐκβάλωσιν
  choice: wamtoe
  rationale: Muundo huu unaonyesha kusudi la ombi. Katika muktadha wa kutoa pepo, “kumtoa” ni usemi wa asili wa Kiswahili na unalingana na maana ya ἐκβάλλω.
- source_word: αὐτό
  choice: -m- katika “wamtoe”
  rationale: Kiambishi cha yambwa “-m-” kinaweza kurejelea roho/pepo, na kwa Kiswahili pia kinaacha wazi uwezekano wa kurejelea mvulana; hivyo utata halisi wa kiwakilishi hauondolewi kimyakimya.
- source_word: οὐκ ἠδυνήθησαν
  choice: hawakuweza
  rationale: Tafsiri hii inaeleza moja kwa moja kutokuwa na uwezo na ni ya kawaida, wazi, na yenye heshima katika Kiswahili cha sasa.
theological_decisions:
- issue: Kirejelewa cha αὐτό katika muktadha wa kutoa pepo
  choice: Matini kuu inatumia “wamtoe,” ambayo kwa muktadha inaelekea kurejelea roho/pepo.
  alternative: Kiwakilishi kinaweza kurejelea mvulana, yaani wamtoe yeye katika hali hiyo.
  rationale: ἐκβάλλω katika masimulizi ya kutoa pepo kwa kawaida humchukua pepo au roho kuwa yambwa, na muktadha wa karibu unaunga mkono hilo. Hata hivyo, Kiswahili “wamtoe” hakilazimishi kirejelewa kimoja, kwa hiyo tanbihi inahifadhi uwezekano mwingine bila kuingiza uamuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Niliwasihi” huhifadhi uzito wa ombi la baba, na “hawakuweza” ni wazi kwa wasomaji wa kawaida. Kiambishi katika “wamtoe” kinahifadhi utata wa kirejelewa unaopatikana katika muktadha.
