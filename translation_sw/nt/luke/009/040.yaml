translation:
  language: sw
  text: Niliwasihi wanafunzi wako wamtoe[a], lakini hawakuweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wamtoe yeye,” ikiwa kiwakilishi kinaeleweka kumrejelea mvulana badala ya roho.
