  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: sw
  text: Akawaambia, “Msichukue chochote kwa ajili ya safari—wala fimbo, wala mfuko[a], wala mkate, wala fedha[b]; wala msiwe na mavazi mawili ya ndani kila mmoja[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mfuko wa msafiri wa kubebea mahitaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya msingi, “fedha” ni metali; hapa inamaanisha pesa.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kina maana ya “mavazi mawili ya ndani kila mmoja” au “mavazi mawili ya ndani kwa kila mtu.” Neno hilo hurejelea tunika, yaani vazi la ndani lililovaliwa wakati huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Msichukue chochote kwa ajili ya safari
  rationale: Huwasilisha katazo na kusudi la maandalizi ya safari kwa Kiswahili cha kawaida, huku likibaki karibu na maana ya Kigiriki.
- source_word: ῥάβδον
  choice: fimbo
  rationale: Katika muktadha wa safari, neno hili humaanisha fimbo ya kutembelea; “fimbo” ni la kawaida na linafaa kihistoria.
- source_word: πήραν
  choice: mfuko
  rationale: Ni mfuko wa kubebea mahitaji ya safari. “Mfuko” ni tafsiri fupi na ya asili; maana mahususi zaidi imewekwa katika tanbihi.
- source_word: ἄρτον
  choice: mkate
  rationale: Hutafsiri kitu kilichotajwa moja kwa moja bila kukipanua kuwa chakula kwa ujumla.
- source_word: ἀργύριον
  choice: fedha
  rationale: “Fedha” huhifadhi maana ya msingi ya metali na pia hueleweka kwa kawaida kuwa pesa katika muktadha huu.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: wala kila mmoja asiwe na kanzu mbili
  rationale: Kauli hii inaonyesha wazi nguvu ya ugawaji ya ἀνά, yaani kanzu mbili kwa kila mtu, bila kuibadili kuwa amri ya kuzichukua.
- source_word: χιτῶνας
  choice: kanzu
  rationale: “Kanzu” ni neno linaloeleweka kwa vazi refu, ingawa χιτών lilikuwa vazi la ndani la nyakati hizo; ufafanuzi huo umehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, na “wala” limetumiwa kurudia nguvu ya makatazo ya Kigiriki. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
