  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: sw
  text: Na sauti ikatoka katika lile wingu, ikisema, “Huyu ni Mwanangu, Mteule[a]; msikilizeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Mwanangu mpendwa” badala ya “Mwanangu, Mteule.”
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: sauti ikatoka
  rationale: Muundo huu wa Kigiriki unaeleza kutokea kwa sauti. Katika simulizi la Kiswahili, “sauti ikatoka” ni wa asili na unaonyesha tukio bila tafsiri ngumu ya neno kwa neno.
- source_word: ἐκ τῆς νεφέλης
  choice: katika lile wingu
  rationale: ἐκ huonyesha chanzo. “Ikatoka katika lile wingu” ni Kiswahili cha kawaida na hutambulisha wingu lililokwisha tajwa katika muktadha.
- source_word: λέγουσα
  choice: ikisema
  rationale: Kirai hiki kinaanzisha maneno yaliyotamkwa na sauti; “ikisema” huhifadhi muundo wa kisimulizi kwa njia ya kawaida.
- source_word: Οὗτός ἐστιν
  choice: Huyu ni
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kumtambulisha mtu aliye karibu au anayeonyeshwa.
- source_word: ὁ υἱός μου
  choice: Mwanangu
  rationale: Huhifadhi kwa ufupi na kwa kawaida maana ya “Mwana wangu.” Herufi kubwa inaonyesha matumizi ya cheo hiki kwa Yesu katika muktadha.
- source_word: ὁ ἐκλελεγμένος
  choice: Mteule
  rationale: Kivumishi-jina hiki cha hali timilifu tendwa kinamaanisha mtu aliyechaguliwa. “Mteule” ni cha asili, chenye heshima, na hakiongezi kimilikishi cha pili ambacho hakipo wazi katika Kigiriki.
- source_word: αὐτοῦ ἀκούετε
  choice: msikilizeni
  rationale: Amri hii inataka wasikilizaji wamsikilize kwa makini na kumtii. “Msikilizeni” ni amri ya kawaida ya Kiswahili na huhifadhi nguvu hiyo.
theological_decisions:
- issue: Tofauti ya maandishi kuhusu sifa ya Mwana katika sauti kutoka winguni
  choice: ἐκλελεγμένος imetafsiriwa “Mteule”
  alternative: ἀγαπητός inaweza kutafsiriwa “mpendwa,” na hivyo kuwa “Mwanangu mpendwa”
  rationale: Maandishi ya SBLGNT yaliyotolewa yana ἐκλελεγμένος, kwa hiyo tafsiri kuu inafuata “Mteule” badala ya kupatanisha mstari huu na usemi unaojulikana zaidi katika Injili nyingine. Tofauti ya hati imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia “Kisha” na vitenzi vya mfululizo; sentensi imebaki wazi na rahisi kwa msomaji wa kawaida.
