    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: alipowaita pamoja
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kitendo kinachohusiana kwa karibu na kitendo kikuu; muundo huu ni wa asili katika Kiswahili, huku “pamoja” ikiwakilisha kiambishi συν-.
- source_word: δὲ
  choice: Naye
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza simulizi, si cha kuonyesha upinzani mkali.
- source_word: τοὺς δώδεκα
  choice: wale kumi na wawili
  rationale: Maandishi yanasema tu “wale kumi na wawili”; hayajaongeza “wanafunzi” wala “mitume.”
- source_word: ἔδωκεν
  choice: aliwapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya δίδωμι katika muktadha huu.
- source_word: δύναμιν
  choice: nguvu
  rationale: Neno hili linaonyesha uwezo wa kutenda, hasa katika huduma yenye matendo ya ajabu.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha haki au idhini ya kutumia nguvu, na hivyo linabaki tofauti na δύναμις.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: juu ya mapepo yote
  rationale: ἐπί pamoja na hali ya kushutumiwa hapa inaonyesha mamlaka juu ya mapepo; “mapepo yote” ni Kiswahili cha asili kinachohifadhi wingi wa maandishi.
- source_word: δαιμόνια
  choice: mapepo
  rationale: “Mapepo” ni kisawe cha moja kwa moja cha viumbe wa kiroho waovu kinachotofautiana na tafsiri pana zaidi kama “roho.”
- source_word: νόσους
  choice: magonjwa
  rationale: Ni neno la kawaida na halisi kwa maradhi au hali za kuugua.
- source_word: θεραπεύειν
  choice: kuponya
  rationale: Kitenzi-jina hiki kinaeleza jambo walilopewa uwezo na mamlaka ya kufanya; “kuponya” ni tafsiri ya kawaida na pana.
theological_decisions:
- issue: Tofauti kati ya δύναμις na ἐξουσία
  choice: nguvu na mamlaka
  alternative: uwezo na mamlaka
  rationale: Kutumia maneno mawili tofauti kunahifadhi tofauti kati ya uwezo wa kutenda na mamlaka iliyotolewa, bila kuyafanya kuwa wazo moja.
- issue: Utambulisho wa τοὺς δώδεκα
  choice: wale kumi na wawili
  alternative: wale wanafunzi kumi na wawili; wale mitume kumi na wawili
  rationale: Maandishi ya Kigiriki hayaongezi “wanafunzi” wala “mitume,” kwa hiyo tafsiri haijaingiza maelezo kutoka muktadha mwingine.
- issue: Uhusiano wa mamlaka na uponyaji katika sarufi
  choice: aliwapa nguvu na mamlaka juu ya mapepo yote na kuponya magonjwa
  alternative: aliwapa nguvu na mamlaka ya kutoa mapepo yote na kuponya magonjwa
  rationale: Muundo uliochaguliwa unahifadhi ἐπί kwa maana ya mamlaka “juu ya” mapepo na infinitivu ya kuponya, bila kuongeza kitenzi “kutoa” ambacho hakipo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Naye” huendeleza simulizi bila kuashiria upinzani; “mapepo” huepuka kuongeza neno “wachafu,” ambalo halipo katika chanzo hiki.
