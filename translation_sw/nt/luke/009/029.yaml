  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: sw
  text: Ikawa, alipokuwa akisali, mwonekano wa uso wake ukawa tofauti[a], na mavazi yake yakawa meupe, yakimeta kama umeme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwonekano wa uso wake ukabadilika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mavazi yake yalikuwa meupe na yenye kung'aa sana”; kitenzi kishiriki cha Kigiriki huleta picha ya kumulika kama umeme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Ikawa alipokuwa akisali
  rationale: Muundo huu wa Luka unaanzisha tukio lililotokea wakati tendo jingine likiendelea. Tafsiri hii inadumisha ladha ya simulizi ya ἐγένετο na maana ya wakati kwa Kiswahili cha kawaida.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: mwonekano wa uso wake
  rationale: εἶδος hapa ni sura inayoonekana, si asili ya ndani; πρόσωπον ni uso. Usemi huu ni wazi na wa kawaida.
- source_word: ἕτερον
  choice: ukawa tofauti
  rationale: Maana ya msingi ni ‘mwingine/tofauti.’ Kauli hii inaonyesha badiliko linaloonekana bila kuingiza maelezo makali zaidi kutoka Injili nyingine.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: mavazi yake
  rationale: ‘Mavazi’ ni neno la sasa, lenye heshima, na linafaa kwa ἱματισμός kama jina la jumla la nguo.
- source_word: λευκὸς
  choice: meupe
  rationale: λευκός humaanisha meupe; mng’ao unaelezwa kando na participio inayofuata, hivyo haujaongezwa ndani ya kivumishi hiki.
- source_word: ἐξαστράπτων
  choice: yakimeta kama umeme
  rationale: Kitenzi hiki kinatokana na taswira ya umeme unaomulika. ‘Yakimeta kama umeme’ kinahifadhi picha hiyo hai badala ya kutumia tu neno la jumla kama ‘yaking’aa.’
theological_decisions:
- issue: Maelezo ya kugeuka sura kwa Yesu
  choice: Kueleza badiliko linaloonekana katika mwonekano wa uso wake bila kusema kwamba uso wake uling’aa
  alternative: uso wake ukabadilika; uso wake ukang’aa
  rationale: Luka anasema mwonekano wa uso wake ukawa ‘tofauti.’ Tafsiri inadumisha maelezo yake yaliyodhibitiwa na haiyapatanishi kimyakimya na lugha ya Injili nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. ‘Ikawa’ inadumisha mtindo wa Luka bila kufanya sentensi kuwa ngumu; ‘akisali’ ni la kawaida na linaeleweka kwa upana.
