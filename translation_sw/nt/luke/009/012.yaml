  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: sw
  text: Siku ilianza kuelekea jioni, na wale kumi na wawili wakamjia na kumwambia, “Waache watu waende, ili waende katika vijiji na maeneo ya mashambani yanayozunguka, wapate mahali pa kulala na mahitaji ya chakula[a], kwa sababu hapa tulipo ni mahali pa ukiwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapate chakula.” Neno la Kigiriki ἐπισιτισμός linaweza kumaanisha chakula au akiba ya chakula.
    reason: lexical_alternative
  - marker: b
    text: Au “mahali pasipo na watu.” Neno la Kigiriki ἔρημος linaweza kumaanisha eneo lisilokaliwa au lenye wakazi wachache.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Siku ilianza kuelekea jioni
  rationale: Kauli hii inaeleza siku ikielekea mwisho wake. Kiswahili hiki kinawasilisha maana ya wakati kwa kawaida bila kuongeza kiashiria kisichokuwamo kama ‘sasa.’
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: na wale kumi na wawili wakamjia
  rationale: ‘Wakamjia’ linaonyesha kuwa walimkaribia Yesu, naye ‘wale kumi na wawili’ linadumisha jina la kundi hilo.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Waache watu waende
  rationale: Katika muktadha huu ἀπολύω ni kuwaondoa au kuwaruhusu waende. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: katika vijiji na mashambani yanayozunguka
  rationale: κώμαι ni vijiji, na ἀγροί hapa ina maana pana ya maeneo ya mashambani; κύκλῳ inaonyesha maeneo yaliyo kandokando.
- source_word: καταλύσωσιν
  choice: wapate mahali pa kulala
  rationale: Kitenzi hiki hapa kinahusu kupata malazi. Kauli ya Kiswahili inaweka maana hiyo wazi bila kudokeza hoteli au nyumba maalumu.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: wapate mahitaji ya chakula
  rationale: ἐπισιτισμός hurejelea chakula au akiba ya chakula. ‘Mahitaji ya chakula’ yanahifadhi wazo la riziki ya kula, si mlo mmoja tu.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: kwa sababu hapa tulipo ni mahali pasipo na watu
  rationale: ἔρημος hapa inaweza kueleza eneo lisilokaliwa au lenye wakazi wachache. Tafsiri hii haiongezi taswira maalumu ya jangwa ambayo neno lenyewe hailazimishi.
