id: LUK.9.24
reference: Luke 9:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: sw
  text: Kwa maana yeyote anayetaka kuokoa uhai wake ataupoteza[a], lakini yeyote atakayeupoteza uhai wake kwa ajili yangu atauokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yake” au “roho yake”; neno la Kigiriki linaweza kumaanisha uhai, nafsi, au roho kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Kwa maana yeyote anayetaka
  rationale: γάρ inadumisha uhusiano wa ufafanuzi kwa “Kwa maana”; ὃς ... ἂν pamoja na hali tegemezi inaonyesha sharti la jumla, linalotafsiriwa kwa kawaida kama “yeyote”; θέλῃ ni “anayetaka.”
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: uhai wake
  rationale: ψυχή hapa hasa ni uhai wa mtu unaoweza kutafutwa kuokolewa au kupotezwa katika muktadha wa kumfuata Yesu. “Uhai” huepuka kuifupisha maana kuwa roho isiyo ya kimwili pekee, huku tanbihi ikihifadhi upana wa neno.
- source_word: σῶσαι / σώσει
  choice: kuokoa / atauokoa
  rationale: Kutumia mzizi mmoja wa Kiswahili katika sehemu zote mbili kunahifadhi urudiaji wa σῴζω na fumbo la kauli. Katika muktadha huu “kuokoa” pia hubeba wazo la kuhifadhi uhai.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ataupoteza / atakayeupoteza
  rationale: ἀπόλλυμι hapa inamaanisha kupoteza. Kurudia kitenzi kilekile hudumisha ulinganifu wa kauli bila kuingiza maana kali zaidi ya kujiangamiza.
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa ajili yangu
  rationale: Kirai hiki kinaonyesha sababu au kusudi linalomhusu Yesu; “kwa ajili yangu” ni cha kawaida, wazi, na huendeleza mkazo wa ufuasi wa kibinafsi.
- source_word: οὗτος σώσει αὐτήν
  choice: ata(u)okoa
  rationale: οὗτος ina mkazo wa kumtambulisha mtu huyo, lakini Kiswahili huuwasilisha kwa kawaida kupitia muundo wa “yeyote ... atakaye... atauokoa”; kuongeza “huyo ndiye” kungekuwa kizito bila kuhitajika. Kiambishi -u- kinarejelea “uhai.”
theological_decisions:
- issue: Maana ya ψυχή katika fumbo la Yesu
  choice: uhai
  alternative: roho; nafsi
  rationale: Muktadha wa kujikana na kumfuata Yesu unahusu kupoteza au kuhifadhi maisha ya mtu, lakini ψυχή lina upana wa maana. “Uhai” linafaa zaidi katika sentensi, na tanbihi inahifadhi uwezekano wa “roho” au “nafsi.”
- issue: Rejeo la jumla la kiume katika Kigiriki
  choice: yeyote ... wake
  alternative: kila mtu ... maisha yake
  rationale: “Yeyote” ni umoja wa kijumla na jumuishi kwa Kiswahili, huku “wake” ikirejelea mtu huyo bila kulazimisha jinsia ya kiume katika lugha lengwa.
- issue: Mkazo wa οὗτος
  choice: umewasilishwa kwa muundo wa kisharti wa Kiswahili bila neno la ziada
  alternative: huyo ndiye atakayeuokoa
  rationale: Kigiriki kinamtenga kwa mkazo mtu wa kundi la pili. Muundo wa “yeyote atakaye... atauokoa” ni wa kawaida na unaweka uhusiano huo wazi; “huyo ndiye” lingeweza kutumiwa lakini ni zito zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi “Kwa maana,” utofautishaji wa “lakini,” na fumbo la kuokoa/kupoteza. “Uhai” limechaguliwa badala ya “maisha” ili viambishi vya umoja virejelee kwa uwazi neno lilelile katika sentensi nzima.
