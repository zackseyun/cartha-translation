  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: sw
  text: Kisha akachukua ile mikate mitano na wale samaki wawili, akatazama juu mbinguni, akavibariki[a] vyakula hivyo na kuvimega, akaendelea kuwapa wanafunzi ili waviweke mbele ya umati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitoa shukrani kwa ajili ya vyakula hivyo.” Kitenzi cha Kigiriki hapa ni “alibariki,” ingawa baadhi ya masimulizi yanayofanana yanatumia kitenzi cha “kutoa shukrani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: akaitwaa
  rationale: Kitenzi hiki kinaonyesha tendo lililotangulia matendo makuu. “Akaitwaa” ni cha kawaida katika masimulizi na kinahifadhi mpangilio wa matendo.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa neno hili linaendeleza simulizi kwa upole; “Kisha” linaonyesha hatua inayofuata bila kuweka mkazo usio wa lazima.
- source_word: ἄρτους
  choice: mikate
  rationale: Katika simulizi hili neno linamaanisha mikate inayohesabika, si mkate kama chakula kwa ujumla.
- source_word: ἰχθύας
  choice: samaki
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wingi pia, huku idadi ikionyeshwa na “wawili.”
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: akatazama juu mbinguni
  rationale: Tafsiri hii inaonyesha wazi kitendo cha kuinua macho kuelekea mbinguni kwa lugha ya kawaida na yenye heshima.
- source_word: εὐλόγησεν αὐτοὺς
  choice: akavibariki vyakula hivyo
  rationale: “Akavibariki” kinahifadhi maana ya moja kwa moja ya kitenzi cha Kigiriki. Kirai “vyakula hivyo” kinawakilisha kwa pamoja mikate na samaki, kwa kuwa Kiswahili hakiwezi kutumia kiambishi kimoja cha yambwa kinachopatana moja kwa moja na ngeli zote mbili.
- source_word: κατέκλασεν
  choice: kuvimega
  rationale: “Kumega” ni tendo la kuvunja chakula vipande kwa ajili ya kugawa. Kiambishi “vi-” kinarejelea vyakula vilivyotajwa kwa pamoja.
- source_word: ἐδίδου
  choice: akaendelea kuwapa
  rationale: Hali isiyotimilika ya kitenzi cha Kigiriki inaonyesha utoaji ulioendelea au uliorudiwa; “akaendelea kuwapa” inaonyesha hilo kwa uwazi.
- source_word: μαθηταῖς
  choice: wanafunzi
  rationale: Neno hili linatafsiri nomino yenyewe bila kuongeza kimilikishi “wake,” ambacho hakijaelezwa moja kwa moja katika Kigiriki.
- source_word: παραθεῖναι
  choice: ili waviweke mbele ya
  rationale: Kirai hiki kinahifadhi kusudi la utoaji na maana halisi ya kuweka chakula mbele ya watu, badala ya kutumia neno pana zaidi “kuwahudumia.”
- source_word: ὄχλῳ
  choice: umati
  rationale: “Umati” ni neno la Kiswahili linalofaa kwa kundi kubwa la watu katika muktadha huu.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa baraka
  choice: mbinguni
  alternative: angani
  rationale: Kutazama huku juu kunaambatana na kutoa baraka katika muktadha unaomhusu Mungu. “Mbinguni” kinahifadhi maana hiyo bila kuongeza maelezo ya kimadhehebu.
- issue: Tafsiri ya εὐλόγησεν
  choice: akavibariki
  alternative: akamshukuru Mungu kwa ajili ya vyakula hivyo
  rationale: Kitenzi cha Kigiriki ni “bariki,” si kitenzi cha kawaida cha “shukuru.” Tafsiri kuu inahifadhi uchaguzi mahsusi wa Luka na haiupatanishi kimya kimya na masimulizi yanayofanana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Vyakula hivyo” limetumiwa kama rejeo la pamoja kwa mikate na samaki ili kushughulikia tofauti za ngeli kwa njia ya asili.
