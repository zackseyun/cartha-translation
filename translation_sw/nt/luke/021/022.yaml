id: LUK.21.22
reference: Luke 21:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: sw
  text: Kwa maana hizi ni siku za kisasi[a], ili yote yaliyoandikwa yatimizwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku za malipo ya haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na hivyo yote yaliyoandikwa yatimizwe.” Muundo wa Kigiriki unaweza kueleweka kuwa wa kusudi au wa matokeo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa onyo lililotangulia; “Kwa maana” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἡμέραι ἐκδικήσεως
  choice: siku za kisasi
  rationale: Inahifadhi taswira halisi ya “siku” na uzito wa hukumu na adhabu unaopatikana katika ἐκδίκησις, bila kuifanya kuwa haki kwa maana pana tu.
- source_word: αὗταί εἰσιν
  choice: hizi ni
  rationale: Inawakilisha moja kwa moja kiwakilishi cha kuonyesha na kitenzi kishirikishi.
- source_word: τοῦ πλησθῆναι
  choice: ili ... yatimizwe
  rationale: Muundo wa τοῦ pamoja na kitenzi-jina unaweza kuonyesha kusudi au matokeo; “ili” ni Kiswahili cha asili, ingawa tanbihi huhifadhi uwezekano wa matokeo.
- source_word: πάντα τὰ γεγραμμένα
  choice: yote yaliyoandikwa
  rationale: Inahifadhi ujumla wa πάντα na hali ya kitenzi cha τὰ γεγραμμένα bila kuongeza wazi neno “Maandiko,” ambalo halipo katika sentensi.
theological_decisions:
- issue: Maana ya ἐκδικήσεως katika unabii huu
  choice: kisasi
  alternative: malipo ya haki; adhabu
  rationale: “Kisasi” huhifadhi ukali wa hukumu ya kulipiza uliomo katika neno la Kigiriki. Muktadha unaonyesha hukumu ya Mungu, si hasira ya kibinadamu isiyodhibitiwa; tanbihi inatoa mbadala unaosisitiza haki.
- issue: Nguvu ya τοῦ pamoja na infinitive
  choice: ili ... yatimizwe
  alternative: na hivyo ... yatimizwe; ndipo ... yatimizwe
  rationale: Muundo unaweza kuwa wa kusudi au matokeo. Matini kuu inatumia “ili” kwa ufasaha, huku tanbihi ikihifadhi uwezekano wa maana ya matokeo.
- issue: Rejeo la τὰ γεγραμμένα
  choice: yote yaliyoandikwa
  alternative: Maandiko yote
  rationale: Haijabainishwa zaidi kuwa ni “Maandiko” katika sarufi yenyewe, ingawa muktadha unaelekea kwenye yaliyoandikwa katika Maandiko; tafsiri haiongezi ufafanuzi huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Siku za kisasi” huhifadhi lugha nzito ya hukumu ya chanzo, huku tanbihi ikizuia neno hilo lisieleweke kama chuki ya kibinadamu tu.
