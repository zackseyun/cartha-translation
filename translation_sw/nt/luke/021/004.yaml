  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: sw
  text: Kwa maana hawa wote walitoa sadaka kutokana na ziada yao[a], lakini yeye, kutokana na uhitaji wake[b], alitoa riziki yake yote aliyokuwa nayo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi” au “matoleo.” Kigiriki kinasema “zawadi,” kikirejelea vitu vilivyotolewa hekaluni.
    reason: lexical_alternative
  - marker: b
    text: Au “katokana na umaskini wake” au “kutokana na upungufu wake.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kila kitu alichokuwa nacho cha kujikimu; si maisha yake yote kwa maana ya uhai wake.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Kwa maana hawa wote
  rationale: “Kwa maana” inadumisha uhusiano wa ufafanuzi wa γάρ na aya iliyotangulia, na “hawa wote” ni tafsiri ya kawaida ya πάντες ... οὗτοι.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: katika wingi wao
  rationale: Usemi huu unaonyesha kile walichokuwa nacho kwa ziada na unadumisha utofauti na uhitaji wa mjane.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: walitoa ... wakatia katika sadaka
  rationale: Muundo huu wa Kiswahili unaonyesha kutoa kwao na tendo halisi la kutia walichotoa katika sadaka; “sadaka” ni neno la kawaida katika muktadha wa matoleo ya hekaluni.
- source_word: αὕτη δὲ
  choice: lakini yeye
  rationale: Kiwakilishi kinamrejelea mjane aliyetajwa tayari, huku “lakini” ikihifadhi utofauti wa δέ.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: katika uhitaji wake
  rationale: “Uhitaji” huwasilisha hali ya kukosa au kuwa na upungufu bila kulazimisha maana iwe umaskini pekee.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: riziki yake yote aliyokuwa nayo
  rationale: Katika muktadha wa fedha, βίος ni mali au njia ya kujikimu, si uhai wake kwa maana ya kuwapo; “riziki” ni ya asili na inaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: ἔβαλεν
  choice: alitia
  rationale: “Alitia” huhifadhi taswira halisi ya kuweka sarafu au fedha katika mahali pa sadaka.
theological_decisions:
- issue: Maana ya βίος katika zawadi ya mjane
  choice: “riziki yake yote,” yaani kila kitu alichokuwa nacho cha kujikimu
  alternative: “maisha yake yote”
  rationale: Muktadha unahusu kutoa fedha, na hapa βίος humaanisha nyenzo za kuishi. “Maisha yake yote” lingeweza kueleweka kimakosa kana kwamba alitoa uhai wake wenyewe.
- issue: Maana ya τὰ δῶρα
  choice: “sadaka” katika muktadha wa matoleo ya hekaluni
  alternative: “zawadi” au “matoleo”
  rationale: Neno la Kigiriki humaanisha zawadi zilizotolewa, lakini “sadaka” ni la kawaida na wazi katika Kiswahili kwa vitu vinavyotolewa katika mazingira haya; tanbihi inadumisha maana halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo unahifadhi utofauti kati ya wingi wa wengine na uhitaji wa mjane, huku ukiepuka Kiswahili kisicho cha kawaida kama tafsiri ya moja kwa moja ya “gave into the gifts.”
