  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: sw
  text: Na watu wote walikuwa wakimjia hekaluni asubuhi na mapema ili kumsikiliza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “hekaluni” linamaanisha eneo lote la Hekalu au nyua zake, si mahali patakatifu pa ndani pekee.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Huhifadhi maana pana ya watu kwa ujumla bila kulazimisha wazo kwamba kila mtu mmoja mmoja alikuwepo.
- source_word: ὤρθριζεν
  choice: walikuwa wakimjia ... asubuhi na mapema
  rationale: Muundo wa wakati uliopita unaoendelea unaonyesha tendo la kawaida lililorudiwa, huku ‘asubuhi na mapema’ ikihifadhi wazo la kuja mapema.
- source_word: πρὸς αὐτόν
  choice: wakimjia
  rationale: Kiambishi cha yambwa katika ‘wakimjia’ kinaonyesha mwendo kuelekea kwake kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Ni tafsiri ya kawaida na ya asili; hapa neno la Kigiriki linahusu eneo lote la Hekalu, jambo linalofafanuliwa katika tanbihi.
- source_word: ἀκούειν αὐτοῦ
  choice: ili kumsikiliza
  rationale: ‘Ili’ huonyesha kusudi la kuja, na ‘kumsikiliza’ huwasilisha kwa kawaida kusikia kwa makusudi mafundisho yake.
