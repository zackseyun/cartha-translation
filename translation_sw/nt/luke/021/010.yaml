id: LUK.21.10
reference: Luke 21:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: sw
  text: Ndipo akawaambia, “Taifa litainuka[a] dhidi ya taifa, na ufalme dhidi ya ufalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litasimama.”
    reason: Mbadala wa kileksika unaowasilisha maana ya kuinuka ili kukabiliana na mwingine.
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha wakati kinachohusianisha kauli hii na yaliyotangulia, huku kikidumisha mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἔλεγεν αὐτοῖς
  choice: akawaambia
  rationale: Ingawa ἔλεγεν ni wakati usiotimilifu, katika utangulizi wa maneno ya moja kwa moja Kiswahili hutumia kwa ufasaha ‘akawaambia’ bila kulazimisha maana ya kurudia-rudia.
- source_word: Ἐγερθήσεται
  choice: litainuka
  rationale: Katika usemi huu wa mapambano, kitenzi kinaeleza taifa kuinuka dhidi ya jingine; ‘litainuka’ ni cha asili na hakidokezi bila lazima mtendaji wa nje.
- source_word: ἔθνος
  choice: taifa
  rationale: Katika muktadha huu wa kisiasa na kwa kulingana na ‘ufalme,’ neno hili linamaanisha taifa au kundi la watu kama jumuiya.
- source_word: ἐπ’ ἔθνος
  choice: dhidi ya taifa
  rationale: ἐπί pamoja na hali ya accusative katika usemi huu huonyesha upinzani wa uhasama; ‘dhidi ya’ huwasilisha maana hiyo wazi.
- source_word: βασιλεία
  choice: ufalme
  rationale: Hapa neno linamaanisha eneo au dola inayotawaliwa na mfalme, si dhana ya kifalme kwa ujumla.
- source_word: ἐπὶ βασιλείαν
  choice: dhidi ya ufalme
  rationale: Muundo unaorudiwa unaonyesha ufalme mmoja ukiupinga mwingine; ‘dhidi ya’ hudumisha ulinganifu na sehemu ya kwanza.
theological_decisions:
- issue: Usemi wa mapambano katika unabii wa matukio ya mwisho
  choice: Kauli imetafsiriwa kama utabiri wa moja kwa moja wa mataifa na falme kupingana, bila kuingiza mfumo maalumu wa matukio ya mwisho.
  alternative: Kuufanya urejelee pekee kuanguka kwa Yerusalemu, au kuufanya kuwa ratiba ya kina ya mwisho wa dunia.
  rationale: Mstari wenyewe unasema tu kwamba taifa litainuka dhidi ya taifa na ufalme dhidi ya ufalme; tafsiri haipaswi kutatua mijadala mipana ambayo haijaamuliwa na maneno haya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kitenzi kinachohusika, si baada ya ‘akawaambia.’
