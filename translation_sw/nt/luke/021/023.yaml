id: LUK.21.23
reference: Luke 21:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: sw
  text: Ole wao walio na mimba na wale wanaonyonyesha katika siku hizo! Kwa maana kutakuwa na dhiki kubwa katika nchi[a], na ghadhabu dhidi ya watu hawa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “duniani.” Neno la Kigiriki γῆ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” imechaguliwa kwa sababu muktadha unaozunguka unalenga Yerusalemu na Yudea.
    reason: lexical_alternative
  - marker: b
    text: Au, “ghadhabu kwa watu hawa” au “ghadhabu juu ya watu hawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Ole wao
  rationale: Nahau hii ya Kiswahili huhifadhi mshangao wa kinabii unaoonyesha maombolezo na hukumu, bila kuifanya kuwa kauli ya kawaida tu ya huzuni.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: walio na mimba
  rationale: Ni usemi wa kawaida, wazi na wenye heshima kwa maana halisi ya ‘walio na [mtoto] tumboni.’
- source_word: ταῖς θηλαζούσαις
  choice: wale wanaonyonyesha
  rationale: Kitenzi hiki cha Kiswahili huwasilisha kwa kawaida tendo la kunyonyesha; kitu kinachonyonyeshwa kinaeleweka bila kulazimika kuongeza ‘watoto wachanga.’
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku hizo
  rationale: Hufuata muundo na maana ya usemi wa wakati katika Kigiriki huku ikiwa Kiswahili cha kawaida.
- source_word: ἀνάγκη μεγάλη
  choice: dhiki kubwa
  rationale: Katika muktadha wa maafa na hukumu, ἀνάγκη humaanisha hali kali ya taabu au mashaka, si lazima au ulazima wa kawaida.
- source_word: ἐπὶ τῆς γῆς
  choice: katika nchi
  rationale: γῆ inaweza kuwa nchi au dunia. Muktadha wa karibu kuhusu Yerusalemu na Uyahudi unaelekeza zaidi kwa ‘nchi’; ‘katika’ ni muundo wa asili wa Kiswahili kwa hali inayoikumba nchi.
- source_word: ὀργὴ
  choice: ghadhabu
  rationale: ‘Ghadhabu’ huhifadhi uzito wa hasira ya hukumu bila kuingiza moja kwa moja neno ‘hukumu’ au kumtaja mwenye ghadhabu.
- source_word: τῷ λαῷ τούτῳ
  choice: dhidi ya watu hawa
  rationale: Huwasilisha kundi linaloathiriwa na ghadhabu na kuhifadhi nguvu ya kiashiria τούτῳ, bila kufafanua zaidi utambulisho wao.
theological_decisions:
- issue: Rejeo na upeo wa γῆ na ‘watu hawa’
  choice: ‘Nchi’ imetumiwa kwa sababu muktadha wa karibu unahusu Yerusalemu na Uyahudi.
  alternative: ‘Dunia,’ kwa maana ya upeo wa ulimwengu mzima.
  rationale: Tafsiri inadumisha rejeo la mahali linalowezekana zaidi katika muktadha, huku tanbihi ikihifadhi uwezekano halisi wa maana pana ya γῆ.
- issue: Asili ya ὀργή
  choice: Imetafsiriwa ‘ghadhabu’ bila kuongeza ‘ya Mungu.’
  alternative: ‘Ghadhabu ya Mungu’ au ‘hukumu.’
  rationale: Ingawa muktadha unaweza kueleweka kuwa unahusu ghadhabu ya Mungu, Kigiriki hakimsaidii mhusika huyo waziwazi; kutomtaja kunahifadhi mvutano wa kitheolojia wa matini.
- issue: Uhusiano wa dative katika τῷ λαῷ τούτῳ
  choice: ‘dhidi ya watu hawa’
  alternative: ‘kwa watu hawa’ au ‘juu ya watu hawa.’
  rationale: Dative inaonyesha watu wanaolengwa au kuathiriwa na ghadhabu, lakini uhusiano wake unaweza kuwasilishwa kwa njia zaidi ya moja; tanbihi inadumisha tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ole wao’ inadumisha sauti ya kinabii; ‘walio na mimba’ na ‘wanaonyonyesha’ ni misemo ya kawaida na wazi. Alama zote za tanbihi zimewekwa katika matini kuu.
