  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: sw
  text: Na ndipo watamwona Mwana wa Adamu akija katika wingu kwa nguvu na utukufu mkuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya wingu.” Kigiriki kina “wingu” katika umoja na kinasema kihalisi “katika wingu,” huku taswira hiyo ikikumbusha Danieli 7 na vifungu vingine kuhusu Mwana wa Adamu akija pamoja na mawingu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: watamwona
  rationale: Kitenzi cha wakati ujao kinaonyesha kuona kwa macho. “Watamwona” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Biblia ya Kiswahili, na linahifadhi uhusiano wa kifasihi na Danieli 7.
- source_word: ἐρχόμενον
  choice: akija
  rationale: Huhifadhi tendo linaloendelea ambalo ndilo watakalomwona akifanya, bila kuongeza wazo la kufika ambalo halijaelezwa wazi.
- source_word: ἐν νεφέλῃ
  choice: katika wingu
  rationale: Hufuata umoja wa νεφέλῃ na maana ya kawaida ya ἐν pamoja na hali ya utoaji, badala ya kubadili kuwa wingu nyingi.
- source_word: μετὰ δυνάμεως
  choice: kwa nguvu
  rationale: Katika muktadha huu, “kwa nguvu” ni usemi wa asili wa Kiswahili unaoonyesha hali inayoandamana na kuja kwake.
- source_word: δόξης πολλῆς
  choice: utukufu mkuu
  rationale: Ni tafsiri ya asili na yenye hadhi ya πολλῆς inayovumisha ukubwa wa utukufu bila usemi usio wa kawaida wa “utukufu mwingi.”
theological_decisions:
- issue: Tafsiri ya cheo cha Kikristo τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi matumizi yake kama cheo na mwangwi wa Danieli 7 bila kufupisha maana yake kuwa ubinadamu kwa ujumla.
- issue: Taswira ya wingu na mwangwi wa Danieli/kujitokeza kwa Mungu
  choice: katika wingu
  alternative: juu ya wingu
  rationale: Tafsiri inafuata kwa karibu umbo la Luka, ambalo lina wingu moja na kihusishi ἐν, bila kulisawazisha na vifungu vingine; tanbihi huhifadhi uwezekano wa kuelewa “juu ya wingu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja, huku “Mwana wa Adamu” na “utukufu mkuu” zikihifadhi sajili ya kibiblia inayoeleweka kwa wasomaji wa kawaida.
