base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: sw
  text: 'Na baadhi ya watu walipokuwa wakizungumzia hekalu[a], wakisema kwamba limepambwa kwa mawe mazuri na zawadi zilizowekwa wakfu[b], alisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha eneo lote la hekalu kwa ujumla, si jengo la patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: b
    text: Yaani, vitu vilivyotolewa kwa Mungu na kuwekwa hekaluni.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Baadhi ya watu walipokuwa wakizungumza
  rationale: Muundo wa genitivi huru unaonyesha hali ya wakati inayoendelea; kifungu hiki ni cha kawaida katika Kiswahili na kinahifadhi maana hiyo.
- source_word: τοῦ ἱεροῦ
  choice: hekalu
  rationale: ἱερόν hapa inarejelea eneo lote la hekalu, si patakatifu pa ndani pekee. “Hekalu” ndiyo tafsiri ya kawaida na inayoeleweka, huku tanbihi ikifafanua upana wa maana.
- source_word: λίθοις καλοῖς
  choice: kwa mawe mazuri
  rationale: Tafsiri hii inaonyesha uzuri na ubora wa kuvutia wa mawe bila kuongeza wazo lisilokuwamo katika neno la Kigiriki.
- source_word: ἀναθήμασιν
  choice: zawadi zilizowekwa wakfu
  rationale: Neno hilo linamaanisha vitu vilivyotolewa kwa Mungu na kuwekwa hekaluni. “Zawadi” huepuka kuvichanganya moja kwa moja na dhabihu, na “zilizowekwa wakfu” huhifadhi maana ya kuwekwa kwa matumizi matakatifu.
- source_word: κεκόσμηται
  choice: lilikuwa limepambwa
  rationale: Wakati timilifu wa hali ya kutendwa unaonyesha tendo lililokamilika ambalo matokeo yake yaliendelea kuonekana; muundo huu wa Kiswahili unaonyesha hali hiyo kwa kawaida.
- source_word: εἶπεν
  choice: alisema
  rationale: Kitenzi cha Kigiriki hakitaji jina “Yesu” waziwazi. “Alisema” kinadumisha mtiririko wa masimulizi bila kuongeza jina.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Zawadi zilizowekwa wakfu” ni rahisi kueleweka kuliko istilahi nzito zaidi, na alama ya nukta mbili inaonyesha kwamba maneno ya Yesu yanafuata katika mstari unaofuata.
