base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: sw
  text: Wakati wa mchana alikuwa akifundisha katika eneo la Hekalu,[a] lakini usiku alikuwa akitoka na kulala kwenye mlima unaoitwa Mlima wa Mizeituni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la Hekalu pamoja na nyua zake, si patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “kukaa usiku”; kitenzi hiki kinaweza pia kudokeza kukaa usiku mahali pa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: alikuwa akifundisha
  rationale: Muundo wa kitenzi cha hali isiyotimilika pamoja na kivumishi-tendo unaonyesha shughuli iliyoendelea na iliyokuwa desturi; Kiswahili cha “alikuwa akifundisha” huhifadhi maana hiyo kwa kawaida.
- source_word: τὰς ἡμέρας
  choice: wakati wa mchana
  rationale: Usemi huu unaonyesha muda wa shughuli na unatofautishwa na nyakati za usiku; “wakati wa mchana” ni Kiswahili cha asili kinachoonyesha desturi ya kila siku bila kulazimisha wingi wa kimuundo.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la Hekalu
  rationale: ἱερόν hapa ni eneo lote la Hekalu, si patakatifu pa ndani pekee. “Eneo la Hekalu” linaweka wazi upana huo huku likibaki la kawaida na lenye heshima.
- source_word: τὰς δὲ νύκτας
  choice: lakini usiku
  rationale: δέ inaonyesha utofautishaji kati ya shughuli ya mchana na ya usiku; “lakini usiku” ni ya kawaida na huhifadhi utofautishaji huo.
- source_word: ἐξερχόμενος
  choice: alikuwa akitoka
  rationale: Kivumishi-tendo hiki kinaeleza tendo lililorudiwa sambamba na kukaa usiku; muundo wa “alikuwa akitoka” unaonyesha desturi hiyo.
- source_word: ηὐλίζετο
  choice: kukaa usiku kucha
  rationale: Kitenzi αὐλίζομαι humaanisha kukaa au kulala mahali usiku, na huenda kikadokeza kukaa nje. “Kukaa usiku kucha” ni wazi bila kuamua kama alilala ndani au wazi.
- source_word: εἰς τὸ ὄρος
  choice: kwenye mlima
  rationale: Ingawa εἰς kimsingi huonyesha mwelekeo, pamoja na kitenzi cha kukaa usiku inaelekea kwenye mahali pa mwisho; “kwenye mlima” ni Kiswahili cha kawaida katika sentensi hii.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: unaoitwa Mlima wa Mizeituni
  rationale: Ἐλαιῶν ni wingi wa milikishi wenye maana ya mizeituni; jina la mahali lililozoeleka kwa Kiswahili ni “Mlima wa Mizeituni.”
