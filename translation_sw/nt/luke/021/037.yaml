  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaonyesha desturi iliyorudiwa ya Yesu ya kufundisha mchana na kwenda kukaa mlimani usiku. Alama za tanbihi zimewekwa mara baada ya maneno yanayofafanuliwa.
