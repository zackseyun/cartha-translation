  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: sw
  text: Lakini mambo haya yatakapoanza kutukia[a], jinyosheni na muinue vichwa vyenu[b], kwa sababu ukombozi wenu[c] unakaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo haya yanapoanza kutokea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tazameni juu na muinue vichwa vyenu.”
    reason: lexical_alternative
  - marker: c
    text: “Ukombozi” unaweza pia kutafsiriwa “kuwekwa huru”; hapa unamaanisha ukombozi wa mwisho wa watu wa Yesu unaokaribia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: mambo haya yatakapoanza kutukia
  rationale: Muundo huu unaonyesha hali ya wakati—‘wakati mambo haya yanapoanza kutukia’—na unahifadhi maana za kuanza na kutokea bila kufanya sentensi iwe nzito.
- source_word: δέ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye tofauti ndogo kutoka dhiki iliyotangulia kwenda katika moyo wa matumaini.
- source_word: ἀνακύψατε
  choice: jinyosheni
  rationale: Kitenzi kinaweza kumaanisha kuinuka au kujinyoosha kutoka hali ya kuinama. ‘Jinyosheni’ kinahifadhi picha hiyo pamoja na maana ya kupata moyo.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: muinue vichwa vyenu
  rationale: Tafsiri hii inahifadhi picha halisi ya kuinua vichwa kama ishara ya tumaini na ujasiri.
- source_word: διότι
  choice: kwa sababu
  rationale: Hutoa wazi uhusiano wa sababu katika Kiswahili cha sasa.
- source_word: ἐγγίζει
  choice: unakaribia
  rationale: Wakati uliopo unaonyesha kwamba ukombozi unazidi kuwa karibu, si tu kwamba uko karibu bila mwendo.
- source_word: ἀπολύτρωσις
  choice: ukombozi
  rationale: ‘Ukombozi’ ni neno la kawaida lenye maana pana ya kuwekwa huru au kuokolewa, na linahifadhi uzito wa maana ya wokovu katika muktadha huu.
theological_decisions:
- issue: Maana ya ‘ukombozi wenu’ katika hotuba kuhusu mambo ya mwisho
  choice: Imetafsiriwa ‘ukombozi wenu,’ bila kufafanua ndani ya mstari namna utakavyotimizwa.
  alternative: ‘kuokolewa kwenu’ au ‘kuwekwa huru kwenu,’ kueleweka kama kuponyoka katika mgogoro wa kihistoria pekee
  rationale: Muktadha unatazamia matukio ya baadaye na ukombozi wa wanafunzi wa Yesu. Neno ‘ukombozi’ linahifadhi kina na upana wa ἀπολύτρωσις bila kuufanya kuwa kuponyoka kisiasa tu wala hali ya kiroho isiyohusiana na matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Amri za wingi ‘jinyosheni’ na ‘muinue’ zinadumisha picha ya kimwili inayowasilisha tumaini na ujasiri.
