  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: sw
  text: Lakini mtakapoona Yerusalemu limezungukwa na majeshi[a], ndipo mjue kwamba ukiwa wake umekaribia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kambi za kijeshi.” Neno la Kigiriki linaweza kumaanisha kambi au majeshi yaliyopiga kambi; hapa linarejelea vikosi vinavyozingira Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: “Ukiwa” unatoa mwangwi wa lugha ya manabii kuhusu hukumu; linganisha maneno yanayohusiana katika Mathayo 24:15 na Marko 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν
  choice: mtakapo-
  rationale: 'Muundo wa wakati wenye maana ya tukio la wakati ujao unatoa Kiswahili cha kawaida na cha kinabii: “mtakapoona.”'
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji wa kiasi kutoka maneno yaliyotangulia bila kuutia nguvu kupita kiasi.
- source_word: ἴδητε
  choice: mtakapoona
  rationale: Kitenzi cha kuona kimeunganishwa kwa kawaida na kishazi cha wakati ujao; wingi wa nafsi ya pili umehifadhiwa.
- source_word: κυκλουμένην
  choice: limezungukwa
  rationale: Hueleza hali ya Yerusalemu kuwa limezingirwa pande zote; kauli tendwa imehifadhiwa.
- source_word: ὑπὸ στρατοπέδων
  choice: na majeshi
  rationale: Ingawa στρατόπεδον inaweza kumaanisha kambi ya kijeshi, katika muktadha huu inarejelea vikosi vinavyolizingira jiji; “majeshi” ni wazi na ya kawaida.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: τότε
  choice: ndipo
  rationale: “Ndipo” huonyesha kwa ufupi matokeo yanayofuata ishara hiyo.
- source_word: γνῶτε
  choice: mtakapojua
  rationale: Huwasilisha agizo la kuitambua maana ya ishara katika mtiririko wa kawaida wa Kiswahili.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Kauli timilifu inaonyesha kwamba ukiwa umefika karibu; “umekaribia” huhifadhi hali iliyotokana na kusogea karibu.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: ukiwa wake
  rationale: “Ukiwa” huhifadhi maana ya kuachwa ukiwa au kuharibiwa pamoja na mwangwi wa lugha ya hukumu ya kinabii; “wake” humrejelea Yerusalemu kwa upatanisho wa nomino wa Kiswahili bila kulazimisha uhuishaji wa jiji.
theological_decisions:
- issue: Maana ya hukumu inayoujia Yerusalemu
  choice: Kutafsiri ἐρήμωσις kuwa “ukiwa” bila kubainisha mfumo fulani wa baadaye wa ufasiri.
  alternative: Kutumia “uharibifu” au kuunganisha moja kwa moja na “chukizo la uharibifu” katika matini kuu.
  rationale: Aya yenyewe inasema kwamba ukiwa wa Yerusalemu unakaribia wakati majeshi yanapolizunguka. “Ukiwa” huhifadhi uzito wa kileksika na wa kinabii bila kuingiza mpangilio wa kieskatolojia ambao aya hauelezi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku “ukiwa” ukihifadhi msamiati wa kinabii. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
