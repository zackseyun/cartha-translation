  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: sw
  text: Kutakuwa na ishara katika jua, mwezi na nyota; na duniani, mataifa yatakuwa na dhiki na kuchanganyikiwa kwa sababu ya sauti ya bahari na msukosuko wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya moja kwa moja zaidi: “kwa sauti ya bahari na msukosuko wake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: ishara
  rationale: Neno “ishara” ni la kawaida na pana; linaonyesha matukio ya ajabu bila kuyafafanua zaidi kuwa mabashiri ya maafa.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: katika jua, mwezi na nyota
  rationale: Huhifadhi muundo wa Kigiriki na kwa Kiswahili huonyesha kwamba ishara hizo zitahusiana na mianga hiyo ya angani.
- source_word: συνοχὴ ἐθνῶν
  choice: mataifa yatakuwa na dhiki
  rationale: “Dhiki” huwasilisha hali ya kubanwa na taabu; muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino nzito “dhiki ya mataifa.”
- source_word: ἐν ἀπορίᾳ
  choice: na kuchanganyikiwa
  rationale: Hueleza hali ya mataifa kukosa njia au jibu. Kiunganishi “na” kinaunganisha kwa lugha ya kawaida hali hiyo na dhiki.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: kwa sababu ya ngurumo ya bahari na msukosuko wake
  rationale: “Ngurumo” huwasilisha sauti kubwa ya bahari, na “msukosuko wake” huhifadhi wazo la kuchafuka na kutikisika kwa bahari bila kuongeza “mawimbi,” ambalo halijatajwa wazi katika Kigiriki.
theological_decisions:
- issue: Hali ya ishara za angani
  choice: Kutaja ishara katika jua, mwezi na nyota bila kuzifafanua kuwa halisi tu au za mfano tu.
  alternative: Kuzitafsiri wazi kuwa misukosuko halisi ya angani au picha za mfano za kisiasa.
  rationale: Mstari wenyewe hauamui ikiwa ishara hizo ni matukio halisi, lugha ya mfano, au vyote viwili; tafsiri inadumisha mvutano huo.
- issue: Uhusiano wa sauti na msukosuko wa bahari na dhiki ya mataifa
  choice: “kwa sababu ya”
  alternative: “kwa/katika hali ya” au “wakisikia”
  rationale: Muundo wa Kigiriki unaweza kuhusisha dhiki na hali ya bahari; “kwa sababu ya” huonyesha uhusiano wa kisababishi unaoeleweka kiasili, bila kufafanua zaidi utaratibu wa matukio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa nukta mkato ili muundo wa angani na wa duniani uwe wazi. “Msukosuko wake” huepuka kuongeza “mawimbi” yasiyotajwa wazi katika matini ya Kigiriki.
