  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: sw
  text: Lakini mtakabidhiwa hata na wazazi, ndugu wa kiume[a], jamaa na marafiki, nao watawaua baadhi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike,” kwa kuwa wingi wa kiume wa Kigiriki unaweza wakati mwingine kurejelea kundi lenye jinsia zote.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: mtakabidhiwa
  rationale: Kitenzi hiki cha wakati ujao na kauli tendwa kina maana ya kutiwa mikononi mwa wenye mamlaka au wapinzani. “Mtakabidhiwa” huhifadhi maana hiyo bila kuifanya moja kwa moja kuwa “mtasalitiwa,” ingawa usaliti unaonekana katika kutajwa kwa watu wa karibu.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mwendelezo wenye utofauti mdogo na ahadi iliyotangulia; “Lakini” huleta geuko hilo kwa kawaida.
- source_word: καὶ
  choice: hata
  rationale: 'Hapa ina mkazo wa kupandisha uzito: si wapinzani wa nje tu, bali hata watu wa karibu watawakabidhi.'
- source_word: γονέων
  choice: wazazi
  rationale: Ni neno la kawaida na jumuishi kwa baba na mama.
- source_word: ἀδελφῶν
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida la uhusiano huu na linaweza kumaanisha ndugu wa kiume au ndugu wa familia kwa upana; tanbihi inadokeza uwezekano huo wa Kigiriki.
- source_word: συγγενῶν
  choice: jamaa
  rationale: Hurejelea watu wa ukoo au familia pana; “jamaa” ni la asili na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: φίλων
  choice: marafiki
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno hili.
- source_word: θανατώσουσιν
  choice: watawaua
  rationale: Kitenzi humaanisha kusababisha kifo. “Watawaua” ni wazi na cha kawaida, bila kubainisha njia ya kuuawa.
- source_word: ἐξ ὑμῶν
  choice: baadhi yenu
  rationale: Hii ni nahau inayomaanisha sehemu ya kundi, si wote; “baadhi yenu” ndiyo Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ἀδελφῶν katika orodha ya mahusiano ya kifamilia
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Wingi wa kiume wa Kigiriki unaweza kumaanisha ndugu wa kiume hasa, lakini katika mazingira fulani unaweza kuwakilisha kundi lenye ndugu wa kiume na wa kike. Neno la Kiswahili “ndugu” huhifadhi upana huo wa maana bila kuulazimisha upande mmoja; tanbihi inaeleza jambo hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa kauli tendwa umehifadhiwa katika “mtakabidhiwa,” na “hata” huonyesha uzito wa kukabidhiwa na watu wa karibu.
