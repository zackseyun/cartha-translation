  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: sw
  text: “Kuhusu vitu hivi mnavyovitazama,[a] siku zitakuja ambazo hakuna jiwe hata moja litakaloachwa juu ya jingine ambalo halitabomolewa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnavyoviona.” Kitenzi cha Kigiriki kinaweza kumaanisha kuona kwa ujumla au kutazama kwa makini.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “halitaachwa jiwe juu ya jiwe ambalo halitabomolewa”; huu ni usemi unaosisitiza uharibifu kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Kuhusu vitu hivi mnavyovitazama
  rationale: “Kuhusu” linaonyesha kwamba Ταῦτα limetangulizwa kuwa mada, na “mnavyovitazama” linahifadhi maana ya kuangalia au kutazama kwa makini iliyo katika θεωρεῖτε.
- source_word: ἐλεύσονται ἡμέραι
  choice: siku zitakuja
  rationale: Huu ni usemi wa kawaida unaoelekeza kwenye matukio yajayo; pia unafuata wakati ujao wa Kigiriki bila kuongeza kibainishi kisichokuwapo.
- source_word: ἐν αἷς
  choice: ambapo
  rationale: Katika muktadha huu kishazi hiki kina maana ya wakati; “ambapo” ni cha asili katika Kiswahili na huunganisha siku zijazo na tukio litakalotokea.
- source_word: οὐκ ἀφεθήσεται
  choice: hakuna ... litakaloachwa
  rationale: Kitenzi tendwa kina maana ya kuachwa au kubaki. “Litakaloachwa” huhifadhi umbo tendwa na linafaa katika muktadha wa ubomoaji.
- source_word: λίθος ἐπὶ λίθῳ
  choice: jiwe hata moja ... juu ya jingine
  rationale: Usemi huu unaeleza uharibifu kamili. “Hata moja” huonyesha wazi nguvu ya ukanushi huku “juu ya jingine” likihifadhi taswira ya mawe ya jengo.
- source_word: ὃς οὐ καταλυθήσεται
  choice: bila kubomolewa
  rationale: 'Katika muktadha wa majengo, καταλύω humaanisha kubomoa au kuvunja. “Bila kubomolewa” huwasilisha nguvu ya kishazi cha Kigiriki kwa Kiswahili cha kawaida: hakuna jiwe litakalosalia bila kubomolewa.'
theological_decisions:
- issue: Upeo na nguvu ya utabiri wa Yesu kuhusu majengo ya hekalu
  choice: Kauli imetafsiriwa kama utabiri halisi wa kubomolewa kabisa kwa majengo yanayoonekana.
  alternative: Kuifanya hasa kuwa ishara ya hukumu, au kuifungamanisha wazi na mfumo fulani wa matukio ya mwisho.
  rationale: Kigiriki kinazungumzia moja kwa moja vitu vinavyoonekana na mawe kubomolewa. Tafsiri inadumisha nguvu hiyo halisi bila kuongeza mfumo wa kiteolojia ambao mstari wenyewe hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vitu hivi” linaendana na rejeo la karibu la majengo na mapambo yaliyotajwa katika muktadha, bila kuongeza neno “hekalu” lisilokuwapo katika mstari huu. Alama zote za tanbihi zimewekwa katika matini kuu.
