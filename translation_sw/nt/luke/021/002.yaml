  text: Akamwona mjane mmoja maskini akitia humo sarafu mbili ndogo za shaba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “lepta mbili,” yaani, sarafu mbili ndogo sana za shaba.'
