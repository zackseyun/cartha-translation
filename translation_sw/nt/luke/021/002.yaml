lexical_decisions:
- source_word: εἶδεν
  choice: akamwona
  rationale: Kauli ya wakati uliopita ya ὁράω ina maana ya moja kwa moja ya kuona; “akamwona” pia huendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: δέ
  choice: aka-
  rationale: δέ ni kiunganishi hafifu cha simulizi. Katika Kiswahili, mfululizo huo unaelezwa kwa kawaida kwa kiambishi cha wakati -ka- badala ya neno tofauti kama “na” au “lakini.”
- source_word: τινα
  choice: mmoja
  rationale: τις humtambulisha mtu asiyeainishwa. “Mjane mmoja” ni njia ya kawaida ya Kiswahili ya kuhifadhi hali hiyo ya kutotajwa wazi.
- source_word: χήραν
  choice: mjane
  rationale: χήρα humaanisha moja kwa moja mwanamke aliyefiwa na mume; “mjane” ni neno la kawaida na lenye heshima.
- source_word: πενιχρὰν
  choice: maskini
  rationale: πενιχρός hueleza mtu mwenye uwezo mdogo wa kifedha. “Maskini” ni sahihi na ya kawaida bila kuzidisha maana hadi ufukara wa kupindukia.
- source_word: βάλλουσαν
  choice: akitia
  rationale: Ingawa βάλλω kwa msingi inaweza kumaanisha kutupa, katika muktadha wa kuweka fedha kwenye sanduku la sadaka, “akitia” ni Kiswahili cha kawaida na sahihi.
- source_word: ἐκεῖ
  choice: humo
  rationale: Mahali panajulikana kutokana na muktadha uliotangulia. “Humo” huonyesha kwa kawaida kwamba sarafu ziliwekwa ndani ya mahali au chombo hicho.
- source_word: λεπτὰ δύο
  choice: sarafu mbili ndogo za shaba
  rationale: λεπτά ni sarafu mbili za thamani ndogo sana, kwa kawaida za shaba. Tafsiri hii inaeleza idadi, ukubwa/thamani ndogo, na aina ya sarafu kwa msomaji wa sasa.
