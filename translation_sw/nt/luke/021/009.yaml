  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: sw
  text: Lakini mtakaposikia habari za vita na machafuko[a], msiingiwe na hofu; kwa maana mambo hayo hayana budi kutokea kwanza, lakini mwisho hautakuja mara moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vurugu,” “misukosuko,” au “hali ya kutokuwa na utaratibu.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa karibu zaidi na muundo wa Kigiriki, “lakini mwisho si mara moja.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini mtakaposikia
  rationale: ὅταν huanzisha hali ya wakati ujao isiyoainishwa, nayo δέ ni kiunganishi chepesi kinachoendeleza onyo kwa mguso wa utofautishaji; “Lakini mtakapo-” ni ya asili katika Kiswahili.
- source_word: ἀκούσητε
  choice: mtakaposikia juu ya
  rationale: Katika kishazi hiki cha wakati, kitenzi kinahusu kusikia habari za matukio; “kusikia juu ya” huwasilisha maana hiyo kwa uwazi.
- source_word: πολέμους
  choice: vita
  rationale: Ni tafsiri ya moja kwa moja ya wingi unaorejelea mapigano ya silaha; kwa Kiswahili “vita” hutumika kwa umoja na wingi kulingana na muktadha.
- source_word: ἀκαταστασίας
  choice: machafuko
  rationale: Neno hili linaweza kumaanisha hali ya vurugu, kutotulia, au kuvurugika kwa utaratibu. “Machafuko” ni pana na ya kawaida bila kuibana maana iwe maasi pekee.
- source_word: μὴ πτοηθῆτε
  choice: msiingiwe na hofu
  rationale: Amri hii inakataza kushikwa na woga au taharuki. “Msiingiwe na hofu” ni ya asili, yenye uzito, na haipunguzi nguvu ya usemi.
- source_word: δεῖ γὰρ
  choice: kwa maana ... hayana budi
  rationale: γάρ hutoa sababu, na δεῖ huonyesha ulazima. Muundo “kwa maana ... hayana budi” unahifadhi yote mawili kwa Kiswahili cha kawaida chenye hadhi.
- source_word: ταῦτα γενέσθαι
  choice: mambo hayo hayana budi kutokea
  rationale: γίνομαι hapa hurejelea matukio yanayotokea; “kutokea” ni wazi na ya kawaida.
- source_word: πρῶτον
  choice: kwanza
  rationale: 'Huonyesha mpangilio wa matukio: mambo hayo yanatangulia mwisho.'
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: lakini mwisho hautakuja mara moja
  rationale: Kigiriki hakina kitenzi wazi katika sehemu hii, lakini Kiswahili huhitaji usemi kamili wa kawaida. “Hautakuja mara moja” huonyesha maana ya muda bila kufafanua mfumo maalumu wa nyakati za mwisho.
theological_decisions:
- issue: Kauli kuhusu wakati wa mwisho
  choice: Vita na machafuko hayamaanishi kwamba mwisho utakuja mara moja.
  alternative: Matukio hayo ni lazima yatokee kwanza, lakini yenyewe si mwisho.
  rationale: Tafsiri inadumisha onyo la Yesu dhidi ya kuhusianisha mara moja habari za misukosuko na kuwasili kwa mwisho, bila kuingiza mpangilio maalumu wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Machafuko” limechaguliwa kwa upana wake wa maana; “msiingiwe na hofu” linaeleweka kwa urahisi huku likihifadhi nguvu ya katazo. Alama zote za tanbihi zimewekwa katika matini kuu.
