lexical_decisions:
- source_word: θέτε
  choice: azimieni
  rationale: Katika kirai hiki cha kiidioma pamoja na “mioyoni mwenu,” kitenzi hiki kina maana ya kuweka uamuzi thabiti moyoni. “Azimieni” ni Kiswahili cha kawaida na huhifadhi nguvu ya amri.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na muktadha uliotangulia; “Kwa hiyo” huunganisha hoja kwa wazi na kwa kawaida.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Huhifadhi wingi wa Kigiriki na taswira ya kibiblia ya moyo kama kitovu cha nia na uamuzi wa ndani.
- source_word: μὴ
  choice: kuto-
  rationale: Hukanusha tendo linalotegemea amri kuu; muundo “azimieni ... kutotayarisha” ni wa asili katika Kiswahili.
- source_word: προμελετᾶν
  choice: kutotayarisha mapema
  rationale: Kitenzi huonyesha kufikiria, kupanga, au kufanya mazoezi kabla. “Kutotayarisha mapema” ni wazi na hakifungi maana kwenye kukariri pekee.
- source_word: ἀπολογηθῆναι
  choice: jinsi ya kujitetea
  rationale: Katika muktadha wa mashtaka au usikilizwaji rasmi, kitenzi humaanisha kutoa utetezi. “Kujitetea” huhifadhi maana hiyo pamoja na hali ya kujihusu ya kitenzi.
