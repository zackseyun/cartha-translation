  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: sw
  text: kama mtego.[a] Kwa maana itawajia watu wote wanaoishi juu ya uso wa dunia yote.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama tanzi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wote wanaokaa juu ya uso wa dunia yote.” Neno la Kigiriki lina maana ya msingi ya kuketi, lakini katika msemo huu humaanisha kukaa au kuishi mahali.
    reason: lexical_alternative
  - marker: c
    text: Au, “nchi yote,” ingawa “dunia yote” linafaa zaidi kwa upeo wa usemi huu hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: kama mtego
  rationale: Neno παγίς humaanisha mtego au tanzi. “Mtego” ni neno la kawaida na wazi katika Kiswahili cha sasa, nalo linadumisha picha ya jambo linalokuja kwa ghafula na kumnasa mtu.
- source_word: ἐπεισελεύσεται
  choice: itawajia
  rationale: Kitenzi hiki cha wakati ujao kinaonyesha kuja juu ya watu au kuwafikia. “Itawajia” ni Kiswahili cha asili kinachodumisha wazo la kuja kwa tukio hilo; kiima kinachoeleweka kutokana na mstari uliotangulia ni siku hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya onyo lililotangulia. “Kwa maana” kinadumisha uhusiano huo kwa mtindo wenye heshima na wa kawaida katika maandishi.
- source_word: ἐπὶ πάντας
  choice: watu wote
  rationale: Muundo huu unaonyesha kwamba tukio hilo litawajia wote bila kumwacha yeyote katika kundi linalotajwa. Kuunganisha kihusishi na kitenzi katika “itawajia watu wote” kunatoa Kiswahili cha asili.
- source_word: τοὺς καθημένους
  choice: wanaoishi
  rationale: Ingawa κάθημαι kwa maana ya msingi ni “kuketi,” katika msemo huu hurejelea watu wanaokaa au kuishi duniani. “Wanaoishi” huwasilisha maana ya kimuktadha bila kutoa picha potovu ya watu walioketi.
- source_word: ἐπὶ πρόσωπον
  choice: juu ya uso wa
  rationale: Huu ni msemo wenye athari ya Kisemiti unaomaanisha kuwa juu ya uso wa kitu. Tafsiri hii inadumisha taswira ya chanzo na bado inaeleweka kwa Kiswahili.
- source_word: πάσης τῆς γῆς
  choice: dunia yote
  rationale: γῆ linaweza kumaanisha dunia au nchi. Katika onyo hili lenye upeo mpana, “dunia yote” linafaa zaidi huku uwezekano wa “nchi yote” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa γῆ katika onyo kuhusu siku inayokuja
  choice: dunia yote
  alternative: nchi yote
  rationale: γῆ linaweza kumaanisha “nchi” au “dunia,” lakini usemi unaowahusu watu wote wanaoishi juu ya uso wake unaelekea kuonyesha upeo wa ulimwengu mzima. Tanbihi inadumisha uwezekano wa kileksika bila kupunguza kimakusudi upana wa onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “juu ya uso wa dunia yote” unadumisha taswira ya chanzo, huku “itawajia watu wote wanaoishi” ukifanya sentensi isikike kwa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
