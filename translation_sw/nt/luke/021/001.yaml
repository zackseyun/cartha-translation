  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: sw
  text: Kisha akatazama juu, akawaona matajiri wakitia zawadi zao katika hazina[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matoleo yao” badala ya “zawadi zao.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “hazina” linaweza kumaanisha eneo la hazina ya hekalu au vyombo vya kupokelea matoleo.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: akatazama juu
  rationale: Kirai hiki kinaonyesha kuinua macho na kutazama juu; tafsiri hii ni ya kawaida na huhifadhi tendo la kisimulizi.
- source_word: δὲ
  choice: Kisha
  rationale: Kiunganishi hiki ni chepesi na hapa kinaendeleza simulizi bila kusisitiza tofauti.
- source_word: εἶδεν
  choice: akawaona
  rationale: Hutoa maana ya moja kwa moja ya kuona, bila kuongeza wazo la kuchunguza kwa makini.
- source_word: τοὺς βάλλοντας
  choice: wakitia
  rationale: Ingawa βάλλω inaweza kumaanisha kutupa, katika muktadha wa matoleo, 'kutia' ni ya asili na inaeleweka vizuri.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: katika hazina
  rationale: γαζοφυλάκιον inaweza kumaanisha eneo la hazina ya hekalu au vyombo vya kupokelea matoleo; 'hazina' huhifadhi upana huo wa maana.
- source_word: τὰ δῶρα αὐτῶν
  choice: zawadi zao
  rationale: δῶρα kimsingi ni zawadi; katika muktadha huu ni vitu au fedha zilizotolewa. 'Matoleo yao' ni tafsiri mbadala inayofaa kimuktadha.
- source_word: πλουσίους
  choice: matajiri
  rationale: Kivumishi hiki kimetumika kama nomino kuwataja watu wenye mali; 'matajiri' ni tafsiri fupi na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Tafsiri inadumisha utata wa γαζοφυλάκιον kwa kutumia “hazina” na kulifafanua katika tanbihi.
