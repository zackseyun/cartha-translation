lexical_decisions:
- source_word: ὑπομονῇ
  choice: ustahimilivu
  rationale: Neno hili linaonyesha kudumu imara chini ya majaribu. “Ustahimilivu” ni Kiswahili cha kawaida na chenye heshima kinachofaa muktadha wa mateso.
- source_word: κτήσασθε
  choice: jipatieni
  rationale: Katika matini ya SBLGNT, kitenzi hiki ni amri ya nafsi ya pili wingi, katika kauli ya kati. “Jipatieni” huhifadhi nguvu ya amri na wazo la kupata kwa ajili yenu wenyewe; usomaji wa wakati ujao umewekwa katika tanbihi.
- source_word: ψυχὰς
  choice: uhai
  rationale: Katika muktadha huu ψυχή linaweza kumaanisha uhai, nafsi, au mtu mwenyewe. “Uhai” linafaa kwa mazungumzo kuhusu mateso, kifo, na kuhifadhiwa hatimaye bila kulifanya neno hili limaanishe sehemu isiyo ya mwili pekee.
- source_word: ἐν
  choice: kwa
  rationale: Hapa ἐν pamoja na hali ya dative inaonyesha njia au namna. “Kwa ustahimilivu wenu” ni usemi wa asili unaowasilisha maana hiyo.
theological_decisions:
- issue: Maana ya ψυχή katika muktadha wa mateso ya nyakati za mwisho
  choice: uhai kwa maana pana ya mtu anayeishi
  alternative: nafsi
  rationale: “Uhai” huhifadhi wigo mpana wa neno la Kigiriki na mvutano kati ya hatari ya kifo cha mwili na kuhifadhiwa hatimaye, bila kuamua kwamba kinacholengwa ni sehemu isiyo ya mwili tu.
- issue: Amri au ahadi ya wakati ujao katika κτήσασθε
  choice: 'amri: “jipatieni”'
  alternative: 'wakati ujao: “mtajipatia”'
  rationale: Matini iliyotolewa ya SBLGNT ina umbo la amri, kwa hiyo limedumishwa katika matini kuu. Usomaji wa wakati ujao ni tofauti halisi ya kimatini na umeonyeshwa katika tanbihi badala ya kuchanganywa kimya kimya na matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umehifadhiwa kwa kufuata matini ya SBLGNT, huku tofauti ya kimatini na upana wa maana ya ψυχή vikielezwa kwa tanbihi.
