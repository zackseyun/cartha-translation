base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: sw
  text: Nao wataanguka kwa makali ya upanga na watapelekwa mateka katika mataifa yote[a]. Yerusalemu utakanyagwa na mataifa[b] mpaka nyakati za mataifa zitimie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupelekwa mateka kwa Watu wa Mataifa wote” au “miongoni mwa Watu wa Mataifa wote.” Neno la Kigiriki linaweza kumaanisha “mataifa” au “Watu wa Mataifa,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yerusalemu utakanyagwa na Watu wa Mataifa.”
    reason: alternative_reading
  - marker: c
    text: Au, “mpaka nyakati za Watu wa Mataifa zitimie.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: wataanguka
  rationale: Kitenzi hiki katika muktadha wa vita ni nahau ya kuuawa; “wataanguka” huhifadhi taswira ya Kigiriki bila kufafanua kupita kiasi.
- source_word: στόματι μαχαίρης
  choice: kwa makali ya upanga
  rationale: Kirai hiki ni “kwa kinywa cha upanga” kihalisi. “Kwa makali ya upanga” ni Kiswahili cha kawaida kinachohifadhi taswira na maana ya kuuawa kwa upanga.
- source_word: αἰχμαλωτισθήσονται
  choice: kuchukuliwa mateka
  rationale: Huhifadhi hali ya kutendwa na maana ya kukamatwa na kupelekwa kama wafungwa.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: miongoni mwa mataifa yote
  rationale: εἰς inaonyesha mwendo kuelekea na kuingia au kutawanywa miongoni mwa mataifa; usemi huu ni wa asili katika Kiswahili na haupotezi wazo la uhamisho.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: πατουμένη
  choice: itakanyagwa
  rationale: Muundo wa kitenzi unaonyesha hali ya baadaye inayoendelea; “itakanyagwa” huhifadhi taswira ya kutiishwa na kudhalilishwa.
- source_word: ὑπὸ ἐθνῶν
  choice: na mataifa
  rationale: Huhifadhi maana ya mtendaji na mshikamano wa neno ἔθνη katika aya nzima.
- source_word: ἄχρι οὗ
  choice: mpaka
  rationale: Ni kiunganishi cha wakati kilicho wazi na cha kawaida katika Kiswahili.
- source_word: πληρωθῶσιν
  choice: zitimie
  rationale: “Zitimie” huweza kumaanisha kufikia ukomo uliowekwa au kutimizwa, bila kuingiza mpangilio maalumu wa kinabii.
- source_word: καιροὶ ἐθνῶν
  choice: nyakati za mataifa
  rationale: “Nyakati” huhifadhi wazo la vipindi muhimu au vilivyowekwa, huku “za mataifa” ikiacha uhusiano wa umilikishi ukiwa na upeo wake wa asili.
theological_decisions:
- issue: Maana ya ἔθνη katika aya nzima
  choice: mataifa
  alternative: Watu wa Mataifa
  rationale: Neno lilelile la Kigiriki limetumika mara tatu. “Mataifa” huhifadhi mshikamano wa kileksika na kutolazimisha mapema iwapo mkazo ni mataifa ya kisiasa au watu wasio Wayahudi. Uwezekano wa “Watu wa Mataifa” umehifadhiwa katika tanbihi.
- issue: Maana ya καιροὶ ἐθνῶν
  choice: nyakati za mataifa zitimie
  alternative: nyakati za Watu wa Mataifa zitimie
  rationale: Tafsiri hii huhifadhi wazo la kipindi chenye ukomo bila kuingiza mfumo fulani wa matukio ya mwisho; pia huacha ἐθνῶν na πληρωθῶσιν zikiwa na mvutano wao wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili kwa usomaji wa kawaida. “Nao” huunganisha aya hii na muktadha uliotangulia; “mateka,” “itakanyagwa,” na “zitimie” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito wa kifungu.
