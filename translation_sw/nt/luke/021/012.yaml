  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: sw
  text: Lakini kabla ya mambo haya yote, watawakamata[a] na kuwatesa, wakiwakabidhi kwenye masinagogi na magerezani, na kuwapeleka mbele ya wafalme na watawala kwa sababu ya jina langu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wataweka mikono yao juu yenu,” yaani watawakamata kwa uhasama au kuwatendea vibaya.
    reason: lexical_alternative
  - marker: b
    text: “Kwa sababu ya jina langu” pia inaweza kutafsiriwa “kwa ajili ya jina langu,” au kwa kufafanua zaidi, “kwa sababu yangu.” Usemi “jina langu” unahusisha Yesu mwenyewe na mamlaka yake.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Lakini kabla ya mambo haya yote
  rationale: “Kabla ya” huonyesha utangulizi wa wakati, “yote” huwakilisha πάντων, na “lakini” huonyesha mpito wenye utofautishaji unaoletwa na δέ.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: watawakamata
  rationale: Hii ni nahau ya kuwakamata watu kwa uhasama au kuwatendea kwa nguvu. Tafsiri ya neno kwa neno, “wataweka mikono yao juu yenu,” ingeweza kueleweka vibaya katika Kiswahili kuwa tendo la baraka au la kidini; “watawakamata” huwasilisha maana ya muktadha kwa uwazi.
- source_word: διώξουσιν
  choice: kuwatesa
  rationale: Katika muktadha wa upinzani dhidi ya wanafunzi kwa sababu ya Yesu, kitenzi hiki humaanisha kuwatesa au kuwaudhi kwa uhasama, si kuwafuatilia tu.
- source_word: παραδιδόντες
  choice: wakiwakabidhi
  rationale: Kauli hii inaeleza namna mateso yatakavyotekelezwa, yaani kuwaweka mikononi mwa mamlaka au taasisi zenye uhasama.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: kwenye masinagogi na magerezani
  rationale: Majina ya taasisi yamehifadhiwa bila kuyapanua kuwa mamlaka au mahakama za masinagogi. “Kwenye” na “magerezani” ni miundo ya kawaida ya Kiswahili inayoonyesha kupelekwa katika maeneo hayo.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: na kuwapeleka mbele ya wafalme na watawala
  rationale: “Mbele ya” huonyesha kufikishwa kwa ajili ya kushughulikiwa na wenye mamlaka. Muundo amilifu wa Kiswahili unaendeleza wahusika wale wale wanaowakamata na kuwatesa, huku ukitoa kwa kawaida maana ya kauli tendwa ya Kigiriki kuhusu wanafunzi wanaopelekwa.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: kwa sababu ya jina langu
  rationale: Huhifadhi usemi wa kibiblia “jina langu,” unaohusisha nafsi na mamlaka ya Yesu, bila kuufafanua kwa namna finyu kuwa “kwa sababu yangu.”
theological_decisions:
- issue: Maana ya “jina langu” katika muktadha wa mateso
  choice: kwa sababu ya jina langu
  alternative: kwa sababu yangu; kwa ajili ya jina langu
  rationale: Usemi wa chanzo umehifadhiwa kwa sababu “jina” lina uzito wa kibiblia unaorejelea nafsi na mamlaka ya Yesu. Tafsiri haiongezi wazo maalumu kwamba wanateswa kwa kuwa wanaitwa kwa jina lake au kwa kuwa tu ni mali yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Masinagogi” limehifadhiwa kama neno la taasisi ya Kiyahudi, na “watawala” limetumiwa kwa ἡγεμόνας kwa upana unaofaa bila kulifunga kwa cheo kimoja cha kiutawala.
