source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: sw
  text: Nao wakamuuliza, wakisema, “Mwalimu, basi mambo haya yatatokea lini, na ni ishara gani mambo haya yatakapokuwa karibu kutukia?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo haya yatakapotukia?” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa maana pana zaidi kuliko “yatakapokuwa karibu kutukia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: wakamwuliza
  rationale: Kitenzi hiki kinasimulia tendo la kuuliza lililotokea; ‘wakamwuliza’ ni Kiswahili cha kawaida na kinaendeleza mtiririko wa simulizi.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani. ‘Nao’ kinaunganisha sentensi kwa kawaida.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kirai hiki kinaanzisha maneno halisi ya swali na kinaakisi muundo wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo neno la kawaida kwa mtu anayefundisha, bila kuongeza maana ya mamlaka iliyo katika ‘Bwana’ au ‘Mkuu.’
- source_word: πότε οὖν
  choice: basi ... lini
  rationale: ‘Lini’ huuliza wakati, na ‘basi’ huhifadhi maana ya hitimisho au mwendelezo unaotokana na maneno yaliyotangulia.
- source_word: ταῦτα ἔσται
  choice: mambo haya yatakuwa
  rationale: Tafsiri hii inabaki karibu na muundo wa εἰμί huku ikieleweka kama swali kuhusu wakati wa matukio hayo.
- source_word: σημεῖον
  choice: ishara
  rationale: ‘Ishara’ ni neno la kawaida kwa dalili inayoonyesha tukio muhimu.
- source_word: ὅταν
  choice: yatakapo-
  rationale: Muundo wa ‘-takapo-’ unaonyesha wakati wa baadaye kwa njia ya kawaida katika Kiswahili.
- source_word: μέλλῃ
  choice: yatakapokuwa karibu
  rationale: ‘Kuwa karibu’ huhifadhi dokezo la tukio linalokaribia bila kuamua kwa lazima umbali kamili wa wakati.
- source_word: γίνεσθαι
  choice: kutukia
  rationale: Katika muktadha huu kitenzi kinahusu matukio kutokea; ‘kutukia’ ni cha asili, wazi na chenye hadhi.
theological_decisions:
- issue: Maneno ya kieskatolojia na dokezo la wakati
  choice: Kuhifadhi swali kuhusu ‘ishara’ na kutafsiri μέλλῃ kwa ‘kuwa karibu kutukia.’
  alternative: Kutafsiri kwa maana pana zaidi, ‘yatakapotukia’ au ‘yanapoenda kutukia.’
  rationale: Kigiriki kinaweza kudokeza ukaribu wa tukio lakini hakiamui hapa mpangilio maalumu wa matukio ya mwisho. Tafsiri inahifadhi mvutano huo bila kuingiza mfumo fulani wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wakisema’ umehifadhiwa kwa ukaribu na chanzo, huku mpangilio wa swali ukirekebishwa ili usomeke kwa kawaida katika Kiswahili.
