  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: sw
  text: Lakini jilindeni, mioyo yenu isije ikalemewa na anasa za kupindukia[a], ulevi na mahangaiko ya maisha, wala siku ile isije ikawajia ghafula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe za kupindukia”; neno la Kigiriki linaweza kumaanisha kujiachilia kupita kiasi katika kunywa, au athari zinazofuata baada ya kunywa kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Lakini jilindeni
  rationale: Kauli ya kuamuru inatoa onyo la kuwa macho kuhusu hali ya mtu mwenyewe. “Jilindeni” ni Kiswahili cha kawaida chenye nguvu ya onyo, bila urudiaji usio wa kawaida wa “wenyewe.”
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: mioyo yenu isije ikalemewa
  rationale: “Isije” huwasilisha nguvu ya tahadhari ya μήποτε, na “ikalemewa” huhifadhi sitiari ya moyo kuwa mzito au kubebeshwa mzigo.
- source_word: κραιπάλῃ
  choice: anasa za kupindukia
  rationale: Neno la Kigiriki linaweza kumaanisha kujiachilia kupita kiasi katika kunywa na kula, au athari zake. Chaguo hili linawasilisha kupindukia bila kulifunga neno kwa maana ya ulevi pekee, ambao umetajwa tofauti kwa μέθῃ.
- source_word: μέθῃ
  choice: ulevi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya kulewa.
- source_word: μερίμναις βιωτικαῖς
  choice: mahangaiko ya maisha
  rationale: Huwasilisha wasiwasi na shughuli zinazolemea zinazohusiana na maisha ya kawaida bila kuongeza hukumu kwamba mambo hayo yenyewe ni maovu.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: ikawajia ghafula
  rationale: Hutoa maana ya siku kufika juu yao bila kutarajiwa; “ghafula” ni usemi wa asili wa Kiswahili kwa αἰφνίδιος.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: siku ile
  rationale: Huhifadhi usemi wa Kigiriki bila kuongeza ufafanuzi kama “siku ya hukumu,” ambao unatokana na muktadha lakini haujasemwa wazi hapa.
theological_decisions:
- issue: Rejeo la kieskatolojia la “siku ile”
  choice: siku ile
  alternative: siku ile ya hukumu
  rationale: Muktadha unaielekeza kwa siku ya mwisho inayozungumziwa na Yesu, lakini tafsiri haiongezi jina la kiitikadi ambalo halipo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari ya mioyo kulemewa na utata halisi wa κραιπάλῃ vikihifadhiwa.
