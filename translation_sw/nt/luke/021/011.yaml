id: LUK.21.11
reference: Luke 21:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: sw
  text: Kutakuwa na matetemeko makubwa ya ardhi, na mahali mbalimbali kutakuwa na njaa na magonjwa ya mlipuko[b]. Pia kutakuwa na mambo ya kutisha na ishara kubwa kutoka mbinguni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka angani.” Neno la Kigiriki οὐρανός linaweza kumaanisha mbingu au anga, na kirai hiki kinaweza kueleza matukio yanayoonekana angani.
    reason: lexical_alternative
  - marker: b
    text: Au “tauni.” Neno la Kigiriki λοιμοί humaanisha tauni au milipuko ya magonjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: matetemeko makubwa ya ardhi
  rationale: σεισμός hapa humaanisha tetemeko la ardhi, na μέγας huonyesha ukubwa au ukali wake. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: κατὰ τόπους
  choice: mahali mbalimbali
  rationale: Kirai hiki huonyesha kwamba matukio yatatokea katika maeneo tofauti; tafsiri hii ni ya asili na inahifadhi usambazaji wa kijiografia.
- source_word: λιμοί
  choice: njaa
  rationale: Neno hili humaanisha vipindi vya ukosefu mkubwa wa chakula, yaani njaa, wala si upungufu mdogo tu wa chakula.
- source_word: λοιμοί
  choice: magonjwa ya mlipuko
  rationale: λοιμός hurejelea tauni au magonjwa yanayoenea kwa mlipuko. Tafsiri hii ni wazi katika Kiswahili cha sasa na haifungi maana kwenye ugonjwa mmoja maalumu.
- source_word: φόβητρα
  choice: mambo ya kutisha
  rationale: Nomino hii adimu humaanisha vitu au matukio yanayosababisha hofu. 'Mambo ya kutisha' ni ya kawaida zaidi kuliko nomino nzito kama 'vitisho,' ambayo inaweza kudokeza maneno ya kutisha au tishio la makusudi.
- source_word: σημεῖα
  choice: ishara
  rationale: σημεῖον kwa kawaida ni 'ishara.' Chaguo hili linabaki pana na halilazimishi maana mahsusi ya maajabu au dalili za maangamizi.
- source_word: ἀπ’ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: οὐρανός inaweza kumaanisha mbingu kama makao ya juu au anga linaloonekana. 'Mbinguni' huhifadhi mwangwi wa kitheolojia wa Luka bila kufafanua chanzo au namna ya ishara hizo.
- source_word: μεγάλα
  choice: kubwa
  rationale: Kivumishi hiki kinaeleza ukubwa au uzito wa ishara bila kuongeza wazo lisilotajwa la nguvu za kimiujiza.
- source_word: ἔσονται / ἔσται
  choice: kutakuwa na
  rationale: Muundo huu wa Kiswahili unatafsiri kwa kawaida vitenzi vya wakati ujao vya εἰμί katika orodha ya matukio yatakayokuja.
theological_decisions:
- issue: Maana ya οὐρανός katika muktadha wa kinabii kuhusu mwisho
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Neno la Kigiriki linaweza kurejelea mbingu au anga linaloonekana. Matini kuu inahifadhi mwangwi wa kidini unaowezekana, huku tanbihi ikihifadhi uwezekano wa matukio yanayoonekana angani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Mgawanyo wa sentensi mbili unapunguza msongamano wa orodha bila kuvunja uhusiano wa vipengele vya Kigiriki. 'Pia' huwakilisha uendelezaji wa orodha unaoonyeshwa na τε ... καί.
