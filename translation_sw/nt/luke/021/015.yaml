source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: sw
  text: Kwa maana mimi nitawapa maneno na hekima ambayo wapinzani wenu wote hawataweza kuipinga wala kuikanusha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: maneno
  rationale: Ingawa maana ya msingi ni “kinywa,” hapa ni nahau inayorejelea uwezo wa kusema au maneno ya kujibu; “maneno” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: σοφίαν
  choice: hekima
  rationale: Huhifadhi maana ya σοφίαν kuwa ufahamu wenye busara unaotolewa kwa ajili ya kujibu.
- source_word: ἀντιστῆναι
  choice: kuipinga
  rationale: Huonyesha kutoweza kusimama dhidi ya hekima na maneno hayo au kuyashinda katika hoja.
- source_word: ἀντειπεῖν
  choice: kuikanusha
  rationale: Huonyesha kujibu kwa kupinga au kusema kinyume; “kuikanusha” hutofautisha tendo hili na ἀντιστῆναι.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: wapinzani wenu
  rationale: Ni tafsiri fupi na ya kawaida ya wale wanaosimama dhidi ya wanafunzi.
theological_decisions:
- issue: Mhusika anayetoa maneno na hekima
  choice: mimi nitawapa
  alternative: mtapewa
  rationale: Huhifadhi msisitizo wa ἐγώ na ahadi ya moja kwa moja ya Yesu bila kuficha mhusika.
- issue: Rejeo la kiwakilishi ᾗ
  choice: ambayo ... kuipinga wala kuikanusha
  alternative: ambavyo ... kuyapinga wala kuyakanusha
  rationale: Kiswahili kinalazimisha upatanisho wa kisarufi. Uamuzi huu unaunganisha kiwakilishi hasa na “hekima,” kama umbo la Kigiriki la kike la umoja linavyoelekeza, huku “maneno” yakibaki sehemu ya zawadi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi “Kwa maana” na msisitizo wa “mimi,” huku nahau ya Kigiriki “nitawapa kinywa” ikitolewa kwa maana yake ya kawaida, “nitawapa maneno.”
