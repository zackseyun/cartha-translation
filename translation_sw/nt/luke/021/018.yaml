revisions:
- from: Wala hakuna hata unywele mmoja wa kichwa chenu utakaopotea.[a]
  to: Na hakuna hata unywele mmoja wa kichwa chenu utakaopotea.[a]
  rationale: The revision replaces the contextually inappropriate “Wala” with “Na,” matching καὶ without adding contrast or negative coordination. The main proverbial assurance and its deliberate tension with the surrounding predictions of suffering remain unchanged. The footnote is recast to explain the Greek emphasis accurately in natural Swahili.
  reviewer_model: gpt-5.6-terra
