  text: And not a hair from your head will perish[a].
translation:
  language: sw
  text: Na hakuna hata unywele mmoja wa kichwa chenu utakaopotea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia ukanushaji wenye mkazo, ukitoa uhakikisho mkubwa kwamba jambo hili halitatokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wala
  rationale: Katika muktadha huu kiunganishi kinaendeleza kauli kwa njia ya kawaida ya Kiswahili pamoja na ukanushaji unaofuata, bila kuongeza wazo jipya la upinzani.
- source_word: θρὶξ
  choice: hata unywele mmoja
  rationale: Nomino ya umoja imetafsiriwa kwa usemi wa asili wa Kiswahili unaosisitiza kwamba hakuna hata unywele mmoja; neno “hata” linaakisi nguvu ya ukanushaji wa Kigiriki.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: wa kichwa chenu
  rationale: Huu ni usemi wa kimilikishi/kiambajengo unaorejelea unywele unaotoka kichwani. “Kichwa chenu” ni ya kawaida kwa kundi linalosemwa kwa pamoja, huku “vichwa vyenu” pia ikiwezekana.
- source_word: οὐ μὴ
  choice: hakuna ... utakaopotea
  rationale: Muundo wa ukanushaji pamoja na “hata ... mmoja” unatoa uhakikisho wenye mkazo kwa Kiswahili cha kawaida bila kunakili ukanushaji maradufu kwa namna isiyo ya asili.
- source_word: ἀπόληται
  choice: utakaopotea
  rationale: “Kupotea” huhifadhi wigo wa ἀπόλλυμι hapa bila kulazimisha maana ya kuangamizwa kimwili, na inafaa kwa usemi wa kimethali kuhusu unywele.
theological_decisions:
- issue: Mvutano unaoonekana kati ya ahadi hii na kutabiriwa kwa mateso na kifo katika muktadha wa karibu
  choice: Kauli imeachwa kama uhakikisho wenye nguvu bila kuongeza ufafanuzi katika matini kwamba inahusu ulinzi wa mwisho.
  alternative: Kuitafsiri kuwa ahadi ya moja kwa moja kwamba hakuna madhara yoyote ya kimwili yatakayowapata wanafunzi.
  rationale: Muktadha wa karibu unasema kwamba baadhi yao watauawa. Tafsiri inapaswa kuhifadhi mvutano huo wa matini badala ya kuutatua kimadhehebu au kwa kuongeza maelezo ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Unywele” ni sahihi na cha kawaida katika muktadha wa nywele moja; “wala hakuna hata ... mmoja” huwasilisha mkazo kwa njia ya asili.
