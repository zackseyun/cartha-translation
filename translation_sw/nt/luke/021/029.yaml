lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumrejelea Yesu bila kuingiza wazi wazo la wakati kama ‘kisha’.
- source_word: εἶπεν ... αὐτοῖς
  choice: akawaambia
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kwamba alisema jambo kwao.
- source_word: παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ni istilahi ya kawaida ya Kiswahili kwa παραβολή katika mafundisho ya Yesu na inadumisha aina hii ya mafundisho.
- source_word: Ἴδετε
  choice: Utazameni
  rationale: Amri ya wingi inaelekeza wasikilizaji waangalie kwa makusudi; ‘utazameni’ ni wazi, ya sasa, na yenye hadhi.
- source_word: τὴν συκῆν
  choice: mtini
  rationale: ‘Mtini’ humaanisha mti wa tini, si tunda pekee, na ni neno la kawaida la Kiswahili.
- source_word: πάντα τὰ δένδρα
  choice: miti yote
  rationale: Tafsiri hii ya moja kwa moja haiingizi ‘mingine,’ ambalo halipo wazi katika Kigiriki.
