id: LUK.21.8
reference: Luke 21:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: sw
  text: Naye akasema, “Jihadharini msipotoshwe. Kwa maana wengi watakuja kwa jina langu wakisema, ‘Mimi ndiye[a],’ na, ‘Wakati umekaribia.’ Msiwafuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni mimi”; yaani, mdai wa uongo anajitambulisha kuwa yule anayetarajiwa, huenda Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε
  choice: Jihadharini
  rationale: Amri hii inatoa onyo la kuwa macho; ‘Jihadharini’ ni Kiswahili cha kawaida kinachoungana vizuri na kishazi hasi kinachofuata.
- source_word: μὴ πλανηθῆτε
  choice: msipotoshwe
  rationale: Umbo la kutendwa linaonya dhidi ya kuongozwa mbali na kweli; ‘msipotoshwe’ linahifadhi wazo hilo bila kulibadili kuwa amri ya kutenda.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: watakuja kwa jina langu
  rationale: Hiki ni kirai kinachoonyesha kuja kwa kudai jina, utambulisho, au mamlaka ya Yesu; tafsiri hii ni ya kawaida na haifafanui zaidi ya chanzo.
- source_word: λέγοντες
  choice: wakisema
  rationale: Inatafsiri kirai cha kitenzi moja kwa moja na kuacha maneno yanayofuata yaonyeshe madai yao ya udanganyifu.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Katika muktadha huu ni dai la kujitambulisha kwa namna yenye kiarifu kilichodokezwa. ‘Mimi ndiye’ ni la asili katika Kiswahili na haliongezi waziwazi neno ‘Masihi,’ ambalo halipo katika Kiyunani.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Wakati umekaribia
  rationale: ‘Wakati’ linaweza kumaanisha wakati muhimu au uliowekwa, na ‘umekaribia’ linahifadhi hali ya ukaribu yenye matokeo ya sasa katika kitenzi cha Kiyunani.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Msiwafuate
  rationale: Amri inakataza kujiunga na kwenda nyuma ya wadanganyifu hao; ‘Msiwafuate’ ni usemi wazi na wa kawaida wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya Ἐγώ εἰμι katika muktadha wa wadai wa uongo
  choice: Mimi ndiye
  alternative: Ni mimi; au tafsiri iliyo wazi zaidi, Mimi ndiye Masihi
  rationale: Kiyunani hakitaji kiarifu waziwazi. Muktadha unaonyesha dai la kujitambulisha kama yule anayetarajiwa, lakini kutaja ‘Masihi’ katika matini kungefanya maana kuwa mahususi kuliko maneno yenyewe. Tafsiri kuu inadokeza dai hilo huku tanbihi ikihifadhi uwezekano wa usemi mfupi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Muundo wa onyo umefanywa kuwa wa kawaida kwa wasomaji huku utata wa dai ‘Ἐγώ εἰμι’ ukihifadhiwa kwa tanbihi.
