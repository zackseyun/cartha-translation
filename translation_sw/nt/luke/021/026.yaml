  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: sw
  text: huku watu wakizimia kwa hofu na kwa kutazamia mambo yatakayoupata ulimwengu unaokaliwa na watu[a], kwa maana nguvu za mbingu[b] zitatikiswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulimwengu” au “dunia”; Kigiriki ni “ulimwengu unaokaliwa na watu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nguvu za kimbingu” au “nguvu za mbinguni.” Usemi huu unaweza kurejelea kwa upana nguvu za anga au za kimbingu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: wakizimia
  rationale: Kitenzi hiki kinaonyesha watu kupoteza nguvu au fahamu kwa sababu ya hofu kali. “Wakizimia” huhifadhi uzito wa kimwili na kisaikolojia wa usemi huo bila kuongeza wazo la kufa.
- source_word: ἀνθρώπων
  choice: watu
  rationale: Neno hili linarejelea wanadamu kwa ujumla, si wanaume pekee; “watu” ni Kiswahili cha kawaida na sahihi kwa maana hiyo.
- source_word: ἀπὸ φόβου
  choice: kwa sababu ya hofu
  rationale: ἀπό pamoja na hali ya genitivi inaonyesha chanzo au sababu hapa. Usemi huu unaweka wazi uhusiano huo wa kisababishi.
- source_word: προσδοκίας
  choice: matarajio
  rationale: Neno hilo lina maana ya kutazamia jambo linalokuja. Ingawa katika muktadha huu matarajio hayo ni ya kutisha, tafsiri haiongezi moja kwa moja maana ya “maafa” au “hofu” ambayo haimo katika neno lenyewe.
- source_word: τῶν ἐπερχομένων
  choice: ya mambo yanayoujia
  rationale: Kirai hiki ni cha wingi na kinarejelea matukio yanayokuja. “Mambo yanayoujia” huhifadhi wingi na wazo la mambo yanayokaribia kuupata ulimwengu.
- source_word: τῇ οἰκουμένῃ
  choice: ulimwengu unaokaliwa na watu
  rationale: οἰκουμένη humaanisha ulimwengu unaokaliwa, yaani eneo la jamii ya wanadamu, si lazima sayari au ardhi kwa maana ya kijiografia pekee.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: nguvu za mbingu
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kigiriki na haubainishi isivyolazima kama ni miili ya angani, viumbe vya kimbingu, au nguvu za ulimwengu wa juu.
- source_word: σαλευθήσονται
  choice: zitatikiswa
  rationale: Hii ni kauli ya wakati ujao katika hali ya kutendwa. “Zitatikiswa” huhifadhi picha ya msukosuko mkubwa wa ulimwengu na mwangwi wake wa kinabii.
theological_decisions:
- issue: Maana ya “nguvu za mbingu” katika lugha ya kiapokaliptiki
  choice: Kudumisha usemi wenye maana pana “nguvu za mbingu.”
  alternative: “miili ya angani” au “nguvu za malaika”
  rationale: Usemi wa Kigiriki unaweza kuhusisha mpangilio wa ulimwengu, mianga ya angani, au nguvu za kimbingu. Tafsiri haichagui moja tu kati ya maana hizo kwa kuwa matini yenyewe haifanyi hivyo waziwazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Huku” huhifadhi muundo tegemezi wa kirai cha Kigiriki, ambacho kinaendelea kutoka katika muktadha wa aya iliyotangulia. Mpangilio ni wa kawaida kwa msomaji huku ukidumisha taswira na utata wa matini.
