id: LUK.21.31
reference: Luke 21:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: sw
  text: Vivyo hivyo nanyi, mtakapoona mambo haya yakitukia, jueni kwamba ufalme wa Mungu[a] uko karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘utawala wa Mungu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo nanyi
  rationale: Kauli hii inatumia mfano uliotangulia na kuhifadhi msisitizo wa kiwakilishi ὑμεῖς kwa neno la asili na lenye heshima ‘nanyi’.
- source_word: ὅταν ἴδητε
  choice: mtakapoona
  rationale: Muundo huu unaeleza tukio la wakati ujao linalotarajiwa bila kulifanya kuwa tukio linalojirudia.
- source_word: ταῦτα γινόμενα
  choice: mambo haya yakitukia
  rationale: ‘Yakitukia’ ni Kiswahili cha sasa na cha kawaida kwa matukio yanayotokea, huku ‘mambo haya’ yakirejelea ishara zilizotajwa kabla.
- source_word: γινώσκετε
  choice: jueni
  rationale: Huhifadhi hali ya amri ya kitenzi na wito wa kutambua maana ya ishara hizo.
- source_word: ἐγγύς ἐστιν
  choice: uko karibu
  rationale: Huhifadhi wazo la ukaribu bila kuongeza kwamba ufalme tayari umefika au kueleza kwa namna maalumu jinsi ulivyo karibu.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni usemi wa kawaida wa kibiblia unaoweza kuhusisha utawala na milki, bila kuufanya uwe na maana moja tu.
theological_decisions:
- issue: Maana ya ‘ufalme wa Mungu’ katika muktadha wa mambo ya mwisho
  choice: Kuhifadhi usemi ‘ufalme wa Mungu’ bila maelezo ya ziada
  alternative: utawala wa Mungu
  rationale: Mstari hausemi wazi ikiwa ukaribu huu unahusu kudhihirishwa, kutimizwa kikamilifu, au kuthibitishwa kwa ufalme. Usemi mpana wa maandiko unahifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. ‘Nanyi’ huhifadhi msisitizo bila kuwa kizito; ‘yakitukia’ ni cha kawaida zaidi kuliko ‘yakitendeka’ katika muktadha wa matukio.
