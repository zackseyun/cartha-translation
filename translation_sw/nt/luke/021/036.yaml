base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: sw
  text: Lakini kesheni kila wakati, mkiomba ili mpate nguvu za kuyakwepa mambo haya yote yatakayotokea,[a][b] na kusimama mbele ya Mwana wa Adamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “ili mhesabiwe kuwa mnastahili kuyakwepa mambo haya yote,” badala ya “ili mpate nguvu za kuyakwepa mambo haya yote.”
    reason: textual_variant
  - marker: b
    text: Au “mambo haya yote yaliyo karibu kutokea.”
    reason: lexical_alternative
  - marker: c
    text: Kauli “kusimama mbele ya Mwana wa Adamu” inaweza kudokeza kusimama mbele yake ukiwa umekubaliwa au umethibitishwa, lakini Kigiriki hakisemi jambo hilo wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: kesheni
  rationale: Kitenzi cha amri kinaonyesha kuendelea kuwa macho na makini; “kesheni” ni usemi wa kawaida wa kibiblia unaohifadhi picha ya kutolala pamoja na maana ya kuwa tayari.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mpito wenye utofautishaji mdogo kutoka kwa onyo lililotangulia.
- source_word: ἐν παντὶ καιρῷ
  choice: kila wakati
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la wakati wote au daima.
- source_word: δεόμενοι
  choice: mkiomba
  rationale: Katika muktadha huu kitenzi kishirikishi kinahusu kumwomba Mungu kwa unyenyekevu; “mkiomba” ni wazi na asilia.
- source_word: ἵνα κατισχύσητε
  choice: ili mpate nguvu
  rationale: κατισχύω hapa ni kuwa na nguvu za kutosha au kuweza; tafsiri hii inafuata matini ya SBLGNT bila kuingiza wazo la kuhesabiwa kuwa wanastahili kutoka katika lahaja nyingine ya matini.
- source_word: ἐκφυγεῖν
  choice: za kuokoka
  rationale: Katika Kiswahili, “kuokoka mambo” kwa kawaida humaanisha kufanikiwa kuyaepuka au kutoka salama katika hatari; inafaa zaidi hapa kuliko “kukimbia kutoka.”
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: mambo haya yote yatakayotokea
  rationale: Huhifadhi maana ya matukio yajayo kwa lugha asilia; μέλλω inaweza pia kuwa na kidokezo cha ukaribu wa kutokea, ambacho kinaelezwa katika tanbihi.
- source_word: σταθῆναι
  choice: kusimama
  rationale: Huhifadhi taswira ya Kigiriki bila kueleza wazi kukubaliwa, kuhesabiwa haki, au kuhukumiwa.
- source_word: ἔμπροσθεν
  choice: mbele ya
  rationale: Ni ulinganifu wa kawaida na wa moja kwa moja wa uhusiano wa kuwa mbele ya mtu.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya cheo hiki katika Injili, inayohifadhi historia yake ya Kisemiti na matumizi yake ya Kikristo.
theological_decisions:
- issue: Maana ya κατισχύσητε kuhusiana na ustahimilivu wa nyakati za mwisho
  choice: “mpate nguvu”
  alternative: “mhesabiwe kuwa mnastahili”
  rationale: Matini ya SBLGNT ina κατισχύσητε, yaani kuwa na nguvu za kutosha au kufanikiwa, si kuhesabiwa kuwa unastahili. Lahaja inayohusu ustahili imehifadhiwa katika tanbihi kwa sababu ina athari ya kitafsiri.
- issue: Nguvu ya σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: “kusimama mbele ya Mwana wa Adamu”
  alternative: “kusimama mbele ya Mwana wa Adamu mkiwa mmekubaliwa”
  rationale: Kauli hiyo inaweza kudokeza kukubaliwa au kuthibitishwa kuwa waadilifu katika hukumu ya mwisho, lakini Kigiriki hakisemi hivyo wazi; taswira na mvutano wake vimehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kesheni” huhifadhi sitiari ya kuwa macho, huku “mkiomba” ikiunganisha amri na namna ya kuitimiza. Mpangilio wa tanbihi umewekwa karibu na vifungu vinavyofafanuliwa, na kila alama inaonekana katika matini kuu.
