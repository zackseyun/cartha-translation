  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: sw
  text: Kweli nawaambia, kizazi hiki[a] hakitapita kamwe mpaka mambo yote[b] yatokee.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu hawa” au “enzi hii.” Neno la Kiyunani linaweza kueleweka kwa njia zaidi ya moja, ingawa “kizazi” ndiyo tafsiri ya moja kwa moja zaidi.
    reason: alternative_reading
  - marker: b
    text: Tafsiri nyingine husema “mambo haya yote,” zikiongeza “haya” kutokana na muktadha unaozunguka. Hapa Kiyunani kinasema tu “mambo yote.”
    reason: lexical_alternative
  - marker: c
    text: Au “yafanyike” au “yaje kutokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Hutanguliza tamko lenye uzito na uhakika. “Kweli” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha nguvu ya neno hilo bila kulazimisha matumizi ya neno la mkopo “Amina”.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa moja kwa moja na wa asili katika Kiswahili, wenye maana ya “ninawaambia ninyi.”
- source_word: οὐ μὴ παρέλθῃ
  choice: hakitapita kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi unatoa ukanushaji wenye mkazo mkubwa. “Hakitapita kamwe” huhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: ἡ γενεὰ αὕτη
  choice: kizazi hiki
  rationale: Hii ndiyo tafsiri ya moja kwa moja zaidi ya γενεά katika muktadha huu. Maana nyingine zinazowezekana zimewekwa katika tanbihi bila kuamua mjadala wa kiufafanuzi.
- source_word: ἕως ἂν
  choice: mpaka
  rationale: Huonyesha kikomo cha wakati kwa namna ya kawaida na wazi katika Kiswahili.
- source_word: πάντα
  choice: mambo yote
  rationale: Kiyunani kinasema “yote” bila kuweka wazi neno linalomaanisha “haya.” “Mambo yote” huhifadhi upana huo, huku tanbihi ikitaja uwezekano unaotokana na muktadha.
- source_word: γένηται
  choice: yatokee
  rationale: Katika muktadha huu γίνομαι hueleza mambo kutokea au kufanyika. “Yatokee” ni ya asili na haiongezi wazo maalumu la kutimizwa ambalo halijawekwa wazi na kitenzi chenyewe.
theological_decisions:
- issue: Maana ya “kizazi hiki” katika kauli kuhusu mambo ya mwisho
  choice: Kutafsiri moja kwa moja kuwa “kizazi hiki” bila kubainisha kinarejelea nani
  alternative: “watu hawa,” “enzi hii,” au ufafanuzi kuwa ni kizazi kitakachoona ishara hizo
  rationale: Ingawa maneno ya Kiyunani yanaweza kutafsiriwa moja kwa moja, kile yanachorejelea kinajadiliwa. Tafsiri haipaswi kuamua kimya kimya ikiwa ni watu wa wakati wa Yesu, kizazi kitakachoona ishara, kundi la watu, au enzi fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Mpangilio na msisitizo wa kauli ya Kiyunani umehifadhiwa bila kuifanya tafsiri kuwa ngumu; tanbihi zimewekwa karibu na maneno yanayohusika.
