  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Yanapochipua majani' ni ya kawaida kuliko tafsiri ya neno kwa neno, huku tanbihi ikihifadhi kutotajwa wazi kwa majani katika Kigiriki. Marudio ya 'tayari' yamedumishwa.
