translation:
  language: sw
  text: Wakati yanapotoa majani tayari[a], ninyi wenyewe mkiona, mnajua kwamba kiangazi tayari kimekaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “yanapotoa machipukizi.” Kigiriki hakisemi wazi “majani,” lakini muktadha wa miti unaashiria hivyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wakati ... yanapochipua
  rationale: Huanzisha kishazi cha wakati chenye hali inayotarajiwa; muundo huu ni wa kawaida katika Kiswahili na unafaa kwa mfano huu.
- source_word: προβάλωσιν
  choice: yanapochipua majani
  rationale: Kitenzi humaanisha kutoa au kuchipuza ukuaji mpya. Katika muktadha wa mtini na miti yote, 'majani' yanaeleweka, ingawa hayakutajwa wazi katika Kigiriki.
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili limetokea mara mbili na linaonyesha kwamba ishara ya msimu imeanza kuonekana; limedumishwa katika sehemu zote mbili.
- source_word: βλέποντες
  choice: mkiona
  rationale: 'Huwasilisha tendo linaloandamana na utambuzi: kwa kuona ukuaji huo, wasikilizaji wanatambua ukaribu wa msimu.'
- source_word: ἀφ’ ἑαυτῶν
  choice: ninyi wenyewe
  rationale: Nahau hii inaonyesha utambuzi unaotokana na uchunguzi wao wenyewe, bila kuhitaji maelezo ya mtu mwingine.
- source_word: γινώσκετε
  choice: mnajua
  rationale: Ni kauli ya kawaida kuhusu jambo linalotambuliwa kwa uchunguzi; 'mnajua' ni wazi na ya asili.
- source_word: ἐγγὺς
  choice: kimekaribia
  rationale: Hueleza ukaribu wa wakati. Muundo wa kitenzi ni wa asili katika Kiswahili kwa msimu unaokaribia.
- source_word: θέρος
  choice: kiangazi
  rationale: Katika Kiswahili sanifu cha Afrika Mashariki, 'kiangazi' ni jina la kawaida la msimu mkavu/joto linalolingana kwa karibu na θέρος katika mfano huu.
