  text: This will turn out for you as a testimony[a].
translation:
  language: sw
  text: Hayo yataishia kuwa ushuhuda kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hayo yatawapa nafasi ya kutoa ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: yatakuwa
  rationale: Kitenzi hiki cha wakati ujao kinaonyesha matokeo ya mambo yaliyotangulia, si tukio la kawaida tu. “Yatakuwa” ni ya asili katika Kiswahili na, pamoja na kirai kinachofuata, huonyesha yatakavyogeuka kuwa matokeo fulani.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Dativu inaonyesha matokeo hayo kwa upande wa wanafunzi; “kwenu” ni fupi na ya kawaida katika Kiswahili.
- source_word: εἰς
  choice: kuwa
  rationale: Hapa εἰς inaweza kuonyesha matokeo au kusudi. “Kuwa” huunganisha tukio na matokeo yake bila kulazimisha mojawapo ya maana hizo.
- source_word: μαρτύριον
  choice: ushuhuda
  rationale: “Ushuhuda” huhifadhi wazo la kutoa ushahidi au kumshuhudia Yesu, pamoja na mwangwi wa mazingira ya kisheria na ya hadharani.
theological_decisions:
- issue: Maana ya mateso ya wanafunzi mbele ya wenye mamlaka
  choice: Matukio yaliyotabiriwa yatakuwa ushuhuda kwa upande wa wanafunzi, bila kufafanua kupita kiasi namna au mwelekeo wake.
  alternative: Matukio hayo yatawapa wanafunzi nafasi ya kutoa ushuhuda; au yatakuwa ushahidi dhidi ya wapinzani wao.
  rationale: Muktadha unaelekea kwenye ushuhuda utakaotolewa na wanafunzi kuhusu Yesu, lakini muundo mfupi wa Kigiriki unaweza pia kubeba wazo pana la ushahidi. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaeleza maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hayo” hurejelea kukamatwa na kupelekwa mbele ya watawala katika muktadha uliotangulia; “yatakuwa kwenu kuwa” huhifadhi ukaribu na muundo wa chanzo huku tanbihi ikitoa usemi wa asili zaidi unaosisitiza nafasi ya kushuhudia.
