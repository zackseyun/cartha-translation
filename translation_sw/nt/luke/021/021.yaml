  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: sw
  text: Ndipo wale walio katika Yudea wakimbilie milimani, na wale walio katikati yake waondoke, na wale walio mashambani wasiingie ndani yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi “yake” katika vifungu vyote viwili kinarejelea Yerusalemu.
    reason: referent_clarification
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha mfuatano wa wakati unaotokana na ishara zilizotajwa kabla, kwa namna fupi na ya kawaida katika Kiswahili.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: wale walio Yudea
  rationale: Ni usemi wa kawaida unaowataja watu waliomo katika eneo la Yudea bila kuongeza ufafanuzi usio katika chanzo.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: wakimbilie milimani
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu na wazo la kukimbia kuelekea maeneo ya milima.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: wale walio katikati yake
  rationale: Huhifadhi kiwakilishi cha chanzo bila kurudia jina la mahali; katika muktadha, rejeo lake ni Yerusalemu.
- source_word: ἐκχωρείτωσαν
  choice: waondoke
  rationale: Kitenzi kina maana ya kuondoka au kujiondoa mahali; 'waondoke' ni cha sasa, wazi, na kina nguvu ya amri.
- source_word: οἱ ἐν ταῖς χώραις
  choice: wale walio mashambani
  rationale: Hueleza walio katika maeneo ya nje ya mji au ya vijijini; 'mashambani' ni ya asili katika Kiswahili na si lazima iwe mashamba yanayolimwa pekee.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: wasiingie ndani yake
  rationale: Huhifadhi amri hasi ya kutokuingia na kiwakilishi kinachorejelea mahali palepale.
theological_decisions:
- issue: Rejeo la viwakilishi αὐτῆς / αὐτήν
  choice: Kutumia 'yake' na kueleza katika tanbihi kuwa vinarejelea Yerusalemu
  alternative: Kutaja 'Yerusalemu' moja kwa moja katika matini kuu
  rationale: Muktadha wa karibu unaonyesha Yerusalemu kuwa rejeo, lakini jina hilo halirudiwi katika mstari huu. Kiswahili hakihifadhi uhuishaji wa kike wa mji kwa kiwakilishi kama Kigiriki, hivyo 'yake' ni ya asili huku tanbihi ikizuia utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Miundo sambamba ya amri imehifadhiwa. Alama ya tanbihi imewekwa baada ya kishazi cha mwisho kwa kuwa tanbihi inafafanua viwakilishi vyote viwili.
