  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: sw
  text: Naye akasema, “Kweli nawaambia, mjane huyu maskini ametoa[a] zaidi kuliko hao wote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “ametia ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Kweli
  rationale: Hutanguliza kauli ya dhati na yenye msisitizo; “Kweli” ni ya kawaida, yenye uzito, na inafaa katika usemi wa Yesu.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa moja kwa moja kwa wasikilizaji wengi na unahifadhi nguvu ya kauli ya Yesu kwa Kiswahili cha asili.
- source_word: χήρα
  choice: mjane
  rationale: Neno sanifu na sahihi kwa mwanamke ambaye mume wake amekufa.
- source_word: πτωχή
  choice: maskini
  rationale: Hueleza hali ya umaskini bila kuongeza kiwango kisichotajwa wazi katika mstari huu.
- source_word: αὕτη
  choice: huyu
  rationale: Kiwakilishi kionyeshi kinamtambulisha mjane mahususi aliyekuwa mbele yao.
- source_word: πλεῖον
  choice: zaidi
  rationale: Hutoa ulinganisho wa kiasi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: πάντων
  choice: kuliko hao wote
  rationale: Ni umilikishi wa ulinganisho unaowarejelea watoaji wengine katika muktadha; “hao” huonyesha kwamba Yesu anawalinganisha na watu waliotajwa.
- source_word: ἔβαλεν
  choice: ametoa
  rationale: Katika muktadha wa sadaka, “ametoa” ni ya asili na inaeleweka mara moja. Maana halisi zaidi ya kutia au kuweka ndani imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Ulinganisho wa sadaka ya mjane
  choice: “ametoa zaidi kuliko hao wote”
  alternative: “ametoa zaidi kuliko kila mmoja wao”
  rationale: πλεῖον πάντων inaweza kueleweka kuwa kiasi chake kinazidi cha wengine wote kwa tathmini ya Yesu. Tafsiri haiongezi hapa maelezo kwamba ulinganisho huo unahusu uwiano wa mali; sababu hiyo inatolewa katika mstari unaofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili katika usemi wa kawaida huku ukihifadhi msisitizo, uonyeshaji wa mjane mahususi, na mvutano wa kauli ya ulinganisho.
