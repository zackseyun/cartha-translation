lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: mtachukiwa
  rationale: Muundo wa kitenzi cha wakati ujao pamoja na kitenzi-shirikishi cha kutendwa unatafsiriwa kwa hali ya kutendwa ya wakati ujao iliyo ya kawaida na ya asili katika Kiswahili.
- source_word: ὑπὸ πάντων
  choice: na wote
  rationale: ὑπό pamoja na hali ya umilikishi huonyesha watendaji wa chuki; katika muundo wa kutendwa wa Kiswahili, “na wote” huonyesha watendaji hao kwa ufupi huku ikihifadhi upana wa πάντων.
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa sababu ya jina langu
  rationale: διά pamoja na hali ya kushutumu huonyesha sababu. Tafsiri hii inahifadhi kirai halisi “jina langu” na maana zake pana zinazoweza kuhusisha utambulisho, mamlaka, na kukiri uaminifu kwa Yesu.
theological_decisions:
- issue: Maana ya “jina langu” katika muktadha wa mateso ya wanafunzi
  choice: Kuhifadhi usemi “kwa sababu ya jina langu”
  alternative: kwa sababu yangu; kwa sababu mnaniamini
  rationale: Kigiriki kinataja wazi “jina langu.” Kuhifadhi usemi huo hakubani maana yake katika kipengele kimoja tu, bali huacha wazi uhusiano wake na utambulisho wa Yesu, mamlaka yake, na uaminifu kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. “Nanyi” huunganisha mstari na muktadha uliotangulia; “wote” huhifadhi kauli pana ya chanzo bila kuongeza neno lisilokuwapo wazi katika Kigiriki.
