translation:
  language: sw
  text: Nanyi mtachukiwa na wote kwa sababu ya jina langu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu yangu.” Usemi “jina langu” unaweza kumaanisha utambulisho na mamlaka ya Yesu, pamoja na kukiri uaminifu kwake.
