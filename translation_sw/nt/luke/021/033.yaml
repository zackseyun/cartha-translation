id: LUK.21.33
reference: Luke 21:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: sw
  text: Mbingu na dunia zitapita, lakini maneno yangu hakika hayatapita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: mbingu
  rationale: Katika jozi ya kimahusiano ‘mbingu na dunia,’ neno hili linarejelea sehemu ya juu ya ulimwengu ulioumbwa, si anga inayoonekana tu.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Katika jozi ‘mbingu na dunia,’ γῆ ina maana ya dunia kwa upana, si nchi au eneo fulani.
- source_word: παρελεύσονται
  choice: zitapita / hayatapita
  rationale: Kitenzi kimetafsiriwa kwa mzizi uleule katika vifungu vyote viwili ili kuhifadhi usambamba na utofautishaji wa kauli ya Kigiriki; hapa ‘kupita’ humaanisha kufikia mwisho au kutodumu.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti dhahiri kati ya kutodumu kwa mbingu na dunia na kudumu kwa maneno ya Yesu.
- source_word: οἱ λόγοι μου
  choice: maneno yangu
  rationale: Hurejelea maneno au kauli alizosema Yesu; ‘maneno yangu’ ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi.
- source_word: οὐ μὴ
  choice: hakika hayata-
  rationale: Ukanushaji wenye mkazo οὐ μή pamoja na kitenzi cha wakati ujao umeonyeshwa kwa ‘hakika ... hayata-’, unaosisitiza kwamba jambo hilo halitatokea kamwe.
theological_decisions:
- issue: Nguvu ya dai la Yesu kuhusu kudumu kwa maneno yake
  choice: Ukanushaji wenye mkazo umetafsiriwa ‘hakika hayatapita.’
  alternative: ‘hayatapita kamwe’
  rationale: Tafsiri iliyochaguliwa inahifadhi msisitizo mkubwa wa οὐ μή bila kupunguza dai la Yesu wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Mbingu na dunia’ ni jozi ya kawaida yenye upeo wa ulimwengu mzima; urudiaji wa ‘kupita’ umehifadhiwa kwa athari ya balagha.
