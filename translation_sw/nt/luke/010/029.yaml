  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: sw
  text: Lakini yeye, akitaka kujihalalisha, akamwambia Yesu, “Na jirani yangu ni nani?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani anayehesabiwa kuwa jirani yangu?”
    reason: Mbadala huu unaweka wazi kwamba huenda swali linahusu mipaka ya nani anayestahili kuitwa jirani, lakini matini kuu huhifadhi swali la moja kwa moja la Kigiriki.
lexical_decisions:
- source_word: θέλων
  choice: akitaka
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaonyesha nia au kusudi la mtu huyo; “akitaka” ni Kiswahili cha kawaida na huhifadhi uhusiano wake na tendo linalofuata.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: kujionyesha kuwa yuko sawa
  rationale: Katika muktadha huu maana ni kujaribu kuonyesha kwamba yeye yuko katika haki au hana kosa, si lazima matumizi ya kitaalamu ya kitheolojia kuhusu kuhesabiwa haki. Kauli hii ni ya kawaida na inaeleweka kwa wasomaji wa leo.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: akamwambia Yesu
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha usemi katika simulizi, huku ikihifadhi mlengwa wa kauli.
- source_word: Καὶ
  choice: Na
  rationale: Kiunganishi kimehifadhiwa kwa sababu kinaanzisha swali linalofuatia na kuonyesha mwendelezo wa mazungumzo.
- source_word: τίς ἐστίν μου πλησίον
  choice: jirani yangu ni nani?
  rationale: πλησίον imetumika kama nomino yenye maana ya “jirani.” Mpangilio huu ni swali la kawaida na la moja kwa moja katika Kiswahili, na hudumisha uhusiano na amri ya Torati katika muktadha.
theological_decisions:
- issue: Maana ya δικαιῶσαι ἑαυτόν
  choice: Kujaribu kujionyesha kuwa yuko sawa
  alternative: Kujihesabia haki; kujithibitisha kuwa mwenye haki
  rationale: Muktadha ni mazungumzo ya kisheria na kimaadili. Usemi unaashiria jaribio la kujitetea au kujionyesha kuwa hana kosa, bila kulazimisha maana maalumu ya kiteolojia ya kuhesabiwa haki.
- issue: Upeo wa πλησίον
  choice: jirani yangu ni nani?
  alternative: ni nani anayehesabiwa kuwa jirani yangu?
  rationale: Swali la moja kwa moja huhifadhi ufupi na utata wa Kigiriki. Maana inayowezekana ya kuuliza ni nani anayestahili kuhesabiwa kuwa jirani imewekwa katika tanbihi badala ya kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kujionyesha kuwa yuko sawa” limechaguliwa badala ya usemi wa kitaalamu zaidi ili maana ya kujitetea ieleweke wazi bila kuingiza fundisho maalumu la kimadhehebu.
