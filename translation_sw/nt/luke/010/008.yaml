  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: sw
  text: Na mkiingia katika mji wowote, na watu wa mji huo wakiwapokea[a], kuleni vitu vinavyowekwa mbele yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwakaribisha.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “vitu vinavyowekwa mbele yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν εἰσέρχησθε
  choice: mkiingia katika mji wowote
  rationale: Muundo wa kiwakilishi pamoja na ἄν una maana ya jumla isiyoainishwa. Kiswahili cha masharti “mkiingia” kinaeleza kwa kawaida hali hiyo, huku “katika mji wowote” kikihifadhi wazo la kuingia ndani ya mji wowote.
- source_word: δέχωνται ὑμᾶς
  choice: watu wakawapokea
  rationale: δέχομαι inaweza kumaanisha kupokea au kukaribisha. “Wakawapokea” ni ya karibu zaidi na neno la chanzo; “watu” huweka wazi kiima kisichotajwa katika Kigiriki bila kubadili maana.
- source_word: ἐσθίετε
  choice: kuleni
  rationale: Ni amri ya wakati wa sasa. “Kuleni” ni amri ya kawaida na ya asili kwa wingi katika Kiswahili.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: chochote kitakachowekwa mbele yenu
  rationale: Kirai kinaeleza vitu vinavyowekwa mbele yao katika muktadha wa chakula. Tafsiri hii inadumisha hali ya kutendwa na haifasiri waziwazi zaidi kuwa “chakula mtakachopewa.”
