translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; alama za tanbihi [a] na [b] zimewekwa katika matini kuu.
