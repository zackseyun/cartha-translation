lexical_decisions:
- source_word: Σαμαρίτης
  choice: Msamaria
  rationale: Ni istilahi ya kawaida na sahihi ya Kiswahili kwa utambulisho huu wa kikabila na kidini, na inadumisha uzito wa tofauti yake katika simulizi.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi hiki hapa kinaonyesha tofauti kati ya Msamaria na kuhani pamoja na Mlawi waliotajwa katika mistari iliyotangulia.
- source_word: τις
  choice: mmoja
  rationale: Kiwakilishi hiki kisichobainisha mtu fulani kinaelezwa kwa kawaida katika Kiswahili kama ‘mmoja,’ bila uzito usio wa lazima wa ‘fulani.’
- source_word: ὁδεύων
  choice: akiwa safarini
  rationale: Kitenzi-shirikishi cha wakati wa sasa kinaonyesha tendo la msingi lililokuwa likiendelea; usemi huu ni wa asili katika Kiswahili.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: alifika pale alipokuwa
  rationale: Katika muktadha huu, κατά pamoja na hali ya kushutumiwa inaonyesha kufika mahali alipokuwa mtu aliyejeruhiwa; tafsiri hii iko wazi na ni ya kawaida.
- source_word: ἰδών
  choice: Alipomwona
  rationale: Kitenzi-shirikishi cha aoristi kinaonyesha kuona kulikotangulia mwitikio wa huruma; muundo huu unawasilisha mfuatano huo kwa kawaida.
- source_word: ἐσπλαγχνίσθη
  choice: akaguswa na huruma
  rationale: Kitenzi hiki huonyesha huruma ya ndani yenye nguvu. ‘Akaguswa na huruma’ inadumisha uzito wa hisia hiyo bila kuongeza tafsiri ya kimaadili au kimafundisho.
theological_decisions:
- issue: Kueleza mwitikio wa huruma wa Msamaria bila kuingiza ufafanuzi wa baadaye wa kimaadili au kimafundisho
  choice: akaguswa na huruma
  alternative: akamwonea huruma
  rationale: Chaguo hili linadumisha nguvu ya mwitikio wa ndani unaoonyeshwa na kitenzi cha Kigiriki, bila kuongeza dhana zisizosemwa wazi kama neema, wajibu, au upendo kwa jirani.
