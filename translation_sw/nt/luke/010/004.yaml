id: LUK.10.4
reference: Luke 10:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: sw
  text: Msibebe mfuko wa fedha, wala mkoba wa safari[a], wala viatu; na msimsalimie mtu yeyote njiani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkoba wa safari” pia inaweza kutafsiriwa “kibebeo cha safari” au kwa ufupi “mkoba.”
    reason: lexical_alternative
  - marker: b
    text: Huenda maana si kukataza adabu ya kawaida, bali kukazia uharaka usioruhusu salamu ndefu za kijamii zilizokuwa desturi katika utamaduni huo.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: msibebe
  rationale: Kitenzi ‘kubeba’ kinaonyesha wazi agizo la kutokwenda na vitu hivi, na ni cha kawaida na cha asili katika Kiswahili cha sasa.
- source_word: βαλλάντιον
  choice: mfuko wa fedha
  rationale: Neno hili linamaanisha mfuko wa kuhifadhia fedha; ‘mfuko wa fedha’ ni wazi na halileti maana za kisasa zisizokusudiwa.
- source_word: πήραν
  choice: mkoba wa safari
  rationale: Ni mkoba uliotumiwa kubebea mahitaji ya safarini. ‘Mkoba wa safari’ huonyesha matumizi yake kwa lugha inayoeleweka.
- source_word: ὑποδήματα
  choice: viatu
  rationale: Neno la Kiyunani linahusu vitu vinavyovaliwa miguuni. ‘Viatu’ ni neno pana, la kawaida na la heshima; katika mazingira hayo mara nyingi vilikuwa sandali.
- source_word: μηδένα
  choice: mtu yeyote
  rationale: Katika sentensi hasi, ‘msimsalimie mtu yeyote’ ni Kiswahili cha asili kinachowasilisha maana ya ‘hakuna mtu.’
- source_word: κατὰ τὴν ὁδόν
  choice: njiani
  rationale: ‘Njiani’ ni namna fupi na ya kawaida ya kueleza tendo linalofanyika wakati wa safari au kando ya njia.
- source_word: ἀσπάσησθε
  choice: msimsalimie
  rationale: ‘Kusalimia’ ndilo neno la kawaida kwa kupeana salamu; linahifadhi katazo la moja kwa moja bila kuongeza ufafanuzi katika matini.
theological_decisions:
- issue: Nguvu na maana ya katazo la kusalimia watu wakati wa safari
  choice: 'Katazo la moja kwa moja: ‘msimsalimie mtu yeyote njiani’'
  alternative: ‘Msikawie njiani kwa kusalimiana na watu’
  rationale: Kiyunani kina katazo la moja kwa moja, hivyo matini hailainishi wala kufafanua agizo hilo. Uwezekano kwamba Yesu alikazia uharaka na kukataza salamu ndefu zilizoweza kuchelewesha safari unaelezwa katika tanbihi badala ya kuingizwa katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa katazo umerudiwa ili kuhifadhi msisitizo wa chanzo, huku ‘njiani’ na ‘mkoba wa safari’ zikifanya sentensi isomeke kwa kawaida.
