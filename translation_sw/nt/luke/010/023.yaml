    issue: ‘Kisha’ adds an unnecessary overtly sequential nuance.
    rationale: Καί is most simply represented by Swahili narrative coordination here; the preceding aorist participle already supplies the action preceding the speech.
  - severity: low
    issue: The final phrase lacks an explicit relative antecedent in Swahili.
    rationale: ‘Macho yanayoona mnayoyaona’ is understandable, but ‘macho yanayoona yale mnayoyaona’ is clearer and retains the source’s object ‘what you see.’
  revised_text: Akawageukia wanafunzi, akawaambia kwa faragha[a], “Heri macho yanayoona yale mnayoyaona.”
