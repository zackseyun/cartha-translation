id: LUK.10.23
reference: Luke 10:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: sw
  text: Akawageukia wanafunzi, akawaambia kwa faragha[a], “Heri macho yanayoona yale mnayoyaona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa nao peke yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: akawageukia
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aligeuka kuwaelekea wanafunzi kabla ya kusema; “akawageukia” ni Kiswahili cha kawaida na huhifadhi mwelekeo wa tendo.
- source_word: κατ’ ἰδίαν
  choice: kwa faragha
  rationale: Kirai hiki humaanisha kusema pasipo kusikiwa na wengine au kando yao; “kwa faragha” ni cha kawaida na hakiongezi wahusika wasiokuwamo wazi katika maandishi.
- source_word: μαθητάς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Agano Jipya kwa wale wanaojifunza kutoka kwa Yesu na kumfuata.
- source_word: Μακάριοι
  choice: Heri
  rationale: Katika tamko la namna ya heri, “Heri” huonyesha hali ya kufadhiliwa na Mungu bila kulifanya kuwa hisia ya furaha tu.
- source_word: ὀφθαλμοὶ
  choice: macho
  rationale: Maandishi yanataja macho moja kwa moja kama sitiari hai ya watu wanaopewa kuona; taswira hiyo imehifadhiwa.
- source_word: οἱ βλέποντες
  choice: yanayoona
  rationale: Kirai cha kisifa kinayaeleza macho; “yanayoona” ni cha asili katika Kiswahili na huhifadhi hali endelevu ya kitenzi cha sasa.
- source_word: ἃ βλέπετε
  choice: mnayoyaona
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya “mambo ambayo ninyi mnaona,” huku kiwakilishi cha wingi kikihifadhiwa.
theological_decisions:
- issue: Nguvu ya tamko la heri
  choice: Tamko la heri juu ya macho yanayoona mambo ambayo wanafunzi wanaona
  alternative: Kauli ya hisia ya kuwa na furaha tu
  rationale: μακάριοι ni tamko la heri lenye uzito wa kibiblia, si maelezo ya hali ya kihisia pekee. “Heri” huhifadhi uzito huo bila kufafanua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Heri macho” umehifadhi taswira ya Kigiriki badala ya kuibadili kuwa “Heri watu,” na “kwa faragha” linaambatana kwa kawaida na kitendo cha kuwaambia.
