source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: sw
  text: Lakini Martha alikuwa akihangaishwa na shughuli nyingi za kuhudumu. Akamkaribia, akasema, “Bwana, hujali[a] kwamba dada yangu ameniacha nihudumu peke yangu? Basi mwambie anisaidie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, jambo hili si la maana kwako?”
    reason: Msemo οὐ μέλει σοι unaweza kumaanisha kuuliza kama jambo hilo si la maana kwa Yesu, badala ya kusisitiza moja kwa moja kutokujali kwake.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: alikuwa amekengeushwa
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha hali iliyoendelea ya kuvutwa pembeni au kukengeushwa. Kauli hii inadumisha tofauti ya kimuktadha kati ya Martha na Maria bila kuifanya iwe wasiwasi tu.
- source_word: περὶ πολλὴν διακονίαν
  choice: na shughuli nyingi za kuhudumu
  rationale: Katika mazingira haya διακονία ni huduma ya vitendo nyumbani. “Shughuli nyingi za kuhudumu” ni ya kawaida katika Kiswahili na haibani maana kuwa maandalizi ya chakula pekee.
- source_word: ἐπιστᾶσα
  choice: akamkaribia
  rationale: Hapa neno linaonyesha kuja karibu kabla ya kusema. “Akamkaribia” ni wazi na la kawaida.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος kama namna ya heshima ya kumwita Yesu na inadumisha matumizi mapana ya Luka.
- source_word: οὐ μέλει σοι
  choice: hujali
  rationale: Usemi huu unauliza kama jambo hilo linamhusu au ni la maana kwake. “Hujali” ni fupi na ya kawaida, huku tanbihi ikihifadhi njia nyingine isiyo na mkazo mkubwa wa kihisia.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: ameniacha nihudumu peke yangu
  rationale: Tafsiri hii inahifadhi wazo la Martha kuachwa akiwa peke yake kufanya huduma bila kutumia neno kali kama “amenitelekeza.”
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Basi mwambie
  rationale: “Mwambie” inadumisha amri ya moja kwa moja, na “basi” inaonyesha hitimisho linalodokezwa na οὖν.
- source_word: συναντιλάβηται
  choice: anisaidie
  rationale: Kitenzi kina maana ya kujiunga na mtu katika kumsaidia. “Anisaidie” ni Kiswahili cha kawaida, na wazo la kusaidia pamoja linaeleweka kutokana na muktadha.
theological_decisions:
- issue: Tafsiri ya κύριος katika Martha kumwita Yesu
  choice: Bwana
  alternative: Mwalimu
  rationale: “Bwana” inadumisha cheo cha heshima na matumizi mapana ya κύριος kwa Yesu katika Luka, bila kulazimisha maana finyu ya “Mwalimu.”
- issue: Nguvu ya malalamiko katika οὐ μέλει σοι
  choice: hujali
  alternative: si jambo la maana kwako
  rationale: “Hujali” ni usemi wa kawaida wa swali lenye matarajio ya jibu, lakini mbadala umewekwa katika tanbihi ili kuhifadhi uwezekano wa maana isiyoelekezwa moja kwa moja kwenye hisia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kusomeka kwa wasomaji wa kawaida; “kuhudumu” huhifadhi uhusiano wa maneno kati ya διακονία na διακονεῖν.
