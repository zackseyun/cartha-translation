id: LUK.10.19
reference: Luke 10:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: sw
  text: Tazama, nimewapa mamlaka ya kukanyaga nyoka na nge[a], na mamlaka juu ya nguvu zote za adui; wala hakuna chochote kitakachowadhuru kamwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha, taswira hii inaweza pia kudokeza nguvu za kiroho zenye uadui.
    reason: contextual_note
  - marker: b
    text: Au “hakuna chochote kitakachowadhuru kwa vyovyote.” Kigiriki kinatumia ukanushaji wenye msisitizo mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Tazama
  rationale: Ni kiashiria cha kuvuta usikivu kinachoeleweka katika Kiswahili cha sasa na kuhifadhi msisitizo wa mwanzo.
- source_word: δέδωκα
  choice: nimewapa
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokamilika lenye matokeo yanayoendelea sasa; wakati timilifu wa Kiswahili unahifadhi maana hiyo.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Huhifadhi wazo la mamlaka au haki iliyokabidhiwa na kuitofautisha na δύναμις, yaani nguvu, baadaye katika mstari.
- source_word: τοῦ πατεῖν
  choice: ya kukanyaga
  rationale: Hueleza yaliyomo katika mamlaka waliyopewa na kuhifadhi taswira ya kukanyaga bila kuongeza ukali usiotajwa.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: nyoka na nge
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili, huku uhusiano wa mahali ukibebwa kwa kawaida na kitenzi 'kukanyaga'.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: mamlaka juu ya nguvu zote
  rationale: Kurudia 'mamlaka' kunafanya sentensi iwe wazi na ya kawaida katika Kiswahili, huku 'juu ya' ikionyesha ukuu au utawala dhidi ya nguvu za adui.
- source_word: δύναμιν
  choice: nguvu
  rationale: Huhifadhi tofauti ya kileksika kati ya mamlaka waliyopewa wanafunzi na nguvu alizo nazo adui.
- source_word: τοῦ ἐχθροῦ
  choice: za adui
  rationale: Hudumisha umoja na hali ya kibinafsi ya usemi bila kumtaja Shetani moja kwa moja, kwa kuwa jina hilo halimo katika maandishi haya.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: wala hakuna chochote kitakachowadhuru kamwe
  rationale: Muundo huu wa Kiswahili unaonyesha ukanushaji wenye nguvu wa Kigiriki pamoja na maana ya wakati ujao, bila kutumia sentensi ngumu isiyo ya kawaida.
theological_decisions:
- issue: Anayerejelewa kwa neno 'adui'
  choice: Ametafsiriwa kwa ujumla kuwa 'adui' bila kutambuliwa kama Shetani katika matini kuu.
  alternative: Shetani; Ibilisi
  rationale: Muktadha wa pepo kuwatii wanafunzi unaelekeza kwenye upinzani wa kishetani, lakini Kigiriki chenyewe kinasema tu 'adui.' Tafsiri haiongezi utambulisho ambao mstari hautaji wazi.
- issue: Maana halisi au ya kiishara ya 'nyoka na nge'
  choice: Taswira halisi imehifadhiwa katika matini kuu.
  alternative: Mfano wa nguvu za kiroho zenye uadui; taswira yenye maana halisi na ya kiishara kwa pamoja
  rationale: Maneno yenyewe yanataja nyoka na nge, ingawa muktadha unaweza kuruhusu maana ya kiishara au kiwakilishi. Tafsiri inaacha mvutano huo wazi.
- issue: Upeo wa ahadi kwamba hakuna kitakachowadhuru
  choice: Ukanushaji wenye nguvu umehifadhiwa bila kufafanua aina au muda wa madhara.
  alternative: Kuifafanua ahadi kuwa ulinzi wa kiroho pekee au kutokufa kimwili
  rationale: Kigiriki kinasisitiza kwamba hakuna kitakachowadhuru, lakini mstari huu peke yake haufafanui kwa kina upeo wa ahadi. Tafsiri haibani wala kupanua maana yake kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Tazama' ina uzito unaofaa bila kuwa ya kizamani kupita kiasi. 'Mamlaka' na 'nguvu' zimetofautishwa makusudi ili kuhifadhi tofauti ya ἐξουσία na δύναμις. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vipashio vinavyohusika.
