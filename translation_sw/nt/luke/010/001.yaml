source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: sw
  text: Baada ya hayo, Bwana aliwateua pia wengine sabini na wawili[a], akawatuma wawili wawili mbele yake katika kila mji na mahali ambako yeye mwenyewe alikuwa karibu kwenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “sabini” badala ya “sabini na wawili.”
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi mpito wa wakati na wingi wa ταῦτα kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀνέδειξεν
  choice: aliwachagua
  rationale: Katika muktadha huu kitenzi kina maana ya kuwateua watu kwa kazi maalumu; ‘aliwachagua’ ni wazi na asilia, bila kudokeza kwamba aliwaonyesha tu.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος na hapa cheo hicho kinamrejelea Yesu.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: wengine sabini na wawili
  rationale: ἑτέρους huonyesha watu wengine au wa nyongeza. Maandishi ya SBLGNT yana ‘sabini na wawili’; tofauti ya ‘sabini’ imehifadhiwa katika tanbihi.
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Huwasilisha tendo la kuwatuma kwa uwazi bila kuongeza maana ya kitaasisi isiyosemwa wazi katika mstari.
- source_word: ἀνὰ δύο δύο
  choice: wawili wawili
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mgawanyo na uradidi wa Kigiriki.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: wamtangulie
  rationale: Katika muktadha huu maana ni kwenda kabla yake wakitayarisha ujio wake; ‘wamtangulie’ ni fupi na asilia.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: kwenda katika kila mji na mahali
  rationale: Huhifadhi nomino zote mbili, πόλις na τόπος, bila kuzifupisha kuwa dhana moja.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: ambapo yeye mwenyewe alikuwa karibu kwenda
  rationale: ‘Alikuwa karibu kwenda’ huhifadhi wazo la tendo lililokuwa linakaribia, na ‘yeye mwenyewe’ huhifadhi mkazo wa αὐτός.
theological_decisions:
- issue: Tofauti ya kimaandishi kuhusu idadi ya walioteuliwa
  choice: sabini na wawili
  alternative: sabini
  rationale: SBLGNT inasoma ἑβδομήκοντα δύο, ‘sabini na wawili.’ Kwa kuwa ‘sabini’ ni tofauti muhimu ya kimaandishi, imeonyeshwa katika tanbihi badala ya kufichwa au kuchukuliwa kuwa suala la mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ‘wawili wawili’ umehifadhiwa kwa sababu ni wa asili katika Kiswahili na unaakisi uradidi wa Kigiriki.
