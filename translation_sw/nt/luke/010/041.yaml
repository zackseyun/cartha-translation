  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: sw
  text: Lakini Bwana akamjibu, “Martha, Martha, una wasiwasi na unasumbuka[a] kuhusu mambo mengi,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “una wasiwasi na unafadhaika.”
    reason: θορυβάζῃ inaweza kueleza hali ya kutibuka, kufadhaika, au kusumbuliwa moyoni; “unafadhaika” ni mbadala wa karibu wa “unasumbuka” katika muktadha huu.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Lakini ... akamjibu
  rationale: Muundo wa Kigiriki wa kishiriki pamoja na kitenzi cha kusema ni nahau ya kisimulizi; Kiswahili cha kawaida huuwasilisha kwa kitenzi kimoja ‘akamjibu.’ ‘Lakini’ linaonyesha utofautishaji mdogo na malalamiko ya Martha yaliyotangulia.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni cheo cha kawaida cha Yesu katika simulizi la Luka na huhifadhi uzito wake wa heshima na wa kikristo kuliko ‘bwana mkubwa’ au ‘mwalimu.’
- source_word: Μάρθα Μάρθα
  choice: Martha, Martha
  rationale: Kurudiwa kwa jina kumehifadhiwa ili kuonyesha msisitizo na upole wa mwito wa moja kwa moja.
- source_word: μεριμνᾷς
  choice: una wasiwasi
  rationale: Hueleza hali ya ndani ya kuwa na hofu au mahangaiko; ‘una wasiwasi’ ni ya kawaida, wazi, na yenye uzito unaofaa katika Kiswahili cha sasa.
- source_word: θορυβάζῃ
  choice: kufadhaika
  rationale: Kitenzi hiki huonyesha kusumbuliwa au kutibuliwa moyoni. ‘Kufadhaika’ hukitofautisha na ‘kuwa na wasiwasi’ huku kikihifadhi wazo la msukosuko wa ndani.
- source_word: περὶ πολλά
  choice: kuhusu mambo mengi
  rationale: Tafsiri hii ni ya moja kwa moja na ya asili, nayo huhifadhi upana wa mambo yaliyokuwa yakimsumbua Martha.
theological_decisions:
- issue: Kutafsiri κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: mkuu / mwenye nyumba
  rationale: Katika Luka neno hili ni cheo cha kisimulizi chenye maana ya heshima na pia mwangwi wa kikristo. ‘Bwana’ huhifadhi pande hizo bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili katika simulizi, huku marudio ya jina na tofauti kati ya wasiwasi na kufadhaika vikihifadhiwa.
