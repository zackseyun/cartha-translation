base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: sw
  text: Siku iliyofuata, akatoa dinari mbili[a] na kumpa msimamizi wa nyumba ya wageni dinari hizo, akasema, “Mtunze huyu. Chochote utakachotumia zaidi, nitakulipa nitakaporudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa sarafu ya fedha ya Kirumi ya kawaida, yenye thamani ya takriban mshahara wa siku moja wa mfanyakazi.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaoonyesha siku iliyofuata katika simulizi.
- source_word: ἐκβαλών
  choice: akatoa
  rationale: Katika muktadha huu kitenzi kinaonyesha kutoa fedha alizokuwa nazo, si maana ya moja kwa moja ya kutupa nje.
- source_word: δύο δηνάρια
  choice: dinari mbili
  rationale: Jina la kihistoria la sarafu limehifadhiwa badala ya kulibadili kuwa makadirio ya mshahara.
- source_word: πανδοχεῖ
  choice: mwenye nyumba ya wageni
  rationale: Humtaja mtu anayesimamia mahali pa kulala wageni kwa lugha inayoeleweka na iliyozoeleka katika Kiswahili.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Mtunze huyu
  rationale: Kauli hii inatoa agizo la kumhudumia kwa uangalifu; “huyu” humrejelea wazi mtu aliyekuwa hapo.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Chochote utakachotumia zaidi
  rationale: Inahifadhi kutokujulikana kwa kiasi na wazo la gharama za ziada.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: nitakaporudi
  rationale: Muundo wa wakati umetafsiriwa kwa njia ya kawaida na fasaha katika Kiswahili.
- source_word: ἀποδώσω σοι
  choice: nitakulipa
  rationale: Katika muktadha wa fedha, maana ni kumrudishia mwenye nyumba ya wageni gharama alizotumia.
