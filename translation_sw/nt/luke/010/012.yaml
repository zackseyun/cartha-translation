  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: sw
  text: Ninawaambia, kwa Sodoma itakuwa afadhali zaidi siku ile[b] kuliko kwa mji ule.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itakuwa rahisi zaidi kustahimili.” Neno la Kigiriki ἀνεκτότερον linaweza kutafsiriwa “afadhali zaidi” au “rahisi zaidi kustahimili.”
    reason: lexical_alternative
  - marker: b
    text: “Siku ile” hurejelea siku ya hukumu ya Mungu; vifungu vingine vinavyofanana husema jambo hili waziwazi.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Kauli ya moja kwa moja yenye uzito; umbo hili ni la kawaida na la asili katika Kiswahili cha sasa.
- source_word: Σοδόμοις
  choice: kwa Sodoma
  rationale: Jina la mahali limetumiwa kwa maana ya wakazi wake kwa ujumla, kama katika Kigiriki, bila kulifafanua kupita kiasi.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: siku ile
  rationale: Huhifadhi rejeo la wakati bila kuongeza neno 'hukumu,' ambalo halipo wazi katika mstari huu.
- source_word: ἀνεκτότερον
  choice: itavumilika zaidi
  rationale: Hutoa maana ya kitu kuwa rahisi zaidi kustahimili; pia huhifadhi muundo wa kauli isiyo na mtendaji dhahiri.
- source_word: ἔσται
  choice: itavumilika
  rationale: Wakati ujao umejumuishwa kiasili katika kitenzi cha Kiswahili.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: kuliko kwa mji ule
  rationale: Huhifadhi ulinganisho na rejeo la mji uliotajwa katika muktadha uliotangulia.
theological_decisions:
- issue: Maana ya “siku ile”
  choice: Kubakiza “siku ile” katika matini kuu
  alternative: siku ya hukumu
  rationale: Muktadha unaashiria hukumu ya Mungu, lakini mstari wenyewe unasema tu “siku ile”; hivyo tafsiri haiongezi ufafanuzi wa kitheolojia katika matini kuu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa alama [a][b] unafuata sehemu husika ya kauli: mbadala wa kileksika kwanza, kisha ufafanuzi wa “siku ile.”'
