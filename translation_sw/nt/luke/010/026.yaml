  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: sw
  text: Naye akamwambia, “Imeandikwa nini katika Sheria? Unasomaje?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaifafanuaje?” Kwa tafsiri ya karibu zaidi, Kigiriki husema, “Unasomaje?” na huenda usemi huo ukahusisha pia maana ya kuelewa au kufafanua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Naye
  rationale: δέ ni kiunganishi hafifu cha simulizi; “Naye” huendeleza mtiririko kwa kawaida bila kusisitiza upinzani, huku kiima kilichodokezwa kikirejelewa kwa nafsi.
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamwambia
  rationale: Huwasilisha kwa njia ya kawaida tendo la kusema na mtu anayeambiwa, bila kuongeza maana ya kujibu ambayo haijawekwa wazi katika maneno yenyewe.
- source_word: Ἐν τῷ νόμῳ
  choice: katika Sheria
  rationale: νόμος hapa inarejelea Sheria ya Maandiko inayotambuliwa na mtaalamu wa sheria; herufi kubwa huonyesha rejeleo hilo maalumu bila kulazimisha matumizi ya neno “Torati.”
- source_word: τί γέγραπται
  choice: Imeandikwa nini
  rationale: Hifadhi hali ya maandishi iliyopo katika kauli timilifu tendwa γέγραπται kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: πῶς ἀναγινώσκεις
  choice: Unasomaje?
  rationale: ἀναγινώσκεις kimsingi humaanisha “unasoma”; “Unasomaje?” huhifadhi usemi mfupi na uwazi wake, huku ikiweza pia kudokeza jinsi msomaji anavyoelewa.
theological_decisions:
- issue: Maana ya νόμος katika swali la Yesu
  choice: Sheria kama Maandiko ya sheria yaliyotolewa kwa Israeli
  alternative: Torati; sheria kwa maana ya jumla
  rationale: Muktadha ni mazungumzo na mtaalamu wa sheria katika mazingira ya Kiyahudi. “Sheria” huhifadhi rejeleo maalumu la Maandiko bila kulifafanua kupita ushahidi wa Kigiriki.
- issue: Dokezo la kiufafanuzi katika πῶς ἀναγινώσκεις
  choice: Kuhifadhi usemi wa karibu, “Unasomaje?”
  alternative: “Unaifafanuaje?” au “Unaielewaje?”
  rationale: Swali linaweza kuchunguza uelewa au ufafanuzi, lakini kitenzi chenyewe ni “kusoma.” Tafsiri kuu inahifadhi mvutano huo badala ya kuamua maana moja kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Imeandikwa nini katika Sheria?” ni wa asili na huhifadhi msisitizo wa maandishi; alama ya tanbihi imewekwa baada ya swali linalohusika.
