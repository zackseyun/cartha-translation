id: LUK.10.16
reference: Luke 10:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: sw
  text: Anayewasikia ninyi ananisikia mimi, na anayewakataa[a] ninyi ananikataa mimi; lakini anayenikataa mimi anamkataa yule aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayewapuuza” au “anayewaweka kando.” Neno la Kigiriki ἀθετέω limetumiwa mara tatu katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Anayewasikiliza
  rationale: Kirai cha Kigiriki ni kivumishi-endelevu chenye kibainishi kinachomtaja kwa ujumla mtu yeyote anayefanya tendo hilo. Muundo huu wa Kiswahili ni wa kawaida na unaendeleza hali ya umoja.
- source_word: ὑμῶν
  choice: ninyi
  rationale: Kiwakilishi kinawataja wanafunzi wenyewe kama wanaosikilizwa. ‘Ninyi’ kinahifadhi msisitizo wa kibinafsi bila kuongeza wazo la ‘ujumbe wenu,’ ambalo halijaandikwa wazi.
- source_word: ἀκούει
  choice: an anisikiliza
  rationale: Kitenzi ‘kusikiliza’ kinaonyesha kupokea kwa makini kile kinachosemwa na kinafaa kwa mtu anayesikilizwa; pia kinahifadhi urudiaji wa kitenzi cha Kigiriki. Katika matini limeandikwa kwa pamoja kama ‘ananisikiliza.’
- source_word: ἀθετέω
  choice: kukataa
  rationale: Katika muktadha wa kuwakubali au kuwakataa wajumbe waliopewa mamlaka, ‘kukataa’ linaeleza wazi tendo la kutowapokea. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
- source_word: τὸν ἀποστείλαντά με
  choice: yule aliyenituma
  rationale: Hili ni kirai cha kawaida cha Kiswahili kinachohifadhi rejeleo la mtu bila kuongeza wazi kwamba ni Baba, jambo ambalo muktadha unaonyesha lakini mstari wenyewe halitaji.
theological_decisions:
- issue: Uhusiano kati ya Yesu na wajumbe wake
  choice: 'Kuhifadhi mnyororo wa moja kwa moja wa watu: kuwasikiliza au kuwakataa wanafunzi ni kumsikiliza au kumkataa Yesu.'
  alternative: Kutafsiri kana kwamba kinachopokewa au kukataliwa ni ujumbe wa wanafunzi pekee.
  rationale: Kigiriki kinatumia viwakilishi vya watu—‘ninyi’ na ‘mimi’—wala si nomino kama ‘ujumbe’ au ‘mafundisho.’ Tafsiri haipunguzi uhusiano huu wa uwakilishi.
- issue: Anayerejelewa na ‘yule aliyenituma’
  choice: Kuacha rejeleo likiwa ‘yule aliyenituma.’
  alternative: Kusema wazi ‘Baba aliyenituma.’
  rationale: Muktadha unamwelekeza msomaji kwa Mungu Baba, lakini neno ‘Baba’ halipo katika mstari huu; hivyo halijaongezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninyi’ na ‘mimi’ zimehifadhiwa ili kuonyesha msisitizo wa viwakilishi na mnyororo wa uwakilishi uliomo katika Kigiriki.
