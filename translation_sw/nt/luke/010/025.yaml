  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: sw
  text: Na tazama, mtaalamu mmoja wa Sheria[a] alisimama ili kumjaribu, akasema, “Mwalimu, nifanye nini ili niurithi uzima wa milele?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanasheria.” Neno la Kigiriki hapa humaanisha mtaalamu wa Sheria ya Kiyahudi, yaani Sheria ya Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiunganishi cha simulizi na nguvu ya ἰδού ya kuvuta usikivu, kwa lugha ya Kiswahili inayoeleweka na yenye hadhi.
- source_word: νομικός τις
  choice: mtaalamu mmoja wa Sheria
  rationale: Katika muktadha huu νομικός ni mtu aliyebobea katika Sheria ya Musa, si wakili wa kisasa. Herufi kubwa katika “Sheria” inaonyesha rejeo la Torati bila kuongeza ufafanuzi usiomo katika mstari.
- source_word: ἀνέστη
  choice: akasimama
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo hilo katika simulizi.
- source_word: ἐκπειράζων αὐτὸν
  choice: akimjaribu
  rationale: Inadumisha muundo wa tendo linaloendelea sambamba na kusimama na kusema, pamoja na wazo la kumtia Yesu kwenye jaribio, bila kulazimisha kwamba alikuwa akimshawishi atende dhambi.
- source_word: λέγων
  choice: akasema
  rationale: Muundo wa kitenzi kikuu ni wa asili zaidi katika Kiswahili kuliko tafsiri kandamizi ya hali ya kushiriki, huku mfuatano wa Kigiriki ukibaki wazi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni neno la sasa na la kawaida linalowakilisha kwa usahihi cheo Διδάσκαλε.
- source_word: τί ποιήσας
  choice: nifanye nini
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya tendo linalotajwa kuwa njia au sharti, bila kuufanya muundo wa Kigiriki kuwa mgumu.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni usemi wa kawaida wa kibiblia katika Kiswahili na unawakilisha maana ya maisha yasiyo na mwisho au ya enzi ijayo kwa namna inayoeleweka.
- source_word: κληρονομήσω
  choice: niurithi
  rationale: Inahifadhi sitiari ya urithi iliyo katika Kigiriki badala ya kuirahisisha kuwa “nipate.”
theological_decisions:
- issue: Maana ya νομικός katika mazingira ya Kiyahudi ya karne ya kwanza
  choice: mtaalamu wa Sheria
  alternative: mwanasheria
  rationale: Chaguo hili linaonyesha kuwa mtu huyo alikuwa mtaalamu wa Sheria ya Musa, na huepuka kumfanya aonekane kama wakili wa mahakama ya kisasa.
- issue: Nguvu ya τί ποιήσας ... κληρονομήσω
  choice: nifanye nini ili niurithi uzima wa milele?
  alternative: nifanye nini nipate uzima wa milele?
  rationale: Inahifadhi namna swali la mtu huyo linavyohusianisha tendo lake na kurithi uzima, bila kuamua mapema mvutano wa kiteolojia uliomo katika swali. Pia inadumisha sitiari ya urithi.
- issue: Nguvu ya ἐκπειράζων
  choice: akimjaribu
  alternative: akimshawishi
  rationale: “Akimjaribu” huonyesha kumweka kwenye jaribio au kumchunguza kwa nia yenye changamoto, bila kuongeza dhana maalumu ya kumshawishi atende dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Na tazama” inadumisha msisitizo wa kisimulizi, na “mtaalamu wa Sheria” huepuka maana ya kisasa ya wakili huku ikibaki fupi.
