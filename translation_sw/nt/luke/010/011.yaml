  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: sw
  text: '‘Hata mavumbi kutoka katika mji wenu yaliyoshikamana na miguu yetu tunayafuta dhidi yenu.[a] Lakini jueni hili: Ufalme wa Mungu umekaribia.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno zaidi, ‘Hata mavumbi yaliyoshikamana nasi kutoka katika mji wenu, kwenye miguu yetu, tunayafuta dhidi yenu.’ Mpangilio wa Kigiriki si wa kawaida, lakini unaeleza mavumbi kutoka mji huo yaliyoshika miguu ya wajumbe. Kitenzi kinamaanisha hasa ‘kufuta’ au ‘kupangusa,’ si ‘kukung’uta.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: mavumbi
  rationale: Neno hili linamaanisha mavumbi hasa, si udongo kwa ujumla, na linadumisha uzito wa ishara ya kitendo hiki.
- source_word: κολληθέντα
  choice: yaliyogandamana
  rationale: Kitenzi hiki kinaeleza kitu kilichoshikamana kwa karibu; ‘yaliyogandamana’ ni Kiswahili cha kawaida na sahihi kwa mavumbi yaliyoshika miguu.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: ya mji wenu
  rationale: Hueleza chanzo cha mavumbi kwa Kiswahili cha asili bila kupoteza maana ya ‘kutoka katika mji wenu’.
- source_word: εἰς τοὺς πόδας
  choice: na miguu yetu
  rationale: Katika usemi huu wa Kigiriki, kirai kinafafanua mavumbi yaliyoshika miguu; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἀπομασσόμεθα
  choice: tunayafuta
  rationale: Kitenzi hiki hasa ni kufuta au kupangusa, wala si kukung’uta; ‘tunayafuta’ hudumisha tofauti hiyo.
- source_word: ὑμῖν
  choice: dhidi yenu
  rationale: Katika muktadha huu, uelekeo wa kitendo una nguvu ya ushuhuda au hukumu dhidi ya wanaokataa ujumbe.
- source_word: πλήν
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha jambo muhimu linalobaki kuwa kweli licha ya ishara ya hukumu; ‘Lakini’ ni cha kawaida na chenye nguvu inayofaa.
- source_word: γινώσκετε
  choice: jueni
  rationale: Ni amri ya kutambua na kukiri ukweli unaotangazwa.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Kauli timilifu inaonyesha kuwa ufalme umekuja karibu na ukaribu huo una umuhimu unaoendelea; ‘umekaribia’ huhifadhi hali hiyo bila kudai kuwa umetimilizwa kikamilifu.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni tafsiri iliyozoeleka, wazi, na inayoweza kujumuisha utawala wa Mungu bila kuufupisha kuwa eneo pekee.
theological_decisions:
- issue: Nguvu ya ishara ya kufuta mavumbi
  choice: Kitendo cha mfano kinachotoa ushuhuda na hukumu dhidi ya mji unaokataa ujumbe
  alternative: Kitendo cha kawaida tu cha usafi au safari
  rationale: ὑμῖν katika muktadha wa maagizo ya utume huipa ishara uelekeo wa kupinga; ‘dhidi yenu’ hudumisha nguvu hiyo bila kuongeza maelezo katika mstari.
- issue: Maana ya kukaribia kwa Ufalme
  choice: Ufalme wa Mungu umekuja karibu kupitia utume na ujumbe, hata unapokataliwa
  alternative: Ufalme uko karibu kwa wakati tu, au tayari umetimilizwa kabisa
  rationale: ἤγγικεν hudumisha mvutano kati ya ukaribu uliokwisha kutokea na utimilifu wa mwisho; tafsiri haumalizi mvutano huo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mavumbi’ linaafikiana kimaana na nomino ya Kigiriki; ‘yaliyogandamana na miguu yetu’ ni ya kawaida kuliko kufuata mpangilio mgumu wa Kigiriki. ‘Jueni hili’ ni amri ya moja kwa moja lakini ya asili. Alama [a] imewekwa katika matini kuu.
