  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: sw
  text: “Ole wako, Korazini! Ole wako, Bethsaida! Kwa maana, kama matendo ya nguvu[a] yaliyotendeka kwenu yangalitendeka katika Tiro na Sidoni, watu wa Tiro na Sidoni wangelitubu[b] zamani, wakiwa wameketi katika nguo za gunia na majivu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza”; neno la Kigiriki linaweza kumaanisha “matendo ya nguvu” au “matendo yanayodhihirisha nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Au “wangelibadili nia na mwenendo wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ole wako
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi uzito wa tangazo la hukumu pamoja na sauti ya maombolezo, na inaelekeza maneno hayo moja kwa moja kwa mji unaotajwa.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: Korazini / Bethsaida
  rationale: Majina ya mahali yameandikwa kwa namna inayotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: αἱ δυνάμεις
  choice: matendo ya nguvu
  rationale: Tafsiri hii huhifadhi maana ya matendo yanayodhihirisha nguvu, bila kuifanya istilahi ya Kigiriki kuwa neno la kiufundi zaidi la “miujiza.”
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: yangalitendeka ... yaliyotendeka
  rationale: Kitenzi “kutendeka” kinaonyesha kutokea kwa matendo hayo na pia kinaruhusu muundo wa hali isiyotimia wa sentensi ya Kigiriki.
- source_word: ἐν ὑμῖν
  choice: kwenu
  rationale: Kwa kuwa anwani ni miji inayowakilisha wakazi wake, “kwenu” ni ya asili na hueleza mahali au miongoni mwao matendo hayo yalipotendeka.
- source_word: πάλαι
  choice: zamani
  rationale: Neno hili linaonyesha kwamba toba hiyo ingekuwa imetokea muda mrefu kabla.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: katika nguo za gunia na majivu
  rationale: Huhifadhi taswira halisi ya kale ya maombolezo na toba kwa lugha inayoeleweka kwa wasomaji wa sasa.
- source_word: καθήμενοι
  choice: wakiwa wameketi
  rationale: Huhifadhi kitendo na mkao unaoelezwa na kitenzi-shirikishi cha Kigiriki badala ya kuufanya kuwa wazo la jumla tu.
- source_word: μετενόησαν
  choice: wangekuwa wametubu
  rationale: “Kutubu” ni neno la kawaida na linalofaa katika muktadha huu; muundo huu huonyesha matokeo yasiyotimia ya sharti la wakati uliopita.
theological_decisions:
- issue: Asili ya αἱ δυνάμεις katika huduma ya Yesu
  choice: matendo ya nguvu
  alternative: miujiza; matendo yenye nguvu
  rationale: Neno la Kigiriki linasisitiza matendo yanayoonyesha nguvu. Tafsiri iliyochaguliwa huhifadhi upana huo bila kukana kwamba yalikuwa matendo ya ajabu.
- issue: Miji kutajwa kana kwamba ni watu wanaoweza kutubu
  choice: watu wa huko wangekuwa wametubu
  alternative: Tiro na Sidoni ingalikuwa imetubu
  rationale: Kigiriki hutumia miji kimajazi kwa wakazi wake. Kiswahili kinafafanua mhusika kwa kiasi kidogo ili kuepuka kusema kwamba maeneo yenyewe yanatubu, bila kubadili hoja ya Yesu.
- issue: Taswira ya toba
  choice: wakiwa wameketi katika nguo za gunia na majivu
  alternative: wangekuwa wameonyesha toba kwa kuvaa nguo za gunia na kutumia majivu
  rationale: Taswira halisi ya maandiko imehifadhiwa badala ya kufupishwa kuwa maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa hali isiyotimia umehifadhiwa kwa “yangalitendeka” na “wangekuwa wametubu.” Alama zote za tanbihi zimewekwa katika matini kuu mahali zinapohusika.
