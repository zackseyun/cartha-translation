  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: sw
  text: Ni yupi kati ya hawa watatu unadhani amekuwa jirani wa yule aliyeangukia kati ya wanyang’anyi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni yupi kati ya hawa watatu unaona amekuwa jirani wa yule aliyeangukia kati ya wanyang’anyi?” Kigiriki kwa karibu zaidi husema, “Ni yupi kati ya hawa watatu anaonekana kwako kuwa amekuwa jirani,” kikisisitiza tendo la kuwa jirani.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Ni yupi
  rationale: Hutanguliza uchaguzi kutoka katika kundi maalumu la watu watatu; “Ni yupi” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: τούτων τῶν τριῶν
  choice: kati ya hawa watatu
  rationale: Huwakilisha muundo wa Kigiriki unaochagua mmoja kutoka kwa watatu bila kuongeza neno “wanaume,” ambalo halipo wazi katika matini.
- source_word: δοκεῖ σοι
  choice: unadhani
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha wazo la jambo kuonekana kuwa hivyo kwa maoni ya msikilizaji; maana ya karibu zaidi ya kimatini inaelezwa katika tanbihi.
- source_word: γεγονέναι
  choice: amekuwa
  rationale: Wakati timilifu wa γίνομαι unaonyesha kufanyika au kuja kuwa, si hali tuli tu. “Amekuwa” huhifadhi msisitizo wa mtu kujifanya jirani kwa matendo.
- source_word: πλησίον
  choice: jirani
  rationale: Hapa neno limetumika kama nomino yenye maana ya jirani, si tu mtu aliye karibu kimahali.
- source_word: τοῦ ἐμπεσόντος
  choice: wa yule aliyeangukia
  rationale: Kirai humrejelea mhanga maalumu wa simulizi; “yule” ni cha asili katika Kiswahili na hakiongezi jinsia isiyohitajika.
- source_word: εἰς τοὺς λῃστάς
  choice: kati ya wanyang’anyi
  rationale: Huhifadhi nahau ya kuangukia miongoni mwa wanyang’anyi bila kuongeza wazi “mikononi mwa,” ingawa hilo ndilo wazo la kimuktadha.
theological_decisions:
- issue: Mkazo wa kimaadili wa swali katika mfano wa Msamaria mwema
  choice: Kutafsiri γίνομαι kwa “amekuwa” ili kuhifadhi mwelekeo wa kuwa jirani kwa mwingine.
  alternative: Kutafsiri kwa hali tuli, kama “alikuwa jirani wa.”
  rationale: Muundo wa Kigiriki unahamisha swali kutoka katika kumtambua jirani anayepaswa kupendwa hadi kwa mtu aliyetenda kama jirani. “Amekuwa” huhifadhi nguvu hiyo bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Unadhani” hufanya swali lisikike la kawaida kwa msomaji wa leo, huku “amekuwa jirani” ikihifadhi kwa makusudi tofauti kati ya kuwa katika hali ya ujirani na kujitokeza kama jirani kwa matendo.
