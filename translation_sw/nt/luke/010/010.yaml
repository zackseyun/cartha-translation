  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: sw
  text: 'Lakini mkiingia katika mji wowote, nao wasiwapokee, tokeni mwende katika barabara zake pana[a], mkaseme:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viwanja vyake vya umma.” Neno la Kigiriki πλατείας humaanisha njia pana au maeneo ya wazi ya umma.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: katika mji wowote
  rationale: Muundo wa kiwakilishi pamoja na ἄν una maana isiyo maalumu na inayohusu kila hali inayoweza kutokea; “mji wowote” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: εἰσέλθητε
  choice: mkiingia
  rationale: Kauli tegemezi ya wakati uliopita iko katika kishazi cha hali; “mkiingia” huonyesha tukio linalowezekana kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: wasiwakaribishe
  rationale: δέχομαι hapa ni kuwapokea au kuwakaribisha wajumbe. “Wasiwakaribishe” ni ya asili katika Kiswahili na huonyesha kutokubaliwa kwao kama wageni na wajumbe.
- source_word: ἐξελθόντες
  choice: tokeni mwende
  rationale: Kirai shiriki kinatangulia amri εἴπατε na huonyesha mfuatano wa vitendo. “Tokeni mwende ... na kusema” huwasilisha mfuatano huo kwa Kiswahili fasaha.
- source_word: τὰς πλατείας αὐτῆς
  choice: barabara zake pana
  rationale: πλατεῖαι ni njia pana za umma, na inaweza pia kurejelea maeneo ya wazi ya umma. “Barabara zake pana” huhifadhi sifa ya upana na mahali pa hadhara bila kuifunga maana kuwa viwanja pekee.
- source_word: εἴπατε
  choice: na kusema
  rationale: Amri ya λέγω inaanzisha maneno yanayofuata katika mstari unaofuata; “na kusema” ni muendelezo wa kawaida baada ya “tokeni mwende.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wingi umehifadhiwa kwa wanafunzi wanaotumwa. “Barabara zake pana” huepuka kupoteza maana ya hadhara iliyomo katika πλατείας, huku tanbihi ikihifadhi uwezekano wa “viwanja vya umma.”
