  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: sw
  text: Kwa bahati, kuhani fulani alikuwa akishuka katika njia ile. Alipomwona, akampita kwa upande wa pili wa njia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampita tu.” Kitenzi cha Kigiriki kinaweza kumaanisha kupita kwa upande ulio mkabala, jambo linalodokeza kujiepusha naye kimakusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Kwa bahati
  rationale: Nahau hii inaonyesha kwamba tukio hilo lilitokea kwa sadfa; “kwa bahati” ni usemi wa kawaida wa Kiswahili bila kuingiza madai ya kifalsafa kuhusu nasibu.
- source_word: δὲ
  choice: (imewakilishwa na mwendelezo wa masimulizi)
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; Kiswahili hakihitaji neno la wazi hapa, kwa kuwa mpito unaeleweka kiasili.
- source_word: ἱερεύς τις
  choice: kuhani fulani
  rationale: '“Fulani” inahifadhi maana ya τις: mtu maalumu lakini asiyetajwa kwa jina.'
- source_word: κατέβαινεν
  choice: alikuwa akishuka
  rationale: Muundo huu unahifadhi hali endelevu ya kitenzi cha wakati usiotimilifu na wazo la kusafiri kuelekea chini.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: katika njia ile
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kusafiri kwenye njia iliyotajwa.
- source_word: ἰδὼν αὐτὸν
  choice: Alipomwona
  rationale: Muundo wa wakati unaonyesha kwamba kitendo kilichofuata kilitokea baada ya kuhani kumwona yule mtu.
- source_word: ἀντιπαρῆλθεν
  choice: akapita upande wa pili
  rationale: Kitenzi hiki hakimaanishi kupita tu, bali kupita kwa kujiepusha naye upande mwingine; tafsiri hii inahifadhi wazo hilo bila kuliongeza kupita kiasi.
