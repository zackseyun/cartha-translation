  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: sw
  text: Kaeni katika nyumba hiyo hiyo, mkila na kunywa mnavyopewa, kwa maana mfanyakazi anastahili ujira wake. Msihame kutoka nyumba moja hadi nyingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: katika nyumba hiyo hiyo
  rationale: Kirai hiki kinarejelea nyumba iliyowapokea na kusisitiza waendelee kukaa mahali pamoja.
- source_word: μένετε
  choice: Kaeni
  rationale: Amri ya wakati wa sasa inaonyesha kuendelea kukaa; “kaeni” ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: mkila na kunywa
  rationale: Vitenzi hivi vinaonyesha matendo yanayoendelea wakati wa kukaa katika nyumba hiyo.
- source_word: τὰ παρ’ αὐτῶν
  choice: wanavyowapa
  rationale: Kirai hiki kinamaanisha chakula na kinywaji ambacho wenyeji wanawapatia, bila kuongeza maelezo yasiyokuwapo katika maandishi.
- source_word: ἄξιος γὰρ ὁ ἐργάτης
  choice: kwa maana mfanyakazi anastahili
  rationale: “Mfanyakazi” ni neno la kawaida na pana, na “anastahili” linahifadhi wazo la kustahiki malipo.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: ujira wake
  rationale: Katika muktadha huu μισθός ni malipo ya kazi; umoja wa kirai cha Kigiriki umehifadhiwa kwa “wake.”
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Msihame kutoka nyumba moja hadi nyingine
  rationale: Amri hii inakataza kubadili mahali pa kulala kutoka kaya moja kwenda nyingine; “msihame” linaeleza maana hiyo kwa kawaida.
theological_decisions:
- issue: Umoja wa kiume katika τοῦ μισθοῦ αὐτοῦ
  choice: ujira wake
  alternative: ujira wao
  rationale: Kigiriki kina nomino na kiwakilishi cha umoja, huku kauli ikiwa ya jumla. Kiswahili “mfanyakazi … wake” huhifadhi umoja huo bila kulazimisha jinsia isiyoonyeshwa na sarufi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; marudio “nyumba hiyo hiyo” yanahifadhi msisitizo wa kubaki katika nyumba ileile.
