  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: sw
  text: Mkiingia katika nyumba yoyote, kwanza semeni, “Amani kwa nyumba hii.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amani iwe kwa nyumba hii,” au “Amani juu ya nyumba hii.” Kigiriki kina kauli fupi ya salamu na baraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: Mkiingia katika nyumba yoyote
  rationale: Muundo wa jamaa usioainisha pamoja na ἄν unaonyesha nyumba yoyote watakayoingia. Kiswahili hutumia kwa kawaida muundo wa masharti “mkiingia ... yoyote”; “katika” linaeleza kuingia ndani ya nyumba kwa ufasaha wa kawaida.
- source_word: πρῶτον
  choice: kwanza
  rationale: Neno hili linaonyesha jambo la kwanza kufanywa mara baada ya kuingia.
- source_word: λέγετε
  choice: semeni
  rationale: Amri ya Kigiriki inaagiza wanafunzi wengi watamke maneno hayo; “semeni” ni amri ya wingi iliyo wazi na ya kawaida.
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: Amani iwe katika nyumba hii
  rationale: Hii ni kauli fupi ya salamu na baraka. “Amani iwe katika” ni Kiswahili cha asili kinachohifadhi maana ya kuitakia nyumba amani bila kuifanya salamu ya kawaida tu.
theological_decisions:
- issue: Asili ya kauli ya amani
  choice: 'Kuitafsiri kama baraka inayotamkwa: “Amani iwe katika nyumba hii.”'
  alternative: “Amani kwa nyumba hii” au “Amani iwe juu ya nyumba hii.”
  rationale: Kauli ya Kigiriki ni fupi na inaweza kufanya kazi kama salamu na baraka. Tafsiri iliyochaguliwa hudumisha nguvu yake ya kuitakia nyumba amani, bila kuongeza maelezo ya kiliturujia.
- issue: Maana ya οἶκος katika baraka
  choice: nyumba
  alternative: watu wa nyumba hii / jamaa hii
  rationale: Katika muktadha, wanafunzi wanaingia katika makao halisi, lakini baraka inaweza kuwahusu pia wakaaji wake. “Nyumba” huhifadhi upana huo bila kuamua kimya-kimya kuwa inamaanisha jengo pekee au watu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo “Mkiingia ... yoyote” ni wa asili kuliko kufuata mpangilio wa Kigiriki neno kwa neno. Alama ya tanbihi [a] imewekwa baada ya kauli inayohusika.
