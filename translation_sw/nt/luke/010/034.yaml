id: LUK.10.34
reference: Luke 10:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: sw
  text: Akamkaribia, akafunga majeraha yake[a], akiyamiminia mafuta na divai. Kisha akampandisha juu ya mnyama wake mwenyewe[b], akampeleka kwenye nyumba ya wageni, na kumtunza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akayafunga majeraha yake kwa vitambaa.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “mnyama” humaanisha mnyama wa kubebea mizigo au wa kupandwa.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: Akamkaribia
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kumwendea na kumkaribia mtu aliyejeruhiwa kabla ya kumhudumia; tafsiri hii ni ya kawaida na huhifadhi mwendo huo.
- source_word: κατέδησεν
  choice: akafunga
  rationale: Neno hili humaanisha kufunga, hasa kufunga majeraha. 'Akafunga majeraha yake' ni usemi wa kawaida unaoweza kujumuisha kuyafunga kwa vitambaa bila kuongeza kifaa kisichotajwa wazi.
- source_word: τραύματα
  choice: majeraha
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa vidonda au madhara ya mwili yaliyotokana na shambulio.
- source_word: ἐπιχέων
  choice: akiyamiminia
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaeleza namna alivyoyahudumia majeraha; 'akiyamiminia' huhifadhi tendo la kumwaga vitu hivyo juu yake.
- source_word: ἔλαιον
  choice: mafuta
  rationale: Katika mazingira ya kale huenda yakawa mafuta ya zeituni, lakini neno la Kigiriki lenyewe ni 'mafuta'; tafsiri pana huhifadhi ulinganifu wa kileksika bila ufafanuzi usio lazima.
- source_word: οἶνον
  choice: divai
  rationale: Ni kisawe cha moja kwa moja na cha kawaida cha kinywaji kinachotajwa; matumizi yake ya kitabibu yanaachwa yadokezwe na muktadha.
- source_word: ἐπιβιβάσας
  choice: akampandisha juu ya
  rationale: Hueleza kumweka mtu aliyejeruhiwa juu ya mnyama ili abebwe; 'akampandisha' ni ya asili katika Kiswahili.
- source_word: ἴδιον
  choice: wake mwenyewe
  rationale: Huhifadhi msisitizo wa umiliki binafsi uliomo katika ἴδιον.
- source_word: κτῆνος
  choice: mnyama
  rationale: Neno hilo hutaja mnyama wa kubebea mizigo au wa kupandwa bila kubainisha aina; 'mnyama' huhifadhi upana huo.
- source_word: πανδοχεῖον
  choice: nyumba ya wageni
  rationale: Ni mahali pa malazi palipowapokea wasafiri; usemi huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: ἐπεμελήθη
  choice: kumtunza
  rationale: Kitenzi hiki huonyesha kumjali na kumhudumia mtu binafsi; 'kumtunza' ni kifupi, cha asili, na huhifadhi wazo hilo.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi unaotumia mfululizo wa vitenzi vya ka-. Lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya tendo la kufunga majeraha na [b] baada ya mnyama.'
