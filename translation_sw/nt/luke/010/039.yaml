  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: sw
  text: Naye alikuwa na dada aliyeitwa Mariamu, ambaye pia aliketi miguuni pa Yesu[a] na alikuwa akilisikiliza neno lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Bwana” badala ya “Yesu.”
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: naye
  rationale: Kiwakilishi hiki kinamrejelea Martha katika mstari uliotangulia; “naye” huendeleza simulizi kwa Kiswahili cha kawaida bila urudiaji mzito.
- source_word: ἀδελφὴ
  choice: dada
  rationale: Ni neno la kawaida na sahihi la undugu wa kike katika muktadha huu.
- source_word: καλουμένη Μαριάμ
  choice: aliyeitwa Maria
  rationale: Huwasilisha kwa ufasaha kishiriki kinachotaja jina la mtu.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: aliketi miguuni pa
  rationale: Huhifadhi kitendo cha kuketi na nafasi miguuni mwa mwalimu, bila kuongeza wazi maana ya kiuanafunzi ambayo inabaki kudokezwa.
- source_word: τοῦ Ἰησοῦ
  choice: Yesu
  rationale: SBLGNT iliyotolewa katika ombi hili ina Ἰησοῦ, hivyo jina “Yesu” linafuata moja kwa moja matini chanzo.
- source_word: ἤκουεν
  choice: alikuwa akilisikiliza
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, sawasawa na hali ya imperfect ya Kigiriki; kiambishi “-li-” kinarejelea neno.
- source_word: τὸν λόγον αὐτοῦ
  choice: neno lake
  rationale: Huhifadhi upana wa λόγος huku ikieleweka kuwa ni yale aliyokuwa akisema Yesu.
theological_decisions:
- issue: Tofauti ya matini katika jina au cheo baada ya “miguuni pa”
  choice: Yesu
  alternative: Bwana
  rationale: Matini ya SBLGNT iliyotolewa inasoma Ἰησοῦ (“Yesu”). Usomaji mwingine muhimu, κυρίου (“Bwana”), umehifadhiwa katika tanbihi badala ya kubadilisha matini chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Aliketi miguuni pa Yesu” ni usemi wa asili unaohifadhi picha ya Kigiriki, na “alikuwa akilisikiliza” huonyesha tendo endelevu.
