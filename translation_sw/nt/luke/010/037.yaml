  text: Naye akasema, “Ni yule aliyemwonyesha rehema.” Ndipo Yesu akamwambia, “Nenda, nawe ufanye vivyo hivyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Ni yule aliyemtendea kwa huruma
  rationale: Muundo huu unawakilisha kwa Kiswahili cha kawaida maana ya ‘yule aliyefanya/aliyetenda rehema kwake,’ huku ukihifadhi kitendo halisi cha huruma.
- source_word: Πορεύου
  choice: Nenda
  rationale: Amri ya moja kwa moja ya wakati uliopo imetafsiriwa kwa amri ya kawaida ya Kiswahili.
- source_word: καὶ σὺ
  choice: nawe
  rationale: 'Inahifadhi msisitizo wa kiwakilishi σὺ: si ‘fanya’ tu, bali ‘wewe pia.’'
- source_word: ποίει ὁμοίως
  choice: ufanye vivyo hivyo
  rationale: Inatoa amri ya kuendelea kutenda kwa mfano huohuo kwa lugha ya asili na inayoeleweka.
theological_decisions:
- issue: Msisitizo wa wajibu wa msikilizaji katika καὶ σὺ
  choice: nawe ufanye vivyo hivyo
  alternative: fanya vivyo hivyo
  rationale: Kutaja ‘nawe’ kunahifadhi msisitizo ulio wazi katika Kigiriki bila kuongeza fundisho lisilokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Ndipo’ linaonyesha mfuatano wa jibu na agizo la Yesu; hakuna tanbihi inayohitajika.
