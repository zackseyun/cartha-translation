id: LUK.10.21
reference: Luke 10:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: sw
  text: Saa hiyohiyo, Yesu akafurahi sana katika Roho Mtakatifu, akasema, “Ninakusifu[a], Baba, Bwana wa mbingu na dunia, kwa sababu uliwaficha mambo haya wenye hekima na ufahamu, ukawafunulia watoto wadogo[b]. Naam, Baba, kwa sababu ndivyo ilivyokupendeza[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakushukuru.” Kitenzi cha Kigiriki kinaweza kuonyesha shukrani pamoja na sifa katika sala.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “watoto wachanga.” Huenda hapa ni mfano wa watu wanyenyekevu, wanaotegemea wengine, au wasio na hadhi kubwa, wala si watoto tu kwa umri.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu hayo ndiyo yaliyokuwa mapenzi yako mema,” au “kwa sababu hayo ndiyo yaliyokuwa mapenzi yako ya neema.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Saa ileile
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo wa wakati uleule.
- source_word: ἠγαλλιάσατο
  choice: akafurahi sana
  rationale: Kitenzi kinaonyesha furaha kubwa; usemi huu ni wa asili na unaeleweka kuliko neno lenye sajili ya juu kama ‘akashangilia kwa furaha’.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Muundo wenye vibainishi unaelekea kumtaja Roho Mtakatifu; ‘katika’ huhifadhi uwezekano wa maana ya mazingira au njia bila kuibana.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ninakusifu
  rationale: Katika sala hii kitenzi kinaweza kuonyesha sifa pamoja na shukrani; ‘ninakusifu’ kinafaa kwa anwani ya kumtukuza Mungu, huku dokezo likihifadhi ‘ninakushukuru’.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Baba, Bwana wa mbingu na dunia
  rationale: Huhifadhi miito miwili ya Kigiriki na lugha ya kawaida ya enzi kuu ya Mungu.
- source_word: ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν
  choice: uliwaficha wenye hekima na ufahamu mambo haya
  rationale: Muundo huu wa Kiswahili huonyesha wazi watu ambao mambo yalifichwa kwao na huhifadhi jozi ya sifa za Kigiriki.
- source_word: ἀπεκάλυψας αὐτὰ
  choice: ukawafunulia
  rationale: ‘Kufunulia’ huhifadhi utofautishaji wa kitheolojia na kile kilichofichwa; kiwakilishi cha vitu kinaeleweka kutokana na ‘mambo haya’.
- source_word: νηπίοις
  choice: watoto wadogo
  rationale: Huhifadhi picha ya watoto wachanga au wadogo bila kuitafsiri moja kwa moja kuwa ‘wanyenyekevu’; dokezo linaeleza maana halisi na matumizi ya kimfano.
- source_word: ναί, ὁ πατήρ
  choice: Naam, Baba
  rationale: ‘Naam’ ni thibitisho lenye hadhi linalofaa katika sala na huhifadhi mwito unaorudiwa.
- source_word: ὅτι οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: kwa sababu ndivyo ilivyokupendeza
  rationale: Ni Kiswahili cha asili kinachoonyesha kwamba jambo hilo lilikuwa jema au la kupendeza mbele za Baba, bila kuligeuza kwa lazima kuwa istilahi dhahania ya ‘mapenzi’.
theological_decisions:
- issue: Rejeo la τῷ πνεύματι τῷ ἁγίῳ
  choice: Roho Mtakatifu kama mhusika wa kimungu
  alternative: rohoni mwake / katika roho
  rationale: Vibainishi vinavyoambatana na nomino na kivumishi vinaunga mkono zaidi rejeo maalumu kwa Roho Mtakatifu; tafsiri haibainishi kupita kiasi kama ni nyanja au njia.
- issue: Maana ya εὐδοκία katika kauli kuhusu Baba
  choice: ndivyo ilivyokupendeza
  alternative: hayo ndiyo yaliyokuwa mapenzi yako mema / hayo ndiyo yaliyokuwa mapenzi yako ya neema
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kupendeza au ridhaa ya Mungu bila kuamua kimyakimya kama nomino hiyo inamaanisha hasa ‘mapenzi,’ ‘ridhaa,’ au ‘kusudi la neema’.
- issue: Wapokeaji wanaoitwa νηπίοις
  choice: picha ya watoto wadogo imehifadhiwa
  alternative: wanyenyekevu / watu wasio na cheo
  rationale: Muktadha huenda ukatumia neno hilo kimfano, lakini kubadili picha kuwa tafsiri yake kungeondoa mvutano kati ya maana halisi na maana ya kimfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi bila kuwa kizito. ‘Naam’ hudumisha uzito wa sala; ‘akafurahi sana’ na ‘ndivyo ilivyokupendeza’ ni wazi kwa wasomaji wa kawaida. Alama zote za madokezo [a], [b], na [c] zimewekwa katika matini kuu karibu na maneno yanayohusika.
