  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: sw
  text: Vitu vyote vimekabidhiwa kwangu na Baba yangu.[a] Hakuna mtu anayejua Mwana ni nani isipokuwa Baba; wala hakuna anayejua Baba ni nani isipokuwa Mwana na yeyote ambaye Mwana anataka kumfunulia Baba ni nani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila kitu kimekabidhiwa kwangu na Baba yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye Mwana anaamua kumfunulia Baba ni nani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Vitu vyote
  rationale: Nomino ya wingi isiyo na jinsia ina maana pana ya jumla. “Vitu vyote” huhifadhi upana huo kwa Kiswahili cha kawaida; “kila kitu” pia linawezekana.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: nimekabidhiwa na Baba yangu
  rationale: Muundo wa kutendwa unahifadhi msisitizo wa Kigiriki kwamba vitu vyote vilikabidhiwa kwa Mwana, huku “na Baba yangu” ikionyesha mtendaji wa tendo hilo. Kauli timilifu ya Kiswahili inaonyesha tendo lililotimizwa lenye matokeo yanayoendelea.
- source_word: γινώσκει
  choice: anayejua
  rationale: “Kujua” ndilo neno la kawaida na sahihi hapa. Tafsiri haiongezi “kikamilifu,” ingawa muktadha unaonyesha ujuzi wa pekee.
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: Mwana ni nani / Baba ni nani
  rationale: Muundo huu wa asili wa Kiswahili huhifadhi swali la utambulisho na uhusiano bila kulipanua kwa maelezo ya kitafsiri.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς
  choice: yeyote ambaye Mwana anataka
  rationale: Muundo huu unaonyesha mpokeaji asiyeainishwa na utashi wa Mwana. “Anataka” ni Kiswahili cha sasa na cha kawaida, bila kudhoofisha kuwa Mwana ndiye mwenye kuamua kufunua.
- source_word: ἀποκαλύψαι
  choice: kumfunulia Baba ni nani
  rationale: “Kufunulia” huhifadhi maana ya ufunuo. Kurudia “Baba ni nani” kunaweka wazi katika Kiswahili kwamba Baba ndiye anayefunuliwa, na kwamba “yeyote” ndiye mpokeaji.
theological_decisions:
- issue: Ujuzi wa kipekee na wa pande mbili kati ya Baba na Mwana
  choice: Kauli ya moja kwa moja kwamba hakuna anayemjua Mwana isipokuwa Baba, wala Baba isipokuwa Mwana, imehifadhiwa bila nyongeza.
  alternative: Kuongeza maneno kama “anamjua kikamilifu” au “anamjua kwa kweli.”
  rationale: Kigiriki chenyewe kinabeba uzito wa uhusiano huo wa pekee, lakini hakina kielezi kinacholingana moja kwa moja na “kikamilifu”; kwa hiyo tafsiri haiongezi ufafanuzi wa kimadhehebu.
- issue: Utashi wa Mwana katika kumfunua Baba
  choice: βούληται limetafsiriwa “anataka,” huku Mwana akibaki kuwa mwenye utashi wa kufunua.
  alternative: “anachagua” au “anaamua.”
  rationale: “Anataka” huhifadhi maana ya volition ya kitenzi bila kuifanya kuwa mfumo maalumu wa kiteolojia; sentensi bado inaweka wazi kwamba ufunuo hutegemea utashi wa Mwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya cheo “Baba” na “Mwana” yameandikwa kwa herufi kubwa. Muundo wa mwisho umerudia “Baba ni nani” ili kuepuka utata wa viambishi vya nafsi katika Kiswahili.
