  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: sw
  text: Naye akajibu, “Mpende Bwana Mungu wako kwa moyo wako wote, na kwa nafsi yako yote, na kwa nguvu zako zote, na kwa akili yako yote; na jirani yako kama nafsi yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi kikuu unatafsiriwa kwa Kiswahili cha masimulizi kwa kitenzi kimoja cha kawaida bila kupoteza maana.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Wakati ujao wa Kigiriki hapa una nguvu ya amri katika nukuu ya Maandiko; hali ya kuamuru ni ya asili na wazi katika Kiswahili.
- source_word: κύριον τὸν θεόν σου
  choice: Bwana Mungu wako
  rationale: Huhifadhi cheo cha kimungu κύριος na kumtambulisha Mungu wa Israeli katika nukuu hii ya Maandiko.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: kutoka katika moyo wako wote
  rationale: Huhifadhi maana ya msingi ya ἐξ, ‘kutoka katika,’ na tofauti yake na ἐν katika mafungu yanayofuata, ingawa Kiswahili cha kawaida mara nyingi husema ‘kwa moyo wako wote.’
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: kwa nafsi yako yote
  rationale: ‘Nafsi’ huhifadhi istilahi tofauti katika orodha bila kuifanya fundisho la kiufundi kuhusu sehemu za mwanadamu.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: kwa nguvu zako zote
  rationale: Ni tafsiri ya kawaida na ya sasa ya ἰσχύς, ikionyesha uwezo au nguvu zote za mtu.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: kwa akili yako yote
  rationale: ‘Akili’ ni tafsiri ya asili ya uwezo wa kufikiri na kuelewa unaoonyeshwa na διάνοια.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: Ni tafsiri iliyozoeleka katika muktadha wa maadili na huhifadhi uhusiano unaokusudiwa.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kiswahili kinahitaji kukamilisha kwa uwazi kitenzi kilichodokezwa; tafsiri hii huhifadhi ulinganisho wa ὡς na maana ya amri.
theological_decisions:
- issue: Cheo cha kimungu κύριος katika nukuu ya amri
  choice: Bwana
  alternative: Mkuu / Bwana mkubwa
  rationale: ‘Bwana’ ni cheo cha kawaida cha kimungu na kinafaa kwa rejeleo la Mungu wa Israeli; mbadala ungepunguza mwangwi wa kimaandiko.
- issue: Maneno καρδία, ψυχή, ἰσχύς, διάνοια kuhusu utu wa mwanadamu
  choice: Kuhifadhi vipengele vinne kama moyo, nafsi, nguvu, na akili
  alternative: Kuvijumlisha kama ‘kwa utu wako wote’
  rationale: Orodha inaonyesha ukamilifu wa upendo kwa Mungu kwa maneno yanayoingiliana. Kuyahifadhi huepuka kuifupisha tamathali au kuingiza mgawanyo mkali wa kiufundi wa utu.
- issue: Tofauti ya vihusishi ἐξ na ἐν
  choice: ‘kutoka katika’ kwa moyo, kisha ‘kwa’ kwa nafsi, nguvu, na akili
  alternative: ‘kwa’ katika mafungu yote manne
  rationale: Chaguo hili huhifadhi tofauti halisi ya muundo wa Kigiriki na mvutano wake wa kimtindo bila kudai kwamba tofauti hiyo lazima iwe na maana maalumu ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Naye akajibu’ kinaendeleza masimulizi; ‘Mpende’ huwasilisha amri kwa namna ya asili. Alama ya chini [a] imewekwa mara moja katika matini kuu.
