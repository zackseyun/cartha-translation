base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: sw
  text: Naye akawaambia, “Nilikuwa nikimwona[a] Shetani akianguka kama umeme kutoka mbinguni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilimwona Shetani akianguka kama umeme kutoka mbinguni.” Kitenzi cha Kigiriki cha wakati usiotimilifu kinaweza kutafsiriwa kwa ufupi kuwa “nilimwona,” ingawa “nilikuwa nikimwona” hudumisha vizuri zaidi hali ya tendo lililokuwa likiendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Naye akawaambia
  rationale: Kauli hii huendeleza simulizi kwa kiunganishi hafifu δέ bila kulazimisha maana ya wakati kama ‘ndipo’; ‘akawaambia’ ni namna ya kawaida na ya asili ya kuonyesha kitendo cha kusema kwao.
- source_word: Ἐθεώρουν
  choice: Nilikuwa nikimwona
  rationale: Muundo huu unahifadhi hali endelevu ya kitenzi cha wakati usiotimilifu, huku ukisomeka kwa kawaida katika Kiswahili. ‘Kumwona’ pia inafaa katika muundo unaofuatiwa na tendo la Shetani la kuanguka.
- source_word: τὸν Σατανᾶν
  choice: Shetani
  rationale: Hili ndilo jina au cheo cha kawaida katika Kiswahili kwa mhusika anayetajwa na Σατανᾶς.
- source_word: ὡς ἀστραπὴν
  choice: kama umeme
  rationale: ‘Kama’ huonyesha wazi ulinganisho wa ὡς, na ‘umeme’ ni neno la kawaida kwa mwanga mkali wa radi unaokusudiwa hapa.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika muktadha huu, ‘mbinguni’ hudumisha maana ya eneo la kimbingu badala ya kuibana kuwa anga la kawaida tu.
- source_word: πεσόντα
  choice: akianguka
  rationale: Kishirikishi hiki kinamfafanua Shetani akiwa katika tendo la kuanguka; muundo wa Kiswahili ‘kumwona ... akianguka’ ni wa asili na huhifadhi uhusiano huo.
theological_decisions:
- issue: Wakati na hali ya kauli ya Yesu kuhusu kuanguka kwa Shetani
  choice: Nilikuwa nikimwona Shetani akianguka kama umeme kutoka mbinguni
  alternative: Nilimwona Shetani akianguka kama umeme kutoka mbinguni
  rationale: Tafsiri inadumisha hali endelevu ya Ἐθεώρουν bila kuamua kama Yesu anarejelea anguko la zamani, matokeo ya huduma ya wanafunzi wakati huo, au maono ya kinabii kuhusu kushindwa kwa Shetani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa sentensi hudumisha picha na utata halisi wa chanzo bila kuongeza maelezo ya kimafundisho.
