  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: sw
  text: Lakini, katika hukumu, itakuwa nafuu zaidi kwa Tiro na Sidoni kuliko kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “itakuwa rahisi zaidi kuvumilika kwa Tiro na Sidoni kuliko kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Huleta utofautishaji wenye nguvu na hukumu iliyotangulia; “Lakini” ni ya kawaida na ya asili katika Kiswahili cha sasa.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: kwa Tiro na Sidoni
  rationale: Nomino hizi katika hali ya dative zinaonyesha wale ambao hukumu itakuwa rahisi zaidi kuvumilika kwao.
- source_word: ἀνεκτότερον
  choice: afadhali kuvumilika
  rationale: Huwasilisha maana linganishi ya jambo kuwa rahisi zaidi kustahimili; muundo huu ni wa asili kuliko tafsiri ya neno kwa neno kama “lenye kuvumilika zaidi.”
- source_word: ἔσται
  choice: itakuwa
  rationale: Ni kitenzi cha wakati ujao kinachounganisha kauli ya ulinganisho.
- source_word: ἐν τῇ κρίσει
  choice: katika hukumu
  rationale: Huhifadhi kihusishi na umaalumu wa kirai cha Kigiriki bila kufafanua kupita kiasi asili ya hukumu ndani ya matini kuu.
- source_word: ἢ ὑμῖν
  choice: kuliko kwenu
  rationale: Hukamilisha ulinganisho na kudumisha maana ya dative kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili ya κρίσις katika muktadha
  choice: hukumu
  alternative: hukumu ya mwisho
  rationale: Muktadha unaelekea kwenye hukumu ya mwisho ya Mungu, lakini matini yenyewe inasema tu “hukumu”; tafsiri haiongezi ufafanuzi wa kieskatolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Afadhali kuvumilika” hutoa ulinganisho kwa namna inayoeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi muundo ulio karibu zaidi na Kigiriki.
