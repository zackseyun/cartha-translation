  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: sw
  text: Naye akawaambia, “Mavuno ni mengi, lakini wafanyakazi ni wachache. Kwa hiyo, mwombeni Bwana wa mavuno awatume[a] wafanyakazi kwenda katika mavuno yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awasukume kwa nguvu”; kitenzi cha Kigiriki kinaweza kuwa na maana kali zaidi kuliko “awatume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: akawaambia
  rationale: Ingawa kitenzi hiki ni cha wakati usiotimilika, katika utangulizi wa kauli ya kisimulizi ‘akawaambia’ ni Kiswahili cha kawaida na hudumisha kwamba aliwaelekezea maneno hayo.
- source_word: δὲ
  choice: Naye
  rationale: Ni kiunganishi hafifu kinachoendeleza simulizi; ‘Naye’ huleta mwendelezo wa kawaida bila kuweka tofauti kali.
- source_word: θερισμός
  choice: mavuno
  rationale: Hudumisha taswira ya kilimo pamoja na matumizi yake ya kimfano.
- source_word: πολύς
  choice: ni mengi
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza wingi wa mavuno.
- source_word: ἐργάται
  choice: wafanyakazi
  rationale: Ni neno la sasa na linaloeleweka kwa watu wanaofanya kazi ya mavuno bila kuwafanya kuwa ‘wavunaji’ pekee kwa ufafanuzi usiotajwa wazi.
- source_word: ὀλίγοι
  choice: ni wachache
  rationale: Hudumisha kwa uwazi utofauti kati ya wingi wa mavuno na uchache wa wafanyakazi.
- source_word: δεήθητε
  choice: mwombeni
  rationale: Amri hii inamaanisha kutoa ombi la dhati; ‘mwombeni’ ni ya kawaida katika muktadha wa sala na hudumisha mlengwa wa ombi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na wingi wa mavuno na uchache wa wafanyakazi.
- source_word: κύριος
  choice: Bwana
  rationale: Hudumisha mamlaka na uzito wa kitheolojia wa cheo hicho bila kufafanua zaidi mhusika anayerejelewa.
- source_word: ὅπως
  choice: a-
  rationale: Katika Kiswahili, muundo ‘mwombeni ... awatume’ huwasilisha kwa kawaida yaliyomo au kusudi la ombi bila kiunganishi tofauti.
- source_word: ἐκβάλῃ
  choice: awatume
  rationale: Katika muktadha huu humaanisha kuwapeleka wafanyakazi waende katika mavuno. ‘Awatume’ ni ya kawaida, huku dokezo likihifadhi nguvu kubwa zaidi inayoweza kuwa katika kitenzi cha Kigiriki.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: katika mavuno yake
  rationale: Hudumisha mwelekeo wa kuingia katika kazi ya mavuno na umilikaji wake bila kuongeza neno ‘shamba,’ ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Mhusika anayerejelewa na nguvu ya cheo ‘Bwana wa mavuno’
  choice: Kudumisha cheo ‘Bwana wa mavuno’ bila kumtaja au kumfafanua mhusika zaidi
  alternative: Kufafanua kuwa ni Mungu anayemiliki na kuongoza utume, au kuwa Yesu anadokeza mamlaka ya kimungu juu ya utume
  rationale: Aya inaonyesha mwenye mamlaka anayemiliki mavuno na kuwatuma wafanyakazi, lakini hapa haifafanui moja kwa moja athari zake za kikristo. Tafsiri inaacha mvutano huo kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku taswira ya mavuno, amri ya kuomba, na utata halisi wa kitheolojia vikidumishwa.
