id: LUK.10.15
reference: Luke 10:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: sw
  text: Nawe, Kapernaumu, je, utainuliwa mpaka mbinguni? Utashushwa mpaka Kuzimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu wa wafu.” Kigiriki ni Hadesi, si Gehena (“jehanamu”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: μὴ ... ὑψωθήσῃ
  choice: je, utainuliwa
  rationale: Muundo huu umeeleweka kama swali la balagha linalotarajia jibu hasi. Kitenzi cha kutendwa ‘utainuliwa’ kinahifadhi hali ya kisarufi na wazo la kuinuliwa kwa hadhi.
- source_word: ἕως οὐρανοῦ
  choice: mpaka mbinguni
  rationale: ‘Mpaka’ linaonyesha ukomo wa mwendo wa juu, huku ‘mbinguni’ likihifadhi taswira ya mahali na ulinganifu wake na kushushwa Kuzimu.
- source_word: ἕως τοῦ ᾅδου
  choice: mpaka Kuzimu
  rationale: ‘Kuzimu’ hapa humaanisha makao au ulimwengu wa wafu na huhifadhi tofauti ya ᾅδης na Gehenna; halitafsiriwi ‘jehanamu,’ ambalo lingeweza kuingiza maana ya adhabu ya mwisho.
- source_word: καταβιβασθήσῃ
  choice: utashushwa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba mhusika atasababishwa kushuka; pia kinahifadhi tofauti na fedheha inayodokezwa na kuinuliwa.
theological_decisions:
- issue: Tafsiri ya ᾅδης
  choice: Kuzimu
  alternative: ulimwengu wa wafu; jehanamu
  rationale: ‘Kuzimu’ linadumisha rejeo la ᾅδης kwa makao ya wafu bila kulilinganisha moja kwa moja na Gehenna au kuamua zaidi ya inavyosema matini.
- issue: Muundo wa μὴ ... ὑψωθήσῃ
  choice: 'swali la balagha: ‘je, utainuliwa...?’'
  alternative: 'kauli hasi: ‘hutainuliwa...’'
  rationale: Kihusishi μὴ pamoja na kitenzi hiki kinafaa kueleweka kama swali linalotarajia jibu hasi, hivyo mvutano wa swali na jibu kali linalofuata umehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nawe’ linaendeleza usemi wa moja kwa moja kwa mji, na ‘mpaka ... mpaka ...’ linahifadhi ulinganifu wa taswira ya juu na chini.
