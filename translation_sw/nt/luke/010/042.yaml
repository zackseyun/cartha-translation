  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: sw
  text: Lakini vinahitajika vitu vichache—au kimoja tu.[a] Kwa maana Maria amechagua fungu jema,[b] ambalo halitaondolewa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo moja tu ndilo linalohitajika.” Katika mazingira haya ya chakula, Kigiriki kinaweza pia kumaanisha, “vyakula vichache vinahitajika—au chakula kimoja tu.”
    reason: alternative_reading
  - marker: b
    text: Au, “sehemu njema.” Neno “fungu” linaweza kudokeza fungu la chakula na pia sehemu ya mfano katika kile kilicho cha thamani kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Lakini vinahitajika vitu vichache—au kimoja tu
  rationale: Muundo huu unaonyesha uhitaji wa vitu vichache, kwa kulinganisha na kitu kimoja. Neno “vitu” limeongezwa ili Kiswahili kiwe cha kawaida, huku usemi mfupi “au kimoja tu” ukihifadhi uwezekano wa kurejelea chakula au jambo moja la lazima.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: fungu jema
  rationale: “Fungu” linaweza kumaanisha sehemu ya chakula na pia sehemu au mgao wa thamani kwa maana ya mfano. “Jema” linaakisi ἀγαθή bila kulifanya kuwa linganishi, kama “bora” lingavyoweza kufanya.
- source_word: ἐξελέξατο
  choice: amechagua
  rationale: Wakati timilifu wa Kiswahili unaonyesha uchaguzi wa Maria na matokeo yake yanayoendelea, kama inavyothibitishwa na kishazi kinachofuata.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: ambalo hataondolewa
  rationale: Kiwakilishi “ambalo” kinarejelea “fungu,” na “hataondolewa” ni usemi wa kawaida wa Kiswahili unaohifadhi hali tendwa na ahadi ya kudumu.
theological_decisions:
- issue: Maana ya “vitu vichache—au kimoja” katika uhusiano na huduma ya Martha na uchaguzi wa Maria
  choice: Kuhifadhi usemi unaoweza kueleweka kuwa vitu vichache vinahitajika, au kimoja tu, bila kuamua ikiwa ni vyakula vichache, chakula kimoja, au jambo moja muhimu.
  alternative: “Jambo moja tu ndilo linalohitajika,” au “Vyakula vichache tu vinahitajika—hata kimoja.”
  rationale: Kigiriki kinaweza kuhusiana moja kwa moja na maandalizi ya chakula au kuonyesha jambo moja la lazima kwa maana pana zaidi. Tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi na alama ya mkato huhifadhi ufupi na sintaksia yenye utata ya Kigiriki.
