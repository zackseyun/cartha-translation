id: LUK.10.24
reference: Luke 10:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: sw
  text: Kwa maana nawaambia kwamba manabii wengi na wafalme walitamani[a] kuona yale mnayoyaona, lakini hawakuyaona, na kusikia yale mnayoyasikia, lakini hawakuyasikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana nawaambia
  rationale: “Nawaambia” ni tafsiri ya kawaida na ya moja kwa moja ya λέγω ὑμῖν; “kwa maana” inadumisha uhusiano wa maelezo unaoonyeshwa na γάρ katika muktadha uliotangulia.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: manabii wengi na wafalme
  rationale: Inahifadhi makundi ya kihistoria yaliyotajwa wazi katika Kigiriki bila kupanua “wafalme” kuwa “watawala.”
- source_word: ἠθέλησαν
  choice: walitamani
  rationale: Katika muktadha huu θέλω huonyesha shauku au nia ya dhati; “walitamani” ni ya asili, yenye hadhi, na haiongezi nguvu kupita kiasi.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: kuona yale mnayoyaona
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida wingi wa ἃ na unadumisha utofauti wa kitenzi cha wakati uliopita cha kutamani na kile cha sasa cha wanafunzi kuona.
- source_word: καὶ οὐκ εἶδαν
  choice: lakini hawakuyaona
  rationale: Ingawa καί kwa umbo ni “na,” hapa inaonyesha tofauti na tamanio lililotangulia; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha kawaida. Kiambishi “-ya-” kinarejelea “yale.”
- source_word: καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: na kusikia yale mnayoyasikia, lakini hawakuyasikia
  rationale: Inahifadhi usambamba wa kuona na kusikia, huku viambishi vya yambwa vikirejelea wazi mambo yanayosikiwa.
theological_decisions:
- issue: Utambulisho wa “manabii na wafalme”
  choice: Kudumisha makundi ya kihistoria “manabii” na “wafalme” bila maelezo ya nyongeza.
  alternative: “Manabii na watawala” au “manabii na wafalme wa zamani.”
  rationale: Kigiriki kinataja makundi haya moja kwa moja. Tafsiri haipaswi kuamua zaidi utambulisho wao wala kuongeza “wa zamani,” ingawa muktadha unaashiria watu waliotangulia wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yale mnayoyaona” na “yale mnayoyasikia” ni miundo ya kawaida inayoeleweka kwa urahisi na inayohifadhi usambamba wa Kigiriki.
