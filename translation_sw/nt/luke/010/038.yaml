  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: sw
  text: Walipokuwa wakisafiri, yeye akaingia katika kijiji fulani, na mwanamke mmoja aitwaye Martha akamkaribisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampokea.” Kitenzi cha Kigiriki kina maana ya kumpokea mtu kwa ukarimu kama mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Walipokuwa wakiendelea na safari
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha tendo linaloendelea wakati huohuo. Wingi wa αὐτούς unaonyesha kuwa kundi lote lilikuwa safarini.
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi hiki kimetiliwa mkazo katika Kigiriki na kinamtofautisha Yesu na kundi lililotajwa kwa wingi; ‘yeye’ huhifadhi utofautishaji huo bila kuongeza jina ‘Yesu.’
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi kinaeleza kwa ufupi tukio lililofuata katika simulizi; kiambishi ‘ka-’ kinaendeleza mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: εἰς κώμην τινά
  choice: katika kijiji fulani
  rationale: κώμη ni ‘kijiji,’ na τινά inaonyesha mahali pasipotajwa kwa jina lakini mahususi katika simulizi, hivyo ‘fulani’ inafaa.
- source_word: γυνὴ δέ τις
  choice: na mwanamke mmoja
  rationale: δέ hapa huendeleza simulizi na kumtambulisha mhusika mpya. ‘Mwanamke mmoja’ huwasilisha hali ya kutotajwa hapo awali bila kuwa nzito.
- source_word: ὀνόματι Μάρθα
  choice: aitwaye Martha
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili wa kutambulisha jina la mtu.
- source_word: ὑπεδέξατο
  choice: akamkaribisha
  rationale: Kitenzi hiki kina maana ya kumpokea mtu kwa ukarimu kama mgeni. ‘Akamkaribisha’ huwasilisha maana hiyo bila kuongeza mahali kama ‘nyumbani kwake,’ ambayo haikutajwa wazi katika Kigiriki.
- source_word: αὐτὸν
  choice: -m- katika ‘akamkaribisha’
  rationale: Kiambishi cha yambwa kinamrejelea Yesu kwa njia ya kawaida ya Kiswahili.
