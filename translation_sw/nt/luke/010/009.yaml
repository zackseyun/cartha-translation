  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: sw
  text: Waponyeni wagonjwa waliomo humo, na waambieni, “Ufalme wa Mungu umewakaribia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umekaribia kwenu.”
    reason: Mbadala huu unaonyesha kwa njia nyingine maana ya ἤγγικεν ἐφ’ ὑμᾶς bila kuondoa wazo la kukaribia kuliko na umuhimu wa sasa.
lexical_decisions:
- source_word: θεραπεύετε
  choice: Waponyeni
  rationale: Kitenzi cha amri katika wingi kinaeleza tendo la kuwaponya wagonjwa; katika muktadha huu, maana ya ugonjwa wa mwili ndiyo inayotawala.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: wagonjwa waliomo humo
  rationale: ἀσθενεῖς inaweza kumaanisha walio dhaifu au wagonjwa, lakini θεραπεύετε inaonyesha wazi maana ya wagonjwa. ‘Humo’ hurejelea mji uliotajwa katika mstari uliotangulia.
- source_word: λέγετε αὐτοῖς
  choice: waambieni
  rationale: Hii ni amri ya moja kwa moja kwa watu wengi, na ‘waambieni’ ni Kiswahili cha kawaida na cha asili katika sentensi hii.
- source_word: Ἤγγικεν
  choice: umewakaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha kwamba ufalme umekuja karibu na sasa uko karibu; umbo la Kiswahili lenye ‘-me-’ linadumisha umuhimu huo wa sasa.
- source_word: ἐφ’ ὑμᾶς
  choice: -wa- katika ‘umewakaribia’
  rationale: Kiambishi hiki kinawataja wasikilizaji walio wengi na kuonyesha kwamba ufalme umekuja karibu nao, bila kuongeza maana ya uhasama.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni usemi wa kawaida wa kibiblia unaodumisha upana wa maana ya utawala na milki ya Mungu bila kuibana kuwa dhana moja tu.
theological_decisions:
- issue: Maana ya tangazo kwamba ufalme umekaribia
  choice: Tangazo linaeleza kwamba ufalme wa Mungu umekuja karibu na wasikilizaji na una umuhimu wa sasa.
  alternative: Ufalme umetimia kikamilifu sasa, au bado ni wa wakati ujao tu.
  rationale: Ἤγγικεν huonyesha kukaribia kulikotokea na matokeo yake ya sasa, lakini mstari wenyewe hauamui kikamilifu uhusiano kati ya uwepo wa sasa na utimilifu wa baadaye. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waliomo humo’ hurejelea kwa kawaida mji uliotangulia, huku ‘umewakaribia’ ikiwa fupi, wazi, na yenye kudumisha hali ya wakati timilifu.
