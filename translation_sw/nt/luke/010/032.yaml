base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: sw
  text: Vivyo hivyo, Mlawi pia alipofika mahali hapo na kumwona, akapita upande wa pili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapita tu.” Hata hivyo, muundo wa kitenzi cha Kigiriki unaweza kudokeza kupita upande wa pili kwa kuepuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Inaunganisha tendo la Mlawi na mfano uliotangulia wa kuhani na kuhifadhi maana ya ulinganisho kwa Kiswahili cha kawaida.
- source_word: δὲ καὶ
  choice: pia
  rationale: δὲ ni kiunganishi hafifu kisichohitaji kutafsiriwa peke yake hapa, huku καὶ ikionyesha kwamba Mlawi anaongezwa kama mfano mwingine.
- source_word: Λευίτης
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa jamii ya Walawi, na linahifadhi utambulisho wake wa kihistoria na kidini.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: alifika mahali pale
  rationale: Kirai hiki kinaonyesha kufika katika eneo lilelile lililotajwa katika simulizi; “mahali pale” ni cha asili na hakiongezi maelezo yasiyokuwapo.
- source_word: ἰδὼν
  choice: alipomwona
  rationale: Kitenzi kishirikishi kinaonyesha kuona kulikotangulia tendo kuu; kiambishi cha yambwa “-m-” kinarejelea mtu aliyejeruhiwa kutokana na muktadha.
- source_word: ἀντιπαρῆλθεν
  choice: akapita upande wa pili
  rationale: Kitenzi ambatano kinadokeza kupita kwa kujiepusha, si kupita tu; “upande wa pili” kinahifadhi nguvu hiyo bila kueleza nia kupita kiasi.
theological_decisions:
- issue: Utambulisho wa kijamii na kidini wa Λευίτης
  choice: Mlawi
  alternative: mtumishi wa Hekalu; mtu wa kabila la Lawi
  rationale: Kutumia jina la kikundi kunahifadhi umaalumu wa kihistoria na usambamba wake na kuhani bila kuingiza ufafanuzi wa ziada katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “naye ... akapita” unatiririka kwa kawaida. Kielezi cha mahali kimewekwa bila tanbihi kwa sababu “mahali pale” kinawakilisha vizuri κατὰ τὸν τόπον; tanbihi imehifadhiwa kwa utata halisi wa nguvu ya ἀντιπαρῆλθεν.
