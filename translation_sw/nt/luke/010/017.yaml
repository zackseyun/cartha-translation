  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: sw
  text: Kisha wale sabini na wawili walirudi kwa furaha[a], wakisema, “Bwana, hata pepo wanatutii kwa jina lako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasema “wale sabini” badala ya “wale sabini na wawili.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: walirudi
  rationale: Kitenzi hiki cha wakati uliopita kinaeleza kurudi kwao kutoka katika utume; “walirudi” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi. “Kisha” huonyesha hatua inayofuata kwa njia ya asili bila kuifanya kuwa tofauti kali.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: wale sabini na wawili
  rationale: Matini ya SBLGNT ina “sabini na wawili.” Kibainishi “wale” kinarejelea kundi lililotajwa awali; tofauti ya “sabini” imehifadhiwa katika tanbihi.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Hili ni badiliko la asili la Kiswahili linalohifadhi nomino χαρά na kueleza hali ya kurudi kwao.
- source_word: λέγοντες
  choice: wakisema
  rationale: Umbo la “waka-” linaunganisha kitendo cha kusema na kurudi kwao, likihifadhi uhusiano wa participio ya Kigiriki kwa Kiswahili cha asili.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni mwito wa κύριος unaoelekezwa kwa Yesu; “Bwana” ni tafsiri sanifu, yenye heshima na isiyo ya kimadhehebu.
- source_word: καὶ
  choice: hata
  rationale: 'Katika mshangao huu καί ina maana ya kupandisha msisitizo: si wengine tu, bali hata pepo.'
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: “Pepo” ni neno la kawaida katika Kiswahili cha Biblia kwa viumbe wa kiroho wenye uhasama. Muktadha huondoa maana ya upepo; kuongeza “wabaya” kungekuwa ufafanuzi usio katika nomino yenyewe.
- source_word: ὑποτάσσεται
  choice: wanatutii
  rationale: Katika muktadha huu ὑποτάσσομαι pamoja na dative humaanisha kunyenyekea au kutii mamlaka ya mtu. “Wanatutii” ni ya asili na huwasilisha hali ya sasa inayoelezwa na wanafunzi.
- source_word: ἡμῖν
  choice: -tu-
  rationale: Kiwakilishi cha yambwa katika “wanatutii” kinawasilisha dative ἡμῖν, yaani “sisi.”
- source_word: ἐν τῷ ὀνόματί σου
  choice: kwa jina lako
  rationale: Kirai hiki kinaonyesha msingi au njia ya mamlaka yanayohusishwa na jina la Yesu. “Kwa jina lako” ni Kiswahili cha asili na hakifafanui kupita kiasi jinsi mamlaka hayo yanavyofanya kazi.
theological_decisions:
- issue: Tofauti ya matini kuhusu idadi ya wanafunzi
  choice: sabini na wawili
  alternative: sabini
  rationale: Matini iliyotolewa ya SBLGNT inasoma “sabini na wawili.” Kwa kuwa “sabini” ni tofauti muhimu ya hati, imehifadhiwa katika tanbihi badala ya kupuuzwa.
- issue: Maana ya kutenda katika jina la Yesu
  choice: kwa jina lako
  alternative: kwa mamlaka ya jina lako
  rationale: Tafsiri fupi huhifadhi upeo wa maana wa ἐν τῷ ὀνόματί σου bila kuamua kimya kimya kwamba kirai hicho kinamaanisha mamlaka pekee, ingawa mamlaka imo katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi msisitizo wa “hata,” nomino “furaha,” na tofauti muhimu ya matini.
