base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: sw
  text: 'Hata hivyo, msifurahi kwa sababu hii: roho[a] zinawatii; bali furahini kwa sababu majina yenu yameandikwa mbinguni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muktadha unaonyesha viumbe wa kiroho wenye uadui; pia ingeweza kutafsiriwa “pepo” au “roho waovu,” ingawa Kigiriki hapa kinasema tu “roho.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kimetumia umbo la wingi, yaani “katika mbingu.” Katika Kiswahili, “mbinguni” ni usemi wa kawaida na hauonyeshi wazi tofauti ya umoja na wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Hata hivyo
  rationale: Inaonyesha pingamizi lenye nguvu na kusahihisha jambo lililokuwa limewafurahisha wanafunzi, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐν τούτῳ
  choice: kwa sababu hii
  rationale: Katika muktadha wa kufurahi, usemi huu wa Kiswahili unaonyesha wazi jambo au msingi wa furaha unaotajwa mara moja baada yake.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: msifurahi ... bali furahini
  rationale: Kurudia kitenzi kilekile kunahifadhi urari na utofautishaji wa amri mbili katika Kigiriki.
- source_word: τὰ πνεύματα
  choice: roho
  rationale: Neno linabaki na upana wa πνεύματα bila kulifafanua moja kwa moja kuwa “pepo” au “roho waovu,” ingawa muktadha unaonyesha viumbe wa kiroho wenye uadui.
- source_word: ὑμῖν ὑποτάσσεται
  choice: zinawatii
  rationale: Ni usemi wa asili katika Kiswahili unaoeleza kwamba roho hizo ziko chini ya mamlaka yao; ngeli ya wingi inaafikiana na “roho.”
- source_word: τὰ ὀνόματα ὑμῶν
  choice: majina yenu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai chenye kiwakilishi cha umilikaji.
- source_word: ἐγγέγραπται
  choice: yameandikwa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwepo, sawasawa na nguvu ya hali timilifu ya Kigiriki.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  rationale: Ni usemi wa kawaida na wenye kueleweka katika Kiswahili kwa mahali pa mbinguni; tanbihi inahifadhi taarifa kwamba Kigiriki kimetumia umbo la wingi.
theological_decisions:
- issue: Asili ya roho zinazotajwa
  choice: roho
  alternative: pepo; roho waovu
  rationale: Muktadha unadokeza viumbe wa kiroho wenye uadui, lakini mstari huu wenyewe unasema tu πνεύματα. Tafsiri kuu haibani maana kuliko neno la chanzo.
- issue: Mahali ambako majina yameandikwa
  choice: mbinguni
  alternative: katika mbingu
  rationale: “Mbinguni” ni Kiswahili cha asili, huku tanbihi ikieleza kwamba οὐρανοῖς ni umbo la wingi ili ushahidi wa lugha ya chanzo usifichwe.
- issue: Hali ya majina kuandikwa
  choice: yameandikwa
  alternative: yako yameandikwa; yameandikishwa
  rationale: Huhifadhi tendo lililokamilika pamoja na matokeo yanayoendelea bila kuongeza maelezo kuhusu wakati au namna ya uandikaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama ya nukta mbili inafungua maelezo ya “kwa sababu hii,” na nukta mkato inasisitiza utofautishaji wa amri mbili bila kufanya sentensi kuwa nzito.
