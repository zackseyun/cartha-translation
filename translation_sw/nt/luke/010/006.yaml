  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: sw
  text: Na kama mwana wa amani yupo huko[a], amani yenu itatulia juu yake; lakini kama sivyo, itawarudia ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa amani”; katika muktadha huu inaweza kumaanisha mtu anayekubali ujumbe unaoleta amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: mwana wa amani
  rationale: Inahifadhi nahau ya Kisemiti na umbo la Kigiriki la kiume katika umoja. Katika muktadha huu humaanisha mtu mwenye mwelekeo wa kuipokea amani au ujumbe unaoleta amani.
- source_word: ἐπαναπαήσεται
  choice: itatulia juu yake
  rationale: Inadumisha taswira ya amani ikipata mahali pa kutulia juu ya mpokeaji; pia ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: amani yenu
  rationale: Inahifadhi muundo wa moja kwa moja wa chanzo bila kufafanua kupita kiasi ikiwa ni salamu, baraka, au amani inayotangazwa.
- source_word: μήγε
  choice: kama sivyo
  rationale: Inawasilisha hali hasi iliyosisitizwa kwa lugha ya Kiswahili iliyo laini na ya kawaida.
- source_word: ἀνακάμψει
  choice: itawarudia
  rationale: Kitenzi kina maana ya kurudi au kugeuka na kurudi; hapa kiambishi cha yambwa kinaonyesha wazi kwamba amani itawarudia wale waliyoitangaza.
- source_word: ἐφ’ ὑμᾶς
  choice: ninyi
  rationale: Kiwakilishi cha msisitizo baada ya ‘itawarudia’ kinahifadhi msisitizo wa kurejea kwa amani kwa wahusika hao bila Kiswahili kisicho cha kawaida cha kutafsiri kihusishi neno kwa neno.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Na kama ... yupo huko
  rationale: Inahifadhi kiunganishi, sharti, na msisitizo wa mahali uliomo katika maandishi ya Kigiriki.
theological_decisions:
- issue: Iwapo nahau ya kiume υἱὸς εἰρήνης igeuzwe kuwa usemi usioonyesha jinsia
  choice: Kudumisha ‘mwana wa amani’ katika matini kuu
  alternative: mtu wa amani; mtu mwenye amani
  rationale: ‘Mwana wa amani’ huhifadhi umbo na ladha ya nahau ya chanzo bila kuamua kimya-kimya maana yake yote. Tanbihi inatoa usemi wa kawaida zaidi na kueleza maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wa leo, huku ‘mwana wa amani’ ikihifadhi kwa makusudi nahau ya chanzo; tanbihi husaidia kuifafanua bila kuondoa mvutano wake wa kimaana.
