  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: sw
  text: Naye akamwambia, “Umejibu kwa usahihi[a]. Fanya hivyo, nawe utaishi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umejibu sawa.”
    reason: lexical_alternative
  - marker: b
    text: Muktadha mpana unahusu uzima wa milele (tazama Luka 10:25), lakini Kigiriki hapa kinasema tu, “utaishi.”
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Naye akamwambia
  rationale: Kitenzi εἶπεν pamoja na yambwa αὐτῷ kinatafsiriwa kwa Kiswahili cha kawaida kuwa ‘akamwambia.’ Kiunganishi δέ ni chepesi; ‘naye’ kinaendeleza simulizi bila kulazimisha maana ya upinzani.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Umejibu kwa usahihi
  rationale: Ὀρθῶς humaanisha ‘kwa usahihi’ au ‘sawa,’ na ἀπεκρίθης ni tendo lililokamilika la kujibu. Kauli hii ni ya kawaida na yenye heshima katika Kiswahili cha sasa.
- source_word: τοῦτο ποίει
  choice: Fanya hivyo
  rationale: τοῦτο hurejelea amri iliyotajwa kabla, na ποίει ni agizo la kutenda. ‘Fanya hivyo’ ni fupi na ya asili, huku muktadha ukiruhusu wazo la kuendelea kuitenda.
- source_word: καὶ ζήσῃ
  choice: nawe utaishi
  rationale: ζήσῃ husema moja kwa moja ‘utaishi.’ Tafsiri hii haiingizi maneno ya ziada kama ‘utaurithi uzima wa milele,’ ingawa muktadha mpana unahusu uzima wa milele.
theological_decisions:
- issue: Upeo wa maana ya ζήσῃ katika muktadha wa uzima wa milele
  choice: nawe utaishi
  alternative: nawe utarithi uzima wa milele
  rationale: Kigiriki cha mstari huu kinasema tu ‘utaishi.’ Muktadha wa Luka 10:25 unahusu kuurithi uzima wa milele, lakini kuongeza maneno hayo katika matini kuu kungeondoa uwazi na mvutano uliopo katika usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Naye akamwambia’ unaendeleza simulizi kwa ufasaha; ‘Fanya hivyo’ huhifadhi ufupi wa agizo la Kigiriki.
