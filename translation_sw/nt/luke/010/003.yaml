  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: sw
  text: Nendeni! Tazama, ninawatuma kama wana-kondoo katikati ya mbwa-mwitu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema hasa “wana-kondoo,” si “kondoo” kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάγετε
  choice: Nendeni
  rationale: Amri ya nafsi ya pili wingi; “Nendeni” ni agizo fupi, la kawaida, na linaonyesha kwamba Yesu anazungumza na kundi.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Kiashiria cha mazungumzo kinachovuta fikira kwa jambo linalofuata. “Tazama” huhifadhi nguvu hiyo kwa lugha yenye heshima bila kuongeza ufafanuzi.
- source_word: ἀποστέλλω ὑμᾶς
  choice: ninawatuma
  rationale: Huhifadhi wakati wa sasa na kiambishi cha yambwa wingi. Muktadha wenyewe unaonyesha kutumwa kwa kazi, hivyo si lazima kuongeza neno linalofasiri kama “kuwatuma nje” au “kuwaagiza rasmi.”
- source_word: ὡς
  choice: kama
  rationale: Huanzisha tashbihi, si kauli ya utambulisho.
- source_word: ἄρνας
  choice: wana-kondoo
  rationale: Neno la Kigiriki humaanisha hasa wana-kondoo, si kondoo kwa ujumla; uchaguzi huu unahifadhi picha ya udhaifu wao.
- source_word: ἐν μέσῳ λύκων
  choice: katikati ya mbwa-mwitu
  rationale: Ni tafsiri ya karibu na ya kawaida inayohifadhi picha ya kuzungukwa na hatari; “miongoni mwa mbwa-mwitu” pia ingewezekana.
theological_decisions:
- issue: Taswira ya wanyama inayoeleza utume wa wanafunzi
  choice: kama wana-kondoo katikati ya mbwa-mwitu
  alternative: kama kondoo miongoni mwa mbwa-mwitu
  rationale: ἄρνας hutaja wana-kondoo hasa. Kutafsiri “kondoo” kungepunguza picha ya udhaifu na kungeweza kuoanisha mstari huu kimyakimya na semi zinazofanana katika vifungu vingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” limetumiwa kama kiashiria cha kuvuta fikira; “mbwa-mwitu” ni istilahi inayoeleweka kwa wolf. Alama ya mshangao baada ya “Nendeni” hutenganisha agizo na onyo linalofuata bila kubadili maana.
