  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: sw
  text: Yesu akajibu, “Mtu mmoja alikuwa akishuka kutoka Yerusalemu kwenda Yeriko, akaangukia mikononi mwa wanyang’anyi. Wakamvua nguo, wakampiga, kisha wakaondoka, wakimwacha akiwa nusu mfu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: akajibu
  rationale: Katika muktadha huu kitenzi kinaonyesha Yesu alianza kusema kwa kujibu swali lililotangulia; ‘akajibu’ ni ya kawaida na sahihi katika Kiswahili.
- source_word: κατέβαινεν
  choice: alikuwa akishuka
  rationale: Huhifadhi hali ya tendo linaloendelea na ukweli wa kushuka kutoka Yerusalemu kuelekea Yeriko.
- source_word: λῃσταῖς περιέπεσεν
  choice: akaangukia mikononi mwa wanyang’anyi
  rationale: Nahau hii ya Kiswahili huwasilisha kwa kawaida tukio la kukutana kwa ghafla na wanyang’anyi na kuwa chini ya mamlaka yao.
- source_word: ἐκδύσαντες αὐτὸν
  choice: wakamvua nguo
  rationale: Hueleza wazi kuwa walimnyang’anya mavazi yake.
- source_word: πληγὰς ἐπιθέντες
  choice: wakampiga
  rationale: Ni usemi wa asili unaowasilisha tendo la kumtia majeraha kwa kumpiga bila kuongeza chombo au namna ambayo haikutajwa.
- source_word: ἡμιθανῆ
  choice: akiwa karibu kufa
  rationale: Huwasilisha maana ya kuwa nusu mfu kwa Kiswahili cha kawaida bila kutumia msemo usio wa asili.
