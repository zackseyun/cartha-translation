  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kigiriki: mtumishi anarudi na kutoa taarifa, bwana wa nyumba anakasirika, kisha anaagiza aende upesi kwenye barabara pana na vichochoro vya jiji na kuwaleta makundi manne yaliyotajwa. “Mambo hayo,” “humu,” na orodha ya maskini, wenye ulemavu, vipofu, na viwete huhifadhi vipengele muhimu vya matini.'
