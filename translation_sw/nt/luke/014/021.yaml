id: LUK.14.21
reference: Luke 14:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: sw
  text: Mtumishi aliporudi[a], alimweleza bwana wake mambo hayo. Ndipo mwenye nyumba akakasirika, akamwambia mtumishi wake, “Nenda upesi katika barabara pana na vichochoro vya jiji, uwalete humu maskini, wenye ulemavu[b], vipofu na viwete.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipofika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliopungukiwa viungo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: aliporudi
  rationale: Katika mfuatano wa simulizi, mtumishi anarudi baada ya kutekeleza agizo na kutoa taarifa. Hata hivyo, kitenzi chenyewe kinaweza kumaanisha kwa ujumla zaidi ‘alipofika,’ kwa hiyo mbadala huo umewekwa katika tanbihi.
- source_word: δοῦλος
  choice: mtumishi
  rationale: Neno hili linaweza kumaanisha mtumwa au mtumishi. Hapa jukumu lake katika nyumba na kama mjumbe ndilo linalosisitizwa; ‘mtumishi’ ni la kawaida na linaloeleweka, bila kufuta kabisa mazingira ya mamlaka.
- source_word: ἀπήγγειλεν
  choice: alimweleza
  rationale: Hutoa maana ya kupeleka taarifa kwa aliye juu yake kwa Kiswahili cha kawaida na fasaha.
- source_word: κυρίῳ
  choice: bwana wake
  rationale: Hapa κύριος humrejelea mkuu wa kibinadamu wa mtumishi katika mfano, si cheo cha Mungu. ‘Bwana wake’ huhifadhi uhusiano huo bila kuashiria uungu.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea visingizio vilivyotangulia.
- source_word: ὀργισθεὶς
  choice: akakasirika
  rationale: Muundo wa mfululizo ‘ndipo ... akakasirika’ huonyesha kwamba hasira ilikuwa itikio lake kabla ya kutoa agizo.
- source_word: οἰκοδεσπότης
  choice: mwenye nyumba
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mkuu au mwenye mamlaka katika nyumba, na unatofautisha neno hili na κύριος.
- source_word: Ἔξελθε ταχέως
  choice: Nenda upesi
  rationale: Huwasilisha mwendo wa kwenda nje pamoja na dharura ya agizo kwa njia ya asili katika Kiswahili.
- source_word: πλατείας
  choice: barabara pana
  rationale: Huhifadhi wazo la njia kuu zilizo wazi au pana na tofauti yake na vichochoro.
- source_word: ῥύμας
  choice: vichochoro
  rationale: Hurejelea njia ndogo au nyembamba za mjini na huleta tofauti wazi na barabara pana.
- source_word: πτωχούς
  choice: maskini
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kivumishi hiki kilichotumiwa kama nomino.
- source_word: ἀναπείρους
  choice: wenye ulemavu
  rationale: Ni lugha ya sasa, yenye heshima, inayobeba maana pana ya watu wenye ulemavu; maana nyembamba zaidi ya waliopungukiwa viungo imehifadhiwa katika tanbihi.
- source_word: τυφλούς
  choice: vipofu
  rationale: Ni tafsiri ya kawaida ya watu wasioona katika orodha hii.
- source_word: χωλούς
  choice: viwete
  rationale: Huhifadhi maana maalumu ya watu wenye shida ya kutembea, bila kuichanganya na ἀναπείρους iliyo pana zaidi.
theological_decisions:
- issue: Maana ya δοῦλος katika mazingira ya nyumba ndani ya mfano
  choice: mtumishi
  alternative: mtumwa
  rationale: Hadhi ya kisheria ya mtu huyo haijafanywa kuwa hoja ya kitheolojia hapa; simulizi linasisitiza jukumu lake chini ya bwana wake. ‘Mtumishi’ linafaa katika Kiswahili, huku uhusiano wa mamlaka ukibaki wazi.
- issue: Maana ya κύριος inapomrejelea mwanadamu
  choice: bwana wake
  alternative: mkuu wake
  rationale: Mrejelewa ni mwanadamu mwenye mamlaka katika mfano, si Mungu au Kristo. Herufi ndogo na kiwakilishi ‘wake’ huweka maana hiyo wazi bila kuondoa maana ya uhusiano wa κύριος.
- issue: Upeo wa ἀνάπηρος
  choice: wenye ulemavu
  alternative: waliopungukiwa viungo
  rationale: Neno la Kigiriki linaweza kutumiwa kwa ulemavu mkubwa au kupungukiwa kiungo. Tafsiri kuu imeacha upeo wake kuwa mpana, na tanbihi inaonyesha maana nyembamba inayowezekana bila kuilazimisha katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mwendo wa simulizi la Kigiriki lakini imetumia miundo ya kawaida ya Kiswahili. ‘Wenye ulemavu’ imechaguliwa badala ya kuwataja watu kwa jina linaloweza kusikika kama kuwafafanua kwa ulemavu wao pekee; maneno maalumu ‘vipofu’ na ‘viwete’ yamehifadhiwa kwa sababu ndiyo makundi yaliyotajwa wazi katika chanzo.
