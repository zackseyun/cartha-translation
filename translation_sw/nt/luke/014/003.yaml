id: LUK.14.3
reference: Luke 14:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: sw
  text: Yesu akawajibu wataalamu wa Sheria[a] na Mafarisayo, akisema, “Je, ni halali kuponya siku ya Sabato, au la?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wataalamu wa Sheria ya Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akawajibu
  rationale: Kitenzi hiki kinadumisha maana ya Yesu kuitikia hali au changamoto iliyokuwapo, huku umbo la masimulizi likisomeka kwa kawaida katika Kiswahili.
- source_word: εἶπεν / λέγων
  choice: akisema
  rationale: Neno hili linahifadhi utangulizi wa usemi uliopo katika Kigiriki bila kurudia kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: νομικοὺς
  choice: wataalamu wa Sheria[a]
  rationale: Hawa ni wataalamu wa Sheria ya Kiyahudi, si wanasheria wa mfumo wa kisasa wa mahakama. Tafsiri hii ni wazi na sahihi katika muktadha.
- source_word: Φαρισαίους
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hilo la kidini.
- source_word: Ἔξεστιν
  choice: ni halali
  rationale: Kauli hii inabeba uzito wa swali kuhusu jambo linaloruhusiwa kwa mujibu wa Sheria, hasa katika mjadala kuhusu Sabato.
- source_word: τῷ σαββάτῳ
  choice: siku ya Sabato
  rationale: Hii inaonyesha wazi matumizi ya wakati na siku maalumu inayozungumziwa.
- source_word: θεραπεῦσαι
  choice: kuponya
  rationale: Katika masimulizi ya Injili, neno hili kwa kawaida humaanisha kumrudishia mgonjwa afya.
- source_word: ἢ οὔ
  choice: au la
  rationale: Ni namna fupi na ya kawaida ya Kiswahili ya kuhifadhi swali lenye uchaguzi wa ndiyo au hapana.
theological_decisions:
- issue: Kuwasilisha swali kuhusu Sheria ya Sabato bila kutanguliza hitimisho la Yesu
  choice: Je, ni halali kuponya siku ya Sabato, au la?
  alternative: Je, inaruhusiwa kuponya siku ya Sabato, au la?
  rationale: “Ni halali” huhifadhi uzito wa kisheria na kidini wa swali. Tafsiri haiongezi sababu kuhusu rehema, ulazima, au mamlaka ya Yesu ambazo hazijasemwa katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wataalamu wa Sheria” limechaguliwa badala ya “wanasheria” ili kuepuka dhana ya mawakili wa kisasa. Muundo “akawajibu … akisema” unahifadhi usemi maradufu wa Kigiriki kwa mtindo wa kawaida wa Kiswahili.
