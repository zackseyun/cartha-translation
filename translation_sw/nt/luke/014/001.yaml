  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: sw
  text: Ikawa, Yesu alipoingia nyumbani kwa mmoja wa viongozi wa Mafarisayo siku ya Sabato ili kula chakula,[a] wao walikuwa wakimwangalia kwa makini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kula mkate.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakimchunguza kwa makini”; Kiyunani kinaweza kudokeza uangalizi wenye mashaka au uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuanzisha tukio; “Ikawa” ni ya heshima na inaeleweka katika simulizi la Biblia bila kuwa nzito kupita kiasi.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: Yesu alipoingia
  rationale: Muundo wa kisoukomo chenye kibainishi na ἐν una maana ya wakati. Jina “Yesu” linawekwa wazi kwa kuwa Kiswahili kinahitaji rejeo linaloeleweka nje ya muktadha wa aya iliyotangulia.
- source_word: οἶκόν
  choice: nyumbani
  rationale: Katika muktadha wa mtu mwenyeji wa mlo, “nyumbani kwa” ni Kiswahili cha kawaida zaidi kuliko “katika nyumba ya,” huku kikihifadhi maana ya οἶκος.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: kwa mmoja wa viongozi wa Mafarisayo
  rationale: ἀρχόντων hapa humaanisha watu wenye uongozi au hadhi miongoni mwa Mafarisayo; “viongozi” ni wazi na ya asili kuliko “watawala,” ambayo ingeweza kudokeza mamlaka ya kisiasa.
- source_word: σαββάτῳ
  choice: siku ya Sabato
  rationale: Datiki inaonyesha wakati; “siku ya Sabato” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: φαγεῖν ἄρτον
  choice: ili kula chakula
  rationale: Ingawa maana ya neno kwa neno ni “kula mkate,” huu ni usemi wa Kiyunani unaomaanisha kula mlo. Kiswahili “kula chakula” huwasilisha maana hiyo ya kawaida; tanbihi inahifadhi picha halisi ya chanzo.
- source_word: παρατηρούμενοι
  choice: walikuwa wakimwangalia kwa makini
  rationale: Huhifadhi wazo la uangalizi wa karibu bila kuamua wazi kuwa ulikuwa upelelezi wa uhasama.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi “wao” kinahifadhi msisitizo wa αὐτοὶ na utofautishaji wake na Yesu.
theological_decisions:
- issue: Uhasama unaoweza kudokezwa na uangalizi wa Mafarisayo
  choice: walikuwa wakimwangalia kwa makini
  alternative: walikuwa wakimpeleleza
  rationale: παρατηρούμενοι inaweza kubeba wazo la uangalizi wa kutafuta kosa au wenye mashaka, lakini aya haisemi wazi nia yao. Tafsiri iliyochaguliwa inadumisha mvutano bila kuongeza shtaka lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima lakini wa sasa. “Ikawa” huhifadhi ladha ya fomula ya Luka; miundo mingine imewekwa katika Kiswahili cha kawaida na kinachoeleweka. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
