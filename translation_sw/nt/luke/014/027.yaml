  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: sw
  text: Yeyote ambaye habebi msalaba wake mwenyewe na haji nyuma yangu hawezi kuwa mwanafunzi wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: Yeyote
  rationale: Kiwakilishi hiki cha uhusiano kisicho na mtu maalumu kinaweka sharti la jumla; “yeyote” ni la kawaida na linahifadhi maana ya kumhusu kila mtu.
- source_word: βαστάζει
  choice: anabeba
  rationale: Kitenzi kina maana ya kubeba au kuchukua mzigo. “Kubeba” ni wazi katika Kiswahili cha sasa na kinahifadhi picha halisi ya msalaba pamoja na maana yake ya gharama ya uanafunzi.
- source_word: τὸν σταυρόν
  choice: msalaba
  rationale: Hili ndilo neno la kawaida kwa chombo cha kunyonga na kuua kilichotajwa hapa, na linahifadhi uzito wa aibu, mateso, na kifo katika wito wa Yesu.
- source_word: ἑαυτοῦ
  choice: wake mwenyewe
  rationale: Kiwakilishi rejeshi cha umoja kinasisitiza msalaba unaomhusu mtu huyo binafsi; “wake mwenyewe” kinahifadhi msisitizo huo bila kuondoa matumizi ya jumla ya “yeyote.”
- source_word: ἔρχεται ὀπίσω μου
  choice: kuja nyuma yangu
  rationale: Tafsiri hii inahifadhi picha ya mwendo na nafasi iliyo katika Kigiriki. Pia inadokeza kumfuata Yesu bila kubadilisha moja kwa moja usemi huo kuwa fasiri ya “kunifuata.”
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: hawezi kuwa mwanafunzi wangu
  rationale: Muundo unaonyesha kutoweza au kutopatana, si katazo tu. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu hiyo.
- source_word: μαθητής
  choice: mwanafunzi
  rationale: “Mwanafunzi” ni neno lililozoeleka katika muktadha wa Injili kwa mtu anayejifunza kwa mwalimu na kujitoa kumfuata.
theological_decisions:
- issue: Nguvu ya jumla ya kiwakilishi rejeshi cha umoja
  choice: Kuhifadhi umoja kwa “msalaba wake mwenyewe”
  alternative: “msalaba wao wenyewe”
  rationale: Kigiriki kina umoja na kinamtaja mtu mmoja kwa namna inayowakilisha yeyote. Kiswahili kinaweza kuhifadhi umoja huo kwa kawaida baada ya “yeyote,” bila kuifanya kauli iwahusu wanaume pekee.
- issue: Maana ya “kuja nyuma yangu” katika uanafunzi
  choice: Kuhifadhi picha halisi ya “kuja nyuma yangu”
  alternative: “kunifuata”
  rationale: Usemi huo unahusiana wazi na kumfuata Yesu kama mwanafunzi, lakini tafsiri ya moja kwa moja inahifadhi picha ya asili na haifuti tofauti kati ya maneno ya mstari na fasiri yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi umoja wa “yeyote,” picha ya kubeba msalaba, na usemi wa mwendo “kuja nyuma yangu,” huku ikibaki rahisi kueleweka.
