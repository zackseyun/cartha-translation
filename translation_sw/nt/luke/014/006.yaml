lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa uratibu wa kawaida bila kuongeza maana ya wakati au matokeo.
- source_word: οὐκ
  choice: hawakuweza
  rationale: Ukanushaji umeunganishwa kwa kawaida na kitenzi cha uwezo katika Kiswahili.
- source_word: ἴσχυσαν
  choice: waliweza
  rationale: Katika muktadha huu kitenzi kinaeleza uwezo, si nguvu za mwili; pamoja na οὐκ kinakuwa “hawakuweza.”
- source_word: ἀνταποκριθῆναι
  choice: kujibu
  rationale: “Kujibu” linaonyesha kutoa jibu kwa yaliyosemwa bila kuingiza wazo la ukaidi linaloweza kudokezwa na “kujibizana.”
- source_word: πρὸς ταῦτα
  choice: kuhusu mambo hayo
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha jibu linalohusiana na mambo yaliyotangulia, huku ukihifadhi wingi wa ταῦτα.
