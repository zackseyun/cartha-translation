  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: sw
  text: Nawe utakuwa mwenye heri[a], kwa sababu hawana uwezo wa kukulipa; kwa maana utalipwa wakati wa ufufuo wa wenye haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakuwa na heri.” Usemi wa Kigiriki unaonyesha hali ya kupendelewa, hasa na Mungu, si hisia ya furaha tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika ufufuo wa wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: mwenye heri
  rationale: Huhifadhi maana ya hali ya kupendelewa na Mungu pamoja na uzito wa wakati ujao; “mwenye furaha” ingeweza kueleweka hasa kama hisia ya ndani.
- source_word: ἔσῃ
  choice: utakuwa
  rationale: Ni uwasilishaji wa kawaida wa wakati ujao wa εἰμί na unaunganisha kiima na kivumishi cha hali, μακάριος.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa neno hili linaanzisha sababu ya mtu huyo kuwa mwenye heri.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: hawana uwezo wa kukulipa
  rationale: Muundo huu unaeleza kutokuwa na uwezo au njia za kulipa, wala si kutokuwa na wajibu wa kufanya hivyo. “Kukulipa” pia huhifadhi wazo la malipo ya kurudisha.
- source_word: ἀνταποδοθήσεται
  choice: utalipwa
  rationale: Huhifadhi hali tendwa na uhusiano wa maana na tendo la wao kutoweza kukulipa.
- source_word: γάρ
  choice: kwa maana
  rationale: Huonyesha kwamba kauli inayofuata inafafanua msingi wa heri iliyotajwa.
- source_word: ἐν τῇ ἀναστάσει
  choice: wakati wa ufufuo
  rationale: ἐν hapa lina matumizi ya wakati; “wakati wa” ni Kiswahili cha kawaida kinachoonyesha muda ambapo malipo yatatolewa.
- source_word: τῶν δικαίων
  choice: wa wenye haki
  rationale: Huhifadhi uhusiano wa umilikishi na maana ya kimaadili na kitheolojia ya δίκαιος bila kuongeza maelezo ya kimadhehebu.
theological_decisions:
- issue: Maana ya “ufufuo wa wenye haki”
  choice: Imetafsiriwa moja kwa moja kama ufufuo wa wakati ujao unaohusishwa na wenye haki.
  alternative: Ufufuo wa wote huku wenye haki wakikaziwa, au ufufuo tofauti wa wenye haki kabla ya wengine.
  rationale: Mstari unathibitisha malipo ya Mungu katika ufufuo wa wenye haki, lakini hauamui wazi mpangilio kamili wa matukio ya ufufuo; tafsiri haijatatua mjadala huo kwa kuongeza maelezo.
- issue: Chanzo cha malipo yajayo
  choice: Kitenzi tendwa “utalipwa” kimeachwa bila kumtaja mtendaji.
  alternative: “Mungu atakulipa.”
  rationale: Ingawa muktadha unaelekeza kwa Mungu kama anayelipa, Kigiriki kinatumia hali tendwa bila kumtaja wazi; tafsiri imehifadhi hali hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwenye heri” huhifadhi uzito wa usemi wa Yesu, huku “hawana uwezo wa kukulipa” ikieleza wazi kutokuwa na uwezo bila kudokeza kwamba hawana wajibu. Alama zote za tanbihi zimewekwa katika matini kuu.
