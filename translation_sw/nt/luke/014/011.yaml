reference: Luke 14:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: sw
  text: Kwa maana kila anayejikweza atashushwa, na anayejinyenyekeza atakwezwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linatoa sababu ya mafundisho yaliyotangulia; “Kwa maana” linaendeleza wazi nguvu hiyo ya ufafanuzi.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: kila anayejikweza
  rationale: Kirai hiki kina maana ya jumla na ya kimethali. “Kila anayejikweza” ni Kiswahili cha kawaida kinachoonyesha mtu yeyote anayejiinua au kujitukuza.
- source_word: ταπεινωθήσεται
  choice: atashushwa
  rationale: Kitenzi ni cha wakati ujao katika kauli ya kutendwa. “Atashushwa” huhifadhi hali ya kutendwa na huonyesha kushushwa kutoka cheo au hali ya kujikweza bila kumtaja mtendaji.
- source_word: καὶ
  choice: na
  rationale: “Na” linaunganisha vipashio viwili kama ilivyo katika Kigiriki; ulinganifu wa vipashio wenyewe unaonyesha utofauti.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: anayejinyenyekeza
  rationale: Kirai hiki kinamtaja kwa ujumla mtu anayejishusha kwa hiari. “Anayejinyenyekeza” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: ὑψωθήσεται
  choice: atakwezwa
  rationale: Kitenzi hiki cha wakati ujao katika kauli ya kutendwa kinalingana moja kwa moja na “anayejikweza” huku kikihifadhi wazo la kuinuliwa na mwingine bila kumtaja.
theological_decisions:
- issue: Mtendaji asiyetajwa katika vitenzi vya kauli ya kutendwa
  choice: Kuhifadhi kauli ya kutendwa bila kuongeza “na Mungu”
  alternative: atashushwa na Mungu; atakwezwa na Mungu
  rationale: Ingawa muktadha mpana unaweza kudokeza kuwa Mungu ndiye mtendaji, Kigiriki hakimtaji wazi. Tafsiri haiongezi maelezo hayo ya kitheolojia.
- issue: Maumbo ya Kigiriki ya umoja wa kiume yenye maana ya jumla
  choice: 'Kutumia maumbo ya Kiswahili yasiyoonyesha jinsia: “anayejikweza” na “anayejinyenyekeza”'
  alternative: Kumtaja “mwanamume” au kutumia kiwakilishi cha kiume
  rationale: Katika Kigiriki maumbo hayo yana kazi ya jumla. Kiswahili huwasilisha maana hiyo kwa kawaida bila kuonyesha jinsia, hivyo tafsiri inahifadhi upeo wa ujumla bila kuongeza jinsia isiyohitajika katika lugha lengwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Ulinganifu wa “anayejikweza … atashushwa” na “anayejinyenyekeza … atakwezwa” umehifadhi muundo wa kimethali wa sentensi.
