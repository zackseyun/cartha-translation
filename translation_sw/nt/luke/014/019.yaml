base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: sw
  text: Mwingine akasema, “Nimenunua jozi tano za maksai[a], nami ninakwenda kuwajaribu. Naomba, uniwie radhi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikundi vitano vya maksai” au “vipando vitano vya maksai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: Mwingine
  rationale: Katika mfululizo wa walioalikwa wanaotoa udhuru, neno hili kwa kawaida humaanisha mtu mwingine katika kundi hilo.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: jozi tano za ng’ombe wa kulimia
  rationale: ζεῦγος humaanisha jozi ya wanyama wanaofanya kazi pamoja; ‘ng’ombe wa kulimia’ hufafanua kwa lugha ya kawaida kusudi lao bila kupoteza picha ya kilimo.
- source_word: ἠγόρασα
  choice: Nimenunua
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililofanyika karibuni ambalo matokeo yake yanahusika moja kwa moja na udhuru huu.
- source_word: πορεύομαι
  choice: ninaenda
  rationale: Huwasilisha mwendo au kusudi la sasa kwa lugha ya kawaida na wazi.
- source_word: δοκιμάσαι
  choice: kuwajaribu
  rationale: Katika muktadha huu ni kuwafanyisha kazi ili kutathmini uwezo wa ng’ombe walionunuliwa; ‘kuwajaribu’ ni sahihi na ya kawaida.
- source_word: ἐρωτῶ σε
  choice: Tafadhali
  rationale: Kauli hii ni ombi la heshima. ‘Tafadhali’ huwasilisha nguvu yake ya kiutendaji kwa Kiswahili cha kawaida bila kuifanya iwe kusihi kupita kiasi.
- source_word: ἔχε με παρῃτημένον
  choice: unisamehe nisiweze kuja
  rationale: Hii ni nahau ya kuomba mtu akubali kutokuwepo kwa msemaji. Tafsiri hii ni ya asili kwa Kiswahili na hufanya sababu ya ombi ieleweke katika muktadha wa mwaliko.
