  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: sw
  text: Au ni mfalme gani ambaye, anapoenda kupigana vita na mfalme mwingine, hatakaa kwanza na kutafakari kama anaweza, akiwa na askari elfu kumi, kukabiliana[a] na yule anayekuja dhidi yake akiwa na askari elfu ishirini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kukutana na”; kitenzi cha Kigiriki kinaweza kutafsiriwa hivyo moja kwa moja, lakini hapa kinamaanisha kukutana vitani na jeshi linalosonga mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huanzisha mfano wa pili katika hoja ya Yesu na kudumisha mtiririko wa swali la balagha.
- source_word: τίς βασιλεὺς
  choice: ni mfalme gani
  rationale: Ni muundo wa kawaida wa Kiswahili kwa swali la balagha linalomhusu mfalme yeyote.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: anapoenda kupigana vita na mfalme mwingine
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kwenda kuingia katika mapambano ya kivita dhidi ya mfalme mwingine.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: ambaye hataketi kwanza na kufikiri
  rationale: Swali linatarajia jibu la ndiyo; tafsiri inadumisha kuketi kwanza na kisha kutafakari kwa makusudi.
- source_word: εἰ δυνατός ἐστιν
  choice: kama anaweza
  rationale: Huonyesha uwezo wa kutekeleza jambo bila kuongeza dhana ya ruhusa.
- source_word: ἐν δέκα χιλιάσιν
  choice: akiwa na askari elfu kumi
  rationale: Idadi inahusu jeshi lililo chini ya mfalme; kutaja askari hufanya maana iliyodokezwa na muktadha wa vita iwe wazi kwa msomaji wa Kiswahili.
- source_word: ὑπαντῆσαι
  choice: kukabiliana
  rationale: Kitenzi kina maana ya kukutana au kwenda kumlaki mtu, lakini katika muktadha huu kukutana huko ni kwa upinzani wa kivita; tanbihi huhifadhi maana ya moja kwa moja.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: na yule anayekuja dhidi yake akiwa na askari elfu ishirini
  rationale: Huhifadhi mwendo wa adui kuelekea kwake na tofauti ya ukubwa wa majeshi.
