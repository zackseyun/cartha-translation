id: LUK.14.10
reference: Luke 14:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: sw
  text: Lakini unapoalikwa, nenda ukakae[a] mahali pa chini kabisa, ili yule aliyekualika atakapokuja akuambie, ‘Rafiki, sogea juu zaidi.’[b] Ndipo utakapopata heshima mbele ya wote walioketi pamoja nawe mezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha hasa kuegemea mezani wakati wa kula, kama ilivyokuwa desturi ya wakati huo; pia yaweza kutafsiriwa, “ukachukue nafasi ya chini kabisa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “njoo juu zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: unapoalikwa
  rationale: Katika muktadha wa karamu, kitenzi hiki kinamaanisha kualikwa, si kuitwa tu.
- source_word: πορευθεὶς ἀνάπεσε
  choice: nenda ukakae
  rationale: Kauli hii ina matendo mawili yanayofuatana. Kiswahili cha kawaida hutumia ‘nenda ukakae’; ‘kukaa’ ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi desturi ya kale ya kuegemea mezani.
- source_word: ἔσχατον τόπον
  choice: mahali pa chini kabisa
  rationale: Hapa neno hilo linaonyesha nafasi yenye hadhi ndogo kabisa, wala si tu mahali pa mwisho katika mpangilio.
- source_word: ὁ κεκληκώς σε
  choice: yule aliyekualika
  rationale: Hufuata kirai cha Kigiriki kwa uwazi bila kutumia neno pana zaidi ‘mwenyeji.’
- source_word: Φίλε
  choice: Rafiki
  rationale: Ni namna ya moja kwa moja na ya heshima ya kutafsiri mwito huu, bila kuongeza ‘yangu’ ambayo haimo katika Kigiriki.
- source_word: προσανάβηθι ἀνώτερον
  choice: sogea juu zaidi
  rationale: Huhifadhi taswira ya kwenda juu katika mpangilio wa heshima na inasikika kwa kawaida katika Kiswahili.
- source_word: δόξα
  choice: heshima
  rationale: Katika mazingira haya ya kijamii, neno hilo linamaanisha heshima ya hadharani, si utukufu wa kimungu.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: mbele ya wote walioketi pamoja nawe mezani
  rationale: Huhifadhi hali ya tukio la hadharani na muktadha wa chakula kwa lugha inayoeleweka kwa kawaida.
theological_decisions:
- issue: Asili ya fundisho hili
  choice: Kulitafsiri kama maagizo ya kivitendo ndani ya fundisho kuhusu unyenyekevu na heshima, bila kulazimisha maana ya baadaye ya kimafundisho.
  alternative: Kuliona kuwa ushauri wa adabu tu, au kulifanya lihusu thawabu ya mwisho tu.
  rationale: Mfano wa karamu unafundisha unyenyekevu na kubadilishwa kwa nafasi za heshima, lakini mstari wenyewe haupaswi kufungwa katika maana ya kijamii pekee wala ya nyakati za mwisho pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mahali pa chini kabisa’ kinaonyesha hadhi ya nafasi; ‘walioketi pamoja nawe mezani’ huepuka usemi usio wa kawaida wa ‘waliokuwa wameegemea’ huku tanbihi ikihifadhi picha ya kitamaduni ya Kigiriki.
