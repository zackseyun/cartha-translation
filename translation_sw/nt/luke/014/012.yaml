id: LUK.14.12
reference: Luke 14:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: sw
  text: Pia akamwambia yule aliyekuwa amemwalika, “Unapoandaa chakula cha mchana[a] au cha jioni, usiwaalike rafiki zako, wala ndugu zako, wala jamaa zako, wala majirani matajiri, wasije wao pia wakakualika nao kwa kurudisha mwaliko[b], na hilo likawa malipo kwako[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlo wa mapema.” Neno la Kigiriki ἄριστον hurejelea mlo wa mapema katika siku, mara nyingi karibu na adhuhuri, si lazima kifungua kinywa cha asubuhi kwa maana ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakualike kwa kurudisha mwaliko.” Kitenzi cha Kigiriki kina maana ya kumwalika mtu kwa kujibu mwaliko wake.
    reason: lexical_alternative
  - marker: c
    text: Au, “nawe ukawa umelipwa.” Kigiriki kinasema kwa karibu zaidi, “na hilo likawa malipo kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Pia akamwambia
  rationale: Kauli hii inaendeleza simulizi na kuonyesha kwamba Yesu alimwelekea pia mwenyeji. Kiswahili cha simulizi hutumia kwa kawaida wakati uliopita wa mfululizo badala ya kuiga moja kwa moja hali ya kitenzi cha Kigiriki.
- source_word: τῷ κεκληκότι αὐτόν
  choice: yule aliyekuwa amemwalika
  rationale: Hutaja kwa uwazi mtu aliyemwalika Yesu bila kuongeza tafsiri ya neno kama ‘mwenyeji.’ Hali ya mwaliko uliotangulia imehifadhiwa.
- source_word: Ὅταν ποιῇς
  choice: Unapoandaa
  rationale: Katika muktadha wa mlo, ποιέω ina maana ya kuandaa au kutoa mlo. ‘Unapoandaa’ ni ya kawaida na inaeleweka katika Kiswahili.
- source_word: ἄριστον
  choice: chakula cha mchana
  rationale: Neno hili linamaanisha mlo wa mapema, mara nyingi wa karibu na adhuhuri. ‘Chakula cha mchana’ hulitofautisha kwa kawaida na mlo wa jioni.
- source_word: δεῖπνον
  choice: chakula cha jioni
  rationale: Hurejelea mlo mkuu wa baadaye katika siku; ‘chakula cha jioni’ ni tafsiri wazi ya kisasa.
- source_word: μὴ φώνει
  choice: usiwaalike
  rationale: Ingawa φωνέω kimsingi ni ‘kuita,’ katika muktadha wa mlo maana inayokusudiwa ni kuwaalika watu.
- source_word: τοὺς φίλους σου
  choice: rafiki zako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu wa kijamii.
- source_word: τοὺς ἀδελφούς σου
  choice: ndugu zako
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili kwa watu wa familia wa uhusiano huu. Kigiriki kina umbo la kiume la wingi, lakini Kiswahili hakina neno la kawaida lisilo na utata linalolingana nalo bila kuongeza maana kama umri wa ‘kaka.’
- source_word: τοὺς συγγενεῖς σου
  choice: jamaa zako
  rationale: ‘Jamaa’ hutaja watu wa ukoo au ndugu wa familia kwa upana na kutofautisha kundi hili na ἀδελφοί.
- source_word: γείτονας πλουσίους
  choice: majirani matajiri
  rationale: Kivumishi πλουσίους kinawahusu moja kwa moja majirani; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: μήποτε
  choice: wasije
  rationale: Muundo wa ‘wasije’ huwasilisha kwa kawaida onyo la uwezekano usiotakiwa unaoletwa na μήποτε.
- source_word: ἀντικαλέσωσίν σε
  choice: wakakualika kwao
  rationale: Katika Kiswahili, ‘kukualika kwao’ katika muktadha huu hudokeza wazi mwaliko wa kurudisha. Maana ya kurejesha mwaliko imefafanuliwa pia katika tanbihi.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: na hilo likawa malipo kwako
  rationale: Huhifadhi kwa karibu muundo wa Kigiriki kwamba mwaliko wao wa kurudisha unakuwa malipo kwa mtoaji wa mlo, badala ya kuufanya tu kuwa kauli tendwa.
theological_decisions:
- issue: Je, katazo ni kanuni kamili dhidi ya kuwaalika marafiki na jamaa au ni fundisho linalokazia kutotafuta malipo?
  choice: Katazo limehifadhiwa kwa nguvu yake ya moja kwa moja bila kuongeza ufafanuzi katika matini.
  alternative: Kulieleza kuwa ‘usiwaalike tu’ au ‘usiwaalike kwa kusudi la kulipwa.’
  rationale: Kigiriki hakina ‘tu’ wala kifungu kinachoeleza kusudi hilo moja kwa moja. Kuongeza maneno hayo kungesuluhisha mvutano wa fundisho badala ya kuuhifadhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia urudiaji wa ‘wala’ ili kuhifadhi msisitizo wa orodha ya Kigiriki. ‘Pia akamwambia’ ni mtiririko wa kawaida wa simulizi, huku ‘aliyekuwa amemwalika’ ikihifadhi kwamba mwaliko ulitangulia.
