  source_fidelity: The meal contrast, the four social groups, the warning introduced by μήποτε, and the final result clause are faithfully represented. However, “wakakualika kwao” adds a location (“to their home/place”) that the Greek does not state, while the reciprocal force of ἀντικαλέσωσίν is better expressed directly.
  naturalness: The Swahili is clear, idiomatic, and appropriately formal. “Wakakualika nao kwa kurudisha mwaliko” is natural enough in this context and avoids the added locative implication of “kwao.”
  terminology: “Chakula cha mchana ... cha jioni,” “ndugu,” “jamaa,” and “majirani matajiri” are suitable Standard East African Swahili choices. “Malipo kwako” appropriately retains the somewhat concrete reciprocity language of ἀνταπόδομα.
  issues:
