  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: sw
  text: Haifai kwa udongo wala kwa lundo la mbolea[a]; watu huitupa nje. Mwenye masikio ya kusikia[b], na asikie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lundo la samadi” / “lundo la kinyesi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yeyote aliye na masikio ya kusikia, na asikie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: udongo
  rationale: Katika mfano huu wa kilimo, neno hili linamaanisha udongo unaotumika katika kilimo, si dunia kwa maana pana.
- source_word: κοπρίαν
  choice: lundo la mbolea
  rationale: Huwasilisha kwa lugha ya kawaida picha halisi ya samadi au kinyesi kilichokusanywa kwa matumizi ya kilimo.
- source_word: εὔθετόν
  choice: haifai
  rationale: Huhifadhi maana ya kutofaa au kutokuwa na matumizi yanayofaa katika sehemu hizi mbili.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: watu huitupa nje
  rationale: Huhifadhi kitenzi cha kutenda chenye mtendaji wa wingi asiyeainishwa, badala ya kukigeuza kuwa kauli tendwa.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Mwenye masikio ya kusikia, na asikie
  rationale: Hufuata muundo wa kishiriki chenye kibainishi na huhifadhi nguvu ya amri ya kitenzi cha mwisho kwa usemi wa Kiswahili wenye hadhi.
theological_decisions:
- issue: Umoja wa kiwakilishi katika himizo la mwisho
  choice: Mwenye masikio ya kusikia, na asikie
  alternative: Yeyote aliye na masikio ya kusikia, na asikie
  rationale: Kigiriki kina umoja wa kiume unaotumika kwa uwakilishi wa jumla. Kiswahili kinaweza kuhifadhi umoja huo kwa neno lisiloainisha jinsia bila kupunguza upeo wake wa jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu huitupa” ni njia ya kawaida ya kuonyesha mtendaji wa wingi asiyeainishwa; “na asikie” huhifadhi himizo la mwisho bila kulilegeza kuwa maelezo tu.
