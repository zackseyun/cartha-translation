  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: sw
  text: Kwa maana ninawaambia kwamba hakuna hata mmoja wa wale wanaume walioalikwa atakayeonja chakula changu cha jioni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karamu yangu”; kwa mapokeo, “chajio changu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: Huhifadhi γάρ kama kiunganishi cha kutoa sababu au ufafanuzi, pamoja na usemi wa moja kwa moja kwa wasikilizaji wengi.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: hakuna hata mmoja wa wale wanaume
  rationale: Kauli hii huhifadhi ukanushi wenye mkazo wa οὐδείς, muundo wa sehemu, kiashiria ἐκείνων, na rejeleo la kiume la ἀνδρῶν.
- source_word: τῶν κεκλημένων
  choice: walioalikwa
  rationale: Katika muktadha wa karamu, καλέω humaanisha kualika; hali ya tendo lililokamilika inaonyesha watu waliokuwa wamepokea mwaliko.
- source_word: γεύσεταί
  choice: atakayeonja
  rationale: Huhifadhi taswira halisi ya γεύομαι, ambayo hapa pia inadokeza kula au kushiriki mlo.
- source_word: μου τοῦ δείπνου
  choice: chakula changu cha jioni
  rationale: δεῖπνον ni mlo mkuu, mara nyingi wa jioni; tafsiri hii ni ya kawaida na ya sasa bila kuifanya moja kwa moja kuwa ‘karamu.’
theological_decisions:
- issue: Kauli ya mwenyeji na taswira ya mfano
  choice: Kudumisha nafsi ya kwanza katika ‘chakula changu’ bila kufafanua maana ya kiroho ndani ya mstari
  alternative: karamu yangu
  rationale: Msemaji anaendelea kuzungumza akiwa mwenyeji katika mfano. Kutafsiri umilikaji moja kwa moja huhifadhi nguvu ya kutengwa bila kuingiza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hakuna hata mmoja’ huwasilisha mkazo wa ukanushi kwa njia ya kawaida; ‘chakula cha jioni’ ni wazi kwa wasomaji wengi, huku tanbihi ikihifadhi maana mbadala ya karamu na istilahi ya kimapokeo.
