base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: sw
  text: Kisha akawaambia[a], “Ni nani kati yenu ambaye, mwanawe au ng’ombe wake akianguka kisimani, hatamtoa mara moja siku ya Sabato?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zinasema “punda” badala ya “mwana.”
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Ni nani kati yenu ambaye
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kuanzisha swali la balagha linalouliza ni mtu gani miongoni mwao angefanya tofauti.
- source_word: υἱὸς
  choice: mwanawe
  rationale: Neno la Kigiriki humaanisha hasa ‘mwana’; kiambishi -we kinaonyesha kwa kawaida kuwa ni mwana wa mtu anayezungumziwa, bila kuongeza maelezo yasiyokuwamo katika hoja.
- source_word: βοῦς
  choice: ng’ombe wake
  rationale: ‘Ng’ombe’ ni neno la kawaida na linaloeleweka katika Kiswahili kwa mnyama wa jamii ya bovine; ‘wake’ huifanya sentensi iwe ya asili na kudumisha uhusiano unaodokezwa na swali.
- source_word: φρέαρ
  choice: kisima
  rationale: Neno hili humaanisha kwa kawaida kisima; tafsiri haijapatanishwa kimakusudi na vifungu vinavyotumia wazo la shimo.
- source_word: πεσεῖται
  choice: ameanguka
  rationale: Katika sharti hili la swali la balagha, hali timilifu ya Kiswahili inaeleza kwa kawaida tukio lililotokea na linalohitaji hatua ya haraka.
- source_word: εὐθέως
  choice: mara moja
  rationale: Huhifadhi dharura ya wakati iliyo katika Kigiriki kwa lugha ya kawaida ya Kiswahili.
- source_word: ἀνασπάσει
  choice: hatamtoa
  rationale: ‘Kumtoa’ ni usemi wa asili kwa kumwokoa mtu au mnyama kutoka kisimani; muktadha unajumuisha wazo la kumvuta juu na nje.
- source_word: αὐτὸν
  choice: -m- katika ‘hatamtoa’
  rationale: Kiambishi cha yambwa cha ngeli ya mtu hutumika moja kwa moja kwa mwana; katika swali lenye chaguo la mwana au ng’ombe, Kiswahili huweza kutumia muundo huu kwa kurejelea yeyote aliyeanguka bila kurudia nomino.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: siku ya Sabato
  rationale: Hufuata wazi kutajwa kwa ‘siku’ katika Kigiriki na ni usemi wa kawaida, wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tofauti ya maandishi kuhusu aliyeanguka kisimani
  choice: mwanawe au ng’ombe wake
  alternative: punda wake au ng’ombe wake
  rationale: Maandishi yaliyotolewa ya SBLGNT yana υἱὸς, ‘mwana.’ Tofauti ya ‘punda’ imehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu au kupatanishwa na mapokeo mengine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limeundwa kwa mtiririko wa kawaida; ‘ng’ombe’ limechaguliwa badala ya istilahi finyu isiyo ya kawaida kwa wasomaji wengi. Alama ya tanbihi [a] imewekwa baada ya kitenzi cha utangulizi ili kutaja tofauti ya maandishi bila kuvuruga swali.
