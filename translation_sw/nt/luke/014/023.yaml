base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: sw
  text: Bwana akamwambia mtumwa, “Nenda nje kwenye barabara na kandokando ya ua, uwalazimishe[a] watu waingie, ili nyumba yangu ijazwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwahimize sana waingie.” Kitenzi cha Kigiriki kina maana kali (“lazimisha, shinikiza”), lakini katika mfano huu si lazima kimaanishe kutumia nguvu ya kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Katika ulimwengu wa mfano, neno hili linamtaja bwana wa mtumwa na mwenye nyumba, si lazima liwe cheo cha moja kwa moja cha kimungu. “Bwana” linaendeleza maana hiyo ya uhusiano wa kijamii bila kuondoa mwangwi unaoweza kusikika katika mfano.
- source_word: δοῦλον
  choice: mtumwa
  rationale: Neno δοῦλος linaonyesha hadhi ya utumwa, hivyo “mtumwa” ni sahihi zaidi kuliko kulainisha kuwa “mtumishi” katika mazingira haya ya kaya.
- source_word: Ἔξελθε
  choice: Nenda nje
  rationale: Kauli hii ya amri inahifadhi wazi wazo la kutoka kwenda nje.
- source_word: ὁδοὺς
  choice: barabara
  rationale: Hapa neno linamaanisha njia za kusafiria zilizo nje ya eneo la karibu la karamu; “barabara” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: φραγμοὺς
  choice: kando ya ua
  rationale: φραγμός inaweza kuwa ua, uzio, au kizuizi cha mpaka. “Kando ya ua” linaonyesha sehemu za pembezoni ambako watu wangeweza kupatikana bila kulifanya neno “ua” lieleweke kama kiwanja cha ndani.
- source_word: ἀνάγκασον
  choice: uwalazimishe
  rationale: Kitenzi hiki ni chenye nguvu na kinaweza kumaanisha kulazimisha au kusukuma kwa nguvu. “Uwalazimishe” kinahifadhi nguvu hiyo katika matini kuu; tanbihi inaeleza uwezekano wa kusihi kwa nguvu katika muktadha wa mfano.
- source_word: εἰσελθεῖν
  choice: waingie
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kuingia ndani.
- source_word: ἵνα γεμισθῇ
  choice: ili ... ijazwe
  rationale: Muundo huu unaonyesha kusudi, na hali ya kutendwa ya Kigiriki imehifadhiwa kwa “ijazwe.”
- source_word: μου ὁ οἶκος
  choice: nyumba yangu
  rationale: οἶκος hapa ni nyumba ambayo karamu inafanyika, hivyo “nyumba yangu” ni tafsiri ya moja kwa moja na inayofaa muktadha.
theological_decisions:
- issue: Maana ya κύριος katika mfano
  choice: Bwana
  alternative: Mwenye nyumba
  rationale: “Bwana” huhifadhi maana ya mkuu wa mtumwa katika simulizi na pia kutokufunga mapema maana pana ya mfano. Muktadha, si tafsiri iliyoingizwa, ndio unaoonyesha kama kuna umuhimu zaidi wa kitheolojia.
- issue: Nguvu ya ἀνάγκασον
  choice: uwalazimishe waingie
  alternative: wasihi sana waingie
  rationale: Matini kuu haijalainisha nguvu ya kitenzi cha Kigiriki. Hata hivyo, tanbihi inaepusha kudai kwamba mfano lazima ufundishe matumizi ya nguvu ya kimwili, jambo ambalo muktadha haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtindo wa simulizi kwa “akamwambia,” huku maneno ya amri yakibaki ya moja kwa moja. “Watu” limewekwa wazi kama yambwa inayodokezwa na umbo la Kigiriki ili Kiswahili kisomeke kwa kawaida.
