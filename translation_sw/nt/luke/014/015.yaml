  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: sw
  text: Lakini mmoja wa wale waliokuwa wameketi chakulani pamoja naye, aliposikia hayo, akamwambia, “Heri mtu yeyote atakayekula mkate[a] katika ufalme wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kula mkate” ni usemi unaoweza kumaanisha kushiriki chakula; hapa taswira halisi ya mkate imehifadhiwa.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: aliposikia
  rationale: Kishiriki cha aoristi kina nguvu ya wakati; kishazi hiki cha Kiswahili kinaonyesha kwa kawaida kwamba alisema baada ya kusikia mambo hayo.
- source_word: δέ
  choice: Lakini
  rationale: Huonyesha mpito wenye utofauti mdogo katika simulizi na kuitambulisha kauli ya mgeni kama mwitikio kwa maneno yaliyotangulia.
- source_word: τις τῶν συνανακειμένων
  choice: mmoja wa wale walioketi mezani pamoja naye
  rationale: Humtaja mgeni mmoja asiyepewa jina kati ya waliokuwa wakishiriki chakula pamoja na Yesu. Kiswahili cha kawaida hakihitaji kubainisha desturi ya kale ya kuegemea wakati wa kula katika matini kuu.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi cha wingi kinarejelea mambo ambayo Yesu alikuwa amesema kabla yake.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Ni usemi wa kawaida na mfupi wa Kiswahili unaohifadhi mhusika aliyesema na yule aliyeambiwa.
- source_word: Μακάριος
  choice: Amebarikiwa
  rationale: Hudumisha uzito wa tamko la baraka na kibali cha Mungu kuliko neno linaloweza kueleweka kama hisia ya furaha tu.
- source_word: ὅστις
  choice: yule
  rationale: Katika muundo “yule atakaye...,” Kiswahili huwasilisha rejeo la jumla la mtu yeyote mwenye sifa hiyo kwa njia ya kawaida.
- source_word: φάγεται
  choice: atakayekula
  rationale: Huhifadhi wakati ujao wa kitenzi na mtazamo wa karamu ya wakati ujao.
- source_word: ἄρτον
  choice: mkate
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira halisi, ingawa usemi huo unaweza kumaanisha kushiriki chakula.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: Hufuata kirai cha Kigiriki bila kuongeza wazi wazo la karamu ambalo linadokezwa tu na muktadha.
theological_decisions:
- issue: Nguvu ya tamko Μακάριος katika kauli kuhusu mlo wa wakati ujao katika ufalme wa Mungu
  choice: Amebarikiwa yule atakayekula mkate katika ufalme wa Mungu
  alternative: Ana furaha yule atakayekula mkate katika ufalme wa Mungu
  rationale: “Amebarikiwa” huhifadhi maana ya hali ya kibali na heri inayohusishwa na kushiriki katika ufalme wa Mungu, bila kuipunguza kuwa hisia ya furaha pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walioketi mezani” ni usemi wa kawaida kwa washiriki wa chakula; unaepuka kufanya desturi ya kale ya kuegemea wakati wa kula ionekane kuwa kiini cha aya. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
