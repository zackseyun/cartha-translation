lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Lakini akamwambia
  rationale: δέ inaonyesha mgeuko mdogo katika mazungumzo na hapa ‘Lakini’ linaonyesha jibu kwa msemaji aliyetangulia bila kuongeza upinzani mkali. Kiambishi -mw- kinawakilisha αὐτῷ.
- source_word: Ἄνθρωπός τις
  choice: Mtu mmoja
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuwasilisha mhusika asiyeainishwa katika simulizi, huku ikihifadhi maana ya τις.
- source_word: ἐποίει
  choice: alikuwa akiandaa
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea; katika muktadha wa mlo wa ugenini, ‘akiandaa’ ni ya asili kuliko tafsiri sisisi ya ‘akifanya’.
- source_word: δεῖπνον μέγα
  choice: karamu kubwa
  rationale: δεῖπνον ni mlo mkuu, mara nyingi wa jioni, na muktadha unaonyesha mlo rasmi wenye wageni wengi. ‘Karamu kubwa’ ni usemi wa kawaida wa Kiswahili unaowasilisha ukubwa wa tukio bila kudai aina maalumu zaidi ya sherehe.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: akawaalika watu wengi
  rationale: Katika muktadha wa mwenyeji na mlo, καλέω humaanisha kualika. ‘Watu’ linawekwa wazi kwa sababu Kiswahili kwa kawaida huhitaji nomino baada ya ‘wengi’ katika sentensi hii.
