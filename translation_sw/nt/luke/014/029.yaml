  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa kama mwendelezo wa sentensi kutoka mstari uliotangulia, na alama ya tanbihi [a] imewekwa baada ya kirai husika.
