id: LUK.14.29
reference: Luke 14:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: sw
  text: la sivyo[a], akiisha kuweka msingi lakini asiweze kumaliza, wote wanaoona wataanza kumdhihaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili isije ikawa, akiisha kuweka msingi lakini asiweze kuukamilisha, wote wanaoona waanze kumdhihaki.”
    reason: Njia nyingine ya kutafsiri ἵνα μήποτε kwa karibu zaidi na muundo wa Kigiriki, huku ikihifadhi wazo la matokeo yanayoepukwa.
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: la sivyo
  rationale: Katika onyo hili, kirai hiki kinaanzisha matokeo yasiyotakiwa; “la sivyo” ni Kiswahili cha kawaida kinachohifadhi nguvu ya tahadhari.
- source_word: θέντος αὐτοῦ
  choice: akiisha kuweka
  rationale: Muundo wa genitive absolute unaonyesha tendo linalotangulia kutoweza kumaliza; “akiisha kuweka” huonyesha wazi mpangilio huo.
- source_word: θεμέλιον
  choice: msingi
  rationale: Katika muktadha wa ujenzi, “msingi” ni neno la kawaida na sahihi kwa sehemu ya kuanzia ya jengo.
- source_word: μὴ ἰσχύοντος
  choice: asiweze
  rationale: Kitenzi hapa kinahusu uwezo wa kutekeleza kazi, si nguvu za mwili pekee.
- source_word: ἐκτελέσαι
  choice: kumaliza
  rationale: Katika muktadha wa ujenzi, “kumaliza” huwasilisha kwa kawaida wazo la kuifikisha kazi mwisho.
- source_word: πάντες οἱ θεωροῦντες
  choice: wote wanaoona
  rationale: Tafsiri hii hudumisha maana ya kuona au kutazama bila kulazimisha kitu cha ziada kisichotajwa wazi katika Kigiriki.
- source_word: ἄρξωνται
  choice: wataanza
  rationale: Katika muundo huu wa kusudi hasi, subjunctive inaeleza matokeo yanayohofiwa; Kiswahili hutumia wakati ujao kwa kawaida katika sentensi ya “la sivyo.”
- source_word: αὐτῷ ἐμπαίζειν
  choice: kumdhihaki
  rationale: “Kumdhihaki” ni neno la Kiswahili lenye staha linalobeba maana ya kumfanyia mtu mzaha wa kumfedhehesha.
theological_decisions: []
