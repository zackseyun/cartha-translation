lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinadumisha mwendelezo wa simulizi bila kuongeza maana maalumu ya wakati.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linaelekeza uangalifu wa msomaji kwenye jambo linalofuata na kuhifadhi uchangamfu wa simulizi la Luka.
- source_word: ἄνθρωπός τις
  choice: mtu fulani
  rationale: Muundo huu unamtambulisha mtu mahususi lakini asiyetajwa jina.
- source_word: ἦν
  choice: alikuwa
  rationale: Hii ni tafsiri ya kawaida ya wakati uliopita usiotimilika wa kitenzi εἰμί katika muktadha huu.
- source_word: ὑδρωπικὸς
  choice: aliyekuwa na ugonjwa wa kuvimba kwa maji
  rationale: Kivumishi hiki humaanisha mtu mwenye hali ya mwili kuvimba kwa mkusanyiko usio wa kawaida wa maji. Kauli hii inaeleweka kwa wasomaji wa kawaida kuliko istilahi ya kitabibu pekee.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: mbele yake
  rationale: Inahifadhi maana ya mahali huku ikiruhusu pia wazo la kuwa katika uwepo wake.
