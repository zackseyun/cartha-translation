review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the opposing king as the one still far away and renders πρεσβείαν and τὰ πρὸς εἰρήνην appropriately. However, “ikiwa hawezi” makes the implied subject and relation to the preceding verse less direct than the Greek conditional continuation; “asipoweza” is the natural Swahili continuation of the preceding question about being able to meet the other king.
  naturalness: “Lakini asipoweza, yule mwingine akiwa bado mbali, hutuma wajumbe kuomba masharti ya amani” is idiomatic Standard East African Swahili. It also avoids the slightly awkward coordination “hutuma wajumbe na kuomba,” whose infinitive can momentarily obscure who makes the request.
  terminology: “Wajumbe” is a suitable, accessible rendering of πρεσβείαν in this context. “Masharti ya amani” accurately communicates the idiomatic sense of τὰ πρὸς εἰρήνην without imposing interpretive detail.
  issues:
  - severity: low
    issue: The conditional phrase “ikiwa hawezi” is less directly connected to the preceding context than necessary.
    rationale: εἰ δὲ μήγε (“but if not”) resumes the preceding question of whether the king is able. “Lakini asipoweza” naturally preserves that continuation in Swahili.
  - severity: low
    issue: “Hutuma wajumbe na kuomba” has mildly awkward coordination.
    rationale: Greek depicts the king sending a delegation and seeking peace terms through it. In Swahili, “hutuma wajumbe kuomba” expresses this relationship naturally and clearly.
  revised_text: Lakini asipoweza, yule mwingine akiwa bado mbali, hutuma wajumbe kuomba masharti ya amani.[a]
