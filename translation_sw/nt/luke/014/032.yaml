  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: sw
  text: Lakini asipoweza, yule mwingine akiwa bado mbali, hutuma wajumbe kuomba masharti ya amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mambo yahusuyo amani”; yaani, masharti yatakayowezesha amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Lakini ikiwa hawezi
  rationale: Katika muktadha, maana ni kwamba mfalme akitambua kuwa hawezi kumkabili mfalme mwingine; tafsiri hii huendeleza sharti la mstari uliotangulia kwa Kiswahili cha kawaida.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: yule mwingine akiwa bado mbali
  rationale: Muundo huu huonyesha hali inayotokea wakati mmoja, na αὐτοῦ humrejelea mfalme mpinzani; “yule mwingine” huweka rejeo wazi bila kuongeza maelezo yasiyokuwamo.
- source_word: πρεσβείαν
  choice: wajumbe
  rationale: Neno hili linaweza kumaanisha ujumbe rasmi au kundi la wajumbe. “Wajumbe” ni la asili na linaloeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἀποστείλας
  choice: hutuma
  rationale: Kirai-shiriki cha aoristi kinaunganishwa kwa kawaida na kitenzi kikuu kama tendo linalotangulia ombi; matumizi ya wakati wa mazoea yanaendana na mfano unaosemwa kwa ujumla.
- source_word: ἐρωτᾷ
  choice: kuomba
  rationale: Hapa kitenzi kina maana ya kuomba au kutafuta, si kuuliza habari tu.
- source_word: τὰ πρὸς εἰρήνην
  choice: masharti ya amani
  rationale: Kirai hiki kihalisi ni “mambo yahusuyo amani,” lakini katika mazingira ya wafalme wanaokaribia kupigana kinamaanisha masharti yatakayowezesha amani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wajumbe” limechaguliwa badala ya istilahi nzito kama “ujumbe wa kibalozi.” Alama ya tanbihi imewekwa baada ya “masharti ya amani,” jambo linalolingana na maudhui ya tanbihi.
