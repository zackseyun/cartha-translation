base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: sw
  text: Basi, chumvi ni nzuri; lakini hata chumvi ikipoteza ladha yake[a], itakolezwa kwa kitu gani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikikosa ladha.” Kitenzi cha Kigiriki kinaweza kumaanisha kihalisi “kuwa kipumbavu,” lakini hapa, kikitumiwa kuhusu chumvi, kinamaanisha kukosa ladha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: ni nzuri
  rationale: Hutoa tathmini chanya ya chumvi kwa maana ya jumla bila kuibana kuwa ‘inafaa’ tu.
- source_word: οὖν
  choice: Basi
  rationale: Hudumisha kiunganishi cha hitimisho kutoka mafundisho yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἅλας
  choice: chumvi
  rationale: Ni rejeo halisi la chumvi linalotumiwa kama mfano; hakuna sababu ya kulifafanua kwa maneno mengine.
- source_word: ἐὰν δὲ καὶ
  choice: lakini hata ... iki-
  rationale: ‘Lakini’ huonyesha utofautishaji wa δέ, na ‘hata’ huhifadhi msisitizo wa καί katika sharti.
- source_word: μωρανθῇ
  choice: ikipoteza ladha yake
  rationale: Ingawa kitenzi kinaweza kumaanisha kihalisi ‘kuwa kipumbavu,’ kikihusishwa na chumvi humaanisha kukosa au kupoteza ladha. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐν τίνι
  choice: kwa nini
  rationale: Katika swali hili, kirai kinauliza chombo au njia ya kuikoleza; ‘kwa nini’ ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: ἀρτυθήσεται
  choice: itakolezwa
  rationale: Hudumisha taswira ya chakula ya kukoleza bila kuifasiri kwa upana kuwa ‘itarejeshwa.’
theological_decisions:
- issue: Nguvu ya kimfano ya msemo kuhusu chumvi
  choice: Kuhifadhi msemo kuhusu chumvi bila kufafanua katika matini kwamba unawahusu wanafunzi.
  alternative: Kupanua kifasiri, kwa mfano, ‘wanafunzi wakipoteza sifa yao ya pekee.’
  rationale: Matumizi yake kwa wanafunzi yanaeleweka katika muktadha unaozunguka. Kuhifadhi taswira yenyewe huepuka kutatua kimya-kimya maana na mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Basi’ huunganisha sentensi na yaliyotangulia; ‘itakolezwa kwa nini?’ huhifadhi swali la balagha na taswira ya chumvi.
