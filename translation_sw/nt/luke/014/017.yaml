  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ‘chakula’ badala ya ‘chakula cha jioni’ ili kuepuka kuweka wakati wa siku ambao δείπνον peke yake hailazimishi katika muktadha huu. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
