base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: sw
  text: Na ulipofika wakati wa chakula, alimtuma mtumishi wake awaambie wale waliokuwa wamealikwa[a], ‘Njooni, kwa maana sasa kila kitu kiko tayari.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “wale walioalikwa.” Kauli ya Kigiriki inaonyesha kwamba walikuwa wamealikwa kabla ya mwito huu wa kuja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: alimtuma
  rationale: Kitenzi hiki kinaonyesha kwamba mwenye karamu alimtuma mtumishi kwa kusudi maalumu; ‘alimtuma’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: δοῦλον
  choice: mtumishi
  rationale: Katika mazingira haya ya mfano wa nyumba na karamu, jukumu lake kama mtumishi na mjumbe ndilo linalosisitizwa. ‘Mtumwa’ linawezekana kileksia, lakini lingetilia mkazo hadhi yake kuliko simulizi lenyewe linavyofanya.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: ulipofika wakati wa chakula
  rationale: Hii inaonyesha muda maalumu uliowadia wa kula. Usemi huu ni wa asili katika Kiswahili na hauilazimishi δείπνον kuwa ‘chakula cha jioni,’ kwa kuwa muktadha unahusu karamu.
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: awaambie wale waliokuwa wamealikwa
  rationale: Muundo huu unaonyesha kusudi la kumtuma na hali iliyotangulia ya watu hao kuwa wamekwisha alikwa.
- source_word: Ἔρχεσθε
  choice: Njooni
  rationale: Amri ya wingi inawaalika watu kadhaa waje; ‘Njooni’ ni mwito wa kawaida na wa moja kwa moja.
- source_word: ὅτι
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mwito. ‘Kwa maana’ ni cha asili na chenye hadhi katika Kiswahili.
- source_word: ἤδη
  choice: sasa
  rationale: Katika muktadha huu neno linaonyesha kwamba maandalizi yamekamilika kufikia wakati huo. ‘Sasa’ huwasilisha vizuri maana hiyo katika Kiswahili cha kawaida.
- source_word: ἕτοιμά ἐστιν
  choice: kila kitu kiko tayari
  rationale: Kigiriki kina kivumishi cha wingi kisicho na nomino iliyoelezwa wazi, pamoja na kitenzi cha umoja, na hivyo kutoa maana ya jumla au ya mkusanyiko. ‘Kila kitu kiko tayari’ ni tafsiri ya asili inayodokeza maandalizi yote bila kuyataja moja moja.
theological_decisions: []
