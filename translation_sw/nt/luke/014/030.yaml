  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: sw
  text: wakisema, “Mtu huyu alianza kujenga, lakini hakuweza[a] kumaliza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa na nguvu za kukamilisha.”
    reason: Mbadala huu unaonyesha maana ya msingi ya ἰσχύω inayoweza kusisitiza kutokuwa na nguvu au uwezo wa kutosha, huku “hakuweza” ikifaa zaidi katika muktadha.
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaendelea kueleza kitendo cha watu waliotajwa katika mstari uliotangulia; “wakisema” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ὅτι
  choice: “
  rationale: Hapa ὅτι inatambulisha maneno yanayonukuliwa moja kwa moja; alama za kunukuu zinaeleza kazi hiyo kwa Kiswahili cha kawaida bila kuongeza neno lisilohitajika.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Mtu huyu
  rationale: Huhifadhi kielezi cha kuonyesha na rejeo la wazi kwa mtu huyo, pamoja na sauti ya kumsema hadharani, bila kuongeza dharau isiyo wazi katika Kigiriki.
- source_word: ἤρξατο
  choice: alianza
  rationale: Hutoa maana ya kuanza kufanya kitendo kinachoelezwa na kitenzi kisicho na ukomo kinachofuata.
- source_word: οἰκοδομεῖν
  choice: kujenga
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa ujenzi; hakuna haja ya kuongeza kitu kinachojengwa.
- source_word: καὶ
  choice: lakini
  rationale: Ingawa neno la msingi ni kiunganishi “na,” hapa linaunganisha mwanzo wa ujenzi na kushindwa kuumaliza kwa ulinganifu wa kinyume; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: οὐκ ἴσχυσεν
  choice: hakuweza
  rationale: Katika muktadha huu ἰσχύω inaeleza uwezo wa kutimiza jambo, si lazima nguvu za mwili; “hakuweza” ni ya kawaida na haibainishi chanzo cha kutoweza.
- source_word: ἐκτελέσαι
  choice: kumaliza
  rationale: Katika muktadha wa kujenga, neno hili linamaanisha kukifikisha kazi mwisho; “kumaliza” ni la kawaida na wazi.
