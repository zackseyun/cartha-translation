base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: sw
  text: Unapoalikwa na mtu kwenye karamu ya harusi,[a] usiketi[b] mahali pa heshima kubwa zaidi,[c] kwa maana huenda mtu aliyeheshimiwa kuliko wewe amekwisha kualikwa naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye harusi.” Wingi wa neno la Kigiriki unaweza kumaanisha sherehe za harusi, hasa karamu.
    reason: lexical_alternative
  - marker: b
    text: Katika milo rasmi ya nyakati za kale, watu kwa kawaida walikula wakiwa wameegemea kwenye vitanda vya kulalia badala ya kuketi wima.
    reason: cultural_note
  - marker: c
    text: Yaani, mahali palipopewa heshima kubwa zaidi mezani.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Unapoalikwa na mtu
  rationale: Kauli hii huanzisha hali ya jumla; “unapoalikwa” ni ya asili katika Kiswahili na “na mtu” huhifadhi mtendaji asiyeainishwa.
- source_word: εἰς γάμους
  choice: kwenye karamu ya harusi
  rationale: Wingi wa Kigiriki unaweza kutaja sherehe za harusi, hasa karamu; muktadha wa nafasi mezani unaunga mkono maana hiyo.
- source_word: μὴ κατακλιθῇς
  choice: usiketi
  rationale: Kitenzi cha Kigiriki kinamaanisha kuegemea mezani kwa desturi ya kale, lakini “usiketi” huwasilisha tendo kwa uwazi katika Kiswahili cha sasa; maelezo ya kitamaduni yametolewa katika tanbihi.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: mahali pa heshima zaidi
  rationale: Neno humaanisha nafasi kuu ya heshima kwenye mlo; tafsiri hii ni ya asili na huepuka kudokeza kiti cha kisasa.
- source_word: μήποτε
  choice: huenda
  rationale: Huonyesha uwezekano unaotolewa kama sababu ya onyo, bila kuufanya kuwa jambo la hakika.
- source_word: ἐντιμότερός σου
  choice: mtu mwenye kuheshimiwa kuliko wewe
  rationale: Huhifadhi ulinganisho wa hadhi au heshima katika mazingira ya karamu.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: amekwisha kualikwa naye
  rationale: “Amekwisha kualikwa” huonyesha mwaliko uliotolewa tayari wenye matokeo ya sasa; “naye” humrejelea mtu aliyekualika bila kuongeza neno la kufasiri kama “mwenyeji.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Karamu ya harusi” huweka wazi mazingira ya mlo; “usiketi” ni rahisi kueleweka, huku tanbihi ikihifadhi desturi ya kale ya kuegemea mezani.
