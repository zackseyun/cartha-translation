base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: sw
  text: Na yule aliyewaalika wewe na yeye atakapokuja, atakuambia, “Mpe huyu nafasi yako.” Ndipo utaanza kwa aibu kukaa mahali pa mwisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa chini kabisa.” Maneno ya Kigiriki yanaweza kumaanisha nafasi ya mwisho katika mpangilio, na katika muktadha wa karamu, hivyo nafasi ya chini kabisa kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: yule aliyewaalika wewe na yeye
  rationale: Muundo wa kisifa wenye kibainishi unamtaja mwalikaji kama mtu; tafsiri hii inadumisha utofautishaji wa waalikwa hao wawili bila kuongeza neno ‘mwenyeji.’
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: atakapokuja, atakuambia
  rationale: Kishirikishi cha wakati uliopita kikifuatana na kitenzi cha wakati ujao huonyesha tendo linalotangulia usemi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: Δὸς τούτῳ τόπον
  choice: Mpe huyu nafasi yako
  rationale: Katika muktadha wa mpangilio wa kuketi, amri inamtaka mhusika amwachie mgeni mwingine nafasi yake; ‘nafasi yako’ inaweka wazi maana inayodaiwa na muktadha.
- source_word: μετὰ αἰσχύνης
  choice: kwa aibu
  rationale: Neno αἰσχύνη linaonyesha aibu au fedheha ya kijamii; ‘kwa aibu’ ni fupi, ya asili, na haidhoofishi uzito wake.
- source_word: τὸν ἔσχατον τόπον
  choice: mahali pa mwisho
  rationale: Huhifadhi maana ya msingi ya ἔσχατος kuwa ‘mwisho,’ huku muktadha wa karamu ukionyesha kuwa ni nafasi ya chini zaidi kwa heshima.
- source_word: ἄρξῃ ... κατέχειν
  choice: utaanza ... kwenda kukaa
  rationale: ἄρξῃ huonyesha kuanza, bila kutaja wazi kulazimishwa; katika muktadha huu κατέχειν ni kuchukua au kukalia nafasi, na ‘kwenda kukaa’ huwasilisha kwa kawaida mwendo wa kuaibisha kuelekea nafasi ya mwisho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Nafasi’ limetumiwa kwa kiti cha heshima anachoachia mwingine, na ‘mahali pa mwisho’ kuhifadhi utata halisi kati ya mwisho wa mpangilio na kiwango cha chini cha heshima.
