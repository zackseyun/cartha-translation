base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: sw
  text: Lakini wote kwa pamoja wakaanza kutoa udhuru[a]. Wa kwanza akamwambia, ‘Nimenunua shamba, nami sina budi niende nikalione. Nakuomba, unihesabu kuwa nina udhuru.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaanza kukataa mwaliko kwa kutoa udhuru.” Kitenzi cha Kigiriki kinaweza kumaanisha kukataa mwaliko kwa kutoa sababu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lakini
  rationale: Ingawa kiunganishi hiki mara nyingi humaanisha ‘na,’ hapa kinaanzisha mwitikio unaokinzana na mwaliko uliotangulia.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: wakaanza kutoa udhuru
  rationale: Kitenzi cha kati kinaonyesha kuanza kukataa mwaliko kwa kutoa sababu; usemi huu ni wa kawaida katika Kiswahili na unabaki wazi kuhusu uhalali wa sababu hizo.
- source_word: ἀπὸ μιᾶς
  choice: kwa pamoja
  rationale: Nahau hii ina maana ya kutenda wote pamoja au kana kwamba ni mmoja; ‘kwa pamoja’ ni ya asili bila kuzidisha dhana ya umoja wa nia.
- source_word: πάντες
  choice: wote
  rationale: Inahifadhi msisitizo wa Kigiriki kwamba walioalikwa wote walitoa mwitikio huo.
- source_word: Ἀγρόν
  choice: shamba
  rationale: Neno hili linaweza kumaanisha shamba au kipande cha ardhi; ‘shamba’ ni neno la moja kwa moja na la kawaida katika muktadha huu.
- source_word: ἠγόρασα
  choice: Nimenunua
  rationale: Kauli timilifu ya Kiswahili huonyesha tendo lililokamilika lenye umuhimu wa sasa, jambo linalofaa katika mazungumzo haya.
- source_word: ἔχω ἀνάγκην
  choice: sina budi
  rationale: Nahau hii ya Kiswahili huwasilisha dai la lazima kwa nguvu inayolingana na usemi wa Kigiriki.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: kwenda kuliona
  rationale: Inawasilisha mwendo na kusudi la kuona shamba kwa Kiswahili cha kawaida; ‘kukagua’ kungeongeza maana isiyolazimishwa na kitenzi.
- source_word: ἐρωτῶ σε
  choice: Tafadhali
  rationale: Katika ombi hili, ‘tafadhali’ huwasilisha kwa asili adabu ya usemi wa Kigiriki, ingawa kihalisi ni ‘nakuomba.’
- source_word: ἔχε με παρῃτημένον
  choice: unihesabu kuwa nimeudhuriwa
  rationale: Huonyesha ombi la kukubaliwa kutohudhuria, huku hali timilifu ikihifadhiwa katika ‘kuwa nimeudhuriwa.’
- source_word: ὁ πρῶτος
  choice: Wa kwanza
  rationale: Tafsiri ya moja kwa moja inayomtambulisha mtoa udhuru wa kwanza katika mfululizo.
