  rationale: Kiunganishi δέ kinaonyesha utofauti mdogo na swali la Yesu lililotangulia, huku οἱ ikiwataja wale waliozungumziwa tayari.
- source_word: ἡσύχασαν
  choice: wakakaa kimya
  rationale: Katika muktadha huu kitenzi kina maana ya kutotoa jibu; msemo huu ni wa kawaida na unaonyesha kwamba hawakujibu.
- source_word: ἐπιλαβόμενος
  choice: akamshika yule mtu
  rationale: Huhifadhi wazo la Yesu kumgusa au kumkamata kwa mkono bila kubainisha namna ya mshiko ambayo chanzo hakielezi.
- source_word: ἰάσατο
  choice: akamponya
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya tendo la kuondoa ugonjwa wa mwili.
- source_word: αὐτὸν
  choice: yule mtu
  rationale: Nomino imerudiwa kwa uwazi wa Kiswahili, ikimrejelea mtu mwenye ugonjwa aliyetajwa katika muktadha.
- source_word: ἀπέλυσεν
  choice: akamruhusu aende zake
  rationale: ἀπολύω inaweza kumaanisha kumwachilia, kumruhusu aende, au kumuaga; hapa msemo huu ni wa asili na haudokezi kwamba alikuwa mfungwa.
