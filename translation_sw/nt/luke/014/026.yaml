  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: sw
  text: Mtu yeyote anayekuja kwangu na asiyechukia baba yake mwenyewe, mama yake, mke wake, watoto wake, ndugu zake wa kiume na wa kike, na hata maisha yake mwenyewe, hawezi kuwa mwanafunzi wangu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiwapende ... kwa kiwango kidogo kuliko anavyonipenda.” Kitenzi hiki kihalisi ni “chukia,” lakini katika muktadha huu kinaweza kueleza kwamba uaminifu kwa Yesu lazima utangulie hata mahusiano ya karibu zaidi ya kifamilia; linganisha Mathayo 10:37.
    reason: lexical_alternative
  - marker: b
    text: Au, “nafsi yake mwenyewe.” Hapa “maisha” huenda ndiyo maana ya ψυχή inayofaa katika muktadha wa gharama ya kuwa mwanafunzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: asimchukie
  rationale: Huhifadhi maana ya wazi na ukali wa kitenzi cha Kigiriki, huku maana ya kimuktadha ya kumpenda kwa kiwango kidogo ikielezwa katika tanbihi.
- source_word: ἔρχεται πρός με
  choice: akija kwangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwendo wa kumjia Yesu, bila kuingiza usemi tofauti wa ‘kunifuata.’
- source_word: πατέρα ἑαυτοῦ
  choice: baba yake mwenyewe
  rationale: Neno ‘mwenyewe’ linawakilisha kiwakilishi rejeshi ἑαυτοῦ na kusisitiza uhusiano wake binafsi.
- source_word: γυναῖκα
  choice: mke wake
  rationale: Katika orodha hii ya watu wa nyumbani, maana inayofaa ya γυνή ni ‘mke,’ si ‘mwanamke’ kwa ujumla.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: ndugu zake wa kiume na wa kike
  rationale: Huyataja wazi makundi yote mawili yaliyopo katika Kigiriki, kwa lugha inayoeleweka katika Kiswahili sanifu.
- source_word: ἔτι τε καὶ
  choice: naam, hata
  rationale: Hutoa msisitizo wa kilele kwa jambo la mwisho katika orodha.
- source_word: ψυχὴν ἑαυτοῦ
  choice: maisha yake mwenyewe
  rationale: Katika muktadha wa gharama ya kuwa mwanafunzi, ψυχή inaelekea kumaanisha uhai au maisha ya mtu, si lazima ‘nafsi’ kwa maana finyu.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: hawezi kuwa mwanafunzi wangu
  rationale: Huhifadhi nguvu ya kutowezekana au kutopatana na masharti ya uanafunzi, si katazo tu.
theological_decisions:
- issue: Iwapo ukali wa μισεῖ upunguzwe katika matini kuu
  choice: Kutumia ‘asimchukie’ katika matini kuu na kueleza maana linganishi katika tanbihi.
  alternative: Kutumia ‘asipowapenda ... kwa kiwango kidogo’ katika matini kuu.
  rationale: Kauli ya Yesu ni kali kimakusudi. Tafsiri kuu inaihifadhi badala ya kuifafanua kimya kimya, huku tanbihi ikionyesha maana inayowezekana ya kutanguliza uaminifu kwa Yesu kuliko mahusiano ya karibu.
- issue: Maana ya ψυχή katika mstari huu
  choice: Kutafsiri ‘maisha.’
  alternative: ‘nafsi’ au ‘yeye mwenyewe.’
  rationale: Muktadha unahusu gharama ya uanafunzi na kuweka hata maisha ya mtu chini ya madai ya Yesu; ‘maisha’ huwasilisha maana hiyo bila kulazimisha msimamo finyu kuhusu asili ya nafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti ‘Mtu yeyote akija ... na asimchukie ... hawezi’ ni wa asili katika Kiswahili na huhifadhi hoja ya Kigiriki. ‘Ndugu wa kiume na wa kike’ huepuka utata wa neno ‘ndugu’ pekee na kuonyesha kwamba chanzo kinataja jinsia zote mbili.
