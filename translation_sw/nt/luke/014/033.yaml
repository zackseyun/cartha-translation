  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: sw
  text: Hivyo basi, kila mmoja wenu ambaye haachani na mali zake zote hawezi kuwa mwanafunzi wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye haachi mali zake zote.” Kitenzi cha Kigiriki chaweza kumaanisha “kuaga”; hapa kinaonyesha kuachana na madai ya mtu juu ya mali zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Basi vivyo hivyo
  rationale: Inaonyesha hitimisho linalotokana na mifano iliyotangulia huku ikidumisha maana ya ‘kwa namna hiyo.’
- source_word: πᾶς ἐξ ὑμῶν
  choice: kila mmoja wenu
  rationale: 'Inadumisha mkazo wa kigawanyo: dai hili linamhusu kila msikilizaji binafsi.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: asiyeachana na
  rationale: Kitenzi kinaweza kumaanisha kuaga au kuacha; hapa kinaonyesha kujitenga kwa uamuzi na madai ya kumiliki, bila kulazimisha tafsiri moja tu kuhusu namna ya kufanya hivyo.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: vyote alivyo navyo
  rationale: Ni usemi wa asili wa Kiswahili unaojumuisha mali na vitu vya mtu, huku ukihifadhi upana wa usemi wa Kigiriki.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: hawezi kuwa mwanafunzi wangu
  rationale: Inadumisha maana ya kutowezekana, si kutofaa tu, na ‘mwanafunzi’ ni istilahi iliyozoeleka katika muktadha wa Injili.
theological_decisions:
- issue: Aina ya dai kuhusu mali
  choice: Kutafsiri kwa ‘asiyeachana na vyote alivyo navyo,’ huku ukiacha wazi kama jambo linalosisitizwa ni kuacha umiliki, madai, au kushikamana navyo.
  alternative: ‘asiyetoa mali zake zote’ au ‘asiyeacha kumiliki mali zake zote.’
  rationale: Kigiriki kinaweza kuelekea maana ya kuaga au kuachana na mali. Tafsiri hii inadumisha ukali wa dai la uanafunzi bila kuamua kimya kimya kwamba kila mfuasi lazima auze kila kitu katika kila hali, wala bila kulifanya dai kuwa la ndani tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiswahili hauna haja ya tanbihi kuhusu umoja wa kiume wa Kigiriki, kwa kuwa ‘kila mmoja wenu … alivyo navyo’ humhusu mwanafunzi yeyote bila kuonyesha jinsia.
