review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the servant's report, the completed command, and the remaining capacity. However, the predicate agreement in “uliyoagiza yamefanyika” is not grammatically appropriate for the substantivized singular relative expression.
  naturalness: “Naye mtumishi akasema” and “bado kuna nafasi” are natural Standard East African Swahili. Replacing “pana nafasi” with “kuna nafasi” is more broadly current and idiomatic in this dialogue.
  terminology: “Mtumishi” is appropriate for δοῦλος in this parable, with “mtumwa” retained as a lexical alternative. “Bwana” suitably renders the vocative Κύριε in the household setting. The proposed alternative “Mkuu” is not a reliable lexical equivalent of κύριος here; Swahili “bwana” normally covers both ‘lord’ and ‘master’ in this context.
  issues:
  - severity: medium
    issue: Agreement in “uliyoagiza yamefanyika”
    rationale: 'Uliyoagiza functions as a singular nominalized relative (‘what you commanded’), so the following perfect predicate should be singular: “imefanyika.” The plural “yamefanyika” would require an explicitly plural antecedent such as “mambo uliyoyaagiza.”'
  - severity: low
    issue: Footnote b gives “Mkuu” as an alternative for Bwana
    rationale: “Mkuu” ordinarily means a chief, leader, or senior official, rather than the household-authority sense of κύριος. Since standard Swahili uses “Bwana” for both ‘Lord’ and ‘master’ here, no distinct lexical-alternative footnote is needed.
  revised_text: Naye mtumishi[a] akasema, “Bwana, uliyoagiza imefanyika, na bado kuna nafasi.”
