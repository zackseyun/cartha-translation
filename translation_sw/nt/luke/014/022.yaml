  rationale: The revision corrects singular agreement with the nominal relative phrase “uliyoagiza,” uses the widely natural expression “kuna nafasi,” and removes the misleading “Mkuu” alternative. It retains the source's perfect-completion sense and the contextual ambiguity of Bwana without importing a theological interpretation.
