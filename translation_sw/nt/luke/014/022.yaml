  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: sw
  text: Naye mtumishi[a] akasema, “Bwana, uliyoagiza imefanyika, na bado kuna nafasi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: mtumishi
  rationale: Katika mfano huu neno linamtaja mtu aliye chini ya mamlaka ya bwana wa nyumba. “Mtumishi” ni Kiswahili cha kawaida na cha asili katika mazungumzo haya, huku uwezekano wa maana “mtumwa” ukihifadhiwa katika tanbihi.
- source_word: Κύριε
  choice: Bwana
  rationale: Hapa ni namna ya kumwita mwenye mamlaka katika nyumba. “Bwana” huhifadhi heshima na uhusiano wa mamlaka bila kulazimisha maana ya kimungu katika muktadha wa mfano.
- source_word: γέγονεν
  choice: yamefanyika
  rationale: Kauli timilifu inaonyesha kwamba agizo limetekelezwa na matokeo yake yapo. “Yamefanyika” ni ya asili kwa Kiswahili na inapatana na wingi wa mambo yaliyomo katika “uliyoagiza.”
- source_word: ὃ ἐπέταξας
  choice: uliyoagiza
  rationale: Hurejelea yale ambayo bwana alimwamuru mtumishi awali. “Kuagiza” huonyesha mamlaka kwa lugha ya kawaida na yenye hadhi.
- source_word: ἔτι
  choice: bado
  rationale: “Bado” huonyesha kwamba nafasi inaendelea kuwapo hata baada ya agizo kutekelezwa.
- source_word: τόπος
  choice: nafasi
  rationale: Katika mazingira ya karamu, neno linamaanisha nafasi iliyobaki kwa wageni zaidi. “Nafasi” ni ya kawaida na wazi kuliko tafsiri halisi ya mahali.
theological_decisions:
- issue: Ikiwa Κύριε hapa ni cheo cha kimungu au namna ya kumwita mwenye nyumba
  choice: Bwana
  alternative: Mkuu / bwana wa nyumba
  rationale: Msemaji anamwita mwenye nyumba ndani ya mfano. Tafsiri “Bwana” huhifadhi neno la chanzo na heshima yake, lakini muktadha hauhitaji kulifanya hapa kuwa tamko la moja kwa moja kuhusu uungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huendeleza simulizi kwa kuwakilisha καί; “pana nafasi” ni usemi wa asili unaoonyesha kwamba nafasi ya wageni zaidi bado ipo.
