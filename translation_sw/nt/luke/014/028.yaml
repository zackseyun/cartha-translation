id: LUK.14.28
reference: Luke 14:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: sw
  text: Kwa maana, ni nani miongoni mwenu anayetaka kujenga mnara ambaye haketi kwanza na kukadiria gharama, ili kuona kama ana vya kutosha kuukamilisha?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Kwa maana, ni nani miongoni mwenu
  rationale: Muundo huu unaanzisha swali la balagha linalowahusisha wasikilizaji moja kwa moja; γάρ inaendeleza hoja iliyotangulia kwa “Kwa maana.”
- source_word: θέλων
  choice: anayetaka
  rationale: Kitenzi hiki cha hali ya kuendelea kinaonyesha nia au kusudi la mtu, na “anayetaka” ni Kiswahili cha kawaida na cha asili.
- source_word: πύργον οἰκοδομῆσαι
  choice: kujenga mnara
  rationale: Tafsiri hii inahifadhi moja kwa moja picha ya ujenzi wa mnara iliyo katika chanzo.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: ambaye haketi kwanza
  rationale: οὐχί huunda swali linalotarajia jibu la kukubali, huku “haketi kwanza” ikihifadhi kitendo cha kuketi kabla ya kufanya hesabu.
- source_word: ψηφίζει τὴν δαπάνην
  choice: na kukadiria gharama
  rationale: ψηφίζω hapa ni kufanya hesabu ya makusudi kuhusu matumizi ya mradi; “kukadiria gharama” ni usemi wa asili katika muktadha wa ujenzi.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: ili kuona kama ana vya kutosha kuukamilisha
  rationale: Kirai cha Kigiriki ni kifupi, kihalisi “kama ana kwa ajili ya ukamilisho.” Tafsiri hii inaweka wazi maana inayodokezwa ya kuwa na rasilimali za kutosha, bila kubadili hoja.
theological_decisions: []
