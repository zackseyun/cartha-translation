  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: sw
  text: 'Akawaambia walioalikwa mfano huu, alipoona jinsi walivyokuwa wakijichagulia nafasi za heshima[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafasi za kwanza.” Neno la Kigiriki linamaanisha sehemu zilizoheshimiwa zaidi katika karamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Akawaambia
  rationale: Kauli hii ya kisimulizi ni ya kawaida na ya asili katika Kiswahili; muktadha wa kitendo kinachoendelea unadokezwa na kishazi kinachofuata bila kutumia muundo mzito wa “alikuwa akiwaambia.”
- source_word: δὲ
  choice: haikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mfuatano wa vitenzi vya Kiswahili unatosha kuonyesha mwendelezo bila kuingiza “sasa” au tofauti yenye nguvu.
- source_word: τοὺς κεκλημένους
  choice: walioalikwa
  rationale: Huhifadhi maana ya watu waliokuwa katika hali ya kuwa wamealikwa, bila kuongeza moja kwa moja neno “wageni.”
- source_word: παραβολήν
  choice: mfano
  rationale: “Mfano” ni istilahi ya kawaida ya Biblia ya Kiswahili kwa παραβολή na inaeleweka katika muktadha wa mafundisho ya Yesu.
- source_word: ἐπέχων
  choice: alipoona
  rationale: Huwasilisha kwa lugha ya kawaida kitendo cha kutambua kwa makini jambo lililokuwa likitendeka na sababu ya kutoa mfano.
- source_word: πῶς
  choice: jinsi
  rationale: Hueleza namna walivyokuwa wakitenda kwa Kiswahili cha asili.
- source_word: τὰς πρωτοκλισίας
  choice: nafasi za heshima
  rationale: Hueleza hadhi ya kijamii ya sehemu bora za kukaa au kuegemea kwenye karamu kuliko tafsiri finyu ya “viti vya mbele.”
- source_word: ἐξελέγοντο
  choice: walivyokuwa wakijichagulia
  rationale: Muundo huu huhifadhi hali ya tendo lililokuwa likiendelea au kurudiwa, pamoja na kidokezo cha kauli ya kati kwamba walikuwa wakichagua kwa ajili yao wenyewe.
- source_word: λέγων πρὸς αὐτούς
  choice: akawaambia
  rationale: Kitenzi hiki kinaingiza kwa njia ya asili maneno ya moja kwa moja yanayofuata katika mistari inayofuata.
