  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: sw
  text: Mwingine akasema, “Nimeoa, kwa hiyo siwezi kuja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: Mwingine
  rationale: Katika mfululizo huu wa visingizio, neno hili linamtambulisha mtu mwingine anayejibu; “Mwingine” ni la kawaida na wazi katika masimulizi ya Kiswahili.
- source_word: Γυναῖκα ἔγημα
  choice: Nimeoa
  rationale: Katika muktadha huu γυνή humaanisha mke, na γαμέω humaanisha kuoa. Kiswahili cha kawaida hutumia kitenzi “kuoa” bila kuongeza “mke,” jambo linalowasilisha maana kamili kwa lugha ya asili.
- source_word: διὰ τοῦτο
  choice: kwa hiyo
  rationale: Kirai hiki kinaonyesha kuwa ndoa ndiyo sababu inayotolewa ya kutokuja; “kwa hiyo” huunganisha sababu na matokeo kwa njia ya asili.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: siwezi kuja
  rationale: Hii inahifadhi dai la msemaji kwamba hana uwezo wa kuja, kwa usemi wa kawaida na wa moja kwa moja wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na ya kawaida katika simulizi. Wakati timilifu “Nimeoa” unaonyesha tendo lililokamilika lenye umuhimu wa sasa, kama inavyofaa kwa kisingizio kinachotolewa.
