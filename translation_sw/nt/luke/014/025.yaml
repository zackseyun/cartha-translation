  text: 'Makutano mengi yalikuwa yakiandamana naye[a], akageuka, akawaambia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makutano mengi yalikuwa yakisafiri pamoja naye.” Kigiriki kinakazia kwamba makutano mengi yalikuwa yakienda pamoja na Yesu njiani.
