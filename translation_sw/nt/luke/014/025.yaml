lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: ulikuwa ukisafiri pamoja
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha tendo lililokuwa likiendelea; “ulikuwa ukisafiri pamoja” ni Kiswahili cha kawaida kinachodumisha wazo la kuandamana naye njiani.
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha simulizi. Mgawanyo wa sentensi unatosha kuonyesha mpito bila kuongeza “basi” au “sasa,” ambazo zingeweza kusisitiza zaidi ya Kigiriki.
- source_word: αὐτῷ
  choice: naye
  rationale: Inadumisha kiwakilishi cha Kigiriki na, pamoja na “pamoja,” inaonyesha kuandamana bila kurudia jina la Yesu pasipo lazima.
- source_word: ὄχλοι πολλοί
  choice: umati mkubwa
  rationale: Ingawa Kigiriki kina wingi wa “makutano mengi,” “umati mkubwa” ni usemi wa asili katika Kiswahili unaowasilisha idadi kubwa ya watu; uwezekano wa muundo wa wingi umehifadhiwa katika tanbihi.
- source_word: καὶ
  choice: (mpangilio wa sentensi)
  rationale: Kiunganishi rahisi kimetolewa kwa kutenganisha sentensi ili simulizi lisomeke kwa kawaida; hakuna maana ya hitimisho iliyoongezwa.
- source_word: στραφεὶς
  choice: Akageuka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia mara moja kabla ya kusema; “akageuka” ni simulizi la asili na haliongezi kwa lazima wazo la kugeuka kabisa nyuma.
- source_word: εἶπεν
  choice: akawaambia
  rationale: Katika muktadha wa kusema kwa watu fulani, “akawaambia” huwasilisha kwa asili kitendo cha kusema pamoja na waelekezewa.
- source_word: πρὸς αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “akawaambia” kinadumisha maana ya “kwao/aliwaambia,” huku rejeleo lake likiwa wazi kuwa ni umati.
