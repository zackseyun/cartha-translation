  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: sw
  text: Bali kila unapoandaa karamu[a], waalike maskini, wenye ulemavu wa viungo[b], viwete na vipofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe yenye chakula” au “hafla ya mapokezi.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linahusu watu wenye ulemavu au kasoro za kimwili; linaweza pia kutafsiriwa “vilema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Bali
  rationale: Kiunganishi hiki kinaonyesha tofauti na agizo lililotangulia kuhusu watu ambao mwenyeji hapaswi kuwaalika.
- source_word: ὅταν
  choice: kila unapo-
  rationale: Muundo huu unaonyesha wakati usio maalumu na hali inayoweza kujirudia, kama ilivyo katika ὅταν pamoja na kitenzi cha utegemezi.
- source_word: δοχὴν ποιῇς
  choice: unapoandaa karamu
  rationale: Nahau ya Kigiriki ina maana ya kufanya au kuandaa mapokezi yenye chakula; “kuandaa karamu” ni Kiswahili cha kawaida na hakifungi maana kwenye chakula cha jioni pekee.
- source_word: κάλει
  choice: waalike
  rationale: Katika muktadha wa karamu, καλέω humaanisha kuwaalika watu, si kuwaita tu.
- source_word: πτωχούς
  choice: maskini
  rationale: Kivumishi hiki kimetumiwa kama nomino kutaja kundi la watu maskini; tafsiri hii ni fupi na ya kawaida.
- source_word: ἀναπείρους
  choice: wenye ulemavu wa viungo
  rationale: Neno hili linahusu watu wenye kasoro au ulemavu wa mwili. Usemi huu ni wa sasa na wenye staha, huku ukitofautishwa na χωλούς, linalolenga hasa ugumu wa kutembea.
- source_word: χωλούς
  choice: viwete
  rationale: Neno hili humaanisha watu wenye ulemavu unaoathiri kutembea; “viwete” huhifadhi tofauti yake na neno pana zaidi ἀναπείρους.
- source_word: τυφλούς
  choice: vipofu
  rationale: Ni tafsiri ya kawaida ya kivumishi kilichotumiwa kama nomino kwa watu wasioona.
theological_decisions:
- issue: Kutafsiri majina ya makundi yenye ulemavu kwa lugha ya sasa huku orodha ya Kigiriki ikihifadhiwa
  choice: maskini, wenye ulemavu wa viungo, viwete na vipofu
  alternative: maskini, vilema, viwete na vipofu
  rationale: Agizo linahusu kuwakaribisha watu waliokuwa pembezoni mwa jamii. Tafsiri iliyochaguliwa inahifadhi makundi manne na tofauti kati ya ἀναπείρους na χωλούς bila kutumia “vilema,” ambalo kwa baadhi ya wasomaji wa sasa linaweza kusikika kama jina lisilo na staha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kila unapoandaa” hudhihirisha hali ya kujirudia ya ὅταν, na orodha fupi hudumisha mkazo wa sentensi ya Kigiriki.
