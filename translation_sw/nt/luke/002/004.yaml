reference: Luke 2:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: sw
  text: Yosefu naye akapanda kutoka Galilaya, kutoka mji wa Nazareti, kwenda Yudea, hadi mji wa Daudi unaoitwa Bethlehemu, kwa sababu alikuwa wa nyumba na ukoo wa Daudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέβη
  choice: akapanda
  rationale: Inahifadhi wazo la kwenda juu lililo katika kitenzi cha Kigiriki na linalofaa safari kutoka Galilaya kwenda eneo la Yudea.
- source_word: δὲ καὶ
  choice: naye
  rationale: Kiunganishi hiki cha kawaida cha masimulizi kinaendeleza habari na wakati huohuo kinaonyesha kwamba Yosefu pia alishiriki katika safari hiyo.
- source_word: πόλεως / πόλιν
  choice: mji / mji
  rationale: Neno la kawaida la Kiswahili “mji” linafaa kwa Nazareti na pia linahifadhi cheo cha kibiblia “mji wa Daudi” kwa Bethlehemu.
- source_word: Ἰουδαίαν
  choice: Yudea
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa eneo hilo la kihistoria katika kipindi cha Agano Jipya.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: mji wa Daudi uitwao Bethlehemu
  rationale: Inahifadhi uhusiano wa mji huo na Daudi na maelezo kwamba jina lake ni Bethlehemu, kwa Kiswahili cha asili na chenye hadhi.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: kwa sababu alikuwa
  rationale: Muundo wa Kigiriki unaonyesha sababu; kishazi hiki cha Kiswahili kinawasilisha maana hiyo kwa uwazi.
- source_word: ἐξ οἴκου
  choice: wa nyumba
  rationale: “Nyumba” inahifadhi maana ya kifalme au nasaba ya Daudi, badala ya kuifanya kuwa kaya ya karibu tu.
- source_word: πατριᾶς
  choice: ukoo
  rationale: “Ukoo” ni neno la kawaida na sahihi kwa kundi au mstari wa kizazi unaotokana na babu mmoja.
- source_word: Δαυίδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Istilahi mbili za asili ya Daudi
  choice: wa nyumba na ukoo wa Daudi
  alternative: wa jamaa na nasaba ya Daudi
  rationale: Tafsiri inahifadhi maneno yote mawili, οἶκος na πατριά, bila kuyachanganya kuwa dhana moja; hivyo inatunza msisitizo wa Luka juu ya asili ya Yosefu katika ukoo wa Daudi bila kuongeza dai la kimafundisho lisilosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi umetumia “akapanda” na “akaenda” kwa mtiririko wa kawaida. Hakuna tanbihi iliyohitajika; alama [a] katika safu ya Kiingereza inaonekana kutowiana na maudhui ya tanbihi, kwa kuwa imewekwa baada ya “Galilee” ilhali tanbihi inahusu “house and family line.”
