lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida ya Kiswahili bila kuongeza uhusiano mwingine wa kimantiki.
- source_word: πάντες οἱ ἀκούσαντες
  choice: wote waliosikia
  rationale: Kirai cha kishiriki chenye kibainishi kinamaanisha watu wote waliosikia. Kiswahili hakihitaji kuongeza kiwakilishi cha kitu, kwa kuwa taarifa iliyosikiwa inaeleweka kutokana na muktadha.
- source_word: ἐθαύμασαν
  choice: walistaajabu
  rationale: Kitenzi hiki kinaonyesha mshangao au kustaajabu kutokana na habari walizosikia; 'walistaajabu' ni lugha ya sasa, ya heshima, na haisemi kwamba waliamini au walikataa.
- source_word: περὶ τῶν λαληθέντων
  choice: kuhusu yale waliyoambiwa
  rationale: περί pamoja na jenitivi huonyesha jambo linalohusika, na kishiriki cha kutendwa hurejelea yaliyosemwa. Tafsiri hii inahifadhi maana ya 'kuhusu' na hali ya kutendwa kwa namna ya kawaida katika Kiswahili.
- source_word: ὑπὸ τῶν ποιμένων
  choice: na wachungaji
  rationale: Katika muundo wa kutendwa, 'na' humtambulisha mtendaji kwa Kiswahili cha kawaida; ποιμένες ni wachungaji.
- source_word: πρὸς αὐτούς
  choice: waliy[o]ambiwa
  rationale: Mwelekeo wa usemi kwa wasikilizaji umejumuishwa kiasili katika kitenzi 'waliyoambiwa'; hivyo maana ya 'kwao' imehifadhiwa bila marudio yasiyo ya kawaida.
theological_decisions:
- issue: Aina ya mwitikio unaoelezwa na ἐθαύμασαν
  choice: Walistaajabu, bila kubainisha kama mshangao huo ulikuwa imani au kutokuamini.
  alternative: Walitikia kwa imani, au walikuwa na udadisi tu.
  rationale: Kitenzi cha Kigiriki kinaeleza mwitikio wa mshangao pekee. Tafsiri haipaswi kuamua matokeo yake ya kiroho ambayo aya yenyewe haijayataja.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ''Nao'' hudumisha mtiririko wa simulizi; ''walistaajabu kuhusu'' huhifadhi uhusiano wa περί ingawa ''walishangazwa na'' pia ni usemi wa kawaida zaidi. Kumbuka: katika uamuzi wa kileksika, maandishi ''waliy[o]ambiwa'' yanaashiria uchaguzi wa ''waliyoambiwa''.'
