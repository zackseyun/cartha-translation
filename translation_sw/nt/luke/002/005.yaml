  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: sw
  text: ili kuandikishwa pamoja na Maria, aliyekuwa ameposwa naye[a], akiwa mjamzito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa amechumbiwa naye.” Kigiriki kinaonyesha uchumba rasmi uliokuwa na nguvu ya kisheria na kijamii kuliko uchumba mwingi wa kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa na mimba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: kuandikishwa
  rationale: 'Katika muktadha wa sensa, kitenzi hiki kinaeleza kusudi la safari ya Yosefu: kuingizwa rasmi katika orodha. Kiswahili cha ‘kuandikishwa’ ni cha kawaida na kinaonyesha tendo la kiutawala.'
- source_word: σὺν
  choice: pamoja na
  rationale: Hii ni tafsiri ya kawaida ya kuonyesha uandamani, na inafaa katika sentensi hii.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: aliyekuwa ameposwa naye
  rationale: Kauli hii inaonyesha uchumba rasmi wenye nguvu ya kijamii na kisheria kuliko uchumba wa kawaida wa kisasa. ‘Ameposwa naye’ ni ya asili katika Kiswahili na haiongezi kwamba ndoa ilikuwa tayari imekamilika.
- source_word: οὔσῃ ἐγκύῳ
  choice: na alikuwa mjamzito
  rationale: Kauli hii inaeleza hali ya Maria wakati huo kwa Kiswahili cha sasa kilicho wazi na cha kawaida.
theological_decisions:
- issue: Hali ya uhusiano wa Maria na Yosefu
  choice: aliyekuwa ameposwa naye
  alternative: aliyekuwa mchumba wake; mke wake
  rationale: Kigiriki kinataja kuposwa rasmi, si kusema moja kwa moja kwamba Maria alikuwa tayari mke wake. ‘Mchumba wake’ huenda ikadhoofisha uzito wa kisheria na kijamii wa uhusiano huo, na ‘mke wake’ ingeongeza jambo lisilosemwa katika kishazi hiki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa kawaida, wenye hadhi na unaoeleweka. Muundo umehifadhi kishazi cha kusudi kinachoendelea kutoka muktadha uliotangulia.
