  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: sw
  text: Na tazama, palikuwa na mtu katika Yerusalemu aliyeitwa Simeoni. Mtu huyu alikuwa mwenye haki na mcha Mungu; alikuwa akiingojea faraja ya Israeli[a], na Roho Mtakatifu alikuwa juu yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufarijiwa kwa Israeli.” Kifungu hiki kinarejelea faraja na kurejeshwa ambako Israeli ilitumaini kupokea kutoka kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “roho takatifu ilikuwa juu yake.” Ingawa Kigiriki hakina kibainishi hapa, katika muktadha wa Luka kifungu hiki kwa kawaida humrejelea Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linahifadhi ishara ya Luka ya kuvuta fikira za msomaji na kuanzisha jambo lenye umuhimu katika simulizi.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: “Mtu” ni tafsiri ya kawaida na ya asili katika Kiswahili; muktadha na jina Simeoni vinaonyesha kwamba anayezungumziwa ni mwanamume.
- source_word: ᾧ ὄνομα Συμεών
  choice: aliyeitwa Simeoni
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kumtambulisha mtu kwa jina bila kupoteza maana ya kifungu cha Kigiriki.
- source_word: δίκαιος
  choice: mwenye haki
  rationale: “Mwenye haki” huhifadhi maana ya tabia iliyo sawa mbele za Mungu pamoja na uzito wake wa kimaadili na wa agano.
- source_word: εὐλαβής
  choice: mcha Mungu
  rationale: Katika maelezo ya tabia ya Simeoni, usemi huu wa kawaida unaeleza kwa ufupi uchaji na heshima yake kwa Mungu.
- source_word: προσδεχόμενος
  choice: akiingojea
  rationale: Kitenzi hiki kinaonyesha hali endelevu ya kungoja kwa tumaini na matarajio.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: faraja ya Israeli
  rationale: “Faraja” huhifadhi mwangwi wa tumaini la kibiblia kwamba Mungu angewafariji na kuwarejesha watu wake, bila kufafanua kupita kiasi ndani ya mstari.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Ingawa kifungu cha Kigiriki hakina kibainishi, matumizi ya Luka na muktadha wa karibu yanaelekeza kwa Roho Mtakatifu.
- source_word: ἐπ’ αὐτόν
  choice: alikuwa juu yake
  rationale: Hii huhifadhi tamathali ya kibiblia kuhusu kuwapo na utendaji wa Roho juu ya mtu bila kuongeza wazo lisilotajwa wazi, kama vile “alikaa” au “alimjaza.”
theological_decisions:
- issue: Maana ya παράκλησιν τοῦ Ἰσραήλ
  choice: faraja ya Israeli
  alternative: kufarijiwa kwa Israeli
  rationale: Muundo wenye nomino huhifadhi ufupi na upana wa Kigiriki, ambao unaweza kuhusisha faraja, wokovu na kurejeshwa kwa Israeli bila kuchagua ufafanuzi mmoja pekee.
- issue: Anayerejelewa na πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: Roho Mtakatifu alikuwa juu yake
  alternative: roho takatifu ilikuwa juu yake
  rationale: Muktadha wa Luka 2:26–27 na matumizi ya Luka kwa kawaida yanaonyesha Roho Mtakatifu. Tanbihi inahifadhi uwezekano wa kisarufi wa tafsiri isiyo na kibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Na tazama” imehifadhiwa kwa mtindo wa juu kiasi ili kuonyesha msisitizo wa kisimulizi wa Luka, huku “aliyeitwa Simeoni” na “akiingojea” vikifanya sentensi isikike kwa kawaida katika Kiswahili.
