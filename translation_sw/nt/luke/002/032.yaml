translation:
  language: sw
  text: nuru ya ufunuo kwa mataifa[a], na utukufu wa watu wako Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nuru ya ufunuo kwa watu wasio Wayahudi.” Neno la Kigiriki linaweza kumaanisha “mataifa” kwa ujumla, lakini hapa, kwa kulinganishwa na Israeli, yaelekea linawahusu hasa watu wasio Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” ni neno la kawaida, la kishairi na lenye hadhi linalowakilisha picha ya Kigiriki bila kulazimisha kibainishi kisichokuwapo.
- source_word: εἰς
  choice: ya
  rationale: Katika muundo “nuru ya kuwafunulia,” “ya” huonyesha kusudi au kazi ya nuru kwa Kiswahili cha kawaida.
- source_word: ἀποκάλυψιν
  choice: kuwafunulia
  rationale: Kitenzi hiki huwasilisha kwa kawaida wazo la kufichua au kufanya jambo lijulikane; muundo wa kimatendo unasomeka kwa urahisi kuliko nomino nzito “ufunuo.”
- source_word: ἐθνῶν
  choice: mataifa
  rationale: “Mataifa” ndiyo maana ya moja kwa moja na huhifadhi upana halisi wa neno la Kigiriki; katika muktadha huu linaweza kumaanisha watu wasio Wayahudi, jambo linaloelezwa katika tanbihi.
- source_word: καὶ
  choice: na
  rationale: Huunganisha sehemu mbili sambamba za kauli kwa njia ya moja kwa moja.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” huhifadhi maana ya heshima na fahari yenye uzito wa kibiblia.
- source_word: λαοῦ σου Ἰσραήλ
  choice: watu wako Israeli
  rationale: Muundo huu wa kawaida unamtambulisha Israeli kuwa watu wa Mungu bila kuongeza ufafanuzi usiokuwapo katika chanzo.
theological_decisions:
- issue: Maana ya ἐθνῶν ikilinganishwa na Israeli
  choice: mataifa
  alternative: watu wa mataifa mengine / wasio Wayahudi
  rationale: Neno la Kigiriki kimsingi ni “mataifa,” lakini kulinganishwa kwake na “watu wako Israeli” kunaashiria hasa wasio Wayahudi. Tafsiri kuu huhifadhi upana wa neno, na tanbihi huonyesha maana inayowezekana katika muktadha.
- issue: Uhusiano wa “ufunuo” na mataifa
  choice: nuru ya kuwafunulia mataifa
  alternative: nuru kwa ajili ya ufunuo kwa mataifa
  rationale: Muundo wa Kiswahili uliochaguliwa unaeleweka kwa urahisi na huhifadhi wazo kwamba nuru inaleta kufunuliwa au kujulikana kwa mataifa, bila kufafanua kupita kiasi kitu hasa kinachofunuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa wimbo wa Simeoni. “Mataifa” limewekwa katika matini kuu ili kuhifadhi maana pana ya chanzo, huku tanbihi ikifafanua utofautishaji wa Wayahudi na wasio Wayahudi.
