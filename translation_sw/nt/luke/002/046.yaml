  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: sw
  text: Ikawa baada ya siku tatu wakamkuta hekaluni[a], ameketi katikati ya walimu, akiwasikiliza na akiwauliza maswali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linamaanisha eneo lote la hekalu, si jengo la patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: b
    text: Au, “akiwahoji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuendeleza simulizi. “Ikawa” inadumisha kazi hiyo ya kusimulia kwa lugha yenye hadhi bila kuwa nzito.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: baada ya siku tatu
  rationale: Inafuata kwa karibu mpangilio na maana ya usemi wa Kigiriki unaoonyesha wakati uliofuata.
- source_word: εὗρον
  choice: wakamkuta
  rationale: Kitenzi hiki kinaonyesha kwamba baada ya kumtafuta walimpata mahali hapo; “wakamkuta” ni cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa eneo la hekalu; tanbihi inaeleza kwamba Kigiriki kinamaanisha eneo lote la hekalu, si patakatifu pa ndani pekee.
- source_word: καθεζόμενον
  choice: ameketi
  rationale: Inaonyesha hali ya Yesu wakati walipomkuta na inasomeka kwa kawaida baada ya “wakamkuta.”
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: katikati ya walimu
  rationale: Inadumisha picha ya mahali alipoketi bila kuongeza maelezo kama “walimu wa sheria,” ambayo hayajasemwa wazi katika Kigiriki.
- source_word: ἀκούοντα αὐτῶν
  choice: akiwasikiliza
  rationale: Inaonyesha kusikiliza kwa makini, si kusikia sauti tu.
- source_word: ἐπερωτῶντα αὐτούς
  choice: akiwauliza maswali
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kushiriki katika mazungumzo bila kudokeza lazima kwamba alikuwa akiwapinga au kuwahoji kwa ukali.
theological_decisions:
- issue: Aina ya mazungumzo ya Yesu na walimu
  choice: akiwasikiliza na akiwauliza maswali
  alternative: akiwasikiliza na kuwahoji
  rationale: Tafsiri inaonyesha unyenyekevu na ushiriki hai wa Yesu bila kupunguza hekima yake wala kuingiza wazo lisilolazimishwa na Kigiriki kwamba alikuwa akiwakabili au kuwatahini walimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “Ikawa … wakamkuta” unadumisha mtiririko wa kisimulizi wa Luka, huku vishazi “akiwasikiliza” na “akiwauliza” vikifanya tukio lieleweke kwa urahisi.
