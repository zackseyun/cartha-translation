  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: sw
  text: Naye alipokuwa na umri wa miaka kumi na miwili, walipokuwa wakipanda[a] kulingana na desturi ya sikukuu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipopanda.” Kigiriki kinaweza kutafsiriwa kwa njia hii fupi, lakini “walipokuwa wakipanda” linaonyesha wazi zaidi tendo lililokuwa likiendelea.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Sikukuu ya Pasaka, kama ilivyotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὅτε
  choice: Naye alipokuwa
  rationale: “Naye” linaendeleza simulizi, na “alipokuwa” linaanzisha kishazi cha wakati kwa Kiswahili cha kawaida.
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: alipokuwa na umri wa miaka kumi na miwili
  rationale: Hii ni nahau ya Kigiriki inayoonyesha kuwa Yesu alikuwa amefikia umri wa miaka kumi na miwili; tafsiri hii ni wazi na ya asili kwa Kiswahili.
- source_word: ἀναβαινόντων
  choice: walipokuwa wakipanda
  rationale: Kitenzi kina maana ya kupanda, nalo umbo la kitenzi-jina cha wakati wa sasa linaonyesha tendo lililokuwa likiendelea sambamba na kishazi kikuu. Mahali wanakopanda, yaani Yerusalemu, yanaeleweka kutoka mstari uliotangulia lakini hayaongezwi hapa.
- source_word: αὐτῶν
  choice: wa- katika “walipokuwa”
  rationale: Kiambishi cha nafsi ya wingi kinarejelea kundi lililotajwa katika muktadha, hasa wazazi wake, bila kuwataja kwa namna iliyo wazi zaidi kuliko Kigiriki.
- source_word: κατὰ τὸ ἔθος
  choice: kulingana na desturi
  rationale: Kauli hii inaonyesha kutenda kwa kufuata desturi iliyowekwa; tafsiri hii ni ya kawaida na inabaki karibu na Kigiriki.
- source_word: τῆς ἑορτῆς
  choice: ya sikukuu
  rationale: ἑορτή ni sikukuu ya kidini. Muktadha wa mstari uliotangulia unaonyesha kuwa ni Sikukuu ya Pasaka.
