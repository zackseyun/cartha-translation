  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: sw
  text: Naye Yesu akazidi kukua katika hekima na kimo[a], na katika kibali mbele za Mungu na watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umri” au “ukomavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: akazidi kukua
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha maendeleo yaliyoendelea kwa muda. “Akazidi kukua” ni Kiswahili cha kawaida kinachowasilisha ukuaji halisi na unaoendelea.
- source_word: σοφίᾳ
  choice: hekima
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya σοφία, ikihusu ufahamu na utambuzi wenye busara.
- source_word: ἡλικίᾳ
  choice: kimo
  rationale: Katika muktadha huu neno linaweza kumaanisha kimo cha mwili, umri, au ukomavu. “Kimo” kinaonyesha ukuaji wa kibinadamu unaoonekana, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: χάριτι
  choice: kibali
  rationale: Hapa χάρις linaeleza kukubaliwa au kupendelewa katika uhusiano na Mungu na watu, si lazima neema ya wokovu kama dhana ya kiteolojia.
- source_word: παρὰ θεῷ
  choice: mbele za Mungu
  rationale: παρά pamoja na hali ya dativu hapa huonyesha hali ya mtu machoni pa au katika uhusiano na mwingine. “Mbele za Mungu” ni usemi wa asili unaohifadhi wazo hilo.
- source_word: ἀνθρώποις
  choice: watu
  rationale: Wingi huu unawahusu wanadamu kwa ujumla. “Watu” ni neno la kawaida, jumuishi, na sahihi katika Kiswahili bila kudokeza wanaume pekee.
theological_decisions:
- issue: Ukuaji wa kibinadamu wa Yesu na mvutano wake wa kikristo
  choice: Aya inasema wazi kwamba Yesu alizidi kukua katika hekima, kimo, na kibali.
  alternative: Kutumia maneno yanayoficha au kupunguza ukuaji wake ili kuondoa mvutano wa kiteolojia.
  rationale: Kigiriki kinaeleza maendeleo halisi ya Yesu. Tafsiri inahifadhi ushuhuda huo kuhusu ubinadamu wake wa kweli bila kuufafanua kupita kiasi au kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa “akazidi kukua” unaonyesha kitendo kilichoendelea, na “watu” huwasilisha ἀνθρώποις kwa maana ya wanadamu kwa ujumla.
