  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: sw
  text: Naye akamzaa mwanawe mzaliwa wa kwanza, akamzungushia vitambaa[a] na kumlaza katika hori la kulishia wanyama[b], kwa sababu hawakuwa na nafasi katika chumba cha wageni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamfunga kwa vitambaa vya kumfunika mtoto mchanga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hori.” Neno la Kigiriki linamaanisha mahali au chombo cha kuwekea chakula cha wanyama.
    reason: lexical_alternative
  - marker: c
    text: Kwa jadi, “nyumba ya wageni.” Neno la Kigiriki κατάλυμα linaweza kumaanisha chumba cha wageni au mahali pa kulala; katika Luka 10:34, Luka anatumia neno tofauti kwa nyumba ya wageni ya kibiashara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: akamzaa
  rationale: Hii ni njia ya kawaida na ya moja kwa moja ya kueleza tendo la kuzaa katika simulizi la Kiswahili.
- source_word: πρωτότοκον
  choice: mzaliwa wa kwanza
  rationale: Inaonyesha wazi mpangilio wa kuzaliwa bila kuingiza maana za kitheolojia zisizodaiwa moja kwa moja na muktadha huu.
- source_word: ἐσπαργάνωσεν
  choice: akamfunga kwa vitambaa
  rationale: Kitenzi kinamaanisha kumzungushia mtoto mchanga vitambaa. Usemi huu ni wazi kwa wasomaji wa sasa na hauhitaji istilahi ya kale.
- source_word: ἀνέκλινεν
  choice: kumlaza
  rationale: Katika muktadha wa mtoto mchanga, maana ya asili ni kumweka chini akiwa amelala; “kumlaza” ni Kiswahili cha kawaida na sahihi.
- source_word: φάτνῃ
  choice: hori ya kulishia wanyama
  rationale: Neno hilo la Kigiriki hutaja mahali au chombo cha kuwekea chakula cha wanyama. Tafsiri hii inaweka maana hiyo wazi kuliko kutumia “hori” peke yake.
- source_word: τόπος
  choice: nafasi
  rationale: Katika muktadha huu τόπος inahusu nafasi iliyopatikana kwa ajili yao; “nafasi” ni ya kawaida na huacha wazi aina halisi ya malazi.
- source_word: καταλύματι
  choice: chumba cha wageni
  rationale: κατάλυμα inaweza kuwa chumba cha wageni au mahali pa kulala. Luka anatumia neno tofauti, πανδοχεῖον, kwa nyumba ya wageni ya kibiashara katika Luka 10:34, na κατάλυμα kwa chumba cha wageni katika Luka 22:11.
theological_decisions:
- issue: Iwapo κατάλυμα itafsiriwe kwa maana ya nyumba ya wageni ya kibiashara au nafasi ya wageni katika nyumba
  choice: chumba cha wageni
  alternative: nyumba ya wageni; mahali pa kulala
  rationale: Neno la Kigiriki halilazimishi wazo la nyumba ya wageni ya kibiashara. Chaguo hili linafuata matumizi ya Luka na haliongezi mazingira ya jadi yasiyoelezwa wazi na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa kawaida na wenye heshima. “Mwanawe mzaliwa wa kwanza” huhifadhi mkazo wa maandishi ya Kigiriki; “hori ya kulishia wanyama” huwasaidia wasomaji wanaoweza kutolifahamu neno “hori” peke yake.
