  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: sw
  text: na upanga utapita katika nafsi yako mwenyewe pia[b][a], ili mawazo ya mioyo mingi yafunuliwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utapenya.” Kitenzi cha Kigiriki kwa maana ya moja kwa moja ni “utapita katika,” lakini picha ya upanga kwa kawaida hudokeza kupenya.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida, “upanga” unaeleweka kuwa mfano wa maumivu makali ambayo Maria angeyapata.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: yako mwenyewe
  rationale: Muundo huu unasisitiza kuwa unabii unamhusu Maria binafsi; “yako mwenyewe” ni wa asili katika Kiswahili na huhifadhi msisitizo huo.
- source_word: ψυχή
  choice: nafsi
  rationale: Hapa neno hilo linamaanisha utu wa ndani, mahali pa maumivu makubwa, si uhai wa kimwili tu. “Nafsi” huhifadhi uzito wa kihisia na wa kiroho.
- source_word: διελεύσεται
  choice: utapita katika
  rationale: Kitenzi cha Kigiriki kimsingi humaanisha “kupita katika.” Tafsiri hii huhifadhi picha ya asili bila kuingiza moja kwa moja maana ya kuf刺/“kuchoma,” inayotokana na upanga wenyewe.
- source_word: ῥομφαία
  choice: upanga
  rationale: Ingawa neno linaweza kumaanisha upanga mkubwa, “upanga” ni neno la kawaida, lenye hadhi, na linalotosha katika muktadha huu.
- source_word: ὅπως ἂν
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa; “ili” ni ya asili na huunganisha mateso yaliyotangulia na kufunuliwa kwa mawazo.
- source_word: ἀποκαλυφθῶσιν
  choice: yafunuliwe
  rationale: Huhifadhi hali ya kutendwa na wazo la jambo lililofichika kuwekwa wazi.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: ya mioyo mingi
  rationale: Katika Kiswahili, “mawazo ya mioyo mingi” ni ya asili zaidi na bado huonyesha kwamba mawazo hayo hutoka ndani ya mioyo ya watu wengi.
- source_word: διαλογισμοί
  choice: mawazo
  rationale: Ni neno pana na la kawaida linaloweza kujumuisha fikira, hoja za ndani, au nia bila kulazimisha mwelekeo hasi usioelezwa wazi hapa.
theological_decisions:
- issue: Anayelengwa na kiwakilishi na nguvu ya kinabii
  choice: Kauli imetafsiriwa kama maneno yanayoelekezwa moja kwa moja kwa Maria na yanayotabiri maumivu makubwa ya binafsi, bila kubainisha namna hasa yatakavyotimia.
  alternative: Kuutaja upanga moja kwa moja kuwa huzuni ya Maria wakati wa kusulubiwa kwa Yesu, au kuwa maumivu yanayotokana kwa ujumla na mgawanyiko unaoletwa na huduma ya Yesu.
  rationale: Kigiriki kinamwelekea Maria waziwazi, lakini sitiari ya “upanga” haifafanui namna kamili ya utimizo wake. Tafsiri inadumisha mvutano huo badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “nafsi yako mwenyewe pia” huhifadhi msisitizo wa Kigiriki, na alama zote za tanbihi zimewekwa katika matini kuu.
