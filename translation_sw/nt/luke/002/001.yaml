  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: sw
  text: Ikawa katika siku zile amri ikatolewa na Kaisari Augusto kwamba watu wote katika ulimwengu unaokaliwa waandikishwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu wote wa Roma” au “dola yote.” Mara nyingi neno la Kigiriki humaanisha ulimwengu unaokaliwa kama ulivyoeleweka katika muktadha wa Dola ya Roma.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kisimulizi inayoanzisha tukio jipya; “Ikawa” ni ya kawaida katika usimulizi wa Kibiblia na si nzito kupita kiasi.
- source_word: δὲ
  choice: ika- katika “ikatolewa”
  rationale: Kiunganishi hiki kinaendeleza au kuhamisha simulizi; Kiswahili hulionyesha kwa kawaida kupitia mfuatano wa vitenzi vya ka- badala ya neno tofauti mwanzoni.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: katika siku zile
  rationale: Huhifadhi usemi wa wakati kwa Kiswahili cha kawaida na cha heshima.
- source_word: ἐξῆλθεν
  choice: ikatolewa
  rationale: Katika muktadha wa amri ya kifalme, Kiswahili husema amri “imetolewa”; tafsiri hii ni ya asili kuliko “ikatoka” huku ikihifadhi wazo la kutangazwa rasmi.
- source_word: δόγμα
  choice: amri
  rationale: Hapa ni agizo rasmi la mtawala; “amri” inaeleweka kwa urahisi na inafaa kwa muktadha wa kifalme.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: na Kaisari Augusto
  rationale: παρά pamoja na umilikishi huonyesha chanzo; katika Kiswahili, amri “kutolewa na” mtu ni njia ya asili ya kuonyesha chanzo au mtoaji.
- source_word: ἀπογράφεσθαι
  choice: uandikishwe
  rationale: Kitenzi kinamaanisha kuingizwa katika orodha rasmi, mara nyingi kwa sensa au kodi; “uandikishwe” hakiongezi kusudi ambalo mstari huu haulitaji wazi.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: ulimwengu wote wenye watu
  rationale: Huhifadhi maana ya msingi ya eneo lote linalokaliwa na watu bila kulifafanua moja kwa moja kuwa Dola ya Roma; tanbihi inaeleza maana ya kimuktadha.
theological_decisions:
- issue: Upeo wa οἰκουμένη
  choice: ulimwengu wote wenye watu
  alternative: ulimwengu wote wa Roma; dola yote
  rationale: Hili hasa ni suala la kihistoria na kileksika. Tafsiri kuu inadumisha upana wa neno la Kigiriki, huku tanbihi ikihifadhi uwezekano wa maana yake katika muktadha wa utawala wa Roma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “Ikawa ... ikatolewa” unaendeleza simulizi kwa njia ya asili; msamiati unabaki wazi kwa msomaji wa kawaida bila kuondoa upeo wenye utata wa οἰκουμένη.
