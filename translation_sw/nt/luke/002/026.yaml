lexical_decisions:
- source_word: κεχρηματισμένον
  choice: alikuwa amefunuliwa
  rationale: Kitenzi hiki katika hali ya kutendwa kinaonyesha kwamba alikuwa amepokea ufunuo wa kimungu. “Alikuwa amefunuliwa” huhifadhi hali hiyo ya kutendwa na maana ya ufunuo.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: na Roho Mtakatifu
  rationale: Ὑπό pamoja na genitivi humtaja mtendaji; “na Roho Mtakatifu” humtambulisha Roho waziwazi kuwa chanzo na mtendaji wa ufunuo.
- source_word: μὴ ἰδεῖν θάνατον
  choice: hataona mauti
  rationale: Huhifadhi taswira halisi ya nahau ya Kigiriki, “kuona mauti,” badala ya kuifafanua tu kuwa “hatakufa.” “Mauti” ni neno la heshima na linaloeleweka katika sajili ya Maandiko.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: kabla hajamwona
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kuona Masihi kungetangulia kuona mauti, huku ukidumisha uhusiano wa tukio la baadaye uliopo katika Kigiriki.
- source_word: τὸν χριστὸν κυρίου
  choice: Masihi wa Bwana
  rationale: Χριστός hapa ni cheo cha kimasiya, kwa hiyo “Masihi” hudumisha muktadha wake wa Kiyahudi. “Wa Bwana” huhifadhi genitivi κυρίου bila kuamua kwa undani kama inaonyesha milki, uteuzi, au utumaji.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός inapotumiwa kama cheo cha kimasiya
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός inafanya kazi kama cheo, si kama jina lililozoeleka. “Masihi” huonyesha wazi maana ya Mpakwa-Mafuta, huku tafsiri ya kimapokeo “Kristo wa Bwana” ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuona mauti” hudumisha taswira ya chanzo huku “kabla hajamwona” ikiwa ya kawaida na wazi kwa msomaji wa leo.
