  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: sw
  text: Naye Roho Mtakatifu alikuwa amemfunulia kwamba hataona mauti kabla hajamwona Masihi wa Bwana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo zaidi, “Kristo wa Bwana.”
