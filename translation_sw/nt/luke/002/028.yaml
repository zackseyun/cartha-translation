  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: sw
  text: Naye akampokea mikononi mwake, akambariki Mungu, akasema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamchukua mikononi mwake.” Kitenzi cha Kigiriki kinaweza kumaanisha “kupokea” au “kukaribisha”; lakini kirai kinachofuata, “mikononi mwake,” hufanya maana ya kimwili “akamchukua” ifae katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: akampokea
  rationale: Kitenzi δέχομαι kimsingi humaanisha ‘kupokea’ au ‘kukaribisha.’ Pamoja na kirai kinachofuata kuhusu mikono, hapa kinaonyesha Simeoni akimpokea mtoto mikononi mwake; ‘akampokea’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: αὐτό
  choice: -m- (katika akampokea)
  rationale: Ingawa kiwakilishi cha Kigiriki ni cha jinsia ya kisarufi isiyo ya kiume wala ya kike, kinamrejelea mtoto Yesu; kiambishi cha mtu ‘-m-’ ndicho cha kawaida na kisichopotosha katika Kiswahili.
- source_word: εἰς τὰς ἀγκάλας
  choice: mikononi mwake
  rationale: Kirai hiki humaanisha mikono inayotumika kumkumbatia au kumbeba mtu. ‘Mikononi mwake’ ni usemi wa asili wa Kiswahili katika muktadha huu; umilikaji unaeleweka kutokana na muktadha ingawa haujaonyeshwa wazi kwa kiwakilishi katika Kigiriki.
- source_word: εὐλόγησεν τὸν θεόν
  choice: akambariki Mungu
  rationale: εὐλογέω ikiwa Mungu ndiye mtendewa ina maana ya kumbariki au kumsifu Mungu. ‘Akambariki Mungu’ huhifadhi kitenzi cha chanzo na usemi wa kibiblia unaoeleweka.
- source_word: καὶ εἶπεν
  choice: akisema
  rationale: Katika Kiswahili, ‘akisema’ huunganisha kwa kawaida tendo hili na maneno yanayofuata, huku ikihifadhi mwendelezo wa simulizi unaoonyeshwa na καί.
- source_word: αὐτός
  choice: naye
  rationale: ‘Naye’ huendeleza mhusika na kudokeza msisitizo mdogo wa αὐτός bila kuutia chumvi kwa kusema ‘yeye mwenyewe.’
theological_decisions:
- issue: Mrejelewa wa kiwakilishi cha Kigiriki αὐτό
  choice: Kimeonyeshwa kama rejeo la mtu kwa kiambishi ‘-m-’ katika ‘akampokea,’ kikimrejelea mtoto Yesu.
  alternative: Kukifuata kijinsia ya kisarufi kwa namna isiyo ya kawaida au kumrejelea mtoto kama kitu.
  rationale: Jinsia ya kisarufi ya kiwakilishi hufuata nomino ya Kigiriki inayomaanisha mtoto, lakini mrejelewa ni Yesu kama mtu. Kiswahili hutumia ngeli ya mtu hapa, bila kuongeza dai la kitheolojia lisilokuwamo katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. ‘Naye’ na mfululizo wa vitenzi vya -ka- hudumisha simulizi fupi na lenye mshikamano. Alama ya tanbihi [a] imewekwa baada ya kish句 cha utangulizi wa maneno yanayofuata.
