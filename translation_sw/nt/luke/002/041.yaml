  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: sw
  text: Wazazi wake walikuwa wakienda Yerusalemu kila mwaka kwa ajili ya Sikukuu ya Pasaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: walikuwa wakienda
  rationale: Kauli ya wakati uliopita isiotimilifu hapa inaonyesha desturi iliyojirudia. Muundo huu wa Kiswahili, pamoja na “kila mwaka,” unaonyesha kwa kawaida tendo lao la mara kwa mara.
- source_word: γονεῖς
  choice: wazazi
  rationale: Nomino hii ya wingi humaanisha wazazi na ndiyo tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: κατ’ ἔτος
  choice: kila mwaka
  rationale: Nahau hii ina maana ya mwaka baada ya mwaka; “kila mwaka” ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la tendo linalojirudia kila mwaka.
- source_word: Ἰερουσαλὴμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: τῇ ἑορτῇ
  choice: kwa ajili ya Sikukuu
  rationale: Katika muktadha wa safari, hali ya dative inaonyesha tukio au kusudi la kwenda kwao. “Kwa ajili ya Sikukuu” huwasilisha jambo hilo wazi na kwa lugha ya kawaida.
- source_word: τοῦ πάσχα
  choice: ya Pasaka
  rationale: πάσχα ni jina la sikukuu ya Kiyahudi ya Pasaka; “Sikukuu ya Pasaka” ni usemi wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kuwataja watu wa familia ya Yesu
  choice: wazazi wake
  alternative: baba yake na mama yake
  rationale: Kigiriki kinasema “wazazi wake.” Tafsiri hii huhifadhi maana ya wazi ya simulizi bila kuingiza hitimisho la kiteolojia au kuondoa mvutano unaoweza kuonekana kwa kuzingatia habari ya kuzaliwa kwa Yesu katika sehemu nyingine ya Luka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Hakuna tanbihi inayohitajika.
