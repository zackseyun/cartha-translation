translation:
  language: sw
  text: Baba yake na mama yake walikuwa wakistaajabia mambo yaliyokuwa yakisemwa kumhusu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “baba yake.” Hapa humrejelea Yosefu katika maana ya kawaida ya kifamilia na kisheria. Baadhi ya tafsiri husema “Yosefu na mama yake” ili kuzuia kutoeleweka kwa kuzingatia simulizi la awali la Luka kuhusu kutungwa kwa Yesu katika tumbo la bikira.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba yake
  rationale: Hutafsiri moja kwa moja maneno ya Kigiriki bila kuyabadilisha kuwa “Yosefu.” Katika simulizi, Yosefu anaitwa baba yake kwa maana ya kawaida ya kifamilia na kisheria.
- source_word: μήτηρ
  choice: mama yake
  rationale: Ni tafsiri ya kawaida na ya asili ya μήτηρ, ikikamilisha jozi “baba yake na mama yake.”
- source_word: θαυμάζοντες
  choice: walikuwa wakistaajabia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita na kudumisha maana ya mshangao wenye kuvutiwa.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: mambo yaliyokuwa yakisemwa
  rationale: Huhifadhi wingi wa muundo wa Kigiriki pamoja na hali ya kutendwa na tendo linaloendelea wakati uliopita.
- source_word: περὶ αὐτοῦ
  choice: kumhusu
  rationale: Ni usemi wa Kiswahili sanifu na wa kawaida unaowasilisha maana ya “juu yake/kumhusu.”
theological_decisions:
- issue: Kumtaja Yosefu kama “baba yake” katika muktadha unaothibitisha kutungwa kwa Yesu na bikira
  choice: Kutafsiri maneno ya matini kama “baba yake” na kueleza maana ya kifamilia/kisheria katika tanbihi.
  alternative: “Yosefu na mama yake” au “baba yake, yaani Yosefu” katika matini kuu.
  rationale: Matini ya Kigiriki inasema wazi “baba yake.” Luka anaweza kutumia lugha ya kawaida ya kifamilia kuhusu Yosefu bila kukanusha habari yake ya awali kuhusu kutungwa kwa Yesu na bikira. Kubadili jina katika matini kuu kungeondoa mvutano ambao chanzo chenyewe hakiondoi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walikuwa wakistaajabia” huhifadhi hali ya tendo linaloendelea; “mambo yaliyokuwa yakisemwa” huakisi wingi na hali ya kutendwa katika Kigiriki.
