lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti mdogo kati ya mwitikio wa watu waliostaajabu na mwitikio wa ndani wa Maria, huku ikiendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: Μαρία
  choice: Maria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: συνετήρει
  choice: aliendelea kuyahifadhi
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea; ‘kuyahifadhi’ linaonyesha kuweka kwa uangalifu, si kukumbuka tu.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: maneno haya yote
  rationale: ῥήματα katika muktadha huu hasa ni maneno au ujumbe uliosimuliwa na wachungaji; πάντα huonyesha ujumla wake wote.
- source_word: συμβάλλουσα
  choice: akiyatafakari
  rationale: Kitenzi hiki kinaeleza kuyakusanya au kuyalinganisha mawazoni ili kuyafikiria kwa makini; ‘akiyatafakari’ ni Kiswahili cha asili kinachobakiza wazo la mchakato wa ndani.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: moyoni mwake
  rationale: Inahifadhi sitiari ya kibiblia ya moyo kama mahali pa fikira, tafakari, na hisia za ndani.
theological_decisions:
- issue: Hali ya mwitikio wa Maria
  choice: Maria aliyahifadhi kwa uangalifu na kuyatafakari maneno hayo moyoni mwake.
  alternative: Maria alikumbuka matukio tu, au alikuwa tayari ameyaelewa kikamilifu.
  rationale: Matini inaonyesha kuhifadhi na kutafakari kwa kuendelea, lakini haisemi kwamba Maria alikuwa tayari ameelewa kila kitu kikamilifu. Tafsiri haiongezi hitimisho hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘aliendelea kuyahifadhi’ unaonyesha tendo endelevu, na ‘moyoni mwake’ inadumisha sitiari ya chanzo bila kufanya sentensi kuwa ngumu.
