lexical_decisions:
- source_word: ἐξαίφνης
  choice: Ghafla
  rationale: Inaonyesha tukio lililotokea bila kutarajiwa na kuhifadhi mshangao wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἐγένετο
  choice: kukawa na
  rationale: Katika muundo huu wa kuwepo, kitenzi kinatambulisha kuwapo kwa kundi hilo bila kulazimisha maana ya kwamba lilionekana kwa macho.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: pamoja na yule malaika
  rationale: Huhifadhi maana ya kuandamana; 'yule malaika' humrejelea malaika ambaye tayari ametajwa katika muktadha.
- source_word: πλῆθος
  choice: umati
  rationale: Hueleza idadi kubwa kwa lugha ya asili na yenye hadhi.
- source_word: στρατιᾶς οὐρανίου
  choice: wa jeshi la mbinguni
  rationale: Huhifadhi taswira ya kijeshi ya στρατιά pamoja na asili yake ya mbinguni, bila kuibadili kuwa kauli ya jumla tu kuhusu malaika.
- source_word: αἰνούντων
  choice: wakimsifu
  rationale: Kirai cha wakati mmoja kinaonyesha shughuli ya kundi hilo; kiambishi cha umoja katika 'Mungu' kinaonyeshwa kiasili kwa 'm-'.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya tendo la kusifu na tafsiri ya kawaida ya θεός katika muktadha huu.
- source_word: καὶ λεγόντων
  choice: na kusema
  rationale: Huunganisha tendo la kusema na kusifu na kutanguliza maneno yanayofuata katika mstari unaofuata.
theological_decisions:
- issue: Tafsiri ya στρατιᾶς οὐρανίου
  choice: jeshi la mbinguni
  alternative: majeshi ya mbinguni
  rationale: Umoja wa neno la Kigiriki na kirai cha umiliki vinaakisiwa vizuri kwa 'jeshi la mbinguni.' Tafsiri hii huhifadhi maana ya kundi la mbinguni lenye mpangilio na taswira ya kijeshi, huku muktadha ukionyesha kwamba hapa linasifu badala ya kupigana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili huku muundo wa simulizi, taswira ya jeshi, na kishiriki kinachotambulisha sifa vikihifadhiwa.
