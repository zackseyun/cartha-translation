base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: sw
  text: Saa hiyohiyo[a], alipofika pale, alimshukuru Mungu[b] na kusema habari zake[c] kwa wote waliokuwa wakingojea ukombozi wa Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Saa ileile.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akimshukuru Mungu” au “alikuwa akimsifu Mungu.”
    reason: lexical_alternative
  - marker: c
    text: Kiwakilishi “zake” kwa kawaida zaidi kinamrejelea mtoto Yesu katika muktadha huu, ingawa Mungu ndiye aliyetajwa wazi karibu zaidi katika Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: Saa ileile
  rationale: Kirai cha wakati chenye msisitizo kinaonyesha kwamba jambo hilo lilitokea wakati huohuo; “ileile” huhifadhi nguvu ya αὐτῇ kwa Kiswahili cha kawaida.
- source_word: ἐπιστᾶσα
  choice: akaja karibu
  rationale: Kitenzi hiki hapa kinaeleza kufika au kukaribia eneo hilo wakati huo, bila kubainisha namna ya kuja.
- source_word: ἀνθωμολογεῖτο
  choice: akaanza kumshukuru
  rationale: Kitenzi kinaweza kumaanisha kutoa shukrani au sifa kwa Mungu. “Akaanza” huonyesha kwa kawaida kuingia katika tendo hilo baada ya kufika, ingawa hali ya kutokamilika pia inaweza kueleweka kama tendo lililoendelea.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Katika Kiswahili, kiambishi cha yambwa katika “kumshukuru” tayari huonyesha anayepokea shukrani, hivyo “Mungu” ni uwasilishaji wa kawaida wa dative ya Kigiriki.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: na kusema habari zake
  rationale: Huhifadhi kiwakilishi kisichotaja wazi mhusika wake, kama Kigiriki, na huonyesha tendo lililoendelea bila kukibadilisha kuwa jina la Yesu au Mungu.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: kwa wote waliokuwa wakingojea
  rationale: “Wakingojea” huwasilisha matarajio yenye tumaini yanayobebwa na προσδέχομαι katika muktadha wa Luka.
- source_word: λύτρωσιν
  choice: ukombozi
  rationale: “Ukombozi” huhifadhi maana ya kuachiliwa au kuokolewa pamoja na uzito wake wa wokovu, bila kuufanya uwe wa kisiasa au wa kiroho pekee.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili cha Biblia.
theological_decisions:
- issue: Mhusika anayerejelewa na αὐτοῦ katika “kusema habari zake”
  choice: Kiwakilishi kimehifadhiwa kama “zake,” huku muktadha ukielekeza kwa mtoto Yesu.
  alternative: Kisarufi, msomaji anaweza kukielewa kuwa kinamrejelea Mungu, ambaye ametajwa mara moja kabla yake.
  rationale: Masimulizi yanamlenga mtoto Yesu, na ujumbe kwa waliokuwa wakingojea ukombozi kwa kawaida unamhusu yeye; hata hivyo, kutotaja jina katika matini kuu huhifadhi utata halisi wa Kigiriki.
- issue: Maana ya “ukombozi wa Yerusalemu”
  choice: Kirai kimehifadhiwa bila kukipanua au kukifafanua zaidi.
  alternative: “Kuokolewa kwa Yerusalemu” au ufafanuzi unaolenga ukombozi wa kisiasa, wa kiroho, au wa watu wa Mungu.
  rationale: Kirai kinaweza kujumuisha tendo la Mungu la kuwaokoa watu wake linalohusishwa na Yerusalemu, likiwa na maana ya kijumuiya na ya tumaini la wakati ujao. Tafsiri haibani upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Mtindo wa masimulizi wenye mfululizo wa “aka-” ni wa kawaida na unaeleweka kwa urahisi. Viashiria vyote vya tanbihi [a], [b], na [c] vimewekwa katika matini kuu.
