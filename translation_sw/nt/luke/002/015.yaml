  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: sw
  text: Ikawa, malaika walipoondoka kwa wachungaji kwenda mbinguni, wachungaji wakaambiana, “Twende sasa mpaka Bethlehemu[a], tukaone jambo hili lililotokea[b], ambalo Bwana ametujulisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda Bethlehemu”; Kigiriki husema kihalisi zaidi “mpaka/hadi Bethlehemu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “neno hili lililotokea”; neno la Kigiriki ῥῆμα linaweza kumaanisha “neno,” “jambo,” au “tukio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuendeleza simulizi; “Ikawa” huihifadhi kwa lugha fupi, yenye hadhi, bila kutumia mtindo wa kizamani kupita kiasi.
- source_word: ὡς
  choice: walipo-
  rationale: Kiambishi hiki kinaonyesha wakati wa kuondoka kwa malaika kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: walipoondoka kwao kwenda mbinguni
  rationale: Huhifadhi kuondoka kwa malaika kutoka mahali walipokuwa wachungaji na kuelekea mbinguni; “mbinguni” hapa huelekeza kwenye makao ya Mungu, si anga tu.
- source_word: οἱ ἄγγελοι
  choice: malaika
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya nomino hii.
- source_word: οἱ ποιμένες
  choice: wachungaji
  rationale: Ni tafsiri ya kawaida inayowatambulisha wasemaji.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: wakaambiana
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kusema wao kwa wao na hutambulisha usemi wa moja kwa moja.
- source_word: Διέλθωμεν
  choice: Twende
  rationale: Hii ni kauli ya kuhimizana; “Twende” ni sawa ya asili kuliko tafsiri ya neno kwa neno kama “tupitie.”
- source_word: δή
  choice: sasa
  rationale: Huwasilisha msisitizo na uharaka unaoletwa na chembe hii.
- source_word: ἕως Βηθλέεμ
  choice: mpaka Bethlehemu
  rationale: “Mpaka” huhifadhi wazo la kufika hadi mahali hapo, huku sentensi ikiendelea kuwa ya kawaida katika Kiswahili.
- source_word: ἴδωμεν
  choice: tukaone
  rationale: Huiunganisha kwa kawaida na mwito “Twende” na kuhifadhi kusudi la safari.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: jambo hili lililotokea
  rationale: Katika muktadha huu ῥῆμα hurejelea jambo au tukio lililotangazwa, si maneno yaliyosemwa pekee; tanbihi huhifadhi uwezekano wa maana “neno.”
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: ambalo Bwana ametujulisha
  rationale: “Ametujulisha” huhifadhi maana ya kufanya jambo lijulikane bila kulifanya kuwa istilahi maalumu ya ufunuo.
theological_decisions:
- issue: Anayerejelewa na ὁ κύριος
  choice: Bwana
  alternative: Mungu
  rationale: Muktadha unaonyesha Mungu kuwa chanzo cha ujumbe uliotolewa na malaika, lakini “Bwana” huhifadhi jina la maandishi na mvutano wa kitheolojia katika simulizi la Luka bila kubainisha zaidi ya maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Wakaambiana” na “tukaone” ni maumbo ya kawaida yanayounganisha matendo kwa ufasaha; “Ikawa” huhifadhi mtindo wa simulizi wa Luka.
