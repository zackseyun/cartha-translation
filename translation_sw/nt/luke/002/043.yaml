base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: sw
  text: Nao walipomaliza siku zile, walipokuwa wakirudi, Yesu, yule mvulana, alibaki[a] Yerusalemu, na wazazi wake[b] hawakujua jambo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alibaki nyuma.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “wazazi wake.” Lugha ya kawaida ya kifamilia anayotumia Luka hapa haikanushi simulizi la awali katika Injili kuhusu Maria kupata mimba ya Yesu akiwa bikira.'
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: walipomaliza siku zile
  rationale: Huwasilisha hali iliyokamilika kabla ya tendo kuu na kuhifadhi rejeo la siku zilizotajwa katika muktadha bila kuongeza wazi kuwa ni siku za sikukuu.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: walipokuwa wakirudi
  rationale: Muundo huu huonyesha tendo lililokuwa likiendelea wakati Yesu alipobaki Yerusalemu.
- source_word: ὑπέμεινεν
  choice: alibaki
  rationale: Katika muktadha huu kitenzi humaanisha kubaki mahali baada ya wengine kuondoka; ‘alibaki nyuma’ limehifadhiwa kama mbadala katika tanbihi.
- source_word: ὁ παῖς
  choice: yule mvulana
  rationale: παῖς inaweza kumaanisha mtoto au mvulana; kwa kuwa Yesu ana umri wa miaka kumi na miwili katika muktadha wa karibu, ‘mvulana’ ni neno la kawaida na linalofaa umri huo.
- source_word: ἐν Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Kiswahili cha kawaida hakihitaji kihusishi baada ya ‘alibaki’; mahali panaeleweka moja kwa moja.
- source_word: οὐκ ἔγνωσαν
  choice: hawakujua
  rationale: Hapa γινώσκω hueleza kutofahamu kwamba Yesu alikuwa amebaki. Kiswahili kinaweza kuacha kijalizo hicho kieleweke kutokana na sentensi iliyotangulia.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: wazazi wake
  rationale: Hili ndilo maana ya moja kwa moja ya γονεῖς na linahifadhi lugha ya kawaida ya kifamilia iliyotumiwa na Luka.
theological_decisions:
- issue: Kutajwa kwa Maria na Yosefu kuwa γονεῖς wa Yesu
  choice: wazazi wake
  alternative: baba yake na mama yake
  rationale: Neno la Kigiriki linasema moja kwa moja ‘wazazi wake.’ Tafsiri hii inadumisha usemi wa Luka bila kuondoa mvutano na simulizi lake la awali kuhusu kutungwa kwa Yesu na bikira.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Nao’ huendeleza mtiririko wa simulizi; ‘siku zile’ huhifadhi usemi wa chanzo bila kuufafanua kupita kiasi. Alama za tanbihi zimewekwa baada ya ‘Yerusalemu’ kwa mbadala wa ‘alibaki’ na baada ya ‘wazazi wake’ kwa ufafanuzi wa kitheolojia.
