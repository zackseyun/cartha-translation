  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa simulizi, huku ukihifadhi uhusiano wa vitendo katika Kigiriki na alama ya tanbihi [a] katika matini kuu.
