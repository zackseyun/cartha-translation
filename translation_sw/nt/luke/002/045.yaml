base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: sw
  text: Nao walipomkosa[a], walirudi Yerusalemu wakimtafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao, bila kumpata, walirudi Yerusalemu wakimtafuta.”
    reason: Mbadala huu huonyesha kwa karibu zaidi kirai cha Kigiriki cha hali, bila kuongeza uhusiano wa kisababishi usioelezwa wazi.
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza mtiririko sahili wa simulizi bila kuongeza hitimisho la wakati lisilosemwa wazi.
- source_word: μὴ εὑρόντες
  choice: walipomkosa
  rationale: Kirai hiki cha hali kinaonyesha kwamba walirudi baada ya kutofanikiwa kumpata; “walipomkosa” ni Kiswahili cha kawaida na chenye maana hiyo ya kimazingira.
- source_word: ὑπέστρεψαν
  choice: walirudi
  rationale: Kitenzi kina maana ya kurudi au kwenda tena mahali walikotoka; “walirudi” ni cha asili na wazi.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Katika Kiswahili, kitenzi “kurudi” kinaweza kufuatwa moja kwa moja na jina la mahali bila kihusishi; umbo hili ni la kawaida na halipotezi maana ya kuelekea mjini humo.
- source_word: ἀναζητοῦντες
  choice: wakimtafuta
  rationale: Kitenzi hiki kinaonyesha juhudi endelevu za kumtafuta; “wakimtafuta” huhifadhi kitendo kinachoandamana na kurudi kwao.
- source_word: αὐτόν
  choice: -m-
  rationale: Kiambishi cha yambwa katika “wakimtafuta” kinamrejelea Yesu kwa usahihi na kwa mtindo wa kawaida wa Kiswahili.
theological_decisions: []
