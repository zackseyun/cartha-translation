lexical_decisions:
- source_word: αὕτη
  choice: huu
  rationale: Kiwakilishi kionyeshi kinarejelea uandikishaji uliotajwa katika mstari uliotangulia; kinakubaliana na nomino ya ngeli ya U.
- source_word: ἀπογραφή
  choice: uandikishaji
  rationale: Neno hili linaonyesha kusajiliwa rasmi kwa watu, mara nyingi kwa kusudi la kodi au sensa. “Uandikishaji” linahifadhi maana pana ya kiutawala bila kuibana kuwa kuhesabu watu pekee.
- source_word: πρώτη
  choice: kwanza
  rationale: Maana ya kawaida ya kivumishi hiki ni ya mpangilio, “kwanza.” Kwa kuwa muundo na historia ya kifungu hiki vinajadiliwa, maana ya “kabla” imehifadhiwa katika tanbihi.
- source_word: ἐγένετο
  choice: ulifanyika
  rationale: Ni Kiswahili cha kawaida na cha heshima kwa tukio la kiutawala lililotokea au kutekelezwa.
- source_word: ἡγεμονεύοντος
  choice: wakati ... alipokuwa akiitawala
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uandikishaji ulipofanyika, bila kulazimisha cheo maalumu ambacho kitenzi cha Kigiriki hakitaji wazi.
- source_word: τῆς Συρίας
  choice: Siria
  rationale: Hili ndilo jina la kawaida la Kiswahili la eneo hilo.
- source_word: Κυρηνίου
  choice: Kirenio
  rationale: Ni umbo la jina linalofaa katika mapokeo ya majina ya Biblia kwa Kiswahili na linaakisi jina la Kigiriki Κυρήνιος.
theological_decisions:
- issue: Maana ya πρώτη katika kifungu kinachobishaniwa kihistoria na kisintaksia
  choice: 'Kutafsiri πρώτη kuwa “kwanza” katika matini kuu: “Uandikishaji huu ulifanyika kwanza wakati Kirenio alipokuwa akiitawala Siria.”'
  alternative: “Uandikishaji huu ulifanyika kabla Kirenio hajawa akiitawala Siria.”
  rationale: Maana ya moja kwa moja na ya kawaida ni ya mpangilio, “kwanza.” Hata hivyo, kwa kuwa baadhi huelewa neno hilo kwa maana linganishi ya wakati, uwezekano huo haujafutwa bali umewekwa katika tanbihi. Tafsiri haijaribu kutatua kimya kimya ugumu wa kihistoria wa mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akiitawala Siria” ni cha kawaida zaidi kuliko kutumia cheo maalumu kama “liwali” au “gavana,” na hivyo huhifadhi upana wa kitenzi cha Kigiriki. Alama za tanbihi zote zimewekwa katika matini kuu.
