  text: (Uandikishaji huu ulifanyika kwanza wakati Kirenio alipokuwa akitawala Siria[a][b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uandikishaji huu ulifanyika kabla Kirenio hajaitawala Siria.” Baadhi ya watu hulielewa neno “kwanza” hapa kwa maana linganishi ya wakati.
