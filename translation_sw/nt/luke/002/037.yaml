  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: sw
  text: Naye alikuwa mjane mpaka alipofikia umri wa miaka themanini na minne[a]. Hakuondoka hekaluni[b], akimwabudu Mungu kwa kufunga na maombi[c] usiku na mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye alikuwa mjane kwa miaka themanini na minne.” Kigiriki kinaweza kueleweka kuwa kinataja ama umri wa Ana ama muda aliokuwa mjane.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki hapa linamaanisha eneo lote la hekalu na viwanja vyake, si jengo la patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: c
    text: Au, “maombi ya kusihi” au “maombi ya kuomba mahitaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: mjane
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mwanamke ambaye mume wake amekufa; hapa linaendeleza maelezo ya hali ya Ana baada ya ndoa yake.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: mpaka alipofikia umri wa miaka themanini na minne
  rationale: Muundo huu unaweza kutaja umri wa Ana au muda aliokuwa mjane. Tafsiri kuu inautaja umri wake kwa Kiswahili cha kawaida, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: Hakuondoka hekaluni
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha desturi iliyoendelea. Usemi huu wa Kiswahili ni wa kawaida na unaonyesha kwamba aliendelea kuwapo katika eneo la hekalu.
- source_word: ἱεροῦ
  choice: hekaluni
  rationale: Neno ἱερόν linamaanisha eneo lote la hekalu, si patakatifu pa ndani pekee. Neno la kawaida limetumiwa katika matini, na ufafanuzi umetolewa katika tanbihi.
- source_word: νηστείαις
  choice: kwa kufunga
  rationale: Ingawa Kigiriki kina wingi, Kiswahili hutumia kwa kawaida kitenzi-jina hiki kueleza desturi ya kufunga mara kwa mara.
- source_word: δεήσεσιν
  choice: dua
  rationale: Neno hili huhusu maombi yenye kusihi au kuomba jambo fulani. “Dua” ni neno la sasa na linaloeleweka, huku maana mahususi zaidi ikitajwa katika tanbihi.
- source_word: λατρεύουσα
  choice: alimwabudu Mungu
  rationale: Kitenzi hiki kinaonyesha huduma ya kidini au ibada inayotolewa kwa Mungu. Kutaja Mungu, ambaye ndiye mlengwa anayodokezwa katika muktadha, kunafanya Kiswahili kiwe wazi na cha kawaida.
- source_word: νύκτα καὶ ἡμέραν
  choice: usiku na mchana
  rationale: Huu ni msemo wa kawaida unaoonyesha kujitoa kwa kuendelea, na unahifadhi mpangilio wa maneno ya Kigiriki.
theological_decisions:
- issue: Je, miaka themanini na minne ni umri wa Ana au muda wa ujane wake?
  choice: Matini kuu inaeleza kwamba Ana alikuwa na umri wa miaka themanini na minne.
  alternative: Inawezekana pia kwamba alikuwa amekaa miaka themanini na minne akiwa mjane.
  rationale: Muundo wa Kigiriki unaruhusu maana zote mbili. Hili ni suala la kisarufi na kiufafanuzi, si tofauti ya mafundisho; kwa hiyo maana mbadala imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Hekaluni” limeachwa katika matini kwa ufasaha, huku upeo wa ἱερόν ukifafanuliwa katika tanbihi. Mwanzo wa herufi ndogo unaakisi kwamba mstari huu unaendeleza sentensi iliyoanza katika mstari uliotangulia.
