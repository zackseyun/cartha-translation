  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: sw
  text: 'kama ilivyoandikwa katika Sheria ya Bwana: “Kila mtoto wa kiume anayefungua tumbo la uzazi ataitwa mtakatifu kwa Bwana.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila wa kiume anayefungua tumbo la uzazi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mzaliwa wa kwanza wa kiume huhesabiwa kuwa mtakatifu, au aliyewekwa wakfu, kwa Bwana; linganisha Kutoka 13:2, 12.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha kwamba tendo hilo linapatana na yaliyoandikwa; ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Huhifadhi kauli ya kawaida ya kunukuu Maandiko na wazo la maandishi yenye mamlaka inayoendelea.
- source_word: ἐν νόμῳ κυρίου
  choice: katika Sheria ya Bwana
  rationale: Neno νόμος hapa linamaanisha Sheria ya Musa kama maandiko yenye mamlaka; herufi kubwa katika “Sheria” huonyesha mkusanyo huo maalumu.
- source_word: ὅτι
  choice: ':'
  rationale: Katika Kiswahili, nukta mbili huingiza kwa kawaida na kwa uwazi yaliyomo katika nukuu baada ya “ilivyoandikwa,” bila kupoteza kazi ya ὅτι.
- source_word: Πᾶν ἄρσεν
  choice: Kila mtoto wa kiume
  rationale: Ingawa Kigiriki kinasema moja kwa moja “kila wa kiume,” muktadha na kirai kinachofuata vinahusu mtoto wa kwanza kuzaliwa; “mtoto wa kiume” ni Kiswahili cha asili na huweka wazi maana bila kubadili jinsia iliyotajwa.
- source_word: διανοῖγον μήτραν
  choice: anayefungua tumbo la uzazi
  rationale: Huhifadhi kwa karibu nahau ya kibiblia inayomaanisha mzaliwa wa kwanza wa kiume, huku “tumbo la uzazi” likiwa wazi kuliko “tumbo” peke yake.
- source_word: ἅγιον
  choice: mtakatifu
  rationale: Huhifadhi moja kwa moja lugha ya utakatifu badala ya kuibadili kuwa tafsiri ya maana kama “aliyewekwa wakfu.”
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: Hueleza uhusiano wa kuwekwa wakfu au kuwa mali ya Bwana kwa Kiswahili cha kawaida, huku maana kamili ikifafanuliwa katika tanbihi.
- source_word: κληθήσεται
  choice: ataitwa
  rationale: Ni tafsiri ya moja kwa moja ya wakati ujao katika hali tendwa na inafaa katika nukuu ya kisheria.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu kutoka Sheria ya Israeli
  choice: Bwana
  alternative: BWANA
  rationale: Chanzo cha moja kwa moja cha tafsiri ni Kigiriki κύριος. “Bwana” huhifadhi ushahidi wa maandishi ya Kigiriki bila kurudisha kimyakimya jina la Mungu lililo katika chanzo cha Kiebrania.
- issue: Lugha ya utakatifu dhidi ya lugha ya kuwekwa wakfu
  choice: mtakatifu kwa Bwana
  alternative: aliyewekwa wakfu kwa Bwana
  rationale: ἅγιον ni “takatifu”; hivyo matini kuu inadumisha istilahi ya utakatifu na tanbihi inaeleza maana yake ya kuwekwa wakfu katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa nukuu ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Nukta mbili huingiza nukuu kwa mtiririko wa asili. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
