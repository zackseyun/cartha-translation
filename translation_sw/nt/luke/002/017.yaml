  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: sw
  text: Nao walipomwona, walifanya ujumbe waliokuwa wameambiwa kuhusu mtoto huyu ujulikane.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno,” “kauli,” au “jambo” walilokuwa wameambiwa kuhusu mtoto huyu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipomwona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinatangulia tendo kuu; ‘walipomwona’ ni Kiswahili cha kawaida na humtaja mtoto kama yule aliyeonekana kwa kuzingatia muktadha.
- source_word: δὲ
  choice: Nao
  rationale: Hiki ni kiunganishi hafifu kinachoendeleza simulizi bila kuonyesha upinzani mkali.
- source_word: ἐγνώρισαν
  choice: wakaujulisha
  rationale: γνωρίζω hapa humaanisha kufanya jambo lijulikane. ‘Wakaujulisha’ huhifadhi nguvu hiyo bila kudokeza tangazo rasmi.
- source_word: περὶ τοῦ ῥήματος
  choice: ujumbe
  rationale: ῥῆμα inaweza kumaanisha neno, kauli, jambo, au ujumbe; hapa inarejelea yaliyosemwa kwa wachungaji kuhusu mtoto.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: waliokuwa wameambiwa
  rationale: Huhifadhi wazo la kauli iliyotolewa kwao kabla ya wao kuieneza, kwa lugha ya Kiswahili iliyo ya kawaida.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: kuhusu mtoto huyu
  rationale: παιδίον humaanisha mtoto au mtoto mdogo; ‘mtoto huyu’ ni sahihi na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Maana ya ῥῆμα kuhusiana na tangazo la malaika
  choice: ujumbe
  alternative: neno; kauli; jambo
  rationale: ‘Ujumbe’ huwasilisha wazi maudhui ambayo wachungaji waliambiwa kuhusu Yesu bila kuongeza maana maalumu ya kidhehebu. Tanbihi huhifadhi uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘Nao walipomwona’ unaendeleza simulizi kwa kawaida; kiambishi cha yambwa katika ‘wakaujulisha’ kinarejelea ujumbe.
