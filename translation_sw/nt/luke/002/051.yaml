base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: sw
  text: Akashuka pamoja nao, akaenda Nazareti, na alikuwa akiwatii[a]. Mama yake aliendelea kuyahifadhi mambo hayo yote[b] moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kigiriki inaonyesha utii uliokuwa ukiendelea; pia inaweza kutafsiriwa, “alikuwa akijitiisha kwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maneno hayo yote.” Neno la Kigiriki linaweza kumaanisha maneno, kauli, au mambo yanayosimuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: akashuka
  rationale: Kitenzi hiki kinahifadhi maana ya kushuka kutoka Yerusalemu kuelekea Nazareti, bila kutumia neno rasmi kupita kiasi.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: Hii ni njia ya kawaida na ya wazi ya kuonyesha kuandamana nao.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: akaenda Nazareti
  rationale: Katika mwelekeo huu wa simulizi, ἔρχομαι inaeleweka kiasili kama kwenda; muundo wa mfululizo ‘akaenda’ unaunganisha matendo kwa Kiswahili fasaha.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: alikuwa akiwatii
  rationale: Muundo huu unaonyesha hali na tendo lililoendelea. ‘Kuwatii’ ni Kiswahili cha kawaida kinachowasilisha kujitiisha kwa hiari katika uhusiano huu wa mtoto na wazazi.
- source_word: διετήρει
  choice: akayaweka
  rationale: διατηρέω hapa ni kuhifadhi kwa makini katika kumbukumbu. Pamoja na ‘moyoni mwake,’ ‘akayaweka’ ni ya asili na haiongezi tafsiri ya kihisia isiyosemwa wazi.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: mambo hayo yote
  rationale: Katika muktadha huu ῥήματα inaweza kumaanisha maneno yaliyosemwa au matukio/mambo yaliyosimuliwa. ‘Mambo hayo yote’ ni ya kawaida kwa Kiswahili na huhifadhi upana wa rejeo.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: moyoni mwake
  rationale: Hii huhifadhi sitiari ya chanzo kuhusu kumbukumbu na tafakari ya ndani kwa usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uhusiano wa Yesu na wazazi wake wa duniani
  choice: alikuwa akiwatii
  alternative: alikuwa akijitiisha kwao
  rationale: Tafsiri inaonyesha utii wake ulioendelea kwa Maria na Yosefu bila kuufanya kuwa hali tuli wala kuingiza maelezo ya baadaye ya kimafundisho.
- issue: Upana wa maana ya ῥήματα
  choice: mambo hayo yote
  alternative: maneno hayo yote
  rationale: Neno la Kigiriki linaweza kurejelea maneno au mambo/matukio yanayozungumziwa; matini kuu inatumia Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. Viambishi vya mfululizo ‘aka-’ vinatumika kwa matendo yaliyofuatana, huku ‘alikuwa akiwatii’ kikihifadhi hali ya utii iliyoendelea.
