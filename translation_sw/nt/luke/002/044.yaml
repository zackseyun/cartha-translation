  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: sw
  text: Lakini wakidhani kwamba alikuwa katika msafara[a], wakasafiri mwendo wa siku moja; kisha wakaanza kumtafuta[b] miongoni mwa jamaa zao na watu waliofahamiana nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi la wasafiri.” Neno la Kigiriki συνοδία linamaanisha kundi la watu wanaosafiri pamoja.
    reason: lexical_alternative
  - marker: b
    text: Inaweza pia kutafsiriwa, “walikuwa wakimtafuta,” ikisisitiza kwamba utafutaji uliendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: wakidhani
  rationale: Kitenzi hiki huonyesha dhana waliyokuwa nayo Maria na Yosefu bila kuthibitisha kwamba ilikuwa kweli; “wakidhani” ni ya kawaida na huhifadhi hali hiyo ya kutokuwa na uhakika.
- source_word: δὲ
  choice: Lakini
  rationale: 'Kiunganishi hiki kinaonyesha badiliko lenye mguso wa utofautishaji katika simulizi: waliondoka huku Yesu akiwa hayumo walikodhani.'
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: alikuwa katika msafara
  rationale: συνοδία ni kundi la watu wanaosafiri pamoja. “Msafara” ni neno fupi na la kawaida katika Kiswahili kwa kundi kama hilo.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: wakaenda mwendo wa siku moja
  rationale: Hii ni nahau inayomaanisha umbali au muda wa safari ya siku moja; tafsiri hii ni ya asili katika Kiswahili na haibadili kipimo kuwa umbali mahususi.
- source_word: ἀνεζήτουν
  choice: wakaanza kumtafuta
  rationale: Kauli ya wakati uliopita usiotimilika inaweza kuonyesha mwanzo na kuendelea kwa utafutaji katika hatua hii ya simulizi. Tanbihi huhifadhi uwezekano wa kutafsiri tendo hilo kama lililokuwa likiendelea.
- source_word: συγγενεῦσιν
  choice: jamaa zao
  rationale: Neno hili linawahusu ndugu au watu wa ukoo kwa maana pana; “jamaa zao” ni la kawaida na halibani jinsia.
- source_word: γνωστοῖς
  choice: watu waliowafahamu
  rationale: γνωστοί ni watu wanaojulikana kwao, si lazima wawe marafiki wa karibu. Usemi huu huhifadhi upana huo wa maana.
