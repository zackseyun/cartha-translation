  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: sw
  text: Walipomwona, walishangaa sana, na mama yake akamwambia, “Mwanangu, kwa nini umetutendea hivi? Tazama, baba yako na mimi tumekuwa tukikutafuta kwa masikitiko makubwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa huzuni.” Neno la Kigiriki linaonyesha uchungu au masikitiko ya kihisia wakati wa kumtafuta.
    reason: Hufafanua maana ya kihisia ya ὀδυνώμενοι na hutoa mbadala wa karibu wa usemi.
lexical_decisions:
- source_word: ἰδόντες
  choice: Walipomwona
  rationale: Kirai tegemezi cha wakati kinaonyesha kwa Kiswahili cha kawaida kwamba mshangao ulitokea walipomwona.
- source_word: ἐξεπλάγησαν
  choice: walishangaa sana
  rationale: Kitenzi kinaonyesha mshangao mkubwa; neno “sana” linahifadhi uzito wake kwa lugha ya kawaida na iliyo wazi.
- source_word: Τέκνον
  choice: Mwanangu
  rationale: Hili ni neno la upendo la mzazi kwa mtoto. “Mwanangu” ndilo neno la kawaida na la asili katika mazungumzo ya Kiswahili, ingawa umbo la Kigiriki halitaji kiwakilishi cha kumiliki moja kwa moja.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: kwa nini umetutendea hivi?
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya swali la malalamiko, huku ikihifadhi jinsi tendo hilo lilivyowaathiri wazazi.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Linavuta usikivu kwa msisitizo bila kutumia lugha ya kizamani isiyoeleweka.
- source_word: ὁ πατήρ σου
  choice: baba yako
  rationale: Inafuata moja kwa moja maneno ya Maria bila kuongeza sifa ya kifafanuzi kama “wa duniani.”
- source_word: ὀδυνώμενοι
  choice: tukiwa na uchungu
  rationale: Kirai hiki kinaonyesha maumivu makali ya kihisia yaliyowapata wakati wa kumtafuta, badala ya kupunguza maana kuwa wasiwasi wa kawaida tu.
- source_word: ἐζητοῦμέν σε
  choice: tumekuwa tukikutafuta
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililoendelea kwa muda hadi wakati wa kusema, sawasawa na nguvu ya wakati usiotimilika wa Kigiriki.
theological_decisions:
- issue: Kumrejelea Yosefu kama “baba yako” kuhusiana na uana wa Yesu kwa Mungu
  choice: Kuhifadhi maneno ya wazi “baba yako” bila kuyafafanua zaidi.
  alternative: “baba yako wa duniani”
  rationale: Maandishi ya Kigiriki yanawasilisha maneno ya Maria kama yalivyo. Kuongeza “wa duniani” kungeondoa mvutano wa kisimulizi kwa kuingiza ufafanuzi wa kitheolojia ambao haupo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mwanangu” limetumiwa kama mwito wa asili wa mzazi kwa mtoto; “tumekuwa tukikutafuta” linahifadhi hali ya utafutaji ulioendelea.
