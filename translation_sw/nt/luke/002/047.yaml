  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: sw
  text: Nao wote waliomsikia walistaajabia ufahamu wake na majibu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walishangazwa sana na ufahamu wake na majibu yake.” Kitenzi cha Kigiriki kinaweza kueleza mshangao mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: walistaajabia
  rationale: Kitenzi hiki katika hali ya wakati usiotimilika kinaonyesha mshangao mkubwa uliokuwa ukiendelea. “Walistaajabia” ni Kiswahili cha kawaida na chenye hadhi, huku kikihifadhi uzito wa mwitikio huo bila kutumia msemo halisi unaoweza kupotosha.
- source_word: δὲ
  choice: Nao
  rationale: δέ ni kiunganishi hafifu cha simulizi. “Nao” huendeleza mtiririko wa habari kwa kawaida na pia huwaunganisha watu hao na tukio lililotangulia bila kuleta utofautishaji mkali.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: wote waliomsikia
  rationale: Kirai hiki kinawahusu kwa ujumla watu wote waliokuwa wakimsikiliza Yesu. “Wote waliomsikia” ni kifupi, cha kawaida katika simulizi, na kinahifadhi upeo wa πάντες.
- source_word: ἐπὶ τῇ συνέσει
  choice: walistaajabia ufahamu wake
  rationale: ἐπί pamoja na hali ya dative huonyesha msingi au sababu ya mshangao. Muundo wa Kiswahili “walistaajabia” huingiza uhusiano huo kwa njia ya asili; σύνεσις imetafsiriwa “ufahamu” kwa maana ya uwezo wa kuelewa na kuwa na utambuzi.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: na majibu yake
  rationale: ἀπόκρισις humaanisha jibu au itikio katika mazungumzo. “Majibu yake” linafaa kwa mazingira ya Yesu kuuliza na kujibu maswali, na linadumisha kurudiwa kwa kiwakilishi kinachomhusu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Neno “ufahamu” limechaguliwa badala ya “akili” ili kusisitiza uwezo wa kuelewa bila kuongeza tathmini isiyolazimishwa ya kipawa cha kiakili.
