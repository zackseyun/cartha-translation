  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: sw
  text: Na siku za utakaso wao zilipotimia kulingana na Sheria ya Musa,[a] walimpeleka mtoto Yerusalemu ili wamwasilishe kwa Bwana,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasoma “utakaso wake” badala ya “utakaso wao.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: zilipotimia
  rationale: Katika muktadha huu kitenzi hiki cha kutendwa kinaonyesha kipindi kilichofikia mwisho wake kamili; ‘zilipotimia’ ni Kiswahili cha kawaida kinachohifadhi dhana hiyo ya wakati.
- source_word: καθαρισμοῦ
  choice: utakaso
  rationale: Neno hili linahusu utakaso wa kiibada chini ya Sheria ya Musa baada ya kujifungua; ‘utakaso’ ni neno la kawaida na lenye staha katika muktadha huu.
- source_word: αὐτῶν
  choice: wao
  rationale: Matini ya SBLGNT iliyotolewa ina kiwakilishi cha wingi αὐτῶν, kwa hiyo tafsiri kuu inahifadhi wingi badala ya kuupatanisha kimya na muktadha wa Walawi.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: kulingana na Sheria ya Musa
  rationale: Kauli hii inaonyesha kufuata matakwa ya Sheria ya Musa na inahifadhi mtindo wa kisheria kwa Kiswahili kinachoeleweka.
- source_word: ἀνήγαγον
  choice: walimpeleka ... Yerusalemu
  rationale: Kitenzi kinaweza kudokeza kwenda juu kuelekea Yerusalemu, lakini ‘walimpeleka Yerusalemu’ ni cha asili zaidi katika Kiswahili; mwelekeo wa safari unaeleweka bila usemi mzito.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: παραστῆσαι
  choice: ili wamweke mbele za
  rationale: Katika muktadha wa ibada na sheria, kitenzi kina maana ya kumleta au kumweka mtu mbele za Mungu; usemi huu ni wazi na wa kawaida kuliko ‘kumwasilisha’ kwa mtoto.
- source_word: κυρίῳ
  choice: Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya κύριος katika muktadha huu wa kumweka mtoto mbele za Mungu.
theological_decisions:
- issue: Idadi ya kiwakilishi katika ‘siku za utakaso wao’
  choice: Kuhifadhi wingi ‘wao’ katika matini kuu
  alternative: siku za utakaso wake
  rationale: Matini ya Kigiriki iliyotolewa inasoma αὐτῶν (‘wao’). Ingawa usuli wa Walawi na baadhi ya hati vinaweza kuelekeza kwenye umoja, tofauti hiyo haipaswi kutatuliwa kimya; umoja umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. ‘Mtoto’ imewekwa wazi kama kiwakilishi cha αὐτόν ili kuzuia utata wa Kiswahili bila kuongeza tafsiri ya kitheolojia.
