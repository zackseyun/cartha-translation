  text: Kwa sababu macho yangu yameuona wokovu wako[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwokozi wako.” Kigiriki kinasema “wokovu wako,” lakini katika muktadha huu wokovu wa Mungu unaonekana katika Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu neno hili linatoa sababu ya kauli iliyotangulia ya Simeoni kwamba sasa anaweza kuondoka kwa amani.
- source_word: εἶδον
  choice: yameuona
  rationale: Wakati uliopita wa Kigiriki unaeleza tendo lililotimia lenye umuhimu wa sasa. Muundo huu wa Kiswahili unasikika kwa kawaida katika kauli ya Simeoni baada ya kumwona mtoto.
- source_word: οἱ ὀφθαλμοί μου
  choice: macho yangu
  rationale: Tafsiri hii inahifadhi usemi halisi na wenye nguvu wa Kigiriki badala ya kuufupisha kuwa ‘nimeona.’
- source_word: τὸ σωτήριόν σου
  choice: wokovu wako
  rationale: σωτήριον hapa humaanisha wokovu au ukombozi, si moja kwa moja nomino ya mtu ‘Mwokozi.’ ‘Wokovu wako’ huhifadhi namna ya usemi wa Luka na pia huruhusu muktadha kuonyesha kwamba wokovu huo uko mbele ya Simeoni katika mtoto Yesu.
theological_decisions:
- issue: Iwapo τὸ σωτήριόν σου itafsiriwe kwa nomino dhahania ‘wokovu wako’ au kwa namna ya mtu ‘Mwokozi wako’ kwa kuwa mtoto Masihi yupo mbele ya Simeoni
  choice: wokovu wako
  alternative: Mwokozi wako
  rationale: 'Neno la Kigiriki ni σωτήριον, si nomino ya kawaida ya mtu σωτήρ (‘Mwokozi’). Tafsiri ‘wokovu wako’ huhifadhi mvutano wa matini: Simeoni anaona wokovu wa Mungu ukiwa umetimizwa na kuwakilishwa katika Yesu, bila tafsiri kubadili moja kwa moja neno hilo kuwa cheo cha mtu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Usemi ‘macho yangu yameuona’ umehifadhiwa kwa sababu ni wa asili katika Kiswahili na unaakisi msisitizo wa matini ya Kigiriki.
