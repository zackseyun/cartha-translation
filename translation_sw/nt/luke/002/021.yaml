base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: sw
  text: Siku nane zilipotimia za kumtahiri[a], akaitwa Yesu[b], jina lililotajwa na malaika kabla hajatungwa mimba katika tumbo la uzazi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku nane zilipokamilika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aliitwa Yesu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kabla hajatungwa mimba tumboni mwa Maria.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: Siku nane zilipotimia
  rationale: Huhifadhi maana ya kukamilika kwa muda katika usemi wa Kigiriki, huku ikiwa ya asili na yenye hadhi katika Kiswahili.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: za kumtahiri
  rationale: Huwakilisha infinitivu yenye kueleza kusudi au tukio lililokusudiwa, bila kugeuza tendo kuwa nomino isiyo ya lazima.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: akaitwa jina Yesu
  rationale: Ni usemi wa kawaida wa kibiblia katika Kiswahili unaohifadhi kitenzi cha kutaja na nomino 'jina'; 'akaitwa Yesu' ni mbadala wa kawaida zaidi.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo sanifu la jina hili katika Kiswahili cha Agano Jipya.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: jina aliloitwa na malaika
  rationale: Huhifadhi kurudiwa kwa kitenzi καλέω na hali yake ya kutendwa; 'malaika' hurejelea malaika aliyetajwa tayari katika simulizi.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: kabla hajatungwa mimba
  rationale: Katika muktadha huu συλλαμβάνω hueleza kutungwa mimba; tafsiri hii ni wazi na haiingizi istilahi za kiteolojia zisizodaiwa na matini.
- source_word: ἐν τῇ κοιλίᾳ
  choice: tumboni mwa mama yake
  rationale: Kοιλία hapa ni tumbo la uzazi. Kuongeza 'mwa mama yake' hufanya rejeleo liwe wazi katika Kiswahili bila kumtaja Maria ndani ya matini kuu.
theological_decisions:
- issue: Kauli kuhusu kutungwa mimba na uhusiano wake na Kristolojia
  choice: kabla hajatungwa mimba tumboni mwa mama yake
  alternative: kabla ya kutungwa kwake mimba katika tumbo la uzazi
  rationale: Kauli inaeleza tukio la kutungwa kwa Yesu mimba kama mwanadamu bila kuongeza ufafanuzi wa baadaye wa kiteolojia; inahifadhi upeo wa matini ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'akaitwa jina Yesu' umechaguliwa ili kuhifadhi kwa kiasi usemi wa Kigiriki na marudio ya wazo la kuita jina, huku tanbihi ikitoa mbadala wa kawaida zaidi.
