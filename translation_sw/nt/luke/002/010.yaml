  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: sw
  text: Malaika akawaambia, “Msiogope, kwa maana tazama, ninawaletea habari njema ya furaha kubwa ambayo itakuwa kwa watu wote[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kwa kawaida husoma, “kwa watu wote,” lakini neno “watu” lina kiwakilishi bainishi; katika Luka, mara nyingi humaanisha watu wa Israeli katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: Malaika
  rationale: Kiswahili hakina kiwakilishi bainishi kinacholingana moja kwa moja na neno la Kigiriki lenye maana ya ‘the’. Muktadha unaonyesha kuwa huyu ndiye malaika aliyetajwa tayari.
- source_word: Μὴ φοβεῖσθε
  choice: Msiogope
  rationale: Ni katazo la moja kwa moja kwa kundi la watu na ni usemi wa kawaida, wazi na wenye heshima katika Kiswahili cha sasa.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili huvuta fikira kwenye tangazo linalofuata na huhifadhi msisitizo pamoja na uzito wa usemi wa Kigiriki.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha sababu ambayo kwa hiyo wachungaji hawapaswi kuogopa.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: ninawaletea habari njema
  rationale: Hutoa maana ya kutangaza habari njema kwa wasikilizaji bila kulifanya neno hilo kuwa istilahi ya kidini iliyo pana kuliko muktadha huu.
- source_word: χαρὰν μεγάλην
  choice: furaha kubwa
  rationale: Ni tafsiri ya asili na ya moja kwa moja inayohifadhi kiwango cha furaha kinachoelezwa.
- source_word: ἥτις ἔσται
  choice: ambayo itakuwa
  rationale: Huhifadhi kishazi tegemezi kinachoihusu furaha na wakati ujao wa kitenzi.
- source_word: παντὶ τῷ λαῷ
  choice: kwa watu wote
  rationale: Hili ndilo tamko la asili katika Kiswahili. Kwa kuwa Kiswahili hakina viwakilishi bainishi vinavyolingana na ‘the’, linaweza kubeba maana ya watu wote wa jamii fulani au watu wote kwa ujumla; tanbihi inahifadhi tofauti hiyo.
theological_decisions:
- issue: Upeo wa παντὶ τῷ λαῷ
  choice: kwa watu wote
  alternative: kwa watu wote wa taifa hili
  rationale: Katika muktadha wa Luka, nomino yenye kiwakilishi bainishi inaweza kumaanisha watu fulani, yaelekea Israeli, lakini Kiswahili hakitofautishi ‘all the people’ na ‘all people’ kwa kutumia kiwakilishi bainishi. Tafsiri kuu haiongezi ‘Israeli’ pasipo kutajwa wazi, na tanbihi huhifadhi uwezekano wa maana bainifu bila kuzuia mtiririko mpana wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ huhifadhi uzito wa ἰδού, huku ‘ninawaletea habari njema’ ikiwa wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
