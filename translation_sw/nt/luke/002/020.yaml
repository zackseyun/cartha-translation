  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: sw
  text: Wachungaji wakarudi[a], huku wakimtukuza na kumsifu Mungu kwa ajili ya yote waliyosikia na kuyaona[b], kama walivyoambiwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walirejea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya yote waliyosikia na kuyaona.”
    reason: lexical_alternative
  - marker: c
    text: 'Tafsiri ya neno kwa neno: “kama ilivyosemwa kwao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: wakarudi
  rationale: Kitenzi hiki kinaonyesha kwamba wachungaji walirudi walikotoka baada ya kumwona mtoto; “wakarudi” ni usemi wa kawaida na wenye hadhi katika simulizi.
- source_word: οἱ ποιμένες
  choice: wachungaji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watu wanaochunga mifugo, nao ndio waliotajwa mapema katika simulizi.
- source_word: δοξάζοντες
  choice: wakimtukuza
  rationale: Kitenzi endelevu kinaonyesha jambo walilokuwa wakifanya waliporudi. “Kumtukuza” huhifadhi maana ya kumpa Mungu utukufu.
- source_word: αἰνοῦντες
  choice: na kumsifu
  rationale: “Kumsifu” linabaki tofauti na “kumtukuza,” ingawa maana zake zinakaribiana, na hivyo huhifadhi jozi ya vitenzi vya Kigiriki.
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Mungu ndiye mtendewa wa vitenzi vyote viwili, “kumtukuza” na “kumsifu.”
- source_word: ἐπὶ πᾶσιν οἷς
  choice: kwa ajili ya yote
  rationale: Katika muktadha huu, ἐπί pamoja na hali ya dative huonyesha msingi au sababu ya sifa. “Kwa ajili ya yote” ni ya asili na haibani maana kuwa sababu pekee.
- source_word: ἤκουσαν καὶ εἶδον
  choice: waliyokuwa wameyasikia na kuyaona
  rationale: Muundo huu unaonyesha kwa kawaida katika Kiswahili kwamba kusikia na kuona kulitokea kabla ya kurudi kwao, bila kubadili maana ya vitenzi vya aoristi.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: kama walivyokuwa wameambiwa
  rationale: Muundo wa kutendwa unaacha mtendaji bila kutajwa, kama ilivyo katika Kigiriki, huku ukitoa Kiswahili cha kawaida kinachorejelea ujumbe waliopokea.
theological_decisions:
- issue: Iwapo mtendaji wa ἐλαλήθη atajwe wazi kuwa malaika
  choice: kama walivyokuwa wameambiwa
  alternative: kama malaika alivyokuwa amewaambia
  rationale: Ingawa muktadha unaonyesha ujumbe wa malaika, kifungu hiki hakimtaji mtendaji. Tafsiri inaacha mtendaji bila kutajwa ili isiongeze maelezo yasiyosemwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “huku wakimtukuza na kumsifu” unaonyesha matendo yaliyoendelea wakati wa kurudi. Viambishi vya ngeli katika “wameyasikia na kuyaona” vinarejelea “yote” kwa mtiririko wa kawaida wa Kiswahili.
