reference: Luke 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: sw
  text: kwa maana leo, katika mji wa Daudi, amezaliwa kwa ajili yenu Mwokozi, ambaye ni Masihi, Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “Kristo Bwana.” Maneno ya Kigiriki ni χριστὸς κύριος, kihalisi “Masihi Bwana,” na kwa kawaida yanaeleweka kuwa “Masihi, Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: kwa maana
  rationale: Huunganisha tangazo hili na habari njema ya mstari uliotangulia kwa kutoa sababu au maelezo; ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἐτέχθη
  choice: amezaliwa
  rationale: Kauli timilifu ya Kiswahili inafaa kwa tangazo la tukio lililotokea leo na ambalo umuhimu wake unaendelea wakati wa kutangazwa.
- source_word: ὑμῖν
  choice: kwa ajili yenu
  rationale: 'Huwasilisha wazi dativu ya manufaa: kuzaliwa huku ni kwa faida ya wale wanaoambiwa habari hiyo.'
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha wakati.
- source_word: σωτὴρ
  choice: Mwokozi
  rationale: Ni neno la kawaida la Kiswahili kwa mwenye kuokoa na linahifadhi uzito wa kifalme na wa kimasiha wa cheo hiki.
- source_word: ὅς ἐστιν
  choice: ambaye ni
  rationale: Hutambulisha kwa kawaida uhusiano kati ya Mwokozi na vyeo vinavyofuata.
- source_word: χριστὸς
  choice: Masihi
  rationale: Hapa χριστός ni cheo kinachohusishwa na matarajio ya mzao wa Daudi, si jina binafsi; hivyo maana ya cheo hilo inawekwa wazi.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi maana ya mamlaka na uzito mkubwa wa kitheolojia wa κύριος katika ungamo hili.
- source_word: ἐν πόλει Δαυίδ
  choice: katika mji wa Daudi
  rationale: Ni tafsiri ya kawaida inayohifadhi uhusiano wa kifalme na Daudi bila kuongeza wazi jina Bethlehemu, ambalo halimo katika mstari huu.
theological_decisions:
- issue: Uhusiano wa vyeo χριστὸς κύριος
  choice: Masihi, Bwana
  alternative: Masihi aliye Bwana; Kristo Bwana; Masihi wa Bwana
  rationale: Maneno ya Kigiriki yana vyeo viwili vya nominatibo vinavyomtambulisha Mwokozi. Uakifishaji wa koma huhifadhi apposition na mvutano wa kifungu bila kukifanya kwa lazima kuwa ‘Masihi wa Bwana.’ ‘Masihi’ huonyesha maana ya cheo χριστός, huku ‘Bwana’ likihifadhi κύριος.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa virai ni wa asili katika Kiswahili huku ukidumisha msisitizo wa ‘leo,’ manufaa ya ‘kwa ajili yenu,’ na vyeo vya kimasiha.
