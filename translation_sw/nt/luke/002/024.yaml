  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: sw
  text: 'na kutoa dhabihu kulingana na yale yaliyosemwa[a] katika Sheria ya Bwana: jozi ya hua au makinda mawili ya njiwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na yale yanayosemwa katika Sheria ya Bwana.”
    reason: Tofauti halali ya kutafsiri kauli tendwa timilifu τὸ εἰρημένον, ambayo inaweza kusisitiza ama yaliyokwisha kusemwa ama yaliyoandikwa na yanayoendelea kuwa na nguvu.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: kutoa dhabihu
  rationale: Ingawa δίδωμι kimsingi ni ‘kutoa,’ pamoja na θυσία usemi wa Kiswahili ‘kutoa dhabihu’ ni wa asili na unaonyesha kusudi la kuja kwao.
- source_word: κατὰ τὸ εἰρημένον
  choice: kulingana na yale yaliyosemwa
  rationale: Huhifadhi dhana ya kusema katika kauli tendwa timilifu bila kuongeza wazo la ‘kuamriwa’ lisilotajwa moja kwa moja.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: katika Sheria ya Bwana
  rationale: ‘Sheria’ hapa inarejelea sheria ya Musa kama Maandiko, na κύριος imetafsiriwa kwa istilahi ya kawaida ya Agano Jipya, ‘Bwana.’
- source_word: ζεῦγος τρυγόνων
  choice: hua wawili
  rationale: ζεῦγος huonyesha jozi; katika Kiswahili idadi ‘wawili’ huwasilisha maana hiyo kwa uwazi na kwa lugha ya kawaida. τρυγών ni hua, aina mahususi ya ndege wa jamii ya njiwa.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: makinda mawili ya njiwa
  rationale: νοσσός ni kinda la ndege, na περιστερά ni njiwa; usemi huu huhifadhi kwa usahihi umri wa ndege na uhusiano wa nomino hizo.
theological_decisions:
- issue: Tafsiri ya κύριος katika kauli kuhusu sheria ya Mungu
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κύριος. ‘Bwana’ ndiyo tafsiri ya kawaida ya neno hilo katika Agano Jipya na haibadilishi kimyakimya maandishi kuwa jina la Mungu la Kiebrania.
- issue: Nguvu ya κατὰ τὸ εἰρημένον
  choice: kulingana na yale yaliyosemwa
  alternative: kulingana na yale yanayosemwa
  rationale: Kauli tendwa timilifu inaonyesha maneno yaliyokwisha kusemwa ambayo bado yana mamlaka. Maandishi makuu yanadokeza upande wa tendo lililokamilika, huku tanbihi ikihifadhi uwezekano wa kueleza hali yake ya kudumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mwendelezo wa sentensi kutoka mstari uliotangulia. Alama [a] imewekwa baada ya dondoo linalohusika.
