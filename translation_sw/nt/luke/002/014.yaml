  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: sw
  text: '“Utukufu kwa Mungu juu kabisa,

    na duniani amani miongoni mwa watu anaowaridhia.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata muundo wa Kigiriki, inaweza pia kutafsiriwa, “miongoni mwa watu wa kibali.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina, “na duniani amani, nia njema miongoni mwa watu.”
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Utukufu
  rationale: Katika tangazo hili neno hili linamhusisha Mungu na utukufu. “Utukufu” huhifadhi uzito wa kiliturujia na wa kiteolojia kuliko tafsiri fafanuzi zaidi kama “sifa” au “heshima.”
- source_word: ἐν ὑψίστοις
  choice: juu kabisa
  rationale: Kirai hiki kinaelekeza kwenye eneo la juu zaidi la mbinguni. “Juu kabisa” ni kifupi na huhifadhi wazo la mahali bila kuongeza moja kwa moja neno “mbinguni,” ambalo halimo wazi katika kirai cha Kigiriki.
- source_word: θεῷ
  choice: kwa Mungu
  rationale: Hali ya dative inaonyesha kwamba utukufu unamhusu au unaelekezwa kwa Mungu; “kwa Mungu” ni usemi wa kawaida wa Kiswahili katika tangazo hili.
- source_word: ἐπὶ γῆς
  choice: duniani
  rationale: Hii ni tafsiri ya kawaida ya kimaeneo na inatofautisha dunia na “juu kabisa.”
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” hubeba maana pana ya kibiblia ya εἰρήνη bila kuibana kuwa kutokuwapo kwa vita pekee.
- source_word: ἐν ἀνθρώποις
  choice: miongoni mwa watu
  rationale: ἄνθρωποι hapa inawarejelea wanadamu kwa ujumla. “Watu” ni ya kawaida, jumuishi, na sahihi katika Kiswahili bila hitaji la tanbihi kuhusu jinsia.
- source_word: εὐδοκίας
  choice: anaowaridhia
  rationale: Genitive εὐδοκίας inawatambulisha watu wanaohusishwa na kibali au radhi. “Anaowaridhia” ni Kiswahili cha kawaida na kinaonyesha maana hiyo; uhusiano rasmi zaidi wa genitive umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Maana ya genitive εὐδοκίας katika tangazo la malaika
  choice: Amani inatangazwa miongoni mwa watu wanaoridhiwa, yaani walio katika kibali cha Mungu.
  alternative: “Amani, nia njema miongoni mwa watu,” kwa kufuata usomaji wa nominative εὐδοκία.
  rationale: SBLGNT iliyotolewa inasoma εὐδοκίας, hali ya genitive, hivyo neno hilo linahusishwa kisarufi na “watu,” badala ya kuwa jambo la tatu linalojitegemea katika tangazo. Tafsiri haipanui hili kuwa mfumo wa mafundisho kuhusu uteuzi; inaonyesha tu nguvu ya kisarufi ya matini iliyopokelewa, huku usomaji mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa tangazo la malaika lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi umehifadhi usambamba kati ya “juu kabisa” na “duniani.” Tanbihi ya jinsia ya Kiingereza haikuhitajika kwa sababu “watu” ni jumuishi kiasili katika Kiswahili.
