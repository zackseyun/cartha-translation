  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: sw
  text: Walipokuwa huko, siku zake za kujifungua zikatimia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: '[imewakilishwa kwa mtiririko wa simulizi bila kifungu tofauti]'
  rationale: Katika muktadha huu, ἐγένετο δὲ huendeleza simulizi. Kiswahili cha asili kinaweza kuonyesha mwendelezo huo kwa kiunganishi cha wakati na mfuatano wa vitenzi bila tafsiri ngumu kama ‘ikawa kwamba.’
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: Walipokuwa huko
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha wakati unaoendelea sambamba; ‘Walipokuwa huko’ ni wa kawaida na mwaminifu katika Kiswahili.
- source_word: ἐπλήσθησαν
  choice: zikatimia
  rationale: Kitenzi hiki kinaonyesha kwamba muda ulifikia ukamilifu wake. ‘Zikatimia’ huhifadhi taswira ya siku kufikia utimilifu bila kuongeza dai la wazi la kiteolojia.
- source_word: αἱ ἡμέραι
  choice: siku zake
  rationale: Ingawa Kigiriki kinasema kihalisi ‘siku,’ katika Kiswahili ‘siku zake za kujifungua’ huonyesha kwa kawaida siku zinazomhusu Mariamu na huepuka utata usio wa lazima.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: za kujifungua
  rationale: Kifungu hiki kinarejelea kujifungua kwake. ‘Za kujifungua’ ni lugha ya sasa, yenye heshima, na inahifadhi nguvu ya kitendo cha τίκτω.
theological_decisions:
- issue: Dokezo linalowezekana la wakati uliowekwa au wa kimajaliwa katika ἐπλήσθησαν αἱ ἡμέραι
  choice: siku zake za kujifungua zikatimia
  alternative: wakati wake wa kujifungua ukafika
  rationale: ‘Zikatimia’ huhifadhi lugha ya Luka ya kufikia utimilifu, lakini haisemi wazi kwamba kuna fundisho maalumu la kimajaliwa. Tafsiri mbadala ni ya kawaida zaidi lakini inapunguza mwangwi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa ‘Walipokuwa ... zikatimia’ unasomeka kwa urahisi na kuhifadhi uhusiano wa wakati katika Kigiriki.
