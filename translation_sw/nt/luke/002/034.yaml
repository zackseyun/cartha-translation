source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: sw
  text: Kisha Simeoni akawabariki, akamwambia Maria, mama ya Yesu, “Tazama, huyu amewekwa kwa ajili ya kuanguka na kuinuka kwa wengi katika Israeli, na kuwa ishara inayopingwa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ishara inayosemwa dhidi yake.”'
    reason: ἀντιλεγόμενον inaweza kueleza kupingwa kwa ishara au kusemwa maneno dhidi yake.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: akawabariki
  rationale: Kitenzi hiki kinaonyesha kwamba Simeoni aliwatamkia baraka; umbo la wingi linafuata αὐτούς (‘wao’).
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno la kuvuta uangalifu limetafsiriwa kwa mtindo wenye heshima na uliozoeleka katika simulizi la Biblia.
- source_word: κεῖται
  choice: amewekwa
  rationale: Katika muktadha huu neno lina maana ya kuwekwa au kuteuliwa kwa kusudi fulani; ‘amewekwa’ huhifadhi taswira ya Kigiriki bila kufafanua wazi mhusika aliyemweka.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: kuanguka na kuinuka
  rationale: Huhifadhi ulinganifu na mvutano wa jozi ya nomino za Kigiriki bila kuamua kama ‘kuinuka’ ni urejesho wa kiroho, ufufuo, au taswira nyingine.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: ishara inayopingwa
  rationale: Kirai hiki humaanisha ishara inayokabiliwa na upinzani au kusemwa dhidi yake; tafsiri hii ni fupi na huhifadhi kauli tendwa.
theological_decisions:
- issue: Maana ya kuanguka na kuinuka kwa wengi
  choice: kuanguka na kuinuka kwa wengi
  alternative: kuanguka kwa wengine na kuinuka kwa wengine
  rationale: Kigiriki hakigawanyi wazi makundi hayo wala hakisemi kama watu wale wale huanguka kisha huinuka; tafsiri iliyochaguliwa huhifadhi utata huo.
- issue: Nguvu inayomweka mtoto kwa kusudi hili
  choice: amewekwa
  alternative: ameteuliwa na Mungu
  rationale: Ingawa uteuzi wa Mungu unaweza kueleweka katika muktadha, maandishi hayamtaji Mungu moja kwa moja hapa; kauli tendwa imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mama yake Yesu’ huweka wazi kiwakilishi cha Kigiriki αὐτοῦ kwa njia ya asili katika Kiswahili bila kubadili rejeo.
