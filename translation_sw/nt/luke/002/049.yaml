  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: sw
  text: Akawaambia, “Kwa nini mlinitafuta? Hamkujua kwamba ni lazima niwe katika nyumba ya Baba yangu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mambo ya Baba yangu,” au “nikishughulika na mambo ya Baba yangu.” Usemi wa Kigiriki ni wa duaradufu, ukiwa na neno lililodokezwa; kwa hiyo unaweza kumaanisha ama nyumba ya Baba ama mambo yanayomhusu Baba.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Kwa nini
  rationale: Nahau hii huuliza sababu; “Kwa nini” ni ya kawaida na huhifadhi nguvu ya swali.
- source_word: ἐζητεῖτέ
  choice: mlinitafuta
  rationale: Katika simulizi hili, ζητέω humaanisha kumtafuta mtu aliyepotea machoni; “mlinitafuta” ni Kiswahili cha kawaida na sahihi.
- source_word: οὐκ ᾔδειτε
  choice: Hamkujua
  rationale: Hutoa maana ya kujua au kuwa na ufahamu, na hudumisha swali la balagha.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: katika nyumba ya Baba yangu
  rationale: Usemi wa Kigiriki umeachwa na neno linalodokezwa; mazingira ya hekalu yanaunga mkono “nyumba ya Baba yangu,” huku maana nyingine inayowezekana ikihifadhiwa katika tanbihi.
- source_word: δεῖ
  choice: ni lazima
  rationale: Huonyesha ulazima wenye uzito, unaoweza kudokeza kusudi la Mungu.
- source_word: εἶναί με
  choice: niwe
  rationale: Ni uwasilishaji wa kawaida wa muundo wa kitenzi kisicho na ukomo pamoja na kiima chake baada ya δεῖ.
- source_word: πατρός μου
  choice: Baba yangu
  rationale: Katika mazingira haya Yesu anamrejelea Mungu kuwa Baba yake; herufi kubwa inasaidia kuonyesha rejeo hilo bila kuongeza ufafanuzi ndani ya mstari.
theological_decisions:
- issue: Usemi wenye maana zaidi ya moja ἐν τοῖς τοῦ πατρός μου
  choice: katika nyumba ya Baba yangu
  alternative: katika mambo ya Baba yangu / nikishughulika na mambo ya Baba yangu
  rationale: Hekalu ndilo eneo la karibu la simulizi, hivyo “nyumba” inafaa katika matini kuu. Hata hivyo Kigiriki kinaweza pia kurejelea mambo au shughuli za Baba, kwa hiyo maana hiyo imehifadhiwa katika tanbihi.
- issue: Anayerejelewa na “Baba yangu”
  choice: Mungu ndiye anayerejelewa
  alternative: Yusufu kama baba wa kibinadamu
  rationale: Mazingira ya hekalu na utofautishaji uliomo katika jibu la Yesu vinaelekeza kwa Mungu, si Yusufu, bila kuhitaji kuongeza maelezo ya kimafundisho katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akawaambia” kinaendeleza mtiririko wa simulizi; tanbihi inalinda utata halisi wa usemi wa Kigiriki.
