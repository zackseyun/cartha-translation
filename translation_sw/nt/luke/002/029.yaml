  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: sw
  text: Sasa, Ee Bwana, unamruhusu mtumwa wako[a] aondoke kwa amani, kulingana na neno lako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wako.” Neno la Kigiriki δοῦλος linaweza kumaanisha “mtumwa” au “mtumishi”; hapa “mtumwa” limetumiwa kwa sababu anwani inayofuata, “Bwana,” inasisitiza uhusiano wa mamlaka na utumishi.
    reason: lexical_alternative
  - marker: b
    text: Maana katika muktadha ni kwamba Simeoni yuko tayari kuondoka katika maisha haya kwa amani, ingawa Kigiriki kinasema kihalisi zaidi kwamba anaachiliwa au anaruhusiwa kuondoka.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Sasa
  rationale: Huonyesha kuwa matarajio ya Simeoni yanatimizwa wakati huu; ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: ἀπολύεις
  choice: unamruhusu ... aondoke
  rationale: Huhifadhi wazo la kuachiliwa au kuruhusiwa kuondoka bila kusema wazi kwamba Mungu anamruhusu afe; pia ni Kiswahili cha asili katika muktadha huu.
- source_word: τὸν δοῦλόν σου
  choice: mtumwa wako
  rationale: δοῦλος inaweza kumaanisha mtumwa au mtumishi. Hapa uhusiano wa mamlaka na umiliki unasisitizwa na anwani δέσποτα, hivyo “mtumwa wako” huhifadhi nguvu ya jozi hiyo.
- source_word: δέσποτα
  choice: Ee Bwana Mkuu
  rationale: δεσπότης humaanisha mwenye mamlaka kamili au bwana wa mtumwa. “Bwana Mkuu” ni anwani ya heshima inayoeleweka katika Kiswahili na inaonyesha mamlaka hiyo bila kuitatanisha na matumizi ya kawaida ya “Bwana” kwa κύριος.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: sawasawa na neno lako
  rationale: κατά pamoja na hali ya kushutumiwa huonyesha upatano; ῥῆμα ni neno lililonenwa au ahadi. Kauli hii huhifadhi marejeo ya ahadi ya Mungu.
- source_word: ἐν εἰρήνῃ
  choice: kwa amani
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa kuondoka katika hali ya amani, huku ikihifadhi uzito wa kibiblia wa kirai cha Kigiriki.
theological_decisions:
- issue: Ikiwa kauli ya Simeoni itaje kifo waziwazi
  choice: Kuhifadhi taswira ya kuruhusiwa kuondoka bila kutaja kifo moja kwa moja
  alternative: Sasa unamruhusu mtumwa wako afe kwa amani
  rationale: Muktadha unaashiria kwamba Simeoni yuko tayari kufa, lakini ἀπολύω yenyewe humaanisha kuachilia au kumruhusu mtu aondoke, si kusababisha afe. Tafsiri iliyochaguliwa huhifadhi utata na ushairi wa matini.
- issue: Uhusiano kati ya δοῦλος na δεσπότης
  choice: “mtumwa” pamoja na “Bwana Mkuu”
  alternative: “mtumishi” pamoja na “Bwana”
  rationale: Jozi ya maneno ya Kigiriki inasisitiza uhusiano wa aliye chini ya mamlaka na mwenye mamlaka. Tafsiri hii haiufichi, ingawa tanbihi inataja maana mbadala ya δοῦλος.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Ee” huonyesha mwito wa moja kwa moja; “Bwana Mkuu” huhifadhi uzito wa δέσποτα. Mpangilio umefanywa kuwa wa asili kwa Kiswahili bila kutaja kifo waziwazi.
