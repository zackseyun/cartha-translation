  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: sw
  text: Wakafika kwa haraka, wakapata Maria na Yosefu, na mtoto mchanga akiwa amelala katika hori la kulishia wanyama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo cha kulishia wanyama.” Neno la Kigiriki φάτνη linaweza kumaanisha hori au chombo cha kuwekea chakula cha wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: Wakafika
  rationale: Katika muktadha huu wachungaji wanafika mahali walipoelekezwa. “Wakafika” ni simulizi la kawaida la Kiswahili na linaonyesha mwisho wa safari yao bila kulazimisha mtazamo wa ‘kuja’ au ‘kwenda’.
- source_word: σπεύσαντες
  choice: kwa haraka
  rationale: Kirai hiki kinaonyesha jinsi walivyofika na kinahifadhi dharura ya tendo kwa Kiswahili cha kawaida.
- source_word: ἀνεῦραν
  choice: wakawakuta
  rationale: Kitenzi hiki kinamaanisha kupata baada ya kutafuta. “Wakawakuta” ni cha asili katika simulizi na kinafaa kwa kuwakuta watu mahali fulani.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Maria na Yosefu
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili, huku uhusiano wa vipashio ukihifadhiwa kwa “na”.
- source_word: τὸ βρέφος
  choice: mtoto mchanga
  rationale: βρέφος humaanisha mtoto mdogo sana; katika muktadha wa kuzaliwa, “mtoto mchanga” ni wazi, wa kawaida, na wenye usahihi.
- source_word: κείμενον
  choice: akiwa amelala
  rationale: Hili linaeleza hali na mahali pa mtoto, si tendo la mtu kumlaza. “Akiwa amelala” linahifadhi maana hiyo ya hali.
- source_word: ἐν τῇ φάτνῃ
  choice: katika hori la kulishia wanyama
  rationale: φάτνη linaweza kumaanisha hori au chombo ambamo wanyama hulishwa. Tafsiri hii ni wazi kwa msomaji wa sasa na inaepuka dhana kwamba neno hilo ni jina la aina fulani ya kitanda.
- source_word: καὶ ... καὶ ... καὶ
  choice: waka- ... waka- ... na ... na
  rationale: Mtiririko wa nyongeza katika Kigiriki umeonyeshwa kwa viambishi vya mfululizo wa simulizi na viunganishi vya kawaida vya Kiswahili, bila kufanya sentensi kuwa nzito.
