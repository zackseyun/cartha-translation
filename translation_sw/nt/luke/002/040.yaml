id: LUK.2.40
reference: Luke 2:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: sw
  text: Naye mtoto akakua na kuzidi kupata nguvu, akijawa na hekima; na kibali cha Mungu[a] kilikuwa juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neema ya Mungu.”
    reason: Njia nyingine halali ya kutafsiri χάρις θεοῦ.
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Naye mtoto
  rationale: παιδίον humaanisha mtoto, na muktadha bado unahusu utoto wake wa mapema. δέ ni kiunganishi chepesi cha simulizi, kinachowasilishwa kwa kawaida kwa “naye”.
- source_word: ηὔξανεν
  choice: akakua
  rationale: Kauli ya wakati usiotimilika inaonyesha ukuaji ulioendelea; “akakua” ni ya kawaida katika simulizi la Kiswahili na inawasilisha maendeleo hayo vizuri.
- source_word: ἐκραταιοῦτο
  choice: na kuzidi kupata nguvu
  rationale: Kitenzi hiki cha wakati usiotimilika kinaonyesha kuendelea kuimarika. “Kuzidi kupata nguvu” huhifadhi wazo la maendeleo bila Kiswahili kuwa kizito au kisicho cha kawaida.
- source_word: πληρούμενον σοφίᾳ
  choice: akijawa na hekima
  rationale: Kishirikishi cha wakati uliopo kinaeleza hali inayoendelea sambamba na ukuaji wa mtoto. σοφίᾳ inaonyesha kile anachojazwa nacho, yaani hekima.
- source_word: χάρις θεοῦ
  choice: kibali cha Mungu
  rationale: χάρις hapa inaweza kumaanisha kibali, neema, au wema wenye fadhili. “Kibali cha Mungu” kinaeleza wazi uwepo wa Mungu wenye kukubali na kutendea mema katika muktadha huu, huku “neema” ikihifadhiwa katika tanbihi kama tafsiri nyingine halali.
- source_word: ἦν ἐπ’ αὐτό
  choice: kilikuwa juu yake
  rationale: Kirai hiki kinaonyesha uwepo unaomkalia mtu. “Kilikuwa juu yake” huhifadhi taswira ya Kigiriki na ni usemi wa kibiblia unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya χάρις θεοῦ katika maelezo ya kukua kwa Kristo
  choice: kibali cha Mungu
  alternative: neema ya Mungu
  rationale: “Kibali” huonyesha uwepo wa Mungu wenye kukubali na kutenda mema bila kuingiza hitimisho kwamba Mwana alikuwa na upungufu katika asili yake ya Uungu. Hata hivyo, neno la Kigiriki pia linaweza kutafsiriwa “neema,” kwa hiyo maana hiyo imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki karibu na mwendo wa Kigiriki huku “kuzidi kupata nguvu” ukitumiwa kwa ufasaha wa kawaida. Alama [a] imewekwa moja kwa moja baada ya kirai kinachohusika, “kibali cha Mungu.”
