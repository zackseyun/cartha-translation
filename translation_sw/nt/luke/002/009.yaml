id: LUK.2.9
reference: Luke 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: sw
  text: Malaika wa Bwana akasimama karibu nao[a], na utukufu wa Bwana ukawaangazia pande zote, nao wakaingiwa na hofu kuu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawajia ghafla” au “akasimama kando yao.” Kitenzi cha Kigiriki kinaweza kuonyesha kufika ghafla na pia kusimama karibu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki ni, “wakaogopa hofu kuu,” nahau inayosisitiza hofu kali sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Katika muktadha huu ἄγγελος humaanisha malaika, na muundo usio na kibainishi unaeleweka kama malaika mmoja wa Bwana, si lazima ‘yule malaika wa Bwana.’ Kiswahili hakihitaji kibainishi tofauti kuonyesha maana hiyo.
- source_word: ἐπέστη αὐτοῖς
  choice: akasimama karibu nao
  rationale: Kitenzi kinaweza kueleza kusimama karibu na mtu au kufika ghafla. Tafsiri hii inadumisha taswira halisi ya kuwepo karibu nao bila kuficha uwezekano wa ujio wa ghafla.
- source_word: δόξα κυρίου
  choice: utukufu wa Bwana
  rationale: ‘Utukufu’ huhifadhi uzito wa δόξα, ambao hapa unaonekana kwa mng’ao wa kimungu, bila kuupunguza kuwa nuru pekee.
- source_word: περιέλαμψεν αὐτούς
  choice: ukawaangazia pande zote
  rationale: Usemi huu unaonyesha nuru iliyong’aa kuwazunguka; ‘pande zote’ huwasilisha maana ya kiambishi περί kwa Kiswahili cha kawaida.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: wakaingiwa na hofu kuu
  rationale: Muundo wa Kigiriki unaorudia mzizi wa ‘hofu’ unatilia mkazo woga mkali. Kiswahili hiki ni cha asili na cha heshima huku kikihifadhi nguvu ya usemi huo.
theological_decisions:
- issue: Tafsiri ya κύριος katika vifungu ἄγγελος κυρίου na δόξα κυρίου
  choice: Bwana
  alternative: Mkuu
  rationale: Katika muktadha huu κύριος humrejelea Mungu. ‘Bwana’ ndiyo tafsiri ya kawaida ya kibiblia inayohifadhi uzito wa jina hilo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Viunganishi vya ‘aka-/uka-/waka-’ vinatunza mtiririko wa simulizi. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
