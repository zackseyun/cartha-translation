  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: sw
  text: 'Walipokwisha kutimiza mambo yote kulingana na sheria ya Bwana[a], walirudi Galilaya, katika mji wao[b], Nazareti.


    [a] Au, “kutimiza yote yaliyotakiwa na sheria ya Bwana.”

    [b] Neno la Kigiriki linaweza kumaanisha “jiji” au “mji”; hapa limetafsiriwa “mji” kwa sababu Nazareti ilikuwa makazi madogo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutimiza yote yaliyotakiwa na sheria ya Bwana.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha “jiji” au “mji”; hapa limetafsiriwa “mji” kwa sababu Nazareti ilikuwa makazi madogo.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: Walipokwisha
  rationale: Muundo huu unaonyesha kwamba kurudi kwao kulifuata baada ya matendo yaliyotakiwa kukamilishwa; “walipokwisha” ni Kiswahili cha kawaida kinachohifadhi mpangilio huo bila kusisitiza kwamba waliondoka papo hapo.
- source_word: ἐτέλεσαν
  choice: kutimiza
  rationale: Kitenzi hiki hapa kinamaanisha kukamilisha matendo yaliyopaswa kufanywa. “Kutimiza” linafaa kwa masharti ya sheria bila kulifanya kuwa dai kuhusu kutimia kwa unabii.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: mambo yote kulingana na sheria ya Bwana
  rationale: Tafsiri hii inafuata muundo wa Kigiriki na kuonyesha jumla ya mambo yaliyohusiana na maagizo ya sheria, huku tanbihi ikitoa maana iliyo wazi zaidi ya mambo yaliyotakiwa.
- source_word: νόμον κυρίου
  choice: sheria ya Bwana
  rationale: Ni muundo wa kawaida na wenye hadhi katika Kiswahili cha Biblia, unaohifadhi namna ya usemi wa Kiyahudi na Kimaandiko.
- source_word: κυρίου
  choice: Bwana
  rationale: κύριος hapa humrejelea Mungu katika muktadha wa sheria ya Maandiko; “Bwana” huhifadhi maana ya wazi ya neno la Kigiriki bila kuingiza jina la Mungu lisiloandikwa katika matini.
- source_word: ἐπέστρεψαν
  choice: walirudi
  rationale: Katika muktadha wa safari, neno hili linamaanisha kurudi mahali walikotoka; “walirudi” ni la kawaida na wazi.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: Katika Kiswahili, kitenzi “kurudi” kinaweza kufuatiwa moja kwa moja na jina la mahali, hivyo “walirudi Galilaya” ni cha asili kuliko kuongeza kihusishi kisichohitajika.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: katika mji wao
  rationale: πόλις linaweza kutaja jiji au mji. “Mji” linafaa kwa Nazareti, ambayo ilikuwa makazi madogo, na “wao” huhifadhi wazo la ἑαυτῶν.
- source_word: Ναζαρέθ
  choice: Nazareti
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika “sheria ya Bwana”
  choice: “Bwana” anamrejelea Mungu, ambaye sheria yake imetolewa katika Maandiko.
  alternative: Hakuna usomaji mwingine mkubwa wenye athari ya kitheolojia katika muktadha huu.
  rationale: Huu ni usemi wa kawaida wa Kiyahudi na Kimaandiko. Tafsiri ya moja kwa moja inaonyesha utii wa familia hii bila kuongeza dai jingine la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “walipokwisha kutimiza” unaonyesha mfuatano wa simulizi kwa kawaida; “mji wao” ni mfupi na wa asili huku ukihifadhi umilikaji wenye msisitizo wa matini.
