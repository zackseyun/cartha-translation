base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: sw
  text: 'Na hii ndiyo ishara kwenu: mtamkuta mtoto mchanga amefungwa kwa vitambaa[a] na amelala katika hori[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amefungwa nguo za kitoto.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, chombo cha kulishia wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: ishara
  rationale: Neno hili hapa linataja alama ya kuwatambulisha wachungaji mtoto, bila kulifanya kwa lazima kuwa uthibitisho wa kimiujiza.
- source_word: εὑρήσετε
  choice: mtamkuta
  rationale: Ni wakati ujao, nafsi ya pili wingi; “mtamkuta” ni usemi wa kawaida wa Kiswahili unaofaa mtu anayetarajiwa kupatikana mahali fulani.
- source_word: βρέφος
  choice: mtoto mchanga
  rationale: βρέφος humaanisha mtoto aliye mdogo sana; “mtoto mchanga” ni wazi, wa asili, na sahihi katika muktadha wa kuzaliwa.
- source_word: ἐσπαργανωμένον
  choice: amefungwa kwa vitambaa
  rationale: Kitenzi kinamaanisha kumfunga mtoto kwa vitambaa. Tafsiri hii inaeleza tendo kwa lugha ya sasa bila kutumia istilahi ngumu.
- source_word: κείμενον
  choice: amelala
  rationale: κεῖμαι inaeleza hali au mkao wa mtoto. “Amelala” ni ya asili katika Kiswahili na haibadili hali hiyo kuwa tendo la mtu kumlaza.
- source_word: φάτνῃ
  choice: katika hori
  rationale: φάτνη ni chombo ambamo wanyama hulia chakula. “Hori” ni neno fupi na lililozoeleka katika simulizi hili; ufafanuzi umehifadhiwa katika tanbihi.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: hii ndiyo ishara kwenu
  rationale: Kigiriki kina kishazi kisicho na kitenzi-tendaji kilichotajwa wazi. Kiswahili huweza kukiweka kwa kawaida kama “hii ndiyo ishara kwenu,” bila kulazimisha wakati ujao usioelezwa moja kwa moja.
theological_decisions:
- issue: Asili ya ishara waliyopewa wachungaji
  choice: Aya inatoa ishara ya kumtambua mtoto bila kuitaja wazi kuwa tukio la kimiujiza.
  alternative: Ishara hiyo pia inaweza kueleweka kuwa uthibitisho wa Mungu wenye maana pana ya kitheolojia.
  rationale: Tafsiri inahifadhi neno la moja kwa moja “ishara” na hali isiyo ya kawaida ambayo wachungaji watamkuta mtoto, lakini haiongezi ufafanuzi wa kimafundisho usiotamkwa na aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mtoto mchanga,” “vitambaa,” na “hori” huhifadhi picha halisi ya Kigiriki kwa mtindo wa asili.
