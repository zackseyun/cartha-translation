  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: sw
  text: Watu wote walikuwa wakienda kuandikishwa[a], kila mmoja kwenda mji wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusajiliwa.” Kitenzi hiki kinahusu kuingizwa rasmi katika orodha ya sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: walikuwa wakienda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea katika simulizi, kulingana na hali ya kitenzi cha Kigiriki isiyotimilika.
- source_word: πάντες
  choice: watu wote
  rationale: Huwasilisha maana ya jumla ya πάντες kwa Kiswahili cha kawaida bila kuifanya sentensi kuwa nzito.
- source_word: ἀπογράφεσθαι
  choice: kuandikishwa
  rationale: Katika muktadha huu neno linamaanisha kusajiliwa rasmi kwa ajili ya sensa; “kuandikishwa” ni la kawaida na linaeleweka, huku tanbihi ikifafanua maana ya kiutawala.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi msisitizo wa Kigiriki wa mgawanyo kwa mtu mmoja mmoja.
- source_word: ἑαυτοῦ
  choice: wake
  rationale: Kiwakilishi hiki cha umilikaji kinakubaliana kiasili na “kila mmoja” na huhifadhi umoja wa usemi wa Kigiriki.
- source_word: πόλιν
  choice: mji
  rationale: “Mji” ni tafsiri pana na ya kawaida ya πόλις katika Kiswahili, bila kuongeza wazo la “mji wa nyumbani” au “mji wa asili” lisilotajwa moja kwa moja hapa.
theological_decisions:
- issue: Usemi wa mgawanyo ἕκαστος ... ἑαυτοῦ ulio katika umoja wa kiume kisarufi
  choice: kila mmoja katika mji wake
  alternative: kila mtu katika mji wao wenyewe
  rationale: Kiswahili hutumia kwa kawaida “kila mmoja ... wake,” ambako umoja huhifadhiwa bila kulazimisha jinsia ya kibaolojia. Hii inadumisha muundo wa mgawanyo wa chanzo na kuepuka kuongeza tafsiri kuhusu nani hasa aliyeenda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Walikuwa wakienda” huhifadhi mwendelezo wa tendo; “katika mji wake” ni ya asili zaidi hapa kuliko “kwenda mji wake,” huku ikifuata εἰς kwa maana ya kuelekea mahali.
