  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Hilohilo” huhifadhi msisitizo wa τῇ αὐτῇ. Alama za tanbihi zimewekwa mara moja kila moja katika matini kuu na kufuata vipengele vinavyoelezwa.
