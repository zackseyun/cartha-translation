  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: sw
  text: Katika eneo hilohilo kulikuwa na wachungaji waliokuwa wakikaa nje mashambani[a], wakilinda kundi lao wakati wa malindo ya usiku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliokuwa wakilala nje mashambani.” Kitenzi cha Kigiriki kinakazia kwamba wachungaji walikuwa wakipitisha usiku nje uwandani.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakilinda malindo ya usiku juu ya kundi lao,” jambo linaloweza kudokeza vipindi vya ulinzi, labda kwa kupokezana zamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: wachungaji
  rationale: Neno hili kwa kawaida humaanisha watu wanaochunga kondoo; “wachungaji” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: katika eneo hilohilo
  rationale: χώρα hapa ni eneo au sehemu ya jirani iliyotajwa; “eneo hilohilo” ni ya asili na hailipanui kuwa nchi nzima.
- source_word: ἀγραυλοῦντες
  choice: waliokuwa wakikaa nje mashambani usiku
  rationale: Kitenzi kinasisitiza kukaa au kulala nje uwandani wakati wa usiku; tafsiri hii inaeleza mazingira hayo kwa Kiswahili cha kawaida.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: wakilinda ... kwa zamu za usiku
  rationale: Muundo wa maneno yenye mzizi mmoja unaonyesha kulinda katika vipindi vya lindo la usiku, huenda kwa kupokezana; “kwa zamu za usiku” huhifadhi wazo hilo kwa uwazi.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: kundi lao
  rationale: ποίμνη ni kundi la kondoo lililo chini ya uangalizi wao; katika muktadha huu “kundi lao” ni fupi na la kawaida baada ya kutaja wachungaji.
- source_word: Καὶ ... ἦσαν
  choice: kulikuwa na
  rationale: Katika Kiswahili, mwanzo wa aya hii unaendelea kwa kawaida kutoka simulizi iliyotangulia bila kulazimika kutafsiri καί kwa “na”; “kulikuwa na” huanzisha wahusika wapya kwa ufasaha.
