base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: sw
  text: Palikuwa pia na nabii wa kike, Ana, binti Fanueli, wa kabila la Asheri. Alikuwa amezeeka sana[a], naye alikuwa ameishi na mume wake kwa miaka saba tangu ubikira wake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi, “alikuwa amesonga mbele katika siku nyingi,” nahau yenye maana ya kuwa mzee sana.
    reason: lexical_alternative
  - marker: b
    text: Yaani, alikuwa ameishi na mume wake kwa miaka saba baada ya kuolewa na kuacha hali ya ubikira.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: nabii wa kike
  rationale: Nomino ya Kigiriki ni ya jinsia ya kike na inamtambulisha Ana waziwazi kuwa mwanamke mwenye huduma ya kinabii. “Nabii wa kike” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: θυγάτηρ Φανουήλ
  choice: binti Fanueli
  rationale: Huu ni usemi wa moja kwa moja wa ukoo; muundo huu ni wa asili katika Kiswahili.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: wa kabila la Asheri
  rationale: ἐκ hapa huonyesha asili au uhusiano wa kikabila. “Wa kabila la Asheri” ni Kiswahili cha kawaida na sahihi.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: alikuwa amezeeka sana
  rationale: Hii inawasilisha maana ya nahau ya Kigiriki kwa Kiswahili cha kawaida. Taswira halisi ya ‘kusonga mbele katika siku nyingi’ imehifadhiwa katika tanbihi.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: alikuwa ameishi na mume wake
  rationale: Katika muktadha huu, ἀνήρ humaanisha mume na kifungu kinazungumzia maisha ya ndoa, si kukaa pamoja tu.
- source_word: ἔτη ἑπτὰ
  choice: kwa miaka saba
  rationale: Tafsiri ya moja kwa moja ya muda uliotajwa.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: tangu ubikira wake
  rationale: Usemi huu unabaki karibu na muundo wa Kigiriki bila kuweka katika matini kuu ufafanuzi mahususi zaidi wa namna miaka hiyo ilivyohesabiwa.
theological_decisions:
- issue: Utambulisho wa Ana kama προφῆτις
  choice: Ana anatajwa wazi kuwa nabii wa kike.
  alternative: Kulifanya neno hili kuwa cheo cha heshima tu au kumwita mshiriki wa ibada bila huduma ya kinabii.
  rationale: Kigiriki kinatumia nomino ya kawaida ya ‘nabii’ katika umbo la kike; hakuna sababu ya kudhoofisha utambulisho huo.
- issue: Maelezo ya umri wa Ana
  choice: Matini kuu inatoa maana ya nahau kuwa alikuwa amezeeka sana, huku tanbihi ikihifadhi taswira halisi ya Kigiriki.
  alternative: Kutafsiri neno kwa neno ‘alikuwa amesonga mbele katika siku nyingi’ au kuingiza hapa hesabu ya umri inayohusiana na mstari unaofuata.
  rationale: Kiswahili cha neno kwa neno kingekuwa kigumu na kisicho cha kawaida, na mstari huu wenyewe hautoi hesabu kamili ya umri wake.
- issue: Muda wa miaka saba kuhusiana na ubikira wake
  choice: Kudumisha usemi ‘tangu ubikira wake’ na kueleza maana inayowezekana katika tanbihi.
  alternative: Kusema moja kwa moja ‘miaka saba baada ya kuolewa’ katika matini kuu.
  rationale: Kigiriki kina usemi mfupi ambao unaweza kuhitaji ufafanuzi; tanbihi huepuka kuufanya ufafanuzi huo kuwa sehemu ya maneno ya Luka.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka: Ana, Fanueli, na Asheri. Alama za tanbihi [a] na [b] zimewekwa kwenye vifungu vinavyohusika.'
