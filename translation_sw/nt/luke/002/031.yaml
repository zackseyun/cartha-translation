  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazi mbele ya watu wote”; nahau ya Kigiriki inaweza kumaanisha kitu kilichowekwa wazi machoni pa wote.
    reason: lexical_alternative
  - marker: b
