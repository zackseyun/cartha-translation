lexical_decisions:
- source_word: ὃ
  choice: ambao
  rationale: Kiwakilishi hiki kinarejelea “wokovu” katika mstari uliotangulia; upatanisho wa ngeli ya “wokovu” unahitaji “ambao”.
- source_word: ἡτοίμασας
  choice: umeuandaa
  rationale: Kitenzi kinamwelekea Mungu katika nafsi ya pili umoja. “Umeuandaa” ni Kiswahili cha kawaida na huonyesha tendo lililokamilishwa lenye umuhimu katika muktadha huu.
- source_word: κατὰ πρόσωπον
  choice: mbele ya
  rationale: Nahau hii ina maana ya kitu kuwekwa mbele ya wengine au machoni pao. “Mbele ya” ni ya kawaida, yenye heshima, na inadumisha wazo la kuonekana wazi.
- source_word: πάντων
  choice: wote
  rationale: Hutoa maana ya ujumla ya kivumishi cha Kigiriki na kupatana na “watu”.
- source_word: τῶν λαῶν
  choice: watu
  rationale: Katika Kiswahili, “watu wote” ni usemi wa asili unaoweza kuwajumuisha watu wa makundi mbalimbali. Tanbihi inadumisha uwezekano wa kuelewa wingi wa Kigiriki kuwa “jamii zote za watu” au “mataifa yote.”
theological_decisions:
- issue: Upeo na maana ya λαῶν kwa kuhusiana na mstari unaofuata
  choice: watu wote
  alternative: jamii zote za watu; mataifa yote
  rationale: “Watu wote” ni Kiswahili cha kawaida na chenye upeo mpana, bila kutanguliza tofauti kati ya watu wa mataifa na Israeli inayofafanuliwa katika mstari wa 32. Tanbihi inadumisha maana ya makundi mengi iliyopo katika wingi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “mbele ya watu wote” ni wa asili kwa wasomaji wa kawaida, huku tanbihi zikihifadhi nahau ya Kigiriki na uwezekano wa kuelewa λαῶν kama jamii za watu au mataifa.
