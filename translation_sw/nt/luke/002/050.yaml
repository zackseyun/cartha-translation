  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: sw
  text: Nao hawakuelewa lile neno alilowaambia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kauli,” “usemi,” au “jambo.”
    reason: Neno la Kigiriki ῥῆμα linaweza kurejelea neno lililosemwa, usemi, kauli, au jambo.
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kawaida bila kuongeza maana ya upinzani ambayo haijaelezwa wazi katika Kigiriki.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi hiki kinawarejelea wazazi wa Yesu katika muktadha. Kiswahili kinakibeba kwa kawaida ndani ya “Nao,” huku uwepo wake wa wazi katika Kigiriki ukihifadhiwa.
- source_word: οὐ συνῆκαν
  choice: hawakuelewa
  rationale: Kitenzi συνίημι hapa kina maana ya kuelewa au kufahamu. “Hawakuelewa” ni lugha ya kawaida na inaeleza wazi ukosefu wa ufahamu bila kuudhoofisha kuwa kutokuelewa kikamilifu.
- source_word: τὸ ῥῆμα
  choice: lile neno
  rationale: ῥῆμα inaweza kumaanisha neno, usemi, kauli, au jambo. Katika muktadha huu inarejelea alichokuwa amesema Yesu; “lile neno” ni fasaha katika mtindo wa Biblia na huhifadhi upana wa neno la Kigiriki.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: alilowaambia
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili kwa usemi aliounena kwao. Muundo wa “-waambia” unajumuisha tendo la kusema na wale walioambiwa bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Jinsi simulizi linavyoeleza mwitikio wa wazazi wa Yesu
  choice: Kusema wazi kwamba hawakuelewa neno la Yesu
  alternative: Hawakuelewa kikamilifu; hawakul接受 au hawakukubali
  rationale: Kigiriki kinaeleza ukosefu wa kuelewa, si kuelewa kwa sehemu wala kukataa. Tafsiri inadumisha mvutano wa simulizi kuhusu utambulisho na utume wa Yesu bila kuuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Nao” hudumisha mtiririko wa simulizi, na “lile neno” linaunganisha kauli hii na maneno ya Yesu yaliyotangulia.
