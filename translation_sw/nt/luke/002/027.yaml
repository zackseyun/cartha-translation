base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: sw
  text: Naye akaingia hekaluni kwa uongozi wa Roho[a]; wazazi walipomleta mtoto Yesu ili wamtendee sawasawa na desturi ya Sheria[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho.” Maneno ya Kigiriki yanaweza kutafsiriwa kwa namna zote mbili; muktadha unaonyesha kwamba hapa anatajwa Roho Mtakatifu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “wazazi.” Luka anatumia hapa lugha ya kawaida ya kifamilia kuhusu Maria na Yosefu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: kwa uongozi wa Roho
  rationale: Muktadha wa Luka 2:25–27 unaelekeza kwa Roho Mtakatifu. Kiswahili ‘kwa uongozi wa Roho’ huonyesha kwamba Roho ndiye aliyemwelekeza Simeoni, ingawa muundo wa Kigiriki unaweza kueleweka pia kwa namna iliyo karibu zaidi na ‘katika Roho.’
- source_word: ἱερόν
  choice: hekaluni
  rationale: Neno hili linamaanisha eneo la Hekalu kwa ujumla, si patakatifu pa ndani pekee. ‘Hekaluni’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: walipomleta ... ndani
  rationale: Muundo huu una maana ya wakati; ‘walipomleta ... ndani’ ni wa asili na huhifadhi jambo hilo.
- source_word: γονεῖς
  choice: wazazi
  rationale: Hii ndiyo maana ya kawaida ya neno la Kigiriki na ndiyo lugha ya kawaida ya kifamilia ambayo Luka anatumia kwa Maria na Yosefu katika jukumu lao la kumlea Yesu.
- source_word: παιδίον Ἰησοῦν
  choice: mtoto Yesu
  rationale: παιδίον hapa humaanisha mtoto mchanga; ‘mtoto Yesu’ ni usemi wa kawaida na ulio wazi.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: ili wamfanyie
  rationale: 'Muundo unaonyesha kusudi: wazazi walikusudia kufanya kwa ajili ya Yesu jambo lililohusiana na matakwa ya Sheria.'
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: kama ilivyokuwa desturi ya Sheria
  rationale: εἰθισμένον hueleza jambo lililozoeleka au lililowekwa kuwa desturi. Tafsiri hii ni wazi na ya asili huku ikihifadhi uhusiano wake na Sheria.
theological_decisions:
- issue: Roho anayehusika katika tendo la Simeoni
  choice: Roho Mtakatifu, ikitafsiriwa ‘kwa uongozi wa Roho’
  alternative: roho au msukumo wa ndani wa Simeoni
  rationale: Marejeo yanayorudiwa ya Roho Mtakatifu katika Luka 2:25–27 yanaunga mkono sana maana hii; tanbihi inahifadhi uwezekano wa kutafsiri muundo wa kihusishi kwa namna iliyo karibu zaidi na maneno ya Kigiriki.
- issue: Kutumia ‘wazazi’ kwa Maria na Yosefu
  choice: Kutafsiri γονεῖς moja kwa moja kuwa ‘wazazi’
  alternative: walezi; Yosefu na Maria
  rationale: Luka anatumia lugha ya kawaida ya kijamii na kifamilia. Tafsiri hii haisemi kwamba Yosefu alikuwa baba wa Yesu kibiolojia, wala haikanushi kutungwa kwake kwa uwezo wa Roho; inafuata tu maelezo ya simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Sheria’ imeandikwa kwa herufi kubwa kwa kuwa inarejelea Sheria ya Musa. Sentensi imeachwa na koma mwishoni kwa sababu mstari unaendelea katika aya inayofuata.
