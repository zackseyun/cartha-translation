  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: sw
  text: 'Akasema, “Nitafanya hivi: nitabomoa ghala zangu na kujenga zilizo kubwa zaidi, nami nitakusanya humo nafaka yote[b] na mali zangu.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Nafaka” (σῖτος) katika baadhi ya miktadha inaweza kumaanisha hasa “ngano.”
    reason: lexical_alternative
  - marker: c
    text: Au “milki zangu” kwa “mali zangu” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Nitafanya hivi
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kauli ya kusisitiza mpango anaotaka kutekeleza.
- source_word: καθελῶ
  choice: nitabomoa
  rationale: Huonyesha wazi kitendo cha kuangusha majengo yaliyopo.
- source_word: ἀποθήκας
  choice: ghala zangu
  rationale: Katika muktadha wa kuhifadhi mavuno, “ghala” ni neno la kawaida na sahihi kwa mahali pa kuhifadhia nafaka.
- source_word: μείζονας οἰκοδομήσω
  choice: kujenga zilizo kubwa zaidi
  rationale: Hujaza nomino iliyodokezwa kwa kurejelea ghala na kuhifadhi maana ya ulinganisho.
- source_word: συνάξω ἐκεῖ
  choice: nitakusanya humo
  rationale: “Humo” hurejelea kwa kawaida ndani ya ghala zitakazojengwa bila kuongeza ufafanuzi usio wa lazima.
- source_word: πάντα τὸν σῖτον
  choice: nafaka yangu yote
  rationale: “Nafaka” huhifadhi upana wa σῖτος, ambayo katika baadhi ya miktadha inaweza kumaanisha hasa ngano; kimilikishi kinaeleweka kutokana na msemaji na ulinganifu na mali zake.
- source_word: τὰ ἀγαθά μου
  choice: mali zangu
  rationale: Huwasilisha vitu vyake vyenye thamani au milki zake bila kuifanya maana iwe pesa pekee.
