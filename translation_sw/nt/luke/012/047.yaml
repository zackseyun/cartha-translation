  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: sw
  text: Lakini mtumwa yule aliyejua mapenzi ya bwana wake, hakujitayarisha wala kutenda kulingana na mapenzi yake, atapigwa mapigo mengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno zaidi, “atapigwa mara nyingi.” Kigiriki hakitaji nomino ya “mapigo” waziwazi, bali inaidokeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili humaanisha mtu aliye chini ya mamlaka ya bwana kama mali yake, si mfanyakazi wa kuajiriwa; “mtumwa” linaweka wazi uhusiano huo katika mfano.
- source_word: γνοὺς
  choice: aliyejua
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali ya kuwa tayari ameyajua mapenzi ya bwana wake.
- source_word: θέλημα
  choice: mapenzi
  rationale: “Mapenzi” ni tafsiri ya kawaida na inayofaa kwa kusudi au matakwa ya bwana katika muktadha huu.
- source_word: κυρίου αὐτοῦ
  choice: bwana wake
  rationale: Katika mfano huu κύριος ni mwenye mamlaka juu ya mtumwa; herufi ndogo na kiwakilishi “wake” vinaonyesha uhusiano wa nyumbani bila kulazimisha hapa matumizi ya moja kwa moja kama cheo cha Mungu.
- source_word: ἑτοιμάσας
  choice: kujitayarisha
  rationale: Kitenzi cha kujirejelea ni cha asili kwa Kiswahili na kinaacha kitu kinachotayarishwa bila kutajwa, kama ilivyo katika Kigiriki.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: wala kutenda kulingana na mapenzi yake
  rationale: Baada ya ukanushi, “wala” ni njia ya asili ya kuunganisha kushindwa huku kwa pili, huku “kutenda kulingana na” kikihifadhi wazo la kufanya yanayopatana na mapenzi yake.
- source_word: δαρήσεται
  choice: atapigwa
  rationale: Huhifadhi hali ya wakati ujao na kauli tendwa, pamoja na picha halisi ya adhabu ya kimwili.
- source_word: πολλάς
  choice: mapigo mengi
  rationale: Kigiriki kina kivumishi cha wingi huku nomino ikidokezwa; “mapigo mengi” hutaja nomino hiyo kwa uwazi bila kugeuza picha kuwa maelezo ya jumla kama “ataadhibiwa vikali.”
theological_decisions:
- issue: Maana ya κύριος katika mazingira ya mfano wa nyumba
  choice: bwana
  alternative: Bwana
  rationale: Neno hapa linaeleza uhusiano kati ya mtumwa na mwenye mamlaka juu yake ndani ya mfano. “bwana” huhifadhi maana hiyo bila kufuta uwezekano wa rejeo pana la mfano, wala kulifanya moja kwa moja kuwa cheo cha kimungu katika sentensi hii.
- issue: Kauli ya adhabu δαρήσεται πολλάς
  choice: atapigwa mapigo mengi
  alternative: atapigwa mara nyingi; atapigwa sana
  rationale: Tafsiri iliyochaguliwa huhifadhi picha halisi na wingi unaodokezwa na Kigiriki. “Atapigwa sana” ingeweza kufasiri wingi kuwa ukali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “hakujitayarisha wala kutenda” ni wa kawaida chini ya ukanushi, na “bwana” linafaa kwa mazingira ya mfano wa mtumwa na mwenye nyumba.
