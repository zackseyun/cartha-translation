  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: sw
  text: Kweli ninawaambia kwamba atamweka asimamie mali yake yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vyake vyote” au “milki yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Kweli
  rationale: Kielezi hiki husisitiza ukweli na uzito wa kauli; “Kweli” ni cha kawaida na chenye nguvu katika Kiswahili.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi usemi wa moja kwa moja kwa wingi katika lugha ya sasa iliyo ya kawaida.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha maudhui ya kauli kwa njia ya kawaida katika Kiswahili.
- source_word: ἐπὶ
  choice: asimamie
  rationale: Pamoja na καταστήσει, huonyesha kuwekwa katika mamlaka au usimamizi juu ya kitu.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: mali yake yote
  rationale: Kirai hiki kinamaanisha kila kitu kilicho chake; “mali yake yote” ni wazi, asilia, na hakikomei kwa aina moja ya milki.
- source_word: καταστήσει
  choice: atamweka
  rationale: Katika muktadha huu humaanisha kumweka au kumteua mtu katika jukumu; muundo “atamweka asimamie” huwasilisha maana hiyo kwa Kiswahili asilia.
- source_word: αὐτόν
  choice: -m- katika “atamweka”
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea mtumishi/msimamizi wa kiume katika mfano.
theological_decisions:
- issue: Rejeleo la kiume katika muktadha wa mfano
  choice: Kudumisha rejeleo la mtu mmoja kwa “atamweka”
  alternative: Kutumia muundo usioonyesha idadi au jinsia wazi, kama “atamweka mtu huyo”
  rationale: Kigiriki kinamrejelea mhusika mmoja wa kiume katika mfano. Kiswahili hakionyeshi jinsia katika kiambishi hiki, lakini hudumisha umoja bila kuongeza au kuondoa dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “atamweka asimamie” ni wa kawaida na unaonyesha wazi uteuzi pamoja na mamlaka ya usimamizi.
