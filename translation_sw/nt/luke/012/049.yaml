  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: sw
  text: Nimekuja kutupa moto duniani[a], na jinsi ninavyotamani ungekuwa tayari umewashwa!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata maneno ya Kigiriki kwa karibu zaidi: “Nami nataka nini, ikiwa moto tayari umewashwa?” Kishazi cha Kigiriki ni kigumu; maandishi makuu yanaonyesha maana inayowezekana ya msemo huo kuwa hamu kubwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: moto
  rationale: Neno lisilo na kibainishi limetafsiriwa kwa urahisi kama “moto,” huku taswira yake ikihifadhiwa bila kuifasiri moja kwa moja kuwa hukumu, utakaso, Roho, au mgawanyiko.
- source_word: ἦλθον
  choice: Nimekuja
  rationale: Kauli hii ya utume au kusudi inasikika kwa kawaida zaidi katika Kiswahili kama “Nimekuja,” huku ikiwakilisha aoristi ya Kigiriki kwa uaminifu wa kimuktadha.
- source_word: βαλεῖν
  choice: kuwasha
  rationale: Ingawa maana ya msingi ya βάλλω ni kutupa, katika muungano na “moto” Kiswahili cha kawaida husema “kuwasha moto.” Hili linahifadhi tendo lenye nguvu bila kutumia usemi usio wa kawaida “kutupa moto.”
- source_word: ἐπὶ τὴν γῆν
  choice: duniani
  rationale: γῆ hapa ina upeo mpana, hivyo “duniani” ni ya asili na haibani maana kuwa nchi au eneo fulani.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: nami natamani sana kwamba ungekuwa tayari umewashwa!
  rationale: Kishazi hiki kigumu kimewasilishwa kama mshangao wa hamu kubwa, maana inayowezekana zaidi kimuktadha; tanbihi inahifadhi muundo wa karibu zaidi na maneno ya Kigiriki.
- source_word: ἤδη
  choice: tayari
  rationale: “Tayari” huonyesha kwamba kuwashwa kunatamaniwa kuwa kumekwisha kutokea.
- source_word: ἀνήφθη
  choice: ungekuwa ... umewashwa
  rationale: Muundo huu unaonyesha hali tendwa na hamu isiyotimizwa, na unaendeleza taswira ya moto kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya “moto” katika kauli ya Yesu
  choice: Taswira imehifadhiwa kama “moto” bila kufafanuliwa.
  alternative: hukumu; utakaso; Roho Mtakatifu; au mgogoro na mgawanyiko unaoletwa na utume wa Yesu
  rationale: Aya yenyewe haitaji wazi moto huo ni nini. Kutoufafanua kunahifadhi utata na mvutano wa kiteolojia wa chanzo.
- issue: Nguvu ya kishazi τί θέλω εἰ ἤδη ἀνήφθη
  choice: Kimetafsiriwa kama mshangao unaoonyesha hamu kubwa.
  alternative: 'Swali la karibu na maneno halisi: “Nami nataka nini ikiwa tayari umewashwa?”'
  rationale: Muundo wa Kigiriki ni mgumu. Tafsiri ya hamu kubwa inaendana vizuri na muktadha na Kiswahili cha kawaida, lakini tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi na chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nimekuja kuwasha moto duniani” ni cha asili kuliko “kutupa moto duniani,” huku tanbihi ikihifadhi ugumu halisi wa kishazi cha mwisho.
