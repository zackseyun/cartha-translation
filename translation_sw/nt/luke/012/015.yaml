base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: sw
  text: Kisha akawaambia, “Jihadharini, na mjilinde dhidi ya kila aina ya tamaa ya kujipatia zaidi[a], kwa maana maisha ya mtu hayamo katika kuwa na mali nyingi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “choyo cha kila namna.” Neno la Kigiriki πλεονexia linaweza kumaanisha choyo, tamaa ya mali, au hamu ya pupa ya kujipatia zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Angalieni
  rationale: Amri ya wingi ina nguvu ya onyo; “Angalieni” ni ya kawaida, yenye heshima, na hudumisha wito wa kuwa macho.
- source_word: φυλάσσεσθε
  choice: mjilinde
  rationale: Umbo la kati la amri lina maana ya kujikinga wenyewe; “mjilinde” huhifadhi wazi maana hiyo ya kujilinda.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: na kila aina ya tamaa
  rationale: πλεονεξία hapa ni hamu ya kujipatia zaidi kwa pupa. “Kila aina ya tamaa” huonyesha upana wa πάσης bila kuibana maana kuwa kutamani mali ya mwingine pekee.
- source_word: ὅτι
  choice: kwa maana
  rationale: Huanzisha sababu ya onyo. “Kwa maana” huunganisha sentensi kwa Kiswahili cha asili na chenye hadhi.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: uhai wa mtu hautokani na wingi
  rationale: Kirai hicho kinakataa kwamba uhai wa mtu unatokana au kuamuliwa na kuwa na vitu vingi; “hautokani na wingi” ni wazi na ya kawaida.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: wa mali alizo nazo
  rationale: ὑπάρχοντα humaanisha vitu vinavyomilikiwa. “Mali alizo nazo” ni fasaha na huonyesha milki bila kudokeza mali isiyohamishika pekee.
theological_decisions:
- issue: Upana wa onyo kuhusu πλεονεξία
  choice: kila aina ya tamaa
  alternative: tamaa yote ya mali / choyo cha kila namna
  rationale: Onyo linahusu hamu ya pupa ya kujipatia zaidi kwa mapana, si kutamani mali ya mwingine katika maana finyu tu. Tanbihi huhifadhi uwezekano wa “choyo” au “tamaa ya kupata zaidi.”
- issue: Kauli ya jumla yenye umoja wa kiume
  choice: uhai wa mtu ... mali alizo nazo
  alternative: uhai wake ... vitu alivyo navyo
  rationale: τινί na αὐτοῦ/αὐτῷ zinaeleza mtu yeyote kwa ujumla. “Mtu” huwasilisha maana jumuishi bila kuifanya kauli iwahusu wanaume pekee.
- issue: Uhusiano kati ya uhai na mali
  choice: uhai wa mtu hautokani na wingi wa mali alizo nazo
  alternative: uhai wa mtu haumo katika wingi wa mali zake
  rationale: Tafsiri inahifadhi dai kwamba wingi wa mali si chanzo au msingi wa uhai, bila kuongeza kwamba mali zote ni mbaya au kwamba aya inafafanua kikamilifu maana ya uhai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri mbili “Angalieni, na mjilinde” umehifadhi msisitizo wa Kigiriki; “mali alizo nazo” ni lugha ya kawaida inayoeleweka kwa urahisi.
