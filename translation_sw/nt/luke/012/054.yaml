  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: sw
  text: Alikuwa pia akiwaambia makundi ya watu, “Mnapoona wingu likiinuka upande wa magharibi, mara moja mnasema, ‘Mvua inakuja,’ na ndivyo inavyotokea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Kauli ya wakati uliopita usiotimilika inadokeza usemi uliokuwa ukiendelea; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: δὲ καὶ
  choice: Pia
  rationale: Inaonyesha kuendelea kwa simulizi pamoja na nyongeza, bila kulazimisha kutafsiri δέ kwa kiunganishi tofauti.
- source_word: τοῖς ὄχλοις
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia nomino ya mk集合 'umati wa watu' kurejelea makundi ya watu kwa namna ya asili.
- source_word: Ὅταν ἴδητε
  choice: Mnapoona
  rationale: Hutoa maana ya jambo linalotokea kwa kawaida au kwa wakati wowote hali hii inapotimia.
- source_word: νεφέλην
  choice: wingu
  rationale: Neno lenyewe linamaanisha wingu; wazo la mvua linatokana na muktadha.
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: likitokea upande wa magharibi
  rationale: Katika muktadha wa hali ya hewa, usemi huu wa Kiswahili unaeleza kwa kawaida wingu linaloinuka au kuonekana katika upande wa magharibi.
- source_word: εὐθέως
  choice: mara moja
  rationale: Huhifadhi nguvu ya kitendo kinachofuata bila kuchelewa.
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati wa sasa hapa unaonyesha tendo la kawaida.
- source_word: Ὄμβρος
  choice: mvua kubwa
  rationale: ὄμβρος inaweza kumaanisha mvua kwa ujumla au mvua nzito; 'mvua kubwa' ni ya kawaida na inahifadhi maana iliyo mahsusi zaidi.
- source_word: ἔρχεται
  choice: inakuja
  rationale: Huonyesha mvua iliyo karibu kunyesha kwa lugha ya kawaida.
- source_word: γίνεται οὕτως
  choice: nayo hunyesha hivyo
  rationale: Kiswahili cha kimuktadha kinaeleza kwamba mvua iliyotabiriwa kweli hunyesha, badala ya kauli isiyo asili 'inatokea hivyo'.
