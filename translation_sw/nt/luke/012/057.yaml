translation:
  language: sw
  text: Na kwa nini ninyi wenyewe hamhukumu lililo sawa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lililo la haki” au “jambo lililo sahihi.”
