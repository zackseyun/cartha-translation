lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Na kwa nini
  rationale: Muundo huu unaendeleza hoja ya awali kwa swali la balagha. “Na kwa nini” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kiunganishi bila kutafsiri kila chembe kwa namna ngumu.
- source_word: ἀφ’ ἑαυτῶν
  choice: ninyi wenyewe
  rationale: Kirai hiki kinaonyesha kufanya tathmini kwa uwezo au uamuzi wao wenyewe. “Ninyi wenyewe” ni cha asili na hakiongezi wazo lisilo katika chanzo.
- source_word: οὐ κρίνετε
  choice: hamtambui
  rationale: Katika muktadha huu κρίνω inahusu kutathmini na kufikia uamuzi sahihi. “Hamtambui” huwasilisha uamuzi wa kiakili kwa Kiswahili cha kawaida, ingawa “hamhukumu” au “hamuamui” yanawezekana.
- source_word: τὸ δίκαιον
  choice: yaliyo sawa
  rationale: Kivumishi hiki cha jinsia ya kati kimetumiwa kama nomino, kikimaanisha jambo lililo sahihi au la haki. “Yaliyo sawa” huhifadhi upana wa kimaadili na kiutendaji bila kulifanya kuwa istilahi ya kisheria pekee.
theological_decisions:
- issue: Maana ya τὸ δίκαιον
  choice: yaliyo sawa
  alternative: yaliyo ya haki; jambo linalofaa
  rationale: Usemi huu unahusu utambuzi wa kimaadili na wa kiutendaji. Tafsiri iliyochaguliwa huhifadhi maana pana na haibani kifungu katika haki ya kisheria pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa, na tanbihi inaonyesha upana halisi wa τὸ δίκαιον.
