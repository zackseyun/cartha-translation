  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: sw
  text: Viuno vyenu na viwe vimefungwa, na taa zenu ziwe zinawaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Muwe mmevaa tayari kutenda.” Taswira ni ya kukusanya mavazi marefu na kuyafunga kiunoni ili kuwa tayari kutenda.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: na ...
  rationale: Amri ya nafsi ya tatu katika wakati uliopo inaelezwa kwa muundo wa himizo “na ...,” unaosikika wa kawaida na wenye heshima katika Kiswahili.
- source_word: ὑμῶν
  choice: vyenu / zenu
  rationale: 'Kiwakilishi kimilikishi kimepatana kisarufi na nomino zote mbili: “viuno vyenu” na “taa zenu.”'
- source_word: ὀσφύες
  choice: viuno
  rationale: Neno hilo linataja eneo la kiuno. “Viuno” huhifadhi taswira halisi bila kutumia lugha ya kizamani au yenye maana pana kupita kiasi.
- source_word: περιεζωσμέναι
  choice: vifungwe kwa mikanda
  rationale: Huhifadhi taswira ya kufunga vazi kiunoni kwa mkanda. Hali ya utayari inayodokezwa na umbo timilifu imefafanuliwa katika tanbihi bila kuondoa taswira katika matini kuu.
- source_word: λύχνοι
  choice: taa
  rationale: Neno linamaanisha taa halisi, katika mazingira haya taa ya mafuta, si nuru kwa ujumla.
- source_word: καιόμενοι
  choice: ziendelee kuwaka
  rationale: Huonyesha hali inayoendelea ya taa kuwaka, kama inavyodokezwa na kirai endelevu cha Kigiriki.
theological_decisions:
- issue: Taswira ya kiutamaduni kuhusu kuwa tayari
  choice: Kuhifadhi taswira halisi ya viuno kufungwa kwa mikanda katika matini kuu
  alternative: Vaeni tayari kwa kazi / Iweni tayari kutenda
  rationale: Kigiriki kinatumia taswira mahususi ya kukusanya na kufunga mavazi marefu ili mtu awe tayari. Matini kuu inaihifadhi badala ya kuibadili kuwa ufafanuzi pekee; maana ya taswira inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vifungwe kwa mikanda” huhifadhi sitiari ya chanzo huku tanbihi ikisaidia wasomaji wasioifahamu desturi hiyo.
