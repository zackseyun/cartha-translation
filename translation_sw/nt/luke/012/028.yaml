  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa: Mungu huivika mimea ya shambani ya muda mfupi, itakayotupwa tanuruni, na hoja ya kutoka kidogo hadi kikubwa pamoja na mwito «enyi wenye imani haba» vimewasilishwa. Hata hivyo, «majani» yanaweza kueleweka hasa kuwa majani ya miti, ilhali χόρτος hapa ni nyasi/uoto wa shambani. Pia kuna kutofautiana kwa ngeli kati ya «majani» (wingi) na «huivika» (umoja).'
  naturalness: 'Marekebisho ya «nyasi za shambani» huondoa utata wa kawaida wa «majani» na kuruhusu upatanisho wa ngeli ulio wazi: «huzivika ... ambazo zipo ... hutupwa». Muundo «je, hatawavika ninyi zaidi sana» unaeleweka, lakini «si zaidi sana atawavika ninyi» ni swali la balagha lenye mtiririko wa kawaida zaidi katika Kiswahili Sanifu.'
  terminology: «Tanuru» ni sahihi kwa κλίβανος. «Enyi wenye imani haba» ni tafsiri ya asili na yenye kiasi ya ὀλιγόπιστοι. Tanbihi ya tanuru irejeleze nyasi kavu kama fueli bila kuziita «kuni», ambazo kwa kawaida ni vipande vya mti.
