    rationale: Nyasi kavu zinaweza kuwa fueli ya kuwasha tanuru, lakini kwa matumizi ya kawaida «kuni» hurejelea hasa vipande vya mti. Ufafanuzi wa «kutumiwa kuwasha tanuru» ni sahihi zaidi.
