  to: Lakini ikiwa Mungu huzivika hivyo nyasi za shambani[a], ambazo zipo leo na kesho hutupwa katika tanuru[b], si zaidi sana atawavika ninyi, enyi wenye imani haba!
  rationale: Matini imerekebishwa ili χόρτος itafsiriwe kwa uwazi kama «nyasi za shambani», na viambishi vya ngeli vilingane. Swali la balagha limepangwa upya kwa mtiririko wa Kiswahili bila kubadili nguvu ya πόσῳ μᾶλλον. Tanbihi imeboreshwa ili kueleza matumizi ya nyasi kavu kama fueli kwa usahihi wa kawaida.
