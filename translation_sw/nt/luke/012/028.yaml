  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: sw
  text: Lakini ikiwa Mungu huzivika hivyo nyasi za shambani[a], ambazo zipo leo na kesho hutupwa katika tanuru[b], si zaidi sana atawavika ninyi, enyi wenye imani haba!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uoto wa shambani” au “majani.”
    reason: lexical_alternative
  - marker: b
    text: “Tanuru” hapa ni tanuru la kuokea mikate; nyasi kavu za shambani zingeweza kutumiwa kuwasha tanuru.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: majani
  rationale: Katika muktadha huu χόρτος ni uoto wa shambani unaodumu kwa muda mfupi na unaweza kukaushwa na kutumiwa kama kuni; “majani” ni neno la kawaida na pana la Kiswahili kuliko “nyasi” pekee.
- source_word: ἐν ἀγρῷ
  choice: ya shambani
  rationale: Huwasilisha mahali pa uoto huo kwa Kiswahili cha kawaida bila kubainisha shamba fulani.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: ambayo yapo leo na kesho yanatupwa
  rationale: Muundo wa viambishi katika Kigiriki umepanuliwa kwa kawaida katika Kiswahili huku ukihifadhi utofauti kati ya leo na kesho na udhaifu wa uoto huo.
- source_word: κλίβανον
  choice: tanuru
  rationale: κλίβανος ni tanuru la kuokea, si furnesi ya viwandani; “tanuru” ni sahihi na linaeleweka katika muktadha huu.
- source_word: ἀμφιέζει
  choice: huivika / hatawavika
  rationale: Kitenzi kinamaanisha kuvika. Mnyambuliko huu huhifadhi picha ya Mungu kuupamba uoto kama kwa vazi na kuiendeleza kwa wanadamu.
- source_word: πόσῳ μᾶλλον
  choice: je, hatawavika ninyi zaidi sana
  rationale: Huwasilisha hoja ya kutoka jambo dogo kwenda kubwa kwa Kiswahili cha asili, huku hali ya baadaye ikieleweka kutoka kwa swali la balagha.
- source_word: ὀλιγόπιστοι
  choice: enyi wenye imani haba
  rationale: Hifadhi mwito wa moja kwa moja na karipio lenye kiasi bila kuufanya usemi kuwa fundisho maalumu kuhusu wokovu au uasi.
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Huhifadhi mwendelezo wenye utofauti mdogo katika hoja.
- source_word: οὕτως
  choice: hivyo
  rationale: Huonyesha namna Mungu anavyouvika uoto kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Nguvu ya ὀλιγόπιστοι katika mwito wa Yesu
  choice: 'Karipio la moja kwa moja lakini lenye kiasi: “enyi wenye imani haba”'
  alternative: Karipio kali la kukasirika, au maelezo yasiyo na karipio kuhusu udhaifu wa tumaini
  rationale: Neno hilo linakosoa upungufu wa kumtumaini Mungu lakini halitoi kauli ya kiufundi kuhusu imani iokoayo au uasi; tafsiri hudumisha mvutano na sauti ya kichungaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na mwito wa mwisho umehifadhiwa; alama zote za tanbihi [a] na [b] zimo katika matini.
