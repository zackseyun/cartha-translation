  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: sw
  text: Kwa hiyo, yote mliyosema gizani yatasikiwa nuruni, na mlichosema sikioni katika vyumba vya ndani kitatangazwa juu ya paa za nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka juu ya paa za nyumba.” Taswira ni ya tangazo la hadharani kutoka kwenye paa tambarare za nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu mambo yaliyofichwa kufunuliwa. “Kwa hiyo” ni ya kawaida na huonyesha uhusiano huo wazi.
- source_word: ὅσα
  choice: yote
  rationale: Neno hili linahusu kwa upana mambo yote yaliyosemwa kwa siri. “Yote” ni la asili katika Kiswahili na linadumisha maana hiyo jumuishi.
- source_word: ἐν τῇ σκοτίᾳ
  choice: gizani
  rationale: “Gizani” hudumisha taswira ya giza na pia maana ya kusema kwa siri, huku ikilinganishwa moja kwa moja na “nuruni.”
- source_word: ἐν τῷ φωτί
  choice: nuruni
  rationale: “Nuruni” huhifadhi ulinganifu wa kimafumbo na wa moja kwa moja kati ya giza na nuru bila kuufafanua kupita kiasi kuwa ni hadharani.
- source_word: ἀκουσθήσεται
  choice: yatasikiwa
  rationale: Hili linahifadhi hali ya kutendwa na wakati ujao wa kitenzi cha Kiyunani.
- source_word: πρὸς τὸ οὖς
  choice: sikioni
  rationale: Usemi huu unaonyesha kusema kwa faragha, kana kwamba ni kunong’ona katika sikio la mtu. “Sikioni” ni mfupi, wa asili, na hudumisha picha ya asili.
- source_word: ἐν τοῖς ταμείοις
  choice: katika vyumba vya ndani
  rationale: ταμεῖον inaweza kuwa chumba cha ndani, ghala, au chumba cha faragha. Katika muktadha huu, “vyumba vya ndani” huonyesha mahali pa faragha bila kuifanya maana iwe ghala pekee.
- source_word: κηρυχθήσεται
  choice: kitatangazwa
  rationale: Kitenzi hiki kina maana ya kutangaza hadharani kama mjumbe. “Kitatangazwa” huwasilisha maana hiyo bila kuingiza maana finyu ya kuhubiri kidini.
- source_word: ἐπὶ τῶν δωμάτων
  choice: juu ya paa za nyumba
  rationale: Tafsiri hii inafuata taswira ya kutangaza hadharani ukiwa juu ya paa tambarare za nyumba na kudumisha maana ya msingi ya kihusishi ἐπί.
theological_decisions:
- issue: Asili na wakati wa kufunuliwa kwa yaliyofichwa
  choice: Kauli imetafsiriwa kama onyo la jumla kwamba yaliyosemwa kwa siri yatawekwa wazi, bila kutaja wakati au njia ya kufunuliwa huko.
  alternative: Kuitafsiri waziwazi kuwa inahusu hukumu ya mwisho pekee, au kufichuliwa kwa unafiki katika historia ya sasa pekee.
  rationale: Muktadha wa karibu unahusu kufichuliwa kwa unafiki, lakini mstari wenyewe hausemi kwa uwazi kama kufunuliwa huku ni katika hukumu ya mwisho, kwa matendo ya Mungu katika historia, au kwa njia nyingine. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Ulinganifu wa “gizani—nuruni” na “vyumba vya ndani—juu ya paa” umehifadhiwa. Alama ya tanbihi imewekwa kwenye kirai kinachohusika moja kwa moja.
