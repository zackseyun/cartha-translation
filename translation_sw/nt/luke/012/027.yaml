id: LUK.12.27
reference: Luke 12:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: sw
  text: 'Yatafakarini mayungiyungi[a], jinsi yanavyokua: hayafanyi kazi wala hayasokoti. Lakini nawaambia, hata Sulemani katika utukufu wake wote[b] hakuvikwa kama ua mojawapo la hayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maua ya porini” au “maua”; Kigiriki kinataja mayungiyungi.
    reason: lexical_alternative
  - marker: b
    text: Au “katika fahari yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Yaangalieni kwa makini
  rationale: Amri hii inataka uchunguzi wenye fikira, si kutazama kijuujuu tu. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: τὰ κρίνα
  choice: maua ya yungiyungi
  rationale: Neno κρίνα linataja mayungiyungi; tafsiri mahususi imehifadhiwa badala ya kulipanua kimya kimya kuwa maua kwa ujumla.
- source_word: πῶς αὐξάνει
  choice: jinsi yanavyokua
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja kwa sababu ya muundo wa nomino ya wingi isiyo na jinsia, Kiswahili hutumia upatanisho wa wingi kwa njia ya kawaida.
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: hayafanyi kazi wala hayasokoti
  rationale: 'Tafsiri hii inahifadhi matendo mawili yanayotofautishwa na mavazi: kufanya kazi na kusokota nyuzi.'
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini nawaambia
  rationale: δέ inaonyesha badiliko au utofautishaji mdogo, na “lakini” linaendeleza msisitizo wa hoja kwa Kiswahili cha kawaida.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: katika utukufu wake wote
  rationale: “Utukufu” huhifadhi upana wa maana ya δόξα na hapa inaeleweka kuwa fahari ya kifalme.
- source_word: περιεβάλετο
  choice: hakuvikwa
  rationale: Muundo huu unahifadhi taswira ya kuvikwa bila kumtaja kwa lazima aliyemvika Sulemani.
- source_word: ὡς ἓν τούτων
  choice: kama ua mojawapo la hayo
  rationale: “Ua” limeongezwa kwa uwazi wa kisarufi katika Kiswahili, huku “hayo” yakirejelea maua yaliyotajwa.
theological_decisions:
- issue: Marejeo ya taswira ya maua
  choice: Maua ya yungiyungi yametajwa mahususi.
  alternative: maua; maua ya porini
  rationale: Kigiriki kinatumia κρίνα. Hakuna sababu ya kiteolojia ya kulipanua neno hilo kuliko ushahidi wa chanzo.
- issue: Maana ya δόξα katika maelezo ya Sulemani
  choice: utukufu
  alternative: fahari
  rationale: “Utukufu” ni wazi katika muktadha na huhifadhi pia mwangwi mpana wa neno δόξα bila kuondoa maana ya fahari ya kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kusomeka kwa sauti, na lugha ya mavazi na ukuaji imehifadhiwa bila kuongeza maelezo ya kimadhehebu.
