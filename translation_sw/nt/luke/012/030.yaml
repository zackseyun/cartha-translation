id: LUK.12.30
reference: Luke 12:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: sw
  text: Kwa maana mataifa ya ulimwengu[a] hutafuta mambo hayo yote, lakini Baba yenu anajua kwamba mnahitaji mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio Wayahudi wa ulimwengu.” Neno la Kigiriki linaweza kumaanisha “mataifa” au “watu wasio Wayahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: mambo hayo yote
  rationale: Kirai hiki kinarejelea mahitaji ya kimwili yaliyotajwa katika muktadha. Tafsiri hii inaonyesha wazi kuwa πᾶς inaeleza mambo hayo, si mataifa.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: mataifa ya ulimwengu
  rationale: ἔθνη inaweza kumaanisha mataifa au watu wasio Wayahudi. ‘Mataifa ya ulimwengu’ inahifadhi upana wa usemi wa Kigiriki bila kuufanya kuwa wa kikabila kupita kiasi.
- source_word: ἐπιζητοῦσιν
  choice: hutafuta
  rationale: Kitenzi hiki kinaonyesha kufuatilia au kutafuta kwa bidii. Katika Kiswahili cha sasa, ‘hutafuta’ ni cha kawaida na, kwa kuzingatia muktadha, kinawasilisha vizuri shughuli ya mara kwa mara bila usemi mzito usio wa asili.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: Baba yenu
  rationale: Hii inafuata maneno yaliyomo katika Kigiriki. Neno ‘wa mbinguni’ halijaongezwa kutoka kifungu sambamba.
- source_word: οἶδεν
  choice: anajua
  rationale: Ingawa umbo la Kigiriki ni la wakati timilifu, hapa lina maana ya hali ya sasa; ‘anajua’ ni tafsiri ya kawaida na ya asili.
- source_word: χρῄζετε
  choice: mnahitaji
  rationale: Huwasilisha moja kwa moja maana ya kuwa na uhitaji kwa Kiswahili cha sasa.
- source_word: τούτων
  choice: mambo hayo
  rationale: Kurudia kirai hiki kunahifadhi rejeo lililo wazi na msisitizo wa usemi wa Kigiriki.
theological_decisions:
- issue: Tofauti kati ya utafutaji wa mataifa na tumaini la wanafunzi kwa Baba yao
  choice: Kudumisha ‘mataifa ya ulimwengu’ na ‘Baba yenu’ bila ufafanuzi wa ziada
  alternative: Kutafsiri ἔθνη kuwa ‘watu wasio Wayahudi’ au kuongeza ‘wa mbinguni’ baada ya ‘Baba yenu’
  rationale: Tafsiri inahifadhi tofauti iliyomo katika mstari kati ya utafutaji wa ulimwengu na uhusiano wa wanafunzi na Mungu kama Baba, bila kupunguza maana ya ἔθνη au kuingiza maneno yasiyopatikana katika maandishi ya Luka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Mpangilio umehakikisha kuwa ‘yote’ inaeleza ‘mambo hayo,’ kama ilivyo katika Kigiriki, wala si ‘mataifa.’
