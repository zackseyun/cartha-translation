  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: sw
  text: Na kila mtu atakayesema neno dhidi ya Mwana wa Adamu atasamehewa[a]; lakini anayemkufuru Roho Mtakatifu hatasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki husema, kwa ukaribu, “atasamehewa,” huku kosa linalosamehewa likidokezwa. Kiswahili cha kawaida humrejelea mtu kwa kauli tendwa: “atasamehewa.”'
    reason: Muundo wa Kigiriki una kitenzi tendwa pamoja na mpokeaji wa kitendo, ilhali kosa linalosamehewa halitajwi wazi.
lexical_decisions:
- source_word: πᾶς ὃς
  choice: kila mtu atakaye-
  rationale: Muundo huu una maana ya jumla inayomhusu kila mmoja. “Kila mtu atakaye…” ni Kiswahili cha kawaida na huhifadhi wigo wa kauli hiyo.
- source_word: ἐρεῖ λόγον
  choice: atasema neno
  rationale: Huhifadhi nomino λόγον (“neno”) na wakati ujao wa ἐρεῖ kwa lugha ya asili na inayoeleweka.
- source_word: εἰς τὸν υἱὸν τοῦ ἀνθρώπου
  choice: dhidi ya Mwana wa Adamu
  rationale: Katika muktadha wa usemi wa upinzani na kufuru, εἰς inaelezwa kwa kawaida kuwa “dhidi ya.” “Mwana wa Adamu” ni tafsiri iliyozoeleka ya jina hili la cheo.
- source_word: ἀφεθήσεται αὐτῷ
  choice: atasamehewa
  rationale: Kiswahili hutaja kwa kawaida mtu anayepokea msamaha kwa kauli tendwa. Hii hutoa maana ya Kigiriki kwa uwazi, huku tanbihi ikionyesha muundo wake halisi zaidi.
- source_word: τῷ ... βλασφημήσαντι
  choice: anayemkufuru
  rationale: Kirai tegemezi cha jumla kinafaa katika kauli hii. Hakiongezi kwa lazima wazo la tendo lililokamilika ambalo wakati wa aoristi hapa haulazimishi katika tafsiri.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa na lenye heshima katika Kiswahili.
- source_word: οὐκ ἀφεθήσεται
  choice: hatasamehewa
  rationale: Huhifadhi ukanushi wa wakati ujao na uzito wa kauli ya Kigiriki bila kuongeza ufafanuzi.
theological_decisions:
- issue: Tofauti kati ya kusema neno dhidi ya Mwana wa Adamu na kumkufuru Roho Mtakatifu
  choice: Kuhifadhi tofauti hiyo kama ilivyo katika mstari bila kufafanua kwa nini kosa moja linasameheka na jingine halisameheki.
  alternative: Kufasiri kifungu cha kwanza kuwa kutenda kwa kutojua na cha pili kuwa kutotubu kabisa, au kukipanua kwa kuoanisha na vifungu sambamba.
  rationale: Mstari wenyewe unasisitiza tofauti katika kusamehewa lakini haufafanui utaratibu wake; tafsiri haipaswi kutatua mvutano wa kiteolojia ambao matini imeuacha wazi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu bora: unafuata Kigiriki kwa karibu bila kutumia kauli ngumu au isiyo ya kawaida katika Kiswahili.'
