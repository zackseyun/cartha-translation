id: LUK.12.37
reference: Luke 12:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: sw
  text: Heri watumwa[a] wale ambao bwana[b] atakapokuja atawakuta wakiwa macho. Amin, nawaambia, atajifunga tayari kuhudumu[c], atawaketisha mezani[d], kisha atawafikia na kuwahudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.” Neno la Kigiriki δοῦλοι linaweza kutafsiriwa kulingana na muktadha, lakini hapa uhusiano wao na bwana wa nyumba unaonyesha hadhi ya watumwa.
    reason: lexical_alternative
  - marker: b
    text: Au “Bwana.” Katika mazingira ya mfano, neno la Kigiriki κύριος linaweza kumaanisha bwana au mkuu wa nyumba.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “atajifunga.” Mtu alijifunga au kukaza mavazi yake ili awe tayari kufanya kazi ya huduma.
    reason: cultural_note
  - marker: d
    text: Kwa maana halisi, “atawafanya waegemee kwa kula,” yaani wajilaze kwa kuegemea mezani. Wakati huo watu walikuwa na desturi ya kula wakiwa wameegemea mezani.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Ni namna ya kawaida na yenye hadhi ya kutaja hali ya kubarikiwa katika semi za heri; haipunguzi maana kuwa hisia ya furaha pekee.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Taswira ya nyumba inaonyesha wazi uhusiano wa walio chini ya mamlaka ya bwana; “watumwa” huakisi hadhi hiyo kuliko “watumishi,” huku mbadala ukiwekwa katika tanbihi.
- source_word: κύριος
  choice: bwana
  rationale: Katika mfano huu neno linaweza kumaanisha mkuu wa nyumba, huku pia likibeba mwangwi mpana wa “Bwana.” Herufi ndogo huhifadhi mazingira ya mfano bila kufunga mwangwi huo.
- source_word: γρηγοροῦντας
  choice: wakiwa macho
  rationale: Hutoa maana halisi ya kutolala na pia hudokeza kuwa tayari na kukesha.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amin, nawaambia
  rationale: Huhifadhi kwa uwazi kanuni ya mkazo iliyo katika Kigiriki na inaeleweka katika Kiswahili cha Biblia.
- source_word: περιζώσεται
  choice: atajifunga tayari kuhudumu
  rationale: Hueleza tendo la kujifunga mavazi ili kufanya kazi, kwa lugha inayoeleweka leo, bila kuacha picha ya kitamaduni kabisa.
- source_word: ἀνακλινεῖ αὐτούς
  choice: atawaketisha mezani
  rationale: Huwasilisha kusudi la kuwafanya washiriki mlo mezani kwa Kiswahili cha kawaida; desturi halisi ya kuegemea wakati wa kula imefafanuliwa katika tanbihi.
- source_word: παρελθὼν διακονήσει αὐτοῖς
  choice: kisha atakuja na kuwahudumia
  rationale: Huwasilisha mwendo wa bwana kwenda kwa walio mezani na kuwafanyia huduma, hasa huduma ya chakulani.
theological_decisions:
- issue: Maana ya κύριος katika mfano wenye uwezekano wa mwangwi wa kikristo
  choice: bwana
  alternative: Bwana; mkuu wa nyumba
  rationale: “bwana” inafaa kwa mkuu wa nyumba katika simulizi na bado neno lenyewe linaweza kusikika kwa maana pana ya “Bwana”; tafsiri haibani kwa lazima upande mmoja.
- issue: Hadhi inayodokezwa na δοῦλοι
  choice: watumwa
  alternative: watumishi
  rationale: Uhusiano wa mamlaka katika nyumba ni sehemu muhimu ya picha ya mfano. “Watumwa” huhifadhi ukali wa hadhi ya kijamii bila kugeuza mstari kuwa dai la kiitikadi kuhusu utumwa.
- issue: Kubadilishwa kwa majukumu wakati bwana anawahudumia watumwa
  choice: kuhifadhi wazi kwamba bwana mwenyewe anajifunga na kuwahudumia
  alternative: kutumia kauli isiyoonyesha mtendaji wazi
  rationale: Mfuatano wa vitenzi vya Kigiriki unasisitiza tendo la kushangaza la bwana kuwahudumia watumwa; tafsiri imelihifadhi bila kueleza maana yake ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Heri” na “Amin, nawaambia” huhifadhi uzito wa usemi wa Yesu; sentensi nyingine imetumia maneno yanayoeleweka kwa wasomaji wa sasa. Tanbihi zimehifadhi tofauti za kileksika na picha za kitamaduni ambazo zisingekuwa wazi katika tafsiri ya moja kwa moja.
