base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: sw
  text: Hata akija katika zamu ya pili ya usiku[a], au hata akija katika zamu ya tatu, akawakuta wakiwa hivyo, heri watumishi hao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza wazi zaidi: “katika zamu ya pili ya usiku, au katika zamu ya tatu ya usiku.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri halisi, “heri hao.” Hao ni watumishi waliotajwa katika muktadha wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Hata ... au hata
  rationale: 'Muundo huu unahifadhi maana ya hali inayokubaliwa na msisitizo unaorudiwa: kuja kwake kunaweza kuwa katika mojawapo ya zamu hizo.'
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: wakati wa zamu ya pili ya usiku ... wakati wa zamu ya tatu
  rationale: φυλακή hapa ni kipindi cha ulinzi wakati wa usiku. Neno “zamu” ni la kawaida na linaloeleweka; “ya usiku” imeelezwa mara ya kwanza na inaeleweka pia kwa zamu ya tatu.
- source_word: ἔλθῃ
  choice: akija
  rationale: Kauli ya masharti yenye kitenzi cha aoristi katika hali tegemezi inaelezwa kwa kawaida kwa “akija,” ikihifadhi uwezekano wa wakati ujao.
- source_word: εὕρῃ οὕτως
  choice: kuwakuta wakiwa hivyo
  rationale: οὕτως inarejelea hali yao iliyoelezwa katika mstari uliotangulia. Yambwa “wa-” limetolewa kutoka kwa muktadha ili Kiswahili kiwe cha asili.
- source_word: μακάριοι
  choice: wamebarikiwa
  rationale: Utoaji huu unahifadhi uzito wa kibiblia wa kuwa katika hali yenye kibali, badala ya kupunguza maana kuwa furaha ya kihisia tu.
- source_word: ἐκεῖνοι
  choice: watumishi hao
  rationale: Kiwakilishi cha kuonyesha kinamaanisha kihalisi “hao”; “watumishi” limeongezwa kwa uwazi kutokana na warejelewa waliotajwa katika muktadha wa karibu.
theological_decisions:
- issue: Kutaja wazi kinachorejelewa na ἐκεῖνοι
  choice: watumishi hao
  alternative: hao
  rationale: Kigiriki kina kiwakilishi cha kuonyesha tu, lakini kinarejelea wazi watumishi wa bwana katika muktadha wa karibu. Kuandika “watumishi hao” kunasaidia ufafanuzi bila kuongeza dai jipya la kiteolojia; tanbihi inahifadhi umbo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Zamu ya usiku” ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi isiyoelezwa ya vipindi vya ulinzi. Mpangilio unabaki karibu na Kigiriki huku ukitumia muundo wa asili wa Kiswahili.
