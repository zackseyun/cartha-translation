  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: sw
  text: 'Lakini nawaambia ninyi, rafiki zangu: msiwaogope wale wanaoua mwili, na baada ya hayo hawawezi kufanya jambo lolote zaidi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Lakini nawaambia
  rationale: δέ ni kiunganishi chenye nguvu ndogo kinachoashiria mpito au utofautishaji katika hotuba. “Lakini” linaonyesha mpito huo bila kuufanya kuwa mkali kupita kiasi.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: ninyi, rafiki zangu
  rationale: Kirai cha pili kinafafanua wanaoambiwa; tafsiri hii inahifadhi kiwakilishi cha wingi pamoja na namna ya kirafiki ambayo Yesu anawaita wasikilizaji wake.
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: msiwaogope wale wanaoua
  rationale: Muundo wenye μή unatoa katazo, na ἀπό baada ya φοβέομαι huonyesha walengwa wa hofu. Kiswahili kwa kawaida hutumia kitenzi “ogopa” pamoja na yambwa moja kwa moja.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: σῶμα hapa ni mwili wa kimwili; hakuna sababu ya kuongeza wazo la nafsi ambalo halikutajwa katika mstari huu.
- source_word: καὶ μετὰ ταῦτα
  choice: na baada ya hayo
  rationale: Kirai hiki kina maana ya wakati na kinaonyesha kinachofuata baada ya kuuawa kwa mwili.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: hawana jambo lingine zaidi wanaloweza kufanya
  rationale: 'Muundo huu unasisitiza kikomo cha uwezo wao: baada ya kuua mwili, hawana uwezo wa kufanya jambo jingine zaidi.'
theological_decisions:
- issue: Upeo wa uwezo wa wanadamu baada ya kifo cha mwili
  choice: Mstari unasema tu kwamba wanaweza kuua mwili, kisha hawawezi kufanya jambo jingine zaidi.
  alternative: Kufafanua kwamba hawawezi kuua nafsi.
  rationale: Ingawa mstari unaofuata unaonyesha mamlaka makubwa zaidi ya Mungu, mstari huu hautaji nafsi waziwazi. Tafsiri haiongezi ufafanuzi wa kitheolojia kutoka muktadha unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Rafiki zangu” ni usemi wa kawaida na wa karibu; “msiwaogope” ni katazo la moja kwa moja na la asili. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya Kiingereza kuhusu mahali pa kuambatisha wazo hilo haitokezi kama tofauti halisi ya maana katika Kiswahili.
