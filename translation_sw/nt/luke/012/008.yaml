source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: sw
  text: 'Nami ninawaambia: Kila mtu atakayenikiri[a] mbele ya watu, Mwana wa Adamu naye atamkiri mbele ya malaika wa Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayenitambua waziwazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Nami ninawaambia
  rationale: Kauli hii inaendeleza mazungumzo kwa msisitizo bila kuifanya δέ kuwa kiunganishi chenye upinzani mkali. “Nami ninawaambia” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: πᾶς ὃς ἂν
  choice: Kila mtu atakaye-
  rationale: Muundo huu unaeleza hali ya jumla isiyo na mtu maalumu; “kila mtu atakaye-” huhifadhi upeo wake wa wote na ni wa asili katika Kiswahili.
- source_word: ὁμολογήσῃ ἐν ἐμοὶ
  choice: atakayenikiri
  rationale: Katika muktadha huu ὁμολογέω pamoja na ἐν humaanisha kumtambua au kumkiri Yesu hadharani. “Kunikiri” ni Kiswahili cha moja kwa moja, huhifadhi uzito wa tamko la wazi, na huepuka tafsiri ngumu isiyo ya asili ya “kukiri ndani yangu.”
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: ἔμπροσθεν ni “mbele ya/katika uwepo wa,” na ἀνθρώπων hapa inawahusu wanadamu kwa ujumla. “Watu” huwasilisha maana hiyo kwa usahihi na kwa Kiswahili cha kawaida.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja kwa Yesu lenye uzito wa kimaandiko; tafsiri iliyozoeleka “Mwana wa Adamu” huhifadhi cheo hicho bila kukifafanua kupita kiasi.
- source_word: ὁμολογήσει ἐν αὐτῷ
  choice: naye atamkiri
  rationale: Kitenzi kilekile cha Kigiriki kinarudiwa ili kuonyesha ulinganifu wa kukiriana. “Atamkiri” huhifadhi uhusiano huo, huku “naye” ikionyesha tendo linalolingana la Mwana wa Adamu.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: mbele ya malaika wa Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili inayohifadhi mazingira ya ushuhuda wa hadharani mbele ya viumbe wa mbinguni.
theological_decisions:
- issue: Muundo wa kukiriana wenye ἐν pamoja na hali ya tatu
  choice: Kutafsiri kimaanana kuwa “atakayenikiri … atamkiri.”
  alternative: “atakayekiri ndani yangu … atakiri ndani yake”
  rationale: Tafsiri ya neno kwa neno ya kihusishi ἐν ingekuwa ngumu na isiyoeleweka vizuri katika Kiswahili. Muundo uliochaguliwa unawasilisha kutambuliwa kwa wazi na kuhifadhi ulinganifu wa matendo hayo bila kuongeza fundisho lisilosemwa.
- issue: Upeo wa ἀνθρώπων
  choice: “watu,” likiwa neno linalowahusu wanadamu wote
  alternative: “wanaume”
  rationale: Ingawa umbo la Kigiriki ni wingi wa kisarufi, katika muktadha huu lina nguvu ya uwakilishi kwa wanadamu kwa ujumla. “Watu” ndiyo tafsiri sahihi na ya kawaida katika Kiswahili, bila kuzuia maana kwa wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. “Kukiri” limetumiwa kwa maana ya kumtambua Yesu waziwazi, si kwa maana finyu ya kuungama kosa; tanbihi inatoa mbadala unaofafanua maana hiyo.
