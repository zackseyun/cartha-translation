  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: sw
  text: Akawaza moyoni mwake, akisema, “Nifanye nini, kwa kuwa sina mahali pa kukusanya mazao yangu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: akawaza
  rationale: Kitenzi hiki katika wakati usiotimilika huonyesha mchakato wa kutafakari na kujadiliana ndani ya nafsi; “akawaza” ni cha kawaida na huhifadhi wazo la tafakari ya ndani.
- source_word: ἐν ἑαυτῷ
  choice: moyoni
  rationale: Katika Kiswahili, “moyoni” ni njia ya kawaida na ya heshima ya kueleza fikira za ndani bila kudokeza kwamba alisema kwa sauti.
- source_word: λέγων
  choice: “…”
  rationale: Maneno yanayofuata yamewasilishwa moja kwa moja kama yaliyomo katika mawazo yake; katika Kiswahili si lazima kuongeza “akisema” baada ya “akawaza moyoni.”
- source_word: Τί ποιήσω
  choice: Nifanye nini
  rationale: Hili ni swali la kujishauri; umbo la Kiswahili “Nifanye nini?” huwasilisha kwa kawaida maana ya swali la Kigiriki la uamuzi.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa kiunganishi kinatoa sababu ya swali lake; “kwa kuwa” ni cha kawaida na chenye hadhi.
- source_word: οὐκ ἔχω ποῦ
  choice: sina mahali pa
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya usemi unaomaanisha kutokuwa na mahali pa kufanyia jambo.
- source_word: συνάξω
  choice: kukusanya
  rationale: “Kukusanya” hudumisha maana ya msingi ya kuyaleta pamoja mazao, huku muktadha wa maghala katika aya zinazofuata ukidokeza kuyaweka akiba.
- source_word: τοὺς καρπούς μου
  choice: mazao yangu
  rationale: Katika muktadha wa kilimo, καρποί humaanisha kile kilichozalishwa na shamba; “mazao” ni wazi na si finyu kama “matunda.”
