  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kigiriki: kitenzi cha wakati ujao cha mgawanyiko, jozi zote za kifamilia zinazokinzana, na urudiano wa “dhidi ya.” “Watagawanyika” hudumisha maana ya mgawanyiko bila kuongeza sababu au kugeuza kauli kuwa amri. “Wake” katika jozi ya mwisho ni ufafanuzi wa kawaida wa Kiswahili unaoeleweka kutokana na ulinganifu wa jozi, wala haubadilishi maana.'
