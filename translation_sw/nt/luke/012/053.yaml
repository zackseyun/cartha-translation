id: LUK.12.53
reference: Luke 12:53
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: sw
  text: 'Watagawanyika[a]: baba dhidi ya mwana na mwana dhidi ya baba, mama dhidi ya binti na binti dhidi ya mama, mama mkwe dhidi ya binti-mkwe wake[b], na binti-mkwe dhidi ya mama mkwe wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watatenganishwa.” Kitenzi cha Kigiriki kinakazia kugawanyika kwa watu waliokuwa kundi au nyumba moja.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “binti-mkwe” linaweza pia kumaanisha “bibi-arusi” katika miktadha mingine; hapa kulinganishwa kwake na “mama mkwe” kunaunga mkono maana ya “binti-mkwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: Watagawanyika
  rationale: Kitenzi hiki cha wakati ujao kinaonyesha hali ya kugawanyika kwa watu wa nyumba moja. “Watagawanyika” ni Kiswahili cha kawaida na huhifadhi wazo la mgawanyiko bila kudokeza kwamba ni kutengana kimahali tu.
- source_word: ἐπὶ
  choice: dhidi ya
  rationale: Katika miundo hii inayorudiwa kati ya watu, neno hili linaonyesha upinzani; “dhidi ya” linafikisha maana hiyo kwa uwazi.
- source_word: πατήρ / υἱός
  choice: baba / mwana
  rationale: Maneno haya yanahifadhi uhusiano mahususi wa baba na mtoto wa kiume pamoja na mpangilio wake wa pande mbili.
- source_word: μήτηρ / θυγάτηρ
  choice: mama / binti
  rationale: Maneno haya ni visawe vya kawaida vinavyohifadhi uhusiano mahususi wa mama na mtoto wa kike.
- source_word: πενθερά
  choice: mama mkwe
  rationale: Hili ni neno la kawaida la Kiswahili kwa mama wa mwenzi wa ndoa na linafaa katika uhusiano unaotajwa hapa.
- source_word: νύμφη
  choice: binti-mkwe
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha “bibi-arusi,” kulinganishwa kwake na “mama mkwe” hapa kunaonyesha kwamba maana inayokusudiwa ni mke wa mwana.
- source_word: αὐτῆς
  choice: wake
  rationale: Kiwakilishi cha umilikaji kilicho wazi katika Kigiriki kimehifadhiwa katika “binti-mkwe wake”; pia kimetumiwa mwishoni kwa uwazi na ulinganifu wa kawaida wa Kiswahili.
theological_decisions:
- issue: Asili ya mgawanyiko unaoelezwa
  choice: Maneno yanaeleza upinzani wa kijamii na kifamilia unaotokea kutokana na utume wa Yesu, bila kuutaja kuwa jambo linalopaswa kuidhinishwa.
  alternative: Kuliona hili kuwa methali ya jumla tu kuhusu migogoro ya kifamilia.
  rationale: Muktadha unaotangulia unaunganisha orodha hii na mgawanyiko unaosababishwa na mwitikio kwa Yesu. Tafsiri inadumisha ukali wa kauli bila kuongeza kwamba Yesu anaidhinisha uadui wa kifamilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo unaorudia “dhidi ya” umehifadhiwa ili kuonyesha upinzani wa pande mbili. “Binti-mkwe” limetumiwa badala ya “mkwe” peke yake ili kupunguza utata wa istilahi hiyo katika Kiswahili.
