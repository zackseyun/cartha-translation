  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: sw
  text: 'Kisha akawaambia wanafunzi wake, “Kwa sababu hiyo nawaambia: msihangaikie[a] maisha yenu[b] kuhusu mtakachokula, wala miili yenu kuhusu mtakachovaa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe na wasiwasi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nafsi zenu”; hapa neno la Kigiriki mara nyingi humaanisha maisha katika maana ya uhai wa mtu duniani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Kisha akawaambia
  rationale: δέ ni kiunganishi chepesi cha simulizi; “kisha” huendeleza simulizi kwa Kiswahili cha kawaida bila kulazimisha maana ya upinzani.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: Neno αὐτοῦ linaonyesha umilikaji waziwazi, na μαθηταί kwa kawaida ni “wanafunzi” katika muktadha huu.
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinarejelea mafundisho yaliyotangulia na kuonyesha msingi wa agizo linalofuata.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya usemi wa Yesu kwa wanafunzi wake.
- source_word: μὴ μεριμνᾶτε
  choice: msihangaikie
  rationale: Kitenzi hiki hapa kinaeleza kuhangaika au kuwa na wasiwasi kuhusu mahitaji ya maisha; “msihangaikie” ni lugha ya kawaida na inafaa pamoja na yambwa zinazofuata.
- source_word: τῇ ψυχῇ
  choice: maisha yenu
  rationale: Katika muktadha wa chakula, ψυχή linaelekea kumaanisha uhai au maisha ya kidunia, si hasa nafsi isiyo ya mwili.
- source_word: τί φάγητε
  choice: kwamba mtakula nini
  rationale: Muundo huu unaonyesha jambo linaloweza kusababisha hangaiko na unaelekeza kwenye wakati ujao kwa Kiswahili cha kawaida.
- source_word: μηδὲ τῷ σώματι
  choice: wala miili yenu
  rationale: μηδέ huunganisha sehemu ya pili ya katazo, na wingi wa “miili yenu” ni wa kawaida kwa kundi la watu wanaosemewa.
- source_word: τί ἐνδύσησθε
  choice: kwamba mtavaa nini
  rationale: Kitenzi cha kati ἐνδύω humaanisha kuvaa au kujivika; tafsiri hii ni ya kawaida na inalingana na “mtakula nini.”
theological_decisions:
- issue: Maana ya ψυχή katika muktadha huu
  choice: maisha
  alternative: nafsi
  rationale: Ulinganifu wa chakula kwa ψυχή na mavazi kwa σώμα unaonyesha maisha ya kawaida ya duniani. “Maisha” huhifadhi msisitizo wa kiutendaji bila kuingiza mgawanyo wa kiteolojia kati ya nafsi na mwili ambao mstari huu haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha ulinganifu kati ya maisha/chakula na miili/mavazi huku ukibaki wazi kwa msomaji wa kawaida.
