id: LUK.12.41
reference: Luke 12:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: sw
  text: Ndipo Petro akasema, “Bwana, je, unatuambia sisi mfano huu, au unawaambia watu wote[a] pia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote.” Neno la Kigiriki πάντας lina umbo la wingi wa kiume, lakini hapa limetumika kwa maana ya kijumla kurejelea hadhira pana.
    reason: Mbadala wa kileksia na ufafanuzi wa matumizi ya kijumla ya umbo la kiume.
lexical_decisions:
- source_word: Εἶπεν
  choice: akasema
  rationale: Kitenzi λέγω kinamaanisha ‘kusema.’ Ingawa maneno yanayofuata ni swali, ‘akasema’ huhifadhi kitenzi cha taarifa cha Kigiriki bila kulazimika kukibadili kuwa ‘akauliza.’
- source_word: δὲ
  choice: Ndipo
  rationale: δέ kinaendeleza simulizi na kuonyesha hatua inayofuata; ‘Ndipo’ ni kiunganishi cha asili katika Kiswahili cha simulizi.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida na yenye heshima ya κύριος katika kumwita Yesu moja kwa moja, huku ikiendelea kuruhusu uzito wake wa kikristo bila kuutia chumvi.
- source_word: πρὸς ἡμᾶς
  choice: unatuambia sisi
  rationale: πρός pamoja na kitenzi cha kusema huonyesha wale wanaoelekezewa maneno. ‘Unatuambia sisi’ ni ya asili na inasisitiza utofautishaji uliopo kati ya ‘sisi’ na hadhira pana.
- source_word: τὴν παραβολὴν ταύτην
  choice: mfano huu
  rationale: ‘Mfano’ ni istilahi ya kawaida ya Kiswahili kwa παραβολή katika mafundisho ya Yesu na inafaa kwa fundisho la kifumbo linalorejelewa hapa.
- source_word: λέγεις
  choice: unatuambia … unawaambia
  rationale: Wakati uliopo wa λέγεις unaonyesha kitendo cha sasa. Kurudia kitenzi katika Kiswahili kunafanya walengwa wawili wa swali waeleweke wazi bila kubadili maana.
- source_word: ἢ καὶ
  choice: au … pia
  rationale: ‘Au’ huhifadhi uchaguzi unaotolewa na ἤ, na ‘pia’ huhifadhi nguvu ya nyongeza ya καί.
- source_word: πρὸς πάντας
  choice: unawaambia watu wote
  rationale: πάντας hapa inarejelea hadhira pana kwa maana ya kijumla, si wanaume pekee. ‘Watu wote’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya κύριος Petro anapomwita Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: ‘Bwana’ huhifadhi heshima ya usemi na uwezekano wa uzito wa kikristo wa neno hilo bila kulazimisha hitimisho la kiteolojia ambalo mstari wenyewe haulielezi wazi.
- issue: Wingi wa kiume wa kijumla πάντας
  choice: watu wote
  alternative: wote
  rationale: Umbo la Kigiriki ni wingi wa kiume lakini limetumika kwa maana ya kijumla, likitofautisha ‘sisi’ na hadhira pana. ‘Watu wote’ huepuka kulifanya lirejelee wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa asili na hadhi inayofaa maandiko. ‘Je’ huonyesha wazi kuwa maneno ya Petro ni swali; kurudiwa kwa ‘unatuambia/unawaambia’ huweka wazi uelekeo wa usemi katika Kiswahili.
