base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: sw
  text: Lakini hakuna chochote kilichofunikwa[a] ambacho hakitafunuliwa, wala kilichofichwa[b] ambacho hakitajulikana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilichositiriwa.” Kigiriki kinatumia taswira ya kitu kilichofunikwa na baadaye kufunuliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “siri.”
    reason: lexical_alternative
  - marker: c
    text: Msemo huu unaweza kumaanisha kwa upana kufunuliwa kwa jambo wakati ujao, iwe katika maisha ya sasa au katika hukumu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: hakuna chochote
  rationale: 'Huwasilisha kwa Kiswahili cha kawaida upeo kamili wa kiwakilishi hasi: hakuna kitu hata kimoja.'
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mwendelezo wenye utofautishaji wa kiasi katika muktadha wa onyo.
- source_word: συγκεκαλυμμένον
  choice: kilichofunikwa
  rationale: Huhifadhi taswira ya kitu kilichofunikwa na hali yake ya sasa inayodokezwa na kauli timilifu tendwa.
- source_word: ἀποκαλυφθήσεται
  choice: hakitafunuliwa
  rationale: Kauli ya wakati ujao tendwa inahifadhiwa, pamoja na utofauti wa wazi kati ya kufunikwa na kufunuliwa.
- source_word: κρυπτὸν
  choice: kilichofichwa
  rationale: Ni tafsiri ya kawaida na pana ya kitu kilicho siri au kisichoonekana, bila kukibana kuwa siri ya aina fulani.
- source_word: γνωσθήσεται
  choice: hakitajulikana
  rationale: Huhifadhi wakati ujao na maana tendwa/matokeo ya jambo kuja kujulikana.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: ambacho haki-
  rationale: Muundo wa kishazi rejeshi hasi unahifadhiwa kwa Kiswahili cha asili katika vifungu viwili sambamba.
theological_decisions:
- issue: Upeo na nguvu ya msemo
  choice: Kanuni ya jumla kwamba kilichofichwa sasa hatimaye kitafunuliwa au kujulikana
  alternative: Kufunuliwa hasa katika hukumu ya mwisho, au kufichuliwa kwa unafiki katika wakati wa sasa pekee
  rationale: Vitenzi vya wakati ujao tendwa vinaonyesha kufunuliwa baadaye bila kutaja wakati wake. Tafsiri haibani maana kuwa ya sasa tu wala ya hukumu ya mwisho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Usambamba wa vifungu vya Kigiriki umehifadhiwa bila kufanya sentensi iwe ngumu.
