  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: sw
  text: Ndivyo ilivyo kwa mtu anayejikusanyia hazina na si tajiri kwa Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu anayejikusanyia hazina na si tajiri mbele za Mungu.”
    reason: Mbadala wa kileksia kwa εἰς θεόν, ambao unaweza kueleza hali ya mtu mbele ya Mungu.
lexical_decisions:
- source_word: οὕτως
  choice: Ndivyo ilivyo kwa
  rationale: Huonyesha hitimisho linalotokana na mfano uliotangulia. Usemi huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya matumizi ya mfano huo.
- source_word: ὁ θησαυρίζων
  choice: mtu anayejikusanyia hazina
  rationale: Kivumishi-ushiriki chenye kibainishi kinamtaja mtu kwa ujumla anayejulikana kwa tendo hili. ‘Anayejikusanyia hazina’ huhifadhi wazo la kukusanya na kuweka akiba ya mali.
- source_word: ἑαυτῷ
  choice: an自jikusanyia
  rationale: Kiambishi cha kujirejelea katika kitenzi kinaonyesha kwamba anakusanya hazina kwa faida yake mwenyewe, kwa lugha ya asili na fupi ya Kiswahili.
- source_word: καὶ μὴ
  choice: lakini si
  rationale: Ingawa καί kwa kawaida ni ‘na,’ hapa Kiswahili cha kawaida hutumia ‘lakini’ kuonyesha kwa uwazi tofauti iliyomo kati ya kujikusanyia hazina na kutokuwa tajiri kwa Mungu bila kubadili maana.
- source_word: εἰς θεὸν
  choice: kwa Mungu
  rationale: Huhifadhi mwelekeo au uhusiano wa utajiri huo kwa Mungu bila kuufafanua kupita kiasi. Uwezekano wa maana ‘mbele za Mungu’ umetajwa katika tanbihi.
- source_word: πλουτῶν
  choice: tajiri
  rationale: Kiswahili hutumia kwa kawaida kivumishi cha hali ‘tajiri’ baada ya ‘si,’ huku kikihifadhi tofauti na hazina ya kidunia.
theological_decisions:
- issue: Mhusika wa jumla katika msemo wa maadili
  choice: mtu anaye-
  alternative: mwanamume anaye-
  rationale: Kiswahili ‘mtu’ huwasilisha kwa kawaida mhusika wa jumla bila kudai kwamba matumizi ya msemo huu yanawahusu wanaume pekee; jinsia ya kisarufi ya Kigiriki hailazimishi jinsia ya kimaana hapa.
- issue: Maana ya kuwa ‘tajiri kwa Mungu’
  choice: kuacha usemi wa kiu关系 ‘tajiri kwa Mungu’ bila ufafanuzi wa ziada
  alternative: tajiri katika mambo yaliyo muhimu kwa Mungu; tajiri mbele za Mungu
  rationale: Kifungu hicho kina maana pana ya kitheolojia ambayo mstari wenyewe hauifafanui. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikitoa uwezekano halali wa ‘mbele za Mungu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Ndivyo ilivyo kwa mtu...’ ni wa kawaida na unaeleweka, huku ‘hazina’ na ‘tajiri kwa Mungu’ vikidumisha taswira na mvutano wa maandishi ya asili.
