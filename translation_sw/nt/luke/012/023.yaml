base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: sw
  text: Kwa maana uhai ni zaidi ya chakula[a], na mwili ni zaidi ya mavazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “nafsi”: neno la Kigiriki ψυχή linaweza kumaanisha “uhai,” “mtu mwenyewe,” au “nafsi”; hapa muktadha unapendelea “uhai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha sababu inayofafanua agizo lililotangulia la kutokuwa na wasiwasi; ni kiunganishi cha kawaida na chenye heshima katika Kiswahili.
- source_word: ψυχή
  choice: uhai
  rationale: Katika muktadha wa kula, wasiwasi, na mahitaji ya mwili, neno hili linamaanisha maisha au uhai wa mtu, si lazima nafsi kama sehemu isiyo ya kimwili.
- source_word: πλεῖόν
  choice: ni zaidi ya
  rationale: Inahifadhi ulinganisho wa Kigiriki bila kuufasiri zaidi kuwa ‘ni muhimu kuliko’; pia imerudiwa katika kishazi cha pili ili maana iwe wazi na ya kawaida.
- source_word: τροφή
  choice: chakula
  rationale: Ni neno la kawaida na la moja kwa moja kwa kile kinacholiwa ili kuendeleza uhai.
- source_word: σῶμα
  choice: mwili
  rationale: Ni rejeo la moja kwa moja kwa mwili wa binadamu, unaolinganishwa na mavazi.
- source_word: ἔνδυμα
  choice: mavazi
  rationale: Ni Kiswahili cha sasa na cha kawaida kwa vitu vinavyovaliwa, huku kikihifadhi maana ya jumla ya umoja wa Kigiriki.
theological_decisions:
- issue: Maana ya ψυχή katika fundisho kuhusu wasiwasi na mahitaji
  choice: uhai
  alternative: nafsi
  rationale: Ulinganifu wa ψυχή na chakula, kisha σώμα na mavazi, unaelekeza kwa uhai wa duniani na maisha ya mtu. Tafsiri hii haikanushi kwamba ψυχή linaweza kumaanisha ‘nafsi’ katika miktadha mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye heshima. Muundo sambamba wa vifungu viwili umehifadhiwa, na ‘ni zaidi ya’ imetumiwa mara zote mbili kwa uwazi.
