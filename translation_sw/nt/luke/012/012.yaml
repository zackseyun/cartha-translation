  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: sw
  text: Kwa maana Roho Mtakatifu atawafundisha saa hiyo hiyo yale mnayopaswa kusema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika saa hiyo” au “wakati huo.” Usemi wa Kigiriki unasisitiza wakati hasa wa hitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza sababu ya ahadi iliyotangulia kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida katika Kiswahili la huyo anayetajwa kama mtendaji wa kitendo cha kufundisha.
- source_word: διδάξει ὑμᾶς
  choice: atawafundisha
  rationale: Wakati ujao umehifadhiwa, na kiambishi -wa- kinaonyesha wazi kuwa ‘ninyi’ ni wingi.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: saa ileile
  rationale: Urudiaji wa ‘ile’ unatoa msisitizo wa αὐτῇ na kuonyesha wakati hususa wa mahitaji.
- source_word: ἃ δεῖ εἰπεῖν
  choice: mnayopaswa kusema nini
  rationale: Inaweka maana ya lazima katika δεῖ huku ikitoa yaliyomo ya mafundisho kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi Roho Mtakatifu anavyowasilishwa
  choice: Ametafsiriwa kama mtendaji binafsi anayewafundisha wanafunzi
  alternative: Kumweleza kama nguvu au uvuvio usio binafsi
  rationale: Roho Mtakatifu ndiye kiima cha kitenzi tendaji ‘atawafundisha’; tafsiri inahifadhi uwasilishaji huo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Nguvu ya δεῖ
  choice: mnayopaswa
  alternative: mnachohitaji au mnachofaa
  rationale: ‘Kupaswa’ huhifadhi wazo la ulazima bila kuamua zaidi ikiwa ni wajibu wa kimaadili au hitaji linalotokana na hali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Saa ileile’ ni ya kawaida na huhifadhi msisitizo wa wakati hususa; wingi wa wasikilizaji unaonekana katika ‘atawafundisha’ na ‘mnayopaswa.’
