  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: sw
  text: Ninakuambia, hakika hutatoka humo mpaka uwe umelipa hata lepta ya mwisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sarafu ndogo ya mwisho.” Lepta ilikuwa sarafu ndogo sana ya Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Ninakuambia
  rationale: Ni kauli ya kawaida ya kumwelekea mtu moja kwa moja; inasikika ya asili katika Kiswahili huku ikihifadhi nafsi ya kwanza na ya pili.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: hakika hutatoka
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi hukataa kwa msisitizo tukio la wakati ujao; ‘hakika hutatoka’ huhifadhi msisitizo huo bila kutumia lugha ya kizamani.
- source_word: ἐκεῖθεν
  choice: humo
  rationale: Katika muktadha wa kufungiwa, ‘humo’ kwa ufupi na kwa kawaida humaanisha kutoka mahali humo, yaani ‘kutoka huko ndani.’
- source_word: ἕως
  choice: mpaka
  rationale: Huonyesha kikomo cha muda ambacho hali iliyokanushwa inaendelea.
- source_word: καὶ τὸ ἔσχατον
  choice: hata ... ya mwisho
  rationale: καί ina nguvu ya kusisitiza hapa, na ἔσχατον huonyesha kilicho cha mwisho kabisa; ‘hata ... ya mwisho’ husisitiza malipo kamili.
- source_word: λεπτόν
  choice: leptoni
  rationale: ‘Leptoni’ huhifadhi jina la kihistoria la sarafu ndogo sana ya Kigiriki; tanbihi inafafanua maana yake kwa msomaji wa kawaida.
- source_word: ἀποδῷς
  choice: uwe umelipa
  rationale: Muundo huu unaonyesha kwamba kutoka hakutatokea mpaka tendo la kulipa likamilike; timilifu tegemezi ya Kiswahili huwasilisha ukamilifu huo vizuri.
theological_decisions:
- issue: Maana inayolengwa na mfano wa deni na kifungo
  choice: Kuhifadhi picha ya kifungo mpaka deni lote lilipwe bila kutaja inawakilisha nini hasa
  alternative: Kuifafanua kuwa onyo kuhusu hukumu ya mahakama duniani, hukumu ya Mungu, au adhabu ya purgatori
  rationale: Mstari wenyewe hautambulishi wazi maana ya kifungo na malipo. Tafsiri isiyo ya kiufafanuzi huhifadhi utata na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hakika’ huhifadhi ukanushaji wenye msisitizo, na ‘uwe umelipa’ huonyesha kukamilika kwa malipo. Jina la kihistoria ‘leptoni’ limefafanuliwa katika tanbihi.
