source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: sw
  text: 'Lakini nitawaonyesha ni nani wa kumwogopa: mwogopeni yule ambaye, baada ya kuua, ana mamlaka ya kutupa katika Gehena.[a] Naam, nawaambia, mwogopeni huyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jehanamu.” Neno la Kigiriki ni Gehena, istilahi ya hukumu yenye mizizi katika taswira ya Bonde la Hinomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: nitawaonyesha
  rationale: Wakati ujao wa ὑποδείκνυμι unaanzisha maelekezo ya Yesu. ‘Nitawaonyesha’ ni Kiswahili cha kawaida na huhifadhi maana ya kuelekeza au kubainisha bila kuongeza wazo la kuonya.
- source_word: τίνα φοβηθῆτε
  choice: yule mnayepaswa kumwogopa
  rationale: Swali lisilo la moja kwa moja limetolewa kwa Kiswahili cha asili. Muundo huu unaweka wazi mhusika anayepaswa kuogopwa bila kupunguza uzito wa kauli.
- source_word: φοβήθητε
  choice: mwogopeni
  rationale: Amri hii inarudiwa kwa msisitizo. ‘Mwogopeni’ huhifadhi maana ya hofu katika onyo hili zito; ‘mheshimuni’ ingekuwa dhaifu mno.
- source_word: τὸν
  choice: yule ambaye
  rationale: Kibainishi cha Kigiriki kimetumiwa kama nomino. ‘Yule ambaye’ ni muundo wa kawaida wa Kiswahili unaomtambulisha mhusika bila kumtaja moja kwa moja.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: baada ya kuua
  rationale: Muundo wenye μετά unaonyesha mfuatano wa wakati. Tafsiri hii ni fupi na inahifadhi kutotajwa wazi kwa mtendaji wa kitenzi tegemezi.
- source_word: ἀποκτεῖναι
  choice: kuua
  rationale: Ni kitenzi cha kawaida kinachomaanisha kusababisha kifo. ‘Kuua’ ni cha moja kwa moja na cha kisasa.
- source_word: ἔχοντα ἐξουσίαν
  choice: ana mamlaka
  rationale: ἐξουσία hapa linaelekea kumaanisha mamlaka au haki halali, si uwezo wa nguvu tu. ‘Ana mamlaka’ huhifadhi tofauti hiyo.
- source_word: ἐμβαλεῖν εἰς
  choice: ya kutupa katika
  rationale: ‘Kutupa katika’ ni tafsiri ya moja kwa moja na ya kawaida ya ἐμβάλλω εἰς, huku ikihifadhi nguvu ya kitendo.
- source_word: γέενναν
  choice: Gehena
  rationale: Utohozi ‘Gehena’ huhifadhi istilahi mahususi ya Kigiriki na mizizi yake katika taswira ya Bonde la Hinomu, badala ya kuingiza moja kwa moja maana pana za baadaye za ‘jehanamu.’
- source_word: ναί
  choice: Naam
  rationale: ναί ni uthibitisho wenye msisitizo. ‘Naam’ ni neno la Kiswahili sanifu, lenye hadhi na uzito unaofaa muktadha.
- source_word: τοῦτον
  choice: huyo
  rationale: Kiwakilishi kionyeshi kinaongeza msisitizo mwishoni. ‘Huyo’ huhifadhi msisitizo huo kuliko kurudia kiwakilishi cha kawaida tu.
theological_decisions:
- issue: Utafsiri wa γέεννα katika muktadha wa hukumu
  choice: Gehena
  alternative: jehanamu
  rationale: Ili kutoingiza dhana za kitheolojia za baadaye zinazoweza kuzidi neno la Kigiriki lenyewe, matini kuu inahifadhi jina ‘Gehena.’ Neno linalotumiwa mara nyingi kama kisawe, ‘jehanamu,’ limewekwa katika tanbihi.
- issue: Utambulisho wa ‘yule’ mwenye mamlaka
  choice: Kutomtaja moja kwa moja
  alternative: Mungu
  rationale: Kigiriki kinatumia kibainishi cha kinomino bila kutaja jina. Tafsiri inahifadhi hali hiyo na haifanyi utambulisho wa mhusika kuwa wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘mwogopeni’ yamehifadhiwa kwa sababu ni ya kimsingi katika msisitizo wa mstari. ‘Naam’ limetumiwa kama uthibitisho mzito lakini unaoeleweka kwa wasomaji wa kawaida.
