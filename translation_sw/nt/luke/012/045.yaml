  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: sw
  text: Lakini ikiwa mtumwa huyo[a] atasema moyoni mwake, ‘bwana wangu[b] anakawia kuja,’ kisha aanze kuwapiga watumishi wa kiume na wa kike, na kula, kunywa na kulewa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi huyo.” Neno la Kigiriki δοῦλος humaanisha mtu aliye chini ya umiliki au mamlaka ya bwana.
    reason: lexical_alternative
  - marker: b
    text: Hapa “bwana” ni mkuu wa kaya katika mfano; neno la Kigiriki κύριος pia linaweza kutafsiriwa “mkuu” au “bwana mwenye mamlaka.”
    reason: contextual_clarification
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha wazi hali ya mtu aliye chini ya mamlaka ya bwana wake katika muundo wa kaya wa mfano huu; “mtumishi” pekee lingeweza kufifisha uhusiano huo.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: moyoni mwake
  rationale: Ni nahau ya kawaida ya Kiswahili inayohifadhi wazo la kusema kwa siri ndani yake mwenyewe.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: anakawia kuja
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kwamba kuja kwake kunachelewa, bila kuongeza sababu ya kuchelewa.
- source_word: κύριός μου
  choice: Bwana wangu
  rationale: “Bwana” linafaa kwa mkuu wa kaya katika mfano na pia linahifadhi upana wa maana ya κύριος bila kulazimisha hapa kuwa cheo cha kimungu.
- source_word: ἄρξηται τύπτειν
  choice: aanze kuwapiga
  rationale: Huhifadhi mwanzo wa tendo na maana ya kuwafanyia wengine ukatili wa kimwili.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: watumishi wa kiume na wa kike
  rationale: Muktadha wa kaya unaelekeza kwa watumishi, na tafsiri hii inahifadhi utofautishaji wa jinsia uliowazi katika Kigiriki.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: kula, kunywa na kulewa
  rationale: Orodha fupi na ya asili katika Kiswahili inahifadhi mfuatano wa kujifurahisha kupita kiasi hadi ulevi.
theological_decisions:
- issue: Maana ya κύριος katika mfano wa mkuu wa kaya
  choice: Bwana wangu
  alternative: Mkuu wangu
  rationale: Katika ulimwengu wa mfano, neno hili linamtaja mwenye mamlaka juu ya mtumwa. “Bwana” ni la asili katika uhusiano huo na halilazimishi kumtambulisha moja kwa moja kuwa Mungu au Masihi.
- issue: Uwasilishaji wa δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: Mamlaka, uwajibikaji na hali ya utegemezi katika mfano huu hufanya “mtumwa” kuwa sahihi zaidi, ingawa “mtumishi” linawezekana katika matumizi mapana.
- issue: Uhusiano wa masharti katika ἐὰν ... εἴπῃ ... ἄρξηται
  choice: ikiwa ... atasema ... aanze
  alternative: akisema ... akaanza
  rationale: Muundo huu unaonyesha wazi sharti la uwezekano bila kuligeuza kuwa simulizi la jambo ambalo tayari limetokea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “ikiwa ... atasema ... aanze” huhifadhi hali ya sharti, huku “moyoni mwake” na “anakawia kuja” zikiwa nahau zinazoeleweka kwa urahisi. Alama ya koma mwishoni imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
