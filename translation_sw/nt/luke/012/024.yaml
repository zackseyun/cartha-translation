  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: sw
  text: 'Watafakarini kunguru[a]: hawapandi wala hawavuni; hawana chumba cha kuhifadhia wala ghala[b], na Mungu huwalisha. Kwa kiasi gani ninyi ni wa thamani zaidi kuliko ndege![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waangalieni kwa makini kunguru” au “Fikirini kwa makini kuhusu kunguru.”
    reason: lexical_alternative
  - marker: b
    text: “Chumba cha kuhifadhia” hutafsiri ταμεῖον; “ghala” hutafsiri ἀποθήκη. Kigiriki kinatumia maneno mawili tofauti kwa mahali pa kuhifadhia.
    reason: lexical_alternative
  - marker: c
    text: Au, “Ninyi mnawazidi ndege kwa thamani kwa kiasi gani!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Watafakarini
  rationale: Kitenzi hiki katika hali ya agizo kinataka kuwaza kwa makini juu ya kunguru, si kuwaangalia kijuujuu tu. “Watafakarini” ni kifupi, cha kawaida, na huhifadhi wazo la uchunguzi wenye kutafakari.
- source_word: κόρακας
  choice: kunguru
  rationale: κόραξ humaanisha hasa kunguru; neno hili linahifadhi mfano mahususi uliotumiwa katika Kigiriki.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: hawapandi wala hawavuni
  rationale: Tafsiri hii ya moja kwa moja huhifadhi ulinganifu wa vitenzi viwili vya kilimo na muundo wa kukanusha wa Kigiriki.
- source_word: ταμεῖον
  choice: chumba cha kuhifadhia
  rationale: ταμεῖον ni sehemu au chumba cha ndani cha kuhifadhia vitu. Usemi huu unatofautisha neno hilo na ἀποθήκη linalofuata.
- source_word: ἀποθήκη
  choice: ghala
  rationale: ἀποθήκη ni jengo au mahali pa kuhifadhia mazao. “Ghala” ni neno la kawaida la Kiswahili na linahifadhi tofauti na “chumba cha kuhifadhia.”
- source_word: τρέφει
  choice: huwalisha
  rationale: Kauli ya wakati uliopo inaonyesha utoaji wa Mungu unaoendelea; “huwalisha” ni ya asili katika muktadha wa ndege.
- source_word: πόσῳ μᾶλλον
  choice: zaidi sana
  rationale: Usemi huu huonyesha hoja ya kutoka kilicho kidogo kwenda kilicho kikubwa. “Zaidi sana” huwasilisha nguvu ya ulinganisho kwa Kiswahili cha kawaida.
- source_word: διαφέρετε
  choice: ni wa thamani
  rationale: Katika muktadha huu kitenzi kina maana ya kuwazidi wengine kwa thamani au umuhimu, si kutofautiana tu.
- source_word: τῶν πετεινῶν
  choice: kuliko ndege
  rationale: πετεινόν ni jina la jumla la ndege; baada ya kunguru kutajwa mahsusi, ulinganisho unapanuka kuwahusu ndege kwa ujumla.
theological_decisions:
- issue: Uangalizi wa Mungu katika ulinganisho
  choice: lakini Mungu huwalisha
  alternative: na Mungu huwalisha
  rationale: Maneno haya yanadumisha kauli ya wazi kwamba Mungu ndiye anayewapa ndege chakula. “Lakini” huonyesha tofauti iliyopo kati ya kutokuwa kwao na hifadhi na kitendo cha Mungu, bila kuongeza dai jingine la kimafundisho.
- issue: Maana ya διαφέρετε katika hoja ya kutoka kilicho kidogo kwenda kilicho kikubwa
  choice: Ninyi ni wa thamani zaidi sana kuliko ndege!
  alternative: Ninyi mnawazidi ndege kwa kiasi gani!
  rationale: Muktadha unaonyesha ulinganisho wa thamani ya wanadamu na ndege. Tafsiri iliyochaguliwa huweka wazi maana hiyo bila kueleza msingi wake zaidi ya yale yaliyo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unabaki mfupi na wa kimethali, huku tofauti ya sehemu mbili za kuhifadhia na nguvu ya mshangao wa mwisho zikihifadhiwa.
