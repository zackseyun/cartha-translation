  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: sw
  text: Kwa maana unapokwenda pamoja na mshtaki wako kwa mwenye mamlaka, ukiwa njiani fanya bidii ujinasue kwake[a], asije akakuburuta mpaka kwa hakimu, naye hakimu akukabidhi kwa afisa, na afisa akutupa gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upatane naye.” Maneno ya Kigiriki kwa tafsiri ya karibu ni “uachiliwe kutoka kwake,” lakini katika muktadha huenda yanamaanisha kusuluhisha shauri kabla halijafika kwa hakimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: mshtaki
  rationale: Katika muktadha huu wa kisheria, neno hilo linamtaja upande unaoleta madai dhidi ya mtu; “mshtaki” ni la kawaida na wazi katika Kiswahili.
- source_word: ἄρχοντα
  choice: mkuu wa serikali
  rationale: Hapa neno linamaanisha mwenye mamlaka ya kiraia ambaye shauri linapelekwa kwake. Tafsiri hii inadumisha tofauti kati yake na “hakimu” anayetajwa baadaye.
- source_word: δὸς ἐργασίαν
  choice: fanya bidii
  rationale: Nahau hii inahimiza juhudi ya dhati na ya haraka; “fanya bidii” ni Kiswahili cha kawaida chenye nguvu hiyo.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: uachiliwe kutoka kwake
  rationale: Tafsiri hii inafuata kwa karibu picha ya Kigiriki ya kuwekwa huru kutoka kwa madai au uwezo wa mshtaki, bila kuamua kimyakimya kwamba lazima maana yake iwe kufikia suluhu.
- source_word: κατασύρῃ
  choice: akakuburuta
  rationale: Kitenzi hiki kina nguvu na kinaonyesha kupelekwa kwa kulazimishwa; “kuburuta” inadumisha picha hiyo.
- source_word: κριτήν / κριτής
  choice: hakimu
  rationale: “Hakimu” ni neno la kawaida la Kiswahili kwa mwenye kutoa hukumu katika shauri la kisheria.
- source_word: παραδώσει
  choice: akukabidhi
  rationale: “Kukabidhi” linaonyesha kuhamishwa rasmi chini ya mamlaka ya afisa mwingine.
- source_word: πράκτορι / πράκτωρ
  choice: afisa
  rationale: Neno linamtaja mtendaji wa amri ya hakimu, huenda katika ukusanyaji wa deni au kuweka mtu kizuizini; “afisa” ni wazi bila kuingiza cheo maalumu cha mfumo fulani wa sheria.
- source_word: βαλεῖ εἰς φυλακήν
  choice: akutupe gerezani
  rationale: “Kutupa gerezani” inadumisha nguvu na ukali wa kitenzi βάλλω.
- source_word: ὡς γὰρ
  choice: Kwa maana unapokwenda
  rationale: “Kwa maana” linaonyesha uhusiano wa maelezo na kauli iliyotangulia, huku muundo wa “unapokwenda” ukiwasilisha hali inayotolewa kuwa mfano.
- source_word: ἐν τῇ ὁδῷ
  choice: ukiwa njiani
  rationale: Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya mahali pamoja na uharaka wa kuchukua hatua kabla ya kufika mahakamani.
theological_decisions:
- issue: Kiwango cha ufafanuzi wa himizo la kisheria
  choice: Kudumisha picha ya shauri la kisheria bila kutaja wazi matumizi yake ya kiroho ndani ya aya yenyewe.
  alternative: Kutafsiri kwa ufafanuzi zaidi kana kwamba ni mwito wa kupatana na Mungu kabla ya hukumu ya mwisho.
  rationale: Maneno ya aya yenyewe yanatoa mfano wa kisheria. Muktadha mpana unaweza kuwa na uzito wa hukumu ya mwisho, lakini aya haiwatambulishi wazi mshtaki, hakimu, au gereza kuwa wahusika au hali za kiroho; kwa hiyo tafsiri haiongezi utambulisho huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mfululizo wa hatua za kisheria na nguvu ya vitenzi vya Kigiriki, huku tanbihi ikihifadhi uwezekano wa maana ya kufikia suluhu.
