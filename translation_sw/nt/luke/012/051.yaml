  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: sw
  text: Je, mnadhani kwamba nilikuja kutoa amani duniani? La, ninawaambia, bali mgawanyiko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: Je, mnadhani
  rationale: Kauli hii inawaelekea wasikilizaji wengi na kuanzisha swali la balagha kuhusu dhana yao; “Je, mnadhani” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: εἰρήνην
  choice: amani
  rationale: “Amani” huhifadhi maana pana ya εἰρήνη, ikiwemo hali ya upatano kati ya watu, bila kuifinya iwe utulivu wa ndani tu.
- source_word: παρεγενόμην
  choice: nilikuja
  rationale: Kitenzi cha wakati uliopita hapa kinaeleza kuja kwa Yesu kukiwa na kusudi; “nilikuja” ni tafsiri ya moja kwa moja na ya asili.
- source_word: δοῦναι
  choice: kutoa
  rationale: Hii ndiyo maana ya msingi ya kitenzi, na “kutoa amani” inaeleweka katika Kiswahili huku ikibaki karibu na muundo wa Kigiriki.
- source_word: ἐν τῇ γῇ
  choice: duniani
  rationale: γῆ inaweza kumaanisha dunia au nchi; muktadha unaelekea upeo mpana, na “duniani” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo.
- source_word: οὐχί
  choice: La
  rationale: Ni jibu hasi lenye mkazo kwa swali la balagha; “La” ni fupi, wazi, na lenye hadhi.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi kauli ya moja kwa moja kwa wasikilizaji wengi kwa Kiswahili cha kawaida.
- source_word: ἀλλ’ ἢ
  choice: bali
  rationale: “Bali” huonyesha kwa nguvu tofauti ya ‘si hiki, bali kile’ bila kuongeza ufafanuzi usiokuwamo katika matini.
- source_word: διαμερισμόν
  choice: mgawanyiko
  rationale: Neno hili linataja kutengana au kugawanyika kwa watu, kama mistari inayofuata inavyoonyesha; “mgawanyiko” ni sawa pana na ya moja kwa moja.
theological_decisions:
- issue: Iwapo kauli ya Yesu ipunguzwe ukali ili kuondoa mvutano na vifungu vinavyosema kuhusu amani
  choice: 'Kuhifadhi tofauti kali: si amani, bali mgawanyiko.'
  alternative: Kutafsiri kwa ufafanuzi kuwa ‘si amani, bali ugomvi,’ au kudokeza wazi kwamba mgawanyiko ni athari ya bahati mbaya tu.
  rationale: Kigiriki kinaweka tofauti hii kwa makusudi. Muktadha unaeleza mgawanyiko unaotokea kati ya watu na katika familia kutokana na utume wa Yesu, lakini mstari huu wenyewe haupaswi kulainishwa wala kupatanishwa kimyakimya na mada nyingine za kibiblia kuhusu amani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa swali la balagha na tofauti kali ya matini ya Kigiriki vimehifadhiwa. Hakuna tanbihi iliyohitajika kwa kuwa chaguo la “duniani” ni la asili na tofauti ya ‘dunia/nchi’ haionekani kuhitaji kuingizwa katika mstari huu.
