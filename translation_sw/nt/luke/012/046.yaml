base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: sw
  text: Bwana wa mtumwa huyo atakuja siku ambayo asiyemtarajia na saa ambayo asiyoijua, naye atamkata vipande viwili[a] na kumpangia sehemu yake miongoni mwa wasio waaminifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atamkata vipande”; wengine huuelewa usemi huu kuwa, “atamwadhibu vikali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wasioamini.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: bwana
  rationale: Katika mfano huu neno hilo linamaanisha bwana wa mtumwa; “bwana” ni la kawaida na lenye heshima katika Kiswahili, bila kulazimisha hapa matumizi ya moja kwa moja ya cheo cha Kristo.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Muktadha unaonyesha uhusiano wa mamlaka na umiliki wa nyumbani, hivyo “mtumwa” huhifadhi nguvu ya neno la Kigiriki kuliko “mtumishi.”
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: siku ambayo hamtarajii
  rationale: Kitenzi kina maana ya kutarajia; kiwakilishi cha yule bwana kinaeleweka katika Kiswahili na kukamilisha kitu kilichoachwa wazi katika Kigiriki.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: saa ambayo haijui
  rationale: Huhifadhi tofauti ya Kigiriki kati ya kutotarajia katika kishazi cha kwanza na kutojua katika kishazi hiki.
- source_word: διχοτομήσει
  choice: atamkata vipande viwili
  rationale: Huhifadhi taswira kali na maana ya msingi ya kukata mara mbili au sehemu mbili, huku uwezekano wa usemi wa kitamathali ukielezwa katika tanbihi.
- source_word: τὸ μέρος αὐτοῦ
  choice: sehemu yake
  rationale: “Sehemu” huhifadhi maana ya fungu au nafasi aliyopangiwa bila kufafanua kupita kiasi aina ya hatima inayokusudiwa.
- source_word: ἀπίστων
  choice: wasio waaminifu
  rationale: Muktadha wa mfano unahusu kutokuwa mwaminifu kwa mtumwa; maana nyingine ya “wasioamini” imehifadhiwa katika tanbihi.
- source_word: θήσει
  choice: kumwekea
  rationale: Muundo “kumwekea sehemu yake” unaonyesha tendo la kumpangia fungu au hatima pamoja na kundi hilo.
theological_decisions:
- issue: Iwapo taswira ya adhabu itafsiriwe kihalisi au kama nahau ya adhabu kali
  choice: Kuhifadhi taswira ya kukatwa vipande viwili katika matini kuu
  alternative: atamwadhibu vikali
  rationale: Kigiriki kina taswira kali ya kukata sehemu mbili; kuiweka katika matini kuu huepuka kuipunguza nguvu, huku tafsiri ya kinahau ikihifadhiwa katika tanbihi.
- issue: Iwapo ἀπίστων ina maana ya kutokuwa waaminifu au kutokuwa waamini
  choice: wasio waaminifu
  alternative: wasioamini
  rationale: Uaminifu ndio hoja ya karibu ya mfano, lakini neno la Kigiriki pia linaweza kueleza kutokuamini, hasa katika muktadha wa hukumu; tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki mkali kama Kigiriki, lakini ni wa kawaida kwa msomaji wa leo. Alama za tanbihi [a] na [b] zimewekwa mara tu baada ya maneno yanayohusika.
