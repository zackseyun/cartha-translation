  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: sw
  text: 'Kwa maana tangu sasa watu watano katika nyumba moja[a] watakuwa wamegawanyika: watatu dhidi ya wawili, na wawili dhidi ya watatu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kaya moja.” Neno la Kigiriki linaweza kumaanisha nyumba yenyewe au watu wa familia wanaoishi humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: watakuwa
  rationale: Huhifadhi hali ya wakati ujao ya εἰμί na huungana kiasili na kirai cha hali timilifu ‘wamegawanyika.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inaeleza sababu au ufafanuzi wa kauli iliyotangulia kuhusu mgawanyiko.
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuanzia wakati huu na kuendelea.
- source_word: πέντε
  choice: watu watano
  rationale: Ingawa Kigiriki kinataja tu ‘watano,’ kuongeza ‘watu’ ni lazima kwa uwazi na uasilia wa Kiswahili katika muktadha huu.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: katika nyumba moja
  rationale: Huhifadhi neno la Kigiriki οἶκος kwa maana yake halisi, huku tanbihi ikitaja maana inayowezekana ya kaya au familia.
- source_word: διαμεμερισμένοι
  choice: wamegawanyika
  rationale: Huwasilisha hali iliyotokana na kugawanywa, kulingana na participio timilifu tendwa, na inafaa kwa mgawanyiko wa mahusiano.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: watatu dhidi ya wawili
  rationale: ‘Dhidi ya’ huonyesha wazi upinzani unaoelezwa na ἐπί pamoja na hali ya dative.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: na wawili dhidi ya watatu
  rationale: Hudumisha ulinganifu na ukinzani wa kirai kilichotangulia.
theological_decisions:
- issue: Iwapo οἶκος itafsiriwe kihalisi kama ‘nyumba’ au kimuktadha kama ‘kaya/familia’
  choice: nyumba
  alternative: kaya au familia
  rationale: Mstari unaofuata unaonyesha wazi mahusiano ya kifamilia, lakini ‘nyumba’ huhifadhi upana wa neno la Kigiriki bila kuamua maana yake kwa nguvu kupita kiasi; maana ya kijamii imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘watakuwa wamegawanyika’ umechaguliwa ili kuhifadhi wakati ujao pamoja na hali ya mgawanyiko iliyokamilika.
