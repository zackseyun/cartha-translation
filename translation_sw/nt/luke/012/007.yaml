base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: sw
  text: Lakini hata nywele zote za vichwa vyenu zimehesabiwa. Msiogope; ninyi ni wa thamani kuliko shomoro wengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnawazidi shomoro wengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Lakini hata
  rationale: Neno “lakini” linaendeleza utofautishaji na wazo lililotangulia, huku “hata” likisisitiza kwamba Mungu anajua hata nywele zao.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: nywele zote za vichwa vyenu
  rationale: Hii inahifadhi picha halisi ya nywele za kichwa na maana ya πᾶσαι, huku wingi wa “vichwa vyenu” ukiwa wa kawaida katika Kiswahili kwa kundi linalosemewa.
- source_word: ἠρίθμηνται
  choice: zimehesabiwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “zimehesabiwa” ni wazi na ya kawaida, na inaonyesha ujuzi kamili wa Mungu bila kuongeza maneno katika matini.
- source_word: μὴ φοβεῖσθε
  choice: Msiogope
  rationale: Ni amri hasi ya moja kwa moja kwa watu wengi, yenye lugha ya sasa na inayoeleweka kwa urahisi.
- source_word: πολλῶν στρουθίων
  choice: shomoro wengi
  rationale: “Shomoro” linadumisha aina ya ndege inayotajwa katika muktadha wa karibu badala ya kuipanua kuwa ndege wadogo kwa ujumla.
- source_word: διαφέρετε
  choice: mna thamani kuliko
  rationale: Katika hoja hii ya kutoka kilicho kidogo kwenda kilicho kikubwa, kitenzi kinaonyesha tofauti ya thamani. Usemi huu ni wa kawaida na hauna dai pana zaidi ya muktadha.
theological_decisions:
- issue: Ulinganisho wa thamani ya wanafunzi na shomoro
  choice: mna thamani kuliko shomoro wengi
  alternative: mnawazidi shomoro wengi
  rationale: Tafsiri kuu inaweka wazi maana ya thamani inayodokezwa na muktadha wa utunzaji wa Mungu, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na maana ya jumla ya kitenzi bila kuufanya mstari kuwa wa kifalsafa kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kusomeka. “Msiogope” na “zimehesabiwa” ni miundo ya kawaida, na picha halisi ya nywele na shomoro imehifadhiwa.
