  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: sw
  text: Ikiwa basi hamwezi kufanya hata jambo dogo kabisa, kwa nini mnahangaikia mambo mengine?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yaliyobaki?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ikiwa basi
  rationale: Inahifadhi hali ya sharti pamoja na hitimisho linalotokana na hoja iliyotangulia, kwa Kiswahili cha kawaida na cha asili.
- source_word: οὐδὲ ἐλάχιστον
  choice: hata jambo dogo kabisa
  rationale: ἐλάχιστον ni kivumishi cha hali ya juu kilichotumiwa kama nomino, kikimaanisha jambo lililo dogo zaidi; kuongeza “jambo” huifanya kauli eleweke kiasili bila kufafanua kupita kiasi.
- source_word: δύνασθε
  choice: hamwezi kufanya
  rationale: Kitenzi kinaonyesha uwezo; “kufanya” kinakamilisha kwa njia ya asili wazo lililodokezwa na ἐλάχιστον.
- source_word: τί
  choice: kwa nini
  rationale: Katika swali hili la balagha, τί inauliza sababu, hivyo “kwa nini” ndiyo tafsiri ya kawaida na wazi.
- source_word: περὶ τῶν λοιπῶν
  choice: mambo mengine yote
  rationale: Hurejelea mambo mengine yaliyosalia zaidi ya lile lililo dogo kabisa; usemi huu ni wa asili katika Kiswahili na unahifadhi ulinganisho wa hoja.
- source_word: μεριμνᾶτε
  choice: mnahangaikia
  rationale: Neno hili linaonyesha hali inayoendelea ya kuwa na wasiwasi au kuhangaika; “mnahangaikia” linafaa katika muktadha wa mafundisho dhidi ya wasiwasi.
theological_decisions:
- issue: Maana ya μεριμνάω katika fundisho la Yesu kuhusu kumtegemea Mungu
  choice: mnahangaikia
  alternative: mna wasiwasi kuhusu
  rationale: “Mnahangaikia” linaonyesha wasiwasi usiofaa bila kudokeza kwamba kila aina ya kujali au kupanga kwa busara imekatazwa, na halileti maana mahsusi ya kitabibu ya kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “Ikiwa basi” unadumisha uhusiano wa kimantiki wa sentensi, huku “jambo dogo kabisa” na “mambo mengine yote” vikitoa Kiswahili cha asili bila kuondoa nguvu ya swali la balagha.
