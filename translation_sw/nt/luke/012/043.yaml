  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: sw
  text: Heri mtumishi yule ambaye bwana wake[a], atakapokuja, atamkuta akifanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana wake.” Neno la Kigiriki linaweza kumaanisha mkuu wa mtumishi katika mazingira ya nyumba ya mfano huu, au “Bwana” ikiwa matumizi mapana ya mfano yanazingatiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Heri
  rationale: Neno hili ni la kawaida katika kauli za baraka za Biblia na linahifadhi uzito wa kidini kuliko maneno yanayoonyesha furaha ya kihisia tu.
- source_word: δοῦλος
  choice: mtumishi
  rationale: Katika mfano huu wa nyumbani, neno linaonyesha mtu aliye chini ya mamlaka na mwenye wajibu; “mtumishi” ni la asili kwa Kiswahili na halifanyi hali yake ya kijamii kuwa hoja kuu kuliko ilivyo katika muktadha.
- source_word: ἐκεῖνος
  choice: yule
  rationale: Kiwakilishi hiki cha kuonyesha kinahifadhi msisitizo na umahususi wa Kigiriki.
- source_word: κύριος
  choice: bwana
  rationale: “Bwana” linafaa kwa mkuu wa mtumishi katika mazingira ya mfano, huku pia likihifadhi mwangwi unaowezekana wa cheo “Bwana” katika matumizi mapana ya mfano.
- source_word: ἐλθὼν
  choice: atakapokuja
  rationale: Kauli ya wakati inaonyesha kwa Kiswahili sanifu kwamba kuja kwake kunatangulia kumkuta mtumishi.
- source_word: εὑρήσει
  choice: atamkuta
  rationale: Huhifadhi hali ya wakati ujao na maana ya kumfikia mtu akiwa katika hali au tendo fulani.
- source_word: ποιοῦντα οὕτως
  choice: akifanya hivyo
  rationale: Ni usemi wa asili unaorejelea mwenendo ulioelezwa kabla bila uzito usio wa lazima.
theological_decisions:
- issue: Mwangwi unaowezekana wa kikristo wa κύριος katika mfano unaohusu kurudi kwa mkuu
  choice: Bwana katika matini kuu
  alternative: Mkuu au mwenye nyumba ili kusisitiza mazingira ya kijamii ya mfano
  rationale: Kwa Kiswahili, “bwana” huweza kumaanisha mkuu wa mtumishi na pia “Bwana” kama cheo. Tahajia ya herufi ndogo inaangazia uso wa mfano, na tanbihi inahifadhi uwezekano wa matumizi mapana bila kuamua mvutano huo kimya-kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida kwa msomaji wa kawaida; “Heri” huhifadhi mtindo wa kauli za baraka, na “akifanya hivyo” hurejelea tendo lililotangulia kwa njia ya asili.
