source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: sw
  text: Bwana akasema, “Ni nani basi aliye msimamizi mwaminifu na mwenye busara[a], ambaye bwana wake atamweka kuwa mkuu wa watumishi wa nyumba ya bwana wake, ili awape mgao wao wa chakula[b] kwa wakati unaofaa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye hekima.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mgao wa nafaka,” yaani, sehemu ya chakula iliyopimwa na kupewa kila mtumishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana / bwana wake
  rationale: Katika utangulizi, “Bwana” ni jina la cheo la Yesu. Ndani ya mfano, “bwana wake” humtaja mwenye nyumba anayemkabidhi msimamizi wajibu; tofauti ya herufi kubwa na ndogo pamoja na kimilikishi huweka wazi viwango viwili vya simulizi huku ikihifadhi maana ya neno lilelile la Kigiriki.
- source_word: πιστός
  choice: mwaminifu
  rationale: Neno hili linaonyesha mtu anayetegemeka katika jukumu alilokabidhiwa; “mwaminifu” ni la kawaida na lenye hadhi katika muktadha huu.
- source_word: οἰκονόμος
  choice: msimamizi
  rationale: Hapa ni mtu aliyekabidhiwa kusimamia nyumba na watumishi wake. “Msimamizi” ni Kiswahili cha sasa kinachoeleweka kwa urahisi kuliko istilahi ya kizamani.
- source_word: φρόνιμος
  choice: mwenye busara
  rationale: Huonyesha hekima ya vitendo na uamuzi mzuri katika kutekeleza wajibu. “Mwenye busara” ni ya asili katika Kiswahili; “mwenye hekima” imehifadhiwa katika tanbihi kama uwezekano halali.
- source_word: καταστήσει
  choice: atamweka kuwa mkuu
  rationale: Kitenzi humaanisha kumweka mtu katika nafasi ya mamlaka au wajibu. Usemi huu unaonyesha uteuzi na usimamizi juu ya wengine bila kuufanya kuwa cheo rasmi kupita kiasi.
- source_word: θεραπεία
  choice: watumishi wake wa nyumbani
  rationale: Katika muktadha huu neno linamaanisha kundi la watumishi au wahudumu wa nyumba, si tendo la kutibu au huduma kwa ujumla.
- source_word: ἐν καιρῷ
  choice: kwa wakati unaofaa
  rationale: Usemi huu unaonyesha wakati unaofaa au uliokusudiwa, si wakati wowote tu.
- source_word: σιτομέτριον
  choice: mgao wao wa chakula
  rationale: Neno linamaanisha sehemu iliyopimwa ya chakula, kihistoria ikiwa mgao wa nafaka. Tafsiri kuu inaeleza kazi yake kwa Kiswahili cha kawaida, na tanbihi inahifadhi picha halisi ya nafaka iliyopimwa.
theological_decisions:
- issue: Kutafsiri κύριος inayotokea kwa Yesu kama msemaji na kwa mwenye nyumba ndani ya mfano
  choice: “Bwana” kwa Yesu; “bwana wake” kwa mwenye nyumba wa mfano
  alternative: “Bwana” katika sehemu zote mbili
  rationale: Kigiriki kinatumia neno lilelile, lakini muktadha una viwango viwili vya rejeo. Kiswahili kinaweza kuvitofautisha kwa herufi kubwa na ndogo na kwa “wake” bila kuondoa uhusiano wa kimaana kati ya Bwana na bwana/mwenye mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka muundo wa swali la Kigiriki na wazo la usimamizi uliokabidhiwa, lakini imetumia “watumishi wake wa nyumbani” na “mgao wao wa chakula” ili maana iwe wazi kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
