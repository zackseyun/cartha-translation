  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: sw
  text: 'Lakini jueni hili: kama mwenye nyumba angejua mwizi anakuja saa gani, hangeruhusu ukuta wa nyumba yake utobolewe ili kuingia ndani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nyumba yake ichimbwe kupitia”; usemi huu unarejelea kutoboa au kuchimba kupitia ukuta wa nyumba ili kuingia ndani.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Lakini jueni hili
  rationale: Kitenzi γινώσκετε ni agizo la wakati wa sasa kwa wingi. “Jueni hili” ni la moja kwa moja na la asili; “Lakini” linabeba mpito au utofautishaji wa δέ.
- source_word: οἰκοδεσπότης
  choice: mwenye nyumba
  rationale: Katika Kiswahili cha kawaida, “mwenye nyumba” humaanisha mtu mwenye mamlaka au umiliki wa nyumba na hufikisha maana ya οἰκοδεσπότης kwa uwazi bila lugha nzito.
- source_word: ποίᾳ ὥρᾳ
  choice: saa gani
  rationale: Huhifadhi umahususi wa ὥρα na ni usemi wa kawaida wa Kiswahili kwa kuuliza wakati maalumu.
- source_word: ὁ κλέπτης ἔρχεται
  choice: mwizi anakuja
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa kwa namna ya asili katika Kiswahili ndani ya hali ya kudhaniwa; muktadha unaonyesha kwamba ni ujio uliotarajiwa.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: hangeruhusu
  rationale: Muundo huu wa hali ya masharti unaonyesha jambo ambalo halikutokea. “Hangeruhusu” huwasilisha kwa ufupi na kwa kawaida matokeo hayo ya kinyume na hali halisi.
- source_word: διορυχθῆναι
  choice: ibomolewe ili kuingiliwa
  rationale: Kitenzi hiki huonyesha kutoboa au kubomoa ukuta ili kuingia. Tafsiri hii huhifadhi picha ya kitendo halisi na pia kusudi la uvamizi, bila kutumia usemi usio wa kawaida wa “kuchimbwa kupitia.”
- source_word: τὸν οἶκον αὐτοῦ
  choice: nyumba yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya οἶκος αὐτοῦ, huku ikidumisha picha ya jengo linalovunjwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti umewekwa kwa njia ya asili, na taswira ya kuvunja ukuta imehifadhiwa katika maandishi pamoja na kufafanuliwa katika tanbihi.
