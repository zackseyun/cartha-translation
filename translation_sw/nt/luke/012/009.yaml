  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: sw
  text: Lakini anayenikana mbele ya watu atakanwa mbele ya malaika wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “atakataliwa”; kitenzi cha Kigiriki ni chenye nguvu zaidi na kina uhusiano wa karibu na kitenzi kilichotafsiriwa “anayenikana,” lakini maandishi makuu yamehifadhi ulinganifu: “anayenikana ... atakanwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: Lakini anayenikana
  rationale: Kishiriki chenye kibainishi kina maana ya mtu anayefanya tendo hilo kwa ujumla. “Anayenikana” ni Kiswahili cha kawaida na huhifadhi kiwakilishi cha nafsi ya kwanza kinachomrejelea Yesu.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: “Mbele ya” hudumisha wazo la tendo la wazi katika uwepo wa wengine. “Watu” humaanisha wanadamu kwa ujumla na hapa inatofautishwa na malaika, bila kuingiza tofauti ya kijinsia isiyokusudiwa.
- source_word: ἀπαρνηθήσεται
  choice: atakanwa
  rationale: Kauli ya kutendwa ya wakati ujao imehifadhiwa bila kutaja mtendaji. Mzizi wa “kana” katika “anayenikana ... atakanwa” pia huhifadhi ulinganifu wa maneno ya Kigiriki.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: mbele ya malaika wa Mungu
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi mazingira ya ushuhuda mbele ya viumbe wa mbinguni.
theological_decisions:
- issue: Utambulisho wa mtendaji aliyedokezwa katika “atakanwa”
  choice: Kuacha kauli ya kutendwa kama ilivyo bila kuongeza mtendaji
  alternative: Kusema “Mwana wa Adamu atamkana” au “Mungu atamkana”
  rationale: Kigiriki hakimtaji mtendaji wa tendo hilo. Muktadha unaweza kumwezesha msomaji kufanya hitimisho, lakini tafsiri haipaswi kuondoa mvutano huo wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na nzito kama ilivyo kauli ya Kigiriki. “Watu” ni chaguo la kawaida la kijumuishi kwa ἀνθρώπων; kwa hiyo tanbihi tofauti kuhusu “men/people” ya Kiingereza haihitajiki katika Kiswahili.
