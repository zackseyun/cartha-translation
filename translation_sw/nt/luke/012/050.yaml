lexical_decisions:
- source_word: βάπτισμα
  choice: ubatizo
  rationale: Neno la picha limehifadhiwa badala ya kufasiriwa moja kwa moja kuwa mateso au kifo; linaendeleza wazo la kuzamishwa au kufunikwa kabisa na jambo linalokuja.
- source_word: ἔχω βαπτισθῆναι
  choice: nina ubatizo wa kubatizwa nao
  rationale: Muundo huu unahifadhi kwa makusudi urudiaji wa maneno yenye mzizi mmoja katika Kigiriki na unaonyesha jambo linalomkabili Yesu, bila kuongeza wazi neno ‘lazima’.
- source_word: πῶς
  choice: jinsi gani
  rationale: Imetumiwa kwa maana ya mshangao unaoonyesha ukubwa wa hali anayosema Yesu.
- source_word: συνέχομαι
  choice: ninabanwa
  rationale: ‘Ninabanwa’ huhifadhi maana pana ya kushinikizwa, kuzuiwa au kuwa katika dhiki, bila kuamua kimya-kimya kuwa ni huzuni ya ndani pekee.
- source_word: ἕως ὅτου
  choice: mpaka
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha kikomo cha wakati.
- source_word: τελεσθῇ
  choice: utimizwe
  rationale: Kitenzi hiki kinaonyesha kufikishwa kwa ubatizo huo kwenye ukamilifu au kusudi lake, bila kuingiza moja kwa moja kauli ya Yohana 19:30.
theological_decisions:
- issue: Maana ya picha ya ‘ubatizo’
  choice: Maneno ya ubatizo yamehifadhiwa katika tafsiri, huku tanbihi ikieleza kuwa katika muktadha yanaelekea kwenye mateso yanayomkabili Yesu.
  alternative: Kutafsiri moja kwa moja kuwa ‘mateso’ au kuchukulia kuwa ni ubatizo halisi wa maji.
  rationale: Muktadha unaelekeza kwenye mateso na kifo cha Yesu vinavyokuja, lakini picha yenyewe ina uzito wa kifasihi na kiteolojia na haipaswi kufutwa.
- issue: Maana ya συνέχομαι
  choice: ninabanwa
  alternative: nina dhiki; niko chini ya shinikizo; ninazuiliwa
  rationale: Kigiriki kinaweza kueleza kubanwa, kushinikizwa, kuzuiliwa au kusumbuliwa sana. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji ‘ubatizo wa kubatizwa’ umeachwa kwa makusudi ili kuhifadhi picha na muundo wa Kigiriki; tanbihi hutoa usemi laini zaidi wa Kiswahili.
