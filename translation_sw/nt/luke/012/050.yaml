translation:
  language: sw
  text: Lakini nina ubatizo wa kubatizwa nao[a][b], na jinsi ninavyobanwa sana[c] mpaka utimizwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nina ubatizo ninaopaswa kuupitia.” Kigiriki kinarudia wazi maneno yenye mzizi wa “ubatizo.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “ubatizo” ni picha ambayo, katika muktadha, inaelekea kwenye mateso yanayomkabili Yesu.
