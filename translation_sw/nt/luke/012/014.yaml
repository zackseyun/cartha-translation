  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: sw
  text: Lakini akamwambia, “Mtu, ni nani aliyeniweka kuwa mwamuzi au mgawaji juu yenu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Wewe mtu
  rationale: Ni mwito wa moja kwa moja unaohifadhi ukali wa kiasi wa Kigiriki huku ukisikika kwa kawaida katika Kiswahili.
- source_word: κατέστησεν
  choice: aliyeniweka
  rationale: Huwasilisha maana ya kumteua au kumweka mtu katika jukumu fulani bila kuongeza mhusika ambaye hajatajwa.
- source_word: κριτὴν
  choice: mwamuzi
  rationale: Neno hili linafaa kwa mtu mwenye mamlaka ya kutoa uamuzi katika mgogoro.
- source_word: μεριστὴν
  choice: mgawaji
  rationale: Huhifadhi tofauti ya kileksia na mwamuzi na maana halisi ya mtu anayegawa mali, badala ya kulainisha kuwa msuluhishi.
- source_word: ἐφ’ ὑμᾶς
  choice: juu yenu
  rationale: Huhifadhi wazo la mamlaka juu ya wahusika wote; umoja wa anayesemeshwa ukifuatiwa na wingi unaendana na muktadha wa mgogoro wa ndugu wawili.
theological_decisions:
- issue: Upeo wa kauli ya Yesu kuhusu jukumu lake
  choice: 'Swali limeachwa kama lilivyo: “ni nani aliyeniweka...”'
  alternative: Kulieleza kuwa Yesu anakataa mamlaka yote ya kuhukumu au kugawa
  rationale: Aya yenyewe ni jibu la kimuktadha na haisemi wazi tamko pana kuhusu mamlaka yote ya Yesu; tafsiri haipaswi kulitatua zaidi ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mgawaji” limechaguliwa makusudi ili kuhifadhi taswira ya kugawa urithi na tofauti yake na “mwamuzi.”
