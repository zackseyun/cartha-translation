  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: sw
  text: Enyi wanafiki! Mnajua kuutambua mwonekano wa nchi na anga, lakini inawezekanaje hamjui kuutambua wakati huu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majira haya” au “wakati huu muhimu.” Neno la Kigiriki καιρός linaweza kumaanisha wakati muhimu au mwafaka, si wakati kwa ujumla tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Enyi wanafiki!
  rationale: Ni neno la moja kwa moja la kuwakemea wasikilizaji kwa unafiki; “wanafiki” ni la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: τὸ πρόσωπον
  choice: hali
  rationale: Katika msemo huu neno hilo linamaanisha sura au mwonekano unaoonekana; “hali” hutiririka kwa kawaida pamoja na nchi na anga na kudokeza ishara za hali ya hewa.
- source_word: τῆς γῆς
  choice: nchi
  rationale: Katika muktadha wa kutazama dalili za hali ya hewa, “nchi” ni ya kawaida na haidai maana ya ulimwengu mzima.
- source_word: τοῦ οὐρανοῦ
  choice: anga
  rationale: Muktadha unahusu ishara zinazoonekana za hali ya hewa, hivyo “anga” huepuka kudokeza makao ya Mungu.
- source_word: οἴδατε δοκιμάζειν
  choice: mnajua kutambua
  rationale: Muundo huu unaeleza uwezo wa kuchunguza dalili na kuelewa maana yake. “Kutambua” ni wa kawaida na unaweza kubeba wazo la kupima kwa uangalifu.
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: lakini ... wakati huu
  rationale: “Wakati huu” huwasilisha τοῦτον moja kwa moja huku ukiacha καιρός ibebe uwezekano wa wakati muhimu au mwafaka bila kuufafanua kupita kiasi.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: kwa nini hamjui kuutambua
  rationale: Swali hili la balagha lina mshangao na lawama. “Kwa nini” ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu hiyo.
theological_decisions:
- issue: Maana ya καιρός katika karipio la Yesu
  choice: wakati huu
  alternative: majira haya; wakati huu wa kuamua
  rationale: Tafsiri inadokeza wakati wenye umuhimu katika huduma ya Yesu lakini haibainishi kwa lazima aina ya umuhimu huo, hivyo inadumisha upana na mvutano wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “Enyi” huhifadhi mwito wa moja kwa moja wa karipio.
