translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi. Muundo ni mfupi na wa moja kwa moja kama maandishi ya Kigiriki; ‘huwa hivyo’ linaonyesha tabia ya jambo kutokea mara kwa mara bila kuongeza kitenzi cha kuona ambacho hakipo wazi katika mstari huu wa SBLGNT.
