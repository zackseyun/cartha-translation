  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: sw
  text: Na upepo wa kusini unapovuma[a], mnasema, “Kutakuwa na joto kali[b],” na ndivyo inavyotokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusini”; yaani, upepo wa kusini.
    reason: lexical_alternative
  - marker: b
    text: Au “joto la kuunguza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: upepo wa kusini
  rationale: Ingawa neno hili linaweza kumaanisha ‘kusini’ au ‘upepo wa kusini,’ muktadha wa hali ya hewa pamoja na πνέοντα (‘unapovuma’) unaonyesha wazi kwamba hapa ni upepo unaotoka kusini.
- source_word: πνέοντα
  choice: unapovuma
  rationale: Kauli hii ya wakati wa sasa inaonyesha upepo ukiendelea kuvuma; muundo wa ‘unapovuma’ ni wa kawaida na wa asili katika Kiswahili.
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati wa sasa unaeleza desturi ya kawaida ya wasikilizaji wanapotabiri hali ya hewa.
- source_word: Καύσων
  choice: joto kali
  rationale: Neno hili linaashiria joto lenye nguvu au linalounguza. ‘Joto kali’ ni Kiswahili cha kawaida, wazi, na chenye kiwango cha ukali kinachofaa.
- source_word: ἔσται
  choice: kutakuwa na
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida hali inayotarajiwa kutokea.
- source_word: γίνεται
  choice: huwa hivyo
  rationale: Kauli hii inaonyesha kwamba utabiri wao hutimia mara kwa mara. ‘Huwa hivyo’ ni ya asili katika Kiswahili na inadumisha maana ya tukio kuwa kama walivyosema.
