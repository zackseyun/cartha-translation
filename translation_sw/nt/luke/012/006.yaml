reference: Luke 12:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: sw
  text: Je, shomoro watano hawauzwi kwa asaria mbili[a]? Na hakuna hata mmoja wao aliyesahaulika mbele za Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa senti mbili” au “kwa sarafu mbili za shaba.” Kigiriki kinazitaja sarafu hizo kuwa asaria, yaani sarafu ndogo za shaba za Waroma.
    reason: cultural_note
  - marker: b
    text: Au, “na hakuna hata mmoja wao anayepuuzwa machoni pa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: shomoro
  rationale: Katika muktadha huu neno hilo kwa kawaida humaanisha shomoro; tafsiri hii ni mahususi, ya kawaida, na inaeleweka kuliko usemi mpana zaidi ‘ndege wadogo.’
- source_word: πωλοῦνται
  choice: wanauzwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na ni usemi wa kawaida wa Kiswahili katika swali hili la bei.
- source_word: ἀσσαρίων δύο
  choice: kwa asaria mbili
  rationale: Jina la sarafu ya kale limehifadhiwa ili kuepuka kulinganisha thamani yake isivyo sahihi na fedha ya kisasa; maelezo ya chini yanafafanua aina ya sarafu.
- source_word: ἐπιλελησμένον
  choice: amesahaulika
  rationale: Kauli hii inaonyesha hali ya kuwa amesahaulika, kwa kupatana na umbo timilifu la Kigiriki; ni ya moja kwa moja kuliko ‘amepuuzwa.’
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni tafsiri ya moja kwa moja na yenye hadhi inayohifadhi wazo la kuwa katika uwepo au mtazamo wa Mungu bila kulipanua.
- source_word: οὐχὶ ... ;
  choice: Je, ... hawauzwi ...?
  rationale: Muundo wa swali unatarajia jibu la kukubali na unahifadhi nguvu ya swali la balagha la Kigiriki.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: Lakini hakuna hata mmoja wao
  rationale: ‘Hata mmoja’ huonyesha msisitizo wa yule mmoja miongoni mwa watano, huku ‘lakini’ ikileta kwa kawaida tofauti kati ya thamani yao ndogo sokoni na kutosahauliwa kwao mbele za Mungu.
theological_decisions:
- issue: Lugha ya Mungu kukumbuka na utunzaji wake
  choice: hakuna hata mmoja wao ambaye amesahaulika mbele za Mungu
  alternative: hakuna hata mmoja wao anayepuuzwa machoni pa Mungu
  rationale: ‘Amesahaulika’ hukaa karibu na maana ya kimsingi ya neno la Kigiriki na kusisitiza ufahamu makini wa Mungu bila kuingiza maelezo mapana zaidi ya kimafundisho kuliko yale yanayosemwa na mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Shomoro’ ni neno la kawaida la ndege hawa; ‘asaria’ huhifadhi mazingira ya kihistoria, huku tanbihi ikisaidia msomaji wa kawaida. Muundo ‘hakuna hata mmoja wao ambaye amesahaulika’ ni wa asili katika Kiswahili na huhifadhi msisitizo wa Kigiriki.
