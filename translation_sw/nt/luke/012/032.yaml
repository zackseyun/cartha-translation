  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: sw
  text: “Msiogope[a], enyi kundi dogo[b], kwa sababu imependeza Baba yenu kuwapa ufalme[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msiwe na hofu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kundi lililo dogo.”
    reason: lexical_alternative
  - marker: c
    text: “Ufalme” unaweza pia kueleweka kuwa “utawala,” ukisisitiza mamlaka ya Mungu ya kifalme pamoja na ufalme anaowapa watu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Msiogope
  rationale: Kauli ya kukataza imetafsiriwa kwa lugha ya kawaida na ya moja kwa moja. Ingawa kitenzi cha Kigiriki kiko katika umoja kwa sababu kinahusishwa kisarufi na ‘kundi,’ Kiswahili hutumia wingi kwa kawaida wakati watu walio katika kundi hilo wanasemeshwa; pia ‘yenu’ na ‘kuwapa’ zinaonyesha kuwa wanafunzi wengi ndio walengwa.
- source_word: τὸ μικρὸν ποίμνιον
  choice: enyi kundi dogo
  rationale: ‘Kundi’ linahifadhi sitiari ya kundi la kondoo, na ‘dogo’ linaonyesha uchache wake. ‘Enyi’ hufanya mwito huo kwa kundi la watu usikike kwa uwazi na kwa heshima katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya kutokuwa na hofu; ‘kwa sababu’ kinaweka uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: εὐδόκησεν
  choice: amependezwa
  rationale: Chaguo hili linaonyesha nia njema na ridhaa ya Baba bila kulifanya neno hilo kuwa kauli ya kitaalamu kuhusu amri au uamuzi wa Mungu.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yenu
  rationale: Tafsiri hii inafuata maandishi, ambayo yanasema ‘Baba yenu’ bila kuongeza ‘wa mbinguni.’
- source_word: δοῦναι ὑμῖν
  choice: kuwapa
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kutoa kitu kwa wale wanaosemeshwa.
- source_word: τὴν βασιλείαν
  choice: ufalme
  rationale: ‘Ufalme’ ni neno la kawaida la kibiblia na linaweza kuhusisha eneo la kifalme pamoja na mamlaka au utawala wa mfalme, hivyo halibani maana ya Kigiriki.
theological_decisions:
- issue: Maana pana ya βασιλεία
  choice: ufalme
  alternative: utawala
  rationale: ‘Ufalme’ huhifadhi usemi uliozoeleka na nafasi ya kuelewa neno hilo kuwa utawala wa kifalme au yale yanayotawaliwa. ‘Utawala’ pekee ungeweza kusisitiza tendo la kutawala na kupunguza wazo la ufalme unaotolewa kwa watu.
- issue: Maana ya εὐδόκησεν kuhusu mapenzi ya Mungu
  choice: amependezwa
  alternative: ameamua kwa neema
  rationale: ‘Amependezwa’ linaonyesha ridhaa na nia njema ya Baba bila kuingiza maelezo ya kimafundisho kuhusu amri ya Mungu ambayo hayajasemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Wingi katika ‘Msiogope,’ ‘yenu,’ na ‘kuwapa’ unawalenga watu wa kundi, huku ‘kundi dogo’ likihifadhi sitiari ya kichungaji. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini.
