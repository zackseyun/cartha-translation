translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inalinda mazingira ya kisheria bila kubadili “masinagogi” moja kwa moja kuwa “mahakama za masinagogi.” Alama zote za tanbihi zimo katika matini kuu.
