base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: sw
  text: Lakini watakapowapeleka mbele ya masinagogi, watawala na wenye mamlaka,[a] msihangaike kuhusu jinsi au nini mtakachosema katika kujitetea,[b] au kuhusu mtakachosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mbele ya mabaraza ya kidini na vyombo vya serikali ambavyo vinaweza kuwahoji wanafunzi.
    reason: cultural_note
  - marker: b
    text: Au kwa mtindo rasmi zaidi, “jinsi au kwa nini mtakavyojitetee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini watakapowapeleka
  rationale: δέ inaendeleza hoja kwa utofautishaji mdogo, hivyo “Lakini” inafaa; ὅταν pamoja na kitenzi cha hali tegemezi inaonyesha tukio la wakati ujao lisiloainishwa, linalowasilishwa kwa kawaida kwa “watakapowapeleka” katika Kiswahili.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: watakapowapeleka
  rationale: Katika muktadha wa kushtakiwa au kuhojiwa, εἰσφέρωσιν ni kuwaleta au kuwapeleka mbele ya vyombo vya mamlaka; “kuwapeleka” ni ya kawaida na inaendana na “mbele ya.”
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: mbele ya masinagogi, watawala na wenye mamlaka
  rationale: ἐπί pamoja na hali ya accusative ina maana ya kuletwa mbele ya vyombo au watu wanaohukumu. Orodha ya aina tatu imehifadhiwa bila kuzifanya zote kuwa kitu kimoja.
- source_word: συναγωγάς
  choice: masinagogi
  rationale: Neno halisi ni “masinagogi.” Ingawa hapa linaweza kumaanisha mabaraza ya masinagogi kwa njia ya metonimia, tafsiri kuu inadumisha istilahi yenyewe na tanbihi inaeleza kazi yake katika muktadha.
- source_word: ἀρχάς
  choice: watawala
  rationale: Katika muktadha huu ἀρχαί ni viongozi au watawala wenye jukumu la serikali, si “falme” au nguvu za kiroho.
- source_word: ἐξουσίας
  choice: wenye mamlaka
  rationale: Hapa neno linamaanisha watu au vyombo vilivyopewa mamlaka. “Wenye mamlaka” ni Kiswahili cha sasa na hutofautisha kwa kiasi fulani na “watawala.”
- source_word: μὴ μεριμνήσητε
  choice: msihangaike
  rationale: Kitenzi kinakataza wasiwasi wa kujishughulisha mno mapema; “msihangaike” ni cha kawaida na kina nguvu inayofaa bila kumaanisha kuwa maandalizi yote yamekatazwa kwa ujumla.
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: kuhusu jinsi au maneno mtakayotumia kujitetea
  rationale: 'πῶς na τί zote zimewakilishwa: “jinsi” inaonyesha namna, na “maneno mtakayotumia” inaonyesha yaliyomo. ἀπολογήσησθε ina maana ya kujitetea katika mazingira ya kisheria.'
- source_word: ἢ τί εἴπητε
  choice: wala kuhusu mtakayosema
  rationale: Kifungu hiki cha pili kimedumishwa tofauti na kujitetea. “Wala” huendeleza katazo baada ya “msihangaike,” huku “mtakayosema” ikiwakilisha kwa kawaida τί εἴπητε.
