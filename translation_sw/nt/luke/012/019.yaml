  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: sw
  text: Nami nitaiambia nafsi yangu[a], ‘Nafsi yangu, una vitu vingi vizuri vilivyowekwa akiba kwa miaka mingi ijayo. Pumzika, ule, unywe, ufurahi[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mimi mwenyewe” au “uhai wangu”; neno la Kigiriki ψυχή linaweza kuwa na maana hizo kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “ujifurahishe” au “usherehekee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: nitaiambia
  rationale: Wakati ujao wa λέγω unaonyesha kitendo cha kusema kitakachofanyika; ‘nitaiambia’ ni ya kawaida kwa kumwelekezea mtu au kitu maneno.
- source_word: ψυχῇ / Ψυχή
  choice: nafsi yangu
  rationale: Katika mfano huu mtu anajisemeza mwenyewe. ‘Nafsi yangu’ inadumisha taswira ya Kigiriki ya kuizungumza nafsi moja kwa moja bila kuifanya kauli ya kitaalamu kuhusu maumbile ya mwanadamu.
- source_word: ἀγαθὰ
  choice: vitu vingi vizuri
  rationale: Neno hili ni pana, ingawa katika muktadha linahusu mali au mazao yenye manufaa; ‘vitu vizuri’ huhifadhi upana huo.
- source_word: κείμενα
  choice: vilivyowekwa akiba
  rationale: Katika muktadha wa maghala, kitenzi hiki kinaeleza vitu vilivyowekwa au kuhifadhiwa tayari.
- source_word: εἰς ἔτη πολλά
  choice: kwa miaka mingi
  rationale: Hueleza muda mrefu wa baadaye ambao mali hiyo, kwa mawazo ya msemaji, itamtosheleza.
- source_word: ἀναπαύου
  choice: Pumzika
  rationale: Amri hii inahimiza kupumzika au kujistarehesha; ‘Pumzika’ ni fupi, ya kawaida, na yenye hadhi.
- source_word: φάγε
  choice: ule
  rationale: Ni amri ya kula; umbo ‘ule’ linafuatana kwa kawaida na mfululizo wa matendo yanayotakiwa baada ya ‘Pumzika.’
- source_word: πίε
  choice: unywe
  rationale: Ni amri ya kunywa, imetafsiriwa moja kwa moja na kwa ulinganifu na ‘ule.’
- source_word: εὐφραίνου
  choice: ufurahi
  rationale: Kitenzi kinaweza kumaanisha kufurahi, kujifurahisha, au kufanya sherehe. ‘Ufurahi’ ni cha kawaida na hakiongezi wazo la sherehe rasmi ambalo si lazima liwepo.
theological_decisions:
- issue: Maana ya ψυχή katika mtu anayejisemeza ndani ya mfano
  choice: nafsi yangu
  alternative: mimi mwenyewe; uhai wangu
  rationale: Aya haisisitizi mgawanyo maalumu wa sehemu za mwanadamu, bali inaonyesha mtu akijisemeza. ‘Nafsi yangu’ huhifadhi nguvu ya kifasihi na mwangwi wa neno la Kigiriki bila kulifafanua kupita kiasi.
- issue: Nguvu ya εὐφραίνου katika mfululizo wa starehe
  choice: ufurahi
  alternative: ujistareheshe; usherehekee
  rationale: ‘Ufurahi’ huhifadhi maana pana ya kuwa na furaha; mbadala zinaweza kusisitiza anasa au sherehe kuliko Kigiriki kinavyolazimisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa ‘nafsi yangu’ umehifadhiwa kwa sababu ni sehemu ya mbinu ya kifasihi ya mtu kujihutubia. Mfululizo wa amri umetolewa kwa lugha rahisi na ya kawaida.
