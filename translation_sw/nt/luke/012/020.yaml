base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: sw
  text: Lakini Mungu akamwambia, “Mpumbavu! Usiku huu huu, uhai wako utadaiwa kutoka kwako.[a] Na vitu ulivyovitayarisha vitakuwa vya nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yako itadaiwa kutoka kwako.” Neno la Kigiriki linaweza kumaanisha “uhai” au “nafsi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Mpumbavu
  rationale: Ni neno la moja kwa moja la kumkemea mtu asiye na busara; ‘Mpumbavu!’ ni la kawaida, lenye nguvu, na haliongezi maelezo yasiyomo katika Kigiriki.
- source_word: ταύτῃ τῇ νυκτί
  choice: Usiku huu huu
  rationale: Kurudiwa kwa ‘huu’ kunatoa mkazo wa demonstrative na kuonyesha kuwa jambo hilo litatokea mara moja.
- source_word: ψυχήν
  choice: uhai
  rationale: Katika muktadha wa kifo kinachokaribia, ψυχή inarejelea uhai wa mtu. ‘Uhai’ ni wazi kwa Kiswahili cha sasa, huku maana mbadala ya ‘nafsi’ ikihifadhiwa katika tanbihi.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: unadaiwa kutoka kwako
  rationale: Kitenzi cha wingi hakimtaji mtendaji. Muundo huu wa kutendwa huepuka kubuni watendaji na huhifadhi maana ya kudai au kutaka kilichoko kwa mtu, bila kuongeza waziwazi neno ‘kurudishwa.’
- source_word: ἃ δὲ ἡτοίμασας
  choice: vitu ulivyovitayarisha
  rationale: Hurejelea mali alizokusanya na kuziweka tayari; ‘vitu ulivyovitayarisha’ ni ya karibu na Kigiriki na ya kawaida katika Kiswahili.
- source_word: τίνι ἔσται
  choice: vitakuwa vya nani?
  rationale: Huhifadhi swali la umiliki lililo katika dative interrogative na nguvu yake ya balagha kwa lugha ya asili ya Kiswahili.
theological_decisions:
- issue: Tafsiri ya ψυχή katika muktadha wa kifo
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unasisitiza kifo cha mtu huyo kinachokaribia, si ufafanuzi maalumu wa muundo wa mwanadamu. ‘Uhai’ huepuka kuamua mjadala wa kiantropolojia, na ‘nafsi’ imeonyeshwa katika tanbihi ili kuhifadhi upana wa neno la Kigiriki.
- issue: Mtendaji asiyeelezwa katika ἀπαιτοῦσιν
  choice: 'muundo wa kutendwa: ‘unadaiwa kutoka kwako’'
  alternative: ‘wanadai kutoka kwako’
  rationale: Kigiriki kina kitenzi cha wingi bila kuwataja watendaji. Muundo wa kutendwa huhifadhi kutokutajwa huko badala ya kuwatambulisha wao ni nani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Usiku huu huu’ huleta msisitizo wa haraka; swali la mwisho limewekwa kwa mpangilio wa kawaida wa Kiswahili. Alama ya tanbihi imewekwa mara baada ya kishazi kinachohusika.
