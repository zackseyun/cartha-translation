id: LUK.12.33
reference: Luke 12:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: sw
  text: Uzeni mali zenu na toeni sadaka kwa wahitaji[a]. Jifanyieni mifuko ya fedha isiyochakaa, na hazina isiyopungua mbinguni[b], mahali ambapo mwizi hakaribii wala nondo haharibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wape wahitaji msaada.” Neno la Kigiriki linamaanisha matendo ya huruma yanayoonyeshwa kwa kutoa kwa wenye uhitaji.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina umbo la wingi, “katika mbingu”; Kiswahili kwa kawaida husema “mbinguni.”
    reason: source_form
lexical_decisions:
- source_word: πωλήσατε
  choice: Uzeni
  rationale: Amri ya wakati uliopita katika Kigiriki inatoa wito wa hatua ya dhati; “uzeni” ni sawa la kawaida bila kuongeza kwamba kila kitu lazima kiuzwe kabisa.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: mali zenu
  rationale: Kirai hiki kinamaanisha vitu au mali ambazo ni za wasikilizaji; “mali zenu” ni Kiswahili cha kawaida na chenye upana unaofaa.
- source_word: δότε ἐλεημοσύνην
  choice: kuwapa wahitaji
  rationale: ἐλεημοσύνη humaanisha msaada wa huruma unaotolewa kwa wenye uhitaji. “Kuwapa wahitaji” huwasilisha tendo halisi kwa lugha ya sasa bila kulifanya kuwa hisani ya kitaasisi pekee.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Jifanyieni
  rationale: Huhifadhi amri pamoja na maana ya kutenda kwa manufaa yenu wenyewe.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: mifuko ya fedha isiyochakaa
  rationale: βαλλάντια ni mifuko ya kubebea fedha, na μὴ παλαιούμενα inaeleza kitu kisichozeeka au kuchakaa; tafsiri hii huhifadhi sitiari halisi.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: hazina isiyopungua
  rationale: ἀνέκλειπτος huonyesha kisichokoma, kushindwa, au kuisha; “isiyopungua” ni ya asili katika muktadha wa hazina na haiongezi wazo lisilokuwapo.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  rationale: Ingawa Kigiriki kina umbo la wingi, “mbinguni” ndiyo nahau ya kawaida ya Kiswahili na inaweza kuwasilisha wazo la anga za juu bila kulazimisha umbo lisilo la asili.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: mahali ambapo mwizi hakaribii
  rationale: Huhifadhi taswira ya mahali na maana ya ἐγγίζω, ‘kukaribia.’
- source_word: οὐδὲ σὴς διαφθείρει
  choice: wala nondo haharibu
  rationale: σής ni nondo anayeharibu vitu, na διαφθείρω hapa humaanisha kuharibu; “wala” huhifadhi ulinganifu hasi.
theological_decisions:
- issue: Maana ya ἐλεημοσύνην katika agizo kuhusu mali
  choice: kuwapa wahitaji
  alternative: kutoa sadaka za huruma
  rationale: Chaguo hili linaweka wazi kwamba utoaji unawalenga wenye uhitaji, huku likiepuka kufanya neno kuwa sadaka ya kidini au mpango mpana wa kiuchumi usiotajwa katika aya.
- issue: Uhusiano wa “mifuko” na “hazina”
  choice: yaani hazina isiyopungua
  alternative: mifuko ... na hazina isiyopungua
  rationale: Kigiriki kina mfululizo wa viambajengo ambapo “hazina” hufafanua kwa karibu picha ya mifuko isiyochakaa. “Yaani” huonyesha ufafanuzi huo bila kudai kwamba mifuko halisi iko mbinguni.
- issue: Umbo la wingi la ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  alternative: katika mbingu
  rationale: Kiswahili cha kawaida hutumia “mbinguni” kwa dhana hii. Tanbihi huhifadhi taarifa kwamba Kigiriki kina umbo la wingi, bila kuunda sentensi ngumu au isiyo ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wahitaji” ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi ya kale “sadaka,” huku tanbihi ikihifadhi mbadala wa kileksika. Sitiari za mifuko ya fedha, hazina, mwizi na nondo zimehifadhiwa.
