  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: sw
  text: Kisha mtu mmoja kutoka katika umati akamwambia, “Mwalimu, mwambie ndugu yangu agawane nami urithi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Kisha ... akamwambia
  rationale: δέ ni kiunganishi chepesi cha simulizi; “Kisha” linaendeleza tukio kwa Kiswahili cha kawaida bila kusisitiza upinzani.
- source_word: τις
  choice: mtu mmoja
  rationale: Kiwakilishi kisichobainisha mtu maalumu; “mtu mmoja” ni usemi wa asili katika simulizi la Kiswahili.
- source_word: ἐκ τοῦ ὄχλου
  choice: kutoka katika umati
  rationale: Huonyesha kwamba mtu huyo alikuwa miongoni mwa watu waliokusanyika; “umati” ni neno la kawaida na lenye heshima.
- source_word: αὐτῷ
  choice: akamwambia
  rationale: Yambwa hii inayemrejelea Yesu imejumuishwa kwa kawaida katika kitenzi cha Kiswahili “akamwambia.”
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni namna ya kumwita anayefundisha na haiingizi maana ya ziada kuhusu mamlaka.
- source_word: εἰπὲ
  choice: mwambie
  rationale: Amri ya λέγω hapa ni ombi la Yesu aseme na ndugu huyo; “mwambie” ni tafsiri ya moja kwa moja na ya asili.
- source_word: τῷ ἀδελφῷ μου
  choice: ndugu yangu
  rationale: Huhifadhi wazi uhusiano na umilikaji ulio katika Kigiriki.
- source_word: μερίσασθαι
  choice: anigawie
  rationale: Kitenzi hiki humaanisha kugawa au kutoa sehemu. Katika muktadha wa urithi, “anigawie” huwasilisha kwa kawaida kwamba msemaji anataka apewe sehemu yake.
- source_word: μετ’ ἐμοῦ
  choice: anigawie
  rationale: Wazo la kushirikishwa “pamoja nami” limewasilishwa kiidiomatiki kwa kiambishi cha yambwa -ni katika “anigawie”; tafsiri sisisi “agawanye pamoja nami” si ya asili katika muktadha huu.
- source_word: τὴν κληρονομίαν
  choice: urithi
  rationale: “Urithi” ni neno pana na sahihi kwa mali inayorithiwa, bila kubainisha kupita kiasi hali ya kisheria.
