translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo “anigawie urithi” umetumiwa kwa ufasaha badala ya tafsiri sisisi isiyo ya kawaida, huku ombi la kupata sehemu ya urithi likihifadhiwa.
