reference: Luke 12:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: sw
  text: Nanyi muwe kama watu wanaomngojea bwana wao arudi kutoka kwenye karamu ya harusi, ili atakapokuja na kubisha, wamfungulie mara moja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριον ἑαυτῶν
  choice: bwana wao
  rationale: Huhifadhi maana ya mkuu wa nyumba au mwenye mamlaka juu yao, pamoja na mwangwi unaowezekana wa cheo cha ‘Bwana’, bila kulazimisha maana moja.
- source_word: προσδεχομένοις
  choice: wanaomngojea
  rationale: Kitenzi kinaonyesha kusubiri kwa kutazamia; ‘wanaomngojea’ ni cha kawaida na cha asili katika Kiswahili.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: arudi kutoka kwenye karamu ya harusi
  rationale: Katika muktadha huu ἀναλύσῃ ni kuondoka huko na kurudi, huku γάμοι kwa wingi ikirejelea sherehe au karamu ya harusi.
- source_word: εὐθέως
  choice: mara moja
  rationale: Huwasilisha moja kwa moja wazo la kufungua bila kuchelewa.
theological_decisions:
- issue: Utambulisho wa κύριος katika mfano
  choice: bwana wao
  alternative: mkuu wao / mwajiri wao
  rationale: ‘Bwana’ hudumisha upeo wa maana ya κύριος na uwezekano wa maana ya kimfano bila kuingiza kwa lazima uhusiano wa ajira au kupunguza mwangwi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa ‘ili atakapokuja... wamfungulie’ umechaguliwa ili kuonyesha lengo la kuwa tayari.
