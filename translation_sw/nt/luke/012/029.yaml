id: LUK.12.29
reference: Luke 12:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: sw
  text: Nanyi, msitafute mtakachokula na mtakachokunywa, wala msifadhaike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiwe na wasiwasi,” “msiwe na mashaka,” au kwa maana halisi zaidi, “msining’inie katika hali ya kutokuwa na hakika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: nanyi
  rationale: Kiwakilishi kimetajwa wazi na kina mkazo; “nanyi” hudumisha utofautishaji huo kwa Kiswahili cha kawaida bila uzito wa “ninyi wenyewe.”
- source_word: ζητεῖτε
  choice: msitafute
  rationale: Huhifadhi maana ya msingi ya kutafuta na, katika muktadha, kukazia fikira mahitaji hayo. Umbo la katazo linafaa kwa amri ya Kigiriki yenye μή.
- source_word: τί φάγητε
  choice: mtakachokula
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha jambo lisilojulikana au linalofikiriwa kuhusu chakula, bila kuligeuza kuwa swali la moja kwa moja.
- source_word: τί πίητε
  choice: mtakachokunywa
  rationale: Hufuata muundo sambamba na “mtakachokula” na kuwasilisha kwa kawaida jambo linalofikiriwa kuhusu kinywaji.
- source_word: μετεωρίζεσθε
  choice: msifadhaike
  rationale: Kitenzi kinaweza kuonyesha hali ya kuyumbishwa moyoni, kuwa na wasiwasi, au kubaki katika hali ya sintofahamu. “Msifadhaike” ni cha kawaida na kinaacha upana huo kuliko neno mahsusi zaidi la hofu.
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... wala
  rationale: “Na” hudumisha uratibu wa chakula na kinywaji; “wala” ni uratibu wa kawaida wa Kiswahili kwa kuongeza katazo la pili, ingawa Kigiriki hutumia καί.
theological_decisions:
- issue: Katazo kuhusu mahitaji ya chakula na kinywaji bila kuingiza dhana ya kukataa mali au mahitaji ya mwili
  choice: Katazo la kutafuta kwa kufadhaika kile cha kula na kunywa
  alternative: Katazo la kufanya mipango yoyote ya chakula na kinywaji, au agizo la kutoyajali kabisa mahitaji ya mwili
  rationale: Muktadha unahusu mahangaiko juu ya mahitaji ya maisha. Tafsiri inadumisha katazo lenyewe bila kulifanya fundisho kwamba maandalizi ya kawaida ni mabaya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nanyi” huweka mkazo wa kiwakilishi mwanzoni. “Wala” hufanya katazo la pili lisikike kwa kawaida, na tanbihi huhifadhi upana na taswira ya μετεωρίζεσθε.
