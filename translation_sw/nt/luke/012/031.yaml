  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: sw
  text: Bali utafuteni ufalme wake[b][a], na vitu hivi vitaongezwa kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufalme wa Mungu”; Kigiriki kinasema “ufalme wake,” na muktadha ndio unaoonyesha anayerejelewa.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinasema “ufalme wa Mungu” badala ya “ufalme wake.”
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Bali
  rationale: Huonyesha tofauti na kuhangaikia mahitaji ya maisha kulikotajwa kabla, kwa mtindo mfupi na wenye hadhi.
- source_word: ζητεῖτε
  choice: utafuteni
  rationale: Amri ya wakati uliopo inaelekeza kwenye jitihada na mwelekeo unaoendelea; Kiswahili cha kawaida kinaweza kuwasilisha hilo kwa amri hii bila kuongeza neno la ufafanuzi.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Ni tafsiri ya kawaida inayoweza kujumuisha utawala wa mfalme na eneo au hali ya kutawaliwa, bila kuibana maana kuwa 'utawala' pekee.
- source_word: αὐτοῦ
  choice: wake
  rationale: Huhifadhi kiwakilishi cha Kigiriki badala ya kumtaja Mungu moja kwa moja; muktadha unaonyesha kuwa kinamrejelea Mungu.
- source_word: ταῦτα
  choice: vitu hivi
  rationale: Hurejelea mahitaji yaliyotajwa katika muktadha. Hakuna neno 'vyote' katika usomaji huu, hivyo halijaongezwa kwa kufananisha na Mathayo.
- source_word: προστεθήσεται
  choice: mtazidishiwa
  rationale: Huwasilisha kitenzi cha wakati ujao katika kauli tendwa na kudumisha picha ya kitu kuongezwa, kwa Kiswahili kinachoeleweka.
- source_word: ὑμῖν
  choice: -wa- katika mtazidishiwa
  rationale: Yambwa ya Kiswahili ndani ya kitenzi huwasilisha maana ya 'kwenu' kwa njia ya kawaida na isiyo nzito.
theological_decisions:
- issue: Mrejelewa wa αὐτοῦ
  choice: Kiwakilishi kimetafsiriwa 'wake,' na muktadha unakirejesha kwa Mungu.
  alternative: Kuweka wazi 'ufalme wa Mungu.'
  rationale: Muktadha wa Baba na utunzaji wa Mungu unaweka mrejelewa wazi, huku 'wake' ikihifadhi umbo na kiwango cha uwazi cha maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Bali' linafaa katika sajili ya Biblia na linaeleweka kwa urahisi; viambishi vya wingi katika 'utafuteni' na 'mtazidishiwa' vinawakilisha ὑμῖν.
