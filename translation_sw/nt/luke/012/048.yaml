  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: sw
  text: Lakini yule ambaye hakujua, naye akafanya mambo yaliyostahili mapigo, atapigwa mapigo machache.[a] Kwa kila mtu aliyepewa mengi, mengi yatatakiwa kutoka kwake; na kutoka kwa yule ambaye walimkabidhi mengi, watadai mengi zaidi kutoka kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki huacha nomino ‘mapigo’ ieleweke baada ya ‘machache’; imetajwa hapa ili sentensi ya Kiswahili iwe wazi.
    reason: Ufafanuzi wa muundo wa Kigiriki na sababu ya kuitaja ‘mapigo’ katika Kiswahili.
  - marker: b
    text: Au, ‘watamtaka mengi zaidi.’
    reason: Njia nyingine ya kuwasilisha αἰτήσουσιν αὐτόν katika muktadha wa uwajibikaji.
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: yule ambaye hakujua
  rationale: Kirai hiki kinamweleza mtu aliyekosa kujua; ‘hakujua’ ni Kiswahili cha kawaida na hakiongezi hukumu kuhusu sababu ya kutokujua kwake.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: alifanya mambo yaliyostahili mapigo
  rationale: Muundo huu unahifadhi uhusiano kati ya matendo na adhabu iliyostahili bila kubadili taswira halisi ya mapigo kuwa neno la jumla tu kama ‘adhabu.’
- source_word: πληγῶν
  choice: mapigo
  rationale: Katika muktadha huu neno linamaanisha mapigo yanayotolewa kama adhabu. ‘Mapigo’ ni neno la kawaida na halidokezi kifaa maalumu kama mjeledi.
- source_word: δαρήσεται ὀλίγας
  choice: atapigwa mapigo machache
  rationale: Kitenzi δέρω kinataja kupigwa waziwazi, na kivumishi cha kike ὀλίγας kinaonyesha nomino ‘mapigo’ iliyoachwa kueleweka. Kiswahili hunufaika kwa kuitaja tena ili maana iwe wazi.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: kwa kila mtu aliyepewa mengi
  rationale: Hii inawasilisha kanuni ya jumla ya uwajibikaji na kuandaa muundo wa ‘yatatakiwa kutoka kwake.’
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: mengi yatatakiwa kutoka kwake
  rationale: Katika muktadha huu ζητέω ina maana ya kutaka au kuhitaji mtu awajibike; kauli ya kutendwa inahifadhi kutotajwa kwa mwenye kudai.
- source_word: παρέθεντο
  choice: walimkabidhi
  rationale: παρατίθημι hapa ni kukabidhi kitu kwa mtu akitunze au akisimamie. ‘Walimkabidhi’ pia huhifadhi wingi usio na mtendaji aliyetajwa wazi katika Kigiriki.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: watadai mengi zaidi
  rationale: αἰτέω hapa, katika muktadha wa dhamana na uwajibikaji, ina nguvu kuliko ombi la kawaida. ‘Watadai’ huhifadhi wingi usio na mhusika aliyetajwa, na ‘mengi zaidi’ huonyesha kiwango kilichoongezeka.
theological_decisions:
- issue: Asili ya taswira ya adhabu
  choice: Kuhifadhi taswira halisi ya ‘mapigo’ na viwango tofauti vya kupigwa.
  alternative: Kutumia neno la jumla ‘adhabu,’ au kutaja mjeledi na hivyo kuifanya taswira iwe maalumu zaidi.
  rationale: Mfano huu unaunganisha kiwango cha uwajibikaji na maarifa ya mtu. Tafsiri inahifadhi taswira hiyo bila kuamua kwa undani aina au utaratibu wa hukumu unaowakilishwa.
- issue: Mtendaji katika kishazi cha mwisho
  choice: Kuhifadhi wingi usio na mhusika maalumu katika ‘walimkabidhi’ na ‘watadai.’
  alternative: Kumtaja Mungu au watu waziwazi kuwa ndio waliokabidhi na kudai.
  rationale: Vitenzi vya Kigiriki viko katika nafsi ya tatu wingi bila kiima kilichotajwa. Kumtaja Mungu au wanadamu kungeondoa hali hiyo ya kutotajwa na kuingiza ufafanuzi usio wazi katika maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unadumisha ulinganifu wa kupewa mengi, kukabidhiwa mengi, na kuwajibishwa zaidi; hauwataji wahusika ambao Kigiriki hakijawataja.
