  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: sw
  text: 'Kisha akawaambia mfano: “Shamba la mtu mmoja tajiri lilitoa mazao mengi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lilizaa kwa wingi” au “lilikuwa na mavuno mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Kisha akawaambia
  rationale: ‘Kisha’ linaonyesha mwendelezo wa simulizi bila kufanya δέ kuwa kiunganishi chenye ukinzani mkubwa. ‘Akawaambia’ ni Kiswahili cha kawaida kinachoeleza kwamba aliwaelekezea maneno hayo.
- source_word: παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ni neno la kawaida na lenye hadhi katika Kiswahili kwa simulizi fupi inayofundisha kwa kulinganisha, na hapa linahifadhi aina ya fasihi ya παραβολή.
- source_word: πρὸς αὐτοὺς
  choice: akawaambia
  rationale: Wazo la kuwaelekezea wao ujumbe limejumuishwa kiasili katika kitenzi ‘akawaambia’.
- source_word: λέγων
  choice: 'mfano huu:'
  rationale: Kirai ‘mfano huu’ pamoja na nukta mbili kinaingiza maneno ya mfano kwa Kiswahili cha asili, bila kurudia kwa uzito ‘akisema’ baada ya ‘akawaambia’.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: la mtu mmoja tajiri
  rationale: ‘Mtu mmoja tajiri’ linawakilisha τινός na nomino ya kiume bila kuongeza utambulisho ambao haupo katika chanzo; ‘la’ linaonyesha umiliki.
- source_word: εὐφόρησεν
  choice: lilizaa kwa wingi
  rationale: Kitenzi hiki kinaeleza ardhi inayotoa mazao vizuri au kwa wingi. Tafsiri hii ni fupi, ya kawaida, na inahifadhi taswira ya uzalishaji mwingi.
- source_word: ἡ χώρα
  choice: Shamba
  rationale: Katika muktadha huu χώρα ni ardhi ya kilimo au mali yenye mashamba, si nchi ya kisiasa. ‘Shamba’ linaeleweka kwa urahisi na linafaa kwa muktadha wa mazao.
