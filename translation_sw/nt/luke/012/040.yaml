  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: sw
  text: Ninyi pia iweni tayari[a], kwa sababu Mwana wa Adamu[b] anakuja kwa saa msiyoitarajia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninyi pia mwe tayari.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, “Mwana wa Adamu,” cheo ambacho Yesu hutumia kujitaja, huenda kikiwa na mwangwi wa Danieli 7:13–14.
    reason: cross_reference
  - marker: c
    text: Au, “kwa saa msiyodhani,” au “wakati msipotarajia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Ninyi pia
  rationale: 'Muundo huu unaonyesha ujumuishaji na msisitizo: wasikilizaji nao, kama watumishi katika mfano uliotangulia, wanapaswa kuwa tayari.'
- source_word: γίνεσθε ἕτοιμοι
  choice: iweni tayari
  rationale: Amri hii ya wakati wa sasa inadai hali endelevu ya kuwa tayari. ‘Iweni tayari’ ni Kiswahili cha kawaida chenye nguvu ya amri bila kuongeza neno lisilohitajika.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Neno hili linatanguliza sababu ya amri na limetafsiriwa kwa kiunganishi cha kawaida na wazi.
- source_word: ᾗ ὥρᾳ
  choice: saa
  rationale: Kirai hiki ni cha wakati. ‘Saa’ kinadumisha picha ya muda usiojulikana katika kauli ya Kigiriki.
- source_word: οὐ δοκεῖτε
  choice: msiyoitarajia
  rationale: Ingawa δοκέω inaweza kumaanisha kufikiri au kudhani, katika onyo hili maana ya kiutendaji ni kutotarajia tukio hilo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika Biblia ya Kiswahili na linahifadhi umbo halisi pamoja na mwangwi wake wa Danieli 7:13–14.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki umetumika kwa tukio lijalo. ‘Anakuja’ huhifadhi uhai na uharaka wa onyo hilo.
theological_decisions:
- issue: Tafsiri ya jina la Kikristo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ linahifadhi jina la cheo analotumia Yesu kujitaja na mwangwi wake wa kimasiya na wa Danieli bila kulifafanua kwa mfumo fulani wa kimadhehebu.
- issue: Nguvu ya wakati ya ἔρχεται katika kauli kuhusu wakati ujao
  choice: anakuja
  alternative: atakuja
  rationale: Wakati wa sasa unaweza kutumiwa kuhusu wakati ujao. ‘Anakuja’ huhifadhi hali ya sasa ya kitenzi na uharaka wake bila kuamua mfumo mpana wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unafuata mantiki ya Kigiriki huku ukibaki wa kawaida katika Kiswahili.
