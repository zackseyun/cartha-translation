id: LUK.12.1
reference: Luke 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: sw
  text: Wakati huo, maelfu mengi ya watu[a] yalipokusanyika, hata wakawa wanakanyagana, Yesu alianza kwanza kusema kwa wanafunzi wake, “Jihadharini[b] na chachu ya Mafarisayo, ambayo ni unafiki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makumi ya maelfu ya watu.” Neno la Kigiriki μυριάδες linaweza kumaanisha makumi ya maelfu au, kwa maana pana, umati mkubwa sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “Jiangalieni” / “Kuweni macho dhidi ya chachu ya Mafarisayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Wakati huo
  rationale: Kirai hiki kinaunganisha tukio hili na yaliyotangulia kwa maana ya wakati na mazingira; “Wakati huo” ni Kiswahili cha kawaida na cha asili.
- source_word: ἐπισυναχθεισῶν
  choice: yalipokusanyika
  rationale: Huwasilisha kukusanyika kwa watu wengi kwa Kiswahili cha kawaida bila kulazimisha hali tendwa ambayo si ya lazima katika muktadha.
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: maelfu mengi ya watu
  rationale: μυριάδες inaweza kumaanisha makumi ya maelfu au kwa upana umati mkubwa sana; chaguo hili linahifadhi ukubwa bila kutoa idadi kamili isiyokusudiwa.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: hata wakawa wanakanyagana
  rationale: “Hata” inaonyesha matokeo, na “wakawa wanakanyagana” inaonyesha hali ya fujo iliyoendelea.
- source_word: ἤρξατο λέγειν
  choice: alianza kuwaambia
  rationale: Huhifadhi maana ya kuanza kusema huku ikitaja walengwa kwa Kiswahili cha asili.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: kwanza wanafunzi wake
  rationale: Inaonyesha kwamba wanafunzi ndio waliotangulizwa kama walengwa wa maneno yake bila kudai kwa wazi mpangilio mwingine usiotajwa.
- source_word: Προσέχετε ἑαυτοῖς
  choice: Jihadharini
  rationale: Kitenzi cha kujirejelea kinaonyesha kuwa walipaswa kuwa macho kwa ajili ya usalama wao wenyewe; “Jihadharini” hubeba maana hiyo kwa kawaida.
- source_word: ἀπὸ τῆς ζύμης
  choice: na chachu
  rationale: Katika muundo “jihadharini na,” “na” hutambulisha jambo la kuepukwa. “Chachu” huhifadhi taswira ya Kigiriki badala ya kuibadili kuwa ufafanuzi.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: ambayo ni unafiki
  rationale: Huhifadhi maelezo ya moja kwa moja yanayotambulisha maana ya chachu katika muktadha huu.
- source_word: τῶν Φαρισαίων
  choice: ya Mafarisayo
  rationale: Huwasilisha uhusiano wa chachu hiyo na Mafarisayo kwa ufupi na kwa usahihi.
theological_decisions:
- issue: Nguvu ya sitiari ya “chachu”
  choice: Kudumisha “chachu” kama sitiari, huku aya yenyewe ikiitambulisha kuwa unafiki.
  alternative: Kutafsiri kwa ufafanuzi kuwa “mafundisho” au “ushawishi.”
  rationale: Kwa kuwa Luka mwenyewe anaeleza sitiari hiyo kuwa unafiki, taswira inapaswa kubaki bila kuwekewa maana finyu ya kimadhehebu.
- issue: Upeo wa πρῶτον
  choice: Yesu alianza kuwaambia kwanza wanafunzi wake.
  alternative: “Kwanza kabisa, aliwaambia wanafunzi wake.”
  rationale: Chaguo hili linaonyesha uwezekano mkubwa wa kutangulizwa kwa wanafunzi kama wasikilizaji, huku lisifunge kabisa uwezekano wa neno hilo kuwa ishara ya mpangilio wa mazungumzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku sitiari ya chachu, ukubwa usio kamili wa umati, na uwezekano wa maana ya πρῶτον vikihifadhiwa.
