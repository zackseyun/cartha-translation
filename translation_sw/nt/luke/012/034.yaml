  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: sw
  text: Kwa maana hazina yenu ilipo, ndipo moyo wenu utakapokuwa pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana popote ilipo hazina yenu, ndipo moyo wenu utakapokuwa pia.”
    reason: Mbadala wa “popote” unawezekana kwa ὅπου na unaweka wazi zaidi maana jumuishi ya kauli hii ya hekima.
lexical_decisions:
- source_word: ὅπου
  choice: ilipo
  rationale: Kirejeshi cha mahali katika “hazina yenu ilipo” kinawasilisha kwa kawaida maana ya mahali na kuhifadhi uhusiano wa “ilipo ... ndipo.”
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inaeleza msingi wa agizo lililotangulia; “Kwa maana” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: θησαυρός
  choice: hazina
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana halisi ya mali iliyowekwa pamoja na maana ya kitu kinachothaminiwa sana.
- source_word: καρδία
  choice: moyo
  rationale: Inahifadhi taswira ya kibiblia ya kitovu cha matamanio, mapenzi, na mwelekeo wa ndani wa mtu bila kuibana kuwa akili au hisia pekee.
- source_word: ἐκεῖ
  choice: ndipo
  rationale: Inahifadhi muundo wa mahali unaowiana na “ilipo,” huku ikisomeka kwa ufasaha katika Kiswahili.
- source_word: καὶ
  choice: na
  rationale: 'Katika muundo “ndipo na moyo ...,” neno hili linaonyesha nyongeza: moyo pia huwa mahali ilipo hazina.'
- source_word: ἔσται
  choice: utakapokuwa
  rationale: Inahifadhi wakati ujao ulio wazi katika Kigiriki na kuunganishwa kiasili na kirejeshi cha mahali “ndipo.”
- source_word: ὑμῶν
  choice: yenu / wenu
  rationale: Viwakilishi hivi vinaonyesha nafsi ya pili wingi katika “hazina yenu” na “moyo wenu,” kulingana na upatanisho wa kisarufi wa Kiswahili.
theological_decisions:
- issue: Maana ya kianthropolojia ya “moyo”
  choice: Kuhifadhi “moyo” kama neno la kibiblia linalomaanisha kitovu cha mapenzi, thamani, na mwelekeo wa mtu.
  alternative: Kutafsiri kwa ufafanuzi zaidi kama “matamanio yenu,” “nia yenu,” au “mawazo yenu.”
  rationale: “Moyo” huhifadhi upana na mvutano wa maana ya καρδία bila kuipunguza hadi sehemu moja tu ya maisha ya ndani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya kawaida, na yenye hadhi. Muundo “ilipo ... ndipo” umechaguliwa ili kuhifadhi uwiano wa Kigiriki “ὅπου ... ἐκεῖ,” na wakati ujao umehifadhiwa katika “utakapokuwa.”
