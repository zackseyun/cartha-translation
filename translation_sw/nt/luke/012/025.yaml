  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: sw
  text: Ni nani kati yenu ambaye kwa kuwa na wasiwasi anaweza kuongeza dhiraa moja kwenye urefu wa maisha yake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kimo chake.” Neno la Kigiriki linaweza kumaanisha muda wa maisha au kimo.
    reason: Kuhifadhi utata halisi wa ἡλικία na uhusiano wake na kipimo cha dhiraa.
lexical_decisions:
- source_word: μεριμνῶν
  choice: kwa kuwa na wasiwasi
  rationale: Huwasilisha tendo la kuhangaikia jambo au kuwa na wasiwasi kwa Kiswahili cha kawaida, kulingana na muktadha wa mafundisho dhidi ya wasiwasi.
- source_word: ἡλικίαν
  choice: urefu wa maisha yake
  rationale: Neno hili linaweza kumaanisha umri, muda wa maisha, au kimo. Katika muundo huu, ‘urefu wa maisha’ huhifadhi taswira ya kuongeza kipimo kwenye maisha, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: πῆχυν
  choice: dhiraa moja
  rationale: Ni kipimo cha kale cha urefu kutoka kiwiko hadi ncha ya kidole; kutafsiri kwa ‘dhiraa’ kunadumisha taswira halisi ya chanzo.
- source_word: δύναται ... προσθεῖναι
  choice: anaweza kuongeza
  rationale: Hutoa kwa uwazi wazo la uwezo wa kuongeza bila kupanua au kufafanua zaidi ya maandishi ya Kigiriki.
theological_decisions:
- issue: Je, ἡλικία humaanisha muda wa maisha au kimo?
  choice: urefu wa maisha yake
  alternative: kimo chake
  rationale: Maana zote mbili zina ushahidi wa kileksika, na dhiraa ni kipimo cha urefu. Maandishi makuu yanafuata maana ya muda wa maisha inayofaa muktadha wa wasiwasi kuhusu uhai, lakini tanbihi inahifadhi kwa uwazi uwezekano wa ‘kimo’ bila kuamua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa; ‘dhiraa’ ni neno la kibiblia linaloeleweka kama kipimo cha kale, na tanbihi inalinda utata wa neno la Kigiriki.
