  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: sw
  text: Na ikiwa mnawatendea mema wale wanaowatendea mema, mna sifa gani[a]? Hata wenye dhambi hufanya vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mna neema gani?” Neno la Kigiriki linaweza kumaanisha “neema,” “fadhila,” “shukrani,” au “sifa”; hapa linahusu sifa au pongezi kwa wema unaolipwa kwa wema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: mnawatendea mema
  rationale: Kitenzi hiki humaanisha kufanya mema au kuwanufaisha wengine. Usemi huu ni wa kawaida katika Kiswahili na unadumisha uhusiano wa kimatamshi na kirai kinachofuata.
- source_word: ἀγαθοποιοῦντας
  choice: wale wanaowatendea mema
  rationale: Umetafsiriwa kwa mzizi uleule wa ‘kutendea mema’ ili kuhifadhi urudiaji wa makusudi katika Kigiriki na kueleza wazi kwamba wema huo unaelekezwa kwa wasikilizaji.
- source_word: ποία ... χάρις
  choice: mna sifa gani
  rationale: Katika muktadha huu χάρις inaelekea kumaanisha sifa, pongezi, au kukubaliwa kunakotokana na tendo, si neema ya wokovu. ‘Mna sifa gani?’ ni swali la balagha lililo wazi na la kawaida.
- source_word: ὑμῖν
  choice: mna
  rationale: Dhana ya kitu kuwa ‘kwa ajili yenu’ au kuwahusu wasikilizaji imewasilishwa kiasili katika muundo wa Kiswahili ‘mna sifa gani?’
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Hili ni neno la kawaida na linaloeleweka kwa watu wanaotambuliwa kwa maisha ya dhambi, bila kulainisha jamii ya kimaadili na kidini iliyokusudiwa katika Luka.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: hufanya vivyo hivyo
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha moja kwa moja maana ya kufanya jambo lilelile kwa kawaida.
- source_word: καὶ
  choice: Na / Hata
  rationale: καὶ ya kwanza inadumisha mtiririko wa mfululizo wa mafundisho; ya pili ina nguvu ya kusisitiza na kwa hiyo imetafsiriwa ‘Hata’.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa mafundisho ya kimaadili
  choice: sifa au pongezi, si neema ya wokovu
  alternative: neema, fadhila, au shukrani
  rationale: Swali la balagha linahusu thamani ya kipekee au sifa inayoweza kutokana na kuwatendea mema wale wanaolipa mema. Kutumia ‘sifa’ huepuka kuingiza maana ya kisoteriolojia ambayo muktadha haulazimishi, huku tanbihi ikihifadhi upana halisi wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa ‘kutendea mema’ umehifadhiwa kwa sababu unaakisi muundo wa Kigiriki. ‘Ikiwa’ limechaguliwa badala ya ‘kama’ ili kudumisha sauti yenye hadhi bila kuwa ngumu.
