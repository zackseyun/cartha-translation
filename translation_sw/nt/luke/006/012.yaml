  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: sw
  text: Ikawa katika siku hizo, alitoka kwenda mlimani kusali, naye akakesha usiku kucha katika sala kwa Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliendelea kukesha usiku kucha katika sala kwa Mungu.”
    reason: Njia nyingine ya kuonyesha hali endelevu ya ἦν διανυκτερεύων.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha simulizi katika Luka. “Ikawa” kinadumisha kazi yake ya kuanzisha tukio bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: siku hizo
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea kipindi kilichotajwa katika muktadha wa simulizi.
- source_word: ἐξελθεῖν αὐτὸν
  choice: alitoka akaenda
  rationale: Muundo wa kitenzi-jina pamoja na kiima chake umegeuzwa kuwa kishazi kamili cha Kiswahili; “alitoka akaenda” kinahifadhi wazo la kutoka na kuelekea mahali panapotajwa.
- source_word: εἰς τὸ ὄρος
  choice: mlimani
  rationale: “Mlimani” ni tafsiri ya asili na isiyolazimisha ikiwa mahali hapo palikuwa mlima mmoja maalumu, kilima, au eneo la milima.
- source_word: προσεύξασθαι
  choice: kusali
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kwenda kwake; “kusali” ni lugha ya kawaida, yenye heshima, na inayoeleweka kwa upana.
- source_word: ἦν διανυκτερεύων
  choice: akakesha usiku kucha
  rationale: Muundo huu unaonyesha tendo lililoendelea usiku mzima. “Akakesha usiku kucha” ni wa asili katika Kiswahili na unadumisha maana ya kukaa katika tendo hilo usiku wote.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: akimwomba Mungu
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha sala ilielekezwa kwa Mungu, bila kutoa dhana potovu kwamba sala ilikuwa ya Mungu mwenyewe.
theological_decisions:
- issue: Uhusiano wa τοῦ θεοῦ na sala ya Yesu
  choice: akimwomba Mungu
  alternative: katika sala ya Mungu
  rationale: Muktadha unaonyesha kwamba Yesu ndiye anayesali na Mungu ndiye anayeelekezewa sala. Tafsiri hii haiongezi maelezo ya kimadhehebu wala kuficha ukweli wa kitheolojia kwamba Yesu alimwomba Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ikawa” kinadumisha ladha ya kisimulizi ya Luka; sentensi nyingine imetungwa kwa mtiririko wa kawaida unaoeleweka kwa msomaji wa kawaida.
