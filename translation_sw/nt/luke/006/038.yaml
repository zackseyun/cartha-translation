  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: sw
  text: 'Toeni, nanyi mtapewa: kipimo kizuri—kilichoshindiliwa, kilichotikiswa, na kinachofurika[a]—watakiweka katika upindo wa nguo zenu[b]. Kwa maana kipimo mnachotumia kupimia ndicho mtakachopimiwa nanyi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachomwagika nje.” Picha ni ya chombo kilichojazwa mpaka vilivyomo vinazidi na kumwagika.
    reason: lexical_alternative
  - marker: b
    text: Yaani, sehemu ya mbele ya vazi iliyokunjwa na kutumiwa kupokelea bidhaa zilizopimwa.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Toeni
  rationale: Ni amri ya wakati uliopo kwa wingi. “Toeni” ni ya kawaida na huhifadhi himizo la jumla bila kulazimisha maana ya kurudia-rudia.
- source_word: δοθήσεται ὑμῖν
  choice: nanyi mtapewa
  rationale: Huhifadhi hali ya kutendwa na wingi wa waambiwa kwa Kiswahili cha kawaida.
- source_word: μέτρον καλὸν
  choice: kipimo kizuri
  rationale: Huhifadhi picha ya kipimo na upana wa maana ya καλόν bila kuongeza wazo mahsusi la ukarimu.
- source_word: πεπιεσμένον
  choice: kilichoshindiliwa
  rationale: Hueleza bidhaa iliyobanwa ndani ya chombo ili ipate nafasi zaidi, sawasawa na picha ya kipimo sokoni.
- source_word: σεσαλευμένον
  choice: kilichotikiswa
  rationale: Huhifadhi kitendo cha kutikisa chombo ili vilivyomo vitulie na kushikana, bila kuongeza maelezo hayo ndani ya mstari.
- source_word: ὑπερεκχυννόμενον
  choice: kinachofurika
  rationale: Huwasilisha kwa uwazi wingi unaozidi mpaka yaliyomo yanamwagika nje.
- source_word: δώσουσιν
  choice: watawatilia
  rationale: Kiambishi wa- huhifadhi nafsi ya tatu wingi yenye mtendaji asiyetajwa, badala ya kuigeuza kuwa kauli ya kutendwa.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: katika upindo wa nguo zenu
  rationale: Hutoa maana ya kitamaduni ya κόλπος kama sehemu ya mbele ya vazi iliyokunjwa ili kupokea bidhaa, kuliko “mapajani,” ambayo inaweza kuficha picha hiyo.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Kwa maana kipimo mnachotumia kupimia
  rationale: Huhifadhi sitiari ya kupima na uhusiano wa sentensi ya sababu kwa Kiswahili kinachoeleweka.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: ndicho mtakachopimiwa nanyi
  rationale: Huhifadhi hali ya kutendwa na maana ya kipimo kilekile kurudishwa kwa waambiwa, bila kuibadili kuwa lugha ya malipo ya kifedha.
theological_decisions:
- issue: Iwapo usemi huu uelezwe kuwa unahusu fedha au sadaka pekee
  choice: Kuacha lugha ya kutoa na kupimiwa ikiwa pana
  alternative: Kuitafsiri mahsusi kuwa kutoa sadaka au mali
  rationale: Muktadha unahusu rehema, kutohukumu, kusamehe, na kutoa. Kigiriki hakifungi amri hii kwa fedha, kwa hiyo tafsiri haileti fundisho la ustawi wala maana nyembamba ya kifedha.
- issue: Utambulisho wa wanaotoa kipimo kwa waambiwa
  choice: Kuhifadhi mtendaji asiyetajwa kwa “watawatilia”
  alternative: Kumtaja Mungu au watu waziwazi
  rationale: Kigiriki kimetumia nafsi ya tatu wingi bila kumtaja mtendaji. Kumtaja Mungu au watu kungeondoa utata halisi wa muundo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa picha ya kipimo umehifadhiwa; “upindo wa nguo” umechaguliwa ili picha ya kitamaduni ieleweke. Viwakilishi vya wingi vinafuata Kigiriki.
