source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: sw
  text: Furahini siku hiyo na mruke kwa shangwe[a], kwa maana, tazama, thawabu yenu ni kubwa mbinguni; kwa kuwa baba zao waliwatendea manabii vivyo hivyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwe na furaha siku hiyo na mruke.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maana baba zao walikuwa wakiwatendea manabii kwa mambo yaleyale”; maana yake ni kwamba mababu wao waliwatendea manabii kwa namna iyo hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Furahini
  rationale: Amri ya wingi inatoa mwito wa moja kwa moja wa kufurahi; “Furahini” ni ya kawaida, yenye heshima, na ya asili katika Kiswahili.
- source_word: σκιρτήσατε
  choice: mruke kwa shangwe
  rationale: Kitenzi kinaonyesha tendo la kimwili linalotokana na furaha kubwa; usemi huu unahifadhi tendo na sababu yake kwa Kiswahili cha kawaida.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linavuta fikira kwenye sababu inayofuata; “tazama” huhifadhi nguvu hiyo ya usemi katika sajili ya kibiblia inayoeleweka.
- source_word: μισθὸς
  choice: thawabu
  rationale: Katika muktadha huu ni malipo mema yanayoahidiwa, si mshahara wa kawaida wa kazi; “thawabu” huwasilisha maana hiyo wazi.
- source_word: πολὺς
  choice: ni kubwa
  rationale: Kivumishi kinaeleza ukubwa wa thawabu; “thawabu ... ni kubwa” ni muundo wa asili na huhifadhi mkazo wa Kigiriki.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Hurejelea makao au eneo la mbinguni; “mbinguni” ni tafsiri ya kawaida na ya asili bila kuongeza ufafanuzi wa kiteolojia.
- source_word: κατὰ τὰ αὐτά
  choice: vivyo hivyo
  rationale: Nahau hii ina maana ya kwa namna ileile; “vivyo hivyo” ni fupi, wazi, na ya kawaida.
- source_word: ἐποίουν
  choice: waliwatendea
  rationale: Kitenzi cha wakati usiotimilika kinaweza kuonyesha mwenendo wa zamani uliokuwa ukitokea; katika Kiswahili, “waliwatendea ... vivyo hivyo” huwasilisha maana hiyo kwa ufasaha bila kulazimisha hali ya tendo kisawe kwa kisawe.
- source_word: τοῖς προφήταις
  choice: manabii
  rationale: Neno ni mpokeaji wa tendo la ποιέω; kiambishi cha yambwa katika “waliwatendea” kinaonyesha kwa kawaida kwamba manabii ndio waliotendewa.
- source_word: οἱ πατέρες αὐτῶν
  choice: baba zao
  rationale: Huhifadhi taswira halisi ya kifamilia na ukali wa shutuma ya kihistoria; dokezo linaeleza kwamba hapa ina maana ya mababu wao.
theological_decisions:
- issue: Asili na mahali pa thawabu iliyoahidiwa
  choice: thawabu yenu ni kubwa mbinguni
  alternative: thawabu yenu mbele za Mungu mbinguni ni kubwa
  rationale: Maandishi yanataja mbinguni bila kuongeza wazi kwamba thawabu iko “mbele za Mungu”; tafsiri inahifadhi usemi na mvutano wake wa kieskatolojia.
- issue: Marejeo ya “baba zao”
  choice: baba zao
  alternative: mababu wao
  rationale: Usemi halisi wa kifamilia umehifadhiwa katika maandishi makuu, huku dokezo likifafanua kwamba unarejelea mababu wa wale wanaowatesa wanafunzi.
- issue: Namna mababu walivyowatendea manabii
  choice: waliwatendea manabii vivyo hivyo
  alternative: waliwafanyia manabii mambo yaleyale
  rationale: Kigiriki kimebanwa na hakitaji tendo mahususi katika mstari huu. Tafsiri ya “waliwatendea ... vivyo hivyo” ni ya asili lakini haiongezi maelezo ya aina ya mateso zaidi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Furahini,” “tazama,” na “thawabu” hudumisha ladha ya kibiblia bila kuwa ngumu; “mruke kwa shangwe” na “waliwatendea ... vivyo hivyo” ni miundo ya kawaida inayosomeka kwa urahisi.
