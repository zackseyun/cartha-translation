base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: sw
  text: Lakini yeye alijua mawazo yao[a], akamwambia mwanamume aliyekuwa na mkono uliokauka[b], “Inuka, simama katikati[c].” Naye akainuka, akasimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hoja zao za moyoni.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkono uliosinyaa.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: “kwenda katikati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alijua
  rationale: Kitenzi hiki kinaeleza ufahamu wa Yesu kwa njia ya moja kwa moja; tafsiri haiongezi maelezo kuhusu jinsi alivyoyajua.
- source_word: διαλογισμοὺς
  choice: mawazo
  rationale: Neno hili linaweza kumaanisha mawazo, hoja, au tafakari za ndani. “Mawazo” ni Kiswahili cha kawaida na hakibani maana kupita kiasi.
- source_word: ἀνδρὶ
  choice: mtu
  rationale: Ingawa neno la Kigiriki humtaja mwanamume, katika Kiswahili “mtu aliyekuwa na...” ni mtungo wa kawaida; muktadha tayari humrejelea mhusika huyo bila kulazimisha usemi mzito.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: mkono uliokauka
  rationale: Huhifadhi taswira ya msingi ya ξηρός, yaani kiungo kilichokauka au kusinyaa, bila kutaja ugonjwa mahususi ambao maandishi hayasemi.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Huonyesha hatua ya kwanza ya kuinuka kutoka mahali alipokuwa, na kuitofautisha na amri inayofuata ya kusimama.
- source_word: στῆθι
  choice: usimame
  rationale: Huhifadhi amri ya pili kama tendo tofauti baada ya kuinuka.
- source_word: εἰς τὸ μέσον
  choice: katikati
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mtu huyo alitakiwa kwenda na kusimama katikati ya waliokusanyika.
- source_word: ἀναστὰς ἔστη
  choice: akainuka, akasimama
  rationale: Huhifadhi mfuatano wa matendo mawili katika Kigiriki badala ya kuyafanya tendo moja.
theological_decisions:
- issue: Yesu kujua mawazo ya watu wengine
  choice: alijua mawazo yao
  alternative: alitambua makusudi yao; alijua hoja zao kwa uwezo usio wa kawaida
  rationale: Andiko linasema kwamba Yesu aliyajua mawazo yao, lakini halielezi njia aliyotumia kuyajua. Tafsiri inaacha dai hilo kama lilivyo bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Amri mbili, “Inuka” na “usimame,” zimewekwa tofauti ili kuhifadhi muundo wa chanzo.
