reference: Luke 6:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: sw
  text: Unawezaje kumwambia ndugu yako[a], “Ndugu, niruhusu nitoe kibanzi kilicho katika jicho lako,” wakati wewe mwenyewe huioni boriti[b] iliyo katika jicho lako? Mnafiki! Kwanza ondoa boriti katika jicho lako mwenyewe; ndipo utaona wazi ili ukitoe kibanzi kilicho katika jicho la ndugu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa hutafsiri neno la Kigiriki ἀδελφός, ambalo katika mstari huu ni umoja wa kiume; fundisho linaweza kutumika kwa watu kwa upana zaidi.
    reason: cultural_note
  - marker: b
    text: “Kibanzi” ni kipande kidogo cha kitu kikavu; “boriti” ni kipande kikubwa cha mbao ya ujenzi. Maneno hayo yanahifadhi utofauti wa kutia chumvi uliomo katika Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι
  choice: Unawezaje
  rationale: Huhifadhi swali la balagha linalopinga uwezo au uhalali wa tendo hilo kwa Kiswahili cha kawaida.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: ndugu / Ndugu / ndugu yako
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kumrejelea ndugu wa kiume au mshiriki wa jumuiya; tanbihi inaonyesha kwamba Kigiriki ni umoja wa kiume.
- source_word: ἄφες ἐκβάλω
  choice: niruhusu nikitoe
  rationale: ἄφες hapa ni ombi la ruhusa, na ἐκβάλω katika taswira ya jicho humaanisha kukitoa kitu.
- source_word: κάρφος
  choice: kibanzi
  rationale: Huonyesha kipande kidogo cha kitu kikavu, kinachoweza kuingia jichoni, na kudumisha utofauti mkubwa na δοκός.
- source_word: δοκός
  choice: boriti
  rationale: Ni kipande kikubwa cha mbao kinachotumika katika ujenzi; neno hili huhifadhi taswira ya kutia chumvi na utofauti na kibanzi.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: huku wewe mwenyewe hulioni
  rationale: “Wewe mwenyewe” huhifadhi mkazo wa αὐτός, na “huku” huonyesha hali inayokinzana na dai la kumsaidia mwingine.
- source_word: ὑποκριτά
  choice: Mnafiki wewe!
  rationale: Huhifadhi karipio la moja kwa moja la nomino ya wito; “wewe” huleta nguvu ya wito kwa Kiswahili cha asili.
- source_word: διαβλέψεις
  choice: utakapoona vizuri
  rationale: Kitenzi hiki kina maana ya kuona wazi au sawasawa baada ya kizuizi kuondolewa.
- source_word: ἐκβαλεῖν
  choice: na kuweza kukitoa
  rationale: Muundo huu unaunganisha kuona vizuri na uwezo wa kukiondoa kibanzi kwa Kiswahili cha kawaida, bila kugeuza maana ya kusudi.
theological_decisions:
- issue: Neno la undugu lenye jinsia ἀδελφός katika mawaidha ya kimaadili
  choice: ndugu
  alternative: ndugu wa kiume; mwenzako
  rationale: “Ndugu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili, lakini inaweza kutoonyesha wazi jinsia ya sarufi ya Kigiriki; tanbihi huhifadhi habari hiyo bila kupanua matini kuwa “ndugu wa kiume au wa kike.”
- issue: Utofauti wa kitamathali kati ya κάρφος na δοκός
  choice: kibanzi ... boriti
  alternative: kijiti ... gogo; kipande kidogo ... boriti
  rationale: Jozi hii huhifadhi picha halisi na tofauti ya kutia chumvi kati ya kitu kidogo mno na mbao kubwa, bila kulegeza ukali wa mawaidha.
- issue: Maana ya kujichunguza kabla ya kumrekebisha mwingine
  choice: Kwanza litoe boriti ... ndipo ... kukitoa kibanzi
  alternative: Usimrekebishe mwingine kamwe
  rationale: Matini haikatazi kabisa kumsaidia mwingine; inaweka kwanza sharti la kushughulikia upofu au kosa la mtu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi swali la balagha, picha kali ya jicho, kibanzi na boriti, pamoja na karipio la moja kwa moja. Alama zote za tanbihi zimewekwa katika matini kuu.
