id: LUK.6.43
reference: Luke 6:43
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: sw
  text: Kwa maana hakuna mti mzuri unaozaa tunda bovu[a], wala tena mti mbovu unaozaa tunda zuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunda lililooza” / “mti uliooza.” Neno la Kiyunani linaweza kumaanisha kilichoharibika, kilichooza, au kibaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ
  choice: Kwa maana hakuna
  rationale: “Kwa maana” huhifadhi uhusiano wa maelezo unaoletwa na γάρ, na “hakuna” huwasilisha ukanushi wa kuwepo kwa jambo hilo kwa Kiswahili cha kawaida.
- source_word: δένδρον καλὸν
  choice: mti mzuri
  rationale: “Mti” ndiyo maana ya kawaida katika mfano huu wa kilimo, na “mzuri” huhifadhi maana ya καλός bila kuamua mapema ikiwa msisitizo ni afya, ubora, au wema wa kimaadili.
- source_word: ποιοῦν καρπὸν
  choice: unaozaa tunda
  rationale: Kwa habari ya mti, “kuzaa tunda” ni usemi wa asili wa Kiswahili na huwasilisha vizuri kitendo cha ποιέω pamoja na καρπός.
- source_word: σαπρόν
  choice: bovu / mbovu
  rationale: “Bovu” kwa tunda na “mbovu” kwa mti ni Kiswahili cha kawaida kinachoweza kumaanisha kilichoharibika au kisichofaa, hivyo kinahifadhi upana wa σαπρός na ulinganifu wa sentensi.
- source_word: οὐδὲ πάλιν
  choice: wala tena
  rationale: “Wala” huunganisha kishazi cha pili cha ukanushi, na “tena” huhifadhi mchango wa πάλιν katika muundo wa Kiyunani.
- source_word: καρπὸν καλόν
  choice: tunda zuri
  rationale: Huhifadhi ulinganifu wa kinyume kati ya καλόν na σαπρόν na pia taswira halisi ya tunda.
theological_decisions:
- issue: Nguvu ya sitiari ya kilimo na maadili
  choice: Kutumia “bovu/mbovu” katika maandishi makuu
  alternative: “lililooza/uliooza”
  rationale: “Bovu/mbovu” ni la kawaida na pana katika Kiswahili, likiruhusu taswira ya uharibifu wa tunda na maana yake ya kimaadili kubaki pamoja bila kuifanya sentensi isikike kama inazungumzia kuoza kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vipashio viwili vinavyokinzana umehifadhiwa, huku “unaozaa” ukifanya sentensi iwe ya asili kwa wasomaji wa kawaida.
