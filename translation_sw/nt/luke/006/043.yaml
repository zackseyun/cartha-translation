  source_fidelity: The translation accurately renders the explanatory γάρ (“Kwa maana”), the two balanced negative clauses, and the contrast between καλός (“mzuri/zuri”) and σαπρός (“bovu/mbovu”). “Unaozaa tunda” is an idiomatic rendering of ποιοῦν καρπόν. “Wala tena” suitably represents οὐδὲ πάλιν without adding interpretation.
