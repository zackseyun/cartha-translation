  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: sw
  text: Kila mtu anayekuja kwangu na kusikia maneno yangu na kuyatenda—nitawaonyesha anafanana na nani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Kila mtu anayekuja kwangu
  rationale: Muundo huu unaonyesha kwa kawaida mtu yeyote bila kuondoa wigo wa πᾶς; “kwangu” huwasilisha mwendo unaoelekezwa kwa Yesu.
- source_word: ἀκούων μου τῶν λόγων
  choice: akayasikia maneno yangu
  rationale: “Maneno yangu” ni tafsiri ya moja kwa moja ya λόγων pamoja na μου. “Kuyasikia” huhifadhi tendo la kusikia bila kuongeza kwa lazima wazo la kutii, ambalo linaelezwa na kitenzi kinachofuata.
- source_word: ποιῶν αὐτούς
  choice: na kuyatenda
  rationale: Katika muktadha huu ποιέω humaanisha kutenda kulingana na maneno hayo. “Kuyatenda” huhifadhi uhusiano wa moja kwa moja na “maneno” na ni lugha yenye hadhi inayofahamika.
- source_word: ὑποδείξω ὑμῖν
  choice: nitawaonyesha
  rationale: Wakati ujao wa kitenzi unaanzisha mfano unaofuata; “nitawaonyesha” ni wa kawaida na huwasilisha wazi wingi wa ὑμῖν.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: anafanana na nani
  rationale: Kiswahili kinaweza kuhifadhi kwa njia ya kawaida muundo wa ulinganisho wa Kigiriki, yaani “anafanana na nani,” bila kuufanya kuwa maelezo ya jumla kama “jinsi alivyo.”
theological_decisions:
- issue: Uwakilishi wa mtu wa jumla katika umoja
  choice: Kutumia “kila mtu” na upatanisho wa ngeli ya mtu katika umoja
  alternative: Kutumia “yeyote” au kugeuza sentensi iwe katika wingi
  rationale: Kigiriki kinamtaja mtu yeyote kwa umbo la umoja. Kiswahili “kila mtu” huhifadhi umajumui huo na umoja bila kuingiza jinsia, kwa kuwa maumbo ya Kiswahili hapa hayabainishi mwanamume au mwanamke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Kistari kirefu kinaweka mkazo kwenye tangazo la Yesu kuhusu mfano unaofuata.
