id: LUK.6.19
reference: Luke 6:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: sw
  text: Umati wote ulikuwa ukijaribu kumgusa, kwa sababu nguvu zilikuwa zikitoka kwake na kuwaponya wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: Umati wote
  rationale: Muundo huu unaonyesha kwa Kiswahili sanifu kwamba umati mzima ulihusika, huku ukihifadhi nomino ya mk集合 ya Kigiriki.
- source_word: ἐζήτουν
  choice: ulikuwa ukijaribu
  rationale: Hali ya wakati usiotimilika inaonyesha jitihada iliyoendelea au iliyorudiwa; 'ulikuwa ukijaribu' ni ya kawaida na haiongezi msisitizo usio wazi katika chanzo.
- source_word: ἅπτεσθαι
  choice: kumgusa
  rationale: Katika muktadha huu wa uponyaji, kitenzi humaanisha kugusa au kushika; 'kumgusa' ni fasaha na sahihi zaidi.
- source_word: δύναμις
  choice: nguvu
  rationale: '''Nguvu'' huhifadhi maana ya uwezo wenye matokeo bila kuongeza kivumishi kama ''za kimiujiza,'' ambacho hakipo wazi katika Kigiriki.'
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: zilikuwa zikitoka kwake
  rationale: Usemi huu unahifadhi mwendo unaoendelea wa nguvu kutoka kwa Yesu. Upatanisho wa wingi katika Kiswahili unatokana na nomino 'nguvu.'
- source_word: ἰᾶτο
  choice: kuwaponya
  rationale: Kiunganishi 'na' pamoja na kitenzi cha kuendelea kilichotangulia huwasilisha tendo la uponyaji lililoendelea kwa Kiswahili cha kawaida.
- source_word: πάντας
  choice: wote
  rationale: '''Wote'' inarejelea watu walioponywa na kuhifadhi dai jumuishi la maandishi bila kulipanua.'
theological_decisions:
- issue: Asili ya nguvu zinazotoka kwa Yesu
  choice: nguvu zilikuwa zikitoka kwake
  alternative: nguvu za kimiujiza zilikuwa zikitoka kwake
  rationale: Tafsiri inamtaja Yesu moja kwa moja kuwa chanzo cha nguvu zenye kuponya, lakini haiongezi ufafanuzi wa kimafundisho au kivumishi kisichotajwa katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kuendelea umehifadhiwa kwa vitendo vya kujaribu na kutoka, huku sentensi ikibaki ya kawaida kwa msomaji wa leo. Hakuna tanbihi iliyowekwa kwa kuwa tofauti ya 'coming out/going out' ya Kiingereza haihitaji mbadala tofauti katika Kiswahili; 'kutoka kwake' inahifadhi maana ya chanzo kwa uwazi.
