  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: sw
  text: Lakini yule aliyesikia na hakutenda[a] ni kama mtu aliyejenga nyumba juu ya ardhi bila msingi. Mto ulipoipiga kwa nguvu, nyumba hiyo ilianguka mara moja, na uharibifu wa nyumba hiyo ulikuwa mkubwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakuyatenda” au “hakuyaweka katika matendo.” Kitenzi cha Kigiriki ni “kutenda/kufanya”; hapa kinamaanisha kutenda kulingana na maneno ya Yesu.
    reason: lexical_alternative
  - marker: b
    text: Au “mpasuko wa nyumba hiyo ulikuwa mkubwa.” Neno la Kigiriki linaweza kumaanisha mpasuko, kuvunjika, au uharibifu uliotokana na kuanguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Lakini yule aliyesikia na hakutenda
  rationale: Muundo wa kisifa wenye kibainishi umetafsiriwa kwa Kiswahili cha kawaida kama “yule aliyesikia.” “Hakutenda” huhifadhi kitenzi cha jumla ποιέω na tofauti kati ya kusikia na kutenda, bila kuongeza wazi kitu kinachotendwa.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ni kama mtu
  rationale: Hii ni lugha ya kawaida ya ulinganisho. “Mtu” ni tafsiri ya asili ya ἄνθρωπος katika Kiswahili na haiingizi jinsia ambayo nomino ya Kigiriki yenyewe hailazimishi hapa.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: aliyejenga nyumba juu ya ardhi bila msingi
  rationale: Tafsiri hii hudumisha taswira na mpangilio wa msingi wa Kigiriki. “Ardhi” hapa ni sehemu ya juu ambako nyumba ilijengwa, na “bila msingi” ni usemi mfupi na wa kawaida.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Mto ulipoipiga kwa nguvu
  rationale: Kiwakilishi ᾗ kinarejelea nyumba. προσρήγνυμι huonyesha mgongano mkali; “kuipiga kwa nguvu” huwasilisha ukali huo kwa Kiswahili cha wazi. Muundo wa “ulipo-” huleta uhusiano wa wakati kwa ufasaha.
- source_word: καὶ εὐθὺς συνέπεσεν
  choice: nyumba hiyo ilianguka mara moja
  rationale: συμπίπτω katika muktadha wa nyumba humaanisha kuanguka au kuporomoka. “Ilianguka” ni ya kawaida na “mara moja” huhifadhi εὐθύς. Kurudia “nyumba hiyo” huondoa utata wa kiwakilishi kwa Kiswahili.
- source_word: καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: na uharibifu wake ulikuwa mkubwa
  rationale: ῥῆγμα inaweza kumaanisha mpasuko, kuvunjika, au uharibifu unaotokana na kuanguka. “Uharibifu” ni wa asili katika muktadha huu, huku “ulikuwa mkubwa” ikihifadhi μέγα bila kuieleza kupita kiasi.
theological_decisions:
- issue: Lugha inayomwakilisha mwanadamu katika mfano
  choice: mtu
  alternative: mwanamume
  rationale: ἀνθρώπῳ ni umbo la kisarufi la kiume lakini nomino ἄνθρωπος kwa kawaida humaanisha mwanadamu au mtu, si lazima mwanamume. “Mtu” huhifadhi maana ya Kigiriki na ni lugha ya kawaida ya Kiswahili bila kupunguza matumizi yake ya uwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi zimeundwa kwa ufasaha wa Kiswahili huku taswira, ukali wa mgongano, na ukubwa wa matokeo vikihifadhiwa.
