id: LUK.6.35
reference: Luke 6:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: sw
  text: Lakini wapendeni adui zenu, tendeni mema, na kopesheni bila kutazamia kurudishiwa chochote[a]. Na thawabu yenu itakuwa kubwa, nanyi mtakuwa wana wa Aliye Juu Zaidi[b], kwa sababu yeye ni mwenye fadhili kwa wasio na shukrani na kwa waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa huenda si maana inayokusudiwa hapa, “bila kumkatia tamaa mtu yeyote” au “bila kupoteza tumaini.” Kirai cha Kigiriki μηδὲν ἀπελπίζοντες ni kigumu; katika muktadha huu kimeeleweka kuwa kutotazamia malipo au kurudishiwa kitu.
    reason: lexical_alternative
  - marker: b
    text: Neno “wana” linatafsiri nomino ya Kigiriki ya kiume iliyo katika wingi; katika muktadha huu linaweza kuwa na maana ya uwakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Huonyesha tofauti yenye nguvu na mwenendo wa kupenda kwa kutarajia kutendewa vivyo hivyo uliotajwa kabla, na ni kiunganishi cha kawaida katika Kiswahili cha sasa.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: wapendeni adui zenu
  rationale: Huhifadhi amri ya moja kwa moja na uzito wa neno ‘adui’ bila kulainisha maana kuwa wapinzani tu.
- source_word: ἀγαθοποιεῖτε
  choice: tendeni mema
  rationale: Ni usemi wa kawaida na wenye hadhi unaoonyesha kuwatendea wengine yaliyo mema.
- source_word: δανίζετε
  choice: kopesheni
  rationale: Hutoa maana ya kutoa kitu kwa mkopo bila kuongezea kwamba lazima kiwe pesa.
- source_word: μηδὲν ἀπελπίζοντες
  choice: bila kutazamia kurudishiwa chochote
  rationale: Katika muktadha wa kukopesha na kutarajia kutendewa vivyo hivyo, maana inayowezekana zaidi ni kutotazamia malipo au kitu kurudishwa; utata wa kirai umehifadhiwa katika tanbihi.
- source_word: μισθὸς ὑμῶν πολύς
  choice: thawabu yenu itakuwa kubwa
  rationale: ‘Thawabu’ inafaa kwa muktadha wa kimaadili na wa kimungu kuliko neno la mshahara wa kazi, huku ‘kubwa’ ikihifadhi nguvu ya πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: wana wa Aliye Juu Zaidi
  rationale: ‘Wana’ huhifadhi kwa karibu neno la Kigiriki la kiume υἱοί, na ‘Aliye Juu Zaidi’ ni jina la heshima la Mungu linaloeleweka kwa urahisi.
- source_word: χρηστός
  choice: mwenye fadhili
  rationale: Huonyesha wema unaodhihirika kwa kuwafanyia mema hata wasiostahili, si sifa ya jumla tu ya kuwa mwema.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: wasio na shukrani na waovu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya makundi yote mawili yanayotajwa katika Kigiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri υἱοὶ Ὑψίστου bila kufuta umbo la kiume la Kigiriki
  choice: wana wa Aliye Juu Zaidi
  alternative: watoto wa Aliye Juu Zaidi
  rationale: Kigiriki kimetumia nomino ya kiume ya wingi ‘wana’. Tafsiri kuu huihifadhi, huku tanbihi ikieleza kwamba katika muktadha huu inaweza kuwawakilisha wote wanaoishi kwa namna hii.
- issue: Maana ya μηδὲν ἀπελπίζοντες katika amri ya kukopesha
  choice: bila kutazamia kurudishiwa chochote
  alternative: bila kumkatia tamaa mtu yeyote; bila kupoteza tumaini
  rationale: Muktadha wa karibu unahusu kukopesha na kuacha kanuni ya kutenda kwa kutarajia kurudishiwa. Hata hivyo, kwa kuwa kirai cha Kigiriki ni kigumu na kinaweza kueleweka tofauti, maana nyingine imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; istilahi za kidini zimewekewa kiasi bila kufanya sentensi kuwa nzito.
