  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: sw
  text: Lakini wao wakajawa na ghadhabu ya kipumbavu[a], wakawa wakijadiliana wao kwa wao kuhusu wangefanya nini kwa Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazimu” au “upumbavu.” Neno la Kigiriki linaweza kumaanisha ukosefu wa busara, upumbavu, au hali ya kukosa akili.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi hiki kina mkazo na kinawatofautisha wapinzani hao na Yesu pamoja na mtu aliyeponywa; “wao” ni ya asili katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha tofauti kati ya tendo la Yesu katika muktadha uliotangulia na mwitikio wao.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: wakajawa na ghadhabu isiyo na akili
  rationale: Muundo wa ‘kujazwa’ umehifadhiwa. ἄνοια humaanisha ukosefu wa akili, upumbavu, au hali ya kutokuwa na busara; katika muktadha huu wa uhasama, tafsiri hii pia huwasilisha nguvu ya hasira bila kuifanya hali ya kitabibu.
- source_word: διελάλουν
  choice: wakajadiliana
  rationale: Kitenzi huonyesha mazungumzo ya pande mbili na hali ya kuendelea kutafakari jambo kwa pamoja.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Huhifadhi maana ya mazungumzo ya kurudishiana kati yao.
- source_word: τί ἂν ποιήσαιεν
  choice: kuhusu jambo ambalo wangeweza kumtendea
  rationale: ἄν pamoja na hali ya optative huonyesha uwezekano katika shauri lao; ‘wangeweza’ huepuka kuifanya kuwa wajibu au uamuzi uliokwisha kukamilika.
- source_word: τῷ Ἰησοῦ
  choice: Yesu
  rationale: Yambwa hii inaonyesha tendo linaloelekezwa kwa Yesu; ‘kumtendea Yesu’ haiongezi waziwazi ‘dhidi ya’ ingawa uhasama unaonekana katika muktadha.
theological_decisions:
- issue: Iwapo ἀνοίας itafsiriwe kama hali ya kiakili ya kitabibu au kama upumbavu na hasira isiyo na busara
  choice: ghadhabu isiyo na akili
  alternative: wazimu; upumbavu
  rationale: Chaguo hili huhifadhi hali ya kihisia na kutokuwa na busara katika mwitikio wao bila kudai ugonjwa wa akili. Tanbihi huhifadhi upana halisi wa neno la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ghadhabu” inafaa kwa sajili ya Biblia lakini inaeleweka kwa wasomaji wa kawaida; tanbihi inadumisha utata wa ἀνοίας.
