  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: sw
  text: Kulipokucha, aliwaita wanafunzi wake[a], akachagua kumi na wawili kati yao, ambao pia aliwapa jina “mitume”[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliwakusanya wanafunzi wake kwa kuwaita.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuita” au “kuzungumza nao,” lakini hapa muktadha unaelekea kwenye kuwaita waje ili achague baadhi yao.
    reason: lexical_alternative
  - marker: b
    text: Au “ambao pia aliwaita mitume.” Kitenzi cha Kigiriki kinaweza kumaanisha “kupa jina” au “kuita”; tafsiri ya msingi imetumia “aliwapa jina” ili kukitofautisha na “aliwaita” mwanzoni mwa mstari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Kulipopambazuka
  rationale: Ni Kiswahili cha kawaida na cha asili kinachoonyesha kufika kwa wakati wa mchana baada ya usiku, bila ukakasi wa tafsiri ya neno kwa neno.
- source_word: προσεφώνησεν
  choice: aliwaita
  rationale: Katika muktadha huu Yesu anawaita wanafunzi wamjie ili achague baadhi yao. Kitenzi kinaweza pia kumaanisha kusema nao, lakini mtiririko wa simulizi unaunga mkono maana ya kuwaita wakusanyike.
- source_word: μαθητὰς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika simulizi za Injili kwa watu wanaojifunza na kumfuata mwalimu.
- source_word: ἐκλεξάμενος
  choice: akachagua
  rationale: Linawasilisha kwa ufupi na kwa kawaida tendo la kuchagua kwa makusudi, huku likidumisha mfuatano wa matendo katika simulizi.
- source_word: ἀπ’ αὐτῶν
  choice: kati yao
  rationale: Linaonyesha wazi kuwa wale kumi na wawili walichaguliwa kutoka katika kundi kubwa zaidi la wanafunzi.
- source_word: δώδεκα
  choice: kumi na wawili
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja watu kumi na wawili.
- source_word: ἀποστόλους
  choice: mitume
  rationale: Ni istilahi ya Kiswahili iliyozoeleka kwa cheo hiki katika Injili na hapa ina nguvu ya jina maalumu alilowapa wale kumi na wawili, si maelezo ya jumla tu ya wajumbe.
- source_word: ὠνόμασεν
  choice: aliwapa jina la
  rationale: Kifungu hiki kinaonyesha wazi tendo la kuwapa cheo au jina, na pia kinakitofautisha na kitenzi cha awali kilichotafsiriwa ‘aliwaita.’
theological_decisions:
- issue: Iwapo ἀποστόλους itafsiriwe kwa maana ya jumla ‘waliotumwa/wajumbe’ au kwa cheo kilichozoeleka ‘mitume’
  choice: mitume
  alternative: waliotumwa; wajumbe
  rationale: Katika Luka 6:13 neno hili ni jina ambalo Yesu anawapa wale kumi na wawili, si maelezo ya kawaida tu ya watu waliotumwa kufanya kazi. ‘Mitume’ huhifadhi kazi yake kama cheo katika simulizi bila kuongeza madai ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Kulipopambazuka’ ni usemi wa sasa unaoeleweka kwa urahisi; ‘wanafunzi’ na ‘mitume’ ni istilahi za Biblia zilizozoeleka. Muundo wa vitenzi mfululizo—aliwaita, akachagua, aliwapa jina—unahifadhi mwendo wa simulizi bila kuwa wa kikale.
