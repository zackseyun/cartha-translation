  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: sw
  text: Ole wenu wakati watu wote watakapowasifu[a], kwa maana baba zao[b] waliwatendea manabii wa uongo vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakaposema mema juu yenu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “baba zao”; hapa ni vizazi vya zamani vya watu wao.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Ole wenu
  rationale: Neno “ole” linahifadhi nguvu ya tamko la kinabii la onyo na hukumu; “wenu” inaonyesha wazi kuwa Yesu anawaambia wasikilizaji wake.
- source_word: ὅταν
  choice: wakati
  rationale: Linatambulisha hali ya jumla inayoweza kutokea, huku likidumisha nguvu ya onyo.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: wanaposema mema juu yenu
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kwamba watu wanasema mambo yanayowapendelea au kuwasifu wengine, bila kuifanya sifa yenyewe kuwa maana pekee inayowezekana.
- source_word: πάντες οἱ ἄνθρωποι
  choice: watu wote
  rationale: Inarejelea wanadamu kwa ujumla na kuakisi kwa uwazi wingi na ujumla wa kirai cha Kigiriki.
- source_word: κατὰ τὰ αὐτά
  choice: vivyo hivyo
  rationale: Inatoa maana ya kutenda kwa namna ileile na kuunganisha moja kwa moja kibali cha sasa na desturi ya vizazi vilivyopita.
- source_word: γάρ
  choice: kwa maana
  rationale: Inaonyesha kuwa sentensi inayofuata ndiyo msingi unaofafanua onyo lililotangulia.
- source_word: ἐποίουν
  choice: walikuwa wakiwatendea
  rationale: Muundo huu unaonyesha tendo la kimazoea au lililorudiwa zamani, sawasawa na hali ya kitenzi cha Kigiriki.
- source_word: τοῖς ψευδοπροφήταις
  choice: manabii wa uongo
  rationale: Ni tafsiri ya kawaida na wazi ya wale waliodai kuwa manabii lakini hawakuwa wa kweli.
- source_word: οἱ πατέρες αὐτῶν
  choice: baba zao
  rationale: Inahifadhi taswira halisi ya Kigiriki na polemiki yake ya kizazi kwa kizazi; tanbihi inafafanua kuwa hapa ni vizazi vya zamani, si baba wa karibu tu.
theological_decisions:
- issue: Maana na nguvu ya kulinganisha na manabii wa uongo
  choice: Aya inaonya kwamba kusifiwa na watu wote kunafanana na jinsi vizazi vya zamani vilivyowatendea manabii wa uongo.
  alternative: Aya inakataza bila ubaguzi kila neno jema linalosemwa kuhusu mtu, au inalenga umaarufu pekee bila kuhusisha kibali cha uongo.
  rationale: γάρ na κατὰ τὰ αὐτά zinaweka msingi wa onyo katika mwenendo wa kihistoria wa kuwakubali manabii wa uongo. Tafsiri inadumisha mvutano huo bila kudai kwamba kila pongezi ni mbaya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usemi wa kibiblia lakini kinachoeleweka kwa urahisi. “Ole wenu” hudumisha uzito wa onyo la kinabii, na “walikuwa wakiwatendea” huonyesha tendo la kimazoea la wakati uliopita.
