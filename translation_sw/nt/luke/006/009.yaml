  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: sw
  text: 'Lakini Yesu akawaambia, “Ninawauliza: Je, ni halali siku ya Sabato kutenda mema au kutenda mabaya[a], kuokoa uhai[b] au kuuangamiza?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutenda yaliyo na madhara.” Kigiriki kinaweka mkabala wa kimaadili kati ya kutenda mema na kutenda mabaya au yenye kudhuru.
    reason: lexical_alternative
  - marker: b
    text: Au “kuokoa nafsi au kuiangamiza.” Hapa “uhai” umetumiwa kwa sababu muktadha unahusu kuuhifadhi au kuuangamiza uhai wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji wa kiasi, Yesu anapowajibu waliokuwa wakimchunguza.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Ninawauliza
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaohifadhi uzito wa swali la Yesu.
- source_word: εἰ ἔξεστιν
  choice: Je, ni halali
  rationale: Katika mabishano kuhusu Sabato, kitenzi hiki kinahusu jambo linaloruhusiwa kwa mujibu wa sheria.
- source_word: τῷ σαββάτῳ
  choice: siku ya Sabato
  rationale: Huu ni usemi wa asili katika Kiswahili unaotaja wazi siku husika.
- source_word: ἀγαθοποιῆσαι
  choice: kutenda mema
  rationale: Inahifadhi ulinganifu wa kimaadili na kauli inayofuata, 'kutenda mabaya.'
- source_word: κακοποιῆσαι
  choice: kutenda mabaya
  rationale: Inahifadhi maana pana ya tendo baya au lenye kudhuru bila kuifunga kwa madhara ya kimwili pekee.
- source_word: ψυχὴν
  choice: uhai
  rationale: Katika muktadha wa uponyaji na jozi ya kuokoa/kuangamiza, neno hili linamaanisha uhai wa mtu, si lazima nafsi isiyo ya kimwili.
- source_word: σῶσαι
  choice: kuokoa
  rationale: Inahifadhi maana ya msingi ya kulinda au kunusuru na pia mwangwi mpana wa matumizi ya kibiblia.
- source_word: ἀπολέσαι
  choice: kuuangamiza
  rationale: Inahifadhi ukali wa kinyume cha 'kuokoa' na ni pana kuliko tafsiri finyu ya 'kuua.'
theological_decisions:
- issue: Maana ya ψυχή katika kauli ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: kuokoa uhai au kuuangamiza
  alternative: kuokoa nafsi au kuiangamiza
  rationale: Muktadha wa uponyaji siku ya Sabato unahusu uhai wa mtu kwa namna halisi. Tafsiri hii haingizi kimyakimya fundisho maalumu kuhusu muundo wa mwanadamu, huku tanbihi ikihifadhi uwezekano wa neno 'nafsi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa jozi mbili zinazokinzana katika Kigiriki umehifadhiwa.
