  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: sw
  text: Na kama mnavyotaka watu wawatendee ninyi, watendeeni vivyo hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: kama mnavyotaka
  rationale: “Kama” pamoja na muundo wa “mnavyotaka” huonyesha kipimo cha ulinganisho kwa Kiswahili cha kawaida na cha asili.
- source_word: θέλετε
  choice: mnavyotaka
  rationale: θέλω hapa inaonyesha tamanio au mapendeleo ya kawaida; “kutaka” ni neno la kawaida na linaloeleweka wazi.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: wawatendee ninyi
  rationale: Muundo huu unaeleza jambo linalotamaniwa. “Kuwatendea” ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya “kuwafanyia,” huku ukihifadhi maana pana ya matendo yanayoelekezwa kwa mtu.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Neno hili linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ποιεῖτε αὐτοῖς
  choice: watendeeni
  rationale: Kauli ya amri ya wakati uliopo inatoa mwongozo wa mwenendo; amri “watendeeni” ni ya moja kwa moja na ya kawaida bila kulazimisha kipengele cha mwendelezo.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Hueleza tendo linalolingana na lile ambalo wasikilizaji wangependa watendewe; “vivyo hivyo” huhifadhi ulinganifu huo kwa uwazi.
theological_decisions:
- issue: Rejeo la jumla la οἱ ἄνθρωποι
  choice: watu
  alternative: wanadamu / wanaume
  rationale: Katika muktadha huu neno hilo ni la kijumla. “Watu” halileti maana ya wanaume pekee wala kuongeza ufafanuzi usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Kirai “ninyi” kimewekwa ili kusisitiza mpokeaji na kudumisha uwiano wa kauli, ingawa kiwakilishi tayari kimo ndani ya kitenzi.
