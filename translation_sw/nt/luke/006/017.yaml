  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: sw
  text: Kisha akashuka pamoja nao, akasimama mahali palipokuwa tambarare. Hapo palikuwa na umati mkubwa wa wanafunzi wake na watu wengi sana kutoka sehemu zote za Yudea, Yerusalemu, na maeneo ya pwani ya Tiro na Sidoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: akashuka
  rationale: Kitenzi hiki kinaonyesha mwendo wa kushuka uliotangulia tendo kuu; wakati wa masimulizi wa Kiswahili unaonyesha mfuatano huo kwa kawaida.
- source_word: ἔστη
  choice: akasimama
  rationale: Hii ndiyo maana ya moja kwa moja ya kuchukua nafasi ya kusimama katika mfululizo wa simulizi.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: mahali palipokuwa tambarare
  rationale: Tafsiri hii huhifadhi wazo la mahali penye usawa bila kudai kwa lazima kwamba lilikuwa uwanda mpana.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: umati mkubwa wa wanafunzi wake
  rationale: Huwasilisha umati uliokuwa na wanafunzi wake, huku ikihifadhi ukubwa unaosisitizwa na πολὺς.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: watu wengi sana
  rationale: Ni Kiswahili cha kawaida kinachoonyesha idadi kubwa ya watu na kuwatofautisha na wanafunzi waliotajwa kabla.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: kutoka sehemu zote za Yudea
  rationale: Huwasilisha kwa uwazi maana ya kutoka kote katika eneo la Yudea.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: maeneo ya pwani ya Tiro na Sidoni
  rationale: παράλιος huelekeza kwenye eneo la kandokando ya bahari linalohusishwa na miji hiyo.
theological_decisions:
- issue: Maelezo ya mahali pa mafundisho kwa kulinganisha na simulizi la Mathayo
  choice: mahali palipokuwa tambarare
  alternative: uwandani
  rationale: Uamuzi huu hufuata maana ya maneno ya Luka bila kuoanisha kimakusudi na simulizi jingine wala kudai kwamba mahali hapo palikuwa uwanda mpana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili orodha ya makundi na maeneo isomeke kwa urahisi; hakuna tofauti ya kimaana iliyokusudiwa.
