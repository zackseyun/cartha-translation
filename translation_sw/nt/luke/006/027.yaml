  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: sw
  text: 'Lakini ninawaambia ninyi mnaosikiliza: Wapendeni adui zenu; watendeeni mema wale wanaowachukia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na yaliyotangulia kwa njia ya kawaida na fupi katika Kiswahili.
- source_word: ὑμῖν λέγω
  choice: ninawaambia ninyi
  rationale: Inahifadhi usemi wa nafsi ya kwanza na msisitizo wa kiwakilishi cha wingi ὑμῖν; mpangilio huu pia unaunganika kwa kawaida na kifungu kinachofuata.
- source_word: τοῖς ἀκούουσιν
  choice: mnaosikiliza
  rationale: Kitenzi cha sasa chenye hali ya kushiriki kinaonyesha tendo linaloendelea na usikivu wa makusudi; ‘mnaosikiliza’ ni Kiswahili cha sasa na cha kawaida.
- source_word: ἀγαπᾶτε
  choice: Wapendeni
  rationale: Inahifadhi amri ya nafsi ya pili wingi na maana ya moja kwa moja ya kupenda.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: adui zenu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiwakilishi milikishi cha wingi.
- source_word: καλῶς ποιεῖτε
  choice: watendeeni mema
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo la kuwafanyia wengine yaliyo mema bila kulainisha amri.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: wale wanaowachukia
  rationale: Inahifadhi maana wazi ya μισέω na kuonyesha kwamba hao ndio wanaopokea matendo mema.
theological_decisions:
- issue: Amri za kimaadili kuhusu maadui
  choice: Amri zimetafsiriwa wazi na kwa wingi bila kuweka mipaka isiyokuwamo katika Kigiriki.
  alternative: Kuzihusisha na maadui binafsi pekee au kuzitafsiri kama kutia chumvi kwa balagha.
  rationale: Kigiriki kina amri za moja kwa moja za nafsi ya pili wingi, bila kizuizi cha wazi; tafsiri inadumisha uzito wake wa kimaadili na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Ninyi’ imetumika kudhihirisha msisitizo wa ὑμῖν, huku ‘mnaosikiliza’ ikihifadhi maana ya usikivu unaoendelea. Hakuna tanbihi inayohitajika kwa sababu utofauti wa Kiingereza ‘who hear/who are listening’ unawakilishwa kwa kawaida na ‘mnaosikiliza’ bila kupoteza utata muhimu.
