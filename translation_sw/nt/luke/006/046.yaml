  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: sw
  text: Kwa nini mnaniita[a], ‘Bwana, Bwana,’ lakini hamtendi ninayosema?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Mkuu, Mkuu.” Kigiriki: “Kyrie, kyrie.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu τί inauliza sababu, si kitu; “Kwa nini” ni Kiswahili cha kawaida na kinahifadhi nguvu ya swali la kukemea.
- source_word: δέ
  choice: lakini
  rationale: δέ ni kiunganishi chepesi. Hapa “lakini” linafaa kwa mtiririko wa hoja na pia linaonyesha wazi tofauti kati ya kumwita Yesu Bwana na kutotenda anayosema.
- source_word: με
  choice: -ni-
  rationale: Kiwakilishi cha yambwa nafsi ya kwanza kimeunganishwa kwa kawaida katika kitenzi “mnaniita.”
- source_word: καλεῖτε
  choice: mnaniita
  rationale: Ni kitenzi cha wakati wa sasa, nafsi ya pili wingi; “mnaniita” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu wa kumwita mtu kwa cheo.
- source_word: Κύριε κύριε
  choice: Bwana, Bwana
  rationale: “Bwana” huhifadhi cheo cha heshima na uzito wake wa kikristolojia; urudiaji umehifadhiwa ili kuonyesha msisitizo.
- source_word: καὶ οὐ
  choice: lakini ham-
  rationale: Ingawa καί kwa kawaida ni “na,” hapa muunganiko wake na ukanushi unaonyesha tofauti; Kiswahili cha kawaida hutumia “lakini hamfanyi.”
- source_word: ποιεῖτε
  choice: hamfanyi
  rationale: ποιέω hapa humaanisha kutenda au kutekeleza; “hamfanyi” ni rahisi, sahihi, na ya kawaida.
- source_word: ἃ
  choice: -nal(o)
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea jumla ya yale Yesu anayosema. Muundo wa Kiswahili “ninayosema” unawasilisha maana hiyo kwa kawaida bila kuongeza “mambo.”
- source_word: λέγω
  choice: ninayosema
  rationale: Huhifadhi maana rahisi ya “ninachosema” bila kuongeza dhana ya “ninayowaambia.”
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha kikristolojia
  choice: Bwana
  alternative: Mkuu / Mwalimu
  rationale: Katika muktadha huu Yesu anaambiwa moja kwa moja kwa cheo chenye heshima na mamlaka. “Bwana” huhifadhi vizuri uzito huo, huku tanbihi ikionyesha uwezekano wa maana ya “Mkuu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha, na chenye heshima. Wingi wa nafsi ya pili umehifadhiwa katika “mnaniita” na “hamfanyi.”
