  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: sw
  text: 'Pia akawaambia mfano: “Je, kipofu anaweza kumwongoza kipofu? Je, wote wawili hawataanguka shimoni?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “handakini” badala ya “shimoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: pia
  rationale: Huhifadhi nguvu ya nyongeza ya καὶ baada ya δὲ kwa Kiswahili cha kawaida.
- source_word: παραβολὴν
  choice: mfano
  rationale: Katika muktadha huu ni usemi wa picha unaofundisha; “mfano” ni neno la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: Μήτι δύναται
  choice: Je, ... anaweza
  rationale: Swali hili la balagha linatarajia jibu hasi; muundo huu wa Kiswahili huhifadhi swali bila kulifanya zito.
- source_word: τυφλὸς ... τυφλὸν
  choice: kipofu ... kipofu
  rationale: Nomino “kipofu” ni ya kawaida na haihitaji kuingiza jinsia ambayo Kiswahili haiweke wazi katika neno hili.
- source_word: ὁδηγεῖν
  choice: kumwongoza
  rationale: Hutoa kwa asili wazo la mtu mmoja kuonyesha mwingine njia.
- source_word: οὐχὶ ἀμφότεροι
  choice: Je, hawataanguka wote wawili
  rationale: Huhifadhi swali linalotarajia jibu chanya na msisitizo kwamba wote wawili wataathirika.
- source_word: βόθυνον
  choice: shimoni
  rationale: βόθυνος inaweza kumaanisha shimo au handaki; “shimoni” ni pana, ya picha, na ya kawaida katika Kiswahili.
- source_word: ἐμπεσοῦνται
  choice: wataanguka
  rationale: Wakati ujao wa Kigiriki umetafsiriwa kwa wakati ujao wa kawaida wa Kiswahili; kiambishi cha mahali katika “shimoni” tayari huonyesha kuanguka ndani.
theological_decisions:
- issue: Masculine singular yenye matumizi ya ujumla katika τυφλός
  choice: kipofu ... kipofu
  alternative: mwanamume kipofu ... mwanamume kipofu
  rationale: Kigiriki kina umbo la kiume la umoja lakini matumizi yake ni ya kiwakilishi katika methali. Kiswahili “kipofu” ni cha asili, huhusu mtu bila kutaja jinsia, na hakipunguzi upeo wa usemi.
- issue: Nguvu ya maswali mawili ya balagha
  choice: Kuhifadhi maswali yote mawili
  alternative: 'Kuyageuza kuwa kauli dhahiri: “Hawezi ... wote wataanguka”'
  rationale: Maswali hayo hubeba mkazo na mvutano wa usemi wa Yesu; kuyahifadhi kunafuata umbo na dhamira ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na rahisi kueleweka; “akawaambia mfano huu” ni wa asili zaidi kuliko kufuata mpangilio wa Kigiriki neno kwa neno.
