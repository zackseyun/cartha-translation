  to: Mtu mwema hutoa mema kutoka katika hazina njema ya moyo wake, na mtu mwovu hutoa maovu kutoka katika hazina yake ya uovu; kwa maana kinywa chake hunena kutokana na wingi wa moyo wake.[a]
