  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: sw
  text: Mtu mwema hutoa mema kutoka katika hazina njema ya moyo wake, na mtu mwovu hutoa maovu kutoka katika hazina yake ya uovu; kwa maana kinywa chake hunena kutokana na wingi wa moyo wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana kinywa chake hunena kutokana na kufurika kwa moyo wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: mtu mwema
  rationale: Neno “mtu” ni la kawaida na la uwakilishi katika Kiswahili; linaendeleza utofautishaji wa kimaadili bila kulazimisha jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
- source_word: θησαυροῦ
  choice: hazina
  rationale: “Hazina” huhifadhi sitiari ya akiba ya ndani ambamo mema au maovu hutolewa.
- source_word: καρδίας
  choice: moyo
  rationale: “Moyo” ni istilahi ya kawaida ya Kibiblia na ya Kiswahili kwa utu wa ndani, nia na hisia.
- source_word: προφέρει
  choice: hutoa
  rationale: “Hutoa” huonyesha kitu kinachotoka katika chanzo cha ndani na hudumisha ulinganifu wa vifungu viwili.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: mwovu / mbovu / maovu
  rationale: “Mwovu” na “maovu” huhifadhi uzito wa kimaadili wa πονηρός. “Hazina mbovu” ni Kiswahili cha asili zaidi kuliko “hazina ovu,” huku maana ya kimaadili ikibaki wazi katika muktadha.
- source_word: περισσεύματος
  choice: yale yaliyoujaa moyo
  rationale: Kauli hii ya asili katika Kiswahili huwasilisha wingi unaoujaza moyo na ambao hujitokeza kwa maneno; sitiari ya kufurika imehifadhiwa katika tanbihi kama chaguo la karibu zaidi na umbo la Kigiriki.
- source_word: λαλεῖ
  choice: hunena
  rationale: “Hunena” ina uzito unaofaa kwa msemo huu wa hekima bila kuwa ngumu kueleweka.
- source_word: τὸ στόμα αὐτοῦ
  choice: kinywa chake
  rationale: Muundo halisi umehifadhiwa ili kusisitiza kwamba maneno ya nje hufunua hali ya moyo.
theological_decisions:
- issue: Utofautishaji wa kimaadili katika ἀγαθός/πονηρός
  choice: Kuhifadhi makundi ya “mwema/mema” na “mwovu/maovu.”
  alternative: Kuyapunguza kuwa “mzuri/mabaya” au makundi ya utendaji tu.
  rationale: Muktadha unahusu tabia ya kimaadili na matokeo yake katika matendo na usemi; tafsiri haipaswi kupunguza uzito huo.
- issue: Uhusiano wa moyo na usemi katika περισσεύματος καρδίας
  choice: Kutafsiri kuwa kinywa hunena kutokana na yale yaliyoujaa moyo, huku tanbihi ikihifadhi picha ya kufurika.
  alternative: “Kinywa chake hunena kutokana na wingi wa moyo.”
  rationale: Chaguo kuu ni la kawaida na wazi kwa wasomaji wa Kiswahili, nalo halibadili dai kwamba yaliyomo moyoni ndiyo chanzo cha maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kimithali na ulinganifu wa mtu mwema na mtu mwovu umehifadhiwa. Alama ya tanbihi imewekwa baada ya sentensi inayohusu περισσεύματος, ambako chaguo hilo linatumika.
