  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: sw
  text: Ikawa, katika Sabato nyingine, aliingia katika sinagogi na alikuwa akifundisha. Palikuwa na mtu ambaye mkono wake wa kulia ulikuwa umenyauka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulikuwa umekauka.” Neno la Kigiriki linaweza kueleza kitu kilichokauka au kunyauka; hapa linarejelea ulemavu wa mkono wa kulia wa mtu huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Siku nyingine ya Sabato
  rationale: Kirai hiki ni mpito wa kawaida wa masimulizi ya Luka. Katika Kiswahili cha sasa, nguvu yake ya kuanzisha tukio inaelezwa kwa kawaida kupitia mwanzo wa sentensi ya wakati bila kuongeza neno la wakati lisilokuwamo katika Kigiriki.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: Siku nyingine ya Sabato
  rationale: ἕτερος inaonyesha tukio jingine la aina ileile; usemi huu ni wa kawaida na unaweka wazi mazingira ya wakati.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: aliingia katika sinagogi
  rationale: Kitenzi-jina kinachofuata ἐγένετο kimewasilishwa kwa kitenzi kamili cha Kiswahili. Kiwakilishi cha nafsi kinabaki kudokezwa katika kiambishi cha kitenzi kama ilivyo kawaida katika Kiswahili.
- source_word: καὶ διδάσκειν
  choice: na alikuwa akifundisha
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, si tukio moja tu lililokamilika.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Palikuwa na mtu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mtu huyo alikuwapo mahali pale; ἄνθρωπος hapa humrejelea mwanamume mmoja.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: mkono wake wa kulia
  rationale: Tafsiri hii inahifadhi msisitizo wa kwamba mkono ulioathirika ulikuwa wa kulia.
- source_word: ξηρά
  choice: ulikuwa umenyauka
  rationale: Kivumishi hiki humaanisha kitu kilichokauka au kunyauka; katika muktadha huu kinaeleza hali ya ulemavu wa mkono bila kubainisha kitabibu chanzo chake.
