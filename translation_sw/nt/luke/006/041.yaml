  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: sw
  text: Lakini kwa nini unakiona kibanzi[a] kilicho katika jicho la ndugu yako[b], lakini huitambui boriti[c] iliyo katika jicho lako mwenyewe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kipande kidogo cha kijiti” au “unyasi.” Neno la Kiyunani κάρφος humaanisha chembe ndogo, inayotofautishwa na boriti kubwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiyunani lililotafsiriwa “ndugu” ni la umoja wa kiume; hata hivyo, fundisho hili halihusu ndugu wa kiume pekee.
    reason: cultural_note
  - marker: c
    text: Au “mti mkubwa wa ujenzi.” Neno la Kiyunani δοκός humaanisha kipande kikubwa cha mbao, kama boriti.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: kwa nini
  rationale: Katika swali hili la kukemea, τί pamoja na βλέπεις ina nguvu ya kuuliza sababu, si kuuliza kitu kinachoonekana.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ inaendeleza mafundisho huku ikiweka tofauti ndogo na yaliyotangulia; “Lakini” huonyesha mgeuko huo kwa Kiswahili cha kawaida.
- source_word: βλέπεις
  choice: unakiona
  rationale: Huhifadhi picha halisi ya kuona na kukubaliana kisarufi na nomino “kibanzi.”
- source_word: κάρφος
  choice: kibanzi
  rationale: Neno hili hueleza kipande kidogo cha nyasi, makapi, au kijiti; “kibanzi” ni la asili katika mfano wa kitu kidogo kilicho jichoni na hutofautishwa wazi na boriti.
- source_word: ὀφθαλμῷ
  choice: jicho
  rationale: Ni tafsiri ya kawaida ya ὀφθαλμός, huku umoja wa Kiyunani ukihifadhiwa.
- source_word: ἀδελφοῦ
  choice: ndugu yako
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa uhusiano huu. Kwa kuwa halibainishi jinsia lenyewe, tanbihi inaeleza kuwa neno la Kiyunani hapa ni la umoja wa kiume.
- source_word: δοκόν
  choice: boriti
  rationale: δοκός ni kipande kikubwa cha mbao cha ujenzi; “boriti” huhifadhi ukubwa uliotiwa chumvi na tofauti yake na kibanzi.
- source_word: ἰδίῳ
  choice: lako mwenyewe
  rationale: “Mwenyewe” huhifadhi mkazo wa ἰδίῳ na tofauti kati ya jicho la ndugu na jicho la msikilizaji.
- source_word: κατανοεῖς
  choice: hulitambui
  rationale: κατανοέω hapa ni kutambua au kuzingatia kwa makini. “Hulitambui” hudumisha tofauti ndogo na βλέπεις badala ya kurudia tu kitenzi “kuona.”
theological_decisions:
- issue: Neno la uhusiano lenye jinsia ἀδελφοῦ
  choice: ndugu yako
  alternative: ndugu yako wa kiume; mwenzako
  rationale: Chanzo kina nomino ya umoja wa kiume katika mfano wa maadili. Kiswahili sanifu hutumia “ndugu” bila kubainisha jinsia; kuongeza “wa kiume” kungekuwa kizito na kungeipa jinsia mkazo usio wa kawaida, huku “mwenzako” ikifuta maana ya kindugu. Tanbihi huhifadhi taarifa ya kisarufi na upana wa matumizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la kukemea, picha ya kuona, tofauti kati ya kibanzi na boriti, na mkazo wa “lako mwenyewe” vimehifadhiwa. “Hulitambui” huepuka kusawazisha kabisa βλέπεις na κατανοεῖς.
