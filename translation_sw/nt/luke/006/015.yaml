  text: na Mathayo na Tomaso, na Yakobo mwana wa Alfayo, na Simoni aitwaye Zelote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye bidii.” Lakabu ya Kigiriki inaweza kueleza sifa yake, na haitoshi kuthibitisha kwamba alikuwa mwanachama rasmi wa harakati ya kisiasa iliyokuja kujulikana baadaye kwa jina hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha majina katika orodha; marudio yake yamehifadhiwa kwa kadiri inayosikika kwa kawaida katika Kiswahili.
- source_word: Μαθθαῖον
  choice: Mathayo
  rationale: Umbo la kawaida la Kiswahili la jina Μαθθαῖος.
- source_word: Θωμᾶν
  choice: Tomaso
  rationale: Umbo la kawaida la Kiswahili la jina Θωμᾶς.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Yakobo mwana wa Alfayo
  rationale: Katika mtindo huu wa kutambulisha mtu, hali ya umilikishi Ἁλφαίου inaeleweka kwa kawaida kuwa uhusiano wa mwana na baba; 'mwana wa' huueleza wazi na kwa Kiswahili cha kawaida.
- source_word: Σίμωνα
  choice: Simoni
  rationale: Umbo la kawaida la Kiswahili la jina Σίμων.
- source_word: τὸν καλούμενον
  choice: aitwaye
  rationale: Kitenzi hiki cha utendajiwa kinatoa utambulisho wa jina au lakabu kwa ufupi na kwa Kiswahili cha kawaida, bila kulazimisha wakati uliopita usiokuwamo wazi katika participio ya Kigiriki.
- source_word: Ζηλωτὴν
  choice: Zelote
  rationale: Lakabu ya kumtambulisha Simoni; umbo hili la kawaida linaacha wazi kama maana ni mtu mwenye bidii kubwa au uhusiano na kundi lililojulikana kwa jina hilo.
theological_decisions:
- issue: Kama Ζηλωτής ni jina la mshiriki wa kundi la kisiasa au lakabu inayoeleza tabia
  choice: Zelote
  alternative: mwenye bidii
  rationale: Maandishi ya Kigiriki yanathibitisha lakabu, lakini yenyewe hayalazimishi hitimisho kwamba Simoni alikuwa mwanachama rasmi wa harakati fulani ya kisiasa. Tafsiri kuu inahifadhi lakabu iliyozoeleka, na tanbihi inaonyesha maana mbadala bila kutatua suala la kihistoria kimabavu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umehifadhiwa kama sehemu ya orodha inayoendelea kutoka aya iliyotangulia; majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
