  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: sw
  text: na Yuda mwana wa Yakobo[a], na Yuda Iskariote, ambaye alikuja kuwa msaliti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yuda ndugu ya Yakobo”; Kigiriki kinasema tu “Yuda wa Yakobo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Yuda mwana wa Yakobo
  rationale: Muundo wa Kigiriki unasema kihalisi ‘Yuda wa Yakobo’ na hauitaji wazi uhusiano wenyewe. Katika orodha ya watu, Kiswahili cha kawaida huhitaji uhusiano ufafanuliwe; ‘mwana wa Yakobo’ ndilo chaguo linalokubalika zaidi, huku uwezekano wa ‘ndugu ya Yakobo’ ukihifadhiwa katika tanbihi.
- source_word: Ἰσκαριὼθ
  choice: Iskariote
  rationale: Hili ni jina au jina la utambulisho, hivyo limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kutafsiriwa.
- source_word: ὃς ἐγένετο
  choice: ambaye alikuja kuwa
  rationale: Kauli hii huhifadhi maana ya γίνομαι ya kuingia au kufikia hali fulani, badala ya kuifanya kuwa kauli tuli ya ‘alikuwa.’
- source_word: προδότης
  choice: msaliti
  rationale: ‘Msaliti’ ni nomino ya kawaida na yenye nguvu inayomaanisha mtu anayemsaliti mwingine; inafaa katika nafasi ya kiarifu baada ya ‘alikuja kuwa.’
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kinachorudiwa kinaunganisha majina mawili ya mwisho katika orodha kwa urahisi na kwa kawaida.
theological_decisions:
- issue: Uhusiano unaodokezwa na Ἰακώβου katika ‘Yuda wa Yakobo’
  choice: Kutafsiri ‘Yuda mwana wa Yakobo’ katika matini kuu
  alternative: Yuda ndugu ya Yakobo
  rationale: Kigiriki kinaacha aina ya uhusiano bila kutajwa. Kiswahili cha kawaida kinahitaji kuujaza katika orodha hii; ‘mwana wa Yakobo’ ni chaguo linalowezekana zaidi, lakini tanbihi inahifadhi uwezekano mwingine bila kuamua jambo hilo kidogma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alikuja kuwa’ ni ya asili na huhifadhi mabadiliko yanayoonyeshwa na kitenzi cha Kigiriki; ‘msaliti’ ni wazi kwa wasomaji wa kawaida.
