  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: sw
  text: Ikawa siku moja ya Sabato, alipokuwa akipita katikati ya mashamba ya nafaka, wanafunzi wake walikuwa wakichuma na kula masuke, huku wakiyasugua mikononi mwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Waliyasugua masuke mikononi ili kutenganisha punje zinazoliwa na makapi.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν σαββάτῳ
  choice: Siku moja ya Sabato
  rationale: 'Hutoa kwa Kiswahili cha kawaida utangulizi wa tukio na maana isiyo maalumu ya σαββάτῳ: tukio lilitokea katika mojawapo ya siku za Sabato.'
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: alipokuwa akipita katikati ya mashamba ya nafaka
  rationale: Muundo wa wakati unaoendelea unaakisi tendo lililokuwa likifanyika; “mashamba ya nafaka” haitaji aina maalumu ya zao ambayo Kigiriki hakuitaji.
- source_word: ἔτιλλον
  choice: walikuwa wakichuma
  rationale: Huhifadhi hali ya tendo linaloendelea iliyo katika kitenzi cha Kigiriki.
- source_word: καὶ ἤσθιον τοὺς στάχυας
  choice: na kula masuke
  rationale: “Masuke” ni neno la kawaida la Kiswahili kwa στάχυας, yaani sehemu za nafaka zenye punje.
- source_word: ψώχοντες ταῖς χερσίν
  choice: huku wakiyasugua mikononi mwao
  rationale: Huhifadhi tendo halisi la kuyasugua masuke kwa mikono na kulihusianisha na uchumaji na ulaji.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “alipokuwa akipita” unategemea mhusika aliyetajwa katika muktadha uliotangulia, kama ilivyo kwa kiwakilishi αὐτόν katika Kigiriki, bila kuingiza jina lisilotajwa katika mstari huu.
