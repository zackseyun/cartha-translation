id: LUK.6.48
reference: Luke 6:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: sw
  text: Anafanana na mtu[a] anayejenga nyumba, ambaye alichimba chini sana na akaweka msingi juu ya mwamba. Mafuriko yalipotokea, mto uliipiga nyumba hiyo kwa nguvu, lakini haukuweza kuitikisa, kwa sababu ilikuwa imejengwa vizuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume.” Neno la Kigiriki linaweza pia kumaanisha mtu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Anafanana na
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaoendeleza ulinganisho wa Yesu.
- source_word: ἀνθρώπῳ
  choice: mtu
  rationale: ἀνθρώπῳ humaanisha binadamu au mtu mmoja; “mtu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili bila kulazimisha jinsia ambayo neno lenyewe haliibainishi wazi katika muktadha huu.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: anayejenga nyumba
  rationale: Huhifadhi hali endelevu ya kitenzi-shirikishi na ni lugha ya kawaida ya ujenzi.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: alichimba chini sana
  rationale: Vitenzi viwili vinaonyesha kuchimba hadi kina kirefu; usemi huu wa Kiswahili unabeba msisitizo huo kwa kawaida.
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: kuweka msingi juu ya mwamba
  rationale: “Kuweka msingi” ni usemi wa kawaida wa ujenzi, na “mwamba” huhifadhi picha ya πέτρα bila kuifafanua zaidi kuwa tabaka la mwamba.
- source_word: πλημμύρης δὲ γενομένης
  choice: Mafuriko yalipotokea
  rationale: Hutoa kwa uwazi uhusiano wa wakati wa kishazi huru cha Kigiriki na kutumia Kiswahili cha kawaida.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: mto uliipiga nyumba hiyo kwa nguvu
  rationale: Kitenzi προσρήγνυμι kinaonyesha mgongano mkali; “kwa nguvu” huwasilisha ukali huo kwa Kiswahili kinachoeleweka.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: haukuweza kuitikisa
  rationale: Huhifadhi wazo la kutoweza na maana ya kuitikisa au kuiyumbisha nyumba.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: kwa sababu ilikuwa imejengwa vizuri
  rationale: Huhifadhi sababu inayotolewa na Kigiriki pamoja na hali ya kutendwa ya nyumba iliyokuwa tayari imejengwa.
theological_decisions:
- issue: Jinsia ya ἀνθρώπῳ katika mfano wa mtu mmoja
  choice: mtu
  alternative: mwanamume
  rationale: Neno ἄνθρωπος linaweza kumtaja binadamu au mtu bila kubainisha jinsia kisemantiki, ingawa umbo lake la kisarufi ni la kiume. “Mtu” huhifadhi upana huo wa asili katika Kiswahili, huku tanbihi ikitaja uwezekano wa kuelewa mhusika wa mfano kuwa mwanamume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo umefanywa wa kawaida bila kupunguza nguvu ya picha ya mafuriko, mto na nyumba iliyojengwa juu ya mwamba.
