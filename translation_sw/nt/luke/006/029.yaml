  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: sw
  text: Anayekupiga shavuni[a], mtolee shavu lako lingine pia; na anayekunyang’anya vazi lako la nje[b], usimzuie hata vazi lako la ndani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taya.”
    reason: σiagōn inaweza kumaanisha shavu au taya; “shavu” ndilo chaguo la kawaida katika muktadha wa kupigwa.
  - marker: b
    text: “Vazi la nje” hutafsiri ἱμάτιον; “vazi la ndani” hutafsiri χιτών.
    reason: Huhifadhi tofauti ya aina mbili za vazi katika Kigiriki bila kuhusisha χιτών na aina mahsusi ya vazi la Kiswahili.
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: anayekupiga
  rationale: Kirai cha Kigiriki chenye kitenzi-shirikishi kilichofanywa nomino humaanisha kwa ujumla mtu anayefanya tendo hilo; “anayekupiga” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: shavuni
  rationale: σιαγών inaweza kumaanisha shavu au taya. Katika muktadha wa kupigwa usoni, “shavuni” ni ya kawaida na haibainishi mno sehemu ya mwili.
- source_word: πάρεχε
  choice: mtolee
  rationale: παρέχω humaanisha kutoa, kuandaa, au kuwasilisha. “Mtolee” huhifadhi amri ya kumpa nafasi ya shavu lingine bila kuingiza kitenzi “geuza” kutoka kifungu sambamba cha Mathayo.
- source_word: καὶ τὴν ἄλλην
  choice: shavu lingine pia
  rationale: Nomino “shavu” imerudiwa kwa uwazi wa Kiswahili; “pia” huwakilisha καί na kuhifadhi mkazo wa Kigiriki.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: anayekunyang’anya
  rationale: Katika muktadha huu αἴρω ni kuondoa au kuchukua. “Kunyang’anya” huonyesha kuchukuliwa kwa vazi bila ruhusa, huku ujenzi wa sentensi ukibaki wa kawaida kwa Kiswahili.
- source_word: τὸ ἱμάτιον
  choice: vazi lako la nje
  rationale: ἱμάτιον ni vazi la nje. Tafsiri hii ya kueleza maana inaeleweka kwa wasomaji wa sasa na hudumisha tofauti yake na χιτών.
- source_word: τὸν χιτῶνα
  choice: kanzu yako
  rationale: χιτών ni vazi lililovaliwa ndani, chini ya vazi la nje. “Kanzu” ni neno la kawaida la Kiswahili kwa vazi refu la aina hii, na tofauti ya mavazi hayo inaonekana kutokana na “vazi la nje” katika kishazi kilichotangulia.
- source_word: μὴ κωλύσῃς
  choice: usimzuilie kuchukua
  rationale: κωλύω humaanisha kuzuia au kukataza. “Usimzuilie kuchukua” ni ya asili katika muktadha na huhifadhi amri ya kutomzuia mtu huyo.
theological_decisions:
- issue: Iwapo maneno ya Luka yalinganishwe na usemi unaojulikana zaidi wa Mathayo, “mgeuzie shavu lingine”
  choice: 'Kuhifadhi usemi mahsusi wa Luka: “mtolee shavu lingine pia”'
  alternative: mgeuzie shavu lingine
  rationale: Kigiriki cha Luka kinatumia πάρεχε, yaani “toa/wasilisha,” wala si kitenzi chenye maana ya “geuza.” Hivyo tafsiri haileti maneno ya Injili sambamba ndani ya Luka.
- issue: Iwapo amri zifafanuliwe katika matini kuwa sheria kamili au usemi wa kutia mkazo juu ya kutolipiza kisasi
  choice: Kutafsiri amri moja kwa moja bila kuongeza masharti au maelezo ya kiitikadi
  alternative: Kuongeza katika matini ufafanuzi kuhusu kutolipiza kisasi au matumizi ya lugha ya kutia mkazo
  rationale: Mstari una amri za moja kwa moja kwa nafsi ya pili. Tafsiri huhifadhi nguvu na mvutano wa mafundisho ya Yesu bila kuamua mjadala wa ufasiri ndani ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyohitajika, kwa kuwa “shavuni” na “vazi la nje” zinaweka maana wazi bila kupoteza tofauti muhimu ya chanzo.
