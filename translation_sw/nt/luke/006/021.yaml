base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: sw
  text: Heri ninyi mna njaa sasa[a], kwa sababu mtashibishwa[b]. Heri ninyi mnaolia sasa, kwa sababu mtacheka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Heri walio na njaa sasa ... Heri wanaolia sasa.” Kigiriki hutumia kibainishi pamoja na vitenzi vinavyoeleza watu, lakini muktadha wa karibu unaunga mkono usemi wa moja kwa moja.
    reason: alternative_reading
  - marker: b
    text: Au, “mtatoshelezwa.” Kitenzi hiki kinaweza kumaanisha kushibishwa kwa chakula na, kwa maana pana, kutoshelezwa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: “Heri” ni kauli ya kawaida na yenye hadhi katika semi za baraka; haipunguzi maana kuwa hisia ya furaha tu.
- source_word: οἱ πεινῶντες νῦν
  choice: ninyi mlio na njaa sasa
  rationale: Kirai hiki kinahifadhi hali inayoendelea ya kuwa na njaa na mkazo wa wakati wa sasa. “Ninyi” kinaendana na vitenzi vya nafsi ya pili wingi na muktadha wa Yesu kuwaambia wanafunzi moja kwa moja.
- source_word: χορτασθήσεσθε
  choice: mtashibishwa
  rationale: Wakati ujao wa hali ya kutendwa umehifadhiwa. “Mtashibishwa” inadumisha picha halisi ya wenye njaa kupewa chakula cha kuwatosha bila kuzuia maana pana ya kutoshelezwa kikamilifu.
- source_word: οἱ κλαίοντες νῦν
  choice: ninyi mnaolia sasa
  rationale: “Mnaolia” huonyesha tendo linaloendelea na halifungi maana kwenye maombolezo ya msiba pekee. “Sasa” huhifadhi tofauti kati ya hali ya sasa na mabadiliko yajayo.
- source_word: γελάσετε
  choice: mtacheka
  rationale: “Mtacheka” ni tafsiri ya moja kwa moja ya kitenzi hiki na huhifadhi picha dhahiri ya mabadiliko kutoka kulia hadi kucheka.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya kuitwa wenye heri kwa lugha ya sasa na iliyo wazi.
theological_decisions:
- issue: Usemi wa moja kwa moja dhidi ya kauli ya jumla katika heri
  choice: Kutumia “ninyi mlio na njaa” na “ninyi mnaolia.”
  alternative: “walio na njaa” na “wanaolia.”
  rationale: Ingawa Kigiriki kina vihusishi vyenye kibainishi vinavyoweza kutafsiriwa kwa nafsi ya tatu, ahadi zinazofuata ziko katika nafsi ya pili wingi, na muktadha ni usemi wa moja kwa moja kwa wanafunzi. Tanbihi inahifadhi uwezekano wa muundo wa jumla.
- issue: Namna na wakati wa kutimia kwa mabadiliko yaliyoahidiwa
  choice: Kudumisha maneno halisi “mtashibishwa” na “mtacheka” bila kufafanua wakati au namna ya kutimia.
  alternative: Kufasiri ahadi kuwa kutoshelezwa kiroho tu au kuwa tukio la mwisho wa nyakati pekee.
  rationale: Mstari unaahidi mabadiliko lakini hausemi wazi hapa kama yatakuwa ya kimwili, kiroho, ya wakati huu, au ya mwisho wa nyakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa “Heri” umehifadhiwa, na picha halisi za njaa, kulia, kushibishwa na kucheka hazijafasiriwa zaidi ya ushahidi wa matini.
