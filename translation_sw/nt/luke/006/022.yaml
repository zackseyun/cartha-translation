  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: sw
  text: Heri ninyi, watu wanapowachukia, wanapowatenga, wanapowatukana, na wanapolikataa jina lenu kuwa ovu[a] kwa sababu ya Mwana wa Adamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanapolitupa nje jina lenu kama ovu”; yaani, wanapowakataa au kuwashutumu hadharani kuwa watu waovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: Heri
  rationale: “Heri” ni istilahi ya kawaida ya Kiswahili katika matamko ya heri; inaonyesha hali ya kibali na baraka kuliko hisia ya furaha pekee.
- source_word: ὅταν
  choice: wanapo-
  rationale: Muundo huu unaeleza hali isiyo na wakati maalumu na unasikika kwa kawaida katika Kiswahili.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: watu wanapowachukia
  rationale: “Watu” linaonyesha rejeo la jumla la οἱ ἄνθρωποι, na “kuwachukia” linahifadhi nguvu ya tendo la uhasama.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: wanapowatenga
  rationale: Katika muktadha wa mateso ya kijamii, “kuwatenga” huonyesha kuwafungia nje ya ushirika bila kuongeza maelezo yasiyokuwamo wazi.
- source_word: ὀνειδίσωσιν
  choice: wanapowatukana
  rationale: “Kuwatukana” ni lugha ya sasa na wazi kwa dhihaka au shutuma za matusi.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: kulikataa jina lenu kuwa ovu
  rationale: Kauli hii ya asili ni ya kimfano na inahusu kukataa au kulishutumu hadharani jina/sifa ya mtu. “Kulikataa jina lenu kuwa ovu” ni ya asili zaidi kwa Kiswahili huku tanbihi ikihifadhi upana wa tamathali.
- source_word: ἕνεκα
  choice: kwa sababu ya
  rationale: Hili linaeleza sababu kwa Kiswahili cha kawaida na kwa usahihi.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Injili kwa Kiswahili na linahifadhi mwangwi wake wa kimaandiko.
theological_decisions:
- issue: Maana ya ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: Kulikataa jina lenu kuwa ovu, huku tanbihi ikifafanua maana inayowezekana.
  alternative: Kulitupa nje jina lenu kama ovu; kuwashutumu kuwa waovu.
  rationale: Kigiriki kinahifadhi taswira ya “kulitupa nje jina” na huenda kinamaanisha kuwakataa hadharani au kuharibu sifa yao. Tafsiri kuu iwe ya kawaida kwa Kiswahili, lakini isiweke kikomo kisichohitajika kwa namna hasa ya kukataliwa.
- issue: Rejeo la οἱ ἄνθρωποι
  choice: watu
  alternative: wanaume; wanadamu
  rationale: Rejeo ni la watu kwa jumla, si wanaume pekee.
- issue: Jina la cheo τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: “Mwana wa Adamu” ni jina la cheo linalotambulika katika mapokeo ya Kiswahili na linahifadhi muundo na mwangwi wa matumizi ya Injili bila kulifafanua kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “wanapo-” yanatunza mfuatano wa matendo ya Kigiriki; kiunganishi kimepunguzwa kabla ya kitenzi cha mwisho ili sentensi isikike kwa kawaida.
