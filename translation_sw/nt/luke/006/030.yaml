  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: sw
  text: Mpe kila anayekuomba, na yule anayechukua vilivyo vyako usimdai akurudishie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: kila anayekuomba
  rationale: Muundo huu unaonyesha maana ya mgawanyo ya παντί pamoja na tendo la kuomba katika αἰτοῦντί na mlengwa σε. Ni Kiswahili cha kawaida na hauongezi dhana ya kuombaomba kwa sababu ya umaskini.
- source_word: δίδου
  choice: Mpe
  rationale: Amri ya wakati wa sasa inaelezwa kwa amri ya moja kwa moja ya Kiswahili. Kiambishi cha mtendewa -m- kinarejelea ‘kila anayekuomba’ na kufanya sentensi iwe ya asili.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: mtu anayechukua
  rationale: αἴρω hapa ina wazo la kuchukua kitu kilicho cha mwingine. ‘Anayechukua’ huhifadhi upana wa usemi bila kuamua kwamba lazima ni wizi au unyang’anyi.
- source_word: τὰ σὰ
  choice: kilicho chako
  rationale: Huwakilisha kwa Kiswahili cha kawaida ‘vitu vilivyo vyako’ bila kuzuia maana kwa mali ya aina fulani tu.
- source_word: μὴ ἀπαίτει
  choice: usimdai akurudishie
  rationale: ἀπαιτέω ina maana ya kudai kitu kirudishwe. Kauli hii ni ya asili katika Kiswahili na inahifadhi nguvu ya ‘kudai’ kuliko ‘kuomba’ tu.
theological_decisions:
- issue: Upeo na nguvu ya amri za Yesu katika usemi huu
  choice: Kuzitafsiri kama amri pana na za moja kwa moja bila kuzipunguza katika matini.
  alternative: Kuzieleza kama kutia chumvi, kuzihusisha tu na sadaka, au kuifunga sehemu ya pili katika mazingira ya kisheria ya wizi.
  rationale: Kigiriki kina amri za moja kwa moja na lugha yenye upeo mpana. Tafsiri inapaswa kuhifadhi mvutano wa kimaadili na kutotatua kimatamshi mabishano kuhusu namna ya kuzitumia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Usimdai akurudishie’ ni usemi wa kawaida unaobeba wazo la kudai kurejeshewa bila kuongeza maelezo ya kisheria.
