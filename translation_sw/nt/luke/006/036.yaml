  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: sw
  text: Iweni na rehema[a], kama Baba yenu alivyo na rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye huruma.” Kivumishi cha Kigiriki kinaweza kumaanisha mtu anayesukumwa na huruma na kuwaonyesha wengine rehema.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Iweni
  rationale: Kitenzi hiki ni agizo la nafsi ya pili wingi. “Iweni” ni Kiswahili cha kawaida na cha moja kwa moja kinachoeleza mwito wa kudumu wa kuwa na sifa hiyo, bila kufanya “kuweni” kuwa mchakato ulio wazi zaidi kuliko muktadha unavyodai.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: na rehema
  rationale: Kirai “kuwa na rehema” ni cha asili na kinachoeleweka kwa urahisi katika Kiswahili, nacho kinabeba maana ya kusukumwa na huruma na kuwaonyesha wengine rehema. Matumizi yaleyale katika sehemu zote mbili yanahifadhi ulinganifu wa Kigiriki.
- source_word: καθὼς
  choice: kama ... alivyo
  rationale: 'Muundo huu unaonyesha wazi ulinganisho: tabia ya Baba ndiyo kielelezo cha mwenendo wa wanafunzi, si sababu tu ya agizo.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yenu
  rationale: Tafsiri inafuata maandishi yanayosema tu “Baba yenu,” bila kuongeza “wa mbinguni,” ambalo halipo katika mstari huu.
theological_decisions:
- issue: Uhusiano kati ya agizo na tabia ya Baba
  choice: “kama Baba yenu alivyo na rehema”
  alternative: “kwa sababu Baba yenu ana rehema”
  rationale: καθὼς inaonyesha hasa ulinganisho au kielelezo. Tafsiri hii inadumisha wazo la kuiga tabia ya Baba bila kuibadili sentensi kuwa maelezo ya sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Iweni na rehema” ni cha asili zaidi kuliko “iweni wenye rehema” hapa, huku tanbihi ikihifadhi uwezekano wa “wenye huruma.”
