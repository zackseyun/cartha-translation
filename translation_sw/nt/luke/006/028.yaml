  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: sw
  text: Wabarikini wale wanaowalaani; waombeeni wale wanaowatendea vibaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wanaowadhulumu” au “wale wanaowatukana.” Kitenzi cha Kigiriki kinaweza kumaanisha aina mbalimbali za kutendewa kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Wabarikini
  rationale: Amri ya wingi inaeleza kuwatakia au kuwaombea wengine baraka, huku ikihifadhi tofauti ya makusudi na tendo la kulaani.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: wale wanaowalaani
  rationale: Kivumishi-tendo chenye kibainishi kinatumika kama nomino, yaani watu wanaowalaani wasikilizaji. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: προσεύχεσθε
  choice: waombeeni
  rationale: Umbo hili ni amri ya wingi. Kiambishi -e- kinaonyesha kwa kawaida kwamba sala inaelekezwa kwa ajili ya watu hao, kulingana na περί katika muktadha huu.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: wale wanaowatendea vibaya
  rationale: περί pamoja na προσεύχομαι hapa humaanisha kuwaombea watu fulani. 'Kuwatendea vibaya' ni usemi mpana unaoweza kujumuisha dhuluma, matusi, au aina nyingine ya uhasama bila kuufanya mstari useme aina moja tu.
theological_decisions:
- issue: Upeo wa amri za kuwapenda maadui
  choice: Amri zimetafsiriwa moja kwa moja kama maagizo ya jinsi ya kuitikia laana na kutendewa vibaya.
  alternative: Kuongeza ufafanuzi wa kimafundisho kuhusu mipaka au matumizi ya amri hizi.
  rationale: Mstari wenyewe unatoa amri za moja kwa moja bila kuweka ufafanuzi huo; tafsiri inapaswa kuhifadhi nguvu na mvutano wa kimaadili wa maneno hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Wabarikini' na 'waombeeni' ni amri za wingi zilizo wazi; 'kuwatendea vibaya' huepuka usemi wa kizamani na kuhifadhi upana wa maana ya Kigiriki.
