base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: sw
  text: Baada ya kuwatazama wote, akamwambia, “Nyosha mkono wako.” Naye akafanya hivyo, na mkono wake ukarejeshwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkono wake ukaponywa.” Kigiriki kinasema kwa karibu zaidi kwamba mkono wake “ukarejeshwa,” kikisisitiza kurudi katika hali inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Baada ya kuwatazama ... waliokuwa karibu naye
  rationale: Kitenzi hiki kinaonyesha kutazama huku na huku kwa watu waliomzunguka Yesu; muundo wa ‘Baada ya’ unaonyesha kwa Kiswahili cha kawaida kwamba kutazama kulitangulia kusema.
- source_word: πάντας αὐτούς
  choice: wote waliokuwa karibu naye
  rationale: Huhifadhi msisitizo wa πάντας, yaani kwamba Yesu aliwatazama wote waliokuwapo, huku ikieleza kwa kawaida walengwa wa kutazama huku na huku.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Ni namna ya kawaida na yenye heshima ya kuonyesha kwamba Yesu alisema maneno hayo kwa mtu huyo, bila kuongeza maana nyingine ya tendo la kusema.
- source_word: Ἔκτεινον
  choice: Nyosha
  rationale: Amri ya moja kwa moja inayofaa tendo la kuutoa au kuunyoosha mkono.
- source_word: τὴν χεῖρά σου
  choice: mkono wako
  rationale: χείρ hapa hurejelea mkono; umilikaji umeonyeshwa wazi kama katika Kigiriki.
- source_word: ὁ δὲ ἐποίησεν
  choice: Naye akafanya hivyo
  rationale: ποιέω hurejelea kutekeleza amri iliyotangulia, na δέ ni kiunganishi chepesi katika mtiririko wa simulizi.
- source_word: ἀπεκατεστάθη
  choice: ukarudishwa katika hali yake ya kawaida
  rationale: Huhifadhi wazo la msingi la ἀποκαθίστημι la kurejeshwa katika hali inayofaa au ya awali, badala ya kulibadili moja kwa moja kuwa neno la kitabibu ‘kuponywa.’
- source_word: ἡ χεὶρ αὐτοῦ
  choice: mkono wake
  rationale: Hutafsiri wazi kiima na umilikaji, na kurudia ‘mkono’ kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Jinsi ya kueleza muujiza katika ἀπεκατεστάθη
  choice: ukarudishwa katika hali yake ya kawaida
  alternative: ukaponywa; ukawa mzima tena
  rationale: Lugha ya kurejeshwa hudumisha maana ya kitenzi cha Kigiriki na msisitizo wa kurudi katika hali inayofaa, bila kuifanya tafsiri kuwa istilahi ya kitabibu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inafuata mpangilio wa matendo katika Kigiriki bila kuwa ngumu kupita kiasi.
