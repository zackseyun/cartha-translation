  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: sw
  text: Kama mnawapenda wale wanaowapenda ninyi, mnapata sifa gani?[a] Kwa maana hata wenye dhambi huwapenda wale wanaowapenda wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnapata neema gani?” Neno la Kigiriki linaweza kumaanisha “neema,” “fadhili,” “shukrani,” au “sifa”; hapa linahusu jambo linalostahili kusifiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: mnawapenda / wanaowapenda / huwapenda
  rationale: Neno “kupenda” limetumiwa kwa uthabiti katika sehemu zote tatu ili kuhifadhi marudio na nguvu ya hoja ya Kigiriki.
- source_word: ποία
  choice: gani
  rationale: Katika swali hili “gani” ni Kiswahili cha kawaida kinachouliza aina au kiwango cha sifa inayopatikana.
- source_word: χάρις
  choice: sifa
  rationale: Katika muktadha huu neno linahusu jambo linalostahili kusifiwa au kukubaliwa, si hasa neema ya wokovu. “Sifa” huwasilisha maana hiyo kwa lugha ya kawaida, huku maana nyingine zikitajwa katika tanbihi.
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Hili ni tamko la kawaida na linaloeleweka kwa urahisi kwa watu wanaotambulishwa na dhambi; pia huepuka uzito wa kimtindo ambao “wadhambi” unaweza kuwa nao kwa baadhi ya wasomaji.
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: “Kwa maana” huonyesha kwamba sentensi hii inaunga mkono swali lililotangulia, na “hata” huhifadhi msisitizo wa καί.
- source_word: ὑμῖν
  choice: mna
  rationale: Dhamira ya dative imewasilishwa kwa muundo wa asili wa Kiswahili, “mna sifa gani?”, badala ya tafsiri ya neno kwa neno isiyo laini.
theological_decisions:
- issue: Maana ya χάρις katika kauli ya Yesu
  choice: sifa au jambo linalostahili kukubaliwa, si matumizi mahususi ya kiteolojia ya “neema”
  alternative: neema; fadhili; shukrani
  rationale: Muktadha unazungumzia kama kuwapenda wanaokupenda tu ni jambo la pekee linalostahili kusifiwa. Tafsiri “neema” katika matini kuu ingeweza kueleweka kama fundisho la neema ya wokovu, jambo ambalo si kiini cha swali hapa; hata hivyo, uwezekano huo wa kileksika umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na wa kueleweka kwa wasomaji wa kawaida; marudio ya “kupenda” yamehifadhiwa kwa sababu ni sehemu muhimu ya hoja.
