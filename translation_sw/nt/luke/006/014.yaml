  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: sw
  text: Simoni, ambaye alimpa pia jina Petro, na Andrea ndugu yake, na Yakobo na Yohana, na Filipo na Bartholomayo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Simoni
  rationale: Hili ndilo umbo la kawaida la jina Σίμων katika tafsiri za Kiswahili za Agano Jipya, na linamtambulisha mtume huyu kwa urahisi.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: ambaye alimpa pia jina Petro
  rationale: Kitenzi ὀνομάζω hapa kinaeleza tendo la kumpa mtu jina; usemi huu wa Kiswahili ni wa kawaida na unaweka wazi kwamba Yesu ndiye aliyempa jina hilo.
- source_word: Πέτρον
  choice: Petro
  rationale: Petro ndilo umbo lililozoeleka la jina Πέτρος katika Kiswahili cha Biblia.
- source_word: Ἀνδρέαν
  choice: Andrea
  rationale: Andrea ndilo umbo la kawaida la Kiswahili la jina Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: Katika muktadha huu ἀδελφός humaanisha ndugu wa kiume wa kuzaliwa; Kiswahili cha kawaida hutumia 'ndugu yake' bila kulazimika kuongeza 'wa kiume'.
- source_word: Ἰάκωβον
  choice: Yakobo
  rationale: Yakobo ndilo umbo la jadi na linalotambulika katika Kiswahili kwa jina Ἰάκωβος.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Yohana ndilo umbo la kawaida la Kiswahili la jina Ἰωάννης.
- source_word: Φίλιππον
  choice: Filipo
  rationale: Filipo ndilo umbo la kawaida la Kiswahili la jina Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Bartholomayo
  rationale: Bartholomayo ni umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia kwa Βαρθολομαῖος.
- source_word: καὶ
  choice: na / pia
  rationale: Katika orodha, καί limetafsiriwa 'na'; katika ὃν καὶ ὠνόμασεν limetafsiriwa 'pia' kwa kuwa linaongeza taarifa kuhusu kumpa Simoni jina.
