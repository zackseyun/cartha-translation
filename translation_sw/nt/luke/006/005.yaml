  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: sw
  text: Naye aliwaambia, “Mwana wa Adamu ni Bwana wa Sabato.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi, huku ‘-ye’ kikirejelea kwa kawaida mhusika anayesema bila kuongeza wazo jipya la wakati.
- source_word: ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Kauli hii inadokeza tendo lililokuwa likiendelea katika simulizi; muundo huu wa Kiswahili unahifadhi hali hiyo na pia unaendana na αὐτοῖς.
- source_word: αὐτοῖς
  choice: -waambia
  rationale: Kiambishi cha yambwa ‘-wa-’ kinatafsiri kiwakilishi cha wingi kwa kawaida bila kuwabainisha zaidi wahusika.
- source_word: Κύριος
  choice: Bwana
  rationale: Hapa ni jina la cheo linaloonyesha mamlaka, si namna tu ya heshima katika mazungumzo.
- source_word: τοῦ σαββάτου
  choice: wa Sabato
  rationale: Muundo wa uhusiano ‘Bwana wa Sabato’ ni mfupi, wa kawaida, na unahifadhi namna ya Kigiriki ya kuonyesha mamlaka kuhusiana na Sabato.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika Biblia ya Kiswahili; linahifadhi usuli wa Kisemiti na uwezekano wa mwangwi wa Danieli 7.
theological_decisions:
- issue: Nguvu ya kikristo ya dai la Yesu kuhusu Sabato
  choice: Mwana wa Adamu ni Bwana wa Sabato.
  alternative: Mwana wa Adamu ana mamlaka juu ya Sabato.
  rationale: Tafsiri inahifadhi dai la moja kwa moja la cheo na mamlaka lililo katika Kigiriki, bila kuongeza neno kama ‘hata’ ambalo halipo wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Sabato’ na majina ya cheo ‘Mwana wa Adamu’ na ‘Bwana’ yameandikwa kwa herufi kubwa kwa utambuzi wa siku/taasisi na matumizi ya kikristo.
