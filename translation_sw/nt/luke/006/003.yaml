  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: sw
  text: Yesu akawajibu, “Je, hata jambo hili hamjalisoma, alichofanya Daudi alipokuwa na njaa, yeye na wale waliokuwa pamoja naye?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: akawajibu
  rationale: Muundo huu wa kawaida wa Kiyunani una maana ya kujibu kwa kusema; ‘akawajibu’ ni wa asili katika Kiswahili na huepuka uradidi wa ‘akajibu akasema.’
- source_word: πρὸς αὐτοὺς
  choice: -wa- katika ‘akawajibu’
  rationale: Kiambishi cha yambwa kinawasilisha kwa njia ya kawaida ya Kiswahili kwamba jibu lilielekezwa kwao.
- source_word: Οὐδὲ τοῦτο
  choice: hata jambo hili hamjalisoma
  rationale: ‘Hata’ linahifadhi msisitizo wa οὐδέ katika swali hasi la changamoto.
- source_word: ἀνέγνωτε
  choice: hamjalisoma
  rationale: Hali timilifu ya Kiswahili inafaa kwa swali la balagha linalohusu kufahamu kwao Maandiko hadi wakati huo.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: alichofanya Daudi
  rationale: Ni muundo wa asili na wazi unaohifadhi kishazi rejeshi cha Kiyunani.
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ὁπότε
  choice: wakati
  rationale: Huonyesha kwa ufupi na kwa kawaida uhusiano wa wakati.
- source_word: ἐπείνασεν
  choice: walipokuwa na njaa
  rationale: ‘Kuwa na njaa’ ni usemi wa kawaida wa Kiswahili; umoja wa kitenzi cha Kiyunani unapanuliwa hapa kulingana na mhusika wa pamoja anayefafanuliwa mara moja baada yake.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: yeye na wale waliokuwa pamoja naye
  rationale: Inahifadhi kiwakilishi cha msisitizo na maelezo ya moja kwa moja kuhusu waliokuwa pamoja na Daudi, bila kuyatafsiri zaidi kuwa ‘wenzake.’
