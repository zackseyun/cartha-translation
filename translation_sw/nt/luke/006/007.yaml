  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: sw
  text: Nao waandishi na Mafarisayo walikuwa wakimchunguza kwa makini[a] ili waone kama angeponya siku ya Sabato, kusudi wapate sababu ya kumshtaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakimwangalia kwa uangalifu.” Kitenzi cha Kigiriki kinaweza kumaanisha kumwangalia mtu kwa karibu, hata kwa nia ya uadui.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili wapate msingi wa shtaka dhidi yake,” au kwa ufupi, “ili wamshtaki.” Usemi wa Kigiriki unaonyesha kutafuta msingi wa shtaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: walikuwa wakimchunguza kwa makini
  rationale: Huwasilisha hali endelevu ya kitenzi cha wakati usiotimilika pamoja na uangalizi wa karibu wenye nia ya uadui unaodhihirishwa na muktadha. Kiambishi cha yambwa katika “wakimchunguza” kinamrejelea Yesu, anayeeleweka kutokana na muktadha.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi ya kawaida ya Kibiblia kwa wataalamu wa kunakili na kufundisha Sheria, bila kufafanua kazi yao kupita kiasi.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Ni jina la kawaida la Kiswahili la kundi hili.
- source_word: εἰ
  choice: waone kama
  rationale: Baada ya kitenzi cha kuchunguza, muundo huu ni wa asili katika Kiswahili na unaonyesha swali lisilo la moja kwa moja.
- source_word: ἐν τῷ σαββάτῳ
  choice: siku ya Sabato
  rationale: Ni usemi wa kawaida wa Kiswahili kwa wakati unaotajwa hapa na unadumisha umoja wa neno la Kigiriki.
- source_word: θεραπεύει
  choice: angeponya
  rationale: Huwasilisha kwa Kiswahili kitendo walichokuwa wakingojea kuona kama Yesu angekifanya, kulingana na mtazamo wa simulizi.
- source_word: ἵνα εὕρωσιν
  choice: ili wapate
  rationale: Huhifadhi wazi kusudi la uangalizi wao.
- source_word: κατηγορεῖν αὐτοῦ
  choice: sababu ya kumshtaki
  rationale: Hutoa kwa Kiswahili cha asili wazo la kutafuta msingi au nafasi ya kuleta shtaka dhidi yake.
theological_decisions:
- issue: Nia ya wapinzani katika kumchunguza Yesu
  choice: Uangalizi wao umeonyeshwa kuwa wa makusudi na ulioelekezwa kwenye kupata sababu ya kumshtaki.
  alternative: “Walikuwa wakimtazama” lingeweza kusikika kama uangalizi usio na uadui.
  rationale: Kitenzi παρετηροῦντο pamoja na kishazi cha kusudi ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ kinaonyesha kwamba hawakuwa watazamaji wasioegemea upande wowote. Tafsiri haisemi zaidi ya nia hiyo iliyo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nao” huendeleza simulizi kwa kawaida; “waandishi” na “Mafarisayo” ni istilahi zinazotambulika kwa urahisi. Muundo umeepuka lugha ya kimadhehebu na umehifadhi uadui unaodokezwa na chanzo bila kuutia chumvi.
