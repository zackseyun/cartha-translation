id: LUK.6.2
reference: Luke 6:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: sw
  text: Lakini baadhi ya Mafarisayo wakasema, “Kwa nini mnafanya jambo ambalo haliruhusiwi siku ya Sabato[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “siku za Sabato,” usemi wa kawaida wenye maana ya “siku ya Sabato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: baadhi ya
  rationale: Huonyesha sehemu tu ya Mafarisayo, si kundi lote.
- source_word: δὲ
  choice: Lakini
  rationale: Huleta tofauti nyepesi na tendo lililotangulia na kuanzisha pingamizi la Mafarisayo.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia.
- source_word: εἶπαν
  choice: wakasema
  rationale: Wakati uliopita wa Kigiriki unasimulia tukio la kusema kwa urahisi; kiambishi 'waka-' kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: Τί ποιεῖτε
  choice: Kwa nini mnafanya
  rationale: Ingawa Τί kimsingi ni 'nini,' katika swali hili la kupinga kitendo maana ya kimuktadha ni 'kwa nini mnafanya.'
- source_word: ὃ οὐκ ἔξεστιν
  choice: jambo ambalo haliruhusiwi
  rationale: Huhifadhi wazo la tendo lisiloruhusiwa kwa mujibu wa sheria au desturi bila kudai wazi chanzo cha katazo.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Umbo la Kigiriki ni wingi, lakini ni nahau ya kawaida inayoweza kumaanisha siku ya Sabato; umoja ni wa asili na wazi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri usemi wa Sabato ulio katika wingi
  choice: siku ya Sabato
  alternative: siku za Sabato
  rationale: τοῖς σάββασιν ni umbo la wingi lakini hutumiwa kinahau kuhusu siku ya Sabato. Kiswahili cha kawaida hutumia umoja hapa; tanbihi inaweka wazi umbo la chanzo bila kulifanya tamko kuu lisikike lisilo la kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inaweka sauti ya pingamizi bila kuongeza ufafanuzi wa kimadhehebu.
