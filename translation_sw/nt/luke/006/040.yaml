id: LUK.6.40
reference: Luke 6:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: sw
  text: Mwanafunzi hayuko juu ya mwalimu wake, lakini kila aliyefundishwa kikamilifu atakuwa kama mwalimu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila aliyeandaliwa kikamilifu atakuwa kama mwalimu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: mwanafunzi
  rationale: Katika muktadha huu wa mwalimu na mafunzo, “mwanafunzi” ni neno la kawaida na la asili; bado linaweza kuonyesha uhusiano wa kujifunza kwa kufuata, si elimu ya darasani tu.
- source_word: ὑπὲρ
  choice: juu ya
  rationale: 'Hapa linaonyesha cheo au nafasi ya kulinganishwa: mwanafunzi si mkuu kuliko mwalimu wake.'
- source_word: διδάσκαλον / διδάσκαλος
  choice: mwalimu
  rationale: Ni kisawe cha moja kwa moja na cha kawaida kinachodumisha muktadha wa kufundisha.
- source_word: κατηρτισμένος
  choice: aliyefundishwa kikamilifu
  rationale: Kauli tendwa timilifu inaonyesha mtu aliyekamilishiwa maandalizi au mafunzo; katika muktadha wa mwanafunzi na mwalimu, mafunzo ndiyo maana inayoeleweka zaidi, huku tanbihi ikihifadhi upana wa neno.
- source_word: πᾶς
  choice: kila
  rationale: “Kila” likitumiwa pamoja na umbo la mtu mmoja linafikisha nguvu ya jumla ya πᾶς kwa Kiswahili cha asili.
- source_word: ὡς
  choice: kama
  rationale: Linaonyesha ulinganisho kati ya mtu aliyefundishwa na mwalimu wake.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiambishi cha umilikaji cha ngeli ya mtu kinamrejelea mwanafunzi mmoja wa mfano bila kuingiza jinsia ambayo Kiswahili hailazimishi kisarufi.
theological_decisions:
- issue: Maana ya κατηρτισμένος katika kauli kuhusu uanafunzi
  choice: aliyefundishwa kikamilifu
  alternative: aliyeandaliwa au kuwezeshwa kikamilifu
  rationale: Muktadha wa mwanafunzi na mwalimu unaelekeza kwenye mafunzo, lakini maana pana ya kukamilishwa au kuandaliwa haifutwi na imeonyeshwa katika tanbihi.
- issue: Rejeo la jumla la umoja
  choice: kila ... mwalimu wake
  alternative: wote ... walimu wao
  rationale: Umoja wa kimethali wa Kigiriki unadumishwa kwa Kiswahili cha kawaida. Kiswahili hakihitaji kutaja jinsia katika “wake,” hivyo maana ya jumla inabaki bila kubadili idadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kimethali ulio wazi na wenye heshima. “Hayuko juu ya” huhifadhi taswira ya chanzo, na “aliyefundishwa kikamilifu” ni ya kawaida kuliko tafsiri nzito kama “aliyekamilishwa.”
