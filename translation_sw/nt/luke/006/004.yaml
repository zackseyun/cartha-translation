  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: sw
  text: jinsi alivyoingia katika nyumba ya Mungu, akachukua mikate ya wonyesho[a], akazila, na akawapa wale waliokuwa pamoja naye—mikate ambayo si halali kuliwa isipokuwa na makuhani peke yao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mikate mitakatifu iliyowekwa mbele za Mungu; kwa maneno mengine, “mikate ya kuwekwa mbele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: jinsi
  rationale: Katika swali lisilo la moja kwa moja, neno hili linaanzisha maelezo ya kile Daudi alichofanya na namna kilivyotokea.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: alivyoingia katika nyumba ya Mungu
  rationale: “Nyumba ya Mungu” huhifadhi neno οἶκος na mwangwi wa simulizi la Maandiko bila kulibadili kuwa “hekalu.”
- source_word: ἄρτους τῆς προθέσεως
  choice: mikate ya Wonyesho
  rationale: Hili ni jina la kawaida la kibiblia kwa mikate mitakatifu iliyowekwa mbele za Mungu; tanbihi inalifafanua kwa lugha ya kawaida.
- source_word: λαβὼν ἔφαγεν
  choice: akachukua ... akaila
  rationale: Muundo wa tendo tangulizi na kitenzi kikuu umetolewa kama mfululizo wa matendo kwa Kiswahili cha asili.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: kisha akawapa baadhi yake wale waliokuwa pamoja naye
  rationale: “Wale waliokuwa pamoja naye” hufuata maana ya Kigiriki; “baadhi yake” huonyesha kwa kawaida kwamba aliwapa sehemu ya mikate aliyokuwa amechukua.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: si halali kuliwa
  rationale: “Si halali” huhifadhi maana ya ruhusa au katazo la kisheria na kidini, si desturi ya kijamii tu.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: isipokuwa makuhani peke yao
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba makuhani ndio pekee walioruhusiwa kula mikate hiyo.
theological_decisions:
- issue: Kizuizi cha sheria ya ibada kuhusu mikate mitakatifu
  choice: si halali kuliwa ... isipokuwa makuhani peke yao
  alternative: hairuhusiwi kuliwa ila na makuhani
  rationale: Tafsiri iliyochaguliwa inadumisha uzito wa kisheria na wa ibada wa mfano wa Yesu bila kueleza zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Mikate ya Wonyesho” imehifadhiwa kama istilahi ya kibiblia na kufafanuliwa katika tanbihi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
