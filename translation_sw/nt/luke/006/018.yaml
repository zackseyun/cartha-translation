  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: sw
  text: waliokuja kumsikiliza na kuponywa magonjwa yao; na wale waliokuwa wakisumbuliwa na roho wachafu walikuwa wakiponywa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: waliokuja
  rationale: Kiwakilishi cha uhusiano pamoja na kitenzi huendeleza kwa kawaida maelezo ya umati uliotajwa katika mstari uliotangulia.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: kumsikiliza
  rationale: Kiswahili cha kawaida hutumia ‘kumsikiliza’ kwa maana ya kuja kusikia mafundisho ya mtu; pia kinaonyesha kusudi la kuja kwao.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: kuponywa magonjwa yao
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kuondolewa kwa magonjwa bila kulazimisha tafsiri ya kihalisi ya ἀπό isiyosikika vizuri.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: waliokuwa wakisumbuliwa na roho wachafu
  rationale: ‘Wakisumbuliwa’ huhifadhi maana pana ya hali inayoendelea bila kuongeza kiwango cha mateso kisicholazimishwa na neno lenyewe; ‘roho wachafu’ huhifadhi nahau ya kibiblia.
- source_word: ἐθεραπεύοντο
  choice: walikuwa wakiponywa
  rationale: Muundo wa ‘walikuwa wakiponywa’ unaakisi hali ya kuendelea au kurudiwa inayoonyeshwa na kitenzi cha imperfect passive.
theological_decisions:
- issue: Maana ya πνευμάτων ἀκαθάρτων katika muktadha wa madhara ya kiroho
  choice: roho wachafu
  alternative: roho najisi
  rationale: ‘Roho wachafu’ ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Biblia, huku ukihifadhi rejeo la viumbe waovu wa kiroho bila kufasiri moja kwa moja kuwa ‘pepo.’
- issue: Hali ya kitendo katika ἐθεραπεύοντο
  choice: walikuwa wakiponywa
  alternative: waliponywa
  rationale: Tafsiri iliyochaguliwa inalinda hali endelevu au ya kurudiwa ya imperfect badala ya kuifanya taarifa kuwa tukio rahisi lililokamilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti ya ‘kusumbuliwa/kuteswa’ inaweza kuhifadhiwa kwa neno pana ‘kusumbuliwa’ bila kuhitaji alama katika mstari.
