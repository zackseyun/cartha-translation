base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: sw
  text: Msihukumu, nanyi hamtahukumiwa kamwe; na msihukumu kuwa na hatia, nanyi hamtahukumiwa kamwe kuwa na hatia. Waachilieni[a], nanyi mtaachiliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sameheni, nanyi mtasamehewa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuachilia,” “kuweka huru,” au, katika muktadha huu, kueleweka kuwa “kusamehe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: hukumu
  rationale: “Kuhukumu” ni neno la moja kwa moja na lenye upana unaofaa kwa κρίνω, na linadumisha ulinganifu na kauli tendwa “hamtahukumiwa.”
- source_word: οὐ μὴ κριθῆτε
  choice: hamtahukumiwa kamwe
  rationale: “Kamwe” linaonyesha mkazo wa ukanushaji wa οὐ μή kwa Kiswahili cha kawaida bila kuugeuza wakati ujao wa kitenzi.
- source_word: καταδικάζετε
  choice: wahukumu wengine kuwa na hatia
  rationale: Kirai hiki kinatofautisha καταδικάζω na κρίνω kwa kuonyesha hukumu hasi ya kumtia mtu hatiani, huku kikibaki wazi na cha kawaida kwa wasomaji.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: hamtahukumiwa kamwe kuwa na hatia
  rationale: Tafsiri hii inadumisha ulinganifu wa kitenzi na kauli iliyotangulia na pia mkazo wa οὐ μή.
- source_word: ἀπολύετε
  choice: Waachilieni wengine
  rationale: “Kuachilia” huhifadhi maana pana ya ἀπολύω—kumwachilia au kumweka huru mtu—bila kuifungia mapema katika maana ya kusamehe. “Wengine” huweka wazi yambwa inayodokezwa katika agizo.
- source_word: ἀπολυθήσεσθε
  choice: mtaachiliwa
  rationale: Neno hili linadumisha uhusiano wa moja kwa moja na “waachilieni” pamoja na hali ya kurudishiwa tendo iliyo katika msemo.
- source_word: καὶ
  choice: na / wala
  rationale: “Na” hudumisha uratibu wa vifungu; “wala” ni kiunganishi cha asili cha Kiswahili katika mwendelezo wa maagizo hasi.
theological_decisions:
- issue: Iwapo ἀπολύετε itafsiriwe kwa maana nyembamba ya “sameheni” au maana pana ya “waachilieni”
  choice: Waachilieni wengine
  alternative: Sameheni
  rationale: Katika muktadha wa kuhukumu na kutia hatiani, ἀπολύω inaweza kumaanisha kumwachilia mtu au kumwondolea madai. “Waachilieni” huhifadhi upana huo na ulinganifu wa kauli tendaji na tendwa; tafsiri inayowezekana ya “sameheni” imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa maagizo na matokeo umehifadhiwa; “kamwe” limetumiwa kuwasilisha ukanushaji wenye mkazo. Kirai “kuwa na hatia” kinabainisha tofauti kati ya kuhukumu kwa ujumla na kuhukumu kwa kumtia mtu hatiani.
