  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: sw
  text: 'Naye akainua macho yake, akawaelekeza macho yake kwa wanafunzi wake, akasema: “Heri ninyi mlio maskini,[a] kwa sababu Ufalme wa Mungu ni wenu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kigiriki kwa karibu: “Heri maskini.” Kigiriki kina umbo la nafsi ya tatu, lakini neno linalofuata, “wenu,” linaonyesha kwamba Yesu anazungumza nao moja kwa moja. Luka anasema “maskini,” si “maskini wa roho” (linganisha Mathayo 5:3).'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: akainua macho yake
  rationale: Kishazi tegemezi cha wakati uliopita kinaonyesha tendo lililotangulia usemi; muundo huu wa Kiswahili ni wa kawaida na unahifadhi picha halisi ya kuinua macho.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: akawaelekea wanafunzi wake
  rationale: εἰς huonyesha upande ambao macho yalielekezwa. Kiswahili cha sasa hueleza kitendo hiki kwa ‘kuwaelekea’ bila kulazimisha usemi usio wa kawaida.
- source_word: ἔλεγεν
  choice: akasema
  rationale: Ingawa kitenzi cha Kigiriki ni cha hali isiyotimilika na kinaweza kuonyesha usemi unaoendelea au wa utangulizi, katika simulizi la Kiswahili ‘akasema’ ni mtiririko wa kawaida na hauhitaji kuongeza maana ya ‘akaanza kusema’ ambayo haijaelezwa wazi.
- source_word: Μακάριοι
  choice: Heri
  rationale: ‘Heri’ ni usemi wa kawaida, wenye heshima, wa kutangaza hali ya kukubaliwa au kubarikiwa katika kauli za aina hii; haumaanishi furaha ya kihisia tu.
- source_word: οἱ πτωχοί
  choice: ninyi mlio maskini
  rationale: Kigiriki kwa umbo kinasema ‘maskini,’ lakini ὑμετέρα inayofuata inawageukia wasikilizaji moja kwa moja. ‘Ninyi mlio maskini’ huhifadhi maana ya umaskini na uwazi wa hotuba ya nafsi ya pili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kutangazwa kwa heri; ‘kwa sababu’ kinaweka uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: ὑμετέρα ἐστὶν
  choice: ni wenu
  rationale: Kivumishi milikishi kimetumika kiarifu na kinasisitiza kwamba Ufalme ni wa wale wanaosemeshwa. ‘Ni wenu’ ni kifupi na cha asili.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Hili ni neno lililozoeleka na pana vya kutosha kuwasilisha utawala na milki ya Mungu bila kuufupisha kuwa dhana moja pekee.
theological_decisions:
- issue: Ikiwa πτωχοί ifafanuliwe kuwa umaskini wa kiroho au iachwe kama ‘maskini’
  choice: maskini
  alternative: maskini wa roho
  rationale: Luka anasema tu ‘maskini’; kuongeza ‘wa roho’ kungeingiza maneno ya Mathayo 5:3 na kupunguza mkazo na mvutano wa kifungu hiki.
- issue: Ikiwa kauli itafsiriwe kwa nafsi ya tatu au kama hotuba ya moja kwa moja
  choice: ninyi mlio maskini
  alternative: maskini
  rationale: οἱ πτωχοί ina umbo la nafsi ya tatu, lakini ὑμετέρα (‘wenu’) inaonyesha wazi kwamba Yesu anawazungumzia wanafunzi moja kwa moja. Tafsiri kuu inaweka wazi mwelekeo huo huku tanbihi ikihifadhi umbo rasmi la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumiwa kwa mtiririko wa kawaida, huku ‘Heri’ na ‘Ufalme wa Mungu’ zikihifadhi uzito wa kifungu.
