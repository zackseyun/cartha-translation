  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: sw
  text: Na mkiwakopesha wale mnaotarajia kupokea kutoka kwao, mna sifa gani[a]? Hata wenye dhambi huwakopesha wenye dhambi ili wapokee tena kiasi kilekile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnastahili shukrani gani?” Neno la Kigiriki linaweza pia kumaanisha “shukrani,” lakini hapa huenda linamaanisha sifa au kukubaliwa kwa sababu ya tendo jema.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: mkiwakopesha / huwakopesha
  rationale: Kitenzi hiki kinamaanisha kutoa fedha au mali kama mkopo. ‘Kukopesha’ ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: παρ’ ὧν
  choice: wale ... kutoka kwao
  rationale: Muundo huu unawatambulisha watu wanaokopeshwa kuwa ndio wanaotarajiwa kutoa marejesho. Tafsiri inaonyesha kwa njia ya kawaida kwamba kitu kinapokewa kutoka kwao.
- source_word: ἐλπίζετε λαβεῖν
  choice: mnatarajia kupokea kitu
  rationale: ἐλπίζω hapa ina maana ya kutarajia, si kutumaini tu. ‘Kupokea kitu’ inadumisha upana wa λαβεῖν bila kutaja mapema kwamba ni marejesho kamili.
- source_word: ποία ... χάρις ἐστίν
  choice: mna sifa gani?
  rationale: Katika muktadha huu χάρις inaelekea kumaanisha sifa au kukubaliwa kunakotokana na tendo linalostahili pongezi, wala si neema ya wokovu. ‘Sifa’ ni ya kawaida na inaendana na swali la balagha.
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Hili linahifadhi kundi la kimaadili linalotajwa katika Luka huku likitumia Kiswahili cha kawaida na chenye heshima.
- source_word: ἵνα ἀπολάβωσιν
  choice: ili wapokee tena
  rationale: ἀπολαμβάνω hapa ni kupokea kwa kurudishiwa; ‘wapokee tena’ inaonyesha wazi wazo la kurejeshewa.
- source_word: τὰ ἴσα
  choice: kiasi kilekile
  rationale: Kirai hiki kinaonyesha marejesho yanayolingana na kilichokopeshwa. ‘Kiasi kilekile’ ni cha kawaida na hakiongezi wazo la riba au faida.
theological_decisions:
- issue: Maana ya χάρις katika swali la Yesu
  choice: Imetafsiriwa ‘sifa’ kwa maana ya kukubaliwa au kuhesabiwa kuwa ametenda jambo linalostahili pongezi.
  alternative: ‘shukrani,’ ‘neema,’ au ‘faida’
  rationale: Muktadha unalinganisha mwenendo wa wanafunzi na wa wenye dhambi. Hoja ni kile kinachofanya tendo lao listahili sifa, si neema ya wokovu kama dhana ya kiteolojia. Hata hivyo, maana ya ‘shukrani’ inawezekana na imehifadhiwa katika tanbihi.
- issue: Aina ya kinachotarajiwa kurudishwa katika kukopesha
  choice: Imetajwa kwa upana kama kupokea tena kiasi kilekile, bila kudokeza riba.
  alternative: Kupokea riba au kupata faida pamoja na marejesho
  rationale: τὰ ἴσα inaonyesha kitu au kiasi kinacholingana. Tafsiri haiingizi madai ya kiuchumi au kimaadili yasiyosemwa na andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali la balagha na urudiaji wa ‘wenye dhambi’ umehifadhiwa.
