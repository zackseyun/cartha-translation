  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: sw
  text: Ole wenu, ninyi mlio na shibe sasa, kwa sababu mtakuwa na njaa.[a] Ole wenu, ninyi mnaocheka sasa, kwa sababu mtaomboleza na kulia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtapatwa na njaa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Aa, ninyi...”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ole wenu
  rationale: Ni usemi wa kawaida na wenye uzito katika Kiswahili unaowasilisha onyo la kinabii na hukumu inayokuja, bila kuufanya kuwa huruma tu.
- source_word: ἐμπεπλησμένοι
  choice: mlio na shibe
  rationale: Huwasilisha hali ya sasa inayotokana na kushiba, na kudumisha tofauti iliyo wazi na njaa ya baadaye.
- source_word: νῦν
  choice: sasa
  rationale: Hudumisha tofauti muhimu kati ya hali ya sasa na mabadiliko yajayo.
- source_word: πεινάσετε
  choice: mtakuwa na njaa
  rationale: Ni Kiswahili cha kawaida kinachoonyesha wazi hali ya upungufu itakayokuja.
- source_word: γελῶντες
  choice: mnaocheka
  rationale: Huonyesha kitendo kinachoendelea sasa na kubaki karibu na maana halisi ya kitenzi.
- source_word: πενθήσετε
  choice: mtaomboleza
  rationale: Hudumisha uzito wa kuomboleza na kulitofautisha neno hili na tendo linalofuata la kulia.
- source_word: κλαύσετε
  choice: kulia
  rationale: Huonyesha wazi kilio cha huzuni na kuhifadhi mkazo unaotokana na kuunganishwa kwake na kuomboleza.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha kwa uwazi uhusiano wa sababu kati ya tamko la ole na mabadiliko yajayo.
theological_decisions:
- issue: Asili ya tamko la ole
  choice: Onyo la kinabii kuhusu mabadiliko na hukumu inayokuja kwa wale walioshiba na wanaocheka sasa
  alternative: Maelezo tu ya kijamii kuhusu kubadilika kwa hali za maisha
  rationale: Kurudiwa kwa οὐαί, pamoja na vitenzi vya wakati ujao na ulinganifu na heri zinazotangulia, kunaonyesha onyo lenye uzito kuliko maelezo ya kawaida. Tafsiri haibainishi namna au wakati wa kutimia kuliko inavyosema aya yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ole wenu” ni usemi unaoeleweka katika matamko ya onyo; “mlio na shibe” ni wa kawaida zaidi kuliko tafsiri ya kimuundo kama “mliojaza,” huku ukihifadhi hali ya sasa ya kishirikishi timilifu.
