  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: sw
  text: Lakini ole wenu, ninyi mlio matajiri, kwa maana mmekwisha kupata faraja yenu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmepokea faraja yenu kikamilifu.” Kitenzi cha Kigiriki kinaweza kumaanisha kupokea kwa ukamilifu kile mtu anachostahili kupokea.
    reason: lexical_alternative
  - marker: b
    text: Au, “tulizo lenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Inaonyesha tofauti kubwa kati ya baraka zilizotangulia na maonyo yanayofuata, kwa lugha ya kawaida na ya moja kwa moja.
- source_word: οὐαὶ
  choice: ole
  rationale: Ni tamko la kinabii la maonyo makali na hukumu; halipunguzi uzito wake kuwa kilio cha huzuni tu.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: wenu ninyi mlio matajiri
  rationale: Inahifadhi usemi wa moja kwa moja kwa kundi linalotajwa na kufanya walengwa wa onyo waeleweke wazi.
- source_word: ὅτι
  choice: kwa maana
  rationale: Inaonyesha sababu ya tamko la ole kwa Kiswahili cha asili na chenye hadhi.
- source_word: ἀπέχετε
  choice: mmekwisha kupata
  rationale: Kitenzi kinaweza kueleza kupokea au kuwa na kile kinachostahili, hata kwa wazo la kukipokea kikamilifu. Tafsiri hii inaonyesha kwamba faraja hiyo tayari imepatikana, huku kidokezo kikihifadhi maana ya ‘kupokea kikamilifu.’
- source_word: παράκλησιν
  choice: faraja
  rationale: ‘Faraja’ ni neno la kawaida na wazi linalofaa hapa kwa maana ya hali ya kufarijiwa au kutulizwa.
- source_word: ὑμῶν
  choice: yenu
  rationale: Inahifadhi kiwakilishi cha umilikaji kinachorejelea moja kwa moja matajiri wanaosemeshwa.
theological_decisions:
- issue: Asili ya onyo kwa matajiri
  choice: Tamko la moja kwa moja la ole dhidi ya walio matajiri
  alternative: Kulilegeza kuwa kilio cha huzuni au kuongeza ‘wanaotumainia mali’
  rationale: Maandishi ya Kigiriki yanawataja moja kwa moja ‘ninyi mlio matajiri.’ Hakuna maelezo ya ziada kuhusu sababu ya kimaadili, kwa hiyo tafsiri haiongezi sharti ambalo halipo katika aya.
- issue: Nguvu ya wakati na maana ya ἀπέχετε
  choice: mmekwisha kupata
  alternative: mnaipokea; mmepokea kikamilifu
  rationale: Kitenzi cha wakati wa sasa kinaweza kueleza hali ya kuwa tayari na kitu, na pia ni nahau ya kupokea malipo kikamilifu. Matini kuu inaonyesha upatikanaji uliotimia, huku kidokezo kikihifadhi kwa uwazi maana ya ukamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘ole wenu’ huhifadhi uzito wa tamko la kinabii, na ‘ninyi mlio matajiri’ huweka wazi usemi wa moja kwa moja bila kuongeza ufafanuzi wa kimadhehebu.
