  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: sw
  text: Kwa maana kila mti hutambuliwa kwa matunda yake yenyewe; kwa maana hawachumi tini kutoka kwenye mimea yenye miiba, wala hawavuni zabibu kutoka kwenye kichaka chenye miiba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: kila mti
  rationale: Muundo huu una maana ya kugawa mmoja mmoja; “kila mti” ni Kiswahili cha kawaida na huhifadhi mkazo huo.
- source_word: γὰρ
  choice: kwa maana / —
  rationale: γάρ ya kwanza imetafsiriwa “kwa maana” ili kuonyesha uhusiano wa maelezo na muktadha; ya pili haijarudiwa kwa kuwa muunganiko wa Kiswahili unaendeleza mantiki hiyo kwa kawaida bila kupoteza maana.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: kwa matunda yake yenyewe
  rationale: “Kwa” huleta kwa kawaida msingi wa kutambuliwa, na “yake yenyewe” huhifadhi ἰδίου na uhusiano kati ya mti na zao lake.
- source_word: γινώσκεται
  choice: hutambuliwa
  rationale: Hali ya sasa ya kimazoea imewasilishwa kwa “hu-”; “kutambuliwa” linafaa kwa kutambua aina au tabia ya mti kutokana na matunda.
- source_word: ἀκανθῶν
  choice: mimea yenye miiba
  rationale: ἀκάνθαι ni wingi mpana wa mimea ya miiba; tafsiri hii huepuka kueleweka kana kwamba miiba iliyokatwa yenyewe ndiyo chanzo cha tini.
- source_word: συλλέγουσιν
  choice: hawachumi
  rationale: Katika muktadha wa tini, “kuchuma” ni kitenzi cha kawaida na sahihi kwa kuondoa matunda kwenye mmea.
- source_word: σῦκα
  choice: tini
  rationale: Hili ndilo jina la kawaida la tunda la mtini katika Kiswahili Sanifu.
- source_word: βάτου
  choice: kichaka chenye miiba
  rationale: βάτος humaanisha kichaka cha aina ya bramble chenye miiba; maneno haya yanaeleweka kwa wasomaji wa kawaida bila kubainisha spishi isiyotajwa.
- source_word: σταφυλήν
  choice: zabibu
  rationale: Ingawa umbo la Kigiriki ni umoja, hapa linarejelea zao la zabibu; Kiswahili hutumia “zabibu” kwa kawaida.
- source_word: τρυγῶσιν
  choice: hawavuni
  rationale: Kitenzi hiki huhusu kuvuna mazao yaliyoiva, hasa zabibu; “kuvuna” pia huhifadhi tofauti yake na συλλέγουσιν.
theological_decisions:
- issue: Nguvu ya mfano wa matunda
  choice: Methali ya kilimo imehifadhiwa bila kufafanua matumizi yake ya kimaadili.
  alternative: Kuongeza kwa ufafanuzi kwamba matunda ni tabia au matendo ya mtu.
  rationale: Aya yenyewe inadumisha taswira ya mti na matunda. Kutoipanua huhifadhi nguvu ya balagha na uwazi wake wa kitheolojia katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Hutambuliwa,” “hawachumi,” na “hawavuni” huipa sentensi mtiririko wa kimethali. Hakuna tanbihi iliyohitajika, kwa sababu tofauti za ἀκάνθαι na βάτος zimewasilishwa wazi katika matini.
