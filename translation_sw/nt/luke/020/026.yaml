  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: sw
  text: Nao hawakuweza kumnasa kwa yale aliyosema mbele ya watu[a]; wakastaajabia jibu lake, wakanyamaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuweza kumkamata kwa neno lake mbele ya watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσχυσαν
  choice: hawakuweza
  rationale: Huwasilisha wazi maana ya uwezo katika muktadha huu bila kuongeza wazo la nguvu za kimwili.
- source_word: ἐπιλαβέσθαι
  choice: kumkamata
  rationale: Kitenzi kina picha ya kushika au kunasa; pamoja na ‘neno lake’ hapa kinaeleza jaribio la kumnasa Yesu kwa alilosema.
- source_word: τοῦ ῥήματος
  choice: kwa neno lake
  rationale: ῥῆμα hapa ni tamko lililonenwa. ‘Neno lake’ huhifadhi kwa kiasi kikubwa muundo na picha ya Kigiriki, huku ‘lake’ ikieleweka kutokana na muktadha.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: mbele ya watu
  rationale: Ni tafsiri ya kawaida ya kuwa mbele au katika uwepo wa watu; ‘watu’ hudumisha maana ya λαός bila kuibana kuwa umati tu.
- source_word: θαυμάσαντες
  choice: wakastaajabia
  rationale: Hueleza mshangao wao uliosababishwa na jibu lake na kuunganisha kwa kawaida tendo hilo na kunyamaza kwao.
- source_word: ἀποκρίσει
  choice: jibu
  rationale: Ni neno la kawaida na sahihi kwa jibu katika mabishano haya.
- source_word: ἐσίγησαν
  choice: wakanyamaza
  rationale: Huwasilisha tendo la kuingia katika hali ya ukimya baada ya kushangazwa, badala ya kueleza hali tuli pekee.
