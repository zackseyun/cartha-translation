translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kumkamata kwa neno lake’ huhifadhi picha ya chanzo; tanbihi hutoa usemi wa wazi zaidi wa kimuktadha. Alama ya tanbihi [a] imewekwa katika matini kuu.
