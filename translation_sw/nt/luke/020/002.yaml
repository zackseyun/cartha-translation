  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: sw
  text: Wakamwambia, “Tuambie, unafanya mambo haya kwa mamlaka gani? Au ni nani aliyekupa mamlaka hii?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Wa-
  rationale: Kiunganishi kinaunganishwa kwa kawaida na kitenzi katika simulizi la Kiswahili, hivyo “Wakamwambia” hudumisha mtiririko bila kuongeza maana.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: wakamwambia
  rationale: Muundo wenye kitenzi na kishirikishi una maana ya kuanzisha usemi unaoelekezwa kwake; “wakamwambia” ni wa asili na huhifadhi maana bila urudiaji usio wa kawaida.
- source_word: Εἰπὸν ἡμῖν
  choice: Tuambie
  rationale: Amri hii inaomba taarifa, na “Tuambie” ndiyo namna ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kwa mamlaka gani
  rationale: Hapa ἐν inaonyesha msingi wa kitendo kilichoidhinishwa; “kwa mamlaka gani” ni usemi wa kawaida wa Kiswahili.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea matendo ya Yesu katika muktadha.
- source_word: ποιεῖς
  choice: unafanya
  rationale: Wakati wa sasa unaeleza matendo yanayochunguzwa katika hali ya sasa.
- source_word: ἢ
  choice: Au
  rationale: Huanzisha namna ya pili, inayohusiana kwa karibu, ya kuuliza kuhusu mamlaka hiyo.
- source_word: τίς ἐστιν ὁ δούς
  choice: ni nani aliyekupa
  rationale: “Ni nani” huhifadhi uzito wa utambulisho wa mtoaji, huku “aliyekupa” ikitoa kishirikishi chenye kiambishi kwa Kiswahili cha asili.
- source_word: σοι
  choice: -ku-
  rationale: Yambwa ya nafsi ya pili imeingizwa kiasili katika kitenzi “aliyekupa.”
- source_word: τὴν ἐξουσίαν ταύτην
  choice: mamlaka hii
  rationale: “Mamlaka” huonyesha haki au uhalali wa kutenda, si nguvu tupu; “hii” huhifadhi kiashiria.
theological_decisions:
- issue: Maana ya ἐξουσία katika mabishano kuhusu matendo ya Yesu hekaluni
  choice: mamlaka
  alternative: nguvu; haki
  rationale: Muktadha unahusu uhalali na chanzo cha ruhusa ya Yesu kutenda. “Mamlaka” huhifadhi maana hiyo ya kitaasisi na kiteolojia bila kuifanya kuwa uwezo wa nguvu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa maswali mawili na wingi wa “mambo haya” umehifadhiwa; hakuna tanbihi inayohitajika.
