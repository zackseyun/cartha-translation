id: LUK.20.36
reference: Luke 20:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: sw
  text: Kwa maana hawawezi tena kufa, kwa sababu ni kama malaika[a], na ni wana wa Mungu, wakiwa wana wa ufufuo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wako sawa na malaika.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “wana wa Mungu” na “wana wa ufufuo.” Hapa umbo la kiume linaonyesha hali na utambulisho, wala halimaanishi wanaume pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: hawawezi tena kufa
  rationale: Muundo huu unaonyesha kutokuwa na uwezo wa kufa kuanzia hapo na kuendelea. Mpangilio wa maneno “hawawezi tena kufa” unaeleza mwisho wa hali ya kufa, wala si kusema tu kwamba hawatakufa mara nyingine.
- source_word: ἰσάγγελοι
  choice: ni kama malaika
  rationale: Kivumishi hiki kinaweza kumaanisha kuwa sawa na malaika au kuwa kama malaika. “Ni kama malaika” ni Kiswahili cha kawaida kinachohifadhi ulinganisho bila kudokeza kwamba watu hao wamekuwa malaika.
- source_word: υἱοί ... θεοῦ
  choice: wana wa Mungu
  rationale: Neno la Kigiriki υἱοί limetumiwa kwa hali na utambulisho wa kifamilia. “Wana wa Mungu” huhifadhi lugha hiyo na pia urudiaji wake katika kirai kinachofuata.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: wakiwa wana wa ufufuo
  rationale: “Wakiwa” huhifadhi nguvu ya kirai shiriki bila kulazimisha maana yake iwe ya sababu pekee. Tamathali “wana wa ufufuo” imehifadhiwa ili kuonyesha utambulisho wao unaotokana na ufufuo.
- source_word: γάρ ... γάρ
  choice: Kwa maana ... kwa sababu
  rationale: “Kwa maana” huunganisha aya na kauli iliyotangulia, huku “kwa sababu” ikionyesha wazi maelezo yanayofuata kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya uwana katika muktadha wa ufufuo
  choice: Kuhifadhi “wana wa Mungu” na “wana wa ufufuo” katika matini kuu
  alternative: “watoto wa Mungu” na “watoto wa ufufuo”
  rationale: Kigiriki kinarudia neno la kiume υἱοί kwa kusisitiza hali na utambulisho. Tafsiri inahifadhi urudiaji huo bila kuufanya useme kwamba ni wanaume pekee wanaohusika; ufafanuzi huo umetolewa katika tanbihi.
- issue: Uhusiano na malaika
  choice: “ni kama malaika”
  alternative: “wako sawa na malaika”
  rationale: Kauli inaleta ulinganisho katika hali inayozungumziwa, hasa kutokufa, wala haisemi kwamba waliofufuliwa wanageuka kuwa malaika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa Maandiko. Lugha ya kitamathali na urudiaji wa chanzo vimehifadhiwa, huku tanbihi zikifafanua mbadala wa kileksia na ujumuishaji wa kijinsia.
