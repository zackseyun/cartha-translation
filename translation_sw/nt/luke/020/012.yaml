  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: sw
  text: Akatuma tena wa tatu[a]; lakini wao wakamjeruhi huyo pia, wakamtupa nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani, kwa tafsiri ya neno kwa neno, “akaongeza kutuma wa tatu,” nahau yenye maana ya “akatuma tena wa tatu” au “akaendelea kumtuma wa tatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Kisha akamtuma
  rationale: Muundo προστίθημι pamoja na kitenzi-jina unaonyesha kuendelea na tendo au kulifanya tena. Kiswahili cha kawaida hutumia “kisha akamtuma,” ambacho kinaendeleza simulizi bila tafsiri ngumu ya neno kwa neno.
- source_word: τρίτον πέμψαι
  choice: akamtuma wa tatu
  rationale: Kiyunani hakitaji tena nomino “mtumishi,” kwa kuwa inaeleweka kutokana na muktadha. “Wa tatu” huhifadhi udondoshaji huo kwa njia ya kawaida katika Kiswahili.
- source_word: οἱ δὲ
  choice: lakini wao
  rationale: δέ hapa inaonyesha tofauti kati ya hatua ya mwenye shamba na mwitikio wa wapangaji; “lakini wao” huonyesha tofauti hiyo na kudumisha msisitizo wa kiima.
- source_word: καὶ τοῦτον
  choice: huyo pia
  rationale: καί inaonyesha kwamba mtumishi huyu alitendewa vivyo hivyo kama waliotangulia; “huyo pia” ni ya kawaida na huhifadhi maana ya nyongeza.
- source_word: τραυματίσαντες
  choice: wakamjeruhi
  rationale: τραυματίζω humaanisha kusababisha jeraha. “Kumjeruhi” ni sahihi na mahususi kuliko neno pana kama “kumdhuru.”
- source_word: ἐξέβαλον
  choice: wakamtupa nje
  rationale: ἐκβάλλω hapa ni tendo la nguvu la kumtoa mtu nje. “Wakamtupa nje” hudumisha ukali wa kitendo na ni Kiswahili cha kawaida.
