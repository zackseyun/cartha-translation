base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: sw
  text: Akaendelea kumtuma mtumwa mwingine; lakini wakampiga na kumvunjia heshima huyo pia, kisha wakamwacha aende zake mikono mitupu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθετο
  choice: akaendelea
  rationale: Pamoja na kitenzi-jina kinachofuata, neno hili lina maana ya kuendelea kufanya jambo; “akaendelea” ni Kiswahili cha kawaida na huhifadhi mwendelezo wa simulizi.
- source_word: ἕτερον
  choice: mwingine
  rationale: Humtambulisha mtumwa wa ziada aliye tofauti na wa kwanza.
- source_word: πέμψαι
  choice: kumtuma
  rationale: Hii ndiyo tafsiri ya kawaida na ya wazi katika muktadha wa mwenye shamba kumpeleka mwakilishi wake.
- source_word: δοῦλον
  choice: mtumwa
  rationale: Katika mfano huu neno linaonyesha mtu aliye chini ya mamlaka na umiliki wa bwana wake; “mtumwa” huhifadhi hali hiyo ya kijamii kuliko “mtumishi.”
- source_word: κἀκεῖνον
  choice: huyo pia
  rationale: Huhifadhi msisitizo kwamba mpangaji walimtendea mtumwa huyu mwingine kama walivyomtendea wa kwanza.
- source_word: δείραντες
  choice: wakampiga
  rationale: Hutoa maana ya jumla ya kumpiga kimwili bila kubainisha isivyohitajika kwamba alichapwa kwa mjeledi.
- source_word: ἀτιμάσαντες
  choice: kumvunjia heshima
  rationale: Usemi huu wa kawaida unaonyesha kumtendea mtu kwa namna ya kumdhalilisha na kumnyang’anya heshima, ukihifadhi kipengele cha aibu ya kijamii.
- source_word: ἐξαπέστειλαν
  choice: wakamrudisha
  rationale: Katika muktadha huu walimwondoa na kumpeleka arudi kwa aliyemtuma; “wakamrudisha” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: κενόν
  choice: mikono mitupu
  rationale: Ni nahau ya kawaida ya Kiswahili inayoonyesha kwamba hakupokea chochote walichotarajia apewe.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano
  choice: mtumwa
  alternative: mtumishi
  rationale: Uhusiano wa kuwa chini ya mamlaka na umiliki wa mwenye shamba unaonekana wazi katika mfano huu. “Mtumwa” huakisi hali hiyo ya kijamii bila kuingiza dai jingine la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa sentensi umehifadhi mwendelezo, ukatili na fedheha ya tendo bila kutumia lugha ya kizamani au ya dhehebu fulani.
