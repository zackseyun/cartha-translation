id: LUK.20.27
reference: Luke 20:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: sw
  text: Ndipo baadhi ya Masadukayo, wanaokana kuwepo kwa ufufuo[a], wakamkaribia na kumuuliza,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaosema kwamba hakuna ufufuo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: wakamkaribia
  rationale: Kitenzi hiki cha hali ya kushiriki kinaonyesha kwamba walimsogelea Yesu kabla ya kumuuliza. ‘Wakamkaribia’ ni Kiswahili cha kawaida na kinahifadhi wazo la kumwelekea.
- source_word: δέ
  choice: Ndipo
  rationale: Hapa δέ inaendeleza simulizi bila kuonyesha upinzani mkubwa. ‘Ndipo’ linaunganisha tukio hili kwa kawaida na yaliyotangulia.
- source_word: τινες τῶν Σαδδουκαίων
  choice: baadhi ya Masadukayo
  rationale: 'Tafsiri hii inahifadhi maana ya usemi wa sehemu: si lazima Masadukayo wote, bali baadhi yao.'
- source_word: οἱ ἀντιλέγοντες
  choice: wanaokana
  rationale: Katika muktadha huu kitenzi kinaeleza msimamo wao dhidi ya kuwapo kwa ufufuo, si kupinga kwa maneno tu. ‘Wanaokana’ linaonyesha wazi msimamo huo bila kuongeza maelezo ya kimadhehebu.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: kuwepo kwa ufufuo
  rationale: Muundo huu unaeleza jambo wanalolikataa. ‘Kuwepo kwa ufufuo’ ni wa kawaida katika Kiswahili na hauongezi maelezo yasiyomo katika Kigiriki.
- source_word: ἐπηρώτησαν αὐτόν
  choice: na kumuuliza
  rationale: Kitenzi kinaweza kumaanisha kuuliza au kuhoji. ‘Kumuuliza’ kinafaa katika sentensi hii na muktadha unaofuata utaonyesha kwamba swali lao ni la kumjaribu au kumpinga.
theological_decisions:
- issue: Jinsi ya kueleza msimamo wa Masadukayo kuhusu ufufuo
  choice: wanaokana kuwepo kwa ufufuo
  alternative: wanaosema kwamba hakuna ufufuo
  rationale: Chaguo kuu linaonyesha kuwa huo ni msimamo wa kukataa ufufuo, huku tanbihi ikihifadhi njia nyingine ya moja kwa moja ya kueleza muundo wa Kigiriki. Hakuna ufafanuzi wa baadaye wa kimafundisho ulioongezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. Alama ya tanbihi imewekwa mara baada ya kishazi kinachohusika.
