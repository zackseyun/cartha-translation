  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: sw
  text: Lakini wakajadiliana wao kwa wao wakisema, “Tukisema, ‘Ni kutoka mbinguni,’ atasema, ‘Kwa nini hamkumwamini?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο
  choice: wakajadiliana
  rationale: Kitenzi hiki kinaonyesha kutafakari na kushauriana kwa pamoja. ‘Wakajadiliana’ ni Kiswahili cha kawaida kinachoonyesha mazungumzo yao ya tahadhari bila kupoteza wazo la kupima jibu.
- source_word: πρὸς ἑαυτοὺς
  choice: wao kwa wao
  rationale: Kirai hiki kinaonyesha kuwa walishauriana ndani ya kundi lao wenyewe.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huonyesha kitendo kilichoendelea sambamba na kujadiliana kwao na kinaingia kwa kawaida katika usemi wa moja kwa moja.
- source_word: Ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Muundo huu wa Kiswahili unaonyesha sharti linalowezekana kwa ufupi na kwa kawaida.
- source_word: Ἐξ οὐρανοῦ
  choice: Ulitoka mbinguni
  rationale: Jibu hili linarejelea ubatizo wa Yohana uliotajwa katika mstari uliotangulia; kuingiza ‘ulitoka’ kunakamilisha jibu kwa Kiswahili huku ‘mbinguni’ ikihifadhi nahau ya Kigiriki bila kuibadili moja kwa moja kuwa ‘kwa Mungu.’
- source_word: ἐρεῖ
  choice: atatuuliza
  rationale: Ingawa maana ya msingi ni ‘atasema,’ maneno yanayofuata ni swali. ‘Atatuuliza’ ni ya kawaida katika Kiswahili na huweka wazi nguvu ya usemi katika muktadha.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kirai cha kuuliza sababu.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: hamkumwamini
  rationale: πιστεύω pamoja na yambwa katika hali ya dative hapa humaanisha kukubali kuwa mtu huyo anasema kweli. ‘Kumwamini’ huepuka maana pana zaidi ya ‘kumwamini yeye kama mwokozi’ ambayo si lazima katika sarufi hii.
theological_decisions:
- issue: Maana ya chanzo cha ubatizo wa Yohana katika jibu ‘Ἐξ οὐρανοῦ’
  choice: Kuhifadhi ‘mbinguni’
  alternative: ‘Kwa Mungu’
  rationale: ‘Mbinguni’ inadokeza mamlaka ya Mungu lakini inahifadhi namna ya heshima iliyotumiwa katika maandishi ya Kigiriki bila kufafanua zaidi ya yaliyoandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakajadiliana wao kwa wao’ ni cha kawaida kwa ushauriano wa kundi; ‘Tukisema’ na ‘hamkumwamini’ vinaeleweka kwa urahisi na wasomaji wa kawaida.
