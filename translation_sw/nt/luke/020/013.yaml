  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: sw
  text: Kisha mwenye shamba la mizabibu akasema[a], “Nifanye nini? Nitamtuma mwanangu wa kiume mpendwa; labda watamheshimu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “bwana wa shamba la mizabibu.”
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “watamheshimu” linaweza pia kumaanisha “wataaibika kwa sababu yake” au “watamwonyesha staha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: mwenye shamba la mizabibu
  rationale: Katika muktadha wa mfano huu, kirai hiki kinamtaja mwenye mali hiyo. Tafsiri hii ni ya kawaida na ya wazi kwa Kiswahili, huku maana ya karibu zaidi ya ‘bwana wa shamba la mizabibu’ ikiwekwa katika tanbihi.
- source_word: Τί ποιήσω;
  choice: Nifanye nini?
  rationale: Hili ni swali la mtu anayejishauri kuhusu hatua atakayochukua; umbo hili ni la asili katika Kiswahili na linahifadhi hali hiyo ya kutafakari.
- source_word: πέμψω
  choice: Nitamtuma
  rationale: Wakati ujao unaonyesha hatua ambayo mwenye shamba sasa ameamua kuchukua.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: mwanangu mpendwa
  rationale: ‘Mwanangu’ huhifadhi jinsia na uhusiano mahususi wa υἱός, na ‘mpendwa’ hudumisha uzito wa ἀγαπητός pamoja na mwangwi wake unaowezekana katika Injili ya Luka.
- source_word: ἴσως
  choice: labda
  rationale: Neno hili huonyesha matarajio yasiyo na uhakika bila kuyaongeza au kuyapunguza.
- source_word: τοῦτον
  choice: -m- katika watamheshimu
  rationale: Kiwakilishi cha yambwa ndani ya kitenzi humrejelea mwana kwa njia ya kawaida katika Kiswahili; muktadha unamtambulisha wazi.
- source_word: ἐντραπήσονται
  choice: watamheshimu
  rationale: Katika muktadha huu kitenzi kina maana ya kumwonyesha mtu heshima au staha. ‘Watamheshimu’ ni tafsiri ya wazi na ya kawaida, huku maana nyingine iliyo karibu zaidi ikiwekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya κύριος katika mfano ambao mhusika anaweza kumwakilisha Mungu
  choice: mwenye shamba la mizabibu
  alternative: bwana wa shamba la mizabibu
  rationale: Maana ya moja kwa moja katika simulizi ni mwenye mali. ‘Mwenye’ huwasilisha maana hiyo bila kulazimisha cheo cha kitheolojia, lakini tanbihi huhifadhi tafsiri iliyo karibu zaidi na umbo la Kigiriki.
- issue: Mwangwi wa Kikristo katika kirai ‘mwanangu mpendwa’
  choice: mwanangu mpendwa
  alternative: mwanangu, yule mpendwa
  rationale: Tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana ya mfano pamoja na mwangwi unaowezekana wa maneno yaliyotumika kuhusu Yesu katika Luka, bila kuufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Alama [b] imewekwa baada ya kitenzi inachokifafanua.
