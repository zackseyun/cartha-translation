  text: So they answered that they did not know where it was from[a].
translation:
  language: sw
  text: Basi wakajibu kwamba hawakujua ulitoka wapi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili yake ilikuwa wapi.” Neno la Kigiriki linauliza kuhusu asili au chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Basi
  rationale: Katika mfululizo huu wa simulizi, καὶ inaendeleza jibu linalotokana na mashauriano yaliyotangulia; “Basi” ni ya asili katika Kiswahili na inaonyesha uhusiano huo bila kuongeza maana nyingi.
- source_word: ἀπεκρίθησαν
  choice: wakajibu
  rationale: Kitenzi ἀποκρίνομαι humaanisha kujibu; umbo la wakati uliopita limetafsiriwa kwa “wakajibu,” linalofaa simulizi la Kiswahili.
- source_word: μὴ εἰδέναι
  choice: kwamba hawakujua
  rationale: Baada ya kitenzi cha kujibu, kitenzi-jina pamoja na μή kinatumika kama usemi usio wa moja kwa moja; “kwamba hawakujua” ni wazi na ya kawaida katika Kiswahili.
- source_word: πόθεν
  choice: ulikotoka
  rationale: πόθεν huuliza asili au chanzo. Kiambishi “u-” kinarejelea ubatizo wa Yohana uliotajwa katika muktadha uliotangulia, bila kutaja chanzo hicho kwa namna iliyo wazi zaidi kuliko Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi maana ya chanzo katika πόθεν.
