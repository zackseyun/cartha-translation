  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: sw
  text: Kwa maana Daudi mwenyewe anasema katika Kitabu cha Zaburi[a], “Bwana alimwambia Bwana wangu, ‘Keti upande wangu wa kulia.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata Kiebrania cha Zaburi 110:1, “BWANA alimwambia Bwana wangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Kwa maana ... mwenyewe
  rationale: γάρ inaleta sababu au maelezo, hivyo imetafsiriwa ‘Kwa maana’; αὐτός inasisitiza kwamba Daudi mwenyewe ndiye anayesema.
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo wa kauli ya kunukuu umehifadhiwa kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: katika Kitabu cha Zaburi
  rationale: Huhifadhi maana ya βίβλος ‘kitabu’ na ψαλμῶν ‘ya zaburi’, huku likitumia jina la kitabu cha Maandiko lililozoeleka.
- source_word: Εἶπεν
  choice: alimwambia
  rationale: Aoristi imetolewa kwa wakati uliopita; kiambishi cha mtendewa ‘-mw-’ kinaonyesha kwa kawaida kwamba Bwana wa kwanza alisema kwa Bwana wa Daudi.
- source_word: κύριος
  choice: Bwana
  rationale: Neno la Kigiriki κύριος limetafsiriwa moja kwa moja ‘Bwana’; rejeo kwa jina la Mungu katika Zaburi ya Kiebrania limewekwa katika tanbihi bila kubadili matini kuu ya Kigiriki.
- source_word: τῷ κυρίῳ μου
  choice: Bwana wangu
  rationale: Huhifadhi hadhi na uzito wa κύριος pamoja na umilikaji wa μου, bila kuamua kimya kimya mvutano wa kiteolojia wa nukuu.
- source_word: Κάθου
  choice: Keti
  rationale: Ni amri fupi, ya asili, na yenye heshima inayolingana na κάθημαι.
- source_word: ἐκ δεξιῶν μου
  choice: upande wangu wa kulia
  rationale: Hii ni tafsiri ya asili ya nahau inayomaanisha mahali pa heshima upande wa kulia wa msemaji.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος ya kwanza, ilhali Zaburi 110:1 ya Kiebrania ina jina la Mungu YHWH
  choice: Bwana
  alternative: BWANA
  rationale: Matini kuu inafuata chanzo cha Kigiriki, ambacho kina κύριος. Tanbihi inahifadhi taarifa muhimu ya kimatini kwamba Kiebrania kina jina la Mungu.
- issue: Jinsi ya kutafsiri κύριος ya pili katika nukuu yenye umuhimu wa Kimasihi
  choice: Bwana wangu
  alternative: bwana wangu / mkuu wangu
  rationale: ‘Bwana wangu’ huhifadhi uzito wa neno na hoja ya Yesu bila kuongeza utambulisho ambao mstari huu pekee hauusemi wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Daudi mwenyewe’ unadumisha msisitizo, na ‘Kitabu cha Zaburi’ ni wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] ipo katika matini kuu.
