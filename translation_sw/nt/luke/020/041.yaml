  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: sw
  text: Lakini akawaambia, “Inakuwaje watu wanasema kwamba Masihi[a] ni mwana wa Daudi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kiyunani Χριστός ni cheo chenye maana ya Mpakwa Mafuta; hapa limetafsiriwa “Masihi” kwa sababu muktadha unahusu mkombozi wa ukoo wa Daudi aliyekuwa akitarajiwa.
    reason: alternative_reading
  - marker: b
    text: Au “Mwana wa Daudi” au “mmoja wa wana wa Daudi.” Kiyunani kinasema kihalisi “mwana wa Daudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Ni kiunganishi chepesi kinachoonyesha geuko la mazungumzo; hapa “Lakini” linafaa kwa kuwa Yesu anaanzisha swali lenye changamoto baada ya majibizano yaliyotangulia.
- source_word: πρὸς αὐτούς
  choice: akawaambia
  rationale: Muundo wa kusema kuelekea kwa watu fulani umetafsiriwa kwa Kiswahili cha kawaida kama “akawaambia,” ukihifadhi kwamba maneno yaliwaelekea wao.
- source_word: Πῶς
  choice: Inakuwaje
  rationale: Katika muktadha huu swali linachunguza mantiki ya dai, si namna ya kulitamka; “Inakuwaje” ni la asili na linaendeleza changamoto hiyo.
- source_word: λέγουσιν
  choice: watu wanasema
  rationale: Kitenzi kina kiima cha wingi kisichotajwa. “Watu” kinaonyesha ujumla huo bila kuwatambulisha wasemaji mahususi.
- source_word: τὸν χριστόν
  choice: Masihi
  rationale: Χριστός limetumika kama cheo cha mkombozi wa kifalme aliyekuwa akitarajiwa katika ukoo wa Daudi; “Masihi” huonyesha maana hiyo wazi kwa Kiswahili.
- source_word: εἶναι
  choice: kwamba ... ni
  rationale: Kiswahili cha kawaida huwasilisha infinitivu inayofuata kitenzi cha kusema kwa kishazi “kwamba ... ni.”
- source_word: Δαυὶδ υἱόν
  choice: mwana wa Daudi
  rationale: Huhifadhi kwa karibu lugha halisi ya uhusiano wa mwana na Daudi bila kuongeza kibainishi au kuifanya moja kwa moja kuwa cheo rasmi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unahusu waziwazi mkombozi wa kifalme wa ukoo wa Daudi aliyekuwa akitarajiwa. “Masihi” hutanguliza maana ya cheo bila kuifanya kuwa jina binafsi.
- issue: Lugha ya kuwa mwana wa Daudi
  choice: mwana wa Daudi
  alternative: Mwana wa Daudi; mmoja wa wana wa Daudi
  rationale: Chaguo hili huhifadhi dai la nasaba na mvutano wa kiteolojia ambao Yesu atauchunguza katika mistari inayofuata, bila kulifanya neno hilo kuwa cheo kwa kutumia herufi kubwa wala kubainisha zaidi ya Kiyunani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Inakuwaje watu wanasema” ni usemi wa asili unaohifadhi swali la kimantiki, huku “mwana wa Daudi” ukiacha ubainifu wa kirai cha Kiyunani wazi.
