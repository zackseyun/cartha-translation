  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: sw
  text: Lakini akajibu, akawaambia, “Mimi pia nitawauliza swali[a]; nanyi niambieni:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “neno” au “jambo.” Neno la Kigiriki λόγον kimsingi linaweza kumaanisha “neno” au “jambo,” lakini hapa linatumika kwa maana ya “swali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Kitenzi hiki kinaonyesha kwamba maneno ya Yesu yalikuwa jibu kwa waliokuwa wamemhoji; ‘akajibu’ ni Kiswahili cha kawaida na huhifadhi nguvu hiyo.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye ulinganisho au upinzani mdogo katika mazungumzo hayo.
- source_word: εἶπεν πρὸς αὐτούς
  choice: akawaambia
  rationale: Hii ni tafsiri ya kawaida ya kitendo cha kusema kwa watu fulani, na inatofautisha kitenzi kikuu na kishiriki ‘akajibu.’
- source_word: Ἐρωτήσω ὑμᾶς
  choice: nitawauliza
  rationale: Umbo la wakati ujao pamoja na kiwakilishi cha wingi linawasilishwa kwa kawaida na kwa usahihi katika neno ‘nitawauliza.’
- source_word: κἀγὼ
  choice: Mimi pia
  rationale: 'Huhifadhi msisitizo wa nafsi ya kwanza na maana ya kurudishiana: wao walimwuliza, naye pia atawauliza.'
- source_word: λόγον
  choice: swali
  rationale: Ingawa neno hili kwa kawaida linaweza kumaanisha ‘neno’ au ‘jambo,’ likiwa kitu cha kitenzi ‘kuuliza’ hapa linatumika kimuktadha kwa maana ya swali.
- source_word: καὶ εἴπατέ μοι
  choice: nanyi niambieni
  rationale: Huhifadhi amri iliyoelekezwa kwa watu wengi, kiwakilishi ‘mimi,’ na uwazi wa changamoto ya Yesu.
