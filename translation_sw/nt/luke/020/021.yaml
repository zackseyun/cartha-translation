base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: sw
  text: Nao wakamwuliza, wakisema, “Mwalimu, tunajua kwamba unasema na kufundisha kwa usahihi, na kwamba humpendelei mtu yeyote,[a] bali unaifundisha njia ya Mungu kwa kweli.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “hupokei uso,” nahau yenye maana ya kutokuwa na upendeleo au kutoshawishiwa na hadhi ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “bali kwa kweli unaifundisha njia ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: wakamwuliza
  rationale: Kitenzi hiki humaanisha kuuliza au kuhoji. “Wakamwuliza” ni cha kawaida na hakiongezi waziwazi ukali ambao haupo katika neno lenyewe; muktadha unaonyesha kuwa swali hilo lilikuwa jaribu.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa mtu anayefundisha, bila kuingiza wazo la umiliki linaloweza kuambatana na “Bwana.”
- source_word: ὀρθῶς
  choice: kwa usahihi
  rationale: Kirai hiki kinaeleza kwamba kusema na kufundisha kwake ni sahihi; ni Kiswahili cha asili kinachoweza kuhusishwa na vitenzi vyote viwili.
- source_word: λέγεις καὶ διδάσκεις
  choice: unasema na kufundisha
  rationale: Vitenzi vyote viwili vimehifadhiwa ili kufuata uratibu na msisitizo wa Kigiriki.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: humpendelei mtu yeyote
  rationale: Hii ni nahau yenye maana ya kutokuwa na upendeleo. Tafsiri ya maana ni wazi katika Kiswahili, ilhali tafsiri sisisi ya “kupokea uso” ingekuwa yenye utata.
- source_word: ἐπ’ ἀληθείας
  choice: kwa kweli
  rationale: Kirai hiki kinaonyesha kwamba mafundisho yake yanaendana na kweli. “Kwa kweli” ni cha kawaida na huhifadhi uhusiano wake na namna ya kufundisha.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: njia ya Mungu
  rationale: Tafsiri hii inahifadhi picha ya “njia” pamoja na maana yake pana ya mapenzi ya Mungu au mwenendo anaoutaka.
- source_word: ἀλλ’
  choice: bali
  rationale: “Bali” huonyesha kwa uwazi utofautishaji kati ya kutopendelea watu na kufundisha kwa kweli.
theological_decisions:
- issue: Nahau kuhusu kutokuwa na upendeleo
  choice: humpendelei mtu yeyote
  alternative: huangalii sura ya mtu
  rationale: Chaguo hili linawasilisha maana ya kimaadili ya nahau bila kuifanya ionekane kuwa inahusu tu sura ya nje. Haliongezi sababu maalumu kama cheo, mali, au hadhi ambayo haikutajwa moja kwa moja.
- issue: Uhusiano wa ἐπ’ ἀληθείας na kitendo cha kufundisha
  choice: unaifundisha njia ya Mungu kwa kweli
  alternative: kwa kweli unaifundisha njia ya Mungu
  rationale: Mpangilio huu unakitambulisha kirai kama maelezo ya namna Yesu anavyofundisha, huku tanbihi ikihifadhi mpangilio mwingine wa kawaida unaowezekana bila kubadili dai la msingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unahifadhi mfululizo wa sifa za Kigiriki bila kuwa mzito; nahau isiyoeleweka kwa tafsiri sisisi imetolewa kwa maana yake na kufafanuliwa katika tanbihi.
