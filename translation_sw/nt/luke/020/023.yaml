  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: sw
  text: Lakini, alipotambua hila yao[a], aliwaambia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujanja,” “udanganyifu,” au “werevu wa hila.” Neno la Kigiriki huonyesha ujanja wa kupanga mambo kwa namna isiyo ya uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: akitambua
  rationale: Kitenzi hiki cha wakati uliopita katika umbo la kishirikishi kinaonyesha kwamba Yesu alitambua nia yao kabla ya kusema. “Akitambua” ni ya kawaida na huhifadhi maana ya utambuzi wa kiakili bila kutia maelezo yasiyo katika matini.
- source_word: δὲ
  choice: Lakini
  rationale: 'Hapa δέ huonyesha tofauti nyepesi katika simulizi: wapinzani walikuwa wakijaribu kumnasa, lakini Yesu alitambua hila yao.'
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki cha umilikaji kinahusiana na πανουργίαν; “yao” ni tafsiri ya kawaida na fasaha katika Kiswahili.
- source_word: πανουργίαν
  choice: hila
  rationale: “Hila” huonyesha ujanja wenye nia mbaya na mpango wa kudanganya. Ni neno fupi, la kawaida, na linalofaa muktadha, huku tanbihi ikihifadhi vivuli vingine vya maana.
- source_word: εἶπεν πρὸς αὐτούς
  choice: akawaambia
  rationale: Muundo huu kwa kawaida humaanisha kusema kwa watu fulani. “Akawaambia” ni Kiswahili cha asili na huwakilisha kwa pamoja tendo la kusema na walengwa wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Yesu” limetajwa ili kurejelea mhusika kwa uwazi katika mstari unaosomwa peke yake; katika muktadha mpana, “yeye” pia lingewezekana. Alama ya tanbihi [a] imewekwa mara baada ya neno linalofafanuliwa.
