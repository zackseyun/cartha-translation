  source_fidelity: The draft accurately renders the main sense of κατανοήσας, πανουργίαν, and εἶπεν πρὸς αὐτούς. However, it adds the name “Yesu,” whereas the Greek text uses only the pronoun implied by εἶπεν (“he”). The temporal relation of the aorist participle is more clearly represented by “alipotambua” than by the imperfective participial form “akitambua.”
  naturalness: “Lakini, alipotambua hila yao, aliwaambia,” is natural, clear Standard East African Swahili and retains the unfinished, introductory syntax of the verse.
  terminology: “Hila” appropriately conveys πανουργία as morally questionable craftiness or scheming. The footnote offers suitable alternatives without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The translation explicitly supplies “Yesu.”
    rationale: The source text at this point says only “he said to them.” Although the antecedent is Jesus in context, adding his name is not required for clarity and goes beyond the wording of this verse.
  - severity: low
    issue: “Akitambua” does not mark the completed prior perception as clearly as the Greek aorist participle.
    rationale: “Alipotambua” naturally expresses that he perceived their cunning before speaking.
