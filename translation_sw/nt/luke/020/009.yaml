  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: sw
  text: 'Kisha akaanza kuwaambia watu mfano huu: “Mwanamume mmoja alipanda shamba la mizabibu, akalikodisha kwa wakulima, kisha akaenda zake kwa muda mrefu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Kisha akaanza
  rationale: δέ inaendeleza simulizi, na ἤρξατο huonyesha mwanzo wa tendo la kusema; ‘Kisha akaanza’ ni Kiswahili cha kawaida na cha wazi.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: kuwaambia watu
  rationale: Muundo huu unaonyesha kwamba Yesu aliwaelekezea watu maneno; ‘kuwaambia watu’ ni wa asili zaidi kuliko tafsiri ya neno kwa neno.
- source_word: τὴν παραβολὴν ταύτην
  choice: mfano huu
  rationale: ‘Mfano’ ndilo neno la kawaida la kibiblia kwa παραβολή na linahifadhi aina ya mafundisho inayokusudiwa.
- source_word: Ἄνθρωπος
  choice: Mtu mmoja
  rationale: Hutambulisha mhusika mmoja katika simulizi; katika Kiswahili ‘mtu mmoja’ ni utangulizi wa asili, huku muktadha ukimtambulisha kama mwenye shamba bila kulazimisha jinsia kisarufi.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: alipanda shamba la mizabibu
  rationale: Huonyesha kuanzishwa kwa eneo lililopandwa mizabibu; ‘shamba la mizabibu’ linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: akalikodisha kwa wakulima
  rationale: ἐκδίδωμι hapa ni kukodisha mali, na γεωργοί ni wakulima waliolilima; kiambishi ‘-li-’ kinarejelea shamba la mizabibu.
- source_word: ἀπεδήμησεν
  choice: akasafiri
  rationale: Kitenzi kina maana ya kuondoka nyumbani au eneo la nyumbani na kukaa mbali; ‘akasafiri’ huhifadhi maana hiyo bila kuongeza kwamba alienda nchi nyingine.
- source_word: χρόνους ἱκανούς
  choice: kwa muda mrefu
  rationale: Usemi huu unaonyesha kipindi kikubwa; ‘kwa muda mrefu’ ni tafsiri ya kawaida, wazi na yenye uzito unaofaa.
theological_decisions:
- issue: Jinsia ya mhusika anayetambulishwa kwa Ἄνθρωπος
  choice: Mtu mmoja
  alternative: Mwanamume mmoja
  rationale: Ἄνθρωπος inaweza kumaanisha mtu, ingawa umbo ni la kiume na mhusika kwa kawaida hueleweka kuwa mwanamume. Kiswahili hakihitaji kutaja jinsia hapa; ‘mtu mmoja’ huhifadhi maana ya msingi bila kuingiza msisitizo usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa simulizi, ikiepuka lugha ya kisheria isiyoeleweka na pia ikihifadhi istilahi ya kibiblia ‘mfano.’
