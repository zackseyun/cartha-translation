  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: sw
  text: Yesu akawaambia, “Wala mimi sitawaambia kwa mamlaka gani ninafanya mambo haya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: Wala mimi sita-
  rationale: “Wala” linaunganisha jibu la Yesu na kukataa kwa viongozi katika mstari uliotangulia; umbo la wakati ujao “sitawaambia” linaleta kwa kawaida nguvu ya jibu hilo katika Kiswahili.
- source_word: λέγω ὑμῖν
  choice: sitawaambia
  rationale: Ingawa λέγω mara nyingi ni “kusema,” hapa ikiwa na walengwa na jambo linaloeleweka, “kuwaambia” ni Kiswahili cha kawaida na sahihi.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ni kwa mamlaka gani
  rationale: Kirai hiki kinaonyesha msingi au haki ambayo Yesu anatumia kutenda; “kwa mamlaka gani” ni usemi wa kawaida wa Kiswahili na huhifadhi swali la Kigiriki.
- source_word: ἐξουσίᾳ
  choice: mamlaka
  rationale: Katika muktadha huu neno linaonyesha haki au mamlaka halali ya kutenda, si nguvu ghafi tu.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi cha Kigiriki na kurejelea matendo ya Yesu yanayobishaniwa.
- source_word: ποιῶ
  choice: ninafanya
  rationale: Wakati wa sasa unaonyesha matendo yanayoendelea kuwa mada ya swali; “ninafanya” ni wa kawaida katika Kiswahili cha sasa.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Yesu akawaambia
  rationale: Muundo wa masimulizi wenye “aka-” unaendeleza mfululizo wa tukio kwa Kiswahili cha kawaida; “akawaambia” hujumuisha kitendo cha kusema na walengwa wake.
theological_decisions:
- issue: Yesu kukataa kuwajibu viongozi
  choice: Kauli imetafsiriwa kama kukataa moja kwa moja kuwaambia mamlaka yake ni gani, bila kuongeza sababu.
  alternative: Kudokeza wazi kuwa Yesu anakwepa swali au kwamba anawahukumu kwa kutokuamini kwao.
  rationale: Mstari unasema tu kwamba Yesu naye hatawaambia kwa mamlaka gani anafanya mambo haya; hauitaji maelezo ya ziada ya kitheolojia au kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wala mimi sitawaambia” ni cha asili katika mazungumzo na hudumisha uhusiano wa jibu hili na kukataa kwao katika mstari uliotangulia. Tanbihi ya Kiingereza kuhusu “by/with” haijahamishwa, kwa kuwa Kiswahili hutumia “kwa” kwa njia zote mbili na hakuna tofauti halisi ya kileksika ya kuonyesha.
