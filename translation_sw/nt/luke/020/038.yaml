  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: sw
  text: Mungu si Mungu wa wafu, bali wa walio hai, kwa maana wote wako hai kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana wote wako hai mbele zake.”
    reason: Tafsiri hii inaonyesha maana nyingine inayowezekana ya dativu αὐτῷ.
lexical_decisions:
- source_word: θεὸς
  choice: Mungu
  rationale: Ingawa nomino hii haina kibainishi katika Kigiriki, hapa ina maana maalumu katika muktadha wa imani ya Kiyahudi kuhusu Mungu mmoja.
- source_word: δὲ
  choice: lakini
  rationale: δέ inaendeleza hoja huku ikitambulisha tofauti; nguvu kuu ya ulinganisho bado imo katika οὐκ ... ἀλλὰ, ‘si ... bali.’
- source_word: νεκρῶν
  choice: wafu
  rationale: Kivumishi hiki cha wingi kimetumika kama nomino, na ‘wafu’ ni tafsiri fupi na ya kawaida.
- source_word: ζώντων
  choice: walio hai
  rationale: Nomino-shiriki hii imetumika kama nomino na inaleta tofauti ya moja kwa moja na ‘wafu.’
- source_word: πάντες
  choice: wote
  rationale: Tafsiri hii haibani wigo wa neno hilo kwa kuwataja watu fulani tu, ingawa wazee wa ukoo ndio wanaozungumziwa katika muktadha.
- source_word: αὐτῷ
  choice: kwake
  rationale: Dativu hii ina maana iliyobanwa; ‘kwake’ huhifadhi uhusiano unaoelezwa bila kuufafanua kupita kiasi.
- source_word: ζῶσιν
  choice: wanaishi
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa moja kwa moja, huku maana mbadala ‘wako hai’ ikibainishwa katika tanbihi.
theological_decisions:
- issue: Maana ya αὐτῷ katika πάντες γὰρ αὐτῷ ζῶσιν
  choice: kwa maana wote wanaishi kwake
  alternative: kwa maana wote wako hai mbele zake
  rationale: Tafsiri kuu huhifadhi usemi uliobanwa wa Kigiriki na hoja kwamba wote wanaishi katika uhusiano na Mungu, bila kuamua kwa kina zaidi namna ya kuwepo kwao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima na inayoeleweka. Alama ya tanbihi imewekwa baada ya kishazi ambacho kina utata wa αὐτῷ ζῶσιν.
