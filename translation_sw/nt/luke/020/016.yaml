  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: sw
  text: “Atakuja na kuwaangamiza wakulima wapangaji hawa[a], kisha atawapa wengine shamba la mizabibu.” Lakini waliposikia hayo, wakasema[b], “Jambo hilo lisitokee kamwe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakulima” au “wapangaji”; neno la Kigiriki linamaanisha watu waliolima ardhi iliyomilikiwa na mtu mwingine.
    reason: lexical_alternative
  - marker: b
    text: Au “Hasha!” au “La hasha!” Usemi wa Kigiriki ni ukataaji mkali; kihalisi, “Isitokee.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Atakuja
  rationale: Kitenzi cha wakati ujao kinarejelea mwenye shamba katika mfano. ‘Atakuja’ ni tafsiri ya moja kwa moja bila kuongeza wazo la kurudi.
- source_word: ἀπολέσει
  choice: kuwaangamiza
  rationale: Neno hili linaweza kumaanisha kuangamiza, kuua, au kuleta maangamizi. ‘Kuwaangamiza’ linadumisha ukali na upana wa hukumu katika mfano.
- source_word: τοὺς γεωργοὺς τούτους
  choice: wakulima hao wapangaji[a]
  rationale: Katika muktadha, γεωργοί ni watu waliolima shamba la mwingine kwa mpango wa upangaji. ‘Wakulima hao wapangaji’ linafafanua jukumu lao, huku ‘hao’ likirejelea kundi mahususi lililotajwa.
- source_word: δώσει
  choice: atawapa
  rationale: δίδωμι kwa msingi humaanisha ‘kutoa’ au ‘kupa.’ Muundo ‘atawapa wengine shamba’ ni wa kawaida katika Kiswahili na hauongezi maelezo kuhusu aina ya uhamisho.
- source_word: τὸν ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya ἀμπελών, ikihifadhi taswira ya mfano.
- source_word: ἄλλοις
  choice: wengine
  rationale: Tafsiri hii fupi inadumisha kutotajwa kwa utambulisho wa wale watakaopewa shamba.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: Lakini waliposikia hayo, wakasema
  rationale: Kirai tegemezi cha wakati kinaonyesha mwitikio wao baada ya kusikia tamko hilo; ‘lakini’ linawakilisha δέ na kuonyesha tofauti ya mwitikio wao.
- source_word: Μὴ γένοιτο
  choice: Jambo hilo lisitokee kamwe!
  rationale: Kauli hii ya hali ya kutakia inaonyesha kukataa kwa nguvu na kwa mshtuko. Tafsiri hii inahifadhi umbo la ombi au tamanio hasi na inaeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions:
- issue: Nguvu ya mwitikio Μὴ γένοιτο
  choice: Jambo hilo lisitokee kamwe!
  alternative: Hasha! / La hasha!
  rationale: Mwitikio huu ni kukataa kwa hisia tamko la hukumu lililotangulia, si kukanusha hoja tu. Tafsiri iliyochaguliwa inadumisha nguvu ya kutakia ya usemi wa Kigiriki bila kuamua zaidi maana ya mfano.
- issue: Utambulisho wa ‘wengine’
  choice: wengine
  alternative: watu wengine / wakulima wengine
  rationale: Kigiriki hakibainishi wazi watu hao ni nani wala hakirudii nomino ‘wakulima.’ Tafsiri inadumisha kutobainishwa huko na haingizi hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakulima hao wapangaji’ linaweka wazi hali yao ya kijamii bila kuacha taswira ya kilimo; ‘Jambo hilo lisitokee kamwe!’ linaonyesha mshtuko na ukataaji mkali kwa lugha ya kawaida lakini yenye uzito.
