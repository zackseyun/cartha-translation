  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: sw
  text: Wakati uliofaa, alimtuma mtumwa[a] kwa wakulima wa shamba la mizabibu ili wampe sehemu ya mazao ya shamba hilo. Lakini wakulima hao walimtuma aende zake baada ya kumpiga, mikono mitupu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki linaweza kutumiwa kwa mtumwa au mtumishi, lakini hapa “mtumwa” linaonyesha wazi zaidi kwamba alikuwa chini ya mamlaka ya bwana wake.
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “mtupu”; yaani, bila kupewa sehemu yoyote ya mazao ya shamba la mizabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: Wakati uliofaa
  rationale: Kirai hiki kinaonyesha wakati unaofaa au uliowekwa bila kuongeza wazi kwamba ulikuwa wakati wa mavuno.
- source_word: γεωργούς
  choice: wakulima wa shamba la mizabibu
  rationale: Neno γεωργοί linamaanisha wakulima; muktadha wa ἀμπελών unaweka wazi kwamba wanahusika na shamba la mizabibu, bila kulazimisha hadhi ya kisheria ya wapangaji.
- source_word: δοῦλον
  choice: mtumwa
  rationale: Neno δοῦλος hapa linaonyesha mtu aliye chini ya mamlaka ya bwana wake; ‘mtumwa’ linahifadhi wazi hali hiyo kuliko ‘mtumishi.’
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: sehemu ya mazao ya shamba hilo
  rationale: ἀπό pamoja na hali ya umilikishi ina maana ya kumpa kiasi kutoka katika mazao; ‘sehemu ya mazao’ ni Kiswahili cha kawaida bila kuongeza ukubwa au msingi wa kisheria wa sehemu hiyo.
- source_word: ἐξαπέστειλαν αὐτὸν δείραντες κενόν
  choice: walimpiga na kumrudisha mikono mitupu
  rationale: Tafsiri hii inahifadhi kupigwa kwake, kuondoshwa kwake, na ukweli kwamba hakupata chochote, kwa mpangilio wa asili wa Kiswahili.
