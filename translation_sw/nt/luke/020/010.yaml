translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Shamba la mizabibu’ linaeleweka kwa urahisi kuliko istilahi finyu, na ‘mikono mitupu’ ni nahau ya kawaida inayowasilisha κενόν kwa usahihi.
