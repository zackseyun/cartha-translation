  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: sw
  text: Baada ya kumtupa nje ya shamba la mizabibu, wakamuua. Basi, mwenye shamba la mizabibu[a] atawafanyia nini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana wa shamba la mizabibu.” Neno la Kigiriki ni kyrios, ambalo mara nyingi hutafsiriwa “Bwana” linapotumiwa kama cheo, lakini hapa linamaanisha mmiliki wa kibinadamu wa shamba katika mfano huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Baada ya kumtupa nje
  rationale: Muundo huu unaonyesha kwamba kwanza walimtoa kwa nguvu, kisha wakamuua. Kitenzi “kumtupa nje” kinahifadhi wazo la kufukuzwa au kutolewa kwa nguvu.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: nje ya shamba la mizabibu
  rationale: Hii inaonyesha mwendo kutoka ndani ya shamba hadi nje yake kwa Kiswahili cha kawaida.
- source_word: ἀπέκτειναν
  choice: wakamuua
  rationale: Kitenzi cha Kigiriki kinamaanisha moja kwa moja kuua; “wakamuua” hakiongezi maana mahususi ya mauaji ya kukusudia ambayo haijaelezwa wazi na kitenzi chenyewe.
- source_word: τί οὖν
  choice: Basi, ... nini?
  rationale: “Basi” linahifadhi uhusiano wa hitimisho au matokeo unaoonyeshwa na οὖν, huku swali likibaki la kawaida katika Kiswahili.
- source_word: ποιήσει ... αὐτοῖς
  choice: atawafanyia nini
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida tendo la ποιήσει na walengwa wake αὐτοῖς, yaani hatua atakayochukua dhidi yao au kwa habari yao.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: mwenye shamba la mizabibu
  rationale: Katika mfano huu κύριος humrejelea mmiliki wa kibinadamu wa shamba. “Mwenye shamba” huwasilisha maana hiyo kwa uwazi bila kuifanya moja kwa moja kuwa cheo cha kimungu.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος inapomhusu mhusika wa kibinadamu katika mfano
  choice: mwenye shamba la mizabibu
  alternative: bwana wa shamba la mizabibu
  rationale: Muktadha unamtambulisha κύριος kuwa mmiliki wa shamba ndani ya mfano. “Mwenye” huepuka kuwafanya wasomaji waone hapa cheo cha moja kwa moja cha kimungu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la neno, “bwana.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya kwanza inahifadhi mfuatano wa matendo, na swali la pili limetungwa kwa mpangilio wa kawaida wa Kiswahili.
