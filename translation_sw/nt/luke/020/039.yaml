  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: sw
  text: Ndipo baadhi ya waandishi wa sheria wakajibu, “Mwalimu, umesema vema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: wakajibu
  rationale: Kitenzi hiki kwa kawaida hutambulisha jibu la maneno; umbo la Kiswahili “wakajibu” linaunganisha tendo hilo kwa kawaida na simulizi.
- source_word: δέ
  choice: Ndipo
  rationale: δέ hapa ni kiunganishi hafifu cha kuendeleza simulizi; “Ndipo” kinaonyesha hatua inayofuata bila kuingiza mkazo mkubwa wa upinzani.
- source_word: τινες τῶν γραμματέων
  choice: baadhi ya waandishi wa sheria
  rationale: Muundo wa sehemu unaonyesha kwamba waliozungumza walikuwa baadhi tu ya kundi hilo, si wote.
- source_word: γραμματέων
  choice: waandishi wa sheria
  rationale: Katika muktadha wa Injili, neno hili linarejelea wataalamu wa Maandiko na sheria; “waandishi wa sheria” ni wazi kwa msomaji wa kisasa kuliko “waandishi” peke yake.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino katika hali ya kumwita mtu, na ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: καλῶς
  choice: vema
  rationale: “Vema” huwasilisha sifa kwa namna au usahihi wa kauli bila kulazimisha maana kuwa ya mtindo pekee au usahihi pekee.
- source_word: εἶπας
  choice: umesema
  rationale: Ingawa Kigiriki kina wakati uliopita sahili, “umesema” ni usemi wa kawaida wa Kiswahili katika kusifu kauli iliyotolewa muda huo na yenye umuhimu wa sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Waandishi wa sheria” limetumiwa kuweka wazi jukumu la γραμματεῖς katika muktadha huu.
