  text: ambao humeza mali za wajane, na kwa kisingizio husali kwa muda mrefu[a]. Hawa watapata hukumu kali zaidi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kujifanya” au “kama kisingizio.”
