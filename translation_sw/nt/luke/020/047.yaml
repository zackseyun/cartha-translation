lexical_decisions:
- source_word: κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν
  choice: humeza mali za wajane
  rationale: Kauli hii ni sitiari ya unyonyaji wa kikatili, si kula kihalisi. ‘Humeza’ inadumisha nguvu ya picha ya Kigiriki, huku ‘mali’ ikiwasilisha matumizi ya ‘nyumba’ kwa maana ya mali au riziki ya wajane katika Kiswahili cha kawaida.
- source_word: προφάσει
  choice: kwa kisingizio
  rationale: Neno hili linaonyesha sababu ya kujifanya au kinga ya uongo. ‘Kwa kisingizio’ hudumisha uwezekano kwamba sala hizo ndefu zilikuwa pazia la kuficha unyonyaji, bila kubainisha zaidi ya maandishi.
- source_word: μακρὰ προσεύχονται
  choice: kusali sala ndefu
  rationale: Huwasilisha kwa njia ya kawaida ya Kiswahili wazo la kusali kwa muda mrefu.
- source_word: λήμψονται
  choice: watapata
  rationale: Kitenzi kinaonyesha matokeo yatakayowafikia. ‘Watapata’ ni cha kawaida na wazi katika muktadha wa hukumu.
- source_word: περισσότερον κρίμα
  choice: hukumu kali zaidi
  rationale: ‘Hukumu’ huhifadhi upana wa κρίμα, na ‘kali zaidi’ huonyesha kwamba adhabu ya hukumu hiyo itakuwa nzito zaidi bila kubadili neno kuwa ‘hukumu ya hatia’ moja kwa moja.
theological_decisions:
- issue: Maana ya κρίμα katika muktadha
  choice: hukumu
  alternative: hukumu ya hatia
  rationale: Muktadha unaonyesha wazi kuwa ni hukumu mbaya ya Mungu, lakini ‘hukumu’ hudumisha upana wa neno la Kigiriki badala ya kulifafanua kwa namna finyu zaidi.
- issue: Uhusiano wa sala ndefu na unyonyaji
  choice: kusali sala ndefu kwa kisingizio
  alternative: kusali sala ndefu ili waonekane kuwa wema
  rationale: Kigiriki hakisemi wazi kama sala ni kisingizio cha kuficha unyonyaji au maonyesho ya unafiki kwa ujumla; tafsiri hii inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kama kishazi tegemezi kutoka mstari uliotangulia. ‘Humeza mali za wajane’ ni sitiari inayoeleweka kwa urahisi na inadumisha ukali wa shutuma.
