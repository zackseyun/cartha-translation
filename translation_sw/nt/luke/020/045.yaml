  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: sw
  text: 'Na watu wote walipokuwa wakisikiliza[a], aliwaambia wanafunzi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu wote walipokuwa wakisikiliza, aliwaambia wanafunzi.” Kigiriki kinatumia muundo wa kisarufi unaoonyesha hali iliyokuwapo wakati aliposema.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: walipokuwa wakisikiliza
  rationale: Kitenzi shirikishi cha wakati uliopo katika muundo wa genitive absolute kinaonyesha tendo lililokuwa likiendelea wakati Yesu aliposema. Muundo huu wa Kiswahili unaweka wazi mazingira hayo bila kuongeza kitu kilichosikilizwa ambacho hakijatajwa katika Kigiriki.
- source_word: δὲ
  choice: Na
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani. “Na” ni tafsiri ya kawaida na nyepesi katika muktadha huu.
- source_word: παντὸς τοῦ λαοῦ
  choice: watu wote
  rationale: Kirai hiki kinamaanisha watu kama jumuiya nzima. “Watu wote” ni Kiswahili cha kawaida na hakibadili λαός kuwa umati tu.
- source_word: εἶπεν
  choice: aliwaambia
  rationale: Ingawa εἶπεν kimsingi ni “alisema,” Kiswahili hutumia kwa kawaida “aliwaambia” inapofuatiwa na walengwa wa usemi; maana ya kusema kwa wanafunzi inahifadhiwa.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: “Wanafunzi” ndiyo tafsiri ya kawaida ya μαθηταί katika Injili. Hakijaongezwa kimilikishi “wake,” kwa kuwa hakipo wazi katika Kigiriki.
theological_decisions:
- issue: Tofauti kati ya wasikilizaji waliokuwapo na walioelekezewa maneno moja kwa moja
  choice: Yesu aliwaambia wanafunzi huku watu wote wakisikiliza.
  alternative: Yesu aliwaambia watu wote moja kwa moja, au alizungumza na wanafunzi faraghani mbali na watu.
  rationale: Muundo wa “watu wote walipokuwa wakisikiliza” unaonyesha mazingira ya hadhara, lakini “wanafunzi” ndio waliolengwa moja kwa moja na usemi. Tafsiri inahifadhi tofauti hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili; unaendeleza simulizi kwa “Na” na kuhifadhi hali ya tendo la kusikiliza lililokuwa likiendelea.
