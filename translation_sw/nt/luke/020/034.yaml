  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: sw
  text: Na Yesu akawaambia, “Wana wa enzi hii[a] huoa na huolewa,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu wa enzi hii.” Kigiriki ni “Wana wa enzi hii,” usemi wa kiume wa uwakilishi unaomaanisha watu wa enzi ya sasa kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinadumisha uhusiano rahisi wa simulizi huku kikimtaja Yesu kama mhusika anayefuata kusema.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa tendo la Yesu kusema kwa wale waliokuwa wakizungumza naye, bila kuongeza maana mahsusi ya ‘kujibu’ ambayo kitenzi chenyewe hakilazimishi.
- source_word: Οἱ υἱοὶ
  choice: Wana
  rationale: ‘Wana’ huhifadhi taswira ya Kigiriki ya ‘wana’ kama usemi wa uwakilishi unaomaanisha watu walio wa kundi au hali fulani; tanbihi inaeleza kwamba hauwahusu wanaume peke yao.
- source_word: τοῦ αἰῶνος τούτου
  choice: wa enzi hii
  rationale: ‘Enzi hii’ huhifadhi maana ya αἰών kama kipindi au utaratibu wa sasa, na pia tofauti yake na enzi ijayo katika muktadha.
- source_word: γαμοῦσιν
  choice: huoa
  rationale: ‘Huoa’ ni usemi wa kawaida wa Kiswahili unaowakilisha kitenzi tendaji cha kuingia katika ndoa na kudumisha tofauti yake na kitenzi kinachofuata.
- source_word: γαμίσκονται
  choice: kuolewa
  rationale: ‘Kuolewa’ huhifadhi umbo la kutendwa na jozi ya misemo ya chanzo, kwa Kiswahili cha kawaida na kinachoeleweka.
theological_decisions:
- issue: Usemi wa kijinsia unaotumiwa kwa maana ya uwakilishi
  choice: Wana wa enzi hii
  alternative: Watu wa enzi hii; walio wa enzi hii
  rationale: Kigiriki kimetumia nomino ya kiume ya wingi υἱοί, lakini katika kauli hii inawakilisha watu wa enzi ya sasa kwa ujumla. Tafsiri inadumisha taswira ya chanzo, huku tanbihi ikizuia isieleweke kuwa inawahusu wanaume pekee.
- issue: αἰών kama dhana ya kieskatolojia
  choice: enzi hii
  alternative: ulimwengu huu
  rationale: ‘Enzi’ hudumisha tofauti kati ya utaratibu wa sasa na enzi ijayo, ambayo ni muhimu katika hoja ya Yesu katika mistari inayofuata; ‘ulimwengu’ ingeweza kueleweka hasa kama mahali au uumbaji wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wana wa enzi hii’ kina ladha ya kifasihi inayofaa matini ya Biblia; tanbihi inafafanua maana yake ya uwakilishi. Jozi ‘huoa na kuolewa’ ni ya asili katika Kiswahili na inadumisha tofauti ya kauli tendaji na tendwa katika Kigiriki.
