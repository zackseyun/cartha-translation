lexical_decisions:
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na Kiswahili sanifu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na nukuu na hoja iliyotangulia.
- source_word: αὐτὸν κύριον
  choice: anamwita “Bwana”
  rationale: Kiambishi cha yambwa -mw- kinawakilisha αὐτόν, na “Bwana” huhifadhi uzito wa κύριος katika hoja hii kuhusu Masihi.
- source_word: καλεῖ
  choice: anamwita
  rationale: Wakati uliopo na maana ya moja kwa moja ya kitenzi zimehifadhiwa kwa Kiswahili cha kawaida.
- source_word: καὶ πῶς
  choice: basi, inakuwaje
  rationale: Hili linaendeleza hoja kama swali la balagha kwa njia ya asili katika Kiswahili, huku καί ikifanya kazi ya kuunganisha hitimisho hilo.
- source_word: αὐτοῦ υἱός
  choice: mwana wake
  rationale: Tafsiri hii huhifadhi neno la wazi υἱός na mvutano wa hoja; maana pana ya uzao haijaingizwa katika matini kuu.
- source_word: ἐστιν
  choice: awe
  rationale: Katika muundo wa Kiswahili “inakuwaje awe,” hali hii huwasilisha kwa ufasaha swali la Kigiriki kuhusu jinsi anavyokuwa mwana wake.
theological_decisions:
- issue: Tafsiri ya κύριος katika hoja kuhusu Masihi
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida na yenye uzito unaofaa kwa cheo ambacho Daudi anampa Masihi, bila kuongeza ufafanuzi usio katika mstari.
- issue: Iwapo υἱός ipanuliwe kuwa “mzao”
  choice: mwana wake
  alternative: mzao wake
  rationale: Kigiriki kinasema wazi “mwana”; kuacha neno hilo katika matini kuu kunahifadhi mvutano wa swali la Yesu, huku maana ya ukoo ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “inakuwaje awe” unasikika wa kawaida katika swali la balagha, na alama [a] imewekwa baada ya kirai kinachohusika, “mwana wake.”
