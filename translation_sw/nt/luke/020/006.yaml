  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: sw
  text: Lakini tukisema, ‘Ilitoka kwa wanadamu,’ watu wote watatupiga kwa mawe, kwa maana wana hakika kwamba Yohana alikuwa nabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba Yohana ni nabii.” Umbo la infinitivu katika Kigiriki halibainishi wakati kwa njia ya moja kwa moja; muktadha unaweza kuruhusu namna zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Lakini tukisema
  rationale: Muundo wa ἐὰν pamoja na kitenzi cha hali tegemezi unaonyesha uwezekano wa sharti; “tukisema” ni wa kawaida katika Kiswahili, na “lakini” huhifadhi nguvu ya δέ katika muktadha.
- source_word: Ἐξ ἀνθρώπων
  choice: Ilitoka kwa wanadamu
  rationale: Kauli ya Kigiriki imefupishwa kwa kurejelea chanzo cha ubatizo wa Yohana. Kuongeza “ilitoka” hufanya sentensi iwe ya kawaida na wazi kwa Kiswahili bila kubadili maana; “wanadamu” hudumisha tofauti na chanzo cha mbinguni.
- source_word: ὁ λαὸς ἅπας
  choice: watu wote
  rationale: Hutoa kwa kawaida maana ya kundi lote la watu na nguvu jumuishi ya ἅπας.
- source_word: καταλιθάσει ἡμᾶς
  choice: watatupiga kwa mawe
  rationale: Hii ni njia ya kawaida ya Kiswahili kueleza kupigwa kwa mawe, bila kuongeza wazi “hadi kufa,” jambo ambalo halijasemwa moja kwa moja katika mstari huu.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: kwa maana wana hakika
  rationale: Ingawa Kigiriki hutumia umbo la umoja likirejelea kundi, Kiswahili hutumia wingi kwa kawaida pamoja na “watu wote.” “Wana hakika” huonyesha usadikisho thabiti.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: kwamba Yohana alikuwa nabii
  rationale: Muundo wa kiarifu wenye kitenzi-jina umetolewa kama kishazi kamili cha Kiswahili. “Alikuwa” hufaa katika simulizi linalomrejelea Yohana, huku kutokubainishwa kwa wakati katika εἶναι kukielezwa katika tanbihi.
theological_decisions:
- issue: Wakati wa tathmini ya watu kuhusu Yohana
  choice: kwamba Yohana alikuwa nabii
  alternative: kwamba Yohana ni nabii
  rationale: Kitenzi-jina εἶναι hakibainishi wakati chenyewe. “Alikuwa nabii” ni cha kawaida katika muktadha wa simulizi na hakikanushi hadhi ya Yohana; chaguo la wakati wa sasa limehifadhiwa katika tanbihi ili kutatua kimya kimya utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Kauli “Ilitoka kwa wanadamu” huweka wazi kijalizo kilichodokezwa na Kigiriki na huhifadhi ulinganifu wa chanzo cha ubatizo katika muktadha.
