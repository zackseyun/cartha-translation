  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: sw
  text: Lakini kwamba wafu wanafufuliwa, hata Musa alionyesha katika sehemu inayohusu kichaka[a], anapomwita Bwana[b] kuwa Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kichaka.” Usemi wa Kigiriki unaweza kutaja tukio lenyewe au, kama nahau, sehemu ya Maandiko inayohusu kichaka kinachowaka moto (Kutoka 3).
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Bwana.” Hii inaakisi desturi ya Septuajinti ya kulitafsiri jina la Mungu katika Kutoka 3 kwa neno “Bwana.”'
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: wanafufuliwa
  rationale: Kitenzi hiki kiko katika hali ya kutendwa na katika muktadha huu kinahusu ufufuo; “wanafufuliwa” huhifadhi wazo la tendo linalofanywa kwa wafu bila kumtaja mtendaji ambaye hakutajwa wazi katika sentensi.
- source_word: οἱ νεκροὶ
  choice: wafu
  rationale: Ni Kiswahili cha kawaida na chenye maana ya kijumla kwa kivumishi cha Kigiriki kilichotumiwa kama nomino.
- source_word: ἐμήνυσεν
  choice: alionyesha
  rationale: Huwasilisha maana ya kufanya jambo lijulikane au kulithibitisha kwa ushahidi, bila kulifanya kuwa tangazo rasmi kupita maana ya Kigiriki.
- source_word: ἐπὶ τῆς βάτου
  choice: katika sehemu inayohusu kichaka
  rationale: Usemi huu unaweza kutaja sehemu ya Maandiko kuhusu kichaka, kama ilivyo desturi ya kutaja kifungu kwa mada yake; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: ὡς λέγει
  choice: anapomwita
  rationale: Muundo unaofuata unamtaja Bwana kuwa Mungu wa Abrahamu, Isaka, na Yakobo; “anapomwita” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: κύριον
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo κύριος katika muktadha wa Mungu na inaakisi maneno ya tafsiri ya Kigiriki ya Kutoka 3.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo
  rationale: Kurudia “Mungu” kunahifadhi msisitizo na mdundo wa Kigiriki pamoja na dondoo la Kutoka.
theological_decisions:
- issue: Lugha ya ufufuo katika hoja ya Yesu dhidi ya Masadukayo
  choice: wafu wanafufuliwa
  alternative: wafu wanafufuka
  rationale: “Wanafufuliwa” huakisi hali ya kutendwa ya Kigiriki na hudokeza tendo la Mungu bila kuongeza maelezo yasiyosemwa na maandishi.
- issue: Tafsiri ya κύριος katika dondoo linalomhusu Mungu wa Israeli
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κύριον, si jina la Kiebrania lenyewe; kwa hiyo “Bwana” linatunza ushahidi wa maandishi, huku uhusiano na jina la Mungu katika Kutoka 3 ukielezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa maneno umefanywa wa asili kwa Kiswahili, huku hali ya kutendwa katika “wanafufuliwa,” urudiaji wa “Mungu,” na uwezekano wa maana mbili wa usemi kuhusu kichaka vikihifadhiwa. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
