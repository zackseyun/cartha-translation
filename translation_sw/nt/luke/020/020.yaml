  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: sw
  text: Nao, baada ya kumfuatilia kwa makini, wakatuma wapelelezi waliojifanya kuwa waadilifu, ili wamnase kwa neno atakalosema[a], na hivyo wamkabidhi kwa utawala na mamlaka ya gavana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, ‘wakamate kwa neno lake’ au ‘walishike neno lake.’
    reason: lexical_alternative
  - marker: b
    text: Au, ‘wamkabidhi kwa mamlaka ya utawala na mamlaka ya gavana.’ Maneno haya mawili kwa pamoja huenda yanakazia utawala rasmi na uwezo wa gavana wa kutenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: baada ya kumchunguza kwa makini
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kutumwa kwa wapelelezi; ‘kumchunguza kwa makini’ pia hudokeza uangalizi wenye nia mbaya katika muktadha huu.
- source_word: ἐγκαθέτους
  choice: wapelelezi
  rationale: Neno hili humaanisha watu waliowekwa kwa siri ili kumnasa mtu; ‘wapelelezi’ ni la kawaida na linaonyesha kazi yao ya kujificha.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: waliojifanya kuwa watu wenye haki
  rationale: Huhifadhi udanganyifu wa kujionyesha kwao pamoja na uzito wa kimaadili na kidini wa δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: ili wamnase kwa jambo atakalosema
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya nahau ya kumtega mtu kwa msingi wa kauli yake bila kupoteza kusudi la kisheria la mtego huo.
- source_word: ὥστε
  choice: na hivyo
  rationale: Huonyesha matokeo yaliyokusudiwa ya kumnasa kwa kauli yake.
- source_word: παραδοῦναι
  choice: wamkabidhi
  rationale: Ni usemi wa kawaida wa kumtia mtu mikononi mwa mamlaka nyingine katika muktadha wa uhasama au mashtaka.
- source_word: τῇ ἀρχῇ
  choice: chini ya utawala
  rationale: Hapa ἀρχή ni utawala au mamlaka rasmi, si mwanzo; ‘utawala’ hulitofautisha kwa kiasi na ἐξουσία linalofuata.
- source_word: τῇ ἐξουσίᾳ
  choice: mamlaka
  rationale: Huhifadhi wazo la haki au uwezo rasmi wa kutawala na kuchukua hatua.
- source_word: τοῦ ἡγεμόνος
  choice: ya gavana
  rationale: ‘Gavana’ ni neno linaloeleweka kwa afisa mkuu wa utawala wa mkoa katika mazingira ya Kirumi.
theological_decisions:
- issue: Tafsiri ya δίκαιος katika muktadha wa kujifanya kuwa na hadhi njema ya kimaadili
  choice: watu wenye haki
  alternative: waadilifu
  rationale: ‘Wenye haki’ huhifadhi uzito wa kimaadili na kidini wa neno hilo, badala ya kulifanya lieleweke tu kuwa uaminifu wa kawaida, huku muktadha ukionyesha wazi kwamba walikuwa wakijifanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida, huku istilahi mbili ἀρχή na ἐξουσία zikitofautishwa kama ‘utawala’ na ‘mamlaka.’
