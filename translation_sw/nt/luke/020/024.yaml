  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: sw
  text: “Nionyesheni dinari.[a] Ina picha na maandishi ya nani?” Wakajibu, “Ya Kaisari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa sarafu ya Roma iliyotumiwa sana wakati huo; jina lake limehifadhiwa ili kuonyesha mazingira ya kihistoria.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Nionyesheni
  rationale: Amri hii ya moja kwa moja inaelezwa kwa Kiswahili cha kawaida na kuhifadhi wingi wa wanaoagizwa.
- source_word: δηνάριον
  choice: dinari
  rationale: Jina la sarafu limehifadhiwa ili kudumisha usahihi na mazingira ya kihistoria badala ya kulifanya kuwa ‘sarafu’ kwa ujumla.
- source_word: τίνος ἔχει
  choice: Ina ... ya nani?
  rationale: Muundo huu ni wa asili katika Kiswahili na unauliza sura na maandishi hayo yanamhusu nani.
- source_word: εἰκόνα
  choice: sura
  rationale: Katika muktadha wa sarafu, ‘sura’ hueleweka kwa kawaida kuwa mfano wa uso au picha ya mtu, bila kupanua maana kupita kiasi.
- source_word: ἐπιγραφήν
  choice: maandishi
  rationale: ‘Maandishi’ ni neno la kawaida na wazi kwa maneno yaliyoandikwa au kuchongwa juu ya sarafu.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Wakajibu
  rationale: Kitenzi hiki kinaunganisha kishiriki na kitenzi cha kusema kwa Kiswahili fasaha bila kurudia ‘wakajibu wakasema.’
- source_word: Καίσαρος
  choice: Ya Kaisari
  rationale: Jibu fupi la Kigiriki katika hali ya umilikishi limehifadhiwa kwa jibu la asili la Kiswahili linalolingana na swali ‘ya nani?’
