  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: sw
  text: Lakini wale wakulima wa mizabibu[a] walipomwona, walishauriana wao kwa wao, wakisema, “Huyu ndiye mrithi. Tumuue, ili urithi upate kuwa wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapangaji” au “wakulima.” Neno la Kigiriki humaanisha wakulima au walimi; katika mfano huu ni wale wanaolima shamba la mizabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: wakulima wa mizabibu
  rationale: Neno hilo linamaanisha wafanyakazi wa kilimo; katika muktadha wa mfano huu wanalima shamba la mizabibu. Tafsiri hii inaweka wazi muktadha bila kufanya wazo la upangaji kuwa maana ya moja kwa moja ya nomino.
- source_word: διελογίζοντο
  choice: walijadiliana
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha mashauriano ya kimakusudi kati yao. “Walijadiliana” ni Kiswahili cha kawaida na hakiongezi wazo la ugomvi.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Kirai hiki kinaonyesha tendo la kurudiana kati ya wahusika na kinaendana kwa kawaida na “walijadiliana.”
- source_word: κληρονόμος
  choice: mrithi
  rationale: “Mrithi” ni neno la kawaida na sahihi kwa mtu mwenye haki ya kupokea urithi.
- source_word: ἀποκτείνωμεν
  choice: Na tumuue
  rationale: Hii ni subjunktivu ya kuhimiza katika nafsi ya kwanza wingi. “Na tumuue” hutoa pendekezo hilo moja kwa moja bila kuongeza hukumu ya kimaadili isiyomo ndani ya kitenzi chenyewe.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: ili urithi uwe wetu
  rationale: “Ili” huhifadhi kusudi la ἵνα, na “uwe wetu” ni njia ya kawaida ya Kiswahili ya kueleza kwamba urithi huo ufikie kuwa mali yao.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaendeleza simulizi huku ikionyesha badiliko lenye utofautishaji mdogo baada ya mwana kuwasili.
- source_word: ἰδόντες
  choice: walipomwona
  rationale: Partisipio ya aoristi imetafsiriwa kama kishazi cha wakati, ambacho ni cha asili katika Kiswahili na kinaonyesha kwamba mashauriano yalifuata baada ya kumwona.
theological_decisions:
- issue: Istilahi ya γεωργοὶ katika mfano wa shamba la mizabibu
  choice: wakulima wa mizabibu
  alternative: wapangaji; wakulima
  rationale: Tafsiri inafuata maana ya msingi ya neno la Kigiriki na muktadha wa shamba la mizabibu. Mistari inayozunguka inaonyesha kwamba walikabidhiwa shamba, lakini nomino yenyewe hapa haisemi moja kwa moja “wapangaji”; hivyo maana hiyo haijaingizwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “walijadiliana wao kwa wao” huhifadhi wazo la mashauriano, na “Na tumuue” hutoa himizo la pamoja kwa njia ya moja kwa moja.
