  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: sw
  text: Jihadharini na waandishi wa sheria[a], wanaotaka kutembea huku na huku wakiwa wamevaa mavazi marefu[b], na wanaopenda salamu za heshima masokoni, viti vya heshima masinagogini[c], na nafasi za heshima kwenye karamu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jilindeni na waandishi wa sheria.”
    reason: lexical_alternative
  - marker: b
    text: “Mavazi marefu” hapa ni mavazi ya kujionyesha yaliyoweza kuashiria hadhi ya mtu.
    reason: cultural_note
  - marker: c
    text: Au, “viti vya mbele” au “viti vikuu” masinagogini.
    reason: lexical_alternative
  - marker: d
    text: Au, “nafasi bora” au “nafasi kuu” kwenye karamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Jihadharini na
  rationale: Muundo huu wa onyo unawataka wasikilizaji wajilinde dhidi ya kundi linalotajwa. “Jihadharini na” ni Kiswahili cha kawaida kinachohifadhi nguvu ya amri.
- source_word: γραμματέων
  choice: waandishi wa sheria
  rationale: Katika muktadha wa Injili, neno hili linataja wataalamu wa kunakili, kufafanua na kufundisha Sheria; “waandishi wa sheria” ni wazi zaidi kwa msomaji wa kawaida kuliko “waandishi” pekee bila kupanua maana kuwa walimu wote.
- source_word: τῶν θελόντων περιπατεῖν
  choice: wanaotaka kutembea huku na huku
  rationale: “Wanaotaka” huhifadhi maana ya hiari au tamaa katika θελόντων, na “kutembea huku na huku” huonyesha kujionyesha hadharani bila kulifanya wazo hilo kuwa ufafanuzi wa moja kwa moja.
- source_word: ἐν στολαῖς
  choice: wakiwa wamevaa mavazi marefu
  rationale: στολαί ni mavazi marefu yenye hadhi; tafsiri hii inaeleweka kwa urahisi na dokezo la hadhi linafafanuliwa katika tanbihi.
- source_word: φιλούντων ἀσπασμοὺς
  choice: wanaopenda kusalimiwa kwa heshima
  rationale: Salamu zinazokusudiwa hapa ni za kutambuliwa na kuheshimiwa hadharani. “Kusalimiwa kwa heshima” huwasilisha maana hiyo kwa kawaida kuliko “salamu” pekee.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: masokoni
  rationale: ἀγοραί ni maeneo ya soko yaliyokuwa pia sehemu za mikutano ya hadhara; “masokoni” ni sahili na ya kawaida katika Kiswahili.
- source_word: πρωτοκαθεδρίας
  choice: viti vya heshima
  rationale: Neno linamaanisha viti vya hadhi ya juu katika sinagogi, si lazima viti vilivyo bora kwa starehe; “viti vya heshima” huhifadhi maana ya hadhi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: masinagogini
  rationale: Ni tafsiri ya moja kwa moja ya mahali, kwa kutumia istilahi ya kawaida ya Kiswahili “sinagogi.”
- source_word: πρωτοκλισίας
  choice: nafasi za heshima
  rationale: Neno linataja mahali pa hadhi ya juu wakati wa mlo. “Nafasi za heshima” huwasilisha kazi yake ya kijamii bila kuingiza desturi ya kisasa ya meza kuu.
- source_word: ἐν τοῖς δείπνοις
  choice: kwenye karamu
  rationale: Katika muktadha huu δείπνα ni milo au karamu rasmi ambako nafasi ziliashiria hadhi; “karamu” inafaa kwa mazingira hayo.
theological_decisions:
- issue: Onyo dhidi ya waandishi wa sheria na upeo wa ukosoaji
  choice: 'Aya imetafsiriwa kama onyo dhidi ya waandishi wa sheria wanaotambulishwa kwa tabia zinazofuata: kujionyesha kwa mavazi na kutafuta heshima ya hadhara.'
  alternative: Kuitafsiri kama hukumu ya jumla dhidi ya kila mwandishi wa sheria, au kama ukosoaji wa mavazi yao pekee.
  rationale: Kigiriki kinataja “waandishi wa sheria” na kisha kinawafafanua kwa virai vya tabia zao. Tafsiri inadumisha ukali wa onyo bila kuongeza dai kwamba kila mtu wa kundi hilo alikuwa na tabia hizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha mfululizo wa virai vya Kigiriki huku ikitumia miundo ya kawaida ya Kiswahili. Maneno “kwa heshima,” “viti vya heshima,” na “nafasi za heshima” yanaweka wazi mada ya kutafuta hadhi bila kuongeza hukumu isiyosemwa katika chanzo.
