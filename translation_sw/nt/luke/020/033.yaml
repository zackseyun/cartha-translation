base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: sw
  text: Basi, katika ufufuo[a], huyo mwanamke atakuwa mke wa nani kati yao?[b] Kwa maana wale saba walimwoa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa ufufuo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “huyo mwanamke atakuwa mke wa yupi kati yao?”
    reason: lexical_alternative
  - marker: c
    text: Yaani, “wale saba walikuwa na huyo mwanamke kama mke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: huyo mwanamke
  rationale: Katika kutajwa kwa kwanza, γυνή humrejelea mwanamke anayezungumziwa katika kisa kilichotangulia; maana ya ndoa inawekwa wazi baadaye kwa neno “mke.” Kionyeshi “huyo” kinaendeleza rejeleo hilo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: basi
  rationale: “Basi” linaonyesha hatua ya hitimisho katika hoja ya Masadukayo bila kuifanya iwe na nguvu ya kimantiki kuliko ilivyo katika Kigiriki.
- source_word: ἐν τῇ ἀναστάσει
  choice: katika ufufuo
  rationale: Tafsiri hii inafuata muundo wa kirai cha Kigiriki na haiongezi maneno “wa wafu,” ambayo hayamo katika mstari huu.
- source_word: τίνος αὐτῶν
  choice: wa nani kati yao
  rationale: 'Muundo huu unaonyesha uhusiano unaoulizwa na kimilikishi cha Kigiriki: ni mke wa nani miongoni mwa wale saba.'
- source_word: γίνεται
  choice: atakuwa
  rationale: Katika swali hili la hali inayodhaniwa wakati wa ufufuo, wakati ujao ni wa kawaida katika Kiswahili. Unawasilisha hali itakayotokea bila kupunguza kitenzi kuwa utambulisho wa sasa.
- source_word: γυνή
  choice: mke
  rationale: Katika nafasi hii maana ya kindoa ya γυνή iko wazi; “mke” ndiyo tafsiri inayohitajika.
- source_word: οἱ γὰρ ἑπτὰ
  choice: kwa maana wale saba
  rationale: “Wale saba” inarejelea ndugu saba waliotajwa katika muktadha na kudumisha kifungu chenye kibainishi bila kuongeza neno linalolingana na “wote.”
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: walikuwa naye kama mke wao
  rationale: Tafsiri hii inalenga hali ya kuwa naye katika uhusiano wa ndoa, kama ilivyo katika ἔχω pamoja na kirai cha kiarifu, badala ya kuhamishia mkazo kwa tendo la kumwoa.
theological_decisions:
- issue: Maana ya lugha ya ufufuo katika swali la Masadukayo
  choice: Kutafsiri ἀνάστασις moja kwa moja kuwa “ufufuo” bila ufafanuzi wa ziada.
  alternative: “ufufuo wa wafu”
  rationale: Mstari wenyewe unasema tu ἀναστάσει. Kutoongeza “wa wafu” kunahifadhi namna Masadukayo walivyoweka hoja yao na hakutatui mvutano wa kiteolojia kwa kuingiza maneno kutoka muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni wa kawaida kwa wasomaji wengi, huku “walikuwa naye kama mke wao” ukihifadhi kwa karibu hali ya uhusiano iliyo katika Kigiriki; tanbihi inatoa usemi wa kawaida zaidi unaosisitiza tendo la kuoa.
