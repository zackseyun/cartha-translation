  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: sw
  text: Kila mtu atakayeanguka juu ya jiwe lile atavunjika vipande-vipande[a]; lakini yeyote ambaye jiwe hilo litamwangukia, litamponda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atasambaratishwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “litamsaga kuwa unga” au “litamtawanya kama makapi”; kitenzi cha Kigiriki kina maana yenye nguvu zaidi kuliko kugongwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Kila mtu anayeanguka
  rationale: Kirai chenye participio pamoja na kibainishi kinarejelea kwa ujumla kila mtu anayefanya tendo hilo. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha upeo wa maana.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: juu ya jiwe lile
  rationale: ἐπί pamoja na hali ya akusativi baada ya πίπτω huonyesha mwendo unaoishia juu ya jiwe; “lile” inadumisha nguvu ya kiashiria ἐκεῖνον.
- source_word: συνθλασθήσεται
  choice: atavunjika vipande-vipande
  rationale: Kitenzi cha wakati ujao katika kauli ya kutendwa kinaonyesha kuvunjwa vibaya au kusambaratishwa. Kiswahili hiki kinaonyesha matokeo makali bila kuongeza namna maalumu ya kuvunjwa.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: lakini yeyote ambaye jiwe hilo litamwangukia
  rationale: 'Kirai cha uhusiano chenye ἄν na hali ya utegemezi huonyesha hali isiyo na mhusika maalumu: yeyote ambaye linaweza kumwangukia. Kutaja “jiwe hilo” huleta uwazi wa kawaida katika Kiswahili bila kubadili rejeleo.'
- source_word: λικμήσει
  choice: litamponda
  rationale: λικμάω inaweza kumaanisha kuponda au kupepeta na kutawanya. “Litamponda” ni wazi na yenye nguvu katika taswira hii ya hukumu, huku maana nyingine zinazowezekana zikihifadhiwa katika tanbihi.
- source_word: αὐτόν
  choice: -m- katika “litamponda”
  rationale: Kiwakilishi cha Kigiriki ni umoja wa kiume na kinamrejelea mtu aliyetajwa kwa ujumla. Kiambishi cha yambwa -m- ni njia ya asili ya Kiswahili ya kudumisha rejeleo hilo la mtu mmoja.
theological_decisions:
- issue: Taswira ya jiwe kama chombo cha hukumu
  choice: Kudumisha jiwe kama chombo cha hukumu kali na yenye kuangamiza bila kupunguza nguvu ya sitiari.
  alternative: Kutafsiri kwa upole zaidi kana kwamba ni kujikwaa au kujeruhiwa tu.
  rationale: Katika muktadha, jiwe la nukuu iliyotangulia ni taswira ya hukumu ya mwisho. Vitenzi συνθλασθήσεται na λικμήσει vina nguvu kali, kwa hiyo tafsiri haivilegezi wala kuongeza ufafanuzi wa kiteolojia usiomo katika mstari.
- issue: Rejeleo la mtu mmoja wa kijumla
  choice: Kutumia “yeyote” na kiambishi cha umoja cha mtu -m-.
  alternative: Kutumia muundo wa wingi ili kusisitiza ujumuishi.
  rationale: Kigiriki kinatumia rejeleo la umoja lenye maana ya kijumla. Kiswahili hutumia “yeyote” na upatanisho wa umoja kwa kawaida na kwa usahihi bila kulazimisha jinsia isiyowekwa wazi na sarufi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unadumisha ulinganifu wa vifungu viwili, huku marudio ya “jiwe hilo” yakihakikisha rejeleo lililo wazi na la kawaida kwa msomaji.
