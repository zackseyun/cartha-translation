id: LUK.20.1
reference: Luke 20:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: sw
  text: Ikawa kwamba, siku moja katika siku hizo, Yesu alipokuwa akiwafundisha watu Hekaluni[a] na kuwatangazia habari njema[b], makuhani wakuu na waandishi, pamoja na wazee, wakamjia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linamaanisha eneo lote la Hekalu, si jengo la patakatifu pa ndani pekee.
    reason: cultural_note
  - marker: b
    text: Au, “kuwahubiria Injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha masimulizi katika Luka. “Ikawa” kinahifadhi mpito huo kwa ufupi bila kutumia lugha ndefu ya kizamani.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: siku moja katika siku hizo
  rationale: Kinadumisha maana ya siku moja isiyotajwa wazi ndani ya mfululizo wa siku unaozungumziwa.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: Yesu alipokuwa akiwafundisha watu
  rationale: Muundo wa sentensi unaonyesha tendo lililokuwa likiendelea wakati viongozi walipofika. Jina “Yesu” limetumiwa badala ya kiwakilishi ili rejeo liwe wazi katika mstari unaosomwa peke yake.
- source_word: ἐν τῷ ἱερῷ
  choice: Hekaluni
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa mahali pa shughuli hii; tanbihi inaeleza kwamba neno la Kigiriki linamaanisha eneo lote la Hekalu, si patakatifu pa ndani pekee.
- source_word: εὐαγγελιζομένου
  choice: kuwatangazia habari njema
  rationale: Kinahifadhi maana ya kitendo cha kutangaza habari njema kwa lugha inayoeleweka, bila kulifanya neno hilo kuwa istilahi ya kikanisa tu.
- source_word: ἐπέστησαν
  choice: wakamjia
  rationale: Kitenzi kinaonyesha kuwa walifika moja kwa moja mahali alipokuwa Yesu. “Wakamjia” ni cha asili na hakiongezi waziwazi wazo la uhasama ambalo muktadha huu bado haujalitamka.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unamaanisha kundi la uongozi wa kikuhani, wala si kwamba kulikuwa na makuhani wakuu wengi wenye cheo kilekile cha kuhani mkuu.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Hili ni jina la kihistoria la kundi hilo na ni tafsiri ya moja kwa moja, huku maelezo ya kazi yao kama wataalamu wa Sheria yakibaki katika muktadha mpana.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: pamoja na wazee
  rationale: Kinahifadhi kwa wazi wazo la kuandamana na ushirika wa makundi haya ya viongozi.
theological_decisions:
- issue: Maana ya εὐαγγελιζομένου katika maelezo ya huduma ya Yesu kwa umma
  choice: kuwatangazia habari njema
  alternative: kuwahubiria Injili
  rationale: Chaguo hili linaonyesha tendo la Yesu la kutangaza habari njema bila kulazimisha istilahi ya baadaye ya kikanisa; pia linadumisha maana ya kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa masimulizi ya Luka na imeepuka lugha nzito au istilahi za kimadhehebu.
