  text: Was John's baptism from heaven or from men?[a]
translation:
  language: sw
  text: Je, ubatizo wa Yohana ulitoka mbinguni[a] au ulitoka kwa wanadamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulitoka kwa Mungu”; kwa Kigiriki, “kutoka mbinguni,” usemi wa heshima unaoonyesha asili au mamlaka ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ubatizo
  rationale: Nomino hii inarejelea ibada au tendo la ubatizo lililohusishwa na Yohana; “ubatizo” ndilo neno la kawaida na sahihi katika Kiswahili cha Biblia.
- source_word: Ἰωάννου
  choice: wa Yohana
  rationale: 'Huwakilisha kwa kawaida umilikaji au uhusiano unaoonyeshwa na hali ya genitivi: ubatizo uliohusishwa na Yohana.'
- source_word: ἐξ οὐρανοῦ
  choice: ulitoka mbinguni
  rationale: Huhifadhi picha halisi ya chanzo “kutoka mbinguni” na pia nahau ya heshima inayodokeza asili au mamlaka ya Mungu bila kuifafanua kupita maandishi.
- source_word: ἐξ ἀνθρώπων
  choice: kwa wanadamu
  rationale: “Wanadamu” huonyesha kwamba rejeo ni kwa binadamu kwa ujumla, si wanaume pekee, na huhifadhi tofauti kati ya mamlaka ya mbinguni na chanzo cha kibinadamu.
- source_word: ἦν
  choice: ulitoka
  rationale: Ingawa Kigiriki hutumia kitenzi kishirikishi “ulikuwa,” Kiswahili cha kawaida huuliza asili kwa njia ya “ulitoka,” inayowasilisha kwa uwazi maana ya virai vya chanzo.
- source_word: ἢ
  choice: au
  rationale: Kiunganishi hiki kinaweka wazi njia mbili mbadala katika swali.
theological_decisions:
- issue: Maana ya “kutoka mbinguni” kuhusiana na ubatizo wa Yohana
  choice: Kuhifadhi usemi “ulitoka mbinguni” katika matini kuu.
  alternative: ulitoka kwa Mungu
  rationale: Usemi huo unaashiria asili au mamlaka ya Mungu, lakini Kigiriki kinasema moja kwa moja “kutoka mbinguni.” Kuuhifadhi kunazuia tafsiri kufafanua zaidi ya maandishi na kunadumisha nahau ya heshima ya Kiyahudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida na unaeleweka; “wanadamu” huepuka kudokeza kwamba ἀνθρώπων inawahusu wanaume pekee.
