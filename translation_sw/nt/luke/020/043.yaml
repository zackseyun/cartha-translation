translation:
  language: sw
  text: mpaka niwaweke adui zako kuwa kiti cha kuwekea miguu yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na muundo wa maneno ya asili, “mpaka niwaweke adui zako kuwa kiti cha miguu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: mpaka nitakapo-
  rationale: Muundo huu unaonyesha kikomo cha wakati kinachohusiana na tukio la baadaye; «mpaka nitakapo-» ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: θῶ
  choice: nitakapowaweka ... kuwa
  rationale: Kitenzi τίθημι kimsingi ni «weka» au «weka mahali»; pamoja na kijalizo «kiti cha kuwekea miguu» hapa kinaeleza matokeo, hivyo «kuwaweka ... kuwa» huhifadhi maana hiyo kwa Kiswahili cha asili.
- source_word: τοὺς ἐχθρούς σου
  choice: adui zako
  rationale: Hili ni tafsiri ya moja kwa moja ya nomino yenye kivumishi kimilikishi, bila kupunguza uhasama unaotajwa.
- source_word: ὑποπόδιον
  choice: kiti cha kuwekea miguu
  rationale: Neno hili humaanisha kifaa cha kuegemeza au kuwekea miguu; kauli hii ni wazi na ya kawaida zaidi kwa wasomaji wa Kiswahili kuliko mkopo usiozoeleka.
- source_word: τῶν ποδῶν σου
  choice: cha kuwekea miguu yako
  rationale: Ingawa muundo wa Kigiriki ni «cha miguu yako», Kiswahili cha kawaida hueleza matumizi ya kiti hicho kwa «cha kuwekea miguu yako», huku sitiari ikibaki wazi.
theological_decisions:
- issue: Taswira ya Zaburi 110:1 kuhusu kutiishwa kwa maadui
  choice: Kudumisha sitiari ya kuwafanya maadui kuwa kiti cha kuwekea miguu
  alternative: mpaka nitakapowaweka adui zako chini ya miguu yako
  rationale: Maneno haya yanaendeleza nukuu ya Zaburi 110:1. Kuhifadhi kiti cha kuwekea miguu hudumisha taswira ya kifalme na ya Kimasihi bila kuifafanua kuwa ushindi au utawala kamili kwa maneno ambayo hayapo moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. «Kiti cha kuwekea miguu» kimetumiwa kuhifadhi sitiari huku kikiwa cha asili katika Kiswahili.
