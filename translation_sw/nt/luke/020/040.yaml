lexical_decisions:
- source_word: οὐκέτι
  choice: tena (pamoja na ukanushi katika “hawakuthubutu”)
  rationale: Muundo wa Kiswahili “hawakuthubutu tena” unaonyesha kwamba kuanzia wakati huo hawakuwa na ujasiri wa kuendelea kuuliza.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo au sababu na muktadha uliotangulia.
- source_word: ἐτόλμων
  choice: hawakuthubutu
  rationale: Kitenzi hiki huonyesha kuwa na ujasiri wa kufanya jambo; pamoja na οὐκέτι, “hawakuthubutu tena” ni Kiswahili cha kawaida kinachohifadhi maana ya kukoma huko.
- source_word: ἐπερωτᾶν
  choice: kumuuliza
  rationale: Katika muktadha huu, maana ya kawaida ni kuuliza, ingawa maswali hayo yalihusisha kumjaribu au kumpinga hadharani.
- source_word: αὐτὸν
  choice: -mu-
  rationale: Kiambishi cha yambwa katika “kumuuliza” kinamrejelea Yesu kwa njia ya kawaida ya Kiswahili.
- source_word: οὐδέν
  choice: jambo lolote
  rationale: Baada ya ukanushi, “jambo lolote” huwasilisha kwa kawaida upeo kamili wa οὐδέν bila kutumia muundo usio wa kawaida wa ukanushi maradufu.
