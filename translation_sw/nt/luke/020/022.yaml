  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: sw
  text: Je, ni halali kwetu kumlipa Kaisari kodi[a], au la?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushuru.” Neno la Kigiriki linamaanisha kodi inayolipwa kwa mamlaka inayotawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: ni halali
  rationale: Katika muktadha huu neno linauliza kuhusu uhalali au ruhusa, si uwezo wa kufanya jambo. Tafsiri hii haibainishi ikiwa kipimo ni sheria ya Kirumi au sheria ya Mungu.
- source_word: ἡμᾶς
  choice: sisi
  rationale: 'Muundo wa Kigiriki unaonyesha mhusika wa kitenzi-jina: ‘sisi kulipa.’ Hakuna sababu ya kuongeza ‘Wayahudi’ katika matini.'
- source_word: Καίσαρι
  choice: kwa Kaisari
  rationale: ‘Kaisari’ huhifadhi cheo/jina la kihistoria la mtawala wa Roma na uzito wa kisiasa wa swali.
- source_word: φόρον
  choice: kodi
  rationale: Neno hili humaanisha kodi au ushuru unaolipwa kwa mamlaka inayotawala. ‘Kodi’ ni neno la kawaida na la asili katika Kiswahili; maana ya ushuru kwa mtawala inaelezwa katika tanbihi.
- source_word: δοῦναι
  choice: kulipa
  rationale: Ingawa maana ya msingi ni ‘kutoa,’ Kiswahili cha kawaida husema ‘kulipa kodi’; hivyo tafsiri hii huwasilisha kwa usahihi kirai φόρον δοῦναι.
- source_word: ἢ οὔ
  choice: au la
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kuhitimisha swali lenye njia mbili.
theological_decisions:
- issue: Sheria inayodokezwa na ‘ni halali’
  choice: Kuacha kipimo cha uhalali bila kutajwa
  alternative: Kutaja wazi sheria ya Roma au sheria ya Mungu
  rationale: Kigiriki hakisemi ni sheria ipi inayokusudiwa. Muktadha una mvutano wa kisiasa na kidini, kwa hiyo tafsiri inapaswa kuhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. ‘Kulipa kodi’ ni usemi wa kawaida kuliko tafsiri ya neno kwa neno ‘kutoa kodi.’
