  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: sw
  text: 'Lakini yeye akawakazia macho, akasema, “Basi, ni nini hiki kilichoandikwa: ‘Jiwe ambalo waashi walilikataa, hilo limekuwa jiwe kuu la pembeni[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “kichwa cha pembe.” Inaweza pia kutafsiriwa “jiwe la msingi” au “jiwe la kilele.”
    reason: Kirai cha Kigiriki κεφαλὴ γωνίας kina taswira ya usanifu ambayo maana yake mahususi inajadiliwa.
lexical_decisions:
- source_word: ἐμβλέψας
  choice: akawakazia macho
  rationale: Hueleza kutazama kwa makusudi na moja kwa moja bila kuongeza wazo la kukodolea macho kwa ukali.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Basi, ni nini maana ya maneno haya yaliyoandikwa
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi swali la balagha pamoja na hali ya kutangulia na kudumu ya yaliyoandikwa; neno “maana” limewekwa wazi kwa sababu tafsiri ya neno kwa neno ingekuwa ngumu na isiyo ya kawaida.
- source_word: Λίθον
  choice: Jiwe
  rationale: Hurejelea jiwe maalumu katika nukuu ya Maandiko bila kulazimisha kibainishi kisichohitajika katika Kiswahili.
- source_word: ἀπεδοκίμασαν
  choice: walilikataa
  rationale: Huwasilisha wazi hukumu ya waashi kwamba jiwe hilo halifai na tendo lao la kuliondoa.
- source_word: οἱ οἰκοδομοῦντες
  choice: waashi
  rationale: Ni nomino ya kawaida na inayoeleweka kwa watu wanaojenga kwa mawe, hivyo huhifadhi taswira ya ujenzi.
- source_word: οὗτος
  choice: hilo
  rationale: Kiwakilishi hiki huhifadhi msisitizo wa Kigiriki kwa kulirejelea tena jiwe lililokataliwa.
- source_word: ἐγενήθη εἰς
  choice: limekuwa
  rationale: Hueleza mabadiliko yaliyotokea na matokeo yake yanayoendelea.
- source_word: κεφαλὴν γωνίας
  choice: jiwe kuu la pembe
  rationale: Huhifadhi dhana ya ukuu katika κεφαλή na uhusiano na pembe, huku ikiepuka kuamua kimya kimya ikiwa ni jiwe la msingi au jiwe la kilele.
theological_decisions:
- issue: Taswira ya usanifu katika nukuu ya Zaburi 118:22
  choice: jiwe kuu la pembe
  alternative: jiwe la msingi la pembeni; au jiwe la kilele
  rationale: Kirai cha Kigiriki kinaweza kueleweka kwa njia tofauti kuhusu mahali na kazi ya jiwe hilo. Tafsiri kuu inaacha kiwango fulani cha uwazi, na tanbihi huhifadhi tafsiri kuu zinazowezekana bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Jina “Yesu” limewekwa wazi badala ya kiwakilishi ili rejeo liwe la kawaida na lisilo na utata katika mstari unaosimama peke yake. Nukuu imeundwa kwa mtiririko wa kawaida wa Kiswahili huku msisitizo wa “hilo” ukihifadhiwa.
