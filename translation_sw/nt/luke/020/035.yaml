  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: sw
  text: Lakini wale waliohesabiwa kustahili kupata sehemu katika enzi ile[b] na katika ufufuo kutoka kwa wafu, hawaoi wala hawaolewi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha pili kiko katika hali ya kutendwa; yaweza kutafsiriwa pia, “hawaozeshwi.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakati ule.” Kigiriki kinasema kihalisi “enzi ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: wanaohesabiwa kuwa wanastahili
  rationale: 'Huhifadhi hali ya kutendwa katika Kigiriki: wanahukumiwa au kuonwa kuwa wanastahili, bila kudai kwamba ustahili huo ni wa kiasili au umechumwa.'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ule wakati
  rationale: Katika muktadha huu αἰών ni enzi au kipindi kinachotofautishwa na wakati wa sasa. ‘Ule wakati’ ni Kiswahili cha kawaida kinachohifadhi kionyeshi cha Kigiriki bila kufafanua kupita kiasi kuwa ni ‘ulimwengu ujao.’
- source_word: τυχεῖν
  choice: kuufikia
  rationale: Kitenzi pamoja na hali ya umilikaji kina maana ya kupata au kufikia. ‘Kuufikia’ kinaendana kwa kawaida na ‘ule wakati’ na, kama kitenzi cha pamoja, na ufufuo.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: ufufuo kutoka kwa wafu
  rationale: Ni tafsiri iliyo wazi na ya kawaida ya usemi huo, huku ikihifadhi wazo la kutoka miongoni mwa wafu.
- source_word: γαμοῦσιν
  choice: hawaoi
  rationale: Katika jozi hii ya kijamii, kitenzi cha kwanza kwa kawaida hurejelea kuoa; ‘hawaoi’ huhifadhi utofauti wake na kitenzi cha pili.
- source_word: γαμίζονται
  choice: hawaolewi
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na tofauti ya usemi wa Kigiriki kati ya kuoa na kuolewa, kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Kama καταξιωθέντες inadokeza kwamba watu wanapata maisha ya ufufuo kwa kustahili kwa matendo yao
  choice: wanaohesabiwa kuwa wanastahili
  alternative: wale wanaostahili
  rationale: Tafsiri iliyochaguliwa huhifadhi tathmini inayodokezwa na hali ya kutendwa bila kuingiza fundisho kwamba watu wanajipatia ule wakati kwa sifa zao wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakati’ ni rahisi kueleweka kuliko ‘enzi’ katika matini kuu, huku tanbihi ikihifadhi mbadala wa karibu zaidi wa kileksika. Jozi ‘hawaoi wala hawaolewi’ ni ya kawaida na inaeleweka, ingawa tanbihi inaonyesha wazi hali ya kutendwa katika kitenzi cha pili.
