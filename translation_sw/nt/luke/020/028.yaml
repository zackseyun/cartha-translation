  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: sw
  text: wakisema, “Mwalimu, Musa alituandikia kwamba ikiwa ndugu wa mtu akifa akiwa na mke[a], na akiwa hana mtoto, ndugu yake amchukue mke huyo na amwinulie ndugu yake aliyekufa uzao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akimwacha mke”; Kigiriki kinasema kihalisi, “akifa akiwa na mke.”
    reason: lexical_alternative
  - marker: b
    text: “Kumwinulia uzao” ni mwangwi wa lugha ya kisheria ya Kumbukumbu la Torati 25:5 kuhusu kumpatia ndugu aliyekufa wazao watakaohesabiwa kwa jina lake; kihalisi, “kuinua mbegu.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni mwito wa moja kwa moja kwa Yesu; “Mwalimu” ni tafsiri ya kawaida na ya sasa isiyoingiza maana ya ziada.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Musa alituandikia
  rationale: Dhamiri ἡμῖν inaonyesha kwamba sheria hiyo iliandikwa kwa ajili ya Israeli; “alituandikia” ni Kiswahili cha kawaida na haidokezi barua binafsi katika muktadha huu.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ikiwa ndugu wa mtu akifa
  rationale: Huhifadhi hali ya jumla ya τινος na umoja wa ἀδελφός. Muktadha na kauli “akiwa na mke” zinaonyesha kwamba anayezungumziwa ni ndugu wa kiume bila kulazimisha usemi mzito.
- source_word: ἔχων γυναῖκα
  choice: akiwa na mke
  rationale: Hufuata kwa karibu maana halisi ya kirai-shirikishi cha Kigiriki na ni ya asili katika Kiswahili; “akimwacha mke” ni tafsiri inayofafanua zaidi.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: lakini hana mtoto
  rationale: οὗτος humrejelea ndugu aliyekufa, na ἄτεκνος humaanisha kutokuwa na mtoto. “Lakini” huonyesha kwa kawaida hali ya ziada inayoweka sharti bila kuongeza fundisho.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: ndugu yake amchukue mke huyo
  rationale: Kauli hii huhifadhi wajibu wa kisheria na kitenzi “kumchukua,” bila kuipanua moja kwa moja kuwa maelezo ya desturi ya ndoa.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: amwinulie … uzao
  rationale: Huhifadhi nahau ya kisheria ya kibiblia ya “kuinua uzao,” huku “uzao” ikieleza σπέρμα kwa Kiswahili kinachoeleweka kuliko “mbegu” katika muktadha huu.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: Yambwa hii huonyesha kwamba uzao unahesabiwa kwa ajili au kwa jina la ndugu aliyekufa; muundo “amwinulie ndugu yake uzao” huhifadhi uhusiano huo kwa ufupi.
theological_decisions:
- issue: Jinsi ya kutafsiri lugha ya sheria ya ndoa ya kurithi mjane bila kuingiza maelezo ya baadaye ya kimadhehebu au kitamaduni
  choice: ndugu yake amchukue mke huyo na amwinulie ndugu yake uzao
  alternative: ndugu yake lazima amwoe mjane huyo na amzalie ndugu yake watoto
  rationale: Chaguo lililotumiwa lina sauti ya kisheria, linadumisha nahau ya Kumbukumbu la Torati 25:5, na haliongezi ufafanuzi mpana kuliko unaotolewa na maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na lugha ya kisheria ya chanzo, huku “mke huyo” na “uzao” vikisaidia usomaji wa kawaida. Alama za tanbihi [a] na [b] zimewekwa kwenye virai vinavyohusika moja kwa moja.
