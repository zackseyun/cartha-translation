  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: sw
  text: Lakini akawaambia, “Basi, mpeni Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mrudishieni Kaisari … na Mungu …” Kitenzi kinaweza kumaanisha kutoa, kulipa, au kurudisha kile kinachodaiwa au kilicho haki ya mhusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Lakini akawaambia
  rationale: Muundo huu ni wa kawaida na wa asili katika Kiswahili kwa maana ya ‘alisema kwao’; δέ inaonyesha mwendelezo wenye tofauti ndogo katika majibizano.
- source_word: Τοίνυν
  choice: Basi
  rationale: ‘Basi’ huonyesha hitimisho linalotokana na yaliyotangulia bila kuwa rasmi kupita kiasi.
- source_word: ἀπόδοτε
  choice: mpeni
  rationale: Kitenzi kinaweza kumaanisha kutoa, kulipa, au kurudisha kilicho wajibu. ‘Mpeni’ ni cha asili katika Kiswahili na hakifungi maana kuwa kodi pekee; tanbihi inaeleza wazo la kumpa mtu kilicho haki yake.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: mpeni Kaisari yaliyo ya Kaisari
  rationale: Huhifadhi upana wa usemi na urudiaji wa Kigiriki bila kuufafanua kuwa kodi pekee.
- source_word: Καίσαρος / Καίσαρι
  choice: Kaisari
  rationale: Hili ni jina/cheo cha kifalme lililozoeleka katika Kiswahili cha Biblia, badala ya tafsiri yenye kufasiri zaidi kama ‘maliki.’
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: na Mungu yaliyo ya Mungu
  rationale: Huhifadhi usambamba na tofauti kati ya Kaisari na Mungu katika sentensi ya Kigiriki.
- source_word: θεοῦ / θεῷ
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu wa Israeli, si mungu yeyote kwa ujumla.
theological_decisions:
- issue: Upeo wa kisiasa na kiteolojia wa kauli ya Yesu
  choice: Tafsiri inadumisha wajibu kwa Kaisari na kwa Mungu bila kufafanua mipaka kamili ya kila mmoja.
  alternative: Kuifanya kauli hii kuwa mgawanyo mkali wa dini na dola, kuhalalisha mamlaka ya dola yasiyo na mipaka, au kuifungia katika ulipaji wa kodi pekee.
  rationale: Kigiriki kinaagiza kila upande upewe yaliyo yake, lakini hakitoi hapa mfumo kamili wa siasa na teolojia. Kwa hiyo mvutano na upana wa kauli unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi’ ni kiunganishi cha kawaida cha hitimisho; ‘yaliyo ya’ huhifadhi upana na usambamba wa asili. Alama ya tanbihi [a] imewekwa baada ya kauli nzima kwa kuwa inaeleza kitenzi kinachotawala sehemu zote mbili.
