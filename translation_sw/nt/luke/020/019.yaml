id: LUK.20.19
reference: Luke 20:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: sw
  text: Waandishi na makuhani wakuu walitaka kumkamata[a] saa ileile, lakini waliwaogopa watu, kwa maana walijua kwamba alikuwa amesema mfano huo dhidi yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kuweka mikono juu yake”; yaani, kumtia mikononi au kumkamata.
    reason: lexical_alternative
  - marker: b
    text: Au “kwao” au “kuwahusu”; katika muktadha huu maneno yanaelekea kumaanisha kwamba mfano huo ulielekezwa dhidi yao.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: walitaka
  rationale: Aoristi inaeleza kwa muhtasari nia yao ya kuchukua hatua. “Walitaka” ni ya kawaida katika Kiswahili na haidai kwamba walifanikiwa.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: “Waandishi” ni istilahi ya kawaida ya kibiblia kwa kundi hili la wataalamu wa sheria; inadumisha utambulisho wao wa kihistoria bila kuongeza ufafanuzi ndani ya mstari.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Wingi huu unarejelea viongozi wa ukuhani, si watu wengi waliokuwa wakishikilia kwa wakati mmoja cheo cha kuhani mkuu.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: kumkamata
  rationale: Hii ni nahau ya kitendo cha kumtia mtu mikononi kwa nguvu. “Kumkamata” huwasilisha maana yake kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi ya kuweka mikono juu yake.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: saa ileile
  rationale: Huhifadhi msisitizo wa kwamba walitaka kutenda wakati huohuo, bila kuibadili tu kuwa kielezi cha “mara moja.”
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: waliwaogopa watu
  rationale: λαός hapa ni watu kwa ujumla, si lazima umati uliokusanyika pekee; umbo hili pia huhifadhi hofu yao kwa watu hao.
- source_word: ἔγνωσαν
  choice: walijua
  rationale: Tafsiri nyepesi na ya moja kwa moja ya utambuzi wao kwamba mfano uliwalenga.
- source_word: πρὸς αὐτοὺς
  choice: dhidi yao
  rationale: Katika muktadha huu wa uhasama, maneno yanaonyesha kwamba mfano uliwalenga kwa hukumu; tanbihi inadumisha uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kigiriki.
- source_word: παραβολὴν
  choice: mfano
  rationale: “Mfano” ni istilahi ya Kiswahili iliyozoeleka na inayoeleweka kwa παραβολή katika Injili.
theological_decisions:
- issue: Nguvu ya πρὸς αὐτοὺς kuhusiana na mfano wa Yesu
  choice: Mfano ulisemwa dhidi ya viongozi hao wa kidini.
  alternative: Mfano ulisemwa kwao au uliwahusu.
  rationale: Mwitikio wao katika simulizi unaonyesha walitambua kuwa walikuwa walengwa wa hukumu katika mfano uliotangulia. “Dhidi yao” hudumisha nguvu hiyo bila kuingiza fundisho la ziada, na tanbihi huhifadhi upana wa kirai cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Saa ileile” ni ya asili na huhifadhi msisitizo wa Kigiriki. “Waandishi” na “makuhani wakuu” hudumisha istilahi za kihistoria za Injili; tanbihi zinafafanua nahau na utata halisi bila kulemea mstari.
