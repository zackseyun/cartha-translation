lexical_decisions:
- source_word: ὕστερον
  choice: Baadaye
  rationale: Kielezi hiki kinaonyesha wakati uliofuata katika mfululizo wa simulizi bila kudokeza kwamba hili ndilo tukio la mwisho kabisa.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaonyesha kwamba mwanamke naye alikufa kama wale ndugu waliotajwa awali; “pia” ni ya asili na wazi katika Kiswahili.
- source_word: ἡ γυνή
  choice: yule mwanamke
  rationale: γυνή inaweza kumaanisha “mwanamke” au “mke.” Katika kisa hiki, “yule mwanamke” humtambulisha mhusika anayejulikana bila kumhusisha pekee na mmoja wa waume kadhaa.
- source_word: ἀπέθανεν
  choice: akafa
  rationale: Kitenzi hiki kinaripoti moja kwa moja tukio la kifo lililotokea; “akafa” ni tafsiri ya kawaida, wazi, na inayofaa mfululizo wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yule mwanamke” huendeleza rejeleo la mhusika kutoka muktadha uliotangulia, na “akafa” hudumisha mtiririko mfupi wa simulizi.
