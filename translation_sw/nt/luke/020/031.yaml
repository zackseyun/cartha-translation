  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: sw
  text: Na wa tatu akamchukua[a]; vivyo hivyo, wote saba hawakuacha watoto, nao wakafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwoa.” Kigiriki kinasema kihalisi “akamchukua,” usemi unaomaanisha kumchukua mwanamke awe mke katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: wa tatu
  rationale: Kigiriki kinasema kihalisi ‘wa tatu’ bila kurudia ‘ndugu.’ Kiswahili kinaweza kuhifadhi udondoshaji huu kwa kawaida kwa kutegemea muktadha.
- source_word: ἔλαβεν αὐτήν
  choice: akamchukua
  rationale: Usemi huu katika muktadha wa ndoa ya urithi unamaanisha kumchukua mwanamke awe mke. ‘Akamchukua’ huhifadhi muundo wa Kigiriki, huku tanbihi ikieleza maana ya kimuktadha.
- source_word: ὡσαύτως δὲ καὶ
  choice: vivyo hivyo
  rationale: Hutoa kwa ufupi na kwa Kiswahili cha kawaida wazo la mwendelezo unaofanana, bila kulazimisha kila kiunganishi cha Kigiriki kuwakilishwa kivyake.
- source_word: οἱ ἑπτὰ
  choice: wote saba
  rationale: Huweka wazi kwamba usemi unawahusu ndugu wote saba kama kundi zima.
- source_word: οὐ κατέλιπον τέκνα
  choice: hawakuacha watoto
  rationale: Huhifadhi maana ya kutowaacha watoto hai baada ya kufa, tofauti na ‘hawakuwa na watoto,’ ambayo inaweza kudhoofisha uhusiano na kifo.
- source_word: τέκνα
  choice: watoto
  rationale: Hili ndilo neno la kawaida na wazi zaidi la Kiswahili; katika muktadha linamaanisha watoto au uzao wao.
- source_word: ἀπέθανον
  choice: wakafa
  rationale: Ni tafsiri ya moja kwa moja, wazi na isiyopunguza ukali wa kitenzi cha Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘wa tatu’ huhifadhi udondoshaji wa Kigiriki; ‘akamchukua’ huhifadhi nahau ya chanzo huku tanbihi ikitoa maana yake wazi.
