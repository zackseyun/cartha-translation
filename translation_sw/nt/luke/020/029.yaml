lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza hoja na simulizi la Masadukayo; “Basi” huonyesha uhusiano huo bila kukifanya kiwe kielezi cha wakati.
- source_word: ἑπτὰ ἀδελφοὶ
  choice: ndugu saba
  rationale: Katika kisa hiki neno la Kigiriki la wingi wa kiume linawahusu ndugu wanaume, ingawa Kiswahili hutumia nomino ya kawaida “ndugu.”
- source_word: ὁ πρῶτος
  choice: Wa kwanza
  rationale: Huonyesha wa kwanza katika mfuatano, si lazima mkubwa wao kwa umri.
- source_word: λαβὼν γυναῖκα
  choice: alioa
  rationale: Kirai hiki ni nahau ya Kigiriki inayomaanisha kumchukua mwanamke kuwa mke; “alioa” ni Kiswahili cha kawaida na wazi.
- source_word: ἀπέθανεν
  choice: akafa
  rationale: Hutoa kwa njia ya moja kwa moja tendo lililofuata baada ya kuoa.
- source_word: ἄτεκνος
  choice: bila mtoto
  rationale: Huhifadhi maana kwamba alikufa akiwa hana mtoto, jambo muhimu katika muktadha wa ndoa ya kumrithisha ndugu aliyekufa.
