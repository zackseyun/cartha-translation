  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: sw
  text: Lakini Abrahamu akasema, “Mwanangu, kumbuka kwamba ulipokea mema yako wakati wa maisha yako[a], na vivyo hivyo Lazaro alipokea mambo mabaya; lakini sasa anafarijiwa hapa, nawe uko katika maumivu makali[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulipokea kikamilifu mema yako.” Kitenzi cha Kigiriki kinaweza kumaanisha kupokea kilichogawiwa au kupokea kikamilifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “unateswa.” Kitenzi cha Kigiriki kinaweza kumaanisha maumivu makali au dhiki kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Mwanangu
  rationale: Ni mwito wa upole wenye uhusiano na tofauti ya hadhi; katika Kiswahili, “Mwanangu” ni wa kawaida na hauhitaji kumaanisha mwana wa kuzaa.
- source_word: μνήσθητι
  choice: kumbuka
  rationale: Hutoa kwa kawaida na moja kwa moja agizo la kukumbuka.
- source_word: ἀπέλαβες
  choice: ulipokea
  rationale: Huhifadhi maana pana ya kupokea; uwezekano wa kupokea kikamilifu au sehemu iliyogawiwa umewekwa katika tanbihi.
- source_word: τὰ ἀγαθά σου
  choice: mema yako
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuingiza neno la kitheolojia kama “baraka.”
- source_word: ἐν τῇ ζωῇ σου
  choice: wakati wa maisha yako
  rationale: Ni usemi wa Kiswahili ulio wazi unaoonyesha kipindi cha maisha ya duniani.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Huonyesha ulinganifu wenye utofauti kati ya tajiri na Lazaro.
- source_word: τὰ κακά
  choice: mabaya
  rationale: Hapa ni mambo mabaya yaliyompata Lazaro, si maovu aliyoyatenda; neno hili linaacha maana hiyo ikiwa pana.
- source_word: παρακαλεῖται
  choice: anafarijiwa
  rationale: Katika muktadha huu, kauli tendwa inaonyesha kwamba Lazaro anapokea faraja.
- source_word: ὧδε
  choice: hapa
  rationale: Hurejelea mahali walipo katika mandhari ya simulizi kwa njia fupi na ya kawaida.
- source_word: ὀδυνᾶσαι
  choice: unaumia sana
  rationale: Hueleza maumivu au dhiki kali kwa Kiswahili cha kawaida bila kulazimisha tafsiri yenye uzito zaidi ya “unateswa.”
theological_decisions:
- issue: Lugha kuhusu mateso baada ya kifo
  choice: unaumia sana
  alternative: unateswa
  rationale: Kifungu kinaonyesha hali halisi ya maumivu baada ya kifo, lakini tafsiri inapaswa kuhifadhi upana wa ὀδυνᾶσαι bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu ulinganifu na mgeuko wa hali katika Kigiriki huku ukibaki wa kawaida katika Kiswahili.
