  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: sw
  text: Zaidi ya hayo yote[a], kati yetu na ninyi kumewekwa imara korongo kubwa, ili wale wanaotaka kuvuka kutoka hapa kwenda kwenu wasiweze, wala mtu yeyote asiweze kuvuka kutoka huko kuja kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika mambo haya yote.” Kirai cha Kigiriki kinaweza kutambulisha jambo jingine la kuzingatia kwa namna ya kawaida zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: Zaidi ya hayo yote
  rationale: Katika muktadha huu, kirai hiki kinaongeza jambo jingine la kuzingatia. Tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi kazi yake katika hoja.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: kati yetu na ninyi
  rationale: Huhifadhi maana ya nafasi na pia huonyesha wazi kwamba kiwakilishi cha nafsi ya pili ni cha wingi.
- source_word: χάσμα μέγα
  choice: shimo kubwa
  rationale: “Shimo” ni neno la kawaida na linaloeleweka kwa nafasi kubwa yenye kutenganisha pande mbili; “kubwa” huhifadhi msisitizo wa μέγα.
- source_word: ἐστήρικται
  choice: kumewekwa
  rationale: Kauli timilifu tendwa inaonyesha jambo lililowekwa na ambalo hali yake inaendelea. Muundo huu wa Kiswahili ni wa kawaida na hauongezi mhusika ambaye Kigiriki hakumtaji.
- source_word: ὅπως
  choice: ili
  rationale: Huanzisha kusudi au matokeo kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: οἱ θέλοντες
  choice: wale wanaotaka
  rationale: Huonyesha kundi lisilotajwa kwa majina na kuhifadhi maana ya kitenzi-shirikishi.
- source_word: διαβῆναι
  choice: kuvuka
  rationale: Ni kitenzi cha kawaida cha Kiswahili kwa kusonga kutoka upande mmoja kwenda mwingine.
- source_word: ἔνθεν πρὸς ὑμᾶς
  choice: kutoka hapa kwenda kwenu
  rationale: Huhifadhi mtazamo wa msemaji na mwelekeo kuelekea upande wa wasikilizaji.
- source_word: μὴ δύνωνται
  choice: wasiweze
  rationale: Huonyesha kutoweza, si marufuku tu.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: wala watu wasiweze kuvuka kutoka huko kuja kwetu
  rationale: “Watu” hutoa kiima kinachodokezwa katika Kigiriki bila kukifungamanisha lazima na kundi la kwanza; “wala” huhifadhi ulinganifu wa kutowezekana kwa pande zote mbili.
theological_decisions:
- issue: Asili ya utengano kati ya pande hizo mbili katika mfano
  choice: Kutafsiri kama utengano uliowekwa ambao hauwezi kuvukwa, bila kuufafanua zaidi kuwa fundisho kamili kuhusu hali ya baada ya kifo.
  alternative: Kulifanya shimo kuwa maelezo halisi ya kijiografia ya ulimwengu wa wafu, au kulifanya kuwa mfano tu usioashiria uthabiti wa utengano.
  rationale: Mstari unasisitiza hali endelevu ya utengano na kutoweza kuvuka, lakini hautoi ufafanuzi mpana wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ninyi” na “kwenu” zinaonyesha wazi wingi wa Kigiriki; sentensi hudumisha ulinganifu wa pande mbili bila kuongeza maelezo ya kimafundisho.
