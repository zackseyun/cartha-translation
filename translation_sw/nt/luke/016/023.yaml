base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: sw
  text: Naye, akiwa katika mateso huko Kuzimu[a], anainua macho yake na anawaona Abrahamu kwa mbali na Lazaro kifuani mwa Abrahamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, makao ya wafu; Kigiriki ni “Hades,” si “Gehenna,” neno linalohusishwa na mahali pa hukumu ya mwisho.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika vifua vyake” (ya Abrahamu); kwa mapokeo, “kifuani mwa Abrahamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: Kuzimu
  rationale: “Kuzimu” ni neno la kawaida katika Kiswahili kwa makao ya wafu na linahifadhi tofauti na “Jehanamu,” ambayo kwa kawaida hutumiwa kutafsiri Gehenna.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: anainua macho yake
  rationale: Usemi huu unahifadhi taswira ya Kigiriki kwa Kiswahili cha kawaida na unaunganishwa na wakati uliopo wa kihistoria wa kitenzi kikuu.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: akiwa katika mateso
  rationale: Muundo wa hali unaonyesha kwamba alikuwa akiteseka wakati wa tukio; “mateso” huwasilisha maumivu makali yanayodokezwa na βασάνοις bila kuongeza maelezo ya kimafundisho.
- source_word: ὁρᾷ
  choice: kumwona
  rationale: Imeunganishwa na “anainua” katika wakati uliopo wa kihistoria ili kuhifadhi uhai wa simulizi la Kigiriki; umoja wa “kumwona” unafuata Abrahamu kama yambwa kuu, huku Lazaro akitajwa akiwa karibu naye.
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Ni usemi wa asili na wazi unaohifadhi msisitizo wa utengano wa mahali.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: kifuani mwa Abrahamu
  rationale: “Kifuani” huhifadhi taswira ya κόλπος ya ukaribu na hifadhi. Jina “Abrahamu” limerudiwa ili kuondoa utata wa kiwakilishi unaoweza kutokea katika Kiswahili.
theological_decisions:
- issue: Maana ya ᾅδης katika mjadala kuhusu hali ya wafu na hukumu ya mwisho
  choice: Kuzimu
  alternative: Jehanamu; makao ya wafu
  rationale: “Kuzimu” hudumisha tofauti ya kileksika kati ya Hades na Gehenna, bila kuamua zaidi ya andiko kuhusu hali ya kati au hukumu ya mwisho.
- issue: Taswira ya Lazaro kuwa ἐν τοῖς κόλποις ya Abrahamu
  choice: kifuani mwa Abrahamu
  alternative: mikononi mwa Abrahamu; kando ya Abrahamu
  rationale: Tafsiri hii huhifadhi taswira ya asili na wazo la ukaribu bila kuifanya kuwa istilahi maalumu ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wakati uliopo wa kihistoria umetumiwa kufuatia ὁρᾷ na kuipa simulizi uhai. “Kuzimu” limeandikwa kwa herufi kubwa hapa kama jina la eneo katika simulizi.
