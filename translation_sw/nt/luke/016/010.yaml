id: LUK.16.10
reference: Luke 16:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: sw
  text: Aliye mwaminifu katika lililo dogo sana[a] ni mwaminifu pia katika lililo kubwa, na asiye mwadilifu[b] katika lililo dogo sana si mwadilifu pia katika lililo kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kidogo kabisa.” Neno la Kigiriki linarejelea kilicho kidogo sana au kisichoonekana kuwa cha maana.
    reason: lexical_alternative
  - marker: b
    text: Au, “asiye na haki” au “mdanganyifu.” Neno la Kigiriki lina maana pana kuliko udanganyifu wa kifedha, ingawa maana hiyo inafaa katika muktadha unaozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: mwaminifu
  rationale: Katika muktadha huu neno linaonyesha mtu anayetegemeka katika alichokabidhiwa, si mtu anayeamini tu. “Mwaminifu” huwasilisha uaminifu na kutegemeka huku likihifadhi ulinganifu wa sentensi.
- source_word: ἐν ἐλαχίστῳ
  choice: katika jambo dogo sana
  rationale: Muundo huu unaonyesha eneo au hali ambamo uaminifu unaonekana. “Katika jambo dogo sana” ni Kiswahili cha kawaida na huhifadhi utofauti wa kiasi kati ya kilicho kidogo sana na kilicho kikubwa.
- source_word: πολλῷ
  choice: katika jambo kubwa
  rationale: Nomino ya kati iliyodokezwa inaonyesha kiasi au ukubwa unaotofautishwa na ἐλαχίστῳ. “Jambo kubwa” huleta ulinganifu wa asili na “jambo dogo sana.”
- source_word: ἄδικος
  choice: asiye mwadilifu
  rationale: Neno la Kigiriki linaweza kumaanisha mtu asiye na haki, asiye mwadilifu, au mdanganyifu. “Asiye mwadilifu” huhifadhi maana pana ya kimaadili bila kuifungia katika udanganyifu wa fedha pekee.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: aliye mwaminifu ... asiye mwadilifu
  rationale: Vivumishi vyenye kibainishi vinatumiwa kama nomino na humwakilisha mtu yeyote mwenye sifa hiyo. Muundo wa “aliye...” ni wa kawaida, wazi, na usioingiza jinsia isiyolazimishwa na maana ya jumla.
- source_word: καὶ
  choice: pia / na
  rationale: “Pia” huonyesha nguvu ya nyongeza ndani ya kila kauli, huku “na” ikiunganisha nusu mbili za msemo na kuhifadhi ulinganifu wake.
theological_decisions:
- issue: Maana ya kimaadili ya ἄδικος katika muktadha wa uwakili
  choice: asiye mwadilifu
  alternative: mdanganyifu; asiye na haki
  rationale: Kauli inaweka kanuni pana ya tabia, ingawa muktadha wake unahusu mali na uwakili. “Asiye mwadilifu” haipunguzi maana kuwa udanganyifu wa kifedha tu, wala hailazimishi maana finyu ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Ulinganifu wa sentensi ya Kigiriki umehifadhiwa kwa kurudia miundo “katika jambo dogo sana” na “katika jambo kubwa.”
