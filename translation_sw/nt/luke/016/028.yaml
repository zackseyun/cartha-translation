id: LUK.16.28
reference: Luke 16:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: sw
  text: kwa maana nina ndugu watano wa kiume, ili awaonye kwa uzito[a], wasije wao pia wakafika mahali hapa pa mateso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “awashuhudie kwa dhati” au “awaonye vikali.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa ushuhuda mzito au onyo lenye nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: kwa maana nina
  rationale: γάρ linaonyesha sababu ya ombi lililotangulia, na ἔχω hapa ni kuwa na; “kwa maana nina” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: πέντε ἀδελφούς
  choice: ndugu watano wa kiume
  rationale: ἀδελφούς ni wingi wa kiume na hapa inamaanisha ndugu wa kiume. Kwa kuwa “ndugu” pekee katika Kiswahili haitaji jinsia, “wa kiume” imeongezwa ili kuhifadhi maana ya chanzo.
- source_word: ὅπως
  choice: ili
  rationale: ὅπως linaanzisha kusudi; “ili” ni njia ya kawaida na iliyo wazi ya kulionyesha katika Kiswahili.
- source_word: διαμαρτύρηται
  choice: awaonye kwa uzito
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa ushuhuda wa dhati au kuonya kwa nguvu. Muktadha wa kuwazuia wasije mahali pa mateso unaelekeza kwenye onyo zito, huku tanbihi ikihifadhi uwezekano wa maana ya ushuhuda.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: wasije wao pia wakafika
  rationale: Muundo huu unaonyesha kusudi hasi, na καὶ αὐτοὶ linasisitiza kwamba wao pia wasipate yaliyompata msemaji. “Wasije ... wakafika” ni Kiswahili asilia chenye maana hiyo.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: mahali hapa pa mateso
  rationale: εἰς linaonyesha kufika kwenye mahali, na βάσανος ni maumivu au mateso makali. “Mahali hapa pa mateso” huhifadhi maelezo ya simulizi bila kuongeza mfumo mpana wa mafundisho.
theological_decisions:
- issue: Jinsi ya kutaja mahali pa baada ya kifo katika maneno ya tajiri
  choice: mahali hapa pa mateso
  alternative: mahali hapa pa maumivu makali
  rationale: Tafsiri inadumisha neno la chanzo βάσανος linaloeleza hali ya mateso, bila kuongeza maelezo ya kimafundisho ambayo aya yenyewe haitoi.
- issue: Nguvu na upeo wa διαμαρτύρηται
  choice: awaonye kwa uzito
  alternative: awashuhudie kwa dhati
  rationale: Kusudi linalofuata ni kuwazuia ndugu wasifike mahali hapo, hivyo maana ya onyo inafaa zaidi katika muktadha. Hata hivyo, maana inayowezekana ya kutoa ushuhuda imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa uzito” linaonyesha uzito wa onyo bila kutumia lugha ya zamani; “wasije wao pia wakafika” ni muundo wa kawaida unaohifadhi kusudi hasi na msisitizo wa καὶ αὐτοί.
