  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: sw
  text: Lakini akasema, “La, baba Abrahamu; ila mtu akienda kwao kutoka miongoni mwa wafu, watatubu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: La
  rationale: Ni jibu la kukataa lenye msisitizo; “La” ni la kawaida na lenye hadhi katika usemi wa moja kwa moja.
- source_word: πάτερ Ἀβραάμ
  choice: baba Abrahamu
  rationale: Ni mwito unaomwelekea Abrahamu kama babu wa ukoo; “baba” huhifadhi uhusiano huo bila kuufanya cheo rasmi.
- source_word: ἀλλ’ ἐάν
  choice: Ila ... aki-
  rationale: 'Muundo huu unaonyesha upinzani na sharti kwa Kiswahili cha kawaida: si hivyo, ila sharti jingine likitimizwa.'
- source_word: τις
  choice: mtu
  rationale: Kiwakilishi kisichotaja mtu maalumu kimetafsiriwa kwa “mtu,” ambacho ni cha kawaida na hudumisha umoja.
- source_word: ἀπὸ νεκρῶν
  choice: kutoka miongoni mwa wafu
  rationale: Huwakilisha wazi wazo la kutoka katika kundi au hali ya wafu, bila kuondoa uwezekano wa usemi mfupi “kutoka kwa wafu.”
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: akienda kwao
  rationale: Huhifadhi kitenzi cha mwendo “kwenda” na mwelekeo kuelekea kwao, badala ya kubadili mtazamo kuwa “kuja.”
- source_word: μετανοήσουσιν
  choice: watatubu
  rationale: Katika muktadha wa Luka, neno hili linamaanisha badiliko la kimaadili na kiroho, si kubadili tu maoni; “watatubu” ni tafsiri ya kawaida na sahihi.
theological_decisions:
- issue: Maana ya μετανοήσουσιν
  choice: watatubu
  alternative: watabadili mawazo yao / watageuka
  rationale: Muktadha unahusu kuitikia onyo la Mungu kwa badiliko la kimaadili na kiroho. “Watatubu” huhifadhi uzito huo bila kuufanya kuwa badiliko la kiakili tu.
- issue: Maana ya ἀπὸ νεκρῶν
  choice: kutoka miongoni mwa wafu
  alternative: kutoka kwa wafu
  rationale: Tafsiri iliyochaguliwa huonyesha kwa uwazi zaidi kutoka katika kundi la wafu huku ikiacha maana ya msingi bila kueleza kwa ziada namna ya kurudi kutoka kifoni.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa moja kwa moja umetolewa kwa mtiririko wa kawaida; mshangao baada ya “baba Abrahamu” unaonyesha nguvu ya pingamizi bila kuongeza maana mpya.
