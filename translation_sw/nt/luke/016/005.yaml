base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: sw
  text: Baada ya kuwaita wadeni wa bwana wake, mmoja baada ya mwingine, akamwambia wa kwanza, “Una deni la kiasi gani kwa bwana wangu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki κύριος mara nyingi hutafsiriwa “Bwana,” lakini hapa linamrejelea mkuu wa kibinadamu wa msimamizi; kwa hiyo “bwana” linafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; muundo wa Kiswahili wenye “kisha” na “aka-” unawasilisha mfuatano huo kwa kawaida.
- source_word: ἕνα ἕκαστον
  choice: mmoja mmoja
  rationale: 'Huhifadhi maana ya ugawaji yenye mkazo: kila mdaiwa aliitwa kwa zamu.'
- source_word: χρεοφειλετῶν
  choice: wale waliokuwa na deni
  rationale: Ni usemi wa kawaida na wazi katika Kiswahili kwa watu waliodaiwa mali au fedha, bila kudokeza kwa lazima kwamba walikuwa wakopaji tu.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: kwa bwana wake
  rationale: “Bwana” hapa humaanisha mkuu wa kibinadamu wa msimamizi, na “wake” humrejelea msimamizi.
- source_word: ἔλεγεν
  choice: akamwambia
  rationale: Katika simulizi la Kiswahili, “aka-” huendeleza tukio kwa ufasaha. Ingawa Kigiriki kina imperfecti, muktadha wa kumwendea kila mmoja huacha wazi kwamba swali lilirudiwa.
- source_word: τῷ πρώτῳ
  choice: wa kwanza
  rationale: Ni namna ya moja kwa moja na ya kawaida ya kumtaja mtu wa kwanza katika mfululizo.
- source_word: Πόσον ὀφείλεις
  choice: Una deni la kiasi gani
  rationale: Hutoa maana ya swali kuhusu jumla inayodaiwa kwa Kiswahili cha kawaida na wazi.
- source_word: τῷ κυρίῳ μου
  choice: kwa bwana wangu
  rationale: Huhifadhi mtazamo wa msimamizi (“wangu”) na uhusiano wake na mkuu wake wa kibinadamu.
theological_decisions:
- issue: Tafsiri ya κύριος katika mazingira ya kiuchumi ya mfano
  choice: bwana
  alternative: Bwana; mkuu
  rationale: Mhusika anayerejelewa ni mkuu wa kibinadamu wa msimamizi, si jina la cheo cha Mungu au la Kristo. Herufi ndogo na tanbihi huzuia maana ya kimungu kuingizwa, huku “bwana” ikihifadhi uhusiano wa kijamii uliomo katika neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mmoja mmoja” ni ya kawaida na huhifadhi nguvu ya ugawaji; “wale waliokuwa na deni” ni wazi zaidi kwa wasomaji wa kawaida kuliko nomino nzito kama “wadeni.”
