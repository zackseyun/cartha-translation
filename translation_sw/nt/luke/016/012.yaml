base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: sw
  text: Na kama hamjawa waaminifu katika kilicho cha mwingine,[a][c] ni nani atakayewapa kilicho chenu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali ya mwingine.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kile kilicho chenu wenyewe.”
    reason: lexical_alternative
  - marker: c
    text: Huenda tofauti hii ikawa kati ya kuwa waaminifu katika mali ya dunia sasa na kupokea utajiri wa kweli au wa kudumu baadaye; aya yenyewe haitaji wazi vitu vinavyorejelewa.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ
  choice: Na kama
  rationale: Huhifadhi uhusiano na kauli iliyotangulia na kuanzisha sharti kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ ἀλλοτρίῳ
  choice: katika mali ya mwingine
  rationale: Kivumishi cha Kiyunani kilichotumika kama nomino humaanisha kitu kilicho cha mwingine. 'Mali ya mwingine' ni ya asili katika Kiswahili na inafaa muktadha wa uwakili bila kutaja mali hiyo hasa.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: hamjawa waaminifu
  rationale: Hapa πιστός hueleza uaminifu na kutegemeka katika uwakili, si tendo la kuamini; muundo huu pia unaakisi wazo la kutokuwa au kutothibitika kuwa waaminifu.
- source_word: τὸ ὑμέτερον
  choice: mali iliyo yenu wenyewe
  rationale: Huhifadhi tofauti ya kimilikaji kati ya kilicho cha mwingine na kilicho chenu, huku nomino 'mali' ikikamilisha sentensi kwa Kiswahili cha asili.
- source_word: τίς δώσει ὑμῖν
  choice: ni nani atakayewapa
  rationale: Huhifadhi swali la balagha na maana ya kawaida ya δίδωμι, 'kutoa/kupa,' bila kuibadili kuwa 'kukabidhi' kwa tafsiri ya muktadha.
theological_decisions:
- issue: Utambulisho wa 'mali ya mwingine' na 'mali iliyo yenu wenyewe'
  choice: Kuacha marejeo hayo bila kutambulishwa wazi katika matini kuu.
  alternative: Kuyataja moja kwa moja kuwa mali ya dunia dhidi ya utajiri wa kweli, au uwakili wa sasa dhidi ya urithi wa wakati ujao.
  rationale: Aya yenyewe inaweka tofauti hiyo lakini haitaji kwa uwazi vitu vinavyorejelewa. Tafsiri inadumisha utata na mvutano huo badala ya kuamua maana finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Mali' inatumika kwa upana, bila kuifunga maana kwenye fedha pekee. Alama zote za tanbihi zimewekwa katika matini kuu.
