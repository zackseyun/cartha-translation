  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: sw
  text: Hakuna mtumishi wa nyumbani anayeweza kuwatumikia mabwana wawili; kwa maana ama atamchukia mmoja na kumpenda mwingine, au atashikamana na mmoja na kumdharau mwingine. Hamwezi kumtumikia Mungu na Mamona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali” au “fedha.” Kigiriki kinatumia Mamona, neno linalomaanisha utajiri na ambalo hapa linaonyeshwa kama bwana mshindani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: mtumishi wa nyumbani
  rationale: Neno hili humaanisha mtumishi aliye katika nyumba, kwa hiyo tafsiri hii inahifadhi mazingira ya utumishi wa nyumbani bila kulipanua kuwa neno la jumla tu.
- source_word: κυρίοις
  choice: mabwana
  rationale: Katika mfano huu neno linawahusu wale wenye mamlaka juu ya mtumishi. ‘Mabwana’ linafaa katika mazingira hayo na kudumisha wazo la mamlaka pinzani.
- source_word: δουλεύειν
  choice: kuwatumikia / kumtumikia
  rationale: Kitenzi hiki kina maana ya kutumikia chini ya mamlaka ya mwingine. ‘Kutumikia’ ni cha kawaida na kinaendeleza ulinganifu kati ya mabwana wawili, Mungu, na Mamona.
- source_word: μισήσει
  choice: atamchukia
  rationale: Huhifadhi nguvu ya kawaida ya kitenzi cha Kigiriki na upinzani wake wa moja kwa moja na ‘kumpenda,’ bila kuupunguza kuwa kupenda kwa kiwango kidogo.
- source_word: ἀγαπήσει
  choice: kumpenda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi ulinganifu wa kimakusudi na ‘atamchukia.’
- source_word: ἀνθέξεται
  choice: atashikamana na
  rationale: Hueleza kushikilia kwa uthabiti na kuwa mwaminifu kwa upande mmoja, huku ikidumisha picha hai ya kitenzi cha Kigiriki.
- source_word: καταφρονήσει
  choice: kumdharau
  rationale: Huwasilisha wazo la kumwona mwingine kuwa hafai au wa thamani ndogo, na hudumisha ukali wa tofauti iliyokusudiwa.
- source_word: θεῷ
  choice: Mungu
  rationale: Ni rejeo la wazi kwa Mungu kama yule anayetumikiwa.
- source_word: μαμωνᾷ
  choice: Mamona
  rationale: Kutunza jina hili la mkopo kunahifadhi uhuishaji wa mali kama bwana mshindani; tanbihi inaeleza maana yake kwa msomaji wa sasa.
theological_decisions:
- issue: Tafsiri ya μαμωνᾷ inapowekwa kinyume na θεῷ
  choice: Mamona
  alternative: mali; fedha
  rationale: ‘Mamona’ hudumisha namna mali inavyoonyeshwa kwa usemi kama bwana anayeshindana na Mungu. Haimaanishi kwa lazima kuwa Mamona ni mungu halisi; ni uhuishaji wa mali kama nguvu inayodai utii.
- issue: Umoja wa mfano wa mtumishi
  choice: mmoja / mwingine pamoja na viambishi vya ngeli ya mtu
  alternative: kurudia ‘mtumishi’ katika kila kishazi
  rationale: Kigiriki kinatumia umoja wa kiwakilishi katika kauli ya jumla. Kiswahili huuhifadhi kiasili kwa viambishi vya ngeli ya mtu bila kulazimika kutaja jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kueleweka kwa wasomaji wa kawaida; ‘ama ... au’ huhifadhi mfuatano wa hoja, na ‘Mamona’ linafafanuliwa kwa tanbihi.
