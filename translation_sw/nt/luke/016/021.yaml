  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: sw
  text: akitamani kushibishwa na vile vilivyokuwa vikianguka kutoka mezani pa yule tajiri.[a] Lakini hata mbwa walikuwa wakija na kuziramba vidonda vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na makombo yaliyokuwa yakianguka kutoka mezani pa yule tajiri.” Kigiriki kinasema kihalisi “na vile vilivyokuwa vikianguka”; neno “makombo” linaeleweka kutokana na mazingira ya chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: akitamani
  rationale: Kitenzi cha hali endelevu kinaonyesha tamanio lake lililoendelea; “akitamani” ni cha kawaida na kina nguvu inayofaa bila kutia chumvi.
- source_word: χορτασθῆναι
  choice: kushibishwa
  rationale: Huhifadhi hali tendwa na wazo la kupata chakula cha kutosha, si kula tu.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: na vile vilivyokuwa vikianguka
  rationale: Huhifadhi matumizi ya kisifa yenye maana ya vitu na hali inayoendelea ya participio; neno “makombo” linaeleweka kutokana na mazingira lakini haliko wazi katika Kigiriki.
- source_word: ἀπὸ τῆς τραπέζης τοῦ πλουσίου
  choice: kutoka mezani pa yule tajiri
  rationale: Ni Kiswahili cha asili kinachoonyesha chanzo, yaani meza ya tajiri aliyetajwa katika muktadha.
- source_word: ἀλλὰ καὶ
  choice: Lakini hata
  rationale: Huwasilisha utofautishaji pamoja na jambo la kushangaza linaloongezwa.
- source_word: οἱ κύνες
  choice: mbwa
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi bila kuifafanua zaidi ya chanzo.
- source_word: ἐρχόμενοι
  choice: walikuwa wakija
  rationale: Muundo endelevu unaifanya participio isikike kwa kawaida katika Kiswahili na kuiunganisha na tendo kuu.
- source_word: ἐπέλειχον
  choice: kuziramba
  rationale: Ikiunganishwa na “walikuwa wakija,” huwasilisha tendo lililorudiwa au kuendelea; kiambishi “zi-” hurejelea vidonda.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: vidonda vyake
  rationale: “Vidonda” ni neno la kawaida na linaloeleweka kwa majeraha au malengelenge yaliyo wazi, bila kuwa la kitabibu kupita kiasi.
