  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: sw
  text: Nimejua nitakalofanya, ili nitakapoondolewa katika usimamizi, wanipokee nyumbani mwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Nimejua
  rationale: Kauli ya wakati uliopita hapa inaonyesha kufikia ufahamu au uamuzi wa ghafla. “Nimejua” ni ya asili katika Kiswahili na hudokeza kwamba sasa amepata la kufanya.
- source_word: τί ποιήσω
  choice: nitakalofanya
  rationale: Muundo huu unaonyesha tendo analolifikiria na ambalo sasa ameamua kulifanya; “nitakalofanya” ni wazi na wa kawaida katika Kiswahili.
- source_word: ἵνα ὅταν
  choice: ili nitakapo-
  rationale: “Ili” huhifadhi kusudi, na “nitakapo-” huonyesha tukio la wakati ujao linalotarajiwa.
- source_word: μετασταθῶ
  choice: nitakapoondolewa
  rationale: Kitenzi tendwa humaanisha kuondolewa kutoka cheo au wajibu. Tafsiri hii inahifadhi upana wa neno bila kulifanya moja kwa moja kuwa kufukuzwa.
- source_word: ἐκ τῆς οἰκονομίας
  choice: katika usimamizi
  rationale: Hapa οἰκονομία ni wadhifa au jukumu la kusimamia mali ya nyumba. “Usimamizi” ni lugha ya sasa na haileti maana ya kiuchumi isiyokusudiwa.
- source_word: δέξωνταί με
  choice: wanipokee
  rationale: δέχομαι hapa ni kumpokea mtu kwa kumpa mahali pa kukaa; “wanipokee” huhifadhi maana hiyo bila kuongeza kiwango cha ukarimu kisichotajwa.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: nyumbani mwao
  rationale: Katika muktadha wa kumpa mtu makao, “nyumbani mwao” ni Kiswahili cha asili na huwakilisha pia kiwakilishi cha kurejelea wenyewe.
theological_decisions: []
