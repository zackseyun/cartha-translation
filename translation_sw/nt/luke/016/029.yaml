base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: sw
  text: Lakini Abrahamu akasema, “Wana Musa na Manabii[a]; wawasikilize[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Musa na Manabii” inarejelea ushuhuda wa Maandiko unaohusishwa na Musa na vitabu vya kinabii.
    reason: cross_reference
  - marker: b
    text: 'Au, kwa karibu zaidi: “wawasikie.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Lakini ... akasema
  rationale: δέ inaonyesha tofauti ndogo katika jibu, hivyo “Lakini” inafaa katika muktadha. Wakati uliopo wa kihistoria wa λέγει umetafsiriwa kwa wakati uliopita, ambao ni wa kawaida katika masimulizi ya Kiswahili.
- source_word: Ἀβραάμ
  choice: Abrahamu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: Ἔχουσι
  choice: Wanao
  rationale: Hueleza kwamba ndugu hao tayari wana ufikiaji wa ushuhuda unaotajwa; “wanao” ni usemi mfupi na wa asili katika Kiswahili.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Musa na Manabii
  rationale: Usemi halisi umehifadhiwa badala ya kupanuliwa kuwa “Sheria ya Musa na Manabii.” Katika muktadha huu ni njia ya kurejelea ushuhuda wa Maandiko unaohusishwa na Musa na vitabu vya kinabii.
- source_word: ἀκουσάτωσαν
  choice: wawasikilize
  rationale: Hili ni agizo la nafsi ya tatu wingi. “Wawasikilize” linaonyesha si kusikia sauti tu, bali kuusikiliza na kuutilia maanani ushuhuda wao.
- source_word: αὐτῶν
  choice: wa- katika “wawasikilize”
  rationale: Kiwakilishi kimerejelewa kwa kiambishi cha yambwa “wa-,” kinachorudi kwa Musa na Manabii bila kufafanua zaidi ya Kigiriki.
theological_decisions:
- issue: Kinachorejelewa na “Musa na Manabii”
  choice: Usemi umehifadhiwa katika matini kama ulivyo, huku tanbihi ikieleza kuwa unarejelea ushuhuda wa Maandiko.
  alternative: Kutafsiri moja kwa moja kuwa “Sheria ya Musa na vitabu vya Manabii.”
  rationale: Katika matumizi ya Kiyahudi na ya Luka, usemi huu kwa kawaida hurejelea Maandiko. Hata hivyo, tafsiri haipanui usemi huo ndani ya matini, hivyo inahifadhi sitiari ya asili na kuepuka kuufafanua kupita kiasi.
- issue: Nguvu ya ἀκουσάτωσαν
  choice: 'Agizo: “na wawasikilize.”'
  alternative: 'Kauli ya ushauri: “wanapaswa kuwasikiliza.”'
  rationale: Umbo la Kigiriki ni amri ya nafsi ya tatu, kwa hiyo tafsiri inadumisha nguvu yake ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi, na wa kawaida kwa wasomaji wa leo. “Wanao” ni muundo wa asili unaoepusha urudiaji mzito, na “wawasikilize” hudumisha agizo pamoja na wazo la kuzingatia ushuhuda.
