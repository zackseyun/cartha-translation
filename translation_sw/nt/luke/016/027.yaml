id: LUK.16.27
reference: Luke 16:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: sw
  text: Ndipo akasema, “Basi, nakuomba[a], baba, umtume nyumbani kwa baba yangu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nakusihi.” Kitenzi cha Kigiriki kinaweza kueleza ombi la dhati, ingawa maana yake ya msingi hapa ni “nakuomba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ndipo akasema
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; “ndipo” hutoa mtiririko wa kawaida wa Kiswahili bila kuipa maana nzito ya upinzani.
- source_word: Ἐρωτῶ
  choice: nakuomba
  rationale: ἐρωτάω humaanisha kuomba au kutoa ombi. Katika muktadha huu “nakuomba” huwasilisha ombi la dhati kwa Kiswahili cha kawaida bila kulifanya kuwa kusihi kupita kiasi.
- source_word: σε οὖν
  choice: Basi, nakuomba
  rationale: οὖν huonyesha hitimisho au mwendelezo unaotokana na jibu lililotangulia; “basi” huhifadhi uhusiano huo kwa njia ya asili katika Kiswahili.
- source_word: πάτερ
  choice: baba
  rationale: Ni nomino ya kumwita Abrahamu kama babu wa ukoo katika mfano, si jina la Mungu.
- source_word: ἵνα πέμψῃς
  choice: umtume
  rationale: Baada ya kitenzi cha kuomba, ἵνα pamoja na hali tegemezi huonyesha jambo linaloombwa. Muundo “nakuomba ... umtume” ni wa asili na sahihi katika Kiswahili.
- source_word: αὐτὸν
  choice: -m- (umtume)
  rationale: Kiwakilishi kinamrejelea Lazaro katika muktadha uliotangulia na kimewakilishwa kwa kiambishi cha yambwa -m-.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: nyumbani kwa baba yangu
  rationale: οἶκος hapa ni nyumba au makao ya familia. “Nyumbani kwa baba yangu” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali anakopelekwa.
theological_decisions:
- issue: Nomino ya mwito πάτερ katika mfano
  choice: baba
  alternative: Baba
  rationale: Msemaji anamwita Abrahamu baba wa ukoo, si Mungu. Herufi ndogo huepuka kuingiza maana ya cheo cha Mungu ambayo haijaonyeshwa na maandishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ndipo” na “basi” zimetumika kwa kazi tofauti: ya kwanza kuendeleza simulizi, ya pili kuonyesha uhusiano wa ombi na jibu lililotangulia.'
