  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: sw
  text: Yesu pia alikuwa akiwaambia wanafunzi, “Kulikuwa na mtu mmoja tajiri aliyekuwa na msimamizi[a]. Msimamizi huyo alishtakiwa mbele ya tajiri kwa madai kwamba alikuwa akitapanya mali za tajiri huyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtunzaji wa nyumba au mali”; yaani, mtu aliyekabidhiwa kusimamia nyumba au mali ya mwingine.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliripotiwa kwa tajiri” au “alisemewa vibaya mbele yake.” Neno la Kigiriki linaweza kumaanisha shtaka au taarifa mbaya; halionyeshi lenyewe kwamba shtaka hilo lilikuwa limethibitishwa.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Pia akawaambia
  rationale: Kauli hii inaonyesha mpito na kwamba Yesu aliendelea kusema pia na wanafunzi. Muundo wa Kiswahili wa ‘akawaambia’ unaendeleza simulizi kwa ufasaha bila kurudia kitenzi kisaidizi kwa namna isiyo ya kawaida.
- source_word: πρὸς τοὺς μαθητάς
  choice: wanafunzi
  rationale: Chanzo kinasema ‘wanafunzi’ bila kiwakilishi cha umilikaji; tafsiri haiongezi ‘wake.’
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Kulikuwa na mtu mmoja tajiri
  rationale: Huu ni utangulizi wa kawaida wa mhusika katika mfano; ‘mmoja’ huhifadhi maana ya mtu fulani bila kumtambulisha zaidi.
- source_word: οἰκονόμον
  choice: msimamizi
  rationale: Neno hili humaanisha mtu aliyekabidhiwa usimamizi wa nyumba, mali, au shughuli za mwenye mali. ‘Msimamizi’ ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: διεβλήθη αὐτῷ
  choice: akashtakiwa mbele ya tajiri
  rationale: Kitenzi kinaweza kumaanisha kushtaki, kushutumu, au kutoa taarifa mbaya dhidi ya mtu kwa mwingine. Kauli hii huhifadhi wazo la shtaka lililofikishwa kwa tajiri bila kudai kwamba lilikuwa limethibitishwa.
- source_word: ὡς διασκορπίζων
  choice: kwa madai kwamba alikuwa akitapanya
  rationale: ‘Kwa madai kwamba’ huonyesha yaliyomo katika shtaka na huacha wazi kama shtaka hilo lilikuwa la kweli. ‘Akitapanya’ linafaa kwa matumizi mabaya ya mali.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: mali yake
  rationale: Kirai hiki kinarejelea mali ya tajiri. ‘Mali yake’ ni tafsiri pana, ya kawaida, na inayofaa katika muktadha huu.
