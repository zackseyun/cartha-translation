  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: sw
  text: Mafarisayo, waliokuwa wapenda fedha, walikuwa wakiyasikia mambo hayo yote, nao walikuwa wakimdhihaki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakimkejeli kwa dharau.” Kitenzi hiki kinaweza kumaanisha dhihaka ya wazi au kejeli yenye dharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: walikuwa wakiyasikia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huo, kulingana na hali ya kitenzi cha Kigiriki cha wakati uliopita usiotimilika.
- source_word: δὲ
  choice: nao
  rationale: Hapa δέ ni kiunganishi chepesi cha simulizi, si alama ya upinzani mkali; “nao” huendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: ταῦτα πάντα
  choice: mambo hayo yote
  rationale: Hurejelea mafundisho yote ya Yesu yaliyotangulia na kuhifadhi maana ya kiwakilishi pamoja na πᾶς.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili la Kiyahudi katika Kiswahili.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: waliokuwa wapenda fedha
  rationale: Tafsiri hii hutaja wazi kupenda fedha kama sifa yao, bila kuipanua kuwa hukumu ya jumla kama “wenye tamaa.”
- source_word: ἐξεμυκτήριζον
  choice: walikuwa wakimdhihaki
  rationale: Muundo unaonyesha dhihaka iliyokuwa ikiendelea au kurudiwa; “kumdhihaki” huwasilisha kejeli yenye dharau kwa lugha inayoeleweka.
- source_word: αὐτόν
  choice: -m- katika “wakimdhihaki”
  rationale: Kiambishi cha yambwa kinamrejelea Yesu, kama αὐτόν katika muktadha.
theological_decisions:
- issue: Sifa ya Mafarisayo katika φιλάργυροι
  choice: wapenda fedha
  alternative: wenye tamaa
  rationale: Kigiriki kinataja hasa kupenda fedha. Tafsiri hii inadumisha uhusiano na mafundisho ya Yesu kuhusu mali bila kuingiza maana pana isiyotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Miundo “walikuwa wakiyasikia” na “walikuwa wakimdhihaki” imetumiwa kuhifadhi hali endelevu ya vitenzi vya Kigiriki, ingawa marudio hayo ni mazito kidogo kuliko simulizi la mazungumzo ya kila siku.
