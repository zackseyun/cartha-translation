  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: sw
  text: Akawaambia, “Ninyi ndio mnajihesabia haki mbele ya watu[a], lakini Mungu anaijua mioyo yenu. Kwa maana kile kinachotukuzwa miongoni mwa watu[b] ni chukizo[c] mbele za Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnajionyesha kuwa wenye haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kile kinachothaminiwa sana na watu.”
    reason: alternative_reading
  - marker: c
    text: Au, “kitu cha kuchukiza sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: mnaojionyesha kuwa wenye haki
  rationale: Katika muktadha huu, usemi huo unaonyesha kwamba wanajidhihirisha mbele ya wengine kana kwamba ni wenye haki. Tafsiri hii ni ya kawaida katika Kiswahili na haidai kwamba kwa kweli wanajifanya wenye haki mbele za Mungu.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: Huhifadhi maana ya kuwa mbele au machoni pa wanadamu; “watu” hutoa kwa kawaida maana jumuishi ya ἀνθρώπων katika Kiswahili.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: anaijua mioyo yenu
  rationale: Huhifadhi taswira ya kibiblia ya moyo kama kiini cha nia na mawazo ya ndani. Kitenzi cha umoja “anaijua” kinakubaliana na nomino ya ngeli ya 4 “mioyo” katika matumizi ya kawaida.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: kile kinachotukuzwa miongoni mwa watu
  rationale: Huhifadhi taswira ya kitu kilichoinuliwa au kutukuzwa kijamii, bila kuifunga maana kwa kuthaminiwa tu.
- source_word: βδέλυγμα
  choice: chukizo
  rationale: “Chukizo” ni neno lenye nguvu, la asili katika Kiswahili, linalomaanisha kitu kinachochukiza sana mbele za Mungu.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Huhifadhi utofautishaji kati ya jinsi watu wanavyohukumu na jinsi Mungu anavyoona.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Ninyi ndio mnao...
  rationale: Muundo huu huwasilisha msisitizo wa kiwakilishi na wa shtaka uliomo katika Kigiriki.
theological_decisions:
- issue: Maana ya δικαιοῦντες ἑαυτούς
  choice: mnaojionyesha kuwa wenye haki
  alternative: mnajihesabia haki
  rationale: Muktadha unahusu kujionyesha kuwa waadilifu mbele ya watu, lakini kauli ya Kigiriki pia inaweza kutafsiriwa kwa namna iliyo rasmi zaidi kuwa kujihesabia au kujitangaza kuwa na haki. Maelezo ya chini yanahifadhi uwezekano huo.
- issue: Nguvu ya maana ya τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: kile kinachotukuzwa miongoni mwa watu
  alternative: kile kinachothaminiwa sana na watu
  rationale: “Kinachotukuzwa” huhifadhi sitiari ya kuinuliwa; mbadala hueleza wazi zaidi wazo la kuthaminiwa kijamii bila kuufanya kuwa maana pekee.
- issue: Nguvu ya neno βδέλυγμα
  choice: chukizo
  alternative: kitu cha kuchukiza sana
  rationale: “Chukizo” huhifadhi uzito wa hukumu ya Mungu kwa lugha fupi na yenye hadhi, huku mbadala ukifafanua maana yake kwa msomaji wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi msisitizo wa Kigiriki na utofautishaji kati ya hukumu ya watu na ujuzi wa Mungu.
