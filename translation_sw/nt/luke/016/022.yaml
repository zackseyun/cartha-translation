  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: sw
  text: Ikawa yule maskini akafa, akachukuliwa na malaika hadi kifuani mwa Abrahamu[a]. Yule tajiri naye akafa, akazikwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kando ya Abrahamu.” Maneno ya Kigiriki yana maana halisi ya “kifuani mwa Abrahamu,” taswira ya ukaribu, heshima, na ushirika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: Ikawa ... akafa
  rationale: Muundo wa kisimulizi wa Luka ἐγένετο pamoja na kitenzi-jina unaonyeshwa kwa Kiswahili cha kawaida kama “Ikawa ... akafa,” ukihifadhi mpito wa simulizi bila kuongeza neno la wakati lisilokuwapo wazi katika Kigiriki.
- source_word: τὸν πτωχὸν
  choice: yule maskini
  rationale: πτωχός humaanisha mtu maskini au asiye na kitu. “Yule maskini” ni ya asili katika muktadha huu na haiingizi wazo mahsusi la kuombaomba.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: akachukuliwa na malaika
  rationale: Kauli tendwa na mtendaji wake imehifadhiwa kwa namna ya kawaida ya Kiswahili; “malaika” hapa ina rejeo maalumu kutokana na muktadha hata bila kiambishi bainishi tofauti.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: mpaka kifuani pa Abrahamu
  rationale: κόλπος ni kifua au sehemu ya karibu kando ya mtu. “Kifuani pa Abrahamu” huhifadhi taswira halisi na ukaribu unaodokezwa, huku ufafanuzi wa “kando ya Abrahamu” ukiwekwa katika tanbihi.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Yule tajiri naye akafa
  rationale: “Naye” huwakilisha καί na kuonyesha kwa kawaida ulinganifu kwamba tajiri pia alikufa.
- source_word: ἐτάφη
  choice: akazikwa
  rationale: Hili ni neno la moja kwa moja na la kawaida kwa kauli tendwa ya θάπτω, na linaendeleza mtiririko mfupi wa simulizi.
theological_decisions:
- issue: Maana ya εἰς τὸν κόλπον Ἀβραάμ
  choice: mpaka kifuani pa Abrahamu
  alternative: mpaka kando ya Abrahamu
  rationale: Tafsiri ya karibu na maneno ya asili huhifadhi taswira yenye uzito wa kitamaduni na kiteolojia bila kuigeuza moja kwa moja kuwa maelezo ya jumla kuhusu hali ya baada ya kifo. Tanbihi inaeleza maana ya kiidioma ya ukaribu, heshima na ushirika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ikawa ...” unafaa kwa simulizi la kibiblia bila kuwa mgumu kupita kiasi; “naye” huunganisha sentensi ya pili kwa mtiririko wa asili.
