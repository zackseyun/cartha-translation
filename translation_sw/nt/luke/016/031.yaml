id: LUK.16.31
reference: Luke 16:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: sw
  text: Lakini akamwambia, “Ikiwa hawawasikilizi Musa na Manabii[a], hawatashawishika hata mtu akifufuka kutoka kwa wafu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawawasikii” au “hawawatii.” Kitenzi cha Kigiriki kinaweza kujumuisha kusikia na kutoa uangalifu unaoitikia.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “akifufuka kutoka miongoni mwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Lakini akamwambia
  rationale: ‘Lakini’ linahifadhi mgeuko mdogo wa kupingana unaoletwa na δέ, na ‘akamwambia’ ni Kiswahili cha kawaida kwa εἶπεν αὐτῷ.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Musa na Manabii
  rationale: Usemi huu unarejelea ushuhuda wa Maandiko uliotambuliwa katika Israeli. Herufi kubwa katika ‘Manabii’ inaashiria sehemu inayotambuliwa ya Maandiko bila kuibadili kuwa ufafanuzi wa moja kwa moja.
- source_word: οὐκ ἀκούουσιν
  choice: hawawasikilizi
  rationale: ἀκούω hapa inaweza kujumuisha kusikia na kutoa uangalifu unaoitikia. ‘Kusikiliza’ huhifadhi upana huo bila kuufanya moja kwa moja kuwa ‘kutii’.
- source_word: οὐδ’ ἐάν
  choice: hawatashawishika hata ... akifufuka
  rationale: Muundo wa ‘hata ...’ unaendeleza na kutilia nguvu ukanushaji wa kisharti kwa Kiswahili cha asili.
- source_word: τις
  choice: mtu
  rationale: ‘Mtu’ ni njia ya kawaida na isiyo maalumu ya kutafsiri kiwakilishi hiki cha umoja.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huhifadhi wazo la kufufuka kutoka miongoni mwa waliokufa kwa usemi wa Kiswahili unaoeleweka.
- source_word: ἀναστῇ
  choice: akifufuka
  rationale: Katika muktadha huu ἀνίστημι ni lugha ya ufufuo; umbo la ‘aki-’ huwasilisha sharti la ἐάν pamoja na subjunktivu kwa ufasaha.
- source_word: πεισθήσονται
  choice: hawatashawishika
  rationale: ‘Kushawishika’ hudumisha maana ya kupatikana na ushawishi au kusadikishwa bila kuibana kuwa imani ya wokovu au toba.
theological_decisions:
- issue: Maana ya ‘Musa na Manabii’
  choice: Usemi unaorejelea ushuhuda wenye mamlaka wa Maandiko ambao Israeli tayari walikuwa wamepewa
  alternative: Rejeleo finyu kwa Musa na manabii kama watu binafsi pekee
  rationale: Katika muktadha, usemi huu unafanya kazi kama njia ya kurejelea ushuhuda wa Maandiko. Tafsiri inadumisha usemi wenyewe badala ya kuufafanua moja kwa moja kuwa ‘Maandiko’.
- issue: Nguvu ya πεισθήσονται
  choice: Kushawishika au kusadikishwa kwa maana ya jumla
  alternative: Kuamini kwa maana maalumu ya kitheolojia, au kutubu
  rationale: Kitenzi cha Kigiriki kinaonyesha kushawishika au kusadikishwa; tafsiri haiongezi itikio mahususi la wokovu ambalo neno lenyewe halitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hawawasikilizi’ ni cha kawaida na hudumisha utata kati ya kusikia na kuitikia. ‘Hawatashawishika’ ni sahihi lakini rasmi kiasi kinachofaa kwa matini ya Biblia.
