  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: sw
  text: Kisha akamwambia mwingine, ‘Na wewe, una deni la kiasi gani?’ Naye akasema, ‘Kori[a] mia moja za ngano.’ Anamwambia, ‘Chukua hati yako ya deni[b], uandike themanini.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kori ilikuwa kipimo kikubwa cha kale cha vitu vikavu, kama nafaka.
    reason: cultural_note
  - marker: b
    text: Au “hati zako” au “maandishi yako”; Kigiriki ni “maandishi,” kikirejelea hapa hati iliyoandikwa ya deni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα ἑτέρῳ εἶπεν
  choice: Kisha akamwambia mwingine
  rationale: Inaonyesha mfuatano wa simulizi na mtu mwingine tofauti na mdaiwa wa kwanza, bila kuongeza kwamba alikuwa mwanamume.
- source_word: Σὺ δὲ πόσον ὀφείλεις
  choice: Na wewe, una deni la kiasi gani?
  rationale: “Na wewe” inadumisha mkazo wa kiwakilishi na mpito wa δέ; “una deni la kiasi gani?” ni Kiswahili cha kawaida kinachoeleza wazi deni la kifedha.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Kori mia moja za ngano
  rationale: “Kori” linahifadhi jina la kipimo mahususi cha kale badala ya kulifanya kipimo kisicho maalumu; σίτου hapa ni ngano.
- source_word: λέγει αὐτῷ
  choice: Anamwambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umehifadhiwa ili kudumisha uhai wa simulizi, ingawa vitenzi vilivyotangulia viko katika wakati uliopita.
- source_word: Δέξαι σου τὰ γράμματα
  choice: Chukua hati yako ya deni
  rationale: Katika muktadha huu, “maandishi” ni hati inayoonyesha deni. Umoja wa kimatumizi ni wa asili katika Kiswahili, huku tanbihi ikihifadhi maana halisi ya wingi.
- source_word: γράψον ὀγδοήκοντα
  choice: uandike themanini
  rationale: Inadumisha amri ya kuandika kiasi kipya bila kuongeza maelezo yasiyotajwa wazi katika Kigiriki.
