  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: sw
  text: Kila mtu anayempa talaka mke wake na kuoa mwanamke mwingine anazini; na mtu anayemwoa mwanamke aliyepewa talaka na mume anazini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Kila mtu anaye-
  rationale: Muundo huu unaweka kauli ya jumla inayomhusu kila atendaye jambo hilo; Kiswahili hiki ni cha kawaida na kinahifadhi upeo wa jumla.
- source_word: ἀπολύων
  choice: anayemwacha
  rationale: Katika muktadha wa ndoa, kitenzi hiki humaanisha kumwacha au kumpa talaka mwenzi. ‘Kumwacha mke’ ni usemi wa kawaida wa Kibiblia na wa Kiswahili unaoeleweka kama kuvunja ndoa katika muktadha huu.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: mke wake
  rationale: γυνή hapa humaanisha mke, si mwanamke kwa ujumla, kwa kuwa kauli inahusu ndoa na kuachana.
- source_word: γαμῶν ἑτέραν
  choice: kumwoa mwingine
  rationale: Kiswahili huweza kutumia ‘mwingine’ bila kurudia ‘mwanamke’; maana ya kumwoa mwanamke mwingine iko wazi na ἑτέραν inahifadhiwa kama ‘mwingine.’
- source_word: μοιχεύει
  choice: anazini
  rationale: Kitenzi cha Kiswahili ‘kuzini’ ni sawia ya moja kwa moja, ya kawaida na yenye uzito unaofaa kwa tendo la uzinzi.
- source_word: ἀπολελυμένην
  choice: mwanamke aliyeachwa
  rationale: Kauli ya kutendwa yenye hali timilifu inaonyesha mwanamke aliye katika hali ya kuwa amewekwa mbali na ndoa; ‘aliyeachwa’ huhifadhi hali hiyo bila kumfanya yeye kuwa mtendaji.
- source_word: ἀπὸ ἀνδρὸς
  choice: na mumewe
  rationale: Katika muktadha huu ἀνήρ ni ‘mume.’ Ingawa ἀπό kwa umbo la Kigiriki ni ‘kutoka kwa,’ Kiswahili cha kawaida hueleza mtendaji wa kuachwa kwa ‘na’; ‘mumewe’ pia huweka wazi uhusiano unaokusudiwa.
theological_decisions:
- issue: Upeo na nguvu ya kauli ya Yesu kuhusu kuachana na kuoa tena
  choice: Kauli imetafsiriwa kama tamko la jumla la kimaadili bila kuongeza masharti ya kipekee yasiyomo katika mstari huu.
  alternative: Kuongeza kwa kudokeza ruhusa au hali ya kipekee kutoka vifungu vingine, au kuifanya ihusu tu aina fulani ya talaka haramu.
  rationale: Luka anatoa kauli fupi na ya jumla. Tafsiri inapaswa kuhifadhi maneno na mvutano wa mstari huu bila kuupatanisha kimya kimya na maelezo ya vifungu vingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Anazini’ ni fupi na ya asili kuliko ‘anafanya uzinzi.’ Hakuna tanbihi iliyohitajika, kwa kuwa maana ya miundo ya Kigiriki inaweza kuwasilishwa wazi katika matini kuu.
