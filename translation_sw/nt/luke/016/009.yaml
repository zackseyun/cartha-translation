  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: sw
  text: 'Nami nawaambia: Jifanyieni marafiki kwa kutumia mali ya udhalimu[a], ili itakapokwisha[b], wawakaribishe katika makao ya milele[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutokana na mamona wa udhalimu.” “Mamona” ni neno la jadi linalomaanisha mali au fedha.
    reason: lexical_alternative
  - marker: b
    text: Au “mtakapokufa” au “itakapowaishia.” Kitenzi cha Kigiriki kinaweza kueleweka kwa njia tofauti; wengi hukielewa kuwa mali inakwisha, lakini wengine hukielewa kuwa kifo cha mtu.
    reason: alternative_reading
  - marker: c
    text: Au “katika mahema ya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: Jifanyieni rafiki
  rationale: Huhifadhi amri pamoja na wazo la kujifanyia wenyewe, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: kwa kutumia mali isiyo ya haki
  rationale: Kirai “kwa kutumia” kinaonyesha matumizi ya mali kama njia ya kujipatia rafiki. “Mali isiyo ya haki” huhifadhi upana wa ἀδικία bila kuifupisha maana kuwa mali iliyopatikana kwa udanganyifu pekee.
- source_word: μαμωνᾶ
  choice: mali
  rationale: Neno hili la asili humaanisha mali au fedha. “Mali” linaeleweka kwa urahisi na halilazimishi uelewa wa Mamona kama nafsi katika mstari huu.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: ili itakapokwisha
  rationale: Kitenzi ni kisicho na yambwa na mhusika wake hajaelezwa wazi katika muundo wa Kigiriki. Muktadha unaelekeza kwa karibu zaidi kwenye mali inayokwisha; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: δέξωνται ὑμᾶς
  choice: wawakaribishe
  rationale: Kitenzi δέχομαι hapa kina wazo la kumpokea mtu kwa ukarimu mahali fulani. Mhusika wa “wa-” anaachwa bila kutajwa, kama ilivyo katika Kigiriki.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: katika makao ya milele
  rationale: Ingawa σκηναί kihalisi ni mahema, hapa yanatumiwa kwa maana ya mahali pa kukaa. “Makao” ni ya asili katika Kiswahili huku “mahema” yakihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya “mali isiyo ya haki”
  choice: Mali ya ulimwengu wa sasa yenye uhusiano na hali ya kutokuwa na haki, bila kudai kwamba kila mali hiyo ilipatikana kwa udanganyifu
  alternative: Mali iliyopatikana kwa njia ya udanganyifu; au Mamona aliyefanywa kama nafsi na kuwa bwana mpinzani
  rationale: Tafsiri inadumisha mvutano wa kirai cha Kigiriki na haipunguzi maana yake kuwa fedha za wizi pekee, wala hailazimishi uhuishaji kamili wa Mamona katika mstari huu.
- issue: Mhusika wa ἐκλίπῃ
  choice: Mali itakapokwisha
  alternative: Ninyi mtakapokufa; au rasilimali za kidunia kwa ujumla zitakapokwisha
  rationale: Mali ndiyo rejeleo la karibu zaidi, lakini muundo na tofauti ya usomaji inayoshuhudiwa huruhusu uelewa mwingine; huo umeonyeshwa katika tanbihi.
- issue: Utambulisho wa wale watakaowakaribisha
  choice: Umeachwa bila kufafanuliwa
  alternative: Rafiki waliopatikana kwa matumizi ya mali; maskini au watu wa Mungu; au viumbe wa mbinguni
  rationale: Kigiriki hakitaji wazi mhusika wa kitenzi δέξωνται. Kumtaja katika matini kuu kungeongeza tafsiri isiyoelezwa na chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku taswira na utata halisi wa chanzo vikihifadhiwa kwa tanbihi.
