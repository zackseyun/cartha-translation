base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: sw
  text: Yule bwana[a] akamsifu msimamizi asiye mwadilifu kwa sababu alitenda kwa werevu. Kwa maana wana wa wakati huu ni werevu zaidi katika kushughulika na kizazi chao wenyewe kuliko wana wa nuru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana akamsifu msimamizi asiye mwadilifu.” Katika muktadha wa mfano, neno la Kigiriki kwa kawaida humrejelea bwana wa msimamizi, wala si Yesu au Mungu moja kwa moja.
    reason: alternative_reading
  - marker: b
    text: 'Kwa karibu zaidi na Kigiriki: “wana wa wakati huu ni werevu zaidi kuliko wana wa nuru kwa kizazi chao wenyewe.” Kirai cha mwisho ni kigumu; kinaweza kumaanisha werevu wao katika mahusiano na watu wa kundi au kizazi chao wenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Katika muktadha wa ndani wa mfano, neno hili linamrejelea mwenye mali na mkuu wa msimamizi. Kiswahili “Bwana” linaweza kuonyesha uhusiano huo bila kulazimisha hapa kuwa cheo cha Yesu au Mungu; tanbihi inaweka wazi uwezekano wa kuelewa “Bwana” kama cheo.
- source_word: οἰκονόμον τῆς ἀδικίας
  choice: msimamizi asiye mwadilifu
  rationale: “Msimamizi” ni neno la sasa na linaloeleweka kwa msimamizi wa mali au nyumba. “Asiye mwadilifu” huhifadhi hukumu ya kimaadili ya ἀδικία bila kuibana kuwa aina moja tu ya udanganyifu.
- source_word: φρονίμως / φρονιμώτεροι
  choice: kwa busara / werevu zaidi
  rationale: Maneno haya yanaonyesha akili ya kimatendo na ujanja wa kufikia lengo, si lazima hekima yenye uadilifu. “Kwa busara” ni ya asili katika sentensi ya kwanza, huku “werevu zaidi” ikibainisha zaidi uhodari wa kimkakati katika ulinganisho bila kuhalalisha uovu.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: wana wa wakati huu
  rationale: Tafsiri hii huhifadhi sitiari ya Kisemiti na ulinganifu wake na “wana wa nuru.” “Wakati huu” huwakilisha αἰών kama kipindi au zama ya sasa, si ulimwengu wa kijiografia.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: wana wa nuru
  rationale: Huhifadhi picha ya chanzo na ulinganifu rasmi na “wana wa wakati huu,” ikiwataja wale wanaotambulishwa na nuru ya Mungu.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: katika kushughulika na kizazi chao wenyewe
  rationale: Kirai cha Kigiriki kina ugumu wa kisintaksia. Tafsiri hii huonyesha uhusiano au nyanja ambamo wana wa wakati huu hutenda kwa werevu, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na umbo la chanzo.
theological_decisions:
- issue: Utambulisho wa ὁ κύριος katika kishazi cha kwanza
  choice: Bwana wa msimamizi ndani ya mfano
  alternative: Bwana, yaani Yesu au Mungu, katika sauti ya msimulizi
  rationale: Muktadha wa karibu unamhusu tajiri mwenye msimamizi. Usomaji huu unaweka sifa ndani ya simulizi la mfano na hauashirii moja kwa moja kwamba Yesu anauhalalisha udhalimu; tanbihi inaonyesha utata wa neno “Bwana.”
- issue: Tathmini ya kimaadili ya tendo la msimamizi
  choice: Anasifiwa kwa busara au werevu wake wa kimkakati, si kwa kutokuwa mwadilifu
  alternative: Anasifiwa kwa hekima yenye uadilifu au udhalimu wake unaidhinishwa
  rationale: Andiko lenyewe linamwita msimamizi “asiye mwadilifu” lakini linasifu jinsi alivyotenda. Tafsiri huhifadhi mvutano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “wana wa...” umehifadhiwa ili kutunza sitiari na ulinganifu wa chanzo; kirai kigumu cha mwisho kimetolewa kwa Kiswahili kinachoeleweka, huku umbo la karibu zaidi na Kigiriki likiwekwa katika tanbihi.
