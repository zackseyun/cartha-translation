  naturalness: The Swahili is clear and appropriately formal. “Kukuhusu” is a more natural modern rendering than “juu yako” in this context, and “tena” directly expresses οὐκέτι/οὐ ... ἔτι under negation.
  terminology: “Msimamizi/usimamizi” is a suitable, non-sectarian rendering of the estate-manager terminology. The footnote alternative should retain the accounting sense of λόγος more explicitly.
