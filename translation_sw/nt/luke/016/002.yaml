base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: sw
  text: Basi akamwita na kumwambia, “Ni nini hiki ninachosikia kukuhusu? Toa hesabu ya usimamizi wako,[a] kwa maana huwezi tena kuwa msimamizi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Toa hesabu ya uwakili wako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana huwezi tena kusimamia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: akamwita
  rationale: Kauli ya aoristi ya hali inayotangulia kitenzi kikuu inaonyesha kwamba alimwita kwanza, kisha akasema; muundo huu ni wa asili katika Kiswahili.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Ni nini hiki ninachosikia juu yako?
  rationale: Inahifadhi nguvu ya swali la kukabili taarifa iliyosikiwa bila kuongeza kwamba taarifa hiyo tayari imethibitishwa.
- source_word: ἀπόδος τὸν λόγον
  choice: Toa hesabu
  rationale: Katika muktadha wa usimamizi, λόγος ni taarifa au hesabu inayotolewa ili kukaguliwa; ‘toa hesabu’ ni usemi wa kawaida na unaoeleweka.
- source_word: τῆς οἰκονομίας σου
  choice: ya usimamizi wako
  rationale: οἰκονομία hapa ni jukumu la kusimamia mali au nyumba ya mwingine. ‘Usimamizi’ ni neno la sasa na la kawaida, huku tanbihi ikionyesha maana inayohusiana na uwakili.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: kwa maana huwezi kuendelea kuwa msimamizi
  rationale: δύνῃ pamoja na kitenzi-jina huonyesha kutoweza, na ἔτι katika ukanushi humaanisha ‘tena/kuendelea.’ Muktadha unaonyesha si upungufu wa uwezo wa kimwili tu, bali kuondolewa katika jukumu hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Msimamizi/usimamizi’ limetumiwa kwa uthabiti kueleza jukumu la οἰκονόμος/οἰκονομία katika muktadha huu; ‘uwakili’ umehifadhiwa kama mbadala katika tanbihi.
