  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: sw
  text: Sheria na Manabii vilikuwapo mpaka wakati wa Yohana; tangu wakati huo, Ufalme wa Mungu unatangazwa kuwa habari njema, na kila mtu anajitahidi kuingia ndani yake kwa nguvu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu anasukuma kuingia ndani yake.” Kitenzi cha Kigiriki kinaweza kueleza mwendo wenye nguvu; hapa maneno hayo yanaonyesha juhudi kubwa na ya haraka ya kuingia katika Ufalme.
    reason: lexical_alternative
  - marker: b
    text: Baadhi huelewa sehemu ya mwisho kwa maana hasi zaidi kwa kuilinganisha na usemi unaofanana katika Mathayo 11:12. Hata hivyo, hapa kiima cha Kigiriki ni “kila mtu,” si “Ufalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: Sheria
  rationale: Katika muunganiko na “Manabii,” neno hili linataja Torati kama sehemu inayotambulika ya Maandiko, si sheria kwa ujumla.
- source_word: οἱ προφῆται
  choice: Manabii
  rationale: Ni jina la kawaida la kundi la Maandiko ya kinabii linapounganishwa na “Sheria.”
- source_word: μέχρι Ἰωάννου
  choice: mpaka wakati wa Yohana
  rationale: Huonyesha mpaka wa wakati; kuongeza “wakati wa” kunafanya maana ya muda iwe wazi na ya asili katika Kiswahili bila kubadili rejeo la Yohana Mbatizaji.
- source_word: ἀπὸ τότε
  choice: tangu wakati huo
  rationale: Huonyesha mwanzo wa kipindi kinachoendelea baada ya mpaka uliotajwa.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni usemi wa kawaida unaohifadhi upana wa maana ya βασιλεία, yaani utawala na eneo la kifalme.
- source_word: εὐαγγελίζεται
  choice: unatangazwa kuwa habari njema
  rationale: Huhifadhi hali ya kutendwa na maana ya kutangaza habari njema, badala ya kutumia tu “unahubiriwa,” ambalo linaweza kuficha kiini hicho.
- source_word: πᾶς
  choice: kila mtu
  rationale: 'Huwakilisha umoja wenye maana ya mgawanyo: kila mtu mmoja mmoja.'
- source_word: εἰς αὐτὴν
  choice: kuingia ndani yake
  rationale: Kihusishi εἰς kinaonyesha mwendo kuelekea ndani ya Ufalme; “yake” hurejelea Ufalme kwa kawaida katika Kiswahili.
- source_word: βιάζεται
  choice: anajitahidi kuingia ndani yake kwa nguvu
  rationale: Umbo hili lina utata wa kileksika, lakini pamoja na πᾶς na εἰς αὐτὴν linaelekea kueleza mwendo wa nguvu au juhudi kuingia Ufalmeni; tafsiri hii huhifadhi ukali wa kitenzi bila kudai kwamba mtu anajipatia wokovu kwa matendo.
theological_decisions:
- issue: Maana ya βιάζεται kuhusiana na Ufalme
  choice: Kila mtu anajitahidi kwa nguvu kuingia ndani ya Ufalme.
  alternative: Kila mtu anasukuma kuingia ndani yake; au, kwa uelewa hasi unaohusishwa na Mathayo 11:12, Ufalme unatendewa kwa nguvu.
  rationale: Katika Luka, kiima cha βιάζεται ni πᾶς (“kila mtu”), na εἰς αὐτὴν kwa kawaida huonyesha mwendo wa kuingia ndani yake. Hata hivyo, kitenzi kinaweza kuwa na wazo la nguvu au shinikizo, hivyo utata huo umeelezwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Herufi kubwa katika “Sheria,” “Manabii,” na “Ufalme” zinaonyesha majina ya makundi au dhana maalumu za kimaandiko. Muundo unabaki karibu na sentensi ya Kigiriki huku ukifafanua mpaka wa muda kwa “wakati wa Yohana.”
