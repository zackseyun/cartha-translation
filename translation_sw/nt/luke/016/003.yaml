id: LUK.16.3
reference: Luke 16:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: sw
  text: Kisha msimamizi[a] akajiambia, “Nitafanya nini, kwa kuwa bwana wangu ananiondolea usimamizi? Sina nguvu za kuchimba, nami ninaona aibu kuombaomba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msimamizi wa mali.” Neno la Kigiriki linalomaanisha mtu huyu na lile linalotafsiriwa “usimamizi” yana asili moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: msimamizi / usimamizi
  rationale: Maneno haya yanaonyesha mtu aliyekabidhiwa kusimamia mali au shughuli za mwingine na wajibu wake. Jozi hii ni ya kawaida katika Kiswahili na pia inadumisha uhusiano wa maneno yenye asili moja katika Kigiriki.
- source_word: ἐν ἑαυτῷ
  choice: akajiambia
  rationale: Hii ni nahau ya kusema moyoni au kujisemea; “akajiambia” ni Kiswahili cha kawaida na huonyesha wazi kuwa alikuwa akiwaza ndani yake.
- source_word: Τί ποιήσω
  choice: Nitafanya nini
  rationale: Kauli hii ni swali la kujadiliana nafsi kuhusu hatua ya baadaye; “Nitafanya nini” ni ya asili na ya sasa katika Kiswahili.
- source_word: κύριός μου
  choice: bwana wangu
  rationale: Katika muktadha huu κύριος ni mkuu wa kibinadamu mwenye mamlaka juu ya msimamizi, si jina la cheo cha Mungu. “Bwana wangu” huhifadhi uhusiano wa mamlaka bila kulazimisha maana ya kimungu.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: ananiondolea
  rationale: Kitenzi hiki huwasilisha kitendo cha kumpokonya au kumwondolea mtu kitu; umbo hili la Kiswahili huunganisha kwa kawaida maana ya ‘kuondoa kutoka kwangu.’
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Sina nguvu za kuchimba
  rationale: σκάπτειν ni kuchimba kihalisi, na ἰσχύω hapa inaangazia nguvu au uwezo wa kimwili. Tafsiri hii inadumisha yote mawili.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: ninaona aibu kuombaomba
  rationale: ἐπαιτεῖν humaanisha kuomba sadaka au riziki kwa wengine. “Kuombaomba” huitofautisha na kuomba kwa maana pana, huku “ninaona aibu” ikihifadhi hisia ya αἰσχύνομαι.
theological_decisions:
- issue: Maana ya κύριος katika mfano usiozungumzia moja kwa moja cheo cha kimungu
  choice: bwana wangu
  alternative: Bwana wangu; mwenye mali wangu
  rationale: Mhusika anayerejelewa ni tajiri mwenye mamlaka juu ya msimamizi. Herufi ndogo katika “bwana” na muktadha huonyesha kuwa si cheo cha kimungu; “mwenye mali” ingeifanya maana kuwa finyu kuliko neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. “Kuombaomba” limetumiwa kwa maana maalumu ya kuomba sadaka, si kutoa ombi la kawaida.
