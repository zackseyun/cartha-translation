base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: sw
  text: Kwa hiyo, ikiwa hamkuwa waaminifu katika mali isiyo ya haki[a], ni nani atakayewakabidhi mali ya kweli[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali ya udhalimu”; Kigiriki, “mamona wa udhalimu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kilicho cha kweli”; “mali” haikutajwa wazi katika Kigiriki, bali inaeleweka kwa kulinganishwa na mali isiyo ya haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: isiyo ya haki
  rationale: Neno ἄδικος lina maana ya kutokuwa na haki au uadilifu. Kauli hii inahifadhi uzito wa kimaadili bila kudai kwamba mali hiyo ilipatikana kwa udanganyifu.
- source_word: μαμωνᾷ
  choice: mali
  rationale: μαμωνᾶς humaanisha mali au utajiri kwa upana, si fedha taslimu pekee. “Mali” ni neno la kawaida na pana katika Kiswahili cha sasa.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: katika mali isiyo ya haki
  rationale: “Katika” linahifadhi picha ya eneo au mazingira ambamo uaminifu unaonyeshwa; katika Kiswahili kauli hii ni elewekevu na si ngumu kupita kiasi.
- source_word: πιστοὶ
  choice: waaminifu
  rationale: Katika muktadha wa usimamizi, πιστός hueleza watu wenye kutegemewa katika walichokabidhiwa. “Waaminifu” linafaa kwa kawaida na kimaudhui.
- source_word: οὐκ ἐγένεσθε
  choice: hamkuwa
  rationale: γίνομαι pamoja na kivumishi cha kiarifu hapa hutoa maana ya kuwa au kujidhihirisha kuwa. “Hamkuwa waaminifu” ni Kiswahili cha asili kinachowasilisha hali iliyothibitishwa.
- source_word: τὸ ἀληθινὸν
  choice: mali ya kweli
  rationale: Kivumishi hiki cha kati kimetumiwa kama nomino, huku nomino yenyewe ikiachwa. Kwa kuwa kinatofautishwa na μαμωνᾶς, “mali” imejazwa kwa uwazi, lakini tanbihi inadumisha usemi halisi usiotaja nomino.
- source_word: πιστεύσει
  choice: atakayewakabidhi
  rationale: πιστεύω ikiwa na mtendewa na kitu kinachokabidhiwa humaanisha kumwekea mtu amana, si kumwamini tu. “Kukabidhi” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
theological_decisions:
- issue: Maana ya τὸ ἀληθινὸν ikilinganishwa na mali isiyo ya haki
  choice: mali ya kweli
  alternative: kilicho cha kweli
  rationale: Kigiriki kinaacha nomino bila kutajwa, hivyo kina kiwango fulani cha uwazi mpana. Hata hivyo, mlinganisho wa moja kwa moja na μαμωνᾶς unaelekeza kwenye mali au utajiri wa kweli. Tanbihi inahifadhi hali ya asili ya usemi bila kufafanua mali hiyo kwa dai maalumu la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na uhusiano wa sababu unaoonyeshwa na οὖν umehifadhiwa. Neno “mali” limetumiwa badala ya “mamona” ili kuepuka istilahi isiyo ya kawaida, huku tanbihi ikidokeza umbo la Kigiriki.
