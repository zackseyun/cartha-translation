id: LUK.16.6
reference: Luke 16:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: sw
  text: Akasema, “Bathi mia moja za mafuta ya zeituni.”[a] Naye akamwambia, “Chukua hati yako ya deni[b], keti chini upesi, uandike hamsini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bathi ilikuwa kipimo cha kale cha vitu vya majimaji. Kigiriki kinasema, “bathi mia moja za mafuta ya zeituni.”
    reason: cultural_note
  - marker: b
    text: Au “hati zako” au “maandishi yako.” Katika muktadha huu maneno hayo yanamaanisha hati iliyoandikwa ya deni.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: bathi
  rationale: Neno hili linataja kipimo maalumu cha kale cha vitu vya majimaji. Kulihifadhi kama ‘bathi’ kunabaki karibu na maelezo halisi ya Kigiriki badala ya kulifanya kuwa ‘vipimo’ kwa ujumla; maana yake inaelezwa katika tanbihi.
- source_word: ἐλαίου
  choice: mafuta ya zeituni
  rationale: Katika muktadha huu ἔλαιον ni mafuta ya zeituni; tafsiri hii ni wazi kwa msomaji wa sasa kuliko ‘mafuta’ pekee.
- source_word: Δέξαι
  choice: Chukua
  rationale: Amri hii inamtaka mdaiwa aichukue hati yake ili aibadilishe; ‘chukua’ ni ya kawaida na inafaa kwa tendo hilo la papo hapo.
- source_word: τὰ γράμματα
  choice: hati yako ya deni
  rationale: Ingawa Kigiriki ni ‘maandishi/hati’ kwa wingi, katika mazingira haya ni kumbukumbu iliyoandikwa ya deni. ‘Hati yako ya deni’ huwasilisha maana ya kibiashara kwa Kiswahili cha kawaida huku tanbihi ikihifadhi upana wa neno la asili.
- source_word: καθίσας
  choice: keti chini
  rationale: 'Kitenzi kishirikishi kinaambatana na amri inayofuata; kwa Kiswahili cha asili kinaelezwa kama amri inayoratibiwa: ‘keti chini ... uandike.’'
- source_word: ταχέως
  choice: upesi
  rationale: Neno hili linaonyesha kasi au kutenda bila kuchelewa; ‘upesi’ ni fupi, ya kawaida, na yenye hadhi katika simulizi.
- source_word: γράψον
  choice: uandike
  rationale: Amri inamtaka aandike kiasi kipya katika hati. ‘Uandike’ inatosha bila kuongeza maelezo yasiyotajwa moja kwa moja.
- source_word: πεντήκοντα
  choice: hamsini
  rationale: Ni namba ya moja kwa moja, kwa hiyo haihitaji ufafanuzi wa ziada.
theological_decisions: []
