  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo umehifadhiwa kwa uwazi; istilahi ya kale ‘bathi’ imeachwa katika maandishi na kufafanuliwa kwa tanbihi.
