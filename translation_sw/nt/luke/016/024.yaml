id: LUK.16.24
reference: Luke 16:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: sw
  text: Naye akapaza sauti, akasema, “Baba Abrahamu, nihurumie, umtume Lazaro achovye ncha ya kidole chake katika maji na kuupoza ulimi wangu, kwa maana ninateseka sana katika mwali huu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninaumizwa sana katika mwali huu.” Kitenzi cha Kigiriki kinaweza kumaanisha kupata maumivu makali au kuteseka sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: akapaza sauti
  rationale: Katika muktadha huu kitenzi hiki kinaonyesha mwito wa sauti kubwa na wa dharura; “akapaza sauti” ni Kiswahili cha kawaida kinachohifadhi uzito huo.
- source_word: ἐλέησόν με
  choice: nihurumie
  rationale: Kauli hii ya ombi inaomba huruma moja kwa moja; “nihurumie” ni ya asili, fupi, na yenye heshima.
- source_word: πέμψον
  choice: umtume
  rationale: Ni amri ya moja kwa moja yenye maana ya kumpeleka mtu; kiambishi cha yambwa kinamtaja Lazaro kwa uwazi.
- source_word: βάψῃ
  choice: achovye
  rationale: βάπτω hapa humaanisha kutumbukiza kwa muda mfupi, hasa ncha ya kidole; “achovye” huhifadhi picha hiyo kuliko “alowanishe.”
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: ncha ya kidole chake
  rationale: Hii inafuata kwa karibu picha halisi ya Kigiriki na inaeleweka kwa urahisi katika Kiswahili.
- source_word: ὕδατος
  choice: katika maji
  rationale: Baada ya “achovye,” Kiswahili cha asili hutumia “katika maji” kueleza kile ambamo kidole kinachovywa.
- source_word: καταψύξῃ
  choice: kuupoza
  rationale: Kitenzi kina maana ya kupoza au kuburudisha kwa kupoza; “kuupoza” hudumisha picha halisi ya kupunguza joto.
- source_word: γλῶσσάν μου
  choice: ulimi wangu
  rationale: Ni rejeo la moja kwa moja kwa kiungo cha mwili, bila sababu ya kulifanya tamathali.
- source_word: ὀδυνῶμαι
  choice: ninateseka sana
  rationale: Kitenzi kinaonyesha maumivu au dhiki kali. “Ninateseka sana” ni cha kawaida na chenye nguvu bila kuingiza dhana maalumu ya chanzo cha mateso.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: katika mwali huu
  rationale: φλόξ humaanisha hasa mwali, si moto kwa upana; tafsiri hii huhifadhi taswira ya umoja ya Kigiriki.
- source_word: Πάτερ Ἀβραάμ
  choice: Baba Abrahamu
  rationale: Huhifadhi mwito wa kifamilia na wa ukoo kwa namna iliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Namna ya kutafsiri mateso ya tajiri
  choice: ninateseka sana katika mwali huu
  alternative: ninaumizwa sana katika mwali huu; ninateswa katika mwali huu
  rationale: “Ninateseka sana” huonyesha ukali wa ὀδυνῶμαι bila kuamua ikiwa mateso hayo yanasababishwa moja kwa moja na mtendaji mwingine, jambo ambalo kitenzi chenyewe halibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umehifadhiwa kwa vitenzi vya mfululizo, huku sentensi ikisomeka kwa kawaida kwa wasomaji wa kawaida.
