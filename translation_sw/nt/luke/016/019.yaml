  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: sw
  text: Kulikuwa na mtu mmoja tajiri, ambaye alikuwa akivaa mavazi ya zambarau na ya kitani laini, akijifurahisha kwa fahari kila siku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akifanya karamu za fahari kila siku.” Neno la Kigiriki linaweza kumaanisha kujifurahisha au kufanya karamu, na neno linalotafsiriwa “kwa fahari” linasisitiza anasa na uzuri wa kifahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις ἦν πλούσιος
  choice: Kulikuwa na mtu mmoja tajiri
  rationale: Hutambulisha mhusika asiyeainishwa kwa jina; “mtu mmoja” ni utangulizi wa kawaida wa simulizi katika Kiswahili, na δέ haihitaji kutafsiriwa kwa kiunganishi kizito hapa.
- source_word: ἐνεδιδύσκετο
  choice: aliyevaa
  rationale: Kauli ya wakati usiotimilika inaonyesha desturi ya kuvaa; katika muktadha huu umbo la maelezo “aliyevaa” ni la asili, huku desturi hiyo ikidhihirishwa na picha nzima ya maisha yake ya kila siku.
- source_word: πορφύραν
  choice: mavazi ya zambarau
  rationale: Neno linataja rangi au kitambaa cha zambarau kwa maana ya mavazi ya kifahari; kutaja “mavazi” huifanya maana ya kimetonimia iwe wazi.
- source_word: βύσσον
  choice: kitani safi
  rationale: Hurejelea kitani bora na cha thamani; “kitani safi” ni usemi wa kibiblia unaoeleweka na unaodokeza ubora wake.
- source_word: εὐφραινόμενος
  choice: akijifurahisha
  rationale: Huhifadhi maana pana ya kufurahia au kusherehekea bila kuifungia kwa ulaji pekee, ingawa karamu inaweza kudokezwa na muktadha.
- source_word: καθ’ ἡμέραν
  choice: kila siku
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya tendo la kila siku.
- source_word: λαμπρῶς
  choice: kwa fahari
  rationale: Katika muktadha wa utajiri, huonyesha anasa, uangavu na hali ya kifahari; “kwa fahari” ni ya asili na haiongezi tendo maalumu lisilotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Tanbihi huhifadhi uwezekano wa maana ya karamu bila kuifanya kuwa tafsiri pekee ya εὐφραινόμενος.
