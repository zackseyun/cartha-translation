  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: sw
  text: Lakini ni rahisi zaidi kwa mbingu na dunia kupita kuliko kwa kistari kimoja cha herufi[a] katika Sheria kuanguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alama moja ndogo ya herufi”—yaani, kistari kidogo sana kinachotofautisha herufi moja na nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: ni rahisi zaidi
  rationale: Huhifadhi umbo la ulinganisho na maana ya jambo kuwa rahisi zaidi kutokea.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha utofautishaji mpole na kauli iliyotangulia, kama ilivyo katika muktadha.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: mbingu na dunia
  rationale: Ni msemo wa kawaida wa kibiblia unaorejelea ulimwengu ulioumbwa kwa ujumla.
- source_word: παρελθεῖν
  choice: kupita
  rationale: Huhifadhi taswira ya chanzo ya mbingu na dunia kupita au kufikia mwisho.
- source_word: νόμου
  choice: Sheria
  rationale: Herufi kubwa inaashiria Sheria ya Maandiko katika muktadha huu, si sheria kwa maana ya jumla.
- source_word: μίαν κεραίαν
  choice: alama moja ndogo ya herufi
  rationale: Hueleza kwa Kiswahili cha sasa alama ndogo sana iliyo sehemu ya umbo la herufi bila kutumia istilahi ya kizamani.
- source_word: πεσεῖν
  choice: kuanguka
  rationale: Huhifadhi taswira halisi ya kitenzi cha Kigiriki na msisitizo kwamba hata sehemu ndogo kabisa ya Sheria haiwezi kuondolewa.
theological_decisions:
- issue: Rejeleo la νόμος
  choice: Sheria ya Maandiko
  alternative: sheria kwa maana ya jumla
  rationale: Muktadha wa Kiyahudi katika Luka na kutajwa kwa sehemu ndogo ya maandishi huonyesha kwamba ni Sheria iliyofunuliwa katika Maandiko, bila kufafanua zaidi upeo wake.
- issue: Maana ya κεραία
  choice: alama moja ndogo ya herufi
  alternative: kistari kimoja
  rationale: Tafsiri hii huwasilisha kwa msomaji wa sasa msisitizo wa undani mdogo kabisa wa maandishi huku tanbihi ikihifadhi njia mbadala iliyo fupi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inaendeleza muundo wa ulinganisho pamoja na taswira za maandishi na kuanguka zilizomo katika Kigiriki.
