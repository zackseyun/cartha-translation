lexical_decisions:
- source_word: πτωχὸς
  choice: maskini
  rationale: Neno hili humaanisha mtu aliye maskini au asiye na chochote. “Maskini” ni la kawaida na haliongezi dhana mahususi ya kwamba alikuwa mwombaji.
- source_word: τις
  choice: mmoja
  rationale: Neno hili linamtambulisha mhusika mpya asiyeainishwa zaidi; “maskini mmoja” ni Kiswahili cha asili kuliko “maskini fulani” katika muktadha huu.
- source_word: ὀνόματι Λάζαρος
  choice: aitwaye Lazaro
  rationale: Muundo huu unamaanisha kwa kawaida kwamba jina lake lilikuwa Lazaro.
- source_word: ἐβέβλητο
  choice: alikuwa amewekwa
  rationale: Kauli ya kutendwa na wakati uliotangulia huonyesha kwamba wengine walikuwa wamemweka hapo. “Amewekwa” ni ya asili na hudumisha hali yake ya kutokuwa na uwezo, huku uwezekano mkali zaidi wa “ametupwa” ukihifadhiwa katika tanbihi.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: kando ya lango lake
  rationale: Kirai hiki huonyesha mahali karibu na lango au njia ya kuingilia ya yule tajiri. “Kando ya lango lake” ni wazi na ya kawaida katika Kiswahili.
- source_word: εἱλκωμένος
  choice: mwili wake ukiwa umejaa vidonda
  rationale: Kitenzi hiki hueleza kuathiriwa na vidonda, hasa vidonda vya usaha. Tafsiri hii ni ya kawaida, huonyesha hali ya Lazaro kwa uwazi, na haidai kwamba kila sehemu ya mwili ilifunikwa kabisa.
