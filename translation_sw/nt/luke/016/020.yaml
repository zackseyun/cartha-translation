  text: Lakini maskini mmoja aitwaye Lazaro alikuwa amewekwa penye lango lake[a], akiwa amejaa vidonda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ametupwa penye lango lake.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kutupwa au kuwekwa, jambo linaloweza kukazia kutokuwa na uwezo kwa Lazaro na jinsi alivyotelekezwa.
