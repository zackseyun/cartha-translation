  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: sw
  text: Ndipo wale waliosikia wakasema, “Basi, ni nani anayeweza kuokolewa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: wakasema
  rationale: Kauli ya wakati uliopita inaendeleza simulizi kwa njia ya kawaida; “wakasema” ni ya asili katika masimulizi ya Kiswahili.
- source_word: δὲ
  choice: Ndipo
  rationale: Hapa kiunganishi kinaonyesha hatua inayofuata katika simulizi na mwitikio wa waliokuwa wakisikiliza.
- source_word: οἱ ἀκούσαντες
  choice: wale waliosikia
  rationale: Kirai nomino cha kishirikishi kinawataja watu waliosikia kauli iliyotangulia; Kiswahili hakihitaji kuongeza kitu kama “hayo” ili maana ieleweke.
- source_word: Καὶ
  choice: Basi
  rationale: Katika swali hili καί linaendeleza fikira kwa mshangao na kutokeza hitimisho la wasikilizaji; “Basi” ni mwendelezo wa asili wa Kiswahili bila kuongeza jibu la kitheolojia.
- source_word: τίς
  choice: ni nani
  rationale: Hili ndilo umbo la kawaida na la moja kwa moja la swali kuhusu mtu anayeweza kuokolewa.
- source_word: δύναται
  choice: anayeweza
  rationale: Linahifadhi wazo la uwezo au uwezekano kwa Kiswahili cha sasa na cha kawaida.
- source_word: σωθῆναι
  choice: kuokolewa
  rationale: Katika muktadha wa kuingia katika ufalme wa Mungu, kitenzi hiki kinahusu wokovu, si uokoaji wa kimwili tu; umbo la kutendwa linahifadhi sauti ya Kigiriki.
theological_decisions:
- issue: Maana ya σωθῆναι katika muktadha
  choice: kuokolewa kwa maana ya kupata wokovu
  alternative: kuponywa au kuokolewa kutoka hatari ya kimwili
  rationale: Mazungumzo yanahusu kuingia katika ufalme wa Mungu na uwezekano wa wokovu; tafsiri haiongezi maelezo kuhusu namna wokovu huo unavyotendeka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Ndipo” na “Basi” zinahifadhi mwendelezo na mshangao wa swali bila kufanya sentensi kuwa nzito.
