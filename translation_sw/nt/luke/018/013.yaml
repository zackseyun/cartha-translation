  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: sw
  text: Lakini mtoza ushuru, akiwa amesimama mbali, hakutaka hata kuinua macho yake kuelekea mbinguni, bali aliendelea kujipiga kifua akisema, “Ee Mungu, unihurumie mimi mwenye dhambi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe na fadhili kwangu”; kitenzi hiki kinahusiana na msamiati wa upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: mtoza ushuru
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili cha sasa kwa afisa aliyekusanya ushuru; linafaa pia katika muktadha wa kijamii wa Injili.
- source_word: μακρόθεν
  choice: mbali
  rationale: Linahifadhi maana ya umbali wa mahali kwa usemi mfupi na wa kawaida.
- source_word: ἑστὼς
  choice: akiwa amesimama
  rationale: Linawasilisha hali yake wakati wa tendo kuu kwa Kiswahili cha asili.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: hakutaka hata
  rationale: Linahifadhi maana ya hiari au kusita, si kutokuwa na uwezo.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: kuinua macho yake kuelekea mbinguni
  rationale: Linahifadhi taswira na mwelekeo wa usemi wa Kigiriki kwa lugha ya kawaida.
- source_word: ἔτυπτε
  choice: aliendelea kujipiga
  rationale: Hali ya kitenzi cha Kigiriki inaonyesha tendo lililoendelea au lililorudiwa; “aliendelea” huiweka wazi.
- source_word: τὸ στῆθος αὐτοῦ
  choice: kifua
  rationale: “Kujipiga kifua” ni usemi wa kawaida unaoeleza ishara hii ya huzuni na majuto.
- source_word: ἱλάσθητί μοι
  choice: unihurumie
  rationale: Ni ombi la asili na linaloeleweka kwa Mungu aonyeshe rehema, huku uhusiano wa kitenzi na upatanisho ukihifadhiwa katika tanbihi.
- source_word: τῷ ἁμαρτωλῷ
  choice: mimi, mwenye dhambi
  rationale: Muundo huu ni wa asili zaidi katika Kiswahili kuliko “mimi, yule mwenye dhambi,” lakini bado unadumisha msisitizo wa kujitaja kwa mnyenyekevu kama mwenye dhambi.
theological_decisions:
- issue: Jinsi ya kutafsiri ἱλάσθητί μοι katika sala inayoomba kibali cha Mungu
  choice: unihurumie
  alternative: uwe mwenye kunifadhili / nifanyie upatanisho
  rationale: Kitenzi hiki kinahusiana na msamiati wa upatanisho, lakini katika sala ya moja kwa moja “unihurumie” ni Kiswahili cha kawaida na wazi. Tanbihi inadumisha uzito wake wa kiibada bila kuingiza ufafanuzi wa kimadhehebu katika andiko kuu.
- issue: Nguvu ya kibainishi katika τῷ ἁμαρτωλῷ
  choice: mimi, mwenye dhambi
  alternative: mimi, yule mwenye dhambi
  rationale: Kigiriki kina kibainishi kinachoweza kuwa na msisitizo wa kujishusha. Kiswahili “mimi, mwenye dhambi” kinawasilisha kujitaja huku kwa kawaida; “yule mwenye dhambi” kingesikika kana kwamba anamrejelea mtu mwingine au kingekuwa kizito isivyo lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. “Ee Mungu” linafaa kwa sala bila kuwa la kizamani kupita kiasi. Muundo unahifadhi mwendelezo wa kujipiga kifua na kusita kwake kuinua macho.
