  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: sw
  text: Akapaza sauti akisema, “Yesu, Mwana wa Daudi[a], nirehemu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa Daudi” ni mtajo wa Kimasihi unaomrejelea mfalme aliyeahidiwa kutoka katika ukoo wa Daudi; kwa maana ya jumla zaidi, unaweza kutafsiriwa “mzao wa Daudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: akapaza sauti
  rationale: Kitenzi βοάω kinaonyesha kutoa sauti kubwa kwa msisitizo au kwa dharura; “akapaza sauti” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-shirikishi hiki kinatambulisha maneno ya moja kwa moja na kinahifadhi mtiririko wa simulizi ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ni umbo la mwito la jina Ἰησοῦς; limetolewa kwa umbo la jina lililozoeleka katika Kiswahili.
- source_word: υἱὲ Δαυίδ
  choice: Mwana wa Daudi
  rationale: Katika muktadha wa Injili, huu ni mtajo wenye maana ya kifalme na ya Kimasihi. “Mwana wa Daudi” huhifadhi mwangwi huo wa kibiblia kuliko ufafanuzi wa jumla “mzao wa Daudi.”
- source_word: ἐλέησόν με
  choice: nirehemu
  rationale: Amri hii ni ombi la moja kwa moja na la dharura la kutendewa rehema. “Nirehemu” ni fupi, ya asili, na huhifadhi uzito wa kidini wa neno la Kigiriki.
theological_decisions:
- issue: Nguvu ya Kimasihi ya mtajo υἱὲ Δαυίδ
  choice: Kutafsiri kama mtajo “Mwana wa Daudi.”
  alternative: Kutafsiri kwa maana ya jumla zaidi, “mzao wa Daudi.”
  rationale: Katika simulizi la Luka, maneno haya yanamtaja Yesu kwa cheo chenye mwangwi wa mfalme wa ukoo wa Daudi aliyeahidiwa. Tafsiri hii huhifadhi umuhimu huo bila kuongeza ufafanuzi ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akapaza sauti” huonyesha ukubwa na dharura ya kilio bila kuwa cha mazungumzo mno; “nirehemu” huhifadhi ufupi na uzito wa ombi la asili.
