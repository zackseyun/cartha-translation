base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: sw
  text: Yesu aliposikia hayo, akamwambia, “Bado umepungukiwa na jambo moja:[a] uza vyote ulivyo navyo, uwagawie maskini, nawe utakuwa na hazina mbinguni;[b] na njoo, unifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi na muundo wa Kigiriki: “Jambo moja bado linakosekana kwako.”'
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hutumia “mbingu” katika wingi; Kiswahili kwa kawaida husema “mbinguni” hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Yesu aliposikia hayo
  rationale: Kirai cha wakati kinawasilisha kwa Kiswahili cha kawaida tendo lililotangulia; “hayo” hurejelea maneno ya mtu huyo katika muktadha.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Bado umepungukiwa na jambo moja
  rationale: Huhifadhi wazo la upungufu mmoja uliobaki kwa lugha ya Kiswahili iliyo wazi na ya kawaida. Tanbihi inaonyesha muundo wa karibu zaidi na Kigiriki.
- source_word: πάντα ὅσα ἔχεις
  choice: vyote ulivyo navyo
  rationale: Hutoa maana pana ya vitu vyote alivyo navyo bila kuongeza dhana isiyotajwa ya aina fulani ya mali.
- source_word: πώλησον
  choice: uza
  rationale: Amri fupi na ya moja kwa moja inalingana na nguvu ya kauli ya Kigiriki.
- source_word: διάδος πτωχοῖς
  choice: uwagawie maskini
  rationale: “Gawia” huhifadhi maana ya kusambaza au kugawa kwa watu kadhaa, badala ya kuifanya kuwa utoaji wa jumla tu.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: utakuwa na hazina mbinguni
  rationale: “Hazina” ni neno la kawaida kwa θησαυρός; “mbinguni” ni usemi wa asili wa Kiswahili na unaweza kuwakilisha wingi wa Kigiriki bila lugha ngumu.
- source_word: δεῦρο ἀκολούθει μοι
  choice: kisha njoo, unifuate
  rationale: “Njoo” huonyesha mwito wa kumjia Yesu, na “unifuate” huwasilisha mwito wa ufuasi unaoendelea kwa Kiswahili cha kawaida. “Kisha” huonyesha hatua inayofuata bila kubadili kiini cha amri.
theological_decisions:
- issue: Uhusiano wa kuuza mali na kumfuata Yesu
  choice: Maneno yanabaki kuwa amri halisi kwa mtu huyu, yakifikia kilele katika mwito wa kumfuata Yesu.
  alternative: Kuyafanya kuwa sheria ya wazi ya kuuza mali yote kwa kila mwamini, au kuyafanya kuwa ishara tu isiyo na dai halisi la kiuchumi.
  rationale: Mstari wenyewe unatoa amri mahsusi kwa mtu anayezungumziwa, lakini hauamui moja kwa moja upeo wake kwa kila mwanafunzi. Tafsiri inadumisha uzito na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Umepungukiwa na jambo moja” ni cha asili kuliko kufuata moja kwa moja mpangilio wa Kigiriki, huku tanbihi ikihifadhi muundo wake. Amri zimewekwa wazi, kwa ufupi, na bila kuingiza msimamo wa dhehebu.
