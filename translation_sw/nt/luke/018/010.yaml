  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: sw
  text: Wanaume wawili walipanda hekaluni[a] kusali; mmoja alikuwa Farisayo, na mwingine alikuwa mtoza ushuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo la Hekalu, kutia ndani nyua zake, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Wanaume wawili
  rationale: Ingawa ἄνθρωποι inaweza kumaanisha watu kwa ujumla, maelezo yanayofuata yanawatambulisha watu hawa wawili kwa miundo ya kiume; “wanaume wawili” ni sahihi kwa muktadha huu.
- source_word: ἀνέβησαν
  choice: walipanda kwenda
  rationale: Kitenzi ἀναβαίνω kina maana ya kwenda juu. Usemi huu unahifadhi wazo la kupanda kwenda Yerusalemu/hekaluni na unasikika kwa kawaida katika Kiswahili.
- source_word: εἰς τὸ ἱερὸν
  choice: kwenda hekaluni
  rationale: ἱερόν hapa ni eneo lote la Hekalu, si jengo la patakatifu la ndani pekee. “Hekaluni” ni tafsiri ya kawaida na inayoeleweka; tanbihi inafafanua upeo wa neno hilo.
- source_word: προσεύξασθαι
  choice: kusali
  rationale: 'Kitenzi-jina hiki kinaonyesha kusudi la kwenda kwao: walikwenda ili kusali. Muundo mfupi “kusali” ni wa kawaida na wazi katika Kiswahili.'
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: mmoja ... na mwingine
  rationale: Muundo huu unaonyesha utofautishaji wa watu wawili na unawakilishwa kwa kawaida kwa “mmoja ... na mwingine” katika Kiswahili.
- source_word: Φαρισαῖος
  choice: Farisayo
  rationale: Hili ndilo umbo lililozoeleka la Kiswahili kwa jina la kundi hili la Kiyahudi.
- source_word: τελώνης
  choice: mtoza ushuru
  rationale: τελώνης humaanisha mtu aliyekusanya kodi au ushuru. “Mtoza ushuru” ni usemi wa sasa, wazi, na unaofaa mazingira ya kihistoria.
theological_decisions:
- issue: Kutofautisha ἱερόν na ναός
  choice: hekaluni, pamoja na tanbihi ya ufafanuzi
  alternative: katika eneo la Hekalu
  rationale: Andiko linarejelea eneo lote la Hekalu, si patakatifu pa ndani pekee. Neno “hekaluni” linadumisha usomaji wa kawaida, huku tanbihi ikizuia maana hiyo kueleweka kwa finyu mno.
- issue: Jinsia katika ἄνθρωποι
  choice: wanaume
  alternative: watu
  rationale: Ingawa neno lenyewe linaweza kutumiwa kwa watu kwa ujumla, muktadha wa karibu unawasilisha watu wawili wa kiume. Tafsiri haibadili taarifa hiyo kuwa ya kijinsia isiyobainishwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Walipanda kwenda” huhifadhi wazo la kwenda juu bila kutumia usemi mzito; “mmoja alikuwa” huweka wazi kishazi ambacho Kigiriki kimeacha kitenzi kishirikishi kieleweke.
