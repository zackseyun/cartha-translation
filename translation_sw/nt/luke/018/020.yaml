  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: sw
  text: 'Unazijua amri: Usizini, usiue, usiibe, usitoe ushahidi wa uongo, mheshimu baba yako na mama yako.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: amri
  rationale: Katika muktadha huu ἐντολάς ni amri zenye mamlaka, hasa amri zinazotambulika kutoka katika Amri Kumi; “amri” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: οἶδας
  choice: unazijua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, katika Kigiriki cha Koine ina maana ya wakati uliopo. Kiambishi “-zi-” kinarejelea amri kwa kawaida katika Kiswahili.
- source_word: Μὴ μοιχεύσῃς
  choice: Usizini
  rationale: μοιχεύω humaanisha kufanya uzinzi, hasa kuvunja uaminifu wa ndoa. “Usizini” ni katazo la moja kwa moja, la sasa, na linalotambulika katika lugha ya kibiblia bila kuwa la kizamani.
- source_word: Μὴ φονεύσῃς
  choice: usiue
  rationale: φονεύω huelekea kumaanisha kuua mtu kwa uhalifu. Kiswahili sanifu hutumia “usiue” katika kauli hii ya Amri Kumi; muktadha wa amri unaweka wazi kuwa si dai pana lisilo na mipaka kuhusu kila aina ya kusababisha kifo.
- source_word: Μὴ κλέψῃς
  choice: usiibe
  rationale: κλέπτω ni kuiba; “usiibe” ni tafsiri ya moja kwa moja na ya asili ya katazo hilo.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: usitoe ushahidi wa uongo
  rationale: ψευδομαρτυρέω ni kutoa ushahidi au ushuhuda wa uongo. “Ushahidi wa uongo” ni wa sasa, wazi, na huhifadhi wazo la ushahidi dhidi ya mwingine bila kuongeza maneno yasiyokuwapo hapa.
- source_word: Τίμα
  choice: mheshimu
  rationale: τιμάω hapa ni kumpa mzazi heshima inayomstahili. “Mheshimu” huhifadhi nguvu ya amri na maana ya kimaadili.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: baba yako na mama yako
  rationale: Kigiriki kinawataja wazazi wote wawili. Kurudia “yako” kunasikika kwa asili katika Kiswahili na hudumisha uwazi wa marejeo.
theological_decisions:
- issue: Namna ya kutafsiri makatazo ya Amri Kumi
  choice: 'Kutumia maumbo ya moja kwa moja ya katazo: “Usizini, usiue, usiibe, usitoe...”'
  alternative: Kutumia mtindo mzito au wa kisheria zaidi, kama “Hutazini...”
  rationale: Kigiriki kina makatazo yenye nguvu ya amri. Maumbo ya “usi-” ni ya kawaida katika Kiswahili cha sasa na huhifadhi nguvu hiyo bila kuingiza mtindo wa kizamani au tofauti ya kimafundisho.
- issue: Upeo wa Μὴ φονεύσῃς
  choice: “usiue” katika muktadha wa Amri Kumi
  alternative: “usifanye mauaji” au “usimuue mtu”
  rationale: Kitenzi cha Kigiriki kinahusu kuua kwa uhalifu, lakini usemi wa Kiswahili unaotambulika katika amri hii ni “usiue.” Muktadha wa Amri Kumi, si neno lililoongezwa, hubeba utofautishaji huo; hivyo tafsiri haipanui wala kutatua kimyakimya maswali yote ya kimaadili kuhusu kuua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, na makatazo yametolewa kwa lugha ya moja kwa moja ya sasa. Hakuna tanbihi inayohitajika kwa kuwa tofauti ya Kiingereza kati ya “Do not” na “You shall not” haina ulinganifu muhimu unaohitaji kuelezwa katika Kiswahili.
