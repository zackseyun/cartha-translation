  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: sw
  text: Yesu akamwambia, “Pata kuona[a]; imani yako imekuokoa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ona tena.” Amri ya Kigiriki inaweza kumaanisha kuona tena katika muktadha wa uponyaji.
    reason: lexical_alternative
  - marker: b
    text: Au “imekuponya” au “imekufanya uwe mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha uponyaji pamoja na wokovu.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaunganisha tendo hili kwa kawaida na lililotangulia bila kuongeza nguvu ya kiufafanuzi.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaohifadhi maana ya Yesu kusema maneno hayo kwake.
- source_word: Ἀνάβλεψον
  choice: Pata kuona
  rationale: Katika muktadha huu wa uponyaji, kitenzi kinahusu kupata uwezo wa kuona, si kutazama juu tu. “Pata kuona” ni Kiswahili cha kawaida na hakisisitizi bila ulazima kwamba mtu huyo aliwahi kuona hapo awali.
- source_word: πίστις
  choice: imani
  rationale: Hapa neno linaonyesha kumtegemea Yesu kwa kuamini. “Imani” ni tafsiri ya kawaida na yenye hadhi, huku maana ya kutumaini ikibaki ndani yake.
- source_word: σέσωκέν
  choice: imekuokoa
  rationale: Kitenzi hiki kinaweza kumaanisha kuokoa au kuponya. “Imekuokoa” kinahifadhi upana wa maana ya Kiluka na hakifungi kauli hii katika uponyaji wa mwili pekee.
theological_decisions:
- issue: Upeo wa maana ya σῴζω katika simulizi la uponyaji
  choice: imekuokoa
  alternative: imekuponya / imekufanya uwe mzima
  rationale: Katika muktadha huu neno linaweza kueleza kuponywa kwa mwili, lakini pia linaweza kuwa na maana pana ya wokovu. Tafsiri “imekuokoa” inadumisha mvutano huo wa kitheolojia badala ya kuamua kwamba ni uponyaji wa mwili tu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kawaida, ya sasa, na yenye hadhi. Alama za tanbihi zimewekwa kwenye maneno yanayohusika: [a] baada ya “kuona” na [b] baada ya “imekuokoa.”'
