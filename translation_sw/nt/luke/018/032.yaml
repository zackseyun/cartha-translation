  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: sw
  text: Kwa maana atakabidhiwa kwa watu wa mataifa[a], na atadhihakiwa, atadhalilishwa[b], na atatemewa mate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Mataifa.” Hapa maana yake hasa ni watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atatukanwa,” au “atatendewa kwa aibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: atakabidhiwa
  rationale: Kitenzi hiki cha wakati ujao katika hali ya kutendwa kinaonyesha kukabidhiwa mikononi mwa wengine bila kubainisha hapa mhusika au nia; hivyo hakijafasiriwa kwa maana finyu ya ‘atasalitiwa.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inaeleza zaidi unabii uliotangulia, huku ikitoa kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa mataifa
  rationale: Katika muktadha huu neno hili linawahusu watu wasio Wayahudi, si mataifa kama vyombo vya kisiasa tu. Kauli hii ni ya kawaida katika Kiswahili cha Biblia na inahifadhi pia taswira ya msingi ya ‘mataifa.’
- source_word: ἐμπαιχθήσεται
  choice: atadhihakiwa
  rationale: Huwasilisha wazi tendo la kufanyiwa mzaha wa kudharau, kwa lugha ya sasa yenye uzito unaofaa muktadha wa mateso.
- source_word: ὑβρισθήσεται
  choice: atadhalilishwa
  rationale: Neno la Kigiriki linaweza kuhusisha kutukanwa au kutendewa kwa njia ya aibu na dharau. ‘Atadhalilishwa’ huhifadhi upana huo kuliko neno linalomaanisha matusi ya maneno pekee.
- source_word: ἐμπτυσθήσεται
  choice: atatemewa mate
  rationale: Ni usemi wa kawaida na halisi wa Kiswahili unaohifadhi kitendo mahsusi cha kumvunjia mtu heshima.
theological_decisions:
- issue: Mhusika anayerejelewa na vitenzi vya hali ya kutendwa
  choice: Ngeli ya nafsi ya tatu umoja ‘a-’ imetumiwa, ikimrejelea Mwana wa Adamu aliyetajwa katika muktadha uliotangulia.
  alternative: Kurudia wazi ‘Mwana wa Adamu’ katika mstari huu.
  rationale: Kigiriki hakirudii nomino ya mhusika katika mstari huu; muktadha wa Luka 18:31 unaifanya rejea iwe wazi. Kiswahili huhitaji upatanisho wa kisarufi lakini si lazima kurudia nomino, hivyo tafsiri haiongezi msisitizo usiokuwapo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Msururu wa vitenzi vya hali ya kutendwa na viunganishi ‘na’ umehifadhiwa ili kuonyesha mkusanyiko wa matendo ya kudhalilisha katika Kigiriki.
