  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: sw
  text: Kisha Petro akasema, “Tazama, sisi tumeacha vyetu[a] na tumekufuata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yale yaliyokuwa yetu” au “mali zetu.” Kauli ya Kigiriki ni pana na haielezi hasa Petro na wenzake waliacha nini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: akasema
  rationale: Kitenzi hiki cha masimulizi kinatafsiriwa kwa kawaida kuwa “akasema”; muktadha hauhitaji maana yenye mkazo zaidi kama “akajibu.”
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi huku ikionyesha mpito mdogo. “Kisha” ni ya kawaida katika Kiswahili na haiongezi upinzani mkali.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno hili linavuta usikivu wa msikilizaji. “Tazama” ni la heshima, linaeleweka, na linahifadhi nguvu yake bila kuwa la kizamani kupita kiasi.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki kwa ajili ya mkazo; kukitaja pia katika Kiswahili kunahifadhi mkazo huo.
- source_word: ἀφέντες
  choice: tumeacha
  rationale: Ingawa kwa muundo ni kishirikishi cha wakati uliopita, Kiswahili cha kawaida huwasilisha tendo hili lililotangulia kwa “tumeacha,” likiunganika vizuri na “kukufuata.”
- source_word: τὰ ἴδια
  choice: vitu vyetu
  rationale: Kauli ya Kigiriki ni pana na haitaji hasa walichoacha. “Vitu vyetu” ni ya kawaida na pana kuliko “mali zetu,” ingawa tanbihi inadumisha uwezekano wa maana pana zaidi.
- source_word: ἠκολουθήσαμέν σοι
  choice: kukufuata
  rationale: ἀκολουθέω pamoja na yambwa ya dative ni kitenzi cha kawaida cha kumfuata mtu, pamoja na maana ya uanafunzi. “Kukufuata” huhifadhi maana hiyo bila ufafanuzi wa ziada.
