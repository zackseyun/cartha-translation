  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: sw
  text: Kwa maana ni rahisi zaidi ngamia kupita katika tundu la sindano kuliko mtu tajiri kuingia katika ufalme wa Mungu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “kupitia tundu la sindano.”'
    reason: lexical_alternative
  - marker: b
    text: Wengine wamependekeza maelezo kama lango jembamba lililoitwa “Tundu la Sindano,” au maana ya “kamba” badala ya “ngamia”; lakini maandishi ya Kigiriki hapa yanasema “ngamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: ni rahisi zaidi
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili maana ya kivumishi cha kulinganisha kinachotumiwa pamoja na ἐστιν.
- source_word: γάρ
  choice: Kwa maana
  rationale: Hudumisha kazi yake ya kutoa maelezo yanayounganisha kauli hii na muktadha uliotangulia.
- source_word: κάμηλον
  choice: ngamia
  rationale: Hii ndiyo maana ya kawaida ya neno la Kigiriki; hakuna msingi wa maandishi wa kulibadili kuwa ‘kamba.’
- source_word: διὰ τρήματος βελόνης
  choice: kupita katika tundu la sindano
  rationale: Ni tafsiri ya asili na wazi ya picha ya kupita kupitia uwazi wa sindano.
- source_word: εἰσελθεῖν
  choice: kupita / kuingia
  rationale: Katika sehemu ya kwanza, ‘kupita’ ni ya kawaida zaidi kwa mwendo kupitia tundu; katika sehemu ya pili, ‘kuingia’ huonyesha wazi kuingia katika ufalme. Zote zinawakilisha kitenzi kilekile cha Kigiriki kulingana na muktadha wake.
- source_word: πλούσιον
  choice: mtu tajiri
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino kumaanisha mtu mwenye mali; ‘mtu tajiri’ ni wazi na ya kawaida katika Kiswahili bila kuongeza tofauti ya kijinsia isiyowakilishwa kisarufi katika Kiswahili.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: Hudumisha istilahi muhimu ya kibiblia ‘ufalme wa Mungu’ na kueleza mwelekeo wa kuingia ndani yake kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya picha ya ngamia na tundu la sindano
  choice: 'Kudumisha picha halisi ya kimzaha yenye kutia chumvi: ngamia kupita katika tundu la sindano.'
  alternative: Kuifasiri kama lango jembamba lililoitwa ‘Tundu la Sindano,’ au kusoma ‘kamba’ badala ya ‘ngamia.’
  rationale: Maandishi ya Kigiriki yanasema κάμηλον, ‘ngamia,’ na yanatumia picha isiyowezekana ili kusisitiza ugumu unaoelezwa. Maelezo ya mapokeo ya baadaye hayapaswi kuingizwa katika maandishi makuu bila ushahidi wa kimatini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi nguvu ya maelezo ya ‘Kwa maana,’ picha kali ya ngamia na sindano, na istilahi iliyozoeleka ya ‘ufalme wa Mungu.’
