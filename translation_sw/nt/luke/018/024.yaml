  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: sw
  text: Yesu alipomwona, akasema, “Ni vigumu sana kwa wenye mali kuingia katika ufalme wa Mungu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Yesu alipomwona
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati, ambacho ni cha asili katika Kiswahili na kinahifadhi uhusiano wa kitendo cha kuona na kusema. δέ ni kiunganishi chepesi cha simulizi na hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: Πῶς δυσκόλως
  choice: Ni vigumu sana
  rationale: Muundo huu unaonyesha mshangao na kiwango kikubwa cha ugumu. ‘Ni vigumu sana’ ni Kiswahili cha kawaida na huhifadhi nguvu ya usemi bila kuugeuza kuwa kauli ya kutowezekana kabisa.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: wenye mali
  rationale: χρήματα inaweza kumaanisha fedha, mali, au utajiri. ‘Wenye mali’ ni pana, ya asili, na inadumisha wazo la watu wanaomiliki utajiri bila kulifanya lihusu pesa taslimu pekee.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: kuingia katika ufalme wa Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mwendo wa kuingia ndani ya ufalme wa Mungu; umbo la kitenzi limewekwa kama jina-kitenzi baada ya ‘ni vigumu’ kwa Kiswahili fasaha.
theological_decisions:
- issue: Uzito wa kauli ya Yesu kuhusu wenye mali na ufalme wa Mungu
  choice: Kauli ya jumla kwamba ni vigumu sana kwa wenye mali kuingia katika ufalme wa Mungu
  alternative: Kauli kwamba haiwezekani kabisa kwa mtu mwenye mali kuingia
  rationale: Kigiriki kinasema kwa mshangao kwamba jambo hilo ni gumu, si kwamba haliwezekani kabisa. Tafsiri inadumisha mvutano huo bila kutangulia ufafanuzi unaofuata katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi inayohitajika; ‘wenye mali’ hubeba upana wa maana ya χρήματα kwa ufupi na kwa ufasaha.
