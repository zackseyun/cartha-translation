  text: akisema, “Katika mji fulani kulikuwa na hakimu fulani ambaye hakumcha Mungu wala hakuwaheshimu watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaunganisha moja kwa moja mfano huu na tendo la Yesu la kusema katika mstari uliotangulia.
- source_word: Κριτής τις
  choice: hakimu fulani
  rationale: Neno τις linaonyesha mtu asiye tajwa kwa jina; ‘hakimu fulani’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: ἦν ἔν τινι πόλει
  choice: Katika mji fulani kulikuwa na
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida mhusika wa simulizi na kuhifadhi kutotajwa kwa mji kunakoonyeshwa na τις.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: hakumcha Mungu
  rationale: ‘Kumcha Mungu’ huhifadhi maana ya hofu yenye uzito wa kiadili na kidini, huku ikieleza tabia ya kudumu ya hakimu.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: wala hakuwajali watu
  rationale: Ingawa ἄνθρωπον ni umoja wa kijumla, ‘watu’ huwasilisha maana yake kwa Kiswahili cha asili. ‘Kuwajali’ hapa huonyesha kutokuwa na heshima, kujali, au kuzingatia wengine.
theological_decisions:
- issue: Umoja wa kijumla ἄνθρωπον katika ulinganisho na Mungu
  choice: watu
  alternative: mtu / mtu yeyote
  rationale: Kiswahili cha kawaida hutumia wingi ‘watu’ kueleza kundi la wanadamu kwa ujumla. Tanbihi inahifadhi umoja wa Kigiriki na uwezekano wa kuelewa maana kuwa hakumjali mtu yeyote.
- issue: Maana ya ἐντρεπόμενος
  choice: hakuwajali
  alternative: hakuwaheshimu / hakuwaonea haya
  rationale: Katika muktadha huu neno linaeleza kutompa mwanadamu mwingine uzito au stahili. ‘Hakuwajali’ ni la kawaida na pana bila kulifunga neno katika hisia ya aibu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Marudio ya ‘fulani’ yamehifadhiwa ili kuakisi kutotajwa kwa hakimu na mji katika Kigiriki.
