  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: sw
  text: Lakini kwa sababu mjane huyu anaendelea kunisumbua, nitamtendea haki[a], ili kwa kuendelea kuja asinichoshe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitamtetea.” Kitenzi cha Kigiriki kinaweza pia kumaanisha “nitamlipizia kisasi” katika miktadha mingine, lakini hapa kinahusu kumtendea haki katika shauri la kisheria.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “asinipige chini ya jicho.” Hapa yaelekea ni nahau yenye maana ya “asinichoshe” au “asinilemee.” Pia inawezekana kutafsiri sehemu hii, “ili asije hatimaye akanipiga chini ya jicho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: kwa sababu ... anaendelea kunisumbua
  rationale: Muundo διά pamoja na kitenzi-jina unaonyesha sababu, na γε inatia mkazo. Kauli hii ya Kiswahili inaonyesha usumbufu unaoendelea kwa lugha ya kawaida.
- source_word: τὴν χήραν ταύτην
  choice: mjane huyu
  rationale: Inahifadhi wazi hali yake kama mjane na kiwakilishi cha kuonyesha, mambo muhimu katika mfano huu.
- source_word: ἐκδικήσω αὐτήν
  choice: nitampatia haki
  rationale: Katika mazingira ya mahakama, kitenzi hiki kinamaanisha kumpa mtu haki au kumtetea kisheria, si kulipiza kisasi binafsi.
- source_word: εἰς τέλος ἐρχομένη
  choice: kwa kuendelea kuja
  rationale: Inawasilisha kuja kwake mara kwa mara na kwa kudumu bila kulazimisha maana ya ‘mwishowe,’ ambayo pia inaweza kujadiliwa kisarufi.
- source_word: ὑπωπιάζῃ με
  choice: asinichoshe
  rationale: Ingawa maana ya moja kwa moja inaweza kuwa kumpiga mtu chini ya jicho, hapa matumizi ya kimfano ya kumchosha au kumlemea mtu kwa usumbufu yanafaa zaidi katika muktadha.
theological_decisions:
- issue: Maana ya ἐκδικήσω katika mfano unaohusu haki na sala
  choice: nitampatia haki
  alternative: nitamlipizia kisasi / nitamtetea
  rationale: Muktadha unahusu mwamuzi kutoa suluhisho la kisheria. ‘Kumpatia haki’ inadumisha kiungo na mada ya Mungu kuwapatia haki wateule wake katika mistari inayofuata bila kuingiza wazo lisilo la lazima la kisasi binafsi.
- issue: Nguvu ya ὑπωπιάζῃ na uhusiano wa εἰς τέλος
  choice: ili kwa kuendelea kuja asinichoshe
  alternative: ili asije hatimaye akanipiga chini ya jicho
  rationale: Tafsiri kuu inafuata maana ya kimfano inayofaa zaidi kwa malalamiko ya mwamuzi, huku tanbihi ikihifadhi taswira halisi na uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Anaendelea kunisumbua’ na ‘kwa kuendelea kuja’ zinaonyesha hali ya kudumu na kurudiwa; tanbihi zinahifadhi utata wa kitenzi chenye taswira kali na uwezekano wa mpangilio mwingine wa εἰς τέλος.
