lexical_decisions:
- source_word: Ἔλεγεν
  choice: Akawaambia
  rationale: Kauli ya wakati uliopita isiotimilifu inaweka tendo katika simulizi; Kiswahili cha masimulizi hutumia kwa kawaida “akawaambia,” bila kulazimisha muundo mzito wa “alikuwa akiwaambia.”
- source_word: δὲ
  choice: ka- katika “Akawaambia”
  rationale: Kiunganishi hiki hafifu kinaendeleza au kuhamisha simulizi; katika Kiswahili mtiririko wake unawakilishwa kiasili na kiambishi cha masimulizi “ka-” badala ya neno tofauti.
- source_word: παραβολὴν
  choice: mfano
  rationale: “Mfano” ni istilahi ya kawaida na inayoeleweka kwa παραβολή katika muktadha wa Injili.
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: kuhusu ulazima wa wao
  rationale: Muundo huu unaonyesha lengo au jambo linalohusu ulazima; “ulazima wa wao” huhifadhi nguvu ya δεῖν na pia αὐτούς kama mtendaji wa vitenzi visoukomo.
- source_word: πάντοτε προσεύχεσθαι
  choice: kusali sikuzote
  rationale: Hutoa maana ya kuendelea na kudumu katika sala bila kudokeza kwamba mtu anatamka sala bila kikomo kila dakika.
- source_word: μὴ ἐγκακεῖν
  choice: bila kukata tamaa
  rationale: Ni usemi wa sasa na wa kawaida unaobeba maana ya kutovunjika moyo, kutolegea, au kuacha kwa sababu ya kukata tamaa.
theological_decisions:
- issue: Nguvu ya ulazima katika fundisho la Yesu kuhusu kudumu katika sala
  choice: ulazima wa wao kusali sikuzote bila kukata tamaa
  alternative: ili kuwaonyesha kwamba imewapasa kusali sikuzote bila kuvunjika moyo
  rationale: “Ulazima” huhifadhi nguvu ya δεῖν bila kuingiza fundisho maalumu la kimadhehebu kuhusu jinsi sala inavyofanya kazi; pia haiufanyi wito huu kuwa pendekezo dhaifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kusali” ni kitenzi cha kawaida katika muktadha wa sala; “sikuzote” na “kukata tamaa” vinaeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa katika matini kuu.
