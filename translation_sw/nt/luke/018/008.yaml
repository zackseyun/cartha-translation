  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: sw
  text: Ninawaambia kwamba atawatendea haki upesi[a]. Hata hivyo, Mwana wa Adamu atakapokuja, je, kweli ataikuta imani duniani?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawatetea” au “atawapatia haki.” Neno la Kigiriki linaweza kumaanisha kuthibitisha haki ya mtu au kumtendea haki.
    reason: lexical_alternative
  - marker: b
    text: Au, “kumwamini” au “uaminifu.” Neno la Kigiriki linaweza kumaanisha imani, kumwamini, au uaminifu; matini kuu inadumisha tafsiri pana “imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: atawatendea haki
  rationale: Katika muktadha wa mjane anayetafuta haki mahakamani, usemi huu unaonyesha Mungu kuwapatia haki au kuwatetea. ‘Atawatendea haki’ ni Kiswahili cha kawaida na huepuka kusisitiza mno wazo la kulipiza kisasi.
- source_word: ἐν τάχει
  choice: upesi
  rationale: Usemi huu unaweza kumaanisha kwa haraka au bila kukawia. ‘Upesi’ huhifadhi maana ya kasi bila kulazimisha tafsiri ya ratiba kwamba jambo hilo lazima litokee karibuni.
- source_word: πλὴν
  choice: Hata hivyo
  rationale: Huonyesha badiliko lenye utofautishaji mkubwa kati ya uhakika wa Mungu kutenda haki na swali linalofuata.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka kwa kujitaja kwa Yesu na huhifadhi mwangwi wake wa Danieli 7.
- source_word: ἐλθὼν
  choice: atakapokuja
  rationale: Kirai kishirikishi kina uhusiano wa wakati na kitenzi kikuu; ‘atakapokuja’ hutoa uhusiano huo kwa Kiswahili cha asili.
- source_word: ἆρα
  choice: kweli
  rationale: Neno hili hulipa swali hali ya kutafakari na kuchunguza; ‘kweli’ huwasilisha nguvu hiyo bila kulifanya jibu liwe la lazima.
- source_word: τὴν πίστιν
  choice: imani
  rationale: ‘Imani’ huhifadhi upana wa πίστις, ambalo hapa linaweza pia kugusa kutumaini au uaminifu unaodumu.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Katika kauli hii yenye upeo mpana, ‘duniani’ ni tafsiri ya asili ya Kiswahili na inafaa zaidi kuliko maana finyu ya ‘katika nchi.’
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa kudumu katika sala
  choice: imani
  alternative: kutumaini au uaminifu
  rationale: Matini kuu hudumisha neno pana ‘imani’ bila kuamua kimadhehebu ikiwa mkazo ni tumaini la ndani au uaminifu unaoendelea; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ataikuta imani’ unahifadhi kibainishi cha Kigiriki τὴν kwa kadiri inayowezekana, huku ‘duniani’ ikitoa usemi wa kawaida. Alama zote za tanbihi zimo katika matini kuu.
