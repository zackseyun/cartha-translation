base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: sw
  text: Lakini akasema, “Yasiyowezekana kwa wanadamu yanawezekana kwa Mungu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: yasiyowezekana
  rationale: Kivumishi hiki cha wingi wa jinsia ya kati kimetumiwa kama nomino. Muundo huu wa Kiswahili ni wa asili na unadumisha maana ya mambo yaliyo nje ya uwezo wa mwanadamu.
- source_word: παρὰ ἀνθρώποις
  choice: kwa wanadamu
  rationale: 'παρά pamoja na hali ya dative huonyesha uhusiano au nyanja: jambo lisilowezekana katika uwezo wa kibinadamu. “Wanadamu” linajumuisha watu wote kwa usahihi.'
- source_word: δυνατὰ
  choice: yanawezekana
  rationale: Ni kinyume cha ἀδύνατα na hapa humaanisha kwamba mambo hayo yanaweza kufanyika; pia upatanisho wa wingi unalingana na “yasiyowezekana.”
- source_word: παρὰ τῷ θεῷ
  choice: kwa Mungu
  rationale: Muundo huu unadumisha ulinganifu wa “kwa wanadamu” na kueleza kwamba jambo hilo linawezekana katika uwezo wa Mungu.
- source_word: ὁ δὲ εἶπεν
  choice: Lakini akasema
  rationale: δέ hapa inaonyesha tofauti nyepesi na kauli iliyotangulia. Kiswahili hakihitaji kutaja kiwakilishi “yeye” kwa kuwa mtendaji anaeleweka katika kitenzi.
theological_decisions:
- issue: Upeo wa uwezekano wa kimungu
  choice: Kauli inalinganisha kutowezekana kwa upande wa wanadamu na kuwezekana kwa upande wa Mungu, katika muktadha wa wokovu.
  alternative: Kuifasiri kama kauli ya kifalsafa kuhusu kila tendo linaloweza kudhaniwa.
  rationale: Tafsiri inadumisha upana wa kauli ya Kigiriki bila kuingiza dai la kifalsafa ambalo muktadha haulielezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya Kiingereza kati ya “with” na “for” huwasilishwa kwa neno lilelile la kawaida “kwa” katika Kiswahili.
