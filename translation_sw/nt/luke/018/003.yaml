  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: sw
  text: Katika mji ule palikuwa na mjane, naye alikuwa akimwendea mara kwa mara akisema, “Nipatie haki dhidi ya mpinzani wangu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unitetee dhidi ya mpinzani wangu,” au, “Nipatie haki mbele ya mpinzani wangu.” Kitenzi cha Kigiriki kinaweza kumaanisha kumpatia mtu haki ya kisheria au kumtetea, si lazima kulipiza kisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: mjane
  rationale: Neno la kawaida na sahihi kwa mwanamke ambaye mume wake amekufa; pia linahifadhi umuhimu wa hali yake ya kijamii katika mfano huu.
- source_word: δὲ
  choice: naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumtambulisha mhusika mwingine bila kulazimisha maana ya upinzani.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: Katika mji ule palikuwa na
  rationale: Muundo huu wa Kiswahili unawakilisha kwa njia ya kawaida usemi wa uwepo pamoja na mahali.
- source_word: ἤρχετο πρὸς αὐτὸν
  choice: alikuwa akimwendea mara kwa mara
  rationale: Kauli ya wakati usiotimilika katika muktadha huu inaonyesha tendo lililorudiwa; “mara kwa mara” huweka wazi uvumilivu wake bila kubadili maana.
- source_word: λέγουσα
  choice: akisema
  rationale: Inawakilisha tendo la kusema lililoambatana na kwenda kwake mara kwa mara kwa Kiswahili cha kawaida.
- source_word: Ἐκδίκησόν με
  choice: Nipatie haki
  rationale: Katika mazingira ya kisheria, kitenzi hiki kinahusu kumpatia mtu haki au kumtetea kisheria, si lazima kulipiza kisasi.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: dhidi ya mpinzani wangu
  rationale: ἀντίδικος humaanisha upande pinzani katika mgogoro wa kisheria; “mpinzani wangu” ni wazi na ya kawaida, huku “dhidi ya” ikipatana na ombi la kupatiwa haki.
