  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: sw
  text: Bwana akasema, “Sikilizeni anachosema hakimu huyo asiye mwadilifu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakimu asiye na haki.” Kwa kihalisi, “hakimu wa udhalimu/ukosefu wa haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: akasema
  rationale: Kiambishi ‘ka-’ kinaendeleza simulizi kwa njia ya kawaida katika Kiswahili na kutoa tendo la wakati uliopita bila kulazimisha maana mahsusi ya wakati kwa δέ.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Katika simulizi la Luka, jina hili linamrejelea Yesu kwa uzito wa cheo; ‘Bwana’ huhifadhi maana hiyo kuliko ‘bwana mkubwa’ au ‘mkuu’.
- source_word: Ἀκούσατε
  choice: Sikilizeni
  rationale: Ni amri kwa wingi inayotaka usikivu makini. ‘Sikilizeni’ ni ya asili zaidi katika Kiswahili kuliko ‘Sikieni’ katika muktadha huu.
- source_word: τί ... λέγει
  choice: anachosema
  rationale: Muundo huu unaonyesha maudhui ya kauli ya hakimu, si namna anavyosema; wakati wa sasa wa λέγει umehifadhiwa katika ‘-nachosema’.
- source_word: ὁ κριτὴς
  choice: hakimu huyo
  rationale: ‘Hakimu’ ndiyo tafsiri ya moja kwa moja, na ‘huyo’ humrejelea kwa kawaida hakimu aliyetajwa tayari katika mfano.
- source_word: τῆς ἀδικίας
  choice: asiye mwadilifu
  rationale: Genitivi hii ya sifa, kihalisi ‘wa udhalimu/ukosefu wa haki,’ inaeleza tabia ya hakimu. ‘Asiye mwadilifu’ ni Kiswahili cha sasa na huhifadhi upana wa maana ya kimaadili na kimahakama.
theological_decisions:
- issue: Tafsiri ya κύριος inapomrejelea Yesu
  choice: Bwana
  alternative: mkuu
  rationale: ‘Bwana’ huhifadhi uzito wa cheo alio nao κύριος katika Luka bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Sifa ya hakimu katika τῆς ἀδικίας
  choice: asiye mwadilifu
  alternative: dhalimu
  rationale: Tafsiri iliyochaguliwa huhifadhi sifa pana ya kutokuwa na haki bila kuifanya lazima imaanishe ukatili pekee; tanbihi inaonyesha mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo ‘akasema’ unaendeleza simulizi kwa ufasaha, na ‘Sikilizeni’ huhifadhi amri ya wingi.
