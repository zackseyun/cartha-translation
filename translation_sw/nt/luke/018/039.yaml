base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: sw
  text: Wale waliokuwa wakitangulia walikuwa wakimkemea ili anyamaze; lakini yeye alizidi kupaza sauti, “Mwana wa Daudi, nihurumie!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: wale waliokuwa wakitangulia
  rationale: Kirai hiki cha kisifa kinachotumika kama nomino kinarejelea watu waliokuwa mbele katika umati au msafara; tafsiri hii inahifadhi maana ya mahali bila kuwapa jukumu lisilotajwa.
- source_word: ἐπετίμων
  choice: wakamkemea
  rationale: Kitenzi hiki kina maana ya kukaripia au kukemea kwa ukali. Ingawa Kigiriki kina hali isiyotimilifu, mfululizo wa tendo unaeleweka katika muktadha, na ‘wakamkemea’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: ἵνα σιγήσῃ
  choice: ili anyamaze
  rationale: Muundo wa ἵνα pamoja na hali tegemezi unaonyesha kusudi; ‘ili anyamaze’ ni tafsiri fupi, ya asili, na sahihi.
- source_word: πολλῷ μᾶλλον
  choice: hata zaidi
  rationale: Hiki ni kishazi cha kuongeza kiwango. ‘Hata zaidi’ kinahifadhi ulinganisho bila kuongeza neno ‘kwa sauti’ ambalo halipo wazi katika kishazi chenyewe.
- source_word: ἔκραζεν
  choice: akaendelea kupaza sauti
  rationale: Hali isiyotimilifu inaonyesha tendo lililoendelea au kurudiwa. ‘Akaendelea kupaza sauti’ linaonyesha msisitizo na kudumu kwa kilio chake kwa Kiswahili cha kawaida.
- source_word: Υἱὲ Δαυίδ
  choice: Mwana wa Daudi
  rationale: Ni jina la cheo lenye uzito wa kifalme na Kimasihi. Kutafsiri moja kwa moja kunahifadhi umuhimu wake bila kuufafanua kupita maandishi.
- source_word: ἐλέησόν με
  choice: nihurumie
  rationale: Ni ombi la amri lenye dharura. ‘Nihurumie’ ni Kiswahili cha kawaida, kifupi, na kinachohifadhi uzito wa ombi.
theological_decisions:
- issue: Umuhimu wa Kimasihi wa Υἱὲ Δαυίδ
  choice: Kutafsiri kama jina la cheo ‘Mwana wa Daudi’ katika matini kuu.
  alternative: Kulichukulia tu kama namna ya heshima isiyo na maana maalumu ya Kimasihi.
  rationale: Katika simulizi la Luka, jina hili lina maana ya kifalme na Kimasihi. Tafsiri ya moja kwa moja inahifadhi maana hiyo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa msomaji wa kawaida huku ukihifadhi ukali wa kukemea, kuendelea kwa kilio, na uzito wa jina la cheo ‘Mwana wa Daudi.’
