  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: sw
  text: Alipokuwa akikaribia Yeriko[a], mtu fulani aliyekuwa kipofu[b] alikuwa ameketi kando ya barabara akiombaomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokaribia Yeriko.”
    reason: Tofauti hii inaeleza kwa ufupi zaidi uhusiano wa wakati uliomo katika muundo wa Kigiriki.
  - marker: b
    text: Au kwa ufupi, “mtu aliyekuwa kipofu”; neno la Kigiriki τις lina kidokezo cha maana ya “fulani.”
    reason: Maelezo haya yanaonyesha maana ndogo ya kumtenga mtu mmoja inayoweza kuachwa bila kupoteza wazo kuu.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Hapa kirai hiki kinatumika hasa kuendeleza simulizi. Kiswahili cha kawaida hakihitaji maneno mazito kama “ikawa kwamba”; mpito unaeleweka katika sentensi yenyewe.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Alipokuwa akikaribia Yeriko
  rationale: Muundo huu unaonyesha jambo lililokuwa likitokea wakati huohuo. “Alipokuwa akikaribia” huhifadhi hali ya tendo linaloendelea, na “Yeriko” linabeba kwa kawaida wazo la kuelekea mjini humo.
- source_word: τυφλός τις
  choice: mtu fulani kipofu
  rationale: “Fulani” huhifadhi maana ya kutomtaja mtu huyo pamoja na kidokezo cha kumtenga kama mtu mahususi katika simulizi.
- source_word: ἐκάθητο
  choice: alikuwa ameketi
  rationale: Wakati usiotimilifu wa Kigiriki unaweka mandhari ya hali iliyoendelea; “alikuwa ameketi” huonyesha kwamba tayari alikuwa hapo akiwa amekaa.
- source_word: παρὰ τὴν ὁδὸν
  choice: kando ya barabara
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya mahali pembeni mwa njia au barabara.
- source_word: ἐπαιτῶν
  choice: akiombaomba
  rationale: Kitenzi hiki humaanisha kuomba vitu au sadaka kama mwombaji. “Akiombaomba” ni cha moja kwa moja na kinaeleweka kwa wasomaji wa sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida katika simulizi; “akiombaomba” ni wazi bila kutumia istilahi rasmi zaidi kama “akiomba sadaka.”
