  text: Naye akasema, “Hayo yote nimeyashika tangu ujana wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Naye akasema
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; “naye” kinaendeleza mazungumzo kwa kawaida bila kusisitiza tofauti isiyo wazi.
- source_word: Ταῦτα πάντα
  choice: Hayo yote
  rationale: Tafsiri hii inadumisha usemi wa Kigiriki usiotaja nomino waziwazi. Amri zinaeleweka kutokana na muktadha, lakini haziongezwi katika matini kuu.
- source_word: ἐφύλαξα
  choice: nimeyashika
  rationale: φυλάσσω hapa humaanisha kuzishika au kuzitii amri. Wakati timilifu wa Kiswahili unaonyesha dai kwamba amezishika hadi wakati wa kusema.
- source_word: ἐκ νεότητος μου
  choice: tangu ujana wangu
  rationale: ἐκ pamoja na hali ya umilikaji huonyesha mwanzo wa kipindi cha wakati; “tangu ujana wangu” ni Kiswahili cha kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Kiwakilishi “hayo” kinarejelea maagizo yaliyotangulia bila kuongeza neno “amri,” ambalo halipo wazi katika Kigiriki.
