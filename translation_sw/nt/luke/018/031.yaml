  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: sw
  text: Kisha akawachukua wale kumi na wawili, akawaambia, “Tazameni, tunapanda kwenda Yerusalemu, na yote yaliyoandikwa kwa njia ya manabii kuhusu Mwana wa Adamu[a] yatatimizwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Mwana wa Adamu.” Muundo wa Kiyunani unaweza kutafsiriwa hivyo kwa ukaribu zaidi, lakini huenda hapa unamaanisha yale ambayo manabii waliandika kumhusu.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: akawachukua
  rationale: Kitenzi hiki kina maana ya kuwachukua watu waandamane naye. Ingawa muktadha unaonyesha maelekezo yaliyotolewa kwa wale kumi na wawili pekee, neno la Kiyunani halisemi wazi ‘kando,’ hivyo tafsiri haiongezi wazo hilo.
- source_word: τοὺς δώδεκα
  choice: wale kumi na wawili
  rationale: Inahifadhi jina la kundi kama lilivyo katika Kiyunani bila kuongeza ‘wanafunzi.’
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni kiashiria cha mazungumzo kinachovuta fikira za wasikilizaji; ‘Tazameni’ ni cha sasa, kinachoeleweka, na chenye hadhi.
- source_word: ἀναβαίνομεν
  choice: tunapanda kwenda
  rationale: Inahifadhi wazo la kwenda juu kuelekea Yerusalemu pamoja na hali ya safari inayoendelea.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na linaeleweka kwa wasomaji wa Afrika Mashariki.
- source_word: τελεσθήσεται
  choice: yatatimizwa
  rationale: Kauli ya wakati ujao isiyotaja mtendaji inaonyesha kwamba yaliyoandikwa yatafikia utimilifu wake; ‘yatatimizwa’ linafaa katika muktadha wa unabii.
- source_word: πάντα τὰ γεγραμμένα
  choice: yote yaliyoandikwa
  rationale: Inahifadhi jumla ya πάντα na hali endelevu ya matokeo ya maandishi iliyo katika γεγραμμένα kwa Kiswahili cha kawaida.
- source_word: διὰ τῶν προφητῶν
  choice: kwa njia ya manabii
  rationale: διά pamoja na umilikishi huonyesha chombo au uwakala; usemi huu unaonyesha kwamba ujumbe uliandikwa kupitia manabii.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: kuhusu Mwana wa Adamu
  rationale: Dativu hapa inaeleweka kwa kawaida kuwa inarejelea yale yaliyoandikwa kumhusu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi ya kisarufi.
theological_decisions:
- issue: Tafsiri ya cheo cha Kikristo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ huhifadhi muundo wa Kiyunani na mwangwi unaowezekana wa Danieli bila kugeuza cheo hiki kuwa maelezo ya jumla kuhusu ubinadamu.
- issue: Uhusiano wa τῷ υἱῷ τοῦ ἀνθρώπου na yaliyoandikwa
  choice: kuhusu Mwana wa Adamu
  alternative: kwa ajili ya Mwana wa Adamu
  rationale: Dativu inaweza kueleweka kwa zaidi ya njia moja. Katika sentensi hii, maana ya mambo yaliyoandikwa kumhusu ndiyo inayofaa zaidi kimuktadha, lakini uwezekano wa maana ya ‘kwa ajili ya’ umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imefuata mtiririko wa masimulizi ya Luka bila kuongeza ‘kando,’ ambalo halijaelezwa wazi katika Kiyunani. Alama ya tanbihi imewekwa baada ya ‘Mwana wa Adamu,’ mahali panapohusika moja kwa moja na tofauti ya kisarufi.
