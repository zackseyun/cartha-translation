  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: sw
  text: Aliposikia umati ukipita, aliuliza-uliza jambo hilo lilikuwa nini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliuliza jambo hilo lingeweza kuwa nini.” Wakati usiotimilifu wa kitenzi unaweza kuonyesha tendo la kuuliza lililoendelea au lililorudiwa, na umbo la optative katika swali lisilo la moja kwa moja linaweza kudokeza tahadhari kidogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Aliposikia
  rationale: Kitenzi-shirikishi cha aoristi kinaelezwa kwa kishazi cha wakati, ambacho ni cha asili katika Kiswahili na kinahifadhi uhusiano wa kimazingira katika simulizi.
- source_word: δὲ
  choice: aka-
  rationale: Kiunganishi hiki hafifu cha simulizi kinaakisiwa kwa mfuatano wa kitenzi chenye kiambishi ka-, bila kuingiza utofautishaji usiokuwapo.
- source_word: ὄχλου
  choice: umati
  rationale: Neno hili humaanisha kundi kubwa la watu; “umati” ni la kawaida, lenye heshima, na halilazimishi utambulisho mahsusi ambao nomino ya Kigiriki isiyo na kibainishi haitoi.
- source_word: διαπορευομένου
  choice: ukipita
  rationale: Umbo la wakati uliopo linaonyesha mwendo uliokuwa ukiendelea; “ukipita” linafaa kwa watu waliokuwa wakipita karibu naye.
- source_word: ἐπυνθάνετο
  choice: akauliza-uliza
  rationale: Wakati usiotimilifu unaweza kudokeza kuuliza kulikoendelea au kurudiwa. Uradidi “uliza-uliza” huwasilisha hali hiyo kwa Kiswahili cha asili.
- source_word: τί εἴη τοῦτο
  choice: jambo hilo lilikuwa nini
  rationale: Swali lisilo la moja kwa moja lenye optative baada ya kitenzi cha wakati uliopita linaweza kutafsiriwa kwa kawaida hivi, bila kulifasiri moja kwa moja kuwa aliuliza maana yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi na kinachoeleweka kwa wasomaji wa kawaida. “Akauliza-uliza” limetumiwa kuhifadhi uwezekano wa tendo lililoendelea au kurudiwa; tanbihi inadumisha utata wa optative.
