id: LUK.18.19
reference: Luke 18:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: sw
  text: Lakini Yesu akamwambia, “Kwa nini unaniita mwema? Hakuna aliye mwema isipokuwa mmoja tu—Mungu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti ndogo na nguvu ya jibu la Yesu katika muktadha; “Naye” ingewezekana, lakini “Lakini” huonyesha vizuri zaidi namna Yesu anavyohoji salamu hiyo.
- source_word: εἶπεν ... αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi kitendo cha kusema na kiwakilishi cha yule aliyeambiwa, bila kuongeza tafsiri ya “akajibu.”
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu wa swali, τί ina maana ya kuuliza sababu; “Kwa nini” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya moja kwa moja “Nini.”
- source_word: με λέγεις ἀγαθόν
  choice: unaniita mwema
  rationale: Huhifadhi moja kwa moja wazo la kumwita Yesu kwa sifa ya ἀγαθός na ni usemi wa asili katika Kiswahili.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: mwema
  rationale: “Mwema” huonyesha sifa ya mtu na kutumika kwa uthabiti katika sehemu zote mbili, bila kuongeza ufafanuzi wa “mwenye maadili mema” ambao hauko wazi katika neno lenyewe.
- source_word: οὐδεὶς
  choice: Hakuna aliye
  rationale: Hutoa ukanushaji wa jumla kwa Kiswahili cha kawaida na huhusiana vizuri na kivumishi “mwema.”
- source_word: εἰ μὴ εἷς
  choice: isipokuwa mmoja tu
  rationale: Huhifadhi muundo wa kuondoa wengine pamoja na msisitizo wa εἷς kwamba ni mmoja pekee.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hutaja mhusika kwa njia ya kawaida na wazi katika Kiswahili, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
theological_decisions:
- issue: Maana ya swali la Yesu kuhusu wema wake na utambulisho wake
  choice: Kuhifadhi swali kama lilivyo bila kulifanya kuwa kukataa wema wake wala dai la moja kwa moja la uungu wake
  alternative: Kulifafanua kana kwamba Yesu anakataa kuwa mwema kabisa, au kana kwamba anatangaza wazi uungu wake kwa kukubali cheo hicho kwa njia isiyo ya moja kwa moja
  rationale: Kigiriki kinaacha mvutano wa kitheolojia bila kutamka hitimisho mojawapo hapa. Tafsiri inapaswa kuhifadhi mvutano huo badala ya kuutatua kwa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Yesu akamwambia” ni wa kawaida katika masimulizi ya Biblia; “mwema” huhifadhi uzito wa kimaadili na kitheolojia bila kuzidisha maana.
