id: LUK.18.15
reference: Luke 18:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: sw
  text: Watu walikuwa wakimletea hata watoto wachanga ili awaguse[a]. Lakini wanafunzi walipoona jambo hilo[c], waliwakemea watu hao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika masimulizi sambamba, mguso wa Yesu unahusishwa na kuwabariki watoto na kuwawekea mikono (taz. Mathayo 19:13; Marko 10:13, 16).
    reason: cross_reference
  - marker: b
    text: Yaani, watu waliokuwa wakiwaleta watoto wachanga kwa Yesu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, walipoona watu wakiwaleta watoto wachanga kwa Yesu.
    reason: clarification
lexical_decisions:
- source_word: Προσέφερον
  choice: walikuwa wakimletea
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa. Muundo huu wa Kiswahili unaonyesha hali hiyo kwa kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi cha kwanza hakihitaji kutafsiriwa kando mwanzoni mwa sentensi; cha pili kinaonyesha ugeukaji kutoka kwa kuwaleta watoto hadi mwitikio wa wanafunzi, hivyo ‘Lakini’ linafaa.
- source_word: καὶ τὰ βρέφη
  choice: hata watoto wachanga
  rationale: καί lina nguvu ya msisitizo hapa, na βρέφη humaanisha watoto walio wadogo sana, hasa wachanga.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: ili awaguse
  rationale: Muundo unaonyesha kusudi, na ἅπτομαι ni ‘gusa’; tafsiri haiongezi moja kwa moja wazo la kubariki lisilotajwa katika kitenzi hiki.
- source_word: ἰδόντες οἱ μαθηταὶ
  choice: wanafunzi walipoona jambo hilo
  rationale: Kirai tegemezi cha wakati ni Kiswahili cha kawaida kwa kishirikishi cha aoristi, huku ‘jambo hilo’ likirejelea kitendo cha kuwaleta watoto.
- source_word: ἐπετίμων αὐτοῖς
  choice: waliwakemea watu hao
  rationale: ἐπιτιμάω linaonyesha kukemea kwa nguvu. ‘Watu hao’ linaweka wazi kuwa kiwakilishi kinawarejelea waliowaleta watoto, bila kudokeza kuwa watoto ndio waliokemewa.
theological_decisions:
- issue: Asili ya tendo la Yesu kwa watoto
  choice: awaguse
  alternative: awabariki / aweke mikono juu yao
  rationale: Luka ametumia kitenzi kinachomaanisha ‘kugusa.’ Masimulizi sambamba yanahusisha mguso huo na baraka na kuweka mikono, lakini maana hiyo pana haijaingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watoto wachanga’ ni sahihi na linaeleweka kwa upana kuliko neno la kitabibu; muundo wa wakati unaonyesha tendo lililokuwa likiendelea. Alama zote za tanbihi zimewekwa katika matini kuu.
