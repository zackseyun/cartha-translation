  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: sw
  text: Nao wenyewe hawakuelewa lolote katika mambo hayo; kauli hiyo[a] ilikuwa imefichwa kwao[b], wala hawakufahamu yaliyokuwa yakisemwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe huo” au “neno hilo.”
    reason: lexical_alternative
  - marker: b
    text: Kauli ya kutendwa “ilikuwa imefichwa kwao” haisemi ni nani au ni nini kilichoificha.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: hawakuelewa
  rationale: Kitenzi συνίημι hapa kinamaanisha kuelewa kiakili yale ambayo Yesu alikuwa amesema. “Hawakuelewa” ni Kiswahili cha kawaida na hakiongezi wazo la kukubali au kuamini.
- source_word: οὐδὲν τούτων
  choice: lolote katika hayo
  rationale: Usemi huu unarejelea kwa wingi mambo yaliyotangulia kusemwa; “lolote katika hayo” ni wa asili katika Kiswahili na huhifadhi rejeo hilo.
- source_word: τὸ ῥῆμα τοῦτο
  choice: Kauli hiyo
  rationale: ῥῆμα inaweza kumaanisha neno, kauli, au ujumbe. Katika muktadha huu “kauli hiyo” hurejelea kwa kawaida maelezo yaliyotangulia bila kuifanya iwe neno moja tu.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: ilikuwa imefichwa kwao
  rationale: Muundo huu unaonyesha hali iliyotokana na kufichwa. Tafsiri ya hali ya kutendwa huhifadhi kwamba Kigiriki hakimtaji aliyeficha.
- source_word: ἐγίνωσκον
  choice: hawakufahamu
  rationale: Katika muktadha huu γινώσκω ina maana ya kufahamu. “Hawakufahamu” ni ya asili na pia inadumisha tofauti ndogo ya msamiati na συνῆκαν, iliyotafsiriwa “hawakuelewa.”
- source_word: τὰ λεγόμενα
  choice: yaliyokuwa yakisemwa
  rationale: Hii huhifadhi maana ya mambo yaliyokuwa katika mchakato wa kusemwa, kwa Kiswahili cha kawaida na fasaha.
theological_decisions:
- issue: Chanzo cha kufichwa kwa kauli hiyo
  choice: Kuhifadhi kauli ya kutendwa bila kumtaja aliyeficha
  alternative: Kusema wazi kwamba Mungu aliwaficha, au kwamba mkanganyiko wao wenyewe uliwazuia kuelewa
  rationale: Kigiriki hakimtaji mtendaji. Tafsiri haipaswi kuamua iwapo kufichwa kulitokana moja kwa moja na Mungu, mpango wa kimungu, au hali ya wanafunzi wenyewe.
- issue: Maelezo ya mara tatu kuhusu kutokuelewa
  choice: 'Kuhifadhi hatua zote tatu: hawakuelewa, kauli ilikuwa imefichwa, na hawakufahamu'
  alternative: Kuunganisha maelezo hayo kuwa kauli moja fupi ya kutokuelewa
  rationale: Marudio hayo ni sehemu ya msisitizo wa Luka na yanaacha uzito wa kifasihi na kitheolojia wa kutokuelewa kwa wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nao” huendeleza simulizi kwa urahisi; “kauli hiyo” na “yaliyokuwa yakisemwa” ni wazi kwa wasomaji wa kawaida bila kupoteza tofauti za msingi za Kigiriki.
