source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: sw
  text: Je, Mungu hatawatendea haki watu wake aliowachagua, ambao wanamlilia mchana na usiku? Je, atachelewa kwa muda mrefu kuwatendea haki?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ingawa ana subira nao,” au, “naye je, ana subira nao?” Kirai cha Kigiriki kinaweza kueleweka kuwa kinahusu subira badala ya kukawia.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: kuwatendea haki
  rationale: Katika muktadha wa mwamuzi dhalimu na ombi la kudumu, neno hili linamaanisha kutoa haki au utetezi wa kisheria, si kulipiza kisasi cha kibinafsi.
- source_word: ἐκλεκτῶν
  choice: watu wake aliowachagua
  rationale: Kivumishi hiki kimetumiwa kama nomino. Usemi huu ni wa kawaida na wazi kwa wasomaji wa leo, huku ukihifadhi maana ya kwamba Mungu ndiye aliyewachagua bila kuingiza msimamo mwembamba wa kimadhehebu.
- source_word: βοώντων
  choice: ambao wanamlilia
  rationale: Kitenzi kinaonyesha mwito wenye uzito na unaoendelea; “wanamlilia” kinafaa kwa ombi la dhati linaloelekezwa kwa Mungu.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana na usiku
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi mkazo wa kuomba daima.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Je, atakawia muda mrefu kuwasaidia?
  rationale: Kirai hiki kinaweza kumaanisha kuwa na subira au kukawia. Katika muktadha unaofuata, swali kuhusu kukawia kutenda linaendeleza hoja ya Yesu kwa lugha ya kawaida; maana ya subira imehifadhiwa katika tanbihi.
- source_word: οὐ μὴ ποιήσῃ
  choice: Je, Mungu hatawatendea
  rationale: Muundo wa Kigiriki ni ukanushaji wenye nguvu ndani ya swali linalotarajia jibu la ndiyo. Swali la Kiswahili lenye “hata-” linahifadhi nguvu hiyo kwa kawaida.
- source_word: θεὸς
  choice: Mungu
  rationale: Hili ndilo tafsiri sanifu; kibainishi cha Kigiriki kinamtambulisha Mungu kama mtendaji bila kuhitaji ufafanuzi zaidi.
theological_decisions:
- issue: Maana ya μακροθυμεῖ ἐπ’ αὐτοῖς kuhusiana na tabia na utendaji wa Mungu
  choice: 'Imetafsiriwa kama swali kuhusu kukawia kutenda: “Je, atakawia muda mrefu kuwasaidia?”'
  alternative: “ingawa anawavumilia kwa subira” au “naye je, anawavumilia kwa subira?”
  rationale: Kigiriki kinaruhusu maana inayokazia subira au uvumilivu wa Mungu, lakini muktadha wa karibu, hasa mstari wa 8, unakazia kutenda kwake upesi ili kuwapatia watu wake haki. Tanbihi inadumisha utata halisi wa kirai hicho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Watu wake aliowachagua” imetumiwa badala ya istilahi nzito zaidi ya “wateule,” na utata wa kirai cha mwisho umehifadhiwa kwa tanbihi.
