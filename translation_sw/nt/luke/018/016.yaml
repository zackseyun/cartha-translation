  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: sw
  text: Lakini Yesu akawaita waje kwake, akisema, “Waacheni watoto waje kwangu, wala msiwazuie, kwa maana ufalme wa Mungu ni wa watu walio kama hawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: akawaita waje kwake
  rationale: Kitenzi cha kati προσκαλέομαι humaanisha kuwaita au kuwaita waje karibu na mtu. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba Yesu aliwaita watoto kwake bila kulazimisha maana ya kiwakilishi.
- source_word: Ἄφετε τὰ παιδία
  choice: Waacheni watoto
  rationale: Hapa ἀφίημι ina maana ya kuruhusu. “Waacheni watoto” ni amri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἔρχεσθαι πρός με
  choice: waje kwangu
  rationale: Inawasilisha kwa kawaida mwendo kuelekea kwa Yesu na inaungana vizuri na “waacheni.”
- source_word: μὴ κωλύετε αὐτά
  choice: wala msiwazuie
  rationale: κωλύω ni kuzuia au kukwamisha. “Msiwazuie” huhifadhi upana wa maana, na “wala” huunganisha amri mbili zinazohusiana.
- source_word: τῶν ... τοιούτων
  choice: watu walio kama hawa
  rationale: Usemi huu hauwahusu tu watoto waliokuwapo, bali kundi linalowakilishwa nao. “Watu walio kama hawa” ni Kiswahili cha asili na hakifafanui ni sifa zipi hasa zinazokusudiwa.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo neno la kawaida, lenye heshima, kwa dhana ya βασιλεία τοῦ θεοῦ katika Kiswahili cha Biblia.
theological_decisions:
- issue: Upeo wa τῶν τοιούτων
  choice: “watu walio kama hawa” hupanua rejeo zaidi ya watoto hao wenyewe
  alternative: Kurejelea watoto halisi waliokuwa wakiletwa kwa Yesu pekee
  rationale: Muundo wa Kigiriki unaonyesha kundi la watu wanaowakilishwa na watoto hawa, lakini mstari wenyewe hautaji ni sifa gani za kufanana na watoto zinazokusudiwa. Tafsiri inahifadhi mvutano huo.
- issue: Maana ya umilikaji katika τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: “ufalme wa Mungu ni wa”
  alternative: “ufalme wa Mungu ni kwa ajili ya” au kwa namna halisi zaidi “wa watu kama hawa ndio ufalme wa Mungu”
  rationale: “Ni wa” huwasilisha uhusiano wa umilikaji au kuhusika kwa uwazi bila kuongeza maelezo ya kiteolojia yasiyosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ni wa moja kwa moja, na lugha haiongezi neno “wadogo” kwa kuwa παιδία yenyewe hapa inaweza kutafsiriwa kwa kawaida kuwa “watoto.”
