lexical_decisions:
- source_word: σταθεὶς
  choice: akasimama
  rationale: Kitenzi hiki hapa kinaonyesha kwamba Yesu alisimama na kuacha kusonga mbele. “Akasimama” ni usemi wa kawaida na wenye hadhi katika Kiswahili; katika muktadha huu maana ya kusimama mahali inaeleweka.
- source_word: δὲ
  choice: Basi
  rationale: δὲ ni kiunganishi chepesi cha simulizi. “Basi” kinaendeleza tukio kwa kawaida bila kuingiza utofauti mkali.
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: κελεύω ina maana ya kutoa agizo. “Akaamuru” inadumisha uzito wa mamlaka uliomo katika kitenzi cha Kigiriki.
- source_word: ἀχθῆναι
  choice: aletwe
  rationale: Hiki ni kitenzi-jina cha wakati uliopita katika kauli tendwa kutoka ἄγω. “Aletwe” ni tafsiri pana na ya kawaida; “aongozwe” pia inawezekana kwa kuwa mtu huyo alikuwa kipofu.
- source_word: πρὸς αὐτόν
  choice: kwake
  rationale: πρός pamoja na hali ya kushutumiwa inaonyesha mwendo kuelekea kwa Yesu. “Kwake” ni fupi na ya kawaida katika Kiswahili.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Alipokaribia
  rationale: Muundo huu wa genitivi kamili unaonyesha wakati, na mhusika ni yule mtu aliyetajwa. “Alipokaribia” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐπηρώτησεν
  choice: akamuuliza
  rationale: ἐπερωτάω hapa ina maana ya kuuliza. Kiambishi “-mu-” kinamtambulisha wazi yule mtu kama anayeulizwa.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake sanifu katika Kiswahili.
