  text: 'Basi Yesu akasimama tuli[a], akaamuru yule mtu aletwe kwake.[b] Alipomkaribia, akamuuliza:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akasimama.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa ufupi, lakini “akasimama tuli” huweka wazi kwamba Yesu aliacha kusonga mbele.
    reason: lexical_alternative
  - marker: b
    text: Au “aongozwe kwake.” Kitenzi cha Kigiriki kinaweza kumaanisha kuongoza au kuleta; hapa “aletwe” kinafaa zaidi katika simulizi.
