  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: sw
  text: Kwa muda fulani hakutaka, lakini baadaye akajiambia, ‘Ingawa simwogopi Mungu wala simstahi mtu yeyote,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: hakutaka
  rationale: Kitenzi cha wakati usiotimilika pamoja na ukanushi kinaonyesha kutotaka kulikodumu kwa kipindi fulani; Kiswahili ‘hakutaka’ ni cha kawaida na huhifadhi maana ya hiari bila kuongeza ukali wa ‘alikataa kabisa.’
- source_word: ἐπὶ χρόνον
  choice: kwa muda fulani
  rationale: Kirai hiki huonyesha kipindi kisichobainishwa; ‘kwa muda fulani’ ni cha asili na hakibainishi urefu wake kupita chanzo.
- source_word: μετὰ ταῦτα δὲ
  choice: lakini baadaye
  rationale: Huhifadhi mfuatano wa wakati pamoja na utofautishaji mdogo unaoletwa na δέ.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: akajiambia
  rationale: Ni njia ya kawaida ya Kiswahili ya kueleza maneno ya moyoni yanayoelekezwa kwa nafsi mwenyewe.
- source_word: Εἰ καὶ
  choice: Ingawa
  rationale: Katika muktadha huu ni kishazi cha kukubali hali ilivyo, si sharti lisilo na uhakika; ‘ingawa’ huhifadhi maana hiyo.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: simwogopi Mungu
  rationale: Huhifadhi usemi wa moja kwa moja kuhusu kutomwogopa Mungu, ambao unaweza pia kuhusisha kutomheshimu, bila kuufafanua kupita kiasi.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: wala simstahi mtu yeyote
  rationale: ἐντρέπομαι hapa ni kuwa na staha au kujali mtu; nomino ἄνθρωπον ya umoja imetumiwa kwa maana ya jumla, ambayo katika Kiswahili cha kawaida huwasilishwa kwa ‘mtu yeyote.’
theological_decisions:
- issue: Maana ya kumwogopa Mungu
  choice: simwogopi Mungu
  alternative: simchi Mungu
  rationale: ‘Kumwogopa Mungu’ huhifadhi kwa karibu φοβοῦμαι na ukali wa maelezo ya hakimu; ‘kumcha’ lingeweka wazi zaidi maana ya heshima ya kidini ambayo chanzo kinaweza kudokeza lakini hakilazimishi pekee.
- issue: Umoja wa jumla katika ἄνθρωπον
  choice: mtu yeyote
  alternative: mwanadamu
  rationale: Umoja wa Kigiriki unatumiwa kiujumla. ‘Mtu yeyote’ ni Kiswahili cha asili, kinawahusu wanadamu kwa ujumla, na kudumisha tofauti kati ya Mungu na watu bila kuingiza jinsia isiyolengwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umebaki wa simulizi na usemi wa ndani; mstari unaishia kwa koma kwa sababu usemi unaendelea katika mstari unaofuata.
