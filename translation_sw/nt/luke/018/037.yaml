  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: sw
  text: Nao wakamwambia[a], “Yesu Mnazareti anapita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nao wakamwambia, ‘Yesu wa Nazareti anapita.’” Kigiriki kinasema kihalisi zaidi “Yesu Mnazareti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: wakamwambia
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kumwambia mtu jambo. Katika muktadha huu, “wakamwambia” ni ya kawaida na inaonyesha kwamba walimpa taarifa aliyouliza.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi bila kuonyesha upinzani mkali.
- source_word: αὐτῷ
  choice: -mw-
  rationale: Kiwakilishi cha yambwa katika “wakamwambia” kinawakilisha kwa kawaida maana ya “kwake/yeye” katika Kiswahili.
- source_word: ὅτι
  choice: maneno ya moja kwa moja
  rationale: ὅτι huanzisha taarifa iliyotolewa. Nukuu ya moja kwa moja ni ya asili katika Kiswahili na inadumisha yaliyomo katika taarifa hiyo.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὁ Ναζωραῖος
  choice: Mnazareti
  rationale: Neno la Kigiriki ni jina la utambulisho linalomhusianisha Yesu na Nazareti. “Mnazareti” huhifadhi muundo huo wa jina la utambulisho kwa Kiswahili cha kawaida.
- source_word: παρέρχεται
  choice: anapita
  rationale: Wakati wa sasa unaonyesha tendo linaloendelea wakati huo; “anapita” ni usemi wa kawaida na wa moja kwa moja.
theological_decisions:
- issue: Namna ya kutafsiri jina la utambulisho la Yesu Ναζωραῖος
  choice: Mnazareti
  alternative: Yesu wa Nazareti
  rationale: Hili kimsingi ni jina la utambulisho linalohusishwa na mahali, si cheo kinachohitaji ufafanuzi wa kimafundisho. “Mnazareti” linafuata kwa karibu muundo wa Kigiriki, huku tanbihi ikitoa usemi mwingine wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. “Nao” inadumisha mwendelezo wa simulizi, na “anapita” linaonyesha tendo linaloendelea wakati huo.
