id: LUK.18.43
reference: Luke 18:43
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: sw
  text: Mara moja akapata kuona[a], naye akawa akimfuata[b], huku akimtukuza Mungu. Watu wote walipoona hayo, wakampa Mungu sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaona tena” au “akarudishiwa uwezo wa kuona.” Kitenzi cha Kigiriki kinaweza kumaanisha kupata kuona au kuona tena.
    reason: lexical_alternative
  - marker: b
    text: Au, “akamfuata.” Kitenzi cha Kigiriki kinaweza kusisitiza kwamba tendo la kumfuata lilikuwa likiendelea.
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Mara moja
  rationale: Huonyesha kwamba tendo lilitokea bila kuchelewa; ni usemi wa kawaida na ulio wazi katika Kiswahili cha sasa.
- source_word: ἀνέβλεψεν
  choice: akapata kuona
  rationale: Katika muktadha wa uponyaji, kitenzi hiki humaanisha kupata au kurudishiwa uwezo wa kuona. Tafsiri hii ni ya asili na hailazimishi hitimisho kwamba mtu huyo aliwahi kuona kabla.
- source_word: ἠκολούθει
  choice: akawa akimfuata
  rationale: Muundo huu unaonyesha tendo lililoendelea, sawasawa na hali ya kitenzi cha Kigiriki, bila kuongeza wazo kwamba alikuwa tayari anamfuata kabla ya kuponywa.
- source_word: δοξάζων
  choice: huku akimtukuza
  rationale: Huonyesha tendo lililoandamana na kumfuata na huhifadhi maana ya kumpa Mungu utukufu, huku likitofautishwa na neno la sifa mwishoni mwa aya.
- source_word: πᾶς ὁ λαός
  choice: Watu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kundi zima lililoshuhudia tukio.
- source_word: ἰδών
  choice: walipoona hayo
  rationale: Kiswahili hutumia wingi kwa kawaida kurejelea 'watu wote'; 'hayo' linaelekeza kwa uponyaji na mwitikio uliosimuliwa bila kufafanua zaidi ya muktadha.
- source_word: ἔδωκεν αἶνον
  choice: wakampa ... sifa
  rationale: Huhifadhi muundo wa Kigiriki wa 'kutoa/kumpa sifa' na ni usemi wa asili katika Kiswahili.
- source_word: θεόν / θεῷ
  choice: Mungu
  rationale: Ni tafsiri sanifu, na kurudiwa kwake kumehifadhiwa ili kudumisha msisitizo wa aya.
theological_decisions:
- issue: Hali ya tendo la kumfuata Yesu baada ya kuponywa
  choice: akawa akimfuata
  alternative: akamfuata
  rationale: Kitenzi ἠκολούθει kiko katika hali isiyotimilifu na kinaweza kuonyesha tendo lililoendelea. Tafsiri iliyochaguliwa huhifadhi hali hiyo bila kuongeza dai jingine kuhusu uanafunzi.
- issue: Umoja wa kisarufi wa πᾶς ὁ λαός na maana yake ya kundi
  choice: Watu wote walipoona hayo, wakampa Mungu sifa
  alternative: Umati wote ulipoona hayo, ulimpa Mungu sifa
  rationale: Kiswahili cha kawaida hutumia upatanisho wa wingi kwa 'watu wote.' Hili ni badiliko la kisarufi kwa ufasaha, si badiliko la maana ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku tofauti kati ya 'kumtukuza Mungu' na 'kumpa Mungu sifa' ikihifadhi msamiati tofauti wa Kigiriki.
