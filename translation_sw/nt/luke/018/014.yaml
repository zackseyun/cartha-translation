id: LUK.18.14
reference: Luke 18:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: sw
  text: Nawaambia, mtu huyu alishuka kwenda nyumbani kwake akiwa amehesabiwa haki kuliko yule mwingine[a]. Kwa maana kila mtu anayejikweza atashushwa, lakini anayejishusha atakwezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amehesabiwa haki kwa kulinganishwa na yule mwingine”; kirai hiki kinamtofautisha mtu huyu na mwabudu yule mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: akiwa amehesabiwa haki
  rationale: Kirai hiki kinadumisha hali timilifu na sauti ya kutendwa ya kitenzi cha Kigiriki, huku kikionyesha hukumu ya Mungu inayomkubali mtu kuwa mwenye haki bila kuingiza mfumo mpana wa kiteolojia usioelezwa katika mstari huu.
- source_word: παρ’ ἐκεῖνον
  choice: kuliko yule mwingine
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha ulinganisho au utofautishaji. ‘Kuliko yule mwingine’ ni Kiswahili cha kawaida kinachoonyesha tofauti kati ya mtoza ushuru na Farisayo, huku tanbihi ikihifadhi uwezekano wa kuielewa kama ulinganisho wa moja kwa moja.
- source_word: κατέβη
  choice: alishuka kwenda
  rationale: Huhifadhi taswira halisi ya kushuka kutoka eneo la Hekalu badala ya kuibadilisha tu kuwa ‘alirudi.’ Kuongezwa kwa ‘kwenda’ kunafanya mwendo kuelekea nyumbani usikike kwa kawaida katika Kiswahili.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kwenda katika nyumba au makao yake, bila kufanya sentensi iwe nzito.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: kila mtu anayejikweza
  rationale: Huwasilisha kanuni ya jumla na nguvu ya kujitendea ya ἑαυτόν. ‘Kujikweza’ ni usemi wa kawaida na wenye hadhi unaofaa muktadha wa kiburi.
- source_word: ταπεινωθήσεται
  choice: atashushwa
  rationale: Huhifadhi sauti ya kutendwa na taswira ya kuwa chini inayolingana moja kwa moja na kukwezwa; mtendaji anaachwa bila kutajwa kama katika Kigiriki.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: lakini anayejishusha
  rationale: Huhifadhi utofautishaji wa δέ, nguvu ya kujitendea, na muundo sambamba wa msemo bila marudio yasiyo ya lazima.
- source_word: ὑψωθήσεται
  choice: atakwezwa
  rationale: Huhifadhi sauti ya kutendwa na inaunda ulinganifu wazi na ‘anayejikweza’ na ‘atashushwa,’ huku mtendaji akibaki bila kutajwa.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Huanzisha msingi unaoeleza hukumu iliyotangulia kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Humtaja wazi mtoza ushuru anayelinganishwa na Farisayo na ni usemi wa kawaida kuliko ‘huyu’ peke yake katika sentensi hii.
theological_decisions:
- issue: Maana ya δικαιόω katika hitimisho la mfano
  choice: Hukumu ya Mungu ya kumkubali mtu kuwa mwenye haki, iliyotafsiriwa ‘akiwa amehesabiwa haki’
  alternative: ‘akiwa amethibitishwa kuwa sawa’ au maana pana ya kutetewa
  rationale: Muktadha unalinganisha Farisayo anayejiona mwenye haki na mtoza ushuru anayetafuta rehema mbele za Mungu. ‘Amehesabiwa haki’ huhifadhi uzito wa hukumu ya Mungu yenye kibali bila kuingiza kwa lazima maelezo ya mfumo kamili wa soteriolojia.
- issue: Nguvu ya ulinganisho katika παρ’ ἐκεῖνον
  choice: ‘kuliko yule mwingine,’ pamoja na tanbihi ya ufafanuzi
  alternative: ‘badala ya yule mwingine’ au ‘kwa kulinganishwa na yule mwingine’
  rationale: Muundo wa Kigiriki unaweza kusisitiza utofauti au ulinganisho. Tafsiri kuu ni ya kawaida katika Kiswahili, na tanbihi inalinda utata halisi bila kuamua kimyakimya ikiwa ni ulinganisho wa kiwango au utofautishaji mkali.
- issue: Mtendaji asiyeelezwa katika ‘atashushwa’ na ‘atakwezwa’
  choice: Kudumisha sauti ya kutendwa bila kumtaja mtendaji
  alternative: Kusema wazi ‘Mungu atamshusha’ na ‘Mungu atamkweza’
  rationale: Ingawa muktadha unaweza kuelekeza kwa Mungu kama mtendaji, Kigiriki hakimwambishi wazi. Tafsiri inaacha mvutano huo kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘nyumbani kwake’ kwa uasilia, lakini imehifadhi taswira ya ‘alishuka.’ Muundo sambamba ‘anayejikweza atashushwa … anayejishusha atakwezwa’ unaendeleza mkazo na mpangilio wa msemo wa Kigiriki.
