translation:
  language: sw
  text: Hufunga mara mbili kwa juma[a]; hutoa sehemu ya kumi ya kila kitu ninachopata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “mara mbili za Sabato”; hii ni nahau yenye maana ya “mara mbili kwa juma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: hufunga
  rationale: Wakati uliopo hapa unaonyesha desturi ya kawaida; ‘hufunga’ huwasilisha dai la tendo linalorudiwa.
- source_word: δὶς
  choice: mara mbili
  rationale: Hii ndiyo maana ya moja kwa moja ya kielezi hiki.
- source_word: τοῦ σαββάτου
  choice: kwa juma
  rationale: Ingawa kwa umbo la maneno ni ‘ya Sabato,’ hapa ni nahau ya Kiyunani inayorejelea kipindi cha juma.
- source_word: ἀποδεκατῶ
  choice: hutoa sehemu ya kumi
  rationale: Kitenzi hiki humaanisha kutoa moja ya kumi; usemi huu ni wazi kwa wasomaji wa kawaida na huepuka kutegemea istilahi ya kidini pekee.
- source_word: πάντα ὅσα
  choice: kila kitu
  rationale: Muundo huu unaonyesha ujumla wa vitu vinavyohusika.
- source_word: κτῶμαι
  choice: ninachopata
  rationale: Kitenzi cha kati hapa kina maana ya kujipatia au kupata, si kumiliki tu; ‘ninachopata’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
theological_decisions:
- issue: Maana ya τοῦ σαββάτου katika dai kuhusu kufunga
  choice: 'maana ya nahau ya wakati: ‘kwa juma’'
  alternative: 'tafsiri halisi zaidi: ‘ya Sabato’'
  rationale: Kauli hii inaeleza mara ambazo tendo hufanyika, si fundisho kuhusu kushika Sabato. Tafsiri ya nahau huepuka dhana isiyo sahihi kwamba msemaji hufunga mara mbili siku ya Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kurudiwa kwa ‘mimi’ kunahifadhi msisitizo wa kujisifu katika kauli ya msemaji bila kufanya sentensi kuwa ngumu.
