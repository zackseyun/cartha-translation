  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: sw
  text: Baada ya kumpiga kwa mijeledi, watamuua, naye atafufuka siku ya tatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafufuliwa.” Kigiriki hapa kinasema kwa namna ya moja kwa moja zaidi, “atafufuka.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: baada ya kumpiga kwa mijeledi
  rationale: Kirai hiki kinaonyesha tendo lililotangulia tendo kuu. ‘Kumpiga kwa mijeledi’ ni Kiswahili cha sasa, wazi, na kinawasilisha ukatili wa adhabu hiyo bila kutumia neno la kizamani.
- source_word: ἀποκτενοῦσιν
  choice: watamuua
  rationale: Kitenzi cha wakati ujao, wingi, kina maana ya moja kwa moja ya kumuua; hakiongezi dhana ya ‘kumwua kwa makusudi ya jinai’ ambayo haijaelezwa wazi katika neno lenyewe.
- source_word: αὐτόν
  choice: -m- katika ‘watamuua’
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu kimeunganishwa kwa kawaida ndani ya kitenzi cha Kiswahili.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: siku ya tatu
  rationale: Hii ndiyo namna ya kawaida na iliyo wazi ya kueleza wakati huo kwa Kiswahili bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: ἀναστήσεται
  choice: atafufuka
  rationale: 'Kitenzi hiki ni cha wakati ujao na hapa kina maana isiyoelekeza tendo kwa yambwa: yeye mwenyewe atafufuka. Tafsiri hii inafuata umbo la Kigiriki kuliko ‘atafufuliwa,’ huku ikihifadhi maana ya ufufuo.'
theological_decisions:
- issue: Namna ya kueleza ufufuo
  choice: atafufuka
  alternative: atafufuliwa
  rationale: Umbo la Kigiriki ni future middle na linaeleweka hapa kwa maana isiyoelekeza tendo kwa yambwa, ‘atafufuka,’ si passive ya moja kwa moja. Chaguo la ‘atafufuliwa’ ni la kweli kiteolojia katika vifungu vingine, lakini hapa lingeweka wazi mtendaji asiyeelezwa katika sentensi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kiunganishi ‘naye’ kinahifadhi mfuatano wa sentensi huku kikifanya badiliko la mtendaji lieleweke.
