reference: Luke 18:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: sw
  text: ambaye hakika atapokea mara nyingi zaidi wakati huu, na katika enzi ijayo[a], uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu ujao.”
    reason: Tafsiri mbadala ya αἰών; ‘enzi’ huonyesha kipindi au utaratibu, ilhali ‘ulimwengu’ ni usemi mwingine unaotumiwa kwa dhana hii.
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: hakika
  rationale: Muundo huu wa ukanushi wenye mkazo pamoja na hali tegemezi unatoa uhakikisho wenye nguvu. Kiswahili cha kawaida huwasilisha nguvu hiyo kwa ‘hakika’ bila kutumia ukanushi maradufu usio wa asili.
- source_word: ἀπολάβῃ
  choice: atapokea
  rationale: Kitenzi kinaweza kumaanisha kupokea au kupokea tena. Katika muktadha huu, ‘atapokea’ ni ya asili na haikazii kupita kiasi wazo la kurudishiwa.
- source_word: πολλαπλασίονα
  choice: mara nyingi zaidi
  rationale: Usemi huu unaonyesha malipo yaliyozidishwa kwa wingi; ‘mara nyingi zaidi’ ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: wakati huu
  rationale: καιρός hapa ni wakati au kipindi maalumu, na usemi huu unatofautishwa na enzi ijayo.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: katika enzi ijayo
  rationale: ‘Enzi ijayo’ huhifadhi wazo la mpangilio ujao wa mambo, si wakati wa baadaye tu, na ni usemi mfupi wa asili.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Huu ni usemi wa kawaida na unaofaa katika Injili kwa maisha ya kudumu yanayohusishwa na enzi ijayo.
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinaendeleza moja kwa moja maelezo ya mtu aliyetajwa katika mstari uliotangulia.
theological_decisions:
- issue: Maana ya kieskatolojia ya αἰῶνι τῷ ἐρχομένῳ
  choice: enzi ijayo
  alternative: ulimwengu ujao
  rationale: ‘Enzi ijayo’ huhifadhi utofautishaji wa Agano Jipya kati ya wakati wa sasa na utaratibu ujao bila kuufanya kuwa rejeo la wakati wa baadaye pekee. ‘Ulimwengu ujao’ ni uwezekano mwingine, lakini unaweza kueleweka hasa kama mahali.
- issue: Nguvu ya οὐχὶ μὴ
  choice: hakika atapokea
  alternative: hataacha kupokea
  rationale: Tafsiri iliyochaguliwa huhifadhi uhakika wenye mkazo bila kuleta katika Kiswahili ukanushi maradufu unaoweza kusikika kama ahadi ya kutoshindwa badala ya ahadi chanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kwa kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia, umeanza kwa ‘ambaye’ na herufi ndogo.
