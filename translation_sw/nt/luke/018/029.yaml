source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: sw
  text: Akawaambia, “Amin, ninawaambia, hakuna mtu aliyeacha nyumba, au mke, au ndugu, au wazazi, au watoto kwa ajili ya ufalme wa Mungu,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amin
  rationale: Imehifadhi kauli ya uthibitisho yenye uzito ya Yesu, kwa neno linalotambulika katika Kiswahili cha Biblia.
- source_word: ἀφῆκεν
  choice: aliyeacha
  rationale: Huwasilisha moja kwa moja tendo la kuacha bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: οἰκίαν
  choice: nyumba
  rationale: Maana ya msingi hapa ni nyumba au makao; Kiswahili hakihitaji kibainishi kisicho dhahiri kama ‘a’ ya Kiingereza.
- source_word: ἀδελφοὺς
  choice: ndugu
  rationale: Neno hili la kawaida linaweza kurejelea ndugu wa kiume au jamaa, huku likihifadhi upana unaofaa wa neno la chanzo katika orodha ya kifamilia.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: kwa ajili ya ufalme wa Mungu
  rationale: Tafsiri ya kawaida na wazi inayohifadhi sababu iliyotajwa katika Kigiriki.
theological_decisions:
- issue: Uzito wa kauli Ἀμὴν λέγω ὑμῖν
  choice: Amin, ninawaambia
  alternative: Kweli ninawaambia
  rationale: ‘Amin’ huhifadhi namna bainifu ya Yesu ya kutanguliza tamko lenye mamlaka, bila kulifafanua kupita kiasi.
- issue: Aina ya kuacha familia au mali
  choice: aliyeacha
  alternative: aliyejitenga kabisa na
  rationale: Chanzo hakielezi muda, namna, au ukamilifu wa kuacha; tafsiri inaacha mvutano huo bila kuingiza sharti la kutelekeza kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha na koma ya mwisho vimehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
