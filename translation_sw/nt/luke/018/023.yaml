  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: sw
  text: Lakini aliposikia mambo hayo, alihuzunika sana[a], kwa maana alikuwa tajiri mno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipatwa na huzuni kubwa.” Neno la Kigiriki linaonyesha huzuni au dhiki kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha wakati na mfuatano wa tukio; “aliposikia” ni Kiswahili cha kawaida na cha asili.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi cha wingi kinarejelea mambo ambayo Yesu alikuwa ametangulia kusema; “mambo hayo” huhifadhi wingi na rejeo hilo.
- source_word: περίλυπος
  choice: alihuzunika sana
  rationale: Neno linaonyesha huzuni au dhiki kubwa; usemi huu ni wa kawaida na huhifadhi uzito wa hisia.
- source_word: ἐγενήθη
  choice: alihuzunika
  rationale: Muundo wa Kiswahili unaingiza kwa kawaida maana ya kuingia katika hali ya huzuni, ingawa Kigiriki hutumia kitenzi chenye maana ya “akawa.”
- source_word: πλούσιος
  choice: tajiri
  rationale: Hili ni neno la kawaida na sahihi kwa mtu mwenye mali nyingi.
- source_word: σφόδρα
  choice: mno
  rationale: Kielezi hiki husisitiza kiwango kikubwa sana cha utajiri; “mno” ni kifupi, chenye heshima, na chenye nguvu.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti kati ya mazungumzo yaliyotangulia na mwitikio wa mtu huyo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huanzisha maelezo ya sababu ya huzuni yake.
