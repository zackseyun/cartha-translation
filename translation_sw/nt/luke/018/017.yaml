  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: sw
  text: Amin, nawaambia, yeyote asiyeupokea ufalme wa Mungu kama mtoto[a], hakika hataingia ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yanaweza kusisitiza hali ya kupokea, kuamini, unyenyekevu, au utegemezi wa mtoto; Kigiriki hakitaji wazi sifa hasa inayokusudiwa.
    reason: Maelezo ya tashbihi; huondoa mbadala “akiwa mtoto” unaoweza kupotosha maana ya ulinganisho.
lexical_decisions:
- source_word: ἀμὴν
  choice: Amin
  rationale: Katika kauli ya utangulizi ya Yesu, “Amin” ni neno linalotambulika katika Kiswahili cha Biblia na huhifadhi uzito wa uthibitisho wa kauli hiyo.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni kauli ya moja kwa moja na ya kawaida kwa Kiswahili, inayojumuisha kiwakilishi cha nafsi ya kwanza na watendewa walio katika wingi.
- source_word: ὃς ἂν μὴ δέξηται
  choice: yeyote asiyeupokea
  rationale: “Yeyote” huonyesha sharti la jumla lisilomhusu mtu maalumu, na “kupokea” huhifadhi wazo la kuupokea au kuukubali ufalme bila kulifafanua kupita kiasi.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hii ndiyo tafsiri ya kawaida, wazi, na yenye upana wa maana wa βασιλεία, bila kuipunguza iwe eneo pekee au kuitafsiri moja kwa moja kuwa utawala.
- source_word: ὡς παιδίον
  choice: kama mtoto
  rationale: Kauli hii huhifadhi mfano wa Kigiriki bila kuamua ikiwa kinachosisitizwa ni unyenyekevu, tumaini, utegemezi, au moyo wa kupokea.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: hakika hataingia ndani yake
  rationale: “Hakika hataingia” huwasilisha ukanushaji wenye mkazo wa οὐ μή pamoja na kitenzi tegemezi; “ndani yake” humrejelea ufalme kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya kuupokea ufalme wa Mungu “kama mtoto”
  choice: Mfano umeachwa kama ulivyo bila kutaja sifa moja maalumu ya mtoto.
  alternative: kwa unyenyekevu wa mtoto; kwa tumaini la mtoto; kwa utegemezi wa mtoto; akiwa mtoto
  rationale: Kigiriki hakitaji wazi sifa inayokusudiwa. Kutafsiri mfano wenyewe huhifadhi uwezekano wa kusisitiza moyo wa kupokea, tumaini, unyenyekevu, utegemezi, au hali ya kuwa kama mtoto bila kuingiza hitimisho finyu la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Amin, nawaambia” huhifadhi uzito wa kauli ya Yesu bila kuwa ngumu; muundo uliobaki ni wa kisasa na wa moja kwa moja.
