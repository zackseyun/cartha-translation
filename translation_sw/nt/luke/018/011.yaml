    rationale: Kwa matumizi ya kawaida, “kujisia/kujisalia” hueleweka kuwa kujiombea au kujitolea sala, si kwamba sala ilielekezwa kwake mwenyewe. Hivyo haisemi kwa usahihi maana mbadala ya πρὸς ἑαυτόν.
