  naturalness: Kiswahili cha matini kuu ni cha asili na chenye hadhi ya simulizi la kibiblia. “Au hata” ni mtiririko wa kawaida zaidi katika ulinganisho huu wa kukataa. Tanbihi imerekebishwa kwa usemi usio na utata wa kisemantiki.
  terminology: “Farisayo,” “mtoza ushuru,” “wasio waadilifu,” na “wazinzi” zinafaa katika Kiswahili Sanifu. “Wanyang’anyi” ni tafsiri inayokubalika kwa ἅρπαγες katika orodha ya maovu, ingawa neno la Kigiriki linaweza pia kujumuisha wanyang’anyi/wapokonyaji kwa unyonyaji.
