  to: 'Yule Farisayo, akiwa amesimama peke yake,[a] alikuwa akisali mambo haya: ‘Ee Mungu, ninakushukuru kwa kuwa mimi si kama watu wengine—wanyang’anyi, wasio waadilifu, wazinzi—au hata kama huyu mtoza ushuru.’'
