id: LUK.18.11
reference: Luke 18:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: sw
  text: 'Yule Farisayo, akiwa amesimama peke yake,[a] alikuwa akisali mambo haya: ‘Ee Mungu, ninakushukuru kwa kuwa mimi si kama watu wengine—wanyang’anyi, wasio waadilifu, wazinzi—au hata kama huyu mtoza ushuru.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule Farisayo, akiwa amesimama, alikuwa akisali mambo haya kwa nafsi yake.” Kirai cha Kigiriki kinaweza kumaanisha kwamba alisimama kando na wengine au kwamba, kwa maana ya kejeli, sala yake ilielekezwa kwake mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: akiwa amesimama
  rationale: Huwasilisha hali ya mshiriki wa aoristi kwa Kiswahili cha kawaida na kudumisha taswira ya mkao wake.
- source_word: πρὸς ἑαυτὸν
  choice: peke yake
  rationale: Hutoa maana ya kimahali kwamba alisimama kando na wengine, huku maana mbadala ya ‘akijisalia mwenyewe’ ikihifadhiwa katika tanbihi.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Hurejelea moja kwa moja yaliyomo katika sala inayofuata, bila kulainisha kuwa ‘hivi.’
- source_word: προσηύχετο
  choice: alikuwa akisali
  rationale: Muundo wa ‘alikuwa aki-’ unahifadhi kwa asili hali endelevu ya kitenzi cha Kigiriki cha wakati usiotimilifu.
- source_word: εὐχαριστῶ σοι
  choice: ninakushukuru
  rationale: Ni usemi wa sasa, wa kawaida na wa heshima unaowasilisha kitenzi pamoja na kiwakilishi cha yule anayeshukuriwa.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: kama watu wengine wote
  rationale: Huwasilisha maana jumuishi ya ἄνθρωποι na nguvu ya λοιποί, yaani watu wengine waliobaki, kwa Kiswahili cha asili.
- source_word: ἅρπαγες
  choice: wanyang’anyi
  rationale: Neno hili hujumuisha watu wanaopora au kujipatia mali kwa pupa na unyonyaji; linafaa katika orodha hii ya maovu.
- source_word: ἄδικοι
  choice: wasio waadilifu
  rationale: Huhifadhi maana pana ya kimaadili ya ἄδικοι badala ya kuibana kuwa ukosefu wa haki katika shughuli fulani tu.
- source_word: μοιχοί
  choice: wazinzi
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya nomino ya wingi inayowataja wanaofanya uzinzi.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: wala hata kama huyu mtoza ushuru
  rationale: ‘Wala hata’ huonyesha kilele cha dharau katika ulinganisho, na ‘mtoza ushuru’ ni tafsiri ya kawaida ya τελώνης.
theological_decisions:
- issue: Maana ya πρὸς ἑαυτόν katika sala ya Farisayo
  choice: Imetafsiriwa kimahali kuwa ‘peke yake’ katika matini kuu.
  alternative: ‘Akiwa amesimama, alikuwa akijisalia mwenyewe mambo haya.’
  rationale: Kirai cha Kigiriki kinaweza kueleza kwamba alisimama kando au, kwa kejeli, kwamba sala yake ilielekezwa kwake mwenyewe. Matini kuu inadumisha mtiririko wa simulizi, na tanbihi inahifadhi maana mbadala bila kuondoa utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee Mungu’ ni mwito wa kawaida wa sala; alama za mistari mirefu zinatenganisha orodha ya maovu kwa uwazi. Tanbihi imewekwa mara tu baada ya kirai chenye utata.
