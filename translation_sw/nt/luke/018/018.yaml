  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: sw
  text: Kiongozi mmoja akamwuliza, “Mwalimu mwema, nifanye nini ili niurithi uzima wa milele?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Nikishafanya nini, nitaurithi uzima wa milele?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: akamwuliza
  rationale: Kitenzi hiki humaanisha kuuliza au kuhoji. “Akamwuliza” ni cha kawaida katika masimulizi ya Kiswahili na kinaonyesha wazi kuwa swali lilielekezwa kwake.
- source_word: τις ἄρχων
  choice: kiongozi mmoja
  rationale: Kiwakilishi kisichotaja mtu hususa pamoja na ἄρχων kinamtambulisha mtu asiyeainishwa mwenye mamlaka. “Kiongozi mmoja” ni cha asili na hakibainishi cheo ambacho maandishi ya Kigiriki hayajakitaja.
- source_word: λέγων
  choice: (imewakilishwa moja kwa moja na maneno yaliyonukuliwa)
  rationale: Katika Kiswahili, baada ya “akamwuliza,” kuongeza “akisema” kungekuwa nzito bila kuongezea maana; maneno ya moja kwa moja yanawakilisha participio hii kwa ufasaha.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Mwalimu mwema
  rationale: “Mwalimu” huakisi maana ya διδάσκαλος, na “mwema” huhifadhi sifa ἀγαθέ ambayo Yesu ataizungumzia katika mstari unaofuata.
- source_word: τί ποιήσας
  choice: nifanye nini
  rationale: Muundo wa participio pamoja na kitenzi cha wakati ujao unauliza tendo linalotazamwa kuwa sharti au njia. “Nifanye nini” ni Kiswahili cha kawaida na huhifadhi mtazamo wa swali la kiongozi bila kuukubali au kuurekebisha kitheolojia.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Hii ni tafsiri sahihi na iliyozoeleka ya kirai hiki; “uzima” pia hufaa katika muktadha wa maisha yanayotolewa na Mungu.
- source_word: κληρονομήσω
  choice: niurithi
  rationale: Kitenzi “kurithi” huhifadhi taswira ya urithi iliyo katika κληρονομέω badala ya kuifanya iwe tu “kupata” au “kupokea.”
theological_decisions:
- issue: Swali kuhusu uzima wa milele likihusishwa na tendo la mwanadamu
  choice: nifanye nini ili niurithi uzima wa milele
  alternative: Nikifanya nini, nitaurithi uzima wa milele?
  rationale: Tafsiri huhifadhi jinsi kiongozi mwenyewe anavyoliweka swali katika lugha ya tendo linalohitajika, bila kudokeza kwamba msimulizi anaidhinisha mtazamo huo wala kuingiza ufafanuzi wa kimafundisho kutoka nje ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kiongozi” huepuka kubainisha bila ushahidi ikiwa mtu huyo alikuwa mtawala, afisa, au kiongozi wa aina nyingine; “niurithi” huhifadhi lugha muhimu ya urithi.
