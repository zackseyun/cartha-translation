  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: sw
  text: “Unataka nikufanyie nini?” Naye akasema, “Bwana[a], nipate kuona tena[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa”; neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, ingawa “Bwana” ndiyo tafsiri ya kawaida ya mradi kwa κύριος.
    reason: alternative_reading
  - marker: b
    text: Au “nipate kuona”; katika muktadha huu neno la Kigiriki linaweza kumaanisha kupata kuona au kurudia kuona.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: Unataka nikufanyie nini?
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa. Kiambishi -ku- pamoja na -fanyie kinaonyesha kwa kawaida maana ya kumfanyia mtu jambo.
- source_word: ὁ δὲ εἶπεν
  choice: Naye akasema
  rationale: δέ hapa inaunganisha simulizi bila kuonyesha upinzani mkubwa; “Naye” huhifadhi mtiririko huo kwa lugha ya simulizi yenye hadhi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya heshima na pia uwezekano wa uzito wa kikristo katika kumwita Yesu, bila kuamua kwamba ni namna ya adabu tu.
- source_word: ἵνα ἀναβλέψω
  choice: nipate kuona tena
  rationale: Katika muktadha wa uponyaji, ἀναβλέπω humaanisha kurudia kuona au kupata kuona tena. Kauli ya ombi “nipate” inawakilisha vizuri ἵνα pamoja na hali tegemezi.
theological_decisions:
- issue: Maana ya κύριος anapoambiwa Yesu moja kwa moja
  choice: Bwana
  alternative: Bwana mkubwa; Mheshimiwa
  rationale: “Bwana” hudumisha kwa pamoja uwezekano wa kuwa heshima ya kawaida na wa kuwa utambuzi wenye uzito zaidi kuhusu Yesu; tafsiri haifungi mvutano huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Unataka nikufanyie nini?” ni mazungumzo ya kawaida yasiyo ya kienyeji, huku “Naye akasema” kikidumisha mtindo wa simulizi ya Biblia.
