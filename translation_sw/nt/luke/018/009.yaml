base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: sw
  text: Akawaambia pia baadhi ya watu waliojiamini kwamba wao ni wenye haki na waliowadharau wengine mfano huu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliowadharau wale wengine” / “waliowatazama wengine kuwa duni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ καὶ
  choice: Pia aliwaambia
  rationale: Muundo huu unaendeleza simulizi kwa kawaida na kuhifadhi maana ya nyongeza ya καί; kitenzi ‘aliwaambia’ kinafaa kwa kuwa walengwa na mfano vinatajwa.
- source_word: πρός τινας
  choice: baadhi ya watu
  rationale: πρός pamoja na watu baada ya kitenzi cha kusema huonyesha walengwa wa maneno; ‘baadhi ya watu’ ni Kiswahili cha kawaida na wazi.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: waliojiamini
  rationale: Kauli hii huhifadhi hali thabiti ya kuwa na imani katika nafsi zao. ‘Waliojiamini’ ni ya asili katika Kiswahili bila kuongeza sababu isiyotajwa.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: kwamba wao ni wenye haki
  rationale: ‘Wenye haki’ huhifadhi msamiati wa kimaadili na kidini wa δίκαιοι; ‘wao’ inasisitiza tathmini yao wenyewe bila kuongeza neno la dharau.
- source_word: ἐξουθενοῦντας
  choice: waliowadharau
  rationale: ‘Kudharau’ hutoa maana ya kuwaona wengine kuwa si kitu au kuwatazama kwa dharau, kwa ufupi na kwa nguvu ya kishiriki.
- source_word: τοὺς λοιπούς
  choice: wengine
  rationale: Katika Kiswahili, ‘wengine’ hutoa kwa kawaida maana ya ‘wale wengine/waliosalia’ katika muktadha huu.
- source_word: τὴν παραβολὴν ταύτην
  choice: mfano huu
  rationale: ‘Mfano’ ni istilahi iliyozoeleka na inayoeleweka kwa παραβολή katika simulizi za Injili.
theological_decisions:
- issue: Tafsiri ya δίκαιοι katika muktadha unaokosoa kujihesabia haki
  choice: wenye haki
  alternative: wanaodhani wako sawa
  rationale: Neno la Kigiriki lenyewe ni δίκαιοι, si usemi wa dharau. ‘Wenye haki’ huhifadhi istilahi ya kitheolojia na kuacha muktadha uonyeshe ukosoaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni ya kawaida kwa wasomaji wengi huku ikihifadhi msamiati muhimu wa kibiblia na alama ya tanbihi.
