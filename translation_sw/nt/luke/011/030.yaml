base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: sw
  text: Kwa maana kama vile Yona alivyokuja kuwa ishara kwa Waninawi, ndivyo pia Mwana wa Adamu atakavyokuwa ishara kwa kizazi hiki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, Kigiriki kinasema, “ndivyo pia Mwana wa Adamu atakavyokuwa kwa kizazi hiki”; maana ya “atakavyokuwa ishara kwa kizazi hiki” inaeleweka kutokana na ulinganisho na Yona.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Kwa maana, kama vile
  rationale: “Kwa maana” linaonyesha nguvu ya ufafanuzi ya γάρ, na “kama vile” linaanzisha ulinganisho wa καθώς kwa Kiswahili cha kawaida.
- source_word: ἐγένετο
  choice: alivyokuja kuwa
  rationale: 'Linaakisi wazo la kuingia katika hali au jukumu fulani: Yona alikuja kutumika kama ishara, badala ya kusema tu kwamba alikuwa ishara.'
- source_word: Ἰωνᾶς
  choice: Yona
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: τοῖς Νινευίταις
  choice: kwa Waninawi
  rationale: “Kwa” linaonyesha uhusiano wa ishara hiyo na watu wa Ninawi kwa njia ya kawaida katika Kiswahili.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” linafaa kwa σημεῖον kama jambo lenye umuhimu wa ufunuo, bila kulipunguza kuwa dalili au uthibitisho tu.
- source_word: οὕτως ... καὶ
  choice: ndivyo pia
  rationale: Linaendeleza ulinganisho wa moja kwa moja na kuhifadhi nguvu ya nyongeza ya καί.
- source_word: ἔσται
  choice: atakavyokuwa
  rationale: Ni tafsiri ya wakati ujao ya εἰμί; neno “ishara” limejazwa kutokana na ulinganifu wa sentensi ili maana iwe wazi katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Linahifadhi jina la cheo lililozoeleka na mwangwi wake wa kimaandiko bila kulifafanua kwa mtazamo mmoja tu.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: kwa kizazi hiki
  rationale: Linahifadhi γενεά kama “kizazi” na kueleza uhusiano wa Mwana wa Adamu na kizazi kinachotajwa.
theological_decisions:
- issue: Kiarifu kinachoeleweka lakini hakijarudiwa katika kishazi cha pili
  choice: Kujaza “ishara” katika “Mwana wa Adamu atakavyokuwa ishara kwa kizazi hiki”
  alternative: Kuandika kwa uhalisi zaidi, “Mwana wa Adamu atakavyokuwa kwa kizazi hiki”
  rationale: Ingawa σημεῖον halijarudiwa katika Kigiriki, ulinganifu na Yona unaonyesha wazi kuwa ndilo linaloeleweka. Kulijaza kunaleta Kiswahili kilicho wazi bila kuongeza dai jipya la kiteolojia; tanbihi inahifadhi muundo halisi.
- issue: Maana ya “Mwana wa Adamu”
  choice: Kuhifadhi cheo “Mwana wa Adamu”
  alternative: “Mwanadamu” au “Yule wa Kibinadamu”
  rationale: Cheo hiki kina maana pana ya kimaandiko na kiteolojia. Kukihifadhi huepuka kuamua kimyakimya tafsiri moja ya utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “alivyokuja kuwa” unahifadhi wazo la ἐγένετο kwa lugha ya kawaida, na “ndivyo pia” huweka ulinganisho wazi bila kuwa mzito.
