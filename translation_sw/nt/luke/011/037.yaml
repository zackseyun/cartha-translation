  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: sw
  text: Alipokuwa akizungumza, Farisayo mmoja akamwomba aje kula[a] pamoja naye. Yesu akaingia, akakaa kwa kuegemea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kumaanisha kula chakula cha asubuhi au chakula kingine cha mapema; hapa kinamaanisha kula kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Katika milo rasmi ya wakati huo, watu walikuwa na desturi ya kula wakiwa wameegemea kwenye vitanda vifupi karibu na meza.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Alipokuwa akizungumza
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha matendo yanayotokea wakati mmoja. Tafsiri hii ni ya kawaida katika Kiswahili na haiwezi kuamua bila msingi yale aliyokuwa akisema.
- source_word: ἐρωτᾷ
  choice: akamwomba
  rationale: Kitenzi hiki humaanisha kuuliza au kuomba; hapa ombi linaelekezwa kwenye mwaliko wa kula. Wakati uliopo wa kihistoria umetafsiriwa kwa usimulizi wa kawaida wa Kiswahili kwa kutumia mfululizo wa ‘aka-’.
- source_word: Φαρισαῖος
  choice: Farisayo mmoja
  rationale: Hili ni jina la kawaida la kundi hilo katika Kiswahili; ‘mmoja’ huonyesha kuwa nomino ya umoja haina kibainishi maalumu katika Kigiriki.
- source_word: ὅπως ἀριστήσῃ
  choice: aje kula
  rationale: ἀριστάω inaweza kumaanisha kula chakula cha mapema asubuhi au mchana, lakini muktadha hauhitaji kubainisha saa. ‘Aje kula’ huwasilisha mwaliko kwa lugha ya kawaida bila kuongeza uhakika usiokuwapo.
- source_word: παρ’ αὐτῷ
  choice: pamoja naye
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya kuwa au kula pamoja naye bila kuongeza wazi ‘nyumbani kwake,’ ingawa mahali pake panaweza kudokezwa na muktadha.
- source_word: εἰσελθὼν
  choice: Yesu akaingia
  rationale: Kitenzi-shirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu. Jina ‘Yesu’ limetumiwa kufafanua kiima ambacho Kigiriki hukiacha kidokezwe.
- source_word: ἀνέπεσεν
  choice: akakaa kwa kuegemea ili ale
  rationale: Kitenzi kinaeleza mkao wa kuegemea wakati wa mlo, desturi tofauti na kuketi kwenye kiti. Tafsiri hii huhifadhi mkao huo bila kudokeza kimakosa kuwa aliegemea juu ya meza.
