  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: sw
  text: Kisha huenda na kuchukua pamoja naye roho nyingine saba zilizo mbaya zaidi kuliko yenyewe[a]; na baada ya kuingia, hukaa humo[b]. Hali ya mwisho ya mtu huyo huwa mbaya kuliko hali yake ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zilizo ovu kuliko yenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, kishirikishi kinachomaanisha “baada ya kuingia” ni cha wingi, lakini kitenzi “hukaa” ni cha umoja. Kiswahili hapa hakitaji kiima wazi.
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Huonyesha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida na cha asili.
- source_word: πορεύεται
  choice: huenda
  rationale: Hutoa maana ya moja kwa moja ya kwenda na kuendeleza mtiririko wa simulizi.
- source_word: παραλαμβάνει
  choice: chukua pamoja naye
  rationale: Huhifadhi wazo la kuwachukua wengine waandamane naye, si kuwakamata tu.
- source_word: ἕτερα πνεύματα ... ἑπτά
  choice: roho nyingine saba
  rationale: Hufuata maana na mpangilio wa asili wa Kiswahili bila kuongeza neno ‘pepo’ au ‘roho wachafu,’ ambayo hayapo katika mstari huu.
- source_word: πονηρότερα ἑαυτοῦ
  choice: zilizo waovu kuliko yeye mwenyewe
  rationale: Huhifadhi ulinganisho kati ya zile roho saba na roho inayorudi. ‘Waovu’ huonyesha wazi tabia yao yenye uhasama katika muktadha.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: baada ya kuingia, hukaa humo
  rationale: ‘Baada ya kuingia’ huonyesha tendo la kishirikishi linalotangulia kukaa. Umbo ‘hukaa’ halilazimishi idadi ya kiima na hivyo linaweza kuhifadhi mvutano wa kisarufi wa Kigiriki kati ya kishirikishi cha wingi na kitenzi cha umoja.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: hali ya mwisho ... mbaya kuliko hali yake ya kwanza
  rationale: Hutoa kwa uwazi nahau inayolinganisha hali ya baadaye ya mtu huyo na hali yake ya awali.
theological_decisions:
- issue: Iwapo roho hao waitwe pepo au roho wachafu
  choice: roho
  alternative: pepo; roho wachafu
  rationale: Mstari huu wenyewe unasema πνεύματα, ‘roho.’ Ingawa muktadha unaonyesha kuwa ni roho zenye uovu, tafsiri haiongezi jina lisilotajwa hapa.
- issue: Rejeo la ἀνθρώπου
  choice: mtu huyo
  alternative: mwanadamu huyo
  rationale: ‘Mtu huyo’ hurejelea kwa kawaida mtu mahususi katika mfano bila kufanya neno la Kigiriki kuwa dhana ya jumla.
- issue: Kutopatana kwa idadi katika εἰσελθόντα κατοικεῖ
  choice: baada ya kuingia, hukaa humo
  alternative: baada ya kuingia, wanakaa humo; baada ya kuingia, hukaa humo roho hiyo
  rationale: Kishirikishi cha Kigiriki ni cha wingi, lakini kitenzi kikuu ni cha umoja. Kiswahili hiki kinaacha kiima cha ‘hukaa’ bila kutajwa wazi, hivyo hakisuluhishi kimya kimya mvutano uliopo katika ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida huku ikihifadhi neno ‘roho’ na mvutano wa kisarufi wa maandishi ya Kigiriki.
