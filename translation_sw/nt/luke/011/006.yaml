lexical_decisions:
- source_word: ἐπειδὴ
  choice: kwa sababu
  rationale: Inaonyesha sababu ya ombi katika mfano kwa Kiswahili cha kawaida.
- source_word: φίλος μου
  choice: rafiki yangu
  rationale: Huu ndio usemi wa kawaida wa Kiswahili; muktadha hauhitaji kuongeza neno lisilo dhahiri kama ‘mmoja’ ili kuonyesha kutokuwa maalumu.
- source_word: παρεγένετο
  choice: amefika
  rationale: Kitenzi kinaonyesha kuwasili, na wakati timilifu unaonyesha kwamba rafiki huyo amewasili na bado yupo.
- source_word: ἐξ ὁδοῦ
  choice: kutoka safarini
  rationale: Hutoa maana ya nahau ya mtu aliyekuwa akisafiri, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na maneno ya chanzo.
- source_word: πρός με
  choice: kwangu
  rationale: Inaonyesha kuja aliko msemaji bila kuongeza waziwazi ‘nyumbani’ au ‘kunitembelea,’ mambo ambayo yanaeleweka tu kutokana na muktadha.
- source_word: οὐκ ἔχω
  choice: sina kitu
  rationale: Ni tafsiri fupi, ya asili, na iliyo sawa ya kauli ya kutokuwa na chochote.
- source_word: ὃ παραθήσω αὐτῷ
  choice: cha kumwandalia
  rationale: Katika muktadha wa ukarimu, kitenzi kinahusu kumwekea mgeni chakula; ‘kumwandalia’ ni Kiswahili cha kawaida kinachodokeza maandalizi ya chakula bila kuliongeza moja kwa moja katika matini.
