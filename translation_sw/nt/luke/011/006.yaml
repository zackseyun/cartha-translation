  text: kwa sababu rafiki yangu amefika kwangu kutoka safarini[a], nami sina kitu cha kuweka mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “kutoka njiani.”
