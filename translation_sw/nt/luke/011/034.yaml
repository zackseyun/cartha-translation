  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: sw
  text: Jicho lako ndilo taa ya mwili wako. Jicho lako likiwa zima[a], mwili wako wote pia huwa na nuru; lakini likiwa baya[b], mwili wako pia huwa na giza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “safi,” “lenye afya,” au, katika tafsiri ya jadi, “moja.” Neno la Kiyunani linaweza kudokeza jicho lililo timamu, lisilogawanyika, au lenye unyofu; hapa linaelezwa kwa kulinganisha na jicho “baya.”
    reason: lexical_alternative
  - marker: b
    text: Au “ovu.” Neno la Kiyunani linaweza kumaanisha “baya” au “ovu”; hapa huenda likadokeza jicho lenye kasoro na pia mtazamo uliopotoka kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: taa
  rationale: Neno hili linamaanisha chombo halisi cha kutoa mwanga, si nuru kama dhana tu; “taa” inadumisha mfano halisi.
- source_word: σῶμα
  choice: mwili
  rationale: Hii ndiyo maana ya kawaida ya neno hapa, nayo inatumika katika mfano unaohusisha kuona na hali ya ndani.
- source_word: ὀφθαλμός
  choice: jicho
  rationale: Kiungo halisi cha mwili kinatajwa na kutumiwa kama mfano wa utambuzi wa ndani.
- source_word: ὅταν ... ᾖ / ἐπὰν δὲ ... ᾖ
  choice: likiwa ... lakini likiwa
  rationale: Miundo hii inaeleza hali ya kawaida yenye maana ya wakati na sharti; urudiaji wa “likiwa” unahifadhi ulinganifu wa vifungu viwili.
- source_word: ἁπλοῦς
  choice: sawa
  rationale: Katika muktadha wa jicho linalofanya kazi ipasavyo, “sawa” ni Kiswahili cha kawaida kinachoeleweka kama lenye hali nzuri bila kuondoa kabisa wazo la kutogawanyika au unyofu.
- source_word: ὅλον ... φωτεινόν
  choice: mwili wako wote pia huwa umejaa nuru
  rationale: “Umejaa nuru” huwasilisha maana ya φωτεινός, yaani wenye nuru au ulioangazwa, na kudumisha taswira ya mstari.
- source_word: πονηρός
  choice: baya
  rationale: '“Baya” linadumisha uwezekano wa maana mbili: jicho lenye kasoro na mtazamo ulio potovu kimaadili.'
- source_word: σκοτεινόν
  choice: huwa gizani
  rationale: Kauli hii ni ya asili katika Kiswahili na inadumisha utofauti kati ya kujaa nuru na kuwa gizani.
theological_decisions:
- issue: Maana ya ἁπλοῦς katika usemi kuhusu jicho
  choice: sawa
  alternative: safi, zima, lenye afya, moja
  rationale: Mfano wa karibu unahusu jicho kama taa ya mwili na matokeo yake kwa mwili wote. “Sawa” huonyesha jicho linalofanya kazi ipasavyo, huku tanbihi ikidumisha maana zinazowezekana za unyofu, kutogawanyika, au uzima.
- issue: Maana ya πονηρός inapolieleza jicho
  choice: baya
  alternative: ovu, lenye kasoro, lisilo na afya
  rationale: Neno la Kiyunani linaweza kumaanisha “baya” au “ovu.” Tafsiri “baya” haibani maana kuwa kasoro ya mwili pekee wala uovu wa kimaadili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa leo, huku ulinganifu wa nuru na giza pamoja na utata wa kimaana wa ἁπλοῦς na πονηρός ukihifadhiwa.
