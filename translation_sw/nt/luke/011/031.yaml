id: LUK.11.31
reference: Luke 11:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: sw
  text: Malkia wa Kusini atasimama katika hukumu pamoja na wanaume wa kizazi hiki, naye atawahukumu kuwa na hatia[a], kwa sababu alikuja kutoka miisho ya dunia ili kusikiliza hekima ya Sulemani; na tazama[b], kitu kikubwa kuliko Sulemani kipo hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, yule ambaye kwa kawaida hutambulishwa kuwa Malkia wa Sheba (tazama 1 Wafalme 10:1–13; 2 Mambo ya Nyakati 9:1–12).
    reason: cross_reference
  - marker: b
    text: Au, “aliye mkuu kuliko Sulemani.” Kigiriki kina usemi wa jinsia ya kati, kihalisi “kitu kikubwa kuliko Sulemani,” ambao huenda unasisitiza zaidi ya ulinganisho wa moja kwa moja na mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Malkia wa Kusini
  rationale: Inahifadhi muundo wa Kigiriki na dokezo la simulizi la Agano la Kale bila kumtaja moja kwa moja kuwa Malkia wa Sheba.
- source_word: ἐγερθήσεται
  choice: atasimama
  rationale: Katika mandhari ya mahakama, kitenzi kinaweza kumaanisha kusimama au kujitokeza wakati wa hukumu, huku mwangwi unaowezekana wa ufufuo ukibaki bila kufafanuliwa kupita kiasi.
- source_word: ἐν τῇ κρίσει
  choice: wakati wa hukumu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha hukumu maalumu ya wakati ujao.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: pamoja na wanaume
  rationale: Neno ἀνδρῶν ni la kiume mahsusi; 'wanaume' huhifadhi usahihi huo.
- source_word: τῆς γενεᾶς ταύτης
  choice: wa kizazi hiki
  rationale: Hurejelea kwa kawaida kizazi cha watu wa wakati wa Yesu katika muktadha wa Injili.
- source_word: κατακρινεῖ αὐτούς
  choice: atawahukumu kuwa na hatia
  rationale: Huwasilisha nguvu ya κατακρίνω, yaani si kuhukumu tu bali kutoa hukumu ya hatia.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: kutoka miisho ya dunia
  rationale: Huhifadhi tamathali ya Kigiriki inayosisitiza umbali mkubwa.
- source_word: ἀκοῦσαι
  choice: ili kusikiliza
  rationale: Kiswahili hiki huonyesha kusudi la safari na tendo la kumsikiliza Sulemani kwa makini.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: hekima ya Sulemani
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya muundo wa Kigiriki.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi mwito wa makini na uzito wa kauli ya kilele.
- source_word: πλεῖον Σολομῶνος
  choice: kitu kikubwa kuliko Sulemani
  rationale: Kivumishi cha Kigiriki ni cha jinsia ya kati; 'kitu kikubwa' huhifadhi hali hiyo na kutokufunga maana kwenye ulinganisho wa mtu pekee.
- source_word: ὧδε
  choice: kipo hapa
  rationale: Hutoa maana ya uwepo mahali hapa na kupatana kisarufi na 'kitu'.
theological_decisions:
- issue: Iwapo utambulisho wa malkia ufanywe wazi kuwa Malkia wa Sheba
  choice: Malkia wa Kusini katika matini kuu
  alternative: Malkia wa Sheba
  rationale: Dokezo la Agano la Kale ni wazi, lakini Kigiriki kinasema 'Malkia wa Kusini'; utambulisho unaelezwa katika tanbihi badala ya kuingizwa katika matini.
- issue: Iwapo πλεῖον Σολομῶνος ibinafsishwe
  choice: kitu kikubwa kuliko Sulemani
  alternative: aliye mkuu kuliko Sulemani
  rationale: Umbo la Kigiriki ni la jinsia ya kati, si la kiume. Tafsiri hii huhifadhi uwezekano kwamba kauli inahusu zaidi ya ulinganisho wa moja kwa moja wa watu.
- issue: Iwapo ἐγερθήσεται itaje ufufuo waziwazi
  choice: atasimama
  alternative: atafufuliwa
  rationale: Muktadha unaweza kuwa na mwangwi wa ufufuo wa siku ya mwisho, lakini pia ni lugha ya kusimama kama shahidi katika hukumu; tafsiri haifungi maana upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Atawahukumu kuwa na hatia' limetumiwa badala ya 'atawalaani' ili kuonyesha hukumu ya kimahakama bila kuleta maana ya laana. Alama zote za tanbihi zimewekwa katika matini kuu.
