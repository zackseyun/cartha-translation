id: LUK.11.52
reference: Luke 11:52
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: sw
  text: Ole wenu ninyi wataalamu wa Sheria[a], kwa kuwa mliondoa ufunguo wa maarifa[b]. Ninyi wenyewe hamkuingia, na wale waliokuwa wakiingia mkawazuia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wataalamu wa Sheria ya Musa, si mawakili katika maana ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ufunguo wa kuyafikia maarifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ole wenu
  rationale: Kauli hii ya kawaida ya kinabii katika Kiswahili huhifadhi uzito wa hukumu na onyo, wala si maombolezo mepesi tu.
- source_word: νομικοῖς
  choice: wataalamu wa Sheria
  rationale: Inawaonyesha wataalamu wa Sheria ya Kiyahudi, si mawakili wa kesi za kiraia katika maana ya kisasa.
- source_word: ἤρατε
  choice: mliondoa
  rationale: Kitenzi hapa kina maana ya kuondoa kitu na hivyo kuwanyima wengine njia ya kukifikia, si kukibeba tu.
- source_word: κλεῖδα τῆς γνώσεως
  choice: ufunguo wa maarifa
  rationale: Huhifadhi sitiari na muundo wa uhusiano wa maneno ya Kigiriki bila kufafanua kupita kiasi ikiwa maarifa ndiyo yanayomilikiwa au kufikiwa kwa ufunguo huo.
- source_word: αὐτοὶ
  choice: ninyi wenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi na tofauti kati ya wataalamu hao na watu waliowazuia.
- source_word: οὐκ εἰσήλθατε
  choice: hamkuingia
  rationale: Huhifadhi sitiari ya kuingia bila kuongeza mahali au kitu ambacho hakikutajwa wazi katika Kigiriki.
- source_word: τοὺς εἰσερχομένους
  choice: wale waliokuwa wakiingia
  rationale: Huonyesha tendo lililokuwa likiendelea bila kuongeza wazo lisilotajwa la kujaribu kuingia.
- source_word: ἐκωλύσατε
  choice: mkawazuia
  rationale: Huonyesha kwamba waliweka kizuizi kwa waliokuwa wakiingia; mfuatano wa '-ka-' unasomeka kwa kawaida baada ya shtaka lililotangulia.
theological_decisions:
- issue: Kitu kinachorejelewa na sitiari za “ufunguo” na “kuingia”
  choice: Sitiari ya njia ya kufikia na kuingia imeachwa bila kutaja kinachoingiliwa.
  alternative: Kufafanua kuwa ni kuingia katika ufalme wa Mungu au kuingia katika maarifa ya kweli juu ya Mungu.
  rationale: Kigiriki hakitaji wazi kitu au mahali wanapoingia. Kutokiongeza kunahifadhi utata halisi na kuepuka kuingiza ufafanuzi wa kiteolojia ambao mstari wenyewe haujasema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sheria” imeandikwa kwa herufi kubwa kuonyesha Sheria ya Musa katika muktadha huu. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
