  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: sw
  text: Lakini baadhi yao wakasema, “Anatoa pepo kwa nguvu za Beelzebuli[a], mtawala wa pepo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beelzebubu ni umbo la kimapokeo la jina ambalo hapa limetolewa kama Beelzebuli, kufuatana na matini ya Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Lakini baadhi yao
  rationale: “Baadhi yao” ni Kiswahili cha kawaida kinachohifadhi maana ya kundi lisilotajwa kwa majina kutoka miongoni mwa waliokuwapo; “Lakini” linaonyesha utofauti na mwitikio chanya katika muktadha uliotangulia.
- source_word: εἶπον
  choice: wakasema
  rationale: Wakati wa usimulizi wa Kiswahili unaonyesha tukio rahisi la kusema, kulingana na aoristi ya Kigiriki.
- source_word: Ἐν Βεελζεβοὺλ
  choice: kwa nguvu za Beelzebuli
  rationale: Katika muktadha huu ἐν huonyesha njia au uwezo unaodaiwa kutumiwa. “Kwa nguvu za” ni ya asili na inaweka wazi shtaka bila kudokeza kwamba Yesu alikuwa ndani ya Beelzebuli.
- source_word: Βεελζεβοὺλ
  choice: Beelzebuli
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likifuata umbo la Kigiriki Βεελζεβούλ.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: mtawala wa pepo
  rationale: “Mtawala” huwasilisha wazi mamlaka ya ἄρχων bila kuingiza mpangilio wa kina wa kidemonia usiotajwa; “pepo” ni neno la kawaida la Biblia ya Kiswahili kwa δαιμόνια katika muktadha huu.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: Anatoa pepo
  rationale: “Kutoa pepo” ni usemi wa kawaida na unaoeleweka wa Kiswahili kwa tendo la kuwafukuza pepo, na unawakilisha maana ya ἐκβάλλω katika muktadha wa kutoa pepo.
theological_decisions:
- issue: Umbo la jina Βεελζεβούλ
  choice: Beelzebuli
  alternative: Beelzebubu
  rationale: Matini kuu inafuata umbo la Kigiriki Beelzebul badala ya umbo la kimapokeo Beelzebub. Umbo la pili limehifadhiwa katika tanbihi ili kutambua mapokeo yanayojulikana bila kuyapa nafasi ya kwanza kuliko ushahidi wa lugha asili.
- issue: Maana ya ἄρχων katika mamlaka ya pepo
  choice: mtawala wa pepo
  alternative: mkuu wa pepo
  rationale: “Mtawala” huonyesha mamlaka bila kuingiza ufafanuzi wa ziada kuhusu ngazi au muundo wa ulimwengu wa pepo.
- issue: Uhusiano unaoonyeshwa na ἐν
  choice: kwa nguvu za Beelzebuli
  alternative: kwa Beelzebuli
  rationale: Tafsiri hii huwasilisha shtaka kwamba Yesu anatoa pepo kwa uwezo wa Beelzebuli, bila kuidhinisha shtaka hilo kuwa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; usemi “kutoa pepo” ni wa kawaida na unaeleweka kwa wasomaji wengi.
