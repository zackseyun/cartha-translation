  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: sw
  text: Lakini vitoeni vilivyo ndani kama sadaka[a]; na tazama, kila kitu ni safi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “toeni mlivyo navyo kama sadaka.” Maneno ya Kigiriki yanaweza kumaanisha ama vilivyo ndani ama mali aliyo nayo mtu.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Inaonyesha tofauti ya kusahihisha baada ya mazungumzo kuhusu kusafisha upande wa nje.
- source_word: τὰ ἐνόντα
  choice: vilivyo ndani
  rationale: Huhifadhi maana ya msingi ya maneno ya Kigiriki na uhusiano wake na tofauti kati ya nje na ndani katika mstari wa 39, bila kuondoa uwezekano wa maana ya mali aliyo nayo mtu.
- source_word: δότε
  choice: vitoeni
  rationale: Ni amri ya moja kwa moja na ya kawaida katika Kiswahili; kiambishi cha yambwa kinarejelea vilivyo ndani.
- source_word: ἐλεημοσύνην
  choice: kuwa sadaka kwa wahitaji
  rationale: Hueleza utoaji wa msaada wa huruma kwa lugha ya sasa. 'Kwa wahitaji' hufanya maana ya utoaji huo ieleweke bila kuufanya kuwa sadaka ya ibada.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi msisitizo wa kifasihi na mwito wa kuzingatia matokeo yanayofuata.
- source_word: πάντα
  choice: kila kitu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha wingi jumuishi wa Kigiriki.
- source_word: καθαρὰ
  choice: ni safi
  rationale: Hudumisha uhusiano na suala la usafi katika muktadha, likiwemo wazo la usafi wa kidini.
- source_word: ὑμῖν
  choice: kwenu
  rationale: 'Huwasilisha kiima-dokezi cha rejeleo: kila kitu ni safi kwa habari yenu.'
theological_decisions:
- issue: Maana ya τὰ ἐνόντα kuhusiana na usafi na kutoa sadaka
  choice: vilivyo ndani, kwa maana inayosisitiza hali ya ndani ya mtu
  alternative: mlichonacho, kwa maana ya mali iliyo mikononi mwa mtu
  rationale: Muktadha wa karibu unatofautisha nje na ndani ya kikombe na sahani (Luka 11:39), hivyo tafsiri kuu huhifadhi nguvu ya karipio kuhusu hali ya ndani. Hata hivyo, Kigiriki kinaweza kueleweka pia kuwa mali aliyo nayo mtu; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi tofauti ya 'ndani' na 'nje' huku tanbihi ikitunza utata halisi wa kifungu cha Kigiriki.
