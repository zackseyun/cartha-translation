  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: sw
  text: Naye alipotoka huko, waandishi na Mafarisayo wakaanza kumkabili kwa ukali na kumchokoza aseme kuhusu mambo mengi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumhoji kwa makini” au “kumfanya aseme bila kujiandaa.” Kitenzi cha Kigiriki ni adimu na kinaashiria kumvuta kwa uchokozi atoe majibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Naye alipotoka huko
  rationale: Muundo wa genitivi huru wenye kitenzi-jina cha wakati uliopita unaonyesha kwamba kutoka kwake kulitangulia tendo kuu; tafsiri hii pia huhifadhi mwendelezo wa mahali unaoonyeshwa na κἀκεῖθεν.
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Hutoa maana ya kuanza kwa matendo yanayofuata na kuunganisha simulizi kwa Kiswahili cha kawaida.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi iliyozoeleka katika tafsiri za Biblia kwa wataalamu wa Maandiko na sheria, huku ikihifadhi jina la kundi la chanzo.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Ni namna sanifu ya Kiswahili ya jina la kundi hili.
- source_word: δεινῶς ἐνέχειν
  choice: kumkabili kwa ukali
  rationale: Mchanganyiko huu unaonyesha msimamo wa uhasama na shinikizo kali dhidi yake; ‘kumkabili kwa ukali’ ni wa asili na hauongezi njia mahsusi isiyotajwa.
- source_word: ἀποστοματίζειν
  choice: kumchokoza aseme
  rationale: Kitenzi hiki adimu kinaashiria kumvuta mtu aseme au kumhoji kwa uchokozi, labda ili kupata maneno ya kutumia dhidi yake. Chaguo hili huhifadhi uhasama bila kuamua kabisa mbinu iliyotumiwa.
- source_word: περὶ πλειόνων
  choice: kuhusu mambo mengi
  rationale: Katika muktadha huu kirai kinaonyesha mada nyingi, si lazima ulinganisho wa ‘mambo zaidi.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waandishi’ na ‘Mafarisayo’ hudumisha istilahi zinazotambulika katika simulizi za Injili. Tanbihi huhifadhi kutokuwa na uhakika kwa maana ya kitenzi adimu ἀποστοματίζειν.
