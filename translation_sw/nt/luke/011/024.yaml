id: LUK.11.24
reference: Luke 11:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: sw
  text: “Roho mchafu anapomtoka mtu, hupitia maeneo yasiyo na maji[a] akitafuta pumziko. Asipolipata, husema, ‘Nitarudi katika nyumba yangu nilikotoka.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maeneo makavu.” Kigiriki kihalisi husema maeneo yasiyo na maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: anapo-
  rationale: Muundo huu wa wakati huwasilisha hali ya jumla na ya kawaida, sawasawa na ὅταν pamoja na kitenzi cha hali tegemezi.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: roho mchafu
  rationale: Hili ni neno la kawaida na linaloeleweka katika Kiswahili kwa roho mwovu anayehusishwa na uchafu; linahifadhi pia taswira ya kibinafsi ya mhusika anayekwenda, kutafuta, na kusema.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: anapomtoka mtu
  rationale: ‘Kumtoka mtu’ ni Kiswahili cha asili kinachoonyesha kutoka ndani au kwa mtu bila kuongeza maelezo yasiyomo katika matini. ‘Mtu’ hapa huwakilisha kisa cha jumla.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: hupitia maeneo yasiyo na maji
  rationale: ‘Maeneo yasiyo na maji’ huhifadhi maana halisi ya ἀνύδρων na wingi wa τόπων; ‘hupitia’ huonyesha mwendo katika maeneo hayo.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: akitafuta pumziko
  rationale: Huhifadhi muundo shirikishi na maana ya kutafuta hali au mahali pa kupumzika.
- source_word: καὶ μὴ εὑρίσκον
  choice: Asipolipata
  rationale: Kiwakilishi ‘-li-’ humrejelea ‘pumziko’ kwa uwazi, na muundo wa masharti unaonyesha kutolipata kabla ya uamuzi unaofuata.
- source_word: λέγει
  choice: husema
  rationale: Wakati wa sasa wa mazoea unafaa kwa kauli hii ya jumla na huhifadhi uhai wa wakati wa sasa wa Kigiriki.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Nitarudi katika nyumba yangu
  rationale: ‘Nitarudi’ huonyesha azimio la wakati ujao, na ‘nyumba’ huhifadhi taswira halisi ya οἶκος badala ya kuilegeza kuwa ‘nyumbani.’
- source_word: ὅθεν ἐξῆλθον
  choice: nilikotoka
  rationale: Muundo wa mahali ni wa asili katika Kiswahili na unarejelea nyumba ambayo roho ilitoka, huku ukirudia wazo la kutoka lililo mwanzoni mwa aya.
theological_decisions:
- issue: Rejeo la ‘roho mchafu’
  choice: Imetafsiriwa kama mhusika wa kiroho mwenye utendaji binafsi.
  alternative: Kuifanya kuwa sitiari tu ya kurudia maovu au nguvu isiyo na utu.
  rationale: Matini yenyewe huiwasilisha roho ikitoka, ikipitia maeneo, ikitafuta, na kusema; tafsiri haipaswi kuondoa sifa hizo wala kulazimisha kuwa ni sitiari tu.
- issue: Ujinsia wa ἀνθρώπου
  choice: mtu
  alternative: mwanamume
  rationale: Katika Kigiriki, ἄνθρωπος hapa ni nomino ya kiume kisarufi lakini inaweza kumaanisha binadamu katika kisa cha jumla. ‘Mtu’ huhifadhi maana hiyo bila kudai kuwa jinsia ya mhusika ndiyo hoja ya kifungu.
- issue: Taswira ya nyumba
  choice: nyumba yangu
  alternative: makao yangu au moyo wangu
  rationale: Tafsiri inadumisha sitiari iliyo wazi ya nyumba bila kuitambulisha moja kwa moja na moyo, maisha, au hali ya kiroho ya mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matumizi ya ‘hupitia’ na ‘husema’ yanaonyesha kauli ya jumla; sentensi zimegawanywa kwa urahisi wa kusoma bila kubadili uhusiano wa mawazo.
