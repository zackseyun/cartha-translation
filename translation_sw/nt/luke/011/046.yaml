  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: sw
  text: Naye akasema, “Ole pia kwenu, ninyi wataalamu wa Sheria[a], kwa sababu mnawatwika watu mizigo migumu kubeba, na ninyi wenyewe hamgusi mizigo hiyo hata kwa kidole kimoja[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wataalamu wa Sheria ya Kiyahudi; si mawakili wa mahakama kwa maana ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “hamgusi mizigo hiyo kwa kidole chenu hata kimoja.” Usemi huu unasisitiza kwamba hawafanyi hata juhudi ndogo ya kusaidia katika mambo wanayowawekea wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: wataalamu wa Sheria
  rationale: Katika muktadha wa Luka, neno hili linamaanisha wataalamu wa Sheria ya Kiyahudi, si mawakili wa mahakama za kisasa. ‘Wataalamu wa Sheria’ ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: οὐαί
  choice: Ole wenu
  rationale: Kauli hii inadumisha uzito wa tangazo la kinabii la hukumu, badala ya kuifanya kuwa kilio chepesi cha huzuni.
- source_word: φορτίζετε
  choice: mnawatwika
  rationale: Kitenzi kinaonyesha tendo la kuwawekea watu mzigo; ‘mnawatwika’ inadumisha picha halisi na inaendana kwa kawaida na ‘mizigo.’
- source_word: ἀνθρώπους
  choice: watu
  rationale: Neno hili linawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: φορτία δυσβάστακτα
  choice: mizigo iliyo migumu kubeba
  rationale: Tafsiri hii inadumisha sitiari ya kubeba na haizidishi maana kana kwamba mizigo hiyo haiwezekani kabisa kubebwa.
- source_word: αὐτοὶ
  choice: ninyi wenyewe
  rationale: Inaleta mkazo wa kiwakilishi na kuonyesha tofauti kati ya wataalamu hao na watu wanaowatwika mizigo.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: hata kwa kidole kimoja
  rationale: Usemi huu unadumisha picha ya juhudi ndogo kabisa; ‘hata’ huonyesha vizuri nguvu ya usemi huo katika Kiswahili.
- source_word: προσψαύετε
  choice: hamgusi
  rationale: Hii inadumisha maana ya msingi ya kugusa, bila kufafanua moja kwa moja zaidi ya chanzo kwamba hawasaidii.
- source_word: Καὶ ὑμῖν
  choice: wenu pia
  rationale: '‘Pia’ inadumisha nguvu ya nyongeza: ole inatangazwa kwa kundi hili vilevile.'
theological_decisions:
- issue: Utambulisho wa νομικοῖς
  choice: Imetafsiriwa ‘wataalamu wa Sheria,’ yaani wataalamu wa Sheria ya Kiyahudi.
  alternative: wanasheria; waandishi
  rationale: ‘Wanasheria’ linaweza kueleweka kama mawakili wa kisasa, na ‘waandishi’ lingekuwa maalumu mno na halilingani daima na νομικοί.
- issue: Nguvu ya kishazi cha mwisho
  choice: Sitiari halisi ya kutogusa mizigo hata kwa kidole kimoja imedumishwa.
  alternative: hamsaidii hata kidogo; hamnyoshi hata kidole kuwasaidia
  rationale: Chanzo kinadumisha picha ya kugusa mzigo. Maana inayodokezwa ya kutofanya juhudi ya kusaidia inaeleweka, lakini haijaingizwa katika matini kuu kana kwamba imesemwa wazi.
- issue: Uhusiano wa vifungu viwili
  choice: ‘lakini’ limetumiwa kuonyesha tofauti kati ya kuwatwika wengine na wao wenyewe kutogusa mizigo.
  alternative: na
  rationale: Ingawa Kigiriki kina καί, muktadha una tofauti dhahiri; ‘lakini’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kubadili hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sheria’ limeandikwa kwa herufi kubwa ili kuonyesha Sheria ya Kiyahudi katika muktadha huu. Muundo ‘mnawatwika watu mizigo’ ni wa kawaida na unadumisha picha halisi ya chanzo.
