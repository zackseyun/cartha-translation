  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: sw
  text: Ole wenu, kwa sababu ninyi ni kama makaburi yasiyo na alama, na watu wanaotembea juu yake hawayatambui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ole wenu!
  rationale: Nahau ya kawaida na yenye hadhi inayowasilisha tangazo kali la hukumu au maafa, si hisia ya huruma pekee.
- source_word: μνημεῖα τὰ ἄδηλα
  choice: makaburi yasiyo na alama
  rationale: ἄδηλα humaanisha yasiyoonekana au yasiyotambulika; katika muktadha huu ni makaburi ambayo hayana dalili ya kuyatambulisha.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Neno la Kigiriki ni la kijumla kwa wanadamu; Kiswahili 'watu' hudumisha maana hiyo bila kuibana kwa wanaume pekee.
- source_word: περιπατοῦντες ἐπάνω
  choice: huyakanyaga
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kutembea juu ya makaburi; kiwakilishi cha kitu huonyesha kwamba yanakanyagwa.
- source_word: οὐκ οἴδασιν
  choice: bila kujua
  rationale: Hutoa kwa ufupi hali ya watu kutofahamu kwamba wanatembea juu ya makaburi hayo.
theological_decisions:
- issue: Athari ya kunajisika kwa kutembea juu ya kaburi bila kujua
  choice: Imeachwa idokezwe na mfano wenyewe
  alternative: Kuongeza wazi kwamba watu wanakuwa najisi
  rationale: Andiko halitaji moja kwa moja unajisi katika mstari huu; kuongeza maelezo hayo kungetatua dokezo la kimuktadha badala ya kuhifadhi usemi wa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida kwa msomaji, huku picha ya makaburi yasiyotambulika ikihifadhiwa.
