  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: sw
  text: Lakini yeye akasema, “Bali, heri wale wanaosikia neno la Mungu na kulishika.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μενοῦν
  choice: Naam, badala yake
  rationale: 'Kirai hiki kinadumisha nguvu mbili za chembe ya Kigiriki: kinakubali jambo lililotangulia huku kikielekeza mkazo kwenye msingi wa kweli wa kuwa na heri. ‘Badala yake’ peke yake kingeweza kusikika kama kukataa kabisa, na ‘naam’ peke yake isingeonyesha uelekezaji huo.'
- source_word: μακάριοι
  choice: heri
  rationale: Katika muundo ‘heri wale,’ neno hili ni la kawaida, lenye hadhi, na hubeba maana ya kibiblia ya kuwa katika hali ya kibali na baraka, si hisia ya furaha tu.
- source_word: οἱ ἀκούοντες
  choice: wale wanaolisikia
  rationale: Muundo huu wa wakati wa sasa unaonyesha kundi linalotambulika kwa kulisikia neno; ni wa asili katika Kiswahili bila kupoteza hali ya tendo linaloendelea au la kawaida.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi upana na mwangwi wa kibiblia wa λόγος, ambao hapa ni ujumbe au ufunuo unaotoka kwa Mungu.
- source_word: φυλάσσοντες
  choice: kulishika
  rationale: ‘Kulishika’ huweza kujumuisha kulitunza, kulizingatia, na kulitii neno la Mungu bila kuibana maana kuwa utiifu wa amri pekee.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Lakini yeye akasema
  rationale: ‘Lakini’ huonyesha tofauti nyepesi na kauli iliyotangulia, huku ‘yeye’ ikihifadhi mkazo wa αὐτός na ‘akasema’ ikibaki karibu na εἶπεν.
theological_decisions:
- issue: Nguvu ya jibu la Yesu kwa baraka iliyotamkwa na mwanamke
  choice: Jibu linakubali kwa kiasi lakini linaelekeza mkazo kwenye heri ya kuisikia na kuishika neno la Mungu.
  alternative: Kulitafsiri kama Yesu anakataa kabisa kauli ya mwanamke, au kama anaongeza baraka nyingine bila kuisahihisha hata kidogo.
  rationale: Μενοῦν inaweza kuthibitisha huku ikirekebisha au kuhamisha mkazo. ‘Naam, badala yake’ huhifadhi mvutano huo bila kuamua kwamba Yesu anakanusha baraka ya mama yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘heri wale’ una mwangwi wa kawaida wa mafundisho ya Yesu; ‘kulishika’ ni wa asili na huhifadhi upana wa maana ya neno la Kigiriki.
