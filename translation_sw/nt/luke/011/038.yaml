  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: sw
  text: Lakini Farisayo huyo, alipoona hayo, alishangaa kwamba Yesu hakuwa kwanza amenawa[a] kabla ya mlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa kwanza amefanya utaratibu wa kunawa kwa utakaso wa kiibada kabla ya mlo.” Kitenzi cha Kigiriki ni kilekile kinachotumiwa mara nyingi kwa maana ya “kubatiza,” lakini hapa kinarejelea kunawa katika muktadha wa desturi za utakaso za Mafarisayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti nyepesi kati ya tendo la Yesu na mwitikio wa Farisayo, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ὁ Φαρισαῖος
  choice: yule Farisayo
  rationale: Inabainisha Farisayo aliyetajwa katika muktadha huku ikitumia muundo wa kawaida wa Kiswahili.
- source_word: ἰδὼν
  choice: alipoona hayo
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha jambo lililotangulia mshangao; “hayo” hurejelea kitendo cha Yesu katika muktadha.
- source_word: ἐθαύμασεν
  choice: alishangaa
  rationale: Ni usemi wa kawaida na wenye hadhi unaowasilisha mshangao wa Farisayo bila kuongeza wazi hukumu au hasira isiyotajwa.
- source_word: οὐ πρῶτον
  choice: hakuwa ... kabla
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba tendo hilo lilitarajiwa kutangulia kula.
- source_word: ἐβαπτίσθη
  choice: amenawa
  rationale: Katika muktadha wa desturi za utakaso za Mafarisayo kabla ya chakula, kitenzi kinamaanisha kunawa kwa ibada, si ubatizo wa Kikristo.
- source_word: πρὸ τοῦ ἀρίστου
  choice: kabla ya kula
  rationale: Hutoa maana ya kabla ya mlo kwa Kiswahili cha asili bila kubainisha isivyohitajika kama ulikuwa mlo wa asubuhi au wa mchana.
theological_decisions:
- issue: Maana ya ἐβαπτίσθη katika mazingira ya mlo wa Kifarisayo
  choice: kunawa kabla ya kula, kukiwa na tanbihi inayoeleza hali ya kiibada
  alternative: kubatizwa au kujizamisha
  rationale: Muktadha unahusu desturi za utakaso kabla ya mlo, si ubatizo wa Kikristo. “Amenawa” ni wazi kwa msomaji, na tanbihi huhifadhi uhusiano wa kileksia na matumizi ya kitenzi kwa maana ya kubatiza.
- issue: Mtendaji aliyekuwa hajanawa
  choice: Yesu ametajwa wazi
  alternative: kutumia kiwakilishi “yeye”
  rationale: Kigiriki kina kiima kilichodokezwa ambacho muktadha unakitambulisha kuwa Yesu. Kutaja jina huepusha utata wa viwakilishi katika Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. “Kunawa” linafaa zaidi kuliko “kuosha” kwa tendo la mtu kujisafisha kabla ya kula; tanbihi inaeleza maana maalumu ya kiibada.
