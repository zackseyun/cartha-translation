  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: sw
  text: Lakini Bwana akamwambia, “Sasa ninyi Mafarisayo mnasafisha sehemu ya nje ya kikombe na sahani, lakini ndani yenu kumejaa tamaa ya mali[a] na uovu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unyang’anyi,” “uporaji,” au “kujipatia mali kwa nguvu au vitisho.”
    reason: Neno la Kigiriki linaweza kumaanisha tamaa yenye uchu au tendo la kunyakua, kupora, au kuwadhulumu wengine ili kujipatia mali.
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni cheo cha kawaida cha Agano Jipya katika muktadha huu, wala si neno la heshima tu kama ‘bwana mkubwa.’
- source_word: Νῦν
  choice: Sasa
  rationale: Limehifadhiwa kama kiashiria cha hotuba kinachoanzisha karipio kali la Yesu.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: ninyi Mafarisayo
  rationale: Kiwakilishi ‘ninyi’ kinahifadhi msisitizo wa Kigiriki kwa njia ya kawaida katika Kiswahili.
- source_word: τὸ ἔξωθεν
  choice: sehemu ya nje
  rationale: Usemi huu unaonyesha upande au uso wa nje wa vyombo na unaweka msingi wa utofautishaji na hali ya ndani.
- source_word: ποτηρίου
  choice: kikombe
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa chombo kinachotajwa.
- source_word: πίνακος
  choice: sahani
  rationale: πίναξ ni sahani au sinia la kuwekea chakula; ‘sahani’ ni neno pana, la kawaida, na lisilo maalumu kupita chanzo.
- source_word: καθαρίζετε
  choice: mnasafisha
  rationale: Wakati wa sasa unaonyesha tendo linalofanywa kwa kawaida; ‘mnasafisha’ ni usemi wa asili kwa vyombo na pia hudumisha wazo la utakaso.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: lakini ndani yenu
  rationale: Huhifadhi sitiari ya chanzo na kuhamisha mtazamo kutoka nje ya vyombo hadi hali ya ndani ya Mafarisayo bila kuongeza ‘mioyo’ au ‘nia.’
- source_word: γέμει
  choice: kumejaa
  rationale: Ni Kiswahili cha kawaida kinacholingana na maana ya kuwa na kitu kwa wingi ndani.
- source_word: ἁρπαγῆς
  choice: tamaa ya mali
  rationale: Katika karipio la kimaadili, usemi huu unaeleza uchu wa kujipatia mali kwa njia ya kuwadhulumu wengine. Tanbihi inahifadhi maana halisi zaidi za unyang’anyi, uporaji, au kudhulumu kwa nguvu.
- source_word: πονηρίας
  choice: uovu
  rationale: Ni neno pana la kimaadili linalodumisha uzito wa πονηρία bila kuibana maana kuwa chuki au ubaya wa aina moja tu.
theological_decisions:
- issue: Kirejelewa cha kisitiari cha ‘ndani’
  choice: Kudumisha sitiari kwa kusema ‘ndani yenu’
  alternative: mioyo yenu; nafsi zenu za ndani
  rationale: Kigiriki kinatofautisha usafishaji wa nje na uharibifu wa ndani. Kutaja moyo au akili kungefasiri uwezo fulani wa ndani ambao haukutajwa wazi katika chanzo.
- issue: Maana ya kimaadili ya ἁρπαγή
  choice: tamaa ya mali katika matini, huku maana halisi zaidi zikiwekwa katika tanbihi
  alternative: unyang’anyi; uporaji; udhalimu wa kujipatia mali
  rationale: Neno linaweza kutaja kitendo cha kunyakua au tabia ya uchu wa kujipatia mali. Matini inaonyesha hali ya ndani, lakini tanbihi inazuia tafsiri hiyo isifiche kabisa wazo la kujipatia mali kwa kuwadhulumu wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ndani yenu kumejaa’ ni wa asili na unahifadhi utofautishaji wa nje na ndani. Msisitizo wa ‘ninyi Mafarisayo’ umedumishwa, na tanbihi [a] imewekwa mara tu baada ya usemi unaohusika.
