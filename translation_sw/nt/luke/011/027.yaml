  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: sw
  text: Ikawa, alipokuwa akisema mambo hayo, mwanamke mmoja kutoka katika umati alipaza sauti[a] akamwambia, “Heri tumbo lililokubeba[b], na matiti uliyoyanyonya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliinua sauti yake” au “alipaza sauti.” Nahau ya Kigiriki humaanisha kusema kwa sauti kubwa au kuita kwa sauti.
    reason: lexical_alternative
  - marker: b
    text: Au, “lililokuzaa.” Kitenzi cha Kigiriki kinaweza kumaanisha kubeba, na katika muktadha huu kinahusu ujauzito na kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Inahifadhi fomula ya Luka ya kuendeleza simulizi kwa lugha fupi, ya asili, na isiyo ya kizamani.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: alipokuwa akisema mambo hayo
  rationale: Muundo huu unaonyesha kwamba tendo la kusema lilikuwa likiendelea wakati tukio jingine lilipotokea; pia unahifadhi maana ya ‘mambo hayo.’
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: mwanamke mmoja ... alipaza sauti
  rationale: ‘Alipaza sauti’ ni nahau ya kawaida ya Kiswahili inayolingana na kuinua sauti au kuita kwa sauti; ‘mwanamke mmoja’ huwasilisha τις kwa kawaida bila uzito usiohitajika.
- source_word: ἐκ τοῦ ὄχλου
  choice: kutoka katika umati
  rationale: Inaonyesha wazi kwamba mwanamke huyo alikuwa miongoni mwa umati.
- source_word: Μακαρία
  choice: Heri
  rationale: ‘Heri’ hubeba maana ya hali yenye baraka au inayostahili kupongezwa, si furaha ya kihisia tu, na inafaa katika kauli ya aina ya heri.
- source_word: ἡ κοιλία
  choice: tumbo
  rationale: Katika muktadha huu wa uzazi, ‘tumbo’ linaeleweka kama tumbo la uzazi na ni la kawaida zaidi kuliko istilahi ya kitabibu.
- source_word: ἡ βαστάσασά σε
  choice: lililokubeba
  rationale: Linahifadhi picha ya kubeba mtoto wakati wa ujauzito bila kuifanya kwa lazima kuwa ‘kuzaa,’ ingawa maana hiyo inahusiana kwa karibu.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: matiti uliyonyonya
  rationale: Huu ni usemi wa moja kwa moja na wa asili wa Kiswahili unaohifadhi picha halisi ya Kigiriki ya mtoto kunyonya matiti.
theological_decisions:
- issue: Tafsiri ya μακαρία katika kauli inayomheshimu mama ya Yesu
  choice: Heri tumbo lililokubeba, na matiti uliyonyonya!
  alternative: Limebarikiwa tumbo lililokubeba, na matiti yaliyokunyonyesha!
  rationale: ‘Heri’ inadumisha nguvu ya kauli ya heshima bila kupunguza wala kuongeza maana kuhusu mama ya Yesu zaidi ya ilivyo katika maandishi. Pia haiamui mapema jinsi jibu la Yesu katika mstari unaofuata linavyohusiana na kauli hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ikawa’ na ‘Heri’ hudumisha ladha ya simulizi na kauli ya heri bila kutumia lugha nzito ya kizamani.
