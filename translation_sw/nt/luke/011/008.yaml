  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: sw
  text: Ninawaambia, hata kama hatainuka na kumpa kitu kwa sababu yeye ni rafiki yake, hata hivyo, kwa sababu ya kusisitiza kwake bila haya[a], atainuka na kumpa vyote anavyohitaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujasiri wake,” “ukosefu wake wa haya,” au “kung'ang'ania kwake bila haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Ni kauli ya kawaida ya Yesu inayowahutubia wasikilizaji moja kwa moja; umbo hili ni la asili katika Kiswahili sanifu.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: hata kama hataamka na kumpa kitu
  rationale: “Hata kama” huhifadhi wazo la kukubali hali kwa masharti; “ataamka” linafaa katika mazingira ya mtu kuinuka kitandani. “Kitu” kimetajwa ili kitenzi “kumpa” kiwe cha asili katika Kiswahili, ingawa kitu hicho kinaeleweka kutokana na muktadha.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: kwa sababu huyo ni rafiki yake
  rationale: Huhifadhi sababu na uhusiano wa kibinafsi unaoelezwa na φίλον αὐτοῦ bila kuugeuza kuwa dhana ya jumla ya urafiki.
- source_word: διά γε
  choice: hata hivyo, kwa sababu ya
  rationale: 'Hutoa mkazo wa utofautishaji: urafiki hautoshi kumfanya aamke, lakini sababu nyingine inamfanya aamke.'
- source_word: ἀναίδειαν αὐτοῦ
  choice: kung'ang'ania kwake bila haya
  rationale: ἀναίδεια kimsingi ni kutokuwa na haya au kujali desturi inayofaa; hapa linaeleza kuendelea kuomba bila kuona haya. Tafsiri hii huhifadhi ukali wa neno na pia maana yake katika muktadha.
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: ataamka na kumpa
  rationale: Katika tukio hili ἐγερθεὶς humaanisha kuamka au kuinuka kitandani; uratibu kwa “na” ni wa asili zaidi katika Kiswahili.
- source_word: ὅσων χρῄζει
  choice: vyote anavyohitaji
  rationale: Huwasilisha wingi na kiwango kamili cha vitu vinavyohitajika, badala ya kudokeza kitu kimoja tu.
theological_decisions:
- issue: Maana ya ἀναίδεια katika mfano
  choice: kung'ang'ania kwake bila haya
  alternative: ujasiri wake; ukosefu wake wa haya; usumbufu wake usiokoma
  rationale: Neno lenyewe lina maana hasi au kali ya kutokuwa na haya, lakini katika muktadha linaonyesha mwombaji anayeendelea kusisitiza ombi lake bila kuzuiwa na aibu ya kijamii. Tafsiri hailifanyi neno kuwa sifa safi ya maadili wala kuamua kwamba ni ufidhuli tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kung'ang'ania” linaweka wazi hali ya kuendelea kuomba, huku “bila haya” likihifadhi nguvu ya ἀναίδεια.
