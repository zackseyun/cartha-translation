  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: sw
  text: Mtu mwenye nguvu, akiwa amejihami kikamilifu, anapolinda ua wake mwenyewe[a], mali zake huwa salama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba yake mwenyewe,” “jumba lake mwenyewe,” au “eneo lake mwenyewe”; neno la Kigiriki linaweza kumaanisha ua au makazi pamoja na eneo lake.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “huwa katika amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: anapolinda
  rationale: Kiambishi cha wakati -po- kinawasilisha hali ya jumla ya wakati au sharti kwa Kiswahili cha kawaida, bila kuifanya kuwa tukio moja tu.
- source_word: ὁ ἰσχυρός
  choice: mtu mwenye nguvu
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na kinamtaja mtu wa kiume mwenye nguvu; tafsiri hii ni wazi na ya kawaida bila kufafanua mhusika wa mfano.
- source_word: καθωπλισμένος
  choice: akiwa amejihami kikamilifu
  rationale: Muundo huu unaonyesha hali iliyotokana na kujitayarisha kwa silaha na kuhifadhi maana ya kuwa na silaha zote zinazohitajika.
- source_word: φυλάσσῃ
  choice: anapolinda
  rationale: ‘Kulinda’ huonyesha uangalizi unaoendelea na ulinzi wa eneo bila kuongeza maelezo yasiyo katika chanzo.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: ua wa makazi yake mwenyewe
  rationale: ‘Ua wa makazi’ unaonyesha eneo la ndani au eneo linalohusiana na nyumba, huku ‘yake mwenyewe’ ikihifadhi msisitizo wa ἑαυτοῦ. Tanbihi inadumisha upana wa maana ya αὐλή.
- source_word: ἐν εἰρήνῃ
  choice: huwa salama
  rationale: Katika muktadha huu msemo wa Kigiriki ‘katika amani’ unaeleza mali kutosumbuliwa au kuwa salama; ‘huwa salama’ ni Kiswahili cha asili, na tafsiri ya moja kwa moja imehifadhiwa katika tanbihi.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: mali zake
  rationale: ‘Mali zake’ ni usemi mfupi na wa kawaida unaojumuisha vitu vyote vinavyomilikiwa na mtu huyo.
theological_decisions:
- issue: Nguvu ya mfano katika muktadha
  choice: Taswira ya mtu mwenye nguvu imeachwa kama ilivyo bila kumtaja Shetani moja kwa moja katika aya hii.
  alternative: Kumfafanua ‘mtu mwenye nguvu’ moja kwa moja kuwa Shetani katika matini kuu.
  rationale: Aya yenyewe inatoa taswira ya mfano, huku muktadha unaoizunguka ukiongoza ufasiri wake. Tafsiri haipaswi kutanguliza ufafanuzi wa mfano ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi umewekwa wa asili kwa Kiswahili huku hali ya jumla ya usemi, msisitizo wa ‘mwenyewe,’ na utata wa αὐλή vikihifadhiwa.
