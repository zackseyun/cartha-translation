translation:
  language: sw
  text: Utupe siku kwa siku mkate wetu wa kila siku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wa siku inayokuja,” “mkate tunaouhitaji,” au, kwa uwezekano mdogo zaidi hapa, “mkate wa zaidi ya asili” (supersubstantial). Kivumishi cha Kigiriki ni adimu, na maana yake inabishaniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: mkate
  rationale: Neno hilo humaanisha kihalisi ‘mkate’ na hapa linaweza pia kuwakilisha riziki ya msingi. ‘Mkate’ huhifadhi picha halisi na lugha iliyozoeleka ya sala bila kupanua tafsiri kuwa ‘chakula.’
- source_word: ἡμῶν
  choice: wetu
  rationale: Ni kiwakilishi cha umilikaji kinachoeleza ‘mkate.’
- source_word: ἐπιούσιον
  choice: wa kila siku
  rationale: Kivumishi hiki adimu kina maana inayobishaniwa. Katika Luka, kirai kinachofuata τὸ καθ’ ἡμέραν (‘kila siku’) kinaunga mkono wazo la mahitaji yanayotolewa kila siku. Tafsiri hii ni wazi katika Kiswahili, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: δίδου
  choice: Utupe
  rationale: Kauli ya kuamuru ya wakati uliopo inaweza kudokeza tendo linaloendelea au kurudiwa. ‘Utupe’ ni ombi la kawaida na lenye heshima katika Kiswahili; wazo la kurudiwa linaonyeshwa na ‘kila siku.’
- source_word: ἡμῖν
  choice: -tu-
  rationale: Kiambishi cha yambwa ‘-tu-’ katika ‘utupe’ kinatafsiri maana ya ‘sisi.’
- source_word: τὸ καθ’ ἡμέραν
  choice: kila siku
  rationale: Kirai hiki kinasisitiza utoaji unaorudiwa siku baada ya siku. Kukitafsiri wazi huhifadhi msisitizo wa Luka, hata ingawa kunatokea urudiaji wa kimakusudi pamoja na ‘wa kila siku.’
theological_decisions:
- issue: Maana ya ἐπιούσιον katika Sala ya Bwana
  choice: wa kila siku
  alternative: wa siku inayokuja; tunaouhitaji; unaopita hali ya kawaida
  rationale: Maana ya kivumishi hiki inabishaniwa, lakini nyongeza ya Luka τὸ καθ’ ἡμέραν inaelekeza kwenye riziki ya kawaida ya kila siku. Tanbihi huhifadhi uwezekano mwingine bila kuingiza maana ya kisakramenti au ya kimetafizikia katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye hadhi. Urudiaji ‘kila siku ... wa kila siku’ umehifadhiwa kwa sababu matini ya Kigiriki ina kivumishi ἐπιούσιον pamoja na kirai cha wazi τὸ καθ’ ἡμέραν; pia unaeleweka katika lugha ya sala.
