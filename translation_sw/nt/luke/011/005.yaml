lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Ni nani kati yenu
  rationale: Ni muundo wa kawaida wa Kiswahili unaoleta swali la balagha moja kwa moja kwa wasikilizaji.
- source_word: ἕξει
  choice: aliye na
  rationale: Ingawa Kigiriki kimetumia wakati ujao, wakati uliopo katika kishazi cha uhusiano ni wa asili zaidi katika swali hili la balagha la Kiswahili; tofauti hiyo imeonyeshwa katika tanbihi.
- source_word: φίλον / Φίλε
  choice: rafiki / Rafiki
  rationale: Neno lilelile limedumishwa kwa mtu anayejulikana na kwa namna ya kumwita, kama ilivyo katika Kigiriki.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: atakayemwendea
  rationale: Hutoa kwa ufupi na kwa Kiswahili cha kawaida wazo la kwenda mahali alipo rafiki huyo, huku ikidumisha umbo la wakati ujao.
- source_word: μεσονυκτίου
  choice: usiku wa manane
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili kwa wakati unaotajwa.
- source_word: εἴπῃ αὐτῷ
  choice: na kumwambia
  rationale: Hufuata kwa kawaida kitendo cha kumwendea na kudumisha maana ya kusema maneno kwa rafiki huyo.
- source_word: χρῆσόν μοι
  choice: nikopeshe
  rationale: Huonyesha ombi la kumpatia kitu kwa muda, si kumpa kabisa, na linafaa kwa mkate unaohitajika katika mazingira haya.
- source_word: τρεῖς ἄρτους
  choice: mikate mitatu
  rationale: Huwakilisha mikate mitatu kama vitu vinavyohesabika bila kuigeuza maana kuwa vipande vya mkate.
