  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: sw
  text: Yule asiye pamoja nami yuko kinyume nami,[a] na yule asiyekusanya pamoja nami hutawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote asiye pamoja nami yuko kinyume nami, na yeyote asiyekusanya pamoja nami hutawanya.”
    reason: Njia nyingine ya kutafsiri muundo wa Kigiriki unaomtaja mtu kwa maana ya jumla.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: yule asiye
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja mtu yeyote mwenye sifa hiyo. “Yule asiye” ni Kiswahili cha kawaida na chenye hadhi, huku kikidumisha umoja wa jumla wa Kigiriki.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: μετά pamoja na jenitivi huonyesha ushirika au kuambatana. “Pamoja nami” hudumisha maana ya kuwa upande mmoja na Yesu kwa lugha ya asili ya Kiswahili.
- source_word: κατ’ ἐμοῦ
  choice: kinyume nami
  rationale: κατά pamoja na jenitivi hapa huonyesha upinzani. “Kinyume nami” ni wazi na hudumisha ulinganifu mkali na “pamoja nami.”
- source_word: συνάγων
  choice: anayekusanya
  rationale: Kitenzi hiki humaanisha kukusanya au kuleta pamoja. “Kukusanya” ni kifupi na hudumisha taswira pamoja na ukinzani wake na kutawanya.
- source_word: σκορπίζει
  choice: hutawanya
  rationale: σκορπίζω humaanisha kutawanya. Hali ya mazoea “hutawanya” inafaa kwa kauli hii ya jumla na inaweka wazi kinyume cha kukusanya.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha vifungu viwili sambamba kwa njia ya moja kwa moja; “na” hudumisha muundo huo.
theological_decisions:
- issue: Uzito wa kauli ya Yesu kuhusu kutokuwa upande wowote kwake
  choice: Mtu asiye pamoja na Yesu anaelezwa kuwa yuko kinyume naye.
  alternative: Kuieleza kwa upole kama kutomsaidia tu, au kuifungia waziwazi katika suala la kutoa pepo pekee.
  rationale: Muundo wa Kigiriki ni wa moja kwa moja na mkali. Tafsiri inadumisha mvutano huo bila kuuingiza katika mfumo wa baadaye wa kimadhehebu wala kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Marudio ya “pamoja nami” na ukinzani wa “kukusanya/kutawanya” yamehifadhiwa kwa sababu ni sehemu ya nguvu ya usemi wa asili.
