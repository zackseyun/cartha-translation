  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: sw
  text: Ole wenu, kwa sababu mnajenga makaburi[a] ya manabii, lakini baba[b] zenu waliwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makaburi ya ukumbusho.” Neno la Kigiriki linaweza kumaanisha kaburi au mnara wa ukumbusho wa kaburi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “baba”; hapa linaweza kumaanisha waasili au watu wa vizazi vilivyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ole wenu
  rationale: Ni usemi wa kawaida na wenye uzito katika Kiswahili unaotangaza hukumu dhidi ya wanaosemeshwa moja kwa moja.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha wazi sababu ya tangazo la hukumu.
- source_word: οἰκοδομεῖτε
  choice: mnajenga
  rationale: Inahifadhi wakati wa sasa wa kitenzi na ni usemi wa kawaida wa Kiswahili.
- source_word: τὰ μνημεῖα
  choice: makaburi
  rationale: Katika muktadha huu neno linamaanisha makaburi au majengo ya ukumbusho juu ya makaburi; 'makaburi' ndiyo tafsiri iliyo wazi na ya kawaida zaidi.
- source_word: τῶν προφητῶν
  choice: ya manabii
  rationale: Inawakilisha uhusiano wa makaburi hayo na manabii bila kuongeza ufafanuzi usio katika chanzo.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: lakini mababu zenu
  rationale: δέ inaonyesha utofautishaji katika muktadha, na 'mababu zenu' huwasilisha maana ya vizazi vyao vya awali kwa Kiswahili cha kawaida.
- source_word: ἀπέκτειναν αὐτούς
  choice: ndio waliowaua
  rationale: Inarejelea manabii kwa uwazi na kwa Kiswahili asilia; 'waliowaua' haitilii ndani maana ya kisheria iliyo nzito kuliko kitenzi cha Kigiriki.
theological_decisions:
- issue: Iwapo kueleza wazi unafiki au ushirika wa lawama kati ya kujenga makaburi na kuuawa kwa manabii
  choice: 'Kuacha uhusiano huo ukiwa katika mvutano wa kauli yenyewe: wanajenga makaburi, lakini mababu zao waliwaua.'
  alternative: Kusema kwamba kwa kujenga makaburi wanashuhudia dhidi ya matendo ya mababu zao.
  rationale: Aya hii inaweka matendo hayo mawili sambamba bila kutoa hitimisho lote; ufafanuzi wake unaendelezwa katika aya inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Ole wenu' huhifadhi nguvu ya tangazo la kinabii, huku 'mababu zenu' ikiepuka dhana ya baba zao wa moja kwa moja.
