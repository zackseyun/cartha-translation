id: LUK.11.2
reference: Luke 11:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: sw
  text: 'Akawaambia, “Mnaposali, semeni: ‘Baba, jina lako litakaswe. Ufalme wako uje.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Mnaposali
  rationale: Hutoa hali ya kijumla ya wakati na tendo la kawaida au linalorudiwa; ‘mnaposali’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: λέγετε
  choice: semeni
  rationale: Amri ya wakati uliopo inaelekeza namna ya kusali; ‘semeni’ ni ya asili bila kulazimisha maana ya kurudia maneno mfululizo.
- source_word: Πάτερ
  choice: Baba
  rationale: Nakala ya Kigiriki ina mwito mfupi ‘Baba,’ bila ‘yetu’; tafsiri haioanishi kimyakimya na Mathayo 6:9.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: jina lako litakaswe
  rationale: Hifadhi muundo wa ombi katika kauli tendwa. Katika Kiswahili cha kibiblia na cha sasa, ‘litakaswe’ humaanisha jina la Mungu litambuliwe na kuheshimiwa kuwa takatifu, si kwamba hapo awali halikuwa takatifu.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Ufalme wako uje
  rationale: Hifadhi nguvu ya ombi/amri ya nafsi ya tatu na neno lililozoeleka ‘ufalme,’ ambalo linaweza kujumuisha utawala wa Mungu na ufalme wake unaokuja.
theological_decisions:
- issue: Kumwita Mungu ‘Baba’ bila ‘yetu’
  choice: Baba
  alternative: Baba yetu
  rationale: Πάτερ katika chanzo kilichotolewa haina kiwakilishi ‘yetu’; uamuzi huu unafuata Luka badala ya kuoanisha na Mathayo au mapokeo ya liturujia.
- issue: Maana ya ἁγιασθήτω τὸ ὄνομά σου
  choice: jina lako litakaswe
  alternative: jina lako lihesabiwe kuwa takatifu
  rationale: Tafsiri fupi huhifadhi sitiari ya ‘jina’ na kauli tendwa ya Kigiriki. Haielezi kupita kiasi ni nani anayelitakasa, hivyo inadumisha upana na mvutano wa ombi la chanzo.
- issue: Maana ya βασιλεία
  choice: Ufalme wako
  alternative: Utawala wako
  rationale: ‘Ufalme’ ni neno la kawaida na lenye upana unaoweza kubeba maana ya enzi/utawala wa Mungu pamoja na matarajio ya wakati ujao; ‘utawala’ pekee ungeweza kupunguza upande wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sala umeachwa mfupi kama ulivyo katika Kigiriki; hakuna alama za tanbihi kwa kuwa rasimu hii haihitaji tanbihi ili kueleza matini iliyochaguliwa.
