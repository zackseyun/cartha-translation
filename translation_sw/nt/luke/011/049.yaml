base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: sw
  text: Kwa sababu hiyo, hekima ya Mungu pia ilisema[a], “Nitawatuma kwao manabii na mitume; nao watawaua baadhi yao na kuwatesa baadhi yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “hekima ya Mungu” kinaweza kueleweka kuwa hekima ya Mungu iliyowasilishwa kama nafsi, uamuzi wa Mungu wenye hekima, au rejeo lisilo la moja kwa moja la Yesu kujihusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu ya kisababishi na uhusiano wake na shtaka lililotangulia.
- source_word: καὶ
  choice: pia
  rationale: Inaonyesha nyongeza katika kauli hii bila kuifanya kuwa kiunganishi cha kawaida tu.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: hekima ya Mungu
  rationale: Inafuata muundo wa Kigiriki kwa karibu na kuacha wazi kama ni hekima iliyofanywa kama nafsi, uamuzi wa Mungu wenye hekima, au rejeo lisilo la moja kwa moja kwa Yesu.
- source_word: εἶπεν
  choice: ilisema
  rationale: Kitenzi hiki cha wakati uliopita ni cha kawaida na hakiongezi tafsiri isiyokuwamo.
- source_word: Ἀποστελῶ
  choice: Nitawatuma
  rationale: Huonyesha wakati ujao na walengwa waliotajwa katika εἰς αὐτούς kwa Kiswahili cha asili.
- source_word: εἰς αὐτούς
  choice: -wa- katika Nitawatuma
  rationale: Kiambishi cha yambwa kinaonyesha kwa kawaida kuwa watatumwa kwao.
- source_word: προφήτας
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa προφήτης.
- source_word: ἀποστόλους
  choice: mitume
  rationale: Linahifadhi maana inayowezekana ya cheo au jukumu maalumu katika Luka–Matendo kuliko neno la jumla ‘wajumbe’.
- source_word: ἐξ αὐτῶν
  choice: baadhi yao
  rationale: 'Inahifadhi maana ya sehemu ya kundi: si lazima kila nabii na mtume apatwe na matendo yote mawili.'
- source_word: ἀποκτενοῦσιν
  choice: watawaua
  rationale: Ni tafsiri ya moja kwa moja, wazi, na ya kawaida ya kitenzi cha wakati ujao.
- source_word: διώξουσιν
  choice: kuwatesa
  rationale: Katika muktadha huu wa uadui, neno hilo linamaanisha kuwatesa kwa sababu ya imani au utume wao, si kufuatilia kwa maana isiyo ya kiadui.
theological_decisions:
- issue: Maana ya ‘hekima ya Mungu’
  choice: Imeandikwa ‘hekima ya Mungu’ bila kuitambulisha moja kwa moja kuwa Yesu, Maandiko, au nafsi tofauti.
  alternative: Inaweza kueleweka kuwa hekima ya Mungu iliyofanywa kama nafsi, uamuzi wake wenye hekima, au rejeo lisilo la moja kwa moja la Yesu kujihusu.
  rationale: Muundo wa asili unaruhusu zaidi ya uelewa mmoja; tafsiri inahifadhi utata na mvutano huo wa kiteolojia badala ya kuutatua kimyakimya.
- issue: Uhusiano wa ‘kuua’ na ‘kutesa’ na baadhi yao
  choice: Mpangilio ‘watawaua na kuwatesa baadhi yao’ umehifadhi uratibu wa vitenzi vya Kigiriki huku ‘baadhi yao’ ikibaki na maana ya sehemu ya kundi.
  alternative: ‘Baadhi yao watawaua, na wengine watawatesa.’
  rationale: Toleo mbadala lingegawa makundi bila msingi wa wazi katika Kigiriki; maandishi ya asili hayataji ‘wengine’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Manabii’ na ‘mitume’ ni istilahi zinazotambulika kwa urahisi. Muundo umewekwa wazi na wa kawaida bila kufuta utata wa ἡ σοφία τοῦ θεοῦ.
