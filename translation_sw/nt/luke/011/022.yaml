  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: sw
  text: Lakini mwenye nguvu kuliko yeye anapomjia na kumshinda[a], humwondolea silaha zake zote[b] ambazo alikuwa akizitegemea, na hugawa nyara zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumlemea” au “kumweza.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linamaanisha vifaa kamili vya vita.
    reason: lexical_alternative
  - marker: c
    text: Yaani, mali iliyotwaliwa kutoka kwa aliyeshindwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Lakini ... anapo-
  rationale: “Lakini” linaonyesha utofautishaji na hali iliyotangulia, na muundo wa “anapo-” unawasilisha uhusiano wa wakati na sharti kwa Kiswahili cha kawaida.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: mwenye nguvu kuliko yeye
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino bila kutaja wazi “mtu”; tafsiri hii inahifadhi hali hiyo huku ikieleweka kwa urahisi.
- source_word: ἐπελθὼν
  choice: anapomjia
  rationale: Huwasilisha maana ya kumjia au kumjia dhidi yake bila kuongeza wazi wazo la shambulio ambalo muktadha unadokeza lakini kitenzi chenyewe hakilazimishi.
- source_word: νικήσῃ αὐτόν
  choice: kumshinda
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaoonyesha ushindi unaosababisha kunyang’anywa silaha; “kumlemea” pia lingeweza kuonyesha nguvu za kimwili lakini ni finyu zaidi.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: silaha zake zote
  rationale: πανοπλία ni vifaa kamili vya vita. “Silaha zake zote” ni usemi wa asili kwa wasomaji wa kawaida na unadumisha wazo la ukamilifu.
- source_word: αἴρει
  choice: humwondolea
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba mwenye nguvu zaidi anamnyang’anya aliyeshindwa vifaa alivyovitegemea.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: ambazo alikuwa akizitegemea
  rationale: Muundo huu unaonyesha utegemezi uliokuwa ukiendelea kabla ya kushindwa na unaunganisha kwa kawaida silaha na tegemeo lake.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: nyara zake
  rationale: σκῦλα ni mali inayotwaliwa baada ya adui kushindwa; “nyara” ni neno la kawaida na linalofaa katika picha hii ya mapambano.
- source_word: διαδίδωσιν
  choice: hugawa
  rationale: Kitenzi kina maana ya kugawa au kusambaza nyara miongoni mwa wengine; “hugawa” ni sahihi na ya kawaida.
theological_decisions:
- issue: Iwapo mwenye nguvu zaidi atajwe wazi kuwa “mtu.”
  choice: Kutumia “mwenye nguvu kuliko yeye” bila kuongeza “mtu.”
  alternative: mtu mwenye nguvu kuliko yeye
  rationale: Kigiriki hakina nomino iliyo wazi katika kishazi hiki. Muktadha wa mstari uliotangulia unatosha kumtambulisha mhusika, hivyo tafsiri haiongezi ufafanuzi usiolazimishwa na matini.
- issue: Kiwango cha nguvu kinachopaswa kuonyeshwa katika νικάω.
  choice: kumshinda
  alternative: kumlemea; kumweza
  rationale: “Kumshinda” huhifadhi maana pana ya kupata ushindi na matokeo yake katika simulizi bila kuamua zaidi kitheolojia mhusika anamwakilisha nani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo wa wakati wa sasa wa mazoea (“anapomjia,” “humwondolea,” “hugawa”) unadumisha tabia ya jumla ya picha hii. Hakuna utambulisho wa kitheolojia wa wahusika ulioongezwa.
