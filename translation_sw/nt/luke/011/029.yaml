  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: sw
  text: Makundi ya watu yalipokuwa yakikusanyika, alianza kusema, “Kizazi hiki ni kizazi kiovu. Kinatafuta ishara, na hakitapewa ishara isipokuwa ishara ya Yona.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ishara ya Yona” inaweza kumaanisha Yona mwenyewe akiwa ishara kupitia utume wake wa kinabii; kwa kuzingatia pia vifungu sambamba vya Injili, inaweza kuibua uhusiano wa kimfano na kifo na ufufuo wa Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: ulipokuwa ukikusanyika
  rationale: Kauli hii inaonyesha tendo lililokuwa likiendelea wakati Yesu alianza kusema. ‘Ulikuwa ukikusanyika’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo bila kuongeza wazo la kwamba idadi ilikuwa ikiongezeka.
- source_word: ἤρξατο λέγειν
  choice: alianza kusema
  rationale: Inahifadhi kwa uwazi maana ya kuanza kwa tendo la kusema.
- source_word: γενεά
  choice: kizazi
  rationale: ‘Kizazi’ ndilo neno la kawaida linalohifadhi maana ya kundi la watu wa wakati mmoja pamoja na tathmini ya kijamii na kimaadili katika kauli hii.
- source_word: πονηρά
  choice: kiovu
  rationale: ‘Kiovu’ ni tathmini ya moja kwa moja ya kimaadili na haisawazishi ukali wa maneno ya Yesu.
- source_word: σημεῖον
  choice: ishara
  rationale: ‘Ishara’ huhifadhi upana wa neno la Kigiriki bila kulifanya moja kwa moja kuwa ‘muujiza,’ ingawa muktadha unaweza kuhusisha tendo la ajabu la kuthibitisha.
- source_word: ζητεῖ
  choice: kinatafuta
  rationale: Hufuata maana ya msingi ya kitenzi. Muktadha unaonyesha kwamba kutafuta huku kuna msimamo usiofaa, bila kulazimisha tafsiri yenye nguvu zaidi kama ‘kinadai.’
- source_word: δοθήσεται
  choice: kitapewa
  rationale: Inawakilisha wakati ujao na hali ya kutendwa kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Baada ya kauli hasi, ‘isipokuwa’ huonyesha kwa usahihi kwamba ishara ya Yona ndiyo pekee inayotengwa.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ishara ya Yona
  rationale: Muundo huu unaacha wazi uhusiano wa Yona na ishara, kama ulivyo katika Kigiriki, badala ya kuamua mapema kwamba ni ishara iliyotolewa na Yona au tukio fulani maalumu.
theological_decisions:
- issue: Ukubwa wa hukumu ya Yesu juu ya ‘kizazi hiki’
  choice: Kauli imehifadhiwa kama tathmini pana ya kimaadili kuhusu kizazi cha wakati wa Yesu.
  alternative: Kuifanya ihusu tu wapinzani fulani waliokuwapo hapo.
  rationale: Kurudiwa kwa neno ‘kizazi’ kunasisitiza hukumu ya pamoja. Tafsiri haipunguzi wala kupanua rejeo zaidi ya ushahidi wa Kigiriki.
- issue: Maana ya ‘ishara ya Yona’
  choice: Usemi ‘ishara ya Yona’ umehifadhiwa bila kufafanuliwa ndani ya matini kuu.
  alternative: Kuifafanua moja kwa moja kuwa huduma ya kinabii ya Yona, mwito wake wa kutubu, au mfano wa kifo na ufufuo wa Yesu.
  rationale: Muktadha wa karibu katika Luka unatoa maelezo yake, huku vifungu sambamba vya Injili vikitoa uwezekano wa uhusiano wa kimfano na kifo na ufufuo wa Yesu. Tafsiri kuu inahifadhi uwazi wa muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Umati’ umetumiwa kwa mtindo wa kawaida badala ya neno la kale zaidi; urudiaji wa ‘kizazi’ umehifadhiwa kwa sababu ni sehemu ya msisitizo wa matini ya Kigiriki.
