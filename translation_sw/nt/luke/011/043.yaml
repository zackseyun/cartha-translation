id: LUK.11.43
reference: Luke 11:43
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: sw
  text: Ole wenu Mafarisayo, kwa sababu mnapenda viti vya heshima[a] katika masinagogi na kusalimiwa[b] masokoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viti vya kwanza” au “nafasi za heshima.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, salamu za hadharani zilizoonyesha heshima na kutambuliwa kwa mtu katika jamii.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Ole
  rationale: Neno hili linadumisha nguvu ya tamko la kinabii la hukumu na karipio, badala ya kulifanya kuwa kilio cha huzuni tu.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: wenu Mafarisayo
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi usemi wa moja kwa moja unaowalenga Mafarisayo.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Linaonyesha wazi sababu ya tamko la ‘ole’.
- source_word: ἀγαπᾶτε
  choice: mnapenda
  rationale: Linahifadhi maana ya kupenda au kutamani sana heshima hizi bila kuongeza ufafanuzi usiotajwa moja kwa moja.
- source_word: πρωτοκαθεδρίαν
  choice: viti vya heshima
  rationale: Neno hilo linamaanisha viti vya hadhi ya juu katika sinagogi; ‘viti vya heshima’ linaonyesha hadhi kuliko nafasi ya kimwili pekee.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: katika masinagogi
  rationale: ‘Masinagogi’ ni neno la kawaida la Kiswahili kwa maeneo haya ya kusanyiko na ibada ya Kiyahudi.
- source_word: ἀσπασμοὺς
  choice: kusalimiwa
  rationale: Ubadilishaji wa kisarufi kutoka nomino kwenda kitenzi huleta Kiswahili cha asili na unaonyesha kuwa walipenda kupokea salamu za kutambuliwa hadharani.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: masokoni
  rationale: Linaeleza kwa ufupi na kwa lugha ya kawaida maeneo ya umma ya biashara na mikusanyiko ya kijamii.
theological_decisions:
- issue: Asili ya tamko la Yesu
  choice: Tamko la kinabii la ‘ole’ dhidi ya kupenda heshima ya hadharani
  alternative: Ukosoaji wa kijamii tu kuhusu tabia isiyofaa
  rationale: οὐαί pamoja na sababu inayofuata linaonyesha karipio lenye uzito wa kimaadili na kiroho, si maoni kuhusu adabu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na rahisi kueleweka; ‘viti vya heshima’ huepuka dhana potovu kwamba מדובר tu nafasi za mbele, na ‘kusalimiwa’ ni muundo wa kawaida wa Kiswahili kwa kupokea salamu hizo.
