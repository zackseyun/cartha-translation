id: LUK.11.42
reference: Luke 11:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: sw
  text: Lakini ole wenu, ninyi Mafarisayo! Kwa maana mnatoa sehemu ya kumi ya mnanaa, mmea wa ruda[a], na kila aina ya mboga, lakini mnapuuza haki na upendo wa Mungu. Ilipasa kuyafanya haya bila kuyaacha yale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ruda ni mmea unaoitwa rue kwa Kiingereza (Ruta).
    reason: Hufafanua jina la mmea linalotafsiri πήγανον bila kulibadilisha kuwa mmea mwingine.
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ole wenu
  rationale: Kauli ya kawaida ya kinabii ya kutangaza hukumu au maafa; inadumisha uzito wa Kigiriki.
- source_word: ἀποδεκατοῦτε
  choice: mnatoa sehemu ya kumi
  rationale: Hueleza wazi desturi ya kutoa moja ya kumi kwa lugha ya kawaida na yenye heshima.
- source_word: ἡδύοσμον
  choice: mnanaa
  rationale: Jina la kawaida la Kiswahili kwa mint.
- source_word: πήγανον
  choice: mchicha-pori
  rationale: Hutaja rue, mmea mchungu wa jamii ya Ruta; jina hili linaeleweka zaidi kuliko mkopo usiozoeleka.
- source_word: πᾶν λάχανον
  choice: kila aina ya mboga
  rationale: λάχανον hapa ni mimea ya bustani au mboga kwa upana, si kabichi peke yake.
- source_word: παρέρχεσθε
  choice: mnapuuza
  rationale: Katika muktadha huu maana ni kupita kando au kutotilia maanani wajibu muhimu; 'mnapuuza' ni ya asili na huhifadhi lawama.
- source_word: κρίσιν
  choice: haki
  rationale: Katika dai la kimaadili, κρίσις humaanisha haki au hukumu ya haki.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: 'Huhifadhi muundo wa Kigiriki na utata wake: unaweza kueleweka kuwa upendo kwa Mungu au upendo unaotoka kwa Mungu.'
- source_word: ταῦτα ... κἀκεῖνα
  choice: haya ... yale
  rationale: Huhifadhi marejeo ya kielekezi ya Kigiriki bila kuyafafanua kupita kiasi.
- source_word: μὴ παρεῖναι
  choice: bila kuyaacha
  rationale: Hutoa maana ya kutoyaacha au kutoyapuuza mambo mengine; ni tamko la kawaida la Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya haki na upendo wa Mungu kwa upande mmoja, na kutoa sehemu ya kumi kwa upande mwingine
  choice: Ilipaswa kuyatenda haya bila kuyaacha yale
  alternative: Ilipaswa kuyatenda yale bila kuyaacha haya
  rationale: Viashiria vya Kigiriki ταῦτα na ἐκεῖνα vinaweza kujadiliwa kwa marejeo yake, lakini mpangilio wa sentensi unaeleweka kwa kawaida kuwa haki na upendo ndio 'haya' yaliyopaswa kutendwa, huku utoaji wa sehemu ya kumi ukiwa 'yale' yasiyoachwa.
- issue: Maana ya 'upendo wa Mungu'
  choice: upendo wa Mungu
  alternative: kumpenda Mungu
  rationale: Genitivi ya Kigiriki τοῦ θεοῦ inaweza kubeba zaidi ya uhusiano mmoja; tafsiri ya moja kwa moja haifungi maana kwa upendo wa binadamu kwa Mungu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi ya mwisho inadumisha utofautishaji wa Kigiriki kati ya 'haya' na 'yale'.
