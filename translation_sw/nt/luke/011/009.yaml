  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: sw
  text: 'Nami nawaambia[a]: Ombeni, nanyi mtapewa; tafuteni, nanyi mtapata; bisheni, nanyi mtafunguliwa mlango.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuonyesha wazi zaidi uwezekano wa tendo linaloendelea katika amri za Kigiriki: “endeleeni kuomba ... endeleeni kutafuta ... endeleeni kubisha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: Nami
  rationale: Muungano wa καὶ ἐγώ unaendeleza fundisho lililotangulia na kumweka Yesu katika nafasi ya msisitizo. “Nami” ni ya asili katika Kiswahili na huhifadhi uhusiano huo bila kuongeza “pia” isiyolazimu.
- source_word: λέγω
  choice: ninawaambia
  rationale: Wakati wa sasa katika kauli hii ya utangulizi unatafsiriwa kwa kawaida na kwa uwazi kuwa “ninawaambia,” huku kiwakilishi cha wingi ὑμῖν kikionyeshwa katika “-wa-”.
- source_word: αἰτεῖτε
  choice: ombeni
  rationale: Kitenzi αἰτέω hapa ni amri ya wingi yenye maana ya kuomba. “Ombeni” ni ya kawaida na inafaa katika muktadha wa sala, bila kulazimisha maana ya kurudia-rudia katika matini kuu.
- source_word: δοθήσεται ὑμῖν
  choice: nanyi mtapewa
  rationale: Muundo huu huhifadhi kauli tendwa ya ahadi na walengwa wake. Kiswahili kinaweza kumweka mpokeaji kama kiima cha kitenzi tendwa bila kutaja wazi kitu kitakachotolewa.
- source_word: ζητεῖτε
  choice: tafuteni
  rationale: “Tafuteni” huhifadhi upana wa ζητέω, iwe kutafuta kwa maana halisi au kwa maana pana ya kujitahidi kupata.
- source_word: εὑρήσετε
  choice: nanyi mtapata
  rationale: Katika mfuatano wa kutafuta na kupata, “mtapata” ni Kiswahili cha asili na hudumisha ahadi ya wakati ujao.
- source_word: κρούετε
  choice: bisheni
  rationale: κρούω hapa hurejelea kubisha mlangoni. “Bisheni” ni amri ya wingi iliyo wazi na ya kawaida.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: nanyi mtafunguliwa
  rationale: Muundo huu hudumisha kauli tendwa na hauongezi wazi nomino “mlango,” ambayo imeachwa kudokezwa katika Kigiriki baada ya “bisheni.” Ni msemo unaoeleweka katika muktadha wa kubisha mlangoni.
theological_decisions:
- issue: Hali ya vitenzi vya amri vya wakati wa sasa αἰτεῖτε, ζητεῖτε, κρούετε
  choice: 'Vimetafsiriwa kwa amri rahisi: “ombeni,” “tafuteni,” na “bisheni.”'
  alternative: “Endeleeni kuomba ... endeleeni kutafuta ... endeleeni kubisha.”
  rationale: Amri za wakati wa sasa katika Kigiriki zinaweza kudokeza tendo linaloendelea au linalorudiwa, lakini si lazima kila wakati zibainishe hilo. Matini kuu inaacha uwezekano huo wazi, na tanbihi inatoa tafsiri inayosisitiza kuendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa amri na ahadi umehifadhiwa kwa usambamba wa wazi; “nanyi” huendeleza mkazo wa καὶ katika kila jibu.
