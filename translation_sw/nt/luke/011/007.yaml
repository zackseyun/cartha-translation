base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: sw
  text: Naye, akiwa ndani, atajibu akisema, ‘Usinisumbue[a]. Mlango tayari umefungwa[b], na watoto wangu wako pamoja nami kitandani[c]. Siwezi kuamka nikakupa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usinisababishie taabu,” au “Usiendelee kunisumbua.” Nahau ya Kigiriki ina maana ya kumsababishia mtu taabu au usumbufu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mlango tayari umefungwa.” Kitenzi cha Kigiriki cha wakati timilifu kinaweza kukazia tendo lililokamilika (“umefungwa”) au hali yake ya sasa (“umefungwa tayari”).
    reason: lexical_alternative
  - marker: c
    text: “Kitandani” hapa humaanisha mahali pa pamoja pa kulala katika mazingira ya nyumba; hakumaanishi uhusiano wa kingono.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν
  choice: naye yule wa ndani
  rationale: Huhifadhi kiunganishi, rejeo la mtu huyo, na mahali alipo; ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba anajibu akiwa ndani.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: ajibu akisema
  rationale: Huhifadhi vitenzi vyote viwili vya usemi wa kisimulizi bila kufanya Kiswahili kuwa kizito.
- source_word: Μή μοι κόπους πάρεχε
  choice: Usinisumbue
  rationale: Ni tafsiri ya kawaida ya nahau inayomaanisha kumsababishia mtu taabu au usumbufu.
- source_word: ἡ θύρα κέκλεισται
  choice: Mlango tayari umefungwa
  rationale: Huwakilisha wakati timilifu wa Kigiriki, yaani tendo lililokamilika lenye hali inayoendelea sasa, bila kuongeza wazo la kufungwa kwa kufuli.
- source_word: τὰ παιδία μου
  choice: watoto wangu
  rationale: Ni tafsiri sahihi na isiyoainisha umri kwa undani usiotolewa na muktadha.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: wamo pamoja nami kitandani
  rationale: Hueleza mahali pa pamoja pa kulala katika nyumba, huku ikiepuka mpangilio unaoweza kusikika wenye utata usiokusudiwa.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Siwezi kuamka nikakupa
  rationale: Huhifadhi kutokuweza, tendo la kwanza la kuamka, na utoaji wenye mtendewa lakini kitu kinachotolewa kikiachwa wazi kama kilivyo katika Kigiriki.
