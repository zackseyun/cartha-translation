base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: sw
  text: Ndipo mmoja wa wataalamu wa Sheria[a] akamjibu, “Mwalimu, kwa kusema mambo haya, unatutukana[b] sisi pia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmoja wa wajuzi wa Sheria.” Neno la Kigiriki linamaanisha wataalamu wa Sheria ya Kiyahudi, si lazima mawakili kwa maana ya taaluma ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au “unatutendea kwa dharau.” Kitenzi hiki kinaweza kumaanisha kutukana au kufedhehesha, si kuudhi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Ndipo ... akamjibu
  rationale: Muundo huu unatoa kwa Kiswahili cha masimulizi maendeleo mepesi yanayoonyeshwa na δέ pamoja na tendo la kujibu linaloonyeshwa na Ἀποκριθείς, bila kulifanya kuwa tofauti kali.
- source_word: τις τῶν νομικῶν
  choice: mmoja wa wataalamu wa Sheria
  rationale: νομικός hapa ni mtaalamu wa Sheria ya Kiyahudi, si lazima wakili wa kisasa. Neno “Sheria” limeandikwa kwa herufi kubwa ili kuonyesha Sheria ya Musa katika muktadha huu.
- source_word: λέγει αὐτῷ
  choice: akamjibu
  rationale: Wakati uliopo wa kihistoria λέγει umetafsiriwa kwa wakati wa masimulizi wa Kiswahili. Kitenzi hiki kimeunganishwa kwa kawaida na Ἀποκριθείς ili kuepuka urudiaji usio wa lazima wa “akajibu akamwambia.”
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ni neno la kawaida na lenye heshima la kumwita mtu anayefundisha, bila kuingiza maana za kijamii zisizo za lazima.
- source_word: ταῦτα λέγων
  choice: kwa kusema mambo haya
  rationale: Huhifadhi uhusiano wa moja kwa moja kati ya maneno ambayo Yesu amesema na dai la msemaji.
- source_word: καὶ ἡμᾶς
  choice: sisi pia
  rationale: “Pia” huhifadhi maana ya kuwaongeza wataalamu wa Sheria kwa wale ambao tayari wameguswa na maneno hayo; “sisi” inasisitiza kiwakilishi kama ilivyo katika Kigiriki.
- source_word: ὑβρίζεις
  choice: unatutukana
  rationale: Kitenzi hiki huonyesha kutukana, kufedhehesha, au kumtendea mtu kwa dharau. “Unatutukana” ni cha moja kwa moja na chenye nguvu kuliko “unatuudhi.”
theological_decisions: []
