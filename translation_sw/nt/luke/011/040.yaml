  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: sw
  text: Wapumbavu! Je, aliyetengeneza kilicho nje hakutengeneza pia kilicho ndani?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nje ... ndani.” Maneno haya yanaweza kurejelea nje na ndani ya chombo katika muktadha wa karibu na, kwa upana zaidi, hali ya nje na ya ndani ya mwanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Wapumbavu!
  rationale: Ni kivumishi cha wingi kilichotumiwa kama nomino katika kauli ya moja kwa moja ya kukemea. “Wapumbavu!” ni ya kawaida, yenye nguvu, na haiiongezei Kigiriki maneno yasiyokuwamo.
- source_word: οὐχ ... ἐποίησεν;
  choice: Je, ... hakutengeneza ...?
  rationale: Swali lenye kikanushi linatarajia jibu la kukubali. Muundo wa “Je, ... haku- ...?” unahifadhi nguvu hiyo ya swali la balagha katika Kiswahili.
- source_word: ὁ ποιήσας
  choice: aliyetengeneza
  rationale: Kirai hiki kinamtaja mtendaji bila kumtaja wazi kuwa Mungu. “Aliyetengeneza” kinafaa kwa mfano wa chombo katika muktadha na bado hakizuii dokezo pana kuhusu Muumba.
- source_word: τὸ ἔξωθεν
  choice: upande wa nje
  rationale: Hutaja sehemu au hali ya nje. Chaguo hili linaeleweka kwa chombo kinachozungumziwa na pia linaweza kupanuliwa kuelekea maisha ya nje ya mwanadamu.
- source_word: τὸ ἔσωθεν
  choice: upande wa ndani
  rationale: Ni sambamba na “upande wa nje” na huhifadhi tofauti kati ya nje na ndani bila kufafanua kupita kiasi ikiwa ni chombo au hali ya ndani ya mtu.
- source_word: καὶ
  choice: pia
  rationale: Katika swali hili, “pia” huonyesha hoja kwamba aliyetengeneza upande mmoja alitengeneza na mwingine, huku ikitoa Kiswahili cha kawaida.
theological_decisions:
- issue: Anayerejelewa na “aliyetengeneza”
  choice: Mhusika ameachwa bila kutajwa wazi, kama katika Kigiriki, huku dokezo la Mungu aliye Muumba likibaki.
  alternative: Kutafsiri wazi “Mungu aliyeumba” au kuifanya kauli imrejelee tu mtengenezaji wa chombo.
  rationale: Kauli inafanya kazi katika mfano wa kikombe au sahani na pia inadokeza ukweli mpana kwamba Mungu ndiye mwenye nje na ndani. Kutomtaja Mungu moja kwa moja kunahifadhi upana na mvutano wa matini chanzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kukemea kumebaki kwa nguvu, na swali la balagha limetolewa kwa muundo wa kawaida wa Kiswahili. Alama ya tanbihi [a] ipo katika matini kuu.
