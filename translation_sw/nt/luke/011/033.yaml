  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: sw
  text: Hakuna mtu ambaye, baada ya kuwasha taa, huiweka mahali palipofichika[a] au chini ya chombo cha kupimia[b], bali huiweka juu ya kinara cha taa, ili wanaoingia waione nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika chumba cha chini” au “mahali pa siri”; neno la Kigiriki κρύπτη linaweza kumaanisha mahali palipofichika, kutia ndani eneo la kuhifadhia vitu chini ya ardhi.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki μόδιος, kipimo cha vitu vikavu; kwa upanuzi linaweza kumaanisha chombo kilichotumiwa kupimia. Kwa desturi hutafsiriwa “bushel” au “kikapu cha bushel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Hakuna mtu
  rationale: Ni njia ya kawaida na ya wazi ya Kiswahili ya kuwasilisha ukanushaji wa jumla unaomaanisha kwamba hakuna yeyote.
- source_word: λύχνον
  choice: taa
  rationale: Neno hili linamaanisha taa ndogo, kwa kawaida ya mafuta, si mshumaa hasa; “taa” ni neno sahihi na linaloeleweka kwa urahisi.
- source_word: ἅψας
  choice: baada ya kuwasha
  rationale: Kirai cha wakati uliopita kinatangulia kitendo kikuu; tafsiri hii inaonyesha wazi mfuatano wa kuwasha kisha kuweka.
- source_word: εἰς κρύπτην
  choice: mahali palipofichika
  rationale: κρύπτη linaweza kumaanisha mahali pa siri au chumba cha chini; hapa wazo kuu ni kuificha taa, hivyo tafsiri pana inalinda maana bila kubainisha aina ya jengo.
- source_word: τίθησιν
  choice: huiweka
  rationale: Kitenzi hiki huonyesha kitendo cha kuweka; kiambishi “hu-” kinafaa kwa kauli ya jambo linalofanywa kwa kawaida.
- source_word: ὑπὸ τὸν μόδιον
  choice: chini ya kikapu cha kupimia
  rationale: μόδιος ni kipimo cha vitu vikavu na pia chombo kilichotumiwa kupimia. Tafsiri hii inaonyesha kuwa ni chombo na pia kazi yake, bila kutumia kipimo cha kigeni cha “bushel”.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: juu ya kinara cha taa
  rationale: λυχνία ni kinara au mahali maalumu pa kuiwekea taa; kirai hiki ni cha kawaida na sahihi katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi la kitendo; “ili” linahifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: οἱ εἰσπορευόμενοι
  choice: wanaoingia
  rationale: Kirai hiki kinawataja watu wanaoingia; “wanaoingia” ni tafsiri fupi na ya asili.
- source_word: τὸ φέγγος
  choice: nuru
  rationale: φέγγος ni mwanga au mng’ao. “Nuru” inafaa katika taswira hii ya taa na ina mtindo wenye hadhi.
- source_word: βλέπωσιν
  choice: waione
  rationale: Hali tegemezi baada ya ἵνα inaonyesha kusudi; “ili ... waione” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya κρύπτη
  choice: mahali palipofichika
  alternative: chumba cha chini; ghala la chini; mahali pa siri
  rationale: Nguvu ya msemo iko katika kutofaa kwa kuificha nuru, si katika muundo maalumu wa mahali; tafsiri pana inahifadhi taswira na utata wa neno la Kigiriki.
- issue: Maana ya μόδιος
  choice: kikapu cha kupimia
  alternative: chombo cha kupimia; pishi
  rationale: Neno la Kigiriki linataja kipimo cha vitu vikavu na chombo chake. Tafsiri iliyochaguliwa inaeleweka na msomaji wa sasa huku ikihifadhi kazi ya chombo hicho; maelezo ya ziada yamewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wazi na wenye hadhi. Muundo wa sentensi umehifadhi mantiki ya msemo wa Kigiriki, huku “hu-” ikionyesha kauli ya jambo la kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
