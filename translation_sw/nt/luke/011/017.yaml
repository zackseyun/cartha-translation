  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: sw
  text: Lakini yeye, akijua mawazo yao, akawaambia, “Kila ufalme uliogawanyika dhidi yake yenyewe huachwa ukiwa, na nyumba huangukia nyumba.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kaya huangukia kaya.” Neno la Kigiriki οἶκος linaweza kumaanisha nyumba ya kujengwa au kaya/jamaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Kitenzi hiki hapa kinaonyesha ufahamu wa mawazo ya ndani; muundo wa ‘aki-’ unadumisha uhusiano wa kisarufi na kitenzi kikuu.
- source_word: διανοήματα
  choice: mawazo
  rationale: Neno hili linahusu fikira au mijadala ya moyoni bila kulazimisha maana ya nia mbaya.
- source_word: Πᾶσα βασιλεία
  choice: Kila ufalme
  rationale: ‘Kila’ inadumisha maana ya jumla na ya kugawa ya πᾶσα.
- source_word: ἐφ’ ἑαυτὴν
  choice: dhidi yake wenyewe
  rationale: Katika msemo huu, kirai kinaonyesha upinzani wa ndani, si uhusiano wa mahali tu.
- source_word: διαμερισθεῖσα
  choice: uliogawanyika
  rationale: Hueleza ufalme uliopasuliwa kwa migawanyiko ya ndani na hudumisha umbo la kishirikishi.
- source_word: ἐρημοῦται
  choice: huangamizwa
  rationale: Hutoa wazo la kufanywa ukiwa au kuharibiwa vibaya, huku ikidumisha hali ya kutendwa.
- source_word: οἶκος ἐπὶ οἶκον
  choice: nyumba huangukia nyumba nyingine
  rationale: Tafsiri hii inadumisha picha halisi na iliyobanwa ya nyumba moja kuiangukia nyingine, huku tanbihi ikihifadhi uwezekano wa maana ya kaya au jamaa.
- source_word: πίπτει
  choice: huangukia
  rationale: Kitenzi hiki kinadumisha picha ya kuanguka na kihusishi kinaonyesha mwelekeo wa ἐπί pamoja na hali ya kushutumu.
theological_decisions:
- issue: Maana ya οἶκος katika sehemu ya pili ya methali
  choice: nyumba
  alternative: kaya au jamaa
  rationale: οἶκος halazimishi maana ya kijamii hapa. ‘Nyumba’ huhifadhi picha halisi na utata wa msemo, huku maana ya kaya au jamaa ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kimethali na ukali wa matokeo umehifadhiwa; utata wa οἶκος haujaondolewa kimyakimya.
