  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: sw
  text: Kwa hiyo, jihadhari ili nuru iliyo ndani yako isiwe giza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκόπει
  choice: jihadhari
  rationale: Kitenzi cha amri katika wakati uliopo kinatoa onyo la kuwa macho kwa kuendelea. ‘Jihadhari’ ni Kiswahili cha kawaida na chenye uzito wa onyo, bila kuifanya kauli kuwa maelezo tu ya kutazama.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mafundisho yaliyotangulia kuhusu jicho na nuru.
- source_word: μὴ
  choice: ili ... isiwe
  rationale: Baada ya amri, μή huleta onyo kuhusu hali isiyofaa inayopaswa kuepukwa. Muundo huu ni wa asili katika Kiswahili na huhifadhi nguvu ya tahadhari.
- source_word: τὸ φῶς
  choice: nuru
  rationale: Huhifadhi taswira halisi ya nuru na utofauti wake na giza bila kuibana kuwa ufahamu, dhamiri, au hali ya kiroho pekee.
- source_word: τὸ ἐν σοὶ
  choice: iliyo ndani yako
  rationale: Ni tafsiri ya asili ya kirai hiki na huacha taswira hiyo ikiwa wazi bila kuifafanua kupita kiasi.
- source_word: σκότος
  choice: giza
  rationale: Huhifadhi moja kwa moja utofauti wa kimfano kati ya nuru na giza katika muktadha.
- source_word: ἐστίν
  choice: iwe
  rationale: Kiswahili hutumia hali ya utegemezi baada ya ‘ili ... isi-’; hivyo ‘isiwe’ huwasilisha kwa kawaida na kwa usahihi onyo la Kigiriki.
theological_decisions:
- issue: Maana ya kimfano ya ‘nuru’ na ‘giza’
  choice: Kuhifadhi sitiari katika matini bila kuainisha nuru kuwa ufahamu, dhamiri, au hali ya kiroho pekee.
  alternative: Kufafanua kama ‘ufahamu ulio ndani yako,’ ‘nuru yako ya ndani,’ au ‘dhamiri yako.’
  rationale: Kauli ya Yesu inaendelea na taswira pana ya kuona na hali ya ndani katika muktadha uliotangulia. Ufafanuzi mahsusi ungeingiza tafsiri ambayo Kigiriki hakitamki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa kuonya, sambamba na Kigiriki.
