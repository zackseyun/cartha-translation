  text: ἐνεδρεύοντες ⸀αὐτὸν θηρεῦσαί τι ἐκ τοῦ στόματος ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/054.yaml
  text: lying in wait for him[c][b][a], to catch something from his mouth.
translation:
  language: sw
  text: wakimvizia[a] ili wanase jambo fulani kutoka kinywani mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimngojea kwa siri ili wamtege.”
    reason: lexical_alternative
  - marker: b
    text: Maana yake ni kunasa jambo fulani alilosema ili walitumie dhidi yake.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: wakimvizia
  rationale: Kitenzi ‘kuvizia’ kinaonyesha kusubiri kwa siri kwa nia ya kumtega au kumdhuru, na hivyo kinahifadhi uzito wa uhasama katika neno la Kigiriki.
- source_word: αὐτόν
  choice: -m- katika ‘wakimvizia’
  rationale: Kiwakilishi cha yambwa kinarejelea Yesu na kwa kawaida huambatanishwa na kitenzi katika Kiswahili.
- source_word: θηρεῦσαί
  choice: ili wanase
  rationale: ‘Kunasa’ hudumisha picha ya uwindaji au mtego iliyomo katika kitenzi cha Kigiriki, huku ikieleweka hapa kuwa walitaka kushika neno ambalo wangeweza kulitumia dhidi yake.
- source_word: τι
  choice: jambo fulani
  rationale: 'Huwakilisha kiwakilishi kisichodhihirisha kitu maalumu: walitafuta kauli yoyote ambayo ingeweza kuwafaa.'
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: kutoka kinywani mwake
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kigiriki ya maneno kutoka kinywani, bila kuibadili moja kwa moja kuwa ufafanuzi ‘kutokana na yale aliyosema.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa na yenye heshima. ‘Wakimvizia’ na ‘wanase’ zinahifadhi taswira ya uhasama na mtego, huku tanbihi ikifafanua nahau ya ‘kutoka kinywani mwake.’
