  source_fidelity: “Wakimvizia” accurately renders ἐνεδρεύοντες with its hostile, covert sense and incorporates the object αὐτόν. “Ili wanase jambo fulani kutoka kinywani mwake” preserves the purpose infinitive θηρεῦσαι, the indefiniteness of τι, and the concrete wording ἐκ τοῦ στόματος αὐτοῦ without unnecessarily paraphrasing it as merely what he said.
  naturalness: The wording is clear, grammatical Standard East African Swahili, and suitably concise for the narrative context. “Kunasa jambo ... kutoka kinywani mwake” is deliberately concrete but remains understandable; the explanatory note supplies the idiomatic force.
  terminology: The vocabulary is modern and appropriately formal. “Kuvizia” and “kunasa” preserve the linked imagery of lurking and trapping. The notes use natural Swahili and do not impose an interpretive or doctrinal claim.
