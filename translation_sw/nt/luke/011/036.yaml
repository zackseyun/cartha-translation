id: LUK.11.36
reference: Luke 11:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: sw
  text: Kwa hiyo, ikiwa mwili wako wote una nuru, bila kuwa na sehemu yoyote yenye giza, utakuwa na nuru kabisa, kama vile taa inapokuangazia kwa mwangaza wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama vile taa inapokuangazia kwa mmweko wake.” Neno la Kigiriki linaweza kumaanisha mmweko au mwangaza; hapa yaelekea linarejelea kung'aa kwa taa, si radi halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: mwili
  rationale: Neno la Kigiriki humaanisha kihalisi ‘mwili.’ Hapa linatumika katika picha inayohusu hali ya mtu, lakini ‘mwili’ huhifadhi taswira ya jicho, taa, nuru na giza katika muktadha.
- source_word: ὅλον
  choice: wote
  rationale: Limetumika mara mbili kusisitiza ukamilifu; ‘wote’ ni la kawaida na huhifadhi msisitizo huo.
- source_word: φωτεινόν
  choice: umejaa nuru
  rationale: Ingawa linaweza kutafsiriwa ‘wenye kung'aa,’ usemi huu unaeleweka kwa urahisi na unaonyesha wazi hali inayotofautishwa na sehemu yenye giza.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: bila kuwa na sehemu yoyote yenye giza
  rationale: Huhifadhi picha halisi ya sehemu ya mwili iliyo gizani huku ikitoa Kiswahili cha kawaida.
- source_word: ἔσται φωτεινὸν ὅλον
  choice: mwili huo wote utajaa nuru
  rationale: Nomino ‘mwili’ imerudiwa kwa uwazi wa rejeo katika Kiswahili, na wakati ujao wa ἔσται umehifadhiwa.
- source_word: ὡς ὅταν
  choice: kama vile ... inapo-
  rationale: Huleta ulinganisho wa wakati kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: λύχνος
  choice: taa
  rationale: Ni taa inayotoa mwanga, wala si nuru kama dhana au kinara cha taa.
- source_word: τῇ ἀστραπῇ
  choice: kwa mwangaza wake
  rationale: ἀστραπή inaweza kumaanisha mmweko au mwangaza. Kwa kuwa taa ndiyo kiima, ‘mwangaza wake’ hueleza vizuri namna taa inavyoangaza bila kudokeza lazima radi halisi.
- source_word: φωτίζῃ σε
  choice: inapokuangazia
  rationale: Huhifadhi maana ya kutoa nuru na pia yambwa ya nafsi ya pili σε (‘wewe’) kwa lugha ya kawaida.
theological_decisions:
- issue: Nguvu ya sitiari ya ‘mwili’ na ‘nuru’
  choice: Kuhifadhi taswira ya mwili, nuru na giza bila kuifafanua kuwa fundisho kuhusu roho au hali ya maadili.
  alternative: Kutafsiri ‘mwili’ kama ‘utu wako wote’ au ‘maisha yako ya ndani.’
  rationale: Muktadha unaunganisha mstari huu na jicho kama taa ya mwili. Kuhifadhi taswira huacha wazi mvutano na upana wa maana uliomo katika kauli ya Yesu.
- issue: Muundo wa sharti εἰ οὖν
  choice: ‘Kwa hiyo, ikiwa’
  alternative: 'Kuitafsiri kama hitimisho la uhakika: ‘Basi, mwili wako wote ukiwa...’'
  rationale: ‘Ikiwa’ huhifadhi wazi sharti la Kigiriki, huku ‘kwa hiyo’ ikionyesha uhusiano wa kimantiki na yaliyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wazi bila kuondoa urudiaji wa ‘wote’ wala taswira halisi ya mwili, nuru, giza na taa.
