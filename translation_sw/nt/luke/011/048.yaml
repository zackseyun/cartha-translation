  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: sw
  text: Kwa hiyo, ninyi ni mashahidi na mnakubaliana na matendo ya baba zenu, kwa sababu wao waliwaua, lakini ninyi mnajenga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mnajenga makaburi ya manabii, kama ilivyosemwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na shtaka la mstari uliotangulia kwa Kiswahili cha kawaida na chenye uzito.
- source_word: μάρτυρές ἐστε
  choice: ninyi ni mashahidi
  rationale: Inahifadhi muundo wa nomino wa Kigiriki na wazo kwamba matendo yao yanawafanya kuwa mashahidi dhidi yao wenyewe.
- source_word: συνευδοκεῖτε
  choice: mnakubaliana na
  rationale: Katika muktadha huu kitenzi kinaonyesha kukubali au kuunga mkono kwa ridhaa matendo ya mababu; usemi huu ni wa asili bila kuongeza wazo la furaha ambalo si lazima.
- source_word: τοῖς ἔργοις
  choice: matendo
  rationale: Neno hili linaeleza vitendo halisi vyenye uzito wa kimaadili vizuri kuliko 'kazi'.
- source_word: τῶν πατέρων ὑμῶν
  choice: ya baba zenu
  rationale: Inahifadhi taswira ya kifamilia na nguvu ya kimjadala ya 'baba' katika chanzo, badala ya kuifanya kwa ujumla kuwa 'mababu'.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha wazi msingi unaofafanua shtaka.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: wao waliwaua
  rationale: Viwakilishi vinadumisha mkazo na utofautishaji kati ya baba zao na wasikilizaji wa sasa; warejelewa wa 'wa-' wanaeleweka kutoka muktadha kuwa manabii.
- source_word: ὑμεῖς δὲ
  choice: lakini ninyi
  rationale: Inahifadhi utofautishaji wenye mkazo kati ya mauaji ya kizazi kilichopita na ujenzi wa kizazi cha sasa.
- source_word: οἰκοδομεῖτε
  choice: mnajenga makaburi yao
  rationale: Kitenzi chenyewe ni 'mnajenga,' lakini yambwa 'makaburi yao' linapatikana wazi katika mstari uliotangulia; kulitia hapa kunakamilisha maana kwa Kiswahili cha asili huku tanbihi ikibainisha kuwa limetolewa katika muktadha.
theological_decisions:
- issue: Iwapo yambwa linaloeleweka la οἰκοδομεῖτε litajwe wazi
  choice: Kutaja 'makaburi yao' katika matini kuu
  alternative: Kuacha 'lakini ninyi mnajenga' bila yambwa
  rationale: Kigiriki kinaacha yambwa lieleweke kutokana na mstari wa 47. Kiswahili 'mnajenga' peke yake husikika pungufu zaidi; kutaja makaburi kunawasilisha rejeo la karibu bila kubadili hoja, huku tanbihi ikidumisha uwazi kuhusu hali ya matini chanzo.
- issue: Uhusiano kati ya ushuhuda na kukubaliana na matendo ya baba zao
  choice: 'Kudumisha viambajengo vyote viwili: ''ni mashahidi na mnakubaliana'''
  alternative: Kuyachanganya kuwa 'mnashuhudia kwamba mnakubaliana'
  rationale: Muundo wa Kigiriki unaweza kubeba mvutano wa kuwa mashahidi na pia kukubaliana. Tafsiri haifanyi kimoja kuwa maelezo ya lazima ya kingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ninyi' na 'wao' zimetumiwa kwa mkazo unaolingana na viwakilishi vya Kigiriki; sentensi imebaki ya moja kwa moja na yenye nguvu ya lawama.
