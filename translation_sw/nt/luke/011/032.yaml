id: LUK.11.32
reference: Luke 11:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: sw
  text: Wanaume wa Ninawi watafufuka wakati wa hukumu pamoja na kizazi hiki, nao watakihukumu kuwa na hatia, kwa sababu walitubu kwa kuitikia mahubiri ya Yona; na tazama, kikubwa kuliko Yona kipo hapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye mkuu kuliko Yona yupo hapa,” au, “zaidi ya Yona ipo hapa.” Kigiriki kinatumia umbo lisilo la kiume wala kike (“kikubwa/zaidi”), ambalo huenda likaelekeza kwa upana kwenye uhalisi mkuu uliopo katika Yesu na huduma yake, wala si ulinganisho wa mtu mmoja tu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Watu wa kiume wa Ninawi
  rationale: ἄνδρες ni nomino ya kiume katika wingi, na Νινευῖται huwatambulisha kuwa watu wa Ninawi; tafsiri hii inahifadhi rejeo la kiume kwa Kiswahili cha kawaida zaidi kuliko 'wanaume wa Kininawi'.
- source_word: ἀναστήσονται
  choice: watafufuka
  rationale: Katika muktadha wa hukumu ya mwisho, kitenzi kinaashiria kuinuka kwa wafu; 'watafufuka' ni cha asili na wazi kwa Kiswahili, bila kuondoa mazingira ya kisheria yanayofuata.
- source_word: ἐν τῇ κρίσει
  choice: wakati wa hukumu
  rationale: Kirai hiki kinataja tukio la hukumu; 'wakati wa hukumu' ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pamoja na kizazi hiki
  rationale: μετά pamoja na jenitivi huonyesha ushirika; 'pamoja na' huwasilisha maana hiyo kwa uwazi.
- source_word: κατακρινοῦσιν αὐτήν
  choice: watakihukumu kuwa na hatia
  rationale: κατακρίνω ni kuhukumu kwa kutoa uamuzi wa hatia, si kuhukumu tu; kiambishi -ki- kinarejelea 'kizazi hiki'.
- source_word: μετενόησαν
  choice: walitubu
  rationale: Katika muktadha wa ujumbe wa kinabii, μετανοέω huonyesha toba ya kimaadili na kiroho, si kubadili mawazo tu.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: waliposikia mahubiri ya Yona
  rationale: εἰς hapa huonyesha kwamba toba ilitokea kwa kuitikia ujumbe wa Yona; 'waliposikia' huwasilisha uhusiano huo kwa Kiswahili cha asili bila kudai kwamba kusikia pekee ndiko kulikokusudiwa.
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: Huhimiza msomaji atilie mkazo jambo linalofuata na huhifadhi nguvu ya balagha ya ἰδού.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: kilicho kikubwa kuliko Yona kipo hapa
  rationale: πλεῖον ni umbo la kijinsia lisilo la kiume wala kike; 'kilicho kikubwa' huhifadhi upana huo badala ya kulifanya moja kwa moja kuwa 'aliye mkuu,' huku kikielekeza kwenye uhalisi mkuu uliopo hapa.
theological_decisions:
- issue: Rejeo na nguvu ya πλεῖον Ἰωνᾶ
  choice: kilicho kikubwa kuliko Yona kipo hapa
  alternative: aliye mkuu kuliko Yona yupo hapa; zaidi ya Yona ipo hapa
  rationale: Tafsiri inadumisha umbo lisilo la kiume wala kike la πλεῖον na hivyo haifungi kauli kwa ulinganisho wa mtu pekee. Yesu yuko katika mtazamo, lakini maneno yanaweza kujumuisha pia uwepo na huduma yake pamoja na uhalisi mkuu wa ufalme unaofunuliwa ndani yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Watu wa kiume wa Ninawi' huhifadhi alama ya kiume ya chanzo; 'watakihukumu kuwa na hatia' huweka wazi nguvu ya κατακρίνω. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohitaji ufafanuzi.
