  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: sw
  text: tangu damu ya Habili mpaka damu ya Zekaria[b], aliyeangamia kati ya madhabahu na hekalu[a]. Naam, nawaambia, damu hiyo itadaiwa kutoka kwa kizazi hiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki halisi: ‘kati ya madhabahu na nyumba.’ Hapa ‘nyumba’ inarejelea jengo la hekalu.'
    reason: lexical_alternative
  - marker: b
    text: Haijulikani kwa hakika ni Zekaria yupi anayetajwa hapa. Huenda ni Zekaria mwana wa Yehoyada (2 Mambo ya Nyakati 24:20–22) au Zekaria mwana wa Berekia.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: tangu damu ya Habili mpaka damu ya Zekaria
  rationale: Inahifadhi muundo wa balagha wa kutoka mwanzo mmoja hadi mwisho mwingine, huku ‘damu’ ikibeba maana ya umwagaji damu na hatia inayohusiana nao.
- source_word: τοῦ ἀπολομένου
  choice: aliyeangamia
  rationale: Kitenzi hiki hakitaji wazi mtendaji wa mauaji; ‘aliyeangamia’ kinahifadhi hali hiyo bila kuficha muktadha wa kifo cha vurugu.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: kati ya madhabahu na hekalu
  rationale: Ingawa οἶκος kwa kawaida ni ‘nyumba,’ katika muktadha huu inarejelea jengo la hekalu. ‘Hekalu’ ni wazi na ya kawaida kwa msomaji wa Kiswahili, huku tafsiri halisi ikielezwa katika tanbihi.
- source_word: ναί, λέγω ὑμῖν
  choice: Naam, nawaambia
  rationale: ‘Naam’ linaonyesha uthibitisho wenye mkazo na uzito, na ‘nawaambia’ ni Kiswahili cha kawaida kinacholingana na usemi wa Kigiriki.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: damu hiyo itadaiwa kutoka kwa kizazi hiki
  rationale: ‘Itadaiwa’ linahifadhi kauli tendwa na wazo la kuwajibishwa katika hukumu. ‘Damu hiyo’ huweka wazi rejeo linaloeleweka katika Kiswahili bila kumtaja moja kwa moja mwenye kudai.
theological_decisions:
- issue: Utambulisho wa Zekaria na upeo wa lawama kwa ‘kizazi hiki’
  choice: Zekaria hatajwi kwa utambulisho wa ziada, na ‘kizazi hiki’ linaachwa likirejelea kizazi kinachosemeshwa na Yesu.
  alternative: Kumtambulisha kuwa Zekaria mwana wa Yehoyada, Zekaria mwana wa Berekia, au shahidi wa kinabii anayewakilisha wengine.
  rationale: Andiko la Kigiriki halitoi utambulisho zaidi katika mstari huu. Tafsiri haipaswi kuamua mjadala huo wala kupanua au kupunguza maana ya ‘kizazi hiki’ kwa mfumo fulani wa kiteolojia.
- issue: Mhusika asiyeelezwa katika ἐκζητηθήσεται
  choice: Kauli tendwa ‘itadaiwa’ imedumishwa bila kumtaja Mungu moja kwa moja kama mdai.
  alternative: ‘Mungu atakidai kutoka kwa kizazi hiki.’
  rationale: Muktadha unaweza kudokeza hukumu ya Mungu, lakini Kigiriki hakimtaji mtendaji; kutomtaja kunahifadhi namna na mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Naam’ limetumiwa kwa tamko zito; ‘hekalu’ limechaguliwa kwa uwazi wa kimuktadha. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
