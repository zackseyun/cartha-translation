  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: sw
  text: Lakini ikiwa mimi ninawatoa pepo kwa Beelzebuli, wana wenu wanawatoa kwa nani?[a] Kwa hiyo, wao wenyewe[b] watakuwa waamuzi wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kitu gani?” au “kwa uwezo gani?”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinakazia “wao”; yaani, “wao wenyewe watakuwa waamuzi wenu.”
    reason: lexical_emphasis
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: δέ inaendeleza hoja kwa utofautishaji wa kiasi; “Lakini ikiwa” ni ya asili katika Kiswahili na inalinda mwelekeo wa hoja.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kinadumishwa ili kuonyesha utofautishaji wa Yesu na “wana wenu.”
- source_word: ἐν Βεελζεβοὺλ
  choice: kwa Beelzebuli
  rationale: ἐν hapa inaonyesha wakala au njia. “Kwa” hudumisha maana hiyo bila kuongeza maneno ya kufasiri kama “kwa nguvu za.” Jina limetoholewa kwa namna inayosomeka katika Kiswahili.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ninawatoa pepo
  rationale: “Kutoa pepo” ni usemi wa kawaida na unaoeleweka katika Kiswahili kwa tendo la kuwafukuza viumbe wa kiroho waovu; unalinda maana ya muktadha wa kutoa pepo bila kugeuza pepo kuwa mvuto mwovu usio na utu.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: wana wenu
  rationale: Tafsiri hii inadumisha usemi halisi “wana wenu” badala ya kuamua kwamba ni wanafunzi, wafuasi, au Wayahudi wenzao.
- source_word: ἐν τίνι
  choice: kwa nani
  rationale: Katika ulinganisho na Beelzebuli, swali la wakala binafsi “kwa nani” linafaa zaidi. Uwezekano wa kuuliza njia au nguvu unawekwa katika tanbihi.
- source_word: ἐκβάλλουσιν
  choice: wanawatoa
  rationale: Kitenzi kilekile kinarudiwa ili kuhifadhi uwiano wa hoja; kitu kinachotolewa, yaani pepo, kinaeleweka kutokana na kishazi kilichotangulia.
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha kawaida na kifupi kinachoonyesha hitimisho linalotokana na swali la balagha.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: wao wenyewe watakuwa waamuzi wenu
  rationale: “Wao wenyewe” inadumisha mkazo wa αὐτοί, na “waamuzi wenu” hudumisha muundo na maana ya predicate ya Kigiriki.
theological_decisions:
- issue: Utambulisho wa “wana wenu”
  choice: Kudumisha “wana wenu” bila kuwafafanua zaidi
  alternative: wafuasi wenu; wanafunzi wenu; Wayahudi wenzenu
  rationale: Kigiriki kinasema kihalisi “wana wenu.” Tafsiri kuu haipaswi kutatua kimya kimya utambulisho wao ambao kifungu hakielezi wazi.
- issue: Wakala au uwezo katika ἐν τίνι
  choice: kwa nani
  alternative: kwa kitu gani; kwa uwezo gani
  rationale: Muktadha unalinganisha na Beelzebuli, jina la binafsi, lakini umbo la Kigiriki linaweza pia kuuliza njia au uwezo; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutoa pepo” ni usemi wa kawaida katika muktadha wa kutoa pepo, huku “wana wenu” ikidumisha utata wa asili. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
