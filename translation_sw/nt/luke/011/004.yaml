base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: sw
  text: Na utusamehe dhambi zetu, kwa maana sisi wenyewe pia tunamsamehe kila mtu mwenye deni kwetu[a]. Wala usituingize katika jaribu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kila mtu anayetuwia deni; Kigiriki hapa kinatumia lugha ya deni, ingawa kishazi cha kwanza kinasema “dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika kujaribiwa” au “katika hali ya kupimwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: utusamehe
  rationale: Katika muktadha wa sala, kitenzi hiki kina maana ya kuondolea hatia au kusamehe; ‘utusamehe’ ni ombi la kawaida, la moja kwa moja, na lenye heshima katika Kiswahili.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: dhambi zetu
  rationale: Kigiriki hapa kinataja wazi ‘dhambi,’ si ‘madeni’; tafsiri hii inadumisha tofauti ya kimakusudi na lugha ya deni katika kishazi kinachofuata.
- source_word: καὶ γὰρ
  choice: kwa maana ... pia
  rationale: Muundo huu unatoa msingi wa ombi lililotangulia, huku ‘pia’ ikiwakilisha maana ya nyongeza inayopatikana katika mtiririko wa sentensi.
- source_word: αὐτοὶ
  choice: sisi wenyewe
  rationale: Kiwakilishi hiki kina mkazo; ‘sisi wenyewe’ kinautunza bila kufanya sentensi kuwa ngumu.
- source_word: ἀφίομεν
  choice: tunamsamehe
  rationale: ‘Kusamehe’ hudumisha uhusiano wa kitenzi na ‘utusamehe’ na kinafaa kwa uhusiano baina ya watu, ingawa nomino inayofuata inatumia lugha ya deni.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: kila mtu anayetuwia
  rationale: ‘Anayetuwia’ ni Kiswahili cha kawaida kinachohifadhi lugha ya kuwa na deni bila kuamua kwamba deni hilo ni la fedha pekee.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: wala usituingize katika majaribu
  rationale: ‘Usituingize’ hufuata maana ya kuleta au kuingiza ndani ya hali fulani. ‘Majaribu’ ni usemi wa asili katika Kiswahili na unaweza kubeba wigo wa kushawishiwa, kupimwa, au kupitia hali ngumu.
theological_decisions:
- issue: Maana ya ombi kuhusu πειρασμόν na tendo la Mungu
  choice: Wala usituingize katika majaribu
  alternative: Usitupeleke kwenye majaribu; usituingize katika kujaribiwa
  rationale: Tafsiri inadumisha namna ombi lilivyosemwa katika Kigiriki bila kulainisha au kutatua mvutano wa kiteolojia kuhusu uhusiano wa Mungu na majaribu.
- issue: Uhusiano kati ya dhambi na deni
  choice: Kutafsiri ἁμαρτίας kama ‘dhambi’ lakini ὀφείλοντι kwa lugha ya deni, ‘anayetuwia’
  alternative: Kusawazisha vishazi vyote kwa ‘makosa’ au ‘dhambi’
  rationale: Kigiriki chenyewe hubadili kutoka lugha ya dhambi kwenda lugha ya deni; tofauti hiyo ni ya maana na haipaswi kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. ‘Anayetuwia’ ni cha kawaida na hifadhi taswira ya deni; ‘majaribu’ hudumisha wigo na mvutano wa πειρασμός.
