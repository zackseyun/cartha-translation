  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: sw
  text: Ni baba gani miongoni mwenu ambaye mwanawe akimwomba samaki, atampa nyoka badala ya samaki?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Ni baba gani miongoni mwenu
  rationale: Huhifadhi nguvu ya swali la balagha na maana ya kuchagua baba yeyote miongoni mwa wasikilizaji, kwa Kiswahili cha kawaida.
- source_word: αἰτήσει
  choice: akimwomba
  rationale: Muundo wa masharti wenye “aki-” ni wa asili katika Kiswahili ndani ya swali hili la balagha; kiambishi cha yambwa “-mw-” kinaonyesha kwamba mwana anamwomba baba.
- source_word: ὁ υἱὸς
  choice: mwanawe
  rationale: Hufanya wazi uhusiano wa kawaida kati ya baba na mwana unaodokezwa na makala ya Kigiriki, bila kuongeza wazo jipya.
- source_word: ἰχθύν / ἰχθύος
  choice: samaki / samaki
  rationale: Nomino ya umoja imehifadhiwa, ingawa umbo la Kiswahili halibadiliki hapa.
- source_word: ἀντὶ
  choice: badala ya
  rationale: Hutoa kwa uwazi maana ya kitu kutolewa mahali pa kingine.
- source_word: ὄφιν
  choice: nyoka
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa ὄφις katika muktadha huu, bila kuingiza maana ya ziada ya kiishara.
- source_word: αὐτῷ ἐπιδώσει
  choice: atampa
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kumpa mwana kitu na huhifadhi wakati ujao wa swali la balagha.
theological_decisions: []
translation_notes:
