id: LUK.11.10
reference: Luke 11:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: sw
  text: Kwa maana kila anayeomba hupokea, anayetafuta hupata, na anayebisha atafunguliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi maana inayodokezwa na muktadha, “mlango utafunguliwa kwa anayebisha.” Kigiriki hakitaji kitu kinachofunguliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: kila
  rationale: Limetumiwa kwa maana ya kila mtu mmoja mmoja pamoja na kishiriki chenye maana ya nomino; muundo ‘kila anayeomba’ ni wa kawaida na unahifadhi upeo wa wote.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza na kuthibitisha himizo lililotangulia.
- source_word: ὁ αἰτῶν
  choice: anayeomba
  rationale: Kishiriki cha wakati uliopo kinamtaja kwa ujumla mtu anayefanya tendo la kuomba; Kiswahili hiki ni cha asili na hakiongezi mhusika wa kiume.
- source_word: λαμβάνει
  choice: hupokea
  rationale: ‘Kupokea’ linafaa katika muktadha wa ombi na jibu; hali ya mazoea ya ‘hu-’ inaakisi kauli ya jumla.
- source_word: ὁ ζητῶν
  choice: anayetafuta
  rationale: Linahifadhi tendo la jumla au linaloendelea la kutafuta katika mfuatano huu wa kimethali.
- source_word: εὑρίσκει
  choice: hupata
  rationale: Ni sawa ya moja kwa moja na ya kawaida katika Kiswahili, na inalingana na ‘kutafuta.’
- source_word: τῷ κρούοντι
  choice: anayebisha
  rationale: Nomino ya mtendaji inayotokana na kishiriki imetafsiriwa kwa kawaida kama mtu anayebisha; uhusiano wake na kitenzi tendwa unaonekana katika ‘atafunguliwa.’
- source_word: ἀνοιγήσεται
  choice: atafunguliwa
  rationale: Kitenzi ni cha wakati ujao na kauli tendwa. Kiswahili humruhusu mtu kusemwa kuwa amefunguliwa bila kutaja kitu kinachofunguliwa, hivyo sintofahamu ya Kigiriki inahifadhiwa.
theological_decisions:
- issue: Upeo na nguvu ya ahadi kwa wote
  choice: Kauli imetafsiriwa kama kanuni ya jumla inayowahusu wote bila kuongeza masharti.
  alternative: Kuifanya kuwa himizo la kutia chumvi au kuongeza masharti kama ‘anayeomba ipasavyo.’
  rationale: Kigiriki kinatoa kauli ya jumla isiyo na sharti lililotajwa katika muktadha wa maombi. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia bila kuuingizia masharti yasiyomo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘hu-’ katika vitenzi viwili vya kwanza unaonyesha ukweli wa jumla; wakati ujao wa ‘atafunguliwa’ unahifadhi umbo la kitenzi cha Kigiriki. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
