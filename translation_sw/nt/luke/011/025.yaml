  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: sw
  text: Nayo inapofika, huikuta ikiwa imefagiliwa na imepangwa vizuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imefagiliwa na imepambwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: inapofika
  rationale: Kirai cha wakati kinaeleza kurudi kwa roho chafu iliyotajwa katika mstari uliotangulia; ‘inapofika’ ni Kiswahili cha kawaida na huhifadhi uhusiano huo wa wakati.
- source_word: εὑρίσκει
  choice: huikuta
  rationale: Wakati uliopo wa Kigiriki una nguvu ya usimulizi. ‘Huikuta’ ni ya asili katika Kiswahili na kiambishi ‘-i-’ kinarejelea nyumba inayodokezwa na muktadha.
- source_word: σεσαρωμένον
  choice: imefagiliwa
  rationale: Hali timilifu ya kutendwa inaonyesha kwamba nyumba imekwisha fagiliwa na ipo katika hali hiyo. Tafsiri haiongezi neno ‘safi,’ ambalo halipo wazi katika Kigiriki.
- source_word: κεκοσμημένον
  choice: kupangwa vizuri
  rationale: Katika muktadha wa nyumba, kitenzi hiki kinaweza kumaanisha kuwekwa katika mpangilio unaofaa. ‘Kupangwa vizuri’ ni lugha ya sasa na ya kawaida, huku maana mbadala ya kupambwa ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kirejelewa cha yambwa iliyodokezwa
  choice: huikuta
  alternative: huikuta nyumba
  rationale: Kigiriki hakitaji yambwa moja kwa moja, lakini muktadha unaonyesha kuwa ni nyumba. Kiambishi cha yambwa ‘-i-’ huhifadhi ufupi huo bila kuongeza nomino katika maandishi.
- issue: Jinsi ya kuirejelea roho chafu
  choice: Nayo inapofika
  alternative: Naye anapofika
  rationale: ‘Nayo’ inarejelea roho chafu kwa upatanisho wa kawaida wa Kiswahili bila kuipa jinsia ya kibinadamu ambayo Kigiriki hailazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo ni mfupi kama Kigiriki, huku tanbihi ikihifadhi maana halisi mbadala ya κεκοσμημένον.
