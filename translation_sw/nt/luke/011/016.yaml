  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: sw
  text: Lakini wengine, wakimjaribu, walikuwa wakimwomba awape ishara kutoka mbinguni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι
  choice: wengine
  rationale: Neno hili linatofautisha kundi hili na watu waliotangulia kutajwa; “wengine” ni Kiswahili cha kawaida na wazi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji wa kiasi katika muktadha.
- source_word: πειράζοντες
  choice: wakimjaribu
  rationale: Katika muktadha huu maana ni kumweka Yesu katika jaribio kwa nia mbaya, si kumshawishi atende dhambi.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” huhifadhi maana ya msingi bila kuongeza wazi neno “muujiza,” ambalo linaeleweka kutokana na muktadha.
- source_word: ἐξ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Kirai hiki kinaonyesha chanzo au uthibitisho wa kimbingu na kinabaki na utata wake wa asili.
- source_word: ἐζήτουν
  choice: walimwomba
  rationale: Katika muundo huu kitenzi kina maana ya kudai au kuomba kitu; wakati usiotimilifu unaonyesha tendo lililoendelea, ambalo Kiswahili kinaweza kulieleza kwa wakati uliopita kulingana na muktadha.
- source_word: παρ’ αὐτοῦ
  choice: walimwomba awape
  rationale: Muundo huu unaonyesha kuwa Yesu ndiye aliyeombwa kutoa ishara; “awape” huwasilisha chanzo hicho kwa Kiswahili cha asili bila kurudia kwa ukakasi “kutoka kwake ... kutoka mbinguni.”
theological_decisions:
- issue: Asili ya ishara iliyoombwa
  choice: ishara kutoka mbinguni
  alternative: ishara ya kimbingu
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la chanzo au uthibitisho wa mbinguni bila kufafanua kupita kiasi aina ya ishara hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji huku ukihifadhi tofauti ya kundi, nia yao ya kumjaribu Yesu, na chanzo cha ishara waliyoomba.
