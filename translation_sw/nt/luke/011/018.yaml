id: LUK.11.18
reference: Luke 11:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: sw
  text: Lakini ikiwa Shetani pia amegawanyika dhidi yake mwenyewe, ufalme wake utasimamaje? Kwa maana mnasema kwamba ninawafukuza pepo kwa Beelzebuli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: Beelzebul; katika baadhi ya mapokeo jina hili huandikwa Beelzebubu.'
    reason: alternative_form
lexical_decisions:
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina au cheo hiki katika Kiswahili cha Biblia.
- source_word: ἐφ’ ἑαυτὸν
  choice: dhidi yake mwenyewe
  rationale: Katika muundo huu pamoja na διαμερίζω, kirai kinaonyesha upinzani wa ndani; tafsiri hii ni ya kawaida na hudumisha maana hiyo.
- source_word: διεμερίσθη
  choice: amegawanyika
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo la kugawanyika pamoja na hali inayotokana nalo katika hoja hii ya sharti.
- source_word: πῶς σταθήσεται
  choice: utasimamaje?
  rationale: Hudumisha sitiari ya kusimama na nguvu ya swali la balagha, likimaanisha kuendelea kuwapo au kudumu.
- source_word: βασιλεία
  choice: ufalme
  rationale: Ni tafsiri ya kawaida na inayofaa hapa kwa milki au eneo la utawala wa Shetani.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Huanzisha msingi wa hoja ya Yesu kwa kurejelea madai ya wasikilizaji wake.
- source_word: ἐν Βεελζεβοὺλ
  choice: kwa Beelzebuli
  rationale: ἐν hapa inaonyesha njia au wakala unaodaiwa; 'kwa' huwasilisha maana hiyo bila kuongeza maneno yasiyokuwamo wazi katika Kigiriki.
- source_word: Βεελζεβοὺλ
  choice: Beelzebuli
  rationale: Inafuata umbo la Kigiriki Βεελζεβούλ kwa tahajia na matamshi yanayokubalika katika Kiswahili.
- source_word: ἐκβάλλειν
  choice: ninawafukuza
  rationale: '''Kufukuza'' ni lugha ya asili ya Kiswahili kwa tendo la kutoa pepo, na kiambishi ''wa'' kinapatana na pepo wanaotajwa kama viumbe.'
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viumbe waovu wa kiroho katika muktadha huu; halipanui maana kuwa maelezo ya ziada.
theological_decisions:
- issue: Asili ya shtaka la wapinzani wa Yesu
  choice: Shtaka linasema Yesu anafukuza pepo kwa Beelzebuli.
  alternative: Shtaka linaweza kuelezwa kwa upanuzi kuwa anafanya hivyo kwa nguvu za Beelzebuli au kwa ushirika naye.
  rationale: Tafsiri inawasilisha shtaka moja kwa moja na kuacha namna kamili ya uwakala au matumizi ya nguvu bila ufafanuzi wa ziada, kama ilivyo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kiashiria cha tanbihi [a] kimewekwa baada ya jina linalohusika.
