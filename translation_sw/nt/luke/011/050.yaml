source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: sw
  text: ili damu ya manabii wote, iliyomwagwa tangu kuumbwa kwa ulimwengu, idaiwe[a] kutoka kwa kizazi hiki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kizazi hiki kiitishwe hesabu kwa damu hiyo.”
    reason: 'Njia nyingine ya kueleza maana ya kimahakama ya kitenzi: kuwajibishwa kwa damu iliyomwagwa.'
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayohusiana na muktadha uliotangulia, kwa namna ya kawaida katika Kiswahili.
- source_word: ἐκζητηθῇ
  choice: idaiwe
  rationale: Katika muktadha wa damu iliyomwagwa, kitenzi hiki kina maana ya kimahakama ya kuitisha hesabu au kuwajibisha. “Idaiwe” huhifadhi damu kuwa kiima cha sentensi na uzito wa hukumu.
- source_word: τὸ αἷμα
  choice: damu
  rationale: Tafsiri ya moja kwa moja imehifadhiwa; hapa damu inawakilisha pia hatia ya kuwaua manabii, lakini maana hiyo haijawekwa badala ya neno lenyewe.
- source_word: πάντων τῶν προφητῶν
  choice: ya manabii wote
  rationale: Huhifadhi muundo wa uhusiano na upeo kamili unaoonyeshwa na “wote.”
- source_word: τὸ ἐκκεχυμένον
  choice: iliyomwagwa
  rationale: Ni usemi wa kawaida wa Kiswahili kuhusu damu iliyomwagwa kwa mauaji na unaonyesha hali inayotokana na tendo lililokwisha kutokea.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuwekwa msingi wa ulimwengu
  rationale: Huhifadhi taswira ya Kigiriki ya msingi wa ulimwengu huku “tangu” ikionyesha vizuri mwanzo wa kipindi kinachozungumziwa.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: kutoka kwa kizazi hiki
  rationale: Huonyesha moja kwa moja upande ambao utatakiwa kutoa hesabu, bila kuongeza maelezo yasiyosemwa wazi katika mstari.
theological_decisions:
- issue: Maana ya kudaiwa kwa damu ya manabii
  choice: Kauli ya hukumu ambayo kwayo kizazi hiki kitaitishwa hesabu kwa damu iliyomwagwa ya manabii.
  alternative: Kauli ya kuonyesha tu mwendelezo wa kihistoria bila maana nzito ya kuwajibishwa.
  rationale: Katika muktadha wa damu iliyomwagwa, ἐκζητέω ina maana ya kuitisha hesabu. Tafsiri inadumisha maana hiyo bila kufafanua zaidi namna ya hatia ya pamoja kuliko mstari wenyewe unavyosema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka. Muundo wa “damu ... idaiwe kutoka kwa” ni wa kimakusudi ili kuhifadhi damu kuwa kiima kama ilivyo katika Kigiriki; tanbihi hufafanua maana ya kuwajibishwa.
