id: LUK.11.13
reference: Luke 11:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: sw
  text: Basi, ikiwa ninyi mlio waovu mnajua kuwapa watoto wenu zawadi njema, je, Baba wa mbinguni hatazidi sana kuwapa Roho Mtakatifu wale wanaomwomba?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri husema “Baba yenu wa mbinguni,” kwa kufuata Mathayo 7:11; lakini Kigiriki cha Luka hakina neno “wenu,” bali husema “Baba wa mbinguni.”
    reason: alternative_reading
  - marker: b
    text: Mathayo 7:11 ina “vitu vyema,” ilhali Luka hapa anasema “Roho Mtakatifu.” Hivyo kila Injili huhifadhi maneno yake mahsusi.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: ingawa ni waovu
  rationale: Muundo wa kirai elezi una maana ya kukubali hali inayotofautishwa na tendo jema; Kiswahili hiki ni cha kawaida na kinahifadhi tathmini ya maadili ya maandiko.
- source_word: οἴδατε ... διδόναι
  choice: mnajua kuwapa
  rationale: Muundo huu unaeleza ujuzi wa kufanya jambo, na “mnajua kuwapa” ni wa asili katika Kiswahili.
- source_word: δόματα ἀγαθὰ
  choice: zawadi njema
  rationale: δόματα humaanisha zawadi hasa, si vitu kwa ujumla; “njema” huhifadhi sifa ya ἀγαθὰ.
- source_word: τέκνοις ὑμῶν
  choice: watoto wenu
  rationale: Huu ndio usemi wa kawaida na sahihi katika muktadha wa familia.
- source_word: πόσῳ μᾶλλον
  choice: je, si zaidi sana
  rationale: Huwasilisha hoja ya kutoka jambo dogo kwenda jambo kubwa kwa namna ya swali la balagha linaloeleweka kwa Kiswahili.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Baba atokaye mbinguni
  rationale: Huhifadhi ἐξ, “kutoka,” na kutoongeza “yenu,” ambalo halipo katika Kigiriki cha Luka.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha huu ni Roho wa Mungu, si roho yoyote iliyo takatifu; umbo hili ni la kawaida na lenye heshima katika Kiswahili.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: wale wanaomwomba
  rationale: “Wanaomwomba” huhifadhi tendo linaloendelea au la kawaida pamoja na kiwakilishi cha wazi αὐτόν, “yeye.”
theological_decisions:
- issue: Rejeo la πνεῦμα ἅγιον
  choice: Roho Mtakatifu, yaani Roho wa Mungu binafsi
  alternative: roho takatifu isiyoainishwa
  rationale: Ingawa kirai hakina kibainishi katika Kigiriki, muktadha wa Luka unaelekeza kwa Roho wa Mungu ambaye Baba huwapa wanaomwomba.
- issue: Uhusiano na kifungu sambamba cha Mathayo 7:11
  choice: 'Kuhifadhi maneno mahsusi ya Luka: “Baba atokaye mbinguni” na “Roho Mtakatifu”'
  alternative: Kuyapatanisha na Mathayo kwa kusema “Baba yenu wa mbinguni” au “vitu vyema”
  rationale: Tafsiri inapaswa kufuata ushahidi wa maandishi ya Luka na kutofuta tofauti halisi kati ya Injili hizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limetumiwa kuwasilisha kwa kawaida nguvu ya πόσῳ μᾶλλον. “Atokaye mbinguni” ni rasmi kwa kiasi lakini linaeleweka na huhifadhi tofauti ya maneno ya Luka.
