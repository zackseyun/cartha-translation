id: LUK.11.1
reference: Luke 11:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: sw
  text: Ikawa alipokuwa akisali mahali fulani, alipomaliza, mmoja wa wanafunzi wake akamwambia, “Bwana, tufundishe kusali, kama vile Yohana pia alivyowafundisha wanafunzi wake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ikawa
  rationale: Ni kauli ya kawaida ya masimulizi inayotambulisha tukio jipya; “Ikawa” inadumisha kazi hiyo bila kutumia lugha ya kizamani.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: alipokuwa akisali
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huo; “alipokuwa akisali” ni Kiswahili cha kawaida na huhifadhi hali hiyo ya kuendelea.
- source_word: ἐν τόπῳ τινὶ
  choice: mahali fulani
  rationale: Huhifadhi kutotajwa kwa mahali hususa kulikomo katika neno τινί.
- source_word: ὡς ἐπαύσατο
  choice: alipomaliza
  rationale: Kitenzi kina maana ya kukoma au kuacha. Katika muktadha huu kinarejelea kumalizika kwa kusali; “alipomaliza” ni ya asili katika Kiswahili bila kudokeza kwamba aliacha ghafla.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: mmoja wa wanafunzi wake
  rationale: Hii ni tafsiri ya asili ya muundo wa sehemu unaomaanisha mwanafunzi mmoja miongoni mwa wanafunzi wake.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi heshima na upana wa maana ya cheo κύριος katika Agano Jipya bila kuipunguza kuwa “Mwalimu” pekee.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: tufundishe kusali
  rationale: Hufuata moja kwa moja muundo wa kitenzi na kitenzi-jina cha Kigiriki, bila kuongeza waziwazi wazo la “jinsi ya” ingawa linaweza kueleweka katika muktadha.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: kama vile Yohana pia alivyowafundisha wanafunzi wake
  rationale: “Kama vile” huonyesha ulinganisho wa καθώς, na “pia” huhifadhi nguvu ya καί.
theological_decisions:
- issue: Tafsiri ya κύριος katika kumwita Yesu moja kwa moja
  choice: Bwana
  alternative: Mwalimu
  rationale: “Bwana” hudumisha maana pana ya cheo hicho katika Luka, ikijumuisha heshima ya moja kwa moja bila kuamua kimya-kimya kiwango kamili cha uzito wake wa kikristo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “Ikawa” unahifadhi ladha ya masimulizi ya Luka, huku sentensi iliyobaki ikiwa rahisi kueleweka kwa msomaji wa kawaida.
