  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: sw
  text: Au akiomba yai, je, atampa nge?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Au
  rationale: Inaendeleza mfululizo wa mifano kwa njia ya kawaida katika Kiswahili bila kulazimisha tafsiri ya καί ambayo hapa haiongezi maana muhimu tofauti.
- source_word: αἰτήσει
  choice: akiomba
  rationale: Ingawa ni kitenzi cha wakati ujao katika Kigiriki, hapa kinafanya kazi ndani ya swali lenye hali ya masharti; 'akiomba' ni ya kawaida na huhifadhi maana ya kuomba kitu.
- source_word: ᾠόν
  choice: yai
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitu kinachoombwa.
- source_word: ἐπιδώσει
  choice: atampa
  rationale: Katika muktadha huu humaanisha kumpa mtu kitu kwa kuitikia ombi lake; umbo hili ni la kawaida katika swali la balagha.
- source_word: αὐτῷ
  choice: -m- katika 'atampa'
  rationale: Kiwakilishi cha yambwa 'm' kinawasilisha kwa kawaida maana ya 'yeye/k kwake' katika Kiswahili.
- source_word: σκορπίον
  choice: nge
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa scorpion na linahifadhi utofautishaji mkali na yai.
theological_decisions:
- issue: Nguvu ya swali la balagha katika mfano wa baba na mtoto
  choice: Kuliwasilisha kama swali la moja kwa moja bila kuongeza 'badala yake'.
  alternative: Kuongeza 'badala yake' ili kufanya utofautishaji uwe wazi zaidi.
  rationale: Kigiriki kinaacha wazo la 'badala yake' lidokezwe. Kiswahili kinaeleweka bila nyongeza hiyo, hivyo swali linahifadhi hoja ya Yesu kuhusu wema wa baba bila ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, fupi, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama za koma hutenganisha kwa urahisi kishazi cha hali na swali kuu.
