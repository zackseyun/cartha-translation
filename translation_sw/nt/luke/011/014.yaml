  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: sw
  text: Naye alikuwa akitoa pepo bubu.[a] Ikawa, pepo alipotoka, yule aliyekuwa bubu akasema, na makutano wakastaajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiziwi.” Neno la Kigiriki linaweza kumaanisha “kiziwi” au “bubu”; hapa “bubu” linafaa zaidi kwa sababu mtu huyo alisema baada ya pepo kutoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: alikuwa akimtoa
  rationale: Muundo wa ἦν pamoja na kitenzi-shirikishi cha wakati uliopo unaonyesha tendo lililokuwa likiendelea wakati uliopita. Kiswahili cha “alikuwa akimtoa” kinahifadhi hali hiyo kwa lugha ya kawaida.
- source_word: δαιμόνιον
  choice: pepo
  rationale: Katika Kiswahili sanifu cha Biblia, “pepo” humaanisha kiumbe cha kiroho kiovu na kutafsiri δαιμόνιον moja kwa moja bila kuingiza neno “mchafu,” ambalo halipo katika mstari huu.
- source_word: κωφόν
  choice: aliyekuwa bubu
  rationale: κωφός inaweza kumaanisha asiyeweza kusikia au asiyeweza kusema. Kwa kuwa baada ya pepo kutoka mtu huyo alisema, muktadha unaelekeza hasa kwenye kutoweza kusema. Muundo huu pia unaepuka kudokeza kwamba pepo mwenyewe hakuwa na uwezo wa kusema.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Ikawa, pepo huyo alipotoka
  rationale: “Ikawa” inadumisha mpito wa usimulizi, na “alipotoka” huonyesha kwamba kutoka kwa pepo kulitangulia kusema kwa mtu huyo.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Hii ni tafsiri ya moja kwa moja ya λαλέω katika wakati uliopita; haiongezi wazo la “alianza kusema,” ambalo halijaelezwa wazi katika Kigiriki.
- source_word: ὁ κωφός
  choice: mtu aliyekuwa bubu
  rationale: Kivumishi kilichotumiwa kama nomino kinamtaja mtu aliyekuwa na tatizo hilo. “Mtu” ni ya asili na haiongezi jinsia ambayo haijawekwa wazi na kivumishi chenyewe.
- source_word: ἐθαύμασαν
  choice: ukastaajabu
  rationale: “Kustaajabu” huwasilisha mshangao wenye hali ya ajabu unaobebwa na θαυμάζω, kwa lugha ya sasa na yenye hadhi.
- source_word: οἱ ὄχλοι
  choice: umati
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia nomino ya mkusanyiko “umati” kwa kundi la watu waliokusanyika. Hii ni ya asili kuliko “umati wa watu wengi” au “makundi ya watu” katika muktadha huu.
theological_decisions:
- issue: Asili ya tatizo na lugha ya kutoa pepo
  choice: Kutafsiri simulizi kuwa Yesu alikuwa akimtoa pepo halisi, na kutoka kwake kukafuatiwa na kurejea kwa uwezo wa mtu kusema.
  alternative: Kutumia maelezo yasiyotaja wazi hali ya kiroho, au kutafsiri δαιμόνιον kwa namna ya hali ya ugonjwa pekee.
  rationale: Kigiriki kinamtaja δαιμόνιον wazi na kinaunganisha kutoka kwake na mtu kusema. Tafsiri inapaswa kuhifadhi dai hilo la simulizi bila kulipunguza wala kulipanua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alikuwa akimtoa” huhifadhi tendo linaloendelea; “mtu aliyekuwa bubu” ni wazi na haifanyi “pepo bubu” ionekane kana kwamba pepo mwenyewe ndiye asiyeweza kusema. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
