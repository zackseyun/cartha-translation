id: LUK.11.20
reference: Luke 11:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: sw
  text: Lakini ikiwa ninawafukuza pepo kwa kidole cha Mungu[a], basi ufalme wa Mungu umewafikia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “kidole cha Mungu” unaonyesha nguvu na utendaji wa Mungu mwenyewe, na una mwangwi wa Kutoka 8:19.
    reason: lexical_alternative
  - marker: b
    text: Au “umewajia”; au “umewapata.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: kwa kidole cha Mungu
  rationale: Huhifadhi taswira halisi ya Kigiriki huku ikionyesha nguvu au utendaji wa Mungu mwenyewe; pia inadumisha mwangwi wa Kutoka 8:19 bila kuufafanua ndani ya matini.
- source_word: ἐκβάλλω
  choice: ninawafukuza
  rationale: Kitenzi hiki ni cha kawaida na cha sasa katika Kiswahili kwa maana ya kuwatoa pepo kwa nguvu, na kinaendana na matumizi yake katika muktadha wa utoaji pepo.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: Neno “pepo” ni tafsiri ya kawaida na inayoeleweka ya δαιμόνια katika Kiswahili cha Biblia; halibadilishwi kuwa “roho wachafu,” ambalo lingetafsiri usemi mwingine wa Kigiriki.
- source_word: ἄρα
  choice: basi
  rationale: Huonyesha hitimisho linalotokana na sharti lililotangulia kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: umewafikia
  rationale: Huonyesha kwamba ufalme umefika kwa wasikilizaji kwa namna iliyotimia na ya kuamua, huku ukihifadhi mwelekeo wa tendo kwao.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni usemi sahihi, wa kawaida na wenye hadhi unaoweza kujumuisha eneo la ufalme na utawala wa Mungu bila kupunguza maana kuwa dhana moja tu.
theological_decisions:
- issue: Maana ya “kidole cha Mungu”
  choice: Taswira ya nguvu na utendaji wa moja kwa moja wa Mungu, iliyohifadhiwa kama ilivyo katika matini.
  alternative: Kuifafanua moja kwa moja kuwa Roho Mtakatifu kwa kulinganisha na Mathayo 12:28.
  rationale: Luka anatumia “kidole cha Mungu”; tafsiri inahifadhi usemi huo na mwangwi wake wa kimaandiko bila kuubadilisha kuwa maneno ya kifungu sambamba.
- issue: Nguvu ya usemi “ufalme wa Mungu umewafikia”
  choice: Ufalme wa Mungu umefika sasa kwa namna ya kuamua katika huduma ya Yesu.
  alternative: 'Ufalme ni wa wakati ujao tu, au usemi huo una maana ya hukumu pekee: “umewapata.”'
  rationale: Kitenzi cha Kigiriki katika muktadha huu kinaonyesha kuwasili ambako tayari kumetukia; tafsiri inadumisha jambo hilo bila kulazimisha mfumo mpana wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa maneno ni wa asili, huku taswira ya “kidole cha Mungu” na nguvu ya kuwasili kwa ufalme vikihifadhiwa.
