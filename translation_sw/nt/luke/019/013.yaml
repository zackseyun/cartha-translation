id: LUK.19.13
reference: Luke 19:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: sw
  text: Kisha akawaita watumwa wake kumi[a], akawapa mina kumi[b], akawaambia, “Fanyeni biashara[c] mpaka nitakapokuja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.” Neno la Kigiriki doulos linaweza kumaanisha mtumishi au mtumwa kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Mina ilikuwa kipimo cha fedha kilichotumiwa nyakati za kale.
    reason: cultural_note
  - marker: c
    text: Au “Fanyeni shughuli za biashara” au “Fanyeni biashara kwa fedha hizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Kisha akawaita
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; “Kisha akawaita” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: δούλους
  choice: watumwa
  rationale: Katika mfano huu watu hao wako chini ya mamlaka ya bwana wao na wanatajwa kuwa wake; “watumwa” linaakisi kwa uwazi uhusiano wa kijamii unaodokezwa na δοῦλος, huku tanbihi ikihifadhi uwezekano wa “watumishi.”
- source_word: ἑαυτοῦ
  choice: wake
  rationale: Kiwakilishi kimilikishi kinaonyesha kwamba walikuwa watu walio chini ya bwana huyo. Kiswahili cha kawaida hakihitaji kuongeza “mwenyewe,” ambako kungekuwa na mkazo usio wa kawaida hapa.
- source_word: μνᾶς
  choice: mina
  rationale: Jina la kipimo cha kale cha fedha limetoholewa badala ya kubadilishwa kuwa sarafu ya kisasa, ili kuhifadhi mazingira ya kihistoria.
- source_word: Πραγματεύσασθε
  choice: Fanyeni biashara
  rationale: Amri hii inataka watumie fedha walizokabidhiwa katika shughuli za kibiashara; usemi huu ni wa kawaida na hauainishi isivyohitajika kama walipaswa kufanya biashara au uwekezaji wa aina fulani.
- source_word: ἐν ᾧ ἔρχομαι
  choice: mpaka nitakapokuja
  rationale: Hii ni tafsiri ya kawaida ya usemi wa muda, na “kuja” huhifadhi kitenzi cha Kigiriki bila kukibadili moja kwa moja kuwa “kurudi,” ingawa katika muktadha kuja huko ni kurejea kwake.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano wenye uhusiano wa bwana na mtumwa
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha unaonyesha watu walio mali au chini ya mamlaka ya bwana na waliokabidhiwa rasilimali zake. “Watumwa” huhifadhi hali hiyo ya kijamii bila kuingiza maana ya kidhehebu; tanbihi inataja tafsiri pana zaidi inayowezekana.
- issue: Ikiwa ἔρχομαι itafasiriwe kama kuja au kurudi
  choice: nitakapokuja
  alternative: nitakaporudi
  rationale: “Kuja” hufuata kitenzi cha chanzo na kuhifadhi namna msemaji anavyoeleza mwendo huo. “Kurudi” ni wazi kimuktadha lakini inaeleza kwa namna mahsusi zaidi kuliko neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo wa mfululizo wa “aka-” unaonyesha kwa uwazi matendo yanayofuatana. Neno la kihistoria “mina” limehifadhiwa na kufafanuliwa katika tanbihi.
source_grounding:
  english_pob_role: consult_only
