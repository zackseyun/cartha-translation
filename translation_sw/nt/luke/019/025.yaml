lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa uratibu wa kawaida bila kuongeza maana ya wakati au upinzani.
- source_word: εἶπαν αὐτῷ
  choice: wakamwambia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida katika simulizi tendo la kusema lililokamilika pamoja na mtendewa wa kiume.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika hali ya kumwita mtu moja kwa moja; hapa pia inaweza kuwa namna ya heshima kwa mwenye mamlaka katika mfano.
- source_word: ἔχει
  choice: ana
  rationale: Kitenzi hiki kinaonyesha umiliki wa sasa bila kuongeza msisitizo usiotajwa wazi kama ‘tayari.’
- source_word: δέκα
  choice: kumi
  rationale: Ni tafsiri ya moja kwa moja ya namba hiyo.
- source_word: μνᾶς
  choice: mina
  rationale: Jina la kipimo cha kale cha fedha limetoholewa badala ya kubadilishwa kuwa sarafu au kipimo cha kisasa ambacho kingeweza kupotosha mazingira ya kihistoria.
theological_decisions:
- issue: Tafsiri ya κύριος katika usemi wa moja kwa moja ndani ya mfano
  choice: Bwana
  alternative: Mheshimiwa; mkuu
  rationale: ‘Bwana’ inadumisha maana ya mamlaka na ulinganifu wa kileksika. Hata hivyo, katika muktadha huu huenda ni namna ya heshima kwa bwana wa mfano, si lazima ungamo la moja kwa moja kuhusu utambulisho wa Kristo; tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao wakamwambia’ ni mtiririko wa kawaida wa simulizi; kiwakilishi ‘yeye’ kimehifadhiwa ili kuonyesha msisitizo wa pingamizi katika muktadha. Mkato mrefu mwishoni unaonyesha kwamba usemi unaungana moja kwa moja na jibu la mstari unaofuata.
