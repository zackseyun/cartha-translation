  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: sw
  text: Ikawa, alipokaribia Bethfage na Bethania, kuelekea mlima uitwao Mizeituni[a], akawatuma wawili kati ya wanafunzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa usemi uliozoeleka zaidi, “Mlima wa Mizeituni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ikawa
  rationale: Huhifadhi mtindo wa Luka wa kuendeleza simulizi kwa lugha fupi, ya asili na yenye hadhi katika Kiswahili.
- source_word: ὡς
  choice: alipo-
  rationale: Kiambishi hiki kinatanguliza kishazi cha wakati na, pamoja na kitenzi cha kukaribia, kinaonyesha tendo lililokuwa likifanyika.
- source_word: ἤγγισεν
  choice: alipokaribia
  rationale: Hutoa maana ya kufika karibu na mahali bila kutumia lugha ya kizamani.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: Bethfage na Bethania
  rationale: Majina yametoholewa kwa namna inayotambulika katika Kiswahili; wazo la kuelekea mahali linaeleweka ndani ya kitenzi 'alikaribia'.
- source_word: πρὸς τὸ ὄρος
  choice: kuelekea mlima
  rationale: Huhifadhi maana ya mwelekeo inayowezekana katika πρός na uhusiano wake na mwendo wa simulizi.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: uitwao Mizeituni
  rationale: Huhifadhi kwa uwazi usemi mfupi wa Kigiriki, ambao kwa halisi unaita mlima huo 'Mizeituni,' bila kuongeza neno lisilo katika kirai hicho.
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Ni tafsiri ya kawaida ya tendo la kutuma; kiambishi 'wa' kinaonyesha kwamba waliotumwa ni watu.
- source_word: δύο τῶν μαθητῶν
  choice: wawili kati ya wanafunzi
  rationale: Huhifadhi muundo wa sehemu ya kundi—wawili kutoka miongoni mwa wanafunzi—bila kuongeza kimilikishi 'wake,' ambacho hakijaandikwa wazi katika Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo 'Ikawa' huhifadhi ladha ya kisimulizi ya Luka bila kutumia usemi mzito au wa kizamani; 'wawili kati ya wanafunzi' huhifadhi kwa uwazi maana ya Kigiriki ya kuchagua wawili kutoka katika kundi.
