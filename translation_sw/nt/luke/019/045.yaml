  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: sw
  text: Kisha alipoingia hekaluni[a], alianza kuwafukuza wale waliokuwa wakiuza,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika eneo la hekalu” au “katika nyua za hekalu.” Neno la Kigiriki ἱερόν linamaanisha eneo lote la hekalu, si hasa patakatifu pa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: alipoingia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinatangulia kitendo kikuu; ‘alipoingia’ huonyesha mfuatano huo kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyo katika chanzo.
- source_word: ἱερὸν
  choice: hekaluni
  rationale: ἱερόν humaanisha eneo lote la hekalu, si jengo la patakatifu pa ndani pekee. ‘Hekaluni’ ni tafsiri fupi na ya kawaida, huku tanbihi ikifafanua upeo wa mahali hapo.
- source_word: ἤρξατο
  choice: alianza
  rationale: Huonyesha mwanzo wa tendo linalofuata na inatafsiriwa kwa kawaida kuwa ‘alianza’.
- source_word: ἐκβάλλειν
  choice: kuwafukuza
  rationale: Neno hili linaonyesha kuwaondoa watu kwa nguvu au kwa uamuzi thabiti; ‘kuwafukuza’ ni la asili na lenye nguvu inayofaa katika Kiswahili.
- source_word: πωλοῦντας
  choice: wale waliokuwa wakiuza
  rationale: Kitenzi kishirikishi cha wakati wa sasa kinawaeleza watu waliokuwa katika shughuli ya kuuza, bila kutaja walichokuwa wakiuza kwa kuwa mstari huu haukitaji.
theological_decisions:
- issue: Upeo wa ἱερόν katika tendo la Yesu hekaluni
  choice: hekaluni, likieleweka kuwa eneo lote la hekalu
  alternative: katika nyua za hekalu; katika eneo la hekalu; katika patakatifu
  rationale: ἱερόν kwa kawaida hurejelea eneo zima la hekalu, tofauti na ναός, ambalo linaweza kurejelea jengo la patakatifu lenyewe. Tafsiri kuu inabaki fupi, na tanbihi inalinda tofauti hiyo bila kudai kuwa Yesu aliingia patakatifu pa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Alipoingia’ ni ya asili kuliko muundo mzito wa ‘baada ya kuingia,’ na ‘kuwafukuza’ huhifadhi nguvu ya tendo.
