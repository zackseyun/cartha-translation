id: LUK.19.27
reference: Luke 19:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: sw
  text: Lakini hao adui zangu ambao hawakutaka niwe mfalme wao[a], waleteni hapa na wachinjeni mbele yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niwatawale kama mfalme.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waueni mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Neno hili linaonyesha mpito mkali kwenda kwenye jambo la mwisho katika hotuba ya mtu huyo; “Lakini” ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: hao adui zangu
  rationale: “Hao” inadumisha msisitizo na umahususi wa τούτους, huku “adui zangu” ikitafsiri ἐχθρούς μου kwa lugha ya kawaida.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: ambao hawakutaka niwe mfalme wao
  rationale: Kishazi tegemezi ni cha asili katika Kiswahili. “Niwe mfalme wao” kinaonyesha wazi maana ya kifalme ya βασιλεύω na uhusiano wa kutawala uliomo katika ἐπ’ αὐτούς.
- source_word: ἀγάγετε ὧδε
  choice: waleteni hapa
  rationale: Hii ni amri ya kawaida na ya moja kwa moja katika Kiswahili, ikihifadhi tendo la kuwaleta na mahali panapoonyeshwa na ὧδε.
- source_word: κατασφάξατε
  choice: wachinjeni
  rationale: “Wachinjeni” inadumisha ukali na taswira ya kitenzi chenye nguvu zaidi kuliko neno la jumla “waueni”; haiongezi maana ya hukumu ya kisheria.
- source_word: ἔμπροσθέν μου
  choice: mbele yangu
  rationale: Tafsiri hii ni ya asili, ya wazi, na inadumisha maana ya kitendo kufanywa katika uwepo na mbele ya msemaji.
theological_decisions:
- issue: Msemaji ndani ya mfano
  choice: Amri ya mtu huyo mashuhuri imetafsiriwa moja kwa moja bila kupunguza ukali wake, huku haijaongezwa lugha inayosema wazi kuwa ni amri ya Yesu nje ya mfano.
  alternative: Kuongeza maneno yanayoitenga zaidi kama picha ya kimfano tu.
  rationale: Kigiriki kinawasilisha maneno ya mhusika ndani ya mfano. Tafsiri inapaswa kuhifadhi nguvu na mvutano wa simulizi bila kuingiza hitimisho la kitheolojia lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wachinjeni” kimetumiwa kwa makusudi kuhifadhi ukali wa κατασφάξατε; sentensi haijapunguza vurugu ya maneno wala kuongeza ufafanuzi wa kimadhehebu.
