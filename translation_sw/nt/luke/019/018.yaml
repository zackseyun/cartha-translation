  text: Yule wa pili akaja, akasema, ‘Mina yako, bwana, imezaa mina tano.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: wa pili
  rationale: Huhifadhi mpangilio wa watumishi katika mfano kwa Kiswahili cha kawaida.
- source_word: Ἡ μνᾶ σου
  choice: mina yako
  rationale: ‘Mina’ ni kipimo cha fedha cha kihistoria; kuacha jina hilo huepuka kulinganisha kwa usahihi wa bandia na sarafu ya kisasa.
- source_word: κύριε
  choice: Bwana
  rationale: Ni namna ya heshima ya kumwita mwenye mamlaka katika muktadha huu; herufi kubwa inafuata matumizi ya kawaida ya Kiswahili kwa cheo hiki bila kulazimisha utambulisho zaidi ya simulizi.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: imezaa mina tano
  rationale: Kitenzi halisi ni ‘ilifanya,’ lakini hapa kina maana ya kupata au kuzalisha faida; ‘imezaa’ huhifadhi taswira ya mina yenyewe kuleta ongezeko na ni Kiswahili cha asili.
theological_decisions:
- issue: Maana ya κύριε katika mfano
  choice: Bwana
  alternative: bwana wangu
  rationale: ‘Bwana’ huhifadhi namna ya moja kwa moja ya kumwita mwenye mamlaka na haiingizi kwa lazima dai la kitheolojia lisilotamkwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya simulizi; istilahi ya kihistoria ‘mina’ imehifadhiwa.
