  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: sw
  text: na watakubomoa kabisa pamoja na watoto wako walio ndani yako, wala hawataacha ndani yako jiwe moja juu ya jingine, kwa sababu hukutambua wakati wa kujiliwa kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa kukaguliwa kwako.” Neno la Kigiriki linaweza kumaanisha kujiliwa au kukaguliwa, hasa ziara ya kimungu inayoweza kuleta rehema au hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: watakubomoa kabisa
  rationale: Kitenzi hiki kina maana ya kubomoa au kuangusha hadi chini. ‘Watakubomoa kabisa’ ni Kiswahili cha kawaida chenye nguvu na kinadumisha Yerusalemu kama anayesemeshwa moja kwa moja.
- source_word: σε
  choice: wewe (imejumuishwa katika kiambishi -ku-)
  rationale: Kiwakilishi cha nafsi ya pili umoja kinamhusu Yerusalemu aliyepewa sura ya mtu; kiambishi ‘-ku-’ katika ‘watakubomoa’ kinahifadhi usemi huo bila kuongeza ‘mji wako.’
- source_word: τὰ τέκνα σου ἐν σοί
  choice: watoto wako walio ndani yako
  rationale: ‘Watoto’ huhifadhi taswira ya Yerusalemu kama mama badala ya kuififisha kuwa ‘wakazi’; ‘walio ndani yako’ inaeleza kwa kawaida ἐν σοί.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: hawataacha ndani yako jiwe moja juu ya jingine
  rationale: Huu ni usemi wa maangamizi kamili. Mpangilio huu ni wa asili katika Kiswahili na unaweka wazi ‘ndani yako.’
- source_word: ἀνθ’ ὧν
  choice: kwa sababu
  rationale: Katika muktadha huu kirai kinaanzisha sababu ya hukumu; ‘kwa sababu’ kinawasilisha uhusiano huo wazi.
- source_word: ἔγνως
  choice: hukutambua
  rationale: Kitenzi kinaweza kumaanisha kujua au kutambua; hapa ni kushindwa kuitambua hatua muhimu ya Mungu.
- source_word: καιρὸν
  choice: wakati
  rationale: καιρός ni wakati maalumu au wenye umuhimu; ‘wakati’ ni fupi na ya kawaida, huku umuhimu wake ukidhihirishwa na kirai kinachofuata.
- source_word: τῆς ἐπισκοπῆς σου
  choice: wa kujiliwa kwako na Mungu
  rationale: ‘Kujiliwa’ huwasilisha wazo la ujio au ziara inayomhusu Yerusalemu. ‘Na Mungu’ kinaweka wazi maana ya kimungu inayodokezwa na muktadha, huku tanbihi ikihifadhi uwezekano wa ‘kukaguliwa.’
theological_decisions:
- issue: Maana ya ἐπισκοπή katika muktadha wa hukumu
  choice: kujiliwa kwako na Mungu
  alternative: wakati wa kukaguliwa kwako
  rationale: Neno linaweza kumaanisha ujio/ziara ya kimungu au ukaguzi, na ujio huo unaweza kuleta rehema au hukumu. Tafsiri kuu inaonyesha maana ya kimungu inayodokezwa na muktadha bila kusema moja kwa moja ikiwa kusudi lake ni wokovu au hukumu; tanbihi inahifadhi maana mbadala ya ukaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya Yerusalemu kama mtu na mama imehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
