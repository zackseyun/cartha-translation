  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: sw
  text: Na tazama, mtu mmoja aliyeitwa Zakayo; yeye alikuwa mkuu wa watoza ushuru, naye alikuwa tajiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linaelekeza usikivu wa msomaji na kuupa usimulizi uhai; “tazama” ni tamko la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: ἀνὴρ
  choice: mtu
  rationale: Katika muktadha huu linamtaja mwanamume mmoja. Kiswahili hutumia “mtu” kwa kawaida bila kuhitaji “mwanamume,” kwa kuwa jina na viwakilishi vinaweka rejeo wazi.
- source_word: ὀνόματι καλούμενος
  choice: aliyeitwa
  rationale: Tamko hili la Kigiriki linamaanisha mtu aliyeitwa au aliyejulikana kwa jina hilo. “Aliyeitwa” ni la asili katika Kiswahili na halina urudiaji mgumu.
- source_word: Ζακχαῖος
  choice: Zakayo
  rationale: Hili ni umbo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: αὐτὸς ἦν
  choice: yeye alikuwa
  rationale: “Yeye” linadumisha msisitizo mdogo wa kiwakilishi cha Kigiriki na kurejesha mhusika baada ya kumtaja.
- source_word: ἀρχιτελώνης
  choice: mkuu wa watoza ushuru
  rationale: Neno ambatani linaonyesha cheo cha juu miongoni mwa watoza ushuru; tafsiri hii ni wazi na ya kawaida.
- source_word: αὐτὸς πλούσιος
  choice: tena alikuwa tajiri
  rationale: “Tena” linaonyesha sifa ya pili na kudumisha kwa kawaida msisitizo wa kifungu cha Kigiriki bila kutumia “yeye mwenyewe,” ambako kungekuwa na uzito kupita kiasi.
