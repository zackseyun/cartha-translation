  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: sw
  text: Baada ya kusema mambo hayo, Yesu akaendelea mbele, akipanda kwenda Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Baada ya
  rationale: Kiunganishi hiki kinaingizwa kwa kawaida katika kishazi cha wakati ‘Baada ya kusema,’ hivyo mtiririko wa simulizi unabaki wazi bila kutumia ‘Na’ isiyo ya lazima katika Kiswahili.
- source_word: εἰπὼν ταῦτα
  choice: kusema mambo hayo
  rationale: Muundo huu unaonyesha kitendo kilichotangulia kile cha kitenzi kikuu. ‘Mambo hayo’ hudumisha wingi na rejeo pana kwa yaliyosemwa kabla.
- source_word: ἐπορεύετο
  choice: akatangulia
  rationale: Katika muktadha huu kitenzi kinaeleza kuendelea na safari; pamoja na ἔμπροσθεν, ‘akatangulia’ ni Kiswahili cha asili kinachoonyesha Yesu aliendelea akiwa mbele.
- source_word: ἔμπροσθεν
  choice: mbele
  rationale: Kielezi hiki kinaonyesha nafasi ya kuwa mbele ya wengine. ‘Mbele’ huhifadhi maana hiyo kwa uwazi.
- source_word: ἀναβαίνων
  choice: akipanda
  rationale: Huhifadhi lugha halisi ya kupanda kuelekea Yerusalemu na kuonyesha kitendo kilichoendelea sambamba na kutangulia kwake.
- source_word: εἰς Ἱεροσόλυμα
  choice: kwenda Yerusalemu
  rationale: εἰς hapa huonyesha mwelekeo au mahali pa kufikiwa, si lazima kuingia ndani ya mji. ‘Kwenda Yerusalemu’ ni usemi wa kawaida na sahihi.
theological_decisions:
- issue: Iwapo lugha halisi ya kupanda kwenda Yerusalemu ihifadhiwe
  choice: akipanda kwenda Yerusalemu
  alternative: akisafiri kwenda Yerusalemu; akiwa njiani kwenda Yerusalemu
  rationale: ‘Akipanda’ huhifadhi taswira ya kijiografia ya maandishi na mwangwi wake wa kisimulizi bila kuongeza tafsiri ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Jina ‘Yesu’ limewekwa wazi kwa kuwa Kiswahili hakina kiwakilishi cha jinsia kinacholingana moja kwa moja na ‘he’; kufanya hivyo huondoa utata wa kisarufi bila kubadili mhusika wa muktadha. Hakuna tanbihi zinazohitajika.
