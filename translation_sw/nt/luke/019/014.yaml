  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: sw
  text: Lakini raia wake walimchukia, wakatuma ujumbe wa wawakilishi[a] kumfuata, wakisema, “Hatutaki mtu huyu awe mfalme wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe wa kidiplomasia.” Neno la Kigiriki humaanisha kundi la wawakilishi waliotumwa kwa kazi rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: raia
  rationale: Neno hili hudokeza wanachama wa jumuiya ya kisiasa. “Raia” huhifadhi maana hiyo bila kuwaita tayari watu walio chini ya ufalme ambao wana ukataa.
- source_word: ἐμίσουν
  choice: walimchukia
  rationale: Kauli ya wakati usiotimilika inaonyesha chuki iliyoendelea au iliyowatambulisha; “walimchukia” ni Kiswahili cha kawaida na sahihi katika simulizi.
- source_word: ἀπέστειλαν
  choice: wakatuma
  rationale: Hutoa kwa kawaida tendo linalofuata katika simulizi bila kuongeza urasmi usio lazima.
- source_word: πρεσβείαν
  choice: kundi la wajumbe[a]
  rationale: Neno la Kigiriki linamaanisha ujumbe au baraza la wawakilishi waliotumwa rasmi. “Kundi la wajumbe” ni wazi kwa msomaji wa sasa na huepuka utata wa “ujumbe,” ambalo pia linaweza kumaanisha maneno yanayopelekwa.
- source_word: ὀπίσω αὐτοῦ
  choice: wamfuate
  rationale: Katika muktadha huu, wajumbe walitumwa baada ya kuondoka kwake; “wamfuate” hutoa maana hiyo kwa Kiswahili cha asili bila kudokeza kwamba walikuwa nyuma yake kimahali tu.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha moja kwa moja maneno ambayo wajumbe walipewa kuyasema.
- source_word: Οὐ θέλομεν
  choice: Hatutaki
  rationale: Hueleza kwa lugha ya kawaida kukataa kwao na kutokuwa tayari kwao.
- source_word: τοῦτον
  choice: mtu huyu
  rationale: Huhifadhi sauti ya kujitenga au ya kumkataa inayoweza kusikika katika kiwakilishi cha Kigiriki bila kuongeza dharau kali.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: atutawale kama mfalme
  rationale: Huhifadhi wazi taswira ya kifalme ya βασιλεύω huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya kisiasa na kifalme katika mfano
  choice: atutawale kama mfalme
  alternative: atutawale; awe mfalme wetu
  rationale: Tafsiri inahifadhi lugha ya ufalme badala ya kuifanya mamlaka ya jumla, lakini haiongezi hitimisho la kiistiari lisilotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wakatuma kundi la wajumbe wamfuate” ni wa kawaida, na kauli “mtu huyu” inadumisha sauti yao ya kumkataa bila kuwa ya matusi.
