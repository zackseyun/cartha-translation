reference: Luke 19:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: sw
  text: Akamwambia, “Umefanya vyema, mtumishi mwema! Kwa kuwa ulikuwa mwaminifu katika jambo dogo sana, uwe na mamlaka juu ya miji kumi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖγε
  choice: Umefanya vyema
  rationale: Ni kauli ya kawaida ya pongezi katika Kiswahili, inayowasilisha kibali cha mhusika bila kuwa tafsiri kavu ya neno moja.
- source_word: ἀγαθὲ
  choice: mwema
  rationale: Kivumishi hiki kinamwelezea δοῦλε moja kwa moja katika usemi wa kumwita na kumpa sifa.
- source_word: δοῦλε
  choice: mtumishi
  rationale: Katika muktadha huu wa mfano wa bwana na aliye chini yake, “mtumishi” ni ya asili na inadumisha uhusiano wa mamlaka; neno la Kigiriki linaweza pia kumaanisha mtumwa, lakini tanbihi si lazima kwa Kiswahili hapa kwa kuwa “mtumishi” ndilo chaguo linalofaa kimuktadha.
- source_word: ἐν ἐλαχίστῳ
  choice: katika jambo dogo sana
  rationale: Huwasilisha kwa uwazi maana ya kuwa mwaminifu katika jambo lenye ukubwa au thamani ndogo kabisa.
- source_word: πιστὸς ἐγένου
  choice: ulikuwa mwaminifu
  rationale: Hufuata kwa karibu muundo na tathmini ya Kigiriki bila kuongeza wazo la kuthibitisha uaminifu lisilotamkwa wazi.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: uwe na mamlaka
  rationale: Muundo huu wa amri unaelekeza hali ya kuwa na mamlaka; “uwe na mamlaka” ni wa asili na huhifadhi nguvu ya amri au tuzo.
- source_word: ἐπάνω δέκα πόλεων
  choice: juu ya miji kumi
  rationale: Huhifadhi maana ya utawala au mamlaka juu ya miji kumi.
theological_decisions:
- issue: Maana ya δοῦλος katika mfano wa bwana na mtumishi
  choice: mtumishi
  alternative: mtumwa
  rationale: “Mtumishi” husomeka kwa kawaida katika mfano huu na huhifadhi hali ya kuwa chini ya mamlaka ya bwana bila kusisitiza utumwa kuliko muktadha unavyodai.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “Umefanya vyema” ni pongezi ya kawaida, na sentensi inadumisha mtiririko wa simulizi pamoja na nguvu ya kauli ya mamlaka.
