  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: sw
  text: 'Na mtu yeyote akiwauliza, ‘Kwa nini mnamfungua?’ mtasema hivi: ‘Bwana[a] anamhitaji.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana.”
    reason: Neno la Kigiriki linaweza kuwa cheo ‘Bwana’ au kumaanisha bwana/mwenye mamlaka katika maana ya kawaida.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: akiwauliza
  rationale: Kitenzi hiki humaanisha kuuliza swali; muundo wa ‘akiwauliza’ unaingia kwa kawaida katika sharti linaloanzishwa na ἐάν.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na iliyo wazi ya kuuliza sababu katika Kiswahili cha sasa.
- source_word: λύετε
  choice: mnaifungua
  rationale: Katika muktadha wa mwana-punda aliyefungwa, λύω humaanisha kumfungua kutoka alipofungwa. Kiambishi ‘-i-’ kinarejelea mnyama huyo bila kurudia jina lake.
- source_word: οὕτως
  choice: hivi
  rationale: Neno hili linatanguliza namna au maudhui ya jibu; ‘mtasema hivi’ ni Kiswahili cha kawaida.
- source_word: ἐρεῖτε
  choice: mtasema
  rationale: Wakati ujao wa Kigiriki una nguvu ya maagizo hapa; ‘mtasema’ huhifadhi umbo hilo na kueleweka kama agizo katika muktadha.
- source_word: κύριος
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi cheo kinachoweza kumrejelea Yesu na pia uwezekano wa maana ya kawaida ya mkuu au mwenye mamlaka.
- source_word: αὐτοῦ
  choice: -i- katika ‘anaihitaji’
  rationale: Kiwakilishi hiki kwa kawaida kinamrejelea mwana-punda; Kiswahili huonyesha yambwa hilo kwa kiambishi cha ngeli ndani ya kitenzi.
- source_word: χρείαν ἔχει
  choice: anaihitaji
  rationale: Ingawa nahau ya Kigiriki ni ‘ana uhitaji wa,’ ‘anaihitaji’ ni Kiswahili cha asili, wazi, na chenye maana ileile.
theological_decisions:
- issue: Rejeo na maana ya Ὁ κύριος
  choice: Bwana
  alternative: bwana au mwenye mamlaka
  rationale: Katika simulizi la Luka, cheo hiki kinaweza kumrejelea Yesu kama ‘Bwana,’ huku neno la Kigiriki lenyewe pia likiwezesha maana ya kawaida ya bwana au mwenye mamlaka. Tafsiri kuu huhifadhi uzito wa cheo bila kufuta utata huo; tanbihi inaonyesha maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa moja kwa moja ni rahisi kueleweka; ‘mnaifungua’ na ‘anaihitaji’ zinamrejelea mwana-punda wa muktadha uliotangulia.
