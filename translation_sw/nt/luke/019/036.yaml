  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: sw
  text: Alipokuwa akienda, walikuwa wakitandaza nguo zao njiani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Alipokuwa akienda
  rationale: Muundo huu wa genitivi huru wenye kitenzi-shirikishi cha wakati wa sasa unaonyesha tendo linaloendelea sambamba na tendo kuu; tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi maana ya wakati.
- source_word: δέ
  choice: imewakilishwa kwa mtiririko wa sentensi bila kiunganishi maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Katika Kiswahili, mwanzo wa sentensi kwa muundo wa 'Alipokuwa...' unaendeleza simulizi kwa kawaida bila kuhitaji 'na' au 'basi'.
- source_word: ὑπεστρώννυον
  choice: walikuwa wakitandaza
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea au kurudiwa; 'walikuwa wakitandaza' huhifadhi hali hiyo.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: mavazi yao
  rationale: ἱμάτια ni mavazi, na mara nyingi mavazi ya nje. 'Mavazi yao' ni pana vya kutosha kuhifadhi wigo wa neno la Kigiriki bila kudokeza aina maalumu ya vazi ambayo maandishi hayalazimishi.
- source_word: ἐν τῇ ὁδῷ
  choice: barabarani
  rationale: Kirai hiki kinaonyesha mahali; 'barabarani' ni usemi wa kawaida wa Kiswahili kwa vitu vilivyotandazwa katika njia aliyopita.
