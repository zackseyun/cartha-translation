  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: sw
  text: Lakini Zakayo akasimama, akamwambia Bwana, “Tazama, Bwana, nawapa maskini nusu ya mali yangu, na ikiwa nimemnyang’anya mtu yeyote kitu chochote[a], namrudishia mara nne[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikiwa nimempunja mtu yeyote kitu chochote.” Kitenzi cha Kigiriki kinaweza kumaanisha kunyang’anya, kudhulumu, au kupunja, wakati mwingine kwa kutumia shtaka la uongo.
    reason: lexical_alternative
  - marker: b
    text: Vitenzi vya Kigiriki vya wakati wa sasa vinaweza pia kueleweka kuwa “nitawapa” na “nitamrudishia,” vikionyesha azimio la kutenda mara moja.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: akasimama
  rationale: Kitenzi hiki kimetumiwa bila mtendaji wa nje na kinaonyesha tendo la Zakayo kusimama; “akasimama” ni simulizi la kawaida na la wazi katika Kiswahili.
- source_word: κύριον / κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi cheo hicho na pia hufaa kama namna ya heshima ya kumwambia Yesu, bila kukipunguza kuwa salamu ya adabu tu.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu kwa msisitizo na lina hadhi inayofaa katika usemi wa moja kwa moja.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: nusu ya mali yangu
  rationale: “Mali” huonyesha vitu na milki alizonazo Zakayo, huku “nusu ya” ikihifadhi maana ya sehemu.
- source_word: τοῖς πτωχοῖς
  choice: maskini
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya watu walio katika hali ya umaskini.
- source_word: δίδωμι
  choice: nawapa
  rationale: Huhifadhi wakati wa sasa wa Kigiriki na kuacha wazi ikiwa Zakayo anaeleza desturi yake au azimio analoanza kutekeleza mara moja.
- source_word: ἐσυκοφάντησα
  choice: nimemnyang’anya
  rationale: Katika muktadha wa mkuu wa watoza ushuru, neno hili linaweza kumaanisha kuchukua mali kwa dhuluma au matumizi mabaya ya mamlaka; tanbihi huhifadhi maana mbadala ya kupunja au kudanganya.
- source_word: ἀποδίδωμι
  choice: namrudishia
  rationale: Hueleza kumrudishia mtu kile kilichochukuliwa na inafaa kwa muktadha wa fidia.
- source_word: τετραπλοῦν
  choice: mara nne
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha fidia ya kiasi kilichozidishwa mara nne.
theological_decisions:
- issue: Nguvu ya vitenzi vya wakati wa sasa δίδωμι na ἀποδίδωμι
  choice: 'Kutafsiri kwa wakati wa sasa: “nawapa … namrudishia”'
  alternative: “nitawapa … nitamrudishia,” kama azimio la papo hapo
  rationale: Kigiriki kina vitenzi vya wakati wa sasa. Kiswahili cha wakati wa sasa huhifadhi umbo hilo na kuacha wazi iwapo Zakayo anaeleza desturi yake, azimio jipya la mara moja, au yote mawili; hivyo mvutano wa kitheolojia kuhusu mwenendo wake wa awali na toba yake hauamuliwi kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “akasimama, akamwambia” ni wa kawaida na unaosomeka kwa urahisi. “Tazama” huhifadhi msisitizo wa Ἰδοὺ, na vitenzi vya wakati wa sasa vimeachwa bila kuamua ikiwa ni desturi au ahadi ya papo hapo.
