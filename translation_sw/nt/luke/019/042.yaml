  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: sw
  text: akisema, “Laiti[a] katika siku hii, hata wewe, ungeyajua mambo yanayoleta amani[b]! Lakini sasa yamefichwa machoni pako.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama katika siku hii, hata wewe, ungeyajua mambo yanayoleta amani.” Kigiriki kinaanza sharti la maombolezo lakini hakitaji matokeo yake.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kihalisi, “mambo yanayoelekea amani,” yaani mambo yanayohusu au yanayoongoza kwenye amani.
    reason: lexical_alternative
  - marker: c
    text: 'Kitenzi cha Kigiriki kiko katika umoja. Wazo lote la mambo hayo linaweza pia kutajwa kwa umoja: “lakini sasa jambo hilo limefichwa machoni pako.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaendeleza mtiririko wa simulizi kutoka kifungu kilichotangulia; “akisema” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Εἰ ἔγνως
  choice: Laiti ... ungeyajua
  rationale: Katika maombolezo haya, sharti limeachwa bila jibu na linaonyesha jambo lisilotimia. “Laiti ... ungeyajua” huwasilisha huzuni na hali hiyo kwa Kiswahili cha asili bila kutunga hitimisho ambalo halipo katika Kigiriki.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: katika siku hii
  rationale: Tafsiri hii inahifadhi rejeo mahsusi la wakati bila kuongeza mkazo wa “siku hii hii.”
- source_word: καὶ σὺ
  choice: wewe pia
  rationale: Kiwakilishi kilichotajwa wazi kina mkazo; “wewe pia” huonyesha kuwa Yerusalemu mwenyewe anahusishwa kwa msisitizo.
- source_word: τὰ πρὸς εἰρήνην
  choice: mambo yanayoleta amani
  rationale: Usemi wa Kigiriki unamaanisha mambo yanayohusu au kuongoza kwenye amani. Tafsiri hii ni wazi na inahifadhi wingi wa τὰ.
- source_word: εἰρήνην
  choice: amani
  rationale: “Amani” ni neno la kawaida lenye upana wa maana unaoweza kujumuisha salama na hali njema bila kuufinya muktadha.
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Huonyesha tofauti kali kati ya jambo ambalo lingeweza kujulikana na hali ya sasa ya kufichwa.
- source_word: ἐκρύβη
  choice: yamefichwa
  rationale: Umbo la kutendwa linahifadhiwa, na upatanisho wa wingi kwa Kiswahili unaunganisha wazi kitenzi na “mambo yanayoleta amani.” Wakati timilifu unaonyesha matokeo yanayoendelea sasa.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: machoni pako
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira ya macho kama uwezo wa kuona na kutambua.
theological_decisions:
- issue: Nguvu ya maombolezo yenye sharti lisilokamilishwa
  choice: “Laiti ... ungeyajua” pamoja na alama ya mshangao
  alternative: “Kama ... ungeyajua”
  rationale: Kigiriki kinaanza sharti lakini hakitoi jibu lake, jambo linalobeba huzuni kubwa. Kiswahili cha “Laiti” huwasilisha maombolezo hayo kwa uwazi, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na umbo la sharti.
- issue: Kirejelewa cha ἐκρύβη
  choice: “mambo yanayoleta amani” ndiyo yaliyofichwa, kwa hiyo “yamefichwa”
  alternative: 'Umoja wa kimawazo: “jambo hilo limefichwa”'
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja, kifungu cha karibu zaidi ni nomino ya wingi isiyo na jinsi τὰ πρὸς εἰρήνην, ambayo katika Kigiriki mara nyingi huambatana na kitenzi cha umoja. Kiswahili kinahitaji upatanisho wa wazi wa wingi; tanbihi inataja uwezekano wa kuelewa wazo zima kwa umoja bila kulazimisha hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi umehifadhi msisitizo wa “katika siku hii” na “wewe pia,” huku “Laiti” ikifanya maombolezo yasiyokamilishwa yasikike kwa kawaida katika Kiswahili.
