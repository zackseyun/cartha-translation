id: LUK.19.7
reference: Luke 19:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: sw
  text: Watu wote walipoona jambo hilo, wakaanza kunung’unika wakisema, “Ameingia kukaa[a] kwa mwanamume mwenye dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa mgeni.”
    reason: καταλῦσαι inaweza kumaanisha kukaa mahali kama mgeni; usemi huu mbadala unaweka wazi dhana hiyo.
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona jambo hilo
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati kinachoonyesha kilichochochea mwitikio; “jambo hilo” limeongezwa kwa ufasaha kurejelea Yesu kwenda pamoja na Zakayo.
- source_word: πάντες
  choice: watu wote
  rationale: Huhifadhi msisitizo kwamba wote walioliona jambo hilo walitoa mwitikio huo.
- source_word: διεγόγγυζον
  choice: wakaanza kunung’unika
  rationale: Wakati usiotimilika unaweza kuonyesha tendo lililoanza na kuendelea; “kunung’unika” huwasilisha malalamiko yao ya chini chini na yenye lawama.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huunganisha kwa kawaida maneno yaliyofuata na tendo la kunung’unika.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: kwa mwanamume mwenye dhambi
  rationale: “Kwa” huonyesha kukaa nyumbani kwa mtu, huku “mwanamume mwenye dhambi” ikihifadhi kivumishi ἁμαρτωλός na jinsia ya nomino ἀνήρ.
- source_word: εἰσῆλθεν
  choice: ameingia
  rationale: 'Kauli hii ya malalamiko inaonyesha tendo lililokamilika lenye umuhimu wa sasa: Yesu ameingia nyumbani kwa Zakayo.'
- source_word: καταλῦσαι
  choice: kukaa
  rationale: Katika muktadha huu infinitivu humaanisha kukaa au kupata malazi kama mgeni; “kukaa” ni lugha ya sasa iliyo wazi bila kulazimisha maana ya kulala usiku.
theological_decisions:
- issue: Namna ya kuwasilisha sifa ya Zakayo iliyotolewa na umati
  choice: mwanamume mwenye dhambi
  alternative: mwenye dhambi
  rationale: Tafsiri hii huhifadhi muundo wa Kigiriki wa kivumishi pamoja na nomino ya kiume, na kuonyesha hukumu ya umati bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kunung’unika” ni neno linaloeleweka kwa kawaida na lina uzito unaofaa wa lawama ya umati; “jambo hilo” hufanya rejeleo lisilotajwa wazi katika Kigiriki lieleweke kwa ufasaha.
