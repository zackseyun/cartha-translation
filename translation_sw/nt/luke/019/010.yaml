  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu alikuja kutafuta na kuokoa kilichopotea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliopotea.” Usemi wa Kigiriki uko katika umoja wa jinsi ya kati na unaweza kueleweka kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: alikuja
  rationale: Kauli ya wakati uliopita ya ἔρχομαι imetafsiriwa kwa wakati uliopita wa kawaida, unaofaa katika muhtasari huu wa kusudi la kuja kwa Yesu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu au maelezo ya kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina ambalo Yesu alitumia kujitaja na lina mwangwi wa Danieli; limetafsiriwa moja kwa moja ili kuhifadhi maana zake za kimuktadha na kitheolojia.
- source_word: ζητῆσαι
  choice: kutafuta
  rationale: Kitenzi-jina hiki kinaeleza kusudi la kuja kwake na kinaonyesha utafutaji wa makusudi.
- source_word: σῶσαι
  choice: kuokoa
  rationale: Neno hili katika Luka lina maana pana ya wokovu, si uokoaji wa kimwili pekee; “kuokoa” huhifadhi upana huo na kupatana na wokovu unaotajwa katika mstari wa 9.
- source_word: τὸ ἀπολωλός
  choice: kilichopotea
  rationale: Kivumishi-tendo chenye kibainishi ni cha umoja na jinsi isiyo ya kiume wala ya kike, na kinaweza kutumiwa kwa maana ya jumla. “Kilichopotea” huhifadhi umoja na hali ya kuwa kimepotea bila kukifunga waziwazi kwa mtu mmoja au kundi.
theological_decisions:
- issue: Upeo na maana ya τὸ ἀπολωλός
  choice: kilichopotea
  alternative: watu waliopotea
  rationale: Muundo wa Kigiriki ni wa umoja lakini unaweza kuwa wa jumla. Tafsiri kuu huhifadhi umbo hilo na uwezekano wa kurejelea Zakayo katika muktadha wa karibu pamoja na utume mpana wa Yesu; tanbihi inaonyesha usomaji wa jumla unaowahusu watu bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa moja kwa moja, huku “Mwana wa Adamu” likihifadhiwa kama jina la Yesu linalotambulika.
