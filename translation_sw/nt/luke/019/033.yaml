  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: sw
  text: Walipokuwa wakimfungua mwana-punda, wamiliki wake[a] wakawaambia, “Kwa nini mnamfungua mwana-punda?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi zaidi, “mabwana wake.” Neno la Kigiriki ni wingi wa “bwana,” lakini hapa linamaanisha wamiliki wa mwana-punda.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων ... λύετε
  choice: walipokuwa wakimfungua ... mnamfungua
  rationale: Muundo wa kwanza unaonyesha tendo lililokuwa likiendelea wakati wamiliki waliposema, na kurudia kitenzi “fungua” kunahifadhi uhusiano wa maneno hayo mawili ya Kigiriki.
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi chepesi cha kuendeleza simulizi; mtiririko wa Kiswahili hauhitaji lazima “na” mwanzoni mwa sentensi.
- source_word: αὐτῶν
  choice: wa- (katika “walipokuwa”)
  rationale: Kiambishi cha nafsi ya tatu wingi kinarejelea wale wanafunzi wawili waliotajwa katika muktadha uliotangulia bila kuwaongeza kwa jina katika aya hii.
- source_word: πῶλον
  choice: mwana-punda
  rationale: Ingawa πῶλος kwa ujumla ni mnyama mchanga, muktadha uliotangulia unamtambulisha kuwa punda; “mwana-punda” ni wazi na ya kawaida katika Kiswahili.
- source_word: εἶπαν ... πρὸς αὐτούς
  choice: wakawaambia
  rationale: Kitenzi hiki cha Kiswahili kinawasilisha kitendo cha kusema pamoja na walengwa wake kwa njia ya asili, huku swali lenyewe likifuata moja kwa moja.
- source_word: οἱ κύριοι αὐτοῦ
  choice: wamiliki wake
  rationale: Wingi wa κύριος hapa unarejelea watu waliokuwa na haki ya umiliki juu ya mwana-punda, si cheo cha kitheolojia. “Wamiliki wake” ni wazi na ya kawaida.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika swali hili τί inauliza sababu ya tendo, hivyo “Kwa nini” inatoa maana ya nahau hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya κύριοι katika muktadha usio wa kitheolojia
  choice: wamiliki wake
  alternative: mabwana wake
  rationale: Hapa κύριοι ni watu wenye mwana-punda. “Wamiliki” huepuka kuleta kimakosa maana ya cheo “Bwana,” huku tanbihi ikihifadhi umbo la karibu zaidi na neno la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walipokuwa wakimfungua” ni muundo wa kawaida unaoonyesha wakati na tendo linaloendelea; “mwana-punda” hutambulisha aina ya mnyama kwa uwazi kutokana na muktadha.
