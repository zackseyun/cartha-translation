  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: sw
  text: 'Kwa maana nilikuwa nakuogopa, kwa kuwa wewe ni mtu mkali[a]: unachukua kile ambacho hukukiweka[b], na unavuna kile ambacho hukukipanda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgumu” au “mwenye masharti makali.”
    reason: Mbadala za kileksia za αὐστηρός; “mkali” huhifadhi sauti ya shtaka la mtumishi bila kutafsiri zaidi tabia ya bwana.
  - marker: b
    text: Kihalisi, “unachukua kile ambacho hukukiweka.” Katika muktadha huu wengine hutafsiri kwa ufafanuzi zaidi, “unachukua kile ambacho hukuwa umeweka” au “unakusanya kile ambacho hukuwa umeweka amana.”
    reason: Kigiriki hutumia kitenzi cha jumla ‘kuweka’; maana mahususi ya kibiashara inawezekana lakini haijaelezwa wazi.
lexical_decisions:
- source_word: ἐφοβούμην
  choice: nilikuogopa
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha hali ya woga iliyodumu; “nilikuogopa” ni Kiswahili cha kawaida na huonyesha wazi mhusika aliyeogopwa.
- source_word: γάρ
  choice: kwa maana
  rationale: Huunganisha kauli hii na iliyotangulia kwa kutoa sababu ya maelezo ya mtumishi.
- source_word: αὐστηρὸς
  choice: mkali
  rationale: “Mkali” huwasilisha maana ya mtu mwenye masharti magumu au asiye na upole bila kupunguza nguvu ya shtaka la mtumishi.
- source_word: αἴρεις
  choice: unachukua
  rationale: Ni tafsiri pana na ya moja kwa moja ya tendo la kuchukua, bila kuongeza dhana mahususi ya kibiashara.
- source_word: ὃ οὐκ ἔθηκας
  choice: kile ambacho hukukiweka
  rationale: Huhifadhi picha halisi ya ‘kuweka’ katika Kigiriki na kuepuka kuibana maana kuwa ‘kuweka akiba’ au ‘kuweka amana.’
- source_word: θερίζεις
  choice: unavuna
  rationale: Huhifadhi taswira ya kilimo na ulinganifu wa kimethali kati ya kuvuna na kupanda.
- source_word: ὃ οὐκ ἔσπειρας
  choice: kile ambacho hukukipanda
  rationale: “Kupanda” ni usemi wa kawaida wa Kiswahili kwa kutawanya au kuweka mbegu, na huendana kiasili na “kuvuna.”
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika Kiswahili “mtu” ni neno la kawaida na la heshima kwa mhusika huyu wa kiume; jinsia yake tayari iko wazi katika muktadha wa mfano.
theological_decisions:
- issue: Iwapo maelezo ya mtumishi kuhusu bwana yapunguzwe ukali ili kulinda taswira ya bwana katika mfano
  choice: Kuhifadhi shtaka la mtumishi kwa neno “mkali” bila kulainisha
  alternative: Kutumia neno lenye ukali mdogo kama “mwenye masharti”
  rationale: Haya ni maneno ya mtumishi mwenyewe. Tafsiri inapaswa kuhifadhi nguvu na mvutano wa shtaka lake bila kuamua kimyakimya kama tathmini hiyo ni kweli kuhusu bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza ulinganifu wa “unachukua … na unavuna …” na huhifadhi sauti ya moja kwa moja ya mtumishi.
