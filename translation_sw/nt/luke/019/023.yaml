  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: sw
  text: Na kwa nini hukuweka fedha yangu benki[a]? Nami nilipokuja, ningeipokea pamoja na riba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukuweka fedha yangu kwa wabenki”; kihalisi, “hukutoa fedha yangu kwenye meza.”
    reason: Kirai cha Kigiriki hurejelea meza ya shughuli za kibenki; “benki” ni tafsiri ya kiutendaji ya kisasa.
lexical_decisions:
- source_word: διὰ τί
  choice: kwa nini
  rationale: Ni namna ya kawaida ya Kiswahili ya kuuliza sababu, huku ikidumisha sauti ya kukemea.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: hukuweka ... benki
  rationale: Ingawa kirai hiki kihalisi kinahusu kuweka fedha juu ya meza, katika muktadha wa kifedha τράπεζα ni meza au shughuli ya wabadili fedha. ‘Kuweka benki’ huwasilisha tendo lililokusudiwa kwa Kiswahili cha sasa.
- source_word: μου τὸ ἀργύριον
  choice: fedha yangu
  rationale: ἀργύριον inaweza kumaanisha fedha ya madini au pesa; hapa ‘fedha’ ni ya asili na inafaa muktadha wa kibiashara bila kusisitiza isivyofaa kwamba ni madini ya fedha.
- source_word: κἀγὼ ἐλθὼν
  choice: Ndipo, nilipokuja
  rationale: Kirai cha kishirikishi kimetolewa kama kishazi cha wakati kinachoeleweka kwa urahisi; ‘ndipo’ kinaonyesha matokeo yaliyotarajiwa bila kufanya tendo la kuja lenyewe kuwa la masharti.
- source_word: σὺν τόκῳ
  choice: pamoja na riba
  rationale: τόκος hapa ni riba inayopatikana kutokana na fedha iliyowekwa; ‘riba’ ndilo neno mahususi na la kawaida katika Kiswahili.
- source_word: αὐτὸ ἔπραξα
  choice: ningeichukua
  rationale: πράσσω hapa ina maana ya kudai au kukusanya kiasi kinachostahili. ‘Ningeichukua’ ni ya kawaida na, ikiunganishwa na ‘pamoja na riba,’ inaonyesha kuchukua mtaji na riba yake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Benki’ limetumiwa katika maandiko kwa uwazi wa kiutendaji, huku tanbihi ikihifadhi mazingira ya kale na maana halisi ya kirai.
