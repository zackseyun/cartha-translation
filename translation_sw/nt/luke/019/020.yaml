id: LUK.19.20
reference: Luke 19:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: sw
  text: Yule mwingine akaja na kusema, “Bwana, tazama, hii hapa mina yako, ambayo nilikuwa nimeihifadhi katika kitambaa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika leso.” Neno la Kigiriki σουδάριον linamaanisha kitambaa ambacho mara nyingi kilitumiwa kufutia uso au kama leso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: yule mwingine
  rationale: Katika mfululizo wa watumishi, maneno haya yanamtambulisha mtumishi mwingine kwa kumtofautisha na wale waliotangulia bila kuongeza maelezo yasiyokuwapo.
- source_word: ἦλθεν λέγων
  choice: akaja na kusema
  rationale: Muundo huu wa Kiswahili unasimulia kwa kawaida kuja kwake na kuanzishwa kwa maneno yake, huku ukihifadhi mpangilio wa matukio katika Kigiriki.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni neno la kawaida na lenye heshima la kumwita mwenye mamlaka; linafaa kwa bwana wa mfano huu na pia halifuti mwangwi mpana wa κύριος.
- source_word: ἰδοὺ
  choice: tazama, hii hapa
  rationale: “Tazama” huvuta fikira, na “hii hapa” huonyesha kwamba mtumishi anamkabidhi au anamwonyesha bwana mina yake.
- source_word: ἡ μνᾶ σου
  choice: mina yako
  rationale: “Mina” huhifadhi jina la kipimo cha fedha cha kale badala ya kutumia thamani ya kisasa inayoweza kupotosha.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: ambayo nilikuwa nimeihifadhi
  rationale: Muundo huu unaonyesha hali iliyoendelea ya kuiweka mina mahali salama, badala ya kutaja tu tendo la wakati mmoja la kuiweka.
- source_word: ἐν σουδαρίῳ
  choice: katika kitambaa
  rationale: “Kitambaa” ni neno pana na la kawaida linalolingana na σουδάριον bila kulazimisha picha maalumu ya kitu cha kisasa; maana mahususi zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya κύριος katika usemi wa moja kwa moja ndani ya mfano
  choice: Bwana
  alternative: Mkuu wangu
  rationale: Mhusika anamwita mwenye mamlaka juu yake, kwa hiyo “Bwana” ni ya kawaida katika muktadha huu na huhifadhi pia uwezekano wa mwangwi mpana wa neno κύριος bila kuingiza dai la moja kwa moja la kikristo katika kinywa cha mhusika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima inayofaa simulizi la mfano. “Hii hapa” ni ya mazungumzo lakini si ya kiholela, na hufanya tendo la kuonyesha mina lieleweke wazi.
