  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: sw
  text: Walipokuwa wakiyasikiliza mambo hayo, Yesu akaendelea kusema, akawaambia mfano, kwa sababu alikuwa karibu na Yerusalemu na wao walidhani kwamba ufalme wa Mungu ulikuwa karibu kuonekana mara moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulikuwa karibu kudhihirishwa mara moja.” Kitenzi kinaweza kumaanisha kuwa kitu kinaonekana au kinakuwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Walipokuwa wakiyasikiliza mambo hayo
  rationale: Muundo huu unaonyesha kwamba kusikiliza kulikuwa kukiendelea wakati Yesu alipoanza kusema mfano.
- source_word: προσθεὶς εἶπεν
  choice: Yesu akaendelea kuwaambia
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayoonyesha kwamba aliendelea na mazungumzo; jina “Yesu” linaweka mhusika wazi kwa msomaji.
- source_word: παραβολὴν
  choice: mfano
  rationale: “Mfano” ni istilahi ya kawaida na inayoeleweka kwa aina hii ya mafundisho katika Injili.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: kwa sababu alikuwa karibu na Yerusalemu
  rationale: Muundo wa Kigiriki unaeleza sababu na unamhusu Yesu kuwa karibu na Yerusalemu.
- source_word: δοκεῖν αὐτοὺς
  choice: nao walidhani
  rationale: “Walidhani” huonyesha maoni au matarajio yao bila kuyathibitisha kuwa ya kweli.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: Huhifadhi msisitizo wa kwamba walitarajia jambo hilo litokee bila kuchelewa.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: ulikuwa karibu kuonekana
  rationale: “Ulikuwa karibu” huonyesha matarajio ya tukio lililo karibu, na “kuonekana” huhifadhi wazo la kuwa dhahiri bila kufafanua namna ya udhihirisho huo.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri sahihi na ya kawaida ya usemi huu, inayodumisha mwendelezo wa istilahi katika Luka.
theological_decisions:
- issue: Namna ambayo ufalme wa Mungu ulitarajiwa kuonekana
  choice: Kusema kwamba ufalme wa Mungu “ulikuwa karibu kuonekana mara moja” bila kueleza aina ya kuonekana huko.
  alternative: Kusema kwamba ufalme ungeanzishwa kisiasa au ungefunuliwa kikamilifu wakati wa mwisho.
  rationale: Aya inaeleza matarajio yao ya udhihirisho wa karibu, lakini haifafanui kama ulikuwa wa kisiasa, wa kiroho, au wa matukio ya mwisho; tafsiri haiongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida huku ikihifadhi uhusiano wa sababu mbili na matarajio ya kutokea mara moja.
