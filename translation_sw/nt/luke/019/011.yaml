- from: Walipokuwa wakiyasikiliza mambo hayo, Yesu akaendelea kuwaambia mfano, kwa sababu alikuwa karibu na Yerusalemu, nao walidhani kwamba ufalme wa Mungu ulikuwa karibu kuonekana mara moja.[a]
  to: Walipokuwa wakiyasikiliza mambo hayo, Yesu akaendelea kusema, akawaambia mfano, kwa sababu alikuwa karibu na Yerusalemu na wao walidhani kwamba ufalme wa Mungu ulikuwa karibu kuonekana mara moja.[a]
  rationale: The revision changes only the idiomatic rendering of προσθεὶς εἶπεν παραβολήν. It retains the source's ongoing hearing, causal relationship, unqualified expectation concerning the kingdom, imminence, and immediate timing.
