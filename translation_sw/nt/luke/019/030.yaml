  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: sw
  text: akiwaambia, “Nendeni katika kijiji kilicho mbele yenu. Mnapoingia humo, mtamkuta mwana-punda amefungwa, ambaye hakuna mtu yeyote aliyewahi kuketi juu yake. Mfungueni na mleteni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμην
  choice: kijiji
  rationale: Ni neno la kawaida na sahihi kwa makazi madogo yanayotajwa katika muktadha huu.
- source_word: πῶλον
  choice: mwana-punda
  rationale: Ingawa πῶλος inaweza kumaanisha kwa ujumla mnyama mchanga wa jamii ya farasi, muktadha wa kuingia Yerusalemu unabainisha mwana-punda; Kiswahili cha kawaida huhitaji kulitaja wazi.
- source_word: δεδεμένον
  choice: amefungwa
  rationale: Huwasilisha hali inayotokana na kitendo cha kufunga, kama ilivyo katika kauli timilifu ya Kigiriki.
- source_word: ἐκάθισεν ἐφ’ ὃν
  choice: ambaye hajawahi kupandwa
  rationale: Hii ndiyo kauli ya asili na wazi katika Kiswahili kwa mnyama ambaye hakuna mtu aliyewahi kuketi juu yake.
- source_word: λύσαντες ... ἀγάγετε
  choice: Mfungueni na kumleta hapa
  rationale: Vitenzi viwili vinahifadhi mfuatano wa kumfungua kisha kumleta; “hapa” inaeleza kwa kawaida uelekeo wa ἀγάγετε kwa wazungumzaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa sentensi mbili ndani ya nukuu bila kuondoa maana ya chanzo. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
