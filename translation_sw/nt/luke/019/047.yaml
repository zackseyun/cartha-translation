  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: sw
  text: Naye alikuwa akifundisha kila siku hekaluni. Lakini wakuu wa makuhani, waandishi, na watu mashuhuri wa taifa[a] walikuwa wakitafuta kumwangamiza,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa watu.” Kigiriki kinasema kihalisi, “walio wa kwanza wa watu,” yaani watu wenye hadhi au ushawishi mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: alikuwa akifundisha
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au kurudiwa wakati uliopita.
- source_word: τὸ καθ’ ἡμέραν
  choice: kila siku
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wazi tendo lililofanyika siku baada ya siku.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hapa hurejelea eneo la hekalu kwa ujumla; “hekaluni” ni tafsiri fupi na ya kawaida bila kulifanya kuwa patakatifu pa ndani pekee.
- source_word: οἱ ἀρχιερεῖς
  choice: wakuu wa makuhani
  rationale: Hili ni jina la kawaida la kundi la viongozi wa ukuhani, si madai kwamba kulikuwa na makuhani wakuu wengi waliokuwa wakishika cheo kimoja kwa wakati mmoja.
- source_word: οἱ γραμματεῖς
  choice: waandishi
  rationale: Tafsiri hii inafuata neno la Kigiriki kwa ukaribu na kudumisha cheo cha kihistoria; “walimu wa sheria” lingekuwa fafanuzi zaidi.
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Wakati usiotimilika wa kitenzi unaonyesha jitihada au nia iliyoendelea.
- source_word: ἀπολέσαι
  choice: kumwangamiza
  rationale: Neno linaweza kumaanisha kuharibu au kuua. “Kumwangamiza” huhifadhi upana wake huku muktadha ukionyesha nia yenye madhara makubwa dhidi ya Yesu.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: watu mashuhuri miongoni mwa watu
  rationale: πρῶτοι, kihalisi “wa kwanza,” hapa huonyesha watu wenye hadhi au ushawishi. Tafsiri hii ni ya asili kwa Kiswahili na haiwalazimishi kuwa viongozi wenye nyadhifa rasmi.
theological_decisions:
- issue: Maana ya οἱ πρῶτοι τοῦ λαοῦ
  choice: watu mashuhuri miongoni mwa watu
  alternative: viongozi wa watu
  rationale: Kigiriki kinaweza kurejelea watu wenye hadhi au ushawishi, si lazima viongozi rasmi. Maandishi makuu yanahifadhi wazo la umashuhuri, na tanbihi inaonyesha uwezekano mwingine.
- issue: Nguvu ya ἀπολέσαι
  choice: kumwangamiza
  alternative: kumuua
  rationale: Muktadha unaelekea kwenye nia ya kumuua Yesu, lakini neno lenyewe lina maana pana zaidi ya kuangamiza; kwa hiyo tafsiri haifungi kimya kimya maana hiyo kwenye tendo la kuua pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua. Koma ya mwisho imehifadhiwa kwa sababu aya hii inaendelea kisintaksia katika aya inayofuata.
