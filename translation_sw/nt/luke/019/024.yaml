  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: sw
  text: Kisha akawaambia waliosimama karibu, “Mnyang’anyeni mina hiyo, mkampe yule aliye na mina kumi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεστῶσιν
  choice: wale waliokuwa wamesimama karibu
  rationale: Kirai hiki cha kisifa chenye kibainishi kinawarejelea watu waliokuwapo hapo karibu; tafsiri hii inadumisha picha halisi ya kusimama karibu na ni ya kawaida katika Kiswahili.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Mnyang’anyeni
  rationale: Katika muktadha huu αἴρω pamoja na ἀπό ina maana ya kuondoa au kuchukua kutoka kwa mtu. ‘Mnyang’anyeni’ huwasilisha kwa ufupi amri ya kumwondolea alichokuwa nacho, bila kudokeza kuinua.
- source_word: μνᾶν
  choice: mina
  rationale: μνᾶ ni kipimo cha kale cha fedha. Kutumia ‘mina’ huhifadhi mazingira ya kihistoria bila kukipa thamani ya sarafu ya kisasa isiyo sawa.
- source_word: δότε
  choice: mkampe
  rationale: Amri ya wingi ya δίδωμι inadai kuhamisha kitu kwa mwingine; ‘mkampe’ ni ya kawaida na huunganisha vizuri amri hii na ile iliyotangulia.
- source_word: τῷ ... ἔχοντι
  choice: yule aliye na
  rationale: Kirai cha kisifa chenye kibainishi kinatumika kama nomino. ‘Yule aliye na’ ni cha asili na hakiongezi jinsia ambayo haijaelezwa wazi katika muundo huu.
- source_word: τὰς δέκα μνᾶς
  choice: mina kumi
  rationale: Hurejelea kiasi maalumu kilichotajwa awali. Katika Kiswahili umaalumu huo unaeleweka kupitia ‘yule aliye na,’ hivyo hakuna haja ya kuongeza neno lisilo la kawaida kama ‘zile’.
theological_decisions:
- issue: Uwasilishaji wa μνᾶ kama kipimo cha fedha
  choice: mina
  alternative: pauni
  rationale: ‘Mina’ huhifadhi jina la kipimo cha kale cha fedha katika maandishi ya Kigiriki, ilhali ‘pauni’ inaweza kueleweka kimakosa kuwa sarafu au uzito wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnyang’anyeni’ ni amri ya wingi inayofaa kwa wale waliokuwa wamesimama karibu; ‘mina’ imehifadhiwa kama istilahi ya kihistoria na kufafanuliwa katika tanbihi.
