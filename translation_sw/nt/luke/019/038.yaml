base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: sw
  text: wakisema, “Amebarikiwa Mfalme[a] ajaye kwa jina la Bwana! Amani mbinguni[b] na utukufu juu kabisa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri hufuata maneno yaliyozoeleka zaidi, “Amebarikiwa ajaye kwa jina la Bwana,” lakini Luka anataja waziwazi “Mfalme.”
    reason: alternative_reading
  - marker: b
    text: 'Maneno haya yana mwangwi wa Luka 2:14, lakini mahali pa amani pamebadilishwa: kule ni “amani duniani”; hapa ni “amani mbinguni.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha tamko hili na tendo la umati katika mstari uliotangulia.
- source_word: Εὐλογημένος
  choice: Amebarikiwa
  rationale: Huhifadhi maana ya tamko la baraka na mwangwi wa lugha ya Zaburi bila kuligeuza kuwa ombi la baraka.
- source_word: ὁ ἐρχόμενος
  choice: ajaye
  rationale: Ni usemi mfupi na wa kawaida wa Kiswahili unaohifadhi wazo la yule anayekuja.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: Luka anatumia wazi nomino ya kifalme; imehifadhiwa ili msisitizo huo usifutwe.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Ni nahau ya Kiswahili inayoeleweka, inayohifadhi wazo la kuja kwa mamlaka na uwakilishi wa Bwana.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Amani mbinguni
  rationale: 'Huhifadhi kishazi kifupi kisicho na kitenzi na mahali palipotajwa wazi katika matini: mbinguni, si duniani.'
- source_word: δόξα ἐν ὑψίστοις
  choice: utukufu juu kabisa
  rationale: Huwasilisha kwa lugha ya sasa nahau inayorejelea makao ya juu kabisa huku ikihifadhi muundo wa kishairi.
theological_decisions:
- issue: Tamko la kifalme lenye maana ya Kimasihi
  choice: Neno βασιλεὺς limetafsiriwa wazi kuwa “Mfalme.”
  alternative: “Amebarikiwa ajaye kwa jina la Bwana.”
  rationale: Matini ya Luka inamtaja Mfalme waziwazi; kuliondoa neno hilo kungepunguza msisitizo wa kifalme wa kifungu.
- issue: Uhusiano na Luka 2:14
  choice: “Amani mbinguni” imehifadhiwa kama ilivyo katika matini.
  alternative: “Amani duniani.”
  rationale: Luka 19:38 inasema “mbinguni.” Tafsiri haikupatanishwa kimyakimya na Luka 2:14, bali tofauti na mvutano wa kimatini vimehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tamko umewekwa mfupi na wa kishairi; “ajaye” na “juu kabisa” ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kupoteza uzito wa kifungu.
