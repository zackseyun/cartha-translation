  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: sw
  text: Yesu akamwambia, “Leo wokovu umeifikia nyumba hii[a], kwa sababu yeye pia ni mwana wa Abrahamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa nyumba hii.” Neno la Kigiriki linaweza kumaanisha nyumba yenyewe au watu wa nyumbani wanaohusishwa nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Kiunganishi δέ ni chepesi na katika simulizi la Kiswahili kinaweza kuwakilishwa kwa mfuatano wa kitenzi cha -ka-. πρὸς αὐτόν imehifadhiwa kwa kiambishi cha yambwa -mw- bila kuongeza jina la Zakayo.
- source_word: Σήμερον
  choice: Leo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja, nayo inadumisha msisitizo wa neno hili lililowekwa mwanzoni mwa kauli.
- source_word: σωτηρία
  choice: wokovu
  rationale: Neno hili linahifadhi uzito mpana wa σωτηρία katika Luka kuliko maneno yanayoweza kumaanisha tu kuokolewa katika hatari fulani.
- source_word: τῷ οἴκῳ τούτῳ
  choice: nyumba hii
  rationale: οἶκος inaweza kumaanisha jengo au watu wa nyumbani. 'Nyumba hii' inadumisha picha ya neno la Kigiriki, huku tanbihi ikieleza maana nyingine inayowezekana.
- source_word: ἐγένετο
  choice: umeifikia
  rationale: Katika muundo huu, 'umeifikia' ni Kiswahili cha kawaida kinachoonyesha kwamba wokovu umekuja kwa nyumba hiyo, bila kutumia tafsiri ngumu ya neno kwa neno kama 'umetokea.'
- source_word: καθότι
  choice: kwa sababu
  rationale: Inaonyesha wazi sababu inayotolewa na kauli inayofuata.
- source_word: καὶ αὐτός
  choice: yeye pia
  rationale: Inahifadhi msisitizo wa ujumuishaji uliomo katika καί pamoja na kiwakilishi chenyewe.
- source_word: υἱὸς Ἀβραάμ
  choice: mwana wa Abrahamu
  rationale: Inahifadhi nahau ya asili na mwangwi wake wa utambulisho na agano, badala ya kuifafanua moja kwa moja kuwa 'mzao.'
theological_decisions:
- issue: Maana ya “mwana wa Abrahamu”
  choice: Nahau imehifadhiwa bila kuamua ikiwa inamaanisha ukoo wa kimwili, ushirika wa kiimani na Abrahamu, au yote mawili.
  alternative: “mzao wa Abrahamu” au “mshiriki wa imani ya Abrahamu”
  rationale: Aya yenyewe haibainishi maana moja pekee; kuacha nahau kama ilivyo kunadumisha mvutano wa kiteolojia na kuruhusu muktadha wa Luka kuieleza.
- issue: Mhusika anayerejelewa na “yeye pia”
  choice: Kiwakilishi kimehifadhiwa kama kilivyo katika Kigiriki.
  alternative: Kutaja “Zakayo” moja kwa moja
  rationale: Kutaja jina kungerahisisha rejeo lakini kungeongeza neno lisilokuwapo katika aya hii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi 'akamwambia' ni wa kawaida na wenye mtiririko mzuri; 'wokovu' na 'mwana wa Abrahamu' huhifadhi uzito wa kiteolojia bila kuongeza ufafanuzi wa kimadhehebu.
