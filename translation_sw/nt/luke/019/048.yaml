  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: sw
  text: Nao hawakuweza kupata la kufanya[a], kwa maana watu wote walikuwa wakimsikiliza kwa hamu kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuweza kujua wafanye nini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: hawakupata
  rationale: Kauli ya wakati uliopita usiotimilika pamoja na ukanushi inaonyesha kwamba waliendelea kushindwa kupata njia ya kutenda; “hawakupata” ni ya kawaida na huwasilisha kushindwa huko katika Kiswahili.
- source_word: τὸ τί ποιήσωσιν
  choice: la kufanya
  rationale: Muundo huu unaeleza jambo walilokuwa wakitafuta, yaani hatua ambayo wangeweza kuchukua. “La kufanya” ni usemi wa kawaida unaohifadhi wazo hilo bila kuongeza wajibu usiotajwa.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: kwa sababu watu wote
  rationale: γάρ inatoa sababu, hivyo “kwa sababu” inaweka wazi uhusiano huo. λαός pamoja na ἅπας hapa ni “watu wote.”
- source_word: ἐξεκρέματο αὐτοῦ
  choice: walimsikiliza kwa makini sana
  rationale: Kitenzi hiki pamoja na αὐτοῦ ni nahau ya kumwelekea mtu kwa usikivu mkubwa na wa hamu. Tafsiri hii ni ya asili katika Kiswahili na muktadha wa ἀκούων unaifanya maana hiyo iwe wazi.
- source_word: ἀκούων
  choice: walimsikiliza
  rationale: Kishirikishi cha wakati wa sasa kinaonyesha kitendo kinachoendelea ambacho kwacho watu walimwelekea Yesu kwa makini; kimeunganishwa kwa kawaida na nahau iliyotangulia.
