base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: sw
  text: Basi akakimbia mbele, akapanda juu ya mkuyu[a] ili amwone, kwa sababu Yesu alikuwa karibu kupita njia ile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usahihi zaidi, mti wa mkuyu-misri (sycamore-fig).
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: akakimbia mbele
  rationale: Kirai hiki kinaonyesha kukimbia hadi kufika mbele; Kiswahili cha kawaida hakihitaji kurudia wazo hilo kwa maneno mengine.
- source_word: ἀνέβη ἐπὶ
  choice: kupanda juu ya
  rationale: Kitenzi kinaeleza kwenda juu au kupanda, na hapa kinahusu kupanda mti.
- source_word: συκομορέαν
  choice: mkuyu
  rationale: Neno hili humaanisha mti aina ya Ficus sycomorus; “mkuyu” ni jina la Kiswahili linaloeleweka, huku ufafanuzi sahihi zaidi wa kibotania ukihifadhiwa katika tanbihi.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: ili amwone
  rationale: Muundo huu unaonyesha kusudi la Zakayo kupanda mti.
- source_word: ἐκείνης
  choice: njia ile
  rationale: Kiwakilishi hiki kinaelekea kurejelea njia au mahali palipoeleweka katika muktadha; “njia ile” ni ya asili bila kubainisha barabara mahususi.
- source_word: ἤμελλεν διέρχεσθαι
  choice: alikuwa karibu kupita
  rationale: μέλλω pamoja na kitenzi-jina huonyesha tendo linalotarajiwa kutokea karibuni.
theological_decisions:
- issue: Utambulisho wa mtendaji katika ἤμελλεν διέρχεσθαι
  choice: Yesu alikuwa karibu kupita
  alternative: alikuwa karibu kupita
  rationale: Kiswahili kingeweza kufanya “alikuwa” ionekane kumrejelea Zakayo; kutaja Yesu kunaondoa utata wa kisarufi bila kubadili mrejeleo wa wazi wa αὐτόν katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na lugha yenye staha. Kiunganishi “Basi” kinaendeleza simulizi, na mfuatano wa “akakimbia ... na kupanda” unasomeka kwa urahisi.
