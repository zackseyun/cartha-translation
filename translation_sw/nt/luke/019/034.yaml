  text: And they said[a], “The Lord has need of it.”
translation:
  language: sw
  text: Nao wakasema[a], “Bwana anamhitaji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwenye mwana-punda anamhitaji,” ikiwa κύριος inaeleweka katika maana ya mwenye au bwana wa mwana-punda, badala ya kuwa cheo cha Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi, na οἱ hapa inasimama kama kiwakilishi cha wale waliotajwa; “Nao” huwasilisha yote mawili kwa Kiswahili cha kawaida bila kusisitiza utofauti.
- source_word: εἶπαν
  choice: wakasema
  rationale: Kitenzi hiki ni aoristi ya λέγω na maana yake ya moja kwa moja ni “walisema”; katika mtiririko wa simulizi, “wakasema” ni ya asili na haiongezi wazo la kujibu lisilo wazi katika kitenzi chenyewe.
- source_word: ὅτι
  choice: imewakilishwa kwa alama za kunukuu
  rationale: ὅτι inaanzisha maneno ya moja kwa moja; katika Kiswahili, alama za kunukuu zinatosha bila kutafsiri kiunganishi hicho kwa neno tofauti.
- source_word: Ὁ κύριος
  choice: Bwana
  rationale: κύριος mara nyingi ni cheo “Bwana,” hasa kwa Yesu katika Luka. Hata hivyo, inaweza pia kumaanisha mwenye kitu au mkuu; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: αὐτοῦ
  choice: -m- katika “anamhitaji”
  rationale: Kiwakilishi kinarejelea mwana-punda aliyetajwa. Kiswahili hutumia kiambishi cha yambwa cha ngeli ya viumbe hai, hivyo “anamhitaji” ni cha asili na hakimaanishi kwamba mnyama ni mtu.
- source_word: χρείαν ἔχει
  choice: anamhitaji
  rationale: Nahau ya Kigiriki ina maana ya “ana haja naye/anamhitaji.” “Anamhitaji” ni Kiswahili cha sasa, wazi, na cha kawaida, huku kikihifadhi maana kamili ya nahau hiyo.
theological_decisions:
- issue: Mrejelewa wa κύριος katika jibu la wanafunzi
  choice: Bwana, ikieleweka katika muktadha kuwa Yesu
  alternative: Mwenyewe, yaani mwenye mwana-punda
  rationale: Katika muktadha wa Luka, maneno haya ndiyo maelezo ambayo Yesu aliwaagiza wanafunzi wake watoe, na Luka hutumia κύριος kumrejelea Yesu. Kwa kuwa neno hilo pia linaweza kumaanisha mwenye kitu au mkuu, maana hiyo mbadala haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao wakasema” hudumisha mtiririko wa simulizi; “anamhitaji” ni ya asili zaidi kuliko “ana haja naye.”
