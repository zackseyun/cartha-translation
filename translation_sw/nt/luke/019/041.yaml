  to: Alipokaribia, alipouona mji, akauulilia.
  rationale: 'The revision retains the concise narrative style and does not add “Yerusalemu,” which the Greek leaves implicit. It makes the referent of ἐπ’ αὐτήν explicit through normal Swahili noun-class agreement: mji → -u- in akauulilia. No footnote is needed, since Swahili does not grammatically distinguish the possible feminine personification carried by the Greek pronoun.'
