review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ approach, his seeing the city, and his weeping. However, “akaulilia” leaves the object of the applicative verb unexpressed; the Greek explicitly has ἐπ’ αὐτήν (“over/for it”), referring to the city.
  naturalness: The short narrative sequence is natural, but explicitly marking the city as the object of “kulilia” is clearer and more idiomatic in this context. “Alipouona” also gives a smooth Swahili rendering of the participial clause.
  terminology: “Mji” is the appropriate concise equivalent for πόλις. Swahili noun-class agreement in “akauulilia” refers naturally to mji without introducing the Greek grammatical-feminine/personification question.
  issues:
  - severity: medium
    issue: The object of “akaulilia” is not explicitly represented.
    rationale: The source explicitly states that he wept over the city. Adding the class-3 object marker -u- in “akauulilia” clearly preserves this reference and avoids any reading in which he simply began to weep without the city being the expressed object.
  revised_text: Alipokaribia, alipouona mji, akauulilia.
