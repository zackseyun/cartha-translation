  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: sw
  text: Alipokaribia, alipouona mji, akauulilia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Alipokaribia
  rationale: Kitenzi ἐγγίζω humaanisha kukaribia au kuja karibu. Muundo huu wa wakati unaonyesha tukio lililotangulia tendo kuu bila kutaja kitu alichokikaribia, kama ilivyo katika Kigiriki.
- source_word: ἰδὼν τὴν πόλιν
  choice: aliuona mji
  rationale: Kivumishi-tendo cha Kigiriki kinaweza kueleza tendo la wakati mmoja au lililotangulia kidogo. Kiswahili cha kawaida hutumia kitenzi kamili hapa, huku kiambishi cha yambwa -u- kikirejelea mji. Neno πόλις limetafsiriwa kwa ufupi kuwa “mji” kwa sababu muktadha tayari unaonyesha kuwa ni Yerusalemu.
- source_word: ἔκλαυσεν ἐπ’ αὐτήν
  choice: akaulilia
  rationale: κλαίω pamoja na ἐπί na hali ya kushutumiwa hueleza kumlilia mtu au kukililia kitu. “Akaulilia” ni usemi wa asili na wenye hadhi unaoonyesha huzuni yake kwa ajili ya mji bila kuongeza kiwango cha kilio ambacho hakijaelezwa wazi.
theological_decisions:
- issue: Iwapo jinsia ya kisarufi ya πόλις na αὐτήν ihifadhiwe kama uhuishaji wa Yerusalemu
  choice: Kutumia “akaulilia,” likirejelea “mji” kwa ngeli yake ya kawaida
  alternative: Kuutaja mji kana kwamba ni mwanamke
  rationale: Katika Kigiriki, αὐτήν ni ya kike kwa sababu inapatana kisarufi na πόλις; hilo peke yake halithibitishi uhuishaji. Kiswahili hutumia upatanisho wa ngeli ya “mji,” si jinsia ya kiume au ya kike, hivyo tafsiri hii huhifadhi rejeo bila kulazimisha uhuishaji wala kuuondoa huzuni ya Yesu kwa Yerusalemu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi ni mfupi na wa kisimulizi; “akaulilia” huunganisha kwa kawaida kilio na mji uliotajwa.
