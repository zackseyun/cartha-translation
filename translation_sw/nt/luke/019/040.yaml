  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: sw
  text: Akajibu akasema, “Ninawaambia, hawa wakinyamaza, mawe yatapaza sauti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Akajibu
  rationale: Kirai hiki kinaonyesha kwamba Yesu alisema kwa kuitikia yaliyotangulia. Kiswahili cha kawaida huunganisha umbo shirikishi na kitenzi cha kusema kwa ‘Akajibu,’ huku maneno yanayofuata yakionyesha wazi kwamba alisema.
- source_word: Λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Hii ni kauli ya kusisitiza yenye mamlaka. ‘Ninawaambia’ ni ya asili katika Kiswahili cha sasa na inadumisha mkazo wa usemi wa moja kwa moja.
- source_word: οὗτοι
  choice: hawa
  rationale: Kiwakilishi hiki cha kuonyesha kinawarejelea watu waliokuwa wakimsifu katika muktadha. ‘Hawa’ hakiongezi utambulisho usiotajwa wazi katika mstari.
- source_word: σιωπήσουσιν
  choice: wakinyamaza
  rationale: Katika sentensi sharti inayoanzishwa na ἐὰν, ‘wakinyamaza’ huonyesha kwa kawaida hali ya wale wanaoacha kusema au kupaza sauti.
- source_word: οἱ λίθοι
  choice: mawe
  rationale: ‘Mawe’ ni tafsiri ya moja kwa moja na ya kawaida ya λίθοι; Kiswahili hakihitaji kibainishi kinacholingana na makala ya Kigiriki.
- source_word: κράξουσιν
  choice: yatapaza sauti
  rationale: Kitenzi κράζω humaanisha kutoa sauti kubwa au kulia kwa nguvu. ‘Yatapaza sauti’ huhifadhi taswira hai bila kuieleza zaidi.
theological_decisions:
- issue: Ikiwa kauli kuhusu mawe ielezwe wazi kuwa sitiari au muujiza
  choice: Kudumisha taswira halisi ya maneno ‘mawe yatapaza sauti’ bila ufafanuzi wa kiutafsiri.
  alternative: Kusema kwamba mawe yangeshuhudia kwa njia ya sitiari, au kwamba uumbaji wote ungemsifu Mungu.
  rationale: Kigiriki kinatoa taswira kali bila kueleza ikiwa ni chuku, lugha ya kinabii, au uwezekano wa muujiza. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi na wenye nguvu kama chanzo; hakuna istilahi ya kimadhehebu iliyoongezwa.
