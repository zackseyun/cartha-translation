  verdict: revise
  source_fidelity: The draft correctly conveys entry into Jericho and the imperfective sense of passing through it. However, “katikati ya mji huo” adds the specific idea of passing through the middle/center of the city, which διέρχομαι does not require.
  naturalness: “Kisha akaingia Yeriko, akawa anapita...” is understandable, but “Naye, baada ya kuingia Yeriko, alikuwa akipita humo” more naturally represents the participle-main-verb relationship and the ongoing past action in standard East African Swahili.
  terminology: “Yeriko” is the standard Swahili form. No theological terminology is involved.
  issues:
  - severity: medium
    issue: “katikati ya mji huo” is over-specific.
    rationale: The Greek διήρχετο with τὴν Ἰεριχώ means that he was passing through Jericho; it does not state that he went through its center.
  - severity: low
    issue: The footnote’s wording and rationale retain the unnecessary “katikati” implication indirectly by contrasting a freer main text with a more literal alternative.
    rationale: A revised footnote should present a genuine formal alternative without suggesting an added spatial detail.
