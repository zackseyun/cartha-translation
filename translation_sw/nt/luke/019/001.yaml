  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: sw
  text: Naye, baada ya kuingia Yeriko, alikuwa akipita humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa muundo ulio karibu zaidi na Kigiriki, “Na baada ya kuingia, alikuwa akipita katika Yeriko.”
    reason: Mbadala huu huhifadhi kwa uwazi zaidi kitenzi-shirikishi εἰσελθὼν (“baada ya kuingia”) na hali endelevu ya διήρχετο (“alikuwa akipita”).
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa matukio katika simulizi. “Kisha” ni ya kawaida katika Kiswahili na hapa hakiongezi hitimisho la kiteolojia.
- source_word: εἰσελθὼν
  choice: akaingia
  rationale: Kirai cha Kigiriki ni kitenzi-shirikishi cha wakati uliopita, kinachoonyesha tendo lililotangulia tendo kuu. Muundo wa kisimulizi “akaingia” unaonyesha kwa kawaida mfuatano huo katika Kiswahili.
- source_word: διήρχετο
  choice: akawa anapita katikati ya mji huo
  rationale: Kauli ya Kigiriki ina hali ya tendo lililokuwa likiendelea. “Akawa anapita” huhifadhi mwendelezo huo, na “katikati ya mji huo” huonyesha kuwa alikuwa akipitia Yeriko, si kuupita kando.
- source_word: τὴν Ἰεριχώ
  choice: Yeriko … mji huo
  rationale: Jina la mahali limetafsiriwa kwa umbo la Kiswahili linalotumika kwa kawaida. Kurudia kwa “mji huo” kunafanya maana ya kupita ndani ya Yeriko iwe wazi na ya asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na heshima inayofaa maandiko. Kiima hakijatajwa kwa jina kwa sababu Kigiriki pia hukidokeza tu katika kitenzi, na muktadha hukibainisha.
