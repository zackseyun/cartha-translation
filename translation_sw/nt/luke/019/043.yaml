  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: sw
  text: Kwa maana siku zitakujia ambapo adui zako wataweka tuta la kuzingira dhidi yako, watakuzunguka na kukubana kutoka pande zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wataweka boma la kuzingira dhidi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaunganisha utabiri huu na maombolezo yaliyotangulia kwa kuonyesha sababu, bila kupoteza uzito wa kinabii.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: siku zitakujia
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira ya siku au matukio yanayomjia Yerusalemu.
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: watakujengea tuta la kuzingira
  rationale: Katika muktadha huu maneno hayo yanaeleza ujenzi wa tuta la kijeshi dhidi ya mji uliozingirwa; ‘tuta la kuzingira’ ni wazi na linaepuka istilahi ya kijeshi isiyoeleweka kwa urahisi.
- source_word: οἱ ἐχθροί σου
  choice: adui zako
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi cha umilikaji.
- source_word: περικυκλώσουσίν σε
  choice: watakuzunguka
  rationale: Inaeleza kwa kawaida kitendo cha majeshi kuuzingira mji.
- source_word: συνέξουσίν σε πάντοθεν
  choice: kukubana kutoka pande zote
  rationale: Inaonyesha kufungiwa na kusongwa kwa nguvu kutoka kila upande katika hali ya kuzingirwa.
theological_decisions:
- issue: Mrejelewa wa viwakilishi vya nafsi ya pili katika maombolezo ya Yesu juu ya Yerusalemu
  choice: Viwakilishi vya umoja vimehifadhiwa katika ‘-ku-’ na ‘zako,’ vikielekezwa kwa Yerusalemu kama mji uliopewa sifa za mtu.
  alternative: Kuvifanya virejelee waziwazi wakazi wa mji kwa wingi.
  rationale: Kigiriki hutumia umoja, unaolingana na Yerusalemu kusemeshwa kama mtu katika muktadha wa karibu. Tafsiri haiupanui mrejelewa kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Tuta la kuzingira’ limetumiwa katika maandiko, huku ‘boma la kuzingira’ likihifadhiwa kama uwezekano wa kimsamiati katika tanbihi.
