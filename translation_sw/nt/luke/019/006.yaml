lexical_decisions:
- source_word: σπεύσας
  choice: akafanya haraka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kwamba alitenda upesi na kwa hamu. ‘Akafanya haraka’ ni Kiswahili cha kawaida na hudumisha wazo la uharaka.
- source_word: κατέβη
  choice: akashuka
  rationale: Huwasilisha moja kwa moja mwendo wa kushuka kutoka juu, kulingana na muktadha wa Zakayo kuwa mtini.
- source_word: ὑπεδέξατο
  choice: akamkaribisha
  rationale: Kitenzi hiki kinaweza kumaanisha kumpokea mtu kwa ukarimu, mara nyingi kama mgeni. ‘Akamkaribisha’ huwasilisha maana hiyo kwa lugha ya kawaida.
- source_word: αὐτόν
  choice: -m- katika ‘akamkaribisha’
  rationale: Kiambishi cha yambwa ‘-m-’ kinamrejelea Yesu kwa kawaida katika sarufi ya Kiswahili.
- source_word: χαίρων
  choice: kwa furaha
  rationale: Kirai hiki hudumisha hali ya furaha iliyoambatana na kitendo cha kumkaribisha, bila kuifanya kuwa tendo tofauti.
- source_word: καὶ ... καὶ
  choice: Basi ... aka- ... aka-
  rationale: Katika masimulizi ya Kiswahili, ‘Basi’ na mfululizo wa vitenzi vya ‘aka-’ huunganisha matendo yanayofuatana kwa njia ya asili huku yakihifadhi uratibu wa Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa ‘aka-’ unatoa mtiririko wa kawaida wa simulizi; ‘akamkaribisha’ unaonyesha ukarimu unaodokezwa na ὑπεδέξατο.
