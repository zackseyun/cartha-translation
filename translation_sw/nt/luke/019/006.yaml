  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: sw
  text: Basi akafanya haraka, akashuka, akamkaribisha kwa furaha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi akafanya haraka akashuka, akampokea kwa furaha.”
