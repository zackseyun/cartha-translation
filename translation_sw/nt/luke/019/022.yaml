  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: sw
  text: Akamwambia, “Nitakuhukumu kwa maneno yako mwenyewe,[a] wewe mtumwa mwovu! Ulijua kwamba mimi ni mtu mkali, ninayechukua kile ambacho sikuweka na kuvuna kile ambacho sikupanda?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya neno kwa neno: “kutoka kinywani mwako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: kwa maneno yako mwenyewe
  rationale: Nahau hii inaonyesha kwamba hukumu inategemea yale ambayo mtumwa mwenyewe amesema. Tafsiri ya neno kwa neno ‘kutoka kinywani mwako’ inaeleweka, lakini si ya kawaida sana katika Kiswahili cha sasa.
- source_word: κρίνω
  choice: Nitakuhukumu
  rationale: Wakati ujao wa kitenzi umehifadhiwa. ‘Kukuhukumu’ ni pana kuliko ‘kukutia hatiani,’ hivyo haibani maana kupita kiasi.
- source_word: πονηρὲ
  choice: mwovu
  rationale: Neno hili linaonyesha lawama ya kimaadili katika usemi wa moja kwa moja; ‘mbaya’ lingekuwa dhaifu zaidi.
- source_word: δοῦλε
  choice: mtumwa
  rationale: Katika mfano huu uhusiano wa bwana na mtu aliye chini ya mamlaka na umiliki wake unaonekana wazi; ‘mtumwa’ huhifadhi nguvu ya δοῦλος kuliko ‘mtumishi.’
- source_word: ᾔδεις
  choice: Ulijua
  rationale: Hii ni kauli, si swali, na inafaa na hoja ya bwana inayotumia madai ya mtumwa mwenyewe dhidi yake.
- source_word: αὐστηρός
  choice: mkali
  rationale: ‘Mkali’ ni neno la kawaida na la sasa linalowasilisha ukali unaodaiwa bila kutumia lugha nzito au ya kizamani.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: ninayechukua kile nisichoweka
  rationale: ‘Kuchukua’ huhifadhi upana wa αἴρω, na ‘kuweka’ huakisi τίθημι bila kuamua kimya kimya kuwa ni amana ya kifedha.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: kuvuna kile nisichopanda
  rationale: Muundo wa ‘kile’ huhifadhi kiwakilishi cha Kigiriki kinachoelekeza kwenye kitu, si mahali, na pia hulinda taswira ya kupanda na kuvuna.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano wa bwana na mtumwa
  choice: mtumwa
  alternative: mtumishi
  rationale: Hali ya kufungwa chini ya mamlaka ya bwana ni muhimu katika muktadha huu. ‘Mtumwa’ huonyesha uhusiano huo bila kuufifisha.
- issue: Iwapo maelezo ya bwana kuwa mkali yawekwe kama ukweli uliothibitishwa au kama matumizi ya kimkakati ya madai ya mtumwa
  choice: Muundo wa moja kwa moja ‘Ulijua kwamba mimi ni mtu mkali’ umehifadhiwa bila maelezo ya ziada
  alternative: ‘Kwa kuwa ulidai kwamba mimi ni mtu mkali’ au ‘Ikiwa ulijua kwamba mimi ni mtu mkali’
  rationale: Kigiriki kinatoa kauli hiyo moja kwa moja, huku muktadha ukiruhusu isomwe kama jibu la kimkakati kwa maneno ya mtumwa. Tafsiri haiamui zaidi ya maandishi kuhusu tabia ya mhusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida huku muundo wa hoja, wakati ujao wa κρίνω, na uwiano wa ‘kile nisichoweka … kile nisichopanda’ vikihifadhiwa.
