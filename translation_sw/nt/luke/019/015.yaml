  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: sw
  text: Ikawa aliporudi baada ya kupokea ufalme, aliamuru watumwa hao, ambao alikuwa amewapa fedha, waitwe kwake, ili ajue walichopata kwa kufanya biashara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “biashara waliyokuwa wamefanya” au “faida waliyokuwa wamepata.” Kitenzi cha Kigiriki kinaweza kurejelea kufanya biashara na pia matokeo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi ya Luka; “Ikawa” inaendeleza simulizi kwa lugha ya heshima bila kutumia mtindo wa kizamani kupita kiasi.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: aliporudi
  rationale: Muundo wa kitenzi-jina wenye ἐν una maana ya wakati hapa; “aliporudi” ni Kiswahili cha kawaida na sahihi.
- source_word: λαβόντα τὴν βασιλείαν
  choice: baada ya kupokea ufalme
  rationale: Kivumishi-tendo kinaonyesha jambo lililotangulia agizo lake. “Kupokea” huepuka maana ya kutwaa kwa nguvu, nayo “ufalme” huhifadhi taswira ya kifalme ingawa hapa inahusu pia mamlaka ya kutawala.
- source_word: φωνηθῆναι αὐτῷ
  choice: waitwe waje kwake
  rationale: Hutoa wazi maana ya kuitwa au kuitishwa mbele yake kwa Kiswahili cha kawaida.
- source_word: δούλους
  choice: watumwa
  rationale: Katika muktadha huu wako chini ya mamlaka ya mkuu huyo na wanatumia mali yake; “watumwa” huonyesha kwa uwazi hali yao ya kijamii kuliko “watumishi,” huku mbadala huo ukitajwa katika tanbihi.
- source_word: δεδώκει
  choice: aliokuwa amewapa
  rationale: Huhifadhi maana ya tendo lililokamilika kabla ya kurudi kwake.
- source_word: ἀργύριον
  choice: fedha
  rationale: Neno linaweza kumaanisha fedha kama metali au pesa; hapa linarejelea pesa walizopewa. “Fedha” ni la kawaida na halilazimishi kutaja kipimo cha mina ambacho hakitajwi katika mstari huu.
- source_word: ἵνα γνοῖ
  choice: ili ajue
  rationale: Huhifadhi wazi kusudi la kuwaita.
- source_word: τί διεπραγματεύσαντο
  choice: walichopata kwa kufanya biashara
  rationale: Hukamata shughuli ya biashara pamoja na matokeo yake katika muktadha, bila kuifanya “faida” kuwa tafsiri pekee inayowezekana.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano wa kiuchumi
  choice: watumwa
  alternative: watumishi
  rationale: Uhusiano wao na mwenye mali unaonyesha mamlaka yenye hali ya utumwa. Uchaguzi huu unaonyesha mazingira ya kijamii ya mfano bila kuingiza fundisho la dhehebu; “watumishi” limehifadhiwa kama uwezekano katika tanbihi.
- issue: Maana ya βασιλεία katika mazingira ya mkuu kwenda kupokea utawala
  choice: ufalme
  alternative: mamlaka ya kifalme
  rationale: “Ufalme” huhifadhi neno na taswira pana ya Kigiriki, huku muktadha ukionyesha kwamba hapa hasa ni kupokea haki au mamlaka ya kutawala.
- issue: Kiwango cha faida kilichodokezwa na διεπραγματεύσαντο
  choice: walichopata kwa kufanya biashara
  alternative: biashara waliyokuwa wamefanya
  rationale: Muktadha unalenga matokeo ya matumizi ya fedha, lakini kitenzi chenyewe pia huhusu kufanya biashara. Tafsiri kuu inabeba pande zote mbili, na tanbihi inadumisha uwezekano mpana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Ikawa” limetumiwa kama kiunganishi cha kisimulizi; “waitwe waje kwake” linafafanua mwito bila kuwa zito; tanbihi zimehifadhi utata halisi wa δοῦλος na διεπραγματεύσαντο.
