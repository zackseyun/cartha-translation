  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: sw
  text: Alikuwa akijaribu kumwona Yesu ili ajue Yesu ni nani,[a] lakini hakuweza kwa sababu ya umati, kwa kuwa alikuwa mfupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alikuwa akitafuta kumwona Yesu ni nani.” Kirai cha Kigiriki kinaweza kurejelea kutaka kumtambua Yesu au kutaka kujua alikuwa mtu wa namna gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: alikuwa akijaribu
  rationale: Kauli ya wakati uliopita unaoendelea inaonyesha jitihada iliyokuwa ikiendelea, si tamaa tu.
- source_word: ἰδεῖν
  choice: kumwona
  rationale: Kitenzi-jina kinaeleza lengo la jitihada zake; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τίς ἐστιν
  choice: ajue yeye ni nani
  rationale: Kirai hiki kinaweza kuhusiana na utambulisho au aina ya mtu; tafsiri hii huhifadhi wazo la kutaka kujua Yesu ni nani bila kulifafanua kupita kiasi.
- source_word: οὐκ ἠδύνατο
  choice: hakuweza
  rationale: Ni tafsiri ya kawaida na ya asili ya kutokuwa na uwezo.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: kwa sababu ya umati
  rationale: Hapa ἀπό huonyesha sababu iliyomzuia, yaani umati.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinaanzisha sababu ya kushindwa kwake kuona.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: alikuwa mfupi
  rationale: Ingawa ἡλικία yaweza kurejelea umri au kimo, muktadha wa kuzuiwa na umati unaonyesha wazi kwamba kinachokusudiwa ni kimo kifupi.
