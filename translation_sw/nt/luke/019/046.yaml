  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: sw
  text: 'akiwaambia, “Imeandikwa: ‘Na nyumba yangu[a] itakuwa nyumba ya sala,’ lakini ninyi mmeifanya kuwa pango la wanyang''anyi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu langu.” Kigiriki kinasema “nyumba yangu,” kikitoa mwangwi wa Isaya 56:7.
    reason: lexical_alternative
  - marker: b
    text: “Pango la wanyang'anyi” linatoa mwangwi wa Yeremia 7:11; neno “wanyang'anyi” pia linaweza kutafsiriwa “majambazi.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: akiwaambia
  rationale: Huhifadhi mtiririko wa kitenzi cha hali ya kuendelea kilichounganishwa na simulizi lililotangulia, huku kikisikika kwa kawaida katika Kiswahili.
- source_word: Γέγραπται
  choice: Imeandikwa
  rationale: Ni kauli ya kawaida ya Kiswahili ya kutambulisha nukuu yenye mamlaka kutoka Maandiko, na inaakisi hali timilifu ya kauli tendwa.
- source_word: Καὶ ἔσται
  choice: Na ... itakuwa
  rationale: Huhifadhi kiunganishi cha mwanzo καί pamoja na maana ya wakati ujao katika nukuu.
- source_word: ὁ οἶκός μου
  choice: nyumba yangu
  rationale: οἶκος maana yake ya moja kwa moja ni ‘nyumba.’ Ingawa hapa inarejelea hekalu, uchaguzi huu huhifadhi maneno na mwangwi wa Isaya 56:7.
- source_word: οἶκος προσευχῆς
  choice: nyumba ya sala
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kwa muundo huu wa Kigiriki, bila kupoteza usemi unaotambulika wa kinabii.
- source_word: ὑμεῖς δὲ
  choice: lakini ninyi
  rationale: ‘Lakini’ huonyesha utofautishaji, na ‘ninyi’ huhifadhi mkazo wa kiwakilishi cha Kigiriki.
- source_word: αὐτὸν ἐποιήσατε
  choice: mmeifanya kuwa
  rationale: Huonyesha kitendo kilichofanywa na matokeo yake ya sasa; kiwakilishi cha kitu kinarejelea nyumba iliyotajwa.
- source_word: σπήλαιον
  choice: pango
  rationale: ‘Pango’ linaweza kumaanisha mahali pa kujificha na linafaa kwa mwangwi wa Yeremia 7:11.
- source_word: λῃστῶν
  choice: wanyang’anyi
  rationale: Neno hili linaweza kurejelea wanyang’anyi au majambazi; ‘wanyang’anyi’ ni pana, la kawaida, na haliongezi maana ya kisiasa isiyolazimishwa na muktadha.
theological_decisions:
- issue: Kutafsiri nukuu kuhusu hekalu kwa ‘nyumba’ badala ya ‘hekalu’
  choice: nyumba yangu ... nyumba ya sala
  alternative: hekalu langu ... nyumba ya sala
  rationale: Kigiriki kinatumia οἶκος, ‘nyumba.’ Kuhifadhi neno hilo kunadumisha uhusiano wa moja kwa moja na Isaya 56:7 na nguvu ya picha ya mahali pa Mungu, bila kufafanua kimyakimya kuwa ‘hekalu.’
- issue: Maana ya λῃσταί katika nukuu ya kinabii
  choice: wanyang’anyi
  alternative: majambazi
  rationale: λῃσταί lina wigo unaojumuisha wanyang’anyi na majambazi. ‘Wanyang’anyi’ huhifadhi shutuma ya uporaji bila kuifanya kwa lazima kuwa rejeo la waasi wenye silaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umehifadhiwa kwa uwazi, pamoja na ‘Na’ ya mwanzo na mkazo wa ‘ninyi.’
