  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: sw
  text: Kisha yule wa kwanza akaja, akasema, “Bwana[a], mina yako imeleta mina kumi zaidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mkuu.” Neno la Kigiriki linaweza kutumiwa kumwita kwa heshima mtu mwenye mamlaka, na pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: akaja
  rationale: Kitenzi hiki hapa kinaeleza kuja au kufika mbele ya mwenye mamlaka; “akaja” ni cha kawaida na kinafaa katika usimulizi.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza mfululizo wa matukio; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: ὁ πρῶτος
  choice: yule wa kwanza
  rationale: Usemi huu unamtambulisha wa kwanza katika mfuatano wa watumishi wanaotoa taarifa.
- source_word: λέγων
  choice: akisema
  rationale: Umbo la kitenzi linaonyesha kusema kunakoandamana na kuja kwake; “akisema” huhifadhi uhusiano huo.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni namna ya heshima ya kumwita mwenye mamlaka na pia ndiyo tafsiri ya kawaida ya κύριος; katika mfano huu si lazima iwe tamko la moja kwa moja kuhusu uungu.
- source_word: ἡ μνᾶ σου
  choice: mina yako
  rationale: “Mina” huhifadhi jina la kihistoria la kipimo cha fedha, na “yako” huonyesha kuwa fedha ya awali ilikuwa mali ya bwana.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: imechuma mina nyingine kumi
  rationale: προσεργάζομαι ina wazo la kupata nyongeza kwa kufanya kazi. “Nyingine” huweka wazi kuwa mina kumi zilikuwa faida iliyoongezeka juu ya mina ya awali, bila kubadili kiasi hicho kuwa sarafu ya kisasa.
theological_decisions:
- issue: Maana ya κύριος katika maneno ya mfano
  choice: Bwana
  alternative: Mheshimiwa; bwana wangu
  rationale: Msemaji anamwita mtu mwenye cheo kwa heshima ndani ya mfano. “Bwana” huhifadhi upana wa κύριος bila kulazimisha kwamba hapa ni ungamo la moja kwa moja la kimungu; tanbihi inaonyesha uwezekano wa maana ya heshima kwa mwenye mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mina” imehifadhiwa kama istilahi ya kihistoria ya fedha; “imechuma” inadumisha picha ya mina yenyewe kuwa ndiyo iliyoleta mapato, kama ilivyo katika chanzo.
