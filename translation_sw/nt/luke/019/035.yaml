  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: sw
  text: Wakamleta kwa Yesu[a], na baada ya kutandika mavazi yao juu ya mwana-punda[b], wakampandisha Yesu juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, walimleta mwana-punda; kiwakilishi cha Kigiriki ni cha kiume na kinamrejelea mwana-punda.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha mnyama mchanga; hapa muktadha unaonyesha mwana-punda.
    reason: cross_reference
lexical_decisions:
- source_word: ἤγαγον
  choice: wakamleta
  rationale: Kitenzi ἄγω hapa kinaeleza kumleta mwana-punda kwa Yesu. “Wakamleta” ni Kiswahili cha kawaida na hudumisha mtendwa wa kiume kulingana na ngeli ya “mwana-punda.”
- source_word: αὐτὸν
  choice: -m- katika “wakamleta”
  rationale: Kiwakilishi hiki kinamrejelea mwana-punda aliyetajwa katika muktadha uliotangulia. Kiswahili hukiwakilisha kwa kiambishi cha yambwa kinachopatana na ngeli ya nomino hiyo.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kwa Yesu
  rationale: πρός pamoja na hali ya kushutumiwa inaonyesha mwendo kuelekea kwa mtu; “kwa Yesu” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: ἐπιρίψαντες
  choice: baada ya kutandika
  rationale: Kauli ya wakati uliopita inaonyesha tendo lililotangulia tendo kuu. “Baada ya” huonyesha mfuatano huo wazi, na “kutandika” hueleza kwa kawaida kuwekwa kwa mavazi juu ya mgongo wa mnyama bila kutoa wazo lisilofaa la kuyatupilia mbali.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: mavazi yao
  rationale: ἱμάτια ni mavazi, mara nyingi mavazi ya nje. “Mavazi yao” ni ya asili na yenye kueleweka kwa wasomaji wa kawaida bila kudai kwa lazima aina mahususi ya vazi.
- source_word: ἐπὶ τὸν πῶλον
  choice: juu ya mwana-punda
  rationale: ἐπί hapa inaonyesha kuweka kitu juu ya mnyama. “Juu ya mwana-punda” ni Kiswahili cha kawaida.
- source_word: πῶλον
  choice: mwana-punda
  rationale: πῶλος humaanisha mnyama mchanga; muktadha wa karibu unaonyesha kuwa hapa ni mwana wa punda. Tafsiri hiyo ni wazi kwa Kiswahili, huku tanbihi ikihifadhi upana wa neno la Kigiriki.
- source_word: ἐπεβίβασαν
  choice: wakampandisha
  rationale: 'Kitenzi hiki ni cha kisababishi: waliwezesha au walimsaidia Yesu kupanda. “Wakampandisha” hudumisha maana hiyo kwa ufupi na kwa asili.'
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina Ἰησοῦς katika Kiswahili.
theological_decisions: []
