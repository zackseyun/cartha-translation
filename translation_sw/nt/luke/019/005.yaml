base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: sw
  text: Yesu alipofika mahali pale[a], alitazama juu, akamwambia, “Zakayo, shuka upesi, kwa maana leo ni lazima[b] nikae nyumbani kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ile.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ni lazima” linaweza kuonyesha ulazima unaohusiana na kazi ya Yesu au kusudi la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: alipo-
  rationale: Katika simulizi, ὡς inaanzisha kishazi cha wakati; kiambishi cha Kiswahili ‘alipo-’ kinaonyesha kwa kawaida na kwa uwazi kwamba jambo lilitokea Yesu alipofika.
- source_word: ἐπὶ τὸν τόπον
  choice: mahali pale
  rationale: Usemi huu unaelekeza kwenye eneo maalumu lililotajwa na muktadha. ‘Mahali pale’ ni Kiswahili cha kawaida na huhifadhi maana ya mahali husika.
- source_word: ἀναβλέψας
  choice: alitazama juu
  rationale: Muktadha unaonyesha Yesu alielekeza macho juu, alikokuwa Zakayo mtini. Tafsiri hii ni ya kawaida na sahihi kimuktadha.
- source_word: εἶπεν πρὸς αὐτόν
  choice: akamwambia
  rationale: ‘Akamwambia’ ni namna ya kawaida ya Kiswahili ya kuendeleza mfuatano wa simulizi na kutafsiri usemi wa kumwambia mtu.
- source_word: Ζακχαῖε
  choice: Zakayo
  rationale: ‘Zakayo’ ndilo umbo la jina hili lililozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: σπεύσας κατάβηθι
  choice: shuka upesi
  rationale: Kauli hii fupi ya amri inaonyesha dharura ya tendo bila kulazimisha muundo usio wa kawaida wa Kiswahili.
- source_word: σήμερον γὰρ
  choice: kwa maana leo
  rationale: γάρ inatoa sababu ya amri iliyotangulia; ‘kwa maana’ huhifadhi uhusiano huo wa kisababu, na ‘leo’ huhifadhi msisitizo wa wakati.
- source_word: ἐν τῷ οἴκῳ σου
  choice: nyumbani kwako
  rationale: Katika muktadha huu οἶκος ni makao ya Zakayo. ‘Nyumbani kwako’ ni usemi wa asili unaoweza kuhusisha ziara, ushirika wa mezani, au kukaa huko bila kubainisha zaidi.
- source_word: δεῖ
  choice: ni lazima
  rationale: ‘Ni lazima’ huhifadhi nguvu ya ulazima iliyo katika δεῖ, badala ya kuipunguza kuwa nia au hitaji la kawaida.
- source_word: μεῖναι
  choice: nikae
  rationale: Katika muktadha wa kwenda nyumbani kwa Zakayo, ‘nikae’ ni tafsiri ya asili ya kubaki au kukaa huko; haibainishi bila sababu ikiwa ni ziara fupi au malazi.
theological_decisions:
- issue: Nguvu ya δεῖ katika teolojia ya simulizi la Luka
  choice: ni lazima
  alternative: ninahitaji; imenipasa
  rationale: δεῖ mara nyingi katika Luka huonyesha ulazima unaohusiana na kazi ya Yesu au kusudi la Mungu. ‘Ni lazima’ huhifadhi uzito huo bila kutaja moja kwa moja chanzo cha ulazima au kufafanua zaidi ya mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni mwepesi kueleweka; ‘Zakayo,’ ‘shuka upesi,’ na ‘nyumbani kwako’ ni maneno ya kawaida bila kuingiza istilahi za dhehebu. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
