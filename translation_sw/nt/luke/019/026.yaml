  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: sw
  text: Ninawaambia kwamba kila aliye na kitu atapewa[a]; lakini yule asiye na kitu atanyang’anywa hata kile alicho nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atapewa zaidi.” Kigiriki hakisemi wazi “zaidi,” ingawa katika muktadha maana ya kuongezewa inaeleweka kwa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ninawaambia
  rationale: Kauli ya sasa yenye kiwakilishi cha wingi inaingiza tamko la moja kwa moja kwa Kiswahili cha kawaida na chenye uzito.
- source_word: παντὶ τῷ ἔχοντι
  choice: kila aliye na kitu
  rationale: Kirai cha kisifa chenye kibainishi kinamtaja kwa ujumla kila mtu mwenye kitu; kuongeza “kitu” hufanya Kiswahili kiwe wazi bila kutaja kitu maalumu ambacho Kigiriki hakijakitaja.
- source_word: δοθήσεται
  choice: atapewa
  rationale: Wakati ujao wa kutendwa unasema moja kwa moja “atapewa.” Haiongezi “zaidi,” hivyo inadumisha ufupi na kutotaja wazi nyongeza kama ilivyo katika Kigiriki.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: lakini yule asiye na kitu
  rationale: δέ ni ya ulinganisho wa kupingana, na kirai cha kisifa kinamrejelea kwa ujumla mtu asiye na kitu.
- source_word: καὶ ὃ ἔχει
  choice: hata kile alicho nacho
  rationale: καί ina nguvu ya kusisitiza hapa, kwa hiyo “hata” linaonyesha mshangao wa kupokonywa kile kilichopo.
- source_word: ἀρθήσεται
  choice: kitachukuliwa
  rationale: Wakati ujao wa kutendwa wa αἴρω hapa una maana ya kuondoa au kumnyang’anya mtu alicho nacho; “kitachukuliwa” ni sahili na la kawaida.
theological_decisions:
- issue: Nguvu ya kimafundisho ya kauli kuhusu kuongezewa na kupokonywa
  choice: Kauli imetafsiriwa kama kanuni ya jumla bila kuingiza maelezo kuhusu wokovu, ustahili, uchaguzi wa Mungu, au utunzaji wa mali.
  alternative: Kuifafanua wazi kuwa inahusu uwakili ndani ya mfano, au kuwa kanuni pana ya ufalme wa Mungu.
  rationale: Mstari wenyewe hautaji utaratibu wa kimafundisho; tafsiri inadumisha ufupi na mvutano wake, huku muktadha ukiongoza matumizi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “aliye na kitu/asiye na kitu” huepuka sentensi isiyokamilika katika Kiswahili bila kubainisha kitu hususa. Alama ya tanbihi [a] imewekwa mara moja baada ya neno linalohusika.
