  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: sw
  text: Basi wale waliotumwa wakaenda, wakakuta kama vile alivyowaambia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wakakuta mwana-punda kama vile alivyowaambia. Katika Kigiriki, yambwa la «wakakuta» halikutajwa, bali linaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: wakaenda
  rationale: Kitenzi hiki cha wakati uliopita katika umbo la participio kinaonyesha kwamba waliondoka na kwenda; “wakaenda” ni ya kawaida katika simulizi la Kiswahili na huunganisha tendo hili na lililofuata.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ kinaendeleza simulizi na kuonyesha hatua iliyofuata baada ya agizo la Yesu; “Basi” hufanya hivyo kwa Kiswahili cha kawaida bila kukipa uzito usio wa lazima.
- source_word: οἱ ἀπεσταλμένοι
  choice: wale waliotumwa
  rationale: Huhifadhi umbo la kutendwa la participio yenye kibainishi bila kuingiza tafsiri pana zaidi kama “wajumbe.”
- source_word: εὗρον
  choice: wakakuta
  rationale: εὗρον maana yake ni kupata au kukuta. Kiswahili kinaweza kuacha yambwa likieleweka kutokana na muktadha, yaani mwana-punda aliyetajwa kabla.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganifu kati ya walichokuta na maneno ya Yesu kwa namna ya kawaida na iliyo wazi.
- source_word: εἶπεν αὐτοῖς
  choice: alivyowaambia
  rationale: “Aliwaambia” ni tafsiri ya kawaida ya λέγω pamoja na αὐτοῖς katika muktadha wa maagizo yaliyotangulia; muundo wa “alivyo-” unaonyesha kwamba kusema kulitangulia kukuta.
