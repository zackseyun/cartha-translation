  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: sw
  text: Basi akasema, “Mtu mmoja wa ukoo wa kifahari alikwenda nchi ya mbali ili kupokea ufalme[a] kwa ajili yake mwenyewe na kurudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “cheo cha kifalme” au “mamlaka ya kifalme.” Neno la Kigiriki βασιλείαν linaweza kumaanisha ufalme wenyewe au utawala na mamlaka ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wenye nguvu ya kimantiki au kisimulizi; “Basi” ni ya kawaida na ya asili katika Kiswahili cha masimulizi.
- source_word: Ἄνθρωπός τις
  choice: Mtu mmoja
  rationale: Hutambulisha mhusika asiyeainishwa katika mfano bila kudokeza kwamba tayari anajulikana.
- source_word: εὐγενὴς
  choice: wa ukoo mashuhuri
  rationale: Hueleza mtu wa kuzaliwa au hadhi ya juu. Kauli hii ni wazi kwa wasomaji wa sasa na huepuka neno “kabaila,” ambalo linaweza kueleweka kwa maana nyingine za kijamii au kiuchumi.
- source_word: ἐπορεύθη
  choice: alikwenda
  rationale: Hutoa kwa urahisi maana ya mwendo ya kitenzi hiki katika muktadha.
- source_word: εἰς χώραν μακρὰν
  choice: nchi ya mbali
  rationale: Huhifadhi wazo la eneo au nchi iliyo mbali kwa lugha ya kawaida ya Kiswahili.
- source_word: λαβεῖν
  choice: kupokea
  rationale: Katika mazingira haya ya kisiasa, mtu huyo anakwenda kupewa au kuthibitishiwa utawala, si kuunyakua; “kupokea” huhifadhi maana hiyo.
- source_word: ἑαυτῷ
  choice: kwa ajili yake mwenyewe
  rationale: Huwakilisha wazi kiwakilishi cha kujirejelea kinachoonyesha kwamba ufalme au utawala unapokewa kwa ajili yake mwenyewe.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Neno la Kigiriki linaweza kumaanisha ufalme kama eneo au hali na mamlaka ya kifalme. “Ufalme” huhifadhi upana huo, huku tanbihi ikitaja uwezekano mwingine.
- source_word: ὑποστρέψαι
  choice: kurudi
  rationale: Ni tafsiri fupi na ya asili ya tendo lililoratibiwa na “kupokea,” bila kuongeza kiunganishi cha wakati kisichotajwa wazi.
theological_decisions:
- issue: Maana ya βασιλείαν katika mfano wenye taswira ya kisiasa ya kupewa utawala wa kifalme
  choice: ufalme
  alternative: ukingship au mamlaka ya kifalme
  rationale: Maana ya asili inaweza kuelekeza ama kwenye ufalme ama kwenye cheo na mamlaka ya kutawala. Matini kuu inahifadhi neno pana “ufalme,” na tanbihi inaweka wazi maana nyingine bila kuamua kimya-kimya jinsi taswira hiyo inavyopaswa kufasiriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi-jina “kupokea … na kurudi” huhifadhi uratibu wa vitenzi vya Kigiriki bila kuongeza “kisha.”
