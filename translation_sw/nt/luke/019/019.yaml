lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Akamwambia
  rationale: Katika mtiririko huu wa simulizi, kitenzi hiki kinatambulisha maneno yanayoelekezwa kwa mtumishi mwingine; kiambishi cha yambwa huleta Kiswahili cha kawaida bila kulazimisha δέ iwe na maana ya upinzani.
- source_word: καὶ τούτῳ
  choice: huyo pia
  rationale: “Huyo” huhifadhi nguvu ya kiwakilishi kioneshi τούτῳ, na “pia” huonyesha wazi maana ya nyongeza ya καί katika mgawanyo unaofuatana.
- source_word: Καὶ σὺ
  choice: Nawe
  rationale: “Nawe” ni usemi wa moja kwa moja na wa kawaida unaohifadhi msisitizo na ulinganifu wa καὶ σὺ.
- source_word: ἐπάνω γίνου
  choice: uwe na mamlaka juu ya
  rationale: Mchanganyiko wa amri γίνου na ἐπάνω unaonyesha kupewa cheo au mamlaka. Kiswahili “uwe na mamlaka juu ya” kinaeleza maana hiyo kwa kawaida kuliko tafsiri ya neno kwa neno “uwe juu ya.”
- source_word: πέντε πόλεων
  choice: miji mitano
  rationale: πόλις hapa humaanisha mji, na hali ya umilikishi inaonyesha eneo linalowekwa chini ya mamlaka yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imehifadhi usemi mfupi wa hukumu na ulinganifu wake na mtumishi aliyetangulia. Hakuna tanbihi iliyohitajika kwa sababu maana ya kiutawala ya ἐπάνω γίνου imewasilishwa wazi katika matini.
