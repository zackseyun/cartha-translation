lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: Baadhi ya Mafarisayo
  rationale: Kirai hiki kinaonyesha sehemu isiyotajwa kwa idadi ya kundi la Mafarisayo; ‘baadhi ya’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: waliokuwa katika umati
  rationale: ἀπό hapa huonyesha walikotoka au mahali walipokuwa; uundaji huu unaeleza kwa kawaida kwamba Mafarisayo hao walikuwa miongoni mwa umati bila kudokeza kwamba walikuwa wameondoka humo.
- source_word: εἶπαν πρὸς αὐτόν
  choice: wakamwambia
  rationale: Ni namna ya kawaida ya Kiswahili ya kusimulia kwamba walizungumza naye, huku ‘waka-’ ikiendeleza mfuatano wa simulizi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Huhifadhi maana ya msingi ya cheo cha mtu anayefundisha bila kuongeza madai yenye nguvu zaidi kuhusu mamlaka yake.
- source_word: ἐπιτίμησον
  choice: wakemee
  rationale: Kitenzi hiki ni amri ya kukemea kwa maneno yenye nguvu; ‘wakemee’ huhifadhi uzito wake bila kuongeza wazo la kuwanyamazisha moja kwa moja.
- source_word: τοῖς μαθηταῖς σου
  choice: wanafunzi wako
  rationale: ‘Wanafunzi’ hudumisha uhusiano wa mwalimu na μαθηταί katika lugha ya kawaida ya Kiswahili; kiambishi cha yambwa katika ‘wakemee’ huonyesha wingi wao.
theological_decisions:
- issue: Διδάσκαλε kama cheo cha heshima kinachotumiwa kumwita Yesu
  choice: Mwalimu
  alternative: Bwana
  rationale: Neno la Kigiriki linalenga hasa jukumu la kufundisha. ‘Mwalimu’ huhifadhi anwani ya wasemaji bila kuingiza dai la kikristo au mamlaka pana zaidi kuliko lililo wazi katika neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Umati’ ni wazi na ya kawaida katika simulizi; muundo wa vitenzi unaendeleza mtiririko wa hadithi. Alama zote za tanbihi zimewekwa katika matini kuu.
