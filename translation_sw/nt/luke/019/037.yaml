  to: Naye alipokuwa tayari amekaribia mteremko wa Mlima wa Mizeituni, umati wote wa wanafunzi kwa furaha wakaanza kumsifu Mungu kwa sauti kubwa kwa ajili ya matendo yote ya uweza waliyoyaona.[a]
