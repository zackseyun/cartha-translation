id: LUK.19.37
reference: Luke 19:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: sw
  text: Naye alipokuwa tayari amekaribia mteremko wa Mlima wa Mizeituni, umati wote wa wanafunzi kwa furaha wakaanza kumsifu Mungu kwa sauti kubwa kwa ajili ya matendo yote ya uweza waliyoyaona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza” au “matendo makuu”; Kigiriki kinatumia neno linalosisitiza matendo yanayodhihirisha nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Naye alipokuwa amekaribia
  rationale: Muundo huu huweka mazingira ya wakati na mwendo wa Yesu; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi wazo la kufika karibu.
- source_word: πρὸς τῇ καταβάσει
  choice: mahali pa kuanza kuteremka
  rationale: Kirai hiki kinaonyesha mahali karibu na mteremko; uchaguzi huu unaeleweka kwa urahisi bila kudai kwa usahihi zaidi ya maandishi kuhusu topografia.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: kutoka Mlima wa Mizeituni
  rationale: Hili ni jina la mahali linalotambulika katika Kiswahili; 'kutoka' huonyesha kuwa mteremko ni wa mlima huo.
- source_word: ἤρξαντο
  choice: ulianza
  rationale: Huhifadhi maana ya kuanza kwa tendo na inapatana kisarufi na nomino ya umoja 'umati'.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: umati wote wa wanafunzi
  rationale: '''Umati'' huonyesha kundi kubwa, huku ''wa wanafunzi'' ikibainisha kwamba si mkusanyiko wa watu usiohusiana nao.'
- source_word: χαίροντες
  choice: kushangilia
  rationale: Huhifadhi tendo la furaha linaloandamana na kumsifu Mungu na ni la asili katika muktadha wa kundi linalopaza sauti.
- source_word: αἰνεῖν τὸν θεὸν
  choice: kumsifu Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumpa Mungu sifa.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi picha halisi ya sauti iliyopazwa.
- source_word: περὶ πασῶν ... δυνάμεων
  choice: kwa ajili ya matendo yote ya nguvu
  rationale: Huhifadhi uhusiano wa δύναμις na nguvu bila kuifupisha maana yake kuwa istilahi finyu ya 'miujiza' pekee.
- source_word: ὧν εἶδον
  choice: waliyokuwa wameyaona
  rationale: Huonyesha kwamba walikuwa wameyaona matendo hayo kabla ya wakati huu wa sifa.
theological_decisions:
- issue: Maana ya δύναμις katika muktadha wa matendo yasiyo ya kawaida
  choice: matendo ya nguvu
  alternative: miujiza; matendo makuu
  rationale: Neno la Kigiriki linaweza kumaanisha nguvu, matendo ya nguvu, au miujiza. 'Matendo ya nguvu' huhifadhi mkazo wake juu ya nguvu iliyodhihirishwa katika matendo bila kuondoa upana wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi mazingira ya wakati, kitambulisho cha kundi, furaha, sauti kubwa, na upana wa maana ya δύναμις.
