  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: sw
  text: Ikawa siku moja, Yesu alikuwa akifundisha; Mafarisayo na walimu wa Sheria walikuwa wameketi hapo, waliokuwa wametoka katika kila kijiji cha Galilaya na Uyahudi, na kutoka Yerusalemu. Nguvu za Bwana zilikuwapo ili Yesu aponye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya miswada ina “awaponye” badala ya “Yesu aponye.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Ikawa siku moja
  rationale: Ni mwanzo wa kawaida wa simulizi kwa Luka. Kauli hii ni ya asili katika Kiswahili na huepuka tafsiri nzito ya neno kwa neno.
- source_word: αὐτὸς ἦν διδάσκων
  choice: Yesu alikuwa akifundisha
  rationale: Jina limetajwa wazi ili kurejesha mhusika kwa urahisi katika Kiswahili; muundo wa 'alikuwa akifundisha' unaonyesha tendo lililokuwa likiendelea.
- source_word: καθήμενοι
  choice: walikuwa wameketi hapo
  rationale: Huwasilisha hali yao ya kuketi katika eneo hilo kwa lugha ya kawaida na wazi.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina lililozoeleka katika Kiswahili kwa kundi hili la Kiyahudi.
- source_word: νομοδιδάσκαλοι
  choice: walimu wa Sheria
  rationale: Hufuata maana ya neno ambatani la Kigiriki na kueleweka kwa wasomaji wa kawaida; herufi kubwa inaonyesha Sheria ya Musa katika muktadha huu.
- source_word: ἐληλυθότες
  choice: walikuwa wametoka
  rationale: Wakati huu unaonyesha kuwa walikuwa wamekwisha kuja kutoka maeneo hayo na sasa walikuwapo. Kiswahili hutaja mahali pa asili kwa kawaida kwa 'kutoka'.
- source_word: ἐκ πάσης κώμης
  choice: katika kila kijiji
  rationale: Inahifadhi nguvu ya mgawanyo ya πάσης na maana ya κώμη kama kijiji badala ya mji mkubwa.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: cha Galilaya na Uyahudi, na pia Yerusalemu
  rationale: Muundo huu unatofautisha kwa njia ya asili mikoa ya Galilaya na Uyahudi na jiji la Yerusalemu bila kubadili maana.
- source_word: δύναμις κυρίου
  choice: Nguvu za Bwana
  rationale: Katika Kiswahili, 'nguvu' hutumiwa kwa kawaida katika umbo la ngeli ya N-N lenye upatanisho wa wingi, huku ikihifadhi wazo la uwezo wa kimungu unaotenda.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: zilikuwapo ili Yesu aponye
  rationale: Kauli ya kusudi 'ili ... aponye' ni ya kawaida na huakisi εἰς τὸ pamoja na kitenzi-jina. Jina 'Yesu' linaweka wazi rejeo linalowakilishwa na αὐτόν bila kuongeza wagonjwa kama shamirisho lisilokuwapo katika usomaji huu.
theological_decisions:
- issue: Rejeo na maana ya δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Nguvu za Bwana zilikuwapo ili Yesu aponye.
  alternative: Nguvu za Bwana zilikuwapo kuwaponya.
  rationale: Matini iliyotolewa ina αὐτόν, si shamirisho la wingi αὐτούς. Kwa hiyo tafsiri kuu haiongezi 'wao,' bali inaonyesha nguvu za kimungu zikifanya kazi katika huduma ya Yesu ya uponyaji. Tanbihi inahifadhi tofauti halisi ya miswada.
- issue: Rejeo la κυρίου
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ni tafsiri sanifu na yenye hadhi ya κύριος, na hapa inadumisha uwezekano wa kurejelea Mungu bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya Kigiriki imegawanywa ili isomeke kwa urahisi bila kupoteza mfuatano wa mawazo. Kiashiria cha tanbihi [a] kimewekwa baada ya kishazi kinachohusika moja kwa moja na tofauti ya miswada.
