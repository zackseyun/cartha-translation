id: LUK.5.35
reference: Luke 5:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: sw
  text: 'Lakini siku zitakuja, na bwana arusi atakapoondolewa[a] kutoka kwao, ndipo watakapofunga katika siku hizo.


    [a] Au “atakapochukuliwa kutoka kwao.” Kitenzi cha Kigiriki kinaonyesha kwamba bwana arusi anaondolewa, si kwamba anaondoka tu mwenyewe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atakapochukuliwa kutoka kwao.” Kitenzi cha Kigiriki kinaonyesha kwamba bwana arusi anaondolewa, si kwamba anaondoka tu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: siku zitakuja
  rationale: Inahifadhi nahau ya Kigiriki na mtazamo wake wa wakati ujao kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti wa hali ya sasa, ambapo hawafungi, na wakati ujao, ambapo watafunga.
- source_word: ὅταν
  choice: atakapo-
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida tukio la wakati ujao linalotambulishwa na ὅταν.
- source_word: ἀπαρθῇ
  choice: atakapoondolewa
  rationale: Kauli ya kutendwa inadumishwa, na neno hili linaonyesha kuondolewa kwa bwana arusi badala ya kuondoka kwake tu.
- source_word: ἀπ’ αὐτῶν
  choice: kutoka kwao
  rationale: Inaonyesha kutenganishwa kwa bwana arusi na wale walio pamoja naye.
- source_word: ὁ νυμφίος
  choice: bwana arusi
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili kwa mwanamume anayefunga ndoa, na linahifadhi taswira ya harusi.
- source_word: τότε
  choice: ndipo
  rationale: Linaonyesha wazi matokeo ya wakati unaofuata kuondolewa kwa bwana arusi.
- source_word: νηστεύσουσιν
  choice: watakapofunga
  rationale: Kufunga ni istilahi ya kawaida ya kidini kwa kujinyima chakula, kama inavyodokezwa na νηστεύω.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku hizo
  rationale: Inahifadhi marudio na msisitizo uliopo katika Kigiriki.
theological_decisions:
- issue: Iwapo kauli ya kutendwa katika ἀπαρθῇ ilainishwe kuwa kuondoka kwa hiari
  choice: bwana arusi atakapoondolewa kutoka kwao
  alternative: bwana arusi atakapoondoka kutoka kwao
  rationale: Kigiriki kinaonyesha jambo linalotendwa kwa bwana arusi. Tafsiri hii inadumisha dokezo zito la kuondolewa kwake bila kufafanua moja kwa moja namna au sababu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “na ... ndipo” unahifadhi kwa kiasi kinachowezekana mpangilio na msisitizo wa sentensi ya Kigiriki.
