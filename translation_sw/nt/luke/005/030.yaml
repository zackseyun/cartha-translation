base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: sw
  text: Nao Mafarisayo na waandishi wao wa sheria walikuwa wakiwanung’unikia[a] wanafunzi wake, wakisema, “Kwa nini mnakula na kunywa pamoja na watoza ushuru na wenye dhambi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakinung’unika.” Kitenzi cha Kigiriki kinaweza kumaanisha kulalamika kwa sauti ya chini, si kutoa pingamizi rasmi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: wakawa wakiwanung’unikia
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea au kurudiwa, kama inavyodokezwa na wakati usiotimilika wa Kigiriki, huku ‘kunung’unikia’ ikihifadhi maana ya kulalamika kwa sauti ya chini.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Hili ni jina linaloeleweka kwa wasomaji wa sasa na linaonyesha kazi ya kundi hili la kihistoria bila kulifanya kuwa maelezo marefu.
- source_word: αὐτῶν
  choice: wao
  rationale: Kiwakilishi hiki kinawahusisha waandishi wa sheria na Mafarisayo, kwa kufuata mpangilio wa kawaida wa maneno ya Kigiriki.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: Pamoja na kitenzi ‘wakiwanung’unikia,’ kiswahili hiki kinaonyesha kwamba maneno yao yalielekezwa kwa wanafunzi wa Yesu.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo namna ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: τελωνῶν
  choice: watoza ushuru
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya maafisa waliokusanya ushuru au tozo, huku ikihifadhi utambulisho wao wa kijamii katika masimulizi ya Injili.
- source_word: ἁμαρτωλῶν
  choice: wenye dhambi
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi namna kundi hili lilivyotajwa na wasemaji bila kuongeza hukumu au maelezo yasiyomo katika mstari.
- source_word: ἐσθίετε καὶ πίνετε
  choice: mnakula na kunywa
  rationale: Inahifadhi vitendo viwili halisi vya Kigiriki na namna ya swali kuhusu mwenendo unaoendelea au wa kawaida.
- source_word: μετὰ
  choice: pamoja na
  rationale: Inaonyesha wazi ushirika wa mezani unaolalamikiwa bila kuongeza ufafanuzi wa kiibada au kimaadili.
- source_word: καὶ
  choice: Nao
  rationale: Inaunganisha mstari na simulizi lililotangulia kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uzito wa kijamii na kidini wa kula pamoja na ‘watoza ushuru na wenye dhambi’
  choice: Kuhifadhi shtaka lenyewe kwa maneno halisi, bila kulipanua kwa maelezo
  alternative: Kufafanua kwamba waliona ushirika huo kuwa kosa la kiibada au la kimaadili
  rationale: Mstari wenyewe unataja makundi hayo na tendo la kula na kunywa pamoja nao. Tafsiri inaacha mvutano huo ujionyeshe bila kuingiza sababu ambayo haijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Waandishi wa sheria’ limetumiwa badala ya ‘waandishi’ pekee ili kuzuia maana ya waandishi wa kawaida; ‘wakawa wakiwanung’unikia’ huhifadhi hali ya tendo lililokuwa likiendelea.
