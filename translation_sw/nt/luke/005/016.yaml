  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: sw
  text: Lakini yeye alikuwa akijiondoa kwenda maeneo ya upweke na kusali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini yeye mwenyewe alikuwa akijitenga katika maeneo ya ukiwa na kusali.” Kigiriki hutumia wakati usiotimilika pamoja na vitenzi-shirikishi vya wakati uliopo, ukionyesha tendo linaloendelea au lililokuwa desturi.
    reason: Huhifadhi mbadala ulio karibu na muundo wa Kigiriki, ikitia ndani msisitizo wa αὐτός, wingi wa «maeneo», na hali ya tendo la wakati uliopita.
lexical_decisions:
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi hiki kimetajwa wazi na kina msisitizo mdogo. ‘Yeye’ kinadumisha msisitizo huo kwa Kiswahili cha kawaida bila kuutia chumvi kwa ‘yeye mwenyewe’ katika matini kuu.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaonyesha tofauti ndogo na habari iliyotangulia kuhusu kuenea kwa sifa ya Yesu na kukusanyika kwa umati.
- source_word: ἦν ὑποχωρῶν
  choice: alikuwa akijitenga
  rationale: Muundo wa kitenzi cha wakati usiotimilika pamoja na kitenzi-shirikishi unaonyesha tendo lililoendelea au lililokuwa desturi. ‘Alikuwa akijitenga’ huhifadhi hali hiyo kwa Kiswahili cha asili.
- source_word: ἐν ταῖς ἐρήμοις
  choice: mahali pasipokuwa na watu
  rationale: Wingi wa ἔρημος hapa unarejelea maeneo ya upweke au yasiyokaliwa, si lazima jangwa la kijiografia. Usemi huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: καὶ
  choice: na
  rationale: Inaunganisha matendo mawili bila kuyafanya moja kuwa kusudi lililotajwa wazi la jingine.
- source_word: προσευχόμενος
  choice: kusali
  rationale: ‘Kusali’ huonyesha kwa kawaida tendo la kumwelekea Mungu katika sala na kuzuia maana finyu ya kuomba kitu inayoweza kusikika katika ‘kuomba.’
theological_decisions:
- issue: Hali ya tendo la Yesu
  choice: Matini kuu inaonyesha kwamba kujitenga na kusali kulikuwa tendo la kuendelea au desturi ya Yesu.
  alternative: Aya inaweza kueleweka kuwa inasimulia tukio moja maalumu la kujitenga na kusali.
  rationale: Muundo wa Kigiriki ἦν pamoja na vitenzi-shirikishi vya wakati uliopo unaelekea kuonyesha tendo lililoendelea au lililorudiwa. Tafsiri haiongezi dai jingine la kiteolojia zaidi ya maana hii ya kisarufi na kisimulizi.
- issue: Uhusiano kati ya kujitenga na kusali
  choice: Matendo yanaunganishwa kwa ‘na.’
  alternative: Kutafsiri ‘ili kusali,’ na hivyo kufanya kusali kuwa kusudi lililotajwa wazi la kujitenga.
  rationale: Kigiriki kinatumia καί kuunganisha vitenzi-shirikishi; ingawa kusali huenda kulikuwa kusudi la kujitenga, matini haisemi hilo kwa kiunganishi cha kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Mahali pasipokuwa na watu’ huepuka kuifanya ἔρημος kuwa jangwa maalumu, huku ‘kusali’ ikieleza sala kwa Mungu kwa uwazi.
