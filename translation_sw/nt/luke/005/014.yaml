source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: sw
  text: Naye akamwagiza asimwambie mtu yeyote, bali aende akajionyeshe kwa kuhani, na atoe sadaka kwa ajili ya utakaso wake kama Musa alivyoamuru[b], kuwa ushuhuda kwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa ushahidi dhidi yao.” Neno “kwao” linaweza kuwarejelea makuhani au watu wengine, na maana ya ushuhuda huo haijaelezwa wazi.
    reason: alternative_reading
  - marker: b
    text: Tazama Walawi 14 kuhusu sadaka ambayo Musa aliamuru itolewe kwa ajili ya utakaso baada ya kupona ugonjwa wa ngozi.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: akamwagiza
  rationale: ‘Akamwagiza’ huonyesha agizo lenye mamlaka bila kuongeza ukali ambao kitenzi cha Kigiriki hakitaji wazi.
- source_word: μηδενὶ εἰπεῖν
  choice: asimwambie mtu yeyote
  rationale: Ni Kiswahili cha kawaida na sahihi kinachohifadhi katazo la kutomwambia yeyote.
- source_word: ἀπελθὼν
  choice: aende
  rationale: Katika mfuatano huu wa maagizo, ‘aende akajionyeshe’ huwasilisha kwa ufasaha tendo la kwenda linalotangulia kujionyesha.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: akajionyeshe kwa kuhani
  rationale: Huhifadhi maana ya moja kwa moja ya kujionyesha kwa kuhani kwa Kiswahili cha kawaida.
- source_word: προσένεγκε
  choice: atoe sadaka
  rationale: Katika muktadha wa ibada na sheria ya Musa, ‘atoe sadaka’ hufafanua kwa kawaida kitu kinachotolewa bila kubadili wajibu wa agizo.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: kwa ajili ya kutakaswa kwake
  rationale: Hueleza kusudi la sadaka na kudumisha wazo la utakaso wa kiibada, si uponyaji wa kimwili pekee.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: kama Musa alivyoamuru
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi rejeo la amri ya Musa.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ili iwe ushuhuda kwao
  rationale: Huhifadhi kutotajwa wazi kwa wale wanaorejelewa na αὐτοῖς na pia kutofafanua kama ushuhuda huo ni wa kuwakubalia au dhidi yao.
theological_decisions:
- issue: Warejelewa na maana ya εἰς μαρτύριον αὐτοῖς
  choice: ili iwe ushuhuda kwao
  alternative: ili iwe ushahidi dhidi yao; ili iwe ushuhuda kwa makuhani
  rationale: Kigiriki hakiwataji wazi wanaorejelewa na ‘kwao’, wala hakiamui wazi kama ushuhuda ni chanya, wa kuthibitisha jambo, au dhidi yao; tafsiri inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘aende akajionyeshe’ ni wa asili na hudumisha mfuatano wa vitendo. ‘Ugonjwa wa ngozi’ katika tanbihi huepuka kulinganisha moja kwa moja istilahi ya kale na ukoma wa kisasa.
