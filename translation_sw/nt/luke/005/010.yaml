id: LUK.5.10
reference: Luke 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: sw
  text: Vivyo hivyo Yakobo na Yohana, wana wa Zebedayo, ambao walikuwa washirika wa Simoni, walishikwa na mshangao. Yesu akamwambia Simoni, “Usiogope; tangu sasa utakuwa ukiwavua watu wakiwa hai.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakuwa ukiwakamata watu wakiwa hai.” Kitenzi cha Kigiriki humaanisha kukamata au kupata mtu akiwa hai; hapa tafsiri “kuwavua” inadumisha pia taswira ya uvuvi.
    reason: lexical_alternative
  - marker: b
    text: Linganisha Mathayo 4:19 na Marko 1:17, ambako Yesu anasema, “Nitawafanya kuwa wavuvi wa watu.” Maneno ya Luka hapa ni tofauti na yanasisitiza kuwapata watu wakiwa hai.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Vivyo hivyo
  rationale: Hueleza kwamba Yakobo na Yohana pia walipatwa na hali ileile iliyotajwa katika muktadha uliotangulia, kwa Kiswahili cha kawaida bila kurundika viunganishi.
- source_word: υἱοὺς Ζεβεδαίου
  choice: wana wa Zebedayo
  rationale: Ni namna ya asili na yenye hadhi ya kutaja uhusiano wao wa kifamilia.
- source_word: κοινωνοὶ
  choice: washirika
  rationale: Katika muktadha wa shughuli ya uvuvi, neno hili linaonyesha ushirika wa kazi, si urafiki wa kawaida tu.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni amri ya kutuliza iliyo ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Huonyesha mwanzo wa badiliko la kudumu katika wito wa Simoni.
- source_word: ἀνθρώπους
  choice: watu
  rationale: Neno la Kigiriki linawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: ζωγρῶν
  choice: utakuwa ukiwavua watu wakiwa hai
  rationale: Huhifadhi taswira ya uvuvi na maana mahususi ya kitenzi, yaani kuwakamata au kuwapata wakiwa hai.
theological_decisions:
- issue: Taswira ya ζωγρέω katika wito wa Simoni
  choice: utakuwa ukiwavua watu wakiwa hai
  alternative: utakuwa mvuvi wa watu
  rationale: Luka anatumia kitenzi chenye maana ya kuwapata wakiwa hai, tofauti na usemi wa ‘wavuvi wa watu’ katika Mathayo 4:19 na Marko 1:17; tofauti hiyo imehifadhiwa badala ya kulinganisha vifungu kimakusudi.
- issue: Upeo wa ἀνθρώπους
  choice: watu
  alternative: wanaume
  rationale: Mrejeleo ni wanadamu kwa ujumla, hivyo ‘watu’ ni sahihi na ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kifungu “walishikwa na mshangao” kimejumuishwa ili kukamilisha kisarufi muundo unaoendelea kutoka mstari wa 9; maana hiyo imo katika ὁμοίως na muktadha, ingawa kitenzi hakirudiwi katika mstari huu.
