id: LUK.5.26
reference: Luke 5:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: sw
  text: Mshangao ukawashika wote, nao walikuwa wakimtukuza Mungu. Wakajawa na hofu, wakisema, “Leo tumeona mambo yasiyo ya kawaida[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo ya kustaajabisha” au “mambo ya ajabu”; neno la Kigiriki humaanisha mambo yaliyo nje ya matarajio ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: mshangao
  rationale: Katika muktadha huu neno linaonyesha mshangao mkubwa uliotokana na tendo waliloliona, si hali ya kiroho inayoweza kuitwa ekstasi.
- source_word: ἔλαβεν ἅπαντας
  choice: ukawashika wote
  rationale: Huhifadhi taswira hai ya msemo wa Kigiriki kwamba mshangao uliwashika watu wote, na ni Kiswahili cha kawaida.
- source_word: ἐδόξαζον
  choice: walikuwa wakimtukuza
  rationale: Muundo huu unadumisha hali endelevu ya kitenzi cha wakati usiotimilifu na maana ya δοξάζω ya kumtukuza Mungu.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na linalofaa kwa θεός katika muktadha huu.
- source_word: ἐπλήσθησαν φόβου
  choice: wakajawa na hofu
  rationale: Ni usemi wa asili unaohifadhi maana ya moja kwa moja ya kujazwa na hofu bila kuilegeza kuwa kicho pekee.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huunganisha kwa kawaida mwitikio wao na maneno yanayofuata.
- source_word: Εἴδομεν
  choice: tumeona
  rationale: Wakati timilifu wa Kiswahili unaonyesha jambo waliloliona muda huo huo na ambalo athari yake bado ipo wanaposema.
- source_word: παράδοξα
  choice: mambo yasiyo ya kawaida
  rationale: Hueleza mambo yaliyo nje ya matarajio ya kawaida bila maana hasi ambayo neno kama ‘mambo ya ajabu’ linaweza kuwa nayo katika baadhi ya miktadha.
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uharaka wa ushuhuda wao.
theological_decisions:
- issue: Maana ya φόβος katika mwitikio kwa tendo la Mungu
  choice: hofu
  alternative: kicho
  rationale: ‘Hofu’ huhifadhi mvutano wa matini kati ya kuogopa na kumtukuza Mungu, bila kufasiri hisia hiyo kuwa kicho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa simulizi umetumiwa kwa viambishi vya mfululizo, huku hali endelevu ya ἐδόξαζον ikihifadhiwa kwa ‘walikuwa wakimtukuza.’ Alama ya tanbihi imewekwa baada ya kirai kinachoifafanua, yaani παράδοξα.
