  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: sw
  text: Baada ya hayo, alitoka, akamwona[a] mtoza ushuru aitwaye Lawi akiwa ameketi kwenye kituo cha ushuru[b], akamwambia, “Nifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamtazama” au “akamwangalia”; kitenzi cha Kigiriki kinaweza kudokeza zaidi ya kuona kwa jicho la haraka tu.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye kibanda cha kukusanyia ushuru” au “kwenye kituo cha forodha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi mpito wa simulizi na wingi wa kiwakilishi bila kufanya Kiswahili kuwa kizito.
- source_word: ἐξῆλθεν
  choice: alitoka
  rationale: Huwasilisha moja kwa moja mwendo halisi unaodokezwa na kitenzi ἐξέρχομαι.
- source_word: ἐθεάσατο
  choice: akamwona
  rationale: Ni Kiswahili cha kawaida na sahihi katika simulizi; tanbihi huhifadhi uwezekano wa maana ya kumtazama au kumwangalia kwa makini zaidi.
- source_word: τελώνην
  choice: mtoza ushuru
  rationale: Ni istilahi iliyo wazi na inayotambulika kwa urahisi kwa kazi ya τελώνης katika Injili.
- source_word: ὀνόματι Λευὶν
  choice: aitwaye Lawi
  rationale: Hutoa kwa ufasaha muundo wa Kigiriki wenye maana ya mtu aliyeitwa kwa jina hilo.
- source_word: καθήμενον
  choice: akiwa ameketi
  rationale: Huhifadhi hali ya Lawi kuwa ameketi mahali pake wakati Yesu alipomwona.
- source_word: ἐπὶ τὸ τελώνιον
  choice: kwenye kituo cha ushuru
  rationale: τελώνιον ni mahali pa kukusanyia kodi, ushuru wa njia, au ushuru wa forodha; ‘kituo cha ushuru’ ni wazi bila kubana maana kwenye aina moja tu.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Ni amri ya moja kwa moja na ya kawaida kwa Kiswahili, inayohifadhi maneno ya mwito bila kuongeza ufafanuzi wa kitheolojia.
theological_decisions:
- issue: Nguvu ya amri ya Yesu kama mwito wa uanafunzi
  choice: Nifuate
  alternative: Uwe mwanafunzi wangu; Njoo unifuate kama mwanafunzi wangu
  rationale: Muktadha unaonyesha mwito wa uanafunzi, lakini tafsiri inahifadhi amri yenyewe bila kuipanua kwa maneno yasiyokuwamo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umeandikwa kwa mtindo wa kawaida wa simulizi la Kiswahili. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
