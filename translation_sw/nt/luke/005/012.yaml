id: LUK.5.12
reference: Luke 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: sw
  text: Ikawa Yesu alipokuwa katika mojawapo ya miji, tazama, kulikuwa na mtu aliyejaa ukoma.[a] Alipomwona Yesu, akaanguka kifudifudi, akamsihi akisema, “Bwana, ukitaka, unaweza kunitakasa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyefunikwa na ukoma.” Kigiriki kinasema kihalisi “aliyejaa ukoma,” kikisisitiza uzito au kuenea kwa hali yake. Neno la kale lililotafsiriwa “ukoma” linaweza pia kumaanisha aina nyingine za ugonjwa wa ngozi.
    reason: lexical_alternative
  - marker: b
    text: Au “unaweza kunifanya safi.” Kitenzi hiki kinaweza kurejelea utakaso wa kimwili na pia wa kiibada na kijamii, si uponyaji wa kitabibu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Inahifadhi mtindo wa Luka wa kuanzisha tukio kwa lugha fupi, ya kawaida katika masimulizi ya Kiswahili cha Biblia.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: Yesu alipokuwa
  rationale: Muundo wa kitenzi-jina cha Kigiriki umetafsiriwa kwa kishazi cha wakati kilicho wazi na cha kawaida; jina Yesu limetumiwa kuondoa utata wa kiwakilishi katika Kiswahili.
- source_word: μιᾷ τῶν πόλεων
  choice: katika mojawapo ya miji
  rationale: πόλις inaweza kuwa mji mkubwa au mdogo; “miji” haiongezi ukubwa ambao Kigiriki hakibainishi.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inadumisha alama ya kisimulizi inayovuta fikira kwenye kuonekana kwa ghafla kwa mtu huyo.
- source_word: πλήρης λέπρας
  choice: aliyejaa ukoma
  rationale: Inahifadhi kwa karibu picha ya πλήρης, “aliyejaa,” na kusisitiza uzito au kuenea kwa hali hiyo bila kuifanya iwe taarifa ya kitabibu ya kisasa.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: akaanguka kifudifudi
  rationale: “Kifudifudi” ni usemi wa asili unaoonyesha kwamba uso wake ulielekea chini, ishara ya unyenyekevu na ombi la dharura.
- source_word: ἐδεήθη αὐτοῦ
  choice: akamsihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati na lenye uzito kuliko “akamwomba” peke yake.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος, ikihifadhi heshima ya mwito huo pamoja na uwezekano wa maana pana zaidi kuhusu utambulisho wa Yesu.
- source_word: ἐὰν θέλῃς
  choice: ukitaka
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha hiari ya Yesu, si shaka kuhusu uwezo wake.
- source_word: δύνασαί με καθαρίσαι
  choice: unaweza kunitakasa
  rationale: Inadumisha tofauti kati ya uwezo na utashi, na “kunitakasa” huhifadhi maana ya kimwili pamoja na athari za kiibada na kijamii za καθαρίζω.
theological_decisions:
- issue: Maana ya λέπρα katika ulimwengu wa kale
  choice: ukoma
  alternative: ugonjwa wa ngozi
  rationale: “Ukoma” ni neno linalotambulika katika mapokeo ya Biblia, lakini λέπρα ya kale inaweza kuhusisha magonjwa mbalimbali ya ngozi; tanbihi inalinda upana huo bila kubadilisha maandishi kuwa maelezo ya kitabibu.
- issue: Maana ya καθαρίσαι katika ombi la mgonjwa
  choice: kunitakasa
  alternative: kuniponya
  rationale: “Kunitakasa” huhifadhi mvutano wa maana za uponyaji wa mwili, usafi wa kiibada, na kurejeshwa katika jamii badala ya kuufupisha kuwa uponyaji wa kitabibu tu.
- issue: Mwito κύριε kwa Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi mwito wa heshima na mwangwi unaowezekana wa kikristo bila kudai kwamba muktadha huu pekee unafafanua kikamilifu uelewa wa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ikawa” na “tazama” zimehifadhiwa kama alama za kimakusudi za mtindo wa kisimulizi wa Luka; sehemu nyingine imetolewa kwa lugha ya kawaida na inayoeleweka. Alama za tanbihi zimewekwa baada ya maneno ambayo tanbihi zake zinafafanua.
