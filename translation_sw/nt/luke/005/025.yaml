  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: sw
  text: Mara akasimama mbele yao, akainua kile alichokuwa amelalia,[a] akaenda nyumbani kwake huku akimtukuza Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkeka aliokuwa amelalia” (kwa maana halisi, “kile alichokuwa amelalia”).
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Mara moja
  rationale: Huonyesha kwamba jambo lilitokea bila kuchelewa na huhifadhi msisitizo wa Luka juu ya uponyaji wa papo hapo.
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Ingawa ni kitenzi tegemezi cha wakati uliopita, mfululizo wa vitenzi vya Kiswahili wenye kiambishi -ka- unasimulia matendo kwa mpangilio wa kawaida na wa wazi.
- source_word: ἐνώπιον αὐτῶν
  choice: mbele yao
  rationale: Ni tafsiri ya moja kwa moja inayoonyesha kwamba alisimama hadharani wakiwa wanamwona, bila kuongeza wazo lisilotajwa wazi.
- source_word: ἄρας
  choice: akachukua
  rationale: Katika muktadha huu kitenzi kinaonyesha kukiinua na kwenda nacho kile alichokuwa amelalia; 'akachukua' ni ya kawaida na inafaa katika simulizi.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: kile alichokuwa amelalia
  rationale: Huhifadhi usemi wa Kigiriki usiotaja moja kwa moja kama kitu hicho kilikuwa mkeka, godoro, au kitanda.
- source_word: κατέκειτο
  choice: alichokuwa amelalia
  rationale: Muundo huu unaonyesha hali yake ya awali iliyokuwa ikiendelea kabla ya kusimama.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Kwa kuwa mahali alipoenda panatajwa mara moja, 'akaenda nyumbani kwake' ni Kiswahili cha kawaida na huwasilisha kuondoka kwake kwa uwazi.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: οἶκος inaweza kumaanisha nyumba au makao; 'nyumbani kwake' ni usemi wa asili unaolenga mahali pake pa kuishi.
- source_word: δοξάζων τὸν θεόν
  choice: huku akimtukuza Mungu
  rationale: Muundo wa 'huku' unaonyesha kwamba tendo hili liliendelea wakati akienda, na 'kumtukuza Mungu' huhifadhi maana ya kumpa Mungu utukufu na heshima.
theological_decisions:
- issue: Iwapo kitu alichochukua kitajwe kuwa mkeka, godoro, au kitanda
  choice: Matini kuu iseme 'kile alichokuwa amelalia'
  alternative: mkeka aliokuwa amelalia
  rationale: Kigiriki cha aya hii hakitumii nomino dhahiri kwa kitu hicho. Usemi usio maalumu huhifadhi upeo wa matini, huku tanbihi ikitoa namna iliyo wazi zaidi kwa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfululizo wa -ka- umetumiwa kwa masimulizi ya matendo yanayofuatana; 'huku akimtukuza' huhifadhi tendo linaloandamana na kwenda kwake.
