  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: sw
  text: Nao waandishi na Mafarisayo wakaanza kujadiliana, wakisema, “Ni nani huyu anayesema maneno ya kukufuru? Ni nani anayeweza kusamehe dhambi isipokuwa Mungu peke yake?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: wakaanza kuhojiana
  rationale: ‘Wakaanza’ huakisi ἤρξαντο pamoja na kitenzi-jina. ‘Kuhojiana’ linaweza kuonyesha kutafakari, kuulizana, au kujadiliana kwao bila kuamua kwamba jambo hilo lilikuwa mawazo ya ndani tu au mazungumzo ya sauti.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: ‘Waandishi’ ni istilahi ya kawaida ya kibiblia kwa wataalamu hawa wa Sheria; haiongezi ufafanuzi ‘wa sheria’ ambao haupo wazi katika neno la Kigiriki hapa.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hilo.
- source_word: λαλεῖ βλασφημίας
  choice: anayesema maneno ya kukufuru
  rationale: Kauli hii ni ya asili katika Kiswahili na inadumisha wingi wa βλασφημίας kwa kutumia ‘maneno,’ badala ya kuibadili kuwa kitenzi ‘anakufuru’ pekee.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: kusamehe dhambi
  rationale: Hii ndiyo nahau ya kawaida na iliyo wazi katika Kiswahili kwa kuondoa hatia ya dhambi.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: isipokuwa Mungu peke yake
  rationale: ‘Isipokuwa’ huonyesha upekee wa εἰ μή, huku ‘peke yake’ ikidumisha msisitizo wa μόνος.
- source_word: Τίς ἐστιν οὗτος
  choice: Ni nani huyu
  rationale: Tafsiri hii inadumisha swali fupi na lenye dharau bila kuongeza neno ‘mtu,’ ambalo halipo katika Kigiriki.
theological_decisions:
- issue: Maana inayodokezwa kuhusu mamlaka ya Yesu ya kusamehe dhambi
  choice: Kauli ya wapinzani kwamba Mungu peke yake ndiye anayeweza kusamehe dhambi imetafsiriwa moja kwa moja.
  alternative: Kupunguza upekee wa dai hilo au kuongeza hitimisho la wazi kuhusu utambulisho wa Yesu.
  rationale: Mstari wenyewe unaacha mvutano huo wa kiteolojia ndani ya simulizi; tafsiri haipaswi kuupunguza wala kuutatua kwa kuongeza hitimisho lisilotamkwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuhojiana’ huhifadhi kwa kiasi fulani uwezekano wa kufikiri, kuulizana, au kujadiliana; ‘maneno ya kukufuru’ ni ya asili kuliko ‘makufuru’ katika sentensi hii.
