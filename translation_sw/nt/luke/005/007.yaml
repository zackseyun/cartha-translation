  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: sw
  text: Basi wakawapa ishara washirika wao waliokuwa katika mashua nyingine, waje wawasaidie. Nao wakaja, wakazijaza mashua zote mbili, hata zikaanza kuzama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata zikawa zinazama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: wakawapungia ishara
  rationale: Kitenzi hiki huonyesha kutoa ishara kwa mwili, yaelekea kutoka mbali majini. Usemi huu ni wa kawaida katika Kiswahili na hauelezi kwa uhakika aina ya ishara iliyotolewa.
- source_word: μετόχοις
  choice: washirika wao
  rationale: Katika muktadha wa uvuvi, neno hili linaonyesha watu walioshirikiana nao katika kazi, si wenzi wa kawaida tu.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: waliokuwa katika mashua nyingine
  rationale: Hutofautisha mashua hiyo na ile ya kwanza kwa Kiswahili cha masimulizi kilicho wazi na cha kawaida.
- source_word: τοῦ ἐλθόντας
  choice: waje
  rationale: Muundo wa Kigiriki unaonyesha kusudi la ishara; kauli tegemezi ya Kiswahili huwasilisha kusudi hilo kwa kawaida.
- source_word: συλλαβέσθαι αὐτοῖς
  choice: wawasaidie
  rationale: Katika muktadha huu maana ni kujiunga nao katika kazi ya kuvuta samaki; 'wawasaidie' ni wazi na ya kawaida bila kuongeza kitendo kisichotajwa moja kwa moja.
- source_word: ἔπλησαν
  choice: wakazijaza
  rationale: Huhifadhi picha ya kujaza mashua; kwamba zilijazwa samaki inaeleweka kutokana na muktadha.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: mashua zote mbili
  rationale: Huwakilisha kwa usahihi msisitizo wa ἀμφότερα kwamba mashua zote mbili zilijazwa.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: hata zikaanza kuzama
  rationale: Huwasilisha matokeo na tendo linaloendelea bila kudai kwamba mashua zilizama kabisa.
