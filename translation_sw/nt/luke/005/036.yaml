  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Vazi’ na ‘kiraka’ ni maneno ya kawaida; muundo umewekwa wa asili bila kuongeza kwamba kiraka kinashonwa, kwa kuwa Kigiriki husema tu kwamba kinawekwa juu ya vazi.
