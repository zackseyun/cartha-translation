  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: sw
  text: 'Pia alikuwa akiwaambia mfano huu: “Hakuna mtu anayechana kiraka kutoka katika vazi jipya na kukitia kwenye vazi la zamani.[a] La sivyo, atalichana vazi jipya, na kiraka kutoka katika vazi jipya hakitaendana na vazi la zamani.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Hakuna mtu ambaye, baada ya kuchana kiraka kutoka katika vazi jipya, hukitia kwenye vazi la zamani.”'
    reason: lexical_alternative
  - marker: b
    text: “Hakitaendana” pia inaweza kutafsiriwa “hakitalingana,” “hakitaafikiana,” au “hakitalifaa.” Neno la Kigiriki linaeleza kutopatana au kutofaa kwa kiraka hicho na vazi la zamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Pia akawaambia
  rationale: Huwasilisha kuendelea kwa simulizi pamoja na wazo la ‘pia’ kwa Kiswahili cha kawaida; muktadha wa kusema kwao unaelezwa wazi.
- source_word: παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ni neno la kawaida na lililozoeleka katika Kiswahili cha Biblia kwa παραβολή.
- source_word: ἐπίβλημα
  choice: kiraka
  rationale: Katika muktadha wa mavazi, neno hili humaanisha kipande kinachotumiwa kuziba sehemu iliyochanika.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: kutoka katika vazi jipya
  rationale: ‘Vazi’ ni pana na la asili kwa ἱμάτιον bila kulibana kuwa aina maalumu ya nguo.
- source_word: σχίσας ἐπιβάλλει
  choice: anayechana ... na kukitia
  rationale: Muundo huu wa Kiswahili huonyesha kitendo cha kwanza na kinachofuata kwa urahisi, huku ukidumisha maana ya kitenzi kishirikishi cha wakati uliopita.
- source_word: ἐπὶ ἱμάτιον παλαιόν
  choice: kwenye vazi kuukuu
  rationale: ‘Kuukuu’ hutofautisha vazi lililotumika na vazi jipya kwa njia ya kawaida na wazi.
- source_word: εἰ δὲ μήγε
  choice: Akifanya hivyo
  rationale: Katika muktadha huu, kishazi hiki huanzisha matokeo ya kufanya jambo lililotajwa, kwa Kiswahili cha kawaida.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: atakuwa amelichana vazi jipya
  rationale: Kitenzi cha Kigiriki ni tendaji na mhusika ni yule mtu; tafsiri hii huweka wazi kwamba kuchana kiraka kunaliharibu vazi jipya.
- source_word: οὐ συμφωνήσει
  choice: hakitalingana
  rationale: ‘Kulingana’ huhifadhi wigo wa maana ya kutopatana au kutofaa bila kuamua ikiwa tatizo hasa ni sura, ukubwa, au ufaafu.
