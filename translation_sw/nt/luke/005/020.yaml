  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: sw
  text: Naye alipoiona imani yao, akasema, “Mtu, umesamehewa dhambi zako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhambi zako zimesamehewa.” Kauli timilifu tendwa ya Kigiriki inaweza kukazia hali ya sasa inayotokana na tendo lililotimizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoiona
  rationale: Muundo huu wa wakati unaonyesha kwamba kauli ya Yesu ilifuata kuona kwake imani yao, bila kuongeza maelezo yasiyokuwapo katika Kigiriki.
- source_word: πίστιν
  choice: imani
  rationale: ‘Imani’ ni neno la kawaida la kibiblia na hapa linamaanisha kumtumaini Yesu kulikodhihirishwa kwa tendo lao.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi cha wingi kinahifadhi upeo wa Kigiriki bila kuamua kama kinawahusu waliombeba pekee au wao pamoja na aliyepooza.
- source_word: Ἄνθρωπε
  choice: Mwanadamu
  rationale: Huhifadhi mwito wa moja kwa moja wa ἄνθρωπε bila kuingiza ukaribu wa ‘rafiki’ ambao haujaelezwa wazi katika chanzo.
- source_word: ἀφέωνταί
  choice: umesamehewa
  rationale: Kauli timilifu tendwa inaelezwa kwa Kiswahili cha kawaida kama hali ya sasa iliyotokana na tendo lililotimizwa.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa ἁμαρτίαι katika muktadha wa kimaadili na kitheolojia.
- source_word: σοι ... σου
  choice: umesamehewa ... dhambi zako
  rationale: Muundo wa Kiswahili humtaja mpokeaji kwa kiambishi ‘u-’ katika ‘umesamehewa’ na huhifadhi umilikaji katika ‘dhambi zako’ kwa njia ya asili.
theological_decisions:
- issue: Upeo wa ‘imani yao’
  choice: Kuhifadhi kiwakilishi cha wingi bila kufafanua wahusika wake zaidi.
  alternative: Kusema wazi kuwa ni imani ya watu waliombeba, au imani ya pamoja ya mtu aliyepooza na wenzake.
  rationale: Kigiriki αὐτῶν ni cha wingi lakini hakiamui kwa uwazi ni washiriki gani hasa wanaohesabiwa; tafsiri inahifadhi mvutano huo.
- issue: Nguvu na wakati wa tamko la msamaha
  choice: ‘Umesamehewa dhambi zako,’ tamko tendwa linaloonyesha hali ya msamaha.
  alternative: ‘Dhambi zako zinasamehewa’ au ‘dhambi zako zimekwisha kusamehewa.’
  rationale: Kauli timilifu tendwa ya Kigiriki inathibitisha hali halisi ya msamaha unaotokana na tendo lililotimia, bila kuamua wazi kama Yesu anautenda wakati huo au anatangaza msamaha uliokwisha kutolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mwanadamu’ ni rasmi kiasi, lakini huhifadhi mwito wa Kigiriki kuliko ‘rafiki.’
