  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: sw
  text: Simoni akajibu, “Mwalimu[a], tumefanya kazi kwa bidii usiku kucha, na hatukupata chochote; lakini kwa neno lako[b] nitazishusha nyavu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msimamizi.” Neno la Kigiriki humtaja mwenye mamlaka au msimamizi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, “kwa kutegemea neno lako” au “kwa sababu ya neno lako.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: akajibu
  rationale: Muundo huu wa Kigiriki hutanguliza maneno ya mhusika; katika Kiswahili, kitenzi kimoja ‘akajibu’ huwasilisha maana hiyo kwa kawaida bila kurudia ‘akajibu akasema.’
- source_word: Ἐπιστάτα
  choice: Mwalimu
  rationale: Ni neno la kumwita mwenye mamlaka au msimamizi. ‘Mwalimu’ ni namna ya kawaida na yenye heshima ya kumwita Yesu katika muktadha huu, bila kutumia ‘Bwana,’ ambalo lingeweza kuingiza uzito wa κύριος usiopo hapa.
- source_word: δι’ ὅλης νυκτὸς
  choice: usiku kucha
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa usiku.
- source_word: κοπιάσαντες
  choice: tumefanya kazi kwa bidii
  rationale: Kitenzi kinasisitiza juhudi kubwa na uchovu; ‘kwa bidii’ huwasilisha nguvu ya tendo kwa lugha inayoeleweka kwa urahisi.
- source_word: οὐδὲν ἐλάβομεν
  choice: hatukupata chochote
  rationale: Katika mazingira ya uvuvi maana ni kutopata samaki wowote. Tafsiri hii ni ya kawaida na haihitaji kuongeza nomino ‘samaki,’ ambayo haikutajwa wazi katika Kigiriki.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: hata hivyo, kwa neno lako
  rationale: Muundo huu unaonyesha msingi au sababu ya hatua ya Simoni. ‘Kwa neno lako’ huhifadhi ufupi na uwezekano wa kuelewa kwamba anafanya hivyo kwa kutegemea au kwa sababu ya agizo la Yesu.
- source_word: χαλάσω
  choice: nitazishusha
  rationale: Kitenzi kinamaanisha kushusha nyavu majini; kiambishi ‘-zi-’ kinarejelea nyavu za wingi.
- source_word: τὰ δίκτυα
  choice: nyavu
  rationale: Wingi wa maandishi ya SBLGNT umehifadhiwa; muktadha tayari unaonyesha kuwa ni nyavu za kuvulia.
theological_decisions:
- issue: Tafsiri ya cheo cha Yesu Ἐπιστάτα
  choice: Mwalimu
  alternative: Bwana; Mkuu
  rationale: Chanzo kimetumia ἐπιστάτης, si κύριος. ‘Mwalimu’ huonyesha heshima na mamlaka kwa Kiswahili cha kawaida bila kuingiza mapema maana pana ya kikristo inayoweza kuhusishwa na ‘Bwana.’ Tanbihi inahifadhi uwezekano wa ‘Mkuu.’
- issue: Msingi wa utiifu katika ἐπὶ τῷ ῥήματί σου
  choice: kwa neno lako
  alternative: kwa sababu ya neno lako; kwa kutegemea neno lako
  rationale: Tafsiri kuu haifungi muundo huo kwa sababu pekee au utegemezi pekee, hivyo inadumisha mvutano wa maana uliopo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Usiku kucha’ na ‘kufanya kazi kwa bidii’ ni semi za kawaida; ‘kwa neno lako’ hudumisha uzito na utata halisi wa kauli ya chanzo.
