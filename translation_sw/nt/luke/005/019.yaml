  terminology: Majina na istilahi ziko sawa. “Kitanda” huepuka kufungamanisha κλινίδιον na aina maalumu ya mkeka, huku tanbihi ikieleza ukubwa/aina ya kitanda. Tanbihi zote zinaendana na alama zake.
