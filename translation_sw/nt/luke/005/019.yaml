  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: sw
  text: Nao, kwa kuwa hawakupata njia ya kumwingiza ndani kwa sababu ya umati,[a] walipanda juu ya paa, wakamshusha pamoja na kitanda chake[c] kupitia vigae vya paa[b] hadi katikati, mbele ya Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakujua jinsi ya kumwingiza ndani kwa sababu ya umati.” Usemi wa Kiyunani unaweza kusisitiza njia ya kuingilia au namna ya kumwingiza.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kupitia vigae vilivyofunika paa. Maneno ya Luka yanaonyesha paa lililoezekwa kwa vigae.
    reason: cultural_note
  - marker: c
    text: Au, “kitanda chake kidogo,” “mkeka wake,” au “machela yake.” Neno la Kiyunani linamaanisha kitanda kidogo au tandiko la kulalia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: njia ya kumwingiza ndani
  rationale: Kirai hiki cha Kiyunani kinaweza kumaanisha njia ya kuingilia au namna ya kumwingiza. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la kutafuta njia ya kuingia.
- source_word: διὰ τὸν ὄχλον
  choice: kwa sababu ya umati
  rationale: διά pamoja na nomino katika hali ya akusativi hapa inaonyesha sababu; umati ndio uliowazuia.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: walipanda juu ya paa
  rationale: δῶμα hapa ni sehemu ya juu ya nyumba, yaani paa; usemi huu unaonyesha wazi mwendo wa kupanda.
- source_word: διὰ τῶν κεράμων
  choice: kupitia vigae vya paa
  rationale: κέραμος katika wingi hurejelea vigae, na kutaja paa kwa uwazi kunasaidia msomaji wa sasa kuelewa muundo wa nyumba.
- source_word: καθῆκαν
  choice: wakamshusha
  rationale: Kitenzi kinaeleza kumteremsha mtu au kitu kutoka juu.
- source_word: σὺν τῷ κλινιδίῳ
  choice: pamoja na mkeka wake
  rationale: κλινίδιον ni kitanda kidogo, tandiko, au mkeka wa kulalia. “Mkeka” ni neno la kawaida lisilodokeza bila lazima machela ya kitabibu.
- source_word: εἰς τὸ μέσον
  choice: hadi katikati
  rationale: Kirai kinaonyesha walipomweka, yaani sehemu ya kati ya mkusanyiko.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: mbele ya Yesu
  rationale: 'Hii inadumisha maana ya mahali: walimweka upande wa mbele wa Yesu.'
