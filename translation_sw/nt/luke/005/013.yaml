  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: sw
  text: Naye akanyosha mkono, akamgusa, akisema, “Nataka; takaswa.” Mara moja ukoma[a] ukamwacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “ugonjwa wa ngozi.” Katika matumizi ya kibiblia, neno la Kigiriki λέπρα linaweza kurejelea hali mbalimbali za ngozi, si ugonjwa wa Hansen unaoitwa ukoma leo pekee.
    reason: Maelezo ya kitamaduni na kileksika kuhusu upana wa maana ya λέπρα.
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: akanyosha mkono
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kunyoosha mkono kabla ya kumgusa mtu huyo, huku ikidumisha mtiririko wa kauli ya Kigiriki.
- source_word: ἥψατο αὐτοῦ
  choice: akamgusa
  rationale: Kitenzi hiki humaanisha kumgusa; kiwakilishi cha yambwa kimeunganishwa na kitenzi kwa muundo wa kawaida wa Kiswahili.
- source_word: εἰπών
  choice: akisema
  rationale: Hudumisha hali ya kitenzi kishirikishi kinachoanzisha maneno ya moja kwa moja bila kufanya sentensi kuwa ngumu.
- source_word: Θέλω
  choice: Nataka
  rationale: Katika muktadha huu huonyesha nia na utayari wa Yesu kuitikia ombi la mtu huyo. “Nataka” ni fupi, ya asili, na inalingana na swali la awali kuhusu utayari wake.
- source_word: καθαρίσθητι
  choice: takasika
  rationale: Amri ya hali ya kutendwa imehifadhiwa. “Takasika” hubeba maana ya kuondolewa unajisi na pia kupona, badala ya kuifanya kuwa uponyaji wa kimatibabu pekee.
- source_word: εὐθέως
  choice: Mara moja
  rationale: Ni usemi wa kawaida na wazi unaoonyesha kwamba jambo hilo lilitokea bila kuchelewa.
- source_word: ἡ λέπρα
  choice: ukoma
  rationale: “Ukoma” ndiyo tafsiri ya jadi na inayotambulika kwa urahisi, ingawa neno la Kigiriki linaweza kujumuisha magonjwa mbalimbali makali ya ngozi; upana huo umeelezwa katika tanbihi.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: ukamwacha
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira ya ugonjwa kumwondoka mtu huyo.
theological_decisions:
- issue: Maana ya καθαρίσθητι katika kuponywa kwa mtu mwenye ukoma
  choice: takasika
  alternative: ponywa; kuwa safi
  rationale: Neno la Kigiriki linasisitiza kutakaswa, jambo linalohusisha kupona kimwili na kuondolewa hali ya unajisi. “Takasika” huhifadhi vipengele hivyo bila kupunguza maana kuwa uponyaji wa kimatibabu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa maandiko. “Naye” huunganisha mstari na simulizi lililotangulia; mfuatano wa vitenzi vya “aka-” huonyesha hatua zinazofuatana kwa ufasaha. Alama ya tanbihi imewekwa baada ya “ukoma,” ambako maelezo yake yanahusika moja kwa moja.
