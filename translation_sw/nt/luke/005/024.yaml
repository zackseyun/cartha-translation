  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: sw
  text: Lakini ili mjue kwamba Mwana wa Adamu[a] ana mamlaka duniani ya kusamehe dhambi—akamwambia mtu aliyepooza, “Ninakuambia, inuka, chukua mkeka wako[b], nenda nyumbani kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mwanadamu.” Cheo cha Kigiriki “Mwana wa Adamu” kimehifadhiwa kwa sababu Yesu anajitaja kwa cheo hiki, nacho kina mwangwi muhimu wa kibiblia, hasa katika Danieli 7.
    reason: alternative_reading
  - marker: b
    text: Au “kitanda chako.” Neno la Kigiriki κλινίδιον linaweza kumaanisha kitanda kidogo, tandiko, au mkeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Lakini ili
  rationale: δέ inaleta mpito wenye utofautishaji wa kiasi, na ἵνα hapa inaanzisha kusudi; “Lakini ili” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: εἰδῆτε
  choice: mjue
  rationale: Kitenzi hiki kinaonyesha kujua kwa uhakika; “mjue” ni tafsiri ya moja kwa moja na ya asili katika muktadha huu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina ambalo Yesu anajitumia mwenyewe na lina mwangwi muhimu wa Danieli 7; umbo la kimapokeo la Kiswahili linahifadhi uzito wake wa kibiblia.
- source_word: ἐξουσίαν ἔχει
  choice: ana mamlaka
  rationale: ἐξουσία inasisitiza haki au mamlaka halali ya kutenda, si nguvu tupu; “ana mamlaka” linafaa kwa mabishano kuhusu kusamehe dhambi.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Ni usemi wa mahali ulio wazi; “duniani” ni wa asili na hauongezi ufafanuzi wa kimafundisho.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ya kusamehe dhambi
  rationale: Katika muktadha huu ἀφίημι humaanisha kuondolea au kusamehe dhambi; “kusamehe dhambi” ni wazi na sanifu.
- source_word: τῷ παραλελυμένῳ
  choice: mtu aliyepooza
  rationale: Kivumishi-nyambulishi kinamtaja mtu mwenye hali hiyo; usemi huu ni wa sasa, wazi, na wenye kumweka mtu mbele ya hali yake.
- source_word: Σοὶ λέγω
  choice: Ninakuambia
  rationale: Kiwakilishi Σοί kimetangulizwa kwa mkazo; “Ninakuambia” huhifadhi maelekezo ya moja kwa moja na mkazo huo kwa Kiswahili asilia.
- source_word: ἔγειρε
  choice: inuka
  rationale: Amri hii inataka tendo la mara moja; “inuka” ni fupi, yenye heshima, na ya kawaida.
- source_word: ἄρας
  choice: chukua
  rationale: αἴρω hapa ni kuinua kitu ili kwenda nacho; “chukua” huwasilisha tendo hilo kwa kawaida bila kulazimisha maelezo zaidi.
- source_word: κλινίδιόν σου
  choice: mkeka wako
  rationale: κλινίδιον ni kitanda kidogo, godoro jepesi, au tandiko; “mkeka” linaeleweka kama tandiko linaloweza kubebwa, huku tanbihi ikihifadhi uwezekano wa “kitanda.”
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: uende nyumbani kwako
  rationale: πορεύου ni amri ya kwenda, na εἰς τὸν οἶκόν σου inaonyesha mahali anapoelekea; Kiswahili hutumia kwa asili kiunganishi baada ya mfululizo wa amri.
theological_decisions:
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi jina la Yesu la kujitaja, mwangwi wake wa Danieli 7, na mvutano wake wa maana bila kulipunguza kuwa maelezo ya ubinadamu pekee.
- issue: Maana ya ἐξουσία kuhusiana na kusamehe dhambi
  choice: mamlaka
  alternative: nguvu
  rationale: Hoja ya kifungu ni haki ya Yesu ya kusamehe dhambi, si uwezo wa kufanya muujiza tu; “mamlaka” huhifadhi dai hilo.
- issue: Upeo wa ἐπὶ τῆς γῆς
  choice: duniani
  alternative: katika ulimwengu wa kidunia
  rationale: Tafsiri fupi ya mahali huacha dai la maandiko lisimame bila kulipanua kwa ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mkato wa kisimulizi wa Kigiriki kwa alama ya mkwaju, kisha inaendelea na maneno ya Yesu. “Mtu aliyepooza” ni lugha wazi na inayomheshimu mtu; “mkeka” ni nyepesi na ya kubebeka katika muktadha, huku tanbihi ikitoa mbadala mpana.
