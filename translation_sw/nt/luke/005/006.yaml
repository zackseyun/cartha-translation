  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: sw
  text: Walipofanya hivyo, walinasa[a] samaki wengi sana, na nyavu zao zilikuwa zikichanika.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “waliwafungia ndani” au “waliwazungushia kwa nyavu.” Kitenzi cha Kigiriki kinaonyesha picha ya samaki kuzungukwa ndani ya nyavu.
    reason: lexical_alternative
  - marker: b
    text: Au “nyavu zao zikaanza kuchanika.” Kitenzi cha Kigiriki kinaonyesha kuchanika kulikokuwa kukiendelea, si lazima kwamba nyavu zilichanika kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Walipofanya hivyo
  rationale: Kirai cha wakati kinaonyesha kwamba walitekeleza agizo lililotangulia kabla ya matokeo yaliyosimuliwa, kwa Kiswahili cha kawaida na cha asili.
- source_word: συνέκλεισαν
  choice: walinasa
  rationale: Katika muktadha wa uvuvi, “walinasa” ni usemi wa kawaida unaoeleza samaki kutiwa ndani ya nyavu. Dokezo linaonyesha picha halisi zaidi ya kitenzi cha Kigiriki ya kuwazungushia au kuwafungia ndani.
- source_word: πλῆθος ἰχθύων πολύ
  choice: samaki wengi sana
  rationale: Usemi huu wa asili na wenye mkazo unawakilisha wingi uliosisitizwa na πλῆθος pamoja na πολύ bila kuwa mzito katika Kiswahili.
- source_word: διερρήσσετο
  choice: zilikuwa zikichanika
  rationale: Kauli ya wakati usiotimilika inaonyesha mchakato uliokuwa ukiendelea, si lazima kwamba nyavu zilikuwa zimekwisha chanika kabisa.
- source_word: τὰ δίκτυα αὐτῶν
  choice: nyavu zao
  rationale: Inahifadhi wingi wa nomino na umilikaji ulio wazi katika Kigiriki kwa Kiswahili sanifu.
