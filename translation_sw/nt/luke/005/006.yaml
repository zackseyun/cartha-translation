  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Samaki wengi sana” huhifadhi mkazo wa wingi, huku “zilikuwa zikichanika” ikihifadhi hali ya tendo linaloendelea.
