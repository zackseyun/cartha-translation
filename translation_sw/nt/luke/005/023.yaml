  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: sw
  text: 'Kipi ni rahisi zaidi: kusema, “Dhambi zako zimesamehewa,” au kusema, “Inuka, utembee”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Kipi ni rahisi zaidi
  rationale: Muundo huu unauliza ni lipi kati ya maneno mawili lililo rahisi; Kiswahili hiki ni cha kawaida na kinahifadhi ulinganisho.
- source_word: εἰπεῖν
  choice: kusema
  rationale: Kitenzi-jina hiki kinatanguliza yaliyomo katika kauli mbili zinazolinganishwa.
- source_word: Ἀφέωνταί σοι αἱ ἁμαρτίαι σου
  choice: Umesamehewa dhambi zako
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya sasa inayotokana na tendo la kusamehe lililotimia, huku ukiacha mtendaji wa msamaha bila kutajwa kama ilivyo katika kauli ya Kigiriki.
- source_word: ἢ
  choice: au
  rationale: Kiunganishi hiki kinatofautisha kauli mbili.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Amri hii ya kawaida na yenye heshima inamtaka mtu ainuke.
- source_word: καὶ περιπάτει
  choice: utembee
  rationale: Hapa kitenzi kinamaanisha kutembea kihalisi. Muundo wa amri unaofuatana ‘Inuka, utembee’ ni wa asili katika Kiswahili.
theological_decisions:
- issue: Kuwasilisha kauli ya msamaha bila kuongeza maelezo ya kiimani kuhusu wakati au mtendaji
  choice: Umesamehewa dhambi zako
  alternative: Dhambi zako zimesamehewa
  rationale: Chaguo hili linahifadhi nguvu ya tangazo la msamaha na hali inayotokana na tendo lililotimia. Halimtaji mtendaji wa msamaha, kwa kuwa Kigiriki kimetumia hali ya kutendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Hakuna tanbihi inayohitajika; tofauti ya ‘umesamehewa’ na ‘zimesamehewa’ ni ya mpangilio wa kawaida wa Kiswahili na haibadili maana ya msingi.
