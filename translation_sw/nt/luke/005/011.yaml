base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: sw
  text: Walipokwisha kuzileta mashua nchi kavu, waliacha kila kitu, wakamfuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: Walipokwisha kuzileta
  rationale: Kirai hiki kinaonyesha tendo lililotangulia matendo makuu ya kuacha na kufuata; muundo huu wa Kiswahili unaweka wazi mfuatano huo kwa lugha ya kawaida.
- source_word: τὰ πλοῖα
  choice: mashua
  rationale: Katika mazingira ya uvuvi katika Ziwa Galilaya, 'mashua' ni neno la kawaida na linalofaa kuliko 'meli'.
- source_word: ἐπὶ τὴν γῆν
  choice: nchi kavu
  rationale: Kirai hiki kihalisi kinaelekeza kutoka majini hadi kwenye nchi kavu. Tafsiri hii ni ya asili katika Kiswahili na hailazimishi maana finyu ya 'ufukoni'.
- source_word: ἀφέντες
  choice: waliacha
  rationale: Kitenzi hapa kina maana ya kuacha nyuma. Kutumia kitenzi kamili kunafanya sentensi iwe wazi na ya asili huku mfuatano wa matendo ukibaki.
- source_word: πάντα
  choice: kila kitu
  rationale: Hili linaonyesha ujumla kamili kwa Kiswahili cha kawaida bila kuongeza ni vitu gani hasa vilivyoachwa.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  rationale: Muundo wa '-ka-' unaendeleza mfuatano wa simulizi; 'kumfuata' huhifadhi maana ya kwenda nyuma yake pamoja na dokezo la kuwa wanafunzi wake bila kulifafanua kupita maandishi.
theological_decisions:
- issue: Upeo wa kuacha unaoonyeshwa na πάντα
  choice: waliacha kila kitu
  alternative: waliacha vyote
  rationale: Maandishi yanaonyesha kuacha kwa ujumla bila kueleza vitu hususa wala kuamua kama walivikana mali zao kabisa na kwa kudumu. 'Kila kitu' huhifadhi nguvu hiyo na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti za kimsamiati zinaweza kuwakilishwa kwa uwazi katika matini kuu bila kupoteza utata halisi.
