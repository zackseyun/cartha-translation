    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya Luka ya kuanzisha tukio. “Ikawa” huhifadhi mtiririko wa simulizi bila kuongeza neno la wazi la wakati lisilokuwamo katika Kigiriki.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: ulipokuwa ukimsonga na kusikiliza
  rationale: Muundo wenye ἐν na kitenzi-jina chenye kibainishi una maana ya wakati; Kiswahili cha hali endelevu kinaonyesha kwamba matendo yote mawili yalikuwa yakiendelea.
- source_word: ὄχλον
  choice: umati
  rationale: “Umati” ni neno la kawaida, lenye heshima, na linalofaa kwa kundi kubwa la watu.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: ukimsonga
  rationale: Kitenzi kinaashiria kumsogelea mtu kwa msongamano au kumbana; “ukimsonga” ni cha asili na kinahifadhi wazo la shinikizo la kimwili.
- source_word: ἀκούειν
  choice: kusikiliza
  rationale: “Kusikiliza” huonyesha usikivu wa makusudi unaofaa katika muktadha wa umati kupokea ujumbe.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi usemi wa kibiblia na upana wake wa maana bila kuufupisha kuwa “ujumbe” pekee.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: yeye alikuwa amesimama
  rationale: Muundo unaonyesha hali inayoendelea ya kusimama. Kutaja “yeye” kunabeba kwa kiasi uwepo wa αὐτός huku sentensi ikibaki ya asili.
- source_word: παρὰ τὴν λίμνην
  choice: kando ya Ziwa
  rationale: “Kando ya” huonyesha mahali karibu na ukingo wa ziwa kwa usahihi na kwa Kiswahili cha kawaida.
- source_word: Γεννησαρέτ
  choice: Genesareti
  rationale: Jina limetoholewa kwa tahajia na matamshi ya Kiswahili badala ya kubadilishwa na jina jingine la ziwa.
theological_decisions:
- issue: Tafsiri ya τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: “Neno la Mungu” huhifadhi uzito wa usemi wa asili, mwangwi wake wa kibiblia, na uwezekano wake mpana wa kumaanisha ujumbe unaotangazwa kutoka kwa Mungu.
- issue: Utambulisho wa Γεννησαρέτ
  choice: Ziwa la Genesareti katika matini, huku maelezo yakitaja jina jingine
  alternative: Bahari ya Galilaya katika matini kuu
  rationale: Kigiriki kinatumia jina Genesareti. Kulibadilisha moja kwa moja kuwa Bahari ya Galilaya kungeweka maelezo ya utambulisho ndani ya matini badala ya kuhifadhi jina la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ikawa” hudumisha mtindo wa simulizi ya kibiblia bila kuwa nzito kupita kiasi; “ukimsonga” ni wazi kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
