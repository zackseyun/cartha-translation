base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: sw
  text: Ikawa kwamba umati ulipokuwa ukimsonga na kusikiliza neno la Mungu[a], yeye alikuwa amesimama kando ya Ziwa la Genesareti[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
