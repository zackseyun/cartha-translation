id: LUK.5.37
reference: Luke 5:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: sw
  text: Na hakuna mtu anayeweka divai mpya katika viriba vikuukuu[a]. La sivyo, divai hiyo mpya itavipasua viriba, nayo yenyewe itamwagika, na viriba vitaharibika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Viriba vilikuwa mifuko iliyotengenezwa kwa ngozi na kutumiwa kuhifadhia divai.
    reason: lexical_clarification
lexical_decisions:
- source_word: βάλλει
  choice: anaweka
  rationale: Kitenzi hiki kwa ujumla humaanisha kuweka kitu mahali. “Anaweka” ni cha kawaida na hakiongezi wazo mahususi la kumimina ambalo limedokezwa tu na muktadha.
- source_word: οἶνον νέον
  choice: divai mpya
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi picha ya divai ambayo bado ni mpya.
- source_word: ἀσκοὺς παλαιούς
  choice: viriba vikuukuu
  rationale: “Viriba” ni vyombo vya ngozi vilivyotumiwa kuhifadhia vimiminika, hasa divai. “Vikuukuu” hapa huonyesha kuwa viriba ni vya zamani na havifai kustahimili msukumo wa divai mpya.
- source_word: εἰ δὲ μήγε
  choice: La sivyo
  rationale: Nahau hii inatanguliza matokeo yatakayotokea ikiwa tendo lililotajwa litafanywa; “la sivyo” ni fupi na ya asili katika Kiswahili.
- source_word: ῥήξει
  choice: itavipasua
  rationale: Kitenzi kinaonyesha kusababisha mpasuko. Umbo lenye yambwa “-vi-” linaweka wazi kuwa divai ndiyo inayovipasua viriba.
- source_word: ἐκχυθήσεται
  choice: itamwagika
  rationale: Kauli ya kutendwa inaeleza divai kutoka na kupotea baada ya viriba kupasuka. “Itamwagika” ni ya asili katika muktadha huu.
- source_word: ἀπολοῦνται
  choice: vitaharibika
  rationale: Kwa vyombo, “vitaharibika” hueleza kupoteza matumizi yake bila kudokeza lazima kuangamizwa kabisa.
- source_word: καὶ αὐτός
  choice: nayo yenyewe
  rationale: Huhifadhi rejeo kwa divai mpya pamoja na msisitizo wa kiwakilishi αὐτός.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni namna ya kawaida na wazi ya kueleza kauli ya jumla yenye maana ya “hakuna hata mmoja.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Viriba vikuukuu” huhifadhi picha ya kihistoria, huku tanbihi ikifafanua aina ya chombo bila kuingiza maelezo hayo ndani ya sentensi.
