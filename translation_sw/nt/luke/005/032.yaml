  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: sw
  text: Sijaja kuwaita wenye haki, bali wenye dhambi wapate kutubu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki pia kinaweza kutafsiriwa, “kwa ajili ya toba.” Kirai εἰς μετάνοιαν kinaonyesha kusudi au lengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Sijaja
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuja ambako matokeo na kusudi lake yanaendelea sasa. “Sijaja” ni Kiswahili cha kawaida kinachohifadhi maana hiyo katika kauli ya utume.
- source_word: καλέσαι
  choice: kuwaita
  rationale: Kitenzi hiki kinaweza kumaanisha kuita, kualika, au kus召; “kuwaita” huhifadhi upana wake bila kukifanya mwaliko tu wala amri tu.
- source_word: δικαίους
  choice: wenye haki
  rationale: Kivumishi hiki kimetumiwa kama nomino kumaanisha watu wenye haki. Tafsiri hii huhifadhi kundi lililotajwa bila kuongeza kwamba ni wanaojiona au wanaohesabiwa kuwa wenye haki.
- source_word: ἁμαρτωλοὺς
  choice: wenye dhambi
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi kwa watu wanaotambulishwa kwa dhambi, huku ikidumisha ulinganifu na “wenye haki.”
- source_word: εἰς μετάνοιαν
  choice: watubu
  rationale: Kirai hiki huonyesha lengo au kusudi la mwito. “Watubu” ni Kiswahili cha asili na kinachoeleweka vizuri zaidi kuliko miundo mizito kama “kwenye toba,” ingawa kinabadilisha nomino ya Kigiriki kuwa kitenzi.
theological_decisions:
- issue: Je, maneno ya Yesu yafafanuliwe kuwa yanawahusu wanaojiona kuwa wenye haki au wale wanaohesabiwa hivyo?
  choice: Kuhifadhi makundi halisi “wenye haki” na “wenye dhambi” bila ufafanuzi wa ziada.
  alternative: “wanaojiona kuwa wenye haki” au “wanaohesabiwa kuwa wenye haki”
  rationale: Mstari wenyewe hautoi alama ya wazi ya kejeli wala ufafanuzi huo. Kuongeza maneno hayo kungeamua mvutano wa kiteolojia ambao Kigiriki kimeuacha wazi.
- issue: Namna ya kuonyesha εἰς μετάνοιαν
  choice: Kutumia “watubu” kama kusudi la mwito.
  alternative: “kwa ajili ya toba” au “kwenye toba”
  rationale: Tafsiri ya kitenzi inaonyesha kwa uwazi kusudi au lengo bila kuifanya toba kuwa mabadiliko ya mawazo pekee; tanbihi inaweka wazi muundo wa nomino katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sijaja” huhifadhi hali timilifu kwa njia ya kawaida; “wenye haki” na “wenye dhambi” ni wazi kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
