  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: sw
  text: Lakini Simoni Petro alipoona hayo[a], akaanguka magotini pa Yesu, akisema, “Niondokee, kwa sababu mimi ni mwanamume mwenye dhambi[b], Bwana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “hayo” halitajwi wazi katika Kigiriki; linaeleweka kutokana na muktadha kuwa ni tukio la kuvuliwa kwa samaki wengi.
    reason: implicit_object
  - marker: b
    text: Kigiriki kinasema hasa “mwanamume mwenye dhambi,” kikitumia neno la jinsia ya kiume linalomrejelea Simoni Petro mwenyewe.
    reason: lexical_gender_precision
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoona hayo
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati kinachoeleweka kwa Kiswahili. Neno “hayo” limeongezwa ili kurejelea tukio la kuvuliwa kwa samaki wengi linaloelezwa katika muktadha.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wa simulizi wenye tofauti ndogo kati ya muujiza na mwitikio wa Petro.
- source_word: Σίμων Πέτρος
  choice: Simoni Petro
  rationale: Majina yote mawili yaliyomo katika Kigiriki yamehifadhiwa.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: akaanguka magotini pa Yesu
  rationale: Usemi huu unahifadhi picha ya Petro kuanguka kwenye magoti ya Yesu, huku ukitumia muundo unaoeleweka katika Kiswahili.
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi kimetafsiriwa kama tendo linaloandamana na kuanguka kwake.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Niondokee
  rationale: Amri hii inaomba kwa dharura Yesu ajitenge na Petro; “Niondokee” ni ya kawaida, ya moja kwa moja, na yenye uzito katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya ombi la Petro.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: mwanamume mwenye dhambi
  rationale: “Mwanamume” huhifadhi jinsia ya nomino ἀνήρ, inayomrejelea Petro mwenyewe, na “mwenye dhambi” huwasilisha kivumishi ἁμαρτωλός kwa Kiswahili cha kawaida.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi heshima na uwezekano wa uzito wa kitheolojia katika mwitikio wa Petro bila kuamua kwa kupita kiasi kiwango cha ufahamu wake wakati huo.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριε Petro anapomwambia Yesu
  choice: Bwana
  alternative: bwana / mheshimiwa
  rationale: Katika mazingira ya muujiza, hofu, na kukiri dhambi, “Bwana” huhifadhi heshima pamoja na kina cha kitheolojia kinachowezekana. Tafsiri kama “mheshimiwa” ingepunguza uzito huo, ingawa neno la Kigiriki linaweza pia kutumiwa kama namna ya heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “akaanguka magotini pa Yesu” umechaguliwa ili kuhifadhi picha halisi ya maandishi bila kutumia usemi mzito usio wa kawaida.
