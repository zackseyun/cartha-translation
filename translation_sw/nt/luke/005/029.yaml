translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili kwa urahisi wa usomaji. “Akamwandalia” ni ya asili kuliko muundo mzito wa “akafanya karamu kwa ajili yake,” huku “pamoja nao” ikihifadhi wingi wa kiwakilishi cha chanzo.
