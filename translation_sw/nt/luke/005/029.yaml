base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: sw
  text: Kisha Lawi akamwandalia karamu kubwa nyumbani mwake. Kulikuwa na umati mkubwa wa watoza ushuru na watu wengine, wote wakiwa wameegemea mezani pamoja nao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa desturi ya wakati huo, watu walikula kwenye karamu wakiwa wameegemea kwenye vitanda au makochi karibu na meza. Kigiriki kinasema “pamoja nao”; rejeleo la kiwakilishi hicho cha wingi halijabainishwa wazi kabisa.
    reason: cultural_note_and_ambiguity
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: karamu kubwa
  rationale: Neno δοχή humaanisha karamu au dhifa iliyoandaliwa kwa wageni; “karamu kubwa” ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha ukubwa wa tukio.
- source_word: αὐτῷ
  choice: akamwandalia
  rationale: Kiambishi cha mtendewa “-mw-” kinarejelea Yesu kama Kigiriki kinavyotumia kiwakilishi, bila kuongeza jina lisilotajwa katika mstari.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: nyumbani mwake
  rationale: Hii ni tafsiri ya asili katika Kiswahili ya mahali pa karamu na inahifadhi kwamba nyumba ilikuwa ya Lawi.
- source_word: ὄχλος πολὺς
  choice: umati mkubwa
  rationale: “Umati mkubwa” huwakilisha moja kwa moja wingi wa watu unaoelezwa na ὄχλος πολύς.
- source_word: τελωνῶν
  choice: watoza ushuru
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika muktadha wa Injili kwa mawakala waliokusanya ushuru.
- source_word: ἄλλων
  choice: watu wengine
  rationale: Kigiriki hakibainishi utambulisho wao; tafsiri hii inaacha kundi hilo bila maelezo ya ziada.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: Inahifadhi kiwakilishi cha wingi cha Kigiriki na kutokubainika kikamilifu kwa wale wanaorejelewa.
- source_word: κατακείμενοι
  choice: walikuwa wameketi kula
  rationale: Ingawa neno hilo kihalisi huonyesha kulala kwa kuegemea wakati wa chakula, Kiswahili cha kawaida hueleza tendo hilo kwa “kuketi kula”; ufafanuzi wa desturi unawekwa katika tanbihi.
