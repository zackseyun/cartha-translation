id: LUK.5.39
reference: Luke 5:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: sw
  text: Na hakuna mtu[a] ambaye, baada ya kunywa divai ya zamani, hutaka mpya, kwa maana husema, “Ya zamani ni nzuri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “Ya zamani ni bora.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni usemi wa kawaida na usioegemea jinsia unaowakilisha kwa ujumla mtu yeyote.
- source_word: πιὼν
  choice: baada ya kunywa
  rationale: Kishiriki cha aoristi kinaonyesha tendo linalotangulia tendo kuu; Kiswahili hiki kinaweka wazi uhusiano huo wa wakati.
- source_word: παλαιὸν
  choice: divai ya zamani
  rationale: Ingawa nomino 'divai' haijarudiwa katika Kigiriki, inajulikana kutokana na muktadha na inahitaji kutajwa hapa ili sentensi iwe ya asili na wazi katika Kiswahili.
- source_word: θέλει
  choice: hutaka
  rationale: Kitenzi kinaonyesha hamu au upendeleo; hali ya mazoea katika 'hutaka' inafaa kauli hii ya jumla.
- source_word: νέον
  choice: mpya
  rationale: Kivumishi kinasimama badala ya 'divai mpya.' Kuacha nomino ikiwa imeeleweka kunahifadhi ufupi wa Kigiriki na ni wazi katika muktadha.
- source_word: λέγει γάρ
  choice: kwa maana husema
  rationale: Neno γάρ linatoa sababu ya kauli iliyotangulia, huku 'husema' likidumisha utangulizi wa usemi wa moja kwa moja.
- source_word: Ὁ παλαιὸς
  choice: Ya zamani
  rationale: Nomino 'divai' imeachwa ikiwa inaeleweka, kama ilivyo katika Kigiriki; upatanisho wa ngeli kwa 'divai' unaifanya maana iwe wazi.
- source_word: χρηστός
  choice: nzuri
  rationale: Hapa neno lina maana pana ya kuwa nzuri au yenye kupendeza. 'Nzuri' haliongezi ulinganisho ambao haupo katika matini iliyochapishwa.
theological_decisions:
- issue: Tafsiri ya χρηστός katika msemo kuhusu divai ya zamani na mpya
  choice: nzuri
  alternative: bora
  rationale: Matini ya SBLGNT ina χρηστός, ambalo kwa kawaida humaanisha 'nzuri' au 'yenye kupendeza,' si umbo la kulinganisha 'bora.' Usomaji unaojulikana wa 'bora' umehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu. Huu ni uamuzi wa kileksika na uhakiki wa matini, si utatuzi wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kimethali umehifadhiwa bila kufanya sentensi iwe ngumu; 'divai' imetajwa mara ya kwanza, kisha imeachwa ikiwa inaeleweka kama katika Kigiriki.
