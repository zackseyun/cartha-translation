base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: sw
  text: Nao wakamwambia, “Wanafunzi wa Yohana hufunga mara kwa mara na kusali; vivyo hivyo na wale wa Mafarisayo[a], lakini wale wako[b] hula na kunywa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wanafunzi wa Mafarisayo. Kigiriki kinasema kihalisi “wale wa Mafarisayo,” huku neno “wanafunzi” likieleweka kutokana na kishazi kilichotangulia.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanafunzi wako. Kigiriki kinasema “wale wako,” huku neno “wanafunzi” likieleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Nao wakamwambia
  rationale: δέ ni kiunganishi hafifu cha simulizi; “Nao” huendeleza mtiririko kwa Kiswahili cha kawaida bila kuongeza ukinzani mkali.
- source_word: μαθηταὶ Ἰωάννου
  choice: Wanafunzi wa Yohana
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida uhusiano unaoelezwa na hali ya umilikaji katika Kigiriki.
- source_word: νηστεύουσιν πυκνά
  choice: hufunga mara kwa mara
  rationale: Wakati uliopo pamoja na πυκνά unaonyesha desturi inayorudiwa; “hufunga mara kwa mara” ni wazi na ya asili.
- source_word: δεήσεις ποιοῦνται
  choice: kusali
  rationale: Ingawa Kigiriki hutumia kirai chenye nomino δεήσεις, “kusali” ndilo tamko la kawaida na lenye heshima katika Kiswahili; “kufanya maombi” si la asili hapa.
- source_word: ὁμοίως καὶ
  choice: vivyo hivyo na
  rationale: Huwasilisha ulinganisho na nyongeza kwa njia ya kawaida katika Kiswahili.
- source_word: οἱ τῶν Φαρισαίων
  choice: wale wa Mafarisayo
  rationale: Huhifadhi udondoshaji wa nomino “wanafunzi” uliopo katika Kigiriki huku maana ikieleweka kutokana na kishazi kilichotangulia.
- source_word: οἱ δὲ σοὶ
  choice: lakini wako
  rationale: Huhifadhi ufupi wa Kigiriki, ambako “wanafunzi” inaeleweka kutokana na muktadha, na pia huonyesha ukinzani.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: hula na kunywa
  rationale: Huonyesha tabia ya kawaida, si lazima tendo linaloendelea wakati huo.
theological_decisions:
- issue: Iwapo neno “wanafunzi” liongezwe katika vifungu vya Mafarisayo na Yesu
  choice: Kuhifadhi udondoshaji katika matini kuu kwa kusema “wale wa Mafarisayo” na “wako”
  alternative: Kusema wazi “wanafunzi wa Mafarisayo” na “wanafunzi wako”
  rationale: Kigiriki hakirudii nomino “wanafunzi.” Kiswahili kinaweza kuhifadhi ufupi huo bila kupoteza maana; tanbihi zinafafanua marejeo hayo bila kuamua jambo la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Hufunga” na “hula” zinaonyesha mazoea yanayojirudia, na udondoshaji wa Kigiriki umehifadhiwa pale ambapo Kiswahili bado ni wazi.
