translation:
  language: sw
  text: Lakini divai mpya lazima iwekwe katika viriba vipya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, neno la divai ni νέος (“mpya,” hasa kwa wakati), na neno la viriba ni καινός (“mpya,” hasa kwa hali au ubora). Hivyo “viriba vipya” yanaweza kumaanisha viriba visivyotumika au visivyochakaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya tendo lisilofaa katika mstari uliotangulia na tendo linalofaa hapa.
- source_word: οἶνον νέον
  choice: divai mpya
  rationale: νέον hueleza divai iliyo mpya kwa wakati, yaani divai iliyotengenezwa karibuni.
- source_word: εἰς
  choice: katika
  rationale: Katika Kiswahili, ‘kuweka katika’ huonyesha kwa kawaida kuingiza kitu ndani ya chombo.
- source_word: ἀσκοὺς
  choice: viriba
  rationale: ἀσκός hapa ni kiriba kilichotengenezwa kwa ngozi kwa ajili ya kuhifadhia divai; ‘viriba’ ni neno la Kiswahili linalofaa kwa chombo hicho.
- source_word: καινοὺς
  choice: vipya
  rationale: καινός hueleza hali mpya au ubora mpya wa viriba. ‘Vipya’ ni lugha ya kawaida na yenye kueleweka, ingawa tofauti yake na νέος haiwezi kuonyeshwa kikamilifu kwa neno moja la kawaida la Kiswahili.
- source_word: βλητέον
  choice: lazima iwekwe
  rationale: Kivumishi-tendo hiki huonyesha ulazima au jambo linalopasa kufanywa; ‘lazima iwekwe’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kutofautisha νέος na καινός katika sentensi moja
  choice: Kutafsiri yote kwa ‘mpya/vipya’ katika matini na kueleza tofauti ya Kigiriki katika tanbihi
  alternative: Kutafsiri καινούς kwa ‘vilivyo katika hali mpya’ au ‘visivyochakaa’
  rationale: 'Kigiriki kimetumia vivumishi viwili tofauti: νέος hasa kwa upya wa wakati na καινός hasa kwa upya wa hali au ubora. Kiswahili cha kawaida hutumia ‘mpya’ kwa maana zote mbili; maelezo ya tanbihi huhifadhi tofauti bila kufanya matini kuwa nzito au kufasiri zaidi ya chanzo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Viriba’ huhifadhi picha ya kihistoria ya vyombo vya ngozi, huku tanbihi ikihifadhi tofauti ya vivumishi vya Kigiriki.
