id: LUK.5.18
reference: Luke 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: sw
  text: Na tazama, wanaume walikuwa wakimbeba mtu aliyepooza kwenye kitanda[a], nao walikuwa wakijaribu kumwingiza ndani na kumweka mbele yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye machela” au “kwenye kochi”; neno la Kigiriki κλίνη linaweza kumaanisha kitanda, godoro la kubebea, au kochi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mbele ya Yesu.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha kazi ya ἰδού ya kuvuta fikira za msomaji na kuupa usimulizi uhai.
- source_word: ἄνδρες
  choice: wanaume
  rationale: ἀνήρ hapa humaanisha wanaume watu wazima, si watu kwa ujumla.
- source_word: φέροντες
  choice: walikuwa wakimbeba
  rationale: Muundo wa kuendelea unaakisi tendo linaloendelea la kitenzi-jina cha wakati uliopo katika tukio hilo.
- source_word: ἐπὶ κλίνης
  choice: kwenye kitanda
  rationale: κλίνη ni kitu cha kulalia kama kitanda, godoro la kubebea, au kochi; “kitanda” ni tafsiri ya moja kwa moja isiyobana maana kupita kiasi.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος humtaja mtu mmoja; jinsia yake inaeleweka katika muktadha bila kulazimika kurudia “mwanaume” baada ya “wanaume.”
- source_word: παραλελυμένος
  choice: aliyepooza
  rationale: Huwasilisha hali iliyotokana na kupooza, kama inavyoonyeshwa na kitenzi-jina timilifu cha kauli tendwa.
- source_word: ἐζήτουν
  choice: walikuwa wakijaribu
  rationale: Katika muktadha huu ζητέω hueleza jitihada iliyokuwa ikiendelea; Kiswahili hiki ni cha kawaida na kinahifadhi hali hiyo.
- source_word: εἰσενεγκεῖν
  choice: kumwingiza ndani
  rationale: Huwasilisha maana ya kuleta au kubeba mtu kuingia ndani bila kurudia namna ya kumbeba ambayo tayari imetajwa.
- source_word: θεῖναι
  choice: kumweka
  rationale: τίθημι hapa humaanisha kuweka mtu mahali fulani bila kubainisha zaidi mkao wake.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele yake
  rationale: Inafuata kiwakilishi cha Kigiriki badala ya kukibadili moja kwa moja kuwa jina “Yesu.”
theological_decisions:
- issue: Mrejelewa wa αὐτοῦ mwishoni mwa aya
  choice: mbele yake
  alternative: mbele ya Yesu
  rationale: Muktadha unaonyesha kwamba kiwakilishi kinamrejelea Yesu, lakini matini ya Kigiriki yenyewe hutumia kiwakilishi. Tafsiri inakihifadhi, na tanbihi inafafanua mrejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Na tazama” huhifadhi msisitizo wa kisimulizi bila kutumia lugha ya kale kupita kiasi; miundo ya “walikuwa waki-” huhifadhi mwendelezo wa vitendo.
