  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: sw
  text: Lakini habari kumhusu zilienea zaidi na zaidi[a], na makundi mengi ya watu yalikuwa yakikusanyika ili kumsikiliza na kuponywa magonjwa yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno kumhusu” au “taarifa kumhusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: zilienea
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha habari zilizokuwa zikiendelea kusambaa; “zilienea” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: μᾶλλον
  choice: zaidi na zaidi
  rationale: Kirai hiki kinahifadhi nguvu ya ulinganisho na wazo la kuongezeka kwa kuenea kwa habari.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: habari kumhusu
  rationale: Katika simulizi hili λόγος ni habari iliyosambaa kuhusu Yesu, si matumizi ya kiufundi ya “neno.” Tanbihi inadumisha uwezekano wa tafsiri ya karibu zaidi na umbo la Kigiriki.
- source_word: συνήρχοντο
  choice: ulikuwa ukikusanyika
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea au kurudiwa; umoja wa “umati” unahitaji kitenzi cha umoja katika Kiswahili.
- source_word: ὄχλοι πολλοὶ
  choice: umati mkubwa wa watu
  rationale: Hii ni lugha ya asili ya Kiswahili inayowasilisha wingi wa watu waliokusanyika bila kutumia kirai kisicho cha kawaida kama “makutano mengi.”
- source_word: ἀκούειν
  choice: ili kumsikiliza
  rationale: Kiswahili kwa kawaida hutaja yule anayesikilizwa; kiwakilishi kinamrejelea Yesu kwa uwazi unaotokana na muktadha, huku “ili” ikionyesha kusudi.
- source_word: θεραπεύεσθαι
  choice: kuponywa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na maana ya moja kwa moja ya kupokea uponyaji.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: magonjwa yao
  rationale: Muundo wa asili wa Kiswahili ni “kuponywa magonjwa,” ambao unawasilisha kuondolewa kwa maradhi bila kulazimisha kihusishi cha Kigiriki katika Kiswahili.
theological_decisions:
- issue: Asili ya uponyaji unaotajwa
  choice: Kutumia lugha ya moja kwa moja ya kuponywa magonjwa ya mwili.
  alternative: Kutumia lugha pana kama “kufanywa wazima,” ambayo ingeweza kudokeza urejesho wa kiroho.
  rationale: Muktadha wa karibu unazungumzia watu waliokuja kusikiliza na kuponywa maradhi; mstari huu hautaji wazi uponyaji wa kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Habari kumhusu” ni ya kawaida katika simulizi; “ulikuwa ukikusanyika” huhifadhi mwendelezo wa tendo.
