  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: sw
  text: Kwa maana mshangao ulimshika yeye na wote waliokuwa pamoja naye kwa sababu ya samaki waliowavua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “samaki waliowapata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: mshangao
  rationale: Neno hili linaonyesha hali ya kushangazwa sana. “Mshangao” ni la kawaida, lenye heshima, na linafaa kwa mwitikio wao kwa uvuvi huo wa ajabu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya mwitikio wa Simoni katika mstari uliotangulia. “Kwa maana” kinaweka wazi uhusiano huo wa maelezo.
- source_word: περιέσχεν
  choice: walishikwa na
  rationale: Kitenzi kina wazo la kuzunguka au kutwaa kabisa; pamoja na “mshangao,” Kiswahili cha asili hutumia “kushikwa na,” ambacho kinaonyesha hisia iliyowatawala.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: wote waliokuwa pamoja naye
  rationale: Tafsiri hii inadumisha maana ya jumla ya watu wote waliokuwapo pamoja na Simoni.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: kwa sababu ya wingi wa samaki
  rationale: ἐπί hapa inaonyesha sababu, na ἄγρα inahusu samaki waliopatikana katika uvuvi. “Wingi wa samaki” ni Kiswahili cha kawaida kinachoeleza kile kilichowashangaza bila kutumia kirai kisicho cha asili kama “kamato la samaki.”
- source_word: ὧν συνέλαβον
  choice: waliokuwa wamevua
  rationale: Kiwakilishi cha uhusiano kinawarejelea samaki, na kitenzi cha wingi kinaonyesha kuwa kundi lilishiriki katika kuwavua. “Walikuwa wamevua” ni usemi wa kawaida katika muktadha wa uvuvi.
