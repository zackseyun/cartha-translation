  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: sw
  text: Akawaambia, “Hamwezi kuwafanya wageni wa arusi[a] wafunge wakati bwana arusi yuko pamoja nao, sivyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa chumba cha arusi,” nahau inayowataja waandamani wa bwana arusi au wageni wa arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Hamwezi ... sivyo?
  rationale: Swali lenye μή na kitenzi katika hali ya taarifa linatarajia jibu la kukataa. Muundo huu wa Kiswahili unadumisha nguvu ya swali la balagha.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: wageni wa arusi
  rationale: Hii ni nahau inayomaanisha watu wanaoshiriki katika sherehe ya arusi, hasa waandamani wa bwana arusi. Tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: νυμφίος
  choice: bwana arusi
  rationale: Hili ndilo neno la kawaida la Kiswahili linalodumisha taswira ya arusi katika msemo huu.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: yuko pamoja nao
  rationale: Inawasilisha moja kwa moja kuwapo kwa bwana arusi katika ushirika wao.
- source_word: ποιῆσαι νηστεῦσαι
  choice: kuwafanya ... wafunge
  rationale: Muundo huu unahifadhi maana ya kusababisha au kulazimisha wengine kufunga, badala ya kuacha dhana hiyo ya kisababishi.
- source_word: νηστεῦσαι
  choice: wafunge
  rationale: ‘Kufunga’ ni neno la kawaida na fupi kwa kujinyima chakula kwa kusudi la kidini katika muktadha huu.
theological_decisions:
- issue: Utambulisho wa Yesu kwa njia ya sitiari ya bwana arusi
  choice: Kudumisha taswira ya ‘bwana arusi’ bila kufafanua maana yake ya kiteolojia katika matini kuu.
  alternative: Kupanua tafsiri ili kusema wazi kwamba Yesu anajitambulisha kuwa bwana arusi.
  rationale: Aya yenyewe inatoa sitiari na kudokeza nafasi ya pekee ya Yesu, lakini tafsiri haipaswi kuingiza ufafanuzi wa kiteolojia usiotamkwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Arusi’ imetumiwa kwa uthabiti, na swali la balagha limehifadhiwa.
