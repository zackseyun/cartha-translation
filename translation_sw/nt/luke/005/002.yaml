  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: sw
  text: Akaona mashua mbili zimesimama kando ya ziwa, lakini wavuvi walikuwa wameshuka kutoka mashuani na walikuwa wakiosha nyavu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: akaona
  rationale: Aoristi ya ὁράω katika simulizi inaelezwa kwa kawaida kwa “akaona,” bila kuongeza wazo la kugundua kwa ghafula.
- source_word: δύο πλοῖα
  choice: mashua mbili
  rationale: Katika mazingira ya uvuvi ziwani, “mashua” ni neno la kawaida na sahihi kuliko “meli.”
- source_word: ἑστῶτα
  choice: zimesimama
  rationale: Kauli hii inaonyesha mashua zikiwa mahali bila kusonga. “Zimesimama” huhifadhi taswira ya Kigiriki bila kuongeza wazo mahususi la kuwa zimefungwa nanga.
- source_word: παρὰ τὴν λίμνην
  choice: kando ya ziwa
  rationale: παρά pamoja na hali ya accusative hapa huonyesha mahali pembeni mwa ziwa; “kando ya ziwa” ni Kiswahili cha kawaida na sahihi.
- source_word: οἱ δὲ ἁλιεῖς
  choice: lakini wavuvi
  rationale: δέ inaleta tofauti ndogo kati ya mahali zilipokuwa mashua na tendo la wavuvi; “lakini” huiweka wazi bila kuifanya kuwa kali kupita kiasi.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: walikuwa wameshuka kutoka mashuani
  rationale: Kishirikishi cha aoristi huonyesha kwamba walishuka kabla ya kuosha nyavu. Kutaja “mashuani” huweka wazi rejeleo la αὐτῶν kwa Kiswahili cha kawaida.
- source_word: ἔπλυνον
  choice: walikuwa wakiosha
  rationale: Imperfect inaonyesha tendo lililokuwa likiendelea katika tukio hilo; “walikuwa wakiosha” huhifadhi hali hiyo.
- source_word: τὰ δίκτυα
  choice: nyavu
  rationale: “Nyavu” ni tafsiri ya moja kwa moja na ya kawaida ya δίκτυα. Kiswahili hakihitaji kiwakilishi cha umilikaji ambacho hakipo wazi katika Kigiriki.
