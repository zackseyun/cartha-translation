  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: sw
  text: Yesu akawajibu, “Wenye afya hawahitaji tabibu, bali wagonjwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: akawajibu
  rationale: Muundo huu wa kawaida wa simulizi unaunganisha tendo la kujibu na kusema; ‘akawajibu’ ni Kiswahili cha asili kinachohifadhi maana ya kuitikia na walengwa wa kauli bila kurudia ‘akajibu akawaambia.’
- source_word: οἱ ὑγιαίνοντες
  choice: wenye afya
  rationale: Kirai hiki kinamaanisha watu walio katika hali ya kuwa wazima; ‘wenye afya’ ni cha kawaida, wazi, na chenye hadhi katika Kiswahili sanifu.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: hawahitaji
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kuwa bila uhitaji, bila kulazimisha muundo wa nomino wa Kigiriki.
- source_word: ἰατροῦ
  choice: tabibu
  rationale: ‘Tabibu’ humaanisha daktari au mganga wa kutibu maradhi na inafaa kwa usemi huu wa kimethali; huepuka uwezekano wa ‘mganga’ kueleweka kama mganga wa jadi.
- source_word: οἱ κακῶς ἔχοντες
  choice: wagonjwa
  rationale: Hii ni nahau ya Kigiriki yenye maana ya watu walio wagonjwa; ‘wagonjwa’ hutoa maana yake ya kimuktadha kwa uwazi na kwa ufupi.
