  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: sw
  text: Lakini Yesu, alipotambua mawazo yao,[a] akawajibu, “Kwa nini mnatafakari mioyoni mwenu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipojua tafakari zao.”
    reason: Mbadala wa kileksia unaowakilisha ἐπιγνούς (“alipojua”) na διαλογισμούς (“tafakari”).
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: akitambua
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu alikuwa na ufahamu kamili wa mawazo yao. “Akitambua” ni Kiswahili cha kawaida na hakielezi kwa namna ya ziada jinsi alivyoyajua.
- source_word: δὲ
  choice: Lakini
  rationale: 'Neno hili linaonyesha mpito wenye utofauti mdogo: viongozi walikuwa wakifikiri kimoyomoyo, lakini Yesu alitambua mawazo yao na kuyajibu.'
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: mawazo yao
  rationale: Katika muktadha huu, kirai hiki kinarejelea tafakari au hoja zao za ndani. “Mawazo yao” ni wazi na ya kawaida kwa wasomaji wa sasa.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: akawajibu
  rationale: Muundo wa Kigiriki una maana halisi ya “akijibu, akawaambia,” lakini katika Kiswahili “akawajibu” huwasilisha kwa kawaida na kikamilifu tendo la kusema kwa kuitikia mawazo yao.
- source_word: Τί διαλογίζεσθε
  choice: Kwa nini mnawaza hivyo
  rationale: Τί katika muundo huu huuliza sababu ya kutafakari kwao. “Hivyo” hurejelea yaliyotangulia katika muktadha na kufanya swali liwe la kawaida katika Kiswahili bila kufafanua maudhui zaidi ya kifungu.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Kirai hiki kinahifadhi taswira ya kibiblia ya moyo kama kitovu cha mawazo, nia na maamuzi, badala ya kuibadili kuwa “akilini mwenu.”
theological_decisions:
- issue: Jinsi Yesu alivyoyajua mawazo ya ndani ya wengine
  choice: Kusema kwa urahisi kwamba Yesu alitambua mawazo yao
  alternative: Kufafanua kwamba aliyajua kwa njia ya kimuujiza, au kupunguza maana kwa kusema aliyakisia
  rationale: Aya inathibitisha kuwa Yesu alikuwa anajua walichokuwa wakifikiri, lakini haisemi jinsi alivyopata ujuzi huo. Tafsiri haiongezi wala kupunguza dai la kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya usimulizi wa Biblia. “Mioyoni mwenu” imehifadhiwa kwa sababu ni nahau ya kibiblia inayoeleweka; “mnawaza hivyo” ni ya kawaida zaidi kuliko “mnatoa hoja mioyoni mwenu.”
