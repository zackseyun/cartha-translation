  verdict: approve
  source_fidelity: “Naye akaacha kila kitu, akainuka, akamfuata” accurately conveys καὶ καταλιπὼν πάντα ἀναστὰς ἠκολούθει αὐτῷ. The Swahili narrative sequence naturally represents the two aorist participles and the following act of discipleship, while “kila kitu” preserves the comprehensive force of πάντα.
  naturalness: The wording is idiomatic, clear Standard East African Swahili. The aka- narrative sequence is especially natural in this context. “Naye” appropriately resumes Levi as the subject without adding causal force.
  terminology: “Akaacha,” “akainuka,” and “akamfuata” are accurate and suitably restrained. The rendering does not over-specify the permanence or material scope of what Levi left, nor does it force an inceptive or continuous sense for the imperfect beyond what the context securely supports.
