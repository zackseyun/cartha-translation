  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: sw
  text: Naye akaacha kila kitu[a], akainuka, akamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya kuacha kila kitu, akainuka akamfuata.”
    reason: Mbadala huu unaonyesha kwa uwazi zaidi kwamba tendo la kuacha lilitangulia kuinuka na kufuata, kama inavyoweza kuonyeshwa na vitenzi vishirikishi vya Kigiriki.
lexical_decisions:
- source_word: καταλιπὼν
  choice: akaacha
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia; katika mfululizo wa kawaida wa simulizi la Kiswahili, “akaacha” huwasilisha tendo hilo kwa uwazi bila kuongeza dhana ya kutupa au kutelekeza.
- source_word: πάντα
  choice: kila kitu
  rationale: Usemi huu wa kawaida wa Kiswahili unadumisha maana pana na jumuishi ya neno la Kigiriki bila kufafanua vitu vilivyoachwa.
- source_word: ἀναστὰς
  choice: akainuka
  rationale: Katika muktadha huu wa simulizi, neno linaonyesha kuinuka ili kutenda; “akainuka” ni la kawaida, lenye heshima, na sahihi.
- source_word: ἠκολούθει
  choice: akamfuata
  rationale: Wakati usiotimilika wa Kigiriki unaweza kuonyesha tendo linaloendelea, lakini hapa simulizi la mwitikio kwa wito linaelezwa kwa kawaida na “akamfuata”; muktadha wenyewe unadokeza kuingia katika ufuasi bila kulazimisha tafsiri ya “akaanza kumfuata.”
- source_word: αὐτῷ
  choice: -m- katika “akamfuata”
  rationale: Kiwakilishi cha yambwa kinamrejelea Yesu kutoka muktadha wa karibu; Kiswahili hukiwakilisha kwa kiambishi “-m-” bila kurudia jina.
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuelekeza tena kwa Lawi kwa namna ya asili katika Kiswahili, bila kuongeza uhusiano wa sababu.
theological_decisions:
- issue: Kiwango cha mambo ambayo Lawi aliacha ili kumfuata Yesu
  choice: “kila kitu” kinadumisha madai jumuishi ya mstari bila kueleza kama aliacha mali yake milele au kazi yake kwa muda tu
  alternative: Kufafanua kuwa aliacha mali zote kabisa na kwa kudumu, au kwamba aliacha kazi yake kwa muda tu
  rationale: πάντα ni pana kimakusudi. Tafsiri haipaswi kuamua zaidi ya mstari kuhusu umiliki wa mali, kazi, au kudumu kwa tendo hilo.
- issue: Hali ya tendo la kumfuata Yesu katika ἠκολούθει
  choice: “akamfuata”
  alternative: “akaanza kumfuata” au “aliendelea kumfuata”
  rationale: Wakati usiotimilika unaweza kubeba maana ya mwanzo au mwendelezo, lakini muktadha hautulazimishi kuchagua mojawapo waziwazi. “Akamfuata” huhifadhi uwazi huo kwa Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na rahisi kueleweka. Mfuatano wa vitenzi vya “aka-” unafaa simulizi na unadumisha mwitikio wa haraka bila kuingiza maelezo yasiyokuwapo katika chanzo.
