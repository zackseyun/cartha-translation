base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: sw
  text: Kisha akaingia katika moja ya mashua, iliyokuwa ya Simoni, akamwomba aisogeze kidogo kutoka nchi kavu.[a] Kisha akaketi, akawa akiwafundisha makutano ya watu kutoka katika mashua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka ufukoni.” Kigiriki kinasema kihalisi “kutoka nchi kavu,” kikitofautisha mashua na ardhi kavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: akaingia
  rationale: Kitenzi hiki huonyesha kwamba aliingia mashuani kabla ya kumwomba Simoni aisogeze; ‘akaingia’ ni ya kawaida na huhifadhi mfuatano wa matendo.
- source_word: πλοίων / πλοίου
  choice: mashua / mashuani
  rationale: Katika mazingira ya uvuvi ziwani, πλοῖον ni mashua, si meli kubwa. ‘Mashuani’ katika sehemu ya mwisho huonyesha mahali alipokuwa akifundishia.
- source_word: ὃ ἦν Σίμωνος
  choice: iliyokuwa ya Simoni
  rationale: Huhifadhi wazi maana ya umiliki iliyo katika hali ya umilikaji ya Σίμωνος.
- source_word: ἠρώτησεν
  choice: akamwomba
  rationale: Katika muktadha huu ἐρωτάω ni kutoa ombi, kwa hiyo ‘akamwomba’ ni ya asili zaidi kuliko ‘akamuuliza’.
- source_word: ἐπαναγαγεῖν
  choice: aisogeze mbali
  rationale: Katika muktadha wa mashua, kitenzi humaanisha kuiondoa au kuisogeza kutoka nchi kavu kuelekea majini; ‘aisogeze mbali’ ni wazi bila kuongeza wazo la kwenda mbali ziwani.
- source_word: ἀπὸ τῆς γῆς
  choice: na nchi kavu
  rationale: γῆ kwa msingi ni ‘nchi’ au ‘ardhi’; hapa inatofautisha nchi kavu na mashua iliyokuwa majini. Tanbihi inatoa ‘ufukoni’ kama tafsiri ya kimuktadha.
- source_word: ὀλίγον
  choice: kidogo
  rationale: Huonyesha umbali mdogo kwa lugha fupi na ya kawaida.
- source_word: καθίσας
  choice: akaketi
  rationale: Huhifadhi tendo lililotangulia tendo endelevu la kufundisha na linafaa kwa mtindo wa simulizi.
- source_word: ἐδίδασκεν
  choice: akawa akiwafundisha
  rationale: Muundo huu huhifadhi hali endelevu ya wakati usiotimilika wa Kigiriki.
- source_word: τοὺς ὄχλους
  choice: umati wa watu
  rationale: Ni Kiswahili cha sasa na cha asili kwa watu wengi waliokusanyika; huepuka neno la zamani zaidi ‘makutano,’ ingawa umbo la Kiswahili ni la mkusanyiko badala ya wingi wa kisarufi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa ‘aka-’ umetumiwa kwa simulizi, huku ‘akawa akiwafundisha’ ikihifadhi tendo lililoendelea. Alama ya tanbihi imewekwa baada ya ‘nchi kavu,’ ambako mbadala huo wa kileksika unahusika.
