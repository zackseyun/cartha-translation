  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: sw
  text: Alipomaliza kusema, akamwambia Simoni, “Peleka mashua kwenye maji ya kina[a], nanyi mshushe nyavu zenu ili mpate samaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kina.” Kigiriki kinasema kihalisi, “kwenye kina,” kikimaanisha hapa maji yenye kina kirefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Alipo-
  rationale: Muundo wa wakati katika ‘Alipomaliza’ unaonyesha kwa kawaida kwamba tukio linalofuata lilitokea baada ya Yesu kumaliza kusema, bila kulifanya δέ kuwa na uzito usio wa lazima.
- source_word: ἐπαύσατο λαλῶν
  choice: alimaliza kusema
  rationale: Kitenzi pamoja na kishirikishi kinaonyesha kukoma kwa tendo lililokuwa likiendelea; ‘alimaliza kusema’ ni Kiswahili cha kawaida na sahihi.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: akamwambia Simoni
  rationale: ‘Akamwambia’ ni utangulizi wa moja kwa moja na wa kawaida wa maneno yanayofuata katika simulizi.
- source_word: Ἐπανάγαγε
  choice: Peleka mashua
  rationale: Katika muktadha huu amri inamhusu Simoni mmoja na tendo la kuiondoa mashua ufuoni kuelekea maji ya kina. Neno ‘mashua’ limewekwa wazi kutokana na muktadha ili Kiswahili kiwe cha kawaida.
- source_word: εἰς τὸ βάθος
  choice: mpaka kilindini
  rationale: βάθος hapa inamaanisha sehemu yenye maji ya kina. ‘Kilindini’ ni usemi wa kawaida wa Kiswahili unaodumisha picha ya kwenda kwenye kina.
- source_word: χαλάσατε
  choice: mshushe
  rationale: Amri hii ni ya wingi, tofauti na amri iliyotangulia ya umoja; ‘mshushe’ inadumisha mabadiliko hayo na inaeleza kushusha nyavu majini.
- source_word: τὰ δίκτυα ὑμῶν
  choice: nyavu zenu
  rationale: Huhifadhi wingi wa nyavu na kiwakilishi cha wingi kinachowaelekea Simoni pamoja na wenzake.
- source_word: εἰς ἄγραν
  choice: ili mpate samaki
  rationale: Kirai hiki kinaonyesha kusudi la kushusha nyavu, yaani kupata samaki. Tafsiri hii ni ya kawaida kwa wasomaji wa Kiswahili, ingawa nomino ya Kigiriki ἄγρα yenyewe humaanisha ‘windwa’ au ‘samaki waliovuliwa.’
