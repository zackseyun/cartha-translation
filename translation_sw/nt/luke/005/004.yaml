translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. Tafsiri inadumisha tofauti muhimu kati ya amri ya umoja ‘Peleka’ kwa Simoni na amri ya wingi ‘mshushe ... zenu’ kwa kundi.
