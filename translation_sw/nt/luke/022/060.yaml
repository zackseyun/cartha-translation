  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: sw
  text: Lakini Petro akasema, “Wewe, sijui unachosema.” Mara hiyo, alipokuwa bado anasema, jogoo akawika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti kati ya shtaka lililotangulia na kukana kwa Petro, huku ikiendeleza simulizi kwa njia ya kawaida.
- source_word: Ἄνθρωπε
  choice: Wewe
  rationale: Katika Kiswahili cha sasa, mwito wa moja kwa moja “Wewe” unahifadhi ukali wa kumjibu mtu bila kutumia “Mtu,” ambayo hapa ingesikika isiyo ya kawaida, au “Bwana,” ambayo ingeongeza heshima isiyo wazi katika Kigiriki.
- source_word: οὐκ οἶδα
  choice: sijui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi chenye maana ya wakati wa sasa katika muktadha huu.
- source_word: ὃ λέγεις
  choice: unachosema
  rationale: Inahifadhi maana ya moja kwa moja ya maneno ya Petro bila kuyafafanua kama “unachomaanisha” au “unachozungumzia.”
- source_word: παραχρῆμα
  choice: Mara hiyo
  rationale: Huonyesha kuwa jambo lilitokea bila kuchelewa na ni usemi wa kawaida katika simulizi la Kiswahili.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: alipokuwa bado anasema
  rationale: 'Inahifadhi mwingiliano wa wakati: jogoo aliwika kabla Petro hajamaliza kusema.'
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: jogoo akawika
  rationale: “Jogoo” ni neno la kawaida kwa ἀλέκτωρ, na “kuwika” ndilo tendo lake linaloelezwa kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya simulizi. Hakuna tanbihi iliyohitajika: tofauti ya Kiingereza kati ya “rooster” na “cock” haina mbadala wa maana unaohitaji kufafanuliwa katika Kiswahili.'
