  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; mfuatano wa vitenzi katika Kiswahili unaonyesha uhusiano huo kwa kawaida.
- source_word: ἔξω
  choice: nje
  rationale: Huhifadhi maana ya mahali au mwelekeo wa kutoka.
- source_word: ἔκλαυσεν
  choice: akalia
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya κλαίω katika muktadha wa huzuni kuu.
- source_word: πικρῶς
  choice: kwa uchungu
  rationale: Usemi huu wa kawaida wa Kiswahili unaeleza namna kali na yenye maumivu ya kulia.
