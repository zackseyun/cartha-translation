  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: sw
  text: Akatoka, akaenda kwenye Mlima wa Mizeituni kama ilivyokuwa desturi yake, na wanafunzi pia wakamfuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: akatoka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kwenda; mfuatano wa vitenzi vya Kiswahili kwa kiambishi -ka- unatoa simulizi la kawaida na wazi.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: Tafsiri rahisi na ya kawaida ya kitenzi cha mwendo πορεύομαι katika simulizi.
- source_word: κατὰ τὸ ἔθος
  choice: kama ilivyokuwa desturi yake
  rationale: Huwasilisha tendo la kawaida kwa Kiswahili cha asili; ingawa 'yake' haijatajwa kwa neno mahususi katika Kigiriki, muktadha na umbo la kishazi vinaelekeza desturi hiyo kwa Yesu.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: kwenye Mlima wa Mizeituni
  rationale: Jina la mahali linalotambulika; 'kwenye' huonyesha mahali alikokwenda kwa lugha ya kawaida.
- source_word: ἠκολούθησαν
  choice: wakamfuata
  rationale: Huhifadhi maana ya kawaida ya ἀκολουθέω, yaani kufuata, pamoja na mtiririko wa simulizi.
- source_word: οἱ μαθηταί
  choice: wanafunzi
  rationale: Neno la kawaida la Kibiblia na la Kiswahili kwa μαθηταί; hakuna haja ya kuongeza 'wake' kwa kuwa haipo wazi katika Kigiriki.
- source_word: καὶ ... δὲ ... καὶ
  choice: Kisha ... na ... pia
  rationale: Huonyesha mwendelezo wa simulizi na nguvu ya nyongeza ya καί ya mwisho bila kufanya δέ kuwa kiunganishi cha upinzani.
theological_decisions:
- issue: Ikiwa Yesu atajwe wazi kuwa mwenye desturi hiyo
  choice: kama ilivyokuwa desturi yake
  alternative: kulingana na desturi
  rationale: Kiswahili cha kawaida huhitaji uhusiano huu uelezwe kwa uwazi zaidi; muktadha unamtambulisha Yesu bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa -ka- umetumiwa kuendeleza simulizi kwa ulaini; msamiati unabaki rahisi kwa msomaji wa kawaida.
