  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: sw
  text: Kisha malaika kutoka mbinguni akamtokea[a] na kumtia nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya miswada hazina aya za 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: akamtokea
  rationale: Katika kauli za kuonekana, umbo hili la ὁράω humaanisha ‘alitokea/akamtokea.’ ‘Akamtokea’ ni la asili katika Kiswahili na linaonyesha kuwa malaika alionekana kwa Yesu.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ linaendeleza simulizi; ‘Kisha’ linaonyesha mwendelezo wa tukio bila kulifanya kuwa tofauti kali.
- source_word: αὐτῷ
  choice: -m- katika ‘akamtokea’
  rationale: Yambwa ya Kiswahili ndani ya kitenzi inaonyesha kwamba malaika alimtokea yeye, yaani Yesu.
- source_word: ἄγγελος
  choice: malaika
  rationale: Kwa kuwa mjumbe huyu anatoka mbinguni, maana inayofaa hapa ni ‘malaika,’ si ‘mjumbe’ kwa ujumla.
- source_word: ἀπ’ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Kirai hiki kinaonyesha asili ya malaika na ni Kiswahili cha kawaida chenye kuhifadhi maana ya chanzo cha mbinguni.
- source_word: ἐνισχύων
  choice: na kumtia nguvu
  rationale: Kirai hiki kinaonyesha tendo linaloandamana na kutokea kwa malaika. ‘Kumtia nguvu’ ni cha kawaida na huhifadhi wazo la kumpa nguvu kuliko tafsiri ya kiufafanuzi kama ‘kumfariji.’
- source_word: αὐτόν
  choice: -m- katika ‘kumtia’
  rationale: Yambwa huyu anamrejelea Yesu moja kwa moja.
theological_decisions:
- issue: Hali ya maandishi ya Luka 22:43
  choice: Aya imejumuishwa katika maandishi makuu kwa kufuata maandishi ya Kigiriki yaliyotolewa.
  alternative: Baadhi ya miswada haina aya ya 43–44.
  rationale: SBLGNT iliyotolewa ina aya hii, kwa hiyo imetafsiriwa; tofauti muhimu ya miswada imeonyeshwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamtokea’ na ‘kumtia nguvu’ ni miundo ya kawaida inayoeleweka kwa urahisi huku ikifuatilia kwa karibu maana na mtiririko wa Kigiriki.
