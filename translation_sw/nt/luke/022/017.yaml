  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: sw
  text: Naye baada ya kupokea kikombe[a] na kushukuru, alisema, “Chukueni hiki na mkigawanye[b] miongoni mwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitumii kibainishi kabla ya neno “kikombe”; hata hivyo, muktadha wa mlo unaweza kudokeza kikombe maalumu.
    reason: lexical_alternative
  - marker: b
    text: Au “mkisambaze miongoni mwenu.” Kitenzi hiki kinaweza kumaanisha kugawa au kusambaza kitu katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: baada ya kupokea
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kusema; usemi huu unaweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: ποτήριον
  choice: kikombe
  rationale: Nomino ya Kigiriki haina kibainishi. Kiswahili hakitofautishi moja kwa moja kati ya ‘a cup’ na ‘the cup,’ hivyo ‘kikombe’ linaacha muktadha uamue umaalumu wake.
- source_word: εὐχαριστήσας
  choice: na kushukuru
  rationale: Hutoa maana ya kutoa shukrani kabla ya kusema kwa lugha ya kawaida, bila kuingiza istilahi maalumu ya kiliturujia.
- source_word: εἶπεν
  choice: alisema
  rationale: Hufuata Kigiriki, ambacho hakitaji wazi ‘aliwaambia.’
- source_word: Λάβετε
  choice: Chukueni
  rationale: Amri ya wingi inayofaa kwa tendo la kushika au kupokea kitu mezani.
- source_word: τοῦτο
  choice: hiki
  rationale: Kiwakilishi kionyeshi kinarejelea kikombe kilichotajwa bila kurudia nomino.
- source_word: διαμερίσατε
  choice: mkigawanye
  rationale: Kitenzi kinaweza kumaanisha kugawa kitu katika sehemu au kukisambaza; ‘mkigawanye’ huhifadhi maana hiyo huku kirai kinachofuata kikionyesha kuwa ni kugawana ndani ya kundi.
- source_word: εἰς ἑαυτούς
  choice: miongoni mwenu
  rationale: Ni usemi wa asili unaoonyesha kuwa kikombe kigawanywe ndani ya kundi la wanaoambiwa, bila kudokeza umilikaji wa kibinafsi.
theological_decisions:
- issue: Iwapo tafsiri itumie lugha maalumu ya Ekaristi kwa εὐχαριστήσας na ποτήριον
  choice: 'Kutumia lugha ya kawaida ya simulizi: ‘kikombe’ na ‘kushukuru’'
  alternative: Kutumia istilahi zenye maana mahsusi ya kiliturujia au kutaja ‘kile kikombe’ kwa mkazo
  rationale: Andiko linasimulia tendo la Yesu mezani bila kutumia istilahi ya kiufundi ya kanisa. Lugha ya kawaida huhifadhi tukio na haiongezi dai la kimafundisho lisilotamkwa wazi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘Naye baada ya … alisema’ ni wa simulizi na unaeleweka kwa urahisi; ‘miongoni mwenu’ huhifadhi maana ya tendo la pamoja.
