  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: sw
  text: Baada ya kumkamata, walimpeleka, wakamwingiza katika nyumba ya kuhani mkuu; lakini Petro alikuwa akimfuata kwa mbali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa mbali.”
    reason: Toleo hili linaonyesha njia nyingine ya asili ya kutafsiri μακρόθεν bila kubadili maana ya msingi.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Baada ya kumkamata
  rationale: Kirai hiki cha kitenzi katika wakati timilifu wa Kigiriki kinaonyesha tendo lililotangulia matendo makuu; ‘baada ya kumkamata’ ni Kiswahili cha kawaida na kinafaa muktadha wa kutiwa chini ya ulinzi.
- source_word: ἤγαγον
  choice: walimpeleka
  rationale: Kitenzi ἄγω kina maana ya kuongoza au kupeleka. ‘Walimpeleka’ kinaonyesha kwamba Yesu alikuwa chini ya ulinzi bila kuongeza namna ambayo haikutajwa.
- source_word: εἰσήγαγον
  choice: kumwingiza ndani ya
  rationale: Kitenzi εἰσάγω kinaonyesha mwendo wa kuingia mahali; ‘kumwingiza ndani ya’ kinahifadhi wazi mwelekeo huo na kutofautisha tendo hili na kumpeleka.
- source_word: οἰκίαν
  choice: nyumba
  rationale: Katika muktadha huu οἰκία inataja jengo au makao, hivyo ‘nyumba’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀρχιερέως
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha ἀρχιερεύς katika Agano Jipya.
- source_word: ἠκολούθει
  choice: alikuwa akifuata
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita, kulingana na hali ya kitenzi cha Kigiriki.
- source_word: μακρόθεν
  choice: kwa mbali
  rationale: Kielezi hiki kinaonyesha umbali wa mahali. ‘Kwa mbali’ ni usemi wa kawaida unaohifadhi maana bila kudokeza sababu ya Petro kufanya hivyo.
- source_word: δὲ
  choice: lakini
  rationale: δὲ ya pili inaonyesha utofauti wa kiasi kati ya Yesu kupelekwa ndani na Petro kuendelea kumfuata akiwa mbali.
theological_decisions:
- issue: Maelezo ya uhusiano wa Petro na Yesu wakati wa kukamatwa
  choice: Petro alikuwa akifuata kwa mbali
  alternative: Petro alimfuata kwa mbali; Petro aliendelea kufuata kwa mbali
  rationale: Tafsiri inadumisha tendo linaloendelea na umbali wa mahali, lakini haiongezi hukumu kuhusu nia ya Petro, kama vile kwamba alifuata kwa siri au kwa woga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mfululizo wa simulizi kwa uwazi; ‘kuhani mkuu’ ni istilahi iliyozoeleka, na hakuna maelezo ya kisaikolojia yaliyoongezwa kuhusu Petro.
