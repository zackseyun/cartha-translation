  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: sw
  text: Kisha, baada ya kumfunika[a], waliendelea kumwuliza wakisema, “Tabiri! Ni nani aliyekupiga?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kumfunga macho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: baada ya kumfunika
  rationale: Kitenzi hiki humaanisha kufunika au kutia utaji. Tafsiri hii inabaki pana kama Kigiriki bila kubainisha moja kwa moja kwamba walimfunga macho, ingawa muktadha unaonyesha walizuia uwezo wake wa kuona.
- source_word: ἐπηρώτων
  choice: waliendelea kumwuliza
  rationale: Wakati usiotimilifu katika Kigiriki unaonyesha tendo lililoendelea au kurudiwa; “waliendelea kumwuliza” huhifadhi maana hiyo.
- source_word: λέγοντες
  choice: wakisema
  rationale: Umbo la kitenzi tegemezi linaanzisha maneno ya dhihaka yao; “wakisema” ni la kawaida na linafuata muundo wa chanzo.
- source_word: Προφήτευσον
  choice: Tabiri!
  rationale: Amri hii ni ya dhihaka na inamtaka Yesu atoe jibu kwa uwezo wa kinabii. “Tabiri!” ni amri ya moja kwa moja na haiongezi maneno yasiyokuwamo katika chanzo.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Ni nani aliyekupiga?
  rationale: Kirai chenye kihusishi cha Kigiriki humaanisha mtu aliyempiga. Kiswahili cha kawaida “Ni nani aliyekupiga?” huwasilisha maana kamili kwa uwazi bila muundo mzito usio wa lazima.
theological_decisions:
- issue: Iwapo itajwe wazi kwamba Yesu alifungwa macho
  choice: Kutumia kauli pana “baada ya kumfunika” katika matini kuu
  alternative: “baada ya kumfunga macho”
  rationale: Muktadha unaonyesha kwamba uwezo wake wa kuona ulizuiwa, lakini kitenzi cha Kigiriki chenyewe humaanisha kufunika au kutia utaji. Matini kuu haiongezi ubainisho usio lazima, na tafsiri ya kimuktadha imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Waliendelea kumwuliza” huonyesha tendo la kurudiwa, huku “Tabiri!” ikihifadhi amri ya dhihaka. Alama ya tanbihi [a] imewekwa mara baada ya kirai kinachohusika.
