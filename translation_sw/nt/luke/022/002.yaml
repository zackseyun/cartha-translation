id: LUK.22.2
reference: Luke 22:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: sw
  text: Nao makuhani wakuu na waandishi wa sheria walikuwa wakitafuta jinsi ya kumwua[a], kwa maana waliwaogopa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi wangeweza kumwua.”
    reason: Njia nyingine ya kuwasilisha muundo wa Kigiriki unaohusu namna au uwezekano wa kutekeleza kusudi lao.
lexical_decisions:
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Muundo huu unaonyesha tendo lililoendelea wakati uliopita, kulingana na hali ya kitenzi cha Kigiriki.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni neno la kawaida la Kiswahili kwa viongozi wakuu wa ukuhani wa Yerusalemu, bila kudokeza kwamba wote walikuwa na cheo kimoja cha kuhani mkuu.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Neno hili linahifadhi maana ya waandishi huku likifafanua kwa kawaida kwamba kazi yao ilihusiana na Sheria; 'walimu wa sheria' lingesisitiza zaidi jukumu la kufundisha kuliko neno la Kigiriki lenyewe.
- source_word: τὸ πῶς
  choice: jinsi ya
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha wazo la kutafuta namna au njia ya kutenda jambo.
- source_word: ἀνέλωσιν
  choice: kumwua
  rationale: Katika muktadha huu kitenzi kinamaanisha kuondoa kwa kusababisha kifo. 'Kumwua' ni wazi na hakiongezi dhana ya utaratibu rasmi wa hukumu.
- source_word: ἐφοβοῦντο
  choice: waliwaogopa
  rationale: Kitenzi hiki kinaonyesha hali ya hofu iliyokuwa ikiendelea; kiambishi cha yambwa kinaelekeza hofu hiyo kwa watu.
- source_word: τὸν λαόν
  choice: watu
  rationale: Hii inarejelea watu kwa ujumla kama kundi, si lazima umati uliokusanyika mahali pamoja.
theological_decisions:
- issue: Nguvu ya ἀνέλωσιν kuhusu kusudi la viongozi
  choice: kumwua
  alternative: kumwondoa; kumtia kifo
  rationale: Tafsiri hii haipunguzi uhasama wao, lakini pia haiongezi maelezo kuhusu njia ya kisheria au rasmi ambayo haijatajwa katika aya.
- issue: Rejeo la λαός
  choice: watu
  alternative: umati
  rationale: '''Watu'' huhifadhi upana wa rejeo la Kigiriki na mvutano wa simulizi kwamba viongozi waliogopa mwitikio wa umma, badala ya kulifunga kwa kundi lililokusanyika wakati huo tu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Nao' linaendeleza kiunganishi καί cha simulizi. Muundo 'walikuwa wakitafuta' na 'waliwaogopa' unahifadhi hali ya matendo na hali zilizokuwa zikiendelea.
