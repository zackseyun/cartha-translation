  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: sw
  text: Kwa maana ninawaambia kwamba hakika sitaila mpaka itakapotimizwa katika ufalme wa Mungu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitaila tena kamwe mpaka itakapotimizwa katika ufalme wa Mungu.” Kigiriki kinakataa kwa mkazo kula huko kwa wakati ujao. Tafsiri nyingine huweka wazi neno “tena,” linalodokezwa na muktadha, lakini halijaandikwa katika matini ya Kigiriki.
    reason: lexical_alternative
  - marker: b
    text: Kiambishi “-i-” katika “sitaila” kinarejelea Pasaka iliyotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: Kauli hii ya kawaida ya kusema imetafsiriwa kwa Kiswahili cha asili; γάρ imehifadhiwa kwa “Kwa maana” ili kuonyesha uhusiano wa maelezo na mstari uliotangulia.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha yaliyomo katika kauli ya Yesu, na “kwamba” huhifadhi muundo huo wazi kwa Kiswahili cha kawaida.
- source_word: οὐ μὴ φάγω
  choice: hakika sitaila
  rationale: Muundo οὐ μή pamoja na aoristi tegemezi unakanusha kwa mkazo tendo la baadaye. “Hakika sitaila” huwasilisha mkazo huo bila kutumia lugha nzito au ya kizamani.
- source_word: αὐτό
  choice: -ila (it)
  rationale: Kiwakilishi hiki kinarejelea Pasaka iliyotajwa katika mstari uliotangulia. Katika Kiswahili, kiambishi cha yambwa “-i-” ndani ya “sitaila” ni cha asili kuliko kiwakilishi huru, huku maelezo ya chini yakibainisha rejeo lake.
- source_word: ἕως ὅτου
  choice: mpaka
  rationale: Usemi huu unaonyesha kikomo cha wakati; “mpaka” ni tafsiri ya kawaida na sahihi katika muktadha huu.
- source_word: πληρωθῇ
  choice: itakapotimizwa
  rationale: Kitenzi cha kutendwa kinahifadhi maana ya kufikia utimilifu bila kubainisha ni nani anayetekeleza jambo hilo au jinsi utimilifu huo utakavyotokea.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: “Ufalme wa Mungu” ni usemi wa kawaida wa kibiblia unaohifadhi wigo wa maana wa βασιλεία kama utawala na eneo la utawala.
theological_decisions:
- issue: Rejeo la αὐτό
  choice: Kiambishi cha yambwa katika “sitaila” kinarejelea Pasaka iliyotajwa katika mstari uliotangulia.
  alternative: Kuelewa rejeo hilo kwa upana zaidi kuwa maadhimisho au tukio la Pasaka.
  rationale: Muktadha wa karibu unaonyesha “Pasaka hii” ambayo Yesu alitamani kula pamoja na wanafunzi. Tafsiri haiongezi “chakula cha Pasaka” katika matini kuu, hivyo inadumisha ufupi na kiwango cha ubainifu cha Kigiriki.
- issue: Maana ya “kutimizwa katika ufalme wa Mungu”
  choice: Kuhifadhi lugha ya utimilifu wa wakati ujao bila kueleza hasa jinsi Pasaka itakavyotimizwa.
  alternative: Kufafanua kuwa inatimizwa kwa kuja kwa ufalme wa Mungu au katika karamu ya Masihi.
  rationale: Kigiriki kinaelekeza kwenye utimilifu wa kieskatolojia lakini hakibainishi utaratibu au tukio hususa; hivyo tafsiri inadumisha mvutano na uwezekano wa maana uliomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hakika” huonyesha ukanushaji wenye mkazo; “itakapotimizwa” huhifadhi kauli ya kutendwa na kutofafanuliwa kwa namna ya utimilifu. Alama zote za maelezo ya chini zimewekwa katika matini kuu.
