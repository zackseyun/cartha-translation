  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: sw
  text: Kisha ikafika siku ya Mikate Isiyotiwa Chachu, ambayo ilipasa Pasaka ichinjwe kama dhabihu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana-kondoo wa Pasaka” au “dhabihu ya Pasaka.” Neno la Kigiriki linaweza kumaanisha maadhimisho ya Pasaka au, katika muktadha huu, hasa mnyama aliyetolewa kuwa dhabihu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: ikafika
  rationale: Kitenzi kinatumika kiidioma kueleza kufika kwa siku au wakati; “ikafika” ni ya kawaida na huhifadhi maana hiyo ya wakati.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi kwa mpangilio; “Kisha” huonyesha hatua inayofuata bila kuongeza mkazo usiokuwapo.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: siku ya Mikate Isiyotiwa Chachu
  rationale: Huhifadhi umoja wa ἡμέρα na kuitaja sikukuu ya Kiyahudi kwa namna wazi na inayotambulika.
- source_word: ᾗ
  choice: ambayo
  rationale: Kiwakilishi hiki kinarejelea “siku” na katika Kiswahili kinabeba maana ya wakati, yaani siku ambayo jambo hilo lilipaswa kutendeka.
- source_word: ἔδει
  choice: ilipasa
  rationale: Huonyesha ulazima au wajibu uliowekwa na wakati wa sikukuu, kwa lugha yenye hadhi na ya kawaida.
- source_word: θύεσθαι
  choice: ichinjwe kuwa dhabihu
  rationale: Katika muktadha wa ibada, θύω inahusu kuchinja mnyama kwa kusudi la dhabihu; usemi huu unaonyesha kitendo cha kuchinja na maana yake ya kidini.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: Neno la Kigiriki linaweza kumaanisha sikukuu au, katika muktadha huu, mnyama wa dhabihu ya Pasaka. “Pasaka” huhifadhi upana wa neno, huku kitenzi kikionyesha maana ya dhabihu.
theological_decisions:
- issue: Kirejelewa cha τὸ πάσχα katika muktadha wa dhabihu
  choice: Pasaka
  alternative: mwana-kondoo wa Pasaka; dhabihu ya Pasaka
  rationale: Neno πάσχα lina maana pana kuliko “mwana-kondoo” na linaweza kutumiwa kwa sikukuu au kwa mnyama wake wa dhabihu. Tafsiri kuu huhifadhi upana huo, na tanbihi huweka wazi maana mahususi inayowezekana hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina la sikukuu limeandikwa kwa herufi kubwa. “Ichinjwe kuwa dhabihu” huepuka utata wa “itolewe” huku ikihifadhi wazi muktadha wa ibada.
