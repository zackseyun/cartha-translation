  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: sw
  text: Akawaambia, “Tazameni,[a] mtakapoingia mjini, mwanamume mmoja aliyebeba mtungi wa maji[b] atakutana nanyi. Mfuateni aingiapo ndani ya nyumba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo rasmi zaidi, “Tazama.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kutaja hasa chombo kilichotengenezwa kwa udongo; hivyo, “mtungi wa udongo wenye maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni neno la kawaida la kuvuta usikivu katika Kiswahili cha sasa; linahifadhi nguvu ya deiktiki ya Ἰδοὺ na kuafikiana na kundi linalozungumziwa.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: mtakapoingia mjini
  rationale: Muundo wa genitivi huru una maana ya wakati hapa. Tafsiri hii ni ya asili na inaonyesha kwamba tukio litatokea wanapoingia mjini.
- source_word: συναντήσει ὑμῖν
  choice: atakutana nanyi
  rationale: Kitenzi cha wakati ujao pamoja na yambwa ya dativi kinaeleza kwamba mwanamume huyo ndiye atakayekutana nao.
- source_word: ἄνθρωπος
  choice: mwanamume mmoja
  rationale: Katika muktadha huu nomino inamtaja mtu wa kiume asiyejulikana; “mmoja” huonyesha hali yake ya kutotambulishwa bila kudokeza msisitizo usio wa lazima.
- source_word: κεράμιον ὕδατος
  choice: mtungi wa maji
  rationale: Hii ni tafsiri wazi na ya kawaida ya chombo chenye maji. Uwezekano kwamba kilikuwa chombo cha udongo umehifadhiwa katika tanbihi badala ya kufafanuliwa kupita kiasi katika matini kuu.
- source_word: βαστάζων
  choice: aliyebeba
  rationale: Kivumishi-kitenzi hiki kinaeleza tendo linaloendelea la mwanamume huyo kwa lugha ya kawaida ya kisimulizi.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Mfuateni
  rationale: Amri hii ya moja kwa moja huhifadhi maana na nguvu ya aoristi amrishi huku ikielekezwa kwa watu wengi wamfuate mtu mmoja.
- source_word: οἰκίαν
  choice: nyumba
  rationale: “Nyumba” ni neno thabiti na la kawaida linalofaa muktadha wa kuelekea ndani ya jengo.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: atakayoingia
  rationale: Kishazi hiki kinaitambulisha nyumba hususa ambayo mwanamume huyo ataingia; muundo huu ni mfupi na wa asili katika Kiswahili.
