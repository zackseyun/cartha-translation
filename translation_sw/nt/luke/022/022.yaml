review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the title “Mwana wa Adamu,” the determined course, the adversative contrast, the woe, and the lexical ambiguity of παραδίδοται. “Kama ilivyokusudiwa,” however, can primarily suggest manner (“as intended”) rather than conformity to a prior determination; “kulingana na yale yaliyokwishaamuliwa” more directly represents κατὰ τὸ ὡρισμένον while retaining the unspecified passive agent.
  naturalness: The proposed revision is natural, current Standard East African Swahili and retains a dignified biblical register. “Huenda” is suitably formal here, and explicit placement of “Mwana wa Adamu” in the final clause prevents any momentary uncertainty about who is being betrayed.
  terminology: “Mwana wa Adamu,” “ole wake,” and “anasalitiwa” are appropriate established terminology. The footnote appropriately retains “anakabidhiwa” as a viable lexical alternative without forcing an interpretation.
  issues:
  - severity: low
    issue: Potentially less precise rendering of κατὰ τὸ ὡρισμένον
    rationale: “Kama ilivyokusudiwa” is not wrong, but it can sound like ‘as intended’ rather than ‘in accordance with what has been determined.’
  - severity: low
    issue: Implicit subject in the final passive clause
    rationale: In “ambaye kupitia kwake anasalitiwa,” the context identifies the Son of Man as the one betrayed, but explicitly naming him gives clearer Swahili syntax and preserves the Greek referent.
  revised_text: Kwa maana Mwana wa Adamu huenda kulingana na yale yaliyokwishaamuliwa, lakini ole wake mtu yule ambaye Mwana wa Adamu anasalitiwa kupitia kwake.[a]
