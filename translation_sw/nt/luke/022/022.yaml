  rationale: The revision makes the prior determination expressed by κατὰ τὸ ὡρισμένον more explicit without naming the one who determined it, and clarifies that the Son of Man is the one denoted by the passive παραδίδοται. It continues to preserve the text’s juxtaposition of determined purpose and the betrayer’s culpability.
