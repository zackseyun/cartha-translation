  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu huenda kulingana na yale yaliyokwishaamuliwa, lakini ole wake mtu yule ambaye Mwana wa Adamu anasalitiwa kupitia kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anakabidhiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kusalitiwa” au “kukabidhiwa,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu linaanzisha sababu ya kauli iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika tafsiri za Biblia za Kiswahili na linahifadhi mwangwi wake wa kimaandiko.
- source_word: μέν … πλὴν
  choice: … lakini
  rationale: μέν huandaa utofautishaji unaokamilishwa na πλὴν. Kiswahili hakihitaji neno tofauti la μέν hapa; “lakini” linawasilisha utofautishaji huo kwa kawaida bila kuulemea mstari.
- source_word: κατὰ τὸ ὡρισμένον
  choice: kama ilivyokusudiwa
  rationale: Linaonyesha kwamba mwendo huo unalingana na jambo lililokuwa limeamuliwa. Kauli hii inahifadhi hali ya kutendwa bila kumtaja wazi mwamuzi ambaye Kigiriki hakimtaji.
- source_word: πορεύεται
  choice: anaenda
  rationale: Kitenzi rahisi cha wakati wa sasa kinafuata Kigiriki na katika muktadha kinaelekeza kwenye mwendo wa Yesu kuelekea kifo chake.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ole wake mtu yule
  rationale: “Ole wake” ni tamko la asili la Kiswahili la maombolezo au hukumu, na “mtu yule” humrejelea mtu maalumu wa kiume katika simulizi.
- source_word: δι’ οὗ
  choice: ambaye kupitia kwake
  rationale: Linaweka maana ya uwakala au njia iliyo katika διά pamoja na hali ya uhusiano wa sentensi ya Kigiriki.
- source_word: παραδίδοται
  choice: anasalitiwa
  rationale: Katika muktadha wa tendo la Yuda, “anasalitiwa” linaonyesha usaliti wa kiuhusiano. Maana nyingine halali ya “anakabidhiwa” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano kati ya kusudi lililoamuliwa na wajibu wa binadamu
  choice: Kuhifadhi pamoja kwamba mwendo wa Mwana wa Adamu umetangulia kukusudiwa na kwamba mtu anayemsaliti anatangaziwa ole.
  alternative: Kupunguza ama uzito wa kusudi lililoamuliwa ama hatia ya msaliti.
  rationale: Kigiriki kinaweka kweli hizi mbili sambamba bila kutatua mvutano wake; tafsiri haipaswi kuupendelea mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. Muundo ni wazi kwa msomaji wa kawaida, huku ukihifadhi jina la cheo “Mwana wa Adamu,” hali ya kutendwa katika kusudi lililoamuliwa, na mvutano kati ya kusudi hilo na wajibu wa msaliti.
