  text: Saa ilipofika, Yesu aliketi mezani kwa mkao wa kuegemea, pamoja na mitume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Saa ilipofika
  rationale: Huhifadhi neno mahususi ὥρα (‘saa’) na maana ya wakati uliowadia katika simulizi, huku ikiwa Kiswahili cha kawaida na fasaha.
- source_word: ἀνέπεσεν
  choice: aliketi mezani kwa kuegemea
  rationale: Kitenzi hiki humaanisha kukaa kwa kuegemea wakati wa kula kulingana na desturi ya wakati huo. Tafsiri hii inaeleweka kwa msomaji wa leo bila kuifupisha kuwa kuketi tu.
- source_word: οἱ ἀπόστολοι
  choice: mitume
  rationale: Ni tafsiri ya moja kwa moja ya kundi linalojulikana; hakuna haja ya kuongeza ‘wake,’ ambalo halipo wazi katika Kigiriki.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Hutoa kwa kawaida maana ya ushirika na uwepo pamoja inayoelezwa na σύν.
- source_word: Καὶ
  choice: —
  rationale: Kiunganishi hakikutafsiriwa kwa neno ‘Na’ mwanzoni kwa sababu mwanzo wa sentensi ‘Saa ilipofika’ unaendeleza simulizi kwa kawaida katika Kiswahili bila kupoteza uhusiano wake na yaliyotangulia.
theological_decisions:
- issue: Mkao wa kula katika mazingira ya Pasaka
  choice: aliketi mezani kwa kuegemea
  alternative: aliketi mezani
  rationale: Tafsiri inahifadhi mkao wa kihistoria unaodokezwa na ἀναπίπτω bila kuufanya useme jambo la kimafundisho lisilokuwamo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kirai ‘kwa kuegemea’ kinafafanua mkao wa kale wa kula; kurudiwa kwa ‘wakaketi’ kwa mitume kunakamilisha kisarufi kitenzi kinachoeleweka lakini kisichorudiwa katika Kigiriki.
