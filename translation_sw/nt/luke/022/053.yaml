id: LUK.22.53
reference: Luke 22:53
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: sw
  text: Kila siku nilipokuwa pamoja nanyi hekaluni, hamkunikamata.[a] Lakini huu ndio wakati wenu, na mamlaka ya giza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “hamkunyoosha mikono yenu dhidi yangu”; usemi huo unamaanisha kuchukua hatua ya uadui dhidi yake, hapa kumkamata.
    reason: lexical_alternative
  - marker: b
    text: Au, “nguvu ya giza.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kila siku
  rationale: Ni usemi wa mgawanyo unaoonyesha jambo lililotokea siku baada ya siku; “Kila siku” ni Kiswahili cha kawaida na sahihi.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: nilipokuwa pamoja nanyi
  rationale: Hugeuza genitive absolute kuwa kishazi cha wakati kwa Kiswahili cha asili huku ikihifadhi hali ya Yesu kuwapo pamoja nao.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hapa ni eneo la hekalu kwa ujumla, si patakatifu pa ndani pekee; “hekaluni” ni fupi na ya kawaida bila kulibana zaidi neno hilo.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: hamkunyoosha mikono yenu dhidi yangu
  rationale: Huhifadhi taswira ya nahau ya Kigiriki ya kuchukua hatua ya uadui, huku muktadha ukionyesha kuwa hatua hiyo ni kumkamata.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Lakini huu ndio wakati wenu
  rationale: “Wakati” huwasilisha kipindi au muda wao uliowadia kwa Kiswahili cha asili; kiwakilishi cha umilikaji huhifadhi msisitizo wa ὑμῶν.
- source_word: ἐξουσία
  choice: mamlaka
  rationale: “Mamlaka” huhifadhi maana ya haki au uwezo wa kutawala/kutenda, badala ya nguvu ghafi tu.
- source_word: τοῦ σκότους
  choice: ya giza
  rationale: Huhifadhi sitiari ya chanzo au milki yenye sifa ya giza bila kuitambulisha moja kwa moja kuwa Shetani au uovu.
theological_decisions:
- issue: Ikiwa “mamlaka ya giza” ifafanuliwe kuwa mamlaka ya Shetani au utawala wa uovu
  choice: mamlaka ya giza
  alternative: nguvu ya giza; mamlaka ya Shetani; utawala wa uovu
  rationale: Maandishi yenyewe yanataja giza bila kumtaja Shetani moja kwa moja. Sitiari imehifadhiwa ili kutodhoofisha mvutano wa kitheolojia wala kuingiza ufafanuzi usiotamkwa wazi.
- issue: Maana ya “wakati wenu”
  choice: huu ndio wakati wenu
  alternative: hii ndiyo saa yenu
  rationale: Usemi huo umeachwa na maana yake pana ya muda maalumu uliowadia, bila kueleza wazi ikiwa ni ruhusa ya muda, fursa, au wakati uliopangwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi ni wa asili, huku taswira ya Kigiriki na mvutano wa kitheolojia vikihifadhiwa.
