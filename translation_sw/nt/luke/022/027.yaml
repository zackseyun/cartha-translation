id: LUK.22.27
reference: Luke 22:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: sw
  text: 'Kwa maana, ni nani aliye mkuu zaidi: yule anayeketi mezani kula[a] au yule anayehudumu? Je, si yule anayeketi mezani kula? Lakini mimi niko kati yenu kama yule anayehudumu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “yule aliyeegemea mezani.” Katika desturi za karamu za wakati huo, watu walikula wakiwa wameegemea, huku wahudumu wakiwahudumia.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Kwa maana, ni nani aliye mkuu zaidi
  rationale: ‘Kwa maana’ linaonyesha kuwa swali linaeleza msingi wa kauli iliyotangulia; ‘mkuu zaidi’ linadumisha ulinganisho wa cheo au hadhi bila kuufafanua kupita kiasi.
- source_word: ὁ ἀνακείμενος
  choice: yule anayeketi mezani kula
  rationale: Kitenzi hiki katika mazingira ya mlo humaanisha kuwa mezani kama mloaji, kihistoria akiwa ameegemea. Kiswahili cha kawaida husema ‘kuketi mezani kula’; tanbihi inadumisha desturi ya asili.
- source_word: ὁ διακονῶν
  choice: yule anayehudumu
  rationale: Umbo la kitenzi linamtaja mtu anayetoa huduma katika mlo, si lazima mtumwa. ‘Anayehudumu’ linahifadhi tendo na huepuka kuingiza hadhi ya utumwa au maana maalumu ya kikanisa.
- source_word: οὐχὶ
  choice: Je, si
  rationale: Hili ni swali la balagha linalotarajia jibu la kukubali.
- source_word: ἐγὼ δὲ
  choice: Lakini mimi
  rationale: ‘Lakini’ linaonyesha tofauti kati ya matarajio ya kawaida ya kijamii na mfano wa Yesu.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: mimi niko kati yenu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuwapo katikati ya kundi.
- source_word: ὡς ὁ διακονῶν
  choice: kama yule anayehudumu
  rationale: ‘Kama’ linaonyesha namna au ulinganisho, huku umbo la kitenzi la kuhudumu likidumishwa.
theological_decisions:
- issue: Jinsi ya kutafsiri maelezo ya Yesu kuhusu huduma yake
  choice: Lakini mimi niko kati yenu kama yule anayehudumu.
  alternative: Lakini mimi niko kati yenu kama mtumishi.
  rationale: Kigiriki kinatumia kitenzi-shirikishi διακονῶν, si nomino δοῦλος. Kwa hiyo, ‘yule anayehudumu’ linahifadhi tendo la huduma katika mazingira ya mlo na unyenyekevu wa Yesu bila kuongeza dhana ya hadhi ya mtumwa ambayo neno lenyewe halisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kuketi mezani kula’ ni usemi wa kawaida unaoeleweka kwa urahisi; tanbihi inaeleza taswira ya kihistoria ya kula wakiwa wameegemea. Muundo wa maswali ya balagha na tofauti inayotambulishwa na ‘Lakini mimi’ vimehifadhiwa.
