  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: sw
  text: Lakini akasema, “Nakuambia, Petro, leo jogoo hatawika mpaka utakapokana mara tatu kwamba unanijua.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nakuambia, Petro, jogoo hatawika leo kabla hujakana mara tatu kwamba unanijua.”
    reason: Njia nyingine ya kutafsiri uhusiano wa wakati unaoonyeshwa na ἕως kwa kutumia “kabla” badala ya “mpaka.”
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Lakini yeye akasema
  rationale: δέ inaonyesha badiliko lenye utofautishaji mdogo katika mazungumzo; “Lakini” linafaa katika muktadha, na “akasema” ni simulizi la kawaida la Kiswahili.
- source_word: Λέγω σοι
  choice: Nakuambia
  rationale: Ni kauli ya moja kwa moja, ya kawaida na yenye nguvu ya wakati wa sasa katika Kiswahili.
- source_word: Πέτρε
  choice: Petro
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: φωνήσει
  choice: hatawika
  rationale: Kitenzi “kuwika” ndicho hutumiwa kwa sauti ya jogoo na hivyo kinaonyesha maana ya kimuktadha ya φωνέω.
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
- source_word: ἀλέκτωρ
  choice: jogoo
  rationale: Neno la kawaida la Kiswahili kwa rooster; Kigiriki hakina kibainishi hapa, lakini Kiswahili hakihitaji kutofautisha kwa umbo kati ya “a rooster” na “the rooster.”
- source_word: ἕως
  choice: mpaka
  rationale: Linaonyesha kikomo cha wakati ambacho kabla yake tendo lililokanushwa halitatokea, huku likihifadhi muundo wa sentensi ya Kigiriki.
- source_word: τρίς
  choice: mara tatu
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: ἀπαρνήσῃ
  choice: utakapokana
  rationale: “Kukana” linaeleza tendo la kukataa ukweli unaohusu kumjua Yesu; umbo lenye “-takapo-” linafaa baada ya “mpaka.”
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: utakapokana ... kwamba unanijua
  rationale: εἰδέναι linabainisha jambo litakalokanwa, yaani kumjua Yesu. “Kwamba unanijua” ni wazi na halipanui maana kuwa kukana utii au uhusiano kwa ujumla.
theological_decisions:
- issue: Asili ya kukana kwa Petro kulikotabiriwa
  choice: Kueleza wazi kuwa Petro atakana kwamba anamjua Yesu.
  alternative: Kusema tu kwamba Petro atamkana Yesu mara tatu.
  rationale: Kigiriki kina εἰδέναι, “kujua,” hivyo tafsiri haipaswi kuiacha wala kupanua utabiri huu kuwa kukana kwa maana nyingine pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jogoo hatawika” ni usemi wa kawaida; mpangilio umehifadhi msisitizo wa “leo” bila kufanya sentensi iwe ngumu.
