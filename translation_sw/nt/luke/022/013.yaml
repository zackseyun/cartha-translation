base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: sw
  text: Basi wakaenda, wakakuta kama vile alivyowaambia, na wakaandaa Pasaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlo wa Pasaka,” au “mwana-kondoo wa Pasaka.” Neno la Kigiriki linaweza kumaanisha adhimisho la Pasaka kwa ujumla, au hasa mlo wake au vitu vya dhabihu vinavyohusiana nayo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες
  choice: wakaenda
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kitendo kilichotangulia kabla ya kukuta; mfuatano wa vitenzi katika Kiswahili ni wa asili na unadumisha mpangilio huo.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi na kuonyesha matokeo ya maagizo ya Yesu, si tofauti kali.
- source_word: εὗρον
  choice: wakakuta
  rationale: Neno hili linamaanisha kupata au kukuta. Kiswahili kinaweza kuacha yambwa lisilotajwa wazi, kama ilivyo katika Kigiriki, huku muktadha ukionyesha kuwa walikuta hali kama Yesu alivyosema.
- source_word: καθὼς
  choice: kama vile
  rationale: Tafsiri hii inaonyesha ulinganifu wa wazi kati ya yale Yesu aliyosema na yale waliyokuta.
- source_word: εἰρήκει αὐτοῖς
  choice: alivyokuwa amewaambia
  rationale: Muundo huu unaonyesha kwamba Yesu alikuwa amewaambia jambo hilo kabla ya wao kwenda, na kwamba maneno hayo bado yanahusika katika tukio.
- source_word: ἡτοίμασαν
  choice: wakaandaa
  rationale: Kitenzi hiki kinaeleza kufanya maandalizi au kufanya kitu kiwe tayari; ‘wakaandaa’ ni cha kawaida na sahihi katika muktadha huu.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: πάσχα linaweza kumaanisha adhimisho la Pasaka kwa upana, mlo wake, au mwana-kondoo wa dhabihu. ‘Pasaka’ linahifadhi upana wa neno la Kigiriki bila kulibana katika maana moja.
theological_decisions:
- issue: Upeo wa maana ya πάσχα katika muktadha huu
  choice: Pasaka
  alternative: mlo wa Pasaka; mwana-kondoo wa Pasaka
  rationale: Muktadha unahusu maandalizi ya kula Pasaka, lakini neno la Kigiriki lenyewe linaweza kutaja adhimisho, mlo, au sehemu yake ya dhabihu. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha maana mahususi zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Mfuatano ‘wakaenda, wakakuta … wakaandaa’ unaendeleza simulizi kwa mtiririko wa kawaida wa Kiswahili.
