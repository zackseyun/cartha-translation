  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: sw
  text: Lakini sasa, mwenye mfuko wa fedha auchukue, na vivyo hivyo mkoba wa safari[a]; naye asiye na upanga[b] auze vazi lake la nje na anunue upanga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfuko wa msafiri” au “gunia la safari.” Neno la Kigiriki πήρα humaanisha mfuko uliobebwa na msafiri.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema kihalisi “asiye na,” bila kutaja wazi kitu kinachokosekana. Muktadha wa amri inayofuata unaelekeza kumaanisha “asiye na upanga.”
    reason: source_ambiguity
  - marker: c
    text: Neno la Kigiriki μάχαιρα linaweza pia kumaanisha upanga mfupi au kisu kikubwa cha kupigania.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Lakini sasa
  rationale: Inaonyesha tofauti kubwa kati ya maagizo haya na yale yaliyotangulia, huku ikihifadhi maana ya wakati ya νῦν.
- source_word: ὁ ἔχων
  choice: mwenye
  rationale: Inawakilisha kwa njia ya kawaida mtu yeyote aliye na kitu kinachotajwa, bila kuongeza jinsia isiyolazimishwa na maana.
- source_word: βαλλάντιον
  choice: mfuko wa fedha
  rationale: Neno hili linamaanisha mfuko wa kubebea fedha; tafsiri hii ni wazi na ya kawaida kwa wasomaji wa leo.
- source_word: ἀράτω
  choice: auchukue
  rationale: Katika muktadha wa maandalizi ya safari, kitenzi hiki kina maana ya kuchukua na kwenda nao.
- source_word: ὁμοίως καὶ πήραν
  choice: na vivyo hivyo mkoba wa safari
  rationale: πήρα ni mkoba au mfuko wa msafiri; kirai hiki kinaeleza kazi yake na kuhifadhi ὁμοίως.
- source_word: ὁ μὴ ἔχων
  choice: asiye nao
  rationale: Kigiriki hakitaji wazi kitu ambacho mtu huyo hana. Kiswahili hiki kinahifadhi udokezo huo badala ya kuingiza moja kwa moja neno “upanga,” ingawa muktadha unaelekea kulimaanisha.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: auze joho lake
  rationale: ἱμάτιον ni vazi la nje lenye thamani; “joho” ni neno fupi na linaloeleweka katika muktadha huu.
- source_word: ἀγορασάτω μάχαιραν
  choice: anunue upanga
  rationale: Inahifadhi amri ya moja kwa moja na maana ya kawaida ya μάχαιρα bila kuipunguza kuwa lugha ya kitamathali.
theological_decisions:
- issue: Ikiwa amri ya kununua upanga ipunguzwe au iongezwe nguvu kwa tafsiri ya kiufafanuzi
  choice: anunue upanga
  alternative: ajiandae kwa hatari; anunue silaha
  rationale: Kigiriki kinataja μάχαιρα moja kwa moja na kutumia amri. Tafsiri inahifadhi mvutano wa kifungu bila kuamua hapa ikiwa maana pana ni halisi, ya kitamathali, au ya aina nyingine.
- issue: Kitu kisichotajwa baada ya ὁ μὴ ἔχων
  choice: asiye nao, pamoja na tanbihi
  alternative: asiye na upanga
  rationale: Muktadha unaashiria upanga, lakini Kigiriki hakirudii nomino hiyo. Tafsiri kuu inahifadhi kiasi fulani cha udokezo, na tanbihi inaeleza uwezekano unaotokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umehifadhiwa kwa lugha ya kawaida; udokezo wa Kigiriki katika “asiye na” haujafichwa, na maana ya upanga haijalainishwa kitheolojia.
