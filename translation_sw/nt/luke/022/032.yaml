  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: sw
  text: Lakini mimi nimekuombea, ili imani yako[a] isije ikakoma; nawe, utakaporudi[b], waimarishe ndugu zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wako” au “kumtumaini Yesu.” Neno la Kigiriki linaweza kuwa na maana hizi zinazokaribiana.
    reason: alternative_reading
  - marker: b
    text: Au “utakapogeuka na kurudi” au “utakaporejea.” Maneno haya yanadokeza kurejeshwa kwa Petro baada ya kuanguka kwake kunakokaribia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: nimekuombea
  rationale: Kitenzi hiki huonyesha ombi la dhati. “Nimekuombea” ni Kiswahili cha kawaida kinachoonyesha kwamba Yesu amesali kwa ajili ya Petro, huku tendo lililokamilika likiwa na umuhimu wa sasa.
- source_word: περὶ σοῦ
  choice: kwa ajili yako (iliyomo katika “nimekuombea”)
  rationale: Pamoja na kitenzi cha kuomba, περί + genitive huonyesha maombezi kwa ajili ya mtu. Kiambishi “-ku-” na kauli ya kutendea “-ombea” vinawasilisha maana hiyo kwa njia ya asili katika Kiswahili.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: ili ... isije ikakoma
  rationale: ἐκλείπω inaweza kumaanisha kushindwa, kukoma, au kuisha. “Isije ikakoma” inaeleweka kwa urahisi na haidai kwamba kushindwa kwa Petro kulikuwa kuiacha imani kabisa.
- source_word: πίστις
  choice: imani
  rationale: “Imani” huhifadhi upana wa πίστις, ambao hapa unaweza kujumuisha kumwamini Yesu na kudumu kwa uaminifu wakati wa jaribu.
- source_word: ποτε
  choice: utakapo-
  rationale: Hapa ποτέ inaelekeza kwenye wakati fulani ujao. Muundo wa “utakapo-” unawasilisha kwa kawaida maana ya “wakati utakapofika.”
- source_word: ἐπιστρέψας
  choice: utakaporudi
  rationale: Kitenzi kinaweza kumaanisha kurudi au kugeuka na kurudi, na hapa kina dokezo la kurejeshwa baada ya kushindwa kwa Petro. “Utakaporudi” huhifadhi maana hiyo bila kulazimisha tafsiri finyu ya toba.
- source_word: στήρισον
  choice: waimarishe
  rationale: Amri hii inamtaka Petro awafanye wenzake wawe thabiti. “Waimarishe” ni ya asili na inafaa kwa msaada wa kiroho na wa kindugu.
- source_word: ἀδελφούς
  choice: ndugu zako
  rationale: Katika muktadha wa karibu, neno hili linawahusu wanafunzi wenzake Petro. “Ndugu zako” ni tafsiri ya kawaida ya Kiswahili na haipanui rejeo kimakusudi zaidi ya muktadha.
theological_decisions:
- issue: Maana ya πίστις ambapo imani, kumtumaini, na uaminifu zinaingiliana
  choice: imani
  alternative: uaminifu; kumtumaini Yesu
  rationale: “Imani” huhifadhi upana wa neno la Kigiriki. Kwa kuwa muktadha unahusu kudumu kwa Petro wakati wa kujaribiwa, “uaminifu” na “kumtumaini Yesu” ni vidokezo vinavyowezekana, lakini havipaswi kuchukua nafasi ya upana huo katika matini kuu.
- issue: Maana ya ἐπιστρέψας kuhusu hali ya Petro ya baadaye
  choice: utakaporudi
  alternative: utakapogeuka na kurudi; utakaporejea
  rationale: Neno linaonyesha kurudi au kurejeshwa baada ya kuanguka kwa Petro. Tafsiri hii inadumisha sitiari na mvutano wa kiteolojia bila kuingiza moja kwa moja istilahi finyu ya “kutubu.”
- issue: Rejeo la ἀδελφούς katika muktadha
  choice: ndugu zako
  alternative: waamini wenzako
  rationale: Rejeo la karibu ni kwa wanafunzi wenzake Petro. “Ndugu zako” huhifadhi lugha ya undugu ya matini na huepuka kufafanua rejeo kuwa kundi pana lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi; “waimarishe” huhifadhi uzito wa amri bila kutumia msamiati wa kale.
