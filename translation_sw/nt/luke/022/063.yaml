  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: sw
  text: Nao wale wanaume waliokuwa wakimshikilia walimdhihaki huku wakimpiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wakimweka kizuizini.”
    reason: Njia nyingine ya kutafsiri συνέχοντες kwa kusisitiza hali ya kuwa chini ya ulinzi kuliko tendo halisi la kumshikilia.
lexical_decisions:
- source_word: συνέχοντες
  choice: waliokuwa wakimshikilia
  rationale: Huwasilisha tendo la kumweka Yesu chini ya udhibiti wa kimwili bila kuongeza wazo mahususi la kifungo rasmi; hali ya kuendelea ya kitenzi pia imehifadhiwa.
- source_word: ἐνέπαιζον
  choice: walimdhihaki
  rationale: ‘Kudhihaki’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha kejeli ya uhasama na kumtendea mtu kwa dharau.
- source_word: αὐτῷ
  choice: -m- katika ‘walimdhihaki’
  rationale: Yambwa ya Kigiriki iliyo katika hali ya dative inatolewa kwa kawaida katika Kiswahili kwa kiambishi cha yambwa kinachomrejelea Yesu.
- source_word: δέροντες
  choice: huku wakimpiga
  rationale: Huonyesha kwamba kupiga kulifanyika sambamba na kudhihaki, bila kubainisha kupita kiasi kwamba ilikuwa kuchapa viboko.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Kigiriki kinataja wanaume kwa ujumla, si walinzi wala askari; tafsiri hii haiongezi utambulisho wa kikazi usiotajwa.
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya asili katika Kiswahili huku kikiwahusisha wanaume wanaotajwa kama wahusika wapya wa sentensi.
theological_decisions:
- issue: Utambulisho wa waliomtesa Yesu
  choice: wale wanaume waliokuwa wakimshikilia
  alternative: walinzi waliokuwa wakimshikilia
  rationale: Matini inatumia neno la jumla ἄνδρες, ‘wanaume.’ Ingawa muktadha unaonyesha kwamba walikuwa wakimweka kizuizini, kuwataja kuwa walinzi kungebana maana kuliko Kigiriki chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakimshikilia’ ni cha kawaida na halisi; tanbihi huhifadhi maana mbadala ya kumweka kizuizini. Muundo ‘huku wakimpiga’ unaonyesha matendo yanayotokea kwa wakati mmoja.
