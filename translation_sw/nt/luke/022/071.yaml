  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: sw
  text: Ndipo wakasema[a], “Kwa nini bado tunahitaji ushahidi? Kwa maana sisi wenyewe tumesikia kutoka kinywani mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuna haja gani tena ya ushahidi?”
    reason: Njia nyingine iliyo karibu zaidi na muundo wa Τί ἔτι ... χρείαν, huku maana ya swali la balagha ikibaki ileile.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ndipo wakasema
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi; “ndipo” linaonyesha mfuatano kwa Kiswahili cha kawaida bila kusisitiza upinzani.
- source_word: Τί ἔτι
  choice: Kwa nini bado
  rationale: Katika swali hili la balagha, kirai hiki kinaeleweka kwa kawaida kuwa “Kwa nini bado...?”; maana halisi zaidi imehifadhiwa katika tanbihi kama uwezekano mwingine.
- source_word: ἔχομεν μαρτυρίας χρείαν
  choice: tunahitaji ushahidi
  rationale: χρείαν ἔχειν humaanisha ‘kuhitaji,’ na μαρτυρίας katika mazingira haya ya kimahakama ni ‘ushahidi’ au ‘ushuhuda.’ “Tunahitaji ushahidi” ni usemi wa sasa na wa kawaida.
- source_word: μαρτυρίας
  choice: ushahidi
  rationale: Neno hili hapa linahusu ushahidi unaotolewa katika uchunguzi wa kimahakama. “Ushahidi” linafaa zaidi katika muktadha huu kuliko “ushuhuda,” ingawa yote yanawezekana.
- source_word: αὐτοὶ γὰρ
  choice: Kwa maana sisi wenyewe
  rationale: “Sisi wenyewe” huhifadhi msisitizo wa αὐτοὶ kwamba wao binafsi ndio waliosikia; “kwa maana” huonyesha kazi ya γάρ ya kutoa sababu.
- source_word: ἠκούσαμεν
  choice: tumesikia
  rationale: 'Wakati timilifu wa Kiswahili huonyesha tendo lililotokea na matokeo yake ya sasa: kile walichosikia sasa wanakiona kuwa cha kutosha.'
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: kutoka kinywani mwake
  rationale: Huu ni usemi wa moja kwa moja unaoonyesha kwamba walimsikia yeye binafsi akisema maneno hayo, bila kuongeza kitu ambacho hakikutajwa katika Kigiriki.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba walichosikia ni dai au ushahidi wa Yesu dhidi yake mwenyewe
  choice: Kitenzi “tumesikia” kimeachwa bila yambwa, kama ilivyo katika Kigiriki.
  alternative: “tumesikia ushahidi huo kutoka kinywani mwake” au “tumesikia dai lake kutoka kinywani mwake”
  rationale: Kigiriki hakitaji wazi kitu kilichosikiwa. Kuongeza “dai” au “ushahidi huo” kungefasiri tabia ya maneno ya Yesu na kupunguza ukali pamoja na mvutano wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi wa swali umehifadhi nguvu ya mazingira ya kimahakama.
