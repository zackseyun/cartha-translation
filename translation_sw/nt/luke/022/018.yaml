base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: sw
  text: Kwa maana ninawaambia, tangu sasa hakika sitakunywa zao la mzabibu[a] mpaka ufalme wa Mungu utakapokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “divai.” Kigiriki kinasema “zao la mzabibu,” usemi mpana ambao huenda unarejelea kilichokuwa ndani ya kikombe bila kutumia neno la kawaida linalomaanisha divai.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: Kauli hii ya moja kwa moja imetafsiriwa kwa Kiswahili cha kawaida; “kwa maana” inadumisha uhusiano wa maelezo unaoonyeshwa na γάρ.
- source_word: οὐ μὴ πίω
  choice: hakika sitakunywa
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi unatoa ukanushaji wa wakati ujao wenye mkazo. “Hakika sitakunywa” huhifadhi mkazo huo bila kuufanya kuwa ukanushaji usio na mwisho, kwa kuwa sentensi ina mpaka wa “mpaka.”
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuonyesha mwanzo unaotokana na wakati wa sasa.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: zao la mzabibu
  rationale: γένημα ni kile kinachozalishwa, yaani zao. Tafsiri hii inahifadhi usemi mpana wa Kigiriki bila kuubainisha moja kwa moja kuwa divai.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Neno hili linaonyesha kikomo cha muda cha ukanushaji na linatafsiriwa kwa kawaida kuwa “mpaka.”
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi unaoeleweka vizuri katika Kiswahili na huhifadhi maana za utawala na ufalme bila kuuchuja kuwa dhana moja tu.
- source_word: ἔλθῃ
  choice: utakapokuja
  rationale: Hali tegemezi ya Kigiriki katika kishazi cha wakati inaelekeza kwenye tukio la wakati ujao; “utakapokuja” ni muundo wa asili wa Kiswahili baada ya “mpaka.”
theological_decisions:
- issue: Iwapo γενήματος τῆς ἀμπέλου itafsiriwe kuwa “divai” au kwa usemi mpana zaidi
  choice: zao la mzabibu
  alternative: divai
  rationale: Kigiriki hakitumii neno la kawaida linalomaanisha divai, bali usemi mpana zaidi. Kuuhifadhi huepuka kuifanya maana kuwa finyu kuliko matini na kudumisha mwangwi wa mazingira ya mlo.
- issue: Nguvu na wakati wa kuja kwa ufalme wa Mungu
  choice: mpaka ufalme wa Mungu utakapokuja
  alternative: mpaka ufalme wa Mungu utakapokuwa umekuja kikamilifu
  rationale: Matini inaweka mpaka wa wakati unaoelekea siku zijazo, lakini haielezi namna au hatua ya kuja kwa ufalme. Tafsiri haiongezi wazo la “kikamilifu,” hivyo inadumisha mvutano wa kitheolojia uliomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hakika sitakunywa” limetumiwa kuonyesha ukanushaji wenye mkazo, na “zao la mzabibu” limehifadhiwa kwa usahihi wa kileksika huku maelezo ya “divai” yakiwekwa katika tanbihi.
