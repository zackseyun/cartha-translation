  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: sw
  text: Walipokwisha kuwasha moto katikati ya ua na kuketi pamoja, Petro alikuwa ameketi kati yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Petro aliketi kati yao.” Kauli ya Kigiriki inaweza kutafsiriwa kwa urahisi zaidi kuwa “aliketi,” lakini “alikuwa ameketi” huonyesha vizuri zaidi hali iliyokuwa ikiendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: walipokwisha kuwasha
  rationale: Kirai cha wakati chenye kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia hali kuu; ‘walipokwisha kuwasha’ ni Kiswahili cha kawaida na huonyesha mtiririko huo.
- source_word: πῦρ
  choice: moto
  rationale: Katika muktadha huu nomino inarejelea moto waliouwasha; Kiswahili hakihitaji kibainishi kisicho dhahiri kama Kiingereza.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: katikati ya ua
  rationale: Huhifadhi maana halisi ya mahali kwa lugha fupi na ya kawaida; ‘ua’ hapa ni eneo la wazi la makao ya kuhani mkuu.
- source_word: συγκαθισάντων
  choice: kuketi pamoja
  rationale: Huhifadhi kiambishi σύν kinachoonyesha kuwa watu hao waliketi pamoja.
- source_word: ἐκάθητο
  choice: alikuwa ameketi
  rationale: Huonyesha hali iliyoendelea katika wakati uliopita inayodokezwa na imperfecti ya Kigiriki, bila kutumia muundo usio wa kawaida wa Kiswahili.
- source_word: μέσος αὐτῶν
  choice: kati yao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha Petro alikuwa ndani ya kundi hilo.
- source_word: δὲ
  choice: hakutafsiriwa kwa neno tofauti
  rationale: Kiunganishi hiki chepesi cha masimulizi kinaweza kuwakilishwa kiasili na mwendelezo wa sentensi bila kuongeza ‘na’ mwanzoni, ambao ungekuwa mzito katika Kiswahili.
