  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: sw
  text: Kisha akachukua mkate, na baada ya kushukuru, akaumega na kuwapa, akisema, “Huu ni mwili wangu[c], unaotolewa kwa ajili yenu[b]. Endeleeni kufanya hivi kwa ukumbusho wangu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale hazina maneno haya: “unaotolewa kwa ajili yenu. Endeleeni kufanya hivi kwa ukumbusho wangu.”'
    reason: textual_variant
  - marker: b
    text: 'Au: “unaendelea kutolewa kwa ajili yenu.”'
    reason: lexical_alternative
  - marker: c
    text: “Huu ni mwili wangu” imetafsiriwa kama ilivyoandikwa. Baadhi ya watu huifasiri kuwa “Huu unawakilisha mwili wangu,” lakini Kigiriki chenyewe hutumia “ni.”
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: akachukua mkate
  rationale: Hutoa kwa lugha ya kawaida tendo la kuuchukua mkate na kudumisha mtiririko wa simulizi.
- source_word: εὐχαριστήσας
  choice: baada ya kushukuru
  rationale: Huonyesha kwamba kushukuru kulitangulia tendo la kuumega mkate, bila kuongeza wazi mhusika anayeshukuriwa ambaye hajatajwa katika Kigiriki.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: akaumega na kuwapa
  rationale: ‘Akaumega’ ni tafsiri ya moja kwa moja katika muktadha wa mkate; kiwakilishi cha kitu katika ‘kuwapa’ kinaeleweka kutokana na ‘mkate.’
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Huu ni mwili wangu
  rationale: Inadumisha kitenzi kishirikishi ‘ni’ cha matini badala ya kukifafanua kuwa ‘unamaanisha’ au ‘unawakilisha.’
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: unaotolewa kwa ajili yenu
  rationale: Muundo wa kirai tegemezi ni wa asili katika Kiswahili; ‘kwa ajili yenu’ huhifadhi maana pana ya ὑπέρ bila kuamua kwa tafsiri pekee namna kamili ya manufaa au uwakilishi.
- source_word: τοῦτο ποιεῖτε
  choice: Endeleeni kufanya hivi
  rationale: Amri ya wakati uliopo inaweza kuonyesha tendo linaloendelea au kurudiwa; ‘Endeleeni’ huweka wazi nguvu hiyo katika muktadha huu.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: kwa kunikumbuka
  rationale: Ni usemi wa sasa na unaoeleweka unaoonyesha tendo la kumkumbuka Yesu, bila kuufanya kuwa kumbukumbu ya moyoni tu au kuuingiza katika istilahi nzito ya kiliturujia.
theological_decisions:
- issue: Maana ya “Huu ni mwili wangu” katika muktadha wa chakula hiki
  choice: Huu ni mwili wangu
  alternative: Huu unamaanisha/unawakilisha mwili wangu
  rationale: Kigiriki chenyewe hutumia ‘ni.’ Tafsiri inadumisha kauli hiyo na mvutano wake wa kiteolojia bila kuamua mjadala wa kisakramenti.
- issue: Hali ya kimatini ya maneno ya mwisho ya mstari
  choice: Maneno “unaotolewa kwa ajili yenu. Endeleeni kufanya hivi kwa kunikumbuka” yamewekwa katika matini kuu
  alternative: Matini fupi inayoishia baada ya “Huu ni mwili wangu”
  rationale: SBLGNT iliyotolewa inajumuisha maneno hayo kwa alama ya tahadhari ya kimatini; tofauti muhimu imeelezwa katika tanbihi.
- issue: Nguvu ya amri ποιεῖτε
  choice: Endeleeni kufanya hivi
  alternative: Fanyeni hivi
  rationale: Hii huonyesha uwezekano wa tendo la kuendelea au kurudiwa unaobebwa na amri ya wakati uliopo katika muktadha, bila kudai kwamba umbo hilo haliwezi kamwe kutumiwa kwa amri ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya simulizi umetumiwa kwa urahisi, huku ‘baada ya kushukuru’ ikidumisha uhusiano wa wakati wa kishirikishi cha Kigiriki.
