  rationale: Kielezi hiki cha kuuliza kinaulizia mahali.
- source_word: θέλεις
  choice: unataka
  rationale: Ni tafsiri ya kawaida na ya sasa ya tendo la kutaka au kunuia.
- source_word: ἑτοιμάσωμεν
  choice: tukuandalie
  rationale: Hali tegemezi ya nafsi ya kwanza wingi baada ya θέλεις inaelezwa kwa kawaida kwa ‘unataka tukuandalie’; kiambishi -ku- kinamtaja Yesu kama mnufaika bila kuongeza kitu kisichokuwapo katika muktadha.
