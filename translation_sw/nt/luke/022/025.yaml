  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: sw
  text: Lakini akawaambia, “Wafalme wa Mataifa[a] huwatawala kama mabwana, na wale wanaotumia mamlaka juu yao huitwa ‘Wafadhili.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasio Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: “Wafadhili” lilikuwa jina la heshima lililotumiwa kwa watawala au walezi wenye mamlaka na mali waliohesabiwa kuwa watenda mema kwa umma.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: wafalme
  rationale: Neno hili linamaanisha hasa wafalme, si watawala kwa ujumla.
- source_word: τῶν ἐθνῶν
  choice: wa Mataifa
  rationale: Katika muktadha huu linaelekea kumaanisha watu wasio Wayahudi; ‘Mataifa’ ni istilahi ya kawaida ya kibiblia inayoweza pia kuhifadhi maana pana ya mataifa.
- source_word: κυριεύουσιν
  choice: huwatawala kwa mabavu
  rationale: Kauli hii inaonyesha kutawala wengine kama mabwana wao; ‘kwa mabavu’ huwasilisha hali ya kutumia nguvu na ubwana katika utofautishaji anaoufanya Yesu.
- source_word: ἐξουσιάζοντες
  choice: wale wanaotumia mamlaka
  rationale: Muundo wa kitenzi huhifadhi wazo la kutumia mamlaka kwa vitendo, badala ya kuwa na cheo tu.
- source_word: εὐεργέται
  choice: Wafadhili
  rationale: ‘Wafadhili’ ni tafsiri fupi na ya kawaida kwa watu wenye uwezo wanaotoa manufaa; herufi kubwa na alama za kunukuu zinaonyesha kuwa hapa ni jina la heshima.
- source_word: καλοῦνται
  choice: huitwa
  rationale: Huhifadhi kwa njia ya moja kwa moja hali ya kutendwa na wazo la kuitwa kwa jina au cheo hicho.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji wa kiasi na mabishano ya wanafunzi katika muktadha uliotangulia.
theological_decisions:
- issue: Maana ya ἐθνῶν katika muktadha
  choice: Mataifa
  alternative: mataifa yote / watu wasio Wayahudi
  rationale: Kauli inatofautisha mtindo wa utawala wa ulimwengu wa wasio Wayahudi na mwenendo unaowapasa wanafunzi. ‘Mataifa’ huhifadhi istilahi ya kawaida ya Agano Jipya bila kuongeza dai la kimadhehebu.
- issue: Nguvu ya κυριεύουσιν
  choice: huwatawala kwa mabavu
  alternative: huwatawala / huwatawala kama mabwana
  rationale: Tafsiri hii huhifadhi wazo la ubwana wenye nguvu linalolinganishwa na uongozi wa wanafunzi katika mstari unaofuata, bila kudai kwamba kila matumizi ya mamlaka ni mabaya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kwa mabavu’ huleta nguvu ya kitenzi cha Kigiriki, huku ‘Wafadhili’ ikihitaji tanbihi ya kitamaduni ili kuonyesha matumizi yake kama cheo cha heshima.
