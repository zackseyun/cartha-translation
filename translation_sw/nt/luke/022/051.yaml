  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: sw
  text: Lakini Yesu akajibu, “Acheni! Imetosha.” Kisha akaligusa sikio la mtu huyo, akamponya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Acheni! Imetosha.
  rationale: Kauli hii inaweza kumaanisha kusitisha tendo linaloendelea, kwa maana ya ‘Acheni jambo hili’ au ‘Imetosha.’ Tafsiri hii ya Kiswahili inadumisha ukali wa amri na, kwa kadiri iwezekanavyo, uwazi wa maana zake mbili bila kuongeza mtendaji au kitendo kisichotajwa.
- source_word: ὠτίου
  choice: sikio
  rationale: Ingawa neno la Kiyunani ni umbo dogo la οὖς, katika muktadha huu humaanisha kwa kawaida ‘sikio’; ‘kisikio’ si lugha ya kawaida wala ya heshima katika Kiswahili cha sasa.
- source_word: ἰάσατο αὐτόν
  choice: kumponya
  rationale: Kiwakilishi αὐτόν kinamrejelea mtu, si sikio, kwa hiyo ‘kumponya’ huhifadhi kiambishi cha yambwa cha mtu.
theological_decisions:
- issue: Upeo wa amri Ἐᾶτε ἕως τούτου
  choice: Acheni! Imetosha.
  alternative: Acheni jambo hili!
  rationale: Muktadha unaweza kuelekeza kwa wanafunzi waache kupigana, lakini usemi wenyewe ni mfupi na una utata. Uwasilishaji uliochaguliwa hauufanyi ufafanuzi mmoja kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa masimulizi umetolewa kwa ‘akajibu’ na ‘akaigusa ... na kumponya’; ‘Lakini’ inawakilisha δέ ya utofautishaji.
