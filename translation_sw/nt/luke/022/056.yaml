  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: sw
  text: Kisha msichana mmoja aliyekuwa mtumishi, alipomwona ameketi karibu na mwanga[a], akamkazia macho, akasema, “Huyu pia alikuwa pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “penye mwanga.” Kirai cha Kigiriki kinaweza kumaanisha kuwa karibu na chanzo cha mwanga au kuwa katika eneo lililoangazwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: alipomwona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kuwa kumwona kulitangulia kumkazia macho na kusema; muundo wa “alipomwona” ni wa asili katika Kiswahili.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi kuliko kuonyesha upinzani mkali.
- source_word: παιδίσκη τις
  choice: msichana mmoja mtumishi
  rationale: παιδίσκη humaanisha msichana au mwanamke kijana aliye mtumishi, na τις inaonyesha kutotajwa kwake kwa namna maalumu. Chaguo hili ni wazi kwa wasomaji wa sasa bila kusisitiza zaidi ya muktadha hali ya utumwa.
- source_word: καθήμενον
  choice: ameketi
  rationale: Inaeleza hali ya mtu huyo wakati msichana alipomwona.
- source_word: πρὸς τὸ φῶς
  choice: penye mwanga
  rationale: Huwasilisha kwamba alikuwa katika eneo lililoangazwa, huku tanbihi ikihifadhi uwezekano wa maana ya kuwa karibu na chanzo cha mwanga.
- source_word: ἀτενίσασα αὐτῷ
  choice: akamkazia macho
  rationale: Nahau hii ya kawaida ya Kiswahili inaonyesha kumtazama kwa makini na kwa muda.
- source_word: Καὶ οὗτος
  choice: Huyu pia
  rationale: Huhifadhi nguvu ya kiashirio cha οὗτος na maana ya nyongeza ya καί bila kuongeza neno “mtu” lisilohitajika.
- source_word: σὺν αὐτῷ ἦν
  choice: alikuwa pamoja naye
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ushirika unaoonyeshwa na σύν pamoja na ἦν.
