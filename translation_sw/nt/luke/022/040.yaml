base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: sw
  text: Alipofika mahali pale, akawaambia, “Ombeni ili msiingie katika jaribu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha kishawishi cha kutenda dhambi, au hali pana zaidi ya kujaribiwa au kupimwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Alipofika mahali pale
  rationale: Kirai hiki kinaeleza kufika katika eneo lililotajwa tayari katika muktadha. “Alipofika” huonyesha uhusiano wa wakati kati ya tendo hilo na kusema kwake, huku “mahali pale” likirejelea eneo linalojulikana katika simulizi.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kusema jambo kwa watu fulani; haiingizi mkazo zaidi ya uliomo katika kitenzi cha Kigiriki.
- source_word: Προσεύχεσθε
  choice: Ombeni
  rationale: Amri ya wakati wa sasa inahimiza sala inayoendelea au inayofanywa kwa desturi. “Ombeni” ni amri ya kawaida na ya moja kwa moja katika Kiswahili bila kulazimisha ufafanuzi wa ziada.
- source_word: μὴ εἰσελθεῖν
  choice: ili msiingie
  rationale: Muundo huu unaonyesha kusudi au jambo linalopaswa kuombwa. “Msiingie” huhifadhi taswira halisi ya kuingia badala ya kuifasiri kama “kuanguka.”
- source_word: πειρασμόν
  choice: jaribu
  rationale: Neno “jaribu” linaweza kuhusisha kishawishi cha kutenda dhambi au hali pana ya kujaribiwa na kupimwa. Kwa hiyo linafaa katika muktadha huu na pia huhifadhi upana wa neno la Kigiriki.
theological_decisions:
- issue: Maana ya πειρασμός katika onyo la Yesu
  choice: jaribu, likihusisha hasa kishawishi cha kushindwa kiroho
  alternative: hali ya kujaribiwa, kupimwa, au kupitia kipindi kigumu
  rationale: Muktadha wa karibu unaonya kuhusu hatari ya wanafunzi kushindwa kiroho, lakini neno la Kigiriki halifungi maana yake katika kishawishi cha kimaadili pekee. Tafsiri kuu na tanbihi zinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku taswira ya “kuingia” na utata halisi wa “jaribu” vikihifadhiwa.
