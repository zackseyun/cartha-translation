  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: sw
  text: Lakini yeye akamwambia, “Bwana, niko tayari kwenda pamoja nawe, gerezani na hata kufa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini yeye
  rationale: Kifungu hiki kinamrejelea Petro, huku δέ ikionyesha utofauti wa kiasi na kauli ya Yesu iliyotangulia.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa tendo la kusema kwa mtu; haimtaji Yesu moja kwa moja zaidi ya Kigiriki.
- source_word: Κύριε
  choice: Bwana
  rationale: Huhifadhi namna ya heshima ya kumwita Yesu na uzito wa cheo κύριος.
- source_word: μετὰ σοῦ
  choice: pamoja nawe
  rationale: μετά pamoja na genitivi huonyesha kuandamana; ‘pamoja nawe’ ni Kiswahili cha asili na sahihi.
- source_word: ἕτοιμός εἰμι
  choice: niko tayari
  rationale: Hueleza utayari na nia thabiti ya Petro kwa lugha ya kawaida ya sasa.
- source_word: καὶ ... καὶ
  choice: na ... na hata
  rationale: Muundo huu unaunganisha matokeo mawili kwa msisitizo; ‘na hata’ katika sehemu ya pili huonyesha kilele cha kifo kwa Kiswahili cha asili.
- source_word: εἰς φυλακὴν
  choice: gerezani
  rationale: Katika muktadha huu φυλακή humaanisha kifungo au gereza, na εἰς huonyesha kuelekea huko.
- source_word: εἰς θάνατον
  choice: hata kufa
  rationale: Kiswahili cha asili hueleza kwenda mpaka kwenye kifo kwa ‘hata kufa’; maana ya utayari wa kukabili kifo inabaki wazi.
- source_word: πορεύεσθαι
  choice: kwenda
  rationale: Ni kitenzi cha kawaida kinachofaa kama kijalizo cha ‘niko tayari’ na kinahifadhi wazo la kuandamana.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: ‘Bwana’ huhifadhi heshima na uzito wa kikristo wa cheo hiki bila kupunguza maana yake kuwa ya ualimu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetungwa kwa mtiririko wa kawaida wa usemi, huku kauli ya Petro yenye kujiamini ikihifadhiwa.
