  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: sw
  text: Mmoja wao akampiga mtumwa[a] wa kuhani mkuu, akamkata sikio lake la kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki doulos linaweza kumaanisha mtumwa au mtumishi, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: akampiga
  rationale: Kitenzi πατάσσω kinaonyesha pigo la nguvu; “akampiga” ni Kiswahili cha kawaida na chenye hadhi, bila kutumia lugha ya kizamani.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: Mmoja wao
  rationale: Huu ni usemi usiotaja mtu huyo kwa jina. “Mmoja wao” ni wa asili katika Kiswahili na unadumisha kutotambulishwa kwake katika simulizi la Luka.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: mtumwa wa kuhani mkuu
  rationale: δοῦλος hapa ni hadhi halisi ya kijamii ya mtu aliye chini ya mamlaka ya kuhani mkuu. “Mtumwa” huwasilisha hali hiyo kwa uwazi kuliko “mtumishi,” huku uwezekano wa tafsiri hiyo nyingine ukihifadhiwa katika tanbihi.
- source_word: ἀφεῖλεν
  choice: akamkata
  rationale: Ingawa ἀφαιρέω kimsingi ni kuondoa au kutwaa, katika muktadha wa jeraha la sikio, “akamkata” hueleza tendo na matokeo yake kwa lugha ya kawaida.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: sikio lake la kulia
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inahifadhi bayana upande wa mwili uliotajwa na δεξιόν.
theological_decisions:
- issue: Tafsiri ya δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: Neno hilo limetumiwa hapa kwa maana halisi ya hadhi ya kijamii, si kama sitiari ya kiroho. “Mtumwa” halainishi hali ya utegemezi na umilikiwa inayoweza kudokezwa na δοῦλος; “mtumishi” imeonyeshwa katika tanbihi kama tafsiri mbadala inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na kinachoeleweka kwa urahisi. Muundo wa vitenzi vinavyofuatana (“akampiga … akamkata”) unatunza mwendo wa simulizi, na “kuhani mkuu” ni istilahi ya kawaida ya kibiblia.
