id: LUK.22.6
reference: Luke 22:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: sw
  text: Naye akakubali, akaanza kutafuta nafasi nzuri ya kumkabidhi kwao wakati umati haupo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumsaliti.” Kitenzi cha Kigiriki kimsingi humaanisha “kumkabidhi” au “kumtia mikononi mwa mwingine”; katika tendo la Yuda, “kumsaliti” ni tafsiri halali kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: akakubali
  rationale: Katika muktadha huu Yuda anakubali mpango wa viongozi uliotajwa katika mistari iliyotangulia. “Akakubali” ni Kiswahili cha kawaida na huonyesha ridhaa, si ungamo.
- source_word: ἐζήτει
  choice: akaanza kutafuta
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha tendo lililoendelea au lililoanza wakati huo. “Akaanza kutafuta” linaendeleza simulizi kwa kawaida huku likihifadhi wazo la kuanza kwa jitihada hiyo.
- source_word: εὐκαιρίαν
  choice: nafasi nzuri
  rationale: Neno hili humaanisha fursa au wakati unaofaa. “Nafasi nzuri” ni usemi wa kawaida unaoonyesha mazingira yanayofaa kutekeleza jambo.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: ya kumkabidhi
  rationale: παραδίδωμι kimsingi ni kumtia au kumkabidhi mtu mikononi mwa mwingine. Tafsiri hii huhifadhi maana ya msingi bila kuficha kwamba katika muktadha tendo hilo ni usaliti.
- source_word: ἄτερ ὄχλου
  choice: wakati umati haupo
  rationale: Usemi huu unaonyesha kutokuwapo kwa umati. Muundo huu ni wa asili katika Kiswahili na unaweka wazi kwamba alitafuta fursa isiyokuwa na umati.
- source_word: αὐτοῖς
  choice: kwao
  rationale: Kiwakilishi hiki kinawarejelea makuhani wakuu na maofisa waliotajwa katika muktadha wa karibu, ambao ndio wangepokea aliyekabidhiwa.
theological_decisions:
- issue: Maana ya παραδοῦναι katika tendo la Yuda
  choice: kumkabidhi
  alternative: kumsaliti
  rationale: “Kumkabidhi” hukaa karibu na maana ya msingi ya kitenzi na hudumisha ulinganifu wake katika simulizi la mateso; “kumsaliti” ni tafsiri halali ya kimuktadha lakini inaongeza ufafanuzi wa nia ya tendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “akakubali, akaanza” unafaa simulizi na unaeleweka kwa urahisi. “Umati” limetumiwa kwa ὄχλος ili kuonyesha kundi kubwa la watu bila kuingiza wazo la vurugu.
