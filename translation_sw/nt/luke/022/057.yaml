  verdict: revise
  source_fidelity: ‘Akakana akisema’ faithfully represents the aorist denial and accompanying participle without supplying an object. However, ‘huyo’ adds a demonstrative nuance (‘that one’) not present in αὐτόν; the object prefix in ‘simjui’ already renders ‘him.’
  naturalness: The wording is clear Standard East African Swahili. Retaining ‘Mwanamke’ as a direct vocative is deliberately literal and intelligible in this solemn narrative register.
  terminology: ‘Akakana,’ ‘simjui,’ and ‘Mwanamke’ are suitable equivalents. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The independent pronoun ‘huyo’ is retained after ‘simjui.’
    rationale: In Kiswahili, the object prefix -m- in ‘simjui’ already means ‘him.’ Adding ‘huyo’ makes the reference demonstrative/emphatic (‘that one’), whereas the Greek has the ordinary pronoun αὐτόν. Omitting it more closely preserves the source.
