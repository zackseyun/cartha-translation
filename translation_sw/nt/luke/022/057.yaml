  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: sw
  text: Lakini yeye akakana akisema, “Mwanamke, simjui.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: akakana
  rationale: Kitenzi hiki kinaonyesha kwamba Petro alikataa dai lililotolewa. Kiswahili kinaweza kutumia ‘akakana’ bila kutaja kitu kinachokanushwa, hivyo hakuna haja ya kuongeza kiwakilishi kisichokuwapo katika Kigiriki.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kisarufi wa kirai ambacho kinaeleza maneno yaliyotumiwa katika kukana.
- source_word: Οὐκ οἶδα
  choice: simjui
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha kujua kilichokanushwa, huku kiambishi cha yambwa kikirejelea mtu.
- source_word: αὐτόν
  choice: huyo
  rationale: Kiwakilishi hiki kinamrejelea Yesu bila kuongeza nomino kama ‘mtu,’ ambayo haipo katika Kigiriki.
- source_word: γύναι
  choice: Mwanamke
  rationale: Ni mwito wa moja kwa moja kwa msemaji wa kike. ‘Mama’ au ‘bibi’ yangeongeza heshima au ulainishaji usioelezwa wazi na neno la Kigiriki.
theological_decisions:
- issue: Iwapo kutaja wazi kitu ambacho Petro alikana
  choice: Kutoongeza yambwa baada ya ‘akakana’
  alternative: ‘akalikana jambo hilo’ au ‘akamkana’
  rationale: Kigiriki hakitaji yambwa la ἠρνήσατο. Kiswahili cha kawaida kinakubali ‘akakana akisema,’ jambo linalohifadhi utata wa ikiwa alikana dai au alimkana Yesu. ‘Akamkana’ lingemtaja Yesu kwa namna iliyo wazi kuliko maandishi ya mstari huu.
- issue: Mpangilio wa mwito γύναι
  choice: ‘Mwanamke’ kuwekwa mwanzoni mwa kauli ya moja kwa moja
  alternative: ‘Simjui huyo, mwanamke’
  rationale: Kigiriki kinaweka mwito mwishoni, lakini Kiswahili cha kawaida na chenye kueleweka huuweka kwa urahisi mwanzoni. Maana na nguvu ya mwito wa moja kwa moja vinahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata kwa karibu maana na muundo wa Kigiriki bila kuwa ngumu; ‘Mwanamke’ ni ya moja kwa moja na haijaongezewa ulainishaji wa kiutamaduni.
