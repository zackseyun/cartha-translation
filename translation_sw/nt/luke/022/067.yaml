  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: sw
  text: wakisema, “Ikiwa wewe ndiye Masihi[a], tuambie.” Lakini akawaambia, “Nikiwaambia, hakika hamtaamini;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: Tafsiri mbadala ya cheo ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha maneno ya baraza na simulizi lililotangulia; ‘wakisema’ ni kifupi na cha kawaida katika Kiswahili.
- source_word: Εἰ σὺ εἶ
  choice: Ikiwa wewe ndiye
  rationale: Inahifadhi muundo wa sharti ulio wazi katika Kigiriki na mkazo wa kiwakilishi σὺ, badala ya kuugeuza kuwa swali la moja kwa moja.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo kinachohusiana na matarajio ya Kiyahudi; ‘Masihi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: εἰπὸν ἡμῖν
  choice: tuambie
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya amri εἰπόν pamoja na yambwa ya kiwakilishi ἡμῖν.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Lakini akawaambia
  rationale: δέ inaonyesha tofauti nyepesi katika jibu la Yesu; ‘Lakini’ huiwasilisha, na ‘akawaambia’ ni usemi wa kawaida wa kisimulizi.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Nikiwaambia
  rationale: Muundo huu wa Kiswahili unahifadhi sharti la ἐάν pamoja na kitendo cha kuwaambia bila uzito usio wa lazima.
- source_word: οὐ μὴ πιστεύσητε
  choice: hakika hamtaamini
  rationale: ‘Hakika’ inawasilisha ukanushaji wenye msisitizo wa οὐ μή, huku ‘hamtaamini’ ikihifadhi maana ya πιστεύω.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika mahojiano haya neno linatumika kama cheo cha mfalme aliyeahidiwa katika matarajio ya Kiyahudi. ‘Masihi’ huonyesha maana hiyo bila kuondoa uwezekano wa msomaji kutambua cheo kinachojulikana pia kama ‘Kristo’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti na ukanushaji wenye msisitizo vimehifadhiwa; semik koloni ya mwisho inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
