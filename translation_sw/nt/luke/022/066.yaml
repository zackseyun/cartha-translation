  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: sw
  text: Kulipopambazuka[a], baraza la wazee wa watu lilikusanyika, yaani, makuhani wakuu na waandishi wa sheria; nao wakampeleka Yesu katika baraza lao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchana ulipoanza,” au, “mchana ulipofika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakampeleka mbele ya baraza lao,” au, “katika ukumbi wao wa baraza.” Neno la Kigiriki linaweza kumaanisha baraza lenyewe, kikao chake rasmi, au mahali pake pa kukutania.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Kulipopambazuka
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha hali ya kuingia kwa mchana; tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kigiriki.
- source_word: συνήχθη
  choice: lilikusanyika
  rationale: Huwasilisha kwa kawaida tendo la kundi kukutana pamoja bila kuongeza wazo maalumu la kuitishwa rasmi.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: baraza la wazee wa watu
  rationale: πρεσβυτέριον hapa ni kundi rasmi la wazee, si dhana ya uwazee tu; 'baraza' linaeleweka kwa wasomaji wa Kiswahili.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: yaani, makuhani wakuu na waandishi wa sheria
  rationale: Kifungu kinabainisha washiriki wa baraza. 'Waandishi wa sheria' hufafanua kazi ya γραμματεῖς katika muktadha huu kuliko 'waandishi' peke yake.
- source_word: ἀπήγαγον
  choice: wakampeleka Yesu
  rationale: Huwasilisha maana ya kumwongoza au kumchukua hadi mahali pengine; jina 'Yesu' limetumiwa kwa uwazi wa kawaida wa Kiswahili badala ya kiwakilishi kisicho na rejeleo ndani ya mstari huu.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: mbele ya baraza lao
  rationale: συνέδριον inaweza kutaja baraza lenyewe, kikao chake, au mahali pa kikao. 'Mbele ya baraza lao' inafaa kwa mazingira ya kusikilizwa na huepuka kudai bila uhakika kwamba neno linamaanisha chumba.
theological_decisions:
- issue: Istilahi ya taasisi ya uongozi wa Kiyahudi
  choice: Kutafsiri πρεσβυτέριον kuwa 'baraza la wazee' na συνέδριον kuwa 'baraza lao,' huku tofauti na upana wa neno la pili vikielezwa katika tanbihi
  alternative: Kutumia 'Sanhedrini' au kutafsiri συνέδριον kuwa 'chumba chao cha baraza'
  rationale: Neno la Kigiriki συνέδριον halilazimishi hapa jina la taasisi lililotoholewa wala maana ya chumba pekee. Tafsiri ya kawaida pamoja na tanbihi huhifadhi utata halisi wa chanzo bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umegawanywa kwa alama za uakifishaji ili orodha ya makuhani wakuu na waandishi wa sheria ionekane kuwa ufafanuzi wa baraza la wazee. Alama zote za tanbihi zimo katika matini kuu.
