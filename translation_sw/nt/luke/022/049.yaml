  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: sw
  text: Wale waliokuwa karibu naye walipoona kile kilichokuwa karibu kutokea, wakasema, “Bwana, tupige kwa upanga[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha upanga au kisu kifupi cha kupigania.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati, ambacho ni cha kawaida katika Kiswahili na kinahifadhi uhusiano wake na kitenzi kikuu.
- source_word: οἱ περὶ αὐτὸν
  choice: wale waliokuwa pamoja naye
  rationale: Nahau hii inawataja waliokuwa karibu na Yesu bila kuwabainisha zaidi ya maandishi ya Kigiriki.
- source_word: τὸ ἐσόμενον
  choice: yaliyokuwa karibu kutokea
  rationale: Usemi huu unaonyesha tukio lililokuwa limekaribia sana; tafsiri hii inahifadhi maana hiyo ya ukaribu.
- source_word: εἶπαν
  choice: wakasema
  rationale: Maana ya kawaida ya λέγω ni kusema; alama ya swali katika maneno yanayofuata inaonyesha kuwa walichosema kilikuwa swali.
- source_word: Κύριε
  choice: Bwana
  rationale: Hili ni neno la heshima linalotumiwa kumwambia Yesu moja kwa moja na linahifadhi uzito wa cheo κύριος.
- source_word: εἰ πατάξομεν
  choice: tupige
  rationale: Katika muktadha huu εἰ pamoja na kitenzi cha wakati ujao huanzisha swali la kutaka uamuzi. Hali ya kutegemea ya Kiswahili, “tupige,” inaleta maana hiyo kwa kawaida.
- source_word: ἐν μαχαίρῃ
  choice: kwa upanga
  rationale: ἐν imetumiwa kuonyesha chombo cha kupigia. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na “a/the,” hivyo “kwa upanga” ni sahihi na ya kawaida.
theological_decisions:
- issue: Tafsiri ya κύριος katika maneno yanayoelekezwa kwa Yesu
  choice: Bwana
  alternative: Mwalimu
  rationale: “Bwana” huhifadhi maana ya heshima na uzito wa cheo hiki bila kukipunguza kuwa tu jina la uhusiano wa kijamii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “tupige?” ni swali la kawaida la kutaka ruhusa au uamuzi; hauongezi jibu ambalo Yesu hajalitoa katika mstari huu.
