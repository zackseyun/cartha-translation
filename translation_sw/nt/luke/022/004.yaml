base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: sw
  text: Naye akaenda, akashauriana na makuhani wakuu na maofisa[b] kuhusu jinsi ambavyo angemkabidhi[a] kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “angewasaliti.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumkabidhi,” “kumtoa mikononi mwa wengine,” au, katika muktadha huu, “kumsaliti.”
    reason: lexical_alternative
  - marker: b
    text: “Maofisa” hawa yaelekea walikuwa maofisa wa hekalu, hasa wenye uhusiano na walinzi wa hekalu, si askari Waroma.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: akaenda
  rationale: Kirai cha kitenzi cha wakati uliopita kinatangulia kitenzi kikuu na kuonyesha tendo lililotangulia; muundo wa masimulizi wa Kiswahili wenye “aka-” unaonyesha mfuatano huo kwa kawaida.
- source_word: συνελάλησεν
  choice: akazungumza na
  rationale: Kitenzi kina maana ya kuzungumza pamoja au kujadiliana; “akazungumza na” ni ya kawaida na haiongezi kwa lazima wazo la maafikiano.
- source_word: ἀρχιερεῦσιν
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wakuu wa kikuhani, wala halidokezi kwamba wote walishikilia cheo cha kuhani mkuu mmoja kwa wakati mmoja.
- source_word: στρατηγοῖς
  choice: maofisa
  rationale: Katika mazingira ya hekalu la Yerusalemu, neno hili linaelekea kumaanisha maofisa wenye mamlaka wanaohusiana na ulinzi wa hekalu; maelezo ya muktadha yametolewa katika tanbihi.
- source_word: τὸ πῶς
  choice: kuhusu jinsi
  rationale: Muundo huu unaanzisha jambo walilozungumzia; “kuhusu jinsi” ni wazi na wa kawaida katika Kiswahili.
- source_word: παραδῷ
  choice: atakavyomkabidhi
  rationale: παραδίδωμι inaweza kumaanisha kumkabidhi au kumsaliti. “Kumkabidhi” huhifadhi maana pana ya msingi huku muktadha ukionyesha usaliti; chaguo jingine limetajwa katika tanbihi.
- source_word: αὐτοῖς ... αὐτόν
  choice: -m- ... kwao
  rationale: Kiambishi cha yambwa “-m-” kinamrejelea Yesu, na “kwao” inawarejelea makuhani wakuu na maofisa, hivyo wahusika wawili wanatofautishwa wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri παραδῷ katika tendo la Yuda
  choice: atakavyomkabidhi kwao
  alternative: atakavyomsaliti
  rationale: Muktadha unaonyesha tendo la usaliti, lakini kitenzi cha Kigiriki kina maana pana ya kumkabidhi mtu kwa wengine. Tafsiri kuu inadumisha upana huo, na tanbihi inahifadhi maana ya kimuktadha ya “kumsaliti.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa “aka-” unafaa masimulizi na unaonyesha mfuatano wa matendo. “Maofisa” limeachwa pana katika matini kuu, huku utambulisho wao wa mazingira ya hekalu ukifafanuliwa katika tanbihi.
