  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: sw
  text: Bwana akageuka, akamtazama Petro[a]. Petro akalikumbuka neno la Bwana, jinsi alivyomwambia, “Leo, kabla jogoo hajawika, utanikana mara tatu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtazama Petro kwa makini”; kitenzi cha Kigiriki kinaweza kudokeza kumkazia mtu macho au kumtazama moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: akageuka
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kumtazama Petro; “akageuka” ni cha kawaida na huhifadhi mfuatano wa matendo.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Huhifadhi cheo kinachotumiwa hapa kumrejelea Yesu na uzito wake wa Kikristo bila kukipunguza kuwa “Mwalimu” au “Mkuu.”
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: akamtazama Petro
  rationale: “Kumtazama” ni Kiswahili cha kawaida kwa kumwelekezea mtu macho; kitenzi cha Kigiriki kinaweza pia kudokeza mtazamo wa moja kwa moja au wa makini, jambo lililowekwa katika tanbihi.
- source_word: ὑπεμνήσθη
  choice: akalikumbuka
  rationale: Ingawa umbo linaweza kueleweka kuwa “alikumbushwa,” muktadha unasisitiza kukumbuka kwa Petro; “akalikumbuka” ni wazi na ya kawaida.
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: neno la Bwana
  rationale: λόγος hapa ni kauli maalumu ambayo Yesu alikuwa amesema; “neno la Bwana” huhifadhi usemi wa chanzo kwa lugha ya kawaida ya kibiblia.
- source_word: ὡς εἶπεν αὐτῷ
  choice: jinsi alivyomwambia
  rationale: ὡς hapa inaanzisha yaliyomo katika kile Petro alichokumbuka; “jinsi alivyomwambia” ni asilia katika Kiswahili.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: kabla jogoo hajawika
  rationale: πρίν pamoja na kitenzi-jina huonyesha wakati unaotangulia. Kiswahili kwa kawaida hakihitaji kibainishi cha kutofafanua, na “jogoo hajawika” ni usemi wa kawaida.
- source_word: σήμερον
  choice: Leo
  rationale: σήμερον maana yake ni “leo”; kuiweka mwanzoni mwa nukuu huhifadhi msisitizo wa wakati na kutoa Kiswahili fasaha.
- source_word: ἀπαρνήσῃ με
  choice: utanikana
  rationale: “Kunikana” ni tafsiri sahihi na iliyozoeleka katika muktadha huu wa Petro kukataa kuwa anamjua au anahusiana na Yesu.
- source_word: τρίς
  choice: mara tatu
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka kwa urahisi.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi matumizi ya kawaida ya Agano Jipya na uzito wa kikristolojia wa cheo hicho, bila kuingiza maana finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa masimulizi umehifadhiwa kwa vitenzi vya -ka-, na nukuu imepangwa kwa mtiririko wa asili wa Kiswahili.
