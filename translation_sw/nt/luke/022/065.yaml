  text: καὶ ἕτερα πολλὰ βλασφημοῦντες ἔλεγον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: sw
  text: Nao walikuwa wakisema maneno mengine mengi ya kufuru dhidi yake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya kumtukana” au “ya kumkashifu.” Neno la Kigiriki linaweza kumaanisha kwa upana zaidi usemi wa dharau au matusi, ingawa “ya kufuru” huhifadhi uzito wake kamili hapa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwake.” Kihusishi cha Kigiriki kinaweza kutafsiriwa hivyo kwa ukaribu zaidi, lakini katika muktadha huu “dhidi yake” huonyesha vizuri uadui wa maneno hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza masimulizi na kuwaunganisha watendaji hawa na matendo yaliyotangulia.
- source_word: ἕτερα πολλὰ
  choice: mengine mengi
  rationale: Huhifadhi maana ya wingi na ya kuongezea maneno mengine kwa yale yaliyotangulia, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: βλασφημοῦντες
  choice: ya kufuru
  rationale: Kitenzi hiki kinaweza kumaanisha kusema kwa kumtukana, kumkashifu, au kukufuru. ‘Ya kufuru’ huhifadhi uzito wake hapa bila kuzuia maana pana ya matusi makali.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huwakilisha hali endelevu au inayorudiwa ya wakati usiotimilifu wa Kigiriki.
- source_word: εἰς αὐτόν
  choice: dhidi yake
  rationale: Katika muktadha wa usemi wa uadui, ‘dhidi yake’ huonyesha vizuri mwelekeo wa maneno hayo, ingawa ‘kwake’ ni tafsiri ya karibu zaidi ya kihalisi.
theological_decisions:
- issue: Iwapo βλασφημοῦντες itafsiriwe kama matusi ya kawaida au kwa neno lenye uzito wa kidini
  choice: ya kufuru
  alternative: ya kumtukana; ya kumkashifu
  rationale: Neno la Kigiriki lina wigo unaojumuisha matusi, kashfa, na kufuru. ‘Ya kufuru’ huhifadhi uzito wa usemi huo dhidi ya Yesu, huku tanbihi ikionyesha maana nyingine halali bila kuamua kimadhehebu zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakisema’ unaonyesha tendo lililoendelea; ‘maneno mengine mengi’ ni wa kawaida na unaeleweka kwa urahisi. Alama zote za tanbihi zimewekwa katika mstari mkuu.
