lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: akajitenga nao
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, hapa kwa kawaida linaeleza Yesu kujiondoa au kujitenga na wanafunzi. Usemi huu ni wa asili katika Kiswahili na unaonyesha kusogea mbali bila kudokeza kwamba alilazimishwa.
- source_word: ὡσεὶ λίθου βολήν
  choice: umbali wa kadiri ya mtu anavyoweza kurusha jiwe
  rationale: Huu ni usemi wa kukadiria umbali. Tafsiri hii inaweka wazi kipimo kinachokusudiwa na ὡσεὶ bila kukifanya kuwa sahihi kupita kiasi.
- source_word: θεὶς τὰ γόνατα
  choice: akapiga magoti
  rationale: Maana halisi ni ‘akiweka magoti,’ lakini ni nahau inayomaanisha kupiga magoti. ‘Akapiga magoti’ ni usemi wa kawaida, wazi na wenye heshima katika Kiswahili.
- source_word: προσηύχετο
  choice: na kuendelea kusali
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililokuwa likiendelea. ‘Kuendelea kusali’ huhifadhi hali hiyo kuliko ‘akasali’ peke yake.
- source_word: αὐτὸς
  choice: naye
  rationale: ‘Naye’ huhifadhi kiasi cha msisitizo wa kiwakilishi αὐτός na pia huunganisha simulizi kwa njia ya kawaida.
- source_word: καὶ
  choice: kisha / na
  rationale: Viunganishi vimetafsiriwa kwa namna inayodumisha mfululizo wa matendo kwa Kiswahili cha asili bila kuongeza maana ya kiufafanuzi.
theological_decisions:
- issue: Mkao wa sala na jinsi Kristo anavyoonyeshwa
  choice: Kusimulia moja kwa moja kwamba Yesu alijitenga, akapiga magoti, na akaendelea kusali
  alternative: Kuongeza maelezo ya kiibada au ya kimafundisho kuhusu maana ya matendo hayo
  rationale: Aya inaeleza tendo na mkao wa Yesu katika sala. Tafsiri inahifadhi uzito wa tukio bila kuingiza ufafanuzi wa kimadhehebu au hitimisho lisilotajwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kadiri ya mtu anavyoweza kurusha jiwe’ ni wazi kwa wasomaji wa kawaida; tanbihi inadumisha kwa ufupi taswira ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
