  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: sw
  text: Naye akajitenga nao kwa umbali wa kadiri ya kurusha jiwe[a]; kisha akapiga magoti[b], akaendelea kusali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umbali wa kama mrusho wa jiwe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “akiweka magoti,” yaani, “akipiga magoti.”
