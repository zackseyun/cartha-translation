  text: Lakini tazama, mkono wa yule anayenisaliti uko pamoja nami mezani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Katika muktadha huu linaonyesha tofauti yenye uzito na yale yaliyotangulia; “Lakini” ni ya kawaida na ya moja kwa moja.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Linadumisha mwito wa kuelekeza fikira kwa jambo la kushangaza au zito, kwa lugha yenye heshima na inayoeleweka.
- source_word: τοῦ παραδιδόντος με
  choice: wa yule anayenisaliti
  rationale: Kitenzi cha wakati wa sasa kinaonyesha tendo linaloendelea au linalokaribia; katika muktadha wa Yesu kukabidhiwa kwa maadui, “anayenisaliti” huwasilisha maana ya usaliti kwa uwazi.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: uko pamoja nami mezani
  rationale: Huhifadhi taswira ya mkono kuwa pamoja na Yesu kwenye meza, huku “mezani” ikiwa Kiswahili cha asili na fasaha.
theological_decisions:
- issue: Taswira ya “mkono” badala ya kumtaja mtu moja kwa moja
  choice: 'Imehifadhiwa: “mkono wa yule anayenisaliti”'
  alternative: “yule anayenisaliti ameketi pamoja nami mezani”
  rationale: Matini ya Kigiriki inasisitiza mkono kama ishara ya ukaribu wa mshiriki wa chakula; kuibadili kuwa mtu anayeketi kungeondoa taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa sentensi unahifadhi msisitizo wa matini chanzi bila kuwa mgumu.
