  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: sw
  text: Lakini ninyi ndio mlioendelea kuwa pamoja nami katika majaribu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika vishawishi vyangu” au “katika kupimwa kwangu.” Neno la Kigiriki linaweza kumaanisha kishawishi, jaribu, au kupimwa; hapa huenda linarejelea hasa shida ambazo Yesu alipitia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetangulizwa kwa mkazo; “ninyi” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: δέ
  choice: Lakini
  rationale: Huonyesha utofautishaji na maneno yaliyotangulia katika muktadha.
- source_word: οἱ διαμεμενηκότες
  choice: ndio mlioendelea kuwa
  rationale: Muundo huu unaonyesha kundi maalumu lililodumu hadi wakati wa kusema na hivyo kuhifadhi maana ya hali timilifu ya kitenzi διαμένω.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Hutoa kwa kawaida maana ya ushirika au kuandamana inayobebwa na μετά pamoja na jenitivi.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: katika majaribu yangu
  rationale: πειρασμός inaweza kumaanisha jaribu, kupimwa, au kishawishi. “Majaribu” ni pana na ya asili katika Kiswahili, na katika muktadha huu hasa huelekeza kwenye shida na vipindi vya kupimwa ambavyo Yesu alipitia.
theological_decisions:
- issue: Maana ya πειρασμοῖς inapomhusu Yesu
  choice: majaribu aliyopitia Yesu
  alternative: vishawishi alivyokabili Yesu au vipindi vyake vya kupimwa
  rationale: Muktadha unawakazia wanafunzi waliodumu pamoja na Yesu katika shida na upinzani aliokabili. Hata hivyo, tanbihi huhifadhi upana wa neno la Kigiriki, ambalo pia linaweza kutaja kishawishi au kupimwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi ndio” huhifadhi mkazo wa Ὑμεῖς, huku “mlioendelea kuwa pamoja nami” ikieleza kwa uwazi udumifu wa wanafunzi.
