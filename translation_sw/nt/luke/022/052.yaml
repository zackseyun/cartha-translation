  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: sw
  text: Lakini Yesu akawaambia makuhani wakuu, maafisa wa Hekalu, na wazee waliokuja dhidi yake, “Je, mmetoka na panga na marungu kana kwamba mnamkamata mnyang’anyi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambazi.” Neno la Kigiriki λῃστής linaweza kumaanisha mnyang’anyi, jambazi, au mhalifu wa aina ya mwasi; hapa Yesu analinganisha ujio wao wenye silaha na namna ambavyo mtu angemwendea mhalifu hatari.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofautishaji mdogo kutoka kwa tendo la kukamatwa kwenda kwenye jibu la Yesu.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: waliokuja dhidi yake
  rationale: Katika muktadha wa kukamatwa, ἐπί pamoja na hali ya accusative inaonyesha kuja kwa kusudi la uhasama, si kufika tu karibu naye.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wa ukuhani wanaotajwa kwa wingi.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: maofisa wa Hekalu
  rationale: Hurejelea maofisa wenye mamlaka ya ulinzi na usalama wa Hekalu; tafsiri hii ni wazi na ya kisasa.
- source_word: πρεσβυτέρους
  choice: wazee
  rationale: Hapa neno linamaanisha viongozi wa Kiyahudi waliotambuliwa, wala si wanaume wenye umri mkubwa tu.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: kana kwamba mnamkamata mnyang’anyi
  rationale: Muundo huo una maana ya kumwendea mtu kwa kusudi la kumkamata; ‘mnyang’anyi’ huhifadhi maana ya kawaida ya λῃστής huku swali likibaki la balagha.
- source_word: ἐξήλθατε
  choice: mmekuja
  rationale: Kauli ya hali timilifu ya Kiswahili inaonyesha tendo lililofanyika karibuni na ambalo Yesu analizungumzia wakati huo; wazo la kutoka halihitaji kutajwa kando ili sentensi iwe ya asili.
- source_word: μαχαιρῶν
  choice: panga
  rationale: Ni tafsiri ya kawaida na inayoeleweka kwa silaha zinazotajwa katika tukio la kukamatwa.
- source_word: ξύλων
  choice: marungu
  rationale: Ingawa neno kimsingi linahusu vitu vya mbao, hapa linamaanisha silaha za kupigia; ‘marungu’ hutoa maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Upana wa maana ya λῃστής
  choice: mnyang’anyi katika maandishi, pamoja na tanbihi inayoonyesha maana pana
  alternative: jambazi au mwasi mwenye kutumia silaha
  rationale: Neno la Kigiriki linaweza kumaanisha mnyang’anyi, jambazi, au mhalifu wa aina ya mwasi. Maandishi hayapaswi kuamua kimya kimya kwamba Yesu alionekana kama mwasi wa kisiasa, lakini maana hiyo inayowezekana inafaa kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umepangwa upya kidogo ili uwe wa asili kwa Kiswahili bila kupoteza mkazo wa Yesu juu ya kuja kwao wakiwa na silaha.
