id: LUK.22.3
reference: Luke 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: sw
  text: Ndipo Shetani akaingia ndani ya Yuda, aitwaye Iskariote,[a] aliyekuwa miongoni mwa wale kumi na wawili.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeitwa Iskariote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyekuwa mmoja wa wale kumi na wawili.” Kwa karibu zaidi, “aliyekuwa wa hesabu ya wale kumi na wawili.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya tafsiri huandika “Kumi na Wawili” kwa herufi kubwa ili kuonyesha kwamba hili lilikuwa kundi maalumu la mitume.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Ndipo ... akaingia
  rationale: “Ndipo” huonyesha mwendelezo wa simulizi unaobebwa na δέ, na “akaingia” hutafsiri tendo lililotokea bila kulifanya kuwa tofauti au upinzani usiotajwa.
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo jina/jina la cheo lililozoeleka katika Kiswahili cha Biblia na linaeleweka wazi.
- source_word: εἰς Ἰούδαν
  choice: ndani ya Yuda
  rationale: Kirai hiki kinadumisha maana dhahiri ya kuingia ndani ya mtu badala ya kukipunguza kitendo hicho kuwa ushawishi tu.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: aitwaye Iskariote
  rationale: Hii ni njia ya asili na yenye heshima ya kumtambulisha Yuda kwa jina aliloitwa, huku ikihifadhi kazi ya kisifa ya participio ya Kigiriki.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: aliyekuwa miongoni mwa wale kumi na wawili
  rationale: Tafsiri hii ya asili inaonyesha kuwa Yuda alikuwa sehemu ya kundi hilo linalohesabika; tanbihi inadumisha pia muundo wa karibu zaidi na neno kwa neno.
theological_decisions:
- issue: Asili ya tendo la Shetani kwa Yuda
  choice: Shetani akaingia ndani ya Yuda
  alternative: Shetani alimshawishi Yuda / Shetani alimtawala Yuda
  rationale: Kigiriki εἰσῆλθεν ... εἰς kinatumia lugha yenye nguvu ya kuingia ndani. Tafsiri haidhoofishi kauli hiyo kuwa ushawishi tu, wala haiongezi maelezo ya kimafundisho kuhusu kupagawa au wajibu wa Yuda.
- issue: Utambulisho wa kundi la wale kumi na wawili
  choice: wale kumi na wawili
  alternative: wale Kumi na Wawili
  rationale: Herufi ndogo zinafuata umbo la kawaida la maneno huku muktadha ukionyesha wazi kuwa ni kundi maalumu la wanafunzi. Uwezekano wa kutumia herufi kubwa umetajwa katika tanbihi bila kuingiza tafsiri hiyo kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo ... akaingia” ni mtiririko wa kawaida wa simulizi; “ndani ya” huhifadhi nguvu ya εἰς bila kuongeza ufafanuzi wa kimadhehebu. “Miongoni mwa” ni ya asili zaidi kuliko tafsiri ngumu ya neno kwa neno ya ἐκ τοῦ ἀριθμοῦ.
