  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: sw
  text: Naye akawaambia, “Nimetamani sana[a] kula Pasaka hii[b] pamoja nanyi kabla sijateseka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “Kwa hamu nimetamani”; Kigiriki kinatumia nomino na kitenzi vyenye mzizi mmoja ili kusisitiza sana hamu ya Yesu.
    reason: lexical_alternative
  - marker: b
    text: “Pasaka hii” hapa inaweza kumaanisha hasa mlo wa Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν πρὸς αὐτούς
  choice: Naye akawaambia
  rationale: Huwasilisha kiunganishi καί na usemi wa kawaida wa masimulizi εἶπεν πρὸς αὐτούς kwa Kiswahili cha asili bila kuongeza wazo la wakati lisilosemwa wazi.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Nimetamani sana
  rationale: Muundo wa nomino na kitenzi vyenye mzizi mmoja unatia mkazo hamu kubwa. ‘Nimetamani sana’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: τοῦτο τὸ πάσχα
  choice: Pasaka hii
  rationale: πάσχα inaweza kumaanisha sikukuu ya Pasaka au mlo wake. Kwa kuwa inatajwa pamoja na kula, mlo ndio unaolengwa katika muktadha, lakini ‘Pasaka hii’ huhifadhi upana wa neno la Kigiriki.
- source_word: φαγεῖν
  choice: kula
  rationale: Kitenzi hiki kina maana ya moja kwa moja ya kula; hakuna haja ya kukipanua.
- source_word: μεθ’ ὑμῶν
  choice: pamoja nanyi
  rationale: Hutoa kwa kawaida maana ya kuandamana au kushiriki pamoja iliyomo katika μεθ’ ὑμῶν.
- source_word: πρὸ τοῦ με παθεῖν
  choice: kabla sijateseka
  rationale: Muundo huu unaonyesha wakati unaotangulia mateso ya Yesu. Kiswahili ‘kabla sijateseka’ ni cha kawaida na hakibainishi zaidi ya chanzo aina au matukio ya mateso hayo.
theological_decisions:
- issue: Maana ya πάσχα katika muktadha
  choice: Pasaka hii
  alternative: mlo huu wa Pasaka
  rationale: Muktadha wa ‘kula’ unaelekeza kwenye mlo wa Pasaka, lakini maandishi ya Kigiriki hayana nomino tofauti ya ‘mlo.’ Tafsiri kuu inahifadhi usemi mpana, na tanbihi inaeleza uwezekano wa maana mahususi.
- issue: Nguvu ya msisitizo katika Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Nimetamani sana
  alternative: Kwa hamu nimetama­ni; Nimetamani kwa hamu kubwa
  rationale: Kigiriki kinatumia muundo wa msisitizo unaofanana na usemi wa Kisemiti. Tafsiri ya Kiswahili inabeba nguvu ya hamu ya Yesu bila kuiga muundo kwa namna isiyo ya kawaida wala kuongeza maana ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. ‘Naye akawaambia’ kinaendeleza mtiririko wa masimulizi; ‘pamoja nanyi’ ni cha asili katika sajili ya kibiblia bila kuwa cha kizamani. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
