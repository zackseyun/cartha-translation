lexical_decisions:
- source_word: ἐχάρησαν
  choice: wakafurahi
  rationale: Kitenzi hiki kinaeleza mwitikio wao wa furaha. “Wakafurahi” ni Kiswahili cha kawaida na chenye hadhi, na kinahifadhi uzito wa mwitikio huo bila kuongeza wazo la kushangilia.
- source_word: συνέθεντο
  choice: wakakubaliana
  rationale: Katika muktadha huu, kitenzi cha kati kina maana ya kufikia makubaliano. “Wakakubaliana” ni usemi wa asili unaoonyesha pande husika kufikia makubaliano, badala ya maana finyu zaidi ya kuahidi.
- source_word: αὐτῷ
  choice: kumpa
  rationale: Kiwakilishi cha yambwa katika “kumpa” kinawakilisha αὐτῷ kwa njia ya kawaida ya Kiswahili; mhusika anayerejelewa anaeleweka kutokana na muktadha.
- source_word: ἀργύριον
  choice: fedha
  rationale: “Fedha” ni chaguo linalofaa kwa kuwa katika Kiswahili linaweza kumaanisha pesa na pia metali ya fedha, hivyo linahifadhi kwa kiasi kikubwa upana wa neno la Kigiriki katika muktadha wa malipo.
- source_word: δοῦναι
  choice: kumpa
  rationale: Kitenzi-jina kinaeleza jambo walilokubaliana kufanya. “Kumpa” huhifadhi maana ya msingi ya kutoa bila kufasiri zaidi kuwa ni kulipa.
