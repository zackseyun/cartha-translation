  text: Nao wakafurahi na wakakubaliana kumpa fedha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “pesa.” Neno la Kigiriki linaweza kumaanisha metali ya fedha au, kwa maana pana zaidi, pesa.'
