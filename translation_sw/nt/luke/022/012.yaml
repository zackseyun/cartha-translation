  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: sw
  text: Naye atawaonyesha chumba kikubwa cha juu kilichoandaliwa[a]. Andaeni humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chumba kikubwa cha juu kilicho tayari,” au “chumba kikubwa cha juu ambamo samani au matandiko yamepangwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Naye
  rationale: Muunganiko wa καί na ἐκεῖνος unaendeleza maelekezo na kumrejelea mwenye nyumba aliyetajwa; “Naye” ni ya kawaida na wazi katika Kiswahili.
- source_word: ὑμῖν δείξει
  choice: atawaonyesha
  rationale: Kitenzi cha wakati ujao pamoja na yambwa ya wingi kinatafsiriwa kwa kawaida kuwa “atawaonyesha.”
- source_word: ἀνάγαιον
  choice: chumba cha juu
  rationale: Neno hilo humaanisha chumba kilicho katika ghorofa ya juu; tafsiri hii haiongezi dhana ya kuwa chumba cha wageni.
- source_word: μέγα
  choice: kikubwa
  rationale: Hueleza ukubwa wa chumba kwa lugha ya moja kwa moja na ya kawaida.
- source_word: ἐστρωμένον
  choice: kilichoandaliwa
  rationale: Kauli timilifu tendwa inaonyesha hali iliyokamilika ya kutandikwa au kupangwa tayari. “Kilichoandaliwa” ni wazi, huku tanbihi ikihifadhi uwezekano wa samani au matandiko kuwa yamewekwa.
- source_word: ἐκεῖ
  choice: humo
  rationale: Katika muktadha wa chumba kilichotajwa, “humo” huwasilisha kwa kawaida maana ya kuandaa ndani ya mahali hapo.
- source_word: ἑτοιμάσατε
  choice: Andaeni
  rationale: Amri ya wingi imehifadhiwa moja kwa moja na humaanisha kufanya maandalizi yanayohitajika.
