  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: sw
  text: Akawaambia, “Kwa nini mmelala? Amkeni, ombeni ili msiingie katika jaribu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: mmelala
  rationale: Kitenzi hiki kinamaanisha kuwa usingizini au kulala; umbo la Kiswahili linaeleza hali yao kwa njia ya kawaida.
- source_word: ἀναστάντες
  choice: Amkeni
  rationale: Katika muktadha wa watu waliolala, ‘Amkeni’ huwasilisha kwa kawaida agizo la kuinuka kutoka usingizini.
- source_word: προσεύχεσθε
  choice: mwombe
  rationale: Hili ni agizo la kuendelea au kujishughulisha na sala; ‘mwombe’ ni usemi wa kawaida na wenye heshima.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: msiingie katika jaribu
  rationale: Inadumisha sitiari ya kuingia na pia maana pana ya πειρασμός, ambayo inaweza kuwa jaribu au hali ya kujaribiwa.
theological_decisions:
- issue: Maana ya πειρασμός
  choice: jaribu
  alternative: majaribu; kushawishiwa kutenda dhambi
  rationale: ‘Jaribu’ huhifadhi upana wa neno la Kigiriki bila kulifunga kwa maana ya ushawishi wa dhambi pekee.
- issue: Nguvu ya ἵνα μή
  choice: ili msiingie
  alternative: msije mkaingia
  rationale: ‘Ili msiingie’ huonyesha kusudi lililo wazi katika sentensi bila kuamua zaidi jinsi sala inavyohusiana na jaribu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na mkazo wa agizo vimehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
