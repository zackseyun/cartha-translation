  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: sw
  text: Sikukuu ya Mikate Isiyotiwa Chachu[a], iitwayo Pasaka, ilikuwa ikikaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pasaka na Sikukuu ya Mikate Isiyotiwa Chachu zilikuwa maadhimisho yaliyohusiana kwa karibu; katika matumizi ya Kiyahudi, zingeweza kutajwa pamoja au kwa majina yaliyotumiwa kwa maana inayopishana.
    reason: Maelezo ya kitamaduni kuhusu matumizi yanayoingiliana ya majina ya sikukuu hizo.
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: ilikuwa ikikaribia
  rationale: Wakati usiotimilika unaonyesha kwamba sikukuu ilikuwa katika hali ya kuendelea kukaribia; muundo huu ni wa asili katika Kiswahili na unahifadhi hali hiyo.
- source_word: δὲ
  choice: haikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Kiswahili hakihitaji neno la mwanzo katika sentensi hii, na kuliacha kunatoa mtiririko wa kawaida bila kuingiza wazo la wakati au upinzani lisilosisitizwa katika chanzo.
- source_word: ἑορτὴ
  choice: Sikukuu
  rationale: Neno hili humaanisha sherehe au sikukuu ya kidini; “Sikukuu” ni neno la kawaida, lenye heshima, na linalofaa hapa.
- source_word: τῶν ἀζύμων
  choice: ya Mikate Isiyotiwa Chachu
  rationale: Kirai hiki ni jina la sikukuu ya Kiyahudi. Tafsiri hii inaeleweka wazi kwa wasomaji wa Kiswahili na inaonyesha mikate iliyotengenezwa bila chachu.
- source_word: ἡ λεγομένη
  choice: iitwayo
  rationale: Muundo huu wa ufupisho unaonyesha jina jingine la sikukuu huku ukihifadhi nguvu ya maelezo ya kirai cha Kigiriki.
- source_word: Πάσχα
  choice: Pasaka
  rationale: “Pasaka” ndilo jina la kawaida la Kiswahili kwa sikukuu hii ya Kiyahudi na linafaa kuliko unukuzi mpya usiozoeleka.
theological_decisions:
- issue: Uhusiano kati ya Sikukuu ya Mikate Isiyotiwa Chachu na Pasaka
  choice: 'Maneno yote mawili yamewasilishwa kama utambulisho wa maelezo wa kipindi cha sikukuu: “Sikukuu ya Mikate Isiyotiwa Chachu, iitwayo Pasaka.”'
  alternative: Kuyatenganisha Pasaka na Sikukuu ya Mikate Isiyotiwa Chachu kwa namna kali ili kusisitiza tofauti ya mpangilio wa nyakati.
  rationale: Kauli ya Luka inayatambulisha kwa maelezo kutoka kwa msimuliaji, ikilingana na matumizi ya Kiyahudi ya karne ya kwanza ambapo majina hayo yangeweza kuingiliana kwa kipindi kipana cha sikukuu. Tafsiri haifuti tofauti ya kihistoria wala kuilazimisha ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ilikuwa ikikaribia” huhifadhi hali ya tendo linaloendelea bila kuwa kizito; “iitwayo” ni fupi na ya kawaida katika maandishi rasmi. Alama ya tanbihi [a] imewekwa mara baada ya jina la sikukuu linalohitaji ufafanuzi.
