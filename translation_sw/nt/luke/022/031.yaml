  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: sw
  text: Simoni, Simoni, tazama, Shetani amedai awapate ninyi nyote, ili awapepete kama ngano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: tazama!
  rationale: Kitenzi hiki cha kuvuta fikira kinadumisha msisitizo wa onyo kwa lugha ya Kiswahili yenye hadhi na inayoeleweka.
- source_word: ὁ Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mhusika anayetajwa katika Kigiriki.
- source_word: ἐξῃτήσατο
  choice: amedai awapate
  rationale: Huwasilisha dai lenye nguvu la kutaka watu hao wawekwe chini ya mamlaka yake kwa kusudi linalofuata, bila kuongeza wazi ni nani anayetakiwa kutoa ruhusa.
- source_word: ὑμᾶς
  choice: ninyi nyote
  rationale: Kiwakilishi cha Kigiriki ni cha wingi; ‘nyote’ huzuia msomaji kukidhania kuwa kinamhusu Simoni peke yake.
- source_word: τοῦ σινιάσαι
  choice: ili awapepete
  rationale: Hutoa kusudi la dai na kuhifadhi taswira ya kupepeta nafaka.
- source_word: ὡς τὸν σῖτον
  choice: kama ngano
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tashbihi ya Kigiriki.
theological_decisions:
- issue: Je, dai la Shetani linamaanisha kuomba ruhusa au kudai kumiliki?
  choice: amedai awapate
  alternative: ameomba ruhusa awapate
  rationale: Kitenzi ἐξαιτέομαι hapa kinaweza kubeba wazo la kudai kwa nguvu; maandishi hayamtaji wazi anayetoa ruhusa, kwa hiyo tafsiri haiongezi maelezo hayo.
- issue: Wanaolengwa na Shetani
  choice: ninyi nyote
  alternative: wewe
  rationale: ὑμᾶς ni wingi, ingawa Yesu anamwita Simoni moja kwa moja; tafsiri inadumisha tofauti hiyo muhimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa jina ‘Simoni, Simoni’ kumehifadhiwa kwa msisitizo; ‘tazama!’ ni ishara ya kuvuta fikira, na ‘ninyi nyote’ huonyesha wazi wingi wa kiwakilishi cha asili.
