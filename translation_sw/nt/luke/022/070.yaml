  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: sw
  text: Ndipo wote wakasema, “Basi, wewe ni Mwana wa Mungu?” Naye akawaambia, “Ninyi mnasema kwamba mimi ndiye.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa Kiswahili cha kimazungumzo zaidi, “Ndivyo mnavyosema” au “Ni kama mnavyosema.” Jibu la Yesu lina maana ya kukubali, lakini Kigiriki kinasema kihalisi zaidi, “Ninyi mnasema kwamba mimi ndiye.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinarejelea kundi zima; “wote” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: basi
  rationale: Katika swali hili neno hilo linaonyesha hitimisho linalotokana na mazungumzo yaliyotangulia; “basi” linafaa kwa mtiririko wa Kiswahili.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hili ni jina la cheo la Kikristo; muundo rasmi “Mwana wa Mungu” unahifadhi uzito wake katika swali.
- source_word: ἔφη
  choice: akawaambia
  rationale: Kitenzi hiki ni cha kusema; kwa kuwa walengwa wametajwa wazi katika πρὸς αὐτούς, “akawaambia” ni Kiswahili cha asili na sahihi katika muktadha.
- source_word: Ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki na kina msisitizo; “Ninyi” huhifadhi msisitizo bila kuongeza neno zito kama “wenyewe.”
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati wa sasa na wingi vinawakilishwa moja kwa moja na “mnasema.”
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι linaingiza maudhui ya wanayosema, hivyo “kwamba” huhifadhi sintaksia na kutatua kwa uchache.
- source_word: ἐγώ εἰμι
  choice: mimi ndiye
  rationale: Katika Kiswahili, “mimi ndiye” ni njia ya asili ya kurejelea kiarifu kilichotangulia, yaani Mwana wa Mungu, huku ikihifadhi ufupi na msisitizo wa ἐγώ.
theological_decisions:
- issue: Ikiwa jibu la Yesu litafsiriwe kama uthibitisho wa moja kwa moja au kama jibu lisilo la moja kwa moja
  choice: Ninyi mnasema kwamba mimi ndiye
  alternative: Ndivyo mnavyosema; Ni kama mnavyosema
  rationale: Muundo wa Kigiriki unarudisha maneno kwa waulizaji na katika muktadha unaweza kufanya kazi kama uthibitisho. Tafsiri kuu huhifadhi muundo huo na mvutano wake badala ya kuufanya uwe kauli ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndipo” linaendeleza simulizi, “basi” linaonyesha hitimisho katika swali, na “mimi ndiye” linaepuka usemi usio wa kawaida “mimi niko” katika sentensi hii.
