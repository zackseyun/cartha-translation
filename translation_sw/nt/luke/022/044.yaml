base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: sw
  text: Naye, akiwa katika uchungu mkuu, aliomba kwa dhati zaidi;[a][b] jasho lake likawa kama matone ya damu yakidondoka ardhini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa bidii zaidi” au “kwa moyo zaidi.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya miswada haina Luka 22:43–44, ilhali mingine ina mistari hiyo. SBLGNT imeichapisha katika mabano kuonyesha kutokuwa na uhakika kwa maandishi.
    reason: textual_variant
  - marker: c
    text: 'Kigiriki: “kama matone/mabonge ya damu.” Huu ni ulinganisho; haisemi moja kwa moja kwamba jasho lenyewe lilikuwa damu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: akiwa katika dhiki kubwa
  rationale: Muundo huu unaonyesha hali aliyokuwa nayo Yesu. ‘Dhiki kubwa’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha maumivu na pambano kali bila kuingiza maelezo ya kitabibu.
- source_word: ἐκτενέστερον
  choice: alizidi ... kwa bidii
  rationale: Kielezi cha kulinganisha kinaonyesha kuongezeka kwa nguvu au juhudi. ‘Alizidi kusali kwa bidii’ huwasilisha nguvu hiyo ya kulinganisha kwa Kiswahili cha asili.
- source_word: προσηύχετο
  choice: alisali
  rationale: Kitenzi cha wakati usiotimilika kinaeleza tendo lililoendelea; pamoja na ‘alizidi,’ Kiswahili hiki huonyesha kwamba sala ilikuwa ikiendelea na kuongezeka kwa bidii.
- source_word: ἐγένετο
  choice: likawa
  rationale: Huhifadhi wazo la kufikia au kuwa katika hali iliyoelezwa, badala ya kutumia kiunganishi kisicho na nguvu.
- source_word: ἱδρὼς
  choice: jasho
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ὡσεὶ
  choice: kama
  rationale: Huhifadhi wazi ulinganisho wa Kigiriki bila kudai moja kwa moja kwamba jasho lenyewe lilikuwa damu.
- source_word: θρόμβοι αἵματος
  choice: matone ya damu
  rationale: ‘Matone ya damu’ ni lugha ya kawaida inayoendana na picha ya kuanguka chini; neno θρόμβοι linaweza pia kumaanisha mabonge, jambo linaloelezwa katika tanbihi.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: yakianguka chini
  rationale: Huwasilisha kwa kawaida mwendo wa kushuka hadi ardhini bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Asili ya ulinganisho katika ‘kama matone ya damu’
  choice: 'Kudumisha tashbihi: jasho lake lilikuwa kama matone ya damu.'
  alternative: Kusema kwamba jasho lake lilikuwa damu halisi.
  rationale: Neno ὡσεὶ linaonyesha ulinganisho, si lazima utambulisho. Tafsiri haipaswi kuamua dai la kitabibu au la kimiujiza ambalo Kigiriki hakitamki moja kwa moja.
- issue: Kutokuwa na uhakika kwa maandishi ya Luka 22:43–44
  choice: Kujumuisha mstari kwa tanbihi inayoeleza ushahidi wa miswada.
  alternative: Kuondoa mstari au kuuchapisha bila kuonyesha tofauti ya miswada.
  rationale: SBLGNT inauchapisha kifungu hiki kwa alama za mabano kwa sababu baadhi ya miswada inakikosa. Tanbihi huhifadhi uwazi kuhusu ushahidi wa maandishi bila kuamua kimya kimya.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi umewekwa kwenye vifungu vinavyohusika: mbadala wa ἐκτενέστερον baada ya ‘kwa bidii,’ tofauti ya miswada baada ya sehemu ya kwanza ya mstari, na ufafanuzi wa tashbihi baada ya ‘chini.’'
