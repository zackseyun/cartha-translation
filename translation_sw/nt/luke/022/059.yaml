  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: sw
  text: Baada ya kupita karibu saa moja, mtu mwingine[a] aliendelea kusisitiza, akisema, “Kwa kweli, huyu pia alikuwa pamoja naye, kwa maana yeye pia ni Mgalilaya.”
  philosophy: optimal-equivalence
  footnotes:
