    text: Au “mwanamume mwingine.” Kirai cha Kigiriki humaanisha “mwingine fulani”; maumbo yake ya kisarufi ni ya kiume, ingawa mtu huyo hatambulishwi kwa jina.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Baada ya muda wa karibu saa moja kupita
  rationale: Kirai huru cha hali ya wakati (genitive absolute) kinaonyesha kupita kwa takriban saa moja; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha ukadiriaji wa ὡσεὶ.
- source_word: ἄλλος τις
  choice: mtu mwingine
  rationale: Kirai cha Kigiriki hakibainishi jinsia moja kwa moja. “Mtu mwingine” kinahifadhi hali hiyo ya kutobainisha, ingawa muktadha unaweza kudokeza msemaji wa kiume.
- source_word: διϊσχυρίζετο
  choice: akasisitiza
  rationale: Kitenzi hiki huonyesha dai lenye mkazo; “akasisitiza” kinawasilisha nguvu ya kauli kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: Ἐπ’ ἀληθείας
  choice: Kwa kweli
  rationale: Hiki ni kirai cha kusisitiza ukweli wa dai. “Kwa kweli” ni cha asili na chenye uzito unaofaa.
- source_word: οὗτος
  choice: huyu
  rationale: Kiwakilishi kionyeshi kinamwelekeza Petro moja kwa moja na kudumisha sauti ya kumtambulisha au kumshtaki.
- source_word: μετ’ αὐτοῦ ἦν
  choice: alikuwa pamoja naye
  rationale: Tafsiri ya moja kwa moja inayohifadhi dai la kuwa katika ushirika wake bila kulifafanua kupita kiasi kuwa uanafunzi.
- source_word: καὶ γὰρ
  choice: kwa maana yeye pia
  rationale: “Kwa maana” huonyesha sababu inayotolewa, na “pia” huhifadhi maana ya nyongeza ya καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: ni Mgalilaya
  rationale: Inamtambulisha Petro kwa asili yake ya eneo kwa njia fupi, ya moja kwa moja, na ya kawaida katika Kiswahili.
