translation:
  language: sw
  text: Nami ninawawekea ufalme, kama vile Baba yangu alivyonitengea mimi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami ninafanya agano pamoja nanyi la kuwapa ufalme, kama vile Baba yangu alivyofanya agano pamoja nami.” Kitenzi cha Kigiriki kinaweza kumaanisha kufanya agano, kupanga, au kumgawia mtu kitu kwa mamlaka.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muungano wa καί + ἐγώ unaendeleza wazo la yaliyotangulia huku ukisisitiza mhusika; “Nami” ni Kiswahili cha kawaida kinachohifadhi yote mawili.
- source_word: διατίθεμαι
  choice: ninawakabidhi
  rationale: Kitenzi kinaweza kumaanisha kupanga, kufanya agano, au kumpa mtu kitu kwa mamlaka. Katika muktadha huu, “kuwakabidhi” huonyesha kukabidhi ufalme au mamlaka bila kulazimisha maana ya kiagano katika matini kuu.
- source_word: ὑμῖν
  choice: -wa- (ninawakabidhi)
  rationale: Kiambishi cha yambwa “-wa-” kinaonyesha kwamba wanafunzi ndio wapokeaji; muundo huu ni wa asili zaidi kuliko “ninakabidhi kwenu” katika Kiswahili.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho wa moja kwa moja kati ya tendo la Yesu na tendo la Baba.
- source_word: διέθετό
  choice: alivyonikabidhi
  rationale: Kurudia mzizi “kabidhi” kunahifadhi ulinganifu wa vitenzi viwili vya Kigiriki; wakati uliopita unaonyesha tendo la Baba kwa Yesu.
- source_word: μοι
  choice: -ni- (alivyonikabidhi) pamoja na “mimi”
  rationale: Kiambishi “-ni-” humtambulisha Yesu kama mpokeaji, na “mimi” huhifadhi msisitizo na uwazi wa ulinganifu.
- source_word: ὁ πατήρ μου
  choice: Baba yangu
  rationale: Ni tafsiri ya kawaida na ya heshima inayohifadhi uhusiano wa mwana na Baba.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Katika muktadha wa kula mezani na kuketi kwenye viti vya enzi katika mstari unaofuata, “ufalme” hufaa kuliko “utawala” pekee, huku neno la Kiswahili likiweza pia kuhusisha mamlaka ya kifalme.
theological_decisions:
- issue: Ikiwa διατίθεμαι itafsiriwe kwa lugha ya wazi ya agano
  choice: ninawakabidhi
  alternative: nafanya nanyi agano la kuwapa ufalme / ninawawekea kwa agano ufalme
  rationale: Kitenzi kinaweza kuwa na maana ya kiagano, lakini sintaksia yenye βασιλείαν na ulinganifu na tendo la Baba pia inaunga mkono maana pana ya kukabidhi au kutoa kwa mamlaka. Matini kuu haifungi maana kwenye mfumo mmoja wa kitheolojia; uwezekano wa kiagano umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetanguliza “ufalme” karibu na kitenzi cha kwanza kwa uwazi wa Kiswahili, huku kurudiwa kwa “kabidhi” kukihifadhi kifani cha Kigiriki. Alama ya tanbihi imewekwa baada ya sentensi nzima kwa kuwa tanbihi inahusu vitenzi vyote viwili.
