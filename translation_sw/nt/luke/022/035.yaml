  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: sw
  text: Akawaambia, “Nilipowatuma bila mfuko wa fedha, wala mkoba wa safari,[a] wala viatu, je, mlipungukiwa na kitu chochote?” Wakasema, “Hapana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkoba wa mahitaji ya safarini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: bila
  rationale: Huonyesha kutokuwa na kitu; “bila” ni ya kawaida na wazi katika Kiswahili.
- source_word: βαλλαντίου
  choice: mfuko wa fedha
  rationale: Ni mfuko wa kubebea fedha; tafsiri hii ni wazi na halisi kwa msomaji wa sasa.
- source_word: πήρας
  choice: mkoba wa safari
  rationale: Ni mfuko au kibebeo cha mahitaji ya safarini; “mkoba wa safari” huonyesha kazi yake bila kuibana kwa umbo maalumu.
- source_word: ὑποδημάτων
  choice: viatu
  rationale: Neno la Kigiriki linaweza kumaanisha viatu au kandambili; “viatu” ni neno pana, la asili, na linaepuka kuongeza umaalumu usiolazimishwa na umbo la neno.
- source_word: μή τινος ὑστερήσατε
  choice: je, mlipungukiwa na kitu chochote?
  rationale: “Kupungukiwa” hudumisha wazo la kukosa kitu kilichohitajika, huku swali likibaki la kawaida na likielekea kutarajia jibu hasi.
- source_word: Οὐθενός
  choice: Hapana
  rationale: Katika Kiswahili, “Hapana” ni jibu fupi na la kawaida kwa swali hili, likimaanisha kwamba hawakupungukiwa na chochote.
- source_word: ἀπέστειλα
  choice: nilipowatuma
  rationale: Muktadha wa utume tayari unaonyesha kutumwa kwenda kutekeleza kazi; “nilipowatuma” ni fasaha bila kuongeza maneno yasiyohitajika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali na jibu umewekwa mfupi kama katika Kigiriki; kihusishi cha Kigiriki kimetolewa kwa mfululizo wa “bila ... wala ... wala” wa kawaida katika Kiswahili.
