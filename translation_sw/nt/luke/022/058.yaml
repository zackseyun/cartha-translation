  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: sw
  text: Baada ya muda mfupi, mtu mwingine alimwona na kusema, “Wewe pia ni mmoja wao.” Lakini Petro akasema, “Mtu, mimi si.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mimi si.” Kigiriki kinaacha “mmoja wao” idokezwe kutokana na shtaka lililotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Baada ya muda mfupi
  rationale: Ni usemi wa wakati unaoonyesha kwamba muda mfupi ulipita; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἕτερος
  choice: mtu mwingine
  rationale: Nomino imeelezwa kwa ‘mtu’ ili kurejelea mhusika mwingine kwa uwazi bila kudai zaidi ya muktadha.
- source_word: ἰδὼν αὐτὸν
  choice: alimwona
  rationale: Kirai cha kishirikishi cha aoristi kinaweza kutolewa kwa kitenzi cha masimulizi kinachoambatana na tendo la kusema; Kiswahili hiki ni cha asili na kifupi.
- source_word: ἔφη
  choice: alisema / akasema
  rationale: Katika masimulizi, φημί ni utangulizi wa kawaida wa usemi; tofauti ya ‘alisema’ na ‘akasema’ inafuata mtiririko wa sentensi za Kiswahili.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Wewe pia ni mmoja wao
  rationale: ἐξ αὐτῶν hapa inaonyesha kuwa sehemu ya kundi; ‘mmoja wao’ ni usemi wa kawaida wa Kiswahili unaohifadhi shtaka hilo.
- source_word: Ἄνθρωπε
  choice: Bwana
  rationale: Ingawa maana ya msingi ni ‘mtu,’ katika mwito wa moja kwa moja wa Kiswahili ‘Bwana’ hutoa anuani ya mtu mzima kwa njia ya asili bila kuifanya kuwa jina la cheo cha kidini.
- source_word: οὐκ εἰμί
  choice: mimi si mmoja wao
  rationale: Kigiriki kinasema kwa mkato ‘mimi si,’ huku kijalizo kikieleweka kutoka shtaka lililotangulia. Kiswahili huhitaji kijalizo ili sentensi isikike kamili; tanbihi inahifadhi taarifa kuhusu mkato wa Kigiriki.
