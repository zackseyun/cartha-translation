translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mazungumzo yamewekwa kwa lugha ya kawaida na ya moja kwa moja; mkato wa Kigiriki katika jibu la Petro umeelezwa katika tanbihi kwa kuwa haujitokezi kwa urahisi katika Kiswahili.
