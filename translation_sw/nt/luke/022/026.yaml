  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: sw
  text: Lakini isiwe hivyo kwenu[a]. Badala yake, aliye mkuu miongoni mwenu awe kama aliye mdogo[b], na anayeongoza awe kama anayetumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini si hivyo kwenu.” Kauli ya Kigiriki imefupishwa na inawatofautisha kwa mkazo wanafunzi wa Yesu na mwenendo wa kutafuta hadhi ulioelezwa kabla yake.
    reason: alternative_reading
  - marker: b
    text: “Aliye mdogo” hapa humaanisha mtu aliye chini kwa umri na, katika utamaduni huo, kwa hadhi ya kijamii; si tofauti ya umri tu.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Lakini isiwe hivyo kwenu
  rationale: Kauli ya Kigiriki imefupishwa na inaweka tofauti kali kati ya wanafunzi wa Yesu na mwenendo wa kutafuta hadhi uliotajwa katika mstari uliotangulia. Kiswahili hiki kinaendeleza uzito wa katazo bila kulipanua kupita kiasi.
- source_word: ἀλλ’
  choice: Badala yake
  rationale: Inaonyesha kwa Kiswahili cha kawaida badiliko lenye mkazo kutoka katika katazo kwenda katika agizo chanya.
- source_word: ὁ μείζων
  choice: aliye mkuu
  rationale: Mείζων ni umbo la kulinganisha na hapa humaanisha mwenye ukubwa au hadhi ya juu, si lazima aliye mkuu kuliko wote.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Ni usemi wa kawaida unaoonyesha nafasi ya mtu ndani ya jumuiya.
- source_word: γινέσθω
  choice: na awe
  rationale: Muundo huu wa Kiswahili unaonyesha agizo la kuchukua hali au mwenendo fulani kwa njia ya asili, bila kufanya sentensi kuwa nzito.
- source_word: ὡς ὁ νεώτερος
  choice: kama aliye mdogo
  rationale: Nεώτερος ni umbo la kulinganisha, yaani ‘aliye mdogo,’ na katika mazingira haya pia hudokeza mtu wa hadhi ya chini kijamii. Tanbihi inahifadhi maana hiyo ya kitamaduni.
- source_word: ὁ ἡγούμενος
  choice: anayeongoza
  rationale: Huhifadhi hali ya kitendo ya kirai cha Kigiriki na huepuka kuingiza dhana rasmi ya cheo au taasisi.
- source_word: ὡς ὁ διακονῶν
  choice: kama anayetumikia
  rationale: Huhifadhi maana hai ya mtu anayewahudumia wengine badala ya kutumia jina la cheo au huduma ya kitaasisi.
theological_decisions:
- issue: Maana ya agizo la Yesu kuhusu hadhi na uongozi
  choice: Mstari umetafsiriwa kama kugeuzwa kwa viwango vya kijamii miongoni mwa wanafunzi, ambapo ukuu na uongozi huonyeshwa kwa unyenyekevu na kuwatumikia wengine.
  alternative: Kutumia lugha yenye mkazo zaidi kuhusu vyeo rasmi, mamlaka au utawala.
  rationale: Kigiriki kinamlinganisha ‘aliye mkuu’ na ‘aliye mdogo,’ na ‘anayeongoza’ na ‘anayetumikia.’ Tafsiri inahifadhi wito wa unyenyekevu bila kuingiza miundo ya baadaye ya kanisa wala kuondoa mvutano wa kijamii uliomo katika maneno hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku ikihifadhi ulinganifu wa Kigiriki kati ya mkuu na mdogo, na kati ya anayeongoza na anayetumikia.
