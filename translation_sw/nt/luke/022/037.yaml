  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: sw
  text: 'Kwa maana ninawaambia kwamba jambo hili lililoandikwa lazima litimizwe kwangu: “Naye alihesabiwa pamoja na watu wasiofuata sheria.”[a] Kwa maana mambo yanayonihusu yanafikia mwisho.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “Naye alihesabiwa miongoni mwa wakosaji” (Isa. 53:12).
    reason: alternative_reading
  - marker: b
    text: Au “mambo yanayonihusu yanafikia utimilifu” au “yanakamilika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: ‘Ninawaambia’ ni Kiswahili cha kawaida kwa λέγω ὑμῖν, huku ‘kwa maana’ ikihifadhi uhusiano wa maelezo unaoletwa na γάρ.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: jambo hili lililoandikwa
  rationale: Huhifadhi kionyeshi pamoja na hali ya jambo kuwa limeandikwa, bila kuongeza neno ‘Andiko’ ambalo halitajwi wazi katika Kigiriki.
- source_word: δεῖ τελεσθῆναι
  choice: lazima litimizwe
  rationale: ‘Lazima’ huhifadhi nguvu ya ulazima katika δεῖ, na ‘litimizwe’ linafaa kwa kutimia kwa maneno yaliyoandikwa.
- source_word: ἐν ἐμοί
  choice: ndani yangu
  rationale: Hufuata kwa ukaribu ἐν ἐμοί na kudumisha uwezekano wa maana ya kutimizwa katika Yesu mwenyewe au katika yanayompata.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: Naye alihesabiwa pamoja na waasi wa sheria
  rationale: ‘Waasi wa sheria’ huwasilisha ἀνόμων kwa lugha inayoeleweka, na ‘alihesabiwa pamoja na’ huhifadhi maana ya ἐλογίσθη μετά.
- source_word: τὸ περὶ ἐμοῦ
  choice: mambo yanayonihusu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha mambo yote yanayomhusu Yesu bila kuyafafanua kupita kiasi.
- source_word: τέλος ἔχει
  choice: yanafikia utimilifu wake
  rationale: Huwasilisha wazo la kufikia mwisho au kukamilika katika muktadha huu, bila kulifanya kuwa tamko lisilo na utata kabisa.
theological_decisions:
- issue: Namna ya kutafsiri dondoo la Isaya 53:12
  choice: alihesabiwa pamoja na waasi wa sheria
  alternative: alihesabiwa miongoni mwa wakosaji
  rationale: Chaguo kuu linafuata kwa karibu maana ya ἀνόμων, huku chaguo la kimapokeo zaidi likihifadhiwa katika tanbihi kwa ajili ya mwangwi wa Isaya 53:12.
- issue: Maana ya τέλος ἔχει
  choice: yanafikia utimilifu wake
  alternative: yanafikia mwisho wake / yanakamilika
  rationale: Kirai kinaweza kuonyesha kufikia mwisho au kufikia ukamilifu. Tafsiri kuu inadokeza kilele cha mambo yanayomhusu Yesu, na tanbihi inahifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa dondoo na utata wa mwisho/utimilifu umehifadhiwa kwa maandishi makuu na tanbihi.
