  rationale: Kinaonyesha utofauti na kauli inayotangulia.
- source_word: ἐρωτήσω
  choice: nikiwauliza
  rationale: “Kuwauliza” ni lugha ya kawaida na haiongezi wazo la kuwahoji kwa uhasama ambalo halisemwi wazi katika kitenzi cha Kigiriki.
- source_word: οὐ μὴ
  choice: hakika hamta-
  rationale: Muundo huu unahifadhi msisitizo mkubwa wa ukanushaji wa Kigiriki kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἀποκριθῆτε
  choice: n(j)ibu
  rationale: “Kujibu” ndilo neno la moja kwa moja na la kawaida katika muktadha huu wa mazungumzo ya kisheria.
