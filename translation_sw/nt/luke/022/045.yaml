  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: sw
  text: Alipoinuka baada ya kusali, aliwaendea wanafunzi, akawakuta wamelala kutokana na huzuni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Alipoinuka baada ya kusali
  rationale: Muundo huu unaonyesha kwamba kuinuka kulifuata kusali, huku ukihifadhi maana ya ἀναστὰς bila kutumia Kiswahili kisicho cha kawaida kama ‘kuinuka kutoka katika sala.’
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: aliwaendea wanafunzi
  rationale: Kitenzi ‘aliwaendea’ kinaonyesha mwendo kuelekea kwa wanafunzi na kuwasilisha mfuatano wa matendo kwa Kiswahili cha kawaida.
- source_word: μαθητὰς
  choice: wanafunzi
  rationale: ‘Wanafunzi’ ndilo neno la kawaida na sahihi katika Injili kwa μαθηταί.
- source_word: εὗρεν
  choice: akawakuta
  rationale: ‘Akawakuta’ linaonyesha kwamba aliwakuta wakiwa katika hali iliyotajwa na pia linaunganisha tendo hili kwa kawaida na tendo lililotangulia.
- source_word: κοιμωμένους αὐτούς
  choice: wamelala
  rationale: Huwasilisha hali au tendo lililokuwa likiendelea Yesu alipowakuta.
- source_word: ἀπὸ τῆς λύπης
  choice: kutokana na huzuni
  rationale: Hapa ἀπό inaonyesha sababu. ‘Kutokana na huzuni’ ni ya asili katika Kiswahili na inahifadhi uhusiano huo wa kisababishi bila kuongeza maelezo ya kisaikolojia.
theological_decisions:
- issue: Sababu ya wanafunzi kulala
  choice: Kulala kwao kunaelezwa kuwa kulitokana na huzuni.
  alternative: Walikuwa wamelala huku wakiwa na huzuni, bila kusisitiza wazi uhusiano wa kisababishi.
  rationale: Katika muktadha huu, ἀπὸ τῆς λύπης kwa kawaida huonyesha sababu. Tafsiri haisemi zaidi ya hayo kuhusu jinsi huzuni ilivyosababisha usingizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia mfuatano wa vitenzi unaosikika kwa kawaida na unaohifadhi mpangilio wa matendo katika Kigiriki.
