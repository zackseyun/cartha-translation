  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: sw
  text: Lakini tangu sasa Mwana wa Adamu atakuwa ameketi upande wa kuume wa nguvu za Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hali iliyotajwa inaanza kushika kuanzia wakati huu na kuendelea.
- source_word: δὲ
  choice: Lakini
  rationale: Katika muktadha huu δέ inaleta badiliko lenye utofautishaji katika jibu la Yesu.
- source_word: ἔσται … καθήμενος
  choice: atakuwa ameketi
  rationale: Muundo huu unaonyesha hali ya wakati ujao ya kuketi katika nafasi ya heshima na mamlaka, bila kuifanya kuwa tendo la kuanza kuketi tu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja la Yesu lenye mwangwi wa maandiko ya kinabii; tafsiri ya moja kwa moja huhifadhi hadhi yake na maana zake mbalimbali.
- source_word: ἐκ δεξιῶν
  choice: mkono wa kuume
  rationale: Huu ni msemo wa kibiblia unaoashiria nafasi ya heshima na mamlaka kuu, na pia huhifadhi mwangwi wa Zaburi 110.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: wa nguvu za Mungu
  rationale: Hutafsiri δύναμις kwa neno la kawaida ‘nguvu’ na kudumisha kirai cha Kigiriki kinachotaja wazi kwamba nguvu hizo ni za Mungu.
theological_decisions:
- issue: Usemi wa kuinuliwa kwa Mwana wa Adamu na dai la mamlaka ya Mungu
  choice: Mwana wa Adamu atakuwa ameketi mkono wa kuume wa nguvu za Mungu
  alternative: Mwana wa Adamu atakuwa ameketi mkono wa kuume wa Uweza
  rationale: Tafsiri kuu huhifadhi picha ya kuketi katika nafasi ya heshima na mamlaka pamoja na miangwi ya Zaburi 110 na Danieli 7. Haitafsiri kwa upanuzi unaoweza kuficha mvutano wa usemi wa asili; uwezekano wa kuelewa ‘Uweza’ kama njia ya heshima ya kumrejelea Mungu umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mkono wa kuume’ huhifadhi nahau ya kibiblia; ‘atakuwa ameketi’ huonyesha hali ya wakati ujao ya kuinuliwa.
