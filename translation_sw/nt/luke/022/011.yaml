  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: sw
  text: 'Nanyi mtamwambia mwenye nyumba hiyo, ‘Mwalimu anakuambia: “Chumba cha wageni kiko wapi ambamo nitakula Pasaka pamoja na wanafunzi wangu?”’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: mwenye nyumba hiyo
  rationale: Kirai hiki humaanisha mkuu au msimamizi wa nyumba. ‘Mwenye nyumba hiyo’ ni Kiswahili cha kawaida na cha asili katika muktadha huu, bila kutumia neno zito au la kizamani.
- source_word: ὁ διδάσκαλος
  choice: Mwalimu
  rationale: διδάσκαλος ni cheo kinachomtambulisha Yesu hapa; ‘Mwalimu’ hutafsiri maana yake moja kwa moja na kwa kawaida.
- source_word: κατάλυμα
  choice: chumba cha wageni
  rationale: Neno hili linaweza kumaanisha mahali pa kulala au chumba cha wageni. Katika mazingira ya nyumba, ‘chumba cha wageni’ linafaa, bila kulifanya kuwa ‘nyumba ya wageni’ wala kutanguliza maelezo ya ‘chumba cha juu’ yanayotokea katika mstari unaofuata.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: Katika muktadha wa kitenzi ‘kula,’ Pasaka hapa hasa inaelekea kwenye mlo wa Pasaka, lakini ‘Pasaka’ huhifadhi upana wa neno la Kigiriki bila kuongeza ‘mlo’ katika matini.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pamoja na wanafunzi wangu
  rationale: ‘Wanafunzi’ ni tafsiri ya kawaida ya μαθηταί katika Injili na huonyesha watu wanaojifunza na kumfuata mwalimu.
- source_word: φάγω
  choice: nitakula
  rationale: Aoristi tegemezi katika swali hili lisilo la moja kwa moja huonyesha tendo linalokusudiwa au kutazamiwa. Kiswahili cha kawaida hutumia wakati ujao ‘nitakula’ hapa kwa maana hiyo.
- source_word: ἐρεῖτε
  choice: mtamwambia
  rationale: Wakati ujao wa Kigiriki unahifadhiwa kwa umbo la wakati ujao la Kiswahili, ambalo pia linaweza kutoa agizo katika muktadha huu.
theological_decisions:
- issue: Cheo διδάσκαλος ambacho Yesu anatumia kujitaja
  choice: Mwalimu
  alternative: Bwana
  rationale: ‘Mwalimu’ hutafsiri cheo cha Kigiriki moja kwa moja na huepuka kuingiza cheo tofauti chenye maana pana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usemi wa moja kwa moja umehifadhiwa, huku mpangilio ukifanywa kuwa wa asili katika Kiswahili.
