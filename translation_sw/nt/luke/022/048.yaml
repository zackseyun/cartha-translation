base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: sw
  text: Lakini Yesu akamwambia, “Yuda, unamsaliti[a] Mwana wa Adamu kwa busu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na neno la asili, “unamkabidhi Mwana wa Adamu kwa busu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki ni chepesi, lakini hapa kinaonyesha tofauti kati ya tendo la Yuda na jibu la Yesu; “Lakini” ni ya kawaida na wazi katika muktadha huu.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Kitenzi hiki kinawakilisha kwa kawaida na kwa ufupi tendo la kusema pamoja na kiwakilishi cha yule aliyeambiwa.
- source_word: Ἰούδα
  choice: Yuda
  rationale: Ni jina la mtu katika hali ya mwito, likifuata umbo lililozoeleka katika Kiswahili.
- source_word: φιλήματι
  choice: kwa busu
  rationale: Hali ya dative inaonyesha njia au chombo; “kwa busu” ni Kiswahili cha kawaida kinachohifadhi tendo halisi.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina maalumu ambalo Yesu hutumia kujirejelea; tafsiri hii ya jadi huhifadhi muundo na mwangwi wa kifungu hicho bila kukifafanua kupita kiasi.
- source_word: παραδίδως
  choice: unamsaliti
  rationale: Katika muktadha wa kukamatwa kwa Yesu, kitenzi kina maana ya usaliti unaosababisha kukabidhiwa; wakati wa sasa unaonyesha tendo linalotendeka hapo.
theological_decisions:
- issue: Tafsiri ya τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi jina la Yesu lililozoeleka katika Injili na uzito wake wa kimaandiko, huku “Mwanadamu” ingeweza kueleweka kama rejeo la jumla kwa binadamu.
- issue: Maana ya παραδίδως
  choice: unamsaliti
  alternative: unamkabidhi
  rationale: “Unamsaliti” huonyesha maana hasi inayotokana na muktadha, lakini tanbihi inahifadhi maana ya msingi iliyo pana zaidi, “kumkabidhi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na ukali wa maneno ya Yesu vimehifadhiwa bila kuongeza maelezo ya kimadhehebu.
