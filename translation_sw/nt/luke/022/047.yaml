id: LUK.22.47
reference: Luke 22:47
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: sw
  text: Alipokuwa bado akisema, tazama, umati ukaja. Yule aitwaye Yuda, mmoja wa wale kumi na wawili, alikuwa akiwatangulia[a]. Akamkaribia Yesu ili ambusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akiwaongoza” au “alikuwa akienda mbele yao.”
    reason: Kitenzi cha Kigiriki kinaweza kueleza kutangulia kundi au, kulingana na muktadha, kuliongoza.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Alipokuwa bado akisema
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tukio linalofuata lilipotokea, huku ukihifadhi maana ya ἔτι, ‘bado.’
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linavuta fikira za msomaji kwenye kuwasili kwa ghafla kwa umati na kuhifadhi uchangamfu wa usimulizi.
- source_word: ὄχλος
  choice: umati ukaja
  rationale: ὄχλος ni umati; kitenzi ‘ukaja’ kimeongezwa kwa Kiswahili cha kawaida ili kukamilisha kishazi na kueleza kuwasili kunakodokezwa na muktadha.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Yule aitwaye Yuda
  rationale: Hutambulisha mhusika kwa ukaribu na Kigiriki bila kuongeza dharau inayoweza kudokezwa na usemi kama ‘anayejiita.’
- source_word: εἷς τῶν δώδεκα
  choice: mmoja wa wale kumi na wawili
  rationale: Huhifadhi utambulisho wa Yuda kama mshiriki wa kundi la wale kumi na wawili na uzito wa usaliti unaodokezwa na utambulisho huo.
- source_word: προήρχετο αὐτούς
  choice: alikuwa akiwatangulia
  rationale: Huhifadhi hali endelevu ya kitenzi na maana ya kwenda mbele ya kundi, bila kuamua kwa lazima kwamba Yuda alikuwa kiongozi wao rasmi.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Akamkaribia Yesu
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaohifadhi maana ya kusogea karibu na Yesu.
- source_word: φιλῆσαι αὐτόν
  choice: ili ambusu
  rationale: Hutoa maana ya wazi ya kumbusu, bila kuongeza maelezo kwamba ilikuwa salamu au tendo la usaliti.
theological_decisions:
- issue: Jinsi tendo la Yuda linavyosimuliwa
  choice: Kueleza kwamba alimkaribia Yesu ili ambusu bila kuongeza neno ‘kumsaliti.’
  alternative: ‘ili amsaliti kwa busu’
  rationale: Muktadha unaonyesha usaliti, lakini mstari huu wenyewe unasimulia kukaribia na kusudi la kumbusu. Tafsiri haipaswi kutanguliza ufafanuzi wa kitheolojia kuliko maneno ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ limedumishwa kama alama ya usimulizi inayovuta fikira. Alama ya tanbihi imewekwa baada ya ‘alikuwa akiwatangulia,’ yaani sehemu inayohusika moja kwa moja na mbadala wa kileksika.
