reference: Luke 22:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: sw
  text: ili mpate kula na kunywa mezani pangu katika ufalme wangu, nanyi mtaketi kwenye viti vya enzi mkiyahukumu[a] makabila kumi na mawili ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkiyatawala” au “mkiyaongoza.”
    reason: Neno la Kigiriki linaweza kumaanisha kuhukumu, na katika muktadha fulani pia kutawala au kuongoza.
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na ahadi iliyotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: ἔσθητε καὶ πίνητε
  choice: mpate kula na kunywa
  rationale: Muundo huu huhifadhi hali ya kusudi ya vitenzi vya Kigiriki vilivyo katika hali tegemezi chini ya ἵνα, bila kuwa mzito katika Kiswahili.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: mezani pangu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha ushirika wa kula kwenye meza ya Yesu.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: katika ufalme wangu
  rationale: Muktadha wa karamu na viti vya enzi unapendelea maana ya ufalme kama milki, huku wazo la utawala wa kifalme likibaki ndani ya neno hilo.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: mtaketi kwenye viti vya enzi
  rationale: Huhifadhi wakati ujao pamoja na taswira ya mamlaka ya kifalme na ya hukumu.
- source_word: κρίνοντες
  choice: mkiyahukumu
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi κρίνω; pia muundo wa Kiswahili unaonyesha kwamba tendo hilo linaambatana na kuketi kwenye viti vya enzi.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: makabila kumi na mawili ya Israeli
  rationale: Ni tafsiri ya wazi na iliyozoeleka inayohifadhi rejeo la agano kwa Israeli kama makabila kumi na mawili.
theological_decisions:
- issue: Asili ya jukumu la baadaye la wanafunzi kwa makabila kumi na mawili ya Israeli
  choice: mkiyahukumu
  alternative: mkiyatawala; mkiyaongoza
  rationale: κρίνω inaweza kuwa na maana ya kutoa hukumu na pia kutumia mamlaka ya utawala. Matini kuu inadumisha maana ya moja kwa moja ya hukumu bila kuibana iwe ama kuhukumu kwa adhabu pekee ama kutawala kiutawala pekee; maana nyingine zinaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mezani pangu” ni ya kawaida kuliko tafsiri ya neno kwa neno kama “juu ya meza yangu.” Alama ya tanbihi imewekwa baada ya “mkiyahukumu,” neno ambalo tanbihi inalifafanua.
