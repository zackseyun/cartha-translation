  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: sw
  text: Nao wakasema, “Bwana, tazama, hapa kuna panga mbili.” Akawaambia, “Inatosha.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, imetosha,” huenda akimaanisha kwamba mazungumzo hayo yakome, wala si kwamba panga mbili zilitosha.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Nao wakasema
  rationale: δέ ni kiunganishi hafifu cha simulizi. “Nao” kinaendeleza mtiririko kwa Kiswahili cha kawaida bila kusisitiza tofauti isiyokusudiwa.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni namna ya kawaida na yenye heshima ya kumwita Yesu, na pia huhifadhi matumizi ya κύριος kama cheo katika Agano Jipya.
- source_word: ἰδοὺ
  choice: tazama
  rationale: “Tazama” linaonyesha mwito wa kuelekeza fikira kwa jambo lililopo, kwa lugha yenye hadhi lakini inayoeleweka.
- source_word: μάχαιραι
  choice: panga
  rationale: μάχαιρα humaanisha silaha yenye ukali kama upanga au jambia. “Panga” ni neno la kawaida la Kiswahili kwa silaha hizi bila kubainisha kupita kiasi ukubwa au umbo lake.
- source_word: ὧδε δύο
  choice: hapa kuna ... mbili
  rationale: Muundo huu unaweka wazi mahali panapoonyeshwa na idadi katika mpangilio wa kawaida wa Kiswahili.
- source_word: Ἱκανόν ἐστιν
  choice: Inatosha
  rationale: Kauli fupi “Inatosha” huhifadhi maana ya kutosha na pia utata wa kama Yesu anazungumzia panga mbili au anakomesha mazungumzo.
theological_decisions:
- issue: Utata wa maana ya jibu la Yesu, Ἱκανόν ἐστιν
  choice: Inatosha
  alternative: Basi, imetosha / Yatosha hayo
  rationale: Kigiriki kinaweza kumaanisha kuwa panga mbili zinatosha au kwamba mazungumzo hayo yakome. Tafsiri kuu haichagui kwa lazima mojawapo ya maana hizo; tanbihi inaeleza uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. “Nao” na “akawaambia” hudumisha mwendo wa simulizi, huku “Inatosha” ikihifadhi ufupi na utata wa jibu la Kigiriki.
