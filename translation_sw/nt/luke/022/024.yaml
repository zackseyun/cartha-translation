  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: sw
  text: Pia kulitokea mabishano kati yao kuhusu ni nani kati yao aliyehesabiwa kuwa mkuu zaidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyeonekana kuwa mkuu zaidi.” Kitenzi cha Kigiriki kinaweza kumaanisha “alionekana” au “alihesabiwa kuwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: kulitokea
  rationale: Kitenzi hiki kinaeleza kuanza kwa hali au tukio; “kulitokea” ni Kiswahili cha kawaida kinachoonyesha kwamba mabishano yalianza.
- source_word: δὲ καὶ
  choice: Pia
  rationale: “Pia” linahifadhi nguvu ya nyongeza ya καί, huku δέ ikiachwa ijitokeze kwa mtiririko wa simulizi bila kulazimisha utofautishaji mkali.
- source_word: φιλονεικία
  choice: mabishano
  rationale: Neno hili huonyesha ugomvi wa maneno au ushindani wenye mvutano; “mabishano” linaeleweka kwa urahisi katika muktadha huu.
- source_word: ἐν αὐτοῖς
  choice: kati yao
  rationale: Hueleza kwamba mabishano yalitokea ndani ya kundi lao.
- source_word: τὸ τίς αὐτῶν
  choice: kuhusu ni nani kati yao
  rationale: Muundo huu unatambulisha jambo lililokuwa kiini cha mabishano.
- source_word: δοκεῖ
  choice: aliyeonwa
  rationale: δοκέω hapa yaweza kumaanisha kuonekana au kuhesabiwa/kufikiriwa kuwa fulani; “aliyeonwa” huhifadhi kwa kiasi fulani uwezekano wa mtazamo wa wengine.
- source_word: εἶναι μείζων
  choice: kuwa mkuu zaidi
  rationale: “Mkuu zaidi” huhifadhi hali ya kulinganisha ya μείζων badala ya kuibadili moja kwa moja kuwa hali ya juu kabisa.
theological_decisions:
- issue: Lugha ya cheo kati ya wanafunzi
  choice: mkuu zaidi
  alternative: mkuu kuliko wote / wa maana zaidi
  rationale: Kigiriki kinatumia hali ya kulinganisha μείζων, si hali ya juu kabisa iliyo wazi; tafsiri haiongezi nguvu ya dai kuliko matini.
- issue: Maana ya δοκεῖ
  choice: aliyeonwa kuwa
  alternative: aliyeonekana kuwa
  rationale: Matini inaweza kurejelea tathmini ya kijamii au mwonekano. Tafsiri kuu inachagua tathmini ya kijamii, na tanbihi inahifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mabishano” ni cha kawaida na wazi; “mkuu zaidi” huhifadhi ulinganisho wa Kigiriki bila kuugeuza kuwa “mkuu kuliko wote.”
