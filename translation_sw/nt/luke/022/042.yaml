  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: sw
  text: akisema, “Baba, ikiwa unataka, uniondolee kikombe hiki.[a] Lakini si mapenzi yangu, bali yako yatendeke.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kikombe” ni sitiari ya kibiblia ya fungu analopewa mtu, mara nyingi hasa mateso au hukumu.
    reason: cross_reference
  - marker: b
    text: Au, “si ninachotaka mimi, bali unachotaka wewe kitendeke.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha sala hii na tendo lililotangulia; “akisema” ni cha asili na kinahifadhi uhusiano huo.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni neno la kumwita Mungu moja kwa moja; “Baba” ni Kiswahili cha kawaida, cha heshima, bila kuongeza kihisishi kisichokuwamo katika Kigiriki.
- source_word: εἰ βούλει
  choice: ikiwa unataka
  rationale: βούλομαι hapa huonyesha kutaka au kuwa tayari. “Ikiwa unataka” ni usemi wa kawaida unaohifadhi ombi lenye sharti.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: uniondolee
  rationale: Katika muktadha huu παραφέρω pamoja na ἀπ’ ἐμοῦ huomba kikombe kiondolewe kutoka kwake. “Uniondolee” ni fupi, wazi, na ya asili katika Kiswahili.
- source_word: τοῦτο τὸ ποτήριον
  choice: kikombe hiki
  rationale: Taswira halisi ya “kikombe” imehifadhiwa kwa sababu ina mwangwi muhimu wa kibiblia wa fungu alilopewa mtu, hasa mateso au hukumu.
- source_word: πλὴν
  choice: Lakini
  rationale: Huonyesha badiliko lenye mkazo kutoka kwenye ombi hadi kujisalimisha. “Lakini” ni ya kawaida na yenye uzito unaofaa katika Kiswahili cha sasa.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: si mapenzi yangu, bali yako
  rationale: Kigiriki kinatumia nomino zinazomaanisha “mapenzi yangu ... yako.” Muundo huu unadumisha tofauti hiyo kwa usahihi na bila ufafanuzi wa ziada.
- source_word: γινέσθω
  choice: yatendeke
  rationale: Amri ya nafsi ya tatu hapa huomba mapenzi ya Baba yatimizwe. “Yatendeke” ni usemi wa asili na ulio wazi, unaopatana kisarufi na “mapenzi.”
theological_decisions:
- issue: Uhusiano kati ya mapenzi ya Yesu na mapenzi ya Baba
  choice: si mapenzi yangu, bali yako yatendeke
  alternative: si ninachotaka mimi, bali unachotaka wewe
  rationale: Maneno haya yanahifadhi moja kwa moja tofauti iliyomo katika aya kati ya mapenzi ya Yesu na ya Baba, pamoja na kujisalimisha kwa Yesu, bila kuyapunguza au kuyaeleza kwa mfumo wa mafundisho wa baadaye.
- issue: Nguvu ya sitiari ya “kikombe”
  choice: kikombe hiki
  alternative: mateso haya
  rationale: Kudumisha “kikombe” kunahifadhi taswira na miangwi yake ya kibiblia. Kukitafsiri moja kwa moja kuwa “mateso” kungefafanua kupita kiasi maana ambayo maandiko yanaiacha katika sitiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa karibu na Kigiriki lakini unasomeka kwa kawaida. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
