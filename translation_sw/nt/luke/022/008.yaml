id: LUK.22.8
reference: Luke 22:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: sw
  text: Akawatuma Petro na Yohana, akisema, “Nendeni mkatuandalie Pasaka[a], ili tule.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlo wa Pasaka.” Neno la Kigiriki linaweza kumaanisha Pasaka kwa upana zaidi, ingawa hapa muktadha wa kuandaa na kula unaelekeza kwenye mlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Kitenzi hiki kina maana ya moja kwa moja ya ‘kutuma’; muundo ‘akawatuma’ unaonyesha kwa kawaida kwamba Petro na Yohana ndio waliotumwa.
- source_word: εἰπών
  choice: akisema
  rationale: Kitenzi-shirikishi hiki kinaunganisha maneno ya Yesu na tendo la kuwatuma, na ‘akisema’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Πορευθέντες
  choice: Nendeni
  rationale: Ingawa kimuundo ni kitenzi-shirikishi cha wakati uliopita, hapa kina nguvu ya agizo linalotangulia agizo kuu; ‘Nendeni’ ni ya asili na wazi.
- source_word: ἑτοιμάσατε
  choice: mkatuandalie
  rationale: ‘Mkatuandalie’ huonyesha agizo la kwenda na kufanya maandalizi kwa ajili ya Yesu na wenzake, bila kudokeza kwamba wajitayarishe wao wenyewe.
- source_word: ἡμῖν
  choice: -tu-…-ie (mkatuandalie)
  rationale: Kiambishi ‘-tu-’ pamoja na kauli ya kutendea ‘-ie’ huwasilisha kwa kawaida maana ya ‘kwa ajili yetu’.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: ‘Pasaka’ huhifadhi upana wa neno la Kigiriki, ambalo linaweza kumaanisha sikukuu kwa ujumla au mlo wake; muktadha wa kula unaelekeza hasa kwenye mlo.
- source_word: ἵνα φάγωμεν
  choice: ili tule
  rationale: ‘Ili’ huonyesha kusudi la ἵνα, na ‘tule’ ni usemi wa kawaida unaoacha kitu kinacholiwa kifahamike kutokana na ‘Pasaka’ iliyotajwa.
theological_decisions:
- issue: Maana ya ‘Pasaka’ katika muktadha huu
  choice: Pasaka
  alternative: mlo wa Pasaka; mwana-kondoo wa Pasaka
  rationale: Muktadha wa kuandaa na kula unaonyesha mlo wa Pasaka, lakini neno la Kigiriki lina maana pana zaidi. Tafsiri kuu haifungi maana hiyo kwa namna nyembamba kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Nendeni mkatuandalie’ ni wa kawaida katika maagizo na unaonyesha kwenda kisha kuandaa. Alama ya tanbihi imewekwa baada ya ‘Pasaka,’ ambako tofauti ya kimsamiati inahusika.
