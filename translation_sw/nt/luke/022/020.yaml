base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: sw
  text: Vivyo hivyo, baada ya chakula, alikitwaa kikombe, akisema, “Kikombe hiki ni agano jipya[a] katika damu yangu[b], inayomwagwa kwa ajili yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wosia mpya.” Hata hivyo, “agano” linafaa zaidi katika muktadha huu wa damu inayothibitisha agano.
    reason: alternative_reading
  - marker: b
    text: Katika Kigiriki, maneno “inayomwagwa kwa ajili yenu” yanafuata kishazi chote. Kimaana yanaelekea zaidi kurejelea damu ya Yesu inayomwagwa kwa ajili yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: kikombe
  rationale: Ni neno la kawaida na la asili kwa chombo cha kunywea; haliongezi maana ya kiliturujia isiyolazimishwa na Kigiriki.
- source_word: ὡσαύτως
  choice: vivyo hivyo
  rationale: Linaunganisha tendo hili na tendo lililotangulia kwa lugha ya kawaida ya Kiswahili.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: baada ya kula
  rationale: Linaonyesha wazi mfuatano wa wakati wa kishazi cha Kigiriki bila kulazimisha aina maalumu ya mlo.
- source_word: λέγων
  choice: na kusema
  rationale: Ni muunganisho wa asili katika Kiswahili unaohifadhi uhusiano wa kitenzi-shirikishi na tendo lililotangulia.
- source_word: καινὴ
  choice: jipya
  rationale: Hii ndiyo maana inayofaa katika muktadha wa agano.
- source_word: διαθήκη
  choice: agano
  rationale: Katika muktadha wa Kiyahudi na kibiblia, neno hili linaelekeza kwenye uhusiano wa agano, si hasa wosia wa mtu anayekufa.
- source_word: ἐν τῷ αἵματί μου
  choice: katika damu yangu
  rationale: Tafsiri hii ya karibu inahifadhi tamathali ya sadaka na agano pamoja na upana wa maana ya kihusishi ἐν.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: inayomwagwa kwa ajili yenu
  rationale: Kiswahili kinaunganisha kwa kawaida kishazi hiki na ‘damu’; ‘kwa ajili yenu’ huhifadhi maana ya manufaa na uwakilishi bila kuingiza nadharia maalumu ya teolojia.
theological_decisions:
- issue: Maana ya διαθήκη katika muktadha wa damu na agano
  choice: agano jipya
  alternative: wosia mpya
  rationale: Lugha hii inaibua msingi wa Agano la Kale kuhusu damu inayothibitisha agano. ‘Agano’ ndiyo tafsiri inayofaa zaidi, huku maana mbadala ya kisheria ikitajwa katika tanbihi.
- issue: Kirejelewa cha ἐκχυννόμενον
  choice: 'Kimaana kinaelekezwa kwa ‘damu yangu’: ‘inayomwagwa kwa ajili yenu’'
  alternative: Kisarufi kinaweza kuonekana kuhusiana moja kwa moja na ‘kikombe’ kwa sababu kishazi hicho kinafuata sentensi nzima
  rationale: Umbo la Kigiriki linafuata kishazi kizima, lakini katika muktadha kinachomwagwa kwa ajili yao ni damu ya Yesu. Tanbihi inadumisha mvutano wa kisintaksia badala ya kuuficha.
- issue: Kitenzi kinachodokezwa pamoja na kikombe
  choice: akakitwaa kikombe
  alternative: na kikombe vivyo hivyo
  rationale: Kigiriki kina kishazi cha mviringo kinachotegemea tendo la mstari uliotangulia. Kiswahili kinahitaji kitenzi ili sentensi iwe kamili na ya kawaida; ‘akakitwaa’ hurejesha tendo lililotajwa kuhusu mkate bila kuongeza tendo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Baada ya kula’ ni cha kawaida zaidi kuliko usemi mzito wa ‘baada ya chakula cha jioni.’ Kitenzi ‘akakitwaa’ kimewekwa wazi kwa sababu muundo wa Kigiriki unadokeza tendo la mstari uliotangulia, ilhali Kiswahili kinahitaji sentensi kamili.
