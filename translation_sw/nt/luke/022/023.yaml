  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: sw
  text: Nao wakaanza kujadiliana wao kwa wao ni nani basi miongoni mwao ambaye angekuwa karibu kufanya jambo hilo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani miongoni mwao ambaye angefanya jambo hilo.” Muktadha unaonyesha wazi kwamba “jambo hilo” ni tendo la usaliti lililotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Kitenzi hiki pamoja na kis infinitive kinaonyesha mwanzo wa tendo; “wakaanza” ni cha kawaida na huhifadhi maana hiyo.
- source_word: συζητεῖν
  choice: kujadiliana
  rationale: Neno hili linaweza kumaanisha kujadiliana au kuhojiana pamoja. “Kujadiliana” linafaa hapa bila kudokeza mabishano makali yasiyotajwa.
- source_word: πρὸς ἑαυτούς
  choice: wao kwa wao
  rationale: Kirai hiki kinaonyesha mawasiliano ya kubadilishana ndani ya kundi; “wao kwa wao” ni Kiswahili cha kawaida na wazi.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: ni nani kati yao ambaye angefanya
  rationale: Swali lisilo la moja kwa moja linatafuta mtu mmoja ndani ya kundi. “Ni nani kati yao” ni la asili, huku “angefanya” likihifadhi hali ya kutokuwa na uhakika inayotolewa na optative εἴη katika usemi usio wa moja kwa moja.
- source_word: μέλλων πράσσειν
  choice: angefanya
  rationale: Katika muktadha huu μέλλω pamoja na infinitive huelekeza kwenye tendo lililokuwa linakuja kufanywa. Muundo wa Kiswahili “angefanya” unawasilisha jambo lililotazamiwa na kutokuwa na uhakika kuhusu mtendaji bila tungo nzito ya “aliyekuwa karibu kufanya.”
- source_word: τοῦτο
  choice: jambo hilo
  rationale: Kiwakilishi hiki kinaelekeza nyuma kwenye tendo lililotajwa katika mstari uliotangulia. “Jambo hilo” ni la kawaida katika Kiswahili na haliongezi wazi wazo la usaliti ndani ya mstari huu.
theological_decisions:
- issue: Kama kutaja wazi kwamba tendo hilo ni usaliti
  choice: Kuhifadhi usemi wa jumla “jambo hilo” katika matini kuu.
  alternative: “ambaye angemsaliti”
  rationale: Ingawa muktadha unaonyesha kuwa jambo hilo ni usaliti, Kigiriki cha mstari huu kinasema τοῦτο μέλλων πράσσειν, yaani kufanya “hili/hilo.” Kutotaja usaliti wazi kunahifadhi namna ya usemi wa chanzo na kuacha muktadha utoe rejeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Kujadiliana wao kwa wao” ni cha kawaida; “jambo hilo” huhifadhi rejeo lisilotajwa wazi katika Kigiriki.
