translation:
  language: sw
  text: Ila tu kwamba tuwakumbuke maskini—na hilo ndilo jambo nililokuwa na shauku ya kulifanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: isipokuwa tu
  rationale: Katika muktadha wa makubaliano yaliyotangulia, μόνον huonyesha ombi au sharti pekee lililoongezwa; “isipokuwa tu kwamba” ni kiunganishi cha asili katika Kiswahili.
- source_word: τῶν πτωχῶν
  choice: maskini
  rationale: πτωχός hapa humaanisha watu maskini; “maskini” ni neno la kawaida, wazi, na lenye hadhi katika Kiswahili.
- source_word: ἵνα μνημονεύωμεν
  choice: kwamba tuwakumbuke
  rationale: ἵνα baada ya μόνον huonyesha yaliyomo katika ombi hilo. “Tuwakumbuke” huhifadhi kitenzi cha Kigiriki bila kufafanua kupita kiasi namna ya kuwajali.
- source_word: ὃ
  choice: jambo
  rationale: Kiwakilishi hiki kinarejelea ombi lililotangulia kwa ujumla; “jambo” huleta muunganisho wa kawaida wa Kiswahili.
- source_word: ἐσπούδασα
  choice: nilikuwa na shauku
  rationale: σπουδάζω huonyesha utayari wa dhati na bidii ya kutenda; “nilikuwa na shauku” huhifadhi msukumo huo bila kudai kwamba tendo lilikuwa tayari limekamilika.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: jambo hili hili ... kulifanya
  rationale: αὐτὸ τοῦτο inasisitiza kwamba ni jambo lenyewe hasa; urudiaji wa “hili hili” huhifadhi mkazo huo kwa Kiswahili cha asili.
