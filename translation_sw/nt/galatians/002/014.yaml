id: GAL.2.14
reference: Galatians 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: sw
  text: Lakini nilipoona kwamba hawakuwa wakitembea sawasawa na ukweli wa injili[a], nilimwambia Kefa mbele ya wote, “Ikiwa wewe, ingawa wewe ni Myahudi, unaishi kama mtu wa Mataifa na si kama Myahudi, unawalazimishaje watu wa Mataifa waishi kama Wayahudi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “hawakuwa wakitembea kwa unyofu kulingana na ukweli wa injili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wafuate desturi za Kiyahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: mwenendo wao haukunyooka
  rationale: Kitenzi hiki kina picha halisi ya kutembea kwa kunyooka, lakini hapa kinahusu mwenendo usiopatana sawasawa na ukweli. Tafsiri hii huhifadhi picha ya unyofu kwa Kiswahili cha kawaida.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: kulingana na ukweli wa injili
  rationale: Pamoja na ὀρθοποδοῦσιν, πρός huonyesha kipimo cha upatanifu, si mwelekeo wa mahali tu. ‘Kulingana na’ huwasilisha uhusiano huo kwa uwazi.
- source_word: Κηφᾷ
  choice: Kefa
  rationale: Jina la Kiaramu lililoandikwa na Paulo limehifadhiwa kwa umbo lake la kawaida la Kiswahili badala ya kubadilishwa kuwa Petro.
- source_word: ἐθνικῶς
  choice: kama mtu wa Mataifa
  rationale: Kielezi hiki kinaeleza namna ya kuishi. Usemi huu unaonyesha tofauti ya kijamii na kikabila katika muktadha.
- source_word: Ἰουδαϊκῶς
  choice: kama Myahudi
  rationale: Tafsiri sambamba na ἐθνικῶς inadumisha ulinganisho wa moja kwa moja wa maandishi ya Kigiriki.
- source_word: ἀναγκάζεις
  choice: unawalazimisha
  rationale: Neno hili huhifadhi nguvu ya shinikizo au ulazimisho inayopatikana katika kitenzi cha Kigiriki.
- source_word: Ἰουδαΐζειν
  choice: waishi kama Wayahudi
  rationale: Kitenzi kinamaanisha kufuata namna ya maisha ya Kiyahudi. Tafsiri hii inaeleweka kwa wasomaji wa sasa bila kuingiza maana za baadaye za kimabishano ya kiteolojia.
- source_word: πῶς
  choice: kwa nini
  rationale: Ingawa maana ya msingi ni ‘jinsi gani,’ katika swali hili la kukemea kutopatana kwa matendo, Kiswahili cha kawaida hutumia ‘kwa nini.’ Hii haiongezi dhana ya uwezo inayoweza kuletwa na ‘unawezaje.’
theological_decisions:
- issue: Kutafsiri Ἰουδαΐζειν bila kuingiza mabishano ya kiteolojia ya nyakati za baadaye
  choice: waishi kama Wayahudi
  alternative: wafuate desturi za Kiyahudi; wawe kama Wayahudi
  rationale: Muktadha unahusu namna ya maisha, ushirika wa mezani, na mipaka ya kijamii ya Kiyahudi na Mataifa. Tafsiri iliyochaguliwa huacha upana huo bila kuufanya usemi kuwa istilahi ya mfumo fulani wa mafundisho.
- issue: Nguvu ya swali πῶς ... ἀναγκάζεις
  choice: kwa nini unawalazimisha
  alternative: unawalazimishaje; unawezaje kuwalazimisha
  rationale: Swali linakemea kutopatana kati ya maisha ya Kefa na shinikizo analoweka kwa watu wa Mataifa. ‘Kwa nini’ ni ya kawaida na ya moja kwa moja katika Kiswahili, huku ‘unawezaje’ ingeweza kuleta wazo la uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Watu wa Mataifa’ limetumiwa kuonyesha ἔθνη kwa uwazi, na ‘Kefa’ huhifadhi jina lililotumiwa katika chanzo. Alama zote za tanbihi zimewekwa katika matini kuu.
