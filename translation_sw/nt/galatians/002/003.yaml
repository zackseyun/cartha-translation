  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: sw
  text: Lakini hata Tito, aliyekuwa pamoja nami, ingawa alikuwa Mgiriki,[a] hakulazimishwa kutahiriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “Mgiriki” hapa linadokeza kwamba Tito hakuwa ametahiriwa; hata hivyo, andiko linasema hasa “Mgiriki,” si “Mmataifa” tu.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha tofauti na muktadha uliotangulia kwa kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: οὐδὲ
  choice: hata ... hakulazimishwa
  rationale: Muundo wa ‘hata’ pamoja na kitenzi kilichokanushwa unahifadhi msisitizo wa ‘not even’ kwa Kiswahili cha kawaida.
- source_word: Τίτος
  choice: Tito
  rationale: Hili ndilo umbo la jina hili linalotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: ὁ σὺν ἐμοί
  choice: aliyekuwa pamoja nami
  rationale: Inamtambulisha Tito kwa uwazi bila kuongeza dhana ya cheo au uhusiano isiyosemwa katika Kigiriki.
- source_word: Ἕλλην ὤν
  choice: ingawa alikuwa Mgiriki
  rationale: ‘Ingawa’ huonyesha maana ya kukubali hali iliyo kinyume na matarajio, inayodokezwa na muktadha; ‘alikuwa Mgiriki’ huhifadhi utambulisho mahsusi wa maandishi.
- source_word: Ἕλλην
  choice: Mgiriki
  rationale: Neno la Kigiriki linamaanisha hasa Mgiriki, si tu neno pana zaidi ‘Mmataifa.’
- source_word: ἠναγκάσθη
  choice: hakulazimishwa
  rationale: Kitenzi cha kutendwa kinaonyesha shinikizo au kulazimishwa kutoka nje; umbo hili ni la asili na sahihi katika Kiswahili.
- source_word: περιτμηθῆναι
  choice: kutahiriwa
  rationale: Huhifadhi kwa ufupi na moja kwa moja maana ya kupokea tohara.
theological_decisions:
- issue: Kutafsiri Ἕλλην kama utambulisho mahsusi au kama kifupisho cha kidini kilichofasiriwa
  choice: Mgiriki
  alternative: Mmataifa
  rationale: Andiko linataja moja kwa moja utambulisho wa Tito kuwa Mgiriki. Ingawa katika muktadha hilo linaashiria kwamba hakuwa ametahiriwa na alikuwa wa mataifa, tafsiri inapaswa kuhifadhi neno mahsusi la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kawaida kwa wasomaji wa leo huku ukihifadhi msisitizo wa οὐδὲ, hali ya kukubali ya Ἕλλην ὤν, na neno mahsusi ‘Mgiriki.’
