  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: sw
  text: Lakini nilipanda kwa kufuatana na ufunuo[a], nami niliwawasilishia injili ninayoihubiri miongoni mwa watu wasio Wayahudi; lakini faraghani kwa wale waliohesabiwa kuwa mashuhuri[b], nisije, kwa namna fulani, nikawa nakimbia au nilikimbia bure.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya ufunuo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wale walioonekana kuwa wenye ushawishi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “nisije, kwa namna fulani, nikawa nakimbia au nilikimbia bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: nilipanda
  rationale: Kitenzi kinamaanisha ‘kwenda juu/kupanda.’ Mahali alikokwenda yanaeleweka kutokana na muktadha lakini hayatajwi katika mstari huu, hivyo tafsiri haiongezi ‘kwenda Yerusalemu.’
- source_word: κατὰ ἀποκάλυψιν
  choice: kwa kufuata ufunuo
  rationale: Kirai kinaonyesha msingi au kichocheo cha safari. ‘Kwa kufuata ufunuo’ ni Kiswahili cha kawaida kinachoonyesha kwamba ufunuo ulimwongoza kuchukua hatua, huku tanbihi ikihifadhi uwezekano wa maana ya kisababishi.
- source_word: ἀνεθέμην
  choice: nikawaeleza
  rationale: Katika muktadha huu kitenzi ni kuweka jambo mbele ya wengine ili walitafakari. ‘Nikawaeleza’ ni ya asili na haidokezi bila lazima kwamba Paulo aliwasilisha injili ili iidhinishwe rasmi.
- source_word: τὸ εὐαγγέλιον
  choice: injili
  rationale: ‘Injili’ ni neno sanifu na linaloeleweka katika Kiswahili kwa εὐαγγέλιον katika maandishi ya Paulo.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Hapa ἔθνη inarejelea hasa watu wasio Wayahudi. ‘Watu wa mataifa’ huwasilisha maana hiyo kwa uwazi bila kuigeuza kuwa mataifa ya kisiasa.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Kirai kinaonyesha kwamba maelezo hayo yalitolewa katika mazingira ya faragha, tofauti na hadhara pana.
- source_word: τοῖς δοκοῦσιν
  choice: wale walioonekana kuwa mashuhuri
  rationale: 'Tafsiri hii huhifadhi utata wa δοκοῦσιν: walihesabiwa au walionekana kuwa watu muhimu, bila kuamua kama Paulo anakubali hadhi yao au anaizungumza kwa tahadhari.'
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: nisije kwa namna fulani nikawa ninakimbia, au nilikuwa nimekimbia, bure
  rationale: Maneno haya huhifadhi sitiari ya kukimbia na tofauti kati ya kazi inayoendelea na kazi iliyokwisha kufanywa. ‘Bure’ huonyesha uwezekano wa jitihada kutokuwa na matokeo.
theological_decisions:
- issue: Ikiwa maelezo ya Paulo ya faraghani yanaonyesha kwamba aliwasilisha injili yake ili isahihishwe au iidhinishwe na mitume
  choice: ‘Nikawaeleza’ linaonyesha kwamba aliweka injili mbele yao bila kudokeza kwamba injili yake ilikuwa chini ya mamlaka yao au kwamba hakutaka tathmini yoyote.
  alternative: ‘Niliwasilisha kwao ili waidhinishe’ au ‘niliwajulisha tu bila jambo hilo kutafakariwa.’
  rationale: Kitenzi cha Kigiriki kinaweza kuhusisha kuweka jambo mbele ya wengine ili walifikirie, lakini hakilazimishi wazo la kujitiisha rasmi. Tafsiri ya kati huhifadhi mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kupunguza uzito wa sentensi bila kupoteza uhusiano wa hoja. ‘Kupanda’ na ‘kukimbia’ zimehifadhi sitiari za Kigiriki; ‘faraghani’ ni sanifu na fupi. Alama zote za tanbihi [a], [b], na [c] zimo katika matini kuu.
