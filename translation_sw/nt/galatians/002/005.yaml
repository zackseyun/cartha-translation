  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: sw
  text: Hao hatukukubali kujitiisha kwao hata kwa muda mfupi[a], ili kweli ya injili idumu kwenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “hata kwa saa moja”; yaani, hata kwa muda mfupi sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “idumu kwa ajili yenu” au “idumu pamoja nanyi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Hao
  rationale: Kiwakilishi hiki kinawarejelea watu waliotajwa katika mstari uliotangulia na kinaweka wazi rejeo hilo kwa Kiswahili cha kawaida.
- source_word: οὐδὲ πρὸς ὥραν
  choice: hata kwa muda mfupi
  rationale: Hii ni nahau inayomaanisha kutokubali hata kwa kipindi kifupi sana; tanbihi inahifadhi tafsiri ya neno kwa neno.
- source_word: εἴξαμεν
  choice: hatukuwakubalia
  rationale: Kitenzi kina maana ya kulegea au kukubali shinikizo. ‘Hatukuwakubalia’ kinaonyesha kukataa kutoa nafasi bila kukifanya sawa kabisa na nomino inayofuata ya kujitiisha.
- source_word: τῇ ὑποταγῇ
  choice: kwa kujitiisha
  rationale: Kauli hii inaonyesha namna au hali ya kukubali ambako Paulo na wenzake walikataa.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ linaonyesha wazi kusudi la kukataa kwao.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: kweli ya injili
  rationale: Hii ni kauli muhimu ya Paulo; ‘injili’ ni neno lililozoeleka na linaloeleweka katika Kiswahili cha kawaida.
- source_word: διαμείνῃ
  choice: idumu
  rationale: Kitenzi kinaonyesha kuendelea kuwapo au kuhifadhiwa bila kuondolewa.
- source_word: πρὸς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Hapa kirai kinaweza kuonyesha manufaa au mwelekeo kwa Wagalatia. Chaguo hili ni la kawaida, huku uwezekano wa ‘pamoja nanyi’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uzito na upeo wa kukataa kwa Paulo mbele ya wapinzani
  choice: Paulo anasema kwamba yeye na wenzake hawakuwakubalia kabisa kwa kujitiisha, ili kweli ya injili ihifadhiwe.
  alternative: Kauli hiyo inaweza kueleweka hasa kuwa walikataa kujitiisha binafsi au kutoa ruhusa ya kitaasisi.
  rationale: Kigiriki hakilazimishi kauli hii iwe ya kibinafsi pekee wala ya kitaasisi pekee. Tafsiri inaacha upeo huo wazi bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wazi kwa msomaji wa kawaida, huku tofauti kati ya kukubali shinikizo na kujitiisha ikihifadhiwa kadiri lugha ya Kiswahili inavyoruhusu.
