id: GAL.2.16
reference: Galatians 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: sw
  text: Lakini tunajua kwamba mtu hahesabiwi kuwa mwadilifu kwa matendo ya sheria, bali kwa njia ya imani katika Yesu Masihi[a]. Sisi pia tumemwamini Masihi Yesu, ili tuhesabiwe kuwa waadilifu kwa imani katika Masihi[b], wala si kwa matendo ya sheria, kwa sababu hakuna mwanadamu yeyote atakayehesabiwa kuwa mwadilifu kwa matendo ya sheria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya uaminifu wa Yesu Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “kwa uaminifu wa Masihi.”
    reason: alternative_reading
  - marker: c
    text: Kihalisi, “hakuna mwili wowote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: hahesabiwi kuwa mwadilifu / tuhesabiwe kuwa waadilifu / atakayehesabiwa kuwa mwadilifu
  rationale: Kiswahili hakina kitenzi kimoja cha kawaida kinachobeba kwa uwazi nguvu ya kimahakama ya δικαιόω. “Hesabiwa kuwa mwadilifu” ni ya asili, inaeleweka, na inadumisha wazo la kutambuliwa au kutangazwa kuwa mwadilifu badala ya kumaanisha tu kufanywa mwenye tabia njema.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: “Mtu” huhifadhi umoja wa jumla wa Kigiriki na ni lugha ya kawaida, jumuishi na sahihi katika Kiswahili.
- source_word: ἐξ ἔργων νόμου
  choice: kwa matendo ya sheria
  rationale: Huhifadhi kirai cha Paulo bila kukipanua kuwa “matendo mema” au kukifupisha kuwa “kushika sheria.”
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: kwa njia ya imani katika Yesu Masihi
  rationale: Usomaji wa imani inayoelekezwa kwa Yesu umewekwa katika matini kuu; muundo wa umilikishi wa Kigiriki unaoweza pia kumaanisha uaminifu wa Yesu umehifadhiwa katika tanbihi.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: tumemwamini Masihi Yesu
  rationale: “Kumwamini” ni Kiswahili cha kawaida kwa πιστεύω εἰς na kinaonyesha imani inayoelekezwa kwa mtu; wakati timilifu unaonyesha tendo lililotokea lenye matokeo yanayoendelea.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: kwa imani katika Masihi
  rationale: Uamuzi uleule wa kirai cha awali umetumika kwa uthabiti, huku usomaji wa “uaminifu wa Masihi” ukiwekwa katika tanbihi.
- source_word: Χριστός
  choice: Masihi
  rationale: Cheo kimetafsiriwa badala ya kunukuliwa kwa sauti kuwa “Kristo,” ili kudumisha maana yake ya kimasihi.
- source_word: πᾶσα σάρξ
  choice: hakuna mwanadamu yeyote
  rationale: Hutoa maana ya nahau ya Kiebrania/Kigiriki katika Kiswahili cha sasa. Tafsiri halisi “hakuna mwili” ingeweza kueleweka kama mwili wa kimwili badala ya wanadamu; namna halisi imeelezwa katika tanbihi.
- source_word: εἰδότες δὲ
  choice: Lakini tunajua kwamba
  rationale: Kitenzi-shirikishi kimegeuzwa kuwa sentensi ya kawaida ya Kiswahili, huku δέ ikiwakilishwa kwa “Lakini” na uhusiano na hoja iliyotangulia ukidumishwa.
- source_word: ἐὰν μὴ
  choice: bali kwa njia ya
  rationale: Katika muktadha huu muundo unaweka utofauti kati ya matendo ya sheria na imani. “Bali” ni ya asili na huepuka Kiswahili kisicho wazi cha “isipokuwa kupitia.”
theological_decisions:
- issue: Maana ya πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ
  choice: Imani katika Yesu Masihi / imani katika Masihi
  alternative: Uaminifu wa Yesu Masihi / uaminifu wa Masihi
  rationale: Umilikishi wa Kigiriki unaweza kueleweka kwa imani inayoelekezwa kwa Masihi au uaminifu wa Masihi mwenyewe. Matini kuu inafuata usomaji wa kwanza, lakini mvutano halisi umehifadhiwa katika tanbihi.
- issue: Nguvu ya kimahakama ya δικαιόω
  choice: kuhesabiwa kuwa mwadilifu
  alternative: kutangazwa kuwa mwadilifu; kufanywa kuwa mwadilifu
  rationale: Chaguo hili linadumisha mwelekeo wa hukumu au hadhi bila kulazimisha ufafanuzi finyu wa kimadhehebu. “Kufanywa” lingeweza kuelekeza zaidi kwenye badiliko la tabia kuliko muktadha unavyolazimisha.
- issue: Nahau πᾶσα σάρξ
  choice: hakuna mwanadamu yeyote
  alternative: hakuna mwili wowote
  rationale: Maana rejelewa ni wanadamu kwa ujumla. Nahau halisi imehifadhiwa katika tanbihi ili mwangwi wake wa kimaandiko usipotee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umegawanywa katika sentensi mbili kwa usomaji wa asili bila kuvunja hoja ya Kigiriki. “Masihi Yesu” inadumisha mpangilio wa Χριστὸν Ἰησοῦν, na viambishi vya yambwa vimetumiwa kwa kawaida katika “tumemwamini.”
