  source_fidelity: Tafsiri inawakilisha kwa usahihi Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί. “Kwa kuzaliwa” hutoa maana ya φύσει katika muktadha wa asili ya kikabila, na “kutoka miongoni mwa watu wa mataifa” huhifadhi ἐξ ἐθνῶν bila kuongeza tafsiri ya kiteolojia.
