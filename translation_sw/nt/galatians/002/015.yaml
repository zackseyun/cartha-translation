id: GAL.2.15
reference: Galatians 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: sw
  text: Sisi ni Wayahudi kwa kuzaliwa[a], wala si wenye dhambi kutoka miongoni mwa watu wa mataifa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa asili”; hapa maana yake ni asili ya kikabila ya mtu.
    reason: cultural_note
  - marker: b
    text: 'Au: “wala si watu wa mataifa wenye dhambi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Sisi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kimehifadhiwa ili kuonyesha msisitizo wake wa kiasi.
- source_word: φύσει
  choice: kwa kuzaliwa
  rationale: Katika muktadha huu neno linaonyesha asili ya kikabila, si tabia ya ndani ya kimaadili. ‘Kwa kuzaliwa’ ni Kiswahili cha kawaida na wazi.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo jina la kawaida la kikabila katika Kiswahili na linahifadhi utofautishaji na watu wa mataifa.
- source_word: ἐξ ἐθνῶν
  choice: kutoka miongoni mwa watu wa mataifa
  rationale: Tafsiri hii inahifadhi muundo wa kihusishi na maana ya watu wasio Wayahudi bila kuufanya kuwa kivumishi tu.
- source_word: ἁμαρτωλοί
  choice: wenye dhambi
  rationale: Usemi huu wa kawaida unahifadhi tamko kali la Kigiriki na unaeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions:
- issue: Ikiwa mstari huu useme kwamba Paulo anakubali kuwa Wayahudi ni bora kimaadili kuliko watu wa mataifa
  choice: Utofautishaji wa kikabila uliomo katika kauli umehifadhiwa bila kupunguzwa, lakini haujapanuliwa kuwa fundisho la kwamba Wayahudi ni waadilifu kiasili.
  alternative: ‘wala si wale wanaohesabiwa kuwa wenye dhambi kama watu wa mataifa’
  rationale: Kigiriki kinatoa utofautishaji huo kwa ufupi na moja kwa moja. Muktadha unaofuata unaufafanua, lakini ufafanuzi huo haupaswi kuingizwa kimyakimya katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. ‘Watu wa mataifa’ imetumiwa kwa maana ya watu wasio Wayahudi, huku utata mdogo wa uhusiano wa maneno mwishoni mwa sentensi ukihifadhiwa katika tanbihi.
