  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: sw
  text: Lakini ikiwa tunapotafuta kuhesabiwa haki katika Masihi[a], sisi wenyewe pia tulipatikana kuwa wenye dhambi, je, basi Masihi ni mtumishi wa dhambi? Hasha!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Masihi: kwa kawaida hutafsiriwa “Kristo” hapa na katika kutokea kunakofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: tunapotafuta
  rationale: Kauli hii inadumisha tendo linaloendelea wakati mmoja na tendo kuu, kwa Kiswahili cha kawaida na cha asili.
- source_word: δικαιωθῆναι
  choice: kuhesabiwa haki
  rationale: Hii ni istilahi ya kawaida ya Kiswahili inayohifadhi maana ya kutangazwa au kukubaliwa kuwa mwenye haki bila kuamua zaidi namna tendo hilo linavyofanyika.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Neno Χριστός linafanya kazi kama cheo hapa; “katika” pia linahifadhi upana wa uhusiano unaoelezwa na ἐν bila kuufafanua kupita kiasi.
- source_word: εὑρέθημεν
  choice: tulionekana kuwa
  rationale: Uchaguzi huu unahifadhi hali ya kutendwa na wazo la kubainika kuwa katika hali fulani, bila kudokeza ni nani aliyefanya uchunguzi huo.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: sisi wenyewe pia ... wenye dhambi
  rationale: “Sisi wenyewe” linatoa mkazo wa αὐτοὶ, “pia” linawakilisha καί, na “wenye dhambi” ni Kiswahili cha kawaida kwa ἁμαρτωλοί.
- source_word: ἁμαρτίας διάκονος
  choice: mtumishi wa dhambi
  rationale: “Mtumishi” linaonyesha kuhudumia au kuendeleza dhambi bila kuingiza wazo la cheo rasmi cha kidini.
- source_word: μὴ γένοιτο
  choice: Hasha!
  rationale: Tamko hili fupi na lenye nguvu ni njia ya asili ya Kiswahili ya kukataa kabisa hitimisho linalotangulia.
theological_decisions:
- issue: Iwapo swali limwonyeshe Masihi kuwa chanzo au mwendelezaji wa dhambi
  choice: je, basi Masihi ni mtumishi wa dhambi?
  alternative: je, basi Masihi husababisha dhambi?
  rationale: Kigiriki kinauliza kwa kejeli kuhusu hitimisho kwamba Masihi ni διάκονος wa dhambi; hakisemi moja kwa moja kwamba yeye husababisha dhambi. Tafsiri iliyochaguliwa inadumisha mvutano huo, ambao Paulo anaukataa mara moja.
- issue: Maana ya ἐν katika ἐν Χριστῷ
  choice: katika Masihi
  alternative: kwa njia ya Masihi
  rationale: “Katika Masihi” huhifadhi usemi wa Kigiriki na uwezekano wake mpana wa kuonyesha uhusiano au utambulisho, badala ya kuufanya uwe wa njia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa msomaji wa kawaida. “Je, basi” linabeba nguvu ya swali la hitimisho, na “Hasha!” linadumisha ukataaji mkali wa Paulo.
