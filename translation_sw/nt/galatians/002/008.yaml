  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: sw
  text: Kwa maana yule aliyefanya kazi kupitia Petro kwa ajili ya utume kwa waliotahiriwa[a], alifanya kazi pia kupitia mimi kwa ajili ya Mataifa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa ajili ya utume wa tohara.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: aliyefanya kazi / alifanya kazi
  rationale: Marudio ya kitenzi yamehifadhiwa ili kudumisha ulinganifu wa makusudi kati ya huduma ya Petro na ya Paulo bila kufafanua kupita kiasi namna ya utendaji wa Mungu.
- source_word: Πέτρῳ / ἐμοὶ
  choice: kupitia Petro / kupitia mimi
  rationale: 'Dativi hizi zimeeleweka kwa maana ya chombo katika muktadha: yule anayetenda alifanya kazi kupitia Petro na Paulo katika huduma zao.'
- source_word: εἰς ἀποστολὴν
  choice: kwa ajili ya utume
  rationale: Huhifadhi maana ya huduma au agizo la kitume huku ikiwa Kiswahili cha kawaida na chenye heshima.
- source_word: τῆς περιτομῆς
  choice: kwa waliotahiriwa
  rationale: Neno 'tohara' limetumiwa kimetonimia kwa Wayahudi waliotahiriwa; tafsiri hii inaweka wazi kundi linalolengwa bila kubadili kuwa jina la kikabila lisilopo moja kwa moja katika Kigiriki.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu ni watu wasio Wayahudi. 'Watu wa mataifa' huhifadhi pia uhusiano wa kileksia na maana ya msingi ya 'mataifa'.
theological_decisions:
- issue: Kumtaja mhusika wa kitendo waziwazi kuwa Mungu
  choice: yule aliyefanya kazi
  alternative: Mungu aliyefanya kazi
  rationale: Kigiriki kina kishiriki chenye kibainishi, kihalisi 'yule aliyefanya kazi,' bila nomino 'Mungu.' Muundo huu unahifadhi rejeo la kimuktadha bila kuongeza jina lisilomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo sambamba na marudio ya kitenzi yamehifadhiwa; 'watu wa mataifa' ni wazi kwa msomaji wa kawaida huku ikiakisi neno la Kigiriki.
