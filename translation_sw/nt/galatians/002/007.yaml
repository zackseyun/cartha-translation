  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: sw
  text: Bali, kinyume chake, walipoona kwamba nimekabidhiwa injili kwa ajili ya wasiotahiriwa, kama vile Petro alivyokabidhiwa injili kwa ajili ya waliotahiriwa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “injili ya kutokutahiriwa … ya tohara,” yaani, injili iliyokabidhiwa kwa ajili ya makundi hayo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Bali, kinyume chake
  rationale: Muunganiko huu unaonyesha tofauti yenye msisitizo na yaliyotangulia; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili.
- source_word: ἰδόντες
  choice: walipoona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaeleza mazingira ya tendo kuu; 'walipoona' huwasilisha uhusiano huo kwa uwazi.
- source_word: πεπίστευμαι
  choice: nimekabidhiwa
  rationale: Kauli tendwa timilifu ya πιστεύω hapa ina maana ya kukabidhiwa dhamana au utume; 'nimekabidhiwa' huhifadhi hali inayoendelea kutokana na tendo lililotimia.
- source_word: τὸ εὐαγγέλιον
  choice: injili
  rationale: '''Injili'' ni neno la kawaida na lenye uzito unaofaa katika matumizi ya Kikristo ya Kiswahili.'
- source_word: τῆς ἀκροβυστίας
  choice: kwa ajili ya wasiotahiriwa
  rationale: Kirai cha Kigiriki kwa muundo ni 'ya kutokutahiriwa,' lakini katika muktadha kinaonyesha kundi ambalo Paulo alikabidhiwa kulihudumia; tafsiri hii ni wazi bila kulibadili moja kwa moja kuwa 'Mataifa.'
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho wa moja kwa moja kati ya utume wa Paulo na wa Petro.
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: τῆς περιτομῆς
  choice: kwa ajili ya waliotahiriwa
  rationale: Husawazisha kirai kilichotangulia na kuhifadhi alama ya tohara iliyotumiwa na Paulo badala ya kuifasiri moja kwa moja kuwa 'Wayahudi.'
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: alivyokabidhiwa injili
  rationale: Kigiriki kinaacha maneno haya yaeleweke kutokana na kishazi cha kwanza; kuyarejesha katika Kiswahili kunafanya sentensi iwe kamili na wazi bila kuongeza wazo jipya.
theological_decisions:
- issue: Iwapo ἀκροβυστία / περιτομή yatafsiriwe kwa majina ya makabila ('Mataifa' / 'Wayahudi') au kwa alama za tohara zilizopo katika Kigiriki.
  choice: wasiotahiriwa / waliotahiriwa
  alternative: Mataifa / Wayahudi; kutokutahiriwa / tohara
  rationale: Maneno ya Kigiriki yanataja makundi kwa hali ya tohara. Kuyahifadhi kwa namna hii hudumisha namna Paulo mwenyewe alivyowasilisha tofauti hiyo bila kuifinya kuwa utambulisho wa kikabila pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Bali, kinyume chake' huhifadhi msisitizo wa tofauti; 'nimekabidhiwa' huepuka lugha nzito isiyo ya lazima huku ikidumisha wazo la dhamana ya utume.
