base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: sw
  text: Lakini Kefa alipokuja Antiokia[a], nilimpinga ana kwa ana, kwa sababu alikuwa amehukumiwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kefa ni jina la Kiaramu la Petro.
    reason: cross_reference
  - marker: b
    text: Au, “kwa sababu ilikuwa wazi kwamba alikuwa amekosea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Lakini ... alipo-
  rationale: Inaunganisha tofauti ndogo ya δέ na wakati wa ὅτε kwa Kiswahili cha kawaida na cha asili.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: Inahifadhi jina lililo katika maandishi ya Kigiriki badala ya kulibadilisha kuwa Petro; tanbihi inafafanua utambulisho wake.
- source_word: ἦλθεν
  choice: alipokuja
  rationale: Ni tafsiri ya kawaida ya ἔρχομαι katika muktadha wa kuja mahali.
- source_word: εἰς Ἀντιόχειαν
  choice: Antiokia
  rationale: Katika Kiswahili, kitenzi 'kuja' pamoja na jina la mahali bila kihusishi ni usemi wa kawaida wa kueleza mwendo kuelekea mji.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: uso kwa uso
  rationale: Inahifadhi picha ya usemi wa Kigiriki na kuonyesha kuwa Paulo alimkabili Kefa moja kwa moja.
- source_word: ἀντέστην
  choice: nilimpinga
  rationale: Inaeleza upinzani wa wazi na wa moja kwa moja kwa Kiswahili cha asili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inatambulisha sababu ya Paulo kumpinga kwa uwazi.
- source_word: κατεγνωσμένος ἦν
  choice: alikuwa amehukumiwa
  rationale: Inahifadhi hali ya kutendwa na wazo la hali iliyokuwa imeshatokea katika muundo wa Kigiriki, bila kutaja wazi aliyetoa hukumu.
theological_decisions:
- issue: Utambulisho na uwasilishaji wa Κηφᾶς
  choice: Kudumisha 'Kefa' katika maandishi makuu
  alternative: Kutumia 'Petro' kwa sababu ndilo jina linalojulikana zaidi
  rationale: Maandishi ya Kigiriki yana Κηφᾶς; kudumisha Kefa kunahifadhi umbo la jina la chanzo, huku tanbihi ikieleza kwamba ni jina la Kiaramu la Petro.
- issue: Maana ya κατεγνωσμένος ἦν
  choice: alikuwa amehukumiwa
  alternative: alikuwa wazi amekosea
  rationale: Tafsiri kuu inahifadhi hali ya kutendwa na mvutano wa nani au nini kilichomthibitisha kuwa mwenye hatia; tanbihi inatoa maana mbadala inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi 'uso kwa uso' unadumisha nguvu ya makabiliano ya moja kwa moja.
