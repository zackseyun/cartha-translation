  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: sw
  text: Nao walipotambua neema niliyopewa, Yakobo, Kefa na Yohana, waliotambuliwa kuwa nguzo, walitupa mimi na Barnaba mikono ya kuume ya ushirika,[a] ili sisi twende kwa wasio Wayahudi,[b] nao waende kwa waliotahiriwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mikono ya kuume ilitolewa kama ishara ya kukubaliana na kushiriki kazi pamoja.
    reason: idiom_clarification
  - marker: b
    text: Au, “kwa mataifa.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa tohara,” yaani, kwa Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: walipotambua
  rationale: Kitenzi hiki kinaonyesha kwamba walielewa na pia walikiri neema aliyopewa Paulo; muundo wa wakati unaweka utambuzi huo kuwa msingi wa hatua iliyofuata.
- source_word: χάριν
  choice: neema
  rationale: ‘Neema’ huhifadhi maana pana ya fadhili ya Mungu inayotenda kazi katika wito na huduma ya Paulo bila kuibana kuwa mamlaka au utume pekee.
- source_word: δοθεῖσάν μοι
  choice: niliyopewa
  rationale: Kauli tendwa inahifadhi kwamba neema hiyo ilitolewa kwa Paulo, na kishazi cha uhusiano ni cha kawaida katika Kiswahili.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: Jina lililotumiwa katika maandishi ya Kigiriki limetoholewa moja kwa moja badala ya kubadilishwa kuwa Petro.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: waliotambuliwa kuwa nguzo
  rationale: Hii inaonyesha hadhi waliyokuwamo machoni pa watu bila kulazimisha sauti ya dharau ambayo ‘walioonekana kana kwamba’ ingeweza kuleta.
- source_word: δεξιὰς ... κοινωνίας
  choice: mikono ya kuume kuwa ishara ya ushirika
  rationale: Wingi wa δεξιὰς umehifadhiwa, na kirai kimefafanuliwa kwa Kiswahili cha kawaida kama ishara ya kukubaliana na kushiriki kazi pamoja.
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno linamaanisha hasa watu wasio Wayahudi; ‘watu wa mataifa’ huhifadhi pia uhusiano wake wa kileksika na ‘mataifa.’
- source_word: περιτομήν
  choice: waliotahiriwa
  rationale: Nomino hii imetumiwa kimajazi kwa Wayahudi; tafsiri hii huhifadhi taswira ya tohara na kufanya kundi linalorejelewa lieleweke.
theological_decisions:
- issue: Maana ya κοινωνίας katika tendo la kutoa mikono ya kuume
  choice: ushirika
  alternative: ushirikiano
  rationale: ‘Ushirika’ huhifadhi upana wa κοινωνία—kutambuana, kushiriki, na kufanya kazi kwa pamoja—bila kuifanya iwe makubaliano ya kiutendaji pekee.
- issue: Mgawanyo wa huduma unaoonyeshwa na ἵνα ... εἰς
  choice: ili sisi twende ... nao waende
  alternative: ili sisi tuwahudumie ... nao wawahudumie
  rationale: Kigiriki hakina kitenzi wazi katika vifungu hivi; ‘twende’ huwasilisha mwendo unaodokezwa bila kuongeza kwa nguvu namna maalumu ya huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kigiriki huku nahau ya kutoa mikono ya kuume ikifafanuliwa kwa namna ya kawaida katika Kiswahili.
