  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: sw
  text: Wayahudi wengine nao waliungana naye katika unafiki, hata Barnaba akavutwa katika unafiki wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: waliungana naye katika unafiki
  rationale: Kitenzi chenye kiambishi σύν- kinaonyesha kwamba Wayahudi wengine walishiriki pamoja na Petro katika mwenendo wa kinafiki; tafsiri hii inahifadhi maana ya ushirika huo kwa Kiswahili cha kawaida.
- source_word: αὐτῷ
  choice: naye
  rationale: Hali ya dative inaonyesha kushirikiana na Petro katika mwenendo wake; “naye” huonyesha uhusiano huo kwa ufupi na kwa kawaida.
- source_word: λοιποὶ
  choice: wengine
  rationale: Katika Kiswahili, “Wayahudi wengine” kwa kawaida humaanisha wale wengine wa kundi linalozungumziwa. “Waliosalia” lingeweza kudokeza zaidi mabaki ya idadi kuliko utofautishaji wa kundi.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Katika muktadha huu neno linarejelea watu wa Kiyahudi kama kundi la kikabila na kidini, si wakazi wa Uyahudi pekee.
- source_word: συναπήχθη
  choice: akachukuliwa
  rationale: Uundaji wa kutendwa unahifadhi wazo la Barnaba kuvutwa na ushawishi wa mwenendo wa wengine, bila kumwondolea kabisa uwajibikaji wake.
- source_word: ὑποκρίσει
  choice: unafiki
  rationale: “Unafiki” ni neno la Kiswahili lililo wazi na la kawaida kwa mwenendo wa kujifanya; kurudiwa kwake kunadumisha msisitizo wa Paulo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo unahifadhi kurudiwa kwa “unafiki” na nguvu ya kijamii ya vitenzi viwili vyenye kiambishi σύν- katika Kigiriki.
