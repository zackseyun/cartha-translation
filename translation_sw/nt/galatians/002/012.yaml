id: GAL.2.12
reference: Galatians 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: sw
  text: Kwa maana kabla watu fulani[a] kutoka kwa Yakobo[b] hawajafika, alikuwa akila pamoja na watu wa mataifa; lakini walipofika, alianza kujiondoa na kujitenga, kwa sababu aliwaogopa wale wa tohara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baadhi ya watu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka miongoni mwa watu wa Yakobo.” Kigiriki chenyewe hakisemi wazi kama Yakobo aliwatuma rasmi.
    reason: alternative_reading
  - marker: c
    text: Au, “watu wa kundi la tohara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: kabla ... hawajafika
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi uhusiano wa wakati uliomo katika πρό pamoja na kitenzi-jina.
- source_word: τινας
  choice: watu fulani
  rationale: Wingi wa kiume unawahusu watu katika muktadha; ‘watu fulani’ huhifadhi hali ya kutotajwa wazi wao ni nani.
- source_word: ἀπὸ Ἰακώβου
  choice: kutoka kwa Yakobo
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya ἀπό pamoja na jina la mtu, bila kudai kwamba Yakobo aliwatuma rasmi au aliunga mkono msimamo wao.
- source_word: μετὰ τῶν ἐθνῶν
  choice: pamoja na watu wa mataifa
  rationale: Katika matumizi ya Paulo, ἔθνη mara nyingi ni watu wasio Wayahudi. Tafsiri hii haiongezi neno ‘waamini,’ ambalo halimo katika Kigiriki.
- source_word: συνήσθιεν
  choice: alikuwa akila
  rationale: Hali ya kitenzi cha wakati uliopita usiotimilika inaonyesha tendo lililokuwa desturi au likiendelea.
- source_word: ὑπέστελλεν
  choice: alianza kujiondoa
  rationale: Kitenzi kina wazo la kurudi nyuma au kujiondoa; ‘alianza’ husaidia kuonyesha hatua iliyoanza na kuendelea katika muktadha.
- source_word: ἀφώριζεν ἑαυτόν
  choice: na kujitenga
  rationale: Huhifadhi maana ya kujitenga mwenyewe kijamii bila kuongeza sababu isiyotajwa.
- source_word: φοβούμενος
  choice: kwa sababu aliwaogopa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kisababishi ya kishiriki hiki.
- source_word: τοὺς ἐκ περιτομῆς
  choice: wale wa tohara
  rationale: Hufuata usemi wa Kigiriki kwa karibu bila kulazimisha kwamba walikuwa chama rasmi.
theological_decisions:
- issue: Ikiwa ἀπὸ Ἰακώβου inadokeza kwamba Yakobo aliwatuma au aliidhinisha msimamo wao
  choice: kutoka kwa Yakobo
  alternative: kutoka miongoni mwa watu wa Yakobo; waliotumwa na Yakobo
  rationale: Kigiriki kinaweza kuonyesha chanzo au uhusiano, lakini hakisemi wazi kwamba Yakobo aliwatuma rasmi. Tafsiri haimpi Yakobo wajibu mkubwa kuliko maneno ya mstari yanavyoruhusu.
- issue: Ikiwa τοὺς ἐκ περιτομῆς ni jina la chama maalumu
  choice: wale wa tohara
  alternative: watu wa kundi la tohara
  rationale: Andiko linawatambulisha kwa tohara lakini haliwaiti wazi chama; tafsiri kuu huhifadhi uwezekano huo bila kuufanya kuwa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi tofauti kati ya desturi ya awali ya kula pamoja na hatua ya baadaye ya kujiondoa, na pia imeacha wazi uhusiano halisi wa watu hao na Yakobo.
