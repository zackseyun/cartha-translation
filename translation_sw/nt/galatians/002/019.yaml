review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explanatory γάρ ('Kwa maana'), the instrumental force of διὰ νόμου, the compact and deliberately unexpanded relation of dying to the law, the purpose clause, and the perfect force of συνεσταύρωμαι. 'Masihi' appropriately renders Χριστῷ as a title. However, 'nimwishie Mungu' is not idiomatic Standard East African Swahili for ζήσω ('I might live') and can obscure the intended verbal sense.
  naturalness: ‘Kwa maana kwa njia ya Sheria niliifia Sheria’ is formal but clear and suitably reflects Paul's deliberate repetition. ‘Nimwishie Mungu’ is unnatural in this context. ‘Nipate kuishi kwa Mungu’ is established, natural biblical Swahili and retains the concise, relational orientation without expanding it into an interpretive paraphrase.
  terminology: ‘Sheria’ consistently represents νόμος in the Pauline sense, and ‘Masihi’ is an appropriate translation of Χριστός. No doctrinal expansion has been introduced.
  issues:
  - severity: medium
    issue: ‘nimwishie Mungu’ is not a natural rendering of θεῷ ζήσω.
    rationale: The applicative form with an object marker is not idiomatic here for ‘live to God’ and risks making the clause unclear. The source simply states the purpose that Paul may live in relation to God; ‘nipate kuishi kwa Mungu’ expresses this naturally while retaining the source's brevity.
  revised_text: Kwa maana kwa njia ya Sheria niliifia Sheria, ili nipate kuishi kwa Mungu. Nimesulubiwa pamoja na Masihi.
