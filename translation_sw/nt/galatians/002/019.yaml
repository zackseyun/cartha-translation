- from: Kwa maana kwa njia ya Sheria niliifia Sheria, ili nimwishie Mungu. Nimesulubiwa pamoja na Masihi.
  to: Kwa maana kwa njia ya Sheria niliifia Sheria, ili nipate kuishi kwa Mungu. Nimesulubiwa pamoja na Masihi.
  rationale: Only the rendering of θεῷ ζήσω has been revised for idiomatic Standard East African Swahili. ‘Nipate kuishi kwa Mungu’ preserves the purpose introduced by ἵνα and the source's concise God-directed expression, without importing a more specific theological interpretation such as service, benefit, or legal condemnation.
