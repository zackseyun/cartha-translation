base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: sw
  text: Kwa maana kwa njia ya Sheria niliifia Sheria, ili nipate kuishi kwa Mungu. Nimesulubiwa pamoja na Masihi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba kauli hii inaeleza msingi wa hoja iliyotangulia, na ‘Kwa maana’ hudumisha mtiririko huo kwa Kiswahili cha kawaida.
- source_word: διὰ νόμου
  choice: kwa njia ya Sheria
  rationale: διά pamoja na jenitivi ina maana ya chombo au njia hapa; usemi huu unaweka wazi maana hiyo bila kueleza zaidi jinsi Sheria ilivyotenda.
- source_word: νόμῳ
  choice: niliifia Sheria
  rationale: Dativu inawasilishwa kwa kitenzi cha Kiswahili ‘-fia,’ ambacho kwa ufupi kinaonyesha kufa kuhusiana na Sheria na kuvunjika kwa mamlaka yake juu ya mtu.
- source_word: ἀπέθανον
  choice: niliifia
  rationale: Wakati wa aoristi unaonyesha tukio lililotimia; wakati uliopita wa Kiswahili unafaa na kuungana kiasili na yambwa ‘Sheria.’
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa uwazi na kwa lugha ya kawaida.
- source_word: θεῷ ζήσω
  choice: nimwishie Mungu
  rationale: ‘Kumwishia Mungu’ huhifadhi mwelekeo wa dativu na wazo la maisha yanayoelekezwa kwa Mungu, bila kuufanya usemi kuwa matumizi tu ‘kwa ajili ya Mungu.’
- source_word: Χριστῷ
  choice: Masihi
  rationale: Hutafsiri maana ya cheo Χριστός badala ya kukinakili kama jina tu; umbo la Kiswahili halihitaji alama tofauti baada ya ‘pamoja na.’
- source_word: συνεσταύρωμαι
  choice: Nimesulubiwa pamoja na
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotokea na hali yake inayoendelea; ‘nimesulubiwa’ huhifadhi nguvu hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Iwapo kauli ya Paulo kuhusu Sheria ifafanuliwe zaidi katika tafsiri
  choice: Kudumisha usemi mfupi ‘kwa njia ya Sheria niliifia Sheria’
  alternative: ‘Kwa hukumu ya Sheria niliifia Sheria’ au ‘kwa njia ya Sheria nilikufa kuhusu kushika sheria’
  rationale: Kigiriki ni kifupi na kina mvutano wa kiteolojia. Kuongeza ‘hukumu’ au ‘kushika sheria’ kungeamua maana ambayo mstari wenyewe hauisemi wazi.
- issue: Jinsi ya kuwasilisha maisha yanayoelekezwa kwa Mungu
  choice: ‘nimwishie Mungu’
  alternative: ‘niishi kwa ajili ya Mungu’
  rationale: Chaguo hili huhifadhi nguvu ya kimahusiano na kimwelekeo ya dativu θεῷ badala ya kuibana kuwa kusudi au huduma pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Herufi kubwa katika ‘Sheria’ inaonyesha Sheria inayozungumziwa katika hoja ya Paulo; muundo wenye kurudia ‘Sheria’ umehifadhiwa kwa sababu ni sehemu muhimu ya mvutano wa sentensi ya asili.
