  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: sw
  text: Siibatilishi neema ya Mungu; kwa maana, ikiwa haki hupatikana kwa njia ya sheria, basi Masihi alikufa bure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikufa bila kusudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: siibatilishi
  rationale: Kitenzi hiki kinaonyesha kuondoa nguvu au uhalali wa jambo; “siibatilishi” kinaendeleza hoja ya Paulo bila kuifanya iwe tu kukataa kwa maneno.
- source_word: χάριν
  choice: neema
  rationale: “Neema” ni neno la kawaida na lenye hadhi katika Kiswahili kwa fadhili ya Mungu inayotolewa bila kustahiliwa.
- source_word: διὰ νόμου
  choice: kwa njia ya sheria
  rationale: Huwakilisha kwa uwazi muundo wa διά pamoja na hali ya umilikishi na kuacha “sheria” bila maelezo ya ziada ambayo hayapo katika mstari.
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ni tafsiri ya kawaida ya δικαιοσύνη na inaweza kubeba maana zinazohusiana za kuwa sawa mbele za Mungu na uadilifu bila kulazimisha ufafanuzi mmoja.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo; “Masihi” huonyesha kazi hiyo kwa uwazi katika Kiswahili.
- source_word: δωρεὰν
  choice: bure
  rationale: Katika hoja hii neno lina maana ya kutokuwa na kusudi au matokeo; “alikufa bure” ni usemi wa kawaida wenye nguvu unaofaa muktadha.
theological_decisions:
- issue: Uhusiano wa δικαιοσύνη na sheria katika hoja ya Paulo
  choice: Ikiwa haki hupatikana kwa njia ya sheria, kifo cha Masihi kingekuwa bure.
  alternative: “Haki” inaweza kusikika pia katika maana pana ya uadilifu au kutendewa kwa haki.
  rationale: Tafsiri inadumisha kauli ya masharti ya Paulo na mvutano wake wa kiteolojia bila kuongeza maelezo kuhusu namna hasa haki inavyopatikana.
- issue: Hadhi ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika sentensi hii neno la Kigiriki linaeleweka kama cheo; “Masihi” linahifadhi wazi kazi hiyo huku “Kristo” likiwa umbo la kawaida la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata kwa karibu muundo wa hoja ya Kigiriki lakini inaongeza kitenzi “hupatikana,” ambacho kimedokezwa katika kishazi kisicho na kitenzi, ili Kiswahili kisomeke kwa kawaida.
