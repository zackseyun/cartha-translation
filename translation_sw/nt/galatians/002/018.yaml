lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana, niki-
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na muundo wa masharti “nikijenga” huwakilisha εἰ kwa Kiswahili cha kawaida.
- source_word: ἃ ... ταῦτα
  choice: mambo ...
  rationale: “Mambo” huhifadhi wingi wa muundo wa Kiyunani bila kufanya sentensi iwe nzito; kiwakilishi cha uhusiano katika “niliyoyabomoa” kinakamilisha uhusiano huo kiasili.
- source_word: κατέλυσα
  choice: niliyoyabomoa
  rationale: “Kubomoa” huhifadhi sitiari ya jengo na huendana moja kwa moja na “kujenga tena”; haiongezi tafsiri mahususi kama “kufuta.”
- source_word: πάλιν οἰκοδομῶ
  choice: nikijenga tena
  rationale: Huhifadhi kitendo cha kujenga, maana ya πάλιν, na hali ya masharti kwa Kiswahili fasaha.
- source_word: παραβάτην
  choice: mkosaji
  rationale: “Mkosaji” ni neno la sasa, lenye heshima na linaloeleweka kwa urahisi; huhifadhi wazo la mtu anayevunja mpaka au amri bila kulibana neno hilo kwa “sheria” pekee.
- source_word: ἐμαυτὸν συνιστάνω
  choice: ninajionyesha kuwa
  rationale: Huwakilisha kitenzi cha kujirejelea na maana ya kujidhihirisha au kujithibitisha kuwa mtu wa aina fulani, bila kuzidisha nguvu yake kuwa uthibitisho rasmi.
theological_decisions:
- issue: Kitu kinachojengwa tena na kubomolewa
  choice: mambo
  alternative: sheria au masharti ya sheria
  rationale: Kiyunani kinasema kwa ujumla ἃ ... ταῦτα na hakitaji wazi sheria; tafsiri haipaswi kutatua kimya kimya rejeo hilo la kimuktadha.
- issue: Maana ya παραβάτης
  choice: mkosaji
  alternative: mvunja sheria
  rationale: “Mvunja sheria” ingeweza kupunguza maana na kuamua mapema kwamba nomino hiyo inarejelea Torati moja kwa moja; “mkosaji” huhifadhi upeo mpana wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari sambamba ya kubomoa na kujenga tena imehifadhiwa, huku sentensi ikibaki wazi na rahisi kueleweka.
