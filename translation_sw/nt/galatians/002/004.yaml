id: GAL.2.4
reference: Galatians 2:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: sw
  text: Lakini kwa sababu ya ndugu wa uongo walioingizwa kwa siri, ambao waliingia kisiri ili kupeleleza uhuru tulio nao katika Kristo Yesu, kusudi watufanye watumwa—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεισάκτους
  choice: walioingizwa kwa siri
  rationale: Inaonyesha kwamba watu hao waliingizwa kutoka nje kwa njia ya siri, huku ikitofautishwa na kitenzi kinachofuata kuhusu wao wenyewe kuingia kisiri.
- source_word: ψευδαδέλφους
  choice: ndugu wa uongo
  rationale: Inahifadhi taswira ya kifamilia na ukali wa maneno ya Paulo; hapa ni watu waliojidai kuwa waamini wenzao.
- source_word: παρεισῆλθον
  choice: waliingia kisiri
  rationale: Ni usemi wa kawaida unaowasilisha wazi hali ya kuingia kwa kujificha.
- source_word: κατασκοπῆσαι
  choice: kupeleleza
  rationale: Inabeba maana ya uchunguzi wa siri wenye nia mbaya kuliko neno la kawaida kama 'kutazama'.
- source_word: ἐλευθερίαν
  choice: uhuru
  rationale: Ni neno la kawaida na la moja kwa moja linalohifadhi uzito wa kijamii na kitheolojia wa neno la Kigiriki.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Kristo Yesu
  rationale: Katika Kiswahili sanifu cha Biblia, 'Kristo' ni jina la cheo linalotambulika na bado huwasilisha Χριστός bila kufanya kifungu hiki kisikike kisicho cha kawaida.
- source_word: καταδουλώσουσιν
  choice: watufanye watumwa
  rationale: Inaeleza kwa uwazi tendo la kuwatiisha watu katika hali ya utumwa na ni ya asili zaidi hapa kuliko kitenzi kizito 'kututumikisha'.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: kusudi watufanye watumwa
  rationale: Inawasilisha madhumuni yaliyokusudiwa; muundo wa Kigiriki usio wa kawaida wa ἵνα pamoja na wakati ujao hauhitaji kuigwa kwa ukakasi katika Kiswahili.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au umbo lililozoeleka kama jina
  choice: Kristo Yesu
  alternative: Masihi Yesu
  rationale: ‘Kristo’ ni umbo la kawaida, lenye heshima, na linaloeleweka katika Kiswahili sanifu; linahifadhi cheo cha Χριστός bila kulifanya kuwa jina la ukoo. ‘Masihi Yesu’ linawezekana lakini halisikiki la kawaida katika mpangilio huu.
- issue: Utambulisho wa ψευδαδέλφοι
  choice: ndugu wa uongo
  alternative: waamini wa uongo
  rationale: Tafsiri haikati mapema mvutano wa usemi wa Paulo kwa kubadili taswira yake ya kifamilia kuwa ufafanuzi wa moja kwa moja wa hali yao ya kiimani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umeachwa ukiendelea kwa alama ya em dash kwa sababu katika Kigiriki ni sehemu isiyokamilika kisarufi inayounganishwa na mstari unaofuata. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti zilizotolewa katika safu ya Kiingereza hazilingani vizuri na viashiria vyake, na matini ya Kigiriki yenyewe haitaji tanbihi ili kutafsiriwa hapa.
