  source_fidelity: 'Matini ya msingi kwa jumla huwasilisha hoja ya Kigiriki kwa uaminifu: hadhi ya wale waliotambuliwa haibadili msimamo wa Paulo, Mungu hana upendeleo, na hawakuongeza chochote kwake. Hata hivyo, “hata walivyokuwa hapo awali” haisawiri vyema ὁποῖοί ποτε ἦσαν (“vyovyote walivyokuwa zamani”), na urudufu wa τῶν δοκούντων / οἱ δοκοῦντες unafaa kutafsiriwa kwa kauli ileile.'
