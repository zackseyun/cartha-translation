  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: sw
  text: Lakini kwa wale waliohesabiwa kuwa watu muhimu[a]—vyovyote walivyokuwa zamani, haileti tofauti kwangu; Mungu hana upendeleo[b]—kwa maana wale waliohesabiwa kuwa watu muhimu hawakuongeza chochote kwangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioonekana kuwa kitu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “Mungu hapokei uso wa mtu,” nahau yenye maana kwamba Mungu hana upendeleo.
    reason: cultural_note
  - marker: c
    text: Au, “hawakuniwekea lolote zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: wale waliohesabiwa kuwa watu muhimu / wale walioheshimiwa
  rationale: Huwasilisha hadhi waliyodhaniwa kuwa nayo na sauti ya Paulo yenye kujitenga kwa kiasi, bila kudharau uongozi wao moja kwa moja.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: hata walivyokuwa hapo awali
  rationale: Hufanya hali au hadhi yao ya awali kutokuwa na uzito katika hoja ya Paulo, huku ποτε ikiwakilishwa kwa njia ya kawaida.
- source_word: οὐδέν μοι διαφέρει
  choice: si kitu kwangu
  rationale: Ni usemi wa Kiswahili unaoonyesha wazi kwamba hadhi yao haikubadili tathmini ya Paulo.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Mungu hana upendeleo
  rationale: Hutoa maana ya nahau ya Kigiriki kwa Kiswahili cha kawaida badala ya tafsiri sisisi inayoweza kupotosha.
- source_word: ἐμοὶ γὰρ
  choice: kwa maana ... kwangu
  rationale: Hudumisha kiunganishi cha maelezo γάρ na kufanya dative ἐμοί ionekane wazi katika Kiswahili cha asili.
- source_word: οὐδὲν προσανέθεντο
  choice: hawakuongeza chochote kwangu
  rationale: 'Huhifadhi upana wa kitenzi: viongozi hao hawakuongeza jambo kwa ujumbe au mamlaka ya Paulo; uwezekano wa maana ya kutomwekea sharti la ziada umewekwa katika tanbihi.'
theological_decisions:
- issue: Ikiwa kauli ya Paulo inadharau viongozi wa Yerusalemu au inasisitiza kutotegemea hadhi yao
  choice: 'Sauti yenye kujitenga kwa kiasi: “waliohesabiwa kuwa watu muhimu” na “walioheshimiwa”'
  alternative: “wale walioonekana kuwa kitu” au “viongozi waliotambuliwa”
  rationale: 'Tafsiri inadumisha mvutano wa usemi wa Paulo: hakubali hadhi yao iwe kipimo cha injili yake, lakini pia haisemi kwamba uongozi wao haukuwa halali.'
- issue: Maana ya οὐδὲν προσανέθεντο
  choice: hawakuongeza chochote kwangu
  alternative: hawakuniwekea jambo jingine lolote
  rationale: Muktadha unaweza kueleweka kuwa hawakuongeza chochote kwa ujumbe wa Paulo au hawakumwekea masharti zaidi. Matini kuu inadumisha usemi mpana, na tanbihi inataja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Alama za katikati huhifadhi muundo wa sentensi ya Kigiriki na mkato wa hoja ya Paulo; tanbihi zote zimewekewa viashiria katika matini kuu.
