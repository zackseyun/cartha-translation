  - severity: low
    issue: Utoaji usiolingana wa δοκοῦντες katika sehemu mbili
    rationale: Matini inatumia mzizi huohuo mara mbili. Kubadili kutoka “waliohesabiwa kuwa watu muhimu” hadi “walioheshimiwa” hupunguza urudufu wa kimakusudi wa Paulo.
  - severity: low
