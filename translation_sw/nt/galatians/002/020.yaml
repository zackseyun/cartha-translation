id: GAL.2.20
reference: Galatians 2:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: sw
  text: Na si mimi tena ninayeishi, bali Masihi anaishi ndani yangu. Na maisha ninayoishi sasa katika mwili, ninaishi kwa imani katika Mwana wa Mungu[a], aliyenipenda na kujitoa mwenyewe kwa ajili yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uaminifu wa Mwana wa Mungu.”
    reason: Muundo wa Kigiriki unaweza kumaanisha imani katika Mwana wa Mungu au uaminifu wa Mwana wa Mungu.
lexical_decisions:
- source_word: Χριστός
  choice: Masihi
  rationale: Χριστός ni cheo cha kimasiya; “Masihi” hutafsiri cheo hicho kwa Kiswahili cha kawaida badala ya kutumia umbo la mkopo “Kristo.”
- source_word: ὃ δὲ νῦν ζῶ
  choice: maisha ninayoishi sasa
  rationale: Muundo wa Kigiriki ni wa kidokezo na unahitaji kukamilishwa kimawazo; Kiswahili hiki ni cha asili na kinaweka wazi maana iliyodokezwa bila kuongeza tafsiri ya kiteolojia.
- source_word: ἐν σαρκί
  choice: katika mwili
  rationale: Hapa σάρξ inaelekea kumaanisha maisha ya sasa ya kibinadamu yenye mwili, si moja kwa moja ‘asili ya dhambi.’ “Katika mwili” huhifadhi istilahi na upeo huo.
- source_word: πίστει
  choice: imani
  rationale: “Imani” ndiyo maana ya msingi inayofaa hapa, huku uwezekano wa “uaminifu” ukihifadhiwa katika tanbihi kwa sababu ya utata wa muundo wa jenitivi.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: katika Mwana wa Mungu
  rationale: Matini kuu inachukua jenitivi kama yenye kuelekeza imani kwa Mwana wa Mungu; usomaji mwingine halali wa kisarufi umewekwa katika tanbihi.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: kujitoa mwenyewe kwa ajili yangu
  rationale: Hii inaeleza kwa Kiswahili cha asili tendo la hiari la kujikabidhi kwa manufaa ya msemaji, huku “mwenyewe” ikihifadhi msisitizo wa ἑαυτόν.
theological_decisions:
- issue: Maana ya πίστις pamoja na jenitivi katika τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: kwa imani katika Mwana wa Mungu
  alternative: kwa uaminifu wa Mwana wa Mungu
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa imani inaelekezwa kwa Mwana wa Mungu au kuwa unahusu uaminifu wake. Matini kuu hutumia usomaji wa kwanza ulio wazi kwa wasomaji wengi, lakini tanbihi huhifadhi utata halisi na mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Marudio ya “ninaishi/anaishi” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa mstari; “katika mwili” haijafasiriwa kuwa “katika asili ya dhambi.”
