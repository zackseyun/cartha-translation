translation:
  language: sw
  text: Tazameni jinsi herufi nilizowaandikia kwa mkono wangu mwenyewe zilivyo kubwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazameni barua nilivyowaandikia kwa mkono wangu mwenyewe ilivyo ndefu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: Angalieni
  rationale: Ni amri ya wingi inayovuta fikira za wasomaji. “Angalieni” ni ya kawaida, yenye heshima, na inadumisha mwito wa moja kwa moja wa kuzingatia.
- source_word: πηλίκοις
  choice: kubwa
  rationale: Katika muundo huu neno linaeleza ukubwa wa γράμμασιν. “Kubwa” linaonyesha kwa kawaida ukubwa wa herufi bila kufafanua sababu ya mwandiko huo.
- source_word: γράμμασιν
  choice: herufi
  rationale: Hapa wingi huu unaelekea kumaanisha alama za maandishi, yaani herufi za mwandiko, badala ya barua nzima.
- source_word: ὑμῖν
  choice: kuwaandikia
  rationale: Dativu inaonyesha walengwa wa uandishi. Kiambishi “-wa-” katika “kuwaandikia” kinawasilisha kwa Kiswahili maana ya ‘kwenu/ninyi’ kwa mtiririko wa kawaida.
- source_word: ἔγραψα
  choice: nilizotumia kuwaandikia
  rationale: Aoristi imetafsiriwa kwa wakati uliopita. Muundo huu unaunganisha kwa ufasaha herufi kubwa na tendo la Paulo la kuwaandikia, bila kulazimisha tofauti ya nyakati isiyopo katika Kiswahili.
- source_word: τῇ ἐμῇ χειρί
  choice: kwa mkono wangu mwenyewe
  rationale: “Kwa” linaonyesha chombo cha kuandikia, na “mwenyewe” linadumisha msisitizo wa ἐμῇ kwamba Paulo aliandika binafsi.
theological_decisions:
- issue: Maana ya πηλίκοις γράμμασιν
  choice: ukubwa wa herufi za mwandiko
  alternative: urefu wa barua iliyoandikwa
  rationale: Maana ya kawaida ya γράμματα pamoja na kutajwa kwa kuandika kwa mkono wa Paulo inaunga mkono rejeo la ukubwa wa herufi. Hata hivyo, πηλίκος inaweza kueleza ukubwa au kiwango, hivyo tafsiri ya urefu wa barua imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaeleweka kwa msomaji wa kawaida; tanbihi inadumisha utata halisi wa kirai cha Kigiriki.
