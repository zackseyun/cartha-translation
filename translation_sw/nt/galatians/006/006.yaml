  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: sw
  text: Yule anayefundishwa neno na ashiriki katika vitu vyote vyema pamoja na yule anayemfundisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na amgawie yule anayemfundisha vitu vyote vyema”; huenda hii inajumuisha msaada wa mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: na ashiriki
  rationale: Kitenzi hiki cha amri katika wakati wa sasa kinahimiza desturi endelevu ya kushiriki. Kiswahili “na ashiriki” kinahifadhi nguvu ya amri bila kuifunga maana kwa fedha pekee.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno tofauti
  rationale: δέ hapa ni kiunganishi hafifu cha mpito. Katika Kiswahili, kuacha kiunganishi cha wazi kunatoa sentensi ya kawaida bila kuingiza tofauti kali kama “lakini” au maana ya wakati kama “sasa.”
- source_word: ὁ κατηχούμενος
  choice: yule anayefundishwa
  rationale: Kirai hiki cha hali ya kutendwa humtaja mtu anayepokea mafundisho; tafsiri hii ni wazi na haileti maana ya kitaalamu ya baadaye ya kikanisa.
- source_word: τὸν λόγον
  choice: neno
  rationale: Hapa λόγος ni ujumbe au mafundisho ya Kikristo. “Neno” huhifadhi usemi wa Paulo uliozoeleka huku ukiendelea kueleweka.
- source_word: τῷ κατηχοῦντι
  choice: yule anayemfundisha
  rationale: Kirai hiki humtaja anayetoa mafundisho na kinalingana kwa kawaida na “yule anayefundishwa.” Kiwakilishi cha yambwa “-m-” kinaonyesha wazi kwamba anamfundisha mtu huyo.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: vitu vyote vyema
  rationale: Kirai hiki ni kipana na huenda kinajumuisha mali na msaada wa vitendo. “Vitu vyote vyema” ni Kiswahili cha kawaida na hakifungi maana kwa fedha pekee.
theological_decisions:
- issue: Aina ya kushiriki inayoamriwa
  choice: Mwanafunzi anapaswa kushiriki vitu vyema na mwalimu wake, jambo ambalo huenda linajumuisha msaada wa mali.
  alternative: Ushirika wa kiroho tu, bila msaada wa mali.
  rationale: Muundo wa κοινωνέω pamoja na mpokeaji katika hali ya dative na kirai ἐν πᾶσιν ἀγαθοῖς unaelekea kuonyesha kushiriki kwa vitendo, lakini maneno yenyewe ni mapana. Tafsiri haijapunguza amri iwe fedha pekee wala ushirika wa kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “na ashiriki” huhifadhi amri, na tanbihi huonyesha uwezekano wa maana ya kumgawia mwalimu mali bila kuifanya kuwa maana pekee.
