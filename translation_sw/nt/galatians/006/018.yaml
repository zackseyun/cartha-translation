    reason: lexical_clarification
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Ni neno la kawaida na lenye uzito wa kitheolojia katika baraka za Paulo; linaonyesha fadhili ya Mungu inayotolewa bila kustahiliwa.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi cheo cha κύριος katika matumizi ya Kikristo ya awali na ni tafsiri ya kawaida, ya asili katika Kiswahili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός kimsingi ni cheo chenye maana ya ‘Mtiwa-Mafuta’; ‘Masihi’ huhifadhi maana hiyo badala ya kuichukulia tu kama sehemu ya jina.
- source_word: μετὰ
  choice: iwe pamoja na
  rationale: Kigiriki hakina kitenzi katika mtindo huu wa baraka; ‘iwe pamoja na’ hukamilisha sentensi kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: πνεύματος ὑμῶν
  choice: roho yenu
  rationale: Hufuata kwa karibu umoja wa πνεύματος pamoja na kiwakilishi cha wingi ὑμῶν, hivyo kuhifadhi namna Paulo anavyolihutubia jumuiya.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kuhutubia waamini wa kiume na wa kike, huku likihifadhi lugha ya kifamilia ya Paulo.
- source_word: ἀμήν
  choice: Amina
  rationale: Ni umbo la kawaida la kiliturujia katika Kiswahili na huhifadhi tamko la kufunga baraka.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika baraka ya mwisho ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huonyesha wazi kwamba Χριστός ni cheo, yaani Mtiwa-Mafuta. Umbo la jadi ‘Kristo’ limetolewa katika tanbihi kwa sababu limezoeleka sana.
- issue: Jinsi ya kutafsiri ἀδελφοί kwa jumuiya yenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Katika muktadha huu ἀδελφοί inaihusu jumuiya nzima ya waamini. ‘Ndugu’ ni la asili na jumuishi katika Kiswahili bila kuongeza maneno yasiyokuwapo wazi katika Kigiriki; upeo wake umefafanuliwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa baraka umehifadhiwa kwa lugha ya asili: ‘iwe pamoja na roho yenu.’'
