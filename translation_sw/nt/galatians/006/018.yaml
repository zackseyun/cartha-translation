  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: sw
  text: Neema ya Bwana wetu Yesu Masihi[a] iwe pamoja na roho yenu, ndugu[b]. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi” au “Mtiwa-Mafuta.”
    reason: lexical_alternative
  - marker: b
