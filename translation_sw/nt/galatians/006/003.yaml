  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: sw
  text: Kwa maana mtu akidhani kwamba yeye ni kitu, naye si kitu, anajidanganya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anajipotosha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana ... aki-
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na muundo wa masharti wa “aki-” huwasilisha εἰ kwa Kiswahili cha kawaida.
- source_word: δοκεῖ
  choice: akidhani
  rationale: Kitenzi hapa kinahusu jinsi mtu anavyojitathmini, si jinsi anavyoonekana kwa wengine; “kudhani” ni cha asili na wazi.
- source_word: τις
  choice: mtu
  rationale: “Mtu” hutumika kwa maana ya jumla na humjumuisha yeyote bila kuongeza jinsia ambayo haijahitajika katika Kiswahili.
- source_word: εἶναί τι
  choice: kuwa yeye ni kitu
  rationale: Usemi huu huhifadhi tofauti fupi na ya makusudi kati ya “kitu” na “si kitu,” badala ya kufafanua moja kwa moja kuwa mtu huyo anajiona kuwa muhimu.
- source_word: μηδὲν ὤν
  choice: akiwa si kitu
  rationale: Muundo wa hali ya kuendelea huhifadhi uhusiano wa kisarufi wa participio bila kulazimisha maana ya wazi ya upinzani kama “ingawa.”
- source_word: φρεναπατᾷ
  choice: anajidanganya
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kujiongoza mwenyewe katika wazo lisilo la kweli; tanbihi inadokeza maana mahsusi ya udanganyifu wa mawazo.
- source_word: ἑαυτόν
  choice: mwenyewe
  rationale: Kirejeshi hiki humrudisha msomaji kwa mhusika yuleyule na kutilia mkazo kwamba udanganyifu huo unamlenga yeye mwenyewe.
theological_decisions:
- issue: Kauli kuhusu mtu kuwa “kitu” au “si kitu”
  choice: Kuhifadhi maneno “ni kitu” na “si kitu”
  alternative: Kufafanua kuwa “ni mtu wa maana” na “si mtu wa maana”
  rationale: Maneno ya Kigiriki yana ukinzani mfupi na mkali. Tafsiri haielezi iwapo “si kitu” ni hukumu kamili kuhusu thamani ya mtu au ni kukataa tu kujiona kuwa wa maana kuliko wengine; hivyo mvutano wa kauli unabaki wazi.
- issue: Rejeo la jumla kwa mtu
  choice: mtu ... yeye ... mwenyewe
  alternative: yeyote ... mwenyewe
  rationale: Kigiriki kina umoja wa kiume unaowakilisha mtu yeyote. Kiswahili “mtu” ni rejeo la jumla lisilohitaji kuingiza jinsia, huku umoja wa sentensi ukihifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa “kitu ... si kitu” na muundo wa masharti, huku “akiwa” ikiacha uhusiano wa kirai hicho bila kuufanya wazi kupita kiasi.
