  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: sw
  text: Na wote watakaoenenda kwa kanuni hii—amani na rehema ziwe juu yao,[a] na juu ya Israeli wa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi kilichotafsiriwa “watakaoenenda kwa” kinaweza pia kutafsiriwa “watakaofuata kipimo hiki”; kina wazo la kwenda sambamba au kuendelea kulingana na kanuni fulani.
    reason: lexical_alternative
  - marker: b
    text: Usemi “Israeli wa Mungu” unaweza kumaanisha Wayahudi wanaomwamini Kristo, kanisa lote, au watu wa Mungu kwa maana pana. Pia, neno “na” linaweza kuongeza kundi jingine au kulifafanua tena kundi lililotajwa kabla. Tafsiri inadumisha maneno ya Kigiriki bila kuamua mjadala huo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: wote
  rationale: Huwasilisha maana ya jumla ya kiwakilishi hiki kwa Kiswahili cha kawaida; pamoja na kishazi ‘watakaoenenda’ maana yake ni ‘wote ambao’.
- source_word: κανόνι
  choice: kanuni
  rationale: Hapa neno linaonyesha kipimo au mwongozo wa kuongoza mwenendo. ‘Kanuni’ ni fupi, ya kawaida, na haifungi maana kwa amri maalumu.
- source_word: στοιχήσουσιν
  choice: watakaoenenda kwa
  rationale: Huhifadhi sitiari ya kutembea au kwenda kwa kufuata mstari fulani, huku ikisomeka kwa ufasaha katika mtindo wa Paulo.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja katika tamko hili la baraka.
- source_word: ἔλεος
  choice: rehema
  rationale: Ni neno la kawaida la kibiblia na la sasa kwa ἔλεος, hapa likiunganishwa na amani katika baraka.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: juu yao ... na juu ya
  rationale: Hurudia kihusishi kama Kigiriki na kuhifadhi sauti ya tamko la baraka.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Israeli wa Mungu
  rationale: Huhifadhi muundo wa Kigiriki na kutotatua katika tafsiri mjadala kuhusu kundi linalorejelewa.
theological_decisions:
- issue: Kundi linalorejelewa na ‘Israeli wa Mungu’
  choice: Maneno yametafsiriwa moja kwa moja bila kubainisha kama yanamaanisha Wayahudi waaminio, kanisa lote, au watu wa Mungu kwa maana pana.
  alternative: ‘Israeli ya Mungu’ au ufafanuzi unaotaja wazi kundi fulani
  rationale: Kigiriki hakisuluhishi kwa lazima mjadala huo; tafsiri ya moja kwa moja huhifadhi utata na mvutano wa kitheolojia.
- issue: Maana ya καί ya mwisho kabla ya ‘Israeli wa Mungu’
  choice: na juu ya
  alternative: yaani, juu ya / hata juu ya
  rationale: ‘Na’ huacha wazi kama Paulo anaongeza kundi jingine au analitaja tena kundi lilelile kwa namna ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya mwenendo imehifadhiwa kwa ‘enenda,’ na muundo wa baraka umeachwa kuwa wa heshima na wenye urari.
