id: GAL.6.12
reference: Galatians 6:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: sw
  text: Wote wanaotaka kujionyesha vizuri katika mambo ya mwili[a], hao ndio wanaowalazimisha ninyi kutahiriwa, ili tu wasiteswe kwa sababu ya msalaba wa Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujionyesha vizuri kwa nje.”
    reason: lexical_alternative
  - marker: b
    text: Kwa mapokeo, “msalaba wa Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: Wote
  rationale: Hutambulisha kundi lote la watu wanaofanya jambo hilo; ni ya asili katika Kiswahili na inadumisha maana ya ujumla.
- source_word: θέλουσιν
  choice: wanaotaka
  rationale: Huwasilisha nia yao kwa lugha ya kawaida na ya sasa.
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: kuonekana vizuri kwa mambo ya mwili
  rationale: Huhifadhi wazo la kujionyesha kwa namna inayovutia kwa kutegemea mambo ya nje ya kimwili, huku neno la Paulo kuhusu mwili likibaki wazi.
- source_word: οὗτοι
  choice: hao ndio
  rationale: 'Huhifadhi mkazo wa kiwakilishi cha kuonyesha: watu hao hasa ndio wanaofanya shinikizo hilo.'
- source_word: ἀναγκάζουσιν
  choice: wanaowalazimisha
  rationale: Hueleza shinikizo au ulazimishaji unaoendelea kwa uwazi.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: ninyi kutahiriwa
  rationale: Huhifadhi maana ya kutendwa ya kitenzi na kuweka wazi suala halisi la tohara.
- source_word: μόνον ἵνα
  choice: ili tu
  rationale: Ni usemi mfupi na wa asili unaoonyesha kwamba Paulo anataja kusudi lao pekee.
- source_word: τῷ σταυρῷ
  choice: kwa sababu ya msalaba
  rationale: Dativu hapa inaeleweka kwa urahisi kama sababu au msingi wa mateso; tafsiri hii ni wazi katika Kiswahili.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa ina nguvu ya cheo katika kirai cha umilikaji; 'Masihi' huwasilisha maana ya cheo hicho.
- source_word: μὴ διώκωνται
  choice: wasiteswe
  rationale: Huhifadhi hali ya kutendwa na kusudi la kuepuka mateso; 'kuteswa' ni ya asili kwa muktadha wa dini.
theological_decisions:
- issue: Maana ya ἐν σαρκί
  choice: kwa mambo ya mwili
  alternative: kwa nje
  rationale: Tafsiri kuu inadumisha istilahi ya Paulo ya 'mwili' na mvutano wake wa kitheolojia, lakini muktadha unaelekeza hasa kwenye alama za nje za kimwili kama tohara; tanbihi inaonyesha maana hiyo ya kimuktadha.
- issue: Utoaji wa Χριστοῦ katika τῷ σταυρῷ τοῦ Χριστοῦ
  choice: msalaba wa Masihi
  alternative: msalaba wa Kristo
  rationale: Hapa Χριστός inaweza kusikika kama cheo, hivyo 'Masihi' huwasilisha maana yake; 'Kristo' ni tafsiri ya jadi na inastahili kuhifadhiwa katika tanbihi.
- issue: Uhusiano wa τῷ σταυρῷ na διώκωνται
  choice: wateswe kwa sababu ya msalaba
  alternative: wateswe kwa ajili ya msalaba
  rationale: Dativu inaweza kuonyesha sababu au rejeleo. 'Kwa sababu ya' huweka wazi uhusiano wa kisababishi bila kuongeza fundisho lisilokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'hao ndio' unadumisha mkazo wa Kigiriki, na 'ili tu' huonyesha nia pekee inayodaiwa na Paulo.
