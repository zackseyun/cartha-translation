id: GAL.6.10
reference: Galatians 6:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: sw
  text: Kwa hiyo, kadiri tunavyopata nafasi[a], tuwatendee watu wote mema, hasa wale wa familia ya imani[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati tungali na nafasi.” Neno la Kigiriki καιρός linasisitiza wakati unaofaa au fursa, si muda kwa ujumla tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “jamaa ya imani” au “watu wa nyumbani wa imani.” Kigiriki kinatumia lugha ya watu wa nyumba moja kuhusu wale walio katika jumuiya ya waamini.
    reason: lexical_alternative
  - marker: c
    text: “Imani” inaweza pia kueleweka kuwa “ile imani,” yaani ungamo la Kikristo linaloshirikiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Basi
  rationale: Neno hili linaonyesha hitimisho linalotokana na mawaidha yaliyotangulia, kwa mtindo wa kawaida na wenye heshima wa Kiswahili.
- source_word: ὡς καιρὸν ἔχομεν
  choice: maadamu tuna fursa
  rationale: καιρός hapa ni wakati unaofaa au nafasi ya kutenda, si muda kwa ujumla tu. Kauli hii inaeleza kuendelea kutumia nafasi iliyopo.
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: na tuwatendee ... mema
  rationale: Kitenzi cha hali ya kuhimiza kinatoa wito wa pamoja na unaoendelea. Kiswahili cha ‘kuwatendea mema’ ni cha asili na kinawasilisha τὸ ἀγαθόν kama matendo yaliyo mema.
- source_word: πρὸς πάντας
  choice: watu wote
  rationale: Muktadha unaonyesha matendo yanayoelekezwa kwa kila mtu; kutaja ‘watu’ huifanya sentensi iwe wazi bila kupunguza upana wa πάντας.
- source_word: μάλιστα δὲ
  choice: hasa
  rationale: Neno hili linaweka kipaumbele maalumu ndani ya wajibu unaowahusu wote, bila kuwatenga wengine.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: wale walio wa jamaa ya imani
  rationale: ‘Jamaa’ huhifadhi picha ya watu wa nyumba au familia moja, huku ‘imani’ ikihifadhi neno πίστις bila kulibana kuwa taasisi au dhehebu.
theological_decisions:
- issue: Upeo na kipaumbele cha kuwatendea wengine mema
  choice: Watu wote watendewe mema, huku watu wa jamaa ya imani wakipewa uangalifu wa pekee.
  alternative: Amri inawahusu waamini peke yao, au haina kipaumbele chochote kwa waamini wenzao.
  rationale: πρὸς πάντας huweka upeo unaowahusu wote, na μάλιστα huongeza kipaumbele maalumu bila kufuta upeo huo.
- issue: Maana ya τῆς πίστεως
  choice: ‘Imani’ imetumika kama sifa inayotambulisha jamaa hiyo.
  alternative: ‘Ile imani’ kwa maana ya ungamo la pamoja, au ‘uaminifu’ kama sifa.
  rationale: πίστις hapa inaweza kueleweka kama imani inayowaunganisha watu au kama ile imani wanayokiri. Tafsiri kuu inaacha upana huo, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Jamaa ya imani’ imechaguliwa ili kuhifadhi sitiari ya kifamilia bila kutumia muundo mgumu au wa kidhehebu.
