  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: sw
  text: Bebaneni mizigo ya kila mmoja, na hivyo mtaitimiza sheria ya Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “sheria ya Kristo.”'
    reason: Namna mbadala ya kutafsiri cheo Χριστός kulingana na matumizi yaliyozoeleka katika Kiswahili.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ya mtu na mwenzake
  rationale: Kirai hiki cha kawaida katika Kiswahili kinaonyesha wazi tendo la kusaidiana kwa pande zote ndani ya jumuiya.
- source_word: τὰ βάρη
  choice: mizigo
  rationale: Neno hili linadumisha taswira halisi ya uzito huku likieleweka kwa njia ya sitiari kuwa matatizo, mashinikizo, au shida zinazowalemea watu.
- source_word: βαστάζετε
  choice: Bebeni
  rationale: Hii ni amri kwa wingi yenye lugha ya kawaida na ya moja kwa moja; katika muktadha huu inaweza kueleza tendo linaloendelea la kuwasaidia wengine kubeba yanayowalemea.
- source_word: οὕτως
  choice: kwa njia hii
  rationale: Kauli hii inaunganisha wazi amri ya kubebeana mizigo na matokeo yanayofuata bila kuongeza ufafanuzi usio katika matini.
- source_word: ἀναπληρώσετε
  choice: mtaitimiza
  rationale: Wakati ujao wa kitenzi umehifadhiwa, na ‘kuitimiza sheria’ ni muunganiko wa maneno wa asili na unaoeleweka katika Kiswahili.
- source_word: τὸν νόμον
  choice: sheria
  rationale: ‘Sheria’ ndiyo maana ya kawaida ya νόμος na inadumisha uzito wake wa kimaadili na mwangwi wake mpana katika hoja ya Paulo.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa ni cheo kinachomfafanua mwenye sheria; ‘Masihi’ kinawasilisha maana ya cheo hicho na muktadha wake wa Kiyahudi.
theological_decisions:
- issue: Namna ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Matini ya msingi inatumia Χριστός kama cheo katika kirai ‘sheria ya Masihi.’ ‘Kristo’ ni namna iliyozoeleka sana katika mapokeo ya Kiswahili, kwa hiyo imeonyeshwa katika tanbihi bila kuondoa maana ya cheo katika matini kuu.
- issue: Maana ya ‘sheria ya Masihi’
  choice: Imeachwa bila ufafanuzi wa ziada
  alternative: Kanuni au amri ya Masihi
  rationale: Neno νόμος linamaanisha ‘sheria,’ na uhusiano kamili wa sheria hiyo na Masihi haujaelezwa moja kwa moja katika mstari huu. Tafsiri haipaswi kuamua kimya-kimya ikiwa ni amri moja maalumu, mafundisho yote ya Masihi, au kanuni pana ya maisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. ‘Bebeni’ inadumisha taswira ya kubeba, huku ‘ya mtu na mwenzake’ ikitoa maana ya ushirikiano wa pande zote kwa njia ya kawaida katika Kiswahili.
