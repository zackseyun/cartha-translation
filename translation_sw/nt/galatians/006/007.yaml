  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: onyo la wingi la kauli ya kutendwa (μὴ πλανᾶσθε), kauli ya kwamba Mungu hadhihakiwi, na kanuni ya jumla ya kupanda na kuvuna. Uhusiano wa msisitizo kati ya kile kinachopandwa na kile kinachovunwa umehifadhiwa kwa “hicho pia atakivuna.”'
