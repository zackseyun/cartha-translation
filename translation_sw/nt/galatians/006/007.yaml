  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: sw
  text: 'Msidanganyike: Mungu hadhihakiwi, kwa maana chochote mtu anachopanda, hicho pia atakivuna.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Msidanganyike
  rationale: Kauli ya kutendwa na agizo la nafsi ya pili wingi zimehifadhiwa. Neno hili ni la moja kwa moja na la kawaida katika Kiswahili, nalo linaendeleza uzito wa onyo la Paulo.
- source_word: θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός katika kauli hii inayomhusu Mungu mmoja.
- source_word: οὐ μυκτηρίζεται
  choice: hadhihakiwi
  rationale: Kitenzi hiki huonyesha kudhihaki, kukejeli, au kutendea kwa dharau. ‘Hadhihakiwi’ kinahifadhi kauli ya kutendwa na nguvu fupi ya msemo wa Kigiriki bila kuifafanua kupita kiasi.
- source_word: ὃ γὰρ ἐὰν
  choice: kwa maana chochote
  rationale: Muundo huu unaanzisha sharti la jumla lisiloainishwa. ‘Chochote’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, na ‘kwa maana’ huonyesha msingi wa onyo lililotangulia.
- source_word: σπείρῃ
  choice: anachopanda
  rationale: Taswira ya kilimo imehifadhiwa. Katika Kiswahili, ‘kupanda’ hutumika kwa kawaida kuhusu mbegu na inaendana wazi na kuvuna.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Ἄνθρωπος hapa humaanisha mwanadamu yeyote kwa ujumla. ‘Mtu’ ni umoja wa kawaida na wa kijumla katika Kiswahili, bila kuondoa nguvu ya mfano wa mtu mmoja.
- source_word: τοῦτο καὶ θερίσει
  choice: hicho pia atakivuna
  rationale: ‘Hicho’ kinahifadhi nguvu ya kiwakilishi τοῦτο, kikisisitiza kwamba kilekile kilichopandwa ndicho kitakachovunwa; ‘pia’ kinawakilisha καί.
theological_decisions:
- issue: Maana ya kijumla ya ἄνθρωπος
  choice: mtu
  alternative: mwanadamu
  rationale: Neno la Kigiriki ni umoja wenye maana ya mwakilishi wa wanadamu kwa ujumla. ‘Mtu’ lina maana hiyo kwa kawaida katika Kiswahili na halihitaji kuwekewa jinsia ya kiume ambayo haikusudiwi kumtenga yeyote.
- issue: Nguvu ya οὐ μυκτηρίζεται
  choice: Mungu hadhihakiwi
  alternative: Mungu hawezi kudhihakiwa
  rationale: Tafsiri iliyochaguliwa inadumisha kauli ya moja kwa moja ya Kigiriki bila kuongeza wazi wazo la kutowezekana. Hivyo haiondoi mvutano kati ya jitihada za mwanadamu za kumdharau Mungu na uhakika kwamba hawezi kumfanya Mungu kuwa kitu cha dhihaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi wa kimethali pamoja na taswira ya kupanda na kuvuna umehifadhiwa.
