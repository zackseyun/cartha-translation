  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: sw
  text: Kwa maana si kutahiriwa wala kutotahiriwa kulilo jambo la maana[a], bali uumbaji mpya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si kitu” au “haina thamani yoyote.”
    reason: lexical_alternative
  - marker: b
    text: Ingawa haielekei sana katika muktadha huu, “kiumbe kipya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Kwa maana ... wala
  rationale: “Kwa maana” linadumisha kazi ya γάρ ya kueleza hoja iliyotangulia, na muundo wa “... wala ...” unawakilisha jozi ya οὔτε ... οὔτε kwa Kiswahili cha kawaida.
- source_word: περιτομή
  choice: kutahiriwa
  rationale: Nomino-tendo hii ya Kiswahili inaonyesha tendo au hali ya tohara na kuhifadhi uzito wake wa kimwili na wa utambulisho katika muktadha wa Paulo.
- source_word: τί ἐστιν
  choice: si kitu cha maana
  rationale: Usemi huu unaonyesha kutokuwa na umuhimu au thamani ya kuamua jambo. Tafsiri hii ni ya asili katika Kiswahili bila kufafanua zaidi ya Kiyunani.
- source_word: οὔτε ἀκροβυστία
  choice: wala kutotahiriwa
  rationale: Hili ndilo kinyume cha moja kwa moja cha “kutahiriwa” na linaonyesha hali ya mtu asiye tohara, si kiungo cha mwili pekee.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” linaonyesha kwa nguvu tofauti kati ya hali zote mbili zilizotajwa na jambo lenye maana linalofuata.
- source_word: καινὴ κτίσις
  choice: uumbaji mpya
  rationale: “Uumbaji mpya” huhifadhi upana wa κτίσις na wazo la upya wa aina au hali, bila kulibana kuwa mtu mmoja aliyeumbwa upya.
theological_decisions:
- issue: Tofauti kati ya kutahiriwa/kutotahiriwa na uumbaji mpya
  choice: Tafsiri inasema kwamba hali ya kutahiriwa au kutotahiriwa si jambo la maana inapolinganishwa na uumbaji mpya.
  alternative: Kufanya mstari useme wazi kwamba tohara haina thamani ya wokovu au kwamba hali zote mbili ni njia halali za wokovu.
  rationale: Kiyunani kinakanusha umuhimu wa hali zote mbili na kuzitofautisha na “uumbaji mpya.” Tafsiri inadumisha tofauti hiyo bila kuongeza mfumo maalumu wa kimadhehebu au kufafanua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi wa mstari na tofauti inayowekwa na “bali” vimehifadhiwa.
