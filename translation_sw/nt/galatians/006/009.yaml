  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: sw
  text: Tusichoke kutenda mema, kwa maana tutavuna kwa wakati wake tusipokata tamaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καλὸν
  choice: kutenda mema
  rationale: Kirai hiki kinamaanisha kufanya yaliyo mema au yenye sifa njema; “kutenda mema” ni Kiswahili cha kawaida, chenye hadhi, na kinahifadhi maana ya kimaadili.
- source_word: ποιοῦντες
  choice: kutenda
  rationale: Kitenzi kishirikishi cha wakati wa sasa kinaunganishwa kwa kawaida na τὸ καλὸν; katika Kiswahili, muundo “Tusichoke kutenda mema” unaonyesha tendo linaloendelea bila kuwa mzito.
- source_word: μὴ ἐγκακῶμεν
  choice: Tusichoke
  rationale: Kitenzi kinaweza kumaanisha kuchoka, kuvunjika moyo, au kulegea katika kutenda. “Tusichoke” ni mwafaka katika muktadha wa ustahimilivu na kinatofautishwa na usemi wa mwisho.
- source_word: καιρῷ ... ἰδίῳ
  choice: kwa wakati wake
  rationale: Muundo huu unaonyesha wakati ufaao au uliowekwa kwa jambo hilo. “Kwa wakati wake” huhifadhi kwa ufupi wazo la wakati unaofaa bila kubainisha ni nani aliyeuweka.
- source_word: θερίσομεν
  choice: tutavuna
  rationale: “Tutavuna” kinahifadhi sitiari ya kilimo inayotokana na muktadha wa kupanda na kuvuna.
- source_word: μὴ ἐκλυόμενοι
  choice: tusipokata tamaa
  rationale: Kitenzi kishirikishi kinaweza kueleza kulegea, kuzimia, au kuishiwa nguvu. “Tusipokata tamaa” huonyesha nguvu ya masharti na mwito wa kutokusalimu amri, huku kikitofautiana na “Tusichoke.”
theological_decisions:
- issue: Uhusiano kati ya semi mbili za ustahimilivu (ἐγκακῶμεν / ἐκλυόμενοι)
  choice: Kutofautisha semi hizo kwa “Tusichoke” na “tusipokata tamaa.”
  alternative: “Tusivunjike moyo” na “tusilegee,” au kurudia neno lilelile katika sehemu zote mbili.
  rationale: Paulo ametumia maneno mawili yanayohusiana lakini si sawa kabisa. Tafsiri hii inadumisha tofauti ya balagha na msisitizo wa kustahimili bila kuingiza hitimisho la kimadhehebu.
- issue: Maana ya καιρῷ ἰδίῳ
  choice: “kwa wakati wake”
  alternative: “kwa wakati ufaao” au “wakati uliowekwa utakapofika”
  rationale: Kifungu kinaweza kueleweka kuwa wakati unaofaa au wakati wake wenyewe. “Kwa wakati wake” huhifadhi kwa kiasi fulani upeo huo wa maana bila kuufanya wazi zaidi kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida kwa wasomaji wengi; sitiari ya kuvuna imehifadhiwa. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti muhimu za kileksika zinaweza kuhifadhiwa moja kwa moja katika matini bila kuifanya isieleweke.
