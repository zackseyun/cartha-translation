  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: sw
  text: Lakini kila mmoja na aipime kazi yake mwenyewe; ndipo atakuwa na sababu ya kujisifia kuhusu yeye mwenyewe tu, wala si kuhusu mtu mwingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργον
  choice: kazi
  rationale: “Kazi” ni neno pana na la kawaida linaloweza kumaanisha mwenendo au matendo ya mtu bila kulibana kuwa tendo moja tu.
- source_word: δοκιμαζέτω
  choice: na aipime
  rationale: Huhifadhi nguvu ya agizo na wazo la kuchunguza ili kutambua ubora wa jambo, bila kudokeza mapema kuwa matokeo yatakuwa mazuri.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya kila mtu mmoja mmoja na kupatana na miundo ya umoja inayofuata.
- source_word: ἑαυτοῦ
  choice: yake mwenyewe
  rationale: Huonyesha wazi kuwa anayepimwa ni kazi ya mtu huyo mwenyewe.
- source_word: καύχημα
  choice: sababu ya kujisifia
  rationale: καύχημα inaweza kumaanisha jambo au msingi wa kujisifia, si kitendo cha kujisifia pekee; tafsiri hii huhifadhi upana huo kwa Kiswahili cha sasa.
- source_word: εἰς ἑαυτὸν μόνον
  choice: kwa habari yake mwenyewe tu
  rationale: Huhifadhi mkazo wa kujitazama mwenyewe na nguvu ya μόνον bila kuifanya kauli isikike kana kwamba mtu anajisifia ndani yake mwenyewe.
- source_word: τὸν ἕτερον
  choice: kwa kujilinganisha na mtu mwingine
  rationale: Katika muktadha, εἰς ... τὸν ἕτερον inaonyesha kuwa msingi wa kujisifia hautokani na kumtazama au kujilinganisha na mwingine; msemo huu ni wa asili na unaweka wazi uhusiano huo.
- source_word: δέ
  choice: Lakini
  rationale: Huonyesha badiliko lenye utofauti mdogo kutoka maonyo yaliyotangulia kwenda katika wajibu wa mtu kuchunguza kazi yake.
theological_decisions:
- issue: Maana ya καύχημα katika muktadha wa Paulo
  choice: sababu ya kujisifia
  alternative: jambo la kujisifia; fahari
  rationale: Huhifadhi uwezekano kwamba neno linamaanisha msingi au jambo la kujisifia, bila kulifanya moja kwa moja kuwa “kiburi” chenye maana hasi wala kuamua kwamba kujisifia huko kunakubalika mbele za Mungu.
- issue: Ulinganisho unaodokezwa na εἰς τὸν ἕτερον
  choice: si kwa kujilinganisha na mtu mwingine
  alternative: si kwa habari ya mtu mwingine
  rationale: Muktadha unatofautisha kupima kazi ya mtu mwenyewe na kuifanya kazi ya mwingine kuwa kipimo. Tafsiri hii inaeleza uhusiano unaodokezwa bila kuongeza hukumu ya kitheolojia.
- issue: Umoja wa jumla katika ἕκαστος na viwakilishi virejeshi
  choice: kila mmoja ... yake mwenyewe ... yake mwenyewe
  alternative: kila mtu ... yao wenyewe
  rationale: Kiswahili hutumia kwa kawaida umoja wa ngeli ya mtu katika kauli ya jumla, hivyo maana ya kila mtu mmoja mmoja na umbo la chanzo vinahifadhiwa kwa lugha asilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agizo “na aipime” ni wa kibiblia lakini bado unaeleweka; “sababu ya kujisifia” huhifadhi mvutano wa kaύχημα, na “kwa kujilinganisha” hufanya utofauti na mtu mwingine uwe wazi kwa msomaji wa kawaida.
