review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the explanatory connection (γάρ), the emphatic contrast that the circumcised group themselves do not keep the law, the purpose clause, and the literal bodily reference of σάρξ. However, “kwa sababu ya miili yenu” makes ἐν τῇ ὑμετέρᾳ σαρκὶ an explicit causal expression and is less faithful to Paul’s wording than an idiomatic expression of boasting in/about their bodies.
  naturalness: “Wale waliotahiriwa” is more natural Standard East African Swahili as a label for persons characterized by circumcision. “Wajivunie miili yenu” is clear, current, and naturally expresses the basis/object of their boast in this context.
  terminology: “Sheria,” “kutahiriwa,” and “kujivunia” are appropriate in the Pauline and bodily-circumcision context. The revision avoids reading σάρξ as sinful nature or adding a causal relation not explicit in the Greek.
  issues:
  - severity: medium
    issue: “kwa sababu ya miili yenu” over-specifies the force of ἐν τῇ ὑμετέρᾳ σαρκὶ.
    rationale: The Greek uses ἐν (‘in,’ with the bodily flesh as the sphere/basis of boasting), not a distinct causal phrase. While causation is contextually related, “kwa sababu ya” narrows the construction interpretively. “Wajivunie miili yenu” is idiomatic and preserves the contextual bodily reference without that added specification.
  - severity: low
    issue: “wale wanaotahiriwa” can sound like people presently undergoing the procedure.
    rationale: The substantival present participle functions as a group label. In idiomatic Swahili, “wale waliotahiriwa” naturally denotes those characterized as circumcised, while the footnote can retain the more formally present alternative.
  revised_text: Kwa maana hata wale waliotahiriwa wenyewe hawaishiki Sheria,[a] bali wanataka ninyi mtahiriwe ili wajivunie miili yenu.
  revised_footnotes:
  - marker: a
    text: Au “wale wanaotahiriwa.” Kigiriki hutumia participle kama jina la kundi, ambayo inaweza kutafsiriwa “wale waliotahiriwa” au “wale wanaotahiriwa.”
    reason: lexical_alternative
  revision_rationale: The revision restores a closer and natural rendering of ἐν τῇ ὑμετέρᾳ σαρκὶ by expressing the intended boast as being in/about the Galatians’ bodies, in the immediate context of circumcision. It also uses the more idiomatic Swahili group label “wale waliotahiriwa,” with a footnote preserving the Greek participial alternative. No doctrinal interpretation is added.
