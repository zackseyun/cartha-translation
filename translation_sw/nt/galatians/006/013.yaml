  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: sw
  text: Kwa maana hata wale waliotahiriwa wenyewe hawaishiki Sheria,[a] bali wanataka ninyi mtahiriwe ili wajivunie miili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wanaotahiriwa.” Kigiriki hutumia participle kama jina la kundi, ambayo inaweza kutafsiriwa “wale waliotahiriwa” au “wale wanaotahiriwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Kwa maana hata ... hawa-
  rationale: “Kwa maana” huhifadhi nguvu ya maelezo ya γάρ, na “hata ... hawa-” huwasilisha mkazo wa οὐδέ kwa Kiswahili cha kawaida.
- source_word: οἱ περιτεμνόμενοι
  choice: wale wanaotahiriwa
  rationale: Kirai hiki kinadumisha hali ya kitenzi-jina ya participle ya wakati uliopo bila kukifasiri zaidi kuwa ‘wanaohimiza tohara.’
- source_word: αὐτοὶ
  choice: wenyewe
  rationale: 'Huhifadhi mkazo kwa watu hao: wao wenyewe hawaishiki Sheria.'
- source_word: νόμον φυλάσσουσιν
  choice: wanaishiki Sheria
  rationale: ‘Kuishika Sheria’ ni usemi wa kawaida wa kibiblia unaomaanisha kuitii; herufi kubwa inaonyesha Sheria ya Musa katika muktadha huu.
- source_word: ἀλλὰ θέλουσιν
  choice: bali wanataka
  rationale: ‘Bali’ huonyesha tofauti iliyo wazi, na ‘wanataka’ huwasilisha maana ya nia kwa lugha ya sasa.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: ninyi mtahiriwe
  rationale: Huhifadhi maana ya kutendwa ya infinitive na kutaja ‘ninyi’ kwa ajili ya mkazo na uwazi.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: kwa sababu ya miili yenu
  rationale: Katika muktadha wa tohara, σάρξ inahusu mwili halisi na alama inayoonekana. Kiswahili ‘kwa sababu ya miili yenu’ huwasilisha msingi wa kujisifu kwa kawaida kuliko tafsiri ngumu ‘katika nyama yenu.’
- source_word: καυχήσωνται
  choice: wajisifu
  rationale: ‘Kujisifu’ huhifadhi maana hasi ya kujivunia mafanikio au sifa inayopatikana kupitia wengine.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha huu
  choice: mwili halisi unaopokea alama ya tohara
  alternative: asili ya dhambi
  rationale: Muktadha wa karibu unahusu tohara, kwa hiyo neno hili linaelekea kwenye miili ya Wagalatia, si hali ya ndani ya dhambi.
- issue: Nguvu ya περιτεμνόμενοι
  choice: wale wanaotahiriwa
  alternative: wale wanaohimiza tohara
  rationale: Tafsiri inawaeleza kwa tohara kama ilivyo katika Kigiriki, bila kuingiza moja kwa moja utambulisho wao kama watetezi wa tohara, ingawa muktadha unaonyesha hivyo.
- issue: Upeo wa νόμος
  choice: Sheria
  alternative: sheria kwa maana ya jumla
  rationale: Katika hoja ya Paulo kuhusu tohara, neno linaeleweka kuwa Sheria ya Musa; hata hivyo sentensi haifafanui ni masharti gani hasa hawashiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida, huku mkazo wa ‘wenyewe’ na uhusiano wa hoja wa ‘Kwa maana’ vikihifadhiwa.
