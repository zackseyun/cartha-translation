revisions:
- from: Kwa maana hata wale wanaotahiriwa wenyewe hawaishiki Sheria,[a] bali wanataka ninyi mtahiriwe ili wajisifu kwa sababu ya miili yenu.
  to: Kwa maana hata wale waliotahiriwa wenyewe hawaishiki Sheria,[a] bali wanataka ninyi mtahiriwe ili wajivunie miili yenu.
  rationale: The revision restores a closer and natural rendering of ἐν τῇ ὑμετέρᾳ σαρκὶ by expressing the intended boast as being in/about the Galatians’ bodies, in the immediate context of circumcision. It also uses the more idiomatic Swahili group label “wale waliotahiriwa,” with a footnote preserving the Greek participial alternative. No doctrinal interpretation is added.
