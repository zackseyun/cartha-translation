  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: sw
  text: Tangu sasa, mtu yeyote asinitaabishe, kwa maana ninabeba mwilini mwangu alama za Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chapa za Yesu”; neno hili linaweza kumaanisha alama za mwilini zinazoonyesha umiliki au uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati kuanzia sasa na kuendelea.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: mtu yeyote asinitaabishe
  rationale: Katika muundo huu, κόπους παρέχειν humaanisha kumsababishia mtu taabu au usumbufu. Kauli hii inatoa katazo la nafsi ya tatu kwa Kiswahili cha asili.
- source_word: τὰ στίγματα
  choice: alama
  rationale: Neno hili linaweza kumaanisha alama za mwilini, zikiwemo alama zilizowekwa kuonyesha umiliki au utii. 'Alama' halifungii maana kwenye makovu pekee.
- source_word: τοῦ Ἰησοῦ
  choice: za Yesu
  rationale: Huhifadhi uhusiano mpana wa umilikishi katika Kigiriki bila kuamua wazi ikiwa ni alama zinazotokana na Yesu, zilizopatikana kwa ajili yake, au zinazoonyesha kuwa Paulo ni wake.
- source_word: ἐν τῷ σώματί μου
  choice: mwilini mwangu
  rationale: Hii ni kauli ya asili katika Kiswahili kwa alama zilizopo kwenye mwili, huku ikilingana na muundo wa Kigiriki.
- source_word: βαστάζω
  choice: ninabeba
  rationale: Hutoa maana ya kubeba au kuwa nazo mwilini na kudumisha uzito wa kauli ya Paulo.
theological_decisions:
- issue: Asili na maana ya στίγματα za Paulo
  choice: alama za Yesu
  alternative: makovu ya mateso; chapa zinazoonyesha kuwa Paulo ni mali ya Yesu; mfano wa mateso ya kitume na kujitambulisha na Yesu
  rationale: Mstari unaweza kudokeza alama halisi za mateso ambazo pia zinaonyesha uhusiano au utii kwa Yesu, lakini hauamui kwa uwazi maana moja tu. Tafsiri kuu inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; 'asinitaabishe' ni wa asili zaidi kuliko tafsiri halisi ya 'asiniletee taabu.'
