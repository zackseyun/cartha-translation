id: GAL.6.1
reference: Galatians 6:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: sw
  text: Ndugu[a], hata mtu akinaswa katika kosa fulani[b], ninyi mlio wa kiroho mrejesheni mtu huyo kwa roho ya upole[c], huku kila mmoja wenu akijiangalia mwenyewe, usije ukajaribiwa wewe pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “Ndugu” lina umbo la kiume la wingi, lakini linaweza kutumiwa kuwaita waamini wenzake, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au “akizidiwa” au “akinaswa kwa ghafula” katika kosa fulani.
    reason: alternative_reading
  - marker: c
    text: “Roho ya upole” inaweza kumaanisha moyo au mwelekeo wenye upole; pia inaweza kuwa na mwangwi wa upole unaotokana na Roho.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida na lenye heshima la kuwaita waamini wenzake, na linaweza kujumuisha wanaume na wanawake huku tanbihi ikionyesha umbo la kiume la Kigiriki.
- source_word: ἐὰν καὶ
  choice: hata ... aki-
  rationale: 'Muundo huu wa Kiswahili unaonyesha sharti lenye maana ya kukubali uwezekano: “hata mtu akinaswa.”'
- source_word: προλημφθῇ
  choice: akinaswa
  rationale: “Naswa” linaweza kueleza mtu aliyefikiwa au kushikwa na kosa, bila kuamua kabisa kama aligunduliwa akilitenda au kosa lilimzidi kwa ghafula.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: ἄνθρωπος humaanisha binadamu kwa ujumla, si lazima mwanamume; “mtu” ni tafsiri sahihi na ya kawaida katika Kiswahili.
- source_word: ἔν τινι παραπτώματι
  choice: katika kosa fulani
  rationale: “Kosa” linaonyesha hatua potovu au uasi wa kimaadili, na “fulani” linaakisi τινι bila kufanya kauli kuwa ya jumla kupita kiasi.
- source_word: οἱ πνευματικοὶ
  choice: ninyi mlio wa kiroho
  rationale: Tafsiri hii inaacha wazi kama mkazo ni ukomavu wa kiroho au maisha yanayoongozwa na Roho, kama ilivyo katika Kigiriki.
- source_word: καταρτίζετε
  choice: mrejesheni
  rationale: Kitenzi kina maana ya kumrudisha mtu katika hali inayofaa au kumtengeneza; “mrejesheni” ni agizo la wazi na la kawaida.
- source_word: τὸν τοιοῦτον
  choice: mtu huyo
  rationale: Hurejelea moja kwa moja mtu aliyetajwa katika kishazi kilichotangulia na kuhifadhi umoja wake.
- source_word: ἐν πνεύματι πραΰτητος
  choice: kwa roho ya upole
  rationale: Muundo huu unahifadhi uwezekano wa kuelewa “roho” kuwa mwelekeo wa ndani au kuwa na mwangwi wa kazi ya Roho Mtakatifu, bila kuamua kimabavu.
- source_word: σκοπῶν σεαυτόν
  choice: huku ukijiangalia mwenyewe
  rationale: Hubakiza mabadiliko ya Kigiriki kutoka agizo la wingi kwenda onyo la umoja, likimwelekeza kila anayerejesha ajichunge binafsi.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: usije ukajaribiwa wewe pia
  rationale: “Jaribiwa” linafaa katika muktadha wa hatari ya kuanguka katika dhambi, na “wewe pia” linaonyesha udhaifu unaoshirikiwa.
theological_decisions:
- issue: Walengwa wa Ἀδελφοί na maana ya ἄνθρωπος
  choice: Kutumia “Ndugu” na “mtu,” huku tanbihi ikifafanua umbo la Kigiriki la Ἀδελφοί.
  alternative: “Ndugu wanaume” na “mwanamume”
  rationale: Ἀδελφοί ni umbo la kiume lakini linaweza kuliita kundi lenye waamini wa jinsia zote; ἄνθρωπος ni neno la jumla kwa binadamu, si ἀνήρ linaloweza kumaanisha mwanamume. Kiswahili “mtu” hakifuti taarifa ya kijinsia iliyomo katika neno la chanzo kwa sababu neno lenyewe si mahususi kwa mwanamume.
- issue: Nuansi ya προλημφθῇ
  choice: “akinaswa,” pamoja na tanbihi yenye maana mbadala
  alternative: “akikutikana akitenda” au “akizidiwa kwa ghafula”
  rationale: Kitenzi kinaweza kuashiria kugunduliwa katika kosa au kufikiwa na kulizidiwa nalo. Tafsiri kuu haifungi uwezekano huo mmoja tu.
- issue: Maana ya πνεῦμα katika “πνεύματι πραΰτητος”
  choice: “kwa roho ya upole,” bila herufi kubwa katika “roho”
  alternative: “kwa upole unaotokana na Roho”
  rationale: Kigiriki kinaweza kuelekeza kwenye hali ya ndani ya upole, huku muktadha wa Wagalatia pia ukiruhusu mwangwi wa tunda la Roho. Tafsiri kuu inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha agizo la kichungaji bila lugha nzito ya kitaalamu. Mabadiliko kutoka wingi “ninyi/mrejesheni” kwenda umoja “ukijiangalia/usije” yamehifadhiwa kwa sababu yako katika chanzo na yanamlenga kila mtu binafsi.
