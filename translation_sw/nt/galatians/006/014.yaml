base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: sw
  text: Lakini mimi, hasha! nisijivunie kitu chochote isipokuwa msalaba wa Bwana wetu Yesu Masihi,[a] ambao kwa njia yake ulimwengu umesulubiwa kwangu, nami nimesulubiwa kwa ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye kwa yeye ulimwengu umesulubiwa kwangu,” ikiwa kiwakilishi kinachukuliwa kumrejelea Bwana Yesu Masihi badala ya msalaba.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: nisije kamwe
  rationale: Kauli hii ya kukataa kwa nguvu inaelezwa kwa Kiswahili cha kawaida kwa ‘nisije kamwe,’ huku ikihifadhi rejeleo la msemaji binafsi.
- source_word: καυχᾶσθαι
  choice: nikajivunia
  rationale: ‘Kujivunia’ ni kitenzi cha kawaida na cha sasa kinachoonyesha kujisifu au kuweka fahari katika jambo fulani katika muktadha huu.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Inaonyesha kwamba msalaba pekee ndio msingi halali wa kujivunia.
- source_word: σταυρῷ
  choice: msalaba
  rationale: Ni tafsiri iliyozoeleka na inayofaa katika muktadha wa kusulubiwa kwa Yesu na hoja ya Paulo.
- source_word: κυρίου
  choice: Bwana
  rationale: Hifadhi ya cheo cha κύριος kwa lugha ya kawaida ya Agano Jipya.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ina maana ya cheo ‘Masihi’; kutafsiri maana hiyo huiweka wazi kwa msomaji wa Kiswahili badala ya kuitoa kama jina lisiloelezwa.
- source_word: δι’ οὗ
  choice: ambao kwa huo
  rationale: Kiwakilishi cha Kigiriki kinaweza kurejelea msalaba ulio karibu zaidi; muundo huu wa Kiswahili unautaja msalaba kama njia ambayo kwa hiyo mabadiliko hayo yalitokea, huku tanbihi ikihifadhi uwezekano wa kumrejelea Yesu Masihi.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni kisawe cha kawaida na kipana kinachohifadhi uzito wa kimuktadha wa mfumo wa ulimwengu ulio mbali na Mungu bila kuufafanua kupita maandishi.
- source_word: ἐσταύρωται
  choice: umesulubiwa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoendelea na kuhifadhi sitiari ya kusulubiwa.
- source_word: κἀγὼ κόσμῳ
  choice: nami kwa ulimwengu
  rationale: Kitenzi kilichoachwa katika Kigiriki kinaeleweka kutoka kishazi kilichotangulia; kuacha vivyo hivyo kunahifadhi ulinganifu mfupi na bado kunaeleweka kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika ‘Ἰησοῦ Χριστοῦ’
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Katika muundo huu Χριστός hubeba maana ya cheo cha yule aliyetiwa mafuta. ‘Masihi’ huhifadhi maana hiyo bila kuingiza msimamo wa kimadhehebu.
- issue: Kirejelewa na nguvu ya δι’ οὗ
  choice: 'msalaba ndio kirejelewa: ‘ambao kwa huo’'
  alternative: 'Yesu Masihi ndiye kirejelewa: ‘ambaye kwa yeye’'
  rationale: σταυρῷ ndilo neno la karibu zaidi na linaafikiana kisarufi na kiwakilishi cha Kigiriki; hata hivyo, kwa kuwa Yesu Masihi pia ni wa kiume kisarufi na anaweza kueleweka kuwa kirejelewa, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa mwisho umehifadhi ulinganifu wa Kigiriki; tanbihi pekee inatunza utata halisi wa δι’ οὗ.
