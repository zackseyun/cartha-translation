translation:
  language: sw
  text: Kwa maana kila mtu ataubeba mzigo wake mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atabeba mzigo wake mwenyewe.” Kigiriki hapa kinatumia φορτίον (“mzigo”), neno tofauti na βάρη (“mizigo”) katika mstari wa 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: kila mtu
  rationale: Ni kiwakilishi cha kugawa kinachomhusu kila mmoja binafsi. “Kila mtu” ni Kiswahili cha kawaida na huhifadhi mkazo huo bila kulazimisha jinsia ya kisarufi ya Kigiriki katika lugha lengwa.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa kauli inayotangulia. “Kwa maana” huhifadhi uhusiano huo wa kimantiki kwa lugha ya kawaida na yenye heshima.
- source_word: τὸ ἴδιον
  choice: wake mwenyewe
  rationale: ἴδιον husisitiza kile kilicho cha mtu binafsi. “Wake mwenyewe” huonyesha umilikaji na msisitizo huo kwa uwazi.
- source_word: φορτίον
  choice: mzigo
  rationale: Neno hili humaanisha kitu kinachobebwa, yaani mzigo. Katika Kiswahili “mzigo” ni chaguo la asili na halilazimishi maana maalumu ya kiroho au ya kimaadili; tanbihi inaeleza tofauti ya neno la Kigiriki na βάρη katika mstari wa 2.
- source_word: βαστάσει
  choice: ataubeba
  rationale: Ni kitenzi cha wakati ujao, nafsi ya tatu umoja. “Ataubeba” huhifadhi wakati ujao na taswira halisi ya kubeba mzigo.
theological_decisions:
- issue: Uhusiano wa Wagalatia 6:5 na 6:2
  choice: Kutafsiri φορτίον kama “mzigo” na kueleza katika tanbihi kwamba neno lake la Kigiriki ni tofauti na βάρη katika mstari wa 2, bila kuondoa mvutano wa kifungu.
  alternative: Kutumia tafsiri tofauti za Kiswahili kwa lazima ili kutenganisha maneno hayo, au kuufafanua mstari huu waziwazi kuwa hukumu ya mwisho.
  rationale: Kigiriki kinatumia nomino tofauti katika mistari hiyo miwili, lakini Kiswahili hakina jozi ya kawaida inayoweza kuhifadhi tofauti hiyo kikamilifu bila kuongeza tafsiri. Matini kuu inabaki ya kawaida, huku tanbihi ikihifadhi ushahidi wa kileksika na kuepuka kuingiza suluhisho maalumu la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida; “kila mtu” inawakilisha kila mmoja bila kuingiza jinsia isiyohitajika katika Kiswahili.
