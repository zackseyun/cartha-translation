base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: sw
  text: Kwa maana anayepanda katika mwili wake mwenyewe[a] atavuna uharibifu[b] kutoka kwa mwili; lakini anayepanda kwa Roho[c] atavuna uzima wa milele kutoka kwa Roho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya asili yake ya dhambi.” Neno la Kigiriki sarx linaweza kumaanisha mwili halisi au, katika utofauti wa kimaadili wa Paulo, mwelekeo wa mwanadamu aliyeanguka unaompinga Roho.
    reason: lexical_alternative
  - marker: b
    text: Au, “maangamizi” au “kuoza.” Neno la Kigiriki linaweza kumaanisha kuharibika, maangamizi, au kuoza.
    reason: lexical_alternative
  - marker: c
    text: Yaani, Roho Mtakatifu. Wengine hutafsiri “roho,” lakini katika Wagalatia utofauti huu kwa kawaida humrejelea Roho wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu, kiunganishi kinaeleza msingi wa himizo lililotangulia; “Kwa maana” ni ya kawaida na huhifadhi nguvu hiyo ya ufafanuzi.
- source_word: ὁ σπείρων
  choice: anayepanda
  rationale: Huhifadhi taswira ya kilimo na maana ya jumla ya nomino inayowakilishwa na kitenzi-jina cha Kigiriki.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: kwa mwili wake mwenyewe
  rationale: “Kwa” ni usemi mfupi na wa kawaida katika taswira ya kupanda kwa mwelekeo au kusudi fulani. “Mwili” huhifadhi istilahi ya Paulo na utata wake wa kimaana, huku “wake mwenyewe” ikionyesha msisitizo wa ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: kutoka kwa mwili
  rationale: Hutambulisha mwili kuwa chanzo cha mavuno na kudumisha ulinganifu na “kutoka kwa Roho.”
- source_word: θερίσει
  choice: atavuna
  rationale: Huhifadhi uhusiano wa moja kwa moja wa taswira kati ya kupanda na kuvuna.
- source_word: φθοράν
  choice: uharibifu
  rationale: Neno hili linaweza kujumuisha kuharibika, kuoza, au maangamizi. “Uharibifu” ni pana vya kutosha bila kulibana kuwa kuoza kwa mwili tu au kutoweka kabisa.
- source_word: ὁ δὲ σπείρων
  choice: lakini anayepanda
  rationale: “Lakini” huonyesha wazi utofauti wa vifungu viwili, na kurudiwa kwa “anayepanda” huhifadhi usawaziko wa sentensi.
- source_word: εἰς τὸ πνεῦμα
  choice: kwa Roho
  rationale: Katika utofauti wa mwili na Roho ndani ya Wagalatia, rejeo linalowezekana zaidi ni Roho wa Mungu. Herufi kubwa huonyesha rejeo hilo huku tanbihi ikitaja uwezekano mwingine.
- source_word: ἐκ τοῦ πνεύματος
  choice: kutoka kwa Roho
  rationale: Huhifadhi maana ya chanzo iliyo katika ἐκ na ulinganifu wake na “kutoka kwa mwili.”
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni usemi wa kawaida, wa asili, na sahihi katika Kiswahili kwa dhana ya maisha yasiyo na mwisho na maisha ya enzi ijayo.
theological_decisions:
- issue: Maana ya σάρξ katika utofauti wa kimaadili wa Paulo
  choice: mwili
  alternative: asili yake ya dhambi
  rationale: Ingawa muktadha ni wa kimaadili, “mwili” huhifadhi msamiati wa Paulo na mvutano wa kitheolojia badala ya kuufafanua kabisa katika matini kuu.
- issue: Rejeo la πνεῦμα
  choice: Roho
  alternative: roho
  rationale: Katika Wagalatia, hasa inapolinganishwa na mwili, πνεῦμα kwa kawaida humrejelea Roho wa Mungu. Hata hivyo, kwa kuwa maandishi ya kale hayakuwa na tofauti ya herufi kubwa na ndogo kama hii, uwezekano wa “roho” umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wenye uwiano wa “anayepanda… atavuna” umehifadhiwa, pamoja na taswira ya kilimo na utofauti wa mwili na Roho.
