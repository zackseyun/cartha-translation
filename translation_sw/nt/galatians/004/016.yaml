  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: sw
  text: Je, basi, nimekuwa adui yenu kwa kuwaambia ukweli[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kusema ukweli kwenu.” Kitenzi cha Kigiriki ἀληθεύων kinaweza kumaanisha kusema ukweli au kusema kwa ukweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: basi
  rationale: Kiunganishi hiki kinatoa hitimisho kutokana na yaliyotangulia; “basi” ni mpito wa kawaida wa hoja katika Kiswahili na unafaa katika swali hili la balagha.
- source_word: ἐχθρὸς
  choice: adui
  rationale: Neno hili limetumiwa kama nomino ya kiarifu kumaanisha mtu anayeonwa kuwa mwenye uhasama; “adui” ni tafsiri wazi na ya kawaida.
- source_word: ὑμῶν
  choice: yenu
  rationale: Kiwakilishi cha umilikaji kinategemea “adui”; “adui yenu” huonyesha kwa kawaida maana ya Kigiriki “adui wa ninyi.”
- source_word: γέγονα
  choice: nimekuwa
  rationale: Kauli timilifu ya γίνομαι huonyesha mabadiliko yaliyotokea na hali inayodumu sasa; “nimekuwa” huhifadhi vipengele hivyo.
- source_word: ἀληθεύων
  choice: kwa kuwaambia ukweli
  rationale: Kivumishi-tene hiki kinaweza kumaanisha kusema kweli au kuwasilisha yaliyo ya kweli. Katika muktadha wa Paulo kusema moja kwa moja na Wagalatia, “kwa kuwaambia ukweli” ni ya asili na huonyesha tendo la mawasiliano, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: ὑμῖν
  choice: kuwaambia
  rationale: Kiwakilishi cha kutoa kinaonyesha wale wanaoelekezewa maneno. Katika Kiswahili maana hiyo huingizwa kwa kawaida katika kitenzi “kuwaambia.”
theological_decisions:
- issue: Maana ya ἀληθεύων katika hoja ya Paulo
  choice: Paulo anauliza ikiwa kuwaambia Wagalatia ukweli kumemfanya awe adui yao.
  alternative: Paulo anauliza ikiwa kuwa mkweli kwao kwa ujumla kumemfanya awe adui yao.
  rationale: Muktadha wa karibu unahusu maneno ya moja kwa moja ya Paulo kwa Wagalatia. Tafsiri kuu inaonyesha nguvu hiyo ya kimawasiliano bila kuondoa kabisa maana pana zaidi, ambayo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, na “Je, basi” huunganisha mstari huu kwa kawaida na hoja iliyotangulia.
