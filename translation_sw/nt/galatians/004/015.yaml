- from: Basi, ile hali yenu ya kujiona mmebarikiwa iko wapi? Kwa maana ninawashuhudia kwamba, kama ingewezekana[a], mngeng'oa macho yenu na kunipa.
  to: Basi, iko wapi ile heri yenu? Kwa maana nawashuhudia kwamba, kama ingewezekana, mngeng'oa macho yenu[a] na mngenipa.
  rationale: The revision removes an unnecessary interpretive expansion from the rendering of μακαρισμός, using “heri yenu” to retain the source term’s semantic openness. It also relocates the footnote to the eye-gouging expression it explains and slightly clarifies the coordinated conditional actions in natural Swahili. The literal imagery and the open interpretive question concerning Paul’s bodily condition are retained.
