base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: sw
  text: Basi, iko wapi ile heri yenu? Kwa maana nawashuhudia kwamba, kama ingewezekana, mngeng'oa macho yenu[a] na mngenipa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mkiwa mmeng'oa macho yenu.” Huenda usemi huu ni chuku inayoonyesha jinsi walivyokuwa tayari kujitoa kwa ajili ya Paulo; wengine huona pia huenda unadokeza hali fulani ya mwili wa Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Basi, ... iko wapi?
  rationale: Swali la balagha linauliza kilichotokea kwa mtazamo wao wa awali; “basi” linaonyesha nguvu ya οὖν ya kuhitimisha au kurejelea hoja.
- source_word: ὁ μακαρισμὸς ὑμῶν
  choice: ile hali yenu ya kujiona mmebarikiwa
  rationale: μακαρισμός hapa yaweza kumaanisha hali au tamko la kubarikiwa. Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba Wagalatia hapo awali walijiona wamebarikiwa kwa kumpokea Paulo, bila kuifanya iwe furaha tu.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Kwa maana ninawashuhudia
  rationale: Inadumisha uzito wa ushahidi wa Paulo; katika muktadha huu Kiswahili hiki pia kinaweza kueleweka kuwa anatoa ushahidi kuwahusu.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatambulisha yaliyomo katika ushuhuda wa Paulo, si sababu.
- source_word: εἰ δυνατὸν
  choice: kama ingewezekana
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali isiyowezekana au isiyotimia inayodokezwa na muktadha.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: mngeng'oa macho yenu
  rationale: “Kung'oa” huhifadhi taswira halisi, kali na ya kupita kiasi ya ἐξορύσσω bila kuipunguza kuwa ukarimu wa jumla.
- source_word: ἐδώκατέ μοι
  choice: na kunipa
  rationale: Kiswahili hakihitaji kiwakilishi cha kitu hapa kwa kuwa “macho yenu” tayari ni yambwa inayoeleweka ya vitenzi vyote viwili.
theological_decisions:
- issue: Iwapo lugha kuhusu macho ichukuliwe kihalisi katika tafsiri au ilainishwe kuwa usemi wa ukarimu wa jumla
  choice: Taswira halisi “mngeng'oa macho yenu na kunipa” imehifadhiwa katika matini.
  alternative: “Mngenipa chochote” au usemi mwingine wa jumla.
  rationale: Kiyunani kinataja macho waziwazi na kutumia kitenzi chenye nguvu. Huenda ni chuku kuhusu kujitoa kwao kwa Paulo, na huenda pia wengine wakaona dokezo la hali yake ya mwili; tafsiri haipaswi kuamua kati ya fasiri hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hali yenu ya kujiona mmebarikiwa” imechaguliwa badala ya nomino nzito au isiyo ya kawaida ili maana ya μακαρισμός ieleweke kwa msomaji wa kawaida. Alama ya tanbihi [a] imo katika matini kuu.
