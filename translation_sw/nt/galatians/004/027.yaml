  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: γέγραπται ni “imeandikwa”; amri za furaha na sauti zinahifadhiwa; taswira ya utasa/uchungu wa kuzaa inabaki; na ulinganisho wa watoto wa aliyeachwa na wa mwenye mume umewekwa wazi.'
  naturalness: Kiswahili ni sanifu, cha kawaida, na kina hadhi inayofaa nukuu ya kinabii. “Mwanamke tasa,” “paza sauti kwa shangwe,” na “uchungu wa kuzaa” ni semi zinazosomeka kwa urahisi. Marudio ya “kwa maana” yanaakisi mpangilio wa hoja wa chanzo na hayaleti ugumu usio wa lazima.
  terminology: “Mwanamke tasa” ni sahihi kwa στεῖρα; “aliyeachwa” ni chaguo linalokubalika kwa ἐρήμου katika taswira hii, na tanbihi yake huhifadhi uwezekano wa “aliyetelekezwa” au “aliye ukiwa.” “Aliye na mume” hudumisha tofauti ya ἐχούσης τὸν ἄνδρα bila kuongeza tafsiri ya kiteolojia.
