id: GAL.4.27
reference: Galatians 4:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: sw
  text: 'Kwa maana imeandikwa: “Furahi, wewe mwanamke tasa usiyezaa; paza sauti kwa shangwe na upige kelele, wewe usiyepatwa na uchungu wa kuzaa; kwa maana watoto wa mwanamke aliyeachwa ni wengi kuliko watoto wa yule aliye na mume.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nukuu kutoka Isaya 54:1. Neno lililotafsiriwa “aliyeachwa” linaweza pia kumaanisha “aliyetelekezwa” au “aliye ukiwa” katika muktadha huu wa kitamathali.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni kauli ya kawaida ya kutambulisha nukuu ya Maandiko, huku hali timilifu ikidokeza kuwa yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: Εὐφράνθητι
  choice: Furahi
  rationale: Amri hii inaeleza furaha na inafaa kwa mtindo wa kinabii wa nukuu.
- source_word: στεῖρα
  choice: wewe mwanamke tasa
  rationale: Kivumishi kimetumiwa kama nomino katika kumwita mwanamke; 'mwanamke tasa' ni wazi na cha heshima katika Kiswahili sanifu.
- source_word: ἡ οὐ τίκτουσα
  choice: usiyezaa
  rationale: Huhifadhi maelezo ya hali inayoendelea ya kutokuwa na watoto kwa lugha ya kawaida na fupi.
- source_word: ῥῆξον καὶ βόησον
  choice: paza sauti kwa shangwe na upige kelele
  rationale: Muungano huu unaonyesha mlipuko wa ghafla wa sauti ya furaha; tafsiri hii ni ya asili na bado ina uzito wa kishairi.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: wewe usiyepatwa na uchungu wa kuzaa
  rationale: ὠδίνω hurejelea uchungu wa kujifungua; kauli hii ni wazi na inadumisha taswira ya uzazi.
- source_word: πολλὰ τὰ τέκνα
  choice: watoto ... ni wengi
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi dai la kulinganisha idadi ya watoto.
- source_word: τῆς ἐρήμου
  choice: wa mwanamke aliyeachwa
  rationale: Katika muktadha huu wa kitamathali, ἔρημος inaweza kumaanisha aliyeachwa au aliyetelekezwa, si eneo la jangwani tu; 'aliyeachwa' huwasilisha hali ya mwanamke bila kuichanganya na utasa.
- source_word: μᾶλλον ἢ
  choice: ni wengi kuliko
  rationale: Huonyesha wazi ulinganisho wa idadi kwa Kiswahili cha kawaida.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: wa yule aliye na mume
  rationale: Huhifadhi kwa karibu tofauti ya Kigiriki kati ya mwanamke aliyeachwa na yule mwenye mume, bila kufupisha kuwa tu 'mwanamke aliyeolewa'.
theological_decisions:
- issue: Nukuu ya Isaya 54:1 katika muktadha wa hoja ya mfano ya Wagalatia 4
  choice: Kutafsiri picha za kinabii za nukuu kama zilivyo, bila kuingiza utambulisho wa mfano unaotolewa na Paulo katika muktadha mpana.
  alternative: Kutaja wazi zaidi Sara au Yerusalemu wa juu ndani ya maneno ya nukuu.
  rationale: Mstari huu unatangulizwa kama nukuu ya Maandiko. Ufafanuzi wake wa kimfano unapaswa kutoka katika hoja ya Paulo inayouzunguka, si kuongezwa ndani ya nukuu yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. 'Tasa' ni neno la kawaida na lenye heshima; 'paza sauti kwa shangwe' hudumisha msukumo wa kishairi. Alama ya tanbihi [a] imewekwa baada ya nukuu nzima.
