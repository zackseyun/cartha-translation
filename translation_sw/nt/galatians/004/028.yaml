  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: sw
  text: Ninyi, ndugu[a], kama Isaka, ni watoto wa ahadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa ni mwito kwa kusanyiko lote, yaelekea likiwajumuisha wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Nanyi
  rationale: Kiunganishi hiki kinahifadhi msisitizo wa kiwakilishi cha wingi pamoja na mpito au utofautishaji mdogo unaoletwa na δέ, kwa Kiswahili cha kawaida na bila kuongeza wazo la wakati.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Ni mwito wa wingi. Katika Kiswahili, “ndugu” ni neno la kawaida na lenye hadhi linaloweza kulihusu kusanyiko lote; tanbihi inaeleza matumizi yake kwa wanaume na wanawake.
- source_word: κατὰ Ἰσαὰκ
  choice: kama Isaka
  rationale: 'κατά hapa huonyesha ulinganifu au kielelezo: waamini wanafananishwa na Isaka kwa kuwa watoto wanaohusishwa na ahadi.'
- source_word: ἐπαγγελίας
  choice: wa ahadi
  rationale: Muundo “watoto wa ahadi” unahifadhi hali ya umilikishi ya Kigiriki na uzito wa usemi wa Paulo bila kuufafanua kupita kiasi.
- source_word: τέκνα
  choice: watoto
  rationale: Neno hili halibainishi jinsia, bali linasisitiza uhusiano na hadhi ya kifamilia.
- source_word: ἐστέ
  choice: ni
  rationale: Hiki ndicho kiunganishi asilia cha Kiswahili kinachounganisha wahusika na kiarifu “watoto wa ahadi.”
theological_decisions:
- issue: Kufananishwa kwa waamini na Isaka katika hoja ya Paulo
  choice: “kama Isaka, ni watoto wa ahadi”
  alternative: “ni watoto walioahidiwa kama Isaka”
  rationale: Tafsiri iliyochaguliwa inamwonyesha Isaka kuwa kielelezo na “watoto wa ahadi” kuwa kiarifu, hivyo inadumisha muundo na mvutano wa kitheolojia wa Kigiriki bila kudai kwamba wao wenyewe ndio kitu kilichoahidiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Nanyi” hubeba mpito mdogo wa δέ bila kuongeza neno la wakati.
