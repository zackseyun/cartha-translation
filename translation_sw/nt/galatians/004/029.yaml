  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: sw
  text: Lakini kama vile wakati ule yule aliyezaliwa kwa jinsi ya mwili[a] alivyomtesa yule aliyezaliwa kwa jinsi ya Roho[b], ndivyo ilivyo hata sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyezaliwa kwa njia ya kawaida ya kibinadamu”; kihalisi, “aliyezaliwa kwa jinsi ya mwili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yule aliye kwa jinsi ya Roho”; neno “aliyezaliwa” limedokezwa kutoka sehemu ya kwanza ili kuonyesha wazi ulinganifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha tofauti na maelezo yaliyotangulia kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: kama vile wakati ule ... ndivyo ilivyo hata sasa
  rationale: Inahifadhi muundo wa ulinganisho na tofauti ya wakati kati ya zamani na sasa; “ilivyo” hukamilisha kwa Kiswahili sentensi ambayo katika Kigiriki imeachwa kwa ufupi.
- source_word: ὁ ... γεννηθεὶς
  choice: yule aliyezaliwa
  rationale: Kirai hiki cha Kigiriki kinamtaja mtu kwa msingi wa kuzaliwa kwake; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: κατὰ σάρκα
  choice: kwa jinsi ya mwili
  rationale: Inadumisha neno “mwili” na wazo la kuzaliwa kwa njia ya kawaida ya kibinadamu bila kulifasiri kuwa “asili ya dhambi.”
- source_word: ἐδίωκε
  choice: alivyomtesa
  rationale: Kitenzi hapa kinaonyesha uonevu au mateso ya uadui. Muundo wa “alivyomtesa” unaendana kiasili na “kama vile ... ndivyo.”
- source_word: τὸν κατὰ πνεῦμα
  choice: yule aliyezaliwa kwa jinsi ya Roho
  rationale: “Aliyezaliwa” limerudiwa ili ulinganifu uwe wazi kwa Kiswahili, ingawa limedokezwa tu katika sehemu ya pili ya Kigiriki. “Kwa jinsi ya” huhifadhi upana wa κατά kuliko kuitafsiri kama chombo pekee.
- source_word: πνεῦμα
  choice: Roho
  rationale: Katika muktadha huu wa Wagalatia, neno hilo linaelekea kumaanisha Roho Mtakatifu; herufi kubwa inaonyesha uamuzi huo.
- source_word: νῦν
  choice: sasa
  rationale: Ni kielezi cha kawaida na cha moja kwa moja kinachounganisha mfano wa zamani na hali ya wakati wa Paulo.
theological_decisions:
- issue: Maana ya κατὰ σάρκα katika tofauti kati ya Ishmaeli na Isaka
  choice: Kuzaliwa kwa njia ya kawaida ya kibinadamu, huku neno “mwili” likihifadhiwa katika matini
  alternative: Kuzaliwa kwa asili ya dhambi
  rationale: Muktadha wa Wagalatia 4:23, 29 unatofautisha kuzaliwa kwa kawaida na kuzaliwa kunakohusishwa na ahadi na Roho; haulazimishi maana ya kimaadili ya asili yenye dhambi.
- issue: Mrejelewa wa πνεῦμα
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au kanuni ya kiroho
  rationale: Katika ulinganisho wa Paulo kati ya mwili, ahadi, na utambulisho wa waamini, “Roho” anaeleweka vizuri zaidi kuwa Roho wa Mungu. Hata hivyo, tafsiri inabaki karibu na muundo wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ulinganisho ni wa asili, huku istilahi “mwili” na “Roho” zikihifadhi mvutano wa kitheolojia wa matini.
