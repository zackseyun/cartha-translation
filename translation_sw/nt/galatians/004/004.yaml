  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: sw
  text: Lakini ulipowadia utimilifu wa wakati[a], Mungu alimtuma Mwana wake, aliyezaliwa na mwanamke[b], aliyezaliwa chini ya sheria[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati ulipotimia,” yaani, wakati ulipofikia ukamilifu wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyetokana na mwanamke.” Kirai hiki husisitiza kuzaliwa kwake halisi kama mwanadamu.
    reason: lexical_alternative
  - marker: c
