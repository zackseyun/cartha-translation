    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ulipowadia
  rationale: δέ inaashiria mpito wenye utofautishaji mdogo, na ὅτε huanzisha wakati. Muundo huu ni wa asili katika Kiswahili na unaunganisha sentensi na muktadha uliotangulia.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: ulipowadia utimilifu wa wakati
  rationale: Kitenzi 'kuwadia' hueleza kufika kwa wakati uliokusudiwa, huku 'utimilifu wa wakati' kikihifadhi taswira ya πλήρωμα bila kuifafanua kupita maandishi.
- source_word: ἐξαπέστειλεν
  choice: alimtuma
  rationale: Katika Kiswahili 'kutuma' hutoa maana ya kumpeleka mtu kwa kusudi au utume. Jaribio la kuonyesha kiambishi ἐξ- kwa 'kutuma nje' lingekuwa lisilo la kawaida na lingeweza kupotosha.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Mwana wake
  rationale: Ni tafsiri ya kawaida ya kirai cha umilikaji; herufi kubwa inaonyesha rejeleo mahususi la Mwana wa Mungu katika muktadha.
- source_word: γενόμενον ἐκ γυναικός
  choice: aliyezaliwa na mwanamke
  rationale: Katika muktadha huu γενόμενον hueleza kuzaliwa kwa kibinadamu, na ἐκ huonyesha asili au chanzo. 'Kuzaliwa na mwanamke' ni Kiswahili cha asili na chenye heshima.
- source_word: γενόμενον ὑπὸ νόμον
  choice: aliyezaliwa chini ya sheria
  rationale: Kurudia 'aliyezaliwa' kunadumisha ulinganifu wa virai viwili vya Kigiriki. 'Chini ya sheria' huhifadhi usemi mfupi wa Paulo bila kuongeza 'ya Musa' katika matini.
theological_decisions:
- issue: Ubinadamu halisi wa Mwana katika γενόμενον ἐκ γυναικός
  choice: aliyezaliwa na mwanamke
  alternative: aliyetokana na mwanamke
  rationale: Chaguo hili linaeleza kuzaliwa halisi kwa kibinadamu, huku tamko lililotangulia kwamba Mungu alimtuma Mwana wake likibaki na mvutano wake kuhusu kuwapo kwake kabla ya kuzaliwa.
- issue: Rejeleo la νόμος katika ὑπὸ νόμον
  choice: chini ya sheria
  alternative: chini ya Sheria ya Musa
  rationale: Muktadha wa Wagalatia unaelekeza kwenye Sheria ya Musa, lakini matini yenyewe inasema kwa ufupi νόμον. Tafsiri inadumisha ufupi huo, na tanbihi inafafanua rejeleo linalowezekana sana bila kulipanua ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ulipowadia utimilifu wa wakati' huhifadhi lugha ya kitheolojia ya Paulo lakini bado inaeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa mara moja katika matini na kufuatana kwa mpangilio.
