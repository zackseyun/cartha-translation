  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: sw
  text: Lakini ningependa kuwa pamoja nanyi sasa hivi na kubadili toni yangu[a], kwa sababu nimechanganyikiwa kuhusu ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kubadili sauti yangu.” Kigiriki kinasema kihalisi “kubadili sauti yangu,” lakini hapa huenda kinamaanisha kubadili toni au namna ya kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: ningependa
  rationale: Kitenzi cha wakati uliopita kisichotimilika hapa kinaweza kueleza tamaa ya sasa iliyolainishwa. “Ningependa” ni usemi wa kawaida wa Kiswahili unaodokeza kwamba Paulo hawezi kutimiza tamaa hiyo kwa sasa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofauti mdogo kutoka kwa maonyo na ombi yaliyotangulia.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: kuwa pamoja nanyi
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Paulo kuwapo binafsi miongoni mwa Wagalatia.
- source_word: ἄρτι
  choice: sasa hivi
  rationale: Huhifadhi msisitizo wa wakati wa papo hapo uliomo katika neno la Kigiriki.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: kubadili namna ninavyosema
  rationale: Ingawa φωνή kwa msingi ni “sauti,” katika muktadha huu kirai kinaelekea kumaanisha kubadili namna au toni ya kusema. Tafsiri hii ni wazi na ya kawaida, huku tanbihi ikihifadhi tafsiri halisi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha wazi sababu ya Paulo kutaka kuwapo pamoja nao na kusema nao kwa namna tofauti.
- source_word: ἀποροῦμαι
  choice: sijui nifanye nini
  rationale: Huwasilisha hali ya kukosa njia au jibu inayodokezwa na kitenzi hiki, badala ya kueleza tu mshangao wa kiakili.
- source_word: ἐν ὑμῖν
  choice: kuhusu ninyi
  rationale: Kihusishi pamoja na ἀποροῦμαι kinaonyesha jambo ambalo linamhangaisha Paulo; “kuhusu ninyi” ni Kiswahili cha kawaida kisicholazimisha maana ya “ndani yenu.”
theological_decisions:
- issue: Maana ya φωνή katika muktadha
  choice: Paulo anamaanisha kubadili namna au toni yake ya kusema nao.
  alternative: Paulo anamaanisha kubadili sauti yake halisi.
  rationale: Muktadha wa maonyo na mahangaiko ya kichungaji unaunga mkono maana ya namna ya kusema, lakini maana halisi ya “sauti” imehifadhiwa katika tanbihi.
- issue: Nguvu ya ἀποροῦμαι ἐν ὑμῖν
  choice: Paulo hajui afanye nini kuhusu wao.
  alternative: Paulo amefadhaishwa au anashangazwa nao.
  rationale: Kitenzi kinaweza kueleza kuchanganyikiwa, kukosa njia, au kutokuwa na jibu. “Sijui nifanye nini” hudumisha mvutano wa hali yake bila kubainisha chanzo au suluhisho la tatizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nanyi/ninyi” huhifadhi wingi wa viwakilishi vya Kigiriki. Muundo umewekwa wa kawaida kwa wasomaji wengi bila kupoteza mahangaiko na kutokuwa na uhakika kwa Paulo.
