    text: Au “kijakazi”; neno la Kigiriki humaanisha mtumwa wa kike au kijakazi. Hapa linamrejelea Hajiri, kwa kumtofautisha na Sara katika mfano wa Paulo (Gal 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja ya mfano iliyotangulia, huku ikihifadhi uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Ni neno la kawaida na lenye heshima la kuwaita waumini; katika Kiswahili linaweza kuwahusu wanaume na wanawake, huku tanbihi ikifafanua umbo la Kigiriki.
- source_word: οὐκ ἐσμὲν
  choice: sisi si
  rationale: Inatafsiri ukanushi wa wakati uliopo moja kwa moja bila kuongeza wazo la ‘si tena,’ ambalo halipo wazi katika Kigiriki.
- source_word: παιδίσκης
  choice: wa mwanamke mtumwa
  rationale: Hadhi ya utumwa ndiyo kiini cha utofautishaji wa Paulo kati ya Hajiri na Sara; ‘mwanamke mtumwa’ ni wazi na inafaa zaidi hapa kuliko ‘kijakazi.’
- source_word: τέκνα
  choice: watoto
  rationale: Neno hili linawahusu watoto bila kubainisha jinsia na linaonyesha uzao au uhusiano wa kifamilia.
- source_word: ἀλλὰ
  choice: bali
  rationale: Inaonyesha kwa uwazi utofautishaji mkali kati ya utambulisho wa watoto wa mwanamke mtumwa na wale wa mwanamke huru.
- source_word: τῆς ἐλευθέρας
  choice: wa mwanamke huru
  rationale: Kivumishi cha kike kilichotumiwa kama nomino kinamrejelea Sara; tafsiri hii inaweka wazi mrejelewa wa kike na tofauti ya uhuru.
theological_decisions:
- issue: Jinsi ya kuonyesha wazi utofautishaji wa Paulo kati ya Hajiri na Sara katika mfano wake
  choice: mwanamke mtumwa ... mwanamke huru
  alternative: kijakazi ... mwanamke huru
  rationale: Hoja ya 4:21–31 inategemea utofautishaji wa utumwa na uhuru. Maneno haya yanahifadhi ukali wa tofauti hiyo bila kuongeza dai la kimafundisho lisilomo katika mstari.
- issue: Jinsi ya kutafsiri ἀδελφοί kwa hadhira yenye wanaume na wanawake
  choice: ndugu katika matini, pamoja na tanbihi kuhusu umbo la Kigiriki
  alternative: ndugu wa kiume na wa kike
  rationale: ‘Ndugu’ ni la kawaida na jumuishi kimaana katika Kiswahili, lakini tanbihi inalinda taarifa kwamba Kigiriki kimetumia umbo la wingi la kiume ambalo linaweza kuiwakilisha hadhira mchanganyiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa mstari na utofautishaji wa ‘mtumwa’ dhidi ya ‘huru’ umehifadhiwa.
