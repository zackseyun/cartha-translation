  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: sw
  text: Kwa hiyo, ndugu[a], sisi si watoto wa mwanamke mtumwa[b], bali wa mwanamke huru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia umbo la wingi la kiume la neno “ndugu,” ambalo linaweza kutumiwa kuiita kwa pamoja hadhira yenye wanaume na wanawake.
