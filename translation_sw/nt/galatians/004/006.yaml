id: GAL.4.6
reference: Galatians 4:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: sw
  text: Na kwa kuwa ninyi ni wana[a], Mungu alimtuma Roho wa Mwana wake mioyoni mwetu[b], akipaza sauti, “Abba[c], Baba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana” hapa huhifadhi lugha ya Paulo kuhusu kufanywa wana na kupokea urithi; inawahusu waumini wote, wanawake na wanaume.
    reason: cultural_note
  - marker: b
    text: Baadhi ya hati zina “mioyoni mwenu” badala ya “mioyoni mwetu.”
    reason: textual_variant
  - marker: c
    text: Abba ni neno la Kiaramu la kumwita “Baba,” lililohifadhiwa hapa kwa msisitizo wake wa awali na ukaribu wa uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Na kwa kuwa
  rationale: ὅτι inatoa sababu au msingi wa tendo linalofuata, na δέ inaunganisha kwa upole na hoja iliyotangulia. “Na kwa kuwa” huhifadhi kazi zote mbili kwa Kiswahili cha kawaida.
- source_word: ἐστε
  choice: ninyi ni
  rationale: Kitenzi hiki cha wakati wa sasa kinaeleza hali yao iliyopo. Kiwakilishi “ninyi” kinawekwa wazi kwa msisitizo na ufafanuzi.
- source_word: υἱοί
  choice: wana
  rationale: “Wana” ni tafsiri ya asili ya Kiswahili inayofaa kwa wingi wa mwana na huhifadhi uhusiano na hoja ya Paulo kuhusu kufanywa wana na kuwa warithi. Maelezo ya chini yanafafanua kuwa waumini wote wanahusika.
- source_word: ἐξαπέστειλεν
  choice: alimtuma
  rationale: Hueleza tendo la Mungu lililotimizwa. Kiambishi cha yambwa “-m-” ni cha kawaida kwa kumrejelea Roho kama mtendaji binafsi katika sentensi hii.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Roho wa Mwana wake
  rationale: Muundo huu huhifadhi uhusiano wa kimilikishi wa Kigiriki bila kuufasiri zaidi, huku ukibaki wazi na wa kawaida katika Kiswahili.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: mioyoni mwetu
  rationale: Huhifadhi taswira ya kibiblia ya “mioyo” kama kitovu cha maisha ya ndani. Umbo la mahali “mioyoni” linawasilisha kwa kawaida wazo la kuingia ndani ya mioyo.
- source_word: κρᾶζον
  choice: akipaza sauti
  rationale: Kishirikishi hiki kinapatana na “Roho” na kumtaja Roho kuwa ndiye anayelia kwa sauti. “Akipaza sauti” huepuka maana ya kulia machozi na huhifadhi uzito wa κρᾶζον.
- source_word: Αββα
  choice: Abba
  rationale: Neno la Kiaramu lililohifadhiwa ndani ya maandishi ya Kigiriki linanakiliwa ili kudumisha namna ya awali ya kumwita baba.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Ingawa lina kibainishi katika Kigiriki, hapa linafanya kazi kama mwito unaofafanua “Abba”; Kiswahili cha moja kwa moja hutumia “Baba” bila kibainishi.
theological_decisions:
- issue: Tafsiri ya υἱοί katika muktadha wa kufanywa wana na urithi
  choice: wana
  alternative: watoto
  rationale: Hoja ya Wagalatia 3–4 inaunganisha hali ya kuwa wana na haki ya urithi. “Wana” huhifadhi uhusiano huo vizuri kuliko “watoto,” bila kuwazuia waumini wa kike; jambo hilo linafafanuliwa katika tanbihi.
- issue: Tofauti ya maandishi katika kiwakilishi kinachoambatana na “mioyo”
  choice: mioyoni mwetu
  alternative: mioyoni mwenu
  rationale: SBLGNT iliyotolewa ina ἡμῶν, “mwetu,” kwa hiyo ndiyo inayofuatwa katika maandishi makuu. Tofauti inayosomeka “mwenu” inatajwa katika tanbihi.
- issue: Ni nani anayepaza sauti
  choice: Roho ndiye anayepaza sauti
  alternative: waumini wanapaza sauti kwa njia ya Roho
  rationale: Kisarufi, κρᾶζον ni kishirikishi cha umoja kisicho na jinsia kinachopatana na τὸ πνεῦμα. Hivyo sentensi inamtaja Roho wazi kuwa mtendaji, bila kukataa kwamba kilio hicho kinaeleza mwito wa waumini kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Akipaza sauti” ni cha asili kuliko “akilia” katika muktadha huu kwa sababu hakidokezi machozi. Mpangilio unabaki karibu na hoja na sarufi ya Kigiriki bila kuwa mgumu.
