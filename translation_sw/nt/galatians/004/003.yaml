id: GAL.4.3
reference: Galatians 4:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: sw
  text: Vivyo hivyo na sisi, tulipokuwa watoto, tulikuwa watumwa chini ya kanuni za msingi za ulimwengu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu za kiroho za ulimwengu.” Neno la Kigiriki linaweza kumaanisha kanuni au elementi za msingi, au nguvu za kiroho za ulimwengu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Vivyo hivyo na
  rationale: Inaendeleza ulinganisho na mfano uliotangulia wa mrithi aliye chini ya walezi, kwa Kiswahili cha kawaida na chenye nguvu ya kulinganisha.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kimewekwa wazi ili kuhifadhi msisitizo wa Kigiriki.
- source_word: ὅτε ἦμεν νήπιοι
  choice: tulipokuwa watoto
  rationale: Hutoa maana ya wakati na hali ya kutokomaa katika mfano wa mrithi; “watoto” ni ya kawaida kuliko istilahi ya kisheria “watoto wadogo kisheria.”
- source_word: ὑπὸ
  choice: chini ya
  rationale: Huhifadhi taswira ya kuwa chini ya mamlaka au udhibiti, sambamba na matumizi ya Paulo katika muktadha.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: kanuni za msingi za ulimwengu
  rationale: Hutoa maana isiyo ya nafsi kama usomaji mkuu bila kuficha kwamba στοιχεῖα pia inaweza kumaanisha nguvu za kiroho; uwezekano huo umetajwa katika tanbihi.
- source_word: ἤμεθα δεδουλωμένοι
  choice: tulikuwa tumefanywa watumwa
  rationale: Huhifadhi nguvu ya lugha ya utumwa na hali iliyotokana na kufanywa watumwa, badala ya kuipunguza kuwa utegemezi wa kawaida.
theological_decisions:
- issue: Maana ya τὰ στοιχεῖα τοῦ κόσμου
  choice: kanuni za msingi za ulimwengu
  alternative: nguvu za kiroho za ulimwengu
  rationale: Istilahi hiyo ina utata wa kweli katika matumizi ya Paulo. Muktadha wa kuwa mtoto chini ya wasimamizi unaunga mkono “kanuni za msingi,” lakini maana ya nguvu za ulimwengu wa roho haiwezi kuondolewa; kwa hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi lugha nzito ya utumwa na utata wa στοιχεῖα kupitia tanbihi.
