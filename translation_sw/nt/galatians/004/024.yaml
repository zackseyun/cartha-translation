  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: sw
  text: 'Mambo haya yanafasiriwa kwa njia ya mfano[a], kwa maana wanawake hawa ni maagano mawili: moja linatoka Mlima Sinai, nalo linazaa watoto wa utumwa[b]; hilo ni Hajiri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yanasemwa kwa maana ya mfano,” au “ni mfano.” Maneno ya Kigiriki yanaonyesha kwamba Paulo anatumia simulizi lililotangulia kwa njia ya kialegoria.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaoingia utumwani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Mambo haya
  rationale: Kiwakilishi hiki cha wingi kisicho na jinsia kinarejelea simulizi lililotangulia; “mambo haya” ni Kiswahili cha kawaida kinachohifadhi urejeleo huo.
- source_word: ἀλληγορούμενα
  choice: yanafasiriwa kwa njia ya mfano
  rationale: Muundo wa wakati uliopo na kauli tendwa unaonyesha simulizi linatumiwa au kufasiriwa kwa namna ya kialegoria, bila kudai kwamba wahusika hawakuwa wa kihistoria.
- source_word: αὗται
  choice: wanawake hawa
  rationale: Kiwakilishi cha kike cha wingi kinawarejelea wazi Sara na Hajiri; kutaja “wanawake” huondoa utata kwa njia ya kawaida.
- source_word: διαθῆκαι
  choice: maagano
  rationale: “Agano” ndilo neno la kawaida la kibiblia katika muktadha huu wa Sinai na huhifadhi maana ya uhusiano wa agano.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: moja linatoka Mlima Sinai
  rationale: “Moja” huanzisha upande wa kwanza wa ulinganisho unaoendelea katika mstari unaofuata; “linatoka” huonyesha chanzo.
- source_word: εἰς δουλείαν
  choice: wa utumwa
  rationale: Katika muundo “linazaa watoto,” Kiswahili asilia husema “watoto wa utumwa”; maana ya matokeo au hali wanayoingizwa inadumishwa, huku “utumwa” likihifadhi uzito wa δουλεία.
- source_word: γεννῶσα
  choice: linazaa watoto
  rationale: Kitenzi hiki cha kike cha umoja kinaendeleza taswira ya uzazi inayoliunganisha agano na Hajiri.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: huyo ni Hajiri
  rationale: “Huyo” humrejelea mhusika wa kike aliyewakilishwa na agano na kuhifadhi utambulisho wa kimfano kwa Kiswahili fasaha.
theological_decisions:
- issue: Namna Paulo anavyotumia simulizi la Sara na Hajiri
  choice: Simulizi linafasiriwa kwa njia ya mfano.
  alternative: Mambo haya ni mfano tu, au wahusika si wa kihistoria.
  rationale: Kauli tendwa ἀλληγορούμενα inaelekeza kwenye namna ya kufasiri au kutumia simulizi; tafsiri haikanushi uhalisi wa kihistoria wala kulazimisha hitimisho hilo.
- issue: Maana ya δουλεία
  choice: utumwa
  alternative: kifungo; hali ya kuwa mtumwa
  rationale: “Utumwa” huonyesha kwa nguvu hali ya kutawaliwa inayosisitizwa katika utofautishaji wa maagano mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa njia ya mfano” linaeleweka kwa wasomaji wengi kuliko istilahi ya kitaalamu “kialegoria,” huku tanbihi ikifafanua mbinu ya Paulo. Jina Ἁγάρ limetolewa kwa umbo la Kiswahili lililozoeleka, “Hajiri.”
