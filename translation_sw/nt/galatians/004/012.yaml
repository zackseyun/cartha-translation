id: GAL.4.12
reference: Galatians 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: sw
  text: 'Ndugu, nawasihi: kuweni kama mimi, kwa sababu mimi pia ni kama ninyi.[a] Hamkunikosea kwa lolote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu mimi pia nimekuwa kama ninyi.” Kigiriki hakina kitenzi katika kishazi hiki.
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: kuweni
  rationale: Amri ya wakati wa sasa, wingi, kutoka γίνομαι. Katika Kiswahili, “kuweni” ni mwito wa kawaida na unaoeleweka wa kuingia au kudumu katika hali inayotajwa; “fanyikeni” ingekuwa ya kimitambo na isiyo ya kawaida hapa.
- source_word: ὡς ἐγώ
  choice: kama mimi
  rationale: Huhifadhi ulinganisho wa moja kwa moja kwa lugha ya kawaida ya Kiswahili bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaeleweka kwa kawaida kuwa inatoa sababu ya mwito wa Paulo.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: mimi pia ni kama ninyi
  rationale: Kigiriki hakirudii kitenzi katika kishazi hiki. Kitenzi kishirikishi “ni” kimeongezwa ili sentensi iwe ya kawaida kwa Kiswahili, huku uwezekano wa kuelewa hali iliyotokea zamani ukihifadhiwa katika tanbihi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida, lenye hadhi, linaloweza kutumiwa kwa jumuiya nzima ya waamini bila kulazimisha jinsia ambayo Kiswahili haihitaji kutaja hapa.
- source_word: δέομαι ὑμῶν
  choice: nawasihi
  rationale: Huonyesha ombi la dhati bila kuwa la kizamani; mpangilio umewekwa karibu na mwito mkuu ili Kiswahili kiwe cha asili.
- source_word: οὐδέν με ἠδικήσατε
  choice: Hamkunikosea kwa lolote
  rationale: Hutoa maana ya kutonitendea kosa kwa namna yoyote, ikihifadhi yambwa “me” na nguvu ya οὐδέν.
theological_decisions:
- issue: Uhusiano wa kisarufi katika κἀγὼ ὡς ὑμεῖς
  choice: mimi pia ni kama ninyi
  alternative: mimi pia nimekuwa kama ninyi
  rationale: Kwa kuwa Kigiriki kinaacha kitenzi, matini kuu haitamki wazi kama Paulo anasisitiza hali yake ya sasa au hatua ya zamani ya kujifananisha na Wagalatia. Tanbihi inahifadhi usomaji wa kihistoria unaowezekana.
- issue: Upeo wa ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Katika muktadha huu neno linaiita jumuiya ya waamini kwa pamoja. “Ndugu” katika Kiswahili hufanya kazi hiyo kwa kawaida na halihitaji upanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Ndugu, nawasihi” huweka mwito wa Paulo kwa namna ya asili katika Kiswahili, huku hoja na vipengele vyote vya Kigiriki vikihifadhiwa.
