lexical_decisions:
- source_word: τέκνα μου
  choice: Watoto wangu
  rationale: Ni mwito wa upendo kwa waamini wa Galatia. “Watoto wangu” ni Kiswahili cha kawaida na chenye heshima bila kuongeza udogo ambao haujatajwa wazi.
- source_word: οὓς
  choice: kwa ajili yenu
  rationale: Ingawa ni kiwakilishi cha uhusiano katika hali ya yambwa, kinahusishwa na sitiari ya uchungu wa kuzaa. Uundaji huu wa sentensi unaonyesha kuwa Paulo anapata uchungu huo kwa ajili yao na unaepuka Kiswahili kisicho cha kawaida.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa jambo na ni tafsiri ya moja kwa moja, ya kawaida.
- source_word: ὠδίνω
  choice: ninapata tena uchungu wa kuzaa
  rationale: Inadumisha picha hai ya uchungu wa kujifungua na hali ya sasa ya kitenzi, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: μέχρις οὗ
  choice: mpaka
  rationale: Huonyesha kikomo au lengo la muda la sitiari ya Paulo kwa lugha fupi na ya kawaida.
- source_word: μορφωθῇ
  choice: aumbike
  rationale: Kitenzi hiki kinahifadhi wazo la kupata umbo na pia sauti ya kutendwa ya Kigiriki bila kuligeuza kuwa maelezo ya kiufundi ya kiteolojia.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta. “Masihi” hudumisha maana hiyo, huku “Kristo” ikitolewa katika tanbihi kama namna nyingine iliyozoeleka.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Hutoa kwanza maana ya ndani ya ἐν pamoja na kiwakilishi cha wingi; “miongoni mwenu” bado yawezekana kwa maana ya kijumuiya na imetajwa katika tanbihi.
theological_decisions:
- issue: Maana ya Masihi kuumbika ndani ya waamini
  choice: Sitiari ya Masihi kuumbika ndani ya waamini imedumishwa bila kufafanuliwa kuwa utaratibu maalumu wa kidogma.
  alternative: Masihi kuumbika miongoni mwao kama jumuiya, au kauli inayolenga hasa uongofu na kuzaliwa upya.
  rationale: Kigiriki kinaweza kubeba maana ya ndani ya watu na pia maana ya kijumuiya kwa sababu “yenu” ni wingi. Tafsiri kuu inatanguliza maana ya “ndani,” lakini tanbihi inahifadhi uwezekano wa “miongoni.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio wa sentensi umebadilishwa kidogo ili sitiari ya uzazi isikike kwa kawaida bila kupoteza uhusiano wa kisarufi au mvutano wa maana.
