source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: sw
  text: Na ingawa hali yangu ya kimwili ilikuwa mtihani kwenu[a], hamkunidharau wala kunikataa kwa kinyaa[b]. Badala yake, mlinipokea kama malaika wa Mungu, kama Masihi Yesu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtihani wenu katika mwili wangu.” Maneno ya Kigiriki yana ugumu wa kimatini na kisintaksia.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “wala kutema mate”—usemi unaoonyesha kinyaa au kukataliwa.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki, “Kristo Yesu”; hapa neno Χριστός limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: mtihani
  rationale: Katika muktadha huu neno hilo linamaanisha hali ngumu iliyowajaribu Wagalatia walipompokea Paulo, si kishawishi cha kutenda dhambi.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: hali yangu ya mwili ilikuwa mtihani kwenu
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba hali ya kimwili ya Paulo ndiyo iliyokuwa mtihani kwa Wagalatia, huku ugumu halisi wa kisintaksia ukihifadhiwa katika tanbihi.
- source_word: ἐξουθενήσατε
  choice: hamkunidharau
  rationale: Kitenzi hiki humaanisha kumwona mtu kuwa hafai au asiye na maana; “kudharau” ni neno la kawaida, wazi na lenye hadhi katika Kiswahili.
- source_word: ἐξεπτύσατε
  choice: kunikataa kwa kinyaa
  rationale: Kitenzi hicho kihalisi kinahusisha kutema mate kama ishara ya kuchukizwa au kukataa. Tafsiri hii inawasilisha maana yake ya kimuktadha, na picha halisi imeelezwa katika tanbihi.
- source_word: ἐδέξασθέ
  choice: mlinipokea
  rationale: “Kupokea” huonyesha wazi kitendo cha Wagalatia cha kumkubali Paulo kwa heshima na ukarimu.
- source_word: ἄγγελον θεοῦ
  choice: malaika wa Mungu
  rationale: Ingawa ἄγγελος pia linaweza kumaanisha mjumbe, mlinganisho ulioinuliwa na unaofuatiwa na “Masihi Yesu” unaunga mkono maana ya “malaika.”
- source_word: Χριστὸν Ἰησοῦν
  choice: Masihi Yesu
  rationale: Χριστός linatumika hapa kama cheo; “Masihi” huhifadhi maana ya cheo cha Mtiwa-Mafuta badala ya kulifanya jina lisiloelezwa.
theological_decisions:
- issue: Maana ya kumlinganisha Paulo na “malaika wa Mungu” na “Masihi Yesu”
  choice: Maneno haya yanaeleza namna ya heshima kubwa ambayo Wagalatia walimpokea Paulo.
  alternative: Mlinganisho wa pili unaweza kueleweka kuwa unaongeza nguvu ya balagha kwa wa kwanza.
  rationale: Virai viwili vinavyoanza na ὡς vinaonyesha jinsi walivyompokea Paulo; havimtambulishi Paulo kuwa Yesu wala kuwa na asili ya kimungu.
- issue: Maana ya σάρξ
  choice: Hali ya kimwili ya Paulo
  alternative: Asili ya dhambi
  rationale: Muktadha unahusu udhaifu, ugonjwa au hali nyingine ya mwili wa Paulo; maana ya kimaadili kuhusu asili ya dhambi haithibitishwi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Mtihani” huepuka maana ya kawaida ya “jaribu” kama kishawishi, na “kukataa kwa kinyaa” huwasilisha nguvu ya usemi bila kufanya picha ya kutema mate ionekane kuwa lazima iwe tukio halisi.
