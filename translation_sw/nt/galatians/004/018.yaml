base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: sw
  text: Lakini ni vizuri kutafutwa kwa bidii kwa kusudi jema sikuzote[b][a], wala si tu ninapokuwa pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa na bidii” au “kuonyesha bidii.” Kitenzi-jina cha Kiyunani ζηλοῦσθαι kinaweza kueleweka kwa njia tofauti, lakini kauli ya kutendwa inafaa kwa utofauti wa karibu na wale wanaowatafuta Wagalatia katika mstari uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “katika jambo jema.” Huenda kirai hiki kinamaanisha kwa nia njema au kwa kusudi jema.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: ni vizuri
  rationale: Kivumishi hiki ni kiarifu pamoja na kitenzi-jina; Kiswahili cha kawaida hutumia ‘ni vizuri’ kueleza tathmini hiyo.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofauti na nia mbaya ya wale wanaowatafuta Wagalatia katika mstari uliotangulia.
- source_word: ζηλοῦσθαι
  choice: kutafutwa kwa bidii
  rationale: Ni kitenzi-jina cha wakati uliopo katika kauli ya kutendwa. Maana hii inaendeleza tofauti na watu wanaowatafuta Wagalatia kwa bidii katika mstari wa 17, huku ikihifadhi wazo la juhudi kubwa.
- source_word: ἐν καλῷ
  choice: kwa kusudi jema
  rationale: Kirai hiki, kihalisi ‘katika jambo jema,’ hapa kinaelekea kueleza uzuri wa nia au kusudi la kuwatafuta.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Huhifadhi maana ya wakati wote na kuandaa utofauti unaofuata wa kutokuwa tu wakati Paulo yupo.
- source_word: καὶ μὴ μόνον
  choice: wala si ... tu
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi uratibu pamoja na kizuizi cha ‘si tu.’
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: wakati tu ninapokuwa pamoja nanyi
  rationale: Kitenzi-jina chenye kibainishi pamoja na ἐν kinaonyesha wakati; tafsiri hii ni ya kawaida na huhifadhi kuwapo kwa Paulo pamoja nao.
theological_decisions:
- issue: Kauli na mhusika wa ζηλοῦσθαι
  choice: 'Kauli ya kutendwa: Wagalatia kutafutwa kwa bidii na wengine'
  alternative: Kuwa na bidii / kuonyesha bidii
  rationale: 'Muktadha wa karibu wa mistari 17–18 unatumia lugha ya ζηλόω kuhusu wengine kuwatafuta Wagalatia. Kauli ya kutendwa hufanya mstari wa 18 kuwa upande chanya: kutafutwa ni vizuri ikiwa kusudi ni jema. Kwa kuwa umbo la Kiyunani linaweza pia kueleweka tofauti, hilo limeonyeshwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kutafutwa kwa bidii’ huhifadhi kauli ya kutendwa na mwangwi wa juhudi katika mzizi wa Kiyunani; tanbihi zinahifadhi utata halisi wa kitenzi na wa kirai ἐν καλῷ.
