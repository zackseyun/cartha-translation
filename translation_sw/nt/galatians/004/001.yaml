  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: sw
  text: Ninasema kwamba, maadamu mrithi angali mtoto[a], hana tofauti yoyote na mtumwa, ingawa ni bwana wa yote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiye mtu mzima.” Neno la Kigiriki νήπιος linaweza kumaanisha mtoto mdogo au, katika muktadha huu, mtu ambaye bado hajafikia umri wa utu uzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ninasema kwamba
  rationale: Kauli hii inaanzisha ufafanuzi unaofuata. Kiunganishi δέ kina nguvu ndogo hapa, hivyo hakihitaji kutafsiriwa kwa neno linaloonyesha upinzani mkali.
- source_word: ἐφ’ ὅσον χρόνον
  choice: kwa muda wote ambao bado
  rationale: Kirai hiki kinaonyesha kipindi kinachoendelea hadi mpaka fulani; Kiswahili hiki ni cha kawaida na kinaweka wazi hali ya muda.
- source_word: ὁ κληρονόμος
  choice: mrithi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mtu anayepokea urithi.
- source_word: νήπιός
  choice: mtoto
  rationale: Neno linaweza kumaanisha mtoto mchanga au mtoto ambaye hajafikia umri wa kuwa na mamlaka kamili. Katika mfano huu wa urithi, “mtoto” ni la kawaida na halibainishi umri kupita kiasi.
- source_word: οὐδὲν διαφέρει
  choice: hana tofauti yoyote
  rationale: Huwasilisha kwa kawaida maana ya kutokuwa na tofauti hata kidogo katika hali ya vitendo.
- source_word: δούλου
  choice: mtumwa
  rationale: Katika ulinganisho huu hali ya kuwa chini ya mamlaka ni muhimu; “mtumwa” huhifadhi nguvu ya δοῦλος kuliko “mtumishi.”
- source_word: κύριος πάντων ὤν
  choice: ingawa yeye ni bwana wa yote
  rationale: Kirai shirikishi kina maana ya kukubali jambo linaloonekana kupingana na lililotangulia. “Bwana” hapa humaanisha mwenye mamlaka au umiliki, wala si lazima cheo cha Mungu.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano wa Paulo
  choice: mtumwa
  alternative: mtumishi
  rationale: Hoja ya mfano inategemea mrithi akiwa hana uhuru wa vitendo kuliko mtu aliye chini ya mamlaka. “Mtumwa” huhifadhi hali hiyo yenye nguvu bila kuingiza fundisho la dhehebu.
- issue: Maana ya κύριος katika “κύριος πάντων”
  choice: bwana wa yote
  alternative: mwenye vitu vyote
  rationale: “Bwana” huhifadhi lugha ya mamlaka na umiliki ya Kigiriki. Muktadha unaonyesha kuwa si jina la kimungu, bali hadhi ya mrithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umebaki karibu na hoja ya Kigiriki huku ukitumia mtiririko wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa katika matini.
