  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: sw
  text: Lakini sasa, baada ya kumjua Mungu—au afadhali, baada ya kujulikana na Mungu—mnawezaje kurudi tena kwenye mambo ya msingi yaliyo dhaifu na duni[a], ambayo mnataka kuwa watumwa wa mambo hayo tena upya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguvu za asili,” “kanuni za msingi,” au “vipengele vya mwanzo.”
    reason: Neno la Kigiriki στοιχεῖα lina maana kadhaa zinazowezekana katika muktadha huu.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: baada ya kumjua Mungu
  rationale: Kishirikishi cha wakati uliopita kinaonyesha kwamba Wagalatia waliingia katika hali ya kumjua Mungu; “baada ya” kinaunganisha tendo hilo kwa kawaida na swali kuu.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: au afadhali, baada ya kujulikana na Mungu
  rationale: “Au afadhali” linaonyesha marekebisho yenye msisitizo, huku kauli tendwa ikihifadhi kwamba Mungu ndiye anayewajua.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: mnawezaje kurudi tena
  rationale: Hili ni swali la mshangao na kukemea; “kurudi tena” linahifadhi wazo la kugeuka na kurudia hali ya zamani.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: mambo ya msingi yaliyo dhaifu na duni
  rationale: “Mambo ya msingi” halifungi maana ya στοιχεῖα kwenye kanuni pekee wala roho/nguvu pekee. “Dhaifu na duni” ni Kiswahili cha sasa kinachoonyesha upungufu wa nguvu na thamani.
- source_word: πάλιν ἄνωθεν δουλεύειν θέλετε
  choice: mnataka kuwa watumwa wake tena upya
  rationale: “Kuwa watumwa” linahifadhi picha ya utumwa ya δουλεύειν, na “tena upya” linaonyesha msisitizo wa marudio katika πάλιν ἄνωθεν.
theological_decisions:
- issue: Maana ya στοιχεῖα katika Wagalatia 4:9
  choice: mambo ya msingi
  alternative: nguvu za asili; kanuni za msingi; mambo ya awali
  rationale: Neno linaweza kumaanisha vipengele au kanuni za msingi, na huenda pia nguvu za ulimwengu. Tafsiri kuu inaacha maana hiyo wazi, na tanbihi inataja uwezekano mwingine.
- issue: Msisitizo wa “kujulikana na Mungu”
  choice: kauli tendwa imehifadhiwa kama marekebisho ya “kumjua Mungu”
  alternative: baada ya Mungu kuwajua ninyi
  rationale: Muundo wa Paulo unaonyesha kwamba kujulikana kwao na Mungu ni jambo la msingi zaidi, bila kuongeza mfumo wa kiteolojia usioelezwa na mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa katika maswali mawili kwa uwazi wa kawaida wa Kiswahili, huku mshangao, marudio, na picha ya utumwa vikihifadhiwa.
