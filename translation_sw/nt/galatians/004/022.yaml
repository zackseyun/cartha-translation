  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: sw
  text: Kwa maana imeandikwa kwamba Abrahamu alikuwa na wana wawili, mmoja kwa mwanamke mtumwa[a] na mwingine kwa mwanamke huru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijakazi.” Neno la Kigiriki παιδίσκη linaweza kumaanisha mtumishi wa kike, lakini hapa “mwanamke mtumwa” huonyesha wazi ulinganisho wa utumwa na uhuru katika hoja ya Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutanguliza ushuhuda wa Maandiko, nao huhifadhi maana ya hali inayoendelea ya kile kilichoandikwa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inatoa msingi wa hoja iliyotangulia kwa njia ya asili na yenye hadhi katika Kiswahili.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutanguliza yaliyomo katika kile kilichoandikwa kwa uwazi.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: δύο υἱοὺς
  choice: wana wawili
  rationale: υἱούς humaanisha wana wa kiume, na 'wana wawili' ni usemi wa kawaida na sahihi.
- source_word: ἔσχεν
  choice: alikuwa na
  rationale: Huwasilisha maana ya kuwa na wana bila kuongeza tafsiri mahsusi ya tendo la kuwazaa.
- source_word: ἕνα ... καὶ ἕνα
  choice: mmoja ... na mwingine
  rationale: Muundo huu wa Kiswahili ni wa asili huku ukihifadhi uwiano wa pande mbili katika Kigiriki.
- source_word: ἐκ
  choice: kwa
  rationale: Katika muktadha wa ukoo, 'kwa mwanamke' huonyesha uzazi wa mama kwa ufupi na kwa lugha ya kawaida.
- source_word: παιδίσκης
  choice: mwanamke mtumwa
  rationale: Neno hili linaweza kumaanisha mtumishi wa kike au kijakazi, lakini hapa hali ya utumwa ni muhimu kwa ulinganisho wa Paulo kati ya utumwa na uhuru.
- source_word: ἐλευθέρας
  choice: mwanamke huru
  rationale: Kivumishi hiki kimetumiwa kama nomino na humaanisha mwanamke aliye huru; tafsiri hii huhifadhi ulinganisho na mwanamke mtumwa.
theological_decisions:
- issue: Ulinganisho wa hali ya utumwa na uhuru katika hoja ya Paulo
  choice: mwanamke mtumwa / mwanamke huru
  alternative: kijakazi / mwanamke huru
  rationale: Muktadha unaofuata unategemea tofauti ya utumwa na uhuru. 'Mwanamke mtumwa' huifanya tofauti hiyo iwe wazi bila kuongeza dai lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili bila kufuta ulinganisho wa maneno ya chanzo.
