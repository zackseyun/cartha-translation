  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: sw
  text: Niambieni, ninyi mnaotaka kuwa chini ya sheria, je, hamsikii sheria?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “je, hamuisikilizi sheria?” Kitenzi cha Kigiriki kinaweza kumaanisha “kusikia” au “kusikiliza.” Hapa “sheria” huenda inarejelea Sheria ya Musa, hasa simulizi la Maandiko ambalo Paulo analitaja baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Niambieni
  rationale: Kauli ya amri ya wingi inawalenga wasomaji kadhaa na kuanzisha changamoto ya moja kwa moja; “Niambieni” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: ninyi mnaotaka kuwa chini ya sheria
  rationale: Muundo huu unalitaja kundi kwa tamaa yao; “chini ya sheria” huhifadhi sitiari ya Paulo ya kuwa chini ya mamlaka au mfumo wa sheria.
- source_word: νόμον / τὸν νόμον
  choice: sheria / sheria
  rationale: Kutumia neno lilelile katika sehemu zote mbili kunahifadhi mchezo wa maana kati ya kuwa chini ya sheria na kusikiliza yale ambayo sheria yenyewe inasema. Muktadha unaelekeza kwenye Sheria ya Musa na simulizi la Maandiko linalofuata bila kulazimisha ufafanuzi huo ndani ya neno lenyewe.
- source_word: οὐκ ἀκούετε
  choice: je, hamsikilizi yale inayosema
  rationale: ἀκούω inaweza kumaanisha kusikia au kusikiliza. Hapa hoja ya Paulo ni kuzingatia ujumbe wa sheria, si kupokea sauti tu; nyongeza ya asili “yale inayosema” inaweka wazi matumizi ya sheria kama maandishi huku ikihifadhi maana.
theological_decisions:
- issue: Rejeo na maana mbili za “sheria”
  choice: Neno “sheria” limetumiwa katika matukio yote mawili bila kulibadili kuwa jina maalumu, huku tungo ya pili ikionyesha sheria kama maandishi yanayosema jambo.
  alternative: Kutumia “Sheria” kwa herufi kubwa ili kutaja Torati ya Musa moja kwa moja.
  rationale: Paulo anatumia νόμος kwa namna inayounganisha hali ya kuwa chini ya sheria na kusikiliza simulizi la Torati analonukuu baadaye. Tafsiri hii inadumisha mvutano huo bila kuufinya mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Niambieni” na “hamsikilizi” ni maumbo ya wingi yanayowalenga wasomaji moja kwa moja. Lugha imewekwa rahisi huku sitiari ya “chini ya sheria” na utata halisi wa ἀκούω vikihifadhiwa.
