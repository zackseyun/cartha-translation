  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: sw
  text: Hagari ni Mlima Sinai ulioko Arabia,[a] naye analingana na Yerusalemu ya sasa, kwa maana yeye yuko utumwani pamoja na watoto wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi Hagari huyu ni Mlima Sinai ulioko Arabia.” Kigiriki kina kibainishi kabla ya “Hagari,” na hivyo kutokeza kifungu chenye mpangilio mgumu ambacho baadhi ya tafsiri hukionyesha wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Hagari
  rationale: Jina limetolewa moja kwa moja bila kuongeza “Basi”; δέ ni kiunganishi hafifu, na kibainishi τὸ katika kifungu hiki kigumu hakina kisawe cha kawaida kinachohitajika katika Kiswahili.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: ni Mlima Sinai ulioko Arabia
  rationale: Inahifadhi usemi wa moja kwa moja wa utambulisho na mahali, bila kuufanya kuwa maelezo ya kiishara kama “anawakilisha.”
- source_word: συστοιχεῖ
  choice: analingana na
  rationale: Kitenzi kinaonyesha kuwa vitu viwili vinawekwa katika upande au safu moja ya ulinganisho; “analingana na” ni ya kawaida na inaeleweka katika hoja hii ya mfano.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: Yerusalemu ya sasa
  rationale: “Ya sasa” inawakilisha νῦν na kutofautisha Yerusalemu ya wakati wa Paulo na “Yerusalemu ya juu” katika mstari unaofuata.
- source_word: δουλεύει
  choice: iko utumwani
  rationale: Inasisitiza hali ya utumwa katika utofautishaji wa utumwa na uhuru katika kifungu hiki, badala ya maana pana ya kutumikia.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: pamoja na watoto wake
  rationale: Inahifadhi uhusiano wa kifamilia wa τέκνα na maana ya ushirika inayotolewa na μετά pamoja na kielezi-jina.
theological_decisions:
- issue: Utambulisho wa kiishara wa Hagari na Sinai/Yerusalemu
  choice: Hagari ni Mlima Sinai ... naye analingana na Yerusalemu ya sasa
  alternative: Hagari anawakilisha Mlima Sinai
  rationale: Kigiriki kinatumia usemi wa moja kwa moja wa kuwa kitu fulani, kisha kitenzi cha kulingana. Tafsiri hailegezi nguvu ya hoja ya Paulo wala kuongeza ufafanuzi wa kimadhehebu.
- issue: Mhusika aliye utumwani pamoja na watoto wake
  choice: Yerusalemu hiyo iko utumwani pamoja na watoto wake
  alternative: naye yuko utumwani pamoja na watoto wake
  rationale: Kitenzi cha umoja katika Kigiriki kinaweza kurejelea Yerusalemu iliyotajwa mara moja kabla; kurudia “Yerusalemu hiyo” kunafanya Kiswahili kiwe wazi na cha kawaida bila kubadili hoja ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina “Hagari,” “Mlima Sinai,” na “Yerusalemu” yanafuata matumizi ya kawaida ya Biblia ya Kiswahili. Usemi “iko utumwani” ni wazi kwa wasomaji wa kawaida na huhifadhi uzito wa utofautishaji wa utumwa na uhuru.
