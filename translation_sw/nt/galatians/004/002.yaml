  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: sw
  text: bali yuko chini ya walezi na wasimamizi wa mali mpaka wakati uliowekwa na baba yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya kuwa mrithi kisheria na kuendelea kuwa chini ya mamlaka akiwa mtoto; “bali” ni fupi na ya asili katika muktadha huu.
- source_word: ὑπὸ
  choice: chini ya
  rationale: Pamoja na nomino zinazofuata, kinaonyesha kuwa chini ya mamlaka au usimamizi; “chini ya” huhifadhi taswira ya Kigiriki na ni Kiswahili cha kawaida.
- source_word: ἐπιτρόπους
  choice: walezi
  rationale: Neno hili linawahusu watu waliokabidhiwa kumtunza na kumsimamia mtoto; “walezi” hutofautisha jukumu hilo na usimamizi wa mali.
- source_word: ἐστὶ
  choice: yuko
  rationale: Kitenzi hiki kinaendeleza mhusika wa mstari uliotangulia, yaani mrithi; “yuko” linafaa kwa kuwa chini ya mamlaka ya watu.
- source_word: καὶ
  choice: na
  rationale: Huunganisha kwa urahisi makundi mawili ya wasimamizi bila kuongeza msisitizo usio lazima.
- source_word: οἰκονόμους
  choice: wasimamizi wa mali
  rationale: Katika muktadha huu ni watu wanaosimamia shughuli za nyumba au mali; tafsiri hii ni wazi kwa msomaji wa kisasa na inatofautiana na “walezi.”
- source_word: ἄχρι
  choice: mpaka
  rationale: Huonyesha kikomo cha muda wa mpango huo kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: τῆς προθεσμίας
  choice: wakati uliowekwa
  rationale: Nomino hii ina maana ya wakati uliopangwa au kuamuliwa mapema; “wakati uliowekwa” ni wazi na huhifadhi wazo hilo.
- source_word: τοῦ πατρός
  choice: na baba yake
  rationale: Hapa genitivi inaeleweka kwa kawaida kuwa baba ndiye aliyeweka wakati huo. “Baba yake” huonyesha uhusiano na mrithi unaotokana na muktadha bila kuongeza dai la kitheolojia.
theological_decisions:
- issue: Maana ya genitivi katika τοῦ πατρός
  choice: baba yake anaelezwa kuwa ndiye aliyeweka wakati
  alternative: “wakati wa baba” au “wakati uliowekwa na baba” bila kubainisha uhusiano kwa kiwakilishi
  rationale: Katika mfano wa mtoto mrithi, maana inayowezekana zaidi ni kwamba baba ndiye anayeamua wakati wa mwisho wa usimamizi. Kiwakilishi “yake” kinatokana na uhusiano ulio katika mfano, si fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Wasimamizi wa mali” limetumiwa badala ya neno la kihistoria lisiloeleweka kwa urahisi, huku tofauti kati ya malezi ya mtoto na usimamizi wa mali ikihifadhiwa.
