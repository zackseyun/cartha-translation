  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: ἀλλά ni “bali”; ὑπὸ ... ἐστίν ni “yuko chini ya”; ἐπιτρόπους na οἰκονόμους zimetofautishwa kwa “walezi” na “wasimamizi wa mali”; na ἄχρι τῆς προθεσμίας τοῦ πατρός ni “mpaka wakati uliowekwa na baba yake.” Uwakala wa baba katika kuweka wakati unaungwa mkono na muktadha wa mfano wa mrithi mdogo na audit trail ya Kiingereza.'
