id: GAL.4.7
reference: Galatians 4:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: sw
  text: Kwa hiyo wewe si mtumwa tena, bali ni mwana[a]; na ikiwa wewe ni mwana, basi wewe pia ni mrithi kupitia Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtoto.” Kigiriki kinasema “mwana,” neno linalohifadhi mantiki ya kufanywa wana na ya urithi katika kifungu hiki, ingawa Paulo anatumia hadhi hii kwa waamini wote.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina maneno “mrithi wa Mungu kupitia Kristo” (au “kupitia Masihi”) badala ya “mrithi kupitia Mungu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye nguvu ya kimantiki.
- source_word: οὐκέτι
  choice: si ... tena
  rationale: Huwasilisha ukanushaji wa wakati unaoonyesha kwamba hadhi imebadilika.
- source_word: εἶ
  choice: wewe ... ni
  rationale: Huhifadhi nafsi ya pili umoja ya kitenzi cha Kigiriki.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Huhifadhi hali ya utumwa inayotofautishwa hapa na hadhi ya kuwa mwana na mrithi; ‘mtumishi’ ingepunguza uzito wa utofautishaji huo.
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi asilia cha Kiswahili kinachoonyesha utofautishaji mkali kati ya hali mbili.
- source_word: υἱός
  choice: mwana
  rationale: Huhifadhi lugha ya mwana wa kiume na mantiki ya kufanywa wana na kupokea urithi katika muktadha, huku dokezo likieleza kwamba hadhi hii inawahusu waamini wote.
- source_word: εἰ δὲ
  choice: na ikiwa
  rationale: Huendeleza hatua inayofuata ya hoja bila kuifanya kuwa tofauti kali isiyokuwapo.
- source_word: καὶ
  choice: pia
  rationale: Huongeza hadhi ya mrithi juu ya hadhi ya mwana.
- source_word: κληρονόμος
  choice: mrithi
  rationale: Ni neno la kawaida na sahihi kwa mtu anayepokea urithi.
- source_word: διὰ θεοῦ
  choice: kupitia Mungu
  rationale: Hufuata moja kwa moja usomaji wa SBLGNT na kuhifadhi maana ya chombo au njia ya διά badala ya kuingiza ‘Kristo’ kutoka usomaji tofauti wa hati.
theological_decisions:
- issue: Lugha ya jinsia katika υἱός
  choice: mwana
  alternative: mtoto
  rationale: ‘Mwana’ huhifadhi taswira ya kisheria ya kuwa mwana na mrithi ambayo ni muhimu katika hoja ya Paulo. Dokezo linafafanua kwamba hadhi hiyo haitumiki kwa wanaume pekee.
- issue: Usomaji wa mwisho wa aya
  choice: kupitia Mungu
  alternative: mrithi wa Mungu kupitia Kristo/Masihi
  rationale: Matini iliyotolewa ya SBLGNT ina διὰ θεοῦ. Usomaji huo umewekwa katika matini kuu, na tofauti muhimu ya hati imehifadhiwa katika dokezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa nafsi ya pili umoja umehifadhiwa, na istilahi ‘mtumwa,’ ‘mwana,’ na ‘mrithi’ zinadumisha mfuatano wa hoja kuhusu mabadiliko ya hadhi na urithi.
