  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: sw
  text: Lakini mnajua kwamba kwa sababu ya udhaifu wa mwili nilihubiri habari njema kwenu mara ya kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya ugonjwa wa mwili.” Kifungu cha Kigiriki kinaweza kumaanisha “kwa sababu ya udhaifu/ugonjwa wa mwili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: mnajua
  rationale: Kitenzi οἶδα kina maana ya wakati wa sasa hapa; “mnajua” ni Kiswahili cha kawaida na kinadumisha wito wa Paulo kwa jambo walilolijua tayari.
- source_word: δὲ
  choice: Lakini
  rationale: δέ inaonyesha tofauti au mpito wa kiasi kutoka hoja iliyotangulia; “Lakini” inafaa katika muktadha huu.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya jambo ambalo Wagalatia wanalijua.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: kwa sababu ya udhaifu wa mwili
  rationale: διά pamoja na hali ya accusative huonyesha sababu. ἀσθένεια inaweza kumaanisha udhaifu au ugonjwa, na τῆς σαρκὸς hapa inaelekeza kwenye hali ya kimwili. “Udhaifu wa mwili” huhifadhi upana wa maana bila kulazimisha kwamba ulikuwa ugonjwa maalumu.
- source_word: εὐηγγελισάμην
  choice: nilihubiri habari njema
  rationale: Kifungu hiki kinaeleza kutangaza habari njema. “Kuhubiri habari njema” ni lugha ya kawaida, yenye hadhi, na inaendeleza nguvu ya kitenzi.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Dative hapa huonyesha walengwa wa tangazo; “kwenu” ni usemi wa asili katika Kiswahili.
- source_word: τὸ πρότερον
  choice: mara ya kwanza
  rationale: Kifungu hiki kinaweza kurejelea tukio la kwanza au wakati wa awali. “Mara ya kwanza” ni tafsiri ya asili inayolingana na kumbukumbu ya Paulo kuhusu kuwaletea habari njema hapo awali.
theological_decisions:
- issue: Maana ya σάρξ katika ἀσθένειαν τῆς σαρκὸς
  choice: mwili katika maana halisi ya hali ya kimwili
  alternative: udhaifu wa jumla au hali ya dhambi
  rationale: Muktadha unaeleza hali ya Paulo alipowahubiria Wagalatia, si upotovu wa kimaadili. Hata hivyo, “udhaifu” huhifadhi uwezekano wa udhaifu au ugonjwa bila kutaja aina ya tatizo ambalo maandiko hayalitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia “udhaifu wa mwili” katika maandiko makuu ili kuhifadhi utata halisi wa ἀσθένεια, huku tanbihi ikionyesha uwezekano wa maana ya ugonjwa.
