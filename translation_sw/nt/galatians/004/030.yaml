base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: sw
  text: Lakini Maandiko yanasemaje? “Mfukuze mwanamke mtumwa[a] na mwanawe,[b] kwa maana mwana wa mwanamke mtumwa kamwe hatarithi[c] pamoja na mwana wa mwanamke huru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijakazi.” Neno la Kigiriki humaanisha mtumishi wa kike aliye katika hali ya utumwa; “mwanamke mtumwa” limetumiwa hapa kwa sababu tofauti kati ya utumwa na uhuru ni muhimu katika kifungu hiki.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yanarejelea Mwanzo 21:10.
    reason: cross_reference
  - marker: c
    text: 'Kigiriki kina ukanushaji wenye mkazo: “kamwe hatarithi”; pia inaweza kutafsiriwa “hatarithi hata kidogo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti na hoja iliyotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: τί λέγει ἡ γραφή
  choice: Maandiko yanasemaje?
  rationale: Ni mtindo wa kawaida wa Kiswahili wa kutaja Maandiko kama mamlaka inayosema sasa, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: Ἔκβαλε
  choice: Mfukuze
  rationale: Kitenzi hiki cha amri kinaonyesha kumwondoa kwa nguvu; ni kizito kuliko ‘mwondoe’ au ‘mpeleke.’
- source_word: παιδίσκην
  choice: mwanamke mtumwa
  rationale: Neno linaonyesha mwanamke aliye katika hali ya utumwa; uchaguzi huu huhifadhi tofauti kuu ya kifungu kati ya utumwa na uhuru.
- source_word: υἱὸν αὐτῆς
  choice: mwanawe
  rationale: Huwasilisha kwa ufupi na kwa kawaida muundo wa umilikaji wa Kigiriki.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: kwa maana ... kamwe hatarithi
  rationale: ‘Kamwe’ huonyesha ukanushaji wenye mkazo wa οὐ μή pamoja na kitenzi cha wakati ujao.
- source_word: κληρονομήσει
  choice: hatarithi
  rationale: Ni neno la kawaida na sahihi katika muktadha wa urithi wa kifamilia na kisheria.
- source_word: μετὰ τοῦ υἱοῦ
  choice: pamoja na mwana
  rationale: Huonyesha kushiriki urithi pamoja na mwingine, kama matumizi ya μετά yenye hali ya genitive yanavyodokeza hapa.
- source_word: τῆς ἐλευθέρας
  choice: mwanamke huru
  rationale: Hufanya nomino iliyodokezwa iwe wazi na kudumisha tofauti ya moja kwa moja na mwanamke mtumwa.
theological_decisions:
- issue: Tafsiri ya παιδίσκη katika mfano wa Paulo kuhusu Sara na Hagari
  choice: mwanamke mtumwa
  alternative: kijakazi
  rationale: Hoja ya kifungu kinachozunguka inategemea tofauti kati ya utumwa na uhuru. ‘Mwanamke mtumwa’ huweka hali hiyo wazi bila kuingiza fundisho la ziada.
- issue: Nguvu ya ukanushaji katika οὐ γὰρ μὴ κληρονομήσει
  choice: kamwe hatarithi
  alternative: hatarithi hata kidogo
  rationale: Tafsiri hii huhifadhi kauli ya uhakika na yenye mkazo ya Kigiriki bila kufafanua zaidi maana ya kitheolojia ya urithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mfukuze’ huhifadhi ukali wa amri, na ‘mwanamke mtumwa/mwanamke huru’ hudumisha ulinganifu muhimu wa kifungu.
