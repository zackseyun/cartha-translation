  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: sw
  text: ili awakomboe wale walio chini ya Sheria, ili tupokee kufanywa wana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuasiliwa.” Neno la Kigiriki humaanisha kufanywa wana; katika muktadha huu linakazia hadhi kamili katika familia na haki za urithi. Linawahusu waamini wote, wanawake na wanaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili / kusudi
  rationale: Viunganishi hivi vinaonyesha kusudi katika vifungu vyote viwili; ubadilishaji mdogo huepusha urudiaji usio wa lazima huku ukidumisha nguvu ileile ya kusudi.
- source_word: τοὺς ὑπὸ νόμον
  choice: wale walio chini ya Sheria
  rationale: Ni Kiswahili cha kawaida kinachoonyesha watu walio chini ya mamlaka ya Sheria; herufi kubwa inaashiria Sheria ya Musa kulingana na muktadha wa Wagalatia.
- source_word: ἐξαγοράσῃ
  choice: awakomboe
  rationale: Neno hili linadumisha maana ya kuachilia kwa gharama na pia ni la kawaida katika lugha ya kibiblia ya Kiswahili.
- source_word: τὴν υἱοθεσίαν
  choice: kufanywa wana
  rationale: Huhifadhi maana mahususi ya υἱοθεσία ya kupewa hadhi ya wana, hasa hadhi kamili na haki za urithi, bila kudokeza kwamba waamini ni wanaume pekee.
- source_word: ἀπολάβωμεν
  choice: sisi tupokee
  rationale: ‘Tupokee’ ni tafsiri ya moja kwa moja na ya kawaida; kiwakilishi ‘sisi’ huonyesha wazi mabadiliko kutoka ‘wale’ kwenda nafsi ya kwanza wingi.
theological_decisions:
- issue: Lugha yenye jinsia katika υἱοθεσία
  choice: kufanywa wana
  alternative: kuasiliwa / kufanywa watoto wa Mungu
  rationale: ‘Kufanywa wana’ huhifadhi taswira ya Paulo ya hadhi ya mwana na haki za urithi katika mazingira ya kale. Tanbihi inaeleza kwamba hadhi hiyo inawahusu waamini wote, wanawake kwa wanaume.
- issue: Wanaorejelewa na ‘wale walio chini ya Sheria’
  choice: Sheria ya Musa inadokezwa na muktadha
  alternative: sheria kwa maana pana au ya jumla
  rationale: Muktadha wa Wagalatia 4:4–5 unaelekeza hasa kwa walio chini ya Torati, lakini mstari hauongezi wazi neno ‘Musa’; hivyo tafsiri inahifadhi usemi wa chanzo bila kuupanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku istilahi ‘Sheria’ na ‘kukomboa’ zikidumisha muktadha wa Paulo na uzito wa kiteolojia.
