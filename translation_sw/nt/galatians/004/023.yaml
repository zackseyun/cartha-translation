  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: sw
  text: Lakini mwana wa yule mwanamke mtumwa alizaliwa kwa jinsi ya mwili[a], lakini mwana wa yule mwanamke huru alizaliwa kwa njia ya ahadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kwa njia ya kawaida ya kibinadamu” au “kwa uwezo wa kibinadamu.” Kigiriki: “kwa jinsi ya mwili.”'
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ahadi.” Maneno haya yanaonyesha kwamba kuzaliwa huko kulitokana na ahadi ya Mungu, wala si uzazi wa kawaida wa kibinadamu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: mwanamke mtumwa
  rationale: Hali yake ya utumwa ni muhimu katika hoja ya Paulo; tafsiri hii ni ya kawaida na yenye heshima, huku ikihifadhi tofauti yake na mwanamke huru.
- source_word: κατὰ σάρκα
  choice: kwa jinsi ya mwili
  rationale: Inahifadhi neno muhimu la Paulo, ‘mwili,’ bila kulifanya limaanishe hali ya dhambi; hapa linahusu kuzaliwa kwa njia ya kawaida ya kibinadamu.
- source_word: σάρξ
  choice: mwili
  rationale: Katika muktadha huu neno halimaanishi ‘asili ya dhambi,’ bali nyanja ya kawaida ya uzazi wa kibinadamu. ‘Mwili’ huhifadhi pia mwangwi wa matumizi ya Paulo.
- source_word: γεγέννηται
  choice: alizaliwa
  rationale: Hii ndiyo kauli ya kawaida na ya asili katika Kiswahili kwa kuzaliwa kwa mwana, na inafaa katika usimulizi wa matukio yaliyopita.
- source_word: ἐλευθέρα
  choice: mwanamke huru
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinatofautisha wazi hadhi yake na ya mwanamke mtumwa.
- source_word: δι’ ἐπαγγελίας
  choice: kwa njia ya ahadi
  rationale: Inahifadhi wazo la ahadi kuwa njia ambayo kuzaliwa huko kulitokea, bila kuongeza kibainishi kisichopo wazi katika Kigiriki.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: mwana wa yule ... na mwana wa yule
  rationale: Kutaja ‘mwana’ katika vipashio vyote viwili kunafanya warejelewa waliodokezwa katika Kigiriki waeleweke wazi na kudumisha ulinganisho.
theological_decisions:
- issue: Maana ya κατὰ σάρκα ikilinganishwa na δι’ ἐπαγγελίας
  choice: Kuhifadhi tofauti kati ya kuzaliwa ‘kwa jinsi ya mwili’ na kuzaliwa ‘kwa njia ya ahadi,’ huku tanbihi zikifafanua maana ya kimuktadha.
  alternative: Kutafsiri moja kwa moja zaidi kuwa ‘kwa njia ya kawaida ya kibinadamu’ dhidi ya ‘kutokana na ahadi ya Mungu.’
  rationale: Hoja ya Paulo ni ya kiagano na ya kiishara, wala haimaanishi kwamba kuzaliwa kimwili ni dhambi. Matini kuu huhifadhi msamiati na mvutano wa Paulo bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwanamke mtumwa’ huepuka maneno ya kizamani na kuhifadhi uzito wa hadhi ya kijamii; ‘kwa jinsi ya mwili’ huhifadhi istilahi ya Paulo, huku tanbihi zikitoa maana ya kawaida kwa msomaji.
