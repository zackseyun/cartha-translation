  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: sw
  text: Lakini Yerusalemu wa juu ni huru, naye ni mama yetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti na Yerusalemu wa sasa anayetajwa katika muktadha uliotangulia.
- source_word: ἄνω
  choice: wa juu
  rationale: Inahifadhi taswira ya mahali iliyo katika Kigiriki bila kuifasiri moja kwa moja kuwa ‘wa mbinguni’.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἐλευθέρα
  choice: ni huru
  rationale: Inadumisha tofauti ya utumwa na uhuru katika kifungu bila kuongeza nomino ‘mwanamke,’ ambayo haipo wazi hapa.
- source_word: ἥτις
  choice: naye ndiye
  rationale: Kiwakilishi hiki kinaendeleza maelezo ya Yerusalemu; umbo la kibinadamu linafaa kwa kuwa Yerusalemu anatajwa kwa mfano kama mama.
- source_word: μήτηρ
  choice: mama
  rationale: Tafsiri ya moja kwa moja inayohifadhi sitiari ya uzazi iliyo muhimu katika hoja ya Paulo.
- source_word: ἡμῶν
  choice: yetu
  rationale: Ni umbo la kawaida na la asili la kumiliki katika Kiswahili.
theological_decisions:
- issue: Kirejelewa na uhuishaji wa ‘Yerusalemu wa juu’
  choice: 'Kutumia uhuishaji: ‘naye ndiye mama yetu.’'
  alternative: ‘ambaye ni mama yetu’ au ‘ambao ni mama yetu’
  rationale: Katika hoja ya kimfano, Yerusalemu anawakilishwa kama mama anayelingana na mwanamke huru. ‘Naye ndiye’ huonyesha hilo kwa Kiswahili cha asili bila kuongeza fundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yerusalemu wa juu’ huhifadhi sitiari ya asili, na ‘naye ndiye mama yetu’ hutoa uhuishaji kwa namna ya kawaida.
