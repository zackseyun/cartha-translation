translation:
  language: sw
  text: Mnazingatia kwa makini siku na miezi na majira na miaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnazingatia siku na miezi na nyakati maalumu na miaka.” Orodha hii inahusu maadhimisho ya kalenda; “nyakati maalumu” ni tafsiri nyingine inayowezekana ya “majira” (καιρούς).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: siku
  rationale: Nomino hii imetafsiriwa moja kwa moja; muktadha unaonyesha siku zinazoadhimishwa kidini bila kuongeza neno lisilokuwamo katika Kigiriki.
- source_word: παρατηρεῖσθε
  choice: mnazishika kwa uangalifu
  rationale: Kitenzi cha wakati uliopo kinaonyesha tendo linaloendelea la kuzingatia au kushika kwa makini; ‘kushika’ ni Kiswahili cha kawaida kwa kuadhimisha masharti ya kalenda.
- source_word: μῆνας
  choice: miezi
  rationale: Tafsiri ya moja kwa moja inayohifadhi mpangilio wa vipindi vya kalenda.
- source_word: καιρούς
  choice: majira
  rationale: Huhifadhi maana pana ya vipindi au nyakati maalumu bila kuvitaja moja kwa moja kuwa sikukuu.
- source_word: ἐνιαυτούς
  choice: miaka
  rationale: Tafsiri ya moja kwa moja inayokamilisha orodha ya vipindi vya kalenda.
- source_word: καὶ
  choice: na
  rationale: Kurudiwa kwa ‘na’ kunahifadhi mdundo wa orodha ya Kigiriki.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba hivi ni vipindi vya kalenda ya Kiyahudi au ya kidini
  choice: Kuacha maneno ya vipindi vya wakati bila kuongeza ‘takatifu,’ ‘maalumu,’ au ‘za kidini.’
  alternative: Mnazishika kwa uangalifu siku maalumu, miezi, sikukuu na miaka.
  rationale: Kigiriki kinataja vipindi vya wakati bila vivumishi hivyo. Muktadha unaonyesha maadhimisho ya kalenda, lakini tafsiri kuu haipaswi kuongeza umaalumu usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa ‘siku na miezi na majira na miaka’ umehifadhi urudiaji wa viunganishi katika Kigiriki; ‘mnazishika’ linaeleweka kwa kawaida katika muktadha wa kuadhimisha vipindi vya kalenda.
