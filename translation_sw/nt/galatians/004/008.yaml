  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: sw
  text: Lakini wakati ule[a], bila kumjua Mungu, mlikuwa watumwa wa wale ambao kwa asili si miungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini zamani, bila kumjua Mungu, mlikuwa watumwa wa wale ambao kwa asili si miungu.”
    reason: Njia nyingine ya kutafsiri τότε μὲν; ‘zamani’ husisitiza kipindi cha awali katika maisha ya Wagalatia.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti na hoja iliyotangulia kwa njia ya kawaida na yenye nguvu inayofaa katika Kiswahili.
- source_word: τότε μὲν
  choice: wakati ule
  rationale: Inaelekeza kwenye kipindi cha zamani cha Wagalatia; pia inaacha wazi ulinganisho unaoendelea katika mstari unaofuata.
- source_word: οὐκ εἰδότες θεὸν
  choice: mlipokuwa hamjamjua Mungu
  rationale: Muundo wa kitenzi-shirikishi unaeleweka hapa kwa maana ya wakati. ‘Kumjua Mungu’ huhifadhi maana ya uhusiano na Mungu wa kweli.
- source_word: θεὸν
  choice: Mungu
  rationale: Umoja huu unamtaja Mungu wa kweli, tofauti na ‘miungu’ ya wingi mwishoni mwa mstari.
- source_word: ἐδουλεύσατε
  choice: mlifanywa watumwa
  rationale: Huhifadhi dhana nzito ya utumwa katika hoja ya Wagalatia kuhusu utumwa na uhuru, badala ya kuilegeza kuwa ‘mlitumikia’.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: wa wale ambao ... si miungu
  rationale: Kiswahili hutumia ‘mtumwa wa’; ‘wale’ huacha utambulisho wao bila kuwalazimisha kuwa sanamu au pepo.
- source_word: φύσει μὴ
  choice: kwa asili si
  rationale: Inaonyesha kwamba si miungu kwa uhalisi wao, si kwamba tu hawatambuliwi hivyo.
- source_word: θεοῖς
  choice: miungu
  rationale: Neno la kawaida la wingi hudumisha tofauti na Mungu mmoja bila kuongeza ufafanuzi usiomo katika Kigiriki.
theological_decisions:
- issue: Asili ya wale walioabudiwa zamani
  choice: ‘wale ambao kwa asili si miungu’ kama ukanushaji kuhusu uhalisi wao
  alternative: ‘vitu ambavyo kwa kweli si miungu’ au ‘viumbe vinavyoitwa miungu kwa uongo’
  rationale: φύσει μὴ οὖσι θεοῖς husema walivyo kwa asili. Tafsiri haiamui kama ni sanamu au nguvu za kipepo, kwa kuwa Paulo hafafanui hivyo hapa.
- issue: Nguvu ya lugha ya utumwa
  choice: ‘mlifanywa watumwa wa’
  alternative: ‘mliwatumikia’
  rationale: Chaguo hili hudumisha mkondo wa kitheolojia wa utumwa na uhuru katika Wagalatia na nguvu ya ἐδουλεύσατε.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wale ambao’ hudumisha kutokubainishwa kwa wanaorejelewa; ‘kwa asili si miungu’ huhifadhi dai la Kigiriki bila kulipanua.
