review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the contrast, the purpose clause, the plural addressees, and the deliberately unspecified object of ἐκκλεῖσαι. However, “wanaonyesha bidii juu yenu” and “muwaonyeshe wao bidii” do not idiomatically express ζηλόω with a personal object in Standard East African Swahili. “Wana bidii kwenu ... muwe na bidii kwao” retains the lexical and rhetorical repetition more naturally.
  naturalness: “Kuwa na bidii kwa mtu” is clear, current Standard East African Swahili in this relational context. “Kwa njia njema” renders οὐ καλῶς without narrowing the evaluation to motive alone. “Kuwatenga” is natural and appropriately leaves unstated from whom or what they seek to exclude the Galatians.
  terminology: No specialized theological terminology is required. The revised wording preserves the relational sense of ζηλόω without imposing romantic, doctrinal, or overly specific meanings. The footnote explanation of the likely relational reference to Paul and his associates remains appropriately qualified.
  issues:
  - severity: medium
    issue: Non-idiomatic rendering of ζηλόω in both occurrences
    rationale: “Kuonyesha bidii juu ya mtu” and especially “kumwonyesha mtu bidii” are calqued and unnatural here. The Greek has the Galatians and the opponents as the objects of corresponding zealous interest; “kuwa na bidii kwa” conveys this more idiomatically while preserving the parallel.
  - severity: low
    issue: “Si kwa nia njema” narrows οὐ καλῶς
    rationale: The Greek evaluates their zeal broadly as not good/right, rather than explicitly naming intention. “Si kwa njia njema” is more directly equivalent and leaves motive to the following explanation.
  revised_text: Wana bidii kwenu[a], lakini si kwa njia njema. Badala yake, wanataka kuwatenga[b], ili ninyi muwe na bidii kwao.
