base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: sw
  text: Wana bidii kwenu[a], lakini si kwa njia njema. Badala yake, wanataka kuwatenga[b], ili ninyi muwe na bidii kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanawatafuta kwa hamu,” au “Wanajaribu kupata upendeleo wenu.” Kitenzi cha Kigiriki kinaweza kueleza bidii au hamu kubwa ya kupata uangalifu na upendeleo wa mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwafungia nje.” Huenda maana ni kwamba wanataka kuwatenga na Paulo na wenzake ili badala yake ninyi muwatafute wao.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε (ζηλόω)
  choice: wanaonyesha bidii juu yenu / muwaonyeshe wao bidii
  rationale: Kitenzi hiki kinaweza kumaanisha kuwa na hamu au bidii kubwa kwa mtu, hata kutafuta kwa dhati upendeleo wake. Kurudia muundo wa “kuonyesha bidii” kunahifadhi ulinganifu wa maneno ya Kigiriki bila kuingiza lazima maana ya kimapenzi.
- source_word: οὐ καλῶς
  choice: lakini si kwa nia njema
  rationale: Katika muktadha huu kifungu kinatathmini si mwonekano wa juhudi zao tu, bali pia lengo lao baya, linalofafanuliwa na sentensi inayofuata.
- source_word: ἐκκλεῖσαι
  choice: kuwatenga
  rationale: Neno lina maana ya kuwafungia nje au kuwatenga. “Kuwatenga” ni Kiswahili cha kawaida kinachohifadhi maana ya kijamii na kimahusiano bila kutaja wazi wanatengwa na nani.
- source_word: θέλουσιν
  choice: wanataka
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha kutaka.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi la tendo lao kwa lugha ya kawaida na sahihi.
theological_decisions:
- issue: Wagalatia wanakusudiwa kutengwa na nani au na nini katika ἐκκλεῖσαι ὑμᾶς?
  choice: Maandishi makuu yanasema tu “kuwatenga,” bila kutaja kitu au kundi ambalo wangetengwa nalo.
  alternative: Kusema wazi kwamba wapinzani wanataka kuwatenga na Paulo na washirika wake, au na baraka za Mungu au jumuiya ya waamini.
  rationale: Muktadha unaunga mkono wazo la kuwatenga na Paulo na ushawishi wake ili wafuate walimu hao, lakini Kigiriki hakitaji moja kwa moja wanatengwa na nani au na nini. Kutoliweka wazi katika maandishi makuu kunahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Juu yenu” na urudiaji wa “kuonyesha bidii” huhifadhi ulinganifu wa ζηλοῦσιν na ζηλοῦτε; kiwakilishi “wao” kimewekwa kwa mkazo unaolingana na αὐτούς.
