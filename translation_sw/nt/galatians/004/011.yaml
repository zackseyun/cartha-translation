  source_fidelity: “Ninawahofia” correctly expresses φοβοῦμαι ὑμᾶς as pastoral concern for the Galatians, rather than fear of them. “Kwamba huenda” appropriately renders the apprehensive uncertainty of μή πως. “Nimejitaabisha” reflects the completed, strenuous labor denoted by the perfect κεκοπίακα, while “bure” accurately conveys εἰκῇ. “Kwa ajili yenu” is an idiomatic Swahili rendering of labor directed toward the recipients.
