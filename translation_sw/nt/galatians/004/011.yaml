base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: sw
  text: Ninawahofia[a], kwamba huenda nimejitaabisha kwa ajili yenu bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nina wasiwasi juu yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: Ninawahofia
  rationale: Kitenzi cha wakati wa sasa pamoja na shamirisho ὑμᾶς kinaeleza wasiwasi wa Paulo juu ya hali ya Wagalatia, si kwamba anawaogopa wao.
- source_word: μή πως
  choice: kwamba huenda
  rationale: Kishazi hiki kinaanzisha jambo linalomhangaisha Paulo na kuhifadhi maana ya uwezekano wenye kutia wasiwasi.
- source_word: εἰκῇ
  choice: bure
  rationale: Hutoa maana ya kazi kutokuwa na matokeo au kutimiza kusudi lake.
- source_word: κεκοπίακα
  choice: nimejitaabisha
  rationale: Wakati timilifu unaonyesha juhudi kubwa iliyokwisha kufanywa ambayo matokeo yake yana umuhimu sasa; kujitaabisha huhifadhi uzito wa κοπιάω.
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Kihusishi kinaonyesha kwamba juhudi za Paulo zilielekezwa kwao na kwa manufaa yao; huu ni usemi wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Asili ya hofu ya Paulo
  choice: Paulo ana wasiwasi kwamba kazi yake ngumu kwa Wagalatia huenda isizae matunda.
  alternative: Paulo anawaogopa Wagalatia wenyewe, au anaonyesha tu wasiwasi wa kawaida wa kibinafsi.
  rationale: Muundo φοβοῦμαι ὑμᾶς μή πως pamoja na εἰκῇ unaelekeza kwenye wasiwasi wa kichungaji kuhusu uwezekano wa juhudi zake kuwa bure, bila kudai kwa uhakika kwamba zimekuwa bure.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. “Ninawahofia” ni fupi lakini inaweza kueleweka vibaya kama kuwaogopa, hivyo tanbihi inaweka wazi maana ya wasiwasi juu yao.
