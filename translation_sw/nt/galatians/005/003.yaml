base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: sw
  text: Nami namshuhudia tena kila mtu anayekubali kutahiriwa kwamba ana wajibu wa kuishika sheria yote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayetahiriwa” au “anayekubali atahiriwe.” Kauli ya Kigiriki inaweza kutafsiriwa kwa njia hizi za karibu; muktadha unaelekea kumaanisha mtu anayekubali tohara katika mzozo huu.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “ni mdaiwa”; yaani, yuko chini ya wajibu wa kuishika sheria yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: namshuhudia
  rationale: Kitenzi hiki hapa ni tamko zito la ushahidi au uthibitisho wa binafsi. “Namshuhudia” huhifadhi nguvu hiyo rasmi kwa Kiswahili cha sasa.
- source_word: δὲ
  choice: Nami
  rationale: Kiunganishi hiki kinaendeleza hoja ya mstari uliotangulia bila kuonyesha upinzani mkali; “Nami” huunganisha sentensi kwa kawaida.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudia au kusisitiza upya.
- source_word: παντὶ ἀνθρώπῳ
  choice: kila mtu
  rationale: ἄνθρωπος hapa ina maana jumuishi ya binadamu kwa ujumla; “kila mtu” ni ya kawaida, sahihi, na huhifadhi mgawanyo wa umoja.
- source_word: περιτεμνομένῳ
  choice: anayekubali kutahiriwa
  rationale: Kauli endelevu ya Kigiriki inaweza kumaanisha anayatahiriwa au anayejitia chini ya tendo hilo. Katika mzozo huu, “anayekubali kutahiriwa” huonyesha kujisalimisha kwa tohara bila kuongeza nia isiyotajwa wazi.
- source_word: ὀφειλέτης ἐστίν
  choice: ana wajibu
  rationale: Nomino ὀφειλέτης kihalisi ni “mdaiwa,” lakini hapa inaonyesha kuwa mtu yuko chini ya wajibu, si deni la fedha.
- source_word: ὅλον τὸν νόμον
  choice: sheria yote
  rationale: Usemi huu unasisitiza ukamilifu wa matakwa ya sheria.
- source_word: ποιῆσαι
  choice: kuishika
  rationale: Ingawa maana ya msingi ni “kufanya,” pamoja na “sheria” Kiswahili cha kawaida hutumia “kuishika” kueleza kuitii au kuitekeleza.
theological_decisions:
- issue: Upeo wa kauli ya Paulo kuhusu tohara na wajibu kwa sheria
  choice: Kauli inamlenga mtu anayekubali kutahiriwa katika mzozo wa Wagalatia, na hivyo kuwa chini ya wajibu wa kuishika sheria yote.
  alternative: Kauli inaweza kueleweka kwa upana kuwa inamhusu kila mwanamume aliyetahiriwa, kutia ndani Wayahudi waliotahiriwa utotoni.
  rationale: Muktadha wa 5:2–3 unawahusu wanaofikiria kuikubali tohara kama takwa la kidini. Tafsiri haiongezi wazi kwamba tohara hiyo ni njia ya kuhesabiwa haki, kwa kuwa nia hiyo haikutajwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kila mtu” hutumiwa kwa maana jumuishi ya ἄνθρωπος. Alama zote za tanbihi zimewekwa katika matini kuu.
