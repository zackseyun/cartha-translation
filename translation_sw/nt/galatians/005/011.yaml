id: GAL.5.11
reference: Galatians 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: sw
  text: Lakini mimi, ndugu[a], ikiwa bado ninahubiri tohara, kwa nini bado ninateswa? Basi, kikwazo cha msalaba kimeondolewa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume lakini linaweza kulitaja kundi lenye wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “Basi, chukizo la msalaba limebatilishwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida na lenye heshima linaloweza kuwaita waumini wa kiume na wa kike; linadumisha uhusiano wa kifamilia unaoonyeshwa na neno la Kigiriki.
- source_word: περιτομήν
  choice: tohara
  rationale: “Tohara” ni neno la kawaida la Kiswahili kwa περιτομή na katika muktadha huu linahusu tendo hilo pamoja na dai la kulifanya kuwa sharti la kidini.
- source_word: ἔτι
  choice: bado
  rationale: “Bado” limetumiwa katika sehemu zote mbili ili kuhifadhi urudiaji na hoja ya Paulo kuhusu hali inayoendelea.
- source_word: κηρύσσω
  choice: ninahubiri
  rationale: “Ninahubiri” linaonyesha utangazaji wa hadharani na hali endelevu ya kitenzi cha wakati uliopo.
- source_word: διώκομαι
  choice: ninateswa
  rationale: “Ninateswa” linaonyesha wazi kauli tendwa na upinzani wa uadui unaomaanishwa katika muktadha.
- source_word: ἄρα
  choice: Basi
  rationale: “Basi” linaonyesha hitimisho linalotokana na hali ya kudhaniwa katika sentensi iliyotangulia.
- source_word: κατήργηται
  choice: kimeondolewa
  rationale: Wakati timilifu wa kauli tendwa unaonyesha tendo lenye matokeo yanayoendelea; “kimeondolewa” ni la kawaida na haliongezi ufafanuzi wa kiufundi.
- source_word: σκάνδαλον
  choice: kikwazo
  rationale: “Kikwazo” hudumisha picha ya kitu kinachomfanya mtu ajikwae, huku pia kikibeba maana ya jambo linalochochea kukataliwa.
- source_word: σταυροῦ
  choice: msalaba
  rationale: “Msalaba” ndilo neno la kawaida la Kiswahili kwa σταυρός katika matumizi ya Paulo.
theological_decisions:
- issue: Maana ya σκάνδαλον τοῦ σταυροῦ
  choice: kikwazo cha msalaba
  alternative: chukizo la msalaba
  rationale: “Kikwazo” kinahifadhi taswira halisi ya σκάνδαλον na mvutano kwamba ujumbe wa msalaba huwafanya wengine wakatae au wajikwae; “chukizo” linaweza kueleza upande wa kukera lakini linaelekeza maana zaidi.
- issue: Uhusiano kati ya kuhubiri tohara na mateso ya Paulo
  choice: Sentensi ya masharti imeachwa kama hoja ya Paulo bila kueleza sababu zaidi ndani ya maandishi
  alternative: Kuongeza kwamba tohara ni sharti la wokovu au la sheria
  rationale: Chanzo chenyewe hakifafanui hapa kwa maneno hayo kile ambacho “kuhubiri tohara” kingemaanisha; tafsiri inahifadhi hoja na mvutano bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Urudiaji wa “bado” umehifadhiwa, na “tohara” pamoja na “msalaba” zimetumiwa kama istilahi za kawaida za kibiblia.
