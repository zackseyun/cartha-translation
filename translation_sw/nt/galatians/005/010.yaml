id: GAL.5.10
reference: Galatians 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: sw
  text: Nina hakika katika Bwana kuhusu ninyi kwamba hamtakuwa na mtazamo mwingine wowote[a]. Lakini yule anayewavuruga atabeba hukumu, hata awe nani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamtafikiri tofauti.” Kitenzi cha Kigiriki kinaweza kutaja kufikiri kwa ujumla au kuwa na mtazamo au msimamo fulani.
    reason: lexical_alternative
  - marker: b
    text: Au, “yeyote yule.”
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: Nina hakika
  rationale: Kauli hii ya wakati timilifu inaonyesha hali thabiti ya kuwa na uhakika; Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya sasa.
- source_word: εἰς ὑμᾶς
  choice: kuhusu ninyi
  rationale: Katika muundo huu inaelekeza uhakika wa Paulo kwa matarajio yake kuhusu Wagalatia, bila kudokeza kwamba chanzo cha uhakika huo ni wao.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Inahifadhi usemi wa Paulo unaoweza kuonyesha mazingira au msingi wa uhakika wake.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: hamtakuwa na msimamo mwingine
  rationale: φρονέω inaweza kumaanisha kufikiri, kuwa na mtazamo, au kushikilia msimamo. Katika Kiswahili, kifungu hiki huwasilisha kwa kawaida kutokubali mtazamo tofauti.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: yule anayewavuruga
  rationale: Kitenzi cha wakati wa sasa kinaonyesha mtu anayeendelea kusababisha msukosuko; “kuwavuruga” kina nguvu inayofaa katika muktadha.
- source_word: βαστάσει τὸ κρίμα
  choice: atabeba hukumu yake
  rationale: “Atabeba” inadumisha sitiari ya βαστάζω, huku “hukumu” ikihifadhi upana wa κρίμα kati ya uamuzi na adhabu inayotokana nao. Kiwakilishi “yake” kinaonyesha kwamba hukumu hiyo itamwangukia mhusika.
- source_word: ὅστις ἐὰν ᾖ
  choice: hata awe nani
  rationale: 'Huwasilisha nguvu ya uhusiano usioainishwa: utambulisho au hadhi ya mvurugaji haibadili onyo.'
theological_decisions:
- issue: Asili ya uhakika wa Paulo kuhusu Wagalatia
  choice: Uhakika wake kuhusu msimamo wao wa baadaye umewekwa katika Bwana.
  alternative: Kauli ya uhakika usio na masharti kwamba wote watadumu, au matumaini ya kibinadamu yasiyo na msingi wa kitheolojia.
  rationale: Maandishi yanaunganisha uhakika wa Paulo, msingi wake “katika Bwana,” na matarajio ya wakati ujao bila kufafanua utaratibu au masharti yake.
- issue: Nguvu ya τὸ κρίμα
  choice: Hukumu inayompata mvurugaji, bila kubainisha namna yake hasa.
  alternative: Hukumu ya milele pekee, au matokeo ya kijamii na nidhamu ya kanisa pekee.
  rationale: κρίμα inaweza kumaanisha uamuzi, hukumu, au adhabu inayofuata; aya yenyewe haiifafanui zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Msimamo” ni wazi kwa wasomaji wa kawaida na kinaonyesha maana ya mtazamo unaoshikiliwa; tanbihi inahifadhi tafsiri ya moja kwa moja zaidi ya “kufikiri.”
