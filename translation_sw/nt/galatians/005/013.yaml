source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: sw
  text: Kwa maana ninyi mliitwa mpate uhuru, ndugu[a]; ila tu, msiufanye uhuru huo kuwa fursa kwa mwili[b][c], bali kwa njia ya upendo tumikianeni[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume wingi, lakini katika barua hii linaitaja jumuiya yote ya waamini, wakiwemo wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au “kuwa mahali pa kuanzia kwa mwili”; yaani, msingi au nafasi ya kufuata tamaa zenye dhambi za kujitafutia manufaa binafsi.
    reason: lexical_alternative
  - marker: c
    text: Hapa “mwili” haumaanishi mwili wa kimwili tu, bali pia misukumo ya mwanadamu aliyeanguka; tafsiri nyingine husema “asili ya dhambi.”
    reason: alternative_reading
  - marker: d
    text: Kitenzi kilichotafsiriwa “tumikianeni” kinahusiana na neno la Kigiriki linalomaanisha “mtumwa” na hubeba wazo la mtu kujitoa kuwatumikia wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi katika Kigiriki kwa kusisitiza; “ninyi” kinahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli hii inaeleza na kuunga mkono hoja iliyotangulia.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: mpate uhuru
  rationale: Kirai hiki kinaeleza lengo au hali ambayo waamini waliitiwa. “Mpate uhuru” ni cha asili katika Kiswahili na hakifungi maana katika tafsiri finyu.
- source_word: ἐκλήθητε
  choice: mliitwa
  rationale: Huhifadhi kauli tendwa na lugha ya Paulo kuhusu mwito bila kuingiza mfumo maalumu wa kitheolojia.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida, wenye heshima, kwa jumuiya ya waamini na unaweza kuwahusisha wanaume na wanawake huku tanbihi ikifafanua umbo la Kigiriki.
- source_word: μόνον
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka kikomo muhimu kwa uhuru uliotajwa; “lakini” linafikisha nguvu hiyo ya tahadhari kwa Kiswahili cha asili.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: msiufanye ... kuwa fursa
  rationale: ἀφορμή inaweza kumaanisha nafasi, sababu, au mahali pa kuanzia. “Kuwa fursa” linaeleza kwa uwazi onyo dhidi ya kugeuza uhuru kuwa nafasi ya kutenda dhambi.
- source_word: σάρξ
  choice: mwili
  rationale: Inahifadhi istilahi yenye uzito ya Paulo badala ya kuifasiri moja kwa moja kuwa “asili ya dhambi”; maana yake ya kimaadili inafafanuliwa katika tanbihi.
- source_word: διὰ τῆς ἀγάπης
  choice: kwa njia ya upendo
  rationale: Huhifadhi maana ya upendo kuwa njia au chombo ambacho kupitia kwake waamini wanatumikiana.
- source_word: δουλεύετε ἀλλήλοις
  choice: tumikianeni
  rationale: Kitenzi cha Kiswahili chenye hali ya kutendeana kinafikisha agizo la kuhudumiana; tanbihi inahifadhi picha yenye nguvu ya utumishi wa mtumwa iliyomo katika kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya ἀδελφοί katika mwito kwa jumuiya yenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki lina umbo la kiume wingi lakini katika barua hii linaitaja jumuiya nzima. Kiswahili “ndugu” ni cha asili na jumuishi bila kupotosha mwito wa kifamilia.
- issue: Maana ya σάρξ katika mawaidha ya Paulo
  choice: mwili
  alternative: asili ya dhambi; tamaa za kibinadamu zilizoanguka
  rationale: “Mwili” huhifadhi sitiari na mvutano wa kitheolojia wa Paulo; tanbihi inaonyesha kuwa hapa si mwili wa kimwili peke yake.
- issue: Nguvu ya δουλεύετε pamoja na kiwakilishi cha kutendeana
  choice: tumikianeni
  alternative: weni watumwa wa mtu na mwenzake
  rationale: “Tumikianeni” ni agizo la kawaida na wazi kwa Kiswahili, huku tanbihi ikihifadhi uhusiano wa kitenzi hicho na utumwa na hivyo nguvu yake ya kujitoa kwa ajili ya wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa kwa sentensi mbili ili kuleta uwazi, lakini uhusiano wa hoja, tahadhari, na agizo umehifadhiwa. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
