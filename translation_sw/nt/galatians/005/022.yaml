base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: sw
  text: Lakini tunda la Roho ni upendo, furaha, amani, uvumilivu, fadhili, wema, uaminifu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imani.” Neno la Kigiriki pistis linaweza kumaanisha imani, kumwamini mtu, au uaminifu. Katika orodha hii ya sifa, “uaminifu” hufaa vizuri, lakini “imani” pia ni tafsiri halali.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti na matendo ya mwili yaliyotajwa katika mistari 19–21.
- source_word: καρπὸς
  choice: tunda
  rationale: Inahifadhi sitiari ya Paulo na umoja wa nomino, unaowasilisha sifa hizi kama zao moja la Roho.
- source_word: τοῦ πνεύματός
  choice: la Roho
  rationale: Katika muktadha huu inamrejelea Roho Mtakatifu, anayelinganishwa na mwili katika kifungu kinachozunguka.
- source_word: ἀγάπη
  choice: upendo
  rationale: Ni neno la kawaida, la sasa, na pana kwa sifa hii.
- source_word: χαρά
  choice: furaha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika orodha ya sifa.
- source_word: εἰρήνη
  choice: amani
  rationale: Inadumisha maana pana inayoweza kuhusisha amani ya ndani na kati ya watu bila kuibana.
- source_word: μακροθυμία
  choice: uvumilivu
  rationale: Ni Kiswahili cha kawaida kinachoeleza uwezo wa kustahimili kwa muda bila kulipiza kisasi au kukasirika upesi.
- source_word: χρηστότης
  choice: wema
  rationale: Huwasilisha tabia ya kumtendea mwingine kwa fadhili; ni ya asili zaidi katika orodha hii kuliko istilahi nzito.
- source_word: ἀγαθωσύνη
  choice: uzuri wa moyo
  rationale: Hutofautisha sifa hii na χρηστότης na kueleza ubora wa kimaadili unaokusudiwa, bila kutumia muundo usio wa kawaida wa kurudia 'wema'.
- source_word: πίστις
  choice: uaminifu
  rationale: Katika orodha ya sifa za tabia, maana ya kuwa mwaminifu na mwenye kutegemewa inafaa vizuri; hata hivyo, maana 'imani' ni halisi na imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa πνεῦμα
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu
  rationale: Tofauti ya karibu kati ya Roho na mwili katika Wagalatia 5, pamoja na hoja pana ya Paulo, inaunga mkono kumwelewa Roho Mtakatifu hapa.
- issue: Maana ya πίστις katika orodha ya sifa
  choice: uaminifu
  alternative: imani
  rationale: Muktadha wa orodha ya maadili unaunga mkono sifa ya kuwa mwaminifu na mwenye kutegemewa, lakini neno la Kigiriki linaweza pia kumaanisha imani; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha umewekwa kwa ufupi, na umoja wa 'tunda' umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
