  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: sw
  text: upole, kujitawala; dhidi ya mambo kama hayo hakuna sheria.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya watu kama hao hakuna sheria”; hata hivyo, hapa maneno haya yanaelekea zaidi kurejelea sifa zilizoorodheshwa kuliko watu wanaozionyesha.
    reason: lexical_alternative
  - marker: b
    text: Au “hakuna sheria inayopinga mambo kama hayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: upole
  rationale: Katika orodha hii ya maadili, neno hili linaeleza tabia ya utulivu, unyenyekevu na kutokuwa mkali. “Upole” ni neno la kawaida na linaloeleweka vizuri katika Kiswahili cha sasa.
- source_word: ἐγκράτεια
  choice: kiasi
  rationale: Neno hili humaanisha uwezo wa kutawala tamaa na misukumo ya mtu. “Kiasi” ni istilahi fupi inayofaa mtindo wa orodha ya matunda ya Roho; hapa ina maana ya kujizuia au kujitawala, si kupunguza jambo fulani tu.
- source_word: κατὰ τῶν τοιούτων
  choice: dhidi ya mambo kama hayo
  rationale: Ingawa τοιούτων inaweza kurejelea watu au mambo, muktadha unaelekeza zaidi kwenye sifa zilizoorodheshwa. “Dhidi ya mambo kama hayo” inadumisha maana ya upinzani iliyo katika κατά na inasikika kwa kawaida.
- source_word: νόμος
  choice: sheria
  rationale: Neno νόμος halina kibainishi katika Kigiriki. “Sheria” bila “ile” linahifadhi upana wa kauli na halilazimishi msomaji kuielewa kuwa Sheria ya Musa pekee.
theological_decisions:
- issue: Upeo wa νόμος katika kauli ya Paulo
  choice: “sheria” kwa maana pana
  alternative: “Sheria” kama rejeo mahsusi kwa Sheria ya Musa
  rationale: 'Hoja ya Wagalatia inahusiana sana na Sheria ya Musa, lakini muundo usio na kibainishi hapa pia unaruhusu kauli ya jumla: hakuna sheria inayopinga sifa hizi. Tafsiri hii inadumisha mvutano huo bila kuufunga kwa maana moja tu.'
- issue: Kinachorejelewa na τοιούτων
  choice: Sifa au mambo yaliyoorodheshwa
  alternative: Watu wenye kuonyesha sifa hizo
  rationale: Umbo la Kigiriki linaweza kurejelea mambo au watu, lakini rejeo la karibu na mtiririko wa orodha vinaunga mkono zaidi sifa hizo. Uwezekano wa kurejelea watu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Kiasi” kinaendeleza umbo la nomino katika orodha, huku tanbihi na maamuzi ya kileksika yakifafanua maana yake ya kujitawala.
