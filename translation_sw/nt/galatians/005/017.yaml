id: GAL.5.17
reference: Galatians 5:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: sw
  text: Kwa maana mwili[a] hutamani yaliyo kinyume na Roho[b], naye Roho hutamani yaliyo kinyume na mwili; kwa maana mwili na Roho hupingana, ili msifanye mambo mnayotaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili ya dhambi.” Neno la Kigiriki ni σάρξ (sarx), ambalo hapa Paulo analitumia kwa maana pana ya kimaadili kuliko mwili wa kimwili tu.
    reason: lexical_alternative
  - marker: b
    text: Au “roho,” ikiwa neno hili linaeleweka kumaanisha roho ya mwanadamu badala ya Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: mwili
  rationale: Neno “mwili” linadumisha sitiari ya Paulo badala ya kuibadili moja kwa moja kuwa maelezo ya kitafsiri kama “asili ya dhambi.” Katika muktadha huu halimaanishi mwili wa kimwili tu, bali mwelekeo wa kibinadamu unaompinga Mungu.
- source_word: ἐπιθυμεῖ
  choice: hutamani
  rationale: “Hutamani” ni Kiswahili cha kawaida kinachoonyesha hamu au mwelekeo wenye nguvu; uadui unaonyeshwa wazi na kirai “yaliyo kinyume na.”
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: yaliyo kinyume na Roho / yaliyo kinyume na mwili
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kuelekezwa dhidi ya upande mwingine.
- source_word: πνεῦμα
  choice: Roho
  rationale: Muktadha wa karibu wa Wagalatia 5 unaelekea kumtaja Roho Mtakatifu; herufi kubwa inaonyesha uamuzi huo huku tanbihi ikihifadhi uwezekano wa “roho” ya mwanadamu.
- source_word: ἀλλήλοις ἀντίκειται
  choice: mwili na Roho hupingana
  rationale: Kurudia wahusika wote wawili kunaifanya sentensi iwe wazi na ya kawaida katika Kiswahili, huku kukihifadhi kupingana kwa pande zote mbili.
- source_word: ἵνα μὴ
  choice: ili ... msifanye
  rationale: “Ili ... msifanye” linahifadhi muundo wa Kigiriki unaoweza kueleweka kwa upande wa kusudi au matokeo bila kuufafanua kupita kiasi.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: msifanye mambo mnayotaka
  rationale: Tafsiri hii inawasilisha kirai cha uhusiano kisicho na mpaka kwa Kiswahili wazi, bila kuongeza dhana ya mazoea ambayo haijasemwa wazi.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa kimaadili wa Paulo
  choice: Kudumisha “mwili” katika matini kuu kama sitiari ya Paulo.
  alternative: asili ya dhambi
  rationale: Ingawa muktadha ni wa kimaadili, “mwili” huhifadhi msamiati na mvutano wa kitheolojia wa Paulo badala ya kuufanya ufafanuzi mmoja kuwa sehemu ya matini.
- issue: Mrejelewa wa πνεῦμα
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho ya mwanadamu
  rationale: Muktadha mpana wa Wagalatia 5 unapambanua kuenenda kwa Roho na tamaa za mwili, jambo linalounga mkono rejeo kwa Roho Mtakatifu; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha sitiari ya “mwili,” inatumia “Roho” kwa mrejelewa anayewezekana zaidi katika muktadha, na inaweka alama zote za tanbihi moja kwa moja baada ya maneno yanayohusika.
