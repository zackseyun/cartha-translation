id: GAL.5.21
reference: Galatians 5:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: sw
  text: husuda, ulevi, sherehe za kupindukia[a], na mambo mengine kama hayo. Ninawaonya kuhusu mambo hayo, kama nilivyowaonya hapo awali, kwamba wale wanaotenda mambo kama hayo hawataurithi ufalme wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe za fujo” au “tafrija za kupindukia.” Neno la Kigiriki linamaanisha sherehe zenye anasa na kukosa kiasi, mara nyingi zikihusiana na unywaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: husuda
  rationale: Neno hili linaonyesha kutamani kwa chuki mema aliyo nayo mwingine. “Husuda” ni neno la kawaida na lenye hadhi katika Kiswahili, na linatofautishwa na wivu wa aina nyingine.
- source_word: μέθαι
  choice: ulevi
  rationale: Linataja hali au matendo ya kulewa. “Ulevi” ni tafsiri fupi, ya kawaida, na inayoeleweka wazi katika orodha ya maovu.
- source_word: κῶμοι
  choice: sherehe za kupindukia
  rationale: Neno la Kigiriki linamaanisha sherehe zenye anasa na mwenendo usio na kiasi, mara nyingi zikihusiana na unywaji. Tafsiri hii ni ya kisasa na haibani maana kuwa matendo ya kingono pekee.
- source_word: τὰ ὅμοια τούτοις
  choice: mambo mengine kama hayo
  rationale: Inadumisha upana wa kauli ya Paulo kwa kuonyesha kwamba orodha hiyo si kamili.
- source_word: ἃ προλέγω ὑμῖν
  choice: Ninawaonya kuhusu mambo hayo
  rationale: Katika muktadha huu προλέγω ina nguvu ya kutoa onyo mapema, si kutoa taarifa tu.
- source_word: καθὼς προεῖπον
  choice: kama nilivyowaonya hapo awali
  rationale: Inadumisha msisitizo wa onyo lililotolewa tena kwa kurejelea onyo la awali.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: wale wanaotenda mambo kama hayo
  rationale: Muundo wa wakati wa sasa unaelekea kueleza mwenendo wa kawaida au unaoendelea. Kiswahili cha “wanaotenda” huwasilisha mwenendo huo bila kuongeza dai kwamba tendo moja pekee ndilo linalokusudiwa.
- source_word: βασιλείαν θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri ya kawaida, ya moja kwa moja, na inayohifadhi istilahi ya kiteolojia ya Agano Jipya.
- source_word: οὐ κληρονομήσουσιν
  choice: hawataurithi
  rationale: Inahifadhi lugha ya urithi na nguvu ya wakati ujao katika onyo hili.
theological_decisions:
- issue: Ikiwa onyo linahusu matendo ya mara moja au mwenendo unaotambulisha maisha
  choice: wale wanaotenda mambo kama hayo
  alternative: wale wanaofanya jambo kama hilo hata mara moja
  rationale: Kivumishi-partisipio cha wakati wa sasa pamoja na πράσσω katika orodha hii ya maovu kinaelekea kuonyesha mwenendo wa kawaida. Tafsiri haifanyi uamuzi wa kimadhehebu kuhusu kosa moja la pekee, bali inadumisha uzito na mvutano wa onyo lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya “sherehe za kupindukia,” ambako maelezo ya κῶμοι yanahusika.
