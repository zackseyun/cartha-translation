id: GAL.5.18
reference: Galatians 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: sw
  text: Lakini ikiwa mnaongozwa na Roho[a], hamko chini ya sheria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mnaendelea kuongozwa na Roho.”
    reason: lexical_alternative
  - marker: b
    text: Kuwa “chini ya sheria” ni kuwa chini ya mamlaka au utawala wa sheria; linganisha Wagalatia 5:23.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: ikiwa
  rationale: Huanzisha kishazi cha sharti; “ikiwa” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: δὲ
  choice: lakini
  rationale: Inaonyesha utofauti wa kiasi na mjadala unaotangulia kuhusu mwili na Roho.
- source_word: πνεύματι
  choice: na Roho
  rationale: Hapa nomino hii inamrejelea Roho Mtakatifu katika utofauti wa Paulo kati ya mwili na Roho (Wagalatia 5:16–25). Kiswahili hakihitaji kuongeza neno “Mtakatifu” ili maana hiyo ya kimuktadha ihifadhiwe.
- source_word: ἄγεσθε
  choice: mnaongozwa
  rationale: Ni kitenzi cha wakati uliopo, kauli tendwa, nafsi ya pili wingi. “Mnaongozwa” huhifadhi kauli tendwa na hali inayoendelea bila kuizidisha maana.
- source_word: οὐκ ἐστὲ
  choice: hamko
  rationale: Ni usemi wa kawaida wa kukanusha hali au nafasi, ukielekezwa kwa nafsi ya pili wingi.
- source_word: ὑπὸ νόμον
  choice: chini ya sheria
  rationale: Huhifadhi nahau ya Paulo inayoonyesha kuwa chini ya mamlaka au utawala wa sheria; “sheria” hapa kwa muktadha inarejelea Sheria ya Musa.
theological_decisions:
- issue: Mrejelewa wa πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu
  rationale: Katika Wagalatia 5, utofauti unaorudiwa ni kati ya mwili na Roho, ambaye ndiye mtendaji wa kimungu anayewawezesha waamini. Matini kuu inasema “Roho” bila kuongeza ufafanuzi usio katika Kigiriki.
- issue: Maana ya ὑπὸ νόμον
  choice: kutokuwa chini ya mamlaka au utawala wa Sheria ya Musa
  alternative: kutokuwa chini ya sheria kwa maana ya jumla
  rationale: Katika matumizi ya Paulo, hasa katika Wagalatia, kirai hiki kwa kawaida hueleza kuwa chini ya mamlaka au utawala wa Sheria ya Musa. Tafsiri kuu inadumisha kirai chenyewe badala ya kukipanua kuwa mfumo kamili wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Wingi wa nafsi ya pili umehifadhiwa katika “mnaongozwa” na “hamko.”
