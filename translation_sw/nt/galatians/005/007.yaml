  text: Mlikuwa mkikimbia vizuri. Ni nani aliyewazuia kuitii kweli?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani aliyewazuia kushawishika kwa kweli?” Kitenzi cha Kigiriki kinaweza kumaanisha “kutii” au “kushawishika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Mlikuwa mkikimbia
  rationale: Kauli ya wakati uliopita unaoendelea inaonyesha tendo lililokuwa likiendelea; ‘mkikimbia’ inadumisha sitiari ya riadha bila kuongeza ‘mbio,’ ambalo halimo wazi katika Kigiriki.
- source_word: καλῶς
  choice: vizuri
  rationale: Kielezi hiki kinafafanua jinsi walivyokuwa wakikimbia; ‘vizuri’ ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: τίς
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza hapa kinamrejelea mtu aliyesababisha kizuizi.
- source_word: ἐνέκοψεν
  choice: aliyewazuia
  rationale: Kitenzi kina maana ya kuzuia au kukatiza mwendo. ‘Aliyewazuia’ kinaeleweka kwa urahisi na bado kinaendana na sitiari ya wakimbiaji.
- source_word: τῇ ἀληθείᾳ
  choice: kweli
  rationale: Nomino yenye kibainishi hapa inaelekea kuirejelea kweli ya Injili ambayo Wagalatia walikuwa wameipokea; katika Kiswahili, ‘kuitii kweli’ ni usemi wa asili bila kulazimisha kibainishi tofauti.
- source_word: μὴ πείθεσθαι
  choice: kuendelea kuitii
  rationale: πείθεσθαι inaweza kumaanisha ‘kutii’ au ‘kushawishiwa.’ ‘Kuitii’ inafaa katika muktadha wa mwitikio wao kwa kweli; ‘kuendelea’ huonyesha kwamba kizuizi kiliwakomesha katika mwendo waliokuwa nao, bila kubadili wazo kuu.
theological_decisions:
- issue: Maana ya πείθεσθαι pamoja na τῇ ἀληθείᾳ
  choice: kuitii kweli
  alternative: kushawishiwa na kweli
  rationale: Muktadha unahusu mwitikio wa Wagalatia kwa kweli ya Injili na kugeuka kwao kutoka kwake. ‘Kuitii kweli’ inadumisha wazo la mwitikio wa vitendo, huku uwezekano wa ‘kushawishiwa na kweli’ ukihifadhiwa katika tanbihi ili kutofuta utata halisi wa kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kukimbia imehifadhiwa, na tanbihi inadumisha maana mbadala ya kitenzi cha Kigiriki.
