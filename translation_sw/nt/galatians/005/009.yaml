  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: sw
  text: Chachu kidogo huchachusha donge lote la unga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Chachu kidogo huchachusha unga wote uliokandwa.”
    reason: Mbadala huu unaonyesha maana ya φύραμα kama mchanganyiko wote wa unga uliokandwa.
lexical_decisions:
- source_word: μικρὰ
  choice: kidogo
  rationale: Hueleza kiasi kidogo cha chachu, na hudumisha ufupi wa kimethali wa kauli ya Kigiriki.
- source_word: ζύμη
  choice: chachu
  rationale: Ni neno la kawaida la Kiswahili kwa kitu kinachochachusha unga; linahifadhi picha halisi na matumizi yake ya kimfano.
- source_word: ὅλον
  choice: lote
  rationale: Huonyesha kwamba athari inaenea katika donge zima, sawasawa na msisitizo wa ὅλον.
- source_word: φύραμα
  choice: donge la unga
  rationale: Huwakilisha mchanganyiko au bonge la unga uliokandwa kwa lugha ya kawaida na wazi, huku ikihifadhi picha ya kutengeneza mkate.
- source_word: ζυμοῖ
  choice: huchachusha
  rationale: Ni kitenzi cha moja kwa moja kinachoonyesha chachu kulifanya donge lichachuke na kudumisha muundo mfupi wa methali.
theological_decisions:
- issue: Nguvu ya kimfano ya methali
  choice: Kuhifadhi picha halisi ya chachu na donge la unga bila kufafanua matumizi yake yanayodokezwa.
  alternative: Kiasi kidogo cha mafundisho ya uongo huenea katika jumuiya nzima.
  rationale: Muktadha unaonya kuhusu ushawishi unaoenea, lakini mstari wenyewe unatoa methali bila kuitafsiri. Picha hiyo imehifadhiwa ili kutodhoofisha nguvu yake ya balagha wala kuingiza ufafanuzi katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli imewekwa kwa ufupi wa kimethali. “Donge lote la unga” ni picha ya kawaida na inayoeleweka; tanbihi huhifadhi njia nyingine ya kueleza φύραμα.
