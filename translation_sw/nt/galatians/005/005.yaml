  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: sw
  text: Kwa maana sisi, kwa Roho[a], kutokana na imani[b], tunalitazamia kwa hamu tumaini la haki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho.” Muundo wa Kigiriki unaweza kumaanisha kwamba Roho ndiye njia ya kutazamia huku, au kwamba kutazamia huku hutokea katika mazingira ya Roho.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kwa tafsiri ya karibu ni “kutokana na imani.” Neno πίστις kwa kawaida humaanisha imani au kumtumaini mtu, na katika baadhi ya miktadha linaweza pia kumaanisha uaminifu.
    reason: lexical_alternative
  - marker: c
    text: Kirai “tumaini la haki” kinaweza pia kueleweka kuwa “haki inayotumainiwa” au, kwa uwezekano mdogo zaidi, “tumaini linalotokana na haki.” Neno la Kigiriki δικαιοσύνη linaweza pia kumaanisha uadilifu au haki katika maana ya kutendewa kwa usawa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi hiki kimetajwa wazi na kina mkazo kiasi; “sisi” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha kwamba kauli hii inaeleza au kuunga mkono hoja iliyotangulia.
- source_word: πνεύματι
  choice: kwa njia ya Roho
  rationale: Huwasilisha uwezekano mkuu wa hali ya kutoa njia au uwezo, na muktadha wa Wagalatia 5 unaelekeza kwa Roho Mtakatifu.
- source_word: ἐκ πίστεως
  choice: kwa msingi wa imani
  rationale: ἐκ huonyesha chanzo au msingi. Kauli hii ni ya asili zaidi kwa Kiswahili kuliko “kutokana na imani,” huku ikihifadhi nguvu ya kihusishi.
- source_word: ἐλπίδα
  choice: tumaini
  rationale: Ni yambwa ya kitenzi ἀπεκδεχόμεθα na inafaa kutafsiriwa moja kwa moja kama “tumaini.”
- source_word: δικαιοσύνης
  choice: la haki
  rationale: “Haki” ni neno la kawaida na pana linaloweza kubeba maana za uadilifu, hali ya kuwa sawa mbele za Mungu, au haki katika maana ya justice bila kulazimisha ufafanuzi mmoja.
- source_word: ἀπεκδεχόμεθα
  choice: tunalitazamia kwa hamu
  rationale: Huhifadhi wazo la kungoja kwa matarajio makubwa, si kungoja tu bila shauku.
theological_decisions:
- issue: Mrejelewa wa πνεύματι
  choice: Roho Mtakatifu, kwa kuandika “Roho” kwa herufi kubwa
  alternative: roho ya mwanadamu
  rationale: Muktadha wa Wagalatia 5, hasa utofautishaji wa Roho, mwili, na sheria, unaunga mkono kwa nguvu mrejelewa wa Roho Mtakatifu.
- issue: Kazi ya dative katika πνεύματι
  choice: kwa njia ya Roho
  alternative: katika Roho
  rationale: Dative inaweza kuonyesha njia/uwezo au mazingira ambamo jambo hutokea. Matini kuu inatumia maana ya njia, na maana ya mazingira imehifadhiwa katika tanbihi.
- issue: Maana ya ἐλπίδα δικαιοσύνης
  choice: tumaini la haki
  alternative: haki inayotumainiwa; tumaini linalotokana na haki
  rationale: Muundo mfupi wa nomino kwa nomino huhifadhi kwa kiasi kikubwa utata wa Kigiriki kuhusu uhusiano kati ya tumaini na haki, badala ya kuufafanua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa uwe wa asili kwa Kiswahili huku mkazo wa “sisi,” uhusiano wa hoja unaoletwa na γὰρ, na utata wa kitheolojia wa vifungu vya Kigiriki vikihifadhiwa.
