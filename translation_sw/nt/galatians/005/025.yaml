id: GAL.5.25
reference: Galatians 5:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: sw
  text: Ikiwa tunaishi kwa Roho[a], basi pia tuenende kwa Roho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa tunaishi katika Roho, basi pia twende sambamba na Roho.”
    reason: Njia nyingine ya kueleza dative πνεύματι na maana mahsusi zaidi ya στοιχῶμεν.
lexical_decisions:
- source_word: εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti wa Kigiriki bila kuugeuza kimuktadha kuwa kauli ya sababu, kama ‘kwa kuwa’.
- source_word: ζῶμεν
  choice: tunaishi
  rationale: Ni tafsiri ya kawaida ya kitenzi cha wakati uliopo; katika muktadha huu inaeleza uzima unaotokana na Roho, si kuwapo hai kimwili tu.
- source_word: πνεύματι
  choice: kwa Roho
  rationale: ‘Kwa’ huwasilisha maana ya Roho kuwa chanzo au njia ya uzima na mwenendo. Herufi kubwa inaonyesha kwamba muktadha wa Galatia 5 unamrejelea Roho Mtakatifu.
- source_word: καὶ
  choice: pia
  rationale: Huonyesha kwamba mwenendo unaotajwa unapaswa kuambatana na ukweli wa kuishi kwa Roho.
- source_word: στοιχῶμεν
  choice: tuenende
  rationale: Huhifadhi sitiari ya kimaadili ya kutembea au kuendesha maisha, huku maana mahsusi zaidi ya kwenda sambamba ikiwekwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu
  rationale: Katika Galatia 5, utofautishaji wa mwili na Roho unaonyesha kwa nguvu kwamba hapa Paulo anamrejelea Roho Mtakatifu, si roho ya mwanadamu.
- issue: Nguvu ya εἰ
  choice: 'sharti: ‘Ikiwa’'
  alternative: 'sababu inayodhaniwa: ‘Kwa kuwa’'
  rationale: ‘Ikiwa’ huhifadhi umbo la Kigiriki na mvutano wa hoja ya Paulo bila kuamua kimya kwamba sharti hilo linamaanisha ‘kwa kuwa’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tuenende’ ni usemi unaoeleweka katika muktadha wa maadili na huhifadhi sitiari ya maandishi ya asili; tanbihi hutoa maana ya wazi zaidi ya kwenda sambamba.
