  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: sw
  text: Tusije tukawa wenye majivuno yasiyo na msingi[a], tukichokozana na kuoneana wivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye kutafuta utukufu mtupu.” Neno la Kigiriki linaonyesha watu wanaoendeshwa na utukufu mtupu au kujiona kuwa muhimu kusiko na msingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Tusijivune
  rationale: Muundo wa μή pamoja na nafsi ya kwanza wingi katika hali tegemezi unatoa himizo la kukataza. Kiswahili hiki kinaweka himizo hilo kwa namna ya kawaida, huku wazo la kuingia katika hali hiyo likielezwa na muktadha mzima.
- source_word: κενόδοξοι
  choice: kwa majivuno yasiyo na msingi
  rationale: Neno hili humaanisha kutawaliwa na utukufu mtupu au kujiona kuwa muhimu bila msingi. Kauli hii ni ya kawaida na inaeleweka, huku ikihifadhi wazo la 'utukufu mtupu' kuliko neno la jumla kama 'wenye kiburi'.
- source_word: ἀλλήλους
  choice: -ana katika tukichokozana
  rationale: Kiambishi cha kutendeana -ana ndicho njia ya kawaida ya Kiswahili ya kuonyesha tendo la pande zote, yaani 'sisi kwa sisi'.
- source_word: προκαλούμενοι
  choice: tukichokozana
  rationale: Kitenzi hiki huhusisha kuwachokoza au kuwapa wengine changamoto kwa ushindani. 'Kuchokozana' huhifadhi maana pana ya kuchochea mwitikio bila kuifanya iwe kuudhi tu.
- source_word: ἀλλήλοις
  choice: -ana katika kuoneana
  rationale: Umbo la kutendeana linaonyesha kwa ufasaha kuwa wivu unaelekezwa mtu kwa mwenzake.
- source_word: φθονοῦντες
  choice: kuoneana wivu
  rationale: Hii ni kauli ya kawaida ya Kiswahili kwa kuwa na wivu dhidi ya mwingine, na inalingana kimuundo na 'tukichokozana'.
theological_decisions:
- issue: Uhusiano wa vihusishi προκαλούμενοι na φθονοῦντες na himizo kuu
  choice: 'Vimetafsiriwa kama matendo yanayoambatana na majivuno: ''huku tukichokozana na kuoneana wivu.'''
  alternative: Vingeweza kueleweka kuwa upanuzi unaokaribia amri, au njia ambayo majivuno yanaonyeshwa.
  rationale: Muundo wa Kigiriki unaweka κενόδοξοι kuwa kiarifu kikuu baada ya γινώμεθα, huku vihusishi vikieleza tabia zinazoambatana nacho. 'Huku' huhifadhi uhusiano huo bila kuamua kwa nguvu kama ni matokeo, njia, au mazingira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Miundo ya kutendeana '-ana' imetumiwa kuwasilisha ἀλλήλους/ἀλλήλοις kwa ufasaha.
