translation:
  language: sw
  text: Ninyi mnaotafuta kuhesabiwa haki kwa sheria mmetengwa mbali na Kristo[a]; mmeanguka kutoka katika neema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mmeondolewa mbali na Kristo.” Kwa tafsiri iliyo karibu zaidi na umbo la Kigiriki, sehemu ya kwanza inaweza kuwa: “Ninyi mnaohesabiwa haki kwa sheria mmetengwa mbali na Kristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: mmetengwa
  rationale: Pamoja na ἀπὸ Χριστοῦ, kitenzi hiki kinaonyesha kutenganishwa au kukatishwa uhusiano na Kristo. “Mmetengwa” ni cha asili na chenye uzito bila kuamua kwamba hali hiyo haiwezi kubadilika.
- source_word: ἀπὸ Χριστοῦ
  choice: na Kristo
  rationale: Katika muundo wa Kiswahili “metengwa na Kristo,” kihusishi “na” huonyesha utengano unaoonyeshwa na ἀπό. “Kristo” ni jina la cheo lililozoeleka na lenye hadhi katika Kiswahili.
- source_word: οἵτινες
  choice: Ninyi mnao-
  rationale: Muundo huu unawatambulisha moja kwa moja wale miongoni mwa wasikilizaji wanaohusika, ukihifadhi nguvu ya nafsi ya pili.
- source_word: ἐν νόμῳ
  choice: kwa sheria
  rationale: “Kwa sheria” linaweza kuonyesha msingi au njia ya kutafuta kuhesabiwa haki, na haliongezi kibainishi kisichokuwapo katika Kigiriki.
- source_word: δικαιοῦσθε
  choice: mnaotafuta kuhesabiwa haki
  rationale: Ingawa umbo ni la sasa tendwa na kwa karibu zaidi linaweza kuwa “mnaohesabiwa haki,” muktadha unawahusu wanaotegemea sheria ili wapate kuhesabiwa haki. “Mnaotafuta kuhesabiwa haki” huleta hoja hiyo wazi bila kudai kwamba sheria kwa kweli inawahesabia haki.
- source_word: τῆς χάριτος
  choice: kutoka katika neema
  rationale: Genitivi inayotawaliwa na ἐκπίπτω inaonyesha kile ambacho mtu ameanguka kutoka kwake. Usemi huu huhifadhi taswira ya chanzo.
- source_word: ἐξεπέσατε
  choice: mmeanguka kutoka
  rationale: Huhifadhi sitiari ya Kigiriki na uzito wa tendo lililotimia, bila kuifafanua kwa mfumo maalumu wa kiteolojia.
theological_decisions:
- issue: Je, kauli hii iamue mjadala kuhusu kupoteza wokovu au kuacha msingi wa neema?
  choice: 'Kuhifadhi onyo kali: “mmetengwa na Kristo; mmeanguka kutoka katika neema.”'
  alternative: Kulainisha kuwa “mmejitenga na njia ya neema” au kufafanua kuwa wokovu umepotea kabisa.
  rationale: Kigiriki kinatumia lugha kali ya utengano na kuanguka, lakini hakitoi hapa ufafanuzi kamili wa kimfumo kuhusu hali ya mwisho ya wahusika. Tafsiri inadumisha mvutano huo.
- issue: Je, δικαιοῦσθε idokeze mafanikio halisi ya kuhesabiwa haki kwa sheria?
  choice: “mnaotafuta kuhesabiwa haki”
  alternative: “mnaohesabiwa haki”
  rationale: Tafsiri iliyochaguliwa inaonyesha jaribio au dai linalolengwa na hoja ya Paulo na kuepuka kudokeza kwamba sheria kweli hutimiza kuhesabiwa haki; tanbihi inahifadhi tafsiri rasmi zaidi ya umbo tendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kuhesabiwa haki” ni istilahi ya kibiblia iliyozoeleka; “mmetengwa” na “mmeanguka kutoka katika neema” zinahifadhi ukali na sitiari za chanzo bila kuingiza hitimisho la kimadhehebu.
