  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: sw
  text: 'Kwa maana sheria yote imetimizwa katika kauli moja: “Mpende jirani yako kama unavyojipenda mwenyewe.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika usemi mmoja.” Kiyunani kinasema kihalisi “katika neno/usemi mmoja,” yaani katika kauli au amri moja.
    reason: lexical_alternative
  - marker: b
    text: Au “imekwisha kutimizwa”; kwa maana ya kimuktadha, “imejumlishwa.” Kitenzi cha Kiyunani humaanisha zaidi “imetimizwa,” na kinaweza pia kudokeza kwamba kusudi la sheria linafikia utimilifu wake katika amri hii.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Kwa maana
  rationale: γάρ inatoa sababu au maelezo ya himizo lililotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: πᾶς νόμος
  choice: sheria yote
  rationale: Umoja wenye kibainishi unarejelea sheria kama jumla, huku πᾶς ikisisitiza ukamilifu wake.
- source_word: ἐν ἑνὶ λόγῳ
  choice: katika kauli moja
  rationale: λόγος hapa si neno moja la kileksika bali usemi au amri moja inayofuata; “kauli moja” huepuka mkanganyiko wa “neno moja.”
- source_word: πεπλήρωται
  choice: imetimizwa
  rationale: Kauli timilifu tendwa inaonyesha hali iliyotokana na kutimizwa. “Imetimizwa” huhifadhi wazo la utimilifu na umbo tendwa bila kuifasiri tu kuwa muhtasari.
- source_word: ἐν τῷ
  choice: ':'
  rationale: Muundo huu unatambulisha yaliyomo katika kauli; katika Kiswahili alama ya nukta mbili hutambulisha nukuu kwa ufasaha.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Wakati ujao wa Kiyunani katika dondoo la Walawi 19:18 una nguvu ya amri. Kiswahili cha kawaida hutumia hali ya kuamuru “Mpende.”
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: Katika muktadha huu wa kimaadili πλησίον humaanisha jirani, tafsiri iliyo wazi na iliyozoeleka kwa dondoo hili.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kiswahili cha asili huhitaji kueleza kitenzi kinachoeleweka katika ulinganisho; “mwenyewe” husisitiza kirejeshi bila kubadili maana.
theological_decisions:
- issue: Maana ya dai la Paulo kuhusu uhusiano wa sheria na amri ya upendo
  choice: Sheria yote imetimizwa katika amri ya kumpenda jirani.
  alternative: Sheria yote imejumlishwa katika amri hii.
  rationale: πληρόω kimsingi hueleza kutimizwa kuliko kujumlishwa tu. Tafsiri inadumisha nguvu hiyo, lakini tanbihi inataja maana ya kimuktadha ya kujumlishwa bila kudai kwamba Paulo anafafanua hapa hali nzima ya sheria au anaizungumzia sehemu yake ya kimaadili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kauli moja” ni wazi kwa msomaji wa kawaida; “Mpende” ni amri ya moja kwa moja na ya asili kuliko ujenzi mzito wa “utampenda.” Alama zote za tanbihi zimewekwa katika matini kuu.
