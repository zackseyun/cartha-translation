  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: sw
  text: Lakini ikiwa mnaumana na kulana, jihadharini msije mkaangamizwa na wenzenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inaendeleza hoja kwa utofautishaji wa kiasi na kuanzisha sharti kwa Kiswahili cha kawaida.
- source_word: ἀλλήλους
  choice: mna- ... -ana
  rationale: Kauli ya kutendeana katika vitenzi vya Kiswahili inaonyesha wazi tendo la pande zote ndani ya jumuiya.
- source_word: δάκνετε
  choice: mnaumana
  rationale: Huhifadhi picha halisi ya kuumana na pia hali ya tendo linaloendelea au la kawaida.
- source_word: κατεσθίετε
  choice: kulana
  rationale: Huhifadhi picha kali ya kula kabisa; katika muktadha huu, 'kulana' ni ya asili na inaonyesha tendo la pande zote.
- source_word: βλέπετε
  choice: jihadharini
  rationale: Ni amri ya tahadhari iliyo wazi, ya sasa, na yenye uzito unaofaa.
- source_word: μὴ ... ἀναλωθῆτε
  choice: msije mkaangamizana
  rationale: Muundo wa 'msije' unaonyesha onyo la uwezekano hasi; 'mkaangamizana' huwasilisha matokeo ya kuharibiwa kabisa huku ukidumisha hali ya kutendeana.
- source_word: ὑπ’ ἀλλήλων
  choice: -ana katika mkaangamizana
  rationale: Kiambishi cha kutendeana kinaonyesha kwamba kila upande ni wakala wa kuangamia kwa mwingine kwa Kiswahili cha asili.
theological_decisions:
- issue: Picha ya ukatili ndani ya jumuiya ya waamini
  choice: Kudumisha picha ya wanyama kwa 'mnaumana na kulana'
  alternative: Ikiwa mnaumizana na kuharibiana
  rationale: Maneno ya Paulo ni makali kwa makusudi; kuyageuza kuwa lugha ya jumla ya migogoro kungepunguza uzito wa onyo.
- issue: Mwisho wa picha katika ἀναλωθῆτε
  choice: mkaangamizana
  alternative: mkaliwa kabisa na wenzenu
  rationale: Kitenzi kinaweza kumaanisha kuteketezwa au kuharibiwa kabisa. 'Mkaangamizana' ni Kiswahili cha asili kinachoonyesha maangamizi ya pande zote bila kulazimisha taswira isiyo ya kawaida ya kutendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kutendeana '-ana' umetumiwa ili kuwasilisha ἀλλήλους kwa njia ya asili na yenye ufupi; sitiari kali ya kuumana na kulana imehifadhiwa.
