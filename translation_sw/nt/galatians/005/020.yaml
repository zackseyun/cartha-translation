  terminology: “Ibada ya sanamu,” “uchawi,” “uadui,” “ugomvi,” “wivu,” “milipuko ya hasira,” and “mifarakano” are appropriate. The revised wording maintains the non-technical social sense of αἱρέσεις and does not import the later doctrinal sense of heresy.
