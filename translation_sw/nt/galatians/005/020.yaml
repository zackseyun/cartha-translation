lexical_decisions:
- source_word: εἰδωλολατρία
  choice: ibada ya sanamu
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya kuabudu au kutumikia sanamu, huku ikihifadhi uzito wa kidini wa neno hilo.
- source_word: φαρμακεία
  choice: uchawi
  rationale: Katika orodha hii neno linamaanisha matendo ya kichawi au ya kishirikina yanayoweza kuhusisha dawa na hirizi, wala si tiba kwa ujumla.
- source_word: ἔχθραι
  choice: uadui
  rationale: Neno hili linaeleza hali na matendo ya kuwa na uhasama; ‘uadui’ ni la kawaida na linaeleweka kwa urahisi.
- source_word: ἔρις
  choice: ugomvi
  rationale: Linaonyesha mabishano na mapambano ya kuvutana; ‘ugomvi’ ni neno la sasa na linalofaa katika orodha hii.
- source_word: ζῆλος
  choice: wivu
  rationale: Katika muktadha huu hasi, neno lina maana ya wivu wenye ushindani, si bidii njema.
- source_word: θυμοί
  choice: milipuko ya hasira
  rationale: Wingi wa neno la Kigiriki unaonyesha vipindi vinavyorudiwa vya hasira kali; usemi huu unawasilisha hali hiyo kwa uwazi.
- source_word: ἐριθεῖαι
  choice: tamaa za ubinafsi
  rationale: Neno linahusu kujitafutia manufaa au cheo kwa ushindani wa kibinafsi; tafsiri hii inaonyesha nia na mwenendo.
- source_word: διχοστασίαι
  choice: mifarakano
  rationale: Neno linaonyesha watu kutengana na kusimama katika pande zinazopingana; ‘mifarakano’ ni fasaha na wazi katika muktadha wa jumuiya.
- source_word: αἱρέσεις
  choice: makundi ya upinzani
  rationale: Katika muktadha huu neno linahusu vikundi au kambi zinazogawanya jumuiya, si lazima mafundisho ya uzushi kwa maana ya baadaye ya kikanisa.
theological_decisions:
- issue: Maana ya αἱρέσεις
  choice: makundi ya upinzani
  alternative: madhehebu; uzushi
  rationale: Muktadha wa karibu ni orodha ya maovu yanayoharibu mahusiano na jumuiya. Tafsiri hii huhifadhi maana ya kijamii ya vikundi vinavyopingana bila kuingiza moja kwa moja maana ya kitaalamu ya baadaye ya ‘uzushi.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na alama ya koma mwishoni vimehifadhiwa kwa sababu kifungu kinaendelea katika mstari unaofuata. Alama [a] imewekwa baada ya ‘uchawi,’ ambalo ndilo neno linalohusika na tanbihi hiyo.
