lexical_decisions:
- source_word: ὄφελον
  choice: Laiti
  rationale: Neno hili linaonyesha tamanio kali; “Laiti” ni la kawaida, lenye hadhi, na linadumisha nguvu ya usemi huo.
- source_word: καὶ
  choice: kabisa
  rationale: Katika muktadha huu καί inatia mkazo hatua inayozidi tohara. “Kabisa” ikiambatana na “wangejikata” inaonyesha kwenda mbali zaidi katika kukata.
- source_word: ἀποκόψονται
  choice: wangejikata kabisa wenyewe
  rationale: Kitenzi kina maana ya kukata, na kauli yake hapa inaelekea kuwa ya kujifanyia. Katika mjadala wa tohara, usemi huu unadumisha mchezo mkali wa maneno na uwezekano wa kumaanisha kujihasi, bila kulazimisha maana hiyo ndani ya matini kuu.
- source_word: οἱ ἀναστατοῦντες
  choice: wale wanaowavuruga
  rationale: Kirai hiki kinawataja watu wanaosababisha msukosuko na kuchanganya waumini. “Wanaowavuruga” ni Kiswahili cha sasa na cha asili kinachobeba wazo hilo.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinaonyesha nafsi ya pili wingi, yaani waumini wa Galatia kwa pamoja.
theological_decisions:
- issue: Maana ya tamanio kali la Paulo kuhusiana na tohara
  choice: Usemi unadumishwa kama mchezo mkali wa maneno kuhusu kukata, ambao katika muktadha huenda unamaanisha kwenda zaidi ya tohara hadi kujihasi.
  alternative: Paulo anatamani tu watu hao wajitenge au wakatiliwe mbali na jumuiya.
  rationale: Muktadha wa karibu unahusu tohara, hivyo maana inayohusiana na kukata mwili ndiyo inayoungwa mkono zaidi. Hata hivyo, tanbihi inataja maana ya karibu zaidi ya maneno ili kutohitimisha kimya kimya utata uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Laiti” huhifadhi tamanio kali, huku “wangejikata kabisa wenyewe” ikidumisha kejeli na mchezo wa maneno kuhusu tohara bila kutumia istilahi ya kitabibu katika matini kuu.
