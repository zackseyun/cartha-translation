  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: sw
  text: Ushawishi huu hautoki kwa yule anayewaita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mvuto huu hautoki kwa yule anayewaita.”
    reason: Neno πεισμονή ni adimu na linaweza kuonyesha ushawishi au mvuto unaomfanya mtu akubali jambo.
lexical_decisions:
- source_word: πεισμονὴ
  choice: ushawishi
  rationale: Nomino hii adimu inaweza kumaanisha ushawishi au hali/matokeo ya kushawishiwa. Katika muktadha, “ushawishi” ni wa kawaida na unaeleweka, huku ukihifadhi ujumla wa neno la Kigiriki bila kulipanua kupita kiasi.
- source_word: ἐκ
  choice: hautoki kwa
  rationale: ἐκ huonyesha chanzo au asili. “Hautoki kwa” ni Kiswahili cha asili kinachoeleza kwamba ushawishi huo haumtokani na mwenye kuwaita.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: yule anayewaita
  rationale: Kirai cha hali ya sasa kimetafsiriwa kama jina la mtendaji, huku “anayewaita” ikihifadhi tendo linaloendelea. Kiwakilishi cha wingi katika “-wa-” kinaonyesha kuwa Paulo anawahutubia Wagalatia kwa pamoja.
- source_word: οὐκ
  choice: hau-
  rationale: Ukanushi umeunganishwa kwa kawaida katika kitenzi cha Kiswahili ili kuhifadhi dai la Paulo kwamba chanzo hicho si yule anayewaita.
theological_decisions:
- issue: Utambulisho wa “yule anayewaita”
  choice: Yule anayewaita
  alternative: Mungu anayewaita
  rationale: Muktadha mpana unaelekea kumtaja Mungu, lakini Kigiriki hakitumii jina “Mungu” hapa. Tafsiri inahifadhi namna ya usemi ya Paulo bila kufafanua rejeleo hilo ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ushawishi” ni neno linaloeleweka kwa wasomaji wa kawaida; “yule anayewaita” huhifadhi usemi wa Kigiriki bila kumtaja Mungu moja kwa moja.
