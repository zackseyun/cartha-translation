  source_fidelity: Matendo ya mwili ni dhahiri” accurately renders τὰ ἔργα τῆς σαρκός ... φανερά. The three items—uasherati, uchafu, ufisadi—appropriately convey πορνεία, ἀκαθαρσία, and ἀσέλγεια in this concise list. However, “Lakini” makes δέ more strongly adversative than required; the English audit trail appropriately leaves the mild connective unexpressed.
  naturalness: The revised wording is idiomatic, concise Standard East African Swahili and retains the appropriate formal biblical register. “Ni dhahiri” and the colon introduce the list naturally.
  terminology: “Mwili” properly preserves Paul’s σάρξ metaphor and its contrast with Roho, while the footnote supplies the interpretive alternative without putting it into the main text. “Uasherati,” “uchafu,” and “ufisadi” are suitable established ethical terms; in this sequence, ufisadi is naturally understood as shameless moral/sexual excess rather than financial corruption.
