  text: 'Matendo ya mwili[a] ni dhahiri: uasherati, uchafu, ufisadi,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asili ya dhambi.” Neno la Kigiriki ni “mwili” (σάρξ), ambalo Paulo analitumia hapa kwa njia ya sitiari kuhusu tamaa na mwelekeo wa mwanadamu aliyeanguka dhambini.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: ni dhahiri
  rationale: Hutoa maana ya jambo lililo wazi na linalotambulika kwa urahisi, kwa Kiswahili cha sasa chenye hadhi.
- source_word: δέ
  choice: Lakini
  rationale: Huonyesha mpito wenye ulinganisho na tofauti kati ya kuongozwa na Roho katika mstari uliotangulia na matendo ya mwili yanayotajwa hapa.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: Kwa orodha ya mienendo ya kimaadili, “matendo” ni ya kawaida na wazi kuliko tafsiri halisi zaidi ya “kazi,” huku ikihifadhi tofauti na “tunda” katika mstari wa 22.
- source_word: τῆς σαρκός
  choice: ya mwili
  rationale: Inahifadhi sitiari ya Paulo na mvutano wake wa kitheolojia badala ya kuibadili moja kwa moja kuwa ufafanuzi wa “asili ya dhambi.”
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Nukta mbili hutambulisha orodha kwa Kiswahili cha kawaida bila kurudia maneno kama “ambayo ni.”
- source_word: πορνεία
  choice: uasherati
  rationale: Neno hili la kawaida la kibiblia katika Kiswahili linaweza kutaja kwa upana mwenendo wa ngono ulio kinyume cha maadili, si uzinzi wa walio katika ndoa pekee.
- source_word: ἀκαθαρσία
  choice: uchafu
  rationale: Katika muktadha huu wa kimaadili, “uchafu” ni neno la asili na linaloeleweka kwa urahisi kwa hali au mwenendo mchafu.
- source_word: ἀσέλγεια
  choice: ufisadi
  rationale: Huwasilisha mwenendo wa kujiachia bila aibu, hasa wa kingono, kwa neno linaloeleweka; muktadha wa maneno yaliyotangulia huzuia maana ya ufisadi wa kifedha kutawala.
theological_decisions:
- issue: Tafsiri ya σάρξ katika muktadha wa kimaadili wa Paulo
  choice: mwili
  alternative: asili ya dhambi
  rationale: “Mwili” huhifadhi picha ya lugha ya Paulo na tofauti kati ya mwili na Roho bila kufungia neno hilo katika tafsiri moja ya kitheolojia. Maana inayowezekana ya “asili ya dhambi” inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa orodha umehifadhiwa; “Lakini” inaonyesha tofauti ya δέ na muktadha uliotangulia.
