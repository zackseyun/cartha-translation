translation:
  language: sw
  text: Tazameni! Mimi, Paulo, ninawaambia kwamba mkikubali kutahiriwa, Masihi hatawafaidia hata kidogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Angalieni!
  rationale: Ni neno la kuvuta usikivu kwa msisitizo. Wingi unawafaa walengwa wengi wa barua na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: ἐγὼ Παῦλος
  choice: Mimi Paulo
  rationale: Kiwakilishi cha wazi pamoja na jina kinahifadhi msisitizo wa Paulo anapojitambulisha.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huwasilisha usemi wa moja kwa moja kwa walengwa wengi kwa Kiswahili cha kawaida.
- source_word: ἐὰν περιτέμνησθε
  choice: mkikubali kutahiriwa
  rationale: Huhifadhi wazo la wao kupitia tendo la kutahiriwa na, katika muktadha, kulikubali; haiifanyi sentensi kuwa hukumu ya kila tohara ya kitabibu au kikabila.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός ina nguvu ya cheo cha Yesu; “Masihi” huwasilisha maana hiyo moja kwa moja badala ya kuiacha kama jina tu.
- source_word: οὐδὲν ὠφελήσει
  choice: hatawafaidia hata kidogo
  rationale: Hueleza kwa uwazi kutokuwapo kabisa kwa manufaa, huku ikihifadhi wakati ujao wa kitenzi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika onyo hili cheo cha Yesu kama Masihi kina umuhimu; “Masihi” huhifadhi maana ya cheo bila kuingiza fundisho la dhehebu.
- issue: Upeo wa onyo kuhusu tohara
  choice: mkikubali kutahiriwa
  alternative: mkitahiriwa
  rationale: Muktadha unahusu Wagalatia kukubali tohara kama wajibu unaohusishwa na kushika sheria, si tamko kwamba kila tohara ya kitabibu au ya kikabila ni mbaya. Tafsiri haiongezi maelezo hayo ndani ya mstari, lakini uchaguzi huu hudokeza uamuzi unaolengwa na onyo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na wenye mkazo wa kinabii: “Angalieni! Mimi Paulo...” Neno “hata kidogo” linafanya ukamilifu wa οὐδέν uwe wazi kwa msomaji wa kawaida.'
