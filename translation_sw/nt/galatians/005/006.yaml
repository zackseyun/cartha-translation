  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: sw
  text: Kwa maana katika Masihi Yesu,[a] kutahiriwa wala kutotahiriwa hakuna maana yoyote, bali imani[b] inayotenda kazi kwa upendo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo Yesu.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Neno “imani” linaweza pia kutafsiriwa “uaminifu” au, kwa usemi wa kitenzi, “kumtumaini.”
    reason: lexical_alternative
  - marker: c
    text: Au “imani iliyo hai kwa upendo,” “imani inayojidhihirisha kwa upendo,” au “imani inayowezeshwa kwa upendo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Neno ἐν limehifadhiwa kama “katika” ili kuendeleza lugha ya Paulo kuhusu kuwa katika Masihi; Χριστός limetafsiriwa kama cheo “Masihi.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa hoja iliyotangulia, na “kwa maana” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: περιτομή ... ἀκροβυστία
  choice: kutahiriwa ... kutotahiriwa
  rationale: Vitenzi-jina hivi vya Kiswahili vinaeleweka kwa urahisi na kuhifadhi ulinganifu wa hali mbili za utambulisho unaokusudiwa na Paulo.
- source_word: τι ἰσχύει
  choice: hakufai kitu
  rationale: Katika muktadha huu ἰσχύει huhusu kuwa na umuhimu, manufaa, au uwezo wa kuleta matokeo, si nguvu za mwili tu. “Hakufai kitu” ni ya asili bila kubainisha kupita kiasi aina ya manufaa.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις hapa, huku maana zinazowezekana za kutumaini au uaminifu zikitajwa katika tanbihi.
- source_word: δι’ ἀγάπης
  choice: kwa njia ya upendo
  rationale: Usemi huu huhifadhi maana ya διά pamoja na hali ya umilikishi, yaani upendo kuwa njia ambayo imani hutenda.
- source_word: ἐνεργουμένη
  choice: inayotenda kazi
  rationale: Tafsiri hii huhifadhi nguvu ya kitenzi na kutofunga kwa lazima umbo lenye utata la kati/tendwa kuwa “inajidhihirisha” au “inawezeshwa.”
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός ni cheo chenye maana ya aliyetiwa mafuta; “Masihi” huhifadhi maana hiyo wazi. Mbadala wa kawaida “Kristo” umeonyeshwa katika tanbihi.
- issue: Tafsiri ya πίστις
  choice: imani
  alternative: tumaini au uaminifu
  rationale: Muktadha unaeleza imani inayotenda kupitia upendo, lakini wigo wa πίστις unaweza kujumuisha kutumaini na uaminifu; tanbihi huhifadhi uwezekano huo bila kuamua zaidi ya maandishi.
- issue: Nguvu ya ἐνεργουμένη
  choice: inayotenda kazi
  alternative: iliyo hai; inayojidhihirisha; inayowezeshwa
  rationale: Umbo la kisarufi linaweza kueleweka kwa mwelekeo wa kati au wa kutendwa. Tafsiri kuu inadumisha utata huo kwa kadiri inayowezekana katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku ulinganifu wa “kutahiriwa wala kutotahiriwa” na mvutano wa kisarufi wa ἐνεργουμένη vikihifadhiwa.
