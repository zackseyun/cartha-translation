id: GAL.5.1
reference: Galatians 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: sw
  text: Kwa ajili ya uhuru, Masihi alituweka huru[a]; kwa hiyo simameni imara, wala msijitie tena chini ya nira ya utumwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika uhuru Masihi alituweka huru.” Kirai cha mwanzo katika Kigiriki kimebanwa na kinaweza kueleweka kwa njia zaidi ya moja zinazokaribiana.
    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “msijiweke tena chini ya” au “msinaswe tena”; kina wazo la kuwa chini ya mamlaka au kushikwa na kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Kwa ajili ya uhuru
  rationale: Kirai cha hali ya tatu kinaweza kuonyesha kusudi au matokeo. Tafsiri hii inadumisha msisitizo wa Paulo kuhusu uhuru bila kuondoa ufupi na uzito wa muundo wa Kigiriki.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana yake na muktadha wake wa Kiyahudi badala ya kukifanya tu kuwa jina.
- source_word: ἠλευθέρωσεν
  choice: alituweka huru
  rationale: Kitenzi hiki humaanisha kumweka mtu huru. Kauli hii ni ya kawaida katika Kiswahili na inadumisha mwangwi wa neno ἐλευθερία, “uhuru.”
- source_word: στήκετε
  choice: simameni imara
  rationale: Amri ya wakati uliopo inahimiza udumifu katika msimamo. “Simameni imara” ni ya asili na ina nguvu ya wito wa kuendelea kuwa thabiti.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na tamko lililotangulia.
- source_word: ζυγῷ δουλείας
  choice: nira ya utumwa
  rationale: “Nira” inadumisha sitiari ya kutiishwa, na “utumwa” huonyesha kwa nguvu hali iliyo kinyume cha uhuru.
- source_word: ἐνέχεσθε
  choice: msikubali tena kutiwa chini ya
  rationale: Katika muktadha huu kitenzi kina wazo la kushikwa, kunaswa, au kutiishwa. Muundo huu unaendana kiasili na taswira ya nira katika Kiswahili, huku ukionyesha onyo dhidi ya kurudia hali hiyo.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudi katika hali ya awali kwa njia ya moja kwa moja.
theological_decisions:
- issue: Iwapo Χριστός itafsiriwe kama cheo au itoholewe kama jina
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki lina asili ya cheo cha mtiwa-mafuta. “Masihi” huhifadhi maana hiyo na mazingira yake ya Kiyahudi bila kuingiza msimamo wa kimadhehebu.
- issue: Uzito wa maana ya δουλεία
  choice: utumwa
  alternative: kifungo
  rationale: Muktadha unalinganisha uhuru na hali yake ya kinyume. “Utumwa” hudumisha wazo halisi na lenye nguvu la kutiishwa kuliko neno pana zaidi “kifungo.”
- issue: Uhusiano wa τῇ ἐλευθερίᾳ na ἠλευθέρωσεν
  choice: Kwa ajili ya uhuru, Masihi alituweka huru
  alternative: Katika uhuru Masihi alituweka huru
  rationale: Muundo wa Kigiriki umebanwa na unaweza kueleweka kwa namna zinazokaribiana. Matini kuu inatanguliza maana ya kusudi, huku tanbihi ikihifadhi uwezekano wa maana ya hali au mazingira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya “nira ya utumwa” imehifadhiwa, huku muundo wa “kutiwa chini ya nira” ukitumiwa ili usemi uwe wa asili na wazi kwa wasomaji wa kawaida.
