  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: sw
  text: 'Lakini nasema: Enendeni kwa Roho, nanyi hakika hamtatekeleza tamaa ya mwili.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asili ya dhambi.” Neno la Kigiriki ni “mwili,” ambalo katika maandishi ya Paulo linaweza kumaanisha asili ya mwanadamu aliyeanguka, inayompinga Roho.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: Lakini nasema
  rationale: δέ hapa inaonyesha geuko la hoja lenye tofauti ya kiasi; “Lakini nasema” ni ya asili na haiiongezi mno tofauti hiyo.
- source_word: πνεύματι
  choice: kwa Roho
  rationale: Dativi inaweza kuonyesha njia au nyanja ya mwenendo. Katika muktadha wa Wagalatia 5, Roho Mtakatifu ndiye anayerejelewa; herufi kubwa inaonyesha hilo bila kuongeza neno lisilokuwapo katika Kigiriki.
- source_word: περιπατεῖτε
  choice: Enendeni
  rationale: Huhifadhi sitiari ya Paulo ya kutembea kama mwenendo wa maisha, huku ikiwa lugha ya heshima na inayoeleweka katika Kiswahili cha Biblia.
- source_word: ἐπιθυμίαν
  choice: tamaa
  rationale: Katika muktadha huu neno lina maana hasi kutokana na kuhusishwa na mwili. “Tamaa” ni pana kuliko “tamaa ya ngono” na haibani maana kupita kiasi.
- source_word: σαρκὸς
  choice: ya mwili
  rationale: Huhifadhi istilahi na mvutano wa Paulo kati ya mwili na Roho badala ya kuifafanua moja kwa moja kuwa “asili ya dhambi.”
- source_word: οὐ μὴ τελέσητε
  choice: hakika hamtatekeleza
  rationale: Muundo οὐ μή pamoja na aoristi subjunktivi una ukanushaji wenye mkazo. “Hakika hamtatekeleza” huwasilisha uhakika huo na maana ya kuifanya tamaa ifikie utekelezaji.
theological_decisions:
- issue: Mrejelewa wa πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au kanuni ya kiroho
  rationale: Muktadha wa karibu wa Wagalatia 5 unalinganisha Roho na mwili na unaelekeza kwa utendaji wa Roho Mtakatifu; “Roho” kwa herufi kubwa huonyesha uamuzi huu wa kimuktadha.
- issue: Tafsiri ya σάρξ
  choice: mwili
  alternative: asili ya dhambi
  rationale: Ingawa hapa ina maana hasi ya kimaadili, “mwili” huhifadhi istilahi ya Paulo na kutatua kwa kiwango kidogo zaidi maana yake ya kianthropolojia; ufafanuzi mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Enendeni” limetumiwa kudumisha sitiari ya kutembea; muundo wa sentensi ni wa sasa na wazi.
