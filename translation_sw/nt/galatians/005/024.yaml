base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: sw
  text: Nao walio wa Masihi[a] wameusulubisha mwili pamoja na misukumo yake na tamaa zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio wa Kristo.”
    reason: alternative_reading
  - marker: b
    text: Neno “mwili” hapa linamaanisha asili ya mwanadamu iliyoanguka, ambayo inapingana na Roho; tafsiri nyingine husema “asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: walio wa Masihi
  rationale: Muundo wa nomino katika hali ya umilikishi unaonyesha watu walio mali ya Masihi au wanaohusishwa naye. Kiswahili ‘walio wa’ huhifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: δὲ
  choice: Nao
  rationale: δέ hapa ni kiunganishi chepesi cha mpito chenye kiasi cha utofautishaji. ‘Nao’ linaunganisha sentensi na muktadha uliotangulia bila kuifanya iwe na upinzani mkali kama ‘lakini.’
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός linafanya kazi kama cheo cha Yesu katika usemi huu. ‘Masihi’ huhifadhi maana ya ‘aliyetiwa mafuta’; ‘Kristo’ limetolewa kama tafsiri mbadala katika tanbihi.
- source_word: σάρκα
  choice: mwili
  rationale: ‘Mwili’ huhifadhi msamiati na taswira ya Paulo badala ya kuingiza moja kwa moja ufafanuzi wa ‘asili ya dhambi.’ Maana ya kimajazi imefafanuliwa katika tanbihi.
- source_word: ἐσταύρωσαν
  choice: wameusulubisha
  rationale: Kitenzi hiki huhifadhi taswira ya msalaba. Hali timilifu ya Kiswahili huwasilisha tendo lililofanyika lenye matokeo yanayoendelea.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: pamoja na misukumo yake na tamaa zake
  rationale: σύν huonyesha uambatano. Katika muktadha huu παθήματα ni misukumo au hisia zinazotawala, si mateso; ἐπιθυμίαι ni tamaa zenye nguvu. Viwakilishi vya umilikishi vinaonyesha kwamba vyote vinahusishwa na ‘mwili.’
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huonyesha wazi cheo kinachotokana na wazo la kutiwa mafuta, huku ‘Kristo’ likibaki jina la cheo lililozoeleka katika Kiswahili; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya σάρξ katika utofautishaji wa kimaadili wa Paulo
  choice: mwili
  alternative: asili ya dhambi
  rationale: Maandishi makuu yanahifadhi istilahi na mvutano wa kitheolojia wa Paulo. Tafsiri ya kufafanua ‘asili ya dhambi’ inaweza kuficha upana wa sitiari, hivyo imewekwa katika tanbihi badala ya maandishi makuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nao’ limetumiwa kama mpito wa kawaida, na ‘wameusulubisha’ huhifadhi taswira yenye nguvu ya maandishi ya Kigiriki.
