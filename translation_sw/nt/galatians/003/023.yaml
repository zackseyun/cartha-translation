  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: sw
  text: Lakini kabla ya imani kuja[a], tulikuwa tukilindwa chini ya Sheria[b], tukizuiwa[c] mpaka imani iliyokuwa karibu kufunuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla ile imani haijaja.” Kigiriki kina kibainishi na huenda kikarejelea enzi ya imani iliyoanza kwa kuja kwa Kristo. Neno hilo pia linaweza kumaanisha “uaminifu,” ingawa “imani” inafaa zaidi hapa.
    reason: alternative_reading
  - marker: b
    text: Au, “tulikuwa tukishikiliwa chini ya ulinzi wa Sheria.”
    reason: lexical_alternative
  - marker: c
    text: Au, “tukifungiwa” au “tukifungwa ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ δὲ ἐλθεῖν
  choice: Lakini kabla ... haijaja
  rationale: Muundo wenye πρό na kitenzi-jina unaonyesha wakati; Kiswahili hiki ni cha kawaida na δέ imetafsiriwa kwa utofautishaji mpole wa “Lakini.”
- source_word: τὴν πίστιν
  choice: imani
  rationale: “Imani” inafaa zaidi katika muktadha, huku tanbihi ikihifadhi uwezekano wa maana ya “ile imani” kama hali au enzi iliyoanza kwa Kristo.
- source_word: ὑπὸ νόμον
  choice: chini ya Sheria
  rationale: Huu ni usemi wa Paulo unaoonyesha kuwa chini ya mamlaka au utawala wa Sheria; herufi kubwa inaonyesha Sheria ya Musa katika muktadha huu.
- source_word: ἐφρουρούμεθα
  choice: tulikuwa tukilindwa
  rationale: Wakati usiotimilika wa kauli tendwa unaonyesha tendo lililoendelea zamani; “tukilindwa” huhifadhi wazo la ulinzi bila kulifanya mara moja kuwa hasi.
- source_word: συγκλειόμενοι
  choice: tumefungiwa
  rationale: Neno hili linaongeza wazo la kuzuiliwa ndani au kutoruhusiwa kutoka; “tumefungiwa” ni la sasa, wazi, na lina nguvu ya kizuizi iliyomo katika Kigiriki.
- source_word: εἰς
  choice: mpaka
  rationale: Katika muktadha huu linaelekeza kwenye kikomo cha muda, yaani kufunuliwa kwa imani iliyokuwa inakuja.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: imani iliyokuwa karibu kufunuliwa
  rationale: Tafsiri hii huhifadhi mwelekeo wa wakati wa μέλλουσαν na kauli tendwa ya ἀποκαλυφθῆναι bila kuongeza maelezo ya kiufafanuzi.
theological_decisions:
- issue: Ikiwa πίστις ni imani ya mtu binafsi au uhalisi wa kihistoria wa wokovu unaohusishwa na kuja kwa Kristo
  choice: Imetafsiriwa “imani,” huku muktadha na tanbihi vikihifadhi maana pana ya kihistoria ya wokovu.
  alternative: “ile imani” au “uaminifu”
  rationale: Kurudiwa kwa πίστις yenye kibainishi kunaweza kuashiria enzi au hali ya imani iliyofunuliwa kwa kuja kwa Kristo, lakini kuitafsiri kwa ufafanuzi zaidi kungefunga utata halisi wa kifungu.
- issue: Tabia ya Sheria kama mlinzi na pia kizuizi
  choice: Vitenzi viwili tofauti, “tukilindwa” na “tumefungiwa,” vimehifadhiwa.
  alternative: Kuunganisha mawazo hayo kuwa “tulizuiliwa chini ya Sheria”
  rationale: Kigiriki kinaweka pamoja wazo linaloweza kuwa chanya la ulinzi na wazo kali la kufungiwa; kuyahifadhi yote hudumisha mvutano wa kitheolojia wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi tofauti kati ya kulindwa na kufungiwa, pamoja na utata wa πίστις. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
