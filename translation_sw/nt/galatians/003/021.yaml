id: GAL.3.21
reference: Galatians 3:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: sw
  text: Je, basi, sheria inapingana na ahadi za Mungu? La hasha! Kwa maana, kama sheria ambayo ingeweza kutoa uzima ingetolewa, basi kwa kweli haki[a] ingetokana na sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hali ya kukubaliwa kuwa mwadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: sheria
  rationale: Neno hili linadumisha hoja ya jumla kuhusu sheria kama aina, huku muktadha ukiendelea kuhusisha Sheria ya Musa.
- source_word: κατὰ
  choice: inapingana na
  rationale: Pamoja na jenitivi, neno hili linaonyesha upinzani; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐπαγγελιῶν
  choice: ahadi
  rationale: Katika Kiswahili, umbo 'ahadi' linaweza kuwa umoja au wingi; hapa muundo 'ahadi za Mungu' unaonyesha wazi wingi wa Kigiriki.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni kauli thabiti na yenye hadhi ya kukataa kabisa, inayolingana na nguvu ya nahau ya Paulo.
- source_word: ἐδόθη
  choice: ingetolewa
  rationale: Kauli tendwa imehifadhiwa ndani ya sentensi ya masharti isiyotimia; muundo huu ni wa asili katika Kiswahili.
- source_word: δυνάμενος
  choice: ambayo ingeweza
  rationale: Inaonyesha uwezo wa sheria inayodhaniwa katika sharti hilo.
- source_word: ζῳοποιῆσαι
  choice: kutoa uzima
  rationale: Huwasilisha kwa uwazi maana ya kufanya kuwa hai au kumpa mtu uzima.
- source_word: ὄντως
  choice: kwa kweli
  rationale: Inadumisha msisitizo wa hitimisho.
- source_word: ἐκ νόμου
  choice: ingetokana na sheria
  rationale: Kitenzi 'kutokana na' kinahifadhi wazo la chanzo linalobebwa na ἐκ na ni Kiswahili cha kawaida.
- source_word: δικαιοσύνη
  choice: haki
  rationale: Katika Kiswahili cha Biblia, 'haki' ni tafsiri pana na ya kawaida inayoweza kubeba wazo la kuwa sawa mbele za Mungu na pia haki ya kimaadili bila kulazimisha maana moja.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika hoja ya Paulo
  choice: haki
  alternative: hali ya kukubaliwa kuwa mwadilifu
  rationale: '''Haki'' inadumisha upana wa neno la Kigiriki na mvutano kati ya uadilifu, hukumu ya kuwa sawa, na haki kwa maana ya justice. Mbadala umewekwa katika tanbihi bila kuingiza ufafanuzi wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na jibu kali la Paulo yamehifadhiwa; sentensi ya masharti imeundwa kwa mtiririko wa kawaida wa Kiswahili.
