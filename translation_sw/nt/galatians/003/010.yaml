id: GAL.3.10
reference: Galatians 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: sw
  text: 'Kwa maana wote wanaotegemea matendo ya sheria wako chini ya laana[a], kwa sababu imeandikwa: “Amelaaniwa kila mtu asiyedumu katika mambo yote yaliyoandikwa katika kitabu cha sheria[b], ili kuyatenda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote walio wa matendo ya sheria.”
    reason: alternative_reading
  - marker: b
    text: Au, “asiyeendelea kushika mambo yote yaliyoandikwa katika kitabu cha sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Kwa maana wote
  rationale: Huhifadhi wingi na nguvu ya γάρ ya kutoa sababu au ufafanuzi.
- source_word: ἐξ ἔργων νόμου
  choice: walio wa matendo ya sheria
  rationale: Tafsiri hii ya karibu na muundo wa Kigiriki huhifadhi mvutano wa maana bila kuamua kimya kimya kuwa ni ‘wanaotegemea’ matendo ya sheria.
- source_word: ὑπὸ κατάραν
  choice: chini ya laana
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwa chini ya hukumu ya laana bila kuifafanua kupita chanzo.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni kauli ya kawaida ya kunukuu Maandiko na inaakisi hali ya matokeo endelevu ya perfektifu ya Kigiriki.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Amelaaniwa kila mtu
  rationale: Hutoa maana ya hukumu ya laana na upeo wa wote kwa Kiswahili cha sasa na chenye hadhi.
- source_word: ἐμμένει
  choice: dumu katika
  rationale: ‘Kudumu katika’ huonyesha ushikamanifu unaoendelea na kuhifadhi picha ya kitenzi cha chanzo.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: katika mambo yote yaliyoandikwa
  rationale: Huhifadhi ukamilifu wa πᾶσιν na uhusiano wake na mambo yaliyoandikwa.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: katika kitabu cha sheria
  rationale: ‘Kitabu’ ni neno la kawaida na linaloeleweka, huku ‘cha sheria’ kikihifadhi muktadha wa Torati.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: ili kuyatenda
  rationale: Huhifadhi nguvu ya infinitivu ya kusudi au matokeo na wazo la kutekeleza yaliyoamriwa.
theological_decisions:
- issue: Maana ya ἐξ ἔργων νόμου
  choice: walio wa matendo ya sheria
  alternative: wanaotegemea matendo ya sheria
  rationale: Muundo wa karibu na chanzo huhifadhi utata halisi wa kauli ya Paulo na haingizi ufafanuzi wa kiteolojia moja kwa moja katika mstari.
- issue: Upeo wa wajibu katika nukuu ya sheria
  choice: mambo yote yaliyoandikwa ... ili kuyatenda
  alternative: kila kitu kilichoandikwa ... na kukitekeleza
  rationale: Tafsiri inahifadhi msisitizo wa πᾶσιν na hitaji la kutenda bila kupunguza au kupanua dai la maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walio wa matendo ya sheria’ umeachwa kwa makusudi kuwa wa karibu na Kigiriki, huku tanbihi ikitoa tafsiri ya kimaanisho iliyo ya kawaida zaidi.
