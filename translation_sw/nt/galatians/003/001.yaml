  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: sw
  text: Enyi Wagalatia wapumbavu, ni nani aliyewaroga[a], ninyi ambao Yesu Masihi[b] aliwekwa wazi[c] mbele ya macho yenu akiwa amesulubiwa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “aliyewadanganya?” Kitenzi cha Kigiriki kwa maana halisi huibua wazo la kumroga mtu.'
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida pia hutafsiriwa “Yesu Kristo”; hapa “Masihi” huhifadhi maana ya cheo hicho.
    reason: lexical_alternative
  - marker: c
    text: 'Au: “alionyeshwa waziwazi,” “aliwasilishwa wazi,” au “alitangazwa hadharani akiwa amesulubiwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: msio na ufahamu
  rationale: Hutoa karipio kuhusu kutotambua au kutofikiri sawasawa bila kuongeza lawama kali zaidi ya neno la Kigiriki.
- source_word: Γαλάται
  choice: Wagalatia
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa Galatia.
- source_word: ἐβάσκανεν
  choice: aliyeroga
  rationale: Hudumisha taswira kali ya ushawishi unaofanana na uchawi; tafsiri kama ‘aliyewadanganya’ ingeifanya taswira hiyo kuwa hafifu.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: ninyi ambao mbele ya macho yenu
  rationale: Hudumisha uhusiano wa kishazi na wazo la jambo kuwekwa wazi moja kwa moja mbele yao.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Masihi
  rationale: ‘Masihi’ hutafsiri maana ya cheo Χριστός badala ya kukifanya kionekane kama jina la pili.
- source_word: προεγράφη
  choice: aliwekwa waziwazi
  rationale: Huonyesha kwamba Yesu aliwasilishwa kwa uwazi na kwa namna dhahiri; pia huepuka kudai lazima kulikuwa na mchoro halisi.
- source_word: ἐσταυρωμένος
  choice: akiwa amesulubiwa
  rationale: 'Huwakilisha hali inayoelezwa na participio: Yesu aliwekwa wazi mbele yao katika hali ya kusulubiwa.'
theological_decisions:
- issue: Tafsiri ya Χριστός katika Ἰησοῦς Χριστός
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Tafsiri hii huhifadhi maana ya cheo hicho kwa Kiswahili cha kawaida bila kuingiza msimamo wa dhehebu.
- issue: Uhusiano wa ἐσταυρωμένος na προεγράφη
  choice: akiwa amesulubiwa
  alternative: kuwa amesulubiwa
  rationale: ‘Akiwa amesulubiwa’ huhifadhi hali ya Yesu inayosisitizwa na participio bila kuamua zaidi ya sarufi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali moja na kishazi cha uhusiano umehifadhiwa ili kufuata mwendo wa sentensi ya Kigiriki; ‘ninyi ambao’ ina uzito wa balagha unaofaa karipio la Paulo.
