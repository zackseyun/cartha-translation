  verdict: revise
  source_fidelity: The draft preserves the principal sense and rhetorical question of the Greek, including the vivid βασκαίνω image and the crucified-state force of ἐσταυρωμένος. However, “msio na ufahamu” is a less direct and less idiomatic rendering of ἀνόητοι, and the relative construction is unnecessarily cumbersome in Swahili.
  naturalness: “Enyi Wagalatia wapumbavu” is clear, idiomatic Standard East African Swahili and retains Paul’s sharp rebuke without intensifying it. Moving “mbele ya macho yenu” next to the public presentation produces a more natural clause. “Ninyi ambao” is retained to represent the Greek relative reference, but placed so that the sentence flows naturally.
  terminology: “Wagalatia,” “Yesu Masihi,” “aliyewaroga,” and “amesulubiwa” are appropriate. “Masihi” preserves the titular sense of Χριστός. “Aliwekwa wazi” is a suitably non-literal rendering of προεγράφη that conveys vivid public setting-forth without asserting a literal visual image.
  issues:
  - severity: medium
    issue: “msio na ufahamu” is an awkward and indirect rendering of ἀνόητοι.
    rationale: The Greek rebukes the Galatians as lacking understanding. “Wapumbavu” is the established, natural Swahili equivalent in this direct address and better preserves the rhetorical force.
  - severity: low
    issue: The placement of “ninyi ambao mbele ya macho yenu” is heavy and less fluent.
    rationale: Putting the relative phrase before the clause it modifies creates an awkward sequence. Reordering it retains the source relationship while making the public portrayal clause clear.
  - severity: low
    issue: Footnote a’s literal explanation uses the less idiomatic phrase “kumwekea uchawi.”
    rationale: “Kumroga” naturally expresses the literal bewitching image in Standard East African Swahili and avoids an unnecessary, awkward double expression.
