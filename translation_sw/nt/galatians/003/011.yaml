  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: sw
  text: Ni dhahiri kwamba hakuna mtu anayehesabiwa kuwa mwenye haki mbele za Mungu kwa njia ya sheria, kwa maana, “Mwenye haki ataishi kwa imani.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwenye haki ataishi kwa uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Paulo ananukuu Habakuki 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Ni dhahiri kwamba
  rationale: δὲ ni kiunganishi hafifu cha kuendeleza hoja; Kiswahili hakihitaji kiunganishi cha wazi hapa, na muundo huu unaingiza dai kwa kawaida bila kuongeza wazo la wakati au upinzani mkali.
- source_word: ἐν νόμῳ
  choice: kwa njia ya sheria
  rationale: ἐν hapa inaonyesha njia au msingi unaodhaniwa wa kuhesabiwa haki; “kwa njia ya sheria” ni wazi na ya kawaida katika Kiswahili.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Inahifadhi ukanushaji wa jumla wa Kigiriki kwa lugha ya kawaida.
- source_word: δικαιοῦται
  choice: anayehesabiwa kuwa mwenye haki
  rationale: Inawasilisha maana ya kisheria ya kutangazwa au kukubaliwa kuwa mwenye haki bila kudokeza tu mabadiliko ya tabia.
- source_word: παρὰ τῷ θεῷ
  choice: mbele za Mungu
  rationale: Inadumisha wazo la msimamo wa mtu katika hukumu ya Mungu na ni usemi wa Kiswahili unaoeleweka.
- source_word: δῆλον
  choice: Ni dhahiri
  rationale: Inalingana na dai la wazi la hoja ya Paulo huku ikidumisha sauti yenye heshima.
- source_word: Ὁ δίκαιος
  choice: Mwenye haki
  rationale: Ni nomino ya kawaida ya Kiswahili inayowakilisha kivumishi kilichotumika kama nomino katika Kigiriki.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Hili ndilo chaguo la msingi na la kawaida la πίστις hapa; uwezekano wa “uaminifu” umehifadhiwa katika tanbihi.
- source_word: ζήσεται
  choice: ataishi
  rationale: Inatafsiri wakati ujao kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Uhusiano wa ἐκ πίστεως katika nukuu Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: “Mwenye haki ataishi kwa imani”
  alternative: “Mwenye haki ataishi kwa uaminifu”; au “Yule aliye mwenye haki kwa imani ataishi”
  rationale: Matini kuu inadumisha mpangilio wa Kigiriki na usomaji wa kawaida bila kuamua kimyakimya ikiwa kishazi hicho kinaeleza namna ya kuishi au msingi wa kuwa mwenye haki. Maana ya “uaminifu” imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa δικαιοῦται umehifadhiwa kwa “kuhesabiwa kuwa mwenye haki.” Alama zote za tanbihi zimewekwa baada ya nukuu inayohusika.
