  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: sw
  text: Basi, jueni kwamba wale walio wa imani—hao ndio wana wa Abrahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: jueni
  rationale: Amri ya wingi inaendeleza msisitizo wa Paulo wa kuwataka wasomaji watambue hitimisho hili; “jueni” ni ya moja kwa moja na yenye hadhi.
- source_word: ἄρα
  choice: basi
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: οἱ ἐκ πίστεως
  choice: wale walio wa imani
  rationale: Inahifadhi muundo wa asili unaoeleza watu kwa msingi au sifa ya imani, bila kuongeza kitu cha imani kisichotajwa wazi katika mstari huu.
- source_word: οὗτοι
  choice: hao
  rationale: Kiwakilishi cha kusisitiza kinahifadhiwa wazi, kikilingana na msisitizo wa Kigiriki na dashi ya toleo la mashauriano.
- source_word: υἱοί
  choice: wana
  rationale: “Wana” ni neno la kawaida la kibiblia na la heshima kwa uzao au walio katika uhusiano wa kifamilia; hapa wingi wa kiume wa Kigiriki unaweza kutaja kundi kwa maana ya warithi wa Abrahamu.
- source_word: Ἀβραάμ
  choice: Abrahamu
  rationale: Umbo sanifu la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya “wale walio wa imani” na uana wa Abrahamu
  choice: 'Kudumisha kauli ya utambulisho: “wale walio wa imani—hao ndio wana wa Abrahamu.”'
  alternative: “Wale wanaomwamini Mungu ndio wazao wa kweli wa Abrahamu.”
  rationale: Tafsiri iliyochaguliwa haiingizi “Mungu,” “wa kweli,” au ufafanuzi wa kibaolojia/kiroho ambao hauko wazi katika maneno ya mstari; inahifadhi nguvu na mvutano wa hitimisho la Paulo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Dashi ndefu imetumiwa kuhifadhi msisitizo wa οὗτοι (“hao”).
