  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: sw
  text: Hivyo basi, wale walio na imani hubarikiwa pamoja na Abrahamu mwamini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Abrahamu mwaminifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οἱ ἐκ πίστεως
  choice: wale walio wa imani
  rationale: Inahifadhi kwa ukaribu muundo wa Kigiriki unaowatambulisha watu kwa sifa ya imani, badala ya kuugeuza tu kuwa kitendo cha kuwa na imani.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu neno linamaanisha imani inayowatambulisha watu hao, si hasa uaminifu wao.
- source_word: εὐλογοῦνται
  choice: hubarikiwa
  rationale: Kauli tendwa ya wakati wa sasa huhifadhi wazo la kupokea baraka badala ya kuipata kwa jitihada.
- source_word: σὺν
  choice: pamoja na
  rationale: Inaeleza wazi kushiriki baraka moja na Abrahamu bila kuongeza maana isiyokuwamo.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Abrahamu mwamini
  rationale: Muktadha wa Galatia 3 unahusu hasa imani ya Abrahamu; hata hivyo, πιστός pia inaweza kueleweka kuwa ‘mwaminifu,’ kwa hiyo maana hiyo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πιστός inapomhusu Abrahamu katika muktadha unaosisitiza imani
  choice: Abrahamu mwamini
  alternative: Abrahamu mwaminifu
  rationale: πιστός inaweza kumaanisha mtu anayeamini au mtu mwaminifu. Hoja ya karibu inamweleza Abrahamu kama kielelezo cha imani, hivyo ‘mwamini’ inafaa katika matini kuu, huku tanbihi ikihifadhi maana nyingine halisi bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “walio wa imani” umechaguliwa kwa ukaribu na Kigiriki, ingawa ni rasmi zaidi kuliko “walio na imani.”
