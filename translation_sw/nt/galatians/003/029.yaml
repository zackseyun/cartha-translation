  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: sw
  text: Na ikiwa ninyi ni wa Masihi[a], basi ninyi ni uzao wa Ibrahimu[b], warithi kulingana na ahadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ni “mbegu” katika umoja; hapa limetumiwa kwa maana ya pamoja. Pia linaweza kutafsiriwa “wazao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: wa Masihi
  rationale: Hali ya umilikaji katika Kigiriki inaonyesha kuwa wao ni mali ya au wanahusishwa na Masihi. Kiswahili cha asili hutumia muundo “ni wa Masihi,” huku “Masihi” ikihifadhi maana ya cheo Χριστός.
- source_word: σπέρμα
  choice: uzao
  rationale: “Uzao” ni nomino ya jumla inayoweza kurejelea wazao kwa pamoja na inadumisha uhusiano wa kimatini na hoja ya Paulo kuhusu uzao wa Ibrahimu katika sura hii. Ni ya kawaida zaidi kwa watu kuliko “mbegu,” bila kugeuza umoja wa Kigiriki kuwa wingi waziwazi.
- source_word: κληρονόμοι
  choice: warithi
  rationale: “Warithi” ni neno la kawaida, la moja kwa moja, na linalofaa katika muktadha wa kifamilia na wa ahadi.
- source_word: κατ’ ἐπαγγελίαν
  choice: kulingana na ahadi
  rationale: Kauli hii inadumisha maana pana ya κατὰ bila kuamua kimya kimya kama ahadi ndiyo msingi, kipimo, au namna ya urithi.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Na ikiwa ninyi ... basi
  rationale: Muundo huu unaonyesha wazi sharti na hitimisho lake, huku “Na” ikibeba kiunganishi chepesi δέ.
theological_decisions:
- issue: Jinsi ya kutafsiri σπέρμα huku ikihifadhi mwangwi wa hoja ya awali kuhusu “uzao” wa Ibrahimu.
  choice: uzao
  alternative: mbegu; wazao
  rationale: “Uzao” huhifadhi maana ya pamoja na uhusiano wa kifasihi na Galatia 3, bila kufanya neno hilo lionekane kuwa mbegu halisi au kulifanya wazi kuwa wingi kuliko Kigiriki kilivyo.
- issue: Iwapo Χριστός itafsiriwe kama cheo au ichukuliwe kama jina.
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός inaweza kusikika kama cheo; “Masihi” huonyesha maana hiyo bila kuingiza msimamo wa kimadhehebu. Tofauti iliyozoeleka ya “Kristo” imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Viwakilishi “ninyi” vimehifadhiwa ili kuonyesha mkazo wa ὑμεῖς, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
