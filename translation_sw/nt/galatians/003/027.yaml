lexical_decisions:
- source_word: ὅσοι
  choice: ninyi nyote mlio-
  rationale: Huwasilisha maana ya wote katika kundi wanaotimiza sharti hilo, huku ikifanya wazi kuwa Paulo anawaambia Wagalatia moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hudumisha uhusiano wa ufafanuzi na hoja iliyotangulia.
- source_word: εἰς
  choice: katika
  rationale: Katika usemi wa Kiswahili ‘kubatizwa katika Masihi,’ neno hili hudumisha wazo la kuingizwa katika uhusiano au umoja naye bila kulazimisha ufafanuzi wa kimadhehebu.
- source_word: Χριστόν
  choice: Masihi
  rationale: Huhifadhi dhana ya cheo cha Mtiwa-Mafuta iliyo hai katika muktadha huu; ‘Kristo’ limetolewa kama chaguo jingine katika tanbihi.
- source_word: ἐβαπτίσθητε
  choice: mliobatizwa
  rationale: Huhifadhi kauli tendwa na ni usemi wa kawaida usioamua namna ya ubatizo.
- source_word: ἐνεδύσασθε
  choice: mmemvaa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi sitiari ya kuvaa na matokeo yanayoendelea ya tendo hilo.
theological_decisions:
- issue: Ikiwa maneno kuhusu ubatizo yafasiriwe kwa namna inayoamua teolojia fulani ya sakramenti au namna ya ubatizo.
  choice: mliobatizwa katika Masihi
  alternative: mliozamishwa katika Masihi; mliobatizwa kuhusiana na Masihi
  rationale: Kigiriki kinaeleza ubatizo kuelekea kuingizwa katika Masihi, lakini hakitatui moja kwa moja mijadala ya baadaye kuhusu matokeo ya kisakramenti au namna ya kimwili ya ubatizo. Tafsiri hudumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mmemvaa Masihi’ ni kifupi na cha asili huku kikihifadhi sitiari ya mavazi; tanbihi inaifafanua bila kuipanua katika maandishi makuu.
