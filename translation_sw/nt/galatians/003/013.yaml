  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: sw
  text: 'Masihi alitukomboa kutoka katika laana ya sheria kwa kufanyika laana kwa ajili yetu[a], kwa sababu imeandikwa: “Amelaaniwa kila mtu anayetundikwa juu ya mti.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa niaba yetu”; yawezekana “badala yetu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ξύλον kihalisi linaweza kumaanisha “mbao” au “mti”; “mti” huhifadhi maneno ya dondoo la Maandiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Masihi
  rationale: Neno la cheo limetafsiriwa kama “Masihi” badala ya kutoholewa kuwa “Kristo,” kwa kuwa maana yake ya cheo iko hai katika muktadha huu.
- source_word: ἐξηγόρασεν
  choice: alitukomboa
  rationale: “Kukomboa” huwasilisha kuachiliwa kwa gharama na pia maana ya wokovu katika matumizi ya Paulo, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: κατάρας
  choice: laana
  rationale: Nomino ya moja kwa moja inadumisha uzito wa kisheria na wa agano bila kuongeza ufafanuzi wa kitafsiri.
- source_word: νόμου
  choice: sheria
  rationale: Neno limeachwa katika maana yake wazi; muktadha unaelekeza kwenye sheria ya Musa bila kulazimisha utofautishaji ambao maandishi ya Kigiriki yenyewe hayaonyeshi kwa herufi kubwa.
- source_word: γενόμενος
  choice: kwa kuwa
  rationale: Muundo huu unaonyesha njia ambayo ukombozi ulitimizwa na unasikika kwa kawaida katika Kiswahili, huku ukihifadhi uhusiano wa kisababishi wa kishiriki.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Huhifadhi upana wa ὑπέρ—manufaa na uwakilishi—bila kulazimisha maana finyu ya “badala yetu.”
- source_word: κατάρα
  choice: laana
  rationale: Nomino imehifadhiwa kama nomino ili kudumisha usemi mkali wa Paulo kwamba Masihi ‘alikuwa laana,’ badala ya kuupunguza kuwa kivumishi pekee.
- source_word: ὅτι γέγραπται
  choice: kwa sababu imeandikwa
  rationale: Hutoa nguvu ya kisababishi au ufafanuzi ya kifungu, huku “kwa maana imeandikwa” ikibaki uwezekano halali.
- source_word: Ἐπικατάρατος
  choice: Amelaaniwa
  rationale: Ni usemi wa asili na wenye nguvu unaofaa kwa dondoo la Maandiko.
- source_word: κρεμάμενος
  choice: anayetundikwa
  rationale: Kauli ya kutendwa inalingana na mtu kuwekwa juu ya mti na hudumisha kauli ya jumla ya dondoo.
- source_word: ξύλου
  choice: mti
  rationale: Ingawa ξύλον inaweza kumaanisha mbao au kitu cha mbao, “mti” huhifadhi mwangwi wa dondoo la Kumbukumbu la Torati na matumizi ya mapema ya Kikristo.
theological_decisions:
- issue: Upeo wa ὑπὲρ ἡμῶν katika lugha ya upatanisho
  choice: kwa ajili yetu
  alternative: kwa niaba yetu; badala yetu
  rationale: Kifungu kinathibitisha manufaa na uwakilishi, lakini kihusishi ὑπέρ peke yake hakilazimishi tafsiri kuingiza mfano finyu zaidi wa kimafundisho. “Kwa ajili yetu” hudumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka marudio yenye msisitizo ya “laana” kama yalivyo katika Kigiriki. “Kwa sababu imeandikwa” imetumiwa badala ya “kwa maana imeandikwa”; tofauti hiyo haikuhitaji tanbihi kwa kuwa zote hutoa uhusiano wa ufafanuzi kwa uaminifu.
