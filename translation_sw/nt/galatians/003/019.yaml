  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: sw
  text: Basi, kwa nini Sheria? Iliongezwa kwa sababu ya makosa[b], mpaka aje huyo mzao[a] ambaye ahadi ilikuwa imetolewa kwake. Sheria iliwekwa[c] kupitia malaika kwa mkono wa mpatanishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzao” au “mzao wa baadaye.”
    reason: lexical_alternative
  - marker: b
    text: “Kwa sababu ya makosa” huenda ikamaanisha kuyashughulikia, kuyafichua, au kuyazuia makosa; Kigiriki hakielezi maana hiyo kwa undani zaidi.
    reason: alternative_reading
  - marker: c
    text: Au “ilipangwa” au “iliagizwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Basi, kwa nini Sheria?
  rationale: Swali hili la mkato linauliza kusudi la Sheria katika hoja ya Paulo, si maana yake; muundo huu ni wa kawaida na unaeleweka kwa Kiswahili.
- source_word: νόμος
  choice: Sheria
  rationale: Hapa neno hilo linarejelea Sheria ya Musa kama kitu kinachotambulika katika agano; herufi kubwa husaidia kuonyesha rejeo hilo maalumu.
- source_word: τῶν παραβάσεων χάριν
  choice: kwa sababu ya makosa
  rationale: Kifungu hiki kinaweza kuonyesha sababu au kusudi. Tafsiri pana 'kwa sababu ya' haiamui kama Sheria ilikusudiwa kuyafichua, kuyazuia, au kuyashughulikia makosa.
- source_word: προσετέθη
  choice: iliongezwa
  rationale: Huhifadhi kwa uwazi wazo la kitu kilichoongezwa, muhimu kwa hoja kwamba Sheria haikufuta ahadi iliyotangulia.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: mpaka aje
  rationale: Huwasilisha kikomo kilichotazamiwa wakati Sheria ilipoongezwa na ni muundo wa kawaida wa Kiswahili.
- source_word: τὸ σπέρμα
  choice: huyo mzao
  rationale: '''Mzao'' ni neno la kawaida linaloweza kumaanisha mtoto au mtu wa ukoo wa baadaye na linahifadhi uhusiano na hoja ya Paulo kuhusu uzao wa Abrahamu. Kionyeshi ''huyo'' husaidia kuonyesha rejeo maalumu bila kuondoa upekee wa nomino.'
- source_word: ᾧ ἐπήγγελται
  choice: ambaye ahadi ilikuwa imetolewa kwake
  rationale: Hufanya yule anayepokea ahadi awe wazi na kudokeza kwamba ahadi iliyotolewa hapo awali iliendelea kuwa na nguvu.
- source_word: διαταγεὶς
  choice: Sheria iliwekwa
  rationale: '''Iliwekwa'' huonyesha kuagizwa au kupangwa rasmi bila kulazimisha maana finyu zaidi; kurudia ''Sheria'' kunaondoa utata wa kishazi tegemezi katika Kiswahili.'
- source_word: δι’ ἀγγέλων
  choice: kupitia malaika
  rationale: Huhifadhi wazi wazo la uwakala wa kati lililo katika διά pamoja na jenitivi.
- source_word: ἐν χειρὶ μεσίτου
  choice: kwa mkono wa mpatanishi
  rationale: Huhifadhi taswira halisi ya Kigiriki huku nahau hiyo ikieleweka kama uwakala wa mpatanishi.
theological_decisions:
- issue: Maana ya τῶν παραβάσεων χάριν
  choice: kwa sababu ya makosa
  alternative: ili kuyazuia makosa; ili kuyafichua makosa; kuhusiana na makosa
  rationale: Kigiriki hakielezi kwa usahihi zaidi namna makosa yalivyohusiana na kuongezwa kwa Sheria; tafsiri na tanbihi huhifadhi mvutano huo.
- issue: Uwasilishaji wa σπέρμα katika hoja ya Paulo
  choice: mzao
  alternative: uzao; mtoto; mtu wa ukoo
  rationale: '''Mzao'' ni ya asili zaidi katika Kiswahili kuliko tafsiri halisi ''mbegu'' inapomaanisha mtu, lakini bado huhifadhi wazo la mtu anayetokana na Abrahamu na umoja wa neno katika muktadha.'
- issue: Uwakala katika kutolewa kwa Sheria
  choice: kupitia malaika kwa mkono wa mpatanishi
  alternative: kwa njia ya malaika kupitia mpatanishi
  rationale: Tafsiri huhifadhi ngazi mbili za upatanishi zilizo katika maandishi bila kumtambulisha mpatanishi, kwa kuwa mstari wenyewe haumtajii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya ahadi ili kuepuka mlolongo mzito wa vishazi, huku uhusiano wa kisarufi wa διαταγεὶς na Sheria ukifanywa wazi. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
