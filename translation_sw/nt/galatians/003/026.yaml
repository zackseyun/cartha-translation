lexical_decisions:
- source_word: πάντες
  choice: ninyi nyote
  rationale: Pamoja na kitenzi cha nafsi ya pili wingi ἐστε, maneno haya yanakazia kwamba kauli inawahusu wote wanaoandikiwa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa sentensi inatoa sababu au msingi wa kauli iliyotangulia.
- source_word: υἱοὶ
  choice: wana
  rationale: Neno la Kigiriki linamaanisha ‘wana’; ‘wana’ ni la heshima na linadumisha wazo la hadhi ya kifamilia na urithi bila kuwalenga wanaume pekee katika matumizi haya.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Hii ni namna ya kawaida na ya moja kwa moja ya kuonyesha uhusiano wao na Mungu.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: διά pamoja na hali ya umilikaji huonyesha njia au chombo; tafsiri hii inahifadhi maana hiyo wazi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ‘Katika’ inadumisha lugha ya Paulo ya kuwa ndani ya Masihi, na Χριστός imetafsiriwa kama cheo ‘Masihi’ badala ya kutoholewa tu.
theological_decisions:
- issue: Lugha ya uana yenye jinsia katika υἱοὶ
  choice: wana wa Mungu
  alternative: watoto wa Mungu
  rationale: ‘Wana’ inadumisha kwa karibu zaidi lugha ya uana na kidokezo cha hadhi na urithi, huku muktadha wa ‘ninyi nyote’ ukionyesha kwamba kauli inawahusu waamini wote. Tanbihi inatoa tafsiri mbadala iliyo wazi zaidi kuhusu ujumuishi.
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός ni cheo chenye maana ya Masihi; kukitafsiri kunawasilisha maana yake, huku tanbihi ikitaja umbo la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘kwa njia ya imani katika’ umechaguliwa ili kutofautisha njia ya kupata hadhi hiyo na hali ya kuwa ndani ya Masihi, ingawa sentensi inabaki nyepesi kusomeka.
