  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: sw
  text: Kwa hiyo, sheria imekuwa mlezi wetu[a] mpaka Masihi[b], ili tuhesabiwe haki kwa imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msimamizi wetu”; kwa desturi limetafsiriwa “mwalimu wetu.” Neno la Kigiriki παιδαγωγός linamaanisha hasa mlezi au msimamizi wa mtoto katika nyumba, si mwalimu wa darasani.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa Masihi”; kirai hiki kinaweza pia kueleweka kuwa “kikielekea kwa Masihi” au “kikiongoza kwa Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Hapa neno hili linatoa hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida na wazi.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Katika muktadha huu linarejelea Sheria ya Musa kama jambo linalotambulika katika hoja ya Paulo.
- source_word: παιδαγωγὸς
  choice: mlezi
  rationale: Katika jamii ya Kigiriki na Kirumi, παιδαγωγός alikuwa msimamizi wa mtoto nyumbani, si hasa mwalimu wa darasani; “mlezi” linaonyesha jukumu hilo kwa lugha ya kawaida.
- source_word: ἡμῶν
  choice: wetu
  rationale: Kiwakilishi hiki kinaonyesha uhusiano wa παιδαγωγός nasi.
- source_word: γέγονεν
  choice: imekuwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali iliyotokana na jambo la wakati uliopita; “imekuwa” hudumisha maana hiyo.
- source_word: εἰς Χριστόν
  choice: mpaka Masihi
  rationale: Katika muktadha, εἰς linaweza kuonyesha kikomo au lengo la kazi ya ulezi ya sheria. “Mpaka Masihi” huwasilisha vizuri hali yake ya muda, huku uwezekano wa mwelekeo au lengo ukihifadhiwa katika tanbihi.
- source_word: Χριστόν
  choice: Masihi
  rationale: Χριστός limetafsiriwa kama cheo “Masihi,” badala ya kuachwa kama jina “Kristo.”
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linaanzisha kusudi; “ili” ni tafsiri fupi na ya kawaida.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Kirai hiki kinaonyesha msingi au njia katika hoja ya Paulo; “kwa imani” ni Kiswahili cha kawaida na sahihi.
- source_word: δικαιωθῶμεν
  choice: tuhesabiwe haki
  rationale: Kauli tendwa na hali tegemezi zimehifadhiwa; usemi huu pia hudumisha taswira ya kimahakama bila kueleza zaidi ya maandishi.
theological_decisions:
- issue: Maana ya εἰς Χριστόν kuhusiana na jukumu la sheria
  choice: mpaka Masihi
  alternative: kuelekea kwa Masihi; ikituongoza kwa Masihi
  rationale: Muktadha unasisitiza jukumu la muda la sheria kabla ya kuja kwa imani katika uhusiano na Masihi. Tafsiri kuu inaonyesha kikomo hicho, lakini tanbihi inahifadhi uwezekano wa kuelewa εἰς kama mwelekeo au lengo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. “Mlezi” limechaguliwa badala ya “mwalimu” ili kuonyesha jukumu la kihistoria la παιδαγωγός, na “tuhesabiwe haki” hudumisha istilahi ya kimahakama ya Paulo.
