  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: sw
  text: Kwa maana ikiwa urithi unatokana na sheria, hautokani tena na ahadi; lakini Mungu amemjalia Abrahamu urithi huo kwa ahadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: urithi
  rationale: Neno hili ni la kawaida na la moja kwa moja kwa kile kinachopokelewa na mrithi, nalo linafaa katika hoja ya Paulo kuhusu sheria na ahadi.
- source_word: ἐκ νόμου
  choice: unatokana na sheria
  rationale: Muundo huu unaonyesha chanzo au msingi wa urithi na kuhifadhi ulinganifu na ἐξ ἐπαγγελίας.
- source_word: ἐξ ἐπαγγελίας
  choice: unatokana na ahadi
  rationale: Huhifadhi tofauti ya chanzo kati ya sheria na ahadi kwa Kiswahili cha kawaida.
- source_word: οὐκέτι
  choice: hautokani tena
  rationale: Neno “tena” linaonyesha kwamba msingi wa sheria ungebatilisha msingi wa ahadi katika hoja hii.
- source_word: δι’ ἐπαγγελίας
  choice: kupitia ahadi
  rationale: “Kupitia” huonyesha ahadi kuwa njia ambayo Mungu alitumia kutoa urithi.
- source_word: κεχάρισται
  choice: amempa ... kwa neema
  rationale: Wakati timilifu unaakisiwa na “amempa,” huku “kwa neema” ikihifadhi maana ya kutoa kwa fadhili iliyo katika kitenzi χαρίζομαι.
- source_word: τῷ Ἀβραὰμ
  choice: Abrahamu
  rationale: Abrahamu anaonyeshwa wazi kuwa mpokeaji wa tendo la Mungu; mpangilio wa Kiswahili unatumia muundo “amempa Abrahamu.”
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhusika aliyetajwa wazi katika Kigiriki.
theological_decisions:
- issue: Iwapo maana ya neema katika χαρίζομαι ionyeshwe wazi
  choice: “amempa Abrahamu urithi huo kwa neema”
  alternative: “amempa Abrahamu urithi huo”
  rationale: Kutaja “kwa neema” kunahifadhi maana ya utoaji wa fadhili katika kitenzi bila kuongeza fundisho lisilokuwamo katika maandishi.
- issue: Kitu alichopewa Abrahamu kilichoachwa kueleweka katika Kigiriki
  choice: Kurudia “urithi huo”
  alternative: 'Kutumia kiwakilishi pekee: “amempa Abrahamu”'
  rationale: Kigiriki kinaacha kitu kikieleweka kutokana na “urithi”; kukitaja tena kwa Kiswahili huondoa utata wa kisarufi bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha ulinganifu wa hoja kati ya chanzo cha sheria na chanzo cha ahadi, huku ikitumia “amempa” badala ya muundo mzito zaidi.
