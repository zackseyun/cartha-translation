  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: sw
  text: Mpatanishi si wa mmoja tu[a], lakini Mungu ni mmoja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “mpatanishi si wa mmoja.” Maana inaweza kuwa “hatendi kwa ajili ya mmoja pekee” au “si wa upande mmoja pekee.”
    reason: alternative_reading
  - marker: b
    text: Kauli “Mungu ni mmoja” huenda inarejelea ungamo la Israeli kwamba Mungu ni mmoja; linganisha Kumbukumbu la Torati 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: mpatanishi
  rationale: “Mpatanishi” ni neno la kawaida na sahihi kwa mtu aliye katikati ya pande mbili ili kusaidia kufikia au kuthibitisha mapatano; linafaa katika muktadha wa kisheria na wa agano.
- source_word: ἑνὸς
  choice: wa mmoja tu
  rationale: Kirai cha Kigiriki ni kifupi na kina utata. “Wa mmoja tu” kinahifadhi muundo huo bila kuamua wazi ikiwa Paulo anamaanisha mtu mmoja, upande mmoja, au kutenda kwa ajili ya mmoja pekee.
- source_word: οὐκ ἔστιν
  choice: si
  rationale: Hii ni tafsiri ya moja kwa moja ya ukanushi wa kitenzi “kuwa,” na inadumisha ufupi wa sentensi ya Kigiriki.
- source_word: δὲ
  choice: lakini
  rationale: δὲ ya pili inaonyesha ulinganisho au utofautishaji kati ya kauli kuhusu mpatanishi na kauli kuhusu Mungu. δὲ ya kwanza haijatafsiriwa kwa neno tofauti kwa sababu katika Kiswahili ingeweza kuongeza kiashirio cha mjadala kisichohitajika.
- source_word: θεὸς εἷς ἐστιν
  choice: Mungu ni mmoja
  rationale: Tafsiri hii ya moja kwa moja inadumisha kauli fupi na yenye mkazo, pamoja na mwangwi unaowezekana wa ungamo la Israeli kwamba Mungu ni mmoja.
theological_decisions:
- issue: Hoja fupi na yenye utata katika kishazi cha kwanza
  choice: Mpatanishi si wa mmoja tu
  alternative: Mpatanishi hahusiki na upande mmoja pekee
  rationale: Aya hii ina utata mkubwa wa kifasiri. Tafsiri iliyochaguliwa inakaribia muundo wa Kigiriki na haifafanui hoja yote kuwa inahusu Musa, Kristo, sheria, au wahusika maalumu wa agano.
- issue: Kauli kwamba Mungu ni mmoja
  choice: Mungu ni mmoja
  alternative: Mungu ni Mungu mmoja
  rationale: Muundo mfupi unahifadhi uzito wa kauli ya Kigiriki na mwangwi wake unaowezekana wa Kumbukumbu la Torati 6:4 bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima, na ya sasa. Muundo wenye fumbo wa kishazi cha kwanza umehifadhiwa, huku tanbihi ikitoa maana kuu zinazowezekana bila kutatua mvutano wa kitheolojia.
