base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: sw
  text: Je, mliteseka kiasi hicho bure?—ikiwa kweli ilikuwa bure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mlipitia mambo mengi hivyo bure?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: mambo mengi hivyo
  rationale: Nomino-jina la wingi lisilo na jinsia linarejelea kwa upana mambo mengi waliyopitia Wagalatia; usemi huu ni wa kawaida na unadumisha maana ya wingi.
- source_word: ἐπάθετε
  choice: mliteseka
  rationale: Kitenzi πάσχω kinaweza kumaanisha kuteseka au, kwa upana zaidi, kupitia mambo fulani. Katika muktadha huu, “mliteseka” inaeleza kwa uwezekano mkubwa nguvu ya swali la Paulo, huku maana pana ikiwekwa katika tanbihi.
- source_word: εἰκῇ
  choice: bure
  rationale: “Bure” linaonyesha kwamba jambo halikuwa na matokeo au kusudi lililokusudiwa, na linafaa katika swali hili la balagha.
- source_word: εἴ γε
  choice: ikiwa kweli
  rationale: Usemi huu unaanzisha sharti lenye tahadhari; “ikiwa kweli” huhifadhi hali ya Paulo ya kutokutoa hitimisho la mwisho.
- source_word: καὶ
  choice: kweli
  rationale: Katika kifungu εἴ γε καὶ εἰκῇ, καὶ linaongeza mkazo kwa wazo la kuwa bure; Kiswahili cha asili huwasilisha mkazo huo kwa “kweli” ndani ya kishazi cha sharti.
- source_word: εἰκῇ
  choice: bure
  rationale: Kurudia “bure” kunadumisha uradidi wa Kigiriki na mkazo wa swali kwamba huenda mateso yao hayakuwa na matokeo.
