review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the rhetorical question, the guarded force of εἴ γε, and the repeated idea of futility. However, “mliteseka mambo mengi” is not idiomatic Standard East African Swahili: teseka is normally used without a direct object of this kind. The final “yalikuwa bure” also grammatically points to “mambo,” whereas the Greek elliptical clause refers back to the preceding undergoing/suffering as a whole.'
  naturalness: A small recasting is needed for idiomatic Swahili while retaining the source’s broad quantitative force and rhetorical hesitation.
  terminology: “Mliteseka,” “bure,” and “ikiwa kweli” are appropriate. “Kiasi hicho” naturally conveys τοσαῦτα in this verbal construction without falsely narrowing the experiences to a specified type.
  issues:
  - severity: medium
    issue: “mliteseka mambo mengi hivyo” uses teseka with an unnatural direct object.
    rationale: In standard contemporary Swahili, one normally says “mliteseka sana/kiasi hicho” or uses a different verb such as “mlipitia mambo mengi.” Retaining teseka is preferable for πάσχω, but its complement should be recast.
  - severity: low
    issue: The pronoun in “ikiwa kweli yalikuwa bure” most directly refers to “mambo mengi.”
    rationale: The Greek leaves the subject implicit and refers to the preceding suffering/experience being in vain. An impersonal singular “ilikuwa bure” better retains that scope and ambiguity.
  revised_text: Je, mliteseka kiasi hicho bure?—ikiwa kweli ilikuwa bure[a].
  revised_footnotes:
  - marker: a
    text: Au, “Je, mlipitia mambo mengi hivyo bure?”
