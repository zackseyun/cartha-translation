base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: sw
  text: 'Andiko liliona mapema kwamba Mungu huyahesabia mataifa[a] haki kwa imani, likamtangazia Abrahamu habari njema mapema[b]: “Katika wewe mataifa yote yatabarikiwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa mataifa mengine”; neno la Kigiriki ἔθνη linaweza kumaanisha “mataifa” au “watu wa mataifa mengine.”
    reason: lexical_alternative
  - marker: b
    text: Au “likamhubiria Abrahamu injili mapema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: yaliona mapema
  rationale: Huhifadhi maana ya kuona au kutambua kabla, huku ikitumia Kiswahili cha kawaida na kuafikiana na nomino ya wingi “Maandiko.”
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Hili ni rejeo la Paulo kwa Maandiko Matakatifu yaliyofanywa kana kwamba yanatenda; “Maandiko” ni istilahi ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Ni usemi wa kawaida unaoweza kuonyesha njia au msingi wa kuhesabiwa haki bila kufafanua kupita kiasi uhusiano huo.
- source_word: δικαιοῖ
  choice: huyahesabia ... haki
  rationale: Huhifadhi maana ya kimahakama ya kutambua au kutangaza kuwa na haki, bila kutumia neno la kitaalamu lisiloeleweka kwa urahisi.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: mataifa ... mataifa yote
  rationale: Huhifadhi urudiaji wa neno la Kigiriki na kuonyesha wazi uhusiano kati ya hoja ya Paulo na ahadi aliyopewa Abrahamu.
- source_word: προευηγγελίσατο
  choice: yakamtangazia ... habari njema mapema
  rationale: Huhifadhi wazo la kutangaza habari njema pamoja na maana ya kwamba tangazo hilo lilitolewa kabla.
- source_word: τῷ Ἀβραὰμ
  choice: Abrahamu
  rationale: Jina la kawaida la Kiswahili, likiwa yambwa lisilo la moja kwa moja la kitenzi “yakamtangazia.”
- source_word: Ἐνευλογηθήσονται
  choice: yatabarikiwa
  rationale: Huwakilisha moja kwa moja wakati ujao na hali ya kutendwa katika ahadi.
- source_word: ἐν σοὶ
  choice: Katika wewe
  rationale: Hufuata kwa ukaribu namna ya dondoo la Mwanzo na kuhifadhi uwezekano wa maana ya kiwakilishi au ya agano bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Iwapo ἔθνη itafsiriwe “mataifa” au “watu wa mataifa mengine”
  choice: “mataifa” katika sehemu zote mbili
  alternative: “watu wa mataifa mengine” katika sehemu ya kwanza na “mataifa” katika dondoo
  rationale: “Mataifa” huhifadhi urudiaji wa Kigiriki na kuunganisha moja kwa moja kuhesabiwa haki kwa imani na ahadi ya Abrahamu, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- issue: Namna ya kuwasilisha δικαιοῖ
  choice: “huyahesabia ... haki”
  alternative: “huyatangaza ... kuwa yenye haki”
  rationale: Chaguo hili linaonyesha mwelekeo wa kimahakama wa kitenzi katika muktadha wa Paulo bila kudai kwamba maana yake yote imekamilishwa na ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Upatanisho wa kisarufi wa “Maandiko” umetumia wingi (“yaliona,” “yakamtangazia”), ingawa Kigiriki kina nomino ya umoja. Uhuishaji wa Maandiko uliopo katika chanzo umehifadhiwa.
