id: GAL.3.14
reference: Galatians 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: sw
  text: ili baraka ya Abrahamu iwafikie watu wa mataifa[a] katika Masihi Yesu[b], ili sisi tupokee ahadi ya Roho[c] kwa njia ya imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mataifa.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “Kristo Yesu.”'
    reason: lexical_alternative
  - marker: c
    text: Au “Roho aliyeahidiwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi katika vifungu vyote viwili na kudumisha muundo wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: εἰς τὰ ἔθνη
  choice: iwafikie watu wa mataifa
  rationale: Katika muktadha wa hoja ya Paulo, ἔθνη inarejelea watu wasio Wayahudi; “watu wa mataifa” ni wazi na ya kawaida kuliko kutumia “mataifa” pekee.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: baraka ya Abrahamu
  rationale: Hudumisha uhusiano wa moja kwa moja na baraka inayohusishwa na Abrahamu.
- source_word: γένηται
  choice: iwafikie
  rationale: Katika muundo huu, kitenzi kinaeleza baraka kuwajia au kuwafikia walengwa; “iwafikie” ni ya asili na huhifadhi wazo hilo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Masihi” hutafsiri cheo Χριστός badala ya kukinakili tu, huku “katika” ikidumisha lugha muhimu ya Paulo ya kuwa ndani ya Masihi.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ahadi ya Roho
  rationale: Hudumisha muundo wa kimilikishi wa Kigiriki bila kuamua kimya kimya kwamba maana pekee ni “Roho aliyeahidiwa.”
- source_word: λάβωμεν
  choice: sisi tupokee
  rationale: Huwakilisha nafsi ya kwanza wingi na hali tegemezi chini ya ἵνα; “sisi” huweka wazi kundi linalojumuishwa katika kusudi la pili.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya njia ambayo ahadi inapokewa.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama umbo lililo karibu na jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika hoja kuhusu Abrahamu, ahadi na baraka, nguvu ya cheo bado iko wazi; kwa hiyo “Masihi” hutafsiri maana ya Χριστός, huku tafsiri ya kimapokeo ikiwekwa katika tanbihi.
- issue: Maana ya τοῦ πνεύματος
  choice: ahadi ya Roho
  alternative: Roho aliyeahidiwa
  rationale: Tafsiri kuu huhifadhi muundo na uwezekano wa maana wa kirai cha Kigiriki; tafsiri laini zaidi kwamba Roho ndiye aliyeahidiwa imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vifungu viwili vya kusudi umehifadhiwa, na istilahi “Masihi” na “Roho” zimeandikwa kwa herufi kubwa kama vyeo au marejeo mahususi.
