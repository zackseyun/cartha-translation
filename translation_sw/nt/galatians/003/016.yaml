id: GAL.3.16
reference: Galatians 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: sw
  text: 'Ahadi zilitamkwa kwa Abrahamu na kwa mzao wake[a]. Haikusemwa, “Na kwa wazao,”[b] ikirejelea wengi, bali ikirejelea mmoja: “Na kwa mzao wako,” ambaye ni Masihi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzao” kila linapotokea katika mstari huu; Kigiriki hutumia nomino ya umoja yenye maana ya mkusanyiko, ambayo ni muhimu kwa hoja ya Paulo.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Na kwa mbegu”; Paulo anasisitiza umbo la umoja katika maneno hayo.'
    reason: lexical_alternative
  - marker: c
    text: Au “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: zilitolewa
  rationale: Katika Kiswahili, ahadi kwa kawaida ‘hutolewa’; usemi huu ni wa asili na unahifadhi hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: ἐπαγγελίαι
  choice: ahadi
  rationale: Hili ndilo neno la kawaida na wazi kwa ahadi za Mungu katika muktadha huu.
- source_word: σπέρμα / σπέρματι
  choice: mzao
  rationale: ‘Mzao’ linaweza kumaanisha mtu anayetokana na mwingine na hapa linaweka wazi umoja wa kisarufi unaotegemewa na hoja ya Paulo; tanbihi inaonyesha maana pana ya jina hili la mkusanyiko.
- source_word: τοῖς σπέρμασιν
  choice: wazao
  rationale: Wingi umeonyeshwa wazi kwa sababu hoja ya Paulo inategemea tofauti kati ya umoja na wingi.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: kana kwamba yanawataja wengi / bali kana kwamba yanamtaja mmoja
  rationale: Muundo huu wa Kiswahili ni wa kawaida, unasawazisha vipashio viwili, na kuhifadhi mkazo wa wengi dhidi ya mmoja.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa neno linatumiwa kama cheo cha yule aliyetiwa mafuta na Mungu, si kama jina tu.
theological_decisions:
- issue: Utambulisho wa σπέρμα kama umoja wa mkusanyiko na kama mtu mmoja
  choice: mzao ... mmoja
  alternative: uzao ... mmoja
  rationale: 'Tafsiri inadumisha mvutano wa hoja ya Paulo: neno la umoja linaweza kuwa la mkusanyiko, lakini Paulo analenga umbo lake la umoja na kulitumia kumtambulisha Masihi.'
- issue: Utoaji wa Χριστός katika kauli ya utambulisho
  choice: Masihi
  alternative: Kristo
  rationale: Maana ya cheo iko hai katika mstari huu; ‘Masihi’ huiweka wazi bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kwa urahisi wa kusomwa huku tofauti ya kisarufi kati ya ‘mzao’ na ‘wazao’ ikibaki wazi.
