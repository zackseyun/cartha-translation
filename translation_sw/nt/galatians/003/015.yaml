  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: sw
  text: 'Ndugu[a], nasema kwa jinsi ya kibinadamu: hata agano[b] lililothibitishwa na mwanadamu, hakuna mtu anayelibatilisha wala kuliongezea masharti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa hutafsiri wingi wa kiume adelphoi; Paulo anawaambia waamini wenzake, ambao huenda walitia ndani wanawake pia.
    reason: cultural_note
  - marker: b
    text: Au “wosia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ndugu
  rationale: Ni namna ya moja kwa moja na ya kawaida ya kumwita mtu au kundi lenye uhusiano wa karibu. Neno la Kigiriki ni wingi wa kiume, lakini katika muktadha huu huenda linawahusu waamini wa kiume na wa kike; tanbihi inaweka wazi jambo hilo bila kupanua matini kuu.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: nasema kwa jinsi ya kibinadamu
  rationale: Usemi huu unatambulisha mfano kutoka katika maisha ya kawaida ya wanadamu. Tafsiri hii inabaki karibu na muundo wa Kigiriki huku ikieleweka kwa Kiswahili cha sasa.
- source_word: ὅμως
  choice: hata
  rationale: 'Hapa neno hili linatia nguvu hoja inayoanza: hata katika jambo la kawaida la kibinadamu, kanuni hiyo hutumika.'
- source_word: ἀνθρώπου
  choice: na mwanadamu
  rationale: Huhifadhi umoja wa neno la Kigiriki na kuonyesha kwamba agano limethibitishwa na mtu, bila kulifanya kuwa dhana ya jumla tu.
- source_word: κεκυρωμένην
  choice: lililothibitishwa
  rationale: Hali timilifu ya kitenzi inaonyesha jambo lililowekwa rasmi na ambalo bado lina nguvu. “Lililothibitishwa” ni la kawaida na linafaa katika muktadha wa kisheria.
- source_word: διαθήκην
  choice: agano
  rationale: Katika hoja ya Galatians 3, neno hili linaunganika na ahadi na agano la Mungu kwa Abrahamu. Maana ya kisheria ya “wosia” inawezekana pia na imeonyeshwa katika tanbihi.
- source_word: ἀθετεῖ
  choice: analibatilisha
  rationale: Kitenzi kina maana ya kulifanya jambo lisiwe na nguvu au kuliweka kando. “Kulibatilisha” huhifadhi uzito wa kisheria kwa Kiswahili wazi.
- source_word: ἐπιδιατάσσεται
  choice: kuliongezea
  rationale: Kitenzi hueleza kuongeza masharti au maagizo mengine. “Kuliongezea” ni kifupi na cha kawaida, huku muktadha wa agano ukidokeza kinachoongezwa.
theological_decisions:
- issue: Iwapo διαθήκη itafsiriwe “agano” au “wosia”
  choice: agano
  alternative: wosia
  rationale: Muktadha wa karibu unahusu ahadi ya Mungu kwa Abrahamu, hivyo “agano” hudumisha mwendelezo wa hoja ya Paulo. Hata hivyo, maana ya “wosia” ni uwezekano halisi wa kileksika na haijafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa hoja ya kisheria umehifadhiwa bila kutumia istilahi nzito zisizo za lazima.
