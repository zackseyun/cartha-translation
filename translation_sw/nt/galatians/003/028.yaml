id: GAL.3.28
reference: Galatians 3:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: sw
  text: Hakuna Myahudi wala Mgiriki, hakuna mtumwa wala mtu huru, hakuna mwanamume na mwanamke[a]; kwa maana ninyi nyote ni mmoja katika Masihi Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna mwanamume wala mwanamke.” Kigiriki kwa neno halisi kinasema “mwanamume na mwanamke,” huenda kikirejelea Mwanzo 1:27.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “katika Kristo Yesu”; hapa Χριστός limetafsiriwa “Masihi” kwa sababu ni cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: hakuna
  rationale: Ni Kiswahili cha kawaida kinachoeleza ukanushaji wa kuwapo na kinahifadhi urudiaji wenye mkazo katika sentensi.
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Katika jozi hii na Ἕλλην, neno linaonyesha utambulisho wa kikabila na kidini; “Myahudi” ndilo neno la kawaida na lililo wazi.
- source_word: Ἕλλην
  choice: Mgiriki
  rationale: Maandishi yanasema “Mgiriki,” si neno pana zaidi “Mmataifa”; uchaguzi huu unahifadhi jozi halisi aliyotumia Paulo.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika ulinganisho na mtu huru, hali ya utumwa ndiyo inayosisitizwa; “mtumwa” ni sahihi kuliko “mtumishi.”
- source_word: ἐλεύθερος
  choice: mtu huru
  rationale: Hii ni tafsiri ya asili ya hadhi inayopingana na mtumwa na inaeleweka wazi katika Kiswahili cha sasa.
- source_word: ἄρσεν καὶ θῆλυ
  choice: mwanamume na mwanamke
  rationale: Inahifadhi kiunganishi “na” tofauti na “wala” katika jozi mbili za kwanza, huku ikitoa Kiswahili cha kawaida na kudumisha mwangwi unaowezekana wa Mwanzo 1:27.
- source_word: πάντες γὰρ ὑμεῖς
  choice: kwa maana ninyi nyote
  rationale: Inahifadhi sababu inayotolewa na γάρ, msisitizo wa kiwakilishi ὑμεῖς, na ujumla wa πάντες.
- source_word: εἷς ἐστε
  choice: ni mmoja
  rationale: Inahifadhi umoja wa kisarufi na ufupi wa dai la Paulo bila kulipanua kuwa “mmeungana” au “mtu mmoja.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός ina nguvu ya cheo hapa; “Masihi” huonyesha cheo hicho, na “katika” huhifadhi lugha ya muungano bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri ἄρσεν καὶ θῆλυ baada ya jozi mbili zilizounganishwa kwa οὐδὲ
  choice: hakuna mwanamume na mwanamke
  alternative: hakuna mwanamume wala mwanamke
  rationale: Maandishi hubadili kutoka οὐδὲ (“wala”) hadi καὶ (“na”), jambo linaloweza kurejelea Mwanzo 1:27. Tafsiri inahifadhi tofauti hiyo, na tanbihi inaeleza Kiswahili mbadala kilicho laini zaidi.
- issue: Iwapo εἷς ἐστε ifafanuliwe zaidi
  choice: ninyi nyote ni mmoja
  alternative: ninyi nyote mmeungana
  rationale: “Ni mmoja” hudumisha dai la umoja ndani ya Masihi bila kudai kwamba tofauti zote za kiumbe zimeondolewa au kuingiza ufafanuzi usiotajwa.
- issue: Jinsi ya kuwakilisha Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi kuwa Χριστός ni cheo cha Yesu hapa, badala ya kulifanya lionekane tu kama sehemu ya jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa “hakuna” umehifadhiwa kwa ajili ya mkazo; “mtumwa” limetumiwa kwa usahihi wa hadhi ya kijamii, na muundo usio wa kawaida kidogo “hakuna mwanamume na mwanamke” umeachwa kwa makusudi ili kuhifadhi tofauti ya Kigiriki na mwangwi wa Mwanzo.
