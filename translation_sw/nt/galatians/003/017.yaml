  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: sw
  text: 'Ninachosema ni hiki: Sheria, iliyokuja miaka mia nne na thelathini baadaye, hailibatilishi[a] agano lililothibitishwa hapo awali na Mungu, hata kuifanya ahadi isiwe na nguvu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hailifanyi kuwa batili.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuibatilisha” au “kuiweka kando.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Maana yangu ni hii
  rationale: Ni utangulizi wa kawaida wa Kiswahili unaoonyesha kwamba Paulo anafafanua hoja yake, bila kuongeza wazo la wakati ambalo halipo wazi katika Kigiriki.
- source_word: διαθήκην
  choice: agano
  rationale: Katika muktadha huu neno hilo linahusu agano la Mungu linalohusiana na ahadi kwa Abrahamu; “agano” ni sahihi kuliko “wosia” au “makubaliano.”
- source_word: προκεκυρωμένην ὑπὸ τοῦ θεοῦ
  choice: ambalo Mungu alikuwa amethibitisha hapo awali
  rationale: Kauli hii inadumisha wazo la kitendo cha Mungu cha kulithibitisha agano kabla ya kuja kwa Sheria na inaonyesha athari ya hali timilifu ya kitenzi.
- source_word: ὁ ... γεγονὼς νόμος
  choice: Sheria iliyokuja
  rationale: “Iliyokuja” ni Kiswahili cha kawaida kinachoonyesha kuingia kwa Sheria katika historia baadaye.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: miaka mia nne na thelathini baadaye
  rationale: Inawasilisha kwa uwazi kipindi cha miaka 430 na uhusiano wake wa kuwa baadaye kuliko uthibitisho wa agano.
- source_word: οὐκ ἀκυροῖ
  choice: hailibatilishi
  rationale: “Kubatilisha” linafaa katika muktadha wa kisheria na wa agano, likimaanisha kuliondolea uhalali.
- source_word: εἰς τὸ καταργῆσαι
  choice: na hivyo kuifanya ... isiwe na nguvu
  rationale: Inahifadhi wazo la matokeo au kusudi la kuondoa utendaji wa ahadi bila kulazimisha tofauti ya kisarufi kati ya kusudi na matokeo.
- source_word: τὴν ἐπαγγελίαν
  choice: ahadi
  rationale: “Ahadi” ni neno la kawaida na sahihi katika hoja ya Paulo kuhusu alichoahidi Mungu kwa Abrahamu.
theological_decisions:
- issue: Maana ya διαθήκη katika hoja ya Paulo
  choice: agano
  alternative: wosia; makubaliano ya kisheria
  rationale: Muktadha unahusu ahadi ya Mungu kwa Abrahamu iliyotangulia Sheria. “Agano” huhifadhi hoja hiyo ya kihistoria na kiteolojia bila kuibana iwe wosia.
- issue: Uhusiano wa εἰς τὸ καταργῆσαι na kitenzi kikuu
  choice: na hivyo kuifanya ahadi isiwe na nguvu
  alternative: ili kuifanya ahadi isiwe na nguvu
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa upande wa kusudi au matokeo. “Na hivyo” unasomeka kiasili na hauamui kwa nguvu zaidi ya maandishi kama ni kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia msamiati unaoeleweka kwa wasomaji wa kawaida huku ikidumisha uzito wa hoja ya kisheria na ya agano. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
