  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: sw
  text: Je, ninyi ni wapumbavu kiasi hiki? Baada ya kuanza kwa Roho[a], je, sasa mnakamilishwa[b] kwa mwili[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya Roho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mnamaliza” au “mnakamilisha.”
    reason: lexical_alternative
  - marker: c
    text: “Kwa mwili” hapa yaweza pia kumaanisha “kwa juhudi za kibinadamu”; huenda pia ikahusisha “kwa asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: kiasi hiki
  rationale: 'Katika swali hili la kukemea, neno hili hasa linaonyesha kiwango: ‘kiasi hiki,’ huku likibaki la kawaida na lenye nguvu katika Kiswahili.'
- source_word: ἀνόητοί
  choice: wapumbavu
  rationale: Hueleza kukosa ufahamu au utambuzi wa busara. ‘Wapumbavu’ linadumisha ukali wa karipio la Paulo bila kutumia lugha ya matusi ya kisasa iliyo kali kupita kiasi.
- source_word: ἐναρξάμενοι
  choice: baada ya kuanza
  rationale: 'Huwasilisha kitendo kilichotangulia kitendo kikuu: Wagalatia walianza kwa njia moja, lakini sasa wanajaribu kuendelea kwa nyingine.'
- source_word: πνεύματι
  choice: kwa Roho
  rationale: 'Hapa hali ya kutoa njia au utendaji ina uwezekano mkubwa: walianza kwa uwezo au utendaji wa Roho. Herufi kubwa inaonyesha Roho Mtakatifu, kama muktadha wa Wagalatia 3 unavyodokeza.'
- source_word: νῦν
  choice: sasa
  rationale: Hudumisha wazi tofauti ya wakati kati ya mwanzo wao na mwenendo wao wa sasa.
- source_word: σαρκὶ
  choice: kwa mwili
  rationale: Tafsiri hii huhifadhi istilahi ya Paulo na ulinganifu wake kati ya Roho na mwili, bila kuifupisha maana mapema kuwa juhudi za kibinadamu pekee au asili ya dhambi pekee.
- source_word: ἐπιτελεῖσθε
  choice: mnakamilishwa
  rationale: 'Huwasilisha umbo la sasa lenye maana ya kutendewa: kuletwa kuelekea ukamilifu. Tanbihi inahifadhi uwezekano wa kuelewa umbo hilo kwa maana ya wao wenyewe kumaliza.'
theological_decisions:
- issue: Mhusika anayerejelewa na πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au kanuni ya kiroho
  rationale: Muktadha wa karibu unazungumzia kupokea Roho, matendo yenye nguvu, na maisha yatokanayo na imani; kwa hiyo Roho Mtakatifu ndiye anayerejelewa kwa uwezekano mkubwa.
- issue: Maana ya σάρξ ikilinganishwa na Roho
  choice: mwili
  alternative: juhudi za kibinadamu; asili ya dhambi
  rationale: ‘Mwili’ huhifadhi upana na mvutano wa istilahi ya Paulo. Katika muktadha huu inaweza kuhusisha kutegemea uwezo wa kibinadamu na pia hali ya mwanadamu iliyo mbali na utendaji wa Roho.
- issue: Kauli ya ἐπιτελεῖσθε
  choice: mnakamilishwa
  alternative: mnamaliza au mnakamilisha
  rationale: Umbo la Kigiriki linaweza kueleweka kama la kati au la kutendewa. Tafsiri kuu inatumia maana ya kutendewa, lakini tanbihi inahifadhi uwezekano wa maana ya wao wenyewe kujaribu kumaliza walichoanza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili unadumisha ukali wa karipio la Paulo, huku istilahi ‘Roho’ na ‘mwili’ zikihifadhi tofauti na mvutano wa kitheolojia wa maandishi ya Kigiriki.
