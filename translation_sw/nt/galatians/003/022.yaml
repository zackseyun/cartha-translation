id: GAL.3.22
reference: Galatians 3:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: sw
  text: Lakini Maandiko yaliweka kila kitu kifungoni chini ya dhambi[b], ili ahadi, kwa njia ya imani katika Yesu Masihi[a], itolewe kwa wale wanaoamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya uaminifu wa Yesu Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “yalifungia vitu vyote chini ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: yaliweka ... kifungoni
  rationale: Huwasilisha picha ya kufungiwa chini ya kizuizi kwa Kiswahili cha kawaida, bila kupunguza nguvu ya sitiari ya Kigiriki.
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa ushuhuda wa Maandiko katika Kiswahili; kitenzi cha umoja cha Kigiriki kinayafanya Maandiko yatende kama shahidi mmoja, jambo linalobaki wazi katika muktadha.
- source_word: τὰ πάντα
  choice: kila kitu
  rationale: Huhifadhi upana wa wingi wa jinsia ya kati bila kuufanya useme watu pekee.
- source_word: ὑπὸ ἁμαρτίαν
  choice: chini ya dhambi
  rationale: Huhifadhi sitiari ya kuwa chini ya mamlaka au kifungo cha dhambi bila kuongeza ufafanuzi katika matini kuu.
- source_word: ἡ ἐπαγγελία
  choice: ahadi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino ya Kigiriki, bila kuigeuza kuwa ‘zawadi iliyoahidiwa.’
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: kwa njia ya imani katika Yesu Masihi
  rationale: Matini kuu inachukua muundo huu wenye utata kuwa imani inayoelekezwa kwa Yesu; uwezekano wa kumaanisha uaminifu wa Yesu umehifadhiwa katika tanbihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa neno hilo linafanya kazi kama cheo kinachounganishwa na jina Yesu.
- source_word: δοθῇ
  choice: itolewe
  rationale: Kauli tendwa ya utegemezi baada ya ἵνα imewasilishwa kwa umbo la kusudi la Kiswahili bila kuongeza maana ya tendo.
- source_word: τοῖς πιστεύουσιν
  choice: kwa wale wanaoamini
  rationale: Huhifadhi nguvu ya hali endelevu ya kitenzi-shirikishi na kueleza mwitikio wa imani badala ya kutumia tu jina la kundi.
theological_decisions:
- issue: Muundo wa umilikaji πίστεως Ἰησοῦ Χριστοῦ
  choice: Imani katika Yesu Masihi
  alternative: Uaminifu wa Yesu Masihi
  rationale: Muundo wa Kigiriki unaweza kueleweka ama kama imani inayoelekezwa kwa Yesu ama kama uaminifu wa Yesu mwenyewe. Matini kuu inatumia maana ya kwanza iliyozoeleka, huku tanbihi ikihifadhi maana ya pili bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Maandiko’ limetumiwa kama jina la pamoja linalotenda kama shahidi mmoja. Muundo wa sentensi umebaki wazi kwa wasomaji wa kawaida huku sitiari ya kifungo na utata wa πίστεως Ἰησοῦ Χριστοῦ vikihifadhiwa.
