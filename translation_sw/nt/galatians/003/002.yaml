  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: sw
  text: 'Nataka kujua jambo hili moja tu kutoka kwenu: je, mlipokea Roho kwa matendo ya sheria, au kwa kusikia kwa imani?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kusikia ujumbe kwa imani”; usemi huu unaweza pia kutafsiriwa “kwa kusikia kwa imani.”
    reason: alternative_reading
  - marker: b
    text: “Uaminifu” ni maana nyingine inayowezekana lakini isiyo na uwezekano mkubwa kwa neno “imani” hapa, kwa sababu muundo wa Kigiriki umefupishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: jambo hili moja tu
  rationale: Huhifadhi msisitizo wa Paulo huku ikiwa Kiswahili cha kawaida na chenye nguvu ya swali la hoja.
- source_word: θέλω μαθεῖν
  choice: Nataka kujua
  rationale: Katika muktadha huu, ‘kujua’ huwasilisha kwa kawaida nia ya Paulo ya kupata jibu, ingawa kitenzi cha Kigiriki kinaweza kumaanisha kujifunza au kupata habari.
- source_word: ἀφ’ ὑμῶν
  choice: kutoka kwenu
  rationale: Hufuata kihusishi na kiwakilishi cha wingi kwa uwazi.
- source_word: ἐξ ἔργων νόμου
  choice: kwa matendo ya sheria
  rationale: Huhifadhi usemi wa Paulo na ulinganifu wa njia au msingi wa kupokea Roho; ‘sheria’ katika muktadha huu inaeleweka bila kuongeza ufafanuzi usio katika Kigiriki.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Muktadha unaelekeza kwa Roho wa Mungu; herufi kubwa inaonyesha rejeo hilo bila kuongeza neno ‘Mtakatifu,’ ambalo halipo wazi katika mstari.
- source_word: ἐλάβετε
  choice: mlipokea
  rationale: Wakati uliopita unafaa kwa tendo ambalo Paulo anawakumbusha Wagalatia kuwa walilipitia.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: kwa kusikia kwa imani
  rationale: 'Huhifadhi ufupi na kiwango fulani cha utata cha muundo wa Kigiriki: unaweza kueleweka kama kusikia kunakoambatana na imani, kusikia ujumbe kwa imani, au ‘kusikia kwa imani.’'
- source_word: πίστεως
  choice: imani
  rationale: ‘Imani’ ndilo chaguo la kawaida na linalofaa zaidi hapa; uwezekano mdogo wa maana ya ‘uaminifu’ umewekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la ‘Roho’
  choice: Roho wa Mungu anayepokelewa na waamini
  alternative: uzoefu wa kiroho au nguvu ya kiroho kwa maana ya jumla
  rationale: Muktadha wa karibu wa Wagalatia 3 unazungumzia Mungu kuwapa waamini Roho wake; hata hivyo, neno ‘Mtakatifu’ halijaongezwa kwa kuwa halipo katika maandishi ya Kigiriki.
- issue: Uhusiano katika ἀκοῆς πίστεως
  choice: kusikia kunakoambatana na imani
  alternative: kusikia ujumbe kwa imani; kusikia kunakotokana na imani; kusikia juu ya imani
  rationale: Muundo wa jenitivi wa Kigiriki ni mfupi na unaweza kufasiriwa kwa zaidi ya njia moja. Tafsiri kuu ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umewekwa wazi bila kupunguza ukali wa hoja ya Paulo. Alama zote za tanbihi zimewekwa katika maandishi makuu.
