id: GAL.3.5
reference: Galatians 3:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: sw
  text: Basi, je, yule anayewapa Roho na kutenda miujiza miongoni mwenu[a] hufanya hivyo kwa matendo ya sheria, au kwa kusikia kwa imani?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kusikia ujumbe wa imani,” au “kwa ujumbe uliosikiwa kwa imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: anayewapa
  rationale: Kitenzi hiki kinaonyesha utoaji unaoendelea. “Anayewapa” ni Kiswahili cha kawaida na wazi katika muktadha huu bila kuongeza wazo lisilotajwa wazi katika Kigiriki.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika matumizi ya Paulo hapa, neno hili linamtaja Roho kwa namna mahususi. “Roho” linahifadhi usemi wa Kigiriki bila kuongeza “Mtakatifu,” ingawa huyo ndiye anayelengwa.
- source_word: ἐνεργῶν δυνάμεις
  choice: kutenda miujiza
  rationale: Huu ni usemi wa asili na unaoeleweka kwa matendo yenye nguvu za Mungu; huepuka tafsiri isiyo ya kawaida kama “kutenda nguvu.”
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Katika muktadha wa jumuiya za Wagalatia, “miongoni mwenu” linaeleza vizuri matendo yanayoonekana katika jumuiya, huku maana mbadala “ndani yenu” ikihifadhiwa katika tanbihi.
- source_word: ἐξ ἔργων νόμου
  choice: kwa matendo ya sheria
  rationale: “Kwa” linaonyesha msingi au njia inayoulizwa, na “matendo ya sheria” linahifadhi usemi muhimu wa Paulo kwa Kiswahili kinachoeleweka.
- source_word: ἀκοῆς πίστεως
  choice: kwa kusikia kwa imani
  rationale: Tafsiri hii inadumisha ufupi na mvutano wa kisintaksia wa Kigiriki, huku ikiruhusu kueleweka kuwa kusikia kunaambatana na imani. Maana nyingine zinazowezekana zimewekwa katika tanbihi.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo maana inayofaa zaidi katika utofautishaji wa Paulo kati ya matendo ya sheria na kuitikia kwa imani.
theological_decisions:
- issue: Muundo ἀκοῆς πίστεως unaweza kueleweka kwa njia kadhaa zinazokaribiana.
  choice: kwa kusikia kwa imani
  alternative: kwa kusikia kunakotokana na imani; kwa ujumbe uliosikiwa kwa imani
  rationale: Chaguo kuu linahifadhi utofautishaji wa hoja ya Paulo bila kuamua kimyakimya kama πίστεως linafafanua namna ya kusikia, chanzo chake, au mwitikio kwa ujumbe uliosikiwa. Tanbihi inahifadhi uwezekano huo.
- issue: ἐν ὑμῖν inaweza kueleza eneo la kijumuiya au tendo ndani ya watu.
  choice: miongoni mwenu
  alternative: ndani yenu
  rationale: “Miongoni mwenu” linafaa kwa miujiza inayotendeka katika jumuiya, lakini “ndani yenu” linawezekana kisarufi na linaweza kuelekeza kwenye utendaji ndani ya waamini; kwa hiyo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, pamoja na usemi wa Paulo “matendo ya sheria.”
