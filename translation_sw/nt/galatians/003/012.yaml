  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: sw
  text: Lakini sheria haitokani na imani; bali, “Mtu anayeyatenda ataishi kwa hayo.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataishi ndani ya hayo.”
    reason: lexical_alternative
  - marker: b
    text: Nukuu kutoka Walawi 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: sheria
  rationale: Neno “sheria” linadumisha usemi mpana wa Paulo huku muktadha ukiendelea kuelekeza kwenye Sheria ya Musa.
- source_word: ἐκ πίστεως
  choice: haitokani na imani
  rationale: “Haitokani na” linaakisi wazo la chanzo au kanuni katika ἐκ na kuhifadhi utofautishaji wa Paulo kati ya sheria na imani bila kuufafanua kupita kiasi.
- source_word: ἀλλ’
  choice: bali
  rationale: “Bali” linaonyesha utofautishaji mkali na kutanguliza nukuu ya Maandiko kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ ποιήσας αὐτά
  choice: Mtu anayeyatenda mambo hayo
  rationale: Muundo huu unahifadhi maana ya mtu yeyote kwa umoja na kufanya rejeo la αὐτά kwa matakwa au maagizo ya sheria lieleweke bila kuyaongeza moja kwa moja katika matini.
- source_word: ζήσεται ἐν αὐτοῖς
  choice: ataishi kwa hayo
  rationale: “Ataishi” linaonyesha wakati ujao, na “kwa hayo” linawasilisha ἐν hapa kama njia au msingi wa kuishi; tafsiri ya karibu zaidi ya kimuundo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Utofautishaji wa Paulo kati ya sheria na imani
  choice: Sheria “haitokani na imani,” kisha nukuu inaelekeza kwenye kutenda.
  alternative: Sheria haitegemei imani; sheria haifanyi kazi kwa kanuni ya imani.
  rationale: Tafsiri iliyochaguliwa inabaki karibu na Kigiriki na kuhifadhi mvutano wa kiteolojia bila kuufanya kuwa maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Alama zote mbili za tanbihi zimewekwa baada ya nukuu kwa sababu tanbihi ya kwanza inahusu kishazi cha mwisho, na ya pili inahusu nukuu nzima.
