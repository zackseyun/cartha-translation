id: GAL.3.25
reference: Galatians 3:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: sw
  text: Lakini sasa kwa kuwa imani imekuja[a], hatuko tena chini ya mlezi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ile imani imekuja.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki παιδαγωγός humaanisha mlezi au msimamizi wa mtoto katika nyumba, si hasa mwalimu wa darasani.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: sasa kwa kuwa ... imekuja
  rationale: Kirai cha Kigiriki cha genitivi huru chenye kitenzi-shirikishi cha aoristi kinaelezwa kwa kawaida katika Kiswahili kama kishazi cha wakati; tafsiri hii inaonyesha kuwasili kulikokamilika na hali yake ya sasa.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofautishaji wa kiasi na kipindi cha awali kilichotajwa katika mstari uliotangulia.
- source_word: πίστεως
  choice: imani
  rationale: Hili ndilo neno la kawaida na la asili kwa πίστις; halilazimishi tafsiri kuwa mfumo rasmi wa imani, huku muktadha ukibaki na maana yake ya kihistoria ya wokovu.
- source_word: οὐκέτι
  choice: hatuko tena
  rationale: Hueleza wazi kwamba hali ya awali imekoma.
- source_word: ὑπὸ
  choice: chini ya
  rationale: Hudumisha sitiari ya kuwa chini ya mamlaka au usimamizi.
- source_word: παιδαγωγόν
  choice: mlezi
  rationale: Katika mazingira ya kale, παιδαγωγός alikuwa msimamizi wa mtoto wa nyumbani, si hasa mwalimu wa darasani; “mlezi” ni neno la kawaida na linaloeleweka.
- source_word: ἐσμεν
  choice: tuko
  rationale: Ni uwasilishaji wa kawaida wa nafsi ya kwanza wingi ya kitenzi ‘kuwa’ katika kishazi hiki.
theological_decisions:
- issue: Maana ya kuja kwa imani katika muktadha
  choice: “imani imekuja”
  alternative: “ile imani imekuja”
  rationale: Tafsiri kuu inabaki ya kawaida na huhifadhi uwezekano wa imani kama njia ya kumwamini Mungu; tanbihi inaonyesha pia uwezekano wa maana ya ‘ile imani’ kama kipindi au ukweli wa imani uliodhihirishwa katika historia ya wokovu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Mpangilio wa tanbihi umewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya ‘imekuja’ na [b] baada ya ‘mlezi’.'
