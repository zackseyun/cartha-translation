  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: sw
  text: Walikuwa wakisikia tu kwamba, “Yule aliyetutesa zamani sasa anahubiri imani ambayo zamani alikuwa akiiharibu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili.” Kigiriki ni “imani,” na hapa huenda kinamaanisha ujumbe wa Kikristo au imani ambayo Paulo alikuwa ameishambulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: tu
  rationale: 'Inaonyesha ukomo: walichojua kuhusu Paulo kilitokana tu na habari waliyoendelea kusikia.'
- source_word: ἀκούοντες ἦσαν
  choice: walikuwa wakisikia
  rationale: Muundo wa wakati uliopita unaoendelea unaonyesha kwamba habari hiyo ilikuwa ikiwafikia kwa kuendelea au kurudiwa.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: yule aliyetutesa zamani
  rationale: Kirai hiki kinamtambulisha Paulo kwa tendo lake la zamani; ‘aliyetutesa’ ni Kiswahili cha kawaida na chenye nguvu inayofaa kwa διώκω.
- source_word: νῦν εὐαγγελίζεται
  choice: sasa anaihubiri
  rationale: Kitenzi hiki kinahusu kutangaza habari njema; ‘anaihubiri’ ni usemi wa kawaida unaokubali ‘imani’ kuwa yambwa bila kulazimisha tafsiri ya ‘injili.’
- source_word: τὴν πίστιν
  choice: imani ile
  rationale: Hapa πίστις yenye kibainishi inaelekea kumaanisha imani ya Kikristo kama ujumbe unaoaminiwa. ‘Imani ile’ pia inaunganika kiasili na kishazi rejeshi kinachofuata.
- source_word: ἣν ποτε ἐπόρθει
  choice: ambayo zamani alijaribu kuiangamiza
  rationale: πορθέω hubeba maana ya kuharibu au kuangamiza. ‘Alijaribu kuiangamiza’ huonyesha kampeni yake yenye nia ya uharibifu bila kudai kwamba aliweza kuimaliza.
theological_decisions:
- issue: Maana ya τὴν πίστιν
  choice: ‘imani ile’ kama imani/ujumbe wa Kikristo ambao Paulo sasa anahubiri
  alternative: ‘injili’ au tendo la mtu binafsi la kuamini
  rationale: Muktadha unatofautisha mateso ya Paulo ya zamani na mahubiri yake ya sasa. Kibainishi na kishazi ‘ambayo zamani alijaribu kuiangamiza’ vinaunga mkono maana ya kitu kinachoaminiwa au ujumbe wa imani, huku tanbihi ikihifadhi uwezekano wa tafsiri ya kimuktadha ‘injili.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakisikia’ huhifadhi hali ya kuendelea ya Kigiriki; ‘tu’ huhifadhi ukomo wa μόνον. Tanbihi imewekwa baada ya sentensi na alama yake [a] imo katika matini kuu.
