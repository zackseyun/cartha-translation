  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: sw
  text: Kwa maana, ndugu,[a] nataka mjue kwamba injili niliyohubiri haitokani na mwanadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ndugu na dada.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, si kulingana na mwanadamu; usemi huo unaweza pia kumaanisha kwamba injili hiyo haifuati viwango vya kibinadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: nataka mjue
  rationale: Katika muktadha huu, usemi huu unatambulisha ufafanuzi muhimu. ‘Nataka mjue’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi nguvu yake bila kuongeza wazo jipya.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli inayofuata inaeleza au inatoa msingi wa yaliyoitangulia.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kutumiwa kwa waumini wa kiume na wa kike, kama ambavyo wingi wa Kigiriki hapa unaweza kulihusu kusanyiko lote.
- source_word: εὐαγγέλιον
  choice: injili
  rationale: ‘Injili’ ni neno sanifu na linalotambulika sana katika Kiswahili kwa dhana hii ya Paulo.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: niliyohubiri
  rationale: Kitenzi hiki kinaeleza kitendo cha Paulo cha kuitangaza injili hadharani; ‘niliyohubiri’ ni fupi, wazi na ya kawaida katika muktadha huu.
- source_word: κατὰ ἄνθρωπον
  choice: haitokani na mwanadamu
  rationale: Muktadha wa mstari unaofuata unakanusha kupokea au kufundishwa injili kutoka kwa mwanadamu, hivyo usemi huu unaeleweka hasa kwa maana ya chanzo cha kibinadamu.
theological_decisions:
- issue: Ikiwa κατὰ ἄνθρωπον inaonyesha chanzo cha kibinadamu au kipimo/utaratibu wa kibinadamu
  choice: haitokani na mwanadamu
  alternative: haifuati viwango vya kibinadamu
  rationale: Wagalatia 1:12 inaendeleza hoja kwa kusema Paulo hakuipokea kutoka kwa mwanadamu wala kufundishwa; kwa hiyo maana ya chanzo inafaa zaidi. Hata hivyo, uwezekano wa maana ya viwango au namna ya kibinadamu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili katika Kiswahili huku uhusiano wa γὰρ na utata wa κατὰ ἄνθρωπον vikihifadhiwa.
