lexical_decisions:
- source_word: Ἔπειτα
  choice: Kisha
  rationale: Inaonyesha tukio linalofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: μετὰ ἔτη τρία
  choice: baada ya miaka mitatu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati bila kubainisha kimya kimya miaka hiyo ilihesabiwa kuanzia lini.
- source_word: ἀνῆλθον
  choice: nilipanda kwenda
  rationale: Inahifadhi wazo la kwenda juu kuelekea Yerusalemu, ambalo limo katika kitenzi cha Kigiriki.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: ἱστορῆσαι
  choice: ili nifahamiane na
  rationale: Kitenzi kinaweza kumaanisha kukutana na mtu kwa lengo la kumjua binafsi, si ziara ya kawaida tu; tanbihi inadumisha uwezekano wa tafsiri nyepesi zaidi.
- source_word: Κηφᾶν
  choice: Kefa
  rationale: Inahifadhi jina la Kiaramu alilotumia Paulo badala ya kulibadilisha kimya kimya kuwa Petro.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: nikakaa pamoja naye
  rationale: Inaeleza kwa kawaida kuendelea kuwa na Kefa bila kudai kwa lazima kwamba Paulo alilala nyumbani kwake.
- source_word: ἡμέρας δεκαπέντε
  choice: siku kumi na tano
  rationale: Hali ya muda inaeleweka wazi pamoja na kitenzi “nikakaa,” hivyo hakuna ulazima wa kuongeza neno jingine.
