  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana mimi sikuipokea kutoka kwa mwanadamu, wala sikufundishwa, bali kwa njia ya ufunuo wa Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “ufunuo wa Yesu Masihi” inaweza kumaanisha ufunuo uliotoka kwa Yesu Masihi au ufunuo unaomhusu Yesu Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: kutoka kwa mwanadamu
  rationale: Umoja wa neno la Kigiriki umetumiwa kwa maana ya kijumla, ukilinganisha chanzo cha kibinadamu na ufunuo. Kauli hii ya Kiswahili ni ya kawaida na haidokezi lazima mtu mmoja maalumu.
- source_word: παρέλαβον
  choice: sikuipokea
  rationale: Kitenzi hiki kinafaa katika muktadha wa kupokea ujumbe au mapokeo. Kiambishi “-i-” kinarejelea injili iliyotajwa katika muktadha.
- source_word: ἐδιδάχθην
  choice: sikufundishwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na tofauti kati ya kufundishwa na kupokea kwa ufunuo.
- source_word: δι’ ἀποκαλύψεως
  choice: kwa njia ya ufunuo
  rationale: “Kwa njia ya” huonyesha chombo au namna, kama διά katika kifungu hiki, huku “ufunuo” ukidokeza tukio halisi la kufunuliwa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: wa Yesu Masihi
  rationale: Muundo wa “wa” unafuata karibu hali ya umilikishi ya Kigiriki na kwa kawaida unaweza kueleweka kuwa ufunuo uliotoka kwa Yesu Masihi au ufunuo unaomhusu. “Masihi” huhifadhi Χριστός kama cheo.
theological_decisions:
- issue: Maana ya umilikishi katika ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: ufunuo wa Yesu Masihi
  alternative: ufunuo kutoka kwa Yesu Masihi; ufunuo unaomhusu Yesu Masihi
  rationale: Kigiriki kinaweza kumaanisha ufunuo unaotolewa na Yesu Masihi au ufunuo unaomhusu. Muundo wa Kiswahili “wa Yesu Masihi” huhifadhi utata huo halisi badala ya kuamua kimya-kimya, na tanbihi inaueleza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata kwa karibu mkazo na mfuatano wa hoja wa Kigiriki bila kuwa ngumu kwa msomaji wa kawaida.
