  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: sw
  text: Nao walimtukuza Mungu kwa sababu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “ndani yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuwaunganisha watu waliotajwa katika mstari uliotangulia na tendo lao.
- source_word: ἐδόξαζον
  choice: walimtukuza
  rationale: Kitenzi δοξάζω humaanisha kumpa Mungu utukufu au heshima. Wakati usiotimilifu wa Kigiriki unaweza kuonyesha tendo lililoendelea au lililorudiwa; katika Kiswahili, wakati uliopita unaeleza jambo hilo kwa kawaida bila kulazimisha ufafanuzi wa ziada.
- source_word: ἐν ἐμοὶ
  choice: kwa sababu yangu
  rationale: 'Ingawa ἐν kwa msingi humaanisha ‘katika,’ hapa kirai kinaeleweka kwa maana ya kisababishi au uhusiano: walimtukuza Mungu kutokana na yale yaliyokuwa yametokea kuhusiana na Paulo. Maana halisi zaidi imehifadhiwa katika tanbihi.'
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya kitenzi ἐδόξαζον; ‘Mungu’ ni tafsiri ya kawaida na sahihi katika muktadha huu.
theological_decisions:
- issue: Maana ya ἐν ἐμοὶ
  choice: 'Maana ya kisababishi/uhusiano: “kwa sababu yangu”'
  alternative: 'Maana ya karibu zaidi na muundo wa Kigiriki: “ndani yangu” au “katika mimi”'
  rationale: Muktadha unaeleza jinsi makanisa yalivyoitikia habari za kuongoka na huduma ya Paulo. ‘Kwa sababu yangu’ huwasilisha wazi kuwa walimtukuza Mungu kutokana na yale aliyokuwa amefanya kuhusiana na Paulo, huku tanbihi ikihifadhi utata wa kirai cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nao’ huendeleza simulizi kwa ufasaha; ‘walimtukuza Mungu’ ni usemi wa kawaida wa kibiblia unaoeleweka na wasomaji wa leo.
