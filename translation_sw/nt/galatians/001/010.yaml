  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: sw
  text: Kwa maana, je, sasa ninatafuta kibali cha watu au cha Mungu? Au ninatafuta kuwapendeza watu? Kama bado ningekuwa nikiwapendeza watu, nisingekuwa mtumwa wa Masihi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄρτι
  choice: sasa
  rationale: Neno hili linaonyesha hali na hoja ya Paulo ya wakati huu, huenda kwa kulinganisha na mwenendo wake wa zamani.
- source_word: πείθω
  choice: ninatafuta kuwakubalia
  rationale: Katika muktadha huu kitenzi kinaweza kumaanisha kushawishi au kutafuta kibali. Usemi huu wa Kiswahili unaendana kwa kawaida na kitu 'watu' na 'Mungu' bila kudokeza kwamba Paulo anajaribu kumbadilisha Mungu mawazo.
- source_word: ἀνθρώπους
  choice: watu
  rationale: Hurejelea wanadamu kwa ujumla, si wanaume pekee.
- source_word: θεόν
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja ya upande wa pili katika swali la balagha.
- source_word: ζητῶ
  choice: ninatafuta
  rationale: Huhifadhi hali ya wakati uliopo na wazo la kujitahidi kufikia jambo.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: kuwapendeza / nikiwapendeza
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kutaka kukubalika au kupendeza mbele ya watu.
- source_word: εἰ ἔτι
  choice: Kama bado ningekuwa
  rationale: Huhifadhi sharti lisilo la hakika pamoja na wazo la kuendelea na mwenendo wa awali.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Huhifadhi maana ya cheo cha Χριστός kwa Kiswahili cha kawaida.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Huhifadhi nguvu ya neno linaloonyesha umilikiwa na utii kamili, jambo muhimu katika tofauti kati ya kuwapendeza watu na kuwa wa Masihi.
theological_decisions:
- issue: Maana ya πείθω inapomhusu Mungu
  choice: ninatafuta kuwakubalia watu, au Mungu
  alternative: ninawashawishi watu, au Mungu
  rationale: Tafsiri iliyochaguliwa inaepusha wazo potovu la kwamba Paulo anajaribu kumbadilisha Mungu mawazo, huku tanbihi ikihifadhi uwezekano wa msingi wa maana ya 'kushawishi'.
- issue: Tafsiri ya Χριστοῦ δοῦλος
  choice: mtumwa wa Masihi
  alternative: mtumishi wa Kristo
  rationale: ‘Mtumwa’ huhifadhi wazo la umilikiwa na utii kamili, na ‘Masihi’ huhifadhi uzito wa cheo cha Χριστός bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Maswali ya balagha na mvutano kati ya kutafuta kibali cha watu na kuwa mtumwa wa Masihi vimehifadhiwa.
