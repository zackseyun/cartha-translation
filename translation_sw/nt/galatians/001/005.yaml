  text: Utukufu ni wake milele na milele. Amina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: ni wake
  rationale: Kiwakilishi hiki cha uhusiano katika hali ya dative kinamrejelea ‘Mungu na Baba yetu’ katika mstari uliotangulia. ‘Ni wake’ huunda tamko la sifa la kawaida na la asili kwa Kiswahili bila kurudia mtajwa.
- source_word: δόξα
  choice: utukufu
  rationale: ‘Utukufu’ ndilo neno la kawaida la kibiblia katika tamko la kumsifu Mungu, na linadumisha uzito wa maana ya δόξα kuliko ‘sifa’ au ‘heshima’ peke yake.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ni nahau inayosisitiza muda usio na mwisho; ‘milele na milele’ ni Kiswahili cha kawaida na chenye nguvu inayolingana na msemo wa Kigiriki.
- source_word: ἀμήν
  choice: Amina
  rationale: Neno hili limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia na ibada za Kiswahili, likitoa uthibitisho wa dhati unaohitimisha tamko la sifa.
theological_decisions:
- issue: Kitenzi kisichotajwa wazi katika tamko la sifa
  choice: Utukufu ni wake
  alternative: Utukufu uwe kwake
  rationale: Kigiriki hakina kitenzi wazi, hivyo kinaweza kueleweka kama tamko kwamba utukufu ni wa Mungu au kama ombi la kutaka apewe utukufu. ‘Ni wake’ ni tamko la asili kwa Kiswahili, linadumisha rejeo la ᾧ, na haliongezi wazo la kitendo cha wanadamu kumpa utukufu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wenye heshima na unaofaa kwa tamko la sifa. Hakuna tanbihi inayohitajika.
