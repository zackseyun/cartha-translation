lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: kumfunua
  rationale: Kitenzi hiki kinahifadhi maana ya Mungu kuondoa kilichofichika na kumdhihirisha Mwana; muundo wa Kiswahili unaendelea na wazo la mstari uliotangulia.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Mwana wake
  rationale: Hii ni tafsiri ya kawaida na yenye heshima ya cheo hiki, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: ἐν ἐμοὶ
  choice: ndani yangu
  rationale: Tafsiri hii inafuata maana ya msingi ya ἐν na kuhifadhi uwezekano wa ufunuo wa ndani, huku maana za “kwangu” na “kupitia kwangu” zikiwekwa katika tanbihi.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: ili nimtangaze
  rationale: Kigiriki kinamweka Mwana mwenyewe kama yambwa ya kutangazwa. “Nimtangaze” ni Kiswahili cha asili kinachohifadhi msisitizo huo bila kugeuza kuwa tu ujumbe unaomhusu.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Katika muktadha wa Paulo, neno hili linawalenga hasa watu wasio Wayahudi. Usemi huu ni wazi kwa wasomaji wa sasa na bado unahifadhi dhana ya mataifa.
- source_word: εὐθέως
  choice: mara moja
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kutenda bila kuchelewa.
- source_word: οὐ προσανεθέμην
  choice: sikushauriana
  rationale: Kitenzi cha kati hapa kina maana ya kushauriana au kujadiliana na mwingine; “sikushauriana” ni cha asili na kinaendana na kishiriki kinachofuata.
- source_word: σαρκὶ καὶ αἵματι
  choice: na mwanadamu yeyote
  rationale: “Mwili na damu” ni nahau ya Kisemiti inayomaanisha binadamu. Maana yake imetolewa katika matini kwa uwazi wa Kiswahili, huku nahau halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἐν ἐμοὶ kuhusiana na kufunuliwa kwa Mwana
  choice: Kuhifadhi tafsiri ya karibu “ndani yangu” katika matini kuu
  alternative: “kwangu” au “kupitia kwangu”
  rationale: Kirai hiki kinaweza kueleweka kuwa ufunuo wa ndani, ufunuo ulioelekezwa kwa Paulo, au ufunuo kupitia kwake. Matini kuu haiamui mjadala huo kimya kimya; tanbihi inataja uwezekano mwingine.
- issue: Yambwa ya εὐαγγελίζωμαι
  choice: 'Kumweka Mwana mwenyewe kama anayehubiriwa: “nimtangaze”'
  alternative: “nitangaze habari njema kumhusu”
  rationale: Muundo wa Kigiriki una αὐτόν kama yambwa ya moja kwa moja. Tafsiri iliyochaguliwa inahifadhi nguvu hii ya Kikristo bila kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Miongoni mwa watu wa mataifa” limetumiwa badala ya istilahi isiyoeleweka kwa urahisi, na nahau “mwili na damu” imefafanuliwa katika tanbihi. Alama zote za tanbihi zimo katika matini kuu.
