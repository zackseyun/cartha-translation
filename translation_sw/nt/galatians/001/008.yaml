  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: sw
  text: Lakini hata kama yeyote—sisi wenyewe au malaika kutoka mbinguni—angewahubiria habari njema kinyume na zile tulizowahubiria,[a] na alaaniwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tofauti na zile tulizowahubiria,” au “zaidi ya zile tulizowahubiria.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na awe chini ya laana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Lakini hata kama
  rationale: Huwasilisha nguvu ya upinzani ya ἀλλά, msisitizo wa καί, na sharti la ἐάν kwa Kiswahili cha kawaida.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: sisi au malaika kutoka mbinguni
  rationale: Hudumisha kujihusisha kwa Paulo mwenyewe na utofautishaji wenye nguvu wa mjumbe wa mbinguni bila kuongeza maneno yasiyokuwapo.
- source_word: εὐαγγελίζηται
  choice: atawahubiria habari njema
  rationale: Kitenzi hiki kinatafsiriwa kwa usemi wa kawaida unaohifadhi maana ya kutangaza habari njema, badala ya kukibadili moja kwa moja kuwa nomino ‘injili.’
- source_word: παρ’ ὃ
  choice: iliyo tofauti na ile
  rationale: Katika muktadha huu παρά huonyesha kupotoka kutoka ujumbe uliotangazwa awali. ‘Tofauti na’ huhifadhi uwezekano wa maana ya kinyume, tofauti, au kwenda nje ya ujumbe huo bila kuibana kupita kiasi.
- source_word: εὐηγγελισάμεθα
  choice: tuliyowahubiria
  rationale: Huhifadhi uhusiano wa kileksia na εὐαγγελίζηται kwa kurudia kitenzi ‘hubiri,’ huku ‘habari njema’ ikieleweka kutoka kishazi kilichotangulia.
- source_word: ἀνάθεμα ἔστω
  choice: na alaaniwe
  rationale: Ni usemi mzito lakini unaoeleweka katika Kiswahili cha sasa, unaohifadhi nguvu ya tamko la laana bila kuingiza istilahi ya baadaye ya kanisa.
theological_decisions:
- issue: Maana ya tamko ἀνάθεμα ἔστω
  choice: na alaaniwe
  alternative: na awe chini ya laana; na awe anatema
  rationale: ‘Na alaaniwe’ huhifadhi hukumu halisi na nzito inayotamkwa juu ya yeyote anayehubiri ujumbe unaopotoka kutoka habari njema ya kitume, bila kuufanya moja kwa moja kuwa utaratibu maalumu wa kutengwa kanisani.
- issue: Upeo wa παρά katika παρ’ ὃ
  choice: iliyo tofauti na ile
  alternative: iliyo kinyume na ile; inayopita nje ya ile
  rationale: ‘Tofauti na’ huhifadhi mvutano wa kileksia wa παρά, ambao hapa unaweza kuonyesha ujumbe unaokwenda kinyume, unaotofautiana, au unaokwenda zaidi ya ule wa awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Habari njema’ huweka wazi maana ya kitenzi cha Kigiriki; ‘atawahubiria’ ni ya asili katika muktadha wa ujumbe wa kidini. Alama zote za tanbihi zimewekwa katika matini kuu.
