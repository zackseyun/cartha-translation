  yaml_path: translation/nt/galatians/001/002.yaml
  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: sw
  text: 'na ndugu wote walio pamoja nami, kwa makanisa ya Galatia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaendeleza orodha ya watumaji iliyoanza katika mstari wa 1; herufi ndogo inadumisha mwendelezo huo.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: ndugu wote walio pamoja nami
  rationale: Katika muktadha huu, “ndugu” ni neno la kawaida la Kiswahili kwa waamini wenzao na linaweza kuwahusu wanaume na wanawake bila kulazimisha jinsia ambayo Kiswahili haiibainishi hapa. “Walio pamoja nami” linaonyesha watu waliokuwa pamoja na Paulo.
- source_word: ἐκκλησίαις
  choice: makanisa
  rationale: “Makanisa” ni neno la kawaida na linaloeleweka kwa jumuiya za waamini zinazotajwa katika salamu za barua za Paulo.
- source_word: τῆς Γαλατίας
  choice: ya Galatia
  rationale: 'Muundo huu unaakisi uhusiano wa hali ya kumiliki katika Kigiriki na ni wa kawaida katika Kiswahili: makanisa ya eneo la Galatia.'
theological_decisions:
- issue: Ujumuishaji wa jinsia katika ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Ingawa ἀδελφοί ni wingi wa kisarufi wa kiume, katika matumizi ya Kikristo inaweza kumaanisha waamini wenzao wa jinsia zote. Neno la Kiswahili “ndugu” linahifadhi uwezekano huo kwa kawaida bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Sentensi imeachwa kama mwendelezo wa mstari uliotangulia, kwa hiyo inaanza kwa herufi ndogo na kuishia kwa nukta mbili kama katika chanzo.
