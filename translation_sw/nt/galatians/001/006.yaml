id: GAL.1.6
reference: Galatians 1:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: sw
  text: Ninashangaa kwamba mnamwacha haraka hivyo yule aliyewaita katika neema ya Masihi[a], na kuigeukia injili tofauti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa neema ya Masihi.” Kihusishi cha Kigiriki kinaweza kumaanisha kuwa ndani ya neema hiyo au kuitwa kwa njia ya neema hiyo.
    reason: alternative_reading
  - marker: b
    text: Au, “injili nyingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Ninashangaa
  rationale: Neno hili ni la kawaida na la sasa, lakini bado linaonyesha mshangao wenye masikitiko katika sauti ya Paulo.
- source_word: οὕτως ταχέως
  choice: haraka hivyo
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unasisitiza kasi ya kugeuka kwao iliyomshangaza Paulo.
- source_word: μετατίθεσθε
  choice: mnamwacha ... na kuigeukia
  rationale: Kitenzi hiki kinaonyesha kuhama au kuasi; muundo huu unaweka wazi kuachwa kwa mtu aliyewaita na kuelekea ujumbe tofauti bila kuifanya kuwa hoja ya mawazo tu.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: yule aliyewaita
  rationale: Huhifadhi rejeo la tendo la awali la kuita bila kumtaja moja kwa moja mhusika ambaye Kigiriki kimemwacha bila kutajwa.
- source_word: ἐν χάριτι Χριστοῦ
  choice: katika neema ya Masihi
  rationale: 'Hufuata kwa uwazi ἐν pamoja na hali ya dative, huku tanbihi ikihifadhi uwezekano wa maana ya njia: ‘kwa neema.’'
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός ina thamani ya cheo; ‘Masihi’ huhifadhi maana hiyo kwa Kiswahili cha kawaida cha kibiblia.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: na kuigeukia injili tofauti
  rationale: ‘Kuigeukia’ huonyesha mwendo unaodokezwa na εἰς, na ‘tofauti’ huakisi ἕτερον pamoja na utofautishaji unaoendelea katika mstari unaofuata.
theological_decisions:
- issue: Utambulisho wa yule aliyewaita
  choice: yule aliyewaita
  alternative: Mungu aliyewaita; Masihi aliyewaita
  rationale: Kigiriki hakimtaji mhusika waziwazi katika kifungu hiki; tafsiri haiongezi jina na hivyo huhifadhi mvutano wa kifasiri.
- issue: Maana ya ἐν katika ἐν χάριτι Χριστοῦ
  choice: katika neema ya Masihi
  alternative: kwa neema ya Masihi
  rationale: ‘Katika’ huhifadhi maana ya mazingira au nyanja, huku uwezekano wa njia au chombo ukitolewa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnamwacha’ hudumisha nguvu ya uasi wa kimahusiano, na ‘Masihi’ hutumiwa kama cheo. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
