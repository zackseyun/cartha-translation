lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Ni neno la kawaida na lenye uzito wa kitheolojia katika baraka na salamu za mitume; linahifadhi maana ya fadhili ya Mungu inayotolewa bila kustahiliwa.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Huwasilisha kihusishi cha Kigiriki kwa namna ya kawaida katika kauli ya baraka ya Kiswahili.
- source_word: εἰρήνη
  choice: amani
  rationale: Linahifadhi maana ya msingi pamoja na wazo pana la hali njema na upatanisho.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Huonyesha chanzo cha neema na amani kwa Kiswahili cha kawaida.
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba yetu
  rationale: Muundo huu ni wa asili na wenye heshima katika Kiswahili, na unaonyesha kuwa Mungu ndiye Baba yetu.
- source_word: κυρίου
  choice: Bwana
  rationale: Linahifadhi hadhi ya heshima na uzito wa kikristo wa cheo hiki katika Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Masihi hutafsiri Χριστός kama cheo cha Mtiwa-Mafuta badala ya kukifanya kionekane kama jina la ukoo; muundo huu ni wa kawaida katika Kiswahili bila kuhitaji neno la ziada linalolingana na kibainishi, ambacho hakipo katika Kigiriki.
theological_decisions:
- issue: Iwapo Χριστοῦ itafsiriwe kama cheo au ihifadhiwe kwa umbo la jadi “Kristo”
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Katika salamu hii Χριστός bado ina nguvu ya cheo cha Mtiwa-Mafuta. “Masihi” huonyesha maana hiyo wazi, huku umbo la jadi “Kristo” likihifadhiwa katika tanbihi.
- issue: Uhusiano wa ἡμῶν na majina ya Baba na Bwana
  choice: Mungu Baba yetu na kwa Bwana wetu
  alternative: Mungu Baba na kwa Bwana wetu
  rationale: Ingawa nafasi ya ἡμῶν iko karibu moja kwa moja na κυρίου, muktadha wa salamu za Paulo na matumizi ya kawaida yanaunga mkono kuelewa ubaba wa Mungu kuwa unawahusu waamini; tafsiri hii pia inafuata maana inayowasilishwa kwa kawaida bila kuficha kuwa Yesu ni Bwana wetu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Kitenzi “ziwe” kimeongezwa kwa ulaini wa kauli ya baraka, kwa kuwa Kigiriki kina kishazi kisicho na kitenzi wazi. “Na kwa Bwana” hurudia kihusishi kwa uwazi na ufasaha wa Kiswahili.
