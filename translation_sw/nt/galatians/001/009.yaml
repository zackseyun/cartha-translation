id: GAL.1.9
reference: Galatians 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: sw
  text: 'Kama tulivyokwisha kusema, sasa nasema tena: mtu yeyote akiwahubiria injili iliyo kinyume na ile mliyoipokea[a], na alaaniwe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyo zaidi ya ile mliyoipokea”; kirai hiki kinaweza kumaanisha kupotoka kutoka kwa ujumbe uliopokewa.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “na awe chini ya laana.” Kigiriki: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Kama tulivyokwisha kusema
  rationale: Huwasilisha jambo lililosemwa awali na ambalo bado lina uzito sasa, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἄρτι πάλιν λέγω
  choice: sasa nasema tena
  rationale: “Sasa” huhifadhi wazo la wakati wa sasa katika ἄρτι, na “tena” huhifadhi urudiaji wa πάλιν.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: mtu yeyote akiwahubiria injili
  rationale: Kitenzi cha masharti “akiwahubiria” ni cha asili katika Kiswahili na hudumisha maana ya kumtangazia mtu ujumbe wa injili.
- source_word: παρ’ ὃ
  choice: iliyo kinyume na ile
  rationale: Katika muktadha huu παρά huonyesha kupotoka kutoka kwa ujumbe uliopokewa; “kinyume na” huhifadhi nguvu ya upinzani bila kuficha uwezekano wa maana ya “zaidi ya,” unaotajwa katika tanbihi.
- source_word: παρελάβετε
  choice: mliyoipokea
  rationale: “Kupokea” ni neno la kawaida na sahihi kwa kupokea ujumbe au mapokeo.
- source_word: ἀνάθεμα ἔστω
  choice: na alaaniwe
  rationale: Huhifadhi nguvu ya tamko la hukumu au laana kwa namna fupi, ya asili, na yenye uzito; tanbihi hufafanua uwezekano wa kutafsiri hali ya kuwa chini ya laana.
theological_decisions:
- issue: Nguvu na mhusika wa laana katika ἀνάθεμα ἔστω
  choice: na alaaniwe
  alternative: na awe chini ya laana
  rationale: Tafsiri inadumisha ukali wa onyo la Paulo bila kuongeza wazi “ya Mungu,” jambo ambalo halijasemwa moja kwa moja katika kifungu hiki.
- issue: Uhusiano wa injili nyingine na ujumbe uliopokewa katika παρ’ ὃ
  choice: iliyo kinyume na ile mliyoipokea
  alternative: iliyo zaidi ya ile mliyoipokea
  rationale: Muktadha unaunga mkono wazo la ujumbe unaokengeuka au kupingana na injili iliyopokewa, huku tanbihi ikihifadhi upana wa kisemantiki wa παρά.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti umetolewa kwa “aki-,” na ukali wa onyo umehifadhiwa bila kutumia msamiati wa kimadhehebu.
