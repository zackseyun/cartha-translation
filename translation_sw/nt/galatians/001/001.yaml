source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: sw
  text: Paulo, mtume—si kutoka kwa wanadamu wala kupitia mwanadamu, bali kupitia Yesu Masihi[a] na Mungu Baba, aliyemfufua Yesu kutoka kwa wafu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: mtume
  rationale: Neno “mtume” ni istilahi ya kawaida ya Kiswahili kwa mtu aliyetumwa na kupewa mamlaka maalumu; linahifadhi hadhi ya utume wa Paulo kuliko neno la jumla kama “mjumbe.”
- source_word: ἀπ’ ἀνθρώπων
  choice: kutoka kwa wanadamu
  rationale: Kihusishi ἀπό pamoja na umilikishi huonyesha chanzo. “Wanadamu” linahifadhi wingi na kuandaa utofautishaji na umoja unaofuata.
- source_word: δι’ ἀνθρώπου
  choice: kupitia mwanadamu
  rationale: διά pamoja na umilikishi huonyesha wakala au njia. Umoja wa “mwanadamu” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa kimantiki unaotofautisha wingi na umoja.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kupitia Yesu Masihi
  rationale: “Kupitia” linaonyesha uwakala uliomo katika διά. “Masihi” linahifadhi nguvu ya Χριστός kama cheo, huku mbadala wa jadi “Kristo” ukitajwa katika tanbihi.
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba
  rationale: Hii ni namna ya kawaida, yenye heshima na iliyo wazi ya kutafsiri cheo hiki katika Kiswahili.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: aliyemfufua kutoka kwa wafu
  rationale: Kirai hiki kinamfafanua Mungu Baba na kinatoa dai la ufufuo kwa lugha ya kawaida ya Kiswahili bila kupanua maana ya Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika salamu hii neno linaweza kusikika kama cheo chenye maana, si jina la ukoo tu. “Masihi” huonyesha maana hiyo wazi; “Kristo” imehifadhiwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- issue: Chanzo na uwakala wa utume wa Paulo
  choice: Kuhifadhi tofauti kati ya “kutoka kwa wanadamu,” “kupitia mwanadamu,” na “kupitia Yesu Masihi na Mungu Baba”
  alternative: Kurahisisha yote kuwa “si kwa mamlaka ya watu bali kwa mamlaka ya Mungu”
  rationale: Muundo wa Kigiriki unatofautisha chanzo na uwakala na pia wingi na umoja. Tafsiri haipaswi kufuta msisitizo huo au kuingiza ufafanuzi wa kiteolojia usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Alama ya vistari imetumika kwa sababu mstari huu ni mwanzo wa sentensi inayoendelea katika mstari unaofuata. Muundo wa wingi “wanadamu” na umoja “mwanadamu” umehifadhiwa kwa makusudi.
