  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: sw
  text: Kwa maana mmesikia habari za mwenendo wangu wa zamani katika dini ya Kiyahudi, kwamba nilikuwa nikilitesa kanisa la Mungu kupita kiasi na kuliharibu vibaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuliharibu” au “kujaribu kuliangamiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: mwenendo wangu wa zamani
  rationale: Kirai hiki kinaeleza kwa upana namna Paulo alivyoishi na kutenda hapo awali; “mwenendo wangu wa zamani” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἰουδαϊσμῷ
  choice: katika dini ya Kiyahudi
  rationale: Neno hili hapa linarejelea utambulisho na mfumo wa maisha ya kidini ya Kiyahudi. Tafsiri hii ni wazi zaidi kwa wasomaji wa kawaida kuliko kutumia jina la kiufundi pekee.
- source_word: καθ’ ὑπερβολὴν
  choice: kupita kiasi
  rationale: Kirai hiki kinasisitiza kiwango kisicho cha kawaida cha mateso aliyoyafanya Paulo.
- source_word: ἐδίωκον
  choice: nilivyolitesa
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea zamani; muundo “jinsi nilivyolitesa” unaonyesha mwenendo wa kudumu katika Kiswahili cha kawaida.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: kanisa la Mungu
  rationale: “Kanisa” ndilo neno la kawaida na linaloeleweka kwa jumuiya ya waumini inayorejelewa hapa.
- source_word: ἐπόρθουν
  choice: kujaribu kuliangamiza
  rationale: Kitenzi kina nguvu ya kuharibu au kuteketeza. Muundo huu unahifadhi uwezekano wa maana ya jitihada zinazoendelea bila kudai kwamba Paulo alifanikiwa kuliangamiza.
theological_decisions:
- issue: Kutafsiri ἐκκλησία kama “kanisa” au “kusanyiko”
  choice: kanisa la Mungu
  alternative: kusanyiko la Mungu
  rationale: Katika muktadha huu neno linarejelea jumuiya inayotambulika ya waumini wa Kristo; “kanisa” linawasilisha maana hiyo kwa kawaida bila kuongeza dai jingine la kimadhehebu.
- issue: Nguvu na matokeo ya ἐπόρθουν
  choice: kujaribu kuliangamiza
  alternative: kuliharibu vibaya
  rationale: Kigiriki kinaonyesha shughuli ya uharibifu iliyoendelea, lakini hakilazimishi hitimisho kwamba lengo lilitimizwa. Tafsiri iliyochaguliwa inalinda tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umetunza msisitizo wa mateso makali na hali ya matendo yaliyoendelea zamani.
