  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: sw
  text: Na mambo ninayowaandikia—tazama[a], mbele za Mungu[b], sisemi uongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “angalia.” Neno la Kigiriki linatoa msisitizo mzito.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwepo wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: mambo
  rationale: Kiwakilishi cha uhusiano cha wingi kisicho na jinsia kinarejelea mambo ambayo Paulo anaandika; ‘mambo’ ni ya kawaida na huhifadhi wazo la wingi.
- source_word: δὲ
  choice: lakini
  rationale: δέ hapa ni kiunganishi chepesi chenye uwezekano wa kuonyesha tofauti au mpito; ‘lakini’ huhifadhi thamani yake bila kuongeza neno la wakati lisilokuwapo katika Kigiriki.
- source_word: γράφω ὑμῖν
  choice: ninayowaandikia
  rationale: Muundo huu wa sasa unaonyesha anayofanya Paulo katika barua na kwa kawaida katika Kiswahili hujumuisha wapokeaji kwa kiambishi -wa-.
- source_word: ἰδοὺ
  choice: tazama
  rationale: ‘Tazama’ linawakilisha wazi chembe ya msisitizo ἰδού na linafaa katika lugha yenye hadhi, ingawa hapa si amri halisi ya kutazama kwa macho.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuwapo na kuwajibika mbele ya Mungu katika dai hili zito.
- source_word: ὅτι
  choice: '[halijatafsiriwa kando]'
  rationale: ὅτι huanzisha maudhui ya dai; alama za uandishi na mpangilio wa sentensi huwasilisha kazi hiyo kwa Kiswahili bila ‘kwamba’ ya lazima.
- source_word: οὐ ψεύδομαι
  choice: sisemi uongo
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa Kiswahili unaohifadhi ukanushaji wa wakati wa sasa.
theological_decisions:
- issue: Nguvu ya Paulo kumwita Mungu kuwa shahidi wa ukweli wake
  choice: ‘mbele za Mungu, sisemi uongo’ limetolewa kama dai zito chini ya uangalizi wa Mungu.
  alternative: Kulitoa kama kiapo rasmi, au kama msisitizo wa kawaida tu.
  rationale: ἐνώπιον τοῦ θεοῦ huonyesha uwajibikaji mbele za Mungu na kulitia nguvu dai la Paulo, lakini maandishi hayasemi kwa uwazi kwamba ni kiapo rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi msisitizo wa ἰδού, uzito wa dai mbele za Mungu, na tofauti nyepesi inayoweza kuletwa na δέ.
