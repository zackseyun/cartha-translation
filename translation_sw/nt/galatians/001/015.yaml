lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... alipo-
  rationale: Muundo huu unahifadhi maana ya wakati ya ὅτε na ugeukaji mdogo wa δέ, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: εὐδόκησεν
  choice: alipoona vema
  rationale: Huwasilisha wazo la kupendezwa au kuona jambo kuwa jema bila kulifanya kuwa uamuzi wa kawaida tu; kishazi kinaendelea katika mstari unaofuata.
- source_word: ὁ ἀφορίσας με
  choice: yule aliyenitenga
  rationale: Huhifadhi muundo wa kirai cha Kigiriki na wazo la kutengwa kwa kusudi maalumu, bila kuingiza kwa nguvu maana ya ‘alinichagua’ au ‘aliniweka rasmi.’
- source_word: ἐκ κοιλίας μητρός μου
  choice: tangu tumboni mwa mama yangu
  rationale: Huhifadhi taswira halisi ya tumbo la mama na mwangwi wa lugha ya wito wa kinabii.
- source_word: καλέσας
  choice: kuniita
  rationale: ‘Kuniita’ ni tafsiri ya kawaida na pana, inayoweza kubeba wito wa Mungu bila ufafanuzi wa ziada.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: kwa neema yake
  rationale: Katika Kiswahili, ‘kwa neema yake’ huonyesha kwa kawaida neema kuwa njia au msingi wa wito, sawasawa na διά pamoja na jenitivi.
theological_decisions:
- issue: Ikiwa ἀφορίσας itafsiriwe kwa maneno yanayosisitiza fundisho maalumu la kuchaguliwa tangu awali
  choice: aliyenitenga
  alternative: aliyenichagua; aliyeniweka rasmi
  rationale: Kigiriki kinaonyesha kutengwa kwa kusudi katika mazingira ya wito wa kinabii, lakini hakilazimishi hapa istilahi pana zaidi ya kimafundisho.
- issue: Ikiwa mtendaji atajwe wazi kuwa Mungu
  choice: yule aliyenitenga
  alternative: Mungu, aliyenitenga
  rationale: Ingawa muktadha unaonyesha kwamba mtendaji ni Mungu, neno ‘Mungu’ halipo wazi katika mstari huu; muundo huu unahifadhi namna ya usemi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa kama kishazi kinachoendelea katika mstari wa 16; kistari kirefu kinaashiria mwendelezo huo bila kukamilisha wazo ambalo chanzo hakikamilishi hapa.
