  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: sw
  text: Lakini sikumwona mtume mwingine yeyote, isipokuwa Yakobo[a], ndugu wa Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikumwona mtume mwingine yeyote—Yakobo tu, ndugu wa Bwana.” Wengine huelewa maneno haya kuwa hayamhesabu Yakobo kuwa miongoni mwa mitume.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: yeyote mwingine
  rationale: Katika muundo huu unaotaja mmoja kutoka katika kundi la mitume, ἕτερον humaanisha mwingine katika kundi hilo; “yeyote mwingine” ni Kiswahili cha kawaida pamoja na ukanushaji.
- source_word: δέ
  choice: Lakini
  rationale: δέ huonyesha tofauti ndogo au hatua mpya katika hoja; “Lakini” inaunganisha sentensi hii kwa kufaa na maelezo yaliyotangulia.
- source_word: τῶν ἀποστόλων
  choice: miongoni mwa mitume
  rationale: Huhifadhi wazi wazo la sehemu ya kundi lililo katika muundo wa Kigiriki. “Mitume” ni istilahi iliyozoeleka kwa ἀπόστολοι katika muktadha huu.
- source_word: οὐκ εἶδον
  choice: sikumwona
  rationale: Hutoa ukanushaji wa tendo la wakati uliopita kwa Kiswahili cha kawaida; umoja wa kitu huendana na ἕτερον.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hapa kifungu hiki kinaonyesha ubaguzi, si sharti; “isipokuwa” ndilo neno la asili zaidi katika Kiswahili.
- source_word: Ἰάκωβον
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina Ἰάκωβος katika Biblia za Kiswahili.
- source_word: ἀδελφὸν
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya moja kwa moja na ya kawaida ya ἀδελφός katika Kiswahili; muktadha hauhitaji istilahi pana zaidi ya ukoo.
- source_word: τοῦ κυρίου
  choice: wa Bwana
  rationale: Huhifadhi cheo κύριος kwa neno lililozoeleka “Bwana” na kuunda kirai cha kawaida cha umilikaji katika Kiswahili.
theological_decisions:
- issue: Kama Yakobo anahesabiwa miongoni mwa “mitume” katika muundo huu
  choice: Matini kuu inasema kwamba Paulo hakumwona mwingine miongoni mwa mitume isipokuwa Yakobo, hivyo ikihifadhi maana ya kawaida ya kisintaksia kwamba Yakobo ndiye anayetengwa kutoka katika kundi hilo.
  alternative: Wengine huelewa kuwa Paulo hakumwona mtume mwingine zaidi ya Petro, lakini alimwona pia Yakobo bila kumhesabu Yakobo kuwa mtume.
  rationale: Kwa kawaida εἰ μὴ huanzisha ubaguzi kwa kauli “sikumwona yeyote mwingine miongoni mwa mitume.” Tanbihi huhifadhi ufafanuzi mbadala bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “miongoni mwa mitume” umechaguliwa ili kuhifadhi uhusiano wa kisarufi wa Kigiriki, huku sentensi ikiendelea kuwa wazi kwa msomaji wa kawaida.
