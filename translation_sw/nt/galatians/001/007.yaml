  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: sw
  text: ambayo si injili nyingine; isipokuwa kwamba kuna watu fulani wanaowavuruga na kutaka kuipotosha[b] injili ya Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
