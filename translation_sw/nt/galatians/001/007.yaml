lexical_decisions:
- source_word: ἄλλο
  choice: injili nyingine
  rationale: Nomino ‘injili’ inayodokezwa na muktadha wa mstari wa 6 imewekwa wazi kwa Kiswahili cha kawaida, bila kuongeza maana mpya.
- source_word: εἰ μή
  choice: ila tu
  rationale: Hapa kirai hiki kinaanzisha maelezo yenye kuainisha kauli iliyotangulia, si sharti la moja kwa moja; ‘ila tu’ ni cha asili na huhifadhi nguvu hiyo.
- source_word: ταράσσοντες
  choice: wanaowavuruga
  rationale: ‘Kuvuruga’ huonyesha kuwasumbua na kuwatia katika hali ya mkanganyiko, kama kitenzi cha Kigiriki kinavyodokeza katika muktadha huu.
- source_word: θέλοντες
  choice: kutaka
  rationale: Huhifadhi wazi nia ya watu hao bila kuiongeza nguvu kupita kiasi.
- source_word: μεταστρέψαι
  choice: kuipotosha
  rationale: Kitenzi hiki huonyesha kuigeuza injili iwe tofauti na iliyokusudiwa; ‘kuipotosha’ ni neno la sasa, wazi na lenye uzito unaofaa.
- source_word: εὐαγγέλιον
  choice: injili
  rationale: ‘Injili’ ni istilahi iliyozoeleka katika Kiswahili cha Kikristo na inafaa kwa matumizi maalumu ya Paulo hapa.
- source_word: Χριστοῦ
  choice: ya Masihi
  rationale: ‘Masihi’ huhifadhi matumizi ya Χριστός kama cheo na msingi wake wa matarajio ya Kiyahudi; muundo wa ‘ya’ unaacha wazi kwa kiasi fulani ikiwa injili ni yake au inamhusu.
theological_decisions:
- issue: Kutafsiri Χριστοῦ kama cheo au kama jina lililozoeleka
  choice: ya Masihi
  alternative: ya Kristo
  rationale: Katika kirai hiki cheo cha kimasiya bado kina nguvu. ‘Masihi’ huhifadhi hilo bila kuingiza msimamo wa kimadhehebu; ‘Kristo’ ni tafsiri mbadala inayokubalika.
- issue: Uhusiano wa kiimaana katika εὐαγγέλιον τοῦ Χριστοῦ
  choice: injili ya Masihi
  alternative: injili inayomhusu Masihi
  rationale: Muundo wa Kigiriki unaweza kumaanisha injili iliyo ya Masihi au inayomhusu. Muundo wa Kiswahili ‘ya Masihi’ huhifadhi uwezekano huo badala ya kuamua upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ambayo’ unaendeleza sentensi kutoka mstari uliotangulia; ‘ila tu’ hufanya uhusiano wa hoja uwe wa kawaida kwa msomaji wa leo.
