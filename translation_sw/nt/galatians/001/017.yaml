  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: sw
  text: Wala sikupanda kwenda Yerusalemu kwa wale waliokuwa mitume kabla yangu, bali niliondoka kwenda Arabia, kisha nikarudi tena Damasko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala siku-
  rationale: “Wala” linaendeleza ukanushaji wa muktadha uliotangulia na kuunganisha sentensi hii kwa kawaida katika Kiswahili.
- source_word: ἀνῆλθον
  choice: kupanda kwenda
  rationale: Linahifadhi usemi wa kawaida wa kusafiri kwenda juu Yerusalemu, badala ya kuufanya kuwa dai la kiroho.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: kwa wale waliokuwa mitume kabla yangu
  rationale: Linahifadhi kuelekea kwa watu hao na maana ya kipaumbele cha wakati, bila kudokeza kuwa walikuwa na cheo cha juu kuliko Paulo.
- source_word: ἀλλὰ
  choice: bali
  rationale: Linaonyesha kwa wazi utofautishaji kati ya kutokwenda Yerusalemu na kwenda Arabia.
- source_word: ἀπῆλθον
  choice: niliondoka kwenda
  rationale: Linadumisha wazo la kuondoka kuelekea mahali pengine lililomo katika kitenzi chenye kiambishi ἀπ-.
- source_word: Ἀραβίαν
  choice: Arabia
  rationale: Ni jina la kawaida la eneo hilo; aya haibainishi mipaka yake ya kihistoria.
- source_word: πάλιν
  choice: tena
  rationale: Linaonyesha kwamba Paulo alirudi Damasko baada ya kwenda Arabia.
- source_word: ὑπέστρεψα
  choice: nikarudi
  rationale: Ni tafsiri ya kawaida na fasaha ya tendo la kurudi katika muktadha wa safari.
- source_word: Δαμασκόν
  choice: Damasko
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya “kabla yangu” kuhusu mitume
  choice: Walikuwa mitume mapema kuliko Paulo
  alternative: Walikuwa na cheo cha juu kuliko Paulo
  rationale: πρὸ ἐμοῦ kwa kawaida huonyesha kipaumbele cha wakati. Tafsiri haiongezi dai lolote kuhusu ukuu wa cheo au mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umebaki karibu na hoja ya Kigiriki huku ukitumia mfuatano wa vitenzi unaosikika kwa kawaida katika Kiswahili.
