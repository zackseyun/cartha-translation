base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: sw
  text: Nami nilikuwa nikipiga hatua katika dini ya Kiyahudi kuliko wengi wa rika langu miongoni mwa watu wangu,[a] huku nikiwa na bidii kubwa zaidi kwa mapokeo ya mababu zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika Uyahudi”; neno hilo laweza kumaanisha dini ya Kiyahudi au, kwa upana zaidi, mfumo wa maisha ya Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: nilikuwa nikipiga hatua
  rationale: Huwasilisha tendo lililokuwa likiendelea wakati uliopita na maana ya kuendelea au kustawi, bila kulifanya kuwa dai la kufanikiwa kupita kiasi.
- source_word: Ἰουδαϊσμῷ
  choice: dini ya Kiyahudi
  rationale: Ni Kiswahili cha kawaida na kinachoeleweka kwa mfumo wa kidini unaorejelewa hapa; maana pana ya mwenendo wa maisha ya Kiyahudi imeonyeshwa katika tanbihi.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: kuliko wengi wa rika langu
  rationale: Huhifadhi ulinganisho wa ὑπέρ na wazo la watu wa umri mmoja katika συνηλικιώτας kwa Kiswahili asilia.
- source_word: ἐν τῷ γένει μου
  choice: miongoni mwa watu wangu
  rationale: γένος hapa yaweza kuashiria jamii ya ukoo, taifa, au watu; kauli hii ni wazi bila kuingiza dhana ya kisasa ya rangi.
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: huku nikiwa na bidii kubwa zaidi
  rationale: Huhifadhi muundo wa kishiriki na nguvu ya ulinganisho, huku ikiepuka neno linaloweza kueleweka kisiasa kama 'mwanaharakati mkali'.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: kwa ajili ya mapokeo ya mababu zangu
  rationale: Huhifadhi maana ya mapokeo yaliyorithiwa kutoka kwa waliotangulia na ni usemi wa sasa, wenye heshima, na wa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wakati uliopita unaoendelea umehifadhiwa katika “nilikuwa nikipiga hatua,” na ulinganisho umeelezwa kwa lugha ya kawaida. Alama ya tanbihi [a] ipo katika matini kuu.
