source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: sw
  text: ambaye alijitoa mwenyewe kwa ajili ya dhambi zetu, ili atuokoe kutoka katika enzi hii mbaya ya sasa[a], kulingana na mapenzi ya Mungu wetu aliye Baba yetu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu huu mbaya wa sasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτὸν
  choice: alijitoa mwenyewe
  rationale: Kitenzi ‘jitoa’ kinaeleza kwa Kiswahili cha kawaida kwamba Kristo alitoa nafsi yake kwa hiari, bila kuongeza wazo maalumu la kukabidhiwa.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: kwa ajili ya dhambi zetu
  rationale: ‘Kwa ajili ya’ huhifadhi maana ya uwakilishi au kusudi la ukombozi bila kufafanua zaidi namna ya upatanisho kuliko Kigiriki kinavyofanya.
- source_word: ἐξέληται
  choice: atuokoe
  rationale: Katika muktadha huu, ‘atuokoe kutoka’ huonyesha kuondolewa katika hali au mamlaka yenye hatari; ni usemi wa asili katika Kiswahili.
- source_word: αἰῶνος
  choice: enzi
  rationale: ‘Enzi’ huwasilisha maana ya kipindi au mpangilio wa wakati kuliko ‘ulimwengu,’ ambao unaweza kueleweka hasa kama mahali au uumbaji wa kimwili.
- source_word: ἐνεστῶτος πονηροῦ
  choice: hii ya sasa iliyo ovu
  rationale: Maneno haya yanaonyesha enzi inayokuwapo sasa na kuieleza kuwa na uovu wa kimaadili. ‘Ovu’ linakubaliana na nomino ‘enzi.’
- source_word: κατὰ τὸ θέλημα
  choice: kulingana na mapenzi
  rationale: Usemi huu unaonyesha kwamba tendo hilo linapatana na kusudi la Mungu.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: ya Mungu wetu na Baba yetu
  rationale: Muundo huu huhifadhi majina yote mawili na unaonyesha kwa kawaida kwamba yanamtaja mtu yuleyule.
theological_decisions:
- issue: Iwapo ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ifafanuliwe kwa namna inayoweka nadharia maalumu ya upatanisho
  choice: kwa ajili ya dhambi zetu
  alternative: kwa sababu ya dhambi zetu
  rationale: Chaguo hili huhifadhi uzito wa ukombozi na uwakilishi huku likiepuka kuamua utaratibu maalumu wa upatanisho ambao mstari wenyewe haufafanui.
- issue: Iwapo αἰών itafsiriwe kama kipindi au kama ulimwengu
  choice: enzi hii ya sasa iliyo ovu
  alternative: ulimwengu huu wa sasa ulio mwovu
  rationale: αἰών ina maana ya msingi ya kipindi au mpangilio wa wakati; ‘enzi’ huhifadhi maana hiyo ya kitambo na ya kiulimwengu bila kuifanya kuwa mahali tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Alijitoa mwenyewe’ na ‘atuokoe’ ni misemo ya sasa na ya asili; ‘enzi’ huhifadhi tofauti ya maana kati ya αἰών na ulimwengu wa kimwili.
