  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: sw
  text: Kisha nikaenda katika maeneo ya Siria na Kilikia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenda kwenye maeneo ya Siria na Kilikia.”
    reason: lexical_alternative
  - marker: b
    text: Au “wilaya” badala ya “maeneo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Kisha
  rationale: Huonyesha hatua inayofuata katika simulizi la Paulo kwa Kiswahili cha kawaida na cha heshima.
- source_word: ἦλθον
  choice: nikaenda
  rationale: Ingawa kitenzi kinaweza kutafsiriwa kwa msingi kuwa “nilikuja,” katika muktadha huu kinaeleza safari kutoka mahali Paulo alipokuwa; “nikaenda” ni ya asili katika Kiswahili na kiambishi -ka- kinaendeleza mfuatano wa simulizi.
- source_word: εἰς
  choice: katika
  rationale: Huwasilisha mwendo unaoelekea ndani ya maeneo hayo kwa njia ya kawaida katika Kiswahili.
- source_word: κλίματα
  choice: maeneo
  rationale: Neno hilo linarejelea sehemu au majimbo ya kijiografia, si mji mmoja; “maeneo” ni wazi na la kawaida.
- source_word: Συρίας
  choice: Siria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hilo la mahali.
- source_word: Κιλικίας
  choice: Kilikia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hilo la mahali.
