  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: sw
  text: Lakini makanisa ya Yudea yaliyo katika Masihi[b] hayakunijua kwa sura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hayakunitambua kwa kuniona” au “hayakunijua binafsi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautishaji mdogo na kauli iliyotangulia; “Lakini” kinaonyesha mwendo huo wa habari kwa Kiswahili cha kawaida.
- source_word: ἀγνοούμενος
  choice: hayakunijua
  rationale: Hali hii ina maana ya kutojulikana au kutotambuliwa. Muundo wa Kiswahili wenye makanisa kama kiima ni wa asili na unadumisha maana kwamba Paulo hakuwa akijulikana kwao.
- source_word: τῷ προσώπῳ
  choice: kwa sura
  rationale: Kirai hiki kinahusu kutomjua mtu kwa kumwona au kumtambua uso kwa uso. “Kwa sura” kinahifadhi picha ya uso na ni kifupi, huku tanbihi ikitaja njia nyingine za kueleza maana hiyo.
- source_word: ἐκκλησίαις
  choice: makanisa
  rationale: Katika muktadha wa Paulo neno hili linamaanisha jumuiya za waamini; “makanisa” ndilo neno la kawaida na linaloeleweka katika Kiswahili cha kisasa.
- source_word: Ἰουδαίας
  choice: Uyahudi
  rationale: Hili ni jina la kawaida la kibiblia la eneo la Yudea katika Kiswahili cha Afrika Mashariki.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός lina nguvu ya cheo cha Mtiwa-Mafuta hapa, na kirai hiki kinatambulisha makanisa kwa uhusiano wao na Masihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστῷ katika kirai ἐν Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi wazi maana ya cheo cha Mtiwa-Mafuta bila kuondoa maana pana ya kirai “katika Masihi.” “Kristo” limetolewa kama tafsiri mbadala ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili kwa kuyaweka “makanisa” kama kiima, bila kubadili uhusiano wa maana katika Kigiriki.
