base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: sw
  text: 'Kwa maana kutoka ndani ya mioyo ya watu hutoka mawazo maovu: uasherati[a], wizi, mauaji,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ni wingi, likimaanisha matendo mbalimbali ya uasherati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: kutoka ndani
  rationale: Inahifadhi wazo la chanzo cha ndani na tofauti yake na mambo ya nje katika muktadha.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu au maelezo ya kauli iliyotangulia.
- source_word: καρδίας
  choice: moyo
  rationale: Ni istilahi ya kawaida ya kibiblia kwa kitovu cha ndani cha mawazo, nia na maamuzi ya kimaadili.
- source_word: ἀνθρώπων
  choice: watu
  rationale: Hapa wingi wa Kigiriki unawahusu wanadamu kwa ujumla; “watu” ni Kiswahili cha kawaida na kisichobana maana kwa jinsia moja.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: mawazo maovu
  rationale: Inatoa kwa uwazi fikira au tafakuri za ndani zenye ubaya wa kimaadili.
- source_word: ἐκπορεύονται
  choice: hutoka
  rationale: Wakati wa sasa unaeleza jambo la kawaida, na kitenzi kinadumisha taswira ya mambo kutoka ndani.
- source_word: πορνεῖαι
  choice: uasherati
  rationale: Neno hili linafunika kwa upana matendo ya ngono yasiyo halali; Kiswahili kwa kawaida hutumia nomino ya jumla isiyohesabika ingawa Kigiriki ni wingi.
- source_word: κλοπαί
  choice: wizi
  rationale: Ni neno la kawaida la Kiswahili kwa vitendo vya kuiba; umbo la jumla ni la asili zaidi kuliko wingi usiozoeleka.
- source_word: φόνοι
  choice: mauaji
  rationale: Linabeba maana ya kuua watu kinyume cha haki katika orodha hii ya maovu.
theological_decisions:
- issue: Maana ya ἀνθρώπων katika kauli ya jumla kuhusu moyo
  choice: watu
  alternative: wanadamu; wanaume
  rationale: Neno la Kigiriki ni la kiume kisarufi lakini hapa linarejelea binadamu wote. “Watu” huhifadhi ujumla huo kwa Kiswahili cha kawaida bila kuifanya kauli iwahusu wanaume pekee.
- issue: Utoaji wa πορνεῖαι
  choice: uasherati
  alternative: matendo ya uasherati; maovu ya kingono
  rationale: “Uasherati” ni neno pana na linaloeleweka kwa mwenendo haramu wa kingono bila kulibana kwa aina moja. Tanbihi inaonyesha kwamba Kigiriki ni wingi wa matendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. Muundo “kutoka ndani, katika moyo wa watu” umehifadhi marudio ya chanzo yaliyomo katika Kigiriki. Nomino za orodha zimetolewa kwa maumbo ya kawaida ya Kiswahili; alama ya tanbihi imewekwa baada ya “uasherati” ili kufafanua wingi wa Kigiriki.
