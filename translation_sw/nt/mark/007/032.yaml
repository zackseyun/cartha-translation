  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: sw
  text: Wakamletea mtu aliyekuwa kiziwi na mwenye shida ya kusema, wakamsihi aweke mkono wake juu yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: Wakamletea
  rationale: Wakati uliopo wa kihistoria ni wa kawaida katika simulizi la Marko; wakati uliopita wa Kiswahili unasimulia tukio hilo kwa kawaida na kuhifadhi mfuatano wake.
- source_word: αὐτῷ
  choice: -m- katika “wakamletea”
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja kimeunganishwa kiasili katika kitenzi cha Kiswahili na kumrejelea Yesu.
- source_word: κωφόν
  choice: mtu aliyekuwa kiziwi
  rationale: κωφός hapa inaelekea kumaanisha kutosikia, kwa kuwa μογιλάλον inaeleza tatizo la kusema kando. Uundaji huu pia unamtaja mtu kabla ya hali yake.
- source_word: μογιλάλον
  choice: mwenye shida ya kusema
  rationale: Neno hili adimu humaanisha mtu anayesema kwa shida, si lazima asiyeweza kusema kabisa. Tafsiri hii huepuka kuzidisha maana kuwa “bubu.”
- source_word: παρακαλοῦσιν
  choice: wakamsihi
  rationale: Katika muktadha huu kitenzi kinaonyesha ombi la dhati, lenye nguvu kuliko kuomba kwa kawaida.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: aweke mkono wake juu yake
  rationale: Hueleza jambo walilomsihi afanye; “mkono” wa umoja huhifadhi τὴν χεῖρα, na usemi huo unaeleweka kwa kawaida kama ishara ya uponyaji.
theological_decisions:
- issue: Hali ya ulemavu wa mtu huyo
  choice: Anaelezwa kuwa kiziwi na mwenye shida ya kusema, si bubu kabisa.
  alternative: kiziwi na bubu
  rationale: Kutumiwa kwa κωφός pamoja na μογιλάλος kunaonyesha kutosikia na usemi wenye shida. “Bubu” ingezidisha maana ya μογιλάλος na kufuta tofauti iliyopo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwenye shida ya kusema” ni wazi kwa wasomaji wa kawaida bila kutumia istilahi ngumu au yenye unyanyapaa. Hakuna tanbihi iliyohitajika kwa kuwa maana ya Kigiriki imewasilishwa moja kwa moja.
