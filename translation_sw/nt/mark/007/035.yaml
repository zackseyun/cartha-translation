base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: sw
  text: Mara masikio yake yakafunguka[a], kifungo cha ulimi wake kikafunguliwa[b], naye akasema vizuri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikivu wake ukarejeshwa.” Neno la Kigiriki linaweza kumaanisha masikio au uwezo wa kusikia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kifungo cha ulimi wake kikafunguliwa”; yaani, kizuizi chake cha kusema kikaondolewa.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa usahihi,” “ipasavyo,” au “kwa uwazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: yakafunguka
  rationale: Kitenzi hiki ni aoristi tendwa katika Kigiriki. Kiswahili hutumia kwa kawaida umbo la hali lisilo la kutendwa moja kwa moja, “yakafunguka,” kueleza urejesho wa ghafla wa uwezo wa kusikia.
- source_word: αἱ ἀκοαί
  choice: masikio yake
  rationale: Neno la Kigiriki linaweza kumaanisha masikio au uwezo wa kusikia. Katika simulizi hili la uponyaji, “masikio yake” ni usemi wa kawaida na halisi katika Kiswahili, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἐλύθη
  choice: kikafunguliwa
  rationale: Aoristi tendwa ya λύω ina maana ya kufunguliwa au kuachiliwa. “Kikafunguliwa” hudumisha hali ya kutendwa na kuambatana kwa kawaida na taswira ya kifungo.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: kifungo cha ulimi wake
  rationale: Tafsiri hii huhifadhi sitiari halisi ya δεσμός, yaani kifungo au pingu, bila kuibadili kimyakimya kuwa istilahi ya kitabibu kama “tatizo la kusema.”
- source_word: ἐλάλει
  choice: akaweza kusema
  rationale: Ingawa Kigiriki kinasema moja kwa moja “alisema/alikuwa akisema,” katika Kiswahili muktadha wa kuondolewa kwa kizuizi hufanya “akaweza kusema” iwe ya asili na ieleze uwezo uliorejeshwa bila kudai kwamba alianza kusema kwa mara ya kwanza.
- source_word: ὀρθῶς
  choice: sawasawa
  rationale: ὀρθῶς humaanisha kwa usahihi au ipasavyo. Katika muktadha huu, “sawasawa” hueleza usemi wa kawaida na unaoeleweka bila kudokeza hasa usahihi wa kisarufi au kimaadili.
theological_decisions:
- issue: Iwapo kuwasilisha uponyaji wa usemi kwa sitiari halisi au kwa maelezo ya kitabibu
  choice: Kuhifadhi “kifungo cha ulimi wake kikafunguliwa” katika matini kuu
  alternative: Tatizo lake la kusema likaondolewa; ulimi wake ukawekwa huru
  rationale: Kigiriki kinaeleza muujiza kwa taswira ya kifungo kufunguliwa, si kwa istilahi ya kitabibu. Kuhifadhi sitiari hulinda namna ya usemi ya chanzo na huepuka kuongeza ufafanuzi wa kimadhehebu au kitabibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “Mara …” unaonyesha matokeo ya papo hapo bila kuongeza neno lisilohitajika; “kifungo cha ulimi” huhifadhi taswira ya Kigiriki, na tanbihi zinaonyesha utata halisi wa αἱ ἀκοαί na upana wa maana ya ὀρθῶς.
