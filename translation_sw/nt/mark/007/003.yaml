base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: sw
  text: Kwa maana Mafarisayo na Wayahudi wote hawali isipokuwa wameosha mikono yao kwa ngumi[a], wakishikilia mapokeo ya wazee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kutumia ngumi”; huenda pia ikawa “mpaka kwenye kifundo cha mkono” au “kabisa.” Neno la Kigiriki lina maana yenye utata na inaelekea linarejelea namna fulani ya kimila ya kuosha mikono.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa sentensi hii ni maelezo ya desturi iliyotajwa katika muktadha.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: Wayahudi wote
  rationale: Inahifadhi usemi mpana wa Kigiriki bila kuubana kuwa wakazi wa Uyahudi pekee.
- source_word: ἐὰν μὴ ... οὐκ ἐσθίουσιν
  choice: hawali mpaka
  rationale: Ni muundo wa kawaida wa Kiswahili unaowasilisha sharti hasi la tendo lao la desturi.
- source_word: πυγμῇ
  choice: kwa ngumi
  rationale: Inahifadhi kwa karibu maana ya msingi ya neno hili gumu na lenye ubishi; uwezekano mwingine unaelezwa katika tanbihi.
- source_word: νίψωνται τὰς χεῖρας
  choice: wawe wameosha mikono
  rationale: νίπτω hapa ni kuosha sehemu ya mwili, yaani mikono; hali timilifu baada ya 'mpaka' inaonyesha sharti kabla ya kula.
- source_word: κρατοῦντες
  choice: wakishikilia
  rationale: Inaonyesha kuendelea kuyafuata na kuyadumisha mapokeo kwa uthabiti.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: mapokeo ya wazee
  rationale: Ni tafsiri fupi na ya kawaida ya mafundisho na desturi zilizopokelewa kutoka kwa wazee.
theological_decisions:
- issue: Upeo wa πάντες οἱ Ἰουδαῖοι
  choice: Wayahudi wote
  alternative: Wayahudi wengi; Wayudea wote
  rationale: Kigiriki kinasema wazi 'wote.' Usemi huo mpana umehifadhiwa kama maelezo ya jumla ya Marko bila kuugeuza kimya kimya kuwa dai la kitakwimu kuhusu kila mtu mmoja mmoja.
- issue: Maana ya πυγμῇ
  choice: kwa ngumi, pamoja na tanbihi
  alternative: mpaka kwenye kifundo cha mkono; kwa makini; kabisa
  rationale: Neno hilo lina maana yenye ubishi na huenda linaeleza namna au kiwango cha kunawa kwa kufuata desturi. Tafsiri ya karibu imewekwa katika matini, huku kutokuwa na uhakika kukihifadhiwa katika tanbihi.
- issue: Aina ya kuosha mikono
  choice: kuosha mikono bila kuongeza neno 'kiibada'
  alternative: kuosha mikono kwa desturi ya ibada
  rationale: Muktadha unaonyesha desturi ya kidini, lakini mstari wenyewe hausisitizi wazi kivumishi hicho; hivyo hakijaongezwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa maandiko. 'Mapokeo' limetumiwa kwa παράδοσις, na 'wazee' kwa πρεσβύτεροι. Usemi usio wa kawaida 'kwa ngumi' umehifadhiwa kimakusudi ili kutatua kwa tanbihi badala ya kuficha utata wa chanzo.
