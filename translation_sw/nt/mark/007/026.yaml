base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: sw
  text: Mwanamke huyo alikuwa Mgiriki[a], Msyrofoinike kwa asili[b], naye aliendelea kumwomba amtoe yule pepo kutoka kwa binti yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa Mataifa”; Kigiriki kinasema “Mgiriki,” lakini katika muktadha huu neno hilo yaelekea pia linaonyesha kwamba hakuwa Myahudi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “Msyrofoinike kwa kabila au asili”; yaani, alikuwa wa asili ya Kisyrofoinike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: Mgiriki
  rationale: Huhifadhi maana mahususi ya neno la Kigiriki, huku muktadha ukionyesha pia kwamba mwanamke huyo hakuwa Myahudi; maana hiyo pana imewekwa katika tanbihi.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: Msyrofoinike kwa asili
  rationale: Hutaja asili ya kikabila na kijiografia kwa Kiswahili cha kawaida bila kutumia lugha ya kibayolojia kama ‘kwa rangi’.
- source_word: ἠρώτα
  choice: aliendelea kumwomba
  rationale: Huwakilisha hali endelevu au ya kurudiwa ya wakati usiotimilika, na ‘kumwomba’ huonyesha ombi la heshima bila kuzidisha hisia ya kitenzi.
- source_word: ἵνα ... ἐκβάλῃ
  choice: amtoe
  rationale: Muundo huu unaeleza jambo alilokuwa akiomba; ‘amtoe’ ni wa kawaida na wazi katika muktadha wa kumtoa pepo.
- source_word: τὸ δαιμόνιον
  choice: yule pepo
  rationale: Hufuata moja kwa moja δαιμόνιον badala ya kuibadili kuwa ‘roho mchafu’; kiwakilishi ‘yule’ kinafaa kwa kiumbe maalumu anayerejelewa.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: ndani ya binti yake
  rationale: Pamoja na ‘amtoe,’ kirai hiki huwasilisha kwa Kiswahili dhana halisi ya ἐκ, yaani kutoka ndani ya binti yake.
- source_word: δὲ
  choice: naye
  rationale: Huonyesha mwendelezo mpole wa simulizi bila kuingiza neno la wakati kama ‘sasa’ au kusisitiza tofauti kwa ‘lakini’.
theological_decisions:
- issue: Utambulisho wa kikabila wa mwanamke
  choice: 'Maelezo yote mawili yamehifadhiwa: ‘Mgiriki, Msyrofoinike kwa asili.’'
  alternative: ‘Mtu wa Mataifa, mwenye asili ya Syrofoinike’
  rationale: Matini ina tabaka mbili za utambulisho, yaani Mgiriki na Msyrofoinike kwa asili. Tafsiri haiziunganishi kuwa maelezo moja wala kuondoa upekee wa kihistoria.
- issue: Hali iliyompata binti
  choice: Mama anaomba pepo atolewe ndani ya binti yake.
  alternative: ‘roho mwovu’ au ‘roho mchafu’
  rationale: Tafsiri inadumisha neno dhahiri δαιμόνιον na dai la matini kuhusu pepo bila kulilegeza au kulifasiri upya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye heshima. ‘Msyrofoinike’ huhifadhi jina la kihistoria; ‘aliendelea kumwomba’ huleta aspekti endelevu ya ἠρώτα. Alama zote za tanbihi zinaonekana katika matini kuu.
