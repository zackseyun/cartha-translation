  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: sw
  text: Akawaagiza wasimwambie mtu yeyote. Lakini kadiri alivyoendelea kuwaagiza[a], ndivyo walivyozidi sana kutangaza habari hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kadiri alivyowaamuru, ndivyo walivyozidi kuitangaza” / “waliitangaza zaidi na zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: akawaagiza
  rationale: Kitenzi hiki kinaonyesha kutoa agizo thabiti. ‘Akawaagiza’ ni Kiswahili cha kawaida chenye uzito unaofaa, bila kuongeza wazo la onyo au tishio ambalo halijasemwa wazi.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: wasimwambie mtu yeyote
  rationale: Hiki kinaeleza yaliyomo katika agizo. Usemi huu ni wa kawaida na unaonyesha wazi kwamba hawakupaswa kumweleza mtu yeyote jambo lililotokea.
- source_word: ὅσον ... διεστέλλετο
  choice: kadiri alivyoendelea kuwaagiza
  rationale: Hali ya kitenzi cha Kigiriki inaonyesha agizo lililoendelea au kurudiwa, na ὅσον huunda ulinganisho wa ‘kadiri ... ndivyo ...’.
- source_word: μᾶλλον περισσότερον
  choice: ndivyo walivyozidi sana
  rationale: Maneno haya mawili yanaongeza msisitizo wa kiwango. ‘Walizidi sana’ ni ya asili katika Kiswahili na huhifadhi ongezeko lenye mkazo bila uradidi usio wa kawaida.
- source_word: ἐκήρυσσον
  choice: kutangaza habari hiyo
  rationale: κηρύσσω hapa ni kutangaza hadharani. ‘Habari hiyo’ imewekwa wazi kama yaliyomo yaliyodokezwa na muktadha, bila kuifanya iwe mahubiri ya kidini kwa lazima.
theological_decisions:
- issue: Siri ya Masihi na uzito wa agizo la Yesu
  choice: Agizo limetafsiriwa kama katazo halisi na thabiti, bila kueleza sababu yake.
  alternative: Kutumia ‘aliwaonya vikali’ au kuingiza maelezo ya sababu ya kutaka habari hiyo isienezwe.
  rationale: Mstari unasawiri mvutano kati ya agizo la kutosema na kuendelea kwao kutangaza. Tafsiri inauhifadhi mvutano huo bila kuamua nadharia ya kitheolojia kuhusu nia ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘kadiri ... ndivyo ...’ huhifadhi ulinganisho wa Kigiriki; ‘walizidi sana’ huhifadhi msisitizo wa μᾶλλον περισσότερον kwa namna inayoeleweka kwa wasomaji wa kawaida.
