  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: sw
  text: Hakuna kitu chochote kilicho nje ya mtu ambacho, kikiingia ndani yake, kinaweza kumtia unajisi[a]. Badala yake, mambo yanayotoka ndani ya mtu ndiyo yanayomtia unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumfanya asiwe safi.” Kitenzi cha Kigiriki kinaweza kumaanisha kumfanya mtu asiwe safi kwa mujibu wa masharti ya usafi; hapa “kumtia unajisi” pia hudumisha uzito mpana wa kimaadili katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: hakuna kitu chochote
  rationale: Huwakilisha kwa kawaida na kwa msisitizo nomino kiwakilishi cha umoja kisicho na jinsia, chenye maana ya kutokuwapo hata kitu kimoja.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: kilicho nje ya mtu
  rationale: Huhifadhi tofauti ya kimakusudi kati ya kitu kilicho nje ya mtu na mambo yanayotoka ndani yake.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: kikiingia ndani yake
  rationale: Muundo wa kisharti unaendana vizuri na kishiriki cha Kigiriki kinachoeleza kitu hicho kinapofanya tendo la kuingia ndani ya mtu.
- source_word: δύναται
  choice: kinaweza
  rationale: Hutoa moja kwa moja dhana ya uwezo katika kitenzi cha Kigiriki.
- source_word: κοινῶσαι / κοινοῦντα
  choice: kumtia unajisi / yanayomtia unajisi
  rationale: Katika muktadha wa usafi wa kidini, 'kutia unajisi' huhifadhi maana ya kumfanya mtu asiwe safi huku pia ikiruhusu uzito mpana wa kimaadili wa kifungu.
- source_word: ἀλλὰ
  choice: Badala yake
  rationale: Huonyesha kwa uwazi tofauti yenye kusahihisha kati ya kile kinachoingia na kile kinachotoka.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: mambo yanayotoka ndani ya mtu
  rationale: Huwakilisha wingi wa Kigiriki na huhifadhi ulinganifu wa kimaana na kitu kinachoingia ndani ya mtu.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: mtu
  rationale: '''Mtu'' ni neno la kawaida la Kiswahili kwa ἄνθρωπος anayetumiwa kwa maana ya jumla, bila kuingiza jinsia ambayo muktadha haulengi kuisisitiza.'
theological_decisions:
- issue: Maana ya κοινόω katika mjadala kuhusu usafi
  choice: kutia unajisi
  alternative: kumfanya asiwe safi
  rationale: '''Kutia unajisi'' hudumisha maana ya usafi wa kidini na pia uzito wa kimaadili, bila kufungia kauli katika uchafu wa kiibada pekee.'
- issue: Matumizi ya ἄνθρωπος kwa maana ya jumla
  choice: mtu
  alternative: mwanadamu
  rationale: '''Mtu'' ni ya asili zaidi katika Kiswahili na hudumisha umoja wenye maana ya kumwakilisha mwanadamu yeyote.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha tofauti ya nje/ndani na kuingia/kutoka, huku ikitumia 'mtu' kwa maana ya jumla.
