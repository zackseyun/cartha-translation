base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: sw
  text: matendo ya uzinzi, uchoyo, maovu, udanganyifu, mwenendo usio na aibu, jicho baya[a], matukano[b], kiburi, upumbavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kijicho, choyo au mtazamo wenye nia mbaya; kwa neno halisi, “jicho baya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kufuru.” Neno la Kigiriki linaweza kumaanisha kumtukana mtu au kusema maneno ya kumkufuru Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: matendo ya uzinzi
  rationale: Nomino ya Kigiriki iko katika wingi na inaashiria matendo ya kuvunja uaminifu wa ndoa; msemo huu ni wa kawaida zaidi kwa Kiswahili kuliko kulazimisha wingi wa nomino dhahania.
- source_word: πλεονεξίαι
  choice: tamaa
  rationale: Hueleza hamu ya kujipatia zaidi kwa uchoyo au kwa kuwanyonya wengine; ‘tamaa’ ni neno la kawaida linalofaa katika orodha hii.
- source_word: πονηρίαι
  choice: maovu
  rationale: Huhifadhi wingi wa Kigiriki kwa Kiswahili cha kawaida na kujumuisha maonyesho mbalimbali ya ubaya wa kimaadili.
- source_word: δόλος
  choice: udanganyifu
  rationale: Hueleza hila au udanganyifu wa kukusudia kwa lugha ya sasa inayoeleweka.
- source_word: ἀσέλγεια
  choice: mwenendo usio na aibu
  rationale: Neno hilo lina maana ya tabia iliyopotoka, isiyozuilika na isiyo na haya, mara nyingi lakini si lazima katika mambo ya ngono; tafsiri hii haibani maana yake kupita kiasi.
- source_word: ὀφθαλμὸς πονηρός
  choice: jicho baya
  rationale: Huhifadhi taswira halisi ya nahau ya Kigiriki na Kiyahudi; maana yake ya kijicho, choyo au nia mbaya imefafanuliwa katika tanbihi.
- source_word: βλασφημία
  choice: kashfa
  rationale: Katika orodha hii neno linaweza kueleza usemi wa kukashifu au kutukana; ‘kashfa’ huhifadhi maana ya madhara ya maneno huku uwezekano wa kumkufuru Mungu ukibaki katika tanbihi.
- source_word: ὑπερηφανία
  choice: kiburi
  rationale: Ni neno la kawaida na lenye nguvu kwa kujikweza na kuwadharau wengine.
- source_word: ἀφροσύνη
  choice: upumbavu
  rationale: Hueleza ukosefu wa busara wa kimaadili na kimatendo, si uwezo mdogo wa kiakili tu.
theological_decisions:
- issue: Maana ya βλασφημία katika orodha ya maovu
  choice: kashfa
  alternative: kufuru
  rationale: Muktadha unaruhusu maana pana ya usemi wenye kujeruhi au kutukana, lakini neno la Kigiriki linaweza pia kumaanisha usemi wa kumkufuru Mungu; tanbihi inahifadhi mvutano huo.
- issue: Maana ya nahau ὀφθαλμὸς πονηρός
  choice: jicho baya
  alternative: kijicho, choyo au mtazamo wenye nia mbaya
  rationale: Matini kuu huhifadhi sitiari ya chanzo, huku tanbihi ikieleza maana zake zinazowezekana bila kuchagua moja pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha imewekwa kwa nomino na virai vifupi vinavyoeleweka kwa wasomaji wa kawaida. Viashiria vya tanbihi vimehamishwa hadi baada ya maneno vinayoyafafanua: ‘jicho baya[a]’ na ‘kashfa[b]’.'
