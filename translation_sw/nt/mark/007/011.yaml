  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: sw
  text: Lakini ninyi husema, “Mtu akimwambia baba yake au mama yake, ‘Korban’[a] (yaani, zawadi[b]), chochote ambacho ungefaidika nacho kutoka kwangu—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Korban ni neno linalotumiwa kwa kitu kilichowekwa wakfu kuwa zawadi kwa Mungu, na hivyo kuondolewa katika matumizi ya kawaida ya familia.
    reason: cultural_note
  - marker: b
    text: Au, “sadaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Lakini ninyi husema
  rationale: Neno δὲ linaonyesha utofauti na amri ya Mungu iliyotajwa kabla, na wakati wa sasa λέγετε hapa unaeleza desturi au kauli ya kawaida; ‘husema’ ni Kiswahili cha asili kwa maana hiyo.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Mtu akimwambia
  rationale: Muundo wa ἐὰν pamoja na kitenzi cha hali tegemezi unaonyesha hali ya sharti. Kiswahili ‘akimwambia’ kinawasilisha sharti hilo kwa ufasaha bila kuongeza uzito usio wa lazima. ‘Mtu’ linatunza matumizi wakilishi ya ἄνθρωπος.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: baba yake au mama yake
  rationale: Huwataja wazi wazazi wote wawili na kuhifadhi uwiano wa kirai cha Kigiriki.
- source_word: Κορβᾶν
  choice: Korban
  rationale: Maandishi ya Kigiriki yanahifadhi neno hili la Kisemiti kisha yenyewe yanalifafanua. Kulitoholewa kama ‘Korban’ kunadumisha upekee wake wa kihistoria na kidini.
- source_word: ὅ ἐστιν Δῶρον
  choice: yaani, zawadi
  rationale: Δῶρον kimsingi ni ‘zawadi’ na katika muktadha wa kidini inaweza pia kumaanisha ‘sadaka.’ ‘Yaani’ linaonyesha kwamba huu ni ufafanuzi wa mwandishi.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Msaada wowote ambao ungeupata kutoka kwangu
  rationale: Kirai kinahusu manufaa au msaada ambao mzazi angepokea kutoka kwa mtoto. ‘Msaada wowote’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana isiyoainishwa ya ὃ ἐὰν na mwelekeo wa ὠφεληθῇς.
theological_decisions:
- issue: Jinsi ya kutafsiri kauli ya nadhiri Κορβᾶν katika muktadha wa kitu kilichowekwa wakfu kwa Mungu
  choice: Kulihifadhi neno ‘Korban’ katika matini na kulifafanua kwa maneno ‘yaani, zawadi.’
  alternative: Kulibadilisha moja kwa moja kuwa ‘sadaka’ au ‘zawadi iliyowekwa wakfu kwa Mungu.’
  rationale: Marko mwenyewe anahifadhi neno la Kisemiti na kulifafanua. Njia hii inadumisha sifa ya kihistoria ya kauli hiyo bila kuingiza maelezo ya ziada kuhusu taratibu za nadhiri ambayo aya haisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kirai kuhusu msaada umetangulizwa ndani ya nukuu ili kauli isikike kwa kawaida katika Kiswahili, huku ‘Korban’ na ufafanuzi wake vikihifadhiwa. Alama ya mkato mrefu inaonyesha kwamba sentensi ya kisarufi inaendelea katika aya ya 12.
