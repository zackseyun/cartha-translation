  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: sw
  text: Naye akamwambia, “Kwa sababu ya neno hili[a], nenda; pepo amemtoka binti yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ya kauli hii, nenda; pepo amemtoka binti yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Naye akamwambia
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unaonyesha mwendelezo wa καί na kueleza wazi kwamba alisema kwa mwanamke huyo bila kuongeza wazo la lazima la ‘kisha’.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Kwa sababu ya neno hili
  rationale: διά pamoja na hali ya accusative hapa inaonyesha sababu. ‘Neno hili’ linadumisha umoja wa λόγος na kuelekeza kwenye jibu ambalo mwanamke alikuwa ametoa, huku ‘kauli hii’ ikiwa tafsiri nyingine ya asili.
- source_word: ὕπαγε
  choice: nenda
  rationale: Amri hii ni fupi na ya moja kwa moja, kama ilivyo katika Kigiriki, na hapa inafanya kazi kama ruhusa ya kuondoka.
- source_word: ἐξελήλυθεν ἐκ τῆς θυγατρός σου
  choice: amemtoka binti yako
  rationale: Kiambishi cha wakati timilifu -me- kinaonyesha tendo lililokamilika lenye matokeo yanayoendelea. Kitenzi ‘amemtoka’ ni cha asili katika Kiswahili na kinahifadhi picha ya pepo kutoka kwa mtu.
- source_word: τὸ δαιμόνιον
  choice: pepo
  rationale: ‘Pepo’ ni neno la kawaida la Kiswahili kwa kiumbe wa kiroho mwovu anayerejelewa na δαιμόνιον; halibadilishi dai hilo kuwa ugonjwa au ushawishi usio na nafsi.
theological_decisions:
- issue: Lugha ya kutoa pepo bila kupunguza dai la jambo la kiroho
  choice: pepo amemtoka binti yako
  alternative: roho mwovu amemwacha binti yako
  rationale: Kigiriki kinamtaja wazi δαιμόνιον na kusema kwamba ametoka kwa binti. Tafsiri inadumisha dai hilo la moja kwa moja na sitiari ya kutoka, badala ya kulifanya kuwa ugonjwa au ushawishi wa jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Naye akamwambia’ na ‘amemtoka’ ni miundo ya kawaida katika masimulizi; tafsiri inadumisha ufupi na mkazo wa kauli ya Kigiriki.
