base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: sw
  text: 'Nao wanapotoka sokoni, hawali mpaka wawe wamejiosha[a]. Pia kuna mambo mengine mengi ambayo wamepokea kuyazingatia: kuosha vikombe, mitungi, vyombo vya shaba na makochi ya kulia chakula[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wawe wamejizamisha.” Kigiriki kinatumia umbo la kitenzi ambacho mara nyingi hutafsiriwa “kubatiza,” lakini hapa kinahusu kujiosha kidesturi katika muktadha wa desturi za usafi wa kidini.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale hazina maneno “na makochi ya kulia chakula.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: sokoni
  rationale: Neno ἀγορά hapa linamaanisha eneo la soko la umma; usemi wa Kiswahili ‘kutoka sokoni’ ni wa kawaida na sahihi katika muktadha huu.
- source_word: βαπτίσωνται
  choice: wawe wamejiosha
  rationale: Katika muktadha wa desturi za usafi wa kidini, kitenzi hiki kinamaanisha kujiosha kabla ya kula, si ubatizo wa Kikristo. Kauli ya kujirejelea inaakisiwa kwa ‘wamejiosha.’
- source_word: παρέλαβον κρατεῖν
  choice: waliyopokea ili wayashike
  rationale: Ujenzi huu unaonyesha desturi walizopokea na kuendelea kuzishika; tafsiri hii inahifadhi wazo la kupokea na kushika bila kuhamisha mkazo kwenda kwenye tendo la kuzipokeza kwa wengine.
- source_word: βαπτισμοὺς
  choice: kuosha
  rationale: Hapa neno linahusu uoshaji wa kidini wa vyombo. ‘Kuosha’ ni wazi na hakulazimishi maana finyu ya kuvizamisha kabisa.
- source_word: ξεστῶν
  choice: mitungi
  rationale: ξέστης ni chombo kama mtungi au jagi; ‘mitungi’ ni neno la kawaida la Kiswahili lisilobainisha umbo kwa kupita kiasi.
- source_word: χαλκίων
  choice: vyombo vya shaba
  rationale: Neno hili linataja vitu vilivyotengenezwa kwa shaba au mchanganyiko wake; ‘vyombo vya shaba’ ni tafsiri iliyo wazi na ya kawaida.
- source_word: κλινῶν
  choice: makochi ya kulia chakula
  rationale: κλίνη linaweza kumaanisha kitanda au kochi; katika muktadha wa chakula na usafi, linaelekea kutaja makochi ambayo watu waliegemea walipokula.
- source_word: ἄλλα πολλά
  choice: mambo mengine mengi
  rationale: Kigiriki kina usemi mpana, ‘mambo mengine mengi’; tafsiri hii haiongezi neno maalumu kama ‘desturi’ ambalo halijasemwa wazi hapa.
theological_decisions:
- issue: Maana ya βαπτίσωνται / βαπτισμοὺς katika muktadha wa usafi wa kidini
  choice: Kutumia ‘wamejiosha’ / ‘kuosha’ badala ya ‘wamebatizwa’ / ‘ubatizo.’
  alternative: ‘wamejizamisha’ / ‘uzamishaji’
  rationale: Aya inazungumzia desturi za Kiyahudi za usafi, si ubatizo wa Kikristo. Tafsiri iliyochaguliwa inahifadhi muktadha huo na kuepuka kuingiza maana ya kisakramenti isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mpaka wawe wamejiosha’ ni usemi wa kawaida unaowasilisha sharti la Kigiriki, huku ‘makochi ya kulia chakula’ yakifafanua kwa ufupi mazingira ya kale ya kuegemea wakati wa mlo. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
