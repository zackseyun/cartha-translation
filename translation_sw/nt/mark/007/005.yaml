id: MRK.7.5
reference: Mark 7:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: sw
  text: Mafarisayo na waandishi wa sheria wakamuuliza, “Kwa nini wanafunzi wako hawaenendi kulingana na mapokeo ya wazee, bali hula mkate kwa mikono iliyo najisi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa mikono ya kawaida”; yaani, mikono iliyohesabiwa kuwa najisi kidesturi, si lazima mikono yenye uchafu wa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: wakamuuliza
  rationale: Wakati uliopo wa Kigiriki umetumiwa kusimulia tukio lililopita; Kiswahili cha simulizi hutumia kwa kawaida wakati uliopita hapa bila kuongeza maana ya kuuliza mara kwa mara.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Hili linabainisha kwamba walikuwa wataalamu wa sheria ya Kiyahudi, si waandishi kwa maana ya kawaida tu, huku likihifadhi jina la kundi hilo.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: περιπατοῦσιν
  choice: hawaenendi
  rationale: Neno hili linahifadhi sitiari ya Kigiriki ya ‘kutembea/kuenenda’ kwa maana ya mwenendo, na muktadha unaifanya ieleweke kuwa ni kufuata desturi.
- source_word: κατὰ τὴν παράδοσιν
  choice: kulingana na mapokeo
  rationale: ‘Kulingana na’ huonyesha kufuata kiwango kilichowekwa, na ‘mapokeo’ huwasilisha jambo lililopokelewa na kupitishwa kizazi hadi kizazi.
- source_word: τῶν πρεσβυτέρων
  choice: ya wazee
  rationale: Tafsiri ya karibu ya umilikaji huu; hapa ‘wazee’ ni wenye mamlaka wa vizazi vilivyotangulia, bila kuwafanya kuwa wazee wa kanisa.
- source_word: κοιναῖς χερσὶν
  choice: kwa mikono iliyo najisi
  rationale: Katika mzozo huu κοινός humaanisha hali ya kutofaa kidesturi au kiibada, si uchafu wa kawaida wa mwili. ‘Najisi’ huwasilisha maana hiyo kwa ufupi.
- source_word: τὸν ἄρτον
  choice: mkate
  rationale: Huhifadhi nomino mahsusi ya Kigiriki, ingawa ‘mkate’ unaweza pia kusimamia chakula kwa ujumla katika muktadha huu.
theological_decisions:
- issue: Hali ya kiibada inayodokezwa na κοινός
  choice: mikono iliyo najisi
  alternative: mikono isiyo safi; kihalisi, mikono ya kawaida
  rationale: Mzozo unahusu usafi wa kidesturi kulingana na mapokeo ya Mafarisayo, wala si usafi wa kimwili au uovu wa kimaadili. Tafsiri hii haikubali wala kukataa msimamo wao, hivyo inadumisha mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hawaenendi’ huhifadhi sitiari ya chanzo; ‘waandishi wa sheria’ huepuka utata wa ‘waandishi’ peke yake. Alama ya tanbihi imewekwa mara tu baada ya kirai inachokifafanua.
