  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: sw
  text: Kisha, alipotoka tena katika eneo la Tiro, akaenda kupitia Sidoni[a] hadi Bahari ya Galilaya, akipitia katikati ya eneo la Dekapoli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya Sidoni.” Kauli ya Kigiriki inaweza kumaanisha kupita ndani ya Sidoni au kusafiri kwa njia ya Sidoni.
    reason: lexical_alternative
  - marker: b
    text: Au, “kati ya maeneo ya Dekapoli.” Kauli ya Kigiriki ἀνὰ μέσον inaweza kutafsiriwa kwa uhalisia zaidi kuwa “katikati ya” au “baina ya,” na maelezo ya njia hii yana ugumu wa kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa mwendo katika simulizi; “tena” ni tafsiri ya kawaida na fupi.
- source_word: ἐξελθὼν
  choice: alipotoka
  rationale: Kauli ya wakati uliopita inatangulia kitenzi kikuu; “alipotoka” huonyesha mfuatano huo kwa Kiswahili cha asili.
- source_word: ἐκ τῶν ὁρίων Τύρου
  choice: katika eneo la Tiro
  rationale: ὅρια hapa humaanisha eneo au himaya, si mstari maalumu wa mpaka.
- source_word: ἦλθεν
  choice: akaenda
  rationale: Ingawa kitenzi kinaweza kutafsiriwa “akaja,” katika maelezo haya ya safari “akaenda” ni ya kawaida zaidi kwa Kiswahili na haibadili mwelekeo wa simulizi.
- source_word: διὰ Σιδῶνος
  choice: kupitia Sidoni
  rationale: διά pamoja na umilikishi huonyesha mwendo unaopita ndani ya mahali au unaofuata njia ya mahali hapo.
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: hadi Bahari ya Galilaya
  rationale: “Bahari ya Galilaya” ndilo jina la kijiografia lililozoeleka, na “hadi” huonyesha kikomo cha safari.
- source_word: ἀνὰ μέσον
  choice: akipitia katikati ya
  rationale: Kauli hii isiyo ya kawaida ina nguvu ya kuwa katikati au baina ya maeneo; tafsiri hii huhifadhi wazo la mwendo bila kuficha ugumu wa njia inayotajwa.
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: eneo la Dekapoli
  rationale: ὅρια humaanisha eneo la kiutawala au kijiografia. “Dekapoli” limehifadhiwa kama jina maalumu la eneo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Majina Tiro, Sidoni, Bahari ya Galilaya, na Dekapoli yametumiwa kwa maumbo yanayotambulika katika Kiswahili. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika badala ya kufuata uwekaji usiolingana katika safu ya ushauri ya Kiingereza.
