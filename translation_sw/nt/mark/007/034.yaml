base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: sw
  text: Akainua macho yake kuelekea mbinguni, akatoa mguno[a], kisha akamwambia, “Efatha”[b]—yaani, “Funguliwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaugua”; kitenzi hiki kinaweza kueleza mguno au pumzi nzito ya ndani.
    reason: lexical_alternative
  - marker: b
    text: “Efatha” ni neno la Kiaramu linalomaanisha “Funguliwa.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: Akatazama juu kuelekea mbinguni
  rationale: Huwasilisha tendo la kuinua macho na mwelekeo wake kwa lugha ya kawaida ya Kiswahili, huku ‘mbinguni’ ikifaa kwa ishara hii ya kuelekea kwa Mungu.
- source_word: ἐστέναξεν
  choice: akaugua
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa pumzi nzito au kuugua. ‘Akaugua’ ni kifupi na kinahifadhi uzito wa hisia bila kuufafanua kupita kiasi.
- source_word: λέγει αὐτῷ
  choice: kisha akamwambia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati wa masimulizi wa Kiswahili. Kiwakilishi ‘-mw-’ kinadumisha kwamba Yesu alimwelekezea mtu huyo maneno.
- source_word: Εφφαθα
  choice: Efatha
  rationale: Tamko la Kiaramu limehifadhiwa kwa unukuzi unaosomeka kwa urahisi katika Kiswahili, kama Marko alivyolihifadhi kabla ya kulifafanua.
- source_word: Διανοίχθητι
  choice: Funguliwa
  rationale: Hili linadumisha kwa karibu amri ya nafsi ya pili katika hali ya kutendwa, bila kutaja wazi ni masikio au uwezo wa kusema unaofunguliwa.
theological_decisions:
- issue: Kirejelewa cha αὐτῷ
  choice: akamwambia
  alternative: akayaambia masikio yake au uwezo wake wa kusema
  rationale: Sarufi ya Kigiriki kwa kawaida humrejelea mtu huyo. Tafsiri haiongezi kiungo maalumu ambacho maandishi hayakitaji.
- issue: Kirejelewa kisichotajwa cha Διανοίχθητι
  choice: Funguliwa
  alternative: Masikio yako na yafunguke
  rationale: Amri ya asili ni ya umoja na haitaji wazi kitu kinachofunguliwa. Tafsiri inadumisha mvutano huo badala ya kuufafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa masimulizi umetumiwa kwa mtiririko wa kawaida, na tamko la Kiaramu limehifadhiwa.
