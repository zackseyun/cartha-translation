translation:
  language: sw
  text: Mtu yeyote aliye na masikio ya kusikia, na asikie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aya hii haipo katika hati za awali zaidi za Kigiriki, kutia ndani Sinaiticus na Vaticanus za karne ya nne, wala katika tafsiri za kale za Kikopti. Hata hivyo, imo katika mapokeo ya hati nyingi za Kibizanti, mapokeo ya Kilatini, na ushahidi mwingi wa Kisiria. Huenda ni nyongeza ya baadaye ya mwandishi, inayorudia msemo huohuo unaopatikana mapema katika Marko 4:9 na 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: masikio
  rationale: Neno hili linataja viungo halisi vya kusikia, lakini katika msemo huu linadokeza pia utayari wa kusikiliza na kuelewa.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Hii ni amri ya nafsi ya tatu, umoja, wakati wa sasa; “na asikie” huhifadhi nguvu ya mwito au agizo kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya sitiari ya kusikia
  choice: Kudumisha msemo halisi “ana masikio ya kusikia” bila kufafanua maana ndani ya aya
  alternative: “aliye tayari kusikiliza na kuelewa”
  rationale: Msemo wa Kigiriki una maana ya kimwili na ya kiroho kwa pamoja; kuufafanua moja kwa moja kungeondoa utata na uzito wake wa kimakusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa “Kama mtu yeyote” ni wa asili, na “na asikie” hudumisha amri ya Kigiriki bila kutumia lugha yenye upendeleo wa kijinsia usio wa lazima.
