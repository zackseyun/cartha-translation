lexical_decisions:
- source_word: καρδίαν
  choice: moyoni
  rationale: Neno hili linahifadhi taswira ya kibiblia ya moyo kama utu wa ndani na tofauti yake na mfumo wa umeng'enyaji.
- source_word: κοιλίαν
  choice: tumboni
  rationale: Katika muktadha huu linamaanisha sehemu ya mwili inayopokea na kumeng'enya chakula; ‘tumboni’ ni Kiswahili cha kawaida na cha asili.
- source_word: ἀφεδρῶνα
  choice: chooni
  rationale: Linarejelea mahali pa kutoa uchafu wa mwili. ‘Chooni’ ni wazi, cha heshima, na hakidokezi isivyofaa mfumo wa kisasa wa maji taka.
- source_word: καθαρίζων
  choice: hivyo akivitakasa
  rationale: Tafsiri hii inafuata moja kwa moja hali ya kitenzi-shirikishi cha Kigiriki na nguvu yake ya matokeo, bila kuongeza wazi wazo la ‘kutangaza’ ambalo halipo katika neno lenyewe.
- source_word: βρώματα
  choice: vyakula vyote
  rationale: Wingi wa ‘vyakula’ unaakisi wingi wa Kigiriki na unafaa mjadala wa aina mbalimbali za chakula.
- source_word: αὐτοῦ
  choice: mwake
  rationale: Kiwakilishi kinamrejelea mtu anayezungumziwa na kinatolewa kwa namna ya kawaida katika Kiswahili.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: hakiingii / hutoka
  rationale: Maneno haya yanahifadhi kwa urahisi na kwa ulinganifu mwendo wa kuingia na kutoka.
theological_decisions:
- issue: Maana na uhusiano wa kisarufi wa καθαρίζων πάντα τὰ βρώματα
  choice: 'Kauli ya msimulizi: ‘hivyo akivitakasa vyakula vyote’'
  alternative: 'Maelezo ya mchakato wa umeng''enyaji: ‘hivyo kikisafishwa/kikitolewa mwilini pamoja na uchafu’'
  rationale: Kitenzi-shirikishi cha kiume katika umoja kinaweza kueleweka kama maelezo ya msimulizi kuhusu matokeo ya mafundisho ya Yesu. Hata hivyo, uwezekano wa kukihusisha na mchakato wa umeng'enyaji ni wa kweli kisarufi na una umuhimu wa kitheolojia; kwa hiyo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. ‘Chooni’ ni ya kawaida zaidi kuliko istilahi nzito kama ‘latrini,’ huku ‘moyoni’ ikihifadhi lugha ya picha ya maandiko. Muundo wa mwisho umeachwa kwa kiasi fulani na mvutano wa kisarufi ili kutoficha utata halisi wa Kigiriki.
