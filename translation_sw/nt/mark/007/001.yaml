  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: sw
  text: Nao Mafarisayo na baadhi ya waandishi[a], waliokuwa wametoka Yerusalemu, wakakusanyika kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimu wa sheria.” Neno la Kigiriki linaweza kutajwa kwa cheo cha kawaida “waandishi” au kufafanuliwa kwa kazi yao kama walimu wenye utaalamu wa sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Inaendeleza simulizi kwa njia ya kawaida katika Kiswahili, huku ikidokeza wahusika wapya.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: wakakusanyika karibu naye
  rationale: Muunganiko huu unaonyesha kukusanyika wakimwelekea Yesu na kuwa karibu naye. Wakati wa sasa wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa simulizi wa Kiswahili ili usomeke kwa kawaida.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hilo la Kiyahudi.
- source_word: τινες τῶν γραμματέων
  choice: baadhi ya waandishi
  rationale: “Baadhi ya” huhifadhi maana ya Kigiriki kwamba ni sehemu tu ya kundi la waandishi.
- source_word: γραμματέων
  choice: waandishi
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya γραμματεῖς; haiongezi ufafanuzi wa wajibu wao ambao neno lenyewe halitaji wazi hapa.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: waliokuwa wametoka Yerusalemu
  rationale: Inaonyesha kwamba walitoka Yerusalemu kabla ya kukusanyika karibu na Yesu, na ni ya kawaida katika Kiswahili.
