  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: sw
  text: Naye alikuwa akiwaambia, “Kwa ustadi mnaweka kando amri ya Mungu ili mshike mapokeo yenu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnafanya vema kuweka kando amri ya Mungu ili mshike mapokeo yenu”—neno la Kigiriki lililotafsiriwa “kwa ustadi” limetumiwa hapa kwa kejeli, si kwa kusifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Kauli ya wakati usiotimilika inadokeza usemi uliokuwa ukiendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: Καλῶς
  choice: Kwa ustadi kabisa
  rationale: Katika muktadha huu kielezi kimetumiwa kwa kejeli, si kwa kusifu. Kauli hii inaonyesha kwamba wamefanikiwa kwa ujanja kuweka kando agizo la Mungu.
- source_word: ἀθετεῖτε
  choice: mnalitupilia mbali
  rationale: Kitenzi kinaweza kumaanisha kukataa, kuweka kando, au kubatilisha. 'Kulitupilia mbali' huonyesha kukataa kwa makusudi na kudumisha utofautishaji na kushika mapokeo.
- source_word: ἐντολὴν
  choice: agizo
  rationale: '''Agizo'' ni neno la sasa, lenye hadhi, linaloeleweka kwa urahisi na linalohifadhi mamlaka ya amri ya Mungu bila uzito usio wa lazima.'
- source_word: τοῦ θεοῦ
  choice: la Mungu
  rationale: Huu ni uwasilishaji wa moja kwa moja wa umilikaji, na unaweka tofauti wazi kati ya agizo la Mungu na mapokeo yao.
- source_word: ἵνα
  choice: ili mpate
  rationale: Muundo huu huhifadhi maana ya kusudi inayowezekana katika ἵνα na unasikika kwa kawaida katika Kiswahili.
- source_word: παράδοσιν
  choice: mapokeo
  rationale: '''Mapokeo'' humaanisha mambo yaliyopokewa na kurithishwa na linafaa katika muktadha wa desturi za kidini za wanadamu.'
- source_word: τηρήσητε
  choice: kushika
  rationale: '''Kushika'' hapa humaanisha kutunza au kufuata na huleta utofautishaji mkali na kulitupilia mbali agizo la Mungu.'
theological_decisions:
- issue: Toni ya kauli ya Yesu
  choice: Kemeo la kejeli, si pongezi ya moja kwa moja
  alternative: “Mnafanya vema kulitupilia mbali agizo la Mungu...” likieleweka kama pongezi halisi
  rationale: Muktadha unaonyesha kwamba Yesu analaumu kuwekwa kwa mapokeo ya wanadamu juu ya agizo la Mungu. Tafsiri inapaswa kuhifadhi kejeli ya καλῶς bila kuifanya ionekane kwamba Yesu anaidhinisha kitendo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mapokeo' limechaguliwa badala ya 'mila' ili kuonyesha jambo lililopokelewa na kurithishwa. Kielezi cha kejeli kimewekwa wazi huku tanbihi ikihifadhi uwasilishaji wa karibu zaidi wa καλῶς.
