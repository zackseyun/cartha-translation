  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: sw
  text: Akawaambia, “Je, hata ninyi hamna ufahamu? Hamwelewi kwamba chochote kinachoingia ndani ya mtu kutoka nje hakiwezi kumtia unajisi[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kumfanya kuwa najisi.” Katika muktadha huu, neno la Kigiriki linahusiana na usafi na unajisi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Akawaambia
  rationale: Wakati uliopo wa kihistoria katika simulizi la Kigiriki umetafsiriwa kwa wakati uliopita ili Kiswahili kisomeke kwa kawaida; kiwakilishi αὐτοῖς kimejumuishwa katika ‘-waambia’.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε
  choice: Je, hata ninyi hamna ufahamu?
  rationale: ‘Hata ninyi’ huhifadhi mkazo wa καὶ ὑμεῖς, na ‘hamna ufahamu’ huonyesha ukosefu wa kuelewa bila kutumia tusi kali lisilokusudiwa.
- source_word: οὐ νοεῖτε
  choice: Hamwelewi
  rationale: Ni usemi wa kawaida unaowasilisha maana ya kutambua au kufahamu na kudumisha uhusiano na ἀσύνετοι.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: chochote kinachoingia ... kutoka nje
  rationale: ‘Chochote’ huonyesha matumizi ya jumla ya πᾶν pamoja na kirai cha kisifa, huku ‘kutoka nje’ ikiwakilisha ἔξωθεν.
- source_word: εἰς τὸν ἄνθρωπον
  choice: ndani ya mtu
  rationale: Huwakilisha mwendo kuelekea ndani unaoonyeshwa na εἰς na matumizi ya jumla ya ἄνθρωπος kwa mwanadamu yeyote.
- source_word: κοινῶσαι
  choice: kumtia unajisi
  rationale: Katika muktadha wa usafi, kitenzi hiki humaanisha kumfanya mtu awe najisi; ‘kumtia unajisi’ ni kifupi, chenye heshima, na hudumisha maana ya kiibada.
theological_decisions:
- issue: Maana ya usafi katika κοινόω
  choice: kumtia unajisi
  alternative: kumfanya kuwa najisi
  rationale: Muktadha unahusu hali ya usafi au unajisi, si upotovu wa kimaadili pekee. Tafsiri haielezi zaidi ya kile kinachosemwa wala kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili umehifadhi ukali wa karipio la Yesu. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
