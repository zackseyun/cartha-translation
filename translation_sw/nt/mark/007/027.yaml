base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: sw
  text: Naye alikuwa akimwambia, “Waache watoto washibe kwanza, kwa maana si vizuri kuuchukua mkate wa watoto na kuutupa kwa vijibwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbwa wadogo wa nyumbani,” au kwa ufupi “mbwa.” Kigiriki kinatumia umbo la udogo, linaloweza kudokeza mbwa wadogo au wa nyumbani, badala ya kusisitiza mbwa wazururaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akimwambia
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea; muundo huu wa Kiswahili unahifadhi hali hiyo kwa kawaida.
- source_word: Ἄφες
  choice: Waache
  rationale: Amri hii hapa ina maana ya kuruhusu jambo litendeke; ‘waache’ ni ya kawaida na inaendana na watoto walio katika wingi.
- source_word: πρῶτον
  choice: kwanza
  rationale: Inahifadhi mpangilio wa kipaumbele bila kudokeza kwamba wengine wametengwa kabisa baadaye.
- source_word: χορτασθῆναι
  choice: washibe
  rationale: Kitenzi hiki humaanisha kula hadi kuridhika; ‘washibe’ ni cha asili katika Kiswahili na kinahifadhi taswira ya chakula.
- source_word: τὰ τέκνα
  choice: watoto
  rationale: Ni neno la kawaida kwa watoto na haliongezi maelezo kuhusu jinsia au umri.
- source_word: καλόν ἐστιν
  choice: si vizuri
  rationale: Katika muktadha huu καλόν inaonyesha lililo jema au linalofaa; ‘si vizuri’ huhifadhi upana huo kwa Kiswahili cha kawaida.
- source_word: λαβεῖν
  choice: kuchukua
  rationale: Ni ulinganifu wa moja kwa moja na wa kawaida wa kitenzi hiki.
- source_word: ἄρτον
  choice: mkate
  rationale: Inahifadhi kitu halisi katika taswira ya mlo wa nyumbani badala ya kukipanua kuwa chakula kwa ujumla.
- source_word: κυναρίοις
  choice: vijibwa
  rationale: Umbo la kudunisha/diminutivu hudokeza mbwa wadogo, labda wa nyumbani; ‘vijibwa’ linahifadhi tofauti hiyo bila kutumia ‘watoto wa mbwa,’ ambayo ingeelekea kumaanisha puppies pekee.
- source_word: βαλεῖν
  choice: kuwatupia
  rationale: Linahifadhi kitendo hai cha kutupa kuelekea kwa hao mbwa wadogo; kiambishi ‘wa-’ kina rejeo la kawaida kwa wanyama hao katika Kiswahili.
theological_decisions:
- issue: Nguvu ya sitiari ya ‘watoto’ na ‘vijibwa’
  choice: Kuhifadhi sitiari ya nyumbani bila kutaja wazi wanaowakilishwa na makundi hayo.
  alternative: Kutafsiri kwa ufafanuzi ‘watoto’ kuwa Israeli/Wayahudi na ‘vijibwa’ kuwa watu wa Mataifa.
  rationale: Kigiriki kinatoa picha ya sitiari, si ufafanuzi wa moja kwa moja. Kuihifadhi huepuka kuingiza tafsiri ya kiufafanuzi ndani ya matini.
- issue: Maana ya πρῶτον (‘kwanza’)
  choice: Kuhifadhi ‘kwanza’ katika matini kuu.
  alternative: Kuondoa wazo la mpangilio ili sentensi iwe nyepesi zaidi.
  rationale: '‘Kwanza’ hudumisha mvutano muhimu wa simulizi na teolojia: watoto wanapewa kipaumbele, lakini wengine hawafungiwi nje kabisa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Washibe’ ni cha kawaida na sahihi kwa taswira ya mlo; ‘vijibwa’ kinahifadhi udogo wa neno la Kigiriki, huku tanbihi ikieleza uwezekano wa mbwa wa nyumbani.
