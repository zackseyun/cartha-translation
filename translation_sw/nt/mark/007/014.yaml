lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akauita umati uje kwake
  rationale: Kitenzi hiki kinamaanisha kuwaita watu waje karibu na msemaji; tafsiri hii inaonyesha wazi mwelekeo wa mwito kwa Kiswahili cha kawaida.
- source_word: πάλιν
  choice: tena
  rationale: Huhifadhi maana ya kurudia kitendo.
- source_word: ἔλεγεν
  choice: akawaambia
  rationale: Wakati usiotimilifu unaonyesha tendo la kusema lililokuwa likiendelea katika simulizi; “akawaambia” ni usemi wa asili wa Kiswahili unaowasilisha hali hiyo bila kuwa mzito.
- source_word: Ἀκούσατέ μου πάντες
  choice: Nisikilizeni, ninyi nyote
  rationale: Amri ya wingi na msisitizo wa πάντες vimehifadhiwa; “nisikilizeni” huonyesha kusikiliza kwa makini, si kusikia sauti tu.
- source_word: σύνετε
  choice: mwelewe
  rationale: Huhifadhi amri ya kutambua au kufahamu maana ya mafundisho.
