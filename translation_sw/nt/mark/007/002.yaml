  text: na walipoona kwamba baadhi ya wanafunzi wake walikuwa wakila mikate kwa mikono iliyo najisi[a]—yaani, mikono isiyonawa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema kihalisi “mikono ya kawaida,” yaani mikono iliyohesabiwa kuwa najisi kwa desturi za kidini, si mikono yenye uchafu wa kawaida tu.
