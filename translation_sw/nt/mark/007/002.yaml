lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona
  rationale: Kitenzi kishirikishi cha aoristi kinaunganishwa kwa kawaida na muktadha wa Kiswahili; kiima kinarejelea Mafarisayo na waandishi waliotajwa katika mstari wa 1.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: baadhi ya wanafunzi wake
  rationale: Muundo huu wa sehemu una maana ya baadhi, wala si wanafunzi wote.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha yaliyomo katika jambo waliloona, si sababu.
- source_word: κοιναῖς χερσίν
  choice: kwa mikono iliyo najisi
  rationale: Katika muktadha wa desturi za Kiyahudi, κοινός humaanisha mikono iliyohesabiwa kuwa najisi kidesturi, si mikono yenye uchafu wa kawaida tu. 'Mikono ya kawaida' haingewasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: yaani, mikono isiyonawiwa
  rationale: Haya ni maelezo ya mwandishi kuhusu msemo uliotangulia. 'Kunawa' ni neno la kawaida na linalofaa kwa kuosha mikono.
- source_word: ἐσθίουσιν
  choice: walikuwa wakila
  rationale: Wakati uliopo wa kisimulizi unaelezwa kwa hali endelevu ya wakati uliopita katika Kiswahili, kwa kuwa tendo ndilo waliloliona likiendelea.
- source_word: τοὺς ἄρτους
  choice: mikate
  rationale: Wingi wa ἄρτους umehifadhiwa. 'Mikate' ni wa asili katika Kiswahili na haudai umbo maalumu la mikate.
theological_decisions:
- issue: Maana ya lugha ya unajisi katika κοινός
  choice: mikono iliyo najisi
  alternative: mikono ya kawaida; mikono michafu
  rationale: Tafsiri kuu inaonyesha unajisi wa kidesturi badala ya uchafu wa kimwili pekee. Tanbihi inahifadhi maana halisi ya 'ya kawaida' na kuzuia wasomaji kudhani kuwa suala lilikuwa usafi wa kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Najisi' limetumiwa kwa sababu linaeleweka katika muktadha wa kidini na hutofautisha unajisi wa kidesturi na uchafu wa kawaida; tanbihi inafafanua tofauti hiyo. Alama ya mwisho inaonyesha sentensi inaendelea katika mstari unaofuata.
