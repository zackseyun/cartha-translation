  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: sw
  text: Hivyo mnalibatilisha neno la Mungu kwa mapokeo yenu mliyoyapitisha.[a] Nanyi mnafanya mambo mengine mengi yanayofanana na hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mliyoyakabidhi kwa wengine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: mnalibatilisha
  rationale: Kitenzi hiki kinaonyesha kulifanya jambo lipoteze uhalali au nguvu yake. “Mnalibatilisha” ni usemi wa kawaida na wenye uzito unaoendeleza shtaka la Yesu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hili ni tafsiri ya moja kwa moja inayohifadhi uzito wa kauli na utofauti wake na “mapokeo yenu.”
- source_word: τῇ παραδόσει ὑμῶν
  choice: kwa mapokeo yenu
  rationale: “Kwa” inaonyesha kuwa mapokeo yao ndiyo njia wanayotumia kulibatilisha neno la Mungu. “Mapokeo” ni neno linalofaa kwa mafundisho au desturi zinazopitishwa kutoka kizazi au kundi moja hadi jingine.
- source_word: ᾗ παρεδώκατε
  choice: mliyoyapitisha
  rationale: Kauli hii inahifadhi uhusiano wa kimatamshi kati ya παράδοσις na παραδίδωμι na kueleza kwamba wao wenyewe waliyapitisha mapokeo hayo kwa wengine.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: mambo mengine mengi yanayofanana na hayo
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inahifadhi wazo la wingi pamoja na kufanana kwa matendo hayo na mfano uliotangulia.
- source_word: ποιεῖτε
  choice: mnafanya
  rationale: Wakati wa sasa unaonyesha mwenendo unaoendelea au wa kawaida; “mnafanya” huwasilisha maana hiyo kwa uwazi.
theological_decisions:
- issue: Asili ya “mapokeo” katika shtaka la Yesu
  choice: mapokeo yenu
  alternative: mapokeo ya wanadamu
  rationale: Kigiriki kinasema “mapokeo yenu,” si “mapokeo ya wanadamu” katika mstari huu. Muktadha unaonyesha kuwa mapokeo haya yanapingana na neno la Mungu, hivyo hakuna haja ya kuongeza ufafanuzi wa kimadhehebu au maneno yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Hivyo” huonyesha uhusiano wa kirai tegemezi cha Kigiriki na hoja ya mstari uliotangulia.
