  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: sw
  text: Lakini wananiabudu bure, wakifundisha maagizo ya wanadamu kuwa mafundisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakifundisha mafundisho, yaani maagizo ya wanadamu.”
    reason: Mbadala huu huakisi muundo mfupi wa Kigiriki, ambamo “mafundisho” na “maagizo ya wanadamu” yanaunganishwa kwa karibu.
lexical_decisions:
- source_word: μάτην
  choice: bure
  rationale: Katika muktadha huu kielezi hiki humaanisha ‘bila matokeo au kusudi la kweli’; ‘bure’ ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji na mstari uliotangulia, ambapo watu humheshimu Mungu kwa midomo lakini mioyo yao iko mbali naye.
- source_word: σέβονταί με
  choice: wananiabudu
  rationale: Kitenzi σέβομαι kinapotumiwa kwa Mungu humaanisha kumwabudu au kumcha kwa heshima ya kidini; kiwakilishi cha yambwa με kimeunganishwa kiasili katika kitenzi cha Kiswahili.
- source_word: διδάσκοντες
  choice: wakifundisha
  rationale: Hifadhi muundo wa kishiriki unaoonyesha tendo linaloambatana na ibada yao na kueleza tabia yake.
- source_word: διδασκαλίας
  choice: mafundisho
  rationale: Neno hili linaweza kumaanisha mafundisho au kanuni zinazofundishwa; ‘mafundisho’ ni la kawaida na linafaa katika muktadha wa kidini.
- source_word: ἐντάλματα
  choice: maagizo
  rationale: Neno hili humaanisha amri au maagizo yenye mamlaka; ‘maagizo’ linaonyesha masharti yanayotolewa bila kuongeza dhana isiyomo katika chanzo.
- source_word: ἀνθρώπων
  choice: ya wanadamu
  rationale: Hapa umilikishi unaonyesha chanzo cha maagizo kuwa binadamu kwa ujumla, tofauti na Mungu; ‘wanadamu’ huepuka kuyawekea maana ya jinsia ya kiume.
theological_decisions:
- issue: Uhusiano kati ya ‘mafundisho’ na ‘maagizo ya wanadamu’ katika nukuu
  choice: wakifundisha mafundisho yaliyo maagizo ya wanadamu
  alternative: wakifundisha maagizo ya wanadamu kana kwamba ni mafundisho
  rationale: Kigiriki kina muundo uliobanwa unaoyaweka maneno haya katika uhusiano wa ufafanuzi. Tafsiri kuu inahifadhi mkazo kwamba yale yanayofundishwa kama mafundisho kwa hakika ni maagizo yenye asili ya kibinadamu, bila kuamua kupita kiasi namna ya kisarufi ya uhusiano huo. Mbadala umewekwa katika tanbihi kwa uwazi wa maana.
- issue: Ukosoaji wa ibada inayotegemea mamlaka ya kibinadamu
  choice: wananiabudu bure
  alternative: wananiabudu bila faida
  rationale: ‘Bure’ huhifadhi hukumu kali ya nukuu kwamba ibada hiyo haina kusudi au matokeo ya kweli, bila kudai kwamba hakuna tendo la nje la ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa kwa nukuu ya kinabii. ‘Wanadamu’ limetumiwa kwa maana jumuishi, na muundo wa sentensi umehifadhi utofautishaji pamoja na ukali wa chanzo.
