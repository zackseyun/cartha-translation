lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Linahifadhi nguvu ndogo ya upinzani au mpito inayounganisha mstari huu na habari iliyotangulia.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: mara tu ... aliposikia habari zake
  rationale: Muundo huu unaonyesha kwamba kusikia habari za Yesu kulifuatiwa bila kuchelewa na kuja kwake, huku ukidumisha kasi ya masimulizi ya Marko.
- source_word: γυνὴ
  choice: mwanamke mmoja
  rationale: Nomino haina kibainishi katika Kigiriki na inamtambulisha mhusika mpya katika simulizi.
- source_word: θυγάτριον
  choice: binti yake mdogo
  rationale: Neno la Kigiriki ni umbo la udogo la ‘binti’; tafsiri hii inahifadhi uhusiano wa kifamilia na wazo la udogo au upendo.
- source_word: πνεῦμα ἀκάθαρτον
  choice: roho mchafu
  rationale: Inafuata istilahi ya Marko kwa karibu bila kuibadili moja kwa moja kuwa ‘pepo,’ ambalo ni fasiri ya rejeo lake.
- source_word: ἐλθοῦσα
  choice: akaja
  rationale: Inatoa mfuatano wa tendo kwa Kiswahili cha kawaida na kuhifadhi mtazamo wa mahali alipokuwa Yesu.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: kuanguka miguuni pake
  rationale: Inahifadhi picha halisi ya tendo la unyenyekevu na ombi la dharura bila kufafanua zaidi namna kamili ya mkao.
theological_decisions:
- issue: Tafsiri ya πνεῦμα ἀκάθαρτον
  choice: roho mchafu
  alternative: pepo mchafu; roho najisi
  rationale: ‘Roho mchafu’ huhifadhi maneno ya Marko na vidokezo vyake vya uchafu wa kidini au kimaadili. ‘Pepo mchafu’ hufafanua kiumbe anayerejelewa, lakini si tafsiri ya moja kwa moja ya neno πνεῦμα.
- issue: Uhusiano wa εὐθὺς na vitenzi vinavyofuata
  choice: mara tu ... aliposikia habari zake, akaja
  alternative: mwanamke ... aliposikia habari zake, mara akaja
  rationale: Mpangilio wa Kigiriki unaweka εὐθὺς karibu na ἀκούσασα, lakini kwa maana ya kawaida unaonyesha mwitikio wa haraka baada ya kusikia. Tafsiri kuu inadumisha uhusiano huo bila kudai kwamba tendo la kusikia lenyewe ndilo pekee lililokuwa la mara moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida wa masimulizi huku ikihifadhi kasi ya εὐθύς, umbo la udogo katika θυγάτριον, na istilahi ya Marko ‘roho mchafu.’
