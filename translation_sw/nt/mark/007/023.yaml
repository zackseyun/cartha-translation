  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: sw
  text: Mambo haya yote maovu hutoka ndani na humtia mtu unajisi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humfanya mtu kuwa najisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Mambo haya yote maovu
  rationale: Muundo huu unasisitiza jumla ya mambo maovu yaliyotajwa katika muktadha uliotangulia. Kiswahili hiki ni cha kawaida na kinahifadhi wingi wa mambo hayo.
- source_word: ἔσωθεν
  choice: ndani
  rationale: Neno hili linaonyesha kwamba chanzo ni kilicho ndani ya mtu, kwa kulinganisha na uchafu wa nje katika muktadha.
- source_word: ἐκπορεύεται
  choice: hutoka
  rationale: Kauli ya mazoea 'hutoka' ni ya asili katika Kiswahili na inaonyesha mwendo kutoka kwenye chanzo cha ndani. Ingawa kitenzi cha Kigiriki ni umoja, kina kiima cha wingi kisicho na jinsia kwa mujibu wa matumizi ya kawaida ya Kigiriki.
- source_word: κοινοῖ
  choice: kumtia ... unajisi
  rationale: Katika muktadha wa usafi na uchafu wa Marko 7, kitenzi hiki humaanisha kumfanya mtu awe najisi, si kumfanya tu kuwa wa kawaida.
- source_word: τὸν ἄνθρωπον
  choice: mtu
  rationale: Katika Kiswahili, 'mtu' ni nomino ya kawaida ya umoja inayomhusu mwanadamu bila kuweka jinsia, na hivyo inawasilisha kwa usahihi matumizi ya jumla ya ἄνθρωπον.
theological_decisions:
- issue: Maana ya ἄνθρωπον katika kauli ya jumla kuhusu unajisi wa mwanadamu
  choice: mtu
  alternative: mwanadamu
  rationale: Kigiriki kina umoja wenye maana ya uwakilishi wa kila mtu. 'Mtu' ni Kiswahili cha kawaida, cha umoja, na hakipunguzi upeo wa kauli kwa wanaume pekee.
- issue: Aina ya unajisi katika κοινοῖ
  choice: kumtia mtu unajisi
  alternative: kumfanya mtu kuwa najisi
  rationale: Tafsiri hii inahifadhi lugha ya uchafu/unajisi inayotawala kifungu bila kuamua kimyakimya kwamba ni wa kiibada tu au wa kimaadili tu; muktadha unaunganisha vipengele hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. 'Hutoka ndani' huhifadhi mkazo wa chanzo cha ndani, na 'kumtia mtu unajisi' huhifadhi istilahi ya usafi na uchafu katika kifungu.
