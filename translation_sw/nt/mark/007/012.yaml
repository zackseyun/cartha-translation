  text: Hamkumruhusu tena kumfanyia baba yake au mama yake jambo lolote,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumsaidia baba yake au mama yake.” Maneno ya Kigiriki yana maana pana ambayo katika muktadha huu yanaweza kujumuisha msaada wa vitendo au wa kifedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: tena
  rationale: Katika muundo hasi wa Kiswahili, “hamruhusu tena” huonyesha kwa kawaida kwamba ruhusa iliyokuwapo imekoma.
- source_word: ἀφίετε
  choice: hamruhusu
  rationale: Hapa kitenzi kina maana ya kuruhusu, si kusamehe wala kuacha. Umbo hili pia linahifadhi nafsi ya pili wingi inayodokezwa na kitenzi cha Kigiriki.
- source_word: αὐτὸν
  choice: -m- katika “hamruhusu”
  rationale: Kiambishi cha yambwa kinamwakilisha mtu mmoja anayezuiwa kuwafanyia wazazi wake jambo.
- source_word: οὐδὲν ποιῆσαι
  choice: kufanya jambo lolote
  rationale: Muundo huu ni wa asili katika Kiswahili baada ya kitenzi hasi cha kuruhusu na unadumisha upana wa usemi wa Kigiriki.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: kwa ajili ya baba yake au mama yake
  rationale: “Kwa ajili ya” huonyesha tendo linalomnufaisha mzazi bila kulibana liwe msaada wa fedha pekee; viwakilishi milikishi vinaweka wazi kuwa ni wazazi wa mtu huyo.
theological_decisions:
- issue: Iwapo maana ya msaada wa mali au fedha itajwe wazi kutokana na muktadha wa Korbani
  choice: Kudumisha usemi mpana “kufanya jambo lolote kwa ajili ya baba yake au mama yake”
  alternative: “kufanya jambo lolote la kumsaidia baba yake au mama yake”
  rationale: Muktadha unaashiria msaada wa vitendo au wa mali, lakini maneno ya aya yenyewe ni mapana. Tafsiri kuu haifafanui zaidi ya chanzo; tanbihi inaeleza maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hamruhusu tena” ni mtiririko wa kawaida; “kwa ajili ya” huhifadhi maana pana ya tendo kwa manufaa ya wazazi.
