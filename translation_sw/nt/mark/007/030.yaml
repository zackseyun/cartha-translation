  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: sw
  text: Naye, alipoondoka kwenda nyumbani kwake, alimkuta mtoto amelazwa kitandani, na pepo alikuwa ameondoka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “pepo alikuwa ametoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: alipoondoka na kwenda
  rationale: Kauli ya wakati inaonyesha tendo lililotangulia kitenzi kikuu; “alipoondoka na kwenda” huhifadhi wazo la kuondoka na kuelekea mahali fulani kwa Kiswahili cha kawaida.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: nyumbani kwake
  rationale: Hii inaonyesha alikokwenda, yaani makao yake mwenyewe; “nyumbani kwake” ni ya asili na wazi katika Kiswahili.
- source_word: εὗρεν
  choice: alimkuta
  rationale: Katika simulizi hii, “alimkuta” hueleza kwa kawaida kwamba alipofika alimwona mtoto akiwa katika hali iliyoelezwa.
- source_word: παιδίον
  choice: mtoto
  rationale: Neno la Kigiriki linamaanisha mtoto bila kutaja jinsia katika aya hii; muktadha unaonyesha kuwa ni binti yake.
- source_word: βεβλημένον
  choice: amelala
  rationale: Ingawa kimuundo neno hilo linaweza kumaanisha kuwekwa au kulazwa, hapa linaeleza hali ya mtoto kitandani; “amelala” ni tafsiri ya kawaida isiyoongeza wazo la kutupwa kwa nguvu.
- source_word: ἐπὶ τὴν κλίνην
  choice: kitandani
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kwamba mtoto alikuwa juu au ndani ya kitanda.
- source_word: δαιμόνιον
  choice: yule pepo
  rationale: “Pepo” ni neno la kawaida la Kiswahili kwa δαιμόνιον; “yule” hurejelea pepo aliyetajwa katika muktadha bila kuongeza sifa ambayo haipo katika aya hii.
- source_word: ἐξεληλυθός
  choice: alikuwa ameondoka
  rationale: 'Kauli timilifu inaonyesha tendo lililokamilika na hali iliyofuata: pepo alikuwa tayari ameondoka na hakuwapo tena.'
theological_decisions:
- issue: Maelezo ya matokeo ya kufukuzwa kwa pepo
  choice: yule pepo alikuwa ameondoka
  alternative: yule pepo alikuwa ametoka
  rationale: Tafsiri hii inahifadhi ukweli wa kuondoka kwa pepo na matokeo yake yaliyodumu, bila kuongeza maelezo kuhusu namna tendo hilo lilivyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. Kiashiria cha tanbihi [a] kimewekwa baada ya kishazi kinachohusu kuondoka kwa pepo, ambacho ndicho kinachoelezwa na tanbihi.
