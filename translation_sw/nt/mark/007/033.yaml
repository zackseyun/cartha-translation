base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: sw
  text: Akamchukua kando kutoka katika umati, faraghani[a], akaingiza vidole vyake masikioni mwa yule mtu, na baada ya kutema mate[b], akaugusa ulimi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa faragha.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema, “na baada ya kutema mate, akaugusa ulimi wake”; hakisemi wazi kwamba Yesu aliweka mate kwenye ulimi wa yule mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος
  choice: akamchukua kando
  rationale: Kitenzi hiki kinaonyesha kumtenga mtu na wengine; usemi huu ni wa kawaida na unaohifadhi tendo hilo bila kuliongezea maana.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: mbali na umati
  rationale: Huwasilisha wazi kutengwa kwake na kundi la watu.
- source_word: κατ’ ἰδίαν
  choice: ili wawe peke yao
  rationale: Katika muktadha huu, usemi unaonyesha kwamba Yesu alimpeleka mtu mahali pasipo na umati; Kiswahili hiki ni cha asili na kinaepusha utata wa 'faraghani' unaoweza kudokeza usiri.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: akaingiza vidole vyake masikioni mwa yule mtu
  rationale: Huhifadhi tendo halisi la kimwili na kubainisha marejeo tofauti ya viwakilishi vya Kigiriki bila kufanya Kiswahili kisieleweke.
- source_word: πτύσας
  choice: baada ya kutema mate
  rationale: Huwakilisha tendo lililotangulia kugusa, bila kusema mate yaliwekwa wapi.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: akaugusa ulimi wake
  rationale: ἅπτομαι pamoja na nomino katika hali ya genitive hapa humaanisha kugusa; muktadha unaonyesha kuwa ni ulimi wa yule mtu.
theological_decisions:
- issue: Maelezo ya ishara ya Yesu ya kuponya
  choice: Kutaja kwa uwazi matendo ya kuingiza vidole, kutema mate, na kugusa ulimi bila kueleza maana yake au mahali mate yalipowekwa.
  alternative: Kusema Yesu alipaka mate kwenye ulimi wa mtu huyo, au kueleza ishara hiyo kuwa ya kitiba au ya kiibada.
  rationale: Kigiriki kinasema tu kwamba Yesu alitema mate na akaugusa ulimi wa mtu; hakisemi wazi kuwa mate yaliwekwa kwenye ulimi wala hakielezi maana ya matendo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mtindo wa simulizi ni wa kawaida kwa wasomaji wengi. 'Yule mtu' imeongezwa ili kuondoa utata wa viwakilishi bila kuongeza mhusika mpya; alama zote za tanbihi zimewekwa katika matini kuu.
