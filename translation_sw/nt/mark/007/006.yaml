  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: sw
  text: 'Lakini akawaambia, “Isaya alitabiri vema juu yenu ninyi wanafiki, kama ilivyoandikwa: ‘Watu hawa huniheshimu kwa midomo yao, lakini moyo wao uko mbali nami.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha ugeuko wenye utofauti mdogo katika jibu la Yesu; “Lakini” linafaa katika mtiririko huu wa hoja.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni Kiswahili cha kawaida na cha asili kwa kitenzi cha kusema chenye walengwa, bila kubadili maana.
- source_word: Καλῶς
  choice: vema
  rationale: Linahifadhi tathmini ya moja kwa moja kwamba Isaya alitabiri kwa kufaa, bila kuibana kuwa usahihi tu au uadilifu tu.
- source_word: ἐπροφήτευσεν
  choice: alitabiri
  rationale: Ni tafsiri ya kawaida ya tendo la kinabii na inadumisha wazi kwamba maneno ya Isaya yalikuwa unabii.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: juu yenu ninyi wanafiki
  rationale: “Juu yenu” huonyesha rejeleo, na “ninyi wanafiki” huhifadhi uhusiano wa kiambatisho na nguvu ya shutuma ya Kigiriki.
- source_word: ὡς γέγραπται ὅτι
  choice: 'kama ilivyoandikwa:'
  rationale: Ni fomula ya kawaida ya kuanzisha nukuu ya Maandiko; nukta mbili huwasilisha nukuu kwa ufasaha.
- source_word: Οὗτος ὁ λαὸς
  choice: Watu hawa
  rationale: Ni Kiswahili cha asili kwa kundi linaloonyeshwa moja kwa moja, huku kikihifadhi sauti ya shutuma ya kinabii.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: huniheshimu kwa midomo yao
  rationale: “Heshimu” hutoa maana ya τιμάω, na “kwa midomo yao” huhifadhi chombo cha heshima ya nje.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: lakini mioyo yao
  rationale: Ingawa Kigiriki kina “moyo” katika umoja wa pamoja, wingi ni wa kawaida katika Kiswahili unapowarejelea watu wengi na huepuka dhana ya kwamba kundi lina moyo mmoja halisi.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: iko mbali nami
  rationale: Hueleza umbali wa kimahusiano au kiroho kwa Kiswahili cha kawaida bila kuufanya kuwa umbali wa mahali tu.
theological_decisions:
- issue: Yesu kutumia Isaya 29:13 kuwashutumu wapinzani wake moja kwa moja
  choice: Shutuma ya moja kwa moja imehifadhiwa katika “juu yenu ninyi wanafiki” na “Watu hawa.”
  alternative: Kutumia maneno laini yanayofanya kauli iwe fundisho la jumla lisilowalenga wasikilizaji.
  rationale: Kigiriki kinatumia unabii wa Isaya moja kwa moja kwa wasikilizaji wa Yesu; tafsiri haipaswi kupunguza nguvu hiyo wala kuongeza ufafanuzi wa kimadhehebu.
- issue: Umoja wa pamoja katika “watu” na “moyo”
  choice: “Watu hawa ... mioyo yao” limetumiwa kwa ufasaha wa Kiswahili.
  alternative: “Jamii hii ... moyo wake” au “Watu hawa ... moyo wao.”
  rationale: Kigiriki kina nomino za umoja zenye maana ya pamoja, lakini Kiswahili cha kawaida huwarejelea watu wengi kwa wingi. Maana ya ndani dhidi ya heshima ya nje imehifadhiwa bila kudai umoja halisi wa moyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya Maandiko. Muundo ni wa asili kwa wasomaji wa kawaida, huku ukihifadhi ugeuko wa “Lakini,” shutuma ya “wanafiki,” fomula ya nukuu, na tofauti kati ya midomo na moyo.
