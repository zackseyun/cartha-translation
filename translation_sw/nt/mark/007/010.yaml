  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: sw
  text: Kwa maana Musa alisema, “Mheshimu baba yako na mama yako,” na, “Yeyote anayemsema vibaya baba au mama yake[a] lazima afe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemtukana baba au mama yake” au “anayemlaani baba au mama yake.” Kitenzi hiki kinaweza kumaanisha kusema vibaya, kutukana, au kulaani.
    reason: lexical_alternative
  - marker: b
    text: Au, “lazima auawe.” Kigiriki kinatumia kauli ya kisheria ambayo kwa maneno halisi ni “lazima afe kwa kifo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi ya jumla.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa maneno yanayofuata yanaunga mkono hoja ya Yesu kwa kutoa sababu au ufafanuzi.
- source_word: εἶπεν
  choice: alisema
  rationale: Kitenzi rahisi cha wakati uliopita kinafaa katika utangulizi wa dondoo.
- source_word: Τίμα
  choice: Mheshimu
  rationale: Amri hii huonyesha kumpa mzazi heshima inayomstahili, na inadumisha uzito wa amri ya Torati.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: baba yako na mama yako
  rationale: Inawataja wazazi wote wawili waziwazi kama ilivyo katika Kigiriki.
- source_word: Ὁ κακολογῶν
  choice: Yeyote anayemsema vibaya
  rationale: κακολογέω inaweza kumaanisha kusema vibaya juu ya mtu, kumtukana, au kumlaani. Tafsiri hii pana haibani maana kwenye laana rasmi pekee.
- source_word: πατέρα ἢ μητέρα
  choice: baba au mama yake
  rationale: Ingawa Kigiriki hakina kiwakilishi cha umilikaji hapa, “yake” ni cha kawaida katika Kiswahili na huweka wazi uhusiano wa wazazi unaokusudiwa.
- source_word: θανάτῳ τελευτάτω
  choice: lazima afe
  rationale: Hii ni kauli ya kisheria yenye nguvu ya lazima. Kiswahili “lazima afe” huhifadhi uzito wake bila kuongeza wazi kwamba mtu mwingine ndiye anayetekeleza hukumu.
theological_decisions:
- issue: Ufasiri wa kauli ya adhabu θανάτῳ τελευτάτω
  choice: lazima afe
  alternative: lazima auawe
  rationale: Kigiriki kinatumia kauli ya lazima ya kisheria, iliyo na maana halisi inayokaribia “afe kwa kifo.” “Lazima afe” huhifadhi namna ya usemi wa matini bila kubainisha kupita kiasi njia au mtendaji wa hukumu; “lazima auawe” ni ufafanuzi halali wa kisheria na umewekwa katika tanbihi.
- issue: Upeo wa maana ya κακολογῶν
  choice: anayemsema vibaya
  alternative: anayemlaani
  rationale: Kitenzi kinaweza kuhusisha kusema vibaya, kutukana, au kulaani. Tafsiri kuu inadumisha upana huo, huku tanbihi ikionyesha tafsiri finyu lakini inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa amri na dondoo za Torati umehifadhiwa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
