  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: sw
  text: Walistaajabu kupita kiasi, wakisema, “Amefanya kila kitu vizuri.[a] Hata huwafanya viziwi wasikie na wasioweza kusema waseme.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo rasmi zaidi, “Amefanya mambo yote vyema.” Maneno haya yanaweza kukumbusha lugha ya Maandiko kuhusu kazi za Mungu.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yanakumbusha Isaya 35:5–6, ambapo katika urejesho wa Mungu viziwi husikia na wasioweza kusema hunena.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: kupita kiasi
  rationale: Kirai hiki cha Kiswahili kinawasilisha nguvu kubwa ya kielezi hicho, yaani kwa kiwango kisicho cha kawaida, bila tafsiri ya neno kwa neno isiyo ya asili.
- source_word: ἐξεπλήσσοντο
  choice: walistaajabu
  rationale: Kitenzi hiki kinaonyesha hali yao yenye nguvu ya mshangao; kauli ya wakati usiotimilifu inadokeza mwitikio uliokuwa ukiendelea.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hii ni tafsiri ya asili ya kishirikishi kinachoanzisha maneno waliyosema.
- source_word: Καλῶς
  choice: vizuri
  rationale: Kielezi hiki kinatathmini ubora wa matendo ya Yesu. “Vizuri” ni cha kawaida na pia hakizuii mwangwi unaowezekana wa lugha ya Maandiko.
- source_word: πάντα
  choice: kila kitu
  rationale: Hutoa maana jumuishi ya wingi wa Kigiriki kwa Kiswahili cha kawaida na cha sasa.
- source_word: πεποίηκεν
  choice: amefanya
  rationale: Wakati timilifu unaonyesha tendo lililokamilika lenye matokeo ya sasa; “amefanya” huhifadhi maana hiyo kwa ufasaha.
- source_word: κωφοὺς
  choice: viziwi
  rationale: Katika muktadha huu neno linamaanisha watu wasioweza kusikia; “viziwi” ni fupi, wazi, na sambamba na muundo wa sentensi.
- source_word: ποιεῖ ἀκούειν
  choice: huwafanya ... wasikie
  rationale: Muundo wa ποιέω pamoja na kitenzi-jina unaonyesha usababishaji. “Huwafanya ... wasikie” huhifadhi hali ya sasa na dai la jumla la umati.
- source_word: ἀλάλους
  choice: wasioweza kusema
  rationale: Kirai hiki kinaeleza kwa heshima na uwazi watu wasio na uwezo wa kusema, huku kikiepuka neno ambalo kwa baadhi ya wasomaji linaweza kusikika kuwa la kudhalilisha.
- source_word: λαλεῖν
  choice: waseme
  rationale: “Waseme” ndiyo tafsiri ya moja kwa moja na ya asili katika muundo wa usababishaji.
- source_word: καὶ
  choice: Hata ... na
  rationale: “Hata” huonyesha nguvu ya kilele cha dai zima, huku “na” ikihifadhi uratibu kati ya viziwi kusikia na wasioweza kusema kusema.
theological_decisions:
- issue: Mwangwi unaowezekana wa Isaya 35:5–6 na lugha inayofanana na tathmini ya kazi za Mungu
  choice: Kudumisha kauli ya umati kwa lugha ya moja kwa moja, “Amefanya kila kitu vizuri,” bila kutaja mwangwi huo waziwazi katika matini kuu.
  alternative: Kutafsiri kwa mtindo rasmi zaidi, “Amefanya mambo yote vyema,” ili kuimarisha mwangwi wa lugha ya Maandiko.
  rationale: Kigiriki chenyewe kinaweza kukumbusha urejesho wa Isaya, ambapo viziwi husikia na wasioweza kusema hunena, na huenda pia tathmini ya kazi za Mungu. Tafsiri inabaki karibu na matini bila kuamua kwamba mwangwi wowote ni wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Kupita kiasi” hudumisha msisitizo mkubwa wa Kigiriki; “wasioweza kusema” limetumiwa kwa uwazi na heshima. Alama zote za tanbihi zimewekwa kwenye madai husika katika matini kuu.
