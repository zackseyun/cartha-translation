translation:
  language: sw
  text: Naye aliendelea kusema, “Kinachotoka kwa mtu, hicho ndicho kinachomtia mtu unajisi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hicho ndicho kinachomfanya mtu kuwa najisi.” Kitenzi cha Kigiriki hutumia lugha ya usafi, kikimaanisha kumtia mtu unajisi au kumfanya kuwa najisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: aliendelea kusema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi unaoendelea katika simulizi; tafsiri hii inahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Naye
  rationale: Ni kiunganishi hafifu cha simulizi; “Naye” kinaendeleza maelezo bila kuweka uzito usio wa lazima wa upinzani.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Kinachotoka ndani ya mtu
  rationale: Muundo wa kirai cha kisifa chenye kibainishi umetafsiriwa kwa njia ya kawaida kama “kinachotoka”; “ndani ya mtu” huonyesha chanzo na kupatana na muktadha wa aya zinazofuata.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος hapa ina maana ya jumla ya binadamu mmoja anayewakilisha watu kwa ujumla; “mtu” ni sahihi, ya kawaida, na huhifadhi urudiaji wa balagha.
- source_word: ἐκεῖνο
  choice: hicho ndicho
  rationale: 'Muundo huu huhifadhi mkazo wa kiwakilishi cha kuonyesha: hicho hasa ndicho kinachotia unajisi.'
- source_word: κοινοῖ
  choice: kinachomtia mtu unajisi
  rationale: Katika muktadha wa usafi, kitenzi hiki humaanisha kumfanya mtu awe najisi; “kutia unajisi” huhifadhi lugha ya usafi kwa Kiswahili chenye hadhi.
theological_decisions:
- issue: Lugha ya usafi katika κοινόω
  choice: kinachomtia mtu unajisi
  alternative: kinachomfanya mtu kuwa najisi
  rationale: “Kutia unajisi” huwasilisha kwa ufupi maana ya kunajisi katika muktadha wa usafi, huku dokezo likihifadhi namna mbadala iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “mtu” na mkazo wa “hicho ndicho” umehifadhiwa; lugha ya usafi haijafanywa kuwa maelezo ya jumla ya maadili pekee.
