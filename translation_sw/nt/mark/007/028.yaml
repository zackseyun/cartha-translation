  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: sw
  text: Lakini akamjibu, “Bwana[a], hata vijibwa vilivyo chini ya meza hula makombo ya watoto.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimiwa.” Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, na pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “vijibwa” linaonyesha mbwa wadogo au mbwa wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: akamjibu
  rationale: Muundo wa Kigiriki una kitenzi cha kujibu pamoja na usemi wa kihistoria; Kiswahili cha kawaida huunganisha maana hizi kwa njia ya asili kuwa “akamjibu,” bila kurudia “akajibu na kumwambia.”
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi uwezekano wa cheo kinachomhusu Yesu, huku katika muktadha pia ikiweza kuwa namna ya heshima ya kumwita mtu.
- source_word: καὶ
  choice: hata
  rationale: 'Hapa καί ina nguvu ya kuongeza jambo kwa msisitizo: hata vijibwa navyo hupata makombo.'
- source_word: κυνάρια
  choice: vijibwa
  rationale: Hili ni neno la udogo la κύων; “vijibwa” huhifadhi wazo la mbwa wadogo au wa nyumbani bila kulifanya kuwa “watoto wa mbwa” tu.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: vilivyo chini ya meza
  rationale: Ni tafsiri ya wazi na ya kawaida ya mahali vinapokuwa.
- source_word: ἐσθίουσιν
  choice: hula
  rationale: Wakati uliopo hapa unaeleza jambo la kawaida; “hula” huonyesha desturi hiyo.
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: makombo ya watoto
  rationale: “Makombo” huwasilisha vipande vidogo vya chakula, na “ya watoto” huhifadhi uhusiano wa umilikaji au uhusiano bila kuongeza neno “chakula.”
theological_decisions:
- issue: Maana ya κύριε katika namna mwanamke anavyomwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi cheo cha kawaida kwa κύριος na uwezekano wa uzito wa kikristo, lakini tanbihi inabainisha kwamba hapa neno hilo pia linaweza kuwa namna ya kawaida ya heshima.
- issue: Nguvu ya καί katika jibu la mwanamke
  choice: hata
  alternative: pia; ndiyo, lakini
  rationale: “Hata” huonyesha kwamba mwanamke anakubali taswira ya Yesu na kuongeza kuwa vijibwa navyo hupokea makombo, bila kuamua kabisa ikiwa καί ni ya kuongeza tu au ina nguvu ya kukubali hoja iliyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Akamjibu” ni simulizi la kawaida na lenye mtiririko; “vijibwa” huhifadhi udogo wa neno la Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
