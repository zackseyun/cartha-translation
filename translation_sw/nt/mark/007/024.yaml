base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: sw
  text: Kutoka huko, aliinuka akaenda katika eneo la Tiro.[a] Alipoingia katika nyumba fulani, hakutaka mtu yeyote afahamu,[b] lakini hakuweza kubaki bila kujulikana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi ya Tiro”; neno la Kigiriki linaweza kumaanisha eneo au sehemu inayohusishwa na Tiro, si mstari wa mpaka pekee.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakutaka mtu yeyote ajue.” Kigiriki hakitaji wazi jambo lililopaswa kutojulikana; linaweza kurejelea kuwapo kwake au mahali alipokuwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “hakuweza kuepuka kutambuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Kutoka huko
  rationale: Ἐκεῖθεν huonyesha kuondoka mahali palipotangulia; δέ ni kiunganishi chepesi ambacho hapa kinaweza kuachwa kijitokeze katika mtiririko wa kawaida wa Kiswahili bila kuongeza tofauti nzito.
- source_word: ἀναστὰς ἀπῆλθεν
  choice: aliinuka akaenda
  rationale: Muundo huu unaendeleza mfuatano wa matendo katika simulizi. “Aliinuka akaenda” ni wa asili na huhifadhi tendo halisi la kuinuka pamoja na kuondoka.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: katika eneo la Tiro
  rationale: ὅρια inaweza kumaanisha mipaka, eneo, au wilaya. Katika muktadha huu “eneo la Tiro” huepuka kudokeza kwamba alikwenda kwenye mstari wa mpaka tu.
- source_word: εἰσελθὼν εἰς οἰκίαν
  choice: Alipoingia katika nyumba fulani
  rationale: Kitenzi-shirikishi kina maana ya wakati na mfuatano. οἰκίαν haina kibainishi, hivyo “nyumba fulani” huonyesha nyumba isiyotajwa kwa namna ya kawaida ya Kiswahili.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: hakutaka mtu yeyote ajue kwamba alikuwa humo
  rationale: Kigiriki hakitaji wazi jambo ambalo watu wasijue. Kiswahili huhitaji kulieleza kwa kiasi fulani; “kwamba alikuwa humo” hurejelea kuwapo kwake bila kuongeza sababu au maelezo yasiyokuwamo.
- source_word: οὐκ ἠδυνήθη λαθεῖν
  choice: hakuweza kubaki bila kujulikana
  rationale: λανθάνω hapa ni kutotambuliwa au kuepuka kujulikana. Kauli hii ni ya asili na huhifadhi tofauti kati ya nia yake na matokeo.
