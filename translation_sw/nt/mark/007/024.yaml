translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Tafsiri imehifadhi kutotajwa wazi kwa yambwa katika γνῶναι kupitia tanbihi, huku matini kuu ikitumia kauli ya kawaida ya Kiswahili.
