base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: sw
  text: Naye alipoingia ndani ya nyumba, mbali na umati, wanafunzi wake wakamuuliza kuhusu mfano huo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usemi huo” au “kielelezo hicho.” Neno la Kigiriki ni παραβολή (parabolē).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinadumisha mtiririko wa simulizi wa Marko; “Naye” ni cha kawaida na cha heshima katika simulizi la Kiswahili.
- source_word: ὅτε
  choice: alipo-
  rationale: Muundo wa wakati “alipoingia” unaonyesha hali ya wakati ambayo ndani yake wanafunzi walimuuliza.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: alipoingia ndani ya nyumba
  rationale: Kiswahili kwa kawaida hutumia “nyumba” bila kutofautisha wazi kati ya “a house” na “the house”; muktadha hauongezewi umilikaji au uainisho ambao haupo katika Kigiriki.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: mbali na umati
  rationale: Hueleza kwamba kuingia kwake kulimweka kando na umati, kwa lugha ya asili ya Kiswahili.
- source_word: ἐπηρώτων
  choice: wakamuuliza
  rationale: Wakati usiotimilifu wa Kigiriki unaweza kuashiria tendo lililoendelea, lakini simulizi la Kiswahili kwa kawaida hutumia mfuatano “waka-” bila kulazimisha maana ya kurudia-rudia.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili unaohifadhi uhusiano wa umilikaji.
- source_word: τὴν παραβολήν
  choice: mfano huo
  rationale: “Mfano” ni tafsiri ya kawaida na pana ya παραβολή katika mafundisho ya Yesu; “huo” huonyesha rejea kwa jambo lililotangulia bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya παραβολή katika muktadha ambapo kauli iliyotangulia inaweza kueleweka kama usemi wa kitamathali
  choice: mfano huo
  alternative: usemi huo; kielelezo hicho
  rationale: “Mfano” huhifadhi namna Marko anavyokitaja kifungu hicho kama παραβολή, huku tanbihi ikihifadhi upana wa kimsamiati bila kulazimisha aina nyembamba ya fasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa urahisi. Muundo wa simulizi “alipoingia … wakamuuliza” ni wa asili; “umati” hufaa kwa ὄχλος, na tanbihi huhifadhi utata halisi wa παραβολή.
