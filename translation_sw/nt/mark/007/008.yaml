  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: sw
  text: Mnaiacha amri ya Mungu na kuyashikilia mapokeo ya wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu.” Kigiriki kinatofautisha yaliyo ya kibinadamu na yaliyo ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Mnaiacha
  rationale: Kitenzi hiki kinaonyesha kuweka kando au kuacha amri. Muundo wa Kiswahili wenye kitenzi cha wakati uliopo unaendana kwa kawaida na kitenzi kikuu na kuhifadhi uhusiano wa matendo hayo bila kuongeza nguvu ya neno kama ‘kuitelekeza.’
- source_word: ἐντολὴν
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida, lenye heshima, linaloonyesha agizo lenye mamlaka kutoka kwa Mungu.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Huhifadhi hali ya umilikaji au chanzo cha amri iliyo katika Kigiriki.
- source_word: κρατεῖτε
  choice: kuyashikilia
  rationale: Hutoa maana ya kufuata kwa uthabiti au kung’ang’ania, si kushika tu kwa mkono.
- source_word: παράδοσιν
  choice: mapokeo
  rationale: ‘Mapokeo’ hueleza desturi au mafundisho yaliyopokelewa na kurithishwa, na linafaa katika muktadha huu wa kidini.
- source_word: ἀνθρώπων
  choice: wanadamu
  rationale: Neno hili linawahusu binadamu kwa ujumla, si wanaume pekee, na linahifadhi kwa uwazi utofauti kati ya yaliyo ya kibinadamu na yaliyo ya Mungu.
theological_decisions:
- issue: Utofauti kati ya amri ya Mungu na mapokeo ya wanadamu
  choice: Kudumisha upinzani wa moja kwa moja kati ya ‘amri ya Mungu’ na ‘mapokeo ya wanadamu.’
  alternative: Kutumia ‘desturi za watu’ kwa lugha nyepesi zaidi.
  rationale: Nguvu ya karipio iko katika kuacha kile kinachotoka kwa Mungu huku wakishikilia kile kinachotoka kwa wanadamu. Tafsiri haiongezi dai kwamba mapokeo yote ni mabaya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mapokeo’ linafaa katika muktadha wa kidini, na ‘wanadamu’ linaweka wazi utofauti wa kibinadamu na wa kimungu bila kudokeza jinsia ya kiume pekee.
