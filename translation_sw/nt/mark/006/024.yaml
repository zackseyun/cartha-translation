base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: sw
  text: Alipotoka, akamwambia mama yake, “Niombe nini?” Mama yake akasema, “Kichwa cha Yohana Mbatizaji[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana anayebatiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Alipotoka
  rationale: Kishirikishi cha wakati uliopita kinaonyesha kwamba alitoka kwanza, kisha akasema. Muundo wa ‘alipotoka’ unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: Τί αἰτήσωμαι
  choice: Niombe nini?
  rationale: Kauli ya kuuliza yenye hali tegemezi inaonyesha msichana anatafakari ombi analopaswa kutoa. ‘Niombe nini?’ ni fupi, ya kawaida, na inahifadhi maana hiyo.
- source_word: μητρὶ αὐτῆς
  choice: mama yake
  rationale: Huu ni ufasiri wa moja kwa moja na wa kawaida wa muundo wa umilikaji.
- source_word: κεφαλήν
  choice: Kichwa
  rationale: Neno limetafsiriwa moja kwa moja bila kupunguza ukali wa ombi hilo.
- source_word: τοῦ βαπτίζοντος
  choice: Mbatizaji
  rationale: Kishirikishi kilichotumiwa kama jina kinamtambulisha Yohana kwa shughuli yake ya kubatiza. ‘Mbatizaji’ ni jina la kawaida na linaloeleza maana hiyo wazi.
theological_decisions:
- issue: Ufasiri wa jina la utambulisho la Yohana, βαπτίζων
  choice: Yohana Mbatizaji
  alternative: Yohana anayebatiza
  rationale: ‘Mbatizaji’ huhifadhi kazi ya kishirikishi kama jina la utambulisho na ni Kiswahili cha kawaida. Haimhusishi Yohana na dhehebu la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kurudia ‘mama yake’ katika sentensi ya pili kunaondoa utata wa kiwakilishi bila kubadili mhusika wa Kigiriki.
