  text: And they went out and proclaimed that people should repent[a].
translation:
  language: sw
  text: Nao wakatoka, wakatangaza kwamba watu watubu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “kwamba watubu”; wanaotajwa kwa “wa-” ni wale waliosikia tangazo lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka agizo la Yesu katika mistari iliyotangulia bila kuongeza maana mpya ya wakati.
- source_word: ἐξελθόντες
  choice: wakatoka
  rationale: Kauli hii inaonyesha wanafunzi waliondoka kwenda kutekeleza utume wao; muundo wa kitenzi chenye kiambishi -ka- ni wa kawaida katika masimulizi ya Kiswahili na unaonyesha tendo lililotangulia tangazo.
- source_word: ἐκήρυξαν
  choice: wakatangaza
  rationale: Kitenzi κηρύσσω kinamaanisha kutoa tangazo hadharani. “Wakatangaza” huhifadhi maana hiyo bila kuingiza kwa lazima dhana ya mahubiri ya ibada.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa ἵνα inatambulisha jambo lililotangazwa, yaani mwitikio uliotakiwa kwa wasikilizaji.
- source_word: μετανοῶσιν
  choice: watubu
  rationale: “Watubu” ni neno la kawaida, fupi na lenye uzito unaofaa kwa wito wa kubadili moyo, fikira na mwenendo na kumwelekea Mungu; halipunguzi maana kuwa kubadili mawazo tu.
theological_decisions:
- issue: Iwapo mtendaji aliyedokezwa katika μετανοῶσιν atajwe wazi
  choice: kwamba watu watubu
  alternative: kwamba watubu
  rationale: Kitenzi cha Kigiriki kiko katika wingi bila nomino iliyotajwa, na wahusika wanaokusudiwa ni wale waliosikia tangazo, si wanafunzi waliotangaza. Kutaja “watu” huondoa utata wa Kiswahili bila kuongeza fundisho lisilokuwapo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Nao … waka-” huunganisha mstari huu na simulizi lililotangulia; “kutubu” ni neno linaloeleweka kwa wasomaji wa kawaida na huhifadhi uzito wa μετανοέω.
