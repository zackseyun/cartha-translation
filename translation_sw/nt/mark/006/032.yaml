  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: sw
  text: Nao wakaondoka kwa mashua kwenda mahali pasipo na watu, wakiwa peke yao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa faragha” au “mahali pa nyika.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa faragha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Inaendeleza simulizi kwa njia ya kawaida na kuhifadhi mtiririko wa καί, huku ikirejelea kwa uwazi kundi lililotajwa kabla.
- source_word: ἀπῆλθον
  choice: wakaondoka
  rationale: Kitenzi hiki kinaonyesha kuondoka kutoka mahali walipokuwa; ‘wakaondoka’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν τῷ πλοίῳ
  choice: kwa mashua
  rationale: Ingawa muundo wa Kigiriki ni kihalisi ‘ndani ya mashua,’ Kiswahili hutumia kwa kawaida ‘kwa mashua’ kueleza chombo cha usafiri bila kubadili maana.
- source_word: εἰς ἔρημον τόπον
  choice: kwenda mahali pasipo na watu
  rationale: ἔρημος hapa huashiria mahali pa faragha, patupu, au pasipokaliwa na watu; usemi huu ni wazi na wa kawaida bila kulazimisha maana ya eneo la jangwani.
- source_word: κατ’ ἰδίαν
  choice: wakiwa peke yao
  rationale: Nahau hii huonyesha kuwa walikuwa kando na wengine au kwa faragha; ‘wakiwa peke yao’ inalingana na kiima cha wingi na kudumisha wazo la kujitenga.
