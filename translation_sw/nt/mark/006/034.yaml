base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: sw
  text: Aliposhuka mashuani, akaona umati mkubwa, akawahurumia kwa sababu walikuwa kama kondoo wasio na mchungaji.[a] Kisha akaanza kuwafundisha mambo mengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taswira ya “kondoo wasio na mchungaji” ina mwangwi wa lugha ya Biblia kuhusu watu wasiokuwa na uongozi mwaminifu; linganisha Hesabu 27:17; 1 Wafalme 22:17; Ezekieli 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Aliposhuka kutoka mashuani
  rationale: Kitenzi hiki kihalisi ni ‘alipotoka’; katika muktadha wa safari ya mashua katika Marko 6:32–33, kinamaanisha kutoka mashuani. Tafsiri hii inaweka wazi mazingira bila kuongeza wazo lisilokuwamo.
- source_word: πολὺν ὄχλον
  choice: umati mkubwa
  rationale: ὄχλος ni umati wa watu, na πολύς huonyesha ukubwa wake. ‘Umati mkubwa’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: akawahurumia
  rationale: Kitenzi kinaonyesha huruma ya ndani na yenye nguvu kwa watu hao. ‘Akawahurumia’ ni tafsiri ya asili katika Kiswahili na inamtaja wazi mlengwa wa huruma.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: kama kondoo wasio na mchungaji
  rationale: Inahifadhi tashbihi ya kichungaji bila kuifafanua moja kwa moja kuwa ukosefu wa uongozi wa kiroho.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: akaanza kuwafundisha mambo mengi
  rationale: Muundo wa Kigiriki unaonyesha mwanzo wa tendo la kufundisha, huku πολλά ikirejelea mambo mengi yaliyofundishwa.
theological_decisions:
- issue: Taswira ya kondoo wasio na mchungaji
  choice: Kuhifadhi maneno ‘kama kondoo wasio na mchungaji’ katika matini kuu.
  alternative: Kupanua kwa ufafanuzi, kama ‘kama watu wasiokuwa na uongozi wa kiroho.’
  rationale: Taswira hiyo ina mwangwi wa lugha ya Agano la Kale kuhusu watu wa Mungu na viongozi wao, lakini matini yenyewe haifafanui maana yake kwa kauli ya moja kwa moja. Kwa hiyo tashbihi na mvutano wake wa kitheolojia vinahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mashuani,’ ‘umati mkubwa,’ na ‘akawahurumia’ ni maneno yanayoeleweka kwa urahisi. Tanbihi ya Kiingereza yenye alama [a] kuhusu mbadala wa ‘huruma’ haikufuata mahali pa alama yake baada ya ‘went ashore’; kwa hiyo haikuhamishwa kama ilivyo. Tanbihi halali ya taswira ya kichungaji imepewa alama [a].
