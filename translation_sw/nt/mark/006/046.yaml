  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: sw
  text: Naye baada ya kuwaaga[a], alikwenda mlimani kusali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuagana nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi; “Naye” ni cha kawaida katika Kiswahili na huunganisha tendo hili na lililotangulia bila kuongeza msisitizo wa wakati.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: baada ya kuwaaga
  rationale: Kitenzi cha kati ἀποτάσσομαι pamoja na kiwakilishi cha dative humaanisha kuagana nao au kuwaaga. “Kuwaaga” ni usemi wa asili na wazi katika Kiswahili.
- source_word: ἀπῆλθεν
  choice: alikwenda
  rationale: Kitenzi kinaonyesha kuondoka na kwenda mahali pengine. Katika mfuatano huu, “alikwenda” ni ya asili; wazo la kuondoka tayari linaonekana katika kuagana.
- source_word: εἰς τὸ ὄρος
  choice: mlimani
  rationale: ὄρος inaweza kumaanisha mlima au eneo la milima. “Mlimani” huwasilisha mahali alikokwenda kwa Kiswahili cha kawaida bila kulazimisha kwamba alifika kileleni.
- source_word: προσεύξασθαι
  choice: kusali
  rationale: Infinitivu hii inaeleza kusudi la kwenda kwake. “Kusali” ni tafsiri ya moja kwa moja na ya kawaida ya προσεύχομαι katika Kiswahili.
theological_decisions:
- issue: Rejeo la τὸ ὄρος (“mlima”)
  choice: Kutafsiri kwa usemi wa mahali “mlimani” bila kuongeza maana ya kiishara au kiteolojia.
  alternative: “kwenye mlima ule” au kufasiri mlima kuwa mahali maalumu pa ufunuo
  rationale: Nakala ya Kigiriki ina kibainishi lakini haitaji mlima kwa jina wala kueleza umuhimu wake wa kiishara. “Mlimani” ni ya asili katika Kiswahili na haiongezi dai lisilomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. “Kuwaaga” ni cha kawaida zaidi, huku tanbihi ikihifadhi uwezekano wa kutafsiri tendo hilo kama kuagana nao.
