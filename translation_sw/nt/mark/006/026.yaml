id: MRK.6.26
reference: Mark 6:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: sw
  text: Mfalme akahuzunika sana, lakini kwa sababu ya viapo vyake na wale waliokuwa wameketi mezani[a], hakutaka kumkatalia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wale waliokuwa wameegemea mezani.” Wakati huo watu walikuwa na desturi ya kula wakiwa wameegemea.
    reason: lexical_alternative
  - marker: b
    text: Au “kumkataa” au “kukataa ombi lake.” Maana ni kwamba hakutaka kutangua aliyokuwa amemwahidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: akahuzunika sana
  rationale: Huwasilisha huzuni kubwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: γενόμενος
  choice: akahuzunika
  rationale: Mabadiliko ya hali yanawasilishwa kwa kitenzi cha tukio; muktadha unaonyesha kuwa ombi hilo lilimletea huzuni.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: Ni tafsiri ya kawaida ya neno la Kigiriki na inadumisha namna Marko anavyomtaja Herode.
- source_word: διὰ τοὺς ὅρκους
  choice: kwa sababu ya viapo vyake
  rationale: διά pamoja na hali ya accusative huonyesha sababu; kiwakilishi 'vyake' kinaeleweka kutoka katika muktadha.
- source_word: ἀνακειμένους
  choice: wale waliokuwa wameketi mezani
  rationale: Huwatambulisha waliokuwapo katika mlo kwa lugha ya asili ya Kiswahili; tanbihi huhifadhi desturi halisi ya kuegemea wakati wa kula.
- source_word: οὐκ ἠθέλησεν
  choice: hakutaka
  rationale: Huhifadhi maana ya nia au utashi, si kutokuwa na uwezo.
- source_word: ἀθετῆσαι αὐτήν
  choice: kumkatalia
  rationale: Katika muktadha huu humaanisha kutokubali ombi lake au kutangua ahadi iliyotolewa kwake.
theological_decisions:
- issue: Nguvu ya kimantiki ya kirai shirikishi γενόμενος περίλυπος
  choice: Kutumia 'lakini' kuonyesha tofauti kati ya huzuni ya mfalme na uamuzi wake
  alternative: 'Kuunganisha kwa mfuatano tu: ''Mfalme akahuzunika sana; kwa sababu...'''
  rationale: Kigiriki hakina kiunganishi cha wazi cha upinzani, lakini kirai shirikishi katika muktadha kinaweza kuwa na nguvu ya concessive. 'Lakini' huifanya sentensi iwe ya kawaida na huonyesha mvutano uliopo bila kudai kwamba huzuni yenyewe ndiyo sababu ya kukataa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. 'Waliokuwa wameketi mezani' ni ya kawaida zaidi kuliko tafsiri halisi ya mkao wa kula, ambao umehifadhiwa katika tanbihi.
