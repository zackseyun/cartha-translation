  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: sw
  text: Mitume wakakusanyika mbele ya Yesu, wakamweleza yote waliyoyafanya na yote waliyofundisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: wakakusanyika
  rationale: Wakati wa sasa umetumiwa katika simulizi kama wakati wa sasa wa kihistoria; wakati uliopita wa Kiswahili unasomeka kwa kawaida na kuhifadhi maana ya kukutana pamoja.
- source_word: οἱ ἀπόστολοι
  choice: Mitume
  rationale: Katika muktadha huu neno linawataja wale waliotumwa na Yesu kwa kazi maalumu; “Mitume” ni istilahi ya kawaida na sahihi ya Kiswahili.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kwa Yesu
  rationale: πρός pamoja na hali ya kushutumu huonyesha kuelekea kwa mtu; “kwa Yesu” ni usemi wa kawaida wa Kiswahili unaoonyesha walimwendea na kukusanyika kwake.
- source_word: ἀπήγγειλαν αὐτῷ
  choice: wakamweleza
  rationale: Kitenzi kinaonyesha kutoa taarifa baada ya kurudi. “Wakamweleza” ni cha asili zaidi katika Kiswahili kuliko “wakaripoti kwake,” huku kikihifadhi wazo la kutoa habari.
- source_word: πάντα ὅσα ἐποίησαν
  choice: mambo yote waliyokuwa wamefanya
  rationale: “Mambo yote” huhifadhi nguvu jumuishi ya πάντα, na umbo la “waliyokuwa wamefanya” linaonyesha matendo yaliyotangulia taarifa yao.
- source_word: καὶ ὅσα ἐδίδαξαν
  choice: na yote waliyokuwa wamefundisha
  rationale: Kurudia “yote” kunaakisi kurudiwa kwa ὅσα katika Kigiriki na kutofautisha kwa uwazi mambo waliyofanya na yale waliyofundisha.
theological_decisions:
- issue: Kutajwa kwa wanafunzi kama ἀπόστολοι
  choice: Mitume
  alternative: wajumbe; waliotumwa
  rationale: Hapa Marko analitumia kama jina la kundi lililotumwa na Yesu. “Mitume” huhifadhi jukumu hilo linalotambulika bila kulifanya kuwa neno la jumla tu la wajumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Muundo wa sentensi umehifadhi ufuatano wa simulizi na urudiaji wa vifungu viwili vya Kigiriki bila kuwa mzito kupita kiasi.
