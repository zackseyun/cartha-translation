  text: Akawaamuru wawaketishe watu wote katika makundi makundi juu ya nyasi za kijani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέταξεν
  choice: akawaamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “akawaamuru” kinahifadhi uzito huo kwa Kiswahili cha kawaida.
- source_word: αὐτοῖς
  choice: wa- katika “akawaamuru”
  rationale: Kiambishi hiki kinawakilisha wale waliopewa agizo, ambao katika muktadha ni wanafunzi, bila kuongeza nomino “wanafunzi” ambayo haipo katika mstari huu.
- source_word: ἀνακλῖναι πάντας
  choice: wawaketishe watu wote
  rationale: Muundo huu unatofautisha waliopokea agizo (αὐτοῖς) na watu wote (πάντας) waliopaswa kuketishwa kwa ajili ya mlo. “Wawaketishe” ni ya asili zaidi kuliko lugha ya kujilaza mezani katika Kiswahili cha sasa.
- source_word: συμπόσια συμπόσια
  choice: kwa makundi makundi
  rationale: Urudiaji wa “makundi” unaakisi urudiaji wa Kigiriki na maana yake ya kugawanywa katika vikundi tofauti kwa ajili ya kula.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: juu ya majani mabichi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nyasi au majani yaliyokuwa mabichi.
