  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: sw
  text: Naye akawaambia, “Njoni ninyi wenyewe mahali pa faragha pasipo na watu[a], mkapumzike kidogo.” Kwa maana watu wengi walikuwa wakija na kuondoka, nao hawakupata hata nafasi ya kula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa ukiwa” au “mahali palipojitenga.” Neno la Kigiriki linamaanisha eneo lililo mbali na watu au lisilokaliwa; si lazima liwe jangwa kwa maana ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au “hawakuwa hata na muda wa kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa mtindo wa masimulizi wa Kiswahili, ambao unaendeleza simulizi kwa kawaida bila kupoteza kazi yake katika habari.
- source_word: Δεῦτε
  choice: Njoni
  rationale: Ni amri ya mwaliko ya kuja; “Njoni” ni ya moja kwa moja na ya kawaida kwa watu wengi.
- source_word: ὑμεῖς αὐτοὶ
  choice: ninyi wenyewe
  rationale: Inahifadhi mkazo wa viwakilishi vya Kigiriki na kuonyesha kwamba wanafunzi ndio wanaoitwa waende mbali na umati.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Inaonyesha kwenda kando au kwa faragha; neno hili linahifadhi wazo la kujitenga na wengine bila kulichanganya na mahali penyewe.
- source_word: ἔρημον τόπον
  choice: mahali pasipo na watu
  rationale: Kifungu hiki humaanisha eneo lisilokaliwa au lililo mbali na watu, si lazima jangwa lenye mchanga. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: ἀναπαύσασθε
  choice: mkapumzike
  rationale: Inatoa mwaliko wa kuacha shughuli na kupata pumziko; umbo lenye “mka-” linaendana kwa kawaida na mwendo unaoelekezwa mahali pengine.
- source_word: ὀλίγον
  choice: kidogo
  rationale: Inaonyesha muda mfupi au kiasi kidogo cha pumziko kwa usemi mfupi na wa kawaida.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες
  choice: watu wengi walikuwa wakija na kuondoka
  rationale: Muundo wa “walikuwa wakija na kuondoka” unaonyesha mkondo unaoendelea wa watu kama zilivyo participio za Kigiriki.
- source_word: πολλοί
  choice: watu wengi
  rationale: Kivumishi hiki kinarejelea watu wanaokuja na kuondoka; kutaja “watu” wazi ni kwa kawaida zaidi katika Kiswahili.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: hawakupata hata nafasi ya kula
  rationale: “Nafasi” inawakilisha kwa usahihi wazo la kuwa na fursa au muda unaofaa, huku “hata” ikihifadhi mkazo wa οὐδέ.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na lugha inayoeleweka kwa wasomaji wa leo. Mkazo wa “ninyi wenyewe” na wazo tofauti la “faraghani” vimehifadhiwa badala ya kuvifupisha kuwa usemi mmoja.
