revisions:
- from: Kila mahali alipoingia—iwe ni vijijini, mijini, au mashambani—watu walikuwa wakiwaweka wagonjwa katika masoko, wakamsihi awaruhusu waguse hata upindo wa vazi lake.[a] Na wote waliougusa walikuwa wakiponywa.[b]
  to: Na kila mahali alipoingia—iwe ni vijijini, mijini, au maeneo ya mashambani—watu waliwaweka wagonjwa katika masoko, wakamsihi ili waguse hata upindo wa vazi lake.[a] Na wote waliomgusa walikuwa wakiponywa.[b]
  rationale: The revision removes an added implication that Jesus needed to permit the touch, restores the masculine Greek pronoun’s reference to Jesus, and corrects the related footnote. It retains the contextual sense of healing for ἐσῴζοντο, with a note preserving the broader ‘save’ lexical sense. The wording is smoothed into natural contemporary Standard East African Swahili without altering the verse’s meaning.
