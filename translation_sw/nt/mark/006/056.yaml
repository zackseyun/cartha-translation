id: MRK.6.56
reference: Mark 6:56
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: sw
  text: Na kila mahali alipoingia—iwe ni vijijini, mijini, au maeneo ya mashambani—watu waliwaweka wagonjwa katika masoko, wakamsihi ili waguse hata upindo wa vazi lake.[a] Na wote waliomgusa walikuwa wakiponywa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukingo wa vazi lake” au “pindo la vazi lake.” Neno la Kigiriki linaweza kumaanisha ukingo au upindo wa vazi, na katika muktadha wa Kiyahudi linaweza pia kudokeza vishada vya vazi.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “walikuwa wakiokolewa” (ἐσῴζοντο). Katika muktadha huu, kitenzi hicho kinamaanisha kuponywa au kufanywa wazima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: Kila mahali alipoingia
  rationale: Muundo huu unaonyesha mahali popote bila kubainishwa na pia tendo la kawaida lililorudiwa; Kiswahili hiki ni cha asili na wazi.
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: vijijini, mijini, au mashambani
  rationale: Maneno haya yanatofautisha vijiji, miji, na maeneo ya mashambani; ἀγρούς hapa inaeleweka kwa upana kama maeneo ya nje ya miji, si lazima mashamba binafsi.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: katika masoko
  rationale: ἀγορά inaweza kuwa soko au uwanja wa hadhara wa mji. “Masoko” ni lugha ya kawaida na inafaa mahali pa umma palipotajwa.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: watu walikuwa wakiwaweka wagonjwa
  rationale: Wakati usiotimilifu unaonyesha tendo lililorudiwa katika maeneo mbalimbali. “Wagonjwa” huwasilisha kwa ufupi wale waliokuwa dhaifu au wagonjwa.
- source_word: παρεκάλουν αὐτόν
  choice: wakamsihi
  rationale: παρακαλέω katika muktadha huu ni ombi la dhati; “kusihi” linaonyesha uzito bila kuwa la kupita kiasi.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: awaruhusu waguse hata
  rationale: κἄν huonyesha ombi la kiwango cha chini—hata kugusa tu. Kitenzi “awaruhusu” kinaweka ombi katika Kiswahili cha asili bila kudai kwamba Yesu alikuwa amewazuia.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: upindo wa vazi lake
  rationale: κράσπεδον inaweza kumaanisha ukingo, upindo, au kishada cha vazi. “Upindo” ni wazi katika matini kuu huku tanbihi ikihifadhi uwezekano wa kishada.
- source_word: ἥψαντο αὐτοῦ
  choice: waliougusa
  rationale: Kisarufi αὐτοῦ inaweza kuelekezwa kwake, yaani “waliomgusa,” lakini muktadha wa karibu unataja upindo wa vazi. “Waliougusa” huendeleza rejeo hilo kwa asili; tanbihi inahifadhi uwezekano mwingine.
- source_word: ἐσῴζοντο
  choice: walikuwa wakiponywa
  rationale: σῴζω ina wigo wa kuokoa, kusalimisha, na kuponya. Kwa kuwa wanaotajwa ni wagonjwa, maana ya kimuktadha ni kuponywa, huku tanbihi ikihifadhi maana halisi pana.
theological_decisions:
- issue: Maana ya ἐσῴζοντο (kutokana na σῴζω)
  choice: walikuwa wakiponywa
  alternative: walikuwa wakiokolewa / walikuwa wakifanywa wazima
  rationale: Muktadha wa wagonjwa unaelekeza kwenye uponyaji wa mwili. Tafsiri hii haibebi kimakusudi maana maalumu ya wokovu wa kiroho, lakini tanbihi inaonyesha kuwa kitenzi cha Kigiriki kina wigo mpana.
- issue: Kitu kilichoguswa katika ἥψαντο αὐτοῦ
  choice: waliougusa, yaani upindo uliotajwa
  alternative: waliomgusa Yesu
  rationale: Kiambishi cha Kigiriki kinaweza kumrejelea Yesu, lakini sentensi iliyotangulia inaeleza kugusa upindo wa vazi lake. Matini kuu inafuata rejeo la karibu, huku tanbihi ikihifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa “walikuwa wakiwaweka” na “walikuwa wakiponywa” umehifadhi hali ya matendo yaliyokuwa yakirudiwa katika muhtasari huu wa simulizi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
