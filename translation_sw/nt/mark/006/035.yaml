  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: sw
  text: Kulipokuwa tayari kumechelewa sana, wanafunzi wake wakamjia wakamwambia, “Mahali hapa ni pasipo na watu, na tayari kumechelewa sana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili linaonyesha kwamba wakati ulikuwa umesonga; “tayari” ni tafsiri ya kawaida na ya moja kwa moja katika sehemu zote mbili.
- source_word: ὥρας πολλῆς γενομένης
  choice: Kulipokuwa tayari kumechelewa sana
  rationale: Hii ni kauli huru ya hali katika umilikishi inayoonyesha kwamba muda wa siku ulikuwa umeenda sana. Tafsiri hii ni ya asili katika Kiswahili na inadokeza uzito wa πολλῆς bila kunakili muundo wa Kigiriki kikasuku.
- source_word: προσελθόντες αὐτῷ
  choice: wakamjia
  rationale: Kitenzi kina maana ya kumwendea au kumkaribia mtu; “wakamjia” ni kifupi, cha asili, na kinaendeleza simulizi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hii ni njia ya kawaida na wazi ya kuonyesha umilikishi katika Kiswahili.
- source_word: ἔλεγον
  choice: na kusema
  rationale: Ingawa hali isiyotimilika inaweza kumaanisha tendo lililoendelea, katika mfuatano huu wa simulizi “na kusema” ni ya asili na haiongezi wazo lisilo hakika la kurudia-rudia.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Mahali hapa ni pasipo na watu
  rationale: ἔρημος hapa hueleza eneo la faragha au lisilokaliwa, si lazima eneo lililoachwa baada ya kuwa na watu. “Pasipo na watu” linaeleweka kwa urahisi na linahifadhi maana hiyo.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: na tayari kumechelewa sana
  rationale: Kauli hii inarudia kwamba muda wa siku ulikuwa umeenda sana. Kiswahili hiki ni cha kawaida na kinaonyesha msisitizo wa πολλή.
