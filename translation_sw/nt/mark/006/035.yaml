translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetolewa kwa mtiririko wa kawaida, huku urudiaji wa kuchelewa sana katika chanzo ukihifadhiwa.
