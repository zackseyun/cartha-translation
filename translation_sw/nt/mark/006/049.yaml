  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: sw
  text: Lakini walipomwona akitembea juu ya bahari, walidhani kwamba ni mzuka[a], wakapiga kelele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzimu” au “mwonekano kama wa mzuka.” Neno la Kigiriki φάντασμα hurejelea mwonekano wa mzuka au wa kutisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini ... wao (imewakilishwa katika kiambishi cha kitenzi)
  rationale: δέ inaonyesha geuko dogo la simulizi kuelekea mwitikio wa wanafunzi; Kiswahili cha asili kinaonyesha mtenda kwa kiambishi wa- bila kulazimisha kiwakilishi tofauti.
- source_word: ἰδόντες αὐτὸν
  choice: walipomwona
  rationale: 'Kauli ya wakati yenye -lipo- inawasilisha vizuri nguvu ya muda ya kishiriki cha aoristi: walipomwona Yesu.'
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: akitembea juu ya bahari
  rationale: ἐπί pamoja na muktadha huu hueleza kutembea juu ya uso wa maji. “Bahari” hudumisha neno θάλασσα na jina la kawaida la Bahari ya Galilaya.
- source_word: ἔδοξαν
  choice: walidhani
  rationale: δοκέω hapa humaanisha kufikiri au kudhani, hasa kwa mtazamo uliokuwa umekosewa.
- source_word: ὅτι φάντασμά ἐστιν
  choice: ni mzimu
  rationale: φάντασμα ni mwonekano wa kiroho au wa kutisha. “Mzimu” ni neno linaloeleweka kwa urahisi katika Kiswahili, huku tanbihi ikihifadhi mbadala za kileksika.
- source_word: καὶ ἀνέκραξαν
  choice: wakapiga kelele
  rationale: ἀνακράζω hueleza kutoa kilio kikubwa. “Wakapiga kelele” huonyesha ukali huo bila kuongeza namna mahsusi ya sauti kuliko ilivyo katika Kigiriki.
theological_decisions:
- issue: Mahali na namna ya kutembea kwa Yesu
  choice: akitembea juu ya bahari
  alternative: akitembea kando ya bahari
  rationale: Katika muktadha wa simulizi, ἐπὶ τῆς θαλάσσης humaanisha juu ya uso wa maji, si kando ya bahari. Tafsiri hii hudumisha maana ya wazi ya tukio bila kuliongezea maelezo.
- issue: Asili ya kile wanafunzi walidhani walikiona
  choice: mzimu
  alternative: mzuka; mwonekano wa kiroho
  rationale: Kigiriki φάντασμα hakifafanui kwa undani asili ya mwonekano huo. “Mzimu” huwasilisha dhana ya jumla ya kiumbe au mwonekano wa kiroho bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walipomwona ... walidhani ... wakapiga kelele” ni wa kawaida na wenye mtiririko wa simulizi. Alama ya tanbihi imewekwa baada ya “mzimu,” neno ambalo tanbihi inalifafanua.
