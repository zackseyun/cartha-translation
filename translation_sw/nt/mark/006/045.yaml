base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: sw
  text: Mara moja akawalazimisha wanafunzi wake waingie mashuani na watangulie kwenda ng’ambo, kuelekea Bethsaida[a], mpaka yeye mwenyewe alipokwisha kuuaga umati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda Bethsaida.” Kihusishi cha Kigiriki kinaweza kuonyesha kwa ujumla mwelekeo (“kuelekea”) au kwa namna mahususi zaidi mahali pa kufikiwa (“kwenda”).
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, Kigiriki kinasema “mpaka yeye mwenyewe anauaga umati”; kitenzi kiko katika wakati wa sasa ndani ya kishazi cha wakati. Kiswahili cha simulizi kwa kawaida hutumia wakati uliopita hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Huhifadhi kasi na msisitizo wa simulizi la Marko kwa Kiswahili cha kawaida.
- source_word: ἠνάγκασεν
  choice: akawalazimisha
  rationale: Kitenzi hiki kinaonyesha shinikizo au ulazima mkubwa; ‘akawalazimisha’ huhifadhi nguvu hiyo bila kudai wazi kwamba nguvu ya kimwili ilitumika.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: Hili ni neno la kawaida na sahihi kwa uhusiano wa mwalimu na wanafunzi wake katika Injili.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: waingie mashuani
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza kuingia ndani ya chombo hicho.
- source_word: προάγειν
  choice: watangulie kwenda
  rationale: Huhifadhi maana ya kwenda mbele kabla ya Yesu, si kwenda tu.
- source_word: εἰς τὸ πέραν
  choice: kwenda ng’ambo
  rationale: Katika muktadha huu usemi huo unaelekea upande mwingine wa ziwa.
- source_word: πρὸς Βηθσαϊδάν
  choice: kuelekea Bethsaida
  rationale: ‘Kuelekea’ huhifadhi wazo la mwelekeo bila kulazimisha kwamba kufika Bethsaida ndilo lengo lililoelezwa kwa uhakika.
- source_word: ἕως
  choice: hadi
  rationale: Huhifadhi mpaka wa wakati unaoonyeshwa na kiunganishi cha Kigiriki.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi kwamba Yesu binafsi alibaki kuushughulikia umati.
- source_word: ἀπολύει
  choice: alipouaga
  rationale: Katika muktadha wa simulizi, wakati uliopita ni wa asili kwa Kiswahili; ‘kuaga’ hapa huonyesha kuwa aliwaruhusu watu waondoke na kuwaacha waende.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Ni tafsiri ya kawaida na yenye heshima kwa kundi kubwa la watu.
