  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: sw
  text: Naye akaleta kichwa cha Yohana juu ya sinia[a], akampa yule msichana kichwa hicho; naye msichana yule akampa mama yake kichwa hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye trei” au “kwenye sahani.” Neno la Kigiriki πίναξ humaanisha sinia, sahani, au trei ya kuandalia chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: akaleta
  rationale: Kitenzi hiki kinaeleza tendo la kukileta kichwa mahali pa karamu; “akaleta” ni cha kawaida na hakiongezi namna ya kukibeba.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kichwa chake
  rationale: Hii ni tafsiri ya kawaida ya umilikaji; katika muktadha, kiwakilishi kinamrejelea Yohana Mbatizaji.
- source_word: ἐπὶ πίνακι
  choice: juu ya sinia
  rationale: πίναξ hapa ni chombo kipana cha kuandalia au kubebea chakula; “sinia” linafaa katika mazingira ya karamu, huku “juu ya” ikihifadhi taswira ya kitu kilichowekwa juu yake.
- source_word: ἔδωκεν
  choice: akampa
  rationale: “Akampa” ni tafsiri ya moja kwa moja na ya kawaida, na imerudiwa katika vifungu vyote viwili kama ilivyo katika Kigiriki.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: yule msichana / msichana
  rationale: κοράσιον humaanisha msichana, mara nyingi mwenye umri mdogo; “msichana” ni la sasa na la kawaida bila kuongeza umri usiotajwa wazi.
- source_word: τῇ μητρὶ αὐτῆς
  choice: mama yake
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha mlengwa na umilikaji, na inadumisha mlolongo wa kukabidhi.
