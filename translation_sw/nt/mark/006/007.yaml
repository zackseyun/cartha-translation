  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: sw
  text: Akawaita wale Kumi na Wawili, akaanza kuwatuma wawili wawili[a], na alikuwa akiwapa mamlaka juu ya roho wachafu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jozi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nguvu juu ya roho wachafu.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: akawaita
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi unasikika kwa kawaida zaidi katika Kiswahili na unaepuka mabadiliko yasiyo laini ya nyakati pamoja na ἤρξατο.
- source_word: τοὺς δώδεκα
  choice: wale Kumi na Wawili
  rationale: Ni jina linalotambulisha kundi maalumu la Yesu; herufi kubwa zinaonyesha matumizi yake kama cheo cha kundi.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: akaanza kuwatuma
  rationale: Linahifadhi maana ya kuanza tendo la kuwatuma kwa kazi bila kuingiza hapa jina la cheo ‘mitume’.
- source_word: δύο δύο
  choice: wawili wawili
  rationale: Urudiaji huu wa Kiswahili unaonyesha kwa kawaida mgawanyo wa watu katika jozi na kuhifadhi mpigo wa usemi wa Kigiriki.
- source_word: ἐδίδου
  choice: alikuwa akiwapa
  rationale: Muundo huu unaonyesha tendo lililoendelea au lililoambatana na kuwatuma, kama inavyodokezwa na wakati usiotimilika wa Kigiriki.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: ‘Mamlaka’ huonyesha uwezo au haki waliyopewa na Yesu, si nguvu ya asili waliyo nayo wenyewe.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: roho wachafu
  rationale: Linahifadhi istilahi ya Marko bila kuibadili kuwa tafsiri finyu zaidi ya ‘pepo’.
theological_decisions:
- issue: Asili ya ἐξουσίαν ambayo Yesu aliwapa wale Kumi na Wawili
  choice: mamlaka juu ya roho wachafu
  alternative: nguvu dhidi ya roho wachafu
  rationale: ‘Mamlaka’ huhifadhi wazo la ruhusa na uwezo uliokabidhiwa na Yesu. ‘Juu ya’ pia hudumisha uhusiano unaoonyeshwa na genitivi bila kufafanua kupita kiasi namna mamlaka hiyo ilivyotekelezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa ‘aka-’ unaendeleza simulizi kwa ulaini; ‘alikuwa akiwapa’ huhifadhi hali endelevu ya ἐδίδου. Kiwakilishi ‘wale’ kinasaidia kufanya ‘Kumi na Wawili’ kuwa jina la kundi linalotambulika.
