  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: sw
  text: Naye alikuwa akiwaambia, “Popote mtakapoingia katika nyumba, kaeni humo mpaka mtakapoondoka mahali hapo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mpaka mtakapotoka huko.” Kigiriki kinasema kihalisi zaidi, “mpaka mtakapoondoka kutoka huko,” na kinaweza kueleweka kuwa kuondoka katika nyumba hiyo au katika eneo hilo; katika muktadha huu huenda kinarejelea kuondoka katika eneo hilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: Naye alikuwa akiwaambia
  rationale: Muundo huu unadumisha hali ya kitenzi cha wakati usiotimilika, ambayo inaweza kuonyesha kwamba alikuwa akiendelea au akirudia kuwaambia, bila kuifanya kauli kuwa tukio moja tu la ghafla.
- source_word: Ὅπου ἐὰν
  choice: Popote
  rationale: Hutoa maana ya uhusiano usio na mahali maalumu—‘mahali popote’—kwa Kiswahili cha kawaida na kifupi.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: mtakapoingia katika nyumba
  rationale: ‘Kuingia katika’ huhifadhi mwendo wa kuingia ndani unaoonyeshwa na εἰς, huku ‘nyumba’ ikitanguliza mahali pa kukaa kuliko dhana pana ya jamaa wa nyumbani.
- source_word: ἐκεῖ μένετε
  choice: kaeni humo
  rationale: ‘Kaeni’ ni agizo la kawaida la kubaki mahali, na ‘humo’ hurejelea kwa kawaida ndani ya nyumba iliyotajwa.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: mpaka mtakapoondoka mahali hapo
  rationale: Katika muktadha wa maagizo kuhusu malazi, usemi huu unaeleweka kwa kawaida kuwa waondoke katika eneo walilofikia, si watoke nje ya nyumba kwa muda tu. Tanbihi inahifadhi tafsiri ya karibu zaidi na muundo wa Kigiriki.
theological_decisions:
- issue: Upeo wa ἐκεῖθεν katika kauli ya kuondoka
  choice: ‘mahali hapo,’ ikimaanisha eneo walilokuwa wakihudumu
  alternative: ‘huko,’ ambayo inaweza kueleweka kuwa nyumba yenyewe
  rationale: Muktadha ni agizo la kubaki katika nyumba ileile wakati wa huduma mahali fulani. Hata hivyo, kwa kuwa Kigiriki hakilitaji wazi eneo au mji, tanbihi inahifadhi uwezekano wa tafsiri iliyo halisi zaidi bila kuuficha utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alikuwa akiwaambia’ huhifadhi hali endelevu au ya kurudiwa ya ἔλεγεν; ‘kaeni humo’ ni agizo la kawaida na linaloeleweka kwa urahisi. Tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
