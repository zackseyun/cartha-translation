translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye staha. ‘Wakaketi’ ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja ya mkao wa kuegemea wakati wa mlo; tanbihi inadumisha taswira isiyo ya kawaida ya πρασιαὶ πρασιαί.
