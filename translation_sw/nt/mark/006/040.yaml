translation:
  language: sw
  text: Nao wakaketi katika makundi ya mia moja mia moja na ya hamsini hamsini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “matuta ya bustani, matuta ya bustani,” taswira inayoonyesha safu au sehemu zilizopangwa kwa utaratibu.
