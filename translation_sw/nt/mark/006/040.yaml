lexical_decisions:
- source_word: ἀνέπεσαν
  choice: wakaketi
  rationale: Katika muktadha wa mlo, kitenzi hiki humaanisha kuchukua nafasi au kuegemea kwa ajili ya kula. Kwa kuwa Kiswahili cha kawaida hakitumii kwa urahisi ‘kuegemea’ kueleza namna ya kukaa mezani katika mazingira haya, ‘wakaketi’ ni ya asili na wazi bila kupoteza tendo kuu.
- source_word: πρασιαὶ πρασιαὶ
  choice: kwa makundi
  rationale: Nomino iliyorudiwa kihalisi humaanisha ‘matuta ya bustani’ na hapa inaonyesha watu waliopangwa katika sehemu au makundi yenye utaratibu. ‘Kwa makundi’ hutoa maana ya kimuktadha, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: κατὰ ἑκατὸν
  choice: la mia moja
  rationale: κατά pamoja na namba ina maana ya mgawanyo; usemi huu unaonyesha makundi ya watu mia moja. Umoja wa ‘la’ unarejelea ‘kundi’ lililotajwa.
- source_word: κατὰ πεντήκοντα
  choice: la hamsini
  rationale: Kama katika kishazi kilichotangulia, κατά inaonyesha mgawanyo katika makundi ya watu hamsini na kudumisha ulinganifu wa sentensi.
