  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: sw
  text: Kwa maana wote walimwona, wakafadhaika. Lakini mara moja akazungumza nao, akawaambia, “Jipeni moyo! Ni mimi. Msiogope.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: wakafadhaika
  rationale: Kitenzi hiki kinaonyesha kushtuka na kuvurugika moyoni; “wakafadhaika” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: Θαρσεῖτε
  choice: Jipeni moyo!
  rationale: Amri hii inawataka wawe na ujasiri; “Jipeni moyo” ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya agizo.
- source_word: ἐγώ εἰμι
  choice: Ni mimi
  rationale: Katika muktadha wa kutambuliwa kwa mzungumzaji, huu ndio usemi wa kawaida na sahihi wa Kiswahili, huku ukiacha mwangwi wowote mpana wa maneno ya Kigiriki utokane na muktadha badala ya sarufi isiyo ya asili.
- source_word: μὴ φοβεῖσθε
  choice: Msiogope
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na iliyo katika wingi kama chanzo.
theological_decisions:
- issue: Iwapo ἐγώ εἰμι itafsiriwe kama kauli ya utambulisho wa kawaida au “Mimi niko” yenye mwangwi wa jina la Mungu
  choice: Ni mimi
  alternative: Mimi niko
  rationale: Muktadha wa karibu ni Yesu kujitambulisha kwa wanafunzi waliodhani wanaona mzimu. Kiswahili “Ni mimi” huhifadhi maana hiyo wazi bila kulazimisha dai la kitheolojia; mwangwi unaowezekana wa kifungu hicho unabaki katika muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha, na chenye hadhi. Muundo wa simulizi umehifadhiwa kwa vitenzi vinavyofuatana kiasili, bila kuiga kwa ugumu wakati uliopo wa kihistoria wa Kigiriki.
