  text: Mara mfalme akamtuma askari wa ulinzi[a] na kumwamuru alete kichwa chake. Naye akaenda akamkata kichwa gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtekelezaji wa hukumu” au “mlinzi wa mtawala.” Kigiriki kimetumia neno lililokopwa kutoka Kilatini (spekoulatōr) kwa askari wa kikosi cha ulinzi wa mtawala, ambaye katika muktadha huu alitekeleza amri ya kuuawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Huonyesha utendaji wa haraka unaosisitizwa katika simulizi la Marko, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: βασιλεὺς
  choice: mfalme
  rationale: Huhifadhi jina la cheo lililotumiwa moja kwa moja katika Kigiriki bila kulisahihisha kuwa cheo cha kihistoria cha Herode Antipa.
- source_word: σπεκουλάτορα
  choice: askari wa ulinzi
  rationale: Neno la Kigiriki lililokopwa kutoka Kilatini humaanisha mwanajeshi wa kikosi cha ulinzi wa mtawala; katika muktadha huu ndiye anayetekeleza hukumu ya kifo. Tafsiri hii huhifadhi utambulisho wake badala ya kumfafanua tu kwa kazi aliyofanya mara hii.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: kumwamuru alete
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya amri na muundo wa kumwagiza askari alete kichwa.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kichwa chake
  rationale: Ni Kiswahili cha kawaida; kiwakilishi kinamrejelea Yohana kutokana na muktadha.
- source_word: ἀπεκεφάλισεν
  choice: akamkata kichwa
  rationale: Hutoa kwa uwazi tendo la kukata kichwa kwa lugha ya kawaida na yenye hadhi kuliko istilahi ya kitaalamu.
- source_word: ἐν τῇ φυλακῇ
  choice: gerezani
  rationale: Ni namna ya kawaida na mahususi ya Kiswahili ya kuonyesha mahali tendo hilo lilipotokea.
