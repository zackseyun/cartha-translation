  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: sw
  text: Lakini akawajibu, “Ninyi wenyewe wapeni chakula.” Wakamwambia, “Je, twende tukanunue mikate[a] ya dinari mia mbili[b], halafu tuwape wale?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate.” Neno la Kigiriki ἄρτους linaweza kumaanisha “mkate” au “mikate.”
    reason: lexical_alternative
  - marker: b
    text: Dinari moja ilikuwa mshahara wa kawaida wa siku moja kwa mfanyakazi au mwanajeshi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akawajibu
  rationale: Katika Kiswahili, ‘akawajibu’ huwasilisha kwa kawaida jozi ya kimasimulizi ‘alijibu akasema’ bila uradidi usio wa lazima.
- source_word: Δότε ... ὑμεῖς
  choice: Ninyi wenyewe wapeni
  rationale: Kiwakilishi cha wazi ὑμεῖς kina mkazo; ‘ninyi wenyewe’ huhifadhi mkazo huo, huku ‘wapeni’ ikihifadhi amri ya moja kwa moja.
- source_word: φαγεῖν
  choice: chakula
  rationale: Katika muundo wa Kiswahili ‘wapeni chakula’ ni njia ya kawaida ya kueleza ‘wapeni kitu cha kula’ bila kubadili maana.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Je, twende tukanunue
  rationale: 'Muundo huu wa swali huwasilisha kwa kawaida participio inayofuatwa na subjunktivi ya mashauriano: ‘Je, twende tukafanye...?’'
- source_word: δηναρίων διακοσίων
  choice: ya dinari mia mbili
  rationale: Genitivi inaonyesha bei; ‘ya dinari mia mbili’ ni usemi wa kawaida wa Kiswahili unaoonyesha mikate ya thamani hiyo.
- source_word: ἄρτους
  choice: mikate
  rationale: Wingi wa ἄρτος umehifadhiwa kwa ‘mikate’; tanbihi inaonyesha kwamba neno hilo pia linaweza kueleweka kwa maana ya jumla ya ‘mkate.’
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: halafu tuwape wale
  rationale: Huhifadhi kitenzi ‘kutoa/kupa’ na mfuatano wa tendo, huku chakula kinachotolewa kikieleweka wazi kutokana na ‘mikate.’
