  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: sw
  text: Waache waende[a] katika maeneo ya mashambani na vijiji vya jirani wakajinunulie kitu cha kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa asili zaidi, “Waondoe, ili baada ya kwenda katika mashamba na vijiji vinavyozunguka, wajinunulie kitu cha kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Waache waende
  rationale: Katika muktadha huu kitenzi kina maana ya kuwaruhusu au kuwaagiza watu waondoke; usemi huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya amri.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi la kuwaacha waende.
- source_word: ἀπελθόντες
  choice: waende
  rationale: Ingawa kimuundo ni umbo la kushiriki lenye maana ya ‘baada ya kwenda,’ Kiswahili cha kawaida kinaweza kuliunganisha na kishazi cha kusudi bila kupoteza mpangilio wa tendo.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: mashamba na vijiji vya jirani
  rationale: ἀγροί inaweza kumaanisha mashamba au maeneo ya mashambani, huku κύκλῳ ikionyesha maeneo yanayozunguka; ‘vya jirani’ ni usemi wa asili unaohifadhi maana hiyo.
- source_word: ἀγοράσωσιν
  choice: wakajinunulie
  rationale: Huonyesha kununua, na umbo la kujinunulia linahifadhi ἑαυτοῖς, yaani kununua kwa manufaa yao wenyewe, huku ‘-ka-’ ikionyesha hatua inayofuata.
- source_word: τί φάγωσιν
  choice: chakula
  rationale: Kirai hiki kinamaanisha kitu cha kula; ‘chakula’ ni tafsiri fupi na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waache waende’ ni cha kawaida kuliko ‘waondoe’ katika muktadha huu, huku tanbihi ikihifadhi tafsiri rasmi zaidi na mpangilio wa kishiriki cha Kigiriki.
