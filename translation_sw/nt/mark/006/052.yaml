base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: sw
  text: Kwa maana hawakuelewa kuhusu ile mikate[b], bali mioyo yao ilikuwa migumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mioyo yao ilikuwa imekakamaa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawakutambua maana ya ile mikate.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: hawakuelewa
  rationale: Kitenzi hiki humaanisha kuelewa au kutambua maana ya jambo; “hawakuelewa” ni Kiswahili cha kawaida kinachohifadhi kushindwa kwao kutambua.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: kuhusu ile mikate
  rationale: Kirai hiki kinaelekeza kwenye tukio la mikate na maana yake. “Kuhusu ile mikate” ni cha asili na hakifafanui kimabavu kile ambacho mikate hiyo iliashiria.
- source_word: ἄρτοις
  choice: mikate
  rationale: Wingi wa neno la Kigiriki unarejelea mikate maalumu ya muujiza wa kulisha watu, kwa hiyo “mikate” ni sahihi kuliko umoja wa jumla “mkate.”
- source_word: καρδία
  choice: mioyo
  rationale: Ingawa Kigiriki kina umoja wa kijumla, wingi “mioyo yao” ni wa kawaida zaidi katika Kiswahili kwa kundi la watu na bado huonyesha hali yao ya ndani, ikiwemo ufahamu na mwelekeo.
- source_word: πεπωρωμένη
  choice: ilikuwa imekuwa migumu
  rationale: Kauli timilifu inaonyesha hali iliyokuwapo kutokana na kufanywa au kuwa migumu. Usemi huu huhifadhi sitiari ya ugumu wa kiroho bila kutaja chanzo chake.
- source_word: ἀλλ’ ἦν
  choice: bali ... ilikuwa
  rationale: “Bali” huonyesha tofauti kati ya kutoelewa kwao na hali ya mioyo yao; “ilikuwa” huhifadhi maelezo ya hali yaliyomo katika kitenzi cha Kigiriki.
theological_decisions:
- issue: Asili ya hali ya wanafunzi katika πεπωρωμένη
  choice: mioyo yao ilikuwa imekuwa migumu
  alternative: mioyo yao ilikuwa imekakamaa
  rationale: Tafsiri inadumisha picha ya kutokuwa na mwitikio wa kiroho bila kuamua kwamba ugumu huo ulikuwa hukumu ya Mungu au kutaja chanzo kingine ambacho mstari wenyewe hautaji.
- issue: Maana ya kushindwa kuelewa kuhusu mikate
  choice: hawakuelewa kuhusu ile mikate
  alternative: hawakutambua maana ya ile mikate
  rationale: Chaguo kuu linahifadhi kwa upana utata wa συνῆκαν na ἐπὶ τοῖς ἄρτοις; tanbihi inaeleza uwezekano wa maana ya kutotambua umuhimu wa tukio bila kuufanya kuwa ufafanuzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Ile mikate” hurejelea wazi mikate iliyotajwa katika simulizi lililotangulia. Wingi “mioyo yao” umetumiwa kwa ufasaha wa Kiswahili, ingawa Kigiriki kina umoja wa kijumla “moyo wao.”
