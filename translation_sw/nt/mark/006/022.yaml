base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: sw
  text: Binti ya Herodia[a] alipoingia na kucheza, akawapendeza Herode na wale waliokuwa wameketi pamoja na Herode mezani, mfalme akamwambia msichana huyo, “Omba chochote unachotaka, nami nitakupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati au mapokeo husoma kwa namna inayoweza kumaanisha “binti yake, Herodia,” badala ya “binti ya Herodia.” Maandishi ya Kigiriki yaliyofuatwa hapa yanasema “binti ya Herodia.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθούσης
  choice: alipoingia
  rationale: Muundo wa wakati unaotokana na kitenzi shirikishi cha aoristi katika genitive absolute umetafsiriwa kwa Kiswahili cha kawaida kama “alipoingia.”
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: binti ya Herodia mwenyewe
  rationale: Muundo wa genitive unaeleweka kiasili kuwa binti wa Herodia; “mwenyewe” linawakilisha mkazo wa αὐτῆς bila kubadili uhusiano huo.
- source_word: ὀρχησαμένης
  choice: kucheza
  rationale: Katika muktadha huu kitenzi kinamaanisha kucheza ngoma, na “kucheza” ni usemi wa kawaida usioongeza maelezo yasiyokuwamo.
- source_word: ἀρεσάσης
  choice: akawapendeza
  rationale: Hutoa maana ya moja kwa moja ya kuwapendeza Herode na wageni wake bila kuongeza kiwango cha hisia.
- source_word: τοῖς συνανακειμένοις
  choice: wale waliokuwa wameketi pamoja naye mezani
  rationale: Huhifadhi picha ya wageni wa karamu waliokuwa pamoja naye mezani, huku Kiswahili cha asili kikiepuka tafsiri ngumu ya mkao wa kale wa kuegemea wakati wa kula.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: mfalme akamwambia
  rationale: βασιλεύς imetafsiriwa moja kwa moja kuwa “mfalme,” bila kuibadili kuwa cheo cha kihistoria cha mtawala wa robo.
- source_word: τῷ κορασίῳ
  choice: msichana huyo
  rationale: κοράσιον humaanisha msichana; “huyo” humrejelea kwa uwazi binti aliyetajwa bila kutumia lugha ya kizamani.
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: Niombe chochote unachotaka
  rationale: Huwasilisha amri na uhuru mpana wa ombi kwa Kiswahili cha sasa na cha kawaida.
- source_word: δώσω σοι
  choice: nami nitakupa
  rationale: Kiambishi cha kitu katika “nitakupa” kinarejelea kwa kawaida chochote kitakachoombwa.
theological_decisions:
- issue: Cheo βασιλεύς kinapotumiwa kwa Herode Antipa
  choice: mfalme
  alternative: mtawala wa robo; mtawala
  rationale: Tafsiri inafuata jina la cheo lililotumiwa katika simulizi la Marko badala ya kulisahihisha kwa istilahi ya kihistoria kutoka nje ya kifungu.
- issue: Utambulisho wa msichana katika tofauti ya maandishi
  choice: binti ya Herodia mwenyewe
  alternative: binti yake, Herodia
  rationale: Maandishi ya SBLGNT yaliyotolewa yanaunga mkono uhusiano wa kumiliki unaomtambulisha msichana kama binti ya Herodia; uwepo wa usomaji mwingine umehifadhiwa katika tanbihi bila kuingizwa kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waliokuwa wameketi pamoja naye mezani” ni usemi unaoeleweka kwa urahisi; desturi ya kale ya kuegemea mezani haijafanywa kuwa jambo kuu. Alama ya tanbihi [a] imewekwa baada ya tendo la kucheza, sambamba na safu ya mashauriano, ingawa tanbihi yenyewe inahusu utambulisho wa binti.
