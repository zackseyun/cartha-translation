id: MRK.6.41
reference: Mark 6:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: sw
  text: Kisha akaitwaa ile mikate mitano na wale samaki wawili, akatazama juu mbinguni, akabariki[a], akaimega mikate, na akaendelea kuwapa wanafunzi wake ili waiweke mbele ya watu; pia akawagawia wote wale samaki wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akashukuru.” Kitenzi cha Kigiriki kinamaanisha “alibariki,” lakini katika muktadha wa mlo maana yake inaweza kukaribiana na kutoa shukrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: akaitwaa
  rationale: Kirai cha wakati uliopita kinaanzisha mfuatano wa matendo; ‘akaitwaa’ ni cha asili katika simulizi na kinaonyesha kuchukua mikate pamoja na samaki kama jumla iliyotajwa.
- source_word: ἄρτους
  choice: mikate
  rationale: Nomino iliyohesabiwa hapa inamaanisha mikate mitano, si mkate kama chakula kwa ujumla.
- source_word: ἰχθύας
  choice: samaki
  rationale: Tafsiri ya moja kwa moja ya wingi katika muktadha huu.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: akatazama juu mbinguni
  rationale: Inaonyesha kuinua macho kuelekea mbinguni kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: εὐλόγησεν
  choice: akabariki
  rationale: Huhifadhi kitenzi cha Kigiriki ‘bariki’ bila kuongeza yambwa ambalo halijaelezwa wazi; katika mlo kinaweza pia kuhusisha kushukuru.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: akaimega mikate
  rationale: ‘Kumega’ ni kitendo cha kawaida kwa mkate na huhifadhi yambwa lililo wazi katika Kigiriki.
- source_word: ἐδίδου
  choice: akaendelea kuwapa
  rationale: Wakati usiotimilika unaonyesha utoaji ulioendelea au uliorudiwa wakati wa kugawa chakula.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: Huwakilisha wazi kiwakilishi cha umilikaji αὐτοῦ.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ili waiweke mbele ya watu
  rationale: ‘Ili’ huonyesha kusudi, na ‘waiweke mbele’ huhifadhi picha halisi ya παρατίθημι; ‘watu’ huweka wazi kuwa αὐτοῖς inawarejelea umati.
- source_word: ἐμέρισεν πᾶσιν
  choice: akawagawia wote
  rationale: ‘Kuwagawia’ huwasilisha kwa asili maana ya kugawa sehemu kwa kila mtu, huku ‘wote’ ikihifadhi πᾶσιν.
theological_decisions:
- issue: Maana ya εὐλόγησεν katika muktadha wa mlo
  choice: akabariki
  alternative: akashukuru
  rationale: Kigiriki kinatumia εὐλογέω (‘bariki’), si εὐχαριστέω (‘shukuru’). ‘Akabariki’ ni wazi zaidi kwa matini na huacha yambwa bila kutajwa kama lilivyo katika Kigiriki; tanbihi inahifadhi uwezekano wa maana ya kushukuru katika muktadha wa mlo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa vitenzi vinavyofuatana. ‘Akaendelea kuwapa’ huonyesha tendo endelevu, na ‘watu’ huondoa utata wa kiwakilishi bila kuingiza tafsiri ya kimadhehebu.
