  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano wa Kigiriki: kuchukua mikate na samaki, kutazama juu mbinguni, kubariki, kuimega mikate, kuendelea kuwapa wanafunzi ili waiweke mbele ya watu, kisha kuwagawia wote samaki. “Akaendelea kuwapa” huwasilisha vizuri hali ya imperfect ya ἐδίδου, na “watu” hufafanua kwa halali referenti ya αὐτοῖς bila kubadili maana.'
