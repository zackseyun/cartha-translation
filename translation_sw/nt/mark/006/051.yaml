  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: sw
  text: Akapanda mashuani walimokuwa[a], na upepo ukatulia. Nao wakastaajabu sana kupita kiasi ndani yao wenyewe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapanda ndani ya mashua pamoja nao.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hukusanya maneno ya msisitizo, kwa maana ya “sana mno, kupita kiasi.” Kitenzi kinaweza pia kueleza kushangazwa kupita kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη ... εἰς τὸ πλοῖον
  choice: akapanda mashuani
  rationale: Katika muktadha wa chombo, kitenzi cha kupanda pamoja na εἰς hueleza kuingia mashuani; usemi huu ni wa kawaida na unahifadhi picha ya kupanda.
- source_word: πρὸς αὐτούς
  choice: wakaungana naye
  rationale: Kirai kinaeleza kuwa aliwaendea na kuwa pamoja nao ndani ya mashua. Muundo huu unaonyesha ukaribu uliotokana na kuingia kwake, bila kuufanya kuwa tu mwendo kuelekea kwao.
- source_word: πλοῖον
  choice: mashua
  rationale: Mashua ndilo neno la kawaida na lenye kipimo kinachofaa kwa chombo cha uvuvi katika Bahari ya Galilaya.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: upepo ukatulia
  rationale: κοπάζω hueleza upepo kupungua nguvu au kukoma; 'ukatulia' ni Kiswahili cha asili kinachobakiza nafasi kati ya kutulia na kukoma kabisa.
- source_word: λίαν ἐκ περισσοῦ
  choice: mno sana
  rationale: Maneno ya Kigiriki yanakusanya viashiria vya msisitizo. 'Mno sana' ni msisitizo wenye nguvu na unaoeleweka, ingawa si muundo wa kawaida sana, hivyo unaakisi uzito wa asili.
- source_word: ἐν ἑαυτοῖς
  choice: mioyoni mwao
  rationale: Kirai kinaonyesha mwitikio wao wa ndani. 'Mioyoni mwao' ni usemi wa asili wa Kiswahili bila kudai kwamba moyo wa kimwili ndio unaokusudiwa.
- source_word: ἐξίσταντο
  choice: wakashangaa
  rationale: Katika matumizi haya kitenzi kina maana ya kupigwa na mshangao au kustaajabu sana; nguvu yake inaongezwa na 'mno sana'.
theological_decisions:
- issue: Ukali wa mwitikio wa wanafunzi kwa tendo la Yesu
  choice: wakashangaa mno sana mioyoni mwao
  alternative: walistaajabu kupita kiasi ndani yao wenyewe
  rationale: Tafsiri inadumisha mshangao mkubwa unaosisitizwa na maandishi bila kuongeza maelezo ya kiteolojia kuhusu utambulisho wa Yesu au hali ya kiakili ya wanafunzi.
- issue: Kiwango cha kutulia kwa upepo
  choice: upepo ukatulia
  alternative: upepo ukakoma
  rationale: κοπάζω inaweza kumaanisha kupungua au kukoma. 'Ukatulia' huhifadhi upana huo wa maana badala ya kulazimisha ukomo kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia viunganishi vya kawaida vya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
