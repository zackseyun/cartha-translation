  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu methali ya Kigiriki: ukanushi wenye kifungu cha upekee (‘hakosi kuheshimiwa isipokuwa’), duara tatu zinazozidi kuwa za karibu (mahali pa asili, jamaa, na nyumba), na maana ya heshima/dharau ya ἄτιμος. ‘Akawaambia’ ni usimulizi wa kawaida wa Kiswahili kwa ἔλεγεν katika muktadha huu, ingawa haionyeshi kikamilifu hali ya imperfect; si upungufu unaohitaji marekebisho yasiyo ya asili.'
