reference: Mark 6:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: sw
  text: Yesu akawaambia, “Nabii hakosi kuheshimiwa isipokuwa katika mji wake wa asili[a], miongoni mwa jamaa zake[b], na katika nyumba yake[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pake pa asili” au “nchi yake.” Neno la Kigiriki linamaanisha mahali mtu alikotoka; hapa “mji wake wa asili” linafaa kwa muktadha wa Nazareti.
    reason: lexical_alternative
  - marker: b
    text: Au “watu wa ukoo wake.” Neno la Kigiriki linamaanisha ndugu au watu wa kundi moja la ukoo.
    reason: lexical_alternative
  - marker: c
    text: Au “watu wa nyumbani mwake.” Neno la Kigiriki linaweza kumaanisha jengo la nyumba au watu wa familia wanaoishi humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: akawaambia
  rationale: Kauli hii ya kisimulizi ni ya asili katika Kiswahili na inaonyesha kwamba Yesu alianza au aliendelea kuwaambia maneno haya; kutafsiri kwa muundo mzito kama ‘alikuwa akiwaambia’ kungekuwa si Kiswahili cha kawaida.
- source_word: προφήτης
  choice: nabii
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa προφήτης.
- source_word: ἄτιμος
  choice: hakosi kuheshimiwa
  rationale: Muundo huu unahifadhi ukanushi wa nahau ya Kigiriki, ‘si asiye na heshima,’ kwa Kiswahili cha kawaida, na pia unadumisha wazo la heshima katika methali hii.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika kauli hii yenye ukanushi, εἰ μὴ inaonyesha hali ya pekee, si sharti; ‘isipokuwa’ ndiyo tafsiri ya asili.
- source_word: πατρίδι
  choice: mji wake wa asili
  rationale: Katika muktadha wa Nazareti, πατρίς ni mahali alikotoka mtu, hapa mji wake, wala si lazima nchi nzima.
- source_word: συγγενεῦσιν
  choice: jamaa zake
  rationale: ‘Jamaa’ huonyesha watu wa ukoo au ndugu kwa maana pana, na ni Kiswahili cha kawaida kinachotofautishwa na kundi la nyumbani linalofuata.
- source_word: οἰκίᾳ
  choice: nyumba yake
  rationale: οἰκία inaweza kumaanisha jengo la nyumba au watu wa nyumbani. ‘Nyumba yake’ huhifadhi utata huo wa kweli kuliko kuamua moja kwa moja kuwa ni ‘watu wa nyumbani.’
- source_word: καὶ ... καὶ ... καὶ
  choice: katika ... miongoni mwa ... na katika
  rationale: Mpangilio huu unahifadhi mkusanyiko wa maeneo na makundi matatu, huku ukitumia viunganishi vya asili vya Kiswahili bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Upeo wa methali ya Yesu kuhusu heshima ya nabii
  choice: Kauli imetafsiriwa kama methali ya jumla ambayo muktadha unamhusisha Yesu, bila kuongeza ufafanuzi kuhusu utambulisho wake au sababu za kukataliwa kwake.
  alternative: Kusema wazi kwamba Yesu anajitambulisha kuwa Masihi aliyekataliwa, au kufafanua kauli kama fundisho la jumla kuhusu kutokuamini.
  rationale: Kigiriki kinatoa methali kuhusu nabii kutoheshimiwa katika mazingira yanayomfahamu. Tafsiri haipaswi kutatua zaidi mvutano wa kitheolojia ambao mstari wenyewe hauufafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Akawaambia’ ni simulizi la asili; ‘hakosi kuheshimiwa isipokuwa’ huhifadhi muundo wa kimethali na mkazo wa heshima. Alama zote za tanbihi zimewekwa mara moja katika matini.
