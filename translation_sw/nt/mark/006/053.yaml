  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: sw
  text: Walipokwisha kuvuka mpaka nchi kavu[a], walifika Genesareti, wakatia nanga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka ufukweni”; Kigiriki kinasema “mpaka nchi kavu,” kikimaanisha kufika nchi kavu kutoka kwenye mashua.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakafunga mashua” au “wakafika ufukweni”; kitenzi cha Kigiriki kina maana ya baharini ya kuileta mashua mahali pa kutia nanga au kuifunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Baada ya
  rationale: Kiunganishi καί kinaunganishwa kwa kawaida na kirai tegemezi kinachofuata ili kuleta mtiririko wa asili wa Kiswahili bila kuongeza maana mpya.
- source_word: διαπεράσαντες
  choice: baada ya kuvuka
  rationale: Kauli ya wakati uliopita inaonyesha tendo la kuvuka lililotangulia kufika; usemi huu unahifadhi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: mpaka nchi kavu, walifika Genesareti
  rationale: Katika muktadha wa safari ya mashua, γῆ ni nchi kavu au ufukwe. ‘Nchi kavu’ inahifadhi picha ya kufika nchi kavu, huku ‘walifika Genesareti’ ikitaja mahali walikokwenda.
- source_word: Γεννησαρὲτ
  choice: Genesareti
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: προσωρμίσθησαν
  choice: wakafunga mashua huko
  rationale: Kitenzi hiki kina maana maalumu ya baharini ya kuileta na kuifunga mashua mahali pa kutia nanga au ufukweni. ‘Mashua’ imetajwa wazi kwa uasilia wa Kiswahili kutokana na muktadha.
