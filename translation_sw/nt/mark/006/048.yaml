  source_fidelity: 'Matini inafuata kwa uaminifu maana ya Kigiriki: wanafunzi wanaonekana wakitaabika wanapopiga makasia, upepo uko kinyume chao, wakati wa zamu ya nne umehifadhiwa, Yesu anakuja akitembea juu ya bahari, na kauli ya mwisho imeachwa wazi. Hata hivyo, tanbihi ya wakati inahitaji kurekebishwa ili kutoa maelezo yaliyo wazi na yasiyo na utata kuhusu hesabu ya Kirumi.'
