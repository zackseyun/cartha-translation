source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: sw
  text: Naye alipowaona wakitaabika kwa kupiga makasia, kwa maana upepo ulikuwa unawapinga, yapata zamu ya nne ya usiku[a] akawajia, akitembea juu ya bahari[b]. Alikusudia kuwapita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zamu ya nne ya usiku ilikuwa takriban saa 3:00 hadi 6:00 alfajiri, kwa hesabu ya Kirumi.
    reason: cultural_note
  - marker: b
    text: Au, “juu ya maji.” Kigiriki kinasema “juu ya bahari.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “alikusudia kuwapita” yanaweza kumaanisha tu kwamba alitaka kwenda mbele yao; lakini huenda pia yakawa mwangwi wa matukio ya Agano la Kale ambapo Mungu “anapita” akijidhihirisha (kwa mfano, Kut 33:19, 22; 34:6; 1 Fal 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: alipowaona
  rationale: Kishiriki cha wakati uliopita kinaonyesha tendo linalohusiana kwa karibu na tendo kuu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: wakitaabika kwa kupiga makasia
  rationale: ‘Kutaabika’ huhifadhi uzito wa βασανίζω bila kutoa picha isiyo ya asili, na ‘kwa kupiga makasia’ huonyesha shughuli iliyowaletea shida.
- source_word: ἐναντίος αὐτοῖς
  choice: ulikuwa unawapinga
  rationale: Hutoa kwa lugha ya kawaida maana ya upepo kuwa kinyume chao.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: yapata zamu ya nne ya usiku
  rationale: Huhifadhi mfumo wa kale wa kugawa usiku na kuonyesha ukadiriaji uliomo katika περὶ.
- source_word: ἔρχεται πρὸς αὐτούς
  choice: akawajia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa ufasaha mfululizo wa viambishi vya -ka- huku likihifadhi uhai wa simulizi.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: akitembea juu ya bahari
  rationale: ‘Bahari’ inatafsiri θάλασσα moja kwa moja, na ‘juu ya’ huhifadhi dai la kushangaza la kifungu bila kulainisha kuwa ‘majini.’
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: Alikusudia kuwapita
  rationale: ‘Alikusudia’ huonyesha nia katika ἤθελεν, na ‘kuwapita’ huacha wazi ikiwa ni kwenda mbele yao tu au mwangwi wa kujidhihirisha kwa Mungu.
theological_decisions:
- issue: Maana ya Yesu kukusudia kuwapita
  choice: Alikusudia kuwapita
  alternative: Alitaka kupita mbele yao / alikusudia kujidhihirisha kwao kwa ‘kupita’
  rationale: Kigiriki hakielezi wazi kusudi hilo. Tafsiri ya moja kwa moja huhifadhi mvutano kati ya maana ya kawaida ya mwendo na uwezekano wa mwangwi wa matukio ya Agano la Kale ambapo Mungu ‘anapita’ katika kujidhihirisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wakitaabika kwa kupiga makasia’ ni asili zaidi kuliko ufuasi mkali wa muundo wa Kigiriki, huku kikihifadhi ukali wa hali yao. Mfumo wa kale wa wakati umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
