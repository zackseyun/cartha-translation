  text: And they all ate and were satisfied.
translation:
  language: sw
  text: Nao wote wakala, wakashiba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: wakala
  rationale: Kitenzi hiki ni aoristi ya ἐσθίω, neno la kawaida la kula. “Wakala” ni tafsiri ya moja kwa moja na ya asili; hakuna haja ya kuongeza kitu kama “chakula,” na matokeo ya kula yanaelezwa na kitenzi kinachofuata.
- source_word: πάντες
  choice: wote
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino na kinawahusu watu wote katika umati. “Wote” kinadumisha upeo wake wa kujumuisha kila mmoja huku kikiungana kwa kawaida na kiambishi cha nafsi katika “wakala.”
- source_word: ἐχορτάσθησαν
  choice: wakashiba
  rationale: χορτάζω hapa humaanisha kulishwa vya kutosha hadi kutosheka. “Wakashiba” ni usemi wa kawaida na wazi katika Kiswahili kwa kushiba baada ya kula, bila kuongeza wazo lisilokuwapo katika chanzo.
- source_word: καὶ ... καὶ
  choice: Nao ... waka-
  rationale: καί ya kwanza inaendeleza simulizi, nayo ya pili inaunganisha tendo la kula na matokeo yake. “Nao” pamoja na mfuatano wa vitenzi vya “waka-” huwasilisha mtiririko huo wa moja kwa moja kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Wakashiba” linaeleweka kwa urahisi na watu wa kawaida na linawakilisha kikamilifu hali ya kutosheka kwa chakula.
