  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: sw
  text: Lakini akawaambia, “Mna mikate mingapi? Nendeni mkaone.” Walipofahamu, wakasema, “Mitano, na samaki wawili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: mikate
  rationale: Neno la kawaida na la moja kwa moja kwa mikate iliyotajwa katika muktadha; linahifadhi wingi wa Kigiriki.
- source_word: ὑπάγετε ἴδετε
  choice: Nendeni mkaone
  rationale: 'Muundo huu wa kawaida wa Kiswahili huhifadhi amri mbili zinazofuatana: waende kisha waangalie wajue walicho nacho.'
- source_word: γνόντες
  choice: Walipokwisha kujua
  rationale: Huwakilisha kishirikishi cha Kigiriki kinachoonyesha kwamba walitoa jibu baada ya kuchunguza na kupata taarifa.
- source_word: ἰχθύας
  choice: samaki
  rationale: Katika Kiswahili nomino hii huwa na umbo lilelile katika umoja na wingi; idadi inaonyeshwa na 'wawili'.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha asili na chenye hadhi. Wakati uliopita umetumiwa katika simulizi kwa ufasaha wa Kiswahili, bila kujaribu kuiga wakati wa sasa wa kihistoria wa Kigiriki.
