  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: sw
  text: Sabato ilipofika, alianza kufundisha katika sinagogi. Wengi waliomsikia walishangaa sana, wakisema, “Huyu ameyapata wapi mambo haya? Hekima hii aliyopewa ni nini, na matendo ya nguvu ya namna hii[a] yanayotendeka kupitia mikono yake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza” au “matendo yenye nguvu.” Neno la Kigiriki δυνάμεις linaweza kumaanisha matendo ya kimiujiza au maonyesho ya nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Sabato ilipofika
  rationale: Muundo huu unaonyesha mazingira ya wakati ya kauli huru ya jenitivi, huku ukibaki wa kawaida na wazi katika Kiswahili.
- source_word: ἤρξατο διδάσκειν
  choice: alianza kufundisha
  rationale: Huhifadhi dhana ya kuanza kwa tendo iliyo katika ἄρχομαι pamoja na kitenzi-jina.
- source_word: συναγωγῇ
  choice: sinagogi
  rationale: Katika mazingira haya ya Kiyahudi, neno linamaanisha mahali au taasisi ya ibada, na “sinagogi” ndilo neno lililozoeleka.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Wengi waliomsikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida watu wengi waliokuwa wakimsikia Yesu, bila kulazimisha muundo wa Kigiriki.
- source_word: ἐξεπλήσσοντο
  choice: walishangaa sana
  rationale: Kielezi “sana” kinaonyesha nguvu ya mshangao uliomo katika kitenzi cha Kigiriki.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Huyu ameyapata wapi mambo haya?
  rationale: “Huyu” huhifadhi nguvu ya kiwakilishi τούτῳ na uwezekano wa sauti ya kujitenga au kudharau; “ameyapata wapi” huonyesha swali kuhusu chanzo.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Ni hekima gani hii aliyopewa
  rationale: Huhifadhi swali kuhusu aina au chanzo cha hekima pamoja na hali ya kutendwa ya δοθεῖσα.
- source_word: δυνάμεις
  choice: matendo ya nguvu
  rationale: Katika wingi, neno linaweza kumaanisha matendo ya kimiujiza au maonyesho ya nguvu. Chaguo hili linahifadhi upana wa maana kuliko “miujiza” pekee.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: yanayotendeka kwa mikono yake
  rationale: Huhifadhi taswira ya Kigiriki ya matendo kutendeka kupitia mikono yake badala ya kuibadili kuwa kauli tendaji ya moja kwa moja.
theological_decisions:
- issue: Maana ya δυνάμεις katika muktadha
  choice: matendo ya nguvu
  alternative: miujiza
  rationale: Muktadha unaelekea kwenye matendo ya ajabu, lakini neno la Kigiriki linasisitiza pia nguvu inayodhihirishwa. “Matendo ya nguvu” huhifadhi vipengele vyote bila kufunga maana kwa tafsiri moja tu.
- issue: Sauti ya τούτῳ
  choice: Huyu
  alternative: mtu huyu / yeye
  rationale: “Huyu” huhifadhi usemi wa moja kwa moja wa umati na uwezekano wa sauti ya kujitenga, bila kuongeza dharau isiyo dhahiri kabisa katika neno lenyewe.
- issue: Uwakala katika διὰ τῶν χειρῶν αὐτοῦ
  choice: yanayotendeka kwa mikono yake
  alternative: anayoyatenda kwa mikono yake
  rationale: Muundo wa Kigiriki unaonyesha matendo yanayotendeka kupitia mikono yake, hivyo tafsiri haibadili kimyakimya kuwa kauli inayomtaja Yesu moja kwa moja kama mtendaji wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “matendo ya nguvu ya namna hii.”
