lexical_decisions:
- source_word: ἦσαν
  choice: walikuwa
  rationale: Kitenzi hiki ni kiunganishi kinachoeleza jumla ya waliokula; “walikuwa” ni tafsiri ya moja kwa moja bila kuongeza maana ya “walihesabiwa.”
- source_word: οἱ φαγόντες
  choice: waliokula
  rationale: Muundo huu unalitambulisha kundi kwa tendo lililokamilika la kula; “waliokula” ni wa kawaida na wazi katika Kiswahili.
- source_word: τοὺς ἄρτους
  choice: mikate hiyo
  rationale: Wingi wa ἄρτος hapa unarejelea mikate mahususi iliyotajwa katika simulizi; “hiyo” huonyesha urejeleaji huo bila kupoteza wingi.
- source_word: πεντακισχίλιοι
  choice: elfu tano
  rationale: Hii ni namba ya kawaida na inatafsiriwa moja kwa moja.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno ἀνήρ hapa linamaanisha wanaume hasa, si neno la jumla kwa watu; tafsiri inadumisha umahususi huo.
theological_decisions:
- issue: Neno maalumu la kijinsia katika hesabu
  choice: Kutafsiri ἄνδρες kuwa “wanaume” katika matini kuu.
  alternative: watu
  rationale: Kigiriki kimetumia neno linalowataja wanaume hasa badala ya neno la jumla kwa watu. Tafsiri hailipanui kimya kimya kuwa jumla ya watu wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” huendeleza simulizi kwa kawaida; “mikate hiyo” huweka wazi urejeleo wa mikate iliyotangulia.
