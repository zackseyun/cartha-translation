  text: Nao waliokula mikate hiyo walikuwa wanaume elfu tano.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate huo.” Neno la Kigiriki linaweza kumaanisha mkate kwa ujumla au mikate, lakini hapa linarejelea mikate mahususi katika simulizi hili.
