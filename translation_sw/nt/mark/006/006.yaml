base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: sw
  text: Akastaajabu kwa sababu ya kutokuamini kwao.[a] Akazunguka vijiji vya kandokando, akifundisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alishangaa kwa sababu ya kutokuamini kwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Aliendelea kuzunguka vijiji vya kandokando,” au “alizunguka vijiji kwa mzunguko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: Akastaajabu
  rationale: Kitenzi hiki kinaonyesha mshangao wa Yesu. Wakati usiotimilifu wa Kigiriki una hali ya tendo la wakati uliopita, lakini Kiswahili cha masimulizi hutumia kwa kawaida ‘aka-’ bila kulazimisha muundo mzito usio wa asili.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: kwa sababu ya kutokuamini kwao
  rationale: διά pamoja na hali ya kushutumu huonyesha sababu. ‘Kutokuamini’ hapa ni wazi na ya kawaida, na haipunguzi maana kuwa udhaifu mdogo wa imani.
- source_word: περιῆγεν
  choice: akazunguka
  rationale: Huwasilisha mwendo wa kuendelea kutoka sehemu moja hadi nyingine kwa Kiswahili cha kawaida.
- source_word: τὰς κώμας
  choice: vijiji
  rationale: κώμη humaanisha kijiji au makazi ya mashambani; ‘vijiji’ ndiyo tafsiri iliyo wazi na ya kawaida.
- source_word: κύκλῳ
  choice: vya jirani
  rationale: Katika muunganiko huu neno linaonyesha vijiji vilivyozunguka eneo hilo au mwendo wa mzunguko. ‘Vijiji vya jirani’ ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya mzunguko.
- source_word: διδάσκων
  choice: akifundisha
  rationale: Muundo huu unaonyesha kuwa kufundisha kulitokea wakati uleule alipokuwa akizunguka.
theological_decisions:
- issue: Kueleza mshangao wa Yesu mbele ya kutokuamini bila kufafanua kimadhehebu hali ya maarifa yake
  choice: Akastaajabu kwa sababu ya kutokuamini kwao.
  alternative: Alishangaa kwa sababu ya kutokuamini kwao.
  rationale: Tafsiri inahifadhi kauli ya simulizi kwamba Yesu alistaajabu, bila kuipunguza wala kuongeza ufafanuzi wa kiteolojia ambao matini yenyewe haitoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akastaajabu’ huhifadhi uzito wa θαυμάζω; ‘akazunguka katika vijiji vya jirani’ ni ya kawaida na inaepuka uradidi usio laini wa ‘kuzunguka vijiji vilivyozunguka.’ Alama zote za tanbihi zimewekwa katika matini kuu.
