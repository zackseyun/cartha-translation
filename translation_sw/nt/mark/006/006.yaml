  source_fidelity: 'The first clause accurately renders ἐθαύμαζεν and the causal phrase διὰ τὴν ἀπιστίαν αὐτῶν. However, “katika vijiji vya jirani” shifts the force of περιῆγεν τὰς κώμας κύκλῳ: the villages are the object of his circuit/itinerant movement, not principally the location in which he moved. “Vijiji vya kandokando” more directly retains the likely sense of villages round about, while allowing the footnote to preserve the circuit nuance.'
  naturalness: “Akazunguka vijiji vya kandokando, akifundisha” is natural, concise Standard East African Swahili. It avoids the less precise locative construction “akazunguka katika vijiji vya jirani.”
