  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: sw
  text: Watu wengi waliwaona wakiondoka na wakawatambua; wakakimbia kwa miguu kutoka miji yote kwenda huko, wakafika kabla yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον
  choice: waliwaona
  rationale: Hutoa maana ya moja kwa moja ya kuona katika mfululizo wa simulizi.
- source_word: ὑπάγοντας
  choice: wakiondoka
  rationale: Katika muktadha huu wanakwenda zao kwa mashua; ‘wakiondoka’ ni ya kawaida bila kuongeza namna ya safari.
- source_word: ἐπέγνωσαν
  choice: wakawatambua
  rationale: Kitenzi hapa kinaeleza kuwatambua waliokuwa wakiondoka.
- source_word: πολλοί
  choice: watu wengi
  rationale: Kivumishi kimetumika kama nomino; kuongeza ‘watu’ huifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: πεζῇ
  choice: kwa miguu
  rationale: Huhifadhi tofauti kati ya safari yao ya nchi kavu na safari ya mashua.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: kutoka miji yote
  rationale: ‘Miji’ ni tafsiri pana na ya kawaida ya πόλεις, ambayo inaweza kumaanisha miji mikubwa au midogo.
- source_word: συνέδραμον ἐκεῖ
  choice: wakakimbia ... wakakusanyika huko
  rationale: Huwasilisha kukimbia na wazo la watu kutoka sehemu mbalimbali kukutana mahali pamoja.
- source_word: προῆλθον αὐτούς
  choice: kufika kabla yao
  rationale: Huweka wazi maana ya kuwatangulia kwa kufika mahali pale.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kisimulizi na unaoeleweka kwa urahisi. Kielezi ‘kwa miguu’ kinadumisha tofauti na safari ya mashua katika mstari uliotangulia.
