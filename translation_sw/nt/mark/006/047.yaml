  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: sw
  text: Ilipofika jioni, mashua ilikuwa katikati ya bahari, naye alikuwa peke yake katika nchi kavu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufukweni.” Kigiriki kinasema “nchi kavu,” kikitofautisha mahali alipokuwa na mahali mashua ilipokuwa baharini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Ilipofika jioni
  rationale: Kirai hiki cha wakati kinaonyesha kuwa jioni ilikuwa imeingia; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: πλοῖον
  choice: mashua
  rationale: Katika mazingira ya Bahari ya Galilaya, “mashua” ni neno la kawaida na linalofaa kuliko “meli,” ambalo lingeashiria chombo kikubwa zaidi.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: katikati ya bahari
  rationale: Inahifadhi maelezo ya mahali na tofauti kati ya mashua iliyokuwa baharini na Yesu aliyekuwa nchi kavu.
- source_word: θάλασσα
  choice: bahari
  rationale: Ingawa Bahari ya Galilaya ni ziwa kijiografia, neno la Kigiriki ni “bahari”; uchaguzi huu unafuata usemi wa matini chanzi.
- source_word: αὐτὸς μόνος
  choice: naye alikuwa peke yake
  rationale: Inawasilisha kwa Kiswahili cha kawaida hali ya yeye kuwa bila mtu mwingine, huku “naye” ikiendeleza tofauti na mashua pamoja na waliokuwamo.
- source_word: ἐπὶ τῆς γῆς
  choice: nchi kavu
  rationale: Usemi huu unahifadhi tofauti ya moja kwa moja kati ya mahali pake na mashua iliyokuwa baharini; “ufukweni” ni tafsiri inayowezekana lakini inaongeza ufafanuzi wa mahali.
