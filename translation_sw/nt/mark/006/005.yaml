  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: sw
  text: Naye hakuweza kufanya tendo lolote la nguvu huko[a], isipokuwa aliweka mikono yake juu ya wagonjwa wachache na kuwaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “muujiza wowote” au “tendo lolote lenye nguvu”; Kigiriki hutumia neno “nguvu,” usemi ambao Marko hutumia kuhusu matendo ya kimiujiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: hakuweza
  rationale: Huwasilisha moja kwa moja kauli ya kutoweza iliyo katika kitenzi δύναμαι bila kuilegeza kuwa kutotaka.
- source_word: ποιῆσαι
  choice: kufanya
  rationale: Ni tafsiri pana na ya kawaida ya ποιέω, na inaendana kwa asili na kirai ‘tendo la nguvu.’
- source_word: οὐδεμίαν δύναμιν
  choice: tendo lolote la nguvu
  rationale: Katika Marko, δύναμις hapa humaanisha tendo la kimiujiza linalodhihirisha nguvu. Tafsiri hii inadumisha uhusiano wa kimsamiati na ‘nguvu’ bila kulazimisha maana moja pekee kama ‘muujiza.’
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Huonyesha wazi jambo linalowekwa kama tofauti na kauli hasi iliyotangulia.
- source_word: ὀλίγοις
  choice: wachache
  rationale: Ni namna ya kawaida na fupi ya kuonyesha idadi ndogo.
- source_word: ἀρρώστοις
  choice: wagonjwa
  rationale: Ni neno la kawaida la Kiswahili kwa watu walio wagonjwa au dhaifu kimwili.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: aliweka mikono yake juu ya
  rationale: Huhifadhi tendo halisi la kuweka mikono juu ya wagonjwa na kulifanya kirai kishirikiane kwa ufasaha na kitenzi kikuu.
- source_word: ἐθεράπευσεν
  choice: kuwaponya
  rationale: θεραπεύω katika muktadha huu humaanisha kuponya wagonjwa; kiwakilishi ‘wa’ kinarejelea wagonjwa wachache.
theological_decisions:
- issue: Iwapo οὐκ ἐδύνατο ilegezwe ili kuepuka kudokeza kikomo kwa Yesu
  choice: 'Kudumisha maana ya wazi: ‘hakuweza kufanya tendo lolote la nguvu huko’'
  alternative: ‘hakutaka kufanya tendo lolote la nguvu huko’ au ‘hakufanya tendo lolote la nguvu huko’
  rationale: Kigiriki kinasema wazi kutoweza kwa kutumia δύναμαι pamoja na ukanushi. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia badala ya kuutatua kwa kuingiza maelezo yasiyosemwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tendo la nguvu’ ni wazi kwa msomaji wa kawaida huku kikihifadhi usemi wa Marko na maana pana ya δύναμις.
