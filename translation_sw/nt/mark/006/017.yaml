source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: sw
  text: Kwa maana Herode mwenyewe alikuwa ametuma watu wamkamate Yohana, akamfunga gerezani kwa sababu ya Herodia, mke wa Filipo, ndugu yake, kwa kuwa Herode alikuwa amemwoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Kwa maana Herode mwenyewe
  rationale: “Kwa maana” linaonyesha uhusiano wa maelezo na yaliyotangulia, na “mwenyewe” linahifadhi msisitizo kwamba Herode ndiye aliyewajibika kuanzisha hatua hiyo.
- source_word: ἀποστείλας ἐκράτησεν
  choice: alikuwa ametuma watu wamkamate
  rationale: Kirai hiki kinaonyesha kwamba Herode alianzisha ukamataji kwa kuwatuma watu. Kiswahili hiki ni cha kawaida na huepuka kudokeza kwamba Herode alimkamata Yohana kwa mikono yake mwenyewe.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: akamfunga gerezani
  rationale: “Akamfunga” huhifadhi maana halisi ya δέω bila kuongeza kwamba alifungwa kwa minyororo; “gerezani” huonyesha mahali pa kifungo.
- source_word: διὰ Ἡρῳδιάδα
  choice: kwa sababu ya Herodia
  rationale: διά pamoja na akusativi hapa huonyesha sababu.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: mke wa Filipo ndugu yake
  rationale: γυνή hapa ni “mke,” na kirai kinamtambulisha Filipo kuwa ndugu ya Herode.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: kwa kuwa Herode alikuwa amemwoa
  rationale: Kumtaja Herode tena huondoa utata wa kiwakilishi katika Kiswahili, huku wakati timilifu ukionyesha kwamba ndoa ilitangulia kukamatwa kwa Yohana.
theological_decisions:
- issue: Namna ya kuwasilisha sababu ya kufungwa kwa Yohana
  choice: Aya inasimulia kwamba hatua hiyo ilichukuliwa kwa sababu ya Herodia, ambaye Herode alikuwa amemwoa, bila kuongeza hukumu ya kimaadili ndani ya sentensi hii.
  alternative: Kusema wazi katika aya hii kwamba ndoa hiyo ilikuwa haramu.
  rationale: Hukumu ya kimaadili na kisheria inaelezwa katika muktadha unaofuata; sentensi hii yenyewe inatoa sababu ya kihistoria bila kuifafanua zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumiwa kwa urahisi wa kusoma, huku uwajibikaji wa Herode na mpangilio wa matukio vikihifadhiwa.
