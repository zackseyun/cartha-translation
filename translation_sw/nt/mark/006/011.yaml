  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: sw
  text: Na mahali popote ambapo watu hawatawapokea wala kuwasikiliza, mtakapoondoka huko, yakung'uteni mavumbi yaliyo chini ya miguu yenu[b], kuwa ushuhuda dhidi yao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa ushuhuda kwao” au “kuwa ushahidi kwao.” Kigiriki kinaweza kutafsiriwa kwa ukaribu zaidi kwa namna hii; katika muktadha, tendo hilo linaweza kueleweka kuwa ushuhuda dhidi ya wale wanaoukataa ujumbe.
    reason: alternative_reading
  - marker: b
    text: Kukung'uta mavumbi kutoka miguuni kulikuwa tendo la ishara lililoonyesha kujitenga na kutoa onyo baada ya kukataliwa.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: mahali popote ambapo
  rationale: Muundo huu una maana ya jumla isiyoainishwa; tafsiri hii inahifadhi nomino τόπος na kusikika kwa kawaida katika Kiswahili.
- source_word: μὴ δέξηται ὑμᾶς
  choice: watu hawatawapokea
  rationale: Ingawa Kigiriki hufanya 'mahali' kuwa kiima kisarufi, kwa Kiswahili watu wa mahali hapo ndio wanaopokea wageni; kuongeza 'watu' huleta maana ya kawaida bila kubadili wazo.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: wala kuwasikiliza
  rationale: Kitenzi ἀκούω hapa kinahusu kusikiliza wajumbe, si kusikia sauti tu; 'kuwasikiliza' kinadumisha maana hiyo bila kufikia tafsiri kali zaidi ya 'kuwatii.'
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: mtakapoondoka huko
  rationale: Kirai cha kishiriki kinaonyesha wakati au mazingira ya tendo; muundo huu ni wa kawaida na unahifadhi mfuatano wa matendo.
- source_word: ἐκτινάξατε
  choice: yakung'uteni
  rationale: '''Kung''uta'' ni kitenzi cha kawaida cha Kiswahili kwa kuondoa vumbi kwa kutikisa au kupiga kitu, na kinafaa kwa tendo hili la ishara.'
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: mavumbi yaliyo chini ya miguu yenu
  rationale: Tafsiri hii inafuata kwa karibu picha halisi ya vumbi lililo chini ya miguu na kubaki wazi kwa msomaji wa kawaida.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: kuwa ushuhuda dhidi yao
  rationale: μαρτύριον ni 'ushuhuda'; katika muktadha wa kukataliwa, ishara ina nguvu ya onyo na ushahidi wenye kuwahusu kwa namna hasi. Dativu αὐτοῖς inaweza pia kutafsiriwa kwa ukaribu zaidi kuwa 'kwao,' hivyo uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya ishara ya kukung'uta mavumbi
  choice: Ushuhuda wa onyo dhidi ya wale wanaowakataa wajumbe
  alternative: Ushuhuda kwao, bila kubainisha wazi kuwa ni dhidi yao
  rationale: Muktadha wa kutowapokea na kutowasikiliza wajumbe unaipa ishara nguvu hasi, lakini εἰς μαρτύριον αὐτοῖς yenyewe inaweza kusomwa kwa uhalisi zaidi kuwa 'kuwa ushuhuda kwao.' Tafsiri kuu inaonyesha nguvu inayowezekana katika muktadha, huku tanbihi ikihifadhi utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa kuweka 'watu' kama watendaji wa kupokea na kusikiliza. Alama zote za tanbihi zimewekwa mwishoni mwa sentensi kwa sababu tanbihi zote mbili zinafafanua tendo na maana ya sehemu ya mwisho ya mstari.
