  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: sw
  text: Wanafunzi wake waliposikia, walikuja, wakauchukua mwili wake[a] na kuuweka kaburini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, maiti yake. Neno la Kigiriki linamaanisha hasa mwili wa mtu aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Kirai cha wakati kinaonyesha kwamba walikuja baada ya kupata habari; “waliposikia” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Huhifadhi maana ya μαθηταί na uhusiano wao na Yohana Mbatizaji, ambaye ndiye anayerejelewa na kiwakilishi katika muktadha.
- source_word: ἦλθον
  choice: walikuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuwasili kwao mahali alipokuwa mwili.
- source_word: ἦραν
  choice: wakauchukua
  rationale: Katika muktadha huu αἴρω humaanisha kuunyanyua na kuondoa mwili; “wakauchukua” ni ya asili bila kuongeza maelezo yasiyotajwa.
- source_word: πτῶμα
  choice: mwili
  rationale: Neno la Kigiriki linamaanisha hasa mwili wa mtu aliyekufa. “Mwili” lina heshima na linaeleweka wazi kutokana na muktadha; maana mahsusi imefafanuliwa katika tanbihi.
- source_word: ἔθηκαν
  choice: kuuweka
  rationale: τίθημι katika maziko humaanisha kuweka mwili mahali pa kuzikia; kauli hii ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: ἐν μνημείῳ
  choice: kaburini
  rationale: μνημεῖον hapa ni mahali pa kuzikia. “Kaburini” ni neno la kawaida la Kiswahili na haliongezi maelezo kuhusu aina ya kaburi.
theological_decisions:
- issue: Anayerejelewa na “wanafunzi wake”
  choice: Wanafunzi wa Yohana Mbatizaji
  alternative: Wanafunzi wa Yesu
  rationale: Katika muktadha wa karibu, Yohana Mbatizaji ndiye ambaye kuuawa kwake kumesimuliwa, na wanafunzi wake wanakuja kuuchukua na kuuzika mwili wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa vitenzi mfululizo unafuata mwendo wa simulizi la Kigiriki kwa njia ya asili katika Kiswahili.
