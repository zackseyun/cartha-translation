base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: sw
  text: Lakini Herodia alikuwa na kinyongo dhidi yake[a] na alitaka kumuua, lakini hakuweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimwekea kinyongo” au “alimchukia sana.” Nahau ya Kigiriki inaonyesha uhasama uliodumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na kauli iliyotangulia; “Lakini” kinaonyesha vizuri nguvu hiyo katika muktadha.
- source_word: Ἡρῳδιὰς
  choice: Herodia
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἐνεῖχεν αὐτῷ
  choice: alikuwa na kinyongo dhidi yake
  rationale: Nahau hii inaonyesha uhasama au chuki iliyodumu. Muundo “alikuwa na” unaakisi hali endelevu inayoonyeshwa na wakati wa kitenzi cha Kigiriki.
- source_word: ἤθελεν
  choice: alitaka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nia au tamaa iliyokuwapo.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: kumuua
  rationale: Hutoa maana ya moja kwa moja ya ἀποκτείνω bila kuongeza wazo la kisheria au hukumu ya maadili ambalo halijaelezwa wazi katika kitenzi.
- source_word: καὶ οὐκ ἠδύνατο
  choice: lakini hakuweza
  rationale: Ingawa καὶ kwa kawaida ni “na,” hapa inaonyesha tofauti kati ya nia ya Herodia na kutoweza kwake kuitimiza; “lakini” ni ya asili na wazi katika Kiswahili.
