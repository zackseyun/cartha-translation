lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kirai tegemezi cha wakati kinaonyesha kwa Kiswahili cha kawaida kwamba kusema kwa Herode kulifuata kusikia kwake.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye tofauti ndogo katika simulizi, sasa likirudi kwenye mwitikio wa Herode.
- source_word: ἔλεγεν
  choice: alisema
  rationale: Hii ni lugha ya kawaida ya simulizi; hali ya kitenzi cha Kigiriki inaweza pia kuonyesha kusema kwa kuendelea au kurudiwa, jambo linalotajwa katika tanbihi.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Yohana niliyemkata kichwa
  rationale: Mpangilio huu ni wa asili katika Kiswahili, unamtaja Yohana wazi na kuhifadhi maana mahususi ya kukata kichwa.
- source_word: οὗτος
  choice: huyo
  rationale: Kiwakilishi hiki kinahifadhi msisitizo wa kiashiria cha Kigiriki bila kufanya sentensi kuwa nzito.
- source_word: ἠγέρθη
  choice: amefufuliwa
  rationale: Huhifadhi kauli ya kutendwa ya Kigiriki na kuonyesha kwamba Yohana amerudishwa kutoka kwa wafu bila kubadili kauli hiyo kuwa ya kutenda.
theological_decisions:
- issue: Kauli ya ἠγέρθη katika lugha ya ufufuo
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kigiriki kina kauli ya kutendwa. “Amefufuliwa” huihifadhi na huepuka kutatua kimya kimya utata huo kwa kutumia kauli ya kutenda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Yohana niliyemkata kichwa, huyo...” unahifadhi msisitizo wa sentensi ya Kigiriki huku ukibaki wazi kwa msomaji wa kawaida.
