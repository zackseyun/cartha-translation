  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: sw
  text: Nao walipotoka katika mashua[a], mara watu wakamtambua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki husema, kwa karibu: “walipotoka katika mashua, mara wakimtambua.” Kitenzi “wakimtambua” ni kishiriki chenye mhusika wa wingi ambaye hajatamkwa kwa nomino; muktadha unaonyesha watu wa eneo hilo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: walipotoka
  rationale: Kauli tegemezi ya wakati inatafsiri genitive absolute kwa Kiswahili cha kawaida, huku ikihifadhi wazo la kutoka kwao katika mashua.
- source_word: πλοίου
  choice: mashua
  rationale: Katika muktadha wa Bahari ya Galilaya, πλοῖον ni chombo kidogo cha majini; “mashua” ni neno la kawaida na linalofaa.
- source_word: εὐθὺς
  choice: mara
  rationale: “Mara” linaonyesha kwamba utambuzi ulitokea bila kuchelewa na linahifadhi mwendo wa haraka unaopatikana mara nyingi katika Marko.
- source_word: ἐπιγνόντες
  choice: watu wakamtambua
  rationale: Kitenzi kinaonyesha kumtambua mtu baada ya kumwona. Neno “watu” limewekwa wazi kwa sababu Kiswahili kingeweza kuelewa kiambishi cha nafsi pekee kuwa kinawarudia waliotoka mashuani, ilhali muktadha unaonyesha wenyeji.
- source_word: αὐτὸν
  choice: -m- katika “wakamtambua”
  rationale: Kiambishi cha yambwa “-m-” kinawakilisha kiwakilishi cha Kigiriki kinachomrejelea Yesu kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Wanaomtambua Yesu ni nani?
  choice: Watu wa eneo hilo ndio waliomtambua
  alternative: 'Kuacha mhusika bila kutajwa: “mara wakamtambua”'
  rationale: Hili ni suala la sintaksia na muktadha, si uamuzi wa kimadhehebu. Mhusika wa ἐπιγνόντες hajatajwa moja kwa moja, lakini hawezi kwa urahisi kuwa αὐτῶν ya genitive absolute; mstari unaofuata unaonyesha kuwa wenyeji ndio waliomtambua na kukimbia katika eneo lote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” linaendeleza simulizi; “mara” ni fupi na la asili kuliko usemi mzito zaidi wa “mara moja.”
