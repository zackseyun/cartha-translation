translation:
  language: sw
  text: Akawaagiza wasichukue chochote kwa safari isipokuwa fimbo tu—wala mkate, wala mfuko[a], wala shaba[b] katika mikanda yao—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfuko wa msafiri” wa kubebea mahitaji.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “shaba”; hapa yaweza kumaanisha sarafu za shaba au fedha zilizobebwa katika mkanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: akawaagiza
  rationale: Kitenzi hiki kinaonyesha kutoa maelekezo yenye mamlaka; “akawaagiza” ni cha kawaida na chenye uzito ufaao.
- source_word: μηδὲν αἴρωσιν
  choice: wasichukue chochote
  rationale: Katika muktadha wa maandalizi ya safari, αἴρω ina maana ya kuchukua au kubeba; usemi huu ni wa asili katika Kiswahili.
- source_word: εἰς ὁδὸν
  choice: kwa ajili ya safari
  rationale: Huwasilisha kwa kawaida kusudi la vitu ambavyo wangechukua njiani.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: isipokuwa fimbo tu
  rationale: “Fimbo” inafaa kwa fimbo ya kutembelea, na “tu” inahifadhi msisitizo wa μόνον.
- source_word: ἄρτον
  choice: mkate
  rationale: Neno mahsusi la Kigiriki linamaanisha mkate, hivyo halijapanuliwa kuwa chakula kwa ujumla.
- source_word: πήραν
  choice: mfuko
  rationale: πήρα ni mfuko wa msafiri, hasa wa kubebea mahitaji; “mfuko” ni wazi na wa kawaida.
- source_word: ζώνην
  choice: mishipi yao
  rationale: ζώνη ni mshipi au ukanda wa kiunoni ulioweza kutumika kuhifadhia fedha; wingi unafuata kwa kawaida kundi la watu wanaoagizwa.
- source_word: χαλκόν
  choice: sarafu za shaba
  rationale: Ingawa maana halisi ni shaba, katika muktadha huu hutaja fedha za sarafu ya shaba; tafsiri hii huepuka picha isiyoeleweka ya kubeba metali ghafi.
