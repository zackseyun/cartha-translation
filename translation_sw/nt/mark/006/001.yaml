  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: sw
  text: Akaondoka huko, akaenda katika mji wake wa asili[a], na wanafunzi wake wakamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mahali pake pa asili.” Kigiriki kinatumia wakati uliopo wa kihistoria: “anakuja ... wanamfuata,” ili kufanya simulizi liwe hai zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha kuondoka mahali walipokuwa; “akaondoka” ni cha kawaida katika simulizi la Kiswahili na kinahifadhi mwendo kutoka mahali hapo.
- source_word: ἐκεῖθεν
  choice: huko
  rationale: Kielezi hiki hutaja mahali pa kuanzia mwendo. “Huko” ni kifupi na cha asili baada ya “akaondoka.”
- source_word: ἔρχεται
  choice: akaenda
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha simulizi hutumia kwa kawaida mfululizo wa vitenzi vya -ka-. “Akaenda” huonyesha mwendo kuelekea mahali panapotajwa bila kulazimisha mtazamo wa msemaji unaodokezwa na “akaja.”
- source_word: πατρίδα
  choice: mji alikokulia
  rationale: Katika muktadha huu neno linamaanisha kwa kawaida mahali pa nyumbani kwa Yesu, yaani eneo au mji wake wa asili. “Mji alikokulia” ni Kiswahili cha kawaida kinachowasilisha wazo hilo, huku tanbihi ikihifadhi uwezekano mpana wa “mahali pake pa asili.”
- source_word: ἀκολουθοῦσιν
  choice: wakamfuata
  rationale: “Kumfuata” huhifadhi maana ya kawaida ya ἀκολουθέω pamoja na dokezo lake la uanafunzi; umbo la -ka- linaunganisha tukio hili kwa mtiririko wa simulizi.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: “Wanafunzi” ndilo neno la Kiswahili lililozoeleka kwa μαθηταί na linahifadhi uhusiano wa kujifunza na kumfuata mwalimu.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika ἔρχεται na ἀκολουθοῦσιν
  choice: 'Umetafsiriwa kwa mtiririko wa simulizi wa wakati uliopita: “akaenda ... wakamfuata.”'
  alternative: Kuhifadhi wakati uliopo kwa namna ya “anaenda ... wanamfuata.”
  rationale: Hili ni suala la mtindo, si la mafundisho. Maumbo ya -ka- ni ya kawaida na hai katika simulizi la Kiswahili, huku tanbihi ikionyesha wazi umbo la Kigiriki.
- issue: Upana wa maana ya πατρίς
  choice: “mji alikokulia” katika matini kuu
  alternative: “mahali pake pa asili,” “mji wake,” au “nchi yake”
  rationale: Muktadha wa Marko unaelekeza kwenye mahali pa nyumbani kwa Yesu, lakini neno la Kigiriki linaweza kuwa pana kuliko mji peke yake. Tanbihi inahifadhi upana huo bila kufanya matini kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa -ka- umetumiwa kuleta mtiririko wa kawaida wa simulizi. “Mji alikokulia” unaeleweka kwa wasomaji wa kawaida, na tanbihi inalinda upana wa neno la asili pamoja na wakati uliopo wa kihistoria.
