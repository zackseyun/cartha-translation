translation:
  language: sw
  text: Wakaokota vikapu kumi na viwili vilivyojaa vipande vilivyovunjwa[a], pamoja na mabaki ya samaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikapu kumi na viwili vya vipande vilivyovunjwa, vikiwa vimejaa.” Usemi wa Kigiriki unaunganisha “vipande vilivyovunjwa,” “vikapu kumi na viwili,” na “ujazo/kiasi kilichojaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wakaokota
  rationale: Katika muktadha wa kukusanya mabaki baada ya watu kula, kitenzi hiki kinaelezwa kwa Kiswahili cha kawaida na sahihi kwa ‘wakaokota’.
- source_word: κλάσματα
  choice: vipande vilivyobaki
  rationale: κλάσματα ni vipande vilivyomegwa au kuvunjwa; muktadha unaonyesha kuwa ni mabaki ya chakula. Tafsiri hii ni ya asili na haifanyi ‘vipande’ kuwa mabaki ya samaki pia.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: vikapu kumi na viwili vilivyojaa
  rationale: Muundo huu huhusisha vikapu kumi na viwili na kiasi kilichovijaza. ‘Vikapu ... vilivyojaa’ huhifadhi maana kwa Kiswahili cha kawaida.
- source_word: κόφινος
  choice: kikapu
  rationale: Neno hili humaanisha kikapu; kutaja ukubwa wake kungeongeza jambo lisiloelezwa wazi katika mstari.
- source_word: πληρώματα
  choice: vilivyojaa
  rationale: Hueleza kiasi kinachojaza vyombo au yaliyomo kwa ujazo; ‘vilivyojaa’ ni usemi wazi na wa kawaida.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: pamoja na mabaki ya samaki
  rationale: 'ἀπό hapa huonyesha chanzo cha sehemu iliyokusanywa: kilichokusanywa kilitokana pia na samaki. ‘Mabaki ya samaki’ huwasilisha maana hiyo kiasili bila kudai kwamba samaki wote walikusanywa.'
