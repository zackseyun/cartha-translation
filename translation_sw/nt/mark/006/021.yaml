  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: sw
  text: Na siku iliyofaa ilipowadia[a], Herode aliwaandalia wakuu wake, makamanda wa jeshi, na watu mashuhuri wa Galilaya[b] karamu ya kusherehekea siku yake ya kuzaliwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku iliyotoa fursa ilipowadia” au “siku nzuri kwa kusudi hilo ilipowadia.” Kigiriki kinaonyesha wakati unaofaa au fursa ya kutekeleza jambo.
    reason: lexical_alternative
  - marker: b
    text: Au, “viongozi wakuu wa Galilaya.” Usemi huu unarejelea watu wa cheo cha juu na wenye ushawishi katika eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Na
  rationale: Inahifadhi kiunganishi cha kisimulizi kinachotumiwa na Marko.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: siku yenye kufaa ilipofika
  rationale: Muundo huu unaonyesha kwamba nafasi iliyokuwa ikingojewa hatimaye ilijitokeza; ‘yenye kufaa’ huhifadhi maana ya wakati unaofaa au wenye kutoa fursa bila kufafanua kwa upande gani.
- source_word: ὅτε
  choice: wakati
  rationale: Huanzisha tukio mahususi lililoifanya siku hiyo iwe yenye kufaa.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: ya siku yake ya kuzaliwa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa sherehe iliyofanywa katika tukio la siku ya kuzaliwa.
- source_word: δεῖπνον ἐποίησεν
  choice: aliwaandalia karamu
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau yenye maana halisi ya ‘alifanya chakula cha jioni,’ huku ikionyesha dhifa rasmi kwa wageni wenye hadhi.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: wakuu wake
  rationale: Inarejelea watu wa cheo cha juu waliokuwa karibu na utawala wa Herode, bila kuingiza mfumo maalumu wa vyeo usiotajwa wazi.
- source_word: τοῖς χιλιάρχοις
  choice: makamanda wa jeshi
  rationale: Hutoa kwa uwazi kazi ya maafisa hawa waandamizi wa kijeshi bila kutumia cheo cha kiufundi cha Kirumi ambacho huenda kisikusudiwe moja kwa moja hapa.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: watu mashuhuri wa Galilaya
  rationale: Hueleza watu wenye hadhi na ushawishi mkubwa katika eneo hilo; ‘watu’ ni ya asili katika Kiswahili na haidai jinsia ambayo nomino ya Kigiriki hapa haibainishi kimaumbo.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Ni umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
