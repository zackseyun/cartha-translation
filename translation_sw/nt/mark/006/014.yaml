  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: sw
  text: Mfalme Herode akasikia habari hizo, kwa maana jina la Yesu lilikuwa limejulikana sana. Watu walikuwa wakisema, “Yohana Mbatizaji[a] amefufuliwa kutoka kwa wafu[b], na ndiyo sababu nguvu hizi[c] zinatenda kazi ndani yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Yohana anayebatiza.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “amefufuka kutoka kwa wafu.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa: “amefufuliwa.”'
    reason: alternative_reading
  - marker: c
    text: Au, “nguvu za miujiza” au “matendo makuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Mfalme Herode
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unawakilisha wazi cheo βασιλεύς pamoja na jina Herode.
- source_word: ἤκουσεν
  choice: akasikia habari hizo
  rationale: Kitenzi cha Kigiriki hakitaji yambwa wazi; “habari hizo” hurejelea kwa njia ya kawaida matendo na sifa ya Yesu katika simulizi lililotangulia bila kuongeza tukio jipya.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: kwa maana jina lake lilikuwa limejulikana sana
  rationale: “Jina lake” huhifadhi usemi wa Kigiriki na kiwakilishi chake, huku “lilikuwa limejulikana sana” kikitoa maana ya kwamba jina au sifa yake ilikuwa imeenea.
- source_word: ἔλεγον
  choice: Watu walikuwa wakisema
  rationale: Kitenzi cha wingi kina mtendaji asiyeainishwa; “watu” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Yohana Mbatizaji
  rationale: “Mbatizaji” huhifadhi maana ya kishiriki, yaani mtu anayebatiza, na pia ni jina linaloeleweka kwa wasomaji wa Kiswahili.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: amefufuliwa kutoka kwa wafu
  rationale: “Amefufuliwa” huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki, na “kutoka kwa wafu” huwakilisha ἐκ νεκρῶν kwa uwazi.
- source_word: διὰ τοῦτο
  choice: na ndiyo sababu
  rationale: Usemi huu unaonyesha kuwa kufufuliwa kwa Yohana kulidhaniwa kuwa sababu ya nguvu hizo kutenda kazi ndani yake.
- source_word: αἱ δυνάμεις
  choice: nguvu hizi
  rationale: “Nguvu” hudumisha upana wa δύναμεις bila kuamua kimya kimya ikiwa neno hilo linamaanisha nguvu za kimiujiza au matendo makuu yenyewe.
- source_word: ἐνεργοῦσιν ἐν αὐτῷ
  choice: zinatenda kazi ndani yake
  rationale: Kauli hii huhifadhi hali ya kuendelea ya kitenzi na tafsiri ya moja kwa moja ya ἐν αὐτῷ, badala ya kuibadili kuwa “kupitia kwake.”
theological_decisions:
- issue: Hali ya kitenzi ἐγήγερται katika kauli ya ufufuo
  choice: amefufuliwa kutoka kwa wafu
  alternative: amefufuka kutoka kwa wafu
  rationale: Kigiriki kina hali ya kutendwa, hivyo “amefufuliwa” huihifadhi bila kuhamishia tendo hilo kwa Yohana mwenyewe.
- issue: Maana ya αἱ δυνάμεις
  choice: nguvu hizi
  alternative: nguvu za miujiza; matendo makuu
  rationale: Neno la Kigiriki linaweza kurejelea nguvu au maajabu yanayotokana na nguvu hizo. Tafsiri kuu huhifadhi upana huo, na tanbihi inaonyesha maana nyingine zinazowezekana.
- issue: Mahali nguvu zinapotenda kazi, ἐν αὐτῷ
  choice: ndani yake
  alternative: kupitia kwake
  rationale: “Ndani yake” hufuata kwa karibu kihusishi cha Kigiriki na haibadili kauli kuwa maelezo ya chombo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima na unaosomeka kwa urahisi. Viwakilishi na upana wa maneno ya Kigiriki vimehifadhiwa pale ambapo kuvibainisha zaidi kungeondoa utata halisi wa matini.
