  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: sw
  text: Lakini wengine walikuwa wakisema, “Yeye ni Eliya,” na wengine walikuwa wakisema, “Yeye ni nabii[a], kama mmoja wa manabii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwezekano mdogo zaidi, “yule Nabii,” ikiwa maneno haya yanaeleweka kumhusu mhusika maalumu wa nyakati za mwisho. Hapa Kigiriki kinaelekea zaidi kumaanisha “nabii,” kwa sababu kinaendelea kusema, “kama mmoja wa manabii.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Lakini wengine
  rationale: ἄλλοι hutaja kundi jingine, na δέ huleta badiliko lenye utofautishaji mdogo; “Lakini wengine” ni ya kawaida na hudumisha mtiririko huo.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha usemi uliokuwa ukiendelea au kurudiwa; muundo huu unadumisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Yeye ni Eliya,”
  rationale: Usemi wa moja kwa moja unasomeka kwa urahisi baada ya kitenzi cha kusema, na Ἠλίας hutolewa kwa jina la kawaida la Kiswahili “Eliya.”
- source_word: προφήτης
  choice: nabii
  rationale: Nomino hii isiyo na kibainishi ina maana isiyo mahususi katika muktadha huu. Kiswahili hakihitaji kibainishi kinacholingana na “a,” hivyo “nabii” huwasilisha maana ya jumla bila kuifanya kuwa cheo mahususi.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: kama mmoja wa manabii
  rationale: ὡς huonyesha ulinganisho, na tafsiri hii hudumisha wazo la kumlinganisha Yesu na mmoja wa manabii.
theological_decisions:
- issue: Iwapo προφήτης itafsiriwe kwa maana ya jumla “nabii” au kama cheo maalumu “yule Nabii”
  choice: nabii
  alternative: yule Nabii
  rationale: Kigiriki hakina kibainishi, na maneno yanayofuata, ὡς εἷς τῶν προφητῶν (“kama mmoja wa manabii”), yanaelekeza kwa utambulisho wa jumla wa kinabii. Hata hivyo, uwezekano mdogo wa kuelewa kama mhusika maalumu wa nyakati za mwisho umewekwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “walikuwa wakisema” umechaguliwa kuhifadhi hali endelevu au ya kurudiwa ya ἔλεγον; “nabii” limeachwa bila kiashiria maalumu kwa kuwa Kiswahili hueleza maana isiyo mahususi kwa njia hiyo.
