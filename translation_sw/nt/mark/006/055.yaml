base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: sw
  text: Wakazunguka eneo lile lote kwa mbio, wakaanza kuwabeba wagonjwa kwenye mikeka[a] hadi popote waliposikia kwamba yuko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya magodoro mepesi” au “juu ya vitanda vidogo”; neno la Kiyunani linamaanisha tandiko rahisi linaloweza kubebwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: Wakakimbia katika
  rationale: Kitenzi hiki kinaonyesha mwendo wa haraka ulioenea katika eneo lote; “wakakimbia katika” huhifadhi haraka hiyo kwa Kiswahili cha kawaida.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: eneo lile lote
  rationale: χώρα hapa ni wilaya au eneo linalozunguka, si nchi kwa maana ya taifa; “eneo lile lote” huhifadhi pia msisitizo wa ὅλην na ἐκείνην.
- source_word: ἤρξαντο ... περιφέρειν
  choice: wakaanza kuwabeba
  rationale: Muundo huu unaonyesha mwanzo wa tendo la kuwachukua wagonjwa kutoka mahali hadi mahali.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: juu ya mikeka
  rationale: κράβαττος ni tandiko rahisi linaloweza kubebwa, kama mkeka, godoro jepesi, au kitanda kidogo; “mikeka” ni neno linaloeleweka kwa urahisi katika mazingira haya.
- source_word: τοὺς κακῶς ἔχοντας
  choice: wagonjwa
  rationale: Huu ni msemo wa Kiyunani unaomaanisha watu waliokuwa na hali mbaya ya afya; “wagonjwa” ni tafsiri ya kawaida na wazi.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: hadi popote waliposikia kwamba yuko
  rationale: ὅπου katika muktadha huu inaelekeza kwenye mahali walikowapeleka wagonjwa, na ὅτι inaanzisha taarifa waliyoisikia kuhusu mahali Yesu alikuwapo.
