source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: sw
  text: Kwa maana Herode alimwogopa Yohana, akijua kwamba Yohana alikuwa mtu mwadilifu na mtakatifu, naye akamlinda. Alipomsikia, alifadhaika sana[a], lakini alimsikiliza kwa furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “alifanya mambo mengi,” badala ya “alifadhaika sana.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: alimwogopa
  rationale: Kitenzi hiki kinahifadhi maana ya moja kwa moja ya Herode kuwa na hofu ya Yohana, huku muktadha ukionyesha kwamba hofu hiyo iliambatana na kumtambua na kumstahi.
- source_word: εἰδὼς
  choice: akijua kwamba
  rationale: Muundo huu wa kitenzi tegemezi unaonyesha sababu ya mtazamo na hatua ya Herode bila kueleza zaidi ya maandishi.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: mtu mwadilifu na mtakatifu
  rationale: “Mwadilifu” huonyesha unyoofu wa kimaadili, na “mtakatifu” huhifadhi wazo la tabia iliyowekwa wakfu kwa Mungu; “mtu” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: συνετήρει αὐτόν
  choice: akamlinda
  rationale: Katika muktadha huu kitenzi kinaelekea kumaanisha kumkinga Yohana na madhara, si kumweka kizuizini tu.
- source_word: ἀκούσας αὐτοῦ
  choice: alipomsikia
  rationale: Hutoa kwa ufupi maana ya wakati ya kishirikishi na matumizi ya ἀκούω pamoja na mtu anayesikiwa.
- source_word: πολλὰ ἠπόρει
  choice: alitatizika sana
  rationale: ἠπόρει huonyesha kuchanganyikiwa au kukosa la kufanya; “alitatizika sana” ni Kiswahili cha kawaida kinachohifadhi nguvu ya πολλὰ bila kufafanua chanzo cha tatizo.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: alimsikiliza kwa furaha
  rationale: Kauli hii inaonyesha kwamba Herode alipenda au alifurahia kumsikiliza Yohana; “lakini” huweka wazi tofauti iliyopo kati ya kutatizika kwake na kuendelea kusikiliza kwa furaha.
theological_decisions:
- issue: Tofauti ya maandishi katika kishazi kinachoeleza mwitikio wa Herode baada ya kumsikia Yohana
  choice: 'Kufuata SBLGNT: “alitatizika sana” (ἠπόρει)'
  alternative: “alifanya mambo mengi” (ἐποίει)
  rationale: Usomaji wa maandishi msingi unaonyesha hali ya Herode ya kuchanganyikiwa au kukosa la kufanya, na hivyo huhifadhi mvutano kati ya kutatizika kwake na furaha yake ya kumsikiliza Yohana. Usomaji mwingine umewekwa katika tanbihi kwa sababu unabadilisha maana kwa kiasi kikubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. “Alimwogopa” huhifadhi uzito wa hofu, “akamlinda” huwasilisha maana ya kinga kwa kawaida, na tofauti ya “alimsikia” na “alimsikiliza” huonyesha kusikia kwanza kisha kusikiliza kwa makusudi.
