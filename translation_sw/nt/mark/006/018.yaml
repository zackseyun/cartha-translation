id: MRK.6.18
reference: Mark 6:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: sw
  text: Kwa maana Yohana alikuwa akimwambia Herode, “Si halali[a] kwako kuwa na mke wa ndugu yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huruhusiwi kuwa na mke wa ndugu yako.”
    reason: Mbadala huu unaonyesha maana ya ruhusa iliyomo katika ἔξεστιν, huku maandishi makuu yakihifadhi zaidi uzito wa uhalali wa kimaadili na kisheria.
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akimwambia
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililoendelea au lililorudiwa zamani; muundo huu wa Kiswahili unahifadhi maana hiyo kwa lugha ya kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa maelezo ya muktadha uliotangulia; “Kwa maana” kinahifadhi uhusiano huo wa ufafanuzi.
- source_word: Ἡρῴδῃ
  choice: Herode
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Si halali kwako
  rationale: ἔξεστιν huhusu jambo linaloruhusiwa au lililo halali. Katika karipio hili la kinabii kuhusu ndoa, “Si halali kwako” huhifadhi uzito wa kimaadili na kisheria bila kuongeza rejeo lisilotajwa wazi.
- source_word: ἔχειν
  choice: kuwa na
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi katika muktadha huu, na ni usemi wa kawaida wa Kiswahili kuhusu uhusiano wa ndoa.
- source_word: γυναῖκα
  choice: mke
  rationale: Ingawa neno linaweza kumaanisha “mwanamke” au “mke,” kirai “wa ndugu yako” kinaonyesha wazi maana ya kindoa.
- source_word: τοῦ ἀδελφοῦ σου
  choice: wa ndugu yako
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi uhusiano wa kifamilia ulio kiini cha shtaka la Yohana.
theological_decisions:
- issue: Asili ya karipio la Yohana
  choice: Si halali kwako
  alternative: Huruhusiwi
  rationale: Tafsiri kuu inahifadhi nguvu ya kimaadili na kisheria ya ἔξεστιν, inayoweza kuashiria masharti ya Torati, bila kutaja wazi sheria ambayo mstari wenyewe hauitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Alikuwa akimwambia” ni cha asili na kinaonyesha tendo lililoendelea au kurudiwa; “Si halali kwako” ni wazi kwa wasomaji wa kawaida na kinahifadhi uzito wa karipio.
