base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: sw
  text: Naye akamwapia, “Chochote utakachoniomba[a], nitakupa, hadi nusu ya ufalme wangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jambo lolote utakaloomba kwangu.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “hadi nusu ya ufalme wangu” ilikuwa namna ya kifalme ya kutoa ahadi kubwa kupita kiasi.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν αὐτῇ
  choice: akamwapia
  rationale: Kitenzi hiki kinaonyesha kwamba alifanya kiapo kwake. “Akamwapia” ni Kiswahili cha kawaida, cha heshima, na kinahifadhi uzito wa kiapo hicho.
- source_word: Ὅ τι ἐάν με αἰτήσῃς
  choice: Chochote utakachoniomba
  rationale: Muundo huu unaonyesha ombi lisilowekewa mipaka maalumu. “Chochote utakachoniomba” ni wa asili katika Kiswahili na unadumisha upana wa ahadi.
- source_word: δώσω σοι
  choice: nitakupa
  rationale: Wakati ujao wa kitenzi una nguvu ya ahadi ya moja kwa moja; “nitakupa” ni tafsiri wazi na ya kawaida.
- source_word: ἕως ἡμίσους
  choice: hata nusu
  rationale: Hapa ἕως inaonyesha kiwango cha juu, si wakati. “Hata nusu” huwasilisha mpaka wa kiasi kwa Kiswahili cha asili.
- source_word: τῆς βασιλείας μου
  choice: ya ufalme wangu
  rationale: βασιλεία inaweza kumaanisha utawala, mamlaka ya kifalme, au eneo linalotawaliwa. Katika kauli hii ya kifalme, “ufalme wangu” ni chaguo la kawaida linalohifadhi taswira ya usemi huo.
theological_decisions:
- issue: Maana ya βασιλεία katika kauli ya Herode
  choice: ufalme
  alternative: utawala; mamlaka ya kifalme
  rationale: Muktadha unaonyesha ahadi ya kifalme iliyotiwa chumvi. “Ufalme” huwasilisha usemi huo bila kuipa βασιλεία maana maalumu ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa leo. “Akamwapia” huhifadhi uzito wa kiapo, na “hata nusu ya ufalme wangu” huhifadhi usemi wa kifalme bila kuueleza kupita kiasi ndani ya matini.
