  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: sw
  text: Nao walikuwa wakitoa pepo wengi, na kuwapaka wagonjwa wengi mafuta[a] na kuwaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafuta ya zeituni.”
    reason: Neno ἔλαιον linaweza kutajwa kwa upana kuwa “mafuta,” lakini katika mazingira ya Mediterania ya kale mara nyingi lilimaanisha mafuta ya zeituni.
lexical_decisions:
- source_word: δαιμόνια
  choice: pepo
  rationale: Katika muktadha huu neno hilo linamaanisha viumbe waovu wa kiroho. “Pepo” ni tafsiri ya kawaida na ya moja kwa moja ya Kiswahili, bila kuingiza usemi tofauti wa “roho wachafu” ambao hautumiki katika mstari huu.
- source_word: πολλὰ
  choice: wengi
  rationale: Kivumishi hiki kinaonyesha idadi kubwa ya pepo na kimetafsiriwa kwa njia ya kawaida ya Kiswahili.
- source_word: ἐξέβαλλον
  choice: walikuwa wakitoa
  rationale: Muundo huu unaonyesha tendo lililokuwa likifanyika mara kwa mara katika muhtasari huu wa simulizi, hivyo unadumisha hali ya kitenzi cha Kigiriki cha wakati usiotimilika.
- source_word: ἤλειφον
  choice: kuwapaka
  rationale: ἀλείφω humaanisha kupaka au kutia kitu kama mafuta. “Kuwapaka” ni ya kawaida katika Kiswahili na inaeleza tendo lenyewe bila kulipa maana ya kiibada ambayo mstari hautamki wazi.
- source_word: ἐλαίῳ
  choice: mafuta
  rationale: Neno la Kigiriki humaanisha mafuta, ambayo katika mazingira ya kale mara nyingi yalikuwa mafuta ya zeituni. “Mafuta” yanatosha katika matini kuu, huku uwezekano wa kuyataja wazi kama mafuta ya zeituni ukihifadhiwa katika tanbihi.
- source_word: πολλοὺς ἀρρώστους
  choice: wagonjwa wengi
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili kwa kivumishi cha Kigiriki kilichotumiwa kama nomino na kuainishwa kwa wingi.
- source_word: ἐθεράπευον
  choice: kuwaponya
  rationale: θεραπεύω hapa humaanisha kuponya. Muundo ulioratibiwa na “walikuwa” unaendeleza maana ya matendo yaliyofanyika mara kwa mara, na kiwakilishi “-wa-” kinawarejelea wagonjwa.
- source_word: καὶ
  choice: na / nao
  rationale: Viunganishi rahisi vinahifadhi mtindo wa Kigiriki wa kuunganisha matendo kwa mfululizo. “Nao” mwanzoni pia huwaunganisha wanafunzi na simulizi lililotangulia.
theological_decisions:
- issue: Jukumu la kupaka mafuta katika kuponya
  choice: 'Tendo limetafsiriwa kama taarifa ya kihistoria: waliwapaka wagonjwa mafuta na kuwaponya, bila kufafanua utaratibu wa kitheolojia.'
  alternative: Kusema kwamba mafuta yenyewe ndiyo yaliyowaponya, au kwamba kupaka mafuta hakukuwa na nafasi yoyote isipokuwa kuwa ishara.
  rationale: Mstari unaunganisha kupaka mafuta na kuponya, lakini hauelezi kama mafuta yalikuwa njia yenye nguvu yenyewe, ishara tu, au yalikuwa na jukumu jingine. Tafsiri inahifadhi mvutano huo bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Muundo “walikuwa wakitoa” unaonyesha wazi tendo lililorudiwa; vitenzi vinavyofuata “kuwapaka ... na kuwaponya” vinaongozwa na muundo huohuo. Alama ya tanbihi imewekwa baada ya “mafuta,” kwa kuwa tanbihi inahusu ἐλαίῳ, si δαιμόνια.
