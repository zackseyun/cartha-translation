base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: sw
  text: bali wavae sandali, wala wasijivike kanzu mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasivae kanzu mbili.” Kitenzi cha Kigiriki kinaweza kueleweka kuwa tendo la kujivika au hali ya kuwa umevaa; matini kuu inaonyesha tendo hilo kwa ukaribu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi hiki kinaonyesha tofauti na maagizo yaliyotangulia kuhusu vitu vya kubeba safarini; “bali” ni fupi na ya kawaida katika muktadha huu.
- source_word: ὑποδεδεμένους
  choice: wavae
  rationale: Kauli hii ya hali timilifu inaonyesha kuwa wawe wamevaa kitu miguuni. “Wavae” ni ya asili katika Kiswahili na, katika muktadha wa agizo, inawasilisha hali inayotakiwa.
- source_word: σανδάλια
  choice: sandali
  rationale: Ni tafsiri ya moja kwa moja ya aina hii ya kiatu cha wazi, bila kuongeza maelezo yasiyomo katika matini.
- source_word: μὴ ἐνδύσησθε
  choice: wala wasijivike
  rationale: Muundo wenye μή unatoa katazo, na kitenzi cha kati kinaelekeza tendo la mtu kujivika mwenyewe. “Wasijivike” linadumisha tendo hilo kuliko tafsiri ya hali tu.
- source_word: δύο
  choice: mbili
  rationale: Nambari imetafsiriwa moja kwa moja na kupatanishwa kisarufi na “kanzu.”
- source_word: χιτῶνας
  choice: kanzu
  rationale: Neno hili linamaanisha vazi la msingi lililovaliwa mwilini. “Kanzu” ni neno linaloeleweka katika Kiswahili cha Biblia na halitumii neno la kisasa kama “shati,” ingawa vazi la kale halikuwa sawa kabisa na kanzu ya kisasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima na unaosomeka kwa urahisi. “Wala” linaendeleza katazo kwa kawaida, na “kanzu” limetumiwa kwa vazi la kale bila kulifanya kuwa “shati” la kisasa.
