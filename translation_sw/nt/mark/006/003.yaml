source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: sw
  text: Je, huyu si yule seremala, mwana wa Maria na ndugu wa kiume wa Yakobo, Yose, Yuda na Simoni?[a] Na dada zake[a] hawapo hapa pamoja nasi? Nao walichukizwa naye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa.” Maneno ya Kigiriki yaliyotafsiriwa “ndugu wa kiume” na “dada” kwa kawaida humaanisha ndugu wa kiume na dada, lakini baadhi ya mapokeo ya Kikristo huyafahamu hapa kuwa jamaa wengine au watoto wa kambo.
    reason: alternative_reading
  - marker: b
    text: Au “walikwazwa kwa sababu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: seremala
  rationale: Neno hilo humaanisha fundi wa kazi za mikono na linaweza kuwa pana kuliko kazi ya mbao pekee; lakini katika muktadha huu, “seremala” ni tafsiri ya kawaida, wazi na inayofaa mazingira ya kijiji.
- source_word: υἱὸς τῆς Μαρίας
  choice: mwana wa Maria
  rationale: Inahifadhi moja kwa moja namna ya pekee ya kumtambulisha Yesu kwa jina la mama yake, bila kueleza kama kauli hiyo ilikuwa ya kawaida au ya dharau.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: ndugu / dada
  rationale: “Ndugu” na “dada” zinawakilisha maana ya kawaida ya maneno ya Kigiriki. Tanbihi inadumisha uwezekano wa kuelewa uhusiano huo kwa upana zaidi bila kuamua mjadala wa kimapokeo.
- source_word: Ἰωσῆτος
  choice: Yose
  rationale: Inanakili umbo mahususi la jina la Kigiriki lililo katika kifungu hiki badala ya kulisawazisha kuwa “Yusufu.”
- source_word: ὧδε πρὸς ἡμᾶς
  choice: hapa pamoja nasi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwapo kwao mahali pamoja na wasemaji na ukaribu wao wa kijamii.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: walichukizwa naye
  rationale: Katika muktadha huu kitenzi kinaonyesha kumkataa au kukasirishwa kwa sababu yake, si kujikwaa kimwili; “walichukizwa naye” ni cha asili na hudumisha mwitikio wao hasi.
theological_decisions:
- issue: Uhusiano wa “ndugu” na “dada” kwa Yesu
  choice: Kutumia maneno ya kawaida “ndugu” na “dada” katika matini kuu bila kuamua uhusiano wao kamili.
  alternative: Jamaa wa karibu au watoto wa kambo.
  rationale: Maneno ya Kigiriki kwa kawaida humaanisha kaka/ndugu wa kiume na dada, lakini mapokeo ya Kikristo yametofautiana kuhusu ikiwa walikuwa ndugu wa tumbo moja, watoto wa kambo, au jamaa wengine. Tafsiri haiamui zaidi ya inavyosema Kigiriki.
- issue: Nguvu ya kijamii ya “mwana wa Maria”
  choice: Kutafsiri moja kwa moja kama utambulisho uliotumiwa na watu wa mji.
  alternative: Kuifanya wazi kuwa utambulisho wa dharau au wa kawaida tu.
  rationale: Huenda kauli hiyo ilikuwa na makali ya kijamii, lakini matini haielezi wazi; kwa hiyo tafsiri haiongezi hukumu hiyo.
- issue: Maana ya ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: walichukizwa naye
  alternative: walikwazwa kwa sababu yake
  rationale: Maana ya kimuktadha ni kwamba walimwona kuwa sababu ya kukwazika na hivyo wakamkataa. Tanbihi huhifadhi taswira ya “kukwazwa” iliyomo katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili na utambulisho “mwana wa Maria” umehifadhiwa. Majina Yakobo, Yose, Yuda na Simoni yanafuata maumbo ya chanzo kwa namna inayosomeka kwa Kiswahili.
