  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: sw
  text: Mara moja akaingia kwa haraka mbele ya mfalme, akamwomba akisema, “Nataka unipe sasa hivi, juu ya sinia, kichwa cha Yohana Mbatizaji.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: akaingia
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha kuingia kwake mahali pa karamu au mbele ya mfalme; ‘akaingia’ ni simulizi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Neno hili linalotumiwa sana na Marko linaonyesha kuwa hatua ilifanyika bila kuchelewa.
- source_word: μετὰ σπουδῆς
  choice: kwa haraka
  rationale: Kirai hiki kinaonyesha mwendo wa dharura na wa kasi bila kuingiza maana chanya ya shauku.
- source_word: βασιλέα
  choice: mfalme
  rationale: Ingawa kihistoria Herode Antipa alikuwa mtawala wa robo, maandishi ya Kigiriki yanatumia βασιλεύς, hivyo cheo hicho kimetafsiriwa kama kilivyo.
- source_word: ᾐτήσατο
  choice: akaomba
  rationale: αἰτέω hapa ni kutoa ombi. ‘Akaomba’ ni ya kawaida katika Kiswahili, huku ukali wa matakwa yake ukionekana katika maneno anayosema.
- source_word: Θέλω
  choice: Nataka
  rationale: θέλω inaeleza nia moja kwa moja; ‘Nataka’ inadumisha usemi wake wa wazi na mkali.
- source_word: ἵνα ... δῷς μοι
  choice: unipe
  rationale: Kishazi cha ἵνα kinaeleza jambo analotaka; ‘Nataka unipe’ ni muundo wa asili wa Kiswahili.
- source_word: ἐξαυτῆς
  choice: sasa hivi
  rationale: Neno hili linasisitiza kutendeka mara hiyo. Limetafsiriwa tofauti na εὐθύς ili kuhifadhi misisitizo yote miwili ya wakati.
- source_word: ἐπὶ πίνακι
  choice: juu ya sinia
  rationale: πίναξ ni sinia au sahani kubwa ya kuandalia chakula; ‘sinia’ inafaa mazingira ya karamu na ni neno la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: κεφαλὴν
  choice: kichwa
  rationale: Tafsiri ya moja kwa moja inadumisha maelezo ya kutisha ambayo ni sehemu muhimu ya simulizi.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohana Mbatizaji
  rationale: βαπτιστής ni jina la kumweleza mtu anayebatiza. ‘Mbatizaji’ linatafsiri maana ya cheo hicho badala ya kukifanya jina lisiloelezwa.
theological_decisions:
- issue: Tafsiri ya Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohana Mbatizaji
  alternative: Yohana Mbatizaji (kwa mapokeo, Yohana Mbatizaji/Yohana Baptist)
  rationale: Hili si suala lenye mvutano wa kimafundisho, bali ni uamuzi wa kutafsiri cheo chenye maana iliyo wazi. ‘Mbatizaji’ inadumisha kazi inayoelezwa na βαπτιστής bila kuingiza utambulisho wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mtiririko wa vitenzi ‘akaingia ... akaomba akisema’ unadumisha mwendo wa simulizi la Marko; ‘mara moja’ na ‘sasa hivi’ zinahifadhi vielezi viwili tofauti vya uharaka katika chanzo.
