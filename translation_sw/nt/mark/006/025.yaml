  terminology: ‘Yohana Mbatizaji’ ni sahihi, ya kawaida katika Kiswahili cha Afrika Mashariki, na hutafsiri βαπτιστής kwa uaminifu. Tanbihi iliyopo hairuhusiwi kubaki kwa kuwa ‘Kwa mapokeo, “Yohana Mbatizaji”’ hairipoti mbadala wowote wa kile kilichomo katika matini.
