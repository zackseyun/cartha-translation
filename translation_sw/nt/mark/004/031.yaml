  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: sw
  text: Ni kama punje ya haradali[a], ambayo, inapopandwa ardhini, ni ndogo[b] kuliko mbegu zote zilizo ardhini—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu ya haradali.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina umbo la kulinganisha, “ndogo kuliko,” si umbo la kiwango cha juu, “ndogo kuliko zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Ni kama
  rationale: Hutanguliza ulinganisho unaotegemea swali la mstari uliotangulia; Kiswahili huongeza “Ni” ili sentensi iwe ya kawaida na wazi.
- source_word: κόκκῳ σινάπεως
  choice: punje ya haradali
  rationale: “Punje” huwakilisha κόκκος kwa kawaida katika picha ya mbegu ndogo; “haradali” ni jina linalotambulika la mmea huu.
- source_word: ὃς ὅταν σπαρῇ
  choice: ambayo inapopandwa
  rationale: Hurejelea punje na kuhifadhi hali ya jumla ya ὅταν pamoja na kauli tendwa ya σπαρῇ.
- source_word: ἐπὶ τῆς γῆς
  choice: ardhini
  rationale: Katika muktadha wa kilimo, γῆ ni ardhi au udongo; “ardhini” ni Kiswahili cha kawaida kwa mahali mbegu inapopandwa.
- source_word: μικρότερον ὂν
  choice: huwa ndogo kuliko
  rationale: Huhifadhi umbo la kulinganisha la μικρότερον badala ya kulibadili kuwa kiwango cha juu; “huwa” huonyesha kauli ya jumla kwa Kiswahili cha kawaida.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: mbegu zote zilizo ardhini
  rationale: Huhifadhi upeo mpana wa ulinganisho na kirai cha pili kinachohusu ardhi bila kuongeza ufafanuzi wa kibotania.
theological_decisions:
- issue: Ulinganisho dhidi ya kiwango cha juu katika maelezo ya punje ya haradali
  choice: ndogo kuliko mbegu zote
  alternative: ndogo zaidi kuliko mbegu zote / ndogo kuliko zote
  rationale: Nakala ya Kigiriki ina μικρότερον, umbo la kulinganisha. Tafsiri inahifadhi ulinganisho huo na mvutano wa kauli pana badala ya kuufanya wazi kuwa superlative.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya mkwaju mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
