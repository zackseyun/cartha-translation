  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: sw
  text: Alipoamka[a], akaukemea upepo na kuiambia bahari[b], “Nyamaza! Fungwa kinywa![c]” Upepo ukakoma, kukawa na utulivu mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipoamshwa.” Kigiriki ni umbo la kutendwa, ingawa katika muktadha huu linaweza pia kumaanisha “alipoamka”; mstari uliotangulia unasema wanafunzi walimwamsha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Bahari ya Galilaya, ambayo pia huitwa Ziwa la Galilaya; Kigiriki kinasema “bahari.”
    reason: cultural_note
  - marker: c
    text: Kigiriki kina amri mbili ambazo kihalisi ni, “Nyamaza! Fungwa kinywa!” Amri ya pili ina picha ya kufungwa kinywa au kutiwa kifuniko mdomoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: akaamka
  rationale: Kitenzi hiki ni umbo la wakati uliopita lisiloonyesha mtendaji moja kwa moja. “Akaamka” ni Kiswahili cha kawaida na kinaonyesha tendo lililotangulia kukemea bila kulazimisha iwapo aliamka mwenyewe au aliamshwa; uwezekano huo umeelezwa katika tanbihi.
- source_word: ἐπετίμησεν
  choice: akaukemea
  rationale: “Kukemea” hudumisha ukali na mamlaka ya ἐπιτιμάω, na pia kinafaa kwa matumizi ya neno hili katika Injili ya Marko.
- source_word: ἀνέμῳ
  choice: upepo
  rationale: Neno la Kigiriki linamaanisha upepo moja kwa moja; dhoruba inajulikana kutokana na muktadha.
- source_word: θαλάσσῃ
  choice: bahari
  rationale: “Bahari” hufuata θάλασσα badala ya kuibadili kuwa “ziwa,” huku tanbihi ikifafanua eneo linalokusudiwa.
- source_word: Σιώπα
  choice: Nyamaza!
  rationale: Amri hii inadai ukimya mara moja; “Nyamaza!” ni ya moja kwa moja, yenye nguvu, na ya kawaida katika Kiswahili.
- source_word: πεφίμωσο
  choice: Tulia!
  rationale: Kihalisi neno hili lina picha ya kufungwa kinywa, lakini kwa upepo na bahari “Tulia!” huwasilisha kwa kawaida matokeo yanayoamriwa. Picha halisi imehifadhiwa katika tanbihi.
- source_word: ἐκόπασεν
  choice: ukakoma
  rationale: “Kukoma” huonyesha kwamba upepo uliacha kuvuma, sawasawa na maana ya κοπάζω katika muktadha huu.
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: kukawa na utulivu mkubwa
  rationale: Kauli hii inadumisha matokeo ya hali mpya na nguvu ya kivumishi μεγάλη, bila kugeuza “mkubwa” kuwa “kabisa” kimya kimya.
theological_decisions:
- issue: Jinsi ya kutafsiri amri mbili za Yesu kwa bahari
  choice: “Nyamaza! Tulia!” katika maandishi, pamoja na tanbihi ya picha halisi ya kufungwa kinywa
  alternative: “Nyamaza! Ufungwe kinywa!”
  rationale: Chanzo hakina nomino inayomaanisha “amani,” bali kina amri mbili. Tafsiri iliyochaguliwa ni ya kawaida kwa Kiswahili inaposemwa kwa bahari, huku tanbihi ikihifadhi sitiari kali ya Kigiriki na mamlaka ya amri.
- issue: Iwapo θάλασσα itafsiriwe kuwa “bahari” au “ziwa”
  choice: bahari
  alternative: ziwa
  rationale: “Bahari” hufuata neno la chanzo na haipunguzi kwa tafsiri tu mwangwi mpana wa simulizi kuhusu mamlaka juu ya bahari; tanbihi hutoa ufafanuzi wa kijiografia.
- issue: Iwapo διεγερθεὶς ibainishe kwamba Yesu aliamshwa na wengine
  choice: akaamka, huku tanbihi ikitaja uwezekano wa “aliamshwa”
  alternative: aliamshwa
  rationale: Umbo la Kigiriki ni la kutendwa, lakini katika Kigiriki linaweza kutumika kwa maana ya kuamka. Muktadha unaonyesha wanafunzi walimwamsha, hivyo tanbihi huhifadhi mvutano huo bila kuufanya tafsiri kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vinavyofuatana—“akaamka, akaukemea, akaiambia”—unatoa mwendo wa kawaida wa simulizi. “Utulivu mkubwa” hudumisha msisitizo wa γαλήνη μεγάλη, na tanbihi zinaweka wazi mambo ya kileksika na kijiografia bila kulemea maandishi makuu.
