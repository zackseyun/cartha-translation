lexical_decisions:
- source_word: ἐδίδασκεν
  choice: alikuwa akiwafundisha
  rationale: Muundo wa wakati uliopita unaoendelea unaakisi hali ya tendo endelevu au la kurudiwa inayoonyeshwa na imperfect ya Kigiriki.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Hueleza njia au chombo cha kufundishia; “kwa mifano” ni usemi wa kawaida wa Kiswahili kwa παραβολαί katika muktadha huu.
- source_word: πολλά
  choice: mambo mengi
  rationale: Neuta ya wingi hapa inaweza kueleweka kama yale mengi aliyofundisha; “mambo mengi” ni ya asili katika Kiswahili huku maana mbadala ya kiasi ikihifadhiwa katika tanbihi.
- source_word: ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Huhifadhi hali endelevu ya imperfect na kuandaa maneno ya moja kwa moja yanayofuata.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: katika mafundisho yake
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuunganisha maneno yanayofuata na tendo au maudhui ya kufundisha kwake.
- source_word: καὶ
  choice: Naye / na
  rationale: Viunganishi vimehifadhiwa ili kuendeleza mtiririko wa simulizi na mtindo wa Marko wa kuunganisha vifungu kwa καί.
- source_word: αὐτοὺς / αὐτοῖς
  choice: wa- / -waambia
  rationale: Viambishi vya Kiswahili vinaonyesha kwa njia ya asili wale waliofundishwa na wale walioambiwa.
