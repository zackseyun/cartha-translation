  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: sw
  text: Sikilizeni! Tazama[a], mpanzi alitoka kwenda kupanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalieni.”
    reason: Tofauti halali ya kutafsiri neno la kuvuta fikira ἰδού. “Tazama” huhifadhi vizuri kazi yake kama neno la mazungumzo; “Angalieni” pia huweza kutumiwa katika tafsiri yenye kuelekea zaidi kwa hadhira ya watu wengi.
lexical_decisions:
- source_word: Ἀκούετε
  choice: Sikilizeni!
  rationale: Ni amri ya wakati uliopo kwa wingi inayodai usikivu wa wasikilizaji; “Sikilizeni!” ni Kiswahili cha sasa na huhifadhi nguvu ya mwito huo.
- source_word: ἰδού
  choice: Angalieni
  rationale: Ni neno la mazungumzo linalovuta fikira kwa jambo linalofuata. “Angalieni” huhifadhi mwito wake wa wazi kwa hadhira ya watu wengi; “Tazama” pia ni tafsiri inayowezekana.
- source_word: ἐξῆλθεν
  choice: alitoka
  rationale: Kitenzi hiki kinaonyesha kwenda nje; “alitoka” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: ὁ σπείρων
  choice: mpanzi
  rationale: Kirai cha kisarufi kinamtaja mtu kwa shughuli yake ya kupanda. “Mpanzi” ni kifupi, wazi, na cha kawaida bila kuongeza kitu kinachopandwa.
- source_word: σπεῖραι
  choice: kwenda kupanda
  rationale: Kitenzi-jina kinaonyesha kusudi la kutoka. “Kwenda kupanda” huonyesha kusudi hilo kwa Kiswahili cha kawaida na kudumisha urudiaji wa mzizi wa kupanda uliomo katika Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri za moja kwa moja zinahifadhi msisitizo wa mwanzo wa mfano. Hakuna neno “mbegu” lililoongezwa, kwa kuwa halipo wazi katika mstari wa Kigiriki.
