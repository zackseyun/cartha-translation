review_pass:
  verdict: revise
  source_fidelity: “Sikilizeni!” accurately renders the plural present imperative Ἀκούετε, and “mpanzi alitoka kwenda kupanda” faithfully conveys the sower’s going out with the purpose of sowing. However, ἰδού is an attention-drawing particle, not itself a plural imperative. “Angalieni” unnecessarily supplies plural imperative morphology; “Tazama” better preserves its idiomatic discourse-particle function in Swahili.
  naturalness: “Sikilizeni! Tazama, mpanzi alitoka kwenda kupanda.” is natural, clear Standard East African Swahili with an appropriately elevated but current biblical register.
  terminology: “Mpanzi” and “kupanda” accurately retain the occupational designation and the sowing wordplay without adding “mbegu.”
  issues:
  - severity: medium
    issue: “Angalieni” translates ἰδού as a plural imperative.
    rationale: The Greek ἰδού is a discourse particle used to call attention, not an imperative addressed to a plural audience. “Tazama” is the established and natural Swahili attention marker and does not introduce this grammatical specification.
  revised_text: Sikilizeni! Tazama[a], mpanzi alitoka kwenda kupanda.
  revised_footnotes:
