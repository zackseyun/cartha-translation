  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: sw
  text: Akaanza tena kufundisha kando ya bahari. Umati mkubwa sana ukakusanyika kwake[a], hata akaingia katika mashua, akaketi baharini[b]; nao umati wote ulikuwa kando ya bahari, nchi kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri inayofuata kwa karibu zaidi wakati wa kitenzi cha Kigiriki: “unakusanyika kwake.” Marko mara nyingi hutumia wakati uliopo kusimulia matukio yaliyopita kwa uchangamfu.'
    reason: lexical_alternative
  - marker: b
    text: Yaani, Yesu alikuwa ndani ya mashua majini, huku umati ukiwa kando ya bahari juu ya nchi kavu.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa shughuli ya Yesu ya kufundisha na ni la kawaida katika Kiswahili cha sasa.
- source_word: ἤρξατο διδάσκειν
  choice: akaanza kufundisha
  rationale: Linahifadhi maana ya kuanza kwa tendo huku likifuata mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya bahari
  rationale: παρά hapa huonyesha mahali pembezoni; “bahari” linadumisha θάλασσα bila kulibadili kuwa “ziwa.”
- source_word: συνάγεται
  choice: ukakusanyika
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria kwa uchangamfu wa simulizi, wakati wa simulizi wa Kiswahili unasomeka kwa uasilia zaidi hapa; tanbihi inadokeza umbo la chanzo.
- source_word: ὄχλος πλεῖστος
  choice: umati mkubwa sana
  rationale: Linawasilisha nguvu ya πλεῖστος kwa Kiswahili cha kawaida bila kuzidisha.
- source_word: πρὸς αὐτόν
  choice: kumzunguka
  rationale: Katika muktadha wa umati unaomjia Yesu na kulazimisha aingie mashuani, usemi huu wa Kiswahili huonyesha kukusanyika karibu naye; maana ya kuelekea kwake haipotei.
- source_word: ὥστε
  choice: hata
  rationale: '“Hata” huanzisha matokeo kwa ufasaha katika Kiswahili: ukubwa wa umati ulisababisha Yesu kuingia mashuani.'
- source_word: εἰς πλοῖον ἐμβάντα
  choice: akapanda mashua
  rationale: “Kupanda mashua” ni usemi wa kawaida wa Kiswahili kwa kuingia ndani ya mashua, na hudumisha tendo la kishirikishi ndani ya mfuatano wa matokeo.
- source_word: καθῆσθαι
  choice: akaketi
  rationale: Linatoa tendo la kuketi kwa lugha ya heshima, ya kawaida, na ya moja kwa moja.
- source_word: ἐν τῇ θαλάσσῃ
  choice: humo baharini
  rationale: “Humo” hufanya wazi kuwa Yesu alikuwa ndani ya mashua iliyokuwa majini, bila kutoa taswira kwamba aliketi moja kwa moja juu ya maji.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Linahifadhi maana ya kundi lote kwa Kiswahili cha kawaida.
- source_word: ἐπὶ τῆς γῆς
  choice: nchi kavu
  rationale: 'Linabainisha tofauti ya mahali: Yesu alikuwa mashuani majini, lakini umati ulikuwa juu ya nchi kavu.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa viambishi vya simulizi (-ka-) umetumiwa kwa uasilia. “Bahari” limehifadhiwa badala ya “ziwa” kwa kufuata θάλασσα, huku “humo” na tanbihi zikifafanua mahali bila kubadili taswira ya chanzo.
