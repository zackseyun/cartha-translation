- from: Akaanza tena kufundisha kando ya bahari. Umati mkubwa sana ukakusanyika kumzunguka[a], hata akapanda mashua, akaketi humo baharini; nao umati wote ukabaki ufuoni, nchi kavu[b].
  to: Akaanza tena kufundisha kando ya bahari. Umati mkubwa sana ukakusanyika kwake[a], hata akaingia katika mashua, akaketi baharini[b]; nao umati wote ulikuwa kando ya bahari, nchi kavu.
  rationale: Marekebisho yanaondoa maana zilizoongezwa (“kumzunguka,” “ukabaki”) na kurejesha mwelekeo wa πρὸς αὐτόν kwa “kwake.” Muundo wa simulizi, mkazo wa umati mkubwa, na tofauti ya Yesu kuwa mashuani majini dhidi ya umati kuwa nchi kavu vimehifadhiwa.
