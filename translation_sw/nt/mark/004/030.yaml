  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: sw
  text: Naye alikuwa akisema, “Tufananishe ufalme wa Mungu kwa jinsi gani, au tuueleze kwa mfano gani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Wakati usiotimilifu unaonyesha tendo la kusema lililokuwa likiendelea katika simulizi; Kiswahili hiki ni cha asili na huhifadhi hali hiyo.
- source_word: Πῶς ὁμοιώσωμεν
  choice: Tufananishe ... na nini
  rationale: Ingawa Πῶς ni ‘jinsi gani,’ muundo wa Kiswahili ‘tufananishe ... na nini’ huwasilisha kwa kawaida swali la mashauriano kuhusu namna au kitu cha kulinganishia.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri sanifu inayohifadhi taswira na upana wa maana ya βασιλεία, ikijumuisha utawala na milki bila kuibana kuwa dhana moja tu.
- source_word: ἐν τίνι ... παραβολῇ
  choice: kwa mfano gani
  rationale: ἐν pamoja na hali ya dative hapa inaweza kueleweka kwa maana ya chombo; ‘kwa mfano gani’ ni ya kawaida katika Kiswahili na huhifadhi swali la njia ya kuueleza ufalme.
- source_word: παραβολῇ
  choice: mfano
  rationale: ‘Mfano’ ndilo neno la kawaida la kibiblia la Kiswahili kwa simulizi au ulinganisho wa kufundishia katika Injili.
- source_word: αὐτὴν ... θῶμεν
  choice: tuueleze
  rationale: Ingawa τίθημι kimsingi ni ‘kuweka,’ katika usemi huu maana yake ni kuwasilisha au kueleza ufalme kwa njia ya mfano; ‘tuueleze’ ni ya asili bila kupoteza rejeo la αὐτήν.
