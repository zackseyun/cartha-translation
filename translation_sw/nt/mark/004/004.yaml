  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: sw
  text: Alipokuwa akipanda, mbegu fulani ilianguka kando ya njia[a], ndege wakaja wakaila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembeni mwa njia.”
    reason: Neno παρά linaweza kuelezwa kwa “kando ya” au “pembeni mwa”; maelezo haya yanahifadhi uwezekano wa kuelewa mbegu kuwa ilianguka kandokando ya njia.
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Alipokuwa akipanda
  rationale: Muundo huu wa kisimulizi unaonyesha jambo lililotokea wakati tendo la kupanda likiendelea. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya wakati bila kutumia usemi mzito kama ‘ikawa wakati wa kupanda.’
- source_word: ὃ μὲν
  choice: baadhi ya mbegu
  rationale: Kiwakilishi cha kati pamoja na μέν kinaonyesha sehemu fulani ya mbegu iliyokuwa ikipandwa. ‘Baadhi ya mbegu’ huweka wazi maana hiyo ya sehemu kwa Kiswahili cha kawaida.
- source_word: ἔπεσεν
  choice: ilianguka
  rationale: Hii ni tafsiri ya moja kwa moja ya πίπτω katika muktadha huu; umoja unapatana na nomino ya mkusanyiko ‘mbegu.’
- source_word: παρὰ τὴν ὁδόν
  choice: kando ya njia
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha mahali pembezoni mwa njia. ‘Njia’ inafaa zaidi kuliko ‘barabara’ katika mazingira ya shamba.
- source_word: τὰ πετεινὰ
  choice: ndege
  rationale: Neno hili kwa kawaida humaanisha ndege. Hakuna kifafanuzi kama ‘wa angani’ katika mstari huu wa Kigiriki.
- source_word: κατέφαγεν
  choice: wakaila
  rationale: Kitenzi κατεσθίω kina wazo la kula kabisa. Katika Kiswahili, ‘wakaila’ ni usemi wa kawaida ambao katika muktadha huu unaonyesha mbegu ililiwa yote.
- source_word: αὐτό
  choice: -i- katika ‘wakaila’
  rationale: Kiwakilishi hiki kinarejelea mbegu kama kitu cha mkusanyiko; kiambishi cha yambwa cha ngeli ya mbegu kinakihifadhi kwa Kiswahili.
