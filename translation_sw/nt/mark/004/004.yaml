translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida wa simulizi huku ikihifadhi taswira ya kilimo na maana ya mkusanyiko ya ‘mbegu.’
