  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: sw
  text: Naye alikuwa akisema, “Ufalme wa Mungu ni kama mtu atawanyaye mbegu ardhini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ufalme wa Mungu ni kama mtu anayepanda mbegu ardhini.” Ulinganisho wa Kigiriki umefupishwa na unaendelea katika mstari unaofuata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Huhifadhi hali endelevu au ya kurudiwa ya wakati usiotimilika wa Kigiriki, ingawa katika masimulizi inaweza pia kutafsiriwa kwa ufupi kuwa “alisema.”
- source_word: Οὕτως
  choice: uko hivi
  rationale: Ni Kiswahili cha kawaida kinachoanzisha maelezo ya jinsi ufalme wa Mungu ulivyo katika mfano huu.
- source_word: βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni tafsiri inayotambulika sana na inaweza kumaanisha utawala wa Mungu pamoja na eneo au hali ambamo utawala huo unaonekana.
- source_word: ὡς
  choice: ni kama ... anapo-
  rationale: Muundo huu unaanzisha ulinganisho kwa Kiswahili cha kawaida huku ukidokeza tukio linaloendelea kuelezwa katika mstari unaofuata.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika Kiswahili “mtu” ni neno la kawaida kwa mhusika mmoja wa mfano na halihitaji kubainisha jinsia ambayo haitajwi kileksika kwa lazima katika muktadha huu.
- source_word: βάλῃ
  choice: anapotawanya
  rationale: Katika mazingira ya kilimo, kitendo cha kutupa mbegu ni kuzitawanya wakati wa kupanda; “kutawanya” huhifadhi picha ya kitendo bila kudokeza kuzitupa kama taka.
- source_word: τὸν σπόρον
  choice: mbegu
  rationale: Nomino inatumika kijumla kwa mbegu inayopandwa; Kiswahili hakihitaji kuonyesha kibainishi cha Kigiriki kwa neno tofauti hapa.
- source_word: ἐπὶ τῆς γῆς
  choice: ardhini
  rationale: Muktadha wa kilimo unaonyesha udongo au ardhi ambako mbegu hutawanywa, si dunia kwa maana ya ulimwengu.
theological_decisions:
- issue: Muundo wa ulinganisho unaoendelea hadi mstari unaofuata
  choice: 'Kudumisha utangulizi “uko hivi: ni kama” na kishazi cha wakati “anapotawanya,”'
  alternative: “Ufalme wa Mungu ni kama mtu anayepanda mbegu ardhini.”
  rationale: Kigiriki kina ulinganisho uliofupishwa ambao wazo lake linaendelea katika mstari wa 27. Tafsiri iliyochaguliwa haiufanyi mstari huu kuwa maelezo yaliyofungwa kabisa wala kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Alikuwa akisema” huhifadhi hali ya kitenzi cha Kigiriki; “anapotawanya mbegu ardhini” ni picha ya kawaida ya upandaji kwa kutawanya.
