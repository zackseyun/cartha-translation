base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: sw
  text: Nao wakaogopa sana[a], wakaambiana, “Basi, huyu ni nani, hata upepo na bahari zinamtii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “wakaogopa hofu kuu.” Kigiriki kinatumia kitenzi pamoja na nomino yenye mzizi mmoja ili kusisitiza ukubwa wa hofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: wakaogopa sana
  rationale: Kitenzi pamoja na nomino ya mzizi mmoja kinatilia mkazo ukubwa wa hofu. Kiswahili cha kawaida hutumia “wakaogopa sana”; tanbihi inahifadhi muundo halisi zaidi wa Kigiriki.
- source_word: ἔλεγον
  choice: wakaambiana
  rationale: Wakati usiotimilifu unaweza kuonyesha usemi ulioendelea, lakini katika masimulizi ya Kiswahili “wakaambiana” ni ya kawaida na pia huunganisha wazi wazo la kusema wao kwa wao.
- source_word: πρὸς ἀλλήλους
  choice: wakaambiana
  rationale: Kiambishi cha kutendeana -an- kinaeleza kwa ufupi na kwa kawaida kwamba walisemezana wao kwa wao.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Basi, huyu ni nani
  rationale: “Basi” huhifadhi maana ya ἄρα ya hitimisho lenye mshangao baada ya upepo kutulizwa.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: hata upepo na bahari
  rationale: “Hata” hudokeza mshangao unaosisitizwa na καί ya kwanza, huku “na” ikiunganisha upepo na bahari.
- source_word: ὑπακούει αὐτῷ
  choice: vinamtii
  rationale: “Kumtii” linaonyesha kuitikia amri na mamlaka yake; upatanisho wa “vi-” unarejelea vitu viwili visivyo na uhai vilivyounganishwa.
theological_decisions:
- issue: Mamlaka ya Yesu juu ya uumbaji
  choice: Kuhifadhi swali la wanafunzi na kauli kwamba upepo na bahari vinamtii bila kuongeza hitimisho la kimafundisho.
  alternative: Kupanua swali kwa maneno yanayotangaza moja kwa moja utambulisho wa kimungu wa Yesu.
  rationale: Aya yenyewe inaonyesha mamlaka yake ya ajabu na mshangao wa wanafunzi, lakini inaacha hitimisho katika umbo la swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Wakaambiana” ni asilia zaidi kuliko “wakasema wao kwa wao,” na “Basi” huhifadhi mshangao wa hitimisho bila kuwa nzito.
