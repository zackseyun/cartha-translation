  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: sw
  text: 'Hawa ndio walio kando ya njia, mahali neno linapopandwa: wanaposikia, mara moja Shetani huja na kuliondoa neno lililopandwa ndani yao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno lililopandwa kuingia ndani yao.”
    reason: mbadala wa kileksia unaoonyesha kwa wazi zaidi mwelekeo wa εἰς αὐτούς
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: Hawa ndio
  rationale: Muundo huu unatambulisha watu wanaowakilishwa na sehemu ya kando ya njia; δέ ni kiunganishi chepesi ambacho hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: wale walio kando ya njia
  rationale: παρά pamoja na hali ya kushutumiwa huonyesha mahali kando ya njia. ‘Njia’ ni neno la kawaida na linafaa katika picha ya shamba.
- source_word: σπείρεται ὁ λόγος
  choice: neno hupandwa
  rationale: ‘Neno’ linahifadhi urudiaji wa λόγος na maana yake ya ujumbe unaotangazwa; kauli ya kutendwa na hali ya mazoea ya maelezo imehifadhiwa kwa ‘hupandwa.’
- source_word: ὅταν ἀκούσωσιν
  choice: Wanapolisikia
  rationale: ὅταν pamoja na aoristi tegemezi ina maana ya jumla ya wakati; kiambishi -li- kinarejelea ‘neno’ kwa Kiswahili cha kawaida.
- source_word: εὐθύς
  choice: mara moja
  rationale: Huhifadhi msisitizo wa uharaka unaopatikana mara nyingi katika Marko.
- source_word: ὁ Σατανᾶς
  choice: Shetani
  rationale: Ni jina au cheo cha kiumbe binafsi katika muktadha huu, na ‘Shetani’ ndiyo namna sanifu ya Kiswahili.
- source_word: αἴρει
  choice: kuliondoa
  rationale: αἴρω hapa humaanisha kuchukua au kuondoa; ‘kuliondoa’ ni ya asili na haiongezi nguvu ya ‘kunyakua’ ambayo haijaelezwa wazi.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: neno lililopandwa ndani yao
  rationale: Kirai tegemezi kinavumisha ‘neno.’ ‘Ndani yao’ huonyesha upokeaji wa ndani unaowezekana kwa εἰς αὐτούς, huku uwezekano wa maana ya ‘miongoni mwao’ ukitajwa katika tanbihi.
theological_decisions:
- issue: Utendaji binafsi wa Shetani katika maelezo ya mfano
  choice: Shetani huja na kuliondoa neno
  alternative: adui huja, au uovu usio na nafsi huliondoa neno
  rationale: Kigiriki hutumia ὁ Σατανᾶς kama jina au cheo cha mhusika binafsi. Tafsiri haibadili mhusika huyu kuwa wazo lisilo na nafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili maelezo ya mfano yasomeke kwa urahisi bila kupoteza uhusiano wa vipengele vya Kigiriki.
