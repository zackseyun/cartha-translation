  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: sw
  text: Naye hulala na kuamka usiku na mchana; mbegu huchipuka na kukua[a], naye mwenyewe hajui jinsi inavyotokea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huchipuka na kurefuka,” au “huchipuka na kuwa ndefu.” Kitenzi cha pili hasa hudokeza kuongezeka kwa urefu au kimo.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu, “jinsi yeye mwenyewe asivyojua”; maana yake ni kwamba yeye mwenyewe hajui jinsi ukuaji huo unavyotokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: hulala
  rationale: Hali ya sasa ya kitenzi katika mfululizo huu wa mfano inaeleza tendo linalorudiwa; ‘hulala’ ni Kiswahili cha kawaida kinachoonyesha mazoea hayo.
- source_word: ἐγείρηται
  choice: huamka
  rationale: Katika muktadha huu umbo hili linamaanisha kuamka kutoka usingizini. ‘Huamka’ ni la kawaida na halileti wazo lisilokusudiwa la kufufuliwa.
- source_word: νύκτα καὶ ἡμέραν
  choice: usiku na mchana
  rationale: Kauli hii inaonyesha mzunguko unaoendelea wa wakati na inadumisha mpangilio wa Kigiriki.
- source_word: ὁ σπόρος
  choice: mbegu nayo
  rationale: ‘Mbegu’ inarejelea ile iliyopandwa katika mfano. ‘Nayo’ huonyesha wazi mabadiliko ya mhusika kutoka kwa mpanzi kwenda kwa mbegu bila kuongeza chanzo cha ukuaji.
- source_word: βλαστᾷ
  choice: huchipuka
  rationale: ‘Huchipuka’ ni neno la kawaida na sahihi kwa hatua ya kwanza ya ukuaji wa mbegu.
- source_word: μηκύνηται
  choice: hukua
  rationale: Ingawa kitenzi kinaweza kusisitiza kurefuka au kuongezeka kimo, ‘hukua’ ni Kiswahili cha asili katika muktadha wa mmea; maana mahsusi zaidi imehifadhiwa katika tanbihi.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: naye mwenyewe hajui jinsi gani
  rationale: Kauli hii inawasilisha kwa Kiswahili cha kawaida kwamba mpanzi hajui namna ukuaji huo unavyotokea, huku ‘mwenyewe’ ikihifadhi msisitizo wa αὐτός.
theological_decisions:
- issue: Mtendaji anayesababisha mbegu ikue katika mfano
  choice: Aya inaacha namna ukuaji unavyotokea bila kuelezwa kwa upande wa mpanzi, wala haitaji wazi mtendaji wa kimungu.
  alternative: Kusema wazi kwamba Mungu ndiye anayeikuza, au kueleza ukuaji kuwa tukio la kiasili tu.
  rationale: Maneno ya Kigiriki yanakazia kutokujua kwa mpanzi na ukuaji wa mbegu bila kueleza sababu yake. Tafsiri haipaswi kuondoa mvutano huo wa simulizi kwa kuongeza ufafanuzi wa kiteolojia au wa kiasili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matumizi ya ‘hu-’ yanaonyesha matendo yanayorudiwa katika mfano. Alama za tanbihi zimewekwa baada ya vifungu vinavyofafanuliwa.
