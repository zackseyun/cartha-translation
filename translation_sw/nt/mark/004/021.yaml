  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: sw
  text: Naye alikuwa akiwaambia, “Je, taa haiji ili iwekwe chini ya kikapu cha kupimia[a] au chini ya kitanda? Je, haiji ili iwekwe juu ya kinara cha taa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki μόδιος linamaanisha kipimo cha vitu vikavu, au chombo kilichotumiwa kupimia kiasi hicho; kwa mapokeo limetafsiriwa “busheli.”
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἔλεγεν αὐτοῖς
  choice: Kisha akaendelea kuwaambia
  rationale: Kauli ya wakati usiotimilika ἔλεγεν inaonyesha usemi ulioendelea katika simulizi; ‘akaendelea kuwaambia’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: Μήτι
  choice: Je, ...?
  rationale: Neno hili linaanzisha swali la balagha linalotarajia jibu la kukataa. Muktadha na swali linalofuata vinaifanya nguvu hiyo iwe wazi kwa Kiswahili bila kuongeza jibu ndani ya mstari.
- source_word: ἔρχεται ὁ λύχνος
  choice: taa huja
  rationale: Huhifadhi taswira hai yenye kuipa taa tendo la kuja, badala ya kuibadili kuwa kauli tendwa ‘taa huletwa.’ ‘Taa’ inatumika kwa maana ya jumla katika methali.
- source_word: λύχνος
  choice: taa
  rationale: Hurejelea taa halisi inayobebeka, si nuru kwa maana ya kidhahania.
- source_word: μόδιον
  choice: kikapu cha kupimia
  rationale: μόδιος ni kipimo cha vitu vikavu na pia chombo kilichotumiwa kupimia; tafsiri hii inaeleza kazi ya chombo bila kuingiza kipimo cha kigeni kama ‘busheli.’
- source_word: κλίνην
  choice: kitanda
  rationale: Ni neno la kawaida na linaloeleweka kwa kifaa cha nyumbani kinachokusudiwa hapa.
- source_word: λυχνίαν
  choice: kinara cha taa
  rationale: Hutaja mahususi kifaa ambacho taa huwekwa juu yake na kuhifadhi taswira ya nyumba.
- source_word: ἵνα ... τεθῇ
  choice: ili iwekwe
  rationale: Huhifadhi maana ya kusudi na kauli tendwa kwa Kiswahili cha asili na wazi.
theological_decisions:
- issue: Kuhifadhi au kulainisha uhuishaji katika ‘taa huja’
  choice: Kuhifadhi kauli tendi ‘taa huja’
  alternative: ‘Je, taa huletwa ...?’
  rationale: Kauli ya Kigiriki ni hai na ya kimethali. Kuihifadhi huepuka kutafsiri taswira mapema na hudumisha nguvu yake ya balagha.
- issue: Udhahiri wa ὁ λύχνος katika usemi wa jumla
  choice: Kutumia ‘taa’ kwa maana ya jumla bila kiashiria cha udhahiri
  alternative: ‘taa hiyo’
  rationale: Katika Kiswahili nomino ‘taa’ inaweza kueleza kanuni ya jumla kwa kawaida; ‘taa hiyo’ ingeashiria taa fulani ambayo haikutajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha na uhuishaji wa taa umehifadhiwa; msamiati wa nyumbani umewekwa wazi kwa wasomaji wa kawaida.
