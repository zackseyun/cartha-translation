  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: sw
  text: Kwa maana yeyote aliye nacho atapewa[a]; na yeyote asiye nacho, hata kile alicho nacho atanyang’anywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema tu “atapewa,” bila kutaja atakachopewa; kwa muktadha, “zaidi” inaweza kueleweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: yeyote
  rationale: Kiwakilishi hiki cha uhusiano kina maana ya jumla katika msemo huu; “yeyote” huonyesha kwamba kanuni hiyo inamhusu mtu yeyote.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha msemo huu na yaliyotangulia kwa kutoa msingi au ufafanuzi.
- source_word: ἔχει
  choice: aliye na kitu
  rationale: Kitenzi cha Kigiriki hakitaji kitu kinachomilikiwa. Kiswahili cha kawaida huhitaji kikamilisho hapa, hivyo “kitu” kimetumiwa bila kubainisha ni kitu gani.
- source_word: δοθήσεται αὐτῷ
  choice: atapewa
  rationale: Kauli ya kutendwa ya wakati ujao imehifadhiwa. Kiswahili kinaweza kuacha kitu kinachotolewa bila kukitaja, kama ilivyo katika Kigiriki.
- source_word: καὶ
  choice: na
  rationale: Inaunganisha sehemu mbili zinazokinzana za msemo kwa njia ya moja kwa moja.
- source_word: οὐκ ἔχει
  choice: asiye na kitu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kukosa bila kubainisha kitu kinachozungumziwa.
- source_word: ὃ ἔχει
  choice: kile alicho nacho
  rationale: Huhifadhi rejeo pana lisilobainishwa la kile ambacho mtu anacho.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: kitachukuliwa kutoka kwake
  rationale: Huwasilisha kwa uwazi tendo la kuondolewa au kunyang’anywa, huku ikihifadhi kauli ya kutendwa.
theological_decisions:
- issue: Kitu kisichotajwa katika δοθήσεται
  choice: Kutafsiri “atapewa” bila kuongeza “zaidi” katika matini kuu.
  alternative: “atapewa zaidi”
  rationale: Kigiriki hakitaji kitu kitakachotolewa, na Kiswahili kinaweza kuacha kikamilisho hicho bila kufanya sentensi kuwa isiyo ya kawaida. Hivyo utata wa chanzo unahifadhiwa; wazo la kuongezewa linaweza kueleweka kutokana na ulinganifu wa msemo na limeelezwa katika tanbihi.
- issue: Rejeo la jumla la umoja
  choice: Kutumia “yeyote” pamoja na miundo ya umoja.
  alternative: Kutumia wingi, kama “wale walio na kitu.”
  rationale: Chanzo kina umoja wenye maana ya jumla. Kiswahili kinaweza kuhifadhi umoja huo kwa kawaida bila kuufanya msemo umhusu mwanamume pekee.
translation_notes:
  register: Lugha ni ya kawaida, yenye hadhi, na ina mtindo mfupi wa kimethali. “Kitu” kimetumiwa ili kufanya miundo ya “kuwa na” iwe ya kawaida katika Kiswahili, lakini hakibainishi kinachomilikiwa. Tanbihi imewekwa baada ya “atapewa,” mahali panapohusika moja kwa moja na jambo linaloelezwa.
