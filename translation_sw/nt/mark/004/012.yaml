  verdict: revise
  source_fidelity: The draft appropriately retains the difficult purpose-like force of ἵνα and μήποτε, the repeated seeing/hearing construction, the broad image of ἐπιστρέφω ('return/turn'), and the passive sense of ἀφεθῇ. However, 'lakini' introduces an adversative contrast not expressed by the Greek καὶ μή; 'wala' more closely and naturally renders 'and not' in this construction.
  naturalness: The wording is generally clear Standard East African Swahili. Replacing the somewhat redundant and stiff 'ili kwamba' with 'ili' improves idiomatic flow. Removing commas between the participial and finite verbal forms also allows the deliberate repetition to read more naturally.
  terminology: '''Kutazama/tambua'' and ''kusikia/elewa'' preserve the rhetorical distinction without making it overly technical. ''Wakarudi'' responsibly avoids narrowing ἐπιστρέψωσιν to explicit repentance, while the footnote gives ''wakatubu'' as a contextual possibility. ''Kusamehewa'' preserves the impersonal passive without specifying an object absent from the Greek.'
  issues:
  - severity: medium
    issue: The main text uses 'lakini' twice.
    rationale: The source has καὶ μή ('and not') in both clauses, not an adversative conjunction. 'Lakini' can subtly recast the relationship as contrastive; 'wala' is both idiomatic and closer to the source.
  - severity: low
    issue: The introductory phrase 'ili kwamba' is needlessly doubled.
    rationale: Both words can introduce purpose/result, but 'ili' alone is the more direct, natural rendering of ἵνα here.
  - severity: low
    issue: Footnote a's alternative is not idiomatic.
    rationale: ‘Wasione kwa utambuzi’ is awkward Swahili. A simple literal alternative, ‘wasione,’ accurately represents the lexical option without creating unnatural phrasing.
