id: MRK.4.12
reference: Mark 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: sw
  text: 'ili,

    “wakitazama watazame, wala wasitambue;[a]

    na wakisikia wasikie, wala wasielewe;”[b]

    wasije wakarudi[c] na kusamehewa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasione.”
    reason: lexical_alternative
  - marker: b
    text: Yesu anarejelea Isaya 6:9–10, akidumisha mvutano kati ya hukumu ya Mungu na kushindwa kwa watu kuitikia.
    reason: cross_reference
  - marker: c
    text: “Wakarudi” pia inaweza kutafsiriwa “wakageuka,” au katika muktadha huu, “wakatubu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili kwamba
  rationale: Huendeleza maana ya kusudi au matokeo iliyo katika kiunganishi cha Kigiriki bila kuipunguza kuwa maelezo tu.
- source_word: βλέποντες βλέπωσι
  choice: wakitazama, watazame
  rationale: Huhifadhi urudiaji wenye mkazo na fumbo wa kitenzi katika Kigiriki, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: ἴδωσιν
  choice: wasitambue
  rationale: ‘Kutambua’ hutofautisha kuona kwa ufahamu na kitendo cha kutazama kilichotajwa kwanza; ‘wasione kwa utambuzi’ pia inawezekana lakini si ya kawaida sana.
- source_word: ἀκούοντες ἀκούωσι
  choice: wakisikia, wasikie
  rationale: Huhifadhi muundo wa kurudia unaoonyesha mkazo na mwangwi wa Isaya.
- source_word: συνιῶσιν
  choice: wasielewe
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya ufahamu wa kiakili au wa ndani unaokusudiwa hapa.
- source_word: μήποτε
  choice: wasije
  rationale: Hutoa kwa ufupi nguvu ya tahadhari hasi ya neno la Kigiriki na kudumisha uzito wa kauli.
- source_word: ἐπιστρέψωσιν
  choice: wakarudi
  rationale: Huhifadhi taswira pana ya kugeuka au kurudi bila kuweka moja kwa moja istilahi maalumu ya ‘kutubu’; katika muktadha inaweza kumaanisha kumrudia Mungu.
- source_word: ἀφεθῇ αὐτοῖς
  choice: na kusamehewa
  rationale: Huhifadhi kauli tendwa yenye mtendaji asiyeelezwa, huku Kiswahili kikitoa maana kwa kawaida bila kuongeza kitu mahususi kinachosamehewa.
theological_decisions:
- issue: Nguvu ya kusudi au matokeo katika dondoo la Yesu na uwezekano kwamba mifano inazuia watu wasirudi
  choice: Kudumisha ‘ili kwamba ... wasije’ katika maandishi makuu
  alternative: ‘kwa matokeo kwamba ... la sivyo huenda wakarudi’
  rationale: Kigiriki kinaacha mvutano wa makusudi kati ya hukumu ya Mungu na kushindwa kwa watu kuitikia; tafsiri haiupunguzi kuwa matokeo ya kawaida wala kuutatua kwa mtazamo mmoja wa kiteolojia.
- issue: Maana ya ἐπιστρέψωσιν kuhusiana na toba
  choice: wakarudi
  alternative: wakatubu; wakageuka
  rationale: Kitenzi kinaweza kuwa na maana ya toba katika muktadha wa kinabii, lakini maana yake ya msingi ni pana. Maandishi makuu yanahifadhi taswira hiyo, na tanbihi inaeleza maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘wakitazama, watazame’ na ‘wakisikia, wasikie’ umehifadhiwa kwa makusudi ili kuonyesha mkazo wa mtindo wa kinabii. Alama zote za tanbihi zimewekwa katika maandishi makuu.
