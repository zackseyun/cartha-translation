  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: sw
  text: Vivyo hivyo, hawa ndio wale waliopandwa kwenye ardhi yenye miamba:[a] wanapolisikia lile neno, mara moja hulipokea kwa furaha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye udongo wenye miamba” au “katika sehemu zenye miamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Kielezi hiki kinaunganisha kundi hili na maelezo yaliyotangulia kwa ulinganisho, huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: ἐπὶ τὰ πετρώδη
  choice: kwenye ardhi yenye miamba
  rationale: Usemi huu unaonyesha mahali penye tabaka la miamba katika mfano wa kilimo. Tafsiri hii ni ya kawaida na inadumisha taswira bila kuamua kwa usahihi zaidi kuliko Kigiriki ikiwa ni udongo au maeneo.
- source_word: σπειρόμενοι
  choice: waliopandwa
  rationale: Ingawa ni kivumishi-endelevu katika Kigiriki, hapa kinawatambulisha kwa lugha ya mfano wale wanaowakilishwa na mbegu iliyopandwa; umbo hili ni la kawaida katika Kiswahili.
- source_word: τὸν λόγον
  choice: lile neno
  rationale: Katika muktadha wa mfano, λόγος ni neno au ujumbe unaotangazwa. “Lile neno” linahifadhi istilahi inayorudiwa na kurejelea neno lililotajwa tayari.
- source_word: εὐθύς
  choice: mara moja
  rationale: Huhifadhi nguvu ya kielezi na mtindo wa Marko wa kusisitiza utendaji wa papo hapo.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Hutoa kwa njia ya kawaida hali ambayo neno linapokewa bila kuongeza maana nyingine.
- source_word: λαμβάνουσιν αὐτόν
  choice: hulipokea
  rationale: Kitenzi “kupokea” kinadumisha sitiari ya kulisikia na kulichukua neno, bila kudokeza kwamba mwitikio huo lazima udumu.
theological_decisions:
- issue: Kirejelewa cha “wale waliopandwa” katika ufafanuzi wa mfano
  choice: Kudumisha maneno ya kimfano “wale waliopandwa kwenye ardhi yenye miamba.”
  alternative: Kufafanua kuwa ni “watu ambao mioyo yao ni kama ardhi yenye miamba.”
  rationale: Yesu anaendelea kutumia taswira ya kupanda huku akiwatambulisha watu wanaowakilishwa. Kufanya “mioyo” kuwa wazi kungeongeza ufafanuzi usiomo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hawa ndio wale” linaonyesha utambulisho kwa uwazi, na matumizi ya “hu-” katika “wanapolisikia… hulipokea” yanafaa kwa tabia inayoelezwa katika mfano.
