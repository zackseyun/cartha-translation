  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: sw
  text: Akawaambia, “Je, hamwelewi mfano huu? Basi, mtaelewaje mifano yote?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “Je, hamjui mfano huu? Na mtajuaje mifano yote?” Vitenzi vya Kigiriki vinaweza kutafsiriwa “kujua,” lakini hapa vina maana ya kuelewa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Akawaambia
  rationale: Kauli ya sasa ya kihistoria ya Marko imetafsiriwa kwa wakati wa masimulizi unaotiririka kwa kawaida katika Kiswahili; umbo hili pia linaonyesha wazi kuwa anazungumza nao.
- source_word: οἴδατε
  choice: hamwelewi
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘kujua,’ hapa kinahusu kufahamu maana ya mfano.
- source_word: παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa aina hii ya mafundisho ya Yesu.
- source_word: ταύτην
  choice: huu
  rationale: Kionyeshi kinarejelea mfano uliotangulia mara moja.
- source_word: καὶ πῶς
  choice: Basi, ...-je
  rationale: ‘Basi’ linaonyesha hitimisho la kimantiki kati ya maswali hayo mawili, huku ‘-je’ likibeba nguvu ya swali kwa Kiswahili cha kawaida.
- source_word: πάσας τὰς παραβολὰς
  choice: mifano yote
  rationale: Huhifadhi wingi na upeo wa maneno ya Kigiriki, yakirejelea kwa upana mafundisho kwa mifano.
- source_word: γνώσεσθε
  choice: mtaelewaje
  rationale: Katika muktadha huu kitenzi kinahusu kuelewa maana, si kupata taarifa tu; pia kinadumisha ulinganifu wa balagha na ‘hamwelewi.’
theological_decisions:
- issue: Uhusiano kati ya οἴδατε na γνώσεσθε
  choice: Vitenzi vyote viwili vimetafsiriwa kwa mzizi ‘-elewa.’
  alternative: Kutumia ‘kujua’ kwa kimoja au kwa vyote viwili.
  rationale: Muktadha unahusu kufahamu maana ya mifano. Kutumia ‘-elewa’ kwa vyote kunahifadhi nguvu ya swali bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa maswali mawili na mkazo wa balagha vimehifadhiwa.
