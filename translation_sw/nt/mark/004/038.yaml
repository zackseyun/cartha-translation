base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: sw
  text: Naye yeye mwenyewe alikuwa katika sehemu ya nyuma ya mashua, amelala juu ya mto[a]. Wakamwamsha, wakamwambia, “Mwalimu, hujali kwamba tunaangamia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu cha kuegemezea kichwa.” Neno la Kigiriki linaweza kumaanisha mto au kitu cha kuegemezea kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: yeye mwenyewe alikuwa
  rationale: Kiwakilishi cha wazi αὐτός kina nguvu ya msisitizo na utofautishaji; “yeye mwenyewe” huihifadhi bila kuongeza wazo lisilokuwamo.
- source_word: ἐν τῇ πρύμνῃ
  choice: nyuma ya mashua
  rationale: πρύμνη ni sehemu ya nyuma ya chombo. Usemi huu ni sahihi na unaeleweka kwa urahisi kuliko istilahi adimu ya kitaalamu.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: juu ya mto[a]
  rationale: προσκεφάλαιον ni mto au kitu cha kuegemezea kichwa. “Mto” ni neno la kawaida na la asili katika Kiswahili, huku tanbihi ikifafanua maana mahsusi inayowezekana.
- source_word: καθεύδων
  choice: amelala
  rationale: Hali timilifu ya Kiswahili inaeleza hali yake ya kuwa usingizini wakati huo kwa njia ya kawaida na yenye mtiririko mzuri.
- source_word: ἐγείρουσιν
  choice: Wakamwamsha
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, usimulizi wa Kiswahili hutumia kwa kawaida mfuatano wa wakati uliopita; “waka-” huhifadhi mwendo wa simulizi.
- source_word: λέγουσιν αὐτῷ
  choice: na kumwambia
  rationale: Muundo huu unaunganisha kitendo cha kusema na kumwamsha kwa mtiririko wa kawaida wa Kiswahili, bila kubadili mhusika wala mlengwa.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa διδάσκαλος, bila kuingiza maana nyingine ya cheo au mamlaka.
- source_word: οὐ μέλει σοι
  choice: hujali
  rationale: Usemi huu mfupi na wa moja kwa moja huhifadhi sauti ya swali kali na ya lawama iliyomo katika Kigiriki.
- source_word: ἀπολλύμεθα
  choice: tunaangamia
  rationale: Kitenzi hiki kinaonyesha maangamizi au kifo kinachowakabili. “Tunaangamia” huhifadhi uzito na uharaka wake bila kuibana maana kuwa kufa pekee.
theological_decisions:
- issue: Nguvu ya simulizi katika swali la wanafunzi kwa Yesu
  choice: “Mwalimu, hujali kwamba tunaangamia?”
  alternative: “Mwalimu, haikuhusu kwamba tunakaribia kufa?”
  rationale: Kigiriki kinaonyesha swali la haraka lenye lawama, si ombi la taarifa tu. Tafsiri inahifadhi mvutano huo bila kueleza nia ya Yesu wala kutoa hukumu ya kitheolojia kuhusu imani ya wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nyuma ya mashua” imechaguliwa badala ya istilahi adimu ya majini ili wasomaji wa kawaida waelewe mara moja. Swali limeachwa fupi na kali ili kuhifadhi hisia za tukio.
