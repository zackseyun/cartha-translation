  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: sw
  text: Mpanzi hupanda neno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe.” Neno la Kigiriki λόγος linaweza kumaanisha “neno” au “ujumbe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Mpanzi
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo kimetumika kama nomino, kikimaanisha mtu anayejulikana kwa tendo la kupanda. “Mpanzi” ni la asili na fupi, na linadumisha taswira ya mfano bila kuongeza wazo pana la kazi ya mkulima.
- source_word: τὸν λόγον
  choice: neno
  rationale: λόγος linaweza kumaanisha “neno” au “ujumbe.” “Neno” linadumisha upana wa neno la Kigiriki na halibainishi mapema zaidi ya maandishi kuwa ni “neno la Mungu” au “injili.” Maana mbadala imeonyeshwa katika tanbihi.
- source_word: σπείρει
  choice: hupanda
  rationale: Wakati uliopo hapa unaeleza tendo la kawaida katika ufafanuzi wa mfano. Kiambishi “hu-” kinaonyesha vizuri tendo hilo la kawaida, huku mzizi wa “panda” ukihifadhi urudiaji wa kimakusudi kati ya “Mpanzi” na “hupanda.”
theological_decisions:
- issue: Kirejelewa cha τὸν λόγον katika ufafanuzi wa mfano
  choice: neno
  alternative: ujumbe; neno la Mungu; injili
  rationale: Maandishi ya Kigiriki yanasema τὸν λόγον tu. Ingawa muktadha unaelekeza kwenye ujumbe wa Mungu unaotangazwa, kuongeza “la Mungu” au kutumia “injili” kungeingiza ufafanuzi usiotajwa wazi katika aya hii. “Neno” linahifadhi upana na mvutano wa kitheolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mpanzi hupanda” inadumisha urudiaji wa kisanaa wa chanzo.
