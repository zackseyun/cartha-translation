base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: sw
  text: Nao, baada ya kuuacha umati, wakamchukua pamoja nao jinsi alivyokuwa, ndani ya mashua[a]; na mashua nyingine zilikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamchukua pamoja nao ndani ya mashua, jinsi alivyokuwa.” Mpangilio wa Kigiriki unaweza kusisitiza kwamba Yesu alikuwa tayari ndani ya mashua, au kwamba walimchukua bila maandalizi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: baada ya kuuacha
  rationale: Kirai hiki cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu. ‘Baada ya kuuacha’ ni Kiswahili cha kawaida na hakidai kwamba umati ulifukuzwa rasmi.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Neno hili humaanisha kundi kubwa la watu waliokusanyika; ‘umati’ ni wazi na linafaa katika muktadha.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: wakamchukua pamoja nao
  rationale: Kitenzi παραλαμβάνω hapa kina maana ya kumchukua mtu aende pamoja nao; ‘pamoja nao’ huonyesha maana hiyo bila kuongeza wazo lisilokuwapo.
- source_word: ὡς ἦν
  choice: akiwa jinsi alivyokuwa
  rationale: Tafsiri hii inadumisha wazo la kumchukua Yesu katika hali aliyokuwa nayo, bila kubainisha zaidi hali hiyo.
- source_word: ἐν τῷ πλοίῳ
  choice: ndani ya mashua
  rationale: πλοῖον katika simulizi hili ni chombo cha majini kinachofaa kuitwa ‘mashua’; kirai cha mahali kimehifadhiwa karibu na ὡς ἦν.
- source_word: ἄλλα πλοῖα
  choice: mashua nyingine
  rationale: Kigiriki kinasema tu ‘mashua nyingine’; hakina kivumishi kinachomaanisha ‘ndogo,’ kwa hiyo hakijaongezwa.
- source_word: ἦν μετ’ αὐτοῦ
  choice: zilikuwa pamoja naye
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja kwa sababu ya upatanisho wa nomino ya wingi isiyo na jinsia, maana yake ni ya wingi. ‘Pamoja naye’ inadumisha usemi mfupi wa simulizi.
theological_decisions:
- issue: Uhusiano wa ὡς ἦν na ἐν τῷ πλοίῳ
  choice: akiwa jinsi alivyokuwa ndani ya mashua
  alternative: wakamchukua pamoja nao ndani ya mashua, jinsi alivyokuwa
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa Yesu tayari alikuwa ndani ya mashua au kuwa walimchukua bila maandalizi mengine. Matini kuu inafuata mpangilio wa Kigiriki, na tanbihi inadumisha uwezekano mwingine bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakamchukua pamoja nao’ ni cha kawaida na huonyesha kuandamana; ‘mashua’ huepuka neno zito ‘meli.’ Muundo wenye tanbihi umechaguliwa ili kuhifadhi utata halisi wa kirai cha Kigiriki.
