  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: sw
  text: Dhoruba kubwa ya upepo ikatokea[a], na mawimbi yakawa yakiipiga mashua na kuingia ndani yake[b], hata mashua ikawa tayari inajaa[c].
  philosophy: optimal-equivalence
