lexical_decisions:
- source_word: γίνεται
  choice: ikatokea
  rationale: Kauli ya wakati uliopo inatumika kihistoria katika simulizi hai la Marko; “ikatokea” ni ya kawaida katika simulizi la Kiswahili na inaonyesha mwanzo wa dhoruba.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: dhoruba kubwa ya upepo
  rationale: “Dhoruba” huwasilisha λαῖλαψ kama tufani kali, huku “kubwa” na “ya upepo” zikihifadhi μέγαλη na ἀνέμου bila kuongeza tafsiri ya kimadhehebu.
- source_word: κύματα
  choice: mawimbi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa κύματα katika mazingira ya ziwa.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: yakawa yakipiga na kuingia ndani ya mashua
  rationale: Muundo wa “yakawa yaki-” unaonyesha tendo la kuendelea au kurudiwa la kitenzi cha wakati usiotimilika; “kupiga na kuingia” huhifadhi nguvu ya mawimbi pamoja na mwelekeo wake kuingia mashuani.
- source_word: πλοῖον
  choice: mashua
  rationale: “Mashua” linafaa kwa chombo cha majini katika Ziwa la Galilaya na ni la kawaida zaidi kuliko “meli,” ambalo lingeashiria chombo kikubwa.
- source_word: ὥστε
  choice: hata
  rationale: Katika muktadha huu “hata” hutambulisha matokeo kwa Kiswahili cha kawaida na kwa uwazi.
- source_word: ἤδη
  choice: tayari
  rationale: “Tayari” huonyesha kuwa hali ya kujaa ilikuwa imeanza na kufikia hatua dhahiri.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: mashua ikawa tayari inajaa maji
  rationale: “Inajaa” huwasilisha mchakato unaoendelea wa γεμίζεσθαι kwa Kiswahili asilia; “maji” yamewekwa wazi kutokana na muktadha ili kuzuia usemi usio kamili wa “mashua inajaa.”
