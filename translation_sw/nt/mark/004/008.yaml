base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: sw
  text: Mbegu nyingine zikaanguka katika udongo mzuri[a], zikitoa mazao huku zikimea na kuongezeka, zikazaa mara thelathini, mara sitini na mara mia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyingine zikaanguka katika udongo mzuri,” huku neno “mbegu” likieleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Mbegu nyingine
  rationale: Kivumishi cha wingi cha jinsi ya kati kimetumiwa kama nomino na kinarejelea mbegu zilizotajwa katika muktadha; neno “mbegu” limeongezwa ili Kiswahili kiwe wazi na cha kawaida.
- source_word: γῆν τὴν καλήν
  choice: udongo mzuri
  rationale: Katika muktadha wa kupanda, γῆ humaanisha udongo unaofaa kwa mbegu, si nchi au eneo kwa maana pana.
- source_word: ἐδίδου καρπὸν
  choice: zikatoa mazao
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililoendelea. “Kutoa mazao” ni usemi wa kawaida wa kilimo na unaonyesha uzalishaji wa mbegu zilizopandwa.
- source_word: ἀναβαίνοντα
  choice: yaliyokuwa yakimea
  rationale: Katika muktadha wa kilimo, kitenzi hiki kinaonyesha mmea kuchipuka na kuinuka kutoka ardhini; “kumea” ni usemi wa asili wa Kiswahili.
- source_word: αὐξανόμενα
  choice: na kuongezeka
  rationale: Tafsiri hii inadumisha wazo la ukuaji unaoendelea na pia kulitofautisha na tendo la kumea.
- source_word: ἔφερεν
  choice: zikazaa
  rationale: Kitenzi kinaonyesha utoaji wa mavuno; “kuzaa” ni usemi wa kawaida kwa mimea kutoa mazao na unaendana na hali ya tendo linaloendelea katika simulizi.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: mara thelathini, mara sitini na mara mia
  rationale: Usemi huu unaonyesha uwiano wa mavuno dhidi ya mbegu iliyopandwa; “mara” huwasilisha kuzidishwa huko kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini rahisi kueleweka. Mfuatano wa kumea, kuongezeka na kuzaa umehifadhiwa bila kuongeza ufafanuzi wa kiteolojia.
