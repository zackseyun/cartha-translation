  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: sw
  text: Naye akawaambia, “Kwa nini mna woga hivi?[a] Je, bado hamna imani?[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini ninyi ni waoga?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, hamna imani bado?”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki linalotafsiriwa “imani” linaweza pia kueleweka hapa kuwa “kumtumaini.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi na kumrejelea Yesu kwa namna ya kawaida katika Kiswahili.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida tendo la kusema kwa watu kadhaa na kuanzisha maneno ya moja kwa moja.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu wa Kigiriki, Τί hutumika kuuliza sababu, hivyo ‘Kwa nini’ ndiyo tafsiri ya Kiswahili yenye maana ya moja kwa moja.
- source_word: δειλοί
  choice: mna woga hivi
  rationale: Neno lina maana hasi ya kuwa mwoga au mwenye hofu; katika muktadha wa dhoruba, usemi huu unaonyesha kukemewa kwa hofu yao bila kuufanya moja kwa moja kuwa hukumu ya tabia yao yote.
- source_word: οὔπω
  choice: bado ... hamna
  rationale: Muundo huu wa Kiswahili unaweka wazi maana ya ‘not yet’ na nguvu ya swali la kukemea.
- source_word: ἔχετε πίστιν
  choice: mna imani
  rationale: ‘Kuwa na imani’ ni usemi wa kawaida wa Kiswahili na huhifadhi nomino πίστις bila kuongeza kitu chake kisichotajwa wazi.
theological_decisions:
- issue: Maana ya πίστις katika muktadha ambapo ‘tumaini/utegemezi’ kwa Yesu inawezekana
  choice: imani
  alternative: kumtumaini / kuwa na tumaini
  rationale: ‘Imani’ huhifadhi istilahi pana ya Kigiriki na mvutano wake wa kitheolojia. Katika muktadha huu inaweza kumaanisha pia kumtumaini Yesu, lakini Kigiriki hakitaji wazi kitu cha imani hiyo.
- issue: Nguvu ya δειλοί
  choice: mna woga hivi
  alternative: ni waoga
  rationale: Chaguo kuu linaunganisha karipio na hofu ya wakati huo, huku mbadala ukihifadhi maana kali zaidi inayoweza kusikika kama tathmini ya tabia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mna woga hivi’ ni lugha ya kawaida inayoeleweka kwa urahisi; tanbihi huhifadhi nguvu kali zaidi ya δειλοί na uwezekano wa kuelewa πίστις kama kumtumaini.
