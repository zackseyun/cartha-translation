  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: sw
  text: Siku ile, jioni ilipofika, anawaambia, “Tuvuke[a] hadi ng’ambo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tuvuke hadi upande wa pili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati wa sasa umehifadhiwa ili kuendeleza matumizi ya wakati wa sasa wa kisimulizi yaliyo tabia ya Marko; umbo hili ni la kawaida na linaeleweka katika simulizi la Kiswahili.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku ile
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya kirai cha wakati, huku ikihifadhi rejeo lake kwa siku iliyotajwa katika muktadha.
- source_word: ὀψίας γενομένης
  choice: jioni ilipofika
  rationale: Kirai hiki kinawasilisha wakati unaoandamana na tendo kuu; tafsiri hii ni ya asili katika Kiswahili na haiongezi maelezo yasiyokuwapo.
- source_word: Διέλθωμεν
  choice: Tuvuke
  rationale: Kitenzi cha nafsi ya kwanza wingi katika hali ya kuhimiza kimetafsiriwa kwa ‘Tuvuke,’ ambacho kinatoa mwaliko au pendekezo la pamoja kwa njia fupi na ya kawaida.
- source_word: εἰς τὸ πέραν
  choice: kwenda ng’ambo
  rationale: Katika muktadha wa kuvuka ziwa, ‘ng’ambo’ humaanisha upande mwingine; ‘kwenda’ huonyesha wazi mwelekeo unaobebwa na εἰς.
