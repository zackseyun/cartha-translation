  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: sw
  text: Aliwaambia neno[a] kwa mifano mingi kama hiyo, kwa kadiri walivyoweza kulisikia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe” au “mafundisho” badala ya “neno.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kiasi walichoweza kusikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: ya namna hiyo
  rationale: Hurejelea aina ya mifano iliyotangulia; usemi huu ni wa kawaida katika Kiswahili na huhifadhi maana ya ulinganisho.
- source_word: παραβολαῖς
  choice: mifano
  rationale: “Mifano” ni istilahi iliyozoeleka na inayoeleweka kwa mafundisho ya Yesu yaliyotumia hadithi au ulinganisho.
- source_word: πολλαῖς
  choice: mingi
  rationale: Hutoa kwa uwazi maana ya wingi na kupatana kisarufi na “mifano.”
- source_word: ἐλάλει
  choice: aliendelea kuwaambia
  rationale: Huwakilisha hali endelevu ya wakati usiotimilika wa Kigiriki kwa Kiswahili cha kawaida bila kudai kwa lazima kwamba tendo hilo lilirudiwa mara nyingi.
- source_word: αὐτοῖς
  choice: kuwaambia
  rationale: Kiambishi cha yambwa “-wa-” huonyesha kwa kawaida na kwa ufupi kwamba alikuwa akisema kwao.
- source_word: τὸν λόγον
  choice: lile neno
  rationale: Huhifadhi usemi wa Kigiriki na mwangwi wake katika Marko; “lile” huwakilisha kibainishi, huku tanbihi ikitaja tafsiri mbadala zinazowezekana.
- source_word: καθὼς
  choice: kwa kadiri
  rationale: Hapa neno linaonyesha kiwango au uwiano wa uwezo wao, si ulinganisho wa kawaida tu.
- source_word: ἠδύναντο
  choice: walivyoweza
  rationale: Hueleza uwezo wao kwa njia ya kawaida katika Kiswahili na inafaa pamoja na kishazi cha kiwango “kwa kadiri.”
- source_word: ἀκούειν
  choice: kulisikia
  rationale: Huhifadhi maana ya msingi ya kusikia; kiambishi “-li-” hurejelea “lile neno” bila kubadili kusikia kuwa kuelewa.
theological_decisions:
- issue: Maana ya τὸν λόγον katika huduma ya Yesu ya kufundisha
  choice: lile neno
  alternative: ujumbe; mafundisho
  rationale: Tafsiri hii huhifadhi usemi wa Kigiriki na matumizi mapana ya kibiblia bila kuubana kuwa dai fulani la kimadhehebu; maana mbadala zimeonyeshwa katika tanbihi.
- issue: Dokezo la ἀκούειν
  choice: kulisikia
  alternative: kulielewa; kulipokea
  rationale: Ingawa kusikia katika muktadha kunaweza kuhusisha kuelewa au kupokea, matini yenyewe hutumia kitenzi cha kusikia. Tafsiri hiyo huhifadhi mvutano huo badala ya kuutatua kimafasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Aliendelea kuwaambia” hutiririsha sentensi na kuonyesha hali endelevu ya ἐλάλει; “kwa kadiri” huhifadhi wazo la kiwango bila kulazimisha maana ya “kuelewa.”
