  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: sw
  text: Naye aliwaambia, “Ninyi mmepewa siri ya ufalme wa Mungu, lakini kwa wale walio nje, mambo yote hufanyika kwa mifano,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: siri
  rationale: Katika muktadha huu ni jambo la Mungu lililokuwa limefichika lakini sasa limefunuliwa kwa waliopewa; ‘siri’ ni neno la kawaida na la heshima bila kudokeza fumbo lisiloweza kueleweka.
- source_word: δέδοται
  choice: mmepewa
  rationale: 'Huhifadhi hali timilifu ya kitendo na umbo la kutendwa: wamepokea siri hiyo kama zawadi, na matokeo yake yanaendelea.'
- source_word: τοῖς ἔξω
  choice: wale walio nje
  rationale: Huhifadhi taswira ya asili na kutotaja kwa ziada ni kundi gani hasa, hivyo kuacha mvutano wa kimuktadha.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: ‘Mifano’ ni lugha ya kawaida ya simulizi na ulinganisho wa Yesu; kihusishi ‘kwa’ kinaonyesha namna ambavyo mambo huwafikia.
- source_word: τὰ πάντα γίνεται
  choice: kila kitu huja
  rationale: Huhifadhi maana pana na isiyo ya kawaida kidogo ya γίνεται pamoja na tofauti yake na usomaji rahisi wa ‘kila kitu kiko’; wakati wa sasa umeonyeshwa kwa ‘huja’.
theological_decisions:
- issue: Siri ya ufalme kama kitu kinachotolewa
  choice: mmepewa siri
  alternative: mmejulishwa siri / mmepewa kuijua siri
  rationale: Nakala ya SBLGNT haisemi wazi ‘kuijua’; kutoongeza maneno hayo huhifadhi msisitizo na utata wa sentensi ya Kigiriki.
- issue: Namna mifano inavyohusiana na walio nje
  choice: kila kitu huja kwa mifano
  alternative: kila kitu huwa katika mifano
  rationale: ‘Huja kwa mifano’ hudumisha nguvu ya γίνεται na haifafanui kimadhehebu ikiwa mifano ni njia ya ufunuo, ya kuficha, au yote mawili; mistari inayofuata ndiyo hupanua jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida huku marudio ya kitenzi ‘alikuwa akiwaambia’ yakihifadhi hali endelevu ya ἔλεγεν. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
