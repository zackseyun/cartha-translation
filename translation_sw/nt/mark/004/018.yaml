  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: sw
  text: Na wengine ni wale waliopandwa katikati ya miiba[a]; hao ndio waliolisikia neno[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya miiba.”
    reason: lexical_alternative
  - marker: b
    text: Au “ujumbe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: wengine
  rationale: Kivumishi hiki kimetumika kama nomino na kinatofautisha kundi hili na makundi yaliyotangulia; “wengine” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: εἰς τὰς ἀκάνθας
  choice: katikati ya miiba
  rationale: Ingawa εἰς kwa kawaida huonyesha kuelekea ndani, hapa inaeleza mbegu iliyopandwa katika eneo lenye miiba; “katikati ya miiba” ni ya asili na hudumisha picha ya mfano.
- source_word: ἀκάνθας
  choice: miiba
  rationale: “Miiba” ni tafsiri ya kawaida, fupi, na inayoeleweka katika muktadha wa mfano huu.
- source_word: σπειρόμενοι
  choice: waliopandwa
  rationale: Umbo tendwa linaendeleza utambulisho wa watu na mbegu katika mfano; “waliopandwa” ni la asili kuliko “wanaopandwa” hapa na linaendana na tendo la kupanda lililosimuliwa tayari.
- source_word: οὗτοί εἰσιν
  choice: hao ndio
  rationale: Kauli hii ya utambulisho inarejelea kundi lililotajwa na kulifafanua; “hao ndio” ni ya kawaida na yenye mkazo unaofaa.
- source_word: οἱ ... ἀκούσαντες
  choice: waliolisikia
  rationale: Kishirikishi cha aoristi huonyesha tendo la kusikia lililotangulia matokeo yatakayoelezwa; “waliolisikia” hudumisha hilo kwa Kiswahili cha kawaida.
- source_word: τὸν λόγον
  choice: neno
  rationale: “Neno” huhifadhi istilahi ya kibiblia na mwangwi wake katika mfano, huku likirejelea ujumbe uliotangazwa.
theological_decisions:
- issue: Utambulisho wa watu na mbegu katika ufafanuzi wa mfano
  choice: 'Kudumisha sitiari moja kwa moja: “wale waliopandwa katikati ya miiba”'
  alternative: wale waliopandwa kwenye udongo wenye miiba
  rationale: Kigiriki kinaendelea moja kwa moja na sitiari ya mbegu badala ya kuifafanua kwa maneno yasiyo ya kisitiari; tafsiri hii huhifadhi muundo na mvutano wa kifasihi wa mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kigiriki bila kuwa mgumu, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
