  terminology: “Mahangaiko,” “udanganyifu wa mali,” “tamaa za mambo mengine,” “neno,” and “kulisonga” are suitable Standard East African Swahili choices. “Kulisonga” appropriately preserves the choking/crowding agricultural image.
