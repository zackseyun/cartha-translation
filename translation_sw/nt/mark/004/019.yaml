  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: sw
  text: na mahangaiko ya zama hizi[a], udanganyifu wa mali[b], na tamaa za mambo mengine huingia na kulisonga neno, nalo linakuwa lisilo na matunda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahangaiko ya ulimwengu huu.” Neno la Kigiriki kimsingi linaweza kumaanisha “zama” na, kwa upanuzi, mpangilio wa ulimwengu wa sasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “hila ya utajiri.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi zaidi, “nalo linakuwa lisilo na matunda.” Inawezekana pia kuelewa kuwa msikilizaji au mbegu/mmea ndiye asiyekuwa na matunda; kisarufi, “neno” ndilo kirejewa cha karibu zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: mahangaiko
  rationale: Neno hili huonyesha mambo yanayomlemea na kumhangaisha mtu; “mahangaiko” ni Kiswahili cha kawaida na hakifanyi maana iwe ya kihisia kupita kiasi.
- source_word: τοῦ αἰῶνος
  choice: ya wakati huu
  rationale: αἰών kimsingi huonyesha kipindi au zama. “Wakati huu” huhifadhi maana ya mpangilio wa sasa wa maisha kwa lugha ya kawaida; tanbihi inaonyesha uwezekano wa “ulimwengu huu.”
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: udanganyifu wa mali
  rationale: Kirai kinaonyesha kuwa mali huweza kupotosha au kudanganya. “Mali” ni pana na ya asili zaidi katika Kiswahili kuliko tafsiri inayohusu fedha peke yake.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: tamaa za mambo mengine
  rationale: Huhifadhi upana wa mambo mengine yanayotamaniwa bila kuyafafanua zaidi ya chanzo.
- source_word: εἰσπορευόμεναι
  choice: huingia
  rationale: Kitenzi hiki huhifadhi picha ya ushawishi huo kuingia ndani. Muundo wa Kiswahili unaifanya ihusiane kwa kawaida na orodha yote iliyotangulia.
- source_word: συμπνίγουσιν
  choice: kulisonga
  rationale: “Kusonga” huhifadhi picha ya mmea au mbegu kunyimwa nafasi na kuzuiwa kukua, inayofaa muktadha wa mfano.
- source_word: τὸν λόγον
  choice: neno
  rationale: “Neno” huhifadhi nahau ya kibiblia na rejeo la ujumbe uliotangazwa katika mfano.
- source_word: ἄκαρπος γίνεται
  choice: huwa halizai matunda
  rationale: Hutoa kwa Kiswahili cha asili hali ya kutokuwa na matunda huku ikihifadhi taswira ya kilimo na mchakato unaoonyeshwa na γίνεται.
theological_decisions:
- issue: Kirejewa cha kitenzi na kivumishi vya mwisho katika umoja
  choice: 'Kiima kinachoeleweka ni “neno,” hivyo: “nalo huwa halizai matunda.”'
  alternative: Msikilizaji huwa hazai matunda; au mbegu/mmea huwa hauzai matunda.
  rationale: Kisarufi, τὸν λόγον (“neno”) ndilo jina la umoja lililo karibu zaidi, na muundo wa umoja wa ἄκαρπος γίνεται unaweza kulirejelea. Katika taswira ya mfano, neno lililopandwa kama mbegu linasongwa na kukosa matunda; tafsiri haiongezi kiima kingine kisichotajwa wazi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa ulinganifu bora: unahifadhi orodha, picha ya kuingia na kusonga, pamoja na taswira ya kuzaa matunda, huku ukitumia sentensi inayoeleweka kwa msomaji wa kawaida.'
