base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: sw
  text: na inapopandwa, huota na kuwa kubwa kuliko mimea yote ya bustani, nayo hutoa matawi makubwa, hivi kwamba ndege wa angani[a] wanaweza kukaa[b] chini ya kivuli chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndege wa mbinguni”; kwa muktadha huu, “angani” humaanisha anga ambako ndege huruka.
    reason: lexical_alternative
  - marker: b
    text: Au “kufanya viota” au “kufanya makao.” Maneno haya huenda yakatoa mwangwi wa taswira za Agano la Kale kuhusu ndege wanaopata makao katika mti mkubwa (kwa mfano, Eze 17:23; Dan 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: inapopandwa
  rationale: 'Kitenzi cha kutenda kwa kutendwa baada ya ὅταν kinaeleza wakati usio maalumu: ‘inapopandwa.’ Katika Kiswahili, ‘kupandwa’ ni ya kawaida kwa mbegu na bado inadumisha taswira ya kilimo.'
- source_word: ἀναβαίνει
  choice: huota
  rationale: Katika muktadha wa mbegu, neno hili linaeleza mmea kuchomoza kutoka ardhini; ‘huota’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: γίνεται
  choice: kuwa
  rationale: Linaonyesha hali inayotokea baada ya ukuaji; ‘kuwa’ inadumisha wazo la mabadiliko bila kuongeza maelezo.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: kubwa kuliko mimea yote ya bustani
  rationale: Tafsiri hii inadumisha muundo wa kulinganisha na kueleza λάχανα kama mimea inayolimwa bustanini, si mboga za kuliwa pekee.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: hutoa matawi makubwa
  rationale: ‘Hutoa matawi’ ni usemi wa asili wa Kiswahili kwa mmea unaochipusha au kukuza matawi.
- source_word: ὥστε δύνασθαι
  choice: hivi kwamba ... wanaweza
  rationale: Muundo huu unaonyesha matokeo, kama ὥστε pamoja na kitenzi-jina, na unasomeka kwa kawaida katika Kiswahili.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: chini ya kivuli chake
  rationale: ‘Kivuli’ kinafaa kwa taswira ya mahali pa kujisitiri dhidi ya jua na ni cha kawaida kuliko tafsiri ya moja kwa moja ya ‘shadow.’
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: ‘Ndege wa angani’ ni usemi wa kawaida unaoakisi οὐρανός katika maana ya anga bila kulazimisha maana ya makao ya Mungu.
- source_word: κατασκηνοῦν
  choice: kufanya viota
  rationale: Kwa ndege, tafsiri hii huwasilisha kwa kawaida wazo la kukaa au kujisitiri hapo, ingawa neno la Kigiriki linaweza pia kumaanisha kukaa au kufanya makao.
theological_decisions:
- issue: Taswira inayoweza kurejelea ndege wanaopata makao katika mti mkubwa katika Agano la Kale
  choice: Kudumisha taswira bila kuitafsiri wazi katika matini kuu
  alternative: Kutumia ‘kukaa’ ili kudumisha mwangwi mpana zaidi wa Ezekieli 17:23 na Danieli 4:12
  rationale: Kigiriki kinaonyesha ndege wakipata mahali chini ya kivuli cha mmea lakini hakielezi maana ya kiteolojia ya taswira hiyo. Matini kuu haipaswi kuamua utambulisho wa ndege au maana ya ufalme; tanbihi inahifadhi uwezekano wa mwangwi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Huota,’ ‘mimea ya bustani,’ na ‘hutoa matawi’ ni misemo inayoeleweka kwa urahisi. ‘Lakini’ huendeleza tofauti kutoka mstari uliotangulia ambayo καί ya mwanzo inaweza kubeba katika muktadha.
