  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: sw
  text: Akaendelea kuwaambia, “Zingatieni mnachosikia. Kipimo mnachotumia ndicho mtakachopimiwa, na mtaongezewa zaidi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu, kuongezewa zaidi kunaweza kumaanisha kuongezeka kwa ufahamu kwa wale wanaoyapokea mafundisho ya Yesu; hata hivyo, kitu kinachoongezwa hakitajwi wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Akaendelea kuwaambia
  rationale: Kauli ya wakati usiotimilika inadokeza usemi uliokuwa ukiendelea au kurudiwa. Kiswahili hiki kinahifadhi hali hiyo kwa njia ya kawaida katika simulizi.
- source_word: Βλέπετε
  choice: Zingatieni
  rationale: Katika muktadha huu kitenzi cha ‘kuona’ kinatumika kama himizo la kuwa makini. ‘Zingatieni’ ni lugha ya sasa, wazi na yenye heshima.
- source_word: τί ἀκούετε
  choice: mnachosikia
  rationale: τί ni ‘nini/kile ambacho,’ kwa hiyo tafsiri inahifadhi msisitizo wa Marko juu ya kile kinachosikiwa, bila kuoanisha na ‘jinsi mnavyosikia’ ya Luka 8:18.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Kipimo mnachotumia
  rationale: Muundo huu unaonyesha kipimo au kiwango kinachotumiwa. ‘Mnachotumia’ ni Kiswahili cha kawaida na sitiari ya kupima inaendelea kuonekana wazi katika sehemu inayofuata.
- source_word: μετρηθήσεται ὑμῖν
  choice: ndicho mtakachopimiwa
  rationale: Huhifadhi kauli tendwa ya wakati ujao na wazo la kupokea kwa kipimo kilekile, bila kuongeza kwa uwazi wazo la ‘kurudishiwa,’ ambalo halimo katika Kigiriki.
- source_word: προστεθήσεται ὑμῖν
  choice: mtaongezewa zaidi
  rationale: Kitenzi kina maana ya kuongezwa. ‘Zaidi’ huonyesha ongezeko linalodokezwa na muktadha, huku kitu kinachoongezwa kikibaki bila kutajwa kama ilivyo katika chanzo.
theological_decisions:
- issue: Maana ya kanuni ya kupimiwa kwa kipimo kilekile
  choice: Tafsiri inadumisha sitiari pana katika muktadha wa kusikia mafundisho ya Yesu, bila kuifungamanisha na matumizi moja tu.
  alternative: Kuieleza moja kwa moja kuwa kanuni ya hukumu, ukarimu, au kuongezeka kwa ufahamu wa kiroho.
  rationale: Muktadha wa karibu unahusu kusikia na kupokea ujumbe wa Yesu, lakini maneno yenyewe hayaelezi kwa uwazi kile kinachopimwa au kuongezwa. Kutodokeza matumizi moja tu kunahifadhi upana na mvutano wa kiteolojia wa kauli hiyo.
- issue: Kitu kinachoongezwa
  choice: Kimeachwa bila kutajwa katika maandishi makuu.
  alternative: Kukitaja kuwa ufahamu, maarifa, neema, au thawabu.
  rationale: Kigiriki hakitaji kitu kinachoongezwa. Ingawa muktadha unaweza kuelekeza kwenye ufahamu unaoongezeka, kukitaja katika maandishi makuu kungeamua maana ambayo chanzo kinaiacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kawaida, ya sasa na yenye heshima. ‘Akaendelea kuwaambia’ huhifadhi hali endelevu ya simulizi, ‘zingatieni’ hutoa himizo la wazi, na sitiari ya kipimo imehifadhiwa bila kuibana kwa fundisho maalumu.
