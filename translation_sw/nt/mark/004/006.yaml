  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: sw
  text: Na jua lilipochomoza, ikaunguzwa na joto, na kwa sababu haikuwa na mzizi, ikakauka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikanyauka.” Kitenzi cha Kigiriki kinaweza kumaanisha kukauka au kunyauka.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Na jua lilipochomoza
  rationale: Huhifadhi kiunganishi cha simulizi na kishazi cha wakati kwa Kiswahili cha kawaida; “kuchomoza” ndilo neno la kawaida kuhusu jua.
- source_word: ἐκαυματίσθη
  choice: ikaunguzwa na joto
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na kuonyesha madhara ya joto kali bila kudai kwamba iliteketea kabisa.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: kwa sababu haikuwa na mzizi
  rationale: Hutoa wazi uhusiano wa kisababishi wa διά pamoja na kitenzi-jina, na huhifadhi umoja wa “mzizi.”
- source_word: ἐξηράνθη
  choice: ikakauka
  rationale: Hutoa maana ya kuwa kavu au kunyauka kwa njia fupi na ya kawaida katika mazingira ya mmea.
