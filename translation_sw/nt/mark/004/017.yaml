  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: sw
  text: nao hawana mzizi ndani yao, bali hudumu kwa muda tu. Kisha, dhiki au mateso yanapotokea kwa sababu ya lile neno, mara moja huanguka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hujikwaa,” “hukwaa,” au “hukwazika.” Kitenzi cha Kigiriki kinaweza pia kumaanisha kuudhika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: mzizi
  rationale: Inahifadhi sitiari halisi ya kilimo inayohusiana na mbegu na udongo katika mfano huu, bila kuongeza wazo la kina au uimara lisilotajwa wazi.
- source_word: ἐν ἑαυτοῖς
  choice: ndani yao
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kiwakilishi rejeshi.
- source_word: πρόσκαιροί
  choice: hudumu kwa muda tu
  rationale: Inaeleza kwa Kiswahili cha kawaida kwamba hali yao ni ya muda mfupi, bila kuingiza wazo la kutokuwa thabiti kitabia.
- source_word: εἶτα
  choice: Kisha
  rationale: Inaonyesha hatua inayofuata kwa uwazi katika mtiririko wa maelezo.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: dhiki au mateso yanapotokea
  rationale: Muundo wa wakati wa Kigiriki umetafsiriwa kwa ‘yanapotokea’; ‘dhiki’ huhifadhi maana ya shinikizo au taabu, na ‘mateso’ yanaeleza persecution kwa lugha inayoeleweka.
- source_word: διὰ τὸν λόγον
  choice: kwa sababu ya lile neno
  rationale: ‘Neno’ linahifadhi istilahi inayorudiwa katika mfano; ‘lile’ linaonyesha neno lililotajwa tayari.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Inahifadhi hisia ya uharaka iliyo tabia ya simulizi la Marko.
- source_word: σκανδαλίζονται
  choice: huanguka
  rationale: Katika muktadha huu, inaonyesha kuacha msimamo wao baada ya kulipokea neno. Pia inahifadhi kwa kiasi picha ya kuanguka bila kudai zaidi kuhusu hali yao ya mwisho.
theological_decisions:
- issue: Maana ya σκανδαλίζονται katika muktadha wa ufuasi na kuacha msimamo
  choice: huanguka
  alternative: hujikwaa; husababishwa kujikwaa; hukwazika
  rationale: 'Muktadha unaonyesha zaidi ya kuudhika kihisia: wale waliolipokea neno kwa muda hawastahimili dhiki au mateso. ‘Huanguka’ huonyesha uzito huo bila kutatua kimadhehebu swali la hali yao ya mwisho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida huku sitiari ya mzizi, istilahi ‘neno,’ na utata wa kitenzi cha mwisho vikihifadhiwa. Alama ya tanbihi imewekwa baada ya ‘huanguka,’ ambako inahusu moja kwa moja neno lenye mbadala wa kileksika.
