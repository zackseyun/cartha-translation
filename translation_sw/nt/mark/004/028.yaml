  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: sw
  text: 'Ardhi huleta mazao yenyewe: kwanza chipukizi[a], kisha suke, halafu nafaka iliyojaa ndani ya suke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwanza jani la mmea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτομάτη
  choice: wenyewe
  rationale: Kivumishi hiki kinarejelea udongo na kuonyesha kwamba huzaa bila msaada wa mwanadamu unaoonekana; “wenyewe” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: ἡ γῆ
  choice: udongo
  rationale: Katika muktadha huu wa kilimo, neno linamaanisha ardhi inayolimwa ambamo zao huota; “udongo” ni sahihi zaidi kuliko “nchi” au “dunia.”
- source_word: καρποφορεῖ
  choice: huzaa
  rationale: Kitenzi hiki kina maana ya kutoa mazao au matunda; “huzaa” huhifadhi taswira ya kilimo kwa lugha fupi na ya kawaida.
- source_word: πρῶτον χόρτον
  choice: kwanza chipukizi
  rationale: Katika hatua ya kwanza ya ukuaji wa nafaka, χόρτος ni sehemu ya kijani inayoanza kuonekana; “chipukizi” inaeleweka kwa urahisi na haidai kwamba bua limekwisha kukomaa.
- source_word: εἶτα στάχυν
  choice: kisha suke
  rationale: στάχυς ni kichwa cha nafaka; “suke” ni neno la kawaida la Kiswahili kwa kichwa cha nafaka kama mahindi au ngano na linafaa katika mfuatano wa ukuaji.
- source_word: πλήρης σῖτον
  choice: nafaka iliyojaa
  rationale: Muundo wa Kigiriki unaonyesha nafaka iliyo kamili au iliyojaa, si lazima kuongeza wazi wazo la kuiva; tafsiri hii inadumisha upeo huo.
- source_word: ἐν τῷ στάχυϊ
  choice: ndani ya suke
  rationale: Kirai hiki kinaonyesha mahali nafaka ilipo, yaani ndani ya kichwa cha nafaka, na matumizi ya “suke” kwa mara ya pili yanadumisha uthabiti.
