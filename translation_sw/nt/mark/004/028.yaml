  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano rahisi wa “kwanza… kisha… halafu” umehifadhi hatua za ukuaji. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
