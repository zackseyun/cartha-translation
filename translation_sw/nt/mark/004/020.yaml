  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: sw
  text: 'Na hao ndio waliopandwa kwenye udongo mzuri: husikia neno, hulipokea[a], na huzaa matunda—mara thelathini, mara sitini, na mara mia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulikubali” au “kulikaribisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: hao
  rationale: Kiwakilishi hiki kinarejelea kundi la mwisho katika ufafanuzi wa mfano na kulitofautisha na makundi yaliyotangulia.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: waliopandwa kwenye udongo mzuri
  rationale: Inadumisha kauli tendwa na taswira ya kilimo ya mbegu iliyopandwa kwenye aina mbalimbali za udongo.
- source_word: γῆν τὴν καλὴν
  choice: udongo mzuri
  rationale: Katika muktadha wa kilimo, 'udongo' ni tafsiri ya kawaida na sahihi ya γῆ, nayo καλὴν inaonyesha ubora wake ukilinganishwa na udongo mwingine.
- source_word: οἵτινες
  choice: hulisikia ... na kulipokea ... huzaa
  rationale: Muundo huu wa Kiswahili unaeleza sifa zinazolitambulisha kundi hilo kwa njia ya kawaida bila kuongeza maana.
- source_word: ἀκούουσιν τὸν λόγον
  choice: hulisikia neno
  rationale: '''Neno'' linadumisha istilahi inayorudiwa katika Marko 4 na linaeleweka hapa kuwa ujumbe uliotangazwa.'
- source_word: παραδέχονται
  choice: kulipokea
  rationale: Kitenzi hiki kinaonyesha kulikubali au kulikaribisha neno kwa mwitikio chanya; kiambishi '-li-' kinaonyesha wazi kuwa kinachopokewa ni neno.
- source_word: καρποφοροῦσιν
  choice: huzaa matunda
  rationale: Hifadhi taswira ya kilimo na maana yake ya kiroho bila kufafanua kupita yale yaliyosemwa na maandiko.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: baadhi mara thelathini, baadhi mara sitini, na baadhi mara mia
  rationale: Huwasilisha kwa Kiswahili cha kawaida viwango tofauti vya mavuno ya kila mbegu, huku ikidumisha mpangilio na marudio ya kiunganishi cha Kigiriki.
theological_decisions:
- issue: Aina ya mwitikio kwa neno katika udongo mzuri
  choice: Aya inaeleza kusikia, kulipokea neno kwa njia chanya, na kuzaa matunda.
  alternative: Kuifafanua aya kuwa uthibitisho wa lazima wa kudumu hadi mwisho, au kuwa mwitikio wa mwanzo tu.
  rationale: Kigiriki kinataja matendo hayo matatu lakini hakifafanui mfumo mpana wa kimafundisho kuhusu kudumu au kuasi; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya kilimo na kauli tendwa vimedumishwa; 'baadhi ... baadhi ... baadhi' hutumia mtindo wa kawaida kueleza mavuno ya viwango tofauti.
