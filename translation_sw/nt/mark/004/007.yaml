  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: sw
  text: Mbegu nyingine ikaanguka katikati ya miiba, nayo miiba ikamea na kuisonga, na haikuzaa matunda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: Mbegu nyingine
  rationale: Kivumishi cha umoja cha jinsia ya kati kinarejelea kwa udokezi mbegu iliyotajwa katika muktadha uliotangulia; kutaja “mbegu” kunafanya Kiswahili kiwe wazi bila kuongeza wazo jipya.
- source_word: ἔπεσεν
  choice: ikaanguka
  rationale: Kitenzi πίπτω kinamaanisha “kuanguka”; hiki kinafuata tendo katika simulizi na hakibadili kitenzi kuwa “ilipandwa.”
- source_word: εἰς τὰς ἀκάνθας
  choice: katikati ya miiba
  rationale: Ingawa εἰς kwa msingi huonyesha mwendo wa kuingia, katika mazingira haya “katikati ya miiba” ni Kiswahili cha kawaida kinachoonyesha mbegu kuangukia eneo lenye miiba.
- source_word: ἀνέβησαν
  choice: ikamea
  rationale: Kwa mimea, ἀναβαίνω hapa huonyesha miiba kuchipuka au kukua juu; “ikamea” ni ya asili na yenye kueleweka, huku umoja ukipatana na nomino ya kundi “miiba” katika matumizi ya kawaida.
- source_word: συνέπνιξαν
  choice: kuisonga
  rationale: “Kusonga” huhifadhi picha ya mimea kuibana na kuizuia mbegu isikue, bila kutumia tafsiri pana zaidi kama “kuizidi.”
- source_word: αὐτό
  choice: -i- katika “kuisonga”
  rationale: Kiambishi cha yambwa kinarejelea mbegu ya umoja kwa njia ya kawaida ya Kiswahili.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: haikuzaa matunda
  rationale: Kauli ya Kigiriki ni “haikutoa tunda”; “haikuzaa matunda” ni usemi wa kawaida wa kilimo katika Kiswahili na huhifadhi matokeo yaliyokusudiwa.
