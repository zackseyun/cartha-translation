id: MRK.4.29
reference: Mark 4:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: sw
  text: Lakini mazao yanapokuwa tayari[a], mara moja hupeleka mundu, kwa sababu mavuno yamefika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanapoiva,” “yanakuwa tayari kuvunwa,” au, kwa tafsiri ya karibu zaidi, “yanapojitoa.” Kigiriki kinatumia usemi amilifu usio wa kawaida, ambapo “mazao” ndiyo kiima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini ... yanapokuwa
  rationale: ὅταν huanzisha hali ya wakati isiyo maalumu, na δέ hapa ni kiunganishi cha mpito chenye utofautishaji mdogo; “Lakini ... yanapokuwa” ni ya kawaida na huhifadhi mwendo wa simulizi.
- source_word: παραδοῖ
  choice: yanapokuwa tayari
  rationale: Ingawa παραδίδωμι kwa kawaida humaanisha ‘kukabidhi,’ hapa zao ndilo kiima na usemi unaonyesha kwamba mazao yamefikia hali ya kuvunwa. Tafsiri hii inaeleweka kwa kawaida, huku tanbihi ikihifadhi usemi usio wa kawaida wa Kigiriki.
- source_word: ὁ καρπός
  choice: mazao
  rationale: καρπός hapa ni zao kwa maana ya jumla. Kwa kuwa muktadha unataja mundu na mavuno, “mazao” linafaa kuliko “tunda” bila kulibana kuwa aina moja maalumu ya nafaka.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Huhifadhi msisitizo wa hatua ya haraka ulio wa kawaida katika Injili ya Marko.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: hupeleka mundu
  rationale: Kigiriki husema kwa namna ya moja kwa moja ‘huutuma/hupeleka mundu.’ “Hupeleka mundu” huhifadhi picha hiyo kwa Kiswahili kinachoeleweka bila kuongeza maelezo yasiyokuwapo katika matini.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutoa wazi sababu ya kupeleka mundu mara moja.
- source_word: παρέστηκεν
  choice: yamefika
  rationale: Wakati timilifu wa kitenzi unaonyesha kwamba mavuno yamewasili na sasa yapo tayari; “yamefika” huhifadhi maana zote mbili kwa ufupi.
- source_word: ὁ θερισμός
  choice: mavuno
  rationale: “Mavuno” ni neno la kawaida na pana kwa θερισμός katika picha hii ya kilimo.
theological_decisions:
- issue: Utayari wa mazao kama mfano katika mfano wa Ufalme
  choice: Kueleza mazao kuwa tayari huku tanbihi ikihifadhi usemi halisi usio wa kawaida
  alternative: Kutafsiri moja kwa moja zaidi kuwa ‘mazao yanapojitoa/yajikabidhi’
  rationale: Matini yenyewe haisemi wazi kama mavuno yanawakilisha hukumu, utume, au utimilifu wa Ufalme. Tafsiri inadumisha picha ya kilimo bila kulazimisha maana moja ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mazao” na “mavuno” ni maneno yanayoeleweka kwa urahisi; “hupeleka mundu” huhifadhi picha ya Kigiriki bila kusikika kuwa ya kale kupita kiasi.
