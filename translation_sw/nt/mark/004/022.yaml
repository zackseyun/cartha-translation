  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: sw
  text: Kwa maana hakuna kilichofichwa isipokuwa ili kifunuliwe,[a] wala hakuna kilichofichika isipokuwa kije wazi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa kwamba kifunuliwe ... isipokuwa kwamba kije wazi.” Vifungu vya Kiyunani vyenye ἵνα vinaweza kueleweka kuwa vya kusudi au vya matokeo.
    reason: alternative_reading
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “kije katika uwazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: kilichofichwa
  rationale: Hutoa maana ya kitu kilicho siri au nje ya mwonekano, huku ikidumisha utofautishaji wake na kufunuliwa.
- source_word: ἐὰν μὴ ἵνα
  choice: isipokuwa ili
  rationale: Muundo huu unaonyesha hali ya pekee pamoja na mwelekeo wa kusudi; Kiswahili hiki ni cha kawaida na hakifuti uwezekano wa maana ya matokeo.
- source_word: φανερωθῇ
  choice: kifunuliwe
  rationale: Kitenzi hiki cha kutendwa humaanisha kufanywa kionekane au kijulikane; 'kifunuliwe' huhifadhi kauli ya kutendwa na ulinganifu wa picha.
- source_word: ἀπόκρυφον
  choice: kilichowekwa sirini
  rationale: Huonyesha kitu kilichofichwa au kuwekwa mbali na macho. Usemi huu hutofautisha kidogo nusu ya pili bila kuondoa usambamba.
- source_word: ἐγένετο
  choice: kilichowekwa
  rationale: Katika muktadha huu γίνομαι inaonyesha kuingia katika hali ya kufichika; 'kilichowekwa sirini' ni Kiswahili cha kawaida kinachowasilisha hali hiyo bila kulazimisha mtendaji atajwe.
- source_word: ἔλθῃ εἰς φανερόν
  choice: kiwekwe wazi
  rationale: Huwasilisha kufikia hali ya kuonekana wazi. Ingawa picha halisi ni 'kuja katika uwazi,' usemi huu ni wa kawaida katika Kiswahili na unaeleweka kwa urahisi.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huunganisha kauli hii na muktadha uliotangulia kama maelezo au sababu.
theological_decisions:
- issue: Maana ya kusudi au matokeo katika vifungu viwili vya ἵνα
  choice: Kutumia 'ili' ili kuhifadhi mwelekeo wa kusudi.
  alternative: 'Kutafsiri kama matokeo: ''isipokuwa kwamba kitafunuliwa ... kitawekwa wazi.'''
  rationale: ἵνα kwa kawaida huonyesha kusudi, lakini katika Kiyunani cha Koine inaweza pia kukaribia maana ya matokeo. Tafsiri kuu huhifadhi nguvu ya kusudi, huku tanbihi ikitaja uwezekano mwingine bila kudai wazi chanzo cha kitheolojia cha kusudi hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa vipashio viwili umehifadhiwa, huku 'kilichofichwa' na 'kilichowekwa sirini' zikionyesha tofauti ndogo ya msamiati wa Kiyunani.
