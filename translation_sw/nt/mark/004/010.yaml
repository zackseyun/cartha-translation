  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: sw
  text: Naye alipokuwa faraghani, wale waliomzunguka[a], pamoja na wale Kumi na Wawili, walikuwa wakimuuliza kuhusu mifano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliokuwa pamoja naye.” Kauli hii inawahusu wafuasi wengine waliokuwa karibu na Yesu, si lazima wale Kumi na Wawili peke yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Naye alipokuwa
  rationale: “Naye” inadumisha kiunganishi cha simulizi cha καί, huku “alipokuwa” ikiwasilisha kwa Kiswahili cha kawaida uhusiano wa wakati unaoonyeshwa na ὅτε pamoja na ἐγένετο.
- source_word: ἐγένετο κατὰ μόνας
  choice: alipokuwa faraghani
  rationale: Usemi huu unaonyesha Yesu akiwa kando na umati au katika mazingira ya faragha. “Faraghani” huepuka mkanganyiko wa kusema alikuwa peke yake kabisa, kwa kuwa wafuasi wake walikuwa pamoja naye.
- source_word: ἠρώτων
  choice: walikuwa wakimuuliza
  rationale: Muundo huu unahifadhi hali endelevu au ya kurudiwa-rudiwa ya kitenzi cha wakati usiotimilika ἠρώτων bila kuongeza mkazo usio lazima.
- source_word: οἱ περὶ αὐτὸν
  choice: wale waliokuwa pamoja naye
  rationale: Tafsiri hii inaonyesha kundi la wafuasi waliokuwa karibu na Yesu, si lazima ukaribu wa kimahali tu, na haifanyi kundi hilo kuwa wale Kumi na Wawili pekee.
- source_word: σὺν τοῖς δώδεκα
  choice: pamoja na wale Kumi na Wawili
  rationale: Inahifadhi maana ya kuandamana na pia tofauti ya kisarufi kati ya kundi pana la waliokuwa pamoja na Yesu na wale Kumi na Wawili.
- source_word: τὰς παραβολάς
  choice: mifano
  rationale: Wingi wa neno la Kigiriki umehifadhiwa. “Mifano” ni neno la kawaida na linaloeleweka katika muktadha wa mafundisho ya Yesu kwa njia ya masimulizi na milinganisho.
theological_decisions:
- issue: Utambulisho wa waliomuuliza Yesu
  choice: Kundi pana la waliokuwa pamoja na Yesu, likiwa pamoja na wale Kumi na Wawili, ndilo lililomuuliza.
  alternative: Wale Kumi na Wawili pekee ndio waliomuuliza, au kundi tofauti kabisa liliwaandama wale Kumi na Wawili.
  rationale: Muundo οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα kwa kawaida unatofautisha kundi la watu waliokuwa pamoja na Yesu na wale Kumi na Wawili huku ukiwaunganisha katika tendo la kuuliza. Tafsiri haivunji wala kufuta tofauti hiyo.
- issue: Maana ya Yesu kuwa κατὰ μόνας huku wengine wakiwa pamoja naye
  choice: Yesu alikuwa faraghani, yaani kando na umati, si lazima akiwa hana mtu mwingine yeyote karibu.
  alternative: Yesu alikuwa peke yake kabisa kabla ya kundi hilo kumkaribia.
  rationale: Muktadha wenye watu waliokuwa pamoja naye unaruhusu “faraghani” kumaanisha mazingira yasiyo ya hadhara. Tafsiri inaacha wazi jinsi na wakati kundi lilivyokuwa naye bila kulazimisha mpangilio wa matukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Wale Kumi na Wawili” limetumiwa kama jina la kundi maalumu, na “faraghani” linaepusha mgongano usio wa lazima kati ya kuwa kando na umati na kuwapo kwa wafuasi wengine.
