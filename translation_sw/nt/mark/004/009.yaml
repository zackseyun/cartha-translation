base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: sw
  text: Naye alikuwa akisema, “Yeyote aliye na masikio ya kusikia[a], na asikie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo wa karibu zaidi, “Mwenye masikio ya kusikia, na asikie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinadumisha uhusiano rahisi na yaliyotangulia bila kuongeza dhana ya wakati kama vile ‘kisha.’
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Muundo huu unaakisi hali ya tendo lisilokamilika ya kitenzi cha Kigiriki bila kusisitiza mno kwamba kauli hiyo ilirudiwa mara nyingi.
- source_word: Ὃς ἔχει
  choice: Yeyote aliye na
  rationale: Kishazi hiki kina maana ya jumla. ‘Yeyote aliye na’ ni Kiswahili cha sasa na cha kawaida, huku kikidumisha umoja wa kisarufi.
- source_word: ὦτα
  choice: masikio
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi; pia inafaa katika usemi huu wa kimethali kwa Kiswahili.
- source_word: ἀκούειν
  choice: kusikia
  rationale: Infinitivo hii inakamilisha neno ‘masikio’ na kuhifadhi urudiaji wa mzizi wa maana pamoja na amri inayofuata.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Hii ni amri ya nafsi ya tatu. Muundo ‘na asikie’ ni wa kawaida na wenye hadhi katika Kiswahili, na unahifadhi mwangwi wa ‘kusikia.’
theological_decisions:
- issue: Usemi wa jumla wenye umoja wa kisarufi
  choice: Yeyote aliye na ... na asikie
  alternative: Mwenye ... na asikie
  rationale: Kigiriki kinatumia umoja wa kisarufi wenye maana ya jumla, si rejeo linalowahusu wanaume pekee. Kiswahili kinaweza kuwasilisha maana hiyo bila kuingiza jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Muundo ‘alikuwa akisema’ umechaguliwa ili kuhifadhi hali ya tendo la Kigiriki, na ‘na asikie’ hudumisha nguvu ya amri pamoja na mtindo wa kimethali.
