  text: If anyone has ears to hear[a], let him hear.
translation:
  language: sw
  text: Ikiwa mtu yeyote ana masikio ya kusikia, na asikie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Kama mtu yeyote
  rationale: Muundo huu unahifadhi hali ya sharti ya Kigiriki pamoja na maana ya wazi na ya jumla ya τις.
- source_word: ἔχει
  choice: ana
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha kuwa na katika wakati wa sasa.
- source_word: ὦτα
  choice: masikio
  rationale: Wingi halisi umehifadhiwa, na msemo huo unaeleweka kwa kawaida katika Kiswahili.
- source_word: ἀκούειν
  choice: ya kusikia
  rationale: Infinitivu inaonyesha uwezo au kusudi la masikio; ‘kusikia’ pia huhifadhi urudiaji wa mzizi wa kitenzi katika mstari.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Muundo ‘na’ pamoja na hali ya kutegemea hutoa amri ya nafsi ya tatu kwa Kiswahili cha asili, huku ‘asikie’ ikihifadhi maana pana ya kusikia kwa mwitikio.
theological_decisions:
- issue: Umoja wa jumla katika amri
  choice: na asikie
  alternative: na wasikie
  rationale: Kigiriki kina kiwakilishi kisichotaja mtu maalumu katika umoja na amri ya nafsi ya tatu umoja. Kiswahili hakihitaji kuingiza jinsia; umoja unahifadhiwa bila kutumia kiwakilishi cha kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima na ya kawaida. Urudiaji wa ‘kusikia/asikie’ umehifadhiwa ili kuakisi ἀκούειν ἀκουέτω.
