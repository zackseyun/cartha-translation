  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: sw
  text: Mbegu nyingine ikaanguka mahali penye miamba[a], ambapo hapakuwa na udongo mwingi; ikaota mara moja kwa sababu udongo haukuwa na kina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa mawe.” Kigiriki kinaeleza eneo lenye miamba, lenye tabaka jembamba tu la udongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Mbegu nyingine
  rationale: Kivumishi cha umoja kisicho na nomino kimetumiwa kama nomino na kinarejelea mbegu katika muktadha uliotangulia; kutaja “mbegu” kunafanya maana iwe wazi kwa Kiswahili.
- source_word: πετρῶδες
  choice: udongo wenye miamba
  rationale: Neno linaeleza eneo lenye mwamba chini ya tabaka jembamba la udongo, si udongo wenye mawe yaliyotawanyika tu. Tanbihi inaweka wazi picha hiyo.
- source_word: γῆν πολλήν
  choice: udongo mwingi
  rationale: Katika muktadha wa kilimo, γῆ ni udongo unaowezesha mimea kukua, wala si nchi kwa maana pana.
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Huhifadhi wazo la kuchipuka upesi na ni usemi wa kawaida wa Kiswahili sanifu.
- source_word: ἐξανέτειλεν
  choice: ikaota
  rationale: Katika muktadha wa mbegu, kitenzi hiki humaanisha kuchipuka au kuota; “ikaota” ni wazi na ya kawaida.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: kwa sababu udongo haukuwa na kina
  rationale: Muundo wa διά pamoja na kitenzi-jina unaonyesha sababu. Tafsiri hii ni ya asili katika Kiswahili na inadumisha picha ya tabaka jembamba la udongo.
- source_word: ὅπου
  choice: ambapo
  rationale: Kielezi hiki cha mahali kinaunganisha eneo lililotajwa na maelezo yanayofuata kwa Kiswahili sanifu.
