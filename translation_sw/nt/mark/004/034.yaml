  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: sw
  text: Naye hakuwa akisema nao bila kutumia mfano; lakini faraghani aliwafafanulia wanafunzi wake mwenyewe kila kitu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “wanafunzi wake mwenyewe” inadumisha msisitizo wa Kigiriki kwamba hawa walikuwa wanafunzi wake wa kwake.
    reason: lexical_alternative
  - marker: b
    text: Au “alikuwa akiwaeleza kila kitu” au “alikuwa akiwafasiria kila kitu.” Kitenzi kinaweza kumaanisha kueleza, kufafanua, au kufasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: bila kutumia mfano
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba Yesu hakuzungumza na watu bila kutumia mfano, huku ukihifadhi παραβολή kama nomino ya umoja.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: hakuwa akisema nao
  rationale: Muundo wa ‘alikuwa aki-’ unaonyesha tendo la kawaida au lililoendelea, kulingana na hali ya kitenzi cha Kigiriki cha wakati usiotimilika; ‘nao’ ni Kiswahili cha kawaida kwa kusema na watu.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Neno hili la Kiswahili linaonyesha hali ya kutokuwa mbele ya umati, bila kudokeza kwamba Yesu alikuwa peke yake.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: wanafunzi wake mwenyewe
  rationale: ‘Mwenyewe’ inadumisha msisitizo wa ἰδίοις kwamba walikuwa wanafunzi wake hasa, badala ya kutafsiri tu ‘wanafunzi wake.’
- source_word: ἐπέλυεν
  choice: alikuwa akiwaeleza
  rationale: Kitenzi hiki hapa kina maana ya kueleza, kufafanua, au kufasiri. ‘Alikuwa akiwaeleza’ ni lugha ya kawaida na pia inaonyesha tendo lililorudiwa au kuendelea.
- source_word: πάντα
  choice: kila kitu
  rationale: Tafsiri hii inadumisha upeo mpana wa neno la Kigiriki bila kuubana waziwazi kuwa mifano pekee.
theological_decisions:
- issue: Upeo wa maelezo ya Yesu faraghani
  choice: kila kitu
  alternative: mifano yote; kila jambo alilokuwa amesema
  rationale: Kigiriki kinasema tu πάντα, ‘kila kitu.’ Muktadha unaweza kuelekeza kwenye mafundisho au mifano yake, lakini tafsiri haipaswi kuufanya upeo huo kuwa mwembamba kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Faraghani’ ni kifupi na cha kawaida katika maandishi yenye hadhi; muundo wa vitenzi unaonyesha hali ya mazoea katika simulizi.
