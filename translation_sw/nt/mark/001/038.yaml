base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: sw
  text: Akawaambia, “Twendeni kwingine, kwenye miji midogo ya karibu[a], ili nihubiri huko pia, kwa maana ndiyo sababu nilitoka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “miji midogo” linaweza kumaanisha makazi yaliyo kati ya vijiji na miji.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana nilitoka kwa ajili ya hili.” Kauli hii inaweza kumaanisha Yesu kuondoka mahali alipokuwa, au kwa upana zaidi kusudi lake la kwenda kuhubiri.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Twendeni
  rationale: Ni hali ya kutia moyo katika nafsi ya kwanza wingi, ikitoa mwaliko wa kwenda pamoja bila kuongeza maana isiyokuwapo katika Kigiriki.
- source_word: ἀλλαχοῦ
  choice: mahali pengine
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwenda kwingine kutoka mahali walipokuwa.
- source_word: ἐχομένας
  choice: ya karibu
  rationale: Katika matumizi haya neno hilo linaonyesha maeneo yaliyo jirani au yanayofuata karibu.
- source_word: κωμοπόλεις
  choice: miji midogo
  rationale: Neno hilo hutaja makazi makubwa kuliko vijiji vya kawaida lakini madogo kuliko miji mikubwa; “miji midogo” ni ya asili na inaeleweka katika Kiswahili.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: ili nihubiri huko pia
  rationale: “Ili” huhifadhi kusudi la ἵνα, “nihubiri” huwasilisha κηρύξω, na “huko pia” huhifadhi mkazo wa καὶ ἐκεῖ.
- source_word: εἰς τοῦτο
  choice: kwa ajili hiyo
  rationale: Hueleza kusudi linalorejelewa bila kulifafanua zaidi ya matini.
- source_word: ἐξῆλθον
  choice: nilitoka
  rationale: Huhifadhi maana ya msingi ya kutoka na haibainishi ikiwa Yesu anamaanisha kuondoka mahali pale au kusudi pana zaidi la kwenda kuhubiri.
- source_word: λέγει αὐτοῖς
  choice: Akawaambia
  rationale: Wakati uliopita wa kisimulizi ni wa asili katika Kiswahili, ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria.
theological_decisions:
- issue: Upeo wa maana ya ἐξῆλθον
  choice: nilitoka
  alternative: niliondoka; nilikuja kwa kusudi hili
  rationale: Kigiriki kinaweza kurejelea kuondoka mahali alipokuwa au, kwa upana zaidi, kutoka kwake ili kuhubiri. Tafsiri haifungi kauli hiyo katika mojawapo ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Twendeni” na “mahali pengine” ni vya kawaida na vya asili; “miji midogo” huepuka istilahi ngumu huku ikihifadhi tofauti ya kimaana ya κωμοπόλεις.
