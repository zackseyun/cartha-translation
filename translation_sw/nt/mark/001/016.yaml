  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: sw
  text: Alipokuwa akipita kando ya Bahari ya Galilaya, alimwona Simoni na Andrea, ndugu ya Simoni, wakitupa wavu baharini, kwa maana walikuwa wavuvi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων
  choice: Alipokuwa akipita
  rationale: Kirai hiki kinaonyesha tendo lililokuwa likiendelea wakati wa tendo kuu la kumwona; muundo huu ni wa asili katika Kiswahili na unahifadhi uhusiano wa wakati.
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya Bahari
  rationale: παρά pamoja na hali ya kushtakiwa hapa huonyesha mwendo kandokando au karibu na sehemu fulani; “kando ya” ni ya kawaida na sahihi katika muktadha huu.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Bahari ya Galilaya
  rationale: Huhifadhi jina la kijiografia lililozoeleka katika Kiswahili cha Biblia na matumizi ya θάλασσα katika chanzo, ingawa kijiografia ni ziwa.
- source_word: εἶδεν
  choice: alimwona
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kuona, bila kuongeza wazo la kumtambua au kumwangalia kwa makusudi.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Simoni na Andrea
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: ndugu yake Simoni
  rationale: Kirai kinamtambulisha Andrea kuwa ndugu ya Simoni. “Ndugu” huhifadhi maana ya uhusiano wa kifamilia katika muktadha huu bila uzito usio wa lazima.
- source_word: ἀμφιβάλλοντας
  choice: wakitupa wavu
  rationale: Kitenzi hiki humaanisha kutupa wavu wa kuvulia; kutaja “wavu” huweka wazi maana iliyomo katika kitenzi cha Kigiriki na ni Kiswahili cha asili.
- source_word: ἐν τῇ θαλάσσῃ
  choice: baharini
  rationale: Ingawa ἐν kwa kawaida ni “katika,” pamoja na tendo la kutupa wavu, “baharini” huonyesha kwa kawaida mahali unapoelekezwa wavu bila kupotosha maana.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: kwa maana walikuwa wavuvi
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa sababu au maelezo ya nyuma kuhusu tendo lao.
