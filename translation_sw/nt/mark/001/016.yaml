  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. Muundo unaepuka lugha ya kale isiyo ya lazima, huku ukihifadhi jina la jadi “Bahari ya Galilaya.”
