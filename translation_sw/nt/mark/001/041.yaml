  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: sw
  text: Naye, akiwa amekasirika[a], akanyosha mkono wake, akamgusa, akamwambia, “Nataka; takasika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasema “akiwa amesukumwa na huruma” badala ya “akiwa amekasirika.”
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: akiwa amekasirika
  rationale: Kitenzi kishirikishi hiki kinaonyesha hali ya hasira kulingana na matini iliyochapishwa ya SBLGNT. Tafsiri hii inaacha wazi chanzo au sababu ya hasira badala ya kuifafanua kwa kubahatisha.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: akanyosha mkono wake
  rationale: Huhifadhi tendo halisi la kunyoosha mkono na kulipanga kwa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: ἥψατο
  choice: akamgusa
  rationale: Katika muktadha huu, kitenzi hiki humaanisha kugusa. Chaguo hili huhifadhi umuhimu wa Yesu kumgusa mtu mwenye ukoma.
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, wakati uliopita unafaa kwa simulizi la kawaida la Kiswahili na haupotezi maana.
- source_word: Θέλω
  choice: Nataka
  rationale: Hueleza utashi na utayari wa Yesu kutenda, wala si wakati ujao tu. Ni kauli fupi na ya kawaida inayojibu ombi la mtu huyo.
- source_word: καθαρίσθητι
  choice: takasika
  rationale: Amri ya kutendwa ina maana ya kuwa safi au kutakaswa kutokana na ukoma, ikiwa na mwangwi wa hali ya kimwili na usafi wa kidini. “Takasika” ni fupi, yenye hadhi, na hudumisha upana huo.
theological_decisions:
- issue: Tofauti ya matini kuhusu hali ya hisia ya Yesu
  choice: Matini kuu inatafsiri ὀργισθεὶς kuwa “akiwa amekasirika.”
  alternative: Baadhi ya hati zina neno lenye maana ya “akiwa amesukumwa na huruma.”
  rationale: Rasimu inafuata matini ya SBLGNT iliyotolewa na haitatui kimya kimya mvutano kuhusu hisia za Yesu. Tofauti muhimu ya hati imewekwa katika tanbihi kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “aka-” unaleta mtiririko wa kawaida wa simulizi; maneno mafupi ya Yesu yamehifadhiwa bila kuongeza ufafanuzi usiomo katika Kigiriki.
