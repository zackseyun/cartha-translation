  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: sw
  text: Nao wakampata, wakamwambia[a], “Kila mtu anakutafuta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wote wanakutafuta.” Neno la Kigiriki ζητοῦσίν linaweza pia kutafsiriwa “wanakutafuta”; katika muktadha huu linaelekea kumaanisha watu wanaojaribu kumpata Yesu mahali alipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: wakampata
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha matokeo yaliyofanikiwa ya utafutaji; ‘wakampata’ ni tafsiri ya kawaida na ya moja kwa moja katika simulizi.
- source_word: λέγουσιν
  choice: wakamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita katika Kiswahili unasomeka kwa kawaida katika mtiririko wa simulizi. Kiambishi ‘-mw-’ kinaonyesha kuwa walimwambia Yesu.
- source_word: ὅτι
  choice: alama za usemi wa moja kwa moja
  rationale: Hapa ὅτι inaanzisha maneno yaliyonukuliwa; alama za kunukuu huwasilisha kazi hiyo kwa Kiswahili cha kawaida bila kuongeza ‘kwamba’.
- source_word: Πάντες
  choice: Kila mtu
  rationale: Katika muktadha huu, wingi ‘wote’ unarejelea kwa namna ya kawaida watu waliokuwa wakimtafuta Yesu. ‘Kila mtu’ ni usemi wa asili na hauhitaji kueleweka kuwa kila mwanadamu bila mipaka ya muktadha.
- source_word: ζητοῦσίν σε
  choice: anakutafuta
  rationale: ζητέω inaweza kumaanisha kutafuta au kujaribu kumpata mtu. Katika simulizi hili watu wanajaribu kujua Yesu alipo, hivyo ‘anakutafuta’ ni ya asili na inafaa muktadha.
- source_word: καὶ … καὶ
  choice: Nao … waka-
  rationale: ‘Nao’ na mfuatano wa vitenzi vya ‘waka-’ huhifadhi muunganiko na mwendo wa haraka wa simulizi la Marko kwa Kiswahili cha kawaida.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: -m- / -mw- / -ku-
  rationale: Viwakilishi hivi vimewasilishwa kwa viambishi vya Kiswahili vinavyoonyesha mtendwa wa ‘kupata,’ anayeelekezewa maneno, na mtendwa wa ‘kutafuta.’
