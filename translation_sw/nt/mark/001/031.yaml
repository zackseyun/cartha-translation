  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: sw
  text: Akamkaribia, akamwinua kwa kumshika mkono; homa ikamwacha, naye akawahudumia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kuwahudumia.” Kitenzi cha Kigiriki kinaweza kueleza tu kwamba aliwahudumia, ingawa muktadha pia unaunga mkono kwamba alianza kuwahudumia mara tu baada ya kuponywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Akamkaribia
  rationale: Kirai hiki cha kitenzi kishirikishi cha aoristi kinaonyesha kwamba Yesu alimwendea kwanza; “akamkaribia” ni ya kawaida na haiongezi maelezo yasiyomo.
- source_word: ἤγειρεν
  choice: akamwinua
  rationale: ἐγείρω hapa inaeleza kumwinua kutoka alipokuwa amelala. “Akamwinua” huhifadhi nguvu ya kitenzi bila kuifanya aya hii kuwa simulizi la ufufuo.
- source_word: κρατήσας τῆς χειρός
  choice: kwa kumshika mkono
  rationale: κρατέω ni kushika au kukamata; muundo wenye χείρ unaonyesha kwamba alimwinua kwa kumshika mkono.
- source_word: ἀφῆκεν αὐτὴν
  choice: ikamwacha
  rationale: Katika muktadha huu ἀφίημι ina maana ya ugonjwa kuondoka kwa mtu; “ikamwacha” ni wazi na ya asili katika Kiswahili.
- source_word: πυρετός
  choice: homa
  rationale: “Homa” ndilo neno la kawaida la Kiswahili kwa πυρετός; muktadha humtambulisha ugonjwa husika bila kuhitaji kiashiria kingine.
- source_word: διηκόνει
  choice: akawahudumia
  rationale: Kitenzi cha wakati usiotimilika kinaweza kueleza tendo lililoendelea au lililoanza katika hatua hii. Tafsiri kuu haiongezi waziwazi “akaanza,” hivyo inalinda utata huo.
- source_word: αὐτοῖς
  choice: wa- katika akawahudumia
  rationale: Kiambishi cha wingi kinaonyesha kwamba aliwahudumia watu waliokuwapo, si Yesu peke yake.
theological_decisions:
- issue: Mwangwi unaowezekana wa ἐγείρω katika lugha ya kufufuka
  choice: akamwinua
  alternative: akamsaidia kuinuka
  rationale: “Akamwinua” huhifadhi uchaguzi wa kitenzi cha Marko na uwezekano wa mwangwi wake, lakini muktadha unabaki kuwa wa uponyaji, si ufufuo.
- issue: Iwapo διηκόνει ina maana ya kuanza kuhudumia
  choice: akawahudumia
  alternative: akaanza kuwahudumia
  rationale: Hali ya kitenzi na muktadha vinaweza kuunga mkono mwanzo wa tendo mara baada ya kuponywa, lakini wazo la “kuanza” halijaelezwa wazi; kwa hiyo limewekwa katika tanbihi badala ya kulazimishwa katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. “Kuwahudumia” hapa ni huduma ya kawaida kwa wageni, bila kuwekewa maana maalumu ya kikanisa.
