base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: sw
  text: Jioni ilipofika, jua lilipozama, watu walikuwa wakimletea wagonjwa wote na wale waliopagawa na pepo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliokuwa chini ya nguvu za pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Jioni ilipofika
  rationale: Ni usemi wa Kiswahili wa kawaida unaohifadhi kishazi huru cha wakati na mpito wa simulizi.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: jua lilipozama
  rationale: Huhifadhi maana ya moja kwa moja ya ὅτε kama “wakati/lilipo” bila kuibadili kimyakimya kuwa “baada ya,” huku Kiswahili kikieleza tukio kwa ufasaha.
- source_word: ἔφερον
  choice: watu walikuwa wakimletea
  rationale: Muundo wa kuendelea unaonyesha tendo lililokuwa likifanyika kwa muda au kurudiwa, kama inavyodokezwa na wakati usiotimilika wa Kigiriki. “Watu” huweka wazi mtenda asiyeainishwa katika muktadha.
- source_word: πρὸς αὐτὸν
  choice: wakimletea
  rationale: Kiambishi -m- na kitenzi “letea” vinaeleza mwendo kuelekea kwake kwa Kiswahili cha asili bila kurudia jina Yesu, ambalo halijarudiwa katika Kigiriki.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: wagonjwa wote
  rationale: Usemi wa Kigiriki una maana ya watu waliokuwa hawajisikii vizuri au wagonjwa; “wagonjwa wote” ni wazi, mfupi, na unahifadhi nguvu ya πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: wale waliopagawa na pepo
  rationale: Huhifadhi wazi rejeo la utendaji wa pepo bila kuufanya kuwa ugonjwa wa kawaida pekee. “Kupagawa na pepo” ni usemi unaoeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμονιζομένους bila kupunguza au kufafanua kupita kiasi hali inayotajwa
  choice: wale waliopagawa na pepo
  alternative: wale waliokuwa chini ya nguvu za pepo
  rationale: Tafsiri kuu inadumisha utendaji halisi wa pepo unaotajwa na maandiko na ni ya kawaida katika Kiswahili. Tanbihi inaonyesha uwezekano mpana wa kueleza kuwa watu hao walikuwa chini ya nguvu za pepo bila kulazimisha maelezo kamili ya hali hiyo.
- issue: Hali ya tendo la ἔφερον
  choice: watu walikuwa wakimletea
  alternative: watu walimletea
  rationale: Muundo wa kuendelea unahifadhi hali ya tendo linaloendelea au linalorudiwa ya kitenzi cha Kigiriki na mtiririko wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi marudio ya vishazi viwili vya wakati katika Kigiriki na kutumia muundo wa kuendelea kwa ἔφερον. Neno “pepo” linaeleweka hapa kuwa viumbe wa kiroho waovu kutokana na muktadha.
