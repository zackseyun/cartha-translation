  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: sw
  text: Mapema sana asubuhi, kulipokuwa bado giza, aliamka, akatoka, akaenda mahali pasipo na watu[a], na huko alikuwa akisali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali palipoachwa na watu,” “mahali pa upweke,” au “mahali pa nyika.” Neno la Kigiriki linaweza kueleza eneo lisilokaliwa na watu, lililoachwa, au lenye hali ya nyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ … λίαν
  choice: Asubuhi na mapema sana
  rationale: Muungano huu unaonyesha wakati wa asubuhi wa mapema mno; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha msisitizo wa λίαν.
- source_word: ἔννυχα
  choice: kulipokuwa bado na giza
  rationale: Kirai hiki kinaonyesha kwamba giza la usiku lilikuwa bado halijaondoka. Tafsiri hii ni wazi na ya asili kuliko kusema kwa namna isiyo ya kawaida kwamba ilikuwa usiku.
- source_word: ἀναστὰς
  choice: aliamka
  rationale: Kitenzi kishirikishi kinatangulia vitendo vikuu na kuonyesha hatua ya kwanza katika mfuatano. ‘Aliamka’ ni usemi wa kawaida na unaofaa katika muktadha huu.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Inahifadhi hatua halisi ya kutoka mahali alipokuwa na kuitofautisha na tendo linalofuata la kwenda mbali.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Inaendeleza mwendo kutoka mahali alipokuwa kwenda eneo jingine. Kutafsiri kando na ἐξῆλθεν kunadumisha mfuatano wa simulizi la Marko.
- source_word: εἰς ἔρημον τόπον
  choice: mahali pasipo na watu
  rationale: ἔρημος hapa inaweza kueleza mahali patupu, palipoachwa, au penye hali kama ya nyika. Usemi huu ni wa kawaida na hauamui kwamba ni lazima pawe eneo rasmi la nyika.
- source_word: κἀκεῖ
  choice: na huko
  rationale: Muungano wa καὶ na ἐκεῖ unaunganisha simulizi na kuelekeza tena kwenye mahali alikokwenda.
- source_word: προσηύχετο
  choice: alikuwa akisali
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha tendo lililokuwa likiendelea; muundo huu wa Kiswahili unadumisha hali hiyo.
theological_decisions:
- issue: Msisitizo wa simulizi kuhusu sala ya Yesu
  choice: Kueleza moja kwa moja kwamba Yesu aliondoka akaenda kusali, bila kuongeza hitimisho la kimafundisho.
  alternative: Kusisitiza kuwa kujitenga kwake ni kielelezo kwa wanafunzi, au kuingiza katika tafsiri maana ya Kikristo kuhusu utegemezi wake katika sala.
  rationale: Aya yenyewe inasimulia wakati, kuondoka kwa Yesu, mahali alikokwenda, na tendo lake la kusali. Maana zaidi za kitheolojia hazipaswi kuingizwa katika maneno ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa Maandiko. Mfuatano ‘aliamka, akatoka, akaenda’ unadumisha hatua tofauti za simulizi, huku ‘alikuwa akisali’ ikionyesha tendo lililoendelea. Alama ya tanbihi imewekwa baada ya kirai kinachoeleza mahali kwa sababu tanbihi inahusu ἔρημον τόπον.
