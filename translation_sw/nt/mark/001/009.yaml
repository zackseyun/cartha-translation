  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: sw
  text: Ikawa siku zile Yesu akaja kutoka Nazareti ya Galilaya, akabatizwa katika Yordani na Yohana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaingia katika Yordani.” Kihusishi cha Kigiriki kinaweza pia kuonyesha mwendo wa kuingia ndani ya Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ikawa
  rationale: Ni mpito wa kawaida wa kisimulizi unaowasilisha tukio jipya kwa Kiswahili cha kibiblia kilicho wazi na chenye hadhi, bila kutumia maneno mazito yasiyo ya lazima.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: siku zile
  rationale: Huhifadhi rejeo la wakati kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἦλθεν
  choice: akaja
  rationale: Hutoa maana ya msingi ya kitenzi cha mwendo bila kuongeza msisitizo wa kufika ambao hauko wazi katika Kigiriki.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: kutoka Nazareti ya Galilaya
  rationale: Huhifadhi muundo wa utambulisho wa mahali kwa Kiswahili cha kawaida na kueleweka.
- source_word: ἐβαπτίσθη
  choice: akabatizwa
  rationale: Huhifadhi kauli ya kutendwa na istilahi pana ya ubatizo bila kuingiza msimamo wa kimadhehebu kuhusu namna yake.
- source_word: εἰς τὸν Ἰορδάνην
  choice: katika Yordani
  rationale: Ni Kiswahili cha kawaida kinachoonyesha mahali pa ubatizo; kihusishi cha Kigiriki εἰς kinaweza pia kusisitiza mwendo wa kuingia, jambo linalowekwa katika tanbihi.
- source_word: ὑπὸ Ἰωάννου
  choice: na Yohana
  rationale: Katika muundo wa kutendwa, “na Yohana” humtambulisha mtendaji kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya βαπτίζω katika muktadha wenye mitazamo tofauti ya kimadhehebu
  choice: akabatizwa
  alternative: akazamishwa
  rationale: “Akabatizwa” huripoti tukio kwa uaminifu bila kuamua kimya kimya namna mahususi ya ubatizo.
- issue: Nguvu ya kihusishi εἰς pamoja na Yordani
  choice: katika Yordani
  alternative: ndani ya Yordani
  rationale: “Katika Yordani” ni ya kawaida na haizidishi wazo la mwendo; tanbihi huhifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “Ikawa siku zile” huhifadhi ladha ya kisimulizi bila kuwa wa kizamani kupita kiasi.
