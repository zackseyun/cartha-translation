source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: sw
  text: Mtu mwenye ukoma[a] akamjia, akimsihi huku akipiga magoti, akamwambia, “Ukitaka, unaweza kunifanya niwe safi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kurejelea ukoma au ugonjwa mwingine mbaya wa ngozi.
    reason: lexical_scope
  - marker: b
    text: Au, “unaweza kunitakasa.” Kusafishwa hapa kunaweza kuhusisha kuondolewa kwa ugonjwa pamoja na unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: mtu mwenye ukoma
  rationale: Muundo unaomtaja mtu kwanza ni wa kawaida na wenye heshima katika Kiswahili cha sasa. Neno la Kigiriki lilitumiwa kwa mtu mwenye ugonjwa wa ngozi unaoitwa ukoma, ingawa matumizi yake ya kale yanaweza kuwa mapana kuliko ugonjwa unaoitwa ukoma leo.
- source_word: παρακαλῶν
  choice: akimsihi
  rationale: Katika muktadha huu kitenzi kinaonyesha ombi la dhati; “akimsihi” ni cha asili na hakiongezi kiwango cha kukata tamaa kisichosemwa wazi katika matini.
- source_word: γονυπετῶν
  choice: huku akipiga magoti
  rationale: Hii huonyesha mkao wa kupiga magoti na kuunganisha kwa ufasaha tendo hilo na kusihi, bila kulifasiri moja kwa moja kuwa ibada.
- source_word: Ἐὰν θέλῃς
  choice: Ukitaka
  rationale: Huhifadhi sharti linalohusu nia au utayari wa Yesu; ni usemi wa kawaida wa Kiswahili na hauashirii kwamba mtu huyo alitilia shaka uwezo wake.
- source_word: δύνασαί
  choice: unaweza
  rationale: Huwasilisha moja kwa moja uwezo unaoelezwa na δύναμαι kwa Kiswahili cha kawaida.
- source_word: καθαρίσαι
  choice: kunifanya niwe safi
  rationale: Huhifadhi lugha ya kuwa safi badala ya kuibadili kuwa “kuniponya” pekee, hivyo maana za kurejeshwa kimwili na kuondolewa unajisi zinaendelea kuwezekana.
- source_word: ἔρχεται
  choice: akamjia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, mfululizo wa vitenzi vya simulizi kwa “aka-” ni njia ya asili ya Kiswahili ya kusimulia tukio hili kwa uhai bila kulazimisha wakati uliopo usio wa kawaida.
theological_decisions:
- issue: Asili ya kusafishwa katika muktadha wa ukoma
  choice: kunifanya niwe safi
  alternative: kuniponya
  rationale: Matini hutumia kitenzi cha kusafisha, si kitenzi cha kawaida cha kuponya. Tafsiri iliyochaguliwa haifungi maana kuwa uponyaji wa mwili tu wala utakaso wa kiibada tu.
- issue: Maana ya kupiga magoti
  choice: huku akipiga magoti
  alternative: akimsujudia
  rationale: Matini hutaja mkao wa mwili. “Akimsujudia” ingeweza kuingiza kwa nguvu zaidi tafsiri ya tendo la ibada kuliko neno lenyewe linavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “aka-” unatoa mtiririko wa simulizi; “mtu mwenye ukoma” hutanguliza utu wa mhusika. Viwakilishi vimehifadhiwa bila kuongeza jina la Yesu ambalo halimo katika mstari huu wa Kigiriki.
