lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Alipoendelea mbele kidogo
  rationale: Muundo huu wa wakati unaonyesha kwamba Yesu alisonga mbele umbali mfupi kabla ya kuwaona wale ndugu, kwa Kiswahili cha kawaida na cha simulizi.
- source_word: εἶδεν
  choice: akawaona
  rationale: Kitenzi hiki ni tendo rahisi la kuona. Kiambishi cha wingi kinafaa kwa sababu Yakobo na Yohana wote wawili ndio walioonekana.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Yakobo mwana wa Zebedayo
  rationale: Muundo wa Kigiriki unamtambulisha Yakobo kwa kumtaja baba yake; huu ndio usemi wa kawaida wa Kiswahili.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Yohana ndugu yake
  rationale: Kiwakilishi kinaelekea kumrejelea Yakobo, hivyo usemi huu unaonyesha uhusiano wao bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: ἐν τῷ πλοίῳ
  choice: ndani ya mashua
  rationale: Neno lenye kibainishi linarejelea mashua maalumu waliyokuwamo katika tukio hili.
- source_word: καταρτίζοντας
  choice: wakizitengeneza
  rationale: Katika muktadha wa uvuvi, neno hili linaweza kueleza kuzirekebisha au kuziweka nyavu katika hali inayofaa. “Kuzitengeneza” ni la kawaida na linahifadhi upana huo wa maana.
- source_word: τὰ δίκτυα
  choice: nyavu
  rationale: Hizi ni nyavu za kuvulia samaki. Kiswahili hakihitaji kiwakilishi cha umilikaji hapa, kwa kuwa muktadha unaonyesha ni nyavu walizokuwa wakishughulikia.
- source_word: καὶ αὐτούς
  choice: Nao pia
  rationale: Usemi huu unaunganisha tukio na lile la waliotangulia na kuonyesha kuwa Yakobo na Yohana pia walikuwa mashuani.
