  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: sw
  text: Baada ya Yohana kukabidhiwa[a], Yesu alikuja Galilaya, akitangaza habari njema[b] ya Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya Yohana kukamatwa.” Kigiriki kinasema kwa maana ya karibu zaidi, “baada ya Yohana kukabidhiwa,” usemi unaotoa mwangwi wa lugha inayotumiwa baadaye katika Marko kuhusu mateso.
    reason: lexical_alternative
  - marker: b
    text: Au, “injili.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “ya Mungu” yanaweza kumaanisha habari njema inayotoka kwa Mungu, iliyo yake, au inayomhusu na kumweka yeye katikati.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: baada ya ... kukabidhiwa
  rationale: Muundo huu unaonyesha wakati, yaani ‘baada ya.’ ‘Kukabidhiwa’ huhifadhi maana pana ya kuachwa au kutiwa mikononi mwa wengine, pamoja na mwangwi wa msamiati unaotumiwa baadaye katika Marko kuhusu mateso ya Yesu; ‘kukamatwa’ ingekuwa fasiri mahususi zaidi.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina Ἰωάννης katika Kiswahili cha Biblia.
- source_word: ἦλθεν
  choice: alikuja
  rationale: Kitenzi hiki huonyesha kuja; ‘alifika’ kingesisitiza mwisho wa safari kuliko neno la Kigiriki.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: Katika Kiswahili, ‘alikuja Galilaya’ huonyesha mwendo kuelekea eneo hilo kwa njia ya kawaida bila kuhitaji kihusishi cha ziada.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: Neno hili lina maana ya kutoa tangazo hadharani. ‘Akitangaza’ ni la kawaida na pana kuliko ‘akihubiri,’ ambalo linaweza kueleweka hasa kama kutoa mahubiri.
- source_word: εὐαγγέλιον
  choice: habari njema
  rationale: ‘Habari njema’ huwasilisha moja kwa moja maana ya εὐαγγέλιον kwa msomaji wa kisasa, huku ‘injili’ ikibaki kama istilahi mbadala ya kimapokeo.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: 'Muundo ‘ya Mungu’ huhifadhi upana wa hali ya umilikishi katika Kigiriki: habari hiyo inaweza kueleweka kuwa inatoka kwa Mungu, ni yake, au inamhusu na kumweka yeye katikati.'
theological_decisions:
- issue: Maana ya παραδοθῆναι na uhusiano wake na msamiati wa mateso katika Marko
  choice: kukabidhiwa
  alternative: kukamatwa
  rationale: ‘Kukabidhiwa’ huhifadhi kiungo cha kimatamshi na kisimulizi na sehemu za baadaye ambako watu wanatiwa mikononi mwa wengine, bila kuongeza wazi tendo la kukamatwa ambalo halikutajwa moja kwa moja.
- issue: Nguvu ya hali ya umilikishi katika τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: habari njema ya Mungu
  alternative: habari njema kutoka kwa Mungu; habari njema kuhusu Mungu
  rationale: Kigiriki kinaweza kuruhusu maana hizi zinazohusiana. ‘Ya Mungu’ haichagui maana moja na hivyo huhifadhi utata halisi wa usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kwa usomaji wa kawaida; ‘kukabidhiwa’ na ‘ya Mungu’ zimeachwa zikiwa pana ili kutatua kwa lazima maana ambazo Kigiriki hakizibani.
