id: MRK.1.3
reference: Mark 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: sw
  text: Sauti ya mtu anayepaza sauti nyikani:[a] “Itayarisheni njia ya Bwana;[b] nyosheni mapito yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuweka alama za uandishi za nukuu ya Isaya kwa namna nyingine: “Sauti ya mtu anayepaza sauti: ‘Nyikani itayarisheni njia ya Bwana …’”'
    reason: alternative_reading
  - marker: b
    text: ‘Bwana’ limetafsiri neno la Kigiriki kyriou; nukuu hii inarejelea Isaya 40:3, ambapo Kiebrania humrejelea BWANA (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Sauti
  rationale: Neno φωνή hapa linamaanisha sauti inayotangaza ujumbe. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na ‘a/the’.
- source_word: βοῶντος
  choice: ya mtu anayepaza sauti
  rationale: Kirai hiki kinaonyesha mtu anayetoa mwito kwa nguvu; ‘anayepaza sauti’ huhifadhi uzito wa tangazo kuliko ‘anayeita’.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: ‘Nyikani’ ni neno la kawaida na lenye hadhi kwa eneo lisilokaliwa, na linaendana na mazingira ya Yohana katika Marko.
- source_word: Ἑτοιμάσατε
  choice: Itayarisheni
  rationale: Amri ya wingi imetafsiriwa moja kwa moja kwa umbo la Kiswahili linalowahusu watu wengi.
- source_word: τὴν ὁδὸν
  choice: njia
  rationale: ‘Njia’ huhifadhi picha halisi ya barabara au njia pamoja na maana yake ya kinabii na ya mfano.
- source_word: κυρίου
  choice: ya Bwana
  rationale: Muundo wa umilikaji unafuata maana ya Kigiriki ‘njia ya Bwana’ bila kuibadili kuwa ‘njia kwa ajili ya Bwana’.
- source_word: εὐθείας ποιεῖτε
  choice: nyosheni
  rationale: Katika Kiswahili, ‘nyosheni’ huwasilisha kwa kawaida amri ya kufanya mapito yawe manyoofu, bila usemi mzito wa ‘yafanyeni kuwa manyoofu’.
- source_word: τὰς τρίβους αὐτοῦ
  choice: mapito yake
  rationale: ‘Mapito’ huhifadhi wingi na picha ya vijia au njia anazopitia; ‘yake’ humrejelea Bwana.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Isaya ambayo katika Kiebrania humrejelea YHWH
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi makuu yanafuata κύριος ya Kigiriki kwa ‘Bwana.’ Uhusiano wa nukuu hiyo na jina YHWH katika Isaya umeelezwa katika tanbihi bila kuingiza umbo la Kiebrania moja kwa moja katika maandishi ya Kigiriki.
- issue: Mahali pa kuunganisha kirai ‘nyikani’
  choice: Kimeunganishwa na mtu anayepaza sauti
  alternative: Kimeunganishwa na amri ya kutayarisha njia ya Bwana
  rationale: Mpangilio wa maneno katika Marko unasomeka kwa kawaida kama ‘mtu anayepaza sauti nyikani.’ Hata hivyo, uwekaji tofauti wa alama za uandishi katika nukuu ya Isaya unawezekana, kwa hiyo umedumishwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Amri za wingi ‘Itayarisheni’ na ‘nyosheni’ zimehifadhiwa, na istilahi ‘nyikani,’ ‘njia,’ na ‘mapito’ zinadumisha taswira ya kinabii bila kuwa za kizamani kupita kiasi.
