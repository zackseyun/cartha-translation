  text: And the whole city was gathered at the door[a].
translation:
  language: sw
  text: Na mji wote ulikuwa umekusanyika mlangoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mlango” au “kuelekea mlangoni.” Kihusishi cha Kigiriki kinaweza kueleza mwelekeo kuelekea mlango; hapa, katika maelezo ya hali iliyokuwapo, kinaonyesha watu waliokusanyika penye mlango wa nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: ulikuwa
  rationale: Kitenzi cha wakati usiotimilika pamoja na ἐπισυνηγμένη kinaeleza hali iliyokuwa ikiendelea; “ulikuwa umekusanyika” huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ὅλη ἡ πόλις
  choice: mji wote
  rationale: Huhifadhi usemi wenye msisitizo wa Kigiriki bila kuupunguza kuwa “watu wengi wa mjini”; katika muktadha huu “mji” huwakilisha wakazi wake.
- source_word: ἐπισυνηγμένη
  choice: umekusanyika
  rationale: Kitenzi hiki humaanisha kukusanyika pamoja. “Umekusanyika” ni cha kawaida na hakiongezi wazo la msongamano ambalo halijaelezwa moja kwa moja.
- source_word: πρὸς τὴν θύραν
  choice: mlangoni
  rationale: Ingawa πρός pamoja na hali ya kushutumu yaweza kumaanisha kuelekea mahali, hali inayoelezwa hapa inaonyesha kusanyiko lililokuwa kwenye mlango wa nyumba; “mlangoni” ni tafsiri asilia na fupi.
- source_word: θύραν
  choice: mlango
  rationale: θύρα humaanisha mlango na hapa inarejelea sehemu ya kuingilia nyumbani.
