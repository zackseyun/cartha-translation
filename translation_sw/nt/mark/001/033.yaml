translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “mji wote” umehifadhiwa kama taswira yenye msisitizo, huku “mlangoni” ikifanya sentensi iwe ya asili bila kufuta uwezekano wa maana ya kuelekea, ambao umeonyeshwa katika tanbihi.
