translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao wakaingia” hudumisha mwendelezo wa simulizi, na “sinagogi” ni istilahi iliyozoeleka na inayoeleweka kwa wasomaji wa kawaida.
