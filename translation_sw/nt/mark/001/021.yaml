  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: sw
  text: Nao wakaingia[a] Kapernaumu. Mara moja, siku ya Sabato[b], alikuwa akifundisha[c] katika sinagogi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaingia Kapernaumu.” Marko hutumia mara nyingi wakati uliopo wa kihistoria ili kufanya masimulizi yawe na uhai.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “siku za Sabato”; huu ni usemi unaoweza kumaanisha “siku ya Sabato.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akaanza kufundisha” au “alifundisha.” Wakati usiotimilika wa Kigiriki unaweza kusisitiza tendo lililokuwa likiendelea au, katika muktadha fulani, mwanzo wa tendo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: wakaingia
  rationale: Ni wakati uliopo wa kihistoria unaotumiwa sana na Marko katika masimulizi yenye uhai. Kiswahili cha masimulizi kwa kawaida hutumia wakati uliopita; “wakaingia” pia huhifadhi wazo la mwendo wa kuingia ndani.
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Hili ni umbo la Kiswahili linalotambulika kwa jina la mahali hapo.
- source_word: εὐθύς
  choice: mara moja
  rationale: Huhifadhi maana ya kutendeka bila kuchelewa na kasi ya masimulizi ya Marko kwa lugha ya kawaida ya sasa.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa neno la Kigiriki liko katika wingi, hapa ni usemi wa wakati unaoeleweka kiasili kuwa Sabato moja katika muktadha huu.
- source_word: ἐδίδασκεν
  choice: akaanza kufundisha
  rationale: Wakati usiotimilika wa Kigiriki unaweza kueleza tendo linaloendelea au kuanza kwa tendo. Katika mfuatano wa kuingia, kisha mara moja kufundisha, maana ya kuanza ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: συναγωγήν
  choice: sinagogi
  rationale: Katika mazingira haya ya Kiyahudi, neno hilo linamaanisha mahali pa ibada na kusanyiko la Wayahudi, si kusanyiko la kawaida tu.
