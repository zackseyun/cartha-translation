base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: sw
  text: Habari zake zikaenea mara moja kila mahali katika eneo lote la kandokando ya Galilaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taarifa kumhusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zikaenea
  rationale: Katika muktadha wa habari inayosambaa, kitenzi hiki kinatafsiriwa kwa Kiswahili cha kawaida kuwa “zikaenea.” Hii inawasilisha mwendo wa habari kwenda nje bila kutumia muundo mgumu wa “zilitoka.”
- source_word: ἡ ἀκοὴ αὐτοῦ
  choice: habari zake
  rationale: ἀκοή hapa ni kile kinachosikiwa, yaani habari au taarifa. “Habari zake” kwa kawaida humaanisha habari kumhusu, wala si habari alizomiliki au alizotoa.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Huhifadhi msisitizo wa Marko kuhusu kutokea kwa jambo bila kuchelewa.
- source_word: πανταχοῦ
  choice: kila mahali
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wazo la “kote/kila mahali.”
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: katika eneo lote la Galilaya
  rationale: “Katika” ni Kiswahili cha kawaida kwa kuenea kwa habari ndani ya eneo fulani; “eneo lote la Galilaya” huhifadhi upeo kamili wa kifungu bila kudokeza kwa lazima eneo lililo nje ya Galilaya.
theological_decisions:
- issue: Maana ya ἀκοὴ αὐτοῦ
  choice: habari zake
  alternative: umaarufu wake
  rationale: Kifungu kinaeleza kusambaa kwa yale yaliyosikiwa kumhusu Yesu. “Umaarufu wake” ingeongeza wazo la sifa au hadhi ya mtu mashuhuri kuliko nomino yenyewe inavyolazimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Habari zake zikaenea” ni wa kawaida, wazi, na unaendeleza mtiririko wa simulizi.
