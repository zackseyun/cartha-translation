  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: sw
  text: Nao walishangazwa sana na mafundisho yake, kwa maana alikuwa akiwafundisha kama mtu mwenye mamlaka, wala si kama waandishi wa sheria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: walishangazwa sana
  rationale: Kitenzi hiki kinaonyesha mshangao mkubwa, na hali ya wakati usiotimilika inadokeza mwitikio uliokuwa ukiendelea wakati wa mafundisho.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: na mafundisho yake
  rationale: Katika Kiswahili, ‘kushangazwa na’ ni njia ya kawaida ya kueleza kilichosababisha mshangao; ‘mafundisho’ yanaweza kumaanisha yaliyofundishwa pamoja na namna ya kufundisha katika muktadha huu.
- source_word: ἦν γὰρ διδάσκων
  choice: kwa maana alikuwa akiwafundisha
  rationale: Muundo ‘alikuwa akiwafundisha’ unahifadhi tendo linaloendelea linaloonyeshwa na ἦν pamoja na kitenzi-shiriki.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: kama mtu mwenye mamlaka
  rationale: Tafsiri hii inahifadhi ulinganisho wa ὡς na maana ya ἐξουσία kuwa mamlaka au haki ya kutenda, bila kufafanua chanzo chake.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika mazingira haya, neno linawarejelea wataalamu wa Kiyahudi walioandika, kufasiri na kufundisha Sheria; ‘waandishi wa sheria’ ni wazi zaidi kwa msomaji wa kawaida kuliko ‘waandishi’ peke yake.
theological_decisions:
- issue: Asili ya mamlaka ya Yesu ikilinganishwa na waandishi wa sheria
  choice: Kueleza kwamba Yesu alifundisha kama mtu mwenye mamlaka bila kuongeza chanzo au aina ya mamlaka hiyo.
  alternative: ‘Kwa mamlaka ya Mungu’ au ‘kwa mamlaka ya kimungu.’
  rationale: Aya inasisitiza tofauti kati ya namna Yesu alivyofundisha na waandishi wa sheria, lakini katika sentensi hii haisemi wazi kwamba mamlaka hiyo ni ya kimungu wala haifafanui chanzo chake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ huendeleza simulizi kwa kawaida; ‘walishangazwa sana’ hudumisha nguvu ya mshangao. Hakuna tanbihi iliyohitajika kwa kuwa ‘kama mtu mwenye mamlaka’ huhifadhi muundo na utata halisi wa Kigiriki.
