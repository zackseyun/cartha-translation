lexical_decisions:
- source_word: καὶ
  choice: Kisha
  rationale: Kiunganishi kinaendeleza simulizi. “Kisha” ni cha asili katika Kiswahili na kinafaa kwa mwendelezo wa matukio, ingawa neno la Kigiriki lenyewe ni kiunganishi rahisi.
- source_word: ἐμβριμησάμενος
  choice: baada ya kumwonya kwa ukali
  rationale: Kitenzi kinaonyesha hisia na msisitizo mkali, na katika muktadha huu kinaelekea kuwa onyo au agizo kali. Tafsiri hii inadumisha nguvu hiyo bila kudokeza wazi kwamba Yesu alimlaumu mtu huyo.
- source_word: αὐτῷ
  choice: -m- katika “kumwonya”
  rationale: Kiwakilishi cha dative kinamrejelea mtu aliyeponywa; katika Kiswahili kinaonyeshwa kiasili kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: εὐθύς
  choice: mara moja
  rationale: Huhifadhi kasi na hali ya jambo kutendeka bila kuchelewa, sifa inayojirudia katika simulizi la Marko.
- source_word: ἐξέβαλεν
  choice: akamfukuza aende zake
  rationale: ἐκβάλλω ni kali kuliko “kumruhusu aondoke” au “kumtuma.” “Kumfukuza aende zake” hudumisha nguvu ya kitendo huku ikieleweka katika muktadha wa kumwondoa mtu mahali hapo, si kutoa pepo.
- source_word: αὐτόν
  choice: -m- katika “akamfukuza”
  rationale: Kiwakilishi cha accusative kinamrejelea mtu yuleyule na kinaonyeshwa kwa kiambishi cha yambwa katika kitenzi cha Kiswahili.
theological_decisions:
- issue: Ukali wa maneno na kitendo cha Yesu kwa mtu aliyeponywa
  choice: Yesu alimwonya kwa ukali na akamwondoa kwa nguvu, bila tafsiri kusema kwamba alikuwa na hasira ya dhambi au uadui dhidi yake.
  alternative: Yesu alimpa tu maagizo thabiti yasiyo na hisia kali; au alimkemea mtu huyo binafsi.
  rationale: Maneno ἐμβριμησάμενος na ἐξέβαλεν yote yana nguvu isiyo ya kawaida. Tafsiri inadumisha mvutano huo bila kuamua sababu ya ndani ya ukali wa Yesu wala kuingiza hukumu ya kitheolojia isiyosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamfukuza aende zake” ni wa kawaida na unaweka wazi kwamba mtu huyo aliondolewa kwa msisitizo; tanbihi inadumisha uwezekano wa maana iliyo kali zaidi.
