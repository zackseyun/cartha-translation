base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: sw
  text: 'Sauti ikaja kutoka katika mbingu[a]: “Wewe ni Mwanangu mpendwa; nimependezwa nawe[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka mbinguni.” Kigiriki kina umbo la wingi, “kutoka katika mbingu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nimefurahi nawe” au “nimeona radhi nawe.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Sauti ikaja
  rationale: Muundo huu unaeleza kutokea kwa sauti katika simulizi. “Sauti ikaja” ni Kiswahili cha kawaida na huhifadhi mwendo wa kisimulizi bila tafsiri isiyo ya kawaida kama “sauti ikatokea kuwa.”
- source_word: ἐκ τῶν οὐρανῶν
  choice: kutoka katika mbingu
  rationale: Tafsiri hii huhifadhi wazo la chanzo linaloonyeshwa na ἐκ na neno la Kigiriki lililo katika wingi. “Mbingu” ni neno la kawaida katika Kiswahili, ingawa umbo lake lenyewe halitofautishi wazi umoja na wingi.
- source_word: Σὺ εἶ
  choice: Wewe ni
  rationale: Kiwakilishi cha wazi “Wewe” huhifadhi msisitizo na uelekevu wa tamko la Kigiriki.
- source_word: ὁ υἱός μου
  choice: Mwanangu
  rationale: “Mwanangu” ni njia ya asili na ya moja kwa moja ya kusema “Mwana wangu” katika usemi wa kumwambia mtu. Herufi kubwa inaashiria matumizi haya mahususi kumhusu Yesu bila kuongeza istilahi ya baadaye ya kiteolojia.
- source_word: ὁ ἀγαπητός
  choice: mpendwa
  rationale: “Mpendwa” huwasilisha kwa ufupi maana ya anayependwa sana na huhifadhi uzito wa tamko la Mungu.
- source_word: ἐν σοὶ
  choice: nawe
  rationale: Katika muunganiko huu na εὐδόκησα, “nimependezwa nawe” ni Kiswahili cha asili kinachoeleza kwamba Mungu amependezwa na Mwana. Tafsiri ya kimuundo “ndani yako” ingesikika isiyo ya kawaida na ingeweza kupotosha maana.
- source_word: εὐδόκησα
  choice: nimependezwa
  rationale: Wakati timilifu wa Kiswahili huwasilisha kitendo kilichotimia chenye matokeo yanayoendelea katika tamko hili. Pia huhifadhi maana ya kukubali kwa furaha au kuridhika.
theological_decisions:
- issue: Kuhifadhi nguvu ya tamko la Mungu kwa Yesu bila kuongeza maelezo ya kimadhehebu
  choice: Mwanangu mpendwa
  alternative: Mwanangu, Mpendwa
  rationale: Maneno haya huhifadhi kwa pamoja utambulisho wa Mwana na upendo wa Mungu, bila kuingiza istilahi za kiteolojia ambazo hazimo wazi katika mstari.
- issue: Jinsi ya kuwasilisha wingi wa οὐρανῶν
  choice: kutoka katika mbingu
  alternative: kutoka mbinguni
  rationale: Chaguo kuu linabaki karibu na umbo la chanzo. Kwa kuwa Kiswahili mara nyingi hutumia “mbinguni” kwa maana ileile bila kuonyesha wazi idadi, chaguo hilo la kawaida limetajwa katika tanbihi.
- issue: Jinsi ya kuwasilisha ἐν σοὶ εὐδόκησα bila kulazimisha maana moja kupita kiasi
  choice: nimependezwa nawe
  alternative: nimefurahia wewe / nimepata furaha kwako
  rationale: Chaguo kuu ni la asili katika Kiswahili na huhifadhi ridhaa yenye furaha. Tanbihi inaonyesha kwamba kitenzi kinaweza pia kusisitiza kufurahia au kupata furaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Tamko la moja kwa moja limehifadhiwa kwa mtindo mfupi na wenye uzito.
