  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: sw
  text: Lakini yule mtu alipoondoka, alianza kutangaza sana na kueneza habari hiyo, hata Yesu hakuweza tena kuingia katika mji waziwazi, bali alikaa nje katika maeneo yasiyokuwa na watu; nao watu waliendelea kumjia kutoka kila mahali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: kutangaza sana
  rationale: Huhifadhi wazo la kutangaza kwa kiwango kikubwa bila kuongeza kihusishi kisichotajwa wazi katika Kigiriki.
- source_word: διαφημίζειν τὸν λόγον
  choice: kueneza habari hiyo
  rationale: Katika muktadha huu τὸν λόγον ni habari au taarifa kuhusu yaliyotokea, si lazima ‘Neno’ kwa maana ya kiteolojia.
- source_word: φανερῶς
  choice: waziwazi
  rationale: Huonyesha kuingia hadharani au bila kujificha.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: mahali pasipo na watu
  rationale: ἐρήμοις humaanisha maeneo ya upweke au yasiyokaliwa, si lazima jangwa kavu.
- source_word: πάντοθεν
  choice: kutoka kila upande
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kutoka pande zote/kila mahali.
theological_decisions:
- issue: Mhusika wa αὐτὸν katika ‘hakuweza tena’
  choice: Yesu
  alternative: yeye
  rationale: Ingawa kiwakilishi cha Kigiriki kinaweza kutafsiriwa ‘yeye,’ muktadha unaonyesha wazi kuwa ni Yesu; kutaja jina huondoa utata wa kisarufi wa Kiswahili bila kubadili maana.
- issue: Kitu kilichotangazwa
  choice: kutangaza sana
  alternative: kuitangaza sana habari hiyo
  rationale: Kigiriki hakitaji yambwa baada ya κηρύσσειν; tafsiri haiongezi kwa lazima kama alikuwa akimtangaza Yesu, uponyaji, au habari nyingine, hivyo inadumisha kiwango fulani cha kutotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mahali pasipo na watu’ ni cha kawaida na sahihi zaidi kimuktadha kuliko ‘jangwani.’
