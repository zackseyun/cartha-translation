source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: sw
  text: Nao wote wakastaajabu, hata wakajadiliana wao kwa wao, wakisema, “Hii ni nini? Fundisho jipya lenye mamlaka![a] Anaamuru hata roho wachafu, nao wanamtii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ni nini? Ni fundisho gani hili jipya lenye mamlaka?” Kigiriki kinaweza kuwekewa alama za uakifishaji zinazounganisha “fundisho jipya” moja kwa moja zaidi na swali.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: wakastaajabu
  rationale: Kitenzi hiki huonyesha kushikwa na mshangao mkubwa; ‘wakastaajabu’ ni Kiswahili cha kawaida, chenye hadhi, bila kuzidisha nguvu ya neno.
- source_word: ἅπαντες
  choice: wote
  rationale: Huhifadhi msisitizo kwamba kila mmoja katika kundi hilo alipatwa na mshangao.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: hata wakajadiliana wao kwa wao
  rationale: ‘Hata’ huonyesha matokeo, na ‘wakajadiliana wao kwa wao’ huwasilisha mazungumzo ya pande zote bila kuyafanya lazima yawe mabishano makali.
- source_word: Τί ἐστιν τοῦτο;
  choice: Hii ni nini?
  rationale: Ni swali la moja kwa moja linalohifadhi mshangao na muundo wa Kigiriki.
- source_word: διδαχὴ καινή
  choice: Fundisho jipya
  rationale: ‘Fundisho’ ni la kawaida na linaloeleweka kuliko istilahi ya kitaalamu zaidi kama ‘doktrini’.
- source_word: κατ’ ἐξουσίαν
  choice: lenye mamlaka
  rationale: Huhifadhi wazo la fundisho linaloambatana na mamlaka, huku muktadha unaofuata ukionyesha mamlaka hiyo katika kuamuru roho.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: roho wachafu
  rationale: Huhifadhi istilahi ya kibiblia ya uchafu badala ya kuipunguza kuwa ‘wasio safi’ au kuifasiri moja kwa moja kuwa pepo.
- source_word: ἐπιτάσσει
  choice: anaamuru
  rationale: Huonyesha agizo lenye mamlaka na kuendeleza mada ya mamlaka katika mstari huu.
- source_word: ὑπακούουσιν αὐτῷ
  choice: wanamtii
  rationale: Hutoa maana wazi ya kuitikia amri kwa utii.
theological_decisions:
- issue: Uhusiano wa ‘kwa mamlaka’ na muundo wa sentensi
  choice: “Fundisho jipya lenye mamlaka!” kama mshangao unaolitathmini fundisho na pia kuandaa maelezo ya mamlaka ya Yesu juu ya roho wachafu.
  alternative: “Hii ni nini? Fundisho gani hili jipya lenye mamlaka?” au kuunganisha ‘kwa mamlaka’ hasa na kitenzi ‘anaamuru’.
  rationale: Sintaksia na uwekaji wa alama za uandishi katika Kigiriki huruhusu zaidi ya uhusiano mmoja. Tafsiri kuu ni ya asili kwa Kiswahili, na tanbihi huhifadhi uwezekano wa muundo wa swali bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakajadiliana wao kwa wao’ ni cha kawaida na hakidokezi uhasama usiokuwapo wazi katika chanzo; ‘roho wachafu’ huhifadhi istilahi ya chanzo.
