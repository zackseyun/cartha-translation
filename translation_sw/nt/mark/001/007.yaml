base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: sw
  text: Naye alikuwa akitangaza, akisema, “Yeye aliye na nguvu kuliko mimi anakuja baada yangu; mimi sistahili kuinama na kufungua kamba ya viatu vyake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi sifai kuinama na kufungua kamba ya viatu vyake,” au “mimi sitoshi kufanya hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: alikuwa akitangaza
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea au kurudiwa; ‘kutangaza’ huhifadhi wazo la kutangaza hadharani bila kulifanya neno hilo kuwa la kikanisa kupita kiasi.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha kwa kawaida maneno yaliyonukuliwa na kuendelea kwa urahisi baada ya ‘alikuwa akitangaza’.
- source_word: Ἔρχεται
  choice: Anakuja
  rationale: Wakati wa sasa huleta uhai na ukaribu wa kuja kwake.
- source_word: ὁ ἰσχυρότερός μου
  choice: yeye aliye na nguvu kuliko mimi
  rationale: Kivumishi cha kulinganisha kilichotumiwa kama nomino kinaelezwa kwa Kiswahili cha kawaida bila kuongeza cheo kisichotajwa.
- source_word: ὀπίσω μου
  choice: baada yangu
  rationale: Katika muktadha huu hufikisha maana ya kufuata kwa wakati na pia wazo la kuja nyuma ya Yohana.
- source_word: ἱκανὸς
  choice: sistahili
  rationale: Katika kauli hii neno linaonyesha kutokustahili mbele ya yule anayekuja, si ukosefu wa uwezo wa kimwili tu.
- source_word: κύψας
  choice: kuinama
  rationale: Hufikisha tendo la kujishusha chini linalotangulia na kuandamana na kufungua kamba.
- source_word: λῦσαι
  choice: kufungua
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kufungua kamba iliyofunga kiatu.
- source_word: ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: kamba ya viatu vyake
  rationale: ‘Kamba’ hueleza mkanda wa ngozi uliofunga kiatu; ‘viatu’ ni neno la kawaida na hapa linaeleweka kwa muktadha wa viatu vya zamani.
theological_decisions:
- issue: Kiwango cha unyenyekevu katika kauli ya Yohana
  choice: mimi sistahili hata kuinama na kufungua
  alternative: mimi sifai / sitoshi kuinama na kufungua
  rationale: ‘Sistahili’ huonyesha tofauti ya hadhi na unyenyekevu mkubwa wa Yohana mbele ya anayekuja, huku tanbihi ikihifadhi uwezekano wa maana ya kutofaa au kutotosha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa msomaji huku hali endelevu ya ἐκήρυσσεν na unyenyekevu wa ἱκανός vikihifadhiwa. Neno ‘hata’ limewekwa ili kufanya uzito wa kutostahili uwe wa kawaida katika Kiswahili; haliongezi dai la kiteolojia.
