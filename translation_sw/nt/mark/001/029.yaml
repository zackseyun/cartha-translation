  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo wa “Mara ... wakaenda” unadumisha kasi ya masimulizi ya Marko bila kutumia lugha ya kizamani.
