  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: sw
  text: Mara tu walipotoka katika sinagogi, wakaingia katika nyumba ya Simoni na Andrea, pamoja na Yakobo na Yohana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara
  rationale: Katika masimulizi ya Marko, neno hili huonyesha mwendo wa haraka wa matukio. “Mara” ni la asili katika Kiswahili na linadumisha hisia ya jambo kufuata bila kuchelewa.
- source_word: ἐκ τῆς συναγωγῆς
  choice: walipotoka katika sinagogi
  rationale: ἐκ huonyesha kutoka ndani ya mahali; pamoja na ἐξελθόντες, kirai hiki kinaeleza kuondoka kwao ndani ya sinagogi.
- source_word: ἐξελθόντες ἦλθον
  choice: walipotoka ... wakaenda
  rationale: 'Muundo huu unahifadhi mfuatano wa vitendo: kwanza walitoka, kisha wakaelekea nyumbani. “Wakaenda” ni ya asili kwa mtazamo wa msimulizi wa Kiswahili.'
- source_word: εἰς τὴν οἰκίαν
  choice: nyumbani
  rationale: εἰς huonyesha mwendo kuelekea au kuingia mahali, na οἰκία ni makao. Katika muktadha huu, “wakaenda nyumbani kwa” ni Kiswahili cha kawaida kinachoeleza mahali walipoelekea.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: kwa Simoni na Andrea
  rationale: Majina katika hali ya umilikishi yanaonyesha kwamba nyumba hiyo ilikuwa makao ya Simoni na Andrea; “nyumbani kwa” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: pamoja na Yakobo na Yohana
  rationale: μετά pamoja na hali ya genitivi huonyesha ushirika au kuandamana; “pamoja na” ni tafsiri ya moja kwa moja na ya asili.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simoni / Andrea / Yakobo / Yohana
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions: []
