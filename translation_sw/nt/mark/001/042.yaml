  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: sw
  text: Mara moja ukoma ukamtoka, naye akatakaswa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa safi.” Kitenzi hiki pia huweza kumaanisha utakaso wa kiibada, si kupona kimwili tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Huwasilisha uharaka unaosisitizwa mara nyingi katika Injili ya Marko kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: ukamwondoka
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba ugonjwa uliondoka kwake, huku ukihifadhi maana ya kitenzi na kirai cha Kigiriki.
- source_word: ἡ λέπρα
  choice: ukoma
  rationale: Hili ndilo neno fupi lililozoeleka katika tafsiri za Biblia. Katika matumizi ya kibiblia linaweza kujumuisha magonjwa ya ngozi yaliyo mapana kuliko ugonjwa unaoitwa ukoma katika tiba ya kisasa.
- source_word: ἐκαθαρίσθη
  choice: akatakaswa
  rationale: 'Huhifadhi hali ya kutendwa ya kitenzi na maana zake mbili katika muktadha huu: kuondolewa ugonjwa na kuondolewa unajisi wa kidini.'
theological_decisions:
- issue: Uhusiano kati ya kupona kimwili na utakaso wa kidini katika ἐκαθαρίσθη
  choice: akatakaswa
  alternative: akaponywa; akawa safi
  rationale: “Akatakaswa” haifanyi maana kuwa kupona kimwili tu, bali inadumisha pia wazo la kuondolewa unajisi linalohusiana na ukoma katika mazingira ya kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Mara moja” inadumisha mwendo wa haraka wa simulizi la Marko, na “akatakaswa” inadumisha mvutano wa kimakusudi kati ya uponyaji na utakaso.
