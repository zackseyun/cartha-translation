  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: sw
  text: 'Kama ilivyoandikwa katika kitabu cha nabii Isaya[a]: “Tazama, ninamtuma mjumbe wangu mbele yako[b], ambaye ataitayarisha njia yako.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “katika manabii” badala ya “katika kitabu cha nabii Isaya.”
    reason: textual_variant
  - marker: b
    text: Au “akitangulia mbele yako.” Kwa maana halisi, “mbele ya uso wako.”
    reason: lexical_alternative
  - marker: c
    text: Maneno ya nukuu hii yanatoka Malaki 3:1; nukuu inayofuata, katika aya ya 3, yatoka Isaya 40:3.
    reason: cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: Kama
  rationale: Hutanguliza ulinganifu na yaliyoandikwa; ni Kiswahili cha kawaida kinachohifadhi nguvu ya kiunganishi cha Kigiriki.
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Huhifadhi kauli ya kawaida ya kunukuu Maandiko na hali ya maandishi yanayoendelea kuwapo.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: katika kitabu cha nabii Isaya
  rationale: Kiswahili huhitaji mara nyingi kutaja ‘kitabu’ ili kauli ya mahali pa nukuu iwe wazi na ya kawaida; bado humtaja Isaya kuwa nabii kama katika Kigiriki.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi mwito wa kinabii wa kuelekeza usikivu na hadhi ya nukuu.
- source_word: ἀποστέλλω
  choice: ninamtuma
  rationale: Wakati wa sasa wa Kigiriki umetolewa kwa wakati wa sasa wa Kiswahili, huku kiambishi cha yambwa kikirejelea mjumbe aliye mtu.
- source_word: ἄγγελόν
  choice: mjumbe
  rationale: Maana ya msingi hapa ni mtu aliyetumwa kutangulia, si lazima kiumbe wa mbinguni.
- source_word: πρὸ προσώπου σου
  choice: mbele yako
  rationale: Ni nahau ya asili ya Kiswahili inayohifadhi maana ya kuwa mbele au kutangulia bila tafsiri ngumu ya neno kwa neno ‘mbele ya uso wako.’
- source_word: κατασκευάσει
  choice: ataitayarisha
  rationale: Hutoa wazi maana ya kuandaa au kufanya tayari na huhifadhi wakati ujao.
- source_word: τὴν ὁδόν σου
  choice: njia yako
  rationale: Huhifadhi taswira halisi ya njia pamoja na uwezekano wa maana yake ya kimajazi.
theological_decisions:
- issue: Kauli ya nukuu humtaja Isaya peke yake ingawa maneno ya nukuu yanahusiana na Malaki 3:1 pamoja na Isaya 40:3.
  choice: Kudumisha ‘katika kitabu cha nabii Isaya’ katika matini kuu.
  alternative: katika manabii
  rationale: Hili ndilo somo la SBLGNT; mvutano wa chanzo cha nukuu haupaswi kusawazishwa kimya kimya. Tofauti ya hati na muundo wa nukuu zimeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. ‘Tazama’ inadumisha sauti ya kinabii, huku ‘mbele yako’ ikiepuka tafsiri isiyo ya kawaida ya nahau ya Kigiriki.
