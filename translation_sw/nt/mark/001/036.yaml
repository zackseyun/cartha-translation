lexical_decisions:
- source_word: κατεδίωξεν
  choice: wakamfuatilia kwa bidii
  rationale: Kitenzi καταδιώκω kina nguvu ya kufuatilia au kwenda nyuma ya mtu kwa juhudi. Usemi huu ni wa asili katika Kiswahili na huhifadhi nguvu hiyo bila kudokeza lazima uadui au uwindaji.
- source_word: αὐτὸν
  choice: -m-
  rationale: Kiambishi cha yambwa katika ‘wakamfuatilia’ kinamrejelea Yesu, kama muktadha wa karibu unavyoonyesha.
- source_word: Σίμων
  choice: Simoni
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: οἱ μετ’ αὐτοῦ
  choice: wale waliokuwa pamoja naye
  rationale: Huhifadhi kwa uwazi maana ya moja kwa moja ya ‘wale pamoja naye’ bila kuongeza utambulisho maalumu kama ‘wenzake’ au ‘wanafunzi wake.’
- source_word: καὶ
  choice: na ... waka-
  rationale: Muundo huu unaunganisha sentensi na simulizi lililotangulia huku ukitoa mtiririko wa kawaida wa masimulizi ya Kiswahili na kuhifadhi mtindo wa Marko wa kuunganisha matukio.
