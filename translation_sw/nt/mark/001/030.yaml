lexical_decisions:
- source_word: πενθερὰ
  choice: mama mkwe
  rationale: Neno hili linamaanisha mama wa mwenzi wa ndoa; katika muktadha huu, “mama mkwe wa Simoni” ni usemi wa kawaida na ulio wazi.
- source_word: κατέκειτο
  choice: alikuwa amelala
  rationale: Kauli ya wakati usiotimilika inaonyesha hali iliyoendelea ya kulala; tafsiri hii haiingizi wazo lisilosemwa wazi kwamba alikuwa kitandani au alikuwa hawezi kabisa kuondoka humo.
- source_word: πυρέσσουσα
  choice: akiwa na homa
  rationale: Kirai hiki kinawasilisha kwa Kiswahili cha kawaida maana ya kuwa na homa au kuugua homa.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Inahifadhi maana ya tendo kufanyika bila kukawia na mtindo wa simulizi wa Marko.
- source_word: λέγουσιν
  choice: wakamwambia
  rationale: Wakati uliopita wa kisimulizi unasomeka kwa ufasaha katika Kiswahili; tanbihi inaonyesha kwamba Kiyunani kimetumia wakati wa sasa wa kihistoria.
- source_word: περὶ αὐτῆς
  choice: habari zake
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha kwamba walimwambia Yesu kuhusu hali ya huyo mwanamke.
- source_word: δὲ
  choice: nao
  rationale: Kiunganishi hiki chepesi kinaendeleza simulizi bila kuleta tofauti au upinzani mkali.
