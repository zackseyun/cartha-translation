  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: sw
  text: Mama mkwe wa Simoni alikuwa amelala akiwa na homa, na mara moja wakamwambia[a] habari zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiyunani: “wanamwambia.” Huu ni wakati wa sasa wa kihistoria, unaotumiwa kusimulia tukio lililopita kwa uhai zaidi.'
