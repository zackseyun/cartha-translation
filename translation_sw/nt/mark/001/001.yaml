  text: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ ⸀χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: sw
  text: Mwanzo wa habari njema[a] ya Yesu Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “injili.” Neno la Kigiriki εὐαγγέλιον linaweza kutafsiriwa “habari njema” au kwa neno la jadi “injili.”
    reason: lexical_alternative
  - marker: b
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός linamaanisha “Masihi” linapotumiwa kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Mwanzo
  rationale: Nomino hii imeachwa kama mwanzo wa kichwa au kauli isiyo na kitenzi, kama ilivyo katika Kigiriki; haijaongezewa ufafanuzi unaoamua ikiwa ni kichwa au mwanzo wa simulizi.
- source_word: εὐαγγελίου
  choice: habari njema
  rationale: Hutafsiri maana ya neno la Kigiriki kwa lugha ya kawaida na wazi; neno la jadi “injili” limetolewa kama mbadala katika tanbihi.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inaeleweka kama cheo cha Yesu, kwa hiyo maana ya cheo hicho imetafsiriwa badala ya kutumiwa tu kama sehemu ya jina.
theological_decisions:
- issue: Ikiwa Χριστοῦ itafsiriwe kama cheo au ibaki katika umbo la jadi “Kristo”
  choice: Masihi
  alternative: Kristo
  rationale: Katika utangulizi huu neno hilo linamtambulisha Yesu kwa cheo chake cha Kimasihi. Kiswahili hakihitaji kibainishi sawa na “the,” hivyo “Yesu Masihi” ni umbo la kawaida lisiloongeza maneno yasiyokuwamo katika chanzo.
- issue: Uhusiano wa kisarufi katika εὐαγγελίου Ἰησοῦ
  choice: habari njema ya Yesu
  alternative: habari njema kuhusu Yesu
  rationale: Muundo “ya Yesu” unahifadhi upana wa hali ya umilikishi katika Kigiriki, ambao unaweza kuhusisha habari inayomhusu Yesu na pia habari njema inayotoka kwake, bila kuamua kimya-kimya upande mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Kauli fupi isiyo na kitenzi imehifadhi mtindo wa utangulizi wa chanzo. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
