  text: Yohana Mbatizaji[a] alitokea nyikani, akitangaza ubatizo wa toba kwa ajili ya msamaha wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana aliyekuwa akibatiza alitokea nyikani, akitangaza...” Kishiriki cha Kigiriki kinaweza kutafsiriwa kwa uwazi zaidi kama maelezo ya kazi yake badala ya cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: alitokea
  rationale: Katika usimulizi huu, kitenzi kinamtambulisha Yohana akiingia katika tukio; “alitokea” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo bila tafsiri ngumu ya neno kwa neno.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: ὁ βαπτίζων
  choice: Mbatizaji
  rationale: Kivumishi-tendo chenye kibainishi kinamtambulisha Yohana kwa kazi yake ya kubatiza. “Mbatizaji” ni cheo kifupi, kinachoeleweka, na kilicho karibu na maana ya Kigiriki.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: “Nyikani” huonyesha eneo lisilokaliwa au la upweke bila kudai kwamba lilikuwa jangwa la mchanga, na huhifadhi mwangwi wa kibiblia wa ἔρημος.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: “Akitangaza” huhifadhi wazo la kutangaza hadharani kama mjumbe na si lazima kulifunga neno hilo kwenye mazingira ya mahubiri ya kanisani.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: “Ubatizo” ndilo neno la kawaida na sahihi la Kiswahili kwa tendo linalotajwa hapa.
- source_word: μετανοίας
  choice: wa toba
  rationale: Muundo huu huhifadhi uhusiano wa kimaelezo kati ya ubatizo na toba, bila kuupanua kuwa maelezo ya ziada.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: kwa ajili ya msamaha wa dhambi
  rationale: Kauli hii ya asili huacha wazi kwa kiasi fulani uhusiano wa kusudi au matokeo. “Kwa ajili ya” huhifadhi mvutano huo kuliko tafsiri inayodai wazi namna msamaha unavyopatikana.
theological_decisions:
- issue: Uhusiano kati ya ubatizo, toba, na msamaha
  choice: ubatizo wa toba kwa ajili ya msamaha wa dhambi
  alternative: ubatizo unaoashiria toba ili dhambi zisamehewe; ubatizo unaoleta msamaha kwa njia ya toba
  rationale: Kigiriki kinaunganisha ubatizo, toba, na msamaha lakini hakilazimishi mtafsiri kuamua ikiwa ubatizo ni chombo, ishara, au tangazo la msamaha. Tafsiri imehifadhi uhusiano huo bila kutatua mjadala wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Nyikani” na “Mbatizaji” vinaendeleza mtindo wa kibiblia bila kuwa vya kizamani kupita kiasi.
