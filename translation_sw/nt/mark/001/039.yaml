  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: sw
  text: Naye akaenda kotekote katika Galilaya[a], akihubiri katika masinagogi yao na kufukuza pepo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaja, akihubiri katika masinagogi yao kotekote katika Galilaya na kufukuza pepo.” Kitenzi cha Kigiriki kinaweza kutafsiriwa “akaja,” lakini katika muktadha huu huenda kinaeleza safari yake kutoka sehemu moja hadi nyingine katika eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: akaenda
  rationale: Ingawa kitenzi ἔρχομαι kinaweza kumaanisha ‘kuja,’ katika muktadha huu kinaeleza safari ya Yesu katika eneo la Galilaya; ‘akaenda’ ni Kiswahili cha kawaida bila kuficha uwezekano wa tafsiri nyingine.
- source_word: κηρύσσων
  choice: akihubiri
  rationale: Kitenzi hiki humaanisha kutangaza ujumbe hadharani. ‘Akihubiri’ ni cha kawaida na kinafaa katika mazingira ya masinagogi.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: katika masinagogi yao
  rationale: Ingawa εἰς kwa msingi humaanisha kuelekea au kuingia ndani, hapa inaonyesha mahali ambapo tendo la kuhubiri lilifanyika. Kiwakilishi ‘yao’ kimehifadhiwa.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: katika Galilaya yote
  rationale: Kirai kinaonyesha eneo lote ambalo Yesu alizunguka. Muundo huu ni wa asili katika Kiswahili na unahifadhi ὅλην, ‘yote.’
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: ‘Pepo’ ni neno la kawaida la Kiswahili kwa viumbe wa kiroho wanaotajwa hapa, bila kulibadilisha kuwa kirai tofauti cha ‘roho wachafu.’
- source_word: ἐκβάλλων
  choice: kufukuza
  rationale: Katika muktadha wa kutoa pepo, ἐκβάλλω humaanisha kuwatoa au kuwafukuza. ‘Kufukuza pepo’ ni usemi wa asili na wenye kueleweka wazi.
theological_decisions:
- issue: Asili ya τὰ δαιμόνια
  choice: Imetafsiriwa ‘pepo,’ kwa maana ya kawaida ya viumbe binafsi wa kiroho.
  alternative: roho waovu
  rationale: ‘Pepo’ ni tafsiri ya moja kwa moja zaidi na haiingizi maelezo ya ziada ya kimafundisho kuliko yaliyomo katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi ‘akihubiri’ na ‘kufukuza’ unadumisha uhusiano wa matendo yanayoandamana na safari yake.
