base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: sw
  text: Roho mchafu akamtia degedege[a], akapiga kelele kwa sauti kubwa[b], kisha akamtoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, akamtikisa kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au, akalia kwa kilio kikubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαράξαν
  choice: akamtia degedege
  rationale: Kitenzi hiki kinaonyesha roho ikimsababishia mtu mshtuko mkali wa mwili kabla ya kumtoka. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili, bila kutumia tafsiri halisi ya ‘kumrarua’ ambayo inaweza kupotosha maana.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: Roho huyo mchafu
  rationale: ‘Roho mchafu’ huhifadhi maana ya πνεῦμα ἀκάθαρτον na utendaji wake kama kiumbe binafsi katika simulizi. ‘Huyo’ humrejelea wazi roho aliyetajwa katika muktadha.
- source_word: φωνῆσαν
  choice: akapiga kelele
  rationale: Huwasilisha tendo la kutoa sauti kali bila kuongeza hisia maalumu ambazo hazitajwi katika Kigiriki.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachoeleza namna ya kupiga kelele.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: akamtoka
  rationale: Usemi huu wa Kiswahili ni mfupi na wa kawaida, nao huhifadhi maana ya roho kutoka ndani ya mtu.
- source_word: καὶ ... καὶ
  choice: akapiga ... kisha
  rationale: Mfuatano wa vitenzi huleta mtiririko wa asili wa Kiswahili, huku ‘kisha’ ikiweka wazi kuwa kutoka kulitokea baada ya matendo yaliyotajwa kwa vivumishi vya tendo katika Kigiriki.
theological_decisions:
- issue: Asili ya kiumbe aliyekuwa ndani ya mtu
  choice: Roho mchafu anaonyeshwa kama mtendaji binafsi
  alternative: Nguvu ovu isiyo na utu
  rationale: Katika simulizi, roho ndiye anayemtia mtu degedege, anayepiga kelele, na anayemtoka. Tafsiri inadumisha utendaji huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo ni wa asili katika simulizi la Kiswahili na unaonyesha kwa uwazi mpangilio wa matendo.
