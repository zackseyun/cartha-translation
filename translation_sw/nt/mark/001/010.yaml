id: MRK.1.10
reference: Mark 1:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: sw
  text: Mara tu alipokuwa akipanda kutoka majini, aliona mbingu zikichanika[a] na Roho akishuka kama njiwa juu yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbingu zikipasuliwa.” Kitenzi cha Kigiriki kina nguvu kuliko kusema tu “zikifunguka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ndani yake.” Neno la Kigiriki εἰς linaweza kumaanisha “ndani ya,” lakini hapa “juu yake” linafaa zaidi katika usemi unaoeleza kushuka kwa Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: mara tu
  rationale: Huhifadhi haraka na msukumo wa simulizi unaotambulika katika Marko, kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: alipokuwa akipanda kutoka majini
  rationale: Muundo huu unaonyesha kwamba tendo hilo lilikuwa likiendelea wakati alipoona, huku ἐκ ikiwakilishwa kwa ‘kutoka.’
- source_word: εἶδεν
  choice: aliona
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kuona, bila kuongeza tendo jingine.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: mbingu zikichanika
  rationale: ‘Zikichanika’ huhifadhi nguvu na taswira ya σχίζω, ambayo ni kali kuliko kufunguka tu; ‘mbingu’ huhifadhi wingi wa Kigiriki.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Herufi kubwa inatambulisha Roho wa Mungu katika muktadha huu, bila kuongeza kivumishi ‘Mtakatifu’ ambacho hakipo katika mstari wa Kigiriki.
- source_word: ὡς περιστερὰν
  choice: kama njiwa
  rationale: Huhifadhi ulinganisho bila kuamua ikiwa unahusu umbo, mwendo, au namna nyingine.
- source_word: καταβαῖνον
  choice: akishuka
  rationale: Ni usemi wa kawaida na wazi unaowakilisha tendo linaloendelea la kushuka.
- source_word: εἰς αὐτόν
  choice: juu yake
  rationale: Katika muktadha wa kushuka kwa Roho, huu ndio usemi wa Kiswahili unaofaa zaidi, huku uwezekano wa maana ‘ndani yake’ ukitajwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa ‘Roho’
  choice: Roho wa Mungu, akitajwa kama ‘Roho’
  alternative: Roho Mtakatifu
  rationale: Muktadha unamtambulisha kuwa Roho wa Mungu, lakini Kigiriki kinasema tu ‘Roho’; tafsiri haiongezi sifa isiyopo.
- issue: Maana kamili ya ulinganisho na njiwa
  choice: kama njiwa
  alternative: akiwa katika umbo la njiwa; kwa mwendo kama wa njiwa
  rationale: ὡς inaonyesha ulinganisho lakini haisemi wazi ikiwa unahusu umbo, mwendo, au jambo jingine; utata huo umehifadhiwa.
- issue: Mwelekeo wa εἰς αὐτόν
  choice: juu yake
  alternative: ndani yake
  rationale: ‘Juu yake’ inafaa kwa nahau ya kushuka kwa Roho, lakini maana ya msingi ya εἰς inaweza kuruhusu ‘ndani yake,’ hivyo mbadala huo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira kali ya mbingu kuchanika na utata wa ulinganisho ‘kama njiwa’ vimehifadhiwa.
