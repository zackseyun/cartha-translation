  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vikuu vya Kigiriki: εὐθὺς kwa “Mara tu,” kiima cha wakati mmoja katika “alipokuwa akipanda kutoka majini,” εἶδεν kwa “aliona,” na taswira yenye nguvu ya σχιζομένους kwa “mbingu zikichanika.” “Roho akishuka kama njiwa juu yake” huhifadhi ulinganisho wa ὡς na uchaguzi wa kimuktadha wa εἰς αὐτόν bila kuufunga utata wa asili.'
