  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: sw
  text: Akamwambia, “Angalia, usimwambie mtu yeyote chochote. Badala yake, nenda ukajionyeshe kwa kuhani, na utoe kwa ajili ya utakaso wako yale Musa aliyoamuru, kama ushuhuda kwao.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ushuhuda kwao.” Maneno haya yanaweza kumaanisha uthibitisho unaowasilishwa kwa makuhani au kwa wengine; baadhi huyafasiri kwa ukali zaidi kuwa ushuhuda dhidi yao.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Angalia
  rationale: Amri hii inatanguliza onyo au himizo kali; “Angalia” ni ya kawaida katika Kiswahili na inadumisha nguvu yake bila kuongeza ukali usiotajwa.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: usimwambie mtu yeyote jambo lolote
  rationale: Muundo wa ukanushi maradufu unakataza kikamilifu kumweleza mtu yeyote chochote; tafsiri hii inahifadhi mhusika anayepokea habari na jambo linalosemwa.
- source_word: ἀλλὰ
  choice: Badala yake
  rationale: Inaonyesha tofauti ya wazi kati ya jambo asilopaswa kufanya na lile analopaswa kufanya.
- source_word: ὕπαγε
  choice: nenda
  rationale: Ni amri ya moja kwa moja ya kuondoka au kwenda.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: ukajionyeshe kwa kuhani
  rationale: Inahifadhi kiwakilishi cha kujirejelea na wazo la kujitokeza mbele ya kuhani kwa ukaguzi uliotakiwa na Torati.
- source_word: ἱερεῖ
  choice: kuhani
  rationale: Katika Kiswahili, nomino hii si lazima iwe na kionyeshi cha upekee ili kurejelea kuhani mwenye mamlaka inayofaa katika muktadha.
- source_word: προσένεγκε
  choice: utoe
  rationale: Muktadha wa ibada na dhabihu unapendelea “utoe” kuliko neno la jumla kama “ulete.”
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: kwa ajili ya kutakaswa kwako
  rationale: Hutoa maana ya kusudi au uhusiano wa sadaka na utakaso, huku ikidumisha msamiati wa ibada.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: yale Musa aliyoamuru
  rationale: Inawakilisha kwa kawaida wingi wa mambo yaliyoagizwa katika masharti ya Musa.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: kuwa ushuhuda kwao
  rationale: Inahifadhi maana pana ya ushahidi au ushuhuda bila kuamua kwamba lazima uwe ushuhuda dhidi yao.
theological_decisions:
- issue: Rejeleo na nguvu ya εἰς μαρτύριον αὐτοῖς
  choice: kuwa ushuhuda kwao
  alternative: kuwa ushuhuda dhidi yao; kuwa uthibitisho kwa makuhani
  rationale: Kigiriki hakisemi wazi “dhidi yao,” wala hakitambulishi kwa uhakika watu wanaorejelewa. Tafsiri pana inadumisha uwezekano wa makuhani na/au wengine kuwa wapokeaji wa ushuhuda huo na haiongezi maana ya kimabishano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida; msamiati wa “kuhani,” “kutakaswa,” na “ushuhuda” unafaa muktadha wa Torati na ibada.
