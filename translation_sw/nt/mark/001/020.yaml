  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: sw
  text: Mara moja akawaita. Nao wakamwacha baba yao, Zebedayo, katika mashua pamoja na wafanyakazi walioajiriwa, wakaenda kumfuata[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaenda nyuma yake.” Kifungu cha Kigiriki kinaweza kumaanisha kwenda kimwili nyuma yake na pia kuanza kuwa wafuasi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: mara
  rationale: Katika muktadha huu linaonyesha kwamba tendo lilifanyika bila kukawia na linadumisha kasi ya usimulizi wa Marko kwa Kiswahili cha kawaida.
- source_word: ἐκάλεσεν
  choice: akawaita
  rationale: ‘Kuwaita’ ni tafsiri ya moja kwa moja isiyoongeza ukali wa ‘kuamuru’ wala upole wa ‘kualika.’
- source_word: ἀφέντες
  choice: wakamwacha
  rationale: Linaonyesha tendo lililotangulia kuondoka kwao bila kulipa maana kali zaidi ya kumtelekeza.
- source_word: Ζεβεδαῖον
  choice: Zebedayo
  rationale: Hili ndilo umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: πλοίῳ
  choice: mashua
  rationale: ‘Mashua’ linafaa kwa chombo cha uvuvi katika mazingira ya Galilaya kuliko ‘meli.’
- source_word: μισθωτῶν
  choice: wafanyakazi walioajiriwa
  rationale: Linaeleza watu waliofanya kazi kwa ujira bila kudai kwamba walikuwa vibarua wa siku moja.
- source_word: ἀπῆλθον
  choice: wakaenda
  rationale: Kitenzi hiki kinaonyesha kuondoka kwao katika mahali walipokuwa; katika sentensi hii ‘wakaenda’ ni cha asili na mwelekeo unaelezwa na ‘nyuma yake.’
- source_word: ὀπίσω αὐτοῦ
  choice: nyuma yake
  rationale: Linaweka wazi taswira ya mwendo wa kimwili huku muktadha ukiruhusu pia maana ya kuanza kuwa wafuasi wake.
theological_decisions:
- issue: Maana ya ufuasi katika ὀπίσω αὐτοῦ
  choice: wakaenda nyuma yake
  alternative: wakamfuata
  rationale: Tafsiri iliyochaguliwa inadumisha maana ya mahali au mwendo pamoja na mwangwi wa kuwa wanafunzi, bila kuifanya maana ya kitheolojia kuwa ya pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi mbili unafuata mpangilio wa Kigiriki huku ‘Nao’ ikiunganisha matendo kwa mtiririko wa asili.
