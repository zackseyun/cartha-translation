  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: sw
  text: Yesu akamkemea, akisema, “Nyamaza[a], na umtoke!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana halisi zaidi, “Fungwa mdomo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: akamkemea
  rationale: Kitenzi ‘kukemea’ kinaonyesha maonyo makali yenye mamlaka, na kinafaa katika muktadha wa Yesu kuikabili roho mchafu.
- source_word: αὐτῷ
  choice: -m- katika ‘akamkemea’
  rationale: Kiwakilishi cha nafsi ya tatu umoja kinarejelea roho mchafu, si mtu aliyekuwa amepagawa; Kiswahili hukiwakilisha kwa kiambishi cha yambwa -m-.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kisarufi unaotambulisha maneno yaliyomo katika kukemea kwa Yesu kwa lugha ya kawaida na yenye staha.
- source_word: Φιμώθητι
  choice: Nyamaza
  rationale: Ingawa maana ya picha ni kufungwa mdomo kama kwa lijamu, hapa amri hiyo humaanisha kunyamazishwa kwa nguvu. ‘Nyamaza’ ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: ἔξελθε
  choice: umtoke
  rationale: Katika muktadha huu kitenzi kinaamuru roho itoke ndani ya mtu; ‘umtoke’ ni usemi wa Kiswahili unaobainisha tendo hilo na kuunganisha yambwa wake kwa kawaida.
- source_word: ἐξ αὐτοῦ
  choice: -m- katika ‘umtoke’
  rationale: Kiambishi hicho kinaonyesha kutoka ndani ya mtu anayeteswa, na hivyo kinahifadhi tofauti kati yake na roho inayoamriwa.
theological_decisions:
- issue: Anayelengwa na kukemea kwa Yesu
  choice: Yesu anasema moja kwa moja na roho mchafu.
  alternative: Yesu anamkemea mtu kama anayerejelewa moja kwa moja na kiwakilishi.
  rationale: Muktadha uliotangulia na amri ‘umtoke’ zinaonyesha kwamba anayesemeshwa ni roho, huku mtu akiwa yule ambaye roho inaamriwa imtoke. Hii inadumisha tofauti ya simulizi bila kuongeza madai mengine ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo ‘umtoke’ ni wa asili na huepuka usemi mzito ‘toka ndani yake’ bila kupoteza wazo la kutoka ndani ya mtu.
