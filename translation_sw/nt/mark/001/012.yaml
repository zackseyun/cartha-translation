    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Aka-
  rationale: Kiambishi cha masimulizi “aka-” kinaendeleza mfuatano wa matukio kwa Kiswahili cha kawaida bila kuongeza ufafanuzi usiomo katika kiunganishi cha Kigiriki.
- source_word: εὐθὺς
  choice: Mara
  rationale: “Mara” huonyesha kwamba tendo lilifuata bila kuchelewa na kuhifadhi kasi ya masimulizi ya Marko kwa lugha ya kawaida.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Muktadha unamtambulisha kuwa Roho aliyetajwa katika ubatizo wa Yesu; “Roho” inadumisha umbo la Kigiriki bila kuongeza “Mtakatifu” hapa.
- source_word: αὐτὸν
  choice: -m-
  rationale: Kiambishi cha yambwa katika “akamsukuma” kinamrejelea Yesu kwa njia ya kawaida ya kisarufi katika Kiswahili.
- source_word: ἐκβάλλει
  choice: akamsukuma kwenda
  rationale: “Akamsukuma” inadumisha nguvu ya kitenzi ἐκβάλλω kuliko “akamwongoza,” huku “kwenda” ikifanya mwelekeo kuelekea nyikani uwe wa kawaida katika Kiswahili.
- source_word: εἰς τὴν ἔρημον
  choice: kwenda nyikani
  rationale: “Nyikani” humaanisha eneo lisilokaliwa na lenye ukiwa, bila kulazimisha picha ya jangwa la mchanga; “kwenda” huwasilisha mwelekeo wa εἰς.
theological_decisions:
- issue: Nguvu ya tendo la Roho kwa Yesu
  choice: “akamsukuma kwenda”
  alternative: “akamwongoza” au “akamtuma”
  rationale: Kitenzi cha Kigiriki ἐκβάλλει kina nguvu. Tafsiri hii haikipunguzi kuwa uongozi wa upole, hivyo inadumisha mvutano wa kifungu kwamba kwenda kwa Yesu nyikani kulitokana na msukumo thabiti wa Roho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi ili kuhifadhi kasi ya Marko; “nyikani” ni ya kawaida katika sajili ya Biblia na inaeleweka kama mahali pa ukiwa.
