  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: sw
  text: Watu wa nchi yote ya Yudea na wakazi wote wa Yerusalemu walikuwa wakitoka kwenda kwake, nao walikuwa wakibatizwa naye katika Mto Yordani huku wakiungama dhambi zao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο πρὸς αὐτόν
  choice: walikuwa wakimwendea
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au kurudiwa. Kiswahili hiki ni cha kawaida na kinahifadhi wazo la watu kuendelea kwenda kwake.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: watu kutoka sehemu yote ya mashambani ya Yudea
  rationale: χώρα inaweza kumaanisha eneo, wilaya, au sehemu ya mashambani. Muundo huu unaonyesha kwamba wanaotoka ni watu wa eneo hilo, huku ukihifadhi msisitizo wa πᾶσα bila kudai kwamba ardhi yenyewe ilitoka.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: wakazi wote wa Yerusalemu
  rationale: Ἱεροσολυμῖται ni wakazi wa Yerusalemu; “wakazi wote” ni Kiswahili cha kawaida na kinahifadhi nguvu ya πάντες.
- source_word: ἐβαπτίζοντο ὑπ’ αὐτοῦ
  choice: walikuwa wakibatizwa naye
  rationale: Kauli tendwa ya wakati usiotimilika inaonyesha ubatizo uliokuwa ukifanyika mara kwa mara; “naye” humrejelea Yohana bila kuongeza jina lisilokuwamo katika mstari.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: katika Mto Yordani
  rationale: ποταμός limetafsiriwa wazi kuwa “Mto,” na mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν
  choice: huku wakiungama dhambi zao
  rationale: Kirai kishirikishi kinaonyesha tendo lililoambatana na kubatizwa. “Kuungama dhambi” ni usemi wa moja kwa moja, unaoeleweka, na usioongeza tafsiri ya kitheolojia.
theological_decisions:
- issue: Upeo wa maneno yanayomaanisha “wote” kuhusu Yudea na Yerusalemu
  choice: Kuhifadhi “yote/wote” kama msisitizo wa ujumla wa kisimulizi
  alternative: Kutafsiri kwa kulegeza kuwa “watu wengi kutoka Yudea na Yerusalemu”
  rationale: Kigiriki kina πᾶσα na πάντες. Tafsiri inahifadhi usemi huo bila kuufafanua kuwa lazima unamaanisha kila mtu mmoja mmoja bila ubaguzi.
- issue: Maana ya lugha ya ubatizo
  choice: Kutumia “kubatizwa” bila kufafanua namna au maana yake ya kitheolojia
  alternative: Kutumia “kuzamishwa” au “kuoshwa”
  rationale: Mstari unasimulia tendo lakini hautoi hapa ufafanuzi wa namna yake wala mafundisho yake ya baadaye. “Kubatizwa” huepuka kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku uhusiano wa matendo na hali ya kuendelea ukihifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
