base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: sw
  text: Naye akawaponya wengi waliokuwa wagonjwa wa magonjwa mbalimbali, akawafukuza pepo wengi, wala hakuwaruhusu pepo hao kusema, kwa sababu walimjua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walijua yeye ni nani.” Kigiriki husema tu, “walimjua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: akawaponya
  rationale: Kitenzi ‘kuponya’ ni cha kawaida na cha asili katika Kiswahili kwa tendo la kuwarejeshea afya wagonjwa.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: wengi waliokuwa wagonjwa
  rationale: Hii inatafsiri nahau ya Kigiriki κακῶς ἔχω kwa Kiswahili cha kawaida badala ya kuiga muundo wake neno kwa neno.
- source_word: ποικίλαις νόσοις
  choice: kwa magonjwa mbalimbali
  rationale: ‘Mbalimbali’ huhifadhi wazo la aina tofauti za magonjwa, na ‘kwa’ hapa hueleza hali iliyowapata wagonjwa kwa ufasaha wa Kiswahili.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: akawafukuza pepo wengi
  rationale: ‘Kufukuza’ linaonyesha kuwa pepo waliondolewa kwa nguvu na ni usemi wa asili katika muktadha huu.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: Hakuwaruhusu ... kusema
  rationale: Muundo huu unaonyesha katazo lililoendelea katika tukio hilo na unatumia Kiswahili cha sasa, cha kawaida na chenye hadhi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinawasilisha wazi maana ya sababu inayofaa zaidi katika muktadha.
- source_word: ᾔδεισαν αὐτόν
  choice: walimjua
  rationale: Huhifadhi ufupi na kutotaja wazi zaidi kwa Kigiriki, ambacho kinasema tu kwamba walimjua.
theological_decisions:
- issue: Iwapo kueleza wazi utambulisho ambao pepo walijua
  choice: walimjua
  alternative: walijua yeye ni nani
  rationale: Kigiriki kina kiwakilishi cha moja kwa moja tu, ‘yeye.’ Tafsiri hii haiongezi ungamo maalumu la kikristo kutoka vifungu vya jirani, hivyo inadumisha utata na mvutano wa kifungu chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. ‘Pepo’ limetumiwa kwa δαιμόνια kama neno linaloeleweka kwa wasomaji wa kawaida; ‘pepo hao’ hufanya rejeo la pili liwe wazi bila kuongeza maana ya kitheolojia.
