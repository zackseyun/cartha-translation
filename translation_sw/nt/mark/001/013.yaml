reference: Mark 1:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: sw
  text: Naye alikuwa nyikani siku arobaini[a], akijaribiwa na Shetani. Alikuwa pamoja na wanyama wa porini, nao malaika walikuwa wakimhudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akipimwa na Shetani.” Kitenzi cha Kigiriki kinaweza kumaanisha “kujaribiwa” au “kupimwa,” ingawa “kujaribiwa” hufaa zaidi hapa kwa kuwa Shetani ndiye anayetenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: nyikani
  rationale: Neno hili linaonyesha eneo lisilokaliwa au la porini; “nyikani” ni la kawaida katika simulizi za Biblia na halibainishi kimakosa kwamba palikuwa jangwa la mchanga.
- source_word: τεσσεράκοντα ἡμέρας
  choice: siku arobaini
  rationale: Ni tafsiri ya moja kwa moja ya muda uliotajwa, huku mwangwi wake wa kibiblia ukiachwa ujitokeze bila maelezo ya ziada ndani ya mstari.
- source_word: πειραζόμενος
  choice: akijaribiwa
  rationale: Kitenzi kinaweza kumaanisha kujaribiwa kwa kishawishi au kupimwa. Kwa kuwa Shetani ndiye mtendaji, “akijaribiwa” hufaa zaidi katika muktadha huu, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: na Shetani
  rationale: “Shetani” ni jina au cheo kilichozoeleka katika Kiswahili kwa adui huyu wa kiroho.
- source_word: μετὰ τῶν θηρίων
  choice: pamoja na wanyama wa porini
  rationale: Huwasilisha wazi wanyama wasiofugwa katika mazingira ya nyika bila kutumia lugha ya kizamani.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Katika muktadha huu neno linarejelea viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: διηκόνουν αὐτῷ
  choice: walikuwa wakimhudumia
  rationale: Muundo huu huhifadhi tendo lililoendelea la kitenzi cha wakati usiotimilika na maana ya kumtumikia au kumhudumia.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Naye alikuwa ... Alikuwa ... nao ...
  rationale: Muunganiko wa Marko wa sentensi unaendelezwa kwa viunganishi vya Kiswahili vya asili, huku mgawanyo wa sentensi ukifanya mstari usomeke kwa urahisi.
theological_decisions:
- issue: Maana ya πειραζόμενος inapohusishwa na Shetani
  choice: akijaribiwa
  alternative: akipimwa
  rationale: Neno la Kigiriki linaweza kumaanisha kushawishiwa kutenda uovu au kupimwa. Kutajwa kwa Shetani kama mtendaji kunafanya maana ya kishawishi iwe ya kawaida zaidi hapa, lakini uwezekano wa “kupimwa” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. “Nyikani,” “wanyama wa porini,” na “walikuwa wakimhudumia” huhifadhi mazingira, mtiririko wa tendo, na uzito wa simulizi bila kuingiza ufafanuzi wa kimadhehebu.
