  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: sw
  text: Yesu akawaambia, “Nifuateni, nami nitawafanya kuwa wavuvi wa watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Nifuateni
  rationale: Kauli hii ya kawaida ya Kiswahili inawasilisha mwito wa kuja nyuma ya Yesu kama wafuasi wake, bila tafsiri ngumu ya neno kwa neno.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: nitawafanya kuwa
  rationale: Inahifadhi wazo la Yesu mwenyewe kuwasababisha wawe kitu ambacho hawakuwa hapo awali; Kiswahili hakihitaji kurudia vitenzi viwili kwa namna isiyo ya kawaida.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: wavuvi wa watu
  rationale: Inadumisha sitiari ya uvuvi, huku ἀνθρώπων hapa ikimaanisha wanadamu kwa ujumla, si wanaume pekee.
theological_decisions:
- issue: Maana ya mwito Δεῦτε ὀπίσω μου
  choice: Nifuateni
  alternative: Njooni nyuma yangu
  rationale: Mwito ni wa kuwa wanafunzi wanaomfuata Yesu; ‘Nifuateni’ ni wa asili na haubadili dai la Yesu la uongozi.
- issue: Upeo wa ἀνθρώπων
  choice: watu
  alternative: wanaume
  rationale: Ingawa ἄνθρωπος inaweza kumaanisha mtu wa kiume katika baadhi ya miktadha, wingi wa aina hii humaanisha wanadamu/watu kwa jumla; ‘watu’ huepuka kuzuia maana bila msingi wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja, ukihifadhi sitiari kuu ya uvuvi.
