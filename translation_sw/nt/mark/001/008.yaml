id: MRK.1.8
reference: Mark 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: sw
  text: Mimi niliwabatiza kwa maji, lakini yeye atawabatiza kwa Roho Mtakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho Mtakatifu.” Kihusishi cha Kigiriki kinaweza kutafsiriwa kwa mojawapo ya njia hizo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kimehifadhiwa ili kusisitiza utofautishaji kati ya Yohana na yule ajaye.
- source_word: ἐβάπτισα
  choice: niliwabatiza
  rationale: Huhifadhi maana ya tendo la ubatizo na wakati uliopita wa kitenzi cha Kigiriki bila kubainisha zaidi namna ya tendo hilo.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi cha yambwa kinaonyesha kuwa wanaosemewa ni wengi, kama ilivyo katika Kigiriki.
- source_word: ὕδατι
  choice: kwa maji
  rationale: Hii ni tafsiri ya kawaida na ya asili ya hali ya chombo katika Kiswahili, nayo inadumisha ulinganifu na fungu linalofuata.
- source_word: αὐτὸς
  choice: yeye
  rationale: Kiwakilishi huru kinahifadhi mkazo wa utofautishaji na neno “Mimi” mwanzoni mwa sentensi.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha wazi tofauti kati ya ubatizo wa Yohana na ubatizo wa yule ajaye.
- source_word: βαπτίσει
  choice: atawabatiza
  rationale: Wakati ujao umehifadhiwa, na mzizi uleule wa “batiza” umetumiwa ili kuonyesha mwendelezo wa kimatamshi na ἐβάπτισα.
- source_word: ἐν
  choice: kwa
  rationale: Katika muundo huu, “kwa” ni Kiswahili cha kawaida kinachoweza kuonyesha njia au chombo; uwezekano wa maana ya “katika” umehifadhiwa katika tanbihi.
- source_word: πνεύματι ἁγίῳ
  choice: Roho Mtakatifu
  rationale: Katika muktadha huu, kirai hicho kwa kawaida humrejelea Roho Mtakatifu wa Mungu; matumizi ya herufi kubwa yanaonyesha rejeo hilo bila kuongeza maelezo yasiyomo katika aya.
theological_decisions:
- issue: Ikiwa πνεύματι ἁγίῳ humaanisha Roho Mtakatifu wa Mungu au nguvu takatifu isiyo nafsi
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika muktadha wa Marko, tofauti kati ya ubatizo wa Yohana na kazi ya yule mwenye nguvu zaidi inaeleweka kwa kawaida kuwa rejeo kwa Roho Mtakatifu wa Mungu, bila kueleza zaidi namna ya kazi yake.
- issue: Jinsi ya kutafsiri ἐν katika ἐν πνεύματι ἁγίῳ
  choice: kwa Roho Mtakatifu
  alternative: katika Roho Mtakatifu
  rationale: “Kwa” ni ya asili katika Kiswahili na inalingana na “kwa maji,” lakini “katika” pia inawezekana; tanbihi inadumisha utata huo wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Viwakilishi huru “Mimi” na “yeye” vimehifadhiwa kwa ajili ya mkazo wa utofautishaji.
