  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: sw
  text: Yohana alikuwa amevaa vazi la manyoya ya ngamia na mkanda wa ngozi kiunoni[a], naye alikuwa akila nzige na asali ya mwituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mavazi ya Yohana yanakumbusha jinsi Eliya alivyoelezwa katika 2 Wafalme 1:8, na hivyo yanachangia namna Marko anavyomwonyesha Yohana kuwa mtangulizi wa kinabii.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: alikuwa amevaa
  rationale: Kitenzi hiki katika hali ya timilifu kinaeleza hali ya Yohana kuwa amevalia; “alikuwa amevaa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: τρίχας καμήλου
  choice: vazi la manyoya ya ngamia
  rationale: Kirai hiki kinaonyesha kitu cha kuvaa kilichotengenezwa kwa manyoya ya ngamia, si lazima ngozi ya ngamia. Neno “vazi” linawekwa wazi ili kuepuka dhana kwamba alivaa manyoya yasiyofumwa.
- source_word: ζώνην δερματίνην
  choice: mkanda wa ngozi
  rationale: “Mkanda” ni kisawe cha kawaida cha ζώνη, na “wa ngozi” huhifadhi aina ya nyenzo iliyotajwa na δερματίνην.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: kiunoni
  rationale: Hii ni njia fupi na ya kawaida ya Kiswahili ya kueleza kuwa mkanda ulikuwa kuzunguka sehemu ya kiuno chake.
- source_word: ἔσθων
  choice: alikuwa akila
  rationale: Muundo huu unaonyesha tendo linaloendelea au lililokuwa desturi katika maelezo ya maisha ya Yohana.
- source_word: ἀκρίδας
  choice: nzige
  rationale: Maana ya kawaida ya neno hili ni wadudu wanaoitwa nzige; muktadha hautoi sababu ya kulipa maana nyingine.
- source_word: μέλι ἄγριον
  choice: asali ya mwituni
  rationale: Hueleza asali inayopatikana porini; “asali ya mwituni” ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: καὶ ἦν
  choice: Yohana alikuwa
  rationale: καί inaendeleza simulizi, lakini haihitaji kutafsiriwa kwa kiunganishi cha mwanzo katika Kiswahili; “alikuwa” hubeba maelezo ya hali bila kuongeza neno la wakati lisilokuwapo katika chanzo.
theological_decisions:
- issue: Mavazi na chakula cha Yohana kuhusiana na taswira ya kinabii
  choice: Kutafsiri maelezo ya Yohana bila kumtambulisha wazi kuwa Eliya katika matini kuu.
  alternative: Kuingiza katika matini kuu maelezo kwamba mavazi yake yalimfananisha na Eliya.
  rationale: Mavazi hayo yanakumbusha maelezo ya Eliya katika 2 Wafalme 1:8, lakini Marko 1:6 haisemi uhusiano huo moja kwa moja. Dokezo hilo linafaa kuwekwa katika tanbihi badala ya kuongezwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vazi la manyoya ya ngamia” ni wazi kwa wasomaji wa kawaida, na “naye alikuwa akila” hudumisha mtiririko wa maelezo bila kuwa mzito.
