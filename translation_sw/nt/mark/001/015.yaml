id: MRK.1.15
reference: Mark 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: sw
  text: akisema, “Wakati umetimia, na ufalme wa Mungu[a] umekaribia. Tubuni na kuiamini Habari Njema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawala wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: umetimia
  rationale: Kauli timilifu inaonyesha kwamba wakati uliowekwa umefikia utimilifu, na matokeo yake yanaendelea kuwapo sasa.
- source_word: ὁ καιρὸς
  choice: Wakati
  rationale: Hapa καιρός ni wakati maalumu au uliowekwa; ‘wakati’ ni usemi wa kawaida, huku muktadha ukionyesha uzito wake wa kipekee.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Kauli timilifu inaeleza kukaribia ambako kumeleta hali ya kuwa karibu sasa; ‘umekaribia’ huhifadhi tendo na matokeo yake.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: ‘Ufalme wa Mungu’ huhifadhi upana wa βασιλεία, unaoweza kuhusisha utawala wa Mungu na eneo au hali ambamo utawala huo unatambulika, bila kuubana kuwa dhana moja tu.
- source_word: μετανοεῖτε
  choice: Tubuni
  rationale: Kitenzi hiki kinatoa wito wa kubadili nia na mwelekeo wa maisha. ‘Tubuni’ ni usemi mfupi, wa kawaida na wenye uzito unaofaa katika Kiswahili.
- source_word: πιστεύετε ἐν
  choice: kuiamini
  rationale: ‘Kuiamini’ huwasilisha agizo la kuweka imani katika Habari Njema kwa Kiswahili cha kawaida, bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: τῷ εὐαγγελίῳ
  choice: Habari Njema
  rationale: εὐαγγέλιον maana yake ni habari njema; tafsiri hii inaeleweka kwa wasomaji wa sasa, huku neno la kimapokeo ‘Injili’ likihifadhiwa katika tanbihi.
- source_word: λέγων
  choice: akisema
  rationale: Hali ya kuendelea ya simulizi kutoka mstari uliotangulia inaonyeshwa kwa umbo la Kiswahili ‘akisema’.
theological_decisions:
- issue: Maana ya βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  alternative: utawala wa Mungu
  rationale: ‘Ufalme’ huhifadhi mwangwi mpana wa kibiblia na mvutano kati ya kutawala kwa Mungu na ufalme wake, bila kuamua kwamba neno hilo linamaanisha utendaji wa kutawala pekee.
- issue: Maana ya εὐαγγέλιον
  choice: Habari Njema
  alternative: Injili
  rationale: ‘Habari Njema’ huonyesha maana ya moja kwa moja na kueleweka kwa urahisi; ‘Injili’ inatajwa katika tanbihi kama istilahi ya kimapokeo iliyo sahihi pia.
- issue: Nguvu ya μετανοεῖτε καὶ πιστεύετε
  choice: Tubuni na kuiamini
  alternative: Endeleeni kutubu na kuamini
  rationale: Vitenzi vya wakati uliopo vinaweza kudokeza tendo endelevu, lakini maagizo rahisi ya Kiswahili huhifadhi wito wa haraka bila kuamua kupita kiasi kuhusu namna ya tendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Herufi kubwa katika ‘Habari Njema’ zinaitambulisha kama ujumbe unaotangazwa katika muktadha huu; ‘akisema’ linaunganisha mstari huu na simulizi la mstari uliotangulia.
