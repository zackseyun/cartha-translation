  text: And immediately they left the nets and followed him[a].
translation:
  language: sw
  text: Nao mara moja wakaacha nyavu zao, wakamfuata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mara ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: waka-
  rationale: Kiambishi cha usimulizi “waka-” kinaendeleza mtiririko wa simulizi na kuunganisha matendo kwa Kiswahili cha kawaida.
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Huonyesha kwamba walitenda bila kukawia na kudumisha msisitizo wa uharaka unaopatikana mara kwa mara katika Marko.
- source_word: ἀφέντες
  choice: wakaziacha
  rationale: Kirai hiki huonyesha tendo lililotangulia tendo kuu; muundo wa Kiswahili wenye vitenzi vinavyofuatana unawasilisha jambo hilo kwa kawaida bila kuongeza wazo la kuziacha kabisa.
- source_word: τὰ δίκτυα
  choice: nyavu
  rationale: Nomino yenyewe inatosha kwa Kiswahili katika muktadha huu; hakuna haja ya kuongeza “zao,” ambalo halijaelezwa wazi katika Kigiriki.
- source_word: ἠκολούθησαν
  choice: wakamfuata
  rationale: Huhifadhi maana halisi ya kwenda nyuma yake pamoja na dokezo la kuwa wafuasi wake, bila kulipanua kwa ufafanuzi wa kitheolojia.
- source_word: αὐτῷ
  choice: -m-
  rationale: Kiambishi cha yambwa katika “wakamfuata” kinarejelea Yesu kama ilivyo kwa kiwakilishi cha Kigiriki, bila kubadili kiwakilishi kuwa jina.
theological_decisions:
- issue: Dokezo la uanafunzi katika ἠκολούθησαν
  choice: wakamfuata
  alternative: wakawa wanafunzi wake
  rationale: “Wakamfuata” huhifadhi kwa pamoja tendo la kimwili na maana inayochipuka ya uanafunzi. Ufafanuzi wa “wakawa wanafunzi wake” ungeamua wazi jambo ambalo matini imelieleza kwa ufupi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Alama ya tanbihi imewekwa baada ya sentensi na mbadala unaonyesha maana nyingine ya εὐθὺς.
