base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: sw
  text: Mara palepale, katika sinagogi lao, palikuwa na mtu mwenye roho najisi[a][b], naye akapaza sauti,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi ya maneno ya Kigiriki, “akiwa katika roho najisi.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine husema “aliyepagawa na roho najisi”; huo ni ufafanuzi wa usemi wa Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara palepale
  rationale: Huwasilisha mwendo wa haraka wa simulizi unaosisitizwa mara kwa mara na Marko, bila kuleta wazo la jambo lisilotazamiwa ambalo linaweza kudokezwa na “ghafla.”
- source_word: ἦν
  choice: palikuwa na
  rationale: Hii ni sentensi ya kuwapo; “palikuwa na” ni Kiswahili cha kawaida kinachoonyesha kuwapo kwa mtu mahali palipotajwa.
- source_word: συναγωγῇ αὐτῶν
  choice: sinagogi lao
  rationale: “Sinagogi” hutaja wazi mahali pa kusanyikia Wayahudi katika muktadha huu, na “lao” huhifadhi αὐτῶν.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: “Mtu” ni tafsiri ya kawaida na ya asili ya ἄνθρωπος; muktadha na viwakilishi vinavyofuata vinaonyesha kuwa ni mwanamume.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: mwenye roho najisi
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha uhusiano wa mtu huyo na roho najisi bila kuongeza moja kwa moja tafsiri pana ya kwamba alikuwa amepagawa.
- source_word: ἀκαθάρτῳ
  choice: najisi
  rationale: “Najisi” huhifadhi maana za uchafu wa kidini na kimaadili zinazohusishwa na neno hili katika masimulizi ya Injili.
- source_word: ἀνέκραξεν
  choice: akapaza sauti
  rationale: Kitenzi hiki kinaonyesha kilio cha sauti kubwa; “akapaza sauti” ni cha asili na hakibainishi kupita kiasi hisia ya kilio hicho.
theological_decisions:
- issue: Jinsi ya kutafsiri ἐν πνεύματι ἀκαθάρτῳ katika maelezo ya mateso ya kiroho
  choice: mwenye roho najisi
  alternative: akiwa katika roho najisi; aliyepagawa na roho najisi
  rationale: Muundo wa Kigiriki kwa ukaribu zaidi ni “katika roho najisi,” lakini huo si usemi wa kawaida katika Kiswahili. “Mwenye roho najisi” huwasilisha dai la maandiko kuhusu uwepo wa roho huyo bila kuongeza dhana ya “kupagawa,” ambayo ni ufafanuzi unaowezekana lakini si maneno halisi ya kifungu hiki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mara palepale” inadumisha kasi ya simulizi la Marko; “akapaza sauti” ni wazi kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa mara baada ya usemi unaohusika.
