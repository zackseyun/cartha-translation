  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: sw
  text: akisema, “Tuna nini nawe[a], Yesu Mnazareti[b]? Je, umekuja kutuangamiza? Ninajua wewe ni nani—Mtakatifu wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuna nini cha kufanya nawe?” Usemi wa Kigiriki ni nahau inayoonyesha kujitenga au uhasama.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Yesu wa Nazareti.” Kigiriki: “Yesu Mnazareti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kauli endelevu ya Kigiriki inaunganisha maneno haya na tendo lililotangulia; “akisema” ni ya kawaida na inaendeleza sentensi kwa ufasaha.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Tuna nini nawe
  rationale: Hii inahifadhi muundo na nguvu ya nahau ya kujitenga au kupinga, huku ikiwa usemi unaoeleweka katika Kiswahili. Tanbihi inaeleza maana yake ya kinahau.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Yesu Mnazareti
  rationale: “Mnazareti” hudumisha umbo la kivumishi/jina la utambulisho la Ναζαρηνέ badala ya kuligeuza moja kwa moja kuwa maelezo ya kijiografia.
- source_word: ἦλθες
  choice: umekuja
  rationale: Wakati timilifu wa Kiswahili unaonyesha kuja ambako matokeo au kusudi lake ni muhimu katika hali ya sasa.
- source_word: ἀπολέσαι
  choice: kutuangamiza
  rationale: “Kuangamiza” linaonyesha uharibifu kamili unaokusudiwa hapa na linafaa katika muktadha wa pepo kukabiliwa na Yesu.
- source_word: ἡμᾶς
  choice: tu- / sisi
  rationale: Kiambishi cha wingi “tu-” kinahifadhi nafsi ya kwanza wingi ya Kigiriki, jambo muhimu katika kauli ya msemaji.
- source_word: οἶδά σε τίς εἶ
  choice: Ninajua wewe ni nani
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha wazi tamko la kumtambua Yesu bila kuongeza ufafanuzi.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Mtakatifu wa Mungu
  rationale: Uandishi kwa herufi kubwa unaonyesha kuwa kirai hiki kinatumika kama cheo, na “wa Mungu” huhifadhi uhusiano wa kimilikishi wa Kigiriki bila kufafanua zaidi.
theological_decisions:
- issue: Cheo cha Kikristo katika utambuzi wa pepo
  choice: Mtakatifu wa Mungu
  alternative: Yule Mtakatifu wa Mungu
  rationale: “Mtakatifu wa Mungu” kinahifadhi cheo chenye uzito wa Kikristo bila kukipanua kuwa ungamo kamili zaidi au kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tuna nini nawe” ni kifupi na chenye nguvu ya makabiliano; tanbihi huzuia nahau hiyo kueleweka kwa maana ya kawaida tu. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
