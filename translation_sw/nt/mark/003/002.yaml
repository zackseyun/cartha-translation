  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: sw
  text: Nao walikuwa wakimwangalia kwa makini ili waone kama angemponya siku ya Sabato[a], wapate kumshtaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina umbo la wingi, “siku za Sabato,” ambalo linaweza kutumiwa kiidioma kumaanisha siku ya Sabato.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: walikuwa wakimwangalia kwa makini
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea, na kitenzi hiki hapa kina maana ya kumchunguza kwa makini, katika muktadha wa uhasama.
- source_word: εἰ
  choice: ili waone kama
  rationale: Baada ya tendo la kuangalia kwa makini, muundo huu wa Kiswahili unaonyesha kwa kawaida swali lisilo la moja kwa moja.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato[a]
  rationale: Ingawa Kigiriki kina umbo la wingi, umbo hilo linaweza kutumiwa kiidioma kumaanisha siku ya Sabato; umoja ni wa kawaida na wazi zaidi katika Kiswahili.
- source_word: θεραπεύσει
  choice: angemponya
  rationale: Wakati ujao katika swali lisilo la moja kwa moja baada ya kitenzi cha wakati uliopita unaelezwa kwa kawaida kwa masharti ya Kiswahili; 'ponya' inafikisha maana ya θεραπεύω hapa.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: wapate kumshtaki
  rationale: Muundo wa ἵνα pamoja na subjunctive unaonyesha kusudi. 'Kumshtaki' huhifadhi maana ya kumlaumu au kuleta shtaka bila kudai kwamba tayari kulikuwa na kesi rasmi.
theological_decisions:
- issue: Nia ya waliokuwa wakimwangalia
  choice: Uangalizi wao ulikusudia kupata sababu ya kumshtaki Yesu.
  alternative: Walikuwa wakitafuta msingi wa kumfungulia mashtaka rasmi.
  rationale: κατηγορέω inaweza kuwa na maana ya kisheria, lakini mstari unasema tu walitaka kumshtaki; tafsiri haiongezi hatua rasmi ya kisheria ambayo haijaelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo 'walikuwa wakimwangalia kwa makini' unaonyesha uangalizi ulioendelea; 'wapate kumshtaki' ni wa asili na huhifadhi wazi kusudi la uhasama.
