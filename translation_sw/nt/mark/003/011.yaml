base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: sw
  text: Na kila mara roho wachafu walipomwona, walianguka mbele yake[a] na kupiga kelele wakisema, “Wewe ni Mwana wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walijitupa chini mbele yake.” Kitenzi cha Kigiriki kinaweza kumaanisha kuanguka mbele ya mtu kwa unyenyekevu au kwa kusihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: roho wachafu
  rationale: Hii ni tafsiri ya moja kwa moja na iliyozoeleka katika simulizi za Injili; inadumisha maana ya uchafu bila kuifasiri zaidi kuwa ‘roho waovu.’
- source_word: ὅταν
  choice: kila ... walipo-
  rationale: 'Muundo huu wa Kiswahili unaonyesha tukio lililojirudia: kila mara walipomwona, walitenda vivyo hivyo.'
- source_word: ἐθεώρουν
  choice: walipomwona
  rationale: ‘Kumwona’ ni usemi wa kawaida na wa kutosha katika muktadha huu; hali ya kurudiwa imeonyeshwa na ‘kila.’
- source_word: προσέπιπτον αὐτῷ
  choice: walianguka mbele yake
  rationale: Inahifadhi tendo la kimwili la kuanguka mbele ya Yesu bila kulifasiri moja kwa moja kuwa ibada.
- source_word: ἔκραζον
  choice: kupiga kelele
  rationale: Inaonyesha nguvu na sauti kubwa ya κράζω kwa Kiswahili cha kawaida cha simulizi.
- source_word: λέγοντα
  choice: wakisema
  rationale: Kirai tegemezi kinaambatana kiasili na ‘kupiga kelele’ na kuanzisha maneno yaliyosemwa.
- source_word: Σὺ εἶ
  choice: Wewe ni
  rationale: Kiwakilishi cha wazi ‘Wewe’ kinadumisha msisitizo uliopo katika Kigiriki kwa njia ya kawaida ya Kiswahili.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Inadumisha uzito wa jina hili la kimasiha na kikristo kwa usemi unaotambulika na ulio sahihi.
theological_decisions:
- issue: Iwapo kuanguka kwa roho wachafu mbele ya Yesu kutafsiriwe kuwa kuabudu au kusujudu tu
  choice: walianguka mbele yake
  alternative: walimsujudia / walimwabudu
  rationale: προσπίπτω inaweza kumaanisha kuanguka mbele ya mtu kwa unyenyekevu, ombi, heshima, au utiisho. Mstari hautaji wazi kuwa roho hao walitoa ibada; hivyo tafsiri inadumisha tendo lenyewe na kuacha maana yake ya kitheolojia iamuliwe na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘kila ... walipo-’ umetumiwa kuwasilisha hali ya kurudiwa kwa tendo. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya kimsamiati kuhusu προσπίπτω imehifadhiwa vya kutosha katika matini bila kuhitaji ufafanuzi wa pembeni.
