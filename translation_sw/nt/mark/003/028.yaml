  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: sw
  text: Amin, nawaambia kwamba wanadamu[a] watasamehewa dhambi zote na makufuru yote watakayoyatamka;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wana wa wanadamu.” Msemo huu wa Kigiriki wenye asili ya Kisemiti unamaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amin
  rationale: Katika kauli nzito ya Yesu, “Amin” ni neno linalotambulika katika Kiswahili na linahifadhi uzito wa uthibitisho wa kauli hiyo.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni kauli ya kawaida na ya moja kwa moja katika Kiswahili, ikihifadhi nafsi ya kwanza na w مخاط مخاط? direct plural address.
- source_word: πάντα
  choice: zote ... yote
  rationale: Ujumla wa πάντα umeonyeshwa kwa upatanisho wa Kiswahili katika “dhambi zote” na “makufuru yote,” bila kuupanua kuwa vitu vyote kwa ujumla.
- source_word: ἀφεθήσεται
  choice: watasamehewa
  rationale: Katika muktadha wa dhambi, ἀφίημι humaanisha kusamehe; muundo wa kutendwa wa Kiswahili unahifadhi maana hiyo.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: wanadamu[a]
  rationale: “Wanadamu” ni Kiswahili cha asili na kinachoeleweka kwa watu wote kwa msemo huu wa Kisemiti unaowarejelea binadamu kwa ujumla. Tanbihi inahifadhi umbo halisi zaidi la Kigiriki.
- source_word: τὰ ἁμαρτήματα
  choice: dhambi
  rationale: Neno hili linarejelea matendo ya dhambi; “dhambi” ni istilahi ya kawaida, sahihi na yenye hadhi katika Kiswahili.
- source_word: αἱ βλασφημίαι
  choice: makufuru
  rationale: “Makufuru” yanahifadhi uzito wa kidini wa βλασφημίαι katika muktadha huu kuliko maneno mapana kama matusi au kashfa.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: yote watakayoyatamka
  rationale: Kauli hii inaonyesha wigo usiofungwa wa makufuru yatakayotamkwa; “watakayoyatamka” ni ya asili na inaweka wazi kwamba yanahusisha usemi.
theological_decisions:
- issue: Upeo wa ahadi ya msamaha ukilinganishwa na onyo linalofuata kuhusu kumkufuru Roho Mtakatifu
  choice: Mstari huu umetafsiriwa kama tamko pana la msamaha bila kuingiza hapa sharti au ubaguzi unaotajwa katika mstari unaofuata.
  alternative: Kuweka kikomo kinachodokezwa ndani ya mstari huu wenyewe.
  rationale: Kigiriki cha mstari huu kinasema kwa upana kwamba dhambi zote na makufuru yatasamehewa; onyo linalofuata linapaswa kubaki na mvutano wake wa kifasihi na kitheolojia badala ya kuingizwa mapema.
- issue: Msemo wa kiume wa jumla τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Kutumia “wanadamu” katika matini na kuweka umbo halisi zaidi katika tanbihi.
  alternative: Kutumia “wana wa wanadamu” moja kwa moja katika matini kuu.
  rationale: Katika muktadha huu msemo huo unamaanisha watu wote, si wanaume pekee. “Wanadamu” huwasilisha maana hiyo kwa Kiswahili sanifu bila kudokeza kimakosa cheo cha “Mwana wa Adamu”; tanbihi huhifadhi taarifa kuhusu umbo la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Amin” huhifadhi uzito wa kauli ya Yesu, huku mpangilio wa sentensi ukibaki wa kawaida katika Kiswahili. Alama ya nuktamkato nusu imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
