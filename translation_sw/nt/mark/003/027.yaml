id: MRK.3.27
reference: Mark 3:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: sw
  text: Lakini hakuna mtu anayeweza kuingia katika nyumba ya mtu mwenye nguvu na kupora mali zake[a] bila kwanza kumfunga huyo mtu mwenye nguvu[b]; ndipo atakapoipora nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vyake”; kwa maana halisi zaidi, “vyombo/vitu vyake.”
    reason: lexical_alternative
  - marker: b
    text: “Mtu mwenye nguvu” ni sehemu ya mfano wa Yesu kuhusu kumshinda Shetani; tafsiri inadumisha picha hiyo badala ya kuweka maana yake wazi katika matini kuu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha utofautishaji na shtaka na hoja iliyotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: οὐδεὶς δύναται
  choice: hakuna mtu anayeweza
  rationale: Inahifadhi kauli ya kutowezekana kwa namna ya kawaida katika Kiswahili.
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: kuingia katika nyumba
  rationale: Inatoa kwa ufasaha tendo la kuingia ndani ya nyumba bila kulazimisha muundo wa kishiriki wa Kigiriki.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: mtu mwenye nguvu
  rationale: Kivumishi kimetumiwa kama nomino; tafsiri hii ni ya kawaida na inadumisha kurudiwa kwa picha hiyo.
- source_word: τὰ σκεύη αὐτοῦ
  choice: mali zake
  rationale: Katika muktadha wa kupora nyumba, neno hilo linamaanisha vitu au mali za mwenye nyumba, si vyombo pekee.
- source_word: διαρπάσαι / διαρπάσει
  choice: kupora / atakapoipora
  rationale: ‘Kupora’ linaonyesha kunyakua mali kwa nguvu na kuhifadhi nguvu ya kitenzi cha Kigiriki.
- source_word: ἐὰν μὴ πρῶτον
  choice: bila kwanza
  rationale: Inaeleza sharti la lazima na mpangilio wa matendo kwa Kiswahili cha asili.
- source_word: δήσῃ
  choice: kumfunga
  rationale: Inahifadhi picha halisi ya kumzuia mtu mwenye nguvu kwa kumfunga, bila kuifanya kuwa maelezo ya kiroho.
- source_word: καὶ τότε
  choice: ndipo
  rationale: Muundo ‘ndipo ...’ unaonyesha kwa mkazo wa kawaida kwamba uporaji unafuata baada ya sharti la kwanza kutimizwa.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: atakapoipora nyumba yake
  rationale: Inadumisha wakati ujao na picha pana ya kupora nyumba au milki yake.
theological_decisions:
- issue: Maana ya kimfano ya ‘mtu mwenye nguvu’ katika hoja ya Yesu kuhusu Shetani
  choice: Kudumisha mfano huo bila kumtaja Shetani moja kwa moja katika matini kuu.
  alternative: Kutafsiri wazi kuwa ‘Shetani’ au kutumia ‘mwenye nguvu’ kwa namna isiyo ya picha.
  rationale: Muktadha unaelekeza kwa Shetani, lakini Kigiriki kinatoa mfano wa mtu mwenye nguvu. Kutunza picha kunazuia tafsiri kugeuka kuwa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa urahisi. Muundo ‘ndipo atakapoipora’ unatoa matokeo baada ya sharti; viashiria vya tanbihi [a] na [b] vimewekwa karibu na maneno yanayohusika.
