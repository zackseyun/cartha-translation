  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: sw
  text: Na ufalme ukigawanyika wenyewe kwa wenyewe, ufalme huo hauwezi kusimama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachoendeleza hoja iliyotangulia kwa njia ya moja kwa moja.
- source_word: ἐὰν
  choice: uki-
  rationale: Kiambishi cha masharti katika “ukigawanyika” kinatoa maana ya “ikiwa” kwa Kiswahili cha kawaida na fasaha.
- source_word: βασιλεία
  choice: ufalme
  rationale: Hapa neno linaonyesha ufalme kama jumuiya au dola, si utawala kama dhana isiyo halisi.
- source_word: ἐφ’ ἑαυτὴν
  choice: na kujipinga wenyewe
  rationale: Kauli hii inaeleza upinzani wa ndani; “kujipinga wenyewe” ni ya asili katika Kiswahili na inaweka wazi kwamba sehemu za ufalme zinapingana.
- source_word: μερισθῇ
  choice: ukigawanyika
  rationale: Huhifadhi wazo la kugawanywa au kutengana bila kutaja aliyesababisha mgawanyiko.
- source_word: οὐ δύναται
  choice: hauwezi
  rationale: Ni kauli fupi na ya kawaida inayowasilisha kutokuwa na uwezo.
- source_word: σταθῆναι
  choice: kusimama
  rationale: Huhifadhi sitiari ya kubaki imara au kuendelea kuwapo.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ufalme huo
  rationale: Huhifadhi urudiaji wa nomino pamoja na nguvu ya kiashiria cha Kigiriki kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili na upeo wa msemo
  choice: Kutafsiri kama kanuni ya jumla ndani ya hoja ya Yesu bila kuongeza dai pana la kisiasa au la kiteolojia.
  alternative: Kuufanya msemo kuwa fundisho pana kuhusu falme zote za kisiasa au kuhusu Shetani zaidi ya muktadha huu.
  rationale: Aya hii inatumika kama mfano katika hoja ya Yesu; tafsiri ihifadhi uzito wake wa kimethali bila kupanua madai ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “ukigawanyika na kujipinga wenyewe” unaeleza wazi mgawanyiko wenye uhasama huku “kusimama” kikihifadhi sitiari ya chanzo.
