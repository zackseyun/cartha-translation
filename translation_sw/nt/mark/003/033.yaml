base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: sw
  text: Akawajibu, akasema, “Mama yangu ni nani, au ndugu zangu ni akina nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Akawajibu
  rationale: Kiswahili cha kawaida huunganisha kirai cha Kigiriki ‘akiwa amewajibu … anasema’ katika kitenzi kimoja cha masimulizi. Hii huwasilisha jibu la Yesu kwa wale waliozungumza naye bila kufanya sentensi kuwa nzito.
- source_word: Τίς
  choice: ni nani / ni akina nani
  rationale: ‘Nani’ huuliza utambulisho wa mtu; ‘akina nani’ ni namna ya kawaida ya Kiswahili inapoulizwa kuhusu watu wengi.
- source_word: μήτηρ
  choice: mama
  rationale: ‘Mama’ ni neno la kawaida, lenye heshima, na linalolingana moja kwa moja na neno la Kigiriki.
- source_word: ἢ
  choice: au
  rationale: ‘Au’ huhifadhi kiunganishi cha Kigiriki kinachotenganisha sehemu mbili za swali, badala ya kukibadili kuwa ‘na’.
- source_word: ἀδελφοί
  choice: ndugu zangu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili kwa jamaa wa kizazi kimoja. Ingawa halionyeshi jinsia peke yake, muktadha wa karibu unarejelea wale waliotajwa kama ndugu zake Yesu; ‘kaka’ ingeweza kudokeza bila sababu kwamba wote walikuwa wakubwa kuliko Yesu.
theological_decisions:
- issue: Maana ya kifamilia ya ἀδελφοί
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume / kaka zangu
  rationale: Tafsiri inahifadhi neno la kawaida la kifamilia bila kuamua hapa kwa njia ya kimadhehebu aina kamili ya uhusiano wao na Yesu. Haiongezi ‘dada,’ ambayo haipo katika nomino ya Kigiriki ya kiume iliyo katika muktadha huu.
- issue: Umoja na wingi katika swali
  choice: Mama yangu ni nani, au ndugu zangu ni akina nani?
  alternative: Ni nani mama yangu au ndugu zangu?
  rationale: Kigiriki kina kitenzi cha umoja kinachopatana na nomino ya kwanza, ‘mama,’ kisha kinafuatwa na ‘ndugu’ katika wingi. Kiswahili kinarudia kiarifu kwa wingi ili swali lieleweke vizuri, bila kuondoa tofauti kati ya sehemu hizo mbili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi na chenye heshima. ‘Akawajibu’ ni cha asili zaidi kuliko kuiga moja kwa moja muundo wa Kigiriki, huku tanbihi ikihifadhi mtindo hai wa Marko.
