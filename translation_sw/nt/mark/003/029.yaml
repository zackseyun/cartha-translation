base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: sw
  text: lakini yeyote anayemkufuru Roho Mtakatifu hatasamehewa kamwe[a], bali ana hatia ya dhambi ya milele.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hana msamaha hata milele,” yaani, “hatasamehewa kamwe” au “hana msamaha milele.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anawajibika kwa dhambi ya milele.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati zina “hukumu ya milele” badala ya “dhambi ya milele.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: lakini yeyote
  rationale: ὃς pamoja na ἄν huanzisha kauli ya jumla kuhusu mtu yeyote; δέ hapa huonyesha tofauti na kauli iliyotangulia.
- source_word: βλασφημήσῃ
  choice: anayemkufuru
  rationale: Kitenzi hiki humaanisha kukufuru au kusema kwa dharau nzito; umbo la Kiswahili linaonyesha tendo la jumla na pia linalenga nafsi, yaani Roho Mtakatifu.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: εἰς baada ya βλασφημέω huonyesha anayelengwa na kufuru; kiambishi -m- katika ‘anayemkufuru’ kinawasilisha maana ya ‘dhidi ya’ kwa Kiswahili cha kawaida.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: hatasamehewa kamwe
  rationale: Kirai hiki ni ‘hana msamaha hata milele’ kwa muundo wa karibu zaidi; ‘hatasamehewa kamwe’ ni Kiswahili cha asili kinachohifadhi nguvu ya ukanushi wa kudumu.
- source_word: ἀλλὰ
  choice: bali
  rationale: ‘Bali’ huonyesha tofauti yenye nguvu kati ya kutosamehewa na kuwa na hatia.
- source_word: ἔνοχός ἐστιν
  choice: ana hatia
  rationale: ἔνοχος inaweza kumaanisha kuwa na hatia au kuwajibika chini ya adhabu; ‘ana hatia’ inafaa kwa muundo wa jenitivi unaofuata bila kuufafanua kupita kiasi.
- source_word: αἰωνίου ἁμαρτήματος
  choice: ya dhambi ya milele
  rationale: Hufuata moja kwa moja usomaji wa SBLGNT, ἁμαρτήματος, ‘dhambi,’ huku αἰωνίου ikitafsiriwa ‘ya milele.’
theological_decisions:
- issue: Asili ya kosa lisilosameheka
  choice: Kuhifadhi maneno ya moja kwa moja kuhusu kumkufuru Roho Mtakatifu
  alternative: Kulifafanua kuwa kukataa kwa makusudi na kwa kudumu ushuhuda wa Roho, au kuhusisha kazi ya Roho na pepo
  rationale: Muktadha husaidia kuelewa kauli, lakini aya yenyewe haitoi ufafanuzi huo. Tafsiri haipaswi kuondoa mvutano wa kitheolojia kwa kuongeza fasiri.
- issue: Tofauti ya maandishi mwishoni mwa aya
  choice: dhambi ya milele
  alternative: hukumu ya milele au adhabu ya milele
  rationale: Maandishi ya SBLGNT yaliyotolewa yana αἁμαρτήματος, ‘dhambi’; tofauti ya hati nyingine imewekwa katika tanbihi.
- issue: Maana ya ἔνοχος pamoja na αἰωνίου ἁμαρτήματος
  choice: ana hatia ya dhambi ya milele
  alternative: anawajibika kwa dhambi ya milele
  rationale: ‘Ana hatia’ ni ya kawaida na wazi, lakini maana ya kuwajibika kisheria inawezekana pia na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kumkufuru’ huhifadhi uzito wa kidini wa βλασφημέω; ‘hatasamehewa kamwe’ ni ya kawaida zaidi kuliko muundo halisi ‘hana msamaha hata milele.’ Alama zote za tanbihi zimo katika matini kuu.
