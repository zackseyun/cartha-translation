lexical_decisions:
- source_word: ἐποίησεν
  choice: akawaweka rasmi
  rationale: Ingawa kitenzi hiki kwa msingi kinaweza kumaanisha ‘alifanya,’ hapa kinamaanisha kuwaweka au kuwateua watu kumi na wawili kuwa kundi maalumu. ‘Akawaweka rasmi’ ni Kiswahili cha kawaida kinachoonyesha tendo hilo bila kudokeza kwamba aliwaumba.
- source_word: δώδεκα
  choice: watu kumi na wawili
  rationale: Kigiriki kinasema tu ‘kumi na wawili’ bila nomino. Kiswahili huhitaji kiashirio cha ngeli ili maana iwe wazi; ‘watu kumi na wawili’ huhifadhi maana bila kuongeza cheo cha ‘mitume.’
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: ili wawe pamoja naye
  rationale: ‘Ili’ huonyesha kusudi la ἵνα pamoja na hali tegemezi, na sentensi ni ya asili na wazi kwa wasomaji wa Kiswahili.
- source_word: ἀποστέλλῃ
  choice: awatume kwenda
  rationale: Kitenzi kinamaanisha kutuma, mara nyingi kwa kusudi au kazi fulani. ‘Awatume kwenda’ huleta wazi mwendo unaodokezwa bila kuingiza cheo cha kiufundi cha ‘mitume.’
- source_word: κηρύσσειν
  choice: kuhubiri
  rationale: Kitenzi hiki humaanisha kutangaza hadharani au kuhubiri. ‘Kuhubiri’ ni usemi mfupi na wa kawaida katika muktadha huu; ‘kutangaza’ ni tafsiri nyingine halali.
theological_decisions:
- issue: Iwapo cheo cha ‘mitume’ kiongezwe katika matini kuu
  choice: Kutokiongeza cheo cha ‘mitume’ katika matini kuu.
  alternative: ‘Naye akawaweka rasmi watu kumi na wawili, ambao pia aliwaita mitume...’
  rationale: Matini ya SBLGNT iliyotolewa haisemi ‘ambao pia aliwaita mitume.’ Kwa hiyo tafsiri kuu inafuata ushahidi huo, huku tofauti ya maandishi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unadumisha makusudi mawili yanayoonyeshwa na vifungu viwili vya ἵνα. Alama zote za tanbihi zimewekwa katika matini kuu.
