  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: sw
  text: Kwa maana yeyote anayefanya mapenzi ya Mungu, huyu[a] ndiye ndugu yangu wa kiume, ndugu yangu wa kike, na mama yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huyu ndiye.” Kigiriki kina kiwakilishi cha kuonyesha chenye mkazo, kwa maana halisi “huyu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: yeyote anayefanya
  rationale: Muundo wa kiwakilishi pamoja na ἄν na kitenzi cha hali tegemezi unaonyesha sharti la jumla lisilomhusu mtu maalumu; “yeyote anayefanya” ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa lugha yenye hadhi na iliyozoeleka.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: mapenzi ya Mungu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaolingana moja kwa moja na maana ya Kigiriki ya kutenda yale anayotaka Mungu.
- source_word: οὗτος
  choice: huyo ndiye
  rationale: Kiwakilishi cha kuonyesha kina mkazo. Muundo “huyo ndiye” unahifadhi mkazo huo na huepuka kutumia kiwakilishi cha jinsia ya kiume pekee.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: ndugu yangu wa kiume, ndugu yangu wa kike, na mama yangu
  rationale: Majina yote matatu ya uhusiano wa kifamilia yamehifadhiwa wazi. “Ndugu wa kiume” huepuka maana ya umri inayoweza kuletwa na “kaka,” huku “ndugu wa kike” ikilingana na ἀδελφή bila kugeuza orodha kuwa neno la jumla.
theological_decisions:
- issue: Uwakilishi wa jinsia katika mtenda mmoja anayetajwa kwa mahusiano ya jinsia zote
  choice: huyo ndiye
  alternative: yeye ndiye
  rationale: Kigiriki kina kiwakilishi cha umoja chenye mkazo, lakini kinataja ndugu wa kiume, ndugu wa kike, na mama. “Huyo ndiye” huhifadhi umoja na mkazo bila kumfanya mhusika asikike kana kwamba lazima awe mwanamume.
- issue: Asili ya lugha ya Yesu kuhusu familia
  choice: kuhifadhi majina halisi ya kifamilia kwa matumizi ya kimajazi
  alternative: mwanafamilia wangu
  rationale: Yesu anatumia majina mahususi ya ukoo kueleza upya uhusiano wa kifamilia kwa msingi wa kufanya mapenzi ya Mungu. Kuyahifadhi kunatunza nguvu ya kiteolojia na ya balagha ya kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndugu yangu wa kiume” na “ndugu yangu wa kike” zimetumiwa kwa usahihi wa kijinsia na ili kuepuka kudokeza umri kama ambavyo “kaka” au “dada” huweza kufanya katika matumizi fulani.
