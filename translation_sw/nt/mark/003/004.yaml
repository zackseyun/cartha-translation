  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: sw
  text: Naye akawaambia, “Je, ni halali siku ya Sabato[a] kutenda mema au kutenda mabaya, kuokoa uhai au kuua?” Lakini wao walikaa kimya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “siku za Sabato,” umbo la wingi lililotumiwa kwa kawaida kumaanisha “siku ya Sabato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: ni halali
  rationale: Katika mjadala huu kuhusu masharti ya Sabato, neno hili linauliza jambo linaloruhusiwa kwa mujibu wa sheria; “ni halali” linaonyesha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa Kigiriki kina umbo la wingi, huu ni usemi wa kawaida unaorejelea Sabato. Umoja ni wa asili zaidi katika Kiswahili na unafaa mazingira ya tukio hili.
- source_word: ἀγαθοποιῆσαι
  choice: kutenda mema
  rationale: Huhifadhi maana ya kufanya jambo jema au lenye manufaa na kulinganisha moja kwa moja na tendo baya.
- source_word: κακοποιῆσαι
  choice: kutenda mabaya
  rationale: Kitenzi kinaweza kumaanisha kufanya uovu au madhara. “Kutenda mabaya” huhifadhi upana wa kimaadili wa neno bila kulifanya liwe tu tendo la kujeruhi.
- source_word: ψυχὴν σῶσαι
  choice: kuokoa uhai
  rationale: Katika ulinganisho na kuua, ψυχή humaanisha uhai wa mtu, si hasa nafsi isiyo ya mwili.
- source_word: ἀποκτεῖναι
  choice: kuua
  rationale: Hili ndilo neno la moja kwa moja na lisiloingiza wazo maalumu la mauaji ya jinai au hukumu ya kifo.
- source_word: ἐσιώπων
  choice: wakanyamaza
  rationale: Humaanisha kwamba hawakutoa jibu na waliendelea kuwa kimya; umbo hili ni la asili katika simulizi la Kiswahili.
theological_decisions:
- issue: Usemi wa Sabato katika mjadala kuhusu sheria
  choice: siku ya Sabato katika matini, huku wingi wa Kigiriki ukielezwa katika tanbihi
  alternative: siku za Sabato
  rationale: Wingi wa Kigiriki ni usemi wa kawaida unaoweza kurejelea Sabato moja. Kutumia umoja huzuia dhana isiyokusudiwa ya Sabato nyingi huku tanbihi ikidumisha uwazi kuhusu umbo la chanzo.
- issue: Ulinganisho kati ya kutenda mema na kutenda mabaya
  choice: kutenda mema au kutenda mabaya
  alternative: kutenda mema au kudhuru
  rationale: “Kutenda mabaya” huhifadhi mkazo mpana wa kimaadili wa maneno mawili ya Kigiriki na pia haifuti uhusiano wa kimuktadha na kuokoa au kuua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Sentensi imedumisha muundo wa swali lenye jozi mbili za ulinganisho. “Naye” linaendeleza simulizi, na “wao” linatia mkazo kwa kiasi kinacholingana na οἱ δέ.
