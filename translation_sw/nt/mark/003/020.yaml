base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: sw
  text: Anaingia ndani ya nyumba[a], na umati unakusanyika tena, hivi kwamba hata wao hawawezi kula mkate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumbani.” Kigiriki kinasema kihalisi “ndani ya nyumba,” lakini usemi huo unaweza kumaanisha kurudi nyumbani.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kula mkate”; yaani, kula chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Anaingia
  rationale: Kitenzi cha wakati uliopo kimedumishwa ili kuhifadhi usimulizi hai wa Marko; katika muktadha huu kuingia kunaeleza mwendo wa kuja ndani ya nyumba kwa Kiswahili cha kawaida.
- source_word: εἰς οἶκον
  choice: ndani ya nyumba
  rationale: Nomino haina kibainishi wala kiwakilishi cha umilikaji, hivyo tafsiri haijasema kwamba ilikuwa nyumba fulani au nyumba yake. Maana ya ‘nyumbani’ imehifadhiwa katika tanbihi.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: umati unakusanyika tena
  rationale: Mpangilio huu ni wa asili katika Kiswahili, unadumisha umati kuwa kiima, na πάλιν kutaja kurudiwa kwa tukio.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: hivi kwamba hawawezi
  rationale: Muundo wa matokeo wa ὥστε pamoja na kitenzi-jina umetafsiriwa wazi; nafsi ya wingi inadumisha rejeo la αὐτούς bila kuongeza majina yasiyotajwa katika mstari.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: hata kula mkate
  rationale: Tafsiri inadumisha neno halisi ‘mkate,’ huku tanbihi ikieleza matumizi yake ya kawaida kumaanisha kula chakula.
