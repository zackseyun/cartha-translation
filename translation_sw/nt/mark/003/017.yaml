  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: sw
  text: na Yakobo mwana wa Zebedayo, na Yohana, ndugu yake Yakobo (aliwapa jina[a] la Boanerge, yaani, Wana wa Ngurumo),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “majina” (wingi); huenda wingi huo unatumiwa kwa maana ya pamoja kuhusu lakabu moja waliyopewa ndugu hao wawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Ἰάκωβος, linalotambulika kwa urahisi katika Agano Jipya.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: mwana wa Zebedayo
  rationale: Muundo wa makala pamoja na hali ya umilikaji humtambulisha Yakobo kwa uhusiano wake na baba yake; ‘mwana wa Zebedayo’ ni Kiswahili cha kawaida na sahihi.
- source_word: Ἰωάννην
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: ndugu yake Yakobo
  rationale: Katika muktadha huu ἀδελφός humaanisha ndugu wa kiume wa familia. Kiswahili ‘ndugu yake Yakobo’ ni cha asili na hakihitaji kuongeza neno ‘wa kiume’ kwa kuwa watu hawa wanajulikana kwa majina yao.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: aliwapa jina
  rationale: Ingawa ἐπιτίθημι kwa msingi ni ‘kuweka juu ya,’ pamoja na ὀνόματα humaanisha kumpa au kumwekea mtu jina. Umoja ‘jina’ unasomeka kwa kawaida kwa kuwa ndugu hao wawili walipewa lakabu moja ya pamoja; wingi wa Kigiriki umeelezwa katika tanbihi.
- source_word: Βοανηργές
  choice: Boanerge
  rationale: Lakabu ya Kisemiti imenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa, kwa kuwa matini yenyewe pia hutoa maana yake.
- source_word: ὅ ἐστιν
  choice: yaani
  rationale: Neno ‘yaani’ huanzisha kwa ufupi na kwa kawaida ufafanuzi wa maana ya lakabu hiyo.
- source_word: Υἱοὶ Βροντῆς
  choice: Wana wa Ngurumo
  rationale: Tafsiri hii inahifadhi picha halisi na yenye nguvu ya lakabu. ‘Wana’ ni wingi wa ‘mwana,’ na ‘ngurumo’ hutoa maana ya βροντή kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Namna ya kuwasilisha lakabu ya Yakobo na Yohana
  choice: Kuhifadhi umbo lililonukuliwa ‘Boanerge’ na kulifafanua kuwa ‘Wana wa Ngurumo’
  alternative: Kutaja maana ‘Wana wa Ngurumo’ pekee bila umbo ‘Boanerge’
  rationale: Matini yenyewe huhifadhi lakabu ya lugha ya kigeni pamoja na ufafanuzi wake. Kuweka vyote viwili kunadumisha maelezo ya simulizi bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kifungu kimeachwa katika muundo wa orodha unaoendelea kutoka mistari iliyotangulia. Majina ya watu yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia; alama ya tanbihi imewekwa moja kwa moja baada ya neno linalohusika.
