  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: sw
  text: Akawatazama huku na huku wale walioketi kwa duara kumzunguka, akasema, “Tazama, mama yangu na ndugu zangu![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “ndugu zangu wa kiume.” Kigiriki husema “ndugu wa kiume,” lakini kundi lililomzunguka Yesu huenda lilikuwa na wanawake pia.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Akawatazama
  rationale: Kitenzi hiki kinaonyesha Yesu akielekeza macho yake kwa watu waliomzunguka. Muundo wa mfululizo ‘aka-’ ni wa kawaida katika simulizi la Kiswahili na unaonyesha tendo lililotangulia kusema kwake.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: wale waliokuwa wameketi kumzunguka
  rationale: ‘Waliokuwa wameketi’ huhifadhi hali ya kuketi, na ‘kumzunguka’ huwasilisha wazo la kuwa pande zote zake; kutaja ‘katika duara’ kungeweza kudokeza mpangilio mkamilifu kuliko lazima ya Kigiriki.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, Kiswahili cha simulizi kwa kawaida hutumia mfululizo wa ‘aka-’; ‘akasema’ hudumisha uhai na mtiririko wa masimulizi bila kuwa ngumu.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira kwa watu aliowatazama; ‘Tazama’ ni wa sasa, wenye heshima, na si wa kizamani kupita kiasi.
- source_word: μήτηρ
  choice: mama yangu
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja katika muktadha.
- source_word: ἀδελφοί
  choice: ndugu zangu wa kiume
  rationale: ‘Ndugu’ peke yake katika Kiswahili haionyeshi jinsia. Nyongeza ‘wa kiume’ huhifadhi umbo la Kigiriki la wingi wa kiume, huku tanbihi ikieleza uwezekano wa matumizi mapana kwa kundi lenye wanawake pia.
theological_decisions:
- issue: Neno la kifamilia ἀδελφοί ni la wingi wa kiume, ingawa kundi lililomzunguka Yesu huenda lilikuwa na wanawake pia.
  choice: ndugu zangu wa kiume
  alternative: ndugu zangu
  rationale: Matini kuu huhifadhi jinsia ya neno la Kigiriki bila kuamua kimya kimya kwamba wanawake wametengwa na maana pana. Tanbihi inaweka wazi uwezekano wa rejeo linalojumuisha wanaume na wanawake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘aka-’ umetumiwa kwa mtiririko wa kawaida wa simulizi; sintaksia imewekwa wazi na rahisi kueleweka.
