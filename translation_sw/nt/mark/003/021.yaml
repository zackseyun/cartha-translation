base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: sw
  text: Nao watu wake wa karibu waliposikia, walitoka ili kumkamata, kwa maana walikuwa wakisema, “Amerukwa na akili.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hayuko katika hali yake ya kawaida.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: watu wake wa karibu
  rationale: Usemi huu wa Kigiriki ni wa kimethali na unaweza kumaanisha watu wa nyumbani kwake, familia yake, au watu wa mzunguko wake wa karibu. Tafsiri hii ni ya kawaida katika Kiswahili na haibani maana kuwa familia pekee.
- source_word: ἀκούσαντες
  choice: waliposikia habari hizo
  rationale: Kishiriki cha aoristi kimetafsiriwa kwa kishazi cha wakati. Kirai “habari hizo” kinaweka wazi kwamba walisikia kuhusu mambo yaliyokuwa yakitokea katika muktadha, bila kutaja habari ambazo Kigiriki hakizitaji moja kwa moja.
- source_word: ἐξῆλθον
  choice: waliondoka kwenda
  rationale: Katika muktadha huu kitenzi kinaonyesha kuanza safari au kutoka walikokuwa ili kumfuata Yesu; “waliondoka kwenda” ni Kiswahili cha asili kuliko tafsiri ya neno kwa neno “walitoka.”
- source_word: κρατῆσαι
  choice: kumkamata
  rationale: Kitenzi kina maana ya kumshika kwa nguvu au kumtia chini ya udhibiti. “Kumkamata” huhifadhi uzito huo bila kudai kwamba ilikuwa arresti rasmi ya kisheria.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo wa wakati usiotimilika unaonyesha usemi uliokuwa ukiendelea au kurudiwa; “walikuwa wakisema” huhifadhi hali hiyo.
- source_word: ἐξέστη
  choice: Amerukwa na akili
  rationale: Katika matumizi haya neno linatoa madai kwamba mtu hayuko katika hali ya kawaida ya kiakili. Usemi huu unaeleweka katika Kiswahili cha sasa na huhifadhi ukali wa shtaka bila kutumia lugha ya kitabibu.
theological_decisions:
- issue: Utambulisho wa οἱ παρ’ αὐτοῦ
  choice: watu wake wa karibu
  alternative: familia yake; watu wa nyumbani kwake; watu wake
  rationale: Muktadha wa karibu unaweza kuelekeza kwa familia ya Yesu, lakini usemi wenyewe hautumii neno la moja kwa moja la undugu. Tafsiri kuu imehifadhi upana huo, na uwezekano wa familia umeelezwa katika tanbihi.
- issue: Maana ya ἐξέστη
  choice: Amerukwa na akili
  alternative: Hayuko katika hali yake ya kawaida; amepagawa na wazimu
  rationale: Kauli hiyo ni tathmini ya wasemaji kuhusu hali ya Yesu, si uthibitisho wa msimulizi. Tafsiri imehifadhi madai yao kwa uwazi bila kuyageuza kuwa uchunguzi wa kitabibu au wa kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wake wa karibu” huhifadhi utata wa usemi wa Kigiriki; “amerukwa na akili” ni usemi wazi na wa kawaida unaowasilisha shtaka la wasemaji.
