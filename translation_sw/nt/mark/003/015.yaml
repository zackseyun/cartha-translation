  text: and to have authority to cast out demons[a].
translation:
  language: sw
  text: na kuwa na mamlaka ya kutoa pepo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufukuza pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha kishazi hiki cha kitenzi-jina na madhumuni yaliyotangulia katika uteuzi wa wale Kumi na Wawili.
- source_word: ἔχειν
  choice: kuwa na
  rationale: Kitenzi-jina cha wakati uliopo cha ἔχω; “kuwa na” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili huonyesha mamlaka au haki aliyopewa mtu ya kutenda, si nguvu tupu pekee; linafaa katika muktadha wa Yesu kuwapa wale Kumi na Wawili jukumu na uwezo wa kulitenda.
- source_word: ἐκβάλλειν
  choice: kutoa
  rationale: Katika muktadha wa pepo, “kutoa pepo” ni usemi wa kawaida, wazi, na wenye maana ya kuwafukuza watoke ndani ya mtu.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: Neno la Kigiriki linamaanisha pepo waovu; “pepo” ni istilahi ya kawaida ya Biblia ya Kiswahili. Halibadilishwi kuwa “roho wachafu,” kwa sababu hayo si maneno yaliyotumiwa katika aya hii.
theological_decisions:
- issue: Maana ya ἐξουσίαν katika agizo walilopewa wanafunzi
  choice: mamlaka
  alternative: nguvu
  rationale: “Mamlaka” huhifadhi wazo la uwezo na haki waliyopewa na Yesu ya kutenda, badala ya kuonyesha nguvu ya kimuujiza kama uwezo usiohusishwa na aliyewatuma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutoa pepo” ni usemi wa kawaida na unaoeleweka; tanbihi huhifadhi nguvu ya maana ya ἐκβάλλειν kwa mbadala “kuwafukuza.”
