  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: sw
  text: Naye akaingia tena katika sinagogi. Huko palikuwa na mtu mwenye mkono uliokauka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono ulionyauka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἰσῆλθεν πάλιν
  choice: Naye akaingia tena
  rationale: “Naye” huendeleza simulizi na kudumisha rejeo la mtendaji wa kiume bila kuongeza jina lisilomo katika Kigiriki; “akaingia tena” huwasilisha kwa kawaida tendo la kuingia lililorudiwa.
- source_word: εἰς συναγωγήν
  choice: katika sinagogi
  rationale: Kiswahili hakina vibainishi vinavyolingana moja kwa moja na “a/the”; hivyo “katika sinagogi” huhifadhi kutobainishwa kwa Kigiriki bila kulazimisha kuwa ni sinagogi fulani au mojawapo.
- source_word: ἦν ἐκεῖ ἄνθρωπος
  choice: Huko palikuwa na mtu
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huonyesha kwa pamoja kuwepo kwa mtu na mahali alikokuwapo.
- source_word: ἐξηραμμένην ἔχων τὴν χεῖρα
  choice: mwenye mkono uliokauka
  rationale: “Mwenye” huwasilisha muundo wa kirai cha Kigiriki kwa Kiswahili cha kawaida, huku “uliokauka” ukidumisha picha ya mkono uliokauka au kudhoofika sana bila kuamua kimyakimya kwamba ulikuwa umepooza.
