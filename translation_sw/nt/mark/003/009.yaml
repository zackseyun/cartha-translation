  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: sw
  text: Akawaambia wanafunzi wake kwamba mashua ndogo iwe tayari kwa ajili yake kwa sababu ya umati, ili wasimsongamanie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasimponde kwa kumsonga.” Kitenzi cha Kigiriki kinaweza kumaanisha kubana, kusongamania, au kuponda kwa shinikizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: akawaambia
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida kwamba Yesu aliwaelekeza wanafunzi wake, huku ukifuata simulizi linaloendelea.
- source_word: μαθηταῖς
  choice: wanafunzi
  rationale: “Wanafunzi” ni neno la kawaida na linalofaa katika Injili kwa uhusiano wa mfuasi anayejifunza kwa mwalimu.
- source_word: πλοιάριον
  choice: mashua ndogo
  rationale: Huhifadhi maana ya udogo iliyomo katika πλοιάριον kwa Kiswahili cha kawaida.
- source_word: προσκαρτερῇ
  choice: iwe tayari
  rationale: Katika muktadha huu kitenzi kinaonyesha mashua kuendelea kupatikana tayari kwa matumizi ya Yesu; “iwe tayari” ni wazi na ya asili.
- source_word: αὐτῷ
  choice: kwa ajili yake
  rationale: Huonyesha kwamba mashua ilipaswa kupatikana kwa matumizi ya Yesu.
- source_word: διὰ τὸν ὄχλον
  choice: kwa sababu ya umati
  rationale: διά pamoja na hali ya kushutumu hapa huonyesha sababu.
- source_word: θλίβωσιν
  choice: wasimsongamanie
  rationale: Neno hili linaweza kumaanisha kubana, kusonga kwa shinikizo, au kuponda. “Kumsongamania” linafaa kwa tukio la umati unaombana mtu bila kuamua kwamba angepondwa kabisa.
