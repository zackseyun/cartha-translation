  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: sw
  text: na kutoka Yerusalemu, na kutoka Idumea, na kutoka ng’ambo ya Yordani[a], na kutoka maeneo yanayozunguka Tiro na Sidoni[b], umati mkubwa wa watu ulimjia, ukiwa umesikia mambo aliyokuwa akifanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande mwingine wa Yordani.” Usemi wa Kigiriki unaweza kumaanisha eneo lililo upande wa pili wa Mto Yordani.
    reason: lexical_alternative
  - marker: b
    text: Au, “maeneo ya karibu na Tiro na Sidoni.” Kigiriki husema “yanayozunguka Tiro na Sidoni,” kikimaanisha eneo linalozizunguka, si lazima miji yenyewe tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo yote aliyokuwa akifanya.” Kiwakilishi cha Kigiriki kinaweza kuwa na maana inayojumuisha yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: kutoka Yerusalemu
  rationale: ἀπό pamoja na hali ya umilikishi huonyesha mahali pa asili; “Yerusalemu” ni jina la kawaida la mahali katika Kiswahili.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: kutoka Idumea
  rationale: Hudumisha maana ya eneo walikotoka na kutumia umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Yordani
  rationale: πέραν pamoja na hali ya umilikishi huelekeza eneo lililo upande mwingine wa mpaka unaotajwa; “ng’ambo ya Yordani” ni usemi wa asili na mfupi.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: maeneo yanayozunguka Tiro na Sidoni
  rationale: περί hapa ina maana ya mahali yanayozunguka miji hiyo, si lazima miji yenyewe tu.
- source_word: πλῆθος πολύ
  choice: umati mkubwa
  rationale: Huwakilisha kundi kubwa sana kwa lugha ya kawaida na yenye hadhi.
- source_word: ἀκούοντες
  choice: uliposikia
  rationale: Huwasilisha kitendo cha kusikia kinachohusiana kwa karibu na kuja kwa umati, bila kulazimisha waziwazi kuwa ndicho kilichosababisha kuja kwao.
- source_word: ὅσα ἐποίει
  choice: mambo aliyokuwa akifanya
  rationale: “Mambo” huwakilisha wingi wa ὅσα, na “aliyokuwa akifanya” huhifadhi hali endelevu ya kitenzi cha wakati usiotimilika.
- source_word: ἦλθον πρὸς αὐτόν
  choice: ulimjia
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendo kuelekea kwa mtu huyo; upatanisho wa umoja unafuata nomino “umati.”
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... na
  rationale: Kurudia “na” kunahifadhi mtindo wa Marko wa kuorodhesha maeneo kwa kuyalimbikiza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya orodha ndefu ili isomeke kwa urahisi, huku marudio ya “na” na mfuatano wa maeneo vikihifadhiwa. Alama za tanbihi zimewekwa kwenye vipashio husika; tanbihi ya “ng’ambo ya Yordani” haijaunganishwa kimakosa na Yerusalemu.
