  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: sw
  text: Naye anamwambia yule mtu mwenye mkono uliokauka, “Inuka, uje katikati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati wa sasa wa kihistoria umehifadhiwa ili kudumisha usimulizi hai wa Marko; kiambishi cha mtendewa kinaonyesha wazi kuwa anamwambia mtu huyo.
- source_word: ἀνθρώπῳ
  choice: mtu
  rationale: “Mtu” ni neno la kawaida na la asili katika Kiswahili kwa ἀνθρώπῳ; muktadha tayari unamtambulisha mhusika bila kuhitaji kuongeza “mwanaume.”
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: mwenye mkono uliopooza
  rationale: Hii ni tafsiri ya asili ya hali ya mkono usiofanya kazi katika Kiswahili cha sasa, bila kudai chanzo au utambuzi maalumu wa kitabibu.
- source_word: Ἔγειρε
  choice: Simama
  rationale: Katika muktadha huu amri inaweza kumaanisha kuinuka au kusimama; “Simama” ni fupi, ya moja kwa moja, na ya kawaida.
- source_word: εἰς τὸ μέσον
  choice: katikati
  rationale: Neno hili huhifadhi wazo la mahali pa kati; pamoja na “Simama” linaweza kueleweka kama kusimama katikati, huku muktadha ukidokeza kujitokeza mbele ya waliokuwapo.
