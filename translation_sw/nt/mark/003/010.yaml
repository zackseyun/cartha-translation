base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: sw
  text: Kwa maana alikuwa amewaponya watu wengi, kiasi kwamba wote waliokuwa na mateso walikuwa wakimsonga ili wamguse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς
  choice: watu wengi
  rationale: Nomino ‘watu’ imewekwa wazi kwa Kiswahili cha kawaida, kwa kuwa kivumishi pekee ‘wengi’ hapa kingesikika pungufu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa sentensi hii inaeleza sababu ya hali ya umati iliyotajwa katika muktadha.
- source_word: ἐθεράπευσεν
  choice: alikuwa amewaponya
  rationale: Wakati timilifu wa zamani unaonyesha kuwa uponyaji uliotangulia ndio uliosababisha msongamano huo.
- source_word: ὥστε
  choice: hata
  rationale: Katika muundo ‘..., hata ...’, neno hili linaonyesha matokeo kwa Kiswahili cha asili na kinachoeleweka.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: wakamsonga
  rationale: Katika muktadha wa umati, kitenzi kinaonyesha watu wakijisukuma kwa nguvu kumwelekea na kumsonga Yesu; tafsiri hii huepuka usemi usio wa kawaida ‘kumwangukia’.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi la kusonga kwao kuelekea kwake.
- source_word: αὐτοῦ ἅψωνται
  choice: wamguse
  rationale: ἅπτομαι pamoja na jenitivi humaanisha kugusa; ‘wamguse’ ni sahihi na ya kawaida.
- source_word: ὅσοι
  choice: wote
  rationale: Inahifadhi maana jumuishi ya ‘wote waliokuwa’.
- source_word: εἶχον μάστιγας
  choice: waliokuwa na mateso
  rationale: μάστιγας, kihalisi ‘mijeledi,’ limetumiwa kwa mfano kuhusu taabu kali au maradhi; ‘mateso’ huhifadhi upana na uzito wake bila kuifanya istilahi ya kitabibu tu.
theological_decisions:
- issue: Maana ya μάστιγας katika muktadha wa uponyaji
  choice: mateso
  alternative: maradhi; mapigo
  rationale: Neno la Kigiriki ni pana na lenye picha kali kuliko istilahi mahsusi ya kitabibu. ‘Mateso’ linaonyesha hali nzito ya wanaotaabika bila kuamua kwamba kila hali ilikuwa ugonjwa wa aina moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi uhusiano wa sababu, matokeo, na kusudi katika Kigiriki.
