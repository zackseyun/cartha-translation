  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: sw
  text: Kisha mama yake na ndugu zake wa kiume wakaja. Wakiwa wamesimama nje, wakatuma ujumbe kwake, wakimwita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza simulizi; “Kisha” ni cha kawaida katika Kiswahili na kinaonyesha mfuatano wa matukio.
- source_word: ἔρχονται
  choice: wakaja
  rationale: Ni wakati wa sasa wa kihistoria katika simulizi la Kigiriki; wakati uliopita wa Kiswahili unafaa kwa usimulizi wa kawaida.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: mama yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya umilikaji.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ndugu zake
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa uhusiano huu na halilazimishi uamuzi kuhusu hali kamili ya undugu ambao mstari wenyewe hauufafanui.
- source_word: ἔξω στήκοντες
  choice: Wakiwa wamesimama nje
  rationale: Inawasilisha hali inayoandamana na tendo kuu kwa Kiswahili cha asili na wazi.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: wakatuma ujumbe kwake
  rationale: Kitenzi hakitaji wazi kitu au mtu aliyetumwa, lakini muktadha unaonyesha kwamba taarifa ilipelekwa kwa Yesu; “kutuma ujumbe” ni Kiswahili cha kawaida bila kubainisha mjumbe ambaye hajatajwa.
- source_word: καλοῦντες αὐτόν
  choice: wakimwita
  rationale: Inadumisha maana ya kumwita au kumtaka aje bila kuongeza maelezo yasiyotajwa na matini.
theological_decisions:
- issue: Maana kamili ya “ndugu zake”
  choice: Kutumia “ndugu zake” bila kufafanua aina kamili ya uhusiano wao wa kifamilia
  alternative: “ndugu zake wa kiume” au maelezo yanayowataja wazi kuwa ndugu wa damu
  rationale: ἀδελφοί ni wingi wa kiume na kwa kawaida humaanisha ndugu wa kiume, lakini mstari huu hauelezi kwa undani uhusiano wao wa kifamilia. “Ndugu zake” ni la kawaida katika Kiswahili na huepuka kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi mbili zimetumiwa ili kuepuka msururu mzito wa vishazi huku uhusiano wa matendo ukibaki wazi.
