base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: sw
  text: na Andrea, na Filipo, na Bartholomayo, na Mathayo, na Tomaso, na Yakobo mwana wa Alfayo, na Thadayo, na Simoni Mkananayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, Mkananayo; huenda maana yake ni “Mwenye Juhudi,” kama katika Luka 6:15. Hapa neno hilo halimaanishi kwamba Simoni alikuwa mtu wa Kanaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Huhifadhi mtiririko wa orodha iliyounganishwa kwa viunganishi katika Kigiriki.
- source_word: Ἀνδρέαν
  choice: Andrea
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: Φίλιππον
  choice: Filipo
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: Βαρθολομαῖον
  choice: Bartholomayo
  rationale: Unukuzi wa jina unaoeleweka na unaotumiwa katika mapokeo ya Biblia ya Kiswahili.
- source_word: Μαθθαῖον
  choice: Mathayo
  rationale: Umbo sanifu la jina katika Kiswahili.
- source_word: Θωμᾶν
  choice: Tomaso
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Yakobo mwana wa Alfayo
  rationale: Muundo wa nomino katika hali ya umilikaji unamtambulisha Yakobo kwa uhusiano wake na Alfayo; ‘mwana wa’ huwasilisha maana hiyo kwa uwazi.
- source_word: Θαδδαῖον
  choice: Thadayo
  rationale: Unukuzi wa jina unaolingana na matumizi ya kawaida ya Kiswahili.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simoni Mkananayo
  rationale: Huhifadhi kwa karibu lakabu ya Kigiriki Καναναῖος bila kuibadili kimya kimya kuwa tafsiri ya maana inayokisiwa; tanbihi inaeleza maana yake inayowezekana.
theological_decisions:
- issue: Maana ya lakabu Καναναῖος ya Simoni
  choice: Mkananayo
  alternative: Mwenye Juhudi; Mkanani
  rationale: Neno hilo huenda linaakisi neno la Kiaramu lenye maana ya ‘mwenye juhudi,’ kama linavyoonyeshwa na ζηλωτής katika Luka 6:15, wala si asili ya kikabila ya Kanaani. Hata hivyo, kwa kuwa Marko ametumia umbo Καναναῖος, maandishi makuu yanahifadhi lakabu hiyo na tanbihi kufafanua uwezekano wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko rahisi na wa heshima. Marudio ya ‘na’ yamehifadhiwa kwa sababu mstari huu ni mwendelezo wa orodha ya mitume katika sentensi ya awali.
