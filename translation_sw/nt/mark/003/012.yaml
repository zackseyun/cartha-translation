translation:
  language: sw
  text: Naye aliwakataza kwa ukali mara nyingi ili wasimfanye ajulikane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasimfunue,” “wasimtangaze hadharani,” au, kwa lugha rasmi zaidi, “wasimdhihirishe.”
