lexical_decisions:
- source_word: πολλὰ
  choice: mara nyingi
  rationale: Limetumiwa kama kielezi pamoja na ἐπετίμα na linaonyesha tendo lililorudiwa au lililosisitizwa; “mara nyingi” ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: ἐπετίμα
  choice: aliwakemea vikali
  rationale: Kitenzi hiki kinaonyesha kukemea au kuamuru kwa nguvu. “Aliwakemea vikali” kinafaa kwa Yesu anapozungumza na pepo wachafu na kuhifadhi uzito wa amri.
- source_word: αὐτοῖς
  choice: wa- katika “aliwakemea”
  rationale: Kiambishi cha yambwa cha wingi kinawarejelea pepo wachafu waliotajwa katika muktadha wa karibu.
- source_word: ἵνα μὴ
  choice: wasim-
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida jambo lililokatazwa na kukemewa huku ukihifadhi maana ya kusudi au maudhui ya amri.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: wasimfanye ajulikane
  rationale: Kirai hiki humaanisha kumfanya mtu afahamike au awe wazi hadharani. Tafsiri hii ni ya kawaida na haiongezi utambulisho ambao mstari wenyewe hautaji.
theological_decisions:
- issue: Asili ya amri ya Yesu kwa pepo wachafu
  choice: Amri imetafsiriwa kuwa katazo la kuwafanya wengine wamjue Yesu, bila kufafanua zaidi ya yale yanayosemwa na mstari.
  alternative: Kusema wazi kwamba waliamriwa wasimtangaze kuwa Mwana wa Mungu, au kutafsiri kama amri ya jumla ya kunyamaza.
  rationale: Muktadha wa karibu unahusu kufichua utambulisho wa Yesu, lakini mstari huu wenyewe unasema tu wasimfanye ajulikane. Tafsiri inadumisha upeo na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha mstari na simulizi lililotangulia; “alikemea vikali mara nyingi” huhifadhi nguvu na urudiaji wa tendo bila kufanya sentensi kuwa nzito.
