base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: sw
  text: Mafarisayo walitoka, na mara moja wakaanza kupanga njama pamoja na wafuasi wa Herode dhidi yake, jinsi ya kumwangamiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi kulingana na muktadha, “kumuua” au “kumwondolea uhai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: wakatoka
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha tendo linaloandamana na simulizi; “wakatoka” ni la kawaida na huhifadhi mwendo wao kutoka mahali pa tukio.
- source_word: εὐθὺς
  choice: mara
  rationale: “Mara” huwasilisha uharaka unaosisitizwa mara nyingi katika Injili ya Marko kwa Kiswahili cha kawaida na kifupi.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: pamoja na wafuasi wa Herode
  rationale: μετά inaonyesha ushirika. “Wafuasi wa Herode” hueleza kwa uwazi kundi lililohusishwa na masilahi ya utawala wa Herode, badala ya kutumia jina la kundi lisiloeleweka kwa wasomaji wengi.
- source_word: συμβούλιον ἐδίδουν
  choice: wakaanza kupanga njama
  rationale: Nahau hii ina maana ya kushauriana au kupanga; kusudi la uadui linalofuata linaonyesha kwamba ulikuwa mpango wa njama. “Wakaanza” huonyesha hali ya kuanza au kuendelea iliyomo katika ἐδίδουν.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: κατά hapa ina maana ya uadui, si ya kumhusu tu.
- source_word: ὅπως
  choice: jinsi ya
  rationale: Katika muundo huu ὅπως hutambulisha kusudi au njia iliyokusudiwa; “jinsi ya” huendana kwa kawaida na kupanga njama huku ikihifadhi wazo la namna ya kutekeleza mpango.
- source_word: ἀπολέσωσιν
  choice: kumwangamiza
  rationale: ἀπόλλυμι inaweza kumaanisha kuangamiza, kuharibu, au kuua. “Kumwangamiza” huhifadhi upana wake, huku muktadha ukionyesha kwamba nia yao ilikuwa kuondoa uhai wake.
theological_decisions:
- issue: Iwapo nia ya viongozi itajwe wazi kuwa kumuua Yesu katika andiko kuu
  choice: Kutumia neno pana “kumwangamiza” katika andiko kuu.
  alternative: kumuua; kumwondolea uhai
  rationale: Kitenzi cha Kigiriki ἀπόλλυμι kina maana pana kuliko kuua pekee, ingawa katika muktadha huu njama hiyo inaelekea wazi kwenye kifo cha Yesu. Andiko kuu linahifadhi upana huo, na tanbihi inaonyesha maana iliyo wazi zaidi katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wafuasi wa Herode” limetumiwa kwa uwazi kuliko jina la kundi lililotoholewa; “kupanga njama” hufanya uadui wa mashauriano hayo ueleweke bila kuongeza wazo lisilokuwamo katika muktadha.
