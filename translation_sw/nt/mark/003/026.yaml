  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: sw
  text: Na ikiwa Shetani ameinuka dhidi yake mwenyewe na amegawanyika, hawezi kusimama, bali mwisho wake umefika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “bali ana mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi ya jumla.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: ameinuka dhidi yake mwenyewe
  rationale: Kirai hiki kinaonyesha kuinuka kwa uhasama dhidi ya nafsi yake; tafsiri hii ni ya asili katika Kiswahili na inadumisha picha ya tendo la kupinga.
- source_word: ἐμερίσθη
  choice: kugawanyika
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha mgawanyiko wa ndani; katika muundo huu, ‘kugawanyika’ ni fasaha na hakilazimishi kutaja aliyesababisha mgawanyiko.
- source_word: οὐ δύναται στῆναι
  choice: hawezi kusimama
  rationale: Tafsiri hii inadumisha sitiari ya Kigiriki ya kutoweza kusimama au kudumu, huku ikiwa wazi kwa msomaji wa Kiswahili.
- source_word: ἀλλὰ τέλος ἔχει
  choice: bali mwisho wake umefika
  rationale: Kwa Kiswahili cha kawaida, hii huwasilisha kwa uwazi matokeo ya kutoweza kudumu. Maana halisi zaidi, ‘ana mwisho,’ imehifadhiwa katika tanbihi ili kutoweka uzito wote juu ya wakati wa mwisho huo.
theological_decisions:
- issue: Kauli kuhusu mwisho wa Shetani
  choice: Imefasiriwa kama matokeo ya kimantiki ya Shetani kujigawa dhidi yake mwenyewe katika hoja ya Yesu.
  alternative: Kuisoma kama tangazo kamili na la moja kwa moja kuhusu kushindwa kwake kwa mwisho katika eskatolojia.
  rationale: Muktadha unatoa hoja kwamba ufalme uliogawanyika hauwezi kudumu. Aya hii pekee haipaswi kupanuliwa ili iamue kwa undani wakati au namna ya kushindwa kwa Shetani hatimaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa hoja na sitiari ya ‘kusimama’ vimehifadhiwa.
