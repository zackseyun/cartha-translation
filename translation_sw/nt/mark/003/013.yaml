  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: sw
  text: Kisha akapanda mlimani, akawaita kwake wale ambao yeye mwenyewe aliwataka, nao wakamwendea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: akapanda
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati uliopita wa masimulizi, ulio wa kawaida katika Kiswahili; kitenzi hiki kinahifadhi wazo la kwenda juu.
- source_word: εἰς τὸ ὄρος
  choice: mlimani
  rationale: Katika muundo huu pamoja na ἀναβαίνει, neno hili linaonyesha kupanda kwenda mahali pa mlima; “mlimani” ni la asili na halilazimishi maana ya kuingia ndani ya mlima.
- source_word: προσκαλεῖται
  choice: akawaita kwake
  rationale: Kauli ya kati inaonyesha mwito wenye mwelekeo wa kuwaleta karibu naye; “akawaita kwake” ni ya kawaida na inadumisha wazo hilo.
- source_word: οὓς ἤθελεν αὐτός
  choice: wale ambao yeye mwenyewe aliwataka
  rationale: “Yeye mwenyewe” inadumisha mkazo wa αὐτός, huku “aliwataka” ikitoa maana ya kawaida ya θέλω bila kuongeza maelezo ya kiteolojia.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: wakamwendea
  rationale: Huhifadhi mwendo wa kwenda kuelekea kwake unaoonyeshwa na ἀπέρχομαι pamoja na πρὸς αὐτόν, kwa Kiswahili cha asili.
theological_decisions:
- issue: Mkazo juu ya uamuzi binafsi wa Yesu katika kuwaita
  choice: wale ambao yeye mwenyewe aliwataka
  alternative: wale aliowataka
  rationale: Kirai hiki kinadumisha mkazo wa αὐτός juu ya hatua ya Yesu mwenyewe, bila kuupanua mstari kuwa dai la mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa masimulizi umetumia viambishi vya mfuatano “aka-” na “waka-” kwa mtiririko wa asili.
