  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: sw
  text: Na nyumba ikigawanyika yenyewe kwa yenyewe, nyumba hiyo haitaweza kusimama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκία
  choice: nyumba
  rationale: Maana ya msingi ni nyumba; ingawa inaweza pia kumaanisha watu wa nyumba moja, kitenzi ‘kusimama’ kinaendeleza picha halisi ya jengo.
- source_word: ἐφ’ ἑαυτὴν
  choice: dhidi yake yenyewe
  rationale: Katika muundo huu, kirai kinaonyesha upinzani wa ndani; tafsiri hii inadumisha maana hiyo na kujirejelea kwa nomino ya ngeli ya nyumba.
- source_word: μερισθῇ
  choice: imegawanyika
  rationale: Huwasilisha hali ya kugawanyika ndani kwa ndani katika sharti la jumla, kwa Kiswahili cha kawaida.
- source_word: δυνήσεται
  choice: haitaweza
  rationale: Wakati ujao wa δύναμαι unaonyesha kutokuwa na uwezo katika matokeo ya sharti.
- source_word: σταθῆναι
  choice: kusimama
  rationale: Hudumisha picha ya jengo linalosimama huku maana ya kudumu bila kuanguka ikibaki ndani ya sitiari.
- source_word: ἡ οἰκία ἐκείνη
  choice: nyumba hiyo
  rationale: Kiwakilishi ‘hiyo’ kinahifadhi msisitizo wa ἐκείνη kwa namna ya kawaida katika Kiswahili.
- source_word: καὶ ἐὰν
  choice: Na ikiwa
  rationale: ‘Na’ linaendeleza hoja ya mstari uliotangulia, na ‘ikiwa’ linaanzisha sharti.
