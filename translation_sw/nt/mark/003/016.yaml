base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: sw
  text: Akawateua wale kumi na wawili, na akampa Simoni jina Petro[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Petro linamaanisha “mwamba.”
    reason: Maana ya jina la Kigiriki Πέτρος ni muhimu, lakini katika andiko lenyewe neno hilo linatumika kama jina la mtu.
lexical_decisions:
- source_word: ἐποίησεν
  choice: akawateua
  rationale: Ingawa kitenzi hiki kwa msingi kinaweza kumaanisha ‘alifanya,’ katika muktadha huu kinaeleza Yesu kuwaweka rasmi wale kumi na wawili kama kundi; ‘akawateua’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuongeza cheo kisichotajwa.
- source_word: τοὺς δώδεκα
  choice: wale kumi na wawili
  rationale: Kirai hiki kinarejelea kundi linalotambulika la wanafunzi kumi na wawili wa Yesu. ‘Wale kumi na wawili’ ni usemi wa asili na wazi katika Kiswahili.
- source_word: ἐπέθηκεν ὄνομα
  choice: akampa ... jina
  rationale: Nahau ya Kigiriki ina maana halisi ya ‘kuweka jina juu ya’; ‘akampa Simoni jina’ huhifadhi wazi tendo la kumpa jina huku ikiwa ya kawaida katika Kiswahili.
- source_word: Σίμωνι
  choice: Simoni
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika tafsiri za Kiswahili.
- source_word: Πέτρον
  choice: Petro
  rationale: Hapa neno hili linatumika kama jina alilopewa Simoni, kwa hiyo limetoholewa badala ya kutafsiriwa kuwa ‘Mwamba’; maana yake imewekwa katika tanbihi.
theological_decisions:
- issue: Tendo la Yesu kuhusu wale kumi na wawili
  choice: akawateua wale kumi na wawili
  alternative: akawafanya wale kumi na wawili
  rationale: ‘Akawateua’ huonyesha kwamba Yesu aliliweka kundi hili kwa kusudi maalumu, bila kuingiza istilahi ya baadaye ya kikanisa.
- issue: Jinsi ya kutafsiri Πέτρον
  choice: Petro
  alternative: Mwamba
  rationale: Kwa kuwa Πέτρον hapa ni jina la mtu, jina limetoholewa. Maana yake ya kileksika imehifadhiwa katika tanbihi badala ya kuchukua nafasi ya jina katika andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kiunganishi cha masimulizi ‘Aka-’ kinaendeleza mtiririko wa Marko, na koma ya mwisho inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
