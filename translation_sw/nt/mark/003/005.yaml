  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: sw
  text: Baada ya kuwatazama pande zote kwa hasira, huku akihuzunika kwa sababu ya ugumu wa mioyo yao, akamwambia yule mtu, “Nyosha mkono wako.” Akaunyosha, na mkono wake ukarejeshwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Akawatazama wote waliomzunguka
  rationale: Kitenzi hiki kinaonyesha kutazama pande zote watu waliokuwapo. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza mfuatano wa simulizi bila kupoteza wazo la kuwatazama kwa kuzunguka.
- source_word: μετ’ ὀργῆς
  choice: kwa hasira
  rationale: Kirai hiki huonyesha hali iliyoandamana na kutazama kwake. “Kwa hasira” ni tafsiri ya moja kwa moja, ya kawaida, isiyopunguza hisia hiyo wala kuifanya kali kupita maandishi.
- source_word: συλλυπούμενος
  choice: huku akihuzunika
  rationale: Kishiriki hiki huonyesha huzuni iliyokuwapo pamoja na hasira. “Huku akihuzunika” huhifadhi uwiano wa hisia hizo mbili kwa Kiswahili cha asili.
- source_word: ἐπὶ τῇ πωρώσει
  choice: kwa sababu ya ugumu
  rationale: ἐπί pamoja na dativu hapa huonyesha msingi au sababu ya huzuni. “Ugumu” huhifadhi sitiari ya kutokuwa sikivu kimaadili.
- source_word: τῆς καρδίας αὐτῶν
  choice: wa mioyo yao
  rationale: Ingawa Kigiriki kina nomino ya umoja “moyo” pamoja na kiwakilishi cha wingi, umoja huo unaelekea kuwa wa kijumla. Wingi “mioyo yao” ni wa kawaida na wazi katika Kiswahili bila kubadili maana.
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria katika Marko huleta uhai wa simulizi. Kiswahili kwa kawaida hutumia mfuatano wa wakati uliopita wenye kiambishi -ka-; “akamwambia” huhifadhi mwendo huo wa simulizi kwa ufasaha.
- source_word: τῷ ἀνθρώπῳ
  choice: yule mtu
  rationale: Rejeo ni kwa mwanamume maalumu aliyetajwa katika tukio. “Yule mtu” ni wazi na ya kawaida.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Nyosha mkono wako
  rationale: Amri hii inataka tendo la moja kwa moja. “Nyosha” ndiyo kauli ya kawaida ya Kiswahili katika muktadha huu na huruhusu marudio katika sentensi inayofuata.
- source_word: ἐξέτεινεν
  choice: Akaunyosha
  rationale: Hurejelea amri iliyotangulia na kuhifadhi marudio ya kitenzi bila kurudia nomino isivyo lazima.
- source_word: ἀπεκατεστάθη
  choice: ukarudishwa katika hali yake ya kawaida
  rationale: Kitenzi hiki cha kutendwa huonyesha kurejeshwa katika hali inayofaa au ya awali. Tafsiri hii ni wazi zaidi katika Kiswahili kuliko “ukarejeshwa” peke yake na haifupishi maana kuwa uponyaji wa kitabibu tu.
theological_decisions:
- issue: Hasira na huzuni za Yesu
  choice: 'Hisia zote mbili zimetafsiriwa waziwazi: “kwa hasira” na “huku akihuzunika.”'
  alternative: Kutumia “kwa ghadhabu” au kupunguza hasira kuwa “kwa kukasirika,” na kupanua huzuni kuwa “alihuzunika sana.”
  rationale: Maandishi yanamweka Yesu akiwa na hasira na huzuni kwa wakati mmoja. Tafsiri haipaswi kupunguza mojawapo wala kuongeza kiwango kisichosemwa.
- issue: Umoja wa καρδίας pamoja na kiwakilishi cha wingi
  choice: “mioyo yao”
  alternative: “moyo wao”
  rationale: Umoja wa Kigiriki unaweza kuwa wa kijumla, lakini “mioyo yao” ni wa asili zaidi katika Kiswahili kwa kundi la watu na huhifadhi wazi kwamba ugumu huo uliwahusu wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mfuatano wa vitenzi vya -ka- umetumiwa kwa simulizi la kawaida la Kiswahili; hisia za Yesu na sitiari ya ugumu wa moyo zimehifadhiwa bila ufafanuzi wa kimadhehebu.
