  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: sw
  text: Nao waandishi waliokuwa wameshuka kutoka Yerusalemu walikuwa wakisema, “Ana Beelzebuli[a],” na, “Kwa nguvu za mtawala wa pepo[b] anawafukuza pepo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Amepagawa na Beelzebuli.” Kigiriki Βεελζεβούλ; kwa mapokeo jina hili hutafsiriwa pia “Beelzebubu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkuu wa pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Hili ndilo neno la kawaida la kibiblia kwa wataalamu waliotambuliwa katika Sheria ya Kiyahudi; hapa halimaanishi wanakili tu.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: waliokuwa wameshuka kutoka Yerusalemu
  rationale: Muundo huu wa Kiswahili unasomeka kwa kawaida na kuhifadhi wazo la kushuka kutoka Yerusalemu.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huhifadhi hali endelevu au ya kurudiwa-rudiwa ya kitenzi cha wakati usiotimilika.
- source_word: Βεελζεβοὺλ
  choice: Beelzebuli
  rationale: Ni unukuzi wa umbo la Kigiriki Βεελζεβούλ uliorekebishwa kwa matamshi na tahajia ya Kiswahili.
- source_word: ἔχει
  choice: Ana
  rationale: Huhifadhi kwa ufupi nahau halisi ya Kigiriki, ‘ana [Beelzebuli],’ bila kuamua kimya-kimya ikiwa maana yake ni kupagawa au kutawaliwa.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: Kwa nguvu za mtawala wa pepo
  rationale: ἐν hapa ina maana ya chombo au nguvu inayotumiwa. ‘Kwa nguvu za’ ni Kiswahili cha kawaida kinachoonyesha kwamba shtaka ni kuwa Yesu anatenda kupitia mamlaka ya mtawala huyo.
- source_word: δαιμονίων / δαιμόνια
  choice: pepo
  rationale: Neno la kawaida na linaloeleweka la Kiswahili kwa δαιμόνιον katika muktadha huu, bila kuingiza usemi tofauti wa ‘roho wachafu.’
- source_word: ἐκβάλλει
  choice: anawafukuza
  rationale: Hutoa kwa kawaida maana ya kuwatoa kwa nguvu katika muktadha wa kutoa pepo.
theological_decisions:
- issue: Tafsiri ya shtaka Βεελζεβοὺλ ἔχει
  choice: Ana Beelzebuli
  alternative: Amepagawa na Beelzebuli
  rationale: Matini kuu huhifadhi nahau ya Kigiriki na utata wake; tanbihi inaeleza maana inayowezekana katika muktadha bila kuifanya kuwa tafsiri pekee.
- issue: Tafsiri ya ἄρχοντι
  choice: mtawala wa pepo
  alternative: mkuu wa pepo
  rationale: ‘Mtawala’ huonyesha mamlaka kwa lugha ya sasa na iliyo wazi; ‘mkuu’ ni tafsiri nyingine ya asili inayowezekana.
- issue: Nguvu ya ἐν katika shtaka
  choice: Kwa nguvu za mtawala wa pepo
  alternative: Kwa mamlaka ya mtawala wa pepo
  rationale: Kigiriki kinaweza kuonyesha chombo, nguvu, au mamlaka inayodaiwa kutumiwa. ‘Kwa nguvu za’ ni ya asili katika Kiswahili na haiungi mkono shtaka hilo kama ukweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘walikuwa wakisema’ huhifadhi hali endelevu ya Kigiriki; ‘kwa nguvu za’ huepuka Kiswahili kisicho cha kawaida cha tafsiri neno kwa neno.
