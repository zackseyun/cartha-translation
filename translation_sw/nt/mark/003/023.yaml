  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: sw
  text: Akawaita waje kwake, kisha akawaambia kwa mifano, “Shetani anawezaje kumfukuza Shetani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita waje kwake
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aliwaita wamkaribie kabla ya kusema nao; usemi huu ni wa asili katika Kiswahili na unahifadhi wazo la kuwaita kwake.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Katika Injili, παραβολή hutaja mifano au ulinganisho unaotumiwa kufundisha. Wingi wa neno umehifadhiwa bila kufafanua kupita kiasi aina ya kila mfano.
- source_word: ἔλεγεν
  choice: akasema nao
  rationale: Ingawa hali ya wakati usiotimilika inaweza kuonyesha usemi unaoendelea, katika simulizi la Kiswahili 'akasema nao' ni ya kawaida na haifanyi sentensi kuwa nzito; muktadha unaonyesha kuwa maelezo yanaendelea katika mistari inayofuata.
- source_word: Πῶς δύναται
  choice: anawezaje
  rationale: Huu ni muundo wa kawaida wa Kiswahili wa kuuliza swali la balagha kuhusu uwezekano au uwezo.
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina au cheo hiki katika Kiswahili cha Biblia na matumizi ya jumla.
- source_word: ἐκβάλλειν
  choice: kumfukuza
  rationale: Kitenzi hiki kinafaa kwa muktadha wa kuwafukuza pepo na kinaeleza kuondoa kwa nguvu bila kuongeza maelezo yasiyomo katika Kigiriki.
theological_decisions:
- issue: Nguvu ya swali la Yesu kuhusu Shetani kutenda dhidi yake mwenyewe
  choice: “Shetani anawezaje kumfukuza Shetani?”
  alternative: “Inawezekanaje Shetani amfukuze Shetani?”
  rationale: Tafsiri inadumisha swali la balagha kuhusu kutowezekana kwa shtaka hilo bila kuongeza hitimisho la kiteolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, na swali linabaki fupi na lenye nguvu.
