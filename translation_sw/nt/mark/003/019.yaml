  rationale: Kitenzi chenyewe kina maana pana ya kumkabidhi mtu, lakini katika simulizi la Injili tendo la Yuda kwa Yesu lina maana ya usaliti. Tafsiri kuu inaonyesha uzito huo wa kimuktadha, huku tanbihi ikihifadhi maana ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Yesu” limetumiwa badala ya kiwakilishi pekee ili rejeo liwe wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya “Iskariote,” sawasawa na safu ya mashahidi wa mashauriano.
