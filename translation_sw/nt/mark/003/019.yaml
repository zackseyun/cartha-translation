lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha jina la mwisho na orodha iliyotangulia.
- source_word: Ἰούδαν
  choice: Yuda
  rationale: Umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
- source_word: Ἰσκαριώθ
  choice: Iskariote
  rationale: Jina au lakabu limetoholewa badala ya kutafsiriwa kwa kubahatisha, kwa kuwa asili yake ya maana haina uhakika katika muktadha huu.
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi rejeshi cha asili kinachotambulisha maelezo zaidi kumhusu Yuda.
- source_word: καὶ
  choice: pia
  rationale: Katika kishazi rejeshi, neno hili lina nguvu ya kielezi na linaonyesha sifa nyingine ya Yuda.
- source_word: παρέδωκεν
  choice: alimsaliti
  rationale: Kitenzi kinaweza kumaanisha kumkabidhi mtu, lakini Yuda akiwa mtendaji na Yesu akiwa mtendewa, muktadha unatoa maana ya usaliti.
- source_word: αὐτόν
  choice: Yesu
  rationale: Kiwakilishi kinamrejelea Yesu. Jina limetajwa wazi kwa Kiswahili cha kawaida ili kuondoa utata unaoweza kusababishwa na mfuatano wa wahusika wa kiume katika orodha.
