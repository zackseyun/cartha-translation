base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: sw
  text: Umati ulikuwa umeketi kumzunguka, nao wakamwambia, “Tazama, mama yako na ndugu zako wa kiume wako nje wanakutafuta.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kumaanisha “kutafuta” au “kumtafuta” mtu; hapa huenda kinamaanisha wanatafuta mahali alipo Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: ulikuwa umeketi
  rationale: Kauli ya wakati usiotimilika inaonyesha hali iliyokuwa ikiendelea; muundo huu unaweka mandhari ya umati uliokuwa umeketi.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Umati ulikuwa umeketi kumzunguka
  rationale: περί pamoja na hali ya akusativi huonyesha eneo linalomzunguka mtu; tafsiri hii ni ya kawaida na inahifadhi picha ya umati kumzunguka Yesu.
- source_word: λέγουσιν
  choice: wakamwambia
  rationale: Wakati uliopo wa Kigiriki umetumika kama wakati uliopo wa kihistoria; katika masimulizi ya Kiswahili, wakati uliopita wa mfululizo unasikika kwa kawaida.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu. “Tazama” ni la sasa, lenye heshima, na linahifadhi nguvu yake ya kuelekeza fikira.
- source_word: μήτηρ
  choice: mama
  rationale: Ni neno la kawaida la uhusiano wa kifamilia na ndilo linalofaa moja kwa moja hapa.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya kawaida ya Kiswahili katika muktadha huu; bila maelezo ya ziada haifungii mjadala wa aina kamili ya uhusiano wa kifamilia.
- source_word: ἔξω
  choice: wako nje
  rationale: Kielezi hiki huonyesha mahali; Kiswahili cha kawaida huhitaji kiunganishi cha hali kulingana na wahusika wa wingi.
- source_word: ζητοῦσίν σε
  choice: wanakutafuta
  rationale: ζητέω inaweza kumaanisha kutafuta au kujaribu kumpata mtu; “wanakutafuta” ni ya kawaida na inafaa katika mazingira haya.
theological_decisions:
- issue: Maana ya ἀδελφοί
  choice: Kutafsiri kama “ndugu” bila ufafanuzi wa kiitikadi
  alternative: “ndugu wa kiume,” “jamaa,” au “ndugu zake wa kuzaliwa”
  rationale: Aya yenyewe haitoi maelezo ya aina kamili ya uhusiano wao na Yesu. “Ndugu” huhifadhi neno la kawaida la undugu bila kuingiza hitimisho la dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Umati” na “kumzunguka” vinahifadhi mandhari ya watu walioketi pande zote zake; “wakamwambia” linafuata mtiririko wa kawaida wa simulizi.
