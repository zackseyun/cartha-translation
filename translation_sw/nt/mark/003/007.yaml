  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: sw
  text: Naye Yesu akajiondoa pamoja na wanafunzi wake kuelekea baharini[a][b]. Umati mkubwa kutoka Galilaya ukamfuata, na kutoka Yudea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenda baharini.” Kihusishi cha Kigiriki kinaweza kuonyesha mwendo kuelekea upande wa bahari.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Bahari ya Galilaya. Maandishi ya Kigiriki yanasema tu “bahari.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: akajiondoa
  rationale: Kitenzi hiki kinaweza kumaanisha kuondoka au kujiondoa, mara nyingi kwa wazo la kuondoka mbele ya upinzani au msukumo. “Akajiondoa” kinahifadhi kidokezo hicho bila kudai kwamba Yesu alikimbia.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: “Wanafunzi” ni neno la kawaida la Injili kwa wale wanaojifunza kwa Yesu na kumfuata; “pamoja na” kinaonyesha wazi kuwa walikwenda naye.
- source_word: πρὸς τὴν θάλασσαν
  choice: kwenda baharini
  rationale: Neno θάλασσα ni “bahari,” na πρός pamoja na hali ya kuelekea huonyesha mwendo kwenda upande wake. Tafsiri haibadili neno hilo kuwa “ziwa,” ingawa mahali panapokusudiwa ni Bahari ya Galilaya.
- source_word: πολὺ πλῆθος
  choice: umati mkubwa
  rationale: Hii ni Kiswahili cha sasa na cha kawaida kinachoonyesha idadi kubwa ya watu bila kutumia usemi wa kizamani.
- source_word: ἠκολούθησεν
  choice: ukamfuata
  rationale: Katika muktadha huu umati ulimfuata Yesu katika mwendo; kiambishi “-m-” kinaweka mlengwa wazi kwa Kiswahili cha kawaida.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: kutoka Galilaya
  rationale: Kinataja moja kwa moja mahali umati huo ulipotoka.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: na kutoka Yudea,
  rationale: Kirai hiki kinaanzisha orodha inayoendelea katika mstari unaofuata. Kimeachwa kikiwa hakijakamilika na koma ili kuhifadhi muundo wa kifungu katika muktadha wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia “Naye” na vitenzi vya mfululizo kwa mtiririko wa kawaida. Alama zote mbili za tanbihi zimewekwa baada ya “baharini,” kwa kuwa zote zinafafanua kirai hicho; kirai cha mwisho “na kutoka Yudea,” kimehifadhiwa kama mwanzo wa orodha inayoendelea katika mstari unaofuata.
