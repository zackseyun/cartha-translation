  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: sw
  text: Naye akaendelea kuwaonya, akisema, “Jihadharini; jilindeni na chachu ya Mafarisayo na chachu ya Herode.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστέλλετο
  choice: akaendelea kuwaonya
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha tendo lililoendelea au kurudiwa. Katika muktadha huu ni onyo zito; ‘akaendelea kuwaonya’ hudumisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha yaliyomo katika onyo na kudumisha kwa njia ya asili muundo wa kishiriki wa Kigiriki.
- source_word: Ὁρᾶτε
  choice: Jihadharini
  rationale: Amri hii inadai uangalifu, si kuona kwa macho tu. ‘Jihadharini’ ni onyo la moja kwa moja na la kawaida.
- source_word: βλέπετε
  choice: jilindeni
  rationale: Amri ya pili inasisitiza ya kwanza. Kutumia kitenzi tofauti lakini chenye maana inayokaribiana kunahifadhi urudiaji wa mkazo bila kufanya Kiswahili kuwa kigumu.
- source_word: ἀπὸ
  choice: na
  rationale: Baada ya ‘jilindeni,’ Kiswahili cha kawaida hutumia ‘na’ kueleza kitu kinachopaswa kuepukwa; maana ya kujitenga na hatari inadumishwa.
- source_word: ζύμης
  choice: chachu
  rationale: ‘Chachu’ ni neno la kawaida la Kiswahili na linadumisha sitiari ya kitu kinachoenea na kuathiri donge lote bila kuifafanua ndani ya matini.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hilo; hali ya umilikaji/uhusiano inaonyeshwa na ‘ya.’
- source_word: Ἡρῴδου
  choice: Herode
  rationale: Matini inamtaja Herode mwenyewe sambamba na Mafarisayo; haipanuliwi kuwa watu wa nyumbani kwake au wafuasi wake.
theological_decisions:
- issue: Maana ya sitiari ‘chachu’
  choice: Kudumisha sitiari ya ‘chachu’ bila kuifafanua katika matini kuu.
  alternative: mafundisho; unafiki; ushawishi unaoharibu
  rationale: Muktadha na vifungu vinavyofanana vinaashiria ushawishi mbaya, lakini Marko 8:15 yenyewe haitaji kwa usahihi maana hiyo. Kudumisha sitiari kunahifadhi uwazi na mvutano wa kifasiri wa aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Urudiaji wa amri mbili umehifadhiwa kwa ‘Jihadharini; jilindeni,’ na muundo sambamba ‘chachu ya ... na chachu ya ...’ umeachwa kama ulivyo katika chanzo.
