  text: Nao walikuwa wakijadiliana wao kwa wao kwamba hawana mikate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζοντο
  choice: walikuwa wakijadiliana
  rationale: Muundo huu unaonyesha mazungumzo yaliyokuwa yakiendelea; ‘walikuwa wakijadiliana’ ni Kiswahili cha kawaida na huhifadhi hali ya tendo endelevu.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Usemi huu unaonyesha kushirikiana kwa pande zote katika mazungumzo, na ‘wao kwa wao’ ni wa asili na wazi katika Kiswahili.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha jambo walilokuwa wakijadili, si sababu; kwa hiyo ‘kwamba’ huhifadhi uhusiano wa kisintaksia.
- source_word: ἄρτους
  choice: mikate
  rationale: Nomino ya Kigiriki iko katika wingi na muktadha wa karibu unahusu mikate inayohesabika; ‘mikate’ huhifadhi habari hiyo kwa njia ya kawaida katika Kiswahili.
- source_word: οὐκ ἔχουσιν
  choice: hawakuwa na
  rationale: Ingawa Kigiriki kina wakati wa sasa ndani ya usemi usio wa moja kwa moja, Kiswahili cha masimulizi kwa kawaida hulinganisha wakati na kitenzi kikuu cha wakati uliopita; maana ya kutokuwa na mikate wakati huo inabaki wazi.
