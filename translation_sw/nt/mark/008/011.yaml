  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: sw
  text: Mafarisayo wakatokea, wakaanza kubishana naye, wakimwomba ishara kutoka mbinguni[a], wakimjaribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka angani”; lakini kirai hiki yaelekea kinamaanisha ishara inayotoka kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wakatokea
  rationale: Kitenzi kinaonyesha kuingia kwao katika tukio bila kutaja mahali walikotoka; “wakatokea” ni Kiswahili cha kawaida na hakiongezi maelezo yasiyokuwapo.
- source_word: ἤρξαντο συζητεῖν
  choice: wakaanza kubishana
  rationale: Muundo huu unaonyesha mwanzo wa tendo, na katika muktadha wa upinzani συζητέω ina maana ya kujadiliana kwa mabishano kuliko mazungumzo ya kawaida.
- source_word: αὐτῷ
  choice: naye
  rationale: Huhifadhi kiwakilishi cha Kigiriki na huonyesha kwamba walibishana pamoja naye bila kuingiza jina lisilokuwapo katika mstari.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: Walitaka awape
  rationale: Ingawa kwa karibu ni “wakitafuta kutoka kwake,” katika Kiswahili “walitaka awape” huwasilisha kwa kawaida ombi lao kwake huku likibaki tendo linaloambatana na mabishano.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” huhifadhi wazo la tendo lenye maana ya uthibitisho, badala ya kulifupisha kuwa “muujiza” tu.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Hufuata maana ya msingi na kuhifadhi uwezekano wenye nguvu wa asili au idhini ya Mungu bila kuufafanua kupita kiasi katika matini kuu.
- source_word: πειράζοντες αὐτόν
  choice: ili kumjaribu
  rationale: Kirai kishirikishi kinaeleza kusudi au nia yao ya uhasama. “Kumjaribu” hapa ni kumtia katika jaribio, si lazima kumshawishi atende dhambi.
theological_decisions:
- issue: Maana ya ishara “kutoka mbinguni”
  choice: Kudumisha kirai “kutoka mbinguni” katika matini kuu, kikidokeza hasa asili au uthibitisho wa Mungu
  alternative: Ishara kutoka angani
  rationale: Katika muktadha wa Injili, ombi linaelekea kutaka uthibitisho wa kimungu; hata hivyo, tafsiri halisi inahifadhi upeo wa neno οὐρανός na tanbihi inaonyesha maana nyingine ya kileksika.
- issue: Maana ya πειράζοντες
  choice: kumjaribu kwa nia ya kumpima au kumnasa
  alternative: kumshawishi atende dhambi
  rationale: Muktadha unaonyesha changamoto ya uhasama, si waziwazi kishawishi cha kutenda dhambi; kwa hiyo tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa usomaji wa kawaida; “Mafarisayo,” “ishara,” na “mbinguni” ni istilahi zinazoeleweka na zilizozoeleka katika mazingira ya Biblia.
