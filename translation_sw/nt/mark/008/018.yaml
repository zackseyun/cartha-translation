base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: sw
  text: Mna macho lakini hamwoni?[a] Na mna masikio lakini hamsikii? Na hamkumbuki?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ingawa mna macho, hamtambui? Na ingawa mna masikio, hamwelewi?” Kigiriki kinatumia vitenzi vya kawaida “kuona” na “kusikia,” ambavyo katika muktadha vinaweza pia kudokeza utambuzi wa kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Mna macho lakini
  rationale: Kirai cha kishirikishi kina nguvu ya kukubali hali inayotofautiana na matokeo yanayotarajiwa; Kiswahili cha kawaida huieleza kwa ‘mna ... lakini’ huku kikihifadhi ukali wa swali la balagha.
- source_word: βλέπετε
  choice: hamwoni
  rationale: ‘Kuona’ ndilo neno la moja kwa moja, na muktadha unaweza kulipa maana pana ya kutambua bila kuiweka wazi kupita kiasi katika matini kuu.
- source_word: ὦτα ἔχοντες
  choice: mna masikio lakini
  rationale: Muundo huu unalingana na kifungu cha macho na kuhifadhi ulinganifu wa maswali hayo mawili.
- source_word: ἀκούετε
  choice: hamsikii
  rationale: ‘Kusikia’ huhifadhi maana ya kawaida ya kitenzi cha Kigiriki; wazo la kutii au kuelewa linaachwa litokane na muktadha.
- source_word: μνημονεύετε
  choice: hamkumbuki
  rationale: ‘Kukumbuka’ ni tafsiri ya kawaida na ya moja kwa moja inayofaa karipio kuhusu matukio yaliyotangulia.
- source_word: καὶ
  choice: Na / Wala
  rationale: ‘Na’ huendeleza ulinganifu wa swali la pili; katika swali la mwisho ‘wala’ ni Kiswahili cha asili kinachoendeleza mfululizo hasi kwa nguvu ya kujumuisha.
- source_word: οὐ / οὐκ
  choice: ha-
  rationale: Ukanushi umeingizwa kiasili katika vitenzi vya Kiswahili vya nafsi ya pili wingi.
theological_decisions:
- issue: 'Maana ya kuona na kusikia: hisi halisi au utambuzi wa kiroho'
  choice: Kuhifadhi vitenzi vya kawaida ‘kuona’ na ‘kusikia’ katika matini kuu, huku muktadha ukidokeza kutotambua kiroho.
  alternative: Kutumia ‘kutambua’ na ‘kuelewa’ ili maana ya mfano iwe wazi moja kwa moja.
  rationale: Kigiriki kinatumia vitenzi vya kawaida vya hisi, lakini katika muktadha vinaweza kuwa na maana ya kina ya utambuzi. Tafsiri ya moja kwa moja huhifadhi pia mwangwi wa lugha ya kinabii bila kuamua maana hiyo kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mna ... lakini’ ni cha kawaida zaidi kuliko muundo mgumu wa ‘mkiwa na ...’ na huwasilisha nguvu ya kukubali hali inayopingana na matokeo. Maswali mafupi yanahifadhi sauti ya karipio.
