  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: sw
  text: Kwa maana yeyote anayetaka kuokoa uhai wake ataupoteza; lakini yeyote atakayeupoteza uhai wake kwa ajili yangu na kwa ajili ya Habari Njema atauokoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi” badala ya “uhai” kila mahali katika mstari huu; neno la Kigiriki linaweza kumaanisha “uhai” au “nafsi,” kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: uhai
  rationale: Katika muktadha huu neno hilo linamaanisha uhai wa mtu, si lazima nafsi kama sehemu isiyo ya mwili. ‘Uhai’ huhifadhi fumbo la kutaka kuokoa uhai na kuupoteza kwa ajili ya Yesu.
- source_word: σῶσαι / σώσει
  choice: kuokoa / atauokoa
  rationale: Huhifadhi ulinganifu wa kitenzi na uzito wa kauli, huku kikitofautishwa wazi na ‘kupoteza.’
- source_word: ἀπολέσει
  choice: ataupoteza
  rationale: Kwa kurejelea uhai, ‘kupoteza’ ni Kiswahili cha kawaida na hudumisha fumbo la kauli; ‘kuangamiza’ lingekuwa kali mno hapa.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: kwa ajili yangu na kwa ajili ya Habari Njema
  rationale: ‘Kwa ajili ya’ huonyesha sababu au msukumo, na kurudiwa kwake huweka wazi kuwa kauli hiyo inahusu Yesu na Habari Njema.
- source_word: εὐαγγέλιον
  choice: Habari Njema
  rationale: Ni tafsiri ya wazi na ya kawaida ya maana ya neno hilo kwa wasomaji wa Kiswahili, huku ikihifadhi dhamira kuu ya Marko.
- source_word: ὃς ... ὃς
  choice: yeyote ... yeyote
  rationale: Huwasilisha kwa kawaida maana ya jumla na isiyo na kikomo ya muundo wa Kigiriki.
- source_word: θέλῃ
  choice: anayetaka
  rationale: Ni usemi wa sasa, wazi na wa kawaida wa kuonyesha nia.
theological_decisions:
- issue: Maana ya ψυχή katika kauli hii ya fumbo
  choice: Kutumia ‘uhai’ katika matini kuu
  alternative: Kutumia ‘nafsi’
  rationale: Muktadha wa kujikana na uanafunzi unalenga kupoteza au kuokoa uhai kwa ajili ya Yesu na Habari Njema. ‘Uhai’ huepuka kuifanya maana iwe tu sehemu isiyo ya mwili, huku ‘nafsi’ ikihifadhiwa katika tanbihi kama uwezekano wa kileksika.
- issue: Rejeo la jumla la kiume katika Kigiriki
  choice: Kutumia ‘yeyote’ bila kiwakilishi cha kijinsia
  alternative: Kutumia muundo wenye ‘wake’
  rationale: Kiswahili hakihitaji kuonyesha jinsia katika muundo huu. ‘Yeyote’ huhifadhi umoja na matumizi ya jumla bila kuongeza tofauti ya kijinsia isiyolazimishwa na sarufi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa ‘kuokoa—kupoteza—kupoteza—kuokoa’ umehifadhiwa ili kuonyesha fumbo la kauli ya Yesu. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa inahusu matumizi yote mawili ya ‘uhai’.
