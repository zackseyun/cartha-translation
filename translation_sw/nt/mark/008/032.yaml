  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: sw
  text: Naye alikuwa akisema jambo hilo waziwazi[a]. Petro akamchukua kando, akaanza kumkemea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uwazi” au “kwa ujasiri.” Neno la Kigiriki linaonyesha kusema kwa uwazi, bila kuficha.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Neno hili linaonyesha kusema kwa uwazi na bila kuficha. “Waziwazi” ni Kiswahili cha kawaida kinachosisitiza uwazi wa maneno ya Yesu bila kuingiza zaidi wazo la ujasiri.
- source_word: τὸν λόγον
  choice: jambo hilo
  rationale: Katika muktadha huu, kifungu hiki kinarejelea yale ambayo Yesu alikuwa ametoka kusema kuhusu mateso, kuuawa, na kufufuka kwake. “Jambo hilo” linaunganisha sentensi na habari iliyotangulia kwa Kiswahili cha kawaida; “neno hilo” lingeakisi muundo wa Kigiriki kwa karibu zaidi lakini lingesikika lisilo la kawaida kiasi hapa.
- source_word: ἐλάλει
  choice: alikuwa akisema
  rationale: Muundo huu unahifadhi hali ya tendo lililokuwa likiendelea inayodokezwa na wakati usiotimilifu wa Kigiriki, bila kulifanya lionekane kuwa marudio ya kusisitizwa.
- source_word: προσλαβόμενος
  choice: akamchukua kando
  rationale: Katika muktadha, Petro anamtoa Yesu pembeni ili aseme naye faraghani. “Akamchukua kando” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: akaanza kumkemea
  rationale: “Akaanza” huhifadhi wazi mwanzo wa tendo, na “kumkemea” huonyesha karipio kali linalokusudiwa na ἐπιτιμάω.
theological_decisions:
- issue: Nguvu ya παρρησίᾳ katika maelezo ya Yesu kuhusu mateso yake
  choice: waziwazi
  alternative: kwa uwazi; kwa ujasiri
  rationale: Tafsiri hii inasisitiza kwamba Yesu alisema bila kuficha na kwa namna iliyoeleweka, jambo linaloeleza mwitikio wa moja kwa moja wa Petro. Haiongezi dai kwamba msisitizo mkuu ulikuwa ujasiri, ingawa maana hiyo inaweza kuwamo katika neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa vitenzi “akamchukua… akaanza” ni wa kawaida katika masimulizi, huku “alikuwa akisema” ikihifadhi hali ya tendo lililokuwa likiendelea.
