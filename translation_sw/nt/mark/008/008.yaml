base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: sw
  text: Wakala wakashiba, kisha wakakusanya vikapu saba[a] vya vipande vilivyosalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki σπυρίδας linamaanisha vikapu, labda vikapu vikubwa. Marko anatumia neno tofauti kwa vikapu katika simulizi la kuwalisha watu elfu tano (κόφινοι, 6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: wakala
  rationale: Kitenzi hiki ni taarifa ya kawaida ya tendo lililokamilika; “wakala” ni tafsiri ya moja kwa moja na ya asili katika simulizi la Kiswahili.
- source_word: ἐχορτάσθησαν
  choice: kushiba
  rationale: Katika muktadha huu χορτάζω humaanisha kula mpaka chakula kikatosha; “kushiba” ni neno la kawaida na sahihi la Kiswahili.
- source_word: ἦραν
  choice: wakakusanya
  rationale: Ingawa αἴρω kimsingi inaweza kumaanisha kuinua au kuchukua, hapa tendo ni kukusanya vipande vilivyobaki baada ya mlo.
- source_word: περισσεύματα κλασμάτων
  choice: vipande vilivyobaki
  rationale: Usemi huu unaonyesha vipande vya chakula vilivyosalia baada ya watu kula; tafsiri hii ni wazi na ya asili bila kuongeza kuwa vilikuwa vipande vya mkate pekee.
- source_word: ἑπτὰ σπυρίδας
  choice: vikapu saba
  rationale: σπυρίς ni aina ya kikapu, huenda kikapu kikubwa. Maandishi makuu yanatumia neno la kawaida “vikapu,” huku tofauti ya msamiati na ukubwa unaowezekana ikielezwa katika tanbihi.
