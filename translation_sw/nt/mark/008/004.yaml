  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: sw
  text: Wanafunzi wake wakamjibu[a], “Mtu ataweza kupata wapi mikate ya kuwashibisha watu hawa hapa, mahali pasipo na watu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wanafunzi wake wakamjibu, ‘Mtu atawezaje kuwashibisha watu hawa kwa mikate hapa nyikani?’”
    reason: Njia nyingine ya kutafsiri swali, ikisisitiza uwezekano wa kuwalisha badala ya chanzo cha mikate; pia ‘nyikani’ ni tafsiri fupi ya eneo lisilo na watu.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: wakamjibu
  rationale: Kitenzi hiki cha kawaida cha masimulizi kinaonyesha kujibu; umbo la ‘waka-’ linaunganisha tendo hili kwa kawaida na simulizi lililotangulia.
- source_word: ὅτι
  choice: alama za kunukuu
  rationale: Hapa ὅτι inaanzisha maneno ya moja kwa moja; Kiswahili cha kawaida hutumia alama za kunukuu badala ya kuitafsiri kwa neno tofauti.
- source_word: Πόθεν
  choice: kupata wapi
  rationale: Πόθεν huuliza chanzo, ‘kutoka wapi.’ Katika Kiswahili, ‘kupata wapi’ huwasilisha kwa njia ya asili swali kuhusu chanzo cha mikate, badala ya kuuliza tu mahali pa tendo la kushibisha.
- source_word: τούτους
  choice: watu hawa
  rationale: Kiwakilishi kinawarejelea watu wa umati; ‘watu hawa’ kinaweka rejeo wazi bila kulifanya lihusu wanaume pekee.
- source_word: δυνήσεταί τις
  choice: Mtu ataweza
  rationale: Huhifadhi wazo la mtu yeyote asiyeainishwa pamoja na uwezo unaotarajiwa katika wakati ujao.
- source_word: ὧδε
  choice: hapa
  rationale: Ni kielezi rahisi cha mahali na kina tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: χορτάσαι
  choice: ya kuwashibisha
  rationale: ‘Kushibisha’ linaonyesha kuwapa chakula cha kutosha mpaka watosheke, si kuwapa chakula kidogo tu.
- source_word: ἄρτων
  choice: mikate
  rationale: Nomino ya Kigiriki ni ya wingi na inataja mkate hasa; ‘mikate’ huihifadhi bila kuipanua kuwa ‘chakula’ kwa ujumla.
- source_word: ἐπ’ ἐρημίας
  choice: mahali pasipo na watu
  rationale: Kirai kinaeleza eneo lisilo na makazi au watu; tafsiri hii ni wazi na ya kawaida kuliko neno linaloweza kueleweka hasa kuwa jangwa la mchanga.
