translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umefanywa kuwa wa kawaida katika Kiswahili huku ukihifadhi swali la chanzo lililo katika Πόθεν. Alama ya tanbihi [a] imo katika matini kuu.
