id: MRK.8.34
reference: Mark 8:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: sw
  text: Baada ya kuuita umati pamoja na wanafunzi wake, akawaambia, “Mtu yeyote akitaka kuja nyuma yangu, ajikane mwenyewe, achukue msalaba wake[a], na anifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Achukue msalaba wake” huhifadhi taswira halisi ya msalaba badala ya kuifafanua kuwa kuvumilia mzigo tu.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akauita
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kusema; “akauita” ni simulizi la kawaida la Kiswahili na linadokeza kuwaita wamkaribie.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: “Umati” ni neno la kawaida na lenye heshima kwa kundi kubwa la watu katika mazingira haya.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: Linahifadhi wazi maana ya kuandamana ya σύν na kuonyesha kwamba umati na wanafunzi walihusishwa.
- source_word: Εἴ τις θέλει
  choice: Mtu yeyote akitaka
  rationale: Linahifadhi sharti la jumla na mwaliko ulio wazi kwa mtu yeyote bila kuupunguza kuwa amri ya kutaka.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: kuja nyuma yangu
  rationale: Linahifadhi taswira ya nafasi ya mfuasi nyuma ya Yesu, huku kitenzi cha mwisho ἀκολουθείτω kikibaki “anifuate.”
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: na ajikane mwenyewe
  rationale: “Ajikane mwenyewe” huhifadhi nguvu ya amri na wazo la kujikana nafsi, bila kulifupisha kuwa kuacha starehe fulani tu.
- source_word: ἀράτω
  choice: auchukue
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kuuchukua msalaba.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: msalaba wake
  rationale: Linahifadhi msalaba halisi kama taswira yenye uzito wa kihistoria na pia umilikaji binafsi unaoonyeshwa na αὐτοῦ.
- source_word: ἀκολουθείτω μοι
  choice: anifuate
  rationale: Huhifadhi amri ya wakati uliopo kwa Kiswahili cha asili; muktadha wa uanafunzi hubeba wazo la kuendelea kumfuata.
theological_decisions:
- issue: Nguvu ya masharti ya uanafunzi
  choice: 'Mwaliko wa jumla umefuatwa na amri: “na ajikane mwenyewe, auchukue … kisha anifuate.”'
  alternative: Kutumia “lazima” katika kila kishazi.
  rationale: Kigiriki kina kishazi cha sharti kisha amri za nafsi ya tatu. Muundo huu huhifadhi kwa pamoja hiari ya kutaka na madai thabiti ya uanafunzi.
- issue: Maana ya σταυρός katika muktadha
  choice: msalaba
  alternative: mzigo; mateso; chombo cha kuuawa
  rationale: Tafsiri halisi huacha taswira ya msalaba wa Kirumi ibaki na upana wake wa kitheolojia; kuibadili kuwa “mzigo” au “mateso” kungefinya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mtu yeyote akitaka” ni cha kawaida na wazi; “kuja nyuma yangu” huhifadhi sitiari ya Kigiriki bila kuchanganywa na amri ya mwisho “anifuate.”
