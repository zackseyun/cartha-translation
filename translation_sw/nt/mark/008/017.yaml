base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: sw
  text: Naye, alipotambua hilo, akawaambia, “Kwa nini mnajadiliana kwamba hamna mikate? Je, bado hamtambui wala hamwelewi? Je, mioyo yenu imekuwa migumu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: akijua hilo
  rationale: Kirai hiki kinaonyesha kwamba Yesu alitambua mazungumzo yao; ‘hilo’ linarejelea jambo lililotajwa katika muktadha bila kulifafanua zaidi.
- source_word: διαλογίζεσθε
  choice: mnajadiliana
  rationale: Kitenzi hiki hapa kinaeleza kujadiliana au kuwaza kwa pamoja kuhusu ukosefu wa mikate.
- source_word: ἄρτους
  choice: mikate
  rationale: Neno la Kigiriki liko katika wingi, na ‘mikate’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: νοεῖτε
  choice: mnatambua
  rationale: ‘Kutambua’ huhifadhi wazo la kuona au kushika maana kiakili na kulitofautisha kwa kiasi na kitenzi kinachofuata.
- source_word: συνίετε
  choice: kuelewa
  rationale: ‘Kuelewa’ linaonyesha kufahamu maana na kudumisha jozi ya vitendo vya kiakili katika swali la Yesu.
- source_word: πεπωρωμένην
  choice: imekuwa migumu
  rationale: Hii inaeleza hali endelevu ya kutokuwa sikivu; Kiswahili hiki ni cha kawaida bila kudokeza wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: καρδίαν
  choice: mioyo
  rationale: ‘Mioyo’ huhifadhi sitiari ya mtu wa ndani. Wingi wa Kiswahili ni wa kawaida kwa kundi linalosemeshwa, ingawa Kigiriki hutumia umoja kwa maana ya mgawanyo.
theological_decisions:
- issue: Namna ya kutafsiri swali la mwisho kuhusu hali ya wanafunzi
  choice: Je, mioyo yenu imekuwa migumu?
  alternative: Je, mna moyo uliotiwa ugumu?
  rationale: Tafsiri iliyochaguliwa ni Kiswahili cha kawaida na huhifadhi hali ya ugumu wa ndani bila kutaja aliyesababisha ugumu huo. Mbadala ni wa karibu zaidi na muundo wa Kigiriki lakini ni mzito na usio wa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. ‘Mikate’ huhifadhi wingi wa Kigiriki; ‘mioyo yenu’ ni wingi wa kawaida wa Kiswahili kwa watu wengi wanaosemeshwa.
