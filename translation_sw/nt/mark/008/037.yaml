  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: sw
  text: Kwa maana mtu anaweza kutoa nini badala ya uhai wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yake”; neno la Kigiriki linaweza kumaanisha “uhai,” “nafsi,” au mtu mwenyewe, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Kwa maana ... nini?
  rationale: Neno τί linaanzisha swali la ‘nini?’, na γάρ linaunganisha swali hili kwa maelezo na kauli iliyotangulia. ‘Kwa maana’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: δοῖ
  choice: anaweza kutoa
  rationale: Hiki ni kitenzi katika hali ya utegemezi ndani ya swali la balagha. ‘Anaweza kutoa’ huwasilisha uwezekano wa kupata kitu cha kutoa, ambao swali linaukanusha kwa nguvu.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ni ya umoja, hapa ina maana ya jumla. ‘Mtu’ ni tafsiri sahihi, ya asili, na isiyobana maana kwa jinsia moja.
- source_word: ἀντάλλαγμα
  choice: badala ya
  rationale: Nomino hii humaanisha kitu kinachotolewa ili kubadilishana au kukomboa kingine. Baada ya ‘kutoa’, kirai ‘badala ya’ ni cha asili katika Kiswahili.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: uhai wake
  rationale: Katika muktadha wa Marko 8:35–37, ψυχή humaanisha uhai wa mtu na pia nafsi yake nzima. ‘Uhai wake’ huendeleza muktadha kwa uwazi, huku maana mbadala ya ‘nafsi yake’ ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya ψυχή katika usemi unaohusu wokovu na thamani ya mtu
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unatofautisha kuupata ulimwengu na kupoteza ψυχή. ‘Uhai’ unafaa kwa mtiririko wa aya 35–37, lakini neno hilo la Kigiriki linaweza pia kumaanisha ‘nafsi’ au mtu mwenyewe; kwa hiyo tanbihi inalinda upana na mvutano wa maana bila kuufunga kwa uhai wa mwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na kiunganishi cha maelezo umehifadhiwa.
