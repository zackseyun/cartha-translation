  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: sw
  text: Akauagiza umati ukae chini[a]. Kisha akachukua mikate saba, akashukuru, akaimega, na akaendelea kuwapa wanafunzi wake ili waiweke mbele ya umati[b]; nao wakaiweka mbele ya umati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakae kwa kujiegemeza.” Kitenzi cha Kigiriki hasa hudokeza kujiegemeza wakati wa kula.
    reason: lexical_alternative
  - marker: b
    text: Au “kuwahudumia.” Kigiriki kihalisi ni “kuweka mbele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: Akauagiza
  rationale: Kitenzi kinaonyesha agizo lenye mamlaka. Wakati uliopo wa kihistoria umetafsiriwa kwa usimulizi wa kawaida wa Kiswahili.
- source_word: ἀναπεσεῖν
  choice: uketi chini
  rationale: Katika muktadha wa mlo, neno hili linaweza kumaanisha kujiegemeza au kuketi kwa ajili ya kula. 'Kuketi chini' ni lugha ya kawaida na yenye kueleweka, huku tanbihi ikihifadhi maana mahsusi zaidi.
- source_word: ἐπὶ τῆς γῆς
  choice: chini
  rationale: Hapa γῆ ni ardhi ambako umati ulikaa; 'chini' ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: akachukua ile mikate saba
  rationale: '''Mikate'' hutoa wingi wa ἄρτους kwa kawaida katika Kiswahili; ''ile'' hurejelea mikate saba iliyotajwa awali.'
- source_word: εὐχαριστήσας
  choice: akashukuru
  rationale: Inahifadhi tendo la kutoa shukrani bila kuongeza wazi mpokeaji ambaye hajatajwa katika Kigiriki.
- source_word: ἔκλασεν
  choice: akaimega
  rationale: '''Kumega'' ni kitenzi cha kawaida kwa kuvunja mkate vipande; kiambishi cha yambwa kinarejelea mikate kwa ujumla.'
- source_word: ἐδίδου
  choice: na kuendelea kuwapa
  rationale: Muundo huu unahifadhi hali endelevu au ya kurudiwa-rudiwa ya wakati usiotimilifu wa Kigiriki.
- source_word: ἵνα παρατιθῶσιν
  choice: ili waiweke mbele ya umati
  rationale: Inahifadhi taswira halisi ya kuweka chakula mbele ya watu badala ya kufasiri tu kuwa 'kuwahudumia.'
- source_word: παρέθηκαν
  choice: wakaiweka mbele ya umati
  rationale: Marudio ya usemi huo yanadumisha ulinganifu wa kileksika na Kigiriki na kueleza utekelezaji wa agizo.
- source_word: ὄχλος
  choice: umati
  rationale: '''Umati'' ni neno la kawaida, lenye heshima, kwa kundi kubwa la watu katika simulizi.'
theological_decisions:
- issue: Mfuatano wa simulizi na mwangwi wa Ekaristi
  choice: Kutafsiri εὐχαριστήσας kwa urahisi kuwa 'akashukuru' bila istilahi ya kisakramenti.
  alternative: Alitoa shukrani kwa Mungu, kwa mwangwi ulioelezwa wazi wa Ekaristi.
  rationale: Kigiriki hakitaji wazi yule anayeshukuriwa wala hakifafanui fundisho la kisakramenti hapa; tafsiri haiongezi dai la kiteolojia lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi kwa viambishi vya -ka- umetumiwa kwa mtiririko wa matendo; 'kuendelea kuwapa' huhifadhi tendo endelevu la ἐδίδου. Alama zote za tanbihi zimewekwa katika matini kuu.
