translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nao’ linaendeleza simulizi kwa kawaida. Tumetumia ‘watu’ kufafanua walengwa wa chakula bila kuongeza ‘wanafunzi’ kama mtendaji, kwa kuwa Kigiriki hakimtaji wazi katika mstari huu.
