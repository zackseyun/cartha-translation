translation:
  language: sw
  text: Nao walikuwa na samaki wadogo wachache. Baada ya kuwabariki, alisema samaki hao pia wawekwe mbele yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alisema samaki hao pia watolewe.” Kitenzi cha Kigiriki kinaweza kumaanisha kuweka chakula mbele ya watu, yaani kukitoa ili wale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰχθύδια
  choice: samaki wadogo
  rationale: Nomino ya udogo inaashiria samaki wenye ukubwa mdogo; tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: ὀλίγα
  choice: wachache
  rationale: Hueleza idadi ndogo ya samaki kwa njia ya kawaida na inayoeleweka.
- source_word: εὐλογήσας
  choice: Baada ya kuwabariki
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia; ‘kuwabariki’ kinabaki karibu na maana ya εὐλογέω na kiwakilishi kinarejelea samaki.
- source_word: αὐτά
  choice: wa-
  rationale: Kiwakilishi cha wingi kinarejelea samaki; katika Kiswahili hujitokeza kama kiambishi cha yambwa katika ‘kuwabariki’.
- source_word: καὶ ταῦτα
  choice: hawa pia
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya καί, na ‘hawa’ huhifadhi msisitizo wa kiashiria ταῦτα kwa upatanisho wa ngeli ya samaki.
- source_word: παρατιθέναι
  choice: wawekwe mbele ya watu
  rationale: Katika muktadha wa chakula, kitenzi humaanisha kuweka chakula mbele ya watu au kuwahudumia; uundaji huu ni wa asili na haumtambui kimyakimya mtendaji ambaye Kigiriki hakumtaji wazi.
- source_word: εἶπεν
  choice: alisema
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya λέγω na huepuka kuongeza kihusika ‘aliwaambia’ ambacho hakijaelezwa wazi.
