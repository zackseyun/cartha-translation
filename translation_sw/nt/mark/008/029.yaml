base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: sw
  text: Naye alikuwa akiwauliza, “Lakini ninyi, mnasema mimi ni nani?” Petro akamjibu, “Wewe ndiye Masihi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐπηρώτα
  choice: akawauliza
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea katika simulizi; “akawauliza” ni la kawaida katika Kiswahili na linaendeleza mtiririko wa masimulizi bila kufanya swali lionekane la mara kwa mara kuliko muktadha unavyodai.
- source_word: Ὑμεῖς δὲ
  choice: Lakini ninyi
  rationale: “Lakini” linaonyesha utofauti na maoni ya watu wengine yaliyotajwa awali, huku “ninyi” likihifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: τίνα με λέγετε εἶναι
  choice: mnasema mimi ni nani
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi muundo wa Kigiriki wa shamirisho pamoja na kitenzi-jina.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: Petro akamjibu
  rationale: Muundo wa Kigiriki wa participio pamoja na wakati uliopo wa kihistoria umetolewa kwa kitenzi cha masimulizi cha Kiswahili; “akamjibu” huonyesha wazi kwamba jibu lilielekezwa kwake.
- source_word: Σὺ εἶ
  choice: Wewe ndiye
  rationale: “Wewe” huhifadhi msisitizo wa kiwakilishi kilichotajwa wazi, na “ndiye” ni muundo wa asili wa Kiswahili wa kutambulisha mtu kwa cheo hiki.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya mtiwa-mafuta aliyeahidiwa, si jina binafsi. “Masihi” huhifadhi muktadha wake wa Kiyahudi; “Kristo” limetolewa katika tanbihi kama namna mbadala iliyozoeleka.
theological_decisions:
- issue: Utoaji wa Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika ungamo la Petro, Χριστός linatumika kama cheo. “Masihi” huwasilisha maana ya cheo hicho na asili yake ya Kiebrania bila kukifanya jina binafsi; “Kristo” linahifadhiwa kama tafsiri mbadala ya jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Lakini ninyi” huhifadhi utofauti na msisitizo, na “Wewe ndiye Masihi” ni ungamo la asili na lenye uzito.
