  text: And he warned them to tell no one about him[a].
translation:
  language: sw
  text: Naye akawaonya wasimwambie mtu yeyote habari zake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawakemea,” au “akawaagiza kwa ukali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: akawaonya
  rationale: Kitenzi hiki mara nyingi humaanisha kukemea, lakini hapa kinaonyesha onyo au agizo kali kwa wanafunzi wasifunue utambulisho wa Yesu. “Akawaonya” ni Kiswahili cha kawaida kinachobeba uzito wa katazo hilo bila kudokeza kwamba walikuwa wamekosea.
- source_word: αὐτοῖς
  choice: wa- katika “akawaonya”
  rationale: Kiwakilishi cha wingi kinawarejelea wanafunzi na kimewakilishwa kiasili kwa kiambishi cha yambwa “wa-” katika kitenzi.
- source_word: ἵνα
  choice: wa- katika “wasimwambie”
  rationale: Baada ya kitenzi cha kuonya au kuagiza, ἵνα pamoja na hali tegemezi imewasilishwa kwa muundo wa Kiswahili wa hali tegemezi, unaoonyesha yaliyomo katika onyo.
- source_word: μηδενὶ
  choice: mtu yeyote
  rationale: Katika kishazi hasi “wasimwambie mtu yeyote,” usemi huu unatoa maana ya ‘wasiambie mtu hata mmoja’ kwa Kiswahili cha sasa na cha kawaida.
- source_word: λέγωσιν
  choice: wasimwambie
  rationale: Kwa kuwa kuna mtu anayepokea taarifa na habari zinazomhusu Yesu, “kumwambia” ni ya kiasili kuliko “kusema” na inadumisha katazo la Kigiriki.
- source_word: περὶ αὐτοῦ
  choice: habari zake
  rationale: Usemi huu unamaanisha ‘kuhusu yeye.’ “Habari zake” ni usemi wa Kiswahili unaoeleweka kwa urahisi na, katika muktadha, unarejelea utambulisho wa Yesu bila kuufafanua kupita maandishi.
theological_decisions:
- issue: Uzito wa amri ya Yesu katika muktadha wa kutofunuliwa kwa utambulisho wake
  choice: Kuitafsiri kama onyo kali la kutomwambia mtu yeyote habari zake, bila kuongeza sababu ya katazo hilo.
  alternative: “Akawakemea” au “akawaagiza kwa ukali.”
  rationale: Mstari unaonyesha katazo lenye uzito, lakini hautoi sababu yake hapa. “Akawaonya” huhifadhi uzito huo bila kuingiza nadharia kuhusu kusitiriwa kwa utambulisho wa Masihi wala kuonyesha wazi kwamba wanafunzi walikuwa wakilaumiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wasimwambie mtu yeyote” ni wa kiasili na huhifadhi katazo; tanbihi inaonyesha upana wa maana ya ἐπιτιμάω.
