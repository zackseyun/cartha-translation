- source_word: ὡς δένδρα
  choice: kama miti
  rationale: Huhifadhi tashbihi ya matini ya Kigiriki kwa lugha ya kawaida ya Kiswahili.
- source_word: περιπατοῦντας
  choice: wakitembea
  rationale: Hukubaliana kisarufi na watu wanaoonekana na kueleza kitendo chao kwa njia ya asili.
theological_decisions:
- issue: Iwapo ἀναβλέψας itafsiriwe kama kurejeshewa uwezo wa kuona au kutazama juu
  choice: alipotazama juu
  alternative: alipoanza kuona tena
  rationale: Muktadha unahusu uponyaji wa kuona, lakini umbo hili linaweza kueleweka kwa maana ya kutazama juu; tafsiri iliyochaguliwa haifuti utata huo kwa kulazimisha maana ya kurejeshewa kuona.
- issue: Uhusiano wa ὅτι na maelezo yanayofuata
  choice: kwa sababu
  alternative: kwani / kwamba
  rationale: ‘Kwa sababu’ huakisi kwa karibu nguvu ya kisababishi ya ὅτι katika ushahidi wa matini uliotolewa, bila kusawazisha sintaksia isiyo ya kawaida.
