  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: sw
  text: Akawaacha[a], akapanda tena mashua, akaenda ng’ambo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akawaacha, akapanda mashua, akaenda tena ng’ambo.” Neno la Kigiriki πάλιν linaweza kuhusishwa na kupanda mashua (“akapanda tena”) au na kwenda (“akaenda tena”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: Akawaacha
  rationale: Kitenzi hiki hapa kina maana ya kuondoka na kuwaacha watu waliotajwa; muundo wa mfululizo wa vitenzi wenye “aka-” ni wa asili katika simulizi la Kiswahili.
- source_word: αὐτοὺς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea Mafarisayo wa muktadha wa karibu bila kuhitaji kurudia jina lao.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” huhifadhi maana ya msingi ya kurudia tendo. Kwa kuwa nafasi ya πάλιν katika Kigiriki inaweza kuhusishwa na kupanda au kuondoka, tanbihi inaonyesha uwezekano mwingine wa ufasiri.
- source_word: ἐμβὰς
  choice: akapanda mashua
  rationale: Katika muktadha, tendo ni kuingia ndani ya mashua. “Kupanda mashua” ni Kiswahili cha kawaida na wazi, ingawa neno “mashua” linaeleweka kutokana na muktadha.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: “Akaenda” linaeleza kuondoka kuelekea mahali panapotajwa na linafaa mtiririko wa simulizi kuliko neno rasmi zaidi kama “akaondoka.”
- source_word: εἰς τὸ πέραν
  choice: ng’ambo
  rationale: “Ng’ambo” ni usemi wa kawaida wa Kiswahili kwa upande wa pili wa ziwa au bahari, na unahifadhi maana ya kijiografia ya kifungu.
