  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: sw
  text: Yesu na wanafunzi wake wakaenda katika vijiji vya Kaisaria Filipi. Walipokuwa njiani, Yesu alikuwa akiwauliza wanafunzi wake, “Watu[a] wanasema mimi ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linamaanisha watu kwa ujumla, si wanaume pekee.
    reason: Ufafanuzi wa maana ya jumla ya ἄνθρωποι.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha Yesu kutoka na kuanza safari; “akaondoka” ni Kiswahili cha kawaida na hakiongezi maana ya kuaga au kuhama kabisa.
- source_word: κώμας
  choice: vijiji
  rationale: κώμη kwa kawaida humaanisha kijiji au makazi madogo, si mji mkubwa.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Kaisaria Filipi
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali Caesarea Philippi.
- source_word: ἐν τῇ ὁδῷ
  choice: Wakiwa njiani
  rationale: Usemi huu ni wa asili katika Kiswahili na unadumisha wazo la mazungumzo kutokea safarini.
- source_word: ἐπηρώτα
  choice: akawa anawauliza
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kulingana na hali ya kitenzi cha Kigiriki cha wakati usiotimilika.
- source_word: λέγων αὐτοῖς
  choice: anawauliza ... “...”
  rationale: Katika Kiswahili, kauli inayofuata inaweza kuunganishwa moja kwa moja na kitenzi “anawauliza”; kutafsiri pia “akiwaambia” kungekuwa na uradidi usio wa asili bila kuongeza maana.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Watu wanasema mimi ni nani?
  rationale: Swali linahusu utambulisho wa Yesu. “Watu” linaonyesha maana ya jumla ya ἄνθρωποι bila kudokeza wanaume pekee.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wake” linawakilisha αὐτοῦ iliyo wazi katika sehemu zote mbili, na “wanafunzi” ni tafsiri ya kawaida ya μαθηταί.
theological_decisions:
- issue: Maana ya jumla ya ἄνθρωποι katika swali la Yesu
  choice: watu
  alternative: wanadamu / wanaume
  rationale: Katika muktadha huu neno hilo linamaanisha watu kwa ujumla. “Wanaume” lingefanya swali lionekane kuwahusu watu wa jinsia ya kiume pekee, jambo ambalo Kigiriki hakilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akawa anawauliza” umetumiwa kuhifadhi hali endelevu ya ἐπηρώτα bila kufanya sentensi kuwa ngumu; jina la mahali limetolewa kwa umbo linalotambulika katika Kiswahili.
