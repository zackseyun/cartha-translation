  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: sw
  text: Naye akaanza kuwafundisha kwamba Mwana wa Adamu lazima apate mateso mengi, akataliwe na wazee, wakuu wa makuhani, na waandishi, auawe, na baada ya siku tatu[a] afufuke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya siku tatu.” Kigiriki cha Marko kinasema “baada ya siku tatu”; baadhi ya mapokeo ya tafsiri hutumia usemi wa kawaida zaidi au huupatanisha na vifungu sambamba vinavyosema “siku ya tatu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: akaanza kuwafundisha
  rationale: Muundo huu unaonyesha mwanzo wa tendo la kufundisha na unasikika kwa kawaida katika Kiswahili cha masimulizi.
- source_word: δεῖ
  choice: lazima
  rationale: Neno hili linahifadhi uzito wa ulazima uliomo katika Kigiriki bila kueleza zaidi chanzo au namna ya ulazima huo.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka, linalohifadhi maana yake na mwangwi wake wa kimaandiko bila kulifafanua kwa maneno mengine.
- source_word: πολλὰ παθεῖν
  choice: apate mateso mengi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi wingi na upana wa mateso unaoonyeshwa na πολλά, badala ya kuyapunguza kuwa tu ‘ateseke sana.’
- source_word: ἀποδοκιμασθῆναι
  choice: akataliwe
  rationale: Kitenzi hiki kinaeleza kukataliwa rasmi baada ya kuhukumiwa kuwa hafai; ‘akataliwe’ ni wazi na cha kawaida katika muktadha huu.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: na wazee
  rationale: Hapa ‘wazee’ ni kundi linalotambulika la viongozi wa Wayahudi, si watu wenye umri mkubwa kwa ujumla.
- source_word: τῶν ἀρχιερέων
  choice: viongozi wa makuhani
  rationale: Wingi wa neno hili unarejelea tabaka la viongozi wa kikuhani, si lazima watu wengi waliokuwa na cheo cha kuhani mkuu kwa wakati mmoja. Usemi huu ni wazi kwa msomaji wa sasa.
- source_word: τῶν γραμματέων
  choice: walimu wa sheria
  rationale: Katika muktadha huu walikuwa wataalamu na walimu wa sheria ya Kiyahudi; tafsiri hii inaeleza jukumu lao kwa Kiswahili cha kawaida kuliko ‘waandishi’ peke yake.
- source_word: ἀποκτανθῆναι
  choice: auawe
  rationale: Hii inawakilisha moja kwa moja hali ya kutendwa ya kitenzi cha Kigiriki na ina uzito unaofaa.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: baada ya siku tatu
  rationale: μετά pamoja na hali ya accusative humaanisha kwa kawaida ‘baada ya.’ Tafsiri hii inahifadhi maneno mahsusi ya Marko badala ya kuyapatanisha na ‘siku ya tatu’ katika vifungu vingine.
- source_word: ἀναστῆναι
  choice: afufuke
  rationale: Kitenzi cha Kigiriki hapa ni cha kutenda kisichohitaji yambwa; ‘afufuke’ kinahifadhi muundo huo bila kukibadili kuwa ‘afufuliwe.’
theological_decisions:
- issue: Ulazima unaoonyeshwa na δεῖ katika utabiri wa mateso
  choice: lazima
  alternative: ni lazima kwamba
  rationale: ‘Lazima’ linadumisha uzito wa ulazima wa mateso, kukataliwa, kuuawa na kufufuka kwa Mwana wa Adamu, lakini haliongezi maelezo ya kimafundisho yasiyotajwa wazi katika mstari.
- issue: Usemi wa wakati μετὰ τρεῖς ἡμέρας
  choice: baada ya siku tatu
  alternative: siku ya tatu
  rationale: Kigiriki cha Marko kinasema ‘baada ya siku tatu.’ Tafsiri haipaswi kubadili usemi huo ili kuupatanisha kimyakimya na vifungu sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia mfululizo wa vitenzi vya hali ya kutendwa na kutenda ili kuhifadhi mpangilio wa Kigiriki huku ikibaki wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya usemi wa wakati unaohusika.
