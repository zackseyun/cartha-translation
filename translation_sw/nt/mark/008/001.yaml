base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: sw
  text: Siku hizo, tena kulikuwa na umati mkubwa, nao hawakuwa na chochote cha kula; Yesu akawaita wanafunzi wake, akawaambia:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina wakati uliopo wa kihistoria: “anawaambia.” Marko hutumia mara nyingi namna hii ya kusimulia matukio yaliyopita kwa uhai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Siku hizo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka wakati wa simulizi bila kufafanua muda kupita kiasi.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: umati mkubwa ulikuwa umekusanyika tena
  rationale: Huwasilisha mazingira ya kishazi huru cha uhusika wa Kigiriki kwa Kiswahili cha kawaida; πάλιν inaonyesha kurudiwa kwa hali inayofanana, na πολλοῦ huonyesha ukubwa wa umati.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: nao hawakuwa na chochote cha kula
  rationale: Kiwakilishi kinarejelea watu wa umati, na usemi huu unaonyesha wazi kwamba hawakuwa na chakula.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Yesu akawaita wanafunzi wake
  rationale: Kitenzi cha Kiswahili kinaonyesha kuwaita waje kwake bila kuongeza maneno yasiyo ya lazima. Jina Yesu limetajwa kwa uwazi kwa kuwa mtendaji amedokezwa tu katika Kigiriki, na umilikishi 'wake' ni wa kawaida katika muktadha huu.
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Kiswahili cha simulizi kwa kawaida hutumia mfululizo wa vitenzi vya ka-; hivyo maana ya usemi wa kihistoria wa wakati uliopo inawasilishwa kwa uhai bila kutumia wakati uliopo usio wa kawaida hapa.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika λέγει αὐτοῖς
  choice: akawaambia
  alternative: anawaambia
  rationale: Hili si suala la mafundisho bali la mtindo wa simulizi. 'Akawaambia' ni Kiswahili cha asili kinachoendeleza tukio kwa uhai, ingawa Kigiriki hutumia wakati uliopo wa kihistoria; tofauti hiyo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa ili kuepuka muundo mzito wa kishazi huru cha uhusika wa Kigiriki. 'Umati' limetumiwa badala ya 'mkutano' ili kurejelea kundi kubwa la watu, na 'chochote cha kula' ni usemi wa kawaida unaohifadhi maana ya ukosefu wa chakula.
