  text: Akawauliza, “Mna mikate mingapi?” Wakasema, “Saba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi cha masimulizi “aka-” kinaendeleza mtiririko wa matukio kwa kawaida katika Kiswahili bila kuongeza mkazo usio katika Kigiriki.
- source_word: ἠρώτα
  choice: akawauliza
  rationale: Ingawa kitenzi ni cha wakati usiotimilifu, katika muktadha huu kitendo kimoja cha kuuliza huwasilishwa kwa Kiswahili cha masimulizi kwa “akawauliza”; umbo la kuendelea lingeweza kudokeza kurudiwa kusikokusudiwa wazi.
- source_word: αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea wanafunzi walio wengi.
- source_word: Πόσους
  choice: mingapi
  rationale: Neno la kuuliza idadi linapatanishwa na ngeli ya “mikate.”
- source_word: ἔχετε
  choice: mna
  rationale: “Mna” ni usemi wa kawaida na wa moja kwa moja wa kuonyesha walichokuwa nacho.
- source_word: ἄρτους
  choice: mikate
  rationale: Katika swali la kuhesabu, wingi “mikate” unaonyesha vipande au mikate kamili inayoweza kuhesabiwa, si mkate kama kitu kisichohesabika.
- source_word: οἱ δὲ εἶπαν
  choice: Wakasema
  rationale: “Wakasema” huonyesha jibu linalofuata katika simulizi; haitafsiri δέ kwa ukinzani ambao muktadha hauhitaji, na huhifadhi maana ya kawaida ya εἶπαν, “walisema.”
- source_word: Ἑπτά
  choice: Saba
  rationale: Namba ya msingi imetafsiriwa moja kwa moja.
