base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: sw
  text: Kisha akaweka tena mikono yake juu ya macho ya yule mtu[a], naye akaona wazi, akarejeshwa, na akaendelea kuona vitu vyote kwa uwazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina maneno yanayoweza kutafsiriwa hivi: “akatazama kwa makini, akarejeshwa, akaona vitu vyote wazi.”'
    reason: textual_variant
  - marker: b
    text: Au “aliweza kuona vitu vyote wazi.” Kishazi cha mwisho kina kitenzi kinachoonyesha hali inayoendelea pamoja na kielezi cha kuona kwa uwazi au kwa kutofautisha vitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Kisha ... tena
  rationale: “Kisha” huonyesha mfuatano wa matukio, na “tena” huonyesha kwamba Yesu alirudia tendo hilo.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: akaweka ... mikono yake juu ya macho yake
  rationale: Hii inadumisha tendo halisi la kuweka mikono juu ya macho, huku umilikishi wa Kigiriki ukibaki bila ufafanuzi wa ziada usio katika matini.
- source_word: διέβλεψεν
  choice: akaona wazi
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kuona kwa uwazi baada ya kuona kwa sehemu; tafsiri hii haileti wazo la ‘kutazama kwa makini’ kutoka katika mapokeo mengine ya matini.
- source_word: ἀπεκατέστη
  choice: akarejeshwa
  rationale: Neno hili lina maana ya kurejeshwa katika hali ya awali au inayofaa. Tafsiri haibainishi zaidi iwapo kinachosisitizwa ni macho, uwezo wa kuona, au hali ya mtu mzima.
- source_word: ἐνέβλεπεν
  choice: akawa anaona
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya kuendelea au matokeo yaliyodumu, kwa kufuata hali ya kitenzi cha wakati usiotimilika katika Kigiriki.
- source_word: τηλαυγῶς
  choice: dhahiri
  rationale: Neno hili huonyesha kuona kwa uwazi na kwa kutofautisha vitu; “dhahiri” huepuka kurudia tu neno “wazi” lililotumiwa kwa διέβλεψεν.
- source_word: ἅπαντα
  choice: vitu vyote
  rationale: Hii ni njia ya kawaida na inayoeleweka ya kuwasilisha maana jumuishi ya nomino ya wingi isiyo na jinsia katika muktadha wa kuona.
theological_decisions:
- issue: Taswira ya uponyaji wa hatua mbili
  choice: Mfuatano wa kuona wazi, kurejeshwa, na kuendelea kuona umedumishwa.
  alternative: Kufupisha vitenzi vyote kuwa tukio moja la uponyaji uliokamilika mara moja.
  rationale: Mfuatano wa vitenzi vya Kigiriki, hasa kitenzi cha mwisho cha wakati usiotimilika, unaonyesha hatua na hali iliyoendelea. Tafsiri haifuti mvutano huo wala kuupa maelezo ya kiteolojia yasiyo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akawa anaona” ni cha kawaida zaidi kuliko tafsiri ngumu ya moja kwa moja, huku kikidumisha hali endelevu ya kitenzi cha Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
