  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: sw
  text: Kisha akamtuma nyumbani kwake[a], akisema, “Usiingie hata kijijini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati huongeza, “wala usimwambie mtu yeyote kijijini.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akampeleka
  rationale: Kitenzi hiki hapa kinaonyesha kwamba Yesu alimwondoa mtu huyo mahali pale kwa kumwelekeza aende nyumbani; ‘akampeleka’ ni usemi wa kawaida wa Kiswahili bila kuingiza wazo la utume.
- source_word: εἰς οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa kueleza mahali alipokuwa akielekezwa, yaani makao yake mwenyewe.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kitenzi-shirikishi na tendo kuu huku ikitambulisha maneno ya Yesu kwa mtiririko wa kawaida wa simulizi.
- source_word: Μηδὲ
  choice: Usiingie hata
  rationale: ‘Hata’ huwasilisha mkazo wa μηδέ kwamba asiingie kijijini kabisa, badala ya kuifanya kuwa kiunganishi cha kawaida tu.
- source_word: κώμην
  choice: kijijini
  rationale: κώμη humaanisha kijiji au makazi madogo; hali ya mahali ‘kijijini’ inafaa baada ya kitenzi ‘kuingia.’
- source_word: εἰσέλθῃς
  choice: usiingie
  rationale: Muundo wa kukataza wenye aoristi tegemezi umetolewa kwa amri hasi ya kawaida na ya moja kwa moja katika Kiswahili.
theological_decisions:
- issue: Upeo wa katazo la Yesu kuhusu kijiji
  choice: Katazo limetafsiriwa moja kwa moja kuwa kutokuingia kijijini, bila kuongeza sababu au agizo jingine.
  alternative: Baadhi ya mapokeo ya hati huongeza katazo la kutomwambia mtu yeyote kijijini.
  rationale: Matini ya SBLGNT ina katazo la kuingia kijijini pekee. Tofauti ndefu imewekwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Nyumbani kwake’ ni ya kawaida zaidi kuliko ‘katika nyumba yake,’ na ‘Usiingie hata kijijini’ huhifadhi mkazo wa katazo.
