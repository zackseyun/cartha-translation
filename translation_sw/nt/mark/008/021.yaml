  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: sw
  text: Naye alikuwa akiwaambia, “Je, bado hamwelewi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumrejelea Yesu bila kuongeza maana ya wakati isiyokuwamo wazi katika Kigiriki.
- source_word: ἔλεγεν
  choice: akawa anawaambia
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya tendo linaloendelea au linalorudiwa, sambamba na njeo isiyotimilika ya Kigiriki, huku ukibaki wa kawaida na wenye kueleweka.
- source_word: αὐτοῖς
  choice: anawaambia
  rationale: Kiambishi -wa- kinatafsiri kiwakilishi cha wingi moja kwa moja bila kuongeza wazi kwamba walikuwa wanafunzi, ingawa muktadha unaonyesha hivyo.
- source_word: Οὔπω
  choice: bado ham-
  rationale: Katika swali hasi, “bado ham-” huwasilisha kwa kawaida maana ya kwamba ufahamu haujafikiwa mpaka wakati huo.
- source_word: συνίετε
  choice: mwelewi
  rationale: Kitenzi hiki ni cha wakati wa sasa, nafsi ya pili wingi; “mwelewi” huhifadhi wazo la kuelewa kiakili bila kuongeza yambwa lisilotajwa.
theological_decisions:
- issue: Iwapo liongezwe yambwa kama “jambo hili” baada ya kitenzi cha kuelewa
  choice: 'Kuacha yambwa bila kutajwa: “Je, bado hamwelewi?”'
  alternative: “Je, bado hamwelewi jambo hili?”
  rationale: Kigiriki hakitaji yambwa wazi. Kulicha swali wazi kunahifadhi upana na ukali wake bila kulifungamanisha na jambo maalumu lililoongezwa na mtafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawa anawaambia” huhifadhi kwa njia ya kawaida hali endelevu ya ἔλεγεν; “Je, bado hamwelewi?” ni swali la moja kwa moja linalohifadhi wakati wa sasa wa συνίετε na maana ya οὔπω.
