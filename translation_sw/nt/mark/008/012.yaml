  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: sw
  text: Akaugua sana rohoni mwake, akasema, “Kwa nini kizazi hiki kinatafuta ishara? Kweli, nawaambia, kizazi hiki hakitapewa ishara yoyote.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana ya neno kwa neno zaidi: “ikiwa kizazi hiki kitapewa ishara”—usemi wa Kiyunani ulio kama kiapo, wenye maana kwamba hakitapewa ishara yoyote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: Akaugua sana
  rationale: Kitenzi hiki kinaonyesha kuugua au kushusha pumzi kwa nguvu. ‘Akaugua sana’ ni kifupi, cha asili, na kinahifadhi uzito wa hisia bila kuongeza sababu yake.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: rohoni mwake
  rationale: Huhifadhi lugha ya Kiyunani inayorejelea roho yake, badala ya kuifupisha kuwa ‘moyoni’ au ‘kimoyomoyo.’
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kiyunani kinatumia wakati wa sasa wa kihistoria, wakati wa masimulizi wa Kiswahili unasomeka kwa kawaida zaidi hapa bila kupoteza uhai wa simulizi.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu wa swali, τί huonyesha sababu; ‘Kwa nini’ ndilo tamko la kawaida na sahihi la Kiswahili.
- source_word: γενεὰ
  choice: kizazi
  rationale: Huhifadhi maana ya pamoja na ya kipindi cha watu wanaozungumziwa.
- source_word: ζητεῖ
  choice: kinatafuta
  rationale: Ni sawia ya moja kwa moja isiyozidisha nguvu ya neno kuwa ‘kinadai.’
- source_word: σημεῖον
  choice: ishara
  rationale: Huhifadhi maana ya tendo linalothibitisha bila kuongeza wazi neno ‘muujiza,’ ambalo halipo katika matini.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hutoa kwa Kiswahili cha kawaida na chenye heshima uzito wa kauli hii ya Yesu.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: kizazi hiki hakitapewa ishara yoyote
  rationale: Huu ni usemi wa kiapo wenye maana ya kukataa kwa mkazo. Ukanushaji wa wazi unawasilisha maana yake kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Jinsi ya kutafsiri kishazi cha kiapo kinachoanza na εἰ baada ya ἀμὴν λέγω ὑμῖν
  choice: 'Kukitafsiri kama ukanushaji wa mkazo: ‘kizazi hiki hakitapewa ishara yoyote.’'
  alternative: 'Tafsiri ya neno kwa neno: ‘ikiwa kizazi hiki kitapewa ishara.’'
  rationale: Muundo wa Kiyunani ni kauli ya kiapo iliyofupishwa, si sharti lisilokamilika kwa maana ya kawaida. Ukanushaji wa wazi unafikisha nguvu yake huku tanbihi ikihifadhi umbo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumiwa kwa kawaida, huku lugha ya ‘rohoni mwake,’ ‘kizazi,’ na ‘ishara’ ikihifadhi vipengele muhimu vya matini ya Kiyunani.
