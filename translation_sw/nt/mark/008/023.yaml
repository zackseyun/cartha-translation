  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: sw
  text: Akamshika yule kipofu mkono, akamwongoza nje ya kijiji. Kisha akatema mate machoni pake[a], akaweka mikono yake juu yake, akamwuliza, “Unaona chochote?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uhalisia zaidi, “ndani ya macho yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: akamshika mkono
  rationale: Muundo huu unaonyesha kumshika mtu mkono ili kumwongoza; tafsiri ni ya asili katika Kiswahili na inahifadhi tendo halisi.
- source_word: τοῦ τυφλοῦ
  choice: yule kipofu
  rationale: Kivumishi hiki kimetumika kama nomino na kinamtaja mwanamume kipofu anayejulikana katika simulizi.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: kumwongoza mpaka nje ya kijiji
  rationale: Ingawa ἐκφέρω inaweza kumaanisha kumtoa au kumpeleka nje, muktadha wa kumshika mkono unaonyesha kumwongoza; κώμη ni kijiji au makazi madogo.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: akatema mate machoni pake
  rationale: Kiswahili cha kawaida hutaja ‘mate’ pamoja na kitenzi ‘kutema.’ ‘Machoni pake’ huhifadhi tendo la moja kwa moja bila kulainisha maelezo yake, huku tanbihi ikionyesha nguvu ya kihusishi εἰς.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: akaweka mikono yake juu yake
  rationale: Hii inaeleza mguso halisi wa mikono kwa lugha ya kawaida bila kuufanya moja kwa moja kuwa tendo rasmi la kidini.
- source_word: ἐπηρώτα αὐτόν
  choice: na kumuuliza
  rationale: Ingawa kitenzi kiko katika hali ya wakati usiotimilika, katika simulizi swali lenyewe linaweza kutafsiriwa kwa kawaida kama tendo la kuuliza bila kulazimisha maana ya kuuliza mara kwa mara.
- source_word: Εἴ τι βλέπεις;
  choice: Unaona chochote?
  rationale: Swali hili la kawaida linahifadhi τι isiyo bainifu na haliongezi wazo la uwezo ambalo lingesisitizwa na ‘Je, unaweza kuona?’
theological_decisions:
- issue: Kuhifadhi uhalisi wa matendo ya uponyaji
  choice: Kutaja wazi kwamba Yesu alitema mate machoni pa mtu huyo na kuweka mikono juu yake.
  alternative: Kutumia maelezo laini yanayoficha au kupunguza mguso wa kimwili.
  rationale: Maandishi yanasimulia mfululizo halisi na wa kushangaza wa matendo; tafsiri haipaswi kuyasafisha kwa sababu ya hisia za wasomaji wa sasa.
- issue: Maana inayoweza kudhaniwa ya kuweka mikono
  choice: Kutafsiri kama tendo la Yesu kuweka mikono yake juu ya mtu huyo bila ufafanuzi wa kiibada.
  alternative: Kulieleza kama ibada rasmi, sakramenti, au tendo la kuwekwa wakfu.
  rationale: Katika muktadha huu maneno yanaeleza mguso wa uponyaji; maandishi hayalazimishi maana ya baadaye ya kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Mfululizo wa vitenzi vya ‘-ka-’ unaendeleza mwendo wa simulizi kwa urahisi. Alama ya tanbihi imewekwa baada ya ‘machoni pake,’ sehemu inayohusika moja kwa moja na mbadala huo.
