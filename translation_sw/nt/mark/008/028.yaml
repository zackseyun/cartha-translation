base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: sw
  text: Nao wakamjibu, wakisema, “Yohana Mbatizaji; wengine, Eliya; na wengine, mmoja wa manabii.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Kiunganishi hiki kinawarejelea wanafunzi waliotajwa katika muktadha uliotangulia na kuendeleza simulizi kwa njia ya kawaida katika Kiswahili.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: wakamjibu
  rationale: Ingawa Kigiriki kina kitenzi pamoja na kirai-shirikishi cha mzizi uleule wa ‘sema,’ Kiswahili cha kawaida hakirudii ‘wakasema ... wakisema.’ Katika muktadha wa swali la Yesu, ‘wakamjibu’ huwasilisha tendo la kusema kwa ufasaha bila kubadili maana.
- source_word: ὅτι
  choice: — (imewakilishwa na alama za kunukuu)
  rationale: Hapa ὅτι inaanzisha taarifa ya maneno yaliyosemwa; alama za kunukuu zinaiwasilisha kwa kawaida katika Kiswahili.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohana Mbatizaji
  rationale: ‘Mbatizaji’ ni jina la kazi linaloonyesha maana ya Kigiriki βαπτιστής kwa uwazi na halidokezi dhehebu la baadaye.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: wengine ... na wengine
  rationale: Muundo huu huhifadhi mgawanyo wa maoni ya makundi mbalimbali. δέ ya pili ni kiunganishi hafifu cha kuendeleza au kutofautisha; ‘na’ ni ya asili hapa kuliko ‘lakini,’ kwa kuwa hakuna upinzani mkali.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: mmoja wa manabii
  rationale: Tafsiri inahifadhi ufupisho wa Kigiriki, ambamo ‘wewe ni’ inaeleweka kutokana na swali na vipashio vilivyotangulia.
- source_word: προφητῶν
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa προφῆται katika muktadha wa manabii wa Israeli.
theological_decisions:
- issue: Jinsi ya kuwasilisha maoni ya watu kuhusu utambulisho wa Yesu
  choice: Orodha fupi ya majina imehifadhiwa bila kuongeza ‘wewe ni’ katika kila kipashio.
  alternative: Nao wakamjibu, “Wengine wanasema wewe ni Yohana Mbatizaji, wengine Eliya, na wengine mmoja wa manabii.”
  rationale: Kigiriki kina usemi uliodondoshwa ambao unategemea swali lililotangulia. Kuuhifadhi kunatunza mkazo wa maandishi katika wingi wa maoni bila kuyafanya yawe ya ufafanuzi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi kama chanzo, lakini ‘wakamjibu’ imetumiwa badala ya urudiaji usio wa kawaida ‘wakasema ... wakisema.’ Hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika katika rasimu hii.
