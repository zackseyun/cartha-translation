base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: sw
  text: Nikiwaaga waende nyumbani kwao wakiwa na njaa, wataishiwa nguvu njiani[a]; na baadhi yao wametoka mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watalegea njiani.” Kitenzi cha Kigiriki kinaweza kumaanisha kudhoofika au kuchoka sana kiasi cha kushindwa kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: nikiwaaga waende
  rationale: Katika muktadha wa umati, kitenzi hiki humaanisha kuwaaga au kuwaruhusu waondoke, si kuwaweka huru kutoka kifungoni.
- source_word: νήστεις
  choice: wakiwa na njaa
  rationale: Hapa neno hilo linaeleza hali ya kukosa chakula, si lazima mfungo wa kidini; usemi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: εἰς οἶκον αὐτῶν
  choice: nyumbani kwao
  rationale: Huwasilisha kwa kawaida maana ya kila mmoja kurudi nyumbani kwake.
- source_word: ἐκλυθήσονται
  choice: wataishiwa nguvu
  rationale: Kitenzi kinaweza kumaanisha kudhoofika au kuchoka sana kiasi cha kushindwa kuendelea; tafsiri hii ni ya kawaida na haibani maana kuwa kuzimia tu.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni usemi mfupi na wa kawaida unaoonyesha jambo litakalotokea wakati wa safari.
- source_word: καί τινες αὐτῶν
  choice: na baadhi yao
  rationale: Hufuata uunganishi wa Kigiriki bila kuugeuza kimyakimya kuwa uhusiano wa kisababishi.
- source_word: ἀπὸ μακρόθεν
  choice: kutoka mbali
  rationale: Katika muktadha huu huonyesha umbali ambao baadhi ya watu wamesafiri.
- source_word: ἥκασιν
  choice: wametoka
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida hali yao ya sasa kama watu waliotoka mbali na kufika hapo.
