source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: sw
  text: Lakini yeye akageuka na kuwaona wanafunzi wake, akamkemea Petro, akisema, “Nenda nyuma yangu, Shetani! Kwa maana huyajali mambo ya Mungu, bali mambo ya wanadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: akageuka
  rationale: Kitenzi hiki kinaonyesha Yesu alibadili mwelekeo wa mwili wake; ‘akageuka’ ni ya kawaida na huhifadhi mfuatano wa simulizi.
- source_word: ἰδὼν
  choice: akawaona
  rationale: Huhifadhi tendo la Yesu kuwaona wanafunzi wake baada ya kugeuka, kwa Kiswahili cha kawaida cha simulizi.
- source_word: μαθητὰς
  choice: wanafunzi
  rationale: Ni istilahi ya kawaida ya Injili kwa wale wanaojifunza na kumfuata Yesu.
- source_word: ἐπετίμησεν
  choice: akamkemea
  rationale: ‘Kukemea’ huonyesha karipio kali la maneno na kupatana na matumizi ya ἐπιτιμάω katika Injili.
- source_word: καὶ λέγει
  choice: na kusema
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, Kiswahili cha simulizi huwasilisha kwa kawaida maana yake kwa ‘na kusema’ baada ya mfululizo wa vitenzi vya wakati uliopita.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Nenda nyuma yangu
  rationale: Huhifadhi kwa karibu amri ya Kigiriki na wazo la Petro kuchukua nafasi nyuma ya Yesu badala ya kuwa kikwazo mbele yake.
- source_word: Σατανᾶ
  choice: Shetani
  rationale: Ni jina au cheo cha kawaida katika Agano Jipya; tafsiri hii huhifadhi ukali wa mwito bila kuamua zaidi jinsi Petro anavyohusiana na Shetani.
- source_word: φρονεῖς
  choice: mawazo yako hayaelekei kwenye
  rationale: φρονέω inahusu mwelekeo wa fikra, mtazamo na kujali, si tendo la kufikiri tu. Usemi huu ni wa asili na huhifadhi upana huo.
- source_word: τὰ τοῦ θεοῦ
  choice: mambo ya Mungu
  rationale: Huhifadhi usemi mpana wa Kigiriki bila kuufupisha kuwa mapenzi, masilahi au makusudi ya Mungu pekee.
- source_word: τὰ τῶν ἀνθρώπων
  choice: mambo ya wanadamu
  rationale: ἄνθρωποι hapa humaanisha binadamu kwa ujumla. ‘Wanadamu’ ni sahihi kijinsia na huonyesha wazi tofauti kati ya mambo ya Mungu na yale ya kibinadamu.
theological_decisions:
- issue: Yule anayeitwa ‘Shetani’ katika karipio la Yesu kwa Petro
  choice: Yesu anamkemea Petro moja kwa moja kwa mwito ‘Shetani,’ huku tafsiri ikiacha wazi maana kamili ya uhusiano huo.
  alternative: Yesu anamwambia Shetani aliye nyuma ya Petro, au ‘Shetani’ humaanisha tu mpinzani asiye nafsi.
  rationale: Kisarufi, Petro ndiye anayekemewa na ndiye anayeelekezewa maneno. Hata hivyo, mstari haufafanui kwamba Petro ni Shetani kihalisi; tafsiri haiongezi ufafanuzi huo.
- issue: Maana ya ἀνθρώπων
  choice: wanadamu
  alternative: watu; wanaume
  rationale: Neno la Kigiriki hapa ni la kijumla kwa binadamu, si wanaume pekee. ‘Wanadamu’ huhifadhi maana hiyo na tofauti ya kitheolojia kati ya yaliyo ya Mungu na yaliyo ya kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo unafaa simulizi, na usemi mpana ‘mambo ya Mungu ... mambo ya wanadamu’ umehifadhiwa bila kuufasiri kupita kiasi.
