  naturalness: The narrative chain is idiomatic Standard East African Swahili. “Huyajali mambo ya Mungu, bali mambo ya wanadamu” is concise, natural, and suitably weighty for Jesus’ rebuke.
  terminology: “Wanafunzi,” “akamkemea,” “Shetani,” “mambo ya Mungu,” and “wanadamu” are appropriate and consistent. “Wanadamu” accurately represents the generic ανθρώπων; no gender-related footnote is needed in Swahili.
