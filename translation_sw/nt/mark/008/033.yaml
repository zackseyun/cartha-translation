    rationale: “Mawazo yako hayaelekei kwenye” focuses on Peter’s thoughts and their direction. The Greek denotes his mindset, concern, or orientation. “Huyajali” gives the intended contrast naturally and without interpretive expansion.
  - severity: low
    issue: The explicit subject “Yesu” is an addition to the source wording.
    rationale: The antecedent is clear, so “yeye” better reflects ὁ δέ while preserving fluent Swahili narrative.
