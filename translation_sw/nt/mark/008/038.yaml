id: MRK.8.38
reference: Mark 8:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: sw
  text: Kwa maana yeyote atakayenionea aibu mimi na maneno yangu katika kizazi hiki cha uzinzi na dhambi[a], Mwana wa Adamu naye atamwonea aibu wakati atakapokuja katika utukufu wa Baba yake pamoja na malaika watakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kizazi hiki kisichoaminifu na chenye dhambi.” “Cha uzinzi” kimehifadhiwa katika matini kuu kwa sababu Kigiriki kinatumia sitiari halisi ya kinabii ya uzinzi kuonyesha kutokuwa mwaminifu kwa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: atakayenionea aibu / atamwonea aibu
  rationale: Muundo “kumwonea mtu aibu” ni wa kawaida katika Kiswahili na unahifadhi maana ya kuaibika kwa sababu ya uhusiano na mtu au maneno yake, pamoja na uwiano kati ya tendo la sasa na jibu la baadaye.
- source_word: λόγους
  choice: maneno
  rationale: Wingi wa “maneno” unaakisi wingi wa Kigiriki na kuhifadhi msisitizo juu ya yale Yesu aliyosema bila kuyafupisha kwa tafsiri pana zaidi kama “ujumbe.”
- source_word: γενεᾷ
  choice: kizazi
  rationale: “Kizazi” ni ulinganifu wa moja kwa moja na unaofaa katika muktadha huu wa jamii ya wakati huo yenye sifa fulani za kimaadili.
- source_word: μοιχαλίδι
  choice: cha uzinzi
  rationale: Huhifadhi sitiari halisi ya kinabii ya uzinzi inayoweza kuashiria kutokuwa mwaminifu kiroho na kimaadili; maana mbadala inaelezwa katika tanbihi.
- source_word: ἁμαρτωλῷ
  choice: cha dhambi
  rationale: Ni usemi wa kawaida na unaoeleweka unaowasilisha sifa ya kuwa na dhambi bila kuongeza ukali wa maana kama “kiovu.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Huhifadhi cheo maalumu chenye mwangwi wa Kidanieli na uzito wa kimasiya badala ya kukibadilisha kuwa “mimi” au “Masihi.”
- source_word: δόξῃ
  choice: utukufu
  rationale: “Utukufu” ni istilahi ya kawaida ya kibiblia inayobeba maana ya heshima, fahari na mng’ao wa kimungu.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: pamoja na malaika watakatifu
  rationale: Ni Kiswahili cha asili kinachoakisi kivumishi cha Kigiriki bila kuongeza kimilikishi “wake,” ambacho hakipo katika chanzo.
- source_word: ὃς γὰρ ἐὰν
  choice: Kwa maana yeyote atakaye-
  rationale: “Kwa maana” huhifadhi uhusiano wa ufafanuzi wa γάρ, na “yeyote atakaye-” huwasilisha sharti la jumla kwa Kiswahili cha kawaida.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: katika kizazi hiki
  rationale: Huhifadhi mazingira ya kijamii na kimaadili yanayoonyeshwa na ἐν pamoja na hali ya wakati uliopo.
theological_decisions:
- issue: Nguvu ya kisitiari ya μοιχαλίδι
  choice: Kudumisha “cha uzinzi” katika matini kuu kama sitiari ya kinabii ya kutokuwa mwaminifu kiroho na kimaadili.
  alternative: “kisichoaminifu”
  rationale: Neno la Kigiriki linatumia taswira halisi ya uzinzi, yenye mwangwi wa lugha ya manabii kuhusu kuvunja uaminifu wa agano. Kulihifadhi huepuka kufifisha kina hicho, huku tanbihi ikieleza maana inayokusudiwa.
- issue: Rejeo la “Mwana wa Adamu”
  choice: Kuhifadhi cheo “Mwana wa Adamu.”
  alternative: “mimi” au “Masihi”
  rationale: Chanzo kinatumia cheo tofauti chenye umuhimu wa kikristo na wa wakati wa mwisho. Kukibadilisha kungeondoa mvutano na mwangwi wa matini ya chanzo.
- issue: Kiwakilishi αὐτόν
  choice: “atamwonea aibu”
  alternative: Usemi wa wingi usioainisha jinsia
  rationale: Kiambishi cha umoja cha ngeli ya mtu katika Kiswahili huhifadhi rejeo la mtu mmoja la Kigiriki kwa njia ya kawaida bila kulazimisha kiwakilishi huru cha kijinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umewekwa wazi na wa kiasili, huku urudiaji wa “aibu” na cheo “Mwana wa Adamu” vikihifadhiwa ili kudumisha uwiano na uzito wa matini ya Kigiriki.
