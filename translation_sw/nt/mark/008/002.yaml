  text: Ninauhurumia umati, kwa sababu tayari wamekuwa pamoja nami kwa siku tatu, na hawana kitu cha kula.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Ninauhurumia
  rationale: Kitenzi hiki huonyesha huruma ya ndani na yenye nguvu. ‘Ninauhurumia’ ni Kiswahili cha sasa, cha kawaida, na kinahifadhi wakati wa sasa.
- source_word: ἐπὶ τὸν ὄχλον
  choice: umati huu
  rationale: ἐπί pamoja na hali ya kushtakiwa huonyesha walengwa wa huruma. Kiswahili huunganisha walengwa moja kwa moja na kitenzi ‘hurumia.’ ‘Huu’ linafaa katika usemi wa moja kwa moja kuhusu watu waliopo, ingawa halijaandikwa kama kiwakilishi tofauti katika Kigiriki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaleta sababu ya Yesu kuuhurumia umati.
- source_word: ἤδη
  choice: tayari
  rationale: ‘Tayari’ linaonyesha kwamba muda huo ulikuwa umefikia siku tatu.
- source_word: ἡμέραι τρεῖς
  choice: kwa siku tatu
  rationale: ‘Kwa siku tatu’ ni namna ya kawaida ya Kiswahili ya kueleza muda uliodumu.
- source_word: προσμένουσίν μοι
  choice: wamekaa pamoja nami
  rationale: προσμένω ina maana ya kuendelea kukaa au kubaki pamoja na mtu. ‘Wamekaa pamoja nami’ ni ya asili na inaonyesha uwepo wao ulioendelea.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: hawana chakula
  rationale: Kirai hiki kina maana kwamba hawana kitu cha kula. ‘Hawana chakula’ ni Kiswahili fasaha na wazi bila kubadili maana.
