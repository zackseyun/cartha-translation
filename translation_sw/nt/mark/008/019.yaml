base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: sw
  text: “Nilipoimega ile mikate mitano kwa wale elfu tano[a], mliokota vikapu vingapi vilivyojaa vipande[b]?” Wakamwambia[c], “Kumi na viwili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wanaume elfu tano.” Kigiriki kinasema kihalisi “kwa wale elfu tano” kwa kutumia umbo la kiume.
    reason: alternative_reading
  - marker: b
    text: Yaani, vipande vya mikate vilivyobaki baada ya mikate kumegwa.
    reason: lexical_clarification
  - marker: c
    text: Kihalisi, “wakamwambia.”
    reason: literal_rendering
lexical_decisions:
- source_word: ὅτε
  choice: Nilipo-
  rationale: Kiambishi cha wakati -lipo- kinaanzisha kwa kawaida na kwa ufupi tukio la zamani ambalo Yesu analikumbusha.
- source_word: τοὺς πέντε ἄρτους
  choice: mikate mitano
  rationale: ἄρτος hapa ni kitu kinachohesabika katika simulizi la kulisha umati; kwa hiyo “mikate” ni sahihi kuliko “mkate” kwa maana ya chakula kwa ujumla.
- source_word: ἔκλασα
  choice: nilipoimega
  rationale: Kitenzi “mega” ni cha kawaida kwa kuvunja mkate vipande na kinadumisha uhusiano na vipande vilivyobaki.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: kwa wale elfu tano
  rationale: “Kwa” linaonyesha kwamba mikate ilimegwa kwa ajili ya umati huo; “wale elfu tano” linahifadhi mtajo mfupi wa Kigiriki bila kuongeza wazi “wanaume.”
- source_word: κοφίνους
  choice: vikapu
  rationale: κόφινος ni kikapu, huenda kikapu cha mkononi; neno la jumla “vikapu” ni wazi na la kawaida katika Kiswahili.
- source_word: κλασμάτων πλήρεις
  choice: vilivyojaa vipande
  rationale: Kirai hiki kinaeleza vikapu vilivyokuwa vimejaa vipande vilivyotokana na mikate iliyomegwa.
- source_word: ἤρατε
  choice: mliokota
  rationale: Katika muktadha wa mabaki, “okota” linaeleza kwa kawaida tendo la kuvikusanya vipande, ingawa maana ya msingi ya kitenzi inaweza kutafsiriwa “inua” au “chukua.”
- source_word: λέγουσιν αὐτῷ
  choice: Wakamjibu
  rationale: Ingawa Kigiriki kinasema kihalisi “wanamwambia,” muktadha ni jibu kwa swali la Yesu; “wakamjibu” ni Kiswahili cha kawaida cha simulizi na kinabainisha kazi ya kauli bila kubadili maana.
- source_word: Δώδεκα
  choice: Kumi na viwili
  rationale: Jibu linarejelea vikapu, nomino ya ngeli ya KI-VI, hivyo upatanisho wa kawaida ni “viwili.”
theological_decisions:
- issue: Maana wakilishi ya πεντακισχιλίους
  choice: wale elfu tano
  alternative: wanaume elfu tano
  rationale: Kigiriki kinatumia umbo la wingi la kiume kama jina la kundi. Linaweza kueleweka kuwa wanaume, lakini katika mstari huu pia linatumika kama mtajo wa kawaida wa umati unaojulikana. Tafsiri kuu haiongezi ubainisho ambao muktadha wa karibu haulazimishi; uwezekano wa “wanaume” unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. “Mega” na “okota” ni maneno ya sasa yanayoeleweka kwa urahisi; muundo wa swali umehifadhi mkazo wa Yesu juu ya idadi ya vikapu.
