id: MRK.8.22
reference: Mark 8:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: sw
  text: Nao wakafika Bethsaida. Nao wakamletea mtu kipofu, wakamsihi amguse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: wakafika
  rationale: Ni wakati uliopo wa kihistoria katika simulizi; wakati uliopita wa Kiswahili unasomeka kwa kawaida, na ‘kufika’ huonyesha kuwasili kwao huko Bethsaida.
- source_word: εἰς Βηθσαϊδάν
  choice: Bethsaida
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili; kitenzi ‘wakafika’ tayari huwasilisha wazo la kuelekea na kuwasili mahali hapo bila kuhitaji kihusishi tofauti.
- source_word: φέρουσιν
  choice: wakamletea
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati wa simulizi. ‘Kumletea’ ni mpana na wa kawaida kuliko ‘kumbeba,’ ambalo lingeongeza namna ya kumfikisha isiyotajwa.
- source_word: τυφλὸν
  choice: mtu kipofu
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinamtaja mtu wa kiume; ‘mtu kipofu’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: παρακαλοῦσιν
  choice: wakamsihi
  rationale: ‘Kusihi’ huonyesha ombi la dhati na lenye nguvu kuliko ‘kuomba’ pekee, bila kulitia chumvi.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: amguse
  rationale: Muundo wa ἵνα pamoja na tegemezi unaeleza yaliyomo katika ombi; tegemezi la Kiswahili baada ya ‘kusihi’ ni la kawaida na huhifadhi maana ya ‘ili amguse/kwamba amguse.’
- source_word: καὶ
  choice: Nao / waka-
  rationale: Muunganiko wa Marko umehifadhiwa kwa ‘Nao’ mwanzoni na mfuatano wa vitenzi vya ‘waka-’, ambao ni njia ya asili ya Kiswahili ya kuendeleza simulizi bila kurudia ‘na’ kwa namna nzito.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Muundo wa ‘waka-’ unahifadhi mfululizo wa matukio wa καί, huku nyakati zilizopo za kihistoria zikionyeshwa kwa wakati wa simulizi wa Kiswahili.
