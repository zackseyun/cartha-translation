  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: sw
  text: Kwa maana, itamfaidia nini mtu kuupata ulimwengu wote na kupoteza uhai wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yake.” Neno la Kigiriki ψυχή linaweza kumaanisha “uhai,” “nafsi,” au “mtu mwenyewe,” kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Kwa maana, ... nini
  rationale: “Nini” huanzisha swali la balagha, na “kwa maana” hudumisha uhusiano wa maelezo na mafundisho yaliyotangulia.
- source_word: ὠφελεῖ
  choice: itamfaidia
  rationale: Kitenzi hiki humaanisha kunufaisha au kufaidisha; hapa kinadumisha taswira ya faida inayokinzana na kupata na kupoteza.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Neno hili limetumiwa kwa maana ya jumla kuhusu mwanadamu yeyote; “mtu” ni la kawaida, jumuishi, na sahihi katika Kiswahili.
- source_word: κερδῆσαι
  choice: kuupata
  rationale: Hutoa maana ya kujipatia au kupata, na hudumisha ukinzani wa kibiashara kati ya faida na hasara.
- source_word: τὸν κόσμον ὅλον
  choice: ulimwengu wote
  rationale: Huwasilisha upeo kamili unaosisitizwa na ὅλον kwa Kiswahili cha kawaida.
- source_word: ζημιωθῆναι
  choice: kupoteza
  rationale: Ingawa umbo la Kigiriki linaweza kumaanisha kupata hasara au kunyanganywa, “kupoteza” ni la asili katika Kiswahili na huonyesha wazi ukinzani na kuupata ulimwengu.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: uhai wake
  rationale: Katika muktadha wa Marko 8:35–37, ψυχή huhusu hasa uhai ambao mtu anaweza kujaribu kuuokoa au akaupoteza. “Nafsi yake” bado ni tafsiri halali, kwa hiyo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: 'Maana ya ψυχή katika fundisho kuhusu ufuasi: “uhai” au “nafsi”'
  choice: uhai wake
  alternative: nafsi yake
  rationale: Muktadha wa karibu unasisitiza kuokoa au kupoteza uhai kwa ajili ya Yesu na Injili. “Uhai” hudumisha mwendelezo huo bila kuamua kimyakimya fundisho mahususi kuhusu muundo wa mwanadamu; “nafsi” imewekwa katika tanbihi ili kuhifadhi upana halisi wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha ni wa kawaida na unaeleweka kwa urahisi. “Mtu” tayari ni neno la jumla katika Kiswahili, hivyo hakuna haja ya tanbihi ya kijinsia.
