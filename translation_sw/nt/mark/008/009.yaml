  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: sw
  text: Walikuwa karibu elfu nne, naye akawaacha waende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaruhusu waondoke.”
    reason: Mbadala huu unaonyesha maana nyingine ya kawaida ya ἀπολύω katika muktadha huu, yaani kuwaruhusu watu waende zao.
lexical_decisions:
- source_word: ἦσαν
  choice: Walikuwa
  rationale: Katika muktadha huu kitenzi kinaeleza idadi ya watu waliokuwapo; “walikuwa” ni usemi wa kawaida wa Kiswahili unaoendana na kundi linalotajwa katika muktadha.
- source_word: δὲ
  choice: ','
  rationale: δὲ ni kiunganishi hafifu cha simulizi. Hapa mtiririko wake unawakilishwa kwa uakifishaji bila kuongeza neno zito la wakati au upinzani.
- source_word: ὡς
  choice: karibu
  rationale: ὡς inapotumiwa pamoja na idadi huonyesha makadirio; “karibu” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: τετρακισχίλιοι
  choice: elfu nne
  rationale: Hii ndiyo idadi inayotajwa moja kwa moja katika matini, ikirejelea watu wa kundi hilo.
- source_word: καὶ
  choice: naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na wakati huohuo kinamtaja Yesu kama mtendaji; “naye” ni ya asili katika Kiswahili.
- source_word: ἀπέλυσεν
  choice: akawaacha waende
  rationale: Katika muktadha wa umati baada ya kulishwa, kitenzi kinamaanisha kuwaondosha au kuwaruhusu waende. “Akawaacha waende” ni wazi na ya kawaida bila kudokeza kufunguliwa gerezani.
- source_word: αὐτούς
  choice: wa-
  rationale: Kiwakilishi kinachorejelea watu hao kimewakilishwa kimaumbo katika kiambishi cha ngeli ya watu ndani ya “akawaacha.”
