base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: sw
  text: Na nilipoimega ile mikate saba kwa ajili ya watu elfu nne, mliokota vikapu vikubwa[a] vingapi vilivyojaa vipande? Wakamwambia, “Saba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki σπυρίς linamaanisha kikapu kikubwa, tofauti na neno la aina ndogo ya kikapu lililotumiwa katika Marko 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Na nilipomega
  rationale: Kiunganishi ‘Na’ kinaendeleza ulinganisho na muujiza uliotajwa katika mstari uliotangulia; kitenzi ‘nilipomega’ kinajazwa kutokana na muktadha ili sentensi iwe ya kawaida na inayoeleweka katika Kiswahili.
- source_word: τοὺς ἑπτὰ
  choice: ile mikate saba
  rationale: Namba yenye kibainishi inarejelea mikate saba ya Marko 8:5–6. Kiswahili kinahitaji kutaja nomino iliyodokezwa ili sentensi iwe wazi na ya kawaida.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: kwa ajili ya watu elfu nne
  rationale: Kirai kinaonyesha kundi lililonufaika na ugawaji wa mikate; ‘watu’ inaweka wazi nomino iliyodokezwa na namba hiyo.
- source_word: πόσων σπυρίδων
  choice: vikapu vikubwa vingapi
  rationale: σπυρίς ni kikapu kikubwa, tofauti na aina ya kikapu iliyotajwa katika Marko 8:19; tafsiri hii inadumisha tofauti hiyo ya kileksia.
- source_word: πληρώματα κλασμάτων
  choice: vilivyojaa vipande
  rationale: Kirai kinaeleza vikapu vilivyojaa vipande vilivyobaki baada ya mkate kumegwa. ‘Vipande’ ni lugha ya kawaida na haiongezi maelezo yasiyo ya lazima.
- source_word: ἤρατε
  choice: mliokota
  rationale: Katika muktadha huu kitenzi kinamaanisha kukusanya vipande vilivyobaki; ‘mliokota’ ni cha kawaida na sahihi.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Wakati uliopo wa kisimulizi katika Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili ili mtiririko uwe wa kawaida.
- source_word: Ἑπτά
  choice: Saba
  rationale: Ni jibu la moja kwa moja linalotaja idadi ya vikapu.
