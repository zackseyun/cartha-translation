  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: sw
  text: Nao walikuwa wamesahau kuchukua mkate[a], na hawakuwa na mkate pamoja nao mashuani isipokuwa mkate mmoja tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “mikate.” Wingi wa neno la Kigiriki unaweza kumaanisha mikate kadhaa, lakini hapa huenda unamaanisha mkate au chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: walikuwa wamesahau
  rationale: Wakati timilifu uliopita unafaa katika muktadha huu kwa kuwa kusahau kwao kulitokea kabla ya hali ya kutokuwa na mkate mashuani.
- source_word: λαβεῖν
  choice: kuchukua
  rationale: Kitenzi hiki kinakamilisha maana ya ‘wamesahau’ na hapa humaanisha kuchukua mkate waende nao.
- source_word: ἄρτους
  choice: mkate
  rationale: Ingawa umbo la Kigiriki ni wingi na linaweza kumaanisha mikate kadhaa, katika muktadha huu linaweza kutaja mkate kama chakula kwa ujumla; Kiswahili cha umoja ni cha kawaida na cha kueleweka.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: isipokuwa mmoja tu
  rationale: εἰ μή hapa ni kauli ya kuondoa kitu kimoja katika jumla, si sharti; ‘mmoja tu’ huhifadhi msisitizo kwamba walikuwa na mkate mmoja pekee.
- source_word: οὐκ εἶχον
  choice: hawakuwa na mkate mwingine
  rationale: Neno ‘mwingine’ linaonyesha kwa kawaida kwamba, mbali na mkate mmoja uliotajwa, hawakuwa na mkate zaidi.
- source_word: μεθ’ ἑαυτῶν
  choice: pamoja nao
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa maana ya kuwa na kitu walichoenda nacho.
- source_word: ἐν τῷ πλοίῳ
  choice: mashuani
  rationale: Hutoa kwa ufupi na kwa kawaida mahali walipokuwa, yaani ndani ya mashua.
