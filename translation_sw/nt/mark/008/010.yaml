  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: sw
  text: Mara moja[a] akapanda mashua pamoja na wanafunzi wake, akaenda katika maeneo ya Dalmanutha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wilaya ya Dalmanutha.” Kwa halisi, Kigiriki hutumia usemi wa wingi, “maeneo/sehemu za Dalmanutha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara
  rationale: Katika muktadha huu linaonyesha kuwa tendo lilifuata bila kuchelewa; “mara” ni la kawaida na hudumisha mwendo wa haraka wa simulizi la Marko.
- source_word: ἐμβὰς
  choice: akapanda
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kwenda; muundo wa mfululizo “akapanda ... akaenda” ni wa asili katika Kiswahili.
- source_word: πλοῖον
  choice: mashua
  rationale: Katika mazingira ya Bahari ya Galilaya, “mashua” linafaa zaidi kuliko “meli,” ambalo kwa kawaida hudokeza chombo kikubwa zaidi.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: Huwasilisha wazi maana ya kuandamana iliyomo katika μετά pamoja na hali ya umilikaji ya αὐτοῦ.
- source_word: ἦλθεν
  choice: akaenda
  rationale: Katika simulizi la kusafiri kuelekea mahali fulani, “akaenda” ni la kawaida na linalingana na mtazamo wa msimulizi.
- source_word: τὰ μέρη
  choice: maeneo
  rationale: Wingi wa Kigiriki umehifadhiwa kwa neno la kawaida “maeneo,” bila kuubadili kimya kimya kuwa umoja.
- source_word: Δαλμανουθά
  choice: Dalmanutha
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili bila kutafsiriwa.
