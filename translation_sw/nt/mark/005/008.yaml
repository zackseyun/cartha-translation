  text: Kwa maana alikuwa akimwambia, “Toka katika mtu huyu, ewe roho mchafu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akimwambia
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa wakati uliopita; muundo huu ni wa kawaida katika Kiswahili na unadumisha hali hiyo ya kisimulizi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa maelezo ya msingi kwa yaliyotangulia; “Kwa maana” kinahifadhi uhusiano huo bila kuufafanua kupita kiasi.
- source_word: αὐτῷ
  choice: -mw- katika “akimwambia”
  rationale: Kiwakilishi cha nafsi cha udativu kinarejelea mtu aliyepagawa katika sura ya simulizi, huku amri yenyewe ikielekezwa kwa roho mchafu.
- source_word: Ἔξελθε
  choice: Mtoke
  rationale: Amri hii ya moja kwa moja inaeleza kutoka ndani ya mtu. “Mtoke” ni Kiswahili cha kawaida na huonyesha wazi kwamba roho inaamriwa kutoka ndani yake.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: ewe roho mchafu
  rationale: Ingawa muundo wa Kigiriki una kibainishi, hapa unafanya kazi kama mwito wa moja kwa moja. “Ewe” huweka wazi mwito huo kwa lugha ya heshima na ya kawaida.
- source_word: ἐκ
  choice: -toke
  rationale: Pamoja na kitenzi cha kutoka, kihusishi hiki kinaonyesha mwendo kutoka ndani; maana hiyo imewasilishwa kiasili katika “mtoke.”
- source_word: τοῦ ἀνθρώπου
  choice: mtu huyu
  rationale: Neno linamrejelea mtu maalumu wa kiume katika simulizi. Kiswahili “mtu huyu” ni cha kawaida katika amri hii na kinamtambulisha mhusika anayezungumziwa bila kuongeza maana ya kiitikadi.
theological_decisions:
- issue: Tafsiri ya πνεῦμα ἀκάθαρτον katika muktadha wa kutoa pepo
  choice: roho mchafu
  alternative: roho mwovu
  rationale: Kigiriki kinasema moja kwa moja “roho mchafu,” usemi unaobeba maana ya uchafu wa kidini na kimaadili. “Roho mwovu” ni tafsiri elezi zaidi na haidumishi istilahi ya chanzo kwa usahihi uleule.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa “alikuwa akimwambia” huhifadhi hali endelevu ya ἔλεγεν, na “ewe” huonyesha wazi kwamba “roho mchafu” ni mwito wa moja kwa moja.
