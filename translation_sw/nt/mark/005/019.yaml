base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: sw
  text: Hakumruhusu, bali akamwambia, “Nenda nyumbani kwako, kwa watu wako,[a] ukawaambie mambo yote ambayo Bwana[b] amekutendea na jinsi alivyokuhurumia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, “kwa walio wako.” Usemi huu unaweza kumaanisha familia, jamaa, na watu wengine wa karibu.
    reason: lexical_alternative
  - marker: b
    text: “Bwana” hapa anaweza kueleweka kuwa Mungu; pia usemi huu unaweza kudumisha kwa makusudi uhusiano kati ya rehema ya Mungu na mamlaka na tendo la Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: hakumruhusu
  rationale: Katika muktadha huu ἀφίημι humaanisha kuruhusu, si kusamehe au kuacha. ‘Hakumruhusu’ ni Kiswahili cha kawaida na sahihi.
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati wa simulizi wa Kiswahili unaeleweka vizuri zaidi kwa ‘akamwambia.’
- source_word: Ὕπαγε
  choice: Nenda
  rationale: Amri hii inamtaka aende mahali palipotajwa; ‘Nenda’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: εἰς τὸν οἶκόν σου
  choice: nyumbani kwako
  rationale: οἶκος hapa inaelekeza kwenye mazingira ya nyumbani, si lazima jengo la nyumba pekee.
- source_word: πρὸς τοὺς σούς
  choice: kwa watu wako
  rationale: Usemi wa Kigiriki ni ‘kwa walio wako.’ ‘Watu wako’ ni wa asili katika Kiswahili na hauzuii maana kuwa familia, jamaa, au watu wengine wa karibu.
- source_word: ἀπάγγειλον
  choice: ukawaambie
  rationale: ἀπαγγέλλω ni kutoa taarifa au kusimulia jambo. ‘Ukawaambie’ ni ya kawaida na hudumisha agizo la kutoa habari kwao.
- source_word: ὅσα
  choice: mambo yote ambayo
  rationale: ὅσα huonyesha jumla au ukubwa wa yale yaliyofanywa. ‘Mambo yote ambayo’ hudumisha maana hiyo kwa Kiswahili sanifu.
- source_word: ὁ κύριός σοι πεποίηκεν
  choice: Bwana amekutendea
  rationale: σοι inaunganishwa kwa kawaida na kitenzi kwa maana ya jambo lililofanywa kwa ajili ya mtu. ‘Bwana’ hudumisha κύριος bila kuamua kimyakimya ikiwa hapa anatajwa Mungu au ikiwa kuna uhusiano wa makusudi na mamlaka ya Yesu.
- source_word: ἠλέησέν σε
  choice: jinsi alivyokuhurumia
  rationale: Kitenzi kinaonyesha tendo la kuonyesha rehema au huruma. ‘Alivyokuhurumia’ ni cha asili na hudumisha uzito wa rehema iliyotendwa kwa mtu huyo.
theological_decisions:
- issue: Utambulisho wa κύριος katika maneno ya Yesu kuhusu aliyemtendea mtu huyo
  choice: Bwana
  alternative: Mungu
  rationale: '‘Bwana’ ndiyo tafsiri ya kawaida ya κύριος na hudumisha mvutano wa kifungu: Yesu anaagiza mtu atangaze yale ambayo Bwana amemtendea, ingawa katika simulizi Yesu mwenyewe ndiye ametenda kwa mamlaka na rehema. Kutumia ‘Mungu’ katika matini kuu kungeamua jambo ambalo Kigiriki huliacha wazi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mtindo wa simulizi umetumia ‘akamwambia’ na muundo wa agizo ‘ukawaambie’ ili sentensi isikike ya kawaida bila kupunguza maana ya Kigiriki.
