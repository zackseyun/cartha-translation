  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: sw
  text: Nao wale walioona waliwasimulia jinsi ilivyomtokea yule mtu aliyekuwa amepagawa na pepo[a], na kuhusu nguruwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule mwenye pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: waliwasimulia
  rationale: Kitenzi hiki humaanisha kueleza au kusimulia tukio kwa mpangilio au kwa maelezo. “Waliwasimulia” ni Kiswahili cha kawaida na chenye hadhi kinachofaa taarifa ya mashahidi.
- source_word: οἱ ἰδόντες
  choice: wale waliokuwa wameona
  rationale: Muundo huu huhifadhi kishirikishi chenye kibainishi na kuwatambulisha watu walioona tukio bila kuongeza jina la kiufafanuzi kama “mashahidi wa tukio.”
- source_word: πῶς ἐγένετο
  choice: jinsi ilivyokuwa imetokea
  rationale: “Jinsi” huhifadhi maana ya namna au mwenendo wa tukio, na wakati timilifu unaonyesha kuwa tukio lilitangulia kusimuliwa kwake.
- source_word: τῷ δαιμονιζομένῳ
  choice: kwa yule mtu aliyekuwa amepagawa na pepo
  rationale: Hii ni kauli ya kawaida katika Kiswahili inayoeleza wazi kwamba mtu huyo alikuwa chini ya nguvu za pepo, huku ikidumisha kwamba anayezungumziwa ni mtu, si kumpa tu lebo.
- source_word: περὶ τῶν χοίρων
  choice: kuhusu wale nguruwe
  rationale: “Kuhusu” hutoa maana ya περί pamoja na jenitivi kwa Kiswahili cha kawaida, na “nguruwe” ndilo neno la sasa na la moja kwa moja kwa χοίρων.
theological_decisions:
- issue: Ufasiri wa δαιμονιζομένῳ katika simulizi la utendaji wa pepo
  choice: yule mtu aliyekuwa amepagawa na pepo
  alternative: yule mwenye pepo; yule mtu aliyekuwa amepagawa na pepo mchafu
  rationale: Chaguo hili linawasilisha mateso halisi ya kipepo yanayotajwa na simulizi bila kuyageuza kuwa hali ya kisaikolojia tu. Pia haliongezi hapa kivumishi “mchafu,” ambacho hakipo katika mstari huu, ingawa kimetokea katika muktadha wa karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” hudumisha mwendelezo wa simulizi; “na pia” huonyesha kuwa taarifa yao ilihusu pia nguruwe. Kiashiria cha tanbihi [a] kimewekwa mara moja baada ya kirai kinachohusika.
