  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: sw
  text: Hakumruhusu mtu yeyote aandamane naye isipokuwa Petro, Yakobo na Yohana, ndugu wa Yakobo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: Hakumruhusu
  rationale: Katika muundo huu wenye kitenzi-jina, ἀφίημι humaanisha kuruhusu. Umbo hili linaonyesha kwa kawaida kwamba Yesu hakutoa ruhusa.
- source_word: οὐδένα
  choice: mtu yeyote
  rationale: Pamoja na ukanushi katika “Hakumruhusu,” kirai hiki huwasilisha kwa uwazi kutoruhusiwa kwa mtu hata mmoja.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: aandamane naye
  rationale: συνακολουθέω huonyesha kufuatana au kwenda pamoja na mtu; “aandamane naye” ni Kiswahili cha kawaida kinachohifadhi wazo la kwenda pamoja na Yesu bila uradidi.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hapa kirai hiki kinaanzisha jambo linalotengwa katika ukanushi, wala si sharti.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petro, Yakobo na Yohana
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; orodha yenye koma na “na” ya mwisho ni ya asili katika Kiswahili huku ikihifadhi washiriki wote watatu.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: ndugu yake Yakobo
  rationale: Kirai hiki kinamtambulisha Yohana kuwa ndugu wa Yakobo; “ndugu yake Yakobo” ni cha wazi na cha kawaida katika Kiswahili.
