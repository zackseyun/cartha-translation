id: MRK.5.1
reference: Mark 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: sw
  text: Nao wakafika ng’ambo ya bahari, katika eneo la Wagerasi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zinasema “Wagadara”; nyingine zinasema “Wagergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi mtiririko wa masimulizi ya Marko bila kuugeuza waziwazi kuwa mfuatano wa wakati kama ‘Kisha’.
- source_word: ἦλθον
  choice: wakafika
  rationale: Kitenzi cha wingi kinawahusu Yesu na wale waliokuwa pamoja naye; ‘wakafika’ ni Kiswahili cha kawaida katika simulizi na huonyesha kufika walikokuwa wakielekea.
- source_word: εἰς τὸ πέραν
  choice: ng’ambo
  rationale: Hii ni njia ya kawaida na ya asili ya kueleza upande wa pili wa maji, huku ikihifadhi maana ya kuelekea upande wa pili.
- source_word: τῆς θαλάσσης
  choice: ya bahari
  rationale: Ingawa kinachorejelewa ni Ziwa la Galilaya, neno la Kigiriki ni ‘bahari’; tafsiri hii inahifadhi istilahi ya chanzo na matumizi ya kawaida ya Injili.
- source_word: εἰς τὴν χώραν
  choice: katika eneo
  rationale: χώρα hapa ni eneo au wilaya, si nchi kwa maana ya taifa la kisasa; ‘eneo’ ni wazi na la kawaida.
- source_word: Γερασηνῶν
  choice: la Wagerasi
  rationale: Jina hili la watu linalotokana na mahali limetafsiriwa kwa umbo la kawaida la Kiswahili la majina ya wakazi, huku likifuata usomaji wa SBLGNT.
theological_decisions:
- issue: Tofauti ya maandishi na jiografia kuhusu jina la eneo katika simulizi
  choice: Wagerasi
  alternative: Wagadara; Wagergesa
  rationale: SBLGNT inasoma Γερασηνῶν. Kwa kuwa hati za kale hutofautiana kuhusu jina hili, matini kuu inafuata chanzo kilichotolewa na tanbihi inahifadhi usomaji mwingine muhimu bila kutatua kimyakimya mvutano wa kimaandishi na kijiografia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. ‘Nao wakafika’ inadumisha muunganiko wa masimulizi; ‘ng’ambo ya bahari’ ni fasaha na inaeleweka kwa wasomaji wa kawaida.
