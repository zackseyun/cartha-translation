    issue: ‘tuwaingie’ is awkward and potentially unclear in Standard East African Swahili.
    rationale: Although it attempts to make ‘nguruwe’ the direct object of ‘ingia,’ ordinary idiomatic Swahili expresses this sense as ‘kuingia ndani ya/yao.’ The explicit locative construction also better preserves εἰς αὐτούς (‘into them’).
