  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: sw
  text: Nao wakamsihi wakisema, “Tutume kwa nguruwe, ili tuingie ndani yao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: wakamsihi
  rationale: Katika muktadha huu, παρακαλέω huonyesha ombi la dhati na la kusisitiza. ‘Wakamsihi’ ni Kiswahili cha kawaida chenye uzito unaofaa kuliko ‘wakamwomba’.
- source_word: αὐτὸν
  choice: -m- katika ‘wakamsihi’
  rationale: Kiwakilishi cha yambwa kinamrejelea Yesu na kwa kawaida huunganishwa ndani ya kitenzi cha Kiswahili.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi kazi ya kirai-shirikishi kinachotambulisha maneno ya ombi kwa mtiririko wa asili wa Kiswahili.
- source_word: Πέμψον
  choice: Tutume
  rationale: πέμπω humaanisha ‘tuma.’ Tafsiri hii huhifadhi amri iliyo wazi badala ya kuibadili kuwa ombi la ruhusa, ingawa ruhusa inadokezwa na muktadha.
- source_word: ἡμᾶς
  choice: tu- katika ‘Tutume’
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kama yambwa huingizwa ndani ya kitenzi cha Kiswahili.
- source_word: εἰς τοὺς χοίρους
  choice: kwa wale nguruwe
  rationale: χοῖρος ni ‘nguruwe.’ Kwa kuwa kitenzi cha kutuma kwa kawaida huenda na ‘kwa’ katika Kiswahili, muundo huu ni wa asili; wazo la kuingia ndani yao linaelezwa wazi katika kishazi kinachofuata.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi la ombi kwa ufupi na kwa Kiswahili sanifu.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: tuwaingie
  rationale: Huhifadhi maana ya kuingia ndani ya nguruwe. ‘Tuwaingie’ ni wazi, fupi, na inaonyesha kuwa nguruwe ndio wanaoingiwa.
theological_decisions:
- issue: Hali ya ombi la wasemaji kwa Yesu
  choice: Wanaonyeshwa wakimsihi Yesu awatume kwa nguruwe ili wawaingie, jambo linalodokeza kuwa wako chini ya mamlaka yake.
  alternative: Kusema tu kwamba waliomba kuhamishwa bila kusisitiza utegemezi wao kwa mamlaka ya Yesu.
  rationale: ‘Wakamsihi’ na ‘Tutume’ zinafuata nguvu ya maneno ya Kigiriki na taswira ya simulizi bila kuongeza dai la kimafundisho lisilosemwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kwa wale nguruwe’ unasikika wa asili baada ya ‘Tutume,’ huku ‘tuwaingie’ ukihifadhi wazi mwendo wa kuingia ndani yao. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya Kiingereza ‘pigs/swine’ yote hutafsiriwa kawaida kuwa ‘nguruwe’ katika Kiswahili.
