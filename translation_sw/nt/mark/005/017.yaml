  text: And they began to beg him to leave their region[a].
translation:
  language: sw
  text: Nao wakaanza kumsihi aondoke kutoka eneo lao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamsihi aondoke kutoka katika nchi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Inaendeleza simulizi kwa njia ya kawaida katika Kiswahili bila kuongeza maana ya wakati isiyomo wazi katika kiunganishi cha Kigiriki.
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina unaonyesha mwanzo wa tendo; “wakaanza” ni wa kawaida na sahihi katika simulizi.
- source_word: παρακαλεῖν
  choice: kumsihi
  rationale: Katika muktadha huu neno linaonyesha ombi la kusisitiza na lenye uzito. “Kumsihi” huhifadhi nguvu hiyo bila kudai kwa lazima kwamba walipiga magoti au walilia.
- source_word: αὐτὸν
  choice: -m- katika “kumsihi”
  rationale: Kiwakilishi hiki ni yambwa kinachomrejelea Yesu; katika Kiswahili huwakilishwa kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: ἀπελθεῖν
  choice: aondoke
  rationale: Hueleza jambo walilomsihi afanye. “Aondoke” ni Kiswahili cha sasa na cha kawaida, huku kikihifadhi wazo la kwenda zake kutoka mahali hapo.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: katika eneo lao
  rationale: Ingawa ὅρια linaweza kumaanisha mipaka, katika usemi huu linarejelea nchi au eneo lililo ndani ya mipaka yao. “Katika eneo lao” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Kumsihi” limechaguliwa badala ya “kumwomba” ili kuonyesha uzito wa παρακαλεῖν; “eneo” linaepuka tafsiri ngumu ya moja kwa moja ya “mipaka” huku likihifadhi maana ya kijiografia.
