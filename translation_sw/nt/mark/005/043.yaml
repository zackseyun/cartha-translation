  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: sw
  text: Akawaagiza kwa ukali kwamba mtu yeyote asijue jambo hili[a], kisha akasema apewe chakula ale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akawaagiza kwa msisitizo mkubwa kwamba mtu yeyote asijue jambo hili.” Neno la Kigiriki linalotafsiriwa “kwa ukali” kwa maana halisi ni “mengi” au “sana,” nalo linatilia agizo mkazo.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “apewe ili ale”; Kigiriki hakitaji wazi kitu kinachopewa. Yaani, apewe kitu cha kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: Akawaagiza kwa ukali
  rationale: Kitenzi cha kati pamoja na πολλὰ kinaonyesha agizo lenye msisitizo mkubwa. ‘Kuwaagiza kwa ukali’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya usemi bila kulazimisha maana ya kurudia-rudia.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: kwamba mtu yeyote asijue jambo hili
  rationale: Muundo wa ἵνα pamoja na hali tegemezi unaeleza lengo la agizo. ‘Asijue’ huhifadhi maana ya kutopata habari au kutambua jambo hilo, huku ‘jambo hili’ likirejelea tukio lililotangulia.
- source_word: εἶπεν
  choice: akasema
  rationale: Hili ndilo neno la moja kwa moja linalolingana na εἶπεν; muktadha unaonyesha kwamba kauli hiyo ilikuwa maelekezo bila kubadili kitenzi kuwa ‘akaamuru.’
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: apewe chakula ale
  rationale: ‘Apewe’ huhifadhi hali ya kutendwa ya δοθῆναι. ‘Chakula’ kinawekwa wazi kwa Kiswahili cha kawaida kama kitu kinachodokezwa na usemi halisi ‘apewe ale.’
theological_decisions:
- issue: Siri kuhusu tukio na upeo wa agizo la Yesu
  choice: Kutafsiri kama agizo kali kwamba jambo hili lisijulikane na mtu yeyote
  alternative: Kueleza wazi kuwa agizo lilihusu familia au mashahidi waliokuwapo tu, au kulifafanua kama sehemu ya mada pana ya siri ya Masihi
  rationale: Mstari wenyewe hautoi ufafanuzi huo wa kitheolojia wala hauwekei ‘mtu yeyote’ kikomo cha wazi. Tafsiri inadumisha upeo na mvutano wa kauli ya Kigiriki bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaagiza kwa ukali’ ni wazi kwa wasomaji wa kawaida; ‘apewe chakula ale’ ni ya asili zaidi kuliko kufuata kihalisi ‘apewe ale,’ huku tanbihi ikihifadhi muundo wa chanzo.
