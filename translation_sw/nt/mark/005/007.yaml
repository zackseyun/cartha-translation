  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: sw
  text: Akapiga kelele kwa sauti kubwa, akasema, “Nina nini nawe[a], Yesu, Mwana wa Mungu Aliye Juu Sana? Ninakuapisha kwa Mungu[b], usinitese.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuna nini mimi nawe?” Usemi wa Kigiriki unaonyesha kujitenga, kupingana, au kutotaka kuhusika na mwingine.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ninakusihi kwa Mungu.” Kitenzi cha Kigiriki kinaweza kumaanisha kumwekea mtu agizo zito kwa kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: akapiga kelele
  rationale: Kitenzi hiki kinaonyesha kilio au kelele ya nguvu; tafsiri hii ni ya kawaida katika Kiswahili na inaendeleza uzito wa tukio.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Inahifadhi wazi ukubwa wa sauti uliotajwa katika Kigiriki bila kupunguza maelezo kuwa kielezi tu.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, Kiswahili sanifu husimulia mfuatano huu kwa wakati wa ka bila kupoteza uhai wa simulizi.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Nina nini nawe
  rationale: Ni usemi mfupi wa kujitenga au kupinga unaodumisha ukali wa swali. Tanbihi inaeleza maana yake kwa sababu si swali la kawaida la kutafuta taarifa.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Mwana wa Mungu Aliye Juu Zaidi
  rationale: Inahifadhi cheo cha Yesu kama Mwana na pia sifa ya Mungu kuwa Aliye Juu Zaidi kwa mpangilio wa kawaida wa Kiswahili.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Ninakuapisha kwa Mungu
  rationale: ‘Kuapisha’ huhifadhi wazo la kumwekea mtu agizo zito kwa kiapo, badala ya kulifanya kuwa ombi la kawaida tu.
- source_word: μή με βασανίσῃς
  choice: usinitese
  rationale: ‘Kutesa’ ni neno la kawaida na lenye nguvu linaloweza kuonyesha maumivu makali bila kubainisha njia ya mateso ambayo andiko halitaji.
theological_decisions:
- issue: Utambuzi wa Yesu unaotamkwa na pepo
  choice: Mwana wa Mungu Aliye Juu Zaidi
  alternative: Mwana wa Mungu, Aliye Juu Zaidi
  rationale: Tafsiri inahifadhi ungamo lililo wazi katika mstari bila kuongeza maelezo ya kimafundisho yasiyokuwamo humo.
- issue: Uzito wa ὁρκίζω katika ombi la pepo kwa Yesu
  choice: Ninakuapisha kwa Mungu
  alternative: Ninakusihi kwa Mungu
  rationale: ‘Ninakuapisha’ hudumisha mvutano wa ajabu wa pepo kumwomba Yesu kwa kumtaja Mungu na huhifadhi nguvu ya kiapo iliyomo katika kitenzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nina nini nawe?’ limehifadhiwa kwa ufupi na ukali wake, huku tanbihi ikifafanua kuwa ni usemi wa kujitenga. Wakati wa sasa wa kisimulizi wa Kigiriki umewekwa katika mfuatano wa kawaida wa Kiswahili kwa ‘akasema’.
