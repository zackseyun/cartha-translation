  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: sw
  text: Na daima, usiku na mchana[a], alikuwa akipiga kelele makaburini na milimani, huku akijikatakata kwa mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiku na mchana wote; alikuwa akiendelea kupiga kelele na kujikata kwa mawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Daima, usiku na mchana
  rationale: Kirai hiki huonyesha tendo lililoendelea katika muda wote. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi msisitizo wa kuendelea bila kukoma.
- source_word: μνήμασιν
  choice: makaburi
  rationale: Neno hili hurejelea mahali pa kuzikia au kaburi. ‘Makaburi’ linaeleweka kwa urahisi na linafaa kwa mazingira ya simulizi.
- source_word: ὄρεσιν
  choice: milimani
  rationale: ὄρος kwa kawaida humaanisha mlima; ‘milimani’ inatoa maana ya moja kwa moja ya mahali bila kuibadili kuwa vilima.
- source_word: ἦν κράζων
  choice: alikuwa akipiga kelele
  rationale: Muundo wa kitenzi unaonyesha tendo lililokuwa likiendelea wakati uliopita. ‘Alikuwa akipiga kelele’ huhifadhi hali hiyo katika Kiswahili cha kawaida.
- source_word: κατακόπτων ἑαυτὸν
  choice: akijikatakata
  rationale: κατακόπτω huonyesha kujipiga au kujikata kwa ukali na kurudia. ‘Akijikatakata’ ni wazi, huonyesha tendo endelevu, na ina nguvu inayofaa bila kuongeza maelezo yasiyokuwapo.
- source_word: λίθοις
  choice: kwa mawe
  rationale: Hapa hali ya dative inaonyesha kifaa kilichotumiwa. ‘Kwa mawe’ ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘huku akijikatakata’ unaunganisha vitendo viwili vinavyoendelea bila kufuta uzito wa kujidhuru.
