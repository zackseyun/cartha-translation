  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: sw
  text: Yesu alikuwa akimuuliza, “Jina lako ni nani?” Yule mtu anamjibu, “Jina langu ni Legioni,[a] kwa sababu sisi ni wengi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legioni” ni istilahi ya kijeshi ya Kilatini iliyoingia katika Kigiriki, ikirejelea kikosi kikubwa cha Roma; hapa inatumika kama jina ambalo pepo huyo alijitambulisha nalo na inadokeza wingi wao.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: alikuwa akimuuliza
  rationale: Muundo huu unaonyesha hali endelevu au ya kurudiwa ya wakati uliopita uliomo katika kitenzi cha Kigiriki cha hali isiyotimilika, bila kuufanya usemi kuwa mzito.
- source_word: Τί ὄνομά σοι
  choice: Jina lako ni nani?
  rationale: Hii ni njia ya kawaida na ya moja kwa moja ya kuuliza jina kwa Kiswahili, inayowasilisha maana ya nahau ya Kigiriki bila kufuata muundo wake neno kwa neno.
- source_word: λέγει αὐτῷ
  choice: anamwambia
  rationale: Wakati wa sasa wa kihistoria umehifadhiwa ili kudumisha uhai wa masimulizi ya Marko.
- source_word: Λεγιών
  choice: Legioni
  rationale: Neno limewasilishwa kama jina au cheo kilichotoholewa, si kutafsiriwa kuwa nomino ya kawaida; umbo “Legioni” linaeleweka kwa Kiswahili na linaendeleza uhusiano wake na istilahi ya kijeshi.
- source_word: ὄνομά μοι
  choice: Jina langu ni
  rationale: Ni Kiswahili cha kawaida kinachowasilisha moja kwa moja kauli ya kujitambulisha.
- source_word: ὅτι πολλοί ἐσμεν
  choice: kwa sababu sisi ni wengi
  rationale: “Kwa sababu” huonyesha sababu ya jina hilo, na “sisi ni wengi” huhifadhi nafsi ya kwanza wingi iliyo muhimu katika maandishi.
theological_decisions:
- issue: Mabadiliko kutoka umoja kwenda wingi katika kujitaja kwa msemaji
  choice: Kuhifadhi “Jina langu ni Legioni” katika umoja na “sisi ni wengi” katika wingi.
  alternative: Kulainisha kuwa “Jina letu ni Legioni” ili kuondoa mvutano.
  rationale: Maandishi ya Kigiriki yana mabadiliko ya makusudi kutoka kujitambulisha kwa umoja kwenda maelezo ya wingi. Tafsiri inahifadhi mvutano huo bila kuupatanisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wakati wa sasa wa kihistoria katika “anamwambia” umehifadhiwa, huku “alikuwa akimuuliza” ikionyesha hali endelevu ya kitenzi cha kwanza. Kiashiria cha tanbihi [a] kimewekwa katika maandishi.
