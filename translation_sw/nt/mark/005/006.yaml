  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: sw
  text: Naye alipomwona Yesu kwa mbali, alikimbia na kumsujudia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwabudu” au “kumpa heshima kuu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuabudu au kusujudu mbele ya mtu kwa heshima, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipomwona
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; kishazi cha wakati ni cha asili katika Kiswahili na huhifadhi mtiririko wa simulizi.
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Hueleza umbali wa mahali kwa Kiswahili cha kawaida na cha wazi.
- source_word: ἔδραμεν
  choice: alikimbia
  rationale: Hutoa maana ya moja kwa moja ya kukimbia bila kuongeza dhana ya haraka kupita ilivyo katika kitenzi cha Kigiriki.
- source_word: προσεκύνησεν αὐτόν
  choice: kumsujudia
  rationale: Kusujudia huonyesha tendo la kuinama au kujitupa chini mbele ya mtu, huku likiacha wazi iwapo tendo hilo lilikuwa ibada kamili au heshima ya hali ya juu; uwezekano huo unaelezwa katika tanbihi.
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa mtindo wa asili wa Kiswahili na kuhifadhi uratibu rahisi wa Marko.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa moja kwa moja kama yambwa wa kitenzi.
theological_decisions:
- issue: Iwapo προσεκύνησεν itafsiriwe wazi kuwa tendo la kumwabudu Yesu
  choice: kumsujudia
  alternative: kumwabudu; kumpa heshima kuu
  rationale: Kitenzi cha Kigiriki kinaweza kumaanisha kuabudu au kusujudu kwa heshima. Tafsiri kuu inahifadhi tendo linaloonekana bila kuamua kimya-kimya uzito wake kamili wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alipomwona” ni ya asili kuliko kirai kishirikishi cha moja kwa moja; “kumsujudia” huhifadhi ufupi wa mstari na utata halisi wa προσκυνέω.
