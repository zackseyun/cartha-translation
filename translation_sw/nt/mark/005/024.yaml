translation:
  language: sw
  text: Akaenda pamoja naye. Umati mkubwa ulikuwa ukimfuata na kumsonga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumsukuma” au “kumfinya.” Kitenzi cha Kigiriki kinaonyesha umati ukijazana na kumshinikiza Yesu kwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Kitenzi hiki cha wakati uliopita kinasimulia hatua iliyofuata katika tukio. “Akaenda” ni ya kawaida na inaonyesha mwendelezo wa simulizi bila kuongeza wazo la kuondoka kabisa.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: μετά pamoja na hali ya umilikishi huonyesha kuandamana; “pamoja naye” ni tafsiri ya asili na iliyo wazi.
- source_word: ἠκολούθει
  choice: ulikuwa ukimfuata
  rationale: Hali ya kitenzi isiyotimilika huonyesha tendo lililokuwa likiendelea; muundo huu unadumisha maana hiyo.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: ὄχλος humaanisha umati, na πολύς hapa huonyesha ukubwa au wingi wake.
- source_word: συνέθλιβον
  choice: kumsonga
  rationale: Kitenzi hiki huonyesha watu wakibana au kushinikiza kwa kukaribiana sana. “Kumsonga” kinawasilisha shinikizo la kimwili la umati bila kudai kwamba Yesu alijeruhiwa.
- source_word: αὐτόν
  choice: -m- katika “kumsonga”
  rationale: Kiwakilishi hiki kinamrejelea Yesu kama anayesongwa na umati; katika Kiswahili huwakilishwa kwa kiambishi cha yambwa ndani ya kitenzi.
