  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: sw
  text: Naye akawaruhusu. Pepo wachafu wakatoka, wakaingia ndani ya nguruwe. Kundi hilo—wapata elfu mbili—likateremka kwa kasi kwenye mteremko mkali[a] na kuingia baharini[b], nao wakafa maji baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “genge” au “ukingo mwinuko”; neno la Kigiriki linaweza kumaanisha mteremko mkali au genge.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “bahari.” Hii inarejelea Bahari ya Galilaya.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: akawaruhusu
  rationale: Kitenzi ‘kuruhusu’ ni cha kawaida na sahihi kwa ἐπιτρέπω, nacho kiwakilishi cha watendewa kinarejelea pepo wachafu katika muktadha.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: pepo wachafu
  rationale: Hili ni neno la kawaida la Kiswahili la Agano Jipya kwa viumbe wa kiroho wanaotajwa hapa; linadumisha lugha ya kibinafsi na dhana ya uchafu bila kuigeuza kuwa nguvu zisizo na nafsi.
- source_word: ἐξελθόντα
  choice: wakatoka
  rationale: Huonyesha kwamba pepo walitoka kwa mtu aliyetajwa katika muktadha, bila kuongeza maelezo yasiyosemwa katika aya.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: kuwaingia wale nguruwe
  rationale: ‘Kuwaingia’ ni usemi wa asili unaoonyesha wazi kuingia ndani ya nguruwe; ‘wale’ hurejelea kundi lililotajwa katika simulizi.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: kundi hilo ... likakimbia kwa kasi
  rationale: Huwasilisha mwendo wa ghafula na wenye nguvu wa kundi zima huku ikihifadhi umoja wa nomino ya mkusanyiko.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: kuteremka kwenye mteremko mkali
  rationale: κρημνός inaweza kuwa mtelemko mkali, ukingo, au genge; tafsiri hii haidai kwamba ulikuwa mwamba ulionyooka kabisa.
- source_word: εἰς τὴν θάλασσαν
  choice: kuingia baharini
  rationale: Inahifadhi neno la Kigiriki θάλασσα, ‘bahari,’ ingawa kihistoria linarejelea Bahari ya Galilaya, ambayo ni ziwa.
- source_word: ὡς δισχίλιοι
  choice: wapata elfu mbili
  rationale: ‘Wapata’ huonyesha ukadiriaji uliomo katika ὡς pamoja na idadi.
- source_word: ἐπνίγοντο
  choice: wakazama baharini
  rationale: Tafsiri hii ni ya asili katika simulizi la Kiswahili na huonyesha kuangamia kwao majini bila kuingiza mtendaji wa nje.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi katika ‘akawaruhusu’
  choice: Kiwakilishi ‘-wa-’ kinarejelea pepo wachafu.
  alternative: Kukitaja wazi kama ‘akawaruhusu pepo hao.’
  rationale: Muktadha wa karibu unakitambulisha wazi kirejelewa; kuhifadhi kiwakilishi kunafuata ufupi wa Kigiriki bila kuongeza maelezo.
- issue: Asili ya ‘pepo wachafu’
  choice: Kudumisha lugha ya viumbe wa kiroho wenye utendaji binafsi.
  alternative: ‘nguvu chafu’ au ‘nguvu za uovu’
  rationale: πνεύματα na vitenzi vya wingi vinawasilisha wahusika wenye kutenda katika simulizi; tafsiri haipaswi kuwafanya kuwa nguvu zisizo na nafsi wala kuongeza mafundisho ya kipepo yasiyomo katika aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa simulizi umewekwa wazi kwa vitenzi vinavyofuatana, huku marudio ya ‘baharini’ yakihifadhiwa kwa sababu yapo katika Kigiriki. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
