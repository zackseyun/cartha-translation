translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa sentensi unahifadhi mfuatano wa matukio na neno “bahari” la chanzo bila kufanya sentensi kuwa ngumu.
