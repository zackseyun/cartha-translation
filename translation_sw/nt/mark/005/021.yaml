  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: sw
  text: Baada ya Yesu kuvuka tena kwa mashua kwenda ng’ambo nyingine, umati mkubwa ukakusanyika kumzunguka, naye alikuwa kando ya bahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Bahari ya Galilaya, ziwa ambalo kwa kawaida huitwa “bahari” katika Injili.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Baada ya Yesu kuvuka
  rationale: Kirai hiki kinaonyesha kwamba kuvuka kulitangulia kukusanyika kwa umati; muundo wa “baada ya” unaweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ πλοίῳ
  choice: kwa mashua
  rationale: Hii ni tafsiri ya kawaida na ya asili katika Kiswahili kwa chombo na njia iliyotumiwa kuvuka; “mashua” inafaa mazingira ya ziwa kuliko “meli.”
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linahifadhi wazo la tendo lililorudiwa.
- source_word: εἰς τὸ πέραν
  choice: kwenda ng’ambo
  rationale: Katika simulizi la kuvuka ziwa, kirai hiki humaanisha kuelekea upande mwingine wa maji.
- source_word: συνήχθη
  choice: ukakusanyika
  rationale: Ingawa kitenzi cha Kigiriki kina umbo la kutendwa, Kiswahili cha kawaida hueleza umati wenyewe ukikusanyika.
- source_word: ὄχλος πολὺς
  choice: umati mkubwa
  rationale: Hii inaeleza kwa uwazi na kwa lugha ya sasa idadi kubwa ya watu.
- source_word: ἐπ’ αὐτόν
  choice: kumzunguka
  rationale: Katika muktadha huu, kirai kinaonyesha watu wakimkusanyikia Yesu na kuwa karibu naye pande zote.
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya bahari
  rationale: Hii huhifadhi maana ya mahali karibu na ufuo kwa Kiswahili cha asili.
- source_word: θάλασσαν
  choice: bahari
  rationale: Tafsiri inahifadhi neno la chanzo, ambalo huita eneo hili la maji “bahari,” huku tanbihi ikifafanua kwamba kijiografia ni ziwa.
