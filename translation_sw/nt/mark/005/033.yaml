  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mfuatano wa Kigiriki: hali ya mwanamke ya hofu na kutetemeka, ufahamu wake wa yaliyomtokea, kuja kwake, kuanguka mbele ya Yesu, na kumweleza ukweli wote. “Yaliyompata” ni tafsiri ya asili na ya kutosha kwa ὃ γέγονεν αὐτῇ, bila kuongeza ufafanuzi wa kiteolojia kuhusu uponyaji.'
