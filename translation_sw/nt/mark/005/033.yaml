id: MRK.5.33
reference: Mark 5:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: sw
  text: Lakini yule mwanamke, akiwa ameogopa na kutetemeka[a], akijua yaliyompata, akaja, akaanguka mbele yake[b], akamwambia ukweli wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa na hofu na kutetemeka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaanguka miguuni pake” au “akajitupa chini mbele yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo au hatua mpya katika simulizi; “Lakini” linafaa kwa mwitikio wa mwanamke baada ya swali la Yesu.
- source_word: ἡ γυνὴ
  choice: yule mwanamke
  rationale: Muktadha unamrejelea mwanamke aliyetajwa tayari; “yule” humtambulisha kwa njia ya kawaida katika Kiswahili.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: akiwa ameogopa na kutetemeka
  rationale: Tafsiri hii inadumisha hali mbili zinazoelezwa na vivumishi-tendo vya Kigiriki na kutoa Kiswahili cha kawaida chenye uzito wa simulizi.
- source_word: εἰδυῖα
  choice: akijua
  rationale: Muundo wa hali unaacha uhusiano wake na tendo kuu ukiwa wazi, bila kulazimisha maana ya sababu ingawa inaweza kudokezwa.
- source_word: ὃ γέγονεν αὐτῇ
  choice: yaliyompata
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza jambo lililotokea kwake, yaani uponyaji alioupata, bila kuongeza maelezo yasiyo katika sentensi.
- source_word: ἦλθεν
  choice: akaja
  rationale: Huhifadhi tendo rahisi la kuja katika mfululizo wa simulizi.
- source_word: προσέπεσεν αὐτῷ
  choice: akaanguka mbele yake
  rationale: Hueleza tendo la kuanguka mbele ya Yesu bila kuamua kama lilikuwa hasa kuabudu, kusujudu, au kuomba kwa unyenyekevu.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: akamwambia ukweli wote
  rationale: Ni Kiswahili cha kawaida kinachohifadhi msisitizo kwamba hakuficha sehemu yoyote ya maelezo ya kweli.
theological_decisions:
- issue: Mkao wa mwanamke mbele ya Yesu katika προσέπεσεν αὐτῷ
  choice: akaanguka mbele yake
  alternative: akaanguka miguuni pake; akajitupa chini mbele yake
  rationale: Kitenzi kinaweza kueleza kuanguka mbele ya mtu kwa heshima, hofu, au kusihi. Tafsiri haiongezi dai maalumu kwamba tendo hilo lilikuwa ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi wenye “aka-” unaleta mtiririko wa kawaida wa simulizi. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja; nafasi hizo zinarekebisha kutolingana kwa alama katika safu ya ushauri ya Kiingereza.
