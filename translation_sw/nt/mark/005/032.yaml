translation:
  language: sw
  text: Naye akaendelea kutazama huku na huku ili amwone mwanamke aliyefanya jambo hilo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, maneno yaliyotafsiriwa “mwanamke aliyefanya” yako katika umbo la jinsia ya kike, ingawa neno “mwanamke” halijaandikwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumweka Yesu kama mtendaji bila kuongeza maana ya sababu au hitimisho.
- source_word: περιεβλέπετο
  choice: akaendelea kutazama huku na huku
  rationale: Wakati usiotimilifu unaonyesha tendo lililoendelea; usemi huu pia unaonyesha kuangaza macho pande zote.
- source_word: ἰδεῖν
  choice: ili amwone
  rationale: Infinitivu inaeleza kusudi la kutazama; ‘ili amwone’ ni Kiswahili cha kawaida na huhifadhi maana ya moja kwa moja.
- source_word: τὴν ... ποιήσασαν
  choice: mwanamke aliyefanya
  rationale: Kifungu cha Kigiriki hakina nomino iliyoandikwa wazi, lakini elementi zake ni za jinsia ya kike na zinamtaja mtu wa kike. Kiswahili hakionyeshi jinsia hiyo katika ‘aliyefanya,’ hivyo ‘mwanamke’ huifanya taarifa ya chanzo iwe wazi.
- source_word: τοῦτο
  choice: jambo hilo
  rationale: Kiwakilishi hiki kinarejelea tendo lililotajwa katika muktadha uliotangulia; ‘jambo hilo’ ni wazi na la kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akaendelea kutazama huku na huku’ huwasilisha tendo endelevu kwa lugha ya kawaida; ‘mwanamke’ huwekwa wazi kwa sababu Kiswahili hakiwezi kuonyesha jinsia ya kike kupitia ‘aliyefanya’ pekee.
