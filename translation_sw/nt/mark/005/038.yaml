  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: sw
  text: Nao wanafika kwenye nyumba ya mkuu wa sinagogi, naye anaona msukosuko[a], na watu wakilia na kuomboleza kwa sauti kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makelele.” Neno la Kigiriki linaweza kumaanisha hali ya makelele, msukosuko, au vurugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wanafika
  rationale: Wakati uliopo wa kisimulizi umehifadhiwa ili kuendeleza uhai wa simulizi; “wanafika” pia huonyesha wazi kuwasili kwao katika nyumba hiyo.
- source_word: οἶκον
  choice: nyumba
  rationale: “Nyumba” ni sawia ya moja kwa moja na ya kawaida kwa οἶκος katika muktadha huu.
- source_word: ἀρχισυναγώγου
  choice: mkuu wa sinagogi
  rationale: Hili ni jina la cheo cha kiongozi au msimamizi mkuu wa sinagogi; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: θεωρεῖ
  choice: anaona
  rationale: Kitenzi cha umoja kinamrejelea Yesu katika muktadha. “Anaona” ni cha moja kwa moja bila kuongeza wazo la uchunguzi wa makusudi.
- source_word: θόρυβον
  choice: ghasia
  rationale: Neno hili humaanisha hali yenye kelele na msukosuko, si sauti pekee. “Ghasia” linabeba vipengele hivyo viwili katika tukio la maombolezo.
- source_word: κλαίοντας
  choice: watu wakilia
  rationale: Kirai cha kushiriki kinarejelea watu waliokuwa wakilia; kutaja “watu” hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: ἀλαλάζοντας
  choice: kuomboleza kwa sauti kubwa
  rationale: Katika muktadha wa kifo, kitenzi hiki huonyesha vilio vikubwa vya maombolezo. Tafsiri hii inaeleza tendo hilo kwa Kiswahili cha kawaida.
- source_word: πολλά
  choice: kwa sauti kubwa
  rationale: Hapa neno hili linatumika kielezi kuimarisha ἀλαλάζοντας; usemi huu huwasilisha nguvu ya vilio kwa Kiswahili cha asili.
