  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: sw
  text: Akaja mmoja wa wakuu wa sinagogi[a], jina lake Yairo; na alipomwona, akaanguka miguuni pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «viongozi wa sinagogi».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: akaja
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, muundo wa Kiswahili wa kusimulia kwa «aka-» unaonyesha tukio lililofuata kwa njia ya asili na yenye uhai.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: mmoja wa viongozi wa sinagogi
  rationale: Muundo huu unaonyesha kuwa Yairo alikuwa mmoja kati ya watu waliokuwa na wajibu wa uongozi na usimamizi wa sinagogi; «viongozi» ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: ὀνόματι Ἰάϊρος
  choice: jina lake Yairo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaomtambulisha mtu kwa jina bila kufanya jina lionekane kama wazo lililoongezwa baadaye.
- source_word: Ἰάϊρος
  choice: Yairo
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: ἰδὼν αὐτὸν
  choice: Alipomwona Yesu
  rationale: Kitenzi tegemezi cha wakati kinaonyesha wazi kwamba kumwona kulitangulia kuanguka; jina «Yesu» linaweka wazi rejeleo ambalo muktadha wa Kigiriki hulionyesha kwa kiwakilishi.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: akaanguka miguuni pake
  rationale: Usemi huu wa asili unaonyesha Yairo akianguka mbele ya Yesu karibu na miguu yake, huku muundo wa «aka-» ukiendeleza simulizi kwa uhai.
theological_decisions:
- issue: Maana ya kuanguka miguuni pa Yesu
  choice: akaanguka miguuni pake
  alternative: akamwabudu; akapiga magoti mbele yake
  rationale: Kigiriki kinaeleza tendo la kimwili linaloweza kuonyesha heshima, kusihi, au hali ya kukata tamaa, lakini hakitumii hapa neno linalosema wazi kuwa alimwabudu. Tafsiri haiongezi hitimisho hilo la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. «Ndipo akaja … akaanguka» huhifadhi mwendo hai wa simulizi la Marko bila kulazimisha wakati wa sasa wa Kigiriki katika muundo usio wa kawaida wa Kiswahili.
