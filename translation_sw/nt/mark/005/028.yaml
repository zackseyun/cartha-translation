base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: sw
  text: Kwa maana alikuwa akisema, “Nikigusa hata mavazi yake tu, nitaponywa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “nitaokolewa.” Kitenzi hiki kinaweza kumaanisha “kuokolewa,” “kuponywa,” au “kufanywa mzima”; hapa muktadha unaelekeza kwenye uponyaji wa mwili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Wakati usiotimilifu unaonyesha tendo lililoendelea au lililorudiwa katika wakati uliopita; tafsiri hii haiamui kimabavu kama alisema kwa sauti au moyoni.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya tendo lililotangulia na kinafaa katika usimulizi wenye hadhi.
- source_word: ὅτι
  choice: alama za usemi wa moja kwa moja
  rationale: Neno hili linatanguliza yaliyomo katika kauli yake; usemi wa moja kwa moja ni wa asili katika Kiswahili hapa.
- source_word: ἐὰν ἅψωμαι
  choice: Nikigusa
  rationale: Muundo wa ki- huwasilisha kwa kawaida sharti linalohusu tendo analotarajia kulifanya.
- source_word: κἂν
  choice: hata ... tu
  rationale: 'Muundo huu unahifadhi msisitizo wa kupunguza kiwango: hata ikiwa atagusa mavazi yake tu.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: mavazi yake
  rationale: ἱμάτια ni wingi na humaanisha mavazi kwa upana; ‘mavazi’ ni sahihi, ya sasa, na yenye hadhi bila kubainisha vazi fulani.
- source_word: σωθήσομαι
  choice: nitaponywa
  rationale: Katika muktadha wa ugonjwa wa mwanamke, maana ya moja kwa moja ni kurejeshwa afya. Uwezekano mpana wa maana ya ‘kuokolewa’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya σωθήσομαι katika simulizi la uponyaji
  choice: nitaponywa
  alternative: nitaokolewa; nitakuwa mzima
  rationale: Muktadha wa karibu unahusu uponyaji wa mwili, lakini kitenzi cha Kigiriki kinaweza pia kumaanisha kuokolewa. Tanbihi inadumisha mwingiliano huo wa maana bila kuingiza hitimisho la kimadhehebu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alikuwa akisema’ huhifadhi hali endelevu ya kitenzi, na ‘hata ... tu’ hutoa kwa kawaida msisitizo wa κἂν.
