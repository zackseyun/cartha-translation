  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: sw
  text: Naye akamsihi tena na tena asiwapeleke nje ya eneo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alimsihi sana asiwapeleke nje ya sehemu hiyo.”
    reason: Njia nyingine halali ya kutafsiri πολλὰ na χώρα, kwa kusisitiza nguvu ya kusihi badala ya kurudiwa kwake, na kutumia ‘sehemu’ badala ya ‘eneo.’
lexical_decisions:
- source_word: παρεκάλει
  choice: akamsihi
  rationale: Katika muktadha huu wa kutoa pepo, kitenzi hiki kinaonyesha ombi la dhati na la haraka. ‘Akamsihi’ ni Kiswahili cha kawaida, chenye heshima, na chenye uzito unaofaa.
- source_word: πολλὰ
  choice: tena na tena
  rationale: Hapa neno hili limetumiwa kielezi ili kuonyesha kusihi kulikorudiwa. ‘Tena na tena’ huwasilisha maana hiyo kwa Kiswahili cha asili bila ukakasi wa tafsiri ya neno kwa neno.
- source_word: ἵνα μὴ
  choice: asiwapeleke
  rationale: Muundo huu unaonyesha jambo lililoombwa kwa njia hasi. Kiswahili hulieleza kwa kawaida kwa kitenzi cha utegemezi chenye ukanushi, ‘asiwapeleke.’
- source_word: αὐτὰ
  choice: -wa- (wao)
  rationale: Kiwakilishi cha Kigiriki ni wingi na kinawarejelea pepo wachafu. Kiambishi cha yambwa cha wingi ‘-wa-’ kinahifadhi rejeo hilo la viumbe wenye nafsi.
- source_word: ἀποστείλῃ
  choice: peleke
  rationale: ‘Peleka’ huwasilisha maana ya kutuma au kuondoa kwenda mahali pengine bila kuongeza wazo la kuwalazimisha ambalo halimo wazi katika kitenzi chenyewe.
- source_word: ἔξω τῆς χώρας
  choice: nje ya eneo hilo
  rationale: χώρα hapa ni eneo au wilaya ya mahali, si lazima nchi ya kisasa. ‘Eneo hilo’ ni wazi na la kawaida kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Kubadilika kati ya msemaji mmoja na pepo wengi
  choice: Kuhifadhi mtendaji wa umoja katika ‘akamsihi’ na yambwa wa wingi katika ‘asiwapeleke.’
  alternative: Kulainisha sentensi kwa kuwafanya wote kuwa wingi au kumtaja ‘Jeshi’ kama kundi moja.
  rationale: 'Kigiriki chenyewe kina mvutano wa kisarufi: msemaji mmoja anasihi kwa niaba ya pepo wengi. Tafsiri haipaswi kuondoa mvutano huo kimyakimya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Naye’ hudumisha mwendelezo wa simulizi, na ‘tena na tena’ ni usemi wa asili unaoonyesha kurudiwa kwa ombi.
