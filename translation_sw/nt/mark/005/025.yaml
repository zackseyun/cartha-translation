lexical_decisions:
- source_word: καὶ
  choice: Kulikuwa na
  rationale: Katika muktadha huu kiunganishi kinaendeleza simulizi na kumtambulisha mshiriki mpya; muundo huu ni wa asili katika Kiswahili bila kulazimisha ‘na’ mwanzoni.
- source_word: γυνὴ
  choice: mwanamke
  rationale: Nomino isiyo na kibainishi humtambulisha mshiriki mpya; ‘mwanamke’ hutoa maana hiyo kwa kawaida katika Kiswahili.
- source_word: οὖσα
  choice: aliyekuwa
  rationale: Huwakilisha hali iliyoendelea kwa muda, ambayo inaelezwa zaidi na kirai cha muda ‘kwa miaka kumi na miwili.’
- source_word: ἐν ῥύσει αἵματος
  choice: akitokwa na damu
  rationale: Kirai hiki kinaonyesha hali ya kuendelea kutiririka au kutoka kwa damu; ‘akitokwa na damu’ ni wazi, cha kawaida, na hakiongezi utambuzi wa kitabibu usiotajwa wazi katika Kigiriki.
- source_word: ῥύσει
  choice: akitokwa
  rationale: Neno ῥύσις linamaanisha mtiririko au utokaji; kitenzi cha Kiswahili kinaeleza hali hiyo kwa lugha ya kawaida.
- source_word: αἵματος
  choice: damu
  rationale: Ni tafsiri ya moja kwa moja ya nomino inayobainisha kinachotoka.
- source_word: δώδεκα ἔτη
  choice: kwa miaka kumi na miwili
  rationale: Hii ni accusative ya kipindi cha muda; ‘kwa miaka kumi na miwili’ huonyesha muda huo kwa kawaida katika Kiswahili.
