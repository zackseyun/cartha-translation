  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: sw
  text: Kulikuwa na mwanamke aliyekuwa akitokwa na damu kwa miaka kumi na miwili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa na mtiririko wa damu” au “aliyekuwa akivuja damu.”
