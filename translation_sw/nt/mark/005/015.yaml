  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: sw
  text: Nao wakamjia Yesu, wakamwona yule mtu aliyekuwa amepagawa na pepo ameketi, amevaa nguo na ana akili timamu—yule aliyekuwa na Legioni[a]—nao wakaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lile jeshi.” Neno hili linaweza kueleweka kama jina ambalo pepo walikuwa wamejitambulisha nalo hapo awali.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: wakamjia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati wa masimulizi wa Kiswahili ili simulizi lisikike la kawaida, huku wazo la kumkaribia Yesu likihifadhiwa.
- source_word: θεωροῦσιν
  choice: wakamwona
  rationale: Kitenzi hiki kinaonyesha kumwona kwa makini katika tukio; “wakamwona” ni cha kawaida na kinaendeleza mfululizo wa simulizi bila kuongeza maelezo yasiyokuwamo.
- source_word: δαιμονιζόμενον
  choice: yule mtu aliyekuwa amepagawa na pepo
  rationale: Kirai hiki kinamtambulisha mtu anayejulikana katika muktadha na kuhifadhi dai la simulizi kwamba aliteswa kwa kupagawa na pepo, bila kutumia lugha ya kizamani.
- source_word: καθήμενον
  choice: ameketi
  rationale: Inaeleza hali yake iliyoonekana wakati walipomwona na inatofautisha utulivu wake wa sasa na hali yake ya awali.
- source_word: ἱματισμένον
  choice: amevaa nguo
  rationale: Ni Kiswahili cha kawaida na wazi kinachoonyesha hali yake iliyorejeshwa, kinyume na hali yake ya awali.
- source_word: σωφρονοῦντα
  choice: ana akili timamu
  rationale: Usemi huu unaonyesha kuwa fikira na kujitawala kwake vilikuwa vimerejea, bila kuufanya mstari kuwa maelezo ya kitabibu.
- source_word: ἐσχηκότα
  choice: aliyekuwa na
  rationale: Kauli hii ya asili inamtambulisha kwa hali yake iliyotangulia yenye umuhimu kwa tukio la sasa. “Aliyekuwa na” ni ya kawaida na inaonyesha kwamba hali hiyo haikuwa ikiendelea.
- source_word: λεγιῶνα
  choice: lile jeshi
  rationale: Neno hilo linarejelea kundi kubwa la pepo lililojitambulisha awali. “Lile jeshi” huhifadhi maana ya kawaida ya neno, huku uwezekano wa kulichukulia kama jina ukihifadhiwa katika tanbihi.
- source_word: ἐφοβήθησαν
  choice: wakaogopa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwitikio wao, bila kuongeza kiwango cha hofu ambacho hakijaelezwa.
theological_decisions:
- issue: Maelezo ya kupagawa na pepo
  choice: aliyekuwa amepagawa na pepo
  alternative: aliyekuwa na pepo
  rationale: Tafsiri inahifadhi uhalisia wa mateso ya kipepo katika simulizi bila kuyapunguza kuwa ugonjwa tu, na wakati uliopita unaonyesha wazi kwamba hali hiyo ilikuwa imekwisha.
- issue: Iwapo λεγιών ni jina au maelezo
  choice: lile jeshi
  alternative: Legioni
  rationale: Neno la Kigiriki linaweza kueleweka kama maelezo ya kundi kubwa au kama jina linalorejelea kujitambulisha kwa pepo hapo awali. Maandishi makuu hayatulizi utata huo kabisa; tanbihi inahifadhi uwezekano wa jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya “waka-” unafaa kwa usimulizi wa kawaida. Muundo wa kati unaweka hali tatu zinazoonekana—ameketi, amevaa nguo, na ana akili timamu—kwa uwazi, huku dashi zikihifadhi tamko la Kigiriki linalomtambulisha tena kuwa ndiye aliyekuwa na lile jeshi.
