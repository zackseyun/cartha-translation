base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: sw
  text: Naye akaondoka, akaanza kutangaza katika Dekapoli mambo yote ambayo Yesu alimfanyia[a], na wote wakastaajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi Yesu alivyomfanyia mengi.”
    reason: ὅσα linaweza kumaanisha “mambo yote aliyofanya” au kusisitiza kiasi/wingi wa yale Yesu aliyomfanyia.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha kuondoka kwake mahali pale; “akaondoka” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: ἤρξατο κηρύσσειν
  choice: akaanza kutangaza
  rationale: Muundo huu unaonyesha mwanzo wa tendo. “Kutangaza” linafaa kwa ushuhuda wake wa hadharani bila kudokeza lazima mahubiri rasmi.
- source_word: ἐν τῇ Δεκαπόλει
  choice: katika eneo la Dekapoli
  rationale: ἐν limetafsiriwa moja kwa moja kuwa “katika.” Neno “eneo” linaonyesha kwamba Dekapoli ni jina la kanda, si mji mmoja.
- source_word: ὅσα
  choice: mambo yote
  rationale: ὅσα hapa linaweza kueleza jumla ya yale yaliyotendwa au ukubwa/wingi wake. “Mambo yote” ni ya asili katika Kiswahili; maana nyingine inayowezekana imehifadhiwa katika tanbihi.
- source_word: ἐποίησεν αὐτῷ
  choice: Yesu aliyomtendea
  rationale: Kirai hiki kinaonyesha yale Yesu aliyomfanyia kwa manufaa yake. “Aliyomtendea” ni kifupi, cha asili, na huepuka maana ya kumtendea jambo baya.
- source_word: πάντες
  choice: watu wote
  rationale: Ingawa kihalisi ni “wote,” kuongeza nomino ya jumla “watu” kunafanya mhusika wa kitenzi awe wazi na wa kawaida katika Kiswahili bila kupanua kundi linalokusudiwa.
- source_word: ἐθαύμαζον
  choice: wakastaajabu
  rationale: “Kustaajabu” hutoa maana ya mshangao mkubwa. Umbo la simulizi “waka-” linaendelea kwa kawaida katika Kiswahili, ingawa hali endelevu ya imperfect ya Kigiriki haiwezi kuonyeshwa kikamilifu bila kufanya sentensi kuwa nzito.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa tangazo la mtu huyo na utambulisho wa Yesu
  choice: Aya inasema moja kwa moja kwamba mtu huyo alitangaza yale Yesu aliyomtendea, bila kuongeza hitimisho la kiteolojia.
  alternative: Kufafanua wazi kwamba matendo hayo yanathibitisha mamlaka au uungu wa Yesu.
  rationale: Simulizi linaonyesha uwezo wa ajabu wa Yesu na mshangao wa watu, lakini aya yenyewe haitoi hitimisho la kimafundisho; tafsiri inadumisha dai la simulizi bila kulipanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa “aka-/waka-” umetumiwa kudumisha mwendo wa simulizi. “Dekapoli” limehifadhiwa kama jina la kihistoria la eneo.
