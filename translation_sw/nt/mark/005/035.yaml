base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: sw
  text: Alipokuwa bado akisema, watu wakaja kutoka nyumbani kwa kiongozi wa sinagogi[a] wakisema, “Binti yako amekufa. Kwa nini uendelee kumsumbua Mwalimu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “kutoka kwa kiongozi wa sinagogi.”
    reason: Namna ya usemi wa Kigiriki ni fupi na inaweza kumaanisha kutoka nyumbani au kwa watu wa kiongozi huyo.
  - marker: b
    text: Au “kumtaabisha” au “kumhangaisha Mwalimu.”
    reason: σκύλλεις lina vivuli vya maana vya kumsumbua, kumtaabisha, au kumhangaisha mtu.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Alipokuwa bado akisema
  rationale: Muundo huu unaonyesha kwamba kitendo cha kuja kilitokea wakati yeye bado alikuwa akisema; ‘bado’ huhifadhi nguvu ya ἔτι kwa Kiswahili cha kawaida.
- source_word: ἔρχονται
  choice: watu wakaja
  rationale: Kitenzi kiko katika wakati wa sasa wa kihistoria, lakini wakati uliopita wa kisimulizi ni wa kawaida na wa asili katika Kiswahili. ‘Watu’ huonyesha kiima cha wingi kinachodokezwa na kitenzi cha Kigiriki.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: kutoka nyumbani kwa kiongozi wa sinagogi
  rationale: Kwa kuzingatia muktadha, waliokuja walitoka nyumbani au kwa watu wa kiongozi wa sinagogi, si kutoka mahali aliposimama kiongozi mwenyewe. Tanbihi inadumisha namna fupi ya usemi wa Kigiriki.
- source_word: λέγοντες ὅτι
  choice: wakisema
  rationale: Hutambulisha maneno ya moja kwa moja kwa njia ya asili katika simulizi la Kiswahili.
- source_word: Ἡ θυγάτηρ σου
  choice: Binti yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia na umilikaji.
- source_word: ἀπέθανεν
  choice: amekufa
  rationale: Wakati timilifu wa Kiswahili huwasilisha tukio lililokamilika ambalo matokeo yake yana umuhimu wa papo hapo.
- source_word: τί ἔτι
  choice: Kwa nini uendelee
  rationale: Huwasilisha swali kuhusu kuendelea kufanya jambo baada ya hali kubadilika; ni Kiswahili cha asili kuliko kufuata mpangilio wa maneno wa Kigiriki.
- source_word: σκύλλεις
  choice: kumsumbua
  rationale: Katika muktadha huu neno humaanisha kumtaabisha au kumhangaisha mtu kwa kuendelea kumhitaji, si kumnyanyasa.
- source_word: τὸν διδάσκαλον
  choice: Mwalimu
  rationale: Huhifadhi maana ya cheo διδάσκαλος bila kukibadili kuwa jina la Yesu au kuingiza maana pana ya mamlaka.
theological_decisions:
- issue: Rejeo la ‘Mwalimu’
  choice: Mwalimu
  alternative: Yesu; Bwana
  rationale: Kigiriki kinatumia cheo kinachomaanisha mwalimu badala ya jina ‘Yesu.’ Kutunza cheo hicho huhifadhi mtazamo wa wasemaji bila kuongeza dai la kikristo lisilotamkwa hapa.
- issue: Mahali walikotoka wajumbe
  choice: nyumbani kwa kiongozi wa sinagogi
  alternative: kwa kiongozi wa sinagogi
  rationale: Muktadha unaonyesha kuwa kiongozi mwenyewe alikuwa pamoja na Yesu; hivyo usemi mfupi wa Kigiriki unaeleweka kuwa unarejelea nyumba au watu wake. Tanbihi huhifadhi usemi halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa simulizi la kawaida; ‘sinagogi’ na cheo ‘Mwalimu’ vinadumisha mazingira na mtazamo wa wahusika.
