translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mfuatano wa matendo katika Kigiriki kwa njia ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa baada ya ‘vazi lake,’ ambako hoja yake ya kimsamiati inahusika moja kwa moja.
