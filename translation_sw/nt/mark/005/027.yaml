  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: sw
  text: Baada ya kusikia habari za Yesu, alikuja kutoka nyuma yake katika umati wa watu, akagusa vazi lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joho lake” au “nguo yake.” Neno la Kigiriki ἱμάτιον humaanisha vazi kwa upana, na mara nyingi vazi la nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Baada ya kusikia
  rationale: Kirai hiki kinaonyesha tendo lililotangulia tendo kuu na kwa Kiswahili cha kawaida kinahifadhi vizuri mfuatano wa kisimulizi wa kitenzi-shirikishi cha wakati uliopita.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: habari za Yesu
  rationale: περί pamoja na umilikishi humaanisha ‘kuhusu’; ‘kusikia habari za Yesu’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: ἐλθοῦσα
  choice: alikuja
  rationale: Huwasilisha mwendo wa mwanamke kuelekea alikokuwa Yesu kwa lugha ya kawaida bila kuongeza namna ya kuja isiyotajwa.
- source_word: ἐν τῷ ὄχλῳ
  choice: katikati ya umati wa watu
  rationale: Hueleza kwamba alisogea akiwa ndani ya kundi lililomzunguka Yesu; ‘umati wa watu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: ὄπισθεν
  choice: nyuma yake
  rationale: Huhifadhi mahali alipotokea mwanamke, huku kiwakilishi ‘yake’ kikimtaja Yesu kwa uwazi kutokana na muktadha.
- source_word: ἥψατο
  choice: akaligusa
  rationale: Katika muktadha huu ἅπτομαι humaanisha kugusa; muundo wa ‘aka-’ unaunganisha kwa kawaida hatua hii na tendo lililotangulia katika simulizi.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: vazi lake
  rationale: ἱμάτιον ni vazi, mara nyingi vazi la nje. ‘Vazi’ huhifadhi upana wa maana na umoja wa neno la Kigiriki bila kulibana kuwa aina moja maalumu ya nguo.
