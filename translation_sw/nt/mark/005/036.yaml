  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: sw
  text: Lakini Yesu, aliposikia yaliyokuwa yakisemwa[a], anamwambia mkuu wa sinagogi, “Usiogope; amini tu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyapuuza hayo yaliyosemwa.” Neno la Kigiriki linaweza kumaanisha kusikia yaliyosemwa au kukataa kuyatilia maanani.
    reason: alternative_reading
  - marker: b
    text: Au “endelea kuamini tu,” “uwe na imani tu,” au “tumaini tu.” Kitenzi cha Kigiriki ni πιστεύω (pisteuō).
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: aliposikia
  rationale: Kitenzi hiki kinaweza kumaanisha kusikia jambo linalosemwa au kutolisikiliza/kulipuuza. Katika muktadha huu, Yesu anaitikia moja kwa moja taarifa iliyotolewa, hivyo “aliposikia” linafuata mtiririko wa simulizi; maana nyingine imehifadhiwa katika tanbihi.
- source_word: τὸν λόγον λαλούμενον
  choice: maneno yaliyokuwa yakisemwa
  rationale: Hii ni tafsiri ya asili na inayoeleweka ya kirai cha Kigiriki, huku ikihifadhi wazo la taarifa iliyokuwa ikitamkwa wakati huo.
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati wa sasa umetumiwa katika Kigiriki kama wakati wa sasa wa kihistoria. “Anamwambia” huhifadhi uhai wa mtindo wa simulizi wa Marko.
- source_word: ἀρχισυναγώγῳ
  choice: mkuu wa sinagogi
  rationale: Cheo hiki humaanisha kiongozi au msimamizi mkuu wa sinagogi. “Mkuu wa sinagogi” ni kifupi, wazi, na cha kawaida katika Kiswahili cha Biblia.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni amri ya moja kwa moja na ya kawaida katika Kiswahili, yenye maana ya kuacha hofu au kutotawaliwa nayo.
- source_word: μόνον
  choice: tu
  rationale: Katika mpangilio wa Kiswahili, “tu” baada ya kitenzi huonyesha kwa kawaida na kwa uwazi upekee wa mwitikio unaotakiwa.
- source_word: πίστευε
  choice: amini
  rationale: “Amini” ni kisawe cha moja kwa moja cha kitenzi πιστεύω hapa. Maana zinazokaribiana za kuwa na imani au kumtumaini zimeonyeshwa katika tanbihi bila kuifungia tafsiri katika maana moja pekee.
theological_decisions:
- issue: Maana ya παρακούσας
  choice: Yesu alisikia taarifa iliyokuwa ikisemwa
  alternative: Yesu alipuuza au hakuitilia maanani taarifa iliyosemwa
  rationale: Maana zote mbili zinawezekana kileksia. Mwitikio wa Yesu kwa taarifa hiyo unaunga mkono “aliposikia,” lakini uwezekano wa “alipuuza” umehifadhiwa katika tanbihi kwa sababu unaathiri namna ya kuelewa simulizi.
- issue: Maana ya πιστεύω katika amri ya Yesu
  choice: amini
  alternative: endelea kuamini; uwe na imani; tumaini
  rationale: “Amini” ni tafsiri ya moja kwa moja na ya kawaida, huku umbo la wakati wa sasa la Kigiriki likiweza pia kudokeza kuendelea kuamini. Tanbihi huhifadhi vivuli halali vya maana bila kuongeza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Wakati wa sasa wa kihistoria umehifadhiwa katika “anamwambia” ili kudumisha uhai wa simulizi la Marko.
