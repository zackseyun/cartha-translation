lexical_decisions:
- source_word: ἔλεγον
  choice: wakawa wakimwambia
  rationale: Kauli ya wakati usiotimilika inaonyesha usemi uliokuwa ukiendelea au ukirudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha simulizi.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na linalofaa kwa μαθηταί wa Yesu, likihifadhi maana ya watu wanaojifunza kwake na kumfuata.
- source_word: Βλέπεις
  choice: Unauona
  rationale: Kauli ya sasa ya moja kwa moja inarejelea jambo lililo wazi mbele yao; “Unauona” ni ya asili katika muktadha huu.
- source_word: ὄχλον
  choice: umati
  rationale: “Umati” ni neno la kawaida la Kiswahili kwa kundi kubwa la watu katika mazingira haya.
- source_word: συνθλίβοντά
  choice: ukikusonga
  rationale: Kitenzi kinaonyesha watu wakimbania Yesu kimwili kutoka pande zinazomzunguka; “kukusonga” huwasilisha shinikizo hilo bila kuzidisha kuwa wanamponda.
- source_word: λέγεις
  choice: unasema
  rationale: Wakati wa sasa umehifadhiwa kwa kauli ya moja kwa moja na ya mshangao.
- source_word: Τίς μου ἥψατο
  choice: Ni nani aliyenigusa?
  rationale: ἅπτομαι hapa humaanisha kugusa, na wakati timilifu wa Kigiriki unauliza kuhusu tendo maalumu lililotokea muda mfupi uliopita.
- source_word: μου
  choice: -ni- katika “aliyenigusa”
  rationale: Ingawa Kigiriki hutumia umilikishi pamoja na ἅπτομαι, Kiswahili huiwasilisha kwa kawaida kama yambwa ndani ya kitenzi.
