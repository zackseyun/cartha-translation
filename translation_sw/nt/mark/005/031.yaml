  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: sw
  text: Wanafunzi wake wakamwambia, “Unauona umati ukikusonga[a], nawe unasema, ‘Ni nani aliyenigusa?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukikubana.” Neno la Kigiriki linaonyesha umati ukimfinya Yesu kimwili kutoka pande zinazomzunguka.
