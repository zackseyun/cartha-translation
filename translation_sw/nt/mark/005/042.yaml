  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: sw
  text: Mara moja msichana akasimama na kuanza kutembea[a], kwa maana alikuwa na umri wa miaka kumi na miwili. Mara moja wakashikwa na mshangao mkubwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akainuka.” Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “akasimama” au “akainuka.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, “wakashangaa kwa mshangao mkubwa.” Kigiriki kinatumia maneno yenye mzizi mmoja kusisitiza ukubwa wa mshangao.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: mara
  rationale: Neno hili linadumisha kasi na uharaka wa simulizi la Marko kwa Kiswahili cha kawaida; limetokea katika vifungu vyote viwili kulingana na ushahidi wa maandishi uliotolewa.
- source_word: ἀνέστη
  choice: akasimama
  rationale: Katika muktadha huu kitenzi kinaonyesha msichana kuinuka kimwili baada ya kuamriwa; ‘akasimama’ ni cha kawaida na hakiingizi istilahi ya ufufuo kwa nguvu kuliko Kigiriki.
- source_word: κοράσιον
  choice: yule msichana
  rationale: Hutaja msichana; kwa kuwa umri wake unaelezwa wazi katika sentensi inayofuata, hakuna haja ya kuongeza ‘mdogo’.
- source_word: περιεπάτει
  choice: na kuanza kutembea
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililoanza na kuendelea kuonekana; usemi huu ni wa asili katika Kiswahili.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: kwa maana alikuwa na umri wa miaka kumi na miwili
  rationale: ‘Kwa maana’ inadumisha maelezo yanayoletwa na γάρ, na muundo wa umri ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐξέστησαν
  choice: wakashikwa
  rationale: Pamoja na ‘mshangao mkubwa,’ kitenzi hiki kinaonyesha kwamba mshangao uliwatawala sana bila kurudia mzizi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: ἐκστάσει μεγάλῃ
  choice: na mshangao mkubwa
  rationale: Huwasilisha hali kali ya kustaajabu kwa Kiswahili cha kawaida, bila kutumia neno linaloweza kueleweka vibaya kama hali ya ekstasi.
theological_decisions:
- issue: Dokezo linalowezekana la ufufuo katika ἀνέστη
  choice: Kuitafsiri kama kuinuka kimwili, ‘akasimama,’ ndani ya simulizi la muujiza.
  alternative: akainuka
  rationale: Muktadha unaonyesha wazi kurudishwa kwenye uhai, lakini kitenzi chenyewe kinaweza kumaanisha kusimama au kuinuka. Tafsiri haiongezi dai la kiteolojia kuliko maandishi.
- issue: Usemi wa mzizi mmoja ἐξέστησαν ἐκστάσει μεγάλῃ
  choice: wakashikwa na mshangao mkubwa
  alternative: wakastaajabu kwa mshangao mkubwa
  rationale: Chaguo kuu linawasilisha nguvu ya usemi bila marudio yasiyo ya kawaida, huku tanbihi ikihifadhi muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni mwepesi na wa moja kwa moja, na alama zote za tanbihi zimewekwa katika matini kuu.
