  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: sw
  text: Mara Yesu akatambua ndani yake kwamba nguvu zimemtoka; akageuka katikati ya umati na kuuliza, “Ni nani aliyegusa mavazi yangu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara hiyo
  rationale: Inaendeleza kasi ya simulizi ya Marko kwa Kiswahili cha sasa bila kutumia usemi mzito au wa kizamani.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: akatambua ndani yake
  rationale: Inahifadhi wazo la Yesu kufahamu jambo hilo kwa ndani, si kwa kulitazama kwa nje.
- source_word: δύναμιν
  choice: nguvu
  rationale: Ni tafsiri ya moja kwa moja na pana; haitangulizi ufafanuzi wa ziada kama ‘nguvu za kuponya,’ ingawa muktadha unahusu uponyaji.
- source_word: ἐξ αὐτοῦ ... ἐξελθοῦσαν
  choice: zilikuwa zimemtoka
  rationale: Muundo huu unaonyesha kuwa kutoka kwa nguvu kulitangulia kutambua kwa Yesu na unaweka wazi kwamba zilitoka kwake.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: Akageuka katikati ya umati
  rationale: Inatoa tendo la kimwili na mahali alikokuwa Yesu kwa lugha ya kawaida na yenye picha wazi.
- source_word: ἔλεγεν
  choice: na kuuliza
  rationale: Ingawa kitenzi kimsingi ni ‘alisema,’ maneno yanayofuata ni swali; ‘kuuliza’ ni ya asili katika Kiswahili na haiingizi maana mpya.
- source_word: Τίς μου ἥψατο τῶν ἱματίων;
  choice: Ni nani aliyegusa mavazi yangu?
  rationale: ‘Kugusa’ ndiyo maana inayofaa katika muktadha, na ‘mavazi’ huhifadhi wingi na upana wa ἱμάτια bila kuibana kuwa joho moja.
theological_decisions:
- issue: Yesu kutambua kwamba nguvu zilikuwa zimemtoka
  choice: Kauli ya simulizi imehifadhiwa moja kwa moja bila kuieleza kama sitiari wala kufafanua utaratibu wa muujiza.
  alternative: ‘Alitambua kwamba nguvu za kuponya zilikuwa zimemtoka.’
  rationale: Neno la asili linasema ‘nguvu’ tu. Muktadha unaonyesha uponyaji, lakini tafsiri haipaswi kuongeza ufafanuzi wa kimafundisho au wa kiutendaji usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimepangwa kwa mtiririko wa kawaida wa simulizi huku zikihifadhi uharaka, ufahamu wa ndani wa Yesu, na kauli isiyofafanuliwa zaidi kuhusu nguvu kutoka kwake.
