  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: sw
  text: Mara moja, kutokwa damu kwake kukakoma,[a] naye akatambua mwilini mwake kwamba amepona taabu hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “chanzo cha damu yake kikakauka.” Kigiriki kinatumia taswira dhahiri ya chemchemi au chanzo.
    reason: lexical_alternative
  - marker: b
    text: Au “pigo hilo,” “mjeledi huo,” au “mateso hayo makali.” Neno la Kigiriki linaweza kumaanisha mjeledi, pigo, au mateso makali; hapa linarejelea hali yake yenye maumivu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara
  rationale: Neno hili linaonyesha kwamba jambo hilo lilitokea papo hapo na linadumisha kasi ya masimulizi ya Marko kwa Kiswahili cha kawaida.
- source_word: ἐξηράνθη
  choice: ikaacha kutoka
  rationale: Kitenzi hicho kihalisi ni ‘ikakauka,’ lakini hapa kinaeleza kukoma kwa damu kutoka. Tafsiri hii ni wazi na ya kawaida, huku taswira ya Kigiriki ikihifadhiwa katika tanbihi.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: damu yake
  rationale: πηγή humaanisha chemchemi au chanzo; katika muktadha huu ni chanzo cha kutokwa damu. Kiswahili cha matini kuu kinaeleza tukio hilo kwa kawaida bila kulazimisha taswira isiyo ya kawaida, nayo taswira asilia imeonyeshwa katika tanbihi.
- source_word: ἔγνω τῷ σώματι
  choice: akatambua mwilini mwake
  rationale: ‘Akatambua’ huhifadhi maana ya kujua au kutambua, si hisia tu, na ‘mwilini mwake’ huhifadhi utambuzi wa kimwili unaoelezwa na Kigiriki.
- source_word: ἴαται
  choice: amepona
  rationale: Wakati timilifu wa Kigiriki unaonyesha uponyaji uliokamilika wenye matokeo yanayoendelea. ‘Amepona’ huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἀπὸ τῆς μάστιγος
  choice: ugonjwa huo wenye mateso
  rationale: μάστιξ kihalisi ni mjeledi, lakini kwa njia ya sitiari humaanisha taabu kali au maradhi yenye mateso. Hapa inarejelea hali yake ya kutokwa damu, si kupigwa kwa mjeledi.
theological_decisions:
- issue: Asili ya kauli kuhusu uponyaji
  choice: Aya inaeleza kwamba damu ilikoma kutoka kweli na kwamba mwanamke alitambua uponyaji huo mwilini mwake.
  alternative: Kutafsiri tukio hilo kuwa hisia yake binafsi tu bila kuthibitisha uponyaji halisi.
  rationale: Kigiriki kinaunganisha tukio la kimwili—chanzo cha damu kukauka—na utambuzi wa mwanamke kwamba amepona. Tafsiri haiongezi maelezo kuhusu jinsi uponyaji ulivyotokea wala mafundisho yasiyotajwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku tanbihi zikihifadhi taswira hai na upana wa maana ya maneno ya Kigiriki.
