  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: sw
  text: kwa sababu mara nyingi alikuwa amefungwa kwa pingu za miguu na minyororo, naye alikuwa ameivunja minyororo na kuzivunja pingu za miguu vipande-vipande, wala hakuna mtu aliyekuwa na nguvu za kumdhibiti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumfuga.” Kitenzi cha Kigiriki kinaweza kumaanisha kufuga, au kwa maana pana zaidi, kutiisha au kumweka chini ya udhibiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: kwa sababu ... alikuwa
  rationale: Muundo wa διά pamoja na kitenzi-jina chenye kibainishi unaonyesha sababu ya kauli iliyotangulia; ‘kwa sababu’ huwasilisha uhusiano huo wazi na kwa Kiswahili cha kawaida.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Ni usemi wa kawaida na sahihi kwa tendo lililorudiwa mara nyingi.
- source_word: πέδαις / τὰς πέδας
  choice: pingu za miguu
  rationale: πέδη ni kifungo hasa cha miguu. Ufafanuzi ‘za miguu’ unatofautisha pingu hizi na minyororo ya kawaida bila kutumia neno la kizamani.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: minyororo
  rationale: ἅλυσις humaanisha mnyororo; neno hili linadumisha tofauti kati yake na πέδαι, pingu za miguu.
- source_word: δεδέσθαι
  choice: alikuwa amefungwa
  rationale: Huwasilisha hali iliyotokana na matendo ya kumfunga yaliyotangulia na kurudiwa.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις
  choice: aliikata minyororo
  rationale: διασπάω huonyesha kuvuta au kukata kitu kwa nguvu mpaka kitengane. Kiswahili ‘aliikata’ hapa huwasilisha kuvunjwa kwa minyororo kwa nguvu kwa njia ya asili.
- source_word: τὰς πέδας συντετρῖφθαι
  choice: kuzivunjavunja pingu za miguu
  rationale: συντρίβω ina nguvu ya kuvunja kabisa au kuwa vipande; ‘kuvunja-vunja’ huonyesha ukamilifu na nguvu ya tendo.
- source_word: οὐδεὶς ἴσχυεν αὐτὸν
  choice: hakuna mtu aliyekuwa na nguvu za kumdhibiti
  rationale: ἰσχύω hukazia nguvu au uwezo. ‘Alikuwa na nguvu za’ huhifadhi msisitizo huo kuliko kusema tu ‘aliweza’.
- source_word: δαμάσαι
  choice: kumdhibiti
  rationale: δαμάζω inaweza kumaanisha kufuga au kutiisha na kuleta chini ya udhibiti. Katika habari ya mtu mwenye nguvu zisizo za kawaida, ‘kumdhibiti’ ni ya kawaida na haileti taswira ya kumfuga mnyama.
theological_decisions:
- issue: Asili ya hali na nguvu za mtu huyo
  choice: Aya inaeleza tu kushindwa kwa watu kumfunga na kumdhibiti, bila kutaja moja kwa moja chanzo cha nguvu zake.
  alternative: Kutumia lugha inayosisitiza wazi nguvu za kipepo au kusema kwamba hakuna mtu aliyeweza ‘kumfuga.’
  rationale: Kigiriki cha aya hii kinaeleza juhudi za kumfunga zilizoshindikana na nguvu zake zisizo za kawaida, lakini hakitoi ufafanuzi wa ziada wa kitheolojia ndani ya sentensi yenyewe. Tafsiri inaacha muktadha mpana wa simulizi utoe maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. ‘Pingu za miguu’ hufafanua aina ya kifungo na kudumisha tofauti na ‘minyororo.’ Alama ya tanbihi imewekwa baada ya neno linalohusika mwishoni mwa aya.
