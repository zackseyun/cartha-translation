  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: sw
  text: Nao wakawa wakimcheka[a]. Lakini yeye, baada ya kuwatoa wote nje, anawachukua baba na mama wa mtoto pamoja na wale waliokuwa pamoja naye[b], kisha anaingia mahali mtoto alipokuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa wakimdhihaki.” Kitenzi cha Kigiriki kinaweza kumaanisha kucheka kwa dharau.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanafunzi waliokuwa wakifuatana naye.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: wakawa wakimcheka
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea; usemi huu pia unaweza kueleza kicheko cha dhihaka bila kukifanya moja kwa moja kuwa ‘kumdhihaki.’
- source_word: ἐκβαλὼν πάντας
  choice: baada ya kuwatoa wote nje
  rationale: Kirai tegemezi kinaeleza tendo lililotangulia; ‘kuwatoa nje’ ni Kiswahili cha kawaida na hakileti bila sababu maana maalumu ya kutoa pepo.
- source_word: παραλαμβάνει
  choice: anawachukua
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kudumisha uhai wa usimulizi wa Marko; hapa maana ni kuwachukua waandamane naye.
- source_word: παιδίου / παιδίον
  choice: mtoto
  rationale: Neno la Kigiriki halitaji jinsia katika mstari huu, ingawa muktadha unamtambulisha kuwa binti; ‘mtoto’ huhifadhi namna ya usemi wa chanzo.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: wale waliokuwa pamoja naye
  rationale: Tafsiri hii ni wazi bila kuwataja moja kwa moja kuwa wanafunzi katika matini kuu.
- source_word: εἰσπορεύεται
  choice: anaingia
  rationale: Wakati uliopo wa kihistoria umehifadhiwa, na kitenzi hiki kinaeleza kuingia mahali mtoto alipokuwa.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: mahali mtoto alipokuwa
  rationale: Chanzo kinataja mahali tu; hakisemi wazi katika kirai hiki kwamba mtoto alikuwa amelala.
theological_decisions:
- issue: Wakati wa usimulizi na uhai wake
  choice: Kuhifadhi wakati uliopo wa kihistoria katika ‘anawachukua’ na ‘anaingia’
  alternative: 'Kutumia wakati uliopita kote: ‘aliwachukua’ na ‘akaingia’'
  rationale: Marko hutumia mara nyingi wakati uliopo wa kihistoria kuupa usimulizi uhai. Kiswahili kinaweza kuuhifadhi hapa kwa njia inayoeleweka, huku tendo tangulizi likibaki ‘baada ya kuwatoa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘baba na mama ya mtoto’ umechaguliwa ili kuonyesha kwamba wote wawili ni wazazi wa mtoto bila kurudia kirai; wakati uliopo wa kihistoria umehifadhiwa kwa uhai wa simulizi.
