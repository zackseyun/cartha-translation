  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: sw
  text: ambaye makao yake yalikuwa makaburini[a]. Hakuna mtu aliyeweza tena kumfunga, hata kwa mnyororo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “ndani ya makaburi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: makao yake yalikuwa
  rationale: Muundo huu unaendeleza wazo la kuwa na mahali pa kukaa, huku ukisomeka kwa Kiswahili cha kawaida na bila kudokeza starehe ya nyumbani.
- source_word: ἐν τοῖς μνήμασιν
  choice: makaburini
  rationale: Neno hili la mahali linaweza kumaanisha kwenye eneo la makaburi au ndani ya makaburi, hivyo linahifadhi kwa kiasi fulani upana wa usemi wa Kigiriki bila kulazimisha picha moja.
- source_word: οὐδὲ ἁλύσει
  choice: hata kwa mnyororo
  rationale: ‘Mnyororo’ ni umoja kama ἁλύσει, na ‘hata’ linaonyesha msisitizo wa οὐδέ.
- source_word: οὐκέτι
  choice: tena
  rationale: 'Katika sentensi hasi, ‘tena’ huonyesha kwa kawaida kwamba uwezo huo ulikuwa umekoma: hakuna mtu aliyeweza kufanya hivyo tena.'
- source_word: ἐδύνατο
  choice: aliyeweza
  rationale: Huwasilisha kutoweza katika wakati uliopita kwa Kiswahili cha asili.
- source_word: δῆσαι
  choice: kumfunga
  rationale: ‘Kumfunga’ huhifadhi maana ya kumtia kifungoni au kumzuia kwa kitu cha kufungia, inayofaa muktadha wa mnyororo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. ‘Makao yake yalikuwa’ inadumisha muundo wa chanzo bila kuwa mgumu kupita kiasi.
