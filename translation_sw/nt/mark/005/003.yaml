  source_fidelity: Tafsiri inawakilisha kwa uaminifu κατοίκησιν εἶχεν kama “makao yake yalikuwa,” ἐν τοῖς μνήμασιν kama “makaburini,” na msisitizo wa οὐκέτι pamoja na οὐδὲ ἁλύσει kama “tena ... hata kwa mnyororo.” Umoja wa “mnyororo” unalingana na ἁλύσει ya umoja. Alama ya tanbihi inawekwa kwenye “makaburini” na mbadala wake unahifadhi uwezekano wa maana ya mahali wa Kigiriki.
