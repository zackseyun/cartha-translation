base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: sw
  text: Alipotoka katika mashua, mara mwanamume mwenye roho chafu[a] akatoka makaburini akamwendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “aliyepagawa na roho chafu.” Kigiriki, kwa karibu zaidi: “katika roho chafu.”'
    reason: mbadala_wa_kileksia
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: aliposhuka kutoka kwenye mashua
  rationale: Kirai huru cha hali ya umilikaji chenye kitenzi-jina cha wakati uliopita kinatafsiriwa kwa kawaida kama kishazi cha wakati. Katika Kiswahili, ‘kushuka kutoka kwenye mashua’ ni usemi wa asili kwa kitendo cha kutoka chomboni.
- source_word: εὐθὺς
  choice: mara
  rationale: ‘Mara’ ni kiashiria kifupi na cha asili cha tukio la papo hapo, na kinadumisha kasi ya usimulizi wa Marko.
- source_word: ὑπήντησεν αὐτῷ
  choice: akaja kumlaki
  rationale: Kitenzi kinamaanisha kwenda au kuja kukutana na mtu. ‘Kumlaki’ kinaonyesha kwa uwazi mwendo wa mtu huyo kuelekea kwa Yesu.
- source_word: ἐκ τῶν μνημείων
  choice: akatoka makaburini
  rationale: μνημεῖον hapa ni kaburi au pango la kuzikia. ‘Makaburini’ ni usemi wa kawaida unaoweza kumaanisha eneo la makaburi, huku wingi wa Kigiriki ukihifadhiwa kimuktadha.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: ‘Mtu’ ni tafsiri ya moja kwa moja na ya asili; jinsia ya mhusika inadhihirika zaidi katika muktadha unaofuata bila kulazimika kutumia ‘mwanamume’ hapa.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: mwenye roho chafu
  rationale: Muundo huu wa Kiswahili unasomeka kwa kawaida na unabaki karibu na maana ya Kigiriki ya kuwa ‘na/katika roho chafu,’ bila kuongeza kwa uwazi istilahi tafsiri zaidi ya ‘aliyepagawa.’
theological_decisions:
- issue: Jinsi ya kutafsiri hali inayohusishwa na roho chafu
  choice: mwenye roho chafu
  alternative: aliyepagawa na roho chafu
  rationale: Giriki haisemi moja kwa moja ‘aliyepagawa.’ ‘Mwenye roho chafu’ huhifadhi usemi wa chanzo na kuepuka kufafanua zaidi namna ya uhusiano huo kuliko mstari wenyewe unavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo ni mwepesi kwa msomaji wa kawaida; ‘mashua,’ ‘mara,’ na ‘makaburini’ ni maneno yanayoeleweka kwa upana. Hakuna tanbihi inayohitajika kwa kuwa mbadala wa ‘aliyepagawa’ umeepukwa bila kupoteza maana ya msingi.
