  text: Huko karibu na mlima kulikuwa na kundi kubwa la nguruwe likila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: kulikuwa na
  rationale: Muundo huu unatoa maana ya kuwapo; δέ ni kiunganishi hafifu cha simulizi ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Kielezi hiki cha mahali kinarejelea eneo lililotajwa katika simulizi; “huko” ni Kiswahili cha kawaida na wazi.
- source_word: πρὸς τῷ ὄρει
  choice: karibu na mlima
  rationale: πρός pamoja na hali ya dative hapa huonyesha mahali pa ukaribu au kando ya mlima bila kubainisha umbali kamili.
- source_word: ἀγέλη χοίρων μεγάλη
  choice: kundi kubwa la nguruwe
  rationale: “Kundi” ni neno la kawaida kwa mkusanyiko wa wanyama, na mpangilio huu ni wa asili katika Kiswahili huku ukihifadhi ukubwa wa kundi.
- source_word: βοσκομένη
  choice: likila
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaonyesha kundi likijilisha wakati huo. “Likila” ni cha kawaida na hakibani maana kuwa kula majani tu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa kawaida, wazi, na wenye heshima. “Nguruwe” ni neno la sasa na la kawaida, hivyo hakuna haja ya tanbihi ya kisawe cha Kiingereza “swine.”
