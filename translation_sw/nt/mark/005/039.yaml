  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: sw
  text: Baada ya kuingia, anawaambia, “Kwa nini mnafanya makelele na kulia? Mtoto hajafa, bali amelala.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtoto hakufa, bali analala.” Huenda Yesu anatumia “kulala” kwa maana ya mfano kuhusu kifo kwa kuzingatia ufufuo unaofuata.
    reason: Mbadala wa kimuundo na ufafanuzi wa uwezekano wa matumizi ya lugha ya mfano.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Baada ya kuingia ndani
  rationale: Kirai hiki kinaonyesha tendo la kuingia lililotangulia kitenzi kikuu; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi uhusiano wa kishiriki.
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati wa sasa unahifadhi hali hai ya usimulizi wa kihistoria unaotumiwa mara nyingi na Marko.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika swali hili lenye kukemea, maana ya kimuktadha ni kuuliza sababu ya matendo yao.
- source_word: θορυβεῖσθε
  choice: mnafanya makelele
  rationale: Kitenzi kinaeleza vurugu au usumbufu wenye kelele; usemi huu ni wa asili na unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: κλαίετε
  choice: kulia
  rationale: Neno hili ni la kawaida na lenye hadhi, bila kuongeza wazo maalumu la maombolezo ya kimila.
- source_word: παιδίον
  choice: Mtoto
  rationale: Neno la Kigiriki linamaanisha mtoto kwa ujumla; ingawa muktadha unaonyesha ni msichana, tafsiri haiongezi ubainisho ambao haupo katika mstari huu.
- source_word: οὐκ ἀπέθανεν
  choice: hajafa
  rationale: Muundo huu wa Kiswahili unaonyesha kifo kama jambo ambalo halijatokea na lenye umuhimu katika hali ya sasa, bila kubadili kauli kuwa tu hali ya kutokuwa mfu.
- source_word: καθεύδει
  choice: amelala
  rationale: Tafsiri hii ni ya kawaida kwa mtu aliye usingizini na inadumisha lugha ya kulala bila kufafanua kimbele kama ni halisi au ya mfano.
theological_decisions:
- issue: Ikiwa kauli ya Yesu itafsiriwe kama kukana kifo halisi au kama kutumia usingizi kwa maana ya kifo
  choice: Kudumisha kauli, “Mtoto hajafa, bali amelala,” bila maelezo ya kufasiri ndani ya matini.
  alternative: Mtoto hajafa kabisa, bali ni kama amelala kwa sababu Yesu atamfufua.
  rationale: Kigiriki kinaweka kauli hii kwa ukali na kinaweza kutumia kulala kama lugha ya mfano kwa kifo kwa kuzingatia ufufuo unaofuata. Tafsiri inadumisha mvutano huo badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kufanya makelele” ni usemi wa kawaida kuliko “kufanya ghasia” katika tukio hili, na wakati wa sasa katika “anawaambia” unahifadhi uhai wa usimulizi wa Marko.
