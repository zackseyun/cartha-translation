  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: sw
  text: na alikuwa ameteseka sana kutokana na matibabu ya madaktari wengi[a], na alikuwa ametumia kila kitu alichokuwa nacho[b] bila kupata nafuu yoyote; badala yake, hali yake ilikuwa imezidi kuwa mbaya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ameteseka kwa sababu ya madaktari wengi,” au, “mikononi mwa madaktari wengi.” Kigiriki kinaweza kusisitiza madaktari kuwa chanzo cha mateso hayo au yeye kuvumilia matibabu yao.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “vitu vyote vilivyokuwa kwake,” yaani, kila kitu alichokuwa nacho.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: alikuwa ameteseka sana
  rationale: Kauli hii huonyesha mateso mengi yaliyotangulia katika mfululizo wa matukio; wakati timilifu wa Kiswahili unawasilisha vizuri hali hiyo ya awali.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: kutokana na matibabu ya madaktari wengi
  rationale: ὑπό pamoja na umilikishi huonyesha wahusika au chanzo. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba mateso yalihusiana na matibabu yao bila kudai kwa lazima kwamba madaktari walikusudia kumdhuru.
- source_word: δαπανήσασα
  choice: alikuwa ametumia
  rationale: Huhifadhi tendo lililotangulia na maana ya kutumia mali au fedha, bila kuongeza dhana isiyotajwa ya kufuja.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: kila kitu alichokuwa nacho
  rationale: Ni usemi wa kawaida unaowasilisha jumla ya mali au rasilimali zilizokuwa mikononi mwake.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: bila kupata nafuu yoyote
  rationale: Kitenzi cha kutendwa kinaonyesha kwamba hakupokea faida yoyote; katika muktadha wa ugonjwa, 'kupata nafuu' ni ya asili na sahihi.
- source_word: ἀλλὰ μᾶλλον
  choice: badala yake
  rationale: 'Huonyesha ugeukaji wenye msisitizo: si kwamba hakusaidika tu, bali matokeo yalikuwa kinyume chake.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: hali yake ilikuwa imezidi kuwa mbaya
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuingia katika hali mbaya zaidi huku ikihifadhi kuzorota kwa hali yake.
theological_decisions: []
