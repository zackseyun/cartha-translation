  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mfululizo umehifadhiwa kwa vitenzi vya wakati timilifu, na nusu-koloni inaonyesha kwa uwazi utofauti unaosisitizwa na ἀλλὰ μᾶλλον.
