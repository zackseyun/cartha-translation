  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: sw
  text: Naye akamsihi sana, akisema, “Binti yangu mdogo anakaribia kufa. Njoo uweke mikono yako juu yake, ili aokolewe[a] na aishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aponywe” au “afanywe mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kunusuru, au kuponya; hapa muktadha wa karibu ni uponyaji wa kimwili.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: akamsihi sana
  rationale: Katika muktadha huu, παρακαλεῖ ni ombi la dharura, na πολλὰ hulitia mkazo. “Akamsihi sana” ni Kiswahili cha kawaida kinachoonyesha uzito wa ombi bila kuamua kama lilirudiwa mara nyingi.
- source_word: θυγάτριόν μου
  choice: binti yangu mdogo
  rationale: Neno la udogo θυγάτριον linaweza kuonyesha umri mdogo na pia hisia ya upendo; tafsiri hii inadumisha yote mawili kwa lugha ya kawaida.
- source_word: ἐσχάτως ἔχει
  choice: anakaribia kufa
  rationale: Nahau hii inaonyesha kuwa mtoto yuko katika hali ya mwisho, karibu na kifo. “Anakaribia kufa” ni wazi, ya asili, na inadumisha dharura.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Njoo uweke mikono yako juu yake
  rationale: Ingawa ἐλθών ni umbo la kitenzi tegemezi, katika ombi hili lina nguvu ya agizo la heshima. Tafsiri inahifadhi wingi wa “mikono” na tendo la kuiweka juu yake.
- source_word: σωθῇ
  choice: aokolewe
  rationale: σῴζω inaweza kumaanisha kuokoa, kuponya, au kufanya mtu awe mzima. “Aokolewe” inadumisha upana wa neno la Kigiriki, huku tanbihi ikibainisha maana ya uponyaji inayofaa sana katika muktadha.
- source_word: ζήσῃ
  choice: kuishi
  rationale: ζάω humaanisha “kuishi.” Hapa inaeleza matokeo yanayotarajiwa ya kuokolewa au kuponywa kwa mtoto.
theological_decisions:
- issue: Maana ya σωθῇ katika muktadha wa uponyaji
  choice: aokolewe
  alternative: aponywe; afanywe mzima
  rationale: Muktadha wa karibu unahusu uponyaji wa kimwili, lakini kitenzi cha Kigiriki kina maana pana ya kuokoa, kunusuru, au kuponya. Matini kuu inadumisha upana huo, na tanbihi inaonyesha maana mbadala inayowezekana sana hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamsihi sana” na “anakaribia kufa” ni misemo inayoeleweka kwa urahisi; “aokolewe” inadumisha utata halisi wa kitenzi cha chanzo, huku tanbihi ikisaidia msomaji.
