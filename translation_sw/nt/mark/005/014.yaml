  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: sw
  text: Nao wale waliokuwa wakiwachunga wakakimbia, wakatoa habari mjini na vijijini[a]; watu wakaja kuona yaliyotukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mashamba.” Neno la Kigiriki linaweza kutafsiriwa hivyo kwa ukaribu zaidi na maana yake ya msingi, lakini hapa yaelekea linamaanisha maeneo ya vijijini yanayozunguka mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: waliokuwa wakiyachunga
  rationale: Kitenzi hiki hapa kinawahusu wale waliokuwa wakitunza kundi la nguruwe; ‘kuyachunga’ ni Kiswahili cha kawaida kinachojumuisha kuwaongoza na kuwalisha.
- source_word: αὐτούς
  choice: -ya- (wakiyachunga)
  rationale: Kiwakilishi kinarejelea kundi la nguruwe lililotajwa katika mstari uliotangulia. Kiambishi cha ngeli katika kitenzi kinadumisha rejeleo hilo bila kurudia nomino.
- source_word: ἔφυγον
  choice: wakakimbia
  rationale: Huwasilisha kitendo cha ghafla cha kuondoka kwa hofu na nguvu ya usimulizi ya kauli ya Kigiriki.
- source_word: ἀπήγγειλαν
  choice: kutoa habari
  rationale: Kitenzi kina maana ya kupeleka au kusimulia taarifa; usemi huu ni wa kawaida na unaendana na muktadha.
- source_word: εἰς τὴν πόλιν
  choice: mjini
  rationale: Ingawa εἰς kwa msingi huonyesha mwendo kuelekea au kuingia, pamoja na kitenzi cha kutoa habari hapa Kiswahili hutaja kwa kawaida eneo ambako habari ilienezwa.
- source_word: εἰς τοὺς ἀγρούς
  choice: mashambani
  rationale: Katika utofautishaji na mji, ἀγροί yaelekea kumaanisha maeneo ya vijijini yanayozunguka mji; ‘mashambani’ ni ya asili huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: ἦλθον
  choice: watu wakaja
  rationale: Kigiriki kina kiima cha wingi kisichotajwa wazi. ‘Watu’ hufanya Kiswahili kiwe wazi na cha asili bila kuwabainisha kuwa kundi fulani zaidi ya maandishi yanavyosema.
- source_word: ἰδεῖν
  choice: kuona
  rationale: Ni infinitivu ya kusudi baada ya ‘wakaja’; ‘kuona’ ndiyo tafsiri ya kawaida.
- source_word: τί ἐστιν τὸ γεγονός
  choice: yaliyotukia
  rationale: Usemi huu unauliza kuhusu tukio lililokwisha kutokea; ‘yaliyotukia’ ni fasaha na huhifadhi maana hiyo katika usimulizi.
