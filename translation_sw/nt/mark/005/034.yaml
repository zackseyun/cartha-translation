  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: sw
  text: Lakini akamwambia, “Binti, imani yako imekuokoa[a]. Nenda kwa amani, na uwe mzima[b], huru kutokana na ugonjwa wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imekuponya” au “imekufanya mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kuponya, au kumweka mtu salama.
    reason: alternative_reading
  - marker: b
    text: Au, “upone” au “uwe na afya njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Binti
  rationale: Neno la kumwita mwanamke kwa upole na kwa dhana ya kifamilia limehifadhiwa bila kuongeza kimilikishi kisichopo katika Kigiriki.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu linamaanisha kumwamini Yesu; “imani” pia huhifadhi istilahi kuu ya Agano Jipya.
- source_word: σέσωκέν σε
  choice: imekuokoa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa au kuponya. “Imekuokoa” huhifadhi upana wake na hali ya ukamilifu ya tendo, bila kulifanya liwe uponyaji wa mwili pekee.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Nenda kwa amani
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kuagiza mtu aondoke akiwa katika hali ya amani.
- source_word: ἴσθι ὑγιὴς
  choice: uwe mzima
  rationale: Kauli hii inaeleza hali endelevu ya kuwa mwenye afya timamu, si tendo la kuponywa tu.
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: huru kutokana na ugonjwa wako
  rationale: μάστιξ, ambalo kihalisi ni pigo au mjeledi, limetumiwa hapa kwa hali iliyomtesa mwanamke. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kuwa amewekwa huru na ugonjwa huo.
theological_decisions:
- issue: Maana ya σῴζω katika uhusiano na uponyaji
  choice: imekuokoa
  alternative: imekuponya / imekufanya mzima
  rationale: “Imekuokoa” huhifadhi mvutano wa maana kati ya wokovu na uponyaji, hasa kwa kuwa kishazi kinachofuata kinataja hali yake ya afya kwa maneno tofauti.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini / kumwamini
  rationale: “Imani” inafaa kwa tendo la mwanamke la kumwamini Yesu na haibadili neno hilo kuwa uaminifu wa muda mrefu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Binti” huhifadhi upole wa salamu, na “huru kutokana na ugonjwa wako” hufanya sitiari ya μάστιξ ieleweke bila kutumia neno la kizamani au lisilo la kawaida.
