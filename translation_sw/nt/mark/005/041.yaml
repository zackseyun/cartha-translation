  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: sw
  text: Naye, akiushika mkono wa mtoto, anamwambia, “Talitha koum[a],” maana yake, “Msichana mdogo, nakuambia, inuka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri hutumia tahajia ya kimapokeo “Talitha cum.” Andiko la Kigiriki hapa lina κουμ (koum), ambalo linaunga mkono tahajia “koum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς
  choice: akiushika mkono
  rationale: Muundo huu unaonyesha kwamba Yesu alishika mkono wa mtoto kabla na wakati wa kusema. ‘Akiushika mkono’ ni Kiswahili cha kawaida na huhifadhi mguso halisi bila kutumia neno lenye nguvu kupita kiasi kama ‘kunyakua.’
- source_word: τοῦ παιδίου
  choice: wa mtoto
  rationale: παιδίον humaanisha mtoto; jinsia yake inawekwa wazi baadaye na κοράσιον. ‘Mtoto’ huepuka kurudia mapema ‘msichana mdogo.’
- source_word: λέγει αὐτῇ
  choice: anamwambia
  rationale: Kitenzi cha wakati uliopo katika simulizi kinahifadhi mtindo hai wa Marko. ‘Anamwambia’ ni cha asili katika Kiswahili na kinaonyesha wazi anayelengwa.
- source_word: Ταλιθα κουμ
  choice: Talitha koum
  rationale: Maneno ya Kiaramu yaliyohifadhiwa katika maandishi ya Kigiriki yamenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa pekee, kwa kuwa Marko mwenyewe anayafafanua mara moja.
- source_word: μεθερμηνευόμενον
  choice: maana yake
  rationale: Ingawa neno hilo hutaja kutafsiri au kufafanua, ‘maana yake’ ni usemi wazi na wa kawaida unaotanguliza tafsiri ya Marko bila kupoteza kazi yake ya ufafanuzi.
- source_word: Τὸ κοράσιον
  choice: Msichana mdogo
  rationale: κοράσιον humtaja msichana mchanga na inaweza kubeba wazo la udogo. ‘Msichana mdogo’ ni ya kawaida, yenye upole, na inaweka wazi jinsia.
- source_word: σοὶ λέγω
  choice: nakuambia
  rationale: Maneno haya ya wazi katika Kigiriki yamehifadhiwa badala ya kuachwa kuwa ya ziada. ‘Nakuambia’ ni Kiswahili cha moja kwa moja na cha asili.
- source_word: ἔγειρε
  choice: inuka
  rationale: Amri ya ἐγείρω hapa inamtaka mtoto ainuke. ‘Inuka’ ni fupi, wazi, na inafaa muktadha kuliko usemi wa kizamani au maelezo marefu.
theological_decisions:
- issue: Kuhifadhi maneno ya Yesu ya Kiaramu katika andiko kuu
  choice: Kuhifadhi ‘Talitha koum’ na kufuatisha tafsiri iliyotolewa na Marko.
  alternative: Kutumia tafsiri pekee, ‘Msichana mdogo, nakuambia, inuka,’ au tahajia ya kimapokeo ‘Talitha kumi.’
  rationale: Andiko lenyewe linahifadhi kauli ya Kiaramu na kisha kuitafsiri. Kuhifadhi sehemu zote mbili kunatunza umbo na uhai wa simulizi bila kuficha maana; ‘koum’ hufuata moja kwa moja tahajia κουμ ya toleo la Kigiriki lililotolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wakati uliopo ‘anamwambia’ umetumiwa kuhifadhi wakati uliopo wa kisimulizi wa Marko, huku kishazi ‘akiushika’ kikiunganisha vitendo kwa njia ya asili.
