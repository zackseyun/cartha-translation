  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: sw
  text: Alipokuwa akiingia katika mashua, yule mtu aliyekuwa amepagawa na pepo aliendelea kumsihi ili awe pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Alipokuwa akipanda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati ombi lilipotolewa, kama inavyodokezwa na kitenzi-jina cha wakati wa sasa katika muundo wa genitive absolute.
- source_word: πλοῖον
  choice: mashuani
  rationale: Katika mazingira ya Bahari ya Galilaya, “mashua” ni neno la kawaida na linalofaa zaidi kuliko neno linaloweza kumaanisha chombo kikubwa cha baharini.
- source_word: παρεκάλει
  choice: aliendelea kumsihi
  rationale: Wakati usiotimilifu unaonyesha ombi lililoendelea au kurudiwa; “aliendelea kumsihi” huhifadhi hali hiyo pamoja na uzito wa ombi.
- source_word: ὁ δαιμονισθείς
  choice: yule mtu aliyekuwa amepagawa na pepo
  rationale: Kitenzi-jina kilichotumiwa kama nomino humrejelea mtu aliyekuwa ameteswa na pepo kabla ya kuponywa. “Aliyekuwa amepagawa” huonyesha kwamba hali hiyo ilikuwa ya wakati uliopita katika hatua hii ya simulizi.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: ili awe pamoja naye
  rationale: Muundo huu huhifadhi kishazi cha ἵνα na maana ya kuwa pamoja naye binafsi, bila kuibadili moja kwa moja kuwa safari tu.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμονισθείς bila kuigeuza kuwa hali ya kitabibu au sitiari
  choice: aliyekuwa amepagawa na pepo
  alternative: aliyekuwa chini ya mamlaka ya pepo
  rationale: “Amepagawa na pepo” ni usemi unaoeleweka katika Kiswahili na unaonyesha mateso na utawala halisi wa pepo katika simulizi, bila kuingiza maelezo ya kitabibu au msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Aliendelea kumsihi” ni cha kawaida kwa wasomaji huku kikihifadhi hali endelevu ya kitenzi cha Kigiriki; “ili awe pamoja naye” huhifadhi maana ya uhusiano wa karibu na utata wa kama ombi hilo lilihusisha kuandamana naye.
