  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: sw
  text: Na kama Bwana asingezifupisha siku hizo, hakuna mtu[a] ambaye angeokolewa. Lakini kwa ajili ya wateule aliowachagua, alizifupisha siku hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hakuna mwili wowote”; yaani, hakuna mwanadamu au mtu yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: alizifupisha
  rationale: Kitenzi κολοβόω hapa humaanisha kufupisha au kupunguza muda. “Alizifupisha” ni Kiswahili cha kawaida na chenye nguvu, na kimetumiwa kwa namna ileile katika sehemu zote mbili.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi jina la heshima la κύριος kwa rejea maalumu inayofahamika katika muktadha.
- source_word: τὰς ἡμέρας
  choice: siku hizo
  rationale: Kiswahili hutumia “hizo” kwa kawaida kurejelea siku za dhiki zilizotajwa kabla; hakuna maelezo ya ziada yaliyoingizwa.
- source_word: οὐκ ἂν ἐσώθη
  choice: hakuna ... ambaye angeokolewa
  rationale: Muundo huu unaonyesha matokeo yasiyotokea katika hali ya kinyume na uhalisi. “Angeokolewa” huhifadhi maana ya σῴζω bila kuibana iwe kuendelea kuishi pekee.
- source_word: πᾶσα σάρξ
  choice: hakuna mwenye mwili
  rationale: Huhifadhi kwa kiasi kikubwa taswira halisi ya σάρξ huku ikitoa maana ya msemo kuwa hakuna mwanadamu. Tanbihi hufafanua maana hiyo kwa lugha nyepesi zaidi.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: kwa ajili ya wateule
  rationale: διά pamoja na hali ya accusative huonyesha sababu au tendo linalofanywa kwa manufaa yao; “kwa ajili ya” ni usemi wa kawaida wa Kiswahili.
- source_word: ἐκλεκτούς
  choice: wateule
  rationale: Ni istilahi ya kibiblia iliyozoeleka na sahihi, bila kufafanua zaidi aina au msingi wa uteule.
- source_word: οὓς ἐξελέξατο
  choice: aliowachagua
  rationale: Hutafsiri kishazi rejeshi kwa uwazi na huhifadhi uhusiano wa kitenzi ἐκλέγομαι na nomino “wateule” bila marudio yasiyo ya kawaida.
theological_decisions:
- issue: Maana ya kuokolewa katika muktadha
  choice: Kuhifadhi “angeokolewa,” huku muktadha wa karibu ukielekeza kwenye kuhifadhiwa kwa uhai wakati wa dhiki.
  alternative: “angeendelea kuishi” au “angenusurika,” ambayo yangebana maana iwe ya kimwili pekee.
  rationale: Muktadha unahusu maafa na kuangamia kwa wanadamu, lakini neno σῴζω lina upana unaostahili kuhifadhiwa badala ya kutafsiriwa kwa ufafanuzi mwembamba.
- issue: Wanaorejelewa na “wateule”
  choice: Kudumisha jina “wateule” bila kulifafanua kwa mfumo fulani wa kimadhehebu.
  alternative: Kulifafanua wazi kuwa uteule wa pamoja tu au uteule wa watu mmoja mmoja uliopangwa tangu awali.
  rationale: Aya inasema kwamba Mungu aliwachagua, lakini haisuluhishi hapa mijadala mipana kuhusu asili ya uteule.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa asili katika Kiswahili, huku urudiaji wa “alizifupisha siku hizo” ukihifadhi msisitizo wa Kigiriki.
