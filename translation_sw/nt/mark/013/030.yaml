  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: sw
  text: Kweli nawaambia, kizazi hiki hakika hakitapita mpaka mambo haya yote yatakapotokea.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu hawa” au “jamii hii”; neno la Kigiriki γενεά linaweza kuwa na maana pana zaidi, ingawa “kizazi” ndiyo tafsiri ya kawaida zaidi hapa.
    reason: lexical_alternative
  - marker: b
    text: Maneno “hakika hakitapita” yanatafsiri ukanushaji wa Kigiriki wenye mkazo mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Katika usemi wa Yesu, neno hili linatanguliza tamko zito lenye mamlaka; “Kweli” ni Kiswahili cha kawaida na chenye heshima.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Huwasilisha moja kwa moja kauli ya msemaji kwa wasikilizaji kwa Kiswahili cha kawaida bila kupoteza maana.
- source_word: οὐ μὴ παρέλθῃ
  choice: hakika hakitapita
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi una ukanushaji wenye mkazo; “hakika hakitapita” huonyesha uhakika huo wazi.
- source_word: ἡ γενεὰ αὕτη
  choice: kizazi hiki
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja katika muktadha huu, huku mvutano wa kiufafanuzi ukihifadhiwa badala ya kutatuliwa ndani ya tafsiri.
- source_word: μέχρις οὗ
  choice: mpaka
  rationale: Huonyesha kikomo cha wakati kwa njia fupi na ya asili katika Kiswahili.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Huonyesha wazi wingi wa ταῦτα na ujumla wa πάντα, ukirejelea matukio yaliyotajwa katika hotuba.
- source_word: γένηται
  choice: yatakapotokea
  rationale: Katika muktadha huu γίνομαι hurejelea matukio kutokea; umbo hili pia linaungana kiasili na “mpaka.”
theological_decisions:
- issue: Maana ya “kizazi hiki” (ἡ γενεὰ αὕτη) katika hotuba kuhusu mambo ya mwisho
  choice: Imetafsiriwa moja kwa moja kuwa “kizazi hiki” bila ufafanuzi wa ziada.
  alternative: “watu hawa” au “taifa/jamii hii”; au kizazi cha baadaye kitakachoona ishara zikianza
  rationale: Usemi wa Kigiriki kwa kawaida humaanisha “kizazi hiki.” Kwa kuwa tafsiri yake katika muktadha huu inajadiliwa sana, matini inadumisha lugha na mvutano wa chanzo bila kuiegemeza kwenye mfumo fulani wa eskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa karibu na chanzo lakini wa asili katika Kiswahili; alama zote za tanbihi zimewekwa katika matini kuu.
