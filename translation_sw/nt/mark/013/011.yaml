- from: Na watakapowapeleka ili kuwakabidhi kwa wenye mamlaka,[a] msihangaike mapema kuhusu mtakalosema. Badala yake, semeni chochote mtakachopewa saa ile, kwa maana si ninyi mnaosema, bali ni Roho Mtakatifu.
  to: Na watakapowapeleka na kuwakabidhi,[a] msihangaike mapema kuhusu mtakalosema; bali lolote mtakalopewa saa ile, lisemeni. Kwa maana si ninyi mnaosema, bali Roho Mtakatifu.
