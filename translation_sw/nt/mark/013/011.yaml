id: MRK.13.11
reference: Mark 13:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: sw
  text: Na watakapowapeleka na kuwakabidhi,[a] msihangaike mapema kuhusu mtakalosema; bali lolote mtakalopewa saa ile, lisemeni. Kwa maana si ninyi mnaosema, bali Roho Mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “watakapowapeleka, huku wakiwakabidhi.”
    reason: Kigiriki kina kitenzi kikuu cha “kupeleka” na kishirikishi cha “kukabidhi”; tafsiri kuu huviunganisha kwa mtiririko wa kawaida wa Kiswahili bila kuongeza anayepokea kukabidhiwa.
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Na watakapo-
  rationale: Huunganisha sentensi na muktadha uliotangulia na kuonyesha tukio la wakati ujao linalotarajiwa bila kulifanya kuwa tukio la mara moja tu.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: watakapowapeleka ili kuwakabidhi kwa wenye mamlaka
  rationale: ἄγωσιν inaeleza kupelekwa kwa kulazimishwa, huku παραδιδόντες ikieleza kukabidhiwa. Kirai 'kwa wenye mamlaka' kinaweka wazi maana inayodokezwa na muktadha wa kushtakiwa, bila kutumia 'kuwasaliti,' ambayo ni finyu mno hapa.
- source_word: μὴ προμεριμνᾶτε
  choice: msihangaike mapema
  rationale: Kitenzi kinaunganisha wasiwasi na wazo la kutangulia kwa wakati; Kiswahili hiki ni cha kawaida na huhifadhi vipengele vyote viwili.
- source_word: τί λαλήσητε
  choice: kuhusu mtakalosema
  rationale: Ingawa λαλέω kimsingi ni 'kunena/kusema,' 'mtakalosema' ni Kiswahili cha asili katika muktadha wa kuandaa utetezi wa maneno.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: chochote mtakachopewa
  rationale: Huhifadhi hali ya kutotajwa kwa mtoaji katika kauli tendwa na upana wa ὃ ἐὰν.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: saa ile
  rationale: Huhifadhi taswira na uzito wa usemi wa Kigiriki kuliko 'wakati huo,' huku ikibaki wazi katika Kiswahili cha Biblia.
- source_word: τοῦτο λαλεῖτε
  choice: semeni chochote mtakachopewa
  rationale: Amri imeunganishwa kwa mtiririko wa kawaida na kishazi kilichotangulia; maana ya kusema kile hasa kinachotolewa imehifadhiwa.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: kwa maana si ninyi mnaosema
  rationale: Huhifadhi mkazo wa ὑμεῖς na utofautishaji unaofuata kwa Kiswahili fasaha.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, lenye heshima, katika Kiswahili cha kisasa.
theological_decisions:
- issue: Utendaji wa Roho Mtakatifu na wa wanafunzi katika kusema wakati wa mateso
  choice: Wanafunzi wanaamriwa kusema kile wanachopewa, huku chanzo kikuu cha maneno hayo kikitajwa kuwa Roho Mtakatifu.
  alternative: Ama kuwafanya wanafunzi kuwa vyombo visivyo na ushiriki wowote, au kuifanya 'Roho Mtakatifu' kuwa ushawishi wa jumla tu.
  rationale: Muundo wa Kigiriki huhifadhi pamoja ushiriki halisi wa wanafunzi na utendaji wa Roho Mtakatifu; tafsiri haiondoi mvutano huo.
- issue: Mtoaji wa maneno katika kauli tendwa δοθῇ
  choice: 'Kutotaja mtoaji moja kwa moja: ''mtakachopewa.'''
  alternative: Kuongeza wazi 'mtakachopewa na Mungu/Roho Mtakatifu.'
  rationale: Ingawa muktadha unaelekeza kwenye utoaji wa kimungu, Kigiriki kinatumia kauli tendwa bila kumtaja mtoaji; tafsiri inalinda udokezi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Msihangaike mapema' ni cha kawaida kuliko 'msiwe na wasiwasi kabla,' na 'saa ile' huhifadhi ladha ya usemi wa chanzo bila kuwa ya kizamani.
