review_pass:
  verdict: revise
  source_fidelity: The draft adds both a purpose relationship ('ili,' “in order to”) and an explicit recipient ('kwa wenye mamlaka,' “to the authorities”) that are not stated in the Greek. παραδιδόντες is best represented without specifying either. The remaining clauses convey the Greek sense well, including the unstated agent in the passive 'mtakalopewa' and the contrast between the disciples and the Holy Spirit.
  naturalness: The wording is generally fluent Standard East African Swahili. 'Watakapowapeleka na kuwakabidhi' is natural and avoids the unnecessary purposive construction. 'Lolote mtakalopewa saa ile, lisemeni' is idiomatic while retaining the demonstrative force of τοῦτο.
  terminology: '''Roho Mtakatifu'' is the standard, appropriate rendering. ''Msihangaike mapema'' suitably conveys προμεριμνᾶτε in contemporary respectful Swahili.'
  issues:
  - severity: medium
    issue: The phrase 'ili kuwakabidhi kwa wenye mamlaka' adds information and a purpose relation absent from the source.
    rationale: The Greek has ἄγωσιν ... παραδιδόντες, with an attendant participle ('lead ... handing over'), but does not name authorities or state that the leading is for the purpose of handing them over. The surrounding context may imply authorities, but the translation should not make this implicit detail explicit.
  - severity: low
    issue: The main text's 'chochote mtakachopewa' is understandable, but the imperative's direct reference to what is given can be represented more distinctly.
    rationale: Using 'lolote mtakalopewa saa ile, lisemeni' maintains the open-ended passive provision and clearly renders the command τοῦτο λαλεῖτε.
  revised_text: Na watakapowapeleka na kuwakabidhi,[a] msihangaike mapema kuhusu mtakalosema; bali lolote mtakalopewa saa ile, lisemeni. Kwa maana si ninyi mnaosema, bali Roho Mtakatifu.
  revised_footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “watakapowapeleka, huku wakiwakabidhi.”
    reason: Kigiriki kina kitenzi kikuu cha “kupeleka” na kishirikishi cha “kukabidhi”; tafsiri kuu huviunganisha kwa mtiririko wa kawaida wa Kiswahili bila kuongeza anayepokea kukabidhiwa.
  revision_rationale: Marekebisho huondoa nyongeza ya 'ili' na 'kwa wenye mamlaka,' ambazo hazimo katika matini ya Kigiriki, na huhifadhi uhusiano wa kupelekwa na kukabidhiwa. Pia huweka wazi amri ya kusema kile kinachopewa, bila kumtaja mtoaji wa maneno.
