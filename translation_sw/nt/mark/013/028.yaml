  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: sw
  text: 'Jifunzeni mfano[a] kutoka kwa mtini: tawi lake likishakuwa laini tayari na likitoa majani, mnajua kwamba kiangazi kiko karibu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “somo” au “kielelezo.”
    reason: Njia mbadala za kutafsiri παραβολή katika muktadha huu.
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: kutoka kwa mtini
  rationale: ἀπό pamoja na umilikishi huonyesha chanzo cha somo. δέ ni kiunganishi chepesi, na hapa mtiririko wa sentensi ya Kiswahili hauhitaji neno la ziada kama “basi” au “sasa.”
- source_word: μάθετε
  choice: Jifunzeni
  rationale: Ni amri ya aoristi ya μανθάνω, ikiwataka wasikilizaji wapokee fundisho; “jifunzeni” ni ya moja kwa moja na ya kawaida.
- source_word: τὴν παραβολήν
  choice: mfano
  rationale: παραβολή hapa ni ulinganisho unaofundisha. “Mfano” ni neno la kawaida katika Kiswahili cha Biblia na linaeleweka kwa wasomaji wa sasa bila kulazimisha ufafanuzi wa kialegoria.
- source_word: ὅταν
  choice: linapokuwa
  rationale: ὅταν pamoja na hali tegemezi huleta hali ya jumla ya wakati; muundo wa “linapo-” unatoa maana ya “wakati ... linapokuwa.”
- source_word: ἤδη
  choice: tayari
  rationale: “Tayari” huhifadhi wazo kwamba hali hiyo imekwisha kuanza au kufikiwa.
- source_word: ὁ κλάδος αὐτῆς
  choice: tawi lake
  rationale: κλάδος ni tawi, na αὐτῆς hurejelea mtini.
- source_word: ἁπαλὸς γένηται
  choice: linapokuwa ... laini
  rationale: ἁπαλός hueleza ulaini wa chipukizi jipya. Kiswahili cha kawaida hutaja hali hiyo kwa “kuwa laini.”
- source_word: ἐκφύῃ τὰ φύλλα
  choice: kuchipua majani
  rationale: ἐκφύω ni kutoa au kuchipuza ukuaji mpya; “kuchipua majani” ni usemi wa asili na wazi.
- source_word: γινώσκετε
  choice: mnajua
  rationale: Umbo hili linaeleza jambo ambalo watu hulitambua kutokana na ishara; halitafsiriwi kama amri.
- source_word: ἐγγὺς
  choice: kiko karibu
  rationale: ἐγγύς huonyesha ukaribu wa wakati katika muktadha huu.
- source_word: τὸ θέρος
  choice: kiangazi
  rationale: θέρος kwa kawaida humaanisha majira ya joto au kiangazi; picha ya mabadiliko ya msimu ya mtini inaunga mkono maana hiyo badala ya “wakati wa mavuno.”
theological_decisions:
- issue: Maana ya παραβολή katika muktadha huu
  choice: mfano
  alternative: somo; kielelezo
  rationale: “Mfano” huhifadhi istilahi ya kawaida ya mafundisho ya Yesu huku muktadha ukionyesha kwamba ni ulinganisho wenye fundisho, bila kuongeza maelezo ya kialegoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka picha rahisi ya mtini na msimu bila kuongeza kiunganishi cha wakati kisichokuwapo wazi katika chanzo. Alama ya tanbihi imewekwa baada ya “mfano,” neno ambalo tanbihi inalifafanua.
