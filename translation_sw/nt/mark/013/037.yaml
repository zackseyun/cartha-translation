  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: sw
  text: 'Na ninachowaambia ninyi, nawaambia wote: Kesheni[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Endeleeni kuwa macho” au “Iweni waangalifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ninachowaambia
  rationale: Kiwakilishi hiki cha uhusiano kimetafsiriwa ndani ya kishazi kama “ninachowaambia,” njia ya asili ya Kiswahili ya kuwasilisha maana pana ya “kile ninachosema.”
- source_word: δὲ
  choice: Na
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza hotuba, si pingamizi kali; “Na” linaunganisha sentensi hii na yaliyotangulia kwa kawaida.
- source_word: ὑμῖν
  choice: ninyi
  rationale: Kitenzi “nawaambia” tayari kinaonyesha wingi wa nafsi ya pili, lakini “ninyi” limewekwa wazi ili kuhifadhi utofautishaji wa kimakusudi kati ya wale wanaoambiwa kwanza na “wote.”
- source_word: λέγω ... λέγω
  choice: nawaambia ... nawaambia
  rationale: Kurudia kitenzi kunahifadhi msisitizo na muundo wa balagha wa Kigiriki; “kuwaambia” ni Kiswahili cha kawaida katika muktadha wa kuelekeza maneno kwa watu.
- source_word: πᾶσιν
  choice: wote
  rationale: “Wote” linahifadhi upeo mpana na ufupi wa neno la Kigiriki bila kuongeza nomino isiyotajwa wazi.
- source_word: γρηγορεῖτε
  choice: Kesheni
  rationale: Amri hii ya wingi inaashiria hali ya kuendelea kuwa macho au kukesha. “Kesheni” ni ya moja kwa moja, yenye nguvu, na inafaa taswira ya muktadha.
theological_decisions:
- issue: Upeo wa himizo la Yesu
  choice: Maneno yaliyoelekezwa kwa wanafunzi yanaenezwa wazi kwa wote.
  alternative: Kauli inaweza kueleweka kuwa inawahusu wasikilizaji wa wakati huo tu katika simulizi.
  rationale: Kigiriki kinatofautisha wazi “ninyi” na “wote”; tafsiri imehifadhi upanuzi huo bila kubainisha zaidi utambulisho wa “wote.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kesheni” ni kifupi na cha kibiblia bila kuwa kigumu; tanbihi huhifadhi maana mbadala ya uangalifu unaoendelea.
