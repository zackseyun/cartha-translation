  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: sw
  text: Kwa maana taifa litainuka dhidi ya taifa, na ufalme dhidi ya ufalme. Kutakuwa na matetemeko ya ardhi mahali mbalimbali; kutakuwa na njaa. Hayo ni mwanzo wa uchungu wa kujifungua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maumivu ya kujifungua.” Kigiriki kinatumia picha ya uchungu unaohusiana na kujifungua kama sitiari ya mateso yanayotangulia mambo yajayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: litainuka
  rationale: Kitenzi hiki cha wakati ujao kinaeleza taifa kuinuka dhidi ya jingine. “Litainuka” ni Kiswahili cha kawaida na kinadumisha picha ya chanzo bila kulazimisha umbo la kutendwa.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: taifa ... dhidi ya taifa
  rationale: Katika muktadha huu wa migogoro na kwa kulingana na “ufalme,” ἔθνος inaeleweka vizuri kama taifa; “dhidi ya” huonyesha uhasama uliomo katika ἐπί.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: ufalme dhidi ya ufalme
  rationale: Hapa βασιλεία ni eneo la kisiasa linalotawaliwa, si dhana ya kutawala kwa ujumla. Tafsiri hii pia inadumisha usambamba wa sentensi.
- source_word: σεισμοὶ
  choice: matetemeko ya ardhi
  rationale: Hii ndiyo tafsiri ya kawaida na iliyo wazi ya σεισμοί katika muktadha huu.
- source_word: κατὰ τόπους
  choice: mahali mbalimbali
  rationale: Kifungu hiki kina nguvu ya mgawanyo, kikionyesha kwamba matukio yatatokea katika sehemu tofauti.
- source_word: λιμοί
  choice: njaa
  rationale: λιμός humaanisha njaa kali au ukosefu mkubwa wa chakula. Kiswahili kwa kawaida hutumia nomino ya jumla “njaa” bila kuhitaji umbo la wingi.
- source_word: ἀρχὴ
  choice: mwanzo
  rationale: Neno hili linaonyesha kuwa matukio hayo ni hatua ya kuanzia, si ukamilifu wa yale yatakayofuata.
- source_word: ὠδίνων
  choice: uchungu wa kuzaa
  rationale: Kifungu hiki kinadumisha picha ya maumivu yanayohusiana na kujifungua, huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: ταῦτα
  choice: Hayo
  rationale: Kiwakilishi hiki kinarejelea kwa pamoja matukio yaliyotajwa kabla yake na ni cha kawaida katika Kiswahili.
theological_decisions:
- issue: Sitiari ya kiapokaliptiki katika ἀρχὴ ὠδίνων
  choice: Hayo ni mwanzo wa uchungu wa kuzaa
  alternative: Hayo ni mwanzo wa mateso
  rationale: Tafsiri iliyochaguliwa inadumisha sitiari ya kujifungua na mvutano wa mateso yanayotangulia yatakayofuata, bila kuweka mfumo maalumu wa nyakati za mwisho ambao haujaelezwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha usambamba wa Kigiriki, huku “mahali mbalimbali” na “uchungu wa kuzaa” zikiwa wazi kwa msomaji wa kawaida.
