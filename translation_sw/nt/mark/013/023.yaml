  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: sw
  text: Lakini ninyi, jihadharini[a]; nimewaambia kila kitu mapema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaeni macho” au “angalieni.”
    reason: lexical_alternative
  - marker: b
    text: Au “nimekwisha kuwaambia mambo yote”; pia yaweza kumaanisha “nimewaonya mapema kuhusu kila kitu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi na kina msisitizo; “ninyi” huhifadhi msisitizo huo na utofautishaji unaoletwa na δέ.
- source_word: δὲ
  choice: Lakini
  rationale: Katika muktadha huu, kiunganishi kinaonyesha utofautishaji wa onyo hili na yaliyotangulia; “Lakini” ni cha kawaida na chenye nguvu inayofaa.
- source_word: βλέπετε
  choice: jihadharini
  rationale: Amri ya wakati wa sasa kwa wingi inafanya kazi kama onyo la kuendelea kuwa macho. “Jihadharini” ni Kiswahili cha kawaida kinachowasilisha tahadhari bila kuibana maana kuwa kutazama kwa macho tu.
- source_word: προείρηκα
  choice: nimewaambia ... mapema
  rationale: Kitenzi cha hali timilifu huonyesha kwamba Yesu alisema jambo hilo kabla na kwamba taarifa hiyo bado ina umuhimu. Muundo huu wa Kiswahili huhifadhi maana ya kusema au kuwaambia kabla.
- source_word: ὑμῖν
  choice: -wa-
  rationale: Yambwa isiyo ya moja kwa moja ya wingi imewasilishwa kwa kiambishi cha yambwa “-wa-” katika “nimewaambia.”
- source_word: πάντα
  choice: kila kitu
  rationale: Huwasilisha maana pana ya “mambo yote/kila kitu” kwa Kiswahili cha asili, bila kuamua kimyakimya iwapo kinarejelea kila undani au mambo yote yanayohusika katika muktadha.
theological_decisions:
- issue: Nguvu ya onyo la Yesu na taarifa aliyotoa mapema
  choice: 'Kauli inabaki kuwa onyo la moja kwa moja: wanafunzi wajihadhari kwa sababu Yesu amewaambia kila kitu mapema.'
  alternative: “Kila kitu” kinaweza kueleweka kuwa kila undani wote bila kikomo, au kuwa mambo yote yanayohusika katika maonyo ya muktadha huu.
  rationale: Tafsiri haiongezi neno linalowekea mipaka πάντα kuwa “mambo haya yote,” wala haielezi kwamba ni ufichuzi kamili wa kila jambo la wakati ujao; upana wake unaachwa uamuliwe na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi” huhifadhi msisitizo wa kiwakilishi cha Kigiriki, huku “jihadharini” ikitoa onyo la kawaida na la wazi. Alama zote za tanbihi zimewekwa katika matini kuu.
