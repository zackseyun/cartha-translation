base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: sw
  text: Naye Yesu akaanza kuwaambia, “Jihadharini mtu yeyote asiwapotoshe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalieni mtu yeyote asiwadanganye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Naye
  rationale: Kiunganishi hiki ni cha mpito wa simulizi bila kusisitiza upinzani; “Naye” kinaendeleza masimulizi kwa Kiswahili cha kawaida.
- source_word: ἤρξατο λέγειν αὐτοῖς
  choice: akaanza kuwaambia
  rationale: Huhifadhi wazo la kuanza kusema na kiwakilishi cha walengwa, huku kikisomeka kwa ufasaha katika Kiswahili.
- source_word: Βλέπετε
  choice: Jihadharini
  rationale: Amri hii inataka uangalifu unaoendelea na, mbele ya kishazi cha onyo, “Jihadharini” ni ya kawaida na yenye nguvu inayofaa.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: mtu yeyote asiwapotoshe
  rationale: Muundo huu unaonyesha jambo linalopaswa kuzuiwa. “Kupotosha” huhifadhi maana pana ya kudanganya na kumwondoa mtu katika njia iliyo sahihi.
theological_decisions:
- issue: Asili ya onyo katika πλανήσῃ
  choice: Onyo dhidi ya udanganyifu unaowafanya watu waondoke katika njia iliyo sahihi
  alternative: Onyo linalohusu kudanganywa kiakili pekee
  rationale: Kitenzi πλανάω kinaweza kumaanisha kupoteza njia au kusababisha mtu apotee, wala si kusema jambo lisilo kweli tu. “Kupotosha” huhifadhi upana huo bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa amri umehifadhi onyo la moja kwa moja bila kuingiza wazi jina la wanafunzi mahali ambapo Kigiriki kina kiwakilishi tu.
