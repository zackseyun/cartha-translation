id: MRK.13.29
reference: Mark 13:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: sw
  text: Vivyo hivyo ninyi pia, mtakapoona mambo haya yakitukia, jueni kwamba iko karibu[a], milangoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yuko karibu.” Kigiriki hakitaji kiima waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo ninyi pia
  rationale: “Vivyo hivyo” linaunganisha kauli hii na mfano wa mtini uliotangulia, huku “ninyi pia” likidumisha mkazo unaowekwa kwa wanafunzi.
- source_word: ὅταν ἴδητε
  choice: mtakapoona
  rationale: Muundo huu wa Kiswahili unaeleza tukio la wakati ujao linalotarajiwa bila kulifanya kuwa jambo linalojirudia kila mara.
- source_word: ταῦτα γινόμενα
  choice: mambo haya yakitukia
  rationale: “Mambo haya” linahifadhi wingi wa ταῦτα, na “yakitukia” linaeleza matukio yanayotokea au kutimia kwa lugha ya kawaida na yenye hadhi.
- source_word: γινώσκετε
  choice: jueni
  rationale: Hii ni amri ya moja kwa moja inayowataka wasikilizaji wafikie hitimisho linalofaa kutokana na ishara walizoona.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: kwamba iko karibu
  rationale: Kigiriki hakitaji wazi kiima cha kitenzi. “Iko” kinaacha rejeo likiwa la jumla zaidi kuliko “yuko,” hivyo hakilazimishi tafsiri kwamba anayelengwa lazima awe mtu.
- source_word: ἐπὶ θύραις
  choice: milangoni
  rationale: Neno hili linadumisha wingi wa θύραις na picha ya jambo lililo karibu sana kufika.
theological_decisions:
- issue: Kiima kisichotajwa cha ἐστιν (“iko/yuko karibu”)
  choice: Kutumia “iko karibu” katika matini kuu.
  alternative: “yuko karibu”
  rationale: Kigiriki kinaacha kiima bila kutajwa. “Iko karibu” kinaweza kuelekeza kwa tukio au utimilifu unaokaribia bila kuingiza rejeo mahsusi lisilotajwa; uwezekano kwamba maneno hayo yanamhusu Mwana wa Adamu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Milangoni” limechaguliwa badala ya nahau ya kawaida zaidi “mlangoni” ili kuhifadhi wingi wa Kigiriki, ingawa matumizi hayo yana ladha ya kifasihi.
