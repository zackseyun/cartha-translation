  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: sw
  text: Ndugu atamkabidhi[a] ndugu yake ili auawe, na baba atamkabidhi mtoto wake ili auawe; watoto watainuka dhidi ya wazazi wao na kuwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atamsaliti ndugu yake ili auawe.” Kitenzi cha Kigiriki kinaweza kumaanisha kumkabidhi, kumtoa mikononi mwa wengine, au, katika muktadha huu, kumsaliti.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: atamkabidhi
  rationale: Kitenzi hiki humaanisha kumkabidhi au kumtia mtu mikononi mwa wengine. Katika muktadha wa mateso, “atamkabidhi” kinadumisha picha ya kumtoa mtu kwa wenye mamlaka ili auawe, bila kulazimisha maana ya kihisia ya “kumsaliti.”
- source_word: ἀδελφὸς ἀδελφὸν
  choice: Ndugu ... ndugu yake
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa uhusiano huu. Kiwakilishi “yake” kinaweka wazi uhusiano wa kifamilia unaodokezwa na Kigiriki na kudumisha uzito wa ndugu kumgeukia ndugu.
- source_word: εἰς θάνατον
  choice: auawe
  rationale: Kirai hiki kinaonyesha mwisho au matokeo ya kukabidhiwa. “Auawe” ni Kiswahili cha asili kinachoeleza wazi kwamba kukabidhiwa huko kunaelekea kwenye kuuawa.
- source_word: πατὴρ τέκνον
  choice: baba ... mtoto wake
  rationale: πατήρ ni “baba,” huku τέκνον ikiwa “mtoto” bila kumtaja kuwa wa kiume au wa kike. Kitenzi “atamkabidhi” kinaeleweka kutokana na kishazi kilichotangulia, kama ilivyo katika Kigiriki.
- source_word: ἐπαναστήσονται ... ἐπὶ
  choice: watainuka dhidi ya
  rationale: Usemi huu unadumisha picha hai ya kusimama kwa uhasama dhidi ya mtu, badala ya kuifupisha tu kuwa kubadili msimamo.
- source_word: γονεῖς
  choice: wazazi
  rationale: Wingi wa γονεύς humaanisha wazazi, na “wazazi” ni neno la moja kwa moja na la kawaida katika Kiswahili.
- source_word: θανατώσουσιν αὐτούς
  choice: kuwaua
  rationale: θανατόω humaanisha kuua au kusababisha mtu auawe. “Kuwaua” ni wazi, cha asili, na kinaonyesha kwamba wazazi ndio watakaouawa.
theological_decisions:
- issue: Maneno ya kifamilia yenye jinsia katika kauli wakilishi
  choice: Kudumisha “baba,” lakini kutumia “mtoto,” “watoto,” na “wazazi” pale maneno ya Kigiriki yalipo mapana zaidi.
  alternative: Kutumia “mzazi” badala ya “baba,” au “mwana” badala ya “mtoto.”
  rationale: πατήρ humtaja baba hasa, ilhali τέκνον na γονεῖς hayajafungwa kwa jinsia moja. Tafsiri inadumisha tofauti hiyo bila kuongeza wala kufuta ubainifu wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unabaki mkali na mfupi kama Kigiriki, huku “mtoto wake” na kitenzi kinachoeleweka katika kishazi cha pili vikifanya sentensi isomeke kwa kawaida.
