id: MRK.13.31
reference: Mark 13:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: sw
  text: Mbingu na dunia zitapita, lakini maneno yangu kamwe hayatapita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hakika hayatapita” au “kwa vyovyote hayatapita.” Kigiriki kina ukanushi wenye msisitizo mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Mbingu
  rationale: Katika jozi ya kimamlaka ya ulimwengu mzima pamoja na ‘dunia,’ neno hili linamaanisha mbingu, si anga inayoonekana tu.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Katika usemi ‘mbingu na dunia,’ γῆ humaanisha dunia kwa ujumla, si nchi au eneo fulani.
- source_word: παρελεύσονται
  choice: zitapita
  rationale: Kitenzi hiki hapa kina maana ya kupita au kufikia mwisho. ‘Zitapita’ ni usemi wa asili unaohifadhi maana bila kueleza isivyohitajika namna zitakavyopita.
- source_word: δὲ
  choice: lakini
  rationale: Neno hili linaonyesha tofauti iliyo wazi kati ya kupita kwa mbingu na dunia na kudumu kwa maneno ya Yesu.
- source_word: οἱ λόγοι μου
  choice: maneno yangu
  rationale: Hurejelea maneno au matamko ya Yesu; ‘maneno yangu’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: οὐ μὴ παρελεύσονται
  choice: kamwe hayatapita
  rationale: Muundo οὐ μή pamoja na kitenzi cha wakati ujao ni ukanushi wenye msisitizo mkubwa. ‘Kamwe hayatapita’ huwasilisha nguvu hiyo kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Nguvu ya ukanushi wenye msisitizo kuhusu maneno ya Yesu
  choice: kamwe hayatapita
  alternative: kwa hakika hayatapita; kwa vyovyote hayatapita
  rationale: Tafsiri inaonyesha kwa wazi tofauti kati ya kupita kwa ulimwengu ulioumbwa na kudumu kwa maneno ya Yesu, huku ikihifadhi msisitizo wa Kigiriki bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Mbingu na dunia’ huhifadhi jozi ya kawaida ya ulimwengu mzima, na ‘kamwe hayatapita’ huleta msisitizo wa asili kwa mtiririko wa kawaida wa Kiswahili.
