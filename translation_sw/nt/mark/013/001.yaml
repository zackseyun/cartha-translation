  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: sw
  text: Yesu alipokuwa akitoka katika eneo la hekalu[a], mmoja wa wanafunzi wake anamwambia, “Mwalimu, tazama, mawe ya ajabu jinsi gani, na majengo ya ajabu jinsi gani![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la hekalu pamoja na majengo yake, si jengo la patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mawe makubwa jinsi gani, na majengo makubwa jinsi gani!” Kivumishi cha Kigiriki huonyesha mshangao au kuvutiwa, na kinaweza kurejelea ukubwa, ubora, au aina ya kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Yesu alipokuwa akitoka
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tendo jingine lilipotokea. Jina “Yesu” limetumiwa badala ya kiwakilishi ili Kiswahili kiwe wazi na cha kawaida katika mwanzo huu wa simulizi.
- source_word: τοῦ ἱεροῦ
  choice: eneo la hekalu
  rationale: ἱερόν hapa ni eneo lote la hekalu pamoja na majengo yake, si patakatifu pa ndani pekee. “Eneo la hekalu” linaweka maana hiyo wazi kwa msomaji wa kawaida.
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati wa sasa wa kihistoria katika simulizi la Marko umehifadhiwa ili kudumisha uhai wa usimulizi.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: mmoja wa wanafunzi wake
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa usemi wa sehemu ya kundi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni neno la kawaida na sahihi la kumwita mtu anayefundisha, bila kuingiza maana nyingine isiyodaiwa na neno la Kigiriki.
- source_word: ἴδε
  choice: tazama
  rationale: Amri hii inavuta uangalifu wa Yesu kwa mawe na majengo; “tazama” ni ya kawaida, yenye heshima, na isiyo ya kizamani.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: jinsi ... yanavyostaajabisha na jinsi ... yanavyostaajabisha
  rationale: ποταπός katika muundo huu wa mshangao huonyesha kuvutiwa au kustaajabu kwa ubora au aina. Tafsiri hii huhifadhi mshangao bila kuamua kimya kimya kwamba ukubwa pekee ndio unaosisitizwa.
- source_word: λίθοι
  choice: mawe
  rationale: Ni maana ya moja kwa moja ya neno hilo katika muktadha wa ujenzi wa hekalu.
- source_word: οἰκοδομαί
  choice: majengo
  rationale: Neno hili linarejelea majengo au miundo mingi katika eneo la hekalu; “majengo” ni wazi na la kawaida.
