  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: sw
  text: Lakini katika siku zile, baada ya dhiki hiyo[a], jua litatiwa giza, na mwezi hautatoa nuru yake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu hiyo” au “mateso hayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Lakini
  rationale: Huonyesha tofauti au mpito wenye mkazo kutoka kwa yaliyotangulia, kwa njia ya kawaida na fupi katika Kiswahili.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku zile
  rationale: Ni usemi wa wakati unaohifadhi muundo na uzito wa kinabii wa Kigiriki bila kuupanua isivyohitajika.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: baada ya dhiki hiyo[a]
  rationale: μετά pamoja na hali ya accusative huonyesha wakati, yaani ‘baada ya.’ ‘Dhiki’ huhifadhi uzito wa θλῖψις katika muktadha huu wa matukio ya mwisho, huku ‘hiyo’ ikihifadhi umahususi wa ἐκείνην.
- source_word: ὁ ἥλιος
  choice: jua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: σκοτισθήσεται
  choice: litatiwa giza
  rationale: Huhifadhi wakati ujao na hali ya kutendwa ya kitenzi cha Kigiriki, na ni usemi unaoeleweka katika Kiswahili cha kibiblia cha sasa.
- source_word: καὶ
  choice: nao
  rationale: Huunganisha ishara mbili za angani kwa ufasaha; kiambishi ‘-o’ hurejelea mwezi na kuendeleza sentensi kwa kawaida.
- source_word: ἡ σελήνη
  choice: mwezi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: οὐ δώσει
  choice: hautatoa
  rationale: Huhifadhi maana halisi ya ‘hautatoa’ na taswira hai ya mwezi kutoa nuru.
- source_word: τὸ φέγγος αὐτῆς
  choice: nuru yake
  rationale: ‘Nuru’ ni neno la kawaida na lenye hadhi kwa φέγγος, na ‘yake’ humrejelea mwezi kwa wazi.
theological_decisions:
- issue: Tafsiri ya θλῖψις katika hotuba kuhusu matukio ya mwisho
  choice: dhiki
  alternative: taabu; mateso
  rationale: ‘Dhiki’ huhifadhi uzito mkubwa wa neno katika muktadha huu bila kuingiza mfumo maalumu wa mafundisho kuhusu nyakati za mwisho. Tanbihi inaonyesha maana nyingine halali za neno hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii na hali ya kutendwa katika ‘litatiwa giza’ zimehifadhiwa bila kufanya sentensi kuwa nzito kupita kiasi.
