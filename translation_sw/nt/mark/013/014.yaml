  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: sw
  text: Lakini mtakapoliona “chukizo la ukiwa” limesimama mahali ambapo halipaswi kuwa (anayesoma na afahamu)[a], ndipo wale walio katika Yudea wakimbilie milimani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amesimama mahali ambapo hapaswi kuwa.” Kishiriki cha Kigiriki kiko katika umbo la kiume, jambo linaloweza kudokeza mhusika binafsi aliye nyuma ya usemi “chukizo.”
    reason: alternative_reading
  - marker: b
    text: Usemi “chukizo la ukiwa” unarudia lugha ya Danieli (taz. Dan. 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Lakini mtakapoliona
  rationale: “Lakini” linaonyesha mwendelezo wenye tofauti ndogo, huku muundo wa “mtakapo-” ukieleza kwa Kiswahili cha kawaida tukio la wakati ujao linalotarajiwa bila kubadili kuwa sharti la kubuniwa.
- source_word: ἴδητε
  choice: mtakapoliona
  rationale: Kitenzi kimeunganishwa na kiunganishi cha wakati; “-ona” ndilo neno la kawaida na la moja kwa moja, na kiambishi “-li-” kinarejelea “chukizo.”
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: chukizo la ukiwa
  rationale: Hifadhi usemi wa karibu na chanzo na mwangwi wake wa kitabu cha Danieli. “Ukiwa” unaacha wazi ikiwa usemi huo unamaanisha hali, tendo, kitu, au mhusika anayeleta ukiwa.
- source_word: ἑστηκότα
  choice: limesimama
  rationale: Huwasilisha hali iliyopo inayotokana na kusimamishwa au kusimama hapo, bila kuongeza ufafanuzi wa “limewekwa.” Upatanisho wa ngeli unafuata nomino iliyo wazi, “chukizo.”
- source_word: ὅπου οὐ δεῖ
  choice: mahali lisipopasa
  rationale: “Kupasa” huonyesha kutofaa au kutoruhusiwa kwa mahali hapo. Muundo huu ni mfupi, wa asili, na unaendana na “chukizo” katika matini kuu.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: anayesoma na afahamu
  rationale: Ni himizo la pembeni kwa msomaji. “Na afahamu” huhifadhi nguvu ya amri ya nafsi ya tatu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τότε
  choice: ndipo
  rationale: “Ndipo” huunganisha ishara iliyotangulia na hatua inayopaswa kufuatwa mara hiyo.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: wale walio Uyahudi
  rationale: Ni tafsiri fupi na ya kawaida inayohifadhi jina mahususi la eneo.
- source_word: φευγέτωσαν
  choice: wakimbilie
  rationale: Umbo la “wa-” baada ya “ndipo” linatoa agizo lenye uzito; “kukimbilia” linaonyesha kutoroka kwa haraka kuelekea mahali pa usalama.
- source_word: εἰς τὰ ὄρη
  choice: milimani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuelekea maeneo ya milima bila kulazimisha mlima mmoja maalumu.
theological_decisions:
- issue: Maana ya usemi wa Danieli βδέλυγμα τῆς ἐρημώσεως
  choice: Kudumisha usemi “chukizo la ukiwa” bila kutaja mhusika au tukio fulani la kihistoria.
  alternative: “chukizo linaloleta ukiwa” au “unajisi unaoharibu”
  rationale: Rejeleo linaweza kueleweka kuwa kitu, tendo, au mhusika wa kufuru. Matini kuu inapaswa kuhifadhi mwangwi wa Danieli na utata wa kweli badala ya kuamua tafsiri moja.
- issue: Kivumishi-shiriki cha kiume ἑστηκότα pamoja na nomino isiyo ya kiume βδέλυγμα
  choice: 'Katika matini kuu, kutumia upatanisho wa “chukizo”: “limesimama mahali lisipopasa,” huku uwezekano wa mhusika binafsi ukitajwa katika tanbihi.'
  alternative: “amesimama mahali asipopasa”
  rationale: Kiswahili huhitaji upatanisho wa ngeli ulio wazi. Matini kuu inafuata nomino iliyotajwa, lakini tanbihi inalinda dalili ya kisarufi ya Kigiriki kwamba huenda mhusika binafsi anadokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “mtakapoliona” na “ndipo” kwa mtiririko wa kawaida wa simulizi na agizo. Usemi wa kiapokaliptiki umeachwa wa karibu na chanzo, huku tanbihi zikihifadhi utata wa kisarufi na mwangwi wa Danieli.
