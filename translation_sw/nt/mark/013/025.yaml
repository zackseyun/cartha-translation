  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: sw
  text: Na nyota zitakuwa zikianguka kutoka mbinguni[a], na nguvu zilizo katika mbingu zitatikiswa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka angani.” Neno la Kigiriki οὐρανός linaweza kumaanisha “mbingu” au “anga,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: “Nguvu zilizo katika mbingu” huenda zikamaanisha nguvu za mbinguni, nguvu za ulimwengu, au miundo ya mbingu; Kigiriki hakibainishi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: nyota
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa vitu vya angani vinavyotajwa katika muktadha huu wa kiapokaliptiki.
- source_word: ἔσονται ... πίπτοντες
  choice: zitakuwa zikianguka
  rationale: Muundo huu unaakisi kitenzi cha wakati ujao pamoja na participio ya wakati wa sasa, na kuhifadhi picha ya tendo linaloendelea au linaloonyeshwa kwa uhai.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: “Mbinguni” huhifadhi hadhi ya juu ya lugha ya kifungu, huku neno la Kigiriki likiweza pia kumaanisha anga.
- source_word: δυνάμεις
  choice: nguvu
  rationale: “Nguvu” ni tafsiri pana isiyolazimisha maana kuwa viumbe wa rohoni, nguvu za ulimwengu, au miundo ya mbingu.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: zilizo katika mbingu
  rationale: Kauli hii hudumisha upeo wa ulimwengu wa juu na kwa kadiri inavyowezekana huakisi wingi wa Kigiriki bila kuifanya sentensi kuwa ngumu.
- source_word: σαλευθήσονται
  choice: zitatikiswa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya wakati ujao katika kauli tendwa, inayofaa picha ya msukosuko wa ulimwengu.
theological_decisions:
- issue: Maana ya “nguvu zilizo katika mbingu”
  choice: Imetafsiriwa kwa ujumla kama “nguvu zilizo katika mbingu,” bila kubainisha ni nguvu za aina gani.
  alternative: Viumbe wenye nguvu wa mbinguni; nguvu za ulimwengu; au miundo ya mbingu.
  rationale: Kauli ya Kigiriki ina maana pana katika muktadha wa kiapokaliptiki. Tafsiri haipaswi kuondoa utata ambao matini yenyewe haiondoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “zitakuwa zikianguka” umechaguliwa ili kuhifadhi hali endelevu na hai ya Kigiriki, na “nguvu” limeachwa kwa upana ili kutofafanua kupita kiasi.
