id: MRK.13.34
reference: Mark 13:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: sw
  text: Ni kama mtu aliyeko safarini, aliyeacha nyumba yake na kuwapa watumwa wake[a] mamlaka, na akimpa kila mmoja kazi yake, kisha akamwamuru mlinzi wa mlango akae macho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wake.” Neno la Kigiriki humaanisha watumwa waliokuwa chini ya mamlaka ya bwana wa nyumba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: Ni kama
  rationale: Hufanya ulinganisho unaodokezwa katika Kigiriki uwe wazi na wa kawaida katika Kiswahili.
- source_word: ἄνθρωπος ἀπόδημος
  choice: mtu aliyesafiri mbali
  rationale: ἀπόδημος humaanisha mtu aliye mbali na nyumbani, hasa kwa sababu ya safari; usemi huu unaonyesha safari na kutokuwapo kwake.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: aliacha nyumba yake
  rationale: Hutoa maana ya kawaida ya kishiriki cha wakati uliopita kwa mtiririko wa asili wa simulizi la Kiswahili.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ
  choice: akawapa watumwa wake
  rationale: Kitenzi δοὺς ni ‘akawapa,’ na δοῦλοι hapa huonyesha watu walio chini ya mamlaka ya bwana wa nyumba kwa hali ya utumwa.
- source_word: τὴν ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili huhifadhi dhana ya uwezo au haki ya kutenda waliyopewa na mwenye nyumba.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: huku akimpa kila mmoja kazi yake
  rationale: Hufafanua kwa Kiswahili sanifu muundo wa Kigiriki uliofupishwa, bila kubadili maana kwamba kila mmoja alipewa kazi yake mwenyewe.
- source_word: τῷ θυρωρῷ
  choice: mlinzi wa mlango
  rationale: Ni usemi wa wazi wa Kiswahili kwa mtu mwenye jukumu la kulinda au kuangalia mlangoni.
- source_word: ἐνετείλατο
  choice: akamwamuru
  rationale: Huhifadhi uzito wa amri ya mwenye nyumba badala ya kuifanya kuwa ushauri tu.
- source_word: ἵνα γρηγορῇ
  choice: akae macho
  rationale: Huhifadhi picha halisi ya kutolala na pia maana ya kuwa mwangalifu iliyo muhimu katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa δοῦλος katika mazingira ya nyumba yenye bwana
  choice: watumwa
  alternative: watumishi
  rationale: ‘Watumwa’ huonyesha kwa uwazi zaidi hali ya watu waliokuwa chini ya umiliki na mamlaka ya bwana katika picha hii. Tanbihi inahifadhi ‘watumishi’ kama tafsiri nyingine inayotumiwa mara nyingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umewekwa wazi kwa kutumia alama ya nukta mbili na vitenzi vinavyofuatana, huku taswira ya ‘kukaa macho’ ikihifadhiwa.
