  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: sw
  text: Na mtakaposikia vita na habari za vita[a], msifadhaike; hayo hayana budi kutokea, lakini mwisho bado haujafika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvumi wa vita.” Neno la Kigiriki linaweza kumaanisha taarifa, habari, au uvumi unaosikiwa kuhusu vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nanyi mtakapo-
  rationale: ὅταν huonyesha hali ya wakati unaotarajiwa, na δέ ni kiunganishi chepesi. Muundo huu unaunganisha sentensi kwa kawaida bila kuifanya δέ kuwa tofauti kali.
- source_word: ἀκούσητε
  choice: mtakaposikia
  rationale: Kitenzi cha aoristi tegemezi baada ya ὅταν kinaelekea wakati ujao katika muktadha huu; Kiswahili hukieleza kwa muundo wa -takapo-.
- source_word: πολέμους
  choice: habari za vita
  rationale: Kwa kuwa ἀκούω ikifuatwa na kitu kinachosikiwa inaweza kumaanisha kusikia juu ya jambo, 'kusikia habari za vita' ni Kiswahili cha kawaida na hakidai kwamba vita vyenyewe vinasikiwa moja kwa moja.
- source_word: ἀκοὰς πολέμων
  choice: taarifa za vita
  rationale: ἀκοή hapa inaweza kuwa taarifa, habari, au uvumi unaosikiwa. 'Taarifa' ni pana na haimaanishi moja kwa moja kwamba habari hizo hazijathibitishwa.
- source_word: μὴ θροεῖσθε
  choice: msifadhaike
  rationale: θροέομαι humaanisha kushtushwa, kuvurugika, au kuingiwa na hofu. 'Msifadhaike' ni ya asili na huhifadhi wazo la kutotikiswa na habari hizo.
- source_word: δεῖ γενέσθαι
  choice: Hayo hayana budi kutokea
  rationale: δεῖ huonyesha ulazima na γενέσθαι kutokea. 'Hayana budi' huhifadhi nguvu ya ulazima bila kueleza chanzo au mfumo wake.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: lakini mwisho bado
  rationale: Huu ni usemi mfupi na wa kawaida wa Kiswahili unaomaanisha kwamba mwisho haujafika bado, huku ukihifadhi mkazo wa οὔπω.
theological_decisions:
- issue: Ulazima wa kieskatolojia katika δεῖ γενέσθαι
  choice: Hayo hayana budi kutokea
  alternative: Ni lazima hayo yatokee
  rationale: Tafsiri inadumisha kauli ya ulazima katika maandiko bila kubainisha utaratibu wake au kuingiza mfumo maalumu wa mafundisho kuhusu nyakati za mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Taarifa za vita' limetumiwa badala ya 'uvumi wa vita' katika matini kuu ili kutohusisha bila sababu kwamba habari hizo hazijathibitishwa; maana hiyo mbadala imehifadhiwa katika tanbihi.
