  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: sw
  text: Kwa hiyo, kaeni macho[a], kwa maana hamjui bwana wa nyumba atakuja lini—iwe ni jioni, au usiku wa manane, au wakati jogoo anapowika[b], au asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “endeleeni kukesha.” Amri hii ina maana ya kudumu katika hali ya kuwa macho na waangalifu.
    reason: lexical_alternative
  - marker: b
    text: Usemi “wakati jogoo anapowika” unarejelea zamu ya usiku iliyotambulishwa kwa kuwika kwa jogoo.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: kaeni macho
  rationale: Amri hii inataka waendelee kuwa macho na waangalifu. Usemi huu ni wa kawaida katika Kiswahili na unafaa katika muktadha wa kutokujua wakati wa kuwasili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mafundisho yaliyotangulia.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi kilichokanushwa, bila kuongeza uhakika usiotajwa katika Kigiriki.
- source_word: πότε
  choice: lini
  rationale: Hutoa swali la wakati kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: mwenye nyumba
  rationale: Katika picha hii ya nyumbani, kirai kinamtaja mwenye mamlaka juu ya nyumba. ‘Mwenye nyumba’ ni cha kawaida na hakilazimishi neno hili kuwa cheo cha moja kwa moja cha kiungu.
- source_word: ἔρχεται
  choice: atakuja
  rationale: Wakati wa sasa wa Kigiriki unaelekea kwenye kuwasili kunakotarajiwa; wakati ujao ni wa kawaida katika Kiswahili katika muktadha huu.
- source_word: ὀψὲ
  choice: jioni
  rationale: Katika mfuatano huu linarejelea zamu ya kwanza ya usiku, yaani jioni.
- source_word: μεσονύκτιον
  choice: usiku wa manane
  rationale: Ni usemi wa kawaida wa Kiswahili kwa wakati wa katikati ya usiku.
- source_word: ἀλεκτοροφωνίας
  choice: wakati jogoo anapowika
  rationale: Huhifadhi picha halisi ya kuwika kwa jogoo na kueleweka kwa urahisi kuliko istilahi maalumu ya zamu ya usiku.
- source_word: πρωΐ
  choice: asubuhi
  rationale: Hutaja kipindi cha mwisho katika mfuatano wa zamu za usiku kuelekea asubuhi bila kukibana kuwa mapambazuko pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος katika mfano wa mwenye mamlaka ya nyumba ambao unaweza kumwelekezea Yesu kwa njia isiyo ya moja kwa moja
  choice: mwenye nyumba
  alternative: Bwana wa nyumba
  rationale: Muktadha wa karibu ni picha ya kawaida ya nyumbani. ‘Mwenye nyumba’ huhifadhi maana ya mhusika katika mfano bila kukataa uwezekano wa mfano huo kumwelekezea Yesu, wala kufanya neno hili liwe waziwazi cheo cha kiungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kaeni macho’ ni usemi wa kawaida unaobeba wazo la kukesha kwa uangalifu; orodha ya nyakati imetolewa kwa mtiririko wa kawaida wa Kiswahili.
