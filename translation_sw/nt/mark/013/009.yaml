base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: sw
  text: 'Lakini ninyi jihadharini: watawatia mikononi mwa mabaraza, na mtapigwa katika masinagogi; nanyi mtasimamishwa mbele ya watawala na wafalme kwa ajili yangu, kuwa ushuhuda kwao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa ushahidi kwao”; kirai hiki kinaweza pia kumaanisha “kuwa ushuhuda dhidi yao.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Lakini ninyi jihadharini
  rationale: Kauli ya kuamuru ya wakati uliopo inatoa onyo la kuendelea kuwa macho. Kiwakilishi “ninyi” kinahifadhi mkazo wa ὑμεῖς, na “jihadharini” huwasilisha vizuri maana ya kujilinda au kuwa macho.
- source_word: παραδώσουσιν ὑμᾶς
  choice: Watawatia mikononi mwa
  rationale: Katika muktadha wa mateso na mamlaka za hukumu, kirai hiki humaanisha kuwakabidhi watu kwa mamlaka; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: συνέδρια
  choice: mabaraza
  rationale: Wingi unaelekea kutaja mabaraza ya mahali yenye kazi za utawala au hukumu, si lazima Baraza Kuu la Yerusalemu pekee.
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: mtapigwa katika masinagogi
  rationale: δαρήσεσθε ni kauli tendwa ya kupigwa; “mtapigwa” haibainishi kupita kiasi aina ya kipigo. “Masinagogi” huhifadhi mahali na taasisi inayotajwa.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: mtasimamishwa mbele ya watawala na wafalme
  rationale: Kauli tendwa inaweza kudokeza kulazimishwa kusimama au kufikishwa mbele ya mamlaka. “Mtasimamishwa mbele ya” huhifadhi udokezo huo na mazingira rasmi ya kushtakiwa.
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa sababu yangu
  rationale: Kirai hiki kinaonyesha kwamba uhusiano wao na Yesu ndio sababu ya mateso.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ili iwe ushuhuda kwao
  rationale: Tafsiri hii huhifadhi wazo pana la tukio hilo kuwa ushuhuda unaowaelekea wenye mamlaka, bila kulazimisha maana ya hukumu dhidi yao.
theological_decisions:
- issue: Maana ya εἰς μαρτύριον αὐτοῖς
  choice: “ili iwe ushuhuda kwao”
  alternative: “ili iwe ushuhuda dhidi yao”
  rationale: αὐτοῖς inaweza kueleweka kama wale wanaoelekezewa ushuhuda, huku katika muktadha fulani ushuhuda huo ukiweza kuwa dhidi yao. Maandishi makuu yanatumia maana isiyoelemea upande mmoja, na tanbihi inadumisha uwezekano wa maana ya kuhukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa kwa mtiririko wa asili bila kupoteza uhusiano wa vifungu vya Kigiriki.
