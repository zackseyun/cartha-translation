  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: sw
  text: Wengi watakuja kwa jina langu wakisema, “Mimi ndiye[a],” nao watawapotosha wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata Kigiriki kwa karibu zaidi, “Mimi ni.” Kigiriki hakitaji kijalizo waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinarejelea watu wengi bila kuwataja kwa aina maalumu; “Wengi” ni fupi na ya kawaida katika Kiswahili.
- source_word: ἐλεύσονται
  choice: watakuja
  rationale: Wakati ujao wa ἔρχομαι una maana ya kuja au kujitokeza; “watakuja” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Kirai hiki kinaweza kuonyesha kutumia jina la Yesu kama msingi wa madai, mamlaka, au uhusiano; “kwa jina langu” huhifadhi upana huo bila kuamua maana moja tu.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hii ni hali ya kuambatana inayoonyesha kile watakachosema wanapokuja; “wakisema” ni ya asili na haiongezi tafsiri.
- source_word: ὅτι Ἐγώ εἰμι
  choice: “Mimi ndiye”
  rationale: Kigiriki hakitaji kijalizo baada ya “mimi ni,” lakini muktadha unaashiria madai ya utambulisho. “Mimi ndiye” ni Kiswahili cha kawaida kinachohifadhi madai hayo bila kutaja wazi cheo kisichotajwa katika chanzo.
- source_word: πολλοὺς
  choice: wengi
  rationale: Ni yambwa inayorejelea watu wengi; “wengi” ni ya kawaida na inadumisha mwangwi wa neno lilelile mwanzoni mwa aya.
- source_word: πλανήσουσιν
  choice: watawapotosha
  rationale: Kitenzi kina maana ya kuwafanya wengine waache njia ya kweli, yaani kuwadanganya au kuwapotosha; “watawapotosha” huhifadhi wazo la kuongozwa mbali na ukweli.
theological_decisions:
- issue: Tafsiri ya Ἐγώ εἰμι katika muktadha wa watu wanaodai utambulisho wa Yesu
  choice: Mimi ndiye
  alternative: Mimi niko
  rationale: “Mimi ndiye” huwasilisha kwa Kiswahili cha kawaida dai la utambulisho linalodokezwa na muktadha, lakini haliongezi cheo kama “Masihi” ambacho hakipo wazi katika Kigiriki. Kwa kuwa kijalizo hakijatajwa, tafsiri ya karibu zaidi na muundo wa Kigiriki imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Mimi ndiye” ni wa kawaida na unaeleweka, huku tanbihi ikihifadhi kutokamilishwa kwa kiarifu katika Kigiriki. Alama ya tanbihi imewekwa baada ya dai linalohusika.
