base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: sw
  text: Nanyi mtachukiwa na wote kwa sababu ya jina langu.[a] Lakini atakayevumilia mpaka mwisho ataokolewa.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya jina langu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atakayedumu imara mpaka mwisho.”
    reason: lexical_alternative
  - marker: c
    text: Au, “atanusuriwa.” Neno la Kigiriki linaweza kumaanisha kuokolewa kutoka hatarini au kupata wokovu; muktadha hauainishi kikamilifu upana wa maana inayokusudiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: mtachukiwa
  rationale: Muundo wa ἔσεσθε pamoja na μισούμενοι unaeleza hali ya wakati ujao; “mtachukiwa” ni Kiswahili cha kawaida na sahihi.
- source_word: ὑπὸ πάντων
  choice: na wote
  rationale: Inahifadhi usemi mpana na usio na kizuizi wa Kigiriki bila kuupunguza.
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa sababu ya jina langu
  rationale: διά pamoja na hali ya accusative huonyesha sababu. Usemi huu ni wa asili katika Kiswahili na unadumisha maana ya “jina” inayohusisha nafsi, mamlaka, na uaminifu kwa Yesu.
- source_word: ὁ δὲ ὑπομείνας
  choice: Lakini atakayevumilia
  rationale: Kirai hiki kinamtaja mtu anayebaki imara chini ya shinikizo. “Atakayevumilia” ni cha kawaida na hakiongezi istilahi maalumu ya kimadhehebu.
- source_word: εἰς τέλος
  choice: mpaka mwisho
  rationale: Inadumisha wazo la kuendelea hadi kikomo bila kuamua kama ni mwisho wa mateso, maisha ya mtu, au mwisho wa nyakati.
- source_word: οὗτος
  choice: imewakilishwa kwa msisitizo wa muundo wa sentensi bila kutafsiriwa kando
  rationale: Kiwakilishi hiki ni cha kurejelea na kusisitiza mtu aliyetajwa. Kukitafsiri moja kwa moja kama “huyo” kungefanya Kiswahili kuwa kizito; muundo “atakayevumilia ... ataokolewa” unadumisha marejeo hayo kwa kawaida.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa kutoka hatarini au wokovu kwa maana pana. “Ataokolewa” kinadumisha upana huo wa kimuktadha na wa kiteolojia.
theological_decisions:
- issue: Maana ya σωθήσεται katika kauli kuhusu kuvumilia
  choice: ataokolewa
  alternative: atanusuriwa
  rationale: “Ataokolewa” kinahifadhi uzito na upana wa neno la Kigiriki bila kulifungia katika ukombozi wa muda tu wala fundisho fulani la kimadhehebu kuhusu kudumu.
- issue: Upeo wa πάντων
  choice: na wote
  alternative: na kila mtu
  rationale: Tafsiri inadumisha usemi mpana wa chanzo bila kuongeza ufafanuzi unaoweza kupunguza nguvu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nanyi” huunganisha mstari na muktadha uliotangulia; “mtachukiwa” na “atakayevumilia” ni miundo ya kawaida inayoeleweka kwa wasomaji wengi. Alama zote za tanbihi zimewekwa katika matini kuu.
