  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: sw
  text: Na habari njema lazima ihubiriwe kwanza kwa mataifa yote[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Injili.” Neno la Kigiriki εὐαγγέλιον kihalisi humaanisha “habari njema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwa mataifa yote.” Katika baadhi ya miktadha, neno la Kigiriki ἔθνη linaweza pia kumaanisha “watu wasio Wayahudi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Inaendeleza mtiririko wa hotuba bila kuongeza maana ya upinzani.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: kwa mataifa yote
  rationale: Katika muktadha wa kitenzi cha kutangaza, εἰς huonyesha walengwa au upeo. ‘Kwa mataifa yote’ ni Kiswahili cha kawaida kinachohifadhi upeo wa ulimwengu mzima; tanbihi inahifadhi uwezekano wa maana ya ‘miongoni mwa mataifa yote’ na ya ἔθνη kumaanisha watu wasio Wayahudi.
- source_word: πρῶτον
  choice: kwanza
  rationale: Huhifadhi kipaumbele cha wakati kinachoonyeshwa na neno la Kigiriki bila kufafanua zaidi mpangilio wa matukio.
- source_word: δεῖ
  choice: lazima
  rationale: Hueleza ulazima kwa nguvu na kwa lugha ya kawaida bila kutaja wazi chanzo cha ulazima huo, ambacho hakijasemwa katika mstari huu.
- source_word: κηρυχθῆναι
  choice: ihubiriwe
  rationale: Kauli tendwa hii huonyesha kutangazwa kwa ujumbe hadharani. ‘Ihubiriwe’ ni neno la kawaida na lenye hadhi katika Kiswahili kwa tendo hilo.
- source_word: τὸ εὐαγγέλιον
  choice: habari njema
  rationale: Hutoa maana ya moja kwa moja ya εὐαγγέλιον kwa Kiswahili cha sasa; ‘Injili’ imehifadhiwa katika tanbihi kama istilahi ya jadi iliyozoeleka.
theological_decisions:
- issue: Upeo wa ἔθνη
  choice: mataifa yote
  alternative: watu wote wasio Wayahudi
  rationale: Uchaguzi huu huhifadhi upeo mpana wa tangazo bila kulazimisha hapa utofautishaji maalumu kati ya Wayahudi na watu wasio Wayahudi; uwezekano huo wa kileksika umetajwa katika tanbihi.
- issue: Nguvu ya δεῖ
  choice: lazima
  alternative: ni lazima
  rationale: ‘Lazima’ huhifadhi ulazima unaoweza kuwa na uzito wa kimungu au wa matukio ya mwisho, lakini haisemi wazi chanzo chake kwa kuwa mstari wenyewe haukitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio ‘lazima kwanza’ huhifadhi kwa kawaida mkazo wa πρῶτον δεῖ. Alama zote za tanbihi zimewekwa katika matini kuu.
