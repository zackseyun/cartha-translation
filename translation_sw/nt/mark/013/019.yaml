  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: sw
  text: Kwa maana siku hizo zitakuwa dhiki ya namna ambayo haijapata kuwako tangu mwanzo wa uumbaji ambao Mungu aliuumba mpaka sasa[a], wala haitakuwako kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhiki ambayo mfano wake haujapata kuwako tangu mwanzo wa uumbaji ambao Mungu aliuumba mpaka sasa, wala hautakuwako kamwe.”
    reason: Njia nyingine ya kuwasilisha muundo wa ulinganisho οἵα οὐ γέγονεν τοιαύτη kwa Kiswahili.
lexical_decisions:
- source_word: θλῖψις
  choice: dhiki
  rationale: “Dhiki” ni neno la kawaida na lenye uzito katika Kiswahili cha Biblia; linaonyesha mateso na shida kali bila kulazimisha mfumo fulani wa matukio ya mwisho.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ya namna ambayo haijapata kuwako
  rationale: Muundo huu unahifadhi ulinganisho na msisitizo wa Kigiriki kwamba dhiki hiyo haina mfano katika historia iliyotajwa.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: tangu mwanzo wa uumbaji
  rationale: Tafsiri hii inaonyesha wazi mwanzo wa uumbaji na haipunguzi maana kuwa mwanzo wa eneo au kipindi maalumu tu.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: aliouumba Mungu
  rationale: Kirai hiki kinamhifadhi Mungu wazi kuwa mtendaji wa kuumba, huku marudio ya mzizi “uumbaji/umba” yakifuata msisitizo wa maandishi ya Kigiriki.
- source_word: ἕως τοῦ νῦν
  choice: mpaka sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha wakati kwa usahihi.
- source_word: οὐ μὴ γένηται
  choice: wala haitakuwako kamwe
  rationale: “Kamwe” pamoja na ukanushi wa wakati ujao unaonyesha nguvu ya οὐ μή bila kuongeza wazi neno “tena,” ambalo halipo katika Kigiriki.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: siku hizo zitakuwa dhiki
  rationale: Muundo huu unahifadhi predikati ya Kigiriki, ambapo siku hizo zenyewe zinaelezwa kuwa kipindi cha dhiki, badala ya kufafanua kwamba zitaileta tu.
theological_decisions:
- issue: Upeo wa lugha ya uumbaji
  choice: “tangu mwanzo wa uumbaji aliouumba Mungu”
  alternative: “tangu mwanzo wa ulimwengu”
  rationale: Kigiriki kinatumia κτίσις na κτίζω na kumtaja Mungu kuwa Muumba. Tafsiri inahifadhi lugha hiyo bila kuibana iwe rejeo la mahali fulani au mwanzo wa kiagano.
- issue: Nguvu ya ukanushi wa mwisho
  choice: “wala haitakuwako kamwe”
  alternative: “wala haitatokea tena kamwe”
  rationale: Chaguo kuu linahifadhi ukanushi mkali na mwelekeo wa wakati ujao bila kuongeza “tena”; pia linaendeleza kitenzi cha kuwako kilichotumika katika ulinganisho uliotangulia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhiki” linaeleweka kwa wasomaji wa kawaida na linafaa kwa uzito wa muktadha. Marudio “uumbaji aliouumba” yamehifadhiwa kwa makusudi kwa sababu yanaakisi marudio yenye msisitizo katika chanzo.
