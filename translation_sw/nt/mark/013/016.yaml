base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: sw
  text: Na yule aliye shambani asirudi nyuma kuchukua vazi lake la nje[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joho lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: yule aliye shambani
  rationale: Muundo wenye kibainishi unamtaja mtu kwa hali ya kuwa shambani. Kiswahili hiki ni cha kawaida na kinadumisha umoja bila kulazimisha jinsia.
- source_word: ἀγρός
  choice: shambani
  rationale: Neno hili hapa linamaanisha shamba au eneo la kilimo; 'shambani' linafaa katika onyo hili la kukimbia.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: asirudi nyuma
  rationale: Amri yenye μή ni katazo la dharura, na msemo huu wa Kiswahili unawasilisha kwa kawaida wazo la kutorudi kilicho nyuma.
- source_word: ἆραι
  choice: kuchukua
  rationale: Kitenzi-jina kinaonyesha kusudi la kurudi, yaani kwenda kulichukua vazi; 'kuchukua' ni pana na sahihi bila kuongeza kwamba lazima linyanyuliwe kutoka chini.
- source_word: ἱμάτιον
  choice: vazi lake la nje
  rationale: Neno hili kwa kawaida humaanisha vazi la nje. Tafsiri hii ni wazi kwa msomaji wa sasa na huepuka taswira finyu inayoweza kuletwa na 'joho'.
- source_word: αὐτοῦ
  choice: lake
  rationale: Kiwakilishi cha umoja kinarejelea mtu aliyetajwa; ngeli ya 'vazi' huhitaji 'lake' katika Kiswahili, bila kubainisha jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
theological_decisions:
- issue: Rejeo la umoja wa kiume linalotumika kwa ujumla
  choice: Kudumisha mtu mmoja kwa 'yule aliye ... vazi lake' bila kumfanya kuwa mwanaume kwa lazima
  alternative: Wale walio shambani wasirudi nyuma kuchukua mavazi yao
  rationale: Kigiriki kina umoja wa kisarufi, lakini Kiswahili hakibainishi jinsia katika 'yule' au kiwakilishi cha mtu hapa. Umoja wa chanzo unadumishwa bila kuingiza dai kwamba onyo linawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na ya moja kwa moja. 'Asirudi nyuma' hubeba uzito wa katazo, na 'vazi la nje' hufafanua ἱμάτιον kwa uwazi.
