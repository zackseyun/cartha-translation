  terminology: “Vazi la nje” ni tafsiri sahihi na yenye usahihi wa kutosha kwa ἱμάτιον. Tanbihi ya “joho lake” inatoa mbadala wa kileksia unaokubalika bila kubadilisha maana ya msingi. Kiwakilishi “lake” kinapatana kisarufi na “vazi” na huhifadhi urejeo wa umoja bila kuingiza jinsia ambayo Kiswahili hakiweki hapa.
