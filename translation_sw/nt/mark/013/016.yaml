  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo wa umoja wa Kigiriki: mtu aliye shambani anakatazwa kurudi ili kulichukua vazi lake. “Asirudi nyuma” huwasilisha vizuri μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω, na “kuchukua” huonyesha kusudi la ἆραι bila kuongeza maelezo yasiyomo katika chanzo.'
