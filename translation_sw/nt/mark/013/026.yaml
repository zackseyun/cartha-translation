base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: sw
  text: Ndipo watamwona Mwana wa Adamu akija katika mawingu pamoja na nguvu nyingi na utukufu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akija pamoja na mawingu.” Kigiriki kinasema “katika mawingu,” lakini tafsiri hii nyingine huonyesha mwangwi unaowezekana wa Danieli 7:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: watamwona
  rationale: Kitenzi hiki cha wakati ujao kina maana ya moja kwa moja ya kuona; “watamwona” ni Kiswahili cha kawaida na kinadumisha hali ya tukio kuonekana wazi.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Biblia za Kiswahili, na linahifadhi mwangwi wa Danieli 7 pamoja na uzito wake wa kimasiya bila kuufafanua kupita maandishi.
- source_word: ἐρχόμενον
  choice: akija
  rationale: Huhifadhi maana ya tendo linaloelezwa na participio ya sasa na ni usemi wa kawaida zaidi kuliko “akiwasili” katika picha hii ya kiapokaliptiki.
- source_word: ἐν νεφέλαις
  choice: katika mawingu
  rationale: “Katika” huakisi maana ya msingi ya ἐν, na “mawingu” huhifadhi wingi usio na kibainishi katika Kigiriki. Kiswahili hakihitaji kibainishi sawa na Kiingereza, hivyo usemi huu ni wa asili na wa karibu na chanzo.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: kwa nguvu nyingi
  rationale: μετά pamoja na hali ya genitivi huonyesha kuandamana; katika Kiswahili, “kwa nguvu nyingi” huwasilisha kwa kawaida ukubwa wa nguvu unaokusudiwa.
- source_word: καὶ δόξης
  choice: na utukufu
  rationale: “Utukufu” ni neno la kawaida la kibiblia kwa δόξα katika muktadha wa enzi kuu inayodhihirishwa, na huhifadhi miunganiko ya kimaandiko.
theological_decisions:
- issue: Cheo na taswira ya kiapokaliptiki
  choice: Kuhifadhi “Mwana wa Adamu” na taswira ya kuja katika mawingu bila maelezo ya ziada katika andiko kuu.
  alternative: Kutafsiri kwa namna ya ufafanuzi kama “Mwanadamu” au kueleza wazi kuwa hii ni dokezo la Danieli 7:13.
  rationale: Aya inadokeza kwa nguvu Danieli 7:13, lakini tafsiri inapaswa kulihifadhi dokezo hilo badala ya kulifafanua ndani ya andiko. Cheo kilichozoeleka pia huhifadhi mvutano wa kikristolojia na kieskatolojia wa Kigiriki.
- issue: Maana ya ἐν νεφέλαις
  choice: “katika mawingu” katika andiko kuu, huku uwezekano wa “pamoja na mawingu” ukitajwa katika tanbihi.
  alternative: “pamoja na mawingu”
  rationale: “Katika” ndiyo maana ya moja kwa moja ya ἐν, lakini “pamoja na mawingu” huonyesha vyema zaidi mwangwi unaowezekana wa Danieli 7:13; tanbihi huhifadhi uwezekano huo bila kubadili andiko kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa asili, huku istilahi za kibiblia “Mwana wa Adamu” na “utukufu” zikihifadhiwa kwa sababu ya uzito wake wa kimaandiko.
