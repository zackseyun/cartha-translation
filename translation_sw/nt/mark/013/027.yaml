  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: sw
  text: Ndipo atawatuma malaika na kuwakusanya wale waliochaguliwa kutoka pepo nne[b], kutoka mwisho wa dunia hadi mwisho wa mbingu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Kutoka pepo nne” ni nahau inayomaanisha kutoka kila upande.
    reason: cultural_note
  - marker: c
    text: 'Kirai cha mwisho kinaweza pia kutafsiriwa kwa ufafanuzi zaidi: “kutoka ncha ya mbali kabisa ya dunia hadi ncha ya mbali kabisa ya mbingu,” au “kutoka upande mmoja wa mbingu hadi mwingine.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: ndipo
  rationale: Huonyesha hatua inayofuata katika mfululizo wa matukio; “ndipo” ni ya asili na yenye uzito unaofaa katika Kiswahili.
- source_word: ἀποστελεῖ
  choice: atawatuma
  rationale: Ni kitenzi cha wakati ujao chenye wazo la kuwatuma wajumbe kutekeleza kazi; kiambishi cha yambwa kinawarejelea malaika.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika muktadha huu wa matukio ya mwisho, neno linamaanisha viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἐπισυνάξει
  choice: watawakusanya
  rationale: Kiswahili hutumia wingi kwa kawaida kwa sababu malaika waliotumwa ndio wanaotekeleza tendo la kukusanya, ingawa kitenzi cha Kigiriki kwa sarufi kina mhusika yuleyule wa umoja; maana ya kwamba yeye ndiye anayeagiza na kutenda kupitia kwao inabaki.
- source_word: ἐκλεκτούς
  choice: wale waliochaguliwa
  rationale: Huwasilisha maana ya watu waliochaguliwa bila kutumia istilahi nzito ya kimafundisho; Kigiriki hakitaji wazi mwenye kuwachagua.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: kutoka pepo nne
  rationale: Huhifadhi taswira ya Kigiriki na nahau ya kibiblia inayomaanisha kutoka kila upande.
- source_word: ἀπ’ ἄκρου γῆς
  choice: kutoka mwisho wa dunia
  rationale: Huhifadhi taswira ya ukingo au ncha ya mbali ya dunia bila kuiongeza kwa ufafanuzi ndani ya matini.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: hadi mwisho wa mbingu
  rationale: Huhifadhi ulinganifu wa kirai cha Kigiriki na upeo wake wa anga; “mbingu” pia hudumisha uwezekano wa maana ya anga bila kuifanya kauli kuwa maelezo ya kimafundisho kuhusu makao ya Mungu.
- source_word: καὶ τότε ... καὶ
  choice: Ndipo ... nao
  rationale: Muundo huu wa Kiswahili unaendeleza mtiririko na kuunganisha kutumwa kwa malaika na tendo lao la kukusanya kwa njia ya asili.
theological_decisions:
- issue: Maana ya ἐκλεκτούς katika muktadha wa matukio ya mwisho
  choice: wale waliochaguliwa
  alternative: wateule
  rationale: “Wale waliochaguliwa” ni wazi kwa msomaji wa kawaida na huhifadhi wazo la kuchaguliwa bila kulifanya neno kuwa istilahi ya mfumo fulani wa baadaye wa mafundisho.
- issue: Mhusika wa tendo la kukusanya
  choice: nao watawakusanya
  alternative: naye atawakusanya
  rationale: Kigiriki huendeleza mhusika wa umoja—Mwana wa Adamu—lakini kwa maana malaika waliotumwa ndio mawakala wa kukusanya. Kiswahili cha asili kinaweza kuwataja wao kama watekelezaji bila kukanusha kwamba tendo linafanywa kwa mamlaka yake.
- issue: Upeo wa taswira ya kukusanywa
  choice: kutoka pepo nne, kutoka mwisho wa dunia hadi mwisho wa mbingu
  alternative: kutoka kila upande, kutoka upande mmoja wa mbingu hadi mwingine
  rationale: 'Tafsiri iliyochaguliwa huhifadhi taswira mbili tofauti za chanzo: pepo nne na msemo wa upeo wote. Haizipunguzi kuwa ufafanuzi mmoja ulio rahisi zaidi lakini usiofuata maneno ya chanzo kwa karibu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wale waliochaguliwa” limetumiwa badala ya “wateule,” hivyo tanbihi ya mbadala wa kileksika si ya lazima. Alama zote za tanbihi zilizotolewa katika rasimu hii zinaonekana katika matini kuu.
