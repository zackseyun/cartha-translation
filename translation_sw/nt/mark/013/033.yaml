  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: sw
  text: Jihadharini; kaeni macho, kwa maana hamjui wakati[a] ni lini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati uliowekwa” au “majira.” Neno la Kigiriki καιρός mara nyingi humaanisha wakati muhimu au uliowekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Jihadharini
  rationale: Amri ya wingi imetumiwa kama onyo la kuwa waangalifu, si kuona kwa macho tu. ‘Jihadharini’ ni Kiswahili cha kawaida na kinaitofautisha na amri inayofuata.
- source_word: ἀγρυπνεῖτε
  choice: kaeni macho
  rationale: Amri hii humaanisha kuendelea kuwa macho au kuwa tayari. ‘Kaeni macho’ huhifadhi picha ya kutolala na pia maana ya kuwa waangalifu.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Hii ni kauli ya moja kwa moja ya kutokujua, bila kuongeza wazo lisilokuwamo katika Kigiriki.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaonyesha sababu ya amri zilizotangulia kwa namna ya kawaida na yenye heshima katika Kiswahili.
- source_word: πότε
  choice: ni lini
  rationale: Huuliza wakati; muundo ‘wakati ni lini’ ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ὁ καιρός
  choice: wakati
  rationale: καιρός inaweza kumaanisha wakati maalumu au wenye uamuzi. ‘Wakati’ huhifadhi upana wa neno bila kulifafanua kupita kiasi katika matini kuu.
- source_word: ἐστιν
  choice: ni
  rationale: Kitenzi kishirikishi kimewakilishwa moja kwa moja katika muundo wa Kiswahili ‘wakati ni lini.’
theological_decisions:
- issue: Maana ya καιρός katika muktadha wa mambo ya mwisho
  choice: wakati
  alternative: wakati uliowekwa; majira
  rationale: Katika hotuba hii, καιρός inaweza kudokeza wakati maalumu au uliowekwa. Matini kuu inatumia ‘wakati’ ili kutobana maana zaidi ya Kigiriki, huku tanbihi ikitaja uwezekano huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye heshima. Amri mbili tofauti zimehifadhiwa: ‘Jihadharini’ kwa onyo la tahadhari na ‘kaeni macho’ kwa picha ya kukesha au kuendelea kuwa tayari.'
