  text: asije akaja ghafula na kuwakuta mmelala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: asije
  rationale: Katika muktadha huu linaonyesha tahadhari kuhusu jambo linaloweza kutokea; muundo wa Kiswahili wa ‘asije’ ni wa kawaida na unasawiri kusudi la tahadhari.
- source_word: ἐλθὼν ἐξαίφνης
  choice: akaja ghafula
  rationale: Kirai kishirikishi kinaeleza kuja kwake kwa kushtukiza; ‘akaja ghafula’ ni Kiswahili cha asili kinachohifadhi uhusiano huo bila kuifanya kuwa sentensi huru.
- source_word: εὕρῃ ὑμᾶς
  choice: kuwakuta
  rationale: ‘Kuwakuta’ huwasilisha maana ya kuwapata watu wakiwa katika hali fulani na hudumisha wingi wa ὑμᾶς.
- source_word: καθεύδοντας
  choice: mmelala
  rationale: Kishirikishi hiki kinaonyesha hali ambamo angewaona; ‘mmelala’ ni usemi wa kawaida na wa moja kwa moja.
theological_decisions:
- issue: Ikiwa kulala ni halisi au ni sitiari ya kutokuwa macho kiroho
  choice: mmelala
  alternative: hamko macho kiroho
  rationale: Chanzo kinatumia neno la kawaida la kulala, huku muktadha ukiruhusu maana pana ya sitiari. Tafsiri haifafanui sitiari kwa namna inayofunga utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘asije akaja ghafula’ ni wa kawaida katika onyo na huhifadhi msisitizo wa kuja kusikotarajiwa.
