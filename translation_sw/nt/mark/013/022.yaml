  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: sw
  text: Kwa maana watatokea masihi wa uongo na manabii wa uongo, nao watafanya ishara na maajabu ili kuwapotosha, ikiwezekana,[a] waliochaguliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama ingewezekana.” Maneno ya Kigiriki hayasemi wazi kama waliochaguliwa wanaweza kwa hakika kupotoshwa; yanaeleza kusudi la wadanganyifu kwa sharti hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: watatokea
  rationale: Katika muktadha huu kitenzi kinaeleza kujitokeza kwa watu hao. “Watatokea” ni Kiswahili cha kawaida na hakidokezi bila sababu kwamba Mungu ndiye anayewainua.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa onyo hili linaeleza au kuthibitisha onyo lililotangulia.
- source_word: ψευδόχριστοι
  choice: masihi wa uongo
  rationale: Neno changamano linamtaja mtu anayejidai kuwa Masihi. “Masihi wa uongo” linaweka wazi maana ya cheo Χριστός katika muktadha huu.
- source_word: ψευδοπροφῆται
  choice: manabii wa uongo
  rationale: Hii ni tafsiri ya kawaida, wazi, na sahihi ya neno hilo changamano.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: watafanya ishara na maajabu
  rationale: Ingawa δώσουσιν ni “watatoa” kwa umbo la moja kwa moja, katika Kiswahili “watafanya ishara na maajabu” huwasilisha kwa kawaida tendo la kuonyesha matukio hayo ya ajabu bila kuongeza neno “kimiujiza.”
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: ili kuwapotosha
  rationale: Muundo huu unaonyesha kusudi. “Kupotosha” huhifadhi wazo la kuwaongoza watu waache njia ya kweli.
- source_word: εἰ δυνατόν
  choice: ikiwezekana
  rationale: Tafsiri hii ya moja kwa moja huhifadhi hali ya sharti bila kuamua kama kuwapotosha waliochaguliwa kunawezekana kwa hakika au la.
- source_word: τοὺς ἐκλεκτούς
  choice: waliochaguliwa
  rationale: Hili ni neno la kawaida na linaloeleweka katika Kiswahili, huku likihifadhi maana ya watu waliochaguliwa bila kuingiza msimamo maalumu wa kimadhehebu.
theological_decisions:
- issue: Maana ya ψευδόχριστοι kama cheo kinachohusiana na Χριστός
  choice: masihi wa uongo
  alternative: makristo wa uongo
  rationale: Katika neno hili Χριστός linafanya kazi kama cheo, yaani Masihi, si kama jina la kawaida. “Masihi wa uongo” huepuka mkanganyiko na Wakristo wa uongo.
- issue: Je, εἰ δυνατόν huamua kama waliochaguliwa wanaweza kupotoshwa?
  choice: ikiwezekana
  alternative: kama ingewezekana
  rationale: Kigiriki kinaweka sharti bila kueleza wazi kama jambo hilo haliwezekani. Tafsiri iliyochaguliwa inalinda utata na mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “kuwapotosha, ikiwezekana, waliochaguliwa” umehifadhi ukaribu wa εἰ δυνατόν na kishazi cha kusudi huku alama za koma zikisaidia usomaji.
