  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: sw
  text: Lakini ole kwa walio wajawazito na wanaonyonyesha katika siku hizo!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ole wao
  rationale: Kauli hii ya Kiswahili huhifadhi nguvu ya kinabii ya maombolezo na onyo kuhusu dhiki inayokuja.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye tofauti kiasi kutoka onyo lililotangulia bila kufanya tofauti hiyo kuwa kali kupita kiasi.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: walio wajawazito
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya nahau inayomaanisha kuwa na mimba; umbo la ngeli ya watu hudumisha rejeo la wanawake bila kuongeza neno lisilohitajika.
- source_word: θηλαζούσαις
  choice: wanaonyonyesha
  rationale: Kitenzi hiki cha kawaida kinaeleza kuwanyonyesha watoto; yambwa linaeleweka kutokana na maana ya kitenzi na muktadha, kama ilivyo katika Kigiriki.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku hizo
  rationale: Ni kauli ya wakati iliyo ya moja kwa moja na inayohifadhi uhusiano na matukio yaliyotajwa katika muktadha.
theological_decisions:
- issue: Nguvu ya οὐαί kama maombolezo na onyo
  choice: ole wao
  alternative: maskini wao
  rationale: “Ole wao” hudumisha kwa pamoja maombolezo na tangazo zito la dhiki; “maskini wao” lingeweza kusikika zaidi kama huruma tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na nzito kama chanzo; alama ya mshangao inaonyesha nguvu ya οὐαί. Vielezi vya Kiingereza vilivyopendekezwa havikuhitaji tanbihi katika Kiswahili kwa kuwa “walio wajawazito” na “wanaonyonyesha” ni kauli za kawaida zisizo na utata muhimu.
