translation:
  language: sw
  text: Lakini ombeni jambo hilo lisitokee wakati wa baridi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza wazi zaidi kwa kuzingatia muktadha, “kukimbia kwenu kusiwe wakati wa baridi.” Kigiriki cha Marko hapa hakitaji wazi jambo linalorejelewa, tofauti na kifungu sambamba katika Mathayo 24:20.
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ombeni
  rationale: Ni agizo la nafsi ya pili wingi. “Ombeni” ni Kiswahili cha kawaida na huonyesha wazi wingi bila kulazimisha maana ya kuendelea ambayo njeo ya sasa inaweza kudokeza lakini haihitaji kutajwa hapa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki huleta mpito wenye tofauti ndogo na onyo lililotangulia; “Lakini” kinahifadhi mwelekeo huo kwa njia ya kawaida.
- source_word: ἵνα μὴ
  choice: lisitokee
  rationale: 'Baada ya “ombeni,” muundo wa Kiswahili wenye hali tegemezi na ukanushi unaeleza kwa kawaida maudhui ya ombi: jambo hilo lisitokee.'
- source_word: γένηται
  choice: lisitokee
  rationale: Kitenzi hiki kinarejelea kwa udokezi tukio au hali iliyotajwa katika muktadha. “Lisitokee” ni cha kawaida na kinahifadhi usemi wa Marko usiotaja wazi jambo lenyewe.
- source_word: χειμῶνος
  choice: wakati wa majira ya baridi
  rationale: Ni matumizi ya umilikishi yanayoonyesha wakati au majira. “Wakati wa majira ya baridi” ni usemi wazi na wa kawaida katika Kiswahili sanifu cha Afrika Mashariki.
theological_decisions:
- issue: Kirejelewa kisichotajwa wazi cha γένηται
  choice: Kutumia “lisitokee” bila kuongeza “kukimbia kwenu,” hivyo kuhifadhi udokezi wa Kigiriki wa Marko.
  alternative: “kukimbia kwenu kusitokee wakati wa majira ya baridi”
  rationale: Kigiriki cha Marko hakitaji wazi “kukimbia kwenu,” tofauti na Mathayo 24:20. Tafsiri kuu haipaswi kuingiza maneno kutoka kifungu sambamba; tanbihi inaweza kufafanua maana inayowezekana kutokana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi kama Kigiriki, huku tanbihi ikifafanua udokezi bila kuuingiza katika matini kuu.
