  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: sw
  text: Alipokuwa ameketi juu ya Mlima wa Mizeituni, mkabala na Hekalu[a], Petro, Yakobo, Yohana na Andrea walikuwa wakimwuliza faraghani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la Hekalu pamoja na nyua zake, si patakatifu pa ndani pekee (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Alipokuwa ameketi
  rationale: Muundo huu wa Kiswahili unaonyesha tendo la kimazingira lililokuwa likiendelea, kama inavyodokezwa na kishiriki cha wakati uliopo katika muundo wa genitivi huru.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: juu ya Mlima wa Mizeituni
  rationale: Ingawa εἰς kwa kawaida huonyesha mwendo kuelekea mahali, hapa pamoja na hali ya kuketi inaonyesha mahali alikokuwa; ‘Mlima wa Mizeituni’ ni jina la kawaida la eneo hili kwa Kiswahili.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: mkabala na Hekalu[a]
  rationale: κατέναντι humaanisha kuwa upande unaokabiliana na kitu. ‘Hekalu’ ni tafsiri ya kawaida na wazi, huku tanbihi ikifafanua kwamba ἱερόν ni eneo lote la Hekalu, si patakatifu pa ndani pekee.
- source_word: ἐπηρώτα
  choice: walikuwa wakimwuliza
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililokuwa likiendelea. Muundo ‘walikuwa wakimwuliza’ unahifadhi hali hiyo badala ya kulionyesha tu kama tukio la mara moja.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Neno hili linaeleza kwamba walimwuliza wakiwa kando na wengine; ‘faraghani’ ni fupi, ya kawaida na yenye heshima.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Petro, Yakobo, Yohana na Andrea
  rationale: Majina yametolewa katika maumbo yaliyozoeleka katika Kiswahili. Orodha yenye koma na kiunganishi kabla ya jina la mwisho ni ya asili zaidi katika Kiswahili kuliko kurudia ‘na’ kabla ya kila jina.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. ‘Walikuwa wakimwuliza’ huhifadhi hali ya tendo linaloendelea, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
