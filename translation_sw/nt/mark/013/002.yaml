base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: sw
  text: Yesu akamwambia, “Unayaona majengo haya makubwa[a]? Hapa hakuna jiwe litakaloachwa juu ya jiwe lingine[b]; kila jiwe litabomolewa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majengo haya makubwa ya hekalu.” Muktadha unahusu eneo la hekalu, ingawa Kigiriki kinasema tu “majengo.”
    reason: lexical_alternative
  - marker: b
    text: Msemo “jiwe juu ya jiwe” unaonyesha uharibifu kamili.
    reason: cultural_note
  - marker: c
    text: Au, “kuharibiwa” au “kuangushwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Unayaona
  rationale: Kitenzi cha wakati wa sasa kimetumiwa kama swali la moja kwa moja. “Unayaona” ni Kiswahili cha kawaida na kinahifadhi nguvu ya swali bila kuligeuza kuwa amri ya kutazama.
- source_word: μεγάλας οἰκοδομάς
  choice: majengo haya makubwa
  rationale: “Majengo” linatafsiri οἰκοδομάς bila kuongeza wazi neno “hekalu,” ingawa muktadha unaonyesha kuwa ni majengo ya eneo la hekalu. “Makubwa” linaweza kumaanisha ukubwa wa kimwili na pia fahari yake.
- source_word: οὐ μὴ ἀφεθῇ
  choice: Hakuna hata jiwe moja litakaloachwa
  rationale: Muundo wa Kigiriki una ukanushi wa wakati ujao wenye mkazo. “Hakuna hata jiwe moja” unaonyesha mkazo huo kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: ὧδε
  choice: hapa
  rationale: Kielezi hiki cha mahali kinarejelea moja kwa moja eneo walilokuwa wakilitazama.
- source_word: λίθος ἐπὶ λίθον
  choice: jiwe moja ... juu ya jingine
  rationale: Tafsiri hii inahifadhi taswira halisi ya msemo wa Kigiriki huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: καταλυθῇ
  choice: kubomolewa
  rationale: Katika muktadha wa majengo, kitenzi hiki humaanisha kuvunja au kuangusha jengo. “Kubomolewa” ni neno la kawaida na mahususi kwa uharibifu wa miundo.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Yesu akamwambia
  rationale: Muundo wa masimulizi wa Kiswahili wenye “aka-” unaendeleza tukio kwa kawaida na kuwasilisha kwamba Yesu alisema maneno haya kwake bila kuongeza wazo la kujibu ambalo halijaelezwa wazi.
theological_decisions:
- issue: Upeo wa utabiri wa Yesu kuhusu majengo ya hekalu
  choice: Neno οἰκοδομάς limetafsiriwa kwa ujumla kuwa “majengo” katika andiko kuu.
  alternative: “majengo haya makubwa ya hekalu”
  rationale: Muktadha unaonyesha wazi kuwa yanayozungumziwa ni majengo ya eneo la hekalu, lakini Kigiriki chenyewe kinasema “majengo.” Tafsiri ya jumla inaepuka kuongeza jina lisilokuwapo katika mstari huku tanbihi ikifafanua rejeo la kimuktadha.
- issue: Ukamilifu wa uharibifu uliotabiriwa
  choice: Muundo “Hakuna hata jiwe moja ... bila kubomolewa” umehifadhiwa kama tamko lenye mkazo la uharibifu kamili.
  alternative: Kutafsiri kwa ufafanuzi tu kuwa “majengo yote yataharibiwa kabisa”
  rationale: Taswira ya jiwe juu ya jiwe ni sehemu muhimu ya kauli ya Yesu. Kuihifadhi hutoa uzito wa utabiri bila kuamua zaidi ya lugha yenyewe namna ya kihistoria au kiteolojia ambayo utabiri huo unatimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa swali ni wa moja kwa moja, na ukanushi “Hakuna hata jiwe moja” unahifadhi mkazo wa Kigiriki bila kutumia lugha ya kizamani. Tanbihi zote zimewekwa katika andiko kuu kwa mpangilio [a], [b], [c].
