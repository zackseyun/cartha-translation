id: MRK.13.21
reference: Mark 13:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: sw
  text: Na wakati huo, mtu yeyote akiwaambia, “Tazama, Masihi[a] yuko hapa!” au, “Tazama, yuko kule!” msiamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τότε
  choice: Na wakati huo
  rationale: Huhifadhi kiunganishi καί na maana ya wakati ya τότε, huku ikiunganisha onyo hili kwa kawaida na maelezo yaliyotangulia.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: mtu yeyote akiwaambia
  rationale: Muundo huu unaonyesha sharti la jumla; “mtu yeyote” huwakilisha τις, na “akiwaambia” huonyesha kuwa ὑμῖν ni wingi.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuvuta uangalifu ulio wazi, wenye nguvu na unaofaa kwa lugha ya Biblia ya sasa.
- source_word: ὧδε
  choice: hapa
  rationale: Hutoa maana ya moja kwa moja ya kielezi cha mahali pa karibu.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Katika muktadha huu χριστός ni cheo cha mtiwa-mafuta anayetarajiwa, si jina tu; “Masihi” huhifadhi maana hiyo ya cheo.
- source_word: ἐκεῖ
  choice: kule
  rationale: “Kule” huonyesha mahali pa mbali na kudumisha utofauti wa hapa/kule uliomo katika ὧδε/ἐκεῖ.
- source_word: μὴ πιστεύετε
  choice: msiamini
  rationale: Kigiriki hakitaji wazi kitu au mtu anayeaminiwa. Tafsiri hii huhifadhi hali hiyo badala ya kuamua kimya kimya kuwa ni madai au msemaji.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo katika madai ya nyakati za mwisho. “Masihi” hudumisha dhana ya mtiwa-mafuta anayetarajiwa, huku tafsiri ya kimapokeo “Kristo” ikihifadhiwa katika tanbihi.
- issue: Kitu cha kitenzi πιστεύετε
  choice: msiamini (bila kutaja kitu)
  alternative: msiyaamini maneno hayo / msimwamini
  rationale: Kigiriki kinaacha kitu cha kuamini bila kutajwa; tafsiri bila yambwa huhifadhi uwezekano wa kurejelea madai, msemaji, au ujumbe kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” hudumisha nguvu ya mwito bila kutumia lugha ngumu; “akiwaambia” na “msiamini” zinaonyesha kuwa Yesu anazungumza na watu wengi.
