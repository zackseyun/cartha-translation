  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: sw
  text: Aliye juu ya paa[a] asishuke wala asiingie nyumbani kuchukua kitu chochote kutoka nyumbani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, paa tambarare la nyumba, ambalo mara nyingi lilikuwa mahali pa kukaa au kufanyia shughuli.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Aliye juu ya paa
  rationale: Kirai chenye kibainishi kinamtaja mtu aliye mahali hapo. Kiswahili hiki ni cha kawaida na kinadumisha picha ya mtu aliye juu ya paa tambarare la nyumba.
- source_word: μὴ καταβάτω
  choice: asishuke
  rationale: Kauli ya kuamuru ya nafsi ya tatu yenye katazo inawasilishwa kwa kawaida kwa hali ya utegemezi ya kukataza; kitenzi hiki kinaonyesha mwendo kutoka juu kwenda chini bila kuongeza maelezo yasiyo katika matini.
- source_word: μηδὲ εἰσελθάτω
  choice: wala asiingie ndani
  rationale: “Wala” linaunganisha katazo la pili, na “ndani” linaweka wazi kwa Kiswahili cha kawaida kwamba ni kuingia nyumbani kunakokusudiwa.
- source_word: τι ἆραι
  choice: kuchukua kitu chochote
  rationale: Kitenzi-jina kinaonyesha kusudi la kuingia, na “kitu chochote” kinaakisi upana wa kiwakilishi kisichobainisha katika katazo hili la haraka.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: kutoka nyumbani mwake
  rationale: “Kutoka” linaonyesha kuondoa kitu ndani ya nyumba, huku “nyumbani mwake” kikidumisha umoja na umilikaji wa kirai cha Kigiriki kwa Kiswahili cha asili.
theological_decisions:
- issue: Umoja wa kiume wenye maana ya jumla katika agizo
  choice: nyumbani mwake
  alternative: nyumbani mwao; kutoka ndani ya nyumba
  rationale: Kigiriki kina umoja wa kiume unaotumika kwa maana ya jumla. Kiswahili “-ake” kinadumisha umoja huo bila kulazimisha jinsia ya kisarufi isiyo ya kawaida katika lugha lengwa.
translation_notes:
  register: Lugha ni ya sasa, yenye staha na inayoeleweka kote Afrika Mashariki. “Paa” ndilo neno la kawaida; tanbihi inaeleza muundo na matumizi ya paa katika mazingira ya wakati huo.
