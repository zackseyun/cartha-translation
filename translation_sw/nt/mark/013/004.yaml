  text: “Tuambie, mambo haya yatatokea lini, na ni ishara gani wakati mambo haya yote yatakapokaribia kukamilishwa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati mambo haya yote yatakapokamilishwa.” Kigiriki kinatumia μέλλῃ pamoja na infinitivu, muundo ambao unaweza kumaanisha kwa usahihi zaidi, “yanakaribia kukamilishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Tuambie
  rationale: Kauli ya kuamuru ya aoristi pamoja na kiwakilishi cha yambwa isiyo ya moja kwa moja inatafsiriwa kwa ombi la moja kwa moja na la kawaida kwa Kiswahili.
- source_word: πότε ταῦτα ἔσται
  choice: mambo haya yatatokea lini
  rationale: Ingawa ἔσται kimsingi ni ‘yatakuwa,’ katika swali kuhusu matukio Kiswahili cha kawaida hutumia ‘yatatokea’ bila kubadili maana ya wakati ujao.
- source_word: σημεῖον
  choice: ishara
  rationale: ‘Ishara’ ni neno la kawaida na linalofaa katika muktadha wa dalili ya matukio yajayo.
- source_word: μέλλῃ
  choice: yatakapokuwa karibu
  rationale: Muundo huu unahifadhi wazo la jambo linalokaribia kutokea, badala ya kuufanya kuwa wakati ujao wa kawaida tu.
- source_word: συντελεῖσθαι
  choice: kukamilishwa
  rationale: Huhifadhi hali ya kutendwa na wazo la mambo kufikishwa kwenye ukamilifu au mwisho wake.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Huhifadhi wingi wa kiwakilishi na msisitizo wa πάντα, ‘yote.’
theological_decisions:
- issue: Nguvu ya kieskatolojia ya μέλλῃ pamoja na kitenzi-jina
  choice: wakati mambo haya yote yatakapokuwa karibu kukamilishwa
  alternative: wakati mambo haya yote yatakapokamilishwa
  rationale: Tafsiri kuu inadumisha maana ya kutarajiwa au kukaribia iliyomo katika μέλλω, bila kuamua mfumo maalumu wa mafundisho kuhusu ratiba ya matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa maswali mawili na hali ya kutendwa katika kifungu cha mwisho zimehifadhiwa.
