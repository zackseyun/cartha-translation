  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: sw
  text: Lakini kuhusu siku ile au saa ile, hakuna mtu anayejua—hata malaika walio mbinguni, wala Mwana[a], ila Baba pekee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wafasiri huelewa maneno “wala Mwana” kuwa yanarejelea utume wa Mwana katika umwilisho wake au hali yake ya kibinadamu; tafsiri hii inadumisha maneno ya maandishi ya Kigiriki bila kuongeza ufafanuzi huo katika andiko kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Lakini kuhusu
  rationale: περί pamoja na genitive huanzisha mada, ‘kuhusu,’ na δέ huonyesha mpito wenye utofautishaji mdogo. ‘Lakini kuhusu’ huhifadhi kazi zote mbili kwa Kiswahili cha kawaida.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: siku ile au saa ile
  rationale: Kirai hiki kinataja nyakati mbili tofauti, siku na saa. Kurudia ‘ile’ kunasikika wazi na kwa kawaida katika Kiswahili huku kukihifadhi uhusiano wa kila nomino na wakati unaozungumziwa.
- source_word: οὐδεὶς οἶδεν
  choice: hakuna mtu anayejua
  rationale: οὐδείς ni kiwakilishi hasi kisicho maalumu, na οἶδα, ingawa kimuundo ni perfect, hapa ina maana ya wakati uliopo, ‘kujua.’
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: hata malaika walio mbinguni
  rationale: οὐδέ inaendeleza na kusisitiza ukanushaji, hivyo ‘hata’ huleta nguvu ya ‘not even.’ ἐν οὐρανῷ imechukuliwa kama maelezo ya mahali walipo malaika.
- source_word: οὐδὲ ὁ υἱός
  choice: wala Mwana
  rationale: οὐδέ ya pili inaendeleza orodha iliyokanushwa. ‘Wala Mwana’ huhifadhi usemi wa moja kwa moja na cheo cha kikristolojia bila kuongeza ufafanuzi.
- source_word: εἰ μὴ ὁ πατήρ
  choice: ila Baba peke yake
  rationale: Baada ya ukanushaji, εἰ μή huonyesha isipokuwa mmoja tu. ‘Ila Baba peke yake’ huwasilisha upekee huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kauli ya kikristolojia kwamba Mwana hajui siku au saa
  choice: Kuhifadhi maneno ya moja kwa moja ‘wala Mwana’ bila kuyapunguza makali au kuyaongezea ufafanuzi katika andiko kuu.
  alternative: Kuongeza maneno kama ‘kwa upande wa ubinadamu wake’ au ‘katika huduma yake ya kufanyika mwanadamu’ katika andiko kuu.
  rationale: Maandishi ya Kigiriki yanasema wazi οὐδὲ ὁ υἱός. Tafsiri inadumisha mvutano wa kiteolojia wa chanzo badala ya kuutatua kwa kuingiza fasiri katika mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya sentensi nzima kwa kuwa tanbihi inafafanua kirai ‘wala Mwana.’
