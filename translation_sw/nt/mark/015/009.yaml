  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: sw
  text: Lakini Pilato akawajibu, akisema, “Je, mnataka niwaachilie Mfalme wa Wayahudi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Watu wa Yudea.” Neno la Kigiriki Ἰουδαίων linaweza kumaanisha “Wayahudi” au “Watu wa Yudea”; lakini katika cheo hiki kilichozoeleka katika simulizi la mateso, “Wayahudi” ndiyo tafsiri ya kawaida na inayofaa muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti nyepesi na mwendelezo wa simulizi Pilato anapowajibu watu.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: akawajibu, akisema
  rationale: Inahifadhi maana ya kujibu pamoja na muundo wa kishiriki λέγων kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Θέλετε
  choice: Je, mnataka
  rationale: Hueleza wazi hamu au nia ya wasikilizaji katika swali la moja kwa moja.
- source_word: ἀπολύσω ὑμῖν
  choice: niwaachilie
  rationale: Katika muktadha wa kimahakama, ἀπολύω ni kumwachilia mfungwa; kiambishi -wa- kinawaonyesha walengwa wa tendo hilo.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Ni jina la kisiasa lililozoeleka katika simulizi la mateso; “Wayahudi” linafaa hapa kuliko “Watu wa Yudea,” huku herufi kubwa ikionyesha matumizi yake kama cheo.
theological_decisions:
- issue: Tafsiri ya cheo τὸν βασιλέα τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  alternative: mfalme wa Watu wa Yudea
  rationale: Maneno haya ni cheo cha kisiasa chenye mvutano wa kejeli katika simulizi, si uthibitisho wa kitheolojia ulioongezwa na mtafsiri. Tafsiri ya kawaida “Wayahudi” inafaa katika cheo hiki, huku uwezekano wa kijiografia ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Muundo “akawajibu, akisema” umehifadhi mtiririko wa simulizi la Kigiriki bila kuwa mgumu kueleweka.
