  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: sw
  text: Watu waliokuwa wakipita walikuwa wakimtukana, wakitikisa vichwa vyao na kusema, “Aha! Wewe unayebomoa Hekalu[a] na kulijenga kwa siku tatu[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana mahsusi zaidi, “mahali patakatifu pa Hekalu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kulijenga upya kwa siku tatu.” Kitenzi cha Kigiriki chenyewe ni “kujenga,” ingawa muktadha unaweza kudokeza kujenga upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: watu waliokuwa wakipita
  rationale: Huwataja watu waliokuwa wakipita mahali hapo na kudumisha hali ya tendo lililokuwa likiendelea.
- source_word: ἐβλασφήμουν
  choice: walikuwa wakimtukana
  rationale: Katika muktadha huu kitenzi kinaonyesha maneno ya dharau na matusi dhidi ya Yesu; 'kumtukana' ni wazi bila kulazimisha maana finyu ya kukufuru.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: wakitikisa vichwa vyao
  rationale: Ni usemi wa kitendo kinachoonyesha dharau na kejeli, na tafsiri hii ni ya kawaida katika Kiswahili cha sasa.
- source_word: Οὐὰ
  choice: Aha!
  rationale: Nidaa hii inawasilisha kejeli ya wapita-njia, si maombolezo.
- source_word: ὁ καταλύων
  choice: Wewe unayetaka kulibomoa
  rationale: Muundo wa kishiriki unafanya kazi kama kumwita mtu moja kwa moja; 'unayetaka' huhifadhi hali ya dai au shtaka la wadhihaki bila kulithibitisha kuwa tendo halisi.
- source_word: ναὸν
  choice: Hekalu
  rationale: Hili ndilo neno la kawaida na linaloeleweka, huku tanbihi ikihifadhi maana mahsusi zaidi ya sehemu takatifu ya Hekalu.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: kulijenga kwa siku tatu
  rationale: Hutafsiri kitenzi 'kujenga' moja kwa moja na kuepuka kuingiza wazi wazo la 'kujenga upya,' ambalo linadokezwa tu na muktadha.
theological_decisions:
- issue: Maana ya kauli kuhusu Hekalu
  choice: Maneno ya wadhihaki yametafsiriwa kama shtaka au dokezo lao bila kulitambulisha Hekalu moja kwa moja na mwili wa Yesu.
  alternative: Kutafsiri kwa ufafanuzi unaoonyesha kuwa Yesu alikuwa akisema kwa mfano kuhusu mwili wake.
  rationale: Marko hapa anasimulia kejeli ya wapita-njia wakati wa kusulubiwa. Tafsiri inadumisha mtazamo wa simulizi na mvutano wa kiteolojia bila kuleta ufafanuzi kutoka muktadha mwingine ndani ya andiko kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wakati unaoendelea umetumika kuonyesha vitendo vya wakati mmoja, na lugha ya kejeli imehifadhiwa bila kuwa ya kizamani.
