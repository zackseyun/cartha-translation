  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: sw
  text: Nao wanamsulubisha na wanagawana mavazi yake kwa kupiga kura ili kuamua kila mmoja atachukua nini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: wanamsulubisha
  rationale: Wakati wa sasa wa kihistoria katika simulizi la Marko umehifadhiwa ili kudumisha uhai na mwendo wa Kigiriki; umbo hili ni la kawaida na linaeleweka katika Kiswahili.
- source_word: διαμερίζονται
  choice: kugawana
  rationale: Kitenzi hiki hapa humaanisha kugawa vitu miongoni mwa wahusika; “kugawana” huonyesha kwa kawaida kwamba walijitwalia sehemu mbalimbali.
- source_word: ἱμάτια
  choice: mavazi
  rationale: “Mavazi” ni neno la heshima na la kawaida linalorejelea vitu vya kuvaliwa, bila kulazimisha idadi au aina maalumu.
- source_word: βάλλοντες κλῆρον
  choice: wakipiga kura
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili kwa kutumia kura kuamua mgao, na huwasilisha tendo linaloandamana na kugawana mavazi.
- source_word: ἐπ’ αὐτὰ
  choice: juu yake
  rationale: Kiwakilishi kinarejelea mavazi kwa ujumla; “juu yake” kinahifadhi kwa karibu uhusiano wa ἐπί bila kuongeza maelezo yasiyokuwapo.
- source_word: τίς τί ἄρῃ
  choice: ili kuamua kila mmoja achukue lipi
  rationale: 'Huhifadhi nguvu ya mgawanyo ya τίς τί: kura inaamua ni mtu gani atakayechukua kitu gani. “Lipi” hurejelea vazi gani kati ya mavazi hayo.'
theological_decisions:
- issue: Wakati wa sasa wa kihistoria katika simulizi la mateso
  choice: wanamsulubisha
  alternative: walimsulubisha
  rationale: Marko anatumia wakati wa sasa wa kihistoria kwa uhai wa simulizi. Kiswahili kinaweza kuubeba hapa kwa umbo la sasa bila kuongeza maana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi wakati wa sasa wa kihistoria na uhusiano wa vitendo vya Kigiriki bila kuufanya mstari kuwa mgumu.
