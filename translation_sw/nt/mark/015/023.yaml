  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: sw
  text: Nao walikuwa wakimpa divai iliyochanganywa na manemane[a], lakini yeye[b] hakuipokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimtolea divai iliyochanganywa na manemane.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki hutumia kiwakilishi chenye maana ya “ambaye,” kumrejelea tena Yesu: “lakini yeye hakuipokea.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: walikuwa wakimpa
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likifanywa au kujaribiwa; muundo huu unahifadhi hali hiyo kuliko wakati uliopita sahili.
- source_word: ἐσμυρνισμένον οἶνον
  choice: divai iliyochanganywa na manemane
  rationale: Hutoa kwa uwazi maana ya divai iliyoandaliwa kwa kutiwa manemane, kwa lugha ya kawaida ya Kiswahili.
- source_word: ὃς δὲ
  choice: lakini yeye
  rationale: Ingawa ὃς kwa umbo ni kiwakilishi rejeshi, hapa inarejelea tena Yesu; ‘lakini yeye’ ni ya asili katika Kiswahili na inahifadhi nguvu ndogo ya upinzani ya δέ.
- source_word: ἔλαβεν
  choice: hakuipokea
  rationale: λαμβάνω inaweza kumaanisha kuchukua au kupokea. ‘Hakuipokea’ inaeleza kukataa kwake bila kuongeza moja kwa moja kwamba aliionja au aliinywa.
theological_decisions:
- issue: Sababu ya Yesu kutopokea kinywaji
  choice: Tendo limeelezwa bila kutaja sababu ya kukataa kwake.
  alternative: Kusema kwamba alikataa dawa ya kupunguza maumivu au kinywaji cha desturi.
  rationale: Aya haisemi kwa nini Yesu hakuipokea; tafsiri haipaswi kuingiza maelezo ya kitafsiri yasiyomo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Manemane’ ni neno la kawaida la kibiblia kwa myrrh, na ‘hakuipokea’ huepuka kuongeza kwamba Yesu aliinywa.
