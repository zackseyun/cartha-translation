translation:
  language: sw
  text: Jiokoe mwenyewe[a], ukishuka kutoka msalabani!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiyunani kwa karibu zaidi: “Jiokoe mwenyewe, ukiisha kushuka kutoka msalabani,” au “Jiokoe mwenyewe; shuka kutoka msalabani!”'
    reason: Kitenzi-shirikishi cha Kiyunani kinaweza kuwakilishwa kwa Kiswahili kwa namna ya tendo linaloandamana na amri, kama tendo lililotangulia, au kwa amri mbili.
lexical_decisions:
- source_word: σῶσον
  choice: jiokoe
  rationale: Ni amri ya nafsi ya pili umoja. “Jiokoe” ni ya moja kwa moja, inafaa katika dhihaka hii, na inadumisha uhusiano wa kitenzi na lugha ya wokovu bila kuifanya iwe tu kuponyoka kimwili.
- source_word: σεαυτόν
  choice: mwenyewe
  rationale: Kiwakilishi jirejeshi ni yambwa ya σῶσον. Katika Kiswahili, maana yake inaunganishwa kwa kawaida katika “ji-” ya “jiokoe,” huku “mwenyewe” ikihifadhi na kusisitiza nguvu ya dhihaka iliyo katika matini.
- source_word: καταβάς
  choice: kwa kushuka
  rationale: Ni kitenzi-shirikishi tendi cha wakati uliopita cha καταβαίνω. Katika dhihaka hii yenye amri, “kwa kushuka” ni Kiswahili cha kawaida kinachoonyesha tendo linaloambatana na kujiokoa; tanbihi huhifadhi uwezekano wa kukisoma kama amri nyingine au kama tendo lililotangulia.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: kutoka msalabani
  rationale: Kirai hiki kinaonyesha mwendo wa kuondoka mahali alipo juu ya msalaba. “Kutoka msalabani” ni usemi wa kawaida na unaoeleweka katika simulizi la mateso.
theological_decisions:
- issue: Uhusiano wa καταβάς na amri σῶσον
  choice: 'Kukitafsiri kitenzi-shirikishi kama namna au tendo linaloambatana na amri: “Jiokoe mwenyewe kwa kushuka kutoka msalabani!”'
  alternative: “Jiokoe mwenyewe; shuka kutoka msalabani!” au, kwa kufuata mpangilio wa Kiyunani kwa karibu zaidi, “Jiokoe mwenyewe, ukiisha kushuka kutoka msalabani!”
  rationale: Kiyunani kina amri ikifuatwa na kitenzi-shirikishi, muundo mfupi wa dhihaka ambao unaweza kueleweka kama matendo yanayoambatana au kama amri mbili. Tafsiri kuu ni ya kawaida katika Kiswahili na inaonyesha changamoto ya wadhihaki, huku tanbihi ikihifadhi utata wa kisarufi bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jiokoe mwenyewe” ni wazi kwa msomaji wa kawaida; ingawa “ji-” tayari ni jirejeshi, “mwenyewe” imehifadhiwa kwa ajili ya msisitizo wa dhihaka uliomo katika σεαυτόν.
