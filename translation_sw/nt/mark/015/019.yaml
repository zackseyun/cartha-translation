base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: sw
  text: Nao walikuwa wakimpiga kichwani kwa mwanzi na wakimtemea mate; na huku wakipiga magoti, walikuwa wakimsujudia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwabudu.” Kitenzi cha Kigiriki kinaweza kumaanisha kusujudu mbele ya mtu, kumpa heshima, au kumwabudu; lakini hapa kinaeleza jinsi askari walivyoiga kwa dhihaka heshima inayotolewa kwa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: waliendelea kumpiga
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au kurudiwa; tafsiri hii hudhihirisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: kichwani
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba walimpiga kwenye kichwa chake bila kurudia kiwakilishi kwa namna nzito.
- source_word: καλάμῳ
  choice: kwa mwanzi
  rationale: Mwanzi ndio maana ya kawaida ya κάλαμος na inadumisha uhusiano na kifaa kilichotumiwa kama fimbo ya kifalme kwa dhihaka katika muktadha huu.
- source_word: ἐνέπτυον αὐτῷ
  choice: kumtemea mate
  rationale: Wakati usiotimilika unaunganishwa na 'waliendelea,' hivyo unaonyesha pia tendo hili la kudumu au kurudiwa bila kufanya sentensi kuwa nzito.
- source_word: τιθέντες τὰ γόνατα
  choice: wakapiga magoti
  rationale: Kirai cha Kigiriki, kwa maana halisi 'wakiweka magoti,' ni nahau ya kupiga magoti; hii ndiyo kauli ya kawaida na wazi kwa Kiswahili.
- source_word: προσεκύνουν αὐτῷ
  choice: kumsujudia
  rationale: Kusujudia hudumisha ishara ya kuinama kwa heshima au ibada na pia inafaa katika muktadha wa askari waliokuwa wakiiga kwa dhihaka heshima inayotolewa kwa mfalme.
theological_decisions:
- issue: Maana ya προσκυνέω katika muktadha wa dhihaka
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Askari walikuwa wakitoa kwa dhihaka ishara ya heshima ya kifalme, si lazima ibada ya kweli. 'Kumsujudia' huhifadhi kitendo kinachoonekana na utata wa neno, huku uwezekano wa 'kumwabudu' ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Waliendelea' hubeba hali ya matendo yaliyorudiwa katika vitenzi viwili vya wakati usiotimilika; semikoloni husaidia kutenganisha vipigo na ishara iliyofuata ya dhihaka.
