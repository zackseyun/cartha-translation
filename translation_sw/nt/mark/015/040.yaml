  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: sw
  text: Kulikuwa pia na wanawake waliokuwa wakitazama kwa mbali[a]. Miongoni mwao walikuwa Maria Magdalene, Maria, mama wa Yakobo mdogo[b] na Yose[c], na Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mbali.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha mdogo kwa umri, mdogo kwa kimo, au mwenye umuhimu mdogo; maana kamili hapa haijaelezwa.
    reason: lexical_ambiguity
  - marker: c
    text: Jina la Kigiriki hapa ni Yose, umbo tofauti na Yusufu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: Pia palikuwa na
  rationale: Hutoa nguvu ya nyongeza ya καί na kuendeleza simulizi kwa Kiswahili cha kawaida bila kulazimisha δέ itafsiriwe kwa neno tofauti.
- source_word: γυναῖκες
  choice: wanawake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi wa γυνή katika muktadha huu.
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya umbali wa mahali; ‘kutoka mbali’ pia inawezekana.
- source_word: θεωροῦσαι
  choice: waliokuwa wakitazama
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama participle ya wakati wa sasa katika muktadha wa kitenzi cha wakati uliopita.
- source_word: ἐν αἷς
  choice: Miongoni mwao walikuwa
  rationale: Unawatambulisha wanawake waliotajwa kama sehemu ya kundi kubwa lililokuwapo.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalene
  rationale: Hutumia umbo la jina linalotambulika katika Kiswahili huku likihifadhi utambulisho wa mahali/jina la kumtofautisha.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria, mama ya Yakobo mdogo na Yose
  rationale: Inaonyesha wazi kuwa Maria ndiye mama ya Yakobo na Yose, bila kuongeza taarifa isiyomo katika maandishi.
- source_word: τοῦ μικροῦ
  choice: mdogo
  rationale: ‘Mdogo’ ni ya asili na huhifadhi uwezekano kwamba sifa hiyo inahusu umri, ukubwa wa mwili, au hadhi, bila kuamua zaidi ya Kigiriki.
- source_word: Ἰωσῆτος
  choice: Yose
  rationale: Huhifadhi umbo la jina la Kigiriki Ἰωσῆς na kulitofautisha na jina Yusufu.
- source_word: Σαλώμη
  choice: Salome
  rationale: Ni unukuzi wa kawaida na unaotambulika wa jina hili kwa Kiswahili.
theological_decisions:
- issue: Maana ya sifa τοῦ μικροῦ inayomtambulisha Yakobo
  choice: Yakobo mdogo
  alternative: Yakobo aliye mdogo; Yakobo Mdogo; Yakobo kijana
  rationale: Kigiriki hakisemi wazi kama sifa hiyo inahusu umri, kimo, au umuhimu. ‘Mdogo’ huhifadhi utata huo badala ya kuufanya kwa lazima kuwa ‘kijana’ au ‘wa cheo cha chini.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kufuatwa katika usomaji wa kawaida; majina Yose na Salome yamehifadhiwa, na utata wa ‘mdogo’ haujaondolewa.
