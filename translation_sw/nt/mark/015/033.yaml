id: MRK.15.33
reference: Mark 15:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: sw
  text: Ilipofika saa sita[a], giza likatanda katika nchi yote[b] mpaka saa tisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kuanzia karibu saa sita mchana mpaka saa tisa alasiri.
    reason: cultural_note
  - marker: b
    text: Au, “dunia yote.” Neno la Kigiriki linaweza kumaanisha “nchi” au “dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: ilipofika saa sita
  rationale: Muundo huu unaonyesha wakati kwa njia ya kawaida katika Kiswahili na kuhifadhi namna ya kuhesabu saa iliyotumiwa katika chanzo. Maelezo ya chini yanafafanua wakati huo kwa msomaji wa leo.
- source_word: σκότος
  choice: giza
  rationale: “Giza” ni neno la kawaida, wazi, na linalolingana moja kwa moja na maana ya nomino ya Kigiriki.
- source_word: ἐγένετο
  choice: likatanda
  rationale: Katika muktadha wa giza kuenea juu ya eneo, “likatanda” ni Kiswahili cha asili kinachoonyesha kutokea na kuenea kwa giza bila kuongeza sababu yake.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: katika nchi yote
  rationale: γῆ inaweza kumaanisha nchi/eneo au dunia. “Nchi yote” inafaa katika simulizi hili bila kulazimisha maana ya dunia nzima; maana nyingine imehifadhiwa katika tanbihi.
- source_word: ἕως ὥρας ἐνάτης
  choice: mpaka saa tisa
  rationale: Hii huhifadhi usemi wa wakati wa chanzo na inalingana na “saa sita”; tanbihi inaonyesha kuwa kipindi kinachokusudiwa ni takriban saa sita mchana hadi saa tisa alasiri.
theological_decisions:
- issue: Upeo wa γῆ katika tukio la giza wakati wa kusulubiwa
  choice: nchi yote
  alternative: dunia yote
  rationale: Neno γῆ lina maana pana na linaweza kutaja nchi/eneo au dunia. Tafsiri kuu haifanyi dai la lazima kwamba giza lilifunika sayari nzima, lakini tanbihi huhifadhi uwezekano huo wa kileksika bila kuondoa mvutano wa maana uliomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Giza likatanda” ni usemi wa kawaida na wenye uzito wa kisimulizi; “nchi yote” huhifadhi utata halisi wa γῆ. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
