id: MRK.15.32
reference: Mark 15:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: sw
  text: “Masihi[a], Mfalme wa Israeli, na ashuke sasa kutoka msalabani, ili tuone na kuamini.” Nao wale waliosulubiwa pamoja naye walikuwa wakimtukana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: b
    text: Au, “walikuwa wakimshutumu” au “walikuwa wakimfedhehesha kwa maneno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Neno hili limetumiwa kama cheo cha mfalme aliyetiwa mafuta katika kejeli yao; “Masihi” huhifadhi maana hiyo ya Kiyahudi na kifalme.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: Mfalme wa Israeli
  rationale: Hili ni jina la cheo linalohifadhi kwa uwazi dai la kifalme ambalo wanadhihaki.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: na ashuke sasa kutoka msalabani
  rationale: “Na ashuke” huwasilisha amri ya nafsi ya tatu yenye changamoto ya dhihaka, na “sasa” huhifadhi msisitizo wa haraka.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: ili tuone na kuamini
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili, huku ukihifadhi uhusiano wa kusudi au matokeo bila kuamua zaidi ya maandishi.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: wale waliosulubiwa pamoja naye
  rationale: Huhifadhi hali ya kutendwa na wazo la kushiriki kusulubiwa pamoja na Yesu bila kuongeza maelezo yasiyo katika kifungu.
- source_word: ὠνείδιζον αὐτόν
  choice: walikuwa wakimtukana
  rationale: Muundo endelevu huonyesha kitendo kilichoendelea, na “kumtukana” ni neno la sasa na linaloeleweka kwa maana ya kumshambulia kwa maneno ya fedheha.
theological_decisions:
- issue: Tafsiri ya Χριστός katika muktadha wa dhihaka ya kifalme
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός ni cheo katika usemi “Mfalme wa Israeli,” si matumizi yaliyo kama jina binafsi; “Masihi” huhifadhi maana ya mtiwa-mafuta wa kifalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “na ashuke” huhifadhi sauti ya changamoto ya dhihaka, na hali ya kuendelea katika “walikuwa wakimtukana” huakisi wakati wa kitenzi cha Kigiriki.
