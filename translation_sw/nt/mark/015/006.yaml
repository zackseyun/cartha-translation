lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Wakati wa sikukuu
  rationale: κατά pamoja na nomino katika hali ya kushutumiwa inaonyesha wakati wa tukio la kawaida. δέ ni kiunganishi chepesi, hivyo hakihitaji neno zito la kuonyesha utofauti.
- source_word: ἀπέλυεν
  choice: alikuwa akiwaachilia
  rationale: Kitenzi cha wakati uliopita usiotimilika kinaonyesha kitendo kilichokuwa kikifanywa kwa kawaida, si tukio moja tu.
- source_word: αὐτοῖς
  choice: akiwaachilia
  rationale: Kiambishi -wa- kinaonyesha kwamba kuachiliwa kwa mfungwa kulifanywa kwa ajili ya watu hao.
- source_word: ἕνα δέσμιον
  choice: mfungwa mmoja
  rationale: ἕνα inataja wazi idadi ya mmoja, na δέσμιον katika mazingira haya ya kisheria ni ‘mfungwa.’
- source_word: ὃν παρῃτοῦντο
  choice: ambaye waliomba aachiliwe
  rationale: παραιτέομαι hapa humaanisha kuomba au kutaka mtu fulani apewe. Muundo huu wa Kiswahili unaweka wazi kwamba ombi lilihusu kuachiliwa kwa huyo mfungwa bila kuongeza jina la Pilato lisilomo katika mstari.
