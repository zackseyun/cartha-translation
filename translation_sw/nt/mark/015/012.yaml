id: MRK.15.12
reference: Mark 15:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: sw
  text: Pilato akawajibu tena, “Basi, mnataka nimfanyie nini huyo mnayemwita mfalme wa Wayahudi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinaonyesha kwamba Pilato anazungumza kwa mara nyingine katika mazungumzo yanayoendelea.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: akawajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi cha wakati usiotimilifu unatolewa kwa Kiswahili cha masimulizi kwa njia ya kawaida na ya asili, bila tafsiri ngumu ya neno kwa neno.
- source_word: Τί οὖν
  choice: Basi, ... nini
  rationale: “Basi” linaonyesha hitimisho au hatua inayofuata kutokana na ombi la umati.
- source_word: θέλετε ποιήσω
  choice: mnataka nimfanyie nini
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kile ambacho watu wanataka Pilato amtendee mtu huyo; kiambishi cha kutendea “-fanyie” kinafaa kwa kitu kinachofanywa kwa au dhidi ya mtu.
- source_word: ὃν λέγετε
  choice: huyo mnayemwita
  rationale: 'Tafsiri hii inadumisha mtazamo wa wasikilizaji: wao ndio wanaompa Yesu jina hilo, bila kuongeza dai la Pilato mwenyewe.'
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: mfalme wa Wayahudi
  rationale: Hili ni jina la kisiasa linalotumika mara kwa mara katika simulizi la mateso; herufi ndogo inaepusha kulifanya hapa kuwa tamko la imani.
theological_decisions:
- issue: Iwapo maneno ya Pilato yanathibitisha ufalme wa Yesu au yanaonyesha tu jina analopewa na umati
  choice: “huyo mnayemwita mfalme wa Wayahudi”
  alternative: “yule mnayesema ni mfalme wa Wayahudi”
  rationale: Kishazi ὃν λέγετε kinaweka jina hilo katika kinywa cha umati. Tafsiri inadumisha umbali huo wa balagha bila kufanya Pilato akiri au akatae ufalme wa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawajibu tena” linafaa katika mtiririko wa masimulizi, na “huyo mnayemwita” ni wazi kwa wasomaji wa kawaida huku likihifadhi msisitizo wa Kigiriki kwa kile ambacho wao humwita.
