  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: sw
  text: Lakini Pilato akamwuliza tena, “Hujibu chochote? Tazama wanakushitaki kwa mambo mangapi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mwendelezo wa simulizi wenye utofauti mdogo na ukimya wa Yesu katika muktadha huu.
- source_word: πάλιν
  choice: tena
  rationale: Inaonyesha kuwa Pilato anarudia kumwuliza Yesu.
- source_word: ἐπηρώτα
  choice: akamwuliza
  rationale: Kitenzi cha Kigiriki kinaweza kuonyesha tendo lililoendelea au lililorudiwa; pamoja na πάλιν, ‘akamwuliza tena’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuzidisha kuwa mahojiano makali.
- source_word: λέγων
  choice: —
  rationale: Kirai cha Kigiriki cha kutambulisha maneno ya msemaji kimewasilishwa kwa usemi wa moja kwa moja; kuongeza ‘akisema’ kungekuwa si lazima katika Kiswahili.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Hujibu chochote?
  rationale: Huhifadhi msisitizo wa swali kuhusu kutotoa jibu huku ikiwa sentensi ya asili na yenye nguvu katika Kiswahili.
- source_word: ἴδε
  choice: Tazama
  rationale: Ni amri inayomwelekeza Yesu aangalie au atambue wingi wa mashtaka; ‘Tazama’ ni ya heshima na ya sasa bila kuwa ya kizamani kupita kiasi.
- source_word: πόσα
  choice: ni mambo mangapi
  rationale: Huhifadhi kwa karibu maana isiyobainisha nomino ya πόσα, ‘mambo mangapi,’ badala ya kuingiza moja kwa moja ‘mashtaka,’ ambayo inafafanuliwa tayari na kitenzi kinachofuata.
- source_word: σου κατηγοροῦσιν
  choice: wanayokushtaki nayo
  rationale: Hutoa kwa Kiswahili maana ya kumshitaki mtu kuhusu mambo fulani na kuhifadhi wakati wa sasa wa mashtaka yanayoendelea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umefanywa kuwa wa kawaida kwa Kiswahili kwa kuacha tafsiri ya moja kwa moja ya λέγων, huku maana yote ya usemi ikihifadhiwa.
