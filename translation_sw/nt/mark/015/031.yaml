  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: sw
  text: Vivyo hivyo, wakuu wa makuhani, pamoja na waandishi, walikuwa wakimdhihaki huku wakisema wao kwa wao, “Aliwaokoa wengine; hawezi kujiokoa mwenyewe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Inaonyesha kuwa dhihaka hii inafanana na dhihaka ya makundi yaliyotajwa kabla.
- source_word: οἱ ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unawahusu wenye mamlaka kuu katika ukuhani, bila kudokeza kwamba wote walikuwa na cheo kimoja cha kuhani mkuu kwa wakati mmoja.
- source_word: ἐμπαίζοντες
  choice: walikuwa wakimdhihaki
  rationale: Kitenzi hiki kinaonyesha dhihaka ya kumfanyia Yesu, na muundo wa kuendelea unaendana na tendo lililokuwa likifanyika.
- source_word: πρὸς ἀλλήλους
  choice: huku wakisemeshana
  rationale: Inaonyesha usemi wa kurudishana kati yao; haimaanishi kwamba walikuwa wakidhihaki wao kwa wao.
- source_word: μετὰ τῶν γραμματέων
  choice: pamoja na waandishi wa Sheria
  rationale: Inaonyesha kuwa waandishi wa Sheria walishiriki pamoja na viongozi wa makuhani; jina hili linaeleweka kwa wasomaji wa kisasa kuliko 'waandishi' peke yake.
- source_word: ἔλεγον
  choice: walikuwa ... wakisema
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha usemi uliokuwa ukiendelea au kurudiwa.
- source_word: Ἄλλους
  choice: wengine
  rationale: Ni tafsiri ya moja kwa moja ya kitu cha wingi kisichotajwa kwa majina.
- source_word: ἔσωσεν ... σῶσαι
  choice: aliwaokoa ... kujiokoa
  rationale: Kurudia mzizi mmoja kunahifadhi ulinganifu na kejeli ya kauli ya Kigiriki; 'okoa' inaweza kujumuisha kuponya, kukomboa, au kuokoa kulingana na muktadha.
- source_word: οὐ δύναται
  choice: hawezi
  rationale: Inawasilisha kwa kawaida dai lao kuhusu kutokuwa na uwezo.
theological_decisions:
- issue: Kudumisha marudio ya σῴζω katika vifungu vyote viwili
  choice: aliwaokoa ... kujiokoa
  alternative: aliwakomboa ... kujikomboa
  rationale: Kutumia mzizi uleule wa Kiswahili kunahifadhi marudio na kejeli ya kiteolojia bila kuifanya maana kuwa ya kimafundisho kwa namna finyu.
- issue: Mhusika anayelengwa na dhihaka
  choice: walikuwa wakimdhihaki [Yesu] huku wakisemeshana
  alternative: walikuwa wakidhihakiana
  rationale: Muktadha na matumizi ya ἐμπαίζω yanaelekeza dhihaka kwa Yesu, ilhali πρὸς ἀλλήλους inaeleza mawasiliano ya kurudishana kati yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo 'huku wakisemeshana' unahifadhi maana ya mazungumzo ya wao kwa wao bila kudokeza kuwa walidhihakiana.
