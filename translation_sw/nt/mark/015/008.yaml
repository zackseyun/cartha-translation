  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: sw
  text: Nao umati ukapanda, ukaanza kumwomba afanye kama alivyokuwa akiwafanyia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Nao umati, baada ya kupanda, ukaanza kumwomba afanye kama alivyokuwa akiwafanyia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: ukapanda
  rationale: Kitenzi hiki kwa msingi humaanisha kupanda au kwenda juu. Tafsiri hii inahifadhi mwendo unaotajwa katika Kigiriki bila kuongeza mahali ambapo halikutajwa.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: Neno hili humaanisha kundi kubwa la watu; “umati” ni Kiswahili sanifu, cha kawaida na kinachofaa katika simulizi.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: kuanza kumwomba
  rationale: Muundo wa ἄρχομαι pamoja na kitenzi-jina unaonyesha kuanza kwa tendo. Katika muktadha huu αἰτεῖσθαι ni kuomba jambo, na kiwakilishi “-mw-” kinaeleweka kutokana na muktadha wa Pilato.
- source_word: καθὼς
  choice: kama
  rationale: “Kama” huhifadhi maana ya ulinganisho ya καθώς na kuunganisha ombi lao na desturi ya Pilato.
- source_word: ἐποίει
  choice: alivyokuwa akiwafanyia
  rationale: Wakati usiotimilifu hapa unaonyesha tendo la kawaida lililorudiwa zamani; muundo “alivyokuwa akiwafanyia” unaonyesha desturi hiyo kwa Kiswahili cha asili.
- source_word: αὐτοῖς
  choice: akiwafanyia
  rationale: Kiambishi “-wa-” pamoja na umbo la kutendea “-fanyia” huwasilisha maana ya kuwatendea au kuwafanyia jambo kwa faida yao.
