base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: sw
  text: Lakini Yesu akatoa kilio kikubwa[a], kisha akatoa pumzi yake ya mwisho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti kubwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akafa”; kihalisi, “akatoa pumzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Ni kiunganishi chepesi kinachoonyesha mgeuko wa simulizi; “Lakini” linahifadhi utofautisho wa tukio hili la kilele bila kulifanya kuwa mkali kupita kiasi.
- source_word: ἀφεὶς
  choice: akatoa
  rationale: Katika muundo huu kitenzi kina maana ya kutoa au kuachilia sauti; “akatoa” ni Kiswahili cha kawaida na kinaendana vizuri na “kilio kikubwa.”
- source_word: φωνὴν μεγάλην
  choice: kilio kikubwa
  rationale: φωνή linaweza kumaanisha sauti, kilio, au mlio. Katika simulizi la mateso, “kilio kikubwa” linaonyesha mlio wa sauti wenye nguvu, huku likihifadhi kiasi fulani cha upana wa maana ya Kigiriki.
- source_word: ἐξέπνευσεν
  choice: akatoa pumzi yake ya mwisho
  rationale: Kitenzi hiki humaanisha kihalisi kutoa pumzi na, kimuktadha, kufa. Usemi huu wa Kiswahili unahifadhi taswira ya pumzi pamoja na maana ya kifo bila kuingiza wazo la ziada la ‘kutoa roho.’
- source_word: ὁ δὲ Ἰησοῦς
  choice: Lakini Yesu
  rationale: Kibainishi cha Kigiriki hakihitaji kutafsiriwa kando mbele ya jina Yesu; kiunganishi δέ kinawakilishwa kwa “Lakini.”
theological_decisions:
- issue: Kueleza kifo cha Yesu bila kuongeza maana ya kitheolojia isiyosemwa wazi
  choice: akatoa pumzi yake ya mwisho
  alternative: akafa; akakata roho; akaitoa roho yake
  rationale: Chaguo hili linaonyesha kwa kawaida kuwa Yesu alikufa na wakati huohuo linatunza taswira ya kupumua iliyo katika ἐξέπνευσεν. “Akaitoa roho yake” lingeweza kuingiza au kuoanisha kimakusudi lugha ya vifungu vingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wenye heshima na uzito. “Kilio” hapa hakikusudii lazima kulia kwa machozi, bali sauti kubwa iliyotolewa.
