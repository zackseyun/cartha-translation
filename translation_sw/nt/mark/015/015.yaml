  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: sw
  text: Basi Pilato, akitaka kuuridhisha umati,[a] akawaachilia Baraba; naye, baada ya kuamuru Yesu apigwe mijeledi, akamkabidhi ili asulubiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitaka kuupendeza umati.” Kihalisi, “kufanya lililotosha kwa ajili ya umati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: akitaka
  rationale: Hueleza nia ya Pilato kwa lugha ya kawaida bila kuongeza wazo la kusita au kutafakari kwa muda mrefu.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: kuuridhisha umati
  rationale: Nahau hii ina maana ya kutimiza matakwa ya umati au kuwatuliza kwa kuwapa walichodai; ‘kuuridhisha umati’ ni ya asili na inadumisha uzito wa kisiasa wa tendo hilo.
- source_word: ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν
  choice: akawaachilia Baraba
  rationale: Katika muktadha wa hukumu, ἀπολύω ni kumweka mfungwa huru. Kiambishi ‘-wa-’ kinawakilisha αὐτοῖς kwa namna ya kawaida katika Kiswahili.
- source_word: παρέδωκεν
  choice: akamkabidhi
  rationale: Huhifadhi maana ya kumtia Yesu mikononi au chini ya mamlaka ya wengine, muhimu katika simulizi la mateso.
- source_word: φραγελλώσας
  choice: baada ya kuamuru Yesu apigwe mijeledi
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kukabidhiwa. Uundaji huu pia huonyesha kwa kawaida kwamba Pilato ndiye aliyeagiza adhabu, si lazima aliyeitekeleza mwenyewe.
- source_word: ἵνα σταυρωθῇ
  choice: ili asulubiwe
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa ufupi na kwa lugha ya kawaida.
- source_word: Βαραββᾶν
  choice: Baraba
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Maana ya nia ya Pilato katika τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pilato alitaka kuuridhisha umati kwa kutimiza matakwa yao
  alternative: Pilato alitaka kuupendeza umati
  rationale: ‘Kuuridhisha’ hudumisha wazo la kuyatimiza madai ya umati na mvutano wa kimaadili wa simulizi; ‘kuupendeza’ linaweza kusikika jepesi mno.
- issue: Uhusika wa Pilato katika φραγελλώσας
  choice: Pilato aliamuru Yesu apigwe mijeledi
  alternative: Pilato mwenyewe alimpiga Yesu mijeledi
  rationale: Katika muktadha wa mamlaka ya kirumi, kishirikishi kinaweza kueleza tendo lililofanywa kwa amri yake; tafsiri haidai kwamba Pilato alitekeleza kipigo mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Umati,’ ‘mijeledi,’ ‘akamkabidhi,’ na ‘asulubiwe’ vinaeleweka kwa wasomaji wa kawaida huku vikihifadhi uzito wa simulizi la kisheria na mateso.
