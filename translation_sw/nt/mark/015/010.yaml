  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: sw
  text: Kwa maana alijua kwamba makuhani wakuu walikuwa wamemkabidhi kwa sababu ya kijicho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kijicho” au “kwa sababu ya wivu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: alijua
  rationale: Wakati usiotimilifu hapa unaonyesha ufahamu wa Pilato uliokuwa tayari umejengeka; ‘alijua’ ni Kiswahili cha kawaida na cha asili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha sababu inayoeleza kauli iliyotangulia na kuhifadhi uhusiano wa kimantiki wa sentensi.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutanguliza maudhui ya kile Pilato alichojua.
- source_word: διὰ φθόνον
  choice: kwa sababu ya kijicho
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu; φθόνος hapa ni kijicho, yaani kutotaka mema ya mwingine kwa sababu ya alicho nacho au sifa aliyo nayo.
- source_word: παραδεδώκεισαν
  choice: walikuwa wamemkabidhi
  rationale: Wakati uliopita timilifu unaonyesha kuwa tendo la kumkabidhi Yesu lilitangulia ufahamu unaosimuliwa. ‘Kumkabidhi’ linafaa katika muktadha wa kumtia mikononi mwa mamlaka bila kuongeza maana maalumu ya kumsaliti.
- source_word: αὐτὸν
  choice: -m- katika ‘wamemkabidhi’
  rationale: Kiambishi cha yambwa kinamrejelea Yesu kwa njia ya kawaida katika Kiswahili.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wa juu wa kikuhani wanaotajwa kwa wingi katika simulizi la mateso ya Yesu.
theological_decisions:
- issue: Sababu iliyowasukuma makuhani wakuu
  choice: Kifungu kinasema Pilato alijua kuwa walimkabidhi Yesu kwa sababu ya kijicho.
  alternative: kwa sababu ya wivu
  rationale: Tafsiri inadumisha tathmini ya Pilato kuhusu nia yao bila kuiongeza au kuipa ufafanuzi wa kidhehebu; tanbihi huhifadhi uwezekano wa neno ‘wivu’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wamemkabidhi’ huhifadhi mpangilio wa nyakati, huku ‘kijicho’ likibainisha vizuri zaidi φθόνος kuliko ‘wivu,’ ambalo katika matumizi fulani linaweza pia kumaanisha jealousy.
