id: MRK.15.1
reference: Mark 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: sw
  text: Mara tu, asubuhi na mapema, makuhani wakuu, pamoja na wazee na waandishi wa sheria na baraza lote, walifanya mashauriano. Kisha wakamfunga Yesu, wakampeleka, na kumkabidhi kwa Pilato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara moja
  rationale: Hudumisha uharaka unaojitokeza mara kwa mara katika simulizi la Marko kwa Kiswahili cha kawaida.
- source_word: πρωῒ
  choice: asubuhi na mapema
  rationale: Huonyesha wazi kuwa tukio lilifanyika mapema wakati wa asubuhi.
- source_word: συμβούλιον ποιήσαντες
  choice: walifanya mashauriano
  rationale: Ni usemi wa asili unaoeleza tendo rasmi la kushauriana bila kuufanya usemi wa Kigiriki kuwa mgumu katika Kiswahili.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hurejelea viongozi wa kikuhani, wala si makuhani wakuu wengi waliokuwa wakishika cheo hicho kwa wakati mmoja.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Katika muktadha huu ni viongozi wanaotambuliwa katika jamii na baraza.
- source_word: γραμματέων
  choice: waandishi wa sheria
  rationale: Hutambulisha kwa uwazi zaidi maofisa waliokuwa wataalamu na wafafanuzi wa sheria, huku ikihifadhi dhana ya waandishi.
- source_word: ὅλον τὸ συνέδριον
  choice: baraza lote
  rationale: Hutafsiri taasisi hiyo kwa maana inayoeleweka na wasomaji wa sasa; jina la kihistoria Sanhedrini limetolewa katika tanbihi.
- source_word: δήσαντες
  choice: wakamfunga
  rationale: Huonyesha moja kwa moja kuwa Yesu alifungwa kabla ya kuondolewa hapo.
- source_word: ἀπήνεγκαν
  choice: wakampeleka
  rationale: Katika muktadha wa mtu aliye chini ya ulinzi, ni Kiswahili cha kawaida kuliko usemi unaoweza kudokeza kuwa alibebwa.
- source_word: παρέδωκαν
  choice: kumkabidhi
  rationale: Huhifadhi maana ya kuhamisha rasmi mamlaka au ulinzi wa Yesu kwa Pilato bila kuongeza tafsiri ya kiteolojia.
- source_word: Πιλάτῳ
  choice: Pilato
  rationale: Ni umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Maana ya συνέδριον
  choice: baraza lote
  alternative: Sanhedrini yote
  rationale: Neno hili linataja baraza la utawala la Wayahudi. Kutafsiri maana yake husaidia uelewekaji, huku jina maalumu la kihistoria likihifadhiwa katika tanbihi.
- issue: Nguvu ya παρέδωκαν katika simulizi la mateso
  choice: kumkabidhi kwa Pilato
  alternative: kumtia mikononi mwa Pilato
  rationale: Uamuzi huu unaonyesha uhamisho rasmi wa Yesu kwenda chini ya mamlaka ya Pilato bila kuingiza maana pana ya kiteolojia ambayo mstari huu pekee hailazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa matendo umehifadhiwa, na kiunganishi “Kisha” kinaonyesha mfuatano wa mashauriano, kufungwa, kupelekwa, na kukabidhiwa kwa Yesu.
