  text: Wakamleta mpaka mahali pa Golgotha—kwa tafsiri, “Mahali pa Fuvu la Kichwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: wakamleta
  rationale: Kitenzi φέρω kinaeleza kumfikisha mtu mahali fulani bila kulazimisha wazo kwamba alibebwa; wakati uliopo wa kisimulizi umetafsiriwa kwa wakati uliopita wa masimulizi ya Kiswahili.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: mahali paitwapo Golgotha
  rationale: Muundo huu unaonyesha mwendo kuelekea mahali na unahifadhi τόσο τόπον pamoja na jina Golgotha. Neno “paitwapo” linafanya usemi uwe wa kawaida katika Kiswahili bila kubadili maana ya utambulisho wa mahali.
- source_word: Γολγοθᾶν
  choice: Golgotha
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: μεθερμηνευόμενον
  choice: yaani
  rationale: Katika muktadha huu neno linaanzisha tafsiri au ufafanuzi wa jina la Kiaramu; “yaani” ni njia ya asili na wazi ya kuwasilisha kazi hiyo katika Kiswahili.
- source_word: Κρανίου Τόπος
  choice: Mahali pa Fuvu la Kichwa
  rationale: Huhifadhi uhusiano wa nomino katika Kigiriki na kutumia usemi wa Kiswahili unaoeleweka wazi; Kigiriki hakina kibainishi kinacholazimisha maana ya fuvu fulani mahsusi.
