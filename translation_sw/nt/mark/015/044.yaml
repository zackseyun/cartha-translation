  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: sw
  text: Lakini Pilato alishangaa kwamba tayari alikuwa amekufa; akamwita jemadari wa askari mia, akamuuliza kama alikufa kitambo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama alikuwa amekufa kwa muda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: alishangaa
  rationale: Kitenzi hiki kinaonyesha mshangao wa Pilato kwa sababu ya habari kwamba kifo kilikuwa kimetokea haraka.
- source_word: εἰ ἤδη τέθνηκεν
  choice: kwamba tayari alikuwa amekufa
  rationale: Muundo huu unasomeka kwa kawaida baada ya “alishangaa”; “tayari” huwakilisha ἤδη, na “alikuwa amekufa” huonyesha tendo lililokamilika pamoja na hali iliyotokana nalo.
- source_word: προσκαλεσάμενος
  choice: akamwita
  rationale: Huwasilisha kwa uwazi tendo lililotangulia swali la Pilato, bila kufanya sentensi iwe nzito.
- source_word: κεντυρίωνα
  choice: jemadari wa askari mia
  rationale: Hili ni neno la Kiswahili linaloeleweka na linalohifadhi cheo mahususi cha kijeshi cha Roma.
- source_word: ἐπηρώτησεν αὐτόν
  choice: akamuuliza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuuliza au kutaka uthibitisho.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: kama alikuwa amekufa kwa muda fulani
  rationale: πάλαι hapa huuliza ikiwa tangu kifo chake muda fulani ulikuwa umepita, si lazima kwamba alikufa zamani sana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kifungu cha kwanza kimetafsiriwa kwa “kwamba” kwa ufasaha, huku swali lisilo la moja kwa moja katika kifungu cha pili likihifadhiwa kwa “kama.”
