base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: sw
  text: Nao Maria Magdalene na Maria, mama wa Yose, walikuwa wakitazama mahali alipowekwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “Maria wa Yose.” Kigiriki kinamtambulisha Maria huyu kwa uhusiano wake na Yose.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole bila kuonyesha upinzani mkali; “Nao” ni cha asili katika masimulizi ya Kiswahili.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalene
  rationale: Hili ni jina na utambulisho wake unaotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Maria mama yake Yose
  rationale: Muundo wa Kigiriki unamtambulisha Maria kwa uhusiano wake na Yose. Muktadha wa Marko unaunga mkono kufafanua uhusiano huo kuwa wa mama na mwana, huku tanbihi ikihifadhi usemi halisi wenye utata.
- source_word: ἐθεώρουν
  choice: walikuwa wakitazama
  rationale: Wakati usiotimilika wa kitenzi unaonyesha tendo lililokuwa likiendelea; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: ποῦ
  choice: mahali
  rationale: Katika kishazi hiki, “mahali” huwasilisha kwa kawaida maana ya ‘wapi/mahali ambapo’ bila kufanya sentensi kuwa nzito.
- source_word: τέθειται
  choice: alipokuwa amelazwa
  rationale: Muundo huu unaonyesha tendo la kulazwa lililokamilika na hali yake iliyoendelea, huku kiwakilishi cha ngeli ya mtu kikimrejelea Yesu kwa uwazi.
theological_decisions:
- issue: Mtendwa asiyeelezwa wazi wa kitenzi tendwa
  choice: Kumrejelea Yesu kwa kiambishi cha mtu katika “alipokuwa amelazwa”
  alternative: Kutumia “mwili wake ulipokuwa umewekwa”
  rationale: Kigiriki hakitaji mtendwa kwa sababu anaeleweka kutokana na muktadha. Kiswahili kinaweza kumrejelea Yesu kiasili kwa kiambishi cha mtu bila kumgeuza kuwa kitu au kuongeza neno “mwili” lisilopo katika mstari.
- issue: Uhusiano wa Maria na Yose
  choice: mama yake Yose
  alternative: Maria wa Yose
  rationale: Genitivi ya Kigiriki inaonyesha uhusiano bila kuutaja moja kwa moja. Katika matumizi ya Marko na muktadha huu, uhusiano wa mama na mwana ndio unaoeleweka zaidi; tanbihi inahifadhi tafsiri halisi na kiwango cha utata wa muundo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Walikuwa wakitazama” huhifadhi mwendelezo wa tendo, na “alipokuwa amelazwa” ni ya asili huku ikionyesha hali iliyotokana na tendo lililokamilika.
