  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: sw
  text: Na ilipokuwa tayari jioni[a], kwa kuwa ilikuwa Siku ya Maandalizi[b]—yaani, siku moja kabla ya Sabato[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jioni ilipokuwa tayari imefika.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Maandalizi,” neno lililotumiwa kwa siku ya kujiandaa kwa ajili ya Sabato.'
    reason: cultural_note
  - marker: c
    text: Au, “mkesha wa Sabato”; neno hili linamaanisha siku iliyotangulia Sabato, ambayo kwa kawaida ni Ijumaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Na
  rationale: Hudumisha mtindo wa Marko wa kuunganisha matukio kwa viunganishi bila kuongeza hitimisho lisilokuwamo katika chanzo.
- source_word: ἤδη ὀψίας γενομένης
  choice: ilipokuwa tayari jioni
  rationale: Muundo huu wa wakati unawakilisha genitive absolute kama hali ya muda, huku 'tayari' ikihifadhi ἤδη na Kiswahili cha kawaida kikitoa maana ya kwamba jioni ilikuwa imefika.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Hutoa nguvu ya sababu na maelezo ya kiunganishi hiki kwa Kiswahili sanifu na cha kawaida.
- source_word: παρασκευή
  choice: Siku ya Maandalizi
  rationale: Katika muktadha huu ni jina la siku maalumu ya maandalizi kabla ya Sabato, si maandalizi kwa ujumla; herufi kubwa zinaonyesha matumizi hayo ya kalenda.
- source_word: ὅ ἐστιν
  choice: yaani
  rationale: Ni njia ya asili na wazi ya Kiswahili ya kuingiza ufafanuzi.
- source_word: προσάββατον
  choice: siku moja kabla ya Sabato
  rationale: Hutoa maana wazi ya neno hilo bila kulibadili moja kwa moja kuwa 'Ijumaa,' jambo ambalo lingekuwa ufafanuzi mahususi zaidi kuliko umbo la Kigiriki.
