  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: sw
  text: Lakini Pilato aliwaambia[a], “Kwa nini? Amefanya uovu gani?” Lakini wao wakapaza sauti zaidi, “Msulubishe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini, amefanya kosa gani?”
    reason: Huhifadhi mbadala wa kileksia wa κακόν (“kosa”) na mpangilio mbadala wa swali, bila kupunguza tafsiri kuu “uovu.”
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akiwauliza
  rationale: Kauli ya wakati usiotimilifu inaonyesha tendo lililokuwa likiendelea; kwa kuwa maneno yanayofuata ni swali linaloelekezwa kwao, ‘alikuwa akiwauliza’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Kwa maana, amefanya uovu gani?
  rationale: ‘Kwa maana’ inawakilisha γάρ, na ‘uovu gani’ inadumisha uzito wa kimaadili wa κακόν huku swali likibaki la kawaida na wazi.
- source_word: κακόν
  choice: uovu
  rationale: Neno hili linaweza kumaanisha jambo baya au ovu; ‘uovu’ huhifadhi nguvu yake ya kimaadili bila kuongeza dai jingine.
- source_word: περισσῶς
  choice: wakazidi
  rationale: Huwasilisha kuongezeka kwa nguvu ya mwitikio wao kwa Kiswahili cha asili.
- source_word: ἔκραξαν
  choice: kupiga kelele
  rationale: Hueleza kilio kikubwa cha hadharani kwa lugha ya kawaida na yenye nguvu.
- source_word: Σταύρωσον αὐτόν
  choice: Msulubishe!
  rationale: Amri ya moja kwa moja inaelekezwa kwa Pilato; umbo la Kiswahili linaeleza dai la kumfanya Yesu asulubiwe.
- source_word: δὲ
  choice: Lakini
  rationale: Katika sehemu zote mbili, kiunganishi kinaonyesha utofauti kati ya Pilato, umati, na mwitikio wao.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Uzito wa kimaadili wa κακόν katika swali la Pilato
  choice: uovu
  alternative: kosa / jambo baya
  rationale: ‘Uovu’ huhifadhi uzito wa kimaadili na kisheria wa swali bila kupunguza changamoto ya Pilato wala kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘alikuwa akiwauliza’ umetumiwa kuhifadhi hali endelevu ya ἔλεγεν, na ‘wakazidi kupiga kelele’ huunganisha kwa kawaida περισσῶς na ἔκραξαν.
