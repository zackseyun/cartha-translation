translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Istilahi ya Kilatini-Kigiriki “praitorio” imewekwa katika tanbihi, huku maandishi makuu yakitumia maelezo yanayoeleweka. Alama zote za tanbihi [a] na [b] zimewekwa katika maandishi makuu.
