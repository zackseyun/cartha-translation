  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: sw
  text: Kisha askari wakampeleka ndani ya ua, yaani praitorio[a], wakawaita askari wote wa kikosi[b] wakusanyike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, makao makuu ya gavana.
    reason: lexical_alternative
  - marker: b
    text: “Kikosi” hapa ni kitengo cha jeshi la Roma kilichoitwa kohorti; katika muktadha huu neno hilo linawahusu askari waliokusanywa chini ya mamlaka ya Roma.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Kisha
  rationale: δέ inaendeleza simulizi bila kuonyesha upinzani mkali; “Kisha” ni ya asili katika Kiswahili cha masimulizi.
- source_word: στρατιῶται
  choice: askari
  rationale: Ni neno la kawaida na la moja kwa moja kwa wanajeshi Waroma katika muktadha huu.
- source_word: ἀπήγαγον
  choice: wakampeleka
  rationale: ἀπάγω hapa humaanisha kumwongoza au kumpeleka mtu mahali; kiambishi cha mtendwa kinamweka wazi Yesu bila kuongeza habari mpya.
- source_word: ἔσω τῆς αὐλῆς
  choice: ndani ya ua
  rationale: Huhifadhi maana ya mahali ya ἔσω pamoja na αὐλή kama ua wa jengo rasmi, bila kuufanya moja kwa moja kuwa ua wa ikulu.
- source_word: ὅ ἐστιν πραιτώριον
  choice: yaani, katika makao makuu ya gavana
  rationale: πραιτώριον ni istilahi ya Kirumi kwa makao au makao makuu rasmi ya gavana; tafsiri ya kimaana inaeleweka zaidi kwa msomaji wa kawaida kuliko mkopo usiozoeleka “praitorio.”
- source_word: συγκαλοῦσιν
  choice: wakawaita pamoja
  rationale: Huwasilisha maana ya kuwaita watu wakusanyike. Kiswahili cha simulizi kwa “waka-” ni cha asili, ingawa Kigiriki kinatumia wakati uliopo wa kihistoria.
- source_word: ὅλην τὴν σπεῖραν
  choice: wanajeshi wote wa kikosi
  rationale: σπεῖρα ni kikosi cha kijeshi cha Kirumi. Muundo huu unaonyesha kwamba walioitwa ni watu wa kikosi, na “wote” huhifadhi ὅλην.
