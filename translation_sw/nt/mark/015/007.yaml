translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Baraba’ linafuata umbo la kawaida la jina hilo katika mapokeo ya Biblia za Kiswahili. Sentensi imehifadhi uhusiano kati ya waasi na uasi bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
