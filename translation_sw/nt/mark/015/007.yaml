translation:
  language: sw
  text: Mtu aliyeitwa Baraba alikuwa amefungwa pamoja na waasi waliokuwa wamefanya mauaji katika uasi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na washiriki wa uasi” / “katika maasi.” Kigiriki kinatumia maneno yenye mzizi mmoja kuhusu watu walioshiriki katika uasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: alikuwa
  rationale: δέ ni kiunganishi hafifu cha simulizi na hakihitaji kutafsiriwa kwa neno la wakati; ἦν inaonyeshwa kwa ‘alikuwa’ ndani ya muundo wa Kiswahili.
- source_word: ὁ λεγόμενος
  choice: yule mtu aliyeitwa
  rationale: Muundo huu unamtambulisha mtu kwa jina lake bila dharau inayoweza kudokezwa na usemi kama ‘anayejiita.’
- source_word: Βαραββᾶς
  choice: Baraba
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: μετὰ τῶν στασιαστῶν
  choice: pamoja na waasi
  rationale: στασιασταί ni washiriki wa uasi au maasi; ‘waasi’ ni neno la kawaida, wazi, na linalofaa muktadha wa kisiasa na jinai.
- source_word: δεδεμένος
  choice: alikuwa amefungwa
  rationale: Kauli timilifu tendwa inaeleza hali ya kuwa amefungwa; tafsiri hii inadumisha maana halisi bila kuibadili tu kuwa ‘alikuwa gerezani.’
- source_word: οἵτινες
  choice: waliokuwa
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu waasi; muundo wa ‘waliokuwa’ ni wa asili katika Kiswahili.
- source_word: ἐν τῇ στάσει
  choice: katika uasi
  rationale: στάσις hapa ni uasi au maasi dhidi ya mamlaka, si fujo za kawaida tu. ‘Uasi’ pia huhifadhi uhusiano wa kileksia na ‘waasi.’
- source_word: φόνον πεποιήκεισαν
  choice: walikuwa wameua
  rationale: Muundo unaonyesha tendo la kuua lililokuwa limetendeka kabla ya wakati wa simulizi. Kiswahili cha kawaida hutumia ‘walikuwa wameua’; Kigiriki hakitaji wazi idadi ya waliouawa.
