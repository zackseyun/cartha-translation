  text: Naye baada ya kupata habari kutoka kwa mkuu wa askari mia, alimpa Yosefu maiti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: baada ya kupata habari
  rationale: Kauli hii ya wakati inaonyesha kwamba Pilato alichukua hatua baada ya kuthibitishiwa habari; ‘kupata habari’ ni Kiswahili cha kawaida kinachohifadhi mfuatano huo bila kuongeza kitu mahsusi kisichotajwa katika Kigiriki.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: kutoka kwa mkuu wa askari mia
  rationale: ἀπό pamoja na jenitivi huonyesha chanzo cha habari. ‘Mkuu wa askari mia’ ni istilahi ya kihistoria inayoeleweka kwa afisa wa Kirumi aliyeitwa centurion.
- source_word: ἐδωρήσατο
  choice: alimkabidhi
  rationale: Kitenzi hiki hapa kina maana ya kutoa au kuruhusu apewe kama tendo la fadhili au mamlaka. ‘Alimkabidhi’ kinafaa katika muktadha wa Pilato kuidhinisha Yosefu apewe maiti.
- source_word: πτῶμα
  choice: maiti
  rationale: Neno hili humaanisha mwili wa mtu aliyekufa. ‘Maiti’ ni wazi, sahihi, na ya heshima katika Kiswahili, huku likihifadhi uwazi wa neno la Kigiriki.
- source_word: τῷ Ἰωσήφ
  choice: Yosefu
  rationale: Dativi humtaja mpokeaji; kiambishi cha yambwa katika ‘alimkabidhi’ pamoja na jina ‘Yosefu’ kinaonyesha kwamba ndiye aliyekabidhiwa maiti.
