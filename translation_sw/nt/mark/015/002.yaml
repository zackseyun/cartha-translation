base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: sw
  text: Pilato akamwuliza Yesu, “Je, wewe ni Mfalme wa Wayahudi[a]?” Yesu akamjibu, “Wewe unasema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea.” Hapa maneno “Mfalme wa Wayahudi” yanaonyesha shtaka la kawaida la kisiasa lililoletwa mbele ya Pilato.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “Wewe unasema”; au kwa uwazi zaidi, “Hayo ndiyo unayosema.” Jibu la Yesu ni fupi na linaacha kiwango fulani cha utata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: akamuuliza
  rationale: Kitenzi hiki humaanisha kuuliza au kuhoji. “Akamuuliza” ni cha kawaida na cha asili katika Kiswahili bila kuongeza wazo la mahojiano rasmi ambalo halijawekwa wazi na neno lenyewe.
- source_word: Σὺ εἶ
  choice: Je, wewe ni
  rationale: Muundo huu ni swali la moja kwa moja, na kiwakilishi kilichotajwa wazi kinasisitizwa kwa kutafsiriwa “wewe.”
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: “Mfalme” huhifadhi maana ya kifalme pamoja na uzito wa kisiasa wa shtaka lililo mbele ya Pilato; “mtawala” lingekuwa pana mno.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Katika simulizi la mateso mbele ya Pilato, “Mfalme wa Wayahudi” ni cheo au shtaka la kisiasa linalotambulika. “Watu wa Yudea” linawezekana kileksika lakini halifai sana hapa.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: akamjibu
  rationale: Muundo wa Kigiriki una kishirikishi “akijibu” na wakati uliopo wa kihistoria “anasema.” Kiswahili cha masimulizi huwasilisha maana hiyo kwa kawaida na kwa ufupi kwa “akamjibu.”
- source_word: Σὺ λέγεις
  choice: Wewe ndiye unayesema
  rationale: Jibu hili fupi linaweka kauli hiyo kinywani mwa Pilato bila kuibadili kuwa ndiyo iliyo wazi au kuwa ukanushaji. Pia ni la asili zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno “Wewe unasema.”
theological_decisions:
- issue: Nguvu ya jibu la Yesu Σὺ λέγεις
  choice: 'Jibu lenye kujizuia na lenye kiwango cha utata: “Wewe ndiye unayesema.”'
  alternative: “Ndiyo, ni kama unavyosema,” au tafsiri ya moja kwa moja “Wewe unasema.”
  rationale: Kigiriki hakina neno la wazi la “ndiyo.” Tafsiri inapaswa kuhifadhi mvutano huo badala ya kulifanya jibu kuwa uthibitisho kamili au ukanushaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Jina “Yesu” limetumiwa badala ya kiwakilishi pekee ili marejeo ya wahusika wawili wa kiume yawe wazi kwa msomaji. Herufi kubwa katika “Mfalme” inaonyesha matumizi yake kama cheo katika swali bila kulazimisha tafsiri ya kitheolojia.
