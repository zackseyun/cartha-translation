lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza kwa urahisi simulizi kutoka mstari uliotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: κατηγόρουν
  choice: waliendelea kumshtaki
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha tendo lililokuwa likiendelea au kurudiwa; ‘waliendelea kumshtaki’ huonyesha hali hiyo kwa Kiswahili cha kawaida.
- source_word: αὐτοῦ
  choice: -m- katika ‘kumshtaki’
  rationale: Kiambishi cha yambwa kinamtaja Yesu kama mtu aliyeshtakiwa na kwa kawaida huunganishwa ndani ya kitenzi cha Kiswahili.
- source_word: οἱ ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Neno hili linawarejelea wakuu wa mamlaka ya kikuhani, si watu wengi waliokuwa na cheo cha kuhani mkuu kwa wakati mmoja.
- source_word: πολλά
  choice: kwa mambo mengi
  rationale: Huhifadhi upana wa masuala mengi ya mashtaka bila kuyafanya yote kuwa mashitaka rasmi ya kisheria.
