  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: sw
  text: Yule akida, aliyekuwa amesimama akimkabili Yesu, alipoona jinsi Yesu alivyokata roho, alisema, “Hakika, mtu huyu alikuwa Mwana wa Mungu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa Mungu.” Kirai cha Kigiriki kinaweza kueleweka kwa maana ya kisifa au isiyo bainifu; lakini katika muktadha wa Marko huenda kina nguvu ya cheo “Mwana wa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: alipoona
  rationale: Kirai tegemezi cha wakati ‘alipoona’ kinawakilisha vizuri matumizi ya kihusishi ya ἰδών; δέ ni kiunganishi chepesi kisichohitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: κεντυρίων
  choice: akida
  rationale: ‘Akida’ ni neno la Kiswahili linalotumika kwa ofisa wa jeshi la Roma aliyeitwa centurion, na linahifadhi cheo badala ya kukifanya kuwa ‘ofisa’ kwa ujumla.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: aliyekuwa amesimama akimkabili Yesu
  rationale: ‘Alikuwa amesimama’ linaonyesha hali ya kusimama iliyokuwapo tayari, na ‘akimkabili’ linahifadhi maana ya kuwa upande wa pili huku akimwelekea. Jina ‘Yesu’ limetumiwa badala ya kiwakilishi ili kuzuia utata wa viwakilishi katika Kiswahili.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: jinsi Yesu alivyokata roho
  rationale: ‘Kukata roho’ ni nahau ya kawaida na yenye uzito inayomaanisha kutoa pumzi ya mwisho; ‘jinsi ... alivy-’ linahifadhi οὕτως na kuonyesha kwamba akida aliitikia namna Yesu alivyokufa.
- source_word: Ἀληθῶς
  choice: Hakika
  rationale: ‘Hakika’ linafikisha uthibitisho wa dhati na wa wazi wa ἀληθῶς katika masimulizi yenye hadhi.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: mtu huyu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kumrejelea Yesu kama mtu huyo aliyekuwa mbele ya akida.
- source_word: υἱὸς θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muktadha wa Marko, kirai hiki kina uzito wa cheo cha Kikristo, huku Kiswahili kisicho na vibainishi vya aina ya ‘a/the’ kikiacha kiasi fulani cha utata wa muundo wa Kigiriki. Herufi kubwa inaonyesha usomaji wa cheo katika matini kuu.
- source_word: ἦν
  choice: alikuwa
  rationale: Wakati uliopita wa kitenzi cha Kigiriki umehifadhiwa kwa ‘alikuwa’ bila kuugeuza kuwa wakati wa sasa.
theological_decisions:
- issue: Nguvu ya υἱὸς θεοῦ katika kauli ya akida
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Katika simulizi la Marko, ‘Mwana wa Mungu’ ni cheo muhimu kinachomhusu Yesu. Hata hivyo, kwa kuwa kirai cha Kigiriki hakina kibainishi na kinaweza kueleweka kwa namna ya kisifa au isiyo dhahiri, usomaji mbadala umehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi na wenye hadhi. ‘Akida’ huhifadhi cheo cha kijeshi; kurudiwa kwa jina ‘Yesu’ kunazuia utata wa kiwakilishi bila kubadili mhusika anayerejelewa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
