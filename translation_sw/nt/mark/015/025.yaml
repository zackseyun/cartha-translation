  text: Ilikuwa saa tatu[a], nao wakamsulubisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu saa 9:00 asubuhi, kwa kufuata namna ya kawaida ya Wayahudi ya kuhesabu saa.
