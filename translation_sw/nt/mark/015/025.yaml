lexical_decisions:
- source_word: Ἦν
  choice: Ilikuwa
  rationale: Kitenzi cha hali ya kutokamilika cha εἰμί kinatumika kutaja wakati; Kiswahili kwa kawaida hutumia muundo usio na mtendaji, “ilikuwa.”
- source_word: δὲ
  choice: nao
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi, si lazima kiwe cha kuonyesha upinzani; hapa maana yake inaakisiwa kwa “nao” katika kishazi kinachofuata bila kuongeza “basi” au “sasa” mwanzoni.
- source_word: ὥρα τρίτη
  choice: saa tatu
  rationale: Huhifadhi mfumo wa kale wa kutaja wakati kama ulivyo katika chanzo; ufafanuzi wa saa ya kisasa unawekwa katika tanbihi.
- source_word: ἐσταύρωσαν
  choice: wakamsulubisha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumuua mtu kwa kumsulubisha.
- source_word: αὐτόν
  choice: -m-
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu kinaunganishwa kiasili ndani ya kitenzi cha Kiswahili “wakamsulubisha.”
theological_decisions:
- issue: Usemi wa wakati na uhusiano wake na mpangilio wa matukio
  choice: Kubakiza “saa tatu” katika matini kuu.
  alternative: Kutafsiri “karibu saa tatu asubuhi.”
  rationale: Aya yenyewe inatumia mfumo wa kale wa kuhesabu saa bila kuugeuza kuwa wakati wa saa ya kisasa. Kuuhifadhi huepuka kuingiza suluhisho la upatanisho wa taarifa za nyakati ndani ya tafsiri; ufafanuzi unatolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. “Kusulubisha” ni neno linalotambulika na wasomaji wengi na linafaa kwa muktadha wa kibiblia. Alama ya tanbihi [a] imewekwa mara tu baada ya usemi wa wakati.
