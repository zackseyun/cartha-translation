id: MRK.15.34
reference: Mark 15:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: sw
  text: Ilipofika saa tisa, Yesu akalia kwa sauti kubwa, “Eloi, Eloi, lema sabakthani?”[a] Maana yake ni, “Mungu wangu, Mungu wangu, kwa nini umeniacha?”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na mapokeo mengi yana “lama sabakthani” badala ya “lema sabakthani.”
    reason: textual_variant
  - marker: b
    text: Maneno ya Yesu yanarejelea Zaburi 22:1.
    reason: cross_reference
  - marker: c
    text: Au, “kwa sababu gani umeniacha?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: ilipofika saa tisa
  rationale: Huhifadhi namna ya kuhesabu saa katika matini ya asili, na katika matumizi ya Kiswahili ‘saa tisa’ pia hueleweka kiasili kuwa karibu saa tatu alasiri.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: akalia kwa sauti kubwa
  rationale: Huonyesha kilio cha sauti kuu bila kudokeza tu tendo la kulia machozi; ni lugha ya kawaida, yenye uzito unaofaa tukio hili.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloi, Eloi, lema sabakthani?
  rationale: Huhifadhi maneno ya Kisemiti kama Marko alivyoyahifadhi kabla ya kuyatafsiri. ‘Lema’ hufuata λεμά katika SBLGNT, na ‘sabakt(h)ani’ imeandikwa kwa namna inayosomeka katika tahajia ya Kiswahili.
- source_word: μεθερμηνευόμενον
  choice: maana yake ni
  rationale: Ni njia ya asili ya Kiswahili ya kutambulisha tafsiri au ufafanuzi wa maneno yaliyotangulia.
- source_word: εἰς τί
  choice: kwa nini
  rationale: Katika muktadha huu msemo unauliza sababu; ‘kwa nini’ ni sawa, wazi, na wa kawaida zaidi kuliko ‘kwa sababu gani’.
- source_word: ἐγκατέλιπές με
  choice: umeniacha
  rationale: Huonyesha kuachwa au kutengwa kwa uzito unaofaa, huku ikidumisha mwangwi wa Zaburi 22:1 na kuwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa kilio cha Yesu na Zaburi 22:1
  choice: Kuhifadhi kilio cha kuachwa kama kilivyo na kuonyesha mwangwi wa Zaburi kwa tanbihi tu.
  alternative: Kulainisha maana ya kuachwa au kuongeza maelezo ya kitheolojia katika matini kuu.
  rationale: Marko anaacha mvutano wa kitheolojia usimame. Tafsiri haipaswi kuamua kwa msomaji namna kuachwa huku kunavyohusiana na uhusiano wa Mwana na Baba.
- issue: Uwasilishaji wa maneno ya Kisemiti ya Yesu
  choice: Kuyahifadhi kwa unukuzi na kisha kutoa maana yake, kama Marko anavyofanya.
  alternative: Kutoa tafsiri yake pekee au kuyabadilisha yawe ‘Eli, Eli’ kwa kufuata simulizi la Mathayo.
  rationale: Hii huheshimu muundo wa Marko na kuepuka kuoanisha kimya kimya simulizi zake na za Mathayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi bila kupoteza uzito wa tukio. Unukuzi wa Kisemiti umehifadhiwa, lakini ‘sabachthani’ imewasilishwa kama ‘sabakthani’ ili ilingane na sauti na tahajia inayosomeka kwa Kiswahili.
