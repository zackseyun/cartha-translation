base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: sw
  text: Nao wakamvika vazi la zambarau[a]; kisha, baada ya kusokota taji ya miiba, wakamtia taji hilo kichwani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zambarau”; Kigiriki hakitaji wazi aina ya vazi, ingawa muktadha unaonyesha kitu cha kuvalishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: wakamvika
  rationale: Kitenzi hiki humaanisha kumvalisha mtu. “Wakamvika” ni Kiswahili cha kawaida na huhifadhi maana ya kitendo kinachofanywa kwa Yesu.
- source_word: πορφύραν
  choice: vazi la zambarau
  rationale: Nomino ya Kigiriki inaweza kumaanisha kitambaa cha zambarau au vazi la zambarau. Kwa kuwa kitendo ni kumvika mtu, “vazi la zambarau” huleta maana wazi bila kulibainisha kuwa joho.
- source_word: πλέξαντες
  choice: wakasokota
  rationale: Kitenzi hiki huonyesha kuunganisha kwa kupinda au kusokota. Mfuatano wa Kiswahili unaonyesha kuwa walitengeneza taji kabla ya kumvika.
- source_word: ἀκάνθινον
  choice: ya miiba
  rationale: Kivumishi kinaonyesha kuwa taji lilitengenezwa kwa miiba; “ya miiba” ni usemi wa kawaida wa Kiswahili.
- source_word: στέφανον
  choice: taji
  rationale: Katika muktadha wa askari kuigiza kwa dhihaka heshima ya kifalme, “taji” huwasilisha vizuri taswira hiyo kuliko “shada.”
- source_word: περιτιθέασιν
  choice: kumvika kichwani
  rationale: Kitenzi humaanisha kuweka kitu kuzunguka au juu ya mtu. Kwa kuwa kitu hicho ni taji, “kumvika kichwani” ni Kiswahili cha asili na huweka wazi mahali panapodokezwa na muktadha.
theological_decisions:
- issue: Taswira ya kifalme ya dhihaka katika kudhalilishwa kwa Yesu
  choice: Kutumia “taji” kwa στέφανον
  alternative: shada
  rationale: Mavazi ya zambarau na taji ya miiba yanaonyesha askari wakiufanyia mzaha ufalme wa Yesu. “Taji” huhifadhi uzito wa taswira hiyo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi mfuatano na taswira ya kifalme ya dhihaka katika Kigiriki.
