base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: sw
  text: Walipokwisha kumdhihaki, wakamvua lile vazi la zambarau[a] na kumvika nguo zake mwenyewe. Kisha wakampeleka nje ili wamsulubishe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lile joho la zambarau.” Kigiriki kinasema tu “ile zambarau,” huku vazi likieleweka kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinatumia kishazi kinachoonyesha kusudi: “ili wamsulubishe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: kumdhihaki
  rationale: Kitenzi hiki humaanisha kumfanyia mtu dhihaka au kejeli. ‘Kumdhihaki’ ni cha kawaida, chenye hadhi, na kinafaa katika simulizi hili zito.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: wakamvua lile vazi la zambarau
  rationale: Muundo wa Kigiriki unaonyesha kwamba waliliondoa vazi walilokuwa wamemvika Yesu. ‘Wakamvua’ huhifadhi kwamba walimfanyia kitendo hicho, na ‘vazi’ huweka wazi nomino iliyodokezwa na πορφύραν.
- source_word: πορφύραν
  choice: vazi la zambarau
  rationale: Neno la Kigiriki linasema kihalisi ‘zambarau,’ huku kitu cha kuvaa kikieleweka kutokana na muktadha. ‘Vazi la zambarau’ ni wazi bila kulazimisha aina maalumu ya vazi.
- source_word: ἐνέδυσαν αὐτὸν
  choice: kumvika
  rationale: Kitenzi kinamaanisha kumvalisha mtu. ‘Kumvika’ ni usemi wa kawaida wa Kiswahili na unalingana vizuri na kitendo kilichotangulia cha kumvua.
- source_word: τὰ ἱμάτια τὰ ἴδια
  choice: nguo zake mwenyewe
  rationale: ‘Nguo’ ni tafsiri ya kawaida ya ἱμάτια, na ‘zake mwenyewe’ huhifadhi msisitizo wa τὰ ἴδια kwamba walimrudishia mavazi yake binafsi.
- source_word: ἐξάγουσιν
  choice: wakampeleka nje
  rationale: Hii ni kauli ya wakati uliopo wa kihistoria katika simulizi. Kiswahili cha masimulizi kwa kawaida hutumia mfuatano wa ‘waka-’; ‘kumpeleka nje’ pia huonyesha kwamba alikuwa chini ya ulinzi wao.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: ili wamsulubishe
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi. ‘Ili wamsulubishe’ huhifadhi wazi muundo huo wa kusudi kwa Kiswahili cha kawaida.
- source_word: σταυρώσωσιν
  choice: wamsulubishe
  rationale: Kitenzi kinataja moja kwa moja tendo la kusulubisha; tafsiri hii ni sahihi, fupi, na inayofahamika.
theological_decisions:
- issue: Maelezo ya kudhalilishwa kwa Yesu kabla ya kusulubiwa
  choice: Kutafsiri moja kwa moja dhihaka, kuondolewa kwa vazi la kifalme la kejeli, kuvikwa tena nguo zake, na kupelekwa nje kwa kusudi la kusulubishwa.
  alternative: Kuongeza maelezo ya kitheolojia kuhusu maana ya dhihaka au ufalme wa Yesu.
  rationale: Aya yenyewe ni simulizi la moja kwa moja. Tafsiri haiingizi ufafanuzi wa kimadhehebu, lakini inadumisha udhalilishaji unaoonekana katika matendo yaliyoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya ‘waka-’ umetumiwa kwa mtiririko wa kawaida wa simulizi. ‘Vazi’ limechaguliwa badala ya aina maalumu zaidi kama ‘joho’ ili kuhifadhi kutokuwa bayana kwa πορφύραν.
