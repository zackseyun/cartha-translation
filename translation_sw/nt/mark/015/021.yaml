  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: sw
  text: Wakamlazimisha[b] mtu fulani aliyekuwa akipita hapo, Simoni wa Kirene, aliyekuwa akitoka mashambani[a]—baba yao Aleksanda na Rufo—aubebe msalaba wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitoka shambani.” Neno la Kigiriki linaweza kumaanisha shamba au maeneo ya mashambani.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “wakamlazimisha” humaanisha kumshurutisha mtu afanye huduma.
    reason: cultural_note
  - marker: c
    text: Wengine huelewa “msalaba” hapa kuwa hasa boriti ya msalaba, lakini maandishi ya Kigiriki yanasema tu “msalaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: wakamlazimisha
  rationale: Kitenzi hiki kinaonyesha kulazimishwa kufanya huduma, si kuombwa tu; ‘wakamlazimisha’ ni Kiswahili cha kawaida kinachohifadhi maana ya shuruti.
- source_word: παράγοντά τινα
  choice: mtu fulani aliyekuwa akipita hapo
  rationale: Kirai hiki humtambulisha mtu asiyeainishwa aliyekuwa akipita mahali hapo; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: Σίμωνα Κυρηναῖον
  choice: Simoni wa Kirene
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na utambulisho wa kijiografia umeelezwa kwa ‘wa Kirene.’
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: aliyekuwa akitoka mashambani
  rationale: ἀγρός inaweza kumaanisha shamba au maeneo ya mashambani. ‘Akitoka mashambani’ inaonyesha kuingia kutoka nje ya eneo la mjini bila kudai kwamba alikuwa ametoka katika shamba moja maalumu.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: baba yao Aleksanda na Rufo
  rationale: Utambulisho huu wa Simoni umehifadhiwa moja kwa moja bila kukisia kwa nini wanawe walitajwa.
- source_word: ἵνα ἄρῃ
  choice: aubebe
  rationale: Baada ya kitenzi cha kulazimisha, muundo huu wa Kiswahili unaeleza kusudi kwa ufasaha na kuhifadhi maana ya kuuchukua na kuubeba.
- source_word: σταυρὸν
  choice: msalaba
  rationale: Neno la Kigiriki linasema ‘msalaba’; tafsiri haijalibana kuwa ‘boriti ya msalaba,’ jambo ambalo lingetegemea ujenzi wa kihistoria ulio mahususi zaidi kuliko maandishi.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi cha umilikaji kimehifadhiwa kama kilivyo katika Kigiriki; katika muktadha kinamrejelea Yesu.
theological_decisions:
- issue: Aina ya shuruti aliyowekewa Simoni
  choice: Simoni alilazimishwa kuubeba msalaba.
  alternative: Simoni aliombwa au akaandikishwa kufanya huduma bila kulazimishwa.
  rationale: ἀγγαρεύω lina maana ya kulazimisha mtu kufanya huduma. Tafsiri haipaswi kupunguza nguvu ya shuruti iliyomo katika simulizi.
- issue: Kitu mahususi alichobeba Simoni
  choice: msalaba
  alternative: boriti ya msalaba
  rationale: Ingawa maelezo fulani ya kihistoria hudhani kwamba aliyebeba ni boriti ya msalaba, maandishi ya Kigiriki yanatumia σταυρός, ‘msalaba’; hivyo tafsiri kuu haipaswi kuwa mahususi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umefanywa wa kawaida kwa wasomaji wa leo huku ukihifadhi utambulisho wa Simoni, hali ya kulazimishwa, na upana wa maana ya ἀγρός na σταυρός.
