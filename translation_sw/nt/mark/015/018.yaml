  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwamkia.” Kitenzi cha Kigiriki kinaweza kumaanisha salamu ya kawaida; katika muktadha huu kinadokeza salamu ya kiutaratibu yenye kejeli.
