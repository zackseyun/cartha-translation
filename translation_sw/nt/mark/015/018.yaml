lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi mtindo wa Marko wa kuunganisha matukio kwa urahisi na kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Kitenzi hiki kinaonyesha mwanzo wa kitendo kinachoendelea na kuhifadhi mwendo wa simulizi.
- source_word: ἀσπάζεσθαι
  choice: kumsalimu kwa dhihaka
  rationale: Kwa kawaida kitenzi hiki humaanisha ‘kusalimu,’ lakini muktadha unaonyesha salamu rasmi ya kejeli. Kirai ‘kwa dhihaka’ kinaweka wazi namna ya kitendo bila kubadili yaliyosemwa moja kwa moja.
- source_word: Χαῖρε
  choice: Salamu
  rationale: Hapa neno hili ni kauli ya salamu, si agizo halisi la kufurahi. ‘Salamu’ ni ya asili katika Kiswahili na inaweza kubeba salamu rasmi ya kejeli katika muktadha huu.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Hifadhi cheo cha kifalme kwa usemi wa moja kwa moja; ‘Wayahudi’ ndiyo maana iliyozoeleka na inayofaa katika kichwa hiki cha simulizi la mateso.
theological_decisions:
- issue: Kuwasilisha salamu ya kejeli kwa Yesu bila kupunguza maana yake ya kifalme
  choice: Kutumia ‘Salamu, Mfalme wa Wayahudi!’ huku dhihaka ikitajwa katika simulizi
  alternative: ‘Shangilia, Mfalme wa Wayahudi!’ au ‘Tunakul salimu, Mfalme wa Wayahudi!’
  rationale: ‘Salamu’ huonyesha matumizi ya Χαῖρε kama salamu rasmi, na ‘kwa dhihaka’ huhifadhi kejeli ya askari bila kuingiza tafsiri ya kimadhehebu.
- issue: Upeo wa maana ya Ἰουδαίων
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Neno la Kigiriki linaweza kumaanisha Wayahudi au watu wa Yudea; katika cheo hiki cha simulizi la mateso, ‘Mfalme wa Wayahudi’ ndilo tumizi la kawaida, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi la kawaida; usemi wa moja kwa moja ni mfupi na rasmi. Alama zote za tanbihi zimewekwa katika maandishi makuu.
