  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: sw
  text: Kisha mtu fulani akakimbia, akajaza sifongo kwa divai yenye uchachu[a], akaiweka kwenye mwanzi, akampa anywe, huku akisema, “Mwacheni.[b] Hebu tuone kama Eliya anakuja kumshusha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Divai yenye uchachu” ni kinywaji cha divai ya bei nafuu chenye uchachu; si lazima iwe siki inayotumiwa kupikia leo.
    reason: cultural_note
  - marker: b
    text: Au, “Ngojeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: akakimbia
  rationale: Kauli ya kushiriki ya wakati uliopita inaonyesha tendo la kwanza katika mfululizo wa simulizi; muundo wa Kiswahili wenye ‘aka-’ unawasilisha mfuatano huo kwa kawaida.
- source_word: τις καὶ
  choice: mtu mmoja
  rationale: τις humtaja mtu asiyeainishwa. Katika Kiswahili ‘mtu mmoja’ ni ya kawaida kuliko ‘mtu fulani’ hapa; καί haihitaji kutafsiriwa kando.
- source_word: γεμίσας σπόγγον ὄξους
  choice: akajaza sifongo divai chachu
  rationale: ὄξος ni divai iliyochacha yenye uchachu, kinywaji cha bei nafuu; ‘divai chachu’ huepuka dhana ya siki ya kisasa ya kupikia.
- source_word: περιθεὶς καλάμῳ
  choice: akaiweka kwenye mwanzi
  rationale: κάλαμος ni mwanzi; kifungu kinaonyesha sifongo kuwekwa kwenye mwanzi ili kuinuliwa hadi kwa Yesu.
- source_word: ἐπότιζεν αὐτόν
  choice: akampa anywe
  rationale: Kitenzi kina maana ya kumpa mtu kitu anywe. Ingawa wakati usiotimilika unaweza kuonyesha tendo linaloendelea au jaribio, Kiswahili cha simulizi hutumia kwa kawaida ‘akampa anywe’ bila kudai wazi kwamba alikunywa.
- source_word: Ἄφετε
  choice: Mwacheni
  rationale: Amri hii kimsingi inawataka wengine waache kumwingilia Yesu kwa muda. Uwezekano wa maana ya kimuktadha ‘Ngojeni’ umehifadhiwa katika tanbihi.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Hebu tuone kama Eliya atakuja
  rationale: Muundo huu unaonyesha pendekezo la kusubiri na kuona kama Eliya ataingilia kati; wakati ujao ni wa kawaida katika Kiswahili kwa tukio linalotarajiwa mara moja.
- source_word: καθελεῖν αὐτόν
  choice: kumshusha
  rationale: Katika muktadha wa kusulubiwa, καθαιρέω ni kumshusha mtu kutoka mahali palipoinuka, yaani msalabani.
theological_decisions:
- issue: Kusudi la msemaji katika Ἄφετε
  choice: ‘Mwacheni’ kama amri ya kutomwingilia Yesu kwa muda
  alternative: ‘Ngojeni’ kama usemi wa kuwataka waliopo wasubiri
  rationale: Maana ya msingi ya ἀφίημι imehifadhiwa katika maandishi, huku maana ya kimuktadha iliyo ya kawaida ikiwekwa katika tanbihi ili kutokomesha utata wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi kwa viambishi vya ‘aka-’. ‘Sifongo,’ ‘mwanzi,’ na ‘kumshusha’ ni maneno wazi kwa wasomaji wa sasa huku yakihifadhi picha ya chanzo. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
