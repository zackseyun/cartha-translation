  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: sw
  text: Nao, pamoja naye, wanasulubisha wanyang'anyi wawili[a], mmoja upande wake wa kulia na mwingine upande wake wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majambazi”; huenda “waasi” ikiwa neno hili linaeleweka kuwa na dokezo la kisiasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Kirai hiki kinaonyesha uandamani; “pamoja naye” ni Kiswahili cha kawaida na huweka wazi kwamba wale wawili walisulubishwa wakati mmoja na Yesu.
- source_word: σταυροῦσιν
  choice: wanawasulubisha
  rationale: Kitenzi ni cha wakati uliopo wa kihistoria, nafsi ya tatu wingi. Wakati uliopo umehifadhiwa ili kudumisha usimulizi hai wa Marko; kiambishi cha yambwa “-wa-” kinawarejelea wanyang’anyi wawili.
- source_word: δύο λῃστάς
  choice: wanyang'anyi wawili
  rationale: λῃστής inaweza kumaanisha mnyang’anyi au jambazi, na wakati mwingine inaweza kuwa na dokezo la uasi wa kisiasa. “Wanyang’anyi” ni neno pana, linaloeleweka, lisilolazimisha maana ya kisiasa ambayo mstari huu hauibainishi.
- source_word: ἕνα ἐκ δεξιῶν
  choice: mmoja upande wake wa kulia
  rationale: Nahau hii inaonyesha mahali upande wa kulia. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kwamba upande huo ni wa Yesu.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: mwingine upande wake wa kushoto
  rationale: εὐώνυμος hapa inaonyesha upande wa kushoto. “Mwingine” huunda ulinganifu wa asili wa Kiswahili na “mmoja,” huku “wake” ikihifadhi rejeo kwa Yesu.
theological_decisions:
- issue: Maana ya λῃσταί katika simulizi la kusulubiwa
  choice: wanyang'anyi
  alternative: majambazi; huenda waasi ikiwa neno lina dokezo la kisiasa
  rationale: Neno la Kigiriki linaweza kutaja wanyang’anyi wenye kutumia nguvu au majambazi, na katika baadhi ya mazingira linaweza kuhusishwa na uasi. Mstari huu wenyewe hauthibitishi maana ya kisiasa, kwa hiyo matini kuu inadumisha maana pana na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Wakati uliopo wa kihistoria umehifadhiwa kwa mtindo hai wa usimulizi wa Marko.
