  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: sw
  text: 'Na maandishi ya shtaka dhidi yake yaliandikwa hivi: “Mfalme wa Wayahudi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mfalme wa watu wa Yudea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: maandishi
  rationale: Katika muktadha huu neno hilo linamaanisha taarifa iliyoandikwa na kuwekwa msalabani; “maandishi” ni Kiswahili cha kawaida na chenye heshima.
- source_word: αἰτία
  choice: shtaka dhidi yake
  rationale: Hapa αἰτία ni sababu rasmi ya kisheria iliyotolewa kwa hukumu yake; “shtaka dhidi yake” linafikisha maana hiyo bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐπιγεγραμμένη
  choice: yaliandikwa hivi
  rationale: Muundo wa Kigiriki unaonyesha kuwa maneno hayo yalikuwa yameandikwa na kubaki yakionekana. “Yaliandikwa hivi” ni usemi wa asili unaotambulisha yaliyomo katika maandishi.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: Ni cheo cha kifalme katika maneno ya shtaka; herufi kubwa inafaa mwanzoni mwa nukuu.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Katika simulizi la mateso, kifungu hiki ni jina linalotambulika la kisiasa na kijamii katika shtaka dhidi ya Yesu. “Wayahudi” ndilo neno la kawaida katika Kiswahili, huku maana mbadala ya kijiografia ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Ἰουδαίων katika cheo kilichowekwa msalabani
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: “Wayahudi” huhifadhi cheo kinachojulikana katika simulizi za mateso bila kukifungia kwa maana ya kijiografia pekee. Kwa kuwa Ἰουδαῖος inaweza kumaanisha pia mtu wa Yudea katika baadhi ya miktadha, uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yaliandikwa hivi” unaepuka urudiaji mzito wa “maandishi ... yalikuwa yameandikwa” huku ukihifadhi maana ya taarifa iliyoandikwa.
