translation:
  language: sw
  text: Na Andiko likatimizwa, lisemalo, “Naye alihesabiwa pamoja na wakosaji.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki, kutia ndani Sinaitiko na Vatikano za karne ya nne, wala katika tafsiri za kale za Kikopti. Hata hivyo, umehifadhiwa katika mapokeo ya hati nyingi za Kibizanti na katika mapokeo ya Kilatini. Huenda waandishi wa baadaye waliuongeza ili kupatanisha kifungu hiki na Luka 22:37, ambayo inanukuu Isaya 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη (πληρόω)
  choice: likatimizwa
  rationale: Katika muktadha wa unabii wa Maandiko, kitenzi hiki cha kutendwa kinaonyesha kwamba neno lililotabiriwa lilipata utimilifu.
- source_word: ἀνόμων (ἄνομος)
  choice: waasi
  rationale: Neno hili humaanisha watu wasiofuata sheria au wanaoivunja; “waasi” ni la kawaida, lenye uzito wa kimaadili, na linafaa katika dondoo la Isaya 53:12.
- source_word: ἐλογίσθη (λογίζομαι)
  choice: alihesabiwa
  rationale: Huwasilisha hali ya kuwekwa au kuorodheshwa katika kundi moja na wengine, bila kudokeza tu kuhesabu kwa tarakimu.
- source_word: γραφή
  choice: Andiko
  rationale: Umoja wenye herufi kubwa unaonyesha kifungu cha Maandiko kinachonukuliwa, kwa lugha ya kawaida na yenye heshima.
theological_decisions:
- issue: Uhusiano wa kauli hii na unabii
  choice: Kudumisha kauli ya moja kwa moja kwamba Andiko lilitimizwa
  alternative: Kusema tu kwamba jambo hilo lilitokea kama ilivyotabiriwa
  rationale: Muundo wa Kigiriki unasema wazi ἡ γραφὴ ἐπληρώθη; tafsiri haipaswi kupunguza dai hilo la kitheolojia.
- issue: Utambulisho wa ἀνόμων
  choice: “waasi”
  alternative: “wahalifu” au “watu wasio na sheria”
  rationale: “Waasi” huhifadhi upana wa kimaadili na kitheolojia wa neno badala ya kulifanya lirejelee makosa ya jinai pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nalo … lisemalo” huhifadhi muunganiko wa Καὶ na mtindo wa kunukuu Maandiko bila kufanya sentensi kuwa nzito kupita kiasi.
