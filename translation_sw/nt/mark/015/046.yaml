  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: sw
  text: Baada ya kununua kitambaa cha kitani[a], alimshusha, akamfunika kwa kitambaa hicho, na akamlaza ndani ya kaburi lililokuwa limechongwa mwambani[b]. Kisha akavingirisha jiwe mpaka kwenye mwingilio wa kaburi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shuka la kitani” au “sanda” kwa neno la Kigiriki σινδών.
    reason: lexical_alternative
  - marker: b
    text: Au “lililokuwa limekatwa ndani ya mwamba.”
    reason: lexical_alternative
  - marker: c
    text: Au “mpaka kwenye mlango wa kaburi”; neno la Kigiriki θύρα linaweza kumaanisha “mlango” au “mwingilio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: kitambaa cha kitani / kitambaa hicho
  rationale: Neno σινδών humaanisha kitambaa cha kitani ambacho katika muktadha huu kilitumika kuufunika mwili kwa maziko. Tafsiri hii haitilii mkazo zaidi ya uliomo katika Kigiriki; katika kutajwa mara ya pili, 'kitambaa hicho' hurejelea kile kilichonunuliwa.
- source_word: καθελών
  choice: alimshusha
  rationale: Katika muktadha huu, kitenzi kinamaanisha kuushusha mwili wa Yesu kutoka msalabani. Kiswahili kinaweza kutumia kiwakilishi cha nafsi kama kilivyo katika chanzo bila kuongeza neno 'mwili.'
- source_word: ἐνείλησεν
  choice: akamfunika
  rationale: Kitenzi humaanisha kuzungushia, kukunja ndani ya kitambaa, au kufunika. 'Akamfunika kwa kitambaa' ni ya kawaida katika Kiswahili na inaonyesha tendo la maandalizi ya maziko bila kuongeza maelezo yasiyotajwa.
- source_word: ἔθηκεν
  choice: akamlaza
  rationale: Katika muktadha wa kuuweka mwili kaburini, 'akamlaza' ni lugha ya kawaida na yenye heshima kuliko 'akamweka,' huku ikihifadhi maana ya τίθημι.
- source_word: μνημείῳ / μνημείου
  choice: kaburi / kaburi
  rationale: Hapa μνημεῖον ni mahali pa maziko palipochongwa mwambani. 'Kaburi' ndilo neno la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: λελατομημένον ἐκ πέτρας
  choice: lililokuwa limechongwa mwambani
  rationale: 'Kauli timilifu tendwa inaonyesha hali iliyokamilika: kaburi lilikuwa tayari limechongwa. ''Mwambani'' huonyesha kuwa lilichongwa katika mwamba, si kwamba lilijengwa tu kwa mawe.'
- source_word: προσεκύλισεν
  choice: akavingirisha ... na kuliegemeza
  rationale: Kitenzi kina wazo la kuviringisha kitu kuelekea au hadi kiguse kingine. Muundo huu wa Kiswahili huwasilisha mwendo wa jiwe na mahali lilipowekwa ili kufunga kaburi.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: kwenye mwingilio wa kaburi
  rationale: θύρα linaweza kumaanisha mlango au mwingilio. Kwa kaburi la mwambani, 'mwingilio' huepuka dhana isiyo ya lazima ya mlango wenye bawaba na kueleza uwazi uliofungwa kwa jiwe.
- source_word: ἀγοράσας
  choice: Baada ya kununua
  rationale: Kauli ya wakati uliopita inaonyesha kuwa ununuzi ulitangulia matendo yaliyofuata. 'Baada ya kununua' huonyesha mfuatano huo kwa Kiswahili cha kawaida.
