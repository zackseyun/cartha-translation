translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vyenye kiambishi -ka- umehifadhi mwendo wa simulizi, huku 'Baada ya kununua' ikibainisha wazi kuwa tendo hilo lilitangulia. Viwakilishi vya 'alimshusha,' 'akamfunika,' na 'akamlaza' vinafuata namna chanzo kinavyomtaja Yesu kama nafsi bila kulazimisha kuongeza 'mwili wake.'
