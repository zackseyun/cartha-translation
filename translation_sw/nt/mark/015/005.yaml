base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: sw
  text: Lakini Yesu hakujibu tena jambo lolote[a], hata Pilato akashangaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini Yesu hakutoa jibu lolote tena, na matokeo yake Pilato akastaajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wa kiasi na mashtaka yaliyotangulia pamoja na ukimya wa Yesu; “Lakini” ni ya kawaida na ya asili katika muktadha huu.
- source_word: οὐκέτι
  choice: tena
  rationale: Pamoja na kitenzi hasi “hakujibu,” neno hili linaonyesha kwamba Yesu hakuendelea kujibu, na hivyo linahifadhi maana ya wakati ya “si tena.”
- source_word: οὐδὲν
  choice: jambo lolote
  rationale: Katika sentensi hasi, “jambo lolote” huonyesha ukamilifu wa ukimya wa Yesu kwa Kiswahili cha kawaida.
- source_word: ἀπεκρίθη
  choice: hakujibu
  rationale: “Kujibu” ni neno la kawaida na linalofaa katika mazingira ya kuhojiwa mbele ya mamlaka.
- source_word: ὥστε
  choice: hata
  rationale: '“Hata” linaonyesha matokeo ya ukimya wa Yesu kwa mtiririko wa asili wa Kiswahili: Pilato akashangaa. Maana ya matokeo, si kusudi, imehifadhiwa.'
- source_word: θαυμάζειν
  choice: akashangaa
  rationale: Huwasilisha kwa lugha ya sasa mwitikio wa Pilato uliotokana na ukimya wa Yesu, bila kuongeza sababu au kiwango cha mshangao.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Ni umbo la jina hili lililozoeleka katika Kiswahili.
theological_decisions: []
