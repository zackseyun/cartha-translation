  text: Lakini wakapaza sauti tena, “Msulubishe!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: wa- (katika “wakapaza”)
  rationale: Kihusishi cha wingi kinachotumika kama nomino kinarejelea kundi lililotajwa katika muktadha. Kiswahili huonyesha nafsi na idadi katika kiambishi cha kitenzi, hivyo hakuna haja ya kuongeza nomino kama “watu” au “umati” ambayo haipo wazi katika mstari huu.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti ya kiasi na maneno ya Pilato yaliyotangulia; “Lakini” linawasilisha uhusiano huo kwa kawaida bila kuutia nguvu kupita kiasi.
- source_word: πάλιν
  choice: tena
  rationale: Linahifadhi wazi wazo la kurudiwa kwa kilio.
- source_word: ἔκραξαν
  choice: wakapaza sauti
  rationale: Kitenzi cha Kigiriki kinaashiria kutoa kilio kwa sauti kubwa. “Wakapaza sauti” ni usemi wa kawaida, wenye hadhi, unaoonyesha ukali wa kilio hicho.
- source_word: Σταύρωσον
  choice: Msulubishe
  rationale: Ni amri ya moja kwa moja katika umoja, iliyoelekezwa kwa Pilato. Katika Kiswahili, kiambishi “m-” kinabeba yambwa “yeye,” na umbo “-sulubishe” linatoa amri ya kumsulubisha kwa ufupi na kwa kawaida.
- source_word: αὐτόν
  choice: m- (katika “Msulubishe”)
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu kimewasilishwa kwa kiambishi cha yambwa “m-” ndani ya kitenzi, kama sarufi ya Kiswahili inavyodai kwa kawaida.
