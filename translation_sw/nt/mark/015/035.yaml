id: MRK.15.35
reference: Mark 15:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: sw
  text: Baadhi ya wale waliokuwa wamesimama pale waliposikia hayo, walikuwa wakisema, “Tazama, anamwita Eliya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anamwitia Eliya.”
    reason: Tofauti hii ya kileksia huonyesha uwezekano wa kuelewa φωνεῖ kuwa kumwita Eliya au kumwitia/kumwomba aje, bila kuingiza ufafanuzi huo katika matini kuu.
lexical_decisions:
- source_word: καί
  choice: (imewakilishwa kwa mwendelezo wa simulizi bila kiunganishi cha wazi)
  rationale: Katika Kiswahili, kuanza sentensi kwa ‘na’ hapa si lazima; mwendelezo wa simulizi unaeleweka bila kuongeza maana ya wakati.
- source_word: τινες τῶν παρεστηκότων
  choice: Baadhi ya wale waliokuwa wamesimama pale
  rationale: ‘Baadhi ya wale’ huhifadhi wazo la sehemu isiyobainishwa ya watu waliokuwapo, na ‘wamesimama pale’ huhifadhi maana ya mahali ya kitenzi kishirikishi.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Muundo wa ‘waliposikia’ unaonyesha kuwa kusikia kulitangulia kusema; ‘hayo’ limetolewa na muktadha na linaelekeza kwenye kilio cha Yesu.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu huhifadhi hali endelevu ya wakati usiotimilifu wa Kigiriki bila kudai wazi kwamba walirudia maneno hayo mara nyingi.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni neno la kawaida na lenye heshima la kuvuta uangalifu, bila kutumia lugha ya kizamani kupita kiasi.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: φωνεῖ
  choice: anamwita
  rationale: Huhifadhi wakati wa sasa katika usemi wa moja kwa moja na uhusiano wa moja kwa moja na ‘Eliya,’ bila kuongeza wazi ombi la msaada.
theological_decisions:
- issue: Kama ielezwe wazi kwamba watu hao walikosea kuelewa kilio cha Yesu kuwa mwito kwa Eliya
  choice: 'Kauli ya watu hao imetolewa moja kwa moja: ‘anamwita Eliya,’ bila maelezo ya msimulizi.'
  alternative: ‘Anamwitia Eliya’ au kuongeza kwamba walidhani alikuwa akimwita Eliya.
  rationale: Kigiriki kinaripoti walichosema watu hao, wala hakitoi maelezo ya moja kwa moja ya msimulizi kuhusu kosa lao. Muktadha unaacha kutokuelewa kwao kuonekana bila kulifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya ‘Eliya,’ mahali inapohusu tofauti ya tafsiri.
