base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: sw
  text: Lakini makuhani wakuu wakauchochea umati ili Pilato awaachilie Baraba badala ya Yesu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakauhamasisha umati.” Kitenzi cha Kigiriki kinaweza kumaanisha kuamsha au kuchochea kundi lichukue hatua iliyokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “afadhali.” Neno la Kigiriki huonyesha kwamba Baraba aachiliwe kwa kupendelewa kuliko Yesu, ambaye anaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini
  rationale: δέ hapa inaonyesha tofauti ndogo na matarajio yaliyotangulia; “Lakini” ni ya kawaida na inaendeleza simulizi kwa uwazi.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unarejelea uongozi wa juu wa kikuhani huko Yerusalemu. Usemi huu ni wa kawaida katika Kiswahili cha sasa na huepuka dhana potovu ya kuwapo kwa makuhani wakuu wengi kwa cheo kimoja.
- source_word: ἀνέσεισαν
  choice: wakauchochea
  rationale: Kitenzi kina maana ya kuamsha au kusukuma kundi lichukue hatua fulani; “kuchochea” kinawasilisha nguvu hiyo kwa kawaida.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: ὄχλος humaanisha kundi kubwa la watu; “umati” ni sahihi na inaeleweka katika simulizi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi la kitendo cha kuwachochea watu.
- source_word: μᾶλλον
  choice: badala yake
  rationale: Neno hili linaonyesha kwamba Baraba apendelewe kuliko mtu mwingine anayeeleweka kutokana na muktadha, bila kuongeza jina lisilokuwamo katika mstari huu.
- source_word: τὸν Βαραββᾶν
  choice: Baraba
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: ἀπολύσῃ
  choice: awaachilie
  rationale: Aoristi ya utegemezi baada ya ἵνα inaonyesha matokeo yaliyokusudiwa. “Awaachilie” ni ya asili katika Kiswahili na inamchukulia umati kama walengwa wa kuachiwa Baraba.
- source_word: αὐτοῖς
  choice: awaachilie
  rationale: Kiambishi -wa- katika “awaachilie” kinawakilisha αὐτοῖς kwa maana ya walengwa au wanufaika wa kuachiwa Baraba.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi wa ἀπολύσῃ
  choice: Pilato ametajwa wazi kwa ajili ya uwazi wa Kiswahili.
  alternative: kuacha kiima kieleweke tu kutokana na muktadha
  rationale: Kigiriki hakitaji kiima ndani ya kishazi hiki, lakini muktadha wa karibu unamtambulisha Pilato. Kiswahili huhitaji kiima au kiambishi cha kiima; kutaja “Pilato” huzuia kiambishi kisieleweke vibaya kuwa kinawarejelea viongozi wa makuhani, bila kubadili hoja ya simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi. “Viongozi wa makuhani” limetumiwa kwa uongozi wa kikuhani; “umati” na “wakauchochea” ni maneno wazi kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini.
