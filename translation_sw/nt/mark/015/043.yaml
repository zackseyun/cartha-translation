  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: sw
  text: Yosefu wa Arimathea, mjumbe wa baraza aliyeheshimiwa, ambaye yeye mwenyewe pia alikuwa akiungojea Ufalme wa Mungu, alikuja, akathubutu kuingia mbele ya Pilato, akamwomba Pilato mwili wa Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alijipa moyo, akaingia mbele ya Pilato.” Kigiriki kinakazia ujasiri wa Yosefu alipomwendea Pilato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: (imedokezwa katika mfululizo wa tendo)
  rationale: Kishiriki hiki cha aoristi hutangulia vitenzi vikuu. Katika Kiswahili, kukitafsiri kwa kitenzi tofauti kama ‘alikuja’ kungeleta urudiaji usio wa lazima pamoja na ‘akaingia’; mwendo wake umeelezwa vya kutosha na kitenzi kinachofuata.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: wa Arimathea
  rationale: Ni njia ya kawaida na fupi ya Kiswahili ya kumtambulisha Yosefu kwa mahali alikotoka, huku ikihifadhi maana ya ἀπό.
- source_word: εὐσχήμων
  choice: aliyeheshimiwa
  rationale: Neno hili linaonyesha heshima na hadhi ya kijamii. ‘Aliyeheshimiwa’ ni la sasa, linaeleweka kwa urahisi, na halilazimishi maana finyu ya cheo.
- source_word: βουλευτής
  choice: mjumbe wa baraza
  rationale: Hutaja mshiriki wa baraza linalotawala. Tafsiri haiongezi jina ‘Sanhedrini,’ ambalo halitajwi wazi katika neno la Kigiriki.
- source_word: ὃς καὶ αὐτὸς
  choice: ambaye yeye pia
  rationale: Huhifadhi mkazo wa καὶ αὐτός kwamba Yosefu mwenyewe alikuwa miongoni mwa walioutarajia Ufalme wa Mungu.
- source_word: ἦν προσδεχόμενος
  choice: alikuwa akiungojea
  rationale: Muundo huu unaonyesha hali endelevu ya kungoja kwa matarajio, ambayo ‘alikuwa akiungojea’ huiwasilisha kwa Kiswahili cha kawaida.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya usemi huu muhimu katika Injili.
- source_word: τολμήσας
  choice: alijipa moyo
  rationale: Huwasilisha ujasiri uliohitajika ili kumkaribia Pilato, bila kupunguza kishiriki hiki kuwa namna ya kitendo tu.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: akaingia kwa Pilato
  rationale: ‘Akaingia’ huhifadhi wazo la kuingia, na ‘kwa Pilato’ huonyesha kwamba aliingia mbele yake au mahali alipokuwapo.
- source_word: ᾐτήσατο
  choice: kuomba apewe
  rationale: Katika muktadha huu Yosefu hakuuliza swali tu, bali aliomba Pilato amkabidhi mwili; ‘kuomba apewe’ huweka ombi hilo wazi kwa Kiswahili asilia.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: mwili wa Yesu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi sauti nzito ya kifungu.
theological_decisions:
- issue: Utambulisho wa Yosefu kama βουλευτής
  choice: mjumbe wa baraza
  alternative: mjumbe wa Sanhedrini
  rationale: Ingawa katika muktadha huenda baraza hilo ni Sanhedrini, neno lenyewe halitaji Sanhedrini wazi; tafsiri kuu haiongezi ufafanuzi huo.
- issue: Nguvu ya τολμήσας
  choice: alijipa moyo
  alternative: kwa ujasiri / akathubutu
  rationale: Kigiriki kinakazia ujasiri wa Yosefu katika tendo lenye hatari ya kijamii na kisiasa. ‘Alijipa moyo’ huhifadhi ujasiri huo na uhusiano wake na kuingia mbele ya Pilato.
- issue: Maana ya kungojea Ufalme wa Mungu
  choice: alikuwa akiungojea Ufalme wa Mungu
  alternative: alikuwa akiutarajia Ufalme wa Mungu
  rationale: Tafsiri inadumisha hali ya matarajio endelevu bila kueleza zaidi namna au wakati wa kuja kwa Ufalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa masimulizi ‘alijipa moyo, akaingia ... na kuomba’ ni wa kawaida, huku ‘ambaye yeye pia’ ikihifadhi mkazo wa Kigiriki.
