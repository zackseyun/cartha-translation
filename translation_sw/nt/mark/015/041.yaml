  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: sw
  text: Wanawake hao walikuwa wakimfuata na kumhudumia Yesu alipokuwa Galilaya[a], na wanawake wengine wengi waliopanda pamoja naye kwenda Yerusalemu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtumikia.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa huduma au msaada wa vitendo.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “waliopanda pamoja naye kwenda Yerusalemu.” Hii huhifadhi nahau ya kawaida ya Biblia ya kupanda kwenda Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Wanawake hao
  rationale: Kiwakilishi hiki cha uhusiano kinawarejelea wanawake waliotajwa katika mstari uliotangulia. ‘Wanawake hao’ huleta sentensi ya kawaida katika Kiswahili huku ikihifadhi rejeleo hilo.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: alipokuwa Galilaya
  rationale: Hiki ni kishazi cha wakati kilichotafsiriwa kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἠκολούθουν
  choice: walikuwa wakimfuata
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au lililokuwa desturi, si tukio moja tu.
- source_word: διηκόνουν αὐτῷ
  choice: kumhudumia
  rationale: Kitenzi kinaweza kuonyesha huduma ya vitendo, utunzaji, au msaada wa binafsi. ‘Kumhudumia’ ni pana na yenye heshima bila kuingiza maana ya cheo rasmi cha kidini.
- source_word: ἄλλαι πολλαὶ
  choice: wanawake wengine wengi
  rationale: Muktadha na umbo la kike la Kigiriki vinaonyesha wazi kuwa wanaotajwa ni wanawake; nomino imetajwa katika Kiswahili kwa uwazi.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: waliokuwa wamepanda pamoja naye
  rationale: Muundo huu unaonyesha tendo lililotangulia; ‘wamepanda’ pia huhifadhi nahau ya kibiblia ya kupanda kwenda Yerusalemu.
- source_word: εἰς Ἱεροσόλυμα
  choice: kwenda Yerusalemu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha mahali walikokuwa wakielekea.
theological_decisions:
- issue: Aina ya huduma ya wanawake inayoelezwa na διηκόνουν
  choice: kumhudumia
  alternative: kumtumikia
  rationale: ‘Kumhudumia’ huhifadhi wigo wa huduma ya vitendo na msaada kwa Yesu bila kuifanya iwe kazi duni tu wala kuhusisha moja kwa moja cheo cha baadaye katika kanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walikuwa wakimfuata’ huonyesha hali ya kufuata kwa mazoea, na ‘kumhudumia’ huepuka lugha ya kitaalamu ya kikanisa. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
