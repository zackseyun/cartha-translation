  text: Na pazia la hekalu[a][b] likapasuka vipande viwili, kutoka juu mpaka chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaji wa hekalu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki hapa linaweza kumaanisha hasa sehemu takatifu ya hekalu, badala ya eneo lote la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: pazia
  rationale: Neno hili linamaanisha kitambaa kinachoning’inia kama pazia ndani ya hekalu. “Pazia” ni neno la kawaida na la wazi katika Kiswahili cha sasa; “utaji” limewekwa kama chaguo la chini.
- source_word: ναοῦ
  choice: hekalu
  rationale: ναός hapa inaweza kumaanisha hasa patakatifu pa ndani, si eneo lote la jengo la hekalu. “Hekalu” ni la kawaida na linalosomeka kwa urahisi, huku tanbihi ikihifadhi maana mahsusi zaidi.
- source_word: ἐσχίσθη
  choice: likapasuka
  rationale: Kitenzi cha aoristi katika kauli tendwa kinaonyesha kwamba pazia lilipasuliwa au lilipasuka. Kiswahili hutumia kwa kawaida umbo lisilo la mtendaji “likapasuka,” ambalo halimtaji aliyesababisha tukio.
- source_word: εἰς δύο
  choice: vipande viwili
  rationale: Kirai hiki kinaonyesha kugawanyika mara mbili. “Vipande viwili” ni cha asili katika Kiswahili na kinaonyesha matokeo ya kupasuka bila kuongeza maelezo.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: kutoka juu mpaka chini
  rationale: Tafsiri hii inahifadhi mwelekeo na upeo kamili wa kupasuka kwa lugha ya kawaida ya Kiswahili.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinahifadhi mtiririko wa simulizi bila kuongeza maana ya wakati isiyosemwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya kitheolojia ya kupasuka kwa pazia la hekalu
  choice: Tukio limeelezwa tu bila kufafanua ishara yake katika matini kuu.
  alternative: Kulieleza kuwa ishara ya kufunguliwa kwa njia ya kumkaribia Mungu, au hukumu juu ya mfumo wa hekalu.
  rationale: Aya yenyewe inaripoti tukio lakini haisemi wazi maana yake ya kitheolojia; tafsiri kwa hiyo haipaswi kuamua kati ya maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama [a][b] unaambatanisha kwanza chaguo la “utaji,” kisha ufafanuzi wa maana mahsusi ya ναός.
