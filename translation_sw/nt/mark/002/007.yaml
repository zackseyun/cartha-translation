  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: sw
  text: “Kwa nini mtu huyu anasema hivi? Anakufuru! Ni nani anayeweza kusamehe dhambi isipokuwa Mungu peke yake?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa Mungu mmoja tu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: Kwa nini ... anasema hivi?
  rationale: Katika muundo huu wa Kigiriki, Τί inauliza sababu ya kusema kwa namna hiyo, si maudhui ya maneno. Kiswahili cha kawaida hutumia “Kwa nini ... anasema hivi?”
- source_word: οὗτος
  choice: mtu huyu
  rationale: Hutambulisha Yesu kwa umbali fulani bila kuongeza dharau isiyo wazi katika Kigiriki; “mtu huyu” ni ya asili na yenye heshima katika Kiswahili cha sasa.
- source_word: βλασφημεῖ
  choice: Anakufuru!
  rationale: Kitenzi cha wakati uliopo kinatoa shtaka la moja kwa moja kuhusu maneno anayosema Yesu. “Kukufuru” huhifadhi uzito wa kidini wa shtaka hilo.
- source_word: τίς δύναται ἀφιέναι ἁμαρτίας
  choice: Ni nani anayeweza kusamehe dhambi
  rationale: “Kusamehe dhambi” ndiyo maana ya kawaida ya ἀφιέναι ἁμαρτίας katika muktadha huu, na muundo huu ni wa asili katika Kiswahili.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: isipokuwa Mungu peke yake
  rationale: 'Muundo huu huonyesha upekee: hakuna mwingine anayeweza kufanya hivyo. Tafsiri hii ni wazi na haibadili sentensi kuwa kauli tofauti kuhusu umoja wa Mungu.'
theological_decisions:
- issue: Kiwango cha dharau katika οὗτος
  choice: mtu huyu
  alternative: huyu
  rationale: Kauli ya waandishi wa sheria ina umbali na upinzani, lakini tafsiri haipaswi kuongeza kejeli au dharau zaidi ya ilivyo katika Kigiriki.
- issue: Nguvu ya shtaka βλασφημεῖ
  choice: Anakufuru!
  alternative: Hayo ni makufuru!
  rationale: Kigiriki kina kitenzi chenye mhusika anayefanya kitendo. “Anakufuru” huhifadhi shtaka lao dhidi ya Yesu bila kutatua mapema mvutano wa kikristolojia wa simulizi.
- issue: Maana ya εἷς ὁ θεός
  choice: Mungu peke yake
  alternative: Mungu mmoja tu
  rationale: Muktadha unasisitiza kwamba Mungu pekee ndiye anayeweza kusamehe dhambi. Chaguo hili huhifadhi upekee huo bila kulazimisha tafsiri ya “the one God,” ingawa muundo wa Kigiriki unaweza kuelezwa hivyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anasema hivi” ni cha kawaida kuliko tafsiri sisisi ya muundo wa Kigiriki; “anakufuru” huhifadhi istilahi ya kidini inayoeleweka kwa upana.
