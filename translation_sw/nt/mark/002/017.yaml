base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: sw
  text: Yesu aliposikia hayo, akawaambia, “Wenye afya[a] hawahitaji tabibu, bali wagonjwa. Sikuja kuwaita wenye haki[b], bali wenye dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye nguvu” au “walio na afya njema”; Kigiriki hurejelea kihalisi walio na nguvu au walio katika hali nzuri.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, “wenye haki” huenda ikasikika kwa kejeli, yaani, wale wanaohesabiwa kuwa wenye haki au wanaojiona kuwa wenye haki; hata hivyo, matini ya Kigiriki yenyewe inasema tu “wenye haki.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kishirikishi cha aoristi kinaonyesha tendo lililotangulia kauli kuu. Kiswahili cha kawaida hutumia muundo wa wakati; “hayo” hurejelea maneno ya muktadha bila kuyafafanua kupita kiasi.
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Ingawa Kigiriki kina wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa ufasaha mfululizo wa “aka-”; pia “kuwaambia” huwasilisha kwa kawaida maana ya kusema kwao.
- source_word: οἱ ἰσχύοντες
  choice: wenye afya
  rationale: Neno hilo kimsingi hueleza walio na nguvu au walio vizuri; katika ulinganisho na tabibu, “wenye afya” ndiyo usemi wa Kiswahili ulio wazi na wa asili, huku maana halisi zaidi ikitajwa katika tanbihi.
- source_word: χρείαν ἔχουσιν
  choice: hawahitaji
  rationale: Huu ni uwasilishaji wa asili wa nahau ya Kigiriki ya ‘kutokuwa na uhitaji’.
- source_word: ἰατροῦ
  choice: tabibu
  rationale: “Tabibu” ni neno fasaha, linaloeleweka, na linaendana na hadhi ya msemo bila kuwa la kitaalamu kupita kiasi.
- source_word: οἱ κακῶς ἔχοντες
  choice: wagonjwa
  rationale: Nahau hii ya Kigiriki hutumiwa kwa wale walio katika hali mbaya kiafya; “wagonjwa” huwasilisha tofauti ya kimatibabu kwa uwazi.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Sikuja kuwaita
  rationale: Muundo huu ni wa moja kwa moja na huhifadhi wazo la kuja kwa kusudi la kuita bila kulibana kuwa mwaliko au amri pekee.
- source_word: δικαίους
  choice: wenye haki
  rationale: Huhifadhi jamii ya kimaadili na kidini iliyo katika Kigiriki bila kuongeza kwamba wanajiona hivyo.
- source_word: ἁμαρτωλούς
  choice: wenye dhambi
  rationale: Ni uwasilishaji wa kawaida na unaoeleweka wa watu wanaotajwa kwa sifa ya dhambi katika muktadha huu.
theological_decisions:
- issue: Kama ‘wenye haki’ inasemwa kwa kejeli au kwa maana ya moja kwa moja
  choice: Kudumisha ‘wenye haki’ katika matini kuu
  alternative: ‘Wale wanaojiona kuwa wenye haki’
  rationale: Muktadha unaweza kuruhusu usomaji wa kejeli, lakini Kigiriki chenyewe kinasema tu ‘wenye haki.’ Tanbihi huhifadhi uwezekano huo bila kuufanya kuwa tafsiri ya lazima.
- issue: Kitu kilichosikiwa na Yesu
  choice: Kutumia ‘hayo’ kama rejeo la kimuktadha
  alternative: ‘aliposikia’ bila kijalizo
  rationale: Kigiriki hakitaji kitu hicho waziwazi, lakini muktadha unarejelea maneno yaliyosemwa. “Hayo” ni ya asili katika Kiswahili na hayafafanui zaidi ya matini.
- issue: Wakati uliopo wa kihistoria katika λέγει
  choice: Kutumia ‘akawaambia’ katika masimulizi ya Kiswahili
  alternative: ‘anawaambia’
  rationale: Wakati uliopo wa Kigiriki huleta uhai wa kisimulizi, lakini “aka-” hudumisha mfululizo wa matukio kwa Kiswahili cha kawaida bila kubadili maana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa kimethali na wa moja kwa moja; “tabibu” hudumisha hadhi ya msemo, na tanbihi huhifadhi upana wa οἱ ἰσχύοντες pamoja na mvutano wa ‘wenye haki.’
