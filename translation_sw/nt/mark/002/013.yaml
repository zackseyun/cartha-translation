  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: sw
  text: Naye akatoka tena kando ya bahari[a]. Umati wote ulikuwa ukimjia, naye alikuwa akiwafundisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kandokando ya bahari.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “ulikuwa ukimjia” na “alikuwa akiwafundisha” yanatafsiri vitenzi vya Kigiriki vinavyoweza kuonyesha matendo yaliyokuwa yakiendelea wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Kitenzi hiki cha wakati uliopita kinaeleza tendo kuu lililotokea; “akatoka” ni tafsiri ya kawaida na ya asili katika masimulizi ya Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili huonyesha kurudiwa kwa tendo, na “tena” ni sawa ya moja kwa moja na ya kawaida.
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya bahari
  rationale: Kirai hiki kinaonyesha mahali au mwendo karibu na ufuo; “kando ya bahari” ni cha asili na hakiongezi mahali pa kuanzia pasipotajwa.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Muundo huu wenye nomino ya mkusanyiko unamaanisha umati mzima; “umati wote” ni Kiswahili cha kawaida na wazi.
- source_word: ἤρχετο
  choice: ulikuwa ukimjia
  rationale: Kauli ya Kigiriki ya imperfect inaonyesha tendo lililokuwa likiendelea au kujirudia wakati uliopita. Muundo “ulikuwa ukimjia” huhifadhi hali hiyo bila kulazimisha maana ya kujirudia mara nyingi.
- source_word: πρὸς αὐτόν
  choice: -mjia
  rationale: Kiambishi cha yambwa “-m-” pamoja na kitenzi “kujia” huonyesha kwa kawaida mwendo wa kuelekea kwa mtu huyo.
- source_word: ἐδίδασκεν
  choice: alikuwa akiwafundisha
  rationale: Muundo huu huhifadhi hali endelevu ya imperfect ya Kigiriki na unasikika kwa kawaida katika Kiswahili.
- source_word: αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea watu wa umati kama walengwa wa mafundisho.
