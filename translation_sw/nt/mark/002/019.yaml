  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: sw
  text: Naye Yesu akawaambia, “Je, wageni wa arusi[a] hawawezi kufunga wakati bwana arusi yuko pamoja nao? Kwa muda wote ambao wana bwana arusi pamoja nao, hawawezi kufunga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa ukumbi wa arusi” au “wana wa chumba cha arusi,” nahau inayowataja wale wanaoshiriki katika sherehe ya arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Je, ... wanaweza kufunga ...?
  rationale: 'Muundo wa μή pamoja na kitenzi cha hali halisi unaanzisha swali la balagha linalotarajia jibu la kukataa. Muundo wa Kiswahili wenye “Je” ni wa kawaida, huku sentensi inayofuata ikiweka wazi jibu: hawawezi kufunga.'
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: wageni wa arusi[a]
  rationale: Hii ni nahau inayomaanisha washiriki wa sherehe ya arusi, hasa walio pamoja na bwana arusi. “Wageni wa arusi” inaeleza nafasi yao kwa Kiswahili cha kawaida bila kuifanya nahau ya asili isieleweke.
- source_word: ἐν ᾧ ... ἐστιν
  choice: wakati ... yuko pamoja nao
  rationale: Muundo huu una maana ya wakati katika muktadha huu; “wakati” huwasilisha maana hiyo kwa uwazi na kwa lugha ya kawaida.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: bwana arusi
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili, nalo linahifadhi taswira ya bwana arusi bila kuifafanua kitheolojia.
- source_word: ὅσον χρόνον
  choice: Maadamu
  rationale: Neno hili linaonyesha muda unaoendelea kwa maana ya “kwa muda wote ambao,” na linafaa katika Kiswahili sanifu.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: wana bwana arusi pamoja nao
  rationale: Tafsiri hii inahifadhi kitenzi ἔχουσιν, “wana,” badala ya kurudia tu kwamba bwana arusi yuko pamoja nao.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Naye Yesu akawaambia
  rationale: Ni utangulizi wa kisimulizi wa asili katika Kiswahili, unaohifadhi kiunganishi na kitendo cha kusema kwao.
theological_decisions:
- issue: Utambulisho wa Yesu kwa taswira ya bwana arusi
  choice: Kuhifadhi taswira ya “bwana arusi” bila kueleza wazi maana yake ya kitheolojia katika matini kuu.
  alternative: Kutafsiri kwa ufafanuzi unaosisitiza kwamba Yesu anajitambulisha kuwa bwana arusi wa kimasiya.
  rationale: Aya yenyewe hutumia taswira hii bila kuifafanua kikamilifu. Tafsiri inapaswa kuhifadhi uzito na uwezekano wake wa kitheolojia bila kuingiza hitimisho la kifafanuzi lisilotajwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wageni wa arusi” ni rahisi kueleweka kwa wasomaji wa kawaida; tanbihi huhifadhi umbo halisi la nahau ya Kigiriki. Marudio ya “bwana arusi” na tofauti kati ya “yuko” na “wana” yamehifadhiwa kadiri inavyowezekana.
