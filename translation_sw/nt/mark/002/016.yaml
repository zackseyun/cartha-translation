base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: sw
  text: Nao waandishi wa sheria wa Mafarisayo[a], walipoona kwamba alikuwa akila pamoja na wenye dhambi na watoza ushuru, waliwauliza wanafunzi wake, “Kwa nini anakula pamoja na watoza ushuru na wenye dhambi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waandishi wa sheria waliokuwa miongoni mwa Mafarisayo.” Muundo wa Kigiriki unaweza kuonyesha kuwa waandishi hao walikuwa Mafarisayo au walihusishwa na kundi lao.
    reason: textual_ambiguity
lexical_decisions:
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika muktadha wa Injili, neno hili linarejelea wataalamu waliotambuliwa katika Maandiko na sheria; ‘waandishi wa sheria’ ni wazi kwa msomaji wa kawaida bila kupanua mno jukumu lao.
- source_word: τῶν Φαρισαίων
  choice: wa Mafarisayo
  rationale: Huhifadhi uhusiano wa kijeni kwa namna ya kawaida ya Kiswahili bila kulazimisha maana kwamba kila mmoja wao alikuwa Farisayo badala ya kuhusishwa na kundi hilo.
- source_word: ἰδόντες
  choice: walipoona
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya mazingira ya wakati ya kitenzi shirikishi cha aoristi.
- source_word: ὅτι ἐσθίει
  choice: kwamba alikuwa akila
  rationale: Muundo wa ‘alikuwa akila’ unaonyesha tendo lililokuwa likiendelea katika tukio la masimulizi, kama hali ya kitenzi cha Kigiriki inavyodokeza.
- source_word: μετὰ
  choice: pamoja na
  rationale: Huonyesha ushirika wa mezani kwa lugha ya kawaida bila kuongeza ufafanuzi wa kitafsiri katika matini kuu.
- source_word: ἁμαρτωλῶν
  choice: wenye dhambi
  rationale: Ni sawia ya moja kwa moja inayohifadhi nguvu ya lebo ya kijamii na kidini katika shtaka hilo.
- source_word: τελωνῶν
  choice: watoza ushuru
  rationale: Ni istilahi ya kawaida na sahihi ya Kiswahili kwa wakusanyaji wa kodi au ushuru waliotajwa katika mazingira ya Injili.
- source_word: ἔλεγον
  choice: wakawauliza
  rationale: Katika muktadha huu usemi unaofuata ni swali; ‘wakawauliza’ ni wa asili katika Kiswahili, huku mfuatano wa ‘waka-’ ukidumisha mtiririko wa masimulizi. Hali endelevu ya imperfect haiwezi kuhamishwa kikamilifu bila kufanya sentensi kuwa nzito.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: ‘Wanafunzi’ huhifadhi uhusiano rasmi wa mwalimu na wanafunzi unaobebwa na μαθηταί.
- source_word: Ὅτι
  choice: Kwa nini
  rationale: Katika swali hili la malalamiko, ‘Kwa nini’ hutoa kwa kawaida kazi ya kiidiomatiki ya ὅτι kuliko tafsiri ya neno kwa neno.
- source_word: ἐσθίει
  choice: anakula
  rationale: Wakati uliopo wa Kiswahili unafaa kwa swali kuhusu tendo hili na pia unaweza kudokeza tabia ya kushirikiana nao mezani.
theological_decisions:
- issue: Nguvu ya kijamii na kidini ya kula pamoja mezani
  choice: Kutafsiri moja kwa moja kuwa anakula ‘pamoja na watoza ushuru na wenye dhambi,’ bila kuongeza maelezo katika matini kuu.
  alternative: ‘Anashiriki chakula na watoza ushuru na wenye dhambi.’
  rationale: Mvutano wa kifungu uko katika ushirika wa Yesu na watu waliotengwa kijamii na kidini. Kigiriki kinatumia kitenzi cha kawaida ‘kula’ pamoja na ‘na’; tafsiri hii inaacha simulizi lenyewe lionyeshe uzito wa ushirika huo.
- issue: Uhusiano wa waandishi na Mafarisayo
  choice: ‘waandishi wa sheria wa Mafarisayo’
  alternative: ‘waandishi wa sheria ambao walikuwa Mafarisayo’
  rationale: Muundo wa kijeni unaweza kuonyesha kuwa waandishi hawa walihusishwa na Mafarisayo; tafsiri mbadala ingeamua wazi zaidi kwamba wao wenyewe walikuwa Mafarisayo. Matini kuu inahifadhi upeo huo bila kuufunga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Waandishi wa sheria,’ ‘watoza ushuru,’ na ‘wenye dhambi’ ni misemo ya kawaida ya kibiblia isiyoegemea dhehebu. Alama ya tanbihi [a] imewekwa baada ya ‘Mafarisayo,’ ambako suala la uhusiano wa kijeni linatokea.
