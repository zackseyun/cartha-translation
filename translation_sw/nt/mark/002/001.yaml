  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: sw
  text: Alipoingia tena Kapernaumu baada ya siku kadhaa, ikasikika kwamba alikuwa nyumbani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “ndani ya nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: alipoingia
  rationale: Kivumishi-tendo cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati cha Kiswahili, kinachoonyesha kwamba kuingia kulitangulia kusikika kwa habari.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudia au kurudi mahali hapo, na “tena” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: δι’ ἡμερῶν
  choice: baada ya siku kadhaa
  rationale: Nahau hii inaonyesha kwamba muda usiotajwa kwa usahihi wa siku kadhaa ulikuwa umepita.
- source_word: ἠκούσθη
  choice: ikasikika
  rationale: Hali ya kutendwa isiyo na mtendaji aliyetajwa imehifadhiwa, huku usemi ukibaki wa kawaida katika simulizi la Kiswahili.
- source_word: ἐν οἴκῳ
  choice: nyumbani
  rationale: Katika muktadha huu usemi unaweza kumaanisha kuwa nyumbani, lakini pia unaweza kueleweka kwa maana halisi zaidi kuwa ndani ya nyumba; maana hiyo mbadala imewekwa katika tanbihi.
- source_word: ἐστίν
  choice: alikuwa
  rationale: Wakati uliopo wa Kigiriki katika taarifa isiyo ya moja kwa moja umetafsiriwa kwa wakati uliopita unaolingana kwa kawaida na kitenzi cha simulizi “ikasikika” katika Kiswahili.
theological_decisions:
- issue: Iwapo ἐν οἴκῳ ina maana ya “nyumbani” au kwa ujumla “ndani ya nyumba.”
  choice: nyumbani
  alternative: ndani ya nyumba
  rationale: “Nyumbani” ni usemi wa asili unaofaa muktadha, lakini Kigiriki hakithibitishi kwa lazima kwamba nyumba hiyo ilikuwa makao yake Yesu. Tanbihi inahifadhi uwezekano huo bila kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye hadhi. Muundo wa hali ya kutendwa katika ἠκούσθη umehifadhiwa, na utata wa ἐν οἴκῳ umeonyeshwa kwa tanbihi.
