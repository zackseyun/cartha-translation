  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: sw
  text: Naye alikuwa akiwaambia, “Sabato ilifanyika kwa ajili ya mwanadamu[a], wala si mwanadamu kwa ajili ya Sabato.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kwa ajili ya wanadamu. Kigiriki kinatumia “mwanadamu” katika umoja kumwakilisha kila binadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Kauli ya wakati uliopita isiyokamilika inaonyesha tendo lililokuwa likiendelea katika simulizi. Muundo huu unahifadhi hali hiyo bila kuifanya kauli kuwa ya kurudiwa-rudiwa kwa lazima.
- source_word: τὸ σάββατον
  choice: Sabato
  rationale: Neno lenye kibainishi linarejelea siku au mpango wa Sabato. “Sabato” ni istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: διὰ τὸν ἄνθρωπον
  choice: kwa ajili ya mwanadamu
  rationale: διά pamoja na hali ya accusative huonyesha kusudi au manufaa. “Mwanadamu” ni nomino ya umoja inayoweza kuwawakilisha wanadamu wote, kama ἄνθρωπος hapa.
- source_word: ἐγένετο
  choice: ilikuja kuwepo
  rationale: γίνομαι hapa ina maana ya kuja kuwapo au kupata kuwepo. Tafsiri hii haibani maana kuwa tendo maalumu la kutengenezwa au kuamriwa.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: wala si mwanadamu kwa ajili ya Sabato
  rationale: Muundo huu unahifadhi ulinganifu wa vipashio viwili na usemi wa pili uliofupishwa katika Kigiriki, huku ukionyesha wazi tofauti ya kusudi.
theological_decisions:
- issue: Matumizi ya ἄνθρωπος ya umoja kumwakilisha kila binadamu
  choice: mwanadamu
  alternative: wanadamu
  rationale: Kauli inahusu wanadamu kwa jumla, lakini Kigiriki hutumia umoja wa kiwakilishi. “Mwanadamu” huhifadhi umoja huo na pia ni jumuishi kwa kawaida katika Kiswahili.
- issue: Maana ya ἐγένετο kuhusu asili ya Sabato
  choice: ilikuja kuwepo
  alternative: iliwekwa / ilianzishwa
  rationale: Tafsiri iliyochaguliwa huhifadhi upana wa γίνομαι na haiongezi ufafanuzi kwamba Sabato ‘iliwekwa’ au ‘ilianzishwa,’ ingawa hayo yanaweza kueleza maana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Alikuwa akiwaambia” ni mzito kidogo kuliko “akawaambia,” lakini umetumiwa ili kuhifadhi hali endelevu ya ἔλεγεν; “ilikuja kuwepo” huhifadhi maana pana ya ἐγένετο.
