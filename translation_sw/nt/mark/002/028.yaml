  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: sw
  text: Kwa hiyo Mwana wa Adamu ni Bwana hata wa Sabato[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo Mwana wa Adamu ni Bwana pia wa Sabato.” Neno la Kigiriki linaweza kutafsiriwa “pia,” lakini hapa yaelekea lina maana ya “hata,” likisisitiza upeo wa mamlaka yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida na huonyesha uhusiano huo wa kimantiki.
- source_word: κύριος
  choice: Bwana
  rationale: Hapa neno hili linaonyesha mamlaka na ubwana. “Bwana” pia hudumisha uzito wa kauli inayomhusu Mwana wa Adamu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja la Yesu lililozoeleka katika Injili; tafsiri hii huhifadhi mwangwi wake wa kimaandiko na mvutano wake wa kikristolojia.
- source_word: καὶ
  choice: hata
  rationale: 'Katika muktadha huu καί inaelekea kuwa na maana ya kusisitiza kiwango cha mamlaka: Mwana wa Adamu ni Bwana hata wa Sabato. Maana ya “pia” bado inawezekana na imewekwa katika tanbihi.'
- source_word: σαββάτου
  choice: Sabato
  rationale: “Sabato” ni istilahi ya kawaida ya Kiswahili kwa siku hiyo takatifu na inafaa katika muktadha wa mabishano kuhusu utunzaji wake.
theological_decisions:
- issue: Nguvu ya kikristolojia ya dai la mamlaka juu ya Sabato
  choice: Kauli imetafsiriwa moja kwa moja kuwa Mwana wa Adamu ni Bwana wa Sabato.
  alternative: Mwana wa Adamu ana mamlaka kuhusu Sabato.
  rationale: Nomino-arifu κύριος inaonyesha ubwana, si ruhusa yenye mipaka tu; tafsiri hii hudumisha nguvu ya dai bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Mrejelewa wa “Mwana wa Adamu”
  choice: Kuhifadhi “Mwana wa Adamu” kama jina la Yesu.
  alternative: Mwanadamu; yule aliye mwanadamu.
  rationale: Katika Marko, usemi huu hutumiwa na Yesu kujirejelea na hubeba mvutano wa maana pamoja na mwangwi unaowezekana wa Danieli; haupaswi kufafanuliwa kwa namna inayofunga maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili bila kuwa mgumu, na kichwa “Mwana wa Adamu” pamoja na “Bwana” vimehifadhiwa kwa uzito wake wa kimaandiko.
