  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: sw
  text: Kwa kuwa hawakuweza kumfikisha mtu huyo kwa Yesu kwa sababu ya umati, walifunua paa mahali alipokuwa. Baada ya kulitoboa, wakateremsha mkeka ambao mtu aliyepooza alikuwa amelalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: Kwa kuwa hawakuweza
  rationale: Kirai cha hali kinaonyesha sababu iliyowafanya wachukue hatua iliyofuata; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: προσενέγκαι αὐτῷ
  choice: kumfikisha mtu huyo kwa Yesu
  rationale: Kigiriki kina kitu kinacholetwa na mtu anayeletewa. Kutaja ‘mtu huyo’ na ‘Yesu’ kunaondoa urudiaji usio wa kawaida wa viwakilishi huku kukihifadhi kitendo na wahusika wake.
- source_word: διὰ τὸν ὄχλον
  choice: kwa sababu ya umati
  rationale: Hii inaonyesha sababu moja kwa moja; ‘umati’ ni neno la kawaida na lenye hadhi kwa ὄχλος.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: walifunua paa
  rationale: Kitenzi adimu kina maana ya kuondoa kifuniko cha paa. ‘Walifunua paa’ kinaeleza hatua hiyo bila kudai kwamba paa lote liliondolewa.
- source_word: ὅπου ἦν
  choice: mahali alipokuwa
  rationale: Kirai hiki kinabainisha sehemu ya paa iliyokuwa juu ya mahali Yesu alipokuwa bila kuongeza maelezo yasiyosemwa wazi katika Kigiriki.
- source_word: ἐξορύξαντες
  choice: Baada ya kulitoboa
  rationale: Kitenzi kinaonyesha kuchimba au kutoboa na kufanya mwanya. Tafsiri hii inaeleza tendo bila kubainisha vifaa vya paa ambavyo maandishi hayavitaji.
- source_word: χαλῶσι
  choice: wakateremsha
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria kwa uchangamfu wa simulizi, mfululizo wa ‘waka-’ ni njia ya kawaida ya Kiswahili ya kusimulia tendo linalofuata.
- source_word: κράβαττον
  choice: mkeka
  rationale: Neno hilo linamaanisha tandiko rahisi la kubebeka, si lazima kitanda kikubwa. ‘Mkeka’ ni wazi na wa kawaida katika Kiswahili.
- source_word: ὁ παραλυτικὸς
  choice: mtu aliyepooza
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino. Kiswahili cha kawaida hutumia kirai hiki kinachomtaja mtu kwanza badala ya kumfanya hali yake kuwa jina lake.
- source_word: κατέκειτο
  choice: alikuwa amelalia
  rationale: Muundo huu unaonyesha kwamba mtu huyo alikuwa amelala juu ya mkeka wakati ulipoteremshwa.
theological_decisions: []
