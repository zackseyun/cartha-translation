  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: sw
  text: 'Ni jambo gani lililo rahisi zaidi: kumwambia mtu aliyepooza, ‘Dhambi zako zimesamehewa,’[a] au kumwambia, ‘Inuka, chukua mkeka wako, utembee’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhambi zako zinasamehewa.” Kitenzi cha Kigiriki kinaweza kueleweka kuwa kinaonyesha tendo la kusamehe linalotokea sasa, au hali inayotokana na kusamehewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Ni jambo gani lililo rahisi zaidi
  rationale: Hutoa swali la kulinganisha kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo katika Kigiriki.
- source_word: εἰπεῖν
  choice: kumwambia
  rationale: Ingawa maana ya msingi ni ‘kusema,’ hapa usemi unaelekezwa kwa mtu fulani; ‘kumwambia’ ni wa asili na huhifadhi mpokeaji wa maneno.
- source_word: τῷ παραλυτικῷ
  choice: mtu aliyepooza
  rationale: Ni usemi wazi na wenye heshima kwa mtu mwenye kupooza, bila kutumia nomino ya kitabibu au ya kumtambulisha mtu kwa hali yake pekee.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Dhambi zako zimesamehewa
  rationale: Kauli hii ya hali timilifu katika Kiswahili inaonyesha hali ya sasa inayotokana na kusamehewa, huku ikihifadhi kauli tendwa na kutotaja mtendaji.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na linalofaa katika muktadha huu; hakuna sababu ya kulipanua kuwa madeni au makosa.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Amri ya moja kwa moja na ya kawaida inayolingana na mwito wa mtu kuinuka.
- source_word: ἆρον
  choice: chukua
  rationale: Katika muktadha huu humaanisha kuinua na kwenda na kitu; ‘chukua’ ni ya kawaida na inaeleweka kwa urahisi.
- source_word: τὸν κράβαττόν σου
  choice: mkeka wako
  rationale: κράβαττος ni tandiko jepesi linaloweza kubebwa. ‘Mkeka’ huepuka wazo la kitanda kizito cha kisasa.
- source_word: περιπάτει
  choice: utembee
  rationale: Hutoa amri ya kutembea kwa mtiririko wa kawaida wa Kiswahili baada ya amri mbili zilizotangulia.
theological_decisions:
- issue: Namna ya kutafsiri tamko la msamaha
  choice: Dhambi zako zimesamehewa
  alternative: Dhambi zako zinasamehewa
  rationale: Muundo uliochaguliwa unaonyesha hali iliyopo ya kusamehewa bila kutaja wazi mtendaji au kufafanua wakati kupita inavyoruhusiwa na matini. Tanbihi huhifadhi uwezekano wa kuelewa kitenzi kwa msisitizo wa tendo la sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye staha. Muundo wa swali na amri ni wa kawaida kwa wasomaji wengi, huku kauli tendwa ikihifadhi kutotajwa kwa mtendaji katika Kigiriki.
