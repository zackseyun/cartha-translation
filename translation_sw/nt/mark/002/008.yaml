  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: sw
  text: Mara Yesu akatambua rohoni mwake[a] kwamba walikuwa wakiwaza hivyo ndani yao wenyewe, akawaambia, “Kwa nini mnawaza mambo haya mioyoni mwenu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajua rohoni mwake” au “akatambua ndani yake.” Kigiriki hakielezi wazi namna Yesu alivyotambua.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara
  rationale: Katika mtiririko wa simulizi wa Marko, “Mara” ni ya asili na hudumisha hisia ya jambo kutokea bila kuchelewa.
- source_word: ἐπιγνοὺς
  choice: akatambua
  rationale: Kitenzi hiki huonyesha kufahamu au kutambua kwa wazi; “akatambua” hakibainishi kupita kiasi namna Yesu alivyopata ufahamu huo.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: rohoni mwake
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kigiriki na kuhifadhi uwezekano wa kuelewa dative kama eneo au namna ya utambuzi bila kuamua suala hilo.
- source_word: οὕτως
  choice: hivyo
  rationale: “Hivyo” ni usemi wa kawaida unaoeleza namna walivyokuwa wakiwaza.
- source_word: διαλογίζονται
  choice: walikuwa wakiwaza
  rationale: Katika muktadha huu neno linahusu tafakari au hoja ya ndani, si lazima majadiliano yaliyotamkwa.
- source_word: ἐν ἑαυτοῖς
  choice: ndani yao
  rationale: Usemi huu unaonyesha mawazo ya ndani ya kila mmoja, badala ya mazungumzo ya wazi kati yao.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Kwa nini mnawaza mambo haya
  rationale: Ingawa τί kwa msingi ni “nini,” katika swali hili “Kwa nini” hutoa maana ya matumizi ya Kigiriki kwa Kiswahili cha kawaida; “mambo haya” huwakilisha ταῦτα.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Huhifadhi taswira ya kibiblia ya moyo kama kitovu cha mawazo na nia, bila kuibana kuwa akili pekee.
theological_decisions:
- issue: Asili au namna ya Yesu kujua katika usemi “akatambua rohoni mwake”
  choice: Kuhifadhi usemi “rohoni mwake” na kusema kwamba Yesu alitambua mawazo yao bila kufafanua utaratibu wa utambuzi huo.
  alternative: Kutafsiri moja kwa moja kuwa ni ujuzi wa kimungu usio na mipaka, msaada wa Roho, au angavu ya kibinadamu pekee.
  rationale: Aya inaonyesha wazi kwamba Yesu alijua mawazo yao ya ndani, lakini τῷ πνεύματι αὐτοῦ yenyewe haifafanui kwa uthabiti namna ya ujuzi huo. Tafsiri inahifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mara” na “wakiwaza” ni rahisi kueleweka, huku “rohoni mwake” na “mioyoni mwenu” zikihifadhi lugha na taswira za chanzo.
