  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: sw
  text: Wala hakuna mtu anayetia divai mpya katika viriba vya zamani. La sivyo, divai itavipasua viriba, nayo divai itapotea, na viriba pia. Lakini divai mpya ni kwa ajili ya viriba vipya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάλλει
  choice: anayetia
  rationale: Katika muktadha wa kuweka divai ndani ya kiriba, 'kutia' ni Kiswahili cha kawaida na huhifadhi upana wa kitenzi cha Kigiriki bila kutumia kitenzi mahsusi zaidi kama 'kumimina'.
- source_word: οἶνον νέον
  choice: divai mpya
  rationale: Huhifadhi uhusiano wa nomino na kivumishi; hapa 'mpya' humaanisha divai iliyotengenezwa karibuni na ambayo bado inaweza kuchacha.
- source_word: ἀσκούς
  choice: viriba
  rationale: '''Viriba'' hurejelea vyombo vya ngozi vilivyotumiwa kuhifadhia divai na huhifadhi picha ya kitamaduni ya msemo.'
- source_word: παλαιούς
  choice: vya zamani
  rationale: Hutoa maana ya moja kwa moja ya 'old' bila kuongeza kwa wazi wazo la kuchakaa, ingawa hilo linaeleweka katika picha hii.
- source_word: ῥήξει
  choice: itavipasua
  rationale: Hueleza kwa kawaida matokeo ya shinikizo la divai inayochacha juu ya viriba vya zamani.
- source_word: ἀπόλλυται
  choice: itapotea
  rationale: Kitenzi kinaweza kumaanisha kupotea au kuharibika. 'Itapotea' huhifadhi upana wake na katika muktadha huwasilisha wazo la divai kumwagika na kuwa hasara.
- source_word: καινούς
  choice: vipya
  rationale: '''Vipya'' ni tafsiri ya kawaida na inatofautisha viriba hivyo na vya zamani. Katika muktadha, inamaanisha viriba visivyochakaa na vinavyofaa kwa divai mpya.'
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Lakini divai mpya ni kwa ajili ya viriba vipya
  rationale: Kifungu cha mwisho cha Kigiriki hakina kitenzi. Muundo huu wa Kiswahili huhifadhi ufupi wa kimethali na kanuni ya jumla bila kuongeza amri au ulazima usiotajwa wazi.
theological_decisions:
- issue: Asili ya kifungu cha mwisho kisicho na kitenzi
  choice: 'Kimetafsiriwa kama kanuni ya jumla: ''divai mpya ni kwa ajili ya viriba vipya.'''
  alternative: '''Lakini divai mpya lazima itiwe katika viriba vipya'' au ''Lakini mtu hutia divai mpya katika viriba vipya.'''
  rationale: Kigiriki hakina kitenzi katika kifungu cha mwisho. Tafsiri iliyochaguliwa huhifadhi mtindo mfupi wa kimethali na haiongezi nguvu ya amri ambayo haijaandikwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kiriba/viriba' ni neno linaloeleweka kwa chombo cha ngozi, na muundo umehifadhi urudiaji na mkazo wa msemo wa Yesu. Hakuna alama za tanbihi kwa sababu tanbihi za safu ya Kiingereza hazilingani kwa usahihi na alama zake na maelezo yake; matini ya Kigiriki hapa inaweza kutafsiriwa wazi bila tanbihi ya lazima.
