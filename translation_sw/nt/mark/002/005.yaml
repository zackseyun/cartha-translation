  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: sw
  text: Yesu alipoiona imani yao, akamwambia yule mtu aliyepooza, “Mwanangu,[a] dhambi zako zimesamehewa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kigiriki ni namna ya upole ya kumwita mtu: “Mtoto” au “Mwanangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoiona
  rationale: Kirai cha wakati kinaonyesha kwamba Yesu alisema baada ya kuona imani yao, na ni cha asili katika simulizi la Kiswahili.
- source_word: πίστιν
  choice: imani
  rationale: Hapa neno hili linaonyesha imani au tumaini lililodhihirishwa kwa kumleta mtu huyo kwa Yesu.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi cha wingi kinaacha upeo wa kundi bila kuubana, kama ilivyo katika Kigiriki.
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopita wa kisimulizi ni wa kawaida katika Kiswahili; kiambishi cha mtendewa kinaonyesha wazi kwamba Yesu alimwelekea mtu aliyepooza.
- source_word: παραλυτικῷ
  choice: yule mtu aliyepooza
  rationale: Hii ni lugha ya sasa na inayoeleweka kuliko kutumia nomino ya kitaalamu au ya kizamani.
- source_word: Τέκνον
  choice: Mwanangu
  rationale: Ni namna ya upole ya kumwita mtu, inayowasilisha ukaribu wa τέκνον kwa Kiswahili cha asili bila kudai uhusiano wa kimwili.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: dhambi zako zimesamehewa
  rationale: Kauli tendwa inadumisha tamko la msamaha bila kumtaja wazi mtendaji ambaye Kigiriki pia hakumtaji; hali timilifu ya Kiswahili huwasilisha msamaha kama jambo lililo halisi sasa.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dhana hii; umbo lake halibadiliki wazi kati ya umoja na wingi, lakini muktadha wa 'zako' unaonyesha wingi.
theological_decisions:
- issue: Asili na wakati wa tamko la Yesu kuhusu msamaha
  choice: dhambi zako zimesamehewa
  alternative: dhambi zako zinasamehewa
  rationale: Tamko linawasilisha msamaha kama hali halisi kwa mtu huyo. Kauli tendwa inadumisha kutotajwa kwa mtendaji wa msamaha, bila kuongeza maelezo ya kiteolojia kuhusu utaratibu wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetolewa kwa mtiririko wa kawaida wa Kiswahili huku tamko la Yesu likibaki la moja kwa moja.
