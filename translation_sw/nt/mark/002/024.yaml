base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: sw
  text: Nao Mafarisayo walikuwa wakimwambia, “Tazama, kwa nini[a] wanafanya jambo lisiloruhusiwa siku ya Sabato?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, wanafanya nini siku ya Sabato ambacho si halali?” Neno la Kigiriki linaweza kueleweka kuwa “nini,” ingawa katika muktadha huu huenda maana yake ni “kwa nini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa Kiswahili cha kawaida bila kuongeza maana ya wakati.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili; muktadha unalitambulisha wazi.
- source_word: ἔλεγον
  choice: walikuwa wakimwambia
  rationale: Muundo huu unaonyesha hali endelevu au inayoweza kuwa ya kurudiwa ya kitenzi cha wakati uliopita kisichotimilika.
- source_word: αὐτῷ
  choice: -mw-
  rationale: Kiambishi cha yambwa katika “wakimwambia” kinawakilisha kwa kawaida dative inayomaanisha “kwake,” ikimrejelea Yesu.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira, wenye hadhi na unaoeleweka katika Kiswahili cha sasa.
- source_word: τί
  choice: kwa nini
  rationale: Katika swali hili la malalamiko, τί inafanya kazi kwa maana ya sababu, ingawa kimuundo inaweza pia kueleweka kuwa “nini.”
- source_word: ποιοῦσιν
  choice: wanafanya
  rationale: Wakati wa sasa katika usemi wa moja kwa moja umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa umbo la Kigiriki ni wingi, hapa ni nahau ya kawaida inayorejelea siku ya Sabato kwa umoja.
- source_word: ὃ οὐκ ἔξεστιν
  choice: jambo lisiloruhusiwa
  rationale: Huhifadhi wazo la kutoruhusiwa au kutokuwa halali bila kubainisha chanzo mahususi cha katazo.
theological_decisions:
- issue: Asili ya pingamizi la Mafarisayo
  choice: jambo lisiloruhusiwa
  alternative: jambo lisilo halali
  rationale: Tafsiri inadumisha uzito wa kidini na kisheria wa shtaka, lakini haisemi kama katazo linatokana moja kwa moja na sheria ya Maandiko, mapokeo ya Mafarisayo, au ufafanuzi mwingine wa sheria.
- issue: Maana ya τί katika swali
  choice: kwa nini
  alternative: nini
  rationale: Muktadha wa lawama unaunga mkono maana ya “kwa nini,” lakini uwezekano halisi wa kisarufi wa “nini” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walikuwa wakimwambia” huhifadhi hali endelevu ya ἔλεγον; “jambo lisiloruhusiwa” ni la kawaida na halilazimishi uamuzi wa kimadhehebu kuhusu chanzo cha katazo.
