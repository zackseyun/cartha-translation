  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: sw
  text: Alipokuwa akipita, alimwona Lawi, mwana wa Alfayo, ameketi kwenye kituo cha kukusanyia kodi[a], akamwambia, “Nifuate.” Naye akainuka, akamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye kituo cha kukusanyia ushuru.” Neno la Kigiriki linaweza kumaanisha mahali ambapo kodi au ushuru wa forodha ulikusanywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: alipokuwa akipita
  rationale: Muundo wa kuendelea unaweka tukio la kuona ndani ya tendo lililokuwa likiendelea; Kiswahili hiki ni cha asili na kinahifadhi uhusiano huo wa wakati.
- source_word: εἶδεν
  choice: alimwona
  rationale: Kitenzi kinamaanisha moja kwa moja kwamba alimwona Lawi, bila kuongeza wazo la ‘kumtambua’ au ‘kumgundua.’
- source_word: Λευὶν
  choice: Lawi
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: mwana wa Alfayo
  rationale: Muundo wa Kigiriki unaonyesha uhusiano wa uzazi; Kiswahili huhitaji kutaja ‘mwana wa’ waziwazi.
- source_word: καθήμενον
  choice: ameketi
  rationale: Inaeleza hali ya Lawi wakati Yesu alipomwona; ‘ameketi’ ni ya kawaida na yenye hadhi katika Kiswahili cha sasa.
- source_word: ἐπὶ τὸ τελώνιον
  choice: kwenye kituo cha kukusanyia kodi
  rationale: τελώνιον ni mahali pa kukusanyia kodi au ushuru. ‘Kituo cha kukusanyia kodi’ ni wazi na hakifanyi mahali hapo kuwa ofisi ya kisasa au kibanda maalumu bila ushahidi.
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, masimulizi ya kawaida ya Kiswahili hutumia mfululizo wa ‘aka-’; huu huhifadhi uhai na mwendelezo wa simulizi bila kuzua mabadiliko yasiyo ya asili ya wakati.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Amri hii ni fupi na ya moja kwa moja, na inahifadhi maana ya kumfuata Yesu bila kuongeza neno lisilokuwamo katika Kigiriki.
- source_word: ἀναστὰς
  choice: akainuka
  rationale: Inaonyesha tendo lililotangulia kumfuata; kiambishi ‘aka-’ kinaonyesha mfuatano huo kwa kawaida katika Kiswahili.
- source_word: ἠκολούθησεν αὐτῷ
  choice: akamfuata
  rationale: Inadumisha uhusiano wa maneno kati ya amri ‘Nifuate’ na jibu la Lawi, bila kufafanua zaidi kuwa akawa mwanafunzi.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika λέγει
  choice: Kutumia ‘akamwambia’ katika mfululizo wa masimulizi ya Kiswahili
  alternative: ‘anamwambia’
  rationale: Tofauti hii ni ya kimtindo, si ya kimafundisho. Kiswahili cha masimulizi hutumia kwa kawaida mnyororo wa vitenzi vya ‘aka-’, ambao hudumisha uhai wa simulizi na mlolongo wa matendo huku ukiepuka mchanganyiko wa nyakati usio wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, wazi na chenye hadhi. Muundo wa ‘aka-’ umetumiwa kuendeleza kwa ufasaha mlolongo wa matendo katika simulizi. ‘Kituo cha kukusanyia kodi’ huepuka taswira finyu ya kibanda cha barabarani huku tanbihi ikihifadhi uwezekano wa maana ya ushuru.
