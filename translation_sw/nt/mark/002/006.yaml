base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: sw
  text: Lakini baadhi ya waandishi wa sheria walikuwa wameketi pale, wakifikiri mioyoni mwao:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakijadiliana ndani yao” au “wakiwaza akilini mwao.” Kigiriki husema kihalisi “mioyoni mwao,” nahau ya kibiblia inayomaanisha mawazo ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Lakini ... walikuwa
  rationale: δέ hapa inaunganisha simulizi huku ikileta tofauti kati ya tendo la Yesu na mwitikio wa ndani wa kundi jingine; “Lakini” huonyesha badiliko hilo kwa kawaida bila kulitia nguvu kupita kiasi.
- source_word: τινες τῶν γραμματέων
  choice: baadhi ya waandishi wa sheria
  rationale: Muundo wa kigawanyo unaonyesha kuwa ni sehemu tu ya waandishi wa sheria iliyokuwa pale. “Waandishi wa sheria” ni wazi kwa msomaji wa kawaida na hueleza kazi yao ya kitaalamu katika muktadha wa Kiyahudi.
- source_word: ἐκεῖ
  choice: pale
  rationale: Kielezi hiki cha mahali kinarejelea eneo la tukio lililotajwa; “pale” ni cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: καθήμενοι
  choice: wameketi
  rationale: Kitenzi hiki kinaonyesha mkao wao uliokuwa ukiendelea wakati wa tukio. “Walikuwa wameketi” ni Kiswahili cha kawaida katika masimulizi.
- source_word: διαλογιζόμενοι
  choice: wakifikiri
  rationale: Neno linaweza kumaanisha kuwaza, kujadiliana moyoni, au kutoa hoja ndani ya nafsi. “Wakifikiri” linaeleza mchakato wao wa ndani bila kudokeza kwamba walizungumza kwa sauti.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: mioyoni mwao
  rationale: Hii huhifadhi nahau ya kibiblia inayoufanya moyo kuwa kitovu cha mawazo na tafakari za ndani, badala ya kuibadili moja kwa moja kuwa “akilini mwao.”
theological_decisions:
- issue: Nahau ya kianthropolojia καρδίαις
  choice: mioyoni mwao
  alternative: ndani yao; akilini mwao
  rationale: Tafsiri hii huhifadhi ulimwengu wa dhana wa matini, ambamo moyo ni kitovu cha mawazo ya ndani, bila kuingiza utofautishaji wa kisasa kati ya moyo na akili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waandishi wa sheria” limetumiwa badala ya “waandishi” peke yake ili maana ya kundi la kitaalamu la Kiyahudi iwe wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya nahau inayofafanuliwa.
