  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: sw
  text: 'Ninakuambia: Inuka, chukua mkeka wako[a], kisha uende nyumbani kwako.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitanda chako.” Neno la Kigiriki κράβαττος linamaanisha mkeka au kitanda rahisi cha kulalia kinachoweza kubebwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “kwenda kwenye nyumba yako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Ninakuambia
  rationale: Muundo huu wa Kiswahili unatoa kauli ya moja kwa moja yenye mamlaka. Kiambishi cha yambwa -ku- kinamwelekeza mtu anayesemeshwa; mkazo wa kiwakilishi cha Kigiriki haujaongezewa kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: ἔγειρε
  choice: Inuka
  rationale: Ni amri ya kawaida na ya moja kwa moja kwa mtu aliyekuwa amelala au asiyeweza kusimama; inaeleweka vizuri katika Kiswahili cha sasa.
- source_word: ἆρον
  choice: chukua
  rationale: Katika muktadha huu kitenzi kinamaanisha kuinua kitu ili kwenda nacho. “Chukua” ni cha asili zaidi kuliko “inua” peke yake na kinafaa kwa mkeka unaobebeka.
- source_word: κράβαττόν
  choice: mkeka
  rationale: Neno hilo linataja sehemu rahisi ya kulalia inayoweza kubebwa, si lazima kitanda chenye fremu. “Mkeka” linaonyesha vizuri kitu chepesi kilichotandazwa kwa kulalia.
- source_word: καὶ
  choice: kisha
  rationale: Katika mfululizo wa amri, “kisha” linaonyesha hatua inayofuata kwa Kiswahili cha asili bila kubadili maana ya kiunganishi.
- source_word: ὕπαγε
  choice: uende
  rationale: Hii ni amri ya kwenda. Muundo wa utegemezi “uende” baada ya amri zilizotangulia ni wa kawaida katika Kiswahili na unabaki na nguvu ya agizo.
- source_word: εἰς τὸν οἶκόν σου
  choice: nyumbani kwako
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kwenda kwenye makao ya mtu mwenyewe. Maana halisi zaidi ya “kwenye nyumba yako” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Sauti na nguvu ya amri ya Yesu ya kuponya
  choice: 'Kauli ya moja kwa moja yenye amri tatu: “Ninakuambia: Inuka, chukua …, kisha uende …”'
  alternative: “Nakuambia wewe, simama, jitwike kitanda chako, uende nyumbani.”
  rationale: Uandishi unahifadhi mamlaka na uharaka wa maneno ya Yesu bila kuongeza maelezo ya kiteolojia. Maneno ya kawaida ya sasa yametumiwa badala ya mtindo mzito au wa kizamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Ninakuambia” na amri fupi zinadumisha sauti ya moja kwa moja; “mkeka” huepuka dhana ya kitanda kikubwa chenye fremu.
