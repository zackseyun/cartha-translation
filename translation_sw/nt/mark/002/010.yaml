  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: sw
  text: 'Lakini ili mjue kwamba Mwana wa Adamu[a] ana mamlaka duniani ya kusamehe dhambi—anamwambia mtu aliyepooza[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanadamu.” Cheo hiki cha Kigiriki “Mwana wa Adamu” kinaweza kuonyesha ubinadamu na pia kudokeza Danieli 7.
    reason: alternative_reading
  - marker: b
    text: Au, “aliyepooza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Lakini ili
  rationale: “Ili” huonyesha kusudi, huku “lakini” ikihifadhi badiliko lenye utofauti mdogo katika hoja.
- source_word: εἰδῆτε
  choice: mjue
  rationale: Hutoa maana ya moja kwa moja ya kujua kwa ushahidi wa tendo linalofuata.
- source_word: ἐξουσίαν ἔχει
  choice: ana mamlaka
  rationale: “Mamlaka” huonyesha haki halali ya kutenda, si uwezo wa kufanya jambo pekee.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Biblia ya Kiswahili; linahifadhi uwezekano wa maana inayohusu ubinadamu na dokezo la Danieli 7.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza eneo la kidunia ambamo mamlaka hii inatekelezwa.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ya kusamehe dhambi
  rationale: “Kusamehe dhambi” ndiyo namna wazi na ya kawaida ya kuwasilisha maana ya kuondoa au kuachilia hatia ya dhambi.
- source_word: λέγει τῷ παραλυτικῷ
  choice: akamwambia mtu aliyepooza
  rationale: Wakati uliopita wa kisimulizi unasikika wa kawaida zaidi katika Kiswahili kuliko wakati uliopo wa kihistoria wa Kigiriki; “mtu aliyepooza” ni wazi kwa msomaji wa kawaida.
theological_decisions:
- issue: Tafsiri ya jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi jina la cheo na dokezo linalowezekana la Danieli 7 bila kuamua kama mkazo ni ubinadamu, mamlaka ya Kimasihi, au utambulisho wa kiapokaliptiki.
- issue: Maana ya ἐξουσία katika kusamehe dhambi
  choice: mamlaka
  alternative: uwezo; haki
  rationale: Muktadha unahusu uhalali wa kusamehe dhambi, si nguvu au uwezo wa kutenda pekee.
