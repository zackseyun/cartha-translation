base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: sw
  text: Naye akainuka, na mara moja akachukua godoro lake, akatoka mbele ya watu wote. Hata wote wakashangaa sana na kumtukuza Mungu, wakisema, “Hatujawahi kuona jambo kama hili.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Hatujawahi kuona hivi.” Usemi wa Kiyunani unamaanisha kwamba hawakuwa wamewahi kuona jambo kama hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: akainuka
  rationale: Katika muktadha wa uponyaji, kitenzi hiki kinaeleza mtu aliyekuwa amelala akiinuka kwa kuitikia amri ya Yesu. ‘Akainuka’ ni cha kawaida na hakilazimishi maana ya kufufuliwa.
- source_word: εὐθύς
  choice: mara
  rationale: ‘Mara’ linaonyesha kwamba tendo lilifanyika bila kuchelewa na linadumisha kasi ya simulizi la Marko.
- source_word: ἄρας
  choice: akachukua
  rationale: Kitenzi kinaonyesha kuinua kitu ili kukibeba; ‘akachukua’ ni usemi wa kawaida unaofaa mfuatano wa matendo hapa.
- source_word: κράβαττον
  choice: godoro lake
  rationale: Neno linamaanisha tandiko rahisi la kulalia au kubebeka. ‘Godoro’ linaeleweka kwa urahisi na halidokezi kitanda kizito chenye fremu.
- source_word: ἔμπροσθεν πάντων
  choice: mbele ya watu wote
  rationale: Tafsiri hii inahifadhi msisitizo kwamba tendo hilo lilifanyika hadharani, wote wakilishuhudia.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Basi, wote wakashangaa sana
  rationale: ἐξίστασθαι hapa huonyesha mshangao mkubwa uliotokana na jambo lililotokea. ‘Wakashangaa sana’ ni ya asili na inaonyesha uzito wa itikio lao.
- source_word: δοξάζειν τὸν θεόν
  choice: kumtukuza Mungu
  rationale: ‘Kumtukuza Mungu’ linawakilisha moja kwa moja tendo la kumpa Mungu utukufu na ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Hatujawahi kuona jambo kama hili
  rationale: Usemi huu wa Kiyunani unaonyesha kwamba jambo hilo halikuwa limewahi kushuhudiwa nao. Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi umbo halisi zaidi.
theological_decisions:
- issue: Dokezo linalowezekana la ufufuo katika ἠγέρθη
  choice: akainuka
  alternative: alifufuliwa; aliamka
  rationale: Ingawa ἐγείρω inaweza kutumiwa kuhusu ufufuo mahali pengine, hapa muktadha wa moja kwa moja ni wa mtu aliyepooza akiinuka kwa kuitikia amri ya Yesu. Tafsiri haileti maana ya kiufufuo isiyotiliwa mkazo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na vitenzi vinavyofuatana vinadumisha kasi ya simulizi. ‘Godoro’ limetumiwa kwa tandiko rahisi linaloweza kubebwa; ‘mkeka’ ungeweza kuwa finyu mno, na ‘kitanda’ kingeweza kudokeza samani nzito.
