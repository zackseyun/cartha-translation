id: MRK.2.26
reference: Mark 2:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: sw
  text: jinsi alivyoingia katika nyumba ya Mungu wakati wa Abiathari, kuhani mkuu[a], akala mikate ya uwepo, ambayo hairuhusiwi kuliwa na mtu yeyote isipokuwa makuhani[b], akawapa pia wale waliokuwa pamoja naye?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati Abiathari alipokuwa kuhani mkuu.” Kirai hiki kinaweza pia kueleweka kwa upana zaidi kuwa kinarejelea wakati au sehemu ya simulizi inayohusishwa na Abiathari, kuhani mkuu.
    reason: alternative_reading
  - marker: b
    text: “Mikate ya uwepo” ni mikate iliyowekwa wakfu mbele za Mungu katika mahali patakatifu; kwa jadi huitwa “mikate ya wonyesho.”
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: jinsi
  rationale: Hutanguliza simulizi la jambo alilofanya Daudi na ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: alivyoingia katika nyumba ya Mungu
  rationale: Hufuata kwa karibu kitenzi na kirai cha mahali huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: wakati wa Abiathari kuhani mkuu
  rationale: ἐπί pamoja na umilikishi inaweza kuwa na maana ya wakati; tafsiri hii haibani kirai kuwa lazima kipindi rasmi cha ukuhani mkuu pekee.
- source_word: ἄρτους τῆς προθέσεως
  choice: mikate ya W حضور
  rationale: Inakusudia kutaja mikate iliyowekwa mbele za Mungu, lakini neno hili linahitaji kusahihishwa kuwa Kiswahili sanifu katika hatua ya mwisho.
- source_word: ἔφαγεν
  choice: akaila
  rationale: Wakati wa simulizi unaendelezwa kwa kiunganishi -ka-; kiambishi cha yambwa hurejelea mikate kama kitu cha pamoja.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: ambayo si halali kuliwa
  rationale: Huhifadhi maana ya ruhusa au uhalali katika mazingira ya sheria ya ibada.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: isipokuwa na makuhani
  rationale: Hueleza wazi kwamba makuhani ndio pekee walioruhusiwa kuila.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: akawapa pia wale waliokuwa pamoja naye
  rationale: Huhifadhi kishiriki cha Kigiriki kwa Kiswahili cha kawaida; kitu walichopewa kinaeleweka kutokana na muktadha.
theological_decisions:
- issue: Kirai cha wakati kinachomhusu Abiathari na uhusiano wake na simulizi la Agano la Kale
  choice: wakati wa Abiathari kuhani mkuu
  alternative: wakati Abiathari alipokuwa kuhani mkuu; katika habari inayomhusu Abiathari kuhani mkuu
  rationale: Kirai cha Kigiriki kinaweza kueleweka kwa upana zaidi kuliko dai la kipindi rasmi tu. Tafsiri kuu huhifadhi mvutano na tanbihi huonyesha uwezekano mwingine bila kuamua suala hilo kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Hata hivyo, rasimu hii ina dosari ya wazi ya lugha mseto katika istilahi ya ἄρτους τῆς προθέσεως na inapaswa kurekebishwa kuwa “mikate ya uwepo” katika maandishi na tanbihi kabla ya kuchapishwa.
