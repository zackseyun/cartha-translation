  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: sw
  text: Lakini siku zitakuja ambapo bwana arusi ataondolewa kutoka kwao; ndipo watakapofunga siku hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina umoja: “siku hiyo,” si “siku hizo.”'
    reason: Hufafanua kwamba kirai ἐν ἐκείνῃ τῇ ἡμέρᾳ ni cha umoja na kwamba tafsiri haipaswi kukifanya kuwa kipindi cha siku nyingi.
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Lakini siku zitakuja
  rationale: Huhifadhi nahau ya Kigiriki kuhusu siku zijazo na huwakilisha δέ kwa “Lakini,” ikionyesha tofauti na hali ya sasa katika muktadha uliotangulia.
- source_word: ὅταν
  choice: ambapo
  rationale: Katika kishazi kinachohusishwa na “siku,” “ambapo” ni ya asili katika Kiswahili na inaeleza wakati ujao bila kuifanya hali hiyo ionekane kuwa ya kurudiwa-rudiwa.
- source_word: ἀπαρθῇ
  choice: ataondolewa
  rationale: Huhifadhi hali ya kutendwa na wazo la kuondolewa kwa ghafla au kwa nguvu, bila kutaja mtendaji wala namna ya kuondolewa.
- source_word: ἀπ’ αὐτῶν
  choice: kutoka kwao
  rationale: Huonyesha wazi kutenganishwa kwa bwana arusi na wale walio pamoja naye.
- source_word: ὁ νυμφίος
  choice: bwana arusi
  rationale: Ni istilahi sanifu na inayoeleweka kwa νυμφίος, na huhifadhi sitiari ya arusi.
- source_word: καὶ τότε
  choice: ndipo
  rationale: Huonyesha kwa uwazi kwamba kufunga kutafuata baada ya kuondolewa kwa bwana arusi.
- source_word: νηστεύσουσιν
  choice: watakapofunga
  rationale: “Kufunga” ni istilahi ya kawaida ya Kiswahili kwa kujinyima chakula katika muktadha wa kidini; muundo huu unaungana kiasili na “ndipo.”
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku hiyo
  rationale: Huhifadhi umoja na umahususi wa maneno ya Kigiriki kwa Kiswahili cha kawaida; kihusishi ἐν hakihitaji kutafsiriwa kwa “katika” katika usemi huu wa wakati.
theological_decisions:
- issue: Kumtambulisha Yesu kwa sitiari ya bwana arusi
  choice: Kudumisha “bwana arusi” kama sitiari bila kusema wazi katika tafsiri kwamba ni Yesu
  alternative: “nitakapoondolewa kutoka kwao”
  rationale: Muktadha unaonyesha kwamba Yesu anajizungumzia, lakini Kigiriki kinatumia sitiari. Kuihifadhi hudumisha nguvu ya kifasihi na kiteolojia ya maneno hayo.
- issue: Asili ya kuondolewa kwa bwana arusi
  choice: Kutumia hali ya kutendwa “ataondolewa” bila kumtaja mtendaji wala kusema wazi kwamba ni kifo au kusulubiwa
  alternative: “atakapoondolewa kwa kuuawa”
  rationale: Kauli hiyo inadokeza kuondolewa kwa Yesu na kwa kawaida hueleweka kuelekea kifo chake, lakini mstari wenyewe hautaji mtendaji wala namna ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno “bwana arusi” huhifadhi taswira ya arusi; semikoloni hutenganisha kwa uwazi kuondolewa kwake na matokeo yake, yaani kufunga.
