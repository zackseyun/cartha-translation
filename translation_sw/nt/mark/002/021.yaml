  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: sw
  text: Hakuna mtu anayeshona kiraka cha kitambaa ambacho hakijasindikwa ili kisisinyaa juu ya vazi kuukuu[a]. La sivyo, kiraka hicho hung'oka kutoka katika vazi—kile kipya kutoka kile kuukuu—na mpasuko huwa mbaya zaidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “cha kitambaa kisichofuliwa.” Kigiriki hurejelea kitambaa ambacho hakijasindikwa kwa kufuliwa/kukazwa ili kisisinyaa; kikitumiwa kama kiraka, kinaweza kusinyaa baadaye.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kile kijazacho huchukua kutoka humo, kile kipya kutoka kile kuukuu.” Usemi wa Kigiriki ni mgumu; maana yake katika muktadha ni kwamba kiraka kipya hung'oka au huondoka kutoka katika vazi la zamani, na kufanya mpasuko uwe mbaya zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: kiraka
  rationale: Katika muktadha wa kutengeneza vazi, neno hili linamaanisha kipande kinachowekwa kufunika sehemu iliyochanika; “kiraka” ni neno la kawaida na sahihi.
- source_word: ῥάκους ἀγνάφου
  choice: cha kitambaa ambacho hakijafuliwa
  rationale: ἄγναφος hueleza kitambaa ambacho hakijapitia hatua ya kufuliwa/kukamilishwa na hivyo bado kinaweza kusinyaa. Tafsiri hii huhifadhi picha halisi bila kutumia istilahi ngumu.
- source_word: ἐπιράπτει
  choice: anayeshona ... juu ya
  rationale: Kitenzi kinamaanisha kuambatanisha kwa kushona. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha tendo lenyewe.
- source_word: ἱμάτιον παλαιόν
  choice: vazi kuukuu
  rationale: ἱμάτιον ni vazi kwa maana pana, si lazima joho maalumu. “Kuukuu” huonyesha kwamba limezeeka kwa matumizi, jambo linalofaa picha ya kuchanika.
- source_word: εἰ δὲ μή
  choice: La sivyo
  rationale: Huwasilisha kwa ufupi na kawaida matokeo yatakayotokea ikiwa mtu atafanya hivyo.
- source_word: αἴρει
  choice: hulichana vazi
  rationale: Ingawa maana ya msingi ni ‘huondoa/huchukua,’ katika muktadha kiraka kipya huvuta sehemu ya vazi kuukuu na kulichana zaidi. Chaguo hili linaweka matokeo wazi, huku tanbihi ikihifadhi muundo mgumu wa Kigiriki.
- source_word: τὸ πλήρωμα
  choice: kiraka hicho
  rationale: Hapa πλήρωμα ni kipande kinachojaza au kufunika sehemu iliyochanika, yaani kiraka.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: kipya hujitenga na kuukuu
  rationale: Huhifadhi utofautishaji wa Kigiriki kati ya kilicho kipya na kilicho kuukuu bila kuongeza nomino ambazo hazijatajwa wazi katika kishazi hicho.
- source_word: χεῖρον σχίσμα γίνεται
  choice: mpasuko huwa mbaya zaidi
  rationale: σχίσμα ni mpasuko au sehemu iliyochanika; usemi huu ni wa asili katika Kiswahili na unaonyesha hali inayozidi kuwa mbaya.
