  source_fidelity: 'Rasimu inafuata kwa jumla taswira ya Kigiriki: kiraka cha kitambaa kisichofuliwa kwenye vazi la zamani na matokeo ya mpasuko kuwa mbaya zaidi. Hata hivyo, “hulichana vazi” hufanya αἴρει kuwa kitendo cha moja kwa moja cha kulichana, ilhali matini ina usemi mgumu wa ‘kile kijazacho ... huchukua/huang''oa kutoka humo, kipya kutoka kuukuu.’ Tafsiri iseme kiraka hung''oka/hujiondoa kutoka vazi, kisha itoe matokeo ya mpasuko mbaya zaidi.'
