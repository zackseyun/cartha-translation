  terminology: “Kiraka,” “vazi,” na “mpasuko” zinafaa. Neno “kuukuu” lihifadhiwe kwa vazi; kiraka liitwe “kipya” katika sehemu ya ufafanuzi wa mgawanyiko wa Kigiriki. Tanbihi ya a isirejelee ‘hakijakamilishwa’ kama mbadala wa karibu, kwa kuwa ni pana mno; ἀγνάφου hurejelea kutosindikwa kwa kufuliwa/kukazwa ili kusinyaa.
