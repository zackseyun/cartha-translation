    rationale: ‘Hakijakamilishwa’ si mbadala mahususi wa ἀγνάφου. Kwa Kiswahili, ‘kufuliwa’ mara nyingi humaanisha kuoshwa; tanbihi ifafanue kwamba hapa ni usindikaji wa kitambaa unaofanya kisisinyaa.
