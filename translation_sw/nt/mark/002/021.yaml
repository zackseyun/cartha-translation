  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umetunza picha ya kushona kiraka na mvutano wa maneno ‘kipya’ na ‘kuukuu.’
