  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: sw
  text: Ikawa kwamba Yesu alikuwa ameketi kula nyumbani kwake[a], na watoza ushuru wengi na wenye dhambi walikuwa wakila pamoja na Yesu na wanafunzi wake; kwa maana walikuwa wengi, nao walikuwa wakimfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumbani kwa Lawi”; wengine huelewa kuwa ni “nyumbani kwa Yesu.” Kigiriki kinasema tu “nyumbani kwake.”
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: Ikawa
  rationale: Ni wakati uliopo wa kihistoria unaosogeza simulizi mbele; “Ikawa” ni mtindo wa kawaida wa kisimulizi katika Kiswahili bila kulazimisha wakati uliopo.
- source_word: κατακεῖσθαι
  choice: alipokuwa ameketi kula
  rationale: Kitenzi kinaeleza mkao wa wakati wa kula. Kiswahili cha kawaida hakisemi kwa urahisi “kujiegemeza mezani,” hivyo tafsiri hii inaonyesha wazi mazingira ya mlo bila kudokeza kulala tu.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: nyumbani kwake
  rationale: Huhifadhi kiwakilishi cha Kigiriki bila kumtaja mwenye nyumba, hivyo utata wa rejeo unabaki katika matini.
- source_word: τελῶναι
  choice: watoza ushuru
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa mawakala waliokusanya mapato.
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Hutoa maana ya moja kwa moja ya lebo ya kijamii na kidini iliyotumiwa katika muktadha, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: συνανέκειντο
  choice: walikuwa wakila pamoja na
  rationale: Huhifadhi hali ya tendo linaloendelea na wazo la kushiriki mlo; ni ya asili zaidi katika Kiswahili kuliko kutaja mkao wa kujiegemeza mara ya pili.
- source_word: μαθηταῖς
  choice: wanafunzi
  rationale: Ni tafsiri sanifu ya μαθηταί inayohifadhi maana ya watu wanaofundishwa na kumfuata mwalimu.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: kwa maana walikuwa wengi
  rationale: Huhifadhi γάρ kama maelezo ya sababu na kufuata muundo wa Kigiriki bila kuufanya mstari kuwa mzito.
- source_word: ἠκολούθουν αὐτῷ
  choice: walikuwa wakimfuata
  rationale: Muundo wa “walikuwa waki-” huonyesha hali endelevu ya wakati usiotimilifu wa Kigiriki.
theological_decisions:
- issue: Rejeo la αὐτοῦ katika “nyumbani kwake”
  choice: Kiwakilishi “kwake” kimeachwa bila kumtaja mwenye nyumba katika matini kuu.
  alternative: Nyumbani kwa Lawi; au nyumbani kwa Yesu.
  rationale: Kigiriki hakimtaji mwenye nyumba moja kwa moja. Kumtaja Lawi au Yesu katika matini kuu kungeondoa utata halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ameketi kula” na “wakila pamoja” ni miundo ya kawaida inayoeleza mlo wa kale bila kuleta picha potovu ya kulala. Utata wa mwenye nyumba umehifadhiwa kwa kiwakilishi na tanbihi.
