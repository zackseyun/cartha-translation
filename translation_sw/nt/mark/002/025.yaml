  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: sw
  text: Naye akawaambia, “Je, hamjawahi kusoma alichofanya Daudi alipokuwa na uhitaji na alipokuwa na njaa, yeye pamoja na wale waliokuwa pamoja naye?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: alipokuwa na uhitaji
  rationale: Huhifadhi maana ya kuwa katika hali ya kuhitaji bila kuibana kuwa aina moja maalumu ya shida.
- source_word: ἐπείνασεν
  choice: na njaa
  rationale: Katika muundo ‘alipokuwa na uhitaji na njaa,’ Kiswahili cha kawaida huwasilisha hali ya kuwa na njaa kwa uwazi na kwa mtiririko wa asili.
- source_word: οἱ μετ’ αὐτοῦ
  choice: wale waliokuwa pamoja naye
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa watu waliokuwa pamoja na Daudi.
