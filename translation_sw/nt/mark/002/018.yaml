id: MRK.2.18
reference: Mark 2:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: sw
  text: Wanafunzi wa Yohana na Mafarisayo walikuwa wakifunga. Wakaja na kumwambia[a], “Kwa nini wanafunzi wa Yohana na wanafunzi wa Mafarisayo hufunga, lakini wanafunzi wako hawafungi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wakaja wakamwambia.” Kigiriki hakitaji wazi ni nani waliokuja na kusema.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: walikuwa wakifunga
  rationale: Muundo wa kitenzi cha kuwa katika wakati uliopita pamoja na kitenzi-endelevu unaonyesha tendo lililokuwa likiendelea; Kiswahili hiki ni cha kawaida na kinahifadhi hali hiyo.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: wanafunzi wa Yohana
  rationale: Muundo huu unaonyesha uhusiano wa wanafunzi na Yohana; ‘wanafunzi wa Yohana’ ni wa kawaida na wazi katika Kiswahili.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Wakaja na kumwambia
  rationale: Vitenzi vya Kigiriki viko katika wakati wa sasa wa kisimulizi, lakini mfululizo wa ‘wakaja na kumwambia’ ni simulizi la asili katika Kiswahili na unadumisha mwendo hai wa tukio bila kumtaja wazi mtendaji.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na sahihi ya kuuliza sababu katika Kiswahili.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: wanafunzi wa Mafarisayo
  rationale: Tafsiri hii inaonyesha uhusiano unaotolewa na umilikishi wa Kigiriki bila kuongeza maelezo.
- source_word: νηστεύουσιν
  choice: hufunga
  rationale: Katika swali hili wakati wa sasa unaelekea kueleza desturi; ‘hufunga’ huonyesha tendo la kawaida kwa uwazi.
- source_word: οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν
  choice: lakini wanafunzi wako hawafungi
  rationale: ‘Lakini’ inahifadhi utofautishaji wa δέ, na ‘hawafungi’ ni ukanushi wa kawaida unaoweza kueleza desturi.
theological_decisions:
- issue: Utambulisho wa wale waliokuja na kusema
  choice: 'Mtendaji hakutajwa kwa jina katika matini kuu: ‘Wakaja na kumwambia.’'
  alternative: ‘Watu wakaja wakamwambia.’
  rationale: Kigiriki hakitaji wazi kiima cha vitenzi ‘wanakuja’ na ‘wanasema.’ Kutaja kundi fulani kungeondoa utata halisi wa matini; tanbihi inaonyesha uwezekano wa tafsiri ya jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakifunga’ huonyesha tendo linaloendelea, huku ‘hufunga’ ikionyesha desturi katika swali. Muundo wa simulizi ‘Wakaja na kumwambia’ ni wa asili na unaepuka kutaja kundi ambalo Kigiriki hakilitaji wazi.
