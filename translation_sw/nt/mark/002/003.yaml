  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: sw
  text: Nao wakaja wakimletea mtu aliyepooza, aliyebebwa na wanne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaunganisha tukio na simulizi lililotangulia na kuhifadhi kwa kiasi mtindo wa Marko wa kuunganisha sentensi kwa viunganishi.
- source_word: ἔρχονται
  choice: wakaja
  rationale: Ni wakati wa sasa wa kihistoria katika Kigiriki; wakati uliopita unasomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: φέροντες πρὸς αὐτὸν
  choice: wakimletea
  rationale: Muundo huu wa Kiswahili unaonyesha tendo linaloandamana na kuja na mwendo kuelekea kwa Yesu bila kuwa mzito.
- source_word: παραλυτικὸν
  choice: mtu aliyepooza
  rationale: Kivumishi kimetumiwa kama nomino; tafsiri hii ya sasa na yenye heshima humtaja mtu kwanza huku ikieleza hali yake.
- source_word: αἰρόμενον
  choice: aliyebebwa
  rationale: Kauli tendwa inaonyesha wazi kwamba wengine walikuwa wakimbeba mtu huyo.
- source_word: ὑπὸ τεσσάρων
  choice: na watu wanne
  rationale: Ingawa Kigiriki kinasema tu ‘na wanne,’ Kiswahili huhitaji nomino hapa ili sentensi iwe ya kawaida; ‘watu’ haisemi jinsia ambayo haijawekwa wazi na maandishi.
