  naturalness: “Naye alikuwa akisema nao neno” ni muundo wa Kiswahili Sanifu unaosikika wa kawaida katika rejesta ya maandiko, huhifadhi tendo endelevu la imperfect, na huweka wazi walengwa kwa “nao.” “Karibu na mlango” hueleza kwa uwazi zaidi eneo linalokusudiwa na τὰ πρὸς τὴν θύραν kuliko “mlangoni” pekee.
