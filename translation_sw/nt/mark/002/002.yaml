  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: sw
  text: Watu wengi wakakusanyika, kiasi kwamba hapakuwa na nafasi tena, hata karibu na mlango. Naye alikuwa akisema nao neno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe.” Kigiriki, “neno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Watu wengi wakakusanyika
  rationale: Kiswahili hutumia kitenzi cha kujirejelea kwa hali ya kawaida kueleza watu kukusanyika; tafsiri hii ni ya asili na inawasilisha mkusanyiko wa watu wengi bila kuufanya kuwa ‘umati’ usiotajwa moja kwa moja.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: kiasi kwamba hapakuwa na nafasi tena
  rationale: ‘Kiasi kwamba’ linaonyesha matokeo, na ‘hapakuwa na nafasi tena’ linaeleza kwa Kiswahili cha kawaida kwamba nafasi yote ilikuwa imejaa.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: hata mlangoni
  rationale: Usemi huu mfupi na wa kawaida unaonyesha kwamba hata eneo lililokuwa karibu na mlango halikuwa na nafasi.
- source_word: ἐλάλει αὐτοῖς
  choice: alikuwa akiwaambia
  rationale: Muundo wa wakati uliopita unaoendelea unahifadhi hali ya tendo lililokuwa likiendelea; ‘akiwaambia’ haiongezi wazo mahususi la kuhubiri au kufundisha ambalo halijaelezwa na kitenzi chenyewe.
- source_word: τὸν λόγον
  choice: neno
  rationale: ‘Neno’ linafuata usemi wa Kigiriki kwa uwazi na haliongezi ‘la Mungu,’ jambo ambalo halijasemwa wazi katika mstari huu; ‘ujumbe’ ni maana mbadala inayowezekana.
theological_decisions:
- issue: Maana ya τὸν λόγον katika yale Yesu aliyokuwa akiwaambia watu
  choice: neno
  alternative: ujumbe; neno la Mungu
  rationale: Tafsiri ‘neno’ inadumisha ufupi na uwazi wa maandishi ya Kigiriki bila kubainisha zaidi chanzo au maudhui yake. Tanbihi inataja ‘ujumbe’ kama tafsiri ya kimaana, huku ‘neno la Mungu’ likiachwa nje ya matini kwa kuwa ‘la Mungu’ halipo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku uhusiano wa matokeo ukihifadhiwa kwa ‘kiasi kwamba.’
