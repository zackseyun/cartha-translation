  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: sw
  text: Ikawa kwamba, siku ya Sabato, Yesu alikuwa akipita katika mashamba ya nafaka[a], na wanafunzi wake wakaanza kusonga mbele huku wakichuma masuke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nafaka iliyokuwa imesimama shambani.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya neno kwa neno, “wakaanza kufanya njia”; nahau hii hapa ina maana ya kupita au kusonga mbele shambani, huku wakichuma masuke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Kauli ya kawaida ya kusimulia tukio, inayohifadhi nguvu ya utangulizi wa simulizi bila kutumia lugha nzito au ya kizamani.
- source_word: ἐν τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa umbo la Kigiriki ni la wingi, hapa ni matumizi ya kawaida ya Kiyunani cha Koine yanayoelekeza kwenye siku moja ya Sabato.
- source_word: παραπορεύεσθαι
  choice: alikuwa akipita
  rationale: Huonyesha tendo lililokuwa likiendelea na mwendo kupitia eneo hilo.
- source_word: διὰ τῶν σπορίμων
  choice: katikati ya mashamba ya nafaka
  rationale: σπόριμα hurejelea mashamba yaliyopandwa nafaka; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Huwakilisha kwa kawaida mwanzo wa tendo linalofuata katika simulizi.
- source_word: ὁδὸν ποιεῖν
  choice: kupita
  rationale: Nahau hiyo, kwa maana ya msingi 'kufanya njia,' katika muktadha huu inaeleza wanafunzi kuendelea na safari yao shambani, si kujenga barabara au kutengeneza njia rasmi.
- source_word: τίλλοντες
  choice: huku wakichuma
  rationale: 'Huhifadhi kitendo kinachoambatana na kupita kwao: walikuwa wakiondoa masuke kwa mkono.'
- source_word: τοὺς στάχυας
  choice: masuke
  rationale: Neno la kawaida na sahihi la Kiswahili kwa vichwa au masuke ya nafaka.
- source_word: αὐτὸν
  choice: Yesu
  rationale: Kumtaja Yesu wazi hutoa rejeo la kawaida na lisilo na utata katika Kiswahili, badala ya kiwakilishi ambacho kingeweza kutokuwa wazi katika mstari uliotengwa.
theological_decisions:
- issue: Istilahi ya Sabato
  choice: siku ya Sabato
  alternative: siku za Sabato
  rationale: Wingi wa Kigiriki unaeleweka hapa kinahau kuwa siku moja ya Sabato; huu ni uamuzi wa kiisimu, si msimamo wa kimadhehebu.
- issue: Maana ya ὁδὸν ποιεῖν katika mzozo wa Sabato
  choice: kupita
  alternative: kutengeneza njia
  rationale: Tafsiri ya kinahau huepuka kudokeza kwamba wanafunzi walikuwa wakifanya kazi ya kujenga njia. Walikuwa wakiendelea kupita shambani huku wakichuma masuke.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo “huku wakichuma” unaweka wazi kwamba kuchuma masuke kuliambatana na mwendo wao bila kuzidisha aina ya tendo.
