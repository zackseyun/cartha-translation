  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: sw
  text: Nao walipotoka kaburini, wakakimbia, kwa maana tetemeko na mshangao vilikuwa vimewashika[a]. Hawakumwambia mtu yeyote jambo lolote, kwa maana waliogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya miswada inaongeza kile kinachoitwa hitimisho fupi: “Nao waliwaeleza kwa ufupi wale waliokuwa pamoja na Petro mambo yote waliyoagizwa. Baada ya hayo, Yesu mwenyewe pia alituma kwa njia yao, kutoka mashariki hadi magharibi, tangazo takatifu na lisiloharibika la wokovu wa milele. Amina.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: walipotoka
  rationale: Kitenzi kishirikishi cha wakati uliopita, cha kike wingi, kinawarejelea wanawake; muundo huu wa wakati unaonyesha kwa Kiswahili cha kawaida tendo lililotangulia kukimbia kwao.
- source_word: ἔφυγον
  choice: wakakimbia
  rationale: Huhifadhi nguvu na mfuatano wa tendo la φεύγω bila kuongeza wazo lisilokuwapo katika Kigiriki.
- source_word: μνημείου
  choice: kaburini
  rationale: Katika simulizi la ufufuo, “kaburi” ni neno la kawaida na sahihi kwa μνημεῖον.
- source_word: εἶχεν αὐτὰς
  choice: walikuwa wametetemeka na kushikwa
  rationale: Nahau ya Kigiriki inaonyesha kuwa hali hizo ziliwatawala; Kiswahili hiki kinaonyesha athari ya τρόμος kwa namna ya asili na nguvu ya ἔκστασις kama hali iliyowashika.
- source_word: τρόμος
  choice: wametetemeka
  rationale: Hueleza kutetemeka kimwili, bila kulifanya neno hili kuwa sawa kabisa na hofu inayotajwa mwishoni.
- source_word: ἔκστασις
  choice: mshangao
  rationale: Katika muktadha huu ni hali ya kushtuka na kustaajabu sana; “mshangao” ni wazi na haleti maana ya kisasa ya furaha ya kupindukia.
- source_word: οὐδενὶ οὐδὲν
  choice: mtu yeyote jambo lolote
  rationale: Huhifadhi msisitizo mpana wa ukanushaji maradufu wa Kigiriki kwa Kiswahili cha asili.
- source_word: ἐφοβοῦντο
  choice: waliogopa
  rationale: Hueleza hali yao ya hofu kwa lugha rahisi na ya kawaida; muktadha huonyesha kuwa hofu hiyo iliendelea.
- source_word: γάρ
  choice: kwa maana
  rationale: Katika sehemu zote mbili, kiunganishi hiki kinaonyesha sababu na pia huhifadhi hitimisho la ghafla la Marko bila kulainisha kupita kiasi.
theological_decisions:
- issue: Namna ya kushughulikia hitimisho fupi lililowekwa katika mabano baada ya Marko 16:8
  choice: Kutolijumuisha katika matini kuu, bali kulihifadhi katika tanbihi kama tofauti ya kimaandishi.
  alternative: Kulijumuisha hitimisho fupi katika matini kuu, au kuchapisha hitimisho zote mbili katika matini kuu.
  rationale: SBLGNT huweka maneno hayo katika mabano maradufu, ikionyesha kuwa si sehemu ya matini kuu inayotafsiriwa hapa. Tanbihi inahakikisha uwazi kuhusu ushahidi wa miswada bila kuyafanya maneno hayo kuwa sehemu ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unadumisha mwendo wa haraka wa simulizi na mwisho wake wa ghafla; tanbihi imeandikwa kwa mtindo huohuo.
