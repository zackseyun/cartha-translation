  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: sw
  text: Baada ya hayo, aliwatokea wawili miongoni mwao katika umbo tofauti[a], walipokuwa wakitembea kwenda mashambani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika umbo lingine.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenda shambani.” Hapa “mashambani” huenda ndiyo maana ya ἀγρός katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi mfuatano wa wakati unaoonyeshwa na μετά pamoja na maana ya kuendeleza simulizi ya δέ, kwa Kiswahili cha kawaida.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: wawili miongoni mwao
  rationale: Huonyesha kuwa hao wawili walitoka katika kundi kubwa zaidi bila kutumia muundo mzito usio wa kawaida.
- source_word: περιπατοῦσιν
  choice: walipokuwa wakitembea
  rationale: Huwasilisha tendo linaloendelea wakati wa kutokea kwake, kama inavyoonyesha participio ya wakati wa sasa.
- source_word: ἐφανερώθη
  choice: aliwatokea
  rationale: Katika muktadha huu kitenzi hicho hueleza kujionyesha au kuonekana kwa Yesu baada ya kufufuka; 'aliwatokea' ni usemi wa asili wa Kiswahili.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: kwa umbo tofauti
  rationale: Huhifadhi dhana ya μορφή kama umbo au sura inayoonekana na ἑτέρᾳ kama tofauti, bila kueleza namna tofauti hiyo ilivyotokea.
- source_word: πορευομένοις
  choice: kwenda
  rationale: Huonyesha mwendo wenye kusudi huku ikiepuka kurudia kwa uzito maana ya 'wakitembea'.
- source_word: εἰς ἀγρόν
  choice: mashambani
  rationale: Katika muktadha huu ἀγρός yaelekea kumaanisha eneo la nje ya mji au sehemu ya mashambani, si lazima shamba moja maalumu.
theological_decisions:
- issue: Asili ya kutokea kwa Yesu kunakoelezwa na ἐν ἑτέρᾳ μορφῇ
  choice: kwa umbo tofauti
  alternative: kwa sura nyingine
  rationale: Andiko linasema alitokea kwa umbo tofauti lakini halifafanui ikiwa tofauti hiyo ilikuwa katika mwonekano wake, utambuzi wa waliomwona, au namna nyingine. Tafsiri haiongezi ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi mfuatano wa simulizi na utata halisi wa 'umbo tofauti.'
