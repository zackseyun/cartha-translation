  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: sw
  text: Yule aliyeamini na aliyebatizwa ataokolewa[a], lakini yule ambaye hajaamini atahukumiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa mtindo wa kawaida zaidi: “Yeyote anayeamini na anayebatizwa ataokolewa, lakini yeyote asiyeamini atahukumiwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: yule aliyeamini
  rationale: Kirai hiki ni kishiriki cha aoristi kilichotumiwa kama nomino. “Yule aliyeamini” huhifadhi umoja wa kiwakilishi na huonyesha tendo la kuamini lililotangulia matokeo ya wakati ujao, huku likibaki la kawaida katika Kiswahili.
- source_word: βαπτισθεὶς
  choice: na kubatizwa
  rationale: Kitenzi hiki ni kishiriki cha aoristi katika kauli tendwa. Katika muundo wa Kiswahili, “aliyeamini na kubatizwa” huunganisha kwa kawaida matendo mawili yaliyotangulia, na “kubatizwa” huhifadhi kauli tendwa bila kurudia kiambishi cha urejeshi.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Ni kitenzi cha wakati ujao katika kauli tendwa. Katika muktadha huu, “ataokolewa” ni tafsiri iliyo wazi na ya kawaida ya maana ya wokovu, bila kuongeza ufafanuzi wa kimafundisho.
- source_word: ὁ δὲ ἀπιστήσας
  choice: lakini yule ambaye hajaamini
  rationale: δέ huleta utofautishaji, hivyo “lakini” inafaa. “Yule ambaye hajaamini” ni Kiswahili cha kawaida kinachowakilisha mtu kwa umoja na kudumisha ukinzani wa moja kwa moja na kuamini.
- source_word: κατακριθήσεται
  choice: atahukumiwa
  rationale: Wakati ujao wa kauli tendwa hapa unaeleza hukumu ya hatia. “Atahukumiwa” ni sawa, ya kawaida, na haiongezi maelezo yasiyokuwamo katika maandishi.
- source_word: καὶ
  choice: na
  rationale: Huunganisha moja kwa moja kuamini na kubatizwa katika maelezo ya mtu huyo.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha tofauti kati ya matokeo mazuri ya kifungu cha kwanza na hukumu katika kifungu cha pili.
theological_decisions:
- issue: Uhusiano wa kuamini na kubatizwa na wokovu
  choice: Kutaja kuamini na kubatizwa kwa uwazi kama maelezo ya mtu atakayeokolewa, bila kufafanua kimoja kuwa sababu ya kiutendaji ya wokovu.
  alternative: Kusema kwamba ubatizo ni chombo cha lazima cha wokovu, au kuufanya kuwa jambo lisilohusika na maelezo ya mtu aliyeokolewa.
  rationale: Kigiriki kinaunganisha kuamini na kubatizwa katika kifungu cha kwanza, lakini kifungu cha pili kinamtaja asiyeamini—wala hakimtaji moja kwa moja asiyebatizwa—kuwa atakayehukumiwa. Tafsiri inadumisha mvutano huo bila kuutatua kimadhehebu.
- issue: Muundo wa umoja wa kiume wenye maana ya jumla
  choice: Kutumia “yule” kwa maana ya mtu yeyote anayehusika.
  alternative: Kutumia wingi, au kugeuza moja kwa moja kuwa “yeyote” katika maandishi makuu.
  rationale: Vishiriki vya Kigiriki viko katika umoja wa kiume lakini vina maana ya jumla. “Yule” huhifadhi umoja wa kiwakilishi bila kudokeza kwamba kauli hiyo inawahusu wanaume peke yao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa umoja umehifadhiwa, huku tanbihi ikitoa namna ya kawaida zaidi yenye “yeyote”.
