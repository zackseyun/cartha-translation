  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: sw
  text: Baadaye[a], aliwatokea hao kumi na mmoja walipokuwa wameegama mezani[b]. Akawakemea kwa kutokuamini kwao na ugumu wa mioyo yao, kwa sababu hawakuwaamini wale waliokuwa wamemwona baada ya kufufuliwa kwake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Baada ya hayo.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hurejelea mkao wa kawaida wa kuegama wakati wa kula.
    reason: cultural_note
  - marker: c
    text: Au “wale waliokuwa wamemwona akiwa amefufuliwa.” Kigiriki husema kwa karibu zaidi, “wale waliokuwa wamemwona akiwa amefufuliwa,” yaani baada ya kufufuliwa kutoka kwa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Baadaye
  rationale: Ni kielezi cha wakati kinachoonyesha tukio lililofuata; “baadaye” ni Kiswahili cha kawaida na huhifadhi mpangilio wa matukio.
- source_word: ἀνακειμένοις
  choice: walipokuwa wameegama mezani
  rationale: Kitenzi hiki hurejelea mkao wa kuegama uliotumiwa wakati wa kula. Tafsiri hii huhifadhi picha ya desturi hiyo huku “mezani” ikifafanua mazingira kwa msomaji wa leo.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: hao kumi na mmoja
  rationale: Muundo huu unakitaja wazi kikundi cha wale kumi na mmoja bila kuongeza mkazo usio wa lazima katika Kiswahili.
- source_word: ἐφανερώθη
  choice: aliwatokea
  rationale: Katika masimulizi ya kuonekana baada ya ufufuo, “aliwatokea” ni usemi wa kawaida unaowasilisha maana ya kuonekana kwao.
- source_word: ὠνείδισεν
  choice: akawakemea
  rationale: “Kukemea” huonyesha lawama kali kwa lugha ya sasa, iliyo wazi na yenye hadhi.
- source_word: ἀπιστίαν
  choice: kutokuamini kwao
  rationale: Katika muktadha huu neno linamaanisha kushindwa au kukataa kuamini ushuhuda waliokuwa wamepewa.
- source_word: σκληροκαρδίαν
  choice: ugumu wa mioyo yao
  rationale: Tafsiri hii huhifadhi sitiari ya kibiblia ya hali ya ndani inayokataa kuitikia, badala ya kuifupisha kuwa ukaidi tu.
- source_word: θεασαμένοις
  choice: wale waliokuwa wamemwona
  rationale: Huwatambulisha moja kwa moja mashahidi waliomwona Yesu baada ya kufufuliwa.
- source_word: ἐγηγερμένον
  choice: baada ya kufufuliwa
  rationale: Huhifadhi maana ya kauli tendwa ya kitenzi cha Kigiriki na kuweka wazi kuwa kumwona kulikuwa baada ya ufufuo.
- source_word: οὐκ ἐπίστευσαν
  choice: hawakuwaamini
  rationale: Wakati huu wa kitenzi unaonyesha kwamba kabla ya Yesu kuwatokea, walikuwa hawajaukubali ushuhuda wa wale waliomwona.
theological_decisions:
- issue: Kauli ya ufufuo katika ἐγηγερμένον
  choice: baada ya kufufuliwa
  alternative: akiwa amefufuka
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa bila kutaja wazi mtendaji ambaye maandishi hayamtaji, hivyo dai la ufufuo linabaki huku muundo wa chanzo ukiheshimiwa.
- issue: Maana ya σκληροκαρδία
  choice: ugumu wa mioyo yao
  alternative: ukaidi wao
  rationale: Sitiari imehifadhiwa kwa sababu ina uzito wa kibiblia kuhusu upinzani wa ndani; “ukaidi” peke yake ungepunguza upana wa maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kubadili uhusiano wa matukio. Sitiari ya “ugumu wa mioyo” na kauli tendwa ya ufufuo zimehifadhiwa.
