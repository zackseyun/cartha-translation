id: MRK.16.7
reference: Mark 16:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: sw
  text: Lakini nendeni mkawaambie wanafunzi wake na Petro[a], ‘Anawatangulia kwenda Galilaya[b]. Huko mtamwona, kama alivyowaambia.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petro ametajwa kando na “wanafunzi wake.” Huenda jambo hili likasisitiza kurejeshwa kwake baada ya kumkana Yesu, lakini Kigiriki hakisemi wazi “hasa Petro.”
    reason: alternative_reading
  - marker: b
    text: Au “kuingia Galilaya.” Kihusishi cha Kigiriki kinaweza kuonyesha mwendo kuelekea Galilaya au kuingia humo katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti yenye nguvu na mgeuko kuelekea agizo jipya, kwa lugha ya kawaida na yenye hadhi.
- source_word: ὑπάγετε εἴπατε
  choice: nendeni mkawaambie
  rationale: Vitenzi vyote viwili ni maagizo ya wingi. Muundo huu wa mfululizo ni wa asili katika Kiswahili na unabaki na nguvu ya maagizo yote mawili.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: wanafunzi wake na Petro
  rationale: Unadumisha kutajwa kwa Petro kando bila kuongeza maana ya ‘hasa Petro’ au ‘pamoja na Petro.’
- source_word: Προάγει ὑμᾶς
  choice: Anawatangulia
  rationale: Kitenzi προάγω hapa kinaonyesha Yesu akienda mbele yao; ‘anawatangulia’ ni kifupi, cha asili, na kinahifadhi maana ya mwelekeo.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: kwenda Galilaya
  rationale: εἰς inaweza kueleza mwendo kuelekea au kuingia mahali. ‘Kwenda Galilaya’ ni Kiswahili cha kawaida bila kulazimisha tofauti hiyo.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Huko mtamwona
  rationale: Inatoa kwa uwazi ahadi ya kumwona Yesu mahali palipotajwa, huku ‘huko’ ikirejelea Galilaya.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: kama alivyowaambia
  rationale: ‘Kama’ kinahifadhi ulinganifu unaoonyeshwa na καθώς, na ‘alivyowaambia’ ni usemi wa kawaida wa Kiswahili kwa jambo alilokuwa amewaambia hapo awali.
theological_decisions:
- issue: Kutajwa kwa Petro kando baada ya ‘wanafunzi wake’
  choice: wanafunzi wake na Petro
  alternative: wanafunzi wake, hasa Petro; wanafunzi wake, pamoja na Petro
  rationale: Kigiriki kinamtaja Petro kando kwa kuunganisha tu kwa καί. Huenda jambo hilo lina umuhimu wa kisimulizi na wa kurejeshwa kwake baada ya kumkana Yesu, lakini maandishi hayasemi wazi ‘hasa’ wala ‘pamoja na.’ Tafsiri inadumisha mvutano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika ili marejeo yake yawe wazi.
