lexical_decisions:
- source_word: ἐκείνη
  choice: Akaenda
  rationale: Kiima cha kike kinaeleweka kutokana na muktadha unaomtaja Maria Magdalene; Kiswahili kwa kawaida hakihitaji kutaja kiwakilishi huru hapa.
- source_word: πορευθεῖσα
  choice: akaenda
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia kutoa taarifa; muundo wa masimulizi wa “aka-” unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: ἀπήγγειλεν
  choice: kuwaambia
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kutangaza. “Kuwaambia” ni cha asili katika Kiswahili na hakiongezi yambwa isiyotajwa wazi katika Kigiriki.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: wale waliokuwa wamekuwa pamoja naye
  rationale: Muundo huu unatambulisha watu waliokuwa pamoja na Yesu hapo awali; “walikuwa wamekuwa” huhifadhi mtazamo wa wakati uliopita, ingawa ni mzito kidogo kuliko usemi wa kawaida.
- source_word: πενθοῦσι
  choice: wakiomboleza
  rationale: Neno hili linaashiria maombolezo kutokana na kifo au msiba.
- source_word: καὶ κλαίουσιν
  choice: na kulia
  rationale: Huhifadhi tendo la kutoa machozi au kulia kwa huzuni, kwa lugha ya kawaida na yenye hadhi.
