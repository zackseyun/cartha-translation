  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: sw
  text: 'Na ishara hizi zitaandamana na wale walioamini: kwa jina langu watatoa pepo; watasema kwa lugha mpya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndimi mpya.” Neno la Kigiriki linaweza kumaanisha ndimi au lugha; mstari wenyewe hauelezi kwa undani aina ya usemi unaokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: ishara
  rationale: “Ishara” huhifadhi maana ya tendo linalothibitisha au kuonyesha jambo, badala ya kupanua neno kuwa “miujiza” tu.
- source_word: τοῖς πιστεύσασιν
  choice: wale walioamini
  rationale: Muundo huu unaakisi kitenzi kishirikishi cha wakati uliopita na wakati huohuo unawahusu watu hao kwa ujumla.
- source_word: ταῦτα
  choice: hizi
  rationale: Ni kiashiria cha moja kwa moja kinachotazamia orodha ya ishara inayofuata.
- source_word: παρακολουθήσει
  choice: zitafuatana na
  rationale: Hueleza ishara zinazoandamana na waaminio, si mfuatano wa wakati tu; Kiswahili “kufuatana na” ni cha kawaida na huhifadhi pia taswira ya kufuata.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Ni nahau ya asili ya Kiswahili kwa tendo linalofanywa kwa mamlaka ya Yesu.
- source_word: δαιμόνια
  choice: pepo
  rationale: “Pepo” ni neno la kawaida la kibiblia katika Kiswahili kwa δαιμόνια, bila kuingiza usemi tofauti wa “roho wachafu.”
- source_word: ἐκβαλοῦσιν
  choice: watatoa
  rationale: Katika muktadha wa pepo, “kutoa pepo” ni usemi wa kawaida na wa wazi wa kuwafukuza kutoka kwa mtu.
- source_word: γλώσσαις
  choice: lugha
  rationale: Katika Kiswahili, “lugha” kwa kawaida humaanisha lugha ya kusema; “ndimi” huweza kueleweka hasa kama viungo vya mwili. Tanbihi huhifadhi uwezekano wa tafsiri ya jadi “ndimi.”
- source_word: λαλήσουσιν
  choice: watasema
  rationale: Hutoa kwa kawaida maana ya λαλέω katika muundo “kusema kwa lugha,” kwa lugha inayoeleweka na wasomaji wa sasa.
- source_word: καιναῖς
  choice: mpya
  rationale: Huhifadhi moja kwa moja wazo la upya bila kuamua ikiwa lugha hizo hazikujulikana kwa wasemaji au ni za aina nyingine.
theological_decisions:
- issue: Maana ya γλώσσαις katika usemi kuhusu kusema kwa lugha mpya
  choice: lugha mpya
  alternative: ndimi mpya
  rationale: Neno la Kigiriki linaweza kumaanisha ndimi au lugha, na mstari haufafanui kama ni lugha za kibinadamu zinazotambulika au matamshi ya aina nyingine. Matini kuu inatumia Kiswahili cha kawaida “lugha,” huku tanbihi ikihifadhi tafsiri ya jadi bila kuamua jambo hilo kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umehifadhi urudiaji wa nafsi ya tatu wingi na orodha yenye nukta mbili. Alama ya tanbihi [a] ipo katika matini kuu.
