  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: sw
  text: Na asubuhi na mapema sana, siku ya kwanza ya juma[a], wanakuja[b] kwenye kaburi, jua lilipokuwa limechomoza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa maana ya maneno, “katika [siku] moja ya sabato”; huu ni usemi wa nahau wenye maana ya “siku ya kwanza ya juma.”
    reason: lexical_alternative
  - marker: b
    text: Marko anatumia wakati uliopo wa kisimulizi, “wanakuja”; tafsiri nyingine zinaweza kusema “walikuja.”
    reason: lexical_alternative
  - marker: c
    text: Au “baada ya jua kuchomoza.” Muundo wa Kigiriki unaonyesha wakati wa kuwasili kwao bila kulazimisha tofauti kali kati ya “jua lilipokuwa limechomoza” na “baada ya jua kuchomoza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: mapema sana
  rationale: Kirai hiki huhifadhi msisitizo wa λίαν juu ya πρωῒ kwa Kiswahili cha kawaida na chenye ufupi.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: siku ya kwanza ya juma
  rationale: Hii ni nahau ya Kisemiti/Kigiriki cha Koine inayomaanisha siku ya kwanza ya juma; tafsiri ya maana ni wazi kuliko tafsiri sisisi isiyo ya kawaida katika Kiswahili.
- source_word: ἔρχονται
  choice: wanakuja
  rationale: Wakati uliopo umehifadhiwa kama wakati uliopo wa kisimulizi, unaotumiwa mara nyingi na Marko na unaofanya simulizi liwe hai.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: kaburini
  rationale: Katika muktadha wa maziko, μνημεῖον ni kaburi; kiambishi -ni huonyesha mahali wanapoelekea kwa Kiswahili cha asili.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: jua lilipokuwa limechomoza
  rationale: Muundo huu unaonyesha hali ya wakati wa kuwasili kwao na kwamba kuchomoza kwa jua kulikuwa kumetokea, bila kuubana kuwa wakati maalumu kabisa wa macheo.
