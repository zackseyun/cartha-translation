  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: sw
  text: Akawaambia, “Nendeni ulimwenguni kote, mkaitangaze Habari Njema[b] kwa uumbaji wote.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kila kiumbe.” Kifungu cha Kigiriki kinaweza kutafsiriwa kwa maana ya mgawanyo au ya kijumla.
    reason: alternative_reading
  - marker: b
    text: Au “Injili.” Neno la Kigiriki εὐαγγέλιον maana yake halisi ni “habari njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Nendeni
  rationale: Ingawa kimuundo ni kitenzi-shirikishi cha wakati uliopita kinachotangulia amri kuu, hapa kina nguvu ya tendo linaloambatana na amri. Kiswahili cha kawaida na chenye msukumo wa utume hukieleza kwa amri, “Nendeni.”
- source_word: κόσμον ἅπαντα
  choice: ulimwenguni kote
  rationale: κόσμος hapa ni eneo lote la ulimwengu ambamo utume unafanyika, na ἅπαντα inasisitiza ukamilifu wake. “Ulimwenguni kote” ni usemi wa kawaida unaohifadhi upeo wa jumla.
- source_word: κηρύξατε
  choice: kuitangaza
  rationale: κηρύσσω ni kutangaza hadharani kama mjumbe. “Kuitangaza” huhifadhi wazo la tangazo la wazi na lenye mamlaka bila kulifanya liwe istilahi ya shughuli ya kanisani pekee.
- source_word: τὸ εὐαγγέλιον
  choice: Habari Njema
  rationale: εὐαγγέλιον maana yake ya moja kwa moja ni habari njema. “Habari Njema” inaeleweka kwa urahisi katika Kiswahili cha sasa na bado ni istilahi inayotambulika katika matumizi ya Kikristo.
- source_word: πάσῃ τῇ κτίσει
  choice: kwa viumbe vyote
  rationale: κτίσις inaweza kumaanisha kiumbe au uumbaji. Muundo wa umoja wa Kigiriki wenye πάσῃ unaweza kueleweka kwa namna ya mgawanyo, “kila kiumbe,” au kwa namna ya jumla, “uumbaji wote.” “Kwa viumbe vyote” ni ya asili katika Kiswahili na haibani kabisa upeo huo.
- source_word: εἶπεν αὐτοῖς
  choice: Akawaambia
  rationale: Huu ni utangulizi wa kawaida wa simulizi. “Akawaambia” huwasilisha kwa ufupi na kwa asili maana ya “alisema kwao,” bila kuongeza nguvu ya ufafanuzi.
theological_decisions:
- issue: Upeo wa πάσῃ τῇ κτίσει katika agizo
  choice: kwa viumbe vyote
  alternative: kwa kila kiumbe; kwa uumbaji wote
  rationale: Kigiriki kinaweza kusikika kwa namna ya mgawanyo au ya jumla yenye upeo wa kiuumbaji. Tafsiri kuu inaacha upeo mpana wazi, na tanbihi zinahifadhi njia zote mbili bila kuufupisha kimyakimya kuwa wanadamu peke yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ni wa moja kwa moja; “Akawaambia” ni wa asili katika usimulizi. Herufi kubwa katika “Habari Njema” inaonyesha istilahi inayojulikana bila kutumia neno la mkopo “injili.”
