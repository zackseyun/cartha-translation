id: MRK.16.20
reference: Mark 16:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: sw
  text: Nao wakaenda, wakatangaza kila mahali, huku Bwana akifanya kazi pamoja nao na kuuthibitisha ujumbe[a] kwa njia ya ishara zilizofuata.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno.” Hapa neno la Kigiriki λόγος linarejelea ujumbe uliotangazwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia ya ishara zilizoandamana nao,” au “kwa njia ya ishara zilizoandamana na ujumbe.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati za kale zaidi hazina Marko 16:9–20; hati nyingine zina mwisho tofauti.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuwarejelea wanafunzi waliotajwa katika muktadha bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐξελθόντες
  choice: wakaenda
  rationale: Kauli ya kushiriki ya wakati uliopita inaeleweka kiasili kama tendo linaloambatana na kitenzi kikuu katika simulizi.
- source_word: ἐκήρυξαν
  choice: wakatangaza
  rationale: Kitenzi hiki humaanisha kutangaza hadharani; ‘wakatangaza’ ni cha kawaida na hakifungi maana kwenye mahubiri ya kanisani pekee.
- source_word: πανταχοῦ
  choice: kila mahali
  rationale: Hii ni tafsiri sahihi na ya kawaida ya kielezi kinachoonyesha kuenea kwa tangazo.
- source_word: τοῦ κυρίου
  choice: Bwana
  rationale: Cheo hiki kinadumishwa; muktadha wa mstari uliotangulia unamwelekeza msomaji kwa Yesu.
- source_word: συνεργοῦντος
  choice: akifanya kazi pamoja nao
  rationale: Huhifadhi wazo la Bwana kushiriki na kuwasaidia katika kazi yao bila kulipanua zaidi ya maandishi.
- source_word: τὸν λόγον
  choice: ujumbe
  rationale: Katika muktadha, λόγος ni yale yaliyotangazwa, si neno moja; tanbihi inadumisha tafsiri halisi inayowezekana.
- source_word: βεβαιοῦντος
  choice: kuuthibitisha
  rationale: Kitenzi kinaonyesha kuimarisha au kuthibitisha ukweli na uhalali wa ujumbe uliotangazwa.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: kwa njia ya ishara zilizofuata
  rationale: διά inaonyesha njia au chombo, na ἐπακολουθούντων inaweza kumaanisha ishara zilizofuata au zilizoandamana; tafsiri kuu haiongezi kitu kisichotajwa ambacho ishara ziliandamana nacho.
theological_decisions:
- issue: Bwana anayefanya kazi pamoja nao
  choice: Cheo ‘Bwana’ kimeachwa kama kilivyo, huku muktadha ukimwelekeza msomaji kwa Yesu aliyefufuka.
  alternative: Kumtaja Mungu kwa maana ya jumla zaidi.
  rationale: Marko 16:19 humtaja Yesu kama ‘Bwana’; hata hivyo, tafsiri haiongezi jina lake ndani ya mstari huu.
- issue: Kazi ya ishara
  choice: Ishara zinaonyeshwa kuwa njia ambayo Bwana aliuthibitisha ujumbe.
  alternative: Ishara ziliwafuata watangazaji bila kusisitiza kazi ya uthibitisho.
  rationale: Muundo wa sentensi unaunganisha moja kwa moja kuthibitishwa kwa ujumbe na ishara, lakini hausemi chochote hapa kuhusu muda au kuendelea kwa ishara hizo.
- issue: Uhusiano wa ishara na kilichotangulia
  choice: ‘Ishara zilizofuata’ inadumisha kutotajwa wazi kwa kile walichokifuata au kuandamana nacho.
  alternative: ‘Ishara zilizoandamana nao’ au ‘ishara zilizoandamana na ujumbe.’
  rationale: Kigiriki hakina kiwakilishi kinachosema wazi kwamba ishara ziliandamana na wanafunzi au na ujumbe; tanbihi inaonyesha uwezekano huo bila kuamua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘huku Bwana akifanya kazi’ unaonyesha matendo yanayotokea sambamba. ‘Wakatangaza’ huepuka maana finyu ya kitaasisi inayoweza kusikika katika ‘wakihubiri.’
