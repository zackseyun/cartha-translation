  verdict: approve
  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: wanafunzi walienda na kutangaza kila mahali; Bwana alifanya kazi pamoja nao; na ujumbe ulithibitishwa kwa ishara zilizofuata. ‘Ishara zilizofuata’ huhifadhi kwa busara utata wa ἐπακολουθούντων bila kubainisha bila msingi kwamba ishara ziliandamana hasa na wanafunzi au na ujumbe.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na chenye mtiririko wa kawaida. ‘Nao wakaenda, wakatangaza kila mahali’ na ‘huku Bwana akifanya kazi pamoja nao’ ni miundo ya kiasili inayowasilisha matendo sambamba vizuri.
  terminology: ‘Bwana,’ ‘ujumbe,’ ‘kuthibitisha,’ ‘ishara,’ na ‘kutangaza’ zinafaa kwa muktadha na rejista. Tanbihi ya ‘neno’ inawakilisha mbadala halali wa λόγος, na tanbihi ya ishara inaonyesha uwezekano wa kisemantiki bila kuufanya kuwa tafsiri kuu.
