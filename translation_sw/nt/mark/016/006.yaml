id: MRK.16.6
reference: Mark 16:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: sw
  text: Lakini akawaambia, “Msishtuke. Mnamtafuta Yesu Mnazareti[a], aliyesulubiwa. Amefufuliwa; hayupo hapa[b]. Tazameni mahali walipomlaza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu wa Nazareti.” Kigiriki kinatumia jina la utambulisho linalotokana na Nazareti.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Amefufuka.” Kitenzi cha Kigiriki kiko katika kauli tendwa: “Amefufuliwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Msiogope
  rationale: Katika muktadha huu kitenzi kinaonyesha kushtuka na kuingiwa na hofu kubwa, si kushangaa tu; ‘Msiogope’ ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: Ναζαρηνὸν
  choice: Mnazareti
  rationale: Neno la Kigiriki ni jina la kumtambulisha mtu linalotokana na Nazareti; ‘Mnazareti’ huhifadhi umbo hilo la utambulisho.
- source_word: ἐσταυρωμένον
  choice: aliyesulubiwa
  rationale: Huwasilisha tendo lililokamilika la kusulubiwa huku likimtambulisha Yesu kwa jambo hilo; ni la asili na lenye heshima katika Kiswahili.
- source_word: ἠγέρθη
  choice: Amefufuliwa
  rationale: Huhifadhi kauli tendwa ya Kigiriki na hali ya tendo lililokamilika yenye matokeo ya sasa, bila kutaja wazi mtendaji ambaye maandishi hayamtaji.
- source_word: ὧδε
  choice: hapa
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kielezi cha mahali.
- source_word: ἴδε
  choice: Tazameni
  rationale: Amri hii inaelekeza wanawake waangalie mahali husika; wingi unalingana na wanaoambiwa na ni Kiswahili cha sasa.
- source_word: τόπος
  choice: mahali
  rationale: Ni neno la kawaida na lenye uwazi kwa eneo maalumu ndani ya kaburi.
- source_word: ἔθηκαν
  choice: walipomlaza
  rationale: ‘Kulaza’ ni usemi wa asili na wenye heshima katika muktadha wa kuuweka mwili kaburini.
- source_word: ζητεῖτε
  choice: Mnamtafuta
  rationale: Huhifadhi wakati wa sasa na tendo linaloendelea kwa namna ya kawaida katika Kiswahili.
- source_word: λέγει αὐταῖς
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili simulizi kwa kawaida hutumia umbo hili la mfululizo wa matukio; linadumisha uhai wa simulizi bila kuwa gumu.
theological_decisions:
- issue: Kauli na maana ya ufufuo
  choice: Amefufuliwa
  alternative: Amefufuka
  rationale: Kigiriki ἠγέρθη ni kauli tendwa. ‘Amefufuliwa’ huihifadhi na pia hudokeza tendo la Mungu bila kuongeza mtendaji katika maandishi. ‘Amefufuka’ ni ya asili lakini hubadili kauli kuwa tendi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa sentensi umesawazishwa kwa usomaji wa kawaida huku kauli tendwa ya ἠγέρθη na alama zote za tanbihi zikihifadhiwa.
