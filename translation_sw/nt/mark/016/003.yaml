  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: sw
  text: Nao walikuwa wakiambiana, “Ni nani atakayetuvingirishia jiwe kutoka kwenye mlango wa kaburi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakiambiana
  rationale: Muundo huu unahifadhi hali endelevu au ya kurudiwa ya wakati usiotimilika, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: πρὸς ἑαυτάς
  choice: wakiambiana
  rationale: 'Ingawa kihalisi ni ‘kwa nafsi zao,’ katika muktadha wa wanawake wengi maana ni ya kutendeana: walikuwa wakizungumza wao kwa wao.'
- source_word: Τίς
  choice: Ni nani
  rationale: Hili ni swali la kawaida kuhusu mtu ambaye angeweza kufanya tendo hilo.
- source_word: ἀποκυλίσει
  choice: atakayetuvingirishia
  rationale: Kitenzi hiki kinaonyesha kuliondoa jiwe kwa kuliviringisha; kiambishi -tu- pamoja na hali ya utendea kinawasilisha ἡμῖν, ‘kwa ajili yetu.’
- source_word: ἡμῖν
  choice: -tu-...-ia
  rationale: Hapa hali ya udativu inaonyesha faida au tendo linalofanywa kwa niaba yao; Kiswahili huieleza kwa kiambishi cha yambwa pamoja na hali ya utendea.
- source_word: τὸν λίθον
  choice: jiwe
  rationale: Neno la chanzo linasema tu ‘jiwe’; haliongezi kivumishi ‘kubwa’ katika mstari huu.
- source_word: ἐκ τῆς θύρας
  choice: kutoka kwenye mlango
  rationale: θύρα linaweza kumaanisha mlango au mahali pa kuingilia. ‘Mlango wa kaburi’ ni usemi wa kawaida na huhifadhi taswira halisi ya jiwe lililokuwa likiziba uwazi huo.
- source_word: τοῦ μνημείου
  choice: wa kaburi
  rationale: Katika muktadha huu μνημεῖον ni kaburi la kuzikia; ‘kaburi’ ni neno la kawaida na linaloeleweka wazi katika Kiswahili.
