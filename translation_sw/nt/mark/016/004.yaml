  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: sw
  text: Nao walipoinua macho[a], wakaona kwamba lile jiwe lilikuwa limeviringishwa mbali, kwa maana lilikuwa kubwa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipotazama, wakagundua kwamba lile jiwe lilikuwa limeviringishwa mbali.” Kitenzi cha Kigiriki kilicho katika hali timilifu kinakazia kwamba walipoliona, jiwe tayari lilikuwa limeviringishwa mbali na lilibaki katika hali hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: walipoinua macho
  rationale: Kirai hiki cha kawaida katika Kiswahili kinaonyesha kwamba wanawake waliinua mtazamo wao kuelekea kaburini, huku kikihifadhi uhusiano wa kitendo hiki na kuona kulikofuata.
- source_word: θεωροῦσιν
  choice: wakaona
  rationale: Katika simulizi hili, kitenzi kinaeleza utambuzi wa kuona; “wakaona” ni cha asili na kinaendeleza mfuatano wa matukio.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha yaliyokuwa maudhui ya kile walichoona.
- source_word: ἀποκεκύλισται
  choice: lilikuwa limeviringishwa pembeni
  rationale: 'Muundo wa hali timilifu tendwa unaonyesha tendo lililokuwa limekamilika na hali yake ikiendelea: walipoliona, jiwe tayari lilikuwa pembeni.'
- source_word: ὁ λίθος
  choice: lile jiwe
  rationale: “Lile jiwe” hurejelea kwa kawaida jiwe la kaburi lililotajwa katika muktadha bila kuongeza maelezo yasiyosemwa wazi.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: kwa maana lilikuwa kubwa sana
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na “kubwa sana” huwasilisha msisitizo wa σφόδρα kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuwaunganisha wanawake na tendo linalofuata kwa mtiririko wa asili wa Kiswahili.
