source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: sw
  text: Walipoingia kaburini, walimwona kijana[a] ameketi upande wa kulia, amevaa joho jeupe, nao wakashtuka sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malaika.” Hapa Marko anamweleza kuwa “kijana,” ingawa muktadha mpana na masimulizi yanayolingana yanaonyesha kuwa alikuwa mjumbe wa kimalaika.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Walipoingia
  rationale: Kirai cha wakati kinaonyesha tendo la wanawake lililotangulia tendo kuu kwa Kiswahili cha kawaida na cha asili.
- source_word: μνημεῖον
  choice: kaburini
  rationale: Katika muktadha wa maziko na ufufuo, “kaburi” ni neno la kawaida na lililo wazi kwa mahali alipowekwa marehemu.
- source_word: νεανίσκον
  choice: kijana
  rationale: Neno la Kigiriki humtaja kijana wa kiume bila kumtambua wazi kuwa malaika; tafsiri inahifadhi maelezo hayo ya simulizi.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: ameketi upande wa kulia
  rationale: Hutoa kwa kawaida mkao na mahali pa kijana ndani ya kaburi.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: amevaa joho jeupe
  rationale: “Joho” linaonyesha vazi refu au maalumu, huku “amevaa” likitoa hali inayoelezwa na kitenzi-tendaji timilifu.
- source_word: ἐξεθαμβήθησαν
  choice: wakashtuka sana
  rationale: Kitenzi kinaonyesha mshtuko mkubwa au fadhaa kali, zaidi ya mshangao wa kawaida, bila kulazimisha maana ya hofu kuu.
theological_decisions:
- issue: Utambulisho wa νεανίσκος
  choice: Kumtafsiri katika maandishi makuu kama “kijana.”
  alternative: malaika
  rationale: Marko 16:5 mwenyewe hutumia neno linalomaanisha kijana. Ingawa muktadha mpana unaweza kuonyesha kuwa ni mjumbe wa kimalaika, tafsiri haiongezi utambulisho ambao mstari huu hautaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao wakashtuka sana” hudumisha mwendelezo wa simulizi na uzito wa itikio lao.
