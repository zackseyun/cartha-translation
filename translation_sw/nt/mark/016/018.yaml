  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: sw
  text: Watashika nyoka, na hata wakinywa kitu chochote chenye kuua[b], hakitawadhuru kamwe; wataweka mikono juu ya wagonjwa, nao watapona.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina Marko 16:9–20; aya hii ni sehemu ya hitimisho refu la Marko.
    reason: textual_variant
  - marker: b
    text: Au, “kitu chochote cha kuleta kifo”; usemi huu ni mpana, wala hauishii kwa sumu pekee.
    reason: lexical_alternative
  - marker: c
    text: Au, “watakuwa wazima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: nyoka
  rationale: “Nyoka” ndilo neno la kawaida na la asili katika Kiswahili cha sasa; linabeba maana ya ὄφεις bila kutumia lugha ya kizamani.
- source_word: ἀροῦσιν
  choice: watashika
  rationale: Katika muktadha wa nyoka, “watashika” linaeleza kwa kawaida tendo la kuwachukua au kuwainua, bila kuongeza wazo la kuwindwa au kuumwa.
- source_word: κἂν
  choice: na hata waki-
  rationale: Muundo “na hata waki-” unahifadhi hali ya sharti pamoja na nguvu ya concessive inayoweza kuwamo katika καὶ ἐάν.
- source_word: θανάσιμόν τι
  choice: kitu chochote chenye kuua
  rationale: 'Tafsiri hii ni pana kama Kigiriki: inahusu chochote kinachoweza kusababisha kifo, bila kuifupisha maana iwe sumu pekee.'
- source_word: πίωσιν
  choice: wakinywa
  rationale: Kauli ya sharti ya Kigiriki inatolewa kwa muundo wa kawaida wa Kiswahili “waki-”.
- source_word: οὐ μὴ
  choice: kamwe
  rationale: “Kamwe” pamoja na kitenzi hasi “hakitawadhuru” huhifadhi msisitizo mkali wa ukanushi wa Kigiriki.
- source_word: βλάψῃ
  choice: hakitawadhuru
  rationale: “Kudhuru” ni neno pana na la kawaida linalolingana na kusababisha madhara au jeraha.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: wataweka mikono juu ya wagonjwa
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi tendo la kuweka mikono juu ya watu walio wagonjwa bila kuongeza maelezo ya kiibada yasiyotajwa.
- source_word: καλῶς ἕξουσιν
  choice: nao watapona
  rationale: Katika muktadha wa wagonjwa, “watapona” linaeleza kwa Kiswahili cha kawaida matokeo ya kuwa vizuri, huku tanbihi ikihifadhi namna halisi zaidi ya usemi.
theological_decisions:
- issue: Asili na upeo wa ulinzi na uponyaji ulioahidiwa
  choice: Kauli zimetafsiriwa moja kwa moja kama matendo na matokeo yajayo, bila kuongeza ikiwa ni ya waamini wote, ya kipindi fulani pekee, au ya mfano.
  alternative: Kuyafafanua kama ishara za lazima kwa waamini wote, kama yaliyokoma baada ya kipindi cha mitume, au kama lugha ya mfano tu.
  rationale: Kigiriki hakitoi ufafanuzi huo katika aya hii; tafsiri inapaswa kuhifadhi mvutano huo wa kitheolojia.
- issue: Hali ya kifasihi ya Marko 16:9–20
  choice: Aya imetafsiriwa kama ilivyotolewa katika SBLGNT, huku tofauti ya hati ikielezwa katika tanbihi.
  alternative: Kuiacha aya au kuiweka kwenye mabano katika matini kuu.
  rationale: Kwa kuwa aya imo katika matini iliyotolewa lakini mwisho mrefu wa Marko una tofauti muhimu ya hati, uwazi unahitaji matini itafsiriwe na jambo hilo litajwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia miundo ya kawaida “hata wakinywa,” “hakitawadhuru kamwe,” na “watapona,” huku tanbihi zikihifadhi upana wa θανάσιμόν τι, usemi wa καλῶς ἕξουσιν, na tofauti ya hati.
