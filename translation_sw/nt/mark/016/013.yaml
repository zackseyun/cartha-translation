base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: sw
  text: Nao wakaenda wakawaarifu wale wengine[a], lakini wale wengine pia hawakuwaamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliosalia.”
    reason: Neno λοιπός linaweza kutafsiriwa kuwa ‘wengine’ au ‘waliosalia’ katika kundi.
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Nao
  rationale: Muunganiko huu una maana ya ‘nao/na wale pia.’ ‘Nao’ ni Kiswahili cha kawaida kinachowaunganisha hao wawili na simulizi lililotangulia bila kuongeza neno ‘wanaume,’ ambalo halijaandikwa wazi katika Kigiriki.
- source_word: ἀπελθόντες
  choice: wakaenda
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha kwamba waliondoka kabla ya kutoa taarifa. Mfuatano ‘wakaenda wakawaarifu’ unaonyesha hatua hizo kwa Kiswahili cha simulizi kilicho wazi na cha asili.
- source_word: ἀπήγγειλαν
  choice: wakawaarifu
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kutangaza. ‘Kuwajulisha’ pia lingewezekana, lakini ‘kuwaarifu’ linafaa kwa kupeleka habari ya jambo waliloliona; kiwakilishi cha kitu hakiongezwi kwa kuwa Kiswahili hakikihitaji hapa.
- source_word: τοῖς λοιποῖς
  choice: wale wengine
  rationale: λοιπός inaweza kumaanisha wengine wa kundi au wale waliosalia. ‘Wale wengine’ ni ya kawaida na inaacha upeo wa kundi utegemezwe na muktadha.
- source_word: οὐδὲ
  choice: lakini ... pia hawaku-
  rationale: Hapa οὐδέ linaunganisha kutokuamini huku na kutokuamini kulikotajwa kabla, likiwa na maana ya ‘hawakuamini pia.’ ‘Lakini’ huonyesha vizuri mgeuko wa simulizi, na ‘pia’ huhifadhi nguvu ya nyongeza.
- source_word: ἐκείνοις
  choice: wao (katika ‘hawakuwaamini’)
  rationale: Kiwakilishi cha udativo kinawarejelea wale wawili waliotoa taarifa. Kiambishi ‘-wa-’ katika ‘hawakuwaamini’ ni njia ya kawaida ya Kiswahili ya kuonyesha kitendwa cha kibinadamu kwa wingi.
- source_word: ἐπίστευσαν
  choice: hawakuwaamini
  rationale: Katika muktadha huu πιστεύω ni kukubali ushuhuda wao kuwa wa kweli. ‘Kuwaamini’ hudumisha maana hiyo bila kuibadili kuwa tumaini au imani ya kidini kwa maana pana.
theological_decisions:
- issue: Maana ya πιστεύω katika simulizi la ushuhuda
  choice: hawakuwaamini
  alternative: hawakuwatumaini
  rationale: Muktadha unahusu kutokubali taarifa ya wale wawili, si fundisho pana kuhusu imani ya wokovu. ‘Hawakuwatumaini’ lingeelekeza zaidi kwenye utegemezi wa kibinafsi kuliko kukubali ushuhuda wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi ‘wakaenda wakawaarifu’ unafaa kwa simulizi la kawaida. Kurudiwa kwa ‘wale wengine’ katika kishazi cha pili kunaondoa utata wa kiwakilishi na kubainisha kuwa wao ndio waliokataa kuwaamini wale wawili.
