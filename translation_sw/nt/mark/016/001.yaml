  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: sw
  text: Baada ya Sabato kupita, Maria Magdalene, Maria, mama wa Yakobo[a], na Salome walinunua manukato ili waende wakampake manukato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa neno halisi, “Maria, yule wa Yakobo”; yaani, Maria anatambulishwa kwa uhusiano wake na Yakobo, ambao kwa kawaida hueleweka kuwa mwanawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Baada ya Sabato kupita
  rationale: Kauli hii ya wakati inaonyesha kwamba Sabato ilikuwa imekwisha kabla ya tendo kuu. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalene
  rationale: Hili ndilo umbo linalotambulika kwa kawaida katika Kiswahili kwa jina na utambulisho wake wa kutoka Magdala.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria mama yake Yakobo[a]
  rationale: Kigiriki kinasema kwa ufupi ‘Maria wa Yakobo’ bila kutaja wazi uhusiano. Katika muktadha wa Injili, ‘mama yake Yakobo’ ndiyo maana inayowezekana zaidi na ni Kiswahili cha kawaida; tanbihi inahifadhi ufupi na utata wa asili.
- source_word: Σαλώμη
  choice: Salome
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἠγόρασαν
  choice: walinunua
  rationale: Ni kitenzi rahisi cha simulizi kinachoeleza tendo lililotokea.
- source_word: ἀρώματα
  choice: manukato
  rationale: Neno linarejelea vitu vyenye harufu nzuri vilivyotumiwa katika matayarisho ya maziko. ‘Manukato’ ni neno fupi, la kawaida, na linalofaa katika muktadha huu.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: ili waje kumpaka
  rationale: ‘Ili’ linaonyesha kusudi; ‘waje kumpaka’ linaonyesha mfuatano wa kuja kisha kumpaka bila kufanya sentensi kuwa nzito.
- source_word: ἀλείψωσιν
  choice: kumpaka
  rationale: Kitenzi hiki humaanisha kupaka mafuta au kitu chenye harufu mwilini. ‘Kumpaka’ ni cha moja kwa moja na hakiongezi ufafanuzi usio katika matini.
theological_decisions:
- issue: Uhusiano unaodokezwa katika ‘Maria wa Yakobo’
  choice: Maria mama yake Yakobo
  alternative: Maria wa Yakobo
  rationale: Matini ya Kigiriki haitaji neno ‘mama,’ hivyo ina utata wa kisarufi. Hata hivyo, muktadha wa Injili unaunga mkono utambulisho wa Maria kama mama yake Yakobo. Tafsiri kuu inatoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi usemi halisi na uwezekano wake wa kinadharia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka katika usomaji wa kawaida na wa hadharani. ‘Sabato,’ ‘Magdalene,’ na ‘manukato’ ni istilahi zinazotambulika bila kuwa nzito kupita kiasi.
