  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: sw
  text: Nao waliposikia kwamba yu hai[a] na kwamba huyo mwanamke alikuwa amemwona[b], hawakuamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaishi.” Kitenzi cha Kigiriki kiko wakati wa sasa.
    reason: lexical_alternative
  - marker: b
    text: Kwa kufuata kwa karibu zaidi muundo wa Kigiriki, “alikuwa ameonekana na huyo mwanamke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Nao
  rationale: Huunganisha sentensi na simulizi lililotangulia na kuwarejelea wale waliotajwa; “Nao” ni Kiswahili cha kawaida kinachohifadhi nguvu ya καί pamoja na kiwakilishi.
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Kirai cha kitenzi cha wakati uliopita kinafanya kazi ya kuonyesha wakati; “waliposikia” huonyesha wazi mfuatano wa matukio.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutanguliza yaliyomo katika taarifa waliyoisikia.
- source_word: ζῇ
  choice: yu hai
  rationale: Kitenzi cha Kigiriki kiko wakati wa sasa na kinaonyesha kwamba Yesu ana uhai; “yu hai” ni usemi wa sasa, wa kawaida na wenye hadhi katika Kiswahili.
- source_word: καὶ
  choice: na kwamba
  rationale: Huunganisha mambo mawili yaliyosikiwa; kurudia “kwamba” kunafanya sentensi ya Kiswahili iwe wazi bila kubadili maana.
- source_word: ἐθεάθη
  choice: alikuwa amemwona
  rationale: Muundo wa Kigiriki ni wa kutendwa, “alikuwa ameonekana,” lakini Kiswahili cha kawaida huonyesha wazo hili kwa kauli ya kutenda, “huyo mwanamke alikuwa amemwona.” Maana ya tukio na mtendaji wa kuona vimehifadhiwa.
- source_word: ὑπ’ αὐτῆς
  choice: huyo mwanamke
  rationale: Kiwakilishi kinamrejelea mwanamke aliyetajwa katika muktadha uliotangulia. “Huyo mwanamke” ni wazi na hakiongezi jina lisilomo katika mstari huu.
- source_word: ἠπίστησαν
  choice: hawakuamini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kushindwa kuamini taarifa, bila kuongeza wazo la kukataa kwa makusudi.
theological_decisions:
- issue: Usemi wa uhai wa Yesu baada ya kufufuka
  choice: yu hai
  alternative: anaishi
  rationale: Wakati wa sasa wa ζῇ umehifadhiwa wazi, hivyo sentensi inasema kwamba Yesu yuko hai baada ya kifo bila kufafanua zaidi namna ya uhai huo.
- issue: Mtazamo wa tendo la kumwona Yesu
  choice: huyo mwanamke alikuwa amemwona
  alternative: alikuwa ameonekana na huyo mwanamke
  rationale: Kauli ya kutenda ni ya kawaida zaidi katika Kiswahili na inahifadhi maana ya msingi kwamba mwanamke alimwona. Tanbihi inahifadhi muundo wa kutendwa wa Kigiriki, ambao hauhitaji kufasiriwa kuwa Yesu “alijitokeza” kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye hadhi. “Yu hai” ni usemi mfupi unaoeleweka kwa urahisi; “huyo mwanamke alikuwa amemwona” huepuka kauli ya kutendwa isiyo ya kawaida huku tanbihi ikihifadhi umbo la chanzo.
