  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: sw
  text: Basi, Bwana Yesu[a], baada ya kusema nao, alichukuliwa kwenda mbinguni, akaketi upande wa kulia wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina neno “Yesu.”
    reason: Alama ya tofauti ya maandishi katika SBLGNT iko kabla ya Ἰησοῦς; tanbihi inaonyesha tofauti hiyo bila kuibadilisha kimya kimya.
lexical_decisions:
- source_word: μὲν οὖν
  choice: Basi
  rationale: Muunganiko huu wa chembe unaonyesha mpito wenye hitimisho. “Basi” ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo bila kutafsiri chembe hizo kupita kiasi.
- source_word: κύριος Ἰησοῦς
  choice: Bwana Yesu
  rationale: “Bwana” huhifadhi uzito wa κύριος kama cheo cha Kristo, na “Yesu” ni namna sanifu ya jina Ἰησοῦς katika Kiswahili.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: baada ya kusema nao
  rationale: Muundo μετά pamoja na kitenzi-jina unaonyesha wakati unaofuata tendo lililotangulia. Tafsiri hii ni fupi na ya kawaida, huku ikihifadhi mpangilio wa matendo na warejelewa wa αὐτοῖς.
- source_word: ἀνελήμφθη
  choice: alichukuliwa juu
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na wazo la kuinuliwa, bila kutaja wazi mtendaji ambaye maandishi hayamtaji.
- source_word: εἰς τὸν οὐρανόν
  choice: kwenda mbinguni
  rationale: “Kwenda mbinguni” huonyesha mwelekeo na mwisho wa tendo unaowasilishwa na εἰς, kwa Kiswahili cha kawaida.
- source_word: ἐκάθισεν
  choice: akaketi
  rationale: Huwasilisha tendo lililokamilika la kuketi na pia huunganisha kwa kawaida tukio hili na lililotangulia.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: upande wa kulia wa Mungu
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kigiriki inayomaanisha mahali pa heshima na mamlaka. “Upande wa kulia” huepuka picha isiyokusudiwa ya kuketi juu ya mkono halisi.
theological_decisions:
- issue: Lugha ya kupaa na kuinuliwa bila kuongeza maelezo ya kimafundisho
  choice: alichukuliwa juu kwenda mbinguni, akaketi upande wa kulia wa Mungu
  alternative: alipaa mbinguni, akatawala pamoja na Mungu
  rationale: Chaguo lililotumiwa huhifadhi hali ya kutendwa ya ἀνελήμφθη na nahau ya kuketi upande wa kulia, bila kuongeza wazo la “kutawala pamoja” ambalo, ingawa linaweza kuhusishwa na nahau hiyo, halitamkwi moja kwa moja hapa.
- issue: κύριος kama cheo cha Kristo
  choice: Bwana Yesu
  alternative: Yesu, Mkuu
  rationale: “Bwana” ni neno sanifu la Agano Jipya linalohifadhi upana na uzito wa κύριος bila kulifanya liwe cheo cha kijamii tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Basi” huleta mpito wa kawaida; “upande wa kulia wa Mungu” huhifadhi nahau ya kibiblia kwa lugha ya sasa. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
