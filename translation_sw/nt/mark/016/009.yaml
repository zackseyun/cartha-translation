    rationale: Kigiriki kinaonyesha kwamba Yesu ndiye aliyekuwa amewatoa pepo saba kutoka kwa Maria. Kwa kuwa “ambaye” humrejelea Maria, mpangilio wa rasimu unaweza kusomwa kwamba Maria ndiye aliyetoa pepo hao. Mpangilio upya wa “kutoka kwake alikuwa amewafukuza pepo saba” huondoa tatizo hilo na huhifadhi mtenda aliyedokezwa.
  - severity: low
