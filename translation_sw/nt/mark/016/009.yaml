  source_fidelity: Tafsiri inahifadhi kwa usahihi ufufuo, wakati wa alfajiri wa siku ya kwanza ya juma, kutokea kwa Maria Magdalene kwanza, na idadi ya pepo saba. Hata hivyo, kirai cha mwisho katika rasimu, “ambaye alikuwa amemtoa pepo saba,” kinamfanya Maria aonekane kisarufi kuwa mtenda wa tendo la kutoa pepo, badala ya Yesu kuwa mtenda aliyedokezwa na muktadha wa Kigiriki.
  naturalness: 'Marekebisho yanaongeza koma baada ya kirai cha mwanzo na kupanga upya kirai cha mwisho kwa Kiswahili sanifu cha kawaida: “kutoka kwake alikuwa amewafukuza pepo saba.” Hii humweka mhusika wa tendo kama yule anayezungumziwa katika sentensi kuu bila kuongeza jina lisilopo katika chanzo.'
  terminology: “Kufufuka,” “alfajiri,” “siku ya kwanza ya juma,” “alimtokea,” na “pepo saba” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki na zinadumisha rejesta ya kibiblia. “Kuwafukuza pepo” hutoa kwa kawaida maana ya ἐκβάλλω katika muktadha huu.
  issues:
