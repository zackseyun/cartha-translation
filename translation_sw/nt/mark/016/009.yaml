  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: sw
  text: Baada ya kufufuka[a], alfajiri siku ya kwanza ya juma, alimtokea kwanza Maria Magdalene, ambaye kutoka kwake alikuwa amewafukuza pepo saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mistari ya 9–20 haipatikani katika baadhi ya hati za kale za Marko; hati nyingine zinayo, nyakati nyingine zikiwa na tofauti mbalimbali.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Baada ya kufufuka
  rationale: Kirai cha wakati kinatangulia kitenzi kikuu na kinaonyesha kwamba kufufuka kulitokea kabla ya kujitokeza kwake; Kiswahili hiki ni cha kawaida na hakiongezi mhusika ambaye muktadha tayari unamtambulisha.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: Ni kiunganishi hafifu cha kusogeza simulizi mbele; katika Kiswahili sentensi inaenda kwa kawaida bila kuongeza ‘basi’ au ‘lakini’, ambavyo vingetia mkazo usiokuwamo.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: alfajiri siku ya kwanza ya juma
  rationale: πρωῒ huelekeza wakati wa mapema asubuhi, na πρώτῃ σαββάτου ni nahau ya siku ya kwanza ya juma. ‘Alfajiri’ ni fupi, ya kawaida, na yenye hadhi.
- source_word: ἐφάνη
  choice: alimtokea
  rationale: Katika simulizi za kuonekana baada ya ufufuo, umbo hili humaanisha kujitokeza au kuonekana kwa mtu; ‘alimtokea’ huonyesha kwa kawaida kwamba alijionyesha kwa Maria.
- source_word: πρῶτον
  choice: kwanza
  rationale: Inahifadhi wazi mpangilio wa kuwatokea watu.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: Maria Magdalene
  rationale: Jina limetolewa kwa umbo linalotambulika katika Kiswahili, na kiambishi cha yambwa katika ‘alimtokea’ kinawakilisha hali ya dative.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: ambaye alikuwa amemtoa
  rationale: Pluperfect inaonyesha tendo lililotangulia kutokea kwake Maria. Kiswahili hutumia ‘alikuwa amemtoa’ kwa mlolongo huo; umoja wa ‘-mtoa’ unafuata ngeli ya ‘pepo’ katika matumizi haya.
- source_word: ἑπτὰ δαιμόνια
  choice: pepo saba
  rationale: ‘Pepo’ ndilo neno la kawaida la Kiswahili kwa viumbe hawa katika muktadha wa kutoa pepo; idadi saba imehifadhiwa moja kwa moja.
theological_decisions:
- issue: Hali ya kiuhakiki wa maandishi ya Marko 16:9 katika mwisho mrefu wa Marko
  choice: Kutafsiri mstari uliotolewa na kuweka tanbihi kuhusu tofauti ya hati
  alternative: Kuishia Marko 16:8 kwa kufuata hati za kale ambazo hazina 16:9–20
  rationale: Chanzo kilichotolewa kinajumuisha mstari lakini kinauweka katika mabano yanayoashiria shaka ya kimapokeo ya maandishi. Tanbihi huhifadhi ushahidi huo bila kuondoa mstari wala kuamua kimya kimya kati ya mapokeo ya hati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo, huku mpangilio wa matukio, lugha ya kutoa pepo, na suala la tofauti za hati vikihifadhiwa.
