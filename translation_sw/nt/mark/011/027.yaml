  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: sw
  text: Nao wakafika tena Yerusalemu. Yesu alipokuwa akitembea katika viwanja vya hekalu[a], wakuu wa makuhani, waandishi, na wazee wakamjia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekaluni” au “katika eneo la hekalu”; neno la Kigiriki linamaanisha eneo pana la hekalu, si sehemu ya ndani ya hekalu pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wakafika
  rationale: Ni wakati wa sasa wa kihistoria katika simulizi la Kigiriki; wakati uliopita wa Kiswahili unasimulia tukio kwa njia ya kawaida na kuonyesha kufika kwao Yerusalemu.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudi au kufika kwa mara nyingine.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: ἐν τῷ ἱερῷ
  choice: katika viwanja vya hekalu
  rationale: ἱερόν hapa ni eneo pana la jengo na viwanja vya hekalu, si patakatifu pa ndani pekee; usemi huu unaweka wazi mahali pa tukio la hadharani.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Yesu alipokuwa akitembea
  rationale: Kirai hutoa mazingira ya tendo linaloendelea. Jina Yesu limetumiwa badala ya kiwakilishi kisicho na rejeo wazi katika mstari huu pekee, bila kubadili maana.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Katika wingi, neno hili linamaanisha viongozi wa kikuhani, si makuhani wakuu wa pekee kwa kila mmoja.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi cheo cha kundi hili bila kukipunguza kuwa walimu wa sheria tu.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika muktadha huu ni viongozi waliotambuliwa katika jamii, si watu wenye umri mkubwa tu.
- source_word: πρὸς αὐτόν
  choice: wakamjia
  rationale: Kitenzi chenye kiambishi cha kumwelekea mtu huwasilisha kwa kawaida mwendo wao kwenda kwa Yesu.
theological_decisions:
- issue: Maana ya ἱερόν
  choice: viwanja vya hekalu
  alternative: hekaluni; katika eneo la hekalu
  rationale: Tafsiri hii haidokezi kwamba Yesu alikuwa ndani ya patakatifu pa ndani, bali huhifadhi maana ya eneo pana la hekalu ambako watu wangeweza kukutana hadharani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. Muundo wa ‘wakafika ... wakamjia’ unaendeleza mfululizo wa matukio; ‘Nao’ linaunganisha mstari huu na simulizi lililotangulia.
