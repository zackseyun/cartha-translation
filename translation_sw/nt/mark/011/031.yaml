  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: sw
  text: Nao walikuwa wakijadiliana wao kwa wao, wakisema, “Tuseme nini? Tukisema, ‘Kutoka mbinguni,’[a] atasema, ‘Basi, kwa nini hamkumwamini?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kutoka mbinguni” ni namna ya Kiyahudi ya kusema kwa heshima “kutoka kwa Mungu” au “kuwa na asili ya Mungu.”
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: wakajadiliana
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha mashauriano yaliyokuwa yakiendelea. ‘Wakajadiliana’ huonyesha mchakato wa kutafakari na kubadilishana mawazo kwa lugha ya kawaida.
- source_word: πρὸς ἑαυτοὺς
  choice: wao kwa wao
  rationale: Kirai hiki kinaonyesha majadiliano ya pamoja ndani ya kundi, si mawazo ya kimoyomoyo ya kila mmoja peke yake.
- source_word: Τί εἴπωμεν;
  choice: Tuseme nini?
  rationale: Huhifadhi swali la mashauriano linalotafuta jibu wanalopaswa kutoa, kwa Kiswahili cha asili na cha sasa.
- source_word: ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Huwasilisha sharti kwa ufupi na kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Ἐξ οὐρανοῦ
  choice: Ulitoka mbinguni
  rationale: Muktadha ni chanzo cha ubatizo wa Yohana; umoja wa ngeli unaorejelea kwa kueleweka jambo hilo huifanya sentensi iwe ya asili huku ‘mbinguni’ ikihifadhi nahau ya Kigiriki.
- source_word: ἐρεῖ
  choice: atasema
  rationale: Ni tafsiri ya moja kwa moja ya wakati ujao wa λέγω; swali linalofuata linaonyesha kuwa usemi huo ni changamoto.
- source_word: Διὰ τί οὖν
  choice: Basi, kwa nini
  rationale: ‘Basi’ huhifadhi uhusiano wa kimantiki wa οὖν na matokeo ya jibu lao la kudhaniwa.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: hamkumwamini
  rationale: πιστεύω pamoja na yambwa ya dativu hapa humaanisha kuukubali ushuhuda wa Yohana kuwa wa kweli; ‘kumwamini’ ni sahihi kuliko ‘kumwamini katika’.
theological_decisions:
- issue: Maana ya ‘kutoka mbinguni’ kuhusu ubatizo au mamlaka ya Yohana
  choice: Kuhifadhi nahau ‘Ulitoka mbinguni’ katika matini kuu
  alternative: Ulitoka kwa Mungu
  rationale: Matini ya Kigiriki inasema kihalisi ‘kutoka mbinguni,’ nahau ya Kiyahudi inayoashiria asili au idhini ya Mungu. Kuihifadhi huepuka kufanya maana iliyodokezwa kuwa kauli ya wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakajadiliana wao kwa wao’ ni wazi kwa wasomaji wa kawaida; mazungumzo yamewekwa kwa ufupi na kwa mtiririko wa asili.
