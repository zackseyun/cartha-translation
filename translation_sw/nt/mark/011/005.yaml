  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: sw
  text: Baadhi ya wale waliokuwa wamesimama pale waliwaambia, “Mnafanya nini, mkimfungua mwana-punda[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyama mchanga.” Neno la Kigiriki πῶλος linaweza kumaanisha mnyama mchanga; katika muktadha huu linamtaja punda.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: Baadhi ya watu
  rationale: Huhifadhi maana ya kundi lisilotajwa kwa ukamilifu miongoni mwa waliokuwapo, kwa Kiswahili cha kawaida.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: waliokuwa wamesimama pale
  rationale: Hufuata kirai cha Kigiriki kinachowataja watu waliokuwa wamesimama mahali hapo bila kuongeza dhana ya watazamaji.
- source_word: ἔλεγον αὐτοῖς
  choice: wakawaambia
  rationale: Katika usimulizi wa Kiswahili, umbo hili huonyesha kwa kawaida tendo la kusema lililoanza katika mfuatano wa matukio; kutafsiri kwa hali endelevu kama ‘walikuwa wakiwaambia’ kungekuwa kizito, na ‘waliendelea kuwaambia’ kungezidisha wazo la kurudia.
- source_word: Τί ποιεῖτε
  choice: Mnafanya nini
  rationale: Ni swali la moja kwa moja kuhusu tendo lao na haliongezi maana ya ‘kwa nini’ isiyo wazi katika Kigiriki.
- source_word: λύοντες
  choice: kumfungua
  rationale: Katika muktadha wa mnyama aliyefungwa, ‘kumfungua’ ni usemi wa asili na sahihi; kiambishi cha ngeli ya uhai kinapatana na mwana-punda.
- source_word: τὸν πῶλον
  choice: mwana-punda
  rationale: πῶλος kwa msingi ni mnyama mchanga, na muktadha wa simulizi unaonyesha hapa ni punda. ‘Mwana-punda’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili, huku tanbihi ikihifadhi upana wa neno la Kigiriki.
