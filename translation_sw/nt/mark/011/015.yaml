id: MRK.11.15
reference: Mark 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: sw
  text: Nao wakafika Yerusalemu. Yesu alipoingia katika eneo la Hekalu[a], alianza kuwafukuza wale waliokuwa wakiuza na wale waliokuwa wakinunua humo. Akazipindua meza za wabadilishaji fedha na viti vya wale waliokuwa wakiuza njiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, eneo lote la Hekalu, kutia ndani nyua zake; neno la Kigiriki halirejelei hasa patakatifu pa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wakafika
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati uliopita wa masimulizi, ambao ni wa kawaida katika Kiswahili na unaonyesha kufika kwao Yerusalemu.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
- source_word: εἰσελθὼν
  choice: alipoingia
  rationale: Muundo huu wa Kiswahili unaonyesha kuingia kwa Yesu kama tukio lililotangulia tendo kuu bila kutumia tafsiri ngumu ya kisarufi.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: eneo la Hekalu / humo
  rationale: ἱερόν hapa ni eneo lote la Hekalu, si patakatifu pa ndani pekee. 'Humo' huepuka kurudia kirai hicho bila kupoteza mahali panaporejelewa.
- source_word: ἤρξατο ἐκβάλλειν
  choice: alianza kuwafukuza
  rationale: Inahifadhi dhana ya kuanza kwa tendo na nguvu ya ἐκβάλλω kwa Kiswahili cha kawaida.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: wale waliokuwa wakiuza na wale waliokuwa wakinunua
  rationale: Inadumisha ulinganifu wa vihusishi viwili na hali ya matendo yaliyokuwa yakiendelea.
- source_word: κολλυβιστῶν
  choice: wabadilishaji fedha
  rationale: Ni istilahi wazi na ya kawaida kwa watu waliobadilisha sarafu katika mazingira ya Hekalu.
- source_word: καθέδρας
  choice: viti
  rationale: Ni tafsiri pana na ya asili isiyobainisha aina ya kiti zaidi ya ushahidi wa Kigiriki.
- source_word: περιστερὰς
  choice: njiwa
  rationale: Ni neno la kawaida la Kiswahili linalofaa katika muktadha wa wanyama waliouzwa kwa ajili ya sadaka.
- source_word: κατέστρεψεν
  choice: akazipindua
  rationale: Inaeleza kwa uwazi na kwa nguvu kitendo cha kugeuza meza na viti.
theological_decisions:
- issue: Upeo wa maana ya ἱερόν katika simulizi hili
  choice: eneo la Hekalu
  alternative: Hekalu
  rationale: Neno ἱερόν linarejelea eneo pana la jengo na nyua za Hekalu, si patakatifu pa ndani hasa. Tafsiri ya wazi katika matini kuu huzuia dhana potofu ya kwamba biashara hii ilifanyika ndani ya patakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. 'Nao' hudumisha mwendelezo wa simulizi; kumtaja 'Yesu' baada ya kiima cha wingi huondoa utata wa kiima kwa njia ya asili katika Kiswahili.
