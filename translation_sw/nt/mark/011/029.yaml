  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Nitawauliza swali moja.[a] Nijibuni,[b] nami nitawaambia ni kwa mamlaka gani ninafanya mambo haya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo moja,” au kwa tafsiri ya neno kwa neno zaidi, “neno moja.”
    reason: lexical_alternative
  - marker: b
    text: Au “swali moja, nanyi mnijibu, nami nitawaambia.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti ndogo na swali la viongozi katika mstari uliotangulia, huku ikiendeleza simulizi kwa njia ya kawaida ya Kiswahili.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa kitendo cha Yesu kuwaambia watu hao maneno yanayofuata.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Nitawauliza
  rationale: Kitenzi cha wakati ujao kinatanguliza swali ambalo Yesu atawauliza kwa kujibu changamoto yao.
- source_word: ἕνα λόγον
  choice: swali moja
  rationale: Ingawa λόγος kwa maana ya msingi inaweza kuwa ‘neno,’ katika muktadha huu inarejelea jambo linalotakiwa kujibiwa; ‘swali moja’ ni wazi na ya kawaida.
- source_word: ἀποκρίθητέ μοι
  choice: Nijibuni
  rationale: Inahifadhi amri ya moja kwa moja kwa kundi la watu na ni fupi na ya kawaida katika Kiswahili.
- source_word: ἐρῶ ὑμῖν
  choice: nitawaambia
  rationale: Inaonyesha ahadi ya Yesu ya kuwapa taarifa baada ya wao kumjibu.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kwa mamlaka gani
  rationale: Kirai hiki kinauliza msingi au uhalali wa matendo ya Yesu; huu ni usemi wa kawaida wa Kiswahili.
- source_word: ταῦτα ποιῶ
  choice: ninafanya mambo haya
  rationale: Wakati uliopo unaonyesha matendo ya Yesu yanayobishaniwa na viongozi.
theological_decisions:
- issue: Maana ya ἐξουσία katika muktadha
  choice: mamlaka
  alternative: haki; uwezo
  rationale: Hoja kuu ni uhalali wa Yesu kufanya mambo haya, si uwezo wake tu. ‘Mamlaka’ inadumisha maana ya kitaasisi na ya kitheolojia bila kuifinyanga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mgawanyo wa sentensi baada ya ‘swali moja’ unaondoa mfuatano mzito huku ukihifadhi amri na ahadi inayofuata; tanbihi [b] inaonyesha uwezekano wa kudumisha viunganishi vya Kigiriki kwa karibu zaidi.
