  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: sw
  text: Wakaenda, wakamkuta mwana-punda amefungwa kwenye mlango, nje barabarani[a], nao wakamfungua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mlango ulio nje barabarani.” Kirai cha Kigiriki kinaweza kuweka mkazo wa mahali kwa namna tofauti kidogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: wakaenda
  rationale: Kitenzi hiki kinaonyesha kuwa waliondoka walipokuwa baada ya kupewa maagizo; “wakaenda” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: εὗρον
  choice: wakamkuta
  rationale: Katika muktadha huu wa simulizi, “kumkuta” huonyesha kwa kawaida kwamba walifika na kumwona mnyama mahali alipotajwa.
- source_word: πῶλον
  choice: mwana-punda
  rationale: πῶλος humaanisha mnyama mchanga. Muktadha mpana unamtambulisha kuwa punda, na “mwana-punda” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: δεδεμένον
  choice: amefungwa
  rationale: Hali timilifu ya kitenzi inaonyesha kuwa mwana-punda alikuwa katika hali ya kufungwa walipomkuta; “amefungwa” huhifadhi hali hiyo kwa lugha ya asili.
- source_word: πρὸς θύραν
  choice: karibu na mlango
  rationale: πρός hapa huonyesha ukaribu wa mahali. “Karibu na mlango” ni wazi bila kudai kwamba alikuwa ndani ya mlango wenyewe.
- source_word: ἔξω
  choice: nje
  rationale: Neno hili linaweka mahali pa mwana-punda upande wa nje; “nje” ndiyo tafsiri ya kawaida na fupi.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: kando ya njia
  rationale: ἄμφοδον inaweza kumaanisha njia, kichochoro, au sehemu ya kupita. “Kando ya njia” huwasilisha mahali kwa Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano mwingine wa mpangilio wa kirai.
- source_word: λύουσιν αὐτόν
  choice: wakamfungua
  rationale: Wakati wa sasa wa kihistoria umetafsiriwa kwa wakati wa simulizi wa Kiswahili. “Kumfungua” ni usemi wa kawaida kwa kuondoa kamba iliyomfunga mnyama.
