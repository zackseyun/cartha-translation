base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: sw
  text: Nao wakawaambia kama Yesu alivyosema, nao wakawaacha waende[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawaruhusu” au “wakawaachilia.” Kitenzi cha Kigiriki kinaweza kumaanisha kuruhusu, kuachilia, au kuacha waende; hapa maana ni kwamba watu hao hawakuwazuia tena wanafunzi kumchukua mwana-punda.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Kibainishi kilichotumiwa kama nomino kinawarejelea wanafunzi, na δέ inaendeleza masimulizi kwa kiunganishi cha kawaida bila kusisitiza utofautishaji.
- source_word: εἶπαν αὐτοῖς
  choice: wakawaambia
  rationale: Huu ni usemi wa kawaida wa kusema jambo kwa watu waliotajwa, na umbo hili ni la asili katika Kiswahili cha masimulizi.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: kama Yesu alivyokuwa amewaambia
  rationale: καθώς huonyesha kwamba jibu lao lililingana na maagizo ya Yesu; wakati uliopita wa awali unaonyesha kwamba Yesu alikuwa amesema hayo kabla ya jibu hili.
- source_word: ἀφῆκαν αὐτούς
  choice: wakawaruhusu waende
  rationale: Katika muktadha huu ἀφίημι humaanisha kwamba watu hao waliacha kuwazuia wanafunzi, hivyo wakawapa ruhusa waondoke pamoja na mwana-punda.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wa kawaida na wenye heshima. Kirai “wakawaruhusu waende” kinaweka wazi maana ya kimuktadha bila kuondoa upana wa kitenzi cha Kigiriki, ambao umeonyeshwa katika tanbihi.
