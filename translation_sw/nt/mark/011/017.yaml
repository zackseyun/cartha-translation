  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: sw
  text: Kisha alikuwa akifundisha na kuwaambia, “Je, haijaandikwa, ‘Nyumba yangu itaitwa nyumba ya sala kwa mataifa yote[a]’? Lakini ninyi mmeifanya kuwa pango la wanyang’anyi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufasiri mpana, “kwa watu wote.” Kigiriki kinasema “kwa mataifa yote,” kikitoa mwangwi wa Isaya 56:7 na kuonyesha upeo unaovuka Israeli.
    reason: lexical_alternative
  - marker: b
    text: “Pango la wanyang’anyi” linatoa mwangwi wa Yeremia 7:11. Neno la Kigiriki linaweza pia kumaanisha “majambazi” katika miktadha fulani.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: alikuwa akifundisha
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililokuwa likiendelea katika eneo la hekalu.
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: akiwaambia
  rationale: Huwasilisha kwa Kiswahili cha kawaida usemi uliokuwa ukiendelea, pamoja na yambwa ‘wao’ iliyomo katika αὐτοῖς.
- source_word: Οὐ γέγραπται
  choice: Je, haijaandikwa
  rationale: Huhifadhi swali la kukanusha na hali timilifu ya kauli tendwa inayotambulisha nukuu yenye mamlaka ya Maandiko.
- source_word: Ὁ οἶκός μου
  choice: Nyumba yangu
  rationale: Ni tafsiri ya moja kwa moja inayodumisha lugha na mwangwi wa Isaya 56:7 bila kuibadili kuwa ‘hekalu’.
- source_word: οἶκος προσευχῆς
  choice: nyumba ya sala
  rationale: Ni muundo wa kawaida na wa asili unaohifadhi maana ya kirai cha Kigiriki.
- source_word: κληθήσεται
  choice: itaitwa
  rationale: Huwakilisha kwa kawaida wakati ujao wa kauli tendwa.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: kwa mataifa yote
  rationale: Huhifadhi ‘mataifa’ kama kilinganishi cha ἔθνη na upeo mpana wa nukuu ya Isaya; kihusishi ‘kwa’ kinafaa kwa dhamira ya nyumba hiyo bila kufafanua kupita kiasi kazi ya dativu.
- source_word: ὑμεῖς δὲ
  choice: Lakini ninyi
  rationale: ‘Lakini’ huonyesha utofauti mkali, na ‘ninyi’ huhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: πεποιήκατε
  choice: mmeifanya kuwa
  rationale: Huhifadhi hali ya sasa iliyotokana na tendo lililofanywa, kama inavyodokezwa na wakati timilifu.
- source_word: σπήλαιον λῃστῶν
  choice: pango la wanyang’anyi
  rationale: ‘Pango’ hudumisha picha ya maficho, na ‘wanyang’anyi’ hufaa kwa mwangwi wa Yeremia 7:11 bila kulazimisha maana maalumu ya kisiasa.
theological_decisions:
- issue: Upeo wa mataifa katika nukuu ya kinabii
  choice: kwa mataifa yote
  alternative: kwa watu wote
  rationale: ‘Mataifa’ ni tafsiri ya moja kwa moja ya ἔθνη na huhifadhi mwangwi wa Isaya 56:7 pamoja na kusudi la nyumba ya Mungu kuwafikia walio nje ya Israeli, bila kuingiza mfumo wa kiteolojia wa baadaye.
- issue: Nguvu ya λῃστῶν katika shtaka la Yesu
  choice: wanyang’anyi
  alternative: majambazi
  rationale: Mwangwi wa Yeremia 7:11 unaunga mkono maana ya watu wanaopora na kisha kutumia pango kama maficho; tafsiri hii haibani neno hilo kwenye uasi wa kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wa leo, huku hali ya tendo linaloendelea, msisitizo wa ‘ninyi,’ nukuu za kinabii, na utofauti kati ya kusudi la nyumba na matumizi yake vikihifadhiwa.
