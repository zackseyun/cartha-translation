base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: sw
  text: Na mtu yeyote akiwaambia, ‘Kwa nini mnafanya hivi?’ mwambieni, ‘Bwana[a] anamhitaji, naye atamrudisha hapa mara moja.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘bwana.’ Neno la Kigiriki κύριος linaweza kumaanisha ‘Bwana’ au ‘bwana’; hapa limetafsiriwa ‘Bwana’ kulingana na muktadha wa Injili.
    reason: alternative_reading
  - marker: b
    text: Au, ‘naye anamrudisha hapa mara moja.’ Kitenzi cha Kigiriki ἀποστέλλει kiko katika wakati wa sasa, lakini kinaweza kutumiwa kwa maana ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: mtu yeyote akiwauliza
  rationale: Muundo wa ἐάν pamoja na kitenzi cha hali tegemezi unaeleza sharti la wakati ujao lililo wazi; ‘akiwauliza’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Kwa nini mnafanya hivi?
  rationale: Ingawa τί kwa msingi inaweza kumaanisha ‘nini,’ hapa swali linapinga kitendo chao; ‘Kwa nini mnafanya hivi?’ ni usemi wa kawaida unaowasilisha nguvu ya swali.
- source_word: εἴπατε
  choice: mwambieni
  rationale: Ni amri ya wingi. Kwa kuwa anayewauliza ametajwa kwa umoja, ‘mwambieni’ ni ya asili zaidi kuliko ‘semeni’ bila kupoteza maana.
- source_word: Ὁ κύριος
  choice: Bwana
  rationale: κύριος inaweza kumaanisha ‘Bwana’ au ‘bwana/mkuu.’ Katika muktadha wa Injili hapa inaelekea kuwa cheo kinachomhusu Yesu, hivyo ‘Bwana’ imetumiwa huku uwezekano mwingine ukitajwa katika tanbihi.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: anamhitaji
  rationale: Kiwakilishi kinamhusu mwana-punda wa mstari uliotangulia. Kiswahili humrejelea mnyama kwa ngeli ya viumbe hai, kwa hiyo ‘anamhitaji’ ni wazi na ya kawaida.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Huhifadhi maana ya uharaka iliyo ya kawaida katika matumizi ya Marko.
- source_word: ἀποστέλλει
  choice: atamrudisha
  rationale: Ingawa umbo la Kigiriki ni la wakati wa sasa, katika muktadha huu linaweza kuwa wakati wa sasa wenye maana ya wakati ujao; Kiswahili cha wakati ujao huwasilisha mtiririko wa kauli kwa kawaida.
- source_word: πάλιν ὧδε
  choice: hapa
  rationale: Maana ya ‘kurudi’ tayari imo katika ‘atamrudisha’; ‘hapa’ huwasilisha ὧδε, huku πάλιν ikiwakilishwa na kiambishi cha kurudisha katika kitenzi.
theological_decisions:
- issue: Rejeo na uzito wa κύριος
  choice: ‘Bwana’ limetumiwa kama cheo kinachomhusu Yesu.
  alternative: ‘bwana’ au ‘mkuu’ katika maana ya kawaida ya mwenye mamlaka
  rationale: Muktadha ni Yesu anayetoa maagizo na neno hilo linaweza kuwa na uzito wa cheo katika Injili. Tafsiri inadumisha jambo hilo bila kuongeza dai la kimafundisho lisilosemwa wazi na mstari.
- issue: Mtendaji wa ἀποστέλλει
  choice: ‘naye atamrudisha’ humrejelea mtu anayewauliza wanafunzi.
  alternative: Kitenzi kinaweza kusomwa bila kutaja wazi mtendaji, au mtendaji akaeleweka kuwa Bwana.
  rationale: Mtendaji wa karibu zaidi katika mtiririko wa sentensi ni mtu anayepinga kitendo chao, lakini Kigiriki hakimtaji tena kwa jina. Kiwakilishi ‘naye’ kinafuata usomaji wa kawaida wa muktadha bila kupanua maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mwambieni’ na viambishi vya ngeli ya viumbe hai vinatoa mtiririko wa kawaida kwa kurejelea mtu na mwana-punda.
