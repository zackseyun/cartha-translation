  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: sw
  text: Naye akaingia Yerusalemu, katika eneo la hekalu[a]. Baada ya kutazama kila kitu, kwa kuwa tayari kulikuwa kumechelewa[b], akatoka kwenda Bethania pamoja na wale kumi na wawili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyua za hekalu,” au kwa kifupi, “hekaluni.” Neno la Kigiriki linarejelea eneo lote la hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuwa saa ilikuwa imekwisha kwenda,” au “kwa kuwa ilikuwa tayari jioni.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, wanafunzi kumi na wawili wa Yesu.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi hiki kinaonyesha kuingia, na umbo la masimulizi “akaingia” linaendeleza mtiririko wa matukio kwa Kiswahili cha kawaida.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili.
- source_word: τὸ ἱερόν
  choice: eneo la hekalu
  rationale: ἱερόν hapa hurejelea eneo zima la hekalu, si patakatifu pa ndani pekee; “eneo la hekalu” ni wazi na halibani maana kwa nyua tu.
- source_word: περιβλεψάμενος πάντα
  choice: baada ya kutazama kila kitu kilichomzunguka
  rationale: Tafsiri hii inaonyesha kitendo cha kuangalia huku na huku kwa makini na kuhifadhi mpangilio kwamba alitazama kabla ya kuondoka.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: kwa kuwa wakati ulikuwa umekwenda sana
  rationale: Kirai hiki kinaeleza hali ya wakati na pia sababu ya kuondoka; Kiswahili hiki ni cha asili bila kulazimisha kutaja saa mahususi.
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: akaenda Bethania
  rationale: Katika muktadha, kuondoka kuelekea Bethania ndilo wazo kuu. Kiswahili “akaenda” ni cha kawaida, ingawa maana ya kutoka inaeleweka kutokana na mwendo huo.
- source_word: μετὰ τῶν δώδεκα
  choice: pamoja na wale kumi na wawili
  rationale: “Wale kumi na wawili” huonyesha kundi linalojulikana bila kuingiza cheo kisichowekwa wazi na sarufi ya Kigiriki.
theological_decisions:
- issue: Maana ya τὸ ἱερόν
  choice: eneo la hekalu
  alternative: hekalu; nyua za hekalu
  rationale: Neno la Kigiriki linamaanisha eneo pana la jengo na viwanja vya hekalu, tofauti na ναός, patakatifu pa ndani. Tafsiri haipaswi kudokeza kwamba Yesu aliingia sehemu ya ndani.
- issue: Utambulisho wa τῶν δώδεκα
  choice: wale kumi na wawili
  alternative: wale wanafunzi kumi na wawili; wale Mitume Kumi na Wawili
  rationale: Andiko lenyewe linatumia idadi kama utambulisho wa kundi. Tafsiri kuu inahifadhi namna hiyo, huku tanbihi ikifafanua kuwa ni wanafunzi wake.
- issue: Nguvu ya ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: kwa kuwa wakati ulikuwa umekwenda sana
  alternative: kwa kuwa ilikuwa tayari jioni; kwa sababu saa ilikuwa imekwenda
  rationale: Kirai kinaweza kusomwa kwa uzito wa wakati au sababu. “Kwa kuwa” huhifadhi uhusiano na kuondoka, na “wakati ulikuwa umekwenda sana” huepuka kubainisha zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi na hadhi inayofaa maandiko. “Eneo la hekalu” limetumiwa kwa uwazi wa kijiografia; “wale kumi na wawili” limehifadhi umbo la chanzo bila kuweka cheo cha kimadhehebu.
