  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: sw
  text: Nao wale waliokuwa wakitangulia na wale waliokuwa wakifuata walikuwa wakipaza sauti:[b] “Hosana![a] Amebarikiwa yeye ajaye kwa jina la Bwana!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” ni mwito wa kiliturujia wenye asili ya Kiebrania/Kiaramu, wenye maana inayokaribia “tuokoe, tafadhali” au “okoa sasa”; hapa hutumiwa pia kama shangwe ya sifa.
    reason: lexical_alternative
  - marker: b
    text: Shangwe hii ina mwangwi wa Zaburi 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: wale waliotangulia mbele
  rationale: Huwatambulisha watu waliokuwa mbele ya Yesu katika msafara, huku ikidumisha wazo la kutangulia.
- source_word: οἱ ἀκολουθοῦντες
  choice: wale waliofuata
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kundi lililokuwa likija nyuma yake na unahifadhi uwiano na kundi lililotangulia.
- source_word: ἔκραζον
  choice: walikuwa wakipaza sauti
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha mwito ulioendelea au kurudiwa; usemi huu unaonyesha sauti kubwa ya hadharani.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Unukuzi huu unaendeleza mwangwi wa kiliturujia na wa Maandiko; maana yake ya awali inaelezwa katika tanbihi bila kuifinya kuwa ombi tu au sifa tu.
- source_word: Εὐλογημένος
  choice: Amebarikiwa
  rationale: Huhifadhi muundo wa baraka na mwangwi wa Zaburi 118:26 kuliko tafsiri kama ‘Asifiwe.’
- source_word: ὁ ἐρχόμενος
  choice: yeye ajaye
  rationale: Huwasilisha kirai nomino cha Kigiriki kwa lugha ya heshima na inayotambulika katika nukuu ya Maandiko bila kuongeza cheo cha Kimasihi kisichotajwa wazi.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Ni nahau ya kawaida ya kibiblia inayohifadhi wazo la kuja kwa mamlaka au kama mwakilishi wa Bwana na mwangwi wa Zaburi.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika muktadha huu wa nukuu ya Maandiko.
theological_decisions:
- issue: Iwapo utambulisho wa Kimasihi katika shangwe hiyo uelezwe wazi ndani ya tafsiri
  choice: Kudumisha maneno ya kinukuu ‘Amebarikiwa yeye ajaye kwa jina la Bwana’ bila kuongeza ‘Masihi’ au ‘mfalme.’
  alternative: ‘Amebarikiwa Masihi ajaye kwa jina la Bwana’ au ‘Amebarikiwa mfalme ajaye kwa jina la Bwana.’
  rationale: Muktadha una uzito wa Kimasihi, lakini maandishi ya Kigiriki ya mstari huu hayataji cheo hicho wazi. Maneno ya Zaburi yanahifadhi maana na mvutano huo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakipaza sauti’ huonyesha tendo lililoendelea, na ‘yeye ajaye’ huhifadhi sauti ya kinukuu cha Maandiko bila kuwa ya kizamani kupita kiasi.
