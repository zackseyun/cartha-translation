  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: sw
  text: Naye akajibu[a], akauambia mti huo, “Mtu yeyote asile tena matunda yako kamwe[b].” Nao wanafunzi wake walisikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno zaidi: “Naye akijibu, akauambia.” Kitenzi “kujibu” ni mtindo wa kawaida wa masimulizi ya Kigiriki hata kama hakuna maneno yaliyotangulia yaliyotajwa.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Mtu yeyote asile matunda yako milele.” Kigiriki, kwa neno kwa neno: “mpaka enzi.”'
    reason: alternative_reading
  - marker: c
    text: 'Imperfect ya Kigiriki inaweza kuonyesha tendo endelevu: “Nao wanafunzi wake walikuwa wakisikia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Hudumisha kitenzi cha Kigiriki cha ‘kujibu’ ingawa hakuna maneno ya awali yaliyonukuliwa; huu ni mtindo wa kawaida wa masimulizi.
- source_word: αὐτῇ
  choice: akauambia mti huo
  rationale: Kiwakilishi kinamrejelea mtini. Kutaja ‘mti huo’ ni Kiswahili cha kawaida na bado hudumisha kwamba Yesu anauelekezea mti maneno moja kwa moja.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: tena … kamwe
  rationale: Muunganiko huu unatoa maana ya kukoma kabisa na kwa kudumu; ‘tena … kamwe’ ni wa asili na wenye msisitizo katika Kiswahili.
- source_word: ἐκ σοῦ
  choice: matunda yako
  rationale: Huhifadhi usemi wa nafsi ya pili unaouelekea mti moja kwa moja; katika Kiswahili umilikishi huu huwasilisha kwa kawaida wazo la matunda yanayotoka kwenye mti.
- source_word: μηδεὶς
  choice: mtu yeyote asile
  rationale: Kiswahili hutumia ‘mtu yeyote’ pamoja na kitenzi hasi kuwasilisha maana ya ‘asiwepo mtu yeyote.’
- source_word: καρπὸν
  choice: matunda
  rationale: Ingawa Kigiriki kina umbo la umoja, hapa neno hilo lina maana ya jumla; ‘matunda’ ndilo chaguo la kawaida kwa mazao ya mti.
- source_word: φάγοι
  choice: asile
  rationale: Hali tegemezi hasi ya Kiswahili hudumisha nguvu ya nia au laana ya optative ya Kigiriki, badala ya kuifanya kuwa utabiri wa kawaida.
- source_word: ἤκουον
  choice: walikuwa wakisikia
  rationale: Muundo huu hudumisha hali endelevu ya imperfect ya Kigiriki bila kuongeza yule au kitu walichokuwa wakisikia.
- source_word: μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kirai cha umilikishi cha Kigiriki.
theological_decisions:
- issue: Asili ya tamko la Yesu kwa mtini
  choice: 'Kutumia hali ya nia/laana: “Mtu yeyote asile tena matunda yako kamwe.”'
  alternative: 'Kulifanya kuwa utabiri wa moja kwa moja: “Hakuna mtu atakayekula tena matunda yako kamwe.”'
  rationale: φάγοι ni optative yenye nguvu ya nia au laana, si future indicative. Tafsiri hudumisha tamko la hukumu bila kuligeuza kuwa utabiri tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ‘asile’ unadumisha nguvu ya tamko la nia/laana, huku ‘tena … kamwe’ ukibeba msisitizo wa kudumu. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini kuu.
