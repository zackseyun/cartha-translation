source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: sw
  text: Akawaambia, “Nendeni katika kijiji kilicho mbele yenu. Mara tu mtakapoingia humo, mtamkuta mwana-punda amefungwa, ambaye bado hajapandwa na mtu yeyote. Mfungueni, mlete.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Nendeni
  rationale: Amri ya kwenda; ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: κώμην
  choice: kijiji
  rationale: κώμη kwa kawaida humaanisha makazi madogo yasiyo mji.
- source_word: τὴν κατέναντι ὑμῶν
  choice: kilicho mbele yenu
  rationale: Huwasilisha kijiji kilichokabiliana nao kwa Kiswahili cha asili bila kudai kwa lazima kwamba kiko upande mwingine wa kitu fulani.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Mara tu mtakapoingia humo
  rationale: 'Huonyesha kwa kawaida uhusiano wa wakati: watakapokuwa wameingia ndipo watakapomwona mara moja.'
- source_word: εὑρήσετε
  choice: mtamkuta
  rationale: Kitenzi cha wakati ujao chenye maana ya kukutana na au kumwona akiwa mahali hapo; ngeli ya uhai inafaa kwa mnyama.
- source_word: πῶλον
  choice: mwana-punda
  rationale: πῶλος ni mnyama mchanga; muktadha wa kuingilia Yerusalemu unaonyesha mwana wa punda, na neno hili ni wazi kwa msomaji wa Kiswahili.
- source_word: δεδεμένον
  choice: amefungwa
  rationale: Huhifadhi hali inayotokana na kufungwa iliyo katika kauli tendwa timilifu.
- source_word: ἐφ’ ὃν οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: ambaye hajawahi kupandwa na mtu yeyote
  rationale: Kwa mnyama wa kupandwa, Kiswahili cha kawaida hutumia kauli tendwa ‘kupandwa’; ‘mtu yeyote’ huonyesha wazi kuwa hakuna mwanadamu aliyempanda.
- source_word: λύσατε
  choice: Mfungueni
  rationale: Katika muktadha wa mnyama aliyefungwa, maana ni kufungua kifungo chake.
- source_word: φέρετε
  choice: mkamlete
  rationale: Huhifadhi maana pana ya ‘kumleta’ bila kuongeza namna maalumu ya kumsafirisha au kumwongoza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwana-punda’ huchaguliwa badala ya neno pana lisilotaja aina ya mnyama, kwa kuwa muktadha unaibainisha. Hakuna tanbihi inayohitajika katika aya hii.
