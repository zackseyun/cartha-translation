  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: sw
  text: Makuhani wakuu na waandishi wakasikia hayo, nao walikuwa wakitafuta jinsi ya kumwangamiza[a]. Kwa maana walikuwa wakimwogopa, kwa sababu umati wote ulikuwa ukistaajabishwa na mafundisho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumuua” au “kumtia kifo.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuangamiza” kwa upana zaidi, ingawa muktadha unaonyesha nia ya kumuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: wakasikia hayo
  rationale: Kitenzi kinaweza kumaanisha kusikia au kupata habari. ‘Hayo’ linaelekeza kwa matendo na maneno ya Yesu hekaluni bila kufafanua zaidi ya matini.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni jina la kawaida la kundi la viongozi wa kikuhani huko Yerusalemu, wala halidokezi kwamba kulikuwa na watu wengi walioshika kwa wakati mmoja cheo cha kuhani mkuu.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Neno hili la jadi linataja kundi la wasomi wa Maandiko na sheria katika mazingira ya Kiyahudi; halibani maana kama tafsiri ya kifafanuzi ‘walimu wa sheria.’
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Kauli ya wakati usiotimilika inaonyesha jitihada au nia iliyoendelea.
- source_word: πῶς
  choice: jinsi ya
  rationale: Inaonyesha namna au njia ambayo viongozi walikusudia kutumia, kwa Kiswahili cha kawaida na cha asili.
- source_word: ἀπολέσωσιν
  choice: kumwangamiza
  rationale: ἀπόλλυμι inaweza kumaanisha kuangamiza au kuua. ‘Kumwangamiza’ huhifadhi upana wa neno, ingawa muktadha unaonyesha nia ya kumuua.
- source_word: ἐφοβοῦντο
  choice: walimwogopa
  rationale: Huhifadhi hali ya hofu iliyoendelea na kumweka Yesu mwenyewe kama yule aliyeogopwa.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Huhifadhi msisitizo wa muundo wa Kigiriki kwamba umati kwa ujumla uliathiriwa.
- source_word: ἐξεπλήσσετο
  choice: ulikuwa umeshangazwa
  rationale: Hutoa kwa Kiswahili hali yenye nguvu ya mshangao wa umati, bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: na mafundisho yake
  rationale: Katika muundo ‘kushangazwa na,’ Kiswahili hiki huonyesha kwa kawaida sababu au msingi wa mshangao.
theological_decisions:
- issue: Upana wa nia ya viongozi katika ἀπολέσωσιν
  choice: kumwangamiza
  alternative: kumuua; kumwondoa kwa kumuua
  rationale: Muktadha unaelekea wazi kwenye njama ya kumuua Yesu, lakini kitenzi chenyewe kina maana pana zaidi. Matini kuu huhifadhi upana huo, na tanbihi inaonyesha maana ya wazi inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘walikuwa wakitafuta’ unahifadhi tendo lililoendelea; ‘waandishi’ linadumisha istilahi ya kibiblia bila kuingiza ufafanuzi wa dhehebu.
