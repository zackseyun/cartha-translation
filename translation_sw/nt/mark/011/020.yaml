  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: sw
  text: Nao walipokuwa wakipita asubuhi na mapema, waliona mtini umekauka kuanzia mizizini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umekauka kutoka mizizini.”
    reason: Tofauti halali ya kileksika kwa ἐξηραμμένην ἐκ ῥιζῶν; inaeleza hali ya mti kukauka kuhusiana na mizizi yake.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: walipokuwa wakipita
  rationale: 'Kirai hiki huhifadhi tendo la nyuma linalotendeka wakati mmoja na tendo kuu: waliona huku wakipita.'
- source_word: πρωῒ
  choice: asubuhi na mapema
  rationale: Hutoa wazi maana ya wakati wa mapema asubuhi kwa Kiswahili cha kawaida.
- source_word: εἶδον
  choice: waliona
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kuona bila kuongeza wazo la kutambua kwa makini.
- source_word: συκῆν
  choice: mtini
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mti wa tini katika muktadha huu.
- source_word: ἐξηραμμένην
  choice: umenyauka
  rationale: Hueleza hali ya mti iliyotokana na tendo lililotangulia na ni lugha ya kawaida kuhusu mmea uliopoteza uhai na ukavu.
- source_word: ἐκ ῥιζῶν
  choice: kuanzia mizizini
  rationale: Huhifadhi wazo kwamba kunyauka kulianzia kwenye mizizi, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
