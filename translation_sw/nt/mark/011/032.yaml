base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: sw
  text: Lakini tukisema[a], “Ni kutoka kwa wanadamu”?—waliuogopa umati, kwa maana wote waliamini kwamba Yohana kwa kweli alikuwa nabii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka kwa wanadamu?”; au kwa kufafanua zaidi, “Ni ya asili ya kibinadamu?”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki pia kinaweza kutafsiriwa, “kwa maana wote walimwona Yohana kuwa kweli nabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaendeleza utofautishaji wa tawi jingine la mashauriano yao bila kuongeza maneno ya ufafanuzi.
- source_word: εἴπωμεν
  choice: tukisema
  rationale: Hali ya utegemezi katika mashauriano inaelezwa kwa Kiswahili cha kawaida kwa ‘tukisema’, ikidokeza sharti lililo wazi katika muktadha.
- source_word: Ἐξ ἀνθρώπων
  choice: Ilitoka kwa wanadamu
  rationale: Hurejelea chanzo cha ubatizo au mamlaka ya Yohana kuwa cha kibinadamu; ‘wanadamu’ ni jumuishi na hudumisha tofauti kati ya chanzo cha Mungu na cha binadamu.
- source_word: ἐφοβοῦντο
  choice: waliuogopa
  rationale: Kitenzi hiki kinaonyesha hofu yao ya hali hiyo; umbo la Kiswahili ni la kawaida na linaendana na yambwa ‘umati’.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Katika simulizi la Marko neno hili humaanisha kundi kubwa la watu waliokusanyika; ‘umati’ ni neno la sasa, fasaha na linaloeleweka.
- source_word: ἅπαντες
  choice: kila mtu
  rationale: Huonyesha maana ya wote kwa namna ya mgawanyo bila kuongeza nomino isiyokuwapo katika Kigiriki.
- source_word: γὰρ
  choice: kwa maana
  rationale: Hutambulisha sababu iliyowafanya wauogope umati.
- source_word: εἶχον
  choice: aliamini kwamba
  rationale: Katika muundo huu ἔχω hueleza kushikilia maoni au itikadi kuhusu mtu; ‘aliamini kwamba’ ni Kiswahili cha asili kinachohifadhi uzito wa usadikisho huo.
- source_word: ὄντως ὅτι
  choice: kweli
  rationale: Huhifadhi msisitizo kwamba watu walimwona Yohana kuwa nabii halisi, huku kauli hiyo ikiendelea kuwasilishwa kama imani yao.
- source_word: προφήτης
  choice: nabii
  rationale: Ni tafsiri ya kawaida ya hadhi ya kinabii ya Yohana; Kiswahili hakihitaji kibainishi kisicho dhahiri kama Kiingereza.
theological_decisions:
- issue: Maana ya ἀνθρώπων katika utofautishaji wa chanzo cha ubatizo au mamlaka ya Yohana
  choice: Ilitoka kwa wanadamu
  alternative: Ilikuwa ya asili ya kibinadamu
  rationale: Tafsiri kuu inadumisha taswira halisi ya kutoka kwa wanadamu na tofauti yake na kutoka kwa Mungu, bila kufafanua kupita kiasi.
- issue: Nguvu na upeo wa ὄντως ὅτι προφήτης ἦν
  choice: kila mtu aliamini kwamba Yohana alikuwa kweli nabii
  alternative: kila mtu alimwona Yohana kuwa nabii hakika
  rationale: Maneno haya yanadumisha msisitizo wa ὄντως huku yakifanya wazi kwamba simulizi linaripoti imani ya watu, wala halibadili kimya kimya kauli hiyo kuwa tamko jipya la msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanadamu’ huepuka maana finyu ya kijinsia; ‘umati’ linafaa kwa kundi lililokusanyika. Alama ya swali na mstari mrefu huhifadhi kuvunjika kwa mashauriano yao na kuingia kwa maelezo ya msimulizi.
