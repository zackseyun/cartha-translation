base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: sw
  text: Watu wengi wakatandaza mavazi yao njiani, na wengine wakatandaza matawi yenye majani[a] waliyokata mashambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majani yaliyokatwa.” Neno la Kigiriki lina maana pana ya mkusanyiko wa mimea iliyokatwa au matawi yenye majani; halimaanishi hasa matawi ya mitende.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi hiki kinaashiria idadi kubwa bila kuongeza msisitizo usiotajwa; kuongeza “watu” kunafanya sentensi iwe ya kawaida na wazi kwa Kiswahili.
- source_word: ἱμάτια
  choice: mavazi yao
  rationale: Ἱμάτια inaweza kumaanisha mavazi, hasa mavazi ya nje. “Mavazi yao” ni ya kawaida na salama kuliko “makoti,” ambalo lingeleta aina maalumu ya vazi isiyotajwa wazi.
- source_word: ἔστρωσαν
  choice: wakatandaza
  rationale: Kitenzi hiki huonyesha kutandika au kutawanya kitu juu ya sehemu fulani. “Wakatandaza” linafaa kwa mavazi na kwa mimea iliyowekwa njiani.
- source_word: εἰς τὴν ὁδόν
  choice: njiani
  rationale: Katika muundo huu maana ni kuweka vitu juu ya njia. “Njiani” ni usemi wa asili wa Kiswahili unaowasilisha mahali pa kitendo bila kufuata kihalisi kihusishi εἰς.
- source_word: ἄλλοι δὲ
  choice: na wengine
  rationale: δέ hapa inaongeza kundi jingine kwa utofautishaji hafifu; “na wengine” ni simulizi la kawaida lisilozidisha utofauti huo.
- source_word: στιβάδας
  choice: matawi yenye majani
  rationale: Neno hili linaweza kumaanisha mkusanyiko au tabaka la mimea iliyokatwa, majani, au matawi. “Matawi yenye majani” huwasilisha picha inayowezekana katika muktadha bila kuyaita matawi ya mitende.
- source_word: κόψαντες
  choice: waliyokata
  rationale: Kauli shirikishi ya wakati uliopita inaonyesha kuwa walikata mimea kabla ya kuitandaza; kishazi rejeshi ni cha asili katika Kiswahili.
- source_word: ἐκ τῶν ἀγρῶν
  choice: mashambani
  rationale: ἀγροί ni mashamba au maeneo ya wazi ya vijijini. “Mashambani” huonyesha kwa kawaida mahali walikokata mimea hiyo.
