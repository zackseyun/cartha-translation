base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: sw
  text: 'Kwa hiyo ninawaambia: Mambo yote mnayoomba katika sala, aminini kwamba mmeyapokea[a], nayo yatakuwa yenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina usomaji unaoweza kutafsiriwa, “aminini kwamba mnayapokea,” badala ya “aminini kwamba mmeyapokea.” Maandishi ya Kigiriki yaliyotumiwa hapa yanasema “mmeyapokea,” yakihifadhi maana ya tendo lililokamilika.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Huunganisha kauli hii na mafundisho yaliyotangulia kwa namna ya kawaida na ya wazi katika Kiswahili.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni usemi wa moja kwa moja unaohifadhi mamlaka na hali ya Yesu kuwahutubia wasikilizaji wake.
- source_word: πάντα ὅσα
  choice: Yoyote
  rationale: Katika muktadha huu, neno hili linarejelea kwa upana mambo yoyote yanayoombwa; urejeshi wa wingi unaonekana katika 'mmeyapokea' na 'yenu'.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: mnayoomba katika sala
  rationale: Kiswahili cha kawaida hakihitaji kurudia vitenzi viwili kwa namna inayoweza kusikika nzito; usemi huu unahifadhi kitendo cha kusali na cha kutoa ombi.
- source_word: πιστεύετε
  choice: aminini
  rationale: Hutoa amri ya kuamini na huingia kwa kawaida katika kishazi kinachoanza na 'kwamba'.
- source_word: ὅτι ἐλάβετε
  choice: kwamba mmeyapokea
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu wa sasa na kuhifadhi nguvu ya aoristi ya Kigiriki.
- source_word: καὶ ἔσται ὑμῖν
  choice: nayo yatakuwa yenu
  rationale: Huhifadhi wakati ujao na urejeshi wa wingi kwa mambo yaliyoombwa.
theological_decisions:
- issue: Nguvu ya wakati katika kupokea jibu la sala kwa imani
  choice: aminini kwamba mmeyapokea, nayo yatakuwa yenu
  alternative: aminini kwamba mnayapokea, nayo yatakuwa yenu
  rationale: 'SBLGNT ina ἐλάβετε, aoristi, hivyo tafsiri inadumisha mfuatano wenye mvutano: kuamini kuwa tayari mmepokea, kisha mambo hayo yatakuwa yenu. Haitatulii mvutano huo kwa kuingiza mfumo fulani wa kimafundisho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mnayoomba katika sala' ni ya kawaida zaidi kuliko kuratibu 'mnayosali na kuyaomba,' huku ikihifadhi dhana zote mbili. Viambishi vya ngeli ya YA yametumiwa kurejelea mambo mengi yanayoombwa.
