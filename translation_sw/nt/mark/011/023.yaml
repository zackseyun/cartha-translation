  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: sw
  text: Kweli nawaambia[a], yeyote atakayeuambia mlima huu, ‘Inuliwa, ukatupwe baharini,’ asiwe na shaka moyoni mwake, bali aamini kwamba anachosema kinatendeka[b], litakuwa hivyo kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amina, nawaambia.” Neno la Kigiriki ni kauli nzito ya kuthibitisha ukweli wa maneno yanayofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwamba anachosema hutendeka” au “kinatimia.” Kigiriki kinatumia wakati wa sasa kabla ya kishazi cha matokeo ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Kauli ya utangulizi yenye uzito imetafsiriwa kwa Kiswahili cha kawaida na cha heshima, huku ikihifadhi msisitizo wa Yesu.
- source_word: ὃς ἂν εἴπῃ
  choice: yeyote atakayeuambia
  rationale: Muundo huu unaonyesha hali ya jumla isiyomhusu mtu mmoja maalumu; ‘yeyote atakaye-’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τῷ ὄρει τούτῳ
  choice: mlima huu
  rationale: ‘Mlima’ ni maana ya kawaida ya ὄρος, na kiashiria ‘huu’ kinahifadhi picha halisi na ya moja kwa moja.
- source_word: Ἄρθητι
  choice: Ng’oka
  rationale: Katika muktadha wa mlima kuondolewa mahali pake na kutupwa baharini, ‘ng’oka’ ni amri ya Kiswahili iliyo wazi na yenye picha hai, bila kuifanya kuwa maelezo marefu.
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: ukatupwe baharini
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na mwelekeo wa kuingia baharini kwa lugha ya asili ya Kiswahili.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: wala asitie shaka moyoni mwake
  rationale: ‘Asitie shaka’ hutoa maana kuu ya muktadha, huku ‘moyoni mwake’ ikihifadhi taswira ya Kigiriki ya moyo kama kitovu cha ndani.
- source_word: πιστεύῃ
  choice: aamini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya πιστεύω katika muktadha huu.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: kwamba anachosema kinatendeka
  rationale: ‘Kinatendeka’ huhifadhi wakati wa sasa wa γίνεται na uwazi fulani wa jambo linalotokea, badala ya kulibadili moja kwa moja kuwa wakati ujao.
- source_word: ἔσται αὐτῷ
  choice: atatendewa hivyo
  rationale: Hutoa matokeo ya baadaye kwa mhusika bila kufafanua kupita kiasi namna yatakavyotokea.
theological_decisions:
- issue: Asili ya kauli ya Yesu kuhusu imani na tamko
  choice: Kauli imetafsiriwa moja kwa moja kama sharti lenye ahadi, bila kuongezwa vikwazo vya kimafundisho visivyotajwa katika mstari.
  alternative: Kuifanya kuwa tamathali tu, au kuifafanua kuwa ahadi isiyo na mipaka ya kupata kila kitu.
  rationale: Mstari wenyewe una picha kali ya mlima na unasisitiza kuamini bila shaka; tafsiri inahifadhi nguvu na mvutano huo bila kuutatua kwa mfumo wa baadaye wa kiteolojia.
- issue: Umoja wa kiume katika αὐτοῦ / αὐτῷ
  choice: moyoni mwake; atatendewa
  alternative: Kutumia muundo wa wingi usioainisha jinsia.
  rationale: Kiswahili hakilazimishi kiwakilishi cha jinsia hapa; miundo ya umoja inahifadhi rejeo la mtu mmoja la Kigiriki bila kuingiza jinsia isiyoonyeshwa kimaumbo katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata kwa karibu hoja ya Kigiriki lakini huepuka ukakasi; alama zote za tanbihi zimewekwa katika matini kuu.
