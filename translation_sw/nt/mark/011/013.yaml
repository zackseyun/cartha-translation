id: MRK.11.13
reference: Mark 11:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: sw
  text: Naye alipoona kwa mbali mtini wenye majani, akaenda kuona kama labda angepata kitu juu yake. Lakini alipoufikia, hakupata kitu chochote isipokuwa majani, kwa maana haukuwa msimu wa tini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haukuwa wakati wa tini.”
    reason: Tofauti halali ya kileksika kwa καιρός, ambayo inaweza kumaanisha “msimu” au “wakati unaofaa.”
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoona
  rationale: Muundo wa wakati unaonyesha mazingira ya tendo linalofuata kwa Kiswahili cha kawaida bila kusisitiza kupita kiasi mpangilio wa matukio.
- source_word: συκῆν
  choice: mtini
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mti unaozaa tini.
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Usemi wa asili unaohifadhi maana ya umbali.
- source_word: ἔχουσαν φύλλα
  choice: wenye majani
  rationale: Huhifadhi maelezo ya moja kwa moja kwamba mtini ulikuwa na majani, bila kuingiza hitimisho kuhusu hali yake ya kuzaa.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: akaenda kuona kama labda angepata kitu juu yake
  rationale: “Kama labda” huhifadhi hali ya kutokuwa na hakika katika εἰ ἄρα, huku “juu yake” ikiwa usemi wa kawaida kwa matunda yaliyoko mtini.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: alipoufikia
  rationale: Ni Kiswahili fasaha kinachoonyesha kuufikia mtini bila marudio mazito ya kitenzi “kwenda.”
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: hakupata kitu chochote isipokuwa majani
  rationale: 'Hutoa kwa uwazi utofautishaji wa εἰ μὴ: hapakuwa na kitu kingine ila majani.'
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: kwa maana haukuwa msimu wa tini
  rationale: καιρός katika muktadha huu ni wakati au msimu unaofaa; “msimu wa tini” ni wa kawaida na huhifadhi kauli ya msimulizi bila kuifafanua zaidi.
theological_decisions:
- issue: Nguvu ya kifungu kinachoeleza kuhusu msimu wa tini
  choice: 'Kukitafsiri moja kwa moja kama maelezo ya msimulizi: “kwa maana haukuwa msimu wa tini.”'
  alternative: “Kwa maana haukuwa wakati wa tini.”
  rationale: Kauli hii inaleta mvutano kwa kuwa Yesu anatafuta kitu mtini ingawa si msimu wa tini. Tafsiri haiongezi maelezo ya kilimo wala kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “Naye” kinaendeleza simulizi; “kama labda” kinahifadhi uwezekano usio na uhakika. Alama ya tanbihi [a] imewekwa baada ya kifungu inachohusu.
