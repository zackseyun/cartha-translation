base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: sw
  text: Petro, akikumbuka, anamwambia, “Rabi, tazama! Ule mtini ulioulaani umekauka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umenyauka.” Kitenzi cha Kigiriki kinaweza kumaanisha kukauka au kunyauka; wakati timilifu unasisitiza hali iliyopo sasa kutokana na tendo lililokamilika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: akikumbuka
  rationale: Inaonyesha Petro kukumbuka jambo lililotangulia na kuhifadhi uhusiano wa kishirikishi na kauli inayofuata kwa Kiswahili cha kawaida.
- source_word: λέγει αὐτῷ
  choice: anamwambia
  rationale: Wakati uliopo wa kihistoria wa Marko umehifadhiwa kwa “anamwambia,” huku kiwakilishi cha Kigiriki kikibaki bila kutaja jina la Yesu ambalo halipo katika kirai hiki.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Inahifadhi cheo cha Kiyahudi kilichotoholewa katika maandishi ya Kigiriki badala ya kukifasiri moja kwa moja kuwa “Mwalimu.”
- source_word: ἴδε
  choice: tazama
  rationale: Ni amri ya kawaida na yenye hadhi inayovuta fikira kwa jambo linaloonekana.
- source_word: συκῆ
  choice: mtini
  rationale: Nomino hii katika muktadha inamaanisha mti wa tini; “mtini” ndiyo istilahi ya kawaida ya Kiswahili.
- source_word: κατηράσω
  choice: ulioulaani
  rationale: Inawasilisha moja kwa moja tendo la Yesu la awali na kukubaliana kisarufi na “mtini.”
- source_word: ἐξήρανται
  choice: umekauka
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoonekana sasa; “umekauka” ni usemi wa kawaida kwa mti na unaweza pia kubeba maana ya kunyauka.
