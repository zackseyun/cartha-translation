translation:
  language: sw
  text: Wala hakumruhusu mtu yeyote kubeba kitu kupitia viwanja vya hekalu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia eneo la hekalu.” Neno la Kigiriki hurejelea eneo lote la hekalu, si patakatifu pa ndani hasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kubeba chombo” au “kubeba kifaa.” Neno la Kigiriki ni pana na halibainishi aina ya kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: hakumruhusu
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha kwamba Yesu aliendelea kuzuia jambo hilo; katika Kiswahili, muktadha pamoja na kitenzi hiki huwasilisha hali hiyo kwa kawaida.
- source_word: ἵνα τις διενέγκῃ
  choice: mtu yeyote kubeba
  rationale: Baada ya ἤφιεν, ἵνα pamoja na kitenzi tegemezi hueleza jambo ambalo hakuliruhusu litendeke. Muundo wa Kiswahili 'hakumruhusu mtu yeyote kubeba' ni wa kawaida na mwaminifu kwa maana hiyo.
- source_word: διενέγκῃ
  choice: kubeba ... kupitia
  rationale: Katika muktadha huu, kitenzi kina maana ya kupeleka kitu kutoka upande mmoja hadi mwingine; 'kubeba ... kupitia' huhifadhi maana ya kusafirisha ndani na kuvuka eneo.
- source_word: σκεῦος
  choice: kitu
  rationale: Neno hili la Kigiriki ni pana na linaweza kumaanisha chombo, kifaa, au kitu kingine kinachobebeka. 'Kitu' huepuka kubainisha aina ambayo matini haitaji.
- source_word: διὰ τοῦ ἱεροῦ
  choice: kupitia viwanja vya hekalu
  rationale: ἱερόν hurejelea eneo lote la hekalu, si patakatifu pa ndani hasa. 'Viwanja vya hekalu' huonyesha kwa lugha ya kawaida sehemu pana za jengo na nyua zake.
theological_decisions:
- issue: Maana ya ἱερόν kuhusiana na hekalu la Yerusalemu
  choice: eneo pana la hekalu, limetafsiriwa 'viwanja vya hekalu'
  alternative: hekalu; eneo la hekalu
  rationale: Tofauti hii huhifadhi kwamba tendo la Yesu lilihusu kupitisha vitu katika eneo pana la hekalu, bila kudokeza kwamba watu hao waliingia patakatifu pa ndani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wala' huunganisha mstari huu kwa kawaida na simulizi lililotangulia. 'Kitu' ni wazi kwa wasomaji wa kawaida na huhifadhi upana wa σκεῦος; mbadala zilizo mahususi zaidi zimewekwa katika tanbihi.
