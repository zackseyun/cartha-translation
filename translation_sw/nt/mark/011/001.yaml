  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: sw
  text: Walipokuwa wakikaribia Yerusalemu[a], kwenye Bethfage na Bethania, karibu na Mlima wa Mizeituni, akawatuma[b] wawili kati ya wanafunzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokaribia Yerusalemu, kuelekea Bethfage na Bethania, upande wa Mlima wa Mizeituni.” Vihusishi vya Kigiriki vinaweza kueleweka kama vya mahali au vya mwelekeo.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema kwa wakati wa sasa, “anawatuma.” Mara nyingi Marko hutumia wakati wa sasa kusimulia tukio lililopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: walipokuwa wakikaribia
  rationale: Huwasilisha mwendo wa kuwakaribia Yerusalemu kwa Kiswahili cha kawaida. Ingawa Kigiriki kina wakati wa sasa wa kihistoria, wakati uliopita unaendana vizuri na mtiririko wa simulizi la Kiswahili.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Pamoja na kitenzi cha kukaribia, Kiswahili hakihitaji kihusishi cha mwelekeo; ‘kuikaribia Yerusalemu’ ni tungo ya asili.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: kwenye Bethfage na Bethania
  rationale: Hueleza eneo walilokuwa wamefikia walipokuwa njiani kwenda Yerusalemu bila kulazimisha marudio yasiyo ya kawaida ya kihusishi cha mwelekeo.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: karibu na Mlima wa Mizeituni
  rationale: πρός hapa inaweza kueleza ukaribu au mwelekeo; ‘karibu na’ hutoa maana ya mahali kwa Kiswahili laini bila kudai kwamba walikuwa wakielekea mlimani.
- source_word: ἀποστέλλει
  choice: akawatuma
  rationale: Ni wakati uliopita wa kisimulizi unaosikika kwa kawaida katika Kiswahili. Kigiriki kimetumia wakati wa sasa wa kihistoria, jambo linaloelezwa katika tanbihi.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: wawili kati ya wanafunzi wake
  rationale: 'Huhifadhi wazi muundo wa sehemu ya kundi: wale wawili walikuwa miongoni mwa wanafunzi wake.'
- source_word: Βηθφαγὴ
  choice: Bethfage
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: Βηθανίαν
  choice: Bethania
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Mlima wa Mizeituni
  rationale: Hili ndilo jina la mahali lililo wazi na lililozoeleka katika Kiswahili, huku likihifadhi maana ya muundo wa Kigiriki.
