  text: And whenever evening came, they would go out of the city.
translation:
  language: sw
  text: Kila ilipofika jioni, walitoka nje ya mji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: kila ilipofika
  rationale: Pamoja na kitenzi cha hali isiyotimilika, neno hili linaonyesha tendo lililorudiwa au lililokuwa desturi; muundo huu unaonyesha maana ya ‘kila wakati ilipofika’ kwa Kiswahili cha kawaida.
- source_word: ὀψὲ ἐγένετο
  choice: ilipofika jioni
  rationale: Nahau ya Kigiriki ina maana ya kuwa jioni au kuchelewa; ‘ilipofika jioni’ ni ya asili katika Kiswahili na huhifadhi wazo la wakati kufika.
- source_word: ἐξεπορεύοντο
  choice: walitoka
  rationale: Kitenzi cha hali isiyotimilika kinaeleweka hapa kama tendo lililokuwa likirudiwa. Kurudiwa huko kumekwishaonyeshwa na ‘kila,’ hivyo ‘walitoka’ ni wazi na ya asili bila kuongeza maneno yasiyohitajika.
- source_word: ἔξω τῆς πόλεως
  choice: nje ya mji
  rationale: Usemi huu huhifadhi mwendo wa kutoka na maana ya kufika upande wa nje wa mji.
- source_word: πόλεως
  choice: mji
  rationale: Chanzo kinasema ‘mji’ bila kutaja Yerusalemu; tafsiri haiongezi jina ambalo halipo wazi katika mstari.
theological_decisions: []
