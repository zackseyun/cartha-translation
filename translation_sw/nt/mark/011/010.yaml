review_pass:
  verdict: revise
  source_fidelity: “Ubarikiwe” is a second-person singular imperative/subjunctive form and does not agree with the third-person noun “ufalme.” The Greek is an acclamation with a feminine singular predicate adjective modifying “kingdom”; in Swahili, “Umebarikiwa ufalme unaokuja...” gives the kingdom the appropriate class agreement and preserves the acclamatory sense. “Huko juu” is understandable but underspecifies ἐν τοῖς ὑψίστοις, which idiomatically evokes the highest heavenly realm; “juu mbinguni” is more natural and contextually faithful without over-translating.
  naturalness: The revised wording is idiomatic Standard East African Swahili and has an appropriately elevated liturgical register. “Hosana juu mbinguni” is a familiar and natural biblical acclamation.
  terminology: “Ufalme,” “baba yetu Daudi,” and “Hosana” appropriately preserve the Davidic and liturgical terminology. The footnote retains the lexical background of Hosana while avoiding the unnecessary specification that the praise is explicitly directed to God.
  issues:
  - severity: high
    issue: Class/person disagreement in “Ubarikiwe ufalme”
    rationale: “Ubarikiwe” addresses a singular second-person addressee (“may you be blessed”), whereas “ufalme” requires a class-3 form. This changes the grammatical relation of the Greek predicate and is ungrammatical in the intended sense.
  - severity: medium
    issue: “huko juu” is too indefinite for ἐν τοῖς ὑψίστοις
    rationale: Although literally possible as “up there,” it does not naturally convey the established heavenly superlative idiom. “Juu mbinguni” conveys the idiomatic sense without asserting more than the text.
  - severity: low
    issue: Footnote says the shout praises God explicitly
    rationale: The immediate Greek phrase does not explicitly name God as the object of praise. A neutral description as a liturgical shout of praise better preserves the wording.
  revised_text: Umebarikiwa ufalme unaokuja wa baba yetu Daudi! Hosana juu mbinguni[a]!
  revised_footnotes:
  - marker: a
    text: Au “Hosana” linaweza kumaanisha “Tuokoe, tafadhali” au “Okoa sasa,” ingawa hapa linatumika kama mwito wa kiliturujia wa sifa.
    reason: lexical_alternative
