base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: sw
  text: Umebarikiwa ufalme unaokuja wa baba yetu Daudi! Hosana juu mbinguni[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hosana” linaweza kumaanisha “Tuokoe, tafadhali” au “Okoa sasa,” ingawa hapa linatumika kama mwito wa kiliturujia wa sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Ubarikiwe
  rationale: Katika mwito huu wa kishangilio, umbo hili la kutakia linaeleza kwamba ufalme unaokuja utambuliwe kuwa wenye baraka; ni la asili zaidi kwa Kiswahili kuliko tafsiri kavu ya kivumishi.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: ufalme unaokuja
  rationale: Huhifadhi nguvu ya wakati wa sasa ya kitenzi kishirikishi na kueleza kwa Kiswahili cha kawaida ufalme unaokaribia.
- source_word: βασιλεία
  choice: ufalme
  rationale: Neno hili linafaa katika muktadha wa kifalme wa Daudi na linaweza kumaanisha mamlaka ya kutawala pamoja na eneo au utaratibu wa kifalme bila kulazimisha maana moja tu.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: wa baba yetu Daudi
  rationale: Huhifadhi uhusiano wa kisarufi na ufalme na maana ya Daudi kuwa babu au baba wa taifa anayeheshimiwa.
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: Hili ni umbo lililozoeleka katika Kiswahili kama mwito wa ibada; maana yake ya awali ya ombi la kuokolewa inaelezwa katika tanbihi.
- source_word: ἐν τοῖς ὑψίστοις
  choice: huko juu
  rationale: Ni usemi mfupi na wa kawaida unaodokeza mahali pa juu kabisa, yaani ulimwengu wa mbinguni, bila kuongeza neno lisilokuwamo wazi katika Kigiriki.
theological_decisions:
- issue: Asili ya mwito kuhusu ufalme wa Daudi
  choice: Kutaja moja kwa moja “ufalme unaokuja wa baba yetu Daudi” bila kuongeza “wa Kimasihi.”
  alternative: Ubarikiwe ufalme wa Kimasihi unaokuja wa baba yetu Daudi.
  rationale: Muktadha unaashiria matarajio ya Masiya, lakini Kigiriki hakitumii wazi neno “Masiya”; tafsiri ya moja kwa moja huhifadhi dokezo na mvutano huo wa kitheolojia.
- issue: Maana ya Hosana katika muktadha huu
  choice: Kuhifadhi “Hosana” kama mwito wa ibada na kueleza asili yake katika tanbihi.
  alternative: Tuokoe, tafadhali! / Okoa sasa!
  rationale: Katika matumizi ya Agano Jipya, neno hilo linafanya kazi kama mwito wa kiliturujia wa sifa, ingawa limetokana na ombi la wokovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baba yetu Daudi” limehifadhiwa kama jina la heshima la babu wa taifa. “Huko juu” ni la kueleweka kwa wasomaji wa kawaida huku likihifadhi ufupi wa usemi wa Kigiriki.
