translation:
  language: sw
  text: Yesu akawajibu[a], “Mwe na imani kwa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “Mwe na imani ya Mungu,” jambo linaloweza pia kueleweka kuwa “Mwe na uaminifu wa Mungu” au “Mwe na imani itokayo kwa Mungu.”
    reason: Usomaji mbadala unaohifadhi utata wa kirai cha Kigiriki πίστιν θεοῦ.
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akawajibu
  rationale: Kitenzi hiki huanzisha jibu katika mazungumzo. Muundo wa Kiswahili wenye kitenzi kamili ni wa kawaida zaidi kuliko kutafsiri kirai tegemezi kwa namna ya moja kwa moja.
- source_word: λέγει
  choice: akawajibu
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umeunganishwa na ἀποκριθεὶς katika kitenzi kimoja cha masimulizi cha Kiswahili. Hivyo maana ya usemi wa kujibu imehifadhiwa bila marudio yasiyo ya kawaida kama ‘akijibu, anawaambia.’
- source_word: Ἔχετε
  choice: Muwe na
  rationale: Amri hii inawataka wanafunzi wawe na hali endelevu ya imani. ‘Muwe na’ ni Kiswahili cha kawaida na huhifadhi muundo wa kuwa na kitu bila kuongeza ufafanuzi wa kipengele cha wakati.
- source_word: πίστιν
  choice: imani
  rationale: ‘Imani’ ndilo neno la kawaida na lenye heshima kwa πίστις hapa. Katika muktadha huu linaelekea kumaanisha kumtegemea Mungu, huku uwezekano wa maana ya ‘uaminifu’ ukihifadhiwa katika tanbihi.
- source_word: θεοῦ
  choice: kwa Mungu
  rationale: Kirai cha Kigiriki πίστιν θεοῦ kina utata wa kisarufi. Muktadha wa mafundisho kuhusu kuamini na kuomba unaunga mkono maana ya imani inayoelekezwa kwa Mungu; tafsiri mbadala hazijafichwa bali zimeonyeshwa katika tanbihi.
theological_decisions:
- issue: Utata wa umilikishi katika πίστιν θεοῦ
  choice: ‘imani kwa Mungu’—Mungu ndiye anayeelekezewa imani
  alternative: ‘imani ya Mungu,’ ‘uaminifu wa Mungu,’ au ‘imani itokayo kwa Mungu’
  rationale: Muktadha wa Marko 11:23–24 unaendelea kwa mafundisho kuhusu kuamini na kuomba, hivyo himizo la kuwa na imani inayoelekezwa kwa Mungu linafaa zaidi. Hata hivyo, muundo wa Kigiriki wenyewe hauondoi kabisa maana nyingine, kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawajibu’ linafaa mtiririko wa masimulizi; ‘Muwe na imani kwa Mungu’ ni wazi kwa wasomaji wa kawaida huku tanbihi ikihifadhi utata halisi wa Kigiriki.
