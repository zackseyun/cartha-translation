  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: sw
  text: Na siku iliyofuata, walipotoka Bethania, alihisi njaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Na
  rationale: Inaendeleza simulizi na kuhifadhi mtindo wa Marko wa kuunganisha matukio kwa viunganishi.
- source_word: τῇ ἐπαύριον
  choice: siku iliyofuata
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku inayofuata katika mfululizo wa simulizi.
- source_word: ἐξελθόντων αὐτῶν
  choice: walipotoka
  rationale: Muundo huu unaonyesha tendo la kundi lililotangulia au kuambatana kwa karibu na tendo kuu; 'walipotoka' huhifadhi wingi na uhusiano wa wakati kwa lugha ya asili.
- source_word: ἀπὸ Βηθανίας
  choice: Bethania
  rationale: Katika Kiswahili, kitenzi 'kutoka' tayari hubeba maana ya kuondoka mahali, hivyo jina la mahali linafuata moja kwa moja.
- source_word: ἐπείνασεν
  choice: alihisi njaa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuingia katika hali ya kuwa na njaa, bila kutumia usemi mzito au usio wa kawaida.
theological_decisions:
- issue: Mtendaji asiyeelezwa wazi wa ἐπείνασεν
  choice: Kiwakilishi cha nafsi ya tatu katika 'alihisi' kinamrejelea Yesu bila kuongeza jina lake.
  alternative: Kusema wazi 'Yesu alihisi njaa.'
  rationale: Kigiriki hakitaji jina katika kifungu hiki, ingawa muktadha humtambulisha wazi Yesu. Kutoongeza jina kunahifadhi ufupi na mpangilio wa chanzo, huku kauli ikiwasilisha njaa yake halisi bila maelezo ya ziada ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Hakuna tanbihi zinazohitajika.
