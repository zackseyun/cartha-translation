  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: sw
  text: Je, ubatizo wa Yohana ulitoka mbinguni[a] au kwa wanadamu[b]? Nijibuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Mungu.” Kiyunani kinasema “kutoka mbinguni,” usemi wa Kiyahudi unaodokeza asili au mamlaka ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Kwa wanadamu” maana yake ni kutoka kwa wanadamu, yaani, kuwa na asili au mamlaka ya kibinadamu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: ubatizo wa Yohana
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha ubatizo uliohusishwa na Yohana bila kuwa mzito au kueleza zaidi ya Kiyunani.
- source_word: ἐξ οὐρανοῦ
  choice: ulitoka mbinguni
  rationale: Inahifadhi usemi wa Kiyahudi “kutoka mbinguni,” unaodokeza asili au mamlaka ya Mungu, bila kuufafanua moja kwa moja katika matini kuu.
- source_word: ἐξ ἀνθρώπων
  choice: kwa wanadamu
  rationale: “Wanadamu” ni neno jumuishi na la kawaida kwa ἀνθρώπων; “kwa” hapa huonyesha chanzo au mamlaka ya kibinadamu na kudumisha utofautishaji na “mbinguni.”
- source_word: ἀποκρίθητέ μοι
  choice: Nijibuni
  rationale: Amri ya wingi inawataka wasikilizaji wampe Yesu jibu moja kwa moja; “Nijibuni” ni ya asili, fupi, na yenye msisitizo unaofaa.
- source_word: ἦν ἢ
  choice: Je, ... ulitoka ... au ...?
  rationale: Ingawa Kiyunani hutumia kitenzi “kuwa,” Kiswahili hueleza asili kwa kawaida zaidi kwa “kutoka”; muundo huu huhifadhi swali la chaguo mbili kwa uwazi.
theological_decisions:
- issue: Maana ya “kutoka mbinguni” katika swali la Yesu
  choice: Kudumisha “mbinguni” katika matini kuu kama usemi unaodokeza asili au mamlaka ya Mungu.
  alternative: kutoka kwa Mungu
  rationale: Hii inahifadhi nahau ya chanzo na mvutano wa swali la Yesu, badala ya kuweka ufafanuzi wake moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Je” huanzisha swali kwa uwazi; “Nijibuni” huhifadhi amri ya moja kwa moja iliyo katika nafsi ya pili wingi. Alama zote za tanbihi zimewekwa katika matini kuu.
