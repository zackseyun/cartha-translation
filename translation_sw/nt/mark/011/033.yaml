  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: sw
  text: Wakamjibu Yesu, “Hatujui.” Yesu akawaambia, “Wala mimi siwaambii ninafanya mambo haya kwa mamlaka gani[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninafanya mambo haya nikiwa na mamlaka gani.”
    reason: Njia nyingine ya kueleza ἐν ποίᾳ ἐξουσίᾳ, ikisisitiza mamlaka aliyo nayo mtendaji badala ya msingi wa kutenda.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: wakamjibu
  rationale: Kitenzi hiki kinaonyesha kwamba maneno yao ni jibu kwa swali la Yesu; muundo wa masimulizi wa Kiswahili unasomeka kwa kawaida huku ukidumisha uhusiano huo.
- source_word: λέγουσιν / λέγει / λέγω
  choice: wakisema / akawaambia / siwaambii
  rationale: Maumbo haya yanawakilisha kwa njia ya kawaida vitangulizi vya usemi na maana ya kumwambia mtu jambo. Wakati wa masimulizi umetumiwa kwa ufasaha wa Kiswahili badala ya kuiga moja kwa moja wakati uliopo wa kihistoria wa Kigiriki.
- source_word: Οὐκ οἴδαμεν
  choice: Hatujui
  rationale: Hili ni jibu la moja kwa moja na la kawaida linalodumisha maana ya hali ya sasa ya kitenzi cha Kigiriki.
- source_word: Οὐδὲ ἐγὼ
  choice: Wala mimi
  rationale: “Wala” inadumisha ulinganifu wa jibu hasi la Yesu na jibu lao bila kuongeza sababu ambayo haikutajwa.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kwa mamlaka gani
  rationale: “Kwa” linaonyesha msingi au uhalali wa kutenda, na “mamlaka gani” ni usemi wa kawaida wa Kiswahili unaodumisha swali la Kigiriki.
- source_word: ταῦτα ποιῶ
  choice: ninafanya mambo haya
  rationale: “Mambo haya” linadumisha wingi wa ταῦτα na kurejelea matendo ya Yesu yaliyokuwa yakijadiliwa; “ninafanya” linawakilisha tendo la sasa.
