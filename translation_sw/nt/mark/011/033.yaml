translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetafsiriwa kwa namna ya kawaida ya Kiswahili, huku marudio ya jibu na usemi yakihifadhiwa. Alama ya tanbihi imewekwa kwenye kirai cha mamlaka, ambacho ndicho kinachohusika na mbadala huo.
