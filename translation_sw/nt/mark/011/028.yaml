  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: sw
  text: Walikuwa wakimwambia, “Unafanya mambo haya kwa mamlaka gani?[a] Au ni nani aliyekupa mamlaka hii kufanya mambo haya?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya karibu zaidi na muundo wa Kigiriki: “Katika mamlaka gani unafanya mambo haya?”'
    reason: lexical_alternative
  - marker: b
    text: Au, “ili ufanye mambo haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: Walikuwa wakimwambia
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea; umoja wa kiwakilishi unamrejelea Yesu.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: kwa mamlaka gani
  rationale: Hii ndiyo njia ya kawaida na ya wazi katika Kiswahili ya kuuliza msingi au uhalali wa mamlaka ya mtu, huku ikihifadhi maana ya ἐν pamoja na hali ya kutoa ruhusa.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: mamlaka
  rationale: Katika mazingira ya hekalu, neno hili linaonyesha haki au uwezo halali wa kutenda, si nguvu tu.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: unafanya mambo haya / kufanya mambo haya
  rationale: Wingi wa ταῦτα umehifadhiwa kwa ‘mambo haya,’ unaorejelea kwa upana matendo na mafundisho ya Yesu ya karibuni.
- source_word: ἢ
  choice: Au
  rationale: Linaanzisha swali la pili linalouliza hoja ileile kwa namna nyingine.
- source_word: τίς σοι ἔδωκεν
  choice: ni nani aliyekupa
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida tendo lililotokea la kumpa mtu mamlaka.
- source_word: ἵνα ταῦτα ποιῇς
  choice: kufanya mambo haya
  rationale: Baada ya ‘aliyekupa mamlaka,’ kitenzi-jina kinaeleza kusudi kwa Kiswahili cha kawaida bila kupoteza maana.
theological_decisions:
- issue: Chanzo cha mamlaka ya Yesu kinachodaiwa
  choice: Swali limetafsiriwa bila kutaja chanzo cha mamlaka hiyo.
  alternative: Kutafsiri kwa namna inayoeleza wazi kuwa wanauliza kuhusu mamlaka kutoka kwa Mungu.
  rationale: Aya hii inaandika changamoto ya viongozi, wala haitoi jibu la msimulizi; hivyo tafsiri haipaswi kutatua mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa ‘mamlaka’ na ‘mambo haya’ umehifadhiwa kwa sababu unasisitiza changamoto iliyomo katika maandishi ya Kigiriki.
