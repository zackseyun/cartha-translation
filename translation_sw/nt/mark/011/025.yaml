base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: sw
  text: Kila mnaposimama mkisali, sameheni ikiwa mna jambo lolote dhidi ya mtu yeyote, ili Baba yenu aliye mbinguni[a] pia awasamehe makosa yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kigiriki kwa karibu zaidi: “aliye katika mbingu” (wingi).'
    reason: lexical_alternative
  - marker: b
    text: Au, “makwazo” au “makosa ya kuvunja sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: mnaposimama mkisali
  rationale: Huhifadhi tendo halisi la kusimama na wakati mmoja wa kitenzi-shirikishi ‘mkisali,’ huku Kiswahili kikiwa cha kawaida na wazi.
- source_word: ἀφίετε
  choice: sameheni
  rationale: Katika muktadha wa kosa kati ya watu, maana inayofaa ni kuondolea mtu kosa, yaani kusamehe.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: ikiwa mna jambo lolote dhidi ya mtu yeyote
  rationale: Huhifadhi upana wa viwakilishi visivyo maalumu τι na τινος na wazo la kuwa na dai au kinyongo dhidi ya mtu.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Baba yenu aliye mbinguni
  rationale: ‘Mbinguni’ ni usemi wa kawaida na wenye heshima katika Kiswahili; tanbihi inaonyesha kwamba Kigiriki kimetumia umbo la wingi.
- source_word: ἀφῇ
  choice: pia awasamehe
  rationale: ‘Awasamehe’ huakisi hali tegemezi baada ya ἵνα, na ‘pia’ huhifadhi καί inayounganisha kusamehe kwao na kusamehe kwa Baba.
- source_word: παραπτώματα
  choice: makosa
  rationale: ‘Makosa’ ni neno la sasa na linaloeleweka kwa παράπτωμα, likidumisha wazo la kukiuka au kumkosea mwingine bila kulisawazisha moja kwa moja na neno la jumla ‘dhambi.’
theological_decisions:
- issue: Uhusiano kati ya kuwasamehe wengine na kusamehewa na Baba
  choice: ili ... pia awasamehe
  alternative: tafsiri inayofanya kusamehe wengine kuwa ishara tu ya kwamba tayari wamesamehewa
  rationale: ἵνα pamoja na ἀφῇ huweka uhusiano halisi wa kusudi au matokeo. Tafsiri hailegezi wala kueleza mbali mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘mnaposimama mkisali’ unadumisha picha ya mkao wa kusali bila kuwa mgumu; ‘mbinguni’ na ‘makosa’ ni maneno yanayoeleweka kwa wasomaji wa kawaida.
