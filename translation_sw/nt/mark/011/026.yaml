  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: sw
  text: Lakini[a] ninyi msiposamehe, wala Baba yenu aliye mbinguni hatawasamehe makosa yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupatikani katika hati za kale zaidi za Kigiriki, zikiwemo Sinaiticus na Vaticanus za karne ya nne, wala katika tafsiri za kale za Kikoptiki; hata hivyo, unapatikana katika mapokeo ya wengi ya Kibizanti, mapokeo ya Kilatini, na ushahidi mwingi wa Kisiria. Huenda uliongezwa na wanakili wa baadaye ili kuoanisha kifungu hiki na maneno ya Yesu katika Mathayo 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: kusamehe
  rationale: Katika muktadha wa makosa baina ya watu na msamaha wa Mungu, “kusamehe” ni neno la kawaida na sahihi kwa kuondoa hatia au deni la kimaadili.
- source_word: παράπτωμα
  choice: makosa
  rationale: “Makosa” linaeleweka kwa urahisi na linaweza kuonyesha hatua potovu au ukiukaji, bila kulifanya neno hili kuwa sawa kabisa na neno la jumla zaidi la dhambi.
- source_word: οὐδέ
  choice: naye hata-
  rationale: Muundo “naye hatawasamehe” unaonyesha uhusiano wa ‘wala ... pia’ kwa Kiswahili cha kawaida na huhifadhi mkazo kwamba Baba pia hatasamehe.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: aliye mbinguni
  rationale: Huhifadhi kishazi cha uhusiano cha Kigiriki kwa Kiswahili cha asili na chenye heshima.
theological_decisions:
- issue: Uhusiano kati ya kuwasamehe wengine na msamaha wa Baba
  choice: Kuhifadhi kauli ya masharti moja kwa moja bila maelezo ya ziada
  alternative: Kuifafanua kama ushahidi wa msamaha uliopokelewa au kama sharti la kuupata
  rationale: Kigiriki kinaweka uhusiano huo kwa nguvu lakini hakielezi hapa mfumo wake wa kitheolojia; tafsiri haipaswi kutatua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi” imetumiwa kuonyesha wazi wingi wa ὑμεῖς; “Baba yenu aliye mbinguni” ni muundo wa kawaida unaohifadhi maana ya chanzo.
