  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: sw
  text: Lakini wale wakulima wapangaji wakasema wao kwa wao[a], “Huyu ndiye mrithi. Njooni, tumuue, na urithi utakuwa wetu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakasema miongoni mwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “urithi utakuwa mali yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Lakini wale
  rationale: Neno δέ linaonyesha utofauti wa kiasi katika mwendelezo wa simulizi, huku ἐκεῖνοι likihifadhiwa kwa kiwakilishi cha kuonyesha ‘wale.’
- source_word: γεωργοὶ
  choice: wakulima wapangaji
  rationale: Katika mfano wa shamba la mizabibu, hawa ni wakulima wanaolitumia shamba la mwenyewe kwa makubaliano, si wafanyakazi wa kawaida tu. Tafsiri hii inaonyesha wajibu wao kwa mwenye shamba bila kuongeza ufafanuzi wa kimafundisho.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: wakasema wao kwa wao
  rationale: Kirai hiki kinaonyesha mazungumzo ndani ya kundi. ‘Wao kwa wao’ ni Kiswahili cha kawaida kinachohifadhi wazo la kusemezana.
- source_word: ὅτι
  choice: alama za kunukuu
  rationale: Hapa ὅτι inaanzisha maneno ya moja kwa moja; alama za kunukuu zinawasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Huyu ndiye mrithi
  rationale: ‘Huyu’ huhifadhi kiwakilishi cha kuonyesha, na ‘ndiye’ husisitiza utambulisho wa mrithi kwa njia ya kawaida ya Kiswahili.
- source_word: δεῦτε
  choice: Njooni
  rationale: Ni mwito wa kuhimiza kundi lichukue hatua; wingi wa ‘Njooni’ unalingana na wanaoambiwa.
- source_word: ἀποκτείνωμεν
  choice: tumuue
  rationale: Umbo hili linawasilisha pendekezo la pamoja la kuua moja kwa moja, bila kuongeza maana mahususi ya kisheria iliyomo katika ‘murder.’
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: na urithi utakuwa wetu
  rationale: Tafsiri hii huhifadhi maana ya umiliki inayosisitizwa na ἡμῶν bila kuongeza ‘wake,’ ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya γεωργοί katika mfano huu
  choice: wakulima wapangaji
  alternative: wakulima; wapangaji; watunza mizabibu
  rationale: Muktadha unaonyesha kuwa hawa hulima mali ya mwenye shamba na wanawajibika kwake. ‘Wakulima wapangaji’ huhifadhi uhusiano huo muhimu kwa mfano bila kuingiza tafsiri ya kiistiari au msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. ‘Wakulima wapangaji’ linaweka wazi nafasi yao ya kijamii; sentensi nyingine imeachwa fupi na yenye nguvu kama ilivyo katika simulizi.
