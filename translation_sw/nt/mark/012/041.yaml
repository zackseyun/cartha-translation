base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: sw
  text: Akaketi mkabala wa hazina[a], akawa akitazama jinsi umati ulivyokuwa ukiutia sarafu za shaba ndani ya hazina; na matajiri wengi walikuwa wakitia kiasi kikubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanduku la matoleo” au “hazina ya Hekalu”; neno la Kigiriki linaweza kumaanisha hazina ya Hekalu au vyombo vya kupokelea matoleo vinavyohusiana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: akaketi
  rationale: Kitenzi kishirikishi cha aoristi kinaweka tukio linalotangulia tendo kuu; “akaketi” ni simulizi la kawaida la Kiswahili.
- source_word: κατέναντι
  choice: kuelekeana na
  rationale: Huonyesha mahali palipo moja kwa moja upande wa pili; kauli hii ni ya kawaida na inaeleweka.
- source_word: γαζοφυλάκιον
  choice: hazina ya Hekalu
  rationale: Neno linaweza kumaanisha hazina ya Hekalu au vyombo vya kupokelea matoleo vinavyohusiana nayo. “Hazina ya Hekalu” ni fupi na haibainishi kupita kiasi kama ni eneo au sanduku.
- source_word: ἐθεώρει
  choice: akawa akitazama
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea; muundo huu unahifadhi hali hiyo.
- source_word: πῶς
  choice: jinsi
  rationale: Huelekeza fikira kwenye namna au mchakato wa watu kutoa, si ukweli wa kutoa tu.
- source_word: ὄχλος
  choice: umati
  rationale: Ni tafsiri ya kawaida ya kundi kubwa la watu katika simulizi.
- source_word: βάλλει / ἔβαλλον
  choice: ulivyokuwa ukitia / walikuwa wakitia
  rationale: Ingawa βάλλω kwa msingi ni ‘kutupa’, hapa inamaanisha kuweka fedha katika hazina; “kutia” ni ya asili katika muktadha huu na miundo inaonyesha tendo linaloendelea.
- source_word: χαλκόν
  choice: pesa
  rationale: Kwa maana halisi ni shaba, lakini katika muktadha huu humaanisha sarafu za shaba, yaani pesa; “pesa” ni ya asili bila kupotosha aina ya tendo.
- source_word: πολλοὶ πλούσιοι
  choice: matajiri wengi
  rationale: Ni kauli fupi, ya asili, na haiingizi jinsia isiyolazimishwa na muktadha.
- source_word: πολλά
  choice: pesa nyingi
  rationale: Katika muktadha wa fedha, wingi huu humaanisha kiasi kikubwa; kurudia “pesa” huifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
