  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: sw
  text: Na wakati uliofaa, akamtuma mtumwa[a] kwa wakulima wa shamba la mizabibu[b], ili apokee kutoka kwa wakulima hao sehemu ya mazao ya shamba hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki δοῦλος kwa kawaida humaanisha mtumwa, ingawa kulingana na muktadha linaweza kutafsiriwa “mtumishi.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakulima” au “wapangaji.” Neno la Kigiriki humaanisha watu wanaolima ardhi; hapa muktadha unaonyesha kwamba walifanya kazi katika shamba la mizabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akamtuma
  rationale: Kitenzi hiki kinaonyesha tendo la kumpeleka mtu kwa kusudi fulani; “akamtuma” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: γεωργούς / γεωργῶν
  choice: wakulima wa shamba la mizabibu
  rationale: γεωργός humaanisha mtu anayelima au kuitunza ardhi. Muktadha wa shamba la mizabibu unaruhusu maana hiyo kuwekwa wazi bila kudai moja kwa moja kwamba walikuwa wapangaji.
- source_word: τῷ καιρῷ
  choice: wakati uliofaa
  rationale: καιρός hapa ni wakati unaofaa au uliowadia, yaelekea wakati wa mavuno, lakini tafsiri haiongezi wazi jambo ambalo Kigiriki hakilitaji.
- source_word: δοῦλον
  choice: mtumwa
  rationale: δοῦλος humaanisha mtu aliye chini ya mamlaka na umiliki wa bwana. “Mtumwa” huhifadhi hali hiyo ya kijamii, huku “mtumishi” ikitolewa kama mbadala katika tanbihi.
- source_word: ἵνα ... λάβῃ
  choice: ili apokee
  rationale: Muundo wa ἵνα pamoja na hali tegemezi unaonyesha kusudi; “ili apokee” ni wa asili na huhifadhi kusudi hilo.
- source_word: παρὰ τῶν γεωργῶν
  choice: kutoka kwa wakulima hao
  rationale: παρά pamoja na umilikishi huonyesha chanzo; kirai hiki kinaonyesha kwamba mazao yangepokewa kutoka kwa wakulima.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: sehemu ya mazao ya shamba hilo
  rationale: ἀπό pamoja na umilikishi hapa ina maana ya kuchukua kiasi kutoka katika jumla. “Sehemu ya mazao” huonyesha maana hiyo bila kuongeza wazo la “fungu lake,” ambalo halijasemwa moja kwa moja.
- source_word: ἀμπελῶνος
  choice: shamba la mizabibu
  rationale: Hii ndiyo tafsiri ya kawaida na inayoeleweka ya ἀμπελών katika Kiswahili cha Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Mazao” limetumiwa badala ya “matunda” kwa sababu katika muktadha wa kilimo linaeleza vizuri mavuno ya shamba la mizabibu. Marudio ya “wakulima” yamehifadhiwa kwa kiasi ili kufuata msisitizo wa chanzo, huku “hao” na “shamba hilo” vikizuia sentensi kuwa nzito.
