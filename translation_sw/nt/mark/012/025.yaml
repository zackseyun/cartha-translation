  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: sw
  text: Kwa maana watakapofufuka kutoka kwa wafu, hawataoa wala hawataolewa, bali ni kama malaika walio mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, neno “mbingu” ni la wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Kwa maana watakapo-
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na muundo wa “watakapo-” huonyesha wakati wa ufufuo unaotajwa katika hoja hii.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: watakapofufuka kutoka kwa wafu
  rationale: Huu ni usemi wa kawaida na wa wazi wa Kiswahili kuhusu kufufuka; unahifadhi umbo tendaji la ἀναστῶσιν na wazo la kutoka miongoni mwa wafu.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: hawataoa wala hawataolewa
  rationale: Jozi “wala ... wala” huhifadhi ulinganifu wa οὔτε ... οὔτε. “Kuoa” na “kuolewa” ni usemi wa kawaida wa Kiswahili unaohifadhi tofauti kati ya vitenzi hivyo viwili katika muktadha wa ndoa.
- source_word: ἀλλ’ εἰσὶν
  choice: bali watakuwa
  rationale: “Bali” huonyesha tofauti inayokusudiwa. Wakati ujao ni wa asili katika Kiswahili baada ya “watakapofufuka,” ingawa Kigiriki hutumia kitenzi cha wakati uliopo katika kauli hii ya jumla.
- source_word: ὡς ἄγγελοι
  choice: kama malaika
  rationale: “Kama” huonyesha ulinganisho, si kwamba waliofufuliwa wanakuwa malaika.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: walio mbinguni
  rationale: “Mbinguni” ni usemi wa kawaida wa Kiswahili kwa mahali hapa; wingi wa neno la Kigiriki umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Asili ya ulinganisho na malaika
  choice: Waliofufuliwa watakuwa kama malaika kwa habari ya kutooa wala kutoolewa.
  alternative: Waliofufuliwa watageuka na kuwa malaika.
  rationale: Kihusishi cha ulinganisho ὡς humaanisha kufanana, si kuwa kitu kilekile; tafsiri “kama malaika” haiendi mbali kuliko sarufi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Wakati ujao umetumiwa kwa mtiririko wa kawaida wa sentensi ya Kiswahili. Alama ya tanbihi imewekwa baada ya “mbinguni,” ambako maelezo yake yanahusika.
