base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: sw
  text: Nao wakaleta sarafu moja.[a] Akawaambia, “Picha hii ni ya nani, na maandishi haya ni ya nani?” Wakamwambia, “Ni vya Kaisari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wakaleta.” Yambwa haikutajwa wazi, lakini kutokana na muktadha inaeleweka kuwa ni ile sarafu, yaani dinari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: wakaleta sarafu moja
  rationale: Kitenzi humaanisha ‘kuleta’; yambwa haikutajwa wazi katika Kigiriki lakini inaeleweka kutokana na muktadha uliotangulia kuwa ni dinari. Kiswahili cha kawaida huhitaji kuitaja hapa ili sentensi iwe wazi na ya asili.
- source_word: λέγει
  choice: akawauliza
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati wa mfululizo wa matukio. ‘Akawauliza’ pia huwasilisha kwamba maneno yanayofuata ni swali kwao.
- source_word: Τίνος
  choice: ni vya nani
  rationale: Hili ni swali la umiliki au uhusiano. Muundo ‘ni vya nani’ ni wa asili kwa Kiswahili na unahusisha kwa pamoja sura na maandishi.
- source_word: εἰκών
  choice: sura
  rationale: Katika muktadha wa sarafu, ‘sura’ huonyesha picha au mfano wa mtu uliochapishwa juu yake bila kutumia istilahi ngumu ya kitaalamu.
- source_word: ἐπιγραφή
  choice: maandishi
  rationale: Neno hili linarejelea maandishi yaliyo kwenye sarafu. ‘Maandishi’ ni sahihi, wazi, na yanaeleweka kwa urahisi.
- source_word: Καίσαρος
  choice: vya Kaisari
  rationale: Hali ya umiliki katika Kigiriki inajibu moja kwa moja swali ‘ni vya nani?’; ‘vya Kaisari’ ni jibu fupi na la asili kwa Kiswahili.
