  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: sw
  text: Katika ufufuo, watakapofufuka[a], atakuwa mke wa nani kati yao? Kwa maana hao saba walikuwa naye kama mke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakapoinuka.” Kigiriki kinasema kihalisi “watakapoinuka”; muktadha wa ufufuo ndio unaotoa maana ya kufufuka kutoka kwa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: ufufuo
  rationale: Katika mjadala huu neno linarejelea ufufuo wa wakati ujao. “Ufufuo” ni neno la kawaida na wazi katika Kiswahili bila kuongeza kirai kisichotajwa hapa, kama “kutoka kwa wafu.”
- source_word: ὅταν ἀναστῶσιν
  choice: watakapofufuka
  rationale: 'Muundo huu unaeleza wakati ujao: “watakapofufuka.” Kiswahili hakihitaji kuongeza “tena,” na kitenzi “kufufuka” kinaeleweka kwa kawaida katika muktadha wa ufufuo.'
- source_word: τίνος αὐτῶν
  choice: wa nani kati yao
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza ni yupi miongoni mwa kundi hilo atakayehusiana naye kama mume.
- source_word: ἔσται γυνή
  choice: atakuwa mke
  rationale: Muundo wa Kiswahili “atakuwa mke wa nani” unawasilisha kwa kawaida uhusiano wa kindoa unaoulizwa na Kigiriki.
- source_word: γυνή
  choice: mke
  rationale: Katika matukio yote mawili muktadha ni wa ndoa, kwa hiyo maana maalumu “mke,” si maana pana “mwanamke,” ndiyo inayofaa.
- source_word: οἱ γὰρ ἑπτὰ
  choice: kwa maana hao saba
  rationale: “Kwa maana” linaonyesha msingi wa swali, na “hao saba” linarejelea kwa uwazi ndugu saba waliotajwa katika muktadha uliotangulia bila kuongeza “wanaume.”
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: walikuwa wamemwoa
  rationale: Hii ni njia ya asili ya Kiswahili ya kusema kwamba kila mmoja alikuwa amekuwa naye katika uhusiano wa ndoa. Inaepuka usemi mgumu “walikuwa naye kama mke” huku ikihifadhi hali ya kindoa iliyotokana na kuoa.
theological_decisions:
- issue: Lugha ya ufufuo katika mabishano na Masadukayo
  choice: Katika ufufuo, watakapofufuka
  alternative: Katika ufufuo kutoka kwa wafu, watakapofufuka tena
  rationale: Tafsiri inadumisha dai la ufufuo wa wakati ujao bila kuongeza “kutoka kwa wafu” au “tena,” maneno ambayo hayajaelezwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Walikuwa wamemwoa” limetumiwa badala ya tafsiri ya neno kwa neno ambayo ingesikika isiyo ya kawaida.
