  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: sw
  text: wanaomeza mali za wajane, na wanaosali sala ndefu kwa unafiki[a]—hao watapata hukumu kali zaidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kisingizio” au “kwa maonyesho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “adhabu kubwa zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: hula
  rationale: Kitenzi hiki kinadumisha taswira kali ya kula mali ya wengine kwa pupa. Katika muktadha huu, ‘hula’ ni usemi wa kitamathali unaoeleweka kuwa ni kuwanyonya wajane bila kuufanya ufafanuzi huo kuwa sehemu ya tafsiri.
- source_word: οἰκίας
  choice: nyumba
  rationale: Hili ndilo neno la moja kwa moja katika Kigiriki. Linaweza kumaanisha pia kaya au mali za wajane katika muktadha, lakini ‘nyumba’ huhifadhi taswira halisi na kuepuka kufafanua kupita kiasi.
- source_word: χηρῶν
  choice: za wajane
  rationale: Muundo huu unaonyesha wazi kwamba nyumba hizo ni za wajane, kundi lililokuwa katika hali ya kudhurika kijamii.
- source_word: προφάσει
  choice: kwa kujionyesha
  rationale: Usemi huu unaeleza kwamba sala hizo ndefu ni za maonyesho au unafiki. Chaguo la karibu zaidi, ‘kwa kisingizio,’ limehifadhiwa katika tanbihi.
- source_word: μακρὰ
  choice: sala ndefu
  rationale: Kivumishi hiki kimetumiwa kwa maana ya muda mrefu wa kusali. ‘Kusali sala ndefu’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: προσευχόμενοι
  choice: kusali
  rationale: Kitenzi-jina hiki kinaunganishwa kwa kawaida na maelezo yaliyotangulia huku kikiendeleza nguvu ya hali ya kushiriki ya Kigiriki.
- source_word: λήμψονται
  choice: watapata
  rationale: Ni tafsiri ya kawaida na ya asili ya kitendo cha kupokea matokeo ya hukumu.
- source_word: περισσότερον
  choice: kubwa zaidi
  rationale: Huhifadhi ulinganisho wa Kigiriki bila kuamua kwa undani namna au kiwango cha adhabu.
- source_word: κρίμα
  choice: adhabu
  rationale: Katika onyo hili, neno lina nguvu ya hukumu yenye matokeo ya kuadhibu. ‘Adhabu’ huwasilisha maana hiyo kwa uwazi, huku maana pana ya ‘hukumu’ ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya κρίμα katika onyo dhidi ya unafiki wa kidini
  choice: adhabu
  alternative: hukumu
  rationale: Muktadha unaonya juu ya matokeo mabaya ya hukumu kwa unafiki na kuwadhulumu wajane. ‘Adhabu’ huonyesha nguvu hiyo bila kuingiza maelezo ya kimadhehebu kuhusu hukumu ya mwisho; ‘hukumu’ bado ni tafsiri halali na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Taswira ya ‘hula nyumba’ imehifadhiwa kwa sababu ya ukali wake wa kimaadili, huku tanbihi zikihifadhi mbadala halali za maneno yenye upana wa maana.
