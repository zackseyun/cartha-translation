  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: sw
  text: Wakamkamata[a], wakamuua, wakamtupa nje ya shamba la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wasomaji wanaweza kutarajia mpangilio, “wakamtupa nje ya shamba la mizabibu, wakamuua,” kutokana na masimulizi sambamba ya mfano huu. Hata hivyo, maandishi ya Kigiriki ya Marko hapa yanasema, “wakamuua, wakamtupa nje ya shamba la mizabibu.”
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: wakamkamata
  rationale: Kitenzi λαμβάνω hapa kinaanzisha mfululizo wa matendo dhidi ya mwana. Katika muktadha huu, “wakamkamata” ni Kiswahili cha kawaida kinachoonyesha kumtia mikononi bila kuongeza kwa lazima ukatili ulio wazi zaidi katika maneno kama “wakanyakua.”
- source_word: ἀπέκτειναν
  choice: wakamuua
  rationale: ἀποκτείνω humaanisha moja kwa moja kuua; “wakamuua” ni tafsiri wazi, ya sasa, na yenye uzito unaofaa muktadha.
- source_word: ἐξέβαλον
  choice: wakamtupa nje
  rationale: ἐκβάλλω pamoja na ἔξω huonyesha kumtoa kwa nguvu. “Wakamtupa nje” huhifadhi nguvu hiyo na ni Kiswahili cha kawaida kuliko “wakamtoa nje” ambacho kingeweza kudhoofisha tendo.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: nje ya shamba la mizabibu
  rationale: Muundo huu unaonyesha kuelekea nje ya shamba la mizabibu; “nje ya” huungana kiasili na “wakamtupa.”
- source_word: ἀμπελῶνος
  choice: shamba la mizabibu
  rationale: ἀμπελών ni eneo lililopandwa mizabibu. “Shamba la mizabibu” ni neno la kawaida na linaloeleweka kwa wasomaji wa Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Mpangilio wa kuua na kutupa nje katika mfano
  choice: 'Tafsiri inafuata mpangilio wa Kigiriki: walimuua, kisha wakamtupa nje ya shamba la mizabibu.'
  alternative: Kupanga matendo kuwa walimtupa nje kwanza, kisha wakamuua, kwa kufuata simulizi sambamba au matarajio ya mapokeo.
  rationale: SBLGNT katika Marko 12:8 inaweka wazi mfululizo wa kumkamata, kumuua, na kumtupa nje. Mpangilio huo umehifadhiwa bila kuupatanisha na simulizi sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wazi, na wenye hadhi. Viambishi vya mtendwa katika “wakamkamata,” “wakamuua,” na “wakamtupa” vinaendeleza kwa uwazi mwana aliyetajwa katika muktadha.
