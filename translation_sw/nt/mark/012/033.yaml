  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: sw
  text: na kumpenda yeye kwa moyo wote, kwa ufahamu wote, na kwa nguvu zote, na kumpenda jirani kama mtu anavyojipenda mwenyewe, ni zaidi ya sadaka zote za kuteketezwa[a] na dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, sadaka zilizoteketezwa kabisa. Neno la Kigiriki linataja hasa sadaka iliyoteketezwa yote juu ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: kumpenda
  rationale: Kitenzi-jina chenye kibainishi kimetafsiriwa kwa umbo la kitenzi-jina la Kiswahili, likihifadhi nguvu ya kitendo na usambamba wa matumizi yake mara mbili.
- source_word: αὐτόν
  choice: yeye
  rationale: Kiwakilishi kinamrejelea Mungu katika muktadha uliotangulia; “yeye” kinahifadhi namna ya Kigiriki bila kurudia jina la mrejelewa.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: kwa moyo wote
  rationale: Hii ni njia ya kawaida na yenye hadhi katika Kiswahili ya kueleza kujitoa kwa moyo mzima.
- source_word: συνέσεως
  choice: ufahamu
  rationale: “Ufahamu” huonyesha kuelewa na kupambanua, na kwa hiyo hutofautisha σύνεσις na neno la jumla zaidi la akili.
- source_word: ἰσχύος
  choice: nguvu
  rationale: “Nguvu” ni tafsiri ya wazi na ya kawaida inayoonyesha uwezo wote wa mtu.
- source_word: πλησίον
  choice: jirani
  rationale: Nomino hii ina maana ya jumla hapa; “jirani” ni ya asili katika Kiswahili na huhifadhi upana wa wajibu wa kimaadili.
- source_word: ὡς ἑαυτόν
  choice: kama nafsi yako
  rationale: Kauli ya msemaji inarudia amri iliyo katika nafsi ya pili; “nafsi yako” ni ya kawaida katika lugha ya kibiblia ya Kiswahili na inaeleweka kwa urahisi.
- source_word: περισσότερόν ἐστιν
  choice: ni zaidi ya
  rationale: Kauli hii huhifadhi ulinganisho wa wazi wa ubora bila kuongeza wazo la kufutwa kwa dhabihu.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: sadaka zote za kuteketezwa na dhabihu
  rationale: “Sadaka za kuteketezwa” ni usemi wa kawaida; tanbihi inaeleza kwamba ὁλοκαυτώματα ni sadaka zilizoteketezwa kabisa.
theological_decisions:
- issue: Uhusiano wa amri za upendo na ibada ya dhabihu
  choice: Mstari unasema kwamba kumpenda Mungu kikamilifu na kumpenda jirani ni zaidi ya sadaka zote za kuteketezwa na dhabihu.
  alternative: Kusema kwamba mstari unafuta kabisa mfumo wa dhabihu, au kwamba unaweka upendo na dhabihu katika kiwango sawa.
  rationale: περισσότερόν ἐστιν inaonyesha ubora wazi, lakini mstari wenyewe hautangazi moja kwa moja kufutwa kwa dhabihu; mvutano huo umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vipashio sambamba umehifadhiwa, huku maneno ya kawaida ya kibiblia “moyo,” “ufahamu,” “nguvu,” “jirani,” “sadaka,” na “dhabihu” yakitumika.
