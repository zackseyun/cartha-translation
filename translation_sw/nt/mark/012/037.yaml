base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: sw
  text: Daudi mwenyewe anamwita Bwana; basi, anawezaje kuwa mwana wake?[a] Nao umati mkubwa ulikuwa ukimsikiliza kwa furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno “mwana” hapa linarejelea cheo cha Kimasihi “Mwana wa Daudi”; linaweza pia kumaanisha “mzao.” Kwa tafsiri ya neno kwa neno zaidi: “basi, anatoka wapi kuwa mwana wake?”'
    reason: Kuhifadhi maana pana ya ukoo ya υἱός na maana halisi ya πόθεν.
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Daudi mwenyewe
  rationale: Huhifadhi mkazo wa αὐτός kwamba Daudi binafsi ndiye anayemwita hivyo.
- source_word: λέγει αὐτὸν κύριον
  choice: anamwita Bwana
  rationale: Muundo huu una maana ya kumpa mtu cheo au kumtaja kuwa Bwana, si kusema tu kumhusu.
- source_word: πόθεν
  choice: inakuwaje
  rationale: Ingawa maana ya msingi ni ‘kutoka wapi,’ hapa neno linauliza msingi wa kimantiki wa dai hilo; ‘inakuwaje’ ni Kiswahili cha kawaida kinachohifadhi hoja.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: awe mwana wake
  rationale: ‘Mwana’ huhifadhi mwangwi wa cheo cha Kimasihi ‘Mwana wa Daudi’ na mvutano wa swali, badala ya kufafanua moja kwa moja kuwa ‘mzao.’
- source_word: ὁ πολὺς ὄχλος
  choice: umati mkubwa
  rationale: Hueleza kwa kawaida kundi kubwa la watu bila kuingiza wazo la tabaka la kijamii.
- source_word: ἤκουεν αὐτοῦ
  choice: ulikuwa ukimsikiliza
  rationale: Muundo endelevu unawakilisha hali ya tendo lisilo la mara moja katika kitenzi cha wakati uliopita.
- source_word: ἡδέως
  choice: kwa furaha
  rationale: Hutoa maana ya kusikiliza kwa kupendezwa na kwa hiari katika Kiswahili cha sasa.
theological_decisions:
- issue: Nguvu ya Kikristo ya Daudi kumwita Masihi ‘Bwana’
  choice: Kuhifadhi cheo cha moja kwa moja ‘Bwana’ na swali la kimantiki bila kuliongezea ufafanuzi wa kimafundisho.
  alternative: Daudi mwenyewe anamwita Masihi ‘Bwana’; basi, ni kwa maana gani yeye ni mwana wake?
  rationale: Andiko linaacha mvutano kwamba Masihi ni mwana wa Daudi lakini Daudi anamwita Bwana; tafsiri haipaswi kutatua zaidi ya maneno yenyewe.
- issue: Maana ya υἱός katika muktadha wa Kimasihi
  choice: mwana
  alternative: mzao
  rationale: ‘Mwana’ huhifadhi cheo kinachotambulika cha ‘Mwana wa Daudi’ na msingi wa swali la Yesu, huku tanbihi ikionyesha maana pana ya ukoo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Daudi mwenyewe’ huhifadhi mkazo; ‘ulikuwa ukimsikiliza’ huhifadhi hali endelevu; swali limewekwa kwa mtiririko wa kawaida bila kuondoa utata wa kiteolojia.
