id: MRK.12.35
reference: Mark 12:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: sw
  text: Yesu alipokuwa akifundisha hekaluni, akajibu na kusema, “Waandishi wa sheria husemaje kwamba Masihi[a] ni mwana wa Daudi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki ni Christos, likitumika hapa kama cheo cha kimasiya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Kitenzi hiki kwa kawaida humaanisha kujibu au kuitikia. Ingawa hakuna swali lililotajwa mara moja kabla yake, hapa kinaonyesha kwamba Yesu anaitikia mjadala au hali iliyokuwapo; kwa hiyo maana yake imehifadhiwa wazi.
- source_word: ἔλεγεν
  choice: na kusema
  rationale: Muundo huu unaunganishwa kiasili na ‘akajibu’ bila kulazimisha Kiswahili kurudia ‘alisema’ kwa namna nzito.
- source_word: διδάσκων
  choice: alipokuwa akifundisha
  rationale: Huonyesha tendo lililokuwa likiendelea wakati Yesu aliposema maneno haya.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Neno ἱερόν linarejelea eneo la hekalu kwa upana, na ‘hekaluni’ ndilo neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: Πῶς
  choice: husemaje
  rationale: Huhifadhi swali la ‘jinsi gani’ bila kulibadili moja kwa moja kuwa ‘kwa nini’ au kudokeza kwamba dai hilo haliwezekani kabisa.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Hutambulisha kundi la kihistoria la wataalamu wa Maandiko na sheria, huku likiepuka maana pana zaidi ya ‘walimu wa sheria’ pekee.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha mkombozi aliyekuwa akitarajiwa katika muktadha wa Kiyahudi, hivyo ‘Masihi’ linafaa kuliko kulitumia kana kwamba ni jina binafsi.
- source_word: υἱὸς Δαυίδ
  choice: mwana wa Daudi
  rationale: Huhifadhi usemi wa kimasiya na uhusiano wa ukoo unaodokezwa na Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika swali hili neno hilo linatumika wazi kama cheo katika matarajio ya Kiyahudi. ‘Kristo’ limewekwa katika tanbihi kama tafsiri nyingine inayojulikana.
- issue: Nguvu ya swali Πῶς λέγουσιν
  choice: Waandishi wa sheria husemaje kwamba…?
  alternative: Waandishi wa sheria wanawezaje kusema kwamba…?
  rationale: Tafsiri iliyochaguliwa inahifadhi upeo wa swali la Kigiriki na haitangulizi hitimisho kwamba Yesu anakataa kabisa uhusiano wa Masihi na Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Akajibu na kusema’ linahifadhi vipengele vyote viwili vya Kigiriki, ingawa hakuna swali lililotangulia mara moja; ‘hekaluni’ limetumiwa kwa eneo la hekalu kwa ujumla.
