  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: sw
  text: 'Je, hamjasoma hata Andiko hili: “Jiwe walilolikataa waashi, hilo limekuwa jiwe kuu la kona[a]”?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kichwa cha kona”; kwa mapokeo, “jiwe kuu la kona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: andiko
  rationale: Katika Agano Jipya, γραφή mara nyingi humaanisha andiko takatifu. Katika muktadha huu wa kunukuu Zaburi, “andiko” ni la kawaida na lenye hadhi bila kuongeza ufafanuzi usio katika Kigiriki.
- source_word: ἀνέγνωτε
  choice: hamjasoma
  rationale: Aoristi katika swali la kukemea inaelezwa kwa Kiswahili cha kawaida kwa hali timilifu “hamjasoma,” ikirejelea jambo ambalo wangepaswa kuwa wameshalisoma.
- source_word: οὐδὲ
  choice: hata
  rationale: '“Hata” pamoja na ukanushi wa “hamjasoma” huhifadhi mkazo wa οὐδέ: “hamjasoma hata...”'
- source_word: Λίθον
  choice: Jiwe
  rationale: Ingawa nomino haina kibainishi katika Kigiriki, nukuu inarejelea jiwe maalumu katika taswira ya Zaburi 118; Kiswahili hakihitaji kibainishi tofauti.
- source_word: ἀπεδοκίμασαν
  choice: walilolikataa
  rationale: “Kukataa” huwasilisha wazi tendo la kutolipokea jiwe baada ya kulikadiria, bila kulazimisha maelezo marefu katika matini.
- source_word: οἱ οἰκοδομοῦντες
  choice: waashi
  rationale: “Waashi” ni neno la kawaida kwa wajenzi wanaoshughulika na mawe na linafaa kwa taswira ya jiwe la pembeni.
- source_word: οὗτος
  choice: hilo
  rationale: Kiwakilishi cha kuonyesha huhifadhi msisitizo wa Kigiriki kwamba jiwe lilelile lililokataliwa ndilo lililopata nafasi kuu.
- source_word: ἐγενήθη
  choice: limekuwa
  rationale: Hali timilifu ya Kiswahili huonyesha tukio lililotimia pamoja na matokeo yake yanayoendelea.
- source_word: εἰς κεφαλὴν γωνίας
  choice: jiwe kuu la pembeni
  rationale: Tafsiri hii huhifadhi wazo la jiwe lenye nafasi kuu kwenye pembe huku ikibaki ya asili na inayoeleweka katika Kiswahili. Tanbihi inahifadhi tafsiri ya karibu zaidi ya muundo wa Kigiriki.
theological_decisions:
- issue: Matumizi ya kimasiya ya taswira ya Zaburi 118:22
  choice: Kuhifadhi taswira ya jiwe, waashi, na jiwe kuu la pembeni bila kumtaja Masihi moja kwa moja katika tafsiri.
  alternative: Kulifafanua jiwe moja kwa moja kuwa Masihi au Yesu.
  rationale: Muktadha unaitumia nukuu kumhusu Yesu, lakini maneno yenyewe yanadumisha taswira ya Maandiko. Kutoiendeleza kwa ufafanuzi huhifadhi nguvu na mvutano wa kitheolojia wa chanzo.
- issue: Maana ya κεφαλὴ γωνίας
  choice: jiwe kuu la pembeni
  alternative: kichwa cha pembeni; jiwe la kileleni
  rationale: Muundo unaweza kujadiliwa kuwa jiwe kuu la kona au jiwe lenye nafasi ya juu, lakini tafsiri kuu ya pembeni hufuata vipengele vya kimsamiati bila kuamua kwa uhakika aina ya usanifu kuliko chanzo kinavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la kukemea limehifadhiwa, na sentensi ya nukuu imetolewa kwa mtiririko wa kawaida unaoeleweka kwa wasomaji wengi.
