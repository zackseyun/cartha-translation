base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: sw
  text: “Mwalimu, Musa alituandikia kwamba ikiwa ndugu wa mtu akifa na kuacha mke lakini asiache mtoto,[a][b] ndugu yake amchukue mke huyo na amwinulie ndugu yake uzao.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kigiriki ni la umoja: “asiache mtoto”; tafsiri nyingine husema “asiache watoto.”'
    reason: lexical_alternative
  - marker: b
    text: Tazama Kumbukumbu la Torati 25:5 kuhusu sheria ya Musa inayorejelewa hapa.
    reason: cross_reference
  - marker: c
    text: Kwa maana halisi, “amwinulie ndugu yake mbegu,” usemi unaomaanisha kumpatia marehemu uzao kwa kutimiza wajibu wa ndoa ya ndugu wa marehemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni namna ya moja kwa moja na ya kawaida ya kumwita Yesu kama mwalimu, bila kuongeza wazo la mamlaka lililo nje ya neno lenyewe.
- source_word: ἔγραψεν ἡμῖν
  choice: alituandikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo kwamba Musa aliandika sheria hii kwa ajili ya watu wa Israeli.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ikiwa ndugu ya mtu atakufa
  rationale: Huhifadhi hali ya jumla ya τινος pamoja na neno la kindugu la kiume ἀδελφός.
- source_word: καταλίπῃ γυναῖκα
  choice: na kuacha mke
  rationale: Katika muktadha wa kifo, ‘kuacha mke’ hueleweka kwa kawaida kuwa mke ameachwa baada ya kifo.
- source_word: μὴ ἀφῇ τέκνον
  choice: lakini asiache mtoto
  rationale: Huhifadhi umoja wa τέκνον na ulinganifu wa vitenzi vya kuacha katika Kigiriki; ‘lakini’ huonyesha wazi uhusiano wa hali hizo mbili.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: ndugu yake anapaswa kumchukua huyo mke
  rationale: ‘Kumchukua mke’ katika muktadha huu wa sheria humaanisha kumwoa, huku tafsiri ikibaki karibu na usemi wa Kigiriki.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: kumwinulia ... uzao
  rationale: Ni usemi unaoeleweka wa wajibu wa ndoa ya ndugu wa marehemu; ‘uzao’ huwasilisha σπέρμα bila kutumia ‘mbegu’ kwa maana inayoweza kuwa fiche hapa.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: Huhifadhi maana ya kumzalia au kumwinulia marehemu uzao unaohesabiwa kuwa wake bila kuongeza neno ‘marehemu’ katika matini kuu.
theological_decisions:
- issue: Usemi wa kisheria kuhusu ndoa ya ndugu wa marehemu
  choice: ‘kumchukua huyo mke na kumwinulia ndugu yake uzao’
  alternative: ‘kumwoa mjane huyo na kumzalia ndugu yake watoto’
  rationale: Chaguo kuu linaeleweka katika Kiswahili na wakati huohuo huhifadhi picha na mvutano wa usemi wa chanzo bila kuufafanua kupita kiasi.
- issue: Lugha yenye jinsia katika sheria hii
  choice: Kuhifadhi ‘ndugu,’ ‘mke,’ na ‘mtoto.’
  alternative: Kutumia maneno yasiyotaja jinsia kama ‘jamaa’ au ‘mwenzi.’
  rationale: Muktadha wa Kigiriki unataja wazi ndugu wa kiume na mke katika sheria ya ndoa ya ndugu wa marehemu; kuifanya lugha kuwa isiyo na jinsia kungeondoa taarifa ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imedumisha mtindo wa kunukuu sheria huku ikitumia maneno yanayoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimo katika matini kuu.
