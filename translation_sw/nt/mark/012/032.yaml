base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: sw
  text: Mwalimu wa sheria akamwambia, “Umesema vizuri, Mwalimu. Umesema kweli kwamba yeye ni mmoja, wala hakuna mwingine ila yeye.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi kutokana na muktadha, “Mungu ni mmoja, wala hakuna mwingine ila yeye.” Kigiriki hakumtaji Mungu wazi katika kauli hii; kinasema “ni mmoja,” na anayerejelewa anajulikana kutokana na muktadha uliotangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: mwalimu wa sheria
  rationale: Katika muktadha wa Injili, neno hili humaanisha mtaalamu na mwalimu wa Sheria ya Musa. Tafsiri hii ni wazi kwa wasomaji wa Kiswahili cha sasa kuliko neno la kihistoria ‘mwandishi,’ ambalo linaweza kueleweka kama mtu anayeandika tu.
- source_word: Καλῶς
  choice: Umesema vizuri
  rationale: Hutoa pongezi ya mwalimu wa sheria kwa jibu la Yesu kwa Kiswahili cha kawaida na cha heshima.
- source_word: διδάσκαλε
  choice: Mwalimu
  rationale: Ni kisawe cha kawaida na cha moja kwa moja cha cheo hiki katika mazungumzo ya Injili.
- source_word: ἐπ’ ἀληθείας
  choice: kweli
  rationale: Kirai hiki kinatumika kama kielezi kinachothibitisha ukweli wa kauli ya Yesu; ‘kweli’ ni wazi na asilia.
- source_word: εἶπες
  choice: Umesema
  rationale: Kauli iliyotolewa muda mfupi uliopita na yenye umuhimu katika mazungumzo ya sasa huwasilishwa kwa kawaida kwa ‘umesema.’
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa linaanzisha maudhui ya yale Yesu aliyosema, si sababu ya pongezi.
- source_word: εἷς ἐστιν
  choice: yeye ni mmoja
  rationale: Huhifadhi muundo wa Kigiriki usiotaja ‘Mungu’ tena waziwazi, huku rejeleo likipatikana katika muktadha uliotangulia.
- source_word: οὐκ ἔστιν ἄλλος
  choice: wala hakuna mwingine
  rationale: Ni Kiswahili cha asili kinachowasilisha moja kwa moja ukosefu wa mwingine.
- source_word: πλὴν αὐτοῦ
  choice: ila yeye
  rationale: Huonyesha upekee kwa ufupi na kwa ufasaha, sawa na maana ya ‘isipokuwa yeye’ au ‘zaidi yake.’
theological_decisions:
- issue: Kiima kisichotajwa wazi katika εἷς ἐστιν
  choice: yeye ni mmoja
  alternative: Mungu ni mmoja
  rationale: Muktadha unaonyesha wazi kwamba anayerejelewa ni Mungu, lakini mstari huu wa Kigiriki haurudii neno θεός. Tafsiri kuu huhifadhi usemi huo uliodokezwa, na tanbihi hutoa namna iliyo wazi zaidi kwa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mwalimu wa sheria’ limetumiwa badala ya ‘mwandishi’ ili kuonyesha jukumu la γραμματεύς bila kupotosha maana. Alama ya tanbihi imewekwa baada ya kauli nzima inayohusika.
