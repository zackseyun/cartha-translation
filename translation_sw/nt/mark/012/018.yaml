  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: sw
  text: Kisha Masadukayo, ambao husema kwamba hakuna ufufuo, wakaja kwake, wakaanza kumuuliza wakisema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: Masadukayo
  rationale: Jina la kundi la Kiyahudi lililozoeleka katika Kiswahili cha Biblia.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: Neno la kawaida la Kiswahili kwa kufufuka kwa wafu; linahifadhi maana ya kidini ya muktadha.
- source_word: ἐπηρώτων
  choice: wakaanza kumuuliza
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililoanza au lililoendelea; hapa 'wakaanza kumuuliza' linafuata ushahidi wa matini na safu ya ushauri ya POB.
- source_word: λέγοντες
  choice: wakisema
  rationale: Inadumisha umbo la kitenzi tegemezi linalotambulisha maneno yanayofuata.
theological_decisions:
- issue: Msimamo wa Masadukayo kuhusu ἀνάστασις
  choice: hakuna ufufuo
  alternative: wafu hawafufuki
  rationale: Tafsiri ya nomino 'ufufuo' inafuata kwa karibu muundo wa chanzo na haiongezi ufafanuzi usiosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umetengenezwa kuwa wa asili huku ukihifadhi mfuatano wa simulizi na kishazi kinachowatambulisha Masadukayo.
