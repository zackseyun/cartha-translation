  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: sw
  text: Bado alikuwa na mmoja tu—mwana mpendwa[a]. Mwishowe akamtuma kwao[b], akisema, “Watamheshimu[c] mwanangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bado alikuwa na mmoja zaidi, mwana aliyempenda sana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Akamtuma kwao kama wa mwisho.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi hiki pia kinaweza kumaanisha “wataona aibu mbele ya” au “watamwonyesha staha”; hapa muktadha unaelekea kwenye “watamheshimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Bado alikuwa na mmoja tu
  rationale: Huwasilisha kwamba baada ya watumishi wengine kutumwa, alibaki na mtu mmoja wa kumtuma. Neno “tu” linafanya Kiswahili kiwe cha kawaida na kusisitiza kwamba huyo ndiye aliyebaki.
- source_word: υἱὸν ἀγαπητόν
  choice: mwana mpendwa
  rationale: Huhifadhi maana ya mwana anayependwa sana na mwangwi wake katika simulizi pana la Marko bila kuongeza ufafanuzi wa kiteolojia ndani ya andiko.
- source_word: ἀπέστειλεν
  choice: akamtuma
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja katika masimulizi; kiambishi cha yambwa “-m-” kinamrejelea mwana.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: Mwishowe akamtuma kwao
  rationale: “Mwishowe” huonyesha nafasi ya kilele ya mwana katika mfululizo wa waliotumwa, huku “kwao” ikitoa kwa kawaida mwelekeo wa kutumwa.
- source_word: λέγων ὅτι
  choice: akisema
  rationale: Hutanguliza maneno ya moja kwa moja kwa Kiswahili cha kawaida.
- source_word: Ἐντραπήσονται
  choice: Watamheshimu
  rationale: Katika muktadha huu kitenzi kina maana ya kuonyesha heshima au staha kwa mtu, ingawa pia kinaweza kuhusisha kuona aibu mbele yake.
- source_word: τὸν υἱόν μου
  choice: mwanangu
  rationale: Ni usemi wa kawaida wa umilikaji unaohifadhi kwa uwazi utambulisho wa aliyetumwa kuwa mwana wa mwenye shamba.
theological_decisions:
- issue: Mwangwi wa kikristolojia wa “mwana mpendwa”
  choice: Kudumisha “mwana mpendwa” bila kuupanua kwa maelezo ya kitafsiri
  alternative: mwana aliyempenda sana
  rationale: Maneno hayo yana mwangwi wa jinsi Marko anavyomtambulisha Yesu kuwa Mwana mpendwa, lakini tafsiri haipaswi kuingiza hitimisho hilo moja kwa moja ndani ya mfano.
- issue: Maana ya Ἐντραπήσονται
  choice: Watamheshimu
  alternative: Wataona aibu mbele ya
  rationale: Muktadha wa matarajio ya mwenye shamba unaelekea kwenye kuonyesha heshima au staha, lakini tanbihi inahifadhi maana nyingine halisi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa masimulizi ya kawaida; dashibodi ndefu inaweka wazi kwamba “mwana mpendwa” anamfafanua yule mmoja aliyebaki. Nukuu imetolewa kwa maneno ya moja kwa moja.
