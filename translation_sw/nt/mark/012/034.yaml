  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: sw
  text: Yesu alipoona kwamba alikuwa amejibu kwa busara, akamwambia, “Wewe hauko mbali na ufalme wa Mungu.” Baada ya hayo, hakuna mtu aliyethubutu tena kumwuliza swali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: alipoona
  rationale: Muundo huu wa wakati unaeleza kwa Kiswahili cha kawaida kwamba kauli ya Yesu ilifuata na kutegemea alichotambua katika jibu la mtu huyo.
- source_word: νουνεχῶς
  choice: kwa busara
  rationale: Kirai hiki kinaonyesha jibu lenye ufahamu na uamuzi mzuri, kwa lugha ya kawaida na yenye heshima.
- source_word: ἀπεκρίθη
  choice: alikuwa amejibu
  rationale: Wakati timilifu unaonyesha wazi kwamba jibu la mtu huyo lilitangulia maneno ya Yesu.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Wewe hauko mbali na
  rationale: Huhifadhi sitiari ya ukaribu iliyomo katika Kigiriki bila kudai kwamba mtu huyo tayari ameingia katika ufalme.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hili ndilo tamko la kawaida katika Kiswahili cha Biblia na linaweza kubeba wazo la utawala pamoja na eneo la ufalme.
- source_word: οὐκέτι
  choice: tena
  rationale: Katika muktadha wa 'baada ya hayo,' neno hili linaonyesha kuwa tangu hapo hawakuendelea kumwuliza.
- source_word: ἐτόλμα
  choice: aliyethubutu
  rationale: Huwasilisha moja kwa moja wazo la kuwa na ujasiri wa kufanya jambo lenye hatari au linalotisha.
- source_word: ἐπερωτῆσαι
  choice: kumwuliza swali
  rationale: Huhifadhi tendo la kumwelekezea Yesu swali; muktadha mpana unaweza kuonyesha kusudi la kumjaribu bila kulitia wazi zaidi kuliko Kigiriki.
theological_decisions:
- issue: Hali ya mwandishi kuhusiana na wokovu au ufalme
  choice: Wewe hauko mbali na ufalme wa Mungu
  alternative: Wewe uko karibu na ufalme wa Mungu
  rationale: Kigiriki kinaeleza ukaribu, si kuingia wala kumiliki ufalme. Tafsiri hii huhifadhi mvutano kati ya pongezi ya Yesu kwa ufahamu wake na kutokutangaza kwamba tayari yumo ndani ya ufalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Muundo 'alipoona ... akamwambia' ni wa asili katika simulizi la Kiswahili; 'hauko mbali na' huhifadhi sitiari na utata halisi wa matini.
