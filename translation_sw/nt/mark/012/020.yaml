base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: sw
  text: Kulikuwa na ndugu saba. Wa kwanza alimwoa mwanamke, naye alipokufa hakuacha uzao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu.” Neno la Kigiriki linalomaanisha “mbegu” limetumiwa hapa kwa maana ya uzao au wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Kulikuwa na ndugu saba
  rationale: Hutoa kwa Kiswahili cha kawaida muundo unaoeleza kuwapo kwa ndugu saba; muktadha unaonyesha wazi kwamba hawa ni ndugu wa kiume.
- source_word: ὁ πρῶτος
  choice: Wa kwanza
  rationale: Huhifadhi wazo la mpangilio bila kuongeza maana ya kwamba alikuwa mkubwa kwa umri.
- source_word: ἔλαβεν γυναῖκα
  choice: alimwoa mwanamke
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wazi nahau ya Kigiriki ya kuingia katika ndoa, bila kutumia muundo usio wa kawaida ‘alichukua mke.’
- source_word: ἀποθνῄσκων
  choice: alipokufa
  rationale: Kishiriki cha Kigiriki kina uhusiano wa wakati; kishazi hiki ni cha asili na wazi katika Kiswahili.
- source_word: οὐκ ἀφῆκεν
  choice: hakuacha
  rationale: Katika muktadha wa kifo, kitenzi kinamaanisha kutomwacha mtu au kitu nyuma.
- source_word: σπέρμα
  choice: uzao
  rationale: ‘Uzao’ hutoa maana ya kimuktadha ya watoto au wazao huku ikiendelea kuwa pana kuliko ‘mtoto’; maana halisi ya ‘mbegu’ imehifadhiwa katika tanbihi.
