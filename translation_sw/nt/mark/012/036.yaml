  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: sw
  text: Daudi mwenyewe alisema katika Roho Mtakatifu[a], “Bwana alimwambia Bwana wangu[b], ‘Keti upande wangu wa kulia mpaka nitakapowaweka adui zako chini ya miguu yako.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho Mtakatifu.”
    reason: alternative_reading
  - marker: b
    text: Nukuu hii inatoka Zaburi 110:1. Katika maandishi ya Kiebrania, “Bwana” wa kwanza anawakilisha jina la Mungu (YHWH, ambalo kwa kawaida hutafsiriwa “BWANA”), na wa pili anamrejelea bwana wa Daudi.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς
  choice: mwenyewe
  rationale: Matumizi haya ya kusisitiza yanamweka Daudi mwenyewe wazi kuwa msemaji, kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Hufuata kwa karibu kihusishi ἐν na kuhifadhi uwezekano wa kuelewa hali au njia ya kusema bila kuufafanua kupita kiasi.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος. Kurudia neno hilo mara mbili kunahifadhi muundo wa Kigiriki na hoja inayotegemea tofauti kati ya Bwana anayesema na Bwana wa Daudi.
- source_word: τῷ κυρίῳ μου
  choice: Bwana wangu
  rationale: Huhifadhi kurudiwa kwa κύριος na uhusiano unaoonyeshwa na ‘wangu,’ bila kubadili kuwa ‘bwana mkubwa’ au ‘mkuu.’
- source_word: Κάθου
  choice: Keti
  rationale: Ni amri ya moja kwa moja na ya asili katika Kiswahili, inayofaa katika muktadha wa kuketishwa mahali pa heshima.
- source_word: ἐκ δεξιῶν μου
  choice: upande wangu wa kulia
  rationale: Hii ndiyo namna ya asili ya kueleza nahau ya mahali ἐκ δεξιῶν katika Kiswahili.
- source_word: ἕως ἂν θῶ
  choice: mpaka nitakapowaweka
  rationale: Huonyesha kikomo cha wakati kinachotazamiwa na kitendo cha baadaye, huku kiambishi ‘-wa-’ kikirejelea adui walio katika wingi.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: chini ya miguu yako
  rationale: Hufuata maneno ya Marko kwa karibu na kuhifadhi picha ya kutiishwa bila kuongeza neno ‘kiti cha kuwekea miguu,’ ambalo halipo hapa katika Kigiriki.
theological_decisions:
- issue: Namna ya kutafsiri kauli kuhusu Daudi na Roho Mtakatifu
  choice: Daudi mwenyewe alisema katika Roho Mtakatifu
  alternative: Daudi mwenyewe alisema kwa Roho Mtakatifu
  rationale: ‘Katika’ huhifadhi kwa karibu ἐν na haibani maana iwe chombo au wakala pekee; tanbihi inatoa tafsiri mbadala ya kawaida.
- issue: Nguvu ya kikristo ya nukuu ya Zaburi 110:1
  choice: Bwana alimwambia Bwana wangu
  alternative: BWANA alimwambia Bwana wangu
  rationale: Andiko la Kigiriki linatumia κύριος katika sehemu zote mbili. Matini kuu huhifadhi urudiaji huo, huku tanbihi ikieleza kwamba neno la kwanza katika chanzo cha Kiebrania linawakilisha jina la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Katika Roho Mtakatifu’ imehifadhiwa licha ya kuwa rasmi kidogo ili kutobana maana ya Kigiriki, na mbadala wa kawaida umewekwa katika tanbihi.
