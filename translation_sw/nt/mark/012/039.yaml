  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: sw
  text: na viti vya heshima katika masinagogi, na nafasi za heshima kwenye karamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viti vya mbele katika masinagogi, na nafasi kuu kwenye karamu.” Katika desturi ya kale, nafasi za karamu zilikuwa mahali pa kuegemea wakati wa kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: viti vya heshima
  rationale: Neno hili humaanisha viti vyenye hadhi au cheo cha juu katika kusanyiko. Kiswahili hiki ni cha kawaida na kinaonyesha wazi kwamba kinachosisitizwa ni heshima, si ubora wa kimwili wa viti.
- source_word: συναγωγαῖς
  choice: masinagogi
  rationale: Katika muktadha huu neno linarejelea majengo au mahali pa mikutano ya Wayahudi; “masinagogi” ni istilahi sahihi na inayotambulika katika Kiswahili.
- source_word: πρωτοκλισίας
  choice: nafasi za heshima
  rationale: Neno linarejelea nafasi za juu zaidi katika mpangilio wa chakula, hasa mahali pa kuegemea katika desturi ya kale. “Nafasi za heshima” huwasilisha hadhi ya kijamii kwa wasomaji wa leo bila kuingiza picha isiyo ya kawaida ya viti au makochi.
- source_word: δείπνοις
  choice: karamu
  rationale: Ingawa neno linaweza kumaanisha milo ya jioni au milo mikuu, hapa mazingira ya hadhi ya hadharani yanafanya “karamu” kuwa tafsiri ya asili na inayofaa.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Viunganishi vilivyorudiwa vimehifadhiwa ili kuendeleza mfuatano wa mambo wanayoyapenda.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: katika masinagogi ... kwenye karamu
  rationale: 'Kihusishi kimetafsiriwa kwa namna ya kawaida ya Kiswahili kulingana na mazingira: “katika” kwa mahali na “kwenye” kwa tukio la kijamii.'
