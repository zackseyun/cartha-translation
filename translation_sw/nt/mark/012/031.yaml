  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: sw
  text: 'Ya pili ni hii: ‘Mpende jirani yako kama nafsi yako.’ Hakuna amri nyingine iliyo kuu kuliko hizi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “hizi” linarejelea amri mbili zilizotajwa katika muktadha kwa pamoja.
    reason: ufafanuzi wa kirejeleo
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Ya pili ni hii
  rationale: Kirai cha Kigiriki kimeacha nomino ‘amri’ kwa kuwa inaeleweka kutokana na muktadha. Kiswahili ‘Ya pili ni hii’ ni cha asili, kinadumisha msisitizo wa ‘ya pili,’ na kinaunganisha kauli hii na amri ya kwanza iliyotangulia.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Wakati ujao wa Kigiriki katika nukuu hii ya Maandiko una nguvu ya amri. Katika Kiswahili, hali ya kuamuru ‘Mpende’ huwasilisha kwa uwazi wajibu huo bila kuongeza maneno yasiyokuwamo.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: ‘Jirani yako’ ni tafsiri ya kawaida na sahihi katika muktadha huu wa kimaadili na huhifadhi uhusiano wa moja kwa moja na Mambo ya Walawi 19:18.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kigiriki kinasema kwa ufupi ‘kama wewe mwenyewe.’ Kiswahili huhitaji mara nyingi kitenzi kilichoeleweka ili ulinganisho uwe wa asili na usichukuliwe kuwa amri ya kumpenda jirani kana kwamba ndiye nafsi yako. ‘Mwenyewe’ hudumisha msisitizo wa kiwakilishi.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Hakuna amri nyingine iliyo kuu kuliko hizi
  rationale: Tafsiri hii inadumisha ulinganisho wa μείζων, umoja wa ‘amri nyingine,’ na wingi wa τούτων (‘hizi’), huku ikiwa Kiswahili cha kawaida.
- source_word: ἐντολή
  choice: amri
  rationale: ‘Amri’ ndilo neno la kawaida la kibiblia na la heshima kwa ἐντολή katika muktadha wa maagizo ya Torati.
theological_decisions:
- issue: Kirejeleo cha τούτων (‘hizi’) katika kishazi cha mwisho
  choice: Kudumisha wingi unaorejelea amri mbili kwa pamoja
  alternative: Kukifanya kirejelee amri ya pili pekee kwa maana ya jumla
  rationale: Kiwakilishi cha wingi katika Kigiriki kwa kawaida hurejelea amri mbili zilizotajwa katika muktadha. ‘Kuliko hizi’ hudumisha wingi huo bila kuubadili kuwa wazo la umoja au kueleza zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. ‘Ya pili ni hii’ ni fupi na ya asili; ‘Mpende’ huonyesha nguvu ya amri. Tanbihi inadumisha ufafanuzi wa kirejeleo cha wingi, ingawa matini kuu tayari inafuata kwa karibu Kigiriki.
