  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: sw
  text: Wa pili akamwoa[a], akafa bila kuacha uzao; na wa tatu vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “akamchukua”; hapa maana yake ni kwamba alimwoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: wa pili
  rationale: Kivumishi cha nambari chenye kibainishi kimetumika kama nomino. “Wa pili” ni ya asili katika Kiswahili na haisemi wazi “ndugu,” ambalo linaeleweka kutokana na muktadha lakini halipo katika kishazi hiki.
- source_word: ἔλαβεν αὐτήν
  choice: akamwoa
  rationale: Ingawa maana ya msingi ya λαμβάνω ni “kuchukua/kupokea,” katika muktadha huu wa ndoa ya ndugu wa marehemu, usemi huo humaanisha kumchukua mwanamke kuwa mke. “Akamwoa” huwasilisha maana hiyo kwa Kiswahili cha kawaida; tafsiri halisi “akamchukua” ingeweza kueleweka vibaya.
- source_word: ἀπέθανεν
  choice: akafa
  rationale: Kitenzi kimewasilishwa moja kwa moja kwa mtindo rahisi wa masimulizi, bila kutumia tamathali ya kupunguza ukali.
- source_word: μὴ καταλιπὼν
  choice: bila kuacha
  rationale: Kirai hiki cha hali huonyesha kwamba alikufa pasipo kuacha uzao; “bila kuacha” ni cha asili na huhifadhi uhusiano huo.
- source_word: σπέρμα
  choice: uzao
  rationale: Katika muktadha wa ndoa ya ndugu wa marehemu, neno hili linamaanisha watoto au kizazi, si mbegu halisi. “Uzao” huhifadhi maana ya pamoja bila kuibana kuwa mtoto mmoja.
- source_word: ὁ τρίτος ὡσαύτως
  choice: na wa tatu vivyo hivyo
  rationale: Tafsiri hii huhifadhi ufupi na udondoshaji wa maneno wa Kigiriki; matendo yanayorudiwa yanaeleweka kutokana na kishazi kilichotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia mfululizo wa viambishi vya -ka-. “Akamwoa” ni wazi zaidi kwa msomaji wa kawaida kuliko “akamchukua,” huku tanbihi ikihifadhi maana ya msingi ya neno la Kigiriki.
