id: MRK.12.26
reference: Mark 12:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: sw
  text: Na kuhusu wafu, kwamba wanafufuliwa, je, hamjasoma katika kitabu cha Musa, katika sehemu inayohusu kichaka[a], jinsi Mungu alivyomwambia, ‘Mimi ni Mungu wa Abrahamu na Mungu wa Isaka na Mungu wa Yakobo’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kichaka”; usemi wa Kigiriki unaweza kutaja sehemu ya Maandiko kwa kuitambulisha kwa tukio la kichaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Lakini kuhusu wafu
  rationale: περὶ pamoja na hali ya umilikishi huanzisha mada inayozungumziwa; δέ imetafsiriwa kwa kiunganishi chepesi “Lakini,” kinachoendeleza hoja huku kikionyesha badiliko la mkazo.
- source_word: ὅτι ἐγείρονται
  choice: kwamba wanafufuliwa
  rationale: Kitenzi hiki kina umbo la kauli tendwa na hapa kinahusu ufufuo wa wafu. “Wanafufuliwa” huhifadhi maana hiyo bila kutaja wazi mtendaji ambaye Kigiriki hakumtaji katika kishazi hiki.
- source_word: οὐκ ἀνέγνωτε
  choice: je, hamjasoma
  rationale: Hili ni swali la balagha linalowakumbusha wasikilizaji maandiko wanayopaswa kuyajua; wakati timilifu wa Kiswahili unasikika kwa kawaida katika muktadha huu.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: katika kitabu cha Musa
  rationale: βίβλος inaweza kumaanisha kitabu au hati-kunjo; “kitabu cha Musa” ni wazi na cha kawaida kwa wasomaji wa sasa.
- source_word: ἐπὶ τοῦ βάτου
  choice: katika habari ya kichaka
  rationale: Usemi huu unaweza kutambulisha sehemu ya Maandiko kwa kurejelea tukio la kichaka. “Katika habari ya kichaka” huwasilisha kazi hiyo ya kutaja kifungu kwa njia ya kawaida.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: jinsi Mungu alivyomwambia
  rationale: πῶς huanzisha namna au yaliyomo katika kauli iliyofuata. Katika Kiswahili, “alivyomwambia” huingiza nukuu moja kwa moja kwa ufasaha; maana ya λέγων imo katika muundo huo wa kunukuu.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Mimi ni Mungu wa Abrahamu, na Mungu wa Isaka, na Mungu wa Yakobo
  rationale: “Mimi ni” huhifadhi utambulisho wa wakati wa sasa, nao urudiaji wa “Mungu wa” na “na” huhifadhi mkazo na mwendo wa nukuu ya Kigiriki.
theological_decisions:
- issue: Lugha ya ufufuo katika ὅτι ἐγείρονται
  choice: kwamba wanafufuliwa
  alternative: kwamba wanafufuka
  rationale: “Wanafufuliwa” huhifadhi umbo la kauli tendwa na uwezekano wa ufufuo kutendwa na Mungu, bila kuongeza jina la mtendaji ambalo halipo wazi katika kishazi.
- issue: Wakati wa sasa katika utambulisho wa Mungu
  choice: Mimi ni Mungu wa Abrahamu, na Mungu wa Isaka, na Mungu wa Yakobo
  alternative: Mimi ndiye Mungu wa Abrahamu, Isaka na Yakobo
  rationale: Tafsiri iliyochaguliwa huhifadhi “ni” ya wakati wa sasa na kurudia “Mungu wa” kwa sababu vipengele hivyo ni muhimu katika hoja ya Yesu na katika muundo wa nukuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na urudiaji wa nukuu umehifadhiwa bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa baada ya “kichaka,” ambako tofauti ya kileksia inahusika.
