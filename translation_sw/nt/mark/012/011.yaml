  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: sw
  text: Jambo hili limetoka kwa Bwana[a][b], nalo ni la ajabu machoni petu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “limefanywa na Bwana.” Maneno ya Kigiriki yanaweza kuonyesha chanzo au mtendaji.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu unanukuu Zaburi 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: limetoka kwa Bwana
  rationale: παρά pamoja na hali ya umilikishi huonyesha hasa chanzo au asili. “Limetoka kwa Bwana” ni Kiswahili cha kawaida kinachohifadhi maana hiyo, ingawa kauli inaweza pia kueleweka kuwa Bwana ndiye aliyetenda jambo hilo.
- source_word: κυρίου
  choice: Bwana
  rationale: κύριος hapa humrejelea Mungu katika nukuu ya Zaburi 118:23. “Bwana” hufuata matumizi ya kawaida ya Agano Jipya bila kuingiza moja kwa moja namna ya kuandika jina la Mungu katika Kiebrania.
- source_word: ἐγένετο
  choice: limetoka
  rationale: Katika muundo παρὰ κυρίου ἐγένετο, kitenzi kinaeleza jambo lililotokea au kuwa na asili yake kwa Bwana. “Limetoka” huunganisha kwa ufasaha wazo la kutokea na la chanzo.
- source_word: αὕτη
  choice: Jambo hili
  rationale: Kiwakilishi hiki cha kike hurejelea yaliyotajwa katika mstari uliotangulia, yaani jiwe lililokataliwa kuwa jiwe kuu la pembeni. “Jambo hili” huacha rejeleo hilo likiwa pana badala ya kuongeza neno “jiwe” ambalo halipo katika kishazi hiki.
- source_word: θαυμαστὴ
  choice: la ajabu
  rationale: θαυμαστός humaanisha chenye kustaajabisha au cha kushangaza. “La ajabu” ni usemi wa heshima, wa asili, na unaoeleweka kwa urahisi katika Kiswahili.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: machoni petu
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kigiriki na Kisemiti, huku ikiwa usemi wa kawaida wa Kiswahili unaomaanisha “kwa mtazamo wetu” au “kwetu sisi.”
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Zaburi inayomrejelea Mungu
  choice: Bwana
  alternative: BWANA
  rationale: Ingawa Zaburi ya Kiebrania iliyo nyuma ya nukuu hii ina jina la Mungu, maandishi ya Kigiriki ya Marko yana κυρίου. “Bwana” hutafsiri maandishi ya Agano Jipya yaliyopo bila kuhamisha moja kwa moja umbo la jina la Mungu kutoka Kiebrania.
- issue: Chanzo au mtendaji katika παρὰ κυρίου ἐγένετο
  choice: limetoka kwa Bwana
  alternative: limefanywa na Bwana
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo kwa uwazi, lakini katika muktadha huu pia inaweza kudokeza utendaji wa Mungu. Tafsiri kuu inatanguliza maana ya chanzo, huku tanbihi ikihifadhi uwezekano wa kutafsiri utendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Machoni petu” huhifadhi taswira ya maandishi ya chanzo. Alama ya kuuliza imehifadhiwa kwa sababu nukuu hii ni sehemu ya swali lililoanza katika Marko 12:10.
