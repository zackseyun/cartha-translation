base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: sw
  text: Yesu akawaambia[a], “Je, si kwa sababu hii mmekosea—kwa kuwa hamjui Maandiko wala nguvu za Mungu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, si kwa sababu hii mnapotea, kwa kuwa hamjui Maandiko wala nguvu za Mungu?”
    reason: Tofauti hii huhifadhi maana nyingine inayowezekana ya πλανᾶσθε, yaani kupotea au kwenda njia isiyo sahihi, badala ya kuwa tu katika kosa.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawaambia
  rationale: φημί hapa hutambulisha usemi wa moja kwa moja kwa maana ya kawaida ya ‘kusema.’ ‘Akawaambia’ ni simulizi la kawaida na la asili katika Kiswahili bila kuongeza wazo la ‘kujibu’ ambalo halijaelezwa wazi katika kitenzi.
- source_word: Οὐ διὰ τοῦτο
  choice: Je, si kwa sababu hii
  rationale: Muundo huu ni swali la balagha linalotarajia kukubaliwa na unaonyesha sababu. Tafsiri hii inahifadhi nguvu ya swali pamoja na uhusiano wa kisababishi.
- source_word: πλανᾶσθε
  choice: mmekosea
  rationale: Kitenzi kinaweza kumaanisha kuwa katika kosa, kupotoshwa, au kupotea njia. Katika muktadha wa uelewa wao kuhusu ufufuo, ‘mmekosea’ ni ya asili na huhifadhi karipio bila kuamua kwamba walidanganywa na mtu mwingine.
- source_word: μὴ εἰδότες
  choice: kwa kuwa hamjui
  rationale: Kirai shirikishi kinaeleza msingi wa kosa lao. Kishazi cha sababu ni cha asili katika Kiswahili na kinaweka wazi uhusiano huo bila kubadili maana.
- source_word: τὰς γραφὰς
  choice: Maandiko
  rationale: Katika matumizi ya Kiyahudi na ya Kikristo ya awali, wingi wa γραφή hurejelea maandiko matakatifu yanayotambuliwa. ‘Maandiko’ ni istilahi iliyo wazi, ya kawaida, na yenye heshima katika Kiswahili.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: wala nguvu za Mungu
  rationale: ‘Wala’ huendeleza ukanushaji baada ya ‘hamjui,’ na ‘nguvu za Mungu’ ni usemi wa kawaida wa Kiswahili unaowakilisha vizuri τὴν δύναμιν τοῦ θεοῦ.
theological_decisions:
- issue: Aina ya kosa linaloelezwa na πλανᾶσθε
  choice: mmekosea
  alternative: mmepotoshwa; mnapotea
  rationale: Kigiriki kinaweza kuonyesha kuwa wamekosea au wamepotoshwa. Muktadha unahusu kutoelewa kwao ufufuo, Maandiko, na nguvu za Mungu. ‘Mmekosea’ huhifadhi karipio bila kuingiza dai kali zaidi la udanganyifu wa kiroho au chanzo cha nje.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Swali la balagha na uhusiano wa kisababishi vimehifadhiwa. Alama ya tanbihi [a] imewekwa katika maandishi makuu.
