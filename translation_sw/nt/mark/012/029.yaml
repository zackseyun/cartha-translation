  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: sw
  text: 'Yesu akajibu, “Ya kwanza ni: ‘Sikia, Ee Israeli, Bwana Mungu wetu[b], Bwana ni mmoja[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana Mungu wetu ni Bwana mmoja,” au, “Bwana ndiye Mungu wetu, Bwana peke yake.” Kigiriki kinaakisi Kumbukumbu la Torati 6:4, na huenda kikasisitiza umoja wa Mungu na/au kwamba yeye peke yake ndiye Bwana.
    reason: alternative_reading
  - marker: b
    text: Kwa kuwa mstari huu unanukuu Shema (Kumbukumbu la Torati 6:4), hapa “Bwana” linaakisi neno la Kigiriki κύριος, ambalo Septuajinti hulitumia badala ya jina la Mungu YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni simulizi la kawaida la Kiswahili katika mazungumzo; linaonyesha kwamba Yesu alitoa jibu kwa swali lililotangulia.
- source_word: Πρώτη
  choice: Ya kwanza
  rationale: Kivumishi hiki kimesimama badala ya nomino na kinarejelea amri iliyotajwa katika muktadha. “Ya kwanza” huacha muktadha utoe nomino hiyo bila kuiongeza waziwazi.
- source_word: Ἄκουε
  choice: Sikia
  rationale: Huu ni mwanzo wa nukuu ya Shema katika Kumbukumbu la Torati 6:4. “Sikia” hudumisha mwangwi wa agano na pia ni amri ya kawaida na inayoeleweka.
- source_word: Ἰσραήλ
  choice: Ee Israeli
  rationale: “Ee” huonyesha kwa kawaida na kwa heshima kwamba Israeli anaelekezewa maneno moja kwa moja.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa κύριος. Katika nukuu hii linaakisi matumizi ya κύριος katika Septuajinti badala ya jina la Mungu YHWH; jambo hilo linaelezwa katika tanbihi.
- source_word: θεὸς ἡμῶν
  choice: Mungu wetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji.
- source_word: εἷς
  choice: mmoja
  rationale: “Mmoja” hudumisha kauli ya Kigiriki bila kuamua kupita kiasi ikiwa mkazo ni umoja wa Mungu, upekee wake, au yote mawili.
theological_decisions:
- issue: Namna ya kutafsiri kishazi cha mwisho cha Shema bila kuondoa mvutano wake wa kitheolojia
  choice: Bwana Mungu wetu, Bwana ni mmoja
  alternative: Bwana Mungu wetu ni Bwana mmoja; au, Bwana ndiye Mungu wetu, Bwana peke yake
  rationale: Mpangilio wa Kigiriki unaakisi Septuajinti ya Kumbukumbu la Torati 6:4 na unaweza kueleweka kwa namna zaidi ya moja. Tafsiri iliyochaguliwa inafuata kwa karibu mpangilio wa Kigiriki na haifungi maana katika umoja pekee au upekee pekee; tafsiri nyingine zimehifadhiwa katika tanbihi.
- issue: κύριος katika nukuu ya Shema
  choice: Bwana
  alternative: BWANA
  rationale: “Bwana” hudumisha matumizi ya neno la Agano Jipya, huku tanbihi ikifafanua kwamba hapa Septuajinti hutumia κύριος kuwakilisha jina la Mungu YHWH.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee Israeli” hudumisha mwito wa moja kwa moja wa kauli ya Shema. Alama za tanbihi zimewekwa karibu na maneno yanayohusika.
