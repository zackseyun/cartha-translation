  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: sw
  text: Wale saba hawakuacha uzao[a]. Hatimaye, baada ya wote hao, yule mwanamke pia akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hawakuacha mbegu,” yaani hawakuacha mtoto au uzao.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: wote saba
  rationale: Kirai hiki kinawarejelea wale ndugu saba waliotajwa katika muktadha. “Wote saba” ni wazi na cha kawaida katika Kiswahili.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: hawakuacha uzao
  rationale: Ingawa σπέρμα kihalisi ni “mbegu,” hapa ni nahau inayomaanisha mtoto au kizazi kinachoendelea. “Uzao” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi taswira ya asili.
- source_word: ἔσχατον πάντων
  choice: Mwishowe, baada yao wote
  rationale: Tafsiri hii inaonyesha kwamba kifo cha mwanamke kilitokea mwisho katika mfuatano, baada ya wale saba wote.
- source_word: καὶ ἡ γυνὴ
  choice: yule mwanamke pia
  rationale: “Yule mwanamke” humrejelea mwanamke anayejulikana katika simulizi, na “pia” huhifadhi nguvu ya nyongeza ya καί.
- source_word: ἀπέθανεν
  choice: akafa
  rationale: Kitenzi hiki kinatafsiri moja kwa moja tendo la kufa bila kulainisha usemi wa Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa sentensi unahifadhi mfuatano wa simulizi na maana ya nahau ya Kigiriki bila kuwa mgumu.
