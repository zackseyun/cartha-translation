  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: sw
  text: Kisha akamtuma mwingine; huyo pia wakamuua. Kisha akatuma wengine wengi—baadhi yao waliwapiga, na wengine waliwaua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: mwingine
  rationale: Katika mfululizo huu neno hili linamtaja mtumishi mwingine aliyetumwa na mwenye shamba; “mwingine” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: ἀπέστειλεν
  choice: akamtuma
  rationale: Kitenzi hiki kinasimulia kwa urahisi tendo lililofuata la kumtuma mtumishi; kiambishi cha yambwa “-m-” kinaeleweka kutokana na muktadha.
- source_word: κἀκεῖνον
  choice: huyo pia
  rationale: Muungano wa καί na ἐκεῖνον una maana ya nyongeza pamoja na msisitizo wa kiwakilishi; “huyo pia” huhifadhi vipengele vyote viwili.
- source_word: ἀπέκτειναν
  choice: wakamuua
  rationale: ἀποκτείνω humaanisha kuua; umbo hili la Kiswahili ni la kawaida na hudumisha ukali wa tendo.
- source_word: πολλοὺς ἄλλους
  choice: wengine wengi
  rationale: Kirai hiki kinarejelea watumishi wengi zaidi baada ya yule aliyetajwa; “wengine wengi” ni cha asili katika Kiswahili.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: baadhi yao ... na wengine
  rationale: Muundo huu hugawa watu hao katika makundi mawili kulingana na walivyotendewa; usemi huu ni wazi na wa kawaida.
- source_word: δέροντες
  choice: waliwapiga
  rationale: δέρω hapa ni kupiga au kuchapa; “waliwapiga” haiongezi wazo lisilo lazima la adhabu rasmi ya viboko.
- source_word: ἀποκτέννοντες
  choice: waliwaua
  rationale: Ingawa ni participio ya wakati wa sasa katika Kigiriki, hapa inatoa muhtasari wa matendo yaliyofanyiwa watumishi mbalimbali; kitenzi kamili cha Kiswahili huwasilisha maana hiyo kwa ufasaha.
theological_decisions:
- issue: Uwasilishaji wa muhtasari wenye participio
  choice: 'Kutumia vitenzi kamili: “baadhi yao waliwapiga, na wengine waliwaua.”'
  alternative: “huku wakiwapiga baadhi na kuwaua wengine”
  rationale: Hili ni suala la sintaksia, si la mafundisho. Vitenzi kamili vinaonyesha kwa uwazi mgawanyo wa matendo yaliyofanyiwa watumishi wengi huku vikihifadhi maana ya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha” huendeleza simulizi kwa ufasaha; “huyo pia” huhifadhi nguvu ya nyongeza ya κἀκεῖνον. Hakuna tanbihi inayohitajika, kwa kuwa tofauti ya muundo wa participio imewasilishwa kikamilifu katika maandishi.
