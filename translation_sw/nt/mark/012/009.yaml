  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: sw
  text: Mwenye shamba la mizabibu atafanya nini? Atakuja, atawaangamiza wakulima wapangaji[a], na atawapa wengine shamba hilo la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakulima”; katika mfano huu ni wakulima wanaopangisha na kulima shamba la mtu mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: atafanya nini?
  rationale: Hutoa swali la balagha kwa Kiswahili cha kawaida bila kuongeza kiunganishi kisichomo katika Kigiriki.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: mwenye shamba la mizabibu
  rationale: Katika ulimwengu wa mfano, κύριος humaanisha mmiliki wa shamba; “mwenye” ni ya asili na huepuka kuingiza cheo cha kitheolojia katika usemi huu.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hii ndiyo istilahi ya kawaida na inayoeleweka kwa ἀμπελών katika Kiswahili cha Afrika Mashariki.
- source_word: ἐλεύσεται
  choice: atakuja
  rationale: Huhifadhi wakati ujao na picha ya kuja kwa mwenye shamba kuingilia kati.
- source_word: ἀπολέσει
  choice: kuwaangamiza
  rationale: Huonyesha hukumu kali na ya mwisho bila kuibana kitenzi kwenye maana ya “kuwaua” pekee.
- source_word: τοὺς γεωργούς
  choice: wakulima wapangaji
  rationale: Huunganisha kazi yao ya kulima na hadhi yao ya kutumia shamba la mwingine kwa upangaji.
- source_word: δώσει
  choice: atawapa
  rationale: Ni ulinganifu wa moja kwa moja wa δίδωμι na hauongezi wazo maalumu zaidi la kukodisha au kukabidhi dhamana.
- source_word: ἄλλοις
  choice: wengine
  rationale: Hudumisha uwazi wa rejeleo kama ilivyo katika Kigiriki, bila kuongeza “wakulima” au “wapangaji.”
theological_decisions:
- issue: Tafsiri ya κύριος inapomtaja mhusika asiye wa kimungu ndani ya mfano
  choice: mwenye shamba la mizabibu
  alternative: bwana wa shamba la mizabibu
  rationale: Rejeleo la moja kwa moja ni mmiliki wa shamba katika hadithi. “Mwenye” huwasilisha umiliki bila kulazimisha cheo cha kimungu, huku maana pana ya kitheolojia ya mfano ikiachwa itokane na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwenye shamba la mizabibu” na “wakulima wapangaji” ni wazi kwa wasomaji wa kawaida; “kuwaangamiza” huhifadhi uzito wa hukumu katika mfano.
