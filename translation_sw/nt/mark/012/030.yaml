base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: sw
  text: Nawe utampenda Bwana Mungu wako kwa moyo wako wote, na kwa nafsi yako yote, na kwa akili yako yote, na kwa nguvu zako zote.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uhai wako wote” badala ya “kwa nafsi yako yote” (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ufahamu wako wote” badala ya “kwa akili yako yote” (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Au “kwa uwezo wako wote” badala ya “kwa nguvu zako zote” (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: utampenda
  rationale: Kauli ya wakati ujao katika nukuu hii ina nguvu ya amri. Muundo wa Kiswahili “utampenda” unahifadhi namna ya usemi wa Maandiko na bado unasikika kwa kawaida.
- source_word: κύριον τὸν θεόν σου
  choice: Bwana Mungu wako
  rationale: Huu ni usemi wa kawaida na wenye heshima kwa kauli ya agano “Bwana Mungu wako”; “Bwana” linaakisi κύριον bila kuingiza desturi ya herufi kubwa ndogo isiyo katika maandishi ya Kigiriki.
- source_word: ἐξ
  choice: kwa
  rationale: Katika muktadha wa viungo au uwezo wa mtu, “kwa” ni Kiswahili cha kawaida kinachoonyesha kumpenda Mungu kwa utu wote, badala ya tafsiri halisi isiyo ya kawaida ya “kutoka katika.”
- source_word: ὅλης
  choice: yote / zote
  rationale: Marudio ya maneno haya yanahifadhi msisitizo wa ukamilifu katika kila kifungu, kwa upatanisho wa kisarufi wa nomino husika.
- source_word: καρδίας
  choice: moyo
  rationale: “Moyo” ni tafsiri iliyozoeleka na sahihi ya kitovu cha ndani cha nia na hisia, bila kuongeza ufafanuzi katika matini.
- source_word: ψυχῆς
  choice: nafsi
  rationale: ψυχή inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi” inadumisha utofauti wa msamiati katika orodha hii, huku “uhai” ikitajwa katika tanbihi kama uwezekano.
- source_word: διανοίας
  choice: akili
  rationale: “Akili” huwasilisha uwezo wa kufikiri na kuelewa kwa Kiswahili cha kawaida, na huitofautisha na moyo.
- source_word: ἰσχύος
  choice: nguvu
  rationale: “Nguvu” ni tafsiri ya kawaida na pana ya ἰσχύς katika muktadha huu; “uwezo wote” ni njia mbadala inayoweza kueleza wazo la nguvu au uwezo wa mtu.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: na ... na ... na ... na
  rationale: Marudio ya “na” yanadumisha muundo wa kulimbikiza na kusisitiza uliopo katika Kigiriki.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya amri
  choice: Bwana
  alternative: BWANA; Mkuu
  rationale: Matini ya Kigiriki ina κύριος. “Bwana” inalingana na matumizi ya Agano Jipya na mwangwi wa usemi wa agano bila kuingiza kwa lazima desturi ya uchapaji ya jina la Mungu.
- issue: Istilahi nne zinazohusu utu wa mwanadamu
  choice: moyo / nafsi / akili / nguvu
  alternative: moyo / uhai / ufahamu / uwezo
  rationale: Istilahi tofauti zimedumishwa badala ya kuzifupisha kuwa kauli ya jumla kuhusu kumpenda Mungu kikamilifu. Hivyo mvutano wa kimaana na muundo wa mambo manne unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa marudio umehifadhiwa kwa msisitizo, na alama zote za tanbihi zimewekwa katika matini kuu.
