  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Mpeni[a] Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.” Nao walishangazwa sana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mrudishieni Kaisari yaliyo ya Kaisari.” Kitenzi kinaweza kumaanisha kumpa mtu kile kilicho chake au anachostahili, kurudisha, au kulipa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Mpeni
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa, kurudisha, kulipa, au kumpa mtu kile kinachomstahili. “Mpeni” ni cha kawaida na hakifungi maana kwenye ulipaji wa kodi pekee; tanbihi inaonyesha nguvu ya kurudisha au kutoa kilicho haki ya mwingine.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: Kaisari yaliyo ya Kaisari
  rationale: Muundo huu unaonyesha vitu au mambo yanayomilikiwa na Kaisari na unadumisha urudiaji wa makusudi wa jina lake.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: Mungu yaliyo ya Mungu
  rationale: Tafsiri hii inadumisha ulinganifu wa moja kwa moja na kishazi kinachomhusu Kaisari bila kufafanua zaidi ni mambo gani yanayokusudiwa.
- source_word: ἐξεθαύμαζον
  choice: walishangazwa sana
  rationale: Kitenzi cha Kigiriki kinaonyesha mshangao mkubwa. “Walishangazwa sana” ni Kiswahili cha asili kinachobeba uzito huo.
- source_word: ἐπ’ αὐτῷ
  choice: naye
  rationale: Katika muktadha wa mshangao, kirai hiki kinaweza kuonyesha mtu aliye kitu au sababu ya mshangao. “Naye” kinamwelekeza Yesu moja kwa moja huku kikiacha sababu mahsusi ikiwa wazi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautishaji mdogo katika majibizano.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni usemi wa kawaida na wenye hadhi wa kutambulisha jibu alilowaambia watu hao.
theological_decisions:
- issue: Uhusiano kati ya wajibu kwa mamlaka ya kiraia na wajibu kwa Mungu
  choice: Kudumisha vishazi viwili sambamba bila kuingiza nadharia kamili ya uhusiano wa serikali na dini
  alternative: Kutafsiri kauli hiyo kuwa ama uungaji mkono mpana wa mamlaka ya kiraia ama upunguzaji wa madai ya Kaisari
  rationale: Mstari unatambua yaliyo ya Kaisari na yaliyo ya Mungu, lakini haufafanui mipaka yake wala kutoa mfumo kamili wa kisiasa. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa “Kaisari yaliyo ya Kaisari” na “Mungu yaliyo ya Mungu” umehifadhiwa; lugha haijawekewa msimamo wa dhehebu kuhusu serikali na Mungu.
