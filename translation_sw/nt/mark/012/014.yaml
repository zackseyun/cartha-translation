  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: sw
  text: Nao wakaja wakamwambia, “Mwalimu, tunajua kwamba wewe ni mkweli, wala hushawishiki na mtu yeyote, kwa maana hutazami sura ya watu[a]; bali unafundisha njia ya Mungu kwa kweli. Je, inaruhusiwa kumlipa Kaisari kodi ya kichwa au la? Tuilipe[b], au tusiilipe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii ni nahau ya Kigiriki inayoweza kutafsiriwa, “hupendelei watu” au “hushawishwi na hadhi au mwonekano wa watu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiyunani κῆνσος linamaanisha kodi ya Kirumi iliyotozwa kwa kila mtu, yaani kodi ya kichwa.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni neno la kawaida na lenye heshima kwa mtu anayefundisha, na linafaa kwa matumizi ya Injili.
- source_word: ἀληθὴς
  choice: mkweli
  rationale: Humweleza Yesu kama mtu asemaye yaliyo kweli; ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: hujali cheo cha mtu yeyote
  rationale: Katika muktadha, usemi unaonyesha kwamba Yesu hashawishiki na hadhi au ushawishi wa watu. Kutaja cheo kunafanya maana hiyo ieleweke bila kudokeza kwamba hawajali watu kwa ujumla.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: hutazami sura ya watu
  rationale: Inahifadhi taswira halisi ya Kigiriki; tanbihi inaeleza maana ya nahau, yaani kutopendelea au kutoshawishiwa na hadhi na mwonekano.
- source_word: ἐπ’ ἀληθείας
  choice: kwa kweli
  rationale: Ni kirai cha kawaida kinachorekebisha kitendo cha kufundisha na kuhifadhi msisitizo wa ukweli.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: njia ya Mungu
  rationale: Inahifadhi usemi wa kibiblia unaoweza kumaanisha mwongozo, mapenzi, au mwenendo unaotokana na Mungu.
- source_word: ἔξεστιν
  choice: inaruhusiwa
  rationale: Huonyesha swali la uhalali au ruhusa bila kulazimisha kwamba sheria inayokusudiwa ni ya Kirumi pekee au ya kidini pekee.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: kumlipa Kaisari kodi ya kichwa
  rationale: Kitenzi 'kulipa' ni cha asili kwa kodi, na κῆνσος hapa ni kodi ya Kirumi iliyotozwa kwa mtu.
- source_word: Καίσαρι
  choice: Kaisari
  rationale: Ni umbo la kawaida la Kiswahili la jina au cheo cha mtawala wa Roma.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Tuilipe, au tusiilipe?
  rationale: Inahifadhi urudiaji na ukali wa swali la mtego, huku kiwakilishi kikirejelea kodi iliyotajwa.
theological_decisions:
- issue: Maana ya usemi kuhusu kutazama sura za watu
  choice: Taswira ya 'hutazami sura ya watu' imehifadhiwa katika matini, huku 'hujali cheo cha mtu yeyote' ikifafanua mwelekeo wa nahau.
  alternative: hupendelei watu / hushawishwi na mwonekano wa watu
  rationale: Hii huhifadhi taswira ya chanzo na wakati huohuo huepuka maana potofu kwamba Yesu hawajali watu. Hakuna msimamo wa dhehebu unaoingizwa.
- issue: Aina ya uhalali katika ἔξεστιν
  choice: inaruhusiwa
  alternative: ni halali
  rationale: Swali linaweza kugusa sheria, maadili, na wajibu kwa Mungu; 'inaruhusiwa' huhifadhi upana huo bila kuamua mapema mfumo mmoja wa sheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali na marudio yake umehifadhiwa; nahau ya Kigiriki imeachwa ionekane lakini imewekewa ufafanuzi ili isieleweke kuwa Yesu hawajali watu.
