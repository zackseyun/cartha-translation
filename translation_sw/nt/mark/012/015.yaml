id: MRK.12.15
reference: Mark 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: sw
  text: Lakini akijua unafiki wao, akawaambia, “Kwa nini mnanijaribu[b]? Nileteeni dinari[a] niione.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa sarafu ya fedha ya Roma iliyotumiwa kwa kawaida kama malipo ya kazi ya siku moja.
    reason: cultural_note
  - marker: b
    text: Au “mnanishawishi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Kitenzi kishirikishi kinaonyesha kwamba Yesu alikuwa anajua hali yao; “akijua” ni ya kawaida na huhifadhi maana ya utambuzi bila kuongeza ufafanuzi.
- source_word: ὑπόκρισιν
  choice: unafiki
  rationale: “Unafiki” huonyesha kujifanya kwao kuwa waaminifu huku wakikusudia kumtega, na hudumisha uzito wa kimaadili wa neno la Kigiriki.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu Τί hutumika kuuliza sababu, kwa hiyo “Kwa nini” ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja “Nini?”
- source_word: πειράζετε
  choice: mnanijaribu
  rationale: “Mnanijaribu” huhifadhi maana pana ya kumtia mtu katika jaribio; katika muktadha huu jaribio hilo lina nia ya uhasama.
- source_word: φέρετέ μοι
  choice: Nileteeni
  rationale: Amri hii inawataka wamletee Yesu kitu; umbo “Nileteeni” ni fupi, wazi, na la asili katika Kiswahili.
- source_word: δηνάριον
  choice: dinari
  rationale: Jina la sarafu limehifadhiwa ili kutunza umahususi wa kihistoria, huku tanbihi ikieleza thamani na matumizi yake.
- source_word: ἵνα ἴδω
  choice: niione
  rationale: “Niione” huwasilisha kwa ufupi kusudi la kuletwa kwa sarafu; kiambishi cha yambwa -i- humrejelea dinari.
theological_decisions:
- issue: Maana ya πειράζετε katika shtaka la Yesu
  choice: mnanijaribu
  alternative: mnanishawishi
  rationale: Muktadha unaonyesha jaribio la uhasama la kumnasa Yesu, lakini neno lenyewe linaweza pia kutafsiriwa kwa maana ya kumshawishi. “Mnanijaribu” huhifadhi upana huo bila kuingiza wazo mahsusi zaidi la kushawishi kutenda dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “akijua … akawaambia” ni wa kawaida na hudumisha uhusiano wa kishirikishi wa Kigiriki. Alama za tanbihi zimeambatishwa na maneno yanayohusika; kwa hiyo [b] hutokea kabla ya [a] katika mstari.
