  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: sw
  text: Akawaita wanafunzi wake kwake, akawaambia, “Kweli nawaambia, mjane huyu maskini ametia zaidi kuliko wote waliokuwa wakitia katika hazina[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kisanduku cha matoleo” au “hazina ya hekalu.” Neno la Kiyunani linaweza kurejelea hazina ya hekalu au chombo/mahali pa kupokelea matoleo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Akawaita ... waje kwake
  rationale: Kitenzi hiki cha kati kinaonyesha kwamba Yesu aliwaita wanafunzi wamkaribie; muundo huu pia unaweka kitendo hicho kabla ya kusema kwake bila kulazimisha kiunganishi cha ziada.
- source_word: μαθητὰς
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa watu waliomfuata Yesu na kujifunza kwake.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Linawasilisha uzito wa tamko la Yesu kwa Kiswahili cha sasa na chenye hadhi.
- source_word: χήρα
  choice: mjane
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la Kiyunani.
- source_word: πτωχὴ
  choice: maskini
  rationale: Linahifadhi maana ya msingi bila kuzidisha kiwango cha umaskini kuliko inavyosema aya.
- source_word: πλεῖον πάντων
  choice: zaidi kuliko watu wote
  rationale: Linahifadhi ulinganisho mpana wa Kiyunani bila kueleza ndani ya tafsiri kama uzito wake ni wa thamani ya kiroho au kiasi cha fedha.
- source_word: ἔβαλεν
  choice: ametia
  rationale: Katika muktadha wa chombo cha kutolea fedha, ‘kutia’ ni usemi wa kawaida; wakati timilifu unaonyesha tendo lililokamilika lenye umuhimu kwa tamko la sasa.
- source_word: τῶν βαλλόντων
  choice: wanaotia
  rationale: Muundo wa wakati wa sasa unahifadhi picha ya watu wengine waliokuwa wakiendelea kutia fedha wakati huo.
- source_word: γαζοφυλάκιον
  choice: sanduku la hazina
  rationale: Neno linaweza kutaja hazina ya hekalu au chombo/eneo la kupokelea matoleo; ‘sanduku la hazina’ linafanya chombo hicho kieleweke wazi katika muktadha.
theological_decisions:
- issue: Maana ya mjane kutia zaidi kuliko wengine wote
  choice: Kudumisha kauli halisi ya ulinganisho, ‘zaidi kuliko watu wote,’ bila kuifafanua kuwa kiasi cha fedha au thamani ya kimaadili.
  alternative: Kusema wazi kwamba sadaka yake ilikuwa na thamani kubwa zaidi ingawa kiasi chake cha fedha kilikuwa kidogo.
  rationale: Muktadha wa aya inayofuata unaeleza msingi wa tathmini, lakini aya hii yenyewe haubainishi aina ya ‘zaidi’; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata kwa karibu mpangilio wa Kiyunani huku ikitumia muundo wa Kiswahili unaoeleweka kwa wasomaji wa kawaida.
