  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: sw
  text: Mmoja wa waandishi wa sheria akamkaribia, akawasikia wakijadiliana. Alipoona kwamba Yesu alikuwa amewajibu vizuri, akamwuliza, “Ni amri ipi iliyo ya kwanza kuliko zote?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyo kuu kuliko zote” au “iliyo muhimu zaidi kuliko zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: waandishi wa sheria
  rationale: Katika Injili neno hili humaanisha wataalamu wa Kiyahudi waliotambuliwa katika Maandiko na sheria; tafsiri hii inaeleweka kwa msomaji wa sasa bila kupanua mno jukumu lao.
- source_word: προσελθὼν
  choice: akaja karibu
  rationale: Inaonyesha mwandishi huyo alimkaribia Yesu, kwa lugha ya kawaida na ya moja kwa moja.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: akawasikia wakijadiliana
  rationale: ‘Kujadiliana’ huhifadhi maana ya mjadala wa maswali yenye ubishi bila kulazimisha dhana ya ugomvi mkali.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: Alipoona kwamba Yesu alikuwa amewajibu vizuri
  rationale: Huwasilisha mtazamo wa mwandishi na maana ya καλῶς kwa urahisi; jina ‘Yesu’ linaondoa utata wa viwakilishi unaoweza kutokea katika Kiswahili.
- source_word: ἐπηρώτησεν
  choice: akamwuliza
  rationale: Ni tafsiri ya kawaida na ya asili ya tendo la kuuliza.
- source_word: Ποία
  choice: ipi
  rationale: Huomba kutambuliwa kwa amri moja kati ya amri mbalimbali.
- source_word: ἐντολή
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida, lenye hadhi ya kimaandiko, kwa agizo lenye mamlaka.
- source_word: πρώτη πάντων
  choice: ya kwanza kuliko zote
  rationale: Hukaa karibu na lugha ya Kigiriki ya ‘kwanza’ huku ikiruhusu maana ya ukuu au umuhimu kusikika bila kuamuliwa kimyakimya.
theological_decisions:
- issue: Maana ya πρώτη katika swali kuhusu amri
  choice: ya kwanza kuliko zote
  alternative: iliyo kuu kuliko zote; iliyo muhimu zaidi kuliko zote
  rationale: πρώτη inaweza kueleza nafasi ya kwanza au ukuu. Matini kuu inadumisha ‘kwanza,’ na tanbihi inaonyesha maana mbadala zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa masimulizi umetolewa kwa vitenzi vya mfululizo, huku sentensi ikigawanywa ili isikike kwa urahisi. Tanbihi huhifadhi upana wa maana ya πρώτη.
