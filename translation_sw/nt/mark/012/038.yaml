id: MRK.12.38
reference: Mark 12:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: sw
  text: Katika mafundisho yake alikuwa akisema, “Jihadharini na[a] walimu wa sheria wanaopenda kutembea huku na huku wakiwa wamevaa majoho marefu[b] na kusalimiwa masokoni,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jilindeni dhidi ya” au “Kuweni macho na.”
    reason: lexical_alternative
  - marker: b
    text: “Majoho marefu” ni mavazi ya nje yaliyoonekana wazi na yaliyohusishwa na hadhi na heshima mbele ya watu.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Katika mafundisho yake
  rationale: Huhifadhi wazo la mazingira au muktadha wa kufundisha, huku ikiwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Muundo huu unaonyesha hali endelevu au iliyorudiwa ya kitenzi cha wakati usiotimilika katika Kigiriki.
- source_word: Βλέπετε ἀπὸ
  choice: Jihadharini na
  rationale: Ni onyo la moja kwa moja la kuwa macho dhidi ya watu wanaotajwa, bila kupunguza uzito wa amri.
- source_word: γραμματέων
  choice: walimu wa sheria
  rationale: Katika muktadha wa Injili, neno hili linawataja wataalamu na wafundishaji wa sheria; tafsiri hii inaeleweka kwa wasomaji wa sasa kuliko ‘waandishi,’ ambalo linaweza kueleweka kama watunzi wa vitabu.
- source_word: τῶν θελόντων
  choice: wanaopenda
  rationale: Katika muktadha huu linaonyesha tamaa au upendeleo wao wa kawaida wa kufanya mambo hayo; ‘wanaopenda’ ni ya asili katika Kiswahili na huhifadhi tabia inayokusudiwa.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: kutembea huku na huku wakiwa wamevaa majoho marefu
  rationale: ‘Kutembea huku na huku’ huwasilisha περιπατεῖν, na ‘majoho marefu’ huonyesha mavazi ya nje yaliyohusishwa na hadhi bila kuyafungamanisha na aina maalumu ya vazi la Kiswahili.
- source_word: ἀσπασμοὺς
  choice: kusalimiwa
  rationale: Hutoa maana ya kupokea salamu za hadharani bila kuongeza moja kwa moja kwamba zilikuwa salamu za heshima, jambo linalodokezwa na muktadha.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: masokoni
  rationale: Ni tafsiri fupi na ya kawaida ya maeneo ya soko yaliyokuwa pia mahali pa mikusanyiko ya hadhara.
theological_decisions:
- issue: Walengwa na uzito wa onyo la Yesu kuhusu walimu wa sheria
  choice: Onyo dhidi ya walimu wa sheria wanaotambulishwa kwa kupenda kuonyesha hadhi hadharani
  alternative: Lawama ya jumla dhidi ya kila mwalimu wa sheria bila ubaguzi
  rationale: Kirai ‘wanaopenda...’ kinafafanua wale wanaolengwa. Tafsiri haiongezi dai kwamba kila mtu katika kundi hilo alikuwa na tabia hii, wala haiondoi uzito wa namna kundi linavyotajwa katika Kigiriki.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walimu wa sheria’ limetumiwa badala ya ‘waandishi’ ili kuepuka maana ya kawaida ya watunzi wa maandishi. Mpangilio wa alama za tanbihi umefungamanishwa na maneno husika: [a] kwa onyo na [b] kwa majoho marefu.'
