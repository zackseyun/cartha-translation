  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: sw
  text: Nao wakamkamata, wakampiga, wakamrudisha mikono mitupu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, “mtupu”; hapa humaanisha kwamba walimrudisha bila kupewa chochote.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: wakamkamata
  rationale: Katika muktadha wa wapangaji kumshambulia mtumishi, “kumkamata” huonyesha kuwa walimtia mikononi mwao bila kuongeza wazo maalumu la kumteka ambalo neno lenyewe halilazimishi.
- source_word: ἔδειραν (δέρω)
  choice: wakampiga
  rationale: “Kumpiga” ni Kiswahili cha kawaida na wazi kwa tendo la kumpiga au kumcharaza; hakidai kwamba ilikuwa adhabu rasmi ya kuchapwa viboko.
- source_word: ἀπέστειλαν (ἀποστέλλω)
  choice: kumrudisha
  rationale: Katika simulizi hili mtumishi alikuwa ametumwa kwa wapangaji, nao wakampeleka arudi bila alichokuja kuchukua. “Kumrudisha” huwasilisha mwelekeo huo wa kimuktadha kwa Kiswahili cha asili.
- source_word: κενόν (κενός)
  choice: mikono mitupu
  rationale: Kivumishi hiki kinamaanisha kihalisi “mtupu,” na hapa humaanisha kwamba mtumishi alirudishwa bila kupewa chochote. Nahau “mikono mitupu” huwasilisha maana hiyo kwa uwazi.
- source_word: καὶ ... καὶ
  choice: Nao ... na
  rationale: Muunganiko huu unadumisha mtiririko rahisi wa matendo yanayofuatana katika simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; “mikono mitupu” ni nahau ya kawaida inayoeleza κενόν bila kupoteza maana yake halisi iliyoonyeshwa katika tanbihi.
