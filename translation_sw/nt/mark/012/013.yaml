  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: sw
  text: Nao wanatuma kwake baadhi ya Mafarisayo na baadhi ya Maherode[a], ili wamnase kwa kauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafuasi wa Herode.” Maherode walikuwa kundi lililohusishwa na utawala wa Herode.
    reason: Ufafanuzi wa jina la kundi kwa wasomaji ambao huenda hawalifahamu.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: wanatuma
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umehifadhiwa kwa wakati uliopo wa kisimulizi, ambao unaeleweka kwa kawaida katika Kiswahili.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: baadhi ya Mafarisayo na baadhi ya Maherode
  rationale: Muundo wa sehemu umeonyeshwa kwa kurudia 'baadhi ya' ili kudhihirisha kwamba watu kadhaa walitoka katika kila kundi.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: Ἡρῳδιανῶν
  choice: Maherode
  rationale: Jina hili linatambulisha wafuasi wa Herode kwa namna fupi na inayoeleweka katika Kiswahili cha Biblia.
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linaonyesha wazi kusudi la kuwatuma.
- source_word: ἀγρεύσωσιν
  choice: wamnase
  rationale: ‘Kumnasa’ huhifadhi sitiari ya uwindaji na pia huonyesha kusudi lao la kumtega.
- source_word: λόγῳ
  choice: kwa maneno yake
  rationale: Dativu inaonyesha njia ya kumnasa kupitia kauli yake; Kiswahili cha kawaida hutumia wingi 'maneno' kumaanisha yale ambayo mtu atasema, ingawa Kigiriki kina umoja.
theological_decisions:
- issue: Mtendaji wa kitenzi cha wingi hakutajwa wazi katika mstari huu
  choice: wao, iliyo ndani ya kitenzi ‘wanatuma’
  alternative: viongozi wakuu wa makuhani, waandishi na wazee
  rationale: Tafsiri haiongezi utambulisho maalumu kutoka muktadha uliotangulia, bali inadumisha mtendaji wa wingi asiyeelezwa wazi katika Kigiriki.
- issue: Jinsi Yesu angenaswa kwa λόγῳ
  choice: kwa maneno yake
  alternative: kwa neno moja
  rationale: Chaguo hili linaonyesha kwamba mtego ungetokana na jibu au kauli yake bila kubainisha mapema angehukumiwa kwa msingi gani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi wakati uliopo wa kihistoria na uradidi wa ‘baadhi ya’ kwa uwazi; ‘wamnase’ inadumisha picha ya uwindaji iliyomo katika kitenzi cha Kigiriki.
