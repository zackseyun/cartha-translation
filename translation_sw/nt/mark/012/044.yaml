  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: sw
  text: Kwa maana wote walitoa kutoka katika ziada yao; lakini yeye, kutoka katika umaskini wake, alitoa vyote alivyokuwa navyo—riziki yake yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Huhifadhi maana ya jumla na kuwarejelea kwa pamoja wale waliotoa kabla ya mjane.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba sentensi hii inaeleza sababu ya tathmini iliyotangulia.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: katika ziada yao
  rationale: Hueleza kwamba walitoa kutoka katika mali iliyozidi mahitaji yao; “ziada” ni ya kawaida na huweka wazi tofauti na umaskini wa mjane.
- source_word: ἔβαλον / ἔβαλεν
  choice: walitoa / alitoa
  rationale: Ingawa kitenzi βάλλω kinaweza kumaanisha kutia au kuweka, katika muktadha wa sadaka “kutoa” ni Kiswahili cha kawaida na sahihi, huku urudiaji wake ukihifadhi ulinganifu wa Kigiriki.
- source_word: αὕτη δὲ
  choice: lakini yeye
  rationale: Huhifadhi mkazo wa tofauti kati ya mjane na watoaji wengine bila kurudia utambulisho ulio wazi katika muktadha.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: katika umaskini wake
  rationale: ὑστέρησις hapa ni hali ya upungufu wa mali au mahitaji; “umaskini” huwasilisha hali hiyo kwa uwazi katika muktadha wa fedha.
- source_word: πάντα ὅσα εἶχεν
  choice: vyote alivyokuwa navyo
  rationale: Huhifadhi maana pana na yenye mkazo ya kila kitu alichokuwa nacho.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: riziki yake yote
  rationale: βίος katika muktadha huu humaanisha mali au njia ya kujikimu, si uhai wa kibayolojia; “riziki yake yote” ni fupi, ya asili, na inaonyesha kwamba hicho ndicho alichotegemea kuishi.
theological_decisions:
- issue: Maana ya βίος katika kauli kuhusu sadaka ya mjane
  choice: njia yake yote ya kujikimu (“riziki yake yote”)
  alternative: uhai wake wote
  rationale: Muktadha ni wa kutoa fedha, na βίος inaweza kumaanisha mali ya kujikimu. Tafsiri hii huhifadhi uzito wa kwamba alitoa kila alichotegemea bila kudai kwamba alitoa uhai wake wa kimwili wakati huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kulinganisha ziada ya wengi na umaskini wa mjane umehifadhiwa, pamoja na msisitizo wa “vyote” na “yote.” Hakuna tanbihi iliyohitajika.
