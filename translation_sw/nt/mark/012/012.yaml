id: MRK.12.12
reference: Mark 12:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: sw
  text: Nao walikuwa wakitafuta kumkamata, lakini waliuogopa umati, kwa maana walijua kwamba alikuwa amesema mfano huo dhidi yao.[a] Basi wakamwacha, wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘kuwahusu’ au ‘kwao.’
    reason: Kirai cha Kigiriki πρὸς αὐτούς kinaweza kueleweka kuwa mfano ulisemwa dhidi yao, kuwahusu, au kuelekezwa kwao.
lexical_decisions:
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Kauli ya wakati usiotimilika inaonyesha jitihada au nia iliyoendelea; muundo huu unaihifadhi bila kudai kwamba tayari walikuwa wameanza kumshika.
- source_word: κρατῆσαι
  choice: kumkamata
  rationale: Katika muktadha huu kitenzi kina maana ya kumtia mtu mikononi au kumkamata. Kiswahili ‘kumkamata’ ni cha kawaida na hakilazimishi wazo la utaratibu rasmi wa kisheria.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: waliuogopa umati
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kumwogopa mtu au kundi fulani.
- source_word: ἔγνωσαν
  choice: walijua
  rationale: Huhifadhi maana ya utambuzi ulio thabiti bila kuongeza ufafanuzi wa ‘waligundua’.
- source_word: πρὸς αὐτοὺς
  choice: dhidi yao
  rationale: Muktadha wa uhasama unaunga mkono maana kwamba mfano uliwalenga kwa kuwakosoa, ingawa kirai kinaweza pia kumaanisha ‘kuwahusu’ au ‘kwao’; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: τὴν παραβολὴν
  choice: mfano huo
  rationale: ‘Huo’ humrejesha msomaji kwa kawaida kwenye mfano uliotangulia mara moja.
- source_word: εἶπεν
  choice: alikuwa amesema
  rationale: Muundo huu unaonyesha kwamba kusema mfano kulitangulia kujua kwao.
- source_word: ἀφέντες αὐτὸν
  choice: wakamwacha
  rationale: Katika muktadha huu humaanisha kwamba waliacha kumshughulikia au kumkamata; ‘wakamwacha’ ni fupi na ya kawaida.
- source_word: ἀπῆλθον
  choice: wakaondoka
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mwendo wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. ‘Umati’ limetumiwa kwa ὄχλος, na mfuatano ‘wakamwacha, wakaondoka’ umehifadhi vitendo viwili vya Kigiriki bila lugha ya kizamani.
