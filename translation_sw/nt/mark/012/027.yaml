  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: sw
  text: Yeye si Mungu wa wafu, bali wa walio hai.[a] Mmekosea sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Mungu si Mungu wa wafu, bali wa walio hai.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mko katika kosa kubwa” au “Mmepotoka sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: Mungu
  rationale: Katika muktadha huu neno hili linamtaja Mungu wa Abrahamu, Isaka na Yakobo; kwa hiyo halimaanishi “mungu mmoja.”
- source_word: νεκρῶν
  choice: wa wafu
  rationale: Nomino hii ya wingi inawataja watu waliokufa na inadumisha ulinganifu wa moja kwa moja na “walio hai.”
- source_word: ἀλλὰ ζώντων
  choice: bali wa walio hai
  rationale: Kirai hiki kinawataja watu walio hai. “Bali” linaonyesha tofauti iliyo wazi na “wafu.”
- source_word: πολὺ
  choice: sana
  rationale: Neno hili linatumika kielezi kusisitiza ukubwa wa kosa.
- source_word: πλανᾶσθε
  choice: mmekosea
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwa katika kosa. Tafsiri hii haikulazimishi kueleweka ama kama kujipotosha ama kama kupotoshwa na mtu mwingine.
- source_word: οὐκ ἔστιν
  choice: Yeye si
  rationale: Kiwakilishi “Yeye” kinapatikana kutokana na muktadha wa karibu unaozungumza kuhusu Mungu, na muundo huu ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana inayodokezwa kuhusu kuendelea kuishi mbele za Mungu katika hoja ya Yesu
  choice: Kauli imetafsiriwa moja kwa moja kwa kutofautisha “wafu” na “walio hai,” bila kuongeza ufafanuzi wa kimafundisho kuhusu ufufuo au hali ya baada ya kifo.
  alternative: Mungu si Mungu wa watu waliokufa, bali wa watu walio hai.
  rationale: Muktadha unahusu hoja ya Yesu juu ya ufufuo, lakini tafsiri haipaswi kuongeza hitimisho la kitheolojia lisilotamkwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mmekosea sana” ni karipio la moja kwa moja bila kuongeza sababu au aina ya kosa.
