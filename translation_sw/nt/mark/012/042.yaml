  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: sw
  text: Kisha mjane mmoja maskini akaja, akatia lepta mbili[a], ambazo ni sawa na kodranti moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lepton ilikuwa sarafu ndogo sana; lepta mbili zilikuwa sawa na kodranti moja ya Kirumi. Inaweza pia kutafsiriwa “sarafu mbili ndogo za shaba.”
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: Kodranti ni sarafu ya Kirumi inayotajwa katika maandishi ya Kigiriki.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: akaja
  rationale: Kirai cha hali cha wakati uliopita kimetafsiriwa kwa kitenzi kinachoratibiwa na kitenzi kikuu, jambo linalotoa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: μία
  choice: mmoja
  rationale: Hapa neno hili linamtambulisha mtu mmoja katika simulizi, bila kulazimisha msisitizo mkali wa idadi.
- source_word: χήρα πτωχὴ
  choice: mjane mmoja maskini
  rationale: Huhifadhi maana ya kawaida ya χήρα na πτωχός kwa lugha ya sasa iliyo wazi; ‘maskini hohehahe’ ingeongeza kiwango cha umaskini kisichotajwa moja kwa moja katika mstari huu.
- source_word: ἔβαλεν
  choice: akatia
  rationale: Katika muktadha wa sanduku la sadaka, ‘akatia’ ni usemi wa kawaida na haudokezi nguvu ya kutupa ambayo si lazima ikusudiwe.
- source_word: λεπτὰ δύο
  choice: lepta mbili
  rationale: Jina mahsusi la sarafu limehifadhiwa kwa usahihi wa kihistoria, huku tanbihi ikieleza udogo na thamani yake.
- source_word: ὅ ἐστιν
  choice: ambazo ni sawa na
  rationale: Hueleza ulinganifu wa thamani ya lepta hizo mbili na kodranti moja kwa Kiswahili cha kawaida.
- source_word: κοδράντης
  choice: kodranti moja
  rationale: Jina la sarafu ya Kirumi limetoholewa badala ya kubadilishwa na sarafu ya kisasa au jina la zamani lisilo na thamani sawa.
