source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: sw
  text: 'Kisha akaanza kusema kwao kwa mifano: “Mtu mmoja alipanda shamba la mizabibu, akalizungushia uzio[a], akachimba shimo la kupokelea maji ya zabibu yaliyokamuliwa[b], akajenga mnara, akalikodisha kwa wakulima wapangaji[c][d], kisha akaondoka akasafiri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalizungushia ua.” Neno la Kigiriki φραγμός linaweza kumaanisha uzio, ua wa mimea, au kizuizi kingine kinachozunguka eneo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, shimo au birika la chini lililopokea maji ya zabibu kutoka katika kikamulio cha zabibu.
    reason: lexical_clarification
  - marker: c
    text: Au, “akalikodisha kwa wakulima” au “kwa watunza mizabibu.”
    reason: lexical_alternative
  - marker: d
    text: Picha hii ina mwangwi wa Isaya 5:1–2, ambapo shamba la mizabibu linapandwa, linazungushiwa ulinzi, na kuandaliwa kwa matumizi.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: akaanza kusema
  rationale: Muundo huu unaonyesha mwanzo wa tendo la kusema. ‘Akaanza kusema’ ni Kiswahili cha kawaida cha masimulizi na kinahifadhi maana hiyo.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Katika muktadha wa mafundisho ya Yesu, ‘kwa mifano’ ni usemi wa kawaida na unaoeleweka kwa παραβολαί bila kuifanya kuwa mifano ya kawaida tu ya ufafanuzi.
- source_word: Ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hili ni neno la kawaida la Kiswahili kwa eneo lililopandwa mizabibu na linawasilisha mazingira ya kilimo ya mfano.
- source_word: ἄνθρωπος
  choice: mtu mmoja
  rationale: Hutambulisha mhusika mmoja katika mfano kwa Kiswahili cha asili bila kuongeza cheo kama ‘mwenye shamba,’ ambacho hakijasemwa moja kwa moja hapa.
- source_word: περιέθηκεν φραγμόν
  choice: akalizungushia uzio
  rationale: Huwasilisha tendo la kuweka kizuizi cha kulizunguka shamba; ‘uzio’ ni neno pana na la kawaida, huku uwezekano wa ua wa mimea ukihifadhiwa katika tanbihi.
- source_word: ὤρυξεν ὑπολήνιον
  choice: akachimba shimo la kupokelea divai iliyokamuliwa
  rationale: ὑπολήνιον ni sehemu ya chini inayopokea maji ya zabibu kutoka katika kikamulio. Tafsiri hii inaeleza kazi yake kwa lugha ya kawaida bila kuiita tu ‘kikamulio.’
- source_word: ᾠκοδόμησεν πύργον
  choice: akajenga mnara
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi mfululizo wa maandalizi ya shamba.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: akalikodisha kwa wakulima wapangaji
  rationale: Kitenzi kina maana ya kukodisha mali kwa wengine, na muktadha unaonyesha kuwa γεωργοί ni wakulima wanaolima shamba la mwenye mali kwa upangaji.
- source_word: ἀπεδήμησεν
  choice: akaondoka akasafiri
  rationale: Huwasilisha kuondoka kwenda mahali pengine kwa muda bila kulazimisha wazo la nchi ya kigeni, ambalo linawezekana lakini halihitajiki na kitenzi.
theological_decisions:
- issue: Utambulisho wa ἄνθρωπος katika mfano
  choice: mtu mmoja
  alternative: mwenye shamba mmoja
  rationale: ‘Mtu mmoja’ hufuata chanzo kwa karibu na huepuka kuongeza utambulisho usiotajwa moja kwa moja, ingawa matendo yake yanaonyesha kuwa ndiye mwenye shamba.
- issue: Uhusiano wa γεωργοῖς na mwenye shamba
  choice: wakulima wapangaji
  alternative: wakulima / watunza mizabibu
  rationale: Kwa kuwa shamba linakodishwa, ‘wakulima wapangaji’ huweka wazi tofauti muhimu kati ya mwenye shamba na waliolikodishwa bila kuamua mapema maana ya kiishara ya wahusika.
- issue: Mwangwi wa Isaya 5:1–2
  choice: kuuhifadhi kwa tanbihi bila kuuingiza katika matini
  alternative: kutoutaja
  rationale: Maelezo ya kupanda shamba la mizabibu, kulizungushia na kulijengea yana mwangwi dhahiri wa Isaya 5, lakini Marko haulazimishi ufafanuzi wake ndani ya sentensi; tanbihi huhifadhi uhusiano huo bila kutatua maana ya mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya masimulizi ya Maandiko. Vitenzi vinavyofuatana kwa kiambishi ‘aka-’ vinatunza mwendo wa simulizi. Maneno ya kiufundi ya utengenezaji wa divai yameelezwa kwa lugha inayoeleweka, huku usahihi wa ὑπολήνιον ukifafanuliwa katika tanbihi.
