  text: Akamtuma tena mtumishi mwingine[a] kwao; huyo pia wakampiga kichwani[b] na kumvunjia heshima.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumwa mwingine.” Neno la Kigiriki doulos linaweza kumaanisha “mtumishi” au “mtumwa,” kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Kitenzi hiki adimu kinarejelea ukatili ulioelekezwa kichwani; huenda maana yake ni “wakampiga kichwani” au “wakamjeruhi kichwani,” si “wakamkata kichwa.”
    reason: lexical_alternative
  - marker: c
