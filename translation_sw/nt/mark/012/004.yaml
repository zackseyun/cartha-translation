    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Inaonyesha kurudiwa kwa tendo katika mfululizo wa mfano, kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Wakati wa kisimulizi unaendelezwa kwa kiambishi cha mfululizo -ka-; kiambishi cha yambwa -wa- kinarejelea waliotumiwa mtumishi.
- source_word: πρὸς αὐτοὺς
  choice: kwao
  rationale: Pamoja na kitenzi cha kutuma, “kwao” ni tafsiri ya kawaida na wazi ya kuelekea kwa watu hao.
- source_word: ἄλλον δοῦλον
  choice: mtumishi mwingine
  rationale: “Mtumishi” ni lugha ya kawaida katika mfano huu na inadumisha uhusiano wake na mwenye shamba; uwezekano wa maana “mtumwa” umewekwa katika tanbihi.
- source_word: κἀκεῖνον
  choice: huyo pia
  rationale: Inahifadhi msisitizo wa mwendelezo ulio katika crasis κἀκεῖνον, yaani kwamba mtumishi huyo mwingine naye alitendewa vivyo hivyo.
- source_word: ἐκεφαλίωσαν
  choice: wakampiga kichwani
  rationale: Kitenzi hiki adimu kinaonyesha ukatili ulioelekezwa kichwani. Tafsiri hii ni ya asili na haileti maana isiyofaa ya kukata kichwa.
- source_word: ἠτίμασαν
  choice: kumvunjia heshima
  rationale: Inaeleza kumtendea mtu kwa fedheha na kutomheshimu; usemi huu ni wa asili katika Kiswahili na unabaki karibu na maana ya kitenzi cha Kigiriki.
