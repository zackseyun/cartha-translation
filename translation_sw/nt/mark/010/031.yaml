base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: sw
  text: Lakini wengi walio wa kwanza watakuwa wa mwisho[a], na walio wa mwisho watakuwa wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwazi zaidi: “Lakini watu wengi walio wa kwanza watakuwa wa mwisho, na wale walio wa mwisho watakuwa wa kwanza.”'
    reason: Mbadala huu unaweka wazi matumizi ya kivumishi kama nomino na kurudia kitenzi kilichoeleweka katika sehemu ya pili ya Kigiriki.
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinaonyesha kundi pana, si kila mtu bila ubaguzi. “Wengi” ni usemi mfupi na wa kawaida unaohifadhi wigo usioainishwa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti nyepesi au mpito; katika muktadha huu “Lakini” kinaonyesha vizuri kanuni ya kugeuzwa kwa hali inayofuata ahadi ya mstari uliotangulia.
- source_word: ἔσονται
  choice: watakuwa
  rationale: Ni kitenzi cha wakati ujao cha εἰμί; “watakuwa” ni tafsiri ya kawaida na ya moja kwa moja ya Kiswahili.
- source_word: πρῶτοι
  choice: wa kwanza
  rationale: Hapa neno linaonyesha cheo au nafasi, si mpangilio wa wakati pekee. “Wa kwanza” linahifadhi utofautishaji wa kimethali.
- source_word: ἔσχατοι
  choice: wa mwisho
  rationale: Neno hili linatofautishwa moja kwa moja na πρῶτοι na linaonyesha nafasi au hadhi. “Wa mwisho” linadumisha ulinganifu huo bila kuufasiri kwa upana zaidi.
- source_word: οἱ ἔσχατοι
  choice: walio wa mwisho
  rationale: Kibainishi kinafanya kirai hiki kitumike kama nomino. “Walio wa mwisho” ni cha asili katika Kiswahili na kinabainisha watu wanaorejelewa.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha sehemu mbili za kauli. “Na” kinahifadhi muundo sambamba bila kuongeza maana ya kifasiri.
theological_decisions:
- issue: Asili ya kauli kuhusu kugeuzwa kwa nafasi
  choice: Kauli imetafsiriwa kama kanuni pana ya kugeuzwa kwa nafasi bila kutaja kwa mahsusi makundi ya kijamii, kimaadili, au ya wokovu.
  alternative: Kuitafsiri mahsusi kuwa inahusu matajiri na maskini, wanafunzi na walio nje, au kuwa sheria kamili inayomhusu kila mtu.
  rationale: Mstari unatoa kauli fupi ya kiparadozi, lakini hauyafafanui makundi hayo kikamilifu. Tafsiri inahifadhi uwazi na mvutano wa kauli badala ya kuifungamanisha na matumizi moja ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kimethali na ulinganifu wa “wa kwanza/wa mwisho” umehifadhiwa; kitenzi kimerudiwa katika sehemu ya pili ili sentensi iwe ya asili na wazi kwa msomaji wa kawaida.
