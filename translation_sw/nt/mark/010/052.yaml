  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: sw
  text: Yesu akamwambia, “Nenda; imani yako imekuokoa.[a]” Mara moja akaweza kuona tena, naye akaendelea kumfuata Yesu njiani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imekuponya” au “imekufanya mzima.” Kitenzi cha Kigiriki kinaweza kurejelea uponyaji na pia wokovu.
    reason: lexical_alternative
  - marker: b
    text: Au, “barabarani.” Neno la Kigiriki linaweza kumaanisha barabara halisi au njia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Nenda
  rationale: Amri hii ya kuondoka imetafsiriwa kwa njia ya moja kwa moja na ya kawaida bila kuongeza wazo la ‘njia yako,’ ambalo haliko wazi katika Kigiriki.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu neno hilo linaonyesha kumtumaini Yesu; ‘imani’ ni neno la kawaida la Kiswahili na pia linadumisha istilahi muhimu ya maandiko.
- source_word: σέσωκέν
  choice: imekuokoa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa, kuponya, au kumfanya mtu awe mzima. ‘Imekuokoa’ kinahifadhi upana wa maana na mvutano kati ya uponyaji wa mwili na wokovu mpana.
- source_word: εὐθύς
  choice: Mara moja
  rationale: Hii inadumisha mwendo wa haraka wa simulizi ya Marko kwa Kiswahili cha kawaida.
- source_word: ἀνέβλεψεν
  choice: akaweza kuona tena
  rationale: Katika muktadha wa mtu kipofu, maana ni kurejeshewa uwezo wa kuona. Usemi huu ni wazi na wa asili kwa wasomaji wa Kiswahili.
- source_word: ἠκολούθει
  choice: akaendelea kumfuata
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo linaloendelea; ‘akaendelea kumfuata’ linadumisha hali hiyo kwa Kiswahili cha asili.
- source_word: αὐτῷ
  choice: Yesu
  rationale: Kumtaja Yesu badala ya kutumia ‘yeye’ kunaondoa utata wa kiwakilishi katika Kiswahili bila kubadili mhusika anayerejelewa.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: ‘Njiani’ ni tafsiri fupi na ya kawaida inayoweza kumaanisha katika safari na pia kuhifadhi mwangwi unaowezekana wa ‘njia’ katika Marko.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Yesu aka-
  rationale: Kiunganishi καί kimewakilishwa kiasili kwa mfululizo wa kitenzi cha Kiswahili ‘aka-’, unaoendeleza simulizi bila kulazimisha ‘na’ mwanzoni.
theological_decisions:
- issue: Maana ya σῴζω katika tamko la Yesu
  choice: imekuokoa
  alternative: imekuponya; imekufanya mzima
  rationale: Muktadha unaonyesha kurejeshwa kwa kuona, lakini kitenzi cha Kigiriki kina maana pana kuliko uponyaji wa mwili pekee. Tafsiri kuu haifungi maana hiyo, na tanbihi inaonyesha uwezekano wa maana ya uponyaji.
- issue: Maana ya πίστις katika muktadha huu
  choice: imani
  alternative: tumaini
  rationale: ‘Imani’ inadumisha istilahi kuu na haiondoi wazo la kumtegemea Yesu; ‘tumaini’ linaweza kueleza maana katika muktadha lakini lingeifanya istilahi kuwa nyembamba zaidi.
- issue: Maana ya ἐν τῇ ὁδῷ
  choice: njiani
  alternative: barabarani
  rationale: ‘Njiani’ huhifadhi picha halisi ya safari pamoja na uwezekano wa mwangwi wa ufuasi, bila kudai kwamba maana ya kitheolojia ndiyo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo ‘aka-’ umetumiwa kuendeleza simulizi kwa njia ya asili; ‘akaendelea kumfuata’ inadumisha hali endelevu ya ἠκολούθει.
