base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: sw
  text: Alipokuwa akielekea njiani[a], mwanamume mmoja alimkimbilia, akapiga magoti mbele yake, kisha akamwuliza, “Mwalimu mwema, nifanye nini ili niurithi uzima wa milele?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokuwa akianza safari.” Usemi wa Kiyunani unaweza kumaanisha kuelekea njiani au kuanza safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Alipokuwa akitoka kwenda njiani
  rationale: Muundo huu unaonyesha tendo la usuli lililokuwa likiendelea wakati mtu huyo alipomjia. “Kwenda njiani” hudumisha wazo la kutoka kuelekea barabarani na pia linaweza kueleweka kuwa kuanza safari; uwezekano huo umeelezwa katika tanbihi.
- source_word: προσδραμὼν
  choice: alimkimbilia
  rationale: Neno hili linaonyesha kuwa mtu huyo alimwendea kwa kukimbia, na hivyo kuhifadhi uharaka na uhai wa simulizi.
- source_word: εἷς
  choice: mtu mmoja
  rationale: Neno la Kiyunani linamtambulisha mtu mmoja maalumu. Kiswahili “mtu mmoja” ni cha kawaida na hakiongezi maelezo yasiyotajwa wazi katika mstari huu.
- source_word: γονυπετήσας αὐτόν
  choice: akapiga magoti mbele yake
  rationale: Hii ni njia ya asili na iliyo wazi ya kueleza tendo la kupiga magoti kwa heshima au kwa kusihi.
- source_word: ἐπηρώτα αὐτόν
  choice: na kumuuliza
  rationale: Ingawa kitenzi cha Kiyunani kiko katika hali isiyotimilika, katika mtiririko huu Kiswahili cha kawaida hutumia “kumuuliza” bila kulazimisha maana ya kuuliza mara kwa mara.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Mwalimu mwema
  rationale: “Mwalimu” hulingana moja kwa moja na διδάσκαλος, na “mwema” huhifadhi kivumishi muhimu kwa jibu linalofuata.
- source_word: τί ποιήσω
  choice: nifanye nini
  rationale: Hili ni swali la kutaka kujua hatua inayopasa kuchukuliwa. Muundo wa Kiswahili “nifanye nini” ni wa asili na hauongezi kiwango cha ulazima kisichowekwa wazi zaidi na Kiyunani.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha wazi uhusiano wa kusudi au matokeo unaoletwa na ἵνα.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Hili ni tamko la kawaida, wazi na lenye uzito unaofaa kwa dhana ya maisha ya wakati ujao yasiyo na mwisho.
- source_word: κληρονομήσω
  choice: niurithi
  rationale: “Kurithi” huhifadhi taswira ya kupokea kama mrithi badala ya kuifanya kuwa “kupata” tu.
theological_decisions:
- issue: Jinsi ya kutafsiri namna mtu huyo alivyomwita Yesu
  choice: Mwalimu mwema
  alternative: Bwana mwema
  rationale: Kiyunani kina διδάσκαλε, yaani “Mwalimu,” wala si κύριε, “Bwana.” Tafsiri hii haiongezi cheo ambacho hakipo katika maandishi na huhifadhi umuhimu wa neno “mwema” kwa mazungumzo yanayofuata.
- issue: Jinsi ya kuonyesha εἷς katika simulizi
  choice: mtu mmoja
  alternative: mwanamume mmoja
  rationale: εἷς ya kiume inamtaja mtu mmoja, lakini katika Kiswahili “mtu mmoja” ndiyo namna ya asili ya kumtambulisha mhusika bila kulazimisha msisitizo wa jinsia ambao muktadha wa mstari huu hauhitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Sentensi imehifadhi mfululizo hai wa matendo kwa “alimkimbilia, akapiga magoti,” huku swali likisomeka kwa urahisi kwa msomaji wa kawaida.
