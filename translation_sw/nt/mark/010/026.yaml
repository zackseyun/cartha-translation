base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: sw
  text: Nao walishangaa mno, wakisema wao kwa wao,[a] “Basi, ni nani anayeweza kuokolewa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwao”; kihalisi zaidi, “kwao wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Inarejelea wanafunzi au wasikilizaji waliotajwa katika muktadha na kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: περισσῶς
  choice: wakazidi ... sana
  rationale: Muundo huu unaonyesha kiwango kilichoongezeka cha mshangao; katika muktadha unaweza kuwa na maana ya ‘zaidi sana’ au ‘kupita kiasi.’
- source_word: ἐξεπλήσσοντο
  choice: kushangaa
  rationale: Kitenzi kinaonyesha mshangao mkubwa unaoendelea; ‘kushangaa sana’ ni lugha ya sasa na inayoeleweka kwa urahisi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Inaonyesha kwamba kusema kulitokea wakati uleule walipokuwa wakishangaa.
- source_word: πρὸς ἑαυτούς
  choice: wao kwa wao
  rationale: Katika kundi la watu wanaozungumza, usemi huu unaeleweka kwa maana ya kurejeleana, ingawa kihalisi unaweza kuwa ‘kwa nafsi zao.’
- source_word: Καὶ
  choice: Basi
  rationale: Hapa καί linaingiza hitimisho au matokeo wanayoyaona kutokana na maneno ya Yesu, si muunganiko wa kawaida tu.
- source_word: τίς
  choice: ni nani
  rationale: Linahoji ni mtu gani angeweza kupata wokovu.
- source_word: δύναται
  choice: anayeweza
  rationale: Linadumisha wazo la uwezo au uwezekano kwa Kiswahili cha kawaida.
- source_word: σωθῆναι
  choice: kuokolewa
  rationale: Katika muktadha wa kuingia katika ufalme wa Mungu, neno hili lina uzito wa wokovu, si kuponyoka katika hatari ya muda tu.
theological_decisions:
- issue: Maana ya lugha ya wokovu katika muktadha
  choice: kuokolewa
  alternative: kuokoka; kuponywa; kukombolewa
  rationale: Muktadha unaohusu kuingia katika ufalme wa Mungu unahitaji lugha inayobeba maana pana ya tendo la Mungu la kuokoa. ‘Kuokolewa’ pia linahifadhi hali ya kutendwa ya σωθῆναι bila kueleza kwa ziada namna ya wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakazidi kushangaa sana’ huhifadhi nguvu ya περισσῶς bila kutumia usemi mzito usio wa kawaida; tanbihi inadumisha uwezekano wa maana katika πρὸς ἑαυτούς.
