review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participants, their astonishment, reciprocal speech, consequential question, ability, and passive salvation language. However, "wakazidi kushangaa sana" introduces an incremental sense ("became increasingly astonished") not explicit in περισσῶς and combines two intensifiers where the Greek has one adverb.
  naturalness: '"Nao walishangaa mno" is concise, idiomatic Standard East African Swahili, and carries the strong degree of astonishment naturally. "Wao kwa wao" is an apt reciprocal rendering in this context.'
  terminology: '"Kuokolewa" appropriately preserves σωθῆναι as passive salvation language in the kingdom-of-God context. The footnote''s "kwa nafsi zao" is less suitable here, since in ordinary Swahili it can suggest acting independently; "kwao wenyewe" better represents the literal reflexive expression without deciding against the reciprocal contextual sense.'
  issues:
  - severity: medium
    issue: '"wakazidi kushangaa sana" adds an unexpressed incremental nuance.'
    rationale: περισσῶς intensifies their astonishment as "exceedingly/very greatly"; it does not itself state that their astonishment increased. A single strong Swahili intensifier is more faithful.
  - severity: low
    issue: The footnote's literal alternative "kwa nafsi zao" may mislead.
    rationale: In Swahili this may naturally be understood as "by themselves/on their own," whereas "kwao wenyewe" more directly reflects the Greek reflexive construction. The main text rightly gives the reciprocal contextual sense.
  revised_text: Nao walishangaa mno, wakisema wao kwa wao,[a] “Basi, ni nani anayeweza kuokolewa?”
