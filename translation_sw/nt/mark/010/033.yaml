base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: sw
  text: kwamba, “Tazameni, tunapanda kuelekea Yerusalemu, na Mwana wa Adamu atakabidhiwa[a] kwa makuhani wakuu na waandishi wa sheria. Nao watamhukumu adhabu ya kifo na kumkabidhi kwa watu wasio Wayahudi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atatiwa mikononi mwa.” Kitenzi kilekile cha Kigiriki kimetumiwa pia katika “kumkabidhi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mataifa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha maudhui ya maneno ya Yesu kwa kuendeleza sentensi ya mstari uliotangulia, bila kuipa maana ya sababu.
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni kiashiria cha hotuba kinachovuta usikivu; “Tazameni” ni cha sasa, chenye heshima, na kinahifadhi msisitizo wa Kigiriki.
- source_word: ἀναβαίνομεν
  choice: tunapanda kwenda
  rationale: Huonyesha safari ya kuelekea Yerusalemu, ambayo kwa jiografia na matumizi ya kawaida huelezwa kama kupanda.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya jina hili la kujitaja, inayohifadhi maneno ya asili na mwangwi wake wa kitheolojia bila kuyafafanua kupita kiasi.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: atakabidhiwa / watamkabidhi
  rationale: Mzizi uleule umetafsiriwa kwa kitenzi kilekile ili kuhifadhi mnyororo wa kukabidhiwa kutoka mamlaka moja kwenda nyingine; “kus alitiwa” kungebanisha maana kupita kiasi.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: kwa makuhani wakuu
  rationale: Hurejelea kundi la viongozi wakuu wa kikuhani, si kuhani mkuu mmoja.
- source_word: τοῖς γραμματεῦσιν
  choice: waandishi wa sheria
  rationale: Hutoa kwa lugha inayoeleweka kazi ya waandishi hawa katika mazingira ya Kiyahudi; “waandishi” peke yake inaweza kueleweka kama waandishi wa kawaida.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: watamhukumu afe
  rationale: Ni Kiswahili cha kawaida kinachoonyesha hukumu rasmi yenye adhabu ya kifo bila kupunguza uzito wa tendo.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa mataifa mengine
  rationale: Katika muktadha huu hurejelea watu wasiokuwa Wayahudi ambao wangepokea mamlaka juu yake; tafsiri hii pia huhifadhi wazo la “mataifa” lililo katika neno la Kigiriki.
theological_decisions:
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi muundo wa Kigiriki, mwangwi wa Danieli, na matumizi yake kama jina la Yesu la kujitaja bila kufuta mvutano wake wa kikristo.
- issue: Tafsiri ya τοῖς ἔθνεσιν
  choice: watu wa mataifa mengine
  alternative: watu wasio Wayahudi
  rationale: Chaguo kuu huhifadhi maana ya msingi ya “mataifa” huku muktadha ukionyesha tofauti kati ya viongozi wa Kiyahudi na watawala wasiokuwa Wayahudi; tanbihi inatoa ufafanuzi wa kihistoria bila kuuingiza moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tunapanda kwenda” ni usemi wa kawaida unaohifadhi mwelekeo wa safari kwenda Yerusalemu. Muundo wa kwanza “kwamba” umeachwa ili kuonyesha wazi kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
