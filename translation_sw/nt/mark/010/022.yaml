  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: sw
  text: Lakini, kwa neno hilo[b], sura yake ikawa ya huzuni[a], akaenda zake akiwa na huzuni; kwa maana alikuwa na mali nyingi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alihuzunika” au “alivunjika moyo”; neno la Kigiriki hudokeza kwamba huzuni hiyo ilionekana katika sura yake.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa sababu ya kauli hiyo” au “aliposikia kauli hiyo.”
    reason: lexical_alternative
  - marker: c
    text: Au “mali tele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: uso wake ukawa na huzuni
  rationale: Kitenzi hiki kinaonyesha badiliko la kuonekana kuelekea hali ya kukunjamana au kuwa na huzuni. Usemi huu wa Kiswahili unahifadhi ishara ya nje bila kuongeza kwamba mtu huyo alikasirika.
- source_word: ἐπὶ τῷ λόγῳ
  choice: kwa sababu ya neno hilo
  rationale: Kirai hiki kinaweza kueleza sababu au tukio lililosababisha mwitikio wake. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha uhusiano huo na λόγος katika umoja.
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Ni simulizi la kawaida na la asili la Kiswahili linaloonyesha kwamba aliondoka mahali pale.
- source_word: λυπούμενος
  choice: akiwa na majonzi
  rationale: Hali endelevu ya huzuni inaendelea wakati anaondoka. ‘Majonzi’ yana uzito unaofaa bila kuingiza hukumu ya kimaadili.
- source_word: κτήματα πολλά
  choice: mali nyingi
  rationale: κτήματα hurejelea mali au vitu vinavyomilikiwa, na πολλά huonyesha wingi. ‘Mali nyingi’ ni wazi, pana, na ya asili katika Kiswahili.
- source_word: ἦν γὰρ ἔχων
  choice: kwa maana alikuwa na
  rationale: Muundo huu unaeleza hali yake ya kudumu ya kumiliki mali; Kiswahili huiwasilisha kwa kawaida kwa ‘alikuwa na.’
theological_decisions:
- issue: Asili ya mwitikio wa kihisia wa mtu huyo kwa kauli ya Yesu
  choice: Tafsiri inaonyesha huzuni iliyodhihirika usoni na majonzi yaliyoendelea alipokuwa akiondoka, bila kuongeza hukumu ya kimaadili.
  alternative: Kutafsiri kwamba alikasirika au kwamba alikuwa amevunjika moyo tu.
  rationale: Maneno ya Kigiriki yanaeleza hali ya huzuni inayoonekana na majonzi, lakini hayasemi wazi kwamba alikuwa na hasira wala hayaelezi tathmini kamili ya kiroho ya mwitikio wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Uso wake ukawa na huzuni’ huepuka lugha ya kizamani na kuhifadhi dalili inayoonekana katika στυγνάσας.
