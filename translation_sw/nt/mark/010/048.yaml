base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: sw
  text: 'Wengi walikuwa wakimkemea ili anyamaze, lakini yeye aliendelea kupaza sauti zaidi: “Mwana wa Daudi[a], nihurumie!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa Daudi” ni cheo cha kifalme na kimasihi; maana yake ingeweza pia kuelezwa kama “Masihi,” lakini hapa maneno ya Kigiriki yamehifadhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: wakamkemea
  rationale: Kitenzi hiki kinahifadhi nguvu ya kukaripia au kukemea; muktadha unaonyesha kwamba wengi walikuwa wakijaribu kumnyamazisha. Muundo wa Kiswahili unasimulia tendo lililoendelea katika tukio hilo kwa njia ya kawaida.
- source_word: πολλοὶ
  choice: Wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino. “Wengi” ni tafsiri ya moja kwa moja bila kuongeza neno “umati,” ambalo halipo wazi katika Kigiriki.
- source_word: ἵνα σιωπήσῃ
  choice: ili anyamaze
  rationale: Hii inaonyesha kusudi la kumkemea kwa lugha ya kawaida na yenye uwazi.
- source_word: πολλῷ μᾶλλον
  choice: akazidi
  rationale: Huwasilisha maana ya kufanya hivyo zaidi sana bila kuongeza wazi wazo la ukubwa wa sauti ambalo kirai chenyewe halitaji.
- source_word: ἔκραζεν
  choice: kupaza sauti
  rationale: Hueleza mwito wenye nguvu na wa kusisitiza. Pamoja na “akazidi,” inawasilisha hali ya kuendelea kuita kwa Kiswahili cha kawaida.
- source_word: Υἱὲ Δαυίδ
  choice: Mwana wa Daudi
  rationale: Tafsiri ya moja kwa moja inahifadhi cheo cha kifalme chenye maana ya Kimasihi badala ya kukibadili kuwa fasiri yake.
- source_word: ἐλέησόν με
  choice: nihurumie
  rationale: Ni ombi la moja kwa moja na la kawaida la Kiswahili linalohifadhi wazo la kuonyeshwa rehema.
theological_decisions:
- issue: Maana ya Kimasihi ya “Mwana wa Daudi”
  choice: Kuhifadhi cheo “Mwana wa Daudi” katika maandishi
  alternative: “Masihi”
  rationale: Kigiriki kinatumia cheo Υἱὲ Δαυίδ moja kwa moja. Kukitafsiri badala ya kukifafanua kunahifadhi maneno ya chanzo na mwangwi wake wa kifalme na Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Wakamkemea” na “akazidi kupaza sauti” ni vya asili katika simulizi huku vikihifadhi nguvu na mwendelezo wa vitendo vya Kigiriki.
