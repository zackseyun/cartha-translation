  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: sw
  text: Aliposikia kwamba ni Yesu Mnazareti[a], alianza kupaza sauti na kusema, “Yesu, Mwana wa Daudi, nihurumie!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu wa Nazareti.” Kigiriki kinasema “Yesu Mnazareti,” kikihifadhi lakabu badala ya kutumia kauli iliyo wazi zaidi ya kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Aliposikia
  rationale: Kishiriki cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati, kikihifadhi mfuatano wa tendo kwa Kiswahili cha kawaida.
- source_word: Ναζαρηνός
  choice: Mnazareti
  rationale: Neno hili ni kivumishi cha utambulisho kinachotumiwa kama lakabu; “Mnazareti” huhifadhi umbo hilo kuliko kauli ya moja kwa moja ya kijiografia “wa Nazareti.”
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: alianza kupaza sauti na kusema
  rationale: Tafsiri hii huhifadhi maana ya kuanza pamoja na vitenzi vyote viwili vya Kigiriki, kwa mtindo wa asili wa Kiswahili.
- source_word: κράζειν
  choice: kupaza sauti
  rationale: Huonyesha mwito mkubwa na wa dharura bila kudokeza hasira.
- source_word: Υἱὲ Δαυὶδ
  choice: Mwana wa Daudi
  rationale: Huhifadhi umbo halisi na uzito wa cheo hiki cha kifalme na Kimasihi katika simulizi.
- source_word: ἐλέησόν με
  choice: nihurumie
  rationale: Amri hii ya ombi ni ya kawaida, nzito, na wazi katika Kiswahili, nayo huwasilisha ombi la kuonyeshwa rehema.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Nguvu ya Kimasihi ya “Mwana wa Daudi”
  choice: Kuhifadhi “Mwana wa Daudi” kama cheo anachoitiwa Yesu.
  alternative: mzao wa Daudi
  rationale: Katika simulizi la Marko, maneno haya yana maana ya kifalme na Kimasihi; kuyafanya maelezo ya ukoo tu kungepunguza uzito huo.
- issue: Tafsiri ya Ναζαρηνός
  choice: Mnazareti
  alternative: Yesu wa Nazareti
  rationale: Kigiriki kinatumia lakabu ya utambulisho, si kauli iliyo wazi zaidi ya mahali alikotoka; tafsiri kuu inalinda tofauti hiyo huku tanbihi ikitoa namna nyingine ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha, na rahisi kueleweka. “Kupaza sauti” huonyesha mwito wa hadharani wenye dharura, na “nihurumie” huhifadhi uzito wa ombi.
