base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: sw
  text: Na yeyote anayetaka kuwa wa kwanza kati yenu atakuwa mtumwa wa wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wa wote.” Neno la Kigiriki ni doulos, neno lenye nguvu zaidi kuliko neno linalomaanisha “mtumishi” katika mstari uliotangulia; kwa hiyo “mtumwa” limetumiwa hapa ili kuhifadhi tofauti hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: yeyote anayetaka
  rationale: Muundo wa kiwakilishi pamoja na ἄν na hali tegemezi unaonyesha sharti la jumla lisilomhusu mtu maalumu; “yeyote anayetaka” ni Kiswahili cha kawaida kinachohifadhi maana ya hiari.
- source_word: ἐν ὑμῖν
  choice: kati yenu
  rationale: Katika muktadha wa cheo ndani ya kundi la wanafunzi, kirai hiki kinamaanisha nafasi miongoni mwao, si mahali tu.
- source_word: πρῶτος
  choice: wa kwanza
  rationale: Huhifadhi moja kwa moja wazo la kuwa wa kwanza kwa cheo au umuhimu.
- source_word: ἔσται
  choice: atakuwa
  rationale: Ni tafsiri ya moja kwa moja ya wakati ujao, huku muktadha ukiipa kauli nguvu ya maagizo bila kuibadili kuwa “lazima awe.”
- source_word: πάντων
  choice: wa wote
  rationale: Huhifadhi uhusiano wa kujitiisha kwa kila mmoja na upeo wa jumla wa kirai cha Kigiriki.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili ni kali kuliko διάκονος katika mstari uliotangulia; “mtumwa” huhifadhi ongezeko hilo la nguvu na hali ya chini ya mtu aliye chini ya mamlaka ya wengine.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika fundisho kuhusu uanafunzi
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unatofautisha tamaa ya cheo na kujishusha kabisa. Kwa kuwa mstari uliotangulia una διάκονος, linalofaa kutafsiriwa “mtumishi,” kutumia “mtumwa” hapa kunahifadhi tofauti na uzito wa δοῦλος bila kupunguza mvutano wa usemi wa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida na unaeleweka kwa wasomaji wengi; “mtumwa” linahifadhi ukali wa sitiari ya asili.
