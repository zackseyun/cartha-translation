  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: sw
  text: Yakobo na Yohana, wana wa Zebedayo, wakamwendea[a] na kumwambia, “Mwalimu, tunataka utufanyie chochote tutakachokuomba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamkaribia.” Kitenzi cha Kigiriki kinaonyesha kusogea au kwenda alikokuwa mtu huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: wakamwendea Yesu
  rationale: Kitenzi kinaonyesha kusogea au kwenda aliko mtu. Kiswahili cha masimulizi kimetumia wakati wa mfululizo; jina “Yesu” linaweka wazi anayerejelewa na kiwakilishi cha Kigiriki.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: wana wa Zebedayo
  rationale: Huhifadhi utambulisho wa kiambatisho uliomo katika Kigiriki kwa lugha ya kawaida na yenye heshima.
- source_word: λέγοντες αὐτῷ
  choice: na kumwambia
  rationale: Kirai cha Kigiriki chenye hali ya kushiriki kimewasilishwa kwa kitenzi cha mfululizo kinachosikika kwa kawaida katika simulizi la Kiswahili.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa cheo kinachomaanisha mtu anayefundisha.
- source_word: θέλομεν
  choice: tunataka
  rationale: Huwasilisha moja kwa moja nguvu ya ombi lao bila kulifanya lionekane la upole zaidi kuliko lilivyo katika chanzo.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: chochote tutakachokuomba
  rationale: “Chochote” huhifadhi hali ya kutokuwa na kikomo ya ὃ ἐάν, na umbo la wakati ujao hutiririsha ombi kwa Kiswahili cha kawaida.
- source_word: ποιήσῃς ἡμῖν
  choice: utufanyie
  rationale: Huhifadhi maana pana ya ποιέω, ‘kufanya,’ pamoja na walengwa wa tendo, bila kufasiri mapema kuwa ‘kutujalia.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka, na chenye hadhi. Muundo wa masimulizi umetumiwa kwa mtiririko wa kawaida huku maana na msisitizo wa chanzo cha Kigiriki vikihifadhiwa.
