  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: sw
  text: Yesu akamjibu, “Unataka nikufanyie nini?” Yule kipofu akamwambia, “Rabuni[a], nipate kuona tena.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabuni ni neno la Kiaramu la kumwita mtu, lenye maana ya “mwalimu wangu” au “bwana wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: akamjibu
  rationale: Kiswahili cha kawaida huunganisha kishiriki na kitenzi cha kusema katika kauli moja ya asili, “akamjibu,” bila kupoteza maana ya jibu lililoelekezwa kwake.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Unataka nikufanyie nini?
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili, unaonyesha wazi nguvu ya θέλεις (“unataka”) na dative σοι kupitia “nikufanyie.”
- source_word: ὁ ... τυφλὸς
  choice: Yule kipofu
  rationale: Kivumishi kilichotumika kama nomino kinarejelewa kwa Kiswahili kwa njia ya kawaida kama “yule kipofu,” kikimtaja mtu hususa katika simulizi.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Umbo la Kiaramu la kumwita mtu linahifadhiwa kwa unukuzi unaosomeka kwa Kiswahili; tanbihi inaeleza maana yake.
- source_word: ἵνα ἀναβλέψω
  choice: nipate kuona tena
  rationale: Katika muktadha wa uponyaji, ἀναβλέπω humaanisha kurudia kuona. “Nipate kuona tena” huhifadhi maana hiyo pamoja na hali ya kusudi au ombi inayotolewa na ἵνα.
theological_decisions:
- issue: Jinsi ya kutafsiri Ραββουνι kama cheo cha kumwita Yesu
  choice: Kuhifadhi “Rabuni” katika matini na kueleza maana yake katika tanbihi
  alternative: “Mwalimu wangu” au “Bwana wangu”
  rationale: Matini ya Kigiriki yenyewe imehifadhi neno la Kiaramu badala ya kulibadilisha kuwa cheo cha kawaida cha Kigiriki. Kulihifadhi kunadumisha ladha ya kihistoria na namna ya kumwita Yesu bila kulazimisha maana moja ambapo neno linaweza kumaanisha “mwalimu wangu” au “bwana wangu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye “aka-” umetumiwa kwa mtiririko wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya “Rabuni.”
