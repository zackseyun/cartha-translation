  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: sw
  text: Lakini kuketi upande wangu wa kulia au wa kushoto si yangu kutoa[a], bali ni kwa wale ambao kumeandaliwa kwa ajili yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si juu yangu kutoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: kuketi
  rationale: Nomino-kitenzi yenye kiambishi makala imetafsiriwa kwa kitenzi-jina cha Kiswahili, ambacho ni cha kawaida na kinahifadhi tendo la kuketi.
- source_word: ἐκ δεξιῶν μου
  choice: upande wangu wa kulia
  rationale: Hii ni nahau ya mahali upande wa kulia wa mtu; tafsiri hii ni wazi na ya asili bila kuongeza neno 'mkono' lisilosemwa moja kwa moja.
- source_word: ἢ ἐξ εὐωνύμων
  choice: au wa kushoto
  rationale: Muundo mfupi unaendeleza neno 'upande' kutoka kishazi kilichotangulia na kuhifadhi ulinganifu wa kulia na kushoto.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: si juu yangu kutoa
  rationale: Usemi huu unaonyesha kwamba utoaji huo si jambo lililo juu yake kufanya, huku ukihifadhi mvutano wa kauli ya Kigiriki bila kuingiza ufafanuzi wa kitheolojia.
- source_word: ἀλλ’ οἷς
  choice: bali ni kwa wale ambao
  rationale: Kigiriki kina udondoshaji wa maneno yanayoeleweka kutokana na kishazi cha kwanza; Kiswahili kinayakamilisha kwa kiasi kinachohitajika ili maana iwe wazi.
- source_word: ἡτοίμασται
  choice: kumeandaliwa
  rationale: Kauli timilifu tendwa inaonyesha maandalizi yaliyokamilika yenye matokeo yanayoendelea; 'kumeandaliwa' hudumisha hali ya kutajwa bila kumtaja mtendaji.
theological_decisions:
- issue: Ikiwa kauli ya Yesu itafsiriwe kuwa inakataa mamlaka yake kabisa au inaeleza mpaka katika muktadha huu
  choice: si juu yangu kutoa
  alternative: si yangu kutoa
  rationale: Kigiriki kinaeleza mpaka huo bila kuufafanua. Tafsiri haiongezi maneno kama 'isipokuwa kwa mapenzi ya Baba,' hivyo inadumisha mvutano wa kitheolojia uliomo katika andiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, na sentensi tendwa 'kumeandaliwa' haiongezi mtendaji ambaye Kigiriki hakumtaji.
