  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: sw
  text: Nao wale kumi waliposikia hayo, wakaanza kuwakasirikia Yakobo na Yohana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaanza kukasirika kuhusu Yakobo na Yohana” au “wakaanza kukasirika kwa sababu ya Yakobo na Yohana.” Kihusishi cha Kigiriki kinaweza kuonyesha walengwa au sababu ya hasira yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida bila kuongeza maana maalumu ya wakati.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; kishazi cha wakati ni cha kawaida katika Kiswahili. Neno “hayo” linawakilisha jambo lililosikiwa ambalo linaeleweka kutokana na muktadha.
- source_word: οἱ δέκα
  choice: wale kumi
  rationale: Huhifadhi usemi wa Kigiriki “wale kumi” bila kuongeza wazi kwamba walikuwa wanafunzi wengine kumi, ingawa hilo linaeleweka katika muktadha.
- source_word: ἤρξαντο ἀγανακτεῖν
  choice: wakaanza kuwakasirikia
  rationale: “Wakaanza” huhifadhi mwanzo wa mwitikio wao, na “kuwakasirikia” ni usemi wa kawaida wa Kiswahili unaoonyesha hasira kali iliyoelekezwa kwa watu fulani.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: kuwakasirikia Yakobo na Yohana
  rationale: Katika muktadha huu περί inaweza kuonyesha walengwa au sababu ya hasira. Tafsiri kuu inaonyesha hasira iliyoelekezwa kwa Yakobo na Yohana, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: Ἰακώβου καὶ Ἰωάννου
  choice: Yakobo na Yohana
  rationale: Haya ndiyo maumbo sanifu ya majina haya katika matumizi ya Biblia ya Kiswahili.
