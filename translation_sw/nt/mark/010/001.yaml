  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: sw
  text: Akaondoka huko, akaenda katika maeneo ya Yudea na ng’ambo ya Mto Yordani.[a] Makundi ya watu yakamkusanyikia tena, naye, kama ilivyokuwa desturi yake, akawafundisha tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kigiriki yanaweza pia kueleweka kuwa “maeneo ya Yudea yaliyo ng’ambo ya Mto Yordani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν ἀναστὰς
  choice: Akaondoka huko
  rationale: Katika muktadha huu, kitenzi-shirikishi ἀναστὰς kinaonyesha kuinuka ili kuondoka, si ufufuo. Kiswahili cha ‘akaondoka huko’ kinaonyesha kwa kawaida tendo hilo na mahali pa kuanzia.
- source_word: ἔρχεται
  choice: akaenda
  rationale: Huu ni wakati wa sasa wa kihistoria katika simulizi la Marko. Kiswahili sanifu husimulia mfululizo wa matendo kwa ka-; ‘akaenda’ huhifadhi mwendo wa simulizi bila kulazimisha wakati wa sasa usio wa kawaida.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: maeneo ya Yudea
  rationale: ὅρια hapa inamaanisha eneo au sehemu za nchi, si lazima mstari kamili wa mpaka. ‘Maeneo’ ni ya kawaida na yanafaa kwa safari hii.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Mto Yordani
  rationale: πέραν pamoja na hali milikishi huonyesha upande wa pili wa mto. Neno ‘Mto’ linafafanua jina la kijiografia kwa msomaji wa kawaida.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: Umati wa watu ukamkusanyikia
  rationale: Ingawa kitenzi kina wazo la kwenda pamoja, muundo wenye πρὸς αὐτόν unaonyesha watu wakielekea na kukusanyika kwake. ‘Umati wa watu ukamkusanyikia’ ni Kiswahili cha kawaida kinachotoa maana hiyo.
- source_word: ὡς εἰώθει
  choice: kama ilivyokuwa desturi yake
  rationale: Usemi huu unaonyesha tendo alilokuwa akifanya kwa kawaida; tafsiri hii ni ya asili, yenye heshima, na huhifadhi maana ya mazoea.
- source_word: πάλιν ἐδίδασκεν αὐτούς
  choice: akawafundisha tena
  rationale: ‘Tena’ huhifadhi πάλιν ya pili, na ka- huendeleza simulizi huku muktadha wa desturi ukionyesha tendo la kawaida au linalorudiwa.
theological_decisions:
- issue: Wakati wa sasa wa kihistoria katika ἔρχεται
  choice: Umetafsiriwa kwa mfululizo wa kisimulizi ‘akaenda’
  alternative: ‘anaenda’ au ‘anakuja’
  rationale: Tofauti hii si ya mafundisho. Muundo wa ka- ni njia ya kawaida ya Kiswahili ya kuhifadhi uhai na mfululizo wa simulizi bila kufanya wakati wa sasa usikike usio wa asili.
- issue: Uhusiano wa καὶ πέραν τοῦ Ἰορδάνου na ‘maeneo ya Yudea’
  choice: ‘maeneo ya Yudea na ng’ambo ya Mto Yordani’
  alternative: ‘maeneo ya Yudea yaliyo ng’ambo ya Mto Yordani’
  rationale: Kigiriki kinaweza kueleweka kuwa kinataja maeneo mawili yanayohusiana au kuwa ‘ng’ambo ya Yordani’ inafafanua maeneo ya Yudea. Maandishi makuu yanafuata mpangilio wa Kigiriki, na tanbihi inahifadhi uwezekano mwingine bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ka- umetumiwa kuendeleza simulizi kwa ufasaha. ‘Umati wa watu’ ni wa kawaida zaidi kuliko ‘makutano,’ na urudiaji wa ‘tena’ umehifadhiwa mara mbili kama katika Kigiriki.
