  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: sw
  text: Lakini sivyo ilivyo miongoni mwenu.[a] Badala yake, yeyote anayetaka kuwa mkuu miongoni mwenu atakuwa mtumishi wenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini mambo hayako hivyo miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi cha wakati ujao “atakuwa” kinaweza pia kuwa na maana ya “lazima awe” katika muktadha huu: yeyote anayetaka kuwa mkuu miongoni mwenu lazima awe mtumishi wenu.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Lakini sivyo ilivyo miongoni mwenu
  rationale: Kauli hii ya Kiswahili inaonyesha kwa kawaida na kwa heshima kwamba hali au namna iliyotajwa siyo inayopaswa kutawala katika jumuiya ya wanafunzi; “Lakini” linabeba utofautishaji wa δέ.
- source_word: ἀλλ’
  choice: Badala yake
  rationale: Inaonyesha wazi nguvu ya utofautishaji na marekebisho dhidi ya mfano wa watawala uliotajwa kabla.
- source_word: ὃς ἂν θέλῃ
  choice: yeyote anayetaka
  rationale: Inahifadhi maana ya hali ya jumla isiyomhusu mtu mmoja maalumu pamoja na wazo la kutaka lililo katika θέλῃ.
- source_word: μέγας γενέσθαι
  choice: kuwa mkuu
  rationale: Katika Kiswahili cha kawaida, “kuwa mkuu” huwasilisha kwa ufasaha mabadiliko au kufikia cheo cha ukubwa yanayokusudiwa na γενέσθαι, bila kuyawekea maana ya umaarufu pekee.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Inafaa kwa maana ya kijamii na kijumuiya ya kirai hiki na imetumiwa kwa uthabiti katika matukio yake yote mawili.
- source_word: ἔσται ὑμῶν διάκονος
  choice: atakuwa mtumishi wenu
  rationale: “Atakuwa” inahifadhi umbo la wakati ujao la ἔσται, huku “mtumishi” likionyesha huduma ya unyenyekevu bila kuingiza maana ya cheo rasmi cha kanisa.
theological_decisions:
- issue: Nguvu ya kitenzi cha wakati ujao ἔσται katika fundisho la Yesu
  choice: atakuwa mtumishi wenu
  alternative: lazima awe mtumishi wenu
  rationale: Wakati ujao hapa unaweza kuwa na nguvu ya wajibu au agizo, lakini maandishi makuu yanahifadhi umbo la Kigiriki na tanbihi inaeleza uwezekano wa maana ya lazima bila kuufanya kuwa usio na utata.
- issue: Tafsiri ya διάκονος
  choice: mtumishi
  alternative: mhudumu
  rationale: Katika muktadha huu neno linamaanisha mtu anayewatumikia wengine kwa unyenyekevu, si lazima mwenye wadhifa wa kikanisa; “mtumishi” huhifadhi maana hiyo ya kijamii na kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi utofautishaji, uradidi wa “miongoni mwenu,” na mvutano kati ya wakati ujao na nguvu ya wajibu.
