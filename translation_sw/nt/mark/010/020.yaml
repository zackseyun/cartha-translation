  text: Naye akamwambia, “Mwalimu, hayo yote nimeyashika tangu ujana wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: Naye akamwambia
  rationale: δέ ni kiunganishi hafifu cha simulizi, na ἔφη αὐτῷ huwasilishwa kwa Kiswahili cha kawaida kama ‘akamwambia.’ ‘Naye’ huendeleza mtiririko bila kuingiza utofautishaji mkali.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Nomino hii katika hali ya mwito humtaja mtu anayefundisha; ‘Mwalimu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ταῦτα πάντα
  choice: hayo yote
  rationale: Kiwakilishi elekezi pamoja na πᾶς kinarejelea amri zilizotajwa; ‘hayo yote’ ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: ἐφυλαξάμην
  choice: nimeyashika
  rationale: φυλάσσω kuhusu amri humaanisha kuzishika au kuzifuata. Kauli ‘nimeyashika’ hujumlisha mwenendo wa wakati uliopita unaofika hadi wakati wa mazungumzo.
- source_word: ἐκ νεότητός μου
  choice: tangu ujana wangu
  rationale: ἐκ pamoja na jina la wakati huonyesha mwanzo wa kipindi. ‘Tangu ujana wangu’ huhifadhi maana bila kuipanua iwe utoto.
