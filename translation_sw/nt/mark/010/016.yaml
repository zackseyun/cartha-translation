translation:
  language: sw
  text: Akawakumbatia[a], akawa akiwabariki[b] huku akiweka mikono yake juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawachukua mikononi mwake.” Kitenzi cha Kigiriki humaanisha hasa kumchukua mtu mikononi au kumkumbatia.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki kiko katika wakati usiotimilifu, kikionyesha tendo lililoendelea au lililorudiwa; pia kina msisitizo. Kinaweza kueleweka kuwa “aliendelea kuwabariki” au “aliwabariki kwa dhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: akawakumbatia
  rationale: Kitenzi hiki humaanisha kuwachukua au kuwakumbatia mikononi; “akawakumbatia” ni Kiswahili cha kawaida kinachohifadhi ukaribu na upendo wa tendo hilo.
- source_word: κατευλόγει
  choice: kuendelea kuwabariki
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililoendelea au lililorudiwa, na umbo lililosisitizwa linaweza kudokeza baraka ya dhati. “Kuendelea kuwabariki” huhifadhi wazi hali hiyo bila kuongeza mafundisho yasiyokuwamo.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: huku akiwawekea mikono
  rationale: Kirai hiki kinaonyesha tendo lililoambatana na kubariki. “Kuwawekea mikono” ni usemi wa kawaida wa kibiblia na wa Kiswahili unaohifadhi ishara halisi.
- source_word: αὐτὰ ... αὐτά
  choice: wa-
  rationale: Viwakilishi hivi vinawarejelea watoto waliotajwa katika muktadha; upatanisho wa ngeli ya watu katika vitenzi ni wa asili zaidi kuliko kurudia nomino “watoto.”
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi simulizi “aka-” kinaendeleza mfululizo wa matukio kwa njia ya asili katika Kiswahili bila kuongeza maana ya sababu.
theological_decisions:
- issue: Hali ya tendo la Yesu kwa watoto
  choice: Kuhifadhi matendo halisi ya kuwakumbatia, kuwabariki na kuwawekea mikono bila istilahi za kisakramenti au za kiibada zilizoongezwa.
  alternative: Aliwakumbatia na kutamka baraka juu yao; aliwabariki kwa kuwawekea mikono.
  rationale: Aya inaonyesha mapokezi ya upendo na baraka ya Yesu kwa watoto. Tafsiri inapaswa kuyaeleza matendo hayo moja kwa moja bila kuyaingiza katika mfumo wa mafundisho wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. Mpangilio wa vishazi umefuata mantiki ya Kigiriki huku ukitumia muundo wa Kiswahili unaoeleweka kwa urahisi.
