reference: Mark 10:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: sw
  text: Lakini Yesu alipoona hayo, alikasirika na kuwaambia, “Waacheni watoto waje kwangu; msiwazuie, kwa maana Ufalme wa Mungu ni wa watu walio kama hawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Lakini Yesu alipoona hayo
  rationale: Kivumishi-jina cha wakati uliopita kinaonyesha tukio lililosababisha itikio la Yesu; “hayo” linarejelea kwa kawaida kitendo cha wanafunzi katika muktadha uliotangulia, huku “lakini” likihifadhi utofautishaji wa δέ.
- source_word: ἠγανάκτησεν
  choice: alikasirika
  rationale: Kitenzi kinaonyesha hasira au kutoridhika kwa nguvu. “Alikasirika” ni Kiswahili cha kawaida na chenye uzito unaofaa bila kuongeza wazo la hasira isiyodhibitiwa.
- source_word: εἶπεν αὐτοῖς
  choice: kuwaambia
  rationale: Hii ni njia ya kawaida na ya asili ya kuunganisha tendo la kusema na walengwa wake katika Kiswahili.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Waacheni watoto waje kwangu
  rationale: “Waacheni” hapa humaanisha kuwaruhusu, na muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: μὴ κωλύετε αὐτά
  choice: msiwazuie
  rationale: Huhifadhi maana ya kutoweka kizuizi au kutowazuia watoto wasimfikie Yesu.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: kwa maana ... ni wa watu walio kama hawa
  rationale: Muundo huu unaonyesha nguvu ya uwakilishi ya τοιούτων—watu wa aina hii—kwa Kiswahili cha kawaida, bila kudai kwamba unawahusu watoto hawa peke yao.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Ni usemi wa kibiblia uliozoeleka, wazi, na unaohifadhi picha ya ufalme bila kuibana kuwa eneo au utawala pekee.
theological_decisions:
- issue: Maana ya τῶν τοιούτων katika kauli kuhusu Ufalme wa Mungu
  choice: “watu walio kama hawa,” likiwa rejeleo la uwakilishi
  alternative: “Ufalme wa Mungu ni wa hawa” au tafsiri halisi zaidi, “wa walio kama hawa ndio Ufalme wa Mungu”
  rationale: τοιούτων huelekeza kwa watu wa aina kama ya watoto hawa, si lazima kwa watoto waliokuwapo pekee. Tafsiri haiongezi madai kuhusu kutokuwa na hatia kwa watoto au wokovu wao wa moja kwa moja, ambayo mstari hausemi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa ulinganifu bora: wa karibu na Kigiriki lakini si wa kishupavu au usio wa kawaida katika Kiswahili.'
