  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: sw
  text: Nao walikuwa wakimwuliza ikiwa ni halali kwa mwanamume kumtaliki mke[a], wakimjaribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa ni halali kwa mume kumtaliki mkewe.”
    reason: Neno la Kigiriki linaweza kumaanisha “mwanamume” au “mume,” na muktadha unaweza kudokeza “mkewe.”
lexical_decisions:
- source_word: ἐπηρώτων
  choice: walikuwa wakimwuliza
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa; muundo huu unahifadhi maana hiyo.
- source_word: ἔξεστιν
  choice: ni halali
  rationale: Katika mjadala huu wa kisheria kuhusu talaka, neno hili linahusu ruhusa kwa mujibu wa sheria, si uwezekano tu.
- source_word: ἀνδρὶ
  choice: kwa mwanamume
  rationale: Neno linaweza kumaanisha ‘mwanamume’ au ‘mume.’ ‘Mwanamume’ huhifadhi namna ya jumla ya swali bila kufuta uwezekano wa maana ya ‘mume.’
- source_word: γυναῖκα
  choice: mke
  rationale: Katika muktadha wa talaka, γυνή humaanisha mke. Kutotumia kiambishi cha umilikaji katika matini kuu kunafuata muundo usio na umilikaji ulio wazi katika Kigiriki.
- source_word: ἀπολῦσαι
  choice: kumtaliki
  rationale: Ingawa kitenzi kinaweza kumaanisha kuachilia au kufukuza, katika muktadha wa ndoa na sheria humaanisha kutoa talaka.
- source_word: πειράζοντες
  choice: wakimjaribu
  rationale: Huhifadhi maana ya kumtia Yesu katika jaribio au uchunguzi wenye nia mbaya bila kuongeza wazi wazo la kumtega.
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi na kwa Kiswahili huunganisha wahusika hawa na yaliyotangulia kwa njia ya kawaida.
theological_decisions:
- issue: Maana ya ἀνδρὶ katika swali la kisheria kuhusu ndoa
  choice: kwa mwanamume
  alternative: kwa mume
  rationale: Kigiriki kinaweza kueleweka kama ‘mwanamume’ au ‘mume.’ Matini kuu inahifadhi umbo la jumla, huku tanbihi ikionyesha usomaji wa wazi wa uhusiano wa ndoa.
- issue: Uhusiano wa umilikaji katika ἀνδρὶ γυναῖκα
  choice: mwanamume kumtaliki mke
  alternative: mume kumtaliki mkewe
  rationale: Chanzo hakina kiwakilishi cha umilikaji kilicho wazi. Tafsiri kuu haikiongezi, lakini tanbihi inatoa usemi wa kawaida wa Kiswahili unaoeleza uhusiano unaodokezwa na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Walikuwa wakimwuliza’ huhifadhi hali ya tendo linaloendelea; ‘kumtaliki’ ni istilahi ya kawaida na wazi katika muktadha wa ndoa na sheria.
