lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Kwa sababu hiyo
  rationale: Kauli ya kawaida ya Kiswahili inayoonyesha sababu na kuhifadhi nguvu ya ufafanuzi ya usemi wa Kigiriki.
- source_word: καταλείψει
  choice: atamwacha
  rationale: Kitenzi cha wakati ujao kinaeleza kuondoka katika nyumba ya wazazi; “atamwacha” ni cha kawaida na hakiongezi wazo kali la kumtelekeza.
- source_word: ἄνθρωπος
  choice: mwanamume
  rationale: Ingawa neno hili linaweza kumaanisha binadamu kwa ujumla, hapa muktadha wa ndoa na kutajwa kwa “mke wake” unaonyesha mhusika wa kiume.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: baba yake na mama yake
  rationale: Huhifadhi wazazi wote wawili pamoja na vimilikishi vya Kigiriki kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: προσκολληθήσεται
  choice: ataambatana na
  rationale: Hueleza kushikamana kwa karibu na kwa kudumu katika ndoa. Kiswahili cha “ataambatana na” ni cha asili zaidi kuliko umbo la kutendwa la moja kwa moja, huku tanbihi ikihifadhi msisitizo wa kushikamana sana.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: na mke wake
  rationale: Katika muktadha huu γυνή humaanisha mke, si mwanamke kwa ujumla; kihusishi “na” kinakamilisha kitenzi “ataambatana” kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha yenye jinsia katika nukuu kuhusu ndoa
  choice: mwanamume ... mke wake
  alternative: mtu ... mwenzi wake
  rationale: Muktadha unamtaja wazi mhusika wa kiume na mke wake. Tafsiri inahifadhi jozi hiyo badala ya kuigeuza kuwa lugha isiyoonyesha jinsia.
- issue: Nguvu ya uhusiano unaoelezwa na προσκολληθήσεται
  choice: ataambatana na
  alternative: ataunganishwa na / atashikamana na
  rationale: Chaguo kuu linaeleweka kwa urahisi na kuonyesha uhusiano wa karibu bila kueleza ni nani anayefanya tendo la kuunganisha. Tanbihi inaonyesha maana ya kushikamana sana iliyomo katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Naye” huunganisha vitendo viwili kwa mtiririko wa asili bila kubadili maana.
