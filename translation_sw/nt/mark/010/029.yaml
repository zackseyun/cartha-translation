  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: sw
  text: Yesu akasema, “Kweli ninawaambia, hakuna mtu ambaye ameacha nyumba, au ndugu wa kiume, au dada, au mama, au baba, au watoto, au mashamba kwa ajili yangu na kwa ajili ya habari njema,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: akasema
  rationale: Kitenzi hiki kinatanguliza maneno ya Yesu kwa urahisi; ‘akasema’ ni tafsiri ya kawaida na ya asili bila kuongeza maana ya kujibu au kutangaza.
- source_word: Ἀμὴν
  choice: Kweli
  rationale: Katika kauli za Yesu, neno hili la Kisemiti hutanguliza tamko lenye uzito; ‘Kweli’ ni Kiswahili cha kawaida na chenye hadhi katika muktadha huu.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huwasilisha moja kwa moja tamko la Yesu kwa wasikilizaji wengi na ni la asili zaidi katika Kiswahili kuliko ‘ninasema kwenu’.
- source_word: οὐδείς ἐστιν ὃς
  choice: hakuna mtu ambaye
  rationale: Ni muundo wa Kiswahili unaowasilisha kwa uwazi ukanushaji wa jumla wa sentensi ya Kigiriki.
- source_word: ἀφῆκεν
  choice: ameacha
  rationale: Huhifadhi maana ya kuondoka au kuacha katika gharama ya ufuasi bila kuongeza wazo kali zaidi la kutupa au kukataa wajibu kabisa.
- source_word: οἰκίαν
  choice: nyumba
  rationale: Ni kisawe cha moja kwa moja kinachoweza kumaanisha jengo au makao, bila kuhamisha maana moja kwa moja kwenda kwa watu wa nyumbani.
- source_word: ἀδελφοὺς
  choice: ndugu wa kiume
  rationale: Orodha inataja wanaume kisha wanawake kando; ‘ndugu wa kiume’ hudumisha utofauti huo kwa usahihi katika Kiswahili.
- source_word: ἀδελφὰς
  choice: dada
  rationale: Ni neno la kawaida la Kiswahili kwa ndugu wa kike na hutofautishwa hapa na ndugu wa kiume.
- source_word: μητέρα
  choice: mama
  rationale: Kisawe cha moja kwa moja, cha kawaida na chenye hadhi.
- source_word: πατέρα
  choice: baba
  rationale: Kisawe cha moja kwa moja, cha kawaida na chenye hadhi.
- source_word: τέκνα
  choice: watoto
  rationale: Neno hili linajumuisha watoto bila kubainisha jinsia, kama ilivyo katika Kigiriki.
- source_word: ἀγρούς
  choice: mashamba
  rationale: Katika muktadha wa mali iliyoachwa, ‘mashamba’ huwasilisha vizuri maeneo ya kilimo au ardhi inayomilikiwa.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: kwa ajili yangu na kwa ajili ya habari njema
  rationale: Kurudia ‘kwa ajili ya’ huhifadhi sababu mbili zilizoelezwa wazi katika Kigiriki na uzito wa kila moja.
theological_decisions:
- issue: Kutafsiri orodha ya vitu na watu walioachwa bila kuzidisha wazo la kuutelekeza wajibu wa kifamilia
  choice: ameacha nyumba, au ndugu wa kiume, au dada, au mama, au baba, au watoto, au mashamba
  alternative: ametelekeza nyumba ...
  rationale: ‘Ameacha’ hudumisha gharama halisi ya ufuasi inayotajwa katika kifungu bila kuingiza madai kwamba mtu amekataa kabisa wajibu wote wa kimaadili kwa familia.
- issue: Uhusiano kati ya Yesu na habari njema kama sababu za kuacha
  choice: kwa ajili yangu na kwa ajili ya habari njema
  alternative: kwa ajili yangu, yaani kwa ajili ya habari njema
  rationale: Kigiriki kinaunganisha sababu hizi mbili kwa ‘na’; tafsiri haizifanyi kuwa kitu kimoja wala kuzitenganisha zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaofaa kusomwa hadharani. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika katika aya hii.
