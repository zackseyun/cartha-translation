id: MRK.10.25
reference: Mark 10:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: sw
  text: Ni rahisi zaidi kwa ngamia kupita katika tundu la sindano kuliko kwa mtu tajiri kuingia katika ufalme wa Mungu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wengine wamependekeza “kamba” badala ya “ngamia,” lakini matini ya Kigiriki hapa inasema “ngamia.”
    reason: alternative_reading
  - marker: b
    text: “Mtu tajiri” hapa ni umoja katika Kigiriki, lakini kauli hii ina maana ya uwakilishi.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: rahisi zaidi
  rationale: Huwasilisha kwa kawaida hali ya kulinganisha ya neno la Kigiriki, huku ikidumisha nguvu ya mfano uliotiwa chumvi.
- source_word: κάμηλον
  choice: ngamia
  rationale: Maandishi ya Kigiriki yana κάμηλος, yaani ‘ngamia’; pendekezo la ‘kamba’ halifuati neno lililo katika matini hii.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: katika tundu la sindano
  rationale: Kirai hiki humaanisha uwazi wa sindano ya kushonea. ‘Tundu la sindano’ ni Kiswahili cha kawaida na huweka wazi picha ya matini.
- source_word: διελθεῖν
  choice: kupita
  rationale: Kitenzi hiki humaanisha kwenda au kupita kupitia kitu; ‘kupita katika’ kinafaa kwa picha halisi hapa.
- source_word: πλούσιον
  choice: mtu tajiri
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino katika umoja wa kiume. ‘Mtu tajiri’ ni cha asili katika Kiswahili na kinaweza kuwa na maana ya uwakilishi bila kulazimisha jinsia katika matumizi ya Kiswahili.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: kuingia katika ufalme wa Mungu
  rationale: Huhifadhi istilahi kuu ya Injili ‘ufalme wa Mungu’ na mwelekeo unaoonyeshwa na εἰς pamoja na kitenzi ‘kuingia.’
theological_decisions:
- issue: Maana ya picha ya ngamia na tundu la sindano
  choice: Kudumisha picha halisi na kali ya ngamia kupita katika tundu la sindano.
  alternative: Kuifanya ‘Tundu la Sindano’ kuwa jina la lango dogo la Yerusalemu, au kubadili ‘ngamia’ kuwa ‘kamba.’
  rationale: Matini ya Kigiriki yenyewe inatoa picha kali ya jambo lisilowezekana; tafsiri haipaswi kuingiza mapokeo ya baadaye au kupunguza mvutano wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Tundu la sindano’ ni usemi wa moja kwa moja na wa kawaida; tanbihi tofauti ya Kiingereza kuhusu ‘needle’s eye’ haikuhitajika kwa sababu haitoi tofauti halisi ya maana katika Kiswahili.
