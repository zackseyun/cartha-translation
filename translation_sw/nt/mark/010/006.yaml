  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: sw
  text: Lakini, tangu mwanzo wa uumbaji, aliwafanya[a] wa kiume na wa kike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaumba wa kiume na wa kike.” Kitenzi cha Kigiriki hapa ni “alifanya,” ingawa “aliumba” huonyesha msingi wa maneno haya katika simulizi la uumbaji la Mwanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Lakini tangu mwanzo wa uumbaji
  rationale: “Lakini” inaonyesha tofauti na ruhusa iliyotajwa kabla; “tangu mwanzo wa uumbaji” ni Kiswahili cha kawaida kinachoonyesha mahali pa kuanzia katika wakati.
- source_word: ἄρσεν καὶ θῆλυ
  choice: wa kiume na wa kike
  rationale: Maneno haya yanahifadhi ulinganifu wa kijinsia wa lugha ya uumbaji bila kuyabadilisha kuwa istilahi za uhusiano wa kijamii kama “mume na mke.”
- source_word: ἐποίησεν αὐτούς
  choice: aliwafanya
  rationale: Kitenzi ποιέω kimsingi ni “kufanya,” na kiambishi -wa- kinawakilisha αὐτούς, “wao.”
theological_decisions:
- issue: Jinsi ya kutafsiri maneno ya jinsia katika nukuu ya Mwanzo
  choice: wa kiume na wa kike
  alternative: mwanamume na mwanamke
  rationale: Chaguo hili linafuata kwa karibu vivumishi vya Kigiriki vinavyoonyesha tofauti ya kijinsia katika uumbaji, huku likiepuka maana inayoweza kusikika ya “mume na mke.”
- issue: Mtendaji wa tendo la kufanya
  choice: kuacha mtendaji akieleweka katika “aliwafanya”
  alternative: Mungu aliwafanya
  rationale: Kigiriki hakitaji jina “Mungu” katika mstari huu; nafsi ya tatu umoja inaeleweka kutokana na muktadha na nukuu ya Mwanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo “wa kiume na wa kike” umetumiwa kuhifadhi maana ya maneno ya kijinsia ya Kigiriki na kuepuka utata wa “mume na mke.”
