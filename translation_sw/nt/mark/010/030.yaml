  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: sw
  text: ambaye hatapokea mara mia sasa katika wakati huu—nyumba, ndugu wa kiume, ndugu wa kike, mama, watoto, na mashamba, pamoja na mateso—na katika enzi ijayo, uzima wa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβῃ
  choice: atapokea
  rationale: Katika muktadha wa ahadi, λαμβάνω ina maana ya kupokea kile kinachotolewa, si kujitwalia.
- source_word: ἑκατονταπλασίονα
  choice: mara mia
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kiasi kilichoongezeka mara mia bila kutumia lugha nzito.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: sasa, katika wakati huu
  rationale: Hudumisha msisitizo wa wakati wa sasa na tofauti yake na enzi ijayo.
- source_word: οἰκίας
  choice: nyumba
  rationale: Ni tafsiri ya moja kwa moja ya wingi na inadumisha picha halisi ya makao.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: ndugu wa kiume, ndugu wa kike
  rationale: Kigiriki kinataja makundi haya mawili tofauti; tafsiri hii inahifadhi tofauti hiyo kwa uwazi.
- source_word: μητέρας
  choice: mama
  rationale: Neno “mama” linaweza kutumika kwa umoja au wingi katika Kiswahili; hapa muktadha wa orodha unaonyesha wingi wa Kigiriki.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno pana lisilowabainisha watoto kwa jinsia.
- source_word: ἀγρούς
  choice: mashamba
  rationale: Huwasilisha kwa kawaida ardhi inayolimwa au maeneo ya kilimo yanayokusudiwa na ἀγρός.
- source_word: μετὰ διωγμῶν
  choice: pamoja na mateso
  rationale: “Mateso” ni usemi wa kawaida kwa dhiki inayosababishwa na kuwafuata au kuwaadhibu waumini; kifungu hiki kinahifadhi kwamba baraka zinaambatana na suffering.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: katika enzi ijayo
  rationale: αἰών hapa ni kipindi au enzi, na tafsiri hii inadumisha tofauti ya kieskatolojia na wakati huu.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni tafsiri iliyo wazi na ya kawaida ya maana ya kifungu hiki katika muktadha wa kieskatolojia.
theological_decisions:
- issue: Aina ya malipo yaliyoahidiwa wakati huu
  choice: Orodha ya nyumba, mahusiano ya kifamilia na mashamba imetafsiriwa moja kwa moja, huku “pamoja na mateso” ikidumishwa.
  alternative: Kufanya ahadi iwe ya kiroho tu, au kuifanya kuwa ahadi ya ustawi wa mali usio na mateso.
  rationale: Kigiriki kinaweka pamoja malipo mengi ya wakati huu na mateso yanayoendelea; tafsiri haipaswi kuondoa mvutano huo.
- issue: Utambulisho wa ndugu wa kiume na wa kike
  choice: ἀδελφοὺς na ἀδελφὰς zimetafsiriwa tofauti kama “ndugu wa kiume” na “ndugu wa kike.”
  alternative: Kutumia “ndugu” pekee kwa makundi yote mawili.
  rationale: Matini ya Kigiriki inayataja makundi hayo mawili waziwazi, kwa hiyo tofauti hiyo imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni sehemu ya sentensi inayoendelea kutoka mstari uliotangulia; “ambaye hatapokea” umehifadhi uhusiano huo. Vistari virefu vinatenga orodha na kifungu muhimu “pamoja na mateso.”
