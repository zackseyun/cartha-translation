  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: sw
  text: 'Yesu akamtazama, akampenda, akamwambia, “Umepungukiwa na kitu kimoja: nenda, ukauze vyote ulivyo navyo[a], uwape maskini, nawe utakuwa na hazina mbinguni; na njoo, unifuate.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila ulicho nacho.” Usemi wa Kigiriki ὅσα ἔχεις unaweza kutafsiriwa “vyote ulivyo navyo” au “kila ulicho nacho”; muktadha unaonyesha kuwa mali zake zote zinahusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: akamtazama
  rationale: Kitenzi hiki kinaonyesha kuwa Yesu alimwelekezea macho kwa makusudi. ‘Akamtazama’ ni Kiswahili cha kawaida na cha asili bila kuongeza wazo la kumkodolea macho.
- source_word: ἠγάπησεν αὐτόν
  choice: akampenda
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi cha Kigiriki na inadumisha wazi upendo wa Yesu kwa mtu huyo.
- source_word: Ἕν σε ὑστερεῖ
  choice: Umepungukiwa na jambo moja
  rationale: Nomino ‘jambo’ inaongezwa kwa ufasaha wa Kiswahili, huku kauli ikidumisha upungufu mmoja uliotajwa na Yesu.
- source_word: ὕπαγε
  choice: nenda
  rationale: Ni amri ya kawaida ya kuondoka; ‘nenda’ inatoa maana yake moja kwa moja.
- source_word: ὅσα ἔχεις
  choice: vitu ulivyo navyo
  rationale: Usemi huu unarejelea mali za mtu huyo kwa upana. Tafsiri hii ni ya asili na inaacha uwezekano wa kueleza kwa wazi zaidi kuwa ni vitu vyote, kama ilivyoonyeshwa katika tanbihi.
- source_word: πώλησον
  choice: ukauze
  rationale: Hii ni amri ya kuuza; muundo ‘nenda ukauze’ ni wa asili katika Kiswahili.
- source_word: δὸς τοῖς πτωχοῖς
  choice: uwape maskini
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino kumaanisha watu maskini. Kiswahili ‘maskini’ kinadumisha kundi hilo bila kulipanua kuwa wahitaji kwa ujumla.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: hazina mbinguni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya ahadi ya hazina iliyo mbinguni.
- source_word: δεῦρο
  choice: njoo
  rationale: Neno hili ni mwito wa kuja alipo msemaji; ‘njoo’ ni amri ya asili ya Kiswahili.
- source_word: ἀκολούθει μοι
  choice: unifuate
  rationale: Kauli ya Kiswahili inaonyesha wito wa kumfuata Yesu; muktadha wa uanafunzi unadumisha nguvu ya mwendelezo iliyomo katika amri ya wakati uliopo.
theological_decisions:
- issue: Maana ya upendo wa Yesu kwa mtu huyo
  choice: Kauli imetafsiriwa moja kwa moja kuwa ‘akampenda.’
  alternative: Kuidhoofisha iwe kuonyesha wema tu, au kuifanya kuwa istilahi maalumu ya upendo wa kuchaguliwa.
  rationale: Andiko linasema wazi kwamba Yesu alimpenda. Tafsiri haipaswi kupunguza upendo huo wala kuutia maana ya mfumo fulani wa kiteolojia ambayo mstari wenyewe hautaji.
- issue: Upeo wa amri kuhusu mali
  choice: ‘Uza vitu ulivyo navyo’ inadumisha nguvu pana ya amri huku tanbihi ikionyesha tafsiri iliyo wazi zaidi.
  alternative: Kutafsiri moja kwa moja ‘uza kila ulicho nacho,’ au kulegeza amri iwe wito wa ukarimu kwa ujumla.
  rationale: ὅσα ἔχεις inaweza kutolewa kama ‘vitu ulivyo navyo’ au ‘kila ulicho nacho’; muktadha unaonyesha kuwa mali zake zinahusika kwa ujumla, lakini tafsiri haipaswi kugeuza amri hiyo kuwa himizo la jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa amri ‘nenda ukauze … uwape … njoo unifuate’ unasikika kwa asili bila kupunguza ukali wa wito wa Yesu.
