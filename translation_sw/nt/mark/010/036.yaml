  text: Naye akawaambia, “Mnataka niwafanyie nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Naye
  rationale: Muundo huu wa Kigiriki unaendeleza simulizi huku ukimtaja mhusika anayeeleweka kutokana na muktadha. “Naye” ni kiunganishi cha kawaida cha kisimulizi na hakitilii mkazo tofauti isiyokusudiwa.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Kitenzi λέγω ni cha kusema; pamoja na kiwakilishi cha wingi αὐτοῖς, “akawaambia” ni tafsiri ya asili ya Kiswahili. Ingawa yaliyosemwa ni swali, hakuna haja ya kubadili kitenzi kuwa “akauliza.”
- source_word: Τί
  choice: nini
  rationale: Kiwakilishi hiki cha kuuliza kinaanzisha swali la moja kwa moja na kwa kawaida hutafsiriwa “nini.”
- source_word: θέλετε
  choice: mnataka
  rationale: θέλω huonyesha kutaka au kutamani. “Mnataka” ni lugha ya sasa, ya moja kwa moja, na inafaa kwa mazungumzo haya.
- source_word: ποιήσω ὑμῖν
  choice: niwafanyie
  rationale: Kauli tegemezi ποιήσω baada ya θέλετε inaonyesha tendo wanalotaka Yesu alitende, na ὑμῖν hapa ina maana ya manufaa yao. “Niwafanyie” huunganisha maana ya kufanya na ‘kwa ajili yenu’ kwa njia ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja kama ilivyo katika chanzo; hakuna ufafanuzi wa ziada kama “ninyi wawili,” kwa kuwa haujaelezwa wazi katika Kigiriki.
