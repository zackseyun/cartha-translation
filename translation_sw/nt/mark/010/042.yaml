  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: sw
  text: Yesu akawaita kwake, akawaambia, “Mnajua kwamba wale wanaohesabiwa kuwa watawala[a] wa mataifa[b] huwatawala kwa mabavu, na wakuu wao hutumia mamlaka juu yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaoonekana kutawala.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wasio Wayahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita kwake
  rationale: Kauli ya kati inaonyesha kuwaita waje kwake; usemi huu ni wa kawaida na unadumisha mwelekeo huo.
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati uliopita wa kisimulizi, na kiwakilishi cha wingi kinaonyesha wazi walengwa wa maneno.
- source_word: Οἴδατε
  choice: Mnajua
  rationale: Kitenzi hiki kina maana ya hali ya sasa ya kujua; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: wale wanaohesabiwa kuwa watawala
  rationale: δοκοῦντες hapa inaweza kumaanisha wanaotambuliwa au kuonwa kuwa watawala, bila kudai kwamba mamlaka yao ni ya kujifanya tu. Tanbihi inadumisha uwezekano wa maana ya ‘wanaoonekana kutawala.’
- source_word: τῶν ἐθνῶν
  choice: wa mataifa
  rationale: ‘Mataifa’ ni tafsiri ya moja kwa moja inayoweza kumaanisha mataifa kwa jumla au, katika mazingira ya Kiyahudi, watu wasio Wayahudi; tanbihi inaeleza maana hiyo ya pili.
- source_word: κατακυριεύουσιν
  choice: huwatawala kwa mabavu
  rationale: Kitenzi kina dokezo la kuwatawala wengine kwa nguvu au kwa ubabe, si kutawala kwa maana isiyoegemea upande wowote.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: wakuu wao
  rationale: ‘Wakuu’ linaeleza watu wenye cheo, umaarufu, au nguvu bila kuongeza wadhifa maalumu usiotajwa katika Kigiriki.
- source_word: κατεξουσιάζουσιν
  choice: hutumia mamlaka juu yao
  rationale: Tafsiri hii inadumisha maana ya kutumia mamlaka juu ya wengine na pia tofauti ndogo na kitenzi chenye nguvu zaidi katika kishazi kilichotangulia.
theological_decisions:
- issue: Maana ya τῶν ἐθνῶν
  choice: mataifa
  alternative: watu wa mataifa mengine
  rationale: ‘Mataifa’ hudumisha upana wa neno la Kigiriki, huku tanbihi ikionyesha maana inayowezekana ya watu wasio Wayahudi katika mazingira haya.
- issue: Nguvu ya δοκοῦντες
  choice: wanaohesabiwa kuwa watawala
  alternative: wanaoonekana kutawala
  rationale: Tafsiri kuu inaeleza jinsi watu hao wanavyotambuliwa hadharani bila kuamua kwamba mamlaka yao ni ya kuonekana tu; tanbihi inadumisha maana mbadala ya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kwa mabavu’ linafikisha ukali wa κατακυριεύω kwa lugha inayoeleweka, huku ‘hutumia mamlaka juu yao’ likidumisha ulinganifu wa vishazi bila kuvifanya vitenzi viwili kuwa sawa kabisa.
