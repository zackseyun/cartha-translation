  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: sw
  text: Yesu akatazama pande zote, kisha akawaambia wanafunzi wake, “Itakuwa vigumu sana kwa wenye mali[a] kuingia katika ufalme wa Mungu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye fedha,” “wenye utajiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: akatazama pande zote
  rationale: Kauli ya wakati uliopita inayoambatana na kitenzi kikuu inaonyesha Yesu aliwatazama waliokuwa karibu naye kabla ya kusema; Kiswahili hiki ni cha kawaida na kinahifadhi mfuatano huo.
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati wa sasa hapa ni wakati wa sasa wa kisimulizi unaotumiwa sana na Marko. Kiswahili cha kisimulizi kwa kawaida hutumia wakati uliopita; ‘akawaambia’ pia huonyesha kwamba maneno yaliwalenga wanafunzi wake.
- source_word: Πῶς δυσκόλως
  choice: Itakuwa vigumu sana
  rationale: Muundo huu ni mshangao unaosisitiza ugumu, huku wakati ujao wa εἰσελεύσονται ukihifadhiwa kwa ‘itakuwa.’ Neno ‘sana’ linawakilisha msisitizo wa Πῶς katika Kiswahili cha kawaida.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: wenye mali
  rationale: Hili linahifadhi maana ya watu walio na fedha au vitu vya thamani bila kuifanya kuwa lebo finyu ya kijamii.
- source_word: χρήματα
  choice: mali
  rationale: Katika muktadha huu neno linaweza kumaanisha fedha au milki kwa upana; ‘mali’ halipunguzi maana kuwa pesa taslimu pekee.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi wa kawaida, wazi, na unaodumisha taswira ya ufalme katika matumizi ya Marko.
- source_word: εἰσελεύσονται
  choice: kuingia
  rationale: Kitenzi cha wakati ujao kinaelezwa kwa kawaida katika Kiswahili kupitia ‘itakuwa vigumu ... kuingia,’ hivyo mwelekeo wa wakati ujao unabaki wazi.
theological_decisions:
- issue: Je, kauli ya Yesu ielezwe kuwa haiwezekani kabisa kwa wenye mali kuingia katika ufalme wa Mungu, au kuwa ni vigumu sana?
  choice: 'Imeelezwa kuwa ni vigumu sana: “Itakuwa vigumu sana kwa wenye mali kuingia katika ufalme wa Mungu!”'
  alternative: Tafsiri yenye kuifanya ionekane kuwa haiwezekani kabisa.
  rationale: Kigiriki kinatumia δυσκόλως, yaani ‘kwa shida/kwa ugumu,’ wala si neno linalomaanisha kutowezekana. Tafsiri inahifadhi uzito na mvutano wa kauli bila kuongeza hitimisho la kiteolojia ambalo mstari huu wenyewe hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akatazama pande zote’ ni cha asili kuliko tafsiri ya neno kwa neno, na ‘wenye mali’ linaeleweka kwa wasomaji wa kawaida huku likihifadhi upana wa χρήματα.
