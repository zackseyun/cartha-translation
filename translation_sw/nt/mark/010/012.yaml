lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaunganisha kauli hii na kisa sambamba katika mstari uliotangulia.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Kinaitambulisha sentensi ya sharti kwa Kiswahili cha kawaida.
- source_word: αὐτὴ
  choice: mwanamke
  rationale: Kiwakilishi cha kike kimetolewa wazi kwa nomino ya kawaida ili kurejelea kwa uwazi mhusika wa kike na kuhifadhi ulinganifu na mstari uliotangulia.
- source_word: ἀπολύσασα
  choice: atampa talaka
  rationale: Katika muktadha wa ndoa, kitenzi hiki humaanisha kuvunja ndoa; ‘kumpa talaka’ ni usemi wa sasa na wa asili wa Kiswahili.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: mume wake
  rationale: Ingawa ἀνήρ yaweza kumaanisha mwanamume, hapa muktadha wa ndoa unahitaji ‘mume.’
- source_word: γαμήσῃ ἄλλον
  choice: kuolewa na mwanamume mwingine
  rationale: Kiswahili kwa kawaida hutumia ‘kuolewa na’ kwa mhusika wa kike; ‘mwanamume mwingine’ huhifadhi jinsia ya ἄλλον iliyo katika Kigiriki.
- source_word: μοιχᾶται
  choice: anazini
  rationale: Huu ni usemi wa moja kwa moja, wa sasa, na wa kawaida kwa tendo la uzinzi wa ndoa.
theological_decisions:
- issue: Kuhifadhi lugha mahususi ya jinsia katika kauli hii
  choice: mwanamke ... mume wake ... mwanamume mwingine
  alternative: mke akimpa talaka mume wake na kuolewa na mwingine
  rationale: Chanzo kinamtaja wazi mhusika wa kike na mwenzi mwingine wa kiume; tafsiri hii hailainishi wala kugeuza ulinganifu uliokusudiwa na mstari uliotangulia.
- issue: Kutafsiri ἀπολύω kama neno la kuvunja ndoa
  choice: atampa talaka
  alternative: atamfukuza au atamwacha
  rationale: Katika muktadha huu maana ni kuvunja ndoa, si kuondoka au kufukuza tu; ‘kumpa talaka’ huwasilisha nguvu hiyo ya kindoa bila kuongeza sharti lisilokuwapo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja kama kauli ya Kigiriki. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
