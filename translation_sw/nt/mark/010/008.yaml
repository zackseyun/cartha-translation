  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: sw
  text: na hao wawili watakuwa mwili mmoja. Hivyo, wao si wawili tena, bali mwili mmoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: watakuwa
  rationale: Kitenzi εἰμί pamoja na εἰς na kiarifu cha hali ya matokeo kinaonyesha kuingia katika umoja; Kiswahili ‘watakuwa mwili mmoja’ ni cha kawaida na kinahifadhi usemi wa kibiblia.
- source_word: οἱ δύο
  choice: hao wawili
  rationale: Kiashiria ‘hao’ pamoja na ‘wawili’ kinawakilisha kibainishi na namba, na kuhifadhi msisitizo juu ya watu wawili unaorudiwa katika sentensi inayofuata.
- source_word: εἰς σάρκα μίαν
  choice: mwili mmoja
  rationale: ‘Mwili mmoja’ ni usemi wa kibiblia unaoeleweka kwa Kiswahili kuhusu umoja wa ndoa; maana ya kuelekea katika hali hiyo tayari inabebwa na ‘watakuwa’.
- source_word: σάρκα / σάρξ
  choice: mwili
  rationale: Katika muktadha huu σάρξ humaanisha mwili, si ‘asili ya dhambi.’ ‘Mwili mmoja’ huhifadhi kiungo cha maandiko na Mwanzo na pia upana wa usemi kuhusu umoja wa ndoa.
- source_word: ὥστε
  choice: Hivyo
  rationale: Neno hili linatanguliza matokeo au hitimisho linalotokana na kauli iliyotangulia; ‘Hivyo’ ni la kawaida, lenye hadhi, na linaonyesha uhusiano huo wa kimantiki.
- source_word: οὐκέτι
  choice: si ... tena
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba hali ya awali ya kuwa wawili haipo tena.
- source_word: ἀλλὰ μία σάρξ
  choice: bali mwili mmoja
  rationale: ‘Bali’ huhifadhi utofautishaji mkali kati ya kuwa wawili na kuwa mwili mmoja bila kuongeza ufafanuzi wa kiitikadi.
theological_decisions:
- issue: Maana ya ‘mwili mmoja’ katika nukuu ya Yesu kutoka Mwanzo
  choice: Kudumisha usemi wa agano la ndoa ‘mwili mmoja’ bila kuupanua kwa tafsiri.
  alternative: mwili mmoja tu; mtu mmoja; wameungana kingono
  rationale: Mstari wenyewe haupunguzi maana ya usemi huu kuwa ya kimwili pekee wala kusema kwamba wanakuwa mtu mmoja. Kuuhifadhi kama ulivyo kunatunza upana na mvutano wake wa kimaandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi marudio na utofautishaji wa maandishi ya Kigiriki.
