  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: sw
  text: Petro akaanza kumwambia, “Tazama[a], sisi tumeacha kila kitu na tumekufuata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalia” au “Ona.”
    reason: Mbadala hizi zinaonyesha maana zinazowezekana za Ἰδοὺ kama neno la kuvuta fikira.
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: akaanza kumwambia
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida usemi wa Kigiriki wenye maana ya ‘alianza kusema naye,’ huku kiwakilishi αὐτῷ kikijumuishwa katika kitenzi ‘kumwambia.’
- source_word: ὁ Πέτρος
  choice: Petro
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili sanifu.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni kiashiria cha usemi kinachovuta fikira za msikilizaji. ‘Tazama’ kinahifadhi msisitizo wake kwa lugha yenye hadhi na inayoeleweka.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina msisitizo; kukitaja kama ‘sisi’ kunahifadhi msisitizo huo katika Kiswahili.
- source_word: ἀφήκαμεν πάντα
  choice: tumeacha kila kitu
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililofanyika lenye athari ya sasa. ‘Kila kitu’ ni usemi wa kawaida unaowasilisha ujumla wa πάντα bila kuzidisha maana.
- source_word: ἠκολουθήκαμέν σοι
  choice: tumekufuata
  rationale: Wakati timilifu unafaa kwa hali ya Kigiriki ya tendo lililoanzishwa na lenye matokeo yanayoendelea; ‘-ku-’ humtaja Yesu kama yule aliyefuatwa bila kuongeza jina ambalo halijarudiwa katika matini.
theological_decisions:
- issue: Dai la Petro kuhusu walichokiacha kwa ajili ya kumfuata Yesu
  choice: Kulitafsiri moja kwa moja kama dai la Petro mwenyewe
  alternative: Kulainisha kuwa ‘tumejitolea sana’ au kulifafanua kwa kutazamia jibu la Yesu
  rationale: Aya hii inanukuu kauli ya Petro bila kutoa hukumu ya msimulizi juu ya usahihi wake. Tafsiri haikubali wala haipunguzi dai hilo, hivyo inadumisha mvutano wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ lina ladha ya kifasihi lakini bado linaeleweka kwa urahisi; sentensi nyingine imetungwa kwa mtiririko wa kawaida wa mazungumzo.
