  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: sw
  text: Wakafika Yeriko.[a] Yesu alipokuwa akitoka Yeriko pamoja na wanafunzi wake na umati mkubwa, Bartimayo, mwana wa Timayo, kipofu aliyekuwa akiombaomba, alikuwa ameketi kando ya njia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia wakati uliopo wa kihistoria, yaani, “wanafika”; hapa umetafsiriwa kwa wakati uliopita ili simulizi lisikike kwa kawaida katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Wakafika
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati uliopita wa kisimulizi, ambao ni wa kawaida na wa asili katika Kiswahili.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Yesu alipokuwa akitoka
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati mmoja na tendo kuu. Jina “Yesu” limetumiwa badala ya kiwakilishi ili rejeo liwe wazi na la kawaida kwa Kiswahili.
- source_word: ὄχλου ἱκανοῦ
  choice: umati mkubwa
  rationale: ἱκανός hapa huonyesha ukubwa au wingi wa kutosha; “umati mkubwa” ni usemi wazi na wa kawaida.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bartimayo, mwana wa Timayo
  rationale: Mpangilio huu unahifadhi jina la Kisemiti pamoja na maelezo yake kama yalivyo katika chanzo.
- source_word: τυφλὸς προσαίτης
  choice: mwombaji kipofu
  rationale: Maneno yote mawili yanahifadhiwa kwa usemi mfupi na wa kawaida, yakimtambulisha kama mtu kipofu aliyeomba msaada.
- source_word: παρὰ τὴν ὁδόν
  choice: kando ya njia
  rationale: Huu ni usemi wa kawaida unaoonyesha mahali pembeni mwa njia bila kuongeza maana.
- source_word: Ἰεριχώ
  choice: Yeriko
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Utambulisho wa Bartimayo katika simulizi
  choice: Kuhifadhi jina “Bartimayo” na maelezo “mwana wa Timayo” katika matini kuu.
  alternative: Kutumia jina pekee au tafsiri yake pekee.
  rationale: Chanzo chenyewe kinatoa jina na maelezo yake; kuhifadhi yote mawili hudumisha maelezo ya simulizi bila kuyapunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Mwombaji” limetumiwa kwa maana ya mtu anayeomba msaada au sadaka, si mtu anayesali.
