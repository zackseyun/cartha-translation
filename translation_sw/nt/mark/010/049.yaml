  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: sw
  text: Yesu akasimama, akasema, “Mwiteni.” Nao wakamwita yule kipofu, wakamwambia, “Jipe moyo! Inuka; anakuita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: akasimama
  rationale: Kitenzi hiki kwa umbo ni ‘baada ya kusimama,’ na katika muktadha kinaonyesha kwamba Yesu alikoma kutembea. ‘Akasimama’ ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo bila kuwa mzito.
- source_word: Φωνήσατε αὐτόν
  choice: Mwiteni
  rationale: φωνέω hapa ni kumwita mtu aje. ‘Mwiteni’ ni agizo la moja kwa moja na huhifadhi urudiaji wa kitenzi hicho baadaye.
- source_word: φωνοῦσι
  choice: wakamwita
  rationale: ‘Wakamwita’ hudumisha ulinganifu wa kileksika na agizo la Yesu, huku mfululizo wa simulizi ukisomeka kwa kawaida katika Kiswahili.
- source_word: τὸν τυφλὸν
  choice: yule kipofu
  rationale: τυφλός imetumiwa kama nomino ikimtaja mwanamume anayejulikana katika muktadha. ‘Yule kipofu’ ni ya kawaida, wazi, na haiongezi jina lisilokuwamo katika mstari.
- source_word: Θάρσει
  choice: Jipe moyo
  rationale: Agizo hili linatia moyo na kuondoa hofu. ‘Jipe moyo’ ni Kiswahili cha sasa, cha kawaida, na chenye nguvu inayofaa.
- source_word: ἔγειρε
  choice: Inuka
  rationale: Agizo linamtaka ainuke. ‘Inuka’ ni fupi, la moja kwa moja, na linafaa kwa sajili yenye heshima.
- source_word: φωνεῖ σε
  choice: anakuita
  rationale: Wakati uliopo unaonyesha mwito wa Yesu unaotolewa wakati huo. ‘Anakuita’ huwasilisha uharaka huo kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na rahisi kueleweka. Muundo wa viunganishi na urudiaji wa ‘mwita’ umehifadhiwa kwa kadiri inayosikika kwa kawaida katika Kiswahili.
