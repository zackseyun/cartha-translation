  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: sw
  text: Wakamwambia, “Tujalie mmoja wetu aketi upande wako wa kulia na mwingine upande wako wa kushoto katika utukufu wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Tujalie
  rationale: Muundo huu unaonyesha ombi la kupewa nafasi au ruhusa, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: εἷς ... καὶ εἷς
  choice: mmoja wetu ... na mwingine
  rationale: 'Nyongeza ya “wetu” inaweka wazi maana inayodokezwa na wingi wa msemaji: kila mmoja wa hao wawili anataka nafasi moja.'
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: upande wako wa kulia ... upande wako wa kushoto
  rationale: Hii ni tafsiri ya kawaida ya nafasi za heshima kandokando ya mtu, bila kuongeza tafsiri ya kiitikadi.
- source_word: ἐν τῇ δόξῃ σου
  choice: katika utukufu wako
  rationale: Inahifadhi kwa karibu lugha ya chanzo na kutokuamua kimya kimya ikiwa inarejelea ufalme, kutawazwa, au hali nyingine ya utukufu.
theological_decisions:
- issue: Maana ya “katika utukufu wako”
  choice: katika utukufu wako
  alternative: utakapokuwa katika ufalme wako
  rationale: Chanzo kinasema δόξῃ, si βασιλείᾳ; tafsiri iliyochaguliwa inalinda tofauti hiyo na mvutano wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Maneno “Tujalie” na “aketi” yanafaa kwa ombi rasmi bila kuwa ya kizamani.
