  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: sw
  text: Walikuwa njiani[a], wakipanda kwenda Yerusalemu, naye Yesu alikuwa akiwatangulia; walishangaa, na wale waliokuwa wakifuata waliogopa. Akawachukua tena wale Kumi na Wawili kando, akaanza kuwaambia mambo yatakayompata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa safarini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mazingira halisi ya safari na pia unaweza kumaanisha ‘wakiwa safarini.’
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: wakipanda kwenda Yerusalemu
  rationale: Inahifadhi wazo la kupanda kuelekea Yerusalemu, linaloweza kuonyesha mwinuko na lugha ya hija.
- source_word: προάγων αὐτούς
  choice: akitangulia mbele yao
  rationale: Inaonyesha wazi kwamba Yesu alikuwa mbele ya kundi bila kuongeza tafsiri pana ya kuwaongoza.
- source_word: ἐθαμβοῦντο
  choice: walikuwa wameshangaa
  rationale: Inaonyesha mshangao mkubwa au hali ya kutatanishwa bila kuifanya lazima iwe hofu au fadhaa.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: wale waliokuwa wakifuata
  rationale: Inahifadhi muundo wa kishiriki na haibainishi zaidi ya maandishi kundi hilo lilikuwa nani.
- source_word: ἐφοβοῦντο
  choice: waliogopa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, tofauti na mshangao uliotajwa katika kishazi kilichotangulia.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: akawachukua ... wale kumi na wawili kando
  rationale: ‘Kando’ huonyesha kwa lugha ya kawaida kwamba aliwatenga na wengine ili kusema nao.
- source_word: πάλιν
  choice: tena
  rationale: Inaonyesha kurudiwa kwa tendo hilo kwa ufupi na kwa kawaida.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: akaanza kuwaambia
  rationale: Ni Kiswahili cha kawaida kinachohifadhi mwanzo wa tendo la kuwaeleza.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: mambo yaliyokuwa karibu kumpata
  rationale: Inahifadhi ukaribu wa matukio yajayo bila kuingiza dhana yenye nguvu zaidi ya kwamba yalikuwa yameamuliwa na hatima.
theological_decisions:
- issue: Tofauti ya hisia kati ya makundi katika simulizi
  choice: Kutafsiri ἐθαμβοῦντο kama ‘walikuwa wameshangaa’ na ἐφοβοῦντο kama ‘waliogopa.’
  alternative: Kuyatafsiri yote mawili kwa maneno ya jumla yanayochanganya mshangao na hofu.
  rationale: Kigiriki kinatumia vitenzi viwili tofauti na kinaonekana kutofautisha mwitikio wa makundi hayo; tofauti hiyo inadumisha mvutano wa simulizi.
- issue: Utambulisho wa ‘wale waliokuwa wakifuata’
  choice: Kuacha kundi hilo bila kubainishwa zaidi.
  alternative: Kuwaita moja kwa moja ‘wanafunzi wake’ au ‘wafuasi wake.’
  rationale: Kishiriki cha Kigiriki hakitambulishi kundi hilo kwa jina, hivyo tafsiri haipaswi kuamua jambo ambalo maandishi yameacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi fupi ili usomeke kwa urahisi huku mfuatano wa simulizi ukihifadhiwa. Alama ya tanbihi [a] imo katika matini kuu; hakuna tanbihi ya pili kwa sababu mbadala wa Kiingereza ‘going before them’ unawakilishwa moja kwa moja na ‘akitangulia mbele yao,’ ilhali alama [b] ya safu ya mashauriano ya Kiingereza inaonekana kutowiana na mahali pake katika matini.
