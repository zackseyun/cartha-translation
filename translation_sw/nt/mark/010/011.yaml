  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: sw
  text: Naye akawaambia, “Yeyote akimtaliki mke wake na kumwoa mwanamke mwingine[a] anafanya uzinzi dhidi yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwoa mwingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Akawaambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa masimulizi unaosikika kwa kawaida katika Kiswahili, huku kiwakilishi cha wingi kikihifadhiwa katika kiambishi -wa-.
- source_word: Ὃς ἂν
  choice: Yeyote anaye-
  rationale: Muundo huu unaonyesha sharti la jumla lisilomhusu mtu mmoja maalumu; “yeyote anaye-” ni wa kawaida na wazi katika Kiswahili.
- source_word: ἀπολύσῃ
  choice: anayemtaliki
  rationale: Katika muktadha wa ndoa, kitenzi hiki kinamaanisha kuvunja ndoa, si kumwacha au kumfukuza tu.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: mke wake
  rationale: Ingawa γυνή pia linaweza kumaanisha “mwanamke,” kimilikishi na muktadha wa talaka vinahitaji maana ya “mke.”
- source_word: γαμήσῃ ἄλλην
  choice: kumwoa mwingine
  rationale: ἄλλην ni la jinsia ya kike na humaanisha mwanamke mwingine; katika Kiswahili, “kumwoa mwingine” ni fupi na ya kawaida, huku rejeo la kike likieleweka kutokana na kitenzi “oa.”
- source_word: μοιχᾶται
  choice: anafanya uzinzi
  rationale: Huu ni usemi wazi na wa kawaida wa kueleza tendo la uzinzi.
- source_word: ἐπ’ αὐτήν
  choice: dhidi yake
  rationale: Tafsiri hii inahifadhi wazo kwamba tendo hilo ni kosa linalofanywa dhidi ya mke aliyetalikiwa, badala ya kutaja uzinzi kwa ujumla tu.
theological_decisions:
- issue: Kuhifadhi uzito wa ἐπ’ αὐτήν kwamba mke ndiye anayekosewa
  choice: anafanya uzinzi dhidi yake
  alternative: anafanya uzinzi; anazini na mwingine
  rationale: Kirai cha Kigiriki kipo wazi na kinaonyesha kwamba tendo la mume ni kosa dhidi ya mke wake; hakipaswi kuondolewa au kubadilishwa kuwa maelezo ya mwenzi wa uzinzi.
- issue: Ujumla wa Ὃς ἂν katika muktadha unaomhusu mume
  choice: Yeyote anayemtaliki mke wake
  alternative: Mwanamume yeyote anayemtaliki mke wake
  rationale: “Yeyote” huhifadhi hali ya jumla ya muundo wa Kigiriki bila kuongeza nomino isiyosemwa wazi; “mke wake” bado huonyesha kwamba anayezungumziwa hapa ni mume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa kawaida, wazi na wenye heshima. Alama ya tanbihi imewekwa baada ya “mwingine,” ambako ufafanuzi wake wa kileksika unahusika.
