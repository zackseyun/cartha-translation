  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: sw
  text: Lakini wanafunzi walishangazwa na maneno yake. Yesu akajibu tena, akawaambia, “Watoto, jinsi ilivyo vigumu[a] kuingia katika ufalme wa Mungu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale husoma: “Watoto, jinsi ilivyo vigumu kwa wale wanaotumaini mali kuingia katika ufalme wa Mungu.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: walishangazwa
  rationale: Kitenzi cha wakati usiotimilifu kinaonyesha mwitikio wao uliokuwa ukiendelea; ‘walishangazwa’ huhifadhi uzito wa mshangao bila kuutia chumvi.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: na maneno yake
  rationale: Katika Kiswahili, ‘kushangazwa na’ huonyesha kwa kawaida kitu kilichosababisha au kuwa msingi wa mshangao wao, huku kikibaki karibu na Kigiriki.
- source_word: πάλιν ἀποκριθεὶς λέγει αὐτοῖς
  choice: akawaambia tena
  rationale: Muundo halisi ‘akijibu, anawaambia’ ni wa kawaida katika simulizi la Kigiriki lakini ungekuwa mzito katika Kiswahili. ‘Akawaambia tena’ huhifadhi tendo la kusema na πάλιν, na muktadha unaonyesha kuwa Yesu anaitikia mshangao wao.
- source_word: Τέκνα
  choice: Watoto
  rationale: Ni mwito wa upole wa kifamilia. ‘Watoto’ huhifadhi maana hiyo bila kuongeza ‘wangu,’ ambalo halipo katika matini.
- source_word: πῶς δύσκολόν ἐστιν
  choice: jinsi ilivyo vigumu
  rationale: Muundo huu huhifadhi nguvu ya mshangao ya πῶς pamoja na maana ya δύσκολον kwa Kiswahili cha asili na chenye hadhi.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: kuingia katika ufalme wa Mungu
  rationale: Huwasilisha wazi kishazi cha kitenzi-jina na kudumisha usemi wa kibiblia unaoeleweka katika Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo maneno ‘kwa wale wanaotumaini mali’ yaingizwe baada ya ‘jinsi ilivyo vigumu’
  choice: 'Kufuata usomaji mfupi wa SBLGNT: ‘jinsi ilivyo vigumu kuingia katika ufalme wa Mungu’'
  alternative: ‘Watoto, jinsi ilivyo vigumu kwa wale wanaotumaini mali kuingia katika ufalme wa Mungu’
  rationale: Matini chanzo iliyotolewa ina usomaji mfupi. Usomaji mrefu huufanya usemi huo uwahusu hasa wanaotumaini mali na hivyo hupunguza mvutano wa kauli pana ya usomaji mfupi; kwa hiyo umewekwa katika tanbihi kama tofauti ya kimatini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Watoto’ limetumiwa kama mwito wa upole; ‘akawaambia tena’ linaepuka ufuatishaji mgumu wa nahau ya Kigiriki huku likihifadhi mtiririko wa simulizi.
