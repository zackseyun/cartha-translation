  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: sw
  text: Wakasema, “Musa aliruhusu kuandika hati ya talaka[a] na kumwacha mke.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waraka wa talaka.” Kirai cha Kigiriki kinamaanisha hati rasmi ya kisheria ya talaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kumpa talaka.” Kwa tafsiri ya moja kwa moja, “na kumwacha,” likitumika hapa katika muktadha wa talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Wakasema
  rationale: Kauli hii inaendeleza mazungumzo kwa jibu la wale waliotajwa awali. Kiunganishi δέ hakihitaji kutafsiriwa kwa neno tofauti hapa; “Wakasema” ni Kiswahili cha kawaida na wazi.
- source_word: Ἐπέτρεψεν
  choice: aliruhusu
  rationale: Kitenzi ἐπιτρέπω humaanisha kutoa ruhusa. “Aliruhusu” hudumisha tofauti ya kimuktadha kati ya ruhusa na amri.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: βιβλίον ἀποστασίου
  choice: hati ya talaka
  rationale: Kirai hiki kinamaanisha hati rasmi ya kisheria iliyothibitisha talaka. “Hati ya talaka” ni wazi, ya kisasa, na hudumisha maana ya kisheria.
- source_word: γράψαι
  choice: kuandika
  rationale: Hili ndilo tendo la moja kwa moja linaloelezwa na γράφω bila kuongeza wazo la kutunga au kuandaa rasimu.
- source_word: καὶ ἀπολῦσαι
  choice: na kumwacha mke
  rationale: Katika muktadha wa ndoa, ἀπολύω humaanisha kumwacha au kumpa talaka mke. “Kumwacha mke” hudumisha taswira ya kitenzi cha Kigiriki, huku hati ya talaka ikifafanua maana yake ya kisheria. “Mke” imeongezwa kutokana na muktadha kwa uwazi wa Kiswahili.
theological_decisions:
- issue: Asili ya maagizo ya Musa kuhusu talaka
  choice: Musa aliruhusu kuachana badala ya kuamuru jambo hilo moja kwa moja
  alternative: Musa aliamuru mwanamume aandike hati ya talaka
  rationale: Kitenzi Ἐπέτρεψεν kinasema wazi kwamba Musa alitoa ruhusa. Tafsiri inadumisha tofauti hii muhimu katika muktadha kati ya ruhusa hiyo na kusudi la Mungu tangu uumbaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida katika mazungumzo, huku istilahi “hati ya talaka” ikidumisha uzito wa kisheria. Alama zote za tanbihi zimewekwa katika matini kuu.
