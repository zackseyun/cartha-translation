  text: But he answered them, “What did Moses command you?”
translation:
  language: sw
  text: Lakini akawajibu, “Musa aliwaamuru nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki ni cha upole, lakini hapa kinaonyesha badiliko lenye utofautishaji mdogo kutoka swali la Mafarisayo lililotangulia.
- source_word: ἀποκριθεὶς εἶπεν
  choice: akawajibu
  rationale: Muundo huu wa Kigiriki una maana moja ya kujibu; Kiswahili cha kawaida huutoa kwa kitenzi kimoja bila uradidi usio wa lazima.
- source_word: αὐτοῖς
  choice: -wa- katika “akawajibu”
  rationale: Kiwakilishi cha yambwa kinarejelea wale aliowajibu na huingizwa kwa kawaida ndani ya kitenzi cha Kiswahili.
- source_word: Τί
  choice: nini
  rationale: Neno hili linauliza maudhui ya amri na hutafsiriwa kwa kawaida kuwa “nini.”
- source_word: ὑμῖν
  choice: -wa- katika “aliwaamuru”
  rationale: Kiwakilishi hiki kinaonyesha wapokeaji wa amri; Kiswahili hukiwakilisha kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: ἐνετείλατο
  choice: aliwaamuru
  rationale: Kitenzi hiki huonyesha kutoa agizo lenye mamlaka; “aliwaamuru” kinahifadhi uzito wa kisheria wa mazungumzo.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi mapana ya Kiswahili.
theological_decisions:
- issue: Rejeo la mamlaka ya Musa katika jibu la Yesu
  choice: Kutaja “Musa” moja kwa moja kuwa ndiye aliyetoa amri
  alternative: “Sheria ya Musa iliwaamuru nini?” au “Mungu aliwaamuru nini kupitia Musa?”
  rationale: Maandishi ya Kigiriki yanamtaja Musa moja kwa moja bila kuongeza “Sheria” au “Mungu kupitia Musa.” Tafsiri inahifadhi usemi huo bila kuingiza ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akawajibu” ni wa kawaida katika usimulizi, na swali “Musa aliwaamuru nini?” ni wazi na la asili.
