  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: sw
  text: Kweli nawaambia, yeyote asiyeupokea ufalme wa Mungu kama mtoto[a], hakika hataingia ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa namna ya mtoto.” Huenda maneno haya yakadokeza unyenyekevu, imani, au utegemezi wa mtoto, lakini Kiyunani hakitaji wazi ni sifa ipi inayokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Neno hili linaanzisha tamko zito na lenye mamlaka. “Kweli” linafikisha maana hiyo kwa Kiswahili cha kawaida bila kuacha neno la Kiebrania/Kiaramu “Amin” bila kufafanuliwa.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kauli ya Yesu kwa wasikilizaji wake.
- source_word: ὃς ἂν
  choice: yeyote
  rationale: Muundo huu wa Kiyunani una maana ya jumla isiyomhusu mtu mmoja maalumu; “yeyote” unaonyesha wazi nguvu hiyo.
- source_word: μὴ δέξηται
  choice: asiyeupokea
  rationale: δέχομαι inaweza kumaanisha kupokea, kukubali, au kukaribisha. “Kupokea” linafaa kwa ufalme wa Mungu na linadumisha picha ya kupokea badala ya kujipatia kwa juhudi.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Huu ni usemi unaoeleweka na uliozoeleka katika Injili; unaweza kuhusisha utawala wa Mungu na eneo au hali inayotawaliwa naye bila kulazimisha upande mmoja tu.
- source_word: ὡς παιδίον
  choice: kama mtoto
  rationale: ὡς inaonyesha ulinganisho, na παιδίον humaanisha mtoto. Tafsiri hii ni fupi, ya asili, na haiamui ni sifa gani hasa ya mtoto inayokusudiwa.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: hakika hataingia
  rationale: οὐ μή pamoja na kitenzi cha hali tegemezi huonyesha ukanushaji wenye mkazo mkubwa. “Hakika hataingia” linafikisha mkazo huo kwa Kiswahili cha sasa.
- source_word: εἰς αὐτήν
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea ufalme wa Mungu. “Kuingia ndani yake” ni usemi wa asili unaodumisha wazi wazo la kuingia katika ufalme.
theological_decisions:
- issue: Maana ya kuupokea ufalme wa Mungu “kama mtoto”
  choice: Kudumisha tashbihi bila kutaja sifa maalumu ya mtoto.
  alternative: Kufafanua kuwa ni kwa unyenyekevu, imani, au utegemezi wa mtoto.
  rationale: Kiyunani kinatoa ulinganisho lakini hakitaji wazi sifa inayokusudiwa. Tafsiri inaacha maana hiyo wazi ili isilete ufafanuzi wa kimapokeo usiotajwa katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka kwa wasomaji wa kawaida huku ukidumisha uzito wa tamko na kutofafanua kupita kiasi tashbihi ya mtoto.
