id: MRK.10.13
reference: Mark 10:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: sw
  text: Watu walikuwa wakimletea Yesu watoto ili awaguse[a], lakini wanafunzi wakawakemea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wadogo.” Neno la Kigiriki παιδία linaweza kumaanisha watoto kwa upana, wakiwemo watoto wadogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: walikuwa wakimletea
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa. Kitenzi chenye kiambishi cha yambwa ‘-m-’ na mwelekeo ‘-letea’ kinaonyesha kwamba watoto waliletwa kwake.
- source_word: παιδία
  choice: watoto
  rationale: Neno hili linaweza kumaanisha watoto kwa upana, wakiwemo watoto wadogo; ‘watoto’ ni tafsiri ya kawaida isiyobana umri kuliko inavyoruhusu Kigiriki.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: ili awaguse
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi, na ἅπτομαι hapa humaanisha kugusa. Tafsiri hii haiingizi wazo la kuwawekea mikono kutoka vifungu sambamba.
- source_word: ἐπετίμησαν
  choice: wakawakemea
  rationale: ἐπιτιμάω huonyesha kukaripia au kukemea kwa nguvu; ‘kukemea’ huhifadhi uzito huo kwa lugha ya heshima na inayoeleweka.
- source_word: αὐτοῖς
  choice: -wa- katika ‘wakawakemea’
  rationale: Kiwakilishi hiki kinaelekea kuwarejelea watu waliokuwa wakiwaleta watoto. Kiswahili kinahitaji rejeo hilo liwekwe ndani ya kitenzi.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti kati ya kuwaleta watoto na mwitikio wa wanafunzi.
theological_decisions:
- issue: Wanafunzi waliwakemea nani?
  choice: Watu waliokuwa wakiwaleta watoto
  alternative: Watoto wenyewe
  rationale: Kirejeleo kinachoeleweka zaidi ni wahusika wasiotajwa wazi wa προσέφερον, yaani watu waliokuwa wakiwaleta watoto. Hata hivyo, kwa kuwa Kigiriki kimetumia kiwakilishi pekee, tafsiri kuu haiongezi nomino inayofafanua wahusika hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Jina ‘Yesu’ limetumika badala ya kiwakilishi pekee ili kuepuka utata wa kawaida wa mwanzo wa mstari katika Kiswahili, bila kubadili rejeleo.
