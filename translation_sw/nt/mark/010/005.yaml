  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Kwa sababu ya ugumu wa mioyo yenu[b], aliwaandikia[a] amri hii[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Musa, aliyetajwa katika mstari uliotangulia.
    reason: cross_reference
  - marker: b
    text: Au, “ukaidi wa mioyo yenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “agizo hili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: 'Kiunganishi hiki kinaonyesha utofauti wa kiasi katika mazungumzo: Yesu anajibu hoja yao kuhusu Musa.'
- source_word: Πρὸς
  choice: Kwa sababu ya
  rationale: Pamoja na hali ya kushutumu, πρός hapa inaonyesha sababu au hali iliyosababisha amri hiyo kutolewa.
- source_word: σκληροκαρδίαν
  choice: ugumu wa mioyo yenu
  rationale: Huhifadhi taswira ya kibiblia ya moyo kuwa mgumu, huku ikieleza hali ya ukaidi wa ndani kwa Kiswahili kinachoeleweka.
- source_word: ἔγραψεν ὑμῖν
  choice: aliwaandikia
  rationale: Kitenzi cha Kiswahili huhifadhi mtendaji asiye tajwa wazi, kama ilivyo katika Kigiriki, na pia huwasilisha maana ya ‘aliwaandikia ninyi.’
- source_word: ἐντολήν
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida na lenye uzito wa kisheria kwa agizo lenye mamlaka.
- source_word: ταύτην
  choice: hii
  rationale: Kiwakilishi hiki kinaelekeza kwenye amri maalumu iliyotajwa katika mazungumzo.
theological_decisions:
- issue: Kumtaja Musa wazi kama mtendaji wa kitenzi ‘aliandika’
  choice: Kuacha mtendaji ndani ya kitenzi ‘aliwaandikia,’ akirejelea Musa katika mstari uliotangulia
  alternative: ‘Musa aliwaandikia’
  rationale: Kigiriki hakirudii jina la Musa katika mstari huu. Uamuzi huu huhifadhi mtiririko na kiwango cha uwazi cha matini chanzo bila kuongeza mkazo.
- issue: Namna ya kutafsiri σκληροκαρδία bila kupunguza nguvu ya taswira yake
  choice: ‘ugumu wa mioyo yenu’
  alternative: ‘ukaidi wa mioyo yenu’ au ‘mioyo yenu migumu’
  rationale: Tafsiri hii huhifadhi taswira ya moyo na uzito wake wa kimaadili bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ ni simulizi la kawaida na la asili; ‘ugumu wa mioyo’ huhifadhi sitiari ya Kigiriki. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
