  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: sw
  text: Nao walipokuwa tena ndani ya nyumba, wanafunzi walikuwa wakimuuliza kuhusu jambo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao walipokuwa ndani ya nyumba, wanafunzi walikuwa wakimuuliza tena kuhusu jambo hilo.”
    reason: Neno la Kigiriki linalomaanisha ‘tena’ linaweza kueleweka kuwa linahusu kurudi ndani ya nyumba au wanafunzi kuuliza tena.
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi bila kuongeza maana maalumu ya wakati.
- source_word: εἰς τὴν οἰκίαν
  choice: walipokuwa ndani ya nyumba
  rationale: Ingawa kihalisi ni ‘kuingia ndani ya nyumba,’ katika muktadha huu kirai kinaonyesha mahali pa faragha walikokuwa baada ya kurejea ndani. Muundo huu ni wa kawaida katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaweza kuhusishwa na kurejea kwao ndani ya nyumba au na kuuliza kwao mara nyingine; nafasi yake katika tafsiri kuu inadokeza kurejea ndani huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Kibainishi cha Kigiriki kinawatambulisha wanafunzi wanaojulikana katika muktadha; Kiswahili hakihitaji kuongeza ‘wake.’
- source_word: περὶ τούτου
  choice: kuhusu jambo hilo
  rationale: ‘Jambo hilo’ hurejelea kwa kawaida mada ya talaka iliyozungumziwa katika mistari iliyotangulia.
- source_word: ἐπηρώτων
  choice: walikuwa wakimuuliza
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au lililorudiwa, bila kulazimisha maana ya kwamba ndipo walipoanza kuuliza.
- source_word: αὐτόν
  choice: -mu-
  rationale: Kiwakilishi cha yambwa kinamrejelea Yesu na kinaunganishwa kwa kawaida na kitenzi cha Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakimuuliza’ unahifadhi hali endelevu ya kitenzi cha Kigiriki, na tanbihi inaacha wazi utata halisi wa mahali neno ‘tena’ linapohusika.
