  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Hamjui mnaomba nini. Je, mnaweza kunywa kikombe ninachokunywa[a], au kubatizwa kwa ubatizo ninaobatizwa nao[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kikombe” ni sitiari ya kibiblia ya fungu alilopangiwa mtu; hapa hasa kinaashiria mateso yanayomjia Yesu.
    reason: cross_reference
  - marker: b
    text: Au, kwa tafsiri yenye kufafanua zaidi, “kuupitia ubatizo ninaoupitia.” Kigiriki kinarudia maneno yenye mzizi wa “ubatizo” ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawaambia
  rationale: δέ inaonyesha badiliko lenye utofauti mdogo katika mazungumzo; “Lakini” linafaa kwa jibu la Yesu linalosahihisha ombi lao. “Akawaambia” ni Kiswahili cha kawaida na huwakilisha εἶπεν αὐτοῖς kwa ufasaha.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Hamjui mnaomba nini
  rationale: “Hamjui” hudumisha maana ya msingi ya οἴδατε bila kuibadili moja kwa moja kuwa “hamwelewi,” na “mnaomba nini” ni usemi wa kawaida unaodumisha uwazi wa αἰτεῖσθε.
- source_word: δύνασθε
  choice: mnaweza
  rationale: Hueleza uwezo au uwezo wa kustahimili jambo, kama ilivyo katika δύναμαι, kwa lugha ya sasa na ya kawaida.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: kunywa kikombe ninachokunywa
  rationale: Metafora ya “kikombe” imehifadhiwa bila kufafanuliwa ndani ya matini kuwa mateso, na urudiaji wa kitenzi cha kunywa unafuata muundo wa Kigiriki.
- source_word: ἢ
  choice: au
  rationale: Huhifadhi kiunganishi cha uchaguzi katika matini ya SBLGNT bila kukibadili kuwa “na” au kuoanisha kifungu hiki na mapokeo mengine ya hati.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: kubatizwa ubatizo ninaobatizwa
  rationale: Huhifadhi urudiaji wa kimakusudi wa mzizi mmoja katika βάπτισμα na βαπτίζω pamoja na taswira ya ubatizo. Ingawa muundo huo ni mzito kidogo katika Kiswahili, unaeleweka na unadumisha mkazo wa chanzo.
theological_decisions:
- issue: Lugha ya kitamathali ya “kikombe” na “ubatizo”
  choice: Kudumisha tamathali zote mbili katika matini kuu bila kuzifafanua moja kwa moja kuwa mateso, kifo, au ghadhabu ya Mungu.
  alternative: Kutafsiri kwa ufafanuzi kama “kustahimili mateso nitakayostahimili.”
  rationale: Muktadha unaelekeza kwenye mateso yanayomjia Yesu, lakini mstari wenyewe hauyafafanui kikamilifu. Kudumisha tamathali kunahifadhi upana wa maana na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kubatizwa ubatizo ninaobatizwa” umehifadhiwa kwa makusudi ili kuonyesha urudiaji wa Kigiriki; tanbihi inatoa namna laini zaidi ya kuueleza.
