  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: sw
  text: Lakini Yesu akamwambia[a], “Kwa nini unaniita mwema? Hakuna aliye mwema isipokuwa mmoja tu—Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “Unaniita mwema kwa sababu gani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha kwa njia ya kawaida badiliko dogo la mazungumzo na jibu la Yesu kwa maneno ya mtu huyo.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Ni Kiswahili cha kawaida na chenye uwazi kwa kitenzi cha kusema chenye mtendewa.
- source_word: Τί
  choice: Kwa nini
  rationale: Ingawa maana ya msingi ni “nini,” hapa neno hilo limetumiwa kiidioma kuuliza sababu; “Kwa nini” ni ya asili katika Kiswahili.
- source_word: με λέγεις ἀγαθόν
  choice: unaniita mwema
  rationale: Inahifadhi muundo wa kumwita mtu kwa sifa fulani na ni usemi wa kawaida wa Kiswahili.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: mwema
  rationale: Neno lilelile limetafsiriwa kwa uthabiti katika sehemu zote mbili ili kuhifadhi urudiaji na nguvu ya hoja.
- source_word: οὐδεὶς
  choice: Hakuna aliye
  rationale: Inaeleza kwa uwazi na kawaida ukanushaji unaomhusu kila mtu.
- source_word: εἰ μὴ εἷς
  choice: isipokuwa mmoja tu
  rationale: Inahifadhi wazo la kumtenga mmoja pekee na kusisitiza upekee wake kabla ya kumtaja kuwa Mungu.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ndilo jina la kawaida na la asili katika Kiswahili; halihitaji kibainishi tofauti.
theological_decisions:
- issue: Maana inayoweza kudhaniwa kuhusu Kristo katika kauli ya Yesu juu ya wema
  choice: Kauli imetafsiriwa moja kwa moja bila kuongeza maneno yanayodokeza kwamba Yesu anakataa uungu wake au anautangaza waziwazi hapa.
  alternative: Kutafsiri kwa namna inayomfanya Yesu ama akatae kuwa wa kimungu ama adai wazi kuwa wa kimungu katika sentensi hii.
  rationale: Matini yenyewe inapinga au kuchunguza matumizi ya neno “mwema,” lakini haisuluhishi wazi mvutano wote wa kikristo katika mstari huu; tafsiri haipaswi kuingiza hitimisho lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mwema” limetumiwa badala ya “mzuri” kwa kuwa linafaa zaidi kwa sifa ya wema wa mtu katika muktadha huu.
