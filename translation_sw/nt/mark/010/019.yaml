base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: sw
  text: 'Unazijua amri: Usiue mtu bila haki[a], usizini, usiibe, usitoe ushahidi wa uongo, usimnyime mtu kilicho chake[b], waheshimu baba yako na mama yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiue.” Kitenzi cha Kiyunani hapa humaanisha hasa kuua mtu bila haki au isivyo halali, si kuua kwa maana pana kabisa.
    reason: lexical_alternative
  - marker: b
    text: Kauli “usimnyime mtu kilicho chake” inaweza pia kutafsiriwa “usimpunje” au “usimnyang’anye mtu kilicho chake.” Neno hilo humaanisha kumnyima mtu kile kilicho chake au kinachomstahili, mara nyingi kwa udanganyifu au unyonyaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye hadhi katika Kiswahili kwa maagizo ya Mungu, na hapa linadokeza wazi Amri Kumi.
- source_word: οἶδας
  choice: unazijua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, katika Kiyunani cha Koine ina maana ya wakati wa sasa; “unazijua” pia inapatana na ngeli ya “amri.”
- source_word: Μὴ φονεύσῃς
  choice: usiue mtu bila haki
  rationale: φονεύω humaanisha hasa kuua mtu isivyo halali, si kila tendo la kuua. Kauli hii inaleta utofautisho huo kwa Kiswahili cha kawaida bila kuifanya amri kuwa maelezo marefu.
- source_word: Μὴ μοιχεύσῃς
  choice: usizini
  rationale: “Kuzini” ndilo neno la kawaida la kimaadili na kisheria kwa μοιχεύω, yaani kufanya uzinzi.
- source_word: Μὴ κλέψῃς
  choice: usiibe
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na sahihi ya κλέπτω katika orodha ya amri.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: usitoe ushahidi wa uongo
  rationale: Kauli hii huhifadhi maana ya kutoa ushahidi wa uongo, badala ya kuipanua kuwa katazo la kila aina ya kusema uongo.
- source_word: Μὴ ἀποστερήσῃς
  choice: usimnyime mtu kilicho haki yake
  rationale: ἀποστερέω humaanisha kumnyima au kumnyang’anya mtu kile kinachomstahili, mara nyingi kwa udanganyifu au unyonyaji. Tafsiri hii huhifadhi upana huo.
- source_word: Τίμα
  choice: waheshimu
  rationale: Katika muktadha wa amri, “kuheshimu” huonyesha kumpa mtu heshima na uzito unaomstahili, si kuwa na adabu tu. Wingi wa kiambishi cha yambwa ni wa asili kwa kuwa wazazi wawili wanatajwa.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: baba yako na mama yako
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi kuwataja wazazi wote wawili moja kwa moja.
theological_decisions:
- issue: Mtindo wa kunukuu au kudokeza Amri Kumi
  choice: Kutumia lugha inayotambulika kama ya amri huku ukihifadhi umahususi wa maneno ya Kiyunani
  alternative: Kutumia kauli iliyozoeleka zaidi “Usiue” bila ufafanuzi wowote
  rationale: Orodha hii inapaswa kusikika kama amri zinazojulikana, lakini φονεύω haikatazi kila aina ya kuua bila ubaguzi. “Usiue mtu bila haki” huhifadhi uzito wa amri na umahususi wa neno.
- issue: Upeo wa ἀποστερέω
  choice: Kutomwekea neno maana finyu ya udanganyifu wa kifedha pekee
  alternative: Kutafsiri “usidanganye” au “usipunjie” pekee
  rationale: Neno linaweza kujumuisha kumnyima mtu mali, ujira, au jambo jingine linalomstahili. Kauli “kilicho haki yake” huhifadhi upana huo na mvutano wake wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mfuatano mfupi wa vitenzi vya katazo umehifadhi mtindo wa orodha ya amri, huku “ushahidi wa uongo” ikidumisha muktadha wa ushuhuda na “kilicho haki yake” ikiepuka kuifinya ἀποστερέω kuwa kosa la kifedha pekee.
