base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: sw
  text: Wakamwambia, “Tunaweza.” Lakini Yesu akawaambia, “Kikombe ninachokunywa, ninyi mtakinywa; na ubatizo ninaobatizwa nao, ninyi pia mtabatizwa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kikombe” na “ubatizo” hapa ni sitiari za mateso na hatima inayomkabili Yesu; wanafunzi wake pia watashiriki katika hayo.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Tunaweza
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kauli ya wanafunzi, ikihifadhi hali ya sasa ya kitenzi.
- source_word: ποτήριον
  choice: kikombe
  rationale: Inahifadhi taswira ya Kigiriki ya fungu au tukio analopaswa kupitia mtu, bila kuifafanua moja kwa moja kuwa mateso katika matini kuu.
- source_word: πίνω / πίεσθε
  choice: ninachokunywa / mtakunywa
  rationale: Inahifadhi ulinganifu wa kitenzi cha sasa kuhusu Yesu na cha wakati ujao kuhusu wanafunzi.
- source_word: βάπτισμα
  choice: ubatizo
  rationale: Ni neno la kawaida la Kiswahili kwa βάπτισμα na linadumisha sitiari iliyopo katika chanzo.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: ninobatizwa / mtabatizwa
  rationale: Tafsiri inahifadhi urudiaji wa mzizi wa neno ubatizo pamoja na hali tendwa ya vitenzi vya Kigiriki.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawaambia
  rationale: “Lakini” inaonyesha tofauti ndogo kati ya jibu lao la kujiamini na kauli ya Yesu.
theological_decisions:
- issue: Sitiari za kikombe na ubatizo
  choice: Kudumisha sitiari zote mbili katika matini kuu, huku tanbihi ikieleza kuwa zinahusu mateso na yatakayompata Yesu ambayo wanafunzi wake pia watashiriki.
  alternative: Kutafsiri moja kwa moja kuwa mateso, kifo, au kuuawa kwa ajili ya imani.
  rationale: Chanzo kinatumia taswira zenye uzito wa kibiblia; kuzihifadhi huepuka kupunguza maana au kuamua zaidi ya inavyosema matini.
- issue: Uhusiano na ubatizo wa kisakramenti
  choice: Kutumia “ubatizo” lakini kuacha muktadha uonyeshe matumizi yake ya kisitiari.
  alternative: Kutumia “kuzamishwa” au “jaribu kali” ili kuondoa uwezekano wa kueleweka kisakramenti.
  rationale: βάπτισμα ni “ubatizo,” na matumizi ya kisitiari hayafuti neno lenyewe wala mwangwi wake wa kibiblia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tunaweza” ni ya asili zaidi kuliko “Twaweza.” Muundo wa “ubatizo ninaobatizwa” umehifadhiwa kwa makusudi ili kudumisha urudiaji wa chanzo, ingawa ni mzito kidogo katika Kiswahili.
