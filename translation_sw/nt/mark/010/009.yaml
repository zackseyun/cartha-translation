  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: sw
  text: Kwa hiyo, alichokiunganisha Mungu, mwanadamu asikitenganishe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu yeyote asikitenganishe.” Neno la Kigiriki liko katika umoja lakini limetumiwa kwa maana ya kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: alichokiunganisha
  rationale: Kiwakilishi cha uhusiano cha umoja kisicho na jinsia kinarejelea kwa ujumla muungano wa ndoa ulioelezwa; muundo huu wa Kiswahili ni wa kawaida na unaunganika moja kwa moja na kitenzi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu kusudi la Mungu katika ndoa.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni kiima cha kitenzi; Kiswahili hakihitaji kibainishi mbele ya jina Mungu.
- source_word: συνέζευξεν
  choice: amekiunganisha
  rationale: Huwasilisha tendo la Mungu la kuunganisha lililokamilika na ambalo matokeo yake yanaendelea; 'kuunganisha' ni ya kawaida kuliko tafsiri halisi ya 'kutia nira pamoja'.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: Umoja huu umetumiwa kwa maana ya kijumla, yaani binadamu yeyote, si mwanaume pekee. 'Mwanadamu' huhifadhi umoja na maana pana ya neno la Kigiriki kwa Kiswahili cha kawaida.
- source_word: μὴ χωριζέτω
  choice: asikitenganishe
  rationale: Amri ya sasa yenye μή ni katazo. Muundo wa Kiswahili wa hali ya kutegemea yenye ukanushi unatoa katazo hilo kwa ufupi na kwa nguvu inayofaa.
theological_decisions:
- issue: Maana ya kijumla ya ἄνθρωπος katika kauli kuhusu ndoa
  choice: mwanadamu
  alternative: mtu; mwanaume
  rationale: '''Mwanadamu'' huonyesha wazi kwamba katazo linamhusu binadamu yeyote huku likihifadhi umoja wa neno la Kigiriki. ''Mwanaume'' lingeweza kueleweka kimakosa kuwa katazo linawahusu wanaume tu.'
- issue: Kinachorejelewa na ὃ
  choice: alichokiunganisha Mungu
  alternative: wale ambao Mungu amewaunganisha
  rationale: Umbo lisilo na jinsia la Kigiriki linarejelea muungano kama kitu kizima, si tu watu wawili kama wingi; tafsiri inahifadhi mtazamo huo bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama kauli ya asili; 'Kwa hiyo' huhifadhi uhusiano wa kimantiki, na 'mwanadamu' huepuka dhana kwamba katazo ni la jinsia ya kiume pekee.
