id: MRK.10.34
reference: Mark 10:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: sw
  text: Nao watamdhihaki, watamtemea mate, watampiga mijeledi na kumuua; na baada ya siku tatu[a] atafufuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku tatu.” Kigiriki cha Marko kinasema “baada ya siku tatu,” ilhali vifungu vingine vinaeleza wakati huo kuwa “siku ya tatu.”
    reason: Inaonyesha usemi mwingine unaowezekana na kuhifadhi tofauti ya maneno ya Marko dhidi ya vifungu sambamba bila kuyapatanisha kimya kimya.
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: watamdhihaki
  rationale: Kitenzi hiki kinaonyesha kumfanyia mtu dhihaka kwa dharau. “Watamdhihaki” ni Kiswahili cha kawaida, chenye heshima, na kinahifadhi ukali wa tendo hilo.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: watamtemea mate
  rationale: Muundo wa Kigiriki unaonyesha kumtemea yeye kama tendo la kumwaibisha. “Watamtemea mate” ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: μαστιγώσουσιν
  choice: watampiga mijeledi
  rationale: Hili linaonyesha kipigo cha mijeledi. Usemi huu unaeleweka kwa urahisi zaidi kuliko istilahi nzito au za kale.
- source_word: ἀποκτενοῦσιν
  choice: kumuua
  rationale: Kitenzi hiki humaanisha moja kwa moja kuua. “Kumuua” hakiongezi wazo la hukumu rasmi wala tathmini nyingine ya kimaadili isiyosemwa wazi na neno lenyewe.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: baada ya siku tatu
  rationale: μετά ikiwa na hali ya accusative kwa kawaida humaanisha “baada ya.” Tafsiri hii inahifadhi moja kwa moja namna Marko alivyoeleza wakati bila kuilinganisha kimya kimya na vifungu vinavyosema “siku ya tatu.”
- source_word: ἀναστήσεται
  choice: atafufuka
  rationale: Umbo hili la kitenzi linaweza kutafsiriwa kwa maana isiyotendwa ya kuinuka kutoka kwa wafu. “Atafufuka” ni usemi wa asili wa Kiswahili na halibadili sentensi kuwa “atafufuliwa”; pia haliongezi neno “tena,” ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Namna ya kueleza ufufuo
  choice: atafufuka
  alternative: atafufuliwa; atafufuka tena
  rationale: “Atafufuka” linahifadhi muundo na maana ya ἀναστήσεται bila kuugeuza kuwa kauli ya kutendwa. Hivyo halifuti ushuhuda wa sehemu nyingine kuhusu Mungu kumfufua Yesu, wala haliongezi “tena,” ambalo halipo katika maandishi haya.
- issue: Wakati wa ufufuo
  choice: baada ya siku tatu
  alternative: siku ya tatu; katika siku tatu
  rationale: Maandishi ya Marko yanasema kwa namna ya moja kwa moja “baada ya siku tatu.” Tofauti ya namna ya kusema katika vifungu vingine haijasawazishwa kimya kimya; uwezekano wa usemi mwingine umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Mfuatano wa matendo umewekwa kwa mtindo wa asili wa Kiswahili huku ukidumisha nguvu ya matendo ya Kigiriki. Alama ya tanbihi imewekwa baada ya “baada ya siku tatu,” ambako maelezo yake yanahusika.
