  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: sw
  text: Kwa maana hata Mwana wa Adamu hakuja kutumikiwa, bali kutumikia na kutoa uhai wake kuwa fidia kwa ajili ya wengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa fidia badala ya wengi.” Neno la Kigiriki lililotafsiriwa “kwa ajili ya” linaweza kuwa na maana ya kuchukua nafasi ya au ya ubadilishanaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: “Kwa maana” linaonyesha kuwa kauli hii inatoa msingi wa mafundisho yaliyotangulia, huku “hata” likihifadhi mkazo wa καί.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja la Yesu lenye mwangwi wa Danieli; tafsiri hii inalinda hadhi yake kama jina maalumu na uhusiano wake na Maandiko.
- source_word: οὐκ ἦλθεν
  choice: hakuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, na vitenzi-jina vinavyofuata vinaeleza kusudi la kuja kwake.
- source_word: διακονηθῆναι
  choice: kutumikiwa
  rationale: Hifadhi hali ya kutendwa na pia mzizi uleule unaorudi katika διακονῆσαι, hivyo kufanya ugeuzaji wa kimantiki usikike wazi.
- source_word: ἀλλὰ διακονῆσαι
  choice: bali kutumikia
  rationale: “Bali” linaweka upinzani mkali, na “kutumikia” linalingana kwa asili na “kutumikiwa.”
- source_word: δοῦναι
  choice: kutoa
  rationale: Hii ndiyo maana ya msingi ya kitenzi katika muktadha huu na haiongezi wazo jembamba lisilotajwa wazi.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: uhai wake
  rationale: Hapa ψυχή linamaanisha uhai unaotolewa hadi kufa, si nafsi isiyo ya mwili peke yake.
- source_word: λύτρον
  choice: fidia
  rationale: “Fidia” ni neno la kawaida na lenye uzito unaofaa kwa bei inayotolewa ili kuleta ukombozi au kuachiliwa.
- source_word: ἀντὶ πολλῶν
  choice: kwa ajili ya wengi
  rationale: Hii ni Kiswahili cha kawaida katika sentensi kuu; kwa kuwa ἀντί linaweza kusisitiza ubadilishanaji au kuchukua nafasi, maana hiyo ya wazi zaidi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya ἀντί katika kauli kuhusu fidia
  choice: kwa ajili ya wengi katika matini kuu, huku maana ya kuchukua nafasi ikielezwa katika tanbihi
  alternative: badala ya wengi
  rationale: ἀντί kwa kawaida lina wazo la ubadilishanaji au kuchukua nafasi. Matini kuu inabaki ya kawaida kwa wasomaji wa Kiswahili, na tanbihi inalinda nguvu hiyo bila kuamua zaidi ya ushahidi wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa “kutumikiwa—kutumikia” umehifadhiwa ili kuonyesha ugeuzaji wa Yesu kwa uwazi; “uhai” limetumiwa badala ya “nafsi” ili kuwasilisha maana ya kujitoa hadi kufa.
