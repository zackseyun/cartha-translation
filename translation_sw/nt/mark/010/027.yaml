  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: sw
  text: Yesu akawakazia macho, akawaambia, “Kwa wanadamu haiwezekani, lakini si kwa Mungu, kwa maana mambo yote yanawezekana kwa Mungu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: akawakazia macho
  rationale: Huonyesha kutazama kwa makini na moja kwa moja, si kuona kwa kawaida tu.
- source_word: Παρὰ ἀνθρώποις
  choice: Kwa wanadamu
  rationale: Katika muktadha huu παρά huonyesha upande au uwezo wa wanadamu; Kiswahili hiki ni cha asili na kinadumisha ulinganisho na Mungu.
- source_word: ἀδύνατον
  choice: haiwezekani
  rationale: Huwasilisha kutowezekana kwa jambo bila kuongeza maelezo ambayo hayapo katika chanzo.
- source_word: πάντα
  choice: mambo yote
  rationale: Ni tafsiri pana ya neuter plural inayofaa Kiswahili, huku upeo wake ukiachwa uamuliwe na muktadha.
- source_word: γὰρ
  choice: kwa maana
  rationale: Hutoa sababu ya kauli iliyotangulia na kuhifadhi nguvu ya kiunganishi cha Kigiriki.
theological_decisions:
- issue: Upeo wa “mambo yote yanawezekana”
  choice: Kauli imeachwa kwa upana wake wa kimuktadha bila ufafanuzi wa ziada.
  alternative: Kuibana wazi kuwa inahusu wokovu pekee au kuipanua kuwa ahadi ya jambo lolote.
  rationale: Chanzo chenyewe kinasema πάντα bila kiongezi; muktadha unaongoza maana, hivyo tafsiri haipaswi kuingiza msimamo wa kimadhehebu.
- issue: Ulinganisho kati ya uwezo wa wanadamu na wa Mungu
  choice: “Kwa wanadamu ... lakini si kwa Mungu”
  alternative: “Wanadamu hawawezi ... lakini Mungu anaweza.”
  rationale: Muundo uliochaguliwa unafuata kwa karibu utofautishaji wa chanzo na kudumisha mvutano wa kauli bila kuibadili kuwa maelezo huru.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawakazia macho” ni usemi unaoeleweka kwa urahisi na unaonyesha uzito wa mtazamo wa Yesu; sentensi nzima inabaki fupi na ya kukumbukwa.
