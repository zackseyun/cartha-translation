  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποβαλὼν τὸ ἱμάτιον αὐτοῦ ⸀ἀναπηδήσας ἦλθεν πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: sw
  text: Naye akatupa vazi lake kando, akaruka juu, akamwendea Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβαλών
  choice: akalitupa kando
  rationale: Kitenzi hiki kinaonyesha tendo la haraka na la makusudi la kuondoa au kutupa kitu; “akalitupa kando” kinadumisha nguvu ya simulizi bila kudokeza kwa lazima kwamba alilitupilia mbali kabisa.
- source_word: ἱμάτιον
  choice: vazi lake
  rationale: Ἱμάτιον hapa ni vazi, kwa kawaida vazi la nje. “Vazi” ni neno la kawaida, lenye heshima, na linaepuka kubainisha umbo la vazi ambalo Kigiriki hakilitaji waziwazi.
- source_word: ἀναπηδήσας
  choice: akaruka juu
  rationale: Neno hili linaonyesha mwendo wa ghafla na wenye nguvu. “Akaruka juu” linaonyesha hamasa na haraka ya tendo hilo kwa Kiswahili cha kawaida.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: akamwendea Yesu
  rationale: Muundo huu unaonyesha kusogea kuelekea kwa Yesu na kumfikia; “akamwendea Yesu” ni wa asili katika simulizi la Kiswahili.
- source_word: δὲ
  choice: Naye
  rationale: δέ ni kiunganishi hafifu kinachoendeleza simulizi. “Naye” linaunganisha sentensi na lililotangulia bila kuongeza wazo la upinzani mkali.
theological_decisions: []
