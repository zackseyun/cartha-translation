  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: sw
  text: Kwa maana hakujua ajibu nini[a], maana waliingiwa na hofu kubwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jibu gani atoe.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine zinaweza kusema, “walikuwa na hofu kubwa”; Kigiriki kinaonyesha kwa karibu zaidi kwamba waliingia katika hali ya hofu kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: hakujua
  rationale: Kitenzi οἶδα hapa kinaeleza kujua au kufahamu; katika muktadha huu ‘hakujua’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: τί ἀποκριθῇ
  choice: ajibu nini
  rationale: ἀποκρίνομαι humaanisha kujibu, na muundo huu unaonyesha swali la ndani kuhusu jibu ambalo Petro angetoa.
- source_word: ἔκφοβοι
  choice: hofu kubwa
  rationale: ἔκφοβος huonyesha hofu kali kuliko kuogopa kwa kawaida; ‘hofu kubwa’ ni Kiswahili cha asili kinachobeba uzito huo.
- source_word: ἐγένοντο
  choice: waliingiwa na
  rationale: γίνομαι inaonyesha kuingia katika hali fulani; ‘waliingiwa na hofu kubwa’ ni usemi wa kawaida unaohifadhi mabadiliko ya hali bila kuwa mgumu.
- source_word: γὰρ ... γὰρ
  choice: kwa maana ... maana
  rationale: Kurudia ‘maana’ kunahifadhi kazi ya ufafanuzi ya γάρ katika vifungu vyote viwili huku sentensi ikibaki ya asili kwa Kiswahili.
theological_decisions:
- issue: Kiima cha kifungu cha wingi
  choice: waliingiwa na hofu kubwa
  alternative: aliingiwa na hofu kubwa
  rationale: Kivumishi ἔκφοβοι na kitenzi ἐγένοντο viko katika wingi. Katika muktadha, kiima kinaelekea kuwa Petro pamoja na wenzake, si Petro peke yake; kwa hiyo wingi umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ajibu nini’ ni rahisi kueleweka, na ‘waliingiwa na hofu kubwa’ ni usemi wa kawaida unaohifadhi nguvu ya hofu pamoja na wazo la kuingia katika hali hiyo.
