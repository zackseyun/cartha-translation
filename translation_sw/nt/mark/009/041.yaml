  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: sw
  text: Kwa maana yeyote atakayewapa kikombe cha maji ya kunywa kwa jina la kuwa ninyi ni wa Masihi,[a] amin, nawaambia, hakika hatapoteza thawabu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ninyi ni wa Masihi.”
    reason: 'Usemi wa Kigiriki ἐν ὀνόματι ὅτι χριστοῦ ἐστε unaweza kueleweka kwa maana ya sababu au msingi wa tendo: kwa sababu wapokeaji ni wa Masihi.'
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Kwa maana yeyote atakaye-
  rationale: “Kwa maana” inaendeleza uhusiano wa γάρ na fundisho lililotangulia, na “yeyote atakaye-” ni njia ya kawaida ya Kiswahili ya kuonyesha muundo usio na mhusika maalumu.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: atakayewapa kikombe cha maji mnywe
  rationale: Huhifadhi maana ya ποτίζω, ‘kumpa mtu kitu anywe,’ kwa Kiswahili cha kawaida bila kuifanya ποτήριον kuwa zaidi ya ‘kikombe.’
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: kwa sababu ninyi ni wa Masihi
  rationale: 'Katika muktadha huu, ἐν ὀνόματι pamoja na ὅτι inaonyesha msingi au sababu ya tendo: wapokeaji wanatambuliwa kuwa wa Masihi. Kiswahili hiki ni cha asili, huku tanbihi ikihifadhi uwezekano wa kufuata kwa karibu zaidi usemi ‘kwa jina.’'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: amin, nawaambia
  rationale: “Amin” huhifadhi uzito na umbo maalumu la tamko la Yesu; “nawaambia” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: hakika hatapoteza
  rationale: “Hakika” pamoja na ukanushi wa wakati ujao huwasilisha ukanushi wenye mkazo wa οὐ μή na aoristi tegemezi.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: thawabu yake
  rationale: Katika muktadha wa maadili na matokeo ya kiroho, “thawabu” huwasilisha μισθός kwa usahihi kuliko “mshahara.”
theological_decisions:
- issue: Maana ya Χριστός katika usemi wa umilikaji χριστοῦ ἐστε
  choice: ninyi ni wa Masihi
  alternative: ninyi ni wa Kristo
  rationale: Χριστός inatumiwa hapa kama cheo cha Yesu; “Masihi” huhifadhi maana ya cheo hicho, na “ni wa” huonyesha uhusiano wa umilikaji au uaminifu bila kuufafanua kupita kiasi.
- issue: Uhusiano wa ἐν ὀνόματι na ὅτι χριστοῦ ἐστε
  choice: kwa sababu ninyi ni wa Masihi
  alternative: kwa jina, yaani kwamba ninyi ni wa Masihi
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa kitendo kinafanywa kwa msingi wa utambulisho wa wanafunzi kuwa wa Masihi. Tafsiri kuu inatanguliza Kiswahili cha kawaida; tanbihi inahifadhi muundo wa karibu zaidi na uwezekano wake wa tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Amin” limehifadhiwa kama tamko maalumu la kusisitiza ukweli; sentensi nyingine imetungwa kwa mtiririko wa kawaida na unaoeleweka kwa wasomaji wengi.
