base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: sw
  text: Wakamleta kwake. Roho[a] ilipomwona, mara moja ikamtia mtoto huyo degedege[b]; akaanguka chini na kuvingirika huku na huku, huku akitokwa na povu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho chafu”; muktadha mpana huitambulisha roho hiyo kuwa chafu, lakini aya hii yenyewe inasema tu “roho.”
    reason: alternative_reading
  - marker: b
    text: Au, “ikamtikisa kwa nguvu kwa degedege.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: wakamleta
  rationale: Kitenzi hiki kinaeleza kumleta mtoto kwa Yesu; “wakamleta” ni sahihi na ya kawaida katika simulizi la Kiswahili.
- source_word: πρὸς αὐτόν
  choice: kwake
  rationale: Kirai hiki kinaonyesha kumwelekea mtu, ambaye katika muktadha ni Yesu. “Kwake” huhifadhi kiwakilishi cha maandishi ya Kigiriki.
- source_word: ἰδὼν αὐτόν
  choice: ilipomwona
  rationale: Muundo wa wakati unaonyesha kwamba tendo lililofuata lilitokea roho ilipomwona Yesu.
- source_word: τὸ πνεῦμα
  choice: Roho[a]
  rationale: Aya yenyewe inasema tu “roho”; haiongezi neno “chafu” wala kuitaja moja kwa moja kuwa pepo.
- source_word: εὐθὺς
  choice: mara
  rationale: “Mara” huonyesha kutokea bila kuchelewa na ni neno la kawaida katika simulizi la Kiswahili.
- source_word: συνεσπάραξεν
  choice: ikamtia yule mtoto degedege
  rationale: Kitenzi kinaeleza kusababisha mikazo mikali ya mwili. Tafsiri hii ni wazi na ya kawaida bila kudokeza kwamba mwili uliraruliwa.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: akaanguka chini
  rationale: Huwasilisha mfuatano wa tendo kwa Kiswahili cha kawaida na kuweka wazi kwamba aliyeanguka ni mtoto.
- source_word: ἐκυλίετο
  choice: akavingirika huku na huku[b]
  rationale: Hali ya kitenzi cha Kigiriki inaonyesha tendo lililoendelea; “huku na huku” huwasilisha mwendo huo unaorudiwa.
- source_word: ἀφρίζων
  choice: huku akitokwa na povu
  rationale: Huwasilisha hali iliyoambatana na kuvingirika bila kuongeza “kinywani,” jambo ambalo halijasemwa wazi katika Kigiriki.
theological_decisions:
- issue: Utambulisho wa τὸ πνεῦμα
  choice: roho
  alternative: roho chafu; pepo
  rationale: Ingawa muktadha mpana huitambulisha kuwa roho chafu, aya hii yenyewe inasema “roho” tu. Tafsiri haiongezi maelezo ya kitafsiri katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Muundo umetumia viwakilishi vya asili pale vinapoeleweka katika muktadha, huku “yule mtoto” ikirudiwa ili kuzuia mkanganyiko kuhusu anayepatwa na degedege na kuanguka.
