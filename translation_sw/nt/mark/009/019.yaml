  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: sw
  text: Naye akawajibu, akasema, “Enyi kizazi kisichoamini[a], nitakuwa pamoja nanyi mpaka lini? Nitawavumilia mpaka lini?[b] Mleteni kwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kizazi kisicho na imani.” Neno la Kigiriki linaweza kumaanisha kutokuamini au kutokuwa na uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Au “Nitawastahimili mpaka lini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Naye akawajibu, akasema
  rationale: Muundo huu unatoa kwa Kiswahili fasaha utangulizi wa jibu la Yesu. Wakati uliopo wa kihistoria katika λέγει umehamishwa kuwa wakati wa masimulizi unaotumika kwa kawaida katika Kiswahili, bila kubadili kitendo cha kusema.
- source_word: γενεὰ ἄπιστος
  choice: kizazi kisichoamini
  rationale: Hili linaonyesha hasa ukosefu wa kuamini au kumtumaini Mungu katika muktadha huu, huku maana inayoweza kuwa ukosefu wa imani au uaminifu ikihifadhiwa katika tanbihi.
- source_word: ἕως πότε
  choice: mpaka lini
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili kwa swali la muda unaoendelea.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: nitakuwa pamoja nanyi
  rationale: Unawasilisha kuwapo kwa Yesu akiwa pamoja nao, kwa Kiswahili cha kawaida, bila kuongeza wazo lisilokuwapo la kuondoka mara moja.
- source_word: ἀνέξομαι ὑμῶν
  choice: nitawavumilia
  rationale: Kitenzi hiki kinabeba maana ya kuendelea kustahimili au kuvumilia watu, na kinahifadhi uzito wa kukerwa kwa Yesu bila kutumia lugha ya mtaani.
- source_word: φέρετε αὐτὸν πρός με
  choice: Mleteni kwangu
  rationale: Ni amri fupi na ya kawaida ya kumleta mvulana kwa Yesu; kiambishi cha nafsi kinahifadhi rejeleo la kiume katika muktadha.
theological_decisions:
- issue: Maana ya ἄπιστος katika karipio la Yesu
  choice: kisichoamini
  alternative: kisicho na imani au kisicho na uaminifu
  rationale: Muktadha unakazia kushindwa kuamini au kutumaini, lakini neno la Kigiriki linaweza pia kugusa kutokuwa na imani au uaminifu. Tanbihi inalinda upana huo bila kulazimisha hitimisho finyu la kimadhehebu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Enyi” linafaa kwa mwito wa moja kwa moja kwa kundi, na “Mleteni kwangu” ni amri ya kawaida iliyo wazi. Mpangilio wa tanbihi umewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya ἄπιστος na [b] baada ya ἀνέξομαι.'
