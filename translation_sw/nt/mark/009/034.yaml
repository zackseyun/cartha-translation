  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: sw
  text: Lakini wao walikaa kimya, kwa sababu njiani walikuwa wamebishana wao kwa wao kuhusu ni nani aliyekuwa mkubwa kuliko wengine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσιώπων
  choice: wakakaa kimya
  rationale: Kauli ya wakati usiotimilika inaonyesha kwamba waliendelea kuwa kimya baada ya kuulizwa; usemi huu ni wa kawaida na unaonyesha ukimya uliodumu.
- source_word: διελέχθησαν
  choice: walikuwa wamebishana
  rationale: Muktadha wa kushindania hadhi unaunga mkono maana yenye mvutano ya “kubishana” kuliko “kujadiliana.” Muundo huu pia unaonyesha kuwa mabishano yalitangulia ukimya wao.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Unahifadhi maana ya tendo la kurudiana miongoni mwao kwa Kiswahili cha kawaida.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni tafsiri ya asili na yenye kueleweka ya mazingira ya safari.
- source_word: τίς μείζων
  choice: ni nani aliyekuwa mkuu zaidi
  rationale: “Mkuu zaidi” huhifadhi umbo la ulinganisho la μείζων, bila kulibadili kuwa umbo la kiwango cha juu kama “mkuu kuliko wote.”
- source_word: οἱ δὲ
  choice: Lakini wao
  rationale: δέ inaonyesha utofauti wa kiasi na swali la Yesu lililotangulia.
- source_word: γὰρ
  choice: kwa sababu
  rationale: Inaeleza wazi sababu ya wao kukaa kimya.
theological_decisions:
- issue: Ulinganisho μείζων dhidi ya usemi wa kiwango cha juu
  choice: ni nani aliyekuwa mkuu zaidi
  alternative: ni nani aliyekuwa mkuu kuliko wote
  rationale: Chanzo cha Kigiriki kina kivumishi cha ulinganisho. Tafsiri inahifadhi ulinganisho huo huku ikitumia Kiswahili cha kawaida, bila kuamua kimyakimya kwamba lazima kiwe kiwango cha juu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakakaa kimya” na “walikuwa wamebishana” ni misemo inayoeleweka kwa urahisi; mpangilio unabaki karibu na mantiki ya Kigiriki.
