  text: For whoever is not against us is for us[a].
translation:
  language: sw
  text: Kwa maana yeyote ambaye hayuko dhidi yetu yuko upande wetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yuko kwa ajili yetu.” Kirai cha Kigiriki ὑπὲρ ἡμῶν kinaweza pia kumaanisha “kwa niaba yetu” au “upande wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: yeyote
  rationale: Kiwakilishi hiki kimetumiwa kwa maana ya jumla; “yeyote” kinawasilisha kwa Kiswahili cha kawaida wazo la mtu yeyote anayehusika.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ linaunganisha kauli hii na yaliyotangulia kwa kutoa sababu au ufafanuzi; “Kwa maana” ni kiunganishi cha asili na chenye hadhi katika muktadha huu.
- source_word: οὐκ ἔστιν
  choice: asiye
  rationale: Muundo wa Kiswahili “asiye dhidi yetu” unatoa kwa ufupi ukanushaji wa hali unaoelezwa na οὐκ ἔστιν.
- source_word: καθ’ ἡμῶν
  choice: dhidi yetu
  rationale: κατά pamoja na jenitivi hapa huonyesha upinzani; “dhidi yetu” ni tafsiri wazi na ya moja kwa moja.
- source_word: ὑπὲρ ἡμῶν
  choice: upande wetu
  rationale: Katika ulinganifu na “dhidi yetu,” kirai hiki kwa kawaida humaanisha kuwa upande wa mtu au kumuunga mkono. “Upande wetu” ni cha asili kwa Kiswahili na kinahifadhi maana hiyo, huku tanbihi ikitaja maana mbadala ya kutenda kwa ajili yetu.
- source_word: ἐστιν
  choice: yuko
  rationale: Kwa kuwa kinachorejelewa ni mtu, “yuko” ni kopula ya Kiswahili inayofaa katika kirai “yuko upande wetu.”
theological_decisions:
- issue: Upeo wa uhusiano unaoelezwa na “dhidi yetu” na “upande wetu”
  choice: 'Kuhifadhi nafsi ya kwanza wingi: “dhidi yetu” na “upande wetu.”'
  alternative: Kupanua maana kuwa “dhidi ya Mungu,” “upande wa Mungu,” au “anaunga mkono huduma yetu.”
  rationale: Kigiriki kinatumia ἡμῶν (“yetu”) waziwazi. Tafsiri haipanui upeo wa kauli kwa maelezo ya kiteolojia ambayo hayajasemwa, bali huacha muktadha uongoze ufasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Ulinganifu wa “dhidi yetu / upande wetu” umehifadhiwa kwa mtindo wa asili wa Kiswahili.
