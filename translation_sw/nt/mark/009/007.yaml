  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: sw
  text: 'Kisha wingu likatokea, likawafunika, na sauti ikatoka katika wingu hilo: “Huyu ni Mwanangu mpendwa; msikilizeni[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msikieni.” Amri hii ina maana ya kumsikiliza kwa makini na kuyazingatia anayosema, si kusikia sauti tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: likatokea / ikatoka
  rationale: Kitenzi hiki huonyesha kutokea kwa tukio. Pamoja na ‘wingu,’ ‘likatokea’ ni Kiswahili cha kawaida; pamoja na sauti na kirai ἐκ τῆς νεφέλης, ‘ikatoka’ huwasilisha kwa kawaida kwamba sauti ilitoka katika wingu.
- source_word: νεφέλη
  choice: wingu
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino; haiongezewi ufafanuzi wa kitheolojia.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: likawafunika
  rationale: Huwasilisha tendo la wingu kuwafunika au kuwazunguka kwa kivuli kwa Kiswahili cha kawaida, bila kuongeza maelezo yasiyokuwapo katika maandishi.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: sauti ikatoka katika wingu hilo
  rationale: ‘Sauti’ inafaa kwa tamko linalosikika, na ‘ikatoka katika’ huhifadhi nguvu ya ἐκ bila kuongeza kitenzi cha kusema ambacho hakijaandikwa wazi.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Mwanangu mpendwa
  rationale: Ni tafsiri ya moja kwa moja na yenye hadhi ya uhusiano wa mwana na upendo unaotajwa katika tamko hilo.
- source_word: ἀκούετε αὐτοῦ
  choice: msikilizeni
  rationale: Amri hii inamaanisha kumsikiliza kwa makini na kuyazingatia anayosema, si kusikia sauti tu; hata hivyo haitafsiriwi moja kwa moja kuwa ‘mtiini,’ jambo ambalo lingefinya maana yake.
theological_decisions:
- issue: Tamko la Mungu kuhusu utambulisho wa Yesu
  choice: “Huyu ni Mwanangu mpendwa”
  alternative: Kuongeza ufafanuzi wa kidoktrini kuhusu maana ya kuwa Mwana
  rationale: Kigiriki kinatoa tamko la moja kwa moja kwamba Yesu ni Mwana wa Mungu. Tafsiri inadumisha uzito huo wa kikristo bila kuingiza maelezo ya kimadhehebu.
- issue: Nguvu ya ἀκούετε αὐτοῦ
  choice: “msikilizeni”
  alternative: “msikieni” au “mtiini”
  rationale: ‘Msikilizeni’ huhifadhi maana ya kusikia kwa makini na kuitikia, bila kuipunguza kuwa kusikia tu au kuifafanua kupita kiasi kuwa kutii pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia mfululizo wa vitenzi vya ‘ka-’ ili aya isomeke kwa kawaida, huku tamko la mbinguni likibaki la moja kwa moja na lenye uzito.
