  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: sw
  text: Akawaambia, “Aina hii haiwezi kutoka kwa njia yoyote isipokuwa kwa maombi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za baadaye zinasema, “kwa maombi na kufunga.”
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Aina hii
  rationale: γένος humaanisha aina au kundi. Muktadha unaonyesha roho mchafu, lakini Kigiriki hakirudii wazi neno ‘roho’; kwa hiyo ‘Aina hii’ huhifadhi ufupi na kutoongeza nomino.
- source_word: ἐν οὐδενὶ
  choice: kwa njia yoyote
  rationale: Kirai hiki kinaeleza njia au chombo, na katika sentensi hasi ‘kwa njia yoyote’ ni Kiswahili cha kawaida kinachohifadhi maana ya kutokuwapo kwa njia nyingine yenye kufaa.
- source_word: δύναται ἐξελθεῖν
  choice: haiwezi kutoka
  rationale: Muundo huu unaonyesha kutoweza kutoka. ‘Kutoka’ ni wa kawaida katika muktadha wa roho mchafu bila kuongeza wazo la kufukuzwa ambalo halijaelezwa moja kwa moja katika kirai hiki.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: εἰ μὴ hutaja ubaguzi pekee baada ya kauli hasi; ‘isipokuwa’ huwasilisha uhusiano huo wazi.
- source_word: ἐν προσευχῇ
  choice: kwa maombi
  rationale: Kirai kinaonyesha njia au namna. ‘Kwa maombi’ huhifadhi nguvu ya kihusishi ἐν na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Kama maneno ‘na kufunga’ yajumuishwe
  choice: kwa maombi
  alternative: kwa maombi na kufunga
  rationale: Matini ya SBLGNT ina προσευχῇ (‘maombi’) pekee. Usomaji mrefu wenye ‘na kufunga’ unapatikana katika baadhi ya hati za baadaye, hivyo umewekwa katika tanbihi badala ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ huendeleza mtiririko wa simulizi; ‘Aina hii’ huhifadhi kutotajwa wazi kwa ‘roho’ katika Kigiriki.
