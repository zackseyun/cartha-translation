  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: sw
  text: Akawaambia, “Ni kweli, Eliya huja kwanza na kurejesha yote. Na imeandikwaje kuhusu Mwana wa Adamu kwamba apitie mateso mengi na adharauliwe?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ahesabiwe kuwa si kitu.” Kitenzi cha Kigiriki kina maana ya kudharauliwa au kutendwa kana kwamba hana thamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Akawaambia
  rationale: Hutoa kwa Kiswahili cha kawaida tendo la kusema na walengwa wake, huku kiambishi ‘Aka-’ kikidumisha mtiririko wa simulizi.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: Ni kweli, Eliya huja kwanza
  rationale: ‘Ni kweli’ huonyesha nguvu ya μὲν bila kulazimisha kiunganishi cha utofautishaji; wakati wa sasa huwasilisha kauli ya jumla kwa Kiswahili cha asili.
- source_word: ἀποκαθιστάνει πάντα
  choice: na kurejesha mambo yote
  rationale: ‘Kurejesha’ huhifadhi maana ya kurudisha au kuweka tena katika hali inayofaa; ‘mambo yote’ hudumisha upana wa πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: imeandikwaje kuhusu Mwana wa Adamu
  rationale: ‘Imeandikwaje’ hudumisha fomula ya Maandiko na umbo la swali; ‘kuhusu’ huwakilisha ἐπί katika maana ya habari inayomhusu mtu.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Biblia ya Kiswahili na linahifadhi umuhimu wake bila kulifafanua kiitikadi.
- source_word: πολλὰ πάθῃ
  choice: atateseka sana
  rationale: Ni Kiswahili cha kawaida kinachowasilisha uzito na wingi wa mateso unaodokezwa na πολλὰ kwa njia ya asili.
- source_word: ἐξουδενηθῇ
  choice: kudharauliwa
  rationale: Huwasilisha hali ya kutendwa ya mtu kuonekana asiye na thamani na kutendewa kwa dharau, bila kuongeza wazo la kukataliwa ambalo halitajwi moja kwa moja.
theological_decisions:
- issue: Uhusiano kati ya kazi ya Eliya ya kurejesha na mateso ya Mwana wa Adamu
  choice: 'Kudumisha sentensi ya pili kama swali la balagha: ‘Basi, imeandikwaje...?’'
  alternative: Kulainisha kuwa maelezo ya kiitikadi au kuongeza ‘lakini’ ili kueleza uhusiano huo.
  rationale: Kigiriki kinaweka pamoja urejesho na mateso kwa namna yenye mvutano na ya kuuliza; tafsiri haipaswi kutatua kimyakimya uhusiano huo.
- issue: Rejeo la ‘Mwana wa Adamu’
  choice: Kuhifadhi jina la cheo ‘Mwana wa Adamu.’
  alternative: ‘Masihi,’ ‘mwanadamu,’ au ufafanuzi unaomtaja Yesu moja kwa moja.
  rationale: Usemi wa Kigiriki ni jina la cheo lenye maana nyingi za kibiblia; kulifafanua kungeondoa utata wake halisi na kuingiza tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akawaambia’ na ‘imeandikwaje’ ni miundo ya kawaida ya simulizi na mazungumzo ya kibiblia; ‘Ni kweli’ huonyesha μὲν kwa uwazi bila kuwa nzito. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
