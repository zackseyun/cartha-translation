base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: sw
  text: Lakini Yesu akamwambia, “‘Ukiweza’?[a] Mambo yote yanawezekana kwa anayeamini.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki, “Hilo la ‘ukiweza’?” Yesu anarudia kwa msisitizo na kuyahoji maneno ya baba katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Anayeamini” pia inaweza kutafsiriwa “aliye na imani” au “anayemtumaini.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘Ukiweza’?
  rationale: Kibainishi cha jinsia ya kati Τὸ kinatanguliza maneno yaliyonukuliwa na kuonyesha kwamba Yesu anayarudia kwa msisitizo maneno ya baba katika mstari uliotangulia. Swali lenye nukuu linafikisha changamoto hiyo kwa Kiswahili cha kawaida.
- source_word: δύνῃ
  choice: ukiweza
  rationale: Kitenzi δύναμαι humaanisha kuwa na uwezo au kuweza; katika usemi huu wa moja kwa moja, “ukiweza” ni tafsiri ya asili na fupi.
- source_word: πάντα
  choice: mambo yote
  rationale: Wingi wa jinsia ya kati una maana ya kila jambo au vitu vyote; “mambo yote” huhifadhi upana na uzito wa usemi.
- source_word: δυνατὰ
  choice: yanawezekana
  rationale: Katika muundo huu wa kiarifu, δυνατά humaanisha kwamba mambo hayo yanaweza kutendeka; “yanawezekana” ni Kiswahili cha kawaida.
- source_word: τῷ πιστεύοντι
  choice: kwa anayeamini
  rationale: Kishiriki cha wakati uliopo humtaja mtu anayeamini kwa maana ya jumla. “Kwa anayeamini” huhifadhi muundo huo bila kuugeuza kuwa jina la kudumu kama “muumini.”
- source_word: πιστεύοντι
  choice: anayeamini
  rationale: πιστεύω hapa inaweza kueleza kuamini, kuwa na imani, au kutumaini. “Anayeamini” ni tafsiri ya msingi na ya moja kwa moja, huku tanbihi ikihifadhi vivuli vingine vya maana.
theological_decisions:
- issue: Upeo wa kauli “mambo yote yanawezekana”
  choice: Kauli pana imeachwa kama ilivyo bila kuongeza masharti katika matini kuu.
  alternative: “Kwa msaada wa Mungu, mambo yote yanawezekana kwa anayeamini” au ufafanuzi mwingine unaoweka wazi uwezo wa Mungu.
  rationale: Kigiriki hakiongezi hapa maneno “kwa Mungu.” Ingawa muktadha mpana wa Biblia huzuia kauli hii kueleweka kuwa uwezo huru wa mwanadamu, kuongeza ufafanuzi huo katika matini kungetatua mvutano ambao chanzo chenyewe kimeuacha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akamwambia” ni simulizi la kawaida la Kibiblia, na “mambo yote yanawezekana” huhifadhi ufupi na nguvu ya kauli ya Kigiriki.
