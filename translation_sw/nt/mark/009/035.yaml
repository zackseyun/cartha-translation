reference: Mark 9:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: sw
  text: Kisha akaketi, akawaita wale kumi na wawili, akawaambia, “Mtu yeyote akitaka kuwa wa kwanza, atakuwa wa mwisho wa wote na mtumishi wa wote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: akaketi
  rationale: Kitenzi hiki kinaonyesha Yesu aliketi, hali ya kawaida ya mwalimu aliyekuwa tayari kutoa mafundisho.
- source_word: ἐφώνησεν
  choice: akawaita
  rationale: Hutoa maana ya kuwaita wale kumi na wawili waje kwake bila kuongeza wazo lisilo katika maandishi.
- source_word: λέγει
  choice: kuwaambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita ili sentensi iwe ya asili na wazi.
- source_word: πρῶτος
  choice: wa kwanza
  rationale: Hudumisha picha ya cheo au ukuu inayolinganishwa na kuwa wa mwisho.
- source_word: ἔσχατος
  choice: wa mwisho
  rationale: Ni kinyume cha moja kwa moja cha “wa kwanza” na huhifadhi msisitizo wa usemi.
- source_word: διάκονος
  choice: mtumishi
  rationale: Katika muktadha huu neno linamaanisha anayewahudumia wengine, si lazima cheo rasmi cha kanisa.
theological_decisions:
- issue: Nguvu ya kauli ἔσται
  choice: atakuwa
  alternative: anapaswa kuwa
  rationale: Tafsiri ya wakati ujao huhifadhi umbo la kauli ya Kigiriki na mvutano wake; haibadilishwi kimya kimya kuwa amri au wajibu.
- issue: Upeo wa πάντων
  choice: wote
  alternative: wengine wote
  rationale: “Wote” hufuata maandishi kwa karibu na kuhifadhi dai pana la Yesu bila kulipunguza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa maneno umefanywa wa asili kwa Kiswahili huku marudio ya “wote” yakihifadhiwa kwa sababu ni sehemu ya msisitizo wa Kigiriki.
