base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: sw
  text: Walipokuwa wakishuka kutoka mlimani, aliwaagiza wasimsimulie mtu yeyote mambo waliyoyaona, mpaka Mwana wa Adamu atakapofufuka[a] kutoka miongoni mwa wafu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata kwa karibu zaidi muundo wa Kigiriki: “isipokuwa wakati Mwana wa Adamu atakapofufuka.”'
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “kutoka miongoni mwa wafu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: Walipokuwa wakishuka
  rationale: Kauli hii inaonyesha tendo lililokuwa likiendelea wakati wa agizo; ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: ὄρους
  choice: mlimani
  rationale: ὄρος kwa kawaida humaanisha mlima, na umbo la mahali “mlimani” linafaa katika muktadha wa kushuka kutoka huko.
- source_word: διεστείλατο
  choice: aliwaagiza
  rationale: Kitenzi hiki kinaonyesha kutoa agizo lenye mamlaka. “Aliwaagiza” ni cha asili na chenye uzito bila kutumia lugha ya kizamani.
- source_word: ἵνα μηδενὶ
  choice: wasimweleze mtu yeyote
  rationale: Huhifadhi katazo la kumwambia mtu hata mmoja na kulitoa kwa Kiswahili cha kawaida.
- source_word: ἃ εἶδον
  choice: mambo waliyokuwa wameyaona
  rationale: Huwakilisha kiwakilishi cha wingi kisicho na jinsia na kuonyesha kwamba walikuwa wameyaona mambo hayo kabla ya kupewa agizo.
- source_word: διηγήσωνται
  choice: wasimweleze
  rationale: Kitenzi kina maana ya kusimulia au kueleza; “kueleza” ni kifupi, cha kawaida, na kinafaa pamoja na kitu kinachoelezwa.
- source_word: εἰ μὴ ὅταν
  choice: ila wakati
  rationale: Hufuata kwa karibu muundo wa Kigiriki wa “isipokuwa wakati,” huku tanbihi ikitoa maana ya muda iliyo ya kawaida zaidi katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Kiswahili cha Biblia na huhifadhi mwangwi wake wa kimaandiko bila kulifafanua kupita kiasi.
- source_word: ἀναστῇ
  choice: atakapokuwa amefufuka
  rationale: Hutaja tukio la wakati ujao ambalo litakuwa limetimia kufikia wakati unaokusudiwa na agizo.
- source_word: ἐκ νεκρῶν
  choice: kutoka miongoni mwa wafu
  rationale: Huhifadhi wazo mahususi la kutoka katikati ya watu waliokufa, badala ya kutaja hali ya kifo pekee.
theological_decisions:
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: “Mwana wa Adamu” huhifadhi cheo cha Yesu kilichozoeleka na mwangwi wake unaowezekana wa Danieli, bila kukifanya usemi wa jumla kuhusu ubinadamu.
- issue: Nguvu ya wakati katika εἰ μὴ ὅταν
  choice: ila wakati Mwana wa Adamu atakapokuwa amefufuka
  alternative: mpaka Mwana wa Adamu atakapokuwa amefufuka
  rationale: Tafsiri kuu huhifadhi muundo wa Kigiriki wa “isipokuwa wakati”; mbadala wa “mpaka” unaeleza kwa kawaida zaidi athari ya muda ya agizo bila kulazimisha maana hiyo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetunza mwendo wa simulizi na nguvu ya agizo, huku tanbihi zikihifadhi tofauti kati ya muundo halisi wa wakati na usemi wa kawaida zaidi.
