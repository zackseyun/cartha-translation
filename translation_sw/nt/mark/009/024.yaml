  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: sw
  text: Mara baba wa mtoto akapaza sauti, akasema, “Ninaamini; nisaidie katika kutokuamini kwangu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθύς
  choice: Mara
  rationale: Katika simulizi, “Mara” huonyesha kwamba baba alijibu bila kukawia na kudumisha mwendo wa haraka unaopatikana mara nyingi katika Marko.
- source_word: κράξας
  choice: akapaza sauti
  rationale: Huonyesha kauli yenye nguvu, iliyotolewa kwa sauti kubwa na kwa hisia kali, bila kuifanya kuwa kilio cha machozi.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: baba ya mtoto
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kirai cha Kigiriki. “Mtoto” huhifadhi upana wa maana wa παιδίον, ingawa muktadha mpana unaonyesha kuwa ni mwana wa kiume.
- source_word: ἔλεγεν
  choice: na kusema
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali isiyotimilika, hapa kinatambulisha maneno ya moja kwa moja; “kusema” ni cha asili na hakiongezi wazo la kurudia-rudia lisilo lazima.
- source_word: Πιστεύω
  choice: Ninaamini
  rationale: Huwasilisha moja kwa moja maana ya kuamini na kudumisha uhusiano wa kimakusudi na ἀπιστία katika ombi linalofuata.
- source_word: βοήθει
  choice: nisaidie
  rationale: Amri ya wakati wa sasa ni ombi la moja kwa moja la msaada. Kiambishi “ni-” humtaja mwombaji kwa njia ya kawaida katika Kiswahili.
- source_word: μου τῇ ἀπιστίᾳ
  choice: katika kutokuamini kwangu
  rationale: Muundo huu huhifadhi ἀπιστία kama hali ya kutokuamini iliyo ya baba mwenyewe na huacha mvutano kati ya kuamini na kutokuamini usikike wazi.
theological_decisions:
- issue: Mvutano kati ya Πιστεύω na ἀπιστίᾳ
  choice: Ninaamini; nisaidie katika kutokuamini kwangu!
  alternative: Ninaamini; nisaidie kwa sababu nina imani haba!
  rationale: Tafsiri kuu inadumisha kitendawili cha kukiri imani huku mtu akitambua kutokuamini kwake. Haifafanui kimadhehebu wala kuondoa mvutano wa kauli ya baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Akapaza sauti” ni cha asili na huonyesha uzito wa hisia; “kutokuamini kwangu” huhifadhi mwangwi wa kimakusudi kati ya kitenzi “ninaamini” na nomino ἀπιστία.
