  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: sw
  text: Naye akawaambia, “Kweli nawaambia, kuna baadhi ya wale waliosimama hapa ambao kwa hakika hawataonja mauti[a] mpaka wauone ufalme wa Mungu ukiwa umekuja kwa nguvu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “kuonja mauti” unamaanisha kufa au kupitia mauti.
    reason: lexical_alternative
  - marker: b
    text: Kauli “ufalme wa Mungu ukiwa umekuja kwa nguvu” imeeleweka kwa njia mbalimbali kuwa inahusiana na kugeuka sura kwa Yesu, ufufuo na kutukuzwa kwake, Pentekoste, hukumu ya Yerusalemu, au utimilifu wa mwisho wa ufalme. Maandishi yenyewe hayataji wazi tukio linalokusudiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akiwaambia
  rationale: Wakati usiotimilifu unaonyesha usemi uliokuwa ukiendelea katika simulizi; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hii ni fomula ya kusisitiza ukweli na uzito wa kauli; “Kweli” ni ya asili zaidi katika mazungumzo ya Kiswahili kuliko kutoholewa “Amina” hapa.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: baadhi ya wale waliosimama hapa
  rationale: Inahifadhi wazi maana ya sehemu ya kundi lililokuwapo na hali ya kusimama inayoonyeshwa na participle timilifu.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: kwa hakika hawataonja mauti
  rationale: “Kwa hakika hawata-” huonyesha ukanushaji wenye nguvu wa οὐ μή, huku “kuonja mauti” kikihifadhi sitiari ya Kigiriki.
- source_word: ἕως ἂν ἴδωσιν
  choice: mpaka wauone
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kikomo cha wakati kinachotazamiwa baadaye.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri iliyozoeleka na huhifadhi wazo la utawala pamoja na nyanja ya ufalme katika matumizi ya Injili.
- source_word: ἐληλυθυῖαν
  choice: ukiwa umekuja
  rationale: Muundo huu unahusisha “ufalme” na hali inayotokana na kuja kulikokamilika, na hivyo kuhifadhi kwa kiasi kizuri kipengele cha participle timilifu.
- source_word: ἐν δυνάμει
  choice: kwa nguvu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuja kwa udhihirisho wa nguvu bila kufafanua tukio linalokusudiwa.
theological_decisions:
- issue: Wakati na tukio linalorejelewa na kuja kwa ufalme wa Mungu kwa nguvu
  choice: Maneno yametafsiriwa bila kutaja tukio fulani.
  alternative: Kuyahusisha moja kwa moja na kugeuka sura, ufufuo na kutukuzwa kwa Yesu, Pentekoste, hukumu ya Yerusalemu, au utimilifu wa mwisho wa ufalme.
  rationale: Kigiriki hakitambulishi tukio hususa; tafsiri inadumisha utata na mvutano wa kiteolojia uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “alikuwa akiwaambia” unahifadhi hali endelevu ya kitenzi cha Kigiriki, ingawa “aliwaambia” lingeweza kuwa jepesi zaidi. “Mauti” limetumiwa ili kuhifadhi kwa kawaida nahau ya kibiblia “kuonja mauti.”
