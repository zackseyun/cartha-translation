source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: sw
  text: Na mguu wako ukikusababisha ujikwae, ukate. Ni afadhali uingie katika uzima ukiwa kiwete kuliko kuwa na miguu yote miwili na kutupwa katika Gehena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “jehanamu.” Neno la Kigiriki ni Gehena, linalokumbusha Bonde la Hinomu na uhusiano wake na hukumu ya Mungu.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ukikusababisha ujikwae
  rationale: Huhifadhi sitiari ya kujikwaa na pia wazo la kuongozwa katika dhambi au kuanguka, bila kuifupisha maana iwe ‘kutenda dhambi’ pekee.
- source_word: ἀπόκοψον
  choice: ukate
  rationale: Amri hii ni kali na ya moja kwa moja; ‘ukate’ inadumisha taswira halisi na yenye nguvu ya Kigiriki bila kuilainisha kuwa ‘uondoe’.
- source_word: καλόν ἐστίν
  choice: Ni afadhali
  rationale: 'Pamoja na ἢ, usemi huu una maana ya ulinganisho: hali ya kwanza ni bora kuliko ya pili.'
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: uingie katika uzima
  rationale: Huhifadhi sitiari ya kuingia na neno ζωή kama ‘uzima’ bila kuongeza ‘wa milele,’ ambalo halipo wazi katika kifungu hiki.
- source_word: χωλὸν
  choice: ukiwa na ulemavu wa kutembea
  rationale: Hueleza kwa heshima na kwa usahihi ulemavu unaohusu kutembea, ambao ndio maana ya χωλός katika muktadha wa mguu.
- source_word: βληθῆναι
  choice: kutupwa
  rationale: Huwakilisha moja kwa moja hali ya kutendwa ya kitenzi βάλλω na ni lugha ya kawaida ya Kiswahili cha sasa.
- source_word: γέενναν
  choice: Gehena
  rationale: Huhifadhi jina maalumu la Kigiriki lenye asili katika Bonde la Hinomu na mahusiano yake na hukumu ya Mungu, badala ya kuligeuza moja kwa moja kuwa neno la jumla.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: kuwa na miguu yote miwili
  rationale: Ni Kiswahili cha kawaida kinachohifadhi tofauti kati ya kuingia ukiwa na ulemavu na kuwa na miguu yote miwili.
theological_decisions:
- issue: Uwasilishaji wa γέεννα katika muktadha wa hukumu
  choice: Gehena
  alternative: jehanamu
  rationale: Neno la chanzo ni γέεννα, jina lenye marejeo maalumu ya kihistoria na ya hukumu. Maandishi makuu yanahifadhi umaalumu huo, huku tanbihi ikitoa neno linalofahamika zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha ukali wa amri na sitiari ya kujikwaa, huku ‘ulemavu wa kutembea’ ukiepuka maneno yanayoweza kudhalilisha watu wenye ulemavu.
