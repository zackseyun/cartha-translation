base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Msimzuie, kwa maana hakuna mtu atakayefanya tendo lenye nguvu[a] kwa jina langu na upesi aweze kunisema vibaya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “muujiza” au “tendo la nguvu”; Kigiriki: “nguvu/tendo la nguvu” (δύναμιν).'
    reason: lexical_alternative
  - marker: b
    text: 'Au “kunikashifu” au “kunitukana”; Kigiriki: “kunisema vibaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: msimzuie
  rationale: Kitenzi cha amri ya wakati uliopo pamoja na μή kinakataza wanafunzi kuendelea kumzuia mtu huyo. “Msimzuie” ni Kiswahili cha kawaida na huhifadhi wingi wa wale wanaoamriwa pamoja na umoja wa anayezuiwa.
- source_word: δύναμιν
  choice: tendo lenye nguvu
  rationale: Neno δύναμις humaanisha nguvu na, katika masimulizi ya Injili, tendo linalodhihirisha nguvu. “Tendo lenye nguvu” huhifadhi wigo huo bila kulifupisha moja kwa moja kuwa “muujiza.”
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Katika muktadha huu, usemi huo unaonyesha kutenda kwa kulitumia jina la Yesu au kwa mamlaka inayohusishwa nalo. “Kwa jina langu” ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: ταχὺ
  choice: muda mfupi baadaye
  rationale: Hapa kielezi kinaonyesha ukaribu wa wakati, si kasi ya namna ya kusema. “Muda mfupi baadaye” huwasilisha maana ya ‘soon’ kwa uwazi.
- source_word: κακολογῆσαί
  choice: kunisema vibaya
  rationale: Kitenzi hiki kinamaanisha kusema mabaya juu ya mtu, kumtukana, au kumkashifu. “Kunisema vibaya” huhifadhi maana pana bila kubainisha mno aina ya mashambulizi ya maneno.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: kwa maana hakuna mtu atakayefanya
  rationale: Muundo huu huhifadhi sababu inayotolewa na Yesu na dai la jumla la Kigiriki kwa Kiswahili cha kawaida.
- source_word: δυνήσεται
  choice: aweze
  rationale: Huhifadhi dhana ya uwezo iliyo katika δύναμαι; muundo wa “hakuna mtu atakayefanya … na … aweze” unasikika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya tendo linalofanywa kwa jina la Yesu
  choice: tendo lenye nguvu
  alternative: muujiza; tendo kuu
  rationale: Tafsiri hii huhifadhi uhusiano wa δύναμις na nguvu na kuacha wazi iwapo tendo hilo lielezwe hasa kuwa muujiza au kwa maana pana zaidi kuwa tendo kuu.
- issue: Maana ya uhusiano wa mtu huyo na Yesu
  choice: Kauli imetafsiriwa kama maelezo yenye mipaka ya aya yenyewe
  alternative: Kuashiria kwamba mtu huyo alikuwa mwanafunzi kamili; au kwamba alikuwa akilitumia jina la Yesu kwa kujinufaisha tu
  rationale: Aya inasema tu kwamba mtu anayefanya tendo lenye nguvu kwa jina la Yesu hataweza muda mfupi baadaye kusema mabaya juu yake. Tafsiri haiongezi hukumu kuhusu hali yake kamili ya kiroho au nia zake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Msimzuie” hudumisha amri kwa kundi la wanafunzi, na “muda mfupi baadaye” huepuka utata wa “haraka,” ambalo lingeweza kueleweka kama namna badala ya wakati.
