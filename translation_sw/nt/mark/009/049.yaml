  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: sw
  text: Kwa maana kila mtu atatiwa chumvi kwa moto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu atakolezwa kwa moto.” Taswira hii inaweza kudokeza hukumu, utakaso, au lugha ya sadaka; linganisha Walawi 2:13.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinaongeza, “na kila sadaka itatiwa chumvi.”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: kila mtu
  rationale: Ni kivumishi cha umoja wa kiume kilichotumiwa kama nomino; katika muktadha huu kinawarejelea watu, hivyo “kila mtu” ni la kawaida na sahihi kuliko “kila kitu.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu au ufafanuzi wa onyo lililotangulia, na “kwa maana” huhifadhi uhusiano huo wa kimantiki.
- source_word: πυρὶ
  choice: kwa moto
  rationale: Hali ya dative inaweza kuonyesha chombo au uhusiano na kitu. “Kwa moto” ni usemi mfupi unaohifadhi kwa kiasi fulani utata wa kama moto ni njia au kipengele kinachohusika.
- source_word: ἁλισθήσεται
  choice: atatiwa chumvi
  rationale: Kitenzi hiki cha wakati ujao katika hali ya kutendwa humaanisha kihalisi kutiwa chumvi. Tafsiri hii inahifadhi taswira ngumu na ya kushangaza badala ya kuifafanua kuwa utakaso, hukumu, au jaribu.
theological_decisions:
- issue: Maana ya sitiari “kutiwa chumvi kwa moto”
  choice: Kudumisha maneno ya sitiari bila kuamua kama yanahusu hasa hukumu, utakaso, sadaka, au kujaribiwa kwa wanafunzi.
  alternative: Kila mtu atahukumiwa kwa moto; kila mtu atatakaswa kwa moto; au kila mtu atawekwa wakfu kama sadaka iliyotiwa chumvi.
  rationale: Kigiriki ni kifupi na kina dokezo lenye maana kadhaa; muktadha unaweza kuruhusu fasiri hizi zinazohusiana. Maandishi makuu yanapaswa kuhifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Atatiwa chumvi kwa moto” limehifadhiwa kwa makusudi kama fumbo lenye nguvu, huku tanbihi ikitoa neno mbadala la kawaida zaidi bila kufunga maana.
