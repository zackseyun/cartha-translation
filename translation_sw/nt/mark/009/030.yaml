base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: sw
  text: Nao, walipotoka huko, walikuwa wakipitia Galilaya[a], naye hakutaka mtu yeyote ajue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipita kupitia Galilaya.” Kitenzi cha Kigiriki kiko katika wakati usiotimilifu, ambao unaweza kusisitiza mwendo uliokuwa ukiendelea.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakitaji wazi jambo ambalo hakutaka mtu yeyote ajue; katika muktadha, huenda ikawa ni kuwapo kwake au njia aliyokuwa akipitia Galilaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Nao waliondoka huko
  rationale: “Nao” linaendeleza simulizi, huku “waliondoka huko” likihifadhi wazi wazo la kutoka mahali walipokuwa bila kutumia muundo mzito wa kishiriki.
- source_word: παρεπορεύοντο
  choice: wakawa wakipita
  rationale: Muundo huu unaonyesha mwendo uliokuwa ukiendelea, kulingana na kitenzi cha Kigiriki kilicho katika wakati usiotimilifu.
- source_word: διὰ τῆς Γαλιλαίας
  choice: katika Galilaya
  rationale: Katika muktadha wa kitenzi cha mwendo, usemi huu unaonyesha kwamba njia yao ilipitia eneo la Galilaya; ni Kiswahili cha kawaida na cha asili.
- source_word: οὐκ ἤθελεν
  choice: naye hakutaka
  rationale: Kitenzi θέλω kinaonyesha nia au kutaka. “Naye” linaonyesha kwa kawaida kwamba mtendaji mmoja, Yesu, ndiye anayerejelewa baada ya sentensi yenye wingi.
- source_word: ἵνα τις γνοῖ
  choice: mtu yeyote ajue
  rationale: Tafsiri hii inahifadhi kusudi la kuzuia na inaacha bila kutajwa jambo ambalo mtu angejua, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Mtendaji asiye tajwa wa ἤθελεν
  choice: Ametafsiriwa kwa umoja katika “naye hakutaka,” akimrejelea Yesu.
  alternative: Kuchukulia kitenzi kuwa kisicho na mtendaji maalumu au kuwa kinarejelea kundi lote.
  rationale: Kitenzi cha umoja na muktadha wa simulizi vinamwelekeza msomaji kwa Yesu, bila kuongeza dai la kitheolojia lisilokuwamo katika matini.
- issue: Jambo ambalo Yesu hakutaka lijulikane
  choice: 'Limeachwa bila kutajwa: “mtu yeyote ajue.”'
  alternative: Kufafanua kuwa hakutaka mtu ajue alikuwapo au alikuwa akisafiri kwa njia hiyo.
  rationale: Kigiriki hakitaji yambwa la “ajue”; kuliacha wazi kunahifadhi utata wa matini na huruhusu muktadha kutoa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. “Wakawa wakipita” limetumiwa kuhifadhi hali ya mwendo unaoendelea, ingawa ni rasmi kidogo kuliko “wakapita.”
