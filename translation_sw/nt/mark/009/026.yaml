base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: sw
  text: Roho hiyo ikapiga kelele na kumtia kijana katika degedege kali[a], kisha ikamtoka. Kijana akawa kama mfu[b], hata wengi wakawa wakisema, “Amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtetemesha kwa nguvu sana.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “akawa kama mfu”; yaani, alionekana kuwa amekufa kwa waliokuwa wakitazama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: ikapiga kelele
  rationale: Kitenzi kinaonyesha kupaza sauti bila kulazimisha maana ya ‘kupiga yowe’; kiima chake ni roho iliyotajwa katika muktadha.
- source_word: πολλὰ σπαράξας
  choice: kumtia kijana katika degedege kali
  rationale: Katika simulizi la kutoa pepo, σπαράσσω huelekea kumaanisha kusababisha degedege au mshtuko mkali, si kurarua kihalisi. πολλὰ imetolewa kwa ‘kali,’ na ‘kijana’ imewekwa wazi kutokana na muktadha.
- source_word: ἐξῆλθεν
  choice: ikamtoka
  rationale: Hii ni njia ya kawaida ya Kiswahili kueleza kwamba roho ilitoka ndani ya kijana; kiwakilishi cha yambwa kinaweka uhusiano huo wazi.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Kijana akawa kama mfu
  rationale: ‘Kama’ huhifadhi ulinganisho wa ὡσεὶ na haisemi kwamba msimulizi anathibitisha kifo halisi.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: hata wengi wakasema
  rationale: ‘Hata’ linaonyesha matokeo kwa Kiswahili cha asili, na τοὺς πολλούς limetafsiriwa ‘wengi’ bila kudai kwamba walikuwa walio wengi kuliko wote.
- source_word: ὅτι ἀπέθανεν
  choice: “Amekufa”
  rationale: Usemi wa moja kwa moja ni wa kawaida katika simulizi, na ‘amekufa’ huwasilisha hitimisho la papo hapo la watazamaji.
theological_decisions:
- issue: Ikiwa kijana alikufa kweli au alionekana tu kuwa amekufa
  choice: Msimulizi anasema kijana alikuwa kama mfu, huku umati ukihitimisha kuwa amekufa.
  alternative: Kusema kwamba kijana alikufa kwa muda, au kusema moja kwa moja kwamba alikuwa amekufa.
  rationale: ὡσεὶ ni ya ulinganisho (‘kama’), na kauli ya kifo inatolewa na watazamaji. Tafsiri kwa hiyo haiingizi dai la ufufuo wala kuondoa athari ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Degedege kali’ ni usemi unaoeleweka kwa hali ya kukakamaa na kutikisika kwa nguvu; ‘roho hiyo’ na ‘kijana’ vinawekwa wazi kutokana na muktadha ili kuepuka utata wa viwakilishi.
