  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: sw
  text: Eliya akawatokea pamoja na Musa, nao walikuwa wakizungumza na Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakiongea na Yesu.”
    reason: Mbadala wa kileksia unaowasilisha maana ileile ya mazungumzo ya pamoja.
lexical_decisions:
- source_word: ὤφθη
  choice: akawatokea
  rationale: Kitenzi hiki cha Kigiriki kina maana ya ‘alionekana’ au ‘alitokea.’ ‘Akawatokea’ ni Kiswahili cha kawaida kinachoonyesha kwamba Eliya alionekana kwao katika tukio hilo.
- source_word: αὐτοῖς
  choice: -wa- (katika ‘akawatokea’)
  rationale: Yambwa ya udativu imewasilishwa kwa kiambishi cha Kiswahili kinachoonyesha watu ambao Eliya aliwatokea.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: σὺν Μωϋσεῖ
  choice: pamoja na Musa
  rationale: ‘Pamoja na’ huonyesha wazi ushirika wa Musa na Eliya bila kuongeza maelezo ya kiufafanuzi.
- source_word: συλλαλοῦντες
  choice: walikuwa wakizungumza
  rationale: Kitenzi hiki kinaonyesha mazungumzo ya pamoja. Umbo hili la Kiswahili linawasilisha tendo lililokuwa likiendelea katika simulizi.
- source_word: τῷ Ἰησοῦ
  choice: na Yesu
  rationale: Katika Kiswahili, ‘kuzungumza na Yesu’ huwasilisha kwa kawaida maana ya mazungumzo ya pande mbili iliyomo katika συλλαλέω.
theological_decisions:
- issue: Utambulisho na uhalisi wa Eliya na Musa katika tukio la kubadilika sura
  choice: Aya inasema moja kwa moja kwamba Eliya alitokea pamoja na Musa na kwamba walizungumza na Yesu.
  alternative: Kulifafanua tukio kuwa maono tu au uwakilishi wa mfano badala ya kutokea kwao wenyewe.
  rationale: Simulizi la Kigiriki linawasilisha kutokea na kuzungumza kwao bila sifa inayopunguza uhalisi wa tukio; tafsiri haiongezi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Eliya akawatokea pamoja na Musa’ unadumisha umoja wa kitenzi cha Kigiriki ὤφθη, huku ‘nao walikuwa wakizungumza’ ukidumisha wingi wa kishiriki συλλαλοῦντες. Alama ya tanbihi imewekwa baada ya kirai inachokihusu.
