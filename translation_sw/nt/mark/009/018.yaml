base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: sw
  text: Na popote inapomkamata, humwangusha chini; naye hutokwa na povu, husaga meno yake na hukakamaa.[a] Niliwaambia wanafunzi wako waifukuze, lakini hawakuweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hukauka” au “hunyauka”; huenda pia ikamaanisha “hudhoofika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: popote inapomkamata
  rationale: Muundo huu unaonyesha tukio linaloweza kujirudia mahali popote; Kiswahili cha kawaida hutumia “popote inapo-” kwa maana hiyo.
- source_word: καταλάβῃ
  choice: inapomkamata
  rationale: Kitenzi kinaonyesha roho ikimshika kwa nguvu. “Kumkamata” ni wazi, cha kawaida, na hakiongezi maelezo yasiyokuwamo katika chanzo.
- source_word: ῥήσσει
  choice: humwangusha chini
  rationale: Katika muktadha huu kitenzi kinaeleza kitendo cha nguvu kinachomwangusha mvulana, si lazima kumrarua mwili.
- source_word: ἀφρίζει
  choice: hutokwa na povu
  rationale: Hii ni njia ya kawaida ya Kiswahili kueleza kutoa povu bila kulazimika kuongeza “kinywani,” jambo ambalo halijasemwa wazi katika Kigiriki.
- source_word: τρίζει τοὺς ὀδόντας
  choice: husaga meno yake
  rationale: Kirai hiki kinaeleza msuguano wa meno kama dalili ya mwili; “kusaga meno” ni cha asili na sahihi katika Kiswahili.
- source_word: ξηραίνεται
  choice: hukakamaa
  rationale: Katika mfululizo huu wa dalili, neno linaweza kueleweka kuwa mwili wake huwa mgumu au hukakamaa. Kwa kuwa maana yake ya moja kwa moja ni kukauka au kunyauka, maana hizo zimehifadhiwa katika tanbihi.
- source_word: εἶπα
  choice: Niliwaambia
  rationale: Huwasilisha kwa njia ya kawaida kitendo cha baba kuwaagiza wanafunzi wa Yesu.
- source_word: ἐκβάλωσιν
  choice: waitoe
  rationale: Katika muktadha wa kutoa roho, “waitoe” huonyesha kufukuzwa kwa roho huku ikihifadhi kiwakilishi kisicho na jinsia cha Kigiriki.
- source_word: οὐκ ἴσχυσαν
  choice: hawakuweza
  rationale: Huhifadhi maana ya kutokuwa na uwezo bila kueleza sababu ya kushindwa kwao.
theological_decisions:
- issue: Kirejeleo cha αὐτό katika ombi la kuitoa
  choice: Kiwakilishi “-i-” katika “waitoe” kinarejelea roho inayemtesa mvulana.
  alternative: Kinaweza kueleweka kwa ujumla zaidi kuwa mateso au tatizo lenyewe.
  rationale: Muktadha wa karibu unazungumzia roho anayemkamata mvulana na ambaye wanafunzi walijaribu kumtoa. Kiwakilishi kimehifadhiwa badala ya kuongeza jina lisilojirudia katika mstari huu.
- issue: Maana ya ξηραίνεται
  choice: hukakamaa
  alternative: hukauka, hunyauka, au hudhoofika
  rationale: Muktadha wa dalili za shambulio unaunga mkono “hukakamaa,” lakini maana ya msingi ya kitenzi inaruhusu picha ya kukauka, kunyauka, au kudhoofika. Tanbihi huhifadhi mvutano huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia vitenzi vya kawaida vinavyoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya “hukakamaa,” neno linalohusika moja kwa moja na tofauti ya kileksia.
