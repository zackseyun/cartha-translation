reference: Mark 9:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: sw
  text: 'Lakini Yesu alipoona kwamba umati ulikuwa ukikusanyika kwa haraka[a], akaikemea ile roho chafu, akiiambia, “Ewe roho bubu na kiziwi, mimi ninakuamuru: toka, wala usimwingie tena kamwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu walikuwa wakikimbilia mahali pamoja.” Kitenzi cha Kigiriki kinaonyesha watu wakielekea na kukusanyika kwa haraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Lakini Yesu alipoona
  rationale: Kiunganishi δέ ni mpito hafifu wa simulizi, na kirai cha wakati ‘alipoona’ kinaonyesha mazingira yaliyotangulia tendo kuu bila kufanya sentensi kuwa nzito.
- source_word: ἐπισυντρέχει ὄχλος
  choice: umati ulikuwa ukikusanyika kwa haraka
  rationale: Kitenzi ἐπισυντρέχω kinaonyesha watu wakielekea na kukusanyika mahali pamoja kwa kasi; tafsiri hii huhifadhi hali ya haraka kwa Kiswahili cha kawaida.
- source_word: ἐπετίμησεν
  choice: akaikemea
  rationale: ‘Kukemea’ huonyesha mamlaka na ukali wa tendo la Yesu, na ni neno linalofaa kwa matumizi ya Injili kuhusu roho.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ile roho chafu
  rationale: ‘Roho chafu’ huhifadhi dhana ya ἀκάθαρτος ya uchafu wa kidini na kimaadili bila kuibadili kuwa maelezo ya ugonjwa.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Ewe roho bubu na kiziwi
  rationale: Mwito wa moja kwa moja umeonyeshwa kwa ‘Ewe’; ‘bubu’ na ‘kiziwi’ hutunza tofauti kati ya kutoweza kusema na kutoweza kusikia.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: mimi ninakuamuru
  rationale: Kiwakilishi wazi ἐγώ kina mkazo; ‘mimi’ hukihifadhi, na ‘ninakuamuru’ huonyesha mamlaka ya moja kwa moja.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: mtoke
  rationale: Kwa Kiswahili, ‘mtoke’ ni amri ya kawaida na fupi inayomaanisha kutoka ndani ya mtu huyo.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: wala usimwingie tena kamwe
  rationale: Muundo huu huonyesha katazo thabiti la kuingia tena wakati wowote, kulingana na μηκέτι na amri hasi ya Kigiriki.
theological_decisions:
- issue: Istilahi ya roho ya pepo na mamlaka ya Yesu
  choice: 'Kutafsiri πνεῦμα ἀκάθαρτον kuwa ‘roho chafu’ na kutumia lugha yenye mamlaka: ‘akaikemea’ na ‘mimi ninakuamuru’'
  alternative: ‘roho mbaya’ au ‘roho najisi’; ‘akaionya kwa ukali’
  rationale: Andiko linaiwasilisha roho kama mhusika anayesemeshwa moja kwa moja na kutii amri ya Yesu. Tafsiri haipunguzi tukio liwe ugonjwa tu, wala haiongezi maelezo ya kimafundisho yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi, huku mwito na amri za Yesu zikibaki wazi na zenye nguvu.
