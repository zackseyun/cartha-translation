base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: sw
  text: Chumvi ni nzuri; lakini chumvi ikipoteza ladha yake[a], mtaitia nini ili ipate ladha? Iweni na chumvi ndani yenu[b], na mkae kwa amani ninyi kwa ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana ya moja kwa moja zaidi: “ikiwa haina chumvi”; pia yaweza kueleweka “ikiwa imekuwa isiyo na ladha.”'
    reason: lexical_alternative
  - marker: b
    text: Kauli “Iweni na chumvi ndani yenu” inahifadhi sitiari ya Kigiriki. Inaweza kuhusishwa na usafi, hekima, uaminifu kwa agano, au ushawishi unaohifadhi, lakini andiko halibainishi maana moja waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: ni nzuri
  rationale: Neno καλός linatoa tathmini chanya kwa maana pana. “Ni nzuri” ni Kiswahili cha kawaida kinachohifadhi uzito wa msemo bila kuufanya umaanishe tu “inafaa.”
- source_word: ἅλας / ἅλα
  choice: chumvi
  rationale: “Chumvi” limetumiwa kwa uthabiti katika sehemu zote mbili, na sitiari ya amri ya mwisho imehifadhiwa badala ya kufafanuliwa kwa maana moja.
- source_word: ἄναλον γένηται
  choice: ikipoteza ladha yake
  rationale: ἄναλος humaanisha isiyo na chumvi au isiyo na ladha, na γένηται huonyesha badiliko la hali. Kauli hii ni ya kawaida na inayoeleweka katika Kiswahili; tanbihi inahifadhi picha ya moja kwa moja zaidi ya kuwa bila chumvi.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: mtaikoleza kwa nini?
  rationale: “Kwa nini” hapa huonyesha chombo au njia, si sababu; “kuikoleza” huhifadhi picha ya kuongeza ukolezi au ladha bila kuipanua kuwa ufafanuzi wa kiroho.
- source_word: ἔχετε ἐν ἑαυτοῖς
  choice: Muwe na ... ndani yenu
  rationale: Amri “muwe na” ni ya asili katika Kiswahili na “ndani yenu” huhifadhi mwelekeo wa kiwakilishi cha kujirejelea pamoja na sitiari ya ndani.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: mkae kwa amani ninyi kwa ninyi
  rationale: Kitenzi kinaagiza hali au mwenendo unaoendelea wa kuwa katika amani. “Ninyi kwa ninyi” huonyesha wazi uhusiano wa pande zote.
theological_decisions:
- issue: Maana ya sitiari ya chumvi katika amri
  choice: Kuhifadhi kauli “Muwe na chumvi ndani yenu”
  alternative: Kuifafanua chumvi kuwa usafi, hekima, uaminifu kwa agano, au ushawishi unaohifadhi
  rationale: Mstari wenyewe hautaji maana moja ya sitiari. Kuihifadhi wazi huepuka kuingiza hitimisho maalumu la kitheolojia na hudumisha uhusiano wake na muktadha.
- issue: Nguvu ya amri ya mwisho kuhusu amani
  choice: “mkae kwa amani ninyi kwa ninyi”
  alternative: “muwe na amani kati yenu”
  rationale: Chaguo kuu linaonyesha hali endelevu ya amri ya wakati uliopo huku likibaki la kawaida, la kimaadili, na lisiloegemea mafundisho ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku sitiari na utata halisi wa chanzo vikihifadhiwa.
