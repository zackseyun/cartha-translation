  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: sw
  text: Lakini Yesu akamshika mkono, akamwinua[a], naye akasimama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza pia kumaanisha ‘kumwamsha’ na hutumiwa katika habari za kuamka usingizini au kufufuliwa kutoka kwa wafu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akainuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wa kiasi kati ya dhana ya umati kwamba mvulana amekufa na tendo la Yesu, huku ikibaki ya kawaida katika masimulizi ya Kiswahili.
- source_word: κρατήσας
  choice: akamshika
  rationale: Inaonyesha tendo halisi la Yesu kuushika mkono wa mvulana bila ukali unaoweza kudokezwa na maneno kama ‘akamkamata kwa nguvu.’
- source_word: τῆς χειρὸς αὐτοῦ
  choice: mkono
  rationale: Inahifadhi kiungo mahususi, χείρ, na muundo ‘akamshika mkono’ ni wa asili katika Kiswahili.
- source_word: ἤγειρεν
  choice: akamwinua
  rationale: Katika muktadha huu, Yesu anamsababisha mvulana kuinuka kutoka chini. ‘Akamwinua’ ni ya kawaida na bado inaruhusu mwangwi wa matumizi ya kitenzi hicho kuhusu kuamka au kufufuliwa.
- source_word: ἀνέστη
  choice: akasimama
  rationale: 'Inaeleza kwa uwazi matokeo ya tendo la Yesu: mvulana alifika katika hali ya kusimama. Maana mbadala ‘akainuka’ imewekwa katika tanbihi ili kuhifadhi upana wa kitenzi.'
theological_decisions:
- issue: Mwangwi unaowezekana wa lugha ya ufufuo katika ἤγειρεν / ἀνέστη
  choice: Kutumia lugha ya kawaida ya kuinuliwa na kusimama katika muktadha, huku tanbihi ikihifadhi uwezekano wa mwangwi wa kuamka au kufufuliwa.
  alternative: Kutumia ‘akamwamsha, naye akainuka,’ jambo ambalo lingeweka mwangwi wa ufufuo mbele zaidi.
  rationale: Muktadha unasimulia kurejeshwa kwa mvulana baada ya pepo kutoka, wala hausemi moja kwa moja kwamba alifufuliwa kutoka kwa wafu. Hata hivyo, vitenzi vya Kigiriki vinaweza kutumiwa pia kuhusu kuamka au kufufuliwa; hivyo uwezekano huo hauondolewi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfululizo wa ‘akamshika … akamwinua … akasimama’ unasomeka kwa urahisi katika simulizi na unahifadhi tofauti kati ya tendo la Yesu na tendo linalofuata la mvulana.
