  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: sw
  text: Mtu mmoja kutoka katika umati akamjibu, “Mwalimu, nilimleta mwanangu wa kiume kwako; ana roho bubu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho inayomfanya asiweze kusema.”
    reason: Njia nyingine ya kueleza athari inayokusudiwa ya πνεῦμα ἄλαλον katika muktadha, ingawa kwa muundo wa Kigiriki ‘bubu’ huelezea ‘roho’ moja kwa moja.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: akamjibu
  rationale: Hutoa kwa kawaida kitenzi cha masimulizi na pia huhifadhi yambwa ‘yeye’ katika Kiswahili bila upanuzi usio wa lazima.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: mtu mmoja katika umati
  rationale: Huhifadhi maana ya mmoja miongoni mwa umati bila kuongeza wazi kwamba alikuwa mwanamume, ingawa hilo linaweza kudokezwa na muktadha.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni neno la kawaida na sahihi la kumwita mtu anayefundisha, bila kuongeza wazo la umiliki au mamlaka lisilosemwa moja kwa moja.
- source_word: ἤνεγκα τὸν υἱόν μου πρὸς σέ
  choice: nilimleta mwanangu kwako
  rationale: ‘Nilimleta’ huwasilisha tendo lililokamilika kwa Kiswahili cha kawaida; ‘mwanangu’ huhifadhi uhusiano wa kifamilia wa υἱόν, na ‘kwako’ hutoa mwelekeo wa πρὸς σέ.
- source_word: ἔχοντα πνεῦμα ἄλαλον
  choice: ana roho bubu
  rationale: Kishazi cha kitenzi ni cha asili zaidi katika Kiswahili kuliko umbo la kishirikishi, huku ‘roho bubu’ kikihifadhi kwa karibu sifa ambayo Kigiriki kinaihusisha moja kwa moja na roho.
theological_decisions:
- issue: Maana ya πνεῦμα katika muktadha wa kutoa pepo
  choice: roho, huku muktadha ukidokeza roho mwovu au wa kishetani
  alternative: roho mwovu; pepo
  rationale: Kigiriki katika mstari huu kinasema tu ‘roho.’ Kwa hiyo tafsiri haiongezi ‘mwovu’ wala kubadili neno kuwa ‘pepo,’ ingawa muktadha unaonyesha roho inayomtesa kijana.
- issue: Ni nani au nini kinachoitwa ἄλαλον
  choice: roho bubu
  alternative: roho inayomfanya asiweze kusema
  rationale: Kisarufi, ἄλαλον huelezea πνεῦμα. Tafsiri kuu huhifadhi uhusiano huo badala ya kuamua kimya kimya kwamba kivumishi kinaelezea tu athari kwa mwana; maelezo ya athari yametolewa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Umati’ limetumiwa kwa ὄχλος, na usemi wa moja kwa moja umewekwa kwa mtiririko wa kawaida wa simulizi.
