  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: sw
  text: Walikuwa wakimwuliza, “Kwa nini[a] waandishi wa sheria husema kwamba lazima Eliya aje kwanza?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Inakuwaje kwamba waandishi wa sheria husema kwamba lazima Eliya aje kwanza?”
    reason: Njia nyingine ya kutafsiri nguvu ya kiulizi ya ὅτι.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: walikuwa wakimuuliza
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea au kurudiwa; muundo huu wa Kiswahili unahifadhi hali hiyo na pia unajumuisha kiwakilishi αὐτόν.
- source_word: λέγοντες
  choice: —
  rationale: Katika Kiswahili, maneno ya swali yanayofuata moja kwa moja baada ya ‘walikuwa wakimuuliza’ yanawasilisha kazi ya participio hii kwa ufasaha; kuongeza ‘wakisema’ kungekuwa marudio yasiyo ya lazima.
- source_word: Ὅτι
  choice: Kwa nini
  rationale: Katika muktadha huu wa swali, ὅτι inaleta swali lenye maana ya ‘kwa nini’ au ‘inakuwaje kwamba’; ‘Kwa nini’ ni wazi na ya kawaida, huku njia nyingine ikihifadhiwa katika tanbihi.
- source_word: γραμματεῖς
  choice: walimu wa sheria
  rationale: Hili linaeleza kwa lugha inayoeleweka jukumu la wataalamu wa Maandiko na sheria katika mazingira ya Injili; ‘waandishi’ peke yake linaweza kueleweka vibaya kama watu wanaoandika vitabu.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: δεῖ
  choice: lazima
  rationale: Neno hili linahifadhi nguvu ya ulazima bila kufafanua zaidi chanzo au namna ya ulazima huo.
- source_word: ἐλθεῖν
  choice: aje
  rationale: Baada ya ‘lazima,’ hali ya utegemezi ‘aje’ ni ya kawaida katika Kiswahili na inatoa maana ya kuja.
- source_word: πρῶτον
  choice: kwanza
  rationale: Linahifadhi moja kwa moja wazo la kutangulia kwa wakati.
theological_decisions:
- issue: Nguvu ya swali linaloletwa na Ὅτι
  choice: ‘Kwa nini’ kama swali la moja kwa moja kuhusu mafundisho ya walimu wa sheria
  alternative: ‘Inakuwaje kwamba’
  rationale: Maana ya kuuliza sababu inaeleweka vizuri kwa ‘Kwa nini,’ lakini uwezekano wa kuuliza jinsi dai hilo linavyoweza kuwa umehifadhiwa katika tanbihi.
- issue: Asili ya kuja kwa Eliya
  choice: ‘lazima Eliya aje kwanza’ bila nyongeza ya ufafanuzi
  alternative: ‘lazima Eliya aje tena kwanza’ au ‘lazima Eliya aje kabla ya Masihi’
  rationale: Matini ya Kigiriki haisemi wazi ‘tena’ wala haitaji Masihi katika mstari huu; kutoyaongeza kunahifadhi mvutano na upeo wa kauli ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘walikuwa wakimuuliza’ unahifadhi hali endelevu ya simulizi, na usemi wa moja kwa moja unaepuka marudio mazito ya ‘wakisema.’
