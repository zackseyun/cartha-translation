base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: sw
  text: Naye alipoingia ndani ya nyumba, wanafunzi wake wakamwuliza kwa faragha, “Kwa nini sisi hatukuweza kuitoa?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi cha Kigiriki ni cha jinsia ya kati na kwa kawaida zaidi humrejelea pepo au roho mchafu. Kinaweza pia kueleweka kuwa kinamrejelea mvulana; katika hali hiyo tafsiri ingekuwa “kumtoa.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: alipoingia
  rationale: Kirai cha aoristi katika genitive absolute kinaweka mazingira ya wakati; “alipoingia” ni Kiswahili cha kawaida na kinaonyesha kuwa kuingia kulitangulia kuuliza.
- source_word: εἰς οἶκον
  choice: nyumbani
  rationale: Katika simulizi hili οἶκος inaelekea mahali pa ndani panapojulikana. “Nyumbani” ni ya asili katika Kiswahili bila kulazimisha kuwa nyumba hiyo ilikuwa mali yake.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” ni tafsiri iliyozoeleka na sahihi ya μαθηταί, ikihifadhi uhusiano wa kujifunza na kumfuata mwalimu.
- source_word: κατ’ ἰδίαν
  choice: kwa faragha
  rationale: Kirai hiki humaanisha kando na wengine; “kwa faragha” kinaeleza wazi hali ya mazungumzo hayo.
- source_word: ἐπηρώτων
  choice: wakawa wakimuuliza
  rationale: Muundo huu unadhihirisha hali endelevu ya wakati usiotimilifu wa Kigiriki bila kulazimisha maana ya kuuliza mara nyingi.
- source_word: Ὅτι
  choice: Kwa nini
  rationale: Katika swali hili ὅτι hutumika kwa maana ya kuuliza sababu.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: sisi hatukuweza
  rationale: “Hatukuweza” huwasilisha kutokuwa na uwezo, na “sisi” huhifadhi msisitizo wa kiwakilishi ἡμεῖς.
- source_word: ἐκβαλεῖν αὐτό
  choice: kumtoa
  rationale: Katika muktadha wa pepo, ἐκβάλλω ni kumtoa au kumfukuza. Kiswahili hutumia ngeli ya M-WA kwa roho/pepo, hivyo “kumtoa” ni ya kawaida ingawa Kigiriki kina kiwakilishi cha umoja cha jinsia ya kati.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi cha mwisho αὐτό
  choice: Kimeeleweka kuwa kinarejelea pepo/roho mchafu, na kutafsiriwa “kumtoa.”
  alternative: Kinaweza kueleweka kuwa kinamrejelea mvulana, pia kwa Kiswahili “kumtoa.”
  rationale: Kiwakilishi cha Kigiriki ni cha jinsia ya kati na kwa kawaida zaidi kinarejelea pepo/roho mchafu kama kitu kilichokuwa kitolewe. Hata hivyo, Kiswahili hakiwezi kuonyesha tofauti hiyo kwa kiwakilishi hiki, kwa sababu “pepo/roho” na “mvulana” zote huchukua kiambishi cha yambwa “-m-”; tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi wa Biblia. “Naye” huendeleza simulizi; “kwa faragha” ni wazi kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
