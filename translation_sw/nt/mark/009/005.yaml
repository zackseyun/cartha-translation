base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: sw
  text: 'Petro akajibu, akamwambia Yesu, “Rabi, ni vizuri kwetu kuwa hapa; na tujenge vibanda vitatu[a]: kimoja kwa ajili yako, kimoja kwa ajili ya Musa, na kimoja kwa ajili ya Eliya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahema” au “makao ya muda.” Neno la Kigiriki σκηνάς linaweza kumaanisha vibanda au mahema ya muda, na linaweza kuhusishwa na Sikukuu ya Vibanda au maskani; lakini aya hii haisemi wazi uhusiano huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Ni nahau ya kawaida ya usimulizi wa Kigiriki. ‘Akajibu’ inadumisha uhusiano wa kimuundo na chanzo hata ingawa hakuna swali lililotajwa wazi.
- source_word: λέγει
  choice: akamwambia
  rationale: Kigiriki kinatumia wakati wa sasa wa kihistoria, lakini wakati uliopita wa masimulizi ni wa kawaida na wa asili zaidi katika Kiswahili. Kiambishi cha mtendewa kinaonyesha kwamba maneno yanaelekezwa kwa Yesu.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina hili la heshima linahifadhi mazingira ya Kiyahudi na maana yake mahususi ya kumwita mwalimu kwa heshima, bila kulipanua kuwa tafsiri ya ufafanuzi.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ni vizuri sisi kuwa hapa
  rationale: Hii inadumisha tathmini ya Petro na kutaja wazi ‘sisi’ kama ilivyo katika chanzo, bila kuongeza hisia kama ‘ni jambo la ajabu.’
- source_word: ποιήσωμεν
  choice: na tujenge
  rationale: Kauli tegemezi ya nafsi ya kwanza wingi ina nguvu ya pendekezo au himizo. ‘Tujenge’ ni Kiswahili cha kawaida kwa kutengeneza vibanda na hudumisha wazo la ‘hebu sisi tufanye.’
- source_word: σκηνάς
  choice: vibanda
  rationale: Neno linaweza kumaanisha vibanda, mahema, au makao ya muda. ‘Vibanda’ ni wazi na la kawaida katika Kiswahili, huku maana mbadala zikihifadhiwa katika tanbihi.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: kimoja kwa ajili yako, kimoja kwa ajili ya Musa, na kimoja kwa ajili ya Eliya
  rationale: Muundo huu unadumisha urudiaji wa μίαν na mpangilio sambamba wa Kigiriki.
theological_decisions:
- issue: Dokezo linalowezekana la Sikukuu ya Vibanda au la maskani katika σκηνάς
  choice: Kutumia ‘vibanda’ katika matini kuu
  alternative: mahema; maskani
  rationale: Aya haitambulishi wazi miundo hiyo na Sikukuu ya Vibanda wala na teolojia ya maskani. Tafsiri kuu inabaki ya kawaida, na maana nyingine zinazowezekana zinatajwa katika tanbihi bila kuamua dokezo la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Rabi’ limehifadhiwa kama jina la heshima la mazingira ya Kiyahudi. Alama ya tanbihi imewekwa baada ya ‘vibanda vitatu,’ ambako neno linalofafanuliwa linatokea.
