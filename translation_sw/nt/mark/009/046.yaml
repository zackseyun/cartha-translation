  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: sw
  text: ambako[a] funza wao hafi, na moto hauzimiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupatikani katika hati za kale zaidi za Kigiriki (zikiwemo Sinaiticus na Vaticanus za karne ya nne) wala katika tafsiri za kale za Kikopti, lakini unapatikana katika mapokeo ya hati nyingi za Kibizanti na katika mapokeo ya Kilatini. Yaelekea uliongezwa baadaye na mwandishi wa nakala kwa kurudia maneno yaleyale ya mstari wa 48 (na mstari wa 44).
    reason: textual_critical
lexical_decisions:
- source_word: ὅπου
  choice: ambako
  rationale: Kielezi hiki huunganisha mstari na mahali pa hukumu lililotajwa katika muktadha; “ambako” ni Kiswahili cha kawaida na hudumisha uhusiano huo.
- source_word: σκώληξ
  choice: funza
  rationale: Katika muktadha wa Isaya 66:24, neno hili humaanisha funza anayekula kitu kinachooza. “Funza” ni sahihi na ya kawaida zaidi katika Kiswahili kuliko neno pana “mdudu.”
- source_word: τελευτᾷ
  choice: hafi
  rationale: Kitenzi kinaweza kumaanisha kufikia mwisho au kufa; kwa funza, “hafi” huwasilisha maana ya moja kwa moja na hali endelevu ya wakati wa sasa.
- source_word: πῦρ
  choice: moto
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa moto katika Kiswahili.
- source_word: σβέννυται
  choice: hauzimiki
  rationale: Kauli ya kutendwa ya Kigiriki inaeleza moto ambao hauzimwi au hauwezi kuisha. “Hauzimiki” ni usemi wa asili wa Kiswahili na huhifadhi picha ya moto unaoendelea kuwaka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi umehifadhiwa, pamoja na taswira kali inayotokana na Isaya 66:24. Kiwakilishi “wao” kimeachwa kama kilivyo katika Kigiriki ili kutatua kimakusudi rejeleo lake kwa ufafanuzi.
