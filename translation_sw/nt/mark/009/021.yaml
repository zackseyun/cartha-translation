  source_fidelity: The draft correctly identifies Jesus as asking the afflicted boy’s father and accurately conveys a duration question followed by the reply that the condition has been present from childhood. However, “tangu jambo hili lianze kumpata” uses a subjunctive form that does not naturally express the completed/continuing situation conveyed by γέγονεν in this construction.
  naturalness: “Imekuwa muda gani tangu jambo hili limempata?” is grammatical, idiomatic Standard East African Swahili and retains the question’s focus on duration up to the present. “Tangu utotoni” is natural and concise.
  terminology: No specialized theological terms occur. “Baba yake,” “jambo hili,” and “utotoni” are appropriate and clear in the narrative register.
  issues:
