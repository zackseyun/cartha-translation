  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: sw
  text: Naye akamuuliza baba yake, “Imekuwa muda gani tangu jambo hili limempata?” Naye akasema, “Tangu utotoni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: akamuuliza
  rationale: Kitenzi hiki hapa kinaanzisha swali la kawaida; ‘akamuuliza’ ni Kiswahili cha asili na hakiongezi ukali au urasmi usiokuwapo katika muktadha.
- source_word: τὸν πατέρα αὐτοῦ
  choice: baba yake
  rationale: Kiwakilishi αὐτοῦ katika muktadha kinamrejelea yule mtoto mwenye hali hiyo. ‘Baba yake’ ni kifupi, wazi, na cha kawaida.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Imekuwa muda gani tangu
  rationale: Muundo huu unauliza muda uliopita tangu hali ilipoanza hadi wakati wa mazungumzo. Tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kuiga muundo wa Kigiriki neno kwa neno.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: jambo hili lianze kumpata
  rationale: τοῦτο hurejelea hali iliyoelezwa, na γέγονεν inaonyesha jambo lililoanza na ambalo athari au hali yake inaendelea. ‘Lianze kumpata’ huendana na muundo wa swali la muda na kuhifadhi wazo la hali inayompata.
- source_word: ὁ δὲ εἶπεν
  choice: Naye akasema
  rationale: δέ hapa inaendeleza simulizi bila kuonyesha lazima upinzani mkali. ‘Naye akasema’ hudumisha mfuatano wa mazungumzo.
- source_word: Ἐκ παιδιόθεν
  choice: Tangu utotoni
  rationale: Kirai hiki huonyesha kwamba hali hiyo ilianza wakati wa utoto na imeendelea tangu hapo. ‘Tangu utotoni’ ni kifupi, cha asili, na sahihi katika Kiswahili.
