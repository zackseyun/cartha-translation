  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: sw
  text: Walipowafikia wanafunzi, waliona umati mkubwa ukiwazunguka, na waandishi wa sheria wakibishana nao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakijadiliana nao.” Kitenzi cha Kigiriki kinaweza kumaanisha kujadiliana au kubishana, lakini katika muktadha huu huenda kinaonyesha mabishano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Walipowafikia wanafunzi
  rationale: Kitenzi kishirikishi cha aoristi kinaonyeshwa kwa kishazi cha wakati kinachoeleweka kwa urahisi katika Kiswahili; πρός pamoja na hali ya kushutumiwa inaonyesha mwendo wa kuwaendea wanafunzi.
- source_word: εἶδον
  choice: waliona
  rationale: Hii ni tafsiri ya moja kwa moja ya aoristi ya ὁράω katika simulizi.
- source_word: ὄχλον πολὺν
  choice: umati mkubwa
  rationale: ὄχλος ni umati, na πολύς hapa inaonyesha ukubwa au wingi wake.
- source_word: περὶ αὐτούς
  choice: ukiwazunguka
  rationale: 'περί hapa ina maana ya mahali: umati ulikuwa pande zote za wanafunzi.'
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Neno hili linadumisha utambulisho wao kama waandishi waliobobea katika Sheria ya Kiyahudi huku likiwa wazi zaidi kuliko ‘waandishi’ peke yake.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: wakibishana nao
  rationale: συζητέω inaweza kumaanisha kujadiliana au kubishana; mazingira ya mzozo hapa yanaunga mkono ‘kubishana.’ ‘Nao’ inawarejelea wanafunzi.
theological_decisions: []
