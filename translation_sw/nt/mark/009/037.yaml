  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: sw
  text: Yeyote anayempokea mmoja wa watoto wa namna hii kwa jina langu, ananipokea mimi; na yeyote anayenipokea mimi, hanipokei mimi, bali yule aliyenituma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Yeyote anaye-
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya jumla isiyo na mtu maalumu, sawa na kiwakilishi cha uhusiano pamoja na ἄν.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: mmoja wa watoto wa namna hii
  rationale: Inahifadhi muundo wa sehemu ya kundi ('mmoja wa watoto') na maana ya sifa ya τοιούτων, yaani watoto wa aina au namna hii, bila kuibadili kuwa kiashiria maalumu 'hawa'.
- source_word: δέξηται / δέχεται / δέχηται
  choice: anampokea / ananipokea / hanipokei
  rationale: Kitenzi 'kupokea' kinarudiwa katika kila kishazi, hivyo kinahifadhi mnyororo na msisitizo wa δέχομαι; katika muktadha huu pia kinaweza kujumuisha maana ya kumkaribisha mtu.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweza kuonyesha kumpokea mtoto kwa sababu ya uhusiano wake na jina, nafsi, au mamlaka ya Yesu.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με
  choice: hanipokei mimi tu, bali pia yule aliyenituma
  rationale: 'Kiswahili cha kawaida huhitaji ''tu ... bali pia'' ili kuzuia kauli isieleweke kama inakana jambo lililothibitishwa mara moja kabla. Hii huonyesha upeo wa utofautishaji: kumpokea Yesu kunafikia pia kumpokea aliyemtuma.'
- source_word: τὸν ἀποστείλαντά με
  choice: yule aliyenituma
  rationale: Kirai hiki kinawasilisha kishiriki chenye kibainishi kama mtu anayejulikana kwa tendo la kumtuma Yesu.
theological_decisions:
- issue: Nguvu ya utofautishaji wa mwisho, 'si mimi bali aliyenituma'
  choice: hanipokei mimi tu, bali pia yule aliyenituma
  alternative: hanipokei mimi, bali yule aliyenituma
  rationale: Nakala ya Kigiriki ina οὐκ ... ἀλλά kwa sura kali, lakini muktadha umetoka kusema wazi kuwa mtu huyo anampokea Yesu. Tafsiri kuu inaeleza maana ya 'si mimi tu ... bali pia' katika Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo la karibu zaidi na Kigiriki na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Watoto wa namna hii' ni cha asili kuliko 'watoto kama hao' katika muktadha wa mtoto aliyepo mbele yao, na hakiongezi deixis ya 'watoto hawa'. Marudio ya 'kupokea' yamehifadhiwa kwa makusudi.
