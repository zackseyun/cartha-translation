translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli “funza wao hafi” inadumisha umoja wa nomino ya Kigiriki pamoja na kiwakilishi cha wingi, na “moto hauzimwi” huhifadhi hali ya kutendwa bila kuongeza ufafanuzi wa kimadhehebu.
