  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: sw
  text: ambapo[a] funza wao hafi, na moto hauzimwi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki (zikiwemo Sinaiticus na Vaticanus za karne ya nne) wala katika tafsiri za kale za Kikopti, lakini upo katika Alexandrinus ya karne ya tano, mapokeo ya Kilatini, na hati nyingi za baadaye za mapokeo ya Byzantine. Huenda uliongezwa baadaye na mwandishi aliyenakili maneno yaleyale kutoka mstari wa 48.
    reason: textual_critical
lexical_decisions:
- source_word: ὅπου
  choice: ambapo
  rationale: Hutafsiri kiunganishi cha mahali kwa lugha ya kawaida na kuendeleza moja kwa moja wazo la mstari uliotangulia.
- source_word: σκώληξ
  choice: funza
  rationale: Neno hili humaanisha funza au mdudu anayekula kitu kinachooza. “Funza” ni neno la kawaida na lenye picha iliyo wazi, huku likihifadhi taswira ya Isaya 66:24.
- source_word: τελευτᾷ
  choice: hafi
  rationale: Kitenzi hiki humaanisha kufikia mwisho au kufa; kinapotumiwa kuhusu kiumbe hai, “hafi” ni tafsiri ya asili na sahihi.
- source_word: σβέννυται
  choice: hauzimwi
  rationale: Hiki ni kitenzi cha wakati uliopo katika hali ya kutendwa, kinachoonyesha kuwa moto hauwekwi nje wala kukoma kuwaka. “Hauzimwi” ni Kiswahili cha kawaida na huhifadhi hali ya kutendwa ya Kigiriki.
