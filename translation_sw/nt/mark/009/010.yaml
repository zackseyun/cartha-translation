lexical_decisions:
- source_word: τὸν λόγον
  choice: neno hilo
  rationale: Katika muktadha, λόγος ni kauli ambayo Yesu alikuwa ametoa katika mstari wa 9. ‘Neno hilo’ ni tafsiri ya kawaida na yenye hadhi, huku kiwakilishi ‘hilo’ kikionyesha kauli iliyotangulia.
- source_word: ἐκράτησαν
  choice: wakalihifadhi
  rationale: κρατέω hapa, pamoja na πρὸς ἑαυτούς, ina maana ya kulishika au kuliweka jambo hilo katika kundi lao; ‘wakalihifadhi’ inadumisha wazo la kushika bila kudokeza tu ukimya.
- source_word: πρὸς ἑαυτοὺς
  choice: kati yao wenyewe
  rationale: Kirai hiki kinaweza kumaanisha kwamba waliliweka katika kundi lao na pia walilizungumzia wao kwa wao. ‘Kati yao wenyewe’ huhifadhi upeo huo vizuri kuliko ‘kwa siri’.
- source_word: συζητοῦντες
  choice: wakijadiliana
  rationale: Kitenzi kinaonyesha mazungumzo ya pamoja yenye kuulizana au kuchunguza jambo. ‘Wakijadiliana’ ni cha kawaida na hakiongezi wazo la ugomvi mkali.
- source_word: τί ἐστιν
  choice: maana ya
  rationale: Ingawa muundo wa moja kwa moja ni ‘ni nini,’ katika Kiswahili cha kawaida hapa wanafunzi wanajaribu kuelewa maana ya usemi huo; ‘maana ya’ huwasilisha jambo hilo kwa ufasaha.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: kufufuka kutoka miongoni mwa wafu
  rationale: Muundo wenye kitenzi-jina unaonyesha jambo walilokuwa wakilijadili. ‘Kutoka miongoni mwa wafu’ hudumisha kwa uwazi ἐκ νεκρῶν, yaani kuinuka kutoka katikati ya walio wafu, bila kufafanua zaidi ya matini.
theological_decisions:
- issue: Lugha ya ufufuo katika mjadala wa wanafunzi
  choice: kufufuka kutoka miongoni mwa wafu
  alternative: kufufuka kutoka kwa wafu
  rationale: Tafsiri iliyochaguliwa huhifadhi kwa karibu ἐκ νεκρῶν na mshangao wa wanafunzi kuhusu usemi wa Yesu. Haielezi mapema namna au maana ya ufufuo wala kuingiza ufafanuzi wa baadaye wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi ya maandiko. ‘Wakijadiliana’ huepuka kudokeza ugomvi, na ‘kati yao wenyewe’ huhifadhi wazo la mazungumzo yaliyobaki ndani ya kundi lao.
