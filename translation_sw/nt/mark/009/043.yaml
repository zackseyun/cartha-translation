  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: sw
  text: Na mkono wako ukikusababisha ujikwae[a], ukate mkono huo. Ni afadhali kwako kuingia katika uzima ukiwa umepungukiwa mkono kuliko kuwa na mikono miwili na kwenda Gehena[b], katika moto usiozimika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ukikusababisha utende dhambi.” Kitenzi cha Kigiriki kinaweza kumaanisha kumfanya mtu ajikwae, aanguke, au atende dhambi.'
    reason: lexical_alternative
  - marker: b
    text: Gehena ni umbo la Kigiriki la jina la mahali lililohusishwa na hukumu ya Mungu; kwa kawaida hutafsiriwa “jehanamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ukikusababisha ujikwae
  rationale: Huhifadhi sitiari ya kujikwaa na pia upana wa kitenzi, ambacho katika muktadha huu kinaweza kumaanisha kuingizwa katika dhambi.
- source_word: ἀπόκοψον
  choice: ukate
  rationale: Ni amri ya moja kwa moja na kali inayohifadhi picha halisi ya kuukata mkono.
- source_word: καλόν
  choice: ni afadhali
  rationale: Ingawa neno kimsingi humaanisha ‘ni vizuri,’ muundo wa kulinganisha na ἢ unahitaji Kiswahili cha kawaida ‘ni afadhali ... kuliko.’
- source_word: κυλλόν
  choice: ukiwa na ulemavu
  rationale: Hueleza hali ya kupungukiwa kiungo katika Kiswahili cha sasa bila kutumia neno la kudhalilisha.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: kuingia katika uzima
  rationale: Huhifadhi lugha nzito ya kieskatolojia pamoja na dhana ya kuingia katika hali au eneo la uzima.
- source_word: ἀπελθεῖν
  choice: kwenda
  rationale: Ni Kiswahili cha asili katika mlingano huu; mwelekeo wa kuondoka unaeleweka kwa kulinganishwa na ‘kuingia.’
- source_word: γέενναν
  choice: Gehena
  rationale: Huhifadhi jina mahususi la mahali lenye uhusiano na hukumu badala ya kulibadilisha moja kwa moja kuwa istilahi pana ya kitheolojia.
- source_word: ἄσβεστον
  choice: usiozimika
  rationale: Ni tafsiri sahihi na ya kawaida ya moto ambao hauwezi kuzimwa.
- source_word: χεὶρ σου
  choice: mkono wako
  rationale: Tafsiri ya moja kwa moja huhifadhi picha kuu ya kiungo cha mwili.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: kuwa na mikono miwili
  rationale: Huhifadhi kwa wazi mlingano wa Kigiriki kati ya kuingia ukiwa umepungukiwa mkono na kwenda hukumuni ukiwa na mikono yote miwili.
theological_decisions:
- issue: Uwasilishaji wa γέεννα katika kauli kuhusu hukumu
  choice: Gehena
  alternative: jehanamu
  rationale: Jina la Kigiriki limehifadhiwa ili picha mahususi ya Kiyahudi na uhusiano wake na hukumu visifichwe; istilahi iliyozoeleka zaidi imetajwa katika tanbihi.
- issue: Nguvu ya picha ya kuukata mkono
  choice: Kudumisha lugha halisi na kali ya kiungo cha mwili
  alternative: Kuifafanua kwa jumla kuwa kuacha dhambi
  rationale: Chanzo kinatumia picha ya kushtua kusisitiza uzito wa kujikwaa, dhambi, na hukumu; tafsiri haipaswi kuilegeza au kuifasiri kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Ni afadhali ... kuliko ...’ ni wa asili na huonyesha ulinganisho wazi. ‘Ulemavu’ huepuka lugha ya kudhalilisha huku ikidumisha maana ya kupungukiwa kiungo.
