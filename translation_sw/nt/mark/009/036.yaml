base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: sw
  text: 'Kisha akamchukua mtoto, akamsimamisha katikati yao[a], akamchukua mikononi mwake[b], akawaambia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamweka kati yao.” Kitenzi cha Kigiriki kimsingi humaanisha kumfanya mtu asimame.
    reason: lexical_alternative
  - marker: b
    text: Au “akamkumbatia.” Kitenzi cha Kigiriki kinaweza kumaanisha kumchukua mtu mikononi au kumkumbatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: akamchukua
  rationale: Kauli hii ya wakati uliopita inaonyesha tendo la kwanza kabla ya kitenzi kikuu; “akamchukua” ni ya asili katika simulizi la Kiswahili na inadumisha mfuatano wa matendo.
- source_word: παιδίον
  choice: mtoto
  rationale: Neno hili humaanisha mtoto, mara nyingi wa umri mdogo, lakini muktadha haulazimishi kuongeza “mdogo.”
- source_word: ἔστησεν
  choice: akamsimamisha
  rationale: Kitenzi hiki kimetumika kwa maana sababishi, yaani kumfanya mtu asimame. “Akamsimamisha” huhifadhi tendo hilo halisi kuliko “akamweka.”
- source_word: ἐν μέσῳ αὐτῶν
  choice: katikati yao
  rationale: Kirai hiki kinaonyesha nafasi ya mtoto katikati ya kundi na ni cha kawaida katika Kiswahili sanifu.
- source_word: ἐναγκαλισάμενος
  choice: akamchukua mikononi mwake
  rationale: Kitenzi kinaweza kumaanisha kumchukua mtu mikononi au kumkumbatia. Tafsiri hii inaweka wazi tendo linalomhusu mtoto bila kuondoa uwezekano wa maana ya kumkumbatia.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kusema jambo kwa watu fulani katika Kiswahili.
