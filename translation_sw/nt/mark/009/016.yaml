translation:
  language: sw
  text: Akawauliza, “Mnajadiliana nini kati yenu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnabishana kuhusu nini kati yenu?” Kitenzi hiki kinaweza kumaanisha kujadiliana au kubishana, kutegemea muktadha.
