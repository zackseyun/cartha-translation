lexical_decisions:
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi cha masimulizi “aka-” kinaunganisha tendo hili kwa kawaida na tukio lililotangulia bila kuongeza maelezo yasiyokuwapo katika Kigiriki.
- source_word: ἐπηρώτησεν
  choice: akawauliza
  rationale: Kitenzi hiki hapa kinaanzisha swali la moja kwa moja; “akawauliza” ni Kiswahili cha kawaida na kinaonyesha pia kwamba walengwa ni wengi.
- source_word: αὐτούς
  choice: -wa- (katika “akawauliza”)
  rationale: Kiwakilishi cha Kigiriki ni cha wingi na hakibainishi wazi wahusika ndani ya aya hii; alama ya yambwa “-wa-” inadumisha kutobainishwa huko.
- source_word: Τί
  choice: nini
  rationale: Hapa τί linauliza jambo au mada ya majadiliano, si hasa sababu yake.
- source_word: συζητεῖτε
  choice: mnajadiliana
  rationale: Neno linaweza kumaanisha kujadiliana, kubishana, au kufanya mjadala. “Mnajadiliana” huhifadhi maana pana bila kulazimisha uhasama, huku uwezekano wa mabishano ukielezwa katika tanbihi.
- source_word: πρὸς αὑτούς
  choice: ninyi kwa ninyi
  rationale: Usemi huu unaonyesha tendo la kuheshimiana kati ya watu wa kundi; “ninyi kwa ninyi” ni usemi wa asili wa Kiswahili unaodumisha maana hiyo.
