  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: sw
  text: Kwa maana alikuwa akiwafundisha wanafunzi wake na kuwaambia, “Mwana wa Adamu anakabidhiwa mikononi mwa watu[a], nao watamuua; na baada ya kuuawa, atafufuka baada ya siku tatu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mikono ya wanadamu.” Kigiriki hasa husema “katika mikono ya watu.” Usemi huo hudokeza kutiwa chini ya mamlaka au udhibiti wao.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika siku tatu.” Kigiriki hapa kinasema “baada ya siku tatu,” usemi ambao pia hutumiwa mahali pengine sambamba na “siku ya tatu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: alikuwa akiwafundisha
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea katika usimulizi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya sababu katika muktadha uliotangulia bila kuongeza tafsiri.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: wanafunzi wake
  rationale: Hili ni neno la kawaida na la asili kwa μαθηταί katika masimulizi ya Injili.
- source_word: ἔλεγεν αὐτοῖς
  choice: kuwaambia
  rationale: Imeunganishwa kwa kawaida na kitenzi kilichotangulia huku ikidokeza mafundisho yaliyoendelea.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya jina hili la kujitaja na inadumisha mwangwi wake wa kibiblia bila kulifafanua kupita kiasi.
- source_word: παραδίδοται
  choice: anatiwa
  rationale: Kauli tendwa ya sasa inadumishwa bila kumtaja mhusika anayemtia mikononi mwa watu; pia haibani maana kuwa usaliti pekee.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: mikononi mwa watu
  rationale: Nahau ya Kiswahili inadumisha picha ya kuwa chini ya mamlaka au udhibiti wa wanadamu.
- source_word: ἀποκτενοῦσιν
  choice: watamuua
  rationale: Huwasilisha moja kwa moja kauli ya wakati ujao na wahusika wake wa kibinadamu ambao hawakutajwa kwa jina.
- source_word: ἀποκτανθεὶς
  choice: baada ya kuuawa
  rationale: Huwakilisha hali ya kutendwa na kutangulia kwa kuuawa kabla ya kufufuka.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: baada ya siku tatu
  rationale: μετά pamoja na hali ya accusative kwa kawaida humaanisha ‘baada ya’; usemi huu haupatanishwi kimakusudi na ‘siku ya tatu.’
- source_word: ἀναστήσεται
  choice: atafufuka
  rationale: Huwasilisha kitenzi kama tendo lisiloelekezwa kwa mtendaji mwingine, badala ya kauli tendwa ‘atafufuliwa.’
theological_decisions:
- issue: Maana na sauti ya παραδίδοται
  choice: anatiwa mikononi mwa watu
  alternative: anasalitiwa / anakabidhiwa
  rationale: Kigiriki hakimtaji mtendaji na kinaweza kuhusisha usaliti, kukamatwa, na kuruhusu kwa Mungu; tafsiri hii haiondoi mvutano huo.
- issue: Uhusiano wa Ὁ υἱὸς τοῦ ἀνθρώπου na ἀνθρώπων
  choice: Mwana wa Adamu ... watu
  alternative: Mwana wa Adamu ... wanadamu
  rationale: ‘Watu’ ni ya kawaida katika Kiswahili na bado inadumisha utofauti kati ya jina ‘Mwana wa Adamu’ na wale anaotiwa chini ya mamlaka yao.
- issue: Sauti ya ἀναστήσεται
  choice: atafufuka
  alternative: atafufuliwa
  rationale: Kigiriki hapa ni cha kati na kinaweza kutafsiriwa kwa namna isiyo tendwa; uchaguzi huu haingizi kauli tendwa inayopatikana katika vifungu vingine.
- issue: Usemi wa wakati μετὰ τρεῖς ἡμέρας
  choice: baada ya siku tatu
  alternative: siku ya tatu / katika muda wa siku tatu
  rationale: Tafsiri inadumisha usemi mahsusi wa aya hii badala ya kuupatanisha na miundo mingine ya utabiri wa ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Miundo ‘alikuwa akiwafundisha’ na ‘baada ya kuuawa’ inadumisha mtiririko wa wakati wa Kigiriki bila kufanya sentensi kuwa nzito kupita kiasi.
