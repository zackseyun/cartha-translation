  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: sw
  text: Na jicho lako likikusababisha ujikwae, litupe mbali. Ni afadhali kwako kuingia katika ufalme wa Mungu ukiwa na jicho moja kuliko kuwa na macho mawili na kutupwa katika Gehena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jehanamu.” Neno la Kigiriki ni “Gehena,” istilahi inayotokana na Bonde la Hinomu na inayotumiwa kuhusu hukumu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: likikusababisha ujikwae
  rationale: Huhifadhi sitiari ya kujikwaa katika Kigiriki huku muktadha ukidokeza kuanguka katika dhambi, bila kuifupisha maana kuwa dhambi pekee.
- source_word: ἔκβαλε
  choice: litupe mbali
  rationale: Kitenzi kina maana ya kutoa au kutupa nje; kauli hii ni ya wazi na yenye nguvu bila kuongeza wazo mahususi la kung'oa ambalo halimo wazi katika kitenzi.
- source_word: καλόν ... ἢ
  choice: ni afadhali ... kuliko
  rationale: Ingawa καλόν kimsingi ni 'jema,' muundo huu wa kulinganisha huwasilishwa kwa Kiswahili cha kawaida kwa 'ni afadhali ... kuliko.'
- source_word: μονόφθαλμον
  choice: ukiwa na jicho moja
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira halisi ya mtu mwenye jicho moja.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri ya moja kwa moja, iliyo wazi na iliyozoeleka ya kirai hiki.
- source_word: βληθῆναι
  choice: kutupwa
  rationale: Huwakilisha kwa usahihi infinitivu tendwa ya βάλλω na kudumisha nguvu ya taswira.
- source_word: γέενναν
  choice: Gehena
  rationale: Unukuzi huu huhifadhi neno mahususi la Kigiriki lenye asili katika Bonde la Hinomu na matumizi yake kuhusu hukumu ya mwisho, badala ya kulifanya neno la jumla.
theological_decisions:
- issue: Uwasilishaji wa γέεννα katika muktadha wa hukumu
  choice: Gehena
  alternative: jehanamu
  rationale: Maandishi yanatumia istilahi mahususi γέεννα, si neno la jumla la ulimwengu wa wafu au adhabu. 'Gehena' huhifadhi upekee wake wa kihistoria na wa kieskatolojia; neno linalofahamika zaidi limewekwa katika tanbihi.
- issue: Upeo wa maana ya σκανδαλίζῃ
  choice: likikusababisha ujikwae
  alternative: likikusababisha utende dhambi
  rationale: Tafsiri iliyochaguliwa huhifadhi sitiari na nafasi yake pana ya maana, huku muktadha wa onyo ukifanya matokeo ya kimaadili yaeleweke bila kuyafafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa onyo na ulinganisho umehifadhiwa kwa lugha ya asili ya Kiswahili.
