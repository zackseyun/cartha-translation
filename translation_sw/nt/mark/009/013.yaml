id: MRK.9.13
reference: Mark 9:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: sw
  text: Lakini ninawaambia kwamba Eliya pia amekwisha kuja[a], nao wakamtendea yote waliyotaka, kama ilivyoandikwa kumhusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Eliya alikuwa amekwisha kuja katika mtu na huduma ya Yohana Mbatizaji; tazama Marko 9:11–12, na linganisha Mathayo 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofauti na matarajio ya wanafunzi kuhusu kuja kwa Eliya, kwa lugha ya kawaida na ya moja kwa moja.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni usemi wa moja kwa moja unaohifadhi nafsi ya kwanza na wingi wa walengwa.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: kwamba Eliya pia amekwisha kuja
  rationale: ‘Pia’ inawakilisha καὶ, na ‘amekwisha kuja’ inaonyesha tendo lililokamilika lenye umuhimu wa sasa unaodokezwa na hali timilifu ἐλήλυθεν.
- source_word: ἐποίησαν αὐτῷ
  choice: wakamtendea
  rationale: Kitenzi hiki ni cha asili katika Kiswahili na kinadumisha maana iliyo wazi mpaka kishazi kinachofuata kieleze walichomtendea.
- source_word: ὅσα ἤθελον
  choice: yote waliyotaka
  rationale: Inawasilisha upana usio na kikomo wa ὅσα pamoja na ἤθελον kwa Kiswahili cha kawaida.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Huu ni usemi unaotambulika wa kurejelea Maandiko na unaakisi hali timilifu ya γέγραπται.
- source_word: ἐπ’ αὐτόν
  choice: kumhusu
  rationale: Katika muktadha wa jambo lililoandikwa, maana inayofaa zaidi ni ‘kuhusu yeye’; ‘dhidi yake’ inawezekana kimuundo lakini si yenye uwezekano mkubwa hapa.
theological_decisions:
- issue: Utambulisho wa Eliya katika kauli hii
  choice: Jina ‘Eliya’ limehifadhiwa katika matini bila kufafanuliwa kuwa Yohana Mbatizaji.
  alternative: Kumtaja Yohana Mbatizaji moja kwa moja katika matini kama Eliya aliyekuja.
  rationale: Matini ya Kigiriki inamtaja Eliya, huku muktadha ukielekeza kwa namna ya kiwakilishi katika mtu na huduma ya Yohana Mbatizaji. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia; ufafanuzi unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Amekwisha kuja’ huhifadhi uzito wa hali timilifu bila kufanya sentensi kuwa ngumu; ‘wakamtendea’ ni ya asili kuliko tafsiri ya neno kwa neno ‘walifanya kwake.’
