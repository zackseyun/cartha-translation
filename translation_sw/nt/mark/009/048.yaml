  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: sw
  text: ambapo funza wao hafi,[a][b] na moto hauzimwi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambapo funza wao hafikii mwisho, na moto hauzimwi.”
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yanarejelea Isaya 66:24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: ambapo
  rationale: Kielezi hiki cha uhusiano kinatambulisha mahali panapoelezwa; “ambapo” ni Kiswahili cha kawaida na sahihi.
- source_word: ὁ σκώληξ αὐτῶν
  choice: funza wao
  rationale: “Funza” huwasilisha kiumbe anayekula kitu kinachooza na kuendeleza picha halisi ya hukumu katika dondoo la Isaya 66:24; “wao” huhifadhi uhusiano wa umilikaji katika Kigiriki.
- source_word: οὐ τελευτᾷ
  choice: hafi
  rationale: Ingawa kitenzi kinaweza kumaanisha “hafikii mwisho,” kikiwa na funza kama kiima maana ya kawaida hapa ni “hafi”; pia huhifadhi ukali na ufupi wa picha.
- source_word: τὸ πῦρ
  choice: moto
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hiyo.
- source_word: οὐ σβέννυται
  choice: hauzimwi
  rationale: Huhifadhi kauli ya kutendwa na hali inayoendelea ya moto kutokuzimwa; ni usemi wa asili na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Asili ya picha ya hukumu
  choice: Kuhifadhi picha halisi ya funza na moto bila kuifasiri katika tafsiri kuwa ni maangamizi, mateso ya kudumu, au sitiari pekee.
  alternative: Kuifanya wazi kuwa ni mateso yenye fahamu yanayoendelea, maangamizi yasiyoweza kubadilishwa, au aibu na unajisi wa kisitiari.
  rationale: Mstari unatoa picha kali ya hukumu na unarejelea Isaya 66:24, lakini wenyewe haulazimishi kutatuliwa kwa mjadala mpana wa mafundisho kuhusu hukumu. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Funza” ni wazi zaidi katika picha ya mwili unaooza kuliko “mdudu,” huku “hauzimwi” ikihifadhi kauli ya kutendwa ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
