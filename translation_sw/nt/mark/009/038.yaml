id: MRK.9.38
reference: Mark 9:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: sw
  text: Yohana akamwambia, “Mwalimu, tulimwona mtu akifukuza pepo kwa jina lako, nasi tulijaribu kumzuia[a] kwa sababu hakuwa akitufuata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: tulikuwa tukimzuia.'
    reason: Wakati usiotimilika wa Kigiriki unaweza kueleza tendo lililoendelea au lililorudiwa, au jaribio la kuzuia; ndiyo sababu maandishi yametumia ‘tulijaribu kumzuia.’
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Yohana akamwambia
  rationale: Kitenzi cha simulizi ἔφη kimetafsiriwa kwa wakati uliopita wa masimulizi; kiwakilishi αὐτῷ kinaunganishwa kwa kawaida katika ‘akamwambia,’ huku jina Yohana likitajwa wazi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hili ndilo neno la moja kwa moja na la kawaida la Kiswahili kwa διδάσκαλος, bila kuingiza cheo kingine kama ‘Rabi.’
- source_word: εἴδομέν τινα
  choice: tulimwona mtu
  rationale: τινα humaanisha mtu fulani asiyeainishwa. ‘Mtu’ ni usemi wa kawaida wa Kiswahili na hauongezi utambulisho wowote ambao haupo katika Kigiriki.
- source_word: ἐν τῷ ὀνόματί σου
  choice: kwa jina lako
  rationale: Usemi huu wa kawaida wa kibiblia unaonyesha kutenda kwa kutumia au chini ya mamlaka ya jina la Yesu, huku ukihifadhi namna ya usemi ya chanzo.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: akifukuza pepo
  rationale: ‘Kufukuza pepo’ ni usemi wa asili na unaoeleweka katika Kiswahili kwa tendo la kutoa δαιμόνια; unaepuka tafsiri ngumu isiyo ya kawaida.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: nasi tulijaribu kumzuia
  rationale: Kauli ya wakati usiotimilika ἐκωλύομεν inaweza kuonyesha tendo lililojaribiwa au lililoendelea. ‘Tulijaribu kumzuia’ ni ya kawaida na inahifadhi uwezekano wa jaribio bila kudai kwamba walifanikiwa.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: kwa sababu hakuwa akitufuata
  rationale: ἡμῖν ni ‘sisi,’ si ‘wewe.’ Tafsiri hii inahifadhi sababu aliyoitoa Yohana na mvutano wa simulizi kuhusu uhusiano wa mtu huyo na kundi la wanafunzi.
theological_decisions:
- issue: Mhusika ambaye mtu huyo hakuwa akimfuata
  choice: hakuwa akitufuata
  alternative: hakuwa akikufuata; hakuwa mmoja wetu
  rationale: Kigiriki kinasema wazi ἡμῖν, ‘sisi.’ Kutafsiri ‘wewe’ kungebadili rejeo kuwa Yesu, na ‘hakuwa mmoja wetu’ kungekuwa ufafanuzi mpana zaidi kuliko maneno ya chanzo. ‘Akitufuata’ huhifadhi mkazo wa Yohana juu ya kundi la wanafunzi na mvutano unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa moja kwa moja wa usemi umehifadhiwa, na ‘nasi’ huunganisha kwa kawaida taarifa ya pili ya Yohana. Alama ya tanbihi imewekwa mara tu baada ya kishazi inachokifafanua.
