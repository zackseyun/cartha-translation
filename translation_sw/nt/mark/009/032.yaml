  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: sw
  text: Lakini hawakuelewa kauli hiyo[a], nao waliogopa kumwuliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usemi huo.” Neno la Kigiriki ῥῆμα linaweza kumaanisha neno lililotamkwa, usemi, au kauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini wao (imewakilishwa kiasili na kiima cha kitenzi)
  rationale: δέ inaonyesha tofauti nyepesi na utabiri wa Yesu uliotangulia. Kiswahili hakihitaji kutaja kiwakilishi “wao” kwa kuwa kiima tayari kimo katika kitenzi “hawakuelewa.”
- source_word: ἠγνόουν
  choice: hawakuelewa
  rationale: ἀγνοέω hapa ina maana ya kushindwa kuelewa ujumbe uliotamkwa. Hali ya wakati uliopita katika Kigiriki imewasilishwa kwa njia ya kawaida katika Kiswahili.
- source_word: τὸ ῥῆμα
  choice: kauli hiyo
  rationale: ῥῆμα inarejelea ujumbe au jambo ambalo Yesu alikuwa ametoka kusema. “Kauli hiyo” ni wazi, ya kisasa, na inaelekeza kwa usemi mzima badala ya neno moja tu.
- source_word: ἐφοβοῦντο
  choice: waliogopa
  rationale: φοβέομαι inaonyesha hali yao ya kuwa na hofu. “Waliogopa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: αὐτὸν ἐπερωτῆσαι
  choice: kumwuliza
  rationale: Kiwakilishi kinamrejelea Yesu, na ἐπερωτάω hapa ni kumwuliza mtu ili kupata ufafanuzi. “Kumwuliza” ni usemi wa asili katika Kiswahili.
