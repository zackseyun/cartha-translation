  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: sw
  text: Baada ya siku sita[a], Yesu akawachukua Petro, Yakobo na Yohana, akawapeleka juu ya mlima mrefu, wakiwa wao peke yao[b]. Akabadilishwa sura mbele yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siku sita baadaye.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa faragha, wao peke yao.” Kigiriki kinatumia semi mbili za kuwatenga na wengine, kikisisitiza kwamba Yesu aliwachukua hawa watatu tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “akabadilishwa mbele yao.”
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Baada ya siku sita
  rationale: Huhifadhi kwa karibu muundo wa Kigiriki unaoonyesha muda uliopita kabla ya tukio linalofuata; ‘Siku sita baadaye’ ni namna nyingine ya asili katika Kiswahili.
- source_word: παραλαμβάνει
  choice: akawachukua
  rationale: Kitenzi kina maana ya kuwachukua pamoja naye. Wakati uliopita wa kisimulizi ni wa asili katika Kiswahili, ingawa Kigiriki kinatumia wakati uliopo wa kihistoria.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: akawapeleka juu ya mlima mrefu
  rationale: Hutoa wazo la kuwapeleka wakipanda hadi juu ya mlima bila kudokeza namna mahususi ya safari.
- source_word: κατ’ ἰδίαν μόνους
  choice: wakiwa wao peke yao
  rationale: Msisitizo wa ‘wao’ pamoja na ‘peke yao’ unaonyesha kwamba Yesu aliwachukua hawa watatu tu, mbali na wengine, bila kuifanya sentensi kuwa nzito kupita kiasi.
- source_word: μετεμορφώθη
  choice: akabadilishwa sura
  rationale: Huhifadhi hali ya kutendwa ya Kigiriki na kueleza mabadiliko yaliyoonekana, bila kufafanua chanzo au namna yake.
- source_word: ἔμπροσθεν αὐτῶν
  choice: mbele yao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba jambo hilo lilitokea machoni pao.
theological_decisions:
- issue: Tafsiri ya μετεμορφώθη katika muktadha unaomhusu Kristo
  choice: akabadilishwa sura
  alternative: akabadilishwa
  rationale: ‘Akabadilishwa sura’ linaonyesha tukio la mabadiliko yaliyoonekana bila kuingiza maelezo ya ziada ya kiteolojia kuhusu asili au utaratibu wa mabadiliko hayo. ‘Akabadilishwa’ pekee ni pana zaidi na halielezi wazi upande unaoonekana katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi unaoeleweka kwa wasomaji wa kawaida na hadhi inayofaa matini ya Maandiko. Viunganishi vya ‘aka-’ vinatoa mfululizo wa matendo kwa njia ya asili; alama zote za tanbihi zimewekwa katika matini kuu.
