base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: sw
  text: Mara nyingi imemtupa katika moto na katika maji ili amwangamize.[a] Lakini ikiwa unaweza kufanya lolote, utusaidie kwa kutuhurumia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya maji.” Kigiriki kina neno la wingi, “maji.”
    reason: lexical_alternative
  - marker: b
    text: Au “utusaidie, ukituhurumia” au “utusaidie kwa kutuonea huruma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: Mara nyingi
  rationale: Kauli hii inaonyesha jambo lililotokea kwa kurudiwa-rudiwa na ni ya kawaida katika Kiswahili sanifu.
- source_word: ἔβαλεν
  choice: amemtupa
  rationale: Wakati timilifu wa Kiswahili unaonyesha matendo yaliyotokea mara nyingi hadi wakati wa simulizi, huku kitenzi kikibaki na nguvu ya ‘kutupa.’
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: motoni na majini
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi maeneo mawili yenye hatari; ‘majini’ pia huakisi wingi wa Kigiriki ὕδατα.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: ili amwangamize
  rationale: ‘Ili’ huonyesha kusudi, na ‘amwangamize’ huhifadhi maana pana ya ἀπόλλυμι bila kuibana kuwa kuua tu.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Lakini ikiwa unaweza kufanya lolote
  rationale: ‘Lolote’ huwakilisha τι, na sentensi huhifadhi kusita kwa baba kuhusu uwezo wa Yesu.
- source_word: βοήθησον ἡμῖν
  choice: utusaidie
  rationale: Ombi hili la moja kwa moja na la heshima linawasilisha agizo la kuomba msaada wa haraka kwa namna ya kawaida katika Kiswahili.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: kwa kutuhurumia
  rationale: Huwasilisha huruma ya ndani inayodokezwa na σπλαγχνίζομαι na kuunganisha kiasili huruma hiyo na ombi la msaada.
theological_decisions:
- issue: Sauti ya ombi la baba na shaka iliyodokezwa kuhusu uwezo wa Yesu
  choice: ikiwa unaweza kufanya lolote
  alternative: ikiwa una uwezo wa kufanya lolote
  rationale: Kigiriki kinaonyesha wazi kusita kwa baba. Tafsiri haipunguzi wala kutatua mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Motoni na majini’ ni usemi wa kawaida unaohifadhi ulinganifu wa Kigiriki; alama zote za tanbihi zimewekwa katika matini kuu.
