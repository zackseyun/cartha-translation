  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: sw
  text: Na yeyote anayemfanya mmoja wa hawa wadogo wanaoniamini ajikwae, ingekuwa afadhali kwake kama jiwe kubwa la kusagia linaloendeshwa na punda[a] lingefungwa shingoni mwake, naye atupwe baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jiwe zito la kinu lililoendeshwa na punda, si jiwe dogo la kusagia kwa mkono.
    reason: lexical_clarification
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: anayemsababisha ... aanguke katika dhambi
  rationale: Kitenzi kina taswira ya kusababisha mtu ajikwae au aanguke, na katika muktadha huu kinaashiria kumshawishi atende dhambi au aache uaminifu. Usemi huu ni wa kawaida katika Kiswahili na huhifadhi taswira pamoja na uzito wa onyo.
- source_word: μικρῶν τούτων
  choice: hawa wadogo
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuufanya umaanishe watoto pekee; unaweza kuwahusu waamini walio dhaifu, wanyenyekevu, au wasio na cheo.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: wanaoniamini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishiriki kinachowatambulisha hawa wadogo kuwa waamini wa Yesu.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: ingekuwa afadhali kwake
  rationale: Huwasilisha kwa Kiswahili cha kawaida nguvu ya ulinganisho katika onyo hili kali.
- source_word: μύλος ὀνικός
  choice: jiwe kubwa la kusagia linalozungushwa na punda
  rationale: Usemi huo humaanisha jiwe zito la kinu lililozungushwa na punda, tofauti na jiwe dogo la kusagia kwa mkono.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: lingefungwa shingoni mwake
  rationale: Hutoa kwa njia ya kawaida maana ya jiwe kuwekwa au kuning'inizwa kuzunguka shingo.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: naye akatupwa baharini
  rationale: Huendeleza muundo wa hali inayodhaniwa baada ya 'ingekuwa afadhali' na kuonyesha matokeo yaliyo wazi ya kutupwa baharini.
theological_decisions:
- issue: Wanaorejelewa na “hawa wadogo”
  choice: Usemi mpana unaoweza kuwahusu waamini walio wadogo, dhaifu, au wasio na cheo
  alternative: Watoto hasa; au wanafunzi wanyenyekevu kwa ujumla
  rationale: Kirai 'wanaoniamini' kinaonyesha kuwa umri pekee si lazima uwe jambo linalokusudiwa. Tafsiri haiwalazimishi wasomaji kuchagua maana nyembamba, ingawa watoto wanaweza kujumuishwa.
- issue: Maana ya σκανδαλίσῃ
  choice: kusababisha aanguke katika dhambi
  alternative: kumfanya ajikwae; kumkosesha imani
  rationale: Kitenzi kinaweza kuhusisha dhambi au kuanguka kiroho. Tafsiri huhifadhi taswira ya kuanguka bila kuifanya kuwa 'kukwaza hisia,' maana ambayo ni dhaifu mno hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ukali wa onyo na upana wa 'hawa wadogo,' huku ikifafanua kifaa cha kusagia kisichojulikana sana kwa wasomaji wa leo.
