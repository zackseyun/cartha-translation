  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na rahisi kueleweka. Muundo wa sentensi unafuata mtiririko wa simulizi la Kigiriki huku ukibaki wa asili kwa msomaji wa Kiswahili.
