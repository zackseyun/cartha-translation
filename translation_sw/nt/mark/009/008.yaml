  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: sw
  text: Ghafla, walipotazama huku na huku, hawakumwona tena mtu yeyote isipokuwa Yesu peke yake akiwa pamoja nao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: Mara
  rationale: Neno hili linaonyesha tukio la ghafla; “Mara” ni usemi wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: περιβλεψάμενοι
  choice: walipotazama huku na huku
  rationale: Huwasilisha tendo la kutazama pande zote bila kutumia muundo mzito au usio wa kawaida.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: hawakumwona tena mtu yeyote
  rationale: Huhifadhi mkazo wa οὐκέτι, yaani kwamba hawakuendelea kumwona mtu mwingine.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: isipokuwa Yesu peke yake
  rationale: Huhifadhi kwa uwazi maana ya kutengwa kwa Yesu pekee bila kupunguza msisitizo wa μόνον.
- source_word: μεθ’ ἑαυτῶν
  choice: akiwa pamoja nao
  rationale: Hutoa kwa Kiswahili cha kawaida wazo kwamba Yesu ndiye aliyebaki pale pamoja nao.
theological_decisions:
- issue: Msisitizo kwamba Yesu ndiye pekee aliyeonekana baada ya tukio
  choice: “isipokuwa Yesu peke yake”
  alternative: “ila Yesu tu”
  rationale: Chaguo hili linahifadhi msisitizo wa maandishi ya Kigiriki bila kuongeza tafsiri ya kiitikadi kuhusu umuhimu wa tukio.
