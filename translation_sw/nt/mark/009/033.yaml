  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: sw
  text: Nao wakafika Kapernaumu. Yesu alipokuwa ndani ya nyumba, akawauliza, “Mlikuwa mkijadiliana nini njiani?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mlikuwa mkibishana kuhusu nini njiani?” Kitenzi kinaweza kumaanisha kujadiliana, kutafakari pamoja, au kubishana; mstari unaofuata unaonyesha kwamba walikuwa wakizungumzia ni nani kati yao aliyekuwa mkuu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: wakafika
  rationale: Katika muktadha huu, kitenzi cha aoristi pamoja na εἰς Καφαρναούμ kinasimulia kufika kwao Kapernaumu; ‘wakafika’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa umbo lililozoeleka katika tafsiri za Kiswahili.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ndani ya nyumba
  rationale: Huhifadhi mahali halisi panapotajwa na nomino yenye kibainishi bila kufasiri kuwa ilikuwa nyumbani kwa Yesu.
- source_word: γενόμενος
  choice: alipokuwa
  rationale: Kirai cha hali ya kushiriki kina kazi ya wakati hapa; ‘alipokuwa’ huunganisha kwa kawaida mazingira ya ndani ya nyumba na tendo linalofuata.
- source_word: ἐπηρώτα
  choice: akawauliza
  rationale: Kiswahili cha masimulizi hutumia ‘akawauliza’ kwa urahisi na kinaweza kudokeza tendo lililoendelea la imperfect bila kujenga kauli nzito isiyo ya kawaida.
- source_word: Τί
  choice: nini
  rationale: Ni kiwakilishi cha kuuliza cha kawaida na sahihi katika swali hili.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni usemi wa kawaida wa Kiswahili kwa jambo lililotokea wakati wa safari.
- source_word: διελογίζεσθε
  choice: mkijadiliana
  rationale: Huhifadhi upana wa maana ya kujadiliana, kubishana, au kuhojiana bila kuamua mapema kwamba mazungumzo hayo yalikuwa ugomvi.
theological_decisions:
- issue: Mhusika wa wingi katika ἦλθον na mhusika wa umoja katika γενόμενος/ἐπηρώτα
  choice: Kutafsiri kufika kwa wingi kama ‘wakafika,’ kisha kumtaja Yesu wazi kuwa ndiye aliyekuwa ndani ya nyumba na aliyewauliza.
  alternative: ‘Wakafika Kapernaumu. Naye alipokuwa ndani ya nyumba, akawauliza…’
  rationale: Muktadha unamtambulisha Yesu kuwa mhusika wa umoja. Kutaja jina lake huondoa utata wa kiwakilishi katika Kiswahili bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa ‘Nao wakafika’ huhifadhi mwendelezo wa masimulizi; ‘ndani ya nyumba’ huepuka tafsiri ya ziada ya ‘nyumbani.’
