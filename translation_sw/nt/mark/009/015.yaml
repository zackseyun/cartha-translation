  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: sw
  text: Mara tu umati wote ulipomwona, ulishangaa sana[a], ukamkimbilia na kumsalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulistaajabu sana” au “ulishtuka.” Kitenzi cha Kigiriki kinaweza kueleza mshangao mkubwa, kustaajabu, au kushtuka kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara tu
  rationale: Huwasilisha uharaka unaosisitizwa na kiashiria hiki kinachotumiwa mara nyingi katika simulizi la Marko, kwa Kiswahili cha kawaida na cha asili.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Hudumisha maana ya kundi lote kama jumla bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: ἰδόντες αὐτόν
  choice: ulipomwona
  rationale: Kauli ya wakati inaonyesha kwamba kumwona ndiko kulikochochea mwitikio wa umati.
- source_word: ἐξεθαμβήθησαν
  choice: ulishangaa sana
  rationale: Huwasilisha mshangao wenye nguvu bila kuufanya kuwa hofu pekee wala kudai sababu ya mwitikio ambayo aya haitaji.
- source_word: προστρέχοντες
  choice: ukamkimbilia
  rationale: Huonyesha mwendo wa haraka kuelekea kwake na hudumisha mfuatano hai wa simulizi.
- source_word: ἠσπάζοντο αὐτόν
  choice: na kumsalimu
  rationale: Kitenzi kwa kawaida humaanisha kumsalimu au kumkaribisha mtu; “kumsalimu” ni chaguo lisiloegemea tafsiri maalumu katika muktadha huu.
theological_decisions:
- issue: Maana mahsusi ya mwitikio wa umati katika ἐξεθαμβήθησαν
  choice: Mshangao mkubwa bila kutaja sababu yake
  alternative: Kushtuka kwa hofu, au mshangao uliosababishwa na mwonekano wa kung'aa wa Yesu
  rationale: Aya inasema tu kwamba umati ulimwona Yesu, ukapata mwitikio mkali, kisha ukamkimbilia na kumsalimu. Tafsiri haiongezi wazo la hofu pekee wala maelezo ya mwonekano wa kung'aa ambayo hayajasemwa katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa kisarufi katika “umati ... ulishangaa ... ukamkimbilia” umehifadhiwa ili sentensi iwe laini na umati uonekane kama kundi zima.
