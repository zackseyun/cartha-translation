  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: sw
  text: Na mavazi yake yakawa yakimetameta, meupe sana, kiasi ambacho hakuna dobi yeyote duniani anayeweza kuyafanya yawe meupe hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: mavazi
  rationale: Ni neno la jumla la nguo; “mavazi” ni la kawaida, lenye heshima, na halidokezi joho maalumu.
- source_word: ἐγένετο
  choice: yakawa
  rationale: Linaonyesha mabadiliko ya hali yaliyotokea katika tukio hili.
- source_word: στίλβοντα
  choice: yakimetameta
  rationale: Linafikisha mwonekano wa kung'aa kwa mwanga mkali bila kuongeza maelezo ya kitheolojia yasiyosemwa wazi.
- source_word: λευκὰ λίαν
  choice: meupe sana
  rationale: “Meupe” linatafsiri rangi moja kwa moja, huku “sana” likihifadhi nguvu ya λίαν kwa Kiswahili cha kawaida.
- source_word: γναφεύς
  choice: dobi
  rationale: Katika muktadha huu ni mtu anayesafisha na kuyafanya mavazi yawe meupe; “dobi” linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Ni usemi wa asili unaoweka ulinganisho ndani ya uwezo wa binadamu hapa duniani.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: anayeweza kuyafanya yawe meupe hivyo
  rationale: Linahifadhi wazo la kutokuwa na uwezo wa kufikia kiwango hicho cha weupe; kiwakilishi “y” kinarejelea mavazi kwa uwazi wa Kiswahili.
theological_decisions:
- issue: Maelezo ya athari inayoonekana katika kugeuka sura
  choice: Kueleza mavazi kuwa yakimetameta na meupe kupita uwezo wa dobi wa duniani
  alternative: Kuongeza maneno kama “yaking'aa kwa utukufu”
  rationale: Aya inaeleza mwonekano wa mavazi bila kutaja wazi chanzo au maana yake ya kitheolojia; tafsiri haipaswi kuingiza ufafanuzi huo ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “kiasi ambacho” unaweka wazi ulinganisho wa kiwango, na “dobi” ni neno linaloeleweka kuliko istilahi ya kale au ya kitaalamu.
