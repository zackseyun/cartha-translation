  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: sw
  text: Kwa maana mafuta haya yenye harufu nzuri yangeweza kuuzwa kwa zaidi ya dinari mia tatu, na mapato yake kutolewa kwa maskini.” Nao wakamkemea kwa ukali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamkaripia.” Kitenzi cha Kigiriki kinaonyesha kutoridhika sana au lawama kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: mafuta yenye harufu nzuri
  rationale: Neno hili linamaanisha mafuta au marhamu yenye manukato. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa bila kudokeza kimakosa manukato ya kunyunyizia pekee.
- source_word: πραθῆναι
  choice: kuuzwa
  rationale: Kauli tendwa ya kitenzi inaonyesha tendo ambalo lingeweza kufanyika; pamoja na ἠδύνατο, ‘yangeweza kuuzwa’ ni Kiswahili cha asili.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: kwa zaidi ya dinari mia tatu
  rationale: ἐπάνω pamoja na kiasi katika hali ya jenitivi humaanisha kuzidi kiwango kilichotajwa. ‘Kwa zaidi ya’ huwasilisha wazi bei ya mauzo.
- source_word: δηναρίων τριακοσίων
  choice: dinari mia tatu
  rationale: ‘Dinari’ huhifadhi sarafu ya kihistoria badala ya kuibadili kuwa fedha ya kisasa.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: fedha hizo wakapewa maskini
  rationale: Ingawa Kigiriki kinasema kwa kifupi ‘na kutolewa kwa maskini,’ katika muktadha kinachotolewa ni mapato ya mauzo. Kutaja ‘fedha hizo’ hufanya rejeo liwe wazi na ‘wakapewa’ humtendea ‘maskini’ kama watu.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: wakamkemea kwa ukali
  rationale: Kitenzi kinaonyesha kutoridhika kwa nguvu au karipio kali lililoelekezwa kwa mwanamke. ‘Kumkemea kwa ukali’ huhifadhi nguvu hiyo katika Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya malalamiko yaliyotangulia.
- source_word: ἠδύνατο
  choice: yangeweza
  rationale: Hapa kitenzi kinaonyesha uwezekano ambao haukutimizwa; hali ya masharti ya Kiswahili inafaa muktadha huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Mafuta yenye harufu nzuri’ limechaguliwa badala ya neno linaloweza kumaanisha manukato ya kisasa pekee; ‘dinari’ linahifadhi mazingira ya kihistoria.
