  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Mimi ni[a], nanyi mtamwona Mwana wa Adamu akiwa ameketi upande wa kuume wa Nguvu[b] na akija pamoja na mawingu ya mbinguni.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani kinasema kwa ufupi, “Mimi ni.” Katika muktadha huu yaweza pia kueleweka, “Mimi ndiye huyo.”
    reason: alternative_reading
  - marker: b
    text: “Nguvu” ni namna ya heshima ya kumrejelea Mungu.
    reason: cultural_note
  - marker: c
    text: Maneno haya yana mwangwi wa Zaburi 110:1 na Danieli 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Hili ni jibu la kawaida na la wazi kwa Kiswahili katika muktadha wa swali la kuhani mkuu. Kiyunani hakina kijalizo kilichoandikwa wazi; tanbihi inaonyesha hilo ili kutohitimisha zaidi ya matini.
- source_word: ὄψεσθε
  choice: mtamwona
  rationale: Kitenzi hiki cha wakati ujao kinaeleza kuona moja kwa moja; umbo la wingi linaendana na wasikilizaji waliozungumziwa.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la kujitaja la Yesu lililozoeleka katika Biblia ya Kiswahili na linahifadhi mwangwi wa Danieli 7.
- source_word: ἐκ δεξιῶν
  choice: upande wa kuume wa
  rationale: Kirai hiki kinawasilisha nafasi ya heshima na mamlaka. ‘Upande wa kuume’ ni cha asili kwa Kiswahili cha sasa bila kupoteza taswira ya matini.
- source_word: τῆς δυνάμεως
  choice: Nguvu
  rationale: Nomino ya dhahania imehifadhiwa kama namna ya heshima ya kumrejelea Mungu, badala ya kuibadilisha moja kwa moja kuwa ‘Mungu.’ Herufi kubwa na tanbihi zinaonyesha matumizi hayo maalumu.
- source_word: καθήμενον
  choice: akiwa ameketi
  rationale: Muundo huu unahifadhi hali inayoendelea ya kishiriki na unaonyesha nafasi ya kuketi yenye heshima na mamlaka.
- source_word: ἐρχόμενον
  choice: akija
  rationale: Neno hili linahifadhi maana ya kuja na mwangwi wa kinabii wa Danieli 7.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: pamoja na mawingu ya mbinguni
  rationale: Tafsiri hii inafuata Kiyunani kwa karibu na kudumisha lugha ya kinabii na ya kutukuka.
- source_word: καὶ ... καὶ
  choice: nanyi ... na
  rationale: Viunganishi vimehifadhiwa kwa namna ya asili ya Kiswahili, vikikusanya madai ya kuketi na kuja.
theological_decisions:
- issue: Iwapo Ἐγώ εἰμι itafsiriwe kama uthibitisho rahisi au utambulisho uliopanuliwa
  choice: Mimi ndiye katika matini kuu, pamoja na tanbihi kuhusu umbo halisi la Kiyunani
  alternative: Mimi niko; Mimi ndiye huyo
  rationale: ‘Mimi ndiye’ ni jibu linaloeleweka kwa Kiswahili katika muktadha huu. Tanbihi inalinda ukweli kwamba Kiyunani kinasema tu ‘Mimi niko/ndimi,’ hivyo tafsiri hailazimishi mwangwi wa kitheolojia wala kuuondoa.
- issue: Jinsi ya kutafsiri τῆς δυνάμεως
  choice: Nguvu
  alternative: Mungu; Mwenye Nguvu
  rationale: Matini ya Kiyunani inatumia usemi wa heshima badala ya kumtaja Mungu moja kwa moja. ‘Nguvu’ inahifadhi usemi huo, na tanbihi inafafanua maana yake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Nguvu’ imeandikwa kwa herufi kubwa kwa sababu hapa ni usemi maalumu unaomrejelea Mungu. Muundo wa sentensi umehifadhi madai mawili yanayohusiana: Mwana wa Adamu kuketi katika nafasi ya mamlaka na kuja pamoja na mawingu ya mbinguni.'
