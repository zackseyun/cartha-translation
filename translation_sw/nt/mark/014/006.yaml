  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Mwacheni. Kwa nini mnamsumbua? Amenitendea tendo zuri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amenifanyia jambo zuri.” Kwa maana halisi, ἐν ἐμοί ni “ndani yangu”; katika muktadha huu inaonyesha tendo lililoelekezwa kwa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Mwacheni
  rationale: Amri hii inataka waache mara moja kuingilia au kumlaumu mwanamke huyo. ‘Mwacheni’ ni ya kawaida, ya moja kwa moja, na inaleta nguvu ya Yesu kumtetea.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Kwa nini mnamsumbua?
  rationale: Kirai hiki kwa maana halisi ni kama ‘kwa nini mnampatia taabu?’ lakini ni nahau ya kumsababishia mtu shida au usumbufu. ‘Mnamsumbua’ ni Kiswahili cha asili na kinadumisha sauti ya kukemea.
- source_word: καλὸν ἔργον
  choice: jambo zuri
  rationale: καλός inaweza kumaanisha zuri, jema, bora, au linalofaa. ‘Jambo zuri’ linahifadhi sifa ya uzuri na ufaafu wa tendo bila kulifafanua kwa namna finyu kuwa tendo la kimaadili tu.
- source_word: ἠργάσατο
  choice: amefanyia
  rationale: Kitenzi hiki kinaelezwa kwa Kiswahili cha kawaida kupitia ‘amefanyia,’ kikichanganywa na yambwa ‘jambo zuri’ na kuonyesha kwamba tendo hilo lilielekezwa kwa Yesu.
- source_word: ἐν ἐμοί
  choice: -ni- katika ‘amenifanyia’
  rationale: Ingawa ἐν kwa kawaida ni ‘katika/ndani ya,’ hapa kirai kinaonyesha tendo lililoelekezwa kwa Yesu. Muundo ‘amenifanyia’ unatoa maana hiyo kwa Kiswahili cha asili bila kusisitiza mahali pa kimwili pekee.
- source_word: δὲ
  choice: Lakini
  rationale: 'δέ inaonyesha geuko lenye utofautishaji mdogo: Yesu anajibu ukosoaji dhidi ya mwanamke. ‘Lakini’ linafaa katika mtiririko huo.'
theological_decisions:
- issue: Maana ya καλὸν ἔργον katika kusifu tendo la mwanamke
  choice: jambo zuri
  alternative: tendo jema; jambo bora
  rationale: Tafsiri hii inahifadhi tathmini chanya ya Yesu na uzuri au ufaafu wa tendo hilo bila kuingiza wazo mahususi la kimadhehebu kuhusu sifa au kustahili.
- issue: Nguvu ya ἐν ἐμοί
  choice: amenifanyia
  alternative: amefanya kwangu; amefanya juu yangu; amefanya ndani yangu
  rationale: ‘Amenifanyia’ linaonyesha kuwa tendo hilo lilielekezwa kwa Yesu binafsi. Halifungi maana kwenye tendo la kimwili pekee wala kuleta dai la kiteolojia lisilo wazi katika kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja, huku ‘Mwacheni’ na ‘mnamsumbua’ zikiwa wazi kwa wasomaji wa kawaida.
