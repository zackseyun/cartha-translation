base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: sw
  text: Wakampeleka Yesu kwa kuhani mkuu, na makuhani wakuu wote, wazee wote, na waandishi wote wakakusanyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kitenzi “wanakusanyika” katika wakati wa sasa wa kihistoria—wakati wa sasa unaotumiwa kwa athari ya uhai katika simulizi la wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: Wakampeleka
  rationale: Kitenzi hiki huonyesha kumwongoza au kumchukua mtu kwenda mahali pengine, mara nyingi akiwa chini ya ulinzi. “Wakampeleka” ni Kiswahili cha kawaida na kinachofaa katika simulizi bila kuongeza maelezo yasiyokuwamo.
- source_word: ἀρχιερέα
  choice: kuhani mkuu
  rationale: Umoja hapa unamtaja mwenye cheo cha juu cha ukuhani; tafsiri hii inatofautisha wazi mtu huyo na kundi la makuhani wakuu linalotajwa baadaye.
- source_word: συνέρχονται
  choice: wakakusanyika
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, mfululizo wa vitenzi vya -ka- ni wa asili katika simulizi la Kiswahili na unaonyesha tendo lililofuata kwa uwazi.
- source_word: πάντες
  choice: wote
  rationale: Neno hili linahifadhi msisitizo wa Kigiriki kwamba viongozi hao walikusanyika kwa ujumla wao.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Katika wingi, neno hili linataja kundi la viongozi wa ukuhani, si kuhani mkuu mmoja aliyetajwa mwanzoni.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika muktadha huu ni cheo cha viongozi wanaotambulika, si maelezo ya umri wao tu.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: “Waandishi wa sheria” linaonyesha kazi yao ya kitaalamu na kidini kwa uwazi zaidi kwa msomaji wa leo, huku likihifadhi wazo la waandishi waliobobea katika Sheria.
theological_decisions:
- issue: Wakati wa sasa wa kihistoria katika συνέρχονται ndani ya simulizi la wakati uliopita
  choice: 'Imetafsiriwa kwa muundo wa kisimulizi wa wakati uliopita: “wakakusanyika”'
  alternative: “wanakusanyika,” ili kuakisi moja kwa moja wakati wa sasa wa kihistoria
  rationale: Hili ni suala la mtindo wa simulizi, si uamuzi wa kimafundisho. Muundo wa -ka- unasomeka kwa kawaida katika Kiswahili na kudumisha mfuatano wa matukio; tanbihi inaonyesha badiliko la wakati lililopo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “nao” unaunganisha tukio la kupelekwa kwa Yesu na kukusanyika kwa viongozi bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa baada ya kitenzi kinachohusika.
