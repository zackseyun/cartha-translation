  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: sw
  text: Walipokuwa wakila, alichukua mkate, akaubariki, akaumega, akawapa, akasema, “Chukueni; huu ni mwili wangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huu unawakilisha mwili wangu” / “huu unamaanisha mwili wangu.” Kigiriki kinasema kihalisi, “huu ni mwili wangu.”
    reason: Hutoa fasiri mbadala zinazowezekana huku matini kuu ikihifadhi maneno ya moja kwa moja ya Kigiriki na kutoamua mjadala wa kiteolojia.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Walipokuwa wakila
  rationale: Muundo wa genitivi huru wenye kitenzi-shirikishi cha wakati uliopo unaonyesha tendo lililokuwa likiendelea wakati huo huo; usemi huu ni wa kawaida na huhifadhi maana hiyo.
- source_word: λαβὼν ἄρτον
  choice: alichukua mkate
  rationale: Kitenzi-shirikishi cha aoristi kimetafsiriwa kwa kitenzi kamili ili simulizi lisomeke kwa kawaida. ἄρτον haina kibainishi, hivyo “mkate” haiongezi maelezo yasiyokuwamo kama vile “mkate mmoja.”
- source_word: εὐλογήσας
  choice: akaubariki
  rationale: Katika muktadha wa chakula, neno hili linaweza kumaanisha kutamka baraka juu ya mkate. Kiambishi cha yambwa “u” kinaonyesha mkate uliotajwa na kutoa Kiswahili cha kawaida bila kukigeuza kuwa “alishukuru.”
- source_word: ἔκλασεν
  choice: akaumega
  rationale: Kumega ndilo neno la kawaida kwa kuvunja mkate vipande kwa ajili ya kuwagawia wengine, na kiambishi “u” hudumisha yambwa kutoka sentensi iliyotangulia.
- source_word: ἔδωκεν αὐτοῖς
  choice: akawapa
  rationale: Kiswahili huweza kuacha yambwa ‘mkate’ ikiwa tayari inaeleweka; “akawapa” ni wazi na haiongezi wazo la ‘kuwagawia’ lisilotajwa moja kwa moja.
- source_word: Λάβετε
  choice: Chukueni
  rationale: Ni amri ya moja kwa moja kwa watu wengi na ni ya kawaida katika Kiswahili cha sasa. Yambwa halijaongezwa kwa sababu halitajwi wazi katika Kigiriki.
- source_word: τοῦτό ἐστιν
  choice: huu ni
  rationale: Muundo wa kawaida wa kitenzi kishirikishi umetafsiriwa moja kwa moja. “Huu” inapatana na ngeli ya “mkate” bila kuamua kama kauli hiyo inapaswa kufasiriwa kihalisi au kiishara.
- source_word: τὸ σῶμά μου
  choice: mwili wangu
  rationale: σῶμα humaanisha moja kwa moja “mwili”; muktadha hautoi sababu ya kuweka fasiri ya kiishara ndani ya matini kuu.
theological_decisions:
- issue: Maneno ya Yesu kuhusu mkate katika Mlo wa Bwana
  choice: huu ni mwili wangu
  alternative: huu unawakilisha mwili wangu / huu unamaanisha mwili wangu
  rationale: Kigiriki kinatumia kitenzi kishirikishi cha kawaida ἐστιν, ‘ni.’ Tafsiri kuu huhifadhi kauli hiyo na mvutano wake wa kiteolojia badala ya kuamua mjadala wa kisakramenti kwa njia ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya “aka-” huhifadhi mwendo wa simulizi, huku “Chukueni” ikiwa amri ya kawaida kwa kundi.
