  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: sw
  text: Makuhani wakuu na baraza lote[a] walikuwa wakitafuta ushahidi dhidi ya Yesu ili wamuue, lakini hawakuwa wakipata ushahidi wowote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana mahususi zaidi, “Sanhedrini yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Makuhani wakuu
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; katika Kiswahili cha kawaida si lazima kitafsiriwe kwa neno la pekee hapa.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wakuu wa kikuhani wa Yerusalemu.
- source_word: ὅλον τὸ συνέδριον
  choice: baraza lote
  rationale: ‘Baraza’ hutafsiri maana ya συνέδριον kwa uwazi, huku ‘lote’ likihifadhi ὅλον; ‘Sanhedrini’ imewekwa kama mbadala katika tanbihi.
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama wakati usiotimilika wa Kigiriki.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: ushahidi dhidi ya Yesu
  rationale: Katika muktadha huu wa kesi, μαρτυρία ni ushahidi au ushuhuda unaotolewa dhidi ya mtu; ‘ushahidi’ ni wa kawaida na hauelekezi kwa shahidi kama mtu.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: ili wamuue
  rationale: Muundo huu unaonyesha kusudi. ‘Wamuue’ ni wa moja kwa moja na wa asili, bila kupoteza maana ya kumsababishia kifo.
- source_word: καὶ οὐχ ηὕρισκον
  choice: lakini hawakupata
  rationale: Ingawa καί kwa kawaida ni ‘na’, hapa tofauti ya kimantiki kati ya kutafuta na kutopata inaelezwa kwa asili kwa ‘lakini’. Kiswahili cha kawaida hutumia wakati uliopita sahili hapa bila kupoteza hali ya kutopata katika mchakato huo.
theological_decisions:
- issue: Utambulisho wa συνέδριον
  choice: baraza lote
  alternative: Sanhedrini yote
  rationale: Neno la Kigiriki linataja baraza linalotawala; kutafsiri maana yake huifanya sentensi ieleweke kwa msomaji wa kawaida, huku tanbihi ikihifadhi jina la kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa msomaji wa kawaida, huku tendo endelevu la kutafuta na muktadha wa kisheria vikihifadhiwa.
