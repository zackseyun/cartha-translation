base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: sw
  text: Wakaanza kuhuzunika na kumwambia mmoja baada ya mwingine, “Hakika si mimi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Je, si mimi?” Swali la Kigiriki limetungwa kwa namna inayotarajia jibu la “hapana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Wakaanza
  rationale: Kitenzi hiki kinaonyesha mwanzo wa matendo yanayofuata; “wakaanza” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: λυπεῖσθαι
  choice: kuhuzunika
  rationale: Neno hili linaonyesha kuingiwa na huzuni au kufadhaika. “Kuhuzunika” ni la asili, lenye heshima, na linafaa uzito wa muktadha.
- source_word: καὶ λέγειν αὐτῷ
  choice: na kumwambia
  rationale: Ingawa λέγειν kimsingi ni “kusema,” muundo wa Kiswahili “kumwambia” unawasilisha kwa kawaida tendo la kusema maneno haya kwake bila kubadili mhusika anayerejelewa na kiwakilishi.
- source_word: εἷς κατὰ εἷς
  choice: mmoja baada ya mwingine
  rationale: Usemi huu unaonyesha kwamba kila mmoja alisema kwa zamu; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: Μήτι ἐγώ;
  choice: Hakika si mimi?
  rationale: μήτι hutanguliza swali ambalo msemaji anatarajia lijibiwe kwa “hapana.” “Hakika si mimi?” huhifadhi matarajio hayo na ufupi wa Kigiriki.
theological_decisions:
- issue: Nguvu ya swali la wanafunzi
  choice: Hakika si mimi?
  alternative: Je, ni mimi?
  rationale: Kipashio μήτι kinaonyesha kwamba kila msemaji anatarajia jibu la kukataa. “Je, ni mimi?” kingeondoa hisia hii ya hofu yenye matarajio kwamba si yeye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mmoja baada ya mwingine” ni wazi kwa wasomaji wa kawaida, na “Hakika si mimi?” huhifadhi swali fupi lenye matarajio ya kukanusha.
