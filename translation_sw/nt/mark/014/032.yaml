  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: sw
  text: Wakafika mahali palipoitwa Gethsemane, naye akawaambia wanafunzi wake, “Ketini hapa mpaka niombe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: wakafika
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida na wa asili katika Kiswahili; ‘wakafika’ pia huonyesha kufika kwao mahali hapo.
- source_word: χωρίον
  choice: mahali
  rationale: Neno hili linaweza kumaanisha eneo, kipande cha ardhi, au shamba; ‘mahali’ huhifadhi upana wa maana bila kuongeza habari isiyomo katika matini.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: palipoitwa Gethsemane
  rationale: Hii ni lugha ya asili ya Kiswahili inayowasilisha kwa usahihi kwamba mahali hapo paliitwa kwa jina hilo.
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati wa sasa wa kihistoria umetafsiriwa kwa mtindo wa kawaida wa masimulizi ya Kiswahili. Wingi wa walengwa na maneno yanayofuata hufanya ‘akawaambia’ kuwa sahihi na wa asili kuliko ‘akasema kwa’.
- source_word: μαθηταῖς
  choice: wanafunzi
  rationale: ‘Wanafunzi’ ndilo neno la kawaida la Kiswahili kwa μαθηταί na huhifadhi uhusiano wa mwalimu na wanaomfuata ili kujifunza.
- source_word: Καθίσατε
  choice: Ketini
  rationale: Amri iko katika wingi; ‘Ketini’ ni amri fupi, ya moja kwa moja, na ya asili.
- source_word: ὧδε
  choice: hapa
  rationale: Ni kielezi cha mahali cha moja kwa moja na cha kawaida.
- source_word: ἕως προσεύξωμαι
  choice: mpaka niombe
  rationale: ‘Mpaka’ huonyesha kikomo cha muda kama ἕως pamoja na kitenzi tegemezi; tafsiri hii haiongezi wazo la kukamilisha sala wala kubadili maana kuwa ‘wakati ninapoomba’.
