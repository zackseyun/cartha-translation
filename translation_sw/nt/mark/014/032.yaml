translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wakati wa sasa wa kihistoria wa Marko umewekwa katika wakati uliopita wa kisimulizi kwa uasilia wa Kiswahili; hakuna tanbihi iliyoongezwa kwa kuwa tofauti hiyo si lazima kwa uelewa wa mstari.
