  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: sw
  text: Aliporudi tena, aliwakuta wamelala, kwa maana macho yao yalikuwa yamelemewa[a], nao hawakujua wamjibu nini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “macho yao yalikuwa mazito.” Taswira ya Kigiriki ni kwamba macho yao yalikuwa yakilemewa kwa usingizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha tendo linalorudiwa katika simulizi; “tena” ni kifupi na cha kawaida katika Kiswahili.
- source_word: ἐλθὼν
  choice: aliporudi
  rationale: Ingawa kimsingi ni “alipokuja,” muktadha unaonyesha Yesu anarudi kwa wanafunzi; “aliporudi” huleta mwendo wa simulizi kwa Kiswahili cha kawaida bila kubadili maana ya tukio.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: aliwakuta wamelala
  rationale: Huwasilisha hali inayoendelea aliyowakuta nayo kwa usemi wa kawaida na wa wazi wa Kiswahili.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: kwa maana macho yao yalikuwa yamelemewa
  rationale: Hifadhi taswira ya Kigiriki ya macho kubebeshwa uzito, badala ya kufafanua moja kwa moja kuwa usingizi ndio uliowalemea.
- source_word: οἱ ὀφθαλμοὶ
  choice: macho
  rationale: Ni rejeo halisi la kiungo cha mwili, hivyo hakuna sababu ya kulifafanua kwa maneno mengine.
- source_word: οὐκ ᾔδεισαν
  choice: hawakujua
  rationale: Hutoa maana ya moja kwa moja ya kutokuwa na ujuzi wa jibu la kutoa.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: wamjibu nini
  rationale: Ni muundo wa asili wa swali lisilo la moja kwa moja katika Kiswahili na huhifadhi kwamba jibu lilielekezwa kwake Yesu.
