id: MRK.14.36
reference: Mark 14:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: sw
  text: Naye alikuwa akisema[a], “Abba, Baba[b], mambo yote yanawezekana kwako. Niondolee kikombe hiki[c]. Lakini si nitakavyo mimi, bali utakavyo wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alisema.” Kitenzi cha Kigiriki kinaweza kuonyesha kwamba maneno haya yalikuwa yakiendelea au yakirudiwa.
    reason: lexical_alternative
  - marker: b
    text: “Abba” ni neno la Kiaramu la kumwita baba; limehifadhiwa hapa pamoja na neno la Kigiriki “Baba.”
    reason: cultural_note
  - marker: c
    text: “Kikombe” ni sitiari ya kibiblia kwa mateso yaliyowekwa mbele yake; linganisha Marko 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Kauli ya wakati uliopita usiotimilika inaweza kuonyesha kusema kulikokuwa kunaendelea au kurudiwa; tafsiri hii inahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Baba
  rationale: Inahifadhi neno la Kiaramu “Abba” pamoja na ufafanuzi wake wa Kigiriki kama mwito wa moja kwa moja, bila kuongeza kimilikishi kisichotajwa wazi.
- source_word: πάντα δυνατά σοι
  choice: mambo yote yanawezekana kwako
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi upeo mpana wa πάντα na maana ya uwezekano katika δυνατά.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Niondolee kikombe hiki
  rationale: Muundo wa Kiswahili unawasilisha ombi la kuondolewa kwa kikombe kutoka kwake bila kufafanua na hivyo kufifisha sitiari.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Lakini si nitakavyo mimi, bali utakavyo wewe
  rationale: Kitenzi kinachodokezwa katika sehemu ya pili kimewasilishwa kwa muundo sambamba wa Kiswahili; msisitizo wa viwakilishi ἐγώ na σύ umehifadhiwa kwa “mimi” na “wewe.”
theological_decisions:
- issue: Mwito kwa Mungu kwa kutumia Kiaramu na Kigiriki
  choice: Abba, Baba
  alternative: Abba, Baba yangu
  rationale: Chanzo kinahifadhi mwito wa Kiaramu na ufafanuzi wa Kigiriki. Zote zimehifadhiwa bila kuongeza “yangu,” ambalo halipo wazi katika mstari.
- issue: Nguvu ya kisitiari ya “kikombe”
  choice: kikombe hiki
  alternative: mateso haya
  rationale: Tafsiri inahifadhi picha ya chanzo na mwangwi wake wa kibiblia badala ya kuibadili moja kwa moja kuwa tafsiri ya maana yake.
- issue: Tofauti kati ya matakwa ya Yesu na ya Baba
  choice: si nitakavyo mimi, bali utakavyo wewe
  alternative: si ninachotaka mimi, bali unachotaka wewe
  rationale: Muundo huu unahifadhi mvutano wa maombi na kusisitiza kujisalimisha kwa mapenzi ya Baba bila kudhoofisha au kueleza kupita kiasi matakwa yanayotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Alikuwa akisema” huhifadhi hali ya kitenzi cha Kigiriki; “Niondolee” ni ya kawaida na yenye nguvu katika muktadha wa sala. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
