- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: wakamkamata
  rationale: Hii ni nahau ya Kigiriki ya kumtia mtu mikono kwa nia ya kumweka chini ya mamlaka au kumzuia. “Wakamkamata” ni Kiswahili cha kawaida na cha asili katika tukio hili la ukamataji.
- source_word: ἐκράτησαν αὐτόν
  choice: kumshikilia
  rationale: κρατέω hapa ina maana ya kumshika kwa nguvu na kuendelea kumzuia. “Kumshikilia” huhifadhi tofauti kwa kiasi fulani na kitendo kilichotangulia bila kuongeza dhana ya taratibu rasmi za kisheria.
