base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: sw
  text: Lakini akaanza kulaani[a] na kuapa, “Simjui mtu huyu mnayemzungumzia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutamka laana.” Huenda maana ni “kujiapiza kwa laana.” Kigiriki hakitaji wazi laana hiyo ilimlenga nani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini
  rationale: δέ inaonyesha hatua mpya yenye utofauti wa kiasi katika simulizi; “Lakini” linafaa katika kuonyesha jinsi Petro alivyozidisha ukanushaji wake.
- source_word: ἤρξατο
  choice: akaanza
  rationale: Kitenzi hiki pamoja na vitenzi-jina vinavyofuata kina maana ya kuanza kutenda jambo.
- source_word: ἀναθεματίζειν
  choice: kutamka laana
  rationale: Neno hili linahusu kuomba au kutamka laana, si kutumia tu lugha chafu. Tafsiri hii haimtaji anayelengwa na laana kwa kuwa Kigiriki hakumtaji wazi.
- source_word: ὀμνύναι
  choice: kuapa
  rationale: “Kuapa” ni usemi wa kawaida na wenye uzito unaowasilisha tendo la kutoa kiapo.
- source_word: ὅτι
  choice: alama za kunukuu usemi wa moja kwa moja
  rationale: ὅτι hapa linaanzisha yaliyomo katika kiapo na ukanushaji wa Petro; usemi wa moja kwa moja ni wa asili katika Kiswahili.
- source_word: Οὐκ οἶδα
  choice: Simjui
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida, nayo inadumisha ukali wa ukanushaji bila kuongeza maelezo.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: mtu huyu
  rationale: Kiwakilishi cha kuonyesha τοῦτον kinadumishwa kwa “huyu,” bila kuongeza dharau isiyodaiwa na matini.
- source_word: ὃν λέγετε
  choice: mnayemzungumzia
  rationale: Katika muktadha huu λέγετε linarejelea mtu ambaye waliokuwa pale walikuwa wakimtaja; “mnayemzungumzia” ni Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Asili na mlengwa wa laana katika ἀναθεματίζειν
  choice: Kusema kwamba Petro alianza kutamka laana bila kueleza laana hiyo ilimlenga nani.
  alternative: Alianza kulaani; au alianza kujiapiza kwa laana.
  rationale: Muktadha unaweza kudokeza kwamba Petro aliomba laana impate mwenyewe ikiwa alikuwa akisema uongo, lakini Kigiriki hakitaji wazi mlengwa wa laana. Tafsiri kuu inadumisha kutokubainishwa huko, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. “Kutamka laana” huepuka kuelewa ἀναθεματίζειν kama kutumia matusi tu, huku “mnayemzungumzia” likitoa usemi wa kawaida unaoeleweka kwa urahisi.
