  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: sw
  text: Naye Yuda Iskariote, mmoja wa wale Kumi na Wawili, akaenda kwa wakuu wa makuhani ili amkabidhi kwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amsaliti kwao.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumkabidhi,” na katika kisa cha Yuda, kukabidhi huko ni tendo la usaliti.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida, huku kikimtambulisha Yuda kama mhusika wa hatua inayofuata.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Yuda Iskariote
  rationale: Jina na lakabu yake zimetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: mmoja wa wale Kumi na Wawili
  rationale: Kauli hii inamtambulisha Yuda kuwa mmoja wa kundi maalumu la wanafunzi kumi na wawili; herufi kubwa zinaonyesha kuwa ni jina la kundi linalotambulika.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Kitenzi hiki cha simulizi kinaonyesha mwendo rahisi kwenda mahali pengine bila kuongeza wazo lisilo lazima la kuondoka kabisa.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: kwa wakuu wa makuhani
  rationale: Wingi huu unarejelea viongozi wa ukuhani huko Yerusalemu, si kuhani mkuu mmoja tu.
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linaonyesha wazi kusudi la Yuda kwenda kwa wakuu wa makuhani.
- source_word: παραδοῖ
  choice: amkabidhi
  rationale: Kitenzi hiki huhusu kumweka mtu mikononi au chini ya mamlaka ya wengine. ‘Amkabidhi’ huhifadhi maana yake pana bila kuficha kwamba katika muktadha huu tendo hilo ni usaliti.
- source_word: αὐτὸν ... αὐτοῖς
  choice: amkabidhi kwao
  rationale: Kiambishi ‘-m-’ kinawakilisha Yesu kama anayekabidhiwa, na ‘kwao’ kinawataja wakuu wa makuhani kama wanaompokea.
theological_decisions:
- issue: Maana ya παραδοῖ katika muktadha wa usaliti wa Yuda
  choice: amkabidhi kwao
  alternative: amsaliti kwao
  rationale: Ingawa tendo la Yuda ni usaliti, kitenzi cha Kigiriki kina maana pana ya kumkabidhi mtu kwa wengine na kinatumiwa tena katika simulizi la mateso. Tafsiri kuu inadumisha upana huo na mvutano wa simulizi; kidokezo cha usaliti kinaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. ‘Wakuu wa makuhani’ ni istilahi iliyo wazi kwa uongozi wa kikuhani, na ‘Kumi na Wawili’ limetumiwa kama jina la kundi maalumu.
