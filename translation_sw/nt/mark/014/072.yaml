  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: sw
  text: 'Mara jogoo akawika kwa mara ya pili. Petro akakumbuka neno ambalo Yesu alikuwa amemwambia: “Kabla jogoo hajawika mara mbili, utanikana mara tatu.” Kisha akavunjika moyo[a], akalia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “akavunjika moyo” ni gumu kuelewa. Linaweza pia kumaanisha “alipoyatafakari hayo,” au kurejelea tendo la nje, kama vile kujifunika kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara hiyo
  rationale: Hutoa maana ya jambo kutokea papo hapo na kuhifadhi mwendo wa haraka unaopatikana katika simulizi la Marko.
- source_word: ἐκ δευτέρου
  choice: mara ya pili
  rationale: Huhifadhi wazi hesabu ya tukio, badala ya kutumia tu ‘tena.’
- source_word: ἀλέκτωρ ... ἐφώνησεν
  choice: jogoo akawika
  rationale: ‘Kuwika’ ndilo neno la kawaida na la asili kwa sauti ya jogoo katika Kiswahili.
- source_word: ἀνεμνήσθη
  choice: akakumbuka
  rationale: Hutoa maana ya moja kwa moja ya Petro kukumbuka jambo lililosemwa awali.
- source_word: τὸ ῥῆμα
  choice: neno
  rationale: ‘Neno’ linakaribia muundo wa Kigiriki, huku kishazi kinachofuata kikieleza yaliyomo katika neno hilo.
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ambalo Yesu alikuwa amemwambia
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba maneno hayo yalisemwa kabla ya tukio hili.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Kabla jogoo hajawika mara mbili
  rationale: Huhifadhi uhusiano wa wakati na idadi iliyo wazi katika Kigiriki bila kumtambulisha jogoo fulani.
- source_word: τρίς με ἀπαρνήσῃ
  choice: utanikana mara tatu
  rationale: ‘Kunikana’ ni usemi wa kawaida wa kibiblia na wa Kiswahili unaobeba maana ya kukataa uhusiano au kumkana mtu.
- source_word: ἐπιβαλών
  choice: akavunjika moyo
  rationale: Kirai hiki kigumu kimetafsiriwa kwa namna inayoonyesha kuvunjika kwa Petro kihisia bila kudai kwa uhakika tendo fulani la mwili; uwezekano mwingine umewekwa katika tanbihi.
- source_word: ἔκλαιεν
  choice: na kulia
  rationale: Huwasilisha kitendo cha kuendelea cha kulia kwa lugha fupi, ya kawaida na yenye heshima.
theological_decisions:
- issue: Maana ya ἐπιβαλών na jinsi inavyoonyesha mwitikio wa Petro
  choice: akavunjika moyo
  alternative: alipolitafakari; akajifunika kichwa; au alifanya tendo fulani la nje
  rationale: Neno hili lina utata wa kileksika na kisintaksia. Tafsiri kuu inaonyesha uzito wa mwitikio wa Petro bila kuamua kwamba alifanya ishara maalumu ya mwili; tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia vitenzi vya mfululizo kwa mtiririko wa asili, huku utata halisi wa ἐπιβαλών ukihifadhiwa kwa tanbihi.
