  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: sw
  text: Kwa maana wengi walikuwa wakitoa ushuhuda wa uongo dhidi yake, na shuhuda zao hazikupatana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya asili, “shuhuda zao hazikuwa sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi hiki kimetumika kama nomino na kinarejelea watu wengi bila kuongeza neno ‘mashahidi,’ ambalo halijaandikwa wazi katika chanzo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaeleza au kuunga mkono simulizi lililotangulia; ‘kwa maana’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἐψευδομαρτύρουν
  choice: walikuwa wakitoa ushahidi wa uongo
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililokuwa likiendelea au kurudiwa, huku ‘ushahidi wa uongo’ ukihifadhi muktadha wa kisheria.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: Katika muktadha huu wa mashtaka, κατά pamoja na umilikishi huonyesha ushahidi wa uhasama ulioelekezwa kwake.
- source_word: ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν
  choice: ushahidi wao haukupatana
  rationale: Ingawa ἴσαι kihalisi ni ‘sawa,’ hapa ina maana kwamba maelezo ya ushahidi hayakulingana; ‘haukupatana’ ni ya asili na huhifadhi maana hiyo.
