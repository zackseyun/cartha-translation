  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: sw
  text: Lakini yeye aliendelea kunyamaza, wala hakujibu lolote. Kuhani mkuu akamwuliza tena, akamwambia, “Je, wewe ndiye Masihi[a], Mwana wa Yeye Ahimidiwaye[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός (Christos) hapa ni cheo cha Kimasihi katika muktadha wa Kiyahudi.
    reason: alternative_reading
  - marker: b
    text: “Yeye Ahimidiwaye” ni namna ya Kiyahudi ya kumrejelea Mungu kwa heshima.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: aliendelea kunyamaza
  rationale: Kauli ya wakati usiotimilika inaonyesha ukimya uliodumu; usemi huu unaeleza mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: ἀπεκρίνατο οὐδέν
  choice: wala hakujibu lolote
  rationale: Huhifadhi msisitizo wa kutotoa jibu hata moja, huku ‘wala’ ikiunganisha kwa kawaida wazo hili na kuendelea kwake kunyamaza.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa swali la kuhani mkuu kwa ufupi na kwa lugha ya kawaida.
- source_word: ἀρχιερεὺς
  choice: Kuhani mkuu
  rationale: Hili ndilo jina la kawaida na sahihi la cheo hicho cha Kiyahudi katika muktadha wa kesi.
- source_word: ἐπηρώτα
  choice: akamwuliza
  rationale: Kitenzi kina maana ya kuuliza kwa makini katika mazingira ya uchunguzi; ‘akamwuliza’ ni cha kawaida na hakiongezi ukali usiotajwa wazi.
- source_word: λέγει
  choice: na kumwambia
  rationale: Muundo huu wa simulizi ni wa asili katika Kiswahili na unaunganisha swali lenyewe na kitendo cha kuuliza, ingawa wakati uliopo wa kihistoria wa Kigiriki hauigwa kimitambo.
- source_word: χριστός
  choice: Masihi
  rationale: Hapa ni cheo cha mfalme aliyeahidiwa katika mazingira ya Kiyahudi, kwa hiyo ‘Masihi’ huwasilisha kazi yake kama cheo kuliko ‘Kristo,’ ambalo mara nyingi hueleweka kama jina.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Mwana wa Aliyebarikiwa
  rationale: Huhifadhi namna ya Kiyahudi ya kumrejelea Mungu kwa heshima bila kubadili usemi huo moja kwa moja kuwa ‘Mwana wa Mungu.’
theological_decisions:
- issue: Uwasilishaji wa Χριστός kama cheo cha moja kwa moja
  choice: Masihi
  alternative: Kristo
  rationale: Katika swali la kuhani mkuu, neno hili linafanya kazi kama cheo cha Kimasihi, si kama jina la kawaida; ‘Masihi’ huhifadhi muktadha huo.
- issue: Uwasilishaji wa τοῦ εὐλογητοῦ
  choice: Aliyebarikiwa
  alternative: Mungu
  rationale: Uchaguzi huu unahifadhi usemi wa heshima unaomrejelea Mungu kwa njia isiyo ya moja kwa moja, badala ya kufafanua ndani ya matini jambo ambalo Kigiriki huliacha katika mfumo huo wa heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘Je, wewe ndiye...?’ unafaa swali rasmi la mahakamani. Alama za tanbihi zimewekwa kwenye istilahi zinazohusika moja kwa moja.
