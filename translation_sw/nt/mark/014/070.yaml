  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: sw
  text: Lakini akakana tena. Baada ya muda mfupi, wale waliokuwa wamesimama karibu wakamwambia Petro tena, “Hakika wewe ni mmoja wao, kwa maana wewe pia ni Mgalilaya, na namna yako ya kusema inafanana na yao[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lafudhi yako inafanana na yao” au “usemi wako ni kama usemi wao.” Neno la Kigiriki λαλιά linaweza kumaanisha namna ya kusema, lahaja, au lafudhi.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale hazina maneno “na namna yako ya kusema inafanana na yao.”
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: akakana
  rationale: Kitenzi cha wakati usiotimilika kinaweza kuonyesha tendo lililoendelea au kurudiwa; pamoja na πάλιν, ‘akakana tena’ ni Kiswahili cha kawaida kinachohifadhi kurudiwa kwa tendo bila kulifanya kuwa zito.
- source_word: μετὰ μικρὸν
  choice: baada ya muda mfupi
  rationale: Huu ni msemo wa muda unaoonyesha kwamba muda mfupi ulipita.
- source_word: οἱ παρεστῶτες
  choice: wale waliokuwa wamesimama karibu
  rationale: Tafsiri hii inadumisha wazo la watu waliokuwa wamesimama hapo karibu, si kuwataja tu kwa ujumla kuwa waliokuwapo.
- source_word: ἔλεγον
  choice: wakamwambia
  rationale: Katika simulizi ya Kiswahili, muundo huu ni wa kawaida na unaeleza walichomwambia Petro; neno ‘tena’ linadumisha wazo la kurudiwa katika muktadha.
- source_word: Ἀληθῶς
  choice: Hakika
  rationale: Neno hili linaonyesha uthibitisho wenye uhakika na linafaa katika usemi wa moja kwa moja wa Kiswahili.
- source_word: ἐξ αὐτῶν εἶ
  choice: wewe ni mmoja wao
  rationale: Ni usemi wa kawaida unaoonyesha kwamba Petro alihesabiwa kuwa wa kundi lililohusishwa na Yesu.
- source_word: καὶ γὰρ
  choice: kwa maana wewe pia
  rationale: ‘Kwa maana’ inatoa sababu ya dai lao, huku ‘pia’ ikihifadhi nguvu ya καί.
- source_word: Γαλιλαῖος
  choice: Mgalilaya
  rationale: Jina hili humaanisha mtu anayetoka Galilaya; Kiswahili hutumia umbo la ‘Mgalilaya’.
- source_word: ἡ λαλιά σου
  choice: namna yako ya kusema
  rationale: Huhifadhi upana wa maana ya λαλιά, ambayo inaweza kumaanisha lafudhi, lahaja, au mtindo wa kusema, bila kuibana kuwa lafudhi pekee.
- source_word: ὁμοιάζει
  choice: inafanana na yao
  rationale: Kiswahili cha kawaida huhitaji kitu cha kulinganishwa; ‘na yao’ kinaweka wazi ulinganisho unaodokezwa na muktadha bila kubadili hoja.
