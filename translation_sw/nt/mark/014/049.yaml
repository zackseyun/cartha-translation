  source_fidelity: Kifungu cha kwanza kinawasilisha kwa uaminifu καθ’ ἡμέραν, ἤμην πρὸς ὑμᾶς, ἐν τῷ ἱερῷ, na διδάσκων. Hata hivyo, “lakini hamkunikamata” hutafsiri καί kama kiunganishi cha upinzani, ilhali Kigiriki kinasema “na hamkunikamata.” Katika sentensi ya mwisho, “haya yametokea” ni ufafanuzi unaowezekana wa kishazi pungufu cha ἀλλ’ ἵνα, lakini huongeza dai la wazi la wakati/tukio ambalo chanzo hakulisemi. “Lakini ni ili Maandiko yatimizwe” hutoa kiunganishi kidogo kinachohitajika katika Kiswahili huku ikiacha utendwa na ufupi wa chanzo wazi zaidi.
  naturalness: Kiswahili ni sanifu na cha kawaida. “Kila siku nilikuwa pamoja nanyi hekaluni, nikifundisha” ni laini na ya asili. Marekebisho ya “na hamkunikamata” huepusha marudio yasiyo ya lazima ya “lakini”; “Lakini ni ili ...” ni muundo wa kifasihi unaoeleweka na unaofaa kwa usemi wa Yesu katika muktadha huu.
  terminology: “Hekaluni,” “Maandiko,” na “hamkunikamata” ni chaguo sahihi. Tanbihi ya hekalu hufafanua kwa usahihi kwamba ἱερόν ni eneo la hekalu, wala si patakatifu pa ndani pekee. “Kukamata” inafaa kwa κρατέω katika muktadha wa kukamatwa; tanbihi hutoa “kushika” kama mbadala.
