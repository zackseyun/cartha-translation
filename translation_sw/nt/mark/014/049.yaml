id: MRK.14.49
reference: Mark 14:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: sw
  text: Kila siku nilikuwa pamoja nanyi hekaluni[a], nikifundisha, na hamkunikamata[b]. Lakini ni ili Maandiko yatimizwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hekaluni” hapa ni katika eneo lote la hekalu, kutia ndani nyua zake, si ndani ya patakatifu pekee.
    reason: cultural_note
  - marker: b
    text: Au, “hamkunishika.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu zaidi, “Lakini ili Maandiko yatimizwe.” Kigiriki kinaacha kitenzi kikuu kikidokezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kila siku
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo lililorudiwa siku baada ya siku.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: nilikuwa pamoja nanyi
  rationale: Unaonyesha kuwapo kwa Yesu waziwazi kati yao kwa lugha ya kawaida na yenye heshima.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee; neno la kawaida linafafanuliwa katika tanbihi.
- source_word: διδάσκων
  choice: nikifundisha
  rationale: Huhifadhi tendo linaloendelea sambamba na kuwapo kwake hekaluni.
- source_word: οὐκ ἐκρατήσατέ με
  choice: hamkunikamata
  rationale: Katika muktadha huu κρατέω ina maana ya kumkamata mtu; chaguo hili linaweza kujumuisha kushikwa kwa nguvu na kutiwa chini ya ulinzi.
- source_word: ἀλλ’ ἵνα
  choice: Lakini haya yametokea ili
  rationale: Kigiriki kina kishazi pungufu kisichotaja kitenzi kikuu. Kiswahili cha kawaida huhitaji wazo la kitenzi; ‘haya yametokea’ linaweka wazi maana inayodokezwa bila kubainisha kwa nguvu zaidi namna ya kusudi au matokeo.
- source_word: πληρωθῶσιν
  choice: yatimizwe
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na wazo la Maandiko kufikia utimilifu.
- source_word: αἱ γραφαί
  choice: Maandiko
  rationale: Katika muktadha huu ni maandiko matakatifu yaliyotambuliwa; herufi kubwa inaonyesha matumizi hayo maalumu.
theological_decisions:
- issue: Kishazi pungufu cha kusudi/matokeo na utimilifu wa Maandiko
  choice: Lakini haya yametokea ili Maandiko yatimizwe
  alternative: Lakini ili Maandiko yatimizwe
  rationale: Chanzo kinaacha kitenzi kikuu kikidokezwa baada ya ἀλλ’ ἵνα. Tafsiri kuu inaongeza tu kitenzi kinachohitajika kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi ufupi na utata wa muundo wa Kigiriki. ‘Ili’ haikulazimishi tafsiri kuwa amri wala haiongezi maelezo ya kimadhehebu kuhusu uhusiano wa kusudi na matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘pamoja nanyi’ huhifadhi uwepo wa Yesu kati yao; ‘nikifundisha’ ni wa asili na unaonyesha tendo lililoendelea. Alama zote za tanbihi zimewekwa katika matini kuu.
