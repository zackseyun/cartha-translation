translation:
  language: sw
  text: 'Lakini baadhi yao walikuwa na ghadhabu miongoni mwao[a]: “Kwa nini upotevu huu wa mafuta haya yenye harufu nzuri[b] umetokea?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wao kwa wao” au “mioyoni mwao.” Usemi wa Kigiriki unaweza kumaanisha walilalamikiana ndani ya kundi au kila mmoja alikuwa na mwitikio wa ndani.
    reason: lexical_alternative
  - marker: b
    text: Au “marhamu yenye harufu nzuri.” Neno la Kigiriki μύρον humaanisha mafuta au marhamu yenye manukato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Lakini ... walikasirika
  rationale: δέ inaendeleza simulizi huku ikionyesha tofauti kati ya tendo la mwanamke na mwitikio wao; “lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: τινες
  choice: baadhi yao
  rationale: Kiwakilishi hiki cha wingi hakitaji watu hususa. “Baadhi yao” ni kifupi na hudumisha kutotajwa kwao wazi.
- source_word: ἀγανακτοῦντες
  choice: walikasirika
  rationale: Kitenzi kinaonyesha kutoridhika kwa nguvu au ghadhabu yenye hukumu ya kimaadili; “walikasirika” ni ya asili na inaeleweka kwa wasomaji wengi.
- source_word: πρὸς ἑαυτούς
  choice: wao kwa wao
  rationale: Katika muktadha wa malalamiko yanayonukuliwa, usemi huu unaeleweka kwa urahisi kama mwitikio au mazungumzo ya pamoja ndani ya kundi, huku uwezekano mwingine ukielezwa katika tanbihi.
- source_word: Εἰς τί
  choice: Kwa nini
  rationale: Hili ni swali la kusudi au matokeo; “Kwa nini” ndilo tamko la kawaida la Kiswahili katika muktadha huu.
- source_word: ἡ ἀπώλεια αὕτη
  choice: haya yamepotezwa bure
  rationale: ἀπώλεια hapa ina maana ya upotevu au matumizi yanayohukumiwa kuwa ya bure. Muundo wa kitenzi ni wa asili zaidi kwa Kiswahili kuliko nomino nzito kama “upotevu huu,” na unaweka wazi kuwa hii ni tathmini ya wasemaji.
- source_word: τοῦ μύρου
  choice: manukato
  rationale: μύρον ni mafuta au marhamu yenye harufu nzuri. “Manukato” ni neno la sasa linaloeleweka kwa urahisi, huku asili yake ya kimafuta ikifafanuliwa katika tanbihi.
- source_word: γέγονεν
  choice: yamepotezwa
  rationale: Katika swali hili, timilifu ya γίνομαι huonyesha tendo lililokamilika lenye matokeo ya sasa. Kiswahili hutumia kwa kawaida muundo huu kueleza kuwa manukato yamefanyiwa kile wanachokiita upotevu.
