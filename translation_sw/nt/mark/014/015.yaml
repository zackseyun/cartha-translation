lexical_decisions:
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Kiwakilishi hiki kina msisitizo; “yeye mwenyewe” kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: δείξει
  choice: atawaonyesha
  rationale: Kitenzi cha wakati ujao, pamoja na ὑμῖν, kwa kawaida humaanisha “atawaonyesha.”
- source_word: ἀνάγαιον
  choice: chumba cha juu
  rationale: Humaanisha chumba kilicho sehemu ya juu ya nyumba; “chumba cha juu” ni sahihi na kinaeleweka.
- source_word: μέγα
  choice: kikubwa
  rationale: Huhifadhi moja kwa moja maelezo ya ukubwa wa chumba.
- source_word: ἐστρωμένον
  choice: kilichotandikwa
  rationale: Kitenzi στρώννυμι huhusisha kutandika au kupanga mahali, huenda kwa matandiko au vifaa vya kulia; tafsiri hii haiwekei neno maana finyu ya kuwa na samani pekee.
- source_word: ἕτοιμον
  choice: kuwa tayari
  rationale: Hutoa maana ya hali ya utayari bila kurudia kitenzi “andaa” kilicho mwishoni.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi cha mahali kinachorejelea chumba kilichotajwa.
- source_word: ἑτοιμάσατε
  choice: mtuandalie
  rationale: Amri ya wingi ya kuandaa; umbo hili pia linajumuisha wazi maana ya ἡμῖν, “kwa ajili yetu.”
- source_word: ἡμῖν
  choice: -tu- ... -ie (mtuandalie)
  rationale: Yambwa ya nafsi ya kwanza wingi pamoja na kauli ya kutendea huwasilisha kwa kawaida maana ya “kwa ajili yetu” bila kuongeza utambulisho wa kundi.
