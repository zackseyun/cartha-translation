    text: Au, “chumba kikubwa cha ghorofani, kikiwa kimepangwa na tayari.” Neno ἐστρωμένον linaweza kumaanisha kwamba chumba kilikuwa kimewekwa au kimepangwa tayari, si kwamba kilikuwa na samani tu.
