  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: sw
  text: Wanafunzi wakaondoka, wakaingia mjini, na wakakuta mambo yakiwa kama alivyowaambia. Kisha wakaandaa Pasaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlo wa Pasaka.” Neno la Kigiriki linaweza kumaanisha Pasaka kwa ujumla au, katika muktadha huu, mlo uliokuwa ukiandaliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wakaondoka
  rationale: Kitenzi hiki kinaonyesha kuwa walitoka mahali walipokuwa. ‘Wakaondoka’ ni Kiswahili cha kawaida na cha heshima kinachofaa katika mfuatano wa simulizi.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida katika Injili kwa wafuasi wa Yesu, likihifadhi wazo la watu wanaojifunza kwake na kumfuata.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: wakaingia mjini
  rationale: Kirai cha Kigiriki kinaonyesha kufika ndani ya mji. ‘Wakaingia mjini’ ni cha asili katika Kiswahili na kinaonyesha mwendo wa kuingia Yerusalemu bila kulazimika kurudia kitenzi kisicho cha kawaida.
- source_word: πόλιν
  choice: mjini
  rationale: πόλις humaanisha mji; katika muktadha huu ni Yerusalemu. Umbo ‘mjini’ linafaa baada ya kitenzi ‘wakaingia.’
- source_word: εὗρον
  choice: wakakuta mambo yakiwa
  rationale: Kigiriki hakitaji yambwa wazi; kinachopatikana ni hali na mazingira yaliyokuwa kama Yesu alivyosema. ‘Mambo yakiwa’ hufanya sentensi iwe ya kawaida katika Kiswahili bila kubainisha kupita kiasi kitu kimoja maalumu.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: kama alivyowaambia
  rationale: καθώς huonyesha ulinganifu kamili na maagizo ya Yesu yaliyotangulia. ‘Alivyowaambia’ huonyesha kwa kawaida kwamba alikuwa amesema nao kabla ya matukio haya.
- source_word: ἡτοίμασαν
  choice: wakaandaa
  rationale: ἑτοιμάζω humaanisha kutayarisha au kufanya tayari. ‘Wakaandaa’ ni neno la kawaida na wazi katika muktadha wa maandalizi ya Pasaka.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: πάσχα inaweza kumaanisha sikukuu ya Pasaka kwa ujumla au mlo wake katika muktadha huu. ‘Pasaka’ huhifadhi upana huo wa maana.
theological_decisions:
- issue: Maana ya τὸ πάσχα
  choice: Pasaka
  alternative: mlo wa Pasaka
  rationale: Matini ya Kigiriki inaweza kurejelea Pasaka kwa ujumla au, kwa kuzingatia kitendo cha kuandaa, mlo wa Pasaka. Matini kuu inadumisha utata huo, na tanbihi inaonyesha maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya ‘waka-’ umetumiwa kuwasilisha kwa ufasaha mwendo wa matukio ya simulizi.
