  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: sw
  text: Yesu akajibu, akawaambia, “Je, mmetoka kunikamata kana kwamba mimi ni jambazi[a], mkiwa na panga na marungu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyang’anyi” au “mwasi.” Neno la Kigiriki λῃστής linaweza kumaanisha jambazi mwenye kutumia nguvu au mwasi, si mwizi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Katika simulizi la Kigiriki, muundo huu ni fomula ya kuanzisha usemi. Kiswahili cha kawaida hakihitaji kurudia ‘akajibu na kusema’; ‘akawaambia’ huwasilisha usemi kwa asili bila kuongeza wazo la jibu kwa swali lililotangulia.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: kana kwamba mimi ni mnyang’anyi
  rationale: Muundo huu unaonyesha kwamba walimtendea Yesu kama mtu hatari ambaye angehitaji kikosi chenye silaha. ‘Kana kwamba mimi ni’ ni Kiswahili cha asili kinachohifadhi nguvu ya ulinganisho huo.
- source_word: λῃστὴν
  choice: mnyang’anyi
  rationale: Neno hili linaweza kumaanisha mhalifu mwenye kutumia nguvu, jambazi, au hata mwasi mwenye silaha, si mwizi wa kawaida tu. ‘Mnyang’anyi’ linafaa katika matini kuu, huku upana wa maana ukielezwa katika tanbihi.
- source_word: ἐξήλθατε
  choice: mmekuja
  rationale: Katika swali hili la balagha, kitenzi kinaeleza kuja kwao mahali alipokuwa Yesu; wakati timilifu wa Kiswahili unaonyesha tendo lao la kuja ambalo sasa limefikia kusudi lake.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: mkiwa na panga na marungu
  rationale: μάχαιρα hapa ni silaha yenye makali, kwa kawaida ‘upanga,’ na ξύλα ni vipande vya mbao vinavyotumiwa kama silaha, yaani ‘marungu.’ Muundo wa ‘mkiwa na’ ni wa asili katika Kiswahili.
- source_word: συλλαβεῖν με
  choice: kunikamata
  rationale: Katika muktadha wa kikundi kilichokuja kumtia Yesu chini ya ulinzi, ‘kunikamata’ ni wazi na ya kawaida kuliko tafsiri pana kama ‘kunishika.’
theological_decisions:
- issue: Upana wa maana ya λῃστής katika swali la Yesu
  choice: mnyang’anyi katika matini kuu, pamoja na tanbihi inayotaja ‘jambazi,’ ‘mhalifu,’ au ‘mwasi mwenye silaha’
  alternative: jambazi au mwasi katika matini kuu
  rationale: Aya haimtambulishi Yesu kuwa hivyo, bali inaonyesha namna kundi lilivyokuja dhidi yake. Chaguo hili linahifadhi swali la balagha na halifungi neno la Kigiriki katika maana moja ya kisiasa au ya uhalifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Swali la balagha limehifadhiwa, na istilahi za silaha zimewekwa kwa lugha inayoeleweka kwa wasomaji wa leo.
