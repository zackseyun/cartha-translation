  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: sw
  text: Baadhi ya watu wakaanza kumtemea mate, kumfunika uso[a], kumpiga kwa ngumi, na kumwambia, “Tabiri!” Nao walinzi wakampiga makofi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumfunga macho.” Kigiriki kinasema kihalisi, “kumfunika uso.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinaweza kutafsiriwa kihalisi, “walimpokea kwa mapigo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: Baadhi yao wakaanza
  rationale: Muundo huu unaonyesha kwamba watu fulani wasiotajwa ndio walioanza vitendo hivyo; Kiswahili hiki ni cha kawaida na kinaendeleza simulizi kwa ufasaha.
- source_word: ἐμπτύειν αὐτῷ
  choice: kumtemea mate
  rationale: Hii ndiyo njia ya kawaida na iliyo wazi ya kueleza tendo la kumtemea mtu katika Kiswahili.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: kumfunika uso
  rationale: Tafsiri hii inafuata maneno ya Kigiriki moja kwa moja bila kuamua kimya kimya kwamba kitendo hicho kilikuwa hasa kumfunga macho.
- source_word: κολαφίζειν αὐτόν
  choice: kumpiga ngumi
  rationale: Kitenzi hiki kwa kawaida humaanisha kupiga kwa konde au ngumi; usemi huu ni mfupi, wazi na wa asili katika Kiswahili.
- source_word: Προφήτευσον
  choice: Tabiri!
  rationale: Amri fupi inadumisha dhihaka ya wasemaji bila kuongeza maelezo ambayo hayapo katika matini.
- source_word: οἱ ὑπηρέται
  choice: walinzi
  rationale: Katika mazingira haya ya kukamatwa na kushtakiwa, neno hili linawahusu watendaji wa chini wenye jukumu la ulinzi, si watumishi wa nyumbani.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: wakampiga makofi
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya nahau inayomaanisha kwamba walimshughulikia kwa mapigo; ‘makofi’ yanadumisha aina inayowezekana ya mapigo bila kutumia usemi usio wa kawaida ‘wakampokea kwa mapigo.’
theological_decisions:
- issue: Dhihaka iliyomo katika amri Προφήτευσον kuhusu utambulisho wa Yesu
  choice: Tabiri!
  alternative: Tuambie ni nani aliyekupiga! / Thibitisha kuwa wewe ni nabii!
  rationale: Matini ina amri moja tu. Tafsiri haiongezi shabaha ya unabii wala maelezo ya kitheolojia, hivyo inadumisha kejeli na mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa vitenzi mfululizo unadumisha kasi ya simulizi, huku tanbihi zikihifadhi uwezekano wa tafsiri za karibu zaidi na umbo la Kigiriki.
