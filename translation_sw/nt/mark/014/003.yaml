source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: sw
  text: Yesu alipokuwa ameketi mezani huko Bethania, katika nyumba ya Simoni mwenye ukoma, mwanamke mmoja alikuja akiwa na chupa ya alabasta yenye manukato ya nardo safi[a] yenye thamani kubwa sana. Akaivunja chupa hiyo, akayamimina manukato hayo juu ya kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nardo halisi”; maana ya kivumishi cha Kigiriki πιστικῆς inajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Yesu alipokuwa ... ameketi mezani
  rationale: Muundo wa genitivi huru unaweka mazingira ya tukio linaloendelea. Kutaja Yesu kwa jina kunaleta uwazi wa kawaida katika Kiswahili, na “ameketi mezani” huwasilisha mkao wa kula wa κατακειμένου kwa lugha ya asili bila taswira isiyo sahihi ya kuketi kwenye kiti.
- source_word: Βηθανίᾳ
  choice: Bethania
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika matumizi ya Biblia ya Kiswahili.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: nyumba ya Simoni mwenye ukoma
  rationale: Huhifadhi utambulisho uliotolewa na Kigiriki bila kuongeza kwamba alikuwa amepona au alikuwa mwenye ukoma zamani.
- source_word: γυνὴ
  choice: mwanamke mmoja
  rationale: Mhusika hajatajwa jina katika muktadha huu; “mmoja” huonyesha hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἀλάβαστρον
  choice: chupa ya alabasta
  rationale: Neno linaashiria chombo cha kuhifadhia manukato. “Chupa ya alabasta” ni wazi na huhifadhi aina ya chombo; katika kutajwa kwa pili “chupa hiyo” huleta mshikamano.
- source_word: μύρου
  choice: manukato
  rationale: μύρον ni mafuta au marhamu yenye harufu nzuri; “manukato” ni neno la kawaida linalowasilisha matumizi yake bila kulazimisha hali mahususi ya kimiminika.
- source_word: νάρδου
  choice: nardo
  rationale: Huhifadhi jina maalumu la kiungo cha kunukia badala ya kulifanya kuwa manukato ya jumla.
- source_word: πιστικῆς
  choice: safi
  rationale: Maana ya πιστικός inajadiliwa. “Safi” ni tafsiri inayokubalika katika muktadha wa nardo halisi isiyochanganywa, huku uwezekano wa “halisi” ukihifadhiwa katika tanbihi.
- source_word: πολυτελοῦς
  choice: ya bei ghali sana
  rationale: Huwasilisha kwa Kiswahili cha sasa thamani kubwa ya manukato, ambayo inaandaa mwitikio unaofuata katika simulizi.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Akaivunja chupa hiyo
  rationale: Kishirikishi kinaonyesha kitendo kilichotangulia kumimina. Muundo wa vitenzi vinavyofuatana ni wa asili katika simulizi la Kiswahili.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: kummiminia Yesu manukato hayo kichwani
  rationale: Huwasilisha tendo la kumimina juu ya kichwa kwa uwazi; kurudia jina la Yesu na kitu kilichomiminwa huepusha utata wa viwakilishi katika Kiswahili.
theological_decisions:
- issue: Iwapo maelezo “Simoni mwenye ukoma” yapunguzwe ili yasidokeze ugonjwa uliokuwa hai au hali ya unajisi
  choice: Kuhifadhi “Simoni mwenye ukoma” katika matini kuu
  alternative: Simoni aliyekuwa na ukoma zamani
  rationale: Kigiriki kinamtambulisha hivyo bila kusema alikuwa amepona. Kuongeza “zamani” kungeingiza hitimisho lisilotajwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeundwa kama simulizi la asili la Kiswahili, huku majina na mambo mahususi ya chanzo yakihifadhiwa.
