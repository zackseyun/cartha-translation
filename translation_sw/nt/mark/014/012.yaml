  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: sw
  text: Na siku ya kwanza ya Mikate Isiyotiwa Chachu, wakati walipokuwa wakimchinja mwana-kondoo wa Pasaka,[a] wanafunzi wake wakamwuliza, “Unataka twende wapi tukakuandalie Pasaka ili ule?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati walipokuwa wakichinja Pasaka.” Kigiriki kinasema “Pasaka,” ambalo katika muktadha huu huenda linamaanisha mwana-kondoo wa Pasaka anayechinjwa kuwa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: Siku ya kwanza ya Mikate Isiyotiwa Chachu
  rationale: Muundo huu unataja siku kwa namna ya kawaida katika Kiswahili na kuhifadhi jina la kipindi cha sikukuu bila kuongeza neno lisilokuwapo wazi katika Kigiriki.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: wakati walipokuwa wakimchinja mwana-kondoo wa Pasaka
  rationale: Kitenzi cha hali ya wakati uliopita ἔθυον kinaonyesha tendo lililokuwa likifanyika au desturi ya wakati huo. Pamoja na θύω, πάσχα hapa inaelekea kumaanisha mnyama wa dhabihu, yaani mwana-kondoo wa Pasaka.
- source_word: λέγουσιν
  choice: wakamwuliza
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita. Kwa kuwa maneno yanayofuata ni swali, “wakamwuliza” ni ya asili kuliko “wakamwambia.”
- source_word: Ποῦ θέλεις
  choice: Unataka ... wapi
  rationale: θέλω hapa huonyesha nia au takwa; “unataka” ni Kiswahili cha sasa, cha kawaida na chenye heshima.
- source_word: ἀπελθόντες
  choice: twende
  rationale: 'Kirai kishirikishi kinaunganishwa kwa kawaida na kitenzi kikuu katika Kiswahili: “twende tukakuandalie,” huku mfuatano wa kwenda kisha kuandaa ukihifadhiwa.'
- source_word: ἑτοιμάσωμεν
  choice: tukakuandalie
  rationale: Hii huonyesha kuwa wanafunzi watafanya maandalizi kwa ajili ya Yesu na inaendana kiasili na swali la mahali.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: ili ule Pasaka
  rationale: “Ili” huonyesha kusudi la ἵνα. Katika muktadha wa kula, πάσχα hurejelea mlo wa Pasaka kwa upana, si tendo la kuchinja pekee.
theological_decisions:
- issue: Maana ya πάσχα katika sehemu mbili za mstari
  choice: Katika kifungu cha kuchinja imetafsiriwa “mwana-kondoo wa Pasaka”; katika kifungu cha kula imetafsiriwa “Pasaka.”
  alternative: Kutafsiri sehemu zote mbili kwa neno “Pasaka” pekee.
  rationale: 'Vitenzi vinavyoandamana na neno hilo vinaelekeza maana yake katika kila sehemu: θύω kwa mnyama wa dhabihu, na ἐσθίω kwa mlo wa Pasaka. Tanbihi inahifadhi usemi halisi na upana wa Kigiriki katika sehemu ya kwanza.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mikate Isiyotiwa Chachu” limetumiwa kama jina la kipindi cha sikukuu. Muundo “twende tukakuandalie” ni wa kawaida na huweka wazi mlolongo wa vitendo bila kuwa mgumu.
