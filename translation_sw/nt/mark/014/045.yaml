base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: sw
  text: Alipofika, mara moja akamwendea Yesu na kumwambia, “Rabi!” Kisha akambusu kwa msisitizo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akambusu mara nyingi.” Kitenzi cha Kigiriki kina nguvu zaidi kuliko kusema tu “akambusu” na kinaweza kuonyesha busu lenye msisitizo au lililorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Alipofika
  rationale: Kirai cha kitenzi cha wakati uliopita kimetafsiriwa kwa muundo wa wakati unaoonyesha kwamba kufika kulitangulia kumwendea Yesu.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Huhifadhi mwendo wa haraka wa simulizi la Marko kwa Kiswahili cha kawaida.
- source_word: προσελθὼν αὐτῷ
  choice: akamwendea Yesu
  rationale: Huonyesha mwendo wa Yuda kuelekea kwa Yesu; jina limetumiwa badala ya kiwakilishi ili rejeleo liwe wazi katika aya inayosimama peke yake.
- source_word: λέγει
  choice: kumwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetolewa kwa wakati uliopita unaofaa simulizi la Kiswahili.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina la cheo la Kisemiti limehifadhiwa kwa umbo linalotumika katika Kiswahili, badala ya kulifafanua moja kwa moja kuwa “Mwalimu.”
- source_word: κατεφίλησεν
  choice: akambusu kwa uchangamfu
  rationale: Kitenzi hiki kina nguvu zaidi kuliko φιλέω rahisi na kinaweza kuonyesha busu la kusisitiza au la waziwazi; tafsiri hii haiamui kwa lazima kwamba busu lilirudiwa.
theological_decisions:
- issue: Namna Yuda anavyomwita Yesu kwa neno Ῥαββί
  choice: Rabi
  alternative: Mwalimu
  rationale: Kuhifadhi cheo kilichotamkwa katika tukio hudumisha mazingira ya kihistoria na kejeli iliyomo bila kuingiza tafsiri ya kimadhehebu.
- issue: Nguvu ya kitenzi κατεφίλησεν
  choice: akambusu kwa uchangamfu
  alternative: akambusu mara nyingi
  rationale: Kigiriki kinaweza kuonyesha busu lenye msisitizo au busu lililorudiwa. Maandishi makuu yanaonyesha nguvu ya tendo bila kufunga maana kwa marudio, na tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kisimulizi na inaeleweka kwa wasomaji wa kawaida; “Rabi” huhifadhi mazingira ya kihistoria.
