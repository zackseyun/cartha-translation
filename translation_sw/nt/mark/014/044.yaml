base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: sw
  text: Yule aliyekuwa akimsaliti alikuwa amewapa ishara[a], akisema, “Yule nitakayembusu[b] ndiye huyo. Mkamateni, mwampeleke salama.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama”; neno la Kigiriki linamaanisha ishara ya kumtambua mtu iliyokuwa imekubaliwa mapema.
    reason: lexical_alternative
  - marker: b
    text: Busu lilikuwa salamu ya kawaida; hapa Yuda alilitumia kama ishara ya kumtambulisha Yesu.
    reason: cultural_note
  - marker: c
    text: Au “mwampeleke kwa ulinzi.” Katika muktadha huu huenda maana ni kuhakikisha kwamba anaendelea kuwa chini ya udhibiti mkali.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: alikuwa amewapa
  rationale: Wakati timilifu uliopita unaonyesha kwamba msaliti alikuwa tayari amepanga na kuwapa ishara hiyo kabla ya tukio la kukamatwa.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: yule aliyekuwa akimsaliti
  rationale: Kirai cha kishirikishi kinahifadhi tendo linaloendelea katika simulizi; ‘kumsaliti’ linafaa katika muktadha huu, ingawa kimsingi kitenzi kinaweza kumaanisha kumkabidhi mtu.
- source_word: σύσσημον
  choice: ishara
  rationale: Neno hili linamaanisha ishara ya utambulisho iliyokubaliwa mapema; katika Kiswahili ‘ishara’ ni la kawaida na linaeleweka vizuri, huku tanbihi ikifafanua kuwa ilikuwa imepangwa.
- source_word: λέγων
  choice: akisema
  rationale: Muundo huu unaendeleza kwa kawaida tendo la kutoa ishara hadi kwenye maneno yaliyofafanua ishara hiyo.
- source_word: Ὃν ἂν φιλήσω
  choice: Yule nitakayembusu
  rationale: Muundo wa uhusiano usioainishwa unaonyesha mtu yeyote ambaye Yuda angembusu, bila kuongeza neno lisilokuwapo kama ‘mwanaume’.
- source_word: αὐτός ἐστιν
  choice: ndiye huyo
  rationale: Kauli hii inahifadhi mkazo wa kumtambulisha mtu husika na ni ya asili katika Kiswahili.
- source_word: κρατήσατε
  choice: Mkamateni
  rationale: Katika muktadha wa kukamatwa, neno hili linaonyesha kumshika kwa nguvu; ‘mkamateni’ ni la kawaida bila kuhitaji lugha ya kisheria zaidi.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: mkampeleke akiwa chini ya ulinzi mkali
  rationale: Katika muktadha huu kielezi kinaelekea kumaanisha kumpeleka huku wakihakikisha amedhibitiwa na hawezi kutoroka, si hasa kulinda usalama wake.
