  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: sw
  text: Naye Yesu anamwambia, “Kweli ninakuambia, leo, usiku huu huu, kabla jogoo hajawika mara mbili, utanikana mara tatu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati uliopo umehifadhiwa ili kuonyesha wakati uliopo wa kihistoria unaotumiwa na Marko, huku kiambishi cha yambwa kikionyesha ‘anamwambia yeye.’
- source_word: Ἀμὴν λέγω σοι
  choice: Kweli ninakuambia
  rationale: Hiki ni kiingizio cha tamko zito na la hakika; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili cha sasa.
- source_word: σήμερον ταύτῃ τῇ νυκτί
  choice: leo, usiku huu huu
  rationale: Maneno yote mawili ya wakati yamehifadhiwa, na ‘huu huu’ linaonyesha msisitizo wa kiashiria cha Kigiriki.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: jogoo hajawika mara mbili
  rationale: ‘Jogoo kuwika’ ni usemi wa kawaida wa Kiswahili, na ‘mara mbili’ huhifadhi idadi iliyo wazi katika Marko.
- source_word: τρίς με ἀπαρνήσῃ
  choice: utanikana mara tatu
  rationale: ‘Kunikana’ huhifadhi maana ya kumkana au kujitenga na Yesu bila kuibana kuwa kukataa tu kwamba anamjua.
theological_decisions:
- issue: Muungano wa σήμερον na ταύτῃ τῇ νυκτί
  choice: 'Maneno yote mawili yametafsiriwa: ‘leo, usiku huu huu’'
  alternative: Kuyafupisha kuwa ‘usiku huu huu’ pekee
  rationale: Chanzo kina misemo yote miwili kwa msisitizo wa ukaribu wa tukio; kuiacha yote huepuka kuondoa kipengele cha maandishi.
- issue: Wakati uliopo wa kihistoria katika λέγει
  choice: ‘anamwambia’
  alternative: ‘akamwambia’ au ‘alimwambia’
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa ili mtindo hai wa simulizi la Marko uonekane.
- issue: Maana ya με ἀπαρνήσῃ
  choice: ‘utanikana’
  alternative: ‘utakataa kwamba unanijua’
  rationale: ‘Utanikana’ ni pana vya kutosha kuhifadhi uzito wa kumkataa au kujitenga naye, bila kuongeza wazi wazo la ‘kunijua’ ambalo halimo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na rahisi kueleweka. ‘Usiku huu huu’ hutumiwa kwa msisitizo wa asili bila kuwa ya kizamani.
