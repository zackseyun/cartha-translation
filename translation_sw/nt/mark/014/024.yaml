id: MRK.14.24
reference: Mark 14:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: sw
  text: Akawaambia, “Hii ni damu yangu ya agano[a], inayomwagwa kwa ajili ya wengi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na vifungu sambamba vinasema, “damu yangu ya agano jipya.” Maandishi ya Kigiriki ya Marko hapa yanaeleweka vizuri zaidi kuwa, “damu yangu ya agano.”
    reason: textual_variant
  - marker: b
    text: Au, “inayomwagwa kwa niaba ya wengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Hii ni
  rationale: Muundo wa moja kwa moja wa kitenzi kishirikishi unafuata Kigiriki bila kuongeza tafsiri ya maana kama vile ‘hii inamaanisha’ au ‘hii inawakilisha.’
- source_word: τὸ αἷμά μου
  choice: damu yangu
  rationale: Huhifadhi lugha ya wazi ya damu na taswira yake ya dhabihu na agano badala ya kuifafanua kuwa ‘kifo changu.’
- source_word: τῆς διαθήκης
  choice: ya agano
  rationale: Katika muktadha huu διαθήκη ni agano, hasa kwa mwangwi wa Kutoka 24:8; maandishi haya hayana neno ‘jipya.’
- source_word: ἐκχυννόμενον
  choice: inayomwagwa
  rationale: Kishirikishi cha wakati wa sasa na kauli tendwa kinachorejelea damu kinatolewa kwa kishazi cha uhusiano cha kawaida katika Kiswahili, huku taswira ya kumwaga damu ikihifadhiwa.
- source_word: ὑπὲρ πολλῶν
  choice: kwa ajili ya wengi
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kutendewa kwa manufaa au kwa niaba ya wengi bila kufafanua kupita kiasi teolojia ya upatanisho.
theological_decisions:
- issue: Kutafsiri διαθήκη kwa maana ya agano au wasia
  choice: agano
  alternative: wasia
  rationale: Muktadha wa Mlo wa Mwisho na lugha ya damu unaelekeza wazi kwenye agano, kwa mwangwi wa kuanzishwa kwa agano katika Kutoka 24:8.
- issue: Kuongeza ‘jipya’ kabla ya ‘agano’ kutokana na mapokeo sambamba
  choice: ya agano
  alternative: ya agano jipya
  rationale: SBLGNT ya Marko 14:24 haina καινῆς (‘jipya’), hivyo tafsiri haipaswi kupatanisha kifungu hiki na vifungu sambamba kwa kuongeza neno lisilokuwapo; tofauti hiyo inaelezwa katika tanbihi.
- issue: Maana ya ὑπὲρ πολλῶν kuhusu upeo wa upatanisho
  choice: kwa ajili ya wengi
  alternative: kwa ajili ya wote; kwa niaba ya wengi
  rationale: Huhifadhi neno ‘wengi’ katika chanzo na kutatua kwa siri mjadala mpana wa kiteolojia; ‘kwa ajili ya’ pia huacha upana halisi wa ὑπέρ bila kuufinyanga kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ ni simulizi la kawaida la Kibiblia bila kuwa la kizamani; ‘Hii ni’ hudumisha usemi wa moja kwa moja. Tanbihi zimepangwa kulingana na mahali alama zinapotokea katika maandishi.
