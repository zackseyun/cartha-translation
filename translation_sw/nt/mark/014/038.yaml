  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: sw
  text: Kesheni na salini, ili msiingie katika jaribu[a]. Roho iko tayari, lakini mwili ni dhaifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno linalotafsiriwa “jaribu” linaweza pia kumaanisha “kishawishi,” “mtihani,” au “kipindi cha kujaribiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Endeleeni kukesha
  rationale: Amri ya wingi ina maana ya kuendelea kuwa macho au kukesha; katika mazingira ya Gethsemane, “endelea kukesha” ni ya asili na huhifadhi maana halisi pamoja na wazo la kuwa makini.
- source_word: προσεύχεσθε
  choice: kusali
  rationale: Kitenzi hiki ni amri ya wingi yenye hali endelevu; “kusali” baada ya “endelea” huwasilisha himizo la kuendelea kusali kwa Kiswahili cha kawaida.
- source_word: ἵνα μὴ ἔλθητε
  choice: ili msiingie
  rationale: Muundo wa ἵνα pamoja na μή na hali tegemezi unaonyesha kusudi la kuzuia jambo; “ili msiingie” ni wazi na wa kawaida.
- source_word: εἰς πειρασμόν
  choice: katika majaribu
  rationale: πειρασμός inaweza kumaanisha kishawishi, kujaribiwa, au kipindi cha mtihani. “Majaribu” huhifadhi upana huo kwa kiasi kikubwa katika Kiswahili, huku tanbihi ikifafanua uwezekano wa maana.
- source_word: τὸ μὲν πνεῦμα
  choice: Kwa kweli roho
  rationale: “Roho” bila herufi kubwa inaelekea kumaanisha roho ya mwanadamu au nia ya ndani katika utofautishaji huu na mwili. “Kwa kweli” huakisi μέν kwa lugha ya asili.
- source_word: πρόθυμον
  choice: iko tayari
  rationale: πρόθυμος huonyesha utayari, hiari, au shauku; “iko tayari” huhifadhi utayari wa ndani wa wanafunzi bila kuongeza maana.
- source_word: ἡ δὲ σὰρξ
  choice: lakini mwili
  rationale: Ingawa σάρξ kwa karibu ni “nyama,” katika Kiswahili “mwili” huwasilisha udhaifu wa kibinadamu kwa kawaida zaidi na huepuka maana ya chakula. Haitafsiriwi kama “asili ya dhambi,” kwa kuwa hilo lingefanya maana kuwa finyu kupita kiasi.
- source_word: ἀσθενής
  choice: ni dhaifu
  rationale: “Dhaifu” huonyesha moja kwa moja unyonge au kutokuwa na nguvu kunakolinganishwa na utayari wa roho.
theological_decisions:
- issue: Rejeo la πνεῦμα
  choice: roho ya mwanadamu / utayari wa ndani
  alternative: Roho Mtakatifu
  rationale: Muktadha wa Yesu kuwaambia wanafunzi waliokuwa wakisinzia, pamoja na utofautishaji na mwili, unaelekeza zaidi kwenye nia ya ndani ya mwanadamu. Kutotumia “Roho” kwa herufi kubwa huepuka kuamua kwamba ni Roho Mtakatifu.
- issue: Tafsiri ya σάρξ
  choice: mwili
  alternative: nyama; asili ya dhambi
  rationale: Hapa mkazo ni udhaifu wa kibinadamu, si lazima fundisho maalumu kuhusu asili ya dhambi. “Mwili” ni Kiswahili cha kawaida katika utofautishaji huu na huhifadhi mvutano kati ya utayari wa ndani na unyonge wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wingi wa amri umehifadhiwa katika “Endeleeni,” na lugha ya kimadhehebu imeepukwa.
