  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: sw
  text: Lakini Petro akamwambia, “Hata kama wote wataanguka[a], mimi sitaanguka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watajikwaa” au “watakwazwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kujikwaa, kukwazika, au kuanguka na kuacha uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha wazi upinzani kati ya kauli ya Petro na utabiri wa Yesu uliotangulia.
- source_word: ἔφη αὐτῷ
  choice: akamwambia
  rationale: Ni Kiswahili cha kawaida na cha asili kwa maana ya ‘alimwambia’; kiwakilishi cha mtendewa kinadumisha rejeo la Kigiriki kwa Yesu bila kuingiza jina lake.
- source_word: Εἰ καὶ
  choice: Hata kama
  rationale: Inawasilisha hali ya masharti yenye maana ya kukubali uwezekano uliokithiri.
- source_word: πάντες
  choice: wote
  rationale: Inahifadhi upeo mpana wa neno la Kigiriki, likirejelea kundi lote la wanafunzi katika muktadha.
- source_word: σκανδαλισθήσονται
  choice: wataanguka
  rationale: Katika muktadha huu ‘kuanguka’ huwasilisha kushindwa kwa uaminifu na kumwacha Yesu, huku ikiendeleza sitiari na kutoamua kimya kimya kama ni kujikwaa kwa muda au kuasi kabisa.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: mimi sitaanguka
  rationale: Kitenzi kinachodokezwa katika Kigiriki kimerudiwa kwa uwazi wa Kiswahili, na ‘mimi’ inadumisha msisitizo wa Petro kujitofautisha na wengine.
theological_decisions:
- issue: Maana ya σκανδαλισθήσονται katika muktadha wa kushindwa kwa wanafunzi
  choice: wataanguka
  alternative: watajikwaa; watakwazwa; watakengeuka
  rationale: ‘Wataanguka’ inaonyesha uzito wa kushindwa na kumwacha Yesu bila kuifanya kauli hiyo kuwa hukumu ya mwisho kuhusu hali yao ya kiroho. Tanbihi inadumisha upana wa maana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo ‘akamwambia’ ni wa kawaida katika usimulizi, na kurudiwa kwa ‘sitaanguka’ kunafanya kishazi kilichoachwa bila kitenzi katika Kigiriki kieleweke kwa urahisi.
