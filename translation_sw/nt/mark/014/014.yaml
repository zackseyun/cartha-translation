  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: sw
  text: Na popote atakapoingia, mwambieni mwenye nyumba, ‘Mwalimu anasema, “Kiko wapi chumba changu cha wageni[a] ambamo nitakula Pasaka pamoja na wanafunzi wangu?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pangu pa kukaa” au “chumba changu.” Neno la Kigiriki linamaanisha mahali pa kukaa; hapa huenda ni chumba cha wageni katika nyumba binafsi, si nyumba ya wageni ya kibiashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: popote atakapoingia
  rationale: Muundo huu unaonyesha mahali pasipotajwa kwa uhakika; ‘popote atakapoingia’ ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: εἴπατε
  choice: mwambieni
  rationale: Ni amri kwa wingi inayowaelekeza wale wanafunzi wawili wamwambie mwenye nyumba maneno yanayofuata.
- source_word: οἰκοδεσπότῃ
  choice: mwenye nyumba
  rationale: Hutaja mtu mwenye mamlaka juu ya nyumba au kaya; ‘mwenye nyumba’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: Ὁ διδάσκαλος
  choice: Mwalimu
  rationale: Neno hili linatumika kama jina la cheo linalotambulika kwa Yesu bila kuongeza maana yenye nguvu zaidi kuliko ile ya Kigiriki.
- source_word: κατάλυμά μου
  choice: chumba changu cha wageni
  rationale: Katika muktadha huu κατάλυμα ni mahali pa kukaa, yaelekea chumba cha wageni katika nyumba binafsi, si nyumba ya wageni ya kibiashara. Kiwakilishi ‘changu’ kinahifadhi μου.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: Neno linaweza kumaanisha sikukuu au mlo wa Pasaka; kitenzi ‘nitakula’ kinaonyesha wazi kuwa hapa unahusika mlo wa Pasaka.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pamoja na wanafunzi wangu
  rationale: ‘Wanafunzi’ ni neno la kawaida la Injili kwa wale wanaomfuata na kujifunza kwa Yesu, huku ‘wangu’ ikihifadhi umilikaji.
- source_word: φάγω
  choice: nitakula
  rationale: Ingawa Kigiriki kina hali tegemezi katika kishazi cha mahali kinachokusudiwa, Kiswahili cha kawaida hutumia wakati ujao hapa bila kuondoa wazo la tendo linalokusudiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la cheo διδάσκαλος ambalo Yesu anatumia kujitaja
  choice: Mwalimu
  alternative: Bwana
  rationale: ‘Mwalimu’ huhifadhi maana ya kawaida ya neno la Kigiriki na matumizi yake kama jina la cheo katika simulizi, bila kuingiza cheo tofauti chenye maana pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi wa moja kwa moja umehifadhiwa, na kishazi ‘ambamo nitakula’ kinafungamana moja kwa moja na ‘chumba changu cha wageni’ bila koma isiyohitajika.
