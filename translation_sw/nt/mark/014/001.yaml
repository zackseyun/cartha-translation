  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: sw
  text: Sikukuu ya Pasaka na Sikukuu ya Mikate Isiyotiwa Chachu zilikuwa zimebaki siku mbili[a]. Makuhani wakuu na waandishi wa Sheria walikuwa wakitafuta njia ya kumkamata Yesu kwa hila[b] na kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “baada ya siku mbili.” Maneno hayo yanaonyesha kwamba Pasaka na Sikukuu ya Mikate Isiyotiwa Chachu zilikuwa karibu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kutafsiriwa “kwa udanganyifu” au “kwa ujanja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: zilikuwa zimebaki
  rationale: Muundo huu unaonyesha hali ya wakati katika simulizi; kiunganishi δέ hakihitaji kutafsiriwa kwa neno la mwanzo lisilo la lazima katika Kiswahili.
- source_word: τὸ πάσχα
  choice: Sikukuu ya Pasaka
  rationale: Katika muktadha huu neno linataja sikukuu ya Kiyahudi, si mwana-kondoo wa Pasaka.
- source_word: τὰ ἄζυμα
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Kwa maana halisi ni ‘visivyotiwa chachu,’ lakini matumizi haya ya kawaida yanataja sikukuu; upanuzi huu huifanya maana iwe wazi kwa msomaji.
- source_word: μετὰ δύο ἡμέρας
  choice: zilikuwa zimebaki siku mbili
  rationale: Huwasilisha kwa Kiswahili cha kawaida kwamba sikukuu hizo zilikuwa karibu, huku tanbihi ikihifadhi muundo wa moja kwa moja zaidi.
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Huhifadhi hali endelevu ya kitenzi cha wakati usiotimilifu.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Ni istilahi ya kawaida kwa viongozi wa ukuhani wanaotajwa kwa wingi.
- source_word: οἱ γραμματεῖς
  choice: waandishi wa Sheria
  rationale: Hutambulisha kwa uwazi kundi la wataalamu wa Maandiko na sheria ya Kiyahudi, badala ya kudokeza waandishi wa kawaida.
- source_word: πῶς
  choice: njia ya
  rationale: Ni Kiswahili cha asili kinachoeleza namna walivyopanga kutekeleza tendo hilo.
- source_word: ἐν δόλῳ
  choice: kwa hila
  rationale: Huhifadhi maana ya udanganyifu au ujanja wenye nia mbaya bila kuibana kuwa usiri pekee.
- source_word: κρατήσαντες
  choice: kumkamata
  rationale: Katika muktadha wa viongozi wanaopanga dhidi ya Yesu, kitenzi kina maana ya kumtia mikononi au chini ya ulinzi kwa nguvu.
- source_word: ἀποκτείνωσιν
  choice: kumuua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuua.
theological_decisions:
- issue: Uhusiano kati ya Pasaka na Mikate Isiyotiwa Chachu
  choice: Majina yote mawili yametajwa tofauti kama sikukuu zinazohusiana kwa karibu.
  alternative: Kuyachanganya kuwa jina moja la sikukuu.
  rationale: Kigiriki kinataja πάσχα na ἄζυμα kwa viungo tofauti; tafsiri inahifadhi utofauti huo bila kukataa uhusiano wao wa karibu.
- issue: Tabia ya mpango wa viongozi
  choice: ἐν δόλῳ imetafsiriwa ‘kwa hila.’
  alternative: ‘kwa siri’ au ‘kwa kuvizia.’
  rationale: Neno la Kigiriki linaonyesha udanganyifu na ujanja, si usiri tu.
- issue: Mhusika anayelengwa na kiwakilishi αὐτόν
  choice: Jina ‘Yesu’ limetumiwa kwa uwazi.
  alternative: Kutumia ‘yeye’ au ‘kumkamata.’
  rationale: Kiswahili kingeweza kuacha kiwakilishi kisieleweke bila muktadha wa mstari uliotangulia; kutaja Yesu hufafanua rejeo bila kubadili mhusika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Waandishi wa Sheria’ huzuia maana potovu ya waandishi wa kawaida. Majina ya sikukuu yamefafanuliwa kwa namna ya kawaida katika Kiswahili.
