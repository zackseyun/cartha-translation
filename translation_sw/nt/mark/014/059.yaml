translation:
  language: sw
  text: Na hata kwa namna hiyo, ushahidi wao haukupatana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushahidi wao haukuwa unalingana”; kwa maana halisi zaidi, “haukuwa sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: Hata hivyo
  rationale: Katika muktadha huu, muungano huu unaendeleza simulizi huku ukisisitiza kwamba hata baada ya shtaka hilo mahususi, ushahidi bado haukulingana. Kiswahili cha asili kinahitaji kuunganisha wazo hili kwa mtiririko kuliko kutafsiri kila kiunganishi kivyake.
- source_word: οὕτως
  choice: hivyo
  rationale: Hurejelea namna ya ushahidi uliotolewa katika mstari uliotangulia; “hivyo” ni ya kawaida na huhifadhi rejeo hilo.
- source_word: ἴση ἦν
  choice: hau kupatana
  rationale: Ingawa ἴση maana yake ya msingi ni “sawa,” katika muktadha wa ushahidi wa mashahidi maana ni kwamba maelezo yao hayakulingana. “Haukupatana” huwasilisha maana hiyo ya kimahakama kwa Kiswahili cha kawaida.
- source_word: ἡ μαρτυρία αὐτῶν
  choice: ushahidi wao
  rationale: μαρτυρία hapa ni ushahidi unaotolewa na mashahidi katika kesi; umoja wa Kigiriki na kiwakilishi cha umilikaji vimehifadhiwa kiasili kama “ushahidi wao.”
