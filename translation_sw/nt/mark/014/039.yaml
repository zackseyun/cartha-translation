lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinaonyesha kurudiwa kwa tendo; “tena” ni tafsiri fupi na ya kawaida inayodumisha mfuatano wa simulizi.
- source_word: ἀπελθὼν
  choice: akaenda
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aliondoka mahali alipokuwa kabla ya kuomba. “Akaenda” ni cha asili katika muktadha huu bila kuongeza mwelekeo ambao Kigiriki hakijautaja wazi.
- source_word: προσηύξατο
  choice: akaomba
  rationale: “Kuomba” ni neno la kawaida la Kiswahili kwa kumwelekea Mungu katika sala; wakati timilifu wa Kigiriki unaendelezwa kwa umbo la kisimulizi “aka-”.
- source_word: τὸν αὐτὸν λόγον
  choice: maneno yaleyale
  rationale: Hapa λόγος inarejelea yaliyomo katika sala iliyorudiwa, si neno moja pekee. Wingi “maneno yaleyale” ni wa asili katika Kiswahili, huku tanbihi ikihifadhi umbo la umoja na upana wa maana wa Kigiriki.
- source_word: εἰπών
  choice: huku akisema
  rationale: Kirai hiki kinaeleza yaliyotokea wakati wa kuomba. “Huku akisema” huunganisha usemi na sala kwa Kiswahili cha kawaida bila kuufanya kuwa tendo tofauti.
