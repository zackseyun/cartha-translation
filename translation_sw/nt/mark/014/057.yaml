lexical_decisions:
- source_word: καί
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza masimulizi kwa mtiririko wa kawaida; hapa “Kisha” ni cha asili katika Kiswahili na kinaonyesha hatua inayofuata bila kuongeza maana isiyokuwamo.
- source_word: τινες
  choice: baadhi ya watu
  rationale: Huhifadhi hali ya kutotaja watu hao hasa na ni usemi wa kawaida, ulio wazi katika Kiswahili.
- source_word: ἀναστάντες
  choice: wakasimama
  rationale: Kitenzi hiki kinaonyesha waliinuka au kusimama ili kutoa ushahidi katika mazingira ya kesi; “wakasimama” ni cha asili na kinafaa muktadha.
- source_word: ἐψευδομαρτύρουν
  choice: na kutoa ushahidi wa uongo
  rationale: Huwasilisha wazi maana ya kutoa ushahidi usio wa kweli katika mazingira ya kisheria. Muundo unaendelea sambamba na kitendo cha kusimama; katika Kiswahili, mwendelezo wa tendo hautajiwi kwa lazima kwa kitenzi cha ‘walikuwa’ hapa.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: κατά pamoja na umilikishi ina nguvu ya kupinga katika muktadha huu wa mashtaka; “dhidi yake” huihifadhi.
- source_word: λέγοντες
  choice: wakisema,
  rationale: Huanzisha yaliyomo katika ushahidi unaofuata na kudumisha uhusiano wa kisarufi na wale waliotoa ushahidi.
