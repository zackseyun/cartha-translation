  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: sw
  text: Lakini, baada ya mimi kufufuliwa[a], nitawatangulia kwenda Galilaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuwa nimefufuliwa.” Kigiriki kinatumia kitenzi cha hali ya kutendwa cha “kufufua,” ambacho hutumiwa mara nyingi kuzungumzia ufufuo kutoka kwa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji na utabiri uliotangulia kuhusu wanafunzi kutawanyika; “Lakini” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: baada ya kufufuliwa
  rationale: Muundo wa μετά pamoja na kitenzi-jina chenye kibainishi unaonyesha wakati unaofuata, yaani “baada ya.” Tafsiri hii inadumisha hali ya kutendwa ya kitenzi cha Kigiriki na maana yake ya ufufuo.
- source_word: ἐγερθῆναί
  choice: kufufuliwa
  rationale: Hiki ni kitenzi cha kutendwa; “kufufuliwa” ni lugha ya kawaida ya Kiswahili kuhusu kurudishwa kutoka kwa wafu na haibadili hali ya kutendwa kuwa “kufufuka.”
- source_word: προάξω
  choice: nitawatangulia kwenda
  rationale: Kitenzi hiki kinaonyesha kwenda mbele ya wengine kuelekea mahali fulani. “Nitawatangulia kwenda” ni cha asili katika Kiswahili na kinahifadhi mwelekeo wa tendo.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi hiki cha yambwa kinaonyesha wazi kuwa Yesu anazungumza na watu wengi.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: kwenda Galilaya
  rationale: εἰς huonyesha mwendo kuelekea au kuingia mahali; katika Kiswahili, “kwenda Galilaya” ni usemi wa kawaida unaowasilisha mwelekeo huo bila uzito usio wa lazima.
theological_decisions:
- issue: Namna ya kueleza ufufuo katika ἐγερθῆναί με
  choice: baada ya kufufuliwa
  alternative: baada ya kufufuka
  rationale: Tafsiri iliyochaguliwa inadumisha hali ya kutendwa iliyo katika Kigiriki na madai ya ufufuo, bila kuibadili kimyakimya kuwa kauli ya kutenda au kujitendea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida kwa wasomaji wengi; “kufufuliwa” inadumisha umbo la Kigiriki, na “nitawatangulia kwenda” inaeleza wazi wingi wa walengwa na mwendo kuelekea Galilaya.
