  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: sw
  text: Na kijana mmoja alikuwa akimfuata, akiwa amevaa kitambaa cha kitani juu ya mwili wake uchi[a]; nao wanamkamata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shuka ya kitani.” Neno la Kigiriki σινδών linaweza kumaanisha kitambaa cha kitani au shuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: kijana mmoja
  rationale: νεανίσκος humaanisha kijana wa kiume, na τις humtambulisha bila kumtaja; Kiswahili cha kawaida hutumia ‘mmoja’ kwa nguvu hii ya kutomtaja.
- source_word: συνηκολούθει αὐτῷ
  choice: alikuwa akimfuata
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililokuwa likiendelea, na kiwakilishi kinamrejelea Yesu katika muktadha.
- source_word: περιβεβλημένος σινδόνα
  choice: akiwa amejifunika kitambaa cha kitani
  rationale: Kitenzi kinaweza kueleza kuvaa au kujifunika, huku σινδών ikiwa kitambaa au shuka ya kitani; ‘amejifunika’ inaeleza kwa asili namna kitambaa hicho kilivyokuwa mwilini bila kukifanya vazi maalumu.
- source_word: ἐπὶ γυμνοῦ
  choice: juu ya mwili wake uchi
  rationale: Kirai kinaonyesha kuwa kitambaa kilikuwa moja kwa moja juu ya mwili usio na vazi jingine.
- source_word: κρατοῦσιν αὐτόν
  choice: nao wakamkamata
  rationale: κρατέω hapa ni kumshika kwa nguvu; ‘wakamkamata’ ni ya asili katika simulizi na haiongezi kwa lazima maana maalumu ya hatua rasmi ya kisheria.
