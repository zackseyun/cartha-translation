  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: sw
  text: Petro alipokuwa chini uani, mmoja wa wajakazi[a] wa kuhani mkuu akaja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wa kike.” Neno la Kigiriki παιδίσκη linaweza kumaanisha mtumishi wa kike au mtumwa wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Petro alipokuwa
  rationale: Muundo huu wa Kigiriki unaweka mazingira ya wakati kwa tendo linaloendelea; “Petro alipokuwa” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: κάτω
  choice: chini
  rationale: Neno hili linaonyesha mahali palipo chini, huenda kwa kulinganisha na shughuli zilizokuwa sehemu ya juu ya makao.
- source_word: ἐν τῇ αὐλῇ
  choice: uani
  rationale: Hapa αὐλή ni ua wa ndani wa makao ya kuhani mkuu; “uani” ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: ἔρχεται
  choice: akaja
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, “akaja” huendeleza simulizi kwa Kiswahili cha kawaida bila kubadili tukio.
- source_word: μία τῶν παιδισκῶν
  choice: mmoja wa wajakazi
  rationale: παιδίσκη linaweza kumaanisha mtumishi wa kike au kijakazi; “wajakazi” linaonyesha nafasi yao ya chini katika nyumba huku tanbihi ikihifadhi uwezekano wa hali ya utumwa.
- source_word: τοῦ ἀρχιερέως
  choice: wa kuhani mkuu
  rationale: Kauli hii inaonyesha uhusiano wake na nyumba au utumishi wa kuhani mkuu, na “wa kuhani mkuu” ni ya asili na wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye heshima. “Uani” limetumiwa kwa αὐλή, na “wajakazi” huhifadhi dhana ya watumishi wa kike bila kuamua kimya kimya kama hadhi yao ya kisheria ilikuwa utumwa.
