  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: sw
  text: Baada ya kuimba sifa[a], wakatoka kwenda Mlima wa Mizeituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuimba wimbo wa sifa.” Kitenzi cha Kigiriki kinaweza kumaanisha kuimba wimbo wa sifa.
