lexical_decisions:
- source_word: Καὶ
  choice: Baada ya
  rationale: Katika Kiswahili, uhusiano wa wakati unaobebwa na kirai tegemezi ὑμνήσαντες unaweza kuunganishwa kwa kawaida na kitenzi kikuu kwa ‘Baada ya’; hivyo mfuatano wa matendo unabaki wazi bila kulazimisha ‘Na’ isiyo ya lazima mwanzoni.
- source_word: ὑμνήσαντες
  choice: kuimba wimbo wa sifa
  rationale: Kitenzi ὑμνέω humaanisha kuimba wimbo wa sifa au tenzi. Usemi huu ni wa kawaida na unaeleweka, huku ukihifadhi maana ya uimbaji wa sifa bila kubainisha wimbo fulani usiotajwa katika Kigiriki.
- source_word: ἐξῆλθον
  choice: wakaenda
  rationale: Katika muktadha huu, maana kuu ni kuondoka na kuelekea mahali palipotajwa. ‘Wakaenda’ ni simulizi la kawaida la Kiswahili na haliongezi urasmi usio katika chanzo.
- source_word: εἰς
  choice: kwenye
  rationale: Kihusishi hiki kinaonyesha mahali walikoelekea. ‘Kwenye’ ni cha kawaida katika Kiswahili pamoja na jina la eneo hili.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Mlima wa Mizeituni
  rationale: Hili ndilo jina la mahali lililozoeleka katika Kiswahili; linahifadhi Ὄρος kama ‘Mlima’ na wingi τῶν Ἐλαιῶν kama ‘Mizeituni.’
