  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: sw
  text: Kisha akachukua kikombe[a], akashukuru, akawapa, nao wote wakanywa kutoka humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikombe hicho.” Kigiriki husema “kikombe” bila kibainishi, ingawa muktadha wa mlo unaweza kumaanisha kikombe mahususi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: akachukua
  rationale: Kauli hii ya mfululizo inawasilisha tendo lililotangulia tendo kuu kwa Kiswahili cha kawaida, bila kulazimisha muundo mzito wa kishiriki.
- source_word: ποτήριον
  choice: kikombe
  rationale: Nomino ya Kigiriki haina kibainishi. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the,’ hivyo ‘kikombe’ huhifadhi kutobainishwa huko bila kuamua kwa lazima kama ni kikombe fulani.
- source_word: εὐχαριστήσας
  choice: akashukuru
  rationale: Hutoa maana ya kutoa shukrani kwa lugha ya kawaida na huepuka kuingiza istilahi ya baadaye ya kiliturujia. Mfuatano wa vitenzi unaonyesha kuwa shukrani ilitangulia kutoa kikombe.
- source_word: ἔδωκεν αὐτοῖς
  choice: akawapa
  rationale: Kitenzi ‘akawapa’ ni cha kawaida katika Kiswahili; kitu kilichotolewa kinaeleweka kutoka kwa ‘kikombe’ kilichotajwa mara moja kabla.
- source_word: ἔπιον
  choice: wakanywa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha Kigiriki, huku ‘wa-’ ikirejelea kundi la wanafunzi.
- source_word: ἐξ αὐτοῦ
  choice: kutoka katika kikombe hicho
  rationale: Kurudia ‘kikombe hicho’ ni wazi na kwa kawaida zaidi kuliko ‘kutoka humo’ katika muktadha huu, na kunabainisha rejeo la kiwakilishi cha Kigiriki.
- source_word: πάντες
  choice: wote
  rationale: Huhifadhi msisitizo kwamba kila mmoja wao alikunywa.
theological_decisions:
- issue: Madokezo ya Kiukaristi katika εὐχαριστήσας
  choice: akashukuru
  alternative: akakibariki; akatoa shukrani ya kiliturujia
  rationale: Kitenzi εὐχαριστέω kinamaanisha kutoa shukrani. Tafsiri haipaswi kuingiza istilahi au ufafanuzi wa baadaye wa kisakramenti ambao haujaelezwa moja kwa moja katika Kigiriki.
- issue: Kama ποτήριον ni ‘kikombe’ au ‘kikombe hicho’
  choice: kikombe
  alternative: kikombe hicho
  rationale: Kwa kuwa Kigiriki hakina kibainishi hapa na Kiswahili hakilazimishi utofauti wa ‘a/the,’ maandishi makuu yanaacha nomino bila kibainishi maalumu. Tanbihi inaonyesha uwezekano wa kikombe mahususi kutokana na muktadha wa mlo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘aka-’ unatoa kwa uwazi mfuatano wa matendo ya simulizi. Maneno ya kiliturujia yasiyolazimishwa na Kigiriki yameepukwa.
