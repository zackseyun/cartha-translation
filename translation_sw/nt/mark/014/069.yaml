  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: sw
  text: Yule kijakazi alipomwona, akaanza tena kuwaambia watu waliokuwa wamesimama karibu, “Huyu ni mmoja wao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: kijakazi
  rationale: Neno hili humaanisha msichana au mwanamke kijana anayehudumu, ambaye pia angeweza kuwa mtumwa. “Kijakazi” ni neno la kawaida katika usimulizi wa kibiblia wa Kiswahili na halifanyi hali yake ya kisheria kuwa jambo kuu kuliko inavyofanywa na muktadha.
- source_word: ἰδοῦσα
  choice: alipomwona
  rationale: 'Muundo huu wa wakati unaonyesha kwa Kiswahili cha kawaida hali iliyochochea kitendo kilichofuata: baada au wakati alipomwona Petro, alianza kusema.'
- source_word: ἤρξατο πάλιν λέγειν
  choice: akaanza tena kuwaambia
  rationale: Huhifadhi maana ya kuanza (ἤρξατο) na kurudia (πάλιν), huku “kuwaambia” ikionyesha kwa kawaida kwamba maneno yalielekezwa kwa watu waliokuwapo.
- source_word: τοῖς παρεστῶσιν
  choice: watu waliokuwa wamesimama karibu naye
  rationale: Huwakilisha watu waliokuwapo au waliosimama karibu. Kirai hiki kinahifadhi taswira ya mahali, ingawa neno la Kigiriki linaweza pia kumaanisha kwa ujumla watu waliokuwapo hapo.
- source_word: Οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki kinamwelekeza Petro moja kwa moja na ni cha kawaida na chenye nguvu ya kutosha katika shtaka hili bila kuongeza dharau isiyokuwapo wazi katika Kigiriki.
- source_word: ἐξ αὐτῶν
  choice: ni mmoja wao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Petro ni wa kundi lao, na unahifadhi maana ya Kigiriki ya kuwa miongoni mwao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa usimulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Akaanza tena” huhifadhi mwendo wa simulizi, na dokezo huhifadhi upana wa maana ya παρεστῶσιν.
