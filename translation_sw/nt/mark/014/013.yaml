  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: sw
  text: Anawatuma wawili kati ya wanafunzi wake na kuwaambia, “Nendeni mjini, na mwanamume akiwa amebeba mtungi wa maji[a] atakutana nanyi. Mfuateni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtungi wa udongo wenye maji.”
    reason: Neno κεράμιον linaweza kutaja kwa uwazi zaidi chombo kilichotengenezwa kwa udongo.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: Anawatuma
  rationale: Wakati uliopo umehifadhiwa ili kuakisi wakati uliopo wa kihistoria unaofanya simulizi la Marko liwe hai.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: wawili kati ya wanafunzi wake
  rationale: 'Muundo huu unaonyesha wazi maana ya sehemu ya kundi: wawili kutoka miongoni mwa wanafunzi wake.'
- source_word: λέγει αὐτοῖς
  choice: kuwaambia
  rationale: Kitenzi hiki kinaunganishwa kwa njia ya kawaida na ‘Anawatuma’ huku maana ya wakati uliopo ikiendelea kuhifadhiwa.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Nendeni mjini
  rationale: Ni amri ya kawaida na ya moja kwa moja; ‘mjini’ huonyesha kuelekea na kuingia katika mji kwa Kiswahili cha asili.
- source_word: ἀπαντήσει ὑμῖν
  choice: atakutana nanyi
  rationale: Huhifadhi wakati ujao na humweka mwanamume kama kiima cha tukio la kukutana, kama ilivyo katika Kigiriki.
- source_word: ἄνθρωπος
  choice: mwanamume
  rationale: Katika muktadha huu neno linamtaja mtu maalumu wa kiume, hivyo ‘mwanamume’ ni sahihi kuliko neno la kijumla ‘mtu’.
- source_word: κεράμιον ὕδατος
  choice: mtungi wa maji
  rationale: Ni usemi wazi na wa kawaida unaotaja chombo na yaliyomo; uwezekano wa kusisitiza kwamba kilikuwa cha udongo umewekwa katika tanbihi.
- source_word: βαστάζων
  choice: aliyebeba
  rationale: Hueleza tendo linalomtambulisha mwanamume wakati huo kwa Kiswahili cha kawaida.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Mfuateni
  rationale: Ni amri ya moja kwa moja, ya asili, inayohifadhi maana ya kumfuata mtu huyo.
