  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: sw
  text: Inukeni, twendeni. Tazama, anayenisaliti[a] amekaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “anayenikabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Inukeni
  rationale: Ni amri kwa watu wengi. Katika muktadha huu Yesu anawahimiza wanafunzi wasimame na waondoke, si kuwaambia tu waamke usingizini.
- source_word: ἄγωμεν
  choice: twendeni
  rationale: Ni kauli ya kuhimiza tendo la pamoja; “twendeni” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἰδού
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa jambo linalofuata. “Tazama” hudumisha nguvu hiyo kwa lugha yenye hadhi na inayoeleweka.
- source_word: ὁ παραδιδούς
  choice: anayenisaliti
  rationale: Kirai hiki ni nomino-kitenzi chenye maana ya mtu anayemkabidhi Yesu. Katika simulizi hili, kwa kuwa kinamhusu Yuda, “anayenisaliti” huwasilisha kwa kawaida uzito wa kimahusiano na kimaadili, huku maana halisi zaidi ya kukabidhi ikihifadhiwa katika tanbihi.
- source_word: με
  choice: -ni-
  rationale: Kiambishi cha yambwa “-ni-” katika “anayenisaliti” kinamrejelea Yesu na kutafsiri με (‘mimi’).
- source_word: ἤγγικεν
  choice: amekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuwa kuja karibu kumetimia na matokeo yake yapo sasa. “Amekaribia” huhifadhi hali hiyo bila kulazimisha maana ya kwamba tayari amewasili kabisa.
theological_decisions:
- issue: Tafsiri ya παραδίδωμι katika simulizi la mateso
  choice: anayenisaliti
  alternative: anayenikabidhi
  rationale: Katika muktadha wa Yuda, “kusaliti” huwasilisha maana ya simulizi kwa uwazi. Hata hivyo, Kigiriki kimsingi kinaweza kumaanisha “kukabidhi”; maana hiyo haijaondolewa bali imeonyeshwa katika tanbihi ili kuhifadhi upana wa neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Amri za wingi “Inukeni” na “twendeni” zinaendeleza mwendo mfupi na wa dharura wa kauli ya Kigiriki.
