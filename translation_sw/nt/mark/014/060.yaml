  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: sw
  text: Kisha kuhani mkuu akasimama katikati[a], akamhoji Yesu akisema, “Hujibu lolote?[b] Hawa[c] wanatoa ushahidi gani dhidi yako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kigiriki kinaweza pia kuonyesha kwamba alisogea hadi katikati, mbele ya mkutano.
    reason: lexical_alternative
  - marker: b
    text: Au “Huna jibu lolote?”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno moja, “hawa”; Kigiriki kimetumia kiwakilishi cha wingi wa kiume kinachowaelekezea mashahidi waliokuwapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kitenzi hiki kinaonyesha kitendo cha kuinuka na kusimama; “akasimama” ni cha kawaida katika masimulizi ya Kiswahili na kinaendeleza mtiririko wa tukio.
- source_word: ὁ ἀρχιερεὺς
  choice: Kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kuhani mkuu aliyekuwa akiongoza mkutano huu.
- source_word: εἰς μέσον
  choice: katikati
  rationale: Kirai kinaonyesha kwamba kuhani mkuu alichukua nafasi ya kati mbele ya mkutano. Kiswahili “akasimama katikati” kinawasilisha nafasi hiyo kwa kawaida bila lugha ya kizamani.
- source_word: ἐπηρώτησεν
  choice: akamhoji
  rationale: Katika mazingira haya ya kesi, “akamhoji” lina nguvu inayofaa kuliko “akamuuliza,” bila kuzidisha maana kuwa mateso au mahojiano makali.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Hujibu lolote?
  rationale: Hili linahifadhi changamoto fupi na ya moja kwa moja ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: οὗτοί
  choice: Hawa
  rationale: Kiwakilishi hiki kinawaelekezea mashahidi waliokuwapo. “Hawa” ni cha asili katika Kiswahili; maelezo ya chini yanaonyesha kuwa umbo la Kigiriki ni la wingi wa kiume.
- source_word: καταμαρτυροῦσιν
  choice: wanatoa ushahidi gani dhidi yako
  rationale: “Kutoa ushahidi dhidi ya” linahifadhi maana ya kisheria ya kutoa ushahidi unaompinga mtu, huku “gani” likiwasilisha swali τί kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeo la kiume katika οὗτοί
  choice: Hawa, pamoja na tanbihi kuhusu umbo la Kigiriki
  alternative: Wanaume hawa
  rationale: Kiswahili hakionyeshi jinsia katika kiwakilishi “hawa.” Kutumia “wanaume hawa” katika matini kungefanya jinsia kuwa wazi zaidi kuliko ilivyo kawaida katika tafsiri ya kiwakilishi hicho; tanbihi huhifadhi taarifa ya kisarufi bila kulazimisha ufafanuzi ndani ya sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa masimulizi wenye “aka-” umetumiwa kuonyesha mfululizo wa matendo, na istilahi ya ushahidi imehifadhi mazingira ya kesi.
