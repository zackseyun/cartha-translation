  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: sw
  text: Naye alipomwona Petro akijipasha moto, akamkazia macho, akamwambia, “Wewe pia ulikuwa pamoja na Yesu Mnazareti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: akiota moto
  rationale: Katika Kiswahili cha kawaida, ‘kuota moto’ ni usemi wa asili kwa kujipasha joto karibu na moto na unafaa muktadha wa ua.
- source_word: ἐμβλέψασα αὐτῷ
  choice: akamtazama kwa makini
  rationale: Kitenzi kinaonyesha kumkazia macho au kumwangalia kwa makini, si kumwona tu.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, simulizi la Kiswahili hutiririka kwa kawaida kwa wakati uliopita bila kubadili maana ya tukio.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: Yesu Mnazareti
  rationale: Huwasilisha utambulisho wa Yesu kuwa mtu wa Nazareti kwa mtindo wa kawaida na wenye heshima katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa Petro na Yesu katika shtaka la kijakazi
  choice: ulikuwa pamoja na Yesu
  alternative: ulikuwa mmoja wa wafuasi wa Yesu
  rationale: Tafsiri inahifadhi dai halisi la kuwa ‘pamoja na’ Yesu bila kuongeza wazi kwamba Petro alikuwa mfuasi, jambo ambalo halisemwi moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mpangilio umefanywa wa asili kwa simulizi la Kiswahili huku msisitizo wa ‘wewe pia’ na ukali wa kumtazama Petro ukihifadhiwa.
