base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: sw
  text: Amefanya alichoweza[a]; ameutia mwili wangu manukato mapema kwa ajili ya maziko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “Alichokuwa nacho, amefanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Amefanya alichoweza
  rationale: Hii ni tafsiri ya kimuktadha ya nahau yenye maana kwamba alifanya kadiri ya uwezo au nafasi aliyokuwa nayo. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu katika muktadha wa sasa.
- source_word: προέλαβεν
  choice: mapema
  rationale: Kitenzi kinaonyesha kutenda kabla ya wakati uliotarajiwa; ‘mapema’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuingiza wazo la kuja.
- source_word: μυρίσαι
  choice: ameutia ... manukato
  rationale: Katika muktadha huu μυρίζω humaanisha kupaka au kutia manukato. Muundo huu ni wa asili na unaeleweka kuliko kutumia neno linaloweza kudokeza ibada maalumu ya kutiwa mafuta.
- source_word: τὸ σῶμά μου
  choice: mwili wangu
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha Kigiriki.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: kwa ajili ya maziko
  rationale: Kirai kinaonyesha kusudi la tendo, yaani kuutayarisha mwili kwa maziko.
theological_decisions:
- issue: Kumtaja mhusika wa kike ambaye hakutajwa kwa nomino katika kifungu hiki
  choice: Amefanya ... ameutia
  alternative: Alichokuwa nacho, amefanya; ametangulia kuutia mwili wangu manukato kwa ajili ya maziko.
  rationale: Muktadha wa karibu unamtambulisha mwanamke, na upatanisho wa kisarufi wa Kiswahili hauhitaji kuongeza kiwakilishi tofauti. Tafsiri haiongezi wazo la mwendo katika προέλαβεν.
- issue: Iwapo μυρίσαι itafsiriwe kwa istilahi ya kidini
  choice: ameutia mwili wangu manukato
  alternative: ameupaka mwili wangu mafuta
  rationale: ‘Manukato’ huhifadhi maana ya marhamu yenye harufu katika muktadha wa maziko bila kuleta dhana ya kiibada ambayo haikulazimishwi na kitenzi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida huku tanbihi ikihifadhi muundo halisi na utata mdogo wa nahau ya Kigiriki.
