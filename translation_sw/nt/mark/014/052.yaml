lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: 'Kiunganishi hiki kinaonyesha tofauti ndogo na tukio lililotangulia: baada ya kushikwa, kijana huyo aliacha vazi na kukimbia.'
- source_word: καταλιπὼν
  choice: akaliacha
  rationale: Kitenzi hiki kina maana ya kuacha kitu nyuma; muundo huu ni wa kawaida katika Kiswahili na unaonyesha kwamba aliliacha vazi ili akimbie.
- source_word: σινδόνα
  choice: vazi la kitani
  rationale: Neno hili humaanisha kitambaa cha kitani ambacho katika muktadha huu kilivaliwa mwilini. “Vazi la kitani” ni wazi na la kawaida, bila kubainisha kupita kiasi umbo lake.
- source_word: γυμνὸς
  choice: akiwa uchi
  rationale: Katika muktadha huu maana ya moja kwa moja ni kwamba alikimbia bila vazi hilo, ingawa neno linaweza pia kumaanisha kutovaa vya kutosha katika miktadha mingine.
- source_word: ἔφυγεν
  choice: kukimbia
  rationale: Kitenzi hiki huonyesha kukimbia au kutoroka hatari; “kukimbia” linaendeleza kwa kawaida muundo wa sentensi na dharura ya tukio.
