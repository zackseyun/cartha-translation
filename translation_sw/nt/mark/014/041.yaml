  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: sw
  text: Akaja mara ya tatu, akawaambia[a], “Bado mnalala na kupumzika? Imetosha[b]; saa imefika. Tazama, Mwana wa Adamu anakabidhiwa mikononi mwa wenye dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Endeleeni kulala sasa na kupumzika.” Maneno ya Kigiriki yanaweza kueleweka ama kama ruhusa ya kejeli, ama kama swali la kukemea.
    reason: alternative_reading
  - marker: b
    text: “Imetosha” hutafsiri usemi mgumu wa Kigiriki. Mapendekezo mengine ni pamoja na “Basi, imetosha!” au, kwa uwezekano mdogo hapa, maana ya kibiashara kama “malipo yamepokelewa kikamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Akaja mara ya tatu
  rationale: Wakati uliopo wa kisimulizi umetafsiriwa kwa wakati uliopita, ambao ni wa kawaida na wa asili zaidi katika simulizi la Kiswahili; τὸ τρίτον ni ‘mara ya tatu.’
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Bado mnalala na kupumzika?
  rationale: Kauli hii inaweza kueleweka kama ruhusa ya kejeli au swali la kukemea. Swali hili ni la asili katika Kiswahili na linafaa muktadha; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: ἀπέχει
  choice: Imetosha
  rationale: Ni usemi mgumu, lakini ‘Imetosha’ unaonyesha kwa ufupi kwamba hali ya kungoja imefikia mwisho bila kuingiza maana ya kibiashara isiyo na uhakika.
- source_word: ἦλθεν ἡ ὥρα
  choice: saa imefika
  rationale: ‘Saa’ huhifadhi taswira ya wakati uliowekwa na uzito wake katika simulizi, badala ya kuirahisisha kuwa ‘wakati.’
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno la kawaida, lenye hadhi, linalohifadhi mwito wa kuelekeza fikira.
- source_word: παραδίδοται
  choice: anakabidhiwa
  rationale: Huhifadhi maana pana ya kukabidhi au kuweka chini ya mamlaka ya mwingine, bila kuibana mapema iwe usaliti wa Yuda peke yake.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni tamko la kawaida la kibiblia kwa jina hili la Yesu na huhifadhi uzito wake wa kimajina.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: mikononi mwa wenye dhambi
  rationale: Huhifadhi tamathali halisi ya kuingia chini ya uwezo wa watu wanaotajwa kuwa wenye dhambi.
theological_decisions:
- issue: Nguvu ya Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Swali la kukemea: “Bado mnalala na kupumzika?”'
  alternative: 'Ruhusa au amri ya kejeli: “Endeleeni kulala sasa na kupumzika.”'
  rationale: Maandishi ya kale hayatoi uakifishaji unaoamua jambo hili, na maumbo ya Kigiriki yanaweza kusikika kwa njia zote mbili. Matini kuu inatumia swali la asili katika Kiswahili, huku tanbihi ikihifadhi utata wa kweli.
- issue: Maana ya ἀπέχει
  choice: Imetosha
  alternative: Basi, imetosha!; au maana ya kibiashara kama ‘malipo yamepokelewa kikamilifu’
  rationale: ‘Imetosha’ inafaa mpito wa ghafla kutoka usingizini kwa wanafunzi hadi kufika kwa wakati wa kukamatwa, bila kuingiza maana maalumu yenye mashaka.
- issue: Tafsiri ya παραδίδοται
  choice: anakabidhiwa
  alternative: anasalitiwa
  rationale: ‘Anakabidhiwa’ huhifadhi upana wa kitenzi na haifungi mhusika au wakala kuwa Yuda pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi huhifadhi kasi na mgeuko wa ghafla wa tukio. ‘Wenye dhambi’ limetumiwa badala ya ‘wenye dhambi wa kiume’ kwa kuwa Kigiriki hakilazimishi jinsia hapa.
