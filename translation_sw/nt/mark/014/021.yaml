source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu anaenda kama ilivyoandikwa kumhusu, lakini ole wake mtu yule ambaye Mwana wa Adamu anasalitiwa kupitia kwake.[a] Ingekuwa afadhali kwa mtu huyo kama asingalizaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “Mwana wa Adamu anakabidhiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu, kiunganishi hiki kinaanzisha maelezo ya sababu; “Kwa maana” kinawasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ὁ μὲν ... δὲ
  choice: anaenda ... lakini ole
  rationale: Muundo wa μέν...δέ unatofautisha kauli mbili; Kiswahili kwa kawaida hakihitaji kutafsiri μέν moja kwa moja, huku “lakini” kikibeba utofautishaji.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja la Yesu lililozoeleka na huhifadhi mwangwi unaowezekana wa Danieli.
- source_word: ὑπάγει
  choice: anaenda
  rationale: Wakati wa sasa unaonyesha kuelekea kwenye mwisho uliowekwa bila kulazimisha maana ya kuondoka mahali pekee.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: kama ilivyoandikwa kumhusu
  rationale: Huhifadhi ulinganisho wa καθώς na maana ya Maandiko yanayosimama kuwa yameandikwa, kwa Kiswahili cha asili.
- source_word: οὐαὶ
  choice: ole wake
  rationale: Hii ni kauli ya kinabii yenye uzito wa maombolezo na hukumu; “ole wake” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: mtu yule
  rationale: Hurejelea mtu maalumu katika muktadha na kuhifadhi demonstrativi yenye msisitizo.
- source_word: δι’ οὗ
  choice: ambaye kupitia kwake
  rationale: Huhifadhi maana ya uhusika au njia iliyo katika διά pamoja na genitivi.
- source_word: παραδίδοται
  choice: anasalitiwa
  rationale: Katika muktadha wa usaliti wa Yuda, neno hili huwasilisha wazi tabia ya kitendo; maana ya moja kwa moja zaidi, “anakabidhiwa,” imehifadhiwa katika tanbihi.
- source_word: καλὸν αὐτῷ
  choice: Ingekuwa afadhali kwa mtu huyo
  rationale: Muundo huu unaeleza tathmini ya hali kinyume na ukweli; “ingekuwa afadhali” ni Kiswahili cha asili kinacholingana na sharti linalofuata.
- source_word: εἰ οὐκ ἐγεννήθη
  choice: kama asingalizaliwa
  rationale: Huwasilisha sharti la hali kinyume na ukweli bila kuongeza msisitizo usiokuwamo katika Kigiriki.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: mtu huyo
  rationale: Huhifadhi urudiaji wa kumtaja mtu maalumu, ingawa “huyo” ni ya asili zaidi baada ya kumtaja awali kama “yule.”
theological_decisions:
- issue: Utafsiri wa παραδίδοται katika simulizi la mateso
  choice: anasalitiwa
  alternative: anakabidhiwa
  rationale: Muktadha wa karibu unahusu hila ya Yuda, hivyo “anasalitiwa” huonyesha wazi tabia ya kimaadili ya tukio. Tanbihi huhifadhi maana pana na ya moja kwa moja zaidi ya kitenzi hicho.
- issue: Mvutano kati ya mpango ulioandikwa na wajibu wa msaliti
  choice: kama ilivyoandikwa kumhusu, lakini ole wake mtu yule
  alternative: Hakuna ufafanuzi wa ziada unaotatua mvutano huo
  rationale: Tafsiri huhifadhi kwa pamoja kwamba njia ya Mwana wa Adamu inalingana na yaliyoandikwa na kwamba msaliti anawajibika, bila kugeuza mstari kuwa kauli ya udesturi au kumwondolea msaliti hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “asingalizaliwa” umechaguliwa ili kutoa hali kinyume na ukweli kwa ufupi na uzito unaofaa.
