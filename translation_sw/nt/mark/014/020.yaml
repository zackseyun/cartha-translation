  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: sw
  text: Akawaambia, “Ni mmoja wa wale kumi na wawili, yule anayechovya pamoja nami katika bakuli.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sahani.” Neno la Kigiriki τρύβλιον linaweza kumaanisha bakuli au sahani iliyotumiwa wakati wa kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Aka-
  rationale: Kiambishi cha masimulizi ‘aka-’ kinaendeleza tukio kwa kawaida katika Kiswahili bila kuingiza utofautishaji mkali.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya ‘alisema kwao,’ inayohifadhi utangulizi wa usemi wa moja kwa moja.
- source_word: Εἷς τῶν δώδεκα
  choice: mmoja wa wale kumi na wawili
  rationale: Inamtambulisha msaliti kuwa mmoja wa kundi la ndani la wanafunzi kumi na wawili bila kulifanya jina rasmi kwa lazima.
- source_word: ὁ ἐμβαπτόμενος
  choice: yule anayechovya
  rationale: Muundo wa wakati unaoendelea unahifadhi tendo la sasa linalomtambulisha mtu huyo; kitenzi ‘chovya’ kinafaa kwa kuingiza chakula katika bakuli.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Inawakilisha wazi maana ya kuandamana au kushiriki tendo pamoja na Yesu.
- source_word: εἰς τὸ τρύβλιον
  choice: katika bakuli
  rationale: ‘Bakuli’ ni neno la kawaida kwa chombo cha mezani kinachokusudiwa; ‘katika’ ni Kiswahili cha asili katika usemi ‘kuchovya katika’ na bado kinaonyesha kuingiza ndani.
