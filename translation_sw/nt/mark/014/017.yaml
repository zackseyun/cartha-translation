  text: And when evening came[a], he comes with the twelve.
translation:
  language: sw
  text: Jioni ilipofika, anakuja pamoja na wale kumi na wawili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale Kumi na Wawili,” ikiwa maneno hayo yanachukuliwa kuwa jina linalotambulika la kundi la mitume wa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (haijatafsiriwa kwa neno la pekee)
  rationale: Katika Kiswahili, kuanza sentensi kwa kiunganishi hapa si lazima; mfuatano wa simulizi unaeleweka wazi bila kuongeza neno lenye uzito wa kiufafanuzi.
- source_word: ὀψίας γενομένης
  choice: Jioni ilipofika
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida mazingira ya wakati yanayoonyeshwa na genitive absolute, bila kupoteza wazo la kuingia kwa jioni.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa umehifadhiwa ili kuendeleza athari hai ya historical present ya Marko, badala ya kuisawazisha kimya kuwa wakati uliopita.
- source_word: μετὰ τῶν δώδεκα
  choice: pamoja na wale kumi na wawili
  rationale: ‘Pamoja na’ huonyesha ushirika au kuandamana; ‘wale kumi na wawili’ inarejelea kwa ufupi kundi linalojulikana la wanafunzi wa Yesu bila kuongeza ‘wanafunzi’ au ‘mitume’ katika matini.
theological_decisions:
- issue: Wanaorejelewa na ‘wale kumi na wawili’
  choice: Kundi la ndani la Yesu la wale kumi na wawili, likiwemo Yuda katika hatua hii ya simulizi
  alternative: Kuongeza ‘wanafunzi’ au ‘mitume’ katika matini kuu
  rationale: Rejeo hilo linaeleweka kutokana na simulizi lenyewe. Kuliacha kwa ufupi kunahifadhi namna ya usemi wa Kigiriki na kuepuka ufafanuzi usio lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. Wakati wa sasa katika ‘anakuja’ umeachwa kwa makusudi ili kuhifadhi historical present ya Kigiriki; unaweza kusikika wa kimtindo lakini unaeleweka. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
