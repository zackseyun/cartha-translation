  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: sw
  text: kwamba[a], “Sisi tulimsikia akisema, ‘Mimi nitalibomoa hekalu hili lililofanywa kwa mikono[b], na katika muda wa siku tatu nitajenga jingine lisilofanywa kwa mikono.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki huanzisha maudhui ya ushahidi wao. Kwa kutegemea sentensi tangulizi, linaweza pia kutolewa kwa “wakisema.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “lililofanywa kwa mikono” na “lisilofanywa kwa mikono” yanahifadhi tofauti iliyopo katika Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: wakisema
  rationale: Katika muktadha unaoendelea wa ushahidi, ὅτι huanzisha maudhui ya madai yao. Kiswahili cha asili hutumia ‘wakisema’ badala ya ‘kwamba’ inayoning’inia bila kitenzi cha mstari uliotangulia.
- source_word: Ἡμεῖς
  choice: Sisi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kinahifadhiwa ili kuonyesha msisitizo wa mashahidi juu ya dai lao wenyewe.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: tulimsikia akisema
  rationale: Muundo huu ni wa kawaida na wa asili katika Kiswahili, nao unawakilisha hali ya participle λέγοντος.
- source_word: καταλύσω
  choice: nitalibomoa
  rationale: Kwa jengo, καταλύω humaanisha kubomoa au kuangusha; ‘nitalibomoa’ ni wazi na huhifadhi maana ya kuvunjwa kwa hekalu.
- source_word: ναὸν τοῦτον
  choice: hekalu hili
  rationale: ‘Hekalu’ ni neno linalotambulika kwa ναός katika muktadha huu, na ‘hili’ huhifadhi nguvu ya kiashiria τοῦτον.
- source_word: χειροποίητον
  choice: lililofanywa kwa mikono
  rationale: Tafsiri ya karibu huhifadhi ulinganifu wa kimakusudi na ἀχειροποίητον bila kuufasiri kuwa tu ‘wa kibinadamu’.
- source_word: διὰ τριῶν ἡμερῶν
  choice: katika muda wa siku tatu
  rationale: διά pamoja na genitive hapa huonyesha kipindi ambacho tendo litatimizwa; usemi huu ni wa asili na huepuka kuifanya maana kuwa lazima ‘baada ya siku tatu’.
- source_word: ἄλλον
  choice: jingine
  rationale: Hurejelea hekalu jingine na kuhifadhi wazo la kitu kingine badala ya cha kwanza.
- source_word: ἀχειροποίητον
  choice: lisilofanywa kwa mikono
  rationale: Huhifadhi tofauti ya moja kwa moja dhidi ya ‘lililofanywa kwa mikono’ na kuacha maana yake ya kiteolojia bila kuisuluhisha.
- source_word: οἰκοδομήσω
  choice: nitajenga
  rationale: Kitenzi humaanisha kujenga; hakihitaji maana ya ‘kujenga upya’.
theological_decisions:
- issue: Kauli hii ni ushahidi wa wapinzani, si uthibitisho wa msimulizi kwamba Yesu alisema maneno hayo kwa usahihi.
  choice: Imewekwa kama usemi ulioripotiwa ndani ya ushahidi wa mashahidi, bila maelezo ya ziada.
  alternative: Kuongeza maneno yanayosema wazi kuwa walipotosha kauli ya Yesu.
  rationale: Muundo wa nukuu unaonyesha kuwa hili ni dai lao. Tafsiri haipaswi kuingiza upatanisho au hukumu kutoka vifungu vingine.
- issue: Tofauti kati ya χειροποίητον na ἀχειροποίητον inaweza kuwa na mwangwi wa kiteolojia.
  choice: ‘lililofanywa kwa mikono’ / ‘lisilofanywa kwa mikono’
  alternative: ‘lililojengwa na wanadamu’ / ‘la Mungu’
  rationale: Tafsiri ya karibu huhifadhi tofauti iliyopo katika Kigiriki bila kuamua kwamba hekalu la pili ni la kimungu, jambo ambalo halisemwi wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa ‘Sisi’ na ‘Mimi’ ni kwa ajili ya kuhifadhi msisitizo wa viwakilishi vya Kigiriki. ‘Katika muda wa siku tatu’ huhifadhi maana ya kipindi bila kuifanya kuwa ‘baada ya siku tatu.’
