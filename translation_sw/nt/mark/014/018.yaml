base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: sw
  text: Walipokuwa wameegemea mezani[c] wakila, Yesu akasema, “Kweli nawaambia,[a] mmoja wenu atanisaliti[b]—yule anayekula pamoja nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya asili kwa karibu zaidi, “Amina, nawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atanikabidhi.” Kitenzi cha Kigiriki kinaweza kumaanisha kukabidhi, kutoa kwa wengine, au kusaliti; hapa kinahusu tendo la hila la mmoja wa wale waliokuwa pamoja na Yesu.
    reason: lexical_alternative
  - marker: c
    text: Kuegemea mezani kulikuwa mkao wa kawaida wakati wa chakula rasmi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνακειμένων
  choice: walipokuwa wameegemea mezani
  rationale: Kitenzi hiki kinaonyesha mkao wa kuegemea wakati wa chakula rasmi katika ulimwengu wa kale wa Mediterania. Kauli hii inahifadhi hali ya kihistoria bila kudokeza kwamba walikuwa wameketi mezani kwa mtindo wa kisasa.
- source_word: ἐσθιόντων / ἐσθίων
  choice: wakila / anayekula
  rationale: Kitenzi hiki kinamaanisha kula. Umbo la mwisho lenye kibainishi limetafsiriwa kwa kishazi cha uhusiano, “yule anayekula,” ili kuakisi ὁ ἐσθίων.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hii ni kauli nzito ya Yesu ya kutanguliza tamko. “Kweli nawaambia” ni Kiswahili cha sasa na cha kawaida kinachohifadhi uzito wa Ἀμήν; tafsiri ya karibu zaidi na umbo la Kigiriki imewekwa katika tanbihi.
- source_word: εἷς ἐξ ὑμῶν
  choice: mmoja wenu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi unaoonyesha mmoja kutoka katika kundi.
- source_word: παραδώσει
  choice: atanisaliti
  rationale: Kimsingi kitenzi kinaweza kumaanisha kumkabidhi mtu, lakini katika muktadha huu mhusika wa karibu anayeshiriki chakula na Yesu anamkabidhi kwa nia ya hila. “Atanisaliti” linaonyesha nguvu ya kimahusiano na kimaadili, huku maana ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Hii inaonyesha ushirika au kuwa pamoja; “pamoja nami” ni usemi wa asili katika muktadha wa kushiriki chakula.
theological_decisions:
- issue: Tafsiri ya παραδώσει katika simulizi la mateso
  choice: atanisaliti
  alternative: atanikabidhi
  rationale: Kitenzi cha Kigiriki si lazima kila mahali kimaanishe kusaliti, lakini hapa kinamhusu mwandamani wa karibu anayeshiriki chakula na Yesu na ambaye atamkabidhi kwa wapinzani wake. Tafsiri kuu inaonyesha hila hiyo, huku tanbihi ikihifadhi upana wa maana ya neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “wameegemea mezani” unahifadhi desturi ya kihistoria, na “yule anayekula pamoja nami” unadumisha msisitizo wa Kigiriki kuhusu ushirika wa mezani.
