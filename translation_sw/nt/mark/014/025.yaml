  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: sw
  text: Kweli nawaambia, sitakunywa tena kamwe zao la mzabibu[a] mpaka siku ile nitakapolinywa jipya[b] katika ufalme wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kinywaji kinachotokana na mzabibu na kutumiwa katika mlo. Kigiriki chenyewe kinasema “zao la mzabibu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nitakapolinywa upya.” Neno la Kigiriki linaweza kumaanisha “jipya” na huenda likadokeza upya wa wakati ujao katika ufalme wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hutoa kwa Kiswahili cha kawaida uzito wa kauli ya uthibitisho na kuhifadhi usemi wa moja kwa moja kwa wasikilizaji.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: sitakunywa tena kamwe
  rationale: “Tena” huhifadhi maana ya οὐκέτι, na “kamwe” huonyesha ukanushaji wa baadaye wenye mkazo wa οὐ μή.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: mazao ya mzabibu
  rationale: Hufuata usemi wa Kigiriki bila kuufasiri moja kwa moja kuwa divai; katika muktadha ni kile kinachotokana na mzabibu na kunywewa kwenye mlo.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: mpaka siku ile
  rationale: Huhifadhi kikomo cha wakati pamoja na msisitizo wa kiashiria ἐκείνης.
- source_word: ὅταν αὐτὸ πίνω
  choice: nitakapoyanywa
  rationale: Muundo wa Kiswahili huonyesha tukio la baadaye; kiambishi -ya- hurejelea “mazao,” ingawa kinachokusudiwa ni kinywaji kinachotokana nayo.
- source_word: καινὸν
  choice: yakiwa mapya
  rationale: Huhifadhi maana ya msingi ya ubora mpya bila kuamua kama ni kunywa upya tu au upya wa kieskatolojia.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: katika ufalme wa Mungu
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye hadhi ya usemi huu wa Agano Jipya.
theological_decisions:
- issue: Maana ya καινὸν katika kishazi cha mwisho
  choice: yakiwa mapya
  alternative: nitakapoyanywa upya
  rationale: Kivumishi kinaweza kueleza upya wa hali au ubora, huku tafsiri ya “upya” ikisisitiza tendo kurudiwa. Matini kuu haifungi uwezekano huo kwa maelezo ya ziada.
- issue: Kinachorejelewa na “mazao ya mzabibu”
  choice: Kuhifadhi usemi huo badala ya kutaja divai
  alternative: divai
  rationale: Ingawa muktadha unaonyesha kinywaji cha kikombe, Kigiriki hakitumii neno mahsusi la “divai”; hivyo tafsiri haiongezi ubainifu usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sitakunywa tena kamwe” ni msisitizo wa asili unaoeleweka kwa urahisi. Usemi “mazao ya mzabibu” umehifadhiwa ili kuepuka kutaja aina ya kinywaji kwa ubainifu mkubwa kuliko Kigiriki.
