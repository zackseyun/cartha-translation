  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: sw
  text: 'Yesu akawaambia, “Ninyi nyote mtajikwaa[a], kwa maana imeandikwa: ‘Nitampiga mchungaji, na kondoo watatawanyika.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaacha kunifuata”; au, kwa karibu zaidi na Kigiriki, “mtasababishwa kujikwaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili na unaendeleza mtiririko hai wa simulizi la Marko.
- source_word: σκανδαλισθήσεσθε
  choice: mtajikwaa
  rationale: Neno hili linadumisha sitiari ya Kigiriki na utata wake kuhusu kushindwa kwa wanafunzi, kuacha kumfuata Yesu, au kusababishwa kuanguka. Maana ya muktadha imeelezwa katika tanbihi bila kuingizwa moja kwa moja katika matini.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Hii ndiyo kauli ya kawaida na yenye hadhi ya kutambulisha nukuu ya Maandiko, huku hali ya matokeo yanayoendelea ya kitendo cha kuandika ikidumishwa.
- source_word: Πατάξω
  choice: Nitampiga
  rationale: Inawakilisha moja kwa moja nafsi ya kwanza na wakati ujao wa kitenzi, pamoja na kiambishi cha yambwa kinachohitajika kiasili katika Kiswahili.
- source_word: τὸν ποιμένα
  choice: mchungaji
  rationale: Inadumisha taswira ya kinabii ya mchungaji katika umoja; umakini wa nomino ya Kigiriki unaeleweka kiasili kutokana na muktadha wa nukuu.
- source_word: τὰ πρόβατα
  choice: kondoo
  rationale: Ni tafsiri ya kawaida na ya asili ya taswira ya kundi la kondoo.
- source_word: διασκορπισθήσονται
  choice: watatawanyika
  rationale: Kitenzi hiki kinaeleza kwa ufasaha kundi kuvunjika na kwenda pande mbalimbali; umbo lake la Kiswahili linawasilisha hali inayowapata kondoo bila kulazimisha mtendaji atajwe.
theological_decisions:
- issue: Maana ya σκανδαλισθήσεσθε kuhusu mwitikio wa wanafunzi kwa Yesu
  choice: mtajikwaa
  alternative: mtaacha kunifuata; mtasababishwa kujikwaa
  rationale: “Mtajikwaa” huhifadhi sitiari na mvutano wa neno la Kigiriki bila kulifanya limaanishe uasi wa kudumu au kukimbia tu. Muktadha unaonyesha kushindwa na kutawanyika kwa wanafunzi, lakini matini yenyewe haifafanui kiwango au udumu wa kuanguka huko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku nukuu ya kinabii na sitiari zake zikihifadhiwa.
