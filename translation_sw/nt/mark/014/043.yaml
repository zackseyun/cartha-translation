base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: sw
  text: Mara moja[a], Yesu alipokuwa bado akisema, Yuda, mmoja wa wale Kumi na Wawili, akafika, akiwa pamoja na umati wenye panga na marungu[b], uliotoka kwa wakuu wa makuhani, waandishi, na wazee[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Papo hapo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mbao”; hapa inamaanisha marungu au virungu vilivyotumiwa kama silaha.
    reason: lexical_alternative
  - marker: c
    text: Au, “uliotumwa na wakuu wa makuhani, waandishi, na wazee.” Kigiriki husema moja kwa moja kwamba umati ulitoka kwao; hilo linaweza kuonyesha chanzo au mamlaka yao.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Mara hiyo
  rationale: Huonyesha kwamba tukio lilifuata papo hapo na kuhifadhi kasi ya usimulizi wa Marko kwa Kiswahili cha kawaida.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Yesu alipokuwa bado anasema
  rationale: Hutoa maana ya tendo lililokuwa likiendelea wakati Yuda alipofika. Jina 'Yesu' linaweka rejeo wazi kwa msomaji wa Kiswahili bila kubadili maana.
- source_word: παραγίνεται
  choice: akafika
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa usimulizi unaofaa Kiswahili; 'akafika' huonyesha kuwasili kwake katika eneo hilo.
- source_word: εἷς τῶν δώδεκα
  choice: mmoja wa wale Kumi na Wawili
  rationale: Huhifadhi jina maalumu la kundi hilo bila kuongeza neno 'wanafunzi' lisilomo katika kifungu.
- source_word: ὄχλος
  choice: umati
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza mapema maana ya 'genge'; uhasama unaonekana kutokana na silaha na muktadha.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: wenye panga na marungu
  rationale: Maana ya kuwa na silaha hizo imetolewa kwa Kiswahili cha asili. ξύλων kwa maana halisi ni vitu vya mbao, lakini hapa ni marungu yanayotumiwa kama silaha.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: kutoka kwa viongozi wa makuhani, waandishi na wazee
  rationale: Huhifadhi wazo la chanzo au mamlaka bila kusema moja kwa moja 'waliotumwa na', jambo ambalo kihusishi pekee hakilielezi wazi.
- source_word: ἀρχιερέων
  choice: viongozi wa makuhani
  rationale: Wingi huu humaanisha tabaka la uongozi wa kikuhani, si makuhani wakuu wengi wanaoshika cheo kilekile kwa wakati mmoja.
- source_word: γραμματέων
  choice: waandishi
  rationale: Ni kisawe cha moja kwa moja cha cheo hicho na hakipanui kimafafanuzi kuwa 'walimu wa sheria'.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Huhifadhi cheo cha viongozi waliotambuliwa katika jamii na taasisi za Kiyahudi.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika παραγίνεται
  choice: 'Kutumia wakati wa usimulizi: ''akafika'''
  alternative: Kuhifadhi wakati uliopo kwa kusema 'anafika'
  rationale: Kigiriki hutumia wakati uliopo ili kuufanya usimulizi uwe hai, lakini 'akafika' ni mtiririko wa kawaida wa simulizi la Kiswahili huku ghafla ya tukio ikihifadhiwa na 'Mara hiyo'.
- issue: Nguvu ya παρὰ mbele ya viongozi
  choice: kutoka kwa viongozi wa makuhani, waandishi na wazee
  alternative: waliotumwa na viongozi wa makuhani, waandishi na wazee
  rationale: Kifungu kinataja chanzo au mamlaka ya umati bila kueleza wazi namna walivyoagizwa au kutumwa; tafsiri haiongezi utaratibu usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi. Sentensi imegawanywa mara mbili ili kuepuka mlolongo mzito, huku uhusiano wa Yuda na umati ukihifadhiwa. 'Wale Kumi na Wawili' imetumiwa kama jina la kundi maalumu.
