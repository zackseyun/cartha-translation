id: MRK.14.31
reference: Mark 14:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: sw
  text: Lakini yeye alizidi kusisitiza[a], “Kama ni lazima nife pamoja nawe[b], kamwe sitakukana[c].” Nao wote pia walikuwa wakisema vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliendelea kusema kwa msisitizo mkubwa sana.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiyunani kina maana ya kufa pamoja na mtu mwingine.
    reason: lexical_alternative
  - marker: c
    text: Au, “hakika sitakukana.” Kiyunani kinatumia ukanushi wenye nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: alizidi kusisitiza
  rationale: Kielezi kinaongeza nguvu ya usemi wa Petro, na hali ya kitenzi inaonyesha tendo lililoendelea au kurudiwa. “Alizidi kusisitiza” huwasilisha kupanda kwa msisitizo kwa Kiswahili cha kawaida.
- source_word: Ἐὰν δέῃ με
  choice: Kama ni lazima
  rationale: δέῃ huonyesha ulazima, si uwezekano tu; tafsiri hii inalinda maana hiyo kwa lugha ya kawaida.
- source_word: συναποθανεῖν σοι
  choice: nife pamoja nawe
  rationale: Kitenzi ambatano chenye συν- kinaonyesha wazi kufa pamoja na mtu mwingine.
- source_word: οὐ μή
  choice: kamwe sita-
  rationale: Muundo huu wa Kiyunani ni ukanushi wenye nguvu. “Kamwe sita-” ni wa asili katika Kiswahili na huhifadhi mkazo wa ahadi ya Petro.
- source_word: ἀπαρνήσομαι
  choice: sitakukana
  rationale: “Kukana” ni neno wazi na linalofaa katika simulizi hili, na linaunganisha ahadi hii na tendo la Petro baadaye.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Nao wote pia walikuwa wakisema vivyo hivyo
  rationale: “Vivyo hivyo” hurejelea yaliyomo katika maneno yao, huku “walikuwa wakisema” ikihifadhi hali endelevu ya kitenzi cha Kiyunani.
theological_decisions:
- issue: Nguvu ya ahadi ya Petro kwamba hatamkana Yesu
  choice: kamwe sitakukana
  alternative: hakika sitakukana
  rationale: Tafsiri inadumisha ukanushi mkali wa οὐ μή na kuacha wazi mvutano wa kisimulizi kati ya kujiamini kwa Petro na kushindwa kwake baadaye, bila kuuingiza ufafanuzi wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Alizidi kusisitiza” huepuka lugha ngumu huku ikihifadhi mwendelezo na nguvu ya usemi.
