  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: sw
  text: Kisha anakuja na kuwakuta wamelala, naye anamwambia Petro, “Simoni, umelala? Hukuweza kukaa macho[a] hata saa moja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa macho.” Neno la Kigiriki linaweza pia kumaanisha kuwa macho kwa uangalifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kuakisi usimulizi hai wa Marko.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: anawakuta wamelala
  rationale: Kauli hii ni ya asili katika Kiswahili na inaonyesha kwamba aliwakuta wakiwa katika hali ya kulala.
- source_word: λέγει τῷ Πέτρῳ
  choice: anamwambia Petro
  rationale: Wakati uliopo wa kihistoria umehifadhiwa, na hali ya utoaji imewasilishwa kwa kiambishi cha yambwa kinachofaa katika Kiswahili.
- source_word: Σίμων
  choice: Simoni
  rationale: Jina ambalo Yesu anatumia kumwita Petro limehifadhiwa, likitofautishwa na jina Petro katika simulizi.
- source_word: καθεύδεις
  choice: umelala
  rationale: Hii ni kauli ya kawaida na ya moja kwa moja katika Kiswahili kwa swali kuhusu hali ya kulala wakati huo.
- source_word: οὐκ ἴσχυσας
  choice: hukuweza
  rationale: Katika muktadha huu kitenzi kinaeleza kutoweza, si ukosefu wa nguvu za mwili hasa.
- source_word: μίαν ὥραν
  choice: hata saa moja
  rationale: ‘Saa moja’ huhifadhi muda uliotajwa; ‘hata’ huwasilisha kwa Kiswahili msisitizo wa swali hasi bila kubadili maana yake.
- source_word: γρηγορῆσαι
  choice: kukaa macho
  rationale: Muktadha unaweka tendo hili kinyume na kulala; ‘kukaa macho’ ni wazi na la kawaida, huku maana ya kuwa macho kwa uangalifu ikibaki.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika usimulizi wa Marko
  choice: 'Vitenzi vikuu vimetafsiriwa kwa wakati uliopo: ‘anakuja,’ ‘anawakuta,’ na ‘anamwambia.’'
  alternative: Kutumia wakati uliopita katika vitenzi vyote.
  rationale: Wakati uliopo unahifadhi uhai wa mtindo wa Marko na bado unasikika kwa kawaida katika usimulizi wa Kiswahili.
- issue: Maana ya γρηγορέω katika muktadha
  choice: kukaa macho
  alternative: kukesha; kuwa macho kwa uangalifu
  rationale: Kwa kuwa wanafunzi wamekutwa wamelala, maana halisi ya kutolala imepewa uzito. Hata hivyo, neno la Kigiriki linaweza pia kudokeza uangalifu, hivyo mbadala umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ni wa kawaida na wa moja kwa moja; wakati uliopo wa kihistoria umehifadhiwa bila kufanya sentensi kuwa ngumu.
