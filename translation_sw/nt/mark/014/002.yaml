base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: sw
  text: Maana walikuwa wakisema, “Si wakati wa sikukuu; ghasia zisije zikatokea miongoni mwa watu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ghasia zisije zikasababishwa na watu.” Muundo wa Kigiriki wa “ghasia ya watu” unaweza kumaanisha ghasia itatokea miongoni mwa watu au itasababishwa nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: γάρ
  choice: Maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia; “Maana” kinaonyesha uhusiano huo kwa ufupi na kwa kawaida.
- source_word: Μὴ
  choice: Si
  rationale: Huu ni ukanushi wa mkato katika mashauriano, ukiwa na maana iliyodokezwa ya ‘tusifanye hivyo wakati wa sikukuu.’ “Si” kinahifadhi ufupi wa Kigiriki.
- source_word: ἐν τῇ ἑορτῇ
  choice: wakati wa sikukuu
  rationale: ἐν limetumiwa kwa maana ya wakati, na ἑορτή linarejelea kipindi cha sikukuu kinachotajwa katika muktadha.
- source_word: μήποτε
  choice: wasije
  rationale: Neno hili linaanzisha matokeo yanayohofiwa na ambayo wasemaji wanataka kuyaepuka.
- source_word: ἔσται θόρυβος
  choice: wakafanya ghasia
  rationale: θόρυβος ni vurugu au makelele ya hadharani; “ghasia” linaonyesha fujo kubwa bila kulazimisha maana ya uasi kamili. Muundo wa kitenzi unafanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: τοῦ λαοῦ
  choice: watu
  rationale: Uhusiano wa hali ya umilikaji unaweza kuonyesha kuwa ghasia zingetokana na watu; Kiswahili cha matini kuu kinawataja watu kuwa watendaji, huku maana nyingine halali ikihifadhiwa katika tanbihi.
