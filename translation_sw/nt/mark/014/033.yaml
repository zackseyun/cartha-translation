source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: sw
  text: Akawachukua Petro, Yakobo na Yohana pamoja naye, akaanza kufadhaika sana[a] na kuhangaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kushtuka sana.” Kitenzi hiki kinaweza kumaanisha mshtuko, hofu, au mfadhaiko mkali katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: Akawachukua
  rationale: Kitenzi kina maana ya kuwachukua watu fulani waende pamoja naye. Umbo la simulizi lenye “aka-” ni la kawaida na la asili katika Kiswahili, ingawa Kigiriki kimetumia wakati uliopo wa kihistoria.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Hueleza wazi kwamba Petro, Yakobo na Yohana waliandamana na Yesu.
- source_word: ἤρξατο
  choice: akaanza
  rationale: Linahifadhi wazi maana ya kuanza kwa hali hiyo ya kihisia.
- source_word: ἐκθαμβεῖσθαι
  choice: kufadhaika sana
  rationale: Katika muktadha huu kitenzi kinaonyesha mshtuko au mfadhaiko mkali, si mshangao wa kawaida tu. Neno “sana” linabeba uzito wa kitenzi bila kuongeza maelezo yasiyokuwamo.
- source_word: ἀδημονεῖν
  choice: kuhangaika
  rationale: Huwasilisha taabu kali ya ndani na pia hutofautisha kitenzi hiki na “kufadhaika sana,” hivyo semi hizo mbili hazijaunganishwa kuwa moja.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Viunganishi vimehifadhiwa ili kudumisha mtindo wa Marko wa kuunganisha matendo na hali kwa mfululizo.
theological_decisions:
- issue: Hali ya kihisia ya Yesu huko Gethsemane
  choice: kufadhaika sana na kuhangaika
  alternative: kushtuka sana na kuhangaika; kuhuzunika sana na kutaabika
  rationale: Tafsiri inaonyesha wazi hali halisi na kali ya kibinadamu aliyopitia Yesu, bila kuipunguza wala kuieleza kwa nadharia ya kitheolojia isiyosemwa na aya yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “aka-” umetumiwa kwa usimulizi wa asili; maneno ya kihisia yamechaguliwa yaeleweke kwa urahisi huku yakihifadhi uzito na utofauti wa vitenzi viwili vya Kigiriki.
