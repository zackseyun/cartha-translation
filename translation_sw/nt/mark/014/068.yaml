  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: sw
  text: Lakini akakana, akisema, “Sijui wala sielewi unachosema.” Kisha akatoka nje hadi kwenye ukumbi wa mbele, na jogoo akawika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale hazina maneno: “na jogoo akawika.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: akakana
  rationale: Kitenzi hiki humaanisha kukataa au kukanusha. Kiswahili hakihitaji kuongeza yambwa hapa; muktadha unaonyesha kwamba Petro alikanusha dai lililotolewa, bila kulazimisha tafsiri ya moja kwa moja kwamba ‘alimkana Yesu’ katika kishazi hiki.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Sijui wala sielewi
  rationale: Jozi hii ya vitenzi inasisitiza ukanaaji wa Petro. ‘Sijui wala sielewi’ inadumisha uradidi huo kwa Kiswahili cha kawaida na cha wazi.
- source_word: σὺ τί λέγεις
  choice: unachosema
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya ‘kile unachosema,’ huku ikihifadhi uhusiano wa kitenzi λέγεις na λέγων.
- source_word: ἐξῆλθεν ἔξω
  choice: akatoka nje
  rationale: Muundo wa Kigiriki unasisitiza kutoka kwenda nje. ‘Akatoka nje’ ni wa kawaida katika Kiswahili na unahifadhi msisitizo huo bila kuwa mzito.
- source_word: προαύλιον
  choice: eneo la kuingilia ua
  rationale: Neno hili linaonyesha sehemu iliyo mbele ya ua wa ndani au sehemu ya kuingilia, si ua mkuu wenyewe. Kauli hii inaeleweka kwa urahisi na inadumisha tofauti hiyo ya mahali.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: jogoo akawika
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa mlio wa jogoo, nao unafaa mtiririko wa simulizi.
theological_decisions:
- issue: Kuwapo kwa kishazi καὶ ἀλέκτωρ ἐφώνησεν
  choice: Kimejumuishwa katika matini kuu kama ‘na jogoo akawika.’
  alternative: Kukiacha kishazi hiki kwa kufuata baadhi ya hati za kale.
  rationale: SBLGNT imejumuisha kishazi hiki huku ikiashiria tofauti ya matini. Kwa hiyo kimetafsiriwa katika matini kuu, na kutokuwapo kwake katika baadhi ya hati kumeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Uradidi wa ukanaaji umehifadhiwa, na istilahi ya mahali imefafanuliwa kwa maneno ya kawaida bila kupoteza tofauti kati ya ua wenyewe na eneo la kuingilia.
