  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: sw
  text: Petro akamfuata kwa mbali mpaka ndani ya ua wa kuhani mkuu. Alikuwa ameketi pamoja na watumishi, akijipasha moto kando ya moto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “kando ya mwanga”; inaelekea kuwa mwanga wa moto uliokuwa uani.'
    reason: Kigiriki hutumia φῶς, ‘mwanga,’ badala ya kutaja moto moja kwa moja; tanbihi huhifadhi uwezekano huo wa kileksika.
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya umbali alioweka Petro alipokuwa akifuata.
- source_word: ἠκολούθησεν αὐτῷ
  choice: akamfuata
  rationale: Wakati wa masimulizi unaendana kwa kawaida na kiambishi cha mfululizo '-ka-' katika Kiswahili, huku kiwakilishi kikirejelea Yesu bila kuongeza jina lisilokuwapo katika Kigiriki.
- source_word: ἕως ἔσω εἰς
  choice: mpaka ndani ya
  rationale: Inahifadhi mkazo wa mwendo uliofika ndani ya eneo la ua, si tu mpaka kwenye mpaka wake.
- source_word: αὐλήν
  choice: ua
  rationale: Katika muktadha huu ni eneo la wazi lililozungukwa ndani ya makao ya kuhani mkuu; 'ua' ni neno la kawaida na sahihi.
- source_word: ἀρχιερέως
  choice: kuhani mkuu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa cheo hiki katika simulizi la mateso ya Yesu.
- source_word: ἦν συγκαθήμενος
  choice: Alikuwa ameketi pamoja
  rationale: Muundo huu unaonyesha hali iliyokuwa ikiendelea katika mandhari, na 'pamoja' huhifadhi wazo la σύν.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: pamoja na watumishi
  rationale: ὑπηρέται ni wahudumu au maafisa wa chini waliokuwa wakitekeleza maagizo. 'Watumishi' ni pana vya kutosha bila kuwafanya lazima kuwa watumwa wa nyumbani au walinzi pekee.
- source_word: θερμαινόμενος
  choice: akijipasha moto
  rationale: Ni usemi wa asili wa Kiswahili kwa kitendo cha mtu kujitia joto karibu na moto.
- source_word: πρὸς τὸ φῶς
  choice: kando ya moto
  rationale: Ingawa φῶς kwa msingi ni 'mwanga,' katika mazingira haya Petro anajipasha moto, hivyo mwanga unaotajwa unatokana na moto. Tafsiri kuu inaweka wazi mandhari, huku tanbihi ikihifadhi usemi halisi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zinatunza mpangilio wa tukio na kuepuka sentensi ndefu isiyo ya lazima. Usemi 'akijipasha moto kando ya moto' una urudiaji mdogo lakini ni wa kawaida na wazi katika Kiswahili.
