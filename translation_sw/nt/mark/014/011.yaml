  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: sw
  text: Waliposikia hayo, wakafurahi na kumwahidi kumpa fedha[a]. Naye akaanza kutafuta jinsi ya kumsaliti[b] wakati unaofaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madini ya fedha.” Neno la Kigiriki linaweza kumaanisha fedha halisi au pesa kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “kumkabidhi.” Kitenzi cha Kigiriki kinaweza kumaanisha kumkabidhi au kumtia mtu mikononi mwa wengine; hapa “kumsaliti” linaonyesha muktadha wa hila unaomhusu Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kirai hiki kinaonyesha wakati na mwitikio wa makuhani wakuu kwa yale yaliyotangulia. “Hayo” linaongezwa kwa kawaida ya Kiswahili ili kukamilisha maana inayodokezwa na muktadha.
- source_word: ἐχάρησαν
  choice: wakafurahi
  rationale: Kitenzi hiki kinaeleza furaha yao kama mwitikio wa moja kwa moja; “wakafurahi” ni cha asili na chenye nguvu katika simulizi la Kiswahili.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: kumwahidi kumpa fedha
  rationale: ἐπαγγέλλομαι ni kuahidi au kujifunga kutoa kitu. “Fedha” hapa ni neno la kawaida kwa pesa, huku pia likihifadhi uhusiano wa neno la Kigiriki na madini ya fedha.
- source_word: ἀργύριον
  choice: fedha
  rationale: Neno la Kigiriki linaweza kumaanisha madini ya fedha au pesa. “Fedha” linaweza kubeba maana zote mbili kwa Kiswahili bila kudai kiasi au aina ya sarafu ambayo Marko hajaitaja.
- source_word: ἐζήτει
  choice: akaanza kutafuta
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoanza na kuendelea; “akaanza kutafuta” linafaa kwa mpito wa simulizi baada ya ahadi hiyo.
- source_word: πῶς
  choice: jinsi ya
  rationale: πῶς linauliza namna au njia ya kutekeleza tendo. “Jinsi ya” ni usemi wa asili wa Kiswahili katika muundo huu.
- source_word: εὐκαίρως
  choice: wakati unaofaa
  rationale: Kielezi hiki kinamaanisha katika nafasi au wakati wenye kufaa. Tafsiri hii huhifadhi wazo la kupanga wakati bila kuongeza sababu ambayo mstari hautaji.
- source_word: παραδοῖ
  choice: kumsaliti
  rationale: παραδίδωμι kwa msingi ni kumkabidhi mtu, lakini katika muktadha wa Yuda kushirikiana kwa hila na wapinzani wa Yesu, “kumsaliti” huwasilisha nguvu ya kimuktadha. Maana ya msingi imewekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya παραδίδωμι katika tendo la Yuda
  choice: kumsaliti
  alternative: kumkabidhi
  rationale: Muktadha wa karibu unaonyesha si makabidhiano ya kawaida bali tendo la hila dhidi ya Yesu. Hata hivyo, kwa kuwa kitenzi chenyewe kinaweza kumaanisha “kumkabidhi,” uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Muundo wa vitenzi mfululizo “waliposikia… wakafurahi… akaanza” huhifadhi mwendo wa simulizi. Kila tanbihi imewekewa alama katika matini kuu.
