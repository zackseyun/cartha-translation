base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: sw
  text: Kweli, nawaambia, mahali popote ulimwenguni kote ambako habari njema[a] itatangazwa, jambo alilofanya mwanamke huyu litasemwa pia kwa ukumbusho wa mwanamke huyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “injili.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kama ukumbusho wa mwanamke huyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Hutanguliza tamko zito na lenye mamlaka. “Kweli” huwasilisha nguvu yake kwa Kiswahili cha kawaida bila kuacha neno la Kiebrania/Kiaramu bila kutafsiriwa.
- source_word: δὲ
  choice: '[halikutajwa wazi]'
  rationale: Ni kiunganishi chepesi cha mazungumzo; mtiririko wa sentensi ya Kiswahili hauhitaji kiunganishi cha wazi hapa.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Huhifadhi usemi wa moja kwa moja kwa wasikilizaji kwa lugha ya asili na yenye uzito.
- source_word: ὅπου ἐὰν
  choice: popote
  rationale: Muungano huu huonyesha mahali popote bila kup限定isha; “popote” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: κηρυχθῇ
  choice: itakapotangazwa
  rationale: Kitenzi kina maana ya kutangaza hadharani. Chaguo hili halifungi tendo hilo kwenye mahubiri rasmi pekee.
- source_word: τὸ εὐαγγέλιον
  choice: habari njema
  rationale: Hutoa maana ya msingi ya neno la Kigiriki kwa lugha inayoeleweka kwa urahisi; istilahi ya jadi “injili” imehifadhiwa katika tanbihi.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: katika ulimwengu wote
  rationale: Huwasilisha upeo mpana wa ulimwengu mzima kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: pia
  rationale: Huonyesha kwamba kusimuliwa kwa tendo la mwanamke kutaambatana na kutangazwa kwa habari njema.
- source_word: ὃ ἐποίησεν αὕτη
  choice: jambo alilofanya mwanamke huyu
  rationale: Kiwakilishi cha kuonyesha ni cha kike na humrejelea mwanamke katika muktadha wa karibu; kumtaja wazi kunasaidia uelewekaji.
- source_word: λαληθήσεται
  choice: litasimuliwa
  rationale: Wakati ujao wa kutendwa unaonyesha kwamba tendo lake litasemwa au kusimuliwa baadaye. “Litasimuliwa” ni ya asili kwa jambo lililofanywa.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: kuwa ukumbusho wake
  rationale: Huhifadhi wazo la ukumbusho bila kulifanya moja kwa moja kuwa amri ya kumheshimu; pia huhifadhi kwa kadiri inayowezekana muundo wa nomino wa Kigiriki.
theological_decisions:
- issue: Tafsiri ya εὐαγγέλιον katika kauli kuhusu kutangazwa kwake ulimwenguni kote
  choice: habari njema
  alternative: injili
  rationale: “Habari njema” huonyesha maana ya msingi na kueleweka kwa wasomaji wa kawaida, huku “injili,” istilahi iliyozoeleka katika Ukristo, ikitolewa kama tafsiri mbadala bila kuingiza msimamo wa kimadhehebu.
- issue: Kumtambulisha αὕτη wazi kuwa mwanamke
  choice: mwanamke huyu
  alternative: huyu / yeye
  rationale: Umbo la Kigiriki ni la kike na muktadha unamtambulisha mwanamke huyo. Ufafanuzi huu huondoa utata wa Kiswahili bila kuongeza dai la kiteolojia.
- issue: Maana ya εἰς μνημόσυνον αὐτῆς
  choice: kuwa ukumbusho wake
  alternative: ili akumbukwe
  rationale: Muundo uliochaguliwa huhifadhi nomino “ukumbusho” na hali fulani ya kutokuwa wazi ikiwa usemi huo unaeleza kusudi au matokeo, badala ya kuamua kimya kimya kuwa ni kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha uzito wa tamko la Yesu na upeo wa kutangazwa ulimwenguni kote bila kutumia msamiati wa kimadhehebu.
