base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: sw
  text: “Mmesikia kufuru hiyo. Mnaonaje?[a]” Wote wakamhukumu kuwa anastahili kifo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Inaonekana vipi kwenu?”
    reason: lexical_alternative
  - marker: b
    text: Au “kuwa ana hatia ya kifo,” “kuwa anawajibika kwa kifo,” au “kuwa anastahili kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Mmesikia
  rationale: Kauli ya wakati uliopita inaelekeza kwenye jambo walilokuwa wametoka kulisikia; hali timilifu ya Kiswahili huwasilisha kwa kawaida uhusiano huo na wakati wa sasa.
- source_word: τῆς βλασφημίας
  choice: kufuru hiyo
  rationale: ‘Kufuru’ huhifadhi uzito wa kidini na kisheria wa shtaka, huku ‘hiyo’ ikitaja maneno maalumu waliyokuwa wametoka kuyasikia.
- source_word: τί ὑμῖν φαίνεται
  choice: Mnaonaje?
  rationale: Hii ni njia ya kawaida na ya moja kwa moja ya Kiswahili ya kuomba maoni au uamuzi; haiongezi neno la wazi la ‘hukumu’ ambalo halimo katika Kigiriki.
- source_word: πάντες
  choice: Wote
  rationale: Huhifadhi msisitizo wa maandishi kwamba wote waliotoa uamuzi walikubaliana.
- source_word: κατέκριναν
  choice: wakamhukumu
  rationale: Kitenzi hiki kina maana ya kimahakama ya kutoa hukumu dhidi ya mtu; ‘wakamhukumu’ ni wazi na cha kawaida katika Kiswahili.
- source_word: ἔνοχον εἶναι θανάτου
  choice: kuwa anastahili kufa
  rationale: Huwasilisha maana ya kuwa chini ya hukumu ya kifo au kustahili kifo bila kutumia tungo ngumu isiyo ya kawaida ya ‘kuwa na hatia ya kifo.’
theological_decisions:
- issue: Shtaka la βλασφημία katika muktadha wa kesi
  choice: kufuru
  alternative: maneno ya kukufuru
  rationale: Tafsiri inawasilisha shtaka la baraza bila kulifanya kuwa uthibitisho wa msimulizi kwamba shtaka hilo lilikuwa la haki; neno rasmi ‘kufuru’ huhifadhi uzito na mvutano wa kitheolojia.
- issue: Maana ya ἔνοχον εἶναι θανάτου
  choice: anastahili kufa
  alternative: ana hatia inayostahili kifo
  rationale: Chaguo hili huhifadhi uamuzi wao kwamba Yesu alistahili kifo bila kubainisha zaidi ya maandishi aina au utaratibu wa adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mazungumzo yamewekwa katika mtindo wa kawaida, huku istilahi za kesi na uzito wa shtaka la kidini vikihifadhiwa.
