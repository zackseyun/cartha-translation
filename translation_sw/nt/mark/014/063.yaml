  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: sw
  text: Ndipo kuhani mkuu akararua mavazi yake[a], akasema[b], “Tuna haja gani tena ya mashahidi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kanzu zake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinatumia wakati wa sasa wa kihistoria: “anasema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili kwa mwenye cheo hicho cha pekee aliyeongoza usikilizaji huu.
- source_word: διαρρήξας
  choice: akararua
  rationale: Kitenzi hiki kinaonyesha kitendo cha kuyachanua mavazi kwa kuyararua; ‘akararua’ ni cha kawaida, wazi, na kinafaa katika simulizi.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: mavazi yake
  rationale: Ingawa χιτών inaweza kumaanisha hasa kanzu, hapa wingi ‘mavazi’ unasikika kwa uasilia na hauongezi dhana kwamba yalikuwa mavazi rasmi ya ibada.
- source_word: λέγει
  choice: akasema
  rationale: Kigiriki kinatumia wakati wa sasa wa kihistoria, lakini wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: Tuna haja gani tena
  rationale: Muundo huu wa kawaida unadumisha swali pamoja na maana ya ἔτι kwamba mashahidi zaidi hawahitajiki.
- source_word: μαρτύρων
  choice: ya mashahidi
  rationale: Baada ya ‘haja,’ kiunganishi ‘ya’ kinaeleza kwa ufasaha kile kinachodaiwa kutohitajika.
theological_decisions:
- issue: Maana ya kuhani mkuu kurarua mavazi yake
  choice: Kitendo chenyewe kimesimuliwa bila kufafanuliwa kuwa ishara ya huzuni, ghadhabu, au shtaka la kukufuru.
  alternative: Kueleza wazi kwamba aliyararua kwa ghadhabu kwa sababu aliona maneno ya Yesu kuwa kufuru.
  rationale: Mstari unasimulia kitendo na swali lake, lakini hauelezi moja kwa moja maana ya ishara hiyo; tafsiri haipaswi kuamua kimya-kimya mvutano huo wa kisimulizi na kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni wa kawaida kwa wasomaji wengi, huku ‘mavazi’ ukidumisha wingi wa Kigiriki bila kubainisha kupita kiasi aina ya vazi.
