  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: sw
  text: Lakini mmoja wa wale waliokuwa wamesimama karibu alichomoa upanga wake, akampiga mtumwa[a] wa kuhani mkuu na kumkata sikio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki δοῦλος linaweza kumaanisha mtumwa au mtumishi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Lakini mmoja
  rationale: Muundo huu unamtambulisha mtu mmoja asiyeainishwa kutoka katika kundi; “lakini” linaakisi δέ kama kiunganishi chenye utofautishaji mdogo katika simulizi.
- source_word: τῶν παρεστηκότων
  choice: wa wale waliokuwa wamesimama karibu
  rationale: Huhifadhi maana ya watu waliokuwa wamesimama hapo karibu, badala ya kusema tu kwamba walikuwapo.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: alichomoa upanga wake
  rationale: Katika muktadha wa silaha, σπάομαι humaanisha kuichomoa; kimilikishi “wake” ni cha kawaida katika Kiswahili ingawa Kigiriki kina kibainishi.
- source_word: ἔπαισεν
  choice: akampiga
  rationale: Ni kitenzi cha kawaida na chenye nguvu ya kutosha kueleza pigo la silaha bila kutumia lugha ya kizamani.
- source_word: τὸν δοῦλον
  choice: mtumwa
  rationale: δοῦλος hapa huonyesha hadhi ya mtu aliyekuwa chini ya mamlaka ya kuhani mkuu; “mtumwa” huhifadhi uhalisi huo wa kijamii kuliko “mtumishi.”
- source_word: τοῦ ἀρχιερέως
  choice: wa kuhani mkuu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha uhusiano unaoonyeshwa na hali ya umilikishi katika Kigiriki.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: kumkata sikio
  rationale: Katika muktadha wa pigo la upanga, ἀφαιρέω inaonyesha kwamba sikio lilikatwa na kuondolewa. “Kumkata sikio” ni usemi wa kawaida wa Kiswahili; umbo dogo ὠτάριον halihitaji kutafsiriwa kama “sikio dogo,” wala Marko hataji sikio la kulia.
theological_decisions:
- issue: Utafsiri wa δοῦλος katika muktadha wa hadhi ya kijamii
  choice: mtumwa
  alternative: mtumishi
  rationale: Uhusiano wa utegemezi na mamlaka unaonekana katika kutajwa kwake kuwa wa kuhani mkuu. “Mtumwa” huhifadhi maana inayowezekana ya hali ya kufungwa, huku tanbihi ikionyesha tafsiri mbadala isiyo kali zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “alichomoa ... akampiga ... na kumkata” unasimulia matendo kwa njia ya asili na wazi.
