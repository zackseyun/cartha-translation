lexical_decisions:
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati wa sasa umetumiwa ili kuhifadhi wakati wa sasa wa kihistoria unaoupa usimulizi wa Marko uhai.
- source_word: Περίλυπός
  choice: ina huzuni kubwa sana
  rationale: Kirai hiki kinaeleza huzuni au dhiki kali kwa Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: ψυχή
  choice: nafsi
  rationale: “Nafsi” huhifadhi rejeo la maisha ya ndani au utu mzima wa Yesu bila kulifanya neno kuwa “uhai” pekee.
- source_word: ἕως θανάτου
  choice: hata kufa
  rationale: Huhifadhi usemi wenye nguvu unaoonyesha huzuni iliyofikia mpaka wa kifo, bila kuamua ikiwa ni maelezo ya ukali au ya matokeo yanayoweza kutokea.
- source_word: μείνατε
  choice: kaeni
  rationale: Katika muktadha huu “kaeni hapa” ni agizo la kawaida na la wazi la kubaki mahali hapo.
- source_word: ὧδε
  choice: hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha mahali.
- source_word: γρηγορεῖτε
  choice: mkeshe
  rationale: “Kesha” linaweza kumaanisha kutolala na pia kuwa macho na makini, hivyo huhifadhi upana wa agizo hilo.
theological_decisions:
- issue: Maana ya ψυχή katika kauli ya Yesu
  choice: nafsi
  alternative: utu wangu; maisha yangu
  rationale: “Nafsi” huhifadhi kina cha mateso ya ndani ya Yesu na ubinadamu wake halisi bila kuingiza ufafanuzi wa kimadhehebu kuhusu muundo wa mwanadamu.
- issue: Nguvu ya γρηγορεῖτε
  choice: mkeshe
  alternative: msilale; muwe macho
  rationale: Tafsiri hii inahifadhi uwezekano wa agizo kuhusu kutolala kihalisi na pia kuwa macho kwa uangalifu, bila kulifungia katika maana moja tu.
- issue: Nguvu ya ἕως θανάτου
  choice: hata kufa
  alternative: kufikia hatua ya kufa
  rationale: Usemi mfupi huhifadhi mvutano wa Kigiriki kati ya huzuni kali mno na huzuni inayofikia mpaka wa kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. “Naye anawaambia” huhifadhi wakati wa sasa wa kihistoria wa Marko, na “mkeshe” hudumisha maana mbili za kutolala na kuwa macho kwa uangalifu.
