  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: sw
  text: Naye, baada ya kwenda mbele kidogo[a], akaanguka chini, akawa akiomba kwamba, ikiwezekana, saa hiyo impitie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amesonga mbele kidogo.”
    reason: Mbadala huu unaonyesha kwa uwazi zaidi hali ya tendo tangulizi katika kirai cha Kigiriki.
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: baada ya kwenda mbele kidogo
  rationale: Muundo huu unaonyesha kwamba alisogea umbali mfupi mbele ya wengine, huku ukihifadhi uhusiano wa tendo la awali na tendo kuu kwa Kiswahili cha kawaida.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: akaanguka chini
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali isiyotimilika, hapa kinaweza kueleza kuanza au kuonekana kwa tendo katika simulizi. 'Akaanguka chini' ni usemi wa kawaida unaoonyesha mwendo wa kuanguka mpaka ardhini bila kuongeza kwamba alianguka kifudifudi.
- source_word: προσηύχετο
  choice: akawa akiomba
  rationale: Muundo wa kuendelea unahifadhi hali ya tendo linaloendelea katika kitenzi cha Kigiriki. 'Kuomba' katika muktadha huu humaanisha kumwomba Mungu na pia huunganika kwa kawaida na maudhui yanayofuata.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa ἵνα inaleta maudhui ya ombi, ingawa inaweza pia kuwa na kivuli cha kusudi. 'Kwamba' ni ya asili katika Kiswahili na haiimarishi kupita kiasi maana ya kusudi.
- source_word: εἰ δυνατόν ἐστιν
  choice: ikiwezekana
  rationale: Usemi huu wa kawaida unadumisha sharti na uwezekano ulio katika Kigiriki bila kuufanya kuwa kauli ya uhakika.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: saa hiyo impitie
  rationale: '''Saa'' imehifadhiwa ili kubaki na uzito wa usemi wa kimakusudi kuhusu wakati uliowekwa, na ''impitie'' huwasilisha wazo la kupita mbali naye bila kufafanua zaidi jambo linalokusudiwa.'
theological_decisions:
- issue: Maana ya ἡ ὥρα, ‘saa hiyo’
  choice: Kuhifadhi usemi ‘saa hiyo’ bila kuufafanua kama mateso au kifo cha Yesu.
  alternative: wakati huo; wakati wa mateso
  rationale: Usemi huo una uzito wa kisimulizi na kiteolojia katika Marko. Kuuhifadhi kunaruhusu muktadha kueleza maana yake na hakumalizi mvutano wa andiko kwa ufafanuzi ulioongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia mtiririko wa kawaida wa simulizi, imehifadhi hali ya kuendelea kwa ombi, na haijaongeza kwamba Yesu alianguka kifudifudi.
