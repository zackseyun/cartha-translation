  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: sw
  text: Nao wote wakamwacha, wakakimbia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza moja kwa moja simulizi la kukamatwa kwa Yesu bila kuongeza maana ya wakati au matokeo.
- source_word: ἀφέντες
  choice: wakamwacha
  rationale: Katika muktadha huu kitenzi ἀφίημι humaanisha kumwacha mtu nyuma. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kwamba kumwacha kulitangulia kukimbia kwao.
- source_word: αὐτὸν
  choice: -mw-
  rationale: Kiambishi cha yambwa katika “wakamwacha” kinamrejelea Yesu kwa uwazi kutokana na muktadha.
- source_word: ἔφυγον
  choice: wakakimbia
  rationale: Kitenzi φεύγω hapa kinaonyesha kukimbia kutoka hatarini. “Wakakimbia” ni tafsiri fupi, ya kawaida, na inayofaa uzito wa tukio.
- source_word: πάντες
  choice: wote
  rationale: “Wote” kinahifadhi msisitizo wa Kigiriki kwamba kila mmoja wa wale waliokuwa pamoja na Yesu alimwacha na kukimbia.
theological_decisions:
- issue: Kiwango cha kuachwa kwa Yesu na wafuasi wake
  choice: Nao wote wakamwacha, wakakimbia.
  alternative: Nao wakamwacha, wote wakakimbia.
  rationale: Tafsiri inadumisha dai la wazi la maandishi kwamba wote walikimbia, bila kulipunguza wala kulipanua nje ya muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi inadumisha kasi na uzito wa simulizi la Kigiriki.
