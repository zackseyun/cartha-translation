  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: sw
  text: Kwa maana maskini mnayo siku zote pamoja nanyi, na wakati wowote mnapotaka, mnaweza kuwatendea mema; lakini mimi hamnami siku zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: siku zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwapo au kupatikana daima, na unadumisha urudiaji wa wazo hilo katika sehemu zote mbili za mstari.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza sababu ya kauli iliyotangulia bila kufafanua zaidi uhusiano wake wa kimantiki.
- source_word: τοὺς πτωχούς
  choice: maskini
  rationale: Kivumishi kilichotumika kama nomino kinarejelea watu maskini kwa ujumla; “maskini” ni kifupi, cha kawaida, na hakipunguzi maana kuwa aina moja tu ya uhitaji.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: mnao pamoja nanyi
  rationale: Huhifadhi maana ya watu hao kuwapo pamoja nao na kupatikana kwao kwa kuendelea.
- source_word: ὅταν θέλητε
  choice: wakati wowote mnapotaka
  rationale: Huwakilisha hali ya wakati usio maalumu pamoja na utashi, kwa lugha ya asili na inayoeleweka.
- source_word: δύνασθε
  choice: mnaweza
  rationale: Hueleza uwezo moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: kuwatendea mema
  rationale: Huhifadhi nahau ya kutenda kwa manufaa yao bila kuibana kuwa kutoa sadaka au msaada wa aina fulani tu.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: lakini mimi hamnami siku zote
  rationale: “Lakini” huonyesha utofauti, na “hamnami siku zote” huhifadhi wakati wa sasa na wazo la kutokuwapo pamoja nao daima bila kulibadili wazi kuwa kauli ya wakati ujao.
theological_decisions:
- issue: Uwezekano wa kuelewa kwamba Yesu anapunguza umuhimu wa kuwajali maskini
  choice: Kudumisha tofauti ya kimazingira na ya muda kati ya kupatikana kwa maskini siku zote na kutopatikana kwa Yesu siku zote, huku kauli kuhusu kuwatendea mema ikibaki wazi.
  alternative: Kutafsiri kana kwamba Yesu anakataa au anapuuza wajibu wa kuwasaidia maskini.
  rationale: Kifungu chenyewe kinathibitisha uwezo unaoendelea wa kuwatendea maskini mema. Hakisemi kwamba huduma kwao haina maana, wala hakifafanui zaidi sababu ya kutokuwapo kwa Yesu siku zote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mnao pamoja nanyi” na “hamnami” unadumisha ulinganifu wa kitenzi ἔχετε huku ukisomeka kwa kawaida. Hakuna tanbihi iliyoongezwa kwa sababu “kuwatendea mema” tayari huwasilisha nahau ya Kigiriki kwa uwazi bila uwezekano mkubwa wa kueleweka kama hisia njema tu.
