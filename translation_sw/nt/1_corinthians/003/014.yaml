lexical_decisions:
- source_word: εἴ
  choice: Ikiwa
  rationale: Hutanguliza sharti la kawaida bila kuongeza msisitizo usiokuwamo wazi katika Kigiriki.
- source_word: τινος
  choice: ya mtu yeyote
  rationale: Kiwakilishi cha umilikaji kisichotaja mtu maalumu kinaelezwa kwa Kiswahili cha kawaida kama “ya mtu yeyote.”
- source_word: τὸ ἔργον
  choice: kazi
  rationale: “Kazi” hudumisha maana pana na inafaa katika sitiari ya kujenga bila kuibana iwe tendo la maadili au huduma pekee.
- source_word: μενεῖ
  choice: itadumu
  rationale: Kitenzi cha wakati ujao kina maana ya kubaki au kuendelea kuwapo; “itadumu” kinaeleza kustahimili jaribio katika muktadha bila kutumia neno lenye maelezo mengi zaidi kama “itanusurika.”
- source_word: ὃ ἐποικοδόμησεν
  choice: aliyoijenga juu yake
  rationale: Kauli hii hudumisha maana ya kujenga juu ya kitu kilichotajwa katika muktadha, bila kuongeza nomino “msingi” ambayo haijarudiwa katika mstari huu.
- source_word: μισθὸν
  choice: thawabu
  rationale: Katika muktadha wa tathmini, “thawabu” ni ya kawaida na hudumisha wazo la malipo yanayotolewa, huku “ujira” au “malipo” yakiwa mbadala halali.
- source_word: λήμψεται
  choice: atapokea
  rationale: Huwakilisha kwa usahihi wakati ujao wa λαμβάνω kwa lugha ya kawaida na yenye hadhi.
theological_decisions:
- issue: Kitu ambacho kazi imejengwa juu yake
  choice: Kimeachwa kwa kiwakilishi “juu yake.”
  alternative: “Juu ya msingi huo”
  rationale: Kigiriki kinatumia kitenzi chenye maana ya kujenga juu ya kitu lakini hakirudii wazi nomino “msingi” katika mstari huu; tafsiri haiongezi ufafanuzi huo ingawa muktadha wa mstari wa 11 unauelekeza.
- issue: Maana ya μισθός katika hukumu ya kazi
  choice: “thawabu”
  alternative: “ujira” au “malipo”
  rationale: “Thawabu” huwasilisha fidia chanya katika muktadha huu bila kuamua kwa undani zaidi asili yake ya kitheolojia.
