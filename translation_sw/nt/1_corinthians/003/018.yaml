  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: sw
  text: Mtu yeyote asijidanganye. Ikiwa mtu yeyote miongoni mwenu anajiona kuwa mwenye hekima katika enzi hii,[a] basi na awe mpumbavu,[b] ili apate kuwa mwenye hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye hekima kwa viwango vya enzi hii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “awe mjinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Mtu yeyote asijidanganye
  rationale: Muundo huu wa Kiswahili unaonyesha katazo linalomhusu kila mtu na kudumisha wazi kitendo cha kujidanganya.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: anajiona kuwa mwenye hekima
  rationale: Katika muktadha huu δοκεῖ inaeleza tathmini ya mtu kujihusu; ‘anajiona’ ni ya kawaida na inaunganika vizuri na onyo la kutokujidanganya.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hueleza kuwa mtu huyo ni mmoja wa jumuiya ya waamini wanaozungumziwa.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: katika enzi hii
  rationale: ‘Enzi’ huhifadhi maana ya wakati na mfumo wa sasa katika αἰών bila kuipanua moja kwa moja kuwa ‘ulimwengu.’
- source_word: μωρὸς γενέσθω
  choice: na awe mpumbavu
  rationale: Huhifadhi amri na fumbo la Paulo kwa lugha ya kawaida; nomino ‘mpumbavu’ pia hudumisha nguvu ya prediketi ya Kigiriki.
- source_word: ἵνα γένηται σοφός
  choice: ili apate kuwa mwenye hekima
  rationale: Huhifadhi kishazi cha kusudi na utofautishaji wa kimakusudi kati ya kuwa mpumbavu na kuwa mwenye hekima.
theological_decisions:
- issue: Maana ya αἰών katika utofautishaji wa Paulo
  choice: katika enzi hii
  alternative: katika ulimwengu huu; kwa viwango vya enzi hii
  rationale: ‘Enzi hii’ huhifadhi maana ya kitheolojia na ya wakati ya mfumo wa sasa. Uwezekano wa kuelewa maneno hayo kuwa viwango vya enzi hii umeonyeshwa katika tanbihi bila kuingizwa kimya katika matini.
- issue: Fumbo la kuwa mpumbavu ili kuwa mwenye hekima
  choice: na awe mpumbavu, ili apate kuwa mwenye hekima
  alternative: na aonekane mpumbavu; na akubali kuitwa mpumbavu
  rationale: Matini haisemi tu kuonekana au kuitwa mpumbavu; inatumia γενέσθω mara mbili. Tafsiri inadumisha mkazo wa ‘kuwa’ bila kueleza mapema namna ya kitheolojia ya upumbavu huo.
- issue: Rejeo la mtu mmoja lenye matumizi ya jumla
  choice: mtu yeyote ... anajiona ... awe ... apate
  alternative: watu ... wanajiona ... wawe
  rationale: Kiswahili kinaweza kuhifadhi umoja wa Kigiriki kwa njia ya kawaida bila kuweka alama ya jinsia, huku matumizi ya jumla yakibaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mwenye hekima’ na ‘mpumbavu’ huhifadhi utofautishaji mkali wa mstari. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
