  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: sw
  text: Kwa maana bado ninyi ni wa kimwili. Kwa maana, miongoni mwenu kuna wivu na ugomvi, je, ninyi si wa kimwili na mnaenenda kwa namna ya kibinadamu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama wanadamu wa kawaida.”
    reason: Mbadala huu unaweka wazi maana ya kauli κατὰ ἄνθρωπον kwa lugha ya kawaida zaidi.
lexical_decisions:
- source_word: ἔτι
  choice: bado
  rationale: Huonyesha kwamba hali hiyo ilikuwa ikiendelea, na hivyo huhifadhi uzito wa karipio la Paulo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huhifadhi kazi ya chembe hii ya kutoa sababu au maelezo katika vifungu vyote viwili.
- source_word: σαρκικοί
  choice: wa kimwili
  rationale: Huhifadhi uhusiano wa neno hili na σάρξ (mwili) bila kulipanua kwa tafsiri ya kiteolojia kama ‘wanaotawaliwa na asili ya dhambi.’
- source_word: ὅπου
  choice: ikiwa kuna
  rationale: Katika Kiswahili cha kawaida, muundo huu unaeleza kwa asili kwamba kuwapo kwa wivu na ugomvi ni ushahidi wa hali yao; maana ya msingi ya kuwapo mahali fulani bado inadokezwa.
- source_word: ζῆλος
  choice: wivu
  rationale: Katika muktadha huu hasi pamoja na ugomvi, neno lina maana ya wivu, si bidii yenye sifa nzuri.
- source_word: ἔρις
  choice: ugomvi
  rationale: Ni neno la kawaida linalowasilisha mzozo na hali ya kutopatana bila kuifanya maana iwe finyu kupita kiasi.
- source_word: οὐχὶ
  choice: je, ninyi si
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: κατὰ ἄνθρωπον
  choice: kwa namna ya kibinadamu
  rationale: Huwasilisha mwenendo unaofuata namna ya kawaida ya mwanadamu huku ukihifadhi mvutano wa usemi wa Kigiriki bila kuongeza maelezo ya kiteolojia.
- source_word: περιπατεῖτε
  choice: kuenenda
  rationale: Huhifadhi sitiari ya Paulo ya kutembea au kuenenda kama picha ya mwenendo wa maisha, kwa lugha yenye hadhi na inayoeleweka.
theological_decisions:
- issue: Tafsiri ya lugha inayohusiana na σάρξ katika σαρκικοί
  choice: wa kimwili
  alternative: wa kidunia; wanaotawaliwa na asili ya dhambi
  rationale: ‘Wa kimwili’ hudumisha picha ya mwili iliyomo katika Kigiriki na haingizi hitimisho maalumu kuhusu ‘asili ya dhambi’ lisilotajwa moja kwa moja katika mstari.
- issue: Tafsiri ya κατὰ ἄνθρωπον
  choice: kwa namna ya kibinadamu
  alternative: kama wanadamu wa kawaida; kwa viwango vya kibinadamu
  rationale: Uchaguzi huu ni wa kawaida katika Kiswahili na unaacha wazi upana wa tofauti kati ya mwenendo wao na maisha yanayopaswa kuongozwa na Roho, bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuenenda’ limetumiwa kwa makusudi kuhifadhi sitiari ya Kigiriki, huku ‘kwa namna ya kibinadamu’ ikifanya sentensi ibaki wazi kwa msomaji wa kawaida.
