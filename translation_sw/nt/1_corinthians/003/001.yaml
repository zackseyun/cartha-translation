id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: sw
  text: Nami, ndugu[a], sikuweza kusema nanyi kama watu wa kiroho, bali kama watu wa mwili, kama watoto wachanga katika Masihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina umbo la wingi wa kiume, lakini katika muktadha huu linaweza kuwahusu ndugu wa kiume na wa kike.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Nami
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi kiunganishi καί pamoja na msisitizo wa kiwakilishi ἐγώ bila kutia msisitizo kupita kiasi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni mwito wa kawaida na wenye heshima kwa waumini; katika Kiswahili unaweza kuwahusu wanaume na wanawake, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: οὐκ ἠδυνήθην
  choice: sikuweza
  rationale: Inawasilisha moja kwa moja kutoweza kulikotajwa na kitenzi cha Kigiriki katika wakati uliopita.
- source_word: λαλῆσαι ὑμῖν
  choice: kusema nanyi
  rationale: Ni Kiswahili cha kawaida kinachodumisha maana ya kusema au kuzungumza na watu wanaoelekezewa maneno.
- source_word: πνευματικοῖς
  choice: watu wa kiroho
  rationale: Kivumishi hiki kimetumika kama nomino; kuongeza ‘watu’ huifanya sentensi iwe wazi na ya asili.
- source_word: σαρκίνοις
  choice: watu wa mwili
  rationale: Inahifadhi uhusiano wa moja kwa moja na σάρξ, ‘mwili/nyama,’ na kuepuka tafsiri yenye hukumu zaidi kama ‘watu wa dunia’ au ‘wenye asili ya dhambi.’
- source_word: νηπίοις
  choice: watoto wachanga
  rationale: Inadumisha sitiari ya uchanga na kutokomaa kwa uwazi na kwa lugha yenye hadhi.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός ni cheo chenye maana ya Masihi; ‘katika’ pia huhifadhi kwa karibu uhusiano unaoonyeshwa na ἐν.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Tafsiri kuu inaonyesha maana ya cheo Χριστός badala ya kukichukulia tu kama jina, huku mbadala uliozoeleka ukiwekwa katika tanbihi.
- issue: Maana ya σαρκίνοις katika tofauti na πνευματικοῖς
  choice: watu wa mwili
  alternative: watu wa kidunia
  rationale: ‘Watu wa mwili’ huhifadhi mvutano na ‘watu wa kiroho’ bila kuamua kimbele kwamba Paulo anamaanisha tu mwenendo wa kidunia au ‘asili ya dhambi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nami’ na ‘sikuweza’ ni miundo ya kawaida; ‘watu wa mwili’ imechaguliwa ili kuhifadhi lugha halisi na mvutano wa Paulo bila kuingiza ufafanuzi wa kimadhehebu.
