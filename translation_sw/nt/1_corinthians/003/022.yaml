id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: sw
  text: iwe ni Paulo, au Apolo, au Kefa, au ulimwengu, au uzima, au kifo, au mambo ya sasa, au mambo yajayo—yote ni yenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: iwe ni … au
  rationale: Muundo huu wa Kiswahili unahifadhi mfululizo wa chaguzi wa Kigiriki kwa njia ya asili; baada ya mwanzo, kurudia “au” kunatosha kuendeleza mtiririko.
- source_word: Παῦλος
  choice: Paulo
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: Ἀπολλῶς
  choice: Apolo
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: Linahifadhi jina la Kisemiti lililotumiwa katika maandishi ya Kigiriki badala ya kulibadilisha kuwa Petro.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida na pana inayoweza kumaanisha ulimwengu au mpangilio wake katika hoja hii.
- source_word: ζωή
  choice: uzima
  rationale: “Uzima” ni nomino ya kawaida na yenye hadhi inayolingana moja kwa moja na ζωή katika jozi yake na kifo.
- source_word: θάνατος
  choice: kifo
  rationale: Ni kisawe cha moja kwa moja na cha kawaida cha θάνατος.
- source_word: ἐνεστῶτα
  choice: mambo ya sasa
  rationale: Kivumishi-tendo hiki kimetumika kama nomino na kinarejelea hali au mambo yaliyopo sasa.
- source_word: μέλλοντα
  choice: mambo yajayo
  rationale: Kivumishi-tendo hiki kimetumika kama nomino na kinarejelea mambo ya wakati ujao; usemi huu unaendana vizuri na “mambo ya sasa.”
- source_word: πάντα
  choice: yote
  rationale: Baada ya orodha yenye watu na mambo, “yote” huhifadhi nguvu ya ujumla bila kuongeza nomino isiyokuwamo wazi.
- source_word: ὑμῶν
  choice: ni yenu
  rationale: Huwasilisha umilikaji unaoonyeshwa na hali ya genitivi kwa Kiswahili cha moja kwa moja; “yenu” ni wingi kwa sababu Paulo anawahutubia Wakorintho kwa pamoja.
theological_decisions:
- issue: Maana ya madai kwamba vitu na watu wote ni wa waamini
  choice: yote ni yenu
  alternative: yote ni kwa manufaa yenu
  rationale: Tafsiri inahifadhi dai fupi na lenye mvutano la umilikaji katika Kigiriki, bila kulifafanua kimafundisho kuwa linamaanisha manufaa au mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano mfupi na alama ya mkato mrefu huhifadhi msisitizo wa kilele cha sentensi ya Paulo.
