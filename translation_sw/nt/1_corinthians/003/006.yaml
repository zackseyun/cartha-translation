  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: sw
  text: Mimi nilipanda, Apolo akatia maji, lakini Mungu ndiye aliyekuwa akisababisha ukuaji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina mkazo wa kulinganisha kazi ya Paulo na ya Apolo; “Mimi” kinauhifadhi kwa njia ya kawaida katika Kiswahili.
- source_word: ἐφύτευσα
  choice: nilipanda
  rationale: Kinadumisha moja kwa moja mfano wa kilimo na kinaendana na kitendo kinachofuata cha kutia maji.
- source_word: Ἀπολλῶς
  choice: Apolo
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: ἐπότισεν
  choice: akatia maji
  rationale: Ni usemi wa kawaida na ulio wazi kwa kumpa mmea maji, huku ukiendeleza mfano wa kilimo.
- source_word: ἀλλὰ
  choice: lakini
  rationale: Kinaonyesha kwa uwazi tofauti yenye nguvu kati ya kazi za watumishi na tendo la Mungu.
- source_word: ὁ θεὸς
  choice: Mungu ndiye
  rationale: “Ndiye” kinaonyesha mkazo wa Mungu kuwa mtendaji mkuu katika tofauti hii bila kuongeza fundisho lisilokuwamo katika maandishi.
- source_word: ηὔξανεν
  choice: aliyekuwa akikuza
  rationale: Muundo huu unahifadhi hali ya tendo lililokuwa likiendelea katika wakati uliopita ya kitenzi cha Kigiriki na unaonyesha kwamba Mungu alikuwa akisababisha ukuaji.
theological_decisions:
- issue: Utendaji wa Mungu ukilinganishwa na huduma ya wanadamu
  choice: Paulo alipanda na Apolo akatia maji, lakini Mungu ndiye aliyekuwa akisababisha ukuaji.
  alternative: lakini Mungu alikuza / alifanya kikue
  rationale: Tafsiri inadumisha kwa pamoja uhalisi wa kazi ya watumishi na nafasi ya Mungu kama chanzo cha ukuaji, bila kufuta mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida; mfano wa kilimo na mkazo wa viima tofauti umehifadhiwa.
