  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kigiriki: wahusika wawili wa sitiari ya kilimo wanaelezwa kuwa wamoja, na kila mmoja atapokea thawabu inayolingana na taabu yake binafsi. Msisitizo unaorudiwa wa ἴδιον umehifadhiwa kwa “yake mwenyewe.”'
