id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: sw
  text: Apandaye na atiaye maji ni wamoja[a], lakini kila mmoja atapokea thawabu yake mwenyewe kulingana na taabu yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wameungana,” au “wana kusudi moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: apandaye
  rationale: Kitenzi-jina chenye kibainishi kimetafsiriwa kwa umbo la Kiswahili linalomtaja mtu anayefanya tendo, huku sitiari ya kilimo ikihifadhiwa.
- source_word: ποτίζων
  choice: atiaye maji
  rationale: Hili ni fumbo la kawaida na linaloeleweka kwa mtu anayemwagilia mimea, nalo linahifadhi ulinganifu na apandaye.
- source_word: ἕν
  choice: ni wamoja
  rationale: Kauli hii fupi huhifadhi wazo la umoja bila kudai kwamba wahudumu hao ni mtu yuleyule; tanbihi inaonyesha maana zinazowezekana katika muktadha.
- source_word: μισθὸν
  choice: thawabu
  rationale: Neno hili linaonyesha malipo yanayotolewa kwa kazi bila kuyafunga kwenye mshahara wa fedha pekee.
- source_word: λήμψεται
  choice: atapokea
  rationale: Wakati ujao wa Kigiriki umeonyeshwa kwa wakati ujao wa kawaida na wa asili katika Kiswahili.
- source_word: κατὰ
  choice: kulingana na
  rationale: Kauli hii inahifadhi uhusiano wa thawabu na kiwango au namna ya kazi iliyofanywa.
- source_word: κόπον
  choice: taabu
  rationale: Taabu huonyesha kazi yenye juhudi na uchovu, ambayo ndiyo nguvu ya neno la Kigiriki katika muktadha huu.
- source_word: ἴδιον
  choice: yake mwenyewe
  rationale: Kurudiwa kwa kauli hii kunahifadhi msisitizo wa Kigiriki kwamba kila mtu ana taabu na thawabu yake binafsi.
theological_decisions:
- issue: Maana ya ἕν εἰσιν, “ni wamoja”
  choice: Wapandaji na watiaji maji wana umoja katika kazi au kusudi, ingawa majukumu yao hutofautiana.
  alternative: Kauli hiyo inaweza kueleweka hasa kama usawa wao wa hadhi au kama kuwa kwao timu moja.
  rationale: Umbo la kati la ἕν linaelekeza kwenye umoja, si utambulisho wa mtu mmoja. Muktadha unapinga migawanyiko kwa kuonyesha huduma zao tofauti kuwa sehemu za kazi moja chini ya Mungu, huku kauli yenyewe ikibaki fupi na yenye upeo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa mstari unahifadhi sitiari ya kilimo, ufupi wa kauli ya Kigiriki, na msisitizo wa kurudiwa kwa “yake mwenyewe.”
