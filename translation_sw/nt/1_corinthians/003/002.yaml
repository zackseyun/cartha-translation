base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: sw
  text: Niliwanywesha maziwa[a], si chakula kigumu, kwa maana hamkuwa na uwezo bado. Lakini hata sasa bado hamna uwezo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Niliwapa maziwa ya kunywa, si chakula.”
    reason: lexical_alternative
  - marker: b
    text: “Chakula kigumu” hutafsiri neno la jumla linalomaanisha chakula; “kigumu” limetumiwa hapa kwa sababu ya utofauti wake na maziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: maziwa
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika Kiswahili, na kinahifadhi sitiari ya Paulo.
- source_word: ἐπότισα
  choice: niliwanywesha
  rationale: Kitenzi cha Kigiriki humaanisha kumpa mtu kitu anywe. Kiswahili ‘niliwanywesha maziwa’ ni cha asili na sahihi, hivyo hakuna haja ya kukibadili kuwa kitenzi cha kulisha.
- source_word: βρῶμα
  choice: chakula kigumu
  rationale: Neno lenyewe humaanisha chakula kwa ujumla, lakini ‘kigumu’ huonyesha kwa uwazi utofauti uliokusudiwa na maziwa katika Kiswahili cha sasa.
- source_word: οὔπω
  choice: bado ... hamkuwa
  rationale: Muundo huu unaonyesha kwa kawaida kwamba uwezo huo haukuwapo kufikia wakati uliotajwa.
- source_word: ἐδύνασθε
  choice: hamkuwa na uwezo
  rationale: Unahifadhi maana ya uwezo au kapasiti na wakati uliopita wa kitenzi.
- source_word: οὐδὲ ἔτι νῦν
  choice: hata sasa bado hamna
  rationale: ‘Hata sasa’ na ‘bado’ kwa pamoja zinahifadhi msisitizo wa hali hiyo kuendelea hadi wakati wa sasa.
- source_word: δύνασθε
  choice: hamna uwezo
  rationale: Unatoa maana ya uwezo wa sasa na kudumisha ulinganifu na ‘hamkuwa na uwezo.’
theological_decisions:
- issue: Maana ya sitiari ya lishe ya Paulo
  choice: Kudumisha sitiari ya maziwa na chakula kigumu bila kufafanua ni mafundisho gani yanayowakilishwa.
  alternative: Kutafsiri moja kwa moja kuwa ‘niliwafundisha mambo ya msingi, si mafundisho ya kina.’
  rationale: Kigiriki kinatumia sitiari na hakifafanui hapa aina za mafundisho; kuisitiri kunahifadhi uwazi na mvutano wa kifungu bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Niliwanywesha’ ni idiomu ya kawaida inayofuata kitenzi cha Kigiriki kwa karibu. Muundo wa sentensi unadumisha ulinganifu wa kutokuwa na uwezo wakati uliopita na sasa.
