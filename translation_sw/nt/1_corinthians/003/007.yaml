  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: sw
  text: Kwa hiyo, yeye apandaye si kitu, wala yeye atiaye maji, bali Mungu ndiye akuzaye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bali Mungu ndiye atoaye ukuaji”; kimapokeo, “atoaye ongezeko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ φυτεύων
  choice: yeye apandaye
  rationale: Inahifadhi umbo la kirai nomino la kauli endelevu na usambamba wa sentensi.
- source_word: ἐστίν τι
  choice: si kitu
  rationale: Ni tafsiri ya karibu ya nahau ya Kigiriki na inaeleweka katika muktadha kuwa mtendaji wa kibinadamu si chanzo cha ukuaji.
- source_word: ὁ ποτίζων
  choice: yeye atiaye maji
  rationale: Inadumisha usambamba na 'yeye apandaye' huku ikitumia Kiswahili cha kawaida.
- source_word: ἀλλ’
  choice: bali
  rationale: Inaonyesha kwa nguvu tofauti kati ya watumishi wa kibinadamu na Mungu.
- source_word: ὁ αὐξάνων
  choice: ndiye akuzaye
  rationale: Inamweleza Mungu kuwa mtendaji anayesababisha ukuaji, bila kuongeza kitu kisichotajwa wazi katika Kigiriki.
- source_word: θεός
  choice: Mungu
  rationale: Inahifadhi nomino na mkazo wake wa kimaana; 'ndiye' huleta mkazo huo kwa Kiswahili cha asili.
