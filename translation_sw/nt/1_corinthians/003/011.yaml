  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana hakuna mtu anayeweza kuweka msingi mwingine isipokuwa ule uliokwisha kuwekwa, ambao ni Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo.”'
    reason: Tafsiri ya jadi ya Ἰησοῦς Χριστός; maandishi makuu yanatafsiri Χριστός kama cheo, ‘Masihi’.
lexical_decisions:
- source_word: θεμέλιον
  choice: msingi
  rationale: Neno hili linamaanisha msingi wa jengo na linaendeleza taswira ya Paulo ya ujenzi kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: ἄλλον
  choice: mwingine
  rationale: Huonyesha msingi mwingine au tofauti na ule uliopo.
- source_word: οὐδεὶς δύναται
  choice: hakuna mtu anayeweza
  rationale: Huhifadhi maana ya jumla kwamba hakuna yeyote mwenye uwezo au uwezekano wa kufanya hivyo.
- source_word: θεῖναι
  choice: kuweka
  rationale: Katika taswira ya ujenzi, ‘kuweka msingi’ ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: παρὰ τὸν κείμενον
  choice: isipokuwa ule uliokwisha kuwekwa
  rationale: ‘Isipokuwa’ huonyesha kwamba hakuna msingi mwingine kando ya huu; ‘uliokwisha kuwekwa’ huonyesha hali ya msingi ambao tayari upo.
- source_word: ὅς ἐστιν
  choice: ambao ni
  rationale: Kiwakilishi cha uhusiano kinarejelea ‘msingi’ na kuutambulisha wazi kuwa Yesu Masihi.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Masihi
  rationale: ‘Yesu’ ni jina, na ‘Masihi’ hutafsiri maana ya cheo Χριστός badala ya kukifanya kionekane kama jina la ukoo.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika Ἰησοῦς Χριστός
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta/Masihi; ‘Yesu Masihi’ huhifadhi nguvu yake ya kicheo, huku tafsiri ya jadi ‘Yesu Kristo’ ikitolewa katika tanbihi.
- issue: Utambulisho wa msingi
  choice: ambao ni Yesu Masihi
  alternative: yaani, Yesu Masihi
  rationale: Muundo wa kiwakilishi cha uhusiano unadumisha sarufi na msisitizo wa Kigiriki kwamba msingi uliowekwa unatambuliwa kuwa Yesu Masihi, bila kuongeza ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kuweka msingi’ ni usemi wa kawaida wa ujenzi; ‘uliokwisha kuwekwa’ huhifadhi wazo la msingi ambao tayari upo.
