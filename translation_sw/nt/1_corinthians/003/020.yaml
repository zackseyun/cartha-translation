lexical_decisions:
- source_word: καὶ πάλιν
  choice: Na tena
  rationale: Huanzisha nukuu ya pili inayounga hoja mkono, kwa Kiswahili cha kawaida na kifupi.
- source_word: Κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya κύριος katika muktadha huu wa nukuu ya Maandiko.
- source_word: γινώσκει
  choice: anajua
  rationale: Hutoa maana ya moja kwa moja ya kitenzi bila kuongeza ufafanuzi wa kiutafsiri.
- source_word: διαλογισμοὺς
  choice: mawazo
  rationale: Ni neno la kawaida linaloweza kujumuisha fikira na hoja za ndani; uwezekano wa ‘mawazo ya ndani/hoja’ umeelezwa katika tanbihi.
- source_word: τῶν σοφῶν
  choice: ya wenye hekima
  rationale: Huwakilisha kivumishi kilichotumika kama nomino bila kuweka jinsia wala kukibadili kuwa ‘wasomi’.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha maudhui ya kile Bwana anachojua, si sababu.
- source_word: μάταιοι
  choice: ni ubatili
  rationale: Huhifadhi wazo la kutokuwa na thamani, matokeo, au msingi; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Nguvu ya μάταιοι katika tathmini ya mawazo ya wenye hekima
  choice: ni ubatili
  alternative: hayana maana / ni bure
  rationale: ‘Ubatili’ huhifadhi upana wa maana ya kuwa tupu, bure, au bila matokeo bila kuamua kama mstari unalenga tu kutokuwa na maana au kutofaa kwa vitendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa nukuu umehifadhiwa; alama zote za tanbihi zimewekwa katika matini kuu.
