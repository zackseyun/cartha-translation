translation:
  language: sw
  text: Kama mtu yeyote akijenga juu ya msingi huo kwa dhahabu, fedha, mawe ya thamani, mbao, nyasi kavu, mabua,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Kama mtu yeyote
  rationale: Kishazi hiki huanzisha sharti na kuendeleza hoja kwa upole. Katika Kiswahili, “kama mtu yeyote” ni ya kawaida na inahifadhi maana ya jumla; si lazima kutafsiri δέ kwa neno tofauti hapa.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: akijenga juu ya msingi huo
  rationale: Muundo huu unaendeleza sitiari ya ujenzi. “Juu ya” huonyesha wazi kujenga kwenye msingi uliotajwa katika muktadha.
- source_word: χρυσόν
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la nyenzo hiyo.
- source_word: ἄργυρον
  choice: fedha
  rationale: Hapa “fedha” humaanisha metali ya silver, ikiwa sambamba na dhahabu katika orodha ya vifaa.
- source_word: λίθους τιμίους
  choice: mawe ya thamani
  rationale: Tafsiri hii huhifadhi maana ya mawe yenye thamani au gharama kubwa bila kuyafafanua mahsusi kuwa vito.
- source_word: ξύλα
  choice: mbao
  rationale: Katika muktadha wa ujenzi, “mbao” ni neno la kawaida na la asili kuliko jina la jumla “miti.”
- source_word: χόρτον
  choice: majani makavu
  rationale: χόρτος inaweza kumaanisha nyasi au majani; katika orodha hii ya vifaa vinavyoweza kuungua, “majani makavu” hutoa maana ya hay kwa Kiswahili cha kawaida.
- source_word: καλάμην
  choice: mabua
  rationale: Neno hili linaweza kumaanisha bua, nyasi kavu, au mabaki ya mashina baada ya mavuno. “Mabua” hutofautisha nyenzo hii na “majani makavu” na kufaa katika sitiari ya ujenzi.
