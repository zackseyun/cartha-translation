id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: sw
  text: Kwa maana hekima ya ulimwengu huu ni upumbavu mbele za Mungu. Kwa maana imeandikwa, “Yeye huwakamata wenye hekima katika hila zao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: hekima
  rationale: Neno la kawaida na lenye hadhi kwa σοφία; hapa linamaanisha ile inayodaiwa kuwa hekima ya ulimwengu.
- source_word: κόσμου τούτου
  choice: ya ulimwengu huu
  rationale: Huwasilisha maana ya kawaida ya κόσμος pamoja na utofautishaji wa utaratibu huu wa kidunia na tathmini ya Mungu.
- source_word: μωρία
  choice: upumbavu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya μωρία, na inadumisha msamiati wa Paulo katika muktadha huu.
- source_word: παρὰ τῷ θεῷ
  choice: mbele za Mungu
  rationale: παρά pamoja na dativu hapa huonyesha mtazamo au hukumu ya Mungu; Kiswahili hiki ni cha asili na hakimaanishi tu mahali halisi.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutambulisha nukuu ya Maandiko na unaakisi hali timilifu ya kitenzi cha Kigiriki.
- source_word: δρασσόμενος
  choice: huwakamata
  rationale: Hutoa wazo la kuwashika au kuwanasa; hali ya mazoea ya 'hu-' inafaa kwa kauli ya jumla katika nukuu.
- source_word: σοφοὺς
  choice: wenye hekima
  rationale: Inarejelea watu wanaohesabiwa kuwa na hekima bila kuweka jinsia isiyohitajika.
- source_word: πανουργίᾳ
  choice: hila
  rationale: Huwasilisha ujanja wenye maana hasi na usio wa uadilifu katika muktadha huu.
theological_decisions:
- issue: Kumtambua mhusika wa nukuu ya Ayubu 5:13 bila kuongeza maelezo ya kiteolojia
  choice: Yeye huwakamata wenye hekima katika hila zao
  alternative: Anayewakamata wenye hekima katika hila zao
  rationale: Kiwakilishi 'Yeye' kinafanya rejeo kwa Mungu lieleweke kwa kawaida katika Kiswahili, huku kikidumisha nguvu ya kishiriki chenye kibainishi katika Kigiriki na dai kwamba Mungu huigeuza hekima ya kibinadamu.
- issue: Maana ya evaluative ya παρὰ τῷ θεῷ
  choice: mbele za Mungu
  alternative: kwa Mungu / machoni pa Mungu
  rationale: Chaguo hili linaonyesha kuwa hekima ya ulimwengu huhukumiwa kuwa upumbavu kwa mtazamo wa Mungu, bila kupunguza mvutano wa Paulo kati ya hekima ya ulimwengu na ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unabaki karibu na Kigiriki, lakini ni wa asili katika Kiswahili. Hakuna tanbihi iliyohitajika; alama za tanbihi za safu ya Kiingereza zinaonekana kutolingana na maelezo yake na hazikulazimishwa kwenye maandishi ya Kiswahili.
