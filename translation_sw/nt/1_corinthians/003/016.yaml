base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: sw
  text: Je, hamjui kwamba ninyi ni hekalu la Mungu[a][b] na kwamba Roho wa Mungu anakaa ndani yenu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali patakatifu pa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: “Ninyi” ni wingi; Paulo analihutubia jumuiya ya waamini kwa pamoja.
    reason: cultural_note
  - marker: c
    text: Au “miongoni mwenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Inahifadhi swali la balagha la Paulo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ναὸς θεοῦ
  choice: hekalu la Mungu
  rationale: Neno ναός humaanisha hasa hekalu au mahali patakatifu penyewe; “hekalu la Mungu” ni la asili na linadumisha taswira ya mahali patakatifu.
- source_word: ἐστε
  choice: ninyi ni
  rationale: Kitenzi ni cha nafsi ya pili wingi. Kutaja “ninyi” wazi kunasaidia kuonyesha kuwa Paulo analihutubia kundi.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Roho wa Mungu
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuonyesha uhusiano huo, huku ikidumisha rejeo kwa Roho wa Mungu.
- source_word: οἰκεῖ
  choice: anakaa
  rationale: Huonyesha kukaa kunakoendelea na inalingana kwa kawaida na taswira ya hekalu.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Inadumisha maana ya msingi ya ἐν pamoja na kiwakilishi cha wingi; uwezekano wa maana “miongoni mwenu” umewekwa katika tanbihi.
theological_decisions:
- issue: Ikiwa aya inawahusu waamini mmoja mmoja au jumuiya ya kanisa kwa pamoja
  choice: Matini inasema “ninyi ni hekalu” bila kuongeza “kwa pamoja,” huku tanbihi ikibainisha kuwa “ninyi” ni wingi na Paulo anaih संबोधित?
  alternative: “Ninyi kwa pamoja ni hekalu la Mungu” au “kila mmoja wenu ni hekalu la Mungu”
  rationale: Kigiriki kina nafsi ya pili wingi na muktadha unaelekeza kwa jumuiya, lakini hakina kielezi kinacholingana moja kwa moja na “kwa pamoja.” Kwa hiyo tafsiri haiongezi wala kuibinafsisha maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Muundo wa swali la balagha na taswira ya hekalu vimehifadhiwa.
