lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya maelezo inayounganisha kauli hii na hoja iliyotangulia.
- source_word: συνεργοί
  choice: wafanyakazi wenzake
  rationale: Ni Kiswahili cha kawaida kinachoonyesha watu wanaofanya kazi pamoja bila kufafanua kupita kiasi uhusiano wao.
- source_word: θεοῦ (with συνεργοί)
  choice: Mungu
  rationale: Muundo “wafanyakazi wenzake Mungu” unasomeka hapa kuwa wafanyakazi walio wake na walio katika utumishi wake, huku uwezekano wa maana “wanaofanya kazi pamoja na Mungu” ukihifadhiwa katika tanbihi.
- source_word: γεώργιον
  choice: shamba
  rationale: Neno hili ni wazi na la kawaida, nalo linahifadhi sitiari ya kilimo.
- source_word: οἰκοδομή
  choice: jengo
  rationale: Ni tafsiri rahisi na ya kawaida inayotayarisha sitiari ya ujenzi katika mistari inayofuata.
- source_word: ἐστε
  choice: ninyi ni
  rationale: Inawakilisha wazi nafsi ya pili wingi katika Kigiriki.
theological_decisions:
- issue: Iwapo θεοῦ συνεργοί humaanisha wafanyakazi walio wa Mungu au wafanyakazi pamoja na Mungu
  choice: wafanyakazi wenzake Mungu
  alternative: wafanyakazi pamoja na Mungu
  rationale: Hali ya umilikishi katika Kigiriki inaruhusu mjadala. Muktadha unasisitiza kwamba wahudumu ni wa Mungu na wanamtumikia, huku Wakorintho wakiwa mali ya Mungu. Tanbihi inahifadhi maana nyingine inayowezekana bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “Mungu” yamehifadhiwa ili kuakisi msisitizo wa maandishi ya Kigiriki.
