  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: sw
  text: Basi, Apolo ni nini? Naye Paulo ni nini?[a] Ni watumishi[b] ambao kwa njia yao mliamini, kila mmoja kama Bwana alivyompa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, Apolo ni nani? Naye Paulo ni nani?” Kigiriki kinatumia “nini,” kikisisitiza kazi au nafasi yao badala ya utambulisho wao.
    reason: lexical_alternative
  - marker: b
    text: Au, “wahudumu.” Neno la Kigiriki linamaanisha watumishi au mawakala wa huduma; hapa si lazima limaanishe cheo rasmi cha shemasi.
    reason: lexical_alternative
  - marker: c
    text: Kifungu “kila mmoja kama Bwana alivyompa” hakitaji wazi katika Kigiriki kitu kilichotolewa. Wengine hutafsiri, “kama Bwana alivyompangia kila mmoja.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: ni nini
  rationale: Kiwakilishi cha kuuliza cha Kigiriki ni cha jinsia ya kati na hapa kinaelekeza fikira kwenye nafasi au kazi ya Apolo na Paulo, si utambulisho wao binafsi.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ huonyesha hitimisho au hatua inayofuata katika hoja kwa Kiswahili cha kawaida.
- source_word: δέ
  choice: Naye
  rationale: ‘Naye’ huendeleza ulinganisho wa Paulo na Apolo kwa njia ya kawaida bila kuingiza upinzani mkali.
- source_word: διάκονοι
  choice: watumishi
  rationale: Katika muktadha huu neno linamaanisha watu wanaotumikia au mawakala wa huduma, wala si lazima cheo rasmi cha shemasi.
- source_word: δι’ ὧν
  choice: ambao kwa njia yao
  rationale: 'Usemi huu huhifadhi maana ya njia au uwakala: wao walikuwa vyombo ambavyo kupitia kwao Wakorintho waliamini.'
- source_word: ἐπιστεύσατε
  choice: mliamini
  rationale: Tafsiri hii ni ya moja kwa moja na haiingizi ufafanuzi usiotajwa kuhusu namna au hatua za kufikia imani.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: kwa kadiri Bwana alivyompa kila mmoja
  rationale: Kifungu cha Kigiriki hakitaji wazi kitu kilichotolewa. Kiswahili hiki kinabaki bila kutaja ‘kazi,’ ‘nafasi,’ au ‘kipawa,’ huku kikitoa sentensi inayoeleweka.
- source_word: κύριος
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida na lenye heshima kwa κύριος katika muktadha huu, bila kumtaja mhusika kwa ufafanuzi zaidi ya maandishi.
theological_decisions:
- issue: Mhusika anayeitwa ‘Bwana’ (κύριος)
  choice: Maandishi yanasema ‘Bwana’ bila kuongeza jina au utambulisho.
  alternative: Kumtaja wazi kuwa Yesu Kristo au Mungu.
  rationale: Muktadha unaweza kuelekeza kwa Bwana Yesu, lakini tafsiri kuu inahifadhi namna ya kutaja iliyopo katika Kigiriki na haifungi uwezekano huo kwa ufafanuzi ulioongezwa.
- issue: Kitu kisichotajwa katika ‘Bwana alivyompa kila mmoja’
  choice: Kutotaja kitu alichotoa Bwana.
  alternative: ‘Kama Bwana alivyompa kila mmoja kazi/sehemu yake.’
  rationale: Kigiriki kina usemi wenye pengo na hakitaji wazi kitu kilichotolewa. Kuongeza ‘kazi,’ ‘nafasi,’ ‘sehemu,’ au ‘kipawa’ kungetatua maana ambayo chanzo kinaiacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ni nini?’ imehifadhiwa kwa sababu ya msisitizo wa Kigiriki juu ya nafasi ya viongozi, ingawa tanbihi inatoa usemi wa kawaida zaidi ‘ni nani?’
