id: 1CO.3.13
reference: 1 Corinthians 3:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: sw
  text: Kazi ya kila mmoja itakuwa dhahiri, kwa maana ile Siku[a] itaifunua, kwa sababu Siku hiyo itafunuliwa katika moto[b]; nao moto wenyewe utaipima kazi ya kila mmoja, kuona ni ya namna gani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ile Siku” yaelekea kumaanisha siku ya baadaye ya tathmini au hukumu ya Mungu.
    reason: cross_reference
  - marker: b
    text: Au “kwa moto.” Usemi wa Kigiriki unaweza kueleweka kuwa “katika moto” au kwamba moto ndio chombo cha kufunulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τὸ ἔργον
  choice: kazi ya kila mmoja
  rationale: Muundo huu unadumisha maana ya kugawa kwa mtu mmoja mmoja na upana wa neno ἔργον, ambalo hapa linaweza kumaanisha kazi au matokeo ya huduma ya kila mjenzi.
- source_word: φανερὸν γενήσεται
  choice: itakuwa dhahiri
  rationale: Tafsiri hii ya kawaida na yenye heshima inaonyesha hali ya baadaye ambapo kazi itaonekana wazi.
- source_word: ἡ ἡμέρα
  choice: ile Siku
  rationale: Kivumishi kionyeshi “ile” pamoja na herufi kubwa kinaonyesha siku maalumu ya tathmini ya Mungu bila kuingiza maelezo hayo moja kwa moja ndani ya mstari.
- source_word: δηλώσει
  choice: itaifunua
  rationale: Kitenzi hiki kinaeleza kwamba Siku hiyo itaweka wazi kazi ya kila mmoja; “itaifunua” ni cha asili na kinafaa katika muktadha.
- source_word: ἐν πυρὶ
  choice: katika moto
  rationale: Hii inadumisha kwa uwazi muundo wa Kigiriki na kuacha wazi kama moto ni mazingira ya ufunuo au chombo kinachouleta.
- source_word: ἀποκαλύπτεται
  choice: inafunuliwa
  rationale: Kauli tendwa inadumishwa, na kiwakilishi cha ngeli kinarejelea “Siku” bila kulazimisha mtendaji ambaye Kigiriki hakumtaji.
- source_word: ὁποῖόν ἐστιν
  choice: kuona ni ya namna gani
  rationale: Usemi huu unaelekeza kwenye asili au ubora wa kazi, huku ukibaki wa kawaida na kueleweka katika Kiswahili cha sasa.
- source_word: τὸ πῦρ αὐτὸ δοκιμάσει
  choice: moto wenyewe utaipima
  rationale: “Mwenyewe” inadumisha mkazo wa αὐτό, na “utaipima” huwasilisha jaribio la kubaini aina au ubora wa kazi.
theological_decisions:
- issue: Ikiwa ἡ ἡμέρα ni siku ya kawaida au Siku ya mwisho ya tathmini ya Mungu.
  choice: ile Siku
  alternative: siku hiyo
  rationale: Muktadha unaelekea kwenye siku maalumu ya baadaye ambapo kazi itatathminiwa. Herufi kubwa na “ile” huashiria maana hiyo bila kuongeza neno “hukumu” lisilopatikana katika mstari.
- issue: Ikiwa ἐν πυρί ina maana ya mahali au chombo.
  choice: katika moto
  alternative: kwa moto
  rationale: Kigiriki kinakubali maana ya “katika moto” au “kwa moto.” Tafsiri kuu inadumisha taswira ya asili, na tanbihi inalinda uwezekano wa maana ya kichombo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha taswira ya kazi, Siku, na moto, pamoja na utata halisi wa ἐν πυρί. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
