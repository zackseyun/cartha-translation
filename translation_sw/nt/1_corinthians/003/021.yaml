lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia; ‘Kwa hiyo’ ni ya kawaida na huhifadhi nguvu ya kimantiki.
- source_word: μηδεὶς
  choice: mtu yeyote asi-
  rationale: Pamoja na kitenzi cha kukataza, muundo huu unatoa katazo la jumla kwa Kiswahili cha kawaida.
- source_word: καυχάσθω
  choice: asijivunie
  rationale: Huhifadhi wazo la kujisifu au kujiona fahari kwa msingi wa mtu mwingine bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἐν
  choice: -jivunie
  rationale: Katika muungano καυχάομαι ἐν, kihusishi kinaonyesha msingi au jambo la kujivunia; Kiswahili hulieleza kwa muundo wa kitenzi ‘jivunia’ bila kihusishi tofauti.
- source_word: ἀνθρώποις
  choice: wanadamu
  rationale: Ni wingi wa jina la jumla linalowahusu binadamu, si wanaume pekee; ‘wanadamu’ pia huepuka kuingiza moja kwa moja tafsiri ya kimuktadha ya ‘viongozi wa kibinadamu.’
- source_word: πάντα
  choice: vitu vyote
  rationale: Huhifadhi upana wa wingi wa kati na mtindo mpana wa hoja ya Paulo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huanzisha sababu ya katazo kwa mtiririko wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ὑμῶν
  choice: ni vyenu
  rationale: Huonyesha umilikaji moja kwa moja; ‘vyenu’ inaelekezwa kwa kundi la wasomaji.
- source_word: ἐστιν
  choice: ni
  rationale: Kishirikishi hiki kinaendana kiasili na kiima ‘vitu vyote’ katika Kiswahili.
theological_decisions:
- issue: Je, ἀνθρώποις itafsiriwe moja kwa moja au ifafanuliwe kuwa viongozi wa kibinadamu?
  choice: wanadamu
  alternative: viongozi wa kibinadamu
  rationale: Neno la Kigiriki ni pana, ingawa muktadha unawahusu viongozi kama Paulo, Apolo na Kefa. Tafsiri kuu huhifadhi upana huo, na tanbihi inaonyesha maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Wanadamu’ ni neno la kijumla lisilowahusu wanaume pekee; hakuna haja ya tanbihi tofauti kuhusu jinsia katika Kiswahili.
