translation:
  language: sw
  text: Nanyi ni wa Masihi[a], naye Masihi ni wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri za jadi hutumia “Kristo” badala ya “Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: nanyi
  rationale: Kiwakilishi cha nafsi ya pili wingi; “nanyi” kinaunganisha sentensi hii na mfululizo wa hoja unaotangulia huku kikitaja waamini wote wanaosemeshwa.
- source_word: δὲ
  choice: nanyi / naye
  rationale: Katika sehemu zote mbili δέ inaendeleza hoja kwa ulinganifu wenye utofautishaji mdogo. Viunganishi vya Kiswahili “nanyi” na “naye” vinatoa mtiririko wa kawaida bila kuifanya kuwa pingamizi kali.
- source_word: Χριστοῦ
  choice: wa Masihi
  rationale: Hali ya umilikaji inaonyesha kuwa wasomaji ni wa Masihi. Muundo mfupi “ni wa Masihi” unahifadhi ufupi na uhusiano wa maandishi ya Kigiriki.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno limetumiwa kama cheo na limerudiwa ili kuhifadhi ulinganifu wa kisanaa wa vifungu viwili.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Hali ya umilikaji inaonyesha uhusiano wa kuwa wa Mungu; muundo “ni wa Mungu” ni wa kawaida katika Kiswahili na hauongezi ufafanuzi ambao haupo katika Kigiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri miundo miwili ya umilikaji, Χριστοῦ na θεοῦ, bila kufifisha mpangilio wa mahusiano unaotolewa na Paulo.
  choice: 'Kutumia muundo uleule katika vifungu vyote viwili: “ni wa Masihi ... ni wa Mungu.”'
  alternative: “mnamilikiwa na Masihi, naye Masihi anamilikiwa na Mungu” au “mnamhusu Masihi, naye Masihi anamhusu Mungu.”
  rationale: Muundo wa Kigiriki ni mfupi na hauielezi aina kamili ya uhusiano. “Ni wa” huhifadhi ulinganifu, maana ya kuwa mali ya au kuwa upande wa mwingine, na mvutano wa kiteolojia bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nanyi ... naye ...” ni wa kawaida, unaosomeka kwa urahisi, na unahifadhi urudiaji na ulinganifu wa Kigiriki.
