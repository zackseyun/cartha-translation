id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: sw
  text: Kwa kadiri ya neema ya Mungu niliyopewa, kama mjenzi mkuu mwenye hekima, niliweka msingi, na mwingine anajenga juu yake. Lakini kila mmoja na aangalie jinsi anavyojenga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ
  choice: Kwa kadiri ya
  rationale: Inaonyesha kwamba kazi ya Paulo ililingana na neema aliyopewa; si chombo tu alichotumia.
- source_word: χάριν
  choice: neema
  rationale: Neno hili linahifadhi maana ya fadhili na uwezeshaji wa Mungu iliyo ya kawaida katika matumizi ya Paulo.
- source_word: τὴν δοθεῖσάν μοι
  choice: niliyopewa
  rationale: Muundo huu wa Kiswahili unaeleza kwa ufupi na kwa kawaida kwamba neema hiyo alipewa Paulo.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: kama mjenzi mkuu mwenye hekima
  rationale: ἀρχιτέκτων humaanisha mkuu wa wajenzi anayesimamia ujenzi, si mbunifu wa michoro pekee; σοφός imehifadhiwa kama “mwenye hekima,” huku pia ikidokeza ustadi.
- source_word: θεμέλιον ἔθηκα
  choice: niliweka msingi
  rationale: “Kuweka msingi” ni msemo wa kawaida wa Kiswahili na unaakisi kitendo cha kuweka au kulaza msingi.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: na mwingine anajenga juu yake
  rationale: Kitenzi ambatano kinaonyesha kujenga juu ya msingi uliokwisha kuwekwa; “juu yake” huweka wazi rejeo linalodokezwa katika Kigiriki.
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: Lakini kila mmoja na aangalie jinsi anavyojenga
  rationale: “Na aangalie” huhifadhi nguvu ya amri ya tahadhari, na “kila mmoja” ni ya umoja yenye maana jumuishi kama ilivyo ἕκαστος.
theological_decisions:
- issue: Uhusiano wa kazi ya Paulo na neema ya Mungu
  choice: Kwa kadiri ya neema ya Mungu niliyopewa
  alternative: Kwa neema ya Mungu niliyopewa
  rationale: “Kwa kadiri ya” huhifadhi vizuri zaidi wazo la Κατά la kulingana na neema aliyopewa, bila kuifanya neema ionekane kuwa chombo tu.
- issue: Maana ya ἀρχιτέκτων
  choice: mjenzi mkuu
  alternative: msanifu majengo
  rationale: Katika mazingira ya kale, neno hilo lilimhusu mkuu mwenye kusimamia ujenzi; “msanifu majengo” lingeweza kubana maana kuwa ubunifu wa majengo wa kisasa pekee.
- issue: Lugha ya umoja yenye uwakilishi katika ἕκαστος
  choice: kila mmoja ... anavyojenga
  alternative: kila mtu ... wanavyojenga
  rationale: Kiswahili hutumia ngeli ya mtu kwa jinsia zote, hivyo muundo huu huhifadhi umoja na maana jumuishi bila kudokeza wanaume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kwa msomaji wa leo. Muundo unahifadhi taswira ya ujenzi na marudio ya kitenzi “kujenga,” bila kuongeza ufafanuzi wa kimadhehebu.
