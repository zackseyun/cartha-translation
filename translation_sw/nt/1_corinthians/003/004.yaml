id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: sw
  text: 'Kwa maana mmoja anaposema, “Mimi ni wa Paulo,” na mwingine, “Mimi ni wa Apolo,” je, ninyi si wanadamu tu?[a]


    [a] Au, “Je, ninyi si wanadamu?” au, “Je, hamtendi kama wanadamu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, ninyi si wanadamu?” au, “Je, hamtendi kama wanadamu?”
    reason: Huonyesha tafsiri ya moja kwa moja ya ἄνθρωποι na pia maana yake inayowezekana katika muktadha, yaani kutenda kwa namna ya kibinadamu tu.
lexical_decisions:
- source_word: ὅταν γὰρ λέγῃ τις
  choice: Kwa maana mmoja anaposema
  rationale: “Anaposema” huonyesha hali isiyo na wakati mmoja maalumu na inayoweza kujirudia; “kwa maana” huhifadhi uhusiano wa maelezo unaoletwa na γάρ.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Mimi ni wa Paulo
  rationale: Muundo “ni wa” ni wa asili katika Kiswahili na huhifadhi usemi mfupi wa Kiyunani unaoonyesha kujitambulisha na upande wa Paulo bila kufafanua mno aina ya uhusiano.
- source_word: ἕτερος δέ
  choice: na mwingine
  rationale: Huwasilisha utofautishaji wa μέν ... δέ kwa Kiswahili laini na cha kawaida.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Mimi ni wa Apolo
  rationale: Kitenzi na wazo la umilikaji vinaeleweka kutoka kishazi kilichotangulia; Kiswahili kinavirejesha ili kudumisha ulinganifu na uwazi.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: je, ninyi si wanadamu tu?
  rationale: “Wanadamu” huhifadhi maana ya moja kwa moja ya ἄνθρωποι, huku “tu” ikionyesha nguvu ya swali la kukemea katika muktadha. Tafsiri ya moja kwa moja zaidi na ile inayosisitiza mwenendo zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya ἄνθρωποι katika swali la kukemea
  choice: wanadamu tu
  alternative: wanadamu; mnatenda kama wanadamu
  rationale: Muktadha unakemea mwenendo unaoongozwa na viwango vya kawaida vya kibinadamu. Tafsiri kuu inaonyesha nguvu hiyo bila kuingiza istilahi ya kimadhehebu, na tanbihi inalinda maana ya moja kwa moja pamoja na uwezekano wa kuelewa maneno hayo kuhusu mwenendo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina “Paulo” na “Apolo” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili. Swali la balagha limehifadhiwa kwa “je” na kiwakilishi “ninyi” kimewekwa wazi ili kuonyesha wingi wa ἐστε.
