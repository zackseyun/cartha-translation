base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: sw
  text: Mtu yeyote akiliharibu hekalu la Mungu[a], Mungu atamharibu mtu huyo; kwa maana hekalu la Mungu ni takatifu, na ninyi ni hekalu hilo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akilichafua”; neno hilohilo la Kigiriki limetumika pia katika “atamharibu.”
    reason: lexical_alternative
  - marker: b
    text: “Ninyi” ni wingi; Paulo anaitambulisha jumuiya ya waumini kwa pamoja kuwa hekalu la Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: hekalu
  rationale: Neno “hekalu” ni la kawaida na lenye hadhi katika Kiswahili, na hapa linaonyesha mahali patakatifu anapokaa Mungu, si jengo lolote tu.
- source_word: φθείρει / φθερεῖ
  choice: akiliharibu / atamharibu
  rationale: “Haribu” huhifadhi urudiaji wa kitenzi kimoja katika vifungu vyote viwili na uzito wa onyo. Kitenzi cha Kigiriki kinaweza pia kumaanisha kuchafua au kupotosha, jambo linalotajwa katika tanbihi.
- source_word: τοῦτον
  choice: mtu huyo
  rationale: Hurejelea kwa uwazi mtu yeyote aliyetajwa mwanzoni na huepuka utata wa kiwakilishi cha Kiswahili.
- source_word: ἅγιος
  choice: takatifu
  rationale: “Takatifu” ni tafsiri ya kawaida inayohifadhi maana za kuwa wakfu kwa Mungu na kuwa na utakatifu.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: nanyi ndilo hekalu hilo
  rationale: Muundo huu wa asili wa Kiswahili unahifadhi utambulisho wa wasomaji na hekalu lililotajwa, huku “nanyi” ikionyesha wingi.
- source_word: ὑμεῖς
  choice: nanyi
  rationale: Kiwakilishi hiki ni cha wingi; katika muktadha kinawaelekeza waumini kama jumuiya moja ambayo ndiyo hekalu la Mungu.
theological_decisions:
- issue: Je, hekalu la Mungu hapa ni mwamini mmoja mmoja au jumuiya ya waumini?
  choice: 'Maana kuu ni ya kijumuiya: “nanyi” ya wingi inaitambulisha jumuiya kwa pamoja kuwa hekalu moja la Mungu.'
  alternative: Wengine huona kwamba mstari huu unaweza pia kutumiwa kwa mwamini mmoja mmoja kwa kuzingatia mafundisho mapana ya Biblia.
  rationale: Sarufi ya Kigiriki inaunganisha “hekalu” la umoja na “ninyi” ya wingi; katika muktadha wa 1 Wakorintho 3, jambo hili linaelekeza hasa kwa kusanyiko kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Urudiaji wa “haribu” umehifadhiwa ili kuonyesha ulinganifu na uzito wa Kigiriki; “nanyi ndilo” huweka wazi kwamba kundi la waumini kwa pamoja ndilo hekalu moja.
