base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: sw
  text: Kama kazi ya mtu yeyote itateketezwa[a], atapata hasara; lakini yeye mwenyewe ataokolewa—kana kwamba amepitia katika moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini yeye mwenyewe ataokolewa, lakini ni kama kwa kupitia katika moto,” au “lakini yeye mwenyewe ataokolewa kama mtu anayeponyoka katika moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Kama ... ya mtu yeyote
  rationale: Muundo huu unaweka sharti la kawaida na kuhifadhi maana isiyoainisha mtu fulani.
- source_word: τὸ ἔργον
  choice: kazi
  rationale: “Kazi” ni pana na ya asili, na katika muktadha inarejelea matokeo ya kazi ya mtu huku ikidumisha mfano wa ujenzi.
- source_word: κατακαήσεται
  choice: itateketezwa
  rationale: Kitenzi kinaonyesha kuchomwa kabisa hadi kuangamia; “itateketezwa” kinadumisha nguvu hiyo.
- source_word: ζημιωθήσεται
  choice: atapata hasara
  rationale: Huwasilisha kupata hasara bila kufafanua kwamba ni adhabu au kupoteza thawabu, mambo ambayo hayajasemwa wazi hapa.
- source_word: αὐτὸς δὲ
  choice: lakini yeye mwenyewe
  rationale: Huhifadhi msisitizo na utofauti kati ya kuangamia kwa kazi na kuokolewa kwa mtu.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Hii ndiyo tafsiri ya kawaida ya σωθήσεται katika muktadha huu na inadumisha uzito wake wa kitheolojia.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: hata hivyo, kama apitaye katika moto
  rationale: Huhifadhi taswira ya kupitia katika moto na hali yake ya sitiari bila kuifanya wazi kuwa utakaso au kutoroka chupuchupu.
theological_decisions:
- issue: Iwapo kishazi cha mwisho kifafanuliwe kuunga mkono utakaso baada ya kifo au kuokoka chupuchupu.
  choice: hata hivyo, kama apitaye katika moto
  alternative: lakini kama mtu anayeponyoka katika moto; lakini tu kana kwamba amepitia katika moto
  rationale: Kigiriki kinatoa taswira fupi yenye maana isiyofafanuliwa kikamilifu. Tafsiri hii haiongezi fundisho maalumu la dhehebu wala kuamua kwamba ni kutoroka chupuchupu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Atapata hasara” ni wazi kwa msomaji wa kawaida; “itateketezwa” hudumisha ukali wa kitenzi cha Kigiriki. Tanbihi imewekwa kwenye taswira ya moto kwa kuwa hapo ndipo tofauti ya tafsiri inapohusika.
