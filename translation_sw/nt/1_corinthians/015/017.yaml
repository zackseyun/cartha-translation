base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: sw
  text: Lakini ikiwa Masihi[a] hajafufuliwa, imani yenu ni bure[b]; bado mko katika dhambi zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
