lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno hili limetumiwa hapa kama cheo cha Mtiwa-Mafuta aliyeahidiwa; “Masihi” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐγήγερται
  choice: hajafufuliwa
  rationale: Kauli hii huhifadhi umbo la kutendwa na hali ya sasa inayotokana na tukio la kufufuliwa, bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: ματαία
  choice: batili
  rationale: “Batili” huonyesha kwamba imani hiyo isingekuwa na msingi wala matokeo halisi katika hoja ya Paulo; ni ya heshima na inaeleweka katika Kiswahili cha sasa.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu neno linamaanisha mwitikio wa kuamini wa Wakorintho, si hasa uaminifu wao.
- source_word: ἔτι
  choice: bado
  rationale: “Bado” huwasilisha kwa kawaida kuendelea kwa hali inayodhaniwa katika sentensi hii.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: katika dhambi zenu
  rationale: Tafsiri hii huhifadhi taswira ya Kigiriki ya kuendelea kuwamo katika hali ya dhambi bila kuifafanua kupita kiasi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hoja iliyotangulia.
theological_decisions:
- issue: Maneno ya ufufuo na mtendaji
  choice: hajafufuliwa
  alternative: hajafufuka
  rationale: Umbo la kutendwa linafuata kwa karibu ἐγήγερται na kuhifadhi uwezekano wa mtendaji wa kimungu bila kumwongeza wazi katika maandishi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno linafanya kazi kama cheo cha Mtiwa-Mafuta katika dai la kitheolojia, kwa hiyo “Masihi” huonyesha maana yake badala ya kulifanya tu kuwa jina lililozoeleka.
- issue: Hali ya waamini ikiwa ufufuo haukutokea
  choice: bado mko katika dhambi zenu
  alternative: bado mko chini ya dhambi zenu
  rationale: Maneno ya moja kwa moja huhifadhi upana wa ἐν, ambao unaweza kuhusisha hali, hatia, na nguvu ya dhambi, bila kuchagua ufafanuzi mmoja pekee.
