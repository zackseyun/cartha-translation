id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: sw
  text: La sivyo[a], wale wanaobatizwa kwa ajili ya wafu watafanya nini? Ikiwa wafu hawafufuliwi hata kidogo, kwa nini basi wanabatizwa kwa ajili yao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa niaba ya wafu,” “kwa sababu ya wafu,” au, kwa uwezekano mdogo zaidi, “juu ya wafu.” Kihusishi cha Kigiriki kinaweza kueleweka kwa njia zaidi ya moja, na desturi hasa ambayo Paulo anairejelea haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: La sivyo
  rationale: Katika hoja hii neno hilo linaonyesha matokeo yanayofuata ikiwa ufufuo unakanushwa; “La sivyo” ni mpito wa kawaida na wazi katika Kiswahili.
- source_word: τί ποιήσουσιν
  choice: watafanya nini
  rationale: Inadumisha maana pana ya ποιέω na nguvu ya swali la balagha bila kuibana kuwa “watapata faida gani” au tafsiri nyingine.
- source_word: οἱ βαπτιζόμενοι
  choice: wale wanaobatizwa
  rationale: Muundo wa sasa wa kutendwa unahifadhiwa, ukionyesha tendo au desturi inayoendelea bila kuhukumu uhalali wake.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: kwa ajili ya wafu
  rationale: “Kwa ajili ya” ni tafsiri ya kawaida ya ὑπέρ pamoja na hali ya umilikishi na haisisitizi uwakilishi kwa nguvu kama “kwa niaba ya”; maana nyingine zinazowezekana zinawekwa katika tanbihi.
- source_word: εἰ ὅλως
  choice: Ikiwa ... kamwe
  rationale: '“Kamwe” katika sentensi hasi inawasilisha msisitizo wa ὅλως kwa Kiswahili cha kawaida: ikiwa wafu hawafufuliwi hata kidogo.'
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: wafu hawafufuliwi
  rationale: Inadumisha hali ya kutendwa ya kitenzi, kama ilivyo katika lugha ya Paulo kuhusu ufufuo, bila kubadili kuwa “hawafufuki.”
- source_word: τί καὶ
  choice: kwa nini basi
  rationale: Huwasilisha kwa ufasaha nguvu ya swali la hoja na uhusiano wake na sharti lililotangulia.
- source_word: βαπτίζονται
  choice: wanabatizwa
  rationale: Inadumisha wakati wa sasa na hali ya kutendwa, sambamba na “wale wanaobatizwa” katika sehemu ya kwanza.
- source_word: ὑπὲρ αὐτῶν
  choice: kwa ajili yao
  rationale: Kiwakilishi kinawarejelea wafu na usemi huu unadumisha ulinganifu na “kwa ajili ya wafu” bila kufafanua desturi hiyo kwa namna ya kimadhehebu.
theological_decisions:
- issue: Maana ya kubatizwa ὑπὲρ τῶν νεκρῶν
  choice: Kubaki na usemi usiofasiri sana, “wanaobatizwa kwa ajili ya wafu,” bila kuidhinisha desturi au fundisho fulani.
  alternative: “wanaobatizwa kwa niaba ya wafu,” “kwa sababu ya wafu,” au “juu ya wafu”
  rationale: Aya hii ina utata mkubwa wa kihistoria na kimaana. Tafsiri inadumisha utata wa ὑπέρ na matumizi ya Paulo ya desturi hiyo katika hoja yake kuhusu ufufuo, badala ya kuamua desturi hiyo ilikuwa nini au ilikuwa halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “La sivyo” na maswali mawili ya balagha yanadumisha mwendo wa hoja. “Kwa ajili ya” ni ya kawaida kwa wasomaji na inaacha nafasi ya maana mbalimbali kuliko usemi unaosisitiza uwakilishi pekee.
