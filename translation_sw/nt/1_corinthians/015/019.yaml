  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: sw
  text: Ikiwa tumekuwa na tumaini katika Masihi kwa maisha haya tu[c][a], sisi ni wa kuhurumiwa kuliko watu wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” au “Masihi”; hapa “Masihi” limetumiwa kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: b
    text: Au, “wa kuhurumiwa zaidi ya watu wote.” Ulinganisho wa Kigiriki unaweza kueleweka kwa maana inayokaribia kiwango cha juu.
    reason: lexical_alternative
  - marker: c
    text: Au, “Ikiwa katika maisha haya tu tumekuwa na tumaini katika Masihi.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰ
  choice: Ikiwa
  rationale: Huanzisha sentensi ya sharti kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: kwa maisha haya
  rationale: Katika muundo huu, ‘kwa maisha haya’ ni Kiswahili cha asili kinachoonyesha kuwa upeo wa tumaini unaishia katika maisha ya sasa; ‘katika maisha haya’ limehifadhiwa katika tanbihi kama mpangilio wa karibu zaidi na Kigiriki.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: ‘Masihi’ huhifadhi maana ya Χριστός kama cheo, na ‘katika’ huhifadhi nahau muhimu ya Paulo badala ya kuigeuza kimya kuwa yambwa la kitenzi.
- source_word: ἠλπικότες ἐσμὲν
  choice: tumekuwa na tumaini
  rationale: Huwakilisha muundo wa timilifu unaoonyesha tumaini lililowekwa na linalodumu hadi sasa, kwa Kiswahili kinachoeleweka.
- source_word: μόνον
  choice: tu
  rationale: Imewekwa baada ya ‘maisha haya’ ili kuonyesha wazi kuwa tumaini linalozungumziwa limewekewa mpaka wa maisha haya pekee.
- source_word: ἐλεεινότεροι
  choice: wa kuhurumiwa kuliko
  rationale: Huhifadhi umbo la ulinganisho la Kigiriki na maana ya kustahili huruma, bila kulibadili kuwa ‘wenye huzuni’ au ‘wenye taabu’.
- source_word: πάντων ἀνθρώπων
  choice: watu wote
  rationale: ἄνθρωποι hapa humaanisha wanadamu kwa ujumla, si wanaume pekee.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika nahau ya Paulo ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: ‘Masihi’ huhifadhi maana ya cheo, huku kihusishi ‘katika’ kikidumisha nahau ya Paulo yenye uzito wa kiteolojia.
- issue: Upeo wa μόνον katika kauli kuhusu tumaini
  choice: tu linahusishwa na ‘maisha haya’
  alternative: Ikiwa katika maisha haya tu tumekuwa na tumaini katika Masihi
  rationale: Muktadha unaonyesha kwamba Paulo anazungumzia tumaini lililowekewa mpaka wa maisha haya; tanbihi inahifadhi mpangilio ulio karibu zaidi na Kigiriki bila kuongeza hitimisho la kidoktrini.
- issue: Nguvu ya ulinganisho katika ἐλεεινότεροι πάντων ἀνθρώπων
  choice: wa kuhurumiwa kuliko watu wote
  alternative: wa kuhurumiwa zaidi ya watu wote
  rationale: Tafsiri kuu huhifadhi ulinganisho wa Kigiriki; mbadala unaweza kueleweka kwa maana inayokaribia kiwango cha juu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi kwa wasomaji wa kawaida; nahau ya Paulo ‘katika Masihi’ na mvutano wa sharti la hoja yake vimehifadhiwa.
