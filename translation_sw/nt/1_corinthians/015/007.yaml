  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: sw
  text: Kisha akamtokea Yakobo[a], halafu akawatokea mitume wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “akaonekana na Yakobo ... na mitume wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Kisha
  rationale: Ni kielezi cha wakati kinachoonyesha tukio linalofuata katika orodha ya wale waliomwona Kristo baada ya kufufuka.
- source_word: ὤφθη
  choice: akamtokea ... akawatokea
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, hapa linatumika kwa maana ya kuonekana kwa mtu; ‘akamtokea’ ni Kiswahili cha kawaida na wazi. Kitenzi kimerudiwa ili sentensi iwe ya asili kwa Kiswahili.
- source_word: Ἰακώβῳ
  choice: Yakobo
  rationale: Ni jina la kawaida la Kiswahili la Ἰάκωβος; dative inaonyesha mtu ambaye Kristo alimtokea.
- source_word: εἶτα
  choice: halafu
  rationale: Huendeleza mfuatano wa matukio. ‘Halafu’ hutofautisha kwa kawaida hatua hii na ‘Kisha’ bila kubadili maana.
- source_word: ἀποστόλοις
  choice: mitume
  rationale: Katika muktadha huu neno linawahusu mashahidi waliotumwa wenye hadhi ya kitume, si wajumbe kwa maana ya jumla.
- source_word: πᾶσιν
  choice: wote
  rationale: Linakazia kundi lote la mitume bila kufafanua idadi au washiriki wake.
theological_decisions:
- issue: Utambulisho na upeo wa ‘mitume wote’ kuhusiana na Yakobo
  choice: Kutafsiri moja kwa moja ‘mitume wote’ bila kubainisha kundi hilo zaidi.
  alternative: Kulitambulisha kundi hilo kuwa wale Kumi na Wawili pekee, au kundi pana la mashahidi waliotumwa.
  rationale: Maandishi ya Kigiriki hayafafanui washiriki kamili wa kundi hilo. Tafsiri inahifadhi tofauti kati ya Yakobo na ‘mitume wote’ bila kuingiza upatanisho wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamtokea’ ni tamko la kawaida katika masimulizi ya kuonekana baada ya ufufuo; tanbihi huhifadhi muundo halisi zaidi wa kauli ya kutendwa.
