base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: sw
  text: Lakini vitu vyote vitakapotiishwa chini yake[a], ndipo Mwana mwenyewe atatiishwa chini ya yule aliyetiisha vitu vyote chini ya Mwana, ili Mungu awe yote katika yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kitu.” Kigiriki kinarudia usemi “vitu vyote” (τὰ πάντα), unaohifadhi upeo wa ulimwengu mzima wa hoja ya Paulo.
    reason: lexical_alternative
  - marker: b
    text: 'Au “Mungu awe kila kitu katika wote.” Usemi wa Kigiriki ni mfupi na mpana: “yote katika yote”; unaweza kueleweka kwa namna tofauti bila kuwekewa kikomo kuwa unawahusu watu pekee.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini ... vitakapotiishwa
  rationale: ὅταν huanzisha kishazi cha wakati, na δέ hapa huonyesha hatua inayofuata yenye utofautishaji hafifu; “Lakini ... vitakapo-” ni ya kawaida na huhifadhi uhusiano huo.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: vitakapotiishwa / atatiishwa
  rationale: Maumbo yote ni ya kauli ya kutendwa ya ὑποτάσσω. “Tiishwa chini ya” huhifadhi maana ya kuwekwa chini ya mamlaka na pia urudiaji wa neno kuu.
- source_word: αὐτῷ
  choice: chini yake
  rationale: Kiwakilishi kinamrejelea Mwana katika muktadha. Kiswahili hutumia kwa kawaida “tiishwa chini ya” kuonyesha mwelekeo wa utii.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Kirai hiki cha wingi wa kati kina upeo wa ulimwengu mzima katika hoja ya Paulo. “Vitu vyote” huhifadhi urudiaji na upana wake kuliko kufupisha tu kuwa “vyote” kila mahali.
- source_word: τότε
  choice: ndipo
  rationale: “Ndipo” huonyesha kwa ufupi hatua inayofuata katika mfuatano wa wakati na matokeo.
- source_word: αὐτὸς ὁ υἱὸς
  choice: Mwana mwenyewe pia
  rationale: “Mwenyewe” huhifadhi mkazo wa αὐτός; “pia” huonyesha kwamba Mwana naye anahusishwa katika utiisho uliotajwa, bila kuficha kuwa neno hilo halijitokezi kama kiunganishi tofauti katika maandishi yaliyochapishwa.
- source_word: τῷ ὑποτάξαντι
  choice: yule aliyevitiisha
  rationale: Huhifadhi hali ya kirai cha kushiriki chenye kibainishi, kinachomaanisha “yule aliyetiisha.”
- source_word: ἵνα ᾖ
  choice: ili ... awe
  rationale: “Ili” pamoja na hali ya utegemezi huhifadhi maana ya kusudi au tokeo bila kuamua kwa nguvu kati ya hizo mbili.
- source_word: πάντα ἐν πᾶσιν
  choice: yote katika yote
  rationale: Hili ni toleo la karibu la usemi mfupi wa Paulo, linalohifadhi urudiaji, upana, na utata wake badala ya kuufanya umaanishe watu pekee.
theological_decisions:
- issue: Uhusiano wa kutiishwa kwa Mwana kwa Mungu
  choice: Kusema wazi kwamba Mwana mwenyewe atatiishwa chini ya yule aliyetiisha vitu vyote chini yake.
  alternative: Kufafanua katika mstari kwamba huu ni utiisho wa kiutendaji tu, au kubadili maneno ili kuepuka kabisa wazo la utiisho.
  rationale: Kigiriki kinasema wazi kuhusu kutiishwa kwa Mwana katika ukamilisho wa mpango wa mwisho. Tafsiri haipaswi kufifisha kauli hiyo wala kuingiza ufafanuzi wa baadaye kuhusu asili au cheo ndani ya mstari.
- issue: Upeo wa τὰ πάντα na πάντα ἐν πᾶσιν
  choice: Kutumia “vitu vyote” na “yote katika yote.”
  alternative: Kutumia “kila kitu katika kila mtu,” jambo ambalo lingeweza kuelekeza usemi kwa watu pekee.
  rationale: Lugha inayorudiwa ya πᾶς ina upeo mpana sana. Maneno haya yanahifadhi upeo huo na fumbo la usemi wa mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Tiishwa chini ya” limetumiwa kwa uthabiti ili kuhifadhi kauli ya kutendwa na uhusiano wa mamlaka. Muundo “yote katika yote” umeachwa ukiwa mfupi kwa makusudi ili kuhifadhi nguvu ya balagha na utata halisi wa Kigiriki.
