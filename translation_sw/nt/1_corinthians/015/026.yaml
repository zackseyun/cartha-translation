translation:
  language: sw
  text: Adui wa mwisho anayeondolewa ni kifo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Adui wa mwisho anayeangamizwa ni kifo.”
