lexical_decisions:
- source_word: ἔσχατος
  choice: wa mwisho
  rationale: Kivumishi hiki humaanisha aliye au kilicho cha mwisho katika mfuatano; hapa kinahifadhi mpangilio wa matukio katika hoja ya Paulo.
- source_word: ἐχθρὸς
  choice: adui
  rationale: Neno hili humaanisha mpinzani au nguvu yenye uhasama. “Adui” ni Kiswahili cha kawaida na hudumisha uhuishaji wa kifo kama nguvu pinzani.
- source_word: καταργεῖται
  choice: anayeondolewa
  rationale: Kitenzi hiki cha wakati uliopo katika kauli tendwa kinaeleza kufanywa kutotenda tena, kuondolewa, au kukomeshwa. “Anayeondolewa” ni ya asili katika muundo huu wa Kiswahili na haidai kwamba maana yake lazima iwe kuangamizwa kabisa.
- source_word: ὁ θάνατος
  choice: kifo
  rationale: Nomino hii ni bayana na imehuishwa kuwa adui wa mwisho. Kiswahili hutumia “kifo” kwa kawaida bila kiashiria kingine cha ubayana.
theological_decisions:
- issue: Maana ya καταργεῖται kuhusu kushindwa kwa kifo
  choice: anayeondolewa
  alternative: anayeangamizwa
  rationale: Kauli inahusu mwisho wa kifo kama adui. “Anayeondolewa” huhifadhi wazo la kukomeshwa au kufanywa kutokuwa na nguvu bila kuingiza dai mahususi zaidi la kimetafizikia; “anayeangamizwa” ni tafsiri halali inayoweza kueleweka kama mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Uhuishaji wa kifo umehifadhiwa kwa upatanisho wa ngeli ya mtu katika “anayeondolewa.”
