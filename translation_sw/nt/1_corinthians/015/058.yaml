  to: Kwa hiyo, ndugu zangu wapendwa[a], iweni imara, msitikisike, mkiwa na bidii nyingi sikuzote katika kazi ya Bwana, mkijua kwamba juhudi yenu katika Bwana si ya bure.
  rationale: The revision retains the draft's accurate inferential structure, register, and inclusive lexical note. It replaces the potentially directional “mkizidi” with an idiomatic expression of sustained abundance in the Lord's work and clarifies κόπος as earnest labor rather than trouble. The source's participial relationships and the broad Pauline phrase “katika Bwana” remain unexpanded.
