review_pass:
  verdict: revise
  source_fidelity: The inferential force, affectionate address, twofold call to firmness, continual activity in the Lord's work, and assurance concerning labor are substantially preserved. However, “mkizidi ... katika kazi” more naturally denotes increasing in the work rather than abounding/devoting oneself richly to it, and “taabu” can chiefly suggest trouble or hardship rather than laborious effort.
  naturalness: The draft is generally fluent Standard East African Swahili. “Mkiwa na bidii nyingi sikuzote katika kazi ya Bwana” is more idiomatic and communicates the intended sustained abundance without the directional ambiguity of “mkizidi.”
  terminology: “Bwana,” “ndugu zangu wapendwa,” and “katika Bwana” are appropriate. “Juhudi yenu” is a clearer contemporary equivalent for κόπος in this exhortational context than “taabu yenu,” while retaining the sense of earnest labor.
  issues:
  - severity: medium
    issue: “mkizidi daima katika kazi ya Bwana”
    rationale: This can mean continually increasing/progressing in the Lord's work, whereas περισσεύοντες denotes being abundant/overflowing in it. A revised idiom better conveys the intended fullness.
  - severity: low
    issue: “taabu yenu”
    rationale: Although it can refer to strenuous effort, in current Swahili it readily means trouble, suffering, or difficulty. “Juhudi yenu” more directly identifies the believers' labor while leaving its exact form broad.
  revised_text: Kwa hiyo, ndugu zangu wapendwa[a], iweni imara, msitikisike, mkiwa na bidii nyingi sikuzote katika kazi ya Bwana, mkijua kwamba juhudi yenu katika Bwana si ya bure.
  revised_footnotes:
