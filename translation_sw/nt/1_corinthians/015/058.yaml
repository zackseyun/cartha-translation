id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: sw
  text: Kwa hiyo, ndugu zangu wapendwa[a], iweni imara, msitikisike, mkiwa na bidii nyingi sikuzote katika kazi ya Bwana, mkijua kwamba juhudi yenu katika Bwana si ya bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” linaweza kuwahusu waumini wote kwa pamoja, wanaume na wanawake, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho linalotokana na hoja iliyotangulia kuhusu ufufuo; “Kwa hiyo” huhifadhi nguvu hiyo ya kimantiki kwa Kiswahili cha kawaida.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ndugu zangu wapendwa
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kuwahusu waumini wa kiume na wa kike kwa pamoja; “wapendwa” huhifadhi maana ya ἀγαπητοί.
- source_word: ἑδραῖοι γίνεσθε
  choice: iweni imara
  rationale: Ingawa γίνεσθε kimsingi inaweza kuwa “kuweni/iweni” au “fanyikeni,” hapa “iweni imara” ni himizo la asili na lenye heshima katika Kiswahili, likihifadhi wazo la kusimama kwa uthabiti.
- source_word: ἀμετακίνητοι
  choice: msitikisike
  rationale: Hutoa wazo la kutosukumwa au kuondolewa katika msimamo. Umbo la kitenzi cha kukataza ni la asili zaidi kuliko kivumishi kizito kama “wasioweza kuhamishwa.”
- source_word: περισσεύοντες
  choice: mkizidi
  rationale: Huhifadhi maana ya kuongezeka au kuwa na wingi pamoja na hali endelevu ya participio, bila kuifafanua kuwa ubora pekee.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: katika kazi ya Bwana
  rationale: Huhifadhi muundo na upana wa ἔργον bila kuibana iwe huduma rasmi tu.
- source_word: πάντοτε
  choice: daima
  rationale: Ni kielezi cha kawaida na chenye hadhi kinacholingana moja kwa moja na maana ya “sikuzote.”
- source_word: εἰδότες
  choice: mkijua
  rationale: Huhifadhi uhusiano wa kipartisipio na himizo kuu bila kulazimisha wazi maana ya sababu, ingawa inaweza kudokezwa.
- source_word: ὁ κόπος ὑμῶν
  choice: taabu yenu
  rationale: κόπος husisitiza juhudi ngumu yenye kuchosha; “taabu” huhifadhi uzito huo kuliko “kazi” peke yake.
- source_word: οὐκ ἔστιν κενὸς
  choice: si ya bure
  rationale: Ni nahau ya asili ya Kiswahili kwa jambo lisilo batili, lisilo tupu, wala lisilokuwa na matokeo.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi upana wa usemi wa Paulo bila kuufupisha kuwa sababu, chombo, au muungano pekee.
theological_decisions:
- issue: Marejeo ya kijinsia katika ἀδελφοί
  choice: “ndugu” katika matini kuu, pamoja na tanbihi inayoeleza kuwa hapa linawahusu waumini wote
  alternative: “ndugu wanaume na wanawake” au “akina ndugu”
  rationale: Katika Kiswahili “ndugu” lenyewe linaweza kuwa jumuishi, na muktadha ni kanisa lote. Tanbihi inaonyesha wazi upeo huo bila kuingiza maneno mawili ya kijinsia yasiyopo katika umbo la Kigiriki.
- issue: Uhusiano wa ἐν κυρίῳ mwishoni mwa mstari
  choice: 'imeunganishwa na “taabu yenu”: “taabu yenu katika Bwana si ya bure”'
  alternative: “taabu yenu si ya bure kwa sababu ya Bwana”
  rationale: Muundo huu huhifadhi uwezekano mpana wa usemi wa Paulo kuhusu kazi inayofanywa katika uhusiano na Bwana, bila kuibadili wazi kuwa kauli ya sababu.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu au Bwana mkubwa
  rationale: “Bwana” ndiyo tafsiri ya kawaida, yenye hadhi, na inayofaa kitheolojia kwa κύριος katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mlolongo wa himizo la Kigiriki, lakini imetumia miundo ya kawaida ya Kiswahili kama “iweni imara” na “msitikisike.”
