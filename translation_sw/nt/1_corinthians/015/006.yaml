source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: sw
  text: 'Kisha aliwatokea ndugu zaidi ya mia tano kwa wakati mmoja[a]. Wengi wao bado wapo mpaka sasa, ingawa baadhi yao wamelala[b].


    [a] Au, “ndugu wa kiume na wa kike.” Neno la Kigiriki ni “ndugu” katika wingi wa kiume, lakini katika matumizi ya Wakristo wa kwanza wakati mwingine linaweza kumaanisha jumuiya pana ya waumini.


    [b] Yaani, wamekufa. Paulo anatumia “wamelala,” usemi uliotumiwa na Wakristo wa kwanza kuhusu kifo kwa kuzingatia tumaini la ufufuo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike.” Neno la Kigiriki ni “ndugu” katika wingi wa kiume, lakini katika matumizi ya Wakristo wa kwanza wakati mwingine linaweza kumaanisha jumuiya pana ya waumini.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wamekufa. Paulo anatumia “wamelala,” usemi uliotumiwa na Wakristo wa kwanza kuhusu kifo kwa kuzingatia tumaini la ufufuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Kisha
  rationale: Huonyesha hatua inayofuata katika mfululizo wa kutokea kwa Kristo baada ya kufufuka.
- source_word: ὤφθη
  choice: aliwatokea
  rationale: Katika masimulizi ya kuonekana kwa Kristo aliyefufuka, kitenzi hiki humaanisha kwamba alijidhihirisha kwa watu; kiambishi cha watendewa kinaifanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: ἐπάνω πεντακοσίοις
  choice: zaidi ya mia tano
  rationale: ἐπάνω pamoja na idadi humaanisha idadi inayozidi mia tano.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya kawaida na yenye heshima; kwa kuwa Kiswahili hakionyeshi jinsia katika umbo hili, tanbihi inaeleza umbo la kiume la Kigiriki na uwezekano wa kurejelea waumini wa jinsia zote.
- source_word: ἐφάπαξ
  choice: kwa wakati mmoja
  rationale: Hapa linaonyesha kwamba kundi lote lilimwona katika tukio moja kwa pamoja, si maana ya ‘mara moja’ kama ‘ghafla.’
- source_word: οἱ πλείονες
  choice: wengi wao
  rationale: Umbo hili la kulinganisha lililotumiwa kama nomino humaanisha walio wengi katika kundi hilo.
- source_word: μένουσιν ἕως ἄρτι
  choice: bado wapo mpaka sasa
  rationale: Huhifadhi wazo la kuendelea kuwapo hadi wakati wa Paulo na kwa Kiswahili hudokeza kwa kawaida kwamba bado walikuwa hai, bila kuongeza neno ‘hai’ katika matini kuu.
- source_word: τινὲς δὲ
  choice: ingawa baadhi yao
  rationale: δέ huleta utofautishaji mpole kati ya walio wengi waliokuwa bado wapo na wengine waliokuwa wamekufa.
- source_word: ἐκοιμήθησαν
  choice: wamelala
  rationale: Inahifadhi sitiari ya kulala kwa maana ya kufa, ambayo ni muhimu katika muktadha wa hoja ya ufufuo; tanbihi inafafanua maana yake.
theological_decisions:
- issue: Je, ἀδελφοῖς inarejelea wanaume pekee au jumuiya pana ya waumini?
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Kigiriki kina wingi wa kiume, lakini matumizi ya Kikristo yanaweza kujumuisha waumini wa jinsia zote. “Ndugu” halazimishi uamuzi huo katika Kiswahili, na tanbihi huhifadhi taarifa ya umbo la asili na uwezekano wa maana pana.
- issue: Kuhifadhi sitiari ya usingizi katika muktadha wa ufufuo
  choice: wamelala
  alternative: wamekufa
  rationale: Sitiari hiyo ni sehemu ya lugha ya Paulo na ina uhusiano wa maana na tumaini la ufufuo katika sura hii; maana halisi ya kifo imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kufuta utata wa “ndugu” au sitiari ya “kulala.”
