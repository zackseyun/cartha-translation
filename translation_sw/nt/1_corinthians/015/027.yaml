review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the comprehensive neuter πάντα as “vitu vyote,” preserves the scriptural “chini ya miguu yake” idiom, and appropriately keeps ὅταν δὲ εἴπῃ impersonal. However, “yule aliyevitia vitu vyote chini yake” can naturally make “yake” refer to the relative subject, the one doing the subjecting, rather than to αὐτῷ, the one to whom all things are subjected. This reverses or at least materially obscures the relationship expressed in the Greek.
  naturalness: The register is modern, clear Standard East African Swahili. Recasting the final relative clause as “aliyefanya vitu vyote vimtii” is idiomatic and makes the intended referent relationship unambiguous without adding a name or theological interpretation.
  terminology: “Vitu vyote,” “chini ya miguu yake,” “vimetiishwa,” and “ni wazi” are suitable. The revision preserves the distinction between the one who subjects and the one to whom all things are subjected.
  issues:
  - severity: high
    issue: The pronoun reference in “yule aliyevitia vitu vyote chini yake” is ambiguous and may assign “chini yake” to the subjecter rather than to the recipient represented by αὐτῷ.
    rationale: In ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα, the participial subject is the one who subjected, whereas αὐτῷ is the distinct recipient of that subjection. Swahili should signal this distinction clearly.
  revised_text: Kwa maana, “ameweka vitu vyote chini ya miguu yake.” Lakini inaposemwa kwamba vitu vyote vimetiishwa, ni wazi kwamba yule aliyefanya vitu vyote vimtii hahesabiwi miongoni mwa vitu hivyo.[a]
