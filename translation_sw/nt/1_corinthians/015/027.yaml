  to: Kwa maana, “ameweka vitu vyote chini ya miguu yake.” Lakini inaposemwa kwamba vitu vyote vimetiishwa, ni wazi kwamba yule aliyefanya vitu vyote vimtii hahesabiwi miongoni mwa vitu hivyo.[a]
