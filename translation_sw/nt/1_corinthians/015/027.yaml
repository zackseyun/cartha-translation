id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: sw
  text: Kwa maana, “ameweka vitu vyote chini ya miguu yake.” Lakini inaposemwa kwamba vitu vyote vimetiishwa, ni wazi kwamba yule aliyefanya vitu vyote vimtii hahesabiwi miongoni mwa vitu hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa yule aliyefanya vitu vyote vimtii.”
    reason: Hutoa njia ya moja kwa moja ya kutafsiri ἐκτός (“isipokuwa”) bila kubadili mantiki ya sentensi.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: vitu vyote
  rationale: Nomino-vumishi hii ya wingi wa jinsia isiyo ya kiume wala ya kike ina maana pana ya vitu vyote, si watu wote pekee; pia inadumisha mwangwi wa Zaburi 8.
- source_word: ὑπέταξεν
  choice: ameweka ... chini
  rationale: Katika nukuu hii, usemi huu wa Kiswahili unaonyesha kitendo cha kuviweka vitu katika hali ya kutawaliwa na unaungana kwa kawaida na kirai ‘chini ya miguu yake.’
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: chini ya miguu yake
  rationale: Usemi wa kibiblia kuhusu mamlaka na kutiishwa umehifadhiwa ili kudumisha mwangwi wa Maandiko.
- source_word: ὅταν δὲ εἴπῃ
  choice: Lakini inaposemwa
  rationale: Kauli isiyo na mtendaji aliyetajwa inadumisha uwezekano kwamba Paulo anarejelea maneno ya Maandiko bila kumtaja Mungu moja kwa moja kama msemaji.
- source_word: ὑποτέτακται
  choice: vimetiishwa
  rationale: Kauli tendwa inadumishwa; hali timilifu ya Kiyunani inaonyesha kitendo kilichotimizwa chenye matokeo yanayoendelea, jambo linalowasilishwa kwa kawaida na umbo hili katika Kiswahili.
- source_word: δῆλον
  choice: ni wazi
  rationale: Huu ni usemi wa kawaida na wa kueleweka unaoonyesha hitimisho ambalo Paulo anatarajia msomaji alitambue.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: yule aliyevitia vitu vyote chini yake hahesabiwi miongoni mwa vitu hivyo
  rationale: Hii inaeleza kwa Kiswahili cha kawaida maana ya ἐκτός yaani isipokuwa au kutohusishwa, huku ikihifadhi mantiki kwamba anayevitiisha vitu vyote si sehemu ya ‘vitu vyote’ vilivyotiishwa.
- source_word: αὐτῷ
  choice: chini yake
  rationale: Pamoja na kitenzi cha kutiisha, Kiswahili cha kawaida hutumia ‘chini yake’ kuonyesha yule ambaye vitu vyote vimewekwa chini ya mamlaka yake.
theological_decisions:
- issue: Uhusiano kati ya Mwana na yule anayevitiisha vitu vyote
  choice: Mungu, ambaye anavitia vitu vyote chini ya Mwana, hahesabiwi miongoni mwa ‘vitu vyote’ vilivyotiishwa.
  alternative: isipokuwa yule aliyevitia vitu vyote chini yake
  rationale: Tafsiri inadumisha tofauti ya wahusika na upekee wa yule anayetiisha bila kuingiza maelezo ya kimadhehebu au kupunguza hadhi ya Mwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama za kunukuu zinaonyesha kwamba sehemu ya kwanza ni nukuu ya Maandiko. ‘Hahesabiwi miongoni mwa vitu hivyo’ ni ya asili zaidi kuliko tafsiri ngumu ya neno kwa neno na inaweka wazi mantiki ya ἐκτός bila kuondoa mvutano wa kiteolojia.
