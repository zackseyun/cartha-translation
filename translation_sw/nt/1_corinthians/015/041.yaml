  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: sw
  text: Kuna utukufu wa aina moja wa jua,[a] na utukufu wa aina nyingine wa mwezi, na utukufu wa aina nyingine wa nyota; kwa maana nyota moja hutofautiana na nyota nyingine katika utukufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fahari” au “mwangaza” kila linapotokea katika mstari huu; hapa neno la Kigiriki δόξα linaweza kumaanisha mwangaza unaoonekana, ingawa “utukufu” huhifadhi neno lilelile ambalo Paulo anarudia katika hoja inayozunguka mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: wa aina moja ... wa aina nyingine ... wa aina nyingine
  rationale: Urudiaji wa ἄλλη unaonyesha tofauti kati ya jua, mwezi na nyota. Muundo huu ni wa asili katika Kiswahili na huhifadhi mfuatano wa utofautishaji.
- source_word: δόξα
  choice: utukufu
  rationale: Katika mfano huu neno linahusu fahari au mwangaza unaoonekana, lakini “utukufu” huhifadhi neno kuu linalorudiwa katika hoja ya Paulo kuhusu ufufuo bila kulipunguza kuwa mwangaza wa kimwili tu.
- source_word: ἡλίου
  choice: wa jua
  rationale: Hii ni hali ya umilikaji inayotegemea δόξα, na kwa kawaida hutafsiriwa “wa jua.”
- source_word: σελήνης
  choice: wa mwezi
  rationale: Hii ni hali ya umilikaji inayotegemea δόξα, sambamba na “wa jua.”
- source_word: ἀστέρων
  choice: wa nyota
  rationale: Wingi huu wa hali ya umilikaji unakamilisha mfululizo wa jua, mwezi na nyota.
- source_word: ἀστὴρ ... ἀστέρος
  choice: nyota ... nyota nyingine
  rationale: Muundo wa kulinganisha nyota moja na nyingine umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: γάρ inatoa sababu au ufafanuzi wa kauli iliyotangulia; “kwa maana” ni kiunganishi cha kawaida na cha wazi hapa.
- source_word: διαφέρει
  choice: hutofautiana
  rationale: Kitenzi kinaonyesha tofauti. “Hutofautiana” huepuka kuingiza wazo lenye nguvu zaidi kwamba nyota moja lazima iwe bora kuliko nyingine.
- source_word: ἐν δόξῃ
  choice: katika utukufu
  rationale: Kirai kinaonyesha jambo ambamo nyota hutofautiana, na kurudia “utukufu” huhifadhi msisitizo wa maandishi ya Kigiriki.
theological_decisions:
- issue: Tafsiri ya δόξα katika mfano wa vitu vya angani ndani ya hoja kuhusu ufufuo
  choice: utukufu
  alternative: fahari; mwangaza
  rationale: Ingawa hapa δόξα linajumuisha mwangaza unaotofautiana wa miili ya angani, “utukufu” huhifadhi mwendelezo wa msamiati na hoja ya Paulo kuhusu miili ya ufufuo, bila kufasiri mfano kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “wa aina moja ... wa aina nyingine” umetumiwa kuonyesha tofauti ya ἄλλη kwa uwazi bila kudokeza lazima ubora wa daraja.
