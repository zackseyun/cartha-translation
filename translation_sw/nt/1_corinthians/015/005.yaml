lexical_decisions:
- source_word: ὤφθη
  choice: alimtokea
  rationale: Ingawa kitenzi cha Kigiriki kina umbo la kutendwa, katika masimulizi ya kuonekana kwa Yesu baada ya kufufuka kwa kawaida humaanisha kwamba alijionyesha au alimtokea mtu. “Alimtokea” ni Kiswahili cha kawaida na huhifadhi wazo la Yesu aliyefufuka kujidhihirisha kwa Kefa.
- source_word: Κηφᾷ
  choice: Kefa
  rationale: Hili ni jina la Kiaramu lililoandikwa katika Kigiriki, likiwa katika hali inayoonyesha anayelengwa na tendo. “Kefa” huhifadhi jina lililotumiwa katika matini badala ya kulibadilisha kuwa “Petro.”
- source_word: εἶτα
  choice: kisha
  rationale: Neno hili linaonyesha mfuatano wa matukio katika mapokeo anayoyataja Paulo. “Kisha” ni fupi, ya kawaida, na huhifadhi mfuatano huo.
- source_word: τοῖς δώδεκα
  choice: wale kumi na wawili
  rationale: Hili ni jina la kikundi lililozoeleka kwa mzunguko wa mitume wa Yesu. Tafsiri ya moja kwa moja inalindwa bila kulibadilisha kuwa “mitume” au “wale kumi na mmoja.”
- source_word: καὶ ὅτι
  choice: na kwamba
  rationale: Maneno haya yanaendeleza mfululizo wa vifungu vya yaliyomo ulioanza katika mistari iliyotangulia. “Na kwamba” huhifadhi muundo huo wa matini.
theological_decisions:
- issue: Lugha ya kuonekana kwa Yesu baada ya ufufuo
  choice: alimtokea
  alternative: alionwa na
  rationale: Tafsiri hii inawasilisha kujidhihirisha kwa Yesu aliyefufuka bila kufafanua namna ya tukio hilo kuliko matini inavyofanya. Mbadala “alionwa na” hufuata zaidi umbo la kutendwa la Kigiriki, lakini si wa kawaida sana katika Kiswahili hiki.
- issue: Kutajwa kwa “wale kumi na wawili” ingawa Yuda hakuwepo
  choice: wale kumi na wawili
  alternative: wale kumi na mmoja; mitume
  rationale: Matini ya Kigiriki hutumia jina la kikundi lililozoeleka. Kulihifadhi huepuka kuoanisha kimya kimya mstari huu na masimulizi mengine au hesabu inayodhaniwa ya waliokuwapo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa viashirio vya tanbihi umewekwa karibu na maneno yanayohusika: [a] kwa kitenzi, [b] kwa Kefa, na [c] kwa jina la kikundi.'
