  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alionwa na Kefa.” Kitenzi cha Kigiriki kina umbo la kutendwa, lakini katika habari za kuonekana baada ya ufufuo mara nyingi hutafsiriwa “alimtokea.”
    reason: lexical_alternative
