  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: sw
  text: Ikiwa[a], kwa jinsi ya kibinadamu, nilipigana na wanyama wakali[b] katika Efeso, faida yake ni nini kwangu? Ikiwa wafu hawafufuliwi, “Tule na tunywe[c], kwa maana kesho tunakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “Ikiwa, kwa mtazamo wa kibinadamu, nilipigana na wanyama wakali katika Efeso …” Kauli hii inaweza kueleza namna Paulo anavyosema au mtazamo anaoutumia.
    reason: lexical_alternative
  - marker: b
    text: Maneno “nilipigana na wanyama wakali” yanaweza kueleweka kihalisi au kama sitiari ya upinzani wa kikatili kutoka kwa wanadamu; matini kuu imehifadhi taswira ya Kigiriki bila kuamua maana mojawapo.
    reason: alternative_reading
  - marker: c
    text: Nukuu au dokezo la Isaya 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: nikisema kwa mtazamo wa kibinadamu tu
  rationale: Kauli hii ya kawaida inaweza kueleza namna Paulo anavyosema au mtazamo anaoutumia. Tafsiri hii ni ya asili katika Kiswahili na haifungi kabisa uwezekano huo.
- source_word: ἐθηριομάχησα
  choice: nilipigana na wanyama wakali
  rationale: Kitenzi humaanisha kupigana na wanyama wakali. Taswira ya Kigiriki imehifadhiwa bila kuamua katika matini kuu ikiwa ni tukio halisi au sitiari ya upinzani wa kikatili.
- source_word: ἐν Ἐφέσῳ
  choice: huko Efeso
  rationale: Efeso ni umbo la kawaida la jina la mahali katika Kiswahili; 'huko' huifanya sentensi isikike kwa urahisi.
- source_word: τί μοι τὸ ὄφελος
  choice: nina faida gani?
  rationale: Huhifadhi swali la balagha na wazo la manufaa kwa lugha ya Kiswahili ya sasa.
- source_word: νεκροὶ
  choice: wafu
  rationale: Kivumishi kilichotumika kama nomino kinatafsiriwa kwa kawaida kama 'wafu' katika muktadha wa ufufuo.
- source_word: ἐγείρονται
  choice: hawafufuliwi
  rationale: Umbo la kutendwa limehifadhiwa, bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji katika sentensi hii.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: Tule na tunywe
  rationale: Maumbo ya kuhimiza yamewakilishwa kwa 'tule' na 'tunywe', yakihifadhi nguvu ya mwito wa pamoja.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: kwa maana kesho tunakufa
  rationale: Ingawa kitenzi kiko katika wakati wa sasa, kauli inaelekea wakati ujao. Kiswahili cha sasa kinaweza kutumia 'kesho tunakufa' kwa maana hiyo huku kikihifadhi mwangwi wa Isaya 22:13.
theological_decisions:
- issue: Ikiwa ἐθηριομάχησα ina maana halisi ya kupigana na wanyama au ni sitiari ya wapinzani wakatili
  choice: Kuhifadhi 'nilipigana na wanyama wakali' katika matini kuu bila kuamua kati ya maana halisi na ya kisitiari.
  alternative: Kutafsiri wazi kuwa Paulo alipambana na wapinzani wa kibinadamu waliokuwa wakatili huko Efeso.
  rationale: Hoja ya mstari hailazimishi kutatua swali hili la kihistoria. Kuhifadhi taswira yenyewe kunatunza utata halisi wa matini na kuepuka kuingiza uamuzi wa mfasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa balagha umehifadhiwa, na alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
