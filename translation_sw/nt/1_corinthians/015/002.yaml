  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: sw
  text: Kwa njia ya habari hiyo njema ninyi pia mnaendelea kuokolewa[a], ikiwa mnashikilia imara ujumbe[b] niliowahubiria—isipokuwa kama mliamini bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaokolewa.” Wakati uliopo wa Kigiriki unaweza kueleweka kuwa unaonyesha tendo linaloendelea (“mnaendelea kuokolewa”) au hali ya jumla (“mnaokolewa”).
    reason: lexical_alternative
  - marker: b
    text: Kwa uhalisi, “ikiwa mnashikilia imara, kwa/katika ujumbe gani niliowahubiria.” Muundo wa Kigiriki unaweza kueleweka kuwa unahusisha kushikilia imara na namna au maudhui ya ujumbe uliotangazwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: ambayo kwa hiyo
  rationale: Kishazi hiki kinaonyesha njia au chombo na kinarejelea habari njema ya mstari wa 1. Muundo huu huhifadhi maana ya ‘kwa njia ya hiyo,’ ingawa Kiswahili cha sentensi nzima kinahitaji kiwakilishi rejeshi.
- source_word: σῴζεσθε
  choice: mnaendelea kuokolewa
  rationale: Wakati uliopo wa kitenzi tendwa unaweza kuonyesha tendo linaloendelea. Tafsiri hii huhifadhi hali hiyo bila kuingiza mfumo fulani wa mafundisho.
- source_word: τίνι λόγῳ
  choice: ujumbe
  rationale: Katika muktadha, λόγος ni ujumbe au maudhui ya tangazo la habari njema. ‘Ujumbe’ ni Kiswahili cha kawaida na wazi kuliko tafsiri halisi ‘neno gani,’ huku tanbihi ikihifadhi muundo wa Kigiriki.
- source_word: εὐηγγελισάμην
  choice: niliowatangazia kuwa habari njema
  rationale: Kitenzi hiki ni kutangaza habari njema. Kauli hii huhifadhi wazi maana ya habari njema badala ya kutumia tu ‘kuhubiri,’ ambalo linaweza kuwa pana zaidi.
- source_word: κατέχετε
  choice: mnashikilia kwa uthabiti
  rationale: Kitenzi kina maana ya kuendelea kushika, kuhifadhi, au kuambatana na jambo. Kauli hii ni ya kawaida na inadumisha nguvu ya sharti.
- source_word: ἐκτὸς εἰ μὴ
  choice: isipokuwa kama
  rationale: Nahau hii huanzisha hali ya kuondoa uwezekano uliotangulia; ‘isipokuwa kama’ ni ya asili na huhifadhi tahadhari hiyo.
- source_word: εἰκῇ
  choice: bure
  rationale: Hapa neno lina maana ya bila matokeo, bila kusudi, au pasipo faida. ‘Bure’ ni fupi, ya kawaida, na huhifadhi onyo la Paulo.
- source_word: ἐπιστεύσατε
  choice: mliamini
  rationale: Wakati timilifu wa Kigiriki unarejelea tendo lao la kuamini walipopokea habari njema. ‘Mliamini’ ni tafsiri ya moja kwa moja.
theological_decisions:
- issue: Hali ya wokovu katika σῴζεσθε
  choice: mnaendelea kuokolewa
  alternative: mnaokolewa
  rationale: Tafsiri teule inadhihirisha uwezekano wa tendo linaloendelea katika wakati uliopo, bila kuamua mjadala wa kitheolojia kuhusu hatua za wokovu. Tanbihi inataja tafsiri ya jumla zaidi.
- issue: Sharti εἰ κατέχετε
  choice: ikiwa mnashikilia kwa uthabiti
  alternative: kwa kuwa mnashikilia kwa uthabiti
  rationale: Muundo wa sharti umehifadhiwa bila kuufanya ushahidi wa imani ya kweli wala sharti linalodhaniwa tayari kutimizwa. Hivyo mvutano wa kauli ya Paulo unabaki wazi.
- issue: Onyo la εἰκῇ ἐπιστεύσατε
  choice: isipokuwa kama mliamini bure
  alternative: la sivyo imani yenu ilikuwa bure
  rationale: Kauli inabaki kama uwezekano wa tahadhari, bila kufafanua kimadhehebu namna ambavyo kuamini kungeweza kuwa bure.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha imewekwa wazi kwa msomaji wa kawaida, huku hali inayoendelea ya σῴζεσθε, sharti la εἰ κατέχετε, na uwezekano wa onyo la mwisho vikihifadhiwa. Alama zote za tanbihi zimewekwa katika maandishi.
