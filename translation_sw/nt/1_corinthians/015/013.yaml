  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: sw
  text: Lakini ikiwa hakuna ufufuo wa wafu, basi hata Masihi[a] hajafufuliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au “Kristo”; hapa “Masihi” limetumiwa ili kudumisha maana ya cheo hicho.
    reason: alternative_reading
  - marker: b
    text: Au, “hajafufuka.” Kitenzi cha Kigiriki kiko katika kauli tendwa, “hajafufuliwa,” ambayo inaweza kudokeza tendo la Mungu bila kumtaja mtendaji waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: “Ikiwa” huanzisha sharti, na “lakini” hudumisha geuko lenye ukinzani wa kiasi katika hoja ya Paulo.
- source_word: ἀνάστασις
  choice: ufufuo
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa tendo au hali ya kufufuliwa kutoka kwa wafu.
- source_word: νεκρῶν
  choice: wa wafu
  rationale: Huhifadhi muundo unaowataja wafu kama kundi linalohusika na ufufuo, bila kuugeuza kuwa usemi wa mahali au chanzo.
- source_word: οὐκ ἔστιν
  choice: hakuna
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili ukanushaji wa kuwepo au uhalisi wa ufufuo.
- source_word: οὐδὲ
  choice: basi hata ... haja-
  rationale: “Basi hata” huonyesha hitimisho la kimantiki na nguvu ya ‘not even’ katika hoja.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno la Kigiriki ni cheo chenye maana ya Mpakwa Mafuta; “Masihi” hudumisha maana yake ya cheo katika muktadha huu.
- source_word: ἐγήγερται
  choice: hajafufuliwa
  rationale: 'Huhifadhi kauli tendwa na hali timilifu ya kitenzi: tendo limekwisha kutokea na matokeo yake yanaendelea, bila kumtaja wazi mtendaji.'
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja hii neno lina nguvu ya cheo cha Mpakwa Mafuta. “Masihi” huwasilisha maana hiyo, huku “Kristo” likitajwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- issue: Kauli ya ἐγήγερται
  choice: hajafufuliwa
  alternative: hajafufuka
  rationale: Kigiriki kina kauli tendwa; tafsiri hii huihifadhi na haiongezi wazi kwamba Mungu ndiye mtendaji, ingawa hilo linaweza kudokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida, huku muundo wa sharti na hitimisho la hoja ukihifadhiwa.
