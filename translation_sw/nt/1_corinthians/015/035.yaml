  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: sw
  text: Lakini mtu fulani atasema[a], “Wafu wanafufuliwaje, nao wanakuja na mwili wa namna gani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wafu wanafufukaje?” Kitenzi cha Kigiriki kiko katika hali ya kutendwa, kihalisi “wanafufuliwaje,” jambo linaloweza kudokeza kwamba Mungu ndiye anayewafufua.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji kuelekea swali au pingamizi linalotarajiwa.
- source_word: ἐρεῖ τις
  choice: mtu fulani atasema
  rationale: Wakati ujao na kiwakilishi kisichomtaja mtu maalumu huwasilisha msemaji wa kudhaniwa; tafsiri hii pia inadumisha umbo la wakati ujao.
- source_word: Πῶς
  choice: -je
  rationale: Kiambishi cha kuuliza katika “wanafufuliwaje” kinauliza namna au uwezekano kwa Kiswahili cha kawaida.
- source_word: ἐγείρονται
  choice: wanafufuliwa
  rationale: Inahifadhi hali ya kutendwa iliyo wazi katika Kigiriki na haimtaji moja kwa moja mtendaji ambaye kifungu hakimtaji.
- source_word: οἱ νεκροί
  choice: wafu
  rationale: Ni neno la kawaida na la asili kwa kundi la watu waliokufa.
- source_word: ποίῳ ... σώματι
  choice: na mwili wa namna gani
  rationale: “Wa namna gani” inadumisha maana ya ubora au aina inayoulizwa na ποίῳ, huku “na” ikitoa dative kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: nao
  rationale: Hiki huunganisha swali la pili na la kwanza bila kuingiza utofautishaji mkali.
- source_word: ἔρχονται
  choice: wanakuja
  rationale: Inatafsiri ἔρχομαι moja kwa moja bila kuibadili kuwa “wanaonekana” au kurudia “wanafufuliwa.”
theological_decisions:
- issue: Maneno ya ufufuo na mtendaji
  choice: Wafu wanafufuliwaje
  alternative: Wafu wanafufukaje
  rationale: Hali ya kutendwa ya ἐγείρονται inadumishwa ili kuhifadhi uwezekano wa kudokeza utendaji wa Mungu, bila kumtaja wazi zaidi ya andiko lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa maswali unabaki wa moja kwa moja, na hali ya kutendwa katika swali la kwanza imehifadhiwa.
