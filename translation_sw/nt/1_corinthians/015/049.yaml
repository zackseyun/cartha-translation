reference: 1 Corinthians 15:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: sw
  text: Na kama vile tulivyobeba mfano wa yule wa mavumbi, vivyo hivyo tutabeba pia mfano wa yule wa mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “na tubebe pia mfano wa yule wa mbinguni.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: kama vile ... ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho na ulinganifu kati ya hali inayohusishwa na yule wa mavumbi na hali ya baadaye inayohusishwa na yule wa mbinguni.
- source_word: ἐφορέσαμεν
  choice: tulivyoivaa
  rationale: Kitenzi φορέω kina wazo la kuvaa au kubeba kwa kuendelea. Katika Kiswahili, “kuivaa sura” ni lugha ya sitiari inayoeleweka na huhifadhi picha ya chanzo bila kuifanya kuwa maelezo tu.
- source_word: εἰκόνα
  choice: sura
  rationale: “Sura” hapa humaanisha mfano au umbo linalomwakilisha mtu; ni ya asili katika Kiswahili katika kirai “kuivaa sura” na huhifadhi ulinganifu wa Adamu na Kristo.
- source_word: τοῦ χοϊκοῦ
  choice: ya yule wa mavumbi
  rationale: “Yule wa mavumbi” huhifadhi rejeo la χοϊκός kwa mavumbi na mwangwi wa simulizi la uumbaji, bila kulifanya neno hilo kuwa “wa duniani,” ambalo linaweza kupunguza picha ya mavumbi.
- source_word: φορέσομεν
  choice: tutakavyoivaa
  rationale: Hufuata usomaji wa wakati ujao wa SBLGNT na kuwasilisha tumaini la mabadiliko yajayo. Usomaji wa kuhimiza umewekwa katika tanbihi.
- source_word: τοῦ ἐπουρανίου
  choice: ya yule wa mbinguni
  rationale: “Yule wa mbinguni” huhifadhi kivumishi kilichotumiwa kama nomino na ulinganifu wake na “yule wa mavumbi,” huku muktadha ukimtambulisha anayerejelewa.
- source_word: καὶ
  choice: Na ... pia
  rationale: “Na” huunganisha mstari na hoja iliyotangulia, na “pia” huonyesha nguvu ya nyongeza katika sehemu ya pili.
theological_decisions:
- issue: Wakati ujao elekezi dhidi ya hali ya kuhimiza katika kitenzi cha pili
  choice: tutakavyoivaa pia
  alternative: na tuivae pia
  rationale: Matini iliyochapishwa ya SBLGNT ina φορέσομεν, wakati ujao elekezi, inayofaa hoja kuhusu kufanana kwa ufufuo ujao na yule wa mbinguni. Usomaji muhimu wa φορέσωμεν, unaotoa himizo, haujafichwa bali umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa “kama vile ... ndivyo” unatoa ulinganifu wa kawaida wa Kiswahili. “Yule wa mavumbi” na “yule wa mbinguni” huhifadhi ulinganifu wa Kigiriki na mwangwi wa Adamu/Kristo bila kuongeza jina lisilokuwamo wazi katika mstari.
