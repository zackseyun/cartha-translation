  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: sw
  text: Lakini ikiwa inahubiriwa kwamba Kristo[a] amefufuliwa kutoka kwa wafu, inawezekanaje baadhi yenu kusema kwamba hakuna ufufuo wa wafu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Masihi.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” au “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Kristo
  rationale: Katika Kiswahili sanifu, “Kristo” ni neno la kawaida na lenye hadhi kwa cheo hiki; linaendelea kutambulika kama cheo cha Masihi bila kulifanya jina la kawaida tu.
- source_word: κηρύσσεται
  choice: inahubiriwa
  rationale: Kauli ya kutendwa katika wakati wa sasa inaonyesha ujumbe unaotangazwa hadharani na kwa kuendelea.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kufufuliwa kutoka miongoni mwa waliokufa.
- source_word: ἐγήγερται
  choice: amefufuliwa
  rationale: Huhifadhi kauli ya kutendwa na matokeo yanayoendelea ya tendo lililokamilika; pia haiufanyi wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: πῶς
  choice: inawezekanaje
  rationale: Huwasilisha nguvu ya swali la balagha linaloonyesha kutopatana kwa madai hayo mawili.
- source_word: ἐν ὑμῖν τινες
  choice: baadhi yenu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kikundi kidogo ndani ya jumuiya ya waandikiwa.
- source_word: ἀνάστασις νεκρῶν
  choice: ufufuo wa wafu
  rationale: Huhifadhi muundo mpana unaorejelea ufufuo wa watu waliokufa kwa ujumla.
- source_word: οὐκ ἔστιν
  choice: hakuna
  rationale: Hutoa kwa kawaida maana ya kuwepo inayokanushwa katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa Χριστός katika hoja ya Paulo
  choice: Kristo
  alternative: Masihi
  rationale: “Kristo” ndiyo istilahi iliyozoeleka zaidi katika Kiswahili sanifu cha Biblia na bado ni cheo; tanbihi inaonyesha kwa uwazi maana mbadala ya “Masihi” bila kuficha upeo wa neno la Kigiriki.
- issue: Kauli tendwa katika ἐγήγερται
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kauli tendwa huhifadhi umbo la Kigiriki na dokezo lisilotamkwa wazi la tendo la Mungu, bila kumtaja mtendaji moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umefanywa wa kawaida kwa msomaji huku tofauti kati ya kufufuliwa kwa Kristo na ufufuo wa wafu kwa ujumla ikihifadhiwa.
