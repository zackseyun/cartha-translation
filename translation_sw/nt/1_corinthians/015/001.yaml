  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: sw
  text: Ninawajulisha, ndugu[a], habari njema niliyowahubiria, ambayo pia mliipokea na ambamo pia mmesimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina umbo la ‘ndugu wa kiume,’ lakini mara nyingi hutumiwa kulihutubia kusanyiko lote la waumini, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Ninawajulisha
  rationale: Kitenzi hiki kwa msingi humaanisha kufanya jambo lijulikane au kutoa taarifa. Tafsiri hii huepuka kukibadili kuwa ‘ninawakumbusha,’ ingawa katika muktadha Paulo anarejelea ujumbe ambao tayari wanaujua.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno tofauti
  rationale: δέ hapa ni kiunganishi hafifu cha mpito. Kiswahili hakihitaji lazima neno kama ‘basi’ au ‘lakini’ katika sentensi hii; kutokiacha kiwekwe wazi kunaleta mtiririko wa kawaida bila kuingiza maana ya wakati.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni namna ya kawaida na yenye heshima ya kuhutubia jumuiya kwa Kiswahili, na inaweza kuwahusu waumini wanaume na wanawake bila kulazimisha jinsia ambayo neno la Kiswahili halibainishi hapa.
- source_word: τὸ εὐαγγέλιον
  choice: habari njema
  rationale: Hii inatoa maana ya moja kwa moja ya εὐαγγέλιον kwa lugha inayoeleweka kwa wasomaji wa kawaida, huku ikiendelea kuwa istilahi inayofaa katika muktadha wa Kikristo.
- source_word: εὐηγγελισάμην
  choice: niliyowahubiria
  rationale: Kitenzi kinamaanisha kutangaza habari njema. ‘Kuhubiri’ ni kitenzi cha kawaida cha Kiswahili katika muktadha huu na huonyesha tangazo la hadharani bila marudio yasiyo ya kawaida ya ‘habari njema.’
- source_word: παρελάβετε
  choice: mliipokea
  rationale: Huhifadhi maana pana ya kupokea ujumbe au mapokeo bila kuongeza wazo lenye nguvu zaidi la kuukubali kwa hiari.
- source_word: ἐν ᾧ
  choice: ambayo ndani yake
  rationale: Huhifadhi taswira ya injili kuwa mazingira au msingi ambamo waumini wanasimama, badala ya kuifanya mapema kuwa chombo cha wokovu kama ‘ambayo kwayo.’
- source_word: ἑστήκατε
  choice: mnasimama imara
  rationale: Kauli ya timilifu ya Kigiriki inaonyesha hali ya sasa iliyotokana na tendo la awali. ‘Mnasimama imara’ ni Kiswahili cha kawaida kinachoonyesha hali hiyo endelevu.
theological_decisions:
- issue: Je, ἀδελφοί inawahusu wanaume pekee au kusanyiko lote?
  choice: ndugu katika matini, pamoja na tanbihi inayoeleza matumizi yake
  alternative: ndugu wanaume na wanawake
  rationale: Neno la Kigiriki lina umbo la kiume lakini mara nyingi Paulo hulitumia kulihutubia kusanyiko lote. ‘Ndugu’ huhifadhi namna ya moja kwa moja ya mwito wa kifamilia kwa Kiswahili, huku tanbihi ikihifadhi ufafanuzi wa upeo wake.
- issue: Nguvu ya ἐν ᾧ kuhusiana na habari njema
  choice: ambayo ndani yake mnasimama imara
  alternative: ambayo kwayo mnasimama imara
  rationale: ‘Ndani yake’ hufuata ἐν ᾧ kwa ukaribu na kuhifadhi uwezekano wa habari njema kuwa mazingira au msingi wa msimamo wao, bila kuiunganisha moja kwa moja na kauli ya wokovu ya mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na mfuatano wa Kigiriki bila kuwa mgumu katika Kiswahili.
