  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: sw
  text: Kama alivyo mtu wa mavumbi,[a] ndivyo walivyo pia walio wa mavumbi; na kama alivyo mtu wa mbinguni, ndivyo walivyo pia walio wa mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Alivyo mtu wa mavumbi, ndivyo walivyo pia walio wa mavumbi; na alivyo mtu wa mbinguni, ndivyo walivyo pia walio wa mbinguni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Kama alivyo ... ndivyo walivyo pia ...
  rationale: Muundo huu wa uwiano unaonyesha ulinganifu kati ya mwakilishi na wale walio wa aina yake, huku ukihifadhi usambamba wa sentensi kwa Kiswahili cha kawaida.
- source_word: χοϊκός
  choice: wa mavumbi
  rationale: Neno hili humaanisha aliyefanywa kwa mavumbi au mwenye asili ya mavumbi. Tafsiri hii inadumisha mwangwi wa kuumbwa kwa Adamu kutoka mavumbini na kuepuka maana pana ya “wa duniani.”
- source_word: ὁ χοϊκός
  choice: mtu wa mavumbi
  rationale: Katika muktadha, umoja huu unamrejelea Adamu kama mwakilishi wa wanadamu. Kuongeza “mtu” hufanya Kiswahili kiwe wazi na cha kawaida bila kumtaja Adamu moja kwa moja.
- source_word: οἱ χοϊκοί
  choice: walio wa mavumbi
  rationale: Wingi huu unarejelea watu wanaoshiriki hali au asili ya mtu wa mavumbi. Usemi huu huhifadhi uhusiano wa kileksia na χοϊκός ya umoja.
- source_word: ἐπουράνιος
  choice: wa mbinguni
  rationale: Kivumishi hiki humaanisha wa mbinguni au anayehusiana na mbingu. “Wa mbinguni” hudumisha tofauti na “wa mavumbi” bila kuingiza maneno ya mstari wa 47, “kutoka mbinguni.”
- source_word: ὁ ἐπουράνιος
  choice: mtu wa mbinguni
  rationale: Muktadha unamwelekeza Kristo kwa kulinganisha na Adamu. “Mtu wa mbinguni” huhifadhi ulinganifu wa watu wawili wawakilishi bila kuweka jina ambalo halipo katika mstari huu.
- source_word: οἱ ἐπουράνιοι
  choice: walio wa mbinguni
  rationale: Usemi huu unawaonyesha watu wanaolingana na mtu wa mbinguni kwa hali au uhusiano, na hauwafanyi moja kwa moja kuwa malaika.
theological_decisions:
- issue: Kama utofauti wa Adamu na Kristo ufanywe wazi kwa kuongeza neno “mtu” katika vifungu vya umoja
  choice: mtu wa mavumbi ... mtu wa mbinguni
  alternative: yule wa mavumbi ... yule wa mbinguni
  rationale: Muktadha wa 1 Wakorintho 15:45–49 unatofautisha Adamu na Kristo kama watu wawakilishi. “Mtu” hufafanua rejeleo kwa Kiswahili bila kuongeza jina au dai lisilokuwamo katika mstari.
- issue: Kama οἱ ἐπουράνιοι ni viumbe wa mbinguni au watu wanaolingana na mtu wa mbinguni
  choice: walio wa mbinguni
  alternative: wale wa mbinguni
  rationale: Muktadha unahusu ufufuo wa wanadamu na kufanana kwao na mtu wa mbinguni, si malaika. Tafsiri hii inadumisha rejeleo la kibinadamu huku ikiacha wazi namna kamili ya ulinganifu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Usambamba wa vifungu viwili umehifadhiwa, na “mavumbi” limetumiwa ili kudumisha mwangwi wa simulizi la Adamu.
