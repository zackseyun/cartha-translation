base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: sw
  text: Lakini Mungu ashukuriwe, anayetupa ushindi kwa njia ya Bwana wetu Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kawaida pia: “Yesu Kristo.” Cheo cha Kigiriki Χριστός kinamaanisha “Masihi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mgeuko wenye utofauti mdogo kutoka kwa maelezo yaliyotangulia kuhusu dhambi na kifo kwenda kwenye shukrani kwa ushindi.
- source_word: τῷ θεῷ χάρις
  choice: Mungu ashukuriwe
  rationale: Hapa χάρις ni sehemu ya kauli ya kumshukuru Mungu, si neno lenye maana ya neema. Muundo huu ni wa kawaida, wenye heshima, na unahifadhi nguvu ya sifa katika Kigiriki.
- source_word: τῷ διδόντι
  choice: anayetupa
  rationale: Kirai cha wakati wa sasa kinamtambulisha Mungu kuwa ndiye anayetoa ushindi; 'anayetupa' ni cha asili na kinahifadhi maana ya kitendo kinachoendelea au tabia ya Mungu.
- source_word: ἡμῖν
  choice: -tupa
  rationale: Kiambishi '-tu-' kinaonyesha kwamba ushindi unatolewa kwetu, kama ilivyo katika hali ya utoaji ya Kigiriki.
- source_word: τὸ νῖκος
  choice: ushindi
  rationale: Neno hili linarejelea ushindi maalumu dhidi ya kifo ulioelezwa katika muktadha. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na τὸ.
- source_word: διὰ
  choice: kwa njia ya
  rationale: διά pamoja na umilikishi huonyesha njia au wakala; 'kwa njia ya' linaeleza wazi kwamba ushindi unatolewa kupitia Yesu.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya cheo cha Kikristo κύριος pamoja na kiwakilishi ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Ἰησοῦ ni jina, na Χριστοῦ ni cheo chenye maana ya Masihi, yaani Mtiwa-Mafuta. Kiswahili cha kawaida hakihitaji kibainishi kati ya jina na cheo hiki.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: ‘Masihi’ huwasilisha maana ya cheo cha Kigiriki Χριστός badala ya kukitumia tu kama sehemu ya jina. Njia ya kimapokeo ‘Yesu Kristo’ imewekwa katika tanbihi ili kudumisha uwazi na utambuzi wa matumizi yaliyozoeleka.
- issue: Aina ya ushindi unaotolewa na Mungu
  choice: ushindi
  alternative: kushinda
  rationale: Nomino νῖκος na muktadha wa karibu huonyesha ushindi maalumu juu ya kifo. Tafsiri haiongezi maelezo ya kimadhehebu kuhusu namna au wakati wa kuupokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Mungu ashukuriwe’ una sauti ya sifa bila kuwa wa kizamani; ‘anayetupa’ ni rahisi kueleweka kuliko muundo mzito wa kishiriki. ‘Yesu Masihi’ huhifadhi cheo, huku njia ya kimapokeo ikibaki katika tanbihi.
