base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: sw
  text: Kwa maana ni lazima atawale mpaka atakapowaweka adui zake wote chini ya miguu yake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka awaweke adui zake wote chini ya miguu yake.” Muundo wa Kigiriki wenyewe haulazimishi tofauti ya maana kati ya namna hizi mbili za kueleza wakati wa tendo hilo katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Taswira ya kuwaweka adui “chini ya miguu yake” ni tamathali ya kibiblia ya kutiishwa kabisa; linganisha Zaburi 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: ni lazima
  rationale: Inaonyesha ulazima au jambo lililokusudiwa na Mungu kutimia; “ni lazima” ni Kiswahili cha kawaida kinachohifadhi nguvu ya neno hilo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu au msingi wa kauli hiyo.
- source_word: αὐτὸν
  choice: a- (yeye)
  rationale: 'Ingawa katika Kigiriki ni mtenda wa kitenzi-jina katika muundo wa kihusishi, Kiswahili cha kawaida hutumia kitenzi chenye kiambishi cha nafsi: “atawale.”'
- source_word: βασιλεύειν
  choice: atawale
  rationale: Huwasilisha utawala wa kifalme kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: ἄχρι οὗ
  choice: mpaka
  rationale: Huonyesha kikomo cha wakati kinachotazamwa katika sentensi, bila kudai kwamba utawala utakoma baada ya hapo.
- source_word: θῇ
  choice: atakapowaweka
  rationale: Kitenzi τίθημι hapa kina maana ya kuweka; muundo wa “mpaka atakapowaweka” ni wa kawaida katika Kiswahili na unaonyesha tendo linalotarajiwa kukamilika.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: adui zake wote
  rationale: Huhifadhi ujumla wa πάντας na huonyesha kwa kawaida kwamba hao ni maadui wake.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: chini ya miguu yake
  rationale: Huhifadhi moja kwa moja tamathali ya kibiblia inayoonyesha kutiishwa kabisa.
theological_decisions:
- issue: Nguvu ya wakati ya ἄχρι οὗ (“mpaka”)
  choice: Imetafsiriwa “mpaka” bila kudokeza kwamba utawala wa Kristo utakoma baadaye.
  alternative: Tafsiri au ufafanuzi unaodokeza kwamba utawala wake unakoma mara adui wanapotiishwa.
  rationale: Muundo wa Kigiriki huonyesha hatua ya wakati inayolengwa, lakini wenyewe hausemi kwamba tendo hilo linakoma baada ya hatua hiyo; tafsiri inadumisha mvutano huo bila kuamua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mantiki ya sababu, lugha ya kifalme, na tamathali ya awali bila kuongeza hitimisho la kimadhehebu.
