id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: sw
  text: Kwa maana kama vile katika Adamu wote wanakufa, vivyo hivyo pia katika Masihi wote watafanywa kuwa hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.” Cheo cha Kigiriki Χριστός kinaweza kunakiliwa kuwa “Kristo” au kutafsiriwa kuwa “Masihi”; hapa kimetafsiriwa kwa maana yake.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” huhifadhi nguvu ya maelezo ya γάρ, na “kama vile” huanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ Ἀδὰμ
  choice: katika Adamu
  rationale: Huhifadhi kwa ukaribu lugha fupi ya uwakilishi au mshikamano bila kuigeuza kuwa uhusiano wa chombo kama “kupitia Adamu.”
- source_word: πάντες
  choice: wote
  rationale: Huhifadhi upana usio na kibainishi wa neno la Kigiriki na usambamba wa kutajwa kwake mara mbili.
- source_word: ἀποθνῄσκουσιν
  choice: wanakufa
  rationale: Wakati uliopo unaeleza hali ya jumla inayohusishwa na Adamu; “wanakufa” ni ya asili na huhifadhi hali hiyo.
- source_word: οὕτως καὶ
  choice: vivyo hivyo pia
  rationale: Huhifadhi muundo wa ulinganisho pamoja na nguvu ya nyongeza ya καί.
- source_word: ἐν τῷ Χριστῷ
  choice: katika Masihi
  rationale: Χριστός hapa ni cheo; “Masihi” hutafsiri maana yake na kudumisha usambamba na “katika Adamu.”
- source_word: ζῳοποιηθήσονται
  choice: watafanywa kuwa hai
  rationale: Huhifadhi wakati ujao na hali tendwa ya kitenzi, bila kuficha tendo la kumpa mtu uhai.
theological_decisions:
- issue: Upeo wa “wote” katika vifungu vyote viwili
  choice: Kuacha “wote” bila kuwekewa kikomo katika sehemu zote mbili
  alternative: Kufafanua “wote” ya pili kuwa waamini wote tu, au kuamua kwamba zote mbili zinawahusu wanadamu wote kwa maana ileile kabisa
  rationale: Kigiriki kina usambamba wa makusudi πάντες… πάντες lakini hakitatui hapa upeo na utaratibu wake wote wa kiteolojia; tafsiri inalinda mvutano huo.
- issue: Maana ya ἐν katika “katika Adamu” na “katika Masihi”
  choice: Kutumia “katika” katika vifungu vyote viwili
  alternative: “kwa njia ya,” “kwa kuungana na,” au ufafanuzi mwingine
  rationale: “Katika” huhifadhi ulinganifu na utata halisi wa uhusiano wa uwakilishi au mshikamano bila kuufafanua kupita maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa hoja na usambamba wa sentensi ya Kigiriki umehifadhiwa bila kuleta ufafanuzi wa kimadhehebu.
