  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: sw
  text: Hupandwa mwili wa asili; hufufuliwa mwili wa kiroho. Ikiwa kuna mwili wa asili[a], kuna pia mwili wa kiroho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili wa nafsi” ... “mwili wa kiroho.” Tofauti anayoweka Paulo si kati ya mwili wenye maada na mwili usio na maada, bali kati ya mwili wenye uhai wa kawaida wa kibinadamu na mwili unaohuishwa na Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: hupandwa
  rationale: Huhifadhi kauli tendwa ya wakati uliopo na taswira ya kupanda mbegu inayotawala muktadha wa karibu.
- source_word: σῶμα
  choice: mwili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; hapa inamaanisha mwili wa mwanadamu katika kufa na kufufuliwa.
- source_word: ψυχικόν
  choice: wa asili
  rationale: Hueleza mwili unaohusishwa na uhai wa kawaida wa kibinadamu bila kuudokeza kuwa ni mwili wa nyama tu au mwili usio wa kiroho. Tanbihi inaeleza tofauti hii kwa uwazi zaidi.
- source_word: ἐγείρεται
  choice: hufufuliwa
  rationale: Katika muktadha wa ufufuo, kitenzi hiki kinaelezwa kwa Kiswahili cha kawaida na sahihi kuwa ‘hufufuliwa,’ huku kauli tendwa ikihifadhiwa.
- source_word: πνευματικόν
  choice: wa rohoni
  rationale: Huhifadhi tofauti ya Paulo kati ya ψυχικόν na πνευματικόν kwa lugha ya kawaida, bila kuugeuza mwili wa ufufuo kuwa kitu kisicho na mwili.
- source_word: Εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti wa Kigiriki bila kuubadili kimafasiri kuwa kauli ya sababu au uhakika.
- source_word: καὶ
  choice: pia
  rationale: 'Huonyesha nguvu ya nyongeza: kuwapo kwa mwili wa asili kunaambatana na kuwapo kwa mwili wa rohoni.'
theological_decisions:
- issue: Tofauti kati ya ‘mwili wa asili’ na ‘mwili wa rohoni’
  choice: Maandishi makuu yanahifadhi tofauti kati ya mwili unaohusishwa na uhai wa kawaida wa kibinadamu na mwili unaohusishwa na Roho.
  alternative: Kutafsiri kuwa tofauti kati ya ‘mwili wa kimwili’ na ‘mwili usio wa kimwili,’ au kutumia ‘mwili wa nafsi’ na ‘mwili wa roho.’
  rationale: Maneno ya Paulo hayapinganishi mwili wenye maada na hali isiyo na mwili. Tafsiri hii huhifadhi msamiati na mvutano wa kifungu, na tanbihi huzuia dhana kwamba mwili wa ufufuo si mwili halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba ‘hupandwa ... hufufuliwa’ unahifadhi urari na taswira ya Kigiriki; ‘wa asili’ na ‘wa rohoni’ ni vifungu vifupi na vya kawaida vinavyofaa muktadha wa mafundisho ya ufufuo.
