    issue: The main verb slightly shifts from being in danger to facing danger.
    rationale: '''Tunakabili hatari'' is acceptable in context, but ''tunakuwa hatarini'' is a more direct representation of κινδυνεύομεν as a state of exposure to danger.'
  - severity: medium
    issue: The footnote inserts an unexpressed causal element.
    rationale: The bracketed '[kinachofanya]' means 'that which makes/causes' and is not present in τί καὶ ἡμεῖς κινδυνεύομεν πᾶσαν ὥραν. A note should preserve the source's marked wording without adding that causal predicate.
