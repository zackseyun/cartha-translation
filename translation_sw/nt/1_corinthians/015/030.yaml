  verdict: revise
  source_fidelity: The main rhetorical-question rendering correctly represents τί as a contextual 'why,' retains the additive force of καὶ ('pia'), and conveys the continual force of πᾶσαν ὥραν. However, 'tunakabili hatari' can suggest actively confronting danger, whereas κινδυνεύομεν more directly denotes being in danger. The supplied footnote's proposed literal alternative adds '[kinachofanya]' ('what makes'), which is not expressed in the Greek and shifts the construction.
  naturalness: '''Kwa nini sisi pia tunakuwa hatarini kila saa?'' is idiomatic, clear Standard East African Swahili and preserves the rhetorical force. The footnote has been recast so that it explains the Greek construction without presenting an unnatural and semantically expanded Swahili sentence as a literal rendering.'
  terminology: No doctrinal or specialized theological terminology occurs in the verse. 'Hatarini' accurately communicates the state denoted by κινδυνεύομεν without limiting it to a particular kind of peril.
  issues:
