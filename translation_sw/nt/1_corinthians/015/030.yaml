  text: Why are we also in danger every hour?[a]
translation:
  language: sw
  text: Kwa nini sisi pia tunakuwa hatarini kila saa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kigiriki, “Ni nini pia kwamba sisi tunakuwa hatarini kila saa?” Katika muktadha, swali hili la balagha humaanisha, “Kwa nini sisi pia tunakuwa hatarini kila saa?”
    reason: Mbadala wa kileksika unaoonyesha kwamba τί inaweza kutafsiriwa kwa maana yake ya moja kwa moja zaidi, ingawa muktadha unaunga mkono “Kwa nini.”
lexical_decisions:
- source_word: τί
  choice: Kwa nini
  rationale: Katika swali hili la balagha, τί inauliza sababu au maana ya tendo katika hoja ya Paulo, si kitu fulani; “Kwa nini” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: pia
  rationale: Huwaongeza Paulo na wenzake katika mifano iliyotangulia; “pia” huonyesha maana hiyo ya nyongeza kwa kawaida.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kimehifadhiwa. “Sisi” pia hudumisha msisitizo wa kiasi bila kuongeza tafsiri isiyokuwamo.
- source_word: κινδυνεύομεν
  choice: tunakabili hatari
  rationale: Kitenzi kinamaanisha kuwa hatarini au kukabili hatari. Usemi huu ni wa asili katika Kiswahili na haubani maana kuwa kuhatarisha maisha pekee.
- source_word: πᾶσαν ὥραν
  choice: kila saa
  rationale: Usemi huu unaonyesha kuendelea kukabili hatari; “kila saa” huhifadhi taswira ya Kigiriki kwa karibu huku ukiwa wazi kwa msomaji wa sasa.
theological_decisions:
- issue: Nguvu ya swali la balagha katika hoja ya Paulo kuhusu ufufuo
  choice: Mstari umetafsiriwa kama swali la balagha linaloonyesha kutokuwa na maana kwa mitume kukabili hatari ikiwa wafu hawafufuliwi.
  alternative: Kutafsiri τί moja kwa moja kama “Ni nini” na kuacha uhusiano wa sababu ukiwa mgumu zaidi.
  rationale: Muundo wa Kigiriki na muktadha wa karibu vinaunga mkono swali la sababu. Tafsiri hii huhifadhi mvutano wa hoja bila kuingiza dai jingine la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tunakabili hatari” ni cha kawaida na sahihi kuliko usemi mzito wa “tumo hatarini,” huku “kila saa” ikihifadhi umbo la chanzo.
