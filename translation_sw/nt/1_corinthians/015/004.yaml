lexical_decisions:
- source_word: ἐτάφη
  choice: alizikwa
  rationale: Kitenzi hiki ni aoristi tendwa cha θάπτω. “Alizikwa” ni Kiswahili cha kawaida kinachohifadhi kauli ya kutendwa bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: ἐγήγερται
  choice: amefufuliwa
  rationale: Ni timilifu tendwa ya ἐγείρω. “Amefufuliwa” huonyesha tendo lililokamilika lenye matokeo yanayoendelea, huku ikihifadhi kauli ya kutendwa.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: siku ya tatu
  rationale: Huu ni usemi wa wakati unaomaanisha “siku ya tatu.” Tafsiri hii ni ya kawaida na haiongezi neno kama “baada ya,” ambalo halipo katika Kigiriki.
- source_word: κατὰ τὰς γραφάς
  choice: kulingana na Maandiko
  rationale: Usemi huu unaonyesha kupatana na ushuhuda wa Maandiko. “Kulingana na Maandiko” ni wa kawaida na huhifadhi muundo unaorudiwa katika muktadha.
- source_word: γραφάς
  choice: Maandiko
  rationale: Katika matumizi haya, γραφαί hurejelea maandishi matakatifu yanayotambuliwa, si maandishi ya kawaida tu.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutanguliza vipashio vya maudhui katika mfululizo huu wa kukiri imani. Kurudia “kwamba” huhifadhi mpangilio na mahadhi ya Kigiriki.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachorudiwa katika mfululizo; kimehifadhiwa kwa uaminifu kwa muundo wa chanzo.
theological_decisions:
- issue: Namna ya kutafsiri kitenzi cha ufufuo kwa kuzingatia hali ya tendo na kauli
  choice: amefufuliwa
  alternative: alifufuliwa; amefufuka
  rationale: Timilifu tendwa ἐγήγερται huonyesha ufufuo kama tendo lililokamilika lenye umuhimu unaodumu. “Amefufuliwa” huhifadhi kauli ya kutendwa na nguvu ya timilifu; “alifufuliwa” inaweza kusisitiza tukio la wakati uliopita, na “amefufuka” hubadili kauli kuwa hali ya kutenda.
- issue: Kinachorejelewa na neno γραφάς
  choice: Maandiko
  alternative: Maandiko ya Kiyahudi; maandishi matakatifu
  rationale: Usemi wa Paulo hurejelea mkusanyo wa Maandiko uliotambuliwa bila kuufafanua zaidi. Kuongeza “ya Kiyahudi” au “matakatifu” kungeingiza ufafanuzi usiotajwa wazi katika Kigiriki.
- issue: Uhusiano wa kirai κατὰ τὰς γραφάς na maziko au ufufuo
  choice: kulingana na Maandiko kimeunganishwa moja kwa moja na kufufuliwa
  alternative: kirai hicho kinaweza kueleweka kuwa kinahusu pia kuzikwa
  rationale: Nafasi ya kirai katika sentensi inakiunganisha kwa karibu zaidi na kufufuliwa siku ya tatu, lakini mfuatano wa kauli unaweza kuruhusu kueleweka kuwa ushuhuda wa Maandiko unahusu pia maziko. Uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kurudia “na kwamba” umehifadhiwa ili kuonyesha mahadhi ya tamko la kukiri imani. “Amefufuliwa” ni wa kawaida na pia huhifadhi kwa uwazi kauli tendwa ya Kigiriki.
