  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: sw
  text: 'Lakini kila mmoja kwa mpangilio wake mwenyewe: Masihi[a] ndiye malimbuko, kisha wale walio wa Masihi wakati wa kuja kwake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_reading
  - marker: b
    text: Au “kuwapo” au “kuwasili”; hapa neno la Kigiriki παρουσία linarejelea kuja kwake kwa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Ni usemi wa ugawaji unaorejelea kila mmoja katika mfuatano wa kufufuliwa; ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: kwa mpangilio wake mwenyewe
  rationale: τάγμα inaweza kumaanisha nafasi, safu, au mpangilio uliowekwa. Muktadha unahusu mfuatano wa ufufuo, hivyo “mpangilio” huhifadhi maana bila kuingiza taswira ya kijeshi kupita kiasi.
- source_word: ἀπαρχὴ
  choice: malimbuko
  rationale: Neno hili huhifadhi taswira ya kibiblia ya sehemu ya kwanza ya mavuno inayotolewa kwa Mungu na inayodokeza mavuno yatakayofuata.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo cha Mtiwa-Mafuta, si kama jina tu; “Masihi” huonyesha wazi maana hiyo ya cheo.
- source_word: οἱ τοῦ Χριστοῦ
  choice: wale walio wa Masihi
  rationale: Muundo wa umilikaji unaonyesha kuwa watu hawa ni wake au wanamhusu Masihi; usemi huu ni mfupi, wa asili, na huhifadhi nguvu ya uhusiano huo.
- source_word: παρουσίᾳ
  choice: kuja
  rationale: Ingawa παρουσία pia linaweza kumaanisha kuwapo au kuwasili, katika muktadha huu linarejelea tukio la baadaye la kuja kwa Masihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός inapofanya kazi kama cheo chenye umuhimu wa kimasihi
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unatofautisha Masihi na wale walio wake katika mpangilio wa ufufuo, hivyo maana ya cheo ni dhahiri. Tanbihi inatoa “Kristo” kama tafsiri nyingine iliyozoeleka.
- issue: Jinsi ya kutafsiri παρουσία katika muktadha wa matukio ya mwisho
  choice: kuja
  alternative: kuwapo au kuwasili
  rationale: “Kuja” hueleza kwa uwazi tukio la baadaye linalokusudiwa bila kuongeza maelezo ya kimafundisho yasiyosemwa moja kwa moja na Kigiriki.
- issue: Uhusiano wa Kristo na ἀπαρχή katika muundo wa kishazi
  choice: Masihi ndiye malimbuko
  alternative: Masihi akiwa malimbuko
  rationale: Muundo wa Kigiriki ni wa ulinganishi wa moja kwa moja bila kitenzi kilichoandikwa; “ndiye” huutoa kwa Kiswahili cha asili huku ukihifadhi dai kwamba Masihi mwenyewe ni malimbuko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Malimbuko” limehifadhiwa kwa sababu ni istilahi ya kibiblia inayojulikana na hubeba taswira ya mavuno ya kwanza yanayoashiria yatakayofuata.
