  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: sw
  text: Lakini sasa Masihi[a] amefufuliwa kutoka miongoni mwa wafu, naye ni limbuko[b] la wale waliolala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: “Limbuko” ni sehemu ya kwanza ya mavuno iliyotolewa kwa Mungu; hapa linaonyesha kwamba ufufuo wa Masihi unatangulia ufufuo wa wengine na ni ishara ya mavuno yatakayofuata.
    reason: cultural_note
  - marker: c
    text: “Wale waliolala” ni sitiari inayomaanisha wale waliokufa, hasa katika muktadha wa ufufuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inaonyesha mgeuko mkali kutoka hoja ya awali ya kudhani kwamba hakuna ufufuo hadi uthibitisho wa sasa kwamba ufufuo wa Masihi ni jambo halisi.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno la Kigiriki hapa linafanya kazi kama cheo cha Mtiwa-Mafuta katika hoja ya kitheolojia; “Masihi” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐγήγερται
  choice: amefufuliwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokamilika lenye matokeo yanayoendelea. “Amefufuliwa” huhifadhi hali ya kutendwa bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: ἐκ νεκρῶν
  choice: kutoka miongoni mwa wafu
  rationale: Huwakilisha kwa uwazi maana ya kutoka kati ya watu waliokufa, huku ikibaki lugha ya kawaida ya ufufuo.
- source_word: ἀπαρχὴ
  choice: limbuko
  rationale: “Limbuko” ni sehemu ya kwanza ya mavuno iliyotolewa kwa Mungu na kwa hiyo huonyesha utangulizi wa ufufuo wa Masihi na kutazamiwa kwa mavuno yote yatakayofuata.
- source_word: τῶν κεκοιμημένων
  choice: la wale waliolala
  rationale: Huhifadhi sitiari ya kulala inayotumiwa kwa waliokufa katika muktadha wa ufufuo, badala ya kuibadili moja kwa moja kuwa “waliokufa.”
theological_decisions:
- issue: Hali ya kauli na mtendaji katika ufufuo
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa ili kutoficha kwamba Masihi ndiye aliyefanyiwa tendo, lakini mtendaji hajaongezwa kwa sababu mstari wenyewe hamtaji.
- issue: Uwasilishaji wa cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja hii Χριστός ina uzito wa cheo cha Mtiwa-Mafuta; “Masihi” hutafsiri maana ya cheo hicho, huku “Kristo” ikitajwa kama namna mbadala iliyozoeleka.
- issue: Maana wakilishi ya ἀπαρχή
  choice: limbuko
  alternative: tunda la kwanza
  rationale: “Limbuko” huhifadhi picha ya sehemu ya kwanza ya mavuno inayotangulia mavuno yote, bila kueleza ndani ya mstari kama dhamana ya kimfumo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “naye ni limbuko” umeongezwa kwa ulaini na uwazi wa Kiswahili bila kubadili uhusiano wa kisarufi wa sentensi ya Kigiriki; sitiari ya kulala na kauli tendwa ya ufufuo zimehifadhiwa.
