  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: sw
  text: Na mwisho wa wote, alinitokea mimi pia, kama mtu aliyezaliwa kwa namna isiyo ya kawaida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi, “kama mimba iliyotoka” au “kama kijusi kilichotolewa.” Paulo anatumia sitiari kali ya kujishusha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: Na mwisho kabisa
  rationale: Kirai hiki kinaendeleza orodha ya wale waliomtokea Kristo na kueleza kwamba tukio la Paulo lilikuwa la mwisho katika mfuatano huo.
- source_word: ὡσπερεὶ
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho wenye maana ya kukadiria; “kama” ni ya kawaida na huacha sitiari ibaki wazi.
- source_word: τῷ ἐκτρώματι
  choice: mtu aliyezaliwa kabla ya wakati wake
  rationale: Hili linawasilisha hali ya kuzaliwa kusiko kwa wakati na kujishusha kwa Paulo kwa Kiswahili kinachoeleweka, huku maana halisi iliyo kali zaidi ikihifadhiwa katika tanbihi.
- source_word: ὤφθη
  choice: alinitokea
  rationale: Katika muktadha wa kuonekana kwa Kristo aliyefufuka, kitenzi hiki humaanisha kujidhihirisha kwa kuonekana; “alinitokea” ni kauli ya kawaida na ya wazi katika Kiswahili.
- source_word: κἀμοί
  choice: mimi pia
  rationale: Huhifadhi maana ya nyongeza ya καί na kumweka Paulo ndani ya mfuatano wa mashahidi, huku “mimi” ikitoa mkazo wa asili.
theological_decisions:
- issue: Sitiari ya Paulo ἐκτρώματι
  choice: mtu aliyezaliwa kabla ya wakati wake
  alternative: mimba iliyoharibika; kijusi kilichotolewa; mtu aliyezaliwa isivyo kawaida
  rationale: Maandishi hayaelezi kwa usahihi kipengele gani cha historia au utume wa Paulo kinacholengwa. Tafsiri hii huhifadhi wazo la kuzaliwa kusiko kwa wakati na hali ya kujishusha bila kuingiza ufafanuzi wa kimadhehebu; tanbihi inaonyesha ukali wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kupunguza ukali wa sitiari, ambao umefafanuliwa katika tanbihi.
