reference: 1 Corinthians 15:47
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: sw
  text: Mtu wa kwanza alitoka ardhini, naye alikuwa wa mavumbi[a]; mtu wa pili anatoka mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa udongo” au “aliyefanyizwa kwa mavumbi.” Neno la Kiyunani χοϊκός linakumbusha kuumbwa kwa Adamu kutoka mavumbini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: wa kwanza
  rationale: Ni kivumishi cha mpangilio kinachomtaja mshiriki wa kwanza katika ulinganisho wa Adamu na Kristo.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu nomino hiyo inamtaja mwanadamu mmoja wa kiume kwa nafasi ya uwakilishi—kwanza Adamu, kisha Kristo. Kiswahili cha kawaida hutumia “mtu” kwa usahihi bila kupoteza ulinganifu huo.
- source_word: ἐκ γῆς
  choice: alitoka ardhini
  rationale: Kirai hiki kinaonyesha asili au chanzo na kinadokeza simulizi la kuumbwa kwa Adamu kutoka katika ardhi.
- source_word: χοϊκός
  choice: wa mavumbi
  rationale: Kivumishi hiki humaanisha aliye wa mavumbi au aliyefanyizwa kwa mavumbi, kikirejelea kuumbwa kwa Adamu. “Wa mavumbi” huhifadhi umbo la kivumishi bila kuongeza kitenzi cha kuumbwa ambacho hakipo wazi katika mstari.
- source_word: δεύτερος
  choice: wa pili
  rationale: Huhifadhi ulinganifu wa makusudi kati ya “mtu wa kwanza” na “mtu wa pili.”
- source_word: ἐξ οὐρανοῦ
  choice: anatoka mbinguni
  rationale: Kirai kinaonyesha asili ya mbinguni. “Mbinguni” linafaa kuliko “angani,” kwa kuwa muktadha una maana ya makao ya kimungu, si anga la kawaida tu.
theological_decisions:
- issue: Nguvu ya Kikristo ya usemi “mtu wa pili”
  choice: Kudumisha “mtu wa pili” bila kuongeza jina “Kristo.”
  alternative: “Mtu wa pili, Kristo, anatoka mbinguni.”
  rationale: Muktadha unamtambulisha mtu wa pili kuwa Kristo, lakini mstari huu haumti jina wazi. Kutoliongeza kunahifadhi usemi na mvutano wa kitheolojia wa matini.
- issue: Wakati wa vitenzi katika vishazi viwili
  choice: “alitoka ... alikuwa” katika kishazi cha kwanza, lakini “anatoka” katika cha pili.
  alternative: Kutumia wakati uliopita katika vishazi vyote viwili, au wakati uliopo katika vyote.
  rationale: Kiyunani hakina kitenzi unganishi kilichoandikwa katika vishazi hivi. Tafsiri hii inaeleza asili ya mtu wa kwanza kwa wakati uliopita, huku ikidumisha dai la wakati uliopo kuhusu mtu wa pili, kulingana na nguvu ya ulinganisho katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Ulinganifu wa “mtu wa kwanza ... mtu wa pili” umehifadhiwa, na alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
