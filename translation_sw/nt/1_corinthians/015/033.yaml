  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: sw
  text: 'Msidanganyike: “Ushirika mbaya huharibu tabia njema.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mazungumzo mabaya huharibu tabia njema.” Neno la Kigiriki linaweza kumaanisha ushirika au mazungumzo; maana pana ya “ushirika” inafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Msidanganyike
  rationale: Kauli hii ni katazo linaloonya dhidi ya kudanganywa au kupotoshwa bila kuamua kimya kimya kama chanzo ni mtu mwenyewe au watu wengine.
- source_word: φθείρουσιν
  choice: huharibu
  rationale: Kitenzi hiki kinaonyesha kuifanya tabia izorote; “huharibu” ni ya kawaida na inafaa katika muktadha wa maadili.
- source_word: ἤθη
  choice: tabia
  rationale: Hapa neno hili linahusu mwenendo na hulka ya kimaadili, si adabu za kijamii tu. “Tabia” ni neno la kawaida na pana katika Kiswahili.
- source_word: χρηστὰ
  choice: njema
  rationale: Kivumishi hiki kinaeleza ubora wa kimaadili; “njema” kinatoa maana hiyo kwa lugha rahisi na yenye hadhi.
- source_word: ὁμιλίαι
  choice: ushirika
  rationale: Neno la Kigiriki linaweza kumaanisha kushirikiana au mazungumzo. “Ushirika” unafaa zaidi kwa maana pana ya mahusiano na watu katika muktadha huu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: κακαί
  choice: mbaya
  rationale: Kivumishi hiki kinaonyesha ushirika wenye madhara ya kimaadili. “Mbaya” ni cha kawaida na hakiongezi uzito usiolazimishwa na matini.
