reference: 1 Corinthians 15:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: sw
  text: Maana mimi ndiye mdogo kabisa miongoni mwa mitume, mimi ambaye sistahili[a] kuitwa mtume, kwa sababu nililitesa kanisa la Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, sifai; au, sina sifa za kuitwa mtume.
    reason: Neno ἱκανός linaweza kumaanisha kustahili, kufaa, kuwa na uwezo wa kutosha, au kuwa na sifa zinazohitajika.
lexical_decisions:
- source_word: γάρ
  choice: Maana
  rationale: Inaendeleza kwa njia ya kawaida hoja ya maelezo inayounganisha mstari huu na yaliyotangulia.
- source_word: ἐλάχιστος
  choice: mdogo kabisa miongoni mwa
  rationale: Inaonyesha cheo au hadhi ya chini kwa kulinganishwa na mitume wengine, si udogo wa mwili.
- source_word: ἀπόστολος / ἀποστόλων
  choice: mtume / mitume
  rationale: Katika muktadha huu neno linarejelea kundi na huduma inayotambulika ya mitume, si wajumbe kwa maana ya jumla tu.
- source_word: ἱκανός
  choice: kustahili
  rationale: Katika kujinyenyekeza kwa Paulo kutokana na historia yake ya kulitesa kanisa, neno hili kwa kawaida linaeleweka kama kustahili; tanbihi inadumisha maana nyingine halali za kufaa au kuwa na sifa.
- source_word: καλεῖσθαι
  choice: kuitwa
  rationale: Ni tafsiri ya kawaida ya kauli tendwa na inadumisha maana ya kuitwa au kutambuliwa kwa jina hilo.
- source_word: διότι
  choice: kwa sababu
  rationale: Inatambulisha wazi sababu ambayo Paulo anatoa kwa kauli yake.
- source_word: ἐδίωξα
  choice: nililitesa
  rationale: Hapa kitenzi kinamaanisha kuwafuatilia waumini kwa uhasama na kuwadhuru, si kufuatilia tu.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: kanisa la Mungu
  rationale: Ni usemi wa kawaida na sahihi kwa jumuiya ya waumini, huku ukidumisha uhusiano wa maneno ya Kigiriki.
- source_word: ὃς
  choice: mimi ambaye
  rationale: Inadumisha kishazi rejeshi cha Kigiriki na kukiunganisha wazi na Paulo mwenyewe kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili ya kauli ya Paulo kuhusu utume wake
  choice: Paulo anajihesabu kuwa mmoja wa mitume, huku akisema kuwa hastahili kuitwa mtume.
  alternative: Kumfanya Paulo akatae kabisa kwamba yeye ni mtume, au kuifanya kauli ihusu hadhi ya kijamii tu.
  rationale: Kauli “mdogo kabisa miongoni mwa mitume” inamhusisha ndani ya kundi hilo, ilhali “sistahili kuitwa mtume” inaonyesha unyenyekevu unaotokana na mateso aliyoliletea kanisa. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mimi ndiye mdogo kabisa miongoni mwa mitume” ni wa asili na unaeleweka kwa urahisi; urudiaji wa “mimi” unadumisha msisitizo na kishazi rejeshi cha Kigiriki.
