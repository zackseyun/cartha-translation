  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: sw
  text: “Ewe kifo, ushindi wako uko wapi?[a] Ewe kifo, mwiba wako uko wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati husoma, “Ewe kifo, mwiba wako uko wapi?” katika kishazi cha kwanza; usomaji huo unaonekana katika KJV na tafsiri nyingine za kimapokeo.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: Uko wapi
  rationale: Ni kielezi cha kuuliza kinachoanzisha swali la kejeli lenye changamoto. Katika Kiswahili, “uko wapi” ni ya asili zaidi hapa kwa kuwa kitu kinachotafutwa ni ushindi au uchungu unaohusishwa na kifo.
- source_word: σου
  choice: wako
  rationale: Kiwakilishi cha nafsi ya pili katika hali ya umilikaji; “wako” kinakubaliana na nomino za ngeli ya U, “ushindi” na “uchungu.”
- source_word: θάνατε
  choice: ewe kifo
  rationale: Ni hali ya mwito inayozungumzia kifo kana kwamba ni mtu. “Ewe kifo” huhifadhi nguvu ya kishairi na ya moja kwa moja.
- source_word: νῖκος
  choice: ushindi
  rationale: Neno hili humaanisha ushindi au kutwaa ushindi. “Ushindi” ni sawa ya wazi na pia linaunganisha mstari huu na wazo la kifo kumezwa katika ushindi katika mstari wa 54.
- source_word: κέντρον
  choice: uchungu
  rationale: Neno linaweza kumaanisha mwiba, kichocheo chenye ncha, au mchomo. “Uchungu” linaeleza kwa Kiswahili cha kawaida madhara ya mchomo wa kifo na linaendana na maelezo ya mstari wa 56, bila kuashiria mwiba halisi tu.
theological_decisions:
- issue: Usomaji wa matini hakiki katika kishazi cha kwanza
  choice: Kutafsiri νῖκος kuwa “ushindi” katika matini kuu
  alternative: 'Baadhi ya hati husoma “uchungu” katika kishazi cha kwanza, yaani: “Uko wapi, ewe kifo, uchungu wako?”'
  rationale: SBLGNT ina νῖκος katika kishazi cha kwanza, hivyo tofauti ya “ushindi ... uchungu” inapaswa kuhifadhiwa. Usomaji mwingine unatajwa katika tanbihi kwa sababu una ushahidi wa kihati na umeenea katika mapokeo ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mwito “ewe kifo” huhifadhi uhuishaji wa kifo na nguvu ya kejeli ya maswali.
