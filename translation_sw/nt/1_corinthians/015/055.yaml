  verdict: revise
  source_fidelity: The first clause accurately renders νῖκος as “ushindi” and retains the direct address to death. In the second clause, however, κέντρον is more specifically a sting/pricking instrument than the resulting pain; “uchungu” shifts the image from the sting to its effect. “Mwiba” better preserves the concrete metaphor and coheres with Paul’s explanation in verse 56.
  naturalness: Recasting the questions as “Ewe kifo, ... wako uko wapi?” is idiomatic Standard East African Swahili while retaining the rhetorical, poetic taunt. “Ewe kifo” appropriately marks the personified vocative.
  terminology: Use “mwiba” for κέντρον. This is a well-established biblical metaphor in Swahili and retains the lexical connection with the explanatory image in the following verse. The textual-variant footnote should correspond exactly to the revised wording.
  issues:
