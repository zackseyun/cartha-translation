source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: sw
  text: 'Kwa maana niliwapa, kama jambo la umuhimu wa kwanza, yale ambayo mimi pia niliyoyapokea: kwamba Masihi[a] alikufa kwa ajili ya dhambi zetu, kulingana na Maandiko[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo alikufa kwa ajili ya dhambi zetu.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “kwa mujibu wa Maandiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: niliwakabidhi
  rationale: Katika muktadha huu kitenzi kina maana ya kupitisha kwa wengine mafundisho au mapokeo yaliyopokewa; “niliwakabidhi” huhifadhi uzito wa tendo hilo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi hii inafafanua kauli iliyotangulia.
- source_word: ἐν πρώτοις
  choice: kama jambo la umuhimu wa kwanza
  rationale: Katika muktadha huu kirai kinaonyesha hasa ukuu wa umuhimu, ingawa kinaweza pia kueleweka kuwa kinahusu mambo ya kwanza kwa mpangilio.
- source_word: ὃ καὶ παρέλαβον
  choice: yale niliyopokea pia
  rationale: Huhifadhi ulinganifu kati ya Paulo kupokea ujumbe na kisha kuwakabidhi wengine.
- source_word: Χριστὸς
  choice: Masiya
  rationale: Hapa neno linatumika kwa nguvu ya cheo katika muhtasari huu wa imani, hivyo “Masiya” hudumisha maana yake ya Kiyahudi ya mtiwa-mafuta.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Wakati timilifu wa Kigiriki unaeleza tukio lililotokea, na wakati uliopita rahisi ni wa kawaida na wazi katika Kiswahili.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: kwa ajili ya dhambi zetu
  rationale: Kirai hiki hudumisha dai la wokovu bila kulazimisha nadharia mahususi zaidi kuhusu jinsi kifo hicho kilivyohusiana na dhambi.
- source_word: κατὰ τὰς γραφάς
  choice: kulingana na Maandiko
  rationale: Huonyesha ulinganifu au upatano na Maandiko na pia hudumisha umbo la wingi la Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masiya
  alternative: Kristo
  rationale: Katika kauli hii fupi ya imani, Χριστός ina nguvu ya cheo. “Masiya” huweka wazi maana hiyo, huku tanbihi ikihifadhi tafsiri ya jadi “Kristo”.
- issue: Maana ya ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: kwa ajili ya dhambi zetu
  alternative: kwa sababu ya dhambi zetu
  rationale: “Kwa ajili ya” ni pana vya kutosha kuonyesha uhusiano wa kifo chake na dhambi zetu bila kuamua kimya kimya ikiwa ὑπέρ hapa inasisitiza uwakilishi, sababu, au wazo jingine mahususi la upatanisho.
- issue: Nguvu ya κατὰ τὰς γραφάς
  choice: kulingana na Maandiko
  alternative: kwa mujibu wa Maandiko
  rationale: Chaguo hili linaonyesha kuwa kifo hicho kilipatana na ushuhuda wa Maandiko bila kubainisha zaidi ikiwa msisitizo ni utabiri, mpango wa Mungu, au utimilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo unaweka wazi mlingano wa kupokea na kukabidhi ujumbe, na huepuka maneno ya kale yasiyo ya lazima.
