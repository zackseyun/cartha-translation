    text: Au, “Kristo alikufa kwa ajili ya dhambi zetu.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “kwa mujibu wa Maandiko.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous verb choice with idiomatic Swahili for passing on received teaching, regularizes the agreeing relative form, and uses the standard Kiswahili title Masihi. It otherwise preserves the source syntax, confessional register, theological breadth, and both footnote anchors.
