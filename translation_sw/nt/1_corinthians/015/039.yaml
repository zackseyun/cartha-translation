base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: sw
  text: Si kila nyama ni nyama ileile; bali kuna nyama ya wanadamu, nyingine ya wanyama, nyingine ya ndege, na nyingine ya samaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὰρξ
  choice: mwili
  rationale: Hapa σάρξ limetumiwa kihalisi kuhusu umbo la kimwili la viumbe mbalimbali, si kwa maana ya asili ya dhambi. “Mwili” ni neno la kawaida na lenye heshima katika Kiswahili kwa muktadha huu; “nyama” lingehifadhi kwa ukaribu zaidi maana ya flesh lakini katika orodha hii lingeweza kusikika kana kwamba ni nyama ya kuliwa.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Si kila mwili ni mwili wa aina ileile
  rationale: Muundo huu unahifadhi urudiaji na msisitizo wa Kigiriki huku ukieleza kwa Kiswahili cha kawaida kwamba miili ya viumbe si ya aina moja.
- source_word: ἄλλη
  choice: aina moja ... aina nyingine
  rationale: ἄλλη huonyesha tofauti ya makundi. Kiswahili huhitaji kwa kawaida kutaja “aina” ili mlolongo huu uwe wazi na wa asili.
- source_word: ἀνθρώπων
  choice: wanadamu
  rationale: Neno hili linawahusu binadamu wote, si wanaume pekee.
- source_word: κτηνῶν
  choice: wanyama
  rationale: Katika orodha hii κτηνῶν linaeleweka kwa upana kuwa wanyama. “Mifugo” lingebana maana kwa wanyama wafugwao pekee.
- source_word: πτηνῶν
  choice: ndege
  rationale: “Ndege” ndilo neno la kawaida la Kiswahili kwa kundi hili la viumbe warukao katika muktadha huu.
- source_word: ἰχθύων
  choice: samaki
  rationale: “Samaki” linaonyesha kundi zima kama ilivyo katika wingi wa Kigiriki.
theological_decisions:
- issue: Maana ya σάρξ katika kifungu cha Paulo
  choice: mwili kwa maana halisi ya kimwili
  alternative: nyama; asili ya dhambi
  rationale: Muktadha unalinganisha maumbo ya kimwili ya viumbe katika hoja kuhusu ufufuo. Kwa hiyo neno halipaswi kufasiriwa kimethali kuwa “asili ya dhambi.” Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi ya kileksika, “nyama.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi mpangilio wa makundi na urudiaji wa hoja ya Kigiriki, huku “aina moja … aina nyingine” ikiufanya mlolongo usomeke kwa urahisi.
