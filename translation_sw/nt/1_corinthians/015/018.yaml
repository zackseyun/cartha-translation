id: 1CO.15.18
reference: 1 Corinthians 15:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: sw
  text: Basi, wale pia waliolala katika Masihi wameangamia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika Kristo.”'
    reason: alternative_reading
  - marker: b
    text: “Waliolala” ni usemi wa Kigiriki wa staha unaomaanisha waliokufa, hasa waumini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Basi
  rationale: Ni kiunganishi cha hitimisho kinachoonyesha matokeo ya hoja iliyotangulia; “Basi” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: καὶ
  choice: pia
  rationale: Inahifadhi maana ya kuongeza kundi la wale waliokufa katika Masihi kwenye matokeo ya hoja.
- source_word: οἱ κοιμηθέντες
  choice: wale waliolala
  rationale: Inahifadhi sitiari ya Kigiriki ya kulala kama usemi wa staha kuhusu kufa, badala ya kuibadilisha moja kwa moja kuwa “waliokufa.”
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: “Masihi” hutafsiri Χριστός kama cheo, na “katika” huhifadhi lugha ya Paulo ya kuwa katika umoja na Masihi.
- source_word: ἀπώλοντο
  choice: wameangamia
  rationale: Inaonyesha kuangamia au kupotea kabisa kama tokeo la kutokuwapo kwa ufufuo; hali timilifu ya Kiswahili inaonyesha tokeo lenye athari ya sasa katika hoja hii.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστῷ katika usemi wa Paulo ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: Neno la Kigiriki linafanya kazi kama cheo, hivyo “Masihi” linaonyesha maana yake; tafsiri iliyozoeleka “Kristo” imehifadhiwa katika tanbihi bila kufifisha wazo la kuwa katika umoja naye.
- issue: Kuhifadhi sitiari ya kifo kama usingizi
  choice: waliolala
  alternative: waliokufa
  rationale: Andiko la Kigiriki linatumia kwa makusudi usemi wa kulala. Tafsiri inauhifadhi na tanbihi inaeleza kwamba hapa unamaanisha kifo, bila kuamua zaidi kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi kama ya Kigiriki; sitiari na mvutano wa hoja ya Paulo vimehifadhiwa.
