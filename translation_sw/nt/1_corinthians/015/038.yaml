  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: sw
  text: Lakini Mungu huupa mwili kama alivyotaka, na huipa kila mbegu mwili wake yenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: huupa
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa kwa hali ya mazoea, na kiambishi -u- kinarejelea mbegu ya muktadha uliotangulia; huu ni usemi wa asili kuliko ‘hutoa kwake.’
- source_word: σῶμα
  choice: mwili
  rationale: ‘Mwili’ huhifadhi istilahi kuu ya sura hii na taswira ya umbo lenye mwili katika mfano wa mbegu na ufufuo.
- source_word: καθὼς ἠθέλησεν
  choice: kama alivyotaka
  rationale: Huhifadhi wazo la uamuzi au mapenzi ya Mungu bila kuongeza maelezo ya kitheolojia yasiyosemwa wazi.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: kila mbegu huipa
  rationale: Kiswahili ‘kila mbegu’ huwasilisha kwa kawaida nguvu ya ugawaji ya usemi wa Kigiriki ‘kila moja ya mbegu,’ bila kuingiza dhana isiyotajwa ya aina au jamii.
- source_word: ἴδιον σῶμα
  choice: mwili wake wenyewe
  rationale: Usemi huu unaonyesha kwamba kila mbegu hupewa mwili unaoihusu hasa na huhifadhi msisitizo wa ἴδιον.
theological_decisions:
- issue: Utendaji na mapenzi ya Mungu katika mfano wa mbegu na mwili
  choice: Mungu anaonyeshwa kuwa ndiye anayeipa kila mbegu mwili kulingana na alivyotaka.
  alternative: Kutafsiri kwa maelezo zaidi kuwa Mungu huipa kila ‘aina’ ya mbegu umbo maalumu.
  rationale: Tafsiri inadumisha utendaji na uamuzi wa Mungu pamoja na utofauti wa miili, lakini haiongezi neno ‘aina,’ ambalo haliko wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘kila mbegu huipa mwili wake wenyewe’ ni wa kawaida na wazi, huku ukihifadhi uhusiano wa kisarufi na maana ya distributive ya Kigiriki.
