translation:
  language: sw
  text: Lakini cha kiroho si cha kwanza[a], bali cha asili[b]; baadaye huja cha kiroho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili wa kiroho si wa kwanza, bali mwili wa asili; baadaye huja mwili wa kiroho.” Paulo halitaji neno “mwili” katika mstari huu, ingawa limetajwa wazi katika muktadha unaozunguka.
    reason: alternative_reading
  - marker: b
    text: “Cha asili” limetafsiri neno la Kigiriki psychikon, yaani, kile kinachohusiana na uhai wa kawaida wa kiumbe; kwa tafsiri ya karibu zaidi na umbo la neno, “cha nafsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: cha kwanza
  rationale: 'Neno hili linaonyesha mpangilio wa hatua: kile kinachotangulia. Muundo huu ni wa kawaida na wa moja kwa moja katika Kiswahili.'
- source_word: πνευματικόν
  choice: cha kiroho
  rationale: Kivumishi hiki kinafanya kazi kama nomino na hakitaji waziwazi neno 'mwili.' 'Cha kiroho' kinahifadhi ufupi wa Kigiriki na uhusiano wake na muktadha wa ufufuo.
- source_word: ψυχικόν
  choice: cha asili
  rationale: Hurejelea kile kinachohusiana na uhai wa kawaida wa kiumbe, kinyume na kile cha kiroho. 'Cha asili' ni wazi na hakileti maana finyu ya kimwili pekee wala hukumu ya kimaadili.
- source_word: ἔπειτα
  choice: baadaye huja
  rationale: Huonyesha hatua inayofuata katika mpangilio. Kuongeza 'huja' kunafanya sentensi iwe ya kawaida katika Kiswahili bila kubadili maana.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Lakini ... si ... bali
  rationale: Muundo huu wa Kiswahili unahifadhi ukanushaji na usahihishaji unaosisitizwa na jozi ya viunganishi vya Kigiriki.
theological_decisions:
- issue: Tofauti kati ya ψυχικόν na πνευματικόν
  choice: Tofauti ya mpangilio kati ya hali ya kawaida ya uhai na hali ya kiroho katika hoja ya Paulo kuhusu ufufuo.
  alternative: Kutaja moja kwa moja 'mwili wa asili' na 'mwili wa kiroho,' au kuelewa kuwa ni tofauti kati ya watu wasio wa kiroho na walio wa kiroho.
  rationale: Ingawa mstari wa 44 unataja mwili waziwazi, mstari huu unaacha neno hilo. Tafsiri inadumisha vivumishi vilivyotumiwa kama nomino ili isifanye maana iwe finyu kuliko Kigiriki, huku tanbihi ikionyesha uhusiano na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo 'cha kiroho/cha asili' unahifadhi ufupi na utata halisi wa maandishi ya Kigiriki; tanbihi zinafafanua neno 'mwili' lililoeleweka kutokana na muktadha na maana ya psychikon.
