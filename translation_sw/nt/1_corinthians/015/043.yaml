  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: sw
  text: Hupandwa katika aibu; hufufuliwa katika utukufu. Hupandwa katika udhaifu; hufufuliwa katika nguvu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: hupandwa
  rationale: Neno hili linadumisha mfano wa mbegu na mwili uliomo katika muktadha. Umbo la kutendwa pia limehifadhiwa bila kumtaja mtendaji.
- source_word: ἀτιμίᾳ
  choice: katika aibu
  rationale: “Aibu” linaonyesha hali ya kutokuwa na heshima na linadumisha ulinganifu wa kinyume na “utukufu,” bila kulifanya neno limaanishe tu hisia ya kuona haya.
- source_word: ἐγείρεται
  choice: hufufuliwa
  rationale: Katika muktadha wa ufufuo, “hufufuliwa” ni tafsiri ya kawaida na iliyo wazi. Inahifadhi kauli ya kutendwa na kuacha mtendaji wa kimungu akiwa hakutajwa wazi, kama katika Kigiriki.
- source_word: δόξῃ
  choice: katika utukufu
  rationale: “Utukufu” ni neno lenye upana unaofaa katika muktadha wa ufufuo na linadumisha uzito wa tofauti yake na “aibu.”
- source_word: ἀσθενείᾳ
  choice: katika udhaifu
  rationale: “Udhaifu” ni tafsiri ya moja kwa moja na ya kawaida inayoweza kujumuisha hali dhaifu ya mwili bila kuifinya maana kuwa ya kimwili pekee.
- source_word: δυνάμει
  choice: katika nguvu
  rationale: “Nguvu” linatoa tofauti ya wazi na “udhaifu” na linaweza kueleza uwezo wa mwili wa ufufuo bila kuufanya kuwa nguvu za misuli pekee.
theological_decisions:
- issue: Kauli na mtendaji katika lugha ya ufufuo
  choice: Kutumia kauli za kutendwa “hupandwa” na “hufufuliwa” bila kumtaja Mungu wazi kuwa mtendaji.
  alternative: Mungu huufufua.
  rationale: Kigiriki kinatumia kauli ya kutendwa. Kuidumisha kunafuata muundo wa chanzo na kuacha utendaji wa Mungu ukiwa umeashiriwa badala ya kuongezwa wazi.
- issue: Kirejelewa cha kiima kisichotajwa wazi
  choice: Kuacha kiima kisitajwe, huku muktadha ukionyesha kuwa ni mwili.
  alternative: Mwili hupandwa ... mwili hufufuliwa.
  rationale: Kiswahili kinaweza kutumia maumbo haya bila kiwakilishi cha kiima. Hivyo maana ya mwili kutoka muktadha wa karibu inadumishwa bila marudio yasiyohitajika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa sentensi za Kigiriki umehifadhiwa, pamoja na tofauti za aibu/utukufu na udhaifu/nguvu.
