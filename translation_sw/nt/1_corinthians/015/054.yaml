  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: sw
  text: 'Lakini hiki chenye kuharibika kitakapovaa kutoharibika, na hiki chenye kufa kitakapovaa kutokufa, ndipo litakapotukia neno lile lililoandikwa[a]: “Kifo kimemezwa kwa ushindi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndipo neno lile lililoandikwa litakapotimia,” au “ndipo neno lile lililoandikwa litakapokuwa kweli.” Kitenzi cha Kigiriki kwa msingi wake humaanisha “kutokea” au “kuwa.”
    reason: alternative_reading
  - marker: b
    text: Dondoo kutoka Isaya 25:8, kwa maneno yanayoakisi mapokeo ya Kigiriki ambayo Paulo anayanukuu.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: chenye kuharibika
  rationale: Kirai hiki cha kivumishi kilichotumika kama nomino kinaeleza mwili wa sasa ulio chini ya uharibifu; kinatofautishwa kwa uwazi na ‘kutoharibika.’
- source_word: ἐνδύσηται
  choice: kitakapovaa
  rationale: ‘Kuvaa’ huhifadhi sitiari ya vazi ambayo Paulo anaitumia kueleza hali mpya inayowekwa juu ya mwili.
- source_word: ἀφθαρσίαν
  choice: kutoharibika
  rationale: Nomino hii inaeleza hali ya kutoweza kuharibika na inadumisha ulinganifu wa kimatamshi na ‘chenye kuharibika.’
- source_word: θνητὸν
  choice: chenye kufa
  rationale: Hueleza kitu kilicho chini ya mauti au kinachoweza kufa; usemi huu ni wa kawaida na unaeleweka kwa urahisi.
- source_word: ἀθανασίαν
  choice: kutokufa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya kutokuwa chini ya kifo.
- source_word: γενήσεται
  choice: litakapotimia
  rationale: Katika muktadha wa neno la Maandiko linalokuwa kweli, ‘kutimia’ ni Kiswahili cha kawaida na chenye kueleweka, ingawa kitenzi cha Kigiriki kwa msingi wake ni ‘kutokea’ au ‘kuwa.’ Tofauti hiyo imeonyeshwa katika tanbihi.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: neno lililoandikwa
  rationale: Huhifadhi maana ya λόγος na ya kauli iliyo katika maandishi bila kuifanya moja kwa moja kuwa istilahi pana zaidi ya ‘Andiko.’
- source_word: Κατεπόθη
  choice: kimemezwa
  rationale: Kauli ya kutendwa huhifadhi taswira ya kifo kumezwa bila kumtaja mtendaji ambaye maandishi hayamtaji.
- source_word: εἰς νῖκος
  choice: kwa ushindi
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha matokeo ya kushindwa kabisa kwa kifo, huku ukihifadhi neno ‘ushindi.’
theological_decisions:
- issue: Maana ya γενήσεται kuhusiana na dondoo la Maandiko
  choice: litakapotimia
  alternative: litakapotukia; litakapokuwa kweli
  rationale: ‘Litakapotimia’ ni usemi wa kawaida kwa neno la Maandiko linalofikia utimilifu wake. Kwa kuwa Kigiriki hakitumii kitenzi maalumu cha ‘kutimiza,’ maana halisi zaidi imehifadhiwa katika tanbihi ili tafsiri isifiche tofauti hiyo.
- issue: Wakati na hali ya Κατεπόθη katika tangazo linaloelekea wakati ujao
  choice: kimemezwa
  alternative: kilimezwa; kinamezwa
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba, wakati huo ujao utakapofika, ushindi juu ya kifo utakuwa umetendeka. Hii inadumisha nguvu ya tangazo la kinabii bila kulifanya ukweli wa jumla usiofungamana na wakati.
- issue: Mtendaji wa kumezwa kwa kifo
  choice: Kauli ya kutendwa bila kumtaja mtendaji
  alternative: Ushindi umemeza kifo
  rationale: Kigiriki kina kauli ya kutendwa na hakimtaji mtendaji; tafsiri haiongezi wazi kuwa ‘ushindi’ ndiye mtendaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘kuvaa’ umehifadhiwa kwa sababu ni sitiari kuu ya Paulo. Jozi ‘chenye kuharibika/kutoharibika’ na ‘chenye kufa/kutokufa’ zimechaguliwa kwa uwazi na ulinganifu unaoeleweka na wasomaji wa kawaida.
