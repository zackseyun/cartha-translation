base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: sw
  text: Kwa maana ni lazima mwili huu unaoharibika uvae kutoharibika[a], na mwili huu wa kufa uvae kutokufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “hiki kinachoharibika lazima kivae kutoharibika, na hiki cha kufa kivae kutokufa.” Kigiriki hakitaji wazi neno “mwili” katika mstari huu, ingawa muktadha unaonyesha kwamba kinachozungumziwa ni mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ni lazima
  rationale: Huonyesha ulazima wa mabadiliko haya kwa lugha ya kawaida na yenye nguvu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huhifadhi uhusiano wa maelezo na mstari uliotangulia.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: mwili huu unaoharibika
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino; ‘mwili’ umewekwa wazi kutokana na muktadha wa ufufuo wa mwili, huku ‘unaoharibika’ ikionyesha hali ya kupatwa na uharibifu.
- source_word: ἐνδύσασθαι
  choice: uvae
  rationale: Huhifadhi sitiari ya kuvaa kwa namna fupi na ya asili katika Kiswahili.
- source_word: ἀφθαρσίαν
  choice: kutoharibika
  rationale: Hudumisha ulinganifu wa moja kwa moja na ‘unaoharibika’ na kueleza hali ya kutoweza kuharibika.
- source_word: καὶ
  choice: na
  rationale: Huunganisha vipashio viwili sambamba kwa urahisi.
- source_word: τὸ θνητὸν τοῦτο
  choice: mwili huu unaokufa
  rationale: Hueleza kile kilicho chini ya mauti kwa Kiswahili kinachoeleweka; ‘mwili’ imedokezwa wazi na muktadha.
- source_word: ἀθανασίαν
  choice: kutokufa
  rationale: Ni kinyume cha moja kwa moja cha ‘unaokufa’ na hutoa maana ya kutokuwa chini ya mauti.
theological_decisions:
- issue: Kuongeza neno ‘mwili’ ingawa σώμα halipo wazi katika mstari huu
  choice: Kutafsiri vivumishi vilivyotumika kama nomino kuwa ‘mwili huu unaoharibika’ na ‘mwili huu unaokufa’
  alternative: ‘hiki kinachoharibika ... hiki kinachokufa’
  rationale: Muktadha wa karibu unazungumzia ufufuo na mabadiliko ya mwili. Kuongeza ‘mwili’ hufafanua rejeleo bila kuingiza dai jipya la kiteolojia; tanbihi huhifadhi muundo rasmi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inahifadhi sitiari ya kuvaa na miundo miwili sambamba, huku ikitumia ‘mwili’ kwa uwazi wa kimuktadha.
