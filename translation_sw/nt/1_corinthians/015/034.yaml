base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: sw
  text: Zindukeni ipasavyo[a], wala msiendelee kutenda dhambi[b], kwa maana wengine hawamjui Mungu. Nasema haya kwa aibu yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rudini kwenye fahamu zenu ipasavyo.” Kitenzi hiki kwa maana halisi huleta picha ya kuzinduka kutoka ulevini, lakini hapa yaelekea kimetumiwa kisitiari.
    reason: lexical_alternative
  - marker: b
    text: Au, “msitende dhambi” au “acheni kutenda dhambi.” Katazo lenye kitenzi cha wakati uliopo linaweza kuonyesha tendo linaloendelea au la mazoea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Zindukeni
  rationale: Kitenzi hiki kwa maana halisi huashiria kurudiwa na fahamu baada ya ulevi, lakini hapa kimetumiwa kisitiari kama mwito wa kuacha hali ya kutotambua na kupata tena akili timamu. “Zindukeni” ni amri ya asili na yenye nguvu katika Kiswahili.
- source_word: δικαίως
  choice: ipasavyo
  rationale: 'Kielezi hiki kinaeleza namna ya kuzinduka: kwa njia iliyo sawa au inayofaa. “Ipasavyo” ni cha kawaida na hakiongezi maana nzito ya kiteolojia ya kuhesabiwa haki.'
- source_word: μὴ ἁμαρτάνετε
  choice: wala msiendelee kutenda dhambi
  rationale: Katazo la wakati uliopo linaweza kuonyesha tendo linaloendelea au la mazoea. Tafsiri hii inaleta uwezekano huo bila kudai kwamba kila msikilizaji alikuwa akifanya dhambi ileile.
- source_word: ἀγνωσίαν θεοῦ
  choice: hawamjui Mungu
  rationale: Kirai hiki kwa maana ya kawaida ni kutokuwa na maarifa kumhusu Mungu. Kiswahili cha “hawamjui Mungu” ni cha asili zaidi kuliko “wana ujinga wa Mungu” na huhifadhi uzito wa uhusiano wa usemi huo.
- source_word: τινες
  choice: baadhi yenu
  rationale: Neno linamaanisha watu fulani ndani ya kundi linalozungumziwa au wanaohusishwa nalo. Muktadha wa hotuba kwa Wakorintho unaunga mkono “baadhi yenu,” ingawa kiwakilishi hicho hakijaandikwa wazi ndani ya neno lenyewe.
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: Nasema hivi ili mwaibike
  rationale: Hii inatoa kwa Kiswahili cha asili athari au kusudi la maneno ya Paulo kuhusiana na aibu ya wasikilizaji, huku ikihifadhi sauti kali ya kukemea.
theological_decisions:
- issue: Nguvu ya kimaadili ya δικαίως
  choice: ipasavyo
  alternative: kwa haki
  rationale: “Ipasavyo” huhifadhi wazo la kutenda kwa namna iliyo sawa bila kuingiza hapa maana maalumu ya kiteolojia ya haki ambayo umbo hili la kielezi halilazimishi.
- issue: Maana ya ἀγνωσίαν θεοῦ
  choice: hawamjui Mungu
  alternative: hawana maarifa kumhusu Mungu
  rationale: Chaguo kuu ni la asili na lenye uzito katika Kiswahili. Halibainishi zaidi ya Kigiriki iwapo tatizo ni ukosefu wa habari tu au kutomjua Mungu kwa maana ya kina zaidi.
- issue: Kusudi au matokeo ya πρὸς ἐντροπὴν ὑμῖν
  choice: ili mwaibike
  alternative: Nasema hivi kwa aibu yenu
  rationale: Muundo wenye πρὸς unaweza kuelekeza kwenye athari au kusudi. Kiswahili hiki ni wazi na cha kawaida, lakini hakipaswi kuchukuliwa kuwa ufafanuzi wa mwisho kuhusu iwapo Paulo anakusudia kuwatia aibu au anataja hali yao ya kuaibisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Zindukeni” huhifadhi picha hai ya Kigiriki bila kutumia usemi usio wa asili; “ipasavyo” ni laini na sahihi. Alama zote za tanbihi zimewekwa katika matini kuu.
