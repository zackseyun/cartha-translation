lexical_decisions:
- source_word: ἄφρων
  choice: Mpumbavu!
  rationale: Neno hili linahifadhi ukali wa karipio la moja kwa moja katika hali ya wito, huku likiwa la kawaida na lenye kueleweka katika Kiswahili cha sasa.
- source_word: σὺ
  choice: umo katika umbo la kitenzi “unachopanda”
  rationale: Kiswahili huonyesha nafsi ya pili kwa kiambishi u-. Hivyo msisitizo wa kumwelekea mtu huyo unabaki bila kuongeza kiwakilishi kisicho cha lazima.
- source_word: ὃ σπείρεις
  choice: unachopanda
  rationale: Hili ni tamko la asili linalohifadhi taswira ya kilimo na maana ya kile mtu anachopanda.
- source_word: ζῳοποιεῖται
  choice: hakipewi uhai
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na wazo la kupewa uhai, muhimu katika muktadha wa ufufuo.
- source_word: ἐὰν μὴ
  choice: isipokuwa
  rationale: Hutoa kwa kawaida sharti hasi la Kigiriki bila kulipanua.
- source_word: ἀποθάνῃ
  choice: kife
  rationale: Hali tegemezi ya Kiswahili inafaa baada ya “isipokuwa” na huwasilisha sharti la kufa bila kuongeza neno “kwanza,” ambalo halipo wazi katika maandishi.
theological_decisions:
- issue: Uhusiano wa mfano wa kufa kwa mbegu na uhai wa ufufuo
  choice: Kudumisha mfano wa kilimo bila kuufafanua zaidi ya maneno ya aya
  alternative: Kuitafsiri moja kwa moja kuwa kauli ya mafundisho kuhusu ufufuo wa mwili
  rationale: Paulo anatumia mfano wa mbegu kujibu shaka kuhusu ufufuo; tafsiri inapaswa kuhifadhi taswira na mvutano huo bila kuingiza maelezo ya kiteolojia yasiyosemwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Karipio ni kali lakini si la kizamani; muundo wa kutendwa katika “hakipewi uhai” unafuata kwa karibu ζῳοποιεῖται.
