  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: sw
  text: Kisha mwisho utakuja[a], wakati atakapomkabidhi Mungu Baba ufalme[b], wakati atakapobatilisha kila utawala na kila mamlaka na nguvu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utimilifu.” Neno la Kigiriki τέλος linaweza kumaanisha “mwisho,” “lengo,” au “utimilifu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “atakapoukabidhi ufalme kwa Mungu na Baba.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “atakapoondoa nguvu ya” au “atakapokomesha” kila utawala na kila mamlaka na nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Kisha
  rationale: Inaonyesha hatua inayofuata katika mfululizo wa matukio ya ufufuo kwa lugha fupi na ya kawaida.
- source_word: τὸ τέλος
  choice: utakuja mwisho
  rationale: τέλος hapa inaweza kumaanisha mwisho, lengo, au utimilifu; muundo huu unaonyesha wazi tukio la baadaye huku tanbihi ikihifadhi upana wa maana.
- source_word: ὅταν παραδιδῷ
  choice: wakati atakapomkabidhi
  rationale: Muundo wa Kigiriki unaelekeza kwenye tukio la baadaye; 'kumkabidhi' huonyesha kuhamisha ufalme kwa mhusika anayepokea.
- source_word: τὴν βασιλείαν
  choice: ufalme
  rationale: Hili ni neno la kawaida na linaloeleweka, nalo linaweza kujumuisha eneo la kifalme na utawala wa kifalme.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Mungu Baba
  rationale: 'Kiswahili hiki cha kawaida na chenye hadhi kinaeleza uhusiano wa kiambatanisho: Mungu, yaani Baba, bila kulazimisha tafsiri ya ''Mungu na Baba'' ndani ya matini kuu.'
- source_word: ὅταν καταργήσῃ
  choice: wakati atakapobatilisha
  rationale: '''Batilisha'' huonyesha kuondoa nguvu au utendaji na kukomesha kabisa, bila kudai kwa lazima kwamba wahusika wanaangamizwa na kutokuwapo.'
- source_word: πᾶσαν ἀρχὴν
  choice: kila utawala
  rationale: Katika orodha hii ἀρχή inaweza kuonyesha utawala au nguvu inayotawala; 'utawala' huhifadhi hali hiyo bila kuamua kimya kimya kuwa lazima ni mtawala binafsi.
- source_word: πᾶσαν ἐξουσίαν
  choice: kila mamlaka
  rationale: Hili ni neno la kawaida la Kiswahili kwa uwezo au haki ya kutawala na linadumisha utofauti wake na 'utawala' na 'nguvu'.
- source_word: δύναμιν
  choice: nguvu
  rationale: Ni linganifu la kawaida na pana kwa δύναμις katika orodha ya mamlaka zinazokomesha upinzani wao.
theological_decisions:
- issue: Uhusiano wa 'Mungu' na 'Baba' katika τῷ θεῷ καὶ πατρί
  choice: Mungu Baba
  alternative: Mungu na Baba
  rationale: Muundo unaweza kutafsiriwa kwa namna ya kiambatanisho au kwa uratibu wa karibu. Matini kuu inatumia Kiswahili cha kawaida cha kiambatanisho, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kigiriki.
- issue: Nguvu ya καταργήσῃ kuhusu tawala zenye kupinga
  choice: atakapobatilisha
  alternative: atakapoziondoa nguvu / atakapozikomesha
  rationale: Neno hilo linaonyesha kukomesha utendaji au mamlaka ya nguvu hizo kwa uamuzi kamili, lakini halilazimishi dai la kuangamizwa kwao kabisa kimetafizikia.
- issue: Ikiwa ἀρχή ni dhana au mhusika
  choice: utawala
  alternative: mtawala
  rationale: Katika triadi hii neno linaweza kueleweka kama utawala au nguvu inayotawala. 'Utawala' huhifadhi maana ya dhana na bado linaweza kurejelea mamlaka zinazotenda, bila kubana utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unahifadhi hatua mbili za ὅταν na utata muhimu wa τέλος, τῷ θεῷ καὶ πατρί, καταργέω, na ἀρχή kupitia matini na tanbihi.
