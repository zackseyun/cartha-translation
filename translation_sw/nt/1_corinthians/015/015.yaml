source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: sw
  text: Zaidi ya hayo, tunaonekana kuwa mashahidi wa uongo kumhusu Mungu[a], kwa sababu tumetoa ushuhuda dhidi ya Mungu kwamba alimfufua Masihi[b], ambaye hakumfufua ikiwa kweli wafu hawafufuliwi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mashahidi wa uongo wa Mungu.” Muundo wa Kigiriki unaweza kumaanisha mashahidi wa uongo kumhusu Mungu. Kifungu kinachofuata, “tumetoa ushuhuda dhidi ya Mungu,” hutumia neno la Kigiriki lenye maana ya “dhidi ya.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: tunaonekana kuwa
  rationale: Kauli ya sasa ya kutendwa inaonyesha kuthibitika au kuonekana kuwa na hali fulani; Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya hoja.
- source_word: δὲ καὶ
  choice: Zaidi ya hayo
  rationale: Inaendeleza hitimisho la hoja na kusisitiza tokeo jingine zito bila kutumia muundo usio wa kawaida katika Kiswahili.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: mashahidi wa uongo kuhusu Mungu
  rationale: Neno σύνθετη humaanisha mashahidi wanaotoa ushuhuda wa uongo; genitivi hapa inaeleweka kwa kawaida kuwa Mungu ndiye anayehusu ushuhuda huo.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: tulishuhudia juu ya Mungu
  rationale: Ingawa κατά pamoja na genitivi inaweza kumaanisha 'dhidi ya', katika muktadha huu ushuhuda unaotajwa ni dai juu ya tendo la Mungu. Tanbihi inadumisha maana mbadala yenye nguvu zaidi.
- source_word: ἤγειρεν τὸν Χριστόν
  choice: alimfufua Masihi
  rationale: Kitenzi kinaeleza tendo lililokamilika la kumwinua kutoka kwa wafu; Χριστός yenye kibainishi inafanya kazi kama cheo, hivyo 'Masihi'.
- source_word: εἴπερ ἄρα
  choice: ikiwa kweli
  rationale: Inaonyesha sharti linalokubaliwa kwa ajili ya hoja na kuhifadhi msisitizo wa 'ikiwa kwa hakika'.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: wafu hawafufuliwi
  rationale: Nomino ya kijumla 'wafu' na kauli ya kutendwa huhifadhi wazo la kwamba kufufuliwa ni tendo linalofanywa kwao.
theological_decisions:
- issue: Maana ya κατὰ τοῦ θεοῦ
  choice: juu ya Mungu
  alternative: dhidi ya Mungu
  rationale: 'Muktadha wa karibu unafafanua maudhui ya ushuhuda: kwamba Mungu alimfufua Masihi. Hata hivyo, maana ya kawaida ya κατά na genitivi inaweza kuwa ''dhidi ya''; maana hiyo haijafichwa bali imewekwa tanbihini.'
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja hii neno lina nguvu ya cheo cha yule aliyetiwa mafuta, si jina tu; 'Masihi' huiweka wazi bila kuongeza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku uradidi wa 'alimfufua/hakumfufua' na kauli ya kutendwa 'hawafufuliwi' vikihifadhi mkazo wa hoja ya Paulo.
