  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: sw
  text: Na kuna miili ya mbinguni[a] na miili ya duniani; lakini utukufu wa miili ya mbinguni ni wa namna moja, na utukufu wa miili ya duniani ni wa namna nyingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miili ya angani na miili ya ardhini.”
    reason: Mbadala huu unaonyesha maana inayowezekana ya kiastronomia, huku matini kuu ikihifadhi maana pana zaidi ya maneno ya Kigiriki.
lexical_decisions:
- source_word: σώματα
  choice: miili
  rationale: Neno hili linatafsiri maana ya msingi ya ‘miili’ bila kubainisha kupita kiasi ikiwa Paulo anarejelea miili ya angani, miili iliyofufuliwa, au maumbo mengine yenye mwili katika hoja yake.
- source_word: ἐπουράνια
  choice: ya mbinguni
  rationale: ‘Ya mbinguni’ ni lugha ya kawaida na yenye heshima, nayo inadumisha uwezekano wa kumaanisha kilicho cha mbinguni bila kuifunga kauli katika maana ya kiastronomia pekee.
- source_word: ἐπίγεια
  choice: ya duniani
  rationale: ‘Ya duniani’ inalingana kwa kawaida na ‘ya mbinguni’ na inaonyesha kilicho duniani bila kutumia istilahi ya kitaalamu.
- source_word: δόξα
  choice: utukufu
  rationale: ‘Utukufu’ huhifadhi msamiati mpana wa Paulo na pia unaweza kujumuisha fahari, uzuri, au mng'ao unaokusudiwa katika muktadha huu.
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: wa namna moja ... wa namna nyingine
  rationale: Muundo huu wa Kiswahili unaonyesha tofauti ya aina au sifa kati ya utukufu mmoja na mwingine kwa lugha ya asili na iliyo wazi.
- source_word: ἀλλὰ
  choice: lakini
  rationale: ‘Lakini’ huonyesha kwa wazi ulinganisho wenye utofauti unaoletwa na kiunganishi cha Kigiriki.
theological_decisions:
- issue: Kirejelewa cha ‘miili ya mbinguni’ na ‘miili ya duniani’
  choice: Kutumia kauli pana ‘miili ya mbinguni’ na ‘miili ya duniani’ bila kukifinya kirejelewa chake.
  alternative: ‘Miili ya angani’ na ‘miili ya ardhini,’ au viumbe vya mbinguni na vya duniani.
  rationale: Kigiriki kimetumia σώματα, yaani ‘miili,’ si ‘viumbe.’ Tafsiri pana huhifadhi mfano wa Paulo na mvutano wa maana bila kuingiza mafundisho kuhusu malaika wala kuifanya kauli ihusu vitu vya angani pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Marudio ya ‘miili ya mbinguni’ na ‘miili ya duniani’ yanaweka wazi nomino iliyodokezwa katika sehemu ya pili ya sentensi ya Kigiriki.
