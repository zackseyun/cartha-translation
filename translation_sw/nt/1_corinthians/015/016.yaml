  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: sw
  text: Kwa maana ikiwa wafu hawafufuliwi, basi hata Masihi[a] hajafufuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Masihi” au, kulingana na desturi ya muda mrefu, “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana ikiwa
  rationale: “Kwa maana” linaonyesha kuwa sentensi inaendeleza hoja ya Paulo, na “ikiwa” linahifadhi sharti la εἰ.
- source_word: νεκροὶ
  choice: wafu
  rationale: Nomino hii ya ujumla inawarejelea watu waliokufa; “wafu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: ἐγείρονται
  choice: hawafufuliwi
  rationale: Muundo wa kutendwa unahifadhi wazo la wafu kufufuliwa, badala ya kuhamisha maana kuwa wao hujiinua wenyewe.
- source_word: οὐδὲ
  choice: basi hata ... haja-
  rationale: “Hata” linaonyesha matokeo yenye msisitizo, huku “basi” likifanya mtiririko wa sharti na matokeo uwe wa asili katika Kiswahili.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Χριστός ni cheo kinachomaanisha Mtiwa-Mafuta; “Masihi” huhifadhi wazi maana yake kama cheo katika hoja hii.
- source_word: ἐγήγερται
  choice: hajafufuliwa
  rationale: Kauli ya kutendwa na hali timilifu zinaonyeshwa kwa umbo la “haja-”, linalodokeza tendo ambalo halijatendeka na matokeo yake yanayoendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika hoja kuhusu ufufuo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo cha Mtiwa-Mafuta bila kuifanya kuwa jina tu; “Kristo” ni tafsiri ya jadi inayowezekana na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; sentensi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Basi” limeongezwa kwa mtiririko wa kawaida wa sharti na matokeo bila kuongeza dai jipya.
