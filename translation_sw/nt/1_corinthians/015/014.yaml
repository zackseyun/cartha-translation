  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: sw
  text: Na ikiwa Masihi hajafufuliwa[a], basi tangazo letu ni tupu[b], na imani yenu pia ni tupu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Kristo” badala ya “Masihi” (Kigiriki: Christos).'
    reason: alternative_reading
  - marker: b
    text: Au “bure” badala ya “tupu” katika sehemu zote mbili.
    reason: lexical_alternative
  - marker: c
    text: Au “kumtumaini” badala ya “imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Huhifadhi maana ya cheo cha Kigiriki Christos na inafaa katika hoja ya Paulo kuhusu ufufuo wa Masihi; “Kristo” ni mbadala wa kawaida.
- source_word: ἐγήγερται
  choice: hajafufuliwa
  rationale: Ni kauli timilifu tendwa katika muktadha wa ufufuo; umbo hili huhifadhi hali ya kutendwa na matokeo yanayoendelea bila kutaja wazi mtendaji.
- source_word: ἄρα
  choice: basi
  rationale: Huonyesha hitimisho la kimantiki linalotokana na kisharti kwa Kiswahili cha kawaida.
- source_word: κήρυγμα
  choice: tangazo
  rationale: Huwasilisha wazo la ujumbe unaotangazwa hadharani bila kuufupisha kuwa tendo la kuhubiri pekee.
- source_word: κενὸν / κενὴ
  choice: tupu
  rationale: Huhifadhi urudiaji wa Paulo na maana ya kukosa msingi, maudhui, au uhalali; “bure” ni mbadala unaowezekana.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu inamaanisha mwitikio wa kuamini wa Wakorintho; “tumaini” au “uaminifu” haifai kwa usahihi uleule hapa.
theological_decisions:
- issue: Kauli ya ufufuo na mtendaji wake
  choice: hajafufuliwa
  alternative: hakufufuka
  rationale: Kigiriki kina umbo la kutendwa. Kulihifadhi huacha wazi mtendaji aliyedokezwa na hakutatui kimyakimya mvutano wa kitheolojia wa kifungu.
- issue: Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huweka wazi maana ya cheo katika hoja hii, huku “Kristo” ikibaki tafsiri ya kawaida inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi huhifadhi kisharti, hitimisho la kimantiki, na ulinganifu wa maneno mawili ya kenos. Neno “pia” limewekwa kwa nafasi ya καί ili uhusiano wa vipashio viwili usikike kwa kawaida.
