  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: sw
  text: Na kile unachopanda, hupandi mwili utakaokuja kuwapo, bali punje tupu, labda ya ngano au ya aina nyingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: unachopanda / hupandi
  rationale: Kitenzi “kupanda” ndicho cha kawaida katika Kiswahili kwa kutia mbegu ardhini, na kinadumisha taswira ya kilimo.
- source_word: σῶμα
  choice: mwili
  rationale: “Mwili” huhifadhi istilahi muhimu ya Paulo katika hoja yake kuhusu ufufuo; “umbo” ingedhoofisha uhusiano huo.
- source_word: τὸ γενησόμενον
  choice: utakaotokea
  rationale: Hueleza mwili ambao baadaye utakuja kuwapo bila kuufanya moja kwa moja kuwa “mmea utakaoota.”
- source_word: γυμνὸν
  choice: tupu
  rationale: Katika muktadha wa punje, “tupu” ni ya asili na huonyesha kuwa inapandwa bila umbo la baadaye; “uchi” ingesikika isivyo kawaida.
- source_word: κόκκον
  choice: punje
  rationale: “Punje” hufaa kwa ngano na aina nyingine za mbegu na inawakilisha κόκκος kwa usahihi katika mfano huu.
- source_word: εἰ τύχοι
  choice: labda
  rationale: '“Labda” huhifadhi maana ya kutoa mfano usiofungwa: huenda ikawa ngano au aina nyingine.'
- source_word: σίτου
  choice: ya ngano
  rationale: Katika muktadha huu σῖτος inaelekea kumaanisha ngano hasa, si nafaka kwa ujumla.
- source_word: τινος τῶν λοιπῶν
  choice: ya aina nyingine
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa mbegu fulani miongoni mwa nyingine zilizobaki.
theological_decisions:
- issue: Uhusiano kati ya punje inayopandwa na mwili wa ufufuo
  choice: Kudumisha neno “mwili” na kauli ya wakati ujao bila kufafanua zaidi mfano huo.
  alternative: “mmea utakaoota”
  rationale: Paulo anatumia mfano wa kilimo kueleza mwendelezo na mabadiliko, lakini mstari wenyewe unasema “mwili.” Tafsiri haipunguzi hoja kuwa ukuaji wa mmea tu wala kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unafuata hoja ya Kigiriki huku ukiepuka tafsiri ngumu kupita kiasi.
