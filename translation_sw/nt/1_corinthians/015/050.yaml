  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: sw
  text: 'Ninasema hivi, ndugu[a]: nyama na damu haziwezi kuurithi ufalme wa Mungu[b], wala kile kinachoharibika hakiwezi kurithi kile kisichoharibika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa linaweza kuwahusu waumini wote katika kusanyiko, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: “Nyama na damu” ni nahau inayomaanisha maisha ya mwanadamu anayekufa katika hali yake ya sasa; haimaanishi kwamba ufufuo hautakuwa wa mwili.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Ninasema hivi
  rationale: Hutoa kauli ya moja kwa moja ya Paulo kwa Kiswahili cha kawaida; δέ ina nguvu ya mpito ambayo haihitaji lazima neno tofauti katika sentensi hii.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima katika Kiswahili, na unaweza kulihusu kusanyiko lote bila kulazimisha jinsia katika tafsiri.
- source_word: σὰρξ καὶ αἷμα
  choice: nyama na damu
  rationale: Huhifadhi nahau ya chanzo inayomaanisha maisha ya mwanadamu anayekufa katika hali yake ya sasa.
- source_word: βασιλείαν θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri ya moja kwa moja, iliyozoeleka, inayohifadhi muundo na uzito wa usemi wa Kigiriki.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: kuurithi / kurithi
  rationale: Huhifadhi urudiaji na ulinganifu wa kitenzi κληρονομέω, pamoja na maana yake ya kupokea urithi.
- source_word: οὐ δύναται
  choice: haviwezi
  rationale: Huonyesha kutoweza kwa ufupi na kwa Kiswahili cha asili; upatanisho wa wingi unafuata kiima “nyama na damu.”
- source_word: ἡ φθορά
  choice: kile kinachoharibika
  rationale: Huonyesha hali ya kuwa chini ya uharibifu au kuoza kwa lugha inayoeleweka, huku ikihifadhi utofauti na ἀφθαρσία.
- source_word: τὴν ἀφθαρσίαν
  choice: kile kisichoharibika
  rationale: Huhifadhi ulinganifu wa moja kwa moja na “kile kinachoharibika” bila kukibadili kuwa “kutokufa,” ambalo ni wazo linalohusiana lakini si sawa kabisa.
theological_decisions:
- issue: Maana ya “nyama na damu” kuhusu ufufuo
  choice: Nahau ya maisha ya mwanadamu anayekufa na kuharibika katika hali ya sasa
  alternative: Kauli kwamba mwili au uhalisia wa kimwili wenyewe hauwezi kuingia katika ufalme wa Mungu
  rationale: Muktadha wa karibu unazungumzia kubadilishwa kwa mwili kutoka hali ya kuharibika kwenda hali isiyoharibika, si kuachwa kwa mwili kabisa. Tafsiri inahifadhi nahau na tanbihi inaeleza maana yake.
- issue: Wanaolengwa na ἀδελφοί
  choice: “ndugu,” likiwa neno linaloweza kulihusu kusanyiko lote
  alternative: “ndugu wanaume” au “ndugu wa kiume na wa kike”
  rationale: Kiswahili “ndugu” ni la kijumuishi kiasili katika muktadha huu na halihitaji kuongeza jinsia isiyotajwa wazi na neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unahifadhi ulinganifu wa chanzo, huku “kile kinachoharibika/kile kisichoharibika” ukitoa utofauti wa φθορά na ἀφθαρσία kwa uwazi.
