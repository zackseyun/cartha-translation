base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: sw
  text: 'Ndivyo ilivyo pia kuhusu ufufuo wa wafu: mwili unapandwa ukiwa wa kuharibika[a]; unafufuliwa ukiwa usioharibika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hali ya kuharibika ... katika hali ya kutoharibika.”
    reason: Mbadala huu rasmi zaidi huhifadhi kwa karibu muundo sambamba wa maneno ya Kigiriki.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Ndivyo ilivyo pia
  rationale: Inaendeleza ulinganisho na mfano wa mbegu katika mistari iliyotangulia, huku ikihifadhi nguvu ya kulinganisha na kuhitimisha.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: kuhusu ufufuo wa wafu
  rationale: “Ufufuo wa wafu” hufuata muundo na maana ya Kigiriki; “kuhusu” huifanya sentensi ya Kiswahili iwe ya kawaida bila kubadili uhusiano huo.
- source_word: σπείρεται
  choice: mwili unapandwa
  rationale: Kitenzi cha kutendwa kinahifadhi mfano wa kilimo. Kutaja “mwili,” unaoeleweka kutokana na muktadha, kunazuia Kiswahili kueleweka kana kwamba ufufuo wenyewe ndio unaopandwa.
- source_word: ἐν φθορᾷ
  choice: ukiwa wa kuharibika
  rationale: Hueleza hali ya mwili wa sasa ya kuweza kuharibika au kufa, si tendo la kuoza tu, na ni lugha ya kawaida ya Kiswahili.
- source_word: ἐγείρεται
  choice: unafufuliwa
  rationale: 'Kauli ya kutendwa imehifadhiwa: mwili unatendewa tendo la kufufuliwa badala ya kujifufua wenyewe.'
- source_word: ἐν ἀφθαρσίᾳ
  choice: ukiwa usioharibika
  rationale: Inadumisha upinzani wa moja kwa moja na “wa kuharibika” na kueleza hali isiyoweza kuharibika.
theological_decisions:
- issue: Asili ya mwili katika ufufuo
  choice: Kuhifadhi mfano wa mwili kupandwa na kufufuliwa kwa vitenzi vya kutendwa.
  alternative: Kufafanua moja kwa moja kuwa mwili unazikwa na kisha unakuwa wa kiroho.
  rationale: Muktadha unahusu ufufuo wa mwili, lakini mfano wa mbegu na mvutano kati ya mwendelezo na mabadiliko haupaswi kuondolewa kwa ufafanuzi wa kimadhehebu.
- issue: Maana ya φθορά na ἀφθαρσία
  choice: wa kuharibika ... usioharibika
  alternative: katika uharibifu ... katika kutoharibika
  rationale: Uundaji huu wa Kiswahili unaonyesha uwezo au hali ya kuharibika dhidi ya kutoharibika, bila kuifinya φθορά iwe kuoza kimwili pekee au uovu wa kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mwili unapandwa” ni wa kueleweka kwa msomaji wa kawaida na unahifadhi picha ya mbegu; “unafufuliwa” hudumisha kauli ya kutendwa.
