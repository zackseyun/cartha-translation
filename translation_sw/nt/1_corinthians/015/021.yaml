  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: sw
  text: 'Maana kwa kuwa kifo kilikuja kupitia kwa mwanadamu[b][a], ufufuo wa wafu pia ulikuja kupitia kwa mwanadamu.


    [a] Au, “kwa njia ya mwanadamu” katika sehemu zote mbili; kihusishi cha Kigiriki kinaweza kuonyesha utendaji wa mtu au njia.


    [b] Katika muktadha, Paulo anawatambulisha watu hao wawili kuwa Adamu na Kristo (tazama 15:22, 45).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya mwanadamu” katika sehemu zote mbili; kihusishi cha Kigiriki kinaweza kuonyesha utendaji wa mtu au njia.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, Paulo anawatambulisha watu hao wawili kuwa Adamu na Kristo (tazama 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Maana kwa kuwa
  rationale: “Maana” inahifadhi kazi ya γάρ ya kutoa sababu au ufafanuzi kwa hoja iliyotangulia, huku “kwa kuwa” ikiwakilisha nguvu ya kisababishi ya ἐπειδή kwa Kiswahili cha kawaida.
- source_word: δι’ ἀνθρώπου
  choice: kwa njia ya mwanadamu
  rationale: διά pamoja na jenitivi inaweza kuonyesha njia au utendaji. “Kwa njia ya mwanadamu” ni ya asili katika Kiswahili na inahifadhi umoja pamoja na ulinganifu wa Adamu na Kristo bila kuongeza majina yasiyomo katika aya.
- source_word: θάνατος
  choice: kifo kilikuja
  rationale: Kigiriki hakina kitenzi katika kishazi hiki. “Kilikuja” kinakamilisha sentensi kwa Kiswahili na kueleza kuingia kwa kifo huku kikidumisha ulinganifu na kishazi cha pili.
- source_word: ἀνάστασις νεκρῶν
  choice: ufufuo wa wafu
  rationale: Hili ni tamko la kawaida na la moja kwa moja kwa ufufuo halisi wa waliokufa; halipunguzi maana kuwa kuendelea kuishi baada ya kifo kwa ujumla.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaonyesha sehemu ya pili inayolingana na ya kwanza. “Pia” huufanya ulinganifu huo uwe wazi na wa asili katika Kiswahili.
- source_word: δι’ ἀνθρώπου
  choice: kwa njia ya mwanadamu
  rationale: Maneno yale yale yamerudiwa ili kuhifadhi ulinganifu wa makusudi kati ya mwanadamu ambaye kupitia kwake kifo kilikuja na yule ambaye kupitia kwake ufufuo ulikuja.
theological_decisions:
- issue: Ulinganifu wa uwakilishi kati ya Adamu na Kristo
  choice: Kutumia “mwanadamu” katika sehemu zote mbili bila kutaja majina katika matini kuu.
  alternative: “Mwanadamu mmoja ... mwanadamu mmoja” au “Adamu ... Kristo.”
  rationale: Aya yenyewe haitaji majina wala nambari “mmoja,” ingawa muktadha unawatambulisha. Tafsiri hii inahifadhi ufupi na ulinganifu wa Kigiriki bila kuingiza ufafanuzi katika matini kuu.
- issue: Asili ya ufufuo
  choice: Kutafsiri ἀνάστασις νεκρῶν kuwa “ufufuo wa wafu.”
  alternative: “Ufufuo wa kiroho” au “maisha baada ya kifo.”
  rationale: Hoja ya 1 Wakorintho 15 inahusu ufufuo halisi wa wafu. Tafsiri haipaswi kuugeuza kuwa wazo lisilo bayana la maisha baada ya kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vifungu viwili sambamba umehifadhiwa, na “mwanadamu” limetumiwa badala ya jina maalumu ili kufuata umbo la Kigiriki.
