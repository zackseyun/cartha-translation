  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: sw
  text: 'Ndivyo pia ilivyoandikwa: “Mtu wa kwanza, Adamu, akawa kiumbe hai”[a]; Adamu wa mwisho akawa roho itoayo uzima[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi hai,” kufuatia tafsiri ya jadi ya Mwanzo 2:7.
    reason: lexical_alternative
  - marker: b
    text: Au “roho ambayo hutoa uzima.” Usemi huu unamweleza Adamu wa mwisho kwa kumlinganisha na wa kwanza; Kigiriki kinaeleza sifa, wala si lazima kimtambulishe Kristo moja kwa moja na Roho Mtakatifu kama nafsi tofauti.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Ndivyo pia ilivyoandikwa
  rationale: Huhifadhi uhusiano wa hoja na fomula ya kawaida ya kutaja Maandiko kwa Kiswahili cha sasa.
- source_word: Ἐγένετο
  choice: akawa
  rationale: Huonyesha kufikia hali fulani, kwa njia ya kawaida na fupi katika Kiswahili.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: Mtu wa kwanza
  rationale: Neno “mtu” linaonyesha mwanadamu wa kwanza huku likidumisha ulinganifu wa kiwakilishi kati ya Adamu na Kristo.
- source_word: Ἀδὰμ
  choice: Adamu
  rationale: Ni namna sanifu ya jina hili katika Kiswahili.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: kiumbe hai
  rationale: Katika mwangwi wa Mwanzo 2:7, ψυχή inaonyesha nafsi nzima yenye uhai, si lazima sehemu isiyo ya kimwili pekee.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: Adamu wa mwisho
  rationale: Huhifadhi ulinganifu wa kitipolojia na wa kieskatolojia wa Paulo kati ya Adamu na Kristo.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: roho itiayo uzima
  rationale: Huhifadhi maana ya sifa ya πνεῦμα isiyo na kibainishi na tendo la kutoa au kuleta uzima, bila kuongeza ufafanuzi wa kimafundisho.
theological_decisions:
- issue: Maana ya ψυχή katika nukuu ya Mwanzo
  choice: kiumbe hai
  alternative: nafsi hai
  rationale: Muktadha wa uumbaji unamhusu Adamu akiwa kiumbe mzima mwenye uhai, wala haulazimishi mtazamo fulani kuhusu nafsi inayotenganika na mwili. Tafsiri ya jadi imehifadhiwa katika tanbihi.
- issue: Maana ya “Adamu wa mwisho akawa roho itiayo uzima”
  choice: Kudumisha ulinganifu halisi bila kumtambulisha wazi Kristo kuwa Roho Mtakatifu
  alternative: akawa Roho atoaye uzima
  rationale: πνεῦμα haina kibainishi na hapa ina nguvu ya kisifa. Herufi ndogo na usemi usiofafanuliwa hudumisha mvutano wa kifungu bila kuingiza hitimisho finyu la Utatu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Itiayo uzima” inadumisha uzito wa kibiblia bila kuwa ya kizamani kupita kiasi; tanbihi inatoa muundo wa kawaida zaidi.
