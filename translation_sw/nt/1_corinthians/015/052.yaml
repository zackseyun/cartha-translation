  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: sw
  text: kwa ghafula, kwa kufumba na kufumbua jicho, wakati wa tarumbeta ya mwisho. Kwa maana tarumbeta italia, nao wafu watafufuliwa wasioharibika, nasi tutabadilishwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: kwa ghafula
  rationale: Neno ἄτομος kimsingi humaanisha kisichogawanyika; hapa linaeleza muda mfupi mno. ‘Kwa ghafula’ ni Kiswahili cha kawaida kinachowasilisha utendaji wa papo hapo bila kutumia lugha ya kitaalamu.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: kwa kufumba na kufumbua jicho
  rationale: Hii ni nahau ya Kiswahili inayoeleza jambo linalotokea kwa kasi sana, na inahifadhi taswira ya jicho iliyo katika Kigiriki.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: wakati wa tarumbeta ya mwisho
  rationale: Muundo huu unaonyesha wakati unaohusishwa na tarumbeta ya mwisho, bila kuamua kwa tafsiri utaratibu maalumu wa matukio ya mwisho.
- source_word: σαλπίσει
  choice: tarumbeta italia
  rationale: Kitenzi cha Kigiriki hurejelea kupigwa au kulia kwa tarumbeta. Kwa Kiswahili, ‘tarumbeta italia’ ni ya asili na huchukua kiima chake kutoka kwa kirai kilichotangulia.
- source_word: οἱ νεκροὶ
  choice: wafu
  rationale: Nomino hii inawarejelea watu waliokufa kwa pamoja; ‘wafu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἐγερθήσονται
  choice: watafufuliwa
  rationale: Kauli tendwa ya wakati ujao imehifadhiwa, na katika muktadha wa ufufuo ‘watafufuliwa’ huwasilisha maana wazi kuliko ‘wataamshwa.’
- source_word: ἄφθαρτοι
  choice: wakiwa wasioweza kuharibika
  rationale: Neno hili linaonyesha hali ya kutopatwa na uharibifu au kuoza. Kirai hiki ni wazi kwa wasomaji wa kawaida na huhifadhi sifa inayowahusu wafu baada ya kufufuliwa.
- source_word: ἡμεῖς
  choice: nasi
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kimetajwa wazi katika Kigiriki na kinaonyesha mkazo na utofauti wake na ‘wafu.’ ‘Nasi’ huhifadhi muunganiko huo.
- source_word: ἀλλαγησόμεθα
  choice: tutabadilishwa
  rationale: Kauli tendwa ya wakati ujao imehifadhiwa kwa tafsiri ya moja kwa moja, bila kufafanua zaidi namna ya badiliko hilo.
theological_decisions:
- issue: Kutafsiri tarumbeta ya mwisho bila kuingiza mfumo maalumu wa matukio ya mwisho
  choice: wakati wa tarumbeta ya mwisho
  alternative: wakati tarumbeta ya mwisho itakapolia
  rationale: Kigiriki hutaja wazi tarumbeta ya mwisho, lakini hakitoi hapa ratiba kamili ya matukio. Tafsiri iliyochaguliwa huhifadhi taswira na uwazi wake bila kuongeza mpangilio wa kidhehebu.
- issue: Maana ya ‘sisi’ kuhusiana na ufufuo na kubadilishwa
  choice: nasi tutabadilishwa
  alternative: na sisi tutakaokuwa hai tutabadilishwa
  rationale: Tafsiri inahifadhi kiwakilishi cha Paulo bila kuongeza ufafanuzi kwamba kinamaanisha walio hai, ingawa muktadha mpana unaonyesha utofauti huo. Hivyo mvutano wa maandishi unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau ‘kwa kufumba na kufumbua jicho’ ni ya kawaida na yenye kueleweka. Hakuna tanbihi iliyoongezwa kwa sababu ‘kwa ghafula’ na nahau inayofuata zinawasilisha maana bila kuhitaji mbadala wa lazima.
