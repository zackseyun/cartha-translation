  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: sw
  text: Ninakufa kila siku[a]—naapa kwa fahari niliyo nayo juu yenu katika Masihi Yesu, Bwana wetu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “Kila siku ninakufa.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “hakika kama ilivyo fahari niliyo nayo juu yenu,” au “kwa fahari yenu.” Usemi wa Kigiriki una namna ya kiapo, na muundo wa kisarufi wa kifungu kinachotaja fahari unajadiliwa.
    reason: alternative_reading
  - marker: c
    text: 'Tafsiri ya jadi: “Kristo Yesu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: kila siku
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya jambo linalotokea siku baada ya siku.
- source_word: ἀποθνῄσκω
  choice: ninakufa
  rationale: Huhifadhi kauli ya Paulo iliyo wazi na yenye nguvu bila kuifafanua kuwa ‘ninakabili kifo.’
- source_word: νὴ
  choice: naam, naapa kwa
  rationale: Chembe hii hutumiwa katika uthibitisho wenye muundo wa kiapo; tafsiri hii inaonyesha nguvu yake kwa Kiswahili cha sasa.
- source_word: τὴν ὑμετέραν καύχησιν, ἣν ἔχω
  choice: fahari niliyo nayo juu yenu
  rationale: Kifungu rejeshi ‘niliyo nayo’ kinaelekeza hasa kwenye fahari ya Paulo kuhusu Wakorintho. ‘Fahari’ ni ya asili kuliko ‘kujisifu’ hapa, huku tanbihi ikihifadhi utata wa kisarufi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ‘Katika’ huhifadhi lugha muhimu ya Paulo, na Χριστός imetafsiriwa kama cheo ‘Masihi’ badala ya kutoholewa kana kwamba ni jina tu.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Bwana wetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya cheo na kiwakilishi milikishi.
theological_decisions:
- issue: Ikiwa Χριστός itafsiriwe kama cheo au itoholewe kwa namna ya jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika matumizi haya ya Paulo, Χριστός bado ina nguvu ya cheo. Tafsiri ya jadi imehifadhiwa katika tanbihi.
- issue: Mwenye fahari katika τὴν ὑμετέραν καύχησιν
  choice: Fahari ya Paulo juu ya Wakorintho
  alternative: Fahari ya Wakorintho wenyewe
  rationale: Kifungu ‘ambayo ninayo’ kinaunga mkono zaidi kuwa ni Paulo aliye na fahari hiyo, lakini umbo la Kigiriki linaweza kueleweka kwa njia nyingine; utata huo umetajwa katika tanbihi.
- issue: Nguvu ya νὴ
  choice: 'Kauli ya kiapo: ‘naam, naapa kwa’'
  alternative: ‘hakika kama ilivyo fahari niliyo nayo juu yenu’
  rationale: Hii inaonyesha kwamba Paulo anatoa uthibitisho wenye nguvu bila kuifanya sentensi iwe maelezo marefu; muundo mbadala umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kauli ya Paulo imeachwa ikiwa fupi na yenye nguvu; utata wa muundo wa kiapo na wa ‘fahari’ umehifadhiwa kwa tanbihi.
