id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: sw
  text: Lakini kwa neema ya Mungu mimi ni nilivyo, na neema yake kwangu haikuwa bure.[a] Badala yake, nilifanya kazi kwa bidii kuliko wao wote—lakini si mimi, bali neema ya Mungu iliyokuwa pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haikuthibitika kuwa tupu” au “haikukosa matokeo.”
    reason: κενή linaweza kuhifadhi picha ya kitu kilicho tupu au kueleza jambo lisilo na matokeo; matini kuu imetumia usemi wa kawaida “haikuwa bure.”
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Lakini kwa neema ya Mungu
  rationale: ‘Kwa’ linaonyesha kwamba neema ya Mungu ndiyo iliyomwezesha Paulo kuwa alivyo, huku ‘lakini’ likidokeza utofauti wa wastani na maelezo yaliyotangulia.
- source_word: εἰμι ὅ εἰμι
  choice: niko hivi nilivyo
  rationale: Usemi huu unahifadhi urudiaji wa Kigiriki kwa Kiswahili cha kawaida na unaelekeza kwenye hali na nafasi ya Paulo ya sasa.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: neema yake kwangu
  rationale: ‘Kwangu’ linaonyesha neema iliyoelekezwa kwa Paulo bila kuongeza wazo lisilokuwamo katika matini.
- source_word: οὐ κενὴ ἐγενήθη
  choice: haikuwa bure
  rationale: κενή hapa inaweza kumaanisha tupu, isiyo na matokeo, au ya bure. ‘Haikuwa bure’ ni usemi wa asili unaowasilisha ufanisi wa neema huku tanbihi ikihifadhi picha ya utupu.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Badala yake, nilifanya kazi kwa bidii kuliko wao wote
  rationale: κοπιάω huonyesha kazi yenye juhudi na uchovu; ‘nilifanya kazi kwa bidii’ linaeleweka kwa urahisi na kuhifadhi nguvu ya kitenzi. Ulinganisho ‘kuliko wao wote’ unabaki wazi.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: lakini si mimi, bali neema ya Mungu
  rationale: Muundo huu unahifadhi dai la Paulo kwamba alifanya kazi kweli na, wakati huohuo, kwamba neema ya Mungu ndiyo sababu kuu ya kazi hiyo.
- source_word: ἡ σὺν ἐμοί
  choice: iliyokuwa pamoja nami
  rationale: ‘Pamoja nami’ linatoa maana ya moja kwa moja ya σύν pamoja na kimilikishi, na kirai kinahusishwa wazi na ‘neema ya Mungu.’
theological_decisions:
- issue: Uhusiano kati ya kazi ya Paulo na neema ya Mungu
  choice: Tafsiri inathibitisha kazi halisi ya Paulo na pia utendaji wenye nguvu wa neema ya Mungu.
  alternative: Kusema kwamba Mungu na Paulo walifanya kazi kama washirika walio sawa, au kupunguza ukweli wa juhudi ya Paulo.
  rationale: Kigiriki kinasema kwamba Paulo alifanya kazi kuliko wote, kisha kinarekebisha dai hilo kwa kusema, ‘si mimi, bali neema ya Mungu.’ Mvutano huu umehifadhiwa bila kuamuliwa kwa mfumo wa baadaye wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Niko hivi nilivyo’ huhifadhi urudiaji wa chanzo bila kuwa wa kizamani; ‘nilifanya kazi kwa bidii’ huwasilisha kazi yenye juhudi kwa lugha inayoeleweka kwa wasomaji wa kawaida.
