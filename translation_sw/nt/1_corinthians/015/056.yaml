  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: sw
  text: Uchungu wa kifo ni dhambi, na nguvu[a] ya dhambi ni sheria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “uwezo”: “uwezo wa dhambi ni sheria.”'
    reason: lexical_alternative
  - marker: b
    text: Huenda “sheria” hapa inarejelea hasa sheria ya Musa katika hoja ya Paulo, ingawa maneno haya pia yanaruhusu maana pana kuhusu nafasi ya sheria katika kufunua na kuzidisha dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: uchungu
  rationale: Katika picha hii ya kifo kinachodhuru, “uchungu” ni usemi wa kawaida na unaoeleweka kwa maana ya madhara ya mchomo; unadumisha picha ya kitu chenye kuumiza bila kutumia neno lisilo la kawaida.
- source_word: θανάτου
  choice: wa kifo
  rationale: 'Huwakilisha kwa njia ya moja kwa moja uhusiano wa hali ya umilikaji au uhusiano: uchungu ulio wa kifo.'
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Ni tafsiri ya kawaida ya matumizi ya Paulo; umoja unadumishwa kwa kuwa dhambi inaelezwa kama nguvu au kanuni, si matendo mengi tu.
- source_word: δύναμις
  choice: nguvu
  rationale: “Nguvu” huonyesha uwezo au nguvu tendaji inayohusishwa na dhambi katika hoja ya Paulo; “uwezo” pia unawezekana lakini ni dhaifu kidogo katika muktadha huu.
- source_word: νόμος
  choice: sheria
  rationale: Herufi ndogo na neno “sheria” vinadumisha uwezekano wa kurejelea hasa sheria ya Musa bila kuzuia maana pana ya sheria katika hoja ya Paulo.
- source_word: δὲ
  choice: na
  rationale: δὲ ya pili inaendeleza maelezo badala ya kuonyesha upinzani mkali. Ya kwanza haihitaji kiunganishi cha wazi katika Kiswahili, hivyo hakuna neno la wakati kama “sasa” lililoongezwa.
theological_decisions:
- issue: Maana ya νόμος katika kauli kwamba sheria ni nguvu ya dhambi
  choice: sheria
  alternative: Sheria au Torati kama rejeleo la wazi kabisa la sheria ya Musa
  rationale: Muktadha wa Paulo unaelekea hasa kwenye sheria ya Musa, lakini maneno ya Kigiriki yanaruhusu pia maana pana kuhusu nafasi ya sheria katika kufunua na kuzidisha dhambi. Tafsiri haifungi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kifo” kimetumiwa badala ya “mauti” kwa uelewekaji wa kawaida, huku “uchungu wa kifo” ukihifadhi picha ya madhara ya κέντρον. Muundo mfupi na wa kimethali wa Kigiriki umedumishwa.
