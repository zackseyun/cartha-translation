  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: sw
  text: Basi, iwe ni mimi au wao, hivi ndivyo tunavyohubiri, na hivi ndivyo mlivyoamini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: iwe ni ... au ni
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa wazi njia mbili zinazowezekana huku ukihifadhi ulinganisho wa Kigiriki.
- source_word: οὖν
  choice: Basi
  rationale: Hutoa hitimisho kutokana na maelezo yaliyotangulia kuhusu mashahidi wa ufufuo, bila kuwa nzito kama 'kwa hiyo' katika sentensi hii.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi cha nafsi ya kwanza kimetajwa wazi ili kuhifadhi msisitizo na utofautishaji na 'wao'.
- source_word: ἐκεῖνοι
  choice: wao
  rationale: Kinawarejelea mitume au mashahidi wengine waliotajwa katika muktadha; 'wao' ni ya kawaida na wazi kwa Kiswahili.
- source_word: οὕτως
  choice: hivi ndivyo
  rationale: Huonyesha namna au maudhui yaliyotangulia. Kurudia kauli ileile kunahifadhi usambamba wa Kigiriki bila kulazimisha kuchagua kati ya namna na maudhui.
- source_word: κηρύσσομεν
  choice: tunavyohubiri
  rationale: Kitenzi 'kuhubiri' ni cha kawaida na chenye hadhi kwa kutangaza ujumbe hadharani; nafsi ya wingi inamjumuisha Paulo pamoja na wale wengine.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha kuhubiri kwao na kuamini kwa Wakorintho.
- source_word: ἐπιστεύσατε
  choice: mlivyoamini
  rationale: Hurejelea tendo la wasomaji la kuamini wakati uliopita, bila kuongeza kitu walichokiamini ambacho hakitajwi wazi katika kishazi.
theological_decisions:
- issue: Umoja wa ushuhuda wa kitume katika mahubiri
  choice: Paulo anasema kwamba, iwe mhubiri alikuwa yeye au mitume wengine, mahubiri yao yalikuwa ya namna au maudhui yale yale, na Wakorintho waliamini vivyo hivyo.
  alternative: 'Kusisitiza namna pekee: ''ndivyo tunavyohubiri, nanyi ndivyo mlivyoamini.'''
  rationale: Kurudiwa kwa οὕτως kunaunganisha ujumbe uliotangulia na kuhubiri pamoja na kuamini, lakini kunaacha wazi kama msisitizo hasa ni namna au maudhui; tafsiri haiongezi madai mapana ya kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kigiriki kwa ukaribu, huku 'hivi ndivyo' ikitumiwa mara mbili kuhifadhi usambamba wa asili.
