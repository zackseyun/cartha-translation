  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: sw
  text: Upendo huvumilia, upendo hutenda kwa fadhili. Hauhusudu, haujigambi, wala haujivimbi kwa kiburi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: upendo
  rationale: Neno la kawaida na lenye hadhi kwa dhana pana ya upendo katika muktadha huu wa kimaadili na kiteolojia.
- source_word: μακροθυμεῖ
  choice: huvumilia
  rationale: Huonyesha subira ya muda mrefu, hasa katika kuhusiana na watu wengine, kwa Kiswahili cha kawaida na fasaha.
- source_word: χρηστεύεται
  choice: hutenda kwa fadhili
  rationale: Kitenzi hiki adimu kinamaanisha kuonyesha wema kwa vitendo; tafsiri hii huhifadhi hali yake ya kitendo kuliko kusema tu 'ni mwenye fadhili.'
- source_word: ζηλοῖ
  choice: hauhusudu
  rationale: Katika mfululizo huu hasi, kitenzi kinaelekea kumaanisha husuda au wivu wenye kutamani alicho nacho mwingine.
- source_word: περπερεύεται
  choice: haujigambi
  rationale: Huwasilisha kujisifu au kujionyesha kwa majivuno kwa lugha ya sasa yenye hadhi.
- source_word: φυσιοῦται
  choice: haujivuni
  rationale: Huwasilisha kiburi kinacholengwa na sitiari ya Kigiriki ya 'kujazwa hewa,' ingawa sitiari yenyewe hailazimishwi katika Kiswahili kisicho cha kawaida.
- source_word: οὐ
  choice: ha(u)-
  rationale: Kiambishi cha ukanushi katika vitenzi vya Kiswahili hutoa mfululizo wa sentensi fupi unaolingana kwa kawaida na ukanushi wa Kigiriki.
theological_decisions:
- issue: Maana ya ἀγάπη katika kifungu hiki cha kimaadili na kiteolojia
  choice: upendo
  alternative: mapendo; hisani
  rationale: '''Upendo'' huhifadhi maana pana ya mahusiano na maadili bila kuibana kuwa utoaji wa msaada tu.'
- issue: Sitiari ya φυσιοῦται kuhusu kiburi
  choice: haujivuni
  alternative: hajivimbi kwa kiburi
  rationale: '''Haujivuni'' ni ya kawaida na wazi; tanbihi huhifadhi picha ya asili ya kujazwa hewa bila kuifanya matini kuu kuwa nzito.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Marudio ya 'upendo' katika vipashio viwili vya kwanza yamehifadhiwa kwa mkazo wa balagha; baadaye ngeli ya nomino imeonyeshwa kwa viambishi vya kitenzi.
