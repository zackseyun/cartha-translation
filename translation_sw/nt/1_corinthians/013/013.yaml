base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: sw
  text: 'Na sasa haya matatu yanadumu: imani[a], tumaini, na upendo; lakini lililo kuu kuliko hayo ni upendo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwamini” au “kutegemea”; katika muktadha huu, “imani” ndiyo tafsiri ya kawaida.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: νυνί huonyesha hali ya sasa au hitimisho, na δέ inaweza kuleta utofautishaji mpole au kuendeleza hoja. “Lakini sasa” huhifadhi tofauti na vipawa vinavyokoma katika muktadha uliotangulia.
- source_word: μένει
  choice: yanadumu
  rationale: Kitenzi μένω hapa kina maana ya kuendelea kuwapo au kustahimili. “Yanadumu” ni Kiswahili cha sasa na huonyesha utofauti na mambo yanayokoma.
- source_word: πίστις
  choice: imani
  rationale: Katika utatu huu pamoja na tumaini na upendo, “imani” ndiyo maana ya kawaida na inayofaa zaidi; “kutumaini” au “uaminifu” kungebadili au kupunguza upana wa maana.
- source_word: ἐλπίς
  choice: tumaini
  rationale: ἐλπίς kwa kawaida humaanisha tumaini katika matumizi ya Paulo, hasa katika utatu huu wa kiteolojia.
- source_word: ἀγάπη
  choice: upendo
  rationale: “Upendo” ni tafsiri ya kawaida, wazi na yenye hadhi ya ἀγάπη katika Kiswahili cha kisasa.
- source_word: τὰ τρία ταῦτα
  choice: mambo haya matatu
  rationale: Usemi huu unarejelea imani, tumaini na upendo. Kuongeza “mambo” kunafanya ngeli na rejeleo viwe vya asili katika Kiswahili.
- source_word: μείζων δὲ τούτων
  choice: Lakini lililo kuu kuliko hayo
  rationale: Ingawa μείζων ni umbo la kulinganisha, pamoja na τούτων huonyesha cheo cha upendo ndani ya mambo hayo matatu. Muundo huu huhifadhi kwa karibu hali ya kulinganisha ya Kigiriki bila kupoteza maana ya ukuu.
theological_decisions:
- issue: Maana ya πίστις katika utatu wa Paulo
  choice: imani
  alternative: kutumaini; uaminifu
  rationale: Muktadha wa “imani, tumaini na upendo” unaunga mkono “imani.” Hii haigeuzi neno hilo kuwa sifa ya uaminifu wala kulifunga kwa maana nyembamba ya kutumaini.
- issue: Nguvu ya ulinganishi katika μείζων
  choice: lililo kuu kuliko hayo ni upendo
  alternative: lililo kuu zaidi kati ya hayo ni upendo
  rationale: Tafsiri iliyochaguliwa huhifadhi umbo la kulinganisha la Kigiriki, huku ikieleza wazi kwamba upendo unapewa nafasi ya juu katika utatu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu hoja ya Kigiriki huku ukitumia upatanisho wa kisarufi wa asili.
