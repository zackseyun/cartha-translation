  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: sw
  text: Upendo hautendi isivyopasa[a], hautafuti yaliyo yake[b], haukasirishwi[c], wala hauhesabu ubaya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hautendi kwa aibu” au “hautendi bila adabu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hautafuti yaliyo yake mwenyewe”; yaani, haujitafutii maslahi yake.
    reason: lexical_alternative
  - marker: c
    text: Au “hauwashwi na hasira.” Tafsiri “hakasiriki kwa urahisi” huongeza wazo la “kwa urahisi,” ambalo halijasemwa wazi katika Kigiriki.
    reason: alternative_reading
  - marker: d
    text: Au “hauweki hesabu ya ubaya” au “hauweki kumbukumbu ya mabaya.” Kihalisi, “hauhesabu ubaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: hautendi isivyopasa
  rationale: Kitenzi hiki humaanisha kutenda kwa namna isiyofaa, ya aibu, au isiyo na adabu. Kauli hii ni ya kawaida na yenye hadhi, na haibani maana kuwa ukorofi peke yake.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: hautafuti yaliyo yake
  rationale: Huhifadhi muundo wa Kigiriki, ‘kutafuta mambo yaliyo yake mwenyewe,’ huku ikidokeza ubinafsi bila kuongeza wazo mahususi la kushikilia njia yake.
- source_word: παροξύνεται
  choice: hauchokozeki
  rationale: Huwasilisha hali ya kuchochewa au kuamshwa kwa hasira bila kuongeza kielezi ‘kwa urahisi,’ ambacho hakipo wazi katika Kigiriki.
- source_word: λογίζεται
  choice: hauhesabu
  rationale: Huhifadhi picha ya kufanya hesabu au kuweka jambo katika akaunti, kwa neno la Kiswahili linaloeleweka kwa urahisi.
- source_word: τὸ κακόν
  choice: ubaya
  rationale: Nomino ya umoja inaweza kumaanisha uovu au jambo baya. ‘Ubaya’ huhifadhi upana huo na, pamoja na ‘kuhesabu,’ inaweza kueleweka kuhusu ubaya uliotendwa.
- source_word: ἀγάπη (kiima kinachoeleweka kutokana na muktadha)
  choice: Upendo
  rationale: Kutaja ‘Upendo’ wazi huifanya sentensi isimame vizuri kwa Kiswahili na huhifadhi uhuishaji wa upendo katika mfululizo huu.
theological_decisions:
- issue: Iwapo παροξύνεται iongezwe maana ya ‘kwa urahisi’
  choice: hauchokozeki
  alternative: hakasiriki kwa urahisi
  rationale: Kigiriki hakina kielezi kinacholingana na ‘kwa urahisi’; tafsiri haiongezi kipimo hicho, ingawa maelezo ya chini yanataja tafsiri hiyo iliyozoeleka.
- issue: Iwapo λογίζεται τὸ κακόν ifafanuliwe kuwa kuweka kumbukumbu ya mabaya
  choice: hauhesabu ubaya
  alternative: hauweki kumbukumbu ya mabaya
  rationale: Tafsiri iliyochaguliwa huhifadhi sitiari ya hesabu na umoja wa τὸ κακόν, bila kuamua kimya-kimya kwamba inamaanisha orodha ya makosa mengi yaliyotendwa dhidi ya mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unarudia kiambishi cha ngeli cha ‘upendo’ (u-/hau-) ili kutoa mfululizo wa asili na ulio wazi. ‘Wala’ kabla ya kishazi cha mwisho hufanya orodha isomeke kwa ufasaha bila kubadili uhusiano wa vifungu.
