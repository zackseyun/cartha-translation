id: 1CO.13.9
reference: 1 Corinthians 13:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: sw
  text: Kwa maana tunajua kwa sehemu[a], na tunatoa unabii kwa sehemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kiasi”; nahau ya Kigiriki kwa neno halisi ni “kutokana na sehemu,” nayo imerudiwa katika vifungu vyote viwili ili kusisitiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: kwa sehemu
  rationale: Nahau hii humaanisha kujua au kufanya jambo kwa sehemu, si kwa ukamilifu. Kurudia maneno yale yale katika vifungu vyote viwili kunahifadhi msisitizo na ulinganifu wa Kigiriki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli hii inaeleza sababu ya yaliyotangulia; “Kwa maana” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: γινώσκομεν
  choice: tunajua
  rationale: Hili ndilo neno la moja kwa moja kwa maana ya kuwa na maarifa, bila kulipanua kuwa ufahamu wa kina.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vifungu viwili vinavyolingana.
- source_word: προφητεύομεν
  choice: tunatoa unabii
  rationale: Katika muktadha wa karama za kiroho, usemi huu unamaanisha kusema ujumbe wa kinabii. “Tunatoa unabii” ni Kiswahili cha kawaida na hakipunguzi maana kuwa kutabiri yajayo pekee au kuhubiri kwa ujumla.
theological_decisions:
- issue: Maana ya shughuli ya kinabii katika kanisa
  choice: tunatoa unabii
  alternative: tunatabiri mambo yajayo; tunahubiri
  rationale: Muktadha unahusu karama za kiroho, na neno la Kigiriki linaweza kumaanisha usemi wa kinabii kwa upana kuliko kutabiri tu. Tafsiri hii inadumisha upana na mvutano wa kitheolojia wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa vifungu viwili na marudio ya “kwa sehemu” umehifadhiwa.
