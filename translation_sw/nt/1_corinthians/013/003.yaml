  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: sw
  text: Na hata nikigawa mali zangu zote, na hata nikiukabidhi mwili wangu ili nichomwe moto,[a] lakini nisipokuwa na upendo, sipati faida yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “ili nijisifu” badala ya “ili nichomwe moto.”
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: nikigawa
  rationale: Kitenzi hiki kina wazo la kugawa kwa mafungu. “Nikigawa” ni Kiswahili cha kawaida kinachoonyesha kuwapa wengine mali, bila kuongeza wazi nia ya kutoa sadaka.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: mali zangu zote
  rationale: Kirai hiki kinamaanisha mali au vitu anavyomiliki mtu. “Mali zangu zote” ni cha asili, wazi, na kinahifadhi uzito wa kutoa kila kitu.
- source_word: παραδῶ
  choice: nikiukabidhi
  rationale: “Kukabidhi” huhifadhi maana ya kumpa mwingine au kuutoa chini ya mamlaka yake, bila kuingiza tafsiri maalumu kama “kuutoa dhabihu.”
- source_word: τὸ σῶμά μου
  choice: mwili wangu
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai halisi, bila upanuzi wa kimafumbo.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa kwa lugha ya sasa na iliyo wazi.
- source_word: καυθήσομαι
  choice: nichomwe moto
  rationale: SBLGNT ina umbo la kutendwa linalotokana na καίω, “kuchoma.” “Nichomwe moto” hulitafsiri moja kwa moja na kwa Kiswahili cha kawaida; tofauti ya hati “nijisifu” imewekwa katika tanbihi.
- source_word: ἀγάπην
  choice: upendo
  rationale: “Upendo” ndiyo tafsiri ya kawaida na pana ya ἀγάπη katika Kiswahili cha sasa.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: sipati faida yoyote
  rationale: Kauli hii inaonyesha kwamba msemaji hapokei manufaa yoyote. “Sipati faida yoyote” ni ya kawaida na huhifadhi msisitizo wa matokeo kwa msemaji mwenyewe.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Na hata niki... na hata niki...
  rationale: Kurudia muundo wa masharti kunahifadhi mfululizo na ongezeko la nguvu katika mifano ya Paulo. “Hata” huonyesha hali hizi zilizokithiri kwa Kiswahili cha asili.
theological_decisions:
- issue: Tofauti ya maandishi katika kishazi cha kusudi
  choice: SBLGNT καυθήσομαι imetafsiriwa “nichomwe moto” katika maandishi makuu.
  alternative: καυχήσωμαι — “nijisifu”
  rationale: Rasimu inafuata toleo la Kigiriki lililotolewa. Kwa kuwa tofauti hii hubadili maana kwa kiasi kikubwa—kuchomwa kwa mwili dhidi ya kujisifu—imesemwa wazi katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti unaorudiwa umehifadhiwa, na maneno yamechaguliwa yaeleweke kwa wasomaji wa kawaida bila kupunguza uzito wa kifungu.
