id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: sw
  text: Kwa maana sasa tunaona kupitia kioo, kwa namna ya fumbo[a], lakini wakati huo tutaona uso kwa uso. Sasa ninajua kwa sehemu, lakini wakati huo nitajua kikamilifu, kama vile mimi pia nilivyojulikana kikamilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri nyingine, “kwa namna isiyo wazi.” Kigiriki kinasema kihalisi zaidi “katika fumbo,” kikisisitiza kuona kwa njia isiyo ya moja kwa moja na yenye kutatanisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: tunaona
  rationale: Huhifadhi sitiari ya kuona na ni usemi wa kawaida wa Kiswahili.
- source_word: ἄρτι
  choice: sasa
  rationale: Huonyesha hali ya sasa ikilinganishwa na τότε, ‘wakati huo.’
- source_word: δι’ ἐσόπτρου
  choice: kupitia kioo
  rationale: Hufuata διά pamoja na jenitivi na kuhifadhi wazo la kuona kwa njia isiyo ya moja kwa moja; ‘kioo’ hapa ni kioo cha kujitazamia.
- source_word: ἐν αἰνίγματι
  choice: kwa namna ya fumbo
  rationale: Huhifadhi maana ya αἴνιγμα kama fumbo na wakati huohuo kutoa Kiswahili cha kawaida kinachoeleza kuona kusiko wazi na kwa njia isiyo ya moja kwa moja.
- source_word: τότε δὲ
  choice: lakini wakati huo
  rationale: Huonyesha wazi ulinganisho wenye utofauti kati ya sasa na wakati ujao.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: uso kwa uso
  rationale: Ni nahau ya kawaida inayohifadhi picha ya kukutana moja kwa moja.
- source_word: γινώσκω ἐκ μέρους
  choice: ninajua kwa sehemu
  rationale: Hutoa kwa usahihi wazo la maarifa ya sehemu tu na kuhifadhi ulinganifu wa sentensi.
- source_word: ἐπιγνώσομαι
  choice: nitajua kikamilifu
  rationale: Huonyesha nguvu ya kitenzi katika utofauti na kujua kwa sehemu, bila kudai kwamba mtu atakuwa na maarifa yote ya Mungu.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: kama vile mimi pia nilivyojulikana kikamilifu
  rationale: Huhifadhi ulinganifu wa kileksia na ἐπιγνώσομαι pamoja na kauli tendwa, hivyo anayemjua Paulo habainishwi wazi kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Kiwango cha maarifa ya wakati ujao katika ἐπιγνώσομαι
  choice: nitajua kikamilifu
  alternative: nitajua kila kitu
  rationale: Tafsiri iliyochaguliwa inaonyesha utofauti kati ya kujua kwa sehemu na kujua kikamilifu, lakini haiongezi dai la kuwa na maarifa yasiyo na mipaka au ya Kimungu.
- issue: Utambulisho wa anayemjua msemaji katika ἐπεγνώσθην
  choice: kauli tendwa ‘nilivyojulikana’ bila kumtaja mtendaji
  alternative: ‘kama Mungu anavyonijua kikamilifu’
  rationale: Kigiriki hakumtaji mtendaji moja kwa moja; kutomtaja kunahifadhi uwazi huo wa kimuundo na hakulazimishi ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa ‘sasa ... lakini wakati huo’ na ‘kwa sehemu ... kikamilifu’ umehifadhiwa.
