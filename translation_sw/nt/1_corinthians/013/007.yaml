  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: sw
  text: Hustahimili mambo yote[a], huamini mambo yote[b], hutumaini mambo yote, huvumilia mambo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hufunika mambo yote”; στέγει inaweza kuwa na maana ya kufunika au kulinda, na pia ya kustahimili.
    reason: lexical_alternative
  - marker: b
    text: Hapa haimaanishi kwamba upendo huamini kila jambo bila utambuzi; bali una mwelekeo wa kuamini.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντα
  choice: mambo yote
  rationale: Kirai hiki cha jumla kimerudiwa pamoja na kila kitenzi. “Mambo yote” kinahifadhi upana na urudiaji wa balagha wa Kigiriki bila kufafanua zaidi kitu kinachorejelewa.
- source_word: στέγει
  choice: hustahimili
  rationale: στέγω inaweza kumaanisha kufunika au, kwa upanuzi, kustahimili. “Hustahimili” ni ya kawaida na yenye hadhi, nayo inafaa katika mfululizo huu wa sifa za upendo; maana mbadala ya kufunika imehifadhiwa katika tanbihi.
- source_word: πιστεύει
  choice: huamini
  rationale: πιστεύω humaanisha kuamini au kutumaini/kumwamini mtu. “Huamini” inafuata kwa uwazi maana ya kawaida ya neno na kudumisha mtindo mfupi wa mstari, bila kudokeza kwamba upendo hudanganyika kwa urahisi.
- source_word: ἐλπίζει
  choice: hutumaini
  rationale: “Hutumaini” ni tafsiri ya moja kwa moja na ya kawaida ya ἐλπίζει, na inahifadhi ulinganifu wa sentensi.
- source_word: ὑπομένει
  choice: huvumilia
  rationale: ὑπομένω hueleza kudumu chini ya shinikizo au mateso. “Huvumilia” ni ya asili katika Kiswahili na inaleta hitimisho lenye nguvu kwa mfululizo huu.
theological_decisions:
- issue: Maana ya kurudiwa kwa πάντα katika maelezo ya upendo
  choice: Lugha hii ya balagha inaeleza uthabiti mpana wa upendo, si kwamba upendo hukubali au huamini bila utambuzi kila jambo linalowezekana.
  alternative: Kuelewa kauli hizo kama madai kamili kwamba upendo huamini au hukubali kila kitu bila ubaguzi.
  rationale: Muktadha wa karibu ni maelezo ya kishairi kuhusu tabia ya ἀγάπη. Kurudia “mambo yote” kunahifadhi msisitizo wa Paulo bila kuingiza wazo kwamba upendo hauna utambuzi wa maadili au hudanganyika kwa urahisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi vya mazoea (hu-) unawakilisha sifa za kudumu za upendo na kuhifadhi ulinganifu wa vifungu vinne.
