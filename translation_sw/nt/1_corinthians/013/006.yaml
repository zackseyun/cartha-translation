translation:
  language: sw
  text: Upendo haufurahii uovu,[a] bali hufurahi pamoja na ukweli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukosefu wa haki” au “matendo mabaya.”
    reason: lexical_alternative
  - marker: b
    text: Au “huufurahia ukweli.” Kitenzi ambatano cha Kigiriki kinaweza kumaanisha kushiriki furaha, au kufurahia ukweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: hufurahii
  rationale: Kitenzi hiki kinaonyesha kufurahia au kupata furaha kwa sababu ya jambo fulani. “Hufurahii” ni cha kawaida katika Kiswahili na kinadumisha urudiaji wa kimtindo pamoja na συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: uovu
  rationale: Katika muundo huu ἐπί pamoja na hali ya utoaji huonyesha sababu au jambo linalofurahiwa. ἀδικία linaweza kumaanisha uovu, kutenda mabaya, au ukosefu wa haki. “Uovu” linabeba maana pana ya kimaadili bila kuifunga katika dhuluma ya kijamii pekee.
- source_word: συγχαίρει
  choice: hufurahi pamoja na
  rationale: Kiambishi συν- kinaonyesha kushiriki furaha. “Hufurahi pamoja na” kinahifadhi wazo hilo huku kikibaki cha asili katika Kiswahili; uwezekano wa maana ya kufurahia kweli umewekwa katika tanbihi.
- source_word: δὲ
  choice: bali
  rationale: Hapa δέ linaonyesha ulinganisho mkali kati ya jambo ambalo upendo haulifurahii na lile analolifurahia. “Bali” linaonyesha upinzani huo kwa uwazi.
- source_word: τῇ ἀληθείᾳ
  choice: kweli
  rationale: “Kweli” linadumisha utofauti wa kimaadili na ἀδικία bila kubainisha kupita kiasi kama kinachokusudiwa ni ukweli wa maneno, mwenendo wa kweli, au kweli ya injili.
theological_decisions:
- issue: Maana ya ἀδικία katika ulinganisho wa kimaadili wa Paulo
  choice: uovu
  alternative: ukosefu wa haki; kutenda mabaya
  rationale: “Uovu” linahifadhi upana wa kimaadili wa neno hili na utofauti wake na “kweli.” “Ukosefu wa haki” lingeweza kueleweka hasa kama dhuluma ya kijamii au kisheria, ilhali muktadha unaweza kujumuisha kila aina ya kosa la kimaadili.
- issue: Nguvu ya συν- katika συγχαίρει
  choice: hufurahi pamoja na kweli
  alternative: huifurahia kweli
  rationale: Tafsiri kuu inaonyesha wazi maana ya kushiriki furaha iliyomo katika kitenzi ambatano, lakini tanbihi inahifadhi uwezekano kwamba kitenzi hicho hapa kinamaanisha kufurahia kwa sababu ya kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Upendo” limetajwa ili kurejesha wazi mhusika wa mfululizo huu wa sifa, ingawa Kigiriki cha mstari huu hakilirudii. Muundo sambamba “haufurahii … bali hufurahi” umehifadhiwa.
