  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: sw
  text: Nilipokuwa mtoto, nilisema kama mtoto, nilifikiri kama mtoto, nilitafakari kama mtoto. Nilipofikia kuwa mwanamume, niliyaacha mambo ya mtoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo ya kitoto” au “tabia za mtoto.” Kigiriki kinasema kihalisi, “mambo ya mtoto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: mtoto
  rationale: Neno hili humaanisha mtoto mdogo na linaweza pia kudokeza kutokomaa. “Mtoto” ni la kawaida na linahifadhi vizuri tofauti na ἀνήρ bila kulibana kuwa “mtoto mchanga.”
- source_word: ἐλάλουν
  choice: nilisema
  rationale: “Nilisema” ni tafsiri ya kawaida na yenye hadhi ya tendo la kusema, na inadumisha mfuatano wa balagha wa mstari.
- source_word: ἐφρόνουν
  choice: nilifikiri
  rationale: φρονέω hapa yahusu fikira au mtazamo. “Nilifikiri” ni fupi, ya asili, na bado inatofautishwa na tendo la kutafakari katika kitenzi kinachofuata.
- source_word: ἐλογιζόμην
  choice: nilitafakari
  rationale: λογίζομαι yaweza kumaanisha kuhesabu, kufikiri kwa makini, au kujadiliana akilini. “Nilitafakari” huonyesha fikira za makusudi na kuitofautisha na “nilifikiri.”
- source_word: γέγονα
  choice: nilipokuwa
  rationale: Ingawa umbo la Kigiriki ni timilifu na linaashiria kufikia hali mpya, katika Kiswahili “nilipokuwa mwanamume” hueleweka kwa kawaida kama mpito wa kukua katika muktadha huu na hudumisha ulinganifu na mwanzo wa sentensi.
- source_word: ἀνήρ
  choice: mwanamume
  rationale: ἀνήρ ni nomino ya kiume inayomaanisha mwanamume. “Mwanamume” huhifadhi tofauti ya wazi ya Kigiriki kati ya mtoto na mwanamume bila kuigeuza kuwa usemi usio na jinsia.
- source_word: κατήργηκα
  choice: niliyaacha
  rationale: καταργέω hapa ina maana ya kuondoa au kuacha yasitumike. “Niliyaacha” ni ya asili katika sitiari ya kukomaa na inaonyesha kuachana na hali ya utoto.
- source_word: τὰ τοῦ νηπίου
  choice: mambo ya mtoto
  rationale: Huu ndio uwasilishaji wa karibu wa usemi halisi “mambo ya mtoto.” Unahifadhi upana wake, badala ya kuamua kimya kimya kwamba maana pekee ni tabia za kitoto.
theological_decisions:
- issue: Tofauti yenye jinsia katika ἀνήρ
  choice: mwanamume
  alternative: mtu mzima
  rationale: Kigiriki kinatumia nomino ya kiume ἀνήρ. Tafsiri inahifadhi hilo kama “mwanamume”; katika muktadha Paulo anajitumia mwenyewe kama mfano wa kukomaa, wala hasemi kwamba wanaume ni bora kuliko wanawake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya kawaida na yenye hadhi. Marudio ya “kama mtoto” yamehifadhiwa kwa sababu ndiyo yanayounda mdundo na mkazo wa Kigiriki.
