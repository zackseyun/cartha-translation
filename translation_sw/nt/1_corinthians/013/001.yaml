  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: sw
  text: Hata kama nikinena kwa lugha[a] za wanadamu na za malaika, lakini sina upendo, nimekuwa shaba inayolia[b] au upatu unaolia kwa kelele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha.” Hapa “lugha” inadumisha uhusiano na mjadala wa kunena kwa lugha katika 1 Wakorintho.
    reason: lexical_alternative
  - marker: b
    text: Au “shaba inayotoa sauti” au “metali inayolia.” Kigiriki kinataja metali ya shaba au metali ya aina hiyo inayosikika, bila kutaja ala maalumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Hata niki-
  rationale: 'Muundo huu unaonyesha sharti la kudhaniwa na pia nguvu ya hoja ya Paulo: ‘hata kama ningesema.’'
- source_word: ταῖς γλώσσαις
  choice: kwa lugha
  rationale: ‘Lugha’ ni Kiswahili cha kawaida kinachoweza kumaanisha lugha za usemi na pia kinadumisha uhusiano na mjadala wa kunena kwa lugha katika 1 Wakorintho.
- source_word: τῶν ἀνθρώπων
  choice: za wanadamu
  rationale: ‘Wanadamu’ inaonyesha kwa uwazi tofauti kati ya viumbe vya kibinadamu na malaika bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: λαλῶ
  choice: nikisema
  rationale: Kitenzi hiki kinaonyesha tendo la kusema katika sharti la kudhaniwa na kinasikika kwa kawaida katika Kiswahili.
- source_word: τῶν ἀγγέλων
  choice: za malaika
  rationale: Katika tofauti na wanadamu, neno hili kwa kawaida linarejelea viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἀγάπην
  choice: upendo
  rationale: ‘Upendo’ ni neno la kawaida, la heshima, na lenye upana unaofaa kwa ἀγάπη katika muktadha huu.
- source_word: δὲ μὴ ἔχω
  choice: lakini sina
  rationale: ‘Lakini’ inadumisha utofautishaji, na ‘sina’ ni njia ya moja kwa moja na ya kawaida ya kusema kutokuwa na kitu.
- source_word: γέγονα
  choice: nimekuwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali iliyotokea na inayoendelea; ‘nimekuwa’ inadumisha maana hiyo.
- source_word: χαλκὸς ἠχῶν
  choice: shaba inayolia
  rationale: Tafsiri hii inabaki karibu na taswira ya Kigiriki ya metali inayotoa sauti bila kuamua kimya kimya kwamba ni ala fulani maalumu.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: au upatu unaovuma
  rationale: ‘Upatu’ ni ala ya metali inayogongwa, na ‘unaovuma’ huwasilisha sauti yake kubwa na yenye makelele kwa lugha ya asili ya Kiswahili.
theological_decisions:
- issue: Maana ya ‘lugha za wanadamu na za malaika’
  choice: Maneno yametafsiriwa kama ulinganisho wa moja kwa moja kati ya lugha za wanadamu na za malaika, bila kuamua kama lugha za malaika ni halisi au ni usemi wa kutia chumvi.
  alternative: Kuzifafanua wazi kuwa lugha halisi za mbinguni, au kuwa usemi wa kutia chumvi tu.
  rationale: Aya yenyewe haimalizi swali hilo; tafsiri inadumisha uwezekano na mvutano wa usemi wa Paulo bila kuingiza msimamo fulani kuhusu kunena kwa lugha.
- issue: Upeo wa ἀνθρώπων
  choice: wanadamu
  alternative: wanaume; watu
  rationale: Katika muktadha huu neno linatofautisha jamii ya wanadamu na malaika, si wanaume na wanawake.
- issue: Taswira ya χαλκὸς ἠχῶν
  choice: shaba inayolia
  alternative: kengele ya shaba; gongo linalolia
  rationale: Kigiriki kinataja metali inayotoa sauti bila kutaja kwa uhakika ala maalumu; tafsiri kuu haifungi maana hiyo kwa ala moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kusomeka kwa sauti, huku ‘wanadamu’ ikionyesha tofauti na malaika kwa usahihi na bila utata wa kijinsia. Maneno ya taswira ya sauti yamehifadhiwa bila kuongeza ala isiyotajwa wazi katika Kigiriki.
