lexical_decisions:
- source_word: ὅταν
  choice: kitakapokuja
  rationale: 'Muundo wa wakati ujao wenye -takapo- unaonyesha tukio linalotarajiwa: “kitakapokuja,” badala ya maana ya kurudiwa-rudiwa ya “kila kinapokuja.”'
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti nyepesi kati ya hali ya sasa ya kujua kwa sehemu na kuja kwa kilicho kamili.
- source_word: ἔλθῃ
  choice: kitakapokuja
  rationale: Kitenzi hiki baada ya ὅταν kinaelekeza kwenye tukio la baadaye; “kitakapokuja” ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: τὸ τέλειον
  choice: kilicho kamili
  rationale: τέλειον inaweza kumaanisha kilicho kamili, timilifu, au kilichofikia ukomavu. “Kilicho kamili” huhifadhi upana huo bila kutaja kwa uhakika jambo linalorejelewa.
- source_word: τὸ ἐκ μέρους
  choice: kilicho cha sehemu
  rationale: Kirai hiki kimetumiwa kama nomino na kinatofautishwa moja kwa moja na “kilicho kamili.” Tafsiri hii huhifadhi wazo la hali yenye sehemu tu bila kulibadili kuwa fasiri maalumu.
- source_word: καταργηθήσεται
  choice: kitaondolewa
  rationale: Kitenzi cha wakati ujao katika hali ya kutendwa kinaonyesha kwamba kilicho cha sehemu kitaondoshwa au kukomeshwa. “Kitaondolewa” huhifadhi hali ya kutendwa bila kudokeza lazima kwamba kitaangamizwa.
theological_decisions:
- issue: Maana na rejeleo la τὸ τέλειον
  choice: Imetafsiriwa kwa ujumla kuwa “kilicho kamili” bila kutaja rejeleo lake.
  alternative: “kilicho timilifu,” “kilichofikia ukomavu,” au hali ya ukamilifu wa mwisho
  rationale: Kigiriki hakitaji wazi katika mstari huu kile kinachorejelewa. Tafsiri inapaswa kuhifadhi uwezekano wa ukamilifu, ukomavu, au utimilifu wa mwisho badala ya kuamua hoja ya kiteolojia. Hali ya kisarufi ya usemi huu haithibitishi peke yake fasiri yoyote maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo sambamba wa “kilicho kamili” na “kilicho cha sehemu” unahifadhi utofauti wa Kigiriki na utata wake wa makusudi.
