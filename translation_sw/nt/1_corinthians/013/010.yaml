    text: Au “kilicho timilifu” au “kilichofikia ukomavu.” Maana ya kirai cha Kigiriki τὸ τέλειον inajadiliwa; kinaweza kueleweka kuwa ukamilifu, ukomavu, au utimilifu wa mwisho unaochukua nafasi ya hali ya sasa iliyo kwa sehemu.
