id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: sw
  text: Hata kama nina unabii, na ninajua siri zote na maarifa yote, na hata kama nina imani yote[a] kiasi cha kuhamisha milima, lakini sina upendo, mimi si kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utegemezi wote”; kwa uwezekano mdogo, “uaminifu wote.” Neno la Kigiriki linaweza kuwa na maana mbalimbali, lakini hapa inaelekea linarejelea imani ya ajabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: unabii
  rationale: Neno hili linadumisha maana pana ya nomino ya Kigiriki katika muktadha wa karama za kiroho bila kuifafanua kupita kiasi kuwa cheo au tendo pekee.
- source_word: εἰδῶ
  choice: ninajua
  rationale: Kitenzi οἶδα kimsingi humaanisha kujua; hapa “ninajua siri zote” ni Kiswahili cha kawaida na kinatofautishwa na nomino “maarifa” inayofuata.
- source_word: μυστήρια
  choice: siri
  rationale: “Siri” ni neno la kawaida la kibiblia kwa μυστήριον na linaweza kumaanisha mambo ya Mungu yaliyofichika au yaliyofunuliwa bila kuongeza ufafanuzi usio katika maandishi.
- source_word: γνῶσιν
  choice: maarifa
  rationale: “Maarifa” yanahifadhi nomino na kuitofautisha na kitenzi “ninajua,” huku yakitoa maana ya ujuzi kwa upana.
- source_word: πᾶσαν τὴν πίστιν
  choice: imani yote
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις. Katika muktadha huu kauli ya kupitiliza inaelekea kumaanisha imani yenye uwezo wa ajabu, si lazima istilahi mahsusi ya imani iletayo wokovu.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: kiasi cha kuhamisha milima
  rationale: Kauli hii inatoa matokeo au kiwango kwa Kiswahili cha asili na kuhifadhi picha ya Kigiriki ya kuhamisha milima.
- source_word: ἀγάπην
  choice: upendo
  rationale: “Upendo” ni tafsiri ya moja kwa moja, ya sasa, na yenye upana unaofaa kwa ἀγάπη.
- source_word: οὐθέν εἰμι
  choice: mimi si kitu
  rationale: Tafsiri hii ni ya moja kwa moja na yenye mkazo, ikihifadhi kauli kali ya Paulo bila kuipunguza kuwa kutokuwa na manufaa tu.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa uwezo wa kuhamisha milima
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unaonyesha imani ya ajabu inayoweza kuhusishwa na tendo lenye nguvu. “Uaminifu” inawezekana katika matumizi mengine ya πίστις, lakini haielekei kuwa maana inayokusudiwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia “hata kama” unahifadhi msisitizo wa masharti katika Kigiriki; “lakini” inaonyesha wazi utofautishaji wa δέ.
