review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the threefold contrast and distinguishes παύσονται ('will cease') from καταργηθήσονται/καταργηθήσεται ('will be set aside'). However, 'haushindwi' literally means 'is not defeated' and does not adequately represent πίπτει in its contextual sense of failing; 'haufeli' is the closer modern Swahili equivalent.
  naturalness: The revised parallel conditional construction, 'Iwe ni …,' is concise, idiomatic in a formal biblical register, and avoids making the Greek εἴτε clauses sound merely like assertions about the current existence of gifts.
  terminology: Upendo, unabii, lugha, and ujuzi are appropriate. 'Lugha' responsibly retains the lexical ambiguity of γλῶσσαι, with 'ndimi' supplied as an alternative. 'Utaondolewa' consistently renders both occurrences of καταργέω and remains distinct from 'zitakoma.'
  issues:
  - severity: medium
    issue: ‘Upendo haushindwi kamwe’ for Ἡ ἀγάπη οὐδέποτε πίπτει
    rationale: ‘Kushindwa’ normally denotes being defeated rather than failing, falling, or proving ineffective. It subtly changes the image and the contrast with the temporary gifts. ‘Upendo haufeli kamwe’ is a direct, current, and natural rendering of the contextual sense without assimilating it to ‘will cease’.
  - severity: low
    issue: ‘Lakini kama kuna …’ weakens the repeated εἴτε construction
    rationale: While understandable, it frames each item as a simple condition of existence. ‘Iwe ni …’ more naturally represents the Greek ‘whether …’ series and preserves the balanced rhetorical structure.
  revised_text: Upendo haufeli kamwe.[a] Lakini iwe ni unabii, utaondolewa; iwe ni lugha,[b] zitakoma; iwe ni ujuzi, utaondolewa.[c]
