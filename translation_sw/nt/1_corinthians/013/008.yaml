source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: sw
  text: Upendo haufeli kamwe.[a] Lakini iwe ni unabii, utaondolewa; iwe ni lugha,[b] zitakoma; iwe ni ujuzi, utaondolewa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Upendo hauanguki kamwe,” au “Upendo haukomi kamwe.”
    reason: lexical_alternative
  - marker: b
    text: Au “ndimi.”
    reason: alternative_reading
  - marker: c
    text: Kitenzi kilichotafsiriwa “utaondolewa” ni kilekile katika vifungu vya “unabii” na “ujuzi.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: upendo
  rationale: Neno la kawaida na pana la Kiswahili kwa upendo; linafaa katika muktadha wa sifa za upendo katika sura hii.
- source_word: οὐδέποτε πίπτει
  choice: haushindwi kamwe
  rationale: Huwasilisha kwa lugha ya kawaida maana ya kutokushindwa au kutofeli, huku tofauti na vitenzi vya baadaye vinavyomaanisha kuondolewa na kukoma ikihifadhiwa.
- source_word: εἴτε δὲ
  choice: Lakini kama kuna
  rationale: Huonyesha mgeuko wa kiulinganishi na kukamilisha kwa kawaida sentensi za Kigiriki ambazo zimeacha kitenzi kieleweke.
- source_word: προφητεῖαι
  choice: unabii
  rationale: Katika Kiswahili, nomino hii inaweza kurejelea ujumbe au shughuli ya kinabii kwa ujumla; umoja wa kijumla unalingana na kitenzi cha Kigiriki cha wingi bila kulazimisha tafsiri finyu.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: utaondolewa
  rationale: Huhifadhi matumizi ya kitenzi kilekile katika vifungu vya unabii na ujuzi na kuonyesha kukomeshwa kwa kazi bila kudai kuangamizwa kabisa.
- source_word: γλῶσσαι
  choice: lugha
  rationale: Hili ni neno la asili na linaloeleweka kwa Kiswahili; katika muktadha wa 1 Wakorintho 12–14 linaweza kumaanisha karama ya kunena kwa lugha bila kuamua kwa lazima asili yake mahususi.
- source_word: παύσονται
  choice: zitakoma
  rationale: Hutoa maana ya moja kwa moja ya kuacha au kufikia mwisho na huhifadhi tofauti na καταργέω.
- source_word: γνῶσις
  choice: ujuzi
  rationale: Ni kisawe cha kawaida cha maarifa katika muktadha huu na kinaendana na mjadala unaofuata kuhusu kujua kwa sehemu.
theological_decisions:
- issue: Maana ya πίπτει katika kauli kuhusu upendo
  choice: Upendo haushindwi kamwe
  alternative: Upendo hauanguki kamwe; Upendo haukomi kamwe
  rationale: Tafsiri iliyochaguliwa inaonyesha uthabiti wa upendo bila kuifanya πίπτει iwe sawa kabisa na vitenzi vinavyofuata vya kukoma au kuondolewa.
- issue: Maana ya γλῶσσαι katika sura hii
  choice: lugha
  alternative: ndimi
  rationale: “Lugha” ni Kiswahili cha sasa na cha kawaida, na bado hakiamui mjadala kuhusu kama jambo linalorejelewa ni lugha za kibinadamu au usemi wa aina nyingine wa kiroho; “ndimi” ni tafsiri ya jadi inayowezekana.
- issue: Uhusiano wa καταργέω katika vifungu vya unabii na ujuzi
  choice: Kitenzi hicho kimetafsiriwa sawasawa kuwa “utaondolewa” katika vifungu vyote viwili
  alternative: kutumia “utabatilishwa” au “utakomeshwa”
  rationale: Kurudia kitenzi kilekile kunaonyesha muundo wa Kigiriki na hakupendekezi kimakosa kwamba unabii na ujuzi vina miisho ya aina tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeweka ulinganifu wa vifungu vitatu na tofauti ya vitenzi vya Kigiriki. “Lugha” limetumiwa badala ya “ndimi” kwa uwazi wa kawaida, huku mbadala wa jadi ukihifadhiwa katika tanbihi.
