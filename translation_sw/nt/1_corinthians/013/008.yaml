  rationale: The revision corrects the primary semantic issue in the rendering of πίπτει and improves the formal parallelism of the εἴτε clauses. It retains the draft’s sound choices for the gifts, preserves the distinct Greek verbs, and leaves the debated sense of γλῶσσαι unresolved.
