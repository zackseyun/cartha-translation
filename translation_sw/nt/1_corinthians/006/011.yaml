reference: 1 Corinthians 6:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: sw
  text: Na baadhi yenu mlikuwa watu wa namna hiyo. Lakini mlioshwa[a], lakini mlitakaswa, lakini mlihesabiwa kuwa waadilifu katika jina la Bwana Yesu na katika Roho wa Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlijiosha.” Umbo la kitenzi cha Kigiriki linaweza kueleweka hivyo, ingawa katika muktadha huu wengi hulielewa kuwa sehemu ya mfululizo wa matendo ya Mungu ya wokovu.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Na baadhi yenu mlikuwa watu wa namna hiyo
  rationale: Ni Kiswahili cha kawaida kinachorejelea kwa uwazi aina za watu waliotajwa katika orodha iliyotangulia, huku kikihifadhi nguvu ya ταῦτα bila usemi usio wa kawaida kwamba walikuwa ‘vitu hivi’.
- source_word: ἀλλὰ
  choice: lakini
  rationale: Kurudia ‘lakini’ mara tatu kunahifadhi mkazo na mdundo wa balagha wa Paulo unaoonyesha badiliko kubwa kutoka hali yao ya zamani.
- source_word: ἀπελούσασθε
  choice: mlioshwa
  rationale: Ingawa umbo la Kigiriki ni la kati na linaweza kueleweka kwa maana ya kujiosha, katika mfululizo huu pamoja na vitenzi viwili vya hali tendwa linaelekea kueleza tendo la wokovu lililowatendea. Uwezekano wa maana ya kujirejelea umehifadhiwa katika tanbihi.
- source_word: ἡγιάσθητε
  choice: mlitakaswa
  rationale: ‘Kutakaswa’ ni neno la kawaida, lenye heshima, linaloweza kumaanisha kufanywa watakatifu au kuwekwa wakfu na linafaa katika muktadha huu wa Paulo.
- source_word: ἐδικαιώθητε
  choice: mlihesabiwa kuwa waadilifu
  rationale: Usemi huu unaonyesha tendo la kutangazwa au kukubaliwa kuwa mwadilifu, badala ya kudokeza tu mabadiliko ya tabia; ni wazi kwa msomaji wa kawaida kuliko istilahi nzito ya ‘kuhesabiwa haki’.
- source_word: ἐν τῷ ὀνόματι
  choice: katika jina
  rationale: Tafsiri hii inahifadhi uwezekano wa ἐν kuonyesha mamlaka, msingi, njia, au eneo la tendo bila kuchagua maana moja pekee.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: la Bwana Yesu
  rationale: ‘Bwana Yesu’ ni namna ya kawaida na yenye heshima ya kutafsiri κύριος Ἰησοῦ katika Kiswahili.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: katika Roho wa Mungu wetu
  rationale: ‘Katika’ huhifadhi ulinganifu wa ἐν na utata wake wa kisarufi; herufi kubwa katika ‘Roho’ inaonyesha rejeo linalowezekana sana kwa Roho Mtakatifu katika muktadha wa Paulo.
theological_decisions:
- issue: Kauli na mtendaji katika ἀπελούσασθε
  choice: mlioshwa
  alternative: mlijiosha
  rationale: Umbo la kati linaweza kuwa la kujirejelea, lakini muktadha wa vitenzi vinavyofuata katika hali tendwa unaunga mkono maana ya kupokea tendo. Tanbihi inadumisha uwezekano halisi wa kisarufi badala ya kuufuta.
- issue: Maana ya kuhesabiwa waadilifu katika ἐδικαιώθητε
  choice: mlihesabiwa kuwa waadilifu
  alternative: mlitangazwa kuwa waadilifu; mlifanywa waadilifu
  rationale: Chaguo hili linaweka wazi mwelekeo wa hukumu au kukubaliwa bila kuamua kikamilifu mjadala mpana kuhusu kama kitenzi pia kinajumuisha mabadiliko ya hali ya mtu.
- issue: Rejeo la πνεύματι
  choice: Roho wa Mungu wetu
  alternative: roho ya Mungu wetu; katika ulimwengu wa kiroho wa Mungu wetu
  rationale: Katika matumizi ya Paulo, ‘Roho wa Mungu wetu’ kwa kawaida humrejelea Roho Mtakatifu. Tafsiri haiongezi neno ‘Mtakatifu,’ ambalo halipo hapa.
- issue: Uhusiano wa virai viwili vya ἐν na matendo ya wokovu
  choice: katika jina ... na katika Roho
  alternative: kwa jina ... na kwa Roho
  rationale: Kurudia ‘katika’ kunahifadhi muundo na utata wa Kigiriki kuhusu njia, mamlaka, msingi, au eneo la matendo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi marudio matatu ya ‘lakini’ kwa ajili ya mkazo wa Paulo. ‘Watu wa namna hiyo’ ni ya kawaida kuliko tafsiri halisi isiyo ya asili ya ‘vitu hivi.’
