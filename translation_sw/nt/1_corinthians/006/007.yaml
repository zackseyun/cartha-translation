base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: sw
  text: Kwa kweli, basi, kwa jumla tayari ni kushindwa[a] kwenu kwamba mna mashauri ya kisheria[b] kati yenu wenyewe. Kwa nini afadhali msidhulumiwe? Kwa nini afadhali msinyimwe?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hasara” au “kutofaulu.” Neno la Kigiriki ἥττημα linaweza kumaanisha hasara, kushindwa, au kutofaulu.
    reason: lexical_alternative
  - marker: b
    text: Au “kesi za kisheria” au “mashtaka mahakamani.” Neno la Kigiriki κρίματα hapa linamaanisha migogoro au mashauri yanayopelekwa mahakamani.
    reason: lexical_alternative
  - marker: c
    text: Au “mpunjwe” au “mnyang’anywe.” Neno la Kigiriki ἀποστερεῖσθε linaweza kumaanisha kunyimwa, kupunjwa, au kunyang’anywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: Kwa kweli, basi, tayari ... kabisa
  rationale: 'Muundo huu unahifadhi hitimisho lenye msisitizo: hali hiyo tayari imefikia kiwango cha kushindwa, bila kuufanya mstari kuwa mzito au usio wa kawaida katika Kiswahili.'
- source_word: ἥττημα
  choice: kushindwa
  rationale: Neno hili linaonyesha hasara, kushindwa, au kutofaulu. “Kushindwa” linatunza nguvu ya hoja ya Paulo kwamba kuwepo kwa kesi hizo tayari ni kushindwa kwa jumuiya, bila kujali matokeo yake mahakamani.
- source_word: ὑμῖν ἐστιν
  choice: ni kushindwa ... kwenu
  rationale: Hii inawakilisha dative ya rejea kwa Kiswahili cha kawaida bila kuongeza wazo la “aibu,” ambalo halijasemwa moja kwa moja.
- source_word: κρίματα
  choice: mashtaka mahakamani
  rationale: Katika muktadha huu neno linahusu migogoro inayofikishwa mahakamani. Tafsiri hii ni wazi kuliko “hukumu” na inaonyesha upande wa kisheria.
- source_word: μεθ’ ἑαυτῶν
  choice: kati yenu wenyewe
  rationale: Inasisitiza kwamba migogoro hiyo iko ndani ya jumuiya yenyewe; ni Kiswahili cha asili na huhifadhi maana ya kutendeana.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Kwa nini msikubali
  rationale: Katika maswali haya ya balagha, “msikubali” linaonyesha wito wa kuvumilia jambo hilo badala ya kupeleka mzozo mahakamani; wazo la “afadhali” linaeleweka katika ulinganisho wa muktadha.
- source_word: ἀδικεῖσθε
  choice: kudhulumiwa
  rationale: Huhifadhi hali ya kutendewa isivyo haki na sauti ya kupokea tendo katika Kigiriki.
- source_word: ἀποστερεῖσθε
  choice: kunyang’anywa mali
  rationale: Kitenzi kinaweza kumaanisha kunyimwa, kupunjwa, au kunyang’anywa. Katika muktadha wa mzozo wa kisheria au mali, usemi huu ni wazi, lakini “mali” ni ufafanuzi wa kimuktadha na kwa hiyo umewekewa tanbihi.
theological_decisions:
- issue: Tathmini ya Paulo kuhusu waamini kushtakiana mahakamani
  choice: kushindwa
  alternative: hasara; kutofaulu
  rationale: Tafsiri inatunza tathmini kali ya kimaadili kwamba kuwepo kwa mashtaka hayo ni kwenyewe kushindwa, bila kuongeza kundi maalumu la kimafundisho.
- issue: Maswali ya balagha kuhusu kukubali kutendewa vibaya
  choice: msikubali kudhulumiwa ... msikubali kunyang’anywa mali
  alternative: kwa nini afadhali msidhulumiwe ... msinyimwe
  rationale: Muundo uliochaguliwa unaonyesha kwamba Paulo anawataka wakubali kupokea hasara badala ya kushtakiana, bila kudai kwamba udhalimu wenyewe ni mwema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mashtaka mahakamani” hufafanua wazi mazingira ya kisheria; maswali mafupi ya balagha yanatunza ukali wa Paulo. Alama zote za tanbihi zimewekwa katika matini kuu.
