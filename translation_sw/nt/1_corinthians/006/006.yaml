  text: Lakini ndugu anamshtaki ndugu, tena mbele ya wasioamini?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya wale wasioamini.” Huenda maneno haya yakarejelea mahakama za kiraia zenye mahakimu wasio wa jumuiya ya waamini, lakini Kigiriki kinasema tu “mbele ya wasioamini.”
    reason: lexical_alternative
  - marker: b
    text: Marudio ya neno “ndugu” yanarejelea waamini wenzao, yaani washiriki wa jumuiya ya Kikristo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha upinzani mkali kati ya jambo lililopaswa kufanywa ndani ya jumuiya, lililotajwa katika mstari uliotangulia, na hali halisi ambayo Paulo anaikemea.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: ndugu ... ndugu yake
  rationale: Marudio ya neno la kifamilia yamehifadhiwa. Katika muktadha huu, “ndugu” humaanisha mshiriki mwenzake wa jumuiya ya waamini, huku umoja wa kiume wa Kigiriki ukibaki kuonekana kwa njia ya kawaida katika Kiswahili.
- source_word: μετὰ
  choice: anapeleka ... mahakamani
  rationale: Ingawa μετά pamoja na jenitivi mara nyingi humaanisha “pamoja na,” hapa muktadha wa shauri la kisheria unaonyesha pande zinazopingana. Uhusiano huo umeingizwa kwa kawaida katika muundo wa kitenzi cha Kiswahili.
- source_word: κρίνεται
  choice: anapeleka ... mahakamani
  rationale: Katika muktadha huu kitenzi kina maana ya kushiriki katika shauri la kisheria. Tafsiri hii ni ya kawaida na wazi zaidi kuliko “anahukumiwa,” ambayo ingeweza kumfanya mhusika aonekane kuwa mshtakiwa tu.
- source_word: καὶ τοῦτο
  choice: tena
  rationale: '“Tena” huwasilisha mshangao na ukali wa nyongeza ya Paulo: si kwamba waamini wanashitakiana tu, bali wanafanya hivyo katika mazingira haya.'
- source_word: ἐπὶ ἀπίστων
  choice: mbele ya wasioamini
  rationale: Tafsiri hii huhifadhi upana wa Kigiriki kuhusu mahali au watu ambao mbele yao shauri linasikilizwa, bila kuongeza waziwazi neno “mahakimu.”
theological_decisions:
- issue: Maana wakilishi ya ἀδελφός ndani ya kanisa
  choice: ndugu
  alternative: mwamini mwenzake; ndugu wa kiume au wa kike
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya Paulo na umbo la umoja katika Kigiriki. Tanbihi inaeleza kwamba katika muktadha huu neno hilo linamhusu mshiriki mwenza wa jumuiya ya Kikristo, bila kubadili maandishi makuu kuwa tafsiri pana zaidi kuliko umbo la chanzo.
- issue: Upeo wa ἀπίστων
  choice: wasioamini
  alternative: mahakimu wasioamini; watu wa nje; wapagani
  rationale: Neno hili linadumisha tofauti kati ya jumuiya ya waamini na wale wasio wa imani, bila kulibana kuwa rejeo la mahakimu pekee, ingawa mazingira ya mahakama yanaelekeza huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anapeleka ... mahakamani” ni usemi wa kawaida unaowasilisha maana ya kisheria, na dash kabla ya “tena” hudumisha nguvu ya swali la kukemea. Alama zote za tanbihi zimewekwa katika maandishi makuu.
