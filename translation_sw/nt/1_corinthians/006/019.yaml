  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: sw
  text: Au hamjui kwamba mwili wenu ni hekalu la Roho Mtakatifu aliye ndani yenu,[a] ambaye mnao kutoka kwa Mungu? Nanyi si mali yenu wenyewe,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Roho Mtakatifu ndani yenu.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina neno “mwili” katika umoja pamoja na “wenu” ya wingi. Hili linaweza kueleweka kuwa mwili wa kila mmoja wenu au mwili unaowawakilisha kwa pamoja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huendeleza hoja kwa swali kali la balagha, bila kulainisha mpito wa Paulo.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa swali la balagha unaolingana na maana ya οἶδα.
- source_word: τὸ σῶμα ὑμῶν
  choice: mwili wenu
  rationale: Huhifadhi nomino ya umoja ‘mwili’ pamoja na kimilikishi cha wingi ‘wenu,’ kama ilivyo katika Kigiriki.
- source_word: ναὸς
  choice: hekalu
  rationale: ναός hurejelea mahali patakatifu pa hekalu; ‘hekalu’ ni neno la kawaida, lenye heshima, na linalohifadhi nguvu ya sitiari.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: la Roho Mtakatifu aliye ndani yenu
  rationale: Muundo huu unaonyesha kwamba Roho Mtakatifu ndiye aliye ndani yao na kwamba mwili ni hekalu lake.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: ambaye mmepokea kutoka kwa Mungu
  rationale: Kiswahili cha asili hakisemi kwa urahisi ‘ambaye mnaye kutoka kwa Mungu’; ‘mmepokea’ huwasilisha kwa uwazi wazo linalodokezwa na kuwa naye kutoka kwa Mungu, huku ‘ambaye’ ikihifadhi rejeo binafsi kwa Roho.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Nanyi si mali yenu wenyewe
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana ya kutokuwa wenye kujimiliki, na huandaa sababu inayofuata katika mstari wa 20.
theological_decisions:
- issue: Rejeo na ubinafsi wa kiwakilishi οὗ
  choice: Kimeelekezwa kwa Roho Mtakatifu kwa kutumia ‘ambaye.’
  alternative: Kutumia muundo usio wa kibinafsi au kupanga upya sentensi bila kiwakilishi cha kibinafsi.
  rationale: Kisarufi, οὗ hurejelea ἁγίου πνεύματός. ‘Ambaye’ huhifadhi rejeo hilo la kibinafsi bila kuongeza maelezo ya kimafundisho yasiyomo katika mstari.
- issue: ‘Mwili’ wa umoja kwa wasikilizaji wa wingi
  choice: Kuhifadhi ‘mwili wenu’ katika umoja.
  alternative: ‘Miili yenu.’
  rationale: Kigiriki kina τὸ σῶμα katika umoja na ὑμῶν katika wingi. Kiswahili ‘mwili wenu’ huhifadhi mvutano wa iwapo usemi ni wa kugawa kwa kila mmoja au ni wa uwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘mwili wenu’ umehifadhiwa makusudi badala ya kulainishwa kuwa ‘miili yenu.’
