  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: sw
  text: Ikimbieni uasherati. Kila dhambi ambayo mtu anaweza kutenda iko nje ya mwili, lakini anayefanya uasherati hutenda dhambi dhidi ya mwili wake mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φεύγετε
  choice: Ikimbieni
  rationale: Amri ya wakati uliopo kwa wingi ina nguvu ya kuwataka waepuke kwa uthabiti na haraka; “Ikimbieni” ni ya asili na huhifadhi uzito wa agizo.
- source_word: πορνείαν
  choice: uasherati
  rationale: Katika Kiswahili cha Biblia na matumizi mapana, “uasherati” hufunika mwenendo wa kingono usio halali bila kuufanya kuwa tendo moja maalumu tu.
- source_word: πᾶν ἁμάρτημα
  choice: Kila dhambi
  rationale: Huhifadhi usemi wa jumla na mpana wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: ambayo mtu anaweza kutenda
  rationale: ἄνθρωπος ina maana wakilishi ya mwanadamu kwa jumla hapa; “mtu” ni ya asili, sahihi kijinsia katika Kiswahili, na “anaweza kutenda” hudokeza hali ya uwezekano iliyo katika ἐὰν pamoja na subjunktivu.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: iko nje ya mwili
  rationale: Tafsiri hii ya moja kwa moja huhifadhi taswira na mvutano wa kauli bila kujaribu kuifafanua kiteolojia.
- source_word: ὁ δὲ πορνεύων
  choice: anayefanya uasherati
  rationale: Huhifadhi nguvu ya kitenzi cha participio na kuunganisha wazi tendo hili na “uasherati” katika agizo la kwanza.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: anautendea dhambi mwili wake mwenyewe
  rationale: “Anautendea dhambi” huwasilisha mwelekeo wa εἰς kwa Kiswahili cha kawaida, huku “wake mwenyewe” ikihifadhi msisitizo wa ἴδιον.
theological_decisions:
- issue: Maana ya ἄνθρωπος katika kauli ya jumla
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa nomino ya Kigiriki ni ya umoja na kisarufi inaweza kuonekana ya kiume, hapa ina maana wakilishi ya binadamu yeyote. “Mtu” huhifadhi maana hiyo kwa Kiswahili bila kuongeza ukomo wa kijinsia usiokusudiwa.
- issue: Nguvu ya kauli kwamba kila dhambi iko nje ya mwili
  choice: Kutafsiri kauli moja kwa moja bila kuilegeza au kuisuluhisha
  alternative: Kuitambulisha kama kauli mbiu iliyonukuliwa au kuiongezea ufafanuzi wa kuipatanisha
  rationale: Muundo wa Kigiriki unaitoa kauli moja kwa moja, ingawa maana yake inajadiliwa. Tafsiri inapaswa kuhifadhi mvutano huo badala ya kuingiza uamuzi wa kifafanuzi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; “Ikimbieni” inaeleweka kwa wasomaji wa kawaida, na “uasherati” hudumisha upana wa neno la Kigiriki katika sajili ya kibiblia.
