  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: sw
  text: wala wezi, wala wenye tamaa, wala walevi, wala watukanaji, wala wanyang’anyi hawataurithi ufalme wa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλέπται
  choice: wezi
  rationale: Ni neno la kawaida na la moja kwa moja kwa watu wanaoiba, na linafaa katika orodha hii ya maovu.
- source_word: πλεονέκται
  choice: wenye tamaa
  rationale: Hueleza watu wenye uchu wa kupata zaidi, hasa mali; ‘wenye tamaa’ ni Kiswahili cha kawaida na hueleweka kwa urahisi.
- source_word: μέθυσοι
  choice: walevi
  rationale: Hurejelea watu wanaotambulika kwa ulevi, si mtu ambaye amewahi kulewa mara moja tu; ‘walevi’ huhifadhi nguvu ya nomino katika orodha.
- source_word: λοίδοροι
  choice: watukanaji
  rationale: Hueleza watu wenye desturi ya kutukana au kutumia maneno ya kuwadhuru wengine; ni pana kuliko ‘wachongezi,’ ambalo lingeashiria zaidi mashtaka ya uongo.
- source_word: ἅρπαγες
  choice: wanyang’anyi
  rationale: Hueleza watu wanaopora au kujipatia mali kwa kuwadhulumu wengine. ‘Wanyang’anyi’ huhifadhi wazo pana la unyang’anyi bila kulifungia katika ulaghai pekee.
- source_word: βασιλείαν θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri iliyozoeleka na sahihi inayohifadhi uzito wa kifungu hiki cha kitheolojia.
- source_word: κληρονομήσουσιν
  choice: hawataurithi
  rationale: Huhifadhi moja kwa moja lugha ya urithi na maana yake ya wakati ujao.
theological_decisions:
- issue: Nguvu ya orodha ya maovu na lugha ya kurithi
  choice: Nomino za wingi zinawataja watu wanaotambulika kwa tabia hizi, huku tafsiri ikiacha orodha yenyewe iseme bila kuongeza sharti la ‘kutotubu’ katika matini.
  alternative: Kuchukulia mstari kuwa unahusu kila tendo moja lililotendwa kwa wakati wowote, au kuongeza wazi ‘wanaoendelea bila kutubu.’
  rationale: Muundo wa Kigiriki wa majina ya watu katika orodha ya maovu unaelekea kueleza watu wenye sifa hizi. Hata hivyo, kuongeza ufafanuzi wa kitheolojia ndani ya matini kungeondoa mvutano na uwezekano wa maana uliopo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘wala ... wala ...’ umechaguliwa ili kuendeleza orodha kutoka muktadha uliotangulia na kuakisi οὔτε/οὐ. Hakuna tanbihi zilizowekwa kwa sababu tanbihi za Kiingereza zina viashiria vilivyopangwa visivyoendana na maneno husika, na tofauti muhimu zinaweza kuwakilishwa kwa usahihi katika maamuzi ya kileksika bila kuibebesha matini.
