  text: And God raised the Lord and will also raise us by his power.
translation:
  language: sw
  text: Na Mungu alimfufua Bwana, nasi atatufufua kwa nguvu zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza hoja kwa upole bila kusisitiza upinzani; “Naye” kinaunganisha sentensi kwa Kiswahili cha kawaida huku kikimrudisha msomaji kwa Mungu kama mtendaji.
- source_word: θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός, naye ndiye mtendaji aliyetajwa wazi katika kufufua.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Katika muktadha huu κύριος ni cheo cha Kristo kinachomrejelea Yesu; “Bwana” ni tafsiri ya kawaida, yenye heshima na iliyozoeleka.
- source_word: ἤγειρεν
  choice: alimfufua
  rationale: Kitenzi hiki kinarejelea tendo la Mungu la wakati uliopita la kumfufua Yesu kutoka kwa wafu. “Alimfufua” linaweka wazi maana ya ufufuo kwa Kiswahili cha kawaida.
- source_word: ἡμᾶς
  choice: sisi
  rationale: Kiwakilishi hiki kinawarejelea waamini kwa ujumla. “Sisi” kinatumika kama yambwa katika muundo wa “atatufufua.”
- source_word: ἐξεγερεῖ
  choice: atatufufua
  rationale: Wakati ujao na ulinganifu wake na kufufuliwa kwa Bwana vinawasilishwa kwa kitenzi “atatufufua”; tofauti ya kiambishi ἐξ- haihitaji kulazimishwa katika Kiswahili.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: kwa nguvu zake
  rationale: διά pamoja na umilikishi hapa huonyesha njia au uwezo unaotumika. “Kwa nguvu zake” ni Kiswahili cha asili kinachoonyesha kwamba nguvu za Mungu ndizo njia ya kufufua.
theological_decisions:
- issue: Maana ya ufufuo katika kishazi cha wakati ujao
  choice: Ufufuo wa waamini wa wakati ujao
  alternative: Uthibitisho wa jumla kutoka kwa Mungu au kuinuliwa kwa kiroho kwa maana ya mfano
  rationale: Muktadha wa karibu unahusu mwili (1 Kor 6:13–20), na ulinganifu na tendo la Mungu la kumfufua Bwana unaunga mkono ufufuo halisi wa waamini wa wakati ujao. Tafsiri haitaji neno “mwili,” kwa kuwa halipo wazi katika mstari huu, hivyo haiongezi ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi na unahifadhi ulinganifu kati ya kufufuliwa kwa Bwana na kufufuliwa kwetu.
