id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: sw
  text: Au hamjui kwamba mtu anayejiunga na kahaba ni mwili mmoja naye? Kwa maana, kama asemavyo,[a] “Wawili hao watakuwa mwili mmoja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “asema”; nukuu hii inatoka Mwanzo 2:24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Inaendeleza hoja kwa swali la balagha na kuhifadhi mtiririko wa hoja ya Paulo.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni usemi wa kawaida wa Paulo wa kuuliza swali la balagha; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ὁ κολλώμενος
  choice: mtu anayejiunga
  rationale: Kitenzi kinaweza kumaanisha kushikamana au kuungana; katika muktadha wa muungano wa kingono, ‘anayejiunga’ ni wazi bila kuongeza maelezo yasiyomo.
- source_word: τῇ πόρνῃ
  choice: na kahaba
  rationale: πόρνη humaanisha hasa kahaba, na matumizi ya Kiswahili hayahitaji kuonyesha kibainishi cha Kigiriki kama ‘yule’ hapa.
- source_word: ἓν σῶμά ἐστιν
  choice: huwa mwili mmoja naye
  rationale: ‘Naye’ huweka wazi uhusiano unaodokezwa na Kigiriki, huku ‘huwa’ ikieleza hali ya muungano bila kuifanya kuwa mafundisho yaliyopanuliwa.
- source_word: Ἔσονται γάρ
  choice: Kwa maana ... watakuwa
  rationale: γάρ hutoa msingi wa dai lililotangulia, na wakati ujao wa εἰμί pamoja na εἰς unawakilishwa kwa kawaida na ‘watakuwa.’
- source_word: φησίν
  choice: kama asemavyo
  rationale: Huhifadhi nafsi ya tatu umoja ya Kigiriki bila kumtaja kwa uhakika msemaji ambaye maandishi yenyewe hayamtaji.
- source_word: οἱ δύο
  choice: Hao wawili
  rationale: Ni Kiswahili cha kawaida kinachowakilisha moja kwa moja watu wawili wa nukuu.
- source_word: εἰς σάρκα μίαν
  choice: mwili mmoja
  rationale: Katika Kiswahili, ‘mwili mmoja’ huwasilisha kwa kawaida maana ya usemi wa Mwanzo kuhusu muungano wa kimwili na wa kihusiano; ‘nyama moja’ ingekuwa ya moja kwa moja zaidi kimuundo lakini si ya kawaida na inaweza kupotosha.
theological_decisions:
- issue: Maana ya nukuu ya Mwanzo kwa muungano wa kingono nje ya ndoa
  choice: Nukuu imetafsiriwa moja kwa moja kama msingi wa dai la Paulo kwamba muungano wa kingono na kahaba huleta hali halisi ya kuwa ‘mwili mmoja,’ bila kupanua mstari kuwa kauli kamili kuhusu ndoa.
  alternative: Kufanya nukuu ihusu ndoa pekee, au kuongeza hitimisho la kimaadili lisilotamkwa katika mstari huu.
  rationale: Paulo anatumia Mwanzo 2:24 kwa hali ya kujiunga na kahaba. Tafsiri inadumisha uzito huo wa kitheolojia na mvutano wake bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kahaba’ ni neno wazi na linaloeleweka; ‘mwili mmoja’ ni la kawaida kuliko ‘nyama moja’ katika muktadha huu. Alama ya tanbihi [a] imewekwa mara moja katika matini.
