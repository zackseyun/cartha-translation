  text: ὁ δὲ κολλώμενος τῷ κυρίῳ ἓν πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/017.yaml
  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: sw
  text: Lakini anayeungana na Bwana[a] ni roho moja naye.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeunganishwa na Bwana,” au “anayeshikamana na Bwana.” Umbo la kitenzi cha Kigiriki linaweza kuonyesha ama mtu kujiunga mwenyewe ama kuunganishwa.
    reason: lexical_alternative
  - marker: b
    text: Au kwa ufupi, “ni roho moja.” Neno “naye” linaeleweka katika Kigiriki na limeongezwa ili kufanya uhusiano huo uwe wazi katika Kiswahili.
    reason: lexical_alternative
  - marker: c
    text: Baadhi wanaweza kuandika “Roho” kwa herufi kubwa, lakini kifungu hiki kwa kawaida kinaeleweka kumaanisha kwamba mwamini ameunganishwa na Bwana katika roho moja.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: anayeungana na
  rationale: Kitenzi hiki huonyesha kushikamana au kuunganishwa kwa karibu. “Anayeungana na” ni Kiswahili cha kawaida kinachohifadhi wazo la muungano wa karibu na pia mwangwi wa tofauti na muungano wa kimwili unaotajwa katika mstari uliotangulia.
- source_word: κυρίῳ (κύριος)
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida lenye uzito wa kitheolojia katika matumizi ya Paulo, na hapa linamrejelea Yesu aliyefufuka.
- source_word: ἓν
  choice: moja
  rationale: Neno hili linaeleza umoja halisi, si kufanana kwa nia tu.
- source_word: πνεῦμα
  choice: roho
  rationale: Herufi ndogo inapendelewa kwa sababu kifungu hiki kwa kawaida kinaeleza muungano wa mwamini na Bwana katika roho, bila kuwatambulisha kuwa Roho Mtakatifu mwenyewe.
- source_word: ὁ δὲ ... ἐστιν
  choice: Lakini anaye... ni
  rationale: Muundo huu ni wa kawaida na jumuishi katika Kiswahili, huku ukihifadhi umoja wa kisarufi na utofautishaji unaoletwa na δέ.
theological_decisions:
- issue: Asili ya muungano unaoelezwa na “roho moja”
  choice: Kusema “ni roho moja naye,” hivyo kueleza muungano halisi wa kiroho na Bwana bila kufuta tofauti kati yao.
  alternative: Kutafsiri kama utambulisho wa kifumbo wenye nguvu zaidi, au kama kuwa na nia na kusudi moja tu.
  rationale: Muktadha unalinganisha muungano wa kimwili unaotajwa katika mstari wa 16 na muungano na Bwana. Tafsiri inapaswa kuhifadhi nguvu ya lugha ya umoja bila kudokeza kwamba mwamini na Bwana wanakuwa nafsi ileile.
- issue: Kuongeza kiwakilishi “naye”
  choice: Kuweka “naye” ili kuonyesha wazi kwamba umoja huo ni pamoja na Bwana.
  alternative: Kuandika tu “ni roho moja.”
  rationale: Kigiriki kinaweza kuacha mhusika wa pili akieleweka kutokana na muktadha, lakini “naye” hufanya uhusiano huo kuwa wazi katika Kiswahili bila kubadili maana.
- issue: Herufi kubwa au ndogo katika πνεῦμα
  choice: Kutumia “roho” kwa herufi ndogo katika matini.
  alternative: Kutumia “Roho,” kwa kuhusisha moja kwa moja na Roho Mtakatifu.
  rationale: Hati za kale za Kigiriki hazitatui suala hili kwa matumizi ya herufi kubwa na ndogo. Katika muktadha huu, maana ya kawaida zaidi ni kwamba mwamini ameunganishwa na Bwana katika roho moja; uwezekano mwingine umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Anayeungana na” huepuka lugha nzito kupita kiasi, huku “roho moja naye” ikihifadhi mkazo na mvutano wa kitheolojia wa Kigiriki.
