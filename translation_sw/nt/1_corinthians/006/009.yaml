  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: sw
  text: 'Au hamjui kwamba wasio waadilifu hawataurithi ufalme wa Mungu? Msidanganyike: wala waasherati, wala waabudu sanamu, wala wazinzi, wala wanaume walaini[a], wala wanaume wanaofanya ngono na wanaume wenzao[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki μαλακοί humaanisha kihalisi “walio laini.” Linaweza pia kumaanisha wanaume wenye tabia za kike, watu waliolegea kimaadili, au—katika muktadha huu—labda makahaba wa kiume au wanaume wanaopokea tendo la ngono kutoka kwa wanaume wengine.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ἀρσενοκοῖται ni adimu na maana yake kamili inabishaniwa. Linaweza pia kutafsiriwa “wanaume wanaofanya ngono haramu na wanaume” au “wanaume wanaolala na wanaume”; wengi hulihusianisha na maneno ya Mambo ya Walawi katika tafsiri ya Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Au
  rationale: Hutanguliza mwendelezo wa hoja kwa swali la kukemea, kama ilivyo katika Kigiriki.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mtindo huu wa swali la Paulo.
- source_word: ἄδικοι
  choice: wasio waadilifu
  rationale: Huhifadhi maana pana ya watu wasio wa haki au waadilifu badala ya kuibana kwenye matendo fulani tu.
- source_word: θεοῦ βασιλείαν
  choice: ufalme wa Mungu
  rationale: Ni usemi wa kawaida wa kibiblia na tafsiri wazi ya muundo wa Kigiriki.
- source_word: οὐ κληρονομήσουσιν
  choice: hawataurithi
  rationale: Huhifadhi taswira ya urithi pamoja na maana zake za agano na wakati ujao.
- source_word: μὴ πλανᾶσθε
  choice: Msidanganyike
  rationale: Hutoa onyo la moja kwa moja bila kulazimisha kama udanganyifu unatoka kwa wengine au kwa mtu mwenyewe.
- source_word: πόρνοι
  choice: waasherati
  rationale: Ni neno la kawaida la Kiswahili kwa watu wanaofanya uasherati, likiwa pana kuliko uzinzi wa kuvunja ndoa.
- source_word: εἰδωλολάτραι
  choice: waabudu sanamu
  rationale: Ni tafsiri wazi na inayoeleweka kwa urahisi kuliko nomino nzito ya kitaalamu.
- source_word: μοιχοὶ
  choice: wazinzi
  rationale: Hutaja hasa wanaovunja uaminifu wa ndoa kwa uzinzi.
- source_word: μαλακοὶ
  choice: wanaume wenye tabia za kike
  rationale: Huwasilisha maana ya jadi ya ‘effeminate’ katika muktadha huu, lakini tanbihi huhifadhi uwezekano wa maana halisi ya ‘laini,’ udhaifu wa kimaadili, ukahaba wa kiume, au mshiriki anayepokea katika tendo la ngono kati ya wanaume.
- source_word: ἀρσενοκοῖται
  choice: wanaume wanaofanya ngono na wanaume wenzao
  rationale: Ni maelezo yasiyotegemea utambulisho wa kisasa na yanaonyesha uwezekano mkubwa wa tendo la ngono kati ya wanaume, huku tanbihi ikikiri kuwa neno hili adimu linabishaniwa.
theological_decisions:
- issue: Maana ya μαλακοὶ na ἀρσενοκοῖται katika orodha ya maovu
  choice: Kutafsiri kwa ‘wanaume wenye tabia za kike’ na ‘wanaume wanaofanya ngono na wanaume wenzao,’ huku tofauti za maana zikielezwa katika tanbihi
  alternative: ‘wanaume laini’ na ‘wanaume wanaolala na wanaume’; au ‘ makahaba wa kiume’ na ‘wanaume wanaofanya ngono haramu na wanaume’
  rationale: Maneno haya mawili yana mjadala mkubwa wa kileksika. Matini kuu inatoa maana zinazowezekana katika muktadha bila kutumia kategoria za utambulisho wa kijinsia za kisasa; tanbihi hazifichi upana na kutokuwa na uhakika wa maneno hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la Paulo na urudiaji wa ‘wala’ umehifadhiwa kwa ajili ya mkazo wa orodha. Maneno yanayobishaniwa yamefafanuliwa katika tanbihi badala ya kutatuliwa kimyakimya.
