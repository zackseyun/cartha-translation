  source_fidelity: 'Maana kuu imehifadhiwa: ἠγοράσθητε ni ‘mlinunuliwa,’ γάρ ni ‘kwa maana,’ na δοξάσατε ni ‘mtukuzeni.’ Hata hivyo, ‘kwa thamani’ si usemi wa kawaida wala sahihi wa kutosha kwa τιμῆς katika muktadha huu; huweza kumaanisha ‘kwa value/worth’ badala ya bei au gharama iliyolipwa. ‘Kwa bei’ huhifadhi taswira ya ununuzi kwa uwazi. Matini ya SBLGNT ina ‘katika mwili wenu’ (umoja), si ‘katika miili yenu.’'
