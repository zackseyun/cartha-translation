  terminology: ‘Mlinunuliwa’ huhifadhi taswira ya biashara bila kubadilisha kuwa tafsiri ya kimafundisho kama ‘mlikombolewa.’ ‘Mtukuzeni Mungu’ ni sawia thabiti ya δοξάσατε τὸν θεόν. ‘Mwili’ huhifadhi rejeo halisi la σῶμα katika muktadha wa maadili ya kimwili.
