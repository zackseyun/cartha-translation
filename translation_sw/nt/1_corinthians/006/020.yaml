base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: sw
  text: Kwa maana mlinunuliwa kwa bei[a]. Basi mtukuzeni Mungu katika mwili wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlinunuliwa kwa gharama.” Kigiriki kinatumia taswira ya ununuzi na bei iliyolipwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: mlinunuliwa
  rationale: Kitenzi cha wakati uliopita katika hali ya kutendwa kinahifadhi wazi taswira ya kununuliwa bila kuibadili kuwa istilahi pana ya ukombozi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya agizo lililotangulia na ni cha kawaida katika Kiswahili sanifu.
- source_word: τιμῆς
  choice: kwa thamani
  rationale: Katika muundo huu neno linaonyesha gharama iliyolipwa. ‘Kwa thamani’ huhifadhi taswira ya biashara huku kikibaki kifupi na cha asili.
- source_word: δοξάσατε
  choice: mtukuzeni
  rationale: Agizo la wingi linawaita wasomaji wampe Mungu utukufu kwa matendo yao; ‘mtukuzeni’ lina uzito wa maana ya δοξάζω.
- source_word: δὴ
  choice: Basi
  rationale: ‘Basi’ linaonyesha hitimisho la kimantiki na msisitizo wa agizo bila kulifanya neno hili kuwa zito kupita kiasi.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: katika miili yenu
  rationale: Kiswahili kwa kawaida hutumia wingi ‘miili yenu’ kwa kundi la watu. ‘Katika’ huhifadhi upana wa ἐν bila kuamua kimya kimya ikiwa ni mahali au chombo.
theological_decisions:
- issue: Taswira ya kibiashara ya kununuliwa
  choice: Kuhifadhi ‘mlinunuliwa kwa thamani’
  alternative: mlikombolewa kwa gharama
  rationale: Neno la Kigiriki linatumia moja kwa moja taswira ya ununuzi. Tafsiri hii haiingizi ufafanuzi mwembamba wa kimafundisho.
- issue: Maadili yanayohusu mwili
  choice: Kutafsiri σῶμα kwa maana halisi ya ‘miili’
  alternative: nafsi zenu; maisha yenu
  rationale: Muktadha unahusu mwenendo wa kimwili, hivyo tafsiri halisi huhifadhi hoja ya Paulo na haipanui maana kwa ufafanuzi.
- issue: Umoja wa σῶμα pamoja na kiwakilishi cha wingi
  choice: miili yenu katika matini kuu
  alternative: mwili wenu
  rationale: Kigiriki kina nomino ya umoja na kiwakilishi cha wingi, jambo linaloweza kueleweka kwa kila mshiriki binafsi. Kiswahili cha kawaida hupendelea wingi; tanbihi huhifadhi umbo la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi; taswira ya ununuzi na rejeo halisi kwa mwili zimehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
