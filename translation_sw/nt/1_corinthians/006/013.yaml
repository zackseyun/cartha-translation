source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: sw
  text: 'Vyakula ni kwa ajili ya tumbo, na tumbo ni kwa ajili ya vyakula[a]—lakini Mungu ataviondoa: tumbo na vyakula.[b] Lakini mwili si kwa ajili ya uasherati, bali ni kwa ajili ya Bwana, na Bwana ni kwa ajili ya mwili.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda maneno haya yalikuwa kaulimbiu ya Wakorintho ambayo Paulo anainukuu kabla ya kuisahihisha. Maandishi ya Kigiriki hayatambulishi wazi kuwa ni nukuu.
    reason: alternative_reading
  - marker: b
    text: Kigiriki husema kwa viwakilishi, «hili na hivi», vikirejelea tumbo na vyakula. Kitenzi kinaweza pia kutafsiriwa «ataviangamiza», «atavikomesha», au «atavibatilisha».
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki kinahifadhi kwa ufupi uhusiano wa pande mbili: mwili ni kwa ajili ya Bwana, na Bwana ni kwa ajili ya mwili.'
    reason: theological_clarity
lexical_decisions:
- source_word: βρώματα
  choice: vyakula
  rationale: Nomino ya Kigiriki iko katika wingi. Kiswahili cha kawaida hutumia “vyakula” kwa maana ya jumla hapa, na hivyo huhifadhi pia ulinganifu wa msemo.
- source_word: κοιλίᾳ / κοιλία
  choice: tumbo
  rationale: Katika muktadha huu neno linahusu kiungo cha kula na kumeng’enya chakula; “tumbo” ndilo neno la kawaida, wazi na la sasa katika Kiswahili.
- source_word: καταργήσει
  choice: ataviondoa
  rationale: Kitenzi kinaweza kumaanisha kukomesha, kubatilisha, au kufanya kisifanye kazi. “Ataviondoa” huonyesha kwamba Mungu atavikomesha bila kulazimisha maana ya kuangamiza kabisa.
- source_word: ταύτην καὶ ταῦτα
  choice: vyote viwili
  rationale: Viwakilishi vinarejelea tumbo na vyakula. Kiswahili hutumia kwa ufasaha muhtasari huu wa jozi, ingawa ngeli zao ni tofauti; tanbihi inaweka wazi marejeleo hayo.
- source_word: σῶμα
  choice: mwili
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mwili wa kimwili, huku uzito wake wa kiteolojia ukihifadhiwa na muktadha.
- source_word: πορνείᾳ
  choice: uasherati
  rationale: “Uasherati” ni istilahi pana, inayotambulika katika Kiswahili cha Biblia na cha sasa, kwa mwenendo wa kingono usio halali; haipunguzi neno kuwa aina moja tu ya dhambi ya kingono.
- source_word: κυρίῳ / κύριος
  choice: Bwana
  rationale: “Bwana” huhifadhi matumizi ya kawaida ya Paulo na uzito wa kikristolojia wa neno κύριος katika uhusiano wa Yesu na mwili wa mwamini.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji kati ya kauli kuhusu chakula na tumbo na dai linalofuata kuhusu mwili.
theological_decisions:
- issue: Iwapo kifungu cha mwanzo ni kaulimbiu ya Wakorintho au kauli ya Paulo mwenyewe
  choice: Kukitoa moja kwa moja bila alama za kunukuu
  alternative: Kukiweka katika alama za kunukuu kama kaulimbiu ya Wakorintho, au kuongeza “Mnasema”
  rationale: Maandishi ya Kigiriki yenyewe hayana alama au utangulizi unaokitambulisha kama nukuu. Kutokitambulisha wazi huhifadhi uwezekano wa tafsiri zote mbili; tanbihi inataja usomaji wa kaulimbiu.
- issue: Maana ya καταργήσει kuhusu tumbo na vyakula
  choice: ataviondoa
  alternative: ataviangamiza; atavikomesha; atavibatilisha
  rationale: Uchaguzi huu unaonyesha mwisho wa mpangilio wa chakula na tumbo bila kuamua kwamba Paulo anamaanisha maangamizi ya kimwili kabisa.
- issue: Nguvu ya usemi “Bwana ni kwa ajili ya mwili”
  choice: Kuhifadhi usemi mfupi wa uhusiano wa pande mbili
  alternative: Bwana huutunza mwili; Bwana ni kwa mema ya mwili
  rationale: Kigiriki ni kifupi na kinafuata muundo sambamba. Ufafanuzi zaidi ungeamua kwa niaba ya msomaji namna hasa Bwana alivyo “kwa ajili ya” mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo sambamba wa Kigiriki umehifadhiwa kwa marudio ya “ni kwa ajili ya.” Alama ya mkato mrefu inaonyesha mgeuko wa hoja bila kuamua kwamba sehemu ya kwanza ni nukuu.
