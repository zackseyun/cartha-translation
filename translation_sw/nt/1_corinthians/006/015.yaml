id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: sw
  text: Je, hamjui kwamba miili yenu ni viungo vya Masihi[a]? Je, basi, nichukue viungo vya Masihi na kuvifanya kuwa viungo vya kahaba? Hasha kabisa![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός linaweza kutumika kama cheo kinachomaanisha “Masihi” au kwa namna inayofanana na jina, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “Isiwe hivyo kamwe!” Kauli ya Kigiriki μὴ γένοιτο ni ukataaji wenye nguvu sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: miili
  rationale: Neno hili linarejelea miili halisi ya waamini, yaani maisha yao kama watu wenye mwili, si sehemu za mwili tu.
- source_word: μέλη
  choice: viungo
  rationale: “Viungo” huhifadhi taswira ya sehemu za mwili ambazo ni za mwili mzima, pamoja na maana ya kuwa sehemu ya Masihi katika hoja ya Paulo.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa humtaja Mtiwa-Mafuta ambaye waamini ni wake; “Masihi” huhifadhi maana ya cheo hicho.
- source_word: ἄρας
  choice: nivichukue
  rationale: 'Kauli hii ya kutenda inaunganishwa kwa kawaida na swali la balagha linalofuata: Paulo anataja kitendo kinachodhaniwa cha kuchukua viungo vya Masihi.'
- source_word: ποιήσω
  choice: kuvifanya
  rationale: “Kuvifanya” hudumisha nguvu ya swali la kushtua kuhusu kuvigeuza viungo vya Masihi kuwa viungo vya kahaba.
- source_word: πόρνης
  choice: kahaba
  rationale: Neno la Kigiriki humaanisha kahaba hasa katika muktadha huu, wala si mwanamke mwasherati kwa ujumla.
- source_word: μὴ γένοιτο
  choice: Hasha kabisa!
  rationale: Hii ni kauli yenye nguvu ya kukataa kabisa wazo lililotangulia; “Hasha kabisa!” ni ya kawaida, yenye mkazo, na yenye hadhi katika Kiswahili.
- source_word: οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Huhifadhi swali la balagha ambalo linawakumbusha wasikilizaji jambo walilopaswa kulijua tayari.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika lugha ya Paulo kuhusu waamini kuwa viungo vyake
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana ya cheo cha Mtiwa-Mafuta bila kuondoa uwezekano kwamba katika matumizi ya Paulo neno hilo pia linaweza kufanya kazi kama jina.
- issue: Nguvu ya μὴ γένοιτο
  choice: Hasha kabisa!
  alternative: Isiwe hivyo kamwe!
  rationale: Kauli hiyo si jibu hasi la kawaida tu, bali ni ukataaji mkali wa wazo linalochukiza; tafsiri iliyochaguliwa huhifadhi nguvu hiyo bila kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha umehifadhiwa. “Viungo” huendeleza taswira ya mwili bila kuifanya kuwa maelezo ya kimadhehebu, na “kahaba” huhifadhi umahususi wa neno la asili.
