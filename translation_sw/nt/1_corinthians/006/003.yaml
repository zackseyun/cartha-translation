  text: Je, hamjui kwamba tutawahukumu malaika? Sembuse mambo ya maisha haya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “achilia mbali mambo ya maisha haya.”
    reason: Mbadala wa kutafsiri μήτιγε; neno hilo hutia mkazo hoja inayotoka jambo kubwa hadi mambo ya kawaida ya maisha haya.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Huhifadhi swali la balagha linalorudiwa na Paulo na ni la kawaida katika Kiswahili sanifu.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha kishazi kinachoeleza jambo linalojulikana.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika muktadha huu wa hukumu, neno linarejelea viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: κρινοῦμεν
  choice: tutawahukumu
  rationale: Wakati ujao wa kitenzi umehifadhiwa; 'hukumu' haibainishi kupita kiasi namna au upeo wa tendo hilo.
- source_word: μήτιγε
  choice: si zaidi sana
  rationale: Huonyesha hoja kutoka jambo kubwa kwenda jambo dogo zaidi, huku ikidumisha muundo mfupi wa swali la balagha.
- source_word: βιωτικά
  choice: mambo ya maisha haya
  rationale: Hurejelea mambo ya kawaida ya maisha ya duniani bila kuyafupisha kuwa migogoro ya kisheria pekee.
theological_decisions:
- issue: Namna waamini watakavyowahukumu malaika
  choice: tutawahukumu malaika
  alternative: tutatawala juu ya malaika; tutawahukumu malaika walioanguka
  rationale: Andiko halielezi namna, upeo, wala kundi la malaika linalokusudiwa; tafsiri ya moja kwa moja huhifadhi utata na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa balagha umehifadhiwa bila kuingiza ufafanuzi wa kimadhehebu.
