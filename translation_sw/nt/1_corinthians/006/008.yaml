translation:
  language: sw
  text: Lakini ninyi wenyewe mnatenda yasiyo ya haki na kuwapunja, na hayo mnawatendea ndugu zenu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waamini wenzenu.” Neno la Kigiriki hapa ni la wingi wa kiume, lakini linaweza kuwahusu waamini wenzao kwa ujumla, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Huonyesha tofauti yenye nguvu na hoja iliyotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: ὑμεῖς
  choice: ninyi wenyewe
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina mkazo; “ninyi wenyewe” huhifadhi msisitizo wa Paulo juu ya mwenendo wao.
- source_word: ἀδικεῖτε
  choice: mnatenda mabaya
  rationale: Huwasilisha maana pana ya kutenda isivyo haki au kuwadhuru wengine bila kuweka yambwa ambalo halikutajwa wazi.
- source_word: ἀποστερεῖτε
  choice: kuwapunja wengine
  rationale: Kitenzi kina maana ya kumnyima mtu kilicho haki yake au kumdanganya ili kupata mali; “kuwapunja” kinafaa katika muktadha wa migogoro ya kisheria na kiuchumi.
- source_word: καὶ τοῦτο
  choice: tena
  rationale: 'Katika muundo huu, maneno hayo yanaongeza uzito wa kosa: jambo la kushangaza zaidi ni kwamba wanaowatendea hivyo ni ndugu zao.'
- source_word: ἀδελφούς
  choice: ndugu zenu
  rationale: “Ndugu” huhifadhi taswira ya kifamilia ya neno la Kigiriki na kwa Kiswahili inaweza kurejelea waamini wenzao kwa upana; “zenu” hufanya uhusiano huo kuwa wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Upeo wa ἀδελφούς katika jumuiya ya waamini
  choice: ndugu zenu
  alternative: ndugu zenu wa kiume; waamini wenzenu
  rationale: Neno la Kigiriki ni wingi wa kiume, lakini katika matumizi ya Paulo linaweza kuwahusu waamini wenzao kwa ujumla. Kiswahili “ndugu” hakilazimishi jinsia, hivyo huhifadhi maana ya kifamilia na uwezekano wa urejeo mpana bila kuamua suala hilo kimya kimya; tanbihi inalifafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na mkali kama wa Kigiriki; kistari kirefu kinaonyesha ongezeko la msisitizo kabla ya “tena ndugu zenu.”
