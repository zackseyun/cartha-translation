- from: Lakini ninyi wenyewe mnatenda mabaya na kuwapunja wengine—tena ndugu zenu[a].
  to: Lakini ninyi wenyewe mnatenda yasiyo ya haki na kuwapunja, na hayo mnawatendea ndugu zenu[a].
