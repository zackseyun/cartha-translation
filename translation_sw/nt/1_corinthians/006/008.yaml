review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast, emphatic subject, injustice, defrauding, and the identification of those harmed as fellow believers. However, “tena ndugu zenu” does not clearly express the force of καὶ τοῦτο ἀδελφούς (“and this [to/against] brothers”) and leaves the relationship of the acts to “ndugu zenu” syntactically incomplete.
  naturalness: “Lakini ninyi wenyewe mnatenda mabaya na kuwapunja wengine—tena ndugu zenu” is awkward in Standard East African Swahili. In particular, the final apposition after “tena” is elliptical in a way that obscures the intended rhetorical accusation. A resumptive clause is both natural and forceful.
  terminology: “Ndugu zenu” is an appropriate rendering of ἀδελφούς and naturally permits the broader fellow-believer sense in Swahili. “Mnatenda yasiyo ya haki” is closer to the moral/legal breadth of ἀδικεῖτε than “mnatenda mabaya,” while “kuwapunja” appropriately renders ἀποστερεῖτε.
  issues:
  - severity: medium
    issue: The phrase “tena ndugu zenu” fails to state clearly that the wrongdoing and defrauding are done to the brothers.
    rationale: The Greek καὶ τοῦτο heightens the charge by identifying the people against whom the preceding actions are committed. Swahili needs a finite resumptive expression such as “na hayo mnawatendea ndugu zenu” to communicate this relation naturally.
  - severity: low
    issue: “Mnatenda mabaya” is somewhat less precise than the source’s injustice language.
    rationale: ἀδικεῖτε denotes acting unjustly/wronging, and “mnatenda yasiyo ya haki” retains the ethical and legal resonance of the immediate context without over-specifying an object.
  - severity: low
    issue: The footnote’s wording can more accurately distinguish Greek grammatical gender from the gender-neutral Swahili main-text term.
    rationale: The clarification should say that the Greek term is masculine plural and may refer broadly to fellow believers; it should not imply that the Swahili word “ndugu” itself has that masculine grammatical form.
  revised_text: Lakini ninyi wenyewe mnatenda yasiyo ya haki na kuwapunja, na hayo mnawatendea ndugu zenu[a].
  revised_footnotes:
  - marker: a
    text: Au, “waamini wenzenu.” Neno la Kigiriki hapa ni la wingi wa kiume, lakini linaweza kuwahusu waamini wenzao kwa ujumla, wanaume na wanawake.
    reason: lexical_alternative
