base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: sw
  text: Au hamjui kwamba watakatifu watauhukumu ulimwengu? Na ikiwa ulimwengu unahukumiwa na ninyi[a], je, hamfai kuamua mashauri madogo kabisa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwenu.” Maneno ya Kigiriki yanaweza kutafsiriwa hivyo kwa ukaribu zaidi, lakini katika muktadha yanaonyesha kwamba watakatifu watashiriki katika kuuhukumu ulimwengu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mahakama za mambo madogo kabisa.” Neno la Kigiriki linaweza kumaanisha mahakama au mashauri yanayoamuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huendeleza hoja ya Paulo kwa swali kali la balagha, kama katika Kigiriki.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli hii ya balagha katika maandishi ya Paulo.
- source_word: οἱ ἅγιοι
  choice: watakatifu
  rationale: Katika matumizi ya Paulo, neno hili huwarejelea waumini kwa ujumla kama watu waliotengwa kwa ajili ya Mungu, si kundi maalumu lililotangazwa kuwa takatifu.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Huhifadhi upana wa κόσμος bila kuifanya iwe tu jamii ya wanadamu au mfumo wa dunia.
- source_word: κρινοῦσιν
  choice: watauhukumu
  rationale: Huhifadhi wakati ujao na maana ya kutoa hukumu, bila kueleza namna watakatifu watakavyoshiriki katika hukumu hiyo.
- source_word: ἐν ὑμῖν
  choice: na ninyi
  rationale: Katika muktadha huu wa kimahakama, ‘na ninyi’ huonyesha kwamba waumini watashiriki katika hukumu; maana halisi zaidi ya ‘miongoni mwenu’ imehifadhiwa katika tanbihi.
- source_word: κρίνεται
  choice: unahukumiwa
  rationale: Huhifadhi kauli tendwa ya Kigiriki na inafaa katika sharti lenye mtazamo wa wakati ujao.
- source_word: ἀνάξιοί ἐστε
  choice: hamstahili
  rationale: Huhifadhi nguvu ya kutostahili au kutofaa, pamoja na ukali wa swali la Paulo.
- source_word: κριτηρίων ἐλαχίστων
  choice: kuamua hata mashauri madogo kabisa
  rationale: Katika muktadha, usemi huu unaeleweka kwa kawaida kuwa mashauri ya hukumu yenye umuhimu mdogo sana; ‘hata’ huwasilisha nguvu ya hoja kutoka jambo kubwa kwenda madogo, huku maana mbadala ya mahakama ikibainishwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa ‘watakatifu’
  choice: Waumini kwa ujumla, yaani watu waliotengwa kwa ajili ya Mungu
  alternative: Kundi dogo la waumini wenye utakatifu wa pekee
  rationale: Matumizi ya kawaida ya Paulo yanawahusu Wakristo kwa ujumla; tafsiri haileti wazo la kundi la pekee lililotangazwa kuwa takatifu.
- issue: Namna watakatifu watakavyouhukumu ulimwengu
  choice: Watashiriki kwa kweli katika hukumu ya wakati ujao, bila kubainisha utaratibu wake
  alternative: Tathmini ya kimaadili kwa njia ya mfano tu, au mamlaka huru kabisa ya kutoa hukumu
  rationale: Kifungu kinasema wazi kwamba watakatifu watauhukumu ulimwengu, lakini hakielezi namna au kiwango cha ushiriki wao.
- issue: Maana ya κριτηρίων
  choice: Mashauri yanayohitaji kuamuliwa
  alternative: Mahakama au mabaraza ya hukumu
  rationale: Muktadha wa migogoro baina ya waumini unaunga mkono maana ya mashauri, lakini neno la Kigiriki linaweza pia kurejelea mahakama; utata huo umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa Maandiko. ‘Watakatifu’ linadumisha istilahi ya Paulo; ‘mashauri madogo kabisa’ linaeleweka kwa urahisi katika muktadha wa migogoro ya kisheria. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
