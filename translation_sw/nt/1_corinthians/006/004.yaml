base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: sw
  text: Basi, ikiwa mna mashauri ya maisha haya,[a] je, mnawaweka kuwa waamuzi wale wasio na hadhi katika kanisa?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashauri ya maisha ya kila siku”; Kigiriki kinarejelea mambo ya kawaida ya duniani au ya kiraia.
    reason: lexical_alternative
  - marker: b
    text: Au, “wale wanaodharauliwa katika kanisa.” Kirai cha Kigiriki kinaweza kurejelea kwa kejeli watu wanaoonekana kuwa duni ndani ya kanisa, au wale wasio na hadhi kwa mtazamo wa kanisa.
    reason: alternative_reading
  - marker: c
    text: 'Wengine wanaelewa sehemu hii kama amri ya kejeli: “wawekeni wale wasio na hadhi katika kanisa kuwa waamuzi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: mambo ya maisha haya
  rationale: Kirai hiki kinaonyesha mambo ya kawaida ya maisha ya duniani, hasa mashauri ya kiraia; kinaepuka maana ya kimaadili inayoweza kudokezwa na neno kama “ya kidunia.”
- source_word: κριτήρια
  choice: mashauri
  rationale: Katika muktadha huu nomino inaweza kumaanisha mahakama, vikao vya hukumu, au mashauri yanayoamuliwa. “Mashauri” linaendana kwa kawaida na kitenzi “mna” na hoja kuhusu migogoro ya waamini, bila kulazimisha maana ya taasisi pekee.
- source_word: ἐὰν ἔχητε
  choice: ikiwa mna
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya sharti la Kigiriki.
- source_word: τοὺς ἐξουθενημένους
  choice: wale wasio na hadhi
  rationale: Kirai kinamaanisha watu wanaodharauliwa, wanaopuuzwa, au wanaohesabiwa kuwa si kitu. “Wasio na hadhi” huhifadhi wazo la nafasi au thamani mbele ya jumuiya bila kuamua kama ni watu wa ndani au wa nje.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: katika kanisa
  rationale: Tafsiri hii ya moja kwa moja huacha wazi kama watu hao hawana hadhi ndani ya jumuiya au hawana hadhi kwa mtazamo wa kanisa.
- source_word: τούτους καθίζετε
  choice: mnawaweka kuwa waamuzi
  rationale: Ingawa καθίζω kimsingi ni “kuwaketisha,” katika mazingira ya hukumu ina maana ya kuwaweka au kuwateua watu watoe uamuzi. Tafsiri hii inaeleweka wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Iwapo kauli ni swali la kukemea au amri ya kejeli, na wale ‘wasio na hadhi’ ni akina nani
  choice: 'Imetafsiriwa kama swali la kukemea: “je, mnawaweka kuwa waamuzi wale wasio na hadhi katika kanisa?”'
  alternative: 'Inaweza kutafsiriwa kama amri ya kejeli: “wawekeni wale wasio na hadhi katika kanisa kuwa waamuzi”; pia wale wasio na hadhi wanaweza kueleweka kuwa watu wanaodharauliwa ndani ya kanisa au watu wa nje wasio na hadhi kwa mtazamo wa kanisa.'
  rationale: Alama ya kuuliza katika SBLGNT na muktadha wa 6:1–6 vinaunga mkono swali la kukemea. Hata hivyo, sintaksia ya Kigiriki inaruhusu amri ya kejeli; neno “katika kanisa” limeachwa bila kufafanuliwa kupita kiasi ili kuhifadhi utata kuhusu utambulisho wa watu hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mashauri” na “waamuzi” vinatoa maana ya muktadha wa kisheria kwa lugha inayoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
