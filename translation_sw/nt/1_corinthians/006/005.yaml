  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: sw
  text: Ninasema hivi ili kuwaaibisha. Je, ni kweli kwamba miongoni mwenu hakuna hata mtu mmoja mwenye hekima ambaye ataweza kutoa uamuzi kati ya ndugu yake na mwenzake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa usemi “kati ya ndugu yake”: Kigiriki hutaja wazi upande mmoja tu; upande wa pili wa mgogoro unaeleweka kutokana na muktadha. Hapa “ndugu” humrejelea mwamini mwenzake na, katika kusanyiko, inaweza kujumuisha mwanamume au mwanamke.'
    reason: Ufafanuzi wa usemi wa Kigiriki ulioachwa kimuktadha na wa lugha ya kifamilia yenye matumizi wakilishi.
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: Ninasema hivi ili kuwaaibisha
  rationale: Muundo huu unaeleza kusudi au matokeo yanayoelekezwa kwa wasikilizaji na kuhifadhi ukali wa karipio la Paulo kwa Kiswahili cha kawaida.
- source_word: οὕτως
  choice: Je, ni kweli kwamba
  rationale: Katika muktadha huu neno linaanzisha swali la balagha lenye mshangao na kukemea, si maelezo ya namna tu.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: miongoni mwenu hakuna hata mtu mmoja mwenye hekima
  rationale: Huhifadhi msisitizo wa usemi hasi na kuonyesha wazi kuwa Paulo analizungumzia kusanyiko lote; 'mtu' ni ya asili na haibani rejeo kwa wanaume pekee.
- source_word: ὃς δυνήσεται
  choice: ambaye ataweza
  rationale: Huhifadhi maana ya uwezo unaotazamiwa iliyo katika kitenzi cha wakati ujao.
- source_word: διακρῖναι
  choice: kutoa uamuzi
  rationale: Katika muktadha wa mashauri ya kisheria, kitenzi kinamaanisha kuamua shauri; usemi huu unaeleweka bila kudokeza hukumu ya adhabu.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: kati ya ndugu yake na mwenzake
  rationale: Kigiriki kina usemi wa kimuktadha ulioachwa bila kutaja upande wa pili. 'Na mwenzake' hukamilisha Kiswahili huku tanbihi ikibainisha yaliyo wazi na yasiyo wazi katika chanzo.
theological_decisions:
- issue: Lugha ya kiume inayoweza kuwakilisha kusanyiko lenye wanaume na wanawake
  choice: mtu mmoja mwenye hekima ... ndugu yake na mwenzake
  alternative: mwanamume mmoja mwenye hekima ... ndugu yake
  rationale: σοφός na ἀδελφός ni maumbo ya kiume ya umoja, lakini muktadha unalihusu kusanyiko zima. 'Mtu' huepuka kuzuia maana isivyohitajika, huku 'ndugu' ikihifadhi lugha ya kifamilia ya Paulo.
- issue: Upande wa pili katika usemi 'kati ya ndugu yake'
  choice: kuongeza 'na mwenzake' kwa uwazi wa kisarufi
  alternative: kati ya ndugu yake
  rationale: Chanzo kinataja kwa uwazi 'ndugu yake' tu baada ya 'kati ya,' na upande wa pili unaeleweka kutokana na muktadha. Nyongeza imewekewa tanbihi ili isichukuliwe kuwa neno lililotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Karipio la Paulo limehifadhiwa bila kuwa la matusi; msamiati wa mgogoro unaeleweka kwa wasomaji wa kawaida.
