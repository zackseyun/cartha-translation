  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: sw
  text: Je, yeyote miongoni mwenu, akiwa na shauri dhidi ya mwingine, anathubutu kuhukumiwa mbele ya wasio waadilifu[a], na si mbele ya watakatifu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasio haki.” Baadhi ya tafsiri hufafanua neno hili kuwa “wasioamini,” lakini Kigiriki kinasema “wasio waadilifu.”
    reason: lexical_alternative
  - marker: b
    text: “Watakatifu” hapa ni watu watakatifu wa Mungu, yaani, waamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: anayethubutu
  rationale: Inaonyesha swali la balagha la Paulo na wazo la kuwa na ujasiri unaokaribia ufidhuli katika muktadha huu.
- source_word: τις ὑμῶν
  choice: kuna yeyote miongoni mwenu
  rationale: Inahifadhi maana ya mtu mmoja asiyeainishwa kutoka katika kundi linalosemewa, kwa Kiswahili cha kawaida.
- source_word: πρᾶγμα ἔχων
  choice: akiwa na shauri
  rationale: Katika muktadha wa kisheria, “shauri” linaonyesha jambo linalohitaji uamuzi bila kulifafanua kupita kiasi kuwa kesi rasmi tayari.
- source_word: πρὸς τὸν ἕτερον
  choice: dhidi ya mwenzake
  rationale: “Dhidi ya” linafaa kwa mzozo wa kisheria, huku “mwenzake” likionyesha mtu mwingine katika jumuiya inayozungumziwa.
- source_word: κρίνεσθαι
  choice: kwenda kuhukumiwa
  rationale: Inahifadhi hali ya kutendwa ya kitenzi na maana yake ya kimahakama, huku “kwenda” likifanya usemi uwe wa kawaida katika Kiswahili.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: mbele ya wasio waadilifu
  rationale: Inahifadhi tathmini ya kimaadili ya ἀδίκων badala ya kuifasiri moja kwa moja kuwa “wasioamini”; “mbele ya” linafaa kwa mazingira ya mahakama.
- source_word: καὶ οὐχὶ
  choice: wala si
  rationale: Linaonyesha kwa uwazi ulinganisho mkali uliomo katika swali la balagha.
- source_word: ἐπὶ τῶν ἁγίων
  choice: mbele ya watakatifu
  rationale: “Watakatifu” ni istilahi ya kawaida ya Paulo kwa watu wa Mungu na inadumisha ulinganifu na “wasio waadilifu.”
theological_decisions:
- issue: Tafsiri ya ἀδίκων ikilinganishwa na ἁγίων
  choice: wasio waadilifu … watakatifu
  alternative: wasioamini … waamini
  rationale: Ingawa muktadha unaashiria mahakimu walio nje ya jumuiya ya waamini, Kigiriki kinatumia maneno yenye uzito wa kimaadili na kitheolojia. Tafsiri inahifadhi maneno hayo na haitatui kimya kimya maana yake kwa tafsiri ya kiufafanuzi.
- issue: Rejeo la umoja katika τις ὑμῶν na ἔχων
  choice: yeyote … akiwa
  alternative: watu wowote … wakiwa
  rationale: Muundo wa Kiswahili unahifadhi umoja wa uwakilishi wa Kigiriki bila kulazimika kutumia kiwakilishi chenye jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Shauri” na “mbele ya” yanadumisha mazingira ya kisheria; “wasio waadilifu” na “watakatifu” yanahifadhi mvutano wa msamiati wa Paulo.
