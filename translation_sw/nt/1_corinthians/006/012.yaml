  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: sw
  text: “Ninaruhusiwa kufanya mambo yote,”[a] lakini si yote yanafaa.[b] “Ninaruhusiwa kufanya mambo yote,” lakini mimi sitatawaliwa na chochote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au bila alama za kunukuu: Ninaruhusiwa kufanya mambo yote. Wengi huielewa kauli hii kuwa kauli mbiu ya Wakorintho ambayo Paulo anainukuu na kisha kuwekea mipaka.'
    reason: alternative_reading
  - marker: b
    text: Au “yenye faida” au “yanayosaidia.”
    reason: lexical_alternative
  - marker: c
    text: Au “lakini mimi sitakuwa chini ya mamlaka ya chochote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Mambo yote
  rationale: Nomino hii ya wingi isiyo na jinsia inatumika kwa maana pana. “Mambo yote” inadumisha upana na urudiaji wa kauli ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: μοι
  choice: kwangu
  rationale: Pamoja na ἔξεστιν, hali ya dative humtaja mtu ambaye kwake jambo limeruhusiwa; “kwangu” ni usemi wa asili katika Kiswahili.
- source_word: ἔξεστιν
  choice: yanaruhusiwa
  rationale: Kitenzi kinaonyesha jambo linalokubalika au kuruhusiwa. “Yanaruhusiwa” ni wazi na cha sasa, bila kuifanya kauli iwe lugha finyu ya sheria.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: lakini si yote yenye manufaa
  rationale: συμφέρει hapa hueleza jambo lenye faida au linalosaidia. “Yenye manufaa” huhifadhi tathmini hiyo bila kuashiria faida ya kifedha pekee.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: lakini sitatawaliwa
  rationale: Wakati ujao wa kutendwa wa ἐξουσιάζω unamaanisha kuwa chini ya mamlaka au udhibiti. “Sitatawaliwa” ni kifupi, cha kawaida, na hudumisha wazo la mamlaka; kiwakilishi kilicho ndani ya kitenzi kinatosha kuonyesha msisitizo wa ἐγώ katika muktadha huu.
- source_word: ὑπό τινος
  choice: na chochote
  rationale: τινος inaweza kurejelea mtu au kitu, lakini katika muktadha wa matendo na tamaa, “chochote” ndiyo tafsiri inayofaa zaidi huku ikidumisha upana wa kanuni.
theological_decisions:
- issue: Ikiwa Πάντα μοι ἔξεστιν itiwe alama kuwa kauli mbiu ya Wakorintho
  choice: 'Kauli inayorudiwa imewekwa ndani ya alama za kunukuu: “Mambo yote yanaruhusiwa kwangu”'
  alternative: Kuandika bila alama za kunukuu kama kauli ya Paulo mwenyewe ambayo anaiwekea mipaka katika vifungu vinavyofuata
  rationale: Wengi huiona kama kauli ya Wakorintho ambayo Paulo ananukuu na kisha kuisahihisha. Hati za Kigiriki hazikuwa na alama za kisasa za kunukuu, kwa hiyo uamuzi huu ni wa kiufafanuzi, si tofauti ya maandishi. Tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi na urudiaji wa Kigiriki vimedumishwa kwa uwazi, huku “yanaruhusiwa,” “yenye manufaa,” na “sitatawaliwa” zikitumia lugha inayoeleweka kwa wasomaji wa kawaida.
