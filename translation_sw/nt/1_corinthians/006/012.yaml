- from: “Mambo yote yanaruhusiwa kwangu,”[a] lakini si yote yenye manufaa.[b] “Mambo yote yanaruhusiwa kwangu,” lakini sitatawaliwa na chochote.[c]
  to: “Ninaruhusiwa kufanya mambo yote,”[a] lakini si yote yanafaa.[b] “Ninaruhusiwa kufanya mambo yote,” lakini mimi sitatawaliwa na chochote.[c]
  rationale: Revised only for idiomatic Standard East African Swahili and to reflect the explicit contrastive ἐγώ. The meaning, rhetorical repetition, interpretive quotation marks, and all footnote anchors are retained. The translation does not decide whether the quoted statement is certainly a Corinthian slogan; that ambiguity remains documented in footnote a.
  reviewer_model: gpt-5.6-terra
