  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: sw
  text: Kwa hiyo, ndugu zangu[a], mnapokusanyika ili mle, ngojaneni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki limetumia umbo linalomaanisha kihalisi “ndugu wa kiume,” lakini mara nyingi umbo hilo hutumiwa kulihutubia kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “pokeaneni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na maonyo yaliyotangulia kuhusu matumizi mabaya ya mlo wa Bwana.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: Huhifadhi namna ya moja kwa moja na ya upendo ya mtume. Katika Kiswahili, “ndugu” si neno lenye jinsia ya kiume pekee na linaweza kulihusu kusanyiko lote.
- source_word: συνερχόμενοι
  choice: mnapokusanyika
  rationale: Hukitafsiri kitenzi kishirikishi kwa kishazi cha wakati kinachoeleweka kwa urahisi na kudumisha wazo la kukutana pamoja.
- source_word: εἰς τὸ φαγεῖν
  choice: ili mle
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaonyesha kusudi; “ili mle” ni wa asili na sahihi katika Kiswahili.
- source_word: ἀλλήλους
  choice: -ni- katika “ngojaneni”
  rationale: Kiambishi cha kutendeana katika kitenzi cha Kiswahili huwasilisha kwa kawaida maana ya ‘ninyi kwa ninyi.’
- source_word: ἐκδέχεσθε
  choice: ngojaneni
  rationale: Katika muktadha wa wengine kutangulia kula (mst. 21), maana inayofaa zaidi ni kusubiriana kabla ya kuanza, ingawa kitenzi kinaweza pia kuwa na wazo la kumpokea mtu.
theological_decisions:
- issue: Anwani ἀδελφοί yenye umbo la kiume katika Kigiriki
  choice: Kutumia “ndugu zangu” katika matini na kueleza katika tanbihi kuwa anwani inahusu waumini wote.
  alternative: “ndugu zangu wa kiume na wa kike”
  rationale: Kigiriki kimetumia umbo la kiume ambalo mara nyingi huwakilisha kusanyiko lenye wanaume na wanawake. “Ndugu” ni ya kawaida, yenye heshima, na isiyobainisha jinsia katika Kiswahili, bila kuingiza maelezo marefu ndani ya matini.
- issue: Maana ya ἐκδέχεσθε katika muktadha wa mlo wa Bwana
  choice: “ngojaneni”
  alternative: “pokeaneni”
  rationale: Muktadha wa karibu, hasa kula kwa wengine kabla ya wenzao, unaunga mkono amri ya kusubiriana. Hata hivyo, uwezekano wa maana ya kupokeana unastahili kutajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida katika mazingira ya ibada. Alama zote za tanbihi zinazoorodheshwa zinapaswa kuwapo katika matini; kwa hiyo tanbihi [b] imeambatanishwa na kitenzi kinachohusika.
