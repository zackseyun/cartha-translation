  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: sw
  text: Kwa sababu hiyo, wengi miongoni mwenu ni dhaifu na wagonjwa, na idadi kubwa wamelala usingizi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa wazi zaidi, “wamekufa.” Inaelekea Paulo anatumia “kulala usingizi” kama sitiari ya kawaida ya Kikristo ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaonyesha wazi uhusiano wa kisababishi na matumizi mabaya ya Chakula cha Bwana yaliyoelezwa kabla.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Inarejelea hali iliyopo ndani ya jumuiya ya waamini wa Korintho, si hali ya ndani ya mtu binafsi.
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kivumishi hiki cha idadi kinachotumiwa kama nomino.
- source_word: ἀσθενεῖς
  choice: dhaifu
  rationale: Inahifadhi maana ya udhaifu wa mwili na kuitofautisha na ugonjwa unaotajwa kwa neno linalofuata.
- source_word: ἄρρωστοι
  choice: wagonjwa
  rationale: Ni neno la kawaida na linaloeleweka kwa hali ya kuugua, huku likidumisha tofauti na ‘dhaifu.’
- source_word: κοιμῶνται
  choice: wamekwisha kulala usingizi
  rationale: Inahifadhi sitiari ya kulala inayomaanisha kifo na pia kuonyesha hali iliyofikiwa; ‘usingizi’ hufanya usemi huo uwe wa kawaida na wazi katika Kiswahili.
- source_word: ἱκανοί
  choice: watu wengi
  rationale: Katika muktadha huu neno linamaanisha idadi kubwa au ya kutosha kuonekana; ‘watu wengi’ ni Kiswahili cha kawaida bila kutumia usemi usio wa asili kama ‘idadi nzuri.’
theological_decisions:
- issue: Ikiwa κοιμῶνται itafsiriwe kama usingizi halisi au kama sitiari ya kifo
  choice: Sitiari ya kifo imehifadhiwa katika matini kuu kama ‘wamekwisha kulala usingizi.’
  alternative: ‘wamekufa’ au ‘wanalala’ kwa maana halisi
  rationale: Muktadha wa hukumu na mfuatano wa udhaifu, ugonjwa, kisha kulala unaonyesha kuwa Paulo anarejelea kifo. Kuhifadhi sitiari kunadumisha namna yake ya kusema bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku tofauti kati ya udhaifu, ugonjwa, na kifo ikihifadhiwa.
