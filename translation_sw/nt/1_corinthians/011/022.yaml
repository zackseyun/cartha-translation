  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: sw
  text: Je, hamna nyumba za kula na kunywa? Au mnalidharau kanisa la Mungu na kuwaaibisha wale wasio na kitu? Niwaambie nini? Je, niwasifu? Katika jambo hili siwasifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “maskini” au “wale wasio na chakula”; Kigiriki: “wale wasio na” (kitu kinadokezwa).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: nyumba
  rationale: Hurejelea makao ya binafsi, yakitofautishwa na kusanyiko la waumini; “nyumba” ni neno la kawaida na la moja kwa moja.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: za kulia na kunywea
  rationale: Muundo huu unaonyesha kusudi la nyumba hizo na unasikika kwa kawaida katika Kiswahili.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: kanisa la Mungu
  rationale: Ni usemi uliozoeleka kwa jumuiya ya watu walio wa Mungu, bila kulazimisha maana ya taasisi au jengo.
- source_word: καταφρονεῖτε
  choice: mnalidharau
  rationale: “Kudharau” huhifadhi ukali wa lawama na maana ya kuliona jambo kuwa lisilo na thamani.
- source_word: καταισχύνετε
  choice: kuwaaibisha
  rationale: Hutoa maana ya kuwasababishia wengine aibu; ni ya moja kwa moja na ya asili.
- source_word: τοὺς μὴ ἔχοντας
  choice: wale wasio na kitu
  rationale: Hufuata usemi mpana wa Kigiriki, “wale wasio na,” bila kuufanya moja kwa moja kuwa jina la kundi la kiuchumi.
- source_word: τί εἴπω ὑμῖν;
  choice: Niwaambie nini?
  rationale: Huhifadhi swali la kutafakari lenye lawama kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Je, niwasifu?
  rationale: Huhifadhi swali la balagha na matarajio ya jibu hasi.
- source_word: ἐν τούτῳ
  choice: Katika jambo hili
  rationale: Huweka wazi kuwa Paulo anarejelea mwenendo unaozungumziwa, bila kuongeza ufafanuzi usiomo katika matini.
- source_word: οὐκ ἐπαινῶ
  choice: siwasifu
  rationale: Kurudia “sifu” kunahifadhi mwangwi wa kitenzi kilekile katika swali lililotangulia.
theological_decisions:
- issue: Wanaorejelewa na τοὺς μὴ ἔχοντας katika muktadha wa Mlo wa Bwana
  choice: wale wasio na kitu
  alternative: maskini; wale wasio na chakula
  rationale: Muktadha unaelekea kwa waumini wenye uhitaji wa mali au chakula, lakini Kigiriki chenyewe ni kipana zaidi. Tafsiri kuu huhifadhi upana huo, na tanbihi hutaja maana zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Maswali mafupi yanahifadhi ukali na mtiririko wa lawama za Paulo.
