base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: sw
  text: Lakini mwanamke[a] akiwa na nywele ndefu, je, hizo ni utukufu wake? Kwa maana amepewa nywele hizo badala ya kifuniko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke.” Neno la Kigiriki linaweza kumaanisha “mwanamke” au “mke” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwa kifuniko.” Kihusishi cha Kigiriki kinaweza kuonyesha ulinganifu au kwamba kitu kimoja kimechukua mahali pa kingine; maneno haya peke yake hayaamui ikiwa Paulo anasema nywele ndizo kifuniko au zimetolewa kwa uhusiano na kifuniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mwanamke
  rationale: Neno hili linaweza kumaanisha “mwanamke” au “mke” kutegemea muktadha. Hapa kauli ni ya jumla, hivyo “mwanamke” linafaa zaidi bila kuondoa uwezekano mwingine.
- source_word: κομᾷ
  choice: akiwa na nywele ndefu
  rationale: Kitenzi hiki humaanisha kuwa na nywele ndefu au kuzifuga ziwe ndefu. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha hali inayokusudiwa.
- source_word: δόξα
  choice: utukufu
  rationale: “Utukufu” huhifadhi uzito na nguvu ya δόξα, ambalo hapa linahusu jambo linalomletea mtu heshima au fahari.
- source_word: κόμη
  choice: nywele hizo
  rationale: κόμη ni nywele za kichwa, mara nyingi zikiwa na dhana ya urefu. Kiwakilishi “hizo” kinaunganisha neno hili kwa kawaida na “nywele ndefu” zilizotajwa awali bila kurudia maelezo.
- source_word: ἀντί
  choice: badala ya
  rationale: Kihusishi hiki kwa kawaida huonyesha ubadilishaji, kuwa mahali pa kitu kingine, au ulinganifu. “Badala ya” huhifadhi maana yake ya msingi, huku tanbihi ikieleza uwezekano mwingine.
- source_word: περιβολαίου
  choice: kifuniko
  rationale: Neno hili kwa ujumla humaanisha kitu kinachozungushiwa au kutumiwa kufunika. “Kifuniko” halilazimishi maana maalumu zaidi ya “utaji” ambayo Kigiriki chenyewe hakidai.
- source_word: δέδοται
  choice: amepewa
  rationale: Kauli timilifu tendwa inaonyesha tendo la kutoa lililokamilika na hali inayoendelea kutokana nalo. “Amepewa” huhifadhi hali hiyo pamoja na sauti tendwa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ikiwa περιβόλαιον inapaswa kutafsiriwa hasa kuwa “utaji,” na hivyo kuamua kwamba nywele zenyewe ndizo kifuniko cha kichwa kinachokusudiwa katika kifungu kizima.
  choice: kifuniko
  alternative: utaji; nguo ya kujifunika
  rationale: Nomino ya Kigiriki ina maana pana kuliko “utaji.” “Kifuniko” huhifadhi upana wa neno na hakiamui kimyakimya mjadala wa ikiwa Paulo anamaanisha utaji wa kitambaa, kifuniko kwa ujumla, au ulinganifu kati ya nywele za asili na kifuniko kingine.
- issue: Ikiwa ἀντί hapa inasema nywele zimetolewa mahali pa kifuniko au kuwa kifuniko.
  choice: badala ya kifuniko, pamoja na tanbihi inayotaja “kuwa kifuniko”
  alternative: kuwa kifuniko
  rationale: “Badala ya” huakisi vizuri nguvu ya kawaida ya ἀντί, lakini kihusishi kinaweza pia kueleweka kwa ulinganifu. Tanbihi huhifadhi mvutano huu bila kuamua fundisho pana kuhusu vifuniko vya kichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali unafuata alama ya swali katika SBLGNT, huku tanbihi ikihifadhi uwezekano wa kuisoma kama kauli. “Utukufu” limechaguliwa badala ya “fahari” ili kuhifadhi uhusiano wa kimsamiati na nguvu ya δόξα.
