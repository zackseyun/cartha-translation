id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: sw
  text: Kwa maana mwanamume hapaswi kufunika kichwa chake[b], kwa kuwa yeye ni mfano na utukufu wa Mungu; lakini mwanamke ni utukufu wa mwanamume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mume” na “mke” badala ya “mwanamume” na “mwanamke” katika mstari huu; maneno ya Kigiriki ἀνήρ na γυνή yanaweza kuwa na maana mojawapo kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Au, “kutia utaji kichwani”; Kigiriki husema kwa ujumla zaidi, “kufunika kichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: mwanamume / wa mwanamume
  rationale: Maneno haya yanaweza kumaanisha pia ‘mume,’ lakini muktadha wa karibu unatofautisha mwanamume na mwanamke kwa upana katika ibada na hoja ya uumbaji. ‘Mwanamume’ huhifadhi maana hiyo ya kijumla bila kuibana kuwa uhusiano wa ndoa pekee.
- source_word: ὀφείλει
  choice: hapaswi
  rationale: Hueleza wajibu wa kimaadili au jambo linalotakiwa, kwa Kiswahili cha kawaida, bila kulifanya kuwa amri kali kuliko ilivyo katika Kigiriki.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: kufunika kichwa chake
  rationale: Tafsiri hii huhifadhi usemi wa jumla wa Kigiriki bila kuamua kwamba kifuniko hicho lazima kiwe utaji wa aina fulani.
- source_word: εἰκὼν
  choice: mfano
  rationale: ‘Mfano’ ni neno la kawaida katika Kiswahili cha Biblia kwa εἰκών na huhifadhi mwangwi unaowezekana wa simulizi la uumbaji katika Mwanzo.
- source_word: δόξα
  choice: utukufu
  rationale: ‘Utukufu’ limetumiwa katika sehemu zote mbili ili kudumisha ulinganifu na uzito wa kiteolojia wa δόξα; ‘heshima’ ingepunguza upana wake.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi umilikishi rahisi wa Kigiriki bila maelezo ya ziada.
- source_word: ὑπάρχων
  choice: kwa kuwa yeye ni
  rationale: Kirai hiki huonyesha msingi wa kauli iliyotangulia na ni cha kawaida katika Kiswahili.
- source_word: ἡ γυνὴ
  choice: mwanamke
  rationale: Hulingana na ‘mwanamume’ katika utofautishaji wa kijumla wa kiume na kike; ‘mke’ inawezekana lakini ingeifanya kauli ihusu ndoa pekee bila ulazima wa wazi katika muktadha.
theological_decisions:
- issue: Iwapo ἀνήρ na γυνή zitafsiriwe ‘mume/mke’ au ‘mwanamume/mwanamke’
  choice: mwanamume/mwanamke
  alternative: mume/mke
  rationale: Muundo wa kifungu, mjadala wa kufunika kichwa, na hoja inayohusiana na uumbaji vinaunga mkono utofautishaji mpana wa mwanamume na mwanamke. Tanbihi huhifadhi uwezekano halisi wa maana ya ndoa.
- issue: Jinsi ya kutafsiri kauli ya Paulo yenye kutokuwa na ulinganifu bila kuipunguza
  choice: mwanamke ni utukufu wa mwanamume
  alternative: mwanamke huakisi utukufu wa mwanamume / mwanamke ni heshima ya mwanamume
  rationale: Kigiriki hutumia moja kwa moja ἐστιν pamoja na δόξα. Tafsiri inahifadhi mvutano wa kiteolojia badala ya kuufafanua au kuupunguza kimya kimya.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa alama za tanbihi umewekwa kulingana na mada husika: [b] baada ya kauli ya kufunika kichwa, na [a] baada ya istilahi zote za mwanamume/mwanamke kuonekana.'
