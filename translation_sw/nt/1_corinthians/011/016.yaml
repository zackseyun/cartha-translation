  terminology: “Desturi” hufaa kwa συνήθεια, na “makanisa ya Mungu” huhifadhi ἐκκλησίαι τοῦ θεοῦ kwa usahihi. Tanbihi a hutoa mbadala wa kimsamiati unaofaa, na tanbihi b inaeleza kwa haki uwezekano mbili za rejeleo la “desturi kama hiyo” bila kupendelea tafsiri ya kimafundisho.
