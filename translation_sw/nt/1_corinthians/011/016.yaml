  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: sw
  text: Lakini ikiwa mtu yeyote anaonekana kuwa mpenda mabishano[a], sisi hatuna desturi kama hiyo[b], wala makanisa ya Mungu hayana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgomvi” au “anayependa ugomvi.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “hatuna desturi kama hiyo” yanaweza kumaanisha ama kwamba hawana desturi ya kupenda mabishano, au kwamba hawana desturi inayobishaniwa katika mistari iliyotangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: anaonekana
  rationale: Huhifadhi maana ya ‘anaonekana’ katika muundo huu bila kuamua ikiwa ni mtazamo wa mtu mwenyewe au jinsi tabia yake inavyoonekana.
- source_word: φιλόνεικος
  choice: mpenda mabishano
  rationale: Ni Kiswahili cha kawaida kinachoeleza mtu anayeelekea kupenda ugomvi au kushindana kwa maneno; tanbihi inahifadhi visawe vinavyowezekana.
- source_word: τοιαύτην
  choice: kama hiyo
  rationale: Hurejelea aina ya desturi bila kubainisha zaidi jambo linalorejelewa.
- source_word: συνήθειαν
  choice: desturi
  rationale: Huonyesha jambo lililozoeleka au utaratibu unaokubalika katika jumuiya, huku ikibaki pana vya kutosha kuhifadhi utata wa muktadha.
- source_word: οὐκ ἔχομεν
  choice: hatuna
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, isiyoingiza dhana kali zaidi kama ‘haturuhusu’.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: makanisa ya Mungu
  rationale: Huhifadhi muundo wa kirai na wazo la makusanyiko yaliyo ya Mungu.
theological_decisions:
- issue: Jambo linalorejelewa na ‘hatuna desturi kama hiyo’
  choice: Kirai kimeachwa kwa upana wake bila kubainisha iwapo kinamaanisha tabia ya kupenda mabishano au desturi iliyojadiliwa katika mistari iliyotangulia.
  alternative: ‘Hatuna desturi ya kubishana hivyo’ au ‘hatuna desturi hiyo inayohusu jambo lililojadiliwa hapo juu.’
  rationale: Kigiriki τοιαύτην συνήθειαν ni kifupi kisintaksia na rejeleo lake linajadiliwa. Tafsiri huhifadhi utata huo halisi badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mpenda mabishano’ linaeleweka kwa urahisi, na ‘desturi kama hiyo’ huhifadhi utata wa rejeleo la Kigiriki.
