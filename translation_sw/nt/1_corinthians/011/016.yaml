  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: εἰ δέ ni “Lakini ikiwa,” τις ni “mtu yeyote,” δοκεῖ…εἶναι imehifadhiwa vizuri kwa “anaonekana kuwa,” na φιλόνεικος kwa “mpenda mabishano.” Kirai “hatuna desturi kama hiyo” hulingana na τοιαύτην συνήθειαν οὐκ ἔχομεν bila kuamua rejeleo lake lenye utata. “Wala makanisa ya Mungu hayana” ni ulinganifu sahihi wa οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.'
