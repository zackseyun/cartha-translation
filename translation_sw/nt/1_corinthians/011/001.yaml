lexical_decisions:
- source_word: μιμηταί μου γίνεσθε
  choice: Niigeni mimi
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unaeleza wazi agizo la kuufuata kwa kuiga mfano wa Paulo. Unahifadhi maana ya μιμηταί, ingawa kwa ufasaha wa Kiswahili nomino pamoja na γίνεσθε imetolewa kwa kitenzi cha agizo.
- source_word: καθὼς κἀγὼ
  choice: kama mimi nami ninavyo-
  rationale: “Kama” huhifadhi ulinganisho wa καθὼς, na “mimi nami” huonyesha msisitizo na maana ya nyongeza iliyo katika κἀγώ.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inamtaja Yesu kwa cheo chake cha Masihi. “Masihi” ni neno la Kiswahili linaloeleweka, huku tafsiri ya jadi “Kristo” ikitajwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana ya cheo cha Χριστός katika muktadha huu bila kukifanya kuwa jina tu. “Kristo” ni tafsiri ya jadi na imehifadhiwa kama mbadala katika tanbihi.
- issue: Kukamilisha kishazi chenye udondoshaji wa neno katika καθὼς κἀγὼ Χριστοῦ
  choice: nami ninavyomwiga Masihi
  alternative: nami nilivyo mwigaji wa Masihi
  rationale: Kigiriki hakirudii wazi nomino μιμητής katika kishazi cha pili, lakini inaeleweka kutokana na kishazi cha kwanza. Kiswahili cha kawaida huhitaji kukamilisha maana hiyo; “ninavyomwiga” huondoa uwezekano wa kueleweka kama kumilikiwa na Masihi, bila kubadili uhusiano wa ulinganisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha fupi, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kitenzi “Niigeni” umetumiwa badala ya “Iweni waigaji wangu,” ambao ni wa karibu zaidi na umbo la Kigiriki lakini unasikika mzito na unaweza kudokeza uigizaji wa mtu badala ya kufuata mfano wake.
