  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: sw
  text: Kwa maana anayekula na kunywa bila kuupambanua mwili[a][b] hujiletea hukumu kwa kula na kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “mwili wa Bwana” badala ya “mwili.”
    reason: textual_variant
  - marker: b
    text: Au “bila kuutofautisha mwili”; huenda hii ikamaanisha kutambua umuhimu wa Chakula cha Bwana, kuutambua mwili uliokusanyika wa waamini, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: hukumu
  rationale: Neno hili linamaanisha uamuzi wa hukumu; “hukumu” lina upana unaofaa hapa na halidokezi moja kwa moja hukumu ya mwisho, hasa kwa kuzingatia nidhamu ya Mungu inayotajwa katika mistari inayofuata.
- source_word: ἑαυτῷ
  choice: hujiletea
  rationale: Hueleza kwamba mla na mnywaji mwenyewe ndiye anayepatwa na hukumu hiyo; muundo huu ni wa asili katika Kiswahili na unaonyesha matokeo mabaya kwake.
- source_word: διακρίνων
  choice: kutambua
  rationale: Hapa kitenzi kina wazo la kupambanua au kutathmini ipasavyo. “Kutambua” ni wazi kwa msomaji wa kawaida bila kufunga maana kwenye tafsiri moja tu.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: Maandishi ya SBLGNT yanasema kwa ufupi “mwili,” bila kuongeza “wa Bwana”; ufupi huo unahifadhi uwezekano wa kurejelea mwili wa Kristo, jumuiya ya waamini, au yote mawili.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: anayekula na kunywa
  rationale: Muundo huu wa umoja wenye maana ya jumla ni wa kawaida na unaoeleweka katika Kiswahili.
- source_word: μὴ διακρίνων
  choice: kwa kuwa hautambui
  rationale: Kirai hiki kinaonyesha hali au sababu inayoambatana na kula na kunywa hukumu. Tafsiri hii ni ya asili huku ikihifadhi uhusiano wa kishiriki wa Kigiriki bila kuufanya amri.
theological_decisions:
- issue: Maana ya “mwili” katika muktadha wa Chakula cha Bwana
  choice: Kudumisha neno lisilofafanuliwa “mwili” katika matini kuu.
  alternative: “mwili wa Bwana” au “mwili wa waamini”
  rationale: Kigiriki kinasema “mwili” tu. Muktadha unaweza kuelekeza kwenye mwili wa Kristo katika chakula, kanisa kama mwili, au yote mawili; tafsiri haipaswi kuondoa mvutano huo.
- issue: Nguvu ya maana ya κρίμα
  choice: hukumu
  alternative: adhabu ya milele
  rationale: Muktadha unaofuata unatofautisha nidhamu ya sasa na kuhukumiwa pamoja na ulimwengu; hivyo “hukumu” huepuka kuzidisha maana kuwa maangamizi ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “kula na kunywa” yamehifadhiwa kwa sababu ni ya kimakusudi katika Kigiriki. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
