base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: sw
  text: Kwa maana mwanamume hakuumbwa kwa ajili ya mwanamke, bali mwanamke kwa ajili ya mwanamume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya mwanamke … kwa sababu ya mwanamume.” Kihusishi cha Kigiriki kinaweza kuonyesha sababu au kusudi; hapa kimetafsiriwa “kwa ajili ya” kulingana na hoja inayohusu uumbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Katika muktadha huu, kiunganishi hiki kinaendeleza hoja kwa kutoa sababu au ufafanuzi. “Kwa maana” ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha nguvu ya γάρ; maana nyepesi ya καί imejumuishwa katika mwendelezo wa sentensi bila kuongeza neno lisilo la asili.
- source_word: ἐκτίσθη
  choice: hakuumbwa
  rationale: Kitenzi κτίζω humaanisha kuumba. Umbo la kutendwa pamoja na οὐκ linawasilishwa moja kwa moja kwa “hakuumbwa,” na linafaa kwa rejeo la simulizi la uumbaji.
- source_word: ἀνὴρ
  choice: mwanamume
  rationale: Neno hili hapa linarejelea mwanamume katika hoja inayotokana na uumbaji, si lazima mume katika ndoa fulani. “Mwanamume” huhifadhi maana ya kijinsia bila kuibana kuwa ya ndoa pekee.
- source_word: διὰ τὴν γυναῖκα
  choice: kwa ajili ya mwanamke
  rationale: διά pamoja na hali ya kushutumiwa inaweza kuonyesha sababu, kusudi, au manufaa. “Kwa ajili ya” hudokeza mwelekeo wa kusudi au manufaa unaofaa hoja ya uumbaji, huku tanbihi ikihifadhi uwezekano wa maana ya kisababishi.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” huonyesha kwa uwazi utofautishaji mkali baada ya kauli hasi na kudumisha usawaziko wa vifungu viwili.
- source_word: γυνὴ
  choice: mwanamke
  rationale: Katika muktadha wa uumbaji, neno hili lina maana pana ya mwanamke badala ya maana iliyobanwa ya mke.
- source_word: διὰ τὸν ἄνδρα
  choice: kwa ajili ya mwanamume
  rationale: Tafsiri hii ni sambamba na kirai cha kwanza cha διά, huhifadhi muundo wa hoja, na haifungi kabisa uwezekano wa kisababishi unaoelezwa katika tanbihi.
theological_decisions:
- issue: Iwapo ἀνήρ na γυνή zitafsiriwe “mwanamume/mwanamke” au “mume/mke”
  choice: mwanamume/mwanamke
  alternative: mume/mke
  rationale: Kitenzi “aliumbwa” kinaonyesha kwamba Paulo anarejelea simulizi la uumbaji. Kwa hiyo, maneno ya kijinsia “mwanamume/mwanamke” huhifadhi upana wa rejeo hilo bila kuingiza kimya kimya kikomo cha mahusiano ya ndoa.
- issue: Iwapo διά + accusative ielezwe kama kusudi/manufaa au sababu
  choice: kwa ajili ya
  alternative: kwa sababu ya
  rationale: Muktadha wa hoja ya uumbaji unaruhusu mwelekeo wa kusudi au manufaa, lakini sarufi pia inaweza kuonyesha sababu. Matini kuu inatumia usemi wa asili “kwa ajili ya,” na tanbihi inahifadhi maana mbadala badala ya kutatua utata kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Muundo sambamba wa vifungu viwili umehifadhiwa, na “bali” imetumiwa kuonyesha utofautishaji baada ya kauli hasi.
