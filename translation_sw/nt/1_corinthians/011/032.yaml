review_pass:
  verdict: revise
  source_fidelity: The temporal passive participle κρινόμενοι is well represented by “tunapohukumiwa,” and the agency “na Bwana” is accurate. However, “tunarudiwa” usually means being rebuked/corrected and is narrower than παιδευόμεθα, which denotes corrective discipline or training. The final κατακριθῶμεν should be distinguished from the preceding κρινόμενοι more explicitly as adverse condemnation/guilt.
  naturalness: “Tunatiwa nidhamu” is natural, current Standard East African Swahili for corrective discipline. “Tusije tukahukumiwa kuwa na hatia” is an idiomatic judicial expression and makes the contrast with the earlier, corrective judgment clear without overexplaining it.
  terminology: “Bwana,” “nidhamu,” and “ulimwengu” are appropriate in register and theological usage. The revised final clause preserves the source’s distinction between present judgment and condemnation without imposing a doctrinal system.
  issues:
  - severity: medium
    issue: “Tunarudiwa” is too narrow for παιδευόμεθα.
    rationale: The Greek term includes corrective discipline/training, not merely verbal rebuke or correction. “Tunatiwa nidhamu” better conveys the remedial disciplinary sense.
  - severity: medium
    issue: “Tusihukumiwe” fails to adequately mark κατακριθῶμεν as distinct from κρινόμενοι.
    rationale: Both Greek verbs concern judgment, but κατακρίνω carries the stronger sense of condemnation/adverse verdict. Rendering it as being judged guilty retains this contrast in Swahili.
  revised_text: Lakini tunapohukumiwa na Bwana[a], tunatiwa nidhamu, ili tusije tukahukumiwa kuwa na hatia pamoja na ulimwengu.
