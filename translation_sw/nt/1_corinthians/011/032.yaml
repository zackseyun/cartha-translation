base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: sw
  text: Lakini tunapohukumiwa na Bwana[a], tunatiwa nidhamu, ili tusije tukahukumiwa kuwa na hatia pamoja na ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tunapokuwa tukihukumiwa na Bwana, tunatiwa nidhamu.” Maumbo ya wakati wa sasa katika Kigiriki yanaweza kusisitiza tendo linaloendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: tunapohukumiwa
  rationale: 'Kiambishi cha wakati wa sasa katika umbo la kutendwa kinaeleweka hapa kwa maana ya wakati: “tunapohukumiwa.” Neno hili linadumisha maana ya kutoa hukumu bila kulifanya liwe sawa na hukumu ya mwisho inayotajwa baadaye.'
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha utofauti mpole na onyo la mstari uliotangulia; “Lakini” linaweka utofauti huo wazi na kwa lugha ya kawaida.
- source_word: ὑπὸ κυρίου
  choice: na Bwana
  rationale: ὑπό pamoja na hali ya umilikishi humtaja mtendaji. “Bwana” linadumisha jina la cheo katika maandishi bila kuongeza “Yesu,” ambalo halipo wazi katika kifungu hiki.
- source_word: παιδευόμεθα
  choice: tunarudiwa
  rationale: Katika muktadha huu neno linamaanisha kurekebishwa kwa njia ya nidhamu, si kuadhibiwa tu. “Tunarudiwa” ni Kiswahili cha kawaida kinachoonyesha hatua ya kusahihisha tabia, ingawa wazo pana la kufundishwa kwa nidhamu pia limo.
- source_word: ἵνα μὴ
  choice: ili tusi-
  rationale: “Ili” linadumisha maana ya kusudi au matokeo yaliyokusudiwa, huku ukanushi ukiunganishwa kiasili na kitenzi cha Kiswahili.
- source_word: σὺν τῷ κόσμῳ
  choice: pamoja na ulimwengu
  rationale: “Pamoja na” linaonyesha kushiriki hatima moja. “Ulimwengu” linadumisha usemi wa jumla wa Kigiriki bila kuufafanua zaidi kimafundisho.
- source_word: κατακριθῶμεν
  choice: tusihukumiwe
  rationale: Katika Kiswahili, “hukumiwa” kwa kawaida linaweza kumaanisha kutolewa hukumu ya hatia. Muktadha na utofauti na “tunapohukumiwa” unaonyesha kuwa hapa ni hukumu mbaya ya mwisho; tanbihi inalinda utofauti huo wa kileksia.
theological_decisions:
- issue: Uhusiano kati ya hukumu ya sasa ya Bwana na hukumu pamoja na ulimwengu
  choice: Maandishi yanaonyesha kuwa hukumu ya Bwana inafanya kazi ya kurekebisha sasa, kwa kusudi la kuzuia kuhukumiwa pamoja na ulimwengu.
  alternative: Inaweza kueleweka kwa upana zaidi kuwa adhabu ya muda bila kufafanua tofauti ya waamini na wasioamini.
  rationale: Utofauti kati ya κρινόμενοι na κατακριθῶμεν, pamoja na παιδευόμεθα na kishazi cha kusudi ἵνα μὴ, unaonyesha tofauti kati ya nidhamu ya kurekebisha na hukumu ya hatia. Tafsiri haiongezi mfumo wa mafundisho kuhusu ustahimilivu wa waamini au athari za Meza ya Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Tunarudiwa” limetumiwa kwa maana ya kupewa nidhamu ya kurekebisha; muundo ni rahisi kueleweka huku ukidumisha tofauti yenye mvutano kati ya kuhukumiwa sasa na kuhukumiwa pamoja na ulimwengu.
