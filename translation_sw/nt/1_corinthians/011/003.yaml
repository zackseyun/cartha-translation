reference: 1 Corinthians 11:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: sw
  text: Lakini nataka mjue kwamba kichwa[a] cha kila mwanamume ni Masihi, na kichwa cha mwanamke ni mwanamume[b], na kichwa cha Masihi ni Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, neno “kichwa” linaweza kueleweka kuwa “chanzo” au “mamlaka juu ya mwingine”; sitiari ya Kigiriki imehifadhiwa katika matini kuu.
    reason: lexical_alternative
  - marker: b
    text: Maneno “mwanamke” na “mwanamume” hapa yanaweza pia kueleweka kuwa “mke” na “mume.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: nataka
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaoonyesha kusudi la Paulo katika wakati wa sasa.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye tofauti ndogo na maelezo yaliyotangulia.
- source_word: ὑμᾶς εἰδέναι
  choice: mjue
  rationale: Inawasilisha kwa ufupi na kwa kawaida maana ya kutaka wasikilizaji wajue jambo.
- source_word: παντὸς ἀνδρὸς
  choice: kila mwanamume
  rationale: ἀνήρ inaweza kumaanisha mwanamume au mume; hapa usemi mpana umewekwa katika matini kuu huku maana ya kindoa ikitajwa katika tanbihi.
- source_word: κεφαλή
  choice: kichwa
  rationale: Huhifadhi sitiari ya Kigiriki bila kuamua kimya-kimya ikiwa maana ni chanzo au mamlaka juu ya mwingine.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; ‘Masihi’ huhifadhi maana hiyo kwa Kiswahili cha kawaida cha Biblia.
- source_word: γυναικός
  choice: mwanamke
  rationale: γυνή inaweza kumaanisha mwanamke au mke. Maana ya jumla imechaguliwa katika matini, na maana ya kindoa imehifadhiwa katika tanbihi.
- source_word: ὁ ἀνήρ
  choice: mwanamume
  rationale: Huhifadhi ulinganifu na ‘mwanamke’ na utata wa kimsingi wa maneno ya Kigiriki; ‘mume’ ni uwezekano unaotajwa katika tanbihi.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya θεός.
theological_decisions:
- issue: Maana ya κεφαλή katika vifungu vitatu vinavyolingana
  choice: Kuhifadhi sitiari kama ‘kichwa’ katika matini kuu.
  alternative: ‘chanzo’ au ‘mwenye mamlaka juu ya’
  rationale: Maana ya sitiari hii inabishaniwa. Kutumia ‘kichwa’ huhifadhi mvutano wa kiteolojia wa matini bila kuamua tafsiri fulani.
- issue: Ikiwa ἀνήρ na γυνή hapa ni mwanamume/mwanamke au mume/mke
  choice: ‘mwanamume’ na ‘mwanamke’ katika matini kuu
  alternative: ‘mume’ na ‘mke’
  rationale: Muundo wa vifungu sambamba unaunga mkono usomaji wa jumla, lakini muktadha na upeo wa maana wa nomino hizo huruhusu pia usomaji wa kindoa.
- issue: Uhusiano unaosemwa katika kifungu cha mwisho
  choice: ‘kichwa cha Masihi ni Mungu’ bila ufafanuzi wa ziada
  alternative: Maelezo ya kufasiri yanayobainisha tu mpangilio wa kiutendaji
  rationale: Tafsiri inaacha dai hilo kama lilivyoandikwa na haiingizi maelezo ya kimadhehebu wala kudhoofisha kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa vifungu vitatu sambamba umehifadhiwa, pamoja na sitiari na utata wa kimsingi wa maneno.
