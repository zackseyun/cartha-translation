id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: sw
  text: Vivyo hivyo, baada ya kula, alichukua kikombe, akisema, “Kikombe hiki ni agano[a] jipya katika damu yangu. Endeleeni kufanya hivi kila mnapokinywa,[b] kwa kunikumbuka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “agano” linaweza pia kumaanisha “wosia,” lakini “agano” linaafiki zaidi msingi wa kibiblia hapa.
    reason: alternative_reading
  - marker: b
    text: Au, “kila mara mnapokunywa.” Kauli ya Kigiriki inaonyesha matukio yanayorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Vivyo hivyo
  rationale: Huonyesha ulinganifu na tendo lililotangulia kuhusu mkate; Kiswahili cha kawaida hakihitaji kuongeza neno linalolingana na καί kwa namna isiyo ya asili.
- source_word: ποτήριον
  choice: kikombe
  rationale: Ni maana ya kawaida na ya moja kwa moja, bila kuingiza istilahi maalumu ya kiliturujia.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: baada ya kula
  rationale: Muundo huu unaonyesha wakati baada ya mlo. Tafsiri hii ni ya asili na haibainishi bila lazima ikiwa ulikuwa mlo wa jioni.
- source_word: λέγων
  choice: alichukua kikombe, akisema
  rationale: Neno lenyewe ni ‘akisema’; kitendo cha kuchukua kikombe, kinachoeleweka kutokana na ulinganifu wa mstari uliotangulia, kimewekwa wazi ili sentensi iwe kamili na ya asili kwa Kiswahili.
- source_word: ἡ καινὴ διαθήκη
  choice: agano jipya
  rationale: ‘Agano’ linaafiki msingi wa Maandiko ya Kiebrania na wazo la agano lililowekwa kwa damu; halileti maana finyu ya wosia.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: katika damu yangu
  rationale: Huhifadhi kihusishi na kauli ya Kigiriki bila kuamua ikiwa maana ni ‘kwa damu yangu’ au ‘kupitia damu yangu.’
- source_word: τοῦτο ποιεῖτε
  choice: Endeleeni kufanya hivi
  rationale: Amri ya wakati uliopo pamoja na kifungu kinachofuata inaelekeza kwenye tendo linalorudiwa.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: kila mnapokinywa
  rationale: Huwasilisha hali ya matukio yanayorudiwa; kiambishi ‘-ki-’ kinarejelea kikombe na kufanya Kiswahili kiwe cha asili.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: kwa kunikumbuka
  rationale: Huwasilisha tendo hai la kumkumbuka Yesu kwa lugha wazi na ya kawaida.
theological_decisions:
- issue: Maana ya διαθήκη katika kauli kuhusu kikombe
  choice: agano
  alternative: wosia
  rationale: Muktadha wa damu inayoweka agano na msingi wa Agano la Kale unaunga mkono ‘agano’; ‘wosia’ ungeelekeza kwa urahisi kwenye dhana tofauti katika Kiswahili cha sasa.
- issue: Uhusiano wa kikombe na agano
  choice: Kikombe hiki ni agano jipya katika damu yangu
  alternative: Kikombe hiki kinawakilisha agano jipya lililothibitishwa kwa damu yangu
  rationale: Kauli ya utambulisho ya chanzo imehifadhiwa bila kuibadili kuwa maelezo ya kiishara au ya kisakramenti, hivyo mvutano wa kiteolojia unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa moja kwa moja wa kauli kuhusu kikombe umehifadhiwa bila kuingiza msimamo wa dhehebu.
