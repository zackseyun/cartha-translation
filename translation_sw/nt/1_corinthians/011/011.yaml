  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: sw
  text: Hata hivyo, katika Bwana, mwanamke[a] si bila mwanamume, wala mwanamume si bila mwanamke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke si bila mume, wala mume si bila mke.” Maneno ya Kiyunani yanaweza kumaanisha mwanamke/mwanamume au mke/mume; maana pana imetumiwa katika matini kwa sababu kauli hii inaonekana kuwa ya jumla, si ya ndoa pekee.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Hata hivyo
  rationale: Inaonyesha badiliko la kusawazisha au kuweka mpaka kwa hoja iliyotangulia, bila kuifuta.
- source_word: γυνή
  choice: mwanamke
  rationale: Neno la Kiyunani linaweza kumaanisha ‘mwanamke’ au ‘mke’; hapa kauli ya jumla kuhusu uhusiano wa pande hizi mbili katika Bwana inapendelea maana pana ya ‘mwanamke’.
- source_word: ἀνήρ
  choice: mwanamume
  rationale: Neno la Kiyunani linaweza kumaanisha ‘mwanamume’ au ‘mume’; muktadha wa uumbaji na ibada unapendelea maana pana ya ‘mwanamume’.
- source_word: χωρὶς
  choice: hayuko pasipo
  rationale: Usemi huu unahifadhi wazo la kutokuwa kando au kujitenga, bila kuongeza dai lenye nguvu zaidi la kutoweza kuishi au kutokuwa na thamani.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Ni usemi wa kawaida wa Paulo unaoonyesha uwanja au uhusiano unaotawaliwa na Bwana; tafsiri ya moja kwa moja ni ya asili na inahifadhi uzito wake wa kiteolojia.
- source_word: οὔτε ... οὔτε
  choice: hayuko ... wala ... hayuko
  rationale: Muundo huu unahifadhi ukanushi sawia wa vifungu viwili na urari wa kauli ya Kiyunani.
theological_decisions:
- issue: Iwapo γυνή / ἀνήρ yatafsiriwe ‘mwanamke/mwanamume’ au ‘mke/mume’
  choice: mwanamke/mwanamume
  alternative: mke/mume
  rationale: Muktadha wa karibu unazungumzia mwanamume na mwanamke katika uumbaji na ibada, na mstari huu unasawazisha hoja kwa kauli ya jumla kuhusu uhusiano wao. Tanbihi inahifadhi uwezekano halisi wa maana ya kindoa.
- issue: Maana ya χωρὶς katika uhusiano wao
  choice: hayuko pasipo
  alternative: hajitegemei bila
  rationale: ‘Hayuko pasipo’ huhifadhi maana ya kutengana au kuwa mbali bila kuamua kimyakimya kwamba Paulo anazungumzia hasa uhuru, utegemezi, au uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo sawia wa vifungu viwili umehifadhiwa, na ‘katika Bwana’ limeachwa kama tamko lenye uzito wa Paulo bila kulifafanua kupita kiasi.
