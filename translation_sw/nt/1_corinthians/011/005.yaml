  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: sw
  text: Lakini kila mwanamke anayesali au kunena unabii, kichwa chake kikiwa hakijafunikwa[b], analiletea kichwa chake[a] aibu; kwa maana ni sawa kabisa na mwanamke aliyenyolewa kichwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mke anayesali au kunena unabii ... analiletea kichwa chake/mume wake aibu.” Neno la Kigiriki gynē linaweza kumaanisha “mwanamke” au “mke,” na “kichwa” kinaweza kueleweka kihalisi au kwa maana ya mfano kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: “Hakijafunikwa” halibainishi lenyewe aina hasa ya kifuniko; kuna maoni tofauti kuhusu kama Paulo anazungumzia utaji hasa au kichwa kisichofunikwa kwa maana ya jumla zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mwanamke
  rationale: Neno hili linaweza kumaanisha “mwanamke” au “mke.” Katika sentensi hii matumizi ya jumla, “kila mwanamke,” ndiyo maana ya moja kwa moja zaidi; uwezekano wa “mke” umehifadhiwa katika tanbihi.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: anayesali au kutoa unabii
  rationale: Vitenzi-shirikishi vya wakati uliopo vinaonyesha mwanamke akiwa katika matendo hayo. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi maana ya tendo linaloendelea.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: akiwa hajafunika kichwa chake
  rationale: Kirai kinaeleza hali ya kichwa kutofunikwa bila kutaja kifuniko ni cha aina gani. Tafsiri hii ni ya kawaida na haiongezi wazo la utaji, nywele, au kifuniko kingine maalumu.
- source_word: καταισχύνει
  choice: anakiaibisha
  rationale: Kitenzi kina maana ya kuleta aibu au fedheha. “Anakiaibisha” kinaeleweka kwa urahisi na kinafaa katika muktadha wa heshima na aibu.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: kichwa chake
  rationale: Hii ndiyo tafsiri ya moja kwa moja, nayo huhifadhi uwezekano wa kuelewa kichwa kihalisi au, kwa kuzingatia muktadha, kwa maana ya kimahusiano.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: kwa maana ni sawa kabisa
  rationale: Usemi wa Kigiriki unasisitiza usawa wa mambo hayo. “Ni sawa kabisa” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: τῇ ἐξυρημένῃ
  choice: na mwanamke aliyenyolewa kichwa
  rationale: Kitenzi-shirikishi timilifu huonyesha hali iliyotokana na kunyoa. Kutaja mwanamke na kichwa kwa wazi kunafanya sentensi iwe ya asili katika Kiswahili bila kubadili picha ya msingi.
theological_decisions:
- issue: Maana ya “kichwa” cha pili katika “anakiaibisha kichwa chake”
  choice: Kudumisha maneno “kichwa chake” bila kuamua kama ni kichwa halisi au kichwa kwa maana ya kimahusiano.
  alternative: Kichwa chake halisi; au kichwa chake kwa maana ya mfano, yaani mume/mwanamume katika hoja ya kifungu.
  rationale: Maneno ya Kigiriki yanaruhusu maana ya moja kwa moja, lakini muktadha mpana unaleta uwezekano wa maana ya mfano. Tafsiri haipaswi kutatua kimya-kimya utata huo.
- issue: Aina ya kifuniko kinachodokezwa na “hajafunika”
  choice: Kutotaja kifuniko maalumu.
  alternative: Bila utaji; au akiwa na nywele zisizofunikwa au zilizoachwa wazi.
  rationale: Kivumishi cha Kigiriki kinaonyesha kutofunikwa, lakini hakibainishi chenyewe kifuniko hicho ni nini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeepuka istilahi za dhehebu na umehifadhi utata wa “mwanamke/mke,” “kichwa,” na aina ya kifuniko.
