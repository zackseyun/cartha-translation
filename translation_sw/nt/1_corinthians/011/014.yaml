  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: sw
  text: Je, hata maumbile yenyewe hayawafundishi kwamba mwanamume akiwa na nywele ndefu[a], ni aibu kwake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akifuga nywele ndefu,” au “akiwa ameachia nywele zake zikue ndefu.” Kitenzi cha Kigiriki kinamaanisha kuwa na au kufuga nywele ndefu.
    reason: lexical_alternative
  - marker: b
    text: “Maumbile yenyewe” yanaweza kumaanisha utaratibu wa uumbaji, ufahamu wa kawaida wa wanadamu, au jambo ambalo utamaduni huliona kuwa linafaa kiasili; Kigiriki hakibainishi maana hiyo kwa usahihi zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Je, hata ... haya-?
  rationale: Muundo wa swali la balagha pamoja na «hata» unahifadhi ukanushi na msisitizo wa neno la Kigiriki.
- source_word: ἡ φύσις αὐτὴ
  choice: maumbile yenyewe
  rationale: «Yenyewe» linahifadhi msisitizo wa αὐτή, huku «maumbile» likiacha maana ya φύσις ikiwa pana badala ya kuifungia kwenye biolojia au desturi pekee.
- source_word: διδάσκει ὑμᾶς
  choice: hayawafundishi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi pamoja na yambwa ya wingi.
- source_word: ἀνὴρ
  choice: mwanamume
  rationale: Muktadha unahusu jinsia ya kiume, si hasa mume.
- source_word: μέν
  choice: —
  rationale: Neno hili linaashiria sehemu ya kwanza ya ulinganisho unaoendelea katika mstari unaofuata; Kiswahili cha kawaida hakihitaji kionyeshwe wazi hapa.
- source_word: ἐὰν κομᾷ
  choice: akiwa na nywele ndefu
  rationale: Maneno haya yanaeleza kuwa na au kufuga nywele ndefu; chaguo hili ni la kawaida na haliongezi wazo lisilokuwamo la mtindo maalumu.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: ni aibu kwake
  rationale: «Aibu» linafikisha wazo la kukosa heshima au fedheha katika Kiswahili cha asili, na «kwake» linahifadhi uhusiano wa kidativu.
theological_decisions:
- issue: Maana ya φύσις katika hoja ya Paulo
  choice: maumbile yenyewe
  alternative: utaratibu wa uumbaji; ufahamu wa kawaida wa binadamu; jambo linaloonwa na jamii kuwa linafaa kiasili
  rationale: Neno la Kigiriki halibainishi hapa ni maana ipi kati ya hizi inayokusudiwa. Tafsiri inaacha mvutano huo wazi badala ya kuamua tafsiri maalumu ya kitheolojia au kitamaduni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Swali la balagha limehifadhiwa, na alama zote za tanbihi zimo katika matini kuu.
