  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: sw
  text: Kwa maana kama vile mwanamke alitoka kwa mwanamume[a], vivyo hivyo mwanamume hutokea kupitia kwa mwanamke; lakini vitu vyote hutoka kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mke alitoka kwa mume,” ikiwa muktadha unaeleweka kwa maana finyu zaidi ya uhusiano wa ndoa badala ya uhusiano wa jumla kati ya mwanamke na mwanamume.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: Inahifadhi kazi ya γάρ ya kutoa sababu na muundo wa ulinganisho unaoanzishwa na ὥσπερ.
- source_word: ἡ γυνὴ
  choice: mwanamke
  rationale: Katika muktadha huu γυνή ina maana ya jumla ya mwanamke, ingawa inaweza pia kumaanisha mke.
- source_word: ἐκ τοῦ ἀνδρός
  choice: alitoka kwa mwanamume
  rationale: ἐκ huonyesha chanzo au asili; wakati uliopita unafanya rejeo la uumbaji lieleweke kwa Kiswahili bila kupoteza maana ya asili.
- source_word: ὁ ἀνὴρ
  choice: mwanamume
  rationale: Maana ya jumla ya mwanamume inalingana na matumizi ya γυνή na upeo wa hoja kuhusu uumbaji na kuzaliwa.
- source_word: διὰ τῆς γυναικός
  choice: huzaliwa kupitia kwa mwanamke
  rationale: διά pamoja na jenitivi huonyesha njia au uhusika. Kitenzi 'huzaliwa' kinaweka wazi maana iliyodokezwa ya mwanamume kuja ulimwenguni kupitia mwanamke, huku 'kupitia kwa' kikihifadhi tofauti na ἐκ.
- source_word: τὰ δὲ πάντα
  choice: lakini vitu vyote
  rationale: δέ inaashiria tofauti nyepesi au badiliko la hoja, na 'lakini' linaonyesha hatua ya kuelekea kwenye chanzo cha mwisho.
- source_word: ἐκ τοῦ θεοῦ
  choice: hutoka kwa Mungu
  rationale: Inahifadhi wazo la chanzo au asili linaloonyeshwa na ἐκ na tamko la kilele kwamba Mungu ndiye chanzo cha yote.
theological_decisions:
- issue: Maana ya γυνή na ἀνήρ
  choice: mwanamke na mwanamume kwa maana ya jumla
  alternative: mke na mume
  rationale: Hoja inahusisha asili ya mwanamke katika uumbaji na kuzaliwa kwa mwanamume kupitia mwanamke, hivyo upeo wake ni mpana kuliko ndoa pekee.
- issue: Tofauti kati ya ἐκ na διά
  choice: alitoka kwa / kupitia kwa
  alternative: kutafsiri zote mbili kwa neno lilelile la chanzo
  rationale: Tofauti hiyo inadumisha uwiano wa Paulo kati ya asili ya mwanamke kutoka kwa mwanamume katika uumbaji na kuzaliwa kwa mwanamume kupitia mwanamke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mwanamume' na 'mwanamke' ni wazi kwa wasomaji wa kawaida; muundo wa sentensi unadumisha ulinganisho, uwiano, na tamko la mwisho kuhusu Mungu.
