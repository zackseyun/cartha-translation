  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: sw
  text: Kwa maana mwanamume hakutokana na mwanamke,[a] bali mwanamke alitokana na mwanamume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana mume hakutokana na mke, bali mke alitokana na mume.” Maneno ya Kigiriki yanaweza kumaanisha ama “mwanamume/mwanamke” au “mume/mke”; hapa maana pana inayohusu uumbaji imepewa uzito.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi au ufafanuzi wa kauli iliyotangulia; “Kwa maana” ni cha kawaida na chenye hadhi katika hoja hii.
- source_word: ἀνὴρ / ἀνδρός
  choice: mwanamume
  rationale: Katika hoja inayorejelea uumbaji, neno hili linaeleweka kwa upana kuwa mwanamume, ingawa linaweza pia kumaanisha mume.
- source_word: γυναικός / γυνὴ
  choice: mwanamke
  rationale: Katika muktadha wa asili ya uumbaji, neno hili linamaanisha mwanamke kwa upana, ingawa linaweza pia kumaanisha mke.
- source_word: ἐκ / ἐξ
  choice: kutokana na
  rationale: Vihusishi hivi vinaonyesha chanzo au asili. “Kutokana na” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza tu mahali alipotoka.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” linaonyesha kwa wazi utofautishaji mkali kati ya vishazi viwili.
- source_word: ἐστιν
  choice: hakutokana / alitokana
  rationale: Kitenzi cha Kigiriki pamoja na kishazi cha chanzo kimewasilishwa kwa vitenzi vya wakati uliopita vinavyofaa simulizi la uumbaji na Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo ἀνήρ/γυνή yatafsiriwe “mwanamume/mwanamke” au “mume/mke”
  choice: mwanamume/mwanamke
  alternative: mume/mke
  rationale: Hoja ya Paulo kuhusu chanzo inaelekeza kwenye simulizi la uumbaji, hivyo maana pana ya mwanamume na mwanamke imepewa uzito. Tanbihi inadumisha uwezekano halisi wa maana ya mume na mke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hakutokana na ... bali ... alitokana na” ni wa asili katika Kiswahili na unaweka wazi uhusiano wa chanzo huku ukihifadhi utofautishaji wa Kigiriki.
