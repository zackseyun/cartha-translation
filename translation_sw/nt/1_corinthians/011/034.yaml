  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: sw
  text: Kama mtu yeyote ana njaa, ale nyumbani, ili msije mkakusanyika kwa hukumu.[a] Mambo mengine nitatoa maelekezo nitakapokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kuhukumiwa” au “kwa hukumu ya adhabu.” Neno la Kigiriki κρίμα linaweza kumaanisha “hukumu” au “kuhukumiwa.” Hapa “hukumu” inafaa zaidi katika muktadha wa karibu, ambapo Paulo anazungumzia hukumu na nidhamu ya sasa ya Bwana, akiitofautisha na kuhukumiwa pamoja na ulimwengu (aya 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: ana njaa
  rationale: Ni hali ya sasa, na ‘ana njaa’ ni Kiswahili cha kawaida na cha asili.
- source_word: ἐν οἴκῳ
  choice: nyumbani
  rationale: Hurejelea kula katika mazingira ya nyumbani badala ya kula katika kusanyiko la kanisa.
- source_word: ἐσθιέτω
  choice: ale
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu katika Kiswahili cha kawaida.
- source_word: εἰς κρίμα
  choice: kwa hukumu
  rationale: ‘Hukumu’ huhifadhi upana wa κρίμα bila kuifanya kwa lazima kuwa hukumu ya mwisho ya adhabu.
- source_word: συνέρχησθε
  choice: mkakusanyika
  rationale: Huhifadhi wazo la kukutana pamoja na uhusiano wa kitenzi hiki na matumizi yake katika muktadha unaozunguka.
- source_word: Τὰ δὲ λοιπὰ
  choice: Mambo mengine
  rationale: Ni mpito wa asili unaoonyesha masuala yaliyobaki ambayo Paulo atayashughulikia baadaye.
- source_word: ὡς ἂν ἔλθω
  choice: nitakapokuja
  rationale: Huwasilisha wakati wa baadaye unaotarajiwa wa ziara ya Paulo kwa Kiswahili cha asili.
- source_word: διατάξομαι
  choice: nitayapangilia
  rationale: Huwasilisha maana ya kupanga au kuweka maelekezo kuhusu mambo yaliyobaki, bila kuzidisha ubainifu wa kitenzi.
theological_decisions:
- issue: Maana ya κρίμα katika onyo kuhusu kusanyiko la Meza ya Bwana
  choice: hukumu, huku ikiacha wazi aina yake
  alternative: adhabu ya hukumu
  rationale: Muktadha wa karibu (aya 29–32) unazungumzia hukumu na nidhamu ya Bwana na kuitofautisha na kuhukumiwa pamoja na ulimwengu. ‘Hukumu’ huhifadhi uzito na pia utata halisi wa neno.
- issue: τις ya umoja pamoja na amri ya nafsi ya tatu
  choice: mtu yeyote ... ale
  alternative: yeyote ... wale
  rationale: Kiswahili hutumia ‘mtu yeyote ... ale’ kwa kawaida na kwa ujumuishi bila kuingiza jinsia ambayo Kigiriki haijaitaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Msije mkakusanyika’ ni ujenzi wa kawaida wa kusudi hasi unaohifadhi maana ya ἵνα μή. Alama ya tanbihi imewekwa baada ya ‘hukumu,’ neno linalofafanuliwa.
