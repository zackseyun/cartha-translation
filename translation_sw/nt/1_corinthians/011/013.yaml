lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: Jihukumuni wenyewe
  rationale: Kirai hiki kinakazia kwamba Wakorintho wenyewe wanapaswa kutathmini jambo hilo. Muundo wa Kiswahili wa kujirejelea unaonyesha mkazo huo kwa lugha ya kawaida.
- source_word: κρίνατε
  choice: Jihukumuni
  rationale: Ni amri ya kutathmini au kutoa uamuzi. Katika muktadha huu, “Jihukumuni wenyewe” ni mwito wa moja kwa moja kwa wasikilizaji wafikie uamuzi wao wenyewe.
- source_word: πρέπον ἐστὶν
  choice: Je, inafaa
  rationale: Huwasilisha swali kuhusu jambo linalofaa kijamii au kimaadili kwa Kiswahili cha sasa na cha kawaida.
- source_word: γυναῖκα
  choice: mwanamke
  rationale: γυνή inaweza kumaanisha “mwanamke” au “mke.” Aya hii haimtaji mume waziwazi na swali limewekwa kwa namna ya jumla, hivyo “mwanamke” linafaa katika matini kuu; maana ya “mke” imehifadhiwa katika tanbihi.
- source_word: ἀκατακάλυπτον
  choice: bila kufunika kichwa chake
  rationale: Neno hili humaanisha kuwa bila kifuniko. Muktadha wa karibu unahusu kufunikwa kwa kichwa, kwa hiyo kitu kinachodokezwa kimetajwa wazi ili Kiswahili kiwe cha kawaida na kisicho na utata usio wa lazima.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Dativi pamoja na προσεύχομαι humtaja anayeelekezewa sala. Katika Kiswahili, “kusali kwa Mungu” ni usemi wa kawaida unaoonyesha kwamba Mungu ndiye anayeelekezewa sala.
- source_word: προσεύχεσθαι
  choice: kusali
  rationale: Ni kitenzi-jina kinachomaanisha kuomba au kusali. “Kusali” kinafaa katika swali hili na kinaeleweka kwa upana katika Kiswahili sanifu.
theological_decisions:
- issue: Maana ya γυνή katika mjadala kuhusu kufunika kichwa
  choice: mwanamke
  alternative: mke
  rationale: Aya yenyewe haimtaji mume, na swali linaelekea kutolewa kwa namna ya jumla. Ili kutoingiza maana finyu ya kindoa isiyolazimishwa na aya hii peke yake, matini kuu inatumia “mwanamke,” huku “mke” ikihifadhiwa kama uwezekano wa kimuktadha katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na mkazo wa waamini kujitathmini wenyewe vimehifadhiwa.
