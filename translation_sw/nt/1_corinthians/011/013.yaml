review_pass:
  verdict: revise
  source_fidelity: The rhetorical imperative κρίνατε is addressed to the audience, calling on them to make an evaluation. “Jihukumuni” means ‘judge yourselves’ and wrongly makes the audience the object of judgment. “Hukumuni ninyi wenyewe” preserves both the imperative and the emphatic reflexive phrase ἐν ὑμῖν αὐτοῖς. The wording for the uncovered condition is adjusted to express a state in the immediate head-covering context.
  naturalness: The revised wording is standard, clear East African Swahili. “Hukumuni ninyi wenyewe” naturally introduces the rhetorical question, and “akiwa hajafunika kichwa chake” is idiomatic in this context.
  terminology: “Mwanamke” appropriately retains the generic default sense of γυνή, while the footnote responsibly preserves the viable contextual sense ‘mke.’ “Kusali kwa Mungu” is suitable and understandable standard usage for praying to God.
  issues:
  - severity: high
    issue: “Jihukumuni wenyewe” mistranslates the force and relation of κρίνατε with ἐν ὑμῖν αὐτοῖς.
    rationale: In Swahili, -jihukumu means to judge oneself, whereas Paul asks the Corinthians to judge/evaluate for themselves. The reflexive emphasis belongs to the judging audience, not to the object of judgment.
  - severity: low
    issue: “bila kufunika kichwa chake” can be read as describing the act of failing to cover rather than the source adjective’s state ‘uncovered.’
    rationale: The revision uses a more natural contextual construction while retaining the intended head-related state.
