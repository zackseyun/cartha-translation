  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: sw
  text: 'Kwa maana mimi nilipokea kutoka kwa Bwana yale niliyowakabidhi ninyi pia: kwamba Bwana Yesu, usiku ule alipokuwa akikabidhiwa[a], alitwaa mkate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kimapokeo, “usiku ule aliposalitiwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: nilipokea
  rationale: Kitenzi hiki kinaonyesha Paulo kupokea mapokeo au mafundisho; ‘nilipokea’ ni Kiswahili cha kawaida na kinadumisha uhusiano wake na παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: kutoka kwa Bwana
  rationale: Kirai hiki kinaonyesha chanzo bila kuongeza ‘Yesu,’ kwa kuwa sentensi inayofuata inamtambulisha kuwa Bwana Yesu.
- source_word: παρέδωκα
  choice: niliyowakabidhi
  rationale: ‘Kukabidhi’ linafaa kwa kupitisha kwa wengine yale yaliyopokelewa na pia linahifadhi mwangwi wa mzizi uleule unaotokea tena katika παρεδίδετο.
- source_word: ὅτι
  choice: kwamba
  rationale: Linaanzisha maudhui ya yale ambayo Paulo aliwakabidhi.
- source_word: κύριος
  choice: Bwana
  rationale: ‘Bwana’ linahifadhi maana ya heshima na uzito wa kimasiha wa κύριος katika muktadha huu.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: usiku ule
  rationale: Ni usemi wa asili wa Kiswahili unaounganishwa moja kwa moja na kishazi ‘alipokuwa akikabidhiwa.’
- source_word: παρεδίδετο
  choice: alipokuwa akikabidhiwa
  rationale: Kauli tendwa ya wakati usiotimilika inahifadhi tendo lililokuwa likiendelea na upana wa maana ya kukabidhiwa au kutiwa mikononi mwa wengine, bila kulibana kuwa usaliti pekee.
- source_word: ἔλαβεν ἄρτον
  choice: alitwaa mkate
  rationale: ‘Alitwaa mkate’ ni usemi wa kawaida, wenye heshima, na unaolingana na simulizi la kuanzishwa kwa Meza ya Bwana bila kulazimisha maana ya ‘mkate mmoja mzima.’
theological_decisions:
- issue: Tafsiri ya παρεδίδετο katika simulizi la kuanzishwa kwa Meza ya Bwana
  choice: alipokuwa akikabidhiwa
  alternative: aliposalitiwa
  rationale: Kitenzi παραδίδωμι kinaweza kumaanisha kukabidhi, kutia mikononi mwa mwingine, au kusaliti kulingana na muktadha. Tafsiri kuu inadumisha upana na mvutano wa kifungu; tafsiri ya kimapokeo yenye maana ya usaliti imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘kupokea/kukabidhi’ umehifadhiwa, na ‘alitwaa mkate’ limetumiwa kwa sauti ya kawaida lakini inayofaa kwa kifungu cha kiliturujia.
