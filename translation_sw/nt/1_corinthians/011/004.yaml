  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: sw
  text: Kila mwanamume anayesali au kutoa unabii akiwa na kitu kichwani[a] anatia aibu kichwa chake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyozoeleka zaidi, “akiwa amefunika kichwa chake.” Kigiriki husema kwa halisi, “akiwa na kitu kuhusiana na kichwa,” lakini hakitaji kitu hicho ni nini wala aina ya kifuniko.
    reason: lexical_alternative
  - marker: b
    text: “Kichwa chake” kinaweza kumaanisha kichwa chake halisi, huku pia kikitoa mwangwi wa matumizi ya kimahusiano ya neno “kichwa” katika muktadha unaozunguka.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Kila mwanamume
  rationale: ἀνήρ inaweza kumaanisha mwanamume au mume kutegemea muktadha. Hapa kauli ya jumla inaendana na “kila mwanamke” katika mstari unaofuata; “mwanamume” huhifadhi jinsia iliyotajwa bila kuingiza mapema maana ya ndoa.
- source_word: προσευχόμενος
  choice: anayesali
  rationale: Kitenzi-jina cha wakati uliopo humwonyesha mwanamume akiwa katika tendo la kusali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἢ προφητεύων
  choice: au kutoa unabii
  rationale: Muundo huu unaonyesha tendo la kunena ujumbe wa kinabii na ni Kiswahili cha kawaida kinachoeleweka, bila kufafanua zaidi ya Kigiriki.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: akiwa na kitu kichwani
  rationale: Kirai cha Kigiriki kwa halisi hudokeza kuwa na kitu juu ya kichwa au kikining’inia kutoka kichwani, lakini hakitaji kitu hicho ni nini. Tafsiri hii huhifadhi kutotajwa huko badala ya kuongeza pazia au kifuniko fulani.
- source_word: καταισχύνει
  choice: anakivunjia heshima
  rationale: Kitenzi kina maana ya kuaibisha au kutoheshimu. “Kukivunjia heshima” kinafaa kwa uhusiano wa heshima na aibu katika muktadha na huungana kwa kawaida na “kichwa chake.”
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kichwa chake
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano wa kichwa halisi pamoja na mwangwi wa matumizi ya kimahusiano ya “kichwa” katika muktadha unaozunguka.
theological_decisions:
- issue: Ikiwa κεφαλή katika kishazi cha mwisho lielezwe wazi kuwa kichwa halisi au “kichwa” cha kimahusiano
  choice: Kuhifadhi utata kwa “kichwa chake”
  alternative: “kichwa chake mwenyewe” au “yule aliye kichwa chake”
  rationale: 'Maneno ya Paulo yanaweza kufanya kazi katika viwango viwili: kichwa cha mwili na matumizi ya “kichwa” katika mstari wa 3. Matini kuu haipaswi kuamua jambo ambalo Kigiriki hakiamui wazi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutoa unabii” ni wazi kwa msomaji wa kawaida; “akiwa na kitu kichwani” huhifadhi kutobainishwa kwa kifuniko katika chanzo. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
