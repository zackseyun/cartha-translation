  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: sw
  text: Kwa hiyo, mnapokusanyika mahali pamoja, hamli Mlo wa Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si kula Mlo wa Bwana.” Kauli ya Kigiriki inaweza kudumisha muundo usio kamili; katika muktadha, mwenendo wao ulifanya mlo wao usihesabike kuwa Mlo wa Bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: mnapokusanyika
  rationale: Kirai cha wakati pamoja na ὑμῶν kina maana ya ‘mnapokusanyika’; uchaguzi huu ni wa kawaida na unadumisha wazo la kukutana kama jumuiya.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na karipio lililotangulia kuhusu migawanyiko.
- source_word: ἐπὶ τὸ αὐτό
  choice: mahali pamoja
  rationale: Nahau hii inaashiria kukusanyika katika mahali au mkutano mmoja; tafsiri hii inadumisha hali yake ya kimahali bila kurudia tu ‘kukusanyika.’
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: si kwa ajili ya kula
  rationale: Muundo wa Kigiriki ni mfupi na unaweza kueleweka kwa namna zaidi ya moja. Tafsiri hii inadumisha muundo wa kusudi huku ikionyesha kwamba mkusanyiko wao, kwa jinsi ulivyofanyika, haukutimiza kusudi la kula Mlo wa Bwana.
- source_word: κυριακὸν
  choice: wa Bwana
  rationale: Kivumishi hiki humaanisha kitu kilicho cha Bwana; ‘wa Bwana’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: δεῖπνον
  choice: Mlo
  rationale: Neno hilo humaanisha mlo mkuu, mara nyingi wa jioni. ‘Mlo’ linaeleweka katika Kiswahili cha sasa na huepuka kulazimisha wakati maalumu wa siku.
- source_word: κυριακὸν δεῖπνον
  choice: Mlo wa Bwana
  rationale: Hutoa kwa uwazi maana ya mlo ulio wa Bwana na ni usemi unaofaa katika muktadha wa ibada ya jumuiya.
theological_decisions:
- issue: Iwapo Paulo anakataa kabisa uwezekano wa kula mlo huo au anakataa kwamba walichokuwa wakifanya kilistahili kuitwa Mlo wa Bwana
  choice: Tafsiri kuu inadumisha kauli kwamba kusudi la kukusanyika kwao halikuwa kula Mlo wa Bwana, ikidokeza tathmini ya mwenendo wao.
  alternative: “Kwa hiyo, mnapokusanyika mahali pamoja, hamli Mlo wa Bwana.”
  rationale: Muktadha wa mistari 21–22 unakemea jinsi walivyokula kwa migawanyiko na ubinafsi. Muundo wa Kigiriki unaweza pia kusisitiza kwamba kwa sababu ya mwenendo huo, walichokula hakikustahili kuitwa Mlo wa Bwana; tanbihi inadumisha uwezekano huo bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mlo wa Bwana’ ni wazi kwa wasomaji wa kawaida, na tanbihi inadumisha utata halisi wa οὐκ ἔστιν ... φαγεῖν.
