  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: sw
  text: Naye, baada ya kutoa shukrani, akaumega, kisha akasema, “Huu ni mwili wangu, ulio kwa ajili yenu.[a] Endeleeni kufanya hivi kwa kunikumbuka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale huongeza “unaomegwa” baada ya “kwa ajili yenu”: “Huu ni mwili wangu, unaomegwa kwa ajili yenu.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: baada ya kushukuru
  rationale: Kauli hii ya wakati uliopita hutangulia kitendo kikuu; tafsiri hii inaonyesha kwa kawaida kwamba kushukuru kulitokea kabla ya kuumega.
- source_word: ἔκλασεν
  choice: akaumega
  rationale: Kitenzi humaanisha kuumega au kuvunja. Yambwa wake, yaani mkate, unaeleweka kutokana na muktadha wa mstari uliotangulia, hivyo hauhitaji kurudiwa.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Huu ni mwili wangu
  rationale: Muundo wa moja kwa moja wa kiunganishi umehifadhiwa. Kutafsiri kuwa ‘Huu unawakilisha mwili wangu’ kungeingiza ufafanuzi usiolazimishwa na Kigiriki.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: ulio kwa ajili yenu
  rationale: Ὑπέρ pamoja na hali ya umilikaji huonyesha manufaa au kutendewa kwa niaba ya wengine. ‘Kwa ajili yenu’ ni ya kawaida na haibani maana katika nadharia maalumu ya fidia.
- source_word: τοῦτο ποιεῖτε
  choice: Endeleeni kufanya hivi
  rationale: Amri ya wakati wa sasa katika muktadha huu inaelekea kuonyesha tendo la kurudiwa; ‘Endeleeni’ huonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: kwa kunikumbuka
  rationale: Ἀνάμνησις humaanisha tendo la kukumbuka au ukumbusho. Usemi huu ni wa kawaida na unaonyesha kusudi la tendo bila kuongeza maana ya kimadhehebu.
theological_decisions:
- issue: Maana ya ‘Huu ni mwili wangu’ katika muktadha wa Meza ya Bwana
  choice: Kauli imetafsiriwa moja kwa moja kuwa ‘Huu ni mwili wangu.’
  alternative: ‘Huu unawakilisha mwili wangu,’ au ufafanuzi unaosisitiza kuwapo halisi kwa namna fulani
  rationale: Kigiriki hakielezi hapa namna uhusiano huo unavyopaswa kufafanuliwa. Tafsiri ya moja kwa moja huhifadhi mvutano wa kiteolojia bila kuamua mabishano ya baadaye.
- issue: Nguvu ya ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  alternative: kwa niaba yenu; kwa manufaa yenu
  rationale: Kauli inaonyesha wazi manufaa au tendo linalowaelekea wasikilizaji, lakini haifafanui nadharia maalumu ya jinsi kifo cha Kristo kinavyofanya kazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akaumega’ hudumisha mfuatano wa masimulizi, huku ‘Endeleeni kufanya hivi’ ikifanya wazi hali ya tendo la kurudiwa. Kauli kuhusu mwili wa Kristo imeachwa bila ufafanuzi wa kimadhehebu.
