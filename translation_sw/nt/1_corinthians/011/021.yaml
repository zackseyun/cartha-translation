  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: sw
  text: Kwa maana, wakati wa kula, kila mmoja hula mlo wake mwenyewe kabla ya wengine[a]; mmoja ana njaa, na mwingine hulewa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huchukua mlo wake mwenyewe kabla ya wengine”; kitenzi cha Kigiriki kinaweza kusisitiza kuchukua kitu mapema au kuendelea bila kuwangoja wengine.
    reason: lexical_alternative
  - marker: b
    text: Au, “mmoja hubaki na njaa, na mwingine amelewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya mgawanyo inayomlenga kila mtu mmoja mmoja, badala ya kuwasilisha kundi kwa ujumla.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha mstari huu na uliotangulia kwa kutoa sababu ya karipio la Paulo.
- source_word: τὸ ἴδιον δεῖπνον
  choice: mlo wake mwenyewe
  rationale: ‘Mlo’ ni Kiswahili cha kawaida na chenye hadhi kwa δεῖπνον, huku ‘wake mwenyewe’ ikisisitiza umiliki binafsi kinyume na ushirika wa chakula hiki.
- source_word: προλαμβάνει
  choice: hutangulia kula
  rationale: Huonyesha kutenda mapema au kwenda mbele bila kuwangoja wengine; muktadha wa kula unaruhusu kitenzi ‘kula’ kuwekwa wazi kwa Kiswahili cha asili.
- source_word: ἐν τῷ φαγεῖν
  choice: wakati wa kula
  rationale: Muundo huu una maana ya wakati; tafsiri hii ni ya asili bila kuongeza wazo lisilokuwapo katika Kigiriki.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: mmoja ... mwingine
  rationale: Huu ni ulinganisho wa matokeo yanayowapata washiriki tofauti, na muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: πεινᾷ
  choice: huwa na njaa
  rationale: Huonyesha hali ya sasa inayotokana na tofauti hiyo bila kuamua kwa lazima kama mtu huyo alianza akiwa na njaa au aliachwa bila chakula.
- source_word: μεθύει
  choice: hulewa
  rationale: Huwasilisha wazi ulevi halisi unaokemewa katika kifungu, bila kuupunguza kuwa kula au kunywa kupita kiasi tu.
theological_decisions:
- issue: Rejeo la umoja lenye nguvu ya mgawanyo
  choice: kila mmoja ... mlo wake mwenyewe
  alternative: kila mtu ... mlo wao wenyewe
  rationale: Kigiriki kina maumbo ya umoja yenye nguvu ya mgawanyo. Kiswahili huwasilisha hilo kwa kawaida kwa ‘kila mmoja’ na ‘wake’ bila kulazimika kuongeza jinsia ambayo mfumo wa viwakilishi vya Kiswahili hauonyeshi.
- issue: Aina ya matumizi mabaya katika Mlo wa Bwana
  choice: hulewa
  alternative: amelewa
  rationale: Kitenzi cha Kigiriki kinaweza kueleza kuwa au kuwa katika hali ya ulevi. ‘Hulewa’ huonyesha kwa uwazi ulevi halisi bila kuufifisha, huku tanbihi ikihifadhi uwezekano wa kusisitiza hali iliyopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo ‘hutangulia kula’ ni wa kawaida na huhifadhi maana mbili za kitenzi cha Kigiriki kadiri iwezekanavyo. Alama zote za tanbihi zimewekwa katika matini kuu.
