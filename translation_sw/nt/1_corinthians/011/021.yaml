  verdict: revise
  source_fidelity: 'The draft communicates the central contrast: each participant proceeds selfishly with a private meal, resulting in hunger for one and intoxication for another. However, “hutangulia kula mlo wake mwenyewe” is syntactically and semantically awkward in Swahili: it can sound as though one precedes the act of eating, rather than takes/eats a meal ahead of others. Rendering the implicit comparative sense as “kabla ya wengine” is contextually warranted and is retained as a lexical alternative in the footnote.'
  naturalness: “Kwa maana, wakati wa kula, kila mmoja hula mlo wake mwenyewe kabla ya wengine” is clear, idiomatic Standard East African Swahili. “Mmoja ana njaa” more directly represents the present resulting condition than the somewhat habitual-sounding “huwa na njaa.”
  terminology: “Mlo wake mwenyewe” suitably represents τὸ ἴδιον δεῖπνον without imposing a specific denominational term. “Hulewa” appropriately preserves the explicit force of μεθύει; it should not be softened.
  issues:
  - severity: medium
    issue: Awkward rendering of προλαμβάνει
    rationale: “Hutangulia kula mlo wake mwenyewe” is not a natural way to express taking or eating one’s meal ahead of others in Kiswahili and may obscure the temporal/selfish priority conveyed by προλαμβάνει.
  - severity: low
    issue: Aspect of πεινᾷ
    rationale: “Huwa na njaa” can imply a customary state. “Ana njaa” directly states the present condition in the contrast.
