base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: sw
  text: Kwa hiyo, yeyote anayekula mkate au kunywa kikombe cha Bwana kwa namna isiyostahili[a] atakuwa na hatia kwa habari ya mwili na damu ya Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kwa namna isiyostahili” hutafsiri kielezi kinachoeleza jinsi mtu anavyokula au kunywa, si kwamba mtu huyo mwenyewe hana ustahili.
    reason: lexical_alternative
  - marker: b
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “atakuwa na hatia ya mwili na damu ya Bwana.” Muundo wa Kigiriki unaonyesha hatia au uwajibikaji kwa habari ya mwili na damu ya Bwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia kuhusu Mlo wa Bwana.
- source_word: ὃς ἂν
  choice: yeyote
  rationale: Muundo huu una maana ya jumla isiyomwekea mtu maalumu, ambayo ‘yeyote’ huiwasilisha kwa Kiswahili cha kawaida.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: anayekula mkate
  rationale: Wakati uliopo katika sharti la jumla umetafsiriwa kwa wakati uliopo wa Kiswahili; ‘mkate’ unarejelea mkate ambao tayari unazungumziwa.
- source_word: ἢ
  choice: au
  rationale: Neno la Kigiriki ni la kutenganisha; onyo linahusu tendo lolote kati ya kula na kunywa likifanywa isivyostahili.
- source_word: πίνῃ τὸ ποτήριον
  choice: kunywa kikombe
  rationale: Hii inadumisha lugha ya kimajazi ya chanzo, ambamo kikombe kinawakilisha kilichomo ndani yake.
- source_word: τοῦ κυρίου
  choice: cha Bwana / ya Bwana
  rationale: Hii ni hali ya umilikaji au uhusiano; ‘Bwana’ ni tafsiri ya kawaida ya cheo κύριος katika muktadha huu.
- source_word: ἀναξίως
  choice: kwa namna isiyostahili
  rationale: Ni kielezi kinachoeleza namna ya kula au kunywa, si thamani au ustahili wa mtu mwenyewe.
- source_word: ἔνοχος ἔσται
  choice: atakuwa na hatia
  rationale: Inaonyesha kuwa mtu atakuwa na kosa na kuwajibika; usemi huu ni wa moja kwa moja na wenye uzito unaofaa muktadha.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος
  choice: kuhusiana na mwili na damu
  rationale: Genitivi pamoja na ἔνοχος inaonyesha kile ambacho hatia hiyo inahusu. ‘Kuhusiana na’ huhifadhi maana ya uwajibikaji bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya ἀναξίως katika kushiriki Mlo wa Bwana
  choice: Mstari unashutumu kula au kunywa kwa namna isiyostahili, si kusema kuwa anayeshiriki ni mtu asiye na ustahili wa ndani.
  alternative: Kuelewa mstari kuwa unazungumzia mtu asiyestahili badala ya namna isiyostahili.
  rationale: ἀναξίως ni kielezi kinachovirekebisha vitenzi ‘kula’ na ‘kunywa’; tafsiri inadumisha lengo hilo la kisarufi bila kuingiza hitimisho la kimadhehebu.
- issue: Nguvu ya ἢ kati ya kula na kunywa
  choice: Onyo linatumika ikiwa tendo lolote kati ya hayo mawili linafanywa kwa namna isiyostahili.
  alternative: Kuyachukulia matendo hayo kama jozi isiyoweza kutenganishwa na hivyo kutafsiri ‘na’.
  rationale: Chanzo cha Kigiriki kinatumia kiunganishi cha kutenganisha ἢ, kwa hiyo ‘au’ kinahifadhi tofauti hiyo.
- issue: Uhusiano wa ἔνοχος na ‘mwili na damu’
  choice: Hatia inaelezwa kuwa inahusiana na mwili na damu ya Bwana bila kubainisha zaidi aina kamili ya uwajibikaji.
  alternative: Kutafsiri moja kwa moja ‘atakuwa na hatia ya mwili na damu ya Bwana’.
  rationale: Muundo wa Kigiriki unaweza kuwa na maana ya kuwa na hatia au kuwajibika kwa habari ya kitu fulani. Tafsiri kuu huepuka kuamua zaidi ya maandishi huku ikihifadhi uzito wa onyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa urahisi wa kueleweka huku ikidumisha kiunganishi ‘au’, matumizi ya kielezi katika ἀναξίως, na kiasi cha kutokuwa wazi katika muundo ἔνοχος pamoja na genitivi.
