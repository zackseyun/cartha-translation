translation:
  language: sw
  text: Lakini kama tungejihukumu wenyewe[a], tusingehukumiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tungejichunguza wenyewe” au “tungejipima wenyewe.” Kitenzi cha Kigiriki kinaweza kumaanisha kujitathmini au kutofautisha; “tungejihukumu” kimetumiwa hapa ili kuhifadhi ulinganifu na “tusingehukumiwa” katika kishazi kinachofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini kama
  rationale: εἰ huanzisha sharti, na δέ huleta utofautishaji mpole na yaliyotangulia. “Lakini kama” huwasilisha yote mawili kwa Kiswahili cha kawaida.
- source_word: ἑαυτοὺς
  choice: wenyewe
  rationale: Ni kiwakilishi rejeshi kilicho yambwa cha kitenzi; katika “tungejihukumu wenyewe,” neno hili linasisitiza kwamba tathmini inaelekezwa kwa nafsi zetu.
- source_word: διεκρίνομεν
  choice: tungejihukumu
  rationale: Katika muktadha huu διακρίνω inaweza kumaanisha kujipima, kujitathmini, au kujipambanua. “Kujihukumu” huhifadhi ulinganifu wa kimakusudi na ἐκρινόμεθα katika kishazi kinachofuata.
- source_word: οὐκ ἂν
  choice: tusinge-
  rationale: Pamoja na vitenzi vya wakati usiotimilika, muundo huu unaeleza matokeo yasiyotokea ya sharti; kiambishi cha Kiswahili “-singe-” ni ulinganifu wa asili.
- source_word: ἐκρινόμεθα
  choice: tusingehukumiwa
  rationale: κρίνω hapa ni kuhukumiwa, bila kulazimisha maana kali zaidi ya kulaaniwa. Tafsiri hii pia huhifadhi uhusiano wa kimsamiati na kitenzi cha kishazi cha kwanza.
theological_decisions:
- issue: Ikiwa kishazi cha pili kinamaanisha hukumu ya mwisho au hukumu/nidhamu ya Mungu katika maisha haya
  choice: Maana imeachwa kuwa “tusingehukumiwa,” huku muktadha ukidokeza hukumu ya Mungu yenye nidhamu.
  alternative: “tusingelaaniwa,” kwa maana ya hukumu ya mwisho
  rationale: Mstari wa 32 unatofautisha kuhukumiwa na kuadibishwa na Bwana dhidi ya kuhukumiwa pamoja na ulimwengu. Kwa hiyo, “kuhukumiwa” huhifadhi mvutano wa maandishi bila kuingiza mapema maana ya kulaaniwa mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti “kama tunge- ... tusinge-” ni wa kawaida na unaonyesha kwamba hali hiyo haikutimia. Neno “wenyewe” linawekwa baada ya kitenzi rejeshi kwa msisitizo unaolingana na ἑαυτούς.
