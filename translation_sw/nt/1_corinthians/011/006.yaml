id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: sw
  text: Kwa maana, ikiwa mwanamke[a] hajifuniki kichwa, basi na akatwe nywele zake. Lakini ikiwa ni jambo la aibu kwa mwanamke kukatwa nywele au kunyolewa kichwa, basi ajifunike kichwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mke” katika mstari huu; neno la Kigiriki gynē linaweza kumaanisha “mwanamke” au “mke,” kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Au “afunikwe.” Kigiriki husema afunikwe, huku kichwa kikidokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: hajifuniki kichwa / ajifunike kichwa
  rationale: Kitenzi kina maana ya kufunika au kujisitiri kwa kifuniko. Muktadha unaonyesha kuwa kichwa ndicho kinachofunikwa; kukitaja wazi kunaleta maana ya asili kwa Kiswahili cha kawaida bila kubainisha aina fulani ya vazi.
- source_word: γυνή
  choice: mwanamke
  rationale: Neno linaweza kumaanisha mwanamke au mke. Sentensi hii haimtaji mume moja kwa moja, kwa hiyo “mwanamke” inahifadhi upeo mpana zaidi; uwezekano wa “mke” umewekwa katika tanbihi.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: akatwe nywele zake / kukatwa nywele
  rationale: Kitenzi kinarejelea kunyoa au kukata nywele kwa ufupi kama kwa makasi, na kinatofautishwa hapa na ξυρᾶσθαι, kunyoa kabisa. “Kukatwa nywele” ni ya asili na hudumisha tofauti hiyo.
- source_word: καί
  choice: basi na
  rationale: 'Huhifadhi hatua ya hoja: asipofunika kichwa, na akubali pia matokeo ya kukatwa nywele.'
- source_word: αἰσχρόν
  choice: jambo la aibu
  rationale: Huwasilisha dhana ya fedheha au aibu katika mazingira ya heshima ya kijamii kwa Kiswahili kinachoeleweka kwa urahisi.
- source_word: ξυρᾶσθαι
  choice: kunyolewa kichwa
  rationale: Kitenzi humaanisha kunyolewa kwa wembe. Kutaja kichwa wazi kunazuia maana pana ya kunyolewa sehemu nyingine na kudumisha tofauti na kukatwa nywele.
- source_word: γὰρ ... δέ
  choice: Kwa maana ... Lakini
  rationale: Viunganishi hivi vinaonyesha maelezo yanayounga mkono hoja iliyotangulia na kisha utofautishaji ndani ya sentensi.
theological_decisions:
- issue: Ikiwa γυνή itafsiriwe “mwanamke” au “mke”
  choice: mwanamke
  alternative: mke
  rationale: Mstari wenyewe haumtaji mume, hivyo “mwanamke” haubani maana kwa wanawake walioolewa pekee. Hata hivyo, kwa kuwa γυνή inaweza kumaanisha “mke” kutegemea muktadha, uwezekano huo umehifadhiwa katika tanbihi.
- issue: Ikiwa κατακαλύπτεσθαι ibainishwe kuwa kufunika kichwa au kutafsiriwa kwa ujumla kuwa kujisitiri
  choice: kujifunika kichwa
  alternative: kujisitiri kwa kifuniko / kufunikwa
  rationale: Kigiriki hakitaji nomino “kichwa” katika mstari huu, lakini muktadha wa karibu unaifanya kuwa kitu kinachodokezwa. Tafsiri hii haiamui aina maalumu ya kifuniko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa hoja “ikiwa ... basi” umehifadhiwa, huku tofauti kati ya kukatwa nywele na kunyolewa kichwa ikibaki wazi.
