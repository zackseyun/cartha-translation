  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: sw
  text: Ninawasifu kwa sababu mnanikumbuka katika mambo yote, na mnashikamana kwa uthabiti na mapokeo kama nilivyowakabidhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho” au “maagizo”; Kigiriki ni “mapokeo,” yaani yale yaliyopokelewa na kupitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Ninawasifu
  rationale: Hutoa maana ya kusifu au kupongeza; hapa ni kauli chanya ya Paulo kwa wasomaji wake.
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno tofauti)
  rationale: Ni kiunganishi hafifu cha mpito. Katika Kiswahili, mtiririko wa sentensi unatosha bila kuongeza neno ambalo lingeweza kuonyesha tofauti kali isiyokusudiwa.
- source_word: ὑμᾶς
  choice: -wa- katika “Ninawasifu”
  rationale: Kiambishi cha yambwa kinaonyesha wazi nafsi ya pili wingi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha sababu ya Paulo kuwasifu.
- source_word: πάντα
  choice: katika mambo yote
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuufanya umaanishe tu ‘daima.’
- source_word: μου μέμνησθε
  choice: mnanikumbuka
  rationale: Ni Kiswahili cha kawaida na huonyesha kwamba wanaendelea kumweka Paulo akilini.
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha ulinganifu kati ya jinsi Paulo alivyowakabidhi mapokeo na jinsi wanavyoyashika.
- source_word: παρέδωκα
  choice: nilivyowakabidhi
  rationale: Huhifadhi wazo la kupeleka au kukabidhi kwa wengine jambo lililopokelewa au lenye mamlaka.
- source_word: τὰς παραδόσεις
  choice: mapokeo
  rationale: Huhifadhi maana ya kile kilichopitishwa au kukabidhiwa bila kukifupisha kuwa mafundisho ya jumla tu.
- source_word: κατέχετε
  choice: mnayashika kwa uthabiti
  rationale: Huonyesha kuyatunza na kuendelea kushikamana nayo, si kuyamiliki tu.
theological_decisions:
- issue: Maana ya παραδόσεις katika muktadha wa jumuiya ya waamini
  choice: mapokeo
  alternative: mafundisho; maagizo
  rationale: ‘Mapokeo’ huhifadhi kategoria ya mambo ambayo Paulo aliwakabidhi, bila kuingiza madai ya baadaye ya dhehebu fulani kuhusu mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnayashika kwa uthabiti’ ni wazi kwa wasomaji wa kawaida; ‘mapokeo’ huhifadhi neno muhimu la muktadha wa kitume. Alama ya tanbihi [a] imewekwa katika matini.
