review_pass:
  verdict: revise
  source_fidelity: Draft faithfully renders the inclusive force of ἄνθρωπος and the reflexive emphasis of ἑαυτόν. However, “ndipo” chiefly expresses temporal succession (“then”), whereas οὕτως more directly means “thus/in this way,” describing the manner in which the person is to eat and drink after self-examination.
  naturalness: The Swahili is generally clear and appropriately formal. Removing the optional hortative particle “na” after “kila mtu” produces a more direct and natural imperative construction, while “kwa namna hiyo” clearly and idiomatically represents οὕτως.
  terminology: “Kila mtu,” “ajichunguze mwenyewe,” “mkate huo,” and “kikombe hicho” are suitable Standard East African Swahili choices. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: “Ndipo” narrows οὕτως to a temporal sequence.
    rationale: The Greek adverb οὕτως ordinarily means “thus/so, in this manner.” Although the examination precedes eating and drinking in the sentence, “ndipo” does not retain the adverb’s manner-related force as closely as “kwa namna hiyo.”
  revised_text: Lakini kila mtu ajichunguze mwenyewe, na kwa namna hiyo ale mkate huo na anywe kutoka katika kikombe hicho.
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s inclusive reference, reflexive emphasis, present imperative force, and the meaning of οὕτως as “in this way,” without imposing an interpretation beyond the text. No footnote is required.
