- from: Lakini kila mtu na ajichunguze mwenyewe, ndipo ale mkate huo na anywe kutoka katika kikombe hicho.
  to: Lakini kila mtu ajichunguze mwenyewe, na kwa namna hiyo ale mkate huo na anywe kutoka katika kikombe hicho.
  rationale: The revision preserves the source’s inclusive reference, reflexive emphasis, present imperative force, and the meaning of οὕτως as “in this way,” without imposing an interpretation beyond the text. No footnote is required.
