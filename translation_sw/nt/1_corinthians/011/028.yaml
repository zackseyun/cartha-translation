  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: sw
  text: Lakini kila mtu ajichunguze mwenyewe, na kwa namna hiyo ale mkate huo na anywe kutoka katika kikombe hicho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: na ajichunguze
  rationale: Kitenzi hiki kinamaanisha kujipima au kujichunguza ili kuthibitisha hali au ufaafu; “ajichunguze” ni cha kawaida na kinafaa katika muktadha huu.
- source_word: ἄνθρωπος
  choice: kila mtu
  rationale: Hapa neno linamtaja mtu kwa ujumla, si mwanamume kwa kutofautishwa na mwanamke; “kila mtu” huwasilisha matumizi hayo ya kijumla kwa Kiswahili cha sasa.
- source_word: ἑαυτόν
  choice: mwenyewe
  rationale: Kiwakilishi rejeshi kinasisitiza kwamba uchunguzi unamhusu mtu huyo mwenyewe.
- source_word: οὕτως
  choice: ndipo
  rationale: Katika muktadha huu linaonyesha kwamba baada ya kujichunguza, mtu ale na anywe; “ndipo” huonyesha mfuatano huo bila kudokeza kwamba lazima ajizuie.
- source_word: ἐκ τοῦ ἄρτου
  choice: mkate huo
  rationale: Ingawa Kigiriki kinasema kihalisi “kutoka katika mkate,” Kiswahili cha kawaida husema “ale mkate”; kiashiria “huo” kinahifadhi uainishaji wa nomino wenye kibainishi.
- source_word: ἐκ τοῦ ποτηρίου
  choice: kutoka katika kikombe hicho
  rationale: Kiswahili hutumia kwa kawaida “kunywa kutoka katika kikombe,” na “hicho” huakisi kibainishi cha Kigiriki.
theological_decisions:
- issue: Maana ya agizo baada ya kujichunguza
  choice: ndipo ale ... na anywe
  alternative: na kwa njia hiyo ale ... na anywe
  rationale: οὕτως inaweza kueleza namna au mfuatano. “Ndipo” ni ya asili katika Kiswahili na huhifadhi hoja ya kwamba kujichunguza kunatangulia kushiriki, bila kuongeza hitaji lisilotajwa la kujiondoa.
- issue: Upeo wa ἄνθρωπος
  choice: kila mtu
  alternative: mwanamume
  rationale: Katika sentensi hii ἄνθρωπος hutumiwa kwa maana ya mtu yeyote. Tafsiri “mwanamume” ingeweza kuifanya amri ionekane kuwa ya wanaume pekee, jambo ambalo halilazimishwi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa agizo “na ajichunguze” unadumisha nguvu ya kauli ya Kigiriki; hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
