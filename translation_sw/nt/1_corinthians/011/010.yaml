base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: sw
  text: Kwa sababu hiyo, mwanamke anapaswa kuwa na mamlaka juu ya kichwa chake[a], kwa sababu ya malaika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “anapaswa kuvaa ishara ya mamlaka juu ya kichwa chake.” Kigiriki kinasema “mamlaka” na hakitaji wazi “ishara” au “kifuniko.”
    reason: alternative_reading
  - marker: b
    text: Au “kwa sababu ya wajumbe,” ingawa hapa “malaika” ndiyo maana inayowezekana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kiunganishi hiki kinahifadhi uhusiano wa sababu na hitimisho unaotokana na hoja iliyotangulia.
- source_word: ὀφείλει
  choice: anapaswa
  rationale: Huonyesha wajibu au jambo linalofaa bila kulifanya moja kwa moja kuwa amri ya kisheria isiyo na mpaka.
- source_word: ἡ γυνὴ
  choice: mwanamke
  rationale: Hapa umoja una maana ya jumla katika mjadala kuhusu mwanamume na mwanamke; ‘mke’ ingeufanya upeo kuwa mwembamba kuliko Kigiriki kinavyolazimisha.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno la Kigiriki lenyewe ni ‘mamlaka’; halitaji wazi ‘ishara’ wala ‘kifuniko.’
- source_word: ἔχειν
  choice: kuwa na
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi; ‘kuvaa’ ingeongeza ufafanuzi unaotokana na muktadha.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: juu ya kichwa chake
  rationale: Tafsiri hii ya kawaida inahifadhi upana wa uhusiano wa mahali katika kifungu cha Kigiriki.
- source_word: διὰ τοὺς ἀγγέλους
  choice: kwa sababu ya malaika
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu; ‘malaika’ ndiyo maana inayowezekana zaidi hapa, ingawa ‘wajumbe’ pia inawezekana kileksika.
theological_decisions:
- issue: Maana ya ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: kuwa na mamlaka juu ya kichwa chake
  alternative: kuvaa ishara ya mamlaka juu ya kichwa chake; kuwa na kifuniko cha kichwa kama ishara ya mamlaka
  rationale: Kigiriki hakina maneno ‘ishara’ au ‘kifuniko.’ Kwa kuwa maana ya kifungu hiki inajadiliwa, matini kuu inahifadhi maneno yake badala ya kuamua tafsiri fulani kimya kimya.
- issue: Mrejelewa wa ἀγγέλους
  choice: malaika
  alternative: wajumbe
  rationale: ἄγγελος linaweza kumaanisha malaika au mjumbe, lakini wingi usio na sifa hapa unaelekea zaidi kumaanisha viumbe wa mbinguni; hakuna nadharia maalumu kuhusu sababu ya kutajwa kwao iliyoingizwa.
- issue: Upeo wa γυνή
  choice: mwanamke
  alternative: mke
  rationale: Muktadha mpana unazungumzia mwanamume na mwanamke kwa namna ya jumla, hivyo tafsiri haijafupishwa kwa uhusiano wa ndoa pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida huku fumbo la usemi ‘mamlaka juu ya kichwa chake’ likihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
