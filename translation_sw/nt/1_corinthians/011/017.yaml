  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: sw
  text: Lakini ninapotoa agizo hili[a], siwasifu, kwa sababu mnakusanyika si kwa hali iliyo bora bali kwa hali iliyo mbaya zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninapotoa amri hii.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa maelekezo, agizo, au amri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: hili
  rationale: Kiwakilishi hiki kinaelekea mbele kwenye agizo ambalo Paulo anaanza kutoa; katika Kiswahili kinaunganishwa kwa kawaida na nomino ‘agizo’.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji kutoka sifa ya mstari wa 2 kwenda kwenye kukemea hapa.
- source_word: παραγγέλλων
  choice: ninapotoa agizo
  rationale: Kitenzi kinaweza kumaanisha kutoa maelekezo, maagizo, au amri. ‘Kutoa agizo’ kinadumisha mamlaka ya usemi bila kuufanya kuwa mkali kupita kiasi.
- source_word: οὐκ ἐπαινῶ
  choice: siwasifu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kutowapongeza au kutowasifu; pia inadumisha mwangwi wa sifa katika mstari wa 2.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa kinaanzisha sababu ya Paulo kutowasifu.
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: si mema zaidi
  rationale: Muundo unaonyesha matokeo au mwelekeo wa kukutana kwao. Kiswahili cha ‘matokeo yake si mema zaidi’ huwasilisha maana hiyo kwa uwazi.
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: bali ni mabaya zaidi
  rationale: Kinahifadhi ulinganifu wa kinyume kati ya hali bora na hali mbaya bila kuongeza aina maalumu ya madhara.
- source_word: συνέρχεσθε
  choice: mnapokutana pamoja
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kusanyiko la waumini na unaonyesha tendo la kukusanyika.
theological_decisions:
- issue: Nguvu ya mamlaka katika παραγγέλλων
  choice: agizo
  alternative: amri
  rationale: ‘Agizo’ linaonyesha maelekezo yenye mamlaka ya kitume, huku tanbihi ikihifadhi uwezekano wa maana yenye nguvu zaidi ya ‘amri’.
- issue: Maana ya εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον
  choice: matokeo yake si mema zaidi bali ni mabaya zaidi
  alternative: hamkutani kwa ajili ya mema bali kwa ajili ya mabaya
  rationale: Muundo wa Kigiriki unaweza kuhusisha kusudi au matokeo. Tafsiri iliyochaguliwa inaonyesha matokeo yanayoonekana katika muktadha bila kudai kwamba walikusanyika kwa nia ya kufanya mabaya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili; ‘matokeo yake’ hufanya uhusiano wa εἰς na mikutano uwe wazi huku ikihifadhi utofautishaji wa ‘mema zaidi’ na ‘mabaya zaidi’.
