  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: sw
  text: Kwa maana, kwanza kabisa, mnapokusanyika kama kanisa[a], nasikia kwamba kuna migawanyiko miongoni mwenu, na kwa kiasi fulani naamini hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kusanyiko”; neno la Kigiriki hapa linarejelea jumuiya ya waumini iliyokusanyika, si hasa jengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: kwanza
  rationale: Hutambulisha hoja ya kwanza katika maelezo ya Paulo. Kiswahili hakihitaji jozi rasmi ya ‘kwa upande mmoja... kwa upande mwingine’ ili kuhifadhi kazi hii ya kihoja.
- source_word: συνερχομένων ὑμῶν
  choice: mnapokusanyika
  rationale: Muundo huu una maana ya wakati; ‘mnapokusanyika’ ni wa kawaida na unaendana na matumizi ya kitenzi hiki katika sura hii.
- source_word: ἐν ἐκκλησίᾳ
  choice: kama kusanyiko la waumini
  rationale: Katika muktadha huu neno linamaanisha jumuiya iliyokusanyika, si hasa jengo. Chaguo hili linaeleza hali yao ya kukusanyika kama kundi la waumini bila kuifanya taasisi au mahali.
- source_word: ἀκούω
  choice: nasikia
  rationale: Huhifadhi wakati uliopo na kuonyesha kwamba Paulo anategemea taarifa alizopokea.
- source_word: σχίσματα
  choice: migawanyiko
  rationale: Hueleza mipasuko au migawanyiko ndani ya jumuiya bila kulazimisha maana ya makundi rasmi.
- source_word: ὑπάρχειν
  choice: kuna
  rationale: Ni njia ya kawaida ya Kiswahili ya kueleza kwamba migawanyiko ipo miongoni mwao.
- source_word: καὶ μέρος τι
  choice: nami kwa kiasi fulani
  rationale: 'Huhifadhi tahadhari ya Paulo: anakubali taarifa hiyo kwa sehemu au kwa kiwango fulani.'
- source_word: πιστεύω
  choice: naamini
  rationale: Kitu kinachoaminiwa kinaeleweka kutokana na muktadha, hivyo hakihitaji kuongezwa kwa namna isiyo ya asili.
theological_decisions:
- issue: Maana ya ἐκκλησία katika muktadha
  choice: kusanyiko la waumini waliokusanyika
  alternative: kanisani / katika kanisa
  rationale: Muktadha unahusu Wakorintho wanapokusanyika kwa pamoja, hasa kuhusu Mlo wa Bwana. Tafsiri haifungamanishi neno hilo na jengo wala kulifanya dhana ya kitaasisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa maana, kwanza’ huhifadhi kiunganishi γάρ na alama ya hoja ya kwanza, ingawa mfuatano huo una uzito mdogo wa kimtindo unaofanana na Kigiriki.
