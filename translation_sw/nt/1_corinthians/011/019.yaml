  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: sw
  text: Kwa maana lazima pia kuwe na makundi yanayotengana miongoni mwenu[a], ili wale waliothibitika[b] pia waonekane wazi miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “migawanyiko,” “makundi,” au “madhehebu.” Katika muktadha huu neno hilo yaelekea humaanisha makundi yanayojitenga ndani ya kusanyiko; katika matumizi ya baadaye lilitumiwa pia kwa maana ya “uzushi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wale waliokubalika,” “wale walio wa kweli,” au “wale waliostahimili majaribu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: lazima
  rationale: Hudumisha kauli yenye nguvu ya ulazima bila kuamua ikiwa ni ulazima wa kimungu, wa kimantiki, au hali isiyoepukika.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unaeleza sababu inayohusiana na kauli iliyotangulia.
- source_word: καὶ αἱρέσεις
  choice: pia yawepo makundi yenye migawanyiko
  rationale: Katika muktadha huu neno linahusu makundi yanayogawanya kusanyiko, si lazima uzushi wa mafundisho kwa maana iliyokuja baadaye. Usemi huu ni wazi kwa msomaji wa Kiswahili na unatofautisha maana hiyo na migawanyiko ya jumla iliyotajwa katika mstari uliotangulia.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba hali hiyo imo ndani ya jumuiya.
- source_word: ἵνα
  choice: ili
  rationale: Huhifadhi uwezekano wa kusudi au matokeo bila kulazimisha tofauti kati yake.
- source_word: καὶ οἱ δόκιμοι
  choice: wale waliothibitishwa kuwa wa kweli pia
  rationale: δόκιμοι huonyesha watu ambao uhalisi wao umedhihirika baada ya kupimwa. Neno 'pia' linahifadhi καί ya pili.
- source_word: φανεροὶ γένωνται
  choice: wapate kujulikana wazi
  rationale: Huwasilisha wazo la kuja kuonekana au kutambulika wazi, huku likihifadhi hali ya mchakato iliyo katika γένωνται.
theological_decisions:
- issue: Maana ya αἱρέσεις
  choice: makundi yenye migawanyiko
  alternative: uzushi; madhehebu; migawanyiko
  rationale: Muktadha wa 1 Wakorintho 11 unahusu makundi yanayogawanya kusanyiko wakati wa mkutano na Mlo wa Bwana. Tafsiri hii haingizi moja kwa moja maana ya baadaye ya uzushi wa kimafundisho.
- issue: Nguvu ya δεῖ
  choice: lazima
  alternative: haiwezi kuepukika; ni lazima kwa kusudi la Mungu
  rationale: Kigiriki kinataja ulazima bila kueleza chanzo chake. Tafsiri inaacha wazi mvutano kati ya ulazima wa kimungu na hali inayotarajiwa au isiyoepukika.
- issue: Uhusiano unaoonyeshwa na ἵνα
  choice: ili
  alternative: hivi kwamba; kwa matokeo kwamba
  rationale: Neno linaweza kuonyesha kusudi au matokeo. 'Ili' hudumisha kauli ya Paulo bila kuongeza maelezo ya kitheolojia kuhusu anayekusudia matokeo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi urudiaji wa 'miongoni mwenu,' kauli ya ulazima, na utata wa kusudi au matokeo. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika kwa mpangilio wa kawaida [a], [b].
