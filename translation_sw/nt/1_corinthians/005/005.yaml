  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: sw
  text: Mtoeni mtu wa namna hiyo kwa Shetani kwa ajili ya kuangamizwa kwa mwili,[a] kusudi roho iokolewe katika siku ya Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya uharibifu wa mwili.” Kirai hiki kinaweza kumaanisha hukumu kali ya kimwili, au, kwa maana ya mfano zaidi, kuangamizwa kwa mwelekeo wa mtu huyo wa kufuata tamaa za mwili na dhambi.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “Bwana wetu Yesu” au “Bwana Yesu” badala ya “Bwana” pekee.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: mkabidhi
  rationale: Kitenzi hiki kinaonyesha kumtia mtu mikononi au mamlakani mwa mwingine. “Kumkabidhi” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika muktadha huu.
- source_word: τὸν τοιοῦτον
  choice: mtu wa namna hiyo
  rationale: Hurejelea mkosaji mahususi huku kikidumisha namna ya usemi wa kimakundi; tafsiri hii ni ya kawaida na haiongezi zaidi ya Kigiriki.
- source_word: τῷ Σατανᾷ
  choice: kwa Shetani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; “kwa” linaonyesha anayekabidhiwa mtu huyo.
- source_word: εἰς ὄλεθρον
  choice: ili ... uangamizwe
  rationale: ὄλεθρος inaweza kumaanisha maangamizi au uharibifu. Muundo huu unahifadhi uzito na mwelekeo wa tendo bila kufafanua aina yake kupita kiasi.
- source_word: τῆς σαρκός
  choice: mwili
  rationale: Katika Kiswahili, “mwili” ndilo neno la kawaida linaloweza kurejelea hali ya kimwili na, kulingana na muktadha, mwelekeo wa tamaa za mwili. Tanbihi inadumisha uwezekano wa maana zote mbili.
- source_word: ἵνα
  choice: kusudi
  rationale: Linaonyesha lengo la hatua hiyo kwa uwazi na kwa lugha ya kawaida yenye hadhi.
- source_word: τὸ πνεῦμα
  choice: roho
  rationale: Kigiriki hakina kiwakilishi cha umilikaji kama “yake”; kutotumia “roho yake” kunahifadhi kiasi cha usemi wa asili.
- source_word: σωθῇ
  choice: iokolewe
  rationale: Huhifadhi hali ya kutendwa na lugha ya wokovu katika kishazi cha kusudi.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: katika siku
  rationale: Ni uhamishaji wa karibu wa kirai cha wakati na ni usemi unaoeleweka katika muktadha wa siku ya mwisho.
- source_word: τοῦ κυρίου
  choice: ya Bwana
  rationale: Hufuata matini ya SBLGNT inayosoma “Bwana” tu bila kuongeza “Yesu” au “wetu.”
theological_decisions:
- issue: Maana ya “kuangamizwa kwa mwili”
  choice: 'Kudumisha usemi wenye maana isiyoamuliwa kabisa: “ili mwili uangamizwe.”'
  alternative: Hukumu kali ya kimwili au kifo; au kuangamizwa kwa mwelekeo wa dhambi na tamaa za mwili.
  rationale: Kigiriki hakilazimishi maana moja kati ya hukumu ya kimwili na kuvunjwa kwa mwelekeo wa kidunia wenye dhambi; tanbihi inaeleza mvutano huo bila kuutatua kimadhehebu.
- issue: Mhusika wa “roho”
  choice: Kutafsiri “roho” bila kuongeza “yake.”
  alternative: “roho yake”
  rationale: Muktadha unaelekea kwa wokovu wa mkosaji, lakini Kigiriki hakina kiwakilishi wazi cha umilikaji.
- issue: Kirai cha kieskatolojia “siku ya Bwana”
  choice: Kutafsiri matini msingi kuwa “siku ya Bwana.”
  alternative: “siku ya Bwana wetu Yesu” au “siku ya Bwana Yesu”
  rationale: Matini iliyotolewa inasema “Bwana” pekee; tofauti za hati zinawekwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtu wa namna hiyo” huhifadhi sauti ya Kigiriki bila kuwa ya kizamani. “Mwili” limechaguliwa badala ya ufafanuzi wa kimadhehebu ili kudumisha utata halisi wa σάρξ. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
