review_pass:
  verdict: revise
  source_fidelity: Mkabidhi is a singular imperative, whereas παραδοῦναι is an infinitive expressing the action directed to the Corinthian assembly in the surrounding sentence. Rendering it with the plural imperative “mtoeni” naturally reflects the corporate addressees. “Kwa ajili ya kuangamizwa kwa mwili” more directly represents εἰς ὄλεθρον τῆς σαρκός while retaining the source phrase’s debated ambiguity.
  naturalness: The revision is idiomatic Standard East African Swahili with a suitably formal biblical register. It avoids the somewhat awkward passive construction “ili mwili uangamizwe” and makes the relationship of the disciplinary action to its stated aim clear.
  terminology: “Shetani,” “mwili,” “roho,” “iokolewe,” and “Bwana” are retained. “Mwili” properly leaves σάρξ open to bodily and figurative senses; neither the main text nor note imposes one theological interpretation. The textual-variant note correctly distinguishes the SBLGNT reading “Bwana” from expansions in other manuscripts.
  issues:
  - severity: medium
    issue: “mkabidhi” is singular imperative.
    rationale: The Greek infinitive is dependent on the preceding plural directive to the gathered church (1 Cor 5:4). A plural imperative is the appropriate Swahili standalone rendering.
  - severity: low
    issue: The main wording “ili mwili uangamizwe” converts the prepositional noun phrase εἰς ὄλεθρον τῆς σαρκός into a finite purpose clause.
    rationale: This is not a serious semantic error, but “kwa ajili ya kuangamizwa kwa mwili” follows the source construction more closely and preserves its intentionally disputed scope more cleanly.
  - severity: low
    issue: Footnote a’s alternative “ili hali ya mwili iharibiwe” adds “hali” (condition/orientation) in the quoted alternative.
    rationale: The lexical alternative should first represent the source phrase directly; interpretation can then be explained separately.
