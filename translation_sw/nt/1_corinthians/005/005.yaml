  rationale: The revision corrects the addressee implied by the Greek and uses a noun phrase corresponding more closely to εἰς ὄλεθρον τῆς σαρκός. It retains all material ambiguity concerning “mwili” and “roho,” follows the base text’s unexpanded “Bwana,” and preserves correctly placed footnote anchors.
