  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: sw
  text: Ondoeni kabisa chachu ya zamani, ili muwe donge jipya, kama vile mlivyo bila chachu. Kwa maana Masihi[a], mwana-kondoo wetu wa Pasaka[b], ametolewa dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: Christos; pia hutafsiriwa “Kristo.” Hapa limetafsiriwa “Masihi” kwa sababu linatumika hasa kama cheo.'
    reason: alternative_reading
  - marker: b
    text: Kigiriki husema “Pasaka yetu.” Katika muktadha huu, neno “Pasaka” linaweza kumaanisha mwana-kondoo wa Pasaka au dhabihu ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Ondoeni kabisa
  rationale: Kauli ya amri ya wakati uliopita inaagiza tendo thabiti la kuondoa kikamilifu. ‘Ondoeni kabisa’ ni Kiswahili cha kawaida kinachobeba nguvu ya kiambishi ἐκ-.
- source_word: παλαιὰν ζύμην
  choice: chachu ya zamani
  rationale: ‘Chachu’ huhifadhi picha ya kuoka na uhusiano wake na mkate usiotiwa chachu katika Pasaka; ‘ya zamani’ huonyesha hali au ushawishi wa awali unaopaswa kuondolewa.
- source_word: ἵνα ἦτε
  choice: ili muwe
  rationale: Huhifadhi kusudi la ἵνα pamoja na mvutano kati ya wito wa kuwa wapya na kauli inayofuata kwamba tayari wako bila chachu.
- source_word: νέον φύραμα
  choice: donge jipya
  rationale: φύραμα ni donge la unga uliokandwa. ‘Donge jipya’ ni la asili katika Kiswahili na linaendeleza sitiari ya kuoka.
- source_word: καθώς ἐστε ἄζυμοι
  choice: kama vile mlivyo bila chachu
  rationale: ‘Kama vile’ huakisi καθώς bila kuibadili kuwa sababu dhahiri, na ‘bila chachu’ huhifadhi picha ya Pasaka.
- source_word: τὸ πάσχα ἡμῶν
  choice: mwana-kondoo wetu wa Pasaka
  rationale: Kwa kuwa ἐτύθη inaonyesha kuchinjwa au kutolewa dhabihu, ‘mwana-kondoo’ huweka wazi rejeo la dhabihu linalodokezwa katika muktadha. Tanbihi huhifadhi usemi halisi na uwezekano mpana wa ‘Pasaka yetu’.
- source_word: ἐτύθη
  choice: ametolewa dhabihu
  rationale: Hii huonyesha kitendo cha dhabihu cha θύω katika hali ya kutendwa, kwa Kiswahili cha kawaida, huku kauli timilifu ikionyesha tukio lililotokea lenye umuhimu unaoendelea.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός ina nguvu ya cheo katika mazingira ya Pasaka na ukombozi, hivyo ‘Masihi’ huwasilisha maana hiyo kuliko kuitumia kama jina tu.
theological_decisions:
- issue: Maana ya πάσχα inapohusishwa na Masihi
  choice: mwana-kondoo wetu wa Pasaka
  alternative: Pasaka yetu; dhabihu yetu ya Pasaka
  rationale: Kigiriki kinasema kwa kifupi ‘Pasaka yetu,’ lakini kitenzi ‘ametolewa dhabihu’ kinaonyesha mnyama wa dhabihu. Kuongeza ‘mwana-kondoo’ hufanya maana inayodokezwa ieleweke, na tanbihi hulinda upana wa usemi wa asili.
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa Pasaka unaangazia cheo na jukumu la Χριστός, hivyo ‘Masihi’ linafaa; tanbihi inataja umbo la kawaida ‘Kristo’ bila kulazimisha tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya chachu, donge, na Pasaka imehifadhiwa; sentensi ni wazi kwa msomaji wa kawaida bila kuondoa mvutano kati ya amri ya kuwa donge jipya na utambulisho wao uliopo wa kuwa bila chachu.
