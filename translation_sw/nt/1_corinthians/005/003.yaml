  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: sw
  text: Kwa maana mimi, ijapokuwa sipo kimwili, nipo kiroho[b], tayari nimemhukumu[a], kana kwamba nipo, yule aliyefanya jambo hili kwa namna hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tayari nimetoa hukumu.”
    reason: lexical_alternative
  - marker: b
    text: “Nipo kiroho” yaelekea zaidi kumaanisha roho ya Paulo mwenyewe kuliko Roho Mtakatifu.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: sipo kimwili
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kutokuwapo kwa mwili bila kudokeza kifo au roho kutengana na mwili.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: lakini nipo kiroho
  rationale: Hudumisha utofautishaji na kutokuwapo kimwili huku ikiacha wazi namna hasa ya kuwapo huko.
- source_word: ἤδη κέκρικα
  choice: tayari nimemhukumu
  rationale: Wakati timilifu unaonyesha hukumu iliyokwisha kufikiwa na inayoendelea kuwa na nguvu; kitenzi 'nimemhukumu' kinabaki karibu na κρίνω.
- source_word: ὡς παρὼν
  choice: kana kwamba nipo
  rationale: Huonyesha kwamba Paulo ametoa hukumu kama mtu aliyekuwapo mwenyewe.
- source_word: τὸν ... κατεργασάμενον
  choice: mtu aliyefanya
  rationale: Kirai cha Kiswahili kinawakilisha kihusishi kilichotumika kama nomino bila kuongeza maelezo yasiyokuwamo.
- source_word: οὕτως τοῦτο
  choice: jambo hili kwa namna hiyo
  rationale: Huwakilisha τοῦτο kama 'jambo hili' na οὕτως kama 'kwa namna hiyo,' bila kuufuta msisitizo wa namna ya tendo.
- source_word: γάρ
  choice: Kwa maana
  rationale: Hudumisha uhusiano wa maelezo na mstari uliotangulia.
- source_word: μὲν ... δὲ
  choice: ingawa ... lakini
  rationale: Ni utofautishaji wa asili katika Kiswahili unaowasilisha nguvu ya jozi ya chembe hizi.
theological_decisions:
- issue: Maana ya 'nipo kiroho'
  choice: Kirai kimehifadhiwa kama kauli ya Paulo kuhusu kutokuwapo kimwili lakini kuwapo kiroho pamoja nao katika kujali na kuhukumu.
  alternative: Kauli inaweza kueleweka kuwa inahusu kuwapo kwa Roho Mtakatifu au namna yenye nguvu zaidi ya kuwapo kwa kifumbo.
  rationale: Utofautishaji wa moja kwa moja kati ya σώματι na πνεύματι unaelekea kwa mwili na roho ya Paulo mwenyewe, lakini tafsiri haifafanui kwa kulazimisha namna ya kuwapo huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unafuata hoja ya Kigiriki lakini umewekwa kwa mtiririko unaoeleweka kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kitenzi kinachohusika.
