  source_fidelity: Tafsiri inawakilisha kwa uaminifu swali la balagha la τί γὰρ μοι pamoja na γάρ kupitia “Kwa maana, nina kazi gani,” na inahifadhi tofauti ya kimuktadha kati ya τοὺς ἔξω (“walio nje”) na τοὺς ἔσω (“walio ndani”). “Kuwahukumu” na “mnaowahukumu” zinaakisi κρίνειν/κρίνετε bila kupanua maana kuwa hukumu ya jumla ya kimaadili.
