  terminology: Jozi “walio nje/walio ndani” ni sahihi kwa muktadha wa jumuiya ya kanisa, bila kudai kuwa ni nafasi ya kimahali pekee. Neno “kuhukumu” linafaa katika muktadha wa nidhamu ya jumuiya. Tanbihi inaeleza rejeo la “walio ndani” kwa kiasi kinachofaa bila kuongeza msimamo wa kimadhehebu.
