  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: sw
  text: Kwa maana, nina kazi gani ya kuwahukumu walio nje? Je, si walio ndani mnaowahukumu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, walio ndani ya jumuiya ya kanisa.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Kwa maana, nina kazi gani
  rationale: Kirai hiki ni nahau inayouliza jambo hilo linamhusu Paulo kwa namna gani. ‘Nina kazi gani’ ni Kiswahili cha kawaida kinachohifadhi swali la balagha, huku ‘Kwa maana’ ikiwakilisha γάρ.
- source_word: τοὺς ἔξω
  choice: walio nje
  rationale: Hawa ni watu walio nje ya jumuiya ya kanisa, si watu walioko nje kimahali tu. Uchaguzi huu pia huhifadhi ulinganifu wa wazi na ‘walio ndani’.
- source_word: κρίνειν
  choice: kuwahukumu
  rationale: Katika muktadha huu kitenzi kinahusu kutoa hukumu katika nidhamu ya jumuiya. ‘Kuhukumu’ huhifadhi upana wa κρίνω bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: οὐχὶ
  choice: Je, si
  rationale: οὐχί huanzisha swali linalotarajia jibu la kukubali. ‘Je, si’ huhifadhi muundo na nguvu ya swali hilo kwa Kiswahili sanifu.
- source_word: τοὺς ἔσω
  choice: walio ndani
  rationale: Kirai hiki kinawataja walio ndani ya jumuiya ya kanisa na kudumisha tofauti ya kimakusudi kati ya ‘nje’ na ‘ndani’.
- source_word: ὑμεῖς κρίνετε
  choice: mnaowahukumu
  rationale: Huhifadhi hali elezi ya kitenzi cha sasa katika Kigiriki ndani ya swali la balagha. Muktadha unaweza kudokeza wajibu, lakini tafsiri haibadili kimya kimya kitenzi kuwa amri ya wazi.
theological_decisions:
- issue: Je, tofauti ya Paulo ni kati ya kanisa na ulimwengu katika hukumu ya kinidhamu?
  choice: Aya inatofautisha walio nje ya jumuiya ya kanisa na walio ndani yake, katika muktadha wa nidhamu ya jumuiya.
  alternative: Kuielewa kama tamko la jumla kuhusu kila aina ya hukumu ya kimaadili.
  rationale: Muktadha wa 1 Wakorintho 5:9–13 unahusu nidhamu ndani ya jumuiya. Tafsiri inadumisha tofauti ya ‘nje/ndani’ bila kuingiza dai pana lisilotamkwa hapa.
- issue: 'Nguvu ya ὑμεῖς κρίνετε: maelezo au wajibu'
  choice: ‘mnaowahukumu,’ inayohifadhi sarufi elezi na kuruhusu swali la balagha kudokeza wajibu katika muktadha.
  alternative: ‘mnaopaswa kuwahukumu,’ inayoweka wajibu wazi.
  rationale: Kigiriki kina kiashiria cha sasa, si amri iliyo wazi. Kwa hiyo tafsiri inadumisha mvutano kati ya tendo linaloelezwa na wajibu unaodokezwa na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nina kazi gani ya…?’ ni nahau ya kawaida na ya kueleweka; jozi ‘walio nje/walio ndani’ huhifadhi taswira na ulinganifu wa Kigiriki.
