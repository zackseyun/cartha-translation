base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: sw
  text: 'Kwa kweli, inaripotiwa kwamba kuna uasherati miongoni mwenu—tena uasherati wa namna ambayo haupatikani hata miongoni mwa Mataifa[a]: mtu mmoja ana mke wa baba yake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio Wayahudi”; tafsiri nyingine husema “wapagani.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ana mke wa baba yake”; yaani, ana uhusiano wa kingono na mke wa baba yake. Inawezekana mwanamke huyo alikuwa mama yake wa kambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Kwa kweli
  rationale: Katika muktadha huu neno hili linasisitiza mshangao wa Paulo kwamba jambo hilo kweli linaripotiwa; halimaanishi wingi au ukamilifu.
- source_word: ἀκούεται
  choice: inaripotiwa
  rationale: Kauli ya kutendwa hapa inaonyesha jambo linalosikika kama taarifa inayojulikana, si tendo la kusikia kwa masikio tu.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Usemi huu unaonyesha kuwa jambo hilo linatokea ndani ya jumuiya ya waamini wa Korintho.
- source_word: πορνεία
  choice: uasherati
  rationale: Ni neno la kawaida na lenye heshima katika Kiswahili kwa mwenendo mpana wa kingono ulio kinyume cha maadili; halibani maana kuwa uzinzi wa wanandoa pekee.
- source_word: τοιαύτη πορνεία
  choice: uasherati wa namna ambayo
  rationale: Tafsiri hii inadumisha msisitizo wa ubaya wa aina hiyo ya uasherati na inaunganisha kwa kawaida kifungu kinachoifuata.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: haupatikani hata miongoni mwa watu wa mataifa
  rationale: ‘Watu wa mataifa’ inadumisha tofauti ya Kiyahudi na isiyo ya Kiyahudi bila kuingiza dharau ya neno ‘wapagani.’ Kitenzi ‘haupatikani’ kinakamilisha kwa Kiswahili wazo ambalo limeachwa bila kitenzi katika Kigiriki.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: mke wa baba yake
  rationale: Hii inafuata usemi wa Kigiriki bila kumtambulisha moja kwa moja kuwa mama wa kambo, jambo ambalo linawezekana lakini halijasemwa kwa istilahi maalumu.
- source_word: ἔχειν
  choice: ana
  rationale: Kitenzi hiki kimetafsiriwa kwa ufupi kama kilivyo katika Kigiriki, huku dokezo likifafanua kuwa katika muktadha huu kinamaanisha kuwa na uhusiano wa kingono.
theological_decisions:
- issue: Maana ya ἔθνεσιν
  choice: watu wa mataifa
  alternative: watu wasio Wayahudi; wapagani
  rationale: Chaguo hili linatunza maana ya kikabila na kidini ya neno la Kigiriki bila kulifanya liwe la dharau zaidi kuliko chanzo.
- issue: Utambulisho wa γυναῖκα τοῦ πατρός
  choice: mke wa baba yake
  alternative: mama yake wa kambo
  rationale: Huenda mwanamke huyo alikuwa mama yake wa kambo, lakini Kigiriki kinasema tu ‘mke wa baba yake’; tafsiri kuu haiongezi uhakika usiokuwamo katika chanzo.
- issue: Maana ya kimuktadha ya ἔχειν
  choice: ana, pamoja na ufafanuzi katika tanbihi
  alternative: ana uhusiano wa kingono na; anaishi na
  rationale: ‘Ana’ inadumisha ufupi na usemi wa staha wa chanzo, huku tanbihi ikizuia maana hiyo kueleweka kama umiliki wa kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha sauti ya mshangao na ukali wa Paulo bila kutumia lugha chafu au kuongeza maelezo yasiyothibitishwa na chanzo.
