  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: sw
  text: Sikumaanisha hata kidogo watu wa ulimwengu huu wanaoishi katika uasherati, au wenye tamaa na wanyang’anyi,[a] au waabudu sanamu;[b] la sivyo ingewabidi mtoke ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waporaji” au “watoza kwa nguvu”; neno la Kigiriki linaweza kumaanisha watu wanaonyakua mali ya wengine kwa nguvu au kwa kuwanyonya.
    reason: lexical_alternative
  - marker: b
    text: Paulo anafafanua kwamba hakumaanisha waamini waepuke kabisa watu wote wenye mwenendo mbaya walio nje ya kanisa; linganisha 1 Wakorintho 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Sikumaanisha hata kidogo
  rationale: Katika muktadha Paulo anafafanua alichomaanisha katika agizo lake la awali. Kauli hii ya Kiswahili inaonyesha ukanushaji wenye msisitizo bila kuondoa nguvu ya ufafanuzi huo.
- source_word: πόρνοις
  choice: watu ... wanaoishi katika uasherati
  rationale: Neno linataja watu wanaojihusisha na mwenendo mpotovu wa kingono. Tafsiri hii ni wazi, ya kisasa, na inadumisha umahususi wa dhambi ya kingono.
- source_word: τοῦ κόσμου τούτου
  choice: wa ulimwengu huu
  rationale: κόσμος hapa inaelekea kumaanisha jamii ya wanadamu nje ya jumuiya ya kanisa. Kauli hii ni ya kawaida na inakaribia muundo wa Kigiriki.
- source_word: πλεονέκταις
  choice: wenye tamaa
  rationale: Neno linamaanisha watu wanaotaka kupata zaidi kwa uchoyo, mara nyingi kwa kuwadhulumu wengine. 'Wenye tamaa' ni lugha inayoeleweka kwa urahisi, huku muktadha na neno linalofuata vikionyesha upande wa unyonyaji.
- source_word: ἅρπαξιν
  choice: wanyang’anyi
  rationale: Neno linaweza kumaanisha watu wanaopora au kujipatia mali ya wengine kwa nguvu au kwa unyonyaji. 'Wanyang’anyi' hudumisha picha ya kunyakua, huku tanbihi ikihifadhi uwezekano wa 'waporaji' au 'watoza kwa nguvu'.
- source_word: εἰδωλολάτραις
  choice: waabudu sanamu
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida, na inayoeleweka zaidi katika Kiswahili cha sasa kuliko nomino ya kiufundi.
- source_word: ἐπεὶ
  choice: kwa maana kama ndivyo
  rationale: Hapa ἐπεί inaanzisha matokeo ambayo yangefuata kama agizo la awali lingeeleweka kuwa la jumla kabisa. Kauli hii huwasilisha hoja hiyo ya kimantiki kwa Kiswahili asilia.
- source_word: ὠφείλετε
  choice: ingewabidi
  rationale: Ingawa kitenzi ni cha hali elekezi ya wakati uliopita kwa umbo, katika hoja hii kinaonyesha ulazima unaotokana na dhana iliyotangulia. 'Ingewabidi' huwasilisha maana hiyo kwa ufasaha.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: mtoke ulimwenguni
  rationale: Tafsiri hii inadumisha picha kali kwamba kujitenga na watu hao wote kungehitaji kuondoka kabisa katika ulimwengu.
theological_decisions:
- issue: Upeo wa kujitenga unaoagizwa katika muktadha
  choice: Paulo anakataa kwamba agizo lake la awali lilimaanisha kujitenga kabisa na watu wote wenye mwenendo mbaya walio nje ya kanisa.
  alternative: Paulo anaagiza waamini wajiondoe kabisa katika mahusiano yote na watu wenye mwenendo mbaya.
  rationale: 'Aya yenyewe inaweka mpaka kwa maana ya agizo la awali: kama lingehusu watu wote wa aina hiyo katika jamii, waamini wangelazimika kutoka ulimwenguni. Tafsiri inadumisha ufafanuzi huu bila kuingiza wazo la kujitenga na jamii.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha msisitizo wa ufafanuzi na matokeo ya kimantiki ya maandishi ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
