base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: sw
  text: Kujisifu kwenu si jambo jema. Je, hamjui kwamba chachu kidogo huchachua donge lote[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unga wote uliokandwa.”
    reason: Njia nyingine ya kutafsiri φύραμα, ambayo humaanisha unga uliokwisha changanywa au kukandwa.
lexical_decisions:
- source_word: καλὸν
  choice: kuzuri
  rationale: Neno hili linatathmini kujisifu kwao kuwa jambo lisilo jema au lisilofaa; “kuzuri” ni la moja kwa moja na la kawaida katika Kiswahili.
- source_word: καύχημα
  choice: kujisifu
  rationale: Katika muktadha huu nomino inahusu tendo au hali ya kujisifu. Kiswahili hutumia kitenzi-jina “kujisifu” kwa njia ya asili.
- source_word: οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Hii inadumisha swali la balagha na mtindo wa kawaida wa Paulo bila kulipanua kuwa “hamtambui” au “hamwelewi.”
- source_word: μικρὰ ζύμη
  choice: chachu kidogo
  rationale: Hifadhi taswira ya kuoka mikate na nguvu ya msemo wa kwamba kiasi kidogo huathiri mchanganyiko wote.
- source_word: ὅλον τὸ φύραμα
  choice: donge lote la unga
  rationale: φύραμα ni unga uliokwisha changanywa au kukandwa. “Donge lote la unga” ni wazi kwa msomaji wa sasa na huhifadhi wazo la kitu kizima.
- source_word: ζυμοῖ
  choice: huchachua
  rationale: Kitenzi hiki kinahusiana moja kwa moja na “chachu” na kinaonyesha chachu kuenea katika donge lote.
theological_decisions:
- issue: Taswira ya chachu
  choice: Taswira yenyewe imedumishwa bila kufafanuliwa ndani ya aya kuwa dhambi au ushawishi mbaya.
  alternative: Kupanua kwa tafsiri kama “dhambi kidogo huliharibu kanisa lote.”
  rationale: Aya inatoa msemo wa mfano, na muktadha ndio unaoonyesha matumizi yake. Kuutafsiri moja kwa moja kuwa dhambi kungeondoa upana na mvutano wa lugha ya Paulo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Je, hamjui kwamba...” unahifadhi swali la balagha; uradidi wa “chachu/huchachua” unadumisha uhusiano wa maneno katika Kigiriki.
