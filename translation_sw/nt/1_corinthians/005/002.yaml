reference: 1 Corinthians 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: sw
  text: Nanyi mmejivuna, na je, hamkupaswa badala yake kuomboleza, ili yule aliyetenda jambo hili aondolewe miongoni mwenu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: mmejivuna
  rationale: Kitenzi hiki kinaonyesha hali iliyoendelea ya kujawa na kiburi. “Mmejivuna” ni Kiswahili cha kawaida na chenye nguvu, ingawa sitiari ya moja kwa moja ya ‘kuvimba’ haisikiki kwa kawaida katika Kiswahili hapa.
- source_word: οὐχὶ μᾶλλον
  choice: Je, hamkupaswa badala yake
  rationale: Muundo huu unahifadhi swali la kukemea na tofauti kati ya mwenendo wao na mwitikio uliotarajiwa.
- source_word: ἐπενθήσατε
  choice: kuomboleza
  rationale: Neno hili linaonyesha huzuni nzito inayofanana na maombolezo, si kusikitika kwa kawaida tu.
- source_word: ἵνα ἀρθῇ
  choice: ili ... aondolewe
  rationale: “Ili” linaonyesha kusudi au matokeo yaliyokusudiwa, na umbo tendwa “aondolewe” linahifadhi passive ya Kigiriki bila kumtaja wazi mtendaji.
- source_word: ἐκ μέσου ὑμῶν
  choice: miongoni mwenu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau inayomaanisha kuondolewa kutoka katika jumuiya yao.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: yule aliyetenda jambo hili
  rationale: Kauli hii inamtambulisha mtendaji bila kuongeza maelezo yasiyokuwamo; “aliyetenda jambo hili” ni ya heshima na ina uzito unaofaa.
theological_decisions:
- issue: Asili ya kuondolewa kwa mkosaji
  choice: aondolewe miongoni mwenu
  alternative: atengwe na ushirika; au aondolewe na Mungu
  rationale: ἀρθῇ ni kauli tendwa isiyomtaja mtendaji. Muktadha unaelekea kwenye hatua ya kinidhamu ya jumuiya, lakini tafsiri haifafanui moja kwa moja kuwa ni kutengwa na ushirika wala tendo la Mungu, hivyo inadumisha upana wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la kukemea limehifadhiwa, pamoja na lugha nzito ya maombolezo na kutotajwa kwa mtendaji wa tendo la kuondoa.
