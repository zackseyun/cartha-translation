  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: sw
  text: Lakini Mungu huwahukumu walio nje[a][b]. Mwondoeni huyo mwovu kutoka miongoni mwenu wenyewe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa nje.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki kiko katika wakati wa sasa (“huwahukumu”), ingawa kwa kuzingatia muktadha baadhi ya tafsiri husema “atawahukumu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Mfukuzeni mtu mwovu kutoka kati yenu.” Maneno haya yanaakisi kauli za Kumbukumbu la Torati kuhusu kuondoa uovu kutoka katika jumuiya ya agano.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: walio nje
  rationale: Kirai hiki kinawataja watu walio nje ya jumuiya ya waamini bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ya kiasi kati ya wajibu wa jumuiya kwa walio ndani na hukumu ya Mungu kwa walio nje.
- source_word: κρίνει
  choice: huwahukumu
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa kama kauli ya jambo la kawaida au la kudumu; ‘huwa-’ ni muundo wa kawaida wa Kiswahili kwa maana hiyo.
- source_word: ἐξάρατε
  choice: Mwondoeni
  rationale: Amri hii inataka hatua ya moja kwa moja na ya uamuzi, bila kuingiza istilahi za baadaye za kikanisa.
- source_word: τὸν πονηρὸν
  choice: huyo mwovu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na katika muktadha kinamrejelea mkosaji mahususi; ‘huyo mwovu’ ni ya asili na haiwekei neno hilo maana pana kuliko lilivyo.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: kutoka miongoni mwenu wenyewe
  rationale: Tafsiri hii inaonyesha kuondolewa kutoka ndani ya jumuiya na pia inahifadhi msisitizo wa αὐτῶν.
theological_decisions:
- issue: Asili ya amri kuhusu nidhamu ya jumuiya
  choice: Amri inaagiza jumuiya imwondoe mkosaji huyo kutoka miongoni mwao, huku hukumu ya walio nje ikiachwa kwa Mungu.
  alternative: Maneno hayo yanaweza kueleweka kwa upana zaidi kuwa ni kuondoa uovu katika jumuiya bila kutaja wazi utaratibu rasmi wa kumtenga mtu.
  rationale: Muktadha wa 1 Wakorintho 5 unamhusu mkosaji mahususi aliye ndani ya jumuiya. Hata hivyo, tafsiri haiongezi istilahi rasmi za kikanisa ambazo hazipo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Huwahukumu’ ni ya kawaida na inaonyesha kauli ya kudumu; ‘Mwondoeni’ ni wazi bila kuwa ya kiufundi kupita kiasi. Viashiria vya tanbihi vimewekwa karibu na maneno vinavyofafanua.
