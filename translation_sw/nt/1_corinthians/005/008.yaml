id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: sw
  text: Kwa hiyo, na tuadhimishe sikukuu[a], si kwa chachu ya zamani, wala kwa chachu ya nia mbaya na uovu, bali kwa mikate isiyotiwa chachu ya unyoofu na kweli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na tusherehekee” au “na tushike sikukuu.” Kigiriki kinaendeleza taswira ya sikukuu ya Pasaka kutoka mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, Kigiriki kinasema “kwa vitu visivyotiwa chachu vya unyoofu na kweli.” Neno “mikate” limeongezwa ili kuifanya taswira ya Pasaka iwe wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na ni usemi wa kawaida wa Kiswahili.
- source_word: ἑορτάζωμεν
  choice: na tuisherehekee sikukuu
  rationale: Huhifadhi hali ya kuhimiza ya kiima cha wingi pamoja na taswira ya kushika sikukuu ya Pasaka iliyoanza katika mstari uliotangulia.
- source_word: ζύμῃ παλαιᾷ
  choice: kwa chachu ya zamani
  rationale: ‘Chachu’ ni neno la kawaida na linaloeleweka, huku ‘ya zamani’ ikihifadhi tofauti ya kisitiari na maisha mapya.
- source_word: κακίας καὶ πονηρίας
  choice: uovu na ubaya
  rationale: Jozi hii huhifadhi nomino mbili zinazohusiana bila kuzifanya kuwa maana moja; ‘uovu’ huonyesha hali mbaya ya kimaadili na ‘ubaya’ huonyesha utendaji au tabia yenye madhara.
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: bali kwa mikate isiyotiwa chachu
  rationale: Kigiriki kina kivumishi kilichotumiwa kama nomino, yaani ‘vitu visivyotiwa chachu’; kutaja mikate hufanya taswira ya Pasaka iwe wazi katika Kiswahili.
- source_word: εἰλικρινείας
  choice: unyoofu
  rationale: Huonyesha uhalisi wa moyo usiochanganyika na hila, kwa lugha ya sasa na yenye hadhi.
- source_word: ἀληθείας
  choice: kweli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi ulinganifu wake na ‘unyoofu’.
theological_decisions:
- issue: Taswira ya Pasaka na sikukuu katika himizo la Paulo
  choice: na tuisherehekee sikukuu; kwa mikate isiyotiwa chachu
  alternative: na tusherehekee; kwa vitu visivyotiwa chachu
  rationale: Muktadha wa karibu humtaja Kristo kuwa Pasaka iliyotolewa dhabihu; kwa hiyo, lugha ya sikukuu na mikate isiyotiwa chachu huhifadhi hoja ya Paulo bila kuigeuza kuwa himizo la jumla tu. Tanbihi huhifadhi pia uwezekano mpana wa kitenzi na umbo lisilotaja ‘mikate’ waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa chachu dhidi ya mikate isiyotiwa chachu umehifadhiwa, pamoja na himizo la kijumuiya.
