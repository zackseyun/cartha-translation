revisions:
- from: Kwa hiyo, na tuisherehekee sikukuu[a], si kwa chachu ya zamani, wala kwa chachu ya uovu na ubaya, bali kwa mikate isiyotiwa chachu ya unyoofu na kweli.[b]
  to: Kwa hiyo, na tuadhimishe sikukuu[a], si kwa chachu ya zamani, wala kwa chachu ya nia mbaya na uovu, bali kwa mikate isiyotiwa chachu ya unyoofu na kweli.[b]
  rationale: Revision improves idiomatic Swahili for the festival exhortation, distinguishes the two Greek vice terms in their original order, and corrects the wording of the lexical-alternative footnote. It retains the source’s Passover metaphor and transparently marks the supplied noun “mikate.”
