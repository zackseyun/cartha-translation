  text: Niliwaandikia katika ile barua[a] kwamba msichangamane[b] na watu wanaojulikana kwa uasherati[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika barua yangu.” Kigiriki kinaweza kurejelea barua ya awali ambayo Paulo alikuwa amewatumia, au barua hii yenyewe katika sehemu ya awali.
    reason: alternative_reading
