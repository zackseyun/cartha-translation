lexical_decisions:
- source_word: Ἔγραψα
  choice: Niliwaandikia
  rationale: Kitenzi cha wakati uliopita (aoristi) kimetafsiriwa kwa wakati uliopita wa Kiswahili; kiambishi -wa- kinawakilisha ὑμῖν kwa kawaida na kwa uwazi.
- source_word: ὑμῖν
  choice: -wa- (katika “Niliwaandikia”)
  rationale: Yambwa isiyo ya moja kwa moja imeunganishwa ndani ya kitenzi, kama ilivyo kawaida katika Kiswahili sanifu.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: katika ile barua
  rationale: “Ile barua” huonyesha barua mahususi inayojulikana kwa waandikiwa bila kuamua ikiwa ni barua ya awali au barua hii yenyewe.
- source_word: μὴ συναναμίγνυσθαι
  choice: kwamba msishirikiane
  rationale: Huwasilisha maudhui ya agizo la Paulo na wazo la kutangamana au kuwa na ushirika wa kijamii, kwa Kiswahili cha sasa na cha kawaida.
- source_word: πόρνοις
  choice: na watu wanaoishi katika uasherati
  rationale: Nomino hii ya wingi inarejelea watu wanaotambulishwa na mwenendo wa uasherati. Kauli hii ni ya kueleweka na haibani maana kwenye tendo moja tu.
theological_decisions:
- issue: Barua inayorejelewa na ἐν τῇ ἐπιστολῇ
  choice: Kutaja “ile barua” bila kubainisha ni barua gani
  alternative: “barua yangu ya awali” au sehemu ya awali ya barua hii
  rationale: Kigiriki kinataja barua mahususi lakini hakiamui wazi ikiwa Paulo anarejelea barua nyingine ya awali au barua hii. Tafsiri inahifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ile barua” huhifadhi umahususi na utata wa kirai cha Kigiriki; “watu wanaoishi katika uasherati” huepuka neno la kizamani au maana nyembamba kupita kiasi.
