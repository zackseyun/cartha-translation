id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: sw
  text: Lakini sasa niliwaandikia kwamba msishirikiane na yeyote anayeitwa ndugu ikiwa ni mwasherati, au mwenye tamaa, au mwabudu sanamu, au mtukanaji, au mlevi, au mnyang’anyi. Mtu wa namna hiyo, hata msile naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Lakini sasa niliwaandikia
  rationale: Huhifadhi kitenzi cha wakati uliopita cha Kigiriki na utofautishaji wa νῦν δέ; katika muktadha kinaelekea kwa yale Paulo amefafanua sasa katika barua.
- source_word: μὴ συναναμίγνυσθαι
  choice: msishirikiane
  rationale: Hutoa maana ya kutokuchangamana au kuwa na ushirika wa karibu kwa Kiswahili cha kawaida bila kudai kutengwa na kila aina ya mawasiliano.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: anayeitwa ndugu
  rationale: Ni tafsiri ya karibu inayohifadhi uwezekano wa maana ya mtu anayejulikana au anayedai kuwa ndugu katika jumuiya ya waamini.
- source_word: πόρνος
  choice: mwasherati
  rationale: Neno pana na la kawaida kwa mtu mwenye mwenendo wa uasherati.
- source_word: πλεονέκτης
  choice: mwenye tamaa
  rationale: Huhifadhi wazo la uchu wa kupata zaidi; halifungwi tu kwenye fedha.
- source_word: λοίδορος
  choice: mtukanaji
  rationale: Hueleza mtu anayewatukana au kuwashambulia wengine kwa maneno, kwa usahihi zaidi kuliko neno pana 'mnyanyasaji'.
- source_word: μέθυσος
  choice: mlevi
  rationale: Tafsiri ya moja kwa moja na ya kawaida kwa mtu mwenye tabia ya kulewa.
- source_word: ἅρπαξ
  choice: mnyang’anyi
  rationale: Huhifadhi maana ya mtu anayejipatia mali kwa unyang’anyi au unyonyaji; ni kali kuliko 'mdanganyifu' pekee.
- source_word: μηδὲ συνεσθίειν
  choice: hata msile naye
  rationale: Hutoa marufuku ya Kigiriki moja kwa moja na kwa lugha ya asili ya Kiswahili.
theological_decisions:
- issue: Maana ya mtu 'anayeitwa ndugu'
  choice: anayeitwa ndugu
  alternative: anayedai kuwa ndugu
  rationale: Chaguo hili halihukumu kimbele kama mtu huyo ni mwamini wa kweli au ni mwenye dai tu; linahifadhi utata wa ὀνομαζόμενος.
- issue: Upeo wa kutoshirikiana
  choice: msishirikiane
  alternative: msichangamane kabisa
  rationale: Kitenzi kinaonyesha kujiepusha na ushirika wa kawaida au wa karibu, lakini muktadha hauhitaji kuongezwa dai kwamba kila mawasiliano yamekatazwa.
- issue: Kula pamoja
  choice: hata msile naye
  alternative: hata msishiriki chakula cha Bwana naye
  rationale: Matini yenyewe haisemi wazi ikiwa ni mlo wa kawaida, mlo wa jumuiya, au Meza ya Bwana; tafsiri haifungi maana kwenye ibada maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetolewa kwa majina ya watu wenye mwenendo unaoendelea, kama ilivyo katika Kigiriki. Sentensi ya mwisho imetenganishwa ili iwe wazi na isomeke kwa kawaida bila kubadili mkazo wa μηδέ.
