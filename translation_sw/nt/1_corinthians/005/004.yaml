base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: sw
  text: Kwa jina la Bwana wetu Yesu[a], mkiwa mmekusanyika, na roho yangu ikiwa pamoja nanyi, pamoja na nguvu ya Bwana wetu Yesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnapokusanyika, na roho yangu ikiwa pamoja nanyi.” Kigiriki kimetumia muundo wa genitivi huru uliofupishwa katika sentensi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Kwa jina la
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoonyesha kutenda chini ya jina na mamlaka ya Yesu, huku ikidumisha taswira ya Kigiriki.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Agano Jipya kwa κύριος na linahifadhi uzito wa cheo hiki.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: συναχθέντων ὑμῶν
  choice: mtakapokuwa mmekusanyika
  rationale: Kirai huru cha jenitivi chenye kitenzi-shirikishi cha wakati uliopita kimetolewa kama kishazi cha wakati; tafsiri hii ni ya asili na haikulazimishi wazo la “baada ya” kukusanyika.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: roho yangu ikiwa pamoja nanyi
  rationale: Kigiriki kimebanwa kisarufi. Kuongeza “ikiwa pamoja nanyi” kunafafanua ushiriki wa Paulo usio wa kimwili bila kueleza namna yake kimetafizikia.
- source_word: σὺν
  choice: pamoja na
  rationale: Inadumisha maana ya kuandamana au kuwapo pamoja kwa uwazi katika muundo huu.
- source_word: δυνάμει
  choice: nguvu
  rationale: “Nguvu” inaonyesha uwezo wenye matokeo katika hatua inayozungumziwa, bila kuipunguza kuwa mamlaka rasmi pekee.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ya Bwana wetu Yesu
  rationale: Muundo wa umilikaji umehifadhiwa ili kuacha wazi kama nguvu hiyo ni mali yake, inatoka kwake, au inatenda kwa niaba yake.
theological_decisions:
- issue: Namna roho ya Paulo ilivyokuwa pamoja na kusanyiko
  choice: roho yangu ikiwa pamoja nanyi
  alternative: nia yangu ikiwa pamoja nanyi; au kuwapo kwa Paulo kwa namna ya kifumbo kilichoelezwa zaidi
  rationale: Andiko linathibitisha ushiriki wa Paulo usio wa kimwili lakini halielezi utaratibu wake; tafsiri haubadili “roho” kuwa nia wala kuingiza fundisho maalumu kuhusu kuwapo kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kwa jina la” ni nahau ya kawaida kuliko “katika jina la.” Koma ya mwisho imehifadhiwa kwa sababu mstari huu ni sehemu ya sentensi inayoendelea katika mstari unaofuata.
