id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: sw
  text: Hata kama mimi si mtume kwa wengine, hakika mimi ni mtume kwenu, kwa maana ninyi ndio muhuri[a] wa utume wangu katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uthibitisho” wa utume wangu. Kigiriki kinasema “muhuri,” kikihifadhi taswira ya kitu kinachothibitisha uhalisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: mtume
  rationale: Katika Paulo akijirejelea, neno hili linaonyesha wito na mamlaka maalumu ya kitume, si mjumbe wa kawaida tu.
- source_word: ἀλλά γε
  choice: hakika mimi ni mtume kwenu
  rationale: “Hakika” linaonyesha msisitizo wa γε, huku muundo mzima ukihifadhi tofauti inayotolewa na ἀλλά kwa Kiswahili cha kawaida.
- source_word: σφραγίς
  choice: muhuri
  rationale: “Muhuri” huhifadhi taswira ya kitu kinachothibitisha uhalisi; katika muktadha huu waumini wa Korintho wanathibitisha utume wa Paulo.
- source_word: ἀποστολή
  choice: utume
  rationale: Neno “utume” linaonyesha kazi, wito na mamlaka ya kitume ya Paulo kwa ufupi na kwa lugha ya kawaida ya kibiblia.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Tafsiri hii huhifadhi usemi wa Paulo na haifungi maana yake kuwa ya wakala (“kwa Bwana”) pekee; inaelekeza kwenye uhusiano wao na Bwana.
- source_word: ἄλλοις
  choice: kwa wengine
  rationale: Kihusishi “kwa” kinaonyesha kwa njia ya kawaida uhusiano wa utume wa Paulo na watu wengine.
theological_decisions:
- issue: Nguvu ya dai la Paulo kuhusu utume wake
  choice: Kauli ya “hata kama” inakubali kwa hoja kwamba wengine huenda wasimtambue kuwa mtume, lakini Paulo anasisitiza kwamba Wakorintho wenyewe ni uthibitisho wa utume wake.
  alternative: Paulo anakiri kwamba yeye si mtume kabisa kwa wengine na kwamba utume wake umewekewa mipaka kwa Wakorintho pekee.
  rationale: Muundo wa sentensi na hoja ya kifungu hiki ni wa kujitetea na wa balagha. Paulo hatangazi mpaka halisi wa utume wake, bali anatumia kuwapo kwa kanisa la Korintho kama uthibitisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hata kama” huwasilisha nguvu ya concessive ya εἰ katika muktadha, na “hakika” huhifadhi msisitizo bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa baada ya “muhuri,” neno ambalo tanbihi inalifafanua.
