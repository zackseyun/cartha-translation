  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: sw
  text: Lakini ninauadhibu mwili wangu kwa ukali[a] na kuufanya mtumwa wangu[b], nisije nikakataliwa[c] baada ya kuwahubiria wengine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naupiga mwili wangu.” Kitenzi cha Kigiriki kwa maana halisi hurejelea kupiga chini ya jicho; hapa kimetumiwa kwa sitiari kumaanisha kuutendea mwili kwa nidhamu kali.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuufanya mtumwa” au “kuutia utumwani.”
    reason: lexical_alternative
  - marker: c
    text: Au, “nisikubaliwe,” “nionekane sistahili,” au, kwa kuzingatia picha ya mashindano ya riadha, “nisiondolewe mashindanoni.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: nautiisha
  rationale: Kitenzi hiki kihalisi kinaweza kumaanisha kupiga chini ya jicho, lakini hapa kimetumiwa kwa njia ya sitiari kuhusu nidhamu kali ya mwili. “Nautiisha” ni Kiswahili cha sasa na cha heshima kinachodumisha ukali wa kujidhibiti bila kufanya kujiumiza kuwa maana ya lazima.
- source_word: σῶμα
  choice: mwili wangu
  rationale: Neno halisi “mwili” linahifadhiwa badala ya kulipanua kuwa nafsi yote, kwa kuwa Paulo anautaja mwili waziwazi kuwa kitu anachokitiisha.
- source_word: δουλαγωγῶ
  choice: kuufanya mtumwa wangu
  rationale: Kitenzi kina maana ya kumfanya mtu mtumwa au kumweka katika utumwa. Tafsiri hii inadumisha nguvu ya sitiari kuliko usemi laini kama “kuudhibiti,” huku kiwakilishi “wangu” kikionyesha kwamba mwili unalazimishwa kumtumikia msemaji.
- source_word: μή πως
  choice: ili ... nisije
  rationale: Muundo huu wa Kiswahili unaeleza kusudi hasi pamoja na hofu ya uwezekano, sawasawa na tahadhari iliyomo katika μή πως.
- source_word: ἄλλοις
  choice: wengine
  rationale: Baada ya kitenzi cha kuhubiri, “kuwahubiria wengine” ni usemi wa kawaida wa Kiswahili unaoonyesha walengwa wa tangazo.
- source_word: κηρύξας
  choice: baada ya kuwahubiria
  rationale: Kishirikishi cha aoristi kinatangulia tendo kuu; “baada ya” kinaonyesha wazi uhusiano huo wa wakati. “Kuhubiria” kinafaa kwa tangazo la hadharani katika muktadha huu.
- source_word: ἀδόκιμος
  choice: nikakataliwa
  rationale: Neno linaweza kumaanisha kutokubaliwa baada ya kupimwa au kutostahili. “Kukataliwa” linahifadhi uzito na upana wa maana ya Kigiriki; tanbihi inaonyesha uwezekano wa “kuondolewa mashindanoni,” unaolingana zaidi moja kwa moja na sitiari ya riadha.
- source_word: γένωμαι
  choice: nisije nikakataliwa
  rationale: Muundo wa “nisije nika-” unaonyesha matokeo yanayohofiwa na uwezekano wa baadaye unaowasilishwa na subjunctive.
- source_word: ἀλλὰ
  choice: Lakini
  rationale: “Lakini” linaonyesha kwa kawaida tofauti yenye nguvu na maelezo yaliyotangulia kuhusu kujizuia kwa mwanariadha.
theological_decisions:
- issue: Maana ya hofu ya Paulo ya kuwa ἀδόκιμος
  choice: “Nikakataliwa,” pamoja na tanbihi “nikaondolewa mashindanoni,” bila kubainisha aina ya mwisho ya kukataliwa.
  alternative: Kukataliwa na Mungu katika maana ya mwisho ya wokovu, au kuondolewa tu katika huduma na kukosa thawabu.
  rationale: Muktadha wa karibu una picha ya mashindano ya riadha, lakini neno la Kigiriki halibainishi peke yake ikiwa kukataliwa huko kunahusu wokovu wa mwisho, huduma, au thawabu. Tafsiri inadumisha uzito na mvutano huo bila kuamua mjadala wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo “nisije nikakataliwa” ni wa kawaida katika maandishi yenye uzito. Lugha ya utumwa imehifadhiwa kwa sababu ni sehemu muhimu ya sitiari ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu baada ya vifungu vinavyohusika.
