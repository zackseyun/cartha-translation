id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: sw
  text: Je, sisi hatuna haki ya kusafiri pamoja na mke aliye dada katika imani[a], kama wanavyofanya mitume wengine, ndugu wa Bwana, na Kefa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “dada, mke”—yaani, mke ambaye ni mwamini mwenzao.
    reason: Muundo wa Kigiriki una nomino zote mbili na unaweza kutafsiriwa moja kwa moja kuwa ‘dada, mke.’
lexical_decisions:
- source_word: ἐξουσίαν
  choice: haki
  rationale: Katika hoja hii neno linamaanisha haki halali ya kitume, si mamlaka kwa maana ya jumla.
- source_word: ἀδελφὴν γυναῖκα
  choice: mke aliye dada katika imani
  rationale: Tafsiri hii inaonyesha kuwa mwanamke huyo ni mke na pia dada katika jumuiya ya waamini. Inaepuka kauli isiyo ya kawaida na inayoweza kupotosha ya ‘dada kama mke,’ huku tanbihi ikihifadhi muundo halisi wa Kigiriki.
- source_word: περιάγειν
  choice: kusafiri pamoja na
  rationale: Katika muktadha huu kitenzi kinahusu kuwa na mtu anayeandamana nawe katika safari za huduma; kauli hii ni ya kawaida na wazi kwa Kiswahili cha sasa.
- source_word: ὡς καὶ
  choice: kama wanavyofanya
  rationale: Kigiriki kinalinganisha haki ya Paulo na mwenendo wa watu waliotajwa. Kitenzi ‘wanavyofanya’ kinadokezwa na muundo wa Kigiriki na hufanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: mitume wengine
  rationale: Huwatofautisha mitume waliobaki na Paulo na Barnaba waliotajwa katika muktadha, kwa usemi wa kawaida wa Kiswahili.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: ndugu wa Bwana
  rationale: Huhifadhi usemi wa Kigiriki bila kuamua kwa tafsiri aina kamili ya uhusiano wao wa kifamilia na Bwana.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: Huhifadhi namna ya jina la Kiaramu iliyotoholewa katika maandishi ya Kigiriki badala ya kuibadilisha kuwa Petro.
theological_decisions:
- issue: Maana ya ‘ndugu wa Bwana’
  choice: Kutafsiri usemi huo moja kwa moja bila kufafanua aina ya undugu
  alternative: Ndugu wa kuzaliwa wa Yesu; ndugu wa kambo; au jamaa wa karibu
  rationale: Usemi wa Kigiriki unawaita ‘ndugu wa Bwana’ lakini hauamui peke yake mijadala ya baadaye kuhusu uhusiano wao kamili wa kifamilia.
- issue: Maana ya ἀδελφὴν γυναῖκα
  choice: mke aliye dada katika imani
  alternative: dada kama mke; au mwanamke mwamini anayeandamana nao
  rationale: Jozi ya nomino inaeleweka kwa kawaida kuwa mke ambaye pia ni mwamini. Tafsiri hii haimfanyi kuwa mwandamani wa kike tu, lakini tanbihi inaonyesha muundo wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limehifadhiwa, pamoja na jina Kefa na kutokufafanuliwa kwa aina ya undugu wa ‘ndugu wa Bwana.’
