id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: sw
  text: Ikiwa wengine wanayo haki hii juu yenu,[a] je, sisi hatuna haki hiyo hata zaidi? Lakini hatukuitumia haki hiyo. Badala yake, tunavumilia kila kitu ili tusiwekee Injili ya Masihi[b] kizuizi chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dai hili kwenu” au “mamlaka hii kuhusiana nanyi.” Huenda kirai cha Kigiriki kinamaanisha haki ya mitume kupokea msaada wa kimwili kutoka kwa Wakorintho.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Injili ya Kristo.” Hapa “Masihi” limetumiwa kwa sababu Χριστός linafanya kazi kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: haki
  rationale: Katika muktadha huu neno hilo linamaanisha ustahili halali wa mitume kupokea msaada wa mahitaji yao; “haki” ni ya kawaida na wazi zaidi kuliko “mamlaka.”
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: haki hii juu yenu
  rationale: Kirai kinaeleza haki inayohusiana na Wakorintho, yaani dai la kupokea msaada kutoka kwao, wala si haki inayomilikiwa nao.
- source_word: μετέχουσιν
  choice: wanayo
  rationale: Katika kirai hiki maana yake ni kuwa na sehemu au kunufaika na haki hiyo; “wanayo haki hii” ni Kiswahili asilia kinachoeleza wazo hilo bila ugumu.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: je, sisi hatuna haki hiyo hata zaidi?
  rationale: Huhifadhi swali la balagha na nguvu ya ulinganisho ya μᾶλλον kwa Kiswahili cha kawaida.
- source_word: ἐχρησάμεθα
  choice: hatukuitumia
  rationale: χράομαι hapa ni kutumia au kujipatia manufaa ya kitu; kitenzi hiki kinaeleza kwa uwazi kutotumia haki hiyo.
- source_word: πάντα στέγομεν
  choice: tunavumilia kila kitu
  rationale: στέγω hapa ina maana ya kustahimili taabu au hali ngumu, si kufunika; “tunavumilia” huhifadhi hali ya kuendelea iliyomo katika kitenzi cha sasa.
- source_word: τινα ἐγκοπὴν
  choice: kizuizi chochote
  rationale: ἐγκοπή ni jambo linalozuia au kukwamisha maendeleo; “kizuizi chochote” ni fasaha na kinafaa katika muktadha wa kuenezwa kwa Injili.
- source_word: δῶμεν
  choice: tusiweke
  rationale: Muundo wa ἵνα μή unaonyesha kusudi hasi; Kiswahili “ili tusiweke” huwasilisha kwa kawaida wazo la kutosababisha au kutoweka kizuizi.
- source_word: εὐαγγελίῳ
  choice: Injili
  rationale: “Injili” ni istilahi iliyozoeleka katika Kiswahili cha kibiblia na inaeleweka kwa wasomaji wa kawaida.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo, kwa hiyo “Masihi” huhifadhi maana yake ya kimasiya badala ya kuifanya jina tu.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika τοῦ Χριστοῦ neno hilo linaweza kusikika kama cheo kinachomtambulisha yule aliyetiwa mafuta. “Masihi” huonyesha maana hiyo wazi, huku tanbihi ikitaja tafsiri ya jadi “Kristo.”
- issue: Uhusiano wa Injili na Masihi katika τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Injili ya Masihi
  alternative: Injili inayomhusu Masihi
  rationale: Genitivi ya Kigiriki inaweza kueleza Injili inayomilikiwa, inayotoka kwa, au inayomhusu Masihi. Muundo mfupi “ya Masihi” huhifadhi upana huo badala ya kuamua uhusiano mmoja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi baada ya swali la balagha huboresha usomaji bila kuondoa tofauti ya Kigiriki kati ya dai la haki na uamuzi wa kutokuitumia.
