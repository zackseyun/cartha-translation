id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: sw
  text: Basi, thawabu yangu ni nini? Ni kwamba ninapohubiri habari njema[a], niitoe bila malipo, ili nisitumie kikamilifu haki yangu katika kuitangaza habari njema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili”; vivyo hivyo katika sehemu nyingine zote za mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili nisitumie kikamilifu haki yangu katika huduma ya habari njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: thawabu
  rationale: Katika swali hili la balagha, neno hili linamaanisha kile ambacho Paulo anapata kutokana na huduma yake, si mshahara wa kawaida tu; ‘thawabu’ pia huhifadhi kinaya cha kuhubiri bila malipo.
- source_word: εὐαγγελιζόμενος
  choice: ninapohubiri habari njema
  rationale: Umoja huu wa kitenzi unaonyesha tendo linaloendelea sambamba na tendo kuu. Tafsiri hii ni ya kawaida na huhifadhi maana ya kutangaza.
- source_word: ἀδάπανον
  choice: bila malipo
  rationale: Kivumishi hiki humaanisha kwamba jambo linatolewa bila gharama kwa wanaolipokea; ‘bila malipo’ ni wazi na ya kawaida katika Kiswahili.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: niitoe habari njema
  rationale: Ingawa θήσω kwa msingi ni ‘niweke,’ hapa muundo huu una maana ya kuitoa au kuiwasilisha habari njema. ‘Niitoe’ ni ya asili katika Kiswahili na inaendana na wazo la kutotoza malipo.
- source_word: εὐαγγέλιον
  choice: habari njema
  rationale: Hii hutoa maana ya moja kwa moja ya neno la Kigiriki kwa lugha ya sasa. Neno la kimapokeo ‘injili’ limehifadhiwa kama chaguo katika tanbihi.
- source_word: καταχρήσασθαι
  choice: nisitumie kikamilifu
  rationale: Katika muktadha huu kitenzi kinaelekea kumaanisha kutumia haki kwa ukamilifu, bila kulazimisha maana hasi ya kuitumia vibaya.
- source_word: ἐξουσίᾳ
  choice: haki
  rationale: Sura hii inazungumzia ustahili halali wa mtume kupata msaada wa kimwili; ‘haki’ huwasilisha maana hiyo kwa uwazi kuliko ‘mamlaka.’
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: katika habari njema
  rationale: Tafsiri hii fupi huhifadhi ukaribu na usemi wa Kigiriki na kutoufafanua kupita kiasi. Maana inayowezekana ya ‘katika huduma ya habari njema’ imetolewa katika tanbihi.
theological_decisions:
- issue: Asili ya ἐξουσία ya Paulo katika muktadha
  choice: Haki halali ya kupata msaada katika huduma ya habari njema, ambayo Paulo anaamua kutoitumia kikamilifu
  alternative: Mamlaka ya kitume kwa maana pana, au matumizi mabaya ya mamlaka
  rationale: Muktadha mzima wa 1 Wakorintho 9 unasisitiza haki ya mtume kupata msaada. Kwa hiyo tafsiri haidokezi kwamba haki yenyewe au matumizi yake yangekuwa mabaya.
- issue: Maana ya εὐαγγέλιον
  choice: habari njema
  alternative: injili
  rationale: ‘Habari njema’ hutoa maana ya neno la asili kwa lugha inayoeleweka kwa urahisi, huku ‘injili’ ikihifadhiwa katika tanbihi kama istilahi ya kimapokeo.
- issue: Uhusiano wa ἐν τῷ εὐαγγελίῳ na huduma ya Paulo
  choice: katika habari njema
  alternative: katika huduma ya habari njema
  rationale: Usemi wa Kigiriki ni mfupi na unaweza kumaanisha ‘kuhusiana na habari njema’ au ‘katika huduma ya habari njema.’ Matini kuu huhifadhi ufupi huo, na tanbihi huonyesha ufafanuzi unaowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Thawabu,’ ‘bila malipo,’ na ‘haki’ ni maneno ya sasa na yaliyo wazi. Muundo wa swali na jibu umehifadhiwa, pamoja na kutokuwa dhahiri kabisa kwa kirai ἐν τῷ εὐαγγελίῳ.
