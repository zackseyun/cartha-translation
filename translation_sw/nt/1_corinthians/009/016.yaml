  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: sw
  text: Kwa maana nikihubiri Injili[a], sina sababu ya kujisifu, kwa kuwa ulazima umewekwa juu yangu. Kwa maana ole wangu[b] nisipoihubiri Injili!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nikitangaza Habari Njema”; vivyo hivyo katika sehemu ya mwisho ya mstari.
    reason: lexical_alternative
  - marker: b
    text: Au “ole kwangu nisipoihubiri Injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: nikihubiri Injili / nisipoihubiri Injili
  rationale: Kitenzi hiki humaanisha kutangaza habari njema. Katika muktadha huu ujumbe unaokusudiwa ni Injili; “kuhubiri Injili” ni usemi wa kawaida wa Kiswahili unaodumisha nguvu ya utangazaji katika sehemu zote mbili.
- source_word: καύχημα
  choice: sababu ya kujisifu
  rationale: Nomino hii inaashiria msingi au jambo ambalo mtu anaweza kujivunia. Tafsiri hii inaonyesha kwamba Paulo hana msingi halali wa kujisifu kwa tendo hilo.
- source_word: ἀνάγκη ... ἐπίκειται
  choice: ninalazimika kufanya hivyo
  rationale: Muungano huu unaeleza ulazima au shinikizo lililowekwa juu ya Paulo. Kiswahili hiki ni cha asili na hudumisha wazo la ulazima bila kutaja chanzo chake ambacho hakijaelezwa wazi katika mstari huu.
- source_word: οὐαὶ ... μοί ἐστιν
  choice: ole wangu
  rationale: Usemi huu wa Kiswahili hudumisha uzito wa onyo la maafa au dhiki kali, badala ya kuufanya kuwa maelezo mepesi ya huzuni.
- source_word: ἐὰν μὴ
  choice: nisipo-
  rationale: 'Muundo huu wa Kiswahili unatoa sharti hasi kwa ufupi na kwa kawaida: “ikiwa sitaihubiri.”'
- source_word: γάρ
  choice: kwa maana / kwa sababu
  rationale: Viunganishi hivi vinadumisha kazi ya maelezo ya γάρ zote tatu kwa Kiswahili kinachoeleweka, huku “kwa sababu” ikitumika katikati ili sentensi isikike kwa kawaida.
theological_decisions:
- issue: Asili ya ulazima wa Paulo kuhubiri
  choice: “Ninalazimika kufanya hivyo,” bila kubainisha chanzo cha ulazima huo
  alternative: “Mungu amenipa wajibu huo” au “msukumo wa ndani unanilazimisha”
  rationale: Kigiriki kinasema kwamba ulazima umemkalia Paulo, lakini mstari huu pekee hautaji wazi kama chanzo ni agizo la Mungu, msukumo wa ndani, au hali ya nje. Tafsiri haiongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Ole wangu” inadumisha sauti nzito ya kinabii, na “ninalazimika kufanya hivyo” huepuka tafsiri sisisi isiyo ya kawaida huku ikihifadhi maana ya shinikizo lililowekwa juu ya Paulo.
