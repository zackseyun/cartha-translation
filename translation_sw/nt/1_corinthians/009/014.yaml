base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: sw
  text: Vivyo hivyo, Bwana pia aliwaagiza wale wanaoitangaza injili waishi kutokana na injili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapate riziki yao kutokana na injili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Inaonyesha ulinganisho na mifano iliyotangulia na ni usemi wa kawaida wa Kiswahili.
- source_word: καὶ
  choice: pia
  rationale: 'Inaonyesha nyongeza: zaidi ya mifano iliyotajwa, Bwana pia alitoa agizo hili.'
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika muktadha wa Paulo na haiingizi jina ambalo halipo wazi katika matini.
- source_word: διέταξεν
  choice: aliwaagiza
  rationale: Kitenzi kinaonyesha maelekezo yenye mamlaka; ‘aliwaagiza’ ni cha asili na chenye hadhi bila ukali usio wa lazima.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: wale wanaoitangaza
  rationale: Muundo huu unawakilisha kishirikishi chenye kibainishi na kuhifadhi maana ya kutangaza hadharani.
- source_word: τὸ εὐαγγέλιον
  choice: injili
  rationale: ‘Injili’ ni neno lililozoeleka na kueleweka katika Kiswahili cha Biblia.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: kutokana na injili
  rationale: Huhifadhi wazo la chanzo cha riziki bila kufafanua kupita kiasi namna msaada huo unavyotolewa.
- source_word: ζῆν
  choice: wapate riziki yao
  rationale: Katika muktadha wa hoja kuhusu msaada wa kimwili, usemi huu unawasilisha kwa kawaida maana ya kujikimu, si kuishi kiroho.
theological_decisions:
- issue: Anayerejelewa kwa neno ‘Bwana’
  choice: Matini inabaki na ‘Bwana’; katika muktadha huenda anamrejelea Yesu.
  alternative: Marejeo ya jumla zaidi kwa Mungu.
  rationale: Tafsiri haiongezi ‘Yesu’ kwa kuwa jina hilo halipo katika Kigiriki, hivyo inalinda kiwango cha uwazi cha matini.
- issue: Aina ya kuishi inayomaanishwa
  choice: Kupata riziki kutokana na huduma ya injili.
  alternative: Kupata uzima wa kiroho kutokana na injili.
  rationale: Muktadha unaozungumzia haki ya wahudumu kupata msaada unaelekeza kwenye riziki ya kimwili; tanbihi inahifadhi namna ya usemi iliyo karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Wapate riziki yao’ huepuka utata usio wa lazima wa ‘waishi kutokana na injili,’ huku tanbihi ikihifadhi usemi huo wa karibu na Kigiriki.
