  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: sw
  text: Kwa Wayahudi nilikuwa kama Myahudi, ili niwapate Wayahudi[a]. Kwa wale walio chini ya sheria, nilikuwa kama mtu aliye chini ya sheria—ingawa mimi mwenyewe siko chini ya sheria—ili niwapate wale walio chini ya sheria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘niwashinde’; kitenzi hiki kinaweza kumaanisha kupata au kushinda.
    reason: lexical_alternative
  - marker: b
    text: Neno ‘sheria’ hapa linaelekea zaidi kumaanisha Sheria ya Musa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: nilikuwa
  rationale: Katika muktadha huu kitenzi kinaeleza Paulo kuchukua namna ya kuishi au msimamo unaoendana na kundi fulani. ‘Nilikuwa’ ni ya asili kwa Kiswahili na haimaanishi kwamba alibadili utambulisho wake wa kikabila.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Kwa Wayahudi ... kama Myahudi
  rationale: Muundo huu unahifadhi maana ya mwenendo wa Paulo kuelekea kundi hilo na nguvu ya ulinganisho ya ὡς, bila kudokeza kwamba Paulo aliacha kuwa Myahudi kikabila.
- source_word: ἵνα ... κερδήσω
  choice: ili niwapate
  rationale: κερδαίνω inaweza kumaanisha kupata faida au kumvuta mtu upande fulani. ‘Niwapate’ ni usemi wa kawaida wa kimisionari katika Kiswahili na unahifadhi wazo la kuwaleta watu kwa kusudi linalokusudiwa bila kulifafanua kupita maandishi.
- source_word: τοῖς ὑπὸ νόμον
  choice: kwa wale walio chini ya sheria
  rationale: Kirai cha Kigiriki kinataja watu wanaotawaliwa na mfumo unaotambulika wa sheria. Kiswahili kinahitaji ‘wale walio’ ili kukifanya kirai hicho kuwa cha watu kwa njia ya asili.
- source_word: ὡς ὑπὸ νόμον
  choice: kama aliye chini ya sheria
  rationale: Tafsiri hii inadumisha ulinganisho na sentensi iliyotangulia huku ikitoa Kiswahili cha asili. Haidai kwamba Paulo kwa kweli alikuwa chini ya sheria, jambo linalokanushwa na kirai kinachofuata.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: ingawa mimi mwenyewe siko chini ya sheria
  rationale: ‘Ingawa’ huonyesha vizuri tofauti ya kirai tegemezi, ‘mimi mwenyewe’ huhifadhi mkazo wa αὐτός, na wakati wa sasa katika ‘siko’ huonyesha hali ya Paulo, si tukio la zamani tu.
- source_word: νόμος
  choice: sheria
  rationale: Katika muktadha wa Wayahudi, neno hili linaelekea zaidi kumaanisha Sheria ya Musa. Hata hivyo, maandishi makuu yanabaki na neno pana ‘sheria’ ili yasifunge maana zaidi ya Kigiriki.
theological_decisions:
- issue: Maana ya Paulo kusema kwamba hayuko ‘chini ya sheria’
  choice: 'Kutafsiri moja kwa moja: ‘ingawa mimi mwenyewe siko chini ya sheria,’ bila kuongeza ufafanuzi wa kitheolojia.'
  alternative: ‘ingawa mimi mwenyewe siko chini ya Sheria ya Musa’ au kuongeza wazo la mstari wa 21 kwamba hayuko nje ya sheria ya Mungu.
  rationale: Mstari huu unasema tu kwamba Paulo hayuko chini ya sheria. Kutokuongeza maelezo kunahifadhi tofauti na mvutano wa kitheolojia wa maneno yake bila kuingiza ufafanuzi kutoka mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kiasi kwa usomaji wa kawaida, lakini marudio ya ‘chini ya sheria’ na tofauti ya Paulo kuhusu hali yake yamehifadhiwa. Alama zote za tanbihi zimewekwa katika maandishi makuu.
