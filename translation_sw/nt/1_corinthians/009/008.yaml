id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: sw
  text: Je, ninasema mambo haya kwa mtazamo wa kibinadamu tu,[a] au je, Sheria nayo haisemi mambo haya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kadiri ya mwanadamu” / “kwa maoni ya kibinadamu.”
    reason: Mbadala wa kileksika unaohifadhi kwa karibu nahau ya Kigiriki κατὰ ἄνθρωπον.
lexical_decisions:
- source_word: Μὴ
  choice: Je, ...?
  rationale: Katika swali la kwanza, chembe hii huanzisha swali linalotarajia jibu la kukataa; muundo wa Kiswahili pamoja na tofauti inayoletwa na “au” unawasilisha nguvu hiyo kwa kawaida bila kutunga kauli isiyo ya asili.
- source_word: κατὰ ἄνθρωπον
  choice: kwa mtazamo wa kibinadamu tu
  rationale: Nahau hii inaeleza msingi au mtazamo ulio wa kibinadamu pekee, kinyume na ushuhuda wa Sheria katika kishazi kinachofuata.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Inahifadhi wingi wa kiwakilishi na kurejelea hoja zilizotangulia za Paulo.
- source_word: λαλῶ
  choice: ninasema
  rationale: Wakati wa sasa unafaa kwa hoja ambayo Paulo anaitoa wakati huo, na “ninasema” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἢ
  choice: au
  rationale: Inaingiza kwa uwazi upande mwingine wa swali, yaani ushuhuda wa Sheria.
- source_word: καὶ
  choice: nayo
  rationale: Kiambishi hiki cha nyongeza kinaonyesha kwamba Sheria pia ni shahidi wa hoja hiyo; “nayo” ni ya asili katika muktadha huu.
- source_word: ὁ νόμος
  choice: Sheria
  rationale: Hapa inarejelea Sheria ya Musa kama sehemu ya Maandiko, jambo linalothibitishwa na nukuu ya Kumbukumbu la Torati 25:4 katika mstari unaofuata.
- source_word: οὐ λέγει
  choice: haisemi
  rationale: Inahifadhi swali hasi la balagha, ambalo linatarajia jibu la kukubali kwamba Sheria kweli husema mambo hayo.
theological_decisions:
- issue: Rejeleo la “Sheria” katika hoja ya Paulo
  choice: “Sheria” inarejelea Sheria ya Musa, yaani sehemu ya kisheria ya Maandiko
  alternative: sheria kama kanuni ya jumla
  rationale: Muktadha wa karibu katika 1 Wakorintho 9:9 unanukuu Kumbukumbu la Torati 25:4; hivyo herufi kubwa inaleta utambulisho huo wa kimaandiko bila kuongeza dai jingine la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha umehifadhiwa; “nayo” huonyesha maana ya nyongeza ya καὶ kwa njia ya kawaida.
