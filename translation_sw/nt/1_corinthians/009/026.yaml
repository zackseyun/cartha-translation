  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: sw
  text: 'Kwa hiyo, mimi hukimbia hivi: si bila lengo; hivi ndivyo ninavyopigana ngumi: sipigi hewa[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si bila uhakika.” Kielezi cha Kigiriki kinaweza kusisitiza kutokuwa na uwazi au kutokuwa na lengo dhahiri; katika mfano wa mbio, “bila lengo” huonyesha kukimbia pasipo mahali pa kuelekea palipo wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mfano wa mashindano uliotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οὕτως
  choice: hivi
  rationale: Neno hili limerudiwa ili kuhifadhi mkazo wa Kigiriki kuhusu namna Paulo anavyokimbia na kupigana.
- source_word: τρέχω
  choice: hukimbia
  rationale: Inahifadhi mfano wa riadha na hali ya tendo la kawaida au linaloendelea katika wakati wa sasa.
- source_word: ἀδήλως
  choice: bila lengo
  rationale: Katika picha ya mashindano ya mbio, maneno haya yanaonyesha kutokimbia pasipo mwelekeo au kusudi lililo wazi, huku dokezo likihifadhi maana mbadala ya kutokuwa na uhakika.
- source_word: πυκτεύω
  choice: napigana ngumi
  rationale: Kitenzi hiki kinahusu hasa mchezo wa ngumi; usemi huu ni wazi na wa kawaida katika Kiswahili cha kisasa.
- source_word: ἀέρα
  choice: hewa
  rationale: Inahifadhi kitu halisi kinachopigwa katika picha ya mapigo yasiyompata mpinzani.
- source_word: δέρων
  choice: ninayepiga
  rationale: Inatoa hali ya tendo sambamba na kitenzi cha kupigana ngumi na kuhifadhi picha ya kupiga hewa.
