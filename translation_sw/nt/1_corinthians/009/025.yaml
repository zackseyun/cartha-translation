  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: sw
  text: Kila anayeshindana hujizuia katika mambo yote. Wao hufanya hivyo ili wapokee taji linaloharibika[a], lakini sisi hufanya hivyo ili tupokee taji lisiloharibika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shada la ushindi”; neno la Kigiriki linamaanisha shada ambalo mshindi hupewa katika mashindano ya riadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Kila
  rationale: Pamoja na kishazi cha ‘anayeshindana,’ neno hili linawasilisha kwa kawaida maana ya kila mtu bila kuweka jinsia ambayo Kigiriki hakisisitizi hapa.
- source_word: ἀγωνιζόμενος
  choice: anayeshindana
  rationale: Muktadha wa karibu ni mashindano ya riadha; uchaguzi huu unadumisha picha ya mshindani badala ya maana pana ya kujitahidi.
- source_word: πάντα
  choice: katika mambo yote
  rationale: Huhifadhi upana wa kujizuia kwa mshindani bila kuifanya ihusu chakula au mazoezi pekee.
- source_word: ἐγκρατεύεται
  choice: hujizuia
  rationale: Huonyesha mwenendo wa kawaida wa kutumia kiasi na kudhibiti tamaa, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Wao hufanya hivyo
  rationale: Inarejelea washindani waliotajwa na kurejesha kitendo kilichodokezwa, huku ikiandaa utofautishaji na ‘sisi.’
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi la kujizuia kwao kwa uwazi na kwa ufupi.
- source_word: φθαρτὸν
  choice: linaloharibika
  rationale: Hutofautiana moja kwa moja na ‘lisiloharibika’ na huhifadhi maana ya kitu kisichodumu.
- source_word: στέφανον
  choice: taji
  rationale: ‘Taji’ hudumisha picha ya heshima na tuzo; tanbihi inaeleza kuwa katika muktadha huu ni shada la ushindi la mashindano.
- source_word: λάβωσιν
  choice: wapokee
  rationale: Hufaa kwa tuzo anayopewa mshindi na hudumisha hali ya kusudi baada ya ἵνα.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: lakini sisi tupokee lisiloharibika
  rationale: Kitenzi na nomino iliyodokezwa vimejazwa kwa kiasi kinachohitajika ili Kiswahili kiwe wazi, huku utofautishaji kati yao na sisi ukibaki.
theological_decisions:
- issue: Maana ya mfano wa tuzo
  choice: Kudumisha picha ya taji la ushindi bila kutaja kwa uhakika zaidi tuzo hiyo ni nini kiteolojia.
  alternative: Kulifafanua wazi kuwa uzima wa milele au thawabu za mbinguni.
  rationale: Aya yenyewe haifafanui kwa undani kitu kinachowakilishwa na taji lisiloharibika; kuliacha kama mfano huepuka kuingiza msimamo mwembamba wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hujizuia’ ni rahisi kueleweka na inadumisha nidhamu ya mshindani. Kiunganishi δέ kimetafsiriwa kwa utofautishaji wa sentensi, bila kuongeza alama ya wakati kama ‘sasa.’
