id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: sw
  text: Kwa wale wasio chini ya sheria[a], nilikuwa kama mtu asiye chini ya sheria—ingawa mimi si mtu asiye chini ya sheria ya Mungu, bali niko chini ya sheria ya Masihi[b]—ili niwapate wale wasio chini ya sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasio na sheria.” Hapa kirai hiki kinawahusu wale wasio chini ya Sheria ya Musa, si lazima watu wasiofuata maadili.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinaweza pia kutafsiriwa, “niko ndani ya sheria ya Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: wasio chini ya sheria / mtu asiye chini ya sheria
  rationale: Katika muktadha huu maneno hayo yanamaanisha watu wasio chini ya Sheria ya Musa, si lazima watu waovu au wanaokataa sheria. Tafsiri hii inadumisha urudiaji wa Kigiriki na huepuka maana ya kimaadili isiyokusudiwa.
- source_word: ὡς
  choice: kama
  rationale: Neno hili linaonyesha jinsi Paulo alivyojilinganisha na hali ya wale aliotaka kuwafikia, bila kudai kwamba alikuwa hivyo kwa maana kamili.
- source_word: μὴ ὢν
  choice: ingawa mimi si
  rationale: Kirai hiki kina nguvu ya kukubali jambo huku kikitoa tahadhari; ‘ingawa’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἔννομος
  choice: niko chini ya sheria
  rationale: Chaguo hili linaonyesha kuwa Paulo yuko katika mamlaka ya sheria na linatofautiana wazi na ‘asiye chini ya sheria,’ huku maana ya ‘ndani ya sheria’ ikibaki kama uwezekano wa kimuundo.
- source_word: Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa inatumika kama cheo katika uhusiano wa ‘sheria ya Masihi’; ‘Masihi’ huhifadhi maana hiyo ya cheo.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: κερδάνω
  choice: niwapate
  rationale: Katika muktadha wa huduma ya Paulo, kitenzi kinamaanisha kuwavuta au kuwashinda watu waje kwenye imani, si kupata faida ya fedha. ‘Niwapate’ ni usemi wa kawaida unaofaa muktadha huu.
theological_decisions:
- issue: Maana ya ἄνομος katika muktadha huu
  choice: Watu wasio chini ya Sheria ya Musa, hasa watu wa mataifa
  alternative: Watu wasio na sheria kwa maana ya waovu au waasi
  rationale: Muktadha wa 1 Wakorintho 9:20–21 unatofautisha walio chini ya sheria na wasio chini yake. Ufafanuzi wa Paulo kuhusu sheria ya Mungu na ya Masihi unaonyesha mahali pa mtu kuhusiana na sheria, wala si kukataa maadili.
- issue: Nguvu ya ἔννομος Χριστοῦ
  choice: niko chini ya sheria ya Masihi
  alternative: niko ndani ya sheria ya Masihi
  rationale: Kirai hiki kinathibitisha kwamba Paulo bado anawajibika kimaadili chini ya mamlaka inayohusishwa na Masihi. Tafsiri ya ‘chini ya’ ni ya kawaida zaidi, lakini ‘ndani ya’ inawezekana kisarufi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno hilo lina nguvu ya cheo katika kirai ‘sheria ya Masihi,’ kwa hiyo ‘Masihi’ hudhihirisha maana yake badala ya kulitumia kama jina lililozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi urudiaji wa ἄνομος na mvutano kati ya kutokuwa chini ya sheria na kuwajibika kwa sheria ya Mungu kupitia Masihi. Kitenzi ‘nilikuwa’ kimejazwa kutokana na muktadha wa mstari uliotangulia ili sentensi iwe ya kawaida kwa Kiswahili.
