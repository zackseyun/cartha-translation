base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: sw
  text: Ikiwa sisi tumewapandia mambo ya kiroho, je, ni jambo kubwa sana sisi kuvuna kutoka kwenu mambo ya mali?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo ya kimwili.” Kigiriki kinatofautisha “mambo ya kiroho” na mambo yanayohusu maisha ya mwili au mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: mambo ya kiroho
  rationale: Kivumishi hiki cha wingi kimetumika kama nomino na kina maana pana ya manufaa au huduma ya kiroho bila kuibana kuwa kitu kimoja maalumu.
- source_word: ἐσπείραμεν
  choice: tumewapandia
  rationale: Wakati uliopita unaonyesha huduma ambayo Paulo na wenzake walikuwa tayari wamewafanyia Wakorintho; umbo hili pia linadumisha sitiari ya kupanda na kuvuna.
- source_word: μέγα
  choice: jambo kubwa mno
  rationale: Katika swali hili la balagha, neno linauliza kama kupokea msaada huo kungekuwa dai kubwa kupita kiasi au lisilo la kawaida.
- source_word: τὰ σαρκικὰ
  choice: mambo ya kimwili
  rationale: Hapa neno linarejelea mahitaji na msaada wa maisha ya mwili au wa mali, si mwenendo wa dhambi; tafsiri hii inadumisha utofautishaji na mambo ya kiroho.
- source_word: θερίσομεν
  choice: tukivuna
  rationale: Umbo la baadaye katika Kigiriki linaendeleza sitiari ya mavuno yanayotarajiwa; katika Kiswahili, muundo wa swali wenye 'tukivuna' unaeleza matarajio hayo kwa kawaida.
- source_word: ὑμῶν
  choice: kutoka kwenu
  rationale: Hujieleza kwa kawaida katika Kiswahili kama chanzo cha yale yanayovunwa, yaani msaada unaotoka kwa Wakorintho.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo; 'sisi' kinahifadhi utofautishaji kati ya waliopanda na wale ambao msaada unatoka kwao.
theological_decisions:
- issue: Maana ya τὰ σαρκικὰ ikilinganishwa na τὰ πνευματικὰ
  choice: Mambo ya kimwili, yaani msaada wa mahitaji ya kawaida au wa mali kwa ajili ya huduma
  alternative: Mambo ya mwili kwa maana ya mwenendo wa dhambi
  rationale: Muktadha ni utetezi wa haki ya watumishi wa injili kupata mahitaji yao. Utofautishaji hapa si kati ya utakatifu na dhambi, bali kati ya huduma ya kiroho na msaada wa maisha ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya kilimo imehifadhiwa kwa maneno 'kupandia' na 'kuvuna,' huku swali la balagha likisomeka kwa kawaida.
