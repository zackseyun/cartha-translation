id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: sw
  text: Je, mimi si huru? Je, mimi si mtume? Je, sijamwona Yesu, Bwana wetu?[a] Je, ninyi si kazi yangu katika Bwana?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mpangilio mwingine wa maneno, “Bwana wetu Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: huru
  rationale: Neno hili linaendeleza wazo la uhuru na haki za Paulo katika muktadha; “huru” ni la moja kwa moja na la kawaida katika Kiswahili.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Hapa neno linamaanisha wadhifa wa Paulo uliotambuliwa, si mjumbe wa kawaida tu; “mtume” huhifadhi maana hiyo ya kiufundi ya Agano Jipya.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Yesu, Bwana wetu
  rationale: Mpangilio huu unafuata kwa karibu muundo wa Kigiriki huku ukiwa wa asili katika Kiswahili; koma inaonyesha kwamba “Bwana wetu” ni cheo kinachomfafanua Yesu.
- source_word: ἑόρακα
  choice: sijamwona
  rationale: Kauli ya wakati timilifu wa Kigiriki inaonyesha tendo la kuona lenye umuhimu unaoendelea; wakati timilifu wa Kiswahili unafikisha maana hiyo vizuri.
- source_word: ἔργον
  choice: kazi
  rationale: Waumini wa Korintho wanaelezwa kuwa matokeo ya huduma ya kitume ya Paulo; “kazi” ni tafsiri ya moja kwa moja na inaendeleza sitiari ya chanzo.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi kirai cha Paulo kinachoonyesha uhusiano au mazingira ya kiroho ambamo Wakorintho ni kazi ya Paulo.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Je, mimi si ...? / Je, sija...? / Je, ninyi si ...?
  rationale: Vikanushi hivi vinaanzisha maswali ya balagha yanayotarajia jibu la ndiyo; miundo hii ni ya asili na wazi katika Kiswahili.
theological_decisions:
- issue: Nguvu ya dai la Paulo kwamba amemwona Yesu
  choice: Maandishi yanabaki na kauli rahisi kwamba Paulo amemwona Yesu, katika muktadha wa kuthibitisha utume wake.
  alternative: Kusema wazi kwamba Paulo alimwona Yesu aliyefufuka.
  rationale: Muktadha unaelekeza kwenye kumwona Yesu aliyefufuka kama uthibitisho wa utume, lakini Kigiriki hakisemi wazi “aliyefufuka”; hivyo tafsiri haiongezi ufafanuzi huo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa maswali ya balagha umehifadhiwa ili kudumisha msisitizo wa hoja ya Paulo.
