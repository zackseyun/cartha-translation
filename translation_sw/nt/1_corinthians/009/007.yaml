id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: sw
  text: Ni nani aliyewahi kutumika kama askari kwa gharama zake mwenyewe? Ni nani anayepanda shamba la mizabibu, lakini hali matunda yake? Au ni nani anayechunga kundi la mifugo, lakini hanywi maziwa ya kundi hilo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hali kutoka katika maziwa ya kundi.” Kitenzi cha Kigiriki ni “kula,” lakini kwa kawaida Kiswahili husema “kunywa maziwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: kutumikia kama askari
  rationale: Kitenzi hiki humaanisha kufanya utumishi wa kijeshi; usemi huu unahifadhi mfano wa kazi ya askari bila kuufanya umaanishe mapigano pekee.
- source_word: ἰδίοις ὀψωνίοις
  choice: kwa gharama zake mwenyewe
  rationale: ὀψώνιον inaweza kutaja malipo au posho ya askari, lakini katika swali hili maana ni kwamba askari hajigharamii katika utumishi wake.
- source_word: ποτέ
  choice: anayewahi
  rationale: Katika swali la balagha, ποτέ hutoa maana ya ‘wakati wowote/amewahi’; ‘anayewahi’ ni ya kawaida na fupi katika Kiswahili.
- source_word: φυτεύει ἀμπελῶνα
  choice: anayepanda shamba la mizabibu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mfano wa kilimo.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: matunda yake
  rationale: καρπός hapa ni mazao au matunda yanayotokana na shamba la mizabibu; ‘matunda yake’ ni wazi na huhifadhi taswira.
- source_word: ποιμαίνει ποίμνην
  choice: anayechunga kundi la mifugo
  rationale: ποιμαίνω ni kuchunga au kutunza kama mchungaji. ‘Kundi la mifugo’ linaacha aina ya wanyama bila kubainishwa, kama ilivyo katika ποίμνη.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: maziwa ya kundi hilo
  rationale: Kirai kinaonyesha kupata sehemu ya kile ambacho kundi hutoa. Kiswahili cha kawaida hakihitaji kutaja kihusishi ‘kutoka katika’ hapa.
- source_word: ἐσθίει
  choice: kula / kunywa
  rationale: Kitenzi cha Kigiriki ni ‘kula’ katika mifano yote miwili, lakini Kiswahili cha kawaida hutumia ‘kunywa’ kwa maziwa; mabadiliko hayo yanahifadhi maana huku yakifanya sentensi iwe ya asili.
theological_decisions:
- issue: Umoja wa kiume wa kimfano katika vifungu vinavyorudia τίς
  choice: Kutumia miundo ya umoja ‘nani’ na ‘zake mwenyewe’
  alternative: Kutumia wingi au kubadili mfano uwe usio wa umoja
  rationale: Kigiriki kinatoa mifano ya kimfano katika umoja. Kiswahili kinaweza kuhifadhi umoja huo kwa kawaida bila kulazimisha jinsia katika vitenzi; ‘zake mwenyewe’ humrejelea askari mmoja wa mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali matatu ya balagha na ulinganifu wake yamehifadhiwa; ‘lakini’ limeongezwa kwa mtiririko wa kawaida wa Kiswahili bila kubadili hoja.
