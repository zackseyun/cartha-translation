id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: sw
  text: Je, hamjui kwamba wale wanaokimbia katika uwanja wa mbio[a] wote hukimbia, lakini ni mmoja tu anayepokea tuzo? Kimbieni vivyo hivyo, ili muipate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika stadioni.” Neno la Kigiriki στάδιον linamaanisha mahali pa mbio, yaani uwanja au kiwanja chenye njia ya mbio.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili mshinde” au “ili muishike.” Neno la Kigiriki καταλάβητε linaweza kumaanisha kupata, kushika, au kufikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Inahifadhi swali la balagha la Paulo na maana ya kawaida ya οἶδα kwa Kiswahili cha asili.
- source_word: ἐν σταδίῳ
  choice: katika uwanja wa mashindano
  rationale: στάδιον hapa ni mahali pa mbio; usemi huu unadumisha taswira halisi ya riadha bila kuufanya kuwa 'mashindano' kwa ujumla.
- source_word: τρέχοντες ... τρέχουσιν
  choice: wale wanaokimbia ... wote hukimbia
  rationale: Inahifadhi tendo na urudiaji wa τρέχω, ambao unaifanya taswira ya mbio iwe wazi.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: wote ... lakini ni mmoja tu
  rationale: Inaonyesha wazi utofautishaji wa μέν...δέ kwa Kiswahili cha kawaida; 'tu' inaeleza upekee wa εἷς katika muktadha.
- source_word: λαμβάνει
  choice: anayepokea
  rationale: Ni maana ya moja kwa moja kuliko 'anayeshinda' na haitangulizi tafsiri ya ziada katika mfano wa riadha.
- source_word: βραβεῖον
  choice: tuzo
  rationale: Ni neno la kawaida na linaloeleweka kwa zawadi anayopewa mshindi wa mashindano.
- source_word: οὕτως
  choice: vivyo hivyo
  rationale: 'Inaunganisha agizo na mfano uliotangulia: waumini wakimbie kwa namna inayolingana na mkimbiaji anayelenga tuzo.'
- source_word: τρέχετε
  choice: Kimbieni
  rationale: Agizo la wingi linawafaa wasikilizaji wengi; umbo rahisi lina nguvu na linaweza kubeba mwendelezo wa tendo kulingana na muktadha.
- source_word: ἵνα καταλάβητε
  choice: ili mpate kuipata
  rationale: καταλαμβάνω inaweza kumaanisha kupata, kushika, au kufikia. 'Kuipata' inafaa kwa tuzo na haizidishi maana kwa kusema moja kwa moja 'kushinda'.
theological_decisions:
- issue: Mfano wa mbio kuhusu udumifu wa Kikristo
  choice: Kudumisha taswira ya mashindano na himizo la kuikimbilia tuzo bila kufafanua tuzo hiyo kidogma
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa 'kimbieni ili mshinde' au kuitambulisha tuzo kuwa wokovu
  rationale: Aya inahimiza jitihada yenye kusudi kwa mfano wa riadha, lakini haifafanui hapa uhusiano wa tuzo na wokovu, matendo, au thawabu; tafsiri haipaswi kutatua mvutano huo kwa kuongeza maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa 'kukimbia' umehifadhiwa kwa sababu ni sehemu muhimu ya taswira ya Paulo; alama zote za tanbihi zimewekwa katika matini kuu.
