  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: sw
  text: Je, hamjui kwamba wale wanaoshughulika na mambo matakatifu hula vitu vya hekaluni,[a] na wale wanaohudumu madhabahuni hupata fungu la yale yanayotolewa madhabahuni?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaohudumu katika mambo matakatifu hula vitu vya hekaluni.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi zaidi, “hushiriki na madhabahu,” yaani, hupokea fungu la matoleo yanayohusiana na madhabahu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Je, hamjui
  rationale: Huhifadhi swali la balagha linalotumiwa na Paulo na ni la kawaida katika Kiswahili sanifu.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: wale wanaofanya kazi ya mambo matakatifu
  rationale: Huhifadhi rejeo la moja kwa moja kwa ‘mambo matakatifu’ badala ya kulifanya tu kuwa mahali pa kazi, huku muktadha wa hekalu ukibainishwa katika kishazi kinachofuata.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: hula vitu vinavyotoka hekaluni
  rationale: Huhifadhi kitenzi halisi cha kula na wazo la vitu vinavyotoka katika hekalu bila kuongeza maelezo yasiyosemwa wazi.
- source_word: ἱεροῦ
  choice: hekaluni
  rationale: ἱερόν hapa hurejelea hekalu au eneo lake takatifu; ‘hekaluni’ ni tafsiri wazi na ya kawaida.
- source_word: παρεδρεύοντες
  choice: wanaohudumu madhabahuni
  rationale: Kitenzi-shirikishi kinaonyesha kukaa karibu na madhabahu kwa ajili ya huduma; ‘wanaohudumu’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: θυσιαστηρίῳ
  choice: madhabahuni
  rationale: Ni tafsiri sanifu ya mahali pa kutolea dhabihu, ikiwa katika hali ya mahali inayofaa baada ya ‘kuhudumu’.
- source_word: συμμερίζονται
  choice: hupata sehemu ya vitu vinavyotolewa madhabahuni
  rationale: Huwasilisha wazo la kupokea fungu linalohusiana na madhabahu kwa njia ya kawaida, huku tanbihi ikihifadhi usemi halisi zaidi ‘hushiriki pamoja na madhabahu.’
theological_decisions:
- issue: Taswira ya ibada na riziki ya wanaohudumu
  choice: Kudumisha mlinganisho wa huduma ya mambo matakatifu na kupokea sehemu ya matoleo ya madhabahuni
  alternative: Kutafsiri kishazi cha mwisho kwa maneno halisi zaidi, ‘hushiriki pamoja na madhabahu’
  rationale: Hoja ya Paulo inategemea desturi ya wahudumu wa ibada kupata chakula au fungu kutokana na huduma hiyo. Tafsiri inaweka wazi mantiki hii bila kuingiza miundo ya baadaye ya kanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maneno ‘mambo matakatifu,’ ‘hekaluni,’ na ‘madhabahuni’ yanadumisha taswira ya ibada ya chanzo bila kuingiza istilahi za dhehebu.
