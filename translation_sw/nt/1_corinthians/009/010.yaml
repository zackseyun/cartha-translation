source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: sw
  text: Au je, anasema hivyo kwa ajili yetu kabisa? Naam[a], yaliandikwa kwa ajili yetu, kwa sababu anayelima anapaswa kulima akiwa na tumaini, na anayepura anapaswa kupura akiwa na tumaini la kushiriki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Je, hakika anasema hivyo kwa ajili yetu?” Neno la Kigiriki linakazia swali hili la balagha.'
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakitaji wazi kitu ambacho mpuraji anatarajia kushiriki; muktadha unaonyesha mazao au mavuno.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: hasa
  rationale: Katika swali hili la balagha, kielezi hiki kinakazia kwamba maneno hayo yanawahusu wanadamu; “hasa” ni ya kawaida na hakilazimishi maana ya “kabisa” pekee.
- source_word: δι’ ἡμᾶς
  choice: kwa ajili yetu
  rationale: Huwasilisha vizuri maana ya kunufaisha au kuelekezwa kwetu katika hoja ya Paulo.
- source_word: ἐγράφη
  choice: iliandikwa
  rationale: Hufuata aoristi tendwa na ni usemi wa kawaida wa Kiswahili kuhusu Maandiko.
- source_word: ὀφείλει
  choice: anapaswa
  rationale: Huhifadhi dhana ya wajibu unaofaa bila kuifanya kuwa amri kali kupita kiasi.
- source_word: ἐπ’ ἐλπίδι
  choice: akiwa na tumaini
  rationale: Ni Kiswahili cha asili kinachoonyesha hali na matarajio yanayomsukuma mfanyakazi.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: anayelima anapaswa kulima
  rationale: Huhifadhi urudiaji na maana ya jumla ya mfanyakazi bila kuongeza jinsia.
- source_word: ὁ ἀλοῶν
  choice: anayepura
  rationale: “Kupura” ni neno sanifu la kutenganisha nafaka na makapi, nalo huhifadhi taswira ya kilimo.
- source_word: τοῦ μετέχειν
  choice: la kupata sehemu yake
  rationale: Hueleza matarajio ya kushiriki katika mazao ya kazi kwa Kiswahili cha kawaida, huku kitu kinachoshirikiwa kikiachwa bila kutajwa wazi kama katika Kigiriki.
theological_decisions:
- issue: Nguvu na nafasi ya πάντως katika swali la balagha
  choice: “hasa” katika swali, kisha “Naam” kama jibu linalodokezwa
  alternative: “kabisa” au “hakika,” bila kuongeza jibu la wazi
  rationale: Kigiriki kinaweza kueleweka kama mkazo ndani ya swali, ambalo linatarajia jibu la kukubali. “Naam” hufanya mtiririko wa Kiswahili uwe wazi, na tanbihi huhifadhi uwezekano wa kusoma kielezi hicho kwa namna nyingine.
- issue: Kitu kisichotajwa cha μετέχειν
  choice: “kupata sehemu yake” bila kutaja mazao moja kwa moja
  alternative: “kushiriki katika mavuno” au “kupata sehemu ya mazao”
  rationale: Kigiriki hakitaji kitu kinachoshirikiwa. Tafsiri hii huhifadhi uwazi wa hoja bila kuongeza “mavuno” katika matini kuu; muktadha wa kilimo huonyesha kinachokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo sambamba wa kulima na kupura umehifadhiwa; “anayelima/anayepura” ni wa kijumla na haubainishi jinsia.
