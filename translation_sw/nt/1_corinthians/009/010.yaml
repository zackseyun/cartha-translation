review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the benefactive force of δι’ ἡμᾶς, the passive aorist ἐγράφη, the obligation expressed by ὀφείλει, and the agricultural parallelism. However, “hasa” normally means “especially/particularly,” whereas πάντως here intensifies the scope of the rhetorical question (“entirely/altogether,” with “certainly” also possible). “Kupata sehemu yake” also introduces a possessive personal allotment not expressed by τοῦ μετέχειν.
  naturalness: The Swahili is generally clear and suitably formal. “Anayelima ... anayepura” gives a natural, balanced generic expression. “Tumaini la kushiriki” is concise, idiomatic, and avoids making the unstated object explicit.
  terminology: “Kwa ajili yetu,” “anapaswa,” “tumaini,” and “kupura” are appropriate Standard East African Swahili renderings in this context. Rendering μετέχειν as “kushiriki” best preserves its sense and the source’s unstated object.
  issues:
  - severity: medium
    issue: πάντως is rendered “hasa.”
    rationale: “Hasa” narrows the reference to something especially or particularly for us; it does not naturally convey the Greek’s intensive “entirely/altogether” in this rhetorical question. “Kabisa” is a closer, natural equivalent.
  - severity: low
    issue: “Kupata sehemu yake” adds “yake.”
    rationale: The Greek says only “to share/partake” and does not specify either the thing shared or a possessive individual portion. “Kushiriki” retains the intended ambiguity.
  revised_text: Au je, anasema hivyo kwa ajili yetu kabisa? Naam[a], yaliandikwa kwa ajili yetu, kwa sababu anayelima anapaswa kulima akiwa na tumaini, na anayepura anapaswa kupura akiwa na tumaini la kushiriki[b].
