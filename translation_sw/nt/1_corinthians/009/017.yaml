base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: sw
  text: Kwa maana, nikifanya jambo hili kwa hiari, nina thawabu; lakini nikifanya bila hiari, nimekabidhiwa uwakili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimekabidhiwa dhamana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκὼν
  choice: kwa hiari
  rationale: Kirai hiki ni cha kawaida katika Kiswahili na kinaonyesha kutenda kwa utashi wa mtu mwenyewe, huku kikidumisha tofauti yake na ἄκων.
- source_word: τοῦτο πράσσω
  choice: nikifanya jambo hili
  rationale: Hurejelea kutekeleza huduma inayozungumziwa katika muktadha bila kuibainisha zaidi ya Kigiriki.
- source_word: μισθὸν
  choice: thawabu
  rationale: Katika muktadha huu neno linamaanisha malipo au tuzo kutokana na huduma ya hiari; “thawabu” huhifadhi maana pana kuliko mshahara wa kawaida.
- source_word: ἄκων
  choice: bila hiari
  rationale: Hii ni kinyume cha moja kwa moja cha “kwa hiari” na haiongezi hisia ya kusitasita ambayo Kigiriki hakilazimishi.
- source_word: οἰκονομίαν
  choice: wajibu wa kusimamia
  rationale: Hueleza dhamana ya kuendesha jambo lililokabidhiwa. Usemi huu ni wa asili na unaeleweka kwa wasomaji wa sasa kuliko istilahi ya kiufundi “uwakili.”
- source_word: πεπίστευμαι
  choice: nimekabidhiwa
  rationale: 'Huhifadhi hali tendwa na matokeo yanayoendelea ya kitenzi cha wakati timilifu: Paulo alikabidhiwa wajibu na bado anao.'
theological_decisions:
- issue: Asili ya huduma ya Paulo katika kishazi cha pili
  choice: Hata asipotenda kwa hiari, Paulo bado amekabidhiwa wajibu wa kusimamia.
  alternative: Paulo anamaanisha kuwa akitenda bila hiari anabaki na wajibu tu, bila thawabu; au anatofautisha huduma ya hiari na wadhifa wa lazima.
  rationale: Tafsiri inadumisha tofauti kati ya μισθὸν ἔχω na οἰκονομίαν πεπίστευμαι bila kuamua zaidi ya maandishi kama kutenda bila hiari kunafuta thawabu au kunafafanua nadharia fulani ya wito wa huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa hiari/bila hiari” hudumisha ulinganifu wa Kigiriki, na “wajibu wa kusimamia” huepuka istilahi nzito huku ikihifadhi wazo la dhamana iliyokabidhiwa.
