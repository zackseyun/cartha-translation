  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: sw
  text: Kwa maana imeandikwa katika Sheria ya Musa, “Usimfunge ng’ombe kinywa anapopura nafaka[a].” Je, Mungu anamjali ng’ombe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anapoikanyaga nafaka.”
    reason: Uwasilishaji mbadala wa tendo la kupura.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Kwa maana imeandikwa katika Sheria ya Musa
  rationale: “Katika Sheria ya Musa” ni Kiswahili cha kawaida kinachohifadhi uhusiano wa maneno ya Kigiriki; “kwa maana” linaonyesha kazi ya γάρ ya kutoa msingi wa hoja.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Hii ndiyo njia ya kawaida na yenye hadhi ya kutafsiri kauli ya kudumu inayotanguliza nukuu ya Maandiko.
- source_word: Οὐ κημώσεις
  choice: Usimfunge ... kinywa
  rationale: Kauli ya baadaye ya Kigiriki ina nguvu ya katazo. Kiswahili “usimfunge kinywa” huwasilisha kwa uwazi kitendo cha kumzuia mnyama kula wakati anafanya kazi.
- source_word: βοῦν
  choice: ng’ombe
  rationale: “Ng’ombe” ni neno la kawaida la Kiswahili kwa mnyama huyu wa kufanyia kazi; umoja unaonyeshwa na kiambishi cha yambwa “-m-” katika “usimfunge.”
- source_word: ἀλοῶντα
  choice: anapopura nafaka
  rationale: Kitenzi hiki kinaeleza kitendo kinachoendelea cha kupura. Kutaja nafaka kunafanya maana ya kitendo iwe wazi katika Kiswahili bila kubadili picha ya shughuli hiyo.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Je, Mungu anawajali ng’ombe?
  rationale: “Je” huhifadhi swali la balagha, na kiambishi cha wingi katika “anawajali” huonyesha kwamba ng’ombe hapa ni wingi. Tafsiri haiongezi “pekee” wala kukazia kwamba jibu ni hasi kabisa.
theological_decisions:
- issue: Swali la Paulo kuhusu Mungu kuwajali wanyama
  choice: Je, Mungu anawajali ng’ombe?
  alternative: Je, Mungu anajali ng’ombe tu?
  rationale: Kigiriki kina swali la balagha lililoanzishwa na μή, lakini hakina neno linalomaanisha “tu.” Kwa hiyo swali limetafsiriwa moja kwa moja ili kuhifadhi nguvu ya hoja pamoja na mvutano kuhusu kama Paulo anakanusha kujali kwa Mungu kabisa au anaelekeza kwenye kusudi pana la sheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa katazo ni wa kawaida, na swali la mwisho limeachwa wazi bila nyongeza ya kimadhehebu au ufafanuzi unaoondoa mvutano wa hoja.
