  naturalness: Kiswahili ni cha asili na cha hadhi inayofaa. “Usimfunge ng’ombe kinywa” ni sahihi, ingawa mpangilio “Usimfunge kinywa ng’ombe” ni wa kawaida zaidi kidogo katika mtindo wa kibiblia; si lazima. “Anapopura nafaka” ni wazi na sahihi.
  terminology: “Sheria ya Musa,” “imeandikwa,” “ng’ombe,” na “Mungu” ni istilahi sahihi na thabiti. Badiliko kutoka umoja katika nukuu hadi wingi katika swali (“anawajali ng’ombe”) halina msingi katika Kigiriki, ambacho kina τῶν βοῶν kama namna ya jumla lakini huendeleza mfano wa ng’ombe mmoja wa nukuu. Kiswahili cha umoja wa jumla kinaepuka mkengeuko huo.
