id: 1CO.9.22
reference: 1 Corinthians 9:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: sw
  text: Kwa walio dhaifu nikawa dhaifu[a], ili niwapate walio dhaifu. Nimekuwa mambo yote kwa watu wote, ili kwa kila njia[b] nipate kuwaokoa baadhi ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhaifu katika dhamiri”; katika 1 Wakorintho usemi huu unaweza kuwahusu hasa watu ambao dhamiri zao ni dhaifu au zinaweza kujeruhiwa kwa urahisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia zote” au “kwa gharama yoyote”; usemi huu una maana ya kutumia kila njia inayowezekana ili kufikia lengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: nilikuwa
  rationale: Katika muktadha huu kitenzi kinaonyesha Paulo alijiweka katika hali au msimamo unaolingana na wale aliowahudumia; ‘nilikuwa’ ni ya kawaida katika Kiswahili na huepuka maana ya kwamba aliumbwa au alifanywa dhaifu.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: walio dhaifu / dhaifu
  rationale: Kurudia mzizi ‘dhaifu’ kunahifadhi msisitizo wa Kigiriki na kuacha wazi ikiwa udhaifu ni wa dhamiri au wa aina nyingine.
- source_word: κερδήσω
  choice: niwapate
  rationale: ‘Kuwapata’ watu katika muktadha wa uinjilisti ni Kiswahili cha asili kinachoonyesha kuwavuta au kuwafaidi kwa lengo la wokovu, si kupata mali.
- source_word: τοῖς πᾶσιν
  choice: kwa watu wote
  rationale: Kigiriki kimeacha nomino ikieleweka; kuongeza ‘watu’ hufanya uhusiano wa Paulo na makundi mbalimbali uwe wazi kwa Kiswahili.
- source_word: γέγονα
  choice: nimekuwa
  rationale: Wakati timilifu unaonyesha mwenendo uliotokea na ambao matokeo yake yanaendelea; ‘nimekuwa’ huhifadhi kipengele hicho.
- source_word: πάντα
  choice: mambo yote
  rationale: Huhifadhi upana na muundo wa usemi ‘mambo yote kwa watu wote’ bila kudai kwamba Paulo alikubali kila tendo au njia.
- source_word: πάντως
  choice: kwa njia zote
  rationale: Katika sentensi hii inaonyesha kutumia kila njia inayowezekana ili kufikia lengo; tanbihi inaeleza chaguo la maana bila kuingiza wazo la njia zisizo halali.
- source_word: τινὰς
  choice: baadhi yao
  rationale: Huhifadhi unyenyekevu wa kiwakilishi kisichotaja idadi kamili na hufanya marejeo kwa watu wote yaliyotangulia yawe wazi.
- source_word: σώσω
  choice: nipate kuwaokoa
  rationale: Huhifadhi lugha halisi ya wokovu na hali ya kusudi inayotolewa na ἵνα, huku muktadha ukionyesha Paulo kama mtumishi anayetumiwa katika kuwaokoa wengine.
theological_decisions:
- issue: Maana ya ‘walio dhaifu’
  choice: Kutafsiri kwa upana kama ‘walio dhaifu’.
  alternative: ‘Walio dhaifu katika dhamiri.’
  rationale: Katika 1 Wakorintho neno hilo linaweza kuwahusu wenye dhamiri inayoweza kujeruhiwa, lakini mstari wenyewe hauwekei udhaifu huo mpaka huo; tafsiri kuu inahifadhi upana huo.
- issue: Nguvu ya kitenzi ‘kuwaokoa’
  choice: Kutumia ‘nipate kuwaokoa’ kwa lengo la uinjilisti la Paulo.
  alternative: ‘Nipate kuwasaidia waokolewe.’
  rationale: σώσω ni lugha ya moja kwa moja ya wokovu. Kuifanya iwe dhaifu kungepunguza uzito wa matini, ilhali muktadha mpana humruhusu msomaji kuelewa nafasi ya Paulo kama chombo bila kutatua kimadhehebu suala la uwakala wa wokovu.
- issue: Upana wa ‘mambo yote kwa watu wote’
  choice: Kuhifadhi usemi mpana bila kuongeza mpaka wa kimaadili katika matini kuu.
  alternative: ‘Nimejipatanisha kwa kila namna na watu wote.’
  rationale: Kigiriki kinatumia usemi wenye nguvu na mpana. Ufafanuzi unaoweza kupunguza au kuipanua maana kupita kiasi haupaswi kuingizwa kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘dhaifu’ yamehifadhiwa kwa nguvu ya balagha, na sentensi zimeundwa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
