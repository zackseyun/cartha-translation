  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa swali la balagha: ἢ (‘Au je’), mkazo wa μόνος kwa washiriki wawili (‘mimi na Barnaba peke yetu’), ukanushi wa οὐκ ἔχομεν (‘tusio na’), na ἐξουσίαν μὴ ἐργάζεσθαι (‘haki ya kutofanya kazi’). ‘Haki’ hutoa kwa usahihi maana ya stahili/uhuru halali katika muktadha huu, bila kuingiza dai la mamlaka ya kutawala.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kinaeleweka. Muundo ‘Au je, ni mimi na Barnaba peke yetu tusio na ...?’ ni swali la balagha la kawaida na unahifadhi mkazo wa ‘sisi tu.’
