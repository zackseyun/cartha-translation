  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: sw
  text: Au je, ni mimi na Barnaba peke yetu tusio na haki ya kutofanya kazi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka ya kutofanya kazi” au “uhuru wa kutofanya kazi.” Maana hapa ni haki ya kuacha kazi ya kujipatia riziki ili mtu apate msaada katika huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au je
  rationale: Huendeleza hoja kwa kuanzisha uwezekano mwingine katika swali la balagha; muundo huu ni wa asili katika Kiswahili.
- source_word: μόνος
  choice: peke yetu
  rationale: Neno hili linawahusu kwa pamoja Paulo na Barnaba na kusisitiza kwamba wao ndio pekee wanaodaiwa kukosa haki hiyo.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: mimi na Barnaba
  rationale: Huhifadhi mpangilio wa Kigiriki kwa Kiswahili cha kawaida na kulinakili jina Βαρναβᾶς kama Barnaba.
- source_word: οὐκ ἔχομεν
  choice: tusio na
  rationale: Hutoa kwa ufupi na kwa njia ya kawaida maana ya kitenzi kilichokanushwa ndani ya swali la balagha.
- source_word: ἐξουσίαν
  choice: haki
  rationale: Katika muktadha huu ni ustahili halali wa mtume kupata msaada, si mamlaka ya kutawala.
- source_word: μὴ ἐργάζεσθαι
  choice: kutofanya kazi
  rationale: 'Huhifadhi moja kwa moja maudhui ya haki inayotajwa: kutojipatia riziki kwa kazi, bila kuongeza maelezo yasiyomo wazi katika mstari.'
theological_decisions:
- issue: Maana ya ἐξουσία katika muktadha
  choice: Haki ya kutofanya kazi ya kujitegemeza na badala yake kupata msaada katika huduma
  alternative: Mamlaka au uhuru kwa maana ya jumla, bila rejeleo mahsusi kwa msaada wa kimwili
  rationale: Muktadha wa 1 Wakorintho 9 unahusu haki za mitume, hasa kupata chakula na msaada, pamoja na uamuzi wa Paulo wa kutotumia haki hizo. Tafsiri kuu haipanui mstari, huku tanbihi ikifafanua muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Swali la balagha na mkazo wa ‘peke yetu’ vimehifadhiwa.
