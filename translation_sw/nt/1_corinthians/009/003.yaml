lexical_decisions:
- source_word: ἀπολογία
  choice: ninavyojitetea
  rationale: Katika muktadha huu neno linaonyesha jibu la Paulo kwa uchunguzi kuhusu utume, mwenendo na haki zake. Kitenzi hiki ni cha kawaida na chenye hadhi, na hakidokezi kuomba msamaha.
- source_word: ἀνακρίνουσίν
  choice: wanaonichunguza
  rationale: Neno lina maana ya kumweka mtu chini ya uchunguzi au tathmini makini. 'Wanaonichunguza' huhifadhi maana hiyo bila kuashiria kwa lazima hukumu ya mwisho.
- source_word: Ἡ ἐμὴ
  choice: ninavyojitetea
  rationale: Umilikaji wa nafsi ya kwanza umeonyeshwa kiasili katika kiambishi 'ni-' cha kitenzi, badala ya muundo mzito wa 'utetezi wangu'.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: mbele ya wale wanaonichunguza
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida hadhira ambayo Paulo anajitetea mbele yake, huku ukihifadhi uwezekano wa mazingira ya uchunguzi.
- source_word: ἐστιν αὕτη
  choice: Hivi ndivyo
  rationale: Muundo huu wa Kiswahili unatambulisha kwa ufasaha namna au yaliyomo katika utetezi wa Paulo, kulingana na kazi ya kiwakilishi cha kuonyesha katika sentensi.
