review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s non-use of the provisions and preserves the rhetorically broken construction after ἤ. However, “hata moja ya mambo haya” is not idiomatic with the plural “mambo,” and “sababu yangu ya kujisifu” adds an explicit causal nuance to καύχημα that is better left implicit in the main text.
  naturalness: “Sijatumia lolote kati ya mambo haya” is natural Standard East African Swahili. “Fahari yangu” is a concise, established literary-register rendering for Paul’s καύχημα, and “kuifanya ... kuwa bure” naturally represents the metaphor of κενώσει without supplying the interrupted comparison.
  terminology: Use “fahari yangu” for καύχημά μου rather than the interpretive “sababu yangu ya kujisifu.” Retain “nitendewe hivyo” for the compressed passive/resultative clause, and retain the dash to reflect the Greek anacoluthon.
  issues:
  - severity: medium
    issue: “hata moja ya mambo haya”
    rationale: With plural “mambo haya,” the phrase is grammatically and idiomatically strained in Swahili. The Greek οὐδενὶ τούτων means ‘none of these’; “lolote kati ya mambo haya” conveys this naturally.
  - severity: medium
    issue: “sababu yangu ya kujisifu” for τὸ καύχημά μου
    rationale: Although καύχημα can refer contextually to a ground for boasting, “sababu” makes that contextual inference explicit. “Fahari yangu” preserves the broader Greek term, including its rhetorical ambiguity, more directly.
  - severity: low
    issue: “atakayeondoa sababu yangu ya kujisifu” for κενώσει
    rationale: “Kuondoa” coupled with “sababu” changes the image from rendering a boast void to removing its basis. “Ataifanya fahari yangu kuwa bure” better retains the metaphor and scope of κενώσει.
  revised_text: Lakini mimi sijatumia lolote kati ya mambo haya[a]. Wala sikuandika mambo haya ili nitendewe hivyo[b], kwa maana ni afadhali nife kuliko—hakuna mtu atakayeifanya fahari yangu kuwa bure.
  revised_footnotes:
