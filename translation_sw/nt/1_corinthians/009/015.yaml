  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: sw
  text: Lakini mimi sijatumia lolote kati ya mambo haya[a]. Wala sikuandika mambo haya ili nitendewe hivyo[b], kwa maana ni afadhali nife kuliko—hakuna mtu atakayeifanya fahari yangu kuwa bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi maana ya muktadha, “lolote kati ya haki hizi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinakatika baada ya “kuliko—” kisha kinaendelea: “fahari yangu hakuna mtu atakayeifanya kuwa bure.” Tafsiri nyingi hulainisha maana kuwa, “kuliko kumruhusu mtu yeyote aifanye fahari yangu kuwa bure.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: sijatumia
  rationale: Kauli ya timilifu inaonyesha kwamba Paulo hajajinufaisha na haki alizokuwa amezizungumzia; ‘sijatumia’ ni ya kawaida na haidokezi matumizi mabaya.
- source_word: οὐδενὶ τούτων
  choice: hata moja ya mambo haya
  rationale: Hufuata muundo wa Kigiriki huku muktadha ukionyesha kwamba mambo yanayokusudiwa ni haki za kupata msaada.
- source_word: ἔγραψα ... ταῦτα
  choice: sikuandika mambo haya
  rationale: Wakati uliopita rahisi unafaa kwa aoristi, na ‘mambo haya’ hurejelea maelezo yaliyotangulia katika barua.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: ili nitendewe hivyo
  rationale: Huwasilisha kusudi la ἵνα na maana ya Paulo kutopenda mpango huo utumike kwake, kwa Kiswahili cha kawaida.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: kwa maana ni afadhali nife
  rationale: Huhifadhi wazo la Kigiriki kwamba kufa ni bora kwake kuliko jambo linalofuata, na pia huandaa sentensi iliyokatizwa.
- source_word: τὸ καύχημά μου
  choice: sababu yangu ya kujisifu
  rationale: καύχημα hapa inaweza kumaanisha msingi au sababu ya kujisifu, si tendo la kujisifu pekee; usemi huu unaeleweka vizuri kwa Kiswahili.
- source_word: κενώσει
  choice: at...ondoa
  rationale: Kitenzi humaanisha kufanya kitu kiwe tupu au kukibatilisha. Pamoja na ‘sababu yangu ya kujisifu,’ ‘kuondoa’ ni ya asili na huhifadhi maana ya kuinyang'anya nguvu au msingi.
theological_decisions:
- issue: Muundo uliokatika ghafla baada ya ἤ
  choice: Kuhifadhi mkato baada ya ‘kuliko—’ kisha kuanza kauli ‘hakuna mtu atakayeondoa...’
  alternative: ni afadhali nife kuliko kumruhusu mtu yeyote aondoe sababu yangu ya kujisifu
  rationale: Kigiriki kinaacha ulinganisho bila kuukamilisha baada ya ἤ (‘kuliko—’) na kisha kinaendelea kwa kauli mpya. Mkato huhifadhi msisitizo wa kihisia na utata huo badala ya kuongeza maneno yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nitendewe hivyo’ ni ya asili kuliko ufuatishaji wa neno kwa neno wa ‘itokee hivyo kwangu.’ Mkato umehifadhiwa kwa sababu ni sehemu muhimu ya balagha ya chanzo.
