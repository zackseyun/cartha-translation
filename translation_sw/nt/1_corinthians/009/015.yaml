revisions:
- from: Lakini mimi sijatumia hata moja ya mambo haya[a]. Wala sikuandika mambo haya ili nitendewe hivyo[b], kwa maana ni afadhali nife kuliko—hakuna mtu atakayeondoa sababu yangu ya kujisifu.
  to: Lakini mimi sijatumia lolote kati ya mambo haya[a]. Wala sikuandika mambo haya ili nitendewe hivyo[b], kwa maana ni afadhali nife kuliko—hakuna mtu atakayeifanya fahari yangu kuwa bure.
  rationale: The revision corrects an awkward quantifier construction, avoids making the contextual ‘ground for boasting’ interpretation explicit in the text, and renders κενώσει with an idiomatic Swahili equivalent that retains the Greek image. It preserves both the formal register and the deliberately unfinished comparison after “kuliko—.”
