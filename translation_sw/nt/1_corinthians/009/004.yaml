  text: Je, hatuna haki ya kula na kunywa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mamlaka ya kula na kunywa.” Hapa “haki” inamaanisha dai halali au uhuru; katika hoja ya Paulo, huenda inarejelea haki ya kupata msaada wa mahitaji.
