lexical_decisions:
- source_word: μὴ οὐκ
  choice: Je, sisi hatuna ...?
  rationale: Muundo huu unaanzisha swali la balagha linalotarajia jibu la kukubali. Kiswahili hiki kinahifadhi swali hilo kwa njia ya kawaida na iliyo wazi.
- source_word: ἔχομεν
  choice: tuna
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa moja kwa moja na kwa lugha ya kawaida.
- source_word: ἐξουσίαν
  choice: haki
  rationale: Katika muktadha huu neno linamaanisha uhalali au uhuru unaostahiliwa, si nguvu ghafi wala mamlaka ya kutawala. “Haki” linafaa kwa dai halali la mitume la kupata mahitaji yao.
- source_word: φαγεῖν
  choice: kula
  rationale: Kitenzi-jina hiki baada ya ἐξουσίαν kinaeleza tendo ambalo wana haki ya kulifanya.
- source_word: καὶ πεῖν
  choice: na kunywa
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya tendo la pili lililounganishwa na la kwanza.
theological_decisions:
- issue: Upeo wa haki ya kitume katika muktadha
  choice: Paulo anazungumzia haki halali ya mitume au watumishi kupata chakula na kinywaji, yaelekea kama msaada wa kimwili kutoka kwa wale wanaowahudumia.
  alternative: Kauli ya jumla kuhusu uhuru wa kawaida wa kila mtu kula na kunywa.
  rationale: Muktadha wa 1 Wakorintho 9 unahusu haki za Paulo akiwa mtume, hasa haki ya kutegemezwa na makanisa. Neno “haki” linahifadhi maana hiyo bila kuongeza waziwazi wazo la kutegemezwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Kiwakilishi “sisi” kimetajwa ili kuonyesha wazi wingi wa nafsi ya kwanza na kusisitiza nguvu ya swali la balagha.
