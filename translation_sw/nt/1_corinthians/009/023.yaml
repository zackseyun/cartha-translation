  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: sw
  text: Lakini ninafanya mambo yote kwa ajili ya Habari Njema,[a] ili nipate kuwa mshiriki pamoja na wengine katika Habari Njema hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “injili.”
    reason: lexical_alternative
  - marker: b
    text: Au “ili nipate kushiriki katika Habari Njema hiyo” au “ili nipate kuwa mshirika katika Habari Njema hiyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: mambo yote
  rationale: Kirai hiki kinahifadhi upana wa kauli ya Paulo na kwa kawaida kinarejelea yote anayofanya katika muktadha.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti ndogo na maelezo yaliyotangulia; “Lakini” ni ya asili na inaweka uhusiano huo wazi.
- source_word: ποιῶ
  choice: ninafanya
  rationale: Wakati uliopo unaeleza tendo la Paulo linaloendelea au lililo desturi yake.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: kwa ajili ya Habari Njema
  rationale: διά pamoja na hali ya kushutumiwa hapa inaonyesha kusudi, sababu, au manufaa; “kwa ajili ya” huhifadhi upana huo, na “Habari Njema” ni tafsiri wazi ya εὐαγγέλιον.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” hutambulisha kwa kawaida kishazi cha kusudi katika Kiswahili.
- source_word: συγκοινωνὸς
  choice: mshiriki pamoja na wengine
  rationale: Uundaji wa neno hilo una wazo la kushiriki kwa pamoja; kirai hiki hulionyesha bila kufafanua kupita kiasi aina ya ushirika unaokusudiwa.
- source_word: αὐτοῦ
  choice: katika hayo
  rationale: Kiwakilishi kinarejelea kwa kawaida εὐαγγέλιον; Kiswahili hutumia “hayo” kurejelea “Habari Njema,” huku “katika” ikilingana na matumizi ya “mshiriki.”
- source_word: γένωμαι
  choice: nipate kuwa
  rationale: Muundo huu unaonyesha kusudi na kuingia katika hali ya kuwa mshiriki, badala ya kueleza hali tuli pekee.
theological_decisions:
- issue: Maana ya kushiriki kwa Paulo kuhusiana na Habari Njema
  choice: Maandishi yanaacha wazi ikiwa ushiriki huo unahusu baraka za Habari Njema, kuenezwa kwake, au kazi inayohusiana nayo.
  alternative: Kufafanua moja kwa moja kuwa Paulo anashiriki baraka zake au huduma ya kuihubiri.
  rationale: συγκοινωνός ni pana na mstari wenyewe haubainishi aina moja tu ya ushiriki; tafsiri haipaswi kuingiza mfumo maalumu wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Habari Njema” hutoa maana wazi, huku tanbihi ikihifadhi istilahi ya jadi “injili.”
