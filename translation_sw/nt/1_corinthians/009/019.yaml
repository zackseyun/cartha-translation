  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: sw
  text: Kwa maana, ingawa niko huru na watu wote, nilijifanya mtumwa[a] wa wote, ili nipate watu wengi zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi.” Kigiriki kinatumia lugha ya utumwa; “mtumwa” limetumiwa hapa kwa sababu utofautishaji wake na “huru” ni muhimu katika hoja ya Paulo.
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: huru
  rationale: Neno hili lina maana ya kutokuwa katika utumwa au chini ya mamlaka ya mwingine; “huru” pia linadumisha utofautishaji na “mtumwa” baadaye katika sentensi.
- source_word: ἐκ πάντων
  choice: kutoka kwa watu wote
  rationale: Kirai hiki kinaeleza uhuru wa Paulo kuhusiana na watu wote. Kuongeza “watu” kunaweka wazi rejeo la πάντων kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: πᾶσιν
  choice: wa wote
  rationale: Baada ya “nimejifanya mtumwa,” umbo hili linaonyesha wale ambao Paulo amejinyenyekeza kwao. “Wa wote” linahifadhi urudiaji wa “wote” uliomo katika Kigiriki.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: nimejifanya mtumwa
  rationale: Kitenzi δουλόω kinatumia lugha ya utumwa. “Nimejifanya mtumwa” ni Kiswahili cha asili kinachohifadhi tendo la hiari la Paulo na nguvu ya utofautishaji kati ya kuwa huru na kuwa mtumwa.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi; “ili” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: τοὺς πλείονας
  choice: wengi zaidi
  rationale: Kirai hiki kinamaanisha idadi kubwa zaidi ya watu. Tafsiri hii haiongezi wazo lenye nguvu zaidi la “wengi kadiri iwezekanavyo,” ambalo halijaelezwa moja kwa moja katika Kigiriki.
- source_word: κερδήσω
  choice: niwapate
  rationale: Kitenzi hiki kimetumiwa kwa njia ya sitiari kumaanisha kupata au kuvuta watu kupitia huduma. “Niwapate” kinadumisha sitiari hiyo kwa Kiswahili bila kuieleza kupita kiasi.
theological_decisions:
- issue: Tafsiri ya δουλόω na lugha ya utumwa
  choice: mtumwa
  alternative: mtumishi
  rationale: Hoja ya Paulo inategemea utofautishaji wa moja kwa moja kati ya kuwa “huru” na kujifanya “mtumwa.” “Mtumishi” ingepunguza nguvu ya picha hiyo na kufifisha mvutano wa kimakusudi wa sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imedumisha urudiaji wa “wote” na utofautishaji wa “huru—mtumwa,” huku “watu” likiongezwa mara moja ili rejeo lieleweke wazi.
