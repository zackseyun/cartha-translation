  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: sw
  text: Vivyo hivyo nanyi, kwa kuwa mna shauku ya karama za kiroho[a], jitahidini mpate kuzidi kwa ajili ya kulijenga kanisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “roho” au “mambo ya kiroho”; muktadha unaelekeza kwenye karama za kiroho au maonyesho ya Roho.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo nanyi
  rationale: Inaendeleza ulinganisho wa hoja iliyotangulia kwa Kiswahili cha kawaida na kuhifadhi nguvu ya kiunganishi.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Inaonyesha msingi au sababu ya himizo linalofuata.
- source_word: ζηλωταί
  choice: mna shauku
  rationale: Inaeleza kuwa wao ni watu wenye hamu kubwa bila kutumia neno gumu au lenye maana hasi.
- source_word: πνευμάτων
  choice: karama za kiroho[a]
  rationale: Muktadha wa sura 12–14 unahusu karama na maonyesho yanayohusishwa na Roho; tanbihi inahifadhi ufupi na utata wa neno la Kigiriki.
- source_word: πρὸς τὴν οἰκοδομὴν
  choice: kwa ajili ya kulijenga
  rationale: Inahifadhi sitiari ya ujenzi na kueleza mwelekeo au kusudi la wingi unaotakiwa.
- source_word: τῆς ἐκκλησίας
  choice: kanisa
  rationale: Ni neno la kawaida kwa jumuiya ya waamini katika matumizi ya Paulo na linaeleweka vizuri kwa wasomaji wa sasa.
- source_word: ζητεῖτε
  choice: tafuteni
  rationale: Huhifadhi amri ya kutafuta au kujitahidi kwa makusudi.
- source_word: ἵνα περισσεύητε
  choice: kuzidi
  rationale: Huwasilisha wazo la kuwa na wingi au kufurika bila kuongeza kitu mahsusi ambacho hakijatajwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya πνευμάτων katika muktadha
  choice: karama za kiroho
  alternative: mambo ya kiroho; roho
  rationale: Muktadha unazungumzia maonyesho na karama zinazohusishwa na Roho kwa ajili ya kulijenga kanisa. Hata hivyo, kwa kuwa Kigiriki kinasema kwa ufupi ‘za roho’ au ‘za kiroho,’ uwezekano huo umehifadhiwa katika tanbihi.
- issue: Kitu kinachohusishwa na περισσεύητε
  choice: kuzidi, bila kuongeza ‘katika hizo’
  alternative: kuzidi katika karama hizo
  rationale: Kigiriki hakitaji wazi kitu ambacho waamini wanapaswa kuzidi ndani yake; tafsiri inaacha mvutano huo na kuunganisha kuzidi na kusudi la kulijenga kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kulijenga kanisa’ huhifadhi sitiari ya Paulo kwa lugha inayoeleweka kwa urahisi; ‘kuzidi’ huhifadhi kwa kiasi ufaacho hali ya kutotajwa kwa kitu cha kitenzi.
