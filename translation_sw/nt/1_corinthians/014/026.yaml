source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: sw
  text: Basi, ndugu, iweje? Mnapokusanyika, kila mmoja ana zaburi, ana fundisho, ana ufunuo, ana lugha[a], na ana tafsiri. Mambo yote na yafanyike kwa ajili ya kujenga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimi.” Neno la Kigiriki linaweza kumaanisha ulimi au lugha; hapa “lugha” huhifadhi istilahi inayotumiwa katika mjadala huu bila kufafanua zaidi aina ya usemi unaokusudiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Basi, ndugu, iweje?
  rationale: Hutoa swali la balagha linaloanzisha hitimisho la vitendo, huku likibaki karibu na muundo wa Kigiriki.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili sanifu, “ndugu” ni neno la kawaida linaloweza kulihusu kusanyiko lote bila kubainisha jinsia.
- source_word: ὅταν συνέρχησθε
  choice: Mnapokusanyika
  rationale: Ni usemi wa asili unaoonyesha jambo linalotokea kila waamini wanapokutana pamoja.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya mgawanyo kwa kila mshiriki wa kusanyiko.
- source_word: ψαλμὸν
  choice: zaburi
  rationale: Huhifadhi istilahi mahususi ya wimbo wa sifa badala ya kuipanua kuwa wimbo wowote.
- source_word: διδαχὴν
  choice: fundisho
  rationale: Ni neno linaloeleweka na linalofaa kwa mchango wa kufundisha katika kusanyiko.
- source_word: ἀποκάλυψιν
  choice: ufunuo
  rationale: Huhifadhi maana ya jambo lililofunuliwa bila kuongeza maelezo yasiyomo katika matini.
- source_word: γλῶσσαν
  choice: lugha
  rationale: Ni istilahi ya kawaida ya Kiswahili katika mjadala huu; tanbihi huhifadhi uwezekano wa maana ya “ulimi” na kuepuka kuamua zaidi ya matini kuhusu hali ya usemi huo.
- source_word: ἑρμηνείαν
  choice: tafsiri
  rationale: Inafaa kwa muktadha wa kufanya usemi wa lugha ueleweke kwa kusanyiko, bila kuubadili kuwa maelezo ya kawaida tu.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Mambo yote na yafanyike kwa kusudi la kujenga
  rationale: Huhifadhi agizo na sitiari ya ujenzi, kwa usemi wa Kiswahili unaoeleweka bila kulazimisha kitu kinachojengwa ambacho hakikutajwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya γλῶσσα katika 1 Wakorintho 12–14
  choice: lugha
  alternative: ulimi
  rationale: “Lugha” ni ya asili zaidi katika Kiswahili kwa uwezo wa kusema, lakini tanbihi huhifadhi upana wa neno la Kigiriki na mvutano kuhusu aina halisi ya usemi unaozungumziwa.
- issue: Mhusika wa sitiari ya οἰκοδομή
  choice: kwa kusudi la kujenga
  alternative: kwa kusudi la kulijenga kanisa
  rationale: Matini ya Kigiriki haitaji wazi kitu kinachojengwa katika mstari huu. Muundo huu huhifadhi sitiari na kumwacha msomaji atambue kutokana na muktadha kuwa ni kusanyiko linaloimarishwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “ana” yamehifadhiwa ili kuakisi msisitizo wa orodha ya Kigiriki. “Ndugu” linatumika kwa maana jumuishi ya washiriki wa kusanyiko.
