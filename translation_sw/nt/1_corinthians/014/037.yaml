  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: sw
  text: Mtu yeyote akijiona kuwa nabii au mtu wa kiroho, atambue kwamba mambo ninayowaandikia ni ya Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni amri ya Bwana.” Kigiriki kinasema kihalisi, “ni ya Bwana” au “ni mali ya Bwana”; neno “amri” linaweza kueleweka kutokana na muktadha, lakini halijaandikwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: akijiona kuwa
  rationale: Katika muktadha huu kitenzi kinaonyesha mtu anavyojipima au anavyodai kuwa na hadhi fulani; “akijiona kuwa” ni Kiswahili cha kawaida na kinadumisha sauti inayoweza kuwa ya kusahihisha.
- source_word: προφήτης
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa προφήτης, na muktadha unahusu karama za kiroho na kusema unabii.
- source_word: πνευματικός
  choice: mtu wa kiroho
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na kinaweza kumaanisha mtu anayejiona kuwa wa kiroho au mwenye karama za Roho; tafsiri hii inadumisha upana huo bila kuufinya.
- source_word: ἐπιγινωσκέτω
  choice: na atambue
  rationale: Amri hii inataka kukiri au kutambua mamlaka ya jambo linaloandikwa; “na atambue” ni ya asili na yenye nguvu inayofaa.
- source_word: ἃ γράφω ὑμῖν
  choice: mambo ninayowaandikia
  rationale: Hii inawakilisha kwa ufasaha kiwakilishi cha uhusiano na wakati wa sasa wa uandishi wa barua.
- source_word: κυρίου ἐστίν
  choice: ni ya Bwana
  rationale: Kigiriki kinasema kwa kifupi na kihalisi “ni ya Bwana.” Tafsiri hii inadumisha utata halisi wa uhusiano wa umilikaji au chanzo badala ya kuongeza nomino “amri,” ambayo haipo wazi katika matini.
theological_decisions:
- issue: Maana iliyodokezwa ya κυρίου ἐστίν
  choice: ni ya Bwana
  alternative: ni amri ya Bwana
  rationale: Kifungu cha Kigiriki ni cha mkato na hakina nomino iliyo wazi inayolingana na “amri.” Ingawa muktadha unaashiria mamlaka ya Bwana, matini kuu inadumisha usemi mpana “ni ya Bwana,” huku tanbihi ikieleza uwezekano wa kuelewa “amri.”
- issue: Jinsia katika τις ... προφήτης ... πνευματικός
  choice: Mtu yeyote ... atambue
  alternative: Yeyote ... yeye atambue
  rationale: Kiswahili hakihitaji kiwakilishi chenye jinsia hapa. Muundo huu unarejelea mtu mmoja yeyote bila kuingiza utofauti wa kijinsia usiohitajika, huku ukidumisha umoja wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mtu wa kiroho” inadumisha upana wa πνευματικός, na “ni ya Bwana” inalinda mkato na utata wa Kigiriki. Alama ya tanbihi imewekwa mara moja baada ya kifungu kinachohusika.
