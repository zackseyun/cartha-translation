  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: sw
  text: Manabii wawili au watatu wanene, na wengine wapime[a] yaliyosemwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wahukumu,” “wapambanue,” au “watathmini.” Kitenzi cha Kigiriki kinaweza kumaanisha kuyachunguza maneno ya kinabii ili kutambua thamani au uhalali wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: manabii
  rationale: Nomino hii inawataja manabii au wasemaji wa kinabii; “manabii” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: δὲ
  choice: na
  rationale: Hapa neno hili linaendeleza mfululizo wa maagizo kwa mpito hafifu, bila kuonyesha upinzani mkali.
- source_word: δύο ἢ τρεῖς
  choice: wawili au watatu
  rationale: Hifadhi ya moja kwa moja ya idadi na chaguo lililo katika Kigiriki.
- source_word: λαλείτωσαν
  choice: wanene
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: οἱ ἄλλοι
  choice: wengine
  rationale: Huhifadhi kutobainishwa kwa Kigiriki kuhusu kama hawa ni manabii wengine, viongozi, au washiriki wengine wa kusanyiko.
- source_word: διακρινέτωσαν
  choice: wapime yaliyosemwa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuchunguza na kutathmini maneno ya kinabii, si lazima kutoa hukumu ya kulaani. “Wapime” ni ya asili na huonyesha tathmini makini; “yaliyosemwa” huweka wazi kitu kinachotathminiwa kutokana na muktadha.
theological_decisions:
- issue: Utambulisho wa “wengine” katika kusanyiko
  choice: Imetafsiriwa kwa ujumla kuwa “wengine,” bila kubainisha kundi hususa.
  alternative: “manabii wengine” au “washiriki wengine wa kusanyiko”
  rationale: Kigiriki hakisemi wazi kundi hilo ni nani; tafsiri inahifadhi utata huo badala ya kuamua suala la mpangilio wa kanisa.
- issue: Kitu kinachopimwa
  choice: “yaliyosemwa” linaelekeza tathmini kwenye ujumbe wa kinabii katika muktadha.
  alternative: 'Kuacha kitenzi bila yambwa: “wengine wapambanue”'
  rationale: Kigiriki hakina yambwa lililotajwa wazi, lakini muktadha unaonyesha kuwa maneno ya kinabii ndiyo yanayotathminiwa. Ufafanuzi huu wa kiasi hufanya Kiswahili kiwe cha kawaida bila kubadili lengo la agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wanene” na “wapime” huhifadhi uzito wa maagizo huku sentensi ikibaki ya asili.
