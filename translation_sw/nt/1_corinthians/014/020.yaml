  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: sw
  text: Ndugu[a], msiwe watoto katika kufikiri kwenu; bali katika uovu[b] iweni watoto wachanga, lakini katika kufikiri kwenu iweni watu wazima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “ndugu wa kiume,” lakini umbo hili la wingi linaweza kutumiwa kulihutubia kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au “nia mbaya”; neno la Kigiriki linaweza kumaanisha uovu, ubaya, au nia ya kudhuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ndugu
  rationale: Katika Kiswahili, “ndugu” ni namna ya kawaida na yenye heshima ya kulihutubia kusanyiko, na inaweza kuwajumuisha waumini wa kiume na wa kike. Tanbihi inaweka wazi umbo la kiume la neno la Kigiriki.
- source_word: παιδία
  choice: watoto
  rationale: Neno hili linamaanisha watoto kwa ujumla. “Watoto” linadumisha tofauti na “watoto wachanga” na “watu wazima” bila kubainisha umri kupita kiasi.
- source_word: γίνεσθε
  choice: msiwe / iweni
  rationale: Ingawa kitenzi cha Kigiriki kinaweza kusisitiza kuingia katika hali fulani, katika amri hizi Kiswahili cha kawaida hutumia “msiwe” na “iweni”; muundo huu unadumisha ulinganifu wa kisemantiki bila usemi mzito.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: katika kufikiri kwenu
  rationale: φρήν hapa huelekeza kwenye uwezo au namna ya kufikiri na kuelewa. “Katika kufikiri kwenu” ni ya sasa, wazi, na inafaa kwa dativu ya jambo linalorejelewa.
- source_word: τῇ κακίᾳ
  choice: katika uovu
  rationale: κακία linaweza kumaanisha uovu, ubaya, au nia ya kudhuru. “Uovu” linahifadhi maana pana ya kimaadili; maana finyu zaidi imeonyeshwa katika tanbihi.
- source_word: νηπιάζετε
  choice: iweni watoto wachanga
  rationale: Kitenzi hiki humaanisha kuwa au kutenda kama mtoto mchanga. Tafsiri hii inadumisha tofauti iliyokusudiwa kati ya watoto kwa ujumla na ukomavu.
- source_word: τέλειοι
  choice: watu wazima
  rationale: Katika muktadha huu τέλειοι humaanisha waliokomaa au waliokua kikamilifu, si wakamilifu wasio na dhambi. “Watu wazima” linaendeleza picha ya umri inayotumiwa katika mstari huu.
- source_word: ἀλλὰ ... δὲ
  choice: bali ... lakini
  rationale: Viunganishi hivi vinaonyesha tofauti mbili zinazofuatana. “Bali ... lakini” vinadumisha mgeuko wa hoja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa kijinsia katika salamu kwa kusanyiko
  choice: Kutumia “Ndugu” katika maandishi na kueleza katika tanbihi kuwa Kigiriki kina umbo la kiume la wingi.
  alternative: Ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki Ἀδελφοί ni la kiume kwa umbo lakini katika muktadha huu linaelekea kulihutubia kanisa lote. Kiswahili “Ndugu” ni mwito wa kawaida kwa kusanyiko mchanganyiko; tanbihi inahifadhi taarifa ya umbo la chanzo bila kufanya maandishi yasikike yasiyo ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “katika kufikiri kwenu” yamehifadhiwa ili kuonyesha ulinganifu wa kisemantiki na mkazo wa maandishi ya Kigiriki. “Watoto wachanga” na “watu wazima” hudumisha picha ya ukuaji bila kuingiza wazo la ukamilifu usio na dhambi.
