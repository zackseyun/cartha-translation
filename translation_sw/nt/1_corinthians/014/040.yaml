translation:
  language: sw
  text: Lakini kila jambo na lifanyike kwa namna inayofaa[a] na kwa utaratibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa adabu; neno la Kigiriki humaanisha «kwa namna inayofaa au inayostahili».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: kila jambo
  rationale: Kirai hiki kinawasilisha kwa Kiswahili cha kawaida maana pana ya vitu au matendo yote yanayohusika katika mkusanyiko.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti ndogo au hatua ya kuhamia kwenye agizo la muhtasari baada ya maelekezo yaliyotangulia.
- source_word: εὐσχημόνως
  choice: kwa namna inayofaa
  rationale: Hueleza jambo linalofanywa kwa ustahili, kwa adabu, na kwa jinsi inayolingana na mazingira; tafsiri hii ni wazi na ya kawaida bila kupunguza upana wa maana.
- source_word: κατὰ τάξιν
  choice: kwa utaratibu
  rationale: Kirai hiki humaanisha kufuata mpangilio unaofaa; 'kwa utaratibu' ni tafsiri ya asili na iliyo wazi kwa Kiswahili.
- source_word: γινέσθω
  choice: na lifanyike
  rationale: Hifadhi nguvu ya amri ya nafsi ya tatu kwa muundo wa Kiswahili 'na lifanyike,' unaofaa hapa kwa agizo la jumla.
theological_decisions:
- issue: Upeo wa agizo la Paulo katika muktadha wa ibada
  choice: Agizo la jumla kwamba kila jambo katika kusanyiko lifanyike kwa kufaa na kwa utaratibu, bila kutaja mfumo fulani wa dhehebu wa kuendesha ibada.
  alternative: Kulielewa kama sheria finyu inayoweka mpangilio maalumu na usiobadilika wa ibada, au kama kanuni inayohusu kila tendo la kanisa nje ya muktadha huu.
  rationale: Mstari huu unatoa muhtasari wa mjadala wa karibu kuhusu kunena na utaratibu katika kusanyiko. Tafsiri inadumisha ujumla wa Kigiriki bila kuingiza mfumo maalumu wa kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo 'kila jambo na lifanyike' ni wa kimaandiko lakini bado ni wa kawaida na unaonyesha wazi nguvu ya agizo.
