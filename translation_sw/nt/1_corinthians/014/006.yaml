id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: sw
  text: Sasa basi, ndugu[a], nikija kwenu nikinena kwa lugha[b], nitawafaidi nini nisiposema nanyi kwa ufunuo, au kwa maarifa, au kwa unabii, au kwa mafundisho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina maana ya msingi ya “ndugu wa kiume,” lakini linaweza kutumiwa kulihutubia kusanyiko lenye wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au “lugha mbalimbali.” Neno la Kigiriki linaweza kumaanisha lugha; hapa linahusu jambo la usemi linalojadiliwa katika 1 Wakorintho 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Basi sasa
  rationale: Inaonyesha mpito kwenda hoja ya sasa, huku “basi” ikidokeza uhusiano wake na maelezo yaliyotangulia bila kutia uzito usio wa lazima katika utofautishaji.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni namna ya kawaida na yenye heshima ya kulihutubia kusanyiko; katika Kiswahili inaweza kuwahusu wanaume na wanawake bila kuficha kwamba neno la Kigiriki lina umbo la kiume katika wingi.
- source_word: γλώσσαις λαλῶν
  choice: nikinena kwa lugha
  rationale: “Kunena kwa lugha” hutambulisha jambo la usemi wa kiroho linalojadiliwa katika 1 Wakorintho 12–14, huku “lugha” ikihifadhi uwezekano wa msingi wa neno la Kigiriki kumaanisha lugha.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: nitawafaidi nini
  rationale: Kitenzi “kufaidi” kinaonyesha manufaa au msaada ambao wasikilizaji wangepata, na muundo huu unafuata swali la Kigiriki kwa Kiswahili kinachoeleweka.
- source_word: ἐὰν μὴ
  choice: nisipo-
  rationale: Muundo hasi wa masharti “nisiposema” unawasilisha maana ya “isipokuwa/ikiwa sita-” kwa ufupi na kwa ufasaha.
- source_word: λαλήσω
  choice: nisiposema
  rationale: “Kusema” ni usemi wa kawaida wa mawasiliano ya mdomo na unaepuka kufanya kila matumizi ya λαλέω kuwa istilahi maalumu.
- source_word: ἐν ἀποκαλύψει
  choice: kwa ufunuo
  rationale: “Kwa” inaonyesha namna au njia ya usemi wenye manufaa na inahifadhi ulinganifu wa orodha.
- source_word: ἐν γνώσει
  choice: kwa maarifa
  rationale: “Maarifa” yanawasilisha γνώσις kwa kawaida katika muktadha huu, huku “kwa” ikidumisha muundo sambamba.
- source_word: ἐν προφητείᾳ
  choice: kwa unabii
  rationale: “Unabii” ni tafsiri ya moja kwa moja na isiyoamua mapema namna halisi ya usemi huo wa kinabii.
- source_word: ἐν διδαχῇ
  choice: kwa mafundisho
  rationale: “Mafundisho” ni neno la kawaida kwa yaliyofundishwa au tendo la kufundisha na linafaa katika orodha ya aina za usemi unaoeleweka.
theological_decisions:
- issue: Maana ya ἀδελφοί katika hotuba kwa kusanyiko
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wanaume na wanawake
  rationale: Neno la Kiswahili “ndugu” ni la kawaida katika hotuba ya pamoja na linaweza kujumuisha kusanyiko lote. Tanbihi inaeleza umbo la Kigiriki bila kulazimisha jinsia isiyokusudiwa katika Kiswahili.
- issue: Maana ya γλώσσαις katika 1 Wakorintho 12–14
  choice: lugha
  alternative: ndimi; lugha mbalimbali
  rationale: “Lugha” huhifadhi maana ya kileksia na hutambulisha jambo la usemi wa kiroho katika muktadha bila kuamua mjadala kuhusu asili yake, kama ni lugha za kibinadamu zinazotambulika au usemi wa aina nyingine.
- issue: Uhusiano wa vifungu vinne vyenye ἐν
  choice: kwa ufunuo, kwa maarifa, kwa unabii, kwa mafundisho
  alternative: katika ufunuo, katika maarifa, katika unabii, katika mafundisho
  rationale: “Kwa” inawasilisha uwezekano mkubwa wa maana ya namna au njia ya kusema. Haitangazi kwamba aina hizi nne ni sawa kabisa, bali inadumisha ulinganifu wa kisarufi wa orodha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kunena kwa lugha” kimetumiwa kwa sababu ni usemi unaotambulika katika muktadha huu; maneno mengine yamewekwa katika mtindo wa sasa na wa moja kwa moja.
