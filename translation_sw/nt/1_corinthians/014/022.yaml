reference: 1 Corinthians 14:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: sw
  text: Basi, ndimi[a] ni ishara, si kwa wale wanaoamini bali kwa wasioamini[b]; lakini unabii si kwa wasioamini bali kwa wale wanaoamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lugha.” Neno la Kigiriki linaweza kumaanisha lugha, lakini katika 1 Wakorintho 12–14 “ndimi” huhifadhi istilahi inayotumiwa na Paulo bila kuamua tafsiri inayobishaniwa ya aina ya usemi huu.
    reason: lexical_alternative
  - marker: b
    text: Kwa kuzingatia nukuu iliyotangulia kutoka Isaya 28:11–12, baadhi ya watafsiri huelewa “ishara” hapa kuwa ishara ya hukumu.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: γλῶσσαι
  choice: lugha
  rationale: Neno la Kigiriki linaweza kumaanisha ndimi au lugha. Katika Kiswahili, “lugha” ni ya asili zaidi kwa jambo la kunena, huku tanbihi ikihifadhi uwezekano wa tafsiri “ndimi” bila kuamua aina hasa ya unenaji.
- source_word: εἰς σημεῖόν
  choice: ni ishara
  rationale: Huwasilisha kwa ufupi kwamba lugha zina kazi au matokeo ya kuwa ishara, bila kubainisha kama ishara hiyo ni chanya au ya hukumu.
- source_word: τοῖς πιστεύουσιν
  choice: kwa wale wanaoamini
  rationale: Huhifadhi hali ya kitenzi ya kirai cha Kigiriki na kuweka wazi tofauti na wasioamini.
- source_word: τοῖς ἀπίστοις
  choice: kwa wasioamini
  rationale: Ni tafsiri fupi na ya kawaida inayolingana moja kwa moja na upande tofauti wa wale wanaoamini.
- source_word: προφητεία
  choice: unabii
  rationale: Ni istilahi ya kawaida ya kibiblia kwa kipawa au tendo la kutoa ujumbe wa kinabii katika sura hii.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha wazi tofauti kati ya lugha na unabii.
theological_decisions:
- issue: Maana ya γλῶσσαι katika muktadha wa karama
  choice: Imetafsiriwa “lugha,” na “ndimi” imetolewa kama uwezekano katika tanbihi.
  alternative: ndimi; lugha za kigeni; matamshi ya kiroho yasiyo lugha za kawaida
  rationale: Kigiriki hakibainishi hapa hali hasa ya unenaji. Tafsiri na tanbihi huepuka kuingiza msimamo wa dhehebu kuhusu jambo hilo.
- issue: Nguvu ya σημεῖον kuhusiana na wasioamini
  choice: Imetafsiriwa kwa namna ya kati kuwa “ishara.”
  alternative: ishara ya uthibitisho; ishara ya hukumu
  rationale: Muktadha wa Isaya 28 unaweza kuelekeza kwenye hukumu, lakini neno lenyewe hapa halisemi aina ya ishara; hivyo utata wa kiteolojia umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo sambamba wa sentensi umehifadhiwa ili kuonyesha tofauti kali kati ya lugha, unabii, wanaoamini na wasioamini.
