  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: sw
  text: siri za moyo wake zinakuwa wazi, na hivyo, akianguka kifudifudi, atamwabudu Mungu, akitangaza, “Kweli Mungu yuko miongoni mwenu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kweli Mungu yuko ndani yenu.”'
    reason: Maana mbadala inayowezekana ya ἐν ὑμῖν.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: siri
  rationale: Nomino hii ya wingi hurejelea mambo yaliyofichika ndani ya mtu; ‘siri’ ni ya asili katika Kiswahili na inafaa muktadha wa kufunuliwa.
- source_word: τῆς καρδίας αὐτοῦ
  choice: za moyo wake
  rationale: ‘Moyo’ huhifadhi istilahi ya kibiblia kuhusu kitovu cha mawazo na makusudi ya ndani bila kuifasiri kupita kiasi.
- source_word: φανερὰ γίνεται
  choice: zinawekwa wazi
  rationale: Kauli hii inaonyesha mambo yaliyofichika yakija kuwa dhahiri; ‘zinawekwa wazi’ ni ya kawaida na hudumisha wazo la kufunuliwa.
- source_word: καὶ οὕτως
  choice: naye hivyo
  rationale: Inaunganisha kufunuliwa kwa siri za moyo na mwitikio unaofuata kwa maana ya matokeo.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: akianguka kifudifudi
  rationale: ‘Kifudifudi’ huwasilisha kwa ufupi na kwa kawaida hali ya kuanguka uso ukielekea chini.
- source_word: προσκυνήσει τῷ θεῷ
  choice: atamwabudu Mungu
  rationale: Katika muktadha huu kitenzi kinaeleza ibada inayoelekezwa kwa Mungu; tendo la kusujudu tayari linaonyeshwa na ‘akianguka kifudifudi.’
- source_word: ἀπαγγέλλων
  choice: akitangaza
  rationale: Huonyesha tamko analolitoa huku akiitikia; ‘akitangaza’ lina uzito unaofaa bila kuongeza wazo lisilokuwamo.
- source_word: Ὄντως
  choice: Kweli
  rationale: ‘Kweli’ huonyesha msisitizo wa uhalisi wa hitimisho lake kwa Kiswahili cha kawaida.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Muktadha ni kusanyiko la waamini, hivyo usemi huu unaeleweka vizuri kama kuwapo kwa Mungu katikati yao; maana ya ‘ndani yenu’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἐν ὑμῖν katika tamko la mwisho
  choice: miongoni mwenu
  alternative: ndani yenu
  rationale: Muktadha wa karibu unahusu kusanyiko la kanisa na mtu wa nje kutambua kuwapo kwa Mungu katikati ya jumuiya hiyo. Hata hivyo, kihusishi cha Kigiriki kinaweza pia kumaanisha ‘ndani yenu,’ hivyo uwezekano huo umehifadhiwa katika tanbihi bila kuondoa mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na mwendo wa sentensi ya Kigiriki huku ukitumia ‘kifudifudi’ na ‘miongoni mwenu’ kwa ufasaha wa asili.
