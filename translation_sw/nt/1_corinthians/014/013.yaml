lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na maelezo yaliyotangulia; “Kwa hiyo” ni cha kawaida na kinahifadhi nguvu hiyo ya kimantiki.
- source_word: ὁ λαλῶν
  choice: anayesema
  rationale: Kirai cha Kigiriki ni hali ya kushiriki yenye kibainishi, kikimtaja mtu yeyote anayefanya tendo hilo. “Anayesema” ni cha asili katika Kiswahili na kinahifadhi umoja wa uwakilishi.
- source_word: γλώσσῃ
  choice: kwa lugha
  rationale: Nomino iko katika umoja na inataja usemi unaohitaji kufasiriwa. “Lugha” ni neno la kawaida la Kiswahili, huku tanbihi ikihifadhi uwezekano wa usemi wa ‘ulimi’ unaojulikana katika sura hii.
- source_word: προσευχέσθω
  choice: na aombe
  rationale: Ni amri ya nafsi ya tatu katika wakati wa sasa. Muundo “na aombe” unatoa himizo la moja kwa moja na la asili katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Hutambulisha kusudi au jambo linaloombwa; “ili” linahifadhi maana hiyo kwa uwazi.
- source_word: διερμηνεύῃ
  choice: aweze kufasiri
  rationale: Kitenzi kinamaanisha kuufanya usemi ueleweke kwa wengine. “Kufasiri” kinafaa zaidi hapa kuliko “kutafsiri,” ambalo lingeweza kudokeza kwa lazima uhamisho kati ya lugha mbili zinazotambulika.
theological_decisions:
- issue: Umoja wa kiume wa uwakilishi katika Kigiriki
  choice: anayesema … aweze kufasiri
  alternative: wanaosema … waweze kufasiri
  rationale: Kiswahili hakilazimishi jinsia katika muundo huu. Umoja umehifadhiwa bila kudokeza kwamba agizo linawahusu wanaume pekee.
- issue: Maana ya γλώσσῃ katika 1 Wakorintho 12–14
  choice: lugha
  alternative: ulimi
  rationale: “Lugha” ni Kiswahili cha asili kwa uwezo au namna ya kusema na hakiamui kimakusudi kama usemi huo ni lugha ya kibinadamu inayotambulika au aina nyingine ya usemi wa kiroho. Tanbihi inaonyesha tamathali halisi ya Kigiriki na matumizi ya jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa umoja umehifadhiwa, huku Kiswahili kikiepuka suala la jinsia bila kulipanua kuwa wingi.
