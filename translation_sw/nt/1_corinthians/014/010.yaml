translation:
  language: sw
  text: Huenda kuna aina nyingi sana za lugha ulimwenguni[a], wala hakuna hata moja isiyo na maana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huenda kuna aina nyingi sana za sauti ulimwenguni, wala hakuna hata moja isiyo na sauti.”
    reason: Neno la Kigiriki φωνή linaweza kumaanisha “lugha,” “sauti,” au “sauti ya kiumbe”; pia ἄφωνος kihalisi linaweza kumaanisha “isiyo na sauti.”
lexical_decisions:
- source_word: τοσαῦτα
  choice: nyingi sana
  rationale: Huwasilisha wingi unaodokezwa na kiwakilishi hiki bila kulazimisha idadi maalumu.
- source_word: εἰ τύχοι
  choice: huenda
  rationale: Ni usemi wa Kiswahili wa kawaida unaohifadhi hali ya kukadiria au kutokuwa na uhakika kamili.
- source_word: γένη
  choice: aina
  rationale: Neno hili huonyesha makundi au namna mbalimbali, na “aina” ni la kawaida na wazi.
- source_word: φωνῶν
  choice: za lugha
  rationale: Katika muktadha wa hoja kuhusu usemi unaoeleweka, “lugha” huwasilisha maana inayokusudiwa; uwezekano mpana zaidi wa “sauti” umehifadhiwa katika tanbihi.
- source_word: ἐν κόσμῳ
  choice: ulimwenguni
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali hapa.
- source_word: οὐδὲν ἄφωνον
  choice: wala hakuna hata moja isiyo na maana
  rationale: Katika muktadha wa lugha na mawasiliano, ἄφωνον inadokeza kutokuwa na maana inayoeleweka, ingawa maana yake halisi inaweza kuwa “isiyo na sauti”; utata huo umehifadhiwa katika tanbihi.
