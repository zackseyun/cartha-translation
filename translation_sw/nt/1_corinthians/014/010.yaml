  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo “huenda” huhifadhi hali ya kukadiria, na tanbihi huhifadhi upana wa kileksia wa φωνή pamoja na usemi halisi wa ἄφωνος.
