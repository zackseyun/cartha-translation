  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: sw
  text: Lakini anayetoa unabii hunena kwa watu ili kuwajenga, kuwatia moyo, na kuwafariji.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuwaimarisha.”
    reason: lexical_alternative
  - marker: b
    text: “Kuwatia moyo” pia kunaweza kutafsiriwa “kuwahimiza,” na katika baadhi ya miktadha, “kuwafariji.”
    reason: lexical_alternative
  - marker: c
    text: “Kuwafariji” pia inaweza kuwa “kuwatuliza moyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Lakini anayetoa unabii
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo humaanisha mtu anayefanya tendo hilo. “Anayetoa unabii” ni Kiswahili cha kawaida na huhifadhi upana wa neno hilo; “lakini” huonyesha utofauti wa kiasi na mstari uliotangulia.
- source_word: ἀνθρώποις
  choice: na watu
  rationale: Umoja wa usemi wa Kiswahili “hunena na watu” unaonyesha kuwa watu ndio wanaoelekezewa maneno. Neno hili linawahusu watu kwa jumla, si wanaume pekee.
- source_word: λαλεῖ
  choice: hunena
  rationale: Huwakilisha tendo la kawaida au la sifa linaloonyeshwa na wakati uliopo wa Kigiriki. “Kunena” ni lugha yenye hadhi lakini bado inaeleweka katika muktadha wa kibiblia.
- source_word: οἰκοδομὴν
  choice: ili kuwajenga
  rationale: Neno hilo linatumia picha ya kujenga kwa maana ya kuwaimarisha watu kiroho. Muundo wenye “ili” unaonyesha kusudi au matokeo ya kunena.
- source_word: παράκλησιν
  choice: kuwatia moyo
  rationale: παράκλησις linaweza kumaanisha kutia moyo, kuhimiza, au kufariji. Hapa “kuwatia moyo” ni la kawaida na hulitofautisha na παραμυθία inayofuata.
- source_word: παραμυθίαν
  choice: kuwafariji
  rationale: παραμυθία humaanisha maneno ya faraja au ya kutuliza. “Kuwafariji” ni tafsiri ya asili na hudumisha tofauti ya kiasi na “kuwatia moyo.”
theological_decisions:
- issue: Maana ya kutoa unabii katika kusanyiko
  choice: Kudumisha “anayetoa unabii” bila kulibana neno hilo kuwa kuhubiri au kutabiri wakati ujao.
  alternative: anayehubiri; anayesema ufunuo; anayetabiri
  rationale: Muktadha unatofautisha unabii na lugha na unaeleza matokeo yake kwa wengine, lakini mstari huu hautoi ufafanuzi kamili wa tendo hilo. Tafsiri hii huhifadhi upana na mvutano wa kiteolojia wa προφητεύων.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hunena” hudumisha mtindo wa kibiblia unaoeleweka, huku vitenzi “kuwajenga,” “kuwatia moyo,” na “kuwafariji” vikitoa mtiririko wa asili na kutofautisha maneno matatu ya Kigiriki.
