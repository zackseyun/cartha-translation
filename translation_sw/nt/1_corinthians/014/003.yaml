- from: Lakini anayetoa unabii hunena na watu ili kuwajenga, kuwatia moyo, na kuwafariji.[a][b][c]
  to: Lakini anayetoa unabii hunena kwa watu ili kuwajenga, kuwatia moyo, na kuwafariji.[a][b][c]
  rationale: 'Only the relational preposition is changed: “kwa watu” makes clear that people receive the prophetic speech, faithfully reflecting the Greek dative. The rest of the wording and all three footnote anchors are retained because they are accurate, natural, and structurally valid.'
