    reason: lexical_alternative
  - marker: c
    text: “Kuwafariji” pia inaweza kuwa “kuwatuliza moyo.”
    reason: lexical_alternative
  revision_rationale: 'Only the relational preposition is changed: “kwa watu” makes clear that people receive the prophetic speech, faithfully reflecting the Greek dative. The rest of the wording and all three footnote anchors are retained because they are accurate, natural, and structurally valid.'
