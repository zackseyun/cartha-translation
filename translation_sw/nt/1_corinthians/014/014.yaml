id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: sw
  text: Kwa maana nikiomba kwa lugha[a], roho yangu huomba, lakini akili yangu haizai matunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ulimi.” Neno la Kigiriki linaweza kumaanisha lugha ya kibinadamu au “ulimi” kwa maana ya usemi unaowezeshwa na Roho kama unavyotajwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Kwa maana niki-
  rationale: “Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na muundo wa masharti “niki-” huwakilisha ἐάν kwa Kiswahili cha kawaida.
- source_word: προσεύχωμαι
  choice: nikiomba
  rationale: Muundo wa sasa wa masharti unawasilisha tendo la kuomba kwa ufasaha bila kuongeza hali endelevu isiyolazimishwa na Kigiriki.
- source_word: γλώσσῃ
  choice: kwa lugha
  rationale: “Lugha” ni kisawe cha kawaida cha γλῶσσα na kinaweza kumaanisha lugha ya kibinadamu au usemi unaoitwa lugha katika sura hii, hivyo hakiamui mapema aina ya usemi.
- source_word: τὸ πνεῦμά μου
  choice: roho yangu
  rationale: Huhifadhi kiwakilishi milikishi na tofauti iliyopo kati ya roho na akili, bila kumtaja moja kwa moja Roho Mtakatifu.
- source_word: προσεύχεται
  choice: huomba
  rationale: “Huomba” huonyesha tendo linalotokea katika hali iliyotajwa na sentensi ya masharti kwa Kiswahili cha asili.
- source_word: ὁ δὲ νοῦς μου
  choice: lakini akili yangu
  rationale: “Akili” ni kisawe cha moja kwa moja na cha kawaida cha νοῦς, na huhifadhi tofauti na “roho yangu”; “ufahamu” pia unawezekana lakini ni mwembamba zaidi.
- source_word: ἄκαρπός ἐστιν
  choice: haizai matunda
  rationale: Huhifadhi sitiari ya matunda katika ἄκαρπος kwa Kiswahili cha kawaida na kueleweka, badala ya kuibadili kuwa tu “haina manufaa.”
theological_decisions:
- issue: Kirejelewa cha “roho yangu” (τὸ πνεῦμά μου)
  choice: roho ya mtu anayeomba
  alternative: Roho Mtakatifu aliye ndani ya mtu anayeomba
  rationale: Kiwakilishi “yangu” na ulinganisho na “akili yangu” vinaelekea kwenye hali mbili ndani ya msemaji. Hata hivyo, tafsiri “roho yangu” huhifadhi maneno na mvutano wa kifungu bila kufunga kabisa mjadala wa kitheolojia.
- issue: Maana ya γλώσσῃ katika muktadha
  choice: lugha, huku aina yake ikiachwa wazi
  alternative: lugha ya kibinadamu pekee au usemi wa kiroho pekee
  rationale: Neno la Kigiriki linaweza kutumiwa kwa lugha ya kibinadamu na pia kwa usemi unaoitwa “lugha” katika sura hii. Tafsiri haipaswi kutatua utata huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Haizai matunda” huhifadhi sitiari ya Paulo kwa lugha ya kawaida; alama [a] imewekwa moja kwa moja baada ya neno linalohusika.
