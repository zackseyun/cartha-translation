  to: Lakini katika kusanyiko, ningependa zaidi kusema maneno matano kwa ufahamu wangu, ili niwafundishe wengine pia, kuliko kusema maneno elfu kumi kwa lugha[a].
  rationale: Marekebisho yanaondoa nyongeza isiyo ya lazima katika “kusanyiko la waamini” na kuboresha uwasilishaji wa τῷ νοΐ μου kuwa “kwa ufahamu wangu.” Tanbihi ya γλῶσσα imehifadhiwa bila kuamua kama usemi huo ni lugha ya kawaida au jambo lingine linalojadiliwa katika sura hizi.
