  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: sw
  text: Lakini katika kusanyiko, ningependa zaidi kusema maneno matano kwa ufahamu wangu, ili niwafundishe wengine pia, kuliko kusema maneno elfu kumi kwa lugha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ulimi.” Neno la Kigiriki linaweza kumaanisha “ulimi” au “lugha”; hapa linarejelea aina ya usemi inayozungumziwa katika 1 Wakorintho 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: katika kusanyiko la waamini
  rationale: Hapa neno hili linamaanisha jumuiya ya Wakristo iliyokusanyika kwa ibada, si hasa jengo. Usemi huu unaeleza maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: θέλω
  choice: ningependa zaidi
  rationale: Ingawa kimsingi humaanisha ‘nataka’ au ‘natamani,’ muundo wenye ἢ unaonyesha ulinganisho wa mambo mawili; ‘ningependa zaidi’ huwasilisha upendeleo huo kwa kawaida.
- source_word: πέντε λόγους
  choice: maneno matano
  rationale: Tafsiri halisi ya idadi na nomino inadumisha tofauti ya kimakusudi kati ya maneno matano na maneno elfu kumi.
- source_word: τῷ νοΐ μου
  choice: kwa akili yangu
  rationale: Huhifadhi rejeo la moja kwa moja kwa akili na kuonyesha usemi wenye kueleweka bila kulipanua kuwa fasiri ya ziada.
- source_word: λαλῆσαι
  choice: kusema
  rationale: Katika sentensi hii ‘kusema maneno’ ni Kiswahili cha asili na huwasilisha tendo la kunena hadharani.
- source_word: κατηχήσω
  choice: niwafundishe
  rationale: Kitenzi kinamaanisha kutoa mafundisho, hasa kwa njia ya mdomo. ‘Niwafundishe’ ni cha kawaida na hakileti maana ya kiufundi ya baadaye ya kikanisa.
- source_word: ἄλλους
  choice: wengine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi huu.
- source_word: μυρίους λόγους
  choice: maneno elfu kumi
  rationale: Huhifadhi idadi halisi na nguvu ya balagha ya tofauti kubwa dhidi ya maneno matano.
- source_word: ἐν γλώσσῃ
  choice: kwa lugha
  rationale: ‘Lugha’ ni usemi wa kawaida wa Kiswahili kwa namna ya usemi inayotajwa hapa. Tanbihi huhifadhi uwezekano wa maana ya msingi ya ‘ulimi’ bila kuamua kimadhehebu asili ya jambo hili.
theological_decisions:
- issue: Maana ya γλῶσσα katika 1 Wakorintho 12–14
  choice: kwa lugha
  alternative: kwa ulimi
  rationale: Tafsiri ‘kwa lugha’ inaeleweka kwa Kiswahili na haifafanui usemi huo kuwa lugha ya kawaida ya kigeni wala usemi wa msisimko. Tanbihi inaonyesha upana wa neno la Kigiriki na hivyo kuhifadhi mjadala uliomo katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kusanyiko la waamini’ limetumiwa badala ya ‘kanisani’ ili kuepuka wazo la jengo na kuonyesha jumuiya iliyokusanyika. Muundo wa ulinganisho na tofauti ya idadi umehifadhiwa.
