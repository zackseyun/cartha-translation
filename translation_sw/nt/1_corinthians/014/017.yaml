  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: sw
  text: Kwa maana wewe kweli unashukuru vizuri, lakini mtu mwingine hajengwi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, haimarishwi au hanufaishwi kiroho.
    reason: Ufafanuzi wa sitiari ya ‘kujengwa’ katika muktadha wa kusanyiko.
lexical_decisions:
- source_word: σὺ
  choice: wewe
  rationale: Kiwakilishi cha nafsi ya pili umoja kimewekwa wazi ili kudumisha msisitizo wa mtu anayesema.
- source_word: μὲν γὰρ
  choice: Kwa maana ... kweli
  rationale: “Kwa maana” linaonyesha ufafanuzi wa hoja iliyotangulia, na “kweli” linadumisha ukubali unaotangulia tofauti iliyoletwa na ἀλλά.
- source_word: καλῶς
  choice: vizuri
  rationale: Ni kielezi cha kawaida na cha sasa kinachoonyesha kwamba kushukuru kwenyewe kunafanywa vema.
- source_word: εὐχαριστεῖς
  choice: unashukuru
  rationale: Kitenzi cha wakati wa sasa na hali ya taarifa kimetafsiriwa moja kwa moja bila kukifanya kiwe uwezekano tu; mtendewa, yaani Mungu, hajatamkwa kwa kuwa hayumo wazi katika sentensi ya Kigiriki.
- source_word: ἀλλ’
  choice: lakini
  rationale: Kiunganishi hiki kinatoa tofauti kuu kati ya kushukuru kwa msemaji na kutokujengwa kwa mwingine.
- source_word: ὁ ἕτερος
  choice: mtu mwingine
  rationale: Hutaja mshiriki au msikilizaji mwingine; “mtu mwingine” ni wazi na ya kawaida bila kufafanua zaidi ya maandishi.
- source_word: οὐκ οἰκοδομεῖται
  choice: hajengwi
  rationale: Hifadhi sitiari ya Paulo ya kujengwa, huku muktadha ukionyesha kunufaika au kuimarishwa kiroho.
theological_decisions:
- issue: Sitiari ya Paulo ya οἰκοδομέω katika kusanyiko
  choice: hajengwi
  alternative: haimarishwi kiroho
  rationale: “Hajengwi” huhifadhi picha halisi ya kujenga na mvutano wa hoja ya Paulo; tanbihi inaeleza maana yake bila kubadilisha sitiari katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo ni mfupi kama Kigiriki; “wewe” na “kweli” hudumisha msisitizo na ukubali unaotangulia neno “lakini.”
