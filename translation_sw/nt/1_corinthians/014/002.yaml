- from: Kwa maana anayesema kwa lugha hasemi na watu, bali na Mungu, kwa sababu hakuna anayeelewa[a]; ila anasema mafumbo katika Roho[b].
  to: Kwa maana anayesema kwa lugha hasemi na watu bali na Mungu, kwa sababu hakuna anayeelewa[a]; bali kwa roho anasema siri[b].
  rationale: The revision retains the draft’s sound contextual rendering of ἀκούει and its singular “kwa lugha,” while replacing “mafumbo” with the more faithful Pauline term “siri.” It changes the ambiguous πνεύματι to lowercase “kwa roho” and preserves the Holy-Spirit reading in the anchored footnote, avoiding a doctrinally determinative capitalization in the main text. “Bali” is used for the final contrast.
