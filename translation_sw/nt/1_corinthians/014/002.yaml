  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: sw
  text: Kwa maana anayesema kwa lugha hasemi na watu bali na Mungu, kwa sababu hakuna anayeelewa[a]; bali kwa roho anasema siri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna anayesikia.” Kitenzi cha Kigiriki kinaweza kumaanisha “kusikia” au, kama inavyodokezwa na muktadha, “kuelewa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Roho.” Kirai cha Kigiriki kinaweza kumaanisha Roho Mtakatifu au roho ya msemaji.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: anayesema
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja mtu yeyote anayefanya tendo hilo; “anayesema” ni cha kawaida na hakibainishi jinsia.
- source_word: γλώσσῃ
  choice: kwa lugha
  rationale: Huhifadhi umoja wa nomino na haifafanui kupita kiasi ikiwa ni lugha nyingine ya kibinadamu au usemi wa aina nyingine.
- source_word: ἀνθρώποις
  choice: na watu
  rationale: Ni rejeo la jumla kwa wanadamu, lisilohusu wanaume pekee; baada ya “kusema,” Kiswahili cha kawaida hutumia “kusema na.”
- source_word: θεῷ
  choice: na Mungu
  rationale: Hutoa kiima lengwa cha usemi kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἀκούει
  choice: anaelewa
  rationale: Kitenzi kimsingi kinaweza kumaanisha kusikia, lakini hapa muktadha unahusu usemi usiofahamika; “anaelewa” huwasilisha maana ya kimuktadha, huku “anasikia” ikihifadhiwa katika tanbihi.
- source_word: πνεύματι
  choice: katika Roho
  rationale: Huhifadhi muundo wa ndani ya/katika unaowezekana kwa hali ya dative bila kuufanya wazi kuwa wakala; tanbihi inahifadhi uwezekano wa kumaanisha roho ya msemaji.
- source_word: μυστήρια
  choice: mafumbo
  rationale: Neno hili huhifadhi wazo la mambo yaliyofichika au yasiyofahamika bila kuyafafanua kuwa siri za aina fulani.
- source_word: δὲ
  choice: ila
  rationale: Huonyesha utofautishaji na maelezo yanayofuata kwa Kiswahili cha asili.
theological_decisions:
- issue: Rejeo la πνεύματι
  choice: katika Roho
  alternative: katika roho, yaani roho ya msemaji
  rationale: Kigiriki kinaweza kurejelea Roho Mtakatifu au roho ya msemaji. Matini kuu inatoa usomaji unaowezekana, na tanbihi huhifadhi utata wa kweli bila kuamua fundisho kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kwa lugha” hudumisha umoja na kuepuka ufafanuzi wa ziada; tanbihi zote zimewekewa alama katika matini kuu.
