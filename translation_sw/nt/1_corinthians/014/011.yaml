base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: sw
  text: Kwa hiyo, nisipojua maana[a] ya sauti, nitakuwa mtu wa lugha ngeni[b] kwa anayesema, naye anayesema atakuwa mtu wa lugha ngeni kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu ya sauti”; yaani, umuhimu au maana inayowasilishwa na sauti.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki “barbaros”; hapa humaanisha mtu ambaye usemi wake ni wa lugha ngeni au haueleweki, si lazima mtu asiyestaarabika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, nisipo-
  rationale: “Kwa hiyo” huhifadhi hitimisho linaloletwa na οὖν, na muundo wa “nisipo-” unaonyesha sharti la ἐὰν μή kwa Kiswahili cha kawaida.
- source_word: μὴ εἰδῶ
  choice: nisipojua
  rationale: Huhifadhi maana ya msingi ya οἶδα, “kujua,” bila kuibadili moja kwa moja kuwa “kuelewa,” ingawa kuelewa kunadokezwa na muktadha.
- source_word: τὴν δύναμιν
  choice: maana
  rationale: Ingawa δύναμις kwa kawaida ni “nguvu” au “uwezo,” hapa inaelekea kumaanisha umuhimu au maana inayowasilishwa na sauti. “Maana” ni wazi na ya kawaida katika Kiswahili, huku tafsiri halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: τῆς φωνῆς
  choice: ya sauti
  rationale: φωνή inaweza kuwa “sauti” au “sauti ya mtu.” “Sauti” inafaa muktadha mpana wa matamshi yanayopaswa kueleweka na haiongezi wazo mahususi la “lugha” lisilotajwa moja kwa moja.
- source_word: ἔσομαι
  choice: nitakuwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wakati ujao wa εἰμί.
- source_word: τῷ λαλοῦντι
  choice: kwa anayesema
  rationale: Huwasilisha kitenzi-jina cha Kigiriki kwa Kiswahili cha asili bila ugumu usio wa lazima.
- source_word: βάρβαρος
  choice: mgeni
  rationale: Katika muktadha huu neno hilo humaanisha mtu wa lugha ngeni au asiyeeleweka katika mawasiliano, si lazima mtu asiyestaarabika. “Mgeni” huhifadhi hali ya kutengana kwa sababu ya usemi.
- source_word: ἐν ἐμοὶ
  choice: kwangu
  rationale: Hapa ἐν ἐμοί inaonyesha uhusiano kwa mtazamo wa msemaji. “Kwangu” ni usemi wa kawaida wa Kiswahili na unadumisha ulinganifu wa pande mbili.
