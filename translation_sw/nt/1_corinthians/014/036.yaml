id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: sw
  text: Au je, neno la Mungu lilitoka kwenu[a], au limewafikia ninyi peke yenu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilianzia kwenu?”
    reason: lexical_alternative
  - marker: b
    text: Au, “limekuja kwenu tu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au je
  rationale: Neno “Au” linahifadhi kiunganishi cha kutenga katika Kiyunani, huku “je” likifanya swali la kukemea lisikike kwa kawaida katika Kiswahili.
- source_word: ἀφ’ ὑμῶν
  choice: kwenu
  rationale: Huwasilisha chanzo au asili inayodokezwa na ἀπό pamoja na hali ya umilikishi; katika muktadha huu “lilitoka kwenu” ni usemi wa asili na wa moja kwa moja.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni tafsiri ya kawaida yenye uzito wa usemi wa Paulo, bila kuufinya maana uwe injili pekee au unabii wa kusanyiko pekee.
- source_word: ἐξῆλθεν
  choice: lilitoka
  rationale: Linahifadhi picha halisi ya kitu kutoka au kuenea kutoka mahali fulani, badala ya kutafsiri kwa ufafanuzi zaidi kuwa “lilianzia.”
- source_word: εἰς ὑμᾶς μόνους
  choice: ninyi peke yenu
  rationale: Linadumisha msisitizo wa μόνους kwamba Wakorintho hawakuwa wapokeaji wa pekee; “ninyi” linaongeza msisitizo unaofaa katika swali la kukemea.
- source_word: κατήντησεν
  choice: limewafikia
  rationale: Kitenzi καταντάω humaanisha kufika au kufikia; wakati timilifu wa Kiswahili unafaa kwa swali kuhusu ujumbe ambao tayari umewafikia.
theological_decisions:
- issue: Kinachorejelewa na “neno la Mungu”
  choice: Neno la Mungu
  alternative: ujumbe wa injili hasa; au ujumbe wa kinabii katika kusanyiko
  rationale: Usemi umeachwa na upana wake wa asili. Katika muktadha unaweza kuhusisha injili na mafundisho yenye mamlaka kutoka kwa Mungu, bila kulazimisha maana moja finyu.
- issue: Ukali wa swali la Paulo
  choice: Au je ...?
  alternative: Kwani! ...?
  rationale: Muundo wa swali na marudio ya “au” yanahifadhi ukemeo wa balagha bila kuongeza mshangao ambao haujaonyeshwa wazi na chembe ἢ yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa maswali mawili ya balagha umehifadhiwa, na lugha ni wazi kwa msomaji wa kawaida bila kupunguza ukali wa ukemeo.
