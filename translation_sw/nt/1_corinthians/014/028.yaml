  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: sw
  text: Lakini ikiwa hakuna mfasiri, basi na anyamaze katika kusanyiko; aseme kwa nafsi yake na kwa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερμηνευτής
  choice: mfasiri
  rationale: Katika muktadha huu ni mtu anayefanya lugha hiyo ieleweke kwa wengine; “mfasiri” ni neno la kawaida na linalofaa zaidi kuliko “mtafsiri.”
- source_word: σιγάτω
  choice: na anyamaze
  rationale: Huwakilisha amri ya nafsi ya tatu kwa Kiswahili cha sasa chenye hadhi, bila kuifanya kuwa katazo lisilo na mipaka.
- source_word: ἐν ἐκκλησίᾳ
  choice: katika kusanyiko
  rationale: Muktadha ni mkutano wa waamini waliokusanyika; “kusanyiko” huepuka kuifanya kauli ionekane kulenga jengo au taasisi.
- source_word: ἑαυτῷ
  choice: nafsini mwake
  rationale: Huhifadhi maana ya usemi unaobaki kwake mwenyewe bila kuongeza wazo la “kwa faragha,” ambalo halijasemwa wazi.
- source_word: λαλείτω
  choice: aseme
  rationale: Ni kauli ya amri inayoendeleza maagizo kuhusu kusema, kwa lugha ya kawaida na yenye hadhi.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Dativu inaonyesha anayeelekezewa usemi; “kwa Mungu” ni muundo wa kawaida wa Kiswahili katika kishazi “kusema kwa Mungu.”
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Lakini ikiwa hakuna
  rationale: Hutoa kwa kawaida sharti linalohusu kutokuwapo kwa mfasiri.
theological_decisions:
- issue: Upeo wa amri ya kunyamaza katika ibada ya kusanyiko
  choice: Amri inazuia usemi wa hadharani kwa kusanyiko wakati hakuna mfasiri, huku ikiacha usemi uwe kwake mwenyewe na kwa Mungu.
  alternative: Msemaji aache kabisa kila namna ya kusema.
  rationale: Tofauti kati ya kunyamaza “katika kusanyiko” na kusema “nafsini mwake na kwa Mungu” inaonyesha kizuizi cha usemi wa hadharani, si lazima ukimya kamili wa kila aina; tafsiri haibainishi iwapo usemi wa pili unasikika au hausikiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kusanyiko” limetumiwa kwa ἐκκλησία katika muktadha wa mkutano wa waamini. Hakuna tanbihi, kwa kuwa tanbihi ya Kiingereza ilihusishwa kimakosa na “interpreter” ilhali maelezo yake yalihusu “church”; uchaguzi wa “kusanyiko” tayari unaweka maana ya muktadha wazi.
