  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: sw
  text: Hata vitu visivyo na uhai vinavyotoa sauti—iwe ni filimbi au kinubi[a]—visipotoa utofauti katika toni, mtu atajuaje kinachopulizwa kwa filimbi au kinachopigwa kwa kinubi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “filimbi au lira.” Neno la Kigiriki κιθάρα humaanisha chombo cha kale chenye nyuzi, kilichofanana zaidi na lira, ingawa hapa limetafsiriwa “kinubi” ili lieleweke kwa urahisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Hata
  rationale: Hutanguliza mfano wenye msisitizo na kuendeleza hoja kutoka kwa wasemaji walio hai hadi vyombo visivyo na uhai.
- source_word: τὰ ἄψυχα
  choice: vitu visivyo na uhai
  rationale: Ni usemi wa kawaida na wenye heshima unaodumisha tofauti kati ya viumbe hai na vyombo vya muziki.
- source_word: φωνὴν διδόντα
  choice: vinavyotoa sauti
  rationale: Hufuata maana ya msingi ya ‘kutoa sauti’ kwa Kiswahili cha sasa na cha kawaida.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: iwe ni filimbi au kinubi
  rationale: ‘Filimbi’ hutambulika kwa urahisi kama chombo cha kupuliza, na ‘kinubi’ ni jina la kawaida la kibiblia kwa chombo cha kale chenye nyuzi; tanbihi inaeleza usahihi wa kihistoria.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: visipotofautisha sauti zake
  rationale: Huwasilisha dhana ya kutenganisha au kutofautisha toni bila kutumia usemi mzito usio wa kawaida; ‘sauti zake’ huhifadhi wingi wa φθόγγοις.
- source_word: πῶς γνωσθήσεται
  choice: mtu atajuaje
  rationale: Kauli tendwa ya Kigiriki imetolewa kwa usemi wa jumla wa Kiswahili unaosikika kawaida, huku ikihifadhi wazo la kutambua kinachochezwa.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: kinachopigwa kwa filimbi au kwa kinubi
  rationale: Huwakilisha vipashio vya Kigiriki vinavyorejelea muziki unaochezwa kwa kila chombo. Kitenzi ‘kupiga’ hutumiwa kwa maana pana ya kucheza chombo cha muziki katika Kiswahili.
