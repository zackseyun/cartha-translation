review_pass:
  verdict: revise
  source_fidelity: 'The comparison of lifeless instruments and the rhetorical question are retained. However, the draft''s "kinachopigwa kwa filimbi" is not idiomatic or instrumentally precise: a filimbi is normally "kupulizwa," while a kinubi is "kupigwa." The rendering of διαστολή should explicitly express differentiation among tones rather than suggest that instruments distinguish their own sounds.'
  naturalness: The revised wording uses ordinary Standard East African Swahili musical verbs and keeps the compact rhetorical structure of the Greek.
  terminology: '"Filimbi" and the traditional biblical term "kinubi" are suitable. The footnote is revised because "zeze" is not a precise general equivalent for κιθάρα; "lira" better identifies the ancient lyre-like stringed instrument without claiming an exact modern equivalence.'
  issues:
  - severity: medium
    issue: '"kinachopigwa kwa filimbi"'
    rationale: Filimbi is ordinarily played by blowing, not by striking. The Greek distinguishes playing the flute (αὐλέω) from playing the κιθάρα (κιθαρίζω); Swahili should preserve that distinction.
  - severity: medium
    issue: '"visipotofautisha sauti zake"'
    rationale: This can mean that the instruments themselves do not distinguish their sounds. The Greek says that no distinction is given among the tones; "zisipotoa utofauti katika toni" expresses this more directly.
  - severity: low
    issue: Footnote alternative "zeze"
    rationale: A zeze is a particular East African stringed instrument and is not a sufficiently precise lexical alternative for κιθάρα. "Lira" more transparently conveys the historically lyre-like instrument.
  revised_text: Hata vitu visivyo na uhai vinavyotoa sauti—iwe ni filimbi au kinubi[a]—visipotoa utofauti katika toni, mtu atajuaje kinachopulizwa kwa filimbi au kinachopigwa kwa kinubi?
  revised_footnotes:
