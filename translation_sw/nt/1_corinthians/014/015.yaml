base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: sw
  text: Basi, tufanye nini? Nitaomba kwa roho[a], lakini pia nitaomba kwa akili[b]; nitaimba sifa kwa roho[a][c], lakini pia nitaimba sifa kwa akili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘katika roho’ au ‘kwa njia ya roho.’ Kigiriki hakibainishi wazi ikiwa ‘roho’ hapa ni Roho Mtakatifu, roho ya msemaji, au usemi wa kiroho.
    reason: lexical_alternative
  - marker: b
    text: Au ‘kwa ufahamu.’
    reason: lexical_alternative
  - marker: c
    text: Au ‘nitaimba’ au ‘nitafanya muziki.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Basi, tufanye nini?
  rationale: Kirai hiki kinauliza hitimisho la vitendo. Tafsiri hii ni ya asili katika Kiswahili na inaeleza kazi ya swali bila kung'ang'ania muundo usio wa kawaida wa ‘Basi, ni nini?’
- source_word: προσεύξομαι
  choice: Nitaomba
  rationale: Kitenzi cha wakati ujao kinatafsiriwa moja kwa moja na kwa kawaida kuwa ‘Nitaomba.’
- source_word: τῷ πνεύματι
  choice: kwa roho
  rationale: ‘Kwa roho’ huhifadhi uwezekano wa maana ya namna au chombo na ulinganifu wake na ‘kwa akili,’ bila kuamua ikiwa roho hapa ni Roho Mtakatifu, roho ya mtu, au usemi wa kiroho.
- source_word: τῷ νοΐ
  choice: kwa akili
  rationale: νοῦς humaanisha uwezo wa kufikiri au kuelewa. ‘Kwa akili’ ni fupi, ya asili, na inadumisha ulinganifu na ‘kwa roho.’
- source_word: ψαλῶ
  choice: nitaimba sifa
  rationale: Katika muktadha wa ibada, ψάλλω inahusu kuimba sifa. ‘Nitaimba sifa’ huwasilisha wazi maana hiyo, huku tanbihi ikihifadhi uwezekano wa tafsiri pana zaidi.
- source_word: δὲ καὶ
  choice: lakini pia
  rationale: 'Maneno haya yanaonyesha nyongeza yenye ulinganisho mdogo: si njia moja tu, bali nyingine pia.'
theological_decisions:
- issue: Maana ya πνεῦμα katika ulinganisho wa roho na akili
  choice: Kutumia ‘roho’ bila kubainisha katika matini kuu
  alternative: ‘Roho’ kwa maana ya Roho Mtakatifu; ‘roho yangu’; au usemi wa kiroho
  rationale: Kigiriki hakibainishi wazi ikiwa Paulo anamaanisha Roho Mtakatifu, roho ya msemaji, au shughuli ya kiroho. Tafsiri inadumisha utata huo wa kweli badala ya kuamua suala la kitheolojia.
- issue: Nafsi ya swali τί οὖν ἐστιν;
  choice: ‘Basi, tufanye nini?’
  alternative: ‘Basi, ni nini?’ au ‘Basi, iweje?’
  rationale: Muktadha unaelekea kwenye hitimisho la vitendo. Nafsi ya kwanza wingi ni njia ya kawaida ya Kiswahili ya kuuliza jambo linalopaswa kufanywa, bila kubadili kauli zinazofuata za Paulo katika nafsi ya kwanza umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marudio umehifadhiwa ili kudumisha ulinganifu wa Paulo kati ya roho na akili. Alama zote za tanbihi zimewekwa katika matini kuu; tanbihi zinazohusu maneno yanayorudiwa zimerudiwa mahali husika.
