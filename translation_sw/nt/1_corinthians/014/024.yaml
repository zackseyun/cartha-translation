  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: sw
  text: Lakini ikiwa wote wakitoa unabii, kisha mtu asiyeamini au asiye na ufahamu[a] akiingia, anatiwa hatiani na wote, anachunguzwa na wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa nje.” Neno la Kigiriki linaweza kumaanisha mtu asiye na ufahamu, asiyeanzishwa katika desturi husika, au asiye sehemu ya kundi linalonena.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Kibainishi jumuishi kimedumishwa, kikirejelea washiriki wa kusanyiko katika muktadha.
- source_word: προφητεύωσιν
  choice: wanatoa unabii
  rationale: Huhifadhi aina ya usemi ambayo Paulo anaiita unabii katika sura hii, bila kuifafanua kupita kiasi.
- source_word: ἄπιστος
  choice: mtu asiyeamini
  rationale: Katika muktadha huu ni mtu ambaye haamini, si mtu asiye mwaminifu tu.
- source_word: ἰδιώτης
  choice: asiye na ujuzi
  rationale: Hueleza mtu asiye na uelewa au uzoefu unaohusika katika matendo ya kusanyiko, bila kuingiza dhana ya kisasa ya cheo cha kanisa.
- source_word: ἐλέγχεται
  choice: anasadikishwa ... kuwa amekosea
  rationale: Huwasilisha kufunuliwa na kuthibitishwa kwa hali ya mtu kwa nguvu ya yale yanayosemwa, kwa Kiswahili cha kawaida.
- source_word: ἀνακρίνεται
  choice: anachunguzwa
  rationale: Huhifadhi maana ya kuchunguzwa au kutathminiwa kwa makini bila kuifanya kuwa hukumu ya mwisho.
- source_word: ὑπὸ πάντων
  choice: na wote
  rationale: Muundo huu unadumisha urudiaji wa msisitizo uliomo katika Kigiriki.
- source_word: δέ
  choice: Lakini / halafu
  rationale: δέ ya kwanza inaonyesha tofauti na hali iliyotangulia; ya pili inaendeleza hali ya sharti kwa mtiririko wa kawaida wa Kiswahili.
- source_word: τις
  choice: mtu
  rationale: Hutoa urejeo usio maalumu kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ἰδιώτης katika kusanyiko
  choice: asiye na ujuzi
  alternative: mtu wa nje; asiyeelewa
  rationale: Muktadha unahusu kueleweka kwa usemi na athari yake kwa mtu asiye na uelewa wa mambo yanayotendeka. Tafsiri hii haamui kwamba mtu huyo lazima awe nje kabisa ya jumuiya; uwezekano wa maana ya “mtu wa nje” umehifadhiwa katika tanbihi.
- issue: Nguvu ya ἐλέγχεται
  choice: anasadikishwa ... kuwa amekosea
  alternative: anakemewa; anafunuliwa; anathibitishiwa
  rationale: Kauli hiyo inahusisha kuguswa dhamiri na kufunuliwa kwa kosa, lakini haipaswi kutafsiriwa kama hukumu rasmi ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa “na wote” umehifadhiwa kwa ajili ya msisitizo wa matini chanzi.
