  terminology: “Unabii,” “asiyeamini,” na “anatiwa hatiani” hudumisha istilahi ya kifungu bila kufafanua mafundisho zaidi ya matini. Tanbihi imerekebishwa ili “asiyehusishwa” isidai maana isiyo wazi; inaeleza kwa uaminifu uwezekano wa mtu asiyejua, asiyeanzishwa katika desturi, au asiye sehemu ya kundi linalonena.
