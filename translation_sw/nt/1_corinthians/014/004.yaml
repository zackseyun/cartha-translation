base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: sw
  text: Anayesema kwa lugha[a] hujijenga, lakini anayetoa unabii hulijenga kanisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa lugha fulani.” Katika sura hii neno hilo huenda linarejelea karama ya kusema kwa lugha; asili hasa ya usemi huo inabishaniwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kusanyiko” au “jumuiya ya waamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Anayesema
  rationale: Kirai chenye kibainishi na kitenzi-jina cha wakati uliopo humaanisha mtu yeyote anayetambulishwa kwa tendo hilo; umoja na ulinganifu wake na ὁ προφητεύων vimehifadhiwa.
- source_word: γλώσσῃ
  choice: kwa lugha
  rationale: Nomino ya umoja katika hali ya dative inaeleza namna ya kusema. Kiswahili ‘kwa lugha’ ni cha asili na huhifadhi uwezekano wa maana ya lugha au usemi wa lugha bila kuamua kabisa hali yake.
- source_word: ἑαυτὸν
  choice: mwenyewe
  rationale: Kiwakilishi cha kujirejelea kimetafsiriwa kwa umoja na kinamrejelea mtu anayesema; ‘hujijenga mwenyewe’ huweka wazi msisitizo wa kujinufaisha.
- source_word: οἰκοδομεῖ
  choice: hujijenga / hulijenga
  rationale: Kitenzi kimetumika kwa sitiari ya kuimarisha au kukuza kiroho. ‘Kujenga’ huhifadhi taswira ya Kigiriki na ni lugha ya kawaida ya Kiswahili.
- source_word: ὁ δὲ προφητεύων
  choice: lakini anayetoa unabii
  rationale: ‘Lakini’ huonyesha utofautishaji wa kiasi unaoletwa na δέ, na ‘anayetoa unabii’ ni usemi wa kawaida unaowasilisha tendo la προφητεύω.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha huu neno linamaanisha jumuiya ya waamini waliokusanyika; ‘kanisa’ ndilo neno la kawaida la Kiswahili, huku maana mbadala ikielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya γλώσσῃ katika 1 Wakorintho 12–14
  choice: kwa lugha
  alternative: kwa lugha ya kigeni; kwa usemi wa lugha usioeleweka
  rationale: Tafsiri haibainishi kwa lazima ikiwa ni lugha ya kawaida ya kibinadamu, lugha ya kigeni, au aina nyingine ya usemi unaotokana na karama; hivyo inadumisha utata uliopo katika neno la asili na mjadala wa sura hii.
- issue: Manufaa ya οἰκοδομεῖ
  choice: kujenga kwa maana ya kuimarisha kiroho
  alternative: kujenga kihalisi; kujifurahisha
  rationale: Muktadha unalinganisha kuimarishwa kwa msemaji mmoja na kuimarishwa kwa jumuiya. Tafsiri haisemi kwamba kujijenga ni jambo jema au baya kwa asili, kwa kuwa mstari wenyewe hauamui hilo.
- issue: Umoja wa kiume unaotumika kwa uwakilishi
  choice: Anayesema ... mwenyewe
  alternative: Mtu anayesema ... yeye mwenyewe
  rationale: Kiswahili hakihitaji kuingiza jinsia hapa. Muundo wa umoja umehifadhiwa, huku kauli ikibaki kanuni inayomhusu mtu yeyote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa vifungu viwili umehifadhiwa. ‘Hujijenga’ na ‘hulijenga’ hutumia hali ya mazoea ili kuwasilisha vitenzi vya wakati uliopo vinavyotoa kanuni ya jumla.
