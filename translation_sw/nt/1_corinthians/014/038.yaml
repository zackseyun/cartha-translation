translation:
  language: sw
  text: Lakini mtu yeyote asipolitambua hili[b][a], yeye hatambuliwi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “ikiwa mtu yeyote hajui, na aendelee kutojua.” Maandishi yaliyotumiwa hapa yana, “mtu yeyote asipolitambua hili, yeye hatambuliwi.”
    reason: textual_variant
  - marker: b
    text: Au “asipolikiri hili ... yeye hatambuliwi.” Kigiriki kinatumia kitenzi kilekile katika kauli tendi na kauli tendwa ili kuleta mkazo wa balagha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: -ki- katika “asipolikubali”
  rationale: Muundo wa masharti wa Kiswahili unawasilisha sharti la Kigiriki kwa njia ya kawaida na wazi.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha utofauti na dai la mstari uliotangulia kuhusu kuyatambua maagizo ya Paulo.
- source_word: τις
  choice: mtu yeyote
  rationale: Inahifadhi maana ya jumla ya kiwakilishi kisichotaja mtu maalumu.
- source_word: ἀγνοεῖ
  choice: asipolikubali
  rationale: Katika muktadha wa mstari wa 37, kitenzi kinaashiria kutotambua au kutokiri mamlaka ya jambo hili, si ukosefu wa taarifa tu. “Kukubali” ni lugha ya kawaida inayoweza kubeba maana ya kulitambua na kulikiri.
- source_word: ἀγνοεῖται
  choice: hakubaliwi
  rationale: Kauli tendwa inadumishwa, na kurudiwa kwa mzizi uleule wa Kiswahili kunahifadhi athari ya balagha ya kitenzi cha Kigiriki katika kauli tendi na tendwa bila kumtaja mtendaji.
theological_decisions:
- issue: Maana ya kauli tendwa ἀγνοεῖται
  choice: “yeye hakubaliwi,” yaani anayekataa kulitambua au kulikiri agizo naye hatambuliwi au hakubaliwi
  alternative: “na aendelee kuwa mjinga” au “hajulikani”
  rationale: SBLGNT ina kauli tendwa elekezi, si amri. Tafsiri hii inadumisha ulinganifu wa balagha na matokeo ya kukataa agizo bila kubainisha kwamba mtendaji ni Mungu au jumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Asipolikubali ... hakubaliwi” ni rahisi kueleweka na huhifadhi ulinganifu wa kitenzi; tanbihi inaweka wazi maana mbadala ya “kutambua.”
