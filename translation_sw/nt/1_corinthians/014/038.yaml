    reason: textual_variant
  - marker: b
    text: Au “asipolikiri hili ... yeye hatambuliwi.” Kigiriki kinatumia kitenzi kilekile katika kauli tendi na kauli tendwa ili kuleta mkazo wa balagha.
    reason: lexical_alternative
  revision_rationale: “Kutambua/hatambuliwi” preserves the active–passive verbal correspondence of the Greek and naturally expresses recognition or acknowledgment without specifying who does not recognize the person. The revised variant note retains the alternative reading’s imperative force.
