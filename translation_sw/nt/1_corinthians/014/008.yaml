  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: sw
  text: Kwa maana, tarumbeta ikitoa sauti isiyo wazi[a], ni nani atakayejiandaa kwenda vitani?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti isiyo dhahiri.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Huendeleza hoja kwa kutoa sababu au mfano unaofafanua yaliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na cha heshima katika Kiswahili.
- source_word: ἐὰν
  choice: iki-
  rationale: Muundo wa masharti “ikitoa” unawasilisha hali ya kudhaniwa inayotolewa kama mfano wa hoja.
- source_word: ἄδηλον
  choice: isiyo wazi
  rationale: Neno hilo humaanisha kisicho dhahiri au kisichoweza kutambuliwa kwa uhakika; hapa linahusu ishara ya tarumbeta ambayo haisikiki kwa uwazi wa kutosha.
- source_word: φωνὴν
  choice: sauti
  rationale: Ingawa φωνή pia linaweza kumaanisha “sauti ya mtu,” likitumiwa kuhusu tarumbeta humaanisha sauti inayotolewa na chombo hicho.
- source_word: σάλπιγξ
  choice: tarumbeta
  rationale: “Tarumbeta” ni neno la kawaida la Kiswahili kwa chombo cha kupulizwa kinachotumika kutoa ishara, likifaa katika muktadha wa kijeshi.
- source_word: δῷ
  choice: ikitoa
  rationale: δίδωμι kimsingi ni “kutoa”; muundo “tarumbeta ikitoa sauti” ni wa asili katika Kiswahili na unadumisha taswira ya Kigiriki.
- source_word: τίς
  choice: ni nani
  rationale: Huwasilisha moja kwa moja swali la balagha lililo katika maandishi ya Kigiriki.
- source_word: παρασκευάσεται
  choice: atakayejiandaa
  rationale: Kauli ya kati inadokeza mtu kujitayarisha mwenyewe; “kujiandaa” huonyesha wazi maana hiyo katika Kiswahili.
- source_word: εἰς πόλεμον
  choice: kwenda vitani
  rationale: Kihalisi ni “kwa vita,” lakini katika muktadha wa ishara ya kijeshi, “kwenda vitani” ni Kiswahili cha asili kinachoonyesha kusudi la kujiandaa bila kupanua hoja.
