  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: sw
  text: Vivyo hivyo nanyi, msipotoa kwa ulimi maneno yanayoeleweka[a], kile kinachosemwa kitaelewekaje? Kwa maana mtakuwa mkisema hewani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yaliyo wazi” au “ujumbe ulio wazi.” Neno la Kigiriki linasisitiza usemi unaoweza kutambuliwa na kueleweka na wasikilizaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo nanyi
  rationale: Inaendeleza ulinganisho wa Paulo na mfano uliotangulia, huku ikiwahutubia Wakorintho moja kwa moja kwa Kiswahili cha kawaida.
- source_word: διὰ τῆς γλώσσης
  choice: kwa ulimi
  rationale: Inahifadhi picha halisi ya ulimi kama chombo cha kutolea usemi bila kuitafsiri mapema kuwa lugha.
- source_word: εὔσημον λόγον
  choice: maneno yanayoeleweka
  rationale: εὔσημος hueleza usemi ulio wazi au unaotambulika kwa urahisi; wingi wa Kiswahili 'maneno' unawakilisha kwa kawaida λόγον yenye maana ya usemi katika muktadha huu.
- source_word: δῶτε
  choice: msipotoa
  rationale: Inadumisha wazo la msingi la δίδωμι, 'kutoa,' na ni ya asili inapounganishwa na 'maneno.'
- source_word: πῶς γνωσθήσεται
  choice: itajulikanaje
  rationale: Inahifadhi kwa ukaribu hali ya kutendwa ya γινώσκω na, katika muktadha wa mawasiliano, inamaanisha kuelewa kile kilichosemwa.
- source_word: τὸ λαλούμενον
  choice: kile kinachosemwa
  rationale: Ni tafsiri ya kawaida ya kishiriki kilichotumika kama nomino na inahifadhi hali yake ya kutendwa.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Kwa maana mtakuwa mkisema hewani
  rationale: Inahifadhi sitiari ya usemi usiofika kwa msikilizaji wala kueleweka; 'hewani' ni usemi mfupi na wa kawaida wa Kiswahili.
