id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: sw
  text: Lakini wakitaka kujifunza jambo lolote, waulize waume zao wenyewe nyumbani, kwa maana ni aibu kwa mwanamke[a] kusema katika kusanyiko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mke.” Neno la Kigiriki linaweza kumaanisha “mwanamke” au “mke,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “kanisani” au “katika mkutano wa waamini”; neno la Kigiriki hapa hurejelea kusanyiko lililokutana.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: kujifunza
  rationale: Kitenzi hiki humaanisha kujifunza au kupata kujua; “kujifunza” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: ἐν οἴκῳ
  choice: nyumbani
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza mahali pa nyumbani, na inadumisha utofautishaji kati ya mazingira ya nyumbani na kusanyiko.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: waume zao wenyewe
  rationale: Ingawa ἀνήρ inaweza kumaanisha mwanamume au mume, ἰδίους pamoja na mazingira ya nyumbani inaunga mkono maana ya “waume zao wenyewe.”
- source_word: ἐπερωτάτωσαν
  choice: waulize
  rationale: Hii inadumisha nguvu ya amri na ni usemi mfupi, wazi na wa kawaida katika Kiswahili.
- source_word: αἰσχρὸν
  choice: aibu
  rationale: “Ni aibu” huwasilisha kwa lugha ya kawaida uzito wa kijamii na kimaadili wa neno la Kigiriki bila kuupunguza kuwa kutofaa tu.
- source_word: γυναικὶ
  choice: kwa mwanamke
  rationale: γυνή inaweza kumaanisha mwanamke au mke. “Mwanamke” inafaa kama maana ya msingi katika kauli hii ya jumla, huku “mke” ikihifadhiwa katika tanbihi.
- source_word: λαλεῖν
  choice: kusema
  rationale: “Kusema” ni pana na ya asili, na haiamui mapema aina hususa ya usemi unaokusudiwa.
- source_word: ἐν ἐκκλησίᾳ
  choice: katika kusanyiko
  rationale: Hapa ἐκκλησία hurejelea mkusanyiko wa waamini; “kusanyiko” huepuka kuifanya iwe jengo au taasisi na kudumisha wazo la watu waliokusanyika.
theological_decisions:
- issue: Upeo wa katazo kuhusu mwanamke kusema
  choice: Kauli imetafsiriwa jinsi ilivyo bila kuibana katika aina fulani ya usemi.
  alternative: Kuieleza kuwa maswali yenye kuvuruga, kupima unabii, au nukuu ya msimamo wa Wakorintho.
  rationale: Maneno ya Kigiriki yenyewe hayasemi wazi aina ya usemi unaokusudiwa. Tafsiri inadumisha mvutano huo badala ya kuingiza ufafanuzi wa kimadhehebu katika matini.
- issue: Ikiwa γυνή/ἀνήρ yatafsiriwe mwanamke/mwanamume au mke/mume
  choice: “Waume” limetumiwa kwa ἄνδρας na “mwanamke” kwa γυναικί katika matini kuu, huku “mke” ikitajwa katika tanbihi.
  alternative: Kutumia “mke ... mume” kote, au “mwanamke ... wanaume” kote.
  rationale: Kirai “waume zao wenyewe” kinaonyesha wazi zaidi uhusiano wa ndoa, lakini γυναικί ya umoja inaweza kuwa “mwanamke” kwa ujumla au “mke” kulingana na muktadha. Tanbihi inadumisha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kawaida, wenye heshima na unaoeleweka. Muundo ni mfupi na unafuata mtiririko wa Kigiriki bila kuwa mgumu; “kusanyiko” linaonyesha mkutano wa watu badala ya jengo.
