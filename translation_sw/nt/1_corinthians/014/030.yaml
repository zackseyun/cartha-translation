lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Lakini ikiwa
  rationale: ἐὰν huanzisha sharti, huku δὲ ikionyesha utofautishaji au hatua mpya kwa upole; “Lakini ikiwa” linafaa katika mfululizo wa maagizo ya Paulo.
- source_word: ἄλλῳ
  choice: mwingine
  rationale: Dativi ya ἄλλος humaanisha mshiriki mwingine tofauti na anayesema wakati huo; Kiswahili kinaweza kuonyesha mpokeaji kwa muundo “mwingine ... anafunuliwa jambo.”
- source_word: ἀποκαλυφθῇ
  choice: anafunuliwa jambo
  rationale: Kitenzi hiki cha hali ya kutendwa humaanisha kwamba jambo linawekwa wazi kwa mtu. Muundo huu huhifadhi hali ya kutendwa bila kumtaja wazi mtendaji ambaye maandiko hayamtaji katika mstari huu.
- source_word: καθημένῳ
  choice: aliyeketi
  rationale: Kirai hiki humfafanua huyo mwingine kuwa ameketi; “aliyeketi” ni cha kawaida, wazi, na chenye heshima katika Kiswahili sanifu.
- source_word: ὁ πρῶτος
  choice: yule wa kwanza
  rationale: Huhifadhi usemi halisi “wa kwanza” bila kuongeza “msemaji,” ingawa muktadha unaonyesha kuwa ni aliyekuwa akisema kwanza.
- source_word: σιγάτω
  choice: anyamaze
  rationale: Amri ya nafsi ya tatu inaelekeza yule wa kwanza akome kusema. “Anyamaze” ni fupi, ya asili, na huhifadhi nguvu ya amri.
theological_decisions:
- issue: Asili na namna ya ufunuo katika unabii wa kusanyiko
  choice: “anafunuliwa jambo” bila kumtaja Mungu wazi kuwa mtendaji
  alternative: “anapewa ufunuo” au “Mungu anamfunulia jambo”
  rationale: Kitenzi cha Kigiriki kiko katika hali ya kutendwa na hakimtaji mtendaji. Tafsiri inadokeza tukio la kufunuliwa lakini haiongezi kwa uwazi kwamba Mungu ndiye mtendaji, ingawa hilo linaweza kueleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “anafunuliwa jambo” umechaguliwa ili kuhifadhi hali ya kutendwa na uwezekano wa maana ya Kigiriki; tanbihi inatoa usemi wa kawaida zaidi “anapewa ufunuo.”
