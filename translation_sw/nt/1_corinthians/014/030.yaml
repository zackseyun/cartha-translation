  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: sw
  text: Lakini ikiwa mwingine aliyeketi atafunuliwa jambo[a], yule wa kwanza anyamaze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atapewa ufunuo.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, anayesema kwanza aache kusema ili huyo mwingine apate kusema.
