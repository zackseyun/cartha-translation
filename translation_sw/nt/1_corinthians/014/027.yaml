  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: sw
  text: Kama mtu yeyote ananena kwa lugha[a], wanene watu wawili, au wasizidi watatu, kila mmoja kwa zamu yake, na mtu mmoja afasiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha “ulimi” au “lugha.” Hapa “lugha” linadumisha istilahi iliyotumiwa katika sura hii bila kuamua aina halisi ya karama hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: kwa lugha
  rationale: Katika 1 Wakorintho 12–14, “lugha” ni istilahi ya kawaida ya Kiswahili kwa jambo hili la kiroho. Pia inadumisha uwezekano wa maana ya lugha bila kuamua ikiwa ni lugha ya kawaida ya wanadamu au usemi wa aina nyingine.
- source_word: τις
  choice: mtu yeyote
  rationale: Kiwakilishi hiki hakimtaji mtu maalumu; “mtu yeyote” huwasilisha vizuri maana yake ya jumla katika sentensi ya masharti.
- source_word: λαλεῖ
  choice: ananena
  rationale: “Ananena” ni lugha ya sasa yenye hadhi inayofaa muktadha wa ibada, na huonyesha tendo la kusema bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: wanene watu wawili, au wasizidi watatu
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa Paulo anaweka kikomo cha wasemaji kuwa wawili, au watatu kwa kiwango cha juu.
- source_word: ἀνὰ μέρος
  choice: kila mmoja kwa zamu yake
  rationale: Kirai hiki kinaonyesha kuwa waseme mmoja baada ya mwingine, wala si kwa wakati mmoja.
- source_word: εἷς
  choice: mtu mmoja
  rationale: Namba hii imetumiwa kama nomino na inaonyesha mtu mmoja anayefanya kazi ya kufasiri.
- source_word: διερμηνευέτω
  choice: afasiri
  rationale: “Afasiri” ni neno linalofaa kwa kutoa maana inayoeleweka ya usemi huo kwa kusanyiko, bila kuibana maana kuwa tafsiri ya lugha ya kawaida pekee.
theological_decisions:
- issue: Maana ya γλώσσῃ katika muktadha wa karama za kiroho
  choice: Kutumia “kwa lugha” bila kubainisha aina ya usemi unaokusudiwa
  alternative: “kwa ulimi,” “kwa lugha ya kigeni,” au usemi unaotaja wazi lugha ya furaha ya kiroho
  rationale: Muktadha unahusu karama inayojadiliwa katika 1 Wakorintho 12–14, lakini aya hii peke yake haisuluhishi mjadala kuhusu ikiwa usemi huo ni lugha ya kawaida ya wanadamu au usemi wa aina nyingine. Tafsiri hii inadumisha mvutano huo.
- issue: Idadi ya wanaoruhusiwa kunena na ya wanaofasiri
  choice: Wasemaji wawe wawili au wasizidi watatu, wakinena kwa zamu; mtu mmoja afasiri
  alternative: Kuelewa “mmoja” kama “kila mmoja” au kama idadi isiyo na kikomo ya wafasiri
  rationale: Maana ya moja kwa moja ya maandishi inaweka kikomo cha wasemaji na inamtaja mfasiri mmoja, bila kuongeza maelekezo zaidi yasiyosemwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Ananena” na “afasiri” zinafaa muktadha wa ibada bila kuwa za kale kupita kiasi. Muundo umewekwa wazi ili amri ya kusema kwa zamu na kikomo cha idadi isichanganye.
