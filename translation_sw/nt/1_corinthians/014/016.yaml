  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: sw
  text: La sivyo, ikiwa unabariki kwa roho[b], yule aliye katika nafasi ya asiye na ujuzi[a] atasemaje “Amina” kwa shukrani zako[c], kwa kuwa hajui unachosema?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa nje,” “mtu wa kawaida,” au “mtu asiyeelimishwa” kwa neno “asiye na ujuzi” (τοῦ ἰδιώτου).
    reason: lexical_alternative
  - marker: b
    text: Au “rohoni” badala ya “kwa roho”; Kigiriki hakihitaji maana mahususi zaidi hapa.
    reason: alternative_reading
  - marker: c
    text: “Shukrani” hapa humaanisha tendo la kutoa shukrani, si lazima istilahi ya baadaye ya kiufundi “Ekaristi.”
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: La sivyo, ikiwa
  rationale: Muunganiko huu unaanzisha hali ya masharti yenye nguvu ya kuonyesha matokeo au kusahihisha hoja iliyotangulia. “La sivyo, ikiwa” ni ya asili katika Kiswahili na inaendeleza mantiki hiyo.
- source_word: εὐλογῇς
  choice: unabariki
  rationale: Kitenzi hiki kinamaanisha kubariki au kunena mema; hapa kinahusu baraka inayotamkwa katika ibada. “Unabariki” hudumisha uhusiano wa moja kwa moja wa kileksia.
- source_word: πνεύματι
  choice: rohoni
  rationale: Hali ya dative ya Kigiriki inaweza kueleweka kwa maana ya chombo (“kwa roho”) au eneo/mazingira (“rohoni”). “Rohoni” ni fupi na ya asili, huku ikiacha wazi kama inarejelea roho ya msemaji au usemi unaowezeshwa na Roho.
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: yule anayechukua nafasi
  rationale: Huu ni usemi wa kiidioma kuhusu mtu aliye katika nafasi au hali fulani ndani ya kusanyiko. “Anayechukua nafasi” huhifadhi taswira hiyo bila kuwa nzito.
- source_word: τοῦ ἰδιώτου
  choice: ya mtu asiye na ujuzi
  rationale: ἰδιώτης inaweza kumaanisha mtu asiye mtaalamu, asiyeelimishwa katika jambo hilo, au mtu wa nje. Katika muktadha huu mkazo uko katika kutokuelewa usemi; “mtu asiye na ujuzi” huwasilisha hilo kwa lugha inayoeleweka, huku maana nyingine zikitajwa katika tanbihi.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: atasemaje “Amina”
  rationale: Usemi huu unahusu jibu la kusanyiko la kukubali yaliyosemwa. “Atasemaje ‘Amina’” ni wa moja kwa moja na wa asili katika Kiswahili.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: kwa shukrani zako
  rationale: εὐχαριστία hapa ni usemi au tendo la kutoa shukrani. “Kwa shukrani zako” linafaa kwa jibu la “Amina” na halileti maana ya baadaye ya kiufundi ya Ekaristi.
- source_word: ἐπειδὴ
  choice: kwa kuwa
  rationale: Huanzisha sababu inayomzuia mtu huyo kusema “Amina.” “Kwa kuwa” ni wazi na ya kawaida.
- source_word: τί λέγεις οὐκ οἶδεν
  choice: hajui unachosema
  rationale: Hili ni tafsiri ya karibu inayohifadhi kitenzi “kujua,” ingawa katika muktadha kutokuelewa ndiko kunakokusudiwa.
theological_decisions:
- issue: Maana ya πνεύματι katika ibada yenye karama za kiroho
  choice: Imetafsiriwa kwa ujumla kuwa “rohoni,” bila kubainisha ikiwa ni roho ya msemaji au usemi unaowezeshwa na Roho.
  alternative: “kwa roho” au “kwa Roho”
  rationale: Kigiriki hakilazimishi uamuzi mahususi kuhusu rejeo hilo. Tafsiri pana huhifadhi utata na mvutano wa kiteolojia uliopo katika maandishi.
- issue: Maana ya εὐχαριστίᾳ
  choice: Imetafsiriwa kuwa “shukrani,” yaani tendo la kutoa shukrani.
  alternative: “Ekaristi”
  rationale: Muktadha wa karibu unazungumzia maneno ya shukrani yanayopaswa kueleweka katika kusanyiko. Kutumia “Ekaristi” kungeingiza maana ya kiufundi ya baadaye ambayo kifungu hakihitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili bila kuondoa taswira ya nafasi katika kusanyiko, jibu la “Amina,” au utata wa neno πνεύματι.
