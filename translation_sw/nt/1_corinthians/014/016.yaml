review_pass:
  verdict: revise
  source_fidelity: The conditional logic, blessing, congregational “Amina,” thanksgiving, and explanatory final clause are conveyed accurately. However, “anayechukua nafasi ya mtu asiye na ujuzi” normally suggests replacing that person, whereas ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου denotes one who occupies the position/status of such a person in the gathering. “Rohoni” can also imply an inward location or manner more strongly than the Greek; “kwa roho” better preserves the dative ambiguity without identifying the referent as the Holy Spirit.
  naturalness: The revision is clear, idiomatic Standard East African Swahili, while retaining the source’s worship-setting terminology and rhetorical question.
  terminology: “Amina,” “bariki,” and “shukrani” are appropriate. Lower-case “roho” appropriately avoids resolving whether πνεύματι refers to the speaker’s spirit or to Spirit-enabled speech. The cultural footnote properly avoids making “Ekaristi” the required meaning.
  issues:
  - severity: medium
    issue: The phrase “anayechukua nafasi ya mtu asiye na ujuzi” can mean ‘the one replacing an uninstructed person.’
    rationale: The Greek refers to a person occupying the place or position of the ἰδιώτης, not necessarily substituting for such a person. “Aliye katika nafasi ya…” retains the social/assembly-role sense.
  - severity: low
    issue: “Rohoni” narrows or colors the ambiguous dative πνεύματι.
    rationale: In contemporary Swahili it can suggest ‘inwardly/in one’s heart.’ “Kwa roho” is a closer, still deliberately non-specific rendering; the alternative remains footnoted.
  revised_text: La sivyo, ikiwa unabariki kwa roho[b], yule aliye katika nafasi ya asiye na ujuzi[a] atasemaje “Amina” kwa shukrani zako[c], kwa kuwa hajui unachosema?
  revised_footnotes:
