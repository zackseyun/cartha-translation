translation:
  language: sw
  text: Ninamshukuru Mungu kwamba ninazungumza kwa lugha zaidi kuliko ninyi nyote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninazungumza kwa ndimi zaidi kuliko ninyi nyote.” Neno la Kigiriki linaweza kumaanisha “lugha”; katika muktadha huu linarejelea jambo linalojadiliwa katika 1 Wakorintho 12–14. “Kwa ndimi” ni istilahi ya kimapokeo katika tafsiri za Biblia.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Namshukuru
  rationale: Kitenzi cha wakati uliopo, nafsi ya kwanza umoja. Kiswahili hutumia kiambishi cha yambwa katika “namshukuru,” ambacho kwa kawaida na kwa uwazi humrejelea Mungu.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Ni yambwa isiyo ya moja kwa moja ya εὐχαριστέω katika Kigiriki, lakini Kiswahili sanifu husema kwa kawaida “namshukuru Mungu.”
- source_word: πάντων ὑμῶν
  choice: yenu nyote
  rationale: Huhifadhi ulinganisho na kundi lote la waandikiwa bila kulazimisha maana ya ‘kuliko kila mmoja wenu’.
- source_word: μᾶλλον
  choice: zaidi
  rationale: Kielezi hiki kinaonyesha kiwango kikubwa zaidi kwa kulinganisha na “yenu nyote.”
- source_word: γλώσσαις
  choice: kwa lugha
  rationale: Katika 1 Wakorintho 12–14 neno hili linataja jambo au karama inayojadiliwa. “Kwa lugha” ni usemi wa kawaida katika Kiswahili cha Biblia na hauamui ikiwa ni lugha za kibinadamu zinazotambulika au aina nyingine ya usemi.
- source_word: λαλῶ
  choice: ninazungumza
  rationale: Huwakilisha wakati uliopo, nafsi ya kwanza umoja, kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Tafsiri ya γλώσσαις katika mjadala wa 1 Wakorintho 12–14
  choice: kwa lugha
  alternative: kwa ndimi
  rationale: “Kwa lugha” huhifadhi maana ya msingi ya neno na jambo la kiroho linalojadiliwa bila kuamua kwa siri asili yake. “Kwa ndimi” ni tafsiri ya kimapokeo lakini katika Kiswahili cha sasa inaweza kueleweka kwanza kama kiungo cha mwili; imehifadhiwa katika tanbihi kama mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; tanbihi huhifadhi istilahi ya kimapokeo na utata halisi wa γλώσσαις.
