lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaongeza hoja inayounga mkono maagizo yaliyotangulia na kuhifadhi mtiririko wa sentensi.
- source_word: πνεύματα
  choice: roho
  rationale: Neno la Kigiriki liko katika wingi na kwa kawaida humaanisha ‘roho.’ Muktadha unaweza kuhusisha misukumo au utendaji wa kiroho wa kinabii, lakini tafsiri kuu haipaswi kulifafanua kupita kiasi kuwa ‘matamshi’ au ‘karama.’
- source_word: προφητῶν
  choice: za manabii
  rationale: Hii ni kauli ya umilikaji au uhusiano inayorekebisha ‘roho’; ‘za manabii’ ni ya asili katika Kiswahili na inahifadhi uwezekano wa maana zaidi ya moja.
- source_word: προφήταις
  choice: manabii
  rationale: Yambwa ya kitenzi inaonyesha wale ambao roho hizo zinawatii. Muundo wa Kiswahili ‘huwatii manabii’ unaeleza uhusiano huo bila kulazimisha maana ya ‘kudhibitiwa na’ katika matini kuu.
- source_word: ὑποτάσσεται
  choice: huwatii
  rationale: Kitenzi kina maana ya kuwa chini ya mamlaka au kujitiisha. ‘Huwatii’ ni lugha ya sasa na ya heshima, na hali ya mazoea huafiki kauli hii ya jumla.
theological_decisions:
- issue: Maana ya ‘roho za manabii’ kuhusiana na uwezo wa nabii kujizuia
  choice: Kuhifadhi usemi ‘roho za manabii’ huku tanbihi ikionyesha kuwa unaweza kurejelea misukumo au utendaji wa kiroho unaohusiana na manabii.
  alternative: Kuitafsiri moja kwa moja kuwa ‘misukumo ya kinabii,’ au kueleza kwamba roho za kibinadamu za manabii huwatii manabii wengine.
  rationale: Muktadha unasisitiza utaratibu na uwajibikaji katika kutoa unabii, lakini muundo wa Kigiriki hauamui wazi ikiwa ni roho za manabii, misukumo ya kinabii, au utendaji wa kiroho. Tafsiri inahifadhi mvutano huo bila kuingiza mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Huwatii’ imetumiwa badala ya istilahi nzito kama ‘hujitiisha chini ya mamlaka,’ huku tanbihi ikihifadhi utata halisi wa usemi wa Kigiriki.
