  text: Na roho za manabii huwatii manabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho zinazohusishwa na manabii huwatii manabii.” Usemi huu unaweza kurejelea misukumo ya kinabii au utendaji wa kiroho unaohusiana na manabii, ukikazia uwezo wa kujizuia katika kutoa unabii.
