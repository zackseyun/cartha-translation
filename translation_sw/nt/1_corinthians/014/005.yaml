id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: sw
  text: Ninataka ninyi nyote mnene kwa lugha, lakini nataka zaidi mtoe unabii. Anayetoa unabii ni mkuu kuliko anayenena kwa lugha, isipokuwa akifasiri[a], ili kanisa lijengwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa mtu fulani afasiri.” Kitenzi cha Kigiriki cha umoja kinaweza kumrejelea mwenye kunena kwa lugha, au, kwa kuzingatia muktadha mpana, kuonyesha kwamba tafsiri itolewe.
    reason: alternative_reading
  - marker: b
    text: “Kujengwa” hapa kunamaanisha kuimarishwa kwa kanisa lililokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Ninataka
  rationale: Kitenzi cha wakati uliopo kinaeleza moja kwa moja tamaa au mapendeleo ya Paulo; “ninataka” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: πάντας ὑμᾶς
  choice: ninyi nyote
  rationale: Kinahifadhi wingi na ujumuishi wa maneno ya Kigiriki kwa kusisitiza kwamba Paulo anawahutubia waumini wote.
- source_word: λαλεῖν γλώσσαις
  choice: mnene kwa lugha
  rationale: “Kunena kwa lugha” ni usemi unaotambulika katika muktadha wa 1 Wakorintho 12–14 na unahifadhi neno γλώσσαις bila kulifafanua kimadhehebu kuwa lugha za aina fulani.
- source_word: μᾶλλον δὲ
  choice: lakini nataka zaidi
  rationale: Inaonyesha mapendeleo ya kulinganisha, si kukataa kabisa kunena kwa lugha. Kurudia “nataka” kunafanya sentensi iwe wazi na ya asili katika Kiswahili.
- source_word: ἵνα προφητεύητε
  choice: mtoe unabii
  rationale: Baada ya θέλω, kishazi hiki kinaeleza jambo analotaka Paulo; “mtoe unabii” ni la kawaida na huepuka dhana kwamba kila anayefanya hivyo lazima apewe cheo cha kudumu cha nabii.
- source_word: μείζων
  choice: ni mkuu kuliko
  rationale: Kinahifadhi ulinganisho wa moja kwa moja wa Kigiriki. Kusudi linalofuata—kanisa kujengwa—linaonyesha kwamba ukuu unaozungumziwa unahusu manufaa katika kusanyiko, si thamani ya mtu mbele za Mungu.
- source_word: ὁ προφητεύων
  choice: anayetoa unabii
  rationale: Muundo huu wa jumla unamtaja mtu kwa tendo analofanya bila kuingiza cheo rasmi kisichotajwa wazi katika mstari.
- source_word: ὁ λαλῶν γλώσσαις
  choice: anayenena kwa lugha
  rationale: Unadumisha ulinganifu wa kisarufi na “anayetoa unabii” na istilahi ileile ya sehemu ya kwanza ya mstari.
- source_word: ἐκτὸς εἰ μὴ
  choice: isipokuwa
  rationale: Ni tafsiri ya kawaida na fupi ya kishazi cha kuonyesha hali ya pekee.
- source_word: διερμηνεύῃ
  choice: akifasiri
  rationale: “Kufasiri” inafaa kwa kufanya yaliyosemwa kwa lugha yaeleweke. Kiambishi cha nafsi kilichoachwa katika Kiswahili kwa kawaida humrejelea anayenena, huku tanbihi ikihifadhi uwezekano mpana zaidi wa mfasiri mwingine.
- source_word: ἡ ἐκκλησία
  choice: kanisa
  rationale: Katika muktadha huu linamaanisha jumuiya ya waamini waliokusanyika; “kanisa” ni neno la kawaida la Kiswahili, huku sentensi ikilenga kusanyiko lenyewe.
- source_word: οἰκοδομὴν λάβῃ
  choice: lijengwe
  rationale: Muundo wa kutendwa unawasilisha kwa Kiswahili cha asili picha ya kanisa kuimarishwa au kujengwa kiroho, badala ya tafsiri nzito ya neno kwa neno ya ‘kupokea kujengwa.’
theological_decisions:
- issue: Ukuu wa anayetoa unabii ukilinganishwa na anayenena kwa lugha
  choice: “ni mkuu kuliko,” huku kusudi la kanisa kujengwa likionyesha manufaa makubwa zaidi kwa kusanyiko
  alternative: Ni mkuu kwa cheo, utakatifu, au thamani ya kiroho
  rationale: Kishazi cha kusudi, “ili kanisa lijengwe,” kinaweka ulinganisho katika kazi ya kulinufaisha kusanyiko. Tafsiri inahifadhi neno lenye nguvu “mkuu” bila kuingiza madai ya daraja la kiroho ambayo mstari hautoi.
- issue: Mtendaji wa διερμηνεύῃ
  choice: 'Kwa kawaida ni yule anayenena kwa lugha: “isipokuwa akifasiri”'
  alternative: Isipokuwa mtu mwingine afasiri, au isipokuwa tafsiri itolewe
  rationale: Kitenzi cha umoja kisicho na mtendaji mpya aliyetajwa kwa kawaida humrejelea mtu wa umoja aliyetangulia. Hata hivyo, muktadha mpana wa sura unaruhusu mtu mwingine kufasiri, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Istilahi “kunena kwa lugha,” “kutoa unabii,” na “kanisa kujengwa” zimetumiwa kwa ulinganifu na muktadha wa sura bila kuingiza ufafanuzi wa kimadhehebu.
