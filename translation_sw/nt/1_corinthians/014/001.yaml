base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: sw
  text: Ufuateni upendo kwa bidii, na yatamanini sana mambo ya kiroho[a], lakini hasa mtamani kunena unabii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karama za kiroho.” Kiyunani kina maana pana ya “mambo ya kiroho,” lakini hapa muktadha unahusu hasa maonyesho yanayotolewa na Roho katika kanisa.
    reason: lexical_alternative
  - marker: b
    text: Au “bali zaidi mtamani kunena unabii.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Διώκετε
  choice: Ufuateni kwa bidii
  rationale: Kitenzi hiki kinaonyesha kufuatilia jambo kwa juhudi na kwa kuendelea; nyongeza ya “kwa bidii” inaweka wazi nguvu ya agizo hilo katika Kiswahili cha kawaida.
- source_word: τὴν ἀγάπην
  choice: upendo
  rationale: “Upendo” ni neno la kawaida na lenye heshima, na linadumisha uhusiano wa moja kwa moja na hoja ya sura ya 13.
- source_word: ζηλοῦτε
  choice: yatamanini sana
  rationale: Huwasilisha hamu kubwa na bidii iliyo katika agizo la Kiyunani bila kutumia msemo mgumu au usio wa kawaida.
- source_word: τὰ πνευματικά
  choice: mambo ya kiroho
  rationale: Umbo la Kiyunani ni kivumishi cha wingi kisicho na nomino iliyotajwa, hivyo lina maana pana kuliko “karama” pekee. “Mambo ya kiroho” huhifadhi upana huo, huku muktadha ukielekeza kwenye maonyesho au karama zitokazo kwa Roho katika kusanyiko.
- source_word: μᾶλλον δὲ
  choice: lakini hasa
  rationale: Msemo huu unaonyesha utofautishaji na kipaumbele. “Lakini hasa” ni wa asili katika Kiswahili na hauondoi thamani ya mambo mengine ya kiroho.
- source_word: ἵνα προφητεύητε
  choice: mpate kutoa unabii
  rationale: “Mpate” huhifadhi kwa kiasi kizuri muundo wa ἵνα pamoja na hali tegemezi, na “kutoa unabii” ni usemi unaoeleweka kwa tendo la kunena ujumbe wa kinabii.
theological_decisions:
- issue: Upeo wa τὰ πνευματικά
  choice: mambo ya kiroho
  alternative: karama za kiroho
  rationale: Ingawa sura za 12–14 zinahusu karama na maonyesho ya Roho katika kanisa, maneno ya Kiyunani yenyewe ni mapana zaidi. Tafsiri kuu huhifadhi upana huo, na tanbihi inaonyesha tafsiri ya kimuktadha.
- issue: Nguvu ya kipaumbele kinachopewa unabii
  choice: lakini hasa mpate kutoa unabii
  alternative: bali zaidi mpate kutoa unabii
  rationale: Tafsiri hii huhifadhi kwamba Paulo anaweka unabii mbele katika muktadha huu bila kudokeza kwamba ndiyo karama pekee halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Mambo ya kiroho” limechaguliwa badala ya kufupisha maana kuwa “karama” pekee, na tanbihi zimewekwa baada ya maneno yanayohusika.
