source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: sw
  text: 'Katika Sheria imeandikwa: “Kwa watu wenye lugha nyingine na kwa midomo ya wageni[a] nitasema na watu hawa; lakini hata kwa njia hiyo hawatanisikiliza mimi[b],” asema Bwana.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa lugha nyingine na kwa midomo ya watu wengine.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawatanitii.”
    reason: lexical_alternative
  - marker: c
    text: Dondoo hili linaakisi Isaya 28:11–12.
    reason: cross_reference
  - marker: d
    text: Kwa kuwa hili ni dondoo ambalo Mungu wa Israeli ndiye anayesema, tafsiri nyingine huandika “asema BWANA” ili kuonyesha msingi wake wa Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Katika Sheria
  rationale: Hapa νόμος inarejelea kwa upana Maandiko ya Kiyahudi, ingawa dondoo linatoka Isaya; herufi kubwa inadumisha matumizi hayo maalumu.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutanguliza dondoo la Maandiko na unaakisi hali timilifu ya Kigiriki.
- source_word: ἑτερογλώσσοις
  choice: kwa watu wenye lugha nyingine
  rationale: Neno linaonyesha wenye lugha tofauti; kutaja “watu” huifanya sentensi iwe ya asili katika Kiswahili huku uhusiano na mada ya lugha katika sura hii ukibaki wazi.
- source_word: χείλεσιν ἑτέρων
  choice: kwa midomo ya wageni
  rationale: Taswira halisi ya “midomo” imehifadhiwa, na “wageni” inaonyesha watu wa lugha au taifa jingine katika muktadha huu.
- source_word: λαλήσω
  choice: nitasema
  rationale: Ni kitenzi rahisi na cha kawaida kinacholingana moja kwa moja na λαλέω na kinafaa kwa kauli ya Mungu.
- source_word: τῷ λαῷ τούτῳ
  choice: na watu hawa
  rationale: Muundo “kusema na” ni wa kawaida katika Kiswahili kwa maana ya kuwaelekezea watu maneno; “watu” inadumisha maana ya λαός.
- source_word: οὐδ’ οὕτως
  choice: lakini hata kwa njia hiyo
  rationale: Unahifadhi msisitizo kwamba hata njia hiyo isiyo ya kawaida haitawafanya waitikie.
- source_word: εἰσακούσονταί μου
  choice: hawatanisikiliza
  rationale: “Kusikiliza” linaweza kumaanisha kusikia kwa makini na pia kuitikia, hivyo linafaa kwa wigo wa maana wa εἰσακούω.
- source_word: λέγει κύριος
  choice: asema Bwana
  rationale: Ni usemi wa sasa wa kutambulisha msemaji wa dondoo; κύριος imetafsiriwa moja kwa moja kuwa “Bwana.”
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος katika dondoo la Maandiko lenye kauli ya Mungu
  choice: Bwana
  alternative: BWANA
  rationale: Matini ya Kigiriki ina κύριος, kwa hiyo “Bwana” ndiyo tafsiri ya moja kwa moja. “BWANA” inaweza kuonyesha kwamba katika msingi wa Kiebrania msemaji ni Mungu wa Israeli mwenye jina la agano, lakini taarifa hiyo haijaingizwa kimya kimya katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya “midomo” na mvutano kati ya kusikia na kuitikia vimehifadhiwa.
