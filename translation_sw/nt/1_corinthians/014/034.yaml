  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: sw
  text: Wanawake katika makusanyiko[a] wanyamaze, kwa maana hawaruhusiwi kusema[b], bali wajitiishe, kama vile sheria[c] inavyosema pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wake katika makusanyiko”; neno la Kigiriki γυνή linaweza kumaanisha “mwanamke” au “mke,” kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Mstari huu wenyewe haubainishi ni aina gani ya kusema inayokusudiwa; wengine hulielewa katazo hili kwa maana nyembamba zaidi kutokana na muktadha unaolizunguka.
    reason: lexical_alternative
  - marker: c
    text: Au, “Sheria”; huenda Paulo anarejelea hasa Sheria ya Musa au Maandiko kwa maana pana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: wanawake
  rationale: γυνή inaweza kumaanisha ‘mwanamke’ au ‘mke.’ Kwa kuwa mstari wenyewe hautaji waume, maana pana ‘wanawake’ imewekwa katika matini, huku ‘wake’ ikihifadhiwa katika tanbihi.
- source_word: ἐκκλησίαις
  choice: makusanyiko
  rationale: Katika muktadha huu neno linahusu mikusanyiko ya waamini. ‘Makusanyiko’ linaonyesha mazingira ya ibada ya pamoja bila kulifanya neno limaanishe majengo.
- source_word: σιγάτωσαν
  choice: wanyamaze
  rationale: Amri hii ina maana ya kukaa kimya au kuacha kusema katika hali inayozungumziwa; ‘wanyamaze’ ni ya kawaida, wazi, na inaendana na matumizi ya kitenzi hiki katika sura hii.
- source_word: ἐπιτρέπεται
  choice: hawaruhusiwi
  rationale: Huhifadhi hali ya kutoruhusiwa iliyo katika muundo wa Kigiriki bila kuongeza anayetoa ruhusa.
- source_word: λαλεῖν
  choice: kusema
  rationale: λαλέω ni kitenzi kipana cha kusema; tafsiri haibainishi aina ya usemi ambayo mstari wenyewe hauibainishi.
- source_word: ὑποτασσέσθωσαν
  choice: wanyenyekee
  rationale: Huwasilisha amri ya kuwa katika hali ya kujitiisha kwa Kiswahili cha kawaida na chenye heshima, bila kuongeza mhusika ambaye wanapaswa kujitiisha kwake.
- source_word: νόμος
  choice: sheria
  rationale: Herufi za Kigiriki hazitatui ikiwa rejeo ni Sheria ya Musa hasa au Maandiko kwa maana pana; ‘sheria’ huhifadhi uwazi huo wa kitafsiri.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: kama vile sheria inavyosema pia
  rationale: Huhifadhi nguvu ya ulinganisho ya καθὼς na maana ya nyongeza ya καί.
theological_decisions:
- issue: Rejeo la γυναῖκες
  choice: wanawake katika makusanyiko
  alternative: wake katika makusanyiko
  rationale: Neno la Kigiriki linaweza kuwa na maana zote mbili, lakini mstari huu hautaji waume; kwa hiyo maana pana imo katika matini na nyingine katika tanbihi.
- issue: Upeo wa katazo la kusema
  choice: kusema, bila kuainisha aina ya usemi katika matini
  alternative: usemi wa kuvuruga mkutano au usemi unaohusiana na kupima unabii
  rationale: Mstari wenyewe unasema tu ‘kusema.’ Tafsiri haitatui mjadala wa kimuktadha kwa kuingiza ufafanuzi mwembamba.
- issue: Maana ya ὁ νόμος
  choice: sheria
  alternative: Sheria ya Musa hasa, au Maandiko kwa maana pana
  rationale: Rejeo kamili halijatajwa wazi; matini na tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Makusanyiko’ limetumiwa ili kuonyesha mikutano ya waamini; alama zote za tanbihi zimewekwa mara moja katika matini karibu na maneno yanayohusika.
