source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: sw
  text: Kwa hiyo, ikiwa kanisa lote linakusanyika mahali pamoja, na wote wananena kwa lugha[a], watu wasiofahamu mambo ya kusanyiko[b] au wasioamini wakiingia, je, hawatasema kwamba mna wazimu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa lugha mbalimbali.” Neno la Kigiriki linaweza kumaanisha lugha, lakini “kunena kwa lugha” huhifadhi usemi uliozoeleka katika muktadha huu bila kuamua asili ya jambo hilo.
    reason: alternative_reading
  - marker: b
    text: Au, “watu wa nje.” Neno la Kigiriki huenda linamaanisha watu wasio na ufahamu au uzoefu wa mambo ya kusanyiko, nao wametofautishwa hapa na wasioamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: kanisa
  rationale: Katika matumizi ya Paulo hapa, neno hili linamaanisha jumuiya yote ya waamini iliyokusanyika; “kanisa” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: ὅλη
  choice: lote
  rationale: Linasisitiza kwamba kusanyiko zima linahusika, si sehemu yake tu.
- source_word: ἐπὶ τὸ αὐτό
  choice: pamoja mahali pamoja
  rationale: Kirai hiki kinaonyesha kukusanyika kwa pamoja katika eneo lilelile; ingawa kuna ukaribu wa maana na “linakusanyika,” tafsiri hii huhifadhi msisitizo wa matini ya Kigiriki.
- source_word: λαλῶσιν γλώσσαις
  choice: wananena kwa lugha
  rationale: “Kunena kwa lugha” ni usemi uliozoeleka katika muktadha huu wa kibiblia, huku “lugha” ikiacha wazi asili ya tukio hilo badala ya kuliamulia kiufafanuzi.
- source_word: ἰδιῶται
  choice: watu wasiofahamu mambo hayo
  rationale: Hurejelea watu wasio na ujuzi au ufahamu wa mambo yanayotendeka katika kusanyiko. Kirai hiki kinawatofautisha na “wasioamini” bila kuwadokezea lazima kuwa hawajasoma.
- source_word: ἄπιστοι
  choice: wasioamini
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja kwa watu wasiokuwa na imani, na huhifadhi tofauti yao na ἰδιῶται.
- source_word: μαίνεσθε
  choice: mna wazimu
  rationale: Usemi huu huwasilisha shtaka la kuwa na akili iliyopotea kwa lugha ya kawaida, fupi, na yenye uzito unaolingana na kitenzi cha Kigiriki.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: je, hawatasema kwamba
  rationale: Huhifadhi wakati ujao na swali la balagha linalotarajia jibu la kukubali.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: συνέλθῃ
  choice: linakusanyika
  rationale: Hutoa maana ya kuja au kukutana pamoja kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Asili ya γλώσσαι katika 1 Wakorintho 14
  choice: kunena kwa lugha
  alternative: kusema kwa lugha mbalimbali
  rationale: Neno la Kigiriki linaweza kumaanisha lugha, lakini katika sura hii ni jina la jambo la karama linalojadiliwa. Usemi “kunena kwa lugha” huhifadhi uwazi wa matini kuhusu iwapo zilikuwa lugha za wanadamu, usemi wa kiroho, au jambo linaloweza kujumuisha yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, na istilahi za kiroho zimetumiwa bila kuingiza msimamo wa dhehebu.
