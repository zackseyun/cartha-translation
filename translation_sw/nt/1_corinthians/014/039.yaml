  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: sw
  text: Kwa hiyo, ndugu zangu[a], tamanini sana kutoa unabii, wala msikataze kusema kwa lugha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la wingi wa kiume, lakini katika muktadha huenda likawalenga waumini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho kutokana na mjadala uliotangulia; “Kwa hiyo” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya kimantiki.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: Ni wito wa moja kwa moja wenye kimilikishi “zangu.” Neno “ndugu” ni la kawaida na lenye heshima katika Kiswahili, na linaweza kulihusu kusanyiko lote bila kulazimisha jinsia isiyotajwa wazi katika muundo wa Kiswahili.
- source_word: ζηλοῦτε
  choice: tamani sana
  rationale: Amri ya wakati uliopo inahimiza shauku inayoendelea. “Tamani sana” huwasilisha hamu yenye bidii kwa lugha ya asili na iliyo wazi.
- source_word: τὸ προφητεύειν
  choice: kutoa unabii
  rationale: Infinitivu yenye kibainishi ndiyo lengo la himizo. “Kutoa unabii” ni usemi wa kawaida wa Kiswahili unaoeleza kitendo hicho bila kukifanya kuwa nomino dhahania.
- source_word: μὴ κωλύετε
  choice: msikataze
  rationale: Muundo wa μή pamoja na amri ya wakati uliopo ni katazo la moja kwa moja; “msikataze” huhifadhi nguvu hiyo kwa ufupi.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: kusema kwa lugha
  rationale: Muundo huu unarejelea zoea lililojadiliwa katika sura hii. “Kusema kwa lugha” huhifadhi kwa ukaribu usemi wa Kigiriki bila kuongeza ufafanuzi wa kitheolojia ambao chanzo hakitoi hapa.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika kusanyiko lenye wanaume na wanawake
  choice: ndugu zangu, kwa tanbihi kwamba neno hilo linaweza kulihusu kusanyiko lote
  alternative: ndugu zangu wa kiume na wa kike
  rationale: Kigiriki kina nomino ya wingi ya kiume ambayo katika muktadha inaweza kutumiwa kwa uwakilishi wa kusanyiko lote. Kiswahili “ndugu” hakilazimishi tofauti hiyo ya kijinsia, hivyo tanbihi huhifadhi taarifa ya umbo la chanzo na uwezekano wake wa matumizi jumuishi.
- issue: Maana ya γλώσσαις
  choice: lugha
  alternative: ndimi
  rationale: “Lugha” ni maana ya kawaida na ya sasa ya γλῶσσα katika muktadha huu, huku ikiacha asili au namna ya lugha hizo bila kutatuliwa kimadhehebu. “Ndimi” ingefuata kiungo halisi cha mwili lakini si usemi wa kawaida wa Kiswahili kwa zoea linalozungumziwa.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu mwafaka: unafuata mantiki na amri za Kigiriki huku ukitumia sintaksia ya asili ya Kiswahili.'
