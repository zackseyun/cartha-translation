  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: sw
  text: Kwa maana ninyi nyote mnaweza kutoa unabii mmoja baada ya mwingine,[a] ili wote wajifunze na wote watiwe moyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mmoja kwa zamu,” au “mmoja kwa wakati.”
    reason: lexical_alternative
  - marker: b
    text: Au “wahimizwe” au “wafarijiwe”; kitenzi cha Kigiriki kinaweza kumaanisha kutia moyo, kuhimiza, au kufariji kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: mnaweza
  rationale: Kitenzi hiki kinaonyesha uwezo au uwezekano; “mnaweza” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha sentensi hii na maagizo yaliyotangulia kwa kutoa msingi au maelezo.
- source_word: καθ’ ἕνα
  choice: mmoja baada ya mwingine
  rationale: Ni usemi unaoonyesha kufuatana kwa mpangilio, yaani mtu mmoja kwa wakati mmoja.
- source_word: πάντες
  choice: nyote / wote
  rationale: Marudio ya wazo la “wote” yamehifadhiwa, huku upatanisho wa kawaida wa Kiswahili ukitofautisha wanaosemewa moja kwa moja (“nyote”) na kundi linalorejelewa (“wote”).
- source_word: προφητεύειν
  choice: kutoa unabii
  rationale: Huhifadhi kitengo cha shughuli ya kinabii katika hoja ya Paulo bila kukifafanua kwa namna finyu.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa kwa Kiswahili cha asili.
- source_word: μανθάνωσιν
  choice: wajifunze
  rationale: Huwasilisha tendo la kujifunza linalokusudiwa katika kishazi cha kusudi.
- source_word: παρακαλῶνται
  choice: watiwe moyo
  rationale: Katika muktadha wa kulijenga kusanyiko, tafsiri hii hubeba maana pana ya kutia moyo, bila kuondoa uwezekano wa kuonya au kufariji.
theological_decisions:
- issue: Upeo wa πάντες (“wote”) katika maagizo kwa kusanyiko
  choice: Imetafsiriwa “nyote” katika tukio la kwanza na “wote” katika matukio mawili yanayofuata, bila kuongeza “manabii wote” au kundi jingine maalumu.
  alternative: “manabii wote” katika tukio la kwanza, au “kila mtu” katika matukio yote
  rationale: Kigiriki kinarudia πάντες mara tatu lakini hakilitaji wazi kundi katika kila tukio. Tafsiri haifungi maana kwa kundi maalumu kuliko muktadha unavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, na marudio ya “wote” pamoja na utata wa maana ya παρακαλέω yamehifadhiwa kwa kadiri inayowezekana.
