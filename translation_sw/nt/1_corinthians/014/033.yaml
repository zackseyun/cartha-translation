base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: sw
  text: Kwa maana Mungu si Mungu wa machafuko, bali wa amani,[a] kama ilivyo katika makusanyiko yote ya watakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu si Mungu wa kutokuwa na utaratibu, bali wa amani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kama ilivyo katika makusanyiko yote ya watu watakatifu wa Mungu.” Wengine huiunganisha kauli hii na mstari unaofuata badala ya mstari huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: machafuko
  rationale: Neno hili linaonyesha hali ya kutokuwa na utaratibu katika ibada ya kusanyiko; “machafuko” ni la kawaida na lenye maana pana kuliko kuchanganyikiwa kwa akili pekee.
- source_word: εἰρήνης
  choice: amani
  rationale: Hili ndilo neno la kawaida la Kiswahili, na hapa linapingana na machafuko huku likidokeza hali ya utaratibu na upatano.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Kiswahili hutumia jina “Mungu” bila kuhitaji kibainishi; rejeo ni kwa Mungu mmoja anayejulikana.
- source_word: ὡς
  choice: kama ilivyo katika
  rationale: Kauli hii inaweka ulinganisho na hali au desturi katika makusanyiko yote, huku ikibaki na uhusiano wa karibu na sentensi iliyotangulia.
- source_word: ἐκκλησίαις
  choice: makusanyiko
  rationale: Katika muktadha huu neno linarejelea jumuiya za waamini wanaokusanyika; “makusanyiko” linaonyesha vizuri mazingira ya ibada yanayozungumziwa.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: “Watakatifu” huhifadhi istilahi ya kawaida ya Paulo kwa waamini na hadhi yake ya kiteolojia bila kuifafanua kupita kiasi.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya maagizo yaliyotangulia kuhusu utaratibu wa kusema katika kusanyiko.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Kauli imeunganishwa na mstari wa 33 kama ulinganisho na hali katika makusanyiko yote.
  alternative: Kauli inaweza kuunganishwa na mstari unaofuata na kuanza sentensi kuhusu mwenendo katika makusanyiko.
  rationale: Uakifishaji wa SBLGNT uliotolewa unaunga mkono kuiunganisha na mstari wa 33, lakini Kigiriki chenyewe kinaruhusu mjadala wa mahali pa kuiambatanisha; tanbihi inalinda utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kigiriki, lakini unatiririka kwa kawaida katika Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
