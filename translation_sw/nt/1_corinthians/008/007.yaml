id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: sw
  text: Lakini si kila mtu ana ujuzi huu. Wengine, kwa sababu ya mazoea yao kuhusiana na sanamu mpaka sasa[a], hula chakula kilichotolewa dhabihu kwa sanamu; na dhamiri yao, ikiwa dhaifu[b], huchafuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “kwa sababu ya desturi yao kuhusiana na sanamu mpaka sasa.” Kirai cha Kigiriki ni kigumu; maana yake yaelekea kuwa kwamba bado wanaathiriwa na uhusiano wao wa awali na ibada ya sanamu.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “dhamiri ya sanamu,” au zina tofauti nyingine zinazohusiana katika sehemu hii. Maandishi hapa yanafuata SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: ujuzi
  rationale: Neno hili linadumisha uhusiano na muktadha wa karibu kuhusu kujua kwamba sanamu si kitu, huku likieleweka kwa urahisi katika Kiswahili cha kawaida.
- source_word: συνήθεια
  choice: mazoea yao na sanamu
  rationale: Hapa linaonyesha uhusiano uliojengeka kwa muda na ibada ya sanamu, si desturi ya kawaida tu. Tafsiri hii pia inaacha ἕως ἄρτι ionekane wazi.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: na sanamu mpaka sasa
  rationale: Kirai hiki ni kigumu kisarufi na kina tofauti za maandishi; tafsiri inadumisha wazo la uhusiano au uzoefu wa sanamu unaoendelea mpaka wakati wa sasa bila kulifafanua kupita kiasi.
- source_word: εἰδωλόθυτον
  choice: chakula ... kimetolewa dhabihu kwa sanamu
  rationale: Hueleza wazi chakula kilichohusishwa na dhabihu kwa sanamu. Kauli ya 'wakikiona kuwa' inaonyesha namna walivyokichukulia, bila kudai kwamba sanamu ni miungu halisi.
- source_word: συνείδησις
  choice: dhamiri
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa utambuzi wa ndani wa maadili.
- source_word: ἀσθενής
  choice: dhaifu
  rationale: Linahifadhi istilahi ya Paulo katika sura hii kwa dhamiri isiyo na uthabiti katika jambo hili.
- source_word: μολύνεται
  choice: hutiwa unajisi
  rationale: Kauli tendwa inadumishwa, pamoja na uzito wa wazo la kuchafuliwa kimaadili.
theological_decisions:
- issue: Jinsi ya kueleza hali ya chakula cha dhabihu bila kudokeza kwamba sanamu ni miungu halisi
  choice: hula chakula hicho wakikiona kuwa kimetolewa dhabihu kwa sanamu
  alternative: hula chakula kilichotolewa dhabihu kwa sanamu
  rationale: 'Tafsiri iliyochaguliwa inaweka mkazo juu ya jinsi watu hao wanavyokiona chakula, na hivyo kuhifadhi mvutano wa hoja ya Paulo: sanamu si kitu, lakini maana ya kiibada wanayoihusisha na chakula inaweza kuichafua dhamiri dhaifu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku ugumu wa kirai cha Kigiriki na mvutano wa kiteolojia vikihifadhiwa kwa tanbihi.
