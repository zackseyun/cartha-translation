review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal contrast, the weak conscience, and its defilement. However, “mazoea yao na sanamu mpaka sasa” is syntactically strained in Swahili and does not clearly express that the ingrained association/habit concerns the idol. “Chakula hicho” introduces a demonstrative not present in the Greek. The textual-variant footnote inaccurately softens the reported variant: the relevant reading is “conscience of the idol,” not merely “conscience concerning the idol.”'
  naturalness: Several expressions are understandable but need refinement for Standard East African Swahili. “Mazoea yao kuhusiana na sanamu mpaka sasa” is idiomatic while retaining the source phrase’s difficult, open character. “Huchafuliwa” is a natural passive rendering for the present-tense moral defilement of conscience.
  terminology: “Ujuzi,” “dhamiri,” “dhaifu,” and “sanamu” are suitable. “Chakula kilichotolewa dhabihu kwa sanamu” is clear and appropriately preserves the cultic association without affirming that idols are gods. The alternative footnote should call the variant “dhamiri ya sanamu.”
  issues:
  - severity: medium
    issue: The phrase “mazoea yao na sanamu mpaka sasa” is unclear and unidiomatic.
    rationale: It leaves the relationship between mazoea and sanamu under-specified in a way that sounds unnatural, rather than preserving the Greek’s genuine syntactic difficulty.
  - severity: low
    issue: “Chakula hicho” adds a demonstrative reference.
    rationale: The Greek has εἰδωλόθυτον (“idol-sacrificed food”) without a demonstrative; omitting hicho is more exact.
  - severity: medium
    issue: Footnote b renders the variant imprecisely as “dhamiri kuhusu sanamu.”
    rationale: The variant reflected in the English audit trail is “conscience of the idol”; “dhamiri ya sanamu” should be stated, without interpreting it.
