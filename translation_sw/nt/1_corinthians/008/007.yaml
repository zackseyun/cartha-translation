- from: Lakini si kila mtu aliye na ujuzi huu. Wengine, kwa sababu ya mazoea yao na sanamu mpaka sasa[a], hula chakula hicho wakikiona kuwa kimetolewa dhabihu kwa sanamu; na dhamiri yao, kwa kuwa ni dhaifu[b], hutiwa unajisi.
  to: Lakini si kila mtu ana ujuzi huu. Wengine, kwa sababu ya mazoea yao kuhusiana na sanamu mpaka sasa[a], hula chakula kilichotolewa dhabihu kwa sanamu; na dhamiri yao, ikiwa dhaifu[b], huchafuliwa.
  rationale: Revisions make the difficult συνήθεια … ἕως ἄρτι τοῦ εἰδώλου phrase readable in natural Swahili without resolving its ambiguity beyond the contextual sense. They remove the unsupported demonstrative, retain the idiomatic sacrificial-food terminology, and correct the textual-variant footnote to describe the variant accurately and neutrally.
