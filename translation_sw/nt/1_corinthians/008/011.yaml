  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: sw
  text: Kwa maana yule aliye dhaifu anaangamia[a] kwa ujuzi wako—ndugu[b] ambaye Masihi alikufa kwa ajili yake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaangamizwa” au “anaharibiwa.” Neno la Kigiriki linaweza kueleza uharibifu au maangamizi makubwa; mstari hauweki wazi ikiwa ni madhara makubwa ya kiroho katika maisha ya sasa, maangamizi ya mwisho, au yote mawili.
    reason: alternative_reading
  - marker: b
    text: Hapa “ndugu” humaanisha mwamini mwenzako; katika matumizi inaweza kumhusu mwamini mwanamume au mwanamke.
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: Χριστός (Christos), yaani “Kristo”; limetafsiriwa “Masihi” hapa kwa sababu linatumika kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: anaangamizwa
  rationale: Kitenzi hiki kinaonyesha kuangamizwa au kupata uharibifu mkubwa. Tafsiri hii inahifadhi uzito wa neno bila kuamua kimya kimya kama Paulo anamaanisha uharibifu wa kiroho katika maisha ya sasa, maangamizi ya mwisho, au yote mawili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya onyo lililotangulia na kinasikika kwa kawaida katika Kiswahili cha Biblia.
- source_word: ὁ ἀσθενῶν
  choice: yule aliye dhaifu
  rationale: Kirai hiki kinamtaja mtu mmoja aliye dhaifu bila kuingiza neno ‘ndugu,’ ambalo linatokea baadaye katika mstari.
- source_word: ἐν τῇ σῇ γνώσει
  choice: kwa ujuzi wako
  rationale: Ingawa ἐν kwa msingi inaweza kuwa ‘katika,’ hapa inaonyesha njia au mazingira yanayosababisha madhara. ‘Kwa ujuzi wako’ ni ya asili na inahifadhi kejeli ya ujuzi unaotumiwa bila upendo.
- source_word: γνῶσις
  choice: ujuzi
  rationale: Neno hili linaendeleza istilahi ya Paulo katika muktadha wa karibu na kutofautisha ujuzi unaodaiwa na upendo unaopaswa kuongoza matumizi yake.
- source_word: ὁ ἀδελφός
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili kwa mwamini mwenzako. Kiswahili hakilazimishi jinsia katika neno hili, kwa hiyo tanbihi inaeleza matumizi yake katika muktadha.
- source_word: δι’ ὃν
  choice: ambaye ... kwa ajili yake
  rationale: Muundo huu unaonyesha kwamba huyo ndugu ndiye aliyelengwa na kifo cha Masihi kwa niaba yake.
- source_word: Χριστός
  choice: Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; ‘Masihi’ linaonyesha maana hiyo badala ya kulichukulia kama jina tu.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Wakati uliopita rahisi unawakilisha vizuri kitenzi cha aoristi na tukio la kifo cha Masihi.
theological_decisions:
- issue: Ikiwa ἀπόλλυται ina maana ya maangamizi ya mwisho ya milele au madhara makubwa ya kiroho
  choice: anaangamizwa
  alternative: anaangamia; anaharibiwa
  rationale: Neno la Kigiriki linaweza kumaanisha uharibifu au maangamizi makubwa, lakini mstari wenyewe hauamui wazi aina na upeo wa maangamizi hayo. Tafsiri kuu na tanbihi zinahifadhi mvutano huo.
- issue: Ikiwa ἀδελφός itafsiriwe kwa namna inayomtaja mwanamume pekee
  choice: ndugu
  alternative: mwamini mwenzako; ndugu wa kiume au wa kike
  rationale: Umbo la Kigiriki ni la kiume katika umoja, lakini ‘ndugu’ katika Kiswahili ni la kawaida na halibainishi jinsia. Tanbihi inaeleza kuwa hapa ni mwamini mwenzako na matumizi yanaweza kumhusu mwanamume au mwanamke.
- issue: Jinsi ya kutafsiri Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu Χριστός linaonyesha cheo cha Yesu na umuhimu wa kifo chake kwa ajili ya ndugu huyo; ‘Masihi’ linawasilisha wazi maana ya cheo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata kwa karibu msisitizo wa Kigiriki, huku vistari virefu vikimtambulisha tena aliye dhaifu kuwa ndiye ndugu ambaye Masihi alikufa kwa ajili yake.
