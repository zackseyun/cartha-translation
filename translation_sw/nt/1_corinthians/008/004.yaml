reference: 1 Corinthians 8:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: sw
  text: Basi, kuhusu kula vyakula vilivyotolewa kuwa dhabihu kwa sanamu, tunajua kwamba sanamu si kitu katika ulimwengu[a], na kwamba hakuna Mungu ila mmoja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu haina uhalisi wowote katika ulimwengu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hakuna mungu ila mmoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: kula
  rationale: Nomino hii inataja tendo la kula. Muundo wa kitenzi-jina ‘kuhusu kula’ ni wa kawaida katika Kiswahili na unahifadhi maana ya tendo badala ya kukifanya kifungu kimaanishe chakula pekee.
- source_word: εἰδωλοθύτων
  choice: vyakula vilivyotolewa dhabihu kwa sanamu
  rationale: Neno hili linahusu vitu vya kuliwa vilivyohusishwa na dhabihu kwa sanamu. ‘Vyakula’ huepuka kuifanya maana iwe nyama pekee.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Huhifadhi dai la Paulo la ujuzi unaoshirikishwa na wasomaji wake.
- source_word: οὐδὲν εἴδωλον
  choice: sanamu si kitu
  rationale: Huhifadhi usemi mfupi na wenye nguvu wa Kigiriki kuhusu ubatili au kutokuwa na uhalisi kwa sanamu, bila kuongeza ufafanuzi ndani ya matini.
- source_word: ἐν κόσμῳ
  choice: katika ulimwengu
  rationale: Ni tafsiri ya kawaida ya κόσμος hapa, ikitaja nyanja ya uhalisi ulioumbwa.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: hakuna Mungu ila mmoja
  rationale: Hutoa kwa uwazi dai la kwamba Mungu ni mmoja tu. Herufi kubwa katika ‘Mungu’ inaonyesha usomaji unaomrejelea Mungu wa kweli, huku mbadala wa ‘mungu’ ukihifadhiwa katika tanbihi.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ ni kiunganishi cha kawaida na chenye hadhi kinachoonyesha hitimisho au mpito unaotokana na hoja iliyotangulia.
theological_decisions:
- issue: Kauli ya Paulo kuhusu sanamu na Mungu mmoja
  choice: Kutafsiri kama dai thabiti kwamba sanamu haina uhalisi wa kiungu na kwamba Mungu ni mmoja tu
  alternative: Kutumia ‘mungu’ kwa herufi ndogo ili kusisitiza kwamba hakuna yeyote anayeitwa mungu isipokuwa mmoja
  rationale: Matini inaunganisha ubatili wa sanamu na umoja wa Mungu. Tafsiri kuu haisemi zaidi ya matini, na tanbihi huhifadhi uwezekano wa kusoma θεός kama jina la kawaida ‘mungu’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kula vyakula’ ni rahisi kueleweka, na ‘vilivyotolewa dhabihu’ hudumisha uhusiano wa chakula hicho na ibada ya sanamu bila kukifupisha kuwa nyama pekee.
