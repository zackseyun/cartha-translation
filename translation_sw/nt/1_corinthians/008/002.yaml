base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: sw
  text: Mtu yeyote akidhani kwamba anajua jambo fulani[a], bado hajajua jinsi anavyopaswa kujua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu yeyote akidhani kwamba amepata kujua jambo lolote, bado hajajua jinsi anavyopaswa kujua.”
    reason: Mbadala huu huonyesha kwa wazi zaidi hali ya kuwa amefikia maarifa inayoweza kudokezwa na ἐγνωκέναι, na hutafsiri τι kuwa “jambo lolote.”
lexical_decisions:
- source_word: εἴ τις
  choice: Kama mtu yeyote
  rationale: Huhifadhi sharti la moja kwa moja na maana ya jumla ya kiwakilishi kisichotaja mtu maalumu.
- source_word: δοκεῖ
  choice: anadhani
  rationale: Katika muktadha huu kitenzi kinaonyesha maoni ya mtu kuhusu hali yake mwenyewe, si kuonekana tu.
- source_word: ἐγνωκέναι τι
  choice: anajua jambo fulani
  rationale: Kauli hii ya kawaida ya Kiswahili huonyesha dai la kuwa na maarifa; tanbihi huhifadhi uwezekano wa kusisitiza hali iliyofikiwa ya kujua.
- source_word: οὔπω ἔγνω
  choice: bado hajajua
  rationale: Huhifadhi maana ya kutotimia bado na tofauti ya kimakusudi kati ya dai la kujua na upungufu wa kujua.
- source_word: καθὼς δεῖ γνῶναι
  choice: jinsi impasavyo kujua
  rationale: Huwasilisha namna au kiwango kinachotakiwa bila kufafanua zaidi ya Kigiriki.
theological_decisions:
- issue: Rejeo la jumla la τις
  choice: mtu yeyote ... anajua ... hajajua
  alternative: yeyote ... wanajua ... hawajajua
  rationale: Kiswahili hutumia ngeli ya mtu kwa maana ya jumla bila kuashiria kwamba anayelengwa ni mwanamume pekee, na hivyo huhifadhi umoja wa Kigiriki kwa kawaida.
- issue: Asili ya ukosoaji wa Paulo
  choice: bado hajajua jinsi impasavyo kujua
  alternative: hana maarifa yoyote
  rationale: Kauli inakemea kujiamini kupita kiasi na upungufu wa namna ya kujua; haikanushi kabisa uwezekano wa maarifa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Impasavyo” ni neno rasmi lakini linaeleweka kwa urahisi na linafaa kwa kauli fupi ya kimafundisho.
