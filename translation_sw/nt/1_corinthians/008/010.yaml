id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: sw
  text: Kwa maana, mtu akikuona wewe uliye na ujuzi umeketi kula katika hekalu la sanamu, je, kwa kuwa yeye ni dhaifu, dhamiri yake haitajengwa[a] ili ale vyakula vilivyotolewa dhabihu kwa sanamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itatiwa moyo” au “itahimizwa.” Kigiriki kinasema kihalisi “itajengwa,” huenda kwa kinaya, kwa kutumia lugha ya Paulo ya kujenga.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaunganisha swali hili na onyo lililotangulia kwa kutoa sababu au mfano unaolifafanua.
- source_word: ἐὰν ... ἴδῃ
  choice: mtu akikuona
  rationale: Muundo wa sharti la Kigiriki unaelezwa kwa kawaida katika Kiswahili kwa kiambishi cha masharti -ki-.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: wewe uliye na ujuzi
  rationale: Inadumisha msisitizo kwa mhusika anayejiona kuwa na ujuzi, huku ikitumia Kiswahili cha kawaida.
- source_word: γνῶσιν
  choice: ujuzi
  rationale: Neno hili linahifadhi kiungo cha kimsamiati na mjadala wa ‘ujuzi’ katika 1 Wakorintho 8.
- source_word: ἐν εἰδωλείῳ
  choice: katika hekalu la sanamu
  rationale: εἰδωλεῖον ni hekalu au mahali pa ibada panapohusishwa na sanamu.
- source_word: κατακείμενον
  choice: umeketi kula
  rationale: Kitenzi kinaonyesha mtu aliyekuwa ameegemea mezani wakati wa mlo; ‘umeketi kula’ huwasilisha mazingira hayo kwa Kiswahili cha sasa bila picha isiyoeleweka ya desturi ya kale.
- source_word: οὐχὶ
  choice: je ... haitajengwa
  rationale: Inahifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: dhamiri yake
  rationale: Ni tafsiri ya moja kwa moja ya dhamiri au ufahamu wa kimaadili wa mtu anayeona.
- source_word: ἀσθενοῦς ὄντος
  choice: kwa kuwa yeye ni dhaifu
  rationale: Inaweka udhaifu kwa mtu, kama muundo wa Kigiriki unavyoelekea kufanya, badala ya kuamua kimya kwamba dhamiri yenyewe ndiyo dhaifu.
- source_word: οἰκοδομηθήσεται
  choice: haitajengwa
  rationale: Inahifadhi picha halisi ya ‘kujengwa’ na matumizi yake ya kinaya katika muktadha huu, ambapo matokeo yake ni yenye kudhuru.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: ili ale vyakula vilivyotolewa dhabihu kwa sanamu
  rationale: Inaonyesha matokeo au mwelekeo wa ‘kujengwa’ huko na kutaja wazi chakula cha dhabihu kwa sanamu.
theological_decisions:
- issue: Maana ya οἰκοδομηθήσεται katika muktadha wa kuiga tendo lenye kudhuru
  choice: haitajengwa
  alternative: hatatiwa moyo / hatathubutu
  rationale: ‘Kujengwa’ ni lugha ya kawaida ya Paulo kuhusu uimarishaji, lakini hapa inaonekana kutumiwa kwa kinaya. Kuihifadhi kunaendeleza mvutano wa kimsamiati na wa balagha; maana ya kimuktadha inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Umeketi kula’ limetumiwa badala ya tafsiri ngumu ya desturi ya kale ya kuegemea mezani; ‘haitajengwa’ limehifadhiwa makusudi ili kinaya na lugha ya Paulo ya kujenga visipotee.
