id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: sw
  text: Kwa hiyo, ikiwa chakula kinamfanya ndugu yangu aanguke, hakika sitakula nyama kamwe, ili nisimfanye ndugu yangu aanguke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: chakula
  rationale: Neno hili lina maana pana ya chakula; linatofautishwa hapa na κρέα, yaani nyama.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: kinamfanya / nisimfanye ... aanguke
  rationale: Katika muktadha huu kitenzi kinamaanisha kumsababisha mwamini mwenzake atende kinyume cha dhamiri yake na hivyo aanguke kiroho; ‘aanguke’ huhifadhi sitiari ya Kigiriki kwa lugha ya kawaida.
- source_word: κρέα
  choice: nyama
  rationale: Hurejelea nyama, jambo mahususi ambalo Paulo anakataa kula kwa ajili ya ndugu yake.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: hakika ... kamwe
  rationale: Muundo οὐ μή ni uk否定 wenye nguvu, na εἰς τὸν αἰῶνα huimarisha wazo la kutokula wakati wowote; ‘hakika ... kamwe’ ni ya asili katika Kiswahili na huhifadhi msisitizo huo.
- source_word: ἀδελφόν
  choice: ndugu
  rationale: Huhifadhi istilahi ya kifamilia ambayo Paulo anatumia kwa mwamini mwenzake.
theological_decisions:
- issue: Maana ya kujikwaa au kuanguka
  choice: aanguke
  alternative: ajikwae
  rationale: ‘Aanguke’ hudokeza madhara halisi ya kiroho yanayotokana na tendo hilo bila kueleza kwa kupita kiasi namna kamili ya anguko; pia huhifadhi picha ya kitenzi σκανδαλίζω.
- issue: Upeo wa ahadi ya kutokula nyama
  choice: hakika sitakula nyama kamwe
  alternative: sitakula nyama milele
  rationale: Usemi wa Kigiriki una msisitizo mkali na upeo wa kudumu. ‘Kamwe’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kutoa hisia isiyo ya asili kwamba kula ni tendo linaloendelea milele.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa ‘ndugu yangu’ na wa wazo la kumfanya aanguke kwa sababu urudiaji huo ni sehemu ya msisitizo wa maandishi ya Kigiriki.
