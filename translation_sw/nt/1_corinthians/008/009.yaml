  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: sw
  text: Lakini jihadharini kwamba haki yenu hii isiwe kwa namna fulani kikwazo kwa walio dhaifu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhuru wenu huu.” Neno la Kigiriki linaweza kumaanisha “mamlaka,” “haki,” au “uhuru”; hapa linarejelea uhuru ambao baadhi ya waamini walidai kuwa nao wa kula chakula kilichohusishwa na sanamu.
    reason: lexical_alternative
  - marker: b
    text: “Walio dhaifu” hapa ni wale ambao dhamiri yao ni dhaifu katika jambo hili.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: jihadharini
  rationale: Kitenzi hiki ni agizo la kuwa macho dhidi ya hatari inayoweza kutokea; ‘jihadharini’ ni Kiswahili cha kawaida chenye nguvu inayofaa ya onyo.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko lenye utofautishaji wa kiasi kutoka hoja iliyotangulia kwenda kwenye onyo.
- source_word: μή πως
  choice: kwamba ... isiwe kwa namna fulani
  rationale: Muundo huu unatoa tahadhari dhidi ya uwezekano usiotakiwa; ‘kwa namna fulani’ huhifadhi wazo la πως bila kulifanya tokeo lionekane la hakika.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: haki yenu hii
  rationale: Katika muktadha, ἐξουσία ni haki au uhuru wanaodai wa kula chakula kinachohusishwa na sanamu. ‘Haki’ ni ya asili na mahususi, huku tanbihi ikihifadhi maana mbadala ya ‘uhuru.’
- source_word: πρόσκομμα
  choice: kikwazo
  rationale: Neno hili huhifadhi sitiari ya kitu kinachoweza kumfanya mwingine ajikwae au aanguke kimaadili au kiroho, na linaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: γένηται
  choice: isiwe
  rationale: Katika kishazi cha tahadhari hasi, ‘isiwe’ huwasilisha kwa kawaida maana ya ‘isije ikawa’ au ‘isiwe kwamba inakuwa.’
- source_word: τοῖς ἀσθενέσιν
  choice: kwa walio dhaifu
  rationale: Huhifadhi usemi mfupi wa Kigiriki bila kuongeza ‘dhamiri’ katika matini kuu; muktadha na tanbihi hufafanua udhaifu unaokusudiwa.
theological_decisions:
- issue: Maana ya ἐξουσία katika muktadha
  choice: Haki inayodaiwa kuhusu kula chakula kinachohusishwa na sanamu
  alternative: Mamlaka au uwezo kwa maana pana zaidi
  rationale: Muktadha wa 1 Wakorintho 8 unahusu uhuru wa waamini wenye ujuzi katika suala la vyakula vilivyotolewa kwa sanamu. ‘Haki’ huonyesha dai hilo bila kuingiza dhana ya mamlaka ya cheo.
- issue: Maana ya τοῖς ἀσθενέσιν
  choice: Waamini walio dhaifu katika dhamiri kuhusu jambo hili
  alternative: Watu walio dhaifu kwa maana ya jumla au kimwili
  rationale: Katika sura hii, udhaifu unahusishwa moja kwa moja na dhamiri. Matini kuu inabaki na usemi mfupi ‘walio dhaifu,’ na tanbihi inaeleza maana ya kimuktadha bila kuiongeza kimya kimya katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa onyo ni wa asili, sitiari ya ‘kikwazo’ imehifadhiwa, na maana za kimuktadha ambazo haziko wazi kabisa katika maneno ya mstari zimewekwa katika tanbihi.
