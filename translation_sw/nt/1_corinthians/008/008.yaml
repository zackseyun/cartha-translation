  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: sw
  text: Lakini chakula hakitatuleta mbele za Mungu[a]; kwa maana tukila, hatupati faida zaidi, wala tusipokula, hatupungukiwi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chakula hakitatufanya tukubalike mbele za Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, tukila hali yetu haiwi bora zaidi, na tusipokula hali yetu haiwi mbaya zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: chakula
  rationale: Ni neno pana linalomaanisha chakula kwa ujumla, si lazima nyama au mlo fulani.
- source_word: παραστήσει
  choice: kitatuleta mbele za
  rationale: Huhifadhi picha ya kuletwa au kusimamishwa mbele ya Mungu bila kuamua kimya kimya kwamba maana pekee ni kukubaliwa au kusogezwa karibu naye.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Kirai “mbele za Mungu” ni Kiswahili cha kawaida kinachoendana na kitenzi kilichotumiwa hapa.
- source_word: περισσεύομεν
  choice: hatupati faida zaidi
  rationale: Katika muktadha huu neno linaonyesha kuwa kula hakumpi mtu ziada au manufaa katika msimamo wake mbele za Mungu; tafsiri hii ni ya kawaida kuliko “hatuzidi.”
- source_word: ὑστερούμεθα
  choice: hatupungukiwi na chochote
  rationale: Huhifadhi wazo la kukosa au kuwa na upungufu na kuonyesha ulinganifu wake na kutopata faida zaidi.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti nyepesi na hoja iliyotangulia.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huanzisha maelezo yanayounga mkono kauli ya kwanza.
theological_decisions:
- issue: Je, chakula kinahusu kukubalika kidini mbele za Mungu au faida ya kiroho kwa ujumla?
  choice: Tafsiri inasema chakula hakimleti mtu mbele za Mungu na kula au kutokula hakumpi faida wala upungufu.
  alternative: “Chakula hakitatufanya tukubalike kwa Mungu” au “hakitatukaribisha kwa Mungu.”
  rationale: “Kitatuleta mbele za Mungu” inafuata picha ya παραστήσει na kuacha wazi kiwango ambacho kauli hiyo inahusu kukubalika, ukaribu, au msimamo mbele za Mungu; hivyo haibani mvutano wa kitheolojia wa muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “tukila ... wala tusipokula” huhifadhi ulinganifu wa masharti ya Kigiriki huku ukisomeka kwa urahisi.
