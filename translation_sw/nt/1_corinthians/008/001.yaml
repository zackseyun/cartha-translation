base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: sw
  text: 'Kuhusu vyakula vilivyotolewa dhabihu kwa sanamu[a]: tunajua kwamba sisi sote tuna maarifa[b]. Maarifa huleta majivuno, lakini upendo hujenga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyama iliyotolewa dhabihu kwa sanamu,” au “vitu vilivyotolewa dhabihu kwa sanamu.”
    reason: lexical_alternative
  - marker: b
    text: Huenda Paulo anarudia kauli ya Wakorintho aliposema, “sisi sote tuna maarifa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Hutanguliza mada mpya kwa njia ya kawaida na ya moja kwa moja, bila kuongeza neno la wakati lisilokuwapo wazi katika Kigiriki.
- source_word: τῶν εἰδωλοθύτων
  choice: vyakula vilivyotolewa dhabihu kwa sanamu
  rationale: Katika muktadha huu neno linahusu hasa vyakula vilivyotolewa katika ibada ya sanamu. ‘Vyakula’ ni pana kuliko ‘nyama’ na linaeleweka kwa urahisi.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi chenye maana ya wakati uliopo katika sentensi hii.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: kwamba sisi sote tuna ujuzi
  rationale: Huhifadhi dai la Kigiriki bila kulifafanua kama kauli ya Paulo mwenyewe au kama kauli mbiu ya Wakorintho.
- source_word: ἡ γνῶσις
  choice: Ujuzi
  rationale: Huhifadhi uhusiano wa kileksia na ‘ujuzi’ katika kishazi kilichotangulia na kuwasilisha nomino hiyo kwa maana ya jumla.
- source_word: φυσιοῖ
  choice: huleta majivuno
  rationale: Ni Kiswahili cha kawaida kinachowasilisha matokeo ya kujiona mkubwa yaliyomo katika taswira ya Kigiriki ya ‘kuvimbiwa,’ ingawa taswira yenyewe imewekwa kwa namna ya asili zaidi.
- source_word: ἡ δὲ ἀγάπη
  choice: lakini upendo
  rationale: ‘Lakini’ huonyesha utofautishaji, na ‘upendo’ ni tafsiri ya kawaida, wazi, na isiyoegemea dhehebu ya ἀγάπη.
- source_word: οἰκοδομεῖ
  choice: hujenga
  rationale: Huhifadhi sitiari ya ujenzi ya Paulo kwa Kiswahili rahisi na cha sasa, huku mtendewa akibaki kutajwa na muktadha kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Ikiwa ‘sisi sote tuna ujuzi’ ni dai la moja kwa moja la Paulo au mwangwi wa kauli ya Wakorintho
  choice: Kishazi kimeachwa bila alama za kunukuu katika matini kuu
  alternative: Kukiweka katika alama za kunukuu kama kauli mbiu ya Wakorintho
  rationale: Kigiriki hakina alama ya wazi ya kumtenga Paulo na dai hilo. Matini kuu inalinda utata huo, na tanbihi inaonyesha uwezekano wa kauli ya Wakorintho bila kuufanya kuwa hakika.
- issue: Maana ya sitiari φυσιοῖ katika kulinganisha ujuzi na upendo
  choice: huleta majivuno
  alternative: huvimbiisha
  rationale: Chaguo hili linaeleweka kwa wasomaji wa kawaida na huhifadhi hoja ya kiburi bila kutumia kitenzi kisicho cha kawaida au chenye utata katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa asili; tofauti kati ya ujuzi unaoleta majivuno na upendo unaojenga imehifadhiwa wazi.
