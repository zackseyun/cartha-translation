  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: sw
  text: Hivyo, mkiwakosea ndugu[a] kwa namna hii[b] na kuijeruhi dhamiri yao dhaifu, mnamkosea Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa ni waamini wenzao; katika muktadha huu neno hilo linaweza kujumuisha wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “Hivyo, kwa namna hii, mkiwakosea ndugu ...”
    reason: alternative_rendering
  - marker: c
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Basi ... kwa namna hii
  rationale: “Basi” huunganisha kauli hii na hoja iliyotangulia bila kudokeza upinzani mkali, na “kwa namna hii” hudumisha rejeo la οὕτως kwa mwenendo ulioelezwa kabla.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: mkiwatendea ndugu dhambi
  rationale: Muundo huu wa Kiswahili unaonyesha hali inayoambatana na kitendo kikuu na kuhifadhi maana ya kutenda dhambi dhidi ya watu. “Ndugu” ni tafsiri ya kawaida ya wingi wa ἀδελφός katika muktadha wa waamini.
- source_word: τύπτοντες
  choice: kuijeruhi
  rationale: Neno hili linahifadhi taswira hai ya kupiga na kusababisha jeraha, huku likitumika kwa njia ya asili kuhusu dhamiri katika Kiswahili.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: dhamiri yao iliyo dhaifu
  rationale: Umoja wa “dhamiri” na kiwakilishi cha wingi umehifadhiwa kama katika Kigiriki, na “iliyo dhaifu” huonyesha hali inayoendelea ya dhamiri bila kuifanya kuwa maelezo ya watu wenyewe.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: mnamtendea Masihi dhambi
  rationale: Muundo huu huhifadhi uelekeo wa dhambi dhidi ya Masihi na wakati wa sasa wa kitenzi. “Masihi” huonyesha wazi kwamba Χριστός ni cheo.
theological_decisions:
- issue: Maana ya ἀδελφοὺς katika jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini wenzenu
  rationale: Neno la Kigiriki ni la kiume kwa umbo, lakini katika muktadha huu linaweza kuwahusu waamini wenzao kwa ujumla. “Ndugu” ni neno la kawaida na lenye upana unaofaa katika Kiswahili; tanbihi inaweka maana hiyo wazi.
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Hapa cheo cha Mtiwa-Mafuta bado kina uzito wa maana. “Masihi” huhifadhi cheo hicho, huku “Kristo” ikiwekwa katika tanbihi kama namna nyingine iliyozoeleka.
- issue: Uhusiano kati ya dhambi dhidi ya waamini na dhambi dhidi ya Masihi
  choice: mkiwatendea ndugu dhambi ... mnamtendea Masihi dhambi
  alternative: mkifanya dhambi dhidi ya ndugu ... mnafanya dhambi dhidi ya Masihi
  rationale: Urudiaji wa “kutendea ... dhambi” hudumisha ulinganifu wa Kigiriki na msisitizo wa kitheolojia kwamba kumdhuru mwamini ni kumkosea Masihi, bila kueleza zaidi jinsi uhusiano huo unavyofanya kazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti wenye “mki-” unaonyesha vitenzi shirikishi vya Kigiriki kwa mtiririko wa asili, na sentensi inadumisha ulinganifu kati ya kuwatendea ndugu dhambi na kumtendea Masihi dhambi.
