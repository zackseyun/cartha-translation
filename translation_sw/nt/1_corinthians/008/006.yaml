reference: 1 Corinthians 8:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: sw
  text: Lakini kwetu sisi yuko Mungu mmoja, Baba, ambaye vitu vyote vinatokana naye, nasi kwa ajili yake; na Bwana mmoja, Yesu Masihi[a], ambaye vitu vyote vipo kwa njia yake, nasi kwa njia yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kuwa cheo, “Masihi,” au kutumiwa kama jina, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Maneno “vitu vyote vinatokana naye” na “vitu vyote vipo kwa njia yake” yanadumisha tofauti kati ya Baba kama chanzo na Yesu Masihi kama njia au mpatanishi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: lakini
  rationale: Inaonyesha utofauti na miungu na mabwana wanaoitwa hivyo katika muktadha uliotangulia.
- source_word: ἡμῖν
  choice: kwetu sisi
  rationale: Ni dativu ya mtazamo au rejeleo, ikionyesha ukiri wa waamini.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: Mungu mmoja, yaani Baba
  rationale: Inahifadhi dai la Mungu kuwa mmoja na kumtambulisha huyo Mungu kuwa Baba; ‘yaani’ linaonyesha uhusiano wa apposition bila kuongeza fundisho jipya.
- source_word: ἐξ οὗ τὰ πάντα
  choice: ambaye vitu vyote vinatoka kwake
  rationale: ἐξ huonyesha chanzo au asili; usemi huu wa Kiswahili ni wa asili na unadumisha upana wa τὰ πάντα.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: nasi tunaishi kwa ajili yake
  rationale: εἰς inaweza kuonyesha mwelekeo, lengo, au kusudi. Kitenzi ‘tunaishi’ kinakamilisha kifungu kilichoachwa bila kitenzi kwa Kiswahili cha kawaida, huku ‘kwa ajili yake’ kikionyesha Mungu kama lengo letu.
- source_word: καὶ εἷς κύριος
  choice: na kuna Bwana mmoja
  rationale: Inahifadhi ulinganifu na ‘Mungu mmoja’ pamoja na uzito wa κύριος kama cheo.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Masihi
  rationale: Χριστός hapa inafanya kazi vizuri kama cheo katika ukiri ‘Bwana mmoja, Yesu Masihi’; tanbihi inadumisha uwezekano wa ‘Kristo.’
- source_word: δι’ οὗ τὰ πάντα
  choice: ambaye vitu vyote vimekuja kupitia kwake
  rationale: διά pamoja na genitivi huonyesha njia au wakala. ‘Kupitia kwake’ inadumisha tofauti na ‘vinatoka kwake’; ‘vimekuja’ hukamilisha wazo kwa Kiswahili bila kulibana kuwa uumbaji pekee.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: nasi tunaishi kupitia kwake
  rationale: Kigiriki kina kifungu kifupi kisicho na kitenzi; ‘tunaishi’ ni ukamilishaji wa kawaida unaoweza kuhusisha kuwapo au uzima bila kuamua kwa undani zaidi.
theological_decisions:
- issue: Uhusiano wa ‘Mungu mmoja’ na ‘Bwana mmoja’ katika ukiri wa Mungu mmoja
  choice: 'Kudumisha ulinganifu: ‘Mungu mmoja, yaani Baba ... na ... Bwana mmoja, Yesu Masihi.’'
  alternative: Kupunguza uzito wa ‘Bwana’ au kuongeza maelezo ya moja kwa moja ya fundisho la Utatu.
  rationale: Kigiriki kinamtambulisha Baba na Yesu kwa namna tofauti lakini iliyo sambamba. Tafsiri haivunji ulinganifu huo wala kuingiza ufafanuzi wa kimadhehebu.
- issue: Mahusiano yanayoonyeshwa na vihusishi ἐξ, εἰς, na διά
  choice: Kutofautisha ‘vinatoka kwake,’ ‘kwa ajili yake,’ na ‘kupitia kwake.’
  alternative: Kutumia usemi mmoja unaofuta tofauti, au kutafsiri εἰς kuwa ‘kwake’ pekee.
  rationale: Tofauti hizi zinadumisha Baba kama chanzo na lengo, na Yesu Masihi kama mpatanishi au njia, bila kusema zaidi ya andiko.
- issue: Vitenzi vilivyoachwa katika καὶ ἡμεῖς εἰς αὐτόν na καὶ ἡμεῖς δι’ αὐτοῦ
  choice: Kutumia ‘tunaishi’ katika vifungu vyote viwili.
  alternative: Kuacha ‘nasi kwa ajili yake ... nasi kupitia kwake,’ au kutumia ‘tuliumbwa.’
  rationale: Kiswahili kinahitaji ukamilishaji wa wazi zaidi ili sentensi iwe ya kawaida. ‘Tunaishi’ inadumisha upeo unaoweza kujumuisha kuwapo na uzima, ilhali ‘tuliumbwa’ ingefunga maana kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa sentensi ya ukiri umedumishwa. ‘Kwetu sisi’ na ‘kuna’ huleta mtiririko wa kawaida; ‘vinatoka kwake’ na ‘kupitia kwake’ huhifadhi tofauti za vihusishi vya Kigiriki.
