  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: sw
  text: Kwa maana, hata kama wapo wanaoitwa miungu[a], iwe mbinguni au duniani—kama ilivyo kweli kwamba kuna miungu mingi na mabwana wengi[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wanaoitwa” linaweza pia kutafsiriwa “wanaodaiwa kuwa.” Katika muktadha, usemi huo haukubali kwamba hao ni miungu ya kweli.
    reason: lexical_alternative
  - marker: b
    text: “Mabwana” linatafsiri wingi wa neno lilelile la Kigiriki ambalo mara nyingi hutafsiriwa “Bwana.” Hapa linamaanisha viumbe au mamlaka nyingi ambazo watu huzitambua kwa cheo hicho, si Bwana mmoja wa mstari wa 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana, hata
  rationale: “Kwa maana” linaonyesha uhusiano wa maelezo na kauli iliyotangulia, na “hata” linahifadhi msisitizo wa καί kwa Kiswahili cha kawaida.
- source_word: εἴπερ
  choice: ikiwa
  rationale: Katika muktadha huu neno hili linaanzisha hali inayokubaliwa kwa ajili ya hoja bila kuthibitisha kwamba hao ni miungu ya kweli.
- source_word: λεγόμενοι θεοὶ
  choice: wanaoitwa miungu
  rationale: 'Tafsiri hii inahifadhi maana ya msingi ya kirai cha Kigiriki na pia utata wake halisi: wanaweza kuwa wale wanaopewa jina hilo, bila Paulo kukiri uungu wao.'
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: iwe mbinguni au duniani
  rationale: Huhifadhi jozi ya maeneo na upeo wa ulimwengu unaokusudiwa, kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: ὥσπερ
  choice: kama vile kweli
  rationale: 'Kirai hiki kinaonyesha uthibitisho wa jambo linalotambulika katika mazingira ya watu: wapo wengi wanaohesabiwa kuwa miungu na mabwana.'
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: wengi walio miungu na wengi walio mabwana
  rationale: Muundo huu unahifadhi urudiaji na ulinganifu wa Kigiriki huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: κύριοι
  choice: mabwana
  rationale: “Mabwana” huhifadhi uhusiano wa kileksia na κύριος huku muktadha na herufi ndogo vikionyesha kwamba hapa si rejeo kwa Bwana mmoja wa mstari wa 6.
theological_decisions:
- issue: Umbali wa Paulo wa kimatamshi kuhusu miungu ya kipagani
  choice: wanaoitwa miungu
  alternative: wanaodaiwa kuwa miungu
  rationale: “Wanaoitwa” hufuata kwa karibu λεγόμενοι na kuhifadhi uwezekano wa maana ya “called” pamoja na umbali unaotokana na muktadha, bila kuamua kwa nguvu zaidi ya sarufi yenyewe.
- issue: κύριοι katika tofauti kati ya watawala au viumbe wengi na Bwana mmoja
  choice: mabwana
  alternative: wakuu
  rationale: “Mabwana” huhifadhi istilahi inayolingana na “Bwana” katika mstari wa 6, huku wingi na muktadha vikitofautisha hawa na Bwana mmoja wa kweli.
- issue: Kauli kwamba wapo miungu wengi na mabwana wengi
  choice: kama vile kweli walivyo wengi walio miungu na wengi walio mabwana
  alternative: kwa kuwa kwa kweli kuna miungu mingi na mabwana wengi
  rationale: 'Muundo uliochaguliwa huhifadhi mvutano wa usemi: Paulo anakiri kwamba wengi huitwa au huhesabiwa hivyo katika ulimwengu wa watu, bila kuvunja dai la muktadha kwamba hakuna Mungu ila mmoja.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi na alama ya mkato mrefu huhifadhi hali ya kirai hiki kama sehemu ya hoja inayoendelea hadi mstari wa 6.
