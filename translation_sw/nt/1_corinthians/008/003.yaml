  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: sw
  text: Lakini mtu yeyote akimpenda Mungu, mtu huyo anajulikana naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anatambuliwa naye” au “amejulikana naye.” Njeo timilifu ya Kigiriki katika hali ya upokezi inaweza kudokeza hali inayoendelea ya kujulikana na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Lakini ... aki-
  rationale: Muundo huu unaonyesha sharti la εἰ na pia utofautishaji mpole wa δέ na hoja iliyotangulia.
- source_word: τις
  choice: mtu yeyote
  rationale: Huhifadhi maana ya jumla na jumuishi ya kiwakilishi kisichotaja mtu maalumu.
- source_word: ἀγαπᾷ
  choice: akimpenda
  rationale: Kitenzi hiki ni cha wakati uliopo na kinaeleza kumpenda Mungu; muundo wa masharti wa Kiswahili unaifanya sentensi iwe ya kawaida na wazi.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa θεός katika muktadha huu.
- source_word: οὗτος
  choice: mtu huyo
  rationale: Huhifadhi msisitizo wa kiwakilishi-onyeshi cha Kigiriki kwa kumrejelea wazi mtu aliyetajwa.
- source_word: ἔγνωσται
  choice: anajulikana
  rationale: Huhifadhi hali ya upokezi ya kitenzi na matokeo yanayoendelea ya njeo timilifu bila kuifanya maana iwe 'anakubaliwa' au 'anaokolewa.'
- source_word: ὑπ’ αὐτοῦ
  choice: naye
  rationale: Kiwakilishi hiki humrejelea Mungu kwa njia ya kawaida katika Kiswahili na huhifadhi mshikamano wa kiwakilishi wa Kigiriki.
theological_decisions:
- issue: Maana ya Mungu kumjua mtu katika kauli hii
  choice: anajulikana naye
  alternative: anatambuliwa naye; amejulikana naye
  rationale: γινώσκω Mungu akiwa mtendaji inaweza kudokeza uhusiano au utambuzi wa Mungu, si ufahamu wa habari tu. Tafsiri haibani maana hiyo kuwa kibali, agano, au wokovu pekee, hivyo inadumisha upana na mvutano wa kiteolojia wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “mtu” yametumiwa kimakusudi ili kuhifadhi msisitizo wa οὗτος, huku “naye” ikimrejelea Mungu bila kuongeza ufafanuzi usiokuwamo katika chanzo.
