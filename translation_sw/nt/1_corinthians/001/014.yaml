  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: sw
  text: Ninashukuru kwamba sikumbatiza yeyote kati yenu, isipokuwa Krispo na Gayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Ninamshukuru Mungu
  rationale: Kitenzi hiki kwa kawaida humaanisha kutoa shukrani; katika muktadha huu Mungu ndiye anayelengwa, kama inavyoonyeshwa pia na tofauti ya nakala. Kiswahili cha sasa huhitaji mtendewa atajwe ili usemi uwe wa kawaida.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa neno hili linatambulisha jambo ambalo Paulo analishukuru, hivyo “kwamba” ni la kawaida na wazi.
- source_word: οὐδένα ὑμῶν
  choice: yeyote kati yenu
  rationale: Pamoja na kikanushi “si-”, usemi huu unatoa maana ya kutombatiza hata mmoja miongoni mwa wasomaji.
- source_word: ἐβάπτισα
  choice: sikumbatiza
  rationale: “Batiza” ni istilahi ya kawaida ya Agano Jipya katika Kiswahili na haibani maana kwenye namna fulani ya ubatizo.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Muundo huu unaweka tofauti wazi baada ya kauli hasi.
- source_word: Κρίσπον
  choice: Krispo
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalolingana na matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: Γάϊον
  choice: Gayo
  rationale: Jina limetoholewa kwa umbo la kawaida katika Kiswahili.
theological_decisions:
- issue: Mtendewa wa shukrani katika εὐχαριστῶ
  choice: Mungu ametajwa wazi
  alternative: Ninashukuru kwamba…
  rationale: Ingawa maandishi yaliyotolewa yana εὐχαριστῶ bila mtendewa wazi, usemi wa Paulo wa kumshukuru Mungu ni wa kawaida na ushahidi wa nakala una tofauti inayomtaja Mungu. Kutaja “Mungu” kunafanya Kiswahili kiwe cha kawaida, lakini jambo hili linapaswa kubainishwa kwa tanbihi kwa sababu si dhahiri katika maandishi msingi yaliyotolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni fupi na ya moja kwa moja; majina yametoholewa kwa matumizi ya kawaida ya kibiblia.
