id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: sw
  text: 'Ndugu[a], ninawasihi kwa jina la Bwana wetu Yesu Masihi[b]: nyote mnene jambo lilelile, wala kusiwe na migawanyiko[c] miongoni mwenu, bali muunganishwe kabisa[d] katika mawazo yaleyale na msimamo uleule[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; neno la Kigiriki lililo katika wingi wa kiume linaweza kuielekea jumuiya yote ya waamini.
    reason: cultural_note
  - marker: b
    text: Kwa desturi, “Kristo.” “Masihi” maana yake Mpakwa mafuta.
    reason: lexical_alternative
  - marker: c
    text: Au, “mipasuko.”
    reason: lexical_alternative
  - marker: d
    text: Au, “mrekebishwe kabisa” au “mrudishwe katika hali ya kufaa pamoja.”
    reason: lexical_alternative
  - marker: e
    text: Au, “uamuzi uleule,” “maoni yaleyale,” au “kusudi lilelile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ninawasihi
  rationale: Kitenzi hiki hapa ni ombi la kichungaji lenye uzito, si amri kavu. “Ninawasihi” ni Kiswahili cha sasa na huhifadhi uzito wa wito wa Paulo.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: “Ndugu” ni namna ya kawaida na yenye heshima ya kuzungumzia waamini wenzake; inaweza kutumiwa kwa kundi zima, huku maelezo ya chini yakifafanua upeo wake katika muktadha huu.
- source_word: διὰ τοῦ ὀνόματος
  choice: kwa jina la
  rationale: Kirai hiki kinaonyesha msingi au mamlaka ya ombi. “Kwa jina la” ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος katika ungamo la Agano Jipya kuhusu mamlaka ya Yesu.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta. “Masihi” huhifadhi maana yake ya cheo, badala ya kukitumia tu kama jina lililonukuliwa.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: nyote mnene jambo lilelile
  rationale: Tafsiri hii huhifadhi picha halisi ya kusema jambo lilelile na haibadili kirai hicho moja kwa moja kuwa dhana pana ya kukubaliana.
- source_word: σχίσματα
  choice: migawanyiko
  rationale: “Migawanyiko” ni neno la wazi la Kiswahili kwa mipasuko ya kimahusiano ndani ya jumuiya.
- source_word: κατηρτισμένοι
  choice: muunganishwe kabisa
  rationale: Huhifadhi hali ya kutendewa iliyo katika Kigiriki na wazo la sehemu zilizotengana kurudishwa katika hali ya kufaa pamoja.
- source_word: νοῒ
  choice: mawazo
  rationale: “Mawazo” huwasilisha namna ya kufikiri na hutofautishwa kwa kiasi kinachofaa na γνώμη.
- source_word: γνώμῃ
  choice: msimamo
  rationale: Katika muktadha huu γνώμη linaweza kumaanisha hukumu, maoni, au azimio la pamoja. “Msimamo” ni wa kawaida na huhifadhi upana huo bila kuuchanganya kabisa na “mawazo”.
theological_decisions:
- issue: Tafsiri ya cheo cha Kikristo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” hutafsiri cheo na kudumisha maana ya Mtiwa-Mafuta. “Kristo” ni umbo la jadi linalotajwa katika maelezo ya chini.
- issue: Upeo wa ἀδελφοί kwa jinsia
  choice: Ndugu katika matini kuu, pamoja na ufafanuzi kwamba Paulo anaiambia jumuiya nzima
  alternative: ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki ni wingi wa kiume, lakini katika muktadha linaihusu jumuiya yote ya waamini. “Ndugu” ni la asili katika Kiswahili na maelezo yanaweka upeo huo wazi.
- issue: Maana ya umoja unaotakiwa
  choice: muunganishwe kabisa katika mawazo yaleyale na msimamo uleule
  alternative: muwe na umoja kamili katika nia moja na kusudi moja
  rationale: Chaguo kuu huhifadhi hali ya kutendewa ya κατηρτισμένοι na tofauti kati ya νοῦς na γνώμη bila kudai kwamba Paulo anafuta kila tofauti ya kibinafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na hoja ya Kigiriki, lakini mpangilio wa sentensi na msamiati umechaguliwa kwa ufasaha wa Kiswahili. Kiunganishi δέ hakijatafsiriwa kwa “sasa”; hapa kinaendeleza hoja bila kuonyesha wakati.
