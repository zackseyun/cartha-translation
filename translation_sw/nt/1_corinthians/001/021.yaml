id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: sw
  text: Kwa maana, kwa kuwa katika hekima ya Mungu ulimwengu haukumjua Mungu kwa hekima, ilimpendeza Mungu kuwaokoa wale wanaoamini kwa njia ya upumbavu wa ujumbe unaotangazwa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya upumbavu wa kuhubiri.”
    reason: alternative_reading
  - marker: b
    text: Yaani, upumbavu ambao ulimwengu huona katika ujumbe unaotangazwa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Kwa maana, kwa kuwa
  rationale: 'Huhifadhi kazi zote mbili: γάρ inaunganisha aya na hoja iliyotangulia, na ἐπειδή inaleta sababu au hali ya msingi.'
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: katika hekima ya Mungu
  rationale: Huhifadhi utata wa ἐν kuhusu ikiwa ni mazingira, mpango, au njia ya hekima ya Mungu bila kuamua maana moja kimyakimya.
- source_word: οὐκ ἔγνω
  choice: haukumjua
  rationale: Kitenzi “kumjua” huhifadhi upana wa maana ya γινώσκω, unaoweza kuhusisha utambuzi na uhusiano.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida na ya asili inayoweza kuwakilisha wanadamu katika utaratibu wao wa kidunia bila kuongeza ufafanuzi ndani ya matini.
- source_word: διὰ τῆς σοφίας
  choice: kwa njia ya hekima
  rationale: Huwasilisha διά pamoja na hali ya umilikishi kama njia au chombo, bila kuongeza kwamba hekima hiyo ni ya ulimwengu.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: Mungu alipendezwa
  rationale: Huhifadhi wazo la mapenzi mema ya Mungu badala ya kulifanya kuwa uamuzi wa kiakili tu.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: kwa njia ya kile kinachoonekana kuwa upumbavu katika ujumbe unaotangazwa
  rationale: '“Ujumbe unaotangazwa” huweka mkazo mkuu wa κήρυγμα kwenye yaliyotangazwa, huku “kinachoonekana kuwa” kikionyesha kejeli ya muktadha: ujumbe huo huhesabiwa kuwa upumbavu kwa viwango vya ulimwengu, si kwamba Mungu mwenyewe ni mpumbavu. Tanbihi huhifadhi uwezekano wa kuelewa tendo la kuhubiri.'
- source_word: σῶσαι
  choice: kuwaokoa
  rationale: “Kuokoa” ni neno la kawaida la Kiswahili linalohifadhi maana ya wokovu ya σῴζω.
- source_word: τοὺς πιστεύοντας
  choice: wale wanaoamini
  rationale: Huwasilisha kirai shiriki cha wakati wa sasa kwa Kiswahili cha kawaida bila kuingiza hitimisho la ziada la kimafundisho.
theological_decisions:
- issue: Maana ya διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Kimsingi inarejelea ujumbe unaotangazwa ambao ulimwengu huuhesabu kuwa upumbavu.
  alternative: Inaweza kurejelea upumbavu unaodhaniwa wa tendo au njia ya kuhubiri, au kujumuisha ujumbe na tendo kwa pamoja.
  rationale: κήρυγμα kwa kawaida huelekea kumaanisha yaliyotangazwa, lakini muundo na muktadha vinaweza pia kugusa tendo la kutangaza. Matini kuu inaweka ujumbe mbele, na tanbihi inalinda maana nyingine bila kuondoa mvutano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa “Kwa maana, kwa kuwa” ni rasmi kidogo lakini unahifadhi mtiririko wa hoja ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
