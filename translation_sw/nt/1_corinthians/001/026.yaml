  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: sw
  text: 'Maana, fikirieni wito wenu, ndugu[a]: si wengi kati yenu waliokuwa na hekima kwa kipimo cha kibinadamu, si wengi waliokuwa na nguvu, wala si wengi waliotoka katika koo mashuhuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “ndugu” linawahusu waamini wote katika kusanyiko, wanawake na wanaume.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: fikirieni
  rationale: Katika muktadha huu neno hilo linawahimiza wasomaji watafakari hali yao. “Fikirieni” ni Kiswahili cha kawaida kinachobeba nguvu hiyo ya kimahubiri, ingawa umbo la Kigiriki linaweza pia kueleweka kama taarifa, “mnaona.”
- source_word: κλῆσιν
  choice: wito
  rationale: “Wito” humaanisha mwito wa Mungu uliowafikia waamini na kuainisha hali yao, si kazi au nafasi yao ya kijamii.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni namna ya kawaida na yenye heshima ya kulihutubia kusanyiko lote katika Kiswahili; maelezo ya chini yanafafanua kuwa wanawake na wanaume wanahusishwa.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: si wengi kati yenu waliokuwa na hekima
  rationale: “Kati yenu” huweka wazi rejeo linalodokezwa na Kigiriki, huku “waliokuwa na hekima” ikihifadhi maelezo ya hali yao wakati walipoitwa.
- source_word: κατὰ σάρκα
  choice: kwa kipimo cha kibinadamu
  rationale: Hapa msemo huo unahusu tathmini ya kibinadamu, si mwili halisi wala moja kwa moja hali ya dhambi. Tafsiri hii huwasilisha maana hiyo bila kufuta tofauti kati ya kipimo cha binadamu na kile cha Mungu.
- source_word: δυνατοί
  choice: wenye nguvu
  rationale: “Wenye nguvu” huhifadhi upana wa neno la Kigiriki, ambalo katika muktadha linaweza kuhusisha uwezo, ushawishi, au mamlaka ya kijamii bila kuchagua aina moja tu.
- source_word: εὐγενεῖς
  choice: waliotoka katika koo mashuhuri
  rationale: Usemi huu unaeleza hadhi inayotokana na kuzaliwa na ukoo, badala ya kudokeza tu tabia njema au umaarufu wa mtu binafsi.
theological_decisions:
- issue: Je, κατὰ σάρκα itafsiriwe kihalisi kama “kwa jinsi ya mwili”?
  choice: kwa kipimo cha kibinadamu
  alternative: kwa jinsi ya mwili
  rationale: Katika orodha ya hekima, nguvu, na ukoo, msemo unaonyesha kipimo cha kawaida cha binadamu. Tafsiri ya kiidioma huepuka kueleweka vibaya kama rejeo la mwili wa nyama au fundisho maalumu kuhusu asili ya dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Uradidi wa “si wengi” umehifadhiwa kwa ajili ya mkazo wa balagha; “wala” huunganisha kipengele cha mwisho kwa mtiririko wa kawaida wa Kiswahili.
