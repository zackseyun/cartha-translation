  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: sw
  text: Neema na amani kutoka kwa Mungu Baba yetu na Bwana Yesu Masihi[a] ziwe kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Bwana Yesu Kristo.”'
    reason: Mbadala wa kileksika kwa Χριστός.
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Neno la kawaida na lenye uzito katika salamu za Paulo; linahifadhi maana ya fadhili inayotolewa na Mungu bila kuifanya kuwa ‘upendeleo’ tu.
- source_word: ὑμῖν
  choice: ziwe kwenu
  rationale: Dativi ya baraka katika salamu imewasilishwa kwa Kiswahili cha kawaida kwa kishazi ‘ziwe kwenu’; kitenzi kimeongezwa kwa sababu ya sarufi ya Kiswahili, bila kubadili maana.
- source_word: εἰρήνη
  choice: amani
  rationale: ‘Amani’ ni tafsiri ya kawaida inayohifadhi maana za utulivu, mahusiano mema, na ustawi bila kuzifafanua kupita kiasi.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Inaonyesha chanzo kwa uwazi na kwa Kiswahili cha asili.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: 'Inahifadhi uhusiano wa kiambatano katika Kigiriki: Mungu ndiye Baba yetu; haibadili muundo kuwa ‘Mungu wetu na Baba’.'
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος na inahifadhi uzito wake kama cheo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: ‘Masihi’ huwasilisha maana ya Χριστός kama cheo cha Mtiwa-Mafuta; tanbihi inatoa umbo la jadi ‘Kristo’.
theological_decisions:
- issue: Kudumisha kwamba neema na amani zinatoka kwa Baba na kwa Yesu kwa uhusiano mmoja wa chanzo.
  choice: Kirai kimoja ‘kutoka kwa’ kinatawala ‘Mungu Baba yetu na Bwana Yesu Masihi.’
  alternative: Kurudia ‘kutoka kwa’ kabla ya ‘Bwana Yesu Masihi.’
  rationale: Kigiriki kina kihusishi kimoja ἀπό kinachowaunganisha wote wawili kama chanzo; tafsiri inahifadhi uratibu huo bila kuongeza ufafanuzi wa kimafundisho.
- issue: Uwasilishaji wa Χριστός kama cheo au jina lililozoeleka.
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ hufanya maana ya cheo cha Χριστός ieleweke moja kwa moja, huku ‘Kristo’ likihifadhiwa katika tanbihi kama umbo la kawaida la mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio ‘Neema na amani ... ziwe kwenu’ ni wa asili katika salamu ya baraka; umehifadhi kirai kimoja cha chanzo na uratibu wa Baba na Bwana Yesu.
