id: 1CO.1.4
reference: 1 Corinthians 1:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: sw
  text: Namshukuru Mungu wangu daima kwa ajili yenu[a], kwa sababu ya neema ya Mungu mliyopewa katika Masihi Yesu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu ninyi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Namshukuru
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa kwa usemi wa kawaida wa Kiswahili unaoonyesha shukrani ya Paulo inayoendelea.
- source_word: τῷ θεῷ μου
  choice: Mungu wangu
  rationale: Muundo huu ni wa kawaida katika Kiswahili baada ya kitenzi “namshukuru,” huku ukihifadhi kiwakilishi cha umilikaji kilicho wazi katika Kigiriki.
- source_word: πάντοτε
  choice: daima
  rationale: “Daima” ni neno la heshima na la kawaida linalohifadhi maana pana ya wakati ya πάντοτε.
- source_word: περὶ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika kauli ya shukrani, usemi huu unaeleza kwamba waamini ndio wanaohusika katika shukrani ya Paulo; “kuhusu ninyi” limehifadhiwa kama badala halali katika tanbihi.
- source_word: ἐπὶ τῇ χάριτι
  choice: kwa sababu ya neema
  rationale: ἐπί pamoja na hali ya dative hapa inaonyesha msingi au sababu ya shukrani, jambo linaloelezwa wazi na kwa kawaida kwa “kwa sababu ya.”
- source_word: χάριτι τοῦ θεοῦ
  choice: neema ya Mungu
  rationale: “Neema” ni tafsiri iliyozoeleka na inayofaa kwa χάρις katika maandishi ya Paulo, na “ya Mungu” inahifadhi kwa upana uhusiano wa genitive bila kuamua kama ni umilikaji au chanzo pekee.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: mliyopewa
  rationale: Tafsiri hii inahifadhi hali ya kutendwa na inaacha Mungu aeleweke kutokana na muktadha kuwa ndiye mtoaji.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi upana wa ἐν, na “Masihi” huwasilisha maana ya cheo cha Χριστός badala ya kukifanya kuwa jina lisiloelezwa.
theological_decisions:
- issue: Uwasilishaji wa cheo Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi cheo cha Yesu na uhusiano wake na wazo la Mtiwa-Mafuta, huku “Kristo Yesu” likitajwa katika tanbihi kwa kuwa ni umbo lililozoeleka sana katika mapokeo ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kigiriki bila kuwa mgumu, na neno “katika” limeachwa na upana wake wa kimahusiano badala ya kufafanuliwa kupita kiasi.
