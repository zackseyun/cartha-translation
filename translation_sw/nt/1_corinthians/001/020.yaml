  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: sw
  text: Yuko wapi mwenye hekima?[a] Yuko wapi mwandishi? Yuko wapi mjadiliani wa enzi hii?[b] Je, Mungu hakuifanya hekima ya ulimwengu kuwa upumbavu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mwenye hekima.” Neno la Kigiriki liko katika umoja wa kiume, lakini yaelekea linawakilisha kundi zima.
    reason: lexical_alternative
  - marker: b
    text: “Enzi hii” hutafsiri neno tofauti la Kigiriki na “ulimwengu” linalotokea baadaye katika mstari huu.
    reason: cross_reference
  - marker: c
    text: Au, “Je, Mungu hakuonyesha kwamba hekima ya ulimwengu ni upumbavu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Yuko wapi
  rationale: Ni changamoto ya balagha inayorudiwa mara tatu; muundo huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: σοφός
  choice: mwenye hekima
  rationale: Huwakilisha mtu anayedaiwa au kutambuliwa kuwa na hekima, huku umoja wa Kigiriki ukihifadhiwa bila kulazimisha jinsia ya kiume.
- source_word: γραμματεύς
  choice: mwandishi
  rationale: Ni kisawe cha moja kwa moja cha kihistoria; ‘mtaalamu wa Sheria’ kingefafanua maana kwa namna nyembamba kuliko neno la Kigiriki katika muktadha huu.
- source_word: συζητητής
  choice: mwenye mijadala
  rationale: Hueleza mtu anayejihusisha na hoja na mabishano; ni ya kueleweka kwa wasomaji wa sasa bila kuongeza dharau isiyomo wazi katika neno lenyewe.
- source_word: τοῦ αἰῶνος τούτου
  choice: wa enzi hii
  rationale: ‘Enzi’ huhifadhi tofauti ya αἰών na κόσμος inayotokea baadaye katika mstari.
- source_word: οὐχὶ
  choice: Je, ... haku-
  rationale: 'Muundo huu wa swali la balagha unatarajia jibu la kukubali: ndiyo, Mungu amefanya hivyo.'
- source_word: ἐμώρανεν
  choice: hakuufanya ... kuwa upumbavu
  rationale: Huhifadhi nguvu ya kisababishi ya kitenzi, huku tanbihi ikitoa uwezekano wa maana ya kudhihirisha kuwa ni upumbavu.
- source_word: σοφίαν
  choice: hekima
  rationale: Ni tafsiri ya kawaida na inahifadhi mgongano wa kimakusudi kati ya hekima inayodaiwa na upumbavu.
- source_word: κόσμου
  choice: ulimwengu
  rationale: Hutofautishwa na ‘enzi’ kwa αἰών, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Kutofautisha αἰών na κόσμος katika mstari mmoja
  choice: αἰών imetafsiriwa ‘enzi,’ na κόσμος ‘ulimwengu.’
  alternative: Kutafsiri yote mawili kwa ‘ulimwengu.’
  rationale: Paulo ametumia maneno mawili tofauti. Kuyatofautisha huhifadhi mvutano kati ya enzi ya sasa na hekima ya ulimwengu bila kuyaunganisha kimyakimya.
- issue: Nguvu ya ἐμώρανεν
  choice: ‘kuifanya ... kuwa upumbavu’
  alternative: ‘kuonyesha ... kuwa upumbavu’
  rationale: Tafsiri kuu huhifadhi maana ya kisababishi iliyo wazi zaidi, lakini tanbihi inalinda uwezekano wa maana ya kudhihirisha au kufunua tabia yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya maswali yamehifadhiwa kwa nguvu ya balagha. ‘Mwandishi’ limetumiwa kwa maana ya kihistoria ya γραμματεύς; ‘mwenye mijadala’ limechaguliwa badala ya neno lenye dharau kali zaidi.
