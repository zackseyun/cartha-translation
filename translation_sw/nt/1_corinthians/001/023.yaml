  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: sw
  text: lakini sisi tunamhubiri Masihi aliyesulubiwa[a], kwa Wayahudi ni sababu ya kujikwaa, na kwa watu wa mataifa ni upumbavu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo aliyesulubiwa.”
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “mataifa”; hapa inaelekea kumaanisha watu wasio Wayahudi, kwa kuwa wanalinganishwa na Wayahudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: tunamhubiri
  rationale: Kitenzi hiki kinaonyesha kutangaza ujumbe hadharani; “tunamhubiri” ni cha kawaida na cha asili katika Kiswahili, huku kiambishi -m- kikimwelekeza msomaji kwa Masihi anayetangazwa.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo kinachotambulisha yule anayehubiriwa, kwa hiyo “Masihi” huhifadhi maana hiyo kuliko kuitumia tu kama jina.
- source_word: ἐσταυρωμένον
  choice: aliyesulubiwa
  rationale: Hali timilifu ya kitenzi katika kauli ya kutendwa inaonyesha Masihi ambaye alisulubiwa na anaendelea kutambulishwa kwa tukio hilo; “aliyesulubiwa” ni ya asili bila kuongeza ufafanuzi usio katika matini.
- source_word: Ἰουδαίοις
  choice: kwa Wayahudi
  rationale: Muktadha unaweka Wayahudi katika ulinganisho wa kikabila na kidini na watu wa mataifa, si wakazi wa eneo la Uyahudi tu.
- source_word: σκάνδαλον
  choice: sababu ya kujikwaa
  rationale: Usemi huu huhifadhi taswira ya kitu kinachomfanya mtu ajikwae, badala ya kuipunguza kuwa kukasirika au kuudhika tu.
- source_word: ἔθνεσιν
  choice: kwa watu wa mataifa
  rationale: Neno la Kigiriki kimsingi humaanisha “mataifa”; katika ulinganisho huu na Wayahudi linawarejelea watu wasio Wayahudi. Usemi huu huhifadhi maana zote mbili kwa Kiswahili cha asili.
- source_word: μωρίαν
  choice: upumbavu
  rationale: “Upumbavu” huonyesha jinsi ujumbe huo unavyohukumiwa na kundi hili na hudumisha uhusiano wa msamiati na hoja ya Paulo kuhusu hekima na upumbavu katika sura hii.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unasisitiza utambulisho na dai la kimasihi la yule anayehubiriwa. “Masihi” huiweka wazi kazi ya neno kama cheo, huku tanbihi ikihifadhi tafsiri ya jadi “Kristo.”
- issue: Nguvu ya ἐσταυρωμένον katika hali timilifu
  choice: aliyesulubiwa
  alternative: ambaye amesulubiwa
  rationale: “Aliyesulubiwa” ni usemi wa kawaida unaohifadhi tukio la kusulubiwa kama sifa kuu ya Masihi anayehubiriwa, bila kulazimisha tofauti ya wakati ambayo Kiswahili hakiihitaji hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi ulinganisho wa Kigiriki kati ya Wayahudi na watu wa mataifa, na alama zote za tanbihi zimewekwa katika matini kuu.
