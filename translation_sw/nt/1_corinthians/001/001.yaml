  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: sw
  text: Paulo, aliyeitwa kuwa mtume wa Masihi Yesu kwa mapenzi ya Mungu, na Sosthene ndugu yetu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: κλητὸς ἀπόστολος
  choice: aliyeitwa kuwa mtume
  rationale: Kiswahili cha kawaida huhitaji ‘kuwa’ ili kueleza kwa uwazi kwamba wito huo unahusu utume wa Paulo, bila kubadili maana ya kivumishi κλητός.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός imetafsiriwa kama cheo ‘Masihi,’ huku mpangilio wa maneno wa Kigiriki ukihifadhiwa.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Kirai hiki kinaeleza msingi au njia ya uteuzi wa Paulo na ni cha kawaida na cha asili katika Kiswahili.
- source_word: Σωσθένης
  choice: Sosthene
  rationale: Hili ni umbo la jina linalofaa kwa matamshi na matumizi ya Kiswahili.
- source_word: ὁ ἀδελφὸς
  choice: ndugu yetu
  rationale: Ingawa Kigiriki kinasema kihalisi ‘ndugu,’ katika salamu ya barua kirai hiki humtambulisha Sosthene kama ndugu wa waamini; ‘yetu’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kudai udugu wa damu.
theological_decisions:
- issue: Tafsiri ya Χριστός katika salamu ya Paulo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Hapa Χριστός linamtambulisha Yesu kwa cheo chake cha Kimasihi; ‘Masihi’ huweka maana ya cheo wazi badala ya kulifanya lionekane kama jina la pili.
- issue: Asili ya utume wa Paulo
  choice: aliyeitwa kuwa mtume
  alternative: mtume aliyeitwa
  rationale: Uundaji huu unahifadhi kwamba Paulo ni mtume kwa wito, huku ‘kwa mapenzi ya Mungu’ ikibaki kueleza chanzo cha wito huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imeachwa ikiendelea kwa koma kwa sababu mstari huu ni mwanzo wa salamu inayokamilishwa katika mstari unaofuata.
