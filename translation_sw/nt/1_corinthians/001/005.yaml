  text: kwa sababu ndani yake mmetajirishwa kwa kila namna, katika usemi wote na maarifa yote,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu, kishazi kinaeleza sababu ya shukrani ya Paulo katika mstari uliotangulia; kwa hiyo maana ya sababu inafaa kuliko ‘kwamba’.
- source_word: ἐν παντὶ
  choice: kwa kila namna
  rationale: Usemi huu mpana unaonyesha utajirishwaji wa kila aina; ‘kwa kila namna’ ni Kiswahili cha kawaida na huandaa mifano miwili inayofuata.
- source_word: ἐπλουτίσθητε
  choice: mmetajirishwa
  rationale: Kauli tendwa huhifadhi wazo kwamba Wakorintho walipokea utajiri huo kutoka kwa mwingine, huku sitiari ya utajiri ikibaki wazi.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi maana ya kuwa katika nyanja au muungano na Kristo, badala ya kuibadili kimya kuwa ‘kwa njia yake’ au ‘naye’.
- source_word: ἐν παντὶ λόγῳ
  choice: katika kusema kote
  rationale: Katika ulinganifu wake na γνώσει, λόγῳ yaelekea kumaanisha uwezo au namna ya kujieleza kwa maneno. ‘Kusema kote’ ni wazi zaidi kwa wasomaji wa sasa kuliko ‘usemi wote’, huku ikihifadhi upana wa πᾶς.
- source_word: πάσῃ γνώσει
  choice: katika maarifa yote
  rationale: ‘Maarifa’ huwasilisha γνώσις kwa maana pana na hudumisha ulinganifu wa kisarufi na kishazi kinachotangulia.
theological_decisions:
- issue: Maana ya ἐν αὐτῷ
  choice: ndani yake
  alternative: kwa njia yake
  rationale: Tafsiri haipaswi kuamua kwamba ἐν hapa inaonyesha chombo pekee; ‘ndani yake’ huhifadhi lugha ya Paulo ya kuwa katika Kristo na uwezekano wa maana ya nyanja au muungano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na urudiaji wa ‘kila/yote’ huhifadhi msisitizo na ulinganifu wa Kigiriki bila kuwa wa kigeni kupita kiasi.
