  text: 'ili, kama ilivyoandikwa: “Yeyote anayejisifu, na ajisifu katika Bwana.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ili iwe
  rationale: Inaendeleza kusudi au matokeo yanayotokana na mstari uliotangulia; Kiswahili hiki ni cha kawaida na kinaunganisha sentensi kwa uwazi.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni fomula ya kawaida ya Kiswahili ya kutambulisha nukuu ya Maandiko, huku ikihifadhi maana ya ulinganifu na hali endelevu ya yaliyoandikwa.
- source_word: Ὁ καυχώμενος
  choice: Yeyote anayejisifu
  rationale: Kishiriki chenye kibainishi kinaeleza mtu yeyote mwenye kujisifu; muundo huu ni wa asili na unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Inahifadhi kihusishi ἐν na neno κύριος bila kubadili kimya kimya uhusiano wake kuwa ‘kuhusu’; ‘Bwana’ ni tafsiri ya kawaida na yenye hadhi.
- source_word: καυχάσθω
  choice: na ajisifu
  rationale: Muundo wa ‘na’ pamoja na hali ya utegemezi huwasilisha amri au himizo la nafsi ya tatu kwa Kiswahili cha asili bila kulazimisha maana ya ulazima kuliko ilivyo katika Kigiriki.
theological_decisions:
- issue: Nguvu ya amri katika καυχάσθω
  choice: na ajisifu
  alternative: lazima ajisifu
  rationale: Kigiriki kina amri ya nafsi ya tatu. ‘Na ajisifu’ huhifadhi amri/himizo hilo, ilhali ‘lazima’ lingeweza kusisitiza wajibu kwa namna iliyo kali zaidi.
- issue: Maana ya ἐν κυρίῳ
  choice: katika Bwana
  alternative: kuhusu Bwana
  rationale: ‘Katika Bwana’ huhifadhi kwa makusudi upana na mvutano wa usemi wa Paulo—Bwana akiwa msingi, eneo, au mlengwa wa kujisifu—badala ya kuufanya uwe maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Nukuu imeundwa kwa mtindo wa Maandiko usio wa kizamani. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya Kiingereza kati ya ‘the one who’ na ‘whoever’ inaunganishwa kiasili katika ‘yeyote’ kwa Kiswahili.
