  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: sw
  text: Kwa maana ujumbe[a] wa msalaba ni upumbavu kwa wale wanaoangamia, lakini kwetu sisi tunaookolewa[b] ni nguvu ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno la msalaba.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “sisi tunaookolewa”; usemi huu unaonyesha wokovu hapa kama jambo linaloendelea.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ujumbe
  rationale: Katika muktadha huu neno hili linamaanisha yaliyomo katika habari inayotangazwa kuhusu msalaba, si neno moja tu. “Ujumbe” ni Kiswahili cha kawaida na cha wazi; “neno” limehifadhiwa katika tanbihi kama tafsiri ya karibu zaidi na muundo wa Kigiriki.
- source_word: σταυροῦ
  choice: msalaba
  rationale: Tafsiri ya moja kwa moja inayohifadhi usemi mfupi wa Paulo na inaweza pia kurejelea kifo cha Kristo msalabani.
- source_word: ἀπολλυμένοις
  choice: wale wanaoangamia
  rationale: Huhifadhi hali inayoendelea inayoonyeshwa na kitenzi-shirikishi cha wakati wa sasa. “Waliopotea” ingedhoofisha kipengele hicho, na “wanaoharibiwa” si ya kawaida sana katika muktadha huu.
- source_word: μωρία
  choice: upumbavu
  rationale: Ni neno la kawaida na lenye nguvu linalowasilisha wazi tathmini ya ujumbe huo kuwa jambo la kipumbavu, sambamba na tofauti inayofuata kuhusu nguvu ya Mungu.
- source_word: σῳζομένοις
  choice: sisi tunaookolewa
  rationale: Huhifadhi hali au tendo la wokovu linaloendelea katika kitenzi-shirikishi cha wakati wa sasa na pia huhifadhi ἡμῖν, yaani “kwetu sisi.”
- source_word: δύναμις θεοῦ
  choice: nguvu ya Mungu
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuhifadhi uzito wa kauli kwamba ujumbe wa msalaba ni nguvu ya Mungu.
theological_decisions:
- issue: Kipengele cha wokovu katika σῳζομένοις
  choice: sisi tunaookolewa
  alternative: sisi tuliookolewa / sisi waliookoka
  rationale: Kitenzi-shirikishi cha wakati wa sasa kwa kawaida huonyesha hali au tendo linaloendelea. Tafsiri hii hailazimishi wokovu kuwa tukio la wakati uliopita pekee, bali huhifadhi mvutano wa usemi wa Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “kwetu sisi tunaookolewa” huhifadhi msisitizo wa Kigiriki huku ukiendelea kuwa wa kawaida katika Kiswahili.
