  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: sw
  text: Kwa maana upumbavu wa Mungu una hekima kuliko wanadamu, na udhaifu wa Mungu una nguvu kuliko wanadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” ni cha kawaida na chenye hadhi katika muktadha huu.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: upumbavu wa Mungu
  rationale: Muundo wa nomino umehifadhiwa ili kudumisha usemi wa makusudi wenye mshtuko na kejeli; hauonyeshi kwamba Mungu kwa kweli ni mpumbavu.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: una hekima kuliko wanadamu
  rationale: Ulinganisho umeelezwa kwa Kiswahili cha asili. “Wanadamu” inawakilisha ἀνθρώπων kwa ujumla bila kuuweka kwa wanaume pekee.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: udhaifu wa Mungu
  rationale: Muundo sambamba na kishazi cha kwanza umehifadhiwa, pamoja na mvutano wa kitheolojia wa usemi huo.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: una nguvu kuliko wanadamu
  rationale: Hutoa ulinganisho wa moja kwa moja na wa kawaida, huku ukihifadhi usambamba wa sentensi.
theological_decisions:
- issue: Je, semi “upumbavu wa Mungu” na “udhaifu wa Mungu” zifafanuliwe ili kuepuka kudokeza sifa halisi za Mungu?
  choice: Zimehifadhiwa moja kwa moja kama “upumbavu wa Mungu” na “udhaifu wa Mungu.”
  alternative: “Kile kinachoonekana kuwa upumbavu wa Mungu” na “kile kinachoonekana kuwa udhaifu wa Mungu.”
  rationale: Kigiriki hakina neno linalomaanisha “kinachoonekana.” Kuongeza ufafanuzi huo kungepunguza mvutano wa balagha ambao Paulo ameuweka kwa makusudi; muktadha unaonyesha kwamba maneno hayo ni ya kulinganisha na yenye kejeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa vipashio viwili umehifadhiwa, na “wanadamu” limetumiwa kwa maana jumuishi ya watu.
