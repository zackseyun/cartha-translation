  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: sw
  text: Mungu ni mwaminifu; kupitia kwake mliitwa kuwa na ushirika[a] na Mwana wake, Yesu, Masihi, Bwana wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ushirika” hapa unaweza pia kumaanisha kushiriki pamoja au kuwa na sehemu pamoja na Mwana wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Kivumishi hiki kinamweleza Mungu kuwa mwenye kutegemewa na asiyekosa kutimiza ahadi zake; “mwaminifu” ni neno la kawaida, lenye heshima, na linalobeba maana hiyo vizuri.
- source_word: δι’ οὗ
  choice: kwa njia yake
  rationale: διά pamoja na jenitivi huonyesha njia au wakala. “Kwa njia yake” hufuata muundo wa Kigiriki na kuhifadhi uwezekano wa kuelewa Mungu kuwa ndiye aliyetenda mwito huo.
- source_word: ἐκλήθητε
  choice: mliitwa
  rationale: Huhifadhi hali ya kutendwa na maana ya kawaida ya kaλέω katika Paulo bila kuibadili kuwa mwaliko tu.
- source_word: κοινωνίαν
  choice: ushirika
  rationale: “Ushirika” ni Kiswahili cha kawaida kinachoweza kujumuisha uhusiano, kushiriki pamoja, na kuwa na sehemu katika jambo fulani.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: na Mwana wake
  rationale: Jenitivi inayotegemea κοινωνίαν inaelezwa kwa Kiswahili cha kawaida kama ushirika “na” mtu; herufi kubwa katika “Mwana” inasaidia kutambua cheo hiki katika muktadha.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Ἰησοῦ ni jina, na Χριστοῦ hapa hubeba cheo cha Masihi. Kiswahili cha kawaida hakihitaji kuongeza kiunganishi au kibainishi kati ya jina na cheo katika muundo “Yesu Masihi.”
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida na lenye heshima kwa κύριος, na linahifadhi cheo cha Kikristo katika kifungu hiki.
theological_decisions:
- issue: Ikiwa Χριστοῦ itafsiriwe kama cheo au ibaki katika umbo la jadi “Kristo.”
  choice: Masihi
  alternative: Kristo
  rationale: Katika mfuatano huu Χριστός bado hutambulisha cheo cha Yesu. “Masihi” hutafsiri maana ya cheo hicho badala ya kukinakili tu, bila kuongeza fundisho la dhehebu.
- issue: Aina ya ushirika unaomaanishwa na κοινωνίαν τοῦ υἱοῦ αὐτοῦ.
  choice: ushirika na Mwana wake
  alternative: kushiriki katika Mwana wake
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi upande wa uhusiano, huku tanbihi ikitaja wazi maana ya kushiriki ili kutofunga upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Nukta mkato hutenganisha tamko la uaminifu wa Mungu na tendo lake la kuwaita waumini. Muundo wa Kigiriki “kwa njia yake” umehifadhiwa bila kulazimisha tofauti kati ya njia na wakala.
