    issue: “vitu ambavyo si kitu” over-interprets τὰ μὴ ὄντα.
    rationale: It means “things that are not a thing/nothing,” whereas the Greek’s “the things that are not” is intentionally broader. “Vitu ambavyo haviko” preserves the rhetorical and semantic tension.
  - severity: low
