  source_fidelity: The draft begins to reflect the social-status sense of ἀγενῆ and the contempt in ἐξουθενημένα, but it renders τὰ μὴ ὄντα as “vitu ambavyo si kitu,” which narrows the deliberately provocative Greek contrast, and it is truncated and corrupted after “avibatil…”. The revision restores the full balanced contrast and the purpose clause.
  naturalness: “Vitu vya ulimwengu visivyo na hadhi” is clear, modern Standard East African Swahili for things without noble standing. “Vitu ambavyo haviko / vitu vilivyoko” is natural enough in this rhetorical, formal context and preserves Paul’s parallelism.
  terminology: “Alichagua” accurately renders ἐξελέξατο; “vilivyodharauliwa” renders ἐξουθενημένα; and “avibatilishe” appropriately conveys καταργήσῃ without implying literal destruction.
