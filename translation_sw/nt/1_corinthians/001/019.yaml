  text: 'Kwa maana imeandikwa:


    “Nitaangamiza hekima ya wenye hekima,

    na nitaweka kando ufahamu wa wenye akili[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitaukataa / nitaufanya kuwa batili ufahamu wa wenye utambuzi.”
    reason: ἀθετήσω inaweza kumaanisha kukataa, kubatilisha, au kuweka kando; συνετῶν pia inaweza kutafsiriwa “wenye utambuzi.”
lexical_decisions:
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutambulisha nukuu ya Maandiko, huku ukihifadhi maana ya hali inayoendelea kutokana na tendo lililokamilika.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba nukuu hii ndiyo msingi au maelezo ya kauli iliyotangulia.
- source_word: Ἀπολῶ
  choice: Nitaangamiza
  rationale: Inawasilisha kwa uwazi nguvu ya ἀπόλλυμι, yaani kuharibu au kuondoa kabisa, bila kuongeza ufafanuzi wa kiteolojia.
- source_word: σοφίαν τῶν σοφῶν
  choice: hekima ya wenye hekima
  rationale: Inadumisha urudiaji wa mzizi wa maneno na nguvu ya kisanaa ya usemi wa Kigiriki.
- source_word: σύνεσιν τῶν συνετῶν
  choice: ufahamu wa wenye akili
  rationale: ‘Ufahamu’ hueleza uwezo wa kuelewa au kutambua, na ‘wenye akili’ ni usemi wa kawaida unaodumisha ulinganifu na ‘wenye hekima.’
- source_word: ἀθετήσω
  choice: nitaweka kando
  rationale: Inadumisha maana ya kukataa, kubatilisha, au kufanya kitu kisitumike, kwa lugha inayoeleweka na bila kuifanya kuwa kali kuliko Kigiriki.
theological_decisions:
- issue: Jinsi ya kuwasilisha hatua ya Mungu dhidi ya hekima na ufahamu wa kibinadamu katika nukuu ya Isaya
  choice: Kutumia vitenzi vya wakati ujao ‘nitaangamiza’ na ‘nitaweka kando’
  alternative: Kutumia ‘nitabatilisha,’ ‘nitakataa,’ au ‘nitafanya kuwa bure’
  rationale: Vitenzi vya wakati ujao vinadumisha muundo wa Kigiriki na nguvu ya nukuu, huku ‘nitaweka kando’ ikiacha wazi upana wa maana ya ἀθετέω bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha ulinganifu wa kishairi wa nukuu.
