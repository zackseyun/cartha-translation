  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: sw
  text: Ambaye pia atawaweka imara mpaka mwisho[a], mkiwa bila lawama[b] katika siku ya Bwana wetu Yesu Masihi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘atawathibitisha’ au ‘atawaimarisha.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘msiwe na shtaka’ au ‘msiwe na jambo la kulaumiwa.’
    reason: lexical_alternative
  - marker: c
    text: Au ‘Kristo.’ Neno la Kigiriki Christos linamaanisha ‘Masihi’ au ‘Mtiwa-Mafuta.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: atawaweka imara
  rationale: Kitenzi hiki humaanisha kumfanya mtu awe thabiti au salama. ‘Atawaweka imara’ ni Kiswahili cha kawaida kinachohifadhi wazo la kuwathibitisha na kuwaimarisha.
- source_word: ἕως τέλους
  choice: mpaka mwisho
  rationale: Kirai hiki kinaonyesha kudumu hadi mwisho, unaoeleweka hapa kwa muktadha wa siku ya Bwana.
- source_word: ἀνεγκλήτους
  choice: bila lawama
  rationale: Neno hili humaanisha kutokuwa na shtaka linaloweza kuletwa dhidi ya mtu. ‘Bila lawama’ ni fupi na ya kawaida, huku kidokezo kikihifadhi maana ya kisheria.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: katika siku
  rationale: Huhifadhi nahau ya kibiblia inayorejelea siku ya mwisho ya hukumu na udhihirisho wa Bwana.
- source_word: κυρίου
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida na lenye hadhi linalofaa cheo hiki katika Agano Jipya.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya ‘Mtiwa-Mafuta.’ ‘Masihi’ huhifadhi maana ya cheo hicho badala ya kukifanya kionekane kama jina la ukoo.
theological_decisions:
- issue: Rejeleo la ὃς (‘ambaye’)
  choice: ‘Ambaye’ linaelekezwa kwa Bwana wetu Yesu Masihi aliyetajwa mwishoni mwa mstari wa 7.
  alternative: Kiwakilishi hicho kinaweza kuelekezwa kwa upana zaidi kwa Mungu aliyetajwa mapema katika muktadha.
  rationale: Kisintaksia, nomino ya karibu zaidi inayofaa ni ‘Bwana wetu Yesu Masihi.’ Kiswahili ‘ambaye’ kinafuata muundo huo bila kuongeza jina ambalo halipo katika mstari huu.
- issue: Uhusiano wa ἀνεγκλήτους na kitenzi
  choice: ‘mkiwa bila lawama’
  alternative: ‘ili msiwe na lawama’
  rationale: Uundaji wa ‘mkiwa’ unaonyesha hali ya waamini katika siku ya Bwana bila kuingiza wazi maana ya kusudi au matokeo ambayo haijaonyeshwa na kiunganishi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mpaka mwisho’ ni ya asili kuliko uundaji wa neno kwa neno, na ‘mkiwa bila lawama’ huhifadhi uhusiano wa kisarufi bila kuongeza kusudi lisilotajwa wazi.
