source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: sw
  text: Lakini ni kutoka kwake ninyi mko katika Masihi Yesu, ambaye alifanyika kwetu hekima kutoka kwa Mungu, na haki[a], na utakaso, na ukombozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu.”
    reason: Njia nyingine ya kutafsiri δικαιοσύνη kulingana na mkazo wa kuwa sawa au kutenda yaliyo sawa.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: kutokana naye
  rationale: 'Huhifadhi wazo la chanzo au asili: hali ya waamini kuwa katika Masihi Yesu inatokana na Mungu.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Neno “katika” linadumisha lugha ya Paulo ya kuwa katika Masihi bila kuifafanua kupita kiasi; “Masihi” linaonyesha maana ya cheo Χριστός.
- source_word: ἐγενήθη
  choice: alifanyika
  rationale: Ni tafsiri ya moja kwa moja ya wazo la kuja kuwa kitu fulani kwa ajili ya wengine, huku ikidokeza tendo la Mungu bila kuongeza maneno yasiyokuwapo.
- source_word: σοφία
  choice: hekima
  rationale: Ni neno la kawaida na sahihi katika muktadha wa tofauti kati ya hekima ya Mungu na hekima ya ulimwengu.
- source_word: ἀπὸ θεοῦ
  choice: kutoka kwa Mungu
  rationale: Huhifadhi wazi maana ya chanzo bila kuamua kimya-kimya ikiwa kirai hiki kinahusiana na “hekima” pekee au pia na nomino zinazofuata.
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili linaloweza kubeba maana ya hali iliyo sawa mbele za Mungu; maana mbadala ya “uadilifu” imeonyeshwa katika tanbihi.
- source_word: ἁγιασμός
  choice: utakaso
  rationale: Huwasilisha tendo au hali ya kufanywa watakatifu kwa lugha ya sasa bila kulifanya neno kuwa “utakatifu” wa kimaadili pekee.
- source_word: ἀπολύτρωσις
  choice: ukombozi
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa kuachiliwa au kuwekwa huru kwa gharama.
theological_decisions:
- issue: Uhusiano wa “hekima kutoka kwa Mungu” na “haki, utakaso, na ukombozi”
  choice: Orodha imeachwa ikiwa imeunganishwa kwa “na,” kwa kufuata mtiririko wa Kigiriki.
  alternative: Kutumia “yaani” au vistari kuonyesha kwamba nomino tatu za mwisho zinafafanua “hekima.”
  rationale: Muundo huu haulazimishi uamuzi kwamba nomino tatu ni maelezo ya “hekima” pekee, wala kwamba “kutoka kwa Mungu” linazitawala zote kwa kiwango sawa; hivyo unahifadhi mvutano wa kisarufi na kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “ni kutokana naye kwamba” umetumiwa ili kudumisha mkazo wa chanzo uliopo mwanzoni mwa sentensi; urudiaji wa “na” unafuata mwendo wa orodha ya Kigiriki.
