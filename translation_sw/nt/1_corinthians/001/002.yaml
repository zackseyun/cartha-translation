id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: sw
  text: 'Kwa kanisa la Mungu lililoko Korintho, kwa wale waliotakaswa katika Kristo Yesu, walioitwa kuwa watakatifu, pamoja na wote wanaoliitia jina la Bwana wetu Yesu Kristo katika kila mahali—pao na petu[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “katika kila mahali—pao na petu” yanaweza kumaanisha kila mahali ambapo waamini wanaliitia jina la Bwana, au kila mahali palipo pao na petu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: “Kanisa” ni neno la kawaida na lenye hadhi katika Kiswahili kwa jumuiya ya waamini inayotajwa katika salamu hii.
- source_word: ἡγιασμένοις
  choice: waliotakaswa
  rationale: Kauli tendwa huhifadhi tendo walilofanyiwa; hali timilifu ya Kigiriki inaonyesha tendo lililotimia lenye matokeo yanayoendelea.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Kristo Yesu
  rationale: “Kristo Yesu” ni namna ya kawaida ya Kiswahili ya kuhifadhi cheo Χριστός katika kauli hii ya Paulo bila kukifanya jina la ukoo.
- source_word: κλητοῖς ἁγίοις
  choice: walioitwa wawe watakatifu
  rationale: Hii ni Kiswahili cha asili kinachoonyesha wito na utakatifu, ingawa Kigiriki kina vivumishi viwili bila kitenzi-jina cha wazi.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: wanaoliitia jina
  rationale: “Kuliitia jina” huhifadhi maana ya kumwomba na kumwabudu Bwana, si kulitaja jina tu.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni neno la kawaida la kibiblia na la maungamo kwa κύριος katika muktadha huu.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: kila mahali—mahali pao na petu
  rationale: Muundo huu huhifadhi ufupi na utata wa kisintaksia wa maneno ya Kigiriki kuhusu uhusiano wa “pao na petu” na “kila mahali.”
theological_decisions:
- issue: Uwasilishaji wa Χριστός
  choice: Kristo
  alternative: Masiya
  rationale: Katika Kiswahili sanifu cha Biblia, “Kristo” ni cheo kinachoeleweka na chenye matumizi mapana; hakichukuliwi lazima kuwa jina la ukoo. “Masiya” ni tafsiri halali ya maana ya cheo, lakini ingebadili kauli ya kawaida ya Paulo “Kristo Yesu/Yesu Kristo.”
- issue: Maana ya κλητοῖς ἁγίοις
  choice: walioitwa wawe watakatifu
  alternative: watakatifu walioitwa
  rationale: Chaguo kuu ni la kawaida na wazi kwa msomaji wa kisasa, lakini halimaanishi kwamba utakatifu ni mafanikio ya baadaye pekee; muktadha tayari unawaita waliotakaswa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yaani” huonyesha kwamba “waliotakaswa” ni maelezo ya kanisa la Korintho, huku alama ya mkwaju ikihifadhi utata wa kifungu cha mwisho.
