  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: sw
  text: Kwa maana Masihi hakunituma kubatiza, bali kutangaza habari njema—si kwa hekima ya usemi,[a] ili msalaba wa Masihi usifanywe kuwa bure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa hekima yenye ufasaha”; kwa karibu zaidi, “kwa hekima ya usemi.”
    reason: lexical_alternative
  - marker: b
    text: Au “usibatilishwe” au “usiondolewe nguvu zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Masihi / wa Masihi
  rationale: Neno hili limetafsiriwa kama cheo chenye maana badala ya kutoholewa kama jina; “Masihi” ni Kiswahili sanifu na linafaa katika sehemu zote mbili za aya.
- source_word: βαπτίζειν
  choice: kubatiza
  rationale: Hili ni neno la kawaida na sahihi katika Kiswahili cha Biblia; haliongezi ufafanuzi mwembamba wa namna ya ubatizo.
- source_word: εὐαγγελίζεσθαι
  choice: kutangaza habari njema
  rationale: Linawasilisha maana ya kutangaza ujumbe mwema kwa lugha wazi na ya kawaida.
- source_word: σοφίᾳ λόγου
  choice: kwa hekima ya maneno
  rationale: Tafsiri hii inahifadhi muundo na utata wa kifungu cha Kigiriki, ambacho kinaweza kurejelea ustadi au ufasaha wa usemi.
- source_word: κενωθῇ
  choice: usifanywe kuwa bure
  rationale: Kauli tendwa imehifadhiwa, na usemi huu wa asili wa Kiswahili unaonyesha kufanywa batili au kukosa matokeo bila kuongeza wazi maneno “nguvu zake.”
- source_word: σταυρὸς
  choice: msalaba
  rationale: Ni tafsiri sanifu, halisi, na inayofaa katika matumizi ya Paulo.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kulitoholewa kwa namna ya kimapokeo
  choice: Masihi
  alternative: Kristo
  rationale: Kigiriki kinaweza kufanya kazi kama cheo chenye maana; “Masihi” huiwasilisha maana hiyo wazi, huku “Kristo” likibaki chaguo la kimapokeo.
- issue: Maana ya κενωθῇ kuhusu msalaba
  choice: usifanywe kuwa bure
  alternative: usiondolewe nguvu zake
  rationale: Tafsiri kuu haiongezi kirai kisichotajwa wazi katika Kigiriki, ingawa muktadha unaweza kudokeza kuondolewa kwa nguvu au matokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sababu, tofauti kati ya kubatiza na kutangaza, pamoja na kauli tendwa ya mwisho vimehifadhiwa. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
