base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: sw
  text: Pia niliwabatiza watu wa nyumbani mwa Stefana[a]. Zaidi ya hao, sijui kama nilimbatiza mtu mwingine yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya Stefana.” Neno la Kigiriki linaweza kurejelea watu wa nyumbani kama kundi, wala si jengo pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: nililibatiza / nilimbatiza
  rationale: Kitenzi hiki kinamaanisha kutekeleza ubatizo. ‘Batiza’ ni neno la kawaida, wazi, na halilazimishi ufafanuzi wa namna ya tendo hilo.
- source_word: δὲ καὶ
  choice: pia
  rationale: Muungano huu unaongeza jamaa ya Stefana katika orodha iliyotangulia; ‘pia’ huwasilisha vizuri uhusiano huo wa nyongeza bila kuufanya kuwa wa upinzani.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: jamaa ya Stefana
  rationale: Katika muktadha huu οἶκος huelekea kumaanisha watu wa nyumba kama kundi la kijamii, si jengo peke yake. ‘Jamaa’ huhifadhi upana huo kuliko ‘familia’ pekee.
- source_word: λοιπὸν
  choice: zaidi ya hao
  rationale: Neno hili linarejelea watu wengine wanaoweza kuwa nje ya waliotajwa. ‘Zaidi ya hao’ ni ya kawaida katika Kiswahili na inaendana na marejeo kwa watu.
- source_word: οὐκ οἶδα
  choice: sijui
  rationale: Tafsiri hii hufuata moja kwa moja dai la Kigiriki la kutokuwa na hakika; muktadha unaweza kudokeza kutokumbuka, lakini hilo halijaingizwa katika matini.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: kama nilimbatiza mtu mwingine yeyote
  rationale: ‘Kama’ huonyesha kutokuwa na hakika kuhusu kuwepo kwa mtu mwingine aliyebatizwa, huku ‘yeyote’ ikibeba maana isiyobainisha mtu.
theological_decisions:
- issue: Maana ya οἶκος katika simulizi la ubatizo
  choice: jamaa ya Stefana
  alternative: nyumba ya Stefana / familia ya Stefana
  rationale: Tafsiri haibainishi muundo au umri wa walio katika jamaa hiyo, kwa kuwa Kigiriki chenyewe hakifanyi hivyo. Hivyo haiingizi hitimisho kuhusu waliobatizwa zaidi ya taarifa ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa matini ya Biblia. Sentensi mbili zinahifadhi mtindo wa Paulo wa kuongeza jambo alilokumbuka kisha kukiri kutokuwa na hakika. Alama ya tanbihi [a] imewekwa katika matini kuu.
