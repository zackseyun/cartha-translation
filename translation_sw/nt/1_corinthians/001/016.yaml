    issue: “jamaa ya Stefana” may narrow οἶκος to relatives.
    rationale: Greek οἶκος denotes a household unit and may include persons beyond kin. In contemporary Swahili, “jamaa” commonly foregrounds relatives, whereas “watu wa nyumbani” retains the broader household reference.
