  source_fidelity: The draft accurately conveys Paul’s additional recollection, the baptism of Stephanas’s οἶκος, and his uncertainty about any further baptisms. However, “jamaa” can be understood chiefly as relatives/kin and therefore can narrow the κοινωνική breadth of οἶκος (“household”).
  naturalness: The wording is generally fluent Standard East African Swahili. “Watu wa nyumbani mwa Stefana” is both natural and clearer for a household unit. The second sentence is already idiomatic and preserves the uncertainty of εἴ.
  terminology: “Batiza” is the established, neutral rendering for βαπτίζω. “Watu wa nyumbani” best represents οἶκος here without implying a physical building only or making claims about the household’s composition.
