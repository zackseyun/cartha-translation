  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: sw
  text: Kwa maana Wayahudi huomba ishara[a], na Wagiriki hutafuta hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ishara” hapa inaweza kueleweka kuwa ishara za kimuujiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa maelezo ya Paulo; “Kwa maana” ni cha asili katika Kiswahili na kinahifadhi uhusiano huo wa kisababu.
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Katika muktadha huu neno linataja kundi la Kiyahudi likilinganishwa na Wagiriki; “Wayahudi” ndilo neno la kawaida na wazi.
- source_word: σημεῖα
  choice: ishara
  rationale: “Ishara” huhifadhi upana wa neno la Kigiriki bila kulifafanua kupita kiasi; katika muktadha huu linaweza kumaanisha ishara za kimuujiza.
- source_word: αἰτοῦσιν
  choice: huomba
  rationale: Wakati wa sasa unaonyesha jambo la kawaida au linaloendelea; “huomba” ni tafsiri ya asili isiyo na nguvu ya ziada ya “hudai.”
- source_word: Ἕλληνες
  choice: Wagiriki
  rationale: Huhifadhi rejeo mahsusi la kitamaduni katika Kigiriki, ambalo linaendana na kutajwa kwa hekima, badala ya kulipanua kuwa “watu wa mataifa.”
- source_word: σοφίαν
  choice: hekima
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi maana pana; hakibani dhana hiyo iwe falsafa pekee.
- source_word: ζητοῦσιν
  choice: hutafuta
  rationale: Huwasilisha kwa kawaida tendo linaloendelea au tabia ya kutafuta, kulingana na wakati wa sasa wa Kigiriki.
