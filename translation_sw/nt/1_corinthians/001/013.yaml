id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: sw
  text: Je, Masihi[a] amegawanywa? Je, Paulo alisulubiwa kwa ajili yenu? Au mlibatizwa katika jina la Paulo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: lexical_alternative
  - marker: b
    text: Au “mlibatizwa kwa jina la Paulo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: amegawanywa
  rationale: Kauli timilifu tendwa ya Kiswahili inaakisi hali iliyotokana na tendo lililokamilika, huku ikihifadhi swali kali la Paulo kuhusu kumgawa Masihi.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Kirai chenye kibainishi kinatumia Χριστός kama cheo; “Masihi” huwasilisha maana ya ‘Mtiwa-Mafuta’ kwa Kiswahili cha sasa.
- source_word: μὴ
  choice: Je, ...?
  rationale: Swali la balagha lenye “Je” linatarajia jibu la kukataa bila kuongeza maneno ya ufafanuzi kama “hakika si.”
- source_word: ἐσταυρώθη
  choice: alisulubiwa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kauli tendwa ya wakati uliopita.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Kirai hiki ni cha kawaida na huhifadhi wazo la kutendewa jambo kwa niaba au kwa faida ya wengine bila kulibainisha kupita kiasi.
- source_word: εἰς τὸ ὄνομα
  choice: katika jina
  rationale: “Katika jina” huhifadhi kwa kiwango kinachowezekana maana ya kuingia katika uhusiano au utambulisho unaohusishwa na jina, huku ikibaki lugha ya kawaida ya ubatizo.
- source_word: ἐβαπτίσθητε
  choice: mlibatizwa
  rationale: Kauli tendwa na nafsi ya pili wingi zimehifadhiwa kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika swali la balagha la Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi ὁ kinaonyesha wazi zaidi matumizi ya cheo hapa. “Masihi” huhifadhi maana ya cheo, huku tanbihi ikitoa istilahi ya mapokeo “Kristo” bila kulazimisha tafsiri moja kwa msomaji.
- issue: Maana ya εἰς τὸ ὄνομα katika ubatizo
  choice: katika jina la Paulo
  alternative: kwa jina la Paulo
  rationale: “Katika” hudokeza mwelekeo wa kuingia katika uhusiano, utambulisho, au utii unaohusishwa na jina; “kwa jina” ni mbadala wa kawaida zaidi lakini unaweza kusikika kama mamlaka au fomula tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa maswali matatu ya balagha umehifadhiwa, pamoja na kauli tendwa katika “amegawanywa,” “alisulubiwa,” na “mlibatizwa.”
