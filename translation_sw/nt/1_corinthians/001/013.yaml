  source_fidelity: Tafsiri inahifadhi kwa usahihi maswali matatu ya balagha ya Kigiriki. “Masihi amegawanywa” huonyesha kauli timilifu tendwa ya μεμέρισται, “alisulubiwa” na “mlibatizwa” hudumisha kauli tendwa, na “kwa ajili yenu” huwasilisha ὑπὲρ ὑμῶν bila kubana maana yake kiteolojia. “Katika jina la Paulo” ni usemi wa kawaida wa Kiswahili wa muktadha wa ubatizo na unadumisha uhusiano wa εἰς τὸ ὄνομα; tanbihi inatoa mbadala unaokubalika.
  naturalness: Kiswahili ni sanifu, cha sasa, na cha heshima. Kurudiwa kwa “Je” katika maswali mawili ya kwanza kunaweka wazi nguvu ya maswali ya balagha; “Au mlibatizwa...?” hufuata kwa kawaida.
