  text: so that no one may say that you were baptized into my name[a].
translation:
  language: sw
  text: ili mtu yeyote asije akasema kwamba mlibatizwa katika jina langu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jina langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή τις εἴπῃ
  choice: ili mtu yeyote asije akasema
  rationale: Muundo huu unaonyesha kusudi la kuzuia jambo lisitokee. Kiswahili hiki ni cha kawaida na kinahifadhi maana tarajiwa ya kauli ya Kigiriki.
- source_word: εἰς
  choice: katika
  rationale: Katika Kiswahili, ‘kubatizwa katika jina’ ni mwandamano wa asili unaoweza kuonyesha kuingizwa katika uhusiano au utambulisho unaohusishwa na jina. Tafsiri ya moja kwa moja ‘ndani ya’ hapa ingesikika isiyo ya kawaida.
- source_word: τὸ ἐμὸν ὄνομα
  choice: jina langu
  rationale: Hii ni tafsiri ya kawaida na sahihi ya muundo wa umilikaji.
- source_word: ἐβαπτίσθητε
  choice: mlibatizwa
  rationale: Inahifadhi nafsi ya pili wingi, wakati uliopita, na hali ya kutendwa bila kuingiza msimamo wa kimadhehebu kuhusu namna ya ubatizo.
theological_decisions:
- issue: Maana ya εἰς τὸ ἐμὸν ὄνομα katika muktadha wa ubatizo
  choice: katika jina langu
  alternative: kwa jina langu
  rationale: ‘Katika jina langu’ huhifadhi kwa kiwango kinachowezekana nguvu ya εἰς inayohusisha kuingia katika uhusiano au utambulisho, bila kutumia Kiswahili kisicho cha kawaida. ‘Kwa jina langu’ ni tafsiri ya kawaida lakini inaweza kusikika zaidi kama mamlaka au wakala; kwa hiyo imewekwa katika tanbihi ili kutunza uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Asije akasema’ ni muundo wa asili wa kusudi hasi; ‘mlibatizwa’ ni istilahi ya kawaida isiyobainisha namna maalumu ya ubatizo.
