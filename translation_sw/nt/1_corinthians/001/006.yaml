lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho au uwiano na kauli iliyotangulia, huku ikidumisha nguvu ya kiunganishi cha Kigiriki.
- source_word: μαρτύριον
  choice: ushuhuda
  rationale: Neno hili linadumisha maana ya ushahidi unaotolewa na ya ujumbe unaotangazwa bila kulifafanua kupita kiasi.
- source_word: τοῦ Χριστοῦ
  choice: kumhusu Masihi
  rationale: Muundo huu umechukuliwa hapa kuwa genitivi yenye Masihi kama yule anayehusu ushuhuda; ‘Masihi’ huhifadhi maana ya cheo Χριστός.
- source_word: ἐβεβαιώθη
  choice: ulivyothibitishwa
  rationale: Kitenzi cha kutendwa kinaonyesha kwamba ushuhuda uliimarishwa au ulionyeshwa kuwa wa hakika; ‘ulivyothibitishwa’ ni Kiswahili cha kawaida kinachofaa muktadha.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Kwa kuwa wanaosemeshwa ni wengi, kauli hii inaeleweka kwa kawaida kuwa inahusu kuthibitishwa kwake katika jumuiya yao; ‘ndani yenu’ bado ni uwezekano halisi.
theological_decisions:
- issue: Nguvu ya genitivi katika τοῦ Χριστοῦ
  choice: 'Genitivi objektivu: ‘ushuhuda kumhusu Masihi’'
  alternative: 'Genitivi subjektivu au ya uhusiano: ‘ushuhuda wa Masihi’'
  rationale: Katika muktadha, Paulo anaonekana kurejelea ushuhuda uliotangazwa kumhusu Yesu na kuthibitishwa miongoni mwa Wakorintho. Hata hivyo, muundo wa Kigiriki unaweza pia kumaanisha ushuhuda unaotoka kwa Masihi au unaohusishwa naye, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishazi tegemezi umehifadhiwa kwa sababu mstari huu unaendeleza sentensi ya mstari uliotangulia. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika ili uhusiano wake uwe wazi.
