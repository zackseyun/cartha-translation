  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: sw
  text: Hivyo hampungukiwi na karama yoyote[a] huku mkingojea kwa hamu ufunuo[b] wa Bwana wetu Yesu Kristo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karama yoyote ya kiroho” au “karama yoyote ya neema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuonekana kwa Bwana wetu Yesu Kristo.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki “Yesu Kristo”; pia inaweza kutafsiriwa “Yesu Masihi” ikiwa cheo hicho kinawekwa wazi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: hivyo
  rationale: Inaonyesha matokeo ya neema ya Mungu iliyoelezwa katika muktadha uliotangulia, kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ὑστερεῖσθαι
  choice: hampungukiwi
  rationale: Kitenzi hiki kinaeleza kutokuwa na upungufu; umbo la wakati wa sasa linaendana na hali ya waamini inayozungumziwa.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: na karama yoyote
  rationale: ‘Karama’ ni neno la kawaida la kibiblia kwa kipawa kinachotolewa kwa neema, bila kuongeza kwa lazima kivumishi ‘ya kiroho,’ ambacho hakipo wazi katika Kigiriki.
- source_word: ἀπεκδεχομένους
  choice: huku mkisubiri kwa hamu
  rationale: Huhifadhi hali endelevu ya kungoja pamoja na matarajio makubwa yanayodokezwa na kitenzi cha Kigiriki.
- source_word: ἀποκάλυψιν
  choice: kufunuliwa
  rationale: Hutoa maana ya tukio ambalo Bwana atawekwa wazi au kuonekana, huku ikibaki karibu na wazo la msingi la ἀποκάλυψις.
- source_word: κυρίου
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa κύριος katika matumizi ya Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: Katika muunganiko huu Χριστός inafanya kazi kama sehemu ya jina linalotumiwa kwa kawaida; ‘Kristo’ hudumisha mtindo wa kawaida wa Kiswahili, huku ‘Masihi’ ikitajwa kama mbadala unaoweka wazi cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  alternative: Yesu Masihi
  rationale: Katika muktadha huu muunganiko huo unatumiwa kama jina lililozoeleka zaidi kuliko kama msisitizo mpya wa cheo cha Kimasihi. Tanbihi huhifadhi maana ya cheo hicho.
- issue: Maana ya ἀποκάλυψιν katika tukio la mwisho
  choice: kufunuliwa
  alternative: kuonekana
  rationale: ‘Kufunuliwa’ hudumisha uhusiano wa moja kwa moja na wazo la ufunuo bila kupunguza tukio hilo kuwa kuonekana tu; ‘kuonekana’ ni uwezekano halali wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku maneno ‘karama,’ ‘Bwana,’ na ‘Kristo’ yakidumisha msamiati wa kibiblia uliozoeleka. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
