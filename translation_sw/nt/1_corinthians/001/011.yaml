base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: sw
  text: Kwa maana, ndugu zangu[a], nimejulishwa na watu wa Kloe kwamba kuna mabishano miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina neno “ndugu” katika umbo la wingi wa kiume; katika muktadha huu huenda linawahusu waamini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: nimejulishwa
  rationale: Kauli tendwa ya Kigiriki inaonyesha kwamba habari hiyo ilifanywa ijulikane kwa Paulo; “nimejulishwa” ni ya asili katika Kiswahili na huhifadhi maana hiyo.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kwamba sentensi hii inaeleza msingi wa himizo lililotangulia.
- source_word: περὶ ὑμῶν
  choice: habari zenu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya taarifa inayowahusu wasomaji.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima katika jumuiya ya waamini; linaweza pia kutumiwa kwa kundi lenye wanaume na wanawake, kama muktadha huu unavyowezesha.
- source_word: ὑπὸ τῶν Χλόης
  choice: na watu wa Kloe
  rationale: Usemi wa Kigiriki unamaanisha watu wanaohusishwa na Kloe bila kubainisha kwa hakika kama ni watu wa nyumbani mwake; tafsiri hii huepuka kuongeza maelezo yasiyothibitishwa.
- source_word: ἔριδες
  choice: ugomvi
  rationale: Nomino hii hueleza mabishano na migogoro baina ya watu; “ugomvi” ni ya sasa na inaeleweka kwa urahisi.
- source_word: ἐν ὑμῖν εἰσιν
  choice: kuna ... kati yenu
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kueleza kwamba hali hiyo ipo miongoni mwao.
theological_decisions:
- issue: Maana ya ἀδελφοί inapolitaja kusanyiko ambalo huenda lina wanaume na wanawake
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: Kiswahili “ndugu” hakilazimishi jinsia ya kiume na kinaweza kulihutubia kusanyiko lote, huku tanbihi ikieleza kwamba umbo la Kigiriki ni la wingi wa kiume na linaweza kutumika kwa maana jumuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Mpangilio umefanywa wa asili kwa Kiswahili bila kuondoa uhusiano wa sentensi na mstari uliotangulia.
