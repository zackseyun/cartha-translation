  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: sw
  text: Lakini Mungu alivichagua vitu vya kipumbavu vya ulimwengu[a] ili awaaibishe[b] wenye hekima; na Mungu alivichagua vitu dhaifu vya ulimwengu[c] ili aviaibishe vitu vyenye nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo ya kipumbavu ya ulimwengu.” Kigiriki kinatumia kivumishi cha wingi wa jinsi isiyo ya kiume wala ya kike kama nomino.
    reason: lexical_alternative
  - marker: b
    text: Au, “awatie aibu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo dhaifu ya ulimwengu.” Kigiriki tena kinatumia kivumishi cha wingi wa jinsi isiyo ya kiume wala ya kike kama nomino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji mkubwa na wazo lililotangulia kwa lugha ya kawaida na yenye heshima.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: vitu vya ulimwengu vilivyo vya kipumbavu
  rationale: Kivumishi cha Kigiriki ni wingi wa jinsi isiyo ya kiume wala ya kike na kimetumiwa kama nomino. “Vitu” kinahifadhi upana wa rejeo bila kukifanya kiwahusu watu peke yao.
- source_word: ἐξελέξατο
  choice: alivichagua
  rationale: Kitenzi hiki kinaonyesha tendo la Mungu la kuchagua kwa makusudi; kiambishi “-vi-” kinakubaliana na “vitu.”
- source_word: ἵνα
  choice: ili
  rationale: Kinahifadhi wazi maana ya kusudi katika kishazi cha Kigiriki.
- source_word: καταισχύνῃ
  choice: awaaibishe / aviaibishe
  rationale: “Aibisha” ni tafsiri ya kawaida ya kufanya mtu au kitu kipate aibu. Viambishi vya yambwa vinabadilika kulingana na “wenye hekima” na “vitu vyenye nguvu.”
- source_word: τοὺς σοφούς
  choice: wenye hekima
  rationale: Kivumishi cha Kigiriki ni cha kiume katika wingi na kimetumiwa kama nomino, hivyo hapa kinarejelea watu wenye hekima.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: vitu vya ulimwengu vilivyo dhaifu
  rationale: Kama τὰ μωρά, muundo huu ni wa wingi wa jinsi isiyo ya kiume wala ya kike; “vitu” huepuka kulifanya rejeo kuwa watu tu.
- source_word: τὰ ἰσχυρά
  choice: vitu vyenye nguvu
  rationale: Muundo wa Kigiriki ni wa wingi wa jinsi isiyo ya kiume wala ya kike. Tafsiri hii inadumisha ulinganifu na “vitu ... vilivyo dhaifu.”
theological_decisions:
- issue: Je, nomino zilizodokezwa katika vivumishi vya jinsi isiyo ya kiume wala ya kike zifasiriwe kuwa watu tu?
  choice: Zimetafsiriwa kwa “vitu” ili kuhifadhi upana wa kisarufi wa Kigiriki.
  alternative: “watu walio wapumbavu / watu walio dhaifu”
  rationale: Ingawa muktadha unaweza kuwahusisha watu, maandishi ya Kigiriki hayatumii maumbo ya kiume kwa τὰ μωρά, τὰ ἀσθενῆ, na τὰ ἰσχυρά. Kuyafanya yarejelee watu pekee kungeondoa utata wa makusudi wa usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “Mungu alivichagua” yamedumishwa kwa sababu ni sehemu ya msisitizo na ulinganifu wa usemi wa Paulo.
