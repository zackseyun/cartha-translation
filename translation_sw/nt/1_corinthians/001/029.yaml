  text: ὅπως μὴ καυχήσηται πᾶσα σὰρξ ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/029.yaml
  text: so that no flesh may boast before God[a].
translation:
  language: sw
  text: ili mtu yeyote asijisifu mbele za Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili mwili wowote usijisifu mbele za Mungu.” Kwa neno halisi, “mwili wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo; “ili” ni cha kawaida na huhifadhi nguvu ya kishazi cha kusudi.
- source_word: μὴ καυχήσηται
  choice: asijisifu
  rationale: Hali ya utegemezi pamoja na ukanushi katika kishazi cha kusudi inaelezwa kwa kawaida kwa “asijisifu.”
- source_word: πᾶσα σὰρξ
  choice: mtu yeyote
  rationale: Chini ya ukanushi, kirai hiki kinamaanisha kutengwa kwa kila mwanadamu. Kiswahili cha moja kwa moja “kila mwili asijisifu” si cha asili na kinaweza kueleweka vibaya; maana kuu imewekwa katika matini, huku tafsiri halisi ikihifadhiwa katika tanbihi.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha katika uwepo wa Mungu na unalingana na nahau ya Kigiriki.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha huu wa Paulo
  choice: “mtu yeyote” katika matini, na “mwili wowote” katika tanbihi kama tafsiri halisi
  alternative: “mwili wowote” katika matini
  rationale: Hapa σάρξ haimaanishi “asili ya dhambi,” bali wanadamu katika udhaifu wao mbele za Mungu. “Mtu yeyote” hutoa maana hiyo kwa Kiswahili cha asili, na tanbihi huhifadhi taswira na upekee wa neno la Kigiriki bila kuingiza fundisho lisilokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mbele za Mungu” ni nahau inayoeleweka kwa urahisi; “mtu yeyote” huepuka Kiswahili kisicho cha asili huku tanbihi ikihifadhi usemi halisi wa Kigiriki.
