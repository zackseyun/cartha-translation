id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: sw
  text: 'Ninachomaanisha ni hiki: kila mmoja wenu anasema, “Mimi ni wa Paulo,” au, “Mimi ni wa Apolo,” au, “Mimi ni wa Kefa,” au, “Mimi ni wa Masihi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Utohozi wa jadi wa Χριστός badala ya tafsiri ya cheo “Masihi.”
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 'Ninachomaanisha ni hiki:'
  rationale: Kauli hii ya kawaida katika Kiswahili inaonyesha kwamba Paulo anafafanua alichosema, huku alama ya nukta mbili ikiwakilisha ὅτι inayotanguliza yaliyomo.
- source_word: ἕκαστος ὑμῶν
  choice: kila mmoja wenu
  rationale: Inahifadhi maana ya mgawanyo ya ἕκαστος na kumwelekeza msomaji kwa kila mtu katika kundi.
- source_word: λέγει
  choice: anasema
  rationale: Wakati wa sasa unaonyesha mtindo unaoendelea miongoni mwa Wakorintho.
- source_word: εἰμι Παύλου / Ἀπολλῶ / Κηφᾶ / Χριστοῦ
  choice: ni wa Paulo / Apolo / Kefa / Masihi
  rationale: Muundo “ni wa” unaeleza kwa ufupi uhusiano, umiliki, au kujitambulisha na kiongozi bila kuongeza wazo mahsusi la kuwa mwanafunzi wake.
- source_word: Κηφᾶ
  choice: Kefa
  rationale: Jina la Kiaramu lililotumiwa na Paulo limetoholewa moja kwa moja badala ya kubadilishwa kuwa Petro.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” hutafsiri cheo hicho kwa matumizi ya kawaida ya kibiblia ya Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika kauli ya kujitambulisha na makundi
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi maana ya cheo Χριστός badala ya kukitumia kama jina tu. “Kristo,” ambalo limezoeleka sana katika mapokeo ya Kiswahili, limehifadhiwa katika tanbihi.
- issue: Maana ya uhusiano unaoonyeshwa na nomino katika hali ya umilikishi baada ya εἰμι
  choice: ni wa
  alternative: namfuata
  rationale: “Ni wa” huhifadhi upana wa maana ya kujihusisha au kujitambulisha na mtu; “namfuata” ingefafanua uhusiano huo kuwa ufuasi kwa namna iliyo mahsusi zaidi kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “Mimi ni wa” yamehifadhiwa ili kuonyesha kauli za makundi na mkazo wa Ἐγώ katika kila kauli.
