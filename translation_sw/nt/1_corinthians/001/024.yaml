id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: sw
  text: Lakini kwa wale walioitwa, wawe Wayahudi au Wagiriki, Masihi[a] ni nguvu ya Mungu na hekima ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: Kristo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: wale walioitwa
  rationale: Kivumishi hiki kimetumiwa kama nomino kutaja kundi linalotambulishwa kwa kuitwa; tafsiri hii ni ya kawaida na inadumisha maana ya tendo la kuita.
- source_word: Ἰουδαίοις
  choice: Wayahudi
  rationale: Katika ulinganisho huu wa Paulo kati ya Wayahudi na Wagiriki, neno hilo lina maana ya kikabila na kidini; “Wayahudi” ndilo chaguo lililo wazi katika Kiswahili.
- source_word: Ἕλλησιν
  choice: Wagiriki
  rationale: Tafsiri hii inadumisha neno mahsusi la Kigiriki badala ya kulipanua kiufafanuzi kuwa “watu wa mataifa.”
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana ya cheo hicho katika Kiswahili.
- source_word: θεοῦ δύναμιν
  choice: nguvu ya Mungu
  rationale: Muundo huu wa kawaida wa Kiswahili unaakisi kwa uwazi uhusiano wa nomino katika Kigiriki.
- source_word: θεοῦ σοφίαν
  choice: hekima ya Mungu
  rationale: Tafsiri hii inadumisha urudiaji na ulinganifu wa kishairi wa vifungu viwili vya Kigiriki.
- source_word: implicit copula / verbless predicate relation
  choice: Masihi ni nguvu ya Mungu na hekima ya Mungu
  rationale: Kitenzi “ni” kimeongezwa ili sentensi iwe kamili na ya kawaida katika Kiswahili, huku kikihifadhi uhusiano wa kiarifu unaoeleweka kutoka muktadha.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo cha Kikristo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huwasilisha maana ya cheo cha Kigiriki, yaani Mtiwa-Mafuta, bila kukigeuza tu kuwa jina. Tofauti ya mapokeo ya kusema “Kristo” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Pia” baada ya “Wagiriki” huwasilisha τε καὶ kwa mtiririko wa kawaida; urudiaji wa “ya Mungu” umehifadhiwa kwa msisitizo wa maandishi ya asili.
