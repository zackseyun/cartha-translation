  verdict: revise
  source_fidelity: The draft accurately renders the substantival κλητοῖς as “wale walioitwa,” preserves the Jew/Greek contrast, translates Χριστόν as the title “Masihi,” and retains the repeated predicates “nguvu ya Mungu” and “hekima ya Mungu.” The supplied copula “ni” is appropriate in Kiswahili.
  naturalness: The placement of “pia” after “Wagiriki” is somewhat awkward and does not idiomatically mark the Greek correlative τε καὶ (“both … and”). “Wawe Wayahudi au Wagiriki” is natural Standard East African Swahili and clearly conveys that both groups are included among those called.
  terminology: “Masihi” is an appropriate title translation for Χριστός and agrees with the project policy. “Wayahudi,” “Wagiriki,” “nguvu ya Mungu,” and “hekima ya Mungu” are accurate, standard, and suitably formal. The lexical-alternative footnote for “Kristo” is properly anchored.
