source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: sw
  text: 'Na Mungu ameweka katika kanisa: kwanza mitume, pili manabii, tatu walimu; kisha matendo ya nguvu[a], kisha karama za kuponya, misaada, uongozi[b], na aina za ndimi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miujiza.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uelekezaji” au “namna za kuongoza.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha”; tafsiri hii haibainishi ikiwa Paulo anamaanisha lugha za kawaida za wanadamu, matamshi ya kiroho, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: ameweka
  rationale: Kitenzi hiki hapa kina maana ya Mungu kuwaweka au kuwateua watu na shughuli zao katika kanisa. “Amewaweka” kinaonyesha tendo la Mungu lenye umuhimu unaoendelea bila kulifanya kuwa cheo rasmi kuliko inavyosema matini.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: katika kanisa
  rationale: Katika matumizi ya Paulo, ἐκκλησία hapa ni jumuiya ya waamini. “Kanisa” ni neno la kawaida, la sasa, na linaloeleweka vizuri katika muktadha huu.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: kwanza ... pili ... tatu
  rationale: Maneno haya yanahifadhi kwa uwazi mpangilio wa Kigiriki bila kueleza ikiwa ni daraja la mamlaka, mfuatano wa wakati, au uzito wa huduma.
- source_word: ἀποστόλους
  choice: mitume
  rationale: Hili ndilo neno sanifu la Kiswahili kwa jukumu la kitume linalotajwa katika orodha ya huduma za kanisa.
- source_word: προφήτας
  choice: manabii
  rationale: Ni tafsiri sanifu na ya moja kwa moja kwa wale wanaotoa unabii.
- source_word: διδασκάλους
  choice: walimu
  rationale: Ni tafsiri ya kawaida na iliyo wazi kwa jukumu la kufundisha.
- source_word: δυνάμεις
  choice: matendo ya nguvu
  rationale: Kwa maana ya msingi neno ni “nguvu,” lakini katika orodha hii linaelekea kumaanisha matendo yenye nguvu za ajabu. “Matendo ya nguvu” huhifadhi taswira ya Kigiriki, huku tanbihi ikitoa “miujiza” kama tafsiri ya kimuktadha.
- source_word: χαρίσματα ἰαμάτων
  choice: karama za kuponya
  rationale: Kiswahili hiki ni cha asili na huhifadhi wazo la karama zinazohusiana na kuleta uponyaji, bila kuongeza wagonjwa au maelezo yasiyomo katika Kigiriki.
- source_word: ἀντιλήμψεις
  choice: misaada
  rationale: Neno hili linahusu matendo au uwezo wa kusaidia na kutegemeza wengine. “Misaada” ni fupi na linafaa katika orodha.
- source_word: κυβερνήσεις
  choice: uongozi
  rationale: Neno la Kigiriki lina taswira ya kuelekeza au kuendesha. “Uongozi” linaeleza kazi hiyo kwa kawaida bila kuifanya lazima iwe ofisi ya ngazi fulani.
- source_word: γένη γλωσσῶν
  choice: aina za lugha
  rationale: “Aina” hutafsiri γένη, na “lugha” huhifadhi usemi unaotumiwa sana kwa karama hii katika Kiswahili. Tanbihi inaacha wazi mjadala kuhusu hali halisi ya lugha hizo.
theological_decisions:
- issue: Ikiwa mpangilio unaonyesha daraja la kudumu, mfuatano wa wakati, au umuhimu wa kiutendaji
  choice: 'Mpangilio umetafsiriwa moja kwa moja: “kwanza ... pili ... tatu ... kisha ... kisha.”'
  alternative: Kuufafanua wazi kuwa daraja la mamlaka, mfuatano wa kihistoria, au mpangilio wa umuhimu.
  rationale: Aya ina mpangilio dhahiri lakini haisemi mpangilio huo ni wa aina gani. Tafsiri haiongezi ufafanuzi wa kimadhehebu.
- issue: Maana halisi ya γλῶσσαι katika muktadha huu
  choice: “Lugha” imetumiwa katika matini kuu, na utata umeelezwa katika tanbihi.
  alternative: Kufafanua moja kwa moja kuwa ni lugha za kawaida za wanadamu au matamshi ya kiroho yasiyo lugha za kawaida.
  rationale: Majadiliano mapana ya Paulo hayalazimishi tafsiri kutatua hapa namna kamili ya jambo hilo; kwa hiyo tafsiri inadumisha mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika, na orodha ya Kigiriki imehifadhiwa bila kuongezewa vyeo au ufafanuzi wa kimadhehebu.
