  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: sw
  text: Kwa maana sisi sote tulibatizwa katika Roho mmoja[a] kuingia katika mwili mmoja—ikiwa ni Wayahudi au Wagiriki, ikiwa ni watumwa au watu huru—nasi sote tulipewa kunywa Roho mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho mmoja.” Kihusishi cha Kigiriki kinaweza kumaanisha kuwa jambo lilitendeka katika nyanja ya Roho au kwa Roho kama chombo au mtendaji.
    reason: alternative_reading
  - marker: b
    text: Kigiriki pia kinaweza kueleweka, “sote tulinyweshwa Roho mmoja.” Neno “Roho” hapa linaelekea kumtaja Roho Mtakatifu, ingawa linaweza pia kueleweka kuwa “roho moja.”
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Katika muktadha huu, kauli hii inaeleza msingi wa umoja uliotajwa; “Kwa maana” ni ya asili katika Kiswahili na inabeba nguvu ya ufafanuzi ya γὰρ, huku msisitizo wa καί ukijitokeza kupitia “sisi sote.”
- source_word: ἐν ἑνὶ πνεύματι
  choice: katika Roho mmoja
  rationale: “Katika” huhifadhi kwa kadiri iwezekanavyo uwezekano wa ἐν kueleza mazingira au nyanja ya tendo, bila kuondoa uwezekano wa maana ya chombo au mtendaji; huo umeonyeshwa katika tanbihi.
- source_word: ἡμεῖς πάντες
  choice: sisi sote
  rationale: Kiwakilishi cha wazi ἡμεῖς pamoja na πάντες kina msisitizo; “sisi sote” huuhifadhi kwa Kiswahili cha kawaida.
- source_word: εἰς ἓν σῶμα ἐβαπτίσθημεν
  choice: tulibatizwa ... ili tuwe mwili mmoja
  rationale: “Tulibatizwa” ni istilahi ya kawaida ya kibiblia kwa βαπτίζω. Katika Kiswahili, “ili tuwe mwili mmoja” huwasilisha kwa uwazi mwelekeo na matokeo ya εἰς bila kulazimisha usemi usio wa asili wa “ndani ya mwili mmoja.”
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: Wayahudi ... Wagiriki
  rationale: Jozi hii ya kikabila na kidini inataja Wayahudi na Wagiriki moja kwa moja; haitumii neno pana zaidi “Mataifa.”
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: watumwa ... watu huru
  rationale: Katika ulinganisho huu wa hali ya kijamii na kisheria, δοῦλοι ni watumwa, si watumishi kwa ujumla; “watu huru” ni kinyume chake cha asili na wazi.
- source_word: ἐποτίσθημεν
  choice: tulinyweshwa
  rationale: Kitenzi hiki cha kutendwa kinamaanisha kupewa au kufanywa kunywa. “Tulinyweshwa” huhifadhi hali ya kutendwa na sitiari ya kushiriki kinywaji kimoja kwa ufupi na kwa ufasaha.
- source_word: ἓν πνεῦμα
  choice: Roho mmoja
  rationale: Muktadha unaelekea kwa Roho Mtakatifu yuleyule aliyetajwa katika kishazi cha kwanza; herufi kubwa huonyesha rejeo hilo, bila kuongeza neno “Mtakatifu” ambalo halipo wazi katika mstari.
theological_decisions:
- issue: Je, ἐν ἑνὶ πνεύματι ina maana ya kuwa “katika Roho mmoja” au kubatizwa “kwa Roho mmoja” kama mtendaji/chombo?
  choice: katika Roho mmoja
  alternative: kwa Roho mmoja
  rationale: Kihusishi ἐν kinaweza kueleza nyanja, chombo, au kwa namna fulani utendaji. Maandishi makuu yanabaki karibu na muundo wa Kigiriki, na tanbihi inalinda maana mbadala ya kweli bila kuamua mjadala wa kiteolojia kimadhehebu.
- issue: Je, εἰς ἓν σῶμα ἐβαπτίσθημεν ielezwe kama kuingia “ndani ya mwili mmoja” au kama matokeo ya kuwa mwili mmoja?
  choice: tulibatizwa ... ili tuwe mwili mmoja
  alternative: tulibatizwa kuingia katika mwili mmoja
  rationale: εἰς inaonyesha mwelekeo au matokeo ya kuingizwa katika mwili mmoja. Chaguo kuu ni Kiswahili cha asili na linahifadhi wazo la kuunganishwa, si kwamba mwili ni mahali halisi.
- issue: Je, πνεῦμα katika kishazi cha pili inamtaja Roho Mtakatifu au hali/uhalisia mmoja wa kiroho?
  choice: Roho mmoja
  alternative: roho moja
  rationale: Ulinganifu na kishazi cha kwanza pamoja na hoja ya sura kuhusu kazi ya Roho unaunga mkono rejeo kwa Roho Mtakatifu. Hata hivyo, kwa kuwa Kigiriki hakina tofauti ya herufi kubwa na ndogo kama hii, uwezekano mwingine umetajwa katika tanbihi.
- issue: Maana ya δοῦλοι katika ulinganisho na ἐλεύθεροι
  choice: watumwa
  alternative: watumishi
  rationale: Ulinganisho wa moja kwa moja na watu huru unaonyesha hali ya utumwa wa kijamii na kisheria; “watumwa” ndiyo tafsiri sahihi na haipunguzi ukali wa neno.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umerahisishwa kwa ufasaha bila kupoteza msisitizo wa “sisi sote,” jozi za kijamii na kikabila, au sitiari ya kubatizwa na kunyweshwa.
