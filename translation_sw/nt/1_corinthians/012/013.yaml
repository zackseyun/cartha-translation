review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the emphatic collective subject, the Jew/Greek and slave/free pairs, and the ambiguity of ἐν through its footnote. However, “ili tuwe mwili mmoja” recasts εἰς ἓν σῶμα as purpose/result (“so that we may be one body”) rather than the stated incorporation “into one body.” The final passive is more idiomatically and transparently represented as being given the one Spirit to drink.
  naturalness: The revision uses standard, clear East African Swahili. “Tulibatizwa kuingia katika mwili mmoja” is natural while retaining the directional sense, and “tulipewa kunywa Roho mmoja” expresses the passive drinking metaphor more smoothly than “tulinyweshwa Roho mmoja.”
  terminology: “Wayahudi,” “Wagiriki,” “watumwa,” and “watu huru” are accurate and appropriately direct. “Roho mmoja” appropriately reflects the likely referent to the Holy Spirit without adding “Mtakatifu”; the footnote preserves the lowercase alternative, using grammatically appropriate “roho moja.”
  issues:
  - severity: medium
    issue: “ili tuwe mwili mmoja” weakens the directional/incorporative force of εἰς ἓν σῶμα.
    rationale: The Greek says that all were baptized into one body. A purpose clause can suggest merely becoming one body rather than incorporation into it. “Kuingia katika mwili mmoja” retains the intended direction and result.
  - severity: low
    issue: “Tulinyweshwa Roho mmoja” is potentially awkward in modern Swahili.
    rationale: Although it can convey a passive causative sense, it can momentarily sound as though the Spirit is the agent who made people drink. “Tulipewa kunywa Roho mmoja” clearly presents the shared Spirit as what was given to drink, while retaining the passive sense of ἐποτίσθημεν.
  revised_text: Kwa maana sisi sote tulibatizwa katika Roho mmoja[a] kuingia katika mwili mmoja—ikiwa ni Wayahudi au Wagiriki, ikiwa ni watumwa au watu huru—nasi sote tulipewa kunywa Roho mmoja.[b]
  revised_footnotes:
  - marker: a
    text: Au, “kwa Roho mmoja.” Kihusishi cha Kigiriki kinaweza kumaanisha kuwa jambo lilitendeka katika nyanja ya Roho au kwa Roho kama chombo au mtendaji.
    reason: alternative_reading
  - marker: b
    text: Kigiriki pia kinaweza kueleweka, “sote tulinyweshwa Roho mmoja.” Neno “Roho” hapa linaelekea kumtaja Roho Mtakatifu, ingawa linaweza pia kueleweka kuwa “roho moja.”
    reason: lexical_and_alternative_reading
  revision_rationale: The revision restores the incorporative force of εἰς (“into”) without imposing a theological interpretation, and it improves the final passive metaphor in idiomatic Swahili. The existing footnote on ἐν continues to preserve the genuine “in/by” ambiguity, while the second footnote retains the alternative passive phrasing and the capitalization-related ambiguity.
