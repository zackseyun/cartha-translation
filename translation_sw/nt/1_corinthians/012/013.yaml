revisions:
- from: Kwa maana sisi sote tulibatizwa katika Roho mmoja[a] ili tuwe mwili mmoja—ikiwa ni Wayahudi au Wagiriki, ikiwa ni watumwa au watu huru—nasi sote tulinyweshwa Roho mmoja.[b]
  to: Kwa maana sisi sote tulibatizwa katika Roho mmoja[a] kuingia katika mwili mmoja—ikiwa ni Wayahudi au Wagiriki, ikiwa ni watumwa au watu huru—nasi sote tulipewa kunywa Roho mmoja.[b]
  rationale: The revision restores the incorporative force of εἰς (“into”) without imposing a theological interpretation, and it improves the final passive metaphor in idiomatic Swahili. The existing footnote on ἐν continues to preserve the genuine “in/by” ambiguity, while the second footnote retains the alternative passive phrasing and the capitalization-related ambiguity.
  reviewer_model: gpt-5.6-terra
