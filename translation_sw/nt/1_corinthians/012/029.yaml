  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: sw
  text: Si wote ni mitume, sivyo? Si wote ni manabii, sivyo? Si wote ni walimu, sivyo? Si wote hutenda miujiza, sivyo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “Si wote ni ‘nguvu’ au ‘matendo yenye nguvu,’ sivyo?” Kigiriki hutumia “nguvu” kwa ufupi kumaanisha matendo ya kimiujiza au wale wanaoyatenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Je, wote ...?
  rationale: Katika maswali haya, μή hutarajia jibu la kukataa. Muundo wa Kiswahili wenye muktadha huu unaonyesha kwa kawaida kwamba jibu ni ‘La,’ huku ukihifadhi mfululizo wa maswali ya balagha.
- source_word: πάντες
  choice: wote
  rationale: ‘Wote’ ni tafsiri ya kawaida na inahifadhi urudiaji wenye mkazo kwamba si kila mshiriki wa mwili ana huduma au utendaji uleule.
- source_word: ἀπόστολοι
  choice: mitume
  rationale: Hapa neno linataja nafasi au huduma inayotambulika katika orodha ya Paulo, si wajumbe kwa maana ya jumla tu.
- source_word: προφῆται
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wale wanaotoa unabii na linafaa katika orodha hii ya huduma.
- source_word: διδάσκαλοι
  choice: walimu
  rationale: ‘Walimu’ ni tafsiri ya kawaida, wazi, na ya asili katika muktadha wa huduma ya kanisa.
- source_word: δυνάμεις
  choice: hutenda miujiza
  rationale: Nomino ya Kigiriki, kihalisi ‘nguvu’ au ‘matendo yenye nguvu,’ imetumiwa hapa kwa ufupi kutaja utendaji wa miujiza. Muundo wa kitenzi ni wa asili katika Kiswahili na haudokezi kwamba watu wenyewe ni miujiza.
theological_decisions:
- issue: Tafsiri ya δυνάμεις katika orodha ya nafasi na karama
  choice: Je, wote hutenda miujiza?
  alternative: Je, wote ni watendaji wa miujiza? / Je, wote wana nguvu za kutenda miujiza?
  rationale: Tafsiri iliyochaguliwa huwasilisha maana ya kimuktadha kwamba si kila mshiriki hutenda matendo ya kimiujiza. Haiongezi dai kwamba watu wana ‘nguvu’ kama milki yao, wala haisemi kihalisi kwamba wao ni ‘nguvu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa ‘Je, wote...?’ unahifadhi nguvu ya maswali manne ya balagha; muktadha unatarajia jibu la kukataa.
