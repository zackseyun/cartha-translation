base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: sw
  text: Lakini kwa hali ilivyo sasa, Mungu amevipanga[a] viungo katika mwili, kila kimoja chao, kama alivyotaka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ameviweka.”
    reason: lexical_alternative
  - marker: b
    text: Au “kama alivyokusudia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini kama ilivyo sasa
  rationale: Kirai hiki kinaonyesha tofauti na hali za kudhaniwa zilizotajwa kabla yake na kurudisha hoja kwenye hali halisi. Tafsiri hii huhifadhi nguvu ya δὲ na kazi ya νυνὶ katika muktadha bila kuifanya ionekane kuwa taarifa ya wakati tu.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiima hiki.
- source_word: ἔθετο
  choice: amepanga
  rationale: Katika mfano wa mwili, neno hili linaonyesha kuwa Mungu alikiweka kila kiungo mahali pake kwa kusudi. ‘Amepanga’ huwasilisha mpangilio wa makusudi, huku ‘ameweka’ likibaki kuwa chaguo halali la karibu zaidi na maana ya msingi.
- source_word: τὰ μέλη, ἓν ἕκαστον αὐτῶν
  choice: kila kiungo
  rationale: Muundo huu wa Kiswahili ni wa asili na huhifadhi msisitizo wa Kigiriki kwamba kila kiungo kimoja kimoja kilihusika. ‘Kiungo’ hudumisha mfano wa sehemu mbalimbali za mwili zinazofanya kazi pamoja.
- source_word: ἐν τῷ σώματι
  choice: katika mwili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; kwanza inarejelea mwili wa mfano, ambao katika muktadha mpana unatumika kwa jumuiya ya waamini.
- source_word: καθὼς ἠθέλησεν
  choice: kama alivyotaka
  rationale: Huhifadhi maana ya kwamba mpangilio huo ulilingana na utashi wa Mungu, kwa lugha ya sasa na inayoeleweka.
theological_decisions:
- issue: Kusudi la Mungu katika kuweka viungo mbalimbali ndani ya mwili
  choice: Mungu amepanga kila kiungo katika mwili kama alivyotaka.
  alternative: Mungu ameweka kila kiungo katika mwili bila kusisitiza wazi mpangilio wa makusudi.
  rationale: Muktadha unaonyesha kwamba utofauti wa viungo si wa bahati mbaya bali unatokana na tendo na utashi wa Mungu. ‘Amepanga’ pamoja na ‘kama alivyotaka’ huhifadhi msisitizo huo bila kuongeza fundisho lisilosemwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mfano wa mwili na msisitizo wa kila kiungo kimoja kimoja.
