  source_fidelity: “Kuhusu mambo ya kiroho” faithfully renders Περὶ δὲ τῶν πνευματικῶν without supplying the unstated noun “gifts.” The wording preserves the substantival adjective’s breadth, while “sitaki mkose kuyajua” accurately conveys Paul’s idiom οὐ θέλω ὑμᾶς ἀγνοεῖν.
  naturalness: The translation is natural, clear Standard East African Swahili. “Ndugu” works well as a respectful congregational address, and “sitaki mkose kuyajua” is an idiomatic, non-pejorative expression of not wanting the readers to lack knowledge of the matters mentioned.
  terminology: “Mambo ya kiroho” appropriately retains the lexical and referential openness of τῶν πνευματικῶν. Footnote a responsibly identifies “karama za kiroho” as a contextually likely, but interpretive, alternative. The cultural explanation in footnote b is balanced and does not overstate the grammatical form.
