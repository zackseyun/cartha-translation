id: 1CO.12.1
reference: 1 Corinthians 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: sw
  text: Kuhusu mambo ya kiroho[a], ndugu[b], sitaki mkose kuyajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karama za kiroho.” Usemi wa Kigiriki ni mpana kuliko “karama,” ingawa sura hii inakazia karama zinazotolewa na Roho.
    reason: alternative_reading
  - marker: b
    text: Hapa “ndugu” ni namna ya Paulo ya kulihutubia kusanyiko, na inaelekea inawajumuisha wanawake pia.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Kifungu hiki kinaanzisha mada mpya. “Kuhusu” kinatafsiri περί kwa Kiswahili cha kawaida; nguvu hafifu ya mpito ya δέ inaeleweka katika mabadiliko ya mada bila kuongeza neno la wakati lisilokuwapo katika Kigiriki.
- source_word: τῶν πνευματικῶν
  choice: mambo ya kiroho
  rationale: 'Kivumishi hiki kimetumiwa kama nomino na kinabaki pana na tata: kinaweza kumaanisha mambo ya kiroho, karama za kiroho, au labda watu wa kiroho. “Mambo ya kiroho” hakiongezi “karama,” ingawa muktadha unaofuata unazihusu sana karama na utendaji wa Roho.'
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima kwa waumini katika Kiswahili, na unaweza kujumuisha wanaume na wanawake kama matumizi ya Paulo katika kulihutubia kusanyiko.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: sitaki mkose kuyajua
  rationale: Hii inawasilisha kwa Kiswahili cha asili maana ya kutotaka wasijue au wasiwe na ufahamu, bila ukali unaoweza kuletwa na maneno kama “wajinga.” Kiwakilishi “-ya-” kinarejelea mambo yaliyotajwa.
theological_decisions:
- issue: Maana ya τῶν πνευματικῶν
  choice: mambo ya kiroho
  alternative: karama za kiroho; watu wa kiroho
  rationale: Kigiriki hakina nomino inayosema wazi “karama.” Ingawa 1 Wakorintho 12–14 inahusu sana karama na maonyesho ya Roho, tafsiri pana katika matini kuu inalinda utata halisi wa usemi; maana ya “karama” imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mambo ya kiroho” limetumiwa ili kuhifadhi upana wa Kigiriki, na “sitaki mkose kuyajua” linaepuka mtindo mzito au wenye dharau.
