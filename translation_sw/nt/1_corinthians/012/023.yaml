  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: sw
  text: na zile sehemu za mwili tunazoziona kuwa na heshima kidogo[a], tunazipa heshima zaidi; na sehemu zetu zisizofaa kuonyeshwa zina mwonekano wa heshima zaidi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunazoziona kuwa zisizo na heshima sana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “zina staha zaidi” au “zina uzuri zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: tunazoziona
  rationale: Huwasilisha tathmini ya kibinadamu, si hali halisi isiyopingika; ni usemi wa kawaida wa Kiswahili.
- source_word: ἀτιμότερα
  choice: kuwa na heshima kidogo
  rationale: Huhifadhi ulinganisho na uhusiano wa kimatamshi na τιμή bila kutumia kauli kali ya ‘zisizo na heshima’.
- source_word: τοῦ σώματος
  choice: za mwili
  rationale: Huhifadhi taswira halisi ya sehemu za mwili iliyo msingi wa hoja ya Paulo.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: hizo huzipa heshima kubwa zaidi
  rationale: Ni Kiswahili cha asili kinachoeleza kuwapa sehemu hizo heshima, huku kikihifadhi ulinganisho wa περισσοτέραν.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: sehemu zetu zisizofaa kuonyeshwa
  rationale: Hueleza sehemu ambazo kwa desturi hazifai kuonekana hadharani bila kuzihukumu kuwa chafu kimaadili.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: huzisitiriwa kwa staha zaidi
  rationale: Katika muktadha wa sehemu za mwili, Kiswahili hiki cha asili huonyesha matokeo ya kuzisitiri kwa namna inayofaa; tanbihi huhifadhi uwezekano wa muundo halisi zaidi wa ‘zina mwonekano wa heshima zaidi’.
theological_decisions:
- issue: Taswira ya mwili na heshima ya kijamii
  choice: Kudumisha lugha halisi ya sehemu za mwili
  alternative: Kufafanua moja kwa moja kuwa washiriki wanaoonekana dhaifu hupewa heshima
  rationale: Hoja ya Paulo huanzia katika jinsi mwili halisi unavyotendewa na kisha kutumika kwa mwili wa Kristo; tafsiri haipaswi kuingiza matumizi hayo badala ya taswira yenyewe.
- issue: Kauli tendwa inayodokezwa katika εὐσχημοσύνην ... ἔχει
  choice: huzisitiriwa kwa staha zaidi
  alternative: zina staha zaidi / zina mwonekano wa heshima zaidi
  rationale: Muktadha unahusu heshima tunayoweka juu ya sehemu fulani na namna sehemu zisizofaa kuonyeshwa zinavyowasilishwa. Kauli hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi ubadala wa karibu zaidi na muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unabaki halisi vya kutosha kudumisha taswira ya mwili, lakini huepuka tafsiri ngumu au inayoweza kudokeza uchafu wa kimaadili.
