  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: sw
  text: Lakini kila mmoja hupewa udhihirisho wa Roho kwa manufaa ya wote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jambo lenye manufaa” au “kwa faida ya wote.”
    reason: Maana ya πρὸς τὸ συμφέρον inaweza kutolewa kwa jumla kuwa jambo lenye manufaa, ingawa muktadha unaonyesha manufaa ya jumuiya.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: kila mmoja
  rationale: Umbo la dative la umoja linaonyesha kwamba jambo hili linagawiwa kwa kila mtu mmoja mmoja katika jumuiya.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo au mpito kutoka maelezo yaliyotangulia bila kuweka mkazo kupita kiasi.
- source_word: δίδοται
  choice: hupewa
  rationale: Huhifadhi kauli tendwa na hali ya tendo linalomhusu kila mmoja, huku ikieleza kwa kawaida kwamba jambo hilo ni zawadi.
- source_word: φανέρωσις
  choice: udhihirisho
  rationale: Neno hili humaanisha kufanya kitu kionekane au kijulikane wazi; hapa linaeleza kuonekana kwa kazi ya Roho kupitia karama.
- source_word: τοῦ πνεύματος
  choice: wa Roho
  rationale: Muktadha wa sura hii unamtambulisha kuwa Roho Mtakatifu, lakini tafsiri haiongezi neno ‘Mtakatifu,’ ambalo halipo katika fungu hili la Kigiriki.
- source_word: πρὸς τὸ συμφέρον
  choice: kwa manufaa ya wote
  rationale: Kirai hiki huonyesha lengo la kuleta manufaa. Muktadha wa mwili na karama zinazotolewa kwa watu mbalimbali unaelekeza kwenye manufaa ya jumuiya, huku tanbihi ikihifadhi uwezekano wa maana ya jumla zaidi.
theological_decisions:
- issue: Anayerejelewa na ‘Roho’
  choice: Roho Mtakatifu ndiye anayerejelewa, lakini maandishi yanasema ‘Roho.’
  alternative: roho kwa maana ya jumla
  rationale: Mistari ya karibu inazungumza mara kwa mara juu ya Roho yuleyule kama chanzo cha karama. Kutotaja ‘Mtakatifu’ moja kwa moja kunabaki karibu na maneno ya Kigiriki.
- issue: Upeo wa συμφέρον
  choice: manufaa ya wote
  alternative: jambo lenye manufaa kwa maana ya jumla, bila kutaja wazi wote
  rationale: Muktadha wa sura nzima unasisitiza mwili na kujengana kwa washiriki wake. Hata hivyo, kwa kuwa neno lenyewe halisemi moja kwa moja ‘wote,’ tanbihi inahifadhi maana pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Udhihirisho’ limetumiwa kwa usahihi wa kimaana, na ‘manufaa ya wote’ linaweka wazi mwelekeo wa kijumuiya wa muktadha.
