  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: sw
  text: lakini viungo vyetu vinavyoonekana kwa heshima havina haja. Bali Mungu ameunganisha mwili[a], akikipa heshima kubwa zaidi kiungo kilichokosa heshima,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameuchanganya mwili.” Kitenzi cha Kigiriki kinaweza kusisitiza kuchanganya au kuunganisha sehemu ziwe kitu kimoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: viungo vyetu vinavyopendeza
  rationale: Kivumishi cha wingi kisicho na nomino kinahitaji kuongezewa “viungo” kutokana na muktadha. “Vinavyopendeza” kinaonyesha ustahifu wa kuonekana au adabu ya nje, tofauti na viungo visivyopendeza katika mstari uliotangulia.
- source_word: χρείαν ἔχει
  choice: havihitaji hayo
  rationale: Hii ni nahau ya kawaida ya kuwa na uhitaji. “Hayo” hurejelea kwa kawaida heshima au utunzaji wa pekee unaotajwa katika muktadha, bila kuufanya ufafanuzi huo kuwa mpana kupita kiasi.
- source_word: συνεκέρασεν
  choice: ameunganisha
  rationale: Kitenzi kina maana ya kuchanganya au kuunganisha sehemu ziwe kitu kimoja. “Ameunganisha” ni Kiswahili cha kawaida kinachoonyesha umoja wenye kusudi, huku maana mbadala ya kuchanganya ikihifadhiwa katika tanbihi.
- source_word: σῶμα
  choice: mwili
  rationale: Linadumisha mfano mkuu wa Paulo wa mwili bila kuufafanua moja kwa moja kuwa kanisa, hivyo kuhifadhi upeo wa mfano katika muktadha.
- source_word: τῷ ὑστεροῦντι
  choice: kiungo kilichokosa heshima
  rationale: Kirai humaanisha kile kilichopungukiwa. Muktadha na neno τιμήν huonyesha kwamba kilichokosekana ni heshima, si thamani ya asili ya kiungo.
- source_word: περισσοτέραν τιμήν
  choice: heshima kubwa zaidi
  rationale: Tafsiri ya kawaida na wazi inayohifadhi nguvu ya ulinganisho ya περισσοτέραν.
- source_word: δοὺς
  choice: akakipa
  rationale: Umbo hili linaonyesha tendo linaloandamana na au kueleza namna Mungu alivyouunganisha mwili. Muundo wa “akakipa” ni wa kawaida katika simulizi la Kiswahili na huunganisha matendo hayo kwa uwazi.
theological_decisions:
- issue: Maana ya tendo la Mungu katika mfano wa mwili
  choice: Mungu anaelezwa kuwa ameunganisha mwili kwa kusudi, huku akikipa heshima kubwa zaidi kiungo kilichokuwa kimekosa heshima.
  alternative: Kitenzi kinaweza kusisitiza zaidi kuchanganywa kwa sehemu kuwa kitu kimoja, na “mwili” unaweza kueleweka kwanza kama mwili wa kawaida wa binadamu kabla ya kutumiwa kwa kanisa.
  rationale: Tafsiri inadumisha mfano wa Paulo na kitendo cha Mungu cha kutoa heshima, bila kuamua kimya kimya kwamba rejeo ni anatomia pekee au kanisa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Viungo” hutolewa na muktadha; sentensi inabaki sehemu ya hoja inayoendelea kutoka mstari uliotangulia. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
