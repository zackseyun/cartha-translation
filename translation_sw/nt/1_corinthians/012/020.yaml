  text: But as it is[a], there are many parts, yet one body.
translation:
  language: sw
  text: Lakini, kama ilivyo sasa[a], viungo ni vingi, lakini mwili ni mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Lakini sasa, viungo ni vingi, lakini mwili ni mmoja.”'
    reason: νῦν inaweza kutafsiriwa moja kwa moja kuwa “sasa,” ingawa katika muktadha huu “kama ilivyo sasa” huonyesha hali halisi inayozungumziwa.
lexical_decisions:
- source_word: νῦν
  choice: ilivyo sasa
  rationale: Katika hoja hii, νῦν inaonyesha hali halisi inayotofautishwa na hali ya kudhaniwa katika mstari uliotangulia; “ilivyo sasa” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Chembe hii inaanzisha tofauti nyepesi na wazo la mstari uliotangulia.
- source_word: πολλὰ ... μέλη
  choice: viungo ni vingi
  rationale: μέλη ni sehemu za mwili katika mfano unaoendelea. “Viungo” huhifadhi picha ya mwili kwa uwazi na pia kinaweza kutumika kwa maana ya watu wanaounda jumuiya.
- source_word: μὲν ... δὲ
  choice: viungo ni vingi, ila mwili ni mmoja
  rationale: Jozi hii inasawazisha wingi wa viungo na umoja wa mwili; “ila” huonyesha tofauti hiyo kwa kawaida bila kutafsiri kila chembe kivyake.
- source_word: ἓν
  choice: mmoja
  rationale: Nambari hii inasisitiza umoja kinyume na wingi; upatanisho wa kisarufi na “mwili” unahitaji “mmoja.”
- source_word: σῶμα
  choice: mwili
  rationale: Neno hili huhifadhi mfano wa moja kwa moja wa mwili na msisitizo wa umoja katika utofauti.
theological_decisions:
- issue: Maana ya μέλη katika mfano wa mwili
  choice: viungo
  alternative: sehemu za mwili
  rationale: “Viungo” ni neno la kawaida linalohifadhi taswira ya kianatomia na pia maana pana ya washiriki wa jumuiya, bila kuingiza istilahi ya dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya asili, huku ikihifadhi tofauti kati ya wingi wa viungo na umoja wa mwili.
