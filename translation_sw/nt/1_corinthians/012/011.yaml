  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: sw
  text: Lakini Roho huyo mmoja na yuleyule[b] hutenda mambo haya yote[a], akimgawia kila mtu kivyake[c] kama apendavyo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huyatokeza” au “huyatenda.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasisitiza “Roho mmoja na yuleyule,” yaani karama mbalimbali zinatoka katika chanzo kimoja.
    reason: cross_reference
  - marker: c
    text: Au “akimpangia kila mmoja fungu lake.”
    reason: lexical_alternative
  - marker: d
    text: Au “kama achaguavyo” au “kama atakavyo.” Kitenzi cha Kigiriki kinaweza kumaanisha kutaka, kuchagua, au kupenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Lakini mambo haya yote
  rationale: “Mambo haya yote” huhifadhi msisitizo wa jumla wa πάντα ... ταῦτα, na “lakini” huonyesha mpito wenye ulinganisho mdogo kutoka kwenye orodha ya karama mbalimbali kwenda kwenye chanzo chake kimoja.
- source_word: ἐνεργεῖ
  choice: yanafanywa na
  rationale: Muundo huu wa Kiswahili unaonyesha utendaji wenye matokeo wa Roho kwa njia ya kawaida na wazi, bila kufafanua kupita kiasi namna ya utendaji huo; “hutendeshwa na” au “yanatokezwa na” pia yanawezekana.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: Roho huyo mmoja na yuleyule
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba Roho yuleyule ndiye chanzo kimoja cha karama zote tofauti. Herufi kubwa inatumiwa kwa kuwa muktadha unamhusu Roho Mtakatifu.
- source_word: διαιροῦν
  choice: akimgawia
  rationale: Kitenzi hiki huonyesha ugawaji au upangaji wa mafungu. Umoja wa “akimgawia” unarudi kwa Roho na unaunganisha tendo hilo na kila mpokeaji binafsi.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: kila mtu kivyake
  rationale: Huhifadhi maana ya ugawaji wa kibinafsi kwa kila mmoja, kwa lugha ya kawaida ya Kiswahili cha sasa.
- source_word: καθὼς βούλεται
  choice: kama apendavyo
  rationale: Huwasilisha hiari na kusudi la Roho bila kupunguza βούλεται kuwa hisia tu; pia inaweza kueleweka kuwa “kama achaguavyo” au “kama atakavyo.”
theological_decisions:
- issue: Rejeo na uhusika binafsi wa πνεῦμα / βούλεται
  choice: Roho anatendewa kama mhusika binafsi mwenye hiari katika “kama apendavyo.”
  alternative: Kutumia usemi usioonyesha mhusika wazi, kama “kulingana na mapenzi yaliyopo.”
  rationale: Ingawa πνεῦμα ni nomino ya jinsia ya kati kisarufi katika Kigiriki, βούλεται inampa Roho tendo la kutaka au kuchagua. Kiswahili hakihitaji kiwakilishi cha jinsia hapa, hivyo muundo huu huhifadhi uhusika binafsi bila kuingiza jinsia ya kisarufi isiyokuwamo katika lugha lengwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Roho huyo mmoja na yuleyule” huhifadhi msisitizo wa chanzo kimoja, huku “kila mtu kivyake” ikifanya usambazaji wa binafsi ueleweke kwa msomaji wa kawaida.
