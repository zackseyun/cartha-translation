review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall sense well, including the Spirit as the single agent who distributes according to will. However, the passive wording “mambo haya yote yanafanywa na” weakens the Greek active verb ἐνεργεῖ, whose subject is explicitly “the one and the same Spirit.” A direct active construction is more faithful.
  naturalness: “Roho huyo mmoja na yuleyule” is understandable, but “Roho huyo mmoja, ndiye yuleyule” is not necessary; retaining the established phrase with an active verb is clear and suitably formal. “Hutenda” is natural in biblical Standard East African Swahili and avoids the mechanical passive construction.
  terminology: “Roho” (capitalized), “akimgawia,” “kila mtu kivyake,” and “kama apendavyo” appropriately convey the Spirit, distribution, individual recipients, and volition. The lexical-alternative footnotes are retained, with wording adjusted to correspond to their anchors.
  issues:
  - severity: medium
    issue: 'The main verb is rendered passively: “yanafanywa na.”'
    rationale: ἐνεργεῖ is active, with τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα as its explicit subject. “Roho ... hutenda” preserves both the Greek voice and the verse’s emphasis on the Spirit’s agency.
  - severity: low
    issue: Footnote a is placed after the Spirit phrase rather than the verb it explains.
    rationale: The alternative “yanatokezwa/yanatendeshwa” concerns ἐνεργεῖ, so its anchor should follow “hutenda.” Footnote b belongs with the phrase identifying the one and same Spirit.
