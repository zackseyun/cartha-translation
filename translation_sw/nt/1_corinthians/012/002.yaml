base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: sw
  text: Mnajua kwamba mlipokuwa watu wa mataifa, mlipelekwa kwa sanamu zisizosema[a], kwa namna yoyote mliyokuwa mkiongozwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu zisizoweza kusema” au “sanamu bubu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina kitenzi cha hali ya kutendwa pamoja na participle inayosisitiza kupelekwa: “mlipelekwa ... kwa namna yoyote mliyokuwa mkiongozwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Mnajua
  rationale: Ni kauli ya moja kwa moja inayorejelea jambo ambalo Paulo na wasomaji wake wanalifahamu pamoja.
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Inahifadhi maana ya kikabila na kidini ya hali yao ya zamani bila kutumia neno lenye dharau kama ‘wapagani’.
- source_word: πρὸς τὰ εἴδωλα
  choice: kwa sanamu
  rationale: Katika muktadha huu πρός pamoja na hali ya accusative huonyesha kuelekezwa kwenye sanamu kama vitu vya ibada.
- source_word: τὰ ἄφωνα
  choice: zisizoweza kusema
  rationale: Kauli hii ya kawaida na iliyo wazi inasisitiza kutoweza kwa sanamu kusema, jambo linalolingana na mjadala unaofuata kuhusu usemi unaotokana na Roho.
- source_word: ὡς ἂν
  choice: kwa namna yoyote
  rationale: 'Inahifadhi maana isiyoainisha namna hususa: waliongozwa kwa njia yoyote ile.'
- source_word: ἤγεσθε
  choice: mlivyoongozwa
  rationale: Kauli tendwa inadumishwa ili kuonyesha kwamba walikuwa chini ya uvutano au uongozi mwingine.
- source_word: ἀπαγόμενοι
  choice: mliongozwa na kupelekwa
  rationale: Inabeba wazo la kuongozwa mbali na kupelekwa kuelekea ibada ya sanamu, huku ikidumisha msisitizo wa hali ya kutendwa.
theological_decisions:
- issue: Maana ya ἔθνη kuhusiana na maisha ya zamani ya Wakorintho
  choice: watu wa mataifa
  alternative: wapagani
  rationale: ‘Watu wa mataifa’ huhifadhi utambulisho wa kikabila na kidini uliomo katika neno la Kigiriki bila kuongeza hukumu kali ya kimaadili.
- issue: Tofauti kati ya sanamu zisizoweza kusema na usemi unaotokana na Roho katika muktadha
  choice: sanamu zisizoweza kusema
  alternative: sanamu bubu; sanamu zisizonena
  rationale: Tafsiri hii hudumisha wazi kutoweza kwa sanamu kusema bila kuingiza ufafanuzi wa kitheolojia usiotajwa moja kwa moja katika mstari.
- issue: Msisitizo wa hali ya kutendwa katika ἤγεσθε ἀπαγόμενοι
  choice: mliongozwa na kupelekwa ... mlivyoongozwa
  alternative: mlifuata sanamu
  rationale: Muundo wa kutendwa na marudio hudumisha wazo kwamba walibebwa na uvutano wa zamani, badala ya kupunguza kauli kuwa tendo lao la hiari pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Watu wa mataifa’ ni la kawaida katika lugha ya Biblia na huepuka dharau; ‘zisizoweza kusema’ ni wazi zaidi kwa msomaji wa sasa kuliko ‘bubu’. Marudio katika sehemu ya mwisho yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kigiriki, ingawa yanaifanya sentensi isikike nzito kidogo.
