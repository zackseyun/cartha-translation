  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: sw
  text: Na kama sikio likisema, “Kwa kuwa mimi si jicho, mimi si sehemu ya mwili,” hilo halifanyi sikio lisiwe sehemu ya mwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachoendeleza mfano wa viungo vya mwili kutoka mstari uliotangulia.
- source_word: ἐὰν εἴπῃ
  choice: kama ... likisema
  rationale: Muundo wa sharti wenye aoristi subjunktivu unaonyesha hali ya kudhaniwa; Kiswahili cha kawaida hutumia ‘kama ... likisema’.
- source_word: τὸ οὖς
  choice: sikio
  rationale: Neno la kawaida la kiungo hiki; ngeli yake pia huendeleza uhuishaji wa sikio katika mfano.
- source_word: Ὅτι
  choice: Kwa kuwa
  rationale: Hapa ὅτι inaleta sababu iliyomo katika kauli ya sikio, si taarifa ya moja kwa moja tu.
- source_word: ὀφθαλμός
  choice: jicho
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kiungo hiki.
- source_word: ἐκ τοῦ σώματος
  choice: sehemu ya mwili
  rationale: Katika muktadha huu, ἐκ τοῦ σώματος hueleza kuwa wa mwili au kuwa sehemu yake. ‘Sehemu ya mwili’ ni Kiswahili wazi na cha asili, na imerudiwa katika kauli na jibu ili kuhifadhi athari ya balagha.
- source_word: οὐ παρὰ τοῦτο
  choice: hilo halilifanyi
  rationale: Nahau hii inakataa kwamba sababu iliyotajwa inaweza kuleta hitimisho hilo; muundo huu ni wa kawaida katika Kiswahili.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: lisiwe sehemu ya mwili
  rationale: Huhifadhi ukanushaji wa hitimisho na marudio ya wazo la ἐκ τοῦ σώματος bila kuunda Kiswahili kisicho cha kawaida.
theological_decisions:
- issue: Kulainisha balagha ya mfano wa mwili
  choice: Kurudia ‘sehemu ya mwili’ katika kauli ya sikio na katika jibu
  alternative: ‘hilo halimaanishi kwamba si sehemu ya mwili’ au tafsiri ya kiformal zaidi, ‘si wa mwili’
  rationale: Marudio yanaakisi muundo wa Kigiriki na kuonyesha hoja ya Paulo kuhusu kuwa ndani ya mwili, bila kuongeza ufafanuzi wa kimadhehebu. Kiswahili ‘sehemu ya mwili’ huwasilisha maana ya kimuktadha ya ἐκ kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Uhuishaji wa ‘sikio’ umehifadhiwa kwa upatanisho wa ngeli (‘likisema’, ‘halilifanyi’). Hakuna tanbihi iliyohitajika, kwa kuwa marudio ya Kigiriki yanaweza kuhifadhiwa kwa Kiswahili cha kawaida.
