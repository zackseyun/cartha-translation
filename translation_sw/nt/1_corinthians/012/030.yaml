  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: sw
  text: Kwani wote wana karama za kuponya[a]? Kwani wote hunena kwa lugha[b]? Kwani wote hufasiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “karama za maponyo.” Katika Kigiriki, “karama” na “maponyo” viko katika wingi.'
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ndimi.” Katika muktadha huu, neno hilo linarejelea karama inayojulikana kwa kawaida kama kunena kwa lugha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Kwani wote ...?
  rationale: Maswali yanayoanzishwa kwa μή yanatarajia jibu la kukataa. Katika Kiswahili, “Kwani wote ...?” huwasilisha kwa kawaida changamoto ya balagha yenye jibu linalotarajiwa kuwa “la,” bila kuongeza jibu hilo ndani ya maandishi.
- source_word: χαρίσματα
  choice: karama
  rationale: “Karama” ni neno la kawaida na lenye heshima kwa kipawa kinachotolewa kwa neema katika muktadha huu.
- source_word: ἰαμάτων
  choice: za kuponya
  rationale: Usemi huu ni wa asili katika Kiswahili na unaonyesha utendaji wa karama hizo. Kwa kuwa nomino ya Kigiriki iko katika wingi, umbo halisi zaidi “maponyo” limeelezwa katika tanbihi ili tofauti hiyo isipotee.
- source_word: γλώσσαις
  choice: kwa lugha
  rationale: Katika muktadha wa 1 Wakorintho 12–14, neno hili linataja karama inayojulikana kama kunena kwa lugha. Tafsiri “kwa lugha” ni ya kawaida na pia huhifadhi maana ya msingi ya γλῶσσα.
- source_word: λαλοῦσιν
  choice: hunena
  rationale: Kiambishi cha mazoea “hu-” kinaonyesha sifa au tendo la kawaida, sawasawa na wakati wa sasa unaotumiwa kwa ujumla hapa; “kunena” pia linafaa kwa rejesta ya maandiko.
- source_word: διερμηνεύουσιν
  choice: hufasiri
  rationale: Katika muktadha wa kunena kwa lugha, kitenzi hiki humaanisha kuwasilisha usemi huo kwa namna inayoeleweka na wengine. “Hufasiri” ni sahihi kuliko kulazimisha maana finyu ya kutafsiri lugha ya kawaida.
theological_decisions:
- issue: Asili ya maswali ya Paulo yenye μή
  choice: Kuyatafsiri kama maswali ya balagha yanayotarajia jibu la kukataa
  alternative: Kuyatafsiri kama maswali ya kawaida yasiyoashiria jibu linalotarajiwa
  rationale: Muundo wa Kigiriki unasisitiza kwamba si kila mwamini aliye na kila karama. “Kwani wote ...?” huhifadhi msisitizo wa utofauti wa karama bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa. Mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Kwani” huhifadhi nguvu ya maswali ya balagha; “hunena” na “hufasiri” zinaonyesha hali ya kawaida badala ya tendo linaloendelea wakati huo.
