translation:
  language: sw
  text: Na kuna aina mbalimbali za huduma[a], naye Bwana ni yeye yule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aina mbalimbali za utumishi” au “njia mbalimbali za kutumikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Tena
  rationale: Inaunganisha mstari huu na kauli sambamba za mistari 4–6 kwa Kiswahili cha kawaida, huku ikionyesha nyongeza katika mfululizo.
- source_word: διαιρέσεις
  choice: za namna mbalimbali
  rationale: Katika muktadha huu neno linaonyesha utofauti wa aina, si migawanyiko ya kimakundi. Usemi huu unaeleweka kwa urahisi na hauashirii uhasama.
- source_word: διακονιῶν
  choice: huduma
  rationale: Neno hili linaweza kumaanisha huduma au utumishi. 'Huduma' linafaa kwa kazi mbalimbali zinazofanywa katika jumuiya ya waamini bila kulifanya neno kuwa cheo rasmi.
- source_word: εἰσιν
  choice: kuna
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kuwepo kwa aina mbalimbali za huduma.
- source_word: ὁ αὐτὸς
  choice: ni yuleyule
  rationale: Linasisitiza kwamba Bwana habadiliki ingawa huduma zinatofautiana, na linadumisha muundo sambamba wa mistari 4–6.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi cheo chenye uzito wa kitheolojia bila kufafanua mhusika ndani ya maandishi.
theological_decisions:
- issue: Mhusika anayeitwa “Bwana” katika mpangilio wa 1 Wakorintho 12:4–6
  choice: Cheo “Bwana” kimehifadhiwa bila kuongezwa ufafanuzi; katika muktadha huenda zaidi kinamhusu Bwana Yesu.
  alternative: Kumwelewa kwa ujumla kuwa Bwana/Mungu.
  rationale: Muktadha una mpangilio wa Roho, Bwana, na Mungu. Tafsiri haiamui wazi zaidi kuliko maandishi ya Kigiriki, hivyo inadumisha uwezekano wa maana pamoja na uzito wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa msomaji wa leo, huku usambamba na msisitizo wa maandishi asilia vikihifadhiwa.
