id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: sw
  text: Lakini jicho haliwezi kuuambia mkono, “Sina haja nawe,” wala kichwa hakiwezi kuiambia miguu, “Sina haja nanyi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: haliwezi
  rationale: Inaonyesha kutoweza, si kutofaa tu, na ni usemi wa kawaida wa Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Inaendeleza utofautishaji na hoja iliyotangulia kuhusu kutegemeana kwa viungo vya mwili.
- source_word: ὁ ὀφθαλμός
  choice: jicho
  rationale: Inahifadhi taswira halisi ya kiungo cha mwili katika mfano wa Paulo.
- source_word: τῇ χειρί
  choice: mkono
  rationale: Inahifadhi kiungo cha mwili na kutenda kama yambwa ya kitenzi ‘kuuambia.’
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Sina haja nawe
  rationale: Inahifadhi dhana ya χρεία, yaani ‘haja,’ pamoja na umoja wa σου kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἢ πάλιν
  choice: wala
  rationale: Katika mfululizo huu wa kauli hasi, ‘wala’ huunganisha mfano wa pili kwa Kiswahili cha asili; wazo la mfano mwingine unaofanana linaeleweka katika muundo.
- source_word: ἡ κεφαλή
  choice: kichwa
  rationale: Inahifadhi taswira ya kiungo cha mwili bila kuiongezea tafsiri.
- source_word: τοῖς ποσίν
  choice: miguu
  rationale: Inahifadhi wingi wa nomino ya Kigiriki na taswira ya mwili.
- source_word: ὑμῶν
  choice: nanyi
  rationale: Kiswahili kinaonyesha wazi wingi wa nafsi ya pili, hivyo kinatofautisha miguu na mkono bila kuhitaji tanbihi.
theological_decisions:
- issue: Lugha ya mfano wa mwili kuhusu kutegemeana kwa washiriki
  choice: Kuhifadhi majina halisi ya viungo vya mwili bila maelezo ya ziada
  alternative: Kuwataja wazi washiriki wa kanisa katika maandishi
  rationale: Hoja ya Paulo inategemea mfano wenyewe; kuufafanua kuwa washiriki wa kanisa ndani ya mstari kungekuwa ufafanuzi badala ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa ‘hakiwezi’ katika kishazi cha pili kunakamilisha kitenzi kilichoachwa katika Kigiriki na kufanya sentensi iwe wazi na ya kawaida kwa Kiswahili. Tofauti ya umoja ‘nawe’ na wingi ‘nanyi’ inawakilisha moja kwa moja σου na ὑμῶν.
