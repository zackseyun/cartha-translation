  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: sw
  text: kwa mwingine, matendo ya miujiza[a]; kwa mwingine, unabii; kwa mwingine, kupambanua roho; kwa mwingine, aina za ndimi; na kwa mwingine, kufasiri ndimi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo ya nguvu” au “matendo makuu.”
    reason: lexical_alternative
  - marker: b
    text: Au “aina za lugha” na “kufasiri lugha.” Neno la Kigiriki linaweza kumaanisha “ndimi” au “lugha”; “ndimi” limetumiwa hapa ili kutohitimisha mapema aina ya karama inayozungumziwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: matendo ya miujiza
  rationale: Kirai hiki kinaeleza utendaji au matokeo ya nguvu unaodhihirika katika matendo ya kimiujiza. Tafsiri hii ni ya kawaida na inafaa katika orodha ya karama, huku maelezo ya chini yakihifadhi tafsiri zilizo karibu zaidi na muundo wa Kigiriki.
- source_word: προφητεία
  choice: unabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa karama inayotajwa, bila kuibana maana iwe utabiri wa wakati ujao pekee.
- source_word: διακρίσεις πνευμάτων
  choice: kupambanua roho
  rationale: Kitenzi-jina ‘kupambanua’ kinaeleza kitendo cha kutofautisha au kutathmini, na ‘roho’ kinaacha wazi ni roho zipi zinazokusudiwa. Ingawa Kigiriki kina wingi katika διακρίσεις, Kiswahili cha asili hutumia kitenzi-jina bila kupoteza dhana ya matendo au namna mbalimbali za upambanuzi.
- source_word: γένη γλωσσῶν
  choice: aina mbalimbali za ndimi
  rationale: ‘Aina mbalimbali’ linaonyesha makundi au namna tofauti. ‘Ndimi’ linadumisha kwa kadiri iwezekanavyo mvutano wa γλῶσσαι kati ya ndimi na lugha katika mjadala wa karama za kiroho.
- source_word: ἑρμηνεία γλωσσῶν
  choice: kufasiri ndimi
  rationale: ‘Kufasiri’ linaweza kumaanisha kuweka ujumbe katika namna inayoeleweka bila kuamua mapema kama tendo hilo ni tafsiri ya lugha inayojulikana au ufafanuzi wa usemi wa aina nyingine.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: mwingine
  rationale: Kurudiwa kwa ‘mwingine’ kunaonyesha ugawaji wa karama kwa watu tofauti. Tofauti ndogo ya msamiati kati ya ἄλλῳ na ἑτέρῳ haijakaziwa kwa sababu hapa haionyeshi wazi tofauti kubwa ya maana.
theological_decisions:
- issue: Maana ya δυνάμεων katika orodha ya karama
  choice: matendo ya miujiza
  alternative: utendaji wa nguvu; matendo makuu
  rationale: Katika muktadha huu δυνάμεις kwa kawaida hurejelea matendo yenye nguvu yasiyo ya kawaida. ‘Miujiza’ huwasilisha rejeo linalowezekana zaidi, huku maelezo ya chini yakihifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
- issue: Maana ya γλωσσῶν
  choice: ndimi
  alternative: lugha
  rationale: Neno la Kigiriki linaweza kumaanisha ndimi au lugha. ‘Ndimi’ linahifadhi utata wa jambo linalojadiliwa bila kuamua kama ni lugha za kibinadamu zinazojulikana, usemi wa kiroho, au kundi pana zaidi.
- issue: Rejeo la πνευμάτων
  choice: roho
  alternative: semi za kiroho; roho zilizo nyuma ya semi; roho za wanadamu
  rationale: Kigiriki hakibainishi ni roho zipi zinazokusudiwa. Tafsiri pana inaepuka kuingiza hitimisho la kimadhehebu au la kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa orodha na urudiaji wa ‘mwingine’ umehifadhiwa. Maneno ya kiufundi yameepukwa isipokuwa ‘unabii,’ ambalo ni la kawaida katika muktadha huu.
