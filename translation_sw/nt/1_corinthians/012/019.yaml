translation:
  language: sw
  text: Kama vyote vingekuwa kiungo kimoja, mwili ungekuwa wapi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Kama
  rationale: Huanzisha hali ya kudhaniwa katika hoja; “kama” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: δὲ
  choice: —
  rationale: Hapa ni kiunganishi hafifu kinachoendeleza na kutofautisha hoja. Kiswahili kinaweza kuonyesha uhusiano huo kwa ufasaha bila kukitafsiri kwa neno maalumu.
- source_word: ἦν
  choice: vingekuwa
  rationale: Wakati usiotimilika wa kitenzi “kuwa” katika sharti la kudhaniwa unaonyeshwa kwa hali ya masharti ya Kiswahili; upatanisho wa ngeli unafuata “vyote.”
- source_word: τὰ πάντα
  choice: vyote
  rationale: Katika mfano wa mwili, neno hili linarejelea sehemu zote kwa pamoja, si vitu vyote kwa maana pana.
- source_word: ἓν
  choice: kimoja
  rationale: Namba moja imepatana na ngeli ya “kiungo.”
- source_word: μέλος
  choice: kiungo
  rationale: “Kiungo” hutaja sehemu ya mwili na kuhifadhi mfano wa Paulo kwa lugha ya kawaida na yenye hadhi; “mwanachama” hapa ingefanya maana ya kijamii kuwa ya moja kwa moja kupita kiasi.
- source_word: ποῦ
  choice: ungekuwa wapi?
  rationale: Swali hili la balagha linauliza juu ya kuwapo kwa mwili katika hali hiyo ya kudhaniwa; muundo huu ni wa asili katika Kiswahili.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: Hurejelea mwili unaozungumziwa katika mfano; Kiswahili kwa kawaida halihitaji kibainishi kinacholingana na neno la Kigiriki.
theological_decisions:
- issue: Upeo wa mfano wa mwili
  choice: Kuhifadhi usemi “mwili” bila kuongeza “wa Kristo”
  alternative: Kutafsiri kwa ufafanuzi kuwa “mwili wa Kristo”
  rationale: Ingawa muktadha mpana unahusu kanisa kama mwili wa Kristo, mstari huu unasema tu “mwili.” Tafsiri inalinda mfano na mvutano wa muktadha bila kuongeza ufafanuzi wa kitheolojia usiotajwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, na msamiati wa mfano wa mwili umewekwa wazi bila kuufasiri kupita maandishi.
