  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: sw
  text: Kuna aina mbalimbali za karama[a], lakini Roho ni yuleyule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “migawanyo” au “tofauti za karama.” Kigiriki kinakazia utofauti uliomo katika karama, si mgawanyiko kanisani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: aina mbalimbali
  rationale: Katika muktadha huu neno linaonyesha tofauti au namna mbalimbali ndani ya karama, si migawanyiko ya kanisa. Kauli hii ni ya kawaida na inaeleweka kwa urahisi katika Kiswahili.
- source_word: δὲ ... δὲ
  choice: — ... lakini
  rationale: δὲ ya kwanza ina nguvu nyepesi ya kuendeleza au kuhamisha hoja, ambayo Kiswahili cha kawaida hakihitaji kuitaja wazi hapa. Ya pili inaonyesha utofautishaji kati ya wingi wa karama na umoja wa Roho, hivyo imetafsiriwa ‘lakini.’
- source_word: χαρισμάτων
  choice: karama
  rationale: ‘Karama’ ni neno la Kiswahili linalotumika kwa kipawa kinachotolewa kwa neema, hasa katika muktadha wa vipawa vya kiroho, bila kulazimika kuongeza ufafanuzi katika matini.
- source_word: τὸ ... αὐτὸ
  choice: yuleyule
  rationale: Kauli hii inasisitiza kwamba, licha ya tofauti za karama, Roho anayehusika ni mmoja na ndiye yuleyule. ‘Yuleyule’ ni ya asili kwa kurejelea nafsi.
- source_word: πνεῦμα
  choice: Roho
  rationale: Muktadha wa 1 Wakorintho 12:3–11 unaonyesha kuwa anayerejelewa ni Roho Mtakatifu. Herufi kubwa inaonyesha rejeo hilo bila kupanua matini.
theological_decisions:
- issue: Rejeo la πνεῦμα
  choice: Roho Mtakatifu, akitajwa kwa kifupi kama ‘Roho’
  alternative: roho ya mwanadamu au nguvu ya kiroho isiyo nafsi
  rationale: Muktadha wa karibu humtambulisha Roho kuwa chanzo na mgawaji wa karama. Tafsiri ‘Roho’ huhifadhi ufupi wa Kigiriki na rejeo lake la kimungu.
- issue: Uhusiano kati ya utofauti na umoja
  choice: Utofauti halali wa karama unawekwa kinyume na utambulisho wa Roho yuleyule
  alternative: Migawanyiko au makundi yanayopingana kanisani
  rationale: Διαιρέσεις hapa inaeleza namna tofauti za karama; haidai kwamba karama zinasababisha migawanyiko ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Aina mbalimbali’ ni wazi kwa wasomaji wa kawaida, huku ‘karama’ ikihifadhi istilahi inayofaa muktadha wa vipawa vya kiroho.
