  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: sw
  text: Na kuna aina mbalimbali za utendaji[a], lakini ni Mungu yuleyule atendaye mambo yote katika wote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aina mbalimbali za matendo.” Neno la Kigiriki linaweza kumaanisha matendo yanayotendeka au matokeo ya utendaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “katika wote.” Kigiriki hakitaji nomino wazi; katika muktadha, yaelekea kurejelea watu wote ambao Mungu hutenda kazi miongoni mwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: namna mbalimbali
  rationale: Katika mfululizo wa mistari 4–6, neno hili linaonyesha utofauti wa aina bila kudokeza mgawanyiko au ugomvi; usemi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: ἐνεργημάτων
  choice: utendaji
  rationale: Nomino hii huelekea kumaanisha matendo au matokeo yanayotokana na nguvu inayofanya kazi. ‘Utendaji’ ni wa asili katika Kiswahili na unadumisha uhusiano wa kimsamiati na ἐνεργῶν (‘atendaye’).
- source_word: ὁ δὲ αὐτὸς θεός
  choice: lakini ni Mungu yuleyule
  rationale: 'δέ inaonyesha utofauti mpole: utendaji una namna mbalimbali, lakini mtendaji wa yote ni Mungu yuleyule. Kitenzi ‘ni’ kinaongezwa kwa Kiswahili cha asili katika kishazi hiki kisicho na kitenzi katika Kigiriki.'
- source_word: ὁ ἐνεργῶν
  choice: atendaye
  rationale: Kivumishi-endelevu cha Kigiriki kimetafsiriwa kwa kishazi cha uhusiano cha Kiswahili, huku kikiendeleza dhana ya utendaji iliyo katika ἐνεργημάτων.
- source_word: τὰ πάντα
  choice: mambo yote
  rationale: Tafsiri hii inadumisha upana wa kifungu cha Kigiriki bila kukibana kuwa karama zinazotajwa katika muktadha pekee.
- source_word: ἐν πᾶσιν
  choice: ndani ya wote
  rationale: Hii inadumisha kwa karibu kutotajwa kwa nomino katika Kigiriki. Katika muktadha, ‘wote’ inaelekea kurejelea watu au washiriki wote wa jumuiya, lakini tafsiri kuu haiongezi nomino hiyo.
theological_decisions:
- issue: Upeo wa utendaji wa Mungu katika τὰ πάντα ἐν πᾶσιν
  choice: mambo yote ndani ya wote
  alternative: mambo yote ndani ya watu wote; mambo haya yote ndani ya wote
  rationale: Tafsiri inadumisha upana na utata halisi wa Kigiriki. Muktadha unahusu utendaji wa karama miongoni mwa waamini, lakini kifungu chenyewe hakitaji wazi ‘watu’ wala hakisemi ‘mambo haya’; hivyo hakibani dai hilo zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mungu yuleyule’ inadumisha msisitizo wa umoja katikati ya utofauti; ‘ndani ya wote’ huhifadhi kwa makusudi nomino isiyotajwa katika Kigiriki.
