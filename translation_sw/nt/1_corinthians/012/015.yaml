reference: 1 Corinthians 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: sw
  text: Mguu ukisema[a], “Kwa kuwa mimi si mkono, mimi si sehemu ya mwili,” hiyo haimaanishi kuwa si sehemu ya mwili, sivyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa muundo wa wazi zaidi: “Ikiwa mguu utasema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: ukisema
  rationale: 'Muundo wa ki- ukifuatiwa na kitenzi unaeleza hali ya kudhaniwa kwa Kiswahili cha kawaida: ‘ikiwa mguu utasema’ au ‘mguu ukisema.’'
- source_word: ὁ πούς
  choice: mguu
  rationale: Taswira halisi ya kiungo cha mwili imehifadhiwa kwa sababu ndiyo msingi wa mfano wa Paulo.
- source_word: Ὅτι
  choice: Kwa kuwa
  rationale: Hapa ὅτι inaleta sababu inayotolewa na mguu, si taarifa ya moja kwa moja tu; ‘kwa kuwa’ huonyesha mantiki hiyo kwa lugha yenye hadhi na ya kawaida.
- source_word: χείρ
  choice: mkono
  rationale: Tafsiri halisi inadumisha utofautishaji wa viungo viwili katika mfano.
- source_word: ἐκ τοῦ σώματος
  choice: sehemu ya mwili
  rationale: Katika muktadha huu, kirai hiki kinaonyesha kuwa kiungo ni sehemu ya mwili au kinauhusiano wa kuwa ndani yake. ‘Sehemu ya mwili’ ni Kiswahili cha asili zaidi kuliko tafsiri ya kimuundo ‘kutoka mwilini,’ ambayo ingeweza kupotosha maana.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: hiyo haimaanishi kuwa si sehemu ya mwili, sivyo?
  rationale: Ukanushaji maradufu na swali la balagha vimewasilishwa kwa muundo wa kawaida wa Kiswahili unaokataa hitimisho la mguu bila kupoteza nguvu ya swali.
theological_decisions:
- issue: Kiwango cha kulainisha ukanushaji maradufu katika mfano wa mwili
  choice: Kutumia ‘hiyo haimaanishi kuwa si sehemu ya mwili, sivyo?’ huku kudumisha swali la balagha na marudio ya ‘sehemu ya mwili.’
  alternative: ‘Je, kwa sababu hiyo si sehemu ya mwili?’
  rationale: Muundo mbadala unaweza kueleweka kwa namna mbili katika Kiswahili. Chaguo kuu linaonyesha wazi kwamba sababu iliyotajwa haibatilishi nafasi ya mguu katika mwili, bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya mguu, mkono na mwili imehifadhiwa; usemi usio wa kawaida ‘kutoka mwilini’ umeepukwa ili maana ya kuwa sehemu ya mwili iwe wazi.
