lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Badala yake
  rationale: Muktadha unahitaji pingamizi lenye nguvu. Kiswahili hiki ni cha asili na kinaonyesha kuwa kinyume chake ndicho kweli; hata hivyo, kiongezi cha Kigiriki πολλῷ μᾶλλον kinaelezwa katika tanbihi kwa sababu hakijawakilishwa moja kwa moja katika kirai hiki.
- source_word: τὰ δοκοῦντα
  choice: vinavyoonekana
  rationale: Huhifadhi tofauti kati ya jinsi viungo vinavyodhaniwa au kuonekana na hali yake halisi.
- source_word: μέλη τοῦ σώματος
  choice: viungo vya mwili
  rationale: “Viungo” ni neno la kawaida na la heshima katika Kiswahili kwa sehemu zinazounda mwili, nalo linahifadhi sitiari halisi ya Paulo.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: kuwa dhaifu zaidi
  rationale: Huwakilisha hali ya ulinganisho katika ἀσθενέστερα na kuunganika kwa ὑπάρχειν na δοκοῦντα kwa Kiswahili cha kawaida.
- source_word: ἀναγκαῖά ἐστιν
  choice: ni vya lazima
  rationale: Ni tafsiri ya karibu ya wazo la ulazima; huepuka kuongeza maelezo yasiyo katika mstari.
theological_decisions:
- issue: Nguvu ya sitiari ya mwili katika muktadha wa kanisa
  choice: Kudumisha “viungo vya mwili” bila kuvibadili kuwa “waumini wa kanisa.”
  alternative: Kutafsiri kwa ufafanuzi kama watu au washiriki wa kanisa.
  rationale: Ingawa muktadha unatumia mwili kuelezea kanisa, mstari wenyewe unazungumzia viungo vya mwili. Kudumisha picha hiyo huhifadhi hoja ya Paulo bila kuifafanua kupita chanzo.
- issue: Udhibitisho wa πολλῷ μᾶλλον
  choice: Kutoa nguvu yake kupitia “Badala yake” na tanbihi inayotaja maana ya moja kwa moja.
  alternative: “Lakini, zaidi sana, viungo...”
  rationale: Kigiriki kina kiongezi dhahiri, lakini uhamishaji wa moja kwa moja huwa mgumu katika Kiswahili hapa. Tanbihi huhifadhi ushahidi huo na uwezekano wa usomaji mkazo zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Viungo” hudumisha sitiari ya mwili kwa lugha inayoeleweka kwa wasomaji wa kawaida; “vya lazima” ni wazi kuliko istilahi nzito zaidi kama “visivyoweza kukosekana.”
