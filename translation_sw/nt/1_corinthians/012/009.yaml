  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: sw
  text: Mwingine hupewa imani[a] kwa Roho yuleyule; na mwingine hupewa karama za maponyo[b] kwa Roho mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu” au “kumtumaini” badala ya “imani” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “karama za maponyo”; nomino zote mbili ziko katika wingi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: mwingine hupewa
  rationale: Dativi hii inaendeleza mgawanyo wa karama kutoka mstari uliotangulia. Kiswahili cha kawaida huhitaji kitenzi kinachodokezwa, hivyo “hupewa” kinawekwa wazi bila kubadili maana.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na yenye upana unaofaa kwa πίστις. Katika muktadha huu ni karama inayotolewa na Roho, lakini tafsiri haibainishi zaidi aina yake kuliko maandishi.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: kwa Roho yuleyule
  rationale: “Kwa” linaonyesha utendaji au chanzo cha karama kwa Kiswahili cha kawaida, na “yuleyule” linahifadhi msisitizo wa αὐτῷ.
- source_word: ἄλλῳ
  choice: mwingine hupewa
  rationale: Neno hili linaendeleza mpangilio wa kugawiwa watu tofauti. Kutumia muundo uleule kwa ἑτέρῳ na ἄλλῳ ni kwa kawaida na hakulazimishi tofauti isiyo wazi katika muktadha.
- source_word: χαρίσματα
  choice: karama
  rationale: “Karama” ni neno la Kiswahili linalotumika kwa vipawa vinavyotolewa kwa neema na linafaa katika muktadha wa 1 Wakorintho 12.
- source_word: ἰαμάτων
  choice: za uponyaji
  rationale: Muundo “karama za uponyaji” unasomeka kwa kawaida. Tanbihi inahifadhi taarifa kwamba Kigiriki kina nomino zote mbili katika wingi, jambo lisiloonyeshwa kikamilifu na umbo la kawaida la Kiswahili “uponyaji.”
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: kwa Roho huyo mmoja
  rationale: “Kwa” linaonyesha utendaji; “huyo mmoja” linahifadhi tofauti ya ἑνὶ, ambayo inasisitiza umoja wa Roho badala ya kusawazisha usemi huu na “yuleyule” wa kishazi cha kwanza.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa karama za Roho
  choice: imani
  alternative: uaminifu au tumaini
  rationale: “Imani” huhifadhi maana kuu ya neno bila kuingiza fundisho maalumu kuhusu namna karama hii inavyofanya kazi. Maana nyingine zinazowezekana zinawekwa katika tanbihi.
- issue: Rejeo la πνεύματι
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho
  rationale: Muktadha wa 1 Wakorintho 12 unaonyesha kwamba mtoaji wa karama ni Roho Mtakatifu. Herufi kubwa inaonyesha rejeo hilo bila kuongeza madai zaidi ya muktadha.
- issue: Wingi wa χαρίσματα ἰαμάτων
  choice: karama za uponyaji
  alternative: karama ya kuponya
  rationale: Tafsiri kuu inadumisha wingi wa “karama,” na tanbihi inaeleza kwamba Kigiriki kina “karama” na “uponyaji” zote katika wingi; hivyo haijafungwa kwa nadharia fulani kuhusu aina au idadi ya uponyaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hupewa” umeongezwa kwa sababu kitenzi kinadokezwa katika Kigiriki lakini kinahitajika ili sentensi iwe ya kawaida kwa Kiswahili. “Yuleyule” na “huyo mmoja” zinahifadhi kwa kiasi kinachowezekana tofauti kati ya αὐτῷ na ἑνὶ.
