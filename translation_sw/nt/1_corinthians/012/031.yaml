  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: sw
  text: Lakini yatamanini kwa bidii karama zilizo kuu zaidi.[a] Nami nitawaonyesha njia iliyo bora kupita kiasi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini mnazitamani kwa bidii karama zilizo kuu zaidi.” Umbo la Kigiriki ζηλοῦτε linaweza kueleweka hapa kama amri au kama kauli elezi.
    reason: alternative_reading
  - marker: b
    text: Kijadi, “njia iliyo bora sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: yatamanini kwa bidii
  rationale: Kitenzi hiki huonyesha hamu kubwa au juhudi yenye ari. Muundo wa amri umewekwa katika matini kuu, huku uwezekano wa kauli elezi ukihifadhiwa katika tanbihi.
- source_word: χαρίσματα
  choice: karama
  rationale: Katika muktadha huu neno 'karama' linaeleweka kwa kawaida kuwa vipawa vitolewavyo kwa neema, bila kulazimika kuongeza kivumishi kisichopo katika kifungu hiki.
- source_word: μείζονα
  choice: zilizo kuu zaidi
  rationale: Huhifadhi maana ya ulinganisho ya kitu kilicho kikubwa au muhimu zaidi bila kufafanua kupita kiasi namna ya ukuu wake.
- source_word: καὶ ἔτι
  choice: Nami
  rationale: Kiunganishi hiki kinaendeleza hoja na kumwelekeza msomaji kwenye hatua inayofuata; wazo la kuzidi linaonyeshwa pia katika fungu linalofuata.
- source_word: καθ’ ὑπερβολὴν
  choice: iliyo bora zaidi kuliko zote
  rationale: Usemi huu unaonyesha ubora unaopita kiwango cha kawaida. Tafsiri hii ni ya asili katika Kiswahili na huonyesha kiwango hicho cha juu bila kutumia tungo nzito.
- source_word: ὁδὸν
  choice: njia
  rationale: Huhifadhi sitiari ya njia kama mwenendo au namna ya kuishi, ambayo inaingiza vizuri maelezo kuhusu upendo katika sura inayofuata.
- source_word: δείκνυμι
  choice: nitawaonyesha
  rationale: Ingawa Kigiriki kina wakati wa sasa, Kiswahili cha wakati ujao kinaonyesha kwa kawaida kwamba Paulo yuko karibu kuifafanua njia hiyo katika sehemu inayofuata.
theological_decisions:
- issue: Nguvu ya ζηλοῦτε
  choice: 'amri: ''yatamanini kwa bidii'''
  alternative: 'kauli elezi: ''mnazitamani kwa bidii'''
  rationale: Umbo la Kigiriki linaweza kueleweka kama amri au kauli elezi. Amri inafaa mtiririko wa mawaidha wa sura hii, lakini uwezekano mwingine umehifadhiwa katika tanbihi ili kutoficha utata halisi.
- issue: Uhusiano wa 'njia' na karama
  choice: njia iliyo bora zaidi kuliko zote
  alternative: njia ipitayo kiasi
  rationale: Tafsiri inaonyesha ubora wa ajabu wa njia inayofuata bila kuamua kimadhehebu jinsi upendo unavyohusiana na matumizi au cheo cha karama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. 'Karama' imechaguliwa kwa sababu imezoeleka katika muktadha huu wa kibiblia, na sitiari ya 'njia' imehifadhiwa.
