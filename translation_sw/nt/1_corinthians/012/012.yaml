id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: sw
  text: Kwa maana, kama vile mwili ulivyo mmoja na una viungo vingi, na viungo vyote vya mwili, ingawa ni vingi, ni mwili mmoja, ndivyo alivyo Masihi[a] pia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta”; hapa limetafsiriwa “Masihi” ili kuhifadhi maana hiyo.
    reason: alternative_reading
  - marker: b
    text: Kwa maneno halisi, Paulo anasema, “ndivyo alivyo Masihi pia.” Huu ni usemi uliofupishwa ambao aya zinazofuata zinafafanua kwa kuonyesha jinsi viungo vingi vinavyofanya mwili mmoja.
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Kwa maana, kama vile
  rationale: “Kwa maana” inaendeleza hoja ya Paulo kwa kuonyesha sababu, huku “kama vile” ikihifadhi ulinganisho wenye msisitizo.
- source_word: σῶμα
  choice: mwili
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa mwili, na linadumisha sitiari kuu ya aya.
- source_word: ἕν
  choice: mmoja
  rationale: Katika upatanisho wa Kiswahili na nomino “mwili,” “mmoja” huonyesha umoja wa mwili bila kupunguza wingi wa viungo vyake.
- source_word: μέλη
  choice: viungo
  rationale: “Viungo” ni neno la kawaida kwa sehemu za mwili katika sitiari hii na linafaa zaidi kuliko “wanachama,” ambalo lingeingiza matumizi ya kijamii mapema mno.
- source_word: πολλὰ ὄντα
  choice: ingawa ni vingi
  rationale: 'Muundo huu unaonyesha maana ya ukubalifu: viungo ni vingi, lakini kwa pamoja ni mwili mmoja.'
- source_word: ἕν ἐστιν σῶμα
  choice: ni mwili mmoja
  rationale: Hudumisha kwa uwazi mkazo wa Kigiriki juu ya umoja wa mwili.
- source_word: οὕτως καὶ
  choice: ndivyo ... pia
  rationale: Muundo huu wa Kiswahili unatoa hitimisho la ulinganisho kwa njia ya kawaida na iliyo karibu na Kigiriki.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo cha Mtiwa-Mafuta. “Masihi” huhifadhi maana hiyo badala ya kulifanya neno kuwa jina tu.
theological_decisions:
- issue: Jinsi ya kutafsiri ὁ Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha huu unatumia Χριστός katika kauli nzito ya kiteolojia; “Masihi” huhifadhi hadhi yake kama cheo, huku tanbihi ikitaja tafsiri mbadala iliyozoeleka.
- issue: Usemi uliofupishwa “οὕτως καὶ ὁ Χριστός”
  choice: ndivyo alivyo Masihi pia
  alternative: ndivyo ulivyo mwili wa Masihi pia / ndivyo lilivyo kanisa pia
  rationale: Tafsiri haiongezi “mwili wa Masihi” wala “kanisa,” kwa kuwa maneno hayo hayapo wazi katika aya. Hivyo usemi wa Paulo uliofupishwa na mvutano wake wa kiteolojia unabaki, huku muktadha unaofuata ukiufafanua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imedumisha urudiaji wa “mwili,” “viungo,” “vingi,” na “mmoja” kwa sababu urudiaji huo ni muhimu kwa hoja ya Paulo. “Ndivyo alivyo Masihi pia” limeachwa kama tamko lenye msongamano wa maana badala ya kulipanua kwa tafsiri ya kimadhehebu.
source_grounding:
  english_pob_role: consult_only
