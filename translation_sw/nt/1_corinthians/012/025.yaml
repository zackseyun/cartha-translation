  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: sw
  text: ili kusiwe na mgawanyiko[a] katika mwili, bali viungo viwe na uangalifu uleule kila kimoja kwa kingine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpasuko.” Neno la Kigiriki linaweza kumaanisha mpasuko, ufa, au mgawanyiko; hapa linamaanisha mgawanyiko ndani ya mwili.
    reason: lexical_alternative
  - marker: b
    text: Au “viungo vijaliane kwa usawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linatambulisha kusudi au matokeo; “ili” ni la kawaida na linahifadhi nguvu hiyo katika Kiswahili.
- source_word: σχίσμα
  choice: mgawanyiko
  rationale: Neno la Kigiriki linaweza kumaanisha mpasuko au mgawanyiko. “Mgawanyiko” linaeleweka kwa urahisi katika muktadha wa mwili na jumuiya bila kuingiza istilahi nzito ya kitaasisi.
- source_word: σῶμα
  choice: mwili
  rationale: Linahifadhi moja kwa moja sitiari ya Paulo ya mwili.
- source_word: τὸ αὐτό
  choice: kwa usawa
  rationale: Pamoja na kitenzi μεριμνῶσι, kirai hiki kinaonyesha kwamba viungo vina uangalifu uleule kwa vingine. “Kwa usawa” ni Kiswahili cha asili kinachoeleza hali hiyo bila uzito usio wa lazima.
- source_word: ὑπὲρ ἀλλήλων
  choice: -jaliane
  rationale: Kiambishi cha kutendeana “-ane” katika “vijaliane” kinaonyesha kwa ufupi na kwa kawaida kwamba kujali kunaelekezwa kwa kila kimoja kwa kingine.
- source_word: μεριμνῶσι
  choice: vijaliane
  rationale: Katika muktadha huu kitenzi kina maana chanya ya kujali, si kuwa na wasiwasi. “Vijaliane” kinaonyesha uangalifu wa pande zote.
- source_word: μέλη
  choice: viungo
  rationale: “Viungo” ni neno sahihi kwa sehemu za mwili na linahifadhi sitiari, huku pia likiweka wazi matumizi yake kwa walio sehemu ya jumuiya.
theological_decisions:
- issue: Tafsiri ya σχίσμα katika sitiari ya kanisa kama mwili
  choice: mgawanyiko
  alternative: mpasuko
  rationale: “Mgawanyiko” linahifadhi wazo la kutengana ndani ya mwili bila kulifanya neno hilo kuwa istilahi maalumu ya baadaye ya kikanisa.
- issue: Maana ya τὸ αὐτό katika kujali kwa viungo
  choice: vijaliane kwa usawa
  alternative: viwe na kujali kulekule kila kimoja kwa kingine
  rationale: Tafsiri iliyochaguliwa inaonyesha usawa wa uangalifu wa pande zote bila kuamua kwa nguvu zaidi ya Kigiriki kama usawa huo ni wa kiwango kamili au ni kufanana kwa aina ya kujali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “vijaliane” unaunganisha kwa kawaida dhana ya kujali na ya kutendeana, huku “kwa usawa” ikiwakilisha τὸ αὐτό kwa uwazi.
