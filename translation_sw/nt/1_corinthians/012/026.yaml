base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: sw
  text: Na kiungo kimoja kikiteseka, viungo vyote huteseka pamoja nacho; kiungo kikiheshimiwa[a], viungo vyote hufurahi pamoja nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikitukuzwa.” Katika muktadha huu, huenda maana ni kwamba kiungo kinapewa heshima, na viungo vyote hushiriki furaha hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: '... kiki- ... kiki-'
  rationale: Muundo wa masharti unaorudiwa unasikika kwa ufasaha katika Kiswahili na kuhifadhi ulinganifu wa hali mbili anazowasilisha Paulo.
- source_word: πάσχει
  choice: kikiteseka
  rationale: Neno hili linahifadhi maana pana ya kupitia mateso au maumivu bila kubainisha aina yake.
- source_word: ἓν μέλος / μέλος
  choice: kiungo kimoja
  rationale: “Kiungo” kinahifadhi taswira ya mwili na pia kinafaa katika maelezo ya uhusiano wa sehemu mbalimbali za mwili. Ingawa neno la pili halina namba ἕν katika matini iliyochapishwa, Kiswahili cha asili hutumia “kimoja” hapa ili kuonyesha kiungo fulani na kudumisha ulinganifu bila kudai kuwa namba hiyo imerudiwa katika Kigiriki.
- source_word: συμπάσχει
  choice: huteseka pamoja nacho
  rationale: Kitenzi ambatani kinaonyesha kushiriki mateso ya kiungo hicho; “pamoja nacho” huweka wazi mshikamano huo.
- source_word: πάντα τὰ μέλη
  choice: viungo vyote
  rationale: Tafsiri hii inadumisha urudiaji wa Kigiriki na taswira ya mwili.
- source_word: δοξάζεται
  choice: kikiheshimiwa
  rationale: Katika muktadha wa kutunzana kwa viungo vya mwili, maana ya kupewa heshima inafaa kuliko kuingiza moja kwa moja dhana nzito ya kutukuzwa kidini.
- source_word: συγχαίρει
  choice: hufurahi pamoja nacho
  rationale: Tafsiri hii inaonyesha furaha inayoshirikiwa na viungo vingine pamoja na kiungo kinachoheshimiwa.
theological_decisions:
- issue: Maana ya δοξάζεται katika taswira ya mwili wa waumini
  choice: kikiheshimiwa
  alternative: kikitukuzwa
  rationale: Muktadha wa karibu unahusu kujali na kutegemeana kwa viungo vya mwili mmoja. “Kikiheshimiwa” huwasilisha maana ya kijamii ya kupewa heshima bila kuondoa uwezekano wa maana pana, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa kimethali, huku urudiaji wa “viungo vyote” na “pamoja nacho” ukihifadhi msisitizo na ulinganifu wa matini ya Kigiriki.
