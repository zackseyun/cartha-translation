  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: sw
  text: Kwa hiyo, ninawajulisha kwamba hakuna mtu anayesema kwa Roho wa Mungu, “Yesu amelaaniwa,”[a] wala hakuna mtu anayeweza kusema, “Yesu ni Bwana,”[b] isipokuwa kwa Roho Mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu na alaaniwe,” ikionyesha nguvu ya kauli ya mshangao ya Kigiriki Ἀνάθεμα Ἰησοῦς.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa mpangilio wa maneno wa Kigiriki, “Bwana Yesu”; katika muktadha huu maana yake ni ungamo: “Yesu ni Bwana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: γνωρίζω ὑμῖν
  choice: ninawajulisha
  rationale: Inahifadhi maana ya kusababisha jambo lijulikane bila kuongeza wazo la kutaka ambalo halijasemwa wazi.
- source_word: ἐν πνεύματι θεοῦ λαλῶν
  choice: anayesema kwa Roho wa Mungu
  rationale: ‘Kwa’ linaonyesha utendaji au uwezeshaji wa Roho; kitenzi ‘kusema’ ni cha asili katika muktadha huu.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Yesu amelaaniwa
  rationale: Ni usemi wa Kiswahili unaoeleweka kwa kirai cha Kigiriki kisicho na kitenzi; haukifanyi kuwa amri dhahiri.
- source_word: δύναται εἰπεῖν
  choice: anaweza kusema
  rationale: Inatoa kwa uwazi maana ya uwezo au uwezekano.
- source_word: Κύριος Ἰησοῦς
  choice: Yesu ni Bwana
  rationale: Katika muktadha huu kirai ni ungamo, si namna ya kumwita Yesu moja kwa moja; Kiswahili huhitaji kiunganishi ‘ni’.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: isipokuwa kwa Roho Mtakatifu
  rationale: ‘Isipokuwa’ linaweka pambanuo pekee, na ‘kwa’ linaonyesha utendaji wa Roho.
theological_decisions:
- issue: Maana ya κύριος katika ungamo Κύριος Ἰησοῦς
  choice: Bwana
  alternative: Mkuu
  rationale: ‘Bwana’ huhifadhi maana ya kawaida ya cheo hicho pamoja na uzito wake wa Kikristo bila kufafanua zaidi ya matini.
- issue: Uwezeshaji wa Roho katika kusema “Yesu ni Bwana”
  choice: Kauli imehifadhiwa kama ilivyo, ikihusisha ungamo hilo na Roho Mtakatifu
  alternative: Kuifafanua kuwa matamshi ya mdomo tu, au kuwa fundisho kamili la kuzaliwa upya
  rationale: Matini inaunganisha ungamo la ubwana wa Yesu na utendaji wa Roho, lakini haitoi hapa mfumo mpana zaidi wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu mantiki ya Kigiriki huku ukitumia sintaksia ya asili ya Kiswahili.
