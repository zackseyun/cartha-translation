  text: Nanyi ni mwili wa Kristo[a], na kila mmoja wenu ni kiungo chake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Masiya.” Cheo cha Kigiriki Χριστός humaanisha “Mtiwa-Mafuta” na kinaweza kutafsiriwa “Kristo” au “Masiya.”
