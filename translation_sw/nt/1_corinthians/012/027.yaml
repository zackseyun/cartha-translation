lexical_decisions:
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi kwa kusisitiza waamini wote wanaoambiwa.
- source_word: δέ
  choice: nanyi
  rationale: Kiunganishi hiki kinaonyesha mpito kutoka mfano wa mwili uliotangulia kwenda kwa wasomaji wenyewe; muundo wa “nanyi” ni wa asili katika Kiswahili na haudokezi wakati.
- source_word: σῶμα Χριστοῦ
  choice: mwili wa Kristo
  rationale: Huhifadhi moja kwa moja mfano wa mwili na uhusiano unaoonyeshwa na hali ya umilikaji katika Χριστοῦ.
- source_word: Χριστοῦ
  choice: Kristo
  rationale: “Kristo” ni namna ya kawaida, yenye heshima, ya kuwasilisha cheo Χριστός katika Kiswahili cha Biblia; “Masiya” imeonyeshwa kama tafsiri mbadala ya cheo hicho.
- source_word: μέλη
  choice: viungo
  rationale: Katika mfano wa mwili, “viungo” huonyesha sehemu hai za mwili na pia nafasi ya kila mwamini ndani ya jumla.
- source_word: ἐκ μέρους
  choice: kila mmoja wenu
  rationale: 'Katika muktadha huu kirai kina maana ya mgawanyo: kwa pamoja wao ni mwili, na mmoja mmoja ni viungo. Tafsiri hii huepuka dhana isiyokusudiwa ya kutokamilika.'
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika kauli kuhusu kanisa
  choice: Kristo
  alternative: Masiya
  rationale: “Kristo” hutafsiri cheo cha Kigiriki kwa namna iliyozoeleka na wazi kwa wasomaji wa Kiswahili, bila kukifanya kuwa jina lisilo na maana; tanbihi inahifadhi “Masiya” kama tafsiri halali ya cheo hicho.
- issue: Maana ya ἐκ μέρους katika καὶ μέλη ἐκ μέρους
  choice: kila mmoja wenu ni kiungo chake
  alternative: nanyi ni viungo kila mmoja kwa sehemu yake
  rationale: Muktadha unatofautisha mwili mmoja na viungo vingi. Muundo uliochaguliwa unaonyesha wazi umoja wa jumuiya na ushiriki wa kila mtu, huku tanbihi ikihifadhi ukaribu wa kisarufi na usemi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. “Nanyi” huhifadhi mpito wa δέ bila kuingiza neno la wakati; “kiungo chake” huifanya maana ya mgawanyo iwe ya asili katika Kiswahili.
