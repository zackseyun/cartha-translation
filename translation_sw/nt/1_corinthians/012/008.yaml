base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: sw
  text: Kwa maana mtu mmoja hupewa kwa njia ya Roho ujumbe wa hekima[a], na mwingine hupewa ujumbe wa maarifa[b] kulingana na Roho yuleyule[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno la hekima” au “usemi wa hekima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “neno la maarifa” au “usemi wa maarifa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa Roho yuleyule.” Kigiriki hapa kinatumia kihusishi tofauti na kile cha “kwa njia ya Roho”; huenda kikisisitiza kupatana na Roho yuleyule kama chanzo cha pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: mtu mmoja
  rationale: Katika muundo huu wa kugawa vipawa kwa watu mbalimbali, kiwakilishi cha Kigiriki kinaeleweka kwa kawaida kama ‘mtu mmoja’; ‘hupewa’ hubeba dhana ya ‘kwa mtu mmoja’ bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: διὰ τοῦ πνεύματος
  choice: kwa njia ya Roho
  rationale: διά pamoja na umilikishi huonyesha njia au utendaji. ‘Kwa njia ya Roho’ huhifadhi maana hiyo na kuitofautisha na κατά katika kishazi cha pili.
- source_word: πνεύματος / πνεῦμα
  choice: Roho
  rationale: Muktadha wa 1 Wakorintho 12 unaonyesha kwamba anayerejelewa ni Roho Mtakatifu; herufi kubwa hutambulisha rejeo hilo bila kuongeza neno lisilokuwapo hapa.
- source_word: δίδοται
  choice: hupewa
  rationale: Kitenzi cha wakati uliopo katika hali ya kutendwa kinaonyesha kwamba kipawa hutolewa, si kwamba mtu hujipatia mwenyewe. ‘Hupewa’ ni Kiswahili cha kawaida na kinaweza pia kuonyesha jambo linalotokea katika ugawaji huu.
- source_word: λόγος σοφίας
  choice: ujumbe wa hekima
  rationale: λόγος hapa yaelekea kumaanisha usemi au ujumbe, si neno moja tu. ‘Ujumbe’ ni wa kawaida kwa msomaji wa sasa, huku mbadala halisi ukiwekwa katika tanbihi.
- source_word: ἄλλῳ
  choice: mwingine
  rationale: Huhifadhi ulinganifu wa mgawanyo kati ya mtu mmoja na mwingine.
- source_word: λόγος γνώσεως
  choice: ujumbe wa maarifa
  rationale: Imetafsiriwa sambamba na λόγος σοφίας. ‘Maarifa’ huwasilisha γνώσις kwa lugha ya kawaida na yenye heshima.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: kulingana na Roho yuleyule
  rationale: κατά pamoja na hali ya usababishi hapa inaweza kueleza ulinganifu au kupatana. Tafsiri hii huhifadhi tofauti na διά (‘kwa njia ya’) ya kishazi cha kwanza na pia umoja wa chanzo.
theological_decisions:
- issue: Anayerejelewa na ‘Roho’
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu
  rationale: Muktadha wa sura hii unahusu vipawa vinavyogawanywa na Roho mmoja wa Mungu. Matini kuu inatumia ‘Roho’ kwa herufi kubwa bila kuongeza ‘Mtakatifu,’ ambalo halipo wazi katika mstari huu.
- issue: Maana ya λόγος katika semi za vipawa
  choice: ujumbe
  alternative: neno au usemi
  rationale: ‘Ujumbe’ huonyesha mawasiliano yenye maana katika Kiswahili cha sasa bila kuamua kwa undani namna au urefu wa usemi. Mibadala imehifadhiwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na κατὰ katika kishazi cha pili
  choice: kulingana na Roho yuleyule
  alternative: kwa Roho yuleyule
  rationale: Uchaguzi huu huhifadhi utofauti wa vihusishi vya Kigiriki na uwezekano wa maana ya kupatana na Roho, badala ya kusawazisha kimya kimya na ‘kwa njia ya Roho.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘mtu mmoja … mwingine’ ni wa asili; istilahi za kitamaduni zimehifadhiwa kama mibadala katika tanbihi.
