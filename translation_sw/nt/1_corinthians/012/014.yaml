  text: For the body is not one member, but many.
translation:
  language: sw
  text: Kwa maana mwili si kiungo kimoja, bali ni viungo vingi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Kwa maana
  rationale: Kirai hiki kinaonyesha maelezo yanayounga hoja hii na yaliyotangulia. “Kwa maana” ni njia ya kawaida na wazi ya kuwasilisha uhusiano huo katika Kiswahili.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: Hili ni neno la moja kwa moja linalodumisha mfano wa Paulo wa mwili bila kuufafanua ndani ya tafsiri kuwa kanisa au mwili wa Kristo.
- source_word: οὐκ ἔστιν
  choice: si
  rationale: “Si” linatafsiri kitenzi kishirikishi chenye ukanushi kwa ufupi na kwa Kiswahili cha kawaida, bila kuongeza wazo la “kuundwa na” ambalo halijasemwa wazi katika Kigiriki.
- source_word: ἓν μέλος
  choice: kiungo kimoja
  rationale: “Kiungo” hudumisha taswira halisi ya sehemu ya mwili na pia kinafaa katika matumizi ya kimfano katika muktadha huu.
- source_word: ἀλλὰ πολλά
  choice: bali ni viungo vingi
  rationale: Ingawa Kigiriki kinaacha nomino baada ya “vingi” kwa kuwa inaeleweka kutoka kirai kilichotangulia, Kiswahili cha kawaida huhitaji kuirudia ili sentensi iwe wazi na ya asili. Kitenzi “ni” pia kimerudiwa kwa mtiririko mzuri.
theological_decisions:
- issue: Rejeo la kimfano la “mwili”
  choice: Kudumisha neno “mwili” bila kulipanua kuwa “mwili wa Kristo.”
  alternative: mwili wa Kristo
  rationale: Muktadha mpana unahusu kanisa kama mwili wa Kristo, lakini mstari huu wenyewe unasema “mwili” tu. Tafsiri haipaswi kuingiza ufafanuzi wa kimuktadha katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, wazi na inayofaa kusomwa hadharani. Muundo “si ... bali ni ...” ni wa asili na hudumisha utofautishaji wa Kigiriki.
