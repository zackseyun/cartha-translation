id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: sw
  text: Kama mwili wote ungekuwa jicho[a], uwezo wa kusikia ungekuwa wapi? Kama mwili wote ungekuwa uwezo wa kusikia, uwezo wa kunusa ungekuwa wapi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikio lingekuwa wapi? ... pua ingekuwa wapi?” Kigiriki, kwa maana ya moja kwa moja zaidi, kinataja uwezo wa kusikia na wa kunusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: mwili wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi picha ya Paulo ya mwili mzima kuwa kiungo kimoja.
- source_word: ὀφθαλμός
  choice: jicho
  rationale: Inahifadhi kiungo cha mwili kilicho katika umoja na inaeleweka kwa kawaida katika sentensi ya masharti.
- source_word: ποῦ
  choice: ungekuwa wapi?
  rationale: Muundo huu unaonyesha kwa kawaida hali ya kudhaniwa inayotolewa na sentensi ya masharti.
- source_word: ἀκοή
  choice: uwezo wa kusikia
  rationale: Neno la Kigiriki linataja uwezo wa kusikia, si sikio lenyewe; tafsiri hii huhifadhi tofauti hiyo kwa uwazi.
- source_word: ὅλον
  choice: mwili wote
  rationale: Ingawa Kigiriki kinaacha nomino katika sharti la pili, kuirudia 'mwili' katika Kiswahili huondoa utata wa ngeli na kutoa sentensi ya kawaida bila kubadili maana.
- source_word: ὄσφρησις
  choice: uwezo wa kunusa
  rationale: Hutaja uwezo wa hisi ya kunusa badala ya pua, sawasawa na maana ya nomino ya Kigiriki na sambamba na 'uwezo wa kusikia'.
theological_decisions:
- issue: Je, sitiari ya viungo vya mwili itafsiriwe kwa uwezo wa hisi au kwa viungo vya mwili?
  choice: 'Kutafsiri ἀκοή na ὄσφρησις kama uwezo wa hisi: ''uwezo wa kusikia'' na ''uwezo wa kunusa.'''
  alternative: 'Kutafsiri kwa viungo: ''sikio'' na ''pua.'''
  rationale: Kigiriki kinatumia majina ya uwezo wa kusikia na kunusa, wala si maneno ya viungo vya sikio na pua. Kuhifadhi lugha ya uwezo hufuata chanzo na hakufanyi picha hiyo kuwa ya kimaumbile zaidi kuliko ilivyoandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Uwezo wa kusikia/kunusa' ni wazi kwa msomaji wa kawaida na huhifadhi usahihi wa istilahi za Kigiriki; 'mwili wote' imerudiwa katika sharti la pili kwa ufasaha wa Kiswahili.
