lexical_decisions:
- source_word: φιλεῖ
  choice: anampenda
  rationale: Kitenzi φιλέω hapa kinaonyesha upendo wa kibinafsi kwa Bwana. ‘Anampenda’ ni Kiswahili cha kawaida na cha moja kwa moja, bila kufinya maana iwe urafiki au hisia tu.
- source_word: κύριον
  choice: Bwana
  rationale: Katika muktadha huu wa Paulo, κύριος ni cheo kinachomhusu Yesu. ‘Bwana’ huhifadhi uzito wa cheo hicho na matumizi yaliyozoeleka katika Agano Jipya.
- source_word: ἤτω
  choice: na alaaniwe
  rationale: Amri ya nafsi ya tatu ya εἰμί ina nguvu ya tamko la hukumu. Muundo wa Kiswahili ‘na alaaniwe’ huwasilisha kwa kawaida maana ya ‘na awe chini ya laana.’
- source_word: ἀνάθεμα
  choice: alaaniwe
  rationale: ἀνάθεμα humaanisha kuwa chini ya laana, hasa laana ya hukumu. ‘Alaaniwe’ ni wazi kwa msomaji wa sasa na huhifadhi uzito wa onyo kuliko kuacha neno la kigeni ‘anathema.’
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: Huu ni usemi wa Kiaramu uliohifadhiwa kwa herufi za Kigiriki. Kwa kuwa mgawanyo na maana yake kamili vinabishaniwa, umetoholewa katika matini kuu badala ya kuchagua tafsiri moja.
theological_decisions:
- issue: Maana ya usemi wa Kiaramu Μαράνα θά
  choice: 'Kuhifadhi matamshi yake katika matini kuu: ‘Marana tha.’'
  alternative: ‘Bwana wetu, njoo!’ au ‘Bwana wetu amekuja.’
  rationale: Usemi huo unaweza kugawanywa na kueleweka kwa njia zaidi ya moja. Kuuhifadhi kwa matamshi yake hakutatui kimya kimya utata halisi wa chanzo; maana kuu zinazowezekana zinaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtu yeyote’ huhifadhi ujumla wa εἴ τις, huku ‘na alaaniwe’ ikitoa kwa ufupi nguvu ya tamko la hukumu. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
