  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: sw
  text: Kwa maana sitaki kuwaona sasa nikiwa napita tu, kwa maana ninatumaini kukaa nanyi kwa muda fulani, ikiwa Bwana ataruhusu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ θέλω
  choice: sitaki
  rationale: Hueleza tamanio au kusudi la Paulo kwa Kiswahili cha kawaida, bila kuipa kauli uzito wa kisheria au rasmi usiokuwamo.
- source_word: ἄρτι
  choice: sasa
  rationale: Hutaja wakati wa sasa kwa ufupi na kwa lugha ya kawaida.
- source_word: ἐν παρόδῳ
  choice: nikiwa napita tu
  rationale: Huwasilisha wazo la kumwona mtu kwa muda mfupi akiwa safarini; neno “tu” linaonyesha kuwa ziara hiyo isingekuwa ya kukaa.
- source_word: ἰδεῖν
  choice: kuwaona
  rationale: Huhifadhi maana ya msingi ya ‘kuona,’ ambayo katika muktadha huu pia inadokeza kuwatembelea.
- source_word: ἐλπίζω
  choice: ninatumaini
  rationale: Huonyesha matarajio yenye tamanio lakini yasiyo na uhakika kamili.
- source_word: χρόνον τινά
  choice: kwa muda fulani
  rationale: Huhifadhi muda usiotajwa kwa usahihi lakini wenye uzito zaidi ya kupita tu.
- source_word: ἐπιμεῖναι
  choice: kukaa
  rationale: Ni Kiswahili cha asili kwa kuendelea kuwapo mahali pamoja na watu fulani.
- source_word: πρὸς ὑμᾶς
  choice: nanyi
  rationale: Pamoja na kitenzi ‘kukaa,’ huonyesha kuwa katika ushirika au uwepo wao kwa lugha fasaha na fupi.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: ikiwa Bwana ataruhusu
  rationale: Huhifadhi sharti na utegemezi wa mpango wa Paulo kwa ruhusa ya Bwana.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika muktadha wa kimungu, bila kubainisha zaidi mhusika kuliko maandishi ya Kigiriki yanavyofanya.
theological_decisions:
- issue: Mhusika anayerejelewa na ‘Bwana’
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Kigiriki kinasema κύριος bila ufafanuzi wa ziada. Tafsiri inahifadhi uwazi huo badala ya kuamua ikiwa anatajwa Yesu au Mungu Baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanya visababishi viwili vya γάρ kwa “Kwa maana” na “kwa sababu,” ili sentensi ibaki ya asili kwa Kiswahili bila kupoteza uhusiano wa hoja.
