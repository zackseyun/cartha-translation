    text: Au, “nikiwa njiani” au “ninapita tu.”
    reason: lexical_alternative
  revision_rationale: 'The revision is conservative: it retains every element of the draft''s meaning, uses ''kwa maana'' to represent both explanatory γάρ clauses consistently, and clarifies the lexical alternatives for ἐν παρόδῳ without adding information.'
