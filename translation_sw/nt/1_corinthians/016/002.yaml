base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: sw
  text: Siku ya kwanza ya kila juma[a], kila mmoja wenu na aweke akiba kwake mwenyewe[b], kadiri atakavyofanikiwa[c], ili nitakapokuja, michango isikusanywe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siku ya kwanza ya juma.” Hapa usemi wa Kigiriki unaonyesha desturi inayorudiwa kila juma.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwake mwenyewe” au “pamoja naye mwenyewe.” Huenda maana yake ni kwamba kila mtu aweke fedha kando binafsi, labda nyumbani.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa kadiri ya mafanikio yake.” Maana ni kwamba kila mtu atenge akiba kulingana na jinsi anavyostawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Kila siku ya kwanza ya juma
  rationale: Muundo wenye κατά una maana ya mgawanyo na urudiaji; hapa unaagiza desturi ya kila juma.
- source_word: ἕκαστος ὑμῶν
  choice: kila mmoja wenu
  rationale: Huhifadhi wazi kwamba agizo linamhusu kila mtu mmoja mmoja katika jumuiya.
- source_word: παρ’ ἑαυτῷ
  choice: kwake mwenyewe
  rationale: Huhifadhi maana halisi ya kuweka kitu kando binafsi bila kuamua kimya kimya kwamba lazima kilihifadhiwa nyumbani.
- source_word: τιθέτω θησαυρίζων
  choice: na aweke kando kiasi fulani ... akikiweka akiba
  rationale: Kauli ya amri ya kuendelea pamoja na kishirikishi inaonyesha kutenga na kukusanya fedha hatua kwa hatua.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: kulingana na jinsi anavyofanikiwa
  rationale: Hutoa maana ya kiasi kinacholingana na mafanikio au ustawi alioupata mtu, huku ikihifadhi hali isiyobainishwa ya kifungu cha Kigiriki.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: ili nisije nikafika ndipo michango ikaanza kukusanywa
  rationale: 'Huwasilisha kusudi la maandalizi ya kila juma: kuepusha kuanza kwa ukusanyaji Paulo atakapowasili.'
