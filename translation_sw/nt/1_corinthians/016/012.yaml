id: 1CO.16.12
reference: 1 Corinthians 16:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: sw
  text: Kuhusu ndugu yetu Apolo[a], nilimsihi sana aje kwenu pamoja na hao ndugu; lakini hakutaka kabisa kuja sasa[b]. Hata hivyo, atakuja atakapopata nafasi inayofaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu Apolo.” Kigiriki kinasema “ndugu” bila kiwakilishi cha umilikaji kilicho wazi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi zaidi, “haikuwa kabisa nia yake kuja sasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Ni mpito wa kawaida wa barua unaoanzisha jambo jipya; “Kuhusu” ni wa asili na hauongezi “sasa,” ambayo haipo hapa.
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: ndugu yetu Apolo
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili. Ingawa Kigiriki kinasema kihalisi “ndugu” bila kiwakilishi cha umilikaji, “ndugu yetu” huwasilisha kwa kawaida uhusiano wa Kikristo unaodokezwa na muktadha; tanbihi inahifadhi umbo la Kigiriki.
- source_word: πολλὰ παρεκάλεσα
  choice: nilimsihi sana
  rationale: “Sana” huhifadhi nguvu ya πολλὰ, na “kusihi” huonyesha ombi lenye msisitizo bila kudokeza amri.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: aje kwenu
  rationale: Huwasilisha kwa Kiswahili cha kawaida maudhui ya ombi na mwendo kuelekea kwa Wakorintho bila kuongeza wazo la “kuwatembelea.”
- source_word: μετὰ τῶν ἀδελφῶν
  choice: pamoja na hao ndugu
  rationale: “Hao” huonyesha kundi mahususi lililotajwa katika muktadha, na “ndugu” inafaa kwa wafanyakazi wenzake wanaosafiri.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: lakini hakutaka kabisa
  rationale: Hii ni Kiswahili cha asili kinachohifadhi msisitizo wa πάντως na kueleza kwamba nia ilikuwa ya Apolo. Tanbihi huhifadhi usemi wa kinomino ulio karibu zaidi na Kigiriki.
- source_word: νῦν
  choice: sasa
  rationale: Hutoa maana ya moja kwa moja ya wakati wa sasa.
- source_word: ἐλεύσεται δὲ
  choice: Hata hivyo, atakuja
  rationale: 'Huhifadhi utofautishaji mpole: kutokuja kwake sasa hakumaanishi kwamba hatakuja baadaye.'
- source_word: ὅταν εὐκαιρήσῃ
  choice: atakapopata nafasi inayofaa
  rationale: Huwasilisha nafasi au wakati unaofaa, si urahisi wa kibinafsi tu.
theological_decisions:
- issue: Mhusika na maana ya οὐκ ἦν θέλημα
  choice: 'Kauli inarejelea nia ya Apolo mwenyewe: “hakutaka kabisa.”'
  alternative: Haikuwa mapenzi ya Mungu kwamba aje sasa.
  rationale: Apolo ndiye mhusika wa karibu na wa kawaida zaidi katika sentensi. Muktadha hautaji mapenzi ya Mungu, hivyo kuyafanya kuwa mhusika kungeongeza dai la kiteolojia lisilosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nilimsihi sana” ni cha kawaida kuliko tafsiri ya neno kwa neno, huku “hakutaka kabisa” ikisomeka kwa uwazi bila kuingiza katazo la Mungu. Alama zote za tanbihi zimewekwa katika maandishi makuu.
source_grounding:
  english_pob_role: consult_only
