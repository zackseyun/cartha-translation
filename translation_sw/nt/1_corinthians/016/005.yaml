base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: sw
  text: Lakini nitakuja kwenu nitakapokuwa nimepitia Makedonia[a], kwa maana ninapitia Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakapopita Makedonia.” Muundo wa Kigiriki unaweza kutafsiriwa kwa urahisi hivyo, lakini “nitakapokuwa nimepitia” huonyesha wazi zaidi kwamba Paulo atamaliza kupitia Makedonia kabla ya kuwatembelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: nitakuja
  rationale: Kitenzi cha wakati ujao kinaonyesha kusudi la Paulo la kwenda walipo Wakorintho; kwa mtazamo wa wanaoandikiwa, “nitakuja kwenu” ni Kiswahili cha kawaida na sahihi.
- source_word: δὲ
  choice: Lakini
  rationale: Hutambulisha mpito wenye tofauti ndogo na mpango uliotangulia, bila kuashiria upinzani mkali.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Baada ya kitenzi cha mwendo, kifungu hiki huonyesha kuelekea kwa watu; “kwenu” ni usemi wa asili wa Kiswahili.
- source_word: ὅταν
  choice: nitakapokuwa
  rationale: Huanzisha tukio la wakati ujao ambalo litatangulia kuja kwa Paulo.
- source_word: Μακεδονίαν
  choice: Makedonia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la eneo hilo.
- source_word: διέλθω
  choice: nimepitia
  rationale: Kauli timilifu pamoja na muundo wa wakati ujao huhifadhi maana ya kupitia Makedonia kukamilika kabla ya Paulo kufika kwa Wakorintho.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha sababu au ufafanuzi wa wakati aliopanga kuwatembelea.
- source_word: διέρχομαι
  choice: ninapitia
  rationale: Wakati uliopo unaonyesha njia ya safari iliyo katika mpango thabiti au inayotazamwa kuwa inaendelea, na pia huitofautisha na tendo lililokamilika katika kishazi kilichotangulia.
