  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: sw
  text: Kwa maana mlango mkubwa na wenye matokeo umenifungukia[a], na wapinzani ni wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimepata fursa kubwa yenye matokeo.” Paulo anatumia “mlango” kisitiari kumaanisha nafasi ya huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: mlango
  rationale: Neno hili linamaanisha kihalisi ‘mlango’ na hapa limetumiwa kisitiari kuhusu nafasi ya huduma. Kudumisha ‘mlango’ kunahifadhi taswira ya Kigiriki badala ya kuitafsiri moja kwa moja kuwa ‘fursa’.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mpango wa Paulo uliotajwa katika muktadha unaotangulia.
- source_word: μοι
  choice: nimefunguliwa
  rationale: Muundo huu wa Kiswahili unajumuisha rejeo la nafsi ya kwanza na kuwasilisha kwamba mlango umefunguliwa kwa ajili ya Paulo bila kulazimisha kutaja mtendaji.
- source_word: ἀνέῳγεν
  choice: nimefunguliwa
  rationale: Kauli timilifu inaonyesha hali ya sasa inayotokana na kufunguliwa hapo awali. Kiswahili ‘nimefunguliwa’ kinaonyesha matokeo yanayoendelea na kudumisha hali ya kutotajwa kwa mtendaji.
- source_word: μεγάλη
  choice: mkubwa
  rationale: ‘Mkubwa’ hueleza ukubwa au umuhimu wa nafasi hiyo huku ikipatana kiasili na sitiari ya mlango.
- source_word: ἐνεργής
  choice: wenye matokeo
  rationale: Katika muktadha huu neno linaonyesha kwamba nafasi hiyo inaweza kuzaa matunda au kutimiza kazi kwa ufanisi. ‘Wenye matokeo’ ni Kiswahili cha sasa na kinachoeleweka.
- source_word: ἀντικείμενοι
  choice: wapinzani
  rationale: Kivumishi-partisipio hiki kimetumiwa kama nomino kwa watu wanaompinga Paulo na kazi yake. ‘Wapinzani’ ni kifupi na cha kawaida.
- source_word: πολλοί
  choice: wengi
  rationale: Hili ndilo neno la kawaida la Kiswahili linalowasilisha maana ya idadi kubwa.
theological_decisions:
- issue: Sitiari ya ‘mlango’ kwa nafasi ya huduma
  choice: Kudumisha sitiari ‘mlango’
  alternative: Kwa maana nimepata fursa kubwa yenye matokeo
  rationale: Kigiriki kinatumia sitiari ya mlango inayopatikana pia kwingine katika maandishi ya Paulo. Kuihifadhi kunadumisha taswira ya matini na hakufungi maana kwa ufafanuzi mmoja.
- issue: Uhusiano kati ya nafasi na upinzani
  choice: lakini wapinzani ni wengi
  alternative: na wapinzani ni wengi
  rationale: καί kimsingi ni ‘na,’ lakini hapa kishazi cha pili kinaonyesha hali inayokinzana na nafasi nzuri iliyofunguka. ‘Lakini’ huwasilisha uhusiano huo wa kimuktadha bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya chanzo imehifadhiwa, huku tanbihi ikitoa maana yake ya kimuktadha.
