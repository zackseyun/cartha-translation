  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: sw
  text: 'Nawasihi, ndugu[a]: mnawajua watu wa nyumbani wa Stefana, ambao ni malimbuko ya Akaya[b], na wamejitoa kuwatumikia watakatifu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa inaweza kulihusu kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: “Malimbuko” huenda yakamaanisha waumini wa kwanza wa Akaya, huku yakihifadhi sitiari ya sehemu ya kwanza iliyotengwa kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nawasihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati lenye uzito; “nawasihi” ni Kiswahili cha kawaida, chenye heshima, na chenye nguvu inayofaa hapa.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: δὲ ni kiunganishi hafifu cha mpito. Katika sentensi hii, mtiririko wa Kiswahili ni wa asili bila kuongeza “sasa,” ambalo lingeweza kueleweka kuwa la wakati.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” huhifadhi namna ya kawaida ya kuwaita waumini na katika Kiswahili inaweza kujumuisha wanaume na wanawake bila kulazimisha ufafanuzi wa jinsia katika matini kuu.
- source_word: οἴδατε
  choice: mnajua
  rationale: Umbo la Kigiriki lina maana ya wakati wa sasa hapa; “mnajua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: οἰκίαν Στεφανᾶ
  choice: nyumba ya Stefana
  rationale: “Nyumba” hapa inaeleweka kama watu wa nyumbani au kaya, si jengo tu; tanbihi inaweka wazi upana huo wa maana.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: malimbuko ya Akaya
  rationale: “Malimbuko” huhifadhi sitiari ya sehemu ya kwanza inayotengwa kwa Mungu, pamoja na wazo la kuwa miongoni mwa waumini wa kwanza wa Akaya.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: kuwahudumia watakatifu
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha huduma inayowalenga waumini, bila kuingiza maana ya cheo rasmi cha kanisa.
- source_word: ἔταξαν ἑαυτούς
  choice: wamejitoa
  rationale: Kauli ya kujirejelea inaonyesha kwamba walijiweka kwa hiari na kwa kudumu katika kazi hiyo; “wamejitoa” huwasilisha nia na kujitolea huko.
theological_decisions:
- issue: Maana ya ἀδελφοί katika hotuba kwa kusanyiko
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: “Ndugu” ni ya karibu na neno la chanzo na pia inaweza kulihusu kusanyiko lote katika Kiswahili. Tanbihi inaeleza wazi uwezekano huo bila kufanya matini kuu kuwa nzito.
- issue: Maana ya ἀπαρχὴ τῆς Ἀχαΐας
  choice: malimbuko ya Akaya
  alternative: waumini wa kwanza wa Akaya
  rationale: “Malimbuko” huhifadhi sitiari na mwangwi wake wa kitu cha kwanza kinachowekwa wakfu kwa Mungu, badala ya kuifupisha kuwa taarifa ya wakati pekee.
- issue: Upatanisho wa οἰκία na viwakilishi vya wingi
  choice: wao ... wamejitoa
  alternative: hiyo ... imejitoa
  rationale: Ingawa “nyumba” ni nomino ya umoja, rejeo ni kundi la watu. Kiswahili cha kawaida kinaweza kurejelea watu hao kwa wingi, jambo linalolingana pia na ἑαυτούς ya wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Nawasihi” huendeleza uzito wa ombi, “malimbuko” huhifadhi sitiari ya chanzo, na “kuwahudumia” huepuka lugha ya cheo rasmi.
