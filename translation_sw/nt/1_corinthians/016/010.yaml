  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: sw
  text: Timotheo akija, hakikisheni kwamba awe kati yenu bila hofu[a], kwa maana anafanya kazi ya Bwana, kama ninavyofanya mimi pia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awe pamoja nanyi bila hofu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi inayohifadhi urudiaji wa maneno ya Kigiriki: “kwa maana anaitenda kazi ya Bwana, kama mimi pia ninavyoitenda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: Timotheo akija
  rationale: Muundo wa Kiswahili wenye kitenzi cha masharti unawasilisha sharti linalowezekana la wakati ujao kwa kawaida. δέ ni kiunganishi hafifu cha mpito hapa; maana yake inabebwa na mwanzo wa sentensi bila kulazimisha ‘lakini,’ ambalo lingeweza kuonyesha upinzani mkali kuliko Kigiriki.
- source_word: βλέπετε ἵνα
  choice: hakikisheni kwamba
  rationale: βλέπετε ni agizo la kuchukua tahadhari au hatua ili jambo linalofuata litimie. ‘Hakikisheni kwamba’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi wajibu wa wasomaji.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: awe kati yenu bila hofu
  rationale: Tafsiri hii huhifadhi hali ya Timotheo kuwapo miongoni mwao akiwa huru na hofu, bila kuifanya sentensi iseme tu kwamba ajisikie salama.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: kwa maana anafanya kazi ya Bwana
  rationale: ‘Anafanya’ huonyesha shughuli inayoendelea; ‘kazi ya Bwana’ huhifadhi uhusiano wa kijeni bila kubainisha zaidi kama ni kazi inayomilikiwa, iliyoagizwa, au inayofafanuliwa na Bwana.
- source_word: ὡς κἀγώ
  choice: kama ninavyofanya mimi pia
  rationale: κἀγώ ni ‘mimi pia.’ Kitenzi kilichodokezwa kinakamilishwa kwa njia ya kawaida katika Kiswahili huku ulinganifu kati ya huduma ya Timotheo na ya Paulo ukihifadhiwa.
theological_decisions:
- issue: Mhusika anayerejelewa na κυρίου
  choice: Bwana
  alternative: kumtaja wazi kuwa Yesu
  rationale: Ingawa katika matumizi ya Paulo huenda sana anayelengwa ni Bwana Yesu, Kigiriki kinasema tu ‘Bwana.’ Tafsiri haiingizi utambulisho ulio wazi zaidi kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Bila hofu’ limechaguliwa badala ya neno linaloweza kudokeza ujasiri wa ndani pekee. Kiunganishi hafifu δέ hakikutafsiriwa kwa ‘lakini’ ili kuepuka kuongeza upinzani usio dhahiri katika muktadha.
