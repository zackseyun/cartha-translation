  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: sw
  text: Kesheni, simameni imara katika imani, iweni jasiri,[a] tiweni nguvu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “tendeni kama wanaume”; hapa ni nahau yenye maana ya kuwa jasiri au kuwa shujaa.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “iweni na nguvu.” Kitenzi cha Kigiriki kina umbo la kutendwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Kesheni
  rationale: Amri ya wakati uliopo inaelekeza kuwa macho na kuendelea kukesha kiroho; “Kesheni” ni usemi mfupi, wa kawaida katika Kiswahili cha kibiblia, unaohifadhi taswira ya kuwa macho.
- source_word: στήκετε
  choice: simameni imara
  rationale: Kitenzi hiki hapa kina maana ya kudumu bila kuyumbishwa, si kusimama kimwili tu.
- source_word: ἐν τῇ πίστει
  choice: katika imani
  rationale: Kirai chenye kibainishi kinaweza kuelekeza kwenye imani ya Kikristo kama eneo au msimamo ambamo waumini wanapaswa kudumu; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha maana hiyo.
- source_word: ἀνδρίζεσθε
  choice: iweni jasiri
  rationale: Kitenzi kinatokana na taswira ya kutenda kama mwanamume, lakini katika muktadha huu ni nahau inayohimiza ujasiri. Tafsiri ya Kiswahili inatoa maana ya nahau bila kudokeza kwamba agizo linawahusu wanaume peke yao.
- source_word: κραταιοῦσθε
  choice: mtiwe nguvu
  rationale: Umbo la amri ni la kutendwa; “mtiwe nguvu” linahifadhi uwezekano kwamba nguvu hupokelewa, badala ya kuugeuza moja kwa moja kuwa amri tendaji ya kujitia nguvu.
theological_decisions:
- issue: Maana ya πίστις katika ἐν τῇ πίστει
  choice: katika imani
  alternative: katika kuamini
  rationale: Muktadha na kibainishi cha Kigiriki vinaunga mkono maana ya imani ya Kikristo kama msimamo au maudhui ya kukiriwa, lakini Kiswahili “imani” kinaacha upana unaofaa bila kuingiza mfumo mwembamba wa kimadhehebu.
- issue: Taswira ya kijinsia katika ἀνδρίζεσθε
  choice: iweni jasiri
  alternative: tendeni kama wanaume
  rationale: Ingawa asili ya kitenzi ina taswira ya kiume, matumizi yake ni ya kinahau na humaanisha kuwa jasiri. Maana kuu imewekwa katika matini, na taswira halisi imehifadhiwa katika tanbihi ili kuepuka kuifanya amri ionekane kuwahusu wanaume pekee.
- issue: Sauti ya kutendwa katika κραταιοῦσθε
  choice: mtiwe nguvu
  alternative: iweni na nguvu
  rationale: Tafsiri kuu inahifadhi sauti ya kutendwa ya Kigiriki na uwezekano wa nguvu kutoka nje ya mhusika; tanbihi inatoa Kiswahili cha amri kinachoeleweka kwa urahisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye hadhi na unaosomeka kwa urahisi. Msururu wa amri za wingi umehifadhiwa, pamoja na mvutano wa kisemantiki wa kitenzi cha mwisho.
