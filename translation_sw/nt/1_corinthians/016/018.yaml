base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: sw
  text: Kwa maana wameiburudisha roho yangu na yenu. Kwa hiyo, watambueni watu wa namna hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wathaminini watu wa namna hiyo.” Kigiriki kina umbo la kiume, na hapa kinawarejelea hasa wanaume waliotajwa muda mfupi uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: wameiburudisha
  rationale: Kitenzi hiki kimetumiwa kwa maana ya kuleta faraja, nafuu, au nguvu mpya moyoni, si kupumzisha mwili kihalisi. “Wameiburudisha” ni Kiswahili cha kawaida kinachohifadhi picha hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu inayounga mstari huu na pongezi au agizo lililotangulia.
- source_word: πνεῦμα
  choice: roho
  rationale: Hapa neno hilo linaelekea kumaanisha hali ya ndani ya mtu, si Roho Mtakatifu. “Roho” huhifadhi usemi wa Paulo bila kuufafanua kupita kiasi.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: roho yangu na yenu
  rationale: Muundo huu unadumisha ufupi wa Kigiriki; neno “roho” linaeleweka pia baada ya “yenu” ingawa halirudiwi.
- source_word: ἐπιγινώσκετε
  choice: watambueni
  rationale: Katika muktadha huu ni mwito wa kuwatambua na kuwapa uthamini unaowastahili, si kuwatambua kwa sura tu. “Watambueni” huhifadhi upana huo bila kuongeza wazo rasmi la kuwaheshimu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au agizo linalotokana na sababu iliyotajwa.
- source_word: τοὺς τοιούτους
  choice: watu wa namna hiyo
  rationale: Usemi huu unawarejelea wanaume waliotajwa mara tu kabla, lakini kwa Kiswahili nomino “watu” haina jinsia ya kisarufi. Tanbihi inaweka wazi rejeleo maalumu la kiume katika muktadha.
theological_decisions:
- issue: Jinsia katika τοὺς τοιούτους
  choice: watu wa namna hiyo
  alternative: wanaume wa namna hiyo
  rationale: Ingawa kifungu cha Kigiriki ni cha kiume na kinawarejelea Stefano, Fortunato na Akaiko, “watu wa namna hiyo” ni Kiswahili cha asili zaidi. Tanbihi huhifadhi ukweli kwamba hapa wanaorejelewa hasa ni wanaume waliotangulia kutajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “roho yangu na yenu” umeachwa kwa ufupi wa kimtindo unaolingana na Kigiriki; tanbihi inaeleza maana mbadala ya ἐπιγινώσκετε na rejeleo la kiume.
