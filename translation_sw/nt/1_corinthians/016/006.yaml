  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: sw
  text: Huenda nitakaa pamoja nanyi, au hata nitakaa wakati wa majira ya baridi, ili mnisaidie kuendelea na safari yangu[a] popote nitakapokwenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnisindikize ninapoondoka.” Kitenzi cha Kigiriki kinaweza kumaanisha kumsindikiza msafiri au kumpa msaada anaohitaji ili aendelee na safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: pamoja nanyi
  rationale: Pamoja na kitenzi cha kukaa, kifungu hiki kinaonyesha kuwa Paulo angekaa katika ushirika wao; “pamoja nanyi” ni Kiswahili cha kawaida na wazi.
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza maelezo ya safari. Katika Kiswahili mstari unaendelea kwa kawaida bila kuongeza “na” au “lakini,” ambavyo vingebadili au kulemea uhusiano wa sentensi.
- source_word: τυχὸν
  choice: Huenda
  rationale: Neno hili linaonyesha uwezekano usio na uhakika; “huenda” ni la asili na huhifadhi hali hiyo.
- source_word: παραμενῶ
  choice: nitakaa
  rationale: Kitenzi kinamaanisha kubaki au kukaa kwa muda; “nitakaa” kinafaa kwa muktadha wa safari.
- source_word: ἢ καὶ
  choice: au hata
  rationale: 'Muundo huu unasisitiza uwezekano wa pili kuwa mkubwa zaidi: si kukaa tu, bali kukaa kipindi chote cha baridi.'
- source_word: παραχειμάσω
  choice: nitakaa huko wakati wote wa majira ya baridi
  rationale: Kitenzi kinamaanisha kukaa mahali wakati wa majira ya baridi. Ufafanuzi huu ni wa kawaida zaidi kuliko kitenzi kisichozoeleka kama “nitajibaridisha.”
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: προπέμψητε
  choice: mnisaidie kuendelea na safari yangu
  rationale: Katika muktadha wa safari, kitenzi hiki kinaweza kuhusisha kumsindikiza msafiri, kumwandalia mahitaji, au kumsaidia aendelee. Chaguo hili huhifadhi wazo la msaada bila kubainisha aina yake.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: kokote nitakakokwenda
  rationale: Muundo huu huhifadhi kutokujulikana kwa mahali na uwezekano wa safari ya baadaye.
