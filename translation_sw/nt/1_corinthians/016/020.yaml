  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: sw
  text: Ndugu wote wanawasalimu.[a] Salimianeni kwa busu takatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa inaweza kumaanisha waamini wote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Busu takatifu lilikuwa namna ya kawaida ya waamini kusalimiana, likionyesha ushirika wao na utakatifu wa salamu hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: wanawasalimu
  rationale: Katika muktadha wa barua, kitenzi hiki kina maana ya kutoa salamu. “Wanawasalimu” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Ndugu wote
  rationale: “Ndugu” huhifadhi picha ya uhusiano wa kifamilia iliyo katika ἀδελφοί na, katika Kiswahili, inaweza kuwahusu waamini wa kiume na wa kike bila kulazimisha ufafanuzi usio wazi katika neno la Kigiriki.
- source_word: ἀσπάσασθε
  choice: Salimianeni
  rationale: Umbo la kutendeana linaonyesha agizo la kila mmoja kumsalimu mwenzake na linaendana kwa kawaida na ἀλλήλους.
- source_word: ἀλλήλους
  choice: -aneni katika “Salimianeni”
  rationale: Maana ya kutendeana ya “mmoja na mwenzake” imejengwa kwa kawaida ndani ya kitenzi cha Kiswahili, hivyo hakuna haja ya kuongeza kirai kizito.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: kwa busu takatifu
  rationale: Kirai hiki huhifadhi tendo halisi la busu na sifa yake ya utakatifu, huku “kwa” kikionyesha namna au njia ya kusalimiana.
theological_decisions:
- issue: Maana ya ἀδελφοί katika mazingira ya kusanyiko la waamini
  choice: Ndugu
  alternative: Ndugu wa kiume; waamini wote
  rationale: Neno la Kiswahili “ndugu” linaweza kuwa la kijumla kijinsia na linafaa kwa waamini kama familia ya kiroho. Tanbihi inaweka wazi uwezekano huo bila kubadili neno la msingi kuwa ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Salimianeni” ni usemi wa kawaida unaobeba kwa ufupi maana ya kutendeana ya kitenzi na kiwakilishi cha Kigiriki.
