id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: sw
  text: Kuhusu mchango kwa ajili ya watakatifu[a], kama nilivyoyaagiza makanisa ya Galatia, nanyi fanyeni vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Hutambulisha mada mpya katika barua kwa njia ya kawaida; muktadha unatosha kubeba nguvu ya kiunganishi δέ bila kuongeza neno la wakati kama “sasa”.
- source_word: λογείας
  choice: mchango
  rationale: Hurejelea ukusanyaji wa fedha. “Mchango” ni Kiswahili cha kawaida katika muktadha huu na hakifanyi kitendo hiki kiwe sadaka ya ibada kwa lazima.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: kwa ajili ya watakatifu
  rationale: Hutaja walengwa wa mchango na kuhifadhi istilahi ya Paulo kwa waamini.
- source_word: διέταξα
  choice: nilivyoyaagiza
  rationale: Huonyesha maelekezo yenye mamlaka; “agiza” ni ya moja kwa moja bila kuongeza ukali usio wa lazima. Kiambishi “-ya-” kinarejelea makanisa.
- source_word: ἐκκλησίαις
  choice: makanisa
  rationale: Katika matumizi ya Paulo, neno hili linamaanisha jumuiya za waamini; “makanisa” ndiyo istilahi iliyozoeleka katika Kiswahili.
- source_word: Γαλατίας
  choice: Galatia
  rationale: Ni uhamishaji wa kawaida wa jina la eneo hilo.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: nanyi fanyeni vivyo hivyo
  rationale: 'Huhifadhi nguvu ya amri pamoja na ulinganisho: Wakorintho nao wafanye kwa namna ileile.'
theological_decisions:
- issue: Tafsiri ya ἅγιοι katika muktadha wa msaada wa kifedha
  choice: watakatifu
  alternative: watu wa Mungu
  rationale: “Watakatifu” huhifadhi istilahi ya kawaida ya Paulo kwa waamini na mwendelezo wake wa kiteolojia, bila kuifasiri hapa kuwa cheo cha watu waliotangazwa watakatifu baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “nanyi fanyeni vivyo hivyo” unaweka wazi amri ya wingi na msisitizo wa καί.
