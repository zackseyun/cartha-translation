  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: sw
  text: Ninafurahi kwa kuwasili kwa Stefana, Fortunato na Akaiko, kwa sababu watu hawa wameziba pengo lililoachwa na kutokuwapo kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamekamilisha kile kilichokosekana kwa upande wenu.” Yaelekea Paulo anamaanisha kwamba Wakorintho hawakuweza kuwapo pamoja naye ana kwa ana, si kwamba walikuwa na upungufu wa kiadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Ninafurahi
  rationale: Kitenzi cha wakati wa sasa, nafsi ya kwanza umoja; kinahifadhi usemi wa moja kwa moja wa Paulo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: δὲ
  choice: (hakijatafsiriwa kwa neno maalumu)
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza wazo; mtiririko wa Kiswahili hauhitaji ‘na’ au ‘lakini’ hapa.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: kwa kuja kwa
  rationale: Katika muktadha huu παρουσία ni kuwasili au kuwapo kwa watu hawa, si matumizi ya kieskatolojia; ‘kwa kuja kwa’ ni ya asili katika Kiswahili.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Stefana, Fortunato na Akaiko
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha sababu ya Paulo kufurahi.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: pengo la kutokuwapo kwenu
  rationale: ὑστέρημα kimsingi ni kile kilichopungua au kukosekana. Tafsiri hii inaonyesha maana inayowezekana katika muktadha—kutokuwapo kwa Wakorintho wenyewe—huku ‘pengo’ likihifadhi dhana ya upungufu.
- source_word: οὗτοι
  choice: watu hawa
  rationale: Kiwakilishi kionyeshi kina msisitizo; ‘watu hawa’ huwarejelea waziwazi wale watatu.
- source_word: ἀνεπλήρωσαν
  choice: wamejaza
  rationale: Kitenzi humaanisha kujaza au kutimiza kilichopungua; pamoja na ‘pengo’ kinatoa Kiswahili cha kawaida bila kupoteza taswira ya Kigiriki.
theological_decisions:
- issue: Maana ya τὸ ὑμέτερον ὑστέρημα
  choice: pengo la kutokuwapo kwenu
  alternative: kile kilichopungua kutoka kwenu
  rationale: Muktadha unaelekea kwa watu hawa kufidia kutokuwapo kwa Wakorintho mbele ya Paulo, si kuwalaumu kwa upungufu wa kiadili. Hata hivyo, tanbihi inadumisha uwezekano mpana zaidi wa maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘wamejaza pengo’ ni wa asili, nao unaunganisha maana ya ἀναπληρόω na ufafanuzi wa kimuktadha wa ὑστέρημα. Alama ya tanbihi imewekwa baada ya orodha ya majina ili kufuata data iliyotolewa, ingawa tanbihi inafafanua kishazi kinachofuata.
