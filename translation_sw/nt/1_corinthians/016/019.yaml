reference: 1 Corinthians 16:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: sw
  text: Makanisa ya Asia yanawasalimu[a]. Akila na Priska[b], pamoja na kanisa lililo katika nyumba yao, wanawasalimu sana katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” hapa ni jimbo la Kiroma la Asia, lililokuwa magharibi mwa Asia Ndogo, wala si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Kigiriki hapa kina jina “Priska”; mahali pengine anaitwa pia “Priskila” (kwa mfano, Matendo 18:2, 18, 26; Waroma 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: yanawasalimu / wanawasalimu
  rationale: Kitenzi ἀσπάζομαι hapa humaanisha kusalimu au kutuma salamu. “Kuwasalimu” ni usemi wa kawaida na wenye heshima katika Kiswahili; katika sentensi ya pili wingi wa kisarufi umetumiwa kwa sababu Akila, Priska na kanisa wanatajwa pamoja.
- source_word: αἱ ἐκκλησίαι
  choice: makanisa
  rationale: Katika matumizi ya Paulo, ἐκκλησία kwa kawaida humaanisha kusanyiko la waamini au kanisa; wingi “makanisa” unaeleweka wazi na kwa kawaida.
- source_word: τῆς Ἀσίας
  choice: ya Asia
  rationale: Tafsiri hii inafuata umbo la Kigiriki bila kuongeza maelezo katika matini; tanbihi inafafanua kuwa ni jimbo la Kiroma, si bara la kisasa.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo unaoonyesha ushirika na uhusiano wa waamini ndani ya Bwana bila kuufafanua kupita kiasi.
- source_word: πολλὰ
  choice: sana
  rationale: Neno hili limetumiwa kielezi kuimarisha tendo la kusalimu. “Wanawasalimu sana” ni Kiswahili cha kawaida kinachowasilisha uzito na uchangamfu wa salamu.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Akila na Priska
  rationale: Majina yamenukuliwa kwa namna inayofaa Kiswahili. “Priska” linafuata moja kwa moja umbo Πρίσκα la matini ya Kigiriki.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: pamoja na kanisa lililo nyumbani mwao
  rationale: Usemi huu unaonyesha kanisa lililokuwa katika nyumba yao. Tafsiri ni ya karibu na ya kawaida bila kuongeza wazi kitenzi “kukutana,” ambacho hakipo katika matini.
theological_decisions:
- issue: Maana ya ἐκκλησία katika mazingira ya nyumbani
  choice: “kanisa lililo nyumbani mwao” linaeleweka kuwa kusanyiko la waamini katika nyumba ya Akila na Priska
  alternative: Kuelewa usemi huo kama familia yao tu au kama jina la kitaasisi la “kanisa la nyumbani”
  rationale: Katika matumizi ya kawaida ya Paulo, ἐκκλησία humaanisha kusanyiko la waamini; muundo κατ’ οἶκον unaonyesha mahali pake katika nyumba, si familia pekee.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi maana ya kiungamo na ya uhusiano katika usemi wa Paulo “katika Bwana” bila kuubana zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo wa chanzo umehifadhiwa kadiri unavyoweza kuwa wa kawaida katika Kiswahili; alama ya tanbihi [b] imewekwa baada ya “Priska” kwa sababu maelezo yake yanahusu jina hilo.
