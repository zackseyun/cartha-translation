translation:
  language: sw
  text: Na ikiwa inafaa mimi pia kwenda[a], wataenda pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikiwa ni vema mimi pia kwenda.” Usemi wa Kigiriki unaweza kumaanisha jambo linalofaa, lililo jema, au lenye sababu ya kutosha katika hali hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Na ikiwa
  rationale: δέ ni kiunganishi hafifu hapa, na ἐάν huanzisha sharti; “Na ikiwa” hudumisha mtiririko bila kuongeza utofautishaji mkali.
- source_word: ἄξιον ᾖ
  choice: inafaa
  rationale: Usemi huu usio na mtendaji maalumu unaonyesha kwamba jambo linafaa au linastahili kufanywa katika hali husika, wala hauzungumzii ustahili wa kimaadili wa Paulo.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: mimi pia kwenda
  rationale: Muundo wenye kitenzi-jina unaeleza tendo linalotathminiwa kuwa linafaa; κἀμέ huhifadhi maana ya nyongeza, “mimi pia.”
- source_word: σὺν ἐμοὶ
  choice: pamoja nami
  rationale: σύν pamoja na hali ya dative huonyesha kuandamana; “pamoja nami” ni Kiswahili cha kawaida na wazi.
- source_word: πορεύσονται
  choice: wataenda
  rationale: Wakati ujao wa πορεύομαι unaeleza kwenda kwa wajumbe; “wataenda” huepuka kuingiza dhana yenye nguvu zaidi ya kuandamana ambayo haijawekwa wazi na kitenzi chenyewe.
theological_decisions:
- issue: Maana ya sharti la Paulo kuhusu kwenda pamoja na wajumbe
  choice: Paulo anasema kwamba ikiwa itaonekana inafaa yeye pia kwenda, wajumbe wataenda pamoja naye.
  alternative: Zawadi ikiwa kubwa au muhimu vya kutosha Paulo aende; au Paulo mwenyewe akiwa anastahili kwenda.
  rationale: ἄξιον imetumiwa bila mtendaji maalumu, na kishazi cha kitenzi-jina kinaonyesha kwamba tendo la kwenda ndilo linalopimwa kuwa linafaa, si thamani ya zawadi wala ustahili wa kimaadili wa Paulo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Inafaa” hutoa maana ya kufaa katika mazingira haya bila kuifanya kauli ihusu ustahili wa Paulo. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa tanbihi inaeleza usemi mkuu wa sharti.
