base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: sw
  text: Na nitakapofika, nitawatuma wale mtakaowakubali wakiwa na barua, ili wapeleke zawadi yenu[a] kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi yenu ya ukarimu.” Neno la Kigiriki linaweza pia kumaanisha “neema,” lakini hapa linarejelea mchango unaopelekwa Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Na nitakapofika
  rationale: Muundo wa ὅταν pamoja na kitenzi cha hali tegemezi unaelekeza kwenye tukio la wakati ujao; “nitakapofika” ni Kiswahili cha kawaida na sahihi. “Na” linaonyesha mwendelezo mwepesi wa δέ bila kuongeza wazo kali la upinzani.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: wale mtakaowakubali
  rationale: Katika muktadha wa kuchagua wajumbe, δοκιμάζω ina maana ya kuwachunguza na kuwakubali kuwa wanafaa. “Mtakao­wakubali” huwasilisha matokeo hayo kwa lugha ya asili bila kuongeza maelezo yasiyotajwa wazi.
- source_word: δι’ ἐπιστολῶν
  choice: pamoja na barua
  rationale: διά pamoja na hali ya umilikaji huonyesha nyenzo au kitu kinachoandamana na wajumbe. “Pamoja na barua” linaonyesha kwa kawaida kwamba wajumbe watatumwa wakiwa na barua, bila kubainisha zaidi kwamba ni barua za utambulisho au mapendekezo.
- source_word: τούτους πέμψω
  choice: nitawatuma ... wale
  rationale: τούτους linawarejelea kwa mkazo watu watakaokubaliwa. Kiswahili hutumia kiambishi cha yambwa “-wa-” pamoja na “wale” kwa uwazi na mtiririko wa kawaida.
- source_word: ἀπενεγκεῖν
  choice: ili wapeleke
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kuwatuma wajumbe. “Ili wapeleke” huweka wazi kusudi na mwelekeo wa kuondoka Korintho kwenda Yerusalemu.
- source_word: τὴν χάριν ὑμῶν
  choice: zawadi yenu
  rationale: Katika muktadha wa mchango kwa ajili ya waamini wa Yerusalemu, χάρις linarejelea zawadi halisi inayotolewa kwa ukarimu. “Zawadi yenu” ni wazi kwa msomaji wa kawaida, huku maana pana ya neno ikihifadhiwa katika tanbihi.
- source_word: εἰς Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Mwelekeo unaoonyeshwa na εἰς unapatikana tayari katika kitenzi “wapeleke”; kwa hiyo jina la mahali “Yerusalemu” ni la kawaida na halihitaji kihusishi kingine.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa mchango
  choice: Zawadi au mchango wa mali kwa ajili ya waamini wa Yerusalemu
  alternative: Neema kwa maana ya jumla, au tendo la ukarimu
  rationale: Muktadha wa 1 Wakorintho 16 unahusu kukusanya msaada kwa ajili ya watakatifu. Hivyo neno linarejelea zawadi halisi, ingawa bado lina kivuli cha maana ya ukarimu unaotokana na neema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Mpangilio umeweka “pamoja na barua” karibu na kitendo cha kutuma ili kuonyesha kuwa wajumbe wataandamana na barua, huku sentensi ikibaki ya kawaida katika Kiswahili.
