base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: sw
  text: Kwa hiyo, mtu yeyote asimdharau. Bali msaidieni aendelee na safari yake kwa amani, ili aje kwangu, kwa maana ninamtarajia pamoja na ndugu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na ndugu na dada,” ikiwa Paulo anamaanisha kundi pana la waamini au wafanyakazi wenza wanaotarajiwa kuja pamoja naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Kwa hiyo, mtu yeyote asi-
  rationale: οὖν inaonyesha hitimisho linalotokana na maagizo yaliyotangulia, na μή pamoja na kitenzi cha hali tegemezi huunda katazo.
- source_word: ἐξουθενήσῃ
  choice: asimdharau
  rationale: Kitenzi hiki humaanisha kumwona mtu kuwa hafai au asiye na maana; “dharau” ni neno la kawaida, lenye nguvu inayofaa muktadha.
- source_word: προπέμψατε
  choice: msaidieni aendelee na safari yake
  rationale: Katika muktadha wa safari, neno hili linaweza kuhusisha kumsindikiza au kumpatia msaada wa kuendelea na safari, si kumtuma tu.
- source_word: ἐν εἰρήνῃ
  choice: kwa amani
  rationale: Inahifadhi taswira ya kuondoka kwa utulivu, bila vizuizi wala migogoro.
- source_word: ἵνα ἔλθῃ πρός με
  choice: ili aje kwangu
  rationale: ἵνα pamoja na hali tegemezi hapa inaonyesha kusudi.
- source_word: ἐκδέχομαι
  choice: ninamtarajia
  rationale: Wakati uliopo unaonyesha matarajio yanayoendelea; “ninamtarajia” ni Kiswahili cha kawaida na cha asili.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: pamoja na ndugu
  rationale: ἀδελφῶν ni wingi wa kiume, lakini “ndugu” katika Kiswahili inaweza kurejelea waamini au wafanyakazi wenza bila kulazimisha jinsia ya kundi.
theological_decisions:
- issue: Maana ya μετὰ τῶν ἀδελφῶν na kundi linalotarajiwa
  choice: pamoja na ndugu
  alternative: pamoja na ndugu wa kiume na wa kike
  rationale: Kigiriki kina wingi wa kiume, lakini kinaweza kumaanisha kundi pana la waamini au wafanyakazi wenza. Tafsiri kuu inadumisha utata huo wa muktadha, na tanbihi inaeleza uwezekano wa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Msaidieni aendelee na safari yake” huwasilisha maana ya msaada wa safari kwa uwazi zaidi kuliko “mtumeni,” huku “kwa amani” ikihifadhi muundo na wazo la chanzo.
