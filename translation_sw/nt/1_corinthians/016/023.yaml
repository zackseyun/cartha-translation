  text: The grace of the Lord Jesus be with you.
translation:
  language: sw
  text: Neema ya Bwana Yesu iwe pamoja nanyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida na lenye uzito katika Kiswahili cha Biblia kwa fadhili na baraka zinazotolewa kwa ukarimu; linafaa katika baraka hii ya Paulo.
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili kwa cheo hiki cha Yesu na linadumisha nguvu yake ya Kikristo katika Agano Jipya.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: μεθ’ ὑμῶν
  choice: iwe pamoja nanyi
  rationale: Kigiriki kina maana ya msingi ya “pamoja nanyi” bila kitenzi kilichoandikwa; “iwe” huonyesha kwa Kiswahili kwa njia ya kawaida kwamba hii ni baraka au ombi.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ya Bwana Yesu
  rationale: Muundo huu unafuata uhusiano wa kimilikishi/chanzo wa Kigiriki bila kuufafanua kupita kiasi kuwa “kutoka kwa Bwana Yesu.”
theological_decisions:
- issue: Baraka isiyo na kitenzi wazi katika Kigiriki
  choice: 'Kuweka “iwe”: “Neema ya Bwana Yesu iwe pamoja nanyi.”'
  alternative: “Neema ya Bwana Yesu pamoja nanyi.”
  rationale: Ingawa Kigiriki hakina kitenzi hapa, Kiswahili cha kawaida huhitaji “iwe” ili kuonyesha wazi nguvu ya baraka, bila kuongeza wazo la kitheolojia lisilokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Nanyi” linafaa kwa wingi wa ὑμῶν na kwa mtindo wa baraka ya kufunga barua.
