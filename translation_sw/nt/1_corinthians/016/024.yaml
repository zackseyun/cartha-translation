translation:
  language: sw
  text: Upendo wangu uwe pamoja nanyi nyote katika Masihi Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo Yesu.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au kutafsiriwa kwa namna ya jadi “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: Upendo wangu
  rationale: Huwasilisha moja kwa moja upendo wa Paulo mwenyewe; “upendo” ni neno la kawaida, la sasa, na lenye heshima katika Kiswahili.
- source_word: μετὰ πάντων ὑμῶν
  choice: uwe pamoja nanyi nyote
  rationale: Kigiriki hakina kitenzi, lakini katika salamu hii ya mwisho maana ya ombi au baraka inadokezwa. “Uwe pamoja nanyi nyote” ni ya asili kwa Kiswahili na inadumisha kuwajumuisha wote.
- source_word: ἐν
  choice: katika
  rationale: Inahifadhi usemi wa Paulo unaoonyesha kuwa upendo huo uko katika uhusiano au umoja na Masihi, bila kuufafanua kupita kiasi.
- source_word: Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός ni cheo chenye maana ya “Masihi,” huku Ἰησοῦ likiwa jina “Yesu.” Tafsiri hii inaweka wazi maana ya cheo hicho; umbo la jadi “Kristo Yesu” limetolewa katika tanbihi.
theological_decisions:
- issue: Namna ya kutafsiri Χριστός katika usemi ἐν Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” hutafsiri maana ya cheo cha Kigiriki badala ya kukinakili tu, lakini tanbihi inadumisha umbo la jadi linalojulikana sana.
- issue: Kukamilisha sentensi ya Kigiriki isiyo na kitenzi
  choice: uwe pamoja nanyi
  alternative: uko pamoja nanyi
  rationale: Muktadha wa hitimisho la barua unaunga mkono ombi au tamko la baraka. “Uwe” hudumisha sauti hiyo bila kugeuza usemi kuwa dai la taarifa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kigiriki, huku kitenzi “uwe” kikikamilisha kwa kawaida ombi la baraka lililodokezwa.
