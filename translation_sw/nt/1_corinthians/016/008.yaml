lexical_decisions:
- source_word: ἐπιμενῶ
  choice: nitakaa
  rationale: Kitenzi hiki cha wakati ujao katika muktadha wa mpango wa safari kinaonyesha kuendelea kubaki mahali kwa kipindi fulani. “Nitakaa” ni Kiswahili cha kawaida na cha asili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti nyepesi na maelezo ya safari yaliyotangulia; “Lakini” kinahifadhi uhusiano huo.
- source_word: ἐν Ἐφέσῳ
  choice: Efeso
  rationale: Muundo huu una maana ya mahali. Kwa Kiswahili, jina la mji linaweza kutumiwa moja kwa moja baada ya kitenzi “kukaa” bila kihusishi, na hivyo kutoa sentensi ya asili.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: mpaka Pentekoste
  rationale: ἕως pamoja na umilikishi huonyesha muda unaoendelea hadi wakati fulani. “Pentekoste” ni jina lililozoeleka katika muktadha wa Agano Jipya.
