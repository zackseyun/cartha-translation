lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huendeleza ombi la Paulo katika mstari uliotangulia na kubakiza nguvu ya kiunganishi cha kusudi au maudhui bila kukifanya kifungu hiki kuwa sentensi huru.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: Huhifadhi msisitizo wa kuwajumuisha Wakorintho pia katika mwitikio unaotakiwa.
- source_word: ὑποτάσσησθε
  choice: mjitiishe
  rationale: Umbo la kitenzi linaweza kueleza kujiweka kwa hiari chini ya uongozi au utaratibu unaotambuliwa; ‘mjitiishe’ hubakiza maana hiyo ya kujihusisha wenyewe.
- source_word: τοῖς τοιούτοις
  choice: kwa watu kama hao
  rationale: Hurejelea watu wa aina ya Stefana na wengine wanaojitoa kwa huduma, bila kuingiza kizuizi cha kijinsia ambacho si hoja ya kirai hiki.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: kwa kila mtu anayeshirikiana katika kazi
  rationale: Huhifadhi hali ya kitendo ya kushirikiana na wengine katika kazi, huku ikitoa Kiswahili cha kawaida bila kuongeza mshirika mahsusi ambaye hajatajwa wazi katika Kigiriki.
- source_word: καὶ κοπιῶντι
  choice: na kufanya kazi kwa bidii
  rationale: Kitenzi κοπιάω huonyesha kazi ngumu au yenye kuchosha; usemi huu ni wa kawaida, wenye heshima, na wenye nguvu kuliko ‘kufanya kazi’ pekee.
theological_decisions:
- issue: Aina ya kujitiisha inayoamriwa
  choice: Wito wa kujitiisha kwa hiari kwa watumishi wa Kikristo kama wale waliotajwa katika muktadha
  alternative: Amri pana ya utii kamili katika mfumo wa ngazi za mamlaka
  rationale: Muktadha wa 1 Wakorintho 16:15–18 unahusu nyumba ya Stefana na wote wanaoshiriki na kufanya kazi kwa bidii. ‘Mjitiishe’ huhifadhi uzito wa agizo bila kuingiza dai la utii usio na mipaka ambalo mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo tegemezi unaoanza na ‘ili’ umehifadhiwa kwa sababu mstari huu unaendeleza ombi lililoanza katika mstari uliotangulia.
