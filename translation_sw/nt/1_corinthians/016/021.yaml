- source_word: τῇ ἐμῇ χειρί
  choice: nimeiandika kwa mkono wangu mwenyewe
  rationale: Dativu ya Kigiriki inaonyesha kwamba salamu hiyo iliandikwa kwa mkono wa Paulo mwenyewe. Kitenzi “nimeiandika” kimewekwa wazi kwa Kiswahili cha kawaida, ingawa katika Kigiriki kinaeleweka bila kutajwa.
- source_word: Παύλου
  choice: —Paulo
  rationale: Genitivi ya jina inamtambulisha Paulo kama mwandishi wa salamu ya mkono wake; mstari wa em unaakisi vizuri badiliko la ghafla la kujitaja mwishoni.
