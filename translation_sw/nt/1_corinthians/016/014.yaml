review_pass:
  verdict: revise
  source_fidelity: Draft communicates the comprehensive scope, the addressees’ conduct, the exhortative force, and love as the governing manner. However, singular “Kila jambo” conflicts grammatically with plural “litendeke,” and the resulting construction is not sound Swahili.
  naturalness: “Kila jambo mnalofanya na litendeke” is ungrammatical because “jambo” is singular while “litendeke” should agree with a plural antecedent if the intended sense is comprehensive. “Mambo yenu yote yafanyike kwa upendo” is grammatical, idiomatic formal Standard East African Swahili, and retains the concise exhortative register.
  terminology: “Upendo” is the appropriate established rendering of ἀγάπη. “Kwa upendo” naturally conveys the Greek ἐν ἀγάπῃ as the manner or governing sphere of conduct. “Mambo yenu yote” preserves the source’s deliberately broad πάντα ὑμῶν without unnecessarily limiting it to explicit actions.
