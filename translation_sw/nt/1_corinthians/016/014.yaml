    issue: Number-agreement error in the main text
    rationale: “Kila jambo” is noun class 5 singular and requires “litendeke,” but the source πάντα is plural and the intended comprehensive sense is better represented by “Mambo ... yote,” which correctly takes “yafanyike.”
  - severity: low
    issue: Footnote is not a meaningful lexical alternative
    rationale: The footnote’s proposed wording is effectively the same sense as the needed main rendering, while its explanatory claim of greater literalness is weakened by the unidiomatic formulation. A literal-oriented alternative should preserve the elliptical possessive expression without claiming more precision than the Swahili permits.
