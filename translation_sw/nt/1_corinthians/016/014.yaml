- from: Kila jambo mnalofanya na litendeke kwa upendo[a].
  to: Mambo yenu yote yafanyike kwa upendo[a].
  rationale: The revision corrects singular/plural agreement and uses a natural exhortative subjunctive. “Mambo yenu yote” reflects the broad, elliptical Greek phrase πάντα ὑμῶν (“all things of you/yours”) without deciding too narrowly that it refers only to actions, while “yafanyike kwa upendo” clearly conveys the imperative exhortation and manner phrase.
