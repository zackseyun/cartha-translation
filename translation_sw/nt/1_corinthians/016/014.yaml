lexical_decisions:
- source_word: πάντα
  choice: Kila jambo
  rationale: Neuta ya wingi ya πᾶς ina maana pana ya mambo yote. “Kila jambo” ni Kiswahili cha kawaida kinachohifadhi upeo huo wa ujumla.
- source_word: ὑμῶν
  choice: mnalofanya
  rationale: Kiwakilishi hiki cha umilikaji kinaungana na πάντα kwa usemi uliofupishwa, kihalisi “mambo yote yenu.” “Mnalofanya” huweka wazi maana inayodokezwa bila kubadili wazo kuu.
- source_word: ἐν ἀγάπῃ
  choice: kwa upendo
  rationale: Kirai hiki kinaweza kuonyesha namna au mazingira ya tendo. “Kwa upendo” ni usemi wa asili katika Kiswahili unaoeleza kwamba upendo uongoze kila tendo.
- source_word: γινέσθω
  choice: na litendeke
  rationale: Hii ni amri ya nafsi ya tatu yenye maana ya himizo, “na iwe/na itokee.” “Na litendeke” huwasilisha nguvu ya himizo kwa Kiswahili sanifu na kuendana na “kila jambo.”
theological_decisions: []
