base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: sw
  text: Tunaposemwa vibaya[a], tunawasihi; tumekuwa kama takataka za ulimwengu, uchafu wa vitu vyote[b], hadi sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tunasingiziwa” au “Tunapotukanwa.” Kitenzi cha Kigiriki humaanisha kusemwa kwa ubaya au jina la mtu kuchafuliwa.
    reason: lexical_alternative
  - marker: b
    text: Maneno mawili yaliyotafsiriwa “takataka” na “uchafu” ni adimu na makali sana. Yanaweza kumaanisha kile kinachoondolewa, kufutwa, au kukwanguliwa wakati wa kusafisha, na hivyo kusisitiza dharau kali ya kijamii. “Wa vitu vyote” hufuata muundo mpana wa Kigiriki; yaweza pia kutafsiriwa “wa yote.”
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Tunaposemwa vibaya
  rationale: Kirai hiki cha kutendwa kinaonyesha kusemwa kwa ubaya au kuchafuliwa jina. Muundo wa wakati wenye “tunapo-” ni wa kawaida katika Kiswahili na unahifadhi nguvu ya kisintaksia ya participio.
- source_word: παρακαλοῦμεν
  choice: tunawasihi
  rationale: Katika mfululizo huu wa majibu kwa kutendewa vibaya, kitenzi kinaelekea kumaanisha kuwaomba au kuwasihi wanaowatendea hivyo, badala ya kulipiza kisasi. Kiwakilishi cha kitu “-wa-” kinaeleweka kutokana na muktadha, ingawa hakikutajwa wazi katika Kigiriki.
- source_word: ὡς
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho, si lazima utambulisho kamili.
- source_word: περικαθάρματα
  choice: takataka
  rationale: Neno adimu humaanisha kinachoondolewa wakati wa kusafisha na kwa muktadha huonyesha kitu kinachodharauliwa kabisa. “Takataka” ni la sasa, linaeleweka, na lina nguvu inayofaa.
- source_word: τοῦ κόσμου
  choice: za ulimwengu
  rationale: Huhifadhi uhusiano wa genitivi kwa Kiswahili cha kawaida.
- source_word: ἐγενήθημεν
  choice: tumekuwa
  rationale: Hueleza hali iliyotokea na inayoendelea hadi wakati wa kuandika, hasa kwa kuzingatia “mpaka sasa.”
- source_word: πάντων
  choice: na wote
  rationale: Umbo hili linaweza kueleweka kwa upana kama “wote” au “vitu vyote.” Katika uhusiano wake na περίψημα, “na wote” linaweza kuonyesha kuwa mitume wamekuwa kile ambacho kila mtu hukifuta na kukitupa, huku utata wa upeo ukibainishwa katika tanbihi.
- source_word: περίψημα
  choice: uchafu unaofutwa
  rationale: Neno hili adimu linaashiria uchafu au mabaki yanayofutwa au kukwanguliwa. Kirai hiki ni cha kueleweka katika Kiswahili na kinahifadhi picha ya kusafisha pamoja na dharau kali.
- source_word: ἕως ἄρτι
  choice: mpaka sasa
  rationale: Ni usemi wa kawaida wa wakati unaoonyesha mwendelezo hadi wakati wa kuandika.
theological_decisions:
- issue: Jinsi ya kutafsiri jozi περικαθάρματα / περίψημα
  choice: Kutumia lugha yenye picha ya kudharauliwa kabisa—“takataka” na “uchafu unaofutwa”—bila kuingiza dhana ya waathiriwa wa kafara katika matini kuu.
  alternative: Kutafsiri kwa lugha ya kimapokeo kama “uchafu” na “makwanguzo,” au kuyafasiri kama dokezo la kiibada kuhusu kafara ya utakaso.
  rationale: Muktadha unasisitiza fedheha ya mitume na jinsi walivyodharauliwa na ulimwengu. Ingawa maneno haya yanaweza kuwa na uhusiano wa nyuma na utakaso au desturi fulani za kiibada, mstari wenyewe hautoi msingi wa kulazimisha maana hiyo ya kiteolojia katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Lugha kali ya dharau katika chanzo imehifadhiwa bila kutumia misamiati ya kale isiyoeleweka au kuongeza ufafanuzi wa kimadhehebu.
