  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: sw
  text: Katika jambo hili, basi[a], kinachotakiwa kwa mawakili ni kwamba mtu apatikane mwaminifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hapa basi,” au “Katika jambo hili, zaidi ya hayo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki: “kinatafutwa miongoni mwa mawakili kwamba mtu apatikane mwaminifu”; maana yake ni kile kinachotarajiwa au kutakiwa kwao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: katika jambo hili
  rationale: Katika muktadha huu neno hilo linaelekeza kwenye jambo linalozungumziwa, si mahali tu; tafsiri hii ni ya kawaida na inaunganisha aya na maelezo yaliyotangulia.
- source_word: λοιπὸν
  choice: basi
  rationale: Hapa linaendeleza hoja na kuonyesha matokeo au hatua inayofuata katika fikira za Paulo. “Basi” ni kiunganishi cha kawaida na chenye mtiririko mzuri katika Kiswahili.
- source_word: ζητεῖται
  choice: kinachotakiwa
  rationale: Ingawa maana ya msingi ni “kinatafutwa,” katika muundo huu neno linaonyesha kile kinachodaiwa au kutarajiwa kwa mawakili.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: kwa mawakili
  rationale: Muundo huu unataja kundi ambalo sharti hilo linawahusu. Kiswahili cha kawaida hutumia “kinachotakiwa kwa mawakili.”
- source_word: οἰκονόμοις
  choice: mawakili
  rationale: “Mawakili” huhifadhi wazo la watu waliokabidhiwa kusimamia mali au mambo ya mwingine, kulingana na mfano wa usimamizi wa nyumba katika muktadha.
- source_word: ἵνα
  choice: ni kwamba
  rationale: Hapa ἵνα linatambulisha maudhui ya kile kinachotakiwa, wala halionyeshi kusudi pekee.
- source_word: πιστός
  choice: mwaminifu
  rationale: Neno hili linaonyesha uaminifu na kutegemeka katika kutekeleza jambo alilokabidhiwa mtu.
- source_word: τις
  choice: kila mmoja
  rationale: Kigiriki kina umoja usioainishwa. Katika Kiswahili, “kila mmoja” huonyesha kwa kawaida kwamba sharti linamhusu kila wakili bila kulifanya kuwa maalumu kwa wanaume.
- source_word: εὑρεθῇ
  choice: aonekane kuwa
  rationale: Huhifadhi maana ya kupatikana au kuthibitika kuwa na sifa hiyo baada ya kuchunguzwa, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Umoja wa uwakilishi na usahihi wa kijinsia
  choice: kila mmoja aonekane kuwa mwaminifu
  alternative: mtu aonekane kuwa mwaminifu
  rationale: τις ni umoja usioainishwa, na umbo la kiume la πιστός ni la kisarufi katika muktadha huu, si sharti linalowahusu wanaume pekee. “Kila mmoja” huhifadhi matumizi ya umoja huku ikionyesha wazi kwamba kauli ni ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Mawakili” limetumiwa kwa maana ya wasimamizi waliokabidhiwa jambo, si hasa wanasheria; muktadha wa aya iliyotangulia unaifanya maana hiyo ieleweke.
