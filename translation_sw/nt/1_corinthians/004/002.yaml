review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands ὧδε λοιπὸν as a contextual transition, ζητεῖται as an idiomatic requirement, and οἰκονόμοι as entrusted stewards. However, “aonekane kuwa” means “seem/appear to be” and does not adequately render εὑρεθῇ, which denotes being found or shown upon assessment. “Kila mmoja” also makes the indefinite τις more explicitly distributive than the Greek; “mtu” preserves the generic singular without that added emphasis.
  naturalness: “Katika jambo hili, basi” and “kinachotakiwa kwa mawakili” are clear, idiomatic Standard East African Swahili. “Mawakili” is retained because it is an established biblical term in this immediate metaphorical context, though it can have legal associations in contemporary general usage.
  terminology: “Mawakili” suitably maintains the entrusted-management metaphor in continuity with the preceding verse. “Mwaminifu” accurately conveys πιστός here as reliability in a trust. The correction to “apatikane” restores the evaluative sense of εὑρεθῇ.
  issues:
  - severity: medium
    issue: “Aonekane kuwa” weakens εὑρεθῇ.
    rationale: The Greek passive subjunctive means “be found,” that is, be found to be faithful upon evaluation. “Aonekane kuwa” normally means “appear/seem to be” and can imply mere appearance rather than demonstrated faithfulness.
  - severity: low
    issue: “Kila mmoja” is more distributive than τις.
    rationale: τις is an indefinite singular (“someone/one”), not specifically “each one.” A generic singular “mtu” preserves the source form and scope more closely.
  revised_text: Katika jambo hili, basi[a], kinachotakiwa kwa mawakili ni kwamba mtu apatikane mwaminifu.[b]
