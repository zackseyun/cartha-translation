  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: sw
  text: Siwaandikii mambo haya ili niwaaibishe, bali ninawaonya kama watoto wangu wapendwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninawakanya kama watoto wangu wapendwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: ili niwaaibishe
  rationale: Pamoja na οὐκ na kitenzi γράφω, inaonyesha kusudi ambalo Paulo analikana. “Kuwaaibisha” huhifadhi uzito wa aibu katika muktadha wa heshima na aibu.
- source_word: γράφω ταῦτα
  choice: ninawaandikia mambo haya
  rationale: Wakati uliopo wa barua umetafsiriwa kwa Kiswahili cha kawaida; ταῦτα ya wingi imehifadhiwa kama “mambo haya,” na kiambishi cha yambwa kinaweka wazi wanaoandikiwa.
- source_word: ἀλλ’
  choice: bali
  rationale: Huonyesha tofauti iliyo wazi kati ya kusudi linalokanushwa na tendo chanya la Paulo.
- source_word: ὡς
  choice: kama
  rationale: Hudumisha uhusiano wa kulinganisha bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: τέκνα μου ἀγαπητὰ
  choice: watoto wangu wapendwa
  rationale: “Watoto” ni jumuishi kijinsia na huonyesha uhusiano wa kifamilia; “wapendwa” huhifadhi joto la ἀγαπητά.
- source_word: νουθετῶν
  choice: ninawaonya
  rationale: Neno hili linahusisha onyo lenye kusudi la kuelekeza au kusahihisha. “Ninawaonya” ni la kawaida na lenye nguvu ya kichungaji katika Kiswahili, huku tanbihi ikitaja upande wa mafundisho.
theological_decisions:
- issue: Sauti ya kichungaji katika marekebisho ya Paulo
  choice: ninawaonya kama watoto wangu wapendwa
  alternative: ninawashauri kama watoto wangu wapendwa
  rationale: Tafsiri inadumisha nguvu ya onyo na marekebisho ya νουθετῶν, huku maneno “watoto wangu wapendwa” yakizuia yasieleweke kama hukumu kali isiyo na upendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetiririka kwa kawaida huku ukihifadhi tofauti kati ya kuaibisha na kuonya kwa upendo.
