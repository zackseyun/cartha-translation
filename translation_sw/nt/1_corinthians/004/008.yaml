  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: sw
  text: Tayari mmeshiba; tayari mmekuwa matajiri; bila sisi mmetawala. Laiti kweli mngetawala,[a] ili nasi pia tupate kutawala pamoja nanyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Laiti kweli mngekuwa wafalme.”
    reason: lexical_alternative
  - marker: b
    text: 'Paulo anasema kwa kejeli: Wakorintho wanatenda kana kwamba tayari wameshiba kabisa, wametajirika, na wanatawala.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: Inahifadhi msisitizo wa wakati unaorudiwa mwanzoni mwa vifungu viwili na kuendeleza kejeli ya Paulo.
- source_word: κεκορεσμένοι ἐστέ
  choice: mmeshiba
  rationale: Kauli hii ya hali iliyotokana na tendo lililokamilika inaelezwa kwa Kiswahili cha kawaida kama hali ya kuwa tayari na shibe; katika muktadha ni dai la kejeli.
- source_word: ἐπλουτήσατε
  choice: mmekuwa matajiri
  rationale: Inahifadhi wazo la kuingia katika hali ya utajiri badala ya kusema tu kwamba wao ni matajiri.
- source_word: χωρὶς ἡμῶν
  choice: bila sisi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kujitenga kwao na mitume katika dai la Paulo.
- source_word: ἐβασιλεύσατε
  choice: mmekuwa wafalme
  rationale: Inahifadhi taswira ya kifalme bila kuongeza maana ya kuanza kutawala, ambayo haijaelezwa wazi katika kitenzi chenyewe.
- source_word: ὄφελόν γε
  choice: Laiti kweli
  rationale: Muundo huu wa Kiswahili huonyesha tamanio lisilotimia, huku “kweli” ikihifadhi nguvu ya γε.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi au matokeo ya tamanio kwa lugha ya kawaida na fasaha.
- source_word: συμβασιλεύσωμεν
  choice: tutawale pamoja nanyi
  rationale: Inahifadhi wazi kiambishi cha ushirika συν- na taswira ya kutawala kwa pamoja.
theological_decisions:
- issue: Sauti ya madai matatu ya kwanza
  choice: Yameachwa kama madai mafupi yenye kejeli inayoeleweka kutokana na muktadha.
  alternative: Kuyafanya yasikike kama pongezi halisi au kuingiza neno “mnadhani” katika matini.
  rationale: Muktadha wa 1 Wakorintho 4:7–13 unaonyesha kejeli, lakini matini yenyewe haitumii alama ya wazi inayoruhusu kuongeza maelezo katika sentensi.
- issue: Maana ya lugha ya kifalme
  choice: Kutumia “wafalme” na “tutawale pamoja nanyi.”
  alternative: Kulegeza kuwa “mmefanikiwa,” “mna mamlaka,” au “mko juu.”
  rationale: βασιλεύω na συμβασιλεύω zina taswira dhahiri ya ufalme, ambayo ni muhimu kwa mvutano wa Paulo kati ya hali wanayodai Wakorintho na mateso ya mitume.
- issue: Tamanio katika ὄφελόν γε ἐβασιλεύσατε
  choice: “Laiti kweli mngekuwa wafalme” kama tamanio lisilotimia lenye mguso wa shauku ya kweli.
  alternative: “Natamani kweli mmekuwa wafalme” au kauli ya kejeli tupu.
  rationale: Muundo wa Kigiriki huonyesha tamanio kinyume na hali halisi; tafsiri haipaswi kuondoa mchanganyiko wa kejeli na hamu ya Paulo ya kutawala pamoja nao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na marudio ya “tayari” yanadumisha nguvu ya balagha; maelezo ya kejeli yamewekwa katika tanbihi badala ya kuongezwa ndani ya matini.
