id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: sw
  text: Nasi tunajitaabisha, tukifanya kazi kwa mikono yetu wenyewe. Tunapotukanwa[a], tunabariki; tunapoteswa, tunavumilia;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunapotusiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶμεν
  choice: tunajitaabisha
  rationale: Huonyesha kazi yenye bidii na uchovu, si kufanya kazi kwa kawaida tu.
- source_word: ἐργαζόμενοι
  choice: tukifanya kazi
  rationale: Kirai tegemezi kinaeleza jinsi mitume wanavyojitaabisha, bila kuongeza kwamba kusudi pekee ni kujipatia riziki.
- source_word: ταῖς ἰδίαις χερσίν
  choice: kwa mikono yetu wenyewe
  rationale: Huhifadhi mkazo wa ἰδίαις na kueleza wazi kazi ya mikono iliyofanywa na wao wenyewe.
- source_word: λοιδορούμενοι
  choice: tunapotukanwa
  rationale: Huwasilisha hali ya kutendwa ya kupokea matusi au dhihaka kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: εὐλογοῦμεν
  choice: tunabariki
  rationale: Huhifadhi istilahi muhimu ya kibiblia na tofauti iliyokusudiwa kati ya kutukanwa na kujibu kwa baraka.
- source_word: διωκόμενοι
  choice: tunapoteswa
  rationale: Katika muktadha huu neno linaonyesha mateso ya uhasama, si kufuatwa tu.
- source_word: ἀνεχόμεθα
  choice: tunavumilia
  rationale: Hueleza kustahimili kutendewa vibaya bila kuongeza yambwa ambalo halijaandikwa wazi katika Kigiriki.
theological_decisions:
- issue: Mwitikio wa kimaadili kwa kutendewa vibaya
  choice: 'Mstari unaeleza mwenendo wa mitume: wanabariki wanapotukanwa na kuvumilia wanapoteswa.'
  alternative: Kuufanya mstari kuwa amri rasmi kwa waamini wote.
  rationale: Kigiriki kinaeleza matendo ya mitume kwa kauli fupi zenye utofautishaji. Tafsiri inadumisha uzito wake wa kimaadili bila kugeuza maelezo hayo kimya-kimya kuwa amri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi unadumisha mfululizo wa kauli za Kigiriki na tofauti kati ya mateso yanayopokewa na mwitikio wa mitume.
