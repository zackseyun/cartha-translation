  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: sw
  text: 'Hivi ndivyo mtu anavyopaswa kutuhesabu: kuwa watumishi wa Masihi[a] na wasimamizi wa siri za Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: hivi
  rationale: Inaonyesha namna ambayo Paulo na wenzake wanapaswa kuonwa; “hivi” ni ya kawaida na huhifadhi maana ya kuonyesha namna.
- source_word: ἡμᾶς
  choice: atu- / sisi
  rationale: Inawahusu Paulo na watumishi wenzake. Kiwakilishi cha yambwa katika “atuchukulie” na “sisi” baada ya koloni huleta maana hiyo wazi kwa Kiswahili.
- source_word: λογιζέσθω
  choice: na atuchukulie
  rationale: Muundo wa “na” pamoja na kitenzi tegemezi unaonyesha agizo la nafsi ya tatu kwa Kiswahili cha kawaida, huku “kuchukulia” hapa ikimaanisha kuhesabu au kuwaona katika nafasi fulani.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Neno hili lina maana ya jumla hapa. “Mtu” ni tafsiri ya moja kwa moja, ya asili, na isiyoweka jinsia ambayo Kigiriki hakikusudii kusisitiza katika muktadha huu.
- source_word: ὡς
  choice: sisi ni
  rationale: Badala ya “kama” yenye uwezekano wa kusikika kuwa ni ulinganisho tu, kishazi hiki cha Kiswahili kinaeleza wazi nafasi ambayo wanapaswa kuhesabiwa kuwa nayo.
- source_word: ὑπηρέτας
  choice: watumishi
  rationale: Neno linaonyesha wahudumu walio chini ya mamlaka ya mwingine, bila maana mahsusi ya utumwa iliyomo katika δοῦλος.
- source_word: Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta. “Masihi” huhifadhi wazi kazi yake kama cheo katika kifungu hiki.
- source_word: οἰκονόμους
  choice: wasimamizi
  rationale: Neno linamaanisha watu waliokabidhiwa kusimamia mali au mambo ya mwenye nyumba. “Wasimamizi” ni la sasa na linaeleweka kwa wasomaji wengi kuliko “mawakili” katika maana hii.
- source_word: μυστηρίων
  choice: siri
  rationale: Katika matumizi ya Paulo, ni mambo ya Mungu yaliyokuwa yamefichika na kufunuliwa kwa mpango wake. “Siri” huhifadhi neno hilo bila kuongeza maelezo yasiyosemwa wazi katika mstari.
- source_word: θεοῦ
  choice: za Mungu
  rationale: Muundo wa umilikaji unaonyesha kwamba siri hizo ni za Mungu na zinatoka kwake.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno linaweza kusikika kama cheo cha yule ambaye watumishi hao wanamtumikia. “Masihi” huhifadhi maana ya cheo; “Kristo” limetolewa kama mbadala wa istilahi iliyozoeleka.
- issue: Maana ya μυστηρίων
  choice: siri za Mungu
  alternative: mafumbo ya Mungu
  rationale: “Siri” inaendana na matumizi ya Paulo kuhusu kweli au makusudi ya Mungu yaliyofichika na kufunuliwa, bila kudokeza fumbo linaloshindikana kueleweka.
- issue: Nguvu ya jumla ya ἄνθρωπος
  choice: mtu
  alternative: kila mtu
  rationale: Umoja wa Kigiriki una nguvu ya jumla. Kiswahili “mtu” huhifadhi umoja huo na hueleweka kiasili kuwa mtu yeyote, bila kuingiza jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa moja kwa moja; “wasimamizi” umetumiwa badala ya “mawakili” ili wazo la kukabidhiwa wajibu lieleweke kwa urahisi bila kupoteza sitiari ya Kigiriki.
