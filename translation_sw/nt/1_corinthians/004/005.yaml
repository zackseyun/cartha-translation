  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: sw
  text: Kwa hiyo, msihukumu jambo lolote kabla ya wakati[a], mpaka Bwana atakapokuja, ambaye pia atayaleta nuruni mambo yaliyofichwa gizani na kufunua makusudi ya mioyo[b][c]. Ndipo kila mmoja atakapopata sifa kutoka kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla ya wakati unaofaa” au “mapema mno.” Kirai cha Kigiriki kinaweza kumaanisha kutenda kabla ya wakati unaofaa, bila kusema wazi kwamba wakati huo uliwekwa rasmi.
    reason: lexical_alternative
  - marker: b
    text: Au, “nia za mioyo” au “dhamira za mioyo.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, katika tathmini ya mwisho ya Bwana atakapokuja na kufunua yaliyofichwa.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: msihukumu jambo lolote kabla ya wakati
  rationale: Inadumisha upana wa τι (‘jambo lolote’) na maana ya πρὸ καιροῦ bila kuongeza wazi kwamba wakati huo ‘umewekwa,’ jambo ambalo Kigiriki hakilisemi moja kwa moja.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: mpaka Bwana atakapokuja
  rationale: Inabainisha mpaka wa muda wa katazo na kuhifadhi ‘Bwana’ kama cheo cha Yesu katika muktadha huu wa kuja kwake.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: atayaleta nuruni mambo yaliyofichwa gizani
  rationale: ‘Kuleta nuruni’ ni nahau ya Kiswahili inayoeleza ufunuo, huku ‘mambo yaliyofichwa gizani’ yakihifadhi taswira ya Kigiriki.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: kufunua makusudi ya mioyo
  rationale: ‘Makusudi’ ni neno pana linaloweza kujumuisha nia, mipango, au dhamira bila kupunguza βουλαί kuwa hisia au sababu za kisaikolojia pekee.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: kila mmoja atakapopata sifa kutoka kwa Mungu
  rationale: Ni Kiswahili cha asili kinachohifadhi kwamba sifa ya kila mmoja itatoka kwa Mungu, bila kudai kwamba kila tendo au kila mtu atasifiwa kwa kiwango kilekile.
theological_decisions:
- issue: Upeo na wakati wa hukumu
  choice: Katazo linahusu kuhukumu kabla ya wakati wa kuja kwa Bwana na kufunuliwa kwa yaliyofichwa.
  alternative: Kulifanya katazo hili kuwa marufuku kamili ya kila aina ya kupambanua au kutoa hukumu katika kila hali.
  rationale: Kirai ‘kabla ya wakati, mpaka Bwana atakapokuja’ kinaweka katazo katika upeo wa tathmini ya mapema kabla ya ufunuo wa mwisho; tafsiri haiongezi mipaka isiyotajwa wala kufuta upana wa maneno ya Paulo.
- issue: Utambulisho wa ‘Bwana’
  choice: Cheo ‘Bwana’ kimehifadhiwa bila kukipanua; katika muktadha huu kwa kawaida humrejelea Yesu ajaye.
  alternative: Kutafsiri moja kwa moja ‘Yesu’ au kulifanya rejeo hili kuwa la jumla kwa Mungu bila kubakiza cheo cha maandishi.
  rationale: ὁ κύριος ni cheo chenye uzito katika matumizi ya Paulo. Kukihifadhi kunafuata maandishi na kuepuka kuongeza jina ambalo halipo wazi katika mstari.
- issue: Maana ya sifa itokayo kwa Mungu
  choice: Kila mmoja atapata sifa kutoka kwa Mungu baada ya ufunuo wa Bwana.
  alternative: Kusema kwamba kila mtu bila ubaguzi ataidhinishwa kabisa au kwamba kifungu kinazungumzia hukumu ya adhabu pekee.
  rationale: Maandishi yanasema ‘sifa’ na yanaigawa kwa ‘kila mmoja,’ lakini hayaelezi kiwango au namna yake; tafsiri inaacha mvutano huo ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. ‘Msihukumu’ inafuata wingi wa amri ya Kigiriki; ‘mioyo’ inadumisha taswira ya ndani ya mtu na wingi wa chanzo.
