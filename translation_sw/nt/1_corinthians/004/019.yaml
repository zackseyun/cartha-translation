  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: sw
  text: Lakini nitakuja kwenu hivi karibuni, Bwana akipenda, nami nitajua, si maneno ya hao waliojaa majivuno[a], bali nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno linalotafsiriwa “waliojaa majivuno” lina maana halisi ya watu “waliovimba” kwa kiburi; Paulo analitumia mara kadhaa katika barua hii.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Lakini nitakuja kwenu hivi karibuni
  rationale: Kauli ya wakati ujao na mwelekeo wa mwendo vinatafsiriwa kwa Kiswahili cha kawaida; δέ inaonyesha utofautishaji wa kiasi na ταχέως hapa inaelekea kuonyesha wakati wa karibu.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: Bwana akipenda
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza sharti linalotegemea mapenzi ya Bwana, bila kubainisha zaidi anayerejelewa kuliko Kigiriki kinavyofanya.
- source_word: γνώσομαι
  choice: nitajua
  rationale: Utoaji rasmi wa kitenzi unahifadhi maana pana ya kujua au kuthibitisha kwa kujionea, bila kuongeza maelezo ya kiuchunguzi yasiyotajwa wazi.
- source_word: οὐ τὸν λόγον τῶν πεφυσιωμένων
  choice: si maneno ya hao waliojaa majivuno
  rationale: λόγος katika muktadha huu ni usemi au maneno, huku πεφυσιωμένων ikidokeza hali endelevu ya kujivuna. Kiswahili hiki ni cha kawaida na kinawasilisha maana ya sitiari bila usemi usio wa asili.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: bali nguvu yao
  rationale: ἀλλά huleta utofautishaji mkali. Kiwakilishi 'yao' kinafanya uhusiano unaodokezwa na muundo sambamba ueleweke katika Kiswahili, huku 'nguvu' ikibaki pana.
theological_decisions:
- issue: Anayerejelewa kwa ὁ κύριος
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Kigiriki kinasema tu 'Bwana.' Tafsiri haibainishi ikiwa Paulo anamrejelea Yesu waziwazi au Mungu, hivyo inadumisha uwazi wa matini.
- issue: Maana ya utofautishaji kati ya λόγος na δύναμις
  choice: maneno dhidi ya nguvu
  alternative: mafundisho dhidi ya miujiza; ufasaha dhidi ya mamlaka ya kitume
  rationale: Tafsiri inadumisha utofautishaji mpana wa matini bila kuamua nguvu hiyo inadhihirika kwa namna gani hasa.
- issue: Mhusika wa 'nguvu'
  choice: nguvu yao
  alternative: nguvu
  rationale: Kigiriki kinaacha nomino ikiwa fupi, lakini muundo wa 'maneno ya hao ... bali nguvu' unaweza kuonyesha nguvu inayodaiwa au kuonekana kwao. Kiwakilishi kinawekwa kwa ufasaha wa Kiswahili, huku tanbihi ikihifadhi muundo wa karibu zaidi na asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Hivi karibuni' ni cha kawaida kwa wakati wa karibu; 'Bwana akipenda' ni msemo wa asili na sahihi. 'Waliojaa majivuno' huepuka sitiari isiyo ya kawaida ya 'kuvimba' katika matini kuu, huku tanbihi ikiihifadhi.
