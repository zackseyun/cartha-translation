  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: sw
  text: Mpaka saa hii[a] tuna njaa na kiu, hatuna mavazi ya kutosha,[b] tunapigwa, na hatuna makao ya kudumu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hadi saa hii hii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tuko uchi”; neno la Kigiriki linaweza kumaanisha kutokuwa na mavazi ya kutosha badala ya kuwa uchi kabisa.
    reason: lexical_alternative
  - marker: c
    text: Au, “tunatangatanga” au “hatuna mahali pa kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Mpaka saa hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hali hiyo imeendelea hadi wakati wa sasa, huku ukihifadhi neno halisi ‘saa’ la Kigiriki.
- source_word: πεινῶμεν
  choice: tuna njaa
  rationale: Huonyesha hali inayoendelea kwa lugha ya kawaida na ya sasa.
- source_word: διψῶμεν
  choice: na kiu
  rationale: Inaunganishwa kwa kawaida na ‘tuna njaa’; kitenzi ‘tuna’ kinaeleweka bila kurudiwa.
- source_word: γυμνιτεύομεν
  choice: hatuna mavazi ya kutosha
  rationale: Kitenzi kinaweza kumaanisha kuwa bila mavazi ya kutosha, si lazima kuwa uchi kabisa; tafsiri hii haizidishi maana.
- source_word: κολαφιζόμεθα
  choice: tunapigwa
  rationale: Kauli ya kutendwa ya wakati wa sasa inaonyesha kupigwa au kutendewa kwa nguvu mara kwa mara; ‘tunapigwa’ ni wazi na ya kawaida.
- source_word: ἀστατοῦμεν
  choice: hatuna makao ya kudumu
  rationale: Huhifadhi wazo la kutokuwa na mahali pa kudumu bila kulazimisha maana kuwa ukosefu kamili wa nyumba pekee.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: na ... na ... na ...
  rationale: Viunganishi vinaendeleza mlolongo wa mateso, lakini vimepangwa kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Asili ya maelezo ya Paulo kuhusu hali ya mitume
  choice: Orodha ya hali halisi na zinazoendelea za kunyimwa mahitaji na kutendewa vibaya
  alternative: Maelezo hasa ya balagha au yenye kutia chumvi
  rationale: Vitenzi vya wakati wa sasa vinaeleza mateso mahususi kwa namna ya moja kwa moja; tafsiri haipunguzi wala kuongeza uzito wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Muundo unabaki wa moja kwa moja na huhifadhi mlolongo wa mateso bila kuingiza istilahi za kimadhehebu.
