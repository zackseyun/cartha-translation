  source_fidelity: 'Msingi wa tafsiri unafuata Kigiriki vizuri: γάρ ni ya ufafanuzi, σύνοιδα ina maana ya ufahamu wa jambo linalomhusu Paulo, δεδικαίωμαι huhifadhiwa katika lugha ya kimahakama, na ἀνακρίνων ni ‘anayenichunguza.’ Hata hivyo, ‘sijitambui kuwa nina kosa lolote’ si usemi wa kawaida wa Kiswahili kwa σύνοιδα na unaweza kumaanisha kutokujitambua binafsi. ‘Sijahesabiwa haki’ huhifadhi vyema hali ya timilifu-tendwa ya δεδικαίωμαι kuliko ‘sihesabiwi kuwa mwadilifu.’'
  naturalness: 'Marekebisho yanatumia Kiswahili sanifu na cha sasa: ‘Sina ufahamu wa jambo lolote linalonishtaki’ huwasilisha idiomu ya dhamiri/mashtaka bila kudai kwamba Paulo hana dhambi. ‘Kwa sababu hiyo sijahesabiwa haki’ ni muundo wa kawaida na wenye uzito ufaao wa kimahakama.'
  terminology: ‘Kuhesabiwa haki’ ni istilahi iliyozoeleka kwa δικαιόω na inastahili kubaki katika matini kuu; tanbihi hutoa ‘kuachiliwa kuwa hana hatia’ na ‘kuthibitishwa kuwa ana haki’ kama uwezekano wa kimuktadha. ‘Bwana’ haiongezewi utambulisho usiotajwa. Kialama, tanbihi c imehamishwa ili iambatane na ‘Anayenichunguza,’ neno linalofafanuliwa nayo.
