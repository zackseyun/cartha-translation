base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: sw
  text: Kwa maana sina ufahamu wa jambo lolote linalonishtaki[a]; lakini kwa sababu hiyo sijahesabiwa haki[b]. Anayenichunguza[c] ni Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sijui jambo lolote dhidi yangu,” au “dhamiri yangu hainishtaki kwa jambo lolote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sijaachiliwa kuwa sina hatia kwa sababu hiyo,” au “sijathibitishwa kuwa nina haki kwa sababu hiyo.” Kigiriki kinatumia neno la kimahakama ambalo Paulo pia hulitumia kuhusu kuhesabiwa haki.
    reason: lexical_alternative
  - marker: c
    text: Au, “Anayenihukumu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuchunguza, kuhoji, au kutathmini katika mazingira ya kimahakama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν ... ἐμαυτῷ σύνοιδα
  choice: sijitambui kuwa nina kosa lolote
  rationale: Muundo huu unaonyesha kwamba Paulo hajui jambo linalomshtaki katika dhamiri yake. Kiswahili hiki ni cha kawaida na kinahifadhi mwelekeo wa kimaadili na kimahakama wa muktadha bila kudai kwamba hana dhambi kabisa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inafafanua hoja iliyotangulia.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: lakini ... si ... kwa sababu hiyo
  rationale: Inaonyesha kwamba kutokuwa na jambo linalomshtaki katika dhamiri yake si msingi wa uamuzi unaomhusu.
- source_word: δεδικαίωμαι
  choice: sihesabiwi kuwa mwadilifu
  rationale: Ni kitenzi timilifu tendwa chenye maana ya kimahakama. Tafsiri hii inadumisha uhusiano wake na lugha ya kuhesabiwa kuwa mwenye haki, huku muktadha ukihusu uamuzi juu ya Paulo.
- source_word: ὁ ... ἀνακρίνων με
  choice: Anayenichunguza
  rationale: ἀνακρίνω inaweza kumaanisha kuchunguza, kuhoji, au kutathmini katika mazingira ya kimahakama. ‘Kuchunguza’ haikazii kupita kiasi wazo la hukumu ya mwisho.
- source_word: κύριός
  choice: Bwana
  rationale: Inatafsiri κύριος moja kwa moja bila kuongeza utambulisho ambao haukutajwa wazi katika mstari huu.
theological_decisions:
- issue: Maana ya kimahakama ya δεδικαίωμαι katika uhusiano na Paulo kujitathmini
  choice: sihesabiwi kuwa mwadilifu kwa sababu hiyo
  alternative: sijaachiliwa kuwa sina hatia kwa sababu hiyo; sithibitishwi kuwa nina haki kwa sababu hiyo
  rationale: Kauli inadumisha uzito wa kimahakama wa kitenzi na msamiati wa Paulo kuhusu kuhesabiwa kuwa mwadilifu, lakini haigeuzi mstari huu kuwa tamko pana la kimfumo kuhusu fundisho la kuhesabiwa haki.
- issue: Utambulisho wa κύριος
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Ingawa muktadha wa Paulo unaweza kumwelekeza msomaji kwa Kristo, maandishi ya Kigiriki yanasema tu κύριος; kwa hiyo utambulisho haupanuliwi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, lakini unahifadhi mvutano kati ya dhamiri safi ya Paulo na uamuzi wa Bwana. Alama zote za tanbihi zimewekwa katika matini kuu.
