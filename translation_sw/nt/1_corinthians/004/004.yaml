  - severity: medium
    issue: ‘sihesabiwi kuwa mwadilifu’ hudhoofisha umbo la timilifu-tendwa la δεδικαίωμαι.
    rationale: ‘Sijahesabiwa haki’ huonyesha kwa wazi zaidi kwamba kukosekana kwa shtaka la dhamiri si msingi wa Paulo kuwa amehesabiwa/amehukumiwa kuwa mwenye haki.
