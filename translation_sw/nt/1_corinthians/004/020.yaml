translation:
  language: sw
  text: Kwa maana ufalme wa Mungu hauko katika maneno[a], bali katika nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika usemi” au “katika maneno matupu”; utofautishaji ni kati ya maneno pekee na nguvu yenye matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana ... hauwi
  rationale: γάρ inaunganisha mstari huu na yaliyotangulia kwa kutoa sababu; “kwa maana” ni kiunganishi cha kawaida na chenye hadhi. οὐ inakanusha dai hilo.
- source_word: ἐν λόγῳ
  choice: katika maneno
  rationale: λόγος hapa inaweza kumaanisha neno, usemi, au maneno. Wingi “maneno” ni wa kawaida zaidi katika Kiswahili kwa utofautishaji wa maneno matupu na nguvu yenye matokeo, bila kulazimisha maana hiyo ndani ya matini kuu.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi, nayo inadumisha uwezekano wa βασιλεία kuhusisha utawala na milki bila kuamua upande mmoja pekee.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: bali katika nguvu
  rationale: “Nguvu” ni tafsiri pana na ya moja kwa moja ya δύναμις, na inadumisha utofautishaji mkali na λόγος bila kubainisha kama nguvu hiyo ni miujiza, mamlaka, mabadiliko ya maisha, au kazi ya Roho.
theological_decisions:
- issue: Asili ya utofautishaji kati ya “maneno” na “nguvu”
  choice: Matini inatofautisha maneno au usemi na nguvu yenye matokeo kama sifa ya ufalme wa Mungu, bila kufafanua nguvu hiyo kwa namna finyu.
  alternative: Kuitafsiri nguvu hiyo mahsusi kuwa miujiza, maisha yaliyobadilishwa na nidhamu ya kanisa, mamlaka ya kitume, au kazi ya Roho kwa maana finyu.
  rationale: Kigiriki kinasema tu ἐν δυνάμει. Tafsiri inapaswa kudumisha upana huo wa kiteolojia badala ya kuingiza ufafanuzi usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hauwi katika ... bali katika ...” unadumisha ulinganifu wa Kigiriki huku ukieleweka kwa msomaji wa kawaida.
