  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: sw
  text: Kwa sababu hiyo nilimtuma Timotheo kwenu. Yeye ni mtoto wangu mpendwa na mwaminifu katika Bwana.[a] Atawakumbusha njia zangu katika Masihi Yesu,[b] kama ninavyofundisha kila mahali katika kila kanisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanangu mpendwa na mwaminifu katika Bwana.” Neno la Kigiriki τέκνον kwa maana ya msingi ni “mtoto,” lakini katika muktadha huu linaweza kutafsiriwa “mwana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Kristo Yesu.” Hapa cheo cha Kigiriki Χριστός kimetafsiriwa “Masihi” ili kuhifadhi maana yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kiunganishi cha sababu kinachorejelea hoja iliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἔπεμψα
  choice: nilimtuma
  rationale: Wakati uliopita sahili unaakisi aoristi katika rejeo hili la barua.
- source_word: Τιμόθεον
  choice: Timotheo
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: τέκνον
  choice: mtoto
  rationale: Neno hili humaanisha mtoto bila kubainisha jinsia; linahifadhi sitiari ya kifamilia ya Paulo, ingawa Timotheo ni mwanamume.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: mpendwa na mwaminifu
  rationale: Huhifadhi upendo wa Paulo na uaminifu wa Timotheo katika huduma.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi msemo wa Paulo unaoonyesha uhusiano na nyanja ya maisha chini ya Bwana.
- source_word: ἀναμνήσει
  choice: atawakumbusha
  rationale: Kitenzi cha wakati ujao kinaonyesha kazi ambayo Timotheo atafanya kwa wasomaji.
- source_word: τὰς ὁδούς μου
  choice: njia zangu
  rationale: Huhifadhi sitiari pana inayohusu mwenendo, utendaji, na mafundisho ya Paulo, si njia za kusafiria tu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός inatafsiriwa kama cheo 'Masihi'; kirai kinafafanua njia za Paulo kwa uhusiano wake na Masihi Yesu.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: kama ninavyofundisha kila mahali katika kila kanisa
  rationale: Huhifadhi ulinganisho na upeo wa jumla wa desturi ya Paulo ya kufundisha.
theological_decisions:
- issue: Tafsiri ya Χριστός katika ἐν Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Hapa Χριστός bado lina nguvu ya cheo; 'Masihi' huwasilisha maana yake badala ya kulinakili tu.
- issue: Maana ya 'njia zangu'
  choice: Kuhifadhi sitiari inayojumuisha mwenendo na mafundisho ya Paulo katika Masihi
  alternative: mwenendo wangu / namna yangu ya kuishi
  rationale: ὁδοί ni ya kisitiari katika muktadha. 'Njia zangu' huhifadhi upana na mvutano wa usemi wa asili bila kuufanya uwe mwenendo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya Kigiriki imegawanywa baada ya 'kwenu' ili isomeke kwa urahisi bila kubadili uhusiano wa mawazo. Alama zote za tanbihi zimewekwa katika matini kuu.
