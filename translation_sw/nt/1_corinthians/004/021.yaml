id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: sw
  text: Mnataka nini? Je, nije kwenu na fimbo, au kwa upendo na roho ya upole?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa upendo na upole wa roho.” Neno “roho” hapa huenda likamaanisha hali ya upole ya Paulo; wengine hulielewa kuwa rejeo lisilo la moja kwa moja kwa kazi ya Roho Mtakatifu.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Mnataka nini?
  rationale: Swali hili la moja kwa moja linahifadhi nguvu ya changamoto ya Paulo na ni la kawaida katika Kiswahili cha sasa.
- source_word: ἐν ῥάβδῳ
  choice: na fimbo
  rationale: “Fimbo” inahifadhi picha halisi ya ῥάβδος na dokezo lake la kuadibu bila kuibadili moja kwa moja kuwa neno “nidhamu.”
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Je, nije kwenu
  rationale: Muundo huu unaonyesha swali la uamuzi lililo katika hali tegemezi ya Kigiriki na unasikika kwa kawaida katika Kiswahili.
- source_word: ἢ
  choice: au
  rationale: Inaonyesha kwa uwazi uchaguzi kati ya namna mbili za Paulo kuja.
- source_word: ἐν ἀγάπῃ
  choice: kwa upendo
  rationale: “Kwa” inaonyesha namna ya kuja na kudumisha ulinganifu wa kimaana na “na fimbo,” huku “upendo” likiwa neno la kawaida kwa ἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: na roho ya upole
  rationale: Tafsiri hii inahifadhi neno πνεῦμα na muundo wa sifa ya πραΰτης, huku ikieleweka kwa urahisi kama hali au mwenendo wa upole.
theological_decisions:
- issue: Maana ya πνεύματι katika πνεύματί τε πραΰτητος
  choice: “roho ya upole,” ikimaanisha hasa hali au mwenendo wa Paulo
  alternative: “Roho wa upole,” ikieleweka kuwa rejeo lisilo la moja kwa moja kwa kazi ya Roho Mtakatifu
  rationale: 'Muktadha unatofautisha namna mbili ambazo Paulo angeweza kuja: kwa ukali wa kuadibu au kwa upendo na upole. Kutotumia herufi kubwa katika “roho” hakulazimishi rejeo kwa Roho Mtakatifu, lakini tanbihi inadumisha uwezekano huo wa kifasiri.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. “Fimbo” inadumisha ukali wa sitiari ya awali; “roho ya upole” inadumisha utata halisi wa kifungu cha Kigiriki.
