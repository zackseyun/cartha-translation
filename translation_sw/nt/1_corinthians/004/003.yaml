  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: sw
  text: Lakini kwangu ni jambo dogo sana kwamba nichunguzwe na ninyi au kwa hukumu ya wanadamu[a]; wala hata mimi mwenyewe sijichunguzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kihalisi, “siku ya kibinadamu,” nahau inayomaanisha hukumu au tathmini ya wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: kwangu
  rationale: Hii ni dative ya kurejelea mtazamo wa Paulo; “kwangu” ni Kiswahili cha kawaida na hudumisha msisitizo wake binafsi.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: ni jambo dogo sana
  rationale: Usemi huu huonyesha kwamba jambo hilo lina umuhimu mdogo mno; tafsiri hii ni ya asili na inahifadhi nguvu ya ἐλάχιστον.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa ἵνα inatambulisha maudhui ya kile Paulo anachokiona kuwa cha umuhimu mdogo.
- source_word: ἀνακριθῶ
  choice: nichunguzwe
  rationale: ἀνακρίνω humaanisha kuchunguza au kutathmini kwa makini, si lazima kutoa hukumu ya mwisho; “nichunguzwe” pia hudumisha uhusiano wa kileksia na kitenzi cha mwisho.
- source_word: ὑφ’ ὑμῶν
  choice: na ninyi
  rationale: Huwasilisha moja kwa moja mtendaji wa kitendo kwa ὑπό pamoja na jenitivi.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: au na mahakama yoyote ya kibinadamu
  rationale: Usemi halisi “siku ya kibinadamu” ni nahau inayorejelea uchunguzi au tathmini ya wanadamu, kwa kulinganisha na siku ya Bwana katika muktadha. “Mahakama yoyote ya kibinadamu” huwasilisha maana hiyo kwa uwazi.
- source_word: ἀλλ’ οὐδὲ
  choice: naam, hata ... si-
  rationale: “Naam” huonyesha hatua yenye msisitizo katika hoja, na “hata ... si-” huhifadhi nguvu ya οὐδέ bila kufanya sentensi iwe ngumu.
- source_word: ἐμαυτὸν
  choice: mimi mwenyewe
  rationale: Huwakilisha kiwakilishi rejeshi chenye msisitizo katika Kiswahili cha asili.
- source_word: ἀνακρίνω
  choice: sijichunguzi
  rationale: Hudumisha mshikamano wa kileksia na “nichunguzwe” na huepuka kuifanya kauli iwe hukumu ya mwisho.
theological_decisions:
- issue: Maana ya ἀνθρωπίνης ἡμέρας
  choice: mahakama yoyote ya kibinadamu
  alternative: siku ya kibinadamu; hukumu ya wanadamu
  rationale: Kirai hiki ni nahau ya tathmini au uchunguzi wa wanadamu, si taarifa kuhusu wakati wa kalenda. Tafsiri ya kinahau huweka wazi utofauti wa kimuktadha kati ya uchunguzi wa wanadamu na siku ya Bwana bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nichunguzwe/sijichunguzi” hudumisha urudiaji wa kitenzi cha Kigiriki; “mahakama ... ya kibinadamu” hutafsiri nahau kwa uwazi. Alama [a] imewekwa baada ya “naam” ili kuunganisha tanbihi na kirai cha Kigiriki kilichofafanuliwa, kwa kufuata mpangilio wa safu ya mashauriano.
