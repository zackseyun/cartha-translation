id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: sw
  text: Kwa maana, hata kama mna walezi[b] elfu kumi[a] katika Masihi, lakini hamna baba wengi. Kwa maana katika Masihi Yesu, kwa njia ya habari njema, mimi niliwazaa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha kihalisi ‘elfu kumi,’ lakini mara nyingi hutumiwa kumaanisha idadi kubwa sana.
    reason: lexical_alternative
  - marker: b
    text: Katika ulimwengu wa Kigiriki na Kirumi, hawa walikuwa walezi au wasimamizi wa watoto, si hasa walimu wa darasani.
    reason: cultural_note
  - marker: c
    text: Yaani, Paulo anatumia lugha ya kuzaa kwa njia ya sitiari kuhusu nafasi yake katika kuwafikisha kwenye imani kupitia habari njema.
    reason: metaphor_note
lexical_decisions:
- source_word: μυρίους
  choice: elfu kumi
  rationale: Hii ndiyo maana ya msingi ya neno la Kigiriki, huku tanbihi ikihifadhi matumizi yake ya kimsemo ya kuonyesha idadi kubwa sana.
- source_word: παιδαγωγοὺς
  choice: walezi
  rationale: Katika mazingira ya Kigiriki na Kirumi, neno hili lilimaanisha wasimamizi wa watoto waliowalinda na kuwaongoza, si hasa walimu wa darasani.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi / katika Masihi Yesu
  rationale: Masihi huhifadhi maana ya Χριστός kama cheo, na 'katika' huhifadhi usemi wa Paulo bila kuufafanua kupita kiasi.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: kwa njia ya habari njema
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo; habari njema ndiyo njia ambayo Paulo anasema aliwazaa.
- source_word: ἐγέννησα
  choice: niliwazaa
  rationale: Tafsiri hii huhifadhi kwa uwazi sitiari ya kuzaa iliyomo katika Kigiriki badala ya kuibadili kuwa maelezo ya kiufafanuzi.
theological_decisions:
- issue: Sitiari ya Paulo ya kuwa mzazi wa Wakorintho
  choice: mimi niliwazaa
  alternative: mimi nikawa baba yenu
  rationale: Tafsiri ya moja kwa moja huhifadhi nguvu na mvutano wa sitiari ya Kigiriki, huku tanbihi ikieleza kwamba inahusu nafasi ya Paulo katika kuwafikisha kwenye imani kupitia habari njema, bila kuingiza maana maalumu ya kimadhehebu.
- issue: Maana ya usemi ἐν Χριστῷ
  choice: katika Masihi
  alternative: kwa kuunganishwa na Masihi
  rationale: Usemi wa Paulo umeachwa katika hali yake fupi na yenye uwezekano mpana wa maana badala ya kufafanuliwa kama aina moja tu ya uhusiano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki karibu na hoja ya Kigiriki, lakini ni wa kawaida kwa msomaji wa leo. ‘Habari njema’ imetumiwa badala ya neno la kitaalamu zaidi ‘injili,’ na ‘Masihi’ huhifadhi Χριστός kama cheo.
