  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: sw
  text: 'Ndugu[a], mambo haya nimeyatumia kuhusu mimi mwenyewe na Apolo kwa ajili yenu, ili kupitia kwetu mjifunze jambo hili: “Msiyapite yaliyoandikwa,”[b] kusudi mtu yeyote kati yenu asijivune kwa kumpendelea mmoja dhidi ya mwingine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “ndugu” linaweza kutumiwa kuzungumzia kundi lenye wanaume na wanawake.
    reason: cultural_note
  - marker: b
    text: Kigiriki kimebanwa; kwa neno kwa neno ni kama, “si zaidi ya yaliyoandikwa.” Huenda huu ulikuwa msemo au kaulimbiu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Inahifadhi wingi wa kiwakilishi na kurejelea mjadala uliotangulia.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: Ni neno la kawaida na lenye heshima kwa waamini; katika wingi linaweza kujumuisha wanaume na wanawake, jambo linalofafanuliwa katika tanbihi.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: nimeyatumia kuhusu mimi mwenyewe na Apolo
  rationale: Inaeleza kwamba Paulo amehamishia au ametumia kwao wawili mfano wa mjadala uliotangulia bila kuongeza maelezo yasiyo katika matini.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Inaonyesha manufaa na kusudi la kichungaji la tendo hilo.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: ili kupitia kwetu mjifunze
  rationale: Inahifadhi wazo lililobanwa kwamba Paulo na Apolo ndio njia au mfano ambao kupitia kwao somo linajifunzwa.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'kanuni hii: “Msiyapite yaliyoandikwa”'
  rationale: Kiswahili hiki ni cha kawaida na kinatoa nguvu ya onyo inayodokezwa na usemi wa Kigiriki, huku tanbihi ikihifadhi ubano na uwezekano wa kuwa msemo.
- source_word: φυσιοῦσθε
  choice: asijazwe na majivuno
  rationale: Inaonyesha hali ya kufura kwa kiburi kwa lugha ya Kiswahili inayoeleweka, bila kuibadili kuwa kujisifu tu.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: kwa kumpendelea mmoja dhidi ya mwingine
  rationale: Inaweka wazi upendeleo wa kimakundi unaolengwa na Paulo na kuhifadhi ulinganisho wa mmoja dhidi ya mwingine.
theological_decisions:
- issue: Maana ya usemi uliobanwa τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Umetafsiriwa kama onyo: “Msiyapite yaliyoandikwa.”'
  alternative: “Si zaidi ya yaliyoandikwa,” labda kama msemo au kaulimbiu.
  rationale: Muundo wa Kigiriki hauna kitenzi kilichotajwa wazi na unaweza kuwa msemo, lakini katika sentensi hii unafanya kazi kama somo la kuzuia kuvuka yale yaliyoandikwa. Tanbihi inaweka wazi utata huo bila kuufanya kuwa fundisho mahususi la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inabaki karibu na mpangilio na mvutano wa matini ya Kigiriki, lakini imetumia miundo inayoeleweka kwa msomaji wa kawaida.
