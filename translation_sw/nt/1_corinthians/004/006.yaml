  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa ujumla maana ya Kigiriki: Ταῦτα ni wingi, tendo la Paulo kwa ajili ya wasomaji limehifadhiwa, na usemi uliobanwa kuhusu yaliyoandikwa umetolewa kama onyo lenye tanbihi. Hata hivyo, “kanuni hii” huongeza dhana ya kanuni ambayo haijasemwa wazi katika τό, na “asijazwe na majivuno” hubadilisha taswira na uhusiano wa kisarufi wa φυσιοῦσθε. “Asijivune” hutafsiri kwa usahihi zaidi tendo la kujikweza katika muktadha wa upendeleo wa makundi.'
  naturalness: 'Kiswahili ni sanifu na kinaeleweka. Marekebisho madogo yanayopendekezwa hufanya sentensi iwe ya asili zaidi: “jambo hili” badala ya “kanuni hii,” na “asijivune” badala ya kauli ya kupokea “asijazwe na majivuno.”'
