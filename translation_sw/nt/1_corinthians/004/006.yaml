  to: 'Ndugu[a], mambo haya nimeyatumia kuhusu mimi mwenyewe na Apolo kwa ajili yenu, ili kupitia kwetu mjifunze jambo hili: “Msiyapite yaliyoandikwa,”[b] kusudi mtu yeyote kati yenu asijivune kwa kumpendelea mmoja dhidi ya mwingine.'
