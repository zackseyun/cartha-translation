  - severity: medium
    issue: “asijazwe na majivuno” kwa φυσιοῦσθε
    rationale: Kitenzi kinamaanisha kujivuna/kufura kwa kiburi na katika sentensi kinawahusu wasomaji katika muktadha wa mtu mmoja kumpendelea mmoja dhidi ya mwingine. Kauli “asijivune” ni ya karibu zaidi na pia ni ya kawaida kwa Kiswahili.
