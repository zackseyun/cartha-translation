lexical_decisions:
- source_word: παρακαλῶ
  choice: nawasihi
  rationale: Kitenzi hiki hapa kina nguvu ya ombi la dhati lenye kusudi la kuhimiza; “nawasihi” ni Kiswahili cha kawaida, chenye heshima, na hudumisha uzito huo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” huweka wazi uhusiano huo wa kimantiki.
- source_word: ὑμᾶς
  choice: -wa- katika “nawasihi”
  rationale: Kiwakilishi cha nafsi ya pili wingi kimewakilishwa kwa kiambishi cha yambwa -wa-, kulingana na sarufi ya kawaida ya Kiswahili.
- source_word: μιμηταί
  choice: waigaji
  rationale: Neno hili humaanisha watu wanaoiga kielelezo cha mwingine. “Waigaji” ni sawia ya moja kwa moja kuliko “wafuasi,” ambalo lina maana pana zaidi.
- source_word: μου
  choice: wangu
  rationale: Kiwakilishi cha umilikaji kinahusishwa moja kwa moja na “waigaji,” na “waigaji wangu” ni muundo wa asili katika Kiswahili.
- source_word: γίνεσθε
  choice: iweni
  rationale: Ingawa kitenzi cha Kigiriki kinaweza kusisitiza kuingia katika hali fulani (“kuweni/kuwa”), amri “iweni” ni ya asili na huhifadhi mwito wa kuwa waigaji bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Himizo la Paulo la kumwiga linaweza kuonekana kuwa kubwa mno likitengwa na muktadha mpana unaomwelekea Kristo, lakini aya yenyewe inamtaja Paulo waziwazi kuwa kielelezo.
  choice: “iweni waigaji wangu”
  alternative: “fuateni mfano wangu”
  rationale: Tafsiri ya moja kwa moja hudumisha dai la wazi la Kigiriki na mvutano wake wa kiteolojia bila kulilegeza. Muktadha wa kumwiga Kristo umewekwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa moja kwa moja. Alama zote za tanbihi zimewekwa katika matini kuu.
