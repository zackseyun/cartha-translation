  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: sw
  text: Wengine wamejivuna[a][b], kana kwamba sitakuja kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wengine wamejaa kiburi, kana kwamba sitakuja kwenu.”
    reason: lexical_alternative
  - marker: b
    text: Paulo anarudia mara kadhaa katika 1 Wakorintho picha ya mtu aliyejivuna au aliyejaa kiburi; linganisha 1 Kor 4:6, 4:19; 5:2; 8:1; 13:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: kana kwamba
  rationale: Hutanguliza dhana isiyo sahihi iliyochochea mtazamo wao, huku ikihifadhi maana ya kulinganisha au kudhania.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: sitakuja kwenu
  rationale: Muundo wa kirai tegemezi unaotawaliwa na ὡς unaeleza hali waliyodhani, si dai la moja kwa moja kwamba Paulo hatakuja; katika Kiswahili, wakati ujao unasikika kwa kawaida katika muktadha huu.
- source_word: δέ
  choice: —
  rationale: Ni kiunganishi hafifu cha mtiririko wa hoja, na si lazima kitafsiriwe wazi katika sentensi hii ya Kiswahili.
- source_word: ἐφυσιώθησάν
  choice: wamejivuna
  rationale: Neno hili linaonyesha kiburi cha kujiona kuwa mkuu. Ingawa sitiari halisi ni kama 'kujazwa upepo,' 'wamejivuna' ni usemi wa kawaida na wenye hadhi katika Kiswahili, na bado una mwangwi wa kujikuza.
- source_word: τινες
  choice: Wengine
  rationale: Hurejelea sehemu fulani ya watu wa kanisa, si wote; 'wengine' ni fupi na ya kawaida.
theological_decisions:
- issue: Namna ya kuwasilisha karipio la Paulo kuhusu kiburi
  choice: wamejivuna
  alternative: wamejaa kiburi
  rationale: '''Wamejivuna'' huwasilisha kujiona kwao kuwa wakuu kwa lugha ya kawaida, bila kuongeza ufafanuzi wa kimadhehebu, na hudumisha kwa kiasi mwangwi wa sitiari ya Paulo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Mpangilio unaweka karipio kwanza na kisha dhana potovu iliyolisababisha.
