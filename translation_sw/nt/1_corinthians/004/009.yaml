  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: sw
  text: Kwa maana nadhani kwamba Mungu ametuonyesha sisi mitume kuwa wa mwisho kabisa, kama watu waliohukumiwa kufa[a], kwa sababu tumekuwa kitu cha kutazamwa na ulimwengu, na malaika na wanadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama watu waliokusudiwa kufa.” Neno la Kigiriki linamaanisha watu waliowekewa kifo, huenda likiwa na picha ya watu waliohukumiwa kuuawa katika uwanja wa michezo.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ukumbi wa michezo”; hapa neno limetumiwa kwa picha ya kitu cha kutazamwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Kwa maana nadhani kwamba
  rationale: Huhifadhi uhusiano wa maelezo wa γάρ na tathmini binafsi ya Paulo katika δοκῶ kwa Kiswahili cha kawaida.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: sisi mitume
  rationale: Huwasilisha mkazo wa kiwakilishi na utambulisho wa kundi la Paulo kuwa mitume bila kufanya sentensi kuwa nzito.
- source_word: ἐσχάτους ἀπέδειξεν
  choice: ametuweka ... mwisho kabisa
  rationale: Katika muktadha wa picha ya tamasha la hadharani, usemi huu unaonyesha Mungu amewatoa mitume waonekane katika nafasi ya mwisho kabisa; hali ya matokeo inaelezwa kwa wakati timilifu wa Kiswahili.
- source_word: ὡς ἐπιθανατίους
  choice: kama watu waliohukumiwa kufa
  rationale: Hueleza watu waliowekwa kwa ajili ya kifo, huenda wafungwa waliokusudiwa kuuawa katika maonyesho ya uwanjani.
- source_word: θέατρον ἐγενήθημεν
  choice: tumekuwa tamasha
  rationale: θέατρον hapa ni kitu cha kutazamwa hadharani, si hasa jengo la ukumbi wa michezo.
- source_word: τῷ κόσμῳ
  choice: kwa ulimwengu
  rationale: Dativu inaonyesha hadhira au wale ambao mbele yao mitume wamekuwa tamasha.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: kwa malaika na kwa wanadamu
  rationale: Huhifadhi uwiano wa hadhira mbili na huonyesha wazi kwamba ἀνθρώποις ni wanadamu kwa ujumla, si wanaume pekee.
theological_decisions:
- issue: Maana ya ἀγγέλοις
  choice: malaika, yaani viumbe wa mbinguni wanaotazama yaliyowapata mitume
  alternative: wajumbe kwa maana ya jumla
  rationale: Katika mfuatano wa ‘ulimwengu,’ ‘malaika,’ na ‘wanadamu,’ maana ya asili zaidi ni viumbe wa kiroho; tafsiri haiongezi maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Tamasha’ limetumiwa kwa maana ya kitu kinachotazamwa hadharani, huku tanbihi ikifafanua picha ya θέατρον. ‘Wanadamu’ huepuka kuelekeza ἀνθρώποις kwa wanaume pekee.
