review_pass:
  verdict: revise
  source_fidelity: The three emphatic contrasts and their order are retained, and “kwa ajili ya Masihi” appropriately renders διὰ Χριστόν without over-resolving its causal/purposive nuance. “Katika Masihi” preserves ἐν Χριστῷ, while “dhaifu/wenye nguvu” accurately represents the middle contrast. The final wording, however, uses “tunadharauliwa” (“we are despised”), which is stronger and semantically narrower than ἄτιμοι (“dishonored,” “without honor”).
  naturalness: The translation is fluent, contemporary Standard East African Swahili and retains Paul’s pointed rhetorical parallelism. Replacing “tunadharauliwa” with “hatuheshimiwi” gives a natural, direct social-status antithesis to “mnaheshimiwa.”
  terminology: “Masihi” consistently renders Χριστός as a title. “Wapumbavu” and “wenye hekima” preserve the irony and contrast well. “Mnaheshimiwa / hatuheshimiwi” is the closest natural Swahili pairing for ἔνδοξοι / ἄτιμοι.
  issues:
  - severity: medium
    issue: “Tunadharauliwa” over-translates ἄτιμοι.
    rationale: Kudharau denotes despising or treating with contempt. The Greek adjective denotes lacking honor or being dishonored; it need not assert active contempt. “Hatuheshimiwi” preserves the status contrast with “mnaheshimiwa” without adding force.
