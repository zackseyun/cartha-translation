  to: Sisi ni wapumbavu kwa ajili ya Masihi[a], lakini ninyi ni wenye hekima katika Masihi[b]; sisi ni dhaifu, lakini ninyi ni wenye nguvu; ninyi mnaheshimiwa, lakini sisi hatuheshimiwi.[c]
