  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: sw
  text: Sisi ni wapumbavu kwa ajili ya Masihi[a], lakini ninyi ni wenye hekima katika Masihi[b]; sisi ni dhaifu, lakini ninyi ni wenye nguvu; ninyi mnaheshimiwa, lakini sisi hatuheshimiwi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya Masihi.” Kirai cha Kigiriki διὰ Χριστόν kinaweza kuonyesha sababu au kusudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Kristo.” Kigiriki kina usemi wa kawaida wa Paulo ἐν Χριστῷ.
    reason: lexical_alternative
  - marker: c
    text: “Mnaheshimiwa” na “hatuheshimiwi” hapa huenda vinahusu hadhi ya hadharani na jinsi watu wanavyowaona, si hisia za ndani tu.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: wapumbavu
  rationale: Neno hili linadumisha ukali wa kejeli ya Paulo na linatofautiana moja kwa moja na “wenye hekima.”
- source_word: διὰ Χριστόν
  choice: kwa ajili ya Masihi
  rationale: “Kwa ajili ya” ni Kiswahili cha kawaida kinachoweza kuonyesha sababu au kujitoa kwa manufaa ya mtu; “Masihi” linadumisha nguvu ya cheo Χριστός.
- source_word: φρόνιμοι
  choice: wenye hekima
  rationale: Linahifadhi utofautishaji wa moja kwa moja na “wapumbavu” na linasikika kwa kawaida katika Kiswahili sanifu.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Muundo wa kawaida wa Paulo wenye kihusishi ἐν umehifadhiwa badala ya kufafanuliwa kwa namna inayofunga maana yake.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: dhaifu / wenye nguvu
  rationale: Jozi hii ya maneno inadumisha ulinganifu na upinzani wa kirhetori bila kubainisha udhaifu au nguvu kuwa wa aina fulani tu.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: mnaheshimiwa / tunadharauliwa
  rationale: Vitenzi hivi vinaeleza kwa Kiswahili cha kawaida hadhi ya kijamii na mtazamo wa wengine, huku vikidumisha upinzani wa heshima na fedheha.
- source_word: ἡμεῖς / ὑμεῖς
  choice: sisi / ninyi
  rationale: Viwakilishi vya kusisitiza vimewekwa wazi kwa sababu vinabeba utofautishaji mkali kati ya mitume na Wakorintho.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika vifungu vyote viwili neno linaweza kueleweka kama cheo; “Masihi” linadumisha maana hiyo bila kulifanya kuwa jina tu.
- issue: Maana ya ἐν Χριστῷ
  choice: katika Masihi
  alternative: kwa habari ya Masihi
  rationale: Tafsiri ya karibu inadumisha usemi mpana wa Paulo na haifungi mapema maana yake ya kiuhusiano au ya utambulisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipashio vitatu na urudiaji wa “sisi/ninyi” umehifadhiwa ili kudumisha kejeli na mlingano wa kirhetori wa Kigiriki.
