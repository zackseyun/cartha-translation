  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: sw
  text: Kwa maana, ni nani anayekufanya uwe tofauti?[a] Una nini ambacho hukupokea? Na ikiwa ulikipokea, kwa nini unajisifu kana kwamba hukukipokea?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani anayekutofautisha?” Kitenzi cha Kigiriki kinaweza kumaanisha “kutofautisha,” “kufanya awe tofauti,” au “kufanya tofauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Kwa maana ni nani anayekutofautisha na wengine?
  rationale: “Kwa maana” linaonyesha kuwa γάρ inatoa msingi wa karipio lililotangulia. “Anayekutofautisha na wengine” linaendeleza maana ya διακρίνω ya kutofautisha au kufanya mtu awe tofauti, bila kudai kwamba tofauti hiyo ni ubora wa lazima.
- source_word: τί δὲ ἔχεις
  choice: Una nini
  rationale: δὲ hapa ni kiunganishi chepesi katika mfululizo wa maswali ya balagha; kutokitafsiri kwa neno tofauti kunaleta mtiririko wa kawaida wa Kiswahili bila kupoteza hoja.
- source_word: ὃ οὐκ ἔλαβες
  choice: ambacho hukupokea
  rationale: Kitenzi cha wakati uliopita ἔλαβες kinaeleza kupokea kama tendo lililotimia. Kiwakilishi “ambacho” kinarejelea chochote alicho nacho mtu.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Na ikiwa kweli ulikipokea
  rationale: “Kweli” linaonyesha msisitizo wa καὶ katika sharti hili. “Ulikipokea” kinarejelea kile ambacho mtu anacho na ni cha kawaida katika Kiswahili.
- source_word: τί καυχᾶσαι
  choice: kwa nini unajisifu
  rationale: “Kujisifu” linafikisha maana ya καυχάομαι katika karipio la Paulo kuhusu fahari na majivuno; hali ya sasa inadokeza mwenendo unaoendelea.
- source_word: ὡς μὴ λαβών
  choice: kana kwamba hukukipokea
  rationale: '“Kana kwamba” linaonyesha namna iliyo kinyume na ukweli unaodokezwa: mtu anajisifu kama asiye mpokeaji wa kile alicho nacho.'
theological_decisions:
- issue: Upeo wa karipio la Paulo kuhusu tofauti, mali au vipawa vya mtu
  choice: 'Maneno yameachwa kuwa mapana: chochote mtu alicho nacho au kinachomtofautisha kilipokewa, si kwamba kilitokana naye mwenyewe.'
  alternative: Kuyahusisha maneno haya moja kwa moja na vipawa vya kiroho au majukumu ya huduma pekee, au kuyapanua waziwazi hadi kila baraka na uwezo.
  rationale: Muktadha unahusu huduma ya mitume, makundi na kujisifu, lakini maneno ya Kigiriki yenyewe ni ya jumla. Tafsiri haibani wala kupanua upeo huo kuliko maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali mafupi yanahifadhi nguvu ya balagha ya mstari. Umoja wa nafsi (“una,” “ulikipokea,” “unajisifu”) unaakisi viwakilishi na vitenzi vya umoja katika Kigiriki.
