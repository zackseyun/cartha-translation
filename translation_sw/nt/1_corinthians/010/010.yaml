  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: sw
  text: Wala msinung’unike, kama baadhi yao walivyonung’unika na kuangamizwa na mwangamizaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malaika wa maangamizi.” Kigiriki kinasema “mwangamizaji,” huenda kikidokeza mtendaji wa maangamizi katika hukumu zilizowapata Israeli jangwani.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Wala msi-
  rationale: Katika mfululizo wa makatazo, μηδέ huunganisha onyo hili na yaliyotangulia; “Wala” hudumisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: γογγύζετε
  choice: msinung’unike
  rationale: “Kunung’unika” huonyesha malalamiko ya kutoridhika na inafaa kwa dokezo la Waisraeli jangwani.
- source_word: καθάπερ
  choice: kama ... walivyo-
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho na mfano wa kuonya.
- source_word: τινὲς αὐτῶν
  choice: baadhi yao
  rationale: Hutafsiri kwa uwazi usemi wa sehemu unaorejelea baadhi ya Waisraeli waliotajwa katika muktadha.
- source_word: ἐγόγγυσαν
  choice: walivyonung’unika
  rationale: Mzizi uleule umetumiwa kama katika γογγύζετε ili kuhifadhi urudiaji wa makusudi.
- source_word: ἀπώλοντο
  choice: wakaangamizwa
  rationale: Kauli ya kutendwa inafaa kwa kuwa kishazi kinachofuata kinamtaja mtendaji wa maangamizi.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: na mwangamizaji
  rationale: Huhifadhi jina la cheo lisiloainishwa, “mwangamizaji,” bila kuongeza kwamba alikuwa malaika.
theological_decisions:
- issue: Utambulisho wa ὁ ὀλοθρευτής
  choice: mwangamizaji
  alternative: malaika wa maangamizi
  rationale: Kigiriki humtaja mtendaji kwa cheo tu bila kumtambulisha wazi kuwa malaika. Matini kuu huhifadhi hali hiyo ya kutobainishwa; tafsiri yenye ufafanuzi zaidi imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kunung’unika” ni neno la kawaida na lenye uzito unaofaa; “mwangamizaji” huhifadhi kwa ufupi utata wa matini ya Kigiriki.
