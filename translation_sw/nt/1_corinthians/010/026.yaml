  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: sw
  text: Kwa maana dunia ni ya Bwana,[a] na vyote vinavyoijaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Imenukuliwa kutoka Zaburi 24:1. Au, kwa lugha ya kawaida zaidi, “vyote vilivyomo.”
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: Bwana
  rationale: Jina κύριος limetafsiriwa kwa neno la kawaida la kibiblia “Bwana.” Muundo wa umilikaji τοῦ κυρίου umeelezwa kwa Kiswahili cha asili kuwa “ni ya Bwana.”
- source_word: γάρ
  choice: Kwa maana
  rationale: γάρ inatoa msingi wa Maandiko kwa hoja iliyotangulia; “Kwa maana” linaonyesha uhusiano huo wa ufafanuzi kwa uwazi.
- source_word: γῆ
  choice: dunia
  rationale: Katika nukuu hii ya Zaburi 24:1, γῆ ina maana pana ya dunia, si eneo fulani la nchi.
- source_word: πλήρωμα
  choice: vyote vinavyoijaza
  rationale: τὸ πλήρωμα αὐτῆς hapa ni jumla ya vitu vinavyoijaza dunia. Tafsiri hii ni ya kawaida na inabaki karibu na taswira ya neno la Kigiriki kuliko “vyote vilivyomo.”
- source_word: αὐτῆς
  choice: -i- katika “vinavyoijaza”
  rationale: Kiwakilishi αὐτῆς kinarejelea γῆ; katika Kiswahili rejeo hilo linaonyeshwa kiasili kwa kiambishi cha yambwa “-i-” kinachorejelea “dunia.”
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Maandiko yenye uzito wa kiteolojia
  choice: Bwana
  alternative: BWANA
  rationale: Paulo ametumia κύριος katika maandishi ya Kigiriki. “Bwana” huhifadhi matumizi ya Agano Jipya bila kuingiza hapa desturi ya herufi kubwa inayotumiwa na baadhi ya tafsiri kuwakilisha jina YHWH katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa sababu wa γάρ na taswira ya πλήρωμα huku ikiepuka lugha ya kizamani kama “viijazavyo.”
