  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: sw
  text: Mambo hayo yaliwapata wale watu kama mifano[a], lakini yaliandikwa kwa mawaidha yetu[b], sisi ambao miisho ya nyakati imetufikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama vielelezo” au “kwa namna ya kiishara”; Paulo anaonyesha kwamba matukio hayo yalikuwa mifano yenye maana ya kuwafundisha waamini wa baadaye.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya mafundisho yetu” au “kwa ajili ya maonyo yetu”; neno la Kigiriki linahusisha mafundisho ya kurekebisha na onyo.
    reason: lexical_alternative
  - marker: c
    text: Au “mwisho wa nyakati umetufikia.” Kigiriki kina wingi, “miisho ya nyakati,” unaohifadhi usemi wa Paulo kuhusu historia ya wokovu.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: kama mifano
  rationale: Kielezi hiki kinaonyesha kwamba matukio hayo yalikuwa vielelezo au mifumo yenye umuhimu wa kuwafundisha waamini wa baadaye. “Kama mifano” ni Kiswahili cha kawaida na kinaafikiana na muktadha wa mstari wa 6.
- source_word: συνέβαινεν
  choice: yaliwapata
  rationale: Huwasilisha matukio yaliyowatokea watu wa kizazi cha jangwani; umbo la wingi la “mambo hayo” hubeba kwa kawaida wazo la matukio mengi.
- source_word: ἐκείνοις
  choice: wao
  rationale: Kiwakilishi kinawarejelea watu wa kizazi cha jangwani waliotajwa katika muktadha uliotangulia.
- source_word: ἐγράφη
  choice: yaliandikwa
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja, kimaana kinarejelea mambo au masimulizi yaliyotangulia. Wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: πρὸς νουθεσίαν
  choice: ili kutufundisha na kutuonya
  rationale: νουθεσία hujumuisha mafundisho ya kurekebisha pamoja na onyo. Jozi hii ya vitenzi vya kawaida huhifadhi upana huo wa maana bila kutumia neno gumu.
- source_word: εἰς οὓς
  choice: sisi tuliofikiwa na
  rationale: Muundo huu wa Kiswahili huhifadhi wazo la ukweli wa kieskatolojia kuwafikia watu hao, huku ukibaki wa kawaida na wenye kueleweka.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: miisho ya nyakati
  rationale: Huhifadhi wingi wa maneno yote mawili ya Kigiriki na kutosawazisha usemi wa Paulo kuwa umoja.
- source_word: κατήντηκεν
  choice: tuliofikiwa
  rationale: Huwasilisha kuwasili ambako kumetimia na bado kuna athari kwa wakati wa sasa, kwa lugha ya Kiswahili iliyo ya kawaida katika sentensi hii.
theological_decisions:
- issue: Usemi wa Paulo wa historia ya wokovu, τὰ τέλη τῶν αἰώνων
  choice: miisho ya nyakati
  alternative: mwisho wa nyakati; utimilifu wa nyakati
  rationale: Wingi umehifadhiwa ili kudumisha mvutano wa kieskatolojia na usemi wa pekee wa Paulo badala ya kuufanya kuwa dhana moja iliyorahisishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa kawaida kwa Kiswahili bila kuondoa wingi usio wa kawaida lakini muhimu wa “miisho ya nyakati.”
