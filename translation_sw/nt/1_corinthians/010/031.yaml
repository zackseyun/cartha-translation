  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: sw
  text: Kwa hiyo, iwe mnakula au mnakunywa, au chochote mnachofanya, fanyeni kila kitu kwa utukufu wa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: iwe ... au ... au
  rationale: Muundo huu wa Kiswahili unaonyesha hali mbalimbali zinazowezekana na kudumisha mfululizo wa maneno ya Kigiriki kwa lugha ya kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha kwamba agizo hili ni hitimisho linalotokana na mjadala uliotangulia.
- source_word: ἐσθίετε
  choice: mnakula
  rationale: Wakati uliopo hapa unaeleza tendo kwa ujumla; 'mnakula' ni Kiswahili cha sasa na cha kawaida.
- source_word: πίνετε
  choice: mnakunywa
  rationale: Kama ilivyo kwa 'mnakula,' kitenzi hiki kinaeleza tendo la kawaida, si lazima tendo linaloendelea wakati huo.
- source_word: τι ποιεῖτε
  choice: chochote mnachofanya
  rationale: '''Chochote'' huonyesha upana wa jambo lisilotajwa na kueneza kanuni hiyo zaidi ya kula na kunywa.'
- source_word: πάντα
  choice: kila kitu
  rationale: Huwasilisha kwa uwazi maana jumuishi ya mambo yote katika Kiswahili cha kisasa.
- source_word: εἰς δόξαν
  choice: kwa utukufu
  rationale: '''Kwa utukufu'' huonyesha lengo au kusudi la matendo huku ikihifadhi nomino ''utukufu'' ya maandishi ya Kigiriki.'
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Huwakilisha kwa kawaida uhusiano wa kimilikishi katika kirai 'utukufu wa Mungu.'
- source_word: ποιεῖτε
  choice: fanyeni
  rationale: Umbo la agizo la wingi linafikisha wito wa Paulo kwa wasomaji wote na kudumisha maana pana ya ποιέω.
theological_decisions:
- issue: Upeo wa agizo la Paulo
  choice: Agizo linahusu kila tendo, huku kula na kunywa zikiwa mifano inayotokana na mjadala wa karibu.
  alternative: Agizo linahusu tu masuala ya chakula na kinywaji.
  rationale: Maneno 'chochote mnachofanya' na 'kila kitu' yanapanua kwa wazi upeo wa kanuni, bila kuondoa uhusiano wake na mjadala wa chakula na kinywaji katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Muundo wa sentensi unadumisha mfululizo na msisitizo wa maandishi ya Kigiriki bila kutumia mtindo wa kizamani.
