lexical_decisions:
- source_word: βλέπετε
  choice: Fikirieni
  rationale: Kitenzi cha amri kwa wingi hapa kinadai kutafakari hoja, si kutazama kwa macho tu.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Israeli kwa jinsi ya mwili
  rationale: Inahifadhi usemi wa Paulo wenye neno ‘mwili’ na kutoufasiri kimadhehebu; katika muktadha unahusu Israeli kwa uzao wa asili.
- source_word: οἱ ἐσθίοντες τὰς θυσίας
  choice: wale wanaokula dhabihu
  rationale: Inawasilisha moja kwa moja tendo halisi la kula na maana ya dhabihu bila kuongeza tafsiri.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: washiriki wa madhabahu
  rationale: ‘Washiriki’ huonyesha kuwa na sehemu au ushirika katika uhalisi wa ibada unaohusiana na madhabahu; muundo wa ‘wa madhabahu’ pia unaakisi uhusiano wa genitivi bila kuubainisha kupita kiasi.
- source_word: οὐχ ... εἰσίν;
  choice: je, ... si ...?
  rationale: Muundo huu wa swali la balagha unatarajia jibu la kukubali.
theological_decisions:
- issue: Maana ya ‘Israeli kwa jinsi ya mwili’
  choice: Usemi umehifadhiwa katika matini, huku tanbihi ikifafanua kuwa hapa unaelekea kumaanisha Israeli kwa uzao wa asili.
  alternative: Israeli wa kimwili; Israeli kwa uzao wa asili
  rationale: Hii inadumisha msuguano wa usemi wa Paulo na haifanyi dai pana kuhusu uhusiano kati ya Israeli na kanisa.
- issue: Uhusiano wa washiriki na madhabahu
  choice: washiriki wa madhabahu
  alternative: wenye kushiriki katika madhabahu; wenye ushirika na madhabahu
  rationale: Genitivi inaweza kuonyesha kuwa na sehemu katika nyanja ya dhabihu inayowakilishwa na madhabahu. Tafsiri kuu haibani maana kwenye ushirika na kitu chenyewe wala kwenye tendo la kiibada peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Fikirieni’ ni wito wa kutafakari hoja; ‘dhabihu’ na ‘madhabahu’ ni istilahi za kawaida za kibiblia.
