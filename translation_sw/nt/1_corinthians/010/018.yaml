  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: sw
  text: 'Fikirieni Israeli kwa jinsi ya mwili[a]: je, wale wanaokula dhabihu si washiriki wa madhabahu?[b]'
  philosophy: optimal-equivalence
