  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: sw
  text: na wote wakanywa kinywaji kilekile cha kiroho[a]. Kwa maana walikuwa wakinywa kutoka katika mwamba wa kiroho uliokuwa ukiwafuata, na mwamba huo ulikuwa Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kinywaji kilichohusishwa na ulimwengu wa Roho na utoaji wa Mungu; neno la Kigiriki pia limetafsiriwa “cha kimiujiza,” lakini maana hiyo ni finyu zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki Kristo; maana yake, “Masihi.” Hapa neno hilo linatumika kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: kinywaji ... cha kiroho
  rationale: Huhifadhi neno la Paulo na ulinganifu wake na “chakula cha kiroho” katika mstari uliotangulia, bila kulifupisha kuwa tu “cha kimiujiza” au “cha mfano.”
- source_word: ἔπιον
  choice: wakanywa
  rationale: Wakati timilifu wa Kigiriki unaeleza kwa muhtasari jambo lililowapata wote; “wakanywa” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἔπινον
  choice: walikuwa wakinywa
  rationale: Muundo huu unaonyesha tendo lililoendelea au lililorudiwa, na kulitofautisha na “wakanywa” ya awali.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: kutoka katika mwamba wa kiroho uliokuwa ukiwafuata
  rationale: “Mwamba” huwakilisha πέτρα vizuri kuliko “jiwe,” na “uliokuwa ukiwafuata” huhifadhi hali endelevu ya kitenzi-shirikishi cha wakati wa sasa.
- source_word: ἡ πέτρα δὲ ἦν
  choice: na mwamba huo ulikuwa
  rationale: “Na” hudumisha mtiririko wa maelezo bila kuzidisha maana ya upinzani katika δέ; “huo” hurejelea mwamba uliotajwa mara moja kabla.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Hapa Χριστός inatumika kama cheo katika kauli ya utambulisho, hivyo “Masihi” huonyesha maana yake wazi badala ya kuitumia kama jina tu.
- source_word: πάντες τὸ αὐτὸ
  choice: wote ... kilekile
  rationale: Huhifadhi msisitizo wa Paulo kwamba kundi lote lilishiriki jambo lilelile.
theological_decisions:
- issue: Kauli ya utambulisho “mwamba huo ulikuwa Masihi”
  choice: Kuitafsiri moja kwa moja kama “mwamba huo ulikuwa Masihi.”
  alternative: “Mwamba huo ulimwakilisha Masihi.”
  rationale: Kigiriki kina kauli ya moja kwa moja ya usawa, ἡ πέτρα δὲ ἦν ὁ Χριστός. Tafsiri ya moja kwa moja huhifadhi nguvu na mvutano wa dai la Paulo bila kuligeuza kimya kimya kuwa ishara tu au kutoa maelezo ya kifalsafa yasiyomo katika maandishi.
- issue: Maana ya πνευματικός kuhusu kinywaji na mwamba
  choice: Kuhifadhi “cha/wa kiroho.”
  alternative: “cha/wa kimiujiza” au “cha/wa mfano.”
  rationale: “Kiroho” hudumisha uzito wa kiteolojia na upana wa neno la Paulo, ambalo linaweza kuhusisha utoaji wa Mungu na umuhimu wa kiishara bila kufungiwa katika maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walikuwa wakinywa” na “uliokuwa ukiwafuata” huhifadhi hali endelevu ya vitenzi vya Kigiriki bila kufanya sentensi kuwa ngumu isivyo lazima.
