  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: sw
  text: Ikiwa mimi ninakula kwa shukrani[a], kwa nini ninasemwa vibaya kwa sababu ya kile ambacho ninatoa shukrani kwa ajili yake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa mimi ninakula kwa neema, kwa nini ninasemwa vibaya kwa sababu ya kile ambacho ninatoa shukrani kwa ajili yake?” Neno la Kigiriki χάριτι linaweza kutafsiriwa “kwa neema,” lakini katika muktadha huu wengi hulielewa kuwa “kwa shukrani” kwa sababu ya maneno yanayofuata, “ninatoa shukrani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: kwa shukrani
  rationale: Katika muktadha wa chakula na kitenzi kinachofuata εὐχαριστῶ, usemi huu unaeleweka kwa kawaida kuwa kushiriki huku kunaambatana na shukrani. Hata hivyo, uwezekano wa maana ya ‘kwa neema’ umehifadhiwa katika tanbihi.
- source_word: μετέχω
  choice: nakula
  rationale: Ingawa kitenzi kina maana ya kushiriki au kuwa na sehemu, hapa muktadha wa karibu ni kula chakula; ‘nakula’ ni Kiswahili cha kawaida na wazi.
- source_word: βλασφημοῦμαι
  choice: ninasemwa vibaya
  rationale: Kwa kuwa anayelengwa na maneno hayo ni mtu, maana hapa ni kukashifiwa au kusemwa vibaya, si kumkufuru Mungu.
- source_word: ὑπὲρ οὗ
  choice: kwa ajili ya kile
  rationale: Huhifadhi uhusiano wa sababu au msingi wa shutuma katika sentensi ya Kiswahili iliyo wazi.
- source_word: εὐχαριστῶ
  choice: ninachomshukuru
  rationale: Kitenzi humaanisha kutoa shukrani. Kiambishi cha yambwa ‘-m-’ kinadokeza anayeshukuriwa, yaani Mungu katika muktadha, bila kuongeza nomino ‘Mungu’ moja kwa moja katika matini.
- source_word: ἐγὼ ... ἐγὼ
  choice: mimi ... nina-
  rationale: ‘Mimi’ ya kwanza huhifadhi mkazo wa kiwakilishi wazi cha Kigiriki; nafsi ya kwanza ya pili inaonyeshwa kiasili katika kitenzi cha Kiswahili bila urudiaji mzito.
- source_word: τί
  choice: kwa nini
  rationale: Katika swali hili la balagha, τί humaanisha ‘kwa nini?’
theological_decisions:
- issue: Maana ya χάριτι kuhusiana na kula na kutoa shukrani
  choice: kwa shukrani
  alternative: kwa neema
  rationale: Muktadha wa karibu, hasa εὐχαριστῶ (‘nashukuru’), unaunga mkono maana ya shukrani. Maana halisi inayowezekana ya ‘kwa neema’ haijafutwa bali imeonyeshwa katika tanbihi, ili kutoamua kimya kimya utata wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nakula’ huweka wazi muktadha wa chakula; ‘ninasemwa vibaya’ ni ya kawaida na haileti maana maalumu ya kumkufuru Mungu. Tanbihi huhifadhi maana mbadala ya χάριτι.
