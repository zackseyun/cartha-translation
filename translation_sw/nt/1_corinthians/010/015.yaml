id: 1CO.10.15
reference: 1 Corinthians 10:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: sw
  text: Ninasema nanyi kama watu wenye busara[a]; ninyi wenyewe amueni ninachosema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama watu wenye akili,” au “kama watu wenye hekima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “jiamulieni wenyewe juu ya ninachosema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kama
  rationale: Hutambulisha namna Paulo anavyowachukulia wasikilizaji wake anaposema nao; ‘kama’ ni ya kawaida na inaacha wazi ikiwa ni sifa ya moja kwa moja au mbinu ya usemi.
- source_word: φρονίμοις
  choice: watu wenye busara
  rationale: Neno hili linaashiria busara ya kiutendaji na uwezo wa kupambanua; ‘wenye busara’ ni lugha ya sasa, yenye heshima, bila kudai hekima kamilifu.
- source_word: λέγω
  choice: Ninasema nanyi
  rationale: ‘Ninasema nanyi’ huwasilisha kitendo cha kuwaelekezea maneno, na huunda Kiswahili cha kawaida pamoja na ‘kama watu wenye busara.’
- source_word: κρίνατε
  choice: amueni
  rationale: Amri hii inawataka wafanye tathmini na kufikia uamuzi. ‘Amueni’ ni ya asili katika muktadha huu; ‘hukumu’ ingeweza kusikika kama kutoa hukumu ya kisheria au ya kiadili.
- source_word: ὑμεῖς
  choice: ninyi wenyewe
  rationale: Kiwakilishi kilichotajwa wazi kina mkazo; ‘ninyi wenyewe’ huhifadhi msisitizo huo.
- source_word: ὅ
  choice: ninachosema
  rationale: Kiwakilishi husika kisicho na jinsia kinakuwa yambwa wa φημι; muundo ‘ninachosema’ ni wa kawaida katika Kiswahili.
- source_word: φημι
  choice: ninachosema
  rationale: Hapa humaanisha kile Paulo anachosema au anachodai; muundo huu ni mfupi na wa asili.
theological_decisions:
- issue: Namna ya kuwataja wasikilizaji kwa usemi wa kishawishi
  choice: Paulo anasema nao kama watu wenye uwezo wa kutumia busara, bila kutafsiri kauli hiyo kuwa pongezi kamili kwa mwenendo wao.
  alternative: Kauli inaweza kueleweka kama sifa ya moja kwa moja, au kama kejeli ya kiasi.
  rationale: Tafsiri ‘kama watu wenye busara’ huhifadhi mvutano huo na haiamui kimya kimya ikiwa Paulo anawasifu au anatumia kejeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umehifadhi mkazo wa ὑμεῖς kwa ‘ninyi wenyewe,’ huku ‘wenye busara’ ukidumisha wazo la utambuzi wa kiutendaji bila kulazimisha tafsiri ya kejeli au sifa kamili.
