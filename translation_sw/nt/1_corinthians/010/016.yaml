id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: sw
  text: Kikombe cha baraka tunachokibariki, je, si ushiriki katika damu ya Masihi?[a] Mkate tunaoumega, je, si ushiriki katika mwili wa Masihi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushirika katika” au “kuwa na sehemu katika.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki Christou; hapa limetafsiriwa “Masihi” kwa kuwa Χριστός linatumika kama cheo. Kimapokeo, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποτήριον
  choice: kikombe
  rationale: “Kikombe” ni neno la kawaida na la moja kwa moja, bila kuingiza sajili maalumu ya baadaye ya kiliturujia.
- source_word: τῆς εὐλογίας
  choice: cha baraka
  rationale: Huhifadhi muundo na maana ya εὐλογία, huku ikiacha wazi mandhari ya baraka au shukrani katika mlo.
- source_word: ὃ εὐλογοῦμεν
  choice: tunachokibariki
  rationale: Huhifadhi urudiaji wa mzizi wa “baraka” uliopo katika εὐλογίας na εὐλογοῦμεν bila kuufasiri kuwa shukrani pekee.
- source_word: οὐχὶ
  choice: je, si
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: κοινωνία
  choice: ushiriki katika
  rationale: Hueleza kushiriki kwa kweli bila kuifanya maana kuwa urafiki wa kijamii tu wala kuamua mabishano ya kimadhehebu kuhusu namna ya ushiriki huo.
- source_word: τοῦ αἵματος
  choice: damu
  rationale: Tafsiri ya moja kwa moja inayohifadhi uzito wa kiagano na wa dhabihu.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa bado ina nguvu ya cheo cha Mtiwa-Mafuta; “Masihi” huihifadhi, huku “Kristo” ikitolewa katika tanbihi kama namna ya kimapokeo.
- source_word: ἄρτον
  choice: mkate
  rationale: “Mkate” ni tafsiri ya kawaida; mstari huu pekee haulazimishi maana maalumu zaidi ya “mkate mmoja.”
- source_word: ὃν κλῶμεν
  choice: tunaoumega
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi tendo halisi la kumega mkate.
- source_word: τοῦ σώματος
  choice: mwili
  rationale: Tafsiri ya moja kwa moja inayohifadhi uzito wa maana bila kuibana kidhehebu.
theological_decisions:
- issue: Maana ya κοινωνία katika muktadha wa Meza ya Bwana
  choice: ushiriki katika
  alternative: ushirika katika; kuwa na sehemu katika
  rationale: “Ushiriki katika” huhifadhi wazo la kushiriki kwa kweli katika damu na mwili wa Masihi, lakini haisemi ushiriki huo unatokeaje; hivyo hauegemei mtazamo wa uwepo halisi wala wa ishara tupu.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linaweza kusikika kama cheo cha Mtiwa-Mafuta, kwa hiyo “Masihi” limetumiwa; namna iliyozoeleka ya “Kristo” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali ya balagha umehifadhiwa, na “tunachokibariki” hudumisha urudiaji wa maneno ya baraka katika Kigiriki.
