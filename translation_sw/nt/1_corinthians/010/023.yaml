  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: sw
  text: “Mambo yote yanaruhusiwa,” lakini si yote yanafaa.[a] “Mambo yote yanaruhusiwa,” lakini si yote hujenga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mambo yote ni halali.” Usemi wa Kigiriki unaweza kumaanisha kwamba mambo yanaruhusiwa au ni halali; alama za kunukuu zinaonyesha kwamba huenda hii ilikuwa kauli ya Wakorintho ambayo Paulo anaipa kikomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Mambo yote
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; ‘mambo yote’ kinahifadhi upeo mpana na urudiaji wa kauli hiyo.
- source_word: ἔξεστιν
  choice: yanaruhusiwa
  rationale: Kitenzi kinaonyesha jambo linalokubalika au kuruhusiwa. ‘Yanaruhusiwa’ ni Kiswahili cha sasa na hakilazimishi maana ya kisheria pekee.
- source_word: ἀλλ’
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji wa moja kwa moja na kuhifadhi muundo mfupi wa Kigiriki.
- source_word: συμφέρει
  choice: yenye faida
  rationale: Neno hilo humaanisha kuwa na manufaa au kusaidia. ‘Yenye faida’ ni la kawaida na halihitaji kueleweka kwa maana ya biashara.
- source_word: οἰκοδομεῖ
  choice: yanayojenga
  rationale: Linahifadhi sitiari ya kujenga, ambayo Paulo huitumia kuhusu kuimarisha wengine au jumuiya, bila kuongeza kitu kisichotajwa wazi katika mstari.
theological_decisions:
- issue: Ikiwa Πάντα ἔξεστιν itiwe alama kama nukuu ya kauli ya Wakorintho
  choice: 'Kutumia alama za kunukuu: “Mambo yote yanaruhusiwa”'
  alternative: Kuandika bila alama za kunukuu kana kwamba ni kauli ya Paulo mwenyewe isiyowekewa alama
  rationale: Huenda maneno haya ni kauli ya Wakorintho ambayo Paulo anaipa mipaka. Kwa kuwa hati za Kigiriki hazikuwa na alama za kisasa za kunukuu, uamuzi huu ni wa uakifishaji na umeelezwa katika tanbihi ili kutohitimisha utata kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo sambamba na urudiaji wa Kigiriki umehifadhiwa; ‘yanayojenga’ hudumisha sitiari bila kufafanua kimadhehebu anayejengwa.
