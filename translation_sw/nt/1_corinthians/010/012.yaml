  text: Kwa hiyo[a], yule anayefikiri kwamba amesimama aangalie asianguke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, yeyote anayefikiri kwamba amesimama awe mwangalifu asianguke.”
    reason: Tofauti halali ya kileksika na kisintaksia kwa ὥστε, ὁ δοκῶν, na βλεπέτω.
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho kutokana na mifano ya maonyo iliyotangulia; “Kwa hiyo” ni ya kawaida na huhifadhi nguvu ya hoja.
- source_word: ὁ δοκῶν
  choice: yule anayefikiri
  rationale: Kirai cha kisifa chenye kibainishi kimetumiwa kama nomino na kinamwakilisha mtu mmoja; tafsiri hii huhifadhi dhana ya mtu kujiona yuko katika hali fulani.
- source_word: ἑστάναι
  choice: kuwa amesimama
  rationale: Kitenzi-jina cha wakati timilifu kinaonyesha hali ya kuwa amesimama; tafsiri hii haiongezi wazo la “kusimama imara,” ambalo halijasemwa wazi.
- source_word: βλεπέτω
  choice: na aangalie
  rationale: Amri ya wakati uliopo inatoa onyo la kuendelea kuwa macho; “na aangalie” ni ya asili katika Kiswahili na huhifadhi nguvu ya tahadhari.
- source_word: μὴ πέσῃ
  choice: asianguke
  rationale: μή pamoja na kitenzi cha hali tegemezi baada ya amri huonyesha tahadhari au kusudi hasi; “asianguke” ni fupi na hudumisha onyo bila kufafanua aina ya kuanguka.
theological_decisions:
- issue: Maana ya “kuanguka” katika onyo la Paulo
  choice: Kudumisha onyo la jumla “asianguke” bila kubainisha aina ya kuanguka.
  alternative: “asianguke katika dhambi,” “asihukumiwe,” au “asiache imani”
  rationale: Muktadha unaonya dhidi ya kujiamini kupita kiasi kwa kuzingatia kushindwa kwa Israeli, lakini πέσῃ yenyewe haitaji wazi uasi, dhambi ya kimaadili, wala hukumu. Tafsiri pana huhifadhi utata na mvutano wa kiteolojia wa chanzo.
- issue: Usemi wa umoja wa kiume wenye maana wakilishi
  choice: Kutumia “yule” pamoja na maumbo ya umoja yasiyoonyesha jinsia katika vitenzi vya Kiswahili.
  alternative: Kutumia wingi, kama “wanaofikiri ... waangalie wasi​anguke.”
  rationale: Kigiriki kina umoja wa kiume unaotumika kwa maana wakilishi. Kiswahili kinaweza kuhifadhi umoja huo bila kulazimika kuongeza kiwakilishi cha jinsia ambacho hakihitajiki kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi umoja, mantiki ya hitimisho, na onyo la jumla bila kuingiza ufafanuzi wa kimadhehebu.
