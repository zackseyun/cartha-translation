  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: sw
  text: Mtu yeyote asitafute faida yake mwenyewe[a], bali faida ya mtu mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri halisi zaidi, “Mtu yeyote asitafute kilicho chake mwenyewe, bali kilicho cha mwingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: Mtu yeyote asitafute
  rationale: Pamoja na kitenzi cha amri cha nafsi ya tatu, muundo huu unatoa katazo la jumla kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ζητείτω
  choice: asitafute
  rationale: Kitenzi «tafuta» kinahifadhi maana pana ya kutafuta au kujitahidi kupata bila kuibana kuwa mali au hisia pekee.
- source_word: τὸ ἑαυτοῦ
  choice: faida yake mwenyewe
  rationale: Kirai cha Kigiriki kimeacha nomino ikieleweka kutokana na muktadha; «faida» huonyesha jambo linalomnufaisha mtu mwenyewe katika muktadha wa 10:23–33, huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: ἀλλὰ
  choice: bali
  rationale: «Bali» huonyesha kwa wazi tofauti kati ya kujitafutia mwenyewe na kumtafutia mtu mwingine.
- source_word: τὸ τοῦ ἑτέρου
  choice: faida ya mtu mwingine
  rationale: ἕτερος humaanisha mtu mwingine kwa kulinganishwa na nafsi; kurudia «faida» kunafanya kirai elekezi kieleweke kiasili katika Kiswahili.
theological_decisions:
- issue: Kuweka wazi nomino iliyodokezwa katika τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: faida yake mwenyewe ... faida ya mtu mwingine
  alternative: kilicho chake mwenyewe ... kilicho cha mwingine
  rationale: Kigiriki hakitaji wazi kitu kinachotafutwa. Muktadha unahusu kutenda kwa manufaa ya mwingine badala ya kujitafutia mwenyewe; «faida» huwasilisha nguvu hiyo ya kimaadili bila kuifanya iwe dai finyu zaidi, na tanbihi huhifadhi udhahiri wa ellipsis ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. «Mtu yeyote asitafute» ni katazo la kawaida; «faida» linaeleweka kwa urahisi huku tanbihi ikihifadhi muundo halisi na utata wa kirai cha Kigiriki.
