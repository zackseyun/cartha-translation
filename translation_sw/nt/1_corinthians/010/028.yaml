  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: sw
  text: Lakini mtu akiwaambia, “Hiki kimetolewa kama dhabihu,”[a] msile, kwa ajili ya yule aliyewaambia na kwa ajili ya dhamiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hiki ni chakula cha dhabihu.” Kivumishi cha Kigiriki hurejelea kitu kilichotolewa katika dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, dhamiri ya yule mwingine, si dhamiri yako mwenyewe; tazama mstari unaofuata.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Lakini mtu akiwaambia
  rationale: Muundo wa masharti ἐὰν pamoja na εἴπῃ unaonyesha hali inayoweza kutokea; ‘akiwaambia’ ni Kiswahili cha kawaida chenye maana hiyo. ‘Lakini’ linaendeleza utofautishaji wa δέ na hali iliyotangulia.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Hiki kimetolewa kuwa dhabihu
  rationale: ἱερόθυτος hurejelea kitu kilichotolewa katika dhabihu. Tafsiri hii ni ya kawaida na haiongezi wazi ‘sanamu,’ neno ambalo halipo katika kirai hiki, wala ‘nyama,’ ingawa muktadha unahusu chakula.
- source_word: μὴ ἐσθίετε
  choice: msile
  rationale: Amri ya sasa yenye μή ni katazo. Kiswahili hakihitaji kuongeza kiwakilishi cha kitu hapa kwa sababu chakula kinachozungumziwa kinaeleweka kutokana na muktadha.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: kwa ajili ya yule aliyewaambia
  rationale: διά pamoja na hali ya kushutumiwa huonyesha kuzingatia au kwa sababu ya mtu huyo. μηνύσαντα ni kumjulisha au kumweleza mtu jambo; ‘aliyewaambia’ ni wazi na ya kawaida katika muktadha huu.
- source_word: καὶ τὴν συνείδησιν
  choice: na kwa ajili ya dhamiri
  rationale: συνείδησις ni ‘dhamiri.’ Kurudia ‘kwa ajili ya’ kunafanya uhusiano wa kirai uwe wazi bila kubainisha katika matini kuu dhamiri hiyo ni ya nani.
theological_decisions:
- issue: Dhamiri inayokusudiwa na τὴν συνείδησιν ni ya nani?
  choice: Matini kuu inasema kwa ufupi ‘kwa ajili ya dhamiri,’ huku tanbihi ikieleza kuwa ni dhamiri ya yule mwingine.
  alternative: Kutaja moja kwa moja katika matini kuu ‘kwa ajili ya dhamiri yake,’ au kulichukulia kuwa dhamiri ya anayekula.
  rationale: Kisintaksia, mstari huu hauitaji mmiliki wa dhamiri, lakini mstari unaofuata unaeleza kuwa si dhamiri ya anayekula bali ya mwingine. Kuacha usemi mfupi katika matini kuu kunahifadhi mtiririko wa hoja ya Paulo, huku tanbihi ikisaidia msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Dhabihu’ na ‘dhamiri’ ni maneno ya kawaida katika sajili ya Biblia na yanaeleweka kwa wasomaji wengi. Wingi wa ‘akiwaambia/msile/aliyewaambia’ unaakisi ὑμῖν na ἐσθίετε.
