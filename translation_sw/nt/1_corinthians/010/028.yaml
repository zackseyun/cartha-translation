  to: Lakini mtu akiwaambia, “Hiki kimetolewa kama dhabihu,”[a] msile, kwa ajili ya yule aliyewaambia na kwa ajili ya dhamiri[b].
  rationale: A single lexical-syntactic adjustment changes “kuwa dhabihu” to “kama dhabihu,” accurately expressing sacrificial offering status. The revision preserves the source’s lack of an explicit reference to an idol, its indefinite “someone,” plural address, and the unresolved-in-this-verse ownership of “conscience.”
