review_pass:
  verdict: revise
  source_fidelity: The conditional construction, prohibition, and the deliberately unqualified reference to conscience are represented well. However, “kimetolewa kuwa dhabihu” can suggest that the item was given in order to become a sacrifice; “kimetolewa kama dhabihu” more directly conveys ἱερόθυτόν, something offered as a sacrifice, without importing “idol” or “meat.”
  naturalness: The draft is otherwise clear Standard East African Swahili. Replacing “kuwa” with “kama” produces a more idiomatic and semantically precise expression in this context.
  terminology: “Dhabihu” and “dhamiri” are appropriate established biblical-register terms. The footnote appropriately retains the contextual clarification that the conscience is the other person’s, while the main text preserves the Greek ellipsis.
  issues:
  - severity: medium
    issue: “Hiki kimetolewa kuwa dhabihu”
    rationale: The complement “kuwa dhabihu” may imply purpose or transformation (“given to become a sacrifice”) rather than the source meaning that it has been offered as a sacrifice. “Kimetolewa kama dhabihu” is the safer, natural equivalent.
  revised_text: Lakini mtu akiwaambia, “Hiki kimetolewa kama dhabihu,”[a] msile, kwa ajili ya yule aliyewaambia na kwa ajili ya dhamiri[b].
