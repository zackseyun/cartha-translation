  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: sw
  text: Au tunamtia Bwana wivu? Je, sisi tuna nguvu kuliko yeye?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: tunamchochea ... awe na wivu
  rationale: Kitenzi hiki humaanisha kumchochea mtu kuwa na wivu. Muundo huu wa Kiswahili unaeleweka kwa urahisi huku ukihifadhi picha ya wivu wa agano iliyomo katika muktadha.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Hii ndiyo tafsiri ya kawaida na yenye hadhi ya κύριος; muktadha unamrejelea Bwana bila kulazimisha ufafanuzi zaidi ya maandishi.
- source_word: μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν
  choice: Hakika sisi hatuna nguvu kuliko yeye, sivyo?
  rationale: Swali lenye μὴ linatarajia jibu la kukataa. 'Hakika' na 'sivyo?' zinaonyesha nguvu ya balagha ya swali bila kubadili dai lake kuwa kauli tambarare.
theological_decisions:
- issue: Maana ya wivu wa Bwana
  choice: Kuhifadhi usemi wa kwamba Bwana anachochewa awe na wivu
  alternative: Kutafsiri kuwa Bwana anakasirishwa
  rationale: Wivu ni sehemu halisi ya maana ya παραζηλόω na unaunganisha mstari huu na onyo la ibada ya sanamu; kuubadili kuwa hasira pekee kungepunguza maana.
- issue: Nguvu ya swali la pili
  choice: Kulitoa kama swali la balagha linalotarajia jibu la kukataa
  alternative: Sisi si wenye nguvu kuliko yeye
  rationale: Muundo wa Kigiriki ni swali, hivyo tafsiri inadumisha mvutano na changamoto yake ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
