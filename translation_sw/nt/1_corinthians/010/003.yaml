  text: Na wote walikula chakula kilekile cha kiroho[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chakula kilekile cha kimuujiza.” Huenda usemi huu unadokeza mana ya jangwani na pia ukawa na maana ya kiishara katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha sentensi hii na yaliyotangulia.
- source_word: πάντες
  choice: wote
  rationale: Kinarejelea kundi lote la Waisraeli na kuhifadhi msisitizo wa ujumla.
- source_word: τὸ αὐτὸ
  choice: kilekile
  rationale: Hueleza kwamba wote walishiriki chakula kile kimoja; ni usemi wa asili na wazi katika Kiswahili.
- source_word: πνευματικὸν
  choice: cha kiroho
  rationale: Huhifadhi upana wa neno la Paulo bila kulifafanua kwa namna finyu kuwa 'cha Roho' au kwa namna ya kufasiri zaidi kuwa 'cha kimuujiza'.
- source_word: βρῶμα
  choice: chakula
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno linalomaanisha chakula.
- source_word: ἔφαγον
  choice: walikula
  rationale: Huwasilisha kwa kawaida tendo la wakati uliopita na kukubaliana na kiima cha wingi.
theological_decisions:
- issue: Maana ya “chakula cha kiroho” katika mfano wa Paulo kuhusu safari ya jangwani
  choice: Kudumisha “chakula ... cha kiroho” katika matini kuu bila kukitaja wazi kuwa mana wala kueleza uhusiano wa kisakramenti.
  alternative: “chakula cha kimuujiza,” “chakula kilichotolewa na Roho,” au kutaja mana moja kwa moja
  rationale: Inaelekea Paulo anadokeza mana, lakini lugha yake pia ina nguvu ya kiishara katika muktadha. Tafsiri hii huhifadhi maana pana na mvutano wa kiteolojia bila kuingiza ufafanuzi finyu ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo “chakula kilekile cha kiroho” ni wa asili na huhifadhi msisitizo wa τὸ αὐτό.
