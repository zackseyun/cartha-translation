id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: sw
  text: Kwa maana sitaki msijue, ndugu[a], kwamba baba zetu wote walikuwa chini ya lile wingu, na wote walipita katika bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiyunani lililotafsiriwa “ndugu” ni wingi wa kiume, lakini linaweza kulielekea kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: sitaki mkose kujua
  rationale: Huhifadhi muundo wa Kiyunani wenye ukanushi na maana ya msemo wa kawaida wa Paulo, huku ikiwa ya asili na wazi katika Kiswahili cha sasa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi hii inatoa sababu au ufafanuzi unaounganika na hoja iliyotangulia.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni mwito wa kawaida kwa waumini na unaweza kuwahusu wanaume na wanawake bila kupoteza dhana ya kifamilia ya neno la Kiyunani.
- source_word: οἱ πατέρες ἡμῶν
  choice: baba zetu
  rationale: Huhifadhi lugha ya kifamilia ya Paulo na jinsi anavyowaunganisha wasomaji wake na historia ya Israeli, badala ya kuitafsiri kwa ujumla kuwa “mababu zetu.”
- source_word: πάντες
  choice: wote
  rationale: Kurudiwa kwa neno hili mara mbili kumehifadhiwa kwa sababu ni muhimu kwa msisitizo wa hoja inayoendelea.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: walikuwa chini ya lile wingu
  rationale: Huhifadhi taswira ya kutoka Misri; kiashiria “lile” kinaonyesha wingu maalumu linalojulikana katika simulizi hilo bila kuongeza ufafanuzi ndani ya matini.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: walipita katikati ya bahari
  rationale: Huwasilisha mwendo wa kupitia baharini kwa Kiswahili cha kawaida na kuhifadhi taswira ya tukio la kutoka Misri.
theological_decisions:
- issue: Mwito ἀδελφοί kwa kusanyiko lenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wanaume na wanawake
  rationale: “Ndugu” ni neno la asili la Kiswahili linaloweza kutaja jumuiya nzima ya waumini. Tanbihi inaweka wazi wigo wa mwito huo bila kuingiza maneno ya ziada katika matini.
- issue: Kujitambulisha kwa kanisa linalojumuisha watu wa mataifa na Israeli katika οἱ πατέρες ἡμῶν
  choice: baba zetu
  alternative: mababu zetu
  rationale: “Baba zetu” huhifadhi kwa karibu lugha ya kifamilia na nguvu ya kauli ya Paulo inayowaingiza wasomaji katika historia ya Israeli; tafsiri pana zaidi “mababu zetu” ingeweza kupunguza mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi uhusiano wa kisababu, ukanushi wa msemo wa Paulo, na kurudiwa kwa “wote,” huku ukibaki wazi kwa msomaji wa kawaida.
