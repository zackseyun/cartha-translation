  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: sw
  text: La, bali vitu wanavyovitoa kama dhabihu, huvitolea pepo wala si kwa Mungu; nami sitaki mje kuwa washirika wa pepo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: La, bali
  rationale: Katika muktadha huu Paulo anasahihisha dhana inayoweza kutokana na mstari uliotangulia. “La, bali” huonyesha kwa kawaida nguvu hiyo ya kukataa na kusahihisha.
- source_word: ἃ θύουσιν
  choice: vitu wanavyovitoa dhabihu
  rationale: Kiwakilishi cha uhusiano cha wingi kisicho na jinsia kinarejelea kwa ujumla vitu vinavyotolewa sadaka; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: θύουσιν
  choice: wanavitolea ... dhabihu
  rationale: Kitenzi hiki katika mazingira ya ibada humaanisha kutoa kitu kama dhabihu. Muundo huu huhifadhi maana ya kiibada na pia walengwa wa dhabihu.
- source_word: δαιμονίοις
  choice: pepo
  rationale: Katika matumizi ya Agano Jipya neno hili humaanisha viumbe waovu wa kiroho, si miungu midogo isiyoegemea upande wowote. “Pepo” ndilo neno la kawaida la kibiblia katika Kiswahili.
- source_word: καὶ οὐ θεῷ
  choice: wala si Mungu
  rationale: Huhifadhi ukanushaji wenye msisitizo na tofauti kati ya pepo na Mungu wa kweli bila kuingiza wazo la “mungu fulani.”
- source_word: οὐ θέλω δὲ
  choice: nami sitaki
  rationale: “Nami” huendeleza hoja kwa ulaini huku ikihifadhi ugeuzi mdogo wa δέ na msisitizo wa mtazamo wa Paulo.
- source_word: κοινωνοὺς
  choice: washirika
  rationale: “Washirika” huwasilisha kushiriki au kuwa na ushirika katika jambo, si kuwa karibu kijamii tu. Linafaa pia kwa hoja ya ushiriki katika mistari 16–18.
- source_word: τῶν δαιμονίων
  choice: wa pepo
  rationale: Muundo wa kawaida wa Kiswahili “washirika wa pepo” huonyesha ushirika unaohusiana nao bila kuamua zaidi ikiwa ni umiliki au utii kamili.
- source_word: γίνεσθαι
  choice: kuwa
  rationale: Katika Kiswahili, baada ya “sitaki ninyi,” kitenzi “kuwa” huwasilisha kwa kawaida kuingia au kujikuta katika hali hiyo; “kuwa washirika” ni fasaha kuliko “kuwa washirika wapya” au muundo mzito wa “kuja kuwa.”
theological_decisions:
- issue: Asili ya dhabihu za kipagani
  choice: Dhabihu hizo zinatolewa kwa pepo, wala si kwa Mungu.
  alternative: Kauli hiyo ni tamathali tu kuhusu maana ya kijamii ya karamu za sanamu.
  rationale: Tofauti ya wazi kati ya pepo na Mungu imehifadhiwa bila kuipunguza wala kuongeza maelezo yasiyomo katika mstari.
- issue: Nguvu ya κοινωνοὺς τῶν δαιμονίων
  choice: Ushirika halisi wa kushiriki pamoja na pepo.
  alternative: Kuhusiana kijamii tu na waabudu sanamu, au kujitoa kikamilifu kwa pepo.
  rationale: “Washirika wa pepo” huhifadhi uzito wa ushiriki katika muktadha bila kuufanya uwe uhusiano wa kijamii tu au kuuzidisha kuwa utii kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Vitu wanavyovitoa dhabihu” hufafanua kirai cha Kigiriki bila kutaja kwa kubuni watu wanaotoa dhabihu. Hakuna tanbihi iliyohitajika kwa kuwa “washirika wa pepo” huhifadhi kwa kutosha upeo wa maana wa κοινωνός.
