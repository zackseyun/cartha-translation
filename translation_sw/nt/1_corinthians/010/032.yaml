  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: sw
  text: Msiwe kikwazo kwa Wayahudi, Wagiriki,[a] wala kwa kanisa la Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “Wagiriki” huenda linamaanisha kwa upana watu wasio Wayahudi katika mazingira ya Paulo; hata hivyo, matini ya Kigiriki inasema “Wagiriki.”
    reason: cultural_note
  - marker: b
    text: 'Au: “Msiwakwaze Wayahudi, Wagiriki, wala kanisa la Mungu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: msiwe sababu ya kukwaza
  rationale: Katika muktadha huu kivumishi hiki kinahusu kutoleta kikwazo au kuwasababisha wengine waanguke; usemi huu wa Kiswahili unaweka wazi maana ya kimahusiano bila kuibadili kuwa dai pana la kutokuwa na lawama.
- source_word: γίνεσθε
  choice: msiwe
  rationale: Amri ya wakati uliopo inaelekeza mwenendo unaoendelea. Muundo hasi unaambatana kwa kawaida na kirai ‘sababu ya kukwaza’ katika Kiswahili.
- source_word: Ἰουδαίοις
  choice: Wayahudi
  rationale: Hapa ni kundi la watu wa Kiyahudi, si wakazi wa Yudea pekee.
- source_word: Ἕλλησιν
  choice: Wagiriki
  rationale: Neno la Kigiriki linataja Wagiriki moja kwa moja; maana yake pana inayowezekana ya wasio Wayahudi inaelezwa katika tanbihi badala ya kubadilisha matini kuu.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: kanisa la Mungu
  rationale: Huu ni usemi wa kawaida na sahihi wa Kiswahili kwa jumuiya ya waumini iliyo ya Mungu.
theological_decisions:
- issue: Mgawanyo wa makundi katika himizo la Paulo
  choice: 'Kuyahifadhi makundi matatu yaliyotajwa: Wayahudi, Wagiriki, na kanisa la Mungu.'
  alternative: Kutafsiri ‘Wagiriki’ kwa ujumla kuwa ‘watu wa mataifa’ au kueleza himizo hili kuwa mkakati wa kimisheni pekee.
  rationale: Aya yenyewe inataja makundi hayo matatu. Tafsiri haiyapanui wala kuyafinya, na haifanyi kusudi la himizo kuwa maalumu kuliko matini inavyosema.
- issue: Maana ya kutokukwaza
  choice: Kutafsiri kama kutokuwa sababu ya wengine kukwazika au kuanguka.
  alternative: ‘Msiwe na lawama’ au ‘msiwaudhi.’
  rationale: Muktadha wa karibu unahusu jinsi mwenendo wa mtu unavyowaathiri wengine. ‘Kuwaudhi’ peke yake ni finyu mno, huku ‘kutokuwa na lawama’ kunaweza kuficha wazo la kuwa kikwazo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. ‘Msiwe sababu ya kukwaza’ ni cha asili zaidi kuliko tafsiri ya neno kwa neno, huku kikidumisha maana ya kuzuia mwenendo unaowafanya wengine wajikwae.
