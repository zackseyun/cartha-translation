base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: sw
  text: Kwa kuwa mkate ni mmoja[a], sisi tulio wengi ni mwili mmoja, kwa maana sisi sote tunashiriki mkate huo mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate mmoja mzima,” hapa na mwishoni mwa aya. Neno la Kigiriki ἄρτος linaweza kumaanisha mkate kama chakula au mkate mmoja mzima, jambo linaloweza kusisitiza picha ya watu wengi wakishiriki kutoka chanzo kimoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa kuwa
  rationale: Huanzisha sababu inayofafanua kauli iliyotangulia; ni ya kawaida na yenye hadhi katika Kiswahili cha sasa.
- source_word: εἷς ἄρτος
  choice: mkate ni mmoja
  rationale: Huhifadhi maana ya ἄρτος kama mkate na kusisitiza umoja wake; mpangilio huu ni wa asili zaidi katika Kiswahili kuliko 'mkate mmoja' katika kishazi hiki.
- source_word: ἓν σῶμα
  choice: mwili mmoja
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana ya kijamii na uzito wa kitheolojia bila kuufafanua kupita kiasi.
- source_word: οἱ πολλοί
  choice: sisi tulio wengi
  rationale: Huhifadhi tofauti kati ya wingi wa waamini na umoja wa mwili, huku ikiwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha kwamba kishazi cha pili kinaeleza sababu ya kishazi cha kwanza.
- source_word: πάντες
  choice: sote
  rationale: Husisitiza ushiriki wa kundi zima na kuafikiana kwa kawaida na kiwakilishi 'sisi'.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: mkate huo mmoja
  rationale: Katika muundo pamoja na μετέχομεν, ἐκ huonyesha chanzo au kile kinachoshirikiwa. Kiswahili cha asili hakihitaji kutafsiri kihusishi hicho neno kwa neno; 'huo' hurejelea wazi mkate uliotajwa.
- source_word: μετέχομεν
  choice: tunashiriki
  rationale: Hutoa maana ya kushiriki kwa pamoja na inafaa katika muktadha wa kula bila kutumia lugha ya dhehebu.
theological_decisions:
- issue: Uhusiano kati ya mkate mmoja na mwili mmoja
  choice: Kauli inadumisha uhusiano wa Paulo kati ya kushiriki mkate mmoja na umoja wa waamini bila kubainisha fundisho maalumu la kidhehebu kuhusu Meza ya Bwana.
  alternative: Kutafsiri kwa namna inayosisitiza ama ishara ya ukumbusho pekee, ama kwamba ushirika huo unasababisha umoja kwa maana maalumu ya kisakramenti.
  rationale: Kigiriki kinaunganisha kuwa kwa wengi mwili mmoja na wote kushiriki mkate mmoja, lakini tafsiri haipaswi kutatua mijadala ya baadaye kuhusu asili ya Ekaristi ambayo aya yenyewe haiamui wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. 'Tunashiriki mkate' ni usemi wa asili unaohifadhi maana ya ushiriki wa pamoja; tanbihi inaweka wazi uwezekano wa mkate mmoja mzima.
