lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Neno hili linawahusu kwa pamoja Waisraeli wote wanaotajwa, na linahifadhi msisitizo unaorudiwa katika muktadha.
- source_word: εἰς τὸν Μωϋσῆν
  choice: wawe wa Musa
  rationale: Hii ni Kiswahili cha asili kinachoonyesha kuhusishwa na Musa au kuwa chini ya uwakilishi wake, bila kufafanua zaidi fumbo la usemi wa Paulo. Tanbihi inahifadhi muundo halisi wa Kigiriki, ‘katika Musa.’
- source_word: ἐβαπτίσαντο
  choice: wakabatizwa
  rationale: Ingawa kitenzi cha Kigiriki kina umbo la kati, maana yake hapa inatolewa kwa kawaida katika Kiswahili kwa umbo la kutendwa. ‘Wakabatizwa’ pia inahifadhi matumizi ya Paulo yanayolinganisha tukio la Kutoka na ubatizo.
- source_word: ἐν τῇ νεφέλῃ
  choice: katika wingu
  rationale: ‘Katika’ inahifadhi taswira ya Kutoka na kutofafanuliwa kikamilifu kwa ἐν kama eneo, njia, au uhusiano.
- source_word: ἐν τῇ θαλάσσῃ
  choice: katika bahari
  rationale: Paulo ametumia ἐν, si kihusishi chenye maana ya ‘kupitia.’ Tafsiri hii pia inadumisha ulinganifu wa ‘katika wingu’ na ‘katika bahari.’
theological_decisions:
- issue: Maana ya Israeli ‘kubatizwa katika Musa’
  choice: Kutumia ‘wakabatizwa wawe wa Musa’ huku maana halisi zaidi ikiwekwa katika tanbihi
  alternative: wakabatizwa katika Musa; wakabatizwa ili wahusishwe na Musa; wakabatizwa kuwa wafuasi wa Musa
  rationale: Chaguo hili linatoa Kiswahili kinachoeleweka huku likiacha wazi ikiwa Paulo anamaanisha utambulisho, uwakilishi, au uaminifu kwa Musa. Halipunguzi ulinganifu wa kitipolojia kuwa maelezo ya dhehebu fulani.
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima, na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. ‘Wawe wa Musa’ ni ya asili zaidi kuliko ‘katika Musa,’ lakini tanbihi inadumisha muundo usio wa kawaida wa Kigiriki na mvutano wake wa kitheolojia.
