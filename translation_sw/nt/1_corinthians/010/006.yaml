base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: sw
  text: Mambo haya yakawa mifano kwetu[a], ili tusiwe watu wanaotamani mambo maovu, kama wao pia walivyoyatamani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vielelezo kwetu” au “aina kwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Mambo haya
  rationale: Kiwakilishi hiki cha wingi kisicho na jinsia kinarejelea yaliyotokea jangwani yaliyosimuliwa kabla; “mambo haya” ni wazi bila kuongeza ufafanuzi usio katika matini.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno maalumu
  rationale: Hapa kinaendeleza na kuelekeza hoja. Mtiririko wa Kiswahili hauhitaji “basi,” “lakini,” au “sasa,” ambavyo vingesisitiza maana isiyo lazima.
- source_word: τύποι
  choice: mifano
  rationale: Katika muktadha huu neno linaonyesha matukio yaliyotangulia kuwa vielelezo vya kutuonya. “Mifano” ni ya kawaida na haifungi maana katika istilahi maalumu ya kiteolojia.
- source_word: ἡμῶν
  choice: kwetu
  rationale: Hutoa kwa Kiswahili fasaha maana ya mifano yenye umuhimu na matumizi kwa jumuiya inayozungumziwa.
- source_word: ἐγενήθησαν
  choice: yalikuwa
  rationale: Katika Kiswahili, “yalikuwa mifano kwetu” huonyesha kwa kawaida kwamba matukio hayo yalikuja kuwa na kazi hiyo; “yalifanyika” lingeweza kusikika kana kwamba yenyewe yalitokea tu.
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: ili tusiwe
  rationale: Huhifadhi muundo wa kusudi au tokeo na pia kitenzi cha kuwapo kilicho katika Kigiriki.
- source_word: ἐπιθυμητὰς κακῶν
  choice: watu wanaotamani mambo maovu
  rationale: Nomino ἐπιθυμητάς ni watu wenye kutamani, na κακῶν ni vitu vinavyotamaniwa. Tafsiri hii huhifadhi muundo huo bila kuifanya tamaa iwe ya kingono pekee.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: kama wao walivyoyatamani
  rationale: Huhifadhi ulinganisho, nguvu ya “wao pia” kwa muktadha, na mwangwi wa mzizi wa kutamani; kiambishi “-ya-” hurejelea mambo maovu.
theological_decisions:
- issue: Maana ya τύποι kuhusu matukio ya Israeli jangwani
  choice: mifano
  alternative: vielelezo; mifumo; mifano ya kinabii
  rationale: Hoja ya karibu ni onyo la kimaadili kwa waamini. “Mifano” huhifadhi kazi hiyo ya mafundisho bila kuingiza mfumo maalumu wa taipolojia, huku tanbihi ikihifadhi upana wa neno.
- issue: Nguvu na upeo wa lugha ya ἐπιθυμία
  choice: kutamani
  alternative: kutamani sana; kutamani kwa tamaa mbaya
  rationale: Neno linahusu hamu mbaya kwa upana, si lazima tamaa ya kingono. “Kutamani” pamoja na “mambo maovu” huhifadhi uzito wa kimaadili bila kuipunguza maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “tusiwe watu wanaotamani” umehifadhiwa ili kuakisi nomino ya Kigiriki, na tanbihi [a] imewekwa mara moja katika matini kuu.
