  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: sw
  text: Wala tusimjaribu Masihi[a], kama baadhi yao walivyomjaribu, nao walikuwa wakiangamizwa na nyoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Bwana” badala ya “Masihi.”
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Wala tusi-
  rationale: Inaendeleza mfululizo wa makatazo na kuhifadhi nguvu ya himizo la nafsi ya kwanza wingi.
- source_word: ἐκπειράζωμεν
  choice: tusimjaribu
  rationale: Kitenzi hiki hapa kinamaanisha kumweka mtu katika jaribu lisilofaa au kumpima kwa ukaidi; ‘kumjaribu’ ni usemi wa kawaida na unaoeleweka katika muktadha huu.
- source_word: τὸν Χριστόν
  choice: Masihi
  rationale: Χριστός limetumika kama cheo; ‘Masihi’ huhifadhi maana ya cheo hicho katika Kiswahili badala ya kukifanya jina tu.
- source_word: καθώς
  choice: kama
  rationale: Linaanzisha ulinganisho na tendo la baadhi ya Waisraeli jangwani.
- source_word: τινες αὐτῶν
  choice: baadhi yao
  rationale: Ni usemi wa kawaida unaorejelea watu fulani miongoni mwa kundi lililotajwa.
- source_word: ἐπείρασαν
  choice: walivyomjaribu
  rationale: Hurejelea kitendo cha kihistoria na kudumisha ulinganisho wa moja kwa moja na katazo la kwanza; kiwakilishi cha mtendewa kinadokezwa na sentensi ya Kigiriki.
- source_word: ὑπὸ τῶν ὄφεων
  choice: na nyoka
  rationale: ‘Nyoka’ ni neno la kawaida na sahihi kwa ὄφεις katika Kiswahili cha sasa.
- source_word: ἀπώλλυντο
  choice: walikuwa wakiangamizwa
  rationale: Muundo huu unaakisi hali ya tendo lililokuwa likiendelea iliyo katika wakati usiotimilifu wa Kigiriki, bila kulifanya tukio la mara moja tu.
theological_decisions:
- issue: Mhusika anayetajwa na tofauti ya maandishi katika τὸν Χριστόν
  choice: Masihi
  alternative: Bwana
  rationale: Maandishi ya SBLGNT yana Χριστόν, kwa hiyo tafsiri kuu inasema ‘Masihi’ na kuacha uzito wa kauli ya Paulo usibadilishwe. Kwa kuwa baadhi ya hati zina ‘Bwana,’ tofauti hiyo muhimu imehifadhiwa katika tanbihi badala ya kutatuliwa kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘walikuwa wakiangamizwa’ umechaguliwa kwa makusudi ili kuhifadhi hali endelevu ya kitenzi cha Kigiriki. Hakuna tanbihi ya ‘serpents’ iliyoongezwa kwa sababu Kiswahili cha kawaida hakina tofauti ya lazima ya kimaana hapa zaidi ya ‘nyoka.’
