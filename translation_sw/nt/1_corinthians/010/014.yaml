  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: sw
  text: Kwa hiyo, wapendwa wangu, ikimbieni ibada ya sanamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuabudu sanamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya kimantiki.
- source_word: ἀγαπητοί μου
  choice: wapendwa wangu
  rationale: Ni mwito wa upendo kwa wingi; “wapendwa wangu” huhifadhi ukaribu na uzito wa namna ya Paulo ya kuwahutubia wasomaji.
- source_word: φεύγετε
  choice: ikimbieni
  rationale: Ni amri ya nafsi ya pili wingi yenye msisitizo wa kujiepusha haraka na hatari. “Ikimbieni” ni kali kuliko “jiepusheni” na huhifadhi taswira ya kukimbia.
- source_word: ἀπὸ
  choice: —
  rationale: Maana ya kujitenga iliyo katika ἀπὸ imejumuishwa kiasili katika kitenzi cha Kiswahili “ikimbieni”; kuongeza “kutoka kwa” kungefanya sentensi isisikike ya kawaida.
- source_word: τῆς εἰδωλολατρίας
  choice: ibada ya sanamu
  rationale: Neno εἰδωλολατρία humaanisha kuabudu au kutumikia sanamu. “Ibada ya sanamu” ni wazi kwa wasomaji wa kawaida na haipunguzi katazo kuwa hisia ya ndani tu.
theological_decisions:
- issue: Upeo wa katazo
  choice: Amri ya moja kwa moja ya kukimbia ibada ya sanamu, ikijumuisha kushiriki katika matendo yanayohusiana nayo
  alternative: Onyo jembamba dhidi ya kuwa na moyo wa ndani unaozipenda sanamu pekee
  rationale: Katika muktadha wa karibu Paulo anaonya kuhusu kushiriki katika milo na matendo ya ibada za kipagani. Tafsiri ya jumla “ibada ya sanamu” huhifadhi upeo wa neno la Kigiriki bila kulibana kuwa mtazamo wa ndani tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Ikimbieni” huhifadhi uzito wa amri na dharura ya Kigiriki, huku “wapendwa wangu” ikihifadhi sauti ya upendo.
