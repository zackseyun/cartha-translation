lexical_decisions:
- source_word: ἀλλ’
  choice: Hata hivyo
  rationale: Inaonyesha tofauti kubwa kati ya mapendeleo yaliyotajwa katika mistari iliyotangulia na hukumu iliyowapata; ni kauli ya kawaida na yenye mkazo wa kutosha katika Kiswahili.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: hakupendezwa na walio wengi kati yao
  rationale: Muundo huu unaonyesha wazi kwamba ni wengi zaidi, si tu watu wengi, huku ukisomeka kwa kawaida pamoja na kitenzi ‘kupendezwa na’.
- source_word: ηὐδόκησεν
  choice: hakupendezwa
  rationale: Huwasilisha maana ya kutofurahia au kutoridhishwa nao bila kuongeza sababu ambayo haikutajwa wazi katika kifungu hiki.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja ya nomino iliyo kiima cha sentensi.
- source_word: κατεστρώθησαν
  choice: waliangushwa
  rationale: Inaonyesha kwamba walianguka wakafa, na inadumisha nguvu ya onyo na hukumu katika muktadha bila kuongeza maelezo yasiyosemwa wazi.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaanzisha maelezo yanayothibitisha kwamba Mungu hakupendezwa nao.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: Ni usemi wa kawaida wa kibiblia kwa eneo la safari ya Israeli baada ya kutoka Misri.
theological_decisions:
- issue: Aina ya hukumu inayoelezwa na κατεστρώθησαν
  choice: Waliangushwa jangwani katika hukumu iliyosababisha vifo vyao.
  alternative: Miili yao ililazwa chini au kutandazwa jangwani, bila kusisitiza moja kwa moja upande wa hukumu.
  rationale: Muktadha wa onyo la Paulo unaonyesha matokeo ya kutompendeza Mungu, lakini tanbihi inadumisha taswira halisi na upana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walio wengi kati yao’ limetumiwa ili kuhifadhi maana ya idadi iliyo kubwa zaidi; ‘jangwani’ inadumisha mwangwi wa simulizi la Kutoka.
