  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: sw
  text: Ikiwa mmoja wa wasioamini anawaalika, nanyi mkitaka kwenda, kuleni chochote mtakachowekewa, bila kuuliza maswali yoyote[a] kwa sababu ya dhamiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kuchunguza chochote” au “bila kufanya uchunguzi wowote.” Maana yake ni kutofanya uchunguzi kuhusu chakula hicho kimetoka wapi.
    reason: lexical_alternative
  - marker: b
    text: Neno “dhamiri” linafafanuliwa zaidi katika mstari unaofuata, ambako Paulo anatofautisha dhamiri ya mtu mwingine na dhamiri yako mwenyewe.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: wasioamini
  rationale: Huwataja kwa ufupi na kwa lugha ya kawaida watu wasio waamini, bila kuongeza uhasama au kubainisha zaidi kuliko Kigiriki.
- source_word: καλεῖ
  choice: akiwaalika
  rationale: Katika muktadha wa mlo, kitenzi hiki kina maana ya kumwalika mtu, si kumwita tu.
- source_word: θέλετε πορεύεσθαι
  choice: nanyi mkitaka kwenda
  rationale: Huhifadhi wazo la hiari au nia ya kukubali mwaliko pamoja na hali ya sharti.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: chochote mtakachowekewa
  rationale: Ni Kiswahili cha kawaida kwa chakula kinachowekwa mbele ya wageni, na hudumisha upeo mpana wa πᾶν.
- source_word: ἐσθίετε
  choice: kuleni
  rationale: Hutoa agizo la jumla kwa kundi la wasikilizaji kwa namna ya kawaida katika Kiswahili.
- source_word: μηδὲν ἀνακρίνοντες
  choice: bila kuuliza-uliza
  rationale: Katika muktadha huu maana yake ni kutofanya uchunguzi kuhusu asili ya chakula; uradidi unaonyesha kuulizia kwa kusudi la kuchunguza.
- source_word: διὰ τὴν συνείδησιν
  choice: kwa sababu ya dhamiri
  rationale: Huwasilisha dhamiri kuwa sababu au jambo linalozingatiwa, huku ikiacha wazi ni dhamiri ya nani mpaka mstari unaofuata.
theological_decisions:
- issue: Maana ya συνείδησις katika muktadha
  choice: Neno “dhamiri” limeachwa bila kubainisha ni ya nani katika mstari huu.
  alternative: Kulifafanua moja kwa moja kuwa dhamiri ya mwamini au dhamiri ya mtu mwingine.
  rationale: Kigiriki cha mstari huu hakimtaji mwenye dhamiri; mstari unaofuata ndio unaotoa ufafanuzi zaidi. Kutobainisha hapa kunahifadhi utata na mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi katika “akiwaalika,” “mkitaka,” na “kuleni” unaakisi kwamba Paulo anazungumza na kundi, huku “mtu yeyote” ikidumisha mhusika mmoja wa sharti.
