id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: sw
  text: Hakuna jaribu lililowapata isipokuwa lile ambalo huwapata wanadamu[a]. Lakini Mungu ni mwaminifu; hatawaruhusu mjaribiwe kupita mnavyoweza. Bali pamoja na jaribu hilo atatoa pia njia ya kutokea[c], ili mweze kulistahimili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa jaribu la kibinadamu,” yaani, jaribu linalowapata wanadamu kwa kawaida.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kigiriki yaliyotafsiriwa “jaribu” na “mjaribiwe” yanaweza pia kutafsiriwa “mtihani” na “mpimwe.”
    reason: lexical_alternative
  - marker: c
    text: Au, “njia ya kuponyoka” au “matokeo.” Hapa njia anayoitoa Mungu huwawezesha kustahimili jaribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: jaribu / mjaribiwe
  rationale: Maneno haya yanaweza kumaanisha kishawishi cha kutenda dhambi au kupimwa kwa njia ya majaribu. Muktadha wa maonyo dhidi ya tamaa mbaya na ibada ya sanamu unaunga mkono “jaribu,” huku tanbihi ikihifadhi uwezekano wa maana ya “mtihani.”
- source_word: εἴληφεν
  choice: lililowapata
  rationale: Kauli hii inaonyesha jaribu lililowafikia na kuwakamata wasomaji; “lililowapata” ni Kiswahili cha kawaida na cha asili bila kupunguza uzito wa kitenzi.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: isipokuwa lile ambalo huwapata wanadamu
  rationale: ἀνθρώπινος hueleza jambo la kibinadamu, lisilo la pekee au linalozidi hali ya wanadamu. Tafsiri hii ni wazi na jumuishi kwa kawaida katika Kiswahili.
- source_word: πιστός
  choice: mwaminifu
  rationale: “Mwaminifu” huonyesha kwamba Mungu anategemeka na hutimiza ahadi yake.
- source_word: οὐκ ἐάσει
  choice: hatawaacha
  rationale: Kitenzi ἐάω humaanisha kuruhusu au kuacha jambo litokee; “hatawaacha” ni cha asili katika muundo huu wa Kiswahili.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: kupita mnavyoweza kustahimili
  rationale: Tafsiri hii huonyesha mpaka wa uwezo wao katika muktadha wa kubeba jaribu, bila kudai kwamba uwezo huo ni wa kujitegemea mbali na msaada wa Mungu.
- source_word: ποιήσει
  choice: atatoa
  rationale: Ingawa ποιέω kimsingi ni “kufanya,” katika uhusiano wake na ἔκβασις inaeleza tendo la Mungu la kuandaa au kutoa njia ya kutokea.
- source_word: σὺν τῷ πειρασμῷ
  choice: pamoja na jaribu hilo
  rationale: Huhifadhi wazo kwamba mpango wa Mungu unaambatana na jaribu, si lazima kwamba jaribu linaondolewa mara moja.
- source_word: ἔκβασιν
  choice: njia ya kutokea
  rationale: ἔκβασις inaweza kuwa njia ya kutoka, kuponyoka, au matokeo. “Njia ya kutokea” ni ya kawaida na inaendana na lengo linalofuata la kustahimili.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: ili mweze kulistahimili
  rationale: Muundo huu unaweza kueleza kusudi au matokeo. “Ili” huhifadhi uhusiano huo, na “kulistahimili” huonyesha kubaki imara chini ya jaribu.
theological_decisions:
- issue: Maana ya πειρασμός na πειρασθῆναι
  choice: “Jaribu” na “mjaribiwe” katika matini kuu
  alternative: “Mtihani” na “mpimwe”
  rationale: Muktadha wa karibu unahusu hatari ya tamaa na ibada ya sanamu, hivyo maana ya kishawishi cha dhambi ni muhimu. Hata hivyo, maneno ya Kigiriki pia yanaweza kueleza kupimwa au taabu; tanbihi inalinda upana huo bila kudai kwamba Mungu huwashawishi watu watende uovu.
- issue: Uhusiano kati ya njia ya kutokea na kustahimili
  choice: Njia hiyo hutolewa ili waamini waweze kulistahimili jaribu
  alternative: Njia ya kuponyoka inayomaanisha kuondolewa mara moja katika jaribu
  rationale: Kifungu cha mwisho kinaunganisha ἔκβασις na uwezo wa kustahimili. Tafsiri haifanyi “njia ya kutokea” iwe ahadi ya kuondolewa mara moja, bali huhifadhi mkazo wa maandiko juu ya msaada wa Mungu unaowezesha uvumilivu.
- issue: Kiwango cha jaribu ambacho Mungu huruhusu
  choice: “Kupita mnavyoweza kustahimili”
  alternative: “Zaidi ya uwezo wenu”
  rationale: Kauli hiyo inaweka kikomo kwa kile Mungu atakachoruhusu, lakini haifafanui uwezo huo kuwa wa asili pekee; sentensi nzima inautia ndani ya uaminifu na utoaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili baada ya tamko la uaminifu wa Mungu ili kuboresha usomaji. Viwakilishi vya wingi vinahifadhi ὑμᾶς na δύνασθε. Alama zote za tanbihi [a], [b], na [c] zimo katika matini kuu.
