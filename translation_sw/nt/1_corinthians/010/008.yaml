id: 1CO.10.8
reference: 1 Corinthians 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: sw
  text: Wala tusifanye uasherati, kama baadhi yao walivyofanya uasherati, na watu elfu ishirini na tatu wakaanguka[a] kwa siku moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakafa” au “wakauawa.” Kigiriki kinasema “wakaanguka,” usemi uliotumiwa mara nyingi kurejelea kifo chini ya hukumu.
    reason: lexical_alternative
  - marker: b
    text: Hesabu 25:9 inataja watu elfu ishirini na nne. Hapa Paulo anasema kwamba elfu ishirini na tatu walianguka “kwa siku moja.” Huenda idadi hiyo inawahusu waliokufa siku hiyo, tofauti na jumla kubwa zaidi, lakini tafsiri inadumisha maneno ya Paulo bila kuoanisha idadi hizo.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Wala tusifanye
  rationale: “Wala” huunganisha katazo hili na maonyo yaliyotangulia, huku hali ya kuhimiza ya kitenzi ikiwakilishwa kwa “tusifanye.”
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: tusifanye uasherati / walivyofanya uasherati
  rationale: “Kufanya uasherati” ni usemi wa Kiswahili unaoeleweka kwa tabia ya kingono iliyo kinyume cha maadili; kurudia usemi huakisi urudiaji wa vitenzi vyenye mzizi mmoja katika Kigiriki.
- source_word: καθώς
  choice: kama
  rationale: Huonyesha ulinganisho kati ya onyo kwa waamini na mfano wa baadhi ya Waisraeli.
- source_word: τινες αὐτῶν
  choice: baadhi yao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, inayorejelea baadhi ya watu wa kizazi cha Israeli jangwani.
- source_word: ἔπεσαν
  choice: wakaanguka
  rationale: Huhifadhi picha halisi ya kitenzi πίπτω, ambacho katika muktadha huu kinaashiria kufa chini ya hukumu bila kufanya maana hiyo ya kimuktadha kuwa tafsiri pekee.
- source_word: μιᾷ ἡμέρᾳ
  choice: kwa siku moja
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba tukio hilo lilitokea ndani ya muda wa siku moja.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: watu elfu ishirini na tatu
  rationale: Hutoa moja kwa moja idadi iliyo katika maandishi ya Kigiriki; “watu” huongezwa kwa uwazi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uhusiano na idadi iliyo katika Hesabu 25:9
  choice: Kudumisha “elfu ishirini na tatu” katika matini kuu bila kuoanisha idadi hizo.
  alternative: Kubadili kuwa “elfu ishirini na nne,” au kueleza moja kwa moja kwamba idadi moja ni ya siku hiyo na nyingine ni jumla yote.
  rationale: Maandishi ya Kigiriki ya 1 Wakorintho yanasema wazi “elfu ishirini na tatu.” Tafsiri inapaswa kuhifadhi maneno ya Paulo na kuacha mvutano wa kiidadi uonekane; pendekezo lolote la kuoanisha linafaa kubaki katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa “kufanya uasherati” umehifadhiwa kwa sababu ni wa kimakusudi katika Kigiriki. Alama za tanbihi zimewekwa baada ya “wakaanguka” na mwisho wa taarifa ya idadi ili zilingane na maudhui ya tanbihi.
