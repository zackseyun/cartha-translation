  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: sw
  text: Kuleni chochote kinachouzwa katika soko la nyama, bila kuuliza maswali yoyote[a] kwa ajili ya dhamiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila kufanya uchunguzi wowote” au “bila kuchunguza chochote”; maana yake ni kutofuatilia historia au asili ya nyama hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: chochote kinachouzwa
  rationale: Kirai hiki cha Kigiriki kina maana ya jumla, yaani kila kitu kinachouzwa. “Chochote kinachouzwa” ni Kiswahili cha kawaida na kinahifadhi maana hiyo pana.
- source_word: ἐν μακέλλῳ
  choice: katika soko la nyama
  rationale: μάκελλον ni soko mahsusi la nyama, si soko la jumla. Tafsiri hii inaweka wazi mazingira yanayohusika katika hoja ya Paulo.
- source_word: ἐσθίετε
  choice: Kuleni
  rationale: Ni kitenzi cha amri katika nafsi ya pili wingi. “Kuleni” ni amri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: μηδὲν ἀνακρίνοντες
  choice: bila kuuliza maswali yoyote
  rationale: ἀνακρίνω inaweza kumaanisha kuuliza, kuchunguza, au kufanya uchunguzi. Katika muktadha huu kirai kinaelekea kwenye kutofuatilia historia au asili ya nyama; tafsiri hii ni wazi na ya kawaida bila kuingiza maelezo hayo moja kwa moja katika matini.
- source_word: διὰ τὴν συνείδησιν
  choice: kwa ajili ya dhamiri
  rationale: διά pamoja na hali ya accusative hapa huonyesha sababu au kusudi linalohusiana na dhamiri. “Kwa ajili ya dhamiri” huhifadhi uhusiano huo bila kutaja ni dhamiri ya nani.
theological_decisions:
- issue: Dhamiri inayorejelewa
  choice: dhamiri
  alternative: dhamiri yako; dhamiri ya mtu mwingine
  rationale: Matini ya Kigiriki inasema tu “dhamiri” ikiwa na kibainishi, bila kumtaja mwenye dhamiri katika mstari huu. Tafsiri haiongezi kimilikishi, hivyo inaacha muktadha unaofuata kufafanua rejeo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri ya wingi “Kuleni” ni ya moja kwa moja, na “soko la nyama” ni wazi kwa wasomaji wa kawaida. Uambiguous wa rejeo la “dhamiri” umehifadhiwa.
