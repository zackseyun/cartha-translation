id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: sw
  text: Hamwezi kunywa kikombe cha Bwana na kikombe cha mashetani; hamwezi kushiriki katika meza ya Bwana na meza ya mashetani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: hamwezi
  rationale: Huonyesha kutowezekana kwa namna ya moja kwa moja na ya kinathari, huku ikihifadhi nguvu ya kauli ya Paulo katika vifungu vyote viwili.
- source_word: ποτήριον
  choice: kikombe
  rationale: Ni neno la kawaida na la moja kwa moja, na linadumisha picha ya kunywa pamoja bila kuongeza ufafanuzi usio katika matini.
- source_word: κυρίου
  choice: cha Bwana / ya Bwana
  rationale: Hutafsiri genitivi kwa namna ya kawaida ya Kiswahili na kudumisha ulinganifu wa ‘kikombe’ na ‘meza.’
- source_word: πίνειν
  choice: kunywa
  rationale: Ni tafsiri ya kawaida ya infinitivi baada ya δύνασθε, bila kuingiza maana ya tendo linaloendelea.
- source_word: δαιμονίων
  choice: mashetani
  rationale: Ni neno linaloeleweka kwa urahisi katika Kiswahili cha kawaida kwa viumbe waovu wa kiroho wanaokusudiwa hapa, bila kuligeuza kuwa maelezo marefu.
- source_word: τραπέζης
  choice: meza
  rationale: Hudumisha picha halisi ya τραπέζης na maana yake ya ushirika wa kidini bila kuongeza neno la kufasiri kama ‘madhabahu.’
- source_word: μετέχειν
  choice: kushiriki katika
  rationale: Huonyesha kushiriki kwa kweli katika ushirika unaowakilishwa na meza, kwa lugha ya sasa na ya kawaida.
- source_word: καὶ
  choice: na
  rationale: Hudumisha muundo sambamba na msisitizo wa vipengele viwili visivyoweza kuunganishwa.
theological_decisions:
- issue: Uhusiano kati ya kushiriki meza ya Bwana na kushiriki ibada inayohusishwa na mashetani
  choice: Kauli ya kutopatana kabisa, iliyoonyeshwa kwa kurudia ‘hamwezi.’
  alternative: Onyo la balagha tu lisilodai kutopatana kwa kweli.
  rationale: Kurudiwa kwa οὐ δύνασθε katika vifungu sambamba kunaonyesha kutowezekana kwa kushiriki pande zote mbili, lakini tafsiri haiongezi maelezo ya kimadhehebu kuhusu namna ya ushirika huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo sambamba wa Kigiriki umehifadhiwa kwa kurudia ‘hamwezi,’ ‘kikombe,’ na ‘meza.’
