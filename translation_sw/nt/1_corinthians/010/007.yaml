  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: sw
  text: Wala msije mkawa waabudu sanamu, kama baadhi yao walivyokuwa; kama vile ilivyoandikwa, “Watu waliketi kula na kunywa, kisha wakasimama kucheza[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujifurahisha kwa sherehe.” Maneno haya yamenukuliwa kutoka Kutoka 32:6, ambako “kucheza” kunahusishwa na karamu ya Israeli ya kuabudu sanamu kuhusiana na ndama wa dhahabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Wala msi-
  rationale: Inaendeleza mfululizo wa makatazo katika muktadha, na ‘wala’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: msije mkawa waabudu sanamu
  rationale: ‘Waabudu sanamu’ ni tafsiri wazi ya εἰδωλολάτραι, huku ‘msije mkawa’ ikihifadhi wazo la γίνεσθε la kuingia katika hali au mwenendo huo, si kuwapo tu katika hali hiyo.
- source_word: τινες αὐτῶν
  choice: baadhi yao walivyokuwa
  rationale: Inarejelea baadhi ya Waisraeli katika simulizi la jangwani na kukamilisha kwa kawaida ulinganisho unaoanzishwa na καθώς.
- source_word: ὥσπερ γέγραπται
  choice: kama vile ilivyoandikwa
  rationale: Ni mtindo wa kawaida wa kutambulisha nukuu ya Maandiko na unadumisha nguvu ya ulinganisho pamoja na hali ya maandishi yanayoendelea kuwapo.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: Watu waliketi kula na kunywa
  rationale: Inafuata kwa karibu muundo wa nukuu na kutafsiri ὁ λαός kama jamii kwa pamoja.
- source_word: ἀνέστησαν
  choice: wakasimama
  rationale: Inawasilisha hatua inayofuata katika simulizi kwa Kiswahili cha asili bila kuongeza maelezo yasiyokuwamo.
- source_word: παίζειν
  choice: kucheza
  rationale: Inahifadhi maana ya msingi na mwangwi wa Kutoka 32:6, bila kuamua kimya kimya kwamba neno hilo lazima limaanishe sherehe za anasa; uzito wa kimuktadha unaelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kuwasilisha maana ya παίζειν katika dokezo la Kutoka 32:6
  choice: Kuhifadhi ‘kucheza’ katika matini kuu na kueleza uwezekano wa kufanya sherehe katika tanbihi.
  alternative: kufanya sherehe; kufanya sherehe za anasa
  rationale: Muktadha ni karamu ya kuabudu sanamu iliyohusiana na ndama wa dhahabu. Hata hivyo, παίζειν yenyewe inaweza kumaanisha kucheza au kujifurahisha. Matini kuu inadumisha upana huo wa maana, na tanbihi inaonyesha uzito wa kimuktadha bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msije mkawa’ ni onyo la kawaida linalohifadhi wazo la kuanza kuwa, na nukuu imepewa mtiririko rahisi bila kupoteza muundo wake wa kimaandiko.
