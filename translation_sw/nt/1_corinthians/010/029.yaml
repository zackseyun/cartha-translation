  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: sw
  text: Namaanisha dhamiri ya yule mwingine[a], si yako mwenyewe. Kwa maana, kwa nini uhuru wangu uhukumiwe na dhamiri ya mtu mwingine?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata Kigiriki kwa karibu zaidi, “si dhamiri yake mwenyewe, bali ya yule mwingine.” Muktadha unaunga mkono maana “si yako mwenyewe, bali ya mtu mwingine.”
    reason: lexical_alternative
  - marker: b
    text: Swali hili la balagha linaweza kueleweka ama kuwa changamoto ya Paulo mwenyewe, ama kuwa pingamizi analolitaja; Kigiriki hakina alama wazi za kunukuu.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: dhamiri
  rationale: Katika matumizi ya Paulo, neno hili linamaanisha ufahamu wa kimaadili unaopima matendo; “dhamiri” ndiyo tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: δὲ λέγω
  choice: Namaanisha
  rationale: Hapa λέγω inafafanua maana ya kauli iliyotangulia. Kiswahili cha sasa hakihitaji kiunganishi cha ziada ili kuonyesha ufafanuzi huo.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: dhamiri ya yule mwingine, si yako mwenyewe
  rationale: Muktadha unaonyesha tofauti kati ya dhamiri ya msomaji na ya mtu mwingine. Mpangilio huu ni wa kawaida katika Kiswahili huku tanbihi ikihifadhi umbo halisi la nafsi ya tatu katika Kigiriki.
- source_word: ἱνατί γὰρ
  choice: Kwa maana, kwa nini
  rationale: “Kwa nini” huhifadhi swali la balagha, na “kwa maana” huonyesha kuwa swali hilo linatoa msingi wa ufafanuzi uliotangulia.
- source_word: ἐλευθερία
  choice: uhuru
  rationale: “Uhuru” ni neno la Kiswahili la sasa linalofaa kwa uwezo au haki ya kutenda unaozungumziwa hapa.
- source_word: κρίνεται
  choice: uhukumiwe
  rationale: Kitenzi hiki kinahifadhi maana pana ya kupimiwa au kutolewa hukumu bila kulazimisha maana maalumu ya kuhukumiwa kuwa na hatia.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: na dhamiri ya mtu mwingine
  rationale: Hutaja dhamiri nyingine kama wakala wa hukumu kwa lugha ya kawaida na iliyo wazi.
theological_decisions:
- issue: Mrejelewa wa umilikaji katika tofauti ya kwanza
  choice: Kauli kuu inafafanua kuwa Paulo anamaanisha dhamiri ya mtu mwingine, si dhamiri ya msomaji.
  alternative: 'Kwa kufuata umbo halisi la Kigiriki: “si dhamiri yake mwenyewe, bali ya yule mwingine.”'
  rationale: ἑαυτοῦ ni nafsi ya tatu kwa umbo, lakini muktadha unawaelekeza Wakorintho. Tafsiri kuu huwasilisha maana ya kimuktadha, huku tanbihi ikihifadhi tofauti ya kisarufi.
- issue: Msemaji na nguvu ya swali la balagha
  choice: Swali limeachwa wazi kama changamoto ya balagha bila kubainisha msemaji mwingine.
  alternative: Linaweza kueleweka kama pingamizi ambalo Paulo analitaja kwa sauti ya mpinzani.
  rationale: Kigiriki hakina alama wazi ya kubadilika kwa msemaji; kwa hiyo tafsiri haifungi mojawapo ya tafsiri hizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Namaanisha” hutumika kama ufafanuzi wa sentensi iliyotangulia, na “uhukumiwe” hudumisha upana wa maana ya κρίνεται.
