id: 1CO.10.33
reference: 1 Corinthians 10:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: sw
  text: kama vile mimi pia ninavyowapendeza watu wote katika mambo yote[a], bila kutafuta faida yangu mwenyewe, bali faida ya watu wengi[b], ili waokolewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yote kwa watu wote.” Kigiriki kinasema kwa maana ya karibu zaidi, “watu wote katika mambo yote,” kikionyesha kujirekebisha kwa upana kwa ajili ya mema ya wengine.
    reason: lexical_alternative
  - marker: b
    text: Au, “manufaa yangu mwenyewe ... manufaa ya watu wengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: kama vile mimi pia
  rationale: Inahifadhi nguvu ya ulinganisho ya καθὼς na maana ya nyongeza katika κἀγώ, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: πάντα πᾶσιν
  choice: watu wote katika mambo yote
  rationale: Inawakilisha moja kwa moja upana wa usemi wa Kigiriki bila kuingiza maneno tofauti ya 1 Wakorintho 9:22.
- source_word: ἀρέσκω
  choice: ninavyowapendeza
  rationale: Maana ya msingi ni kumpendeza mtu au kuwa wa kumpendeza; muktadha unaonyesha kuwa ni kujirekebisha kwa ajili ya mema ya wengine, si kutafuta sifa zao.
- source_word: μὴ ζητῶν
  choice: bila kutafuta
  rationale: Inatoa kwa Kiswahili hali au nia inayoandamana na kitendo kikuu, kama inavyofanya participio ya sasa ya Kigiriki.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: faida yangu mwenyewe
  rationale: σύμφορον ni kile chenye faida au manufaa; tafsiri hii inahifadhi tofauti iliyo wazi kati ya faida ya Paulo na ya walio wengi.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: bali faida ya walio wengi
  rationale: Inakamilisha kwa uwazi nomino iliyoachwa katika muundo wa Kigiriki na kuhifadhi usemi 'walio wengi' badala ya kuupanua kuwa 'wengine wote.'
- source_word: ἵνα σωθῶσιν
  choice: ili waokolewe
  rationale: Inahifadhi kusudi linaloonyeshwa na ἵνα pamoja na hali tendwa ya kitenzi, bila kutaja wazi mtendaji ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Upeo na maana ya σωθῶσιν
  choice: ili waokolewe
  alternative: ili wasaidiwe; ili wahifadhiwe
  rationale: Katika muktadha huu wa Paulo, kitenzi kina maana ya wokovu, si manufaa ya kijamii tu. Hali tendwa imehifadhiwa na mtendaji hajaongezwa.
- issue: Maana ya Paulo kuwapendeza wengine
  choice: ninavyowapendeza watu wote
  alternative: ninavyotafuta kibali cha watu wote; ninavyojirekebisha kwa watu wote
  rationale: ἀρέσκω imetafsiriwa kwa maana yake ya kawaida, lakini kishazi kinachofuata kinaweka wazi kwamba Paulo anatafuta faida na wokovu wa wengine, wala si sifa zao au maridhiano yanayokiuka uaminifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa kuwa wa kawaida kwa wasomaji wa leo huku ukihifadhi ulinganisho, upana wa usemi, tofauti ya faida, na hali tendwa ya wokovu.
