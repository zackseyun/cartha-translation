    reason: lexical_alternative
  - marker: b
    text: Yaani, Paulo hasemi kwamba sanamu zina uhalisi wa kimungu au kwamba chakula kilichotolewa sadaka kina umuhimu wa kiroho wa asili ndani yake chenyewe.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Basi, ninasema nini?
  rationale: Linahifadhi swali la balagha, nafsi ya kwanza, na wakati wa sasa, huku likisikika kawaida katika Kiswahili.
- source_word: ὅτι
  choice: Kwamba
  rationale: Linatanguliza moja kwa moja maudhui ya jambo ambalo Paulo huenda akaeleweka kuwa analisema, bila kuongeza ufafanuzi.
- source_word: εἰδωλόθυτόν
  choice: chakula kilichotolewa sadaka kwa sanamu
  rationale: Katika muktadha wa 1 Wakorintho 8–10 neno hili linahusu chakula, hasa nyama, kilichohusishwa na dhabihu kwa sanamu; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: τί ἐστιν
  choice: ni kitu
  rationale: Inahifadhi ufupi na utata wa usemi wa Kigiriki kuhusu kuwapo au kuwa na maana/uzito wowote, bila kuamua maana hiyo katika matini kuu.
- source_word: ἢ
  choice: au
  rationale: Inaunganisha kwa kawaida vifungu viwili vinavyolingana.
- source_word: εἴδωλον
  choice: sanamu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sanamu inayohusishwa na ibada katika muktadha huu.
theological_decisions:
- issue: Ikiwa swali la Paulo linathibitisha kwamba chakula cha sadaka au sanamu ina uhalisi au umuhimu fulani
  choice: Maswali yametafsiriwa moja kwa moja kwa usemi “ni kitu,” yakibaki ya balagha.
  alternative: “kina umuhimu wowote” au “ina uhalisi wowote”
  rationale: Usemi wa Kigiriki unaweza kugusa uhalisi, hadhi, au umuhimu. Matini kuu haipaswi kuamua kimya-kimya mojawapo, wala kudokeza kwamba sanamu ni mungu wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Kurudiwa kwa “ni kitu” kumehifadhiwa ili kuakisi muundo sambamba na mvutano wa matini ya Kigiriki.
