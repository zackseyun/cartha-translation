  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: sw
  text: Maana niliamua kutojua chochote miongoni mwenu isipokuwa Yesu Masihi[a]—na yeye aliyesulubiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yesu Kristo.” Kigiriki: “Yesu Masihi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: niliamua
  rationale: Katika muktadha huu kitenzi kinaonyesha uamuzi thabiti wa Paulo, si hukumu ya kimahakama.
- source_word: τι εἰδέναι
  choice: kutojua chochote
  rationale: 'Pamoja na οὐ na εἰ μὴ, usemi huu unaweka mpaka kamili: Paulo aliamua kutokazia jambo jingine lolote isipokuwa lile linalotajwa.'
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hurejelea kuwapo na huduma ya Paulo katikati ya waamini wa Korintho; ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hutoa maana ya ubaguzi wa jambo moja kwa uwazi na uaminifu.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa Χριστός inamtambulisha Yesu kwa cheo chake cha Kimasihi. Kiswahili hakihitaji kibainishi kinacholingana na neno la Kiingereza “the,” hivyo “Yesu Masihi” ni ya asili.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: naam, yeye aliyesulubiwa
  rationale: “Naam” huendeleza na kukazia wazo, huku “yeye” ikihifadhi mkazo wa τοῦτον. “Aliyesulubiwa” huonyesha Yesu akiwa yule aliyepitia kusulubiwa bila kulegeza uzito wa usemi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno lina nguvu ya cheo kinachomtambulisha Yesu na kazi yake ya wokovu. Tafsiri ya jadi “Kristo” imehifadhiwa katika tanbihi.
- issue: Nguvu ya ἐσταυρωμένον
  choice: yeye aliyesulubiwa
  alternative: yeye akiwa amesulubiwa
  rationale: Kauli iliyochaguliwa ni ya asili katika Kiswahili na inadumisha mkazo juu ya Yesu kama aliyesulubiwa; mbadala ungeonyesha kwa uwazi zaidi hali inayotokana na tendo lililokamilika lakini ni mzito kidogo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi na wenye mkazo wa sentensi ya Kigiriki umehifadhiwa; alama ya kistari kirefu inaweka mkazo kwenye kusulubiwa.
