source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: sw
  text: Lakini sisi hatukuipokea roho ya ulimwengu, bali Roho atokaye kwa Mungu, ili tuyajue mambo ambayo Mungu ametujalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: roho / Roho
  rationale: Katika tukio la kwanza, “roho” linamaanisha ushawishi au mwelekeo wa ulimwengu; katika la pili, “Roho” linaeleweka kwa kawaida kuwa Roho wa Mungu. Tofauti ya herufi ndogo na kubwa inadumisha utofautishaji huo.
- source_word: κόσμου
  choice: ulimwengu
  rationale: “Ulimwengu” ni tafsiri ya kawaida na ya wazi hapa, ikimaanisha mfumo wa sasa wa kibinadamu unaopingana na Mungu.
- source_word: ἐλάβομεν
  choice: hatukuipokea
  rationale: Wakati uliopita wa Kiswahili unaeleza tendo la kupokea lililotokea, huku muktadha ukionyesha matokeo yake yanayoendelea.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: atokaye kwa Mungu
  rationale: Hueleza chanzo cha Roho kwa Kiswahili cha asili, bila kupanua maana ya kirai cha Kigiriki.
- source_word: ἵνα εἰδῶμεν
  choice: ili tuyajue
  rationale: “Ili” linaweka wazi kusudi, na “tuyajue” linadumisha maana ya utambuzi wa οἶδα.
- source_word: χαρισθέντα
  choice: tuliyopewa kwa neema
  rationale: Neno hili linatokana na χαρίζομαι na lina wazo la kutoa kwa neema au kama zawadi; “kwa neema” linahifadhi wazo hilo kuliko “kupewa” peke yake.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: mambo tuliyopewa kwa neema
  rationale: Wingi wa kijinsia isiyo na uhai ni mpana na hauhusiani tu na karama maalumu za kiroho; “mambo” linadumisha upana huo.
theological_decisions:
- issue: Ikiwa πνεῦμα τὸ ἐκ τοῦ θεοῦ inamtaja hasa Roho Mtakatifu
  choice: Roho atokaye kwa Mungu
  alternative: roho itokayo kwa Mungu
  rationale: Katika muktadha wa karibu, tofauti kati ya “roho ya ulimwengu” na Roho anayetoka kwa Mungu inaeleweka kwa kawaida kuwa rejeo kwa Roho Mtakatifu. Herufi kubwa inaonyesha hilo huku tafsiri ikibaki karibu na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili na unaosomeka kwa urahisi, huku tofauti kati ya “roho ya ulimwengu” na “Roho atokaye kwa Mungu” pamoja na maana ya kutoa kwa neema zikihifadhiwa.
