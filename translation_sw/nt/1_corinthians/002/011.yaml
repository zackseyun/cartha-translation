id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: sw
  text: Maana ni nani miongoni mwa wanadamu anayeyajua mambo ya mtu[a] isipokuwa roho ya mtu iliyo ndani yake[b]? Vivyo hivyo, hakuna mtu anayeyajua mambo ya Mungu isipokuwa Roho wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawazo ya mtu” badala ya “mambo ya mtu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “roho yake mwenyewe iliyo ndani yake.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: wanadamu / mtu
  rationale: Maneno haya yanarejelea watu kwa ujumla, si wanaume pekee. “Wanadamu” na “mtu” ni ya kawaida na yanatunza tofauti ya wingi na umoja katika sentensi.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: mambo ya mtu
  rationale: Kauli hii ina maana pana kuhusu yaliyo ya ndani ya mtu; haipaswi kufupishwa kuwa mawazo peke yake. Pia inadumisha ulinganifu na “mambo ya Mungu.”
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: roho ya mtu iliyo ndani yake
  rationale: Tafsiri hii inafuata muundo wa Kiyunani na kuonyesha wazi kuwa roho hiyo imo ndani ya mtu, bila kuongeza dhana ya kiufafanuzi.
- source_word: οὕτως καὶ
  choice: Vivyo hivyo
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha ulinganisho wa karibu kati ya hali ya mwanadamu na mambo ya Mungu.
- source_word: ἔγνωκεν
  choice: aliyepata kuyajua
  rationale: Muundo huu unaakisi kwa Kiswahili hali ya tendo lililokamilika yenye matokeo ya sasa, huku ukibaki wa asili katika sentensi hasi.
- source_word: τὰ τοῦ θεοῦ
  choice: mambo ya Mungu
  rationale: Kauli pana ya chanzo imedumishwa badala ya kuibana kuwa “mawazo ya Mungu,” na ulinganifu na “mambo ya mtu” umehifadhiwa.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Roho wa Mungu
  rationale: Katika muktadha huu kauli hiyo inamrejelea Roho wa Mungu anayechunguza na kufunua mambo ya Mungu. Herufi kubwa na kiunganishi “wa” vinafuata matumizi ya kawaida ya Kiswahili kwa rejeleo hili la kibinafsi.
theological_decisions:
- issue: Ikiwa πνεῦμα τοῦ θεοῦ itafsiriwe kama rejeleo la kibinafsi la Roho wa Mungu au kama “roho ya Mungu” isiyo jina maalumu.
  choice: Roho wa Mungu
  alternative: roho ya Mungu
  rationale: Muktadha wa karibu unazungumzia Roho anayechunguza na kufunua mambo ya Mungu. Tafsiri hii inatambulisha rejeleo hilo bila kuongeza maelezo ya kimafundisho yasiyokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Ajuaye” imetumiwa katika swali la balagha kwa ufupi na ufasaha; “aliyepata kuyajua” inadumisha tofauti ya kitenzi cha pili katika chanzo. Ulinganifu wa “mambo ya mtu” na “mambo ya Mungu” umehifadhiwa.
source_grounding:
  english_pob_role: consult_only
