  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: sw
  text: Na usemi wangu na mahubiri yangu hayakuwa katika hekima ya kushawishi[b], bali katika udhihirisho wa Roho[a] na wa nguvu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho.”
    reason: alternative_reading
  - marker: b
    text: Au, “katika maneno ya hekima yenye ushawishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: neno
  rationale: “Neno langu” ni tafsiri ya kawaida na yenye hadhi ya λόγος; katika muktadha huu linahusu usemi wa Paulo na linabaki tofauti na κήρυγμα.
- source_word: κήρυγμα
  choice: mahubiri
  rationale: “Mahubiri” linaeleza tangazo lililohubiriwa hadharani na ni la kawaida katika Kiswahili cha sasa, bila kulichanganya na λόγος.
- source_word: πειθοῖ σοφίας
  choice: kwa hekima yenye ushawishi
  rationale: Kigiriki hakitaji wazi nomino “maneno”; tafsiri hii inadumisha muundo wake na wazo la hekima inayotegemea uwezo wa kushawishi.
- source_word: ἀποδείξει
  choice: uthibitisho
  rationale: “Uthibitisho” huonyesha jambo linalodhihirisha ukweli au uhalisi, kinyume na ushawishi wa usemi pekee.
- source_word: πνεύματος
  choice: Roho
  rationale: Muktadha mpana wa sura unalenga Roho wa Mungu; herufi kubwa inaonyesha usomaji huo, huku uwezekano wa “roho” ukihifadhiwa katika tanbihi.
- source_word: δυνάμεως
  choice: nguvu
  rationale: “Nguvu” ni tafsiri wazi na ya kawaida ya δύναμις na inadumisha uratibu wa “Roho na nguvu.”
theological_decisions:
- issue: Iwapo πνεύματος inamaanisha Roho Mtakatifu au roho kwa maana nyingine
  choice: Roho
  alternative: roho
  rationale: Muktadha wa 1 Wakorintho 2 unaelekeza kwa kazi ya Roho wa Mungu, lakini maandishi yenyewe hapa hayajaweka tofauti ya herufi kubwa na ndogo; hivyo usomaji mwingine umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa uratibu “neno langu na mahubiri yangu” na “Roho na nguvu” umehifadhiwa; tafsiri imeepuka kuongeza “maneno” katika matini kuu kwa kuwa hayapo wazi katika Kigiriki.
