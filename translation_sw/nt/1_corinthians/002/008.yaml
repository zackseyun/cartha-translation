lexical_decisions:
- source_word: ἣν
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea “hekima” iliyotajwa kabla; “ambayo” hudumisha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: ἀρχόντων
  choice: watawala
  rationale: Neno hili linaonyesha wenye mamlaka ya kutawala na halibani rejeo kuwa viongozi wa kibinadamu pekee.
- source_word: αἰῶνος τούτου
  choice: enzi hii
  rationale: “Enzi” huhifadhi maana ya kipindi au mpangilio wa wakati, badala ya kuibadili moja kwa moja kuwa “ulimwengu.”
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: aliyeijua / wangaliijua
  rationale: “Kujua” ni tafsiri ya moja kwa moja ya γινώσκω hapa. Kiambishi -i- kinarejelea hekima, na “wangaliijua” huonyesha sharti lisilotimia la wakati uliopita.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida yenye uzito unaofaa kwa cheo hiki.
- source_word: δόξης
  choice: utukufu
  rationale: “Utukufu” ni tafsiri iliyozoeleka na inayohifadhi maana ya kitheolojia ya δόξα.
- source_word: κύριον τῆς δόξης
  choice: Bwana wa utukufu
  rationale: Muundo huu huhifadhi uhusiano wa asili wa maneno na uzito wa usemi bila kuufafanua kupita kiasi.
- source_word: ἐσταύρωσαν
  choice: wangemsulubisha
  rationale: “Kusulubisha” hutaja kwa usahihi namna ya kuuawa msalabani; hali ya masharti inalingana na εἰ ... οὐκ ἂν.
theological_decisions:
- issue: Utambulisho wa “watawala wa enzi hii”
  choice: Usemi umetafsiriwa bila kubainisha kama ni watawala wa kibinadamu, nguvu za kiroho, au wote wawili.
  alternative: “viongozi wa enzi hii” au ufafanuzi unaowataja moja kwa moja watawala wa kisiasa/kidini au nguvu za kiroho
  rationale: ἄρχοντες τοῦ αἰῶνος τούτου inaweza kueleweka kwa njia zaidi ya moja katika muktadha wa Paulo. Tafsiri kuu inadumisha utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wangaliijua” ni umbo rasmi linaloonyesha kwa ufupi sharti lisilotimia la wakati uliopita.
