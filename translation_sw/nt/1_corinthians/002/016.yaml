id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: sw
  text: Maana ni nani aliyeijua nia ya Bwana[b], hata apate kumfundisha? Lakini sisi tunayo nia ya Masihi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nia ya Kristo.”
    reason: lexical_alternative
  - marker: b
    text: Paulo anarejelea Isaya 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: Maana ni nani
  rationale: “Maana” huhifadhi uhusiano wa maelezo na hoja iliyotangulia, na “ni nani” huwasilisha swali la balagha kwa Kiswahili cha kawaida.
- source_word: ἔγνω
  choice: aliyeijua
  rationale: Kauli hii huonyesha kujua kulikotajwa katika swali la balagha bila kulazimisha tofauti ya wakati ambayo Kiswahili haiwakilishi kama Kiingereza.
- source_word: νοῦν
  choice: nia
  rationale: “Nia” hapa inaweza kujumuisha fikira, ufahamu, na mwelekeo wa ndani; pia inafanya virai “nia ya Bwana” na “nia ya Masihi” visikike kwa kawaida na kwa uzito unaofaa.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi jina la heshima na mwangwi wa dondoo la Isaya.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: hata apate kumfundisha
  rationale: Huwasilisha maana ya kumwelekeza au kumfundisha Bwana, huku ikihifadhi nguvu ya swali la balagha na uhusiano wa kisharti/kimatokeo wa kishazi.
- source_word: ἡμεῖς δὲ
  choice: Lakini sisi
  rationale: Huweka wazi mkazo wa kiwakilishi na utofautishaji mkali unaofuata swali.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta; “Masihi” huhifadhi nguvu hiyo ya Kimasihi badala ya kuitumia tu kama jina.
- source_word: ἔχομεν
  choice: tunayo
  rationale: Ni tamko la sasa, la moja kwa moja, linalosema kwamba sisi tunayo nia hiyo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika νοῦν Χριστοῦ
  choice: nia ya Masihi
  alternative: nia ya Kristo
  rationale: Muktadha unaruhusu Χριστός kusikika kama cheo. “Masihi” huhifadhi uhusiano wake na wazo la Mtiwa-Mafuta bila kubadili dai la kitheolojia; namna iliyozoeleka zaidi, “Kristo,” imetajwa katika tanbihi.
- issue: Mhusika wa αὐτόν katika kishazi cha pili
  choice: kumfundisha, yaani Bwana
  alternative: kuichukulia αὐτόν kwa maana isiyoainishwa wazi
  rationale: Muundo wa dondoo unamrejelea “Bwana” kama yule ambaye hakuna mtu anayestahili kumfundisha. Kiswahili kinaacha rejeo hilo katika kiwakilishi cha mtendewa bila kuongeza jina tena.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na utofautishaji wa “Lakini sisi” umehifadhiwa.
