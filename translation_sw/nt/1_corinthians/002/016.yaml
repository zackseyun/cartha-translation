  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: swali la balagha lenye γάρ (‘Maana’), kujua ‘nia ya Bwana,’ kishazi kinachohusu kumfundisha Bwana, na utofautisho wa ‘Lakini sisi’ wenye tamko la kuwa na ‘nia ya Masihi.’ ‘Hata apate kumfundisha?’ huwasilisha kwa kukubalika uhusiano wa matokeo/uwezo katika ὃς συμβιβάσει αὐτόν bila kudai maana zaidi ya matini.'
