base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: sw
  text: ili imani yenu isitegemee hekima ya wanadamu, bali itegemee nguvu za Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kishazi cha kusudi kwa Kiswahili cha kawaida na kuhifadhi nguvu ya kusudi ya Kiyunani.
- source_word: ἡ πίστις ὑμῶν
  choice: imani yenu
  rationale: Hurejelea mwitikio wa Wakorintho wa kumwamini Mungu; “imani yenu” ni tafsiri ya kawaida, wazi na ya moja kwa moja.
- source_word: μὴ ᾖ ἐν
  choice: isitegemee
  rationale: Katika muktadha huu, ἐν huonyesha msingi ambao imani inakalia au kutegemea. “Isitegemee” huwasilisha maana hiyo kwa Kiswahili cha asili bila kuifanya sentensi kuwa ngumu.
- source_word: σοφίᾳ ἀνθρώπων
  choice: hekima ya wanadamu
  rationale: ἀνθρώπων hapa humaanisha wanadamu kwa ujumla, si wanaume pekee. “Wanadamu” ni sahihi kijinsia na hudumisha utofautishaji kati ya kilicho cha binadamu na nguvu za Mungu.
- source_word: δυνάμει θεοῦ
  choice: nguvu za Mungu
  rationale: Hutafsiri maana ya msingi au tegemeo la imani, kwa ulinganifu na “hekima ya wanadamu.” Katika Kiswahili sanifu, “nguvu za Mungu” ni usemi wa kawaida wa uwezo wa Mungu.
theological_decisions:
- issue: Maana ya ἐν katika utofautishaji wa hekima ya wanadamu na nguvu za Mungu
  choice: Kutafsiri kwa “kutegemea”
  alternative: Kuwa “katika” hekima ya wanadamu / nguvu za Mungu
  rationale: Paulo analinganisha msingi au tegemeo la imani. “Kutegemea” hufanya uhusiano huo uwe wazi katika Kiswahili bila kuongeza dai la kidhehebu.
- issue: Upeo wa ἀνθρώπων
  choice: wanadamu
  alternative: watu; wanaume
  rationale: Neno la Kiyunani lina maana ya wanadamu kwa ujumla katika muktadha huu. “Wanadamu” huhifadhi maana jumuishi na utofautishaji wa kiteolojia kati ya hekima ya kibinadamu na nguvu za Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo mfupi unahifadhi utofautishaji wa Paulo kati ya hekima ya kibinadamu na nguvu za Mungu.
