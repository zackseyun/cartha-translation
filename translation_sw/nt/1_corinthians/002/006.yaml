  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: sw
  text: Lakini tunanena hekima miongoni mwa waliokomaa[a], lakini si hekima ya enzi hii wala ya watawala wa enzi hii[c], ambao wanafanywa kuwa si kitu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamilifu”; hapa huenda neno hilo linamaanisha waliokomaa kiroho.
    reason: lexical_alternative
  - marker: b
    text: Au “wanaopita,” “wanaoondolewa,” au “wanaobatilishwa.”
    reason: lexical_alternative
  - marker: c
    text: “Watawala wa enzi hii” huenda ni watawala wa kibinadamu, nguvu za kiroho, au wote wawili.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: hekima
  rationale: Ni tafsiri ya kawaida ya σοφία, na imerudiwa kwa maana ileile kama ilivyo katika Kigiriki.
- source_word: δὲ
  choice: Lakini / hata hivyo
  rationale: Viunganishi hivi vinaonyesha tofauti inayokusudiwa katika sehemu zote mbili za sentensi kwa Kiswahili cha kawaida.
- source_word: λαλοῦμεν
  choice: tunanena
  rationale: Kitenzi hiki huhifadhi maana ya msingi ya kusema, bila kuongeza wazo maalumu la kuhubiri au kutangaza.
- source_word: ἐν τοῖς τελείοις
  choice: miongoni mwa waliokomaa
  rationale: Katika muktadha huu, τέλειοις inaelekea kumaanisha watu waliokomaa, hasa kiroho, bila kudai kwamba hawana dosari kabisa.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: si hekima ya enzi hii
  rationale: “Enzi” huhifadhi maana ya wakati au kipindi katika αἰών, badala ya kuibadili moja kwa moja kuwa “ulimwengu.”
- source_word: ἀρχόντων
  choice: watawala
  rationale: Neno hili ni pana vya kutosha kuacha wazi ikiwa wanaokusudiwa ni watawala wa kibinadamu, nguvu za kiroho, au wote wawili.
- source_word: τῶν καταργουμένων
  choice: ambao wanafanywa kuwa si kitu
  rationale: Tafsiri hii huhifadhi hali ya tendo linaloendelea na wazo la kufanywa wasiwe na nguvu au maana, bila kulifanya kwa lazima kuwa kuangamizwa kabisa.
theological_decisions:
- issue: Wanaorejelewa na maneno “watawala wa enzi hii”
  choice: Kutumia “watawala” bila kubainisha aina yao
  alternative: Viongozi wa kisiasa au kidini wa kibinadamu; nguvu za kiroho; au makundi yote mawili
  rationale: Kifungu cha Kigiriki hakiamui wazi rejeo moja tu. Tafsiri inaacha utata huo wa kimakusudi badala ya kuamua mjadala katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tunanena” kimetumiwa kwa usahihi wa maana na uzito wa kifungu; “waliokomaa” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi inayoweza kudokeza kutokuwa na dosari kabisa.
