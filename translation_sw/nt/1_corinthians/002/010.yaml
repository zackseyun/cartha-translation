id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: sw
  text: Kwa maana Mungu ametufunulia mambo hayo kwa njia ya Roho[a], kwa kuwa Roho huchunguza mambo yote, hata vilindi vya Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametufunulia hayo”; Kigiriki hakitaji yambwa moja kwa moja, nayo inaeleweka kutokana na muktadha uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Au, “mambo ya kina ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: metufunulia
  rationale: Kiambishi -tu- kinaonyesha kwa kawaida na kwa uwazi kwamba sisi ndio wapokeaji wa ufunuo.
- source_word: ἀπεκάλυψεν
  choice: ametufunulia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la Mungu lililotokea na matokeo yake yanayoendelea kuwafikia waamini, bila kulazimisha utofauti mkali wa nyakati ambao kitenzi cha Kigiriki cha aoristi hakielezi chenyewe.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: mambo hayo
  rationale: Kigiriki hakitaji yambwa moja kwa moja; ‘mambo hayo’ huiunganisha sentensi na mambo yaliyotajwa katika muktadha uliotangulia bila kuongeza ufafanuzi wa kiteolojia.
- source_word: διὰ τοῦ πνεύματος
  choice: kwa njia ya Roho
  rationale: Huwakilisha διά pamoja na jenitivi kama njia au wakala wa ufunuo na ni usemi wa kawaida wa Kiswahili.
- source_word: πνεῦμα
  choice: Roho
  rationale: Herufi kubwa inaonyesha kwamba katika muktadha huu neno linamrejelea Roho wa Mungu, si roho ya mwanadamu.
- source_word: ἐραυνᾷ
  choice: huchunguza
  rationale: Neno hili linaonyesha uchunguzi wa kina na wa makusudi; halidokezi kwamba Roho hana maarifa na lazima ayatafute.
- source_word: πάντα
  choice: mambo yote
  rationale: Ni tafsiri ya kawaida na pana ya πάντα katika sentensi hii.
- source_word: καὶ
  choice: hata
  rationale: 'Hapa καί ina nguvu ya kusisitiza kilele cha kauli: Roho huchunguza mambo yote, hata vilindi vya Mungu.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: vilindi vya Mungu
  rationale: Huhifadhi sitiari ya kina iliyomo katika βάθη kwa Kiswahili cha asili na chenye hadhi.
theological_decisions:
- issue: Ikiwa πνεῦμα inamrejelea Roho Mtakatifu au roho ya mwanadamu
  choice: Roho wa Mungu katika matumizi yote mawili
  alternative: roho ya mwanadamu kwa maana ya jumla
  rationale: Muktadha unahusisha Roho na ufunuo wa Mungu na maarifa yanayofikia hata vilindi vya Mungu; hilo linaunga mkono kwa nguvu rejeo kwa Roho wa Mungu.
- issue: Maana ya Roho ‘kuchunguza’ mambo yote
  choice: Kuhifadhi lugha ya uchunguzi bila kudokeza ukosefu wa maarifa
  alternative: ‘anajua mambo yote,’ ambayo ingefafanua sitiari badala ya kuitafsiri
  rationale: Kitenzi cha Kigiriki kinatumia picha ya kuchunguza kwa kina. Tafsiri haiipaswi kuiondoa wala kuigeuza kuwa dai kwamba Roho hujifunza jambo ambalo hakulijua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Kwa maana ... kwa kuwa’ huhifadhi uhusiano wa hoja wa γὰρ katika sehemu zote mbili. ‘Vilindi’ huhifadhi sitiari ya asili bila kuwa lugha ngumu kupita kiasi.
