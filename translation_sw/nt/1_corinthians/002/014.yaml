  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: sw
  text: Lakini mtu wa tabia ya kibinadamu[a] hayapokei mambo ya Roho wa Mungu, kwa maana kwake ni upumbavu; wala hawezi kuyajua, kwa sababu yanatambuliwa kwa njia ya kiroho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu asiye wa kiroho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yanachunguzwa” au “yanatathminiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: wa tabia ya asili
  rationale: Kauli hii inadumisha utofauti kati ya ψυχικός na πνευματικός bila kueleza zaidi ya Kigiriki. Pia huepuka utata wa Kiswahili wa “mtu wa asili,” ambao unaweza kueleweka kama mzawa.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki iko katika umoja wa kiume kisarufi, hapa inamwakilisha mwanadamu kwa ujumla, si mwanamume pekee.
- source_word: δέχεται
  choice: hayapokei
  rationale: “Kupokea” hapa huweza kujumuisha kukubali mambo hayo kuwa ya kweli, huku ikibaki karibu na maana ya kitenzi cha Kigiriki.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: mambo ya Roho wa Mungu
  rationale: Hii inadumisha upana wa muundo wa Kigiriki, unaoweza kumaanisha mambo yanayotoka kwa Roho au yaliyo katika himaya yake.
- source_word: μωρία
  choice: upumbavu
  rationale: Neno hili linaendeleza mgongano wa Paulo kati ya hekima ya Mungu na kile wanadamu wanachokiona kuwa kipumbavu.
- source_word: γνῶναι
  choice: kuyajua
  rationale: “Kuyajua” linaakisi kwa karibu γνῶναι na halipunguzi maana yake kuwa ufahamu wa kiakili pekee.
- source_word: πνευματικῶς
  choice: kwa njia ya kiroho
  rationale: Kauli hii inaonyesha namna au nyanja ya utambuzi bila kuibadili moja kwa moja kuwa “kwa Roho,” jambo ambalo lingefafanua zaidi ya adverbia ya Kigiriki.
- source_word: ἀνακρίνεται
  choice: yanatambuliwa
  rationale: Katika muktadha huu, “yanatambuliwa” huonyesha kufahamu mambo hayo kwa usahihi, huku tanbihi ikihifadhi maana nyingine za kuchunguza na kutathmini.
theological_decisions:
- issue: Maana ya ψυχικὸς ἄνθρωπος ikilinganishwa na utambuzi wa kiroho
  choice: mtu wa tabia ya asili
  alternative: mtu asiye wa kiroho
  rationale: Chaguo kuu linadumisha mvutano kati ya hali ya kibinadamu ya asili na utambuzi wa kiroho bila kuamua wazi kwamba kifungu kinasema mtu huyo hana Roho.
- issue: Chanzo au namna ya utambuzi katika πνευματικῶς
  choice: kwa njia ya kiroho
  alternative: kwa Roho
  rationale: Adverbia inaweza kuhusishwa kwa karibu na kazi ya Roho katika muktadha, lakini tafsiri kuu inadumisha umbo lake la kielezi na kuepuka kufanya chanzo hicho kuwa wazi kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtu wa tabia ya asili” ni wazi zaidi kuliko “mtu wa asili,” ambalo linaweza kumaanisha mzawa. Muundo na istilahi zimewekwa rahisi kwa msomaji wa kawaida huku utata wa ἀνακρίνεται ukihifadhiwa katika tanbihi.
