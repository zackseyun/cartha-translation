base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: sw
  text: Lakini tunasema hekima ya Mungu katika fumbo[a], hekima iliyofichwa, ambayo Mungu aliikusudia tangu awali[b] kabla ya zama[c] kwa ajili ya utukufu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa njia ya fumbo”; neno la Kigiriki humaanisha mpango wa Mungu uliokuwa umefichwa na baadaye ukafunuliwa.
    reason: lexical_alternative
  - marker: b
    text: Au “aliamua tangu awali” au “aliiwekea kusudi kabla.”
    reason: lexical_alternative
  - marker: c
    text: Au “kabla ya zama zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: tunasema
  rationale: Hili ndilo chaguo la kawaida na la moja kwa moja kwa λαλοῦμεν, nalo linadumisha tofauti anayoweka Paulo bila kuongeza wazo la tangazo rasmi.
- source_word: θεοῦ σοφίαν
  choice: hekima ya Mungu
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi kwamba hekima hii ni ya Mungu na hutoka kwake.
- source_word: ἐν μυστηρίῳ
  choice: katika fumbo
  rationale: “Fumbo” linahifadhi maana ya mpango wa Mungu uliokuwa umefichwa na sasa kufunuliwa, bila kuufanya uwe siri isiyoweza kujulikana.
- source_word: τὴν ἀποκεκρυμμένην
  choice: hekima iliyofichwa
  rationale: Kirai hiki kinarejelea “hekima”; kurudia nomino kunafanya rejeo liwe wazi na la kawaida katika Kiswahili.
- source_word: προώρισεν
  choice: aliikusudia tangu awali
  rationale: Huhifadhi nguvu ya uamuzi wa Mungu uliofanywa kabla, huku kikiepuka kuingiza mfumo maalumu wa kimadhehebu.
- source_word: πρὸ τῶν αἰώνων
  choice: kabla ya zama
  rationale: “Zama” ni tafsiri ya karibu ya αἰῶνες na inadumisha mtazamo wa Paulo wa wakati na ulimwengu.
- source_word: εἰς δόξαν ἡμῶν
  choice: kwa ajili ya utukufu wetu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uzito wa kitheolojia wa δόξα bila kuifafanua zaidi kuwa tendo la kutukuzwa.
theological_decisions:
- issue: Maana ya προώρισεν katika muktadha wa Paulo wenye uzito wa kimafundisho
  choice: aliikusudia tangu awali
  alternative: aliamua tangu awali; aliiwekea kusudi kabla
  rationale: Kitenzi kinaonyesha uamuzi au kusudi la Mungu lililowekwa kabla. Tafsiri hii inadumisha nguvu hiyo bila kuamua kwa niaba ya msomaji mfumo mpana wa kimadhehebu.
- issue: Uhusiano wa “fumbo” na “hekima iliyofichwa”
  choice: Kudumisha lugha ya fumbo na ufichaji
  alternative: katika siri
  rationale: Katika matumizi ya Paulo, fumbo ni kusudi la Mungu lililokuwa limefichwa lakini likafunuliwa; “siri” peke yake inaweza kudokeza jambo ambalo bado halitangazwi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa virai unafuata uhusiano wa Kigiriki huku ukibaki wa asili katika Kiswahili; kila alama ya tanbihi imewekwa katika matini.
