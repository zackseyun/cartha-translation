- from: Mambo hayo ndiyo tunayosema, si kwa maneno yanayofundishwa na hekima ya kibinadamu, bali kwa maneno yanayofundishwa na Roho, tukieleza mambo ya kiroho kwa maneno ya kiroho.[a]
  to: Mambo haya pia tunayasema, si kwa maneno yanayofundishwa na hekima ya kibinadamu, bali kwa maneno yanayofundishwa na Roho, tukieleza mambo ya kiroho kwa maneno ya kiroho.[a]
  rationale: The revision restores “pia” for καί and removes the additional emphasis implied by “ndiyo.” It retains the defensible main-text reading in which πνευματικοῖς refers elliptically to spiritual words, while preserving the viable masculine alternative in a more precise footnote.
