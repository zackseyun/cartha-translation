base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: sw
  text: Mambo haya pia tunayasema, si kwa maneno yanayofundishwa na hekima ya kibinadamu, bali kwa maneno yanayofundishwa na Roho, tukieleza mambo ya kiroho kwa maneno ya kiroho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukiwaelezea watu wa kiroho mambo ya kiroho.” Neno la Kigiriki πνευματικοῖς, lililotafsiriwa “kwa maneno ya kiroho,” linaweza pia kueleweka kuwa “kwa watu wa kiroho.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Mambo hayo
  rationale: Kiwakilishi hiki kinarejelea mambo ambayo Paulo ametoka kuyataja na ni cha kawaida katika Kiswahili cha sasa.
- source_word: λαλοῦμεν
  choice: tunayosema
  rationale: Kitenzi hiki kinadumisha wazo la kusema au kunena na kinaunganisha kwa kawaida ‘mambo hayo’ na kauli inayofuata.
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: kwa maneno yanayofundishwa na hekima ya kibinadamu
  rationale: ‘Kwa’ linaonyesha njia au chombo cha kusema, huku ‘yanayofundishwa na’ likihifadhi hekima ya kibinadamu kama chanzo cha mafundisho hayo.
- source_word: διδακτοῖς πνεύματος
  choice: kwa maneno yanayofundishwa na Roho
  rationale: Neno ‘maneno’ limerudiwa kwa uwazi wa kawaida katika Kiswahili; ‘Roho’ limetumiwa kwa herufi kubwa kwa sababu muktadha unamrejelea Roho wa Mungu.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: tukieleza mambo ya kiroho kwa maneno ya kiroho
  rationale: Tafsiri hii inafuata muktadha wa karibu unaolinganisha aina za maneno na kuelewa πνευματικοῖς kama ya kati yenye nomino ‘maneno’ iliyodokezwa. Kwa kuwa umbo hilo linaweza pia kuwa la kiume na kurejelea watu wa kiroho, uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kirejelewa cha πνεύματος
  choice: Roho Mtakatifu, kwa kutafsiri ‘Roho’
  alternative: roho kwa maana ya chanzo cha kiroho kwa ujumla
  rationale: Muktadha mpana wa 1 Wakorintho 2 unamtaja Roho wa Mungu kama yule anayefunua na kufundisha, hivyo kirejelewa cha kibinafsi kinafaa zaidi bila kuongeza neno ‘Mtakatifu’ lisilopo katika aya.
- issue: Jinsia na kirejelewa cha πνευματικοῖς
  choice: maneno ya kiroho
  alternative: watu wa kiroho
  rationale: Sarufi inaruhusu πνευματικοῖς kueleweka kama ya kati au ya kiume. Muktadha wa ‘maneno’ unaunga mkono chaguo la kwanza, lakini utata halisi umehifadhiwa kwa tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili na wenye mtiririko, huku tofauti kati ya hekima ya kibinadamu na mafundisho ya Roho ikidumishwa.
