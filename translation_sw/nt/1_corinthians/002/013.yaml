review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the contrast between words taught by human wisdom and words taught by the Spirit, and its main rendering of the syntactically disputed final clause as spiritual matters expressed in spiritual words is defensible. However, “ndiyo” introduces emphasis not expressed by the Greek, while the additive force of καί (“also”) is not represented.
  naturalness: The Swahili is clear, idiomatic, and appropriately formal. “Mambo haya pia tunayasema” is more direct and natural here than “Mambo hayo ndiyo tunayosema,” while also representing both the demonstrative and the additive particle.
  terminology: “Roho” appropriately refers to the Holy Spirit in this context without adding “Mtakatifu.” “Mambo ya kiroho” and “maneno ya kiroho” are suitable and preserve the deliberate repetition. The footnote should identify πνευματικοῖς specifically, since it is that dative plural form whose gender permits the alternative reading.
  issues:
  - severity: medium
    issue: The opening omits the additive force of καί and adds unsupported emphasis through “ndiyo.”
    rationale: ἃ καὶ λαλοῦμεν means “these things we also speak.” “Ndiyo” is emphatic, whereas καί is additive; “pia” represents the latter without adding emphasis.
  - severity: low
    issue: The footnote refers generically to “Neno la Kigiriki” rather than identifying the ambiguous Greek form.
    rationale: Naming πνευματικοῖς makes clear that the ambiguity concerns the dative plural adjective, which can be neuter (spiritual words/things) or masculine (spiritual people).
  revised_text: Mambo haya pia tunayasema, si kwa maneno yanayofundishwa na hekima ya kibinadamu, bali kwa maneno yanayofundishwa na Roho, tukieleza mambo ya kiroho kwa maneno ya kiroho.[a]
  revised_footnotes:
  - marker: a
    text: Au, “tukiwaelezea watu wa kiroho mambo ya kiroho.” Neno la Kigiriki πνευματικοῖς, lililotafsiriwa “kwa maneno ya kiroho,” linaweza pia kueleweka kuwa “kwa watu wa kiroho.”
    reason: alternative_reading
  revision_rationale: The revision restores “pia” for καί and removes the additional emphasis implied by “ndiyo.” It retains the defensible main-text reading in which πνευματικοῖς refers elliptically to spiritual words, while preserving the viable masculine alternative in a more precise footnote.
