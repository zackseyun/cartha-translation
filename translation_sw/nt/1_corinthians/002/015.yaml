id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: sw
  text: Lakini mtu wa kiroho[a] huchunguza mambo yote[b], lakini yeye mwenyewe hachunguzwi na mtu yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mtu wa kiroho” hapa ni mtu mwenye sifa ya kuongozwa au kutambulishwa na Roho; usemi wa Kigiriki haumkusudii mwanaume pekee.
    reason: cultural_note
  - marker: b
    text: Au “hutathmini,” “hutambua,” au “huhukumu”; vivyo hivyo katika sehemu ya pili ya mstari.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: mtu wa kiroho
  rationale: Kivumishi hiki kimetumiwa kama nomino kumaanisha mtu mwenye sifa ya kuongozwa au kutambulishwa na Roho; tafsiri hii ni ya kijumla na haimaanishi mwanaume pekee.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: huchunguza / hachunguzwi
  rationale: Neno hili linaonyesha uchunguzi wa makini unaoleta tathmini au utambuzi. Kurudia mzizi uleule katika kauli tendaji na tendwa kunahifadhi urudiaji wa Kigiriki.
- source_word: τὰ πάντα
  choice: mambo yote
  rationale: Huhifadhi usemi mpana wa Kigiriki bila kuuwekea kikomo wazi ambacho hakipo katika mstari wenyewe.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: ὑπ’ οὐδενὸς
  choice: na mtu yeyote (katika kauli hasi)
  rationale: Katika muundo ‘hachunguzwi na mtu yeyote,’ Kiswahili huwasilisha kwa kawaida ukanushaji kamili wa Kigiriki ‘na hakuna mtu.’
theological_decisions:
- issue: Upeo wa dai kuhusu mtu wa kiroho
  choice: Kuhifadhi maneno yasiyowekewa kikomo, ‘mambo yote’ na ‘hachunguzwi na mtu yeyote.’
  alternative: Kusema wazi katika matini kuu kwamba ni mambo ya kiroho pekee
  rationale: Mstari wenyewe unatoa dai kwa lugha pana, huku muktadha wa karibu ukiongoza uelewaji wake. Kuongeza kikomo katika matini kuu kungeondoa mvutano uliopo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtu wa kiroho’ ni usemi unaoeleweka kwa urahisi, na ‘huchunguza’ huhifadhi wazo la uchunguzi wa makini pamoja na urudiaji wa kitenzi katika vifungu vyote viwili.
