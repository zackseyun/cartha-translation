source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: sw
  text: 'Lakini kama ilivyoandikwa: “Yale ambayo jicho halikuyaona, wala sikio halikuyasikia, wala hayakuingia[a] moyoni mwa mwanadamu[b]—yale ambayo Mungu amewaandalia wale wanaompenda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wala hayakupanda juu ya moyo wa mwanadamu”; pia inaweza kueleweka kuwa “wala hayakumjia mtu akilini.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “mwanadamu” humaanisha binadamu yeyote, si mwanamume pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofauti na wazo lililotangulia kwa kiunganishi cha kawaida na cha moja kwa moja.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Inahifadhi kauli ya kutambulisha nukuu ya Maandiko na hali ya jambo lililoandikwa ambalo bado lina mamlaka.
- source_word: Ἃ ... ὅσα
  choice: Yale ambayo ... yale ambayo
  rationale: Inahifadhi muundo wa kishairi wa viwakilishi vya wingi vinavyotanguliza na kisha kurejelea mambo yanayotajwa.
- source_word: ὀφθαλμὸς
  choice: jicho
  rationale: Ni tafsiri ya moja kwa moja ya umoja unaowakilisha macho kwa ujumla.
- source_word: οὖς
  choice: sikio
  rationale: Inahifadhi umoja unaowakilisha masikio kwa ujumla na usambamba wake na ‘jicho.’
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: hayakuingia moyoni mwa mwanadamu
  rationale: Ni Kiswahili cha asili kinachoeleza jambo ambalo halijawahi kutungwa au kufikiriwa ndani ya mtu, huku ‘moyo’ ukihifadhi taswira ya kibiblia. Tanbihi inadokeza sitiari halisi zaidi ya ‘kupanda juu ya moyo.’
- source_word: ἡτοίμασεν
  choice: amewaandalia
  rationale: Inaonyesha tendo la Mungu lililokamilika lenye matokeo yanayoendelea, na kiambishi cha watendewa kinawaelekea wale wanaompenda.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: wale wanaompenda
  rationale: Inaeleza kwa kawaida sifa endelevu ya watu hao bila kuongeza maana ya kimadhehebu.
theological_decisions:
- issue: Maana jumuishi ya ἀνθρώπου
  choice: mwanadamu
  alternative: mtu; binadamu
  rationale: ‘Mwanadamu’ huhifadhi umoja wa Kigiriki na humrejelea mtu wa aina yoyote; tanbihi inaondoa uwezekano wa kuielewa kama mwanamume pekee.
- issue: Taswira ya moyo katika ἐπὶ καρδίαν ... ἀνέβη
  choice: hayakuingia moyoni
  alternative: hayakupanda juu ya moyo; hayakumjia mtu akilini
  rationale: Maandishi makuu yanatumia msemo unaoeleweka kwa urahisi katika Kiswahili huku yakihifadhi ‘moyo’; tanbihi inalinda sitiari na upeo wa maana wa Kigiriki bila kuamua kimya kimya kuwa ni akili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘yale ambayo’ na usambamba wa ‘jicho ... sikio ... moyo’ yamehifadhiwa kwa ajili ya mtiririko wa kishairi wa nukuu.
