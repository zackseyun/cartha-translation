  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: sw
  text: Nami nilipokuja kwenu, ndugu[a], sikuja kwa ubora wa usemi au hekima, nikiwatangazia ushuhuda wa Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa linaweza kumaanisha waamini wenza kwa ujumla, wakiwemo wanawake katika kusanyiko.
    reason: cultural_note
  - marker: b
    text: Baadhi ya hati za kale husoma, “siri ya Mungu.”
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Nami
  rationale: Inaendeleza kiunganishi καί na kusisitiza nafsi ya kwanza kwa njia ya kawaida katika Kiswahili bila kuzidisha msisitizo.
- source_word: ἐλθὼν … ἦλθον
  choice: nilipokuja … sikuja
  rationale: Kirai cha hali kinatafsiriwa kwa kishazi cha wakati, huku kitenzi kikuu hasi kikihifadhiwa; urudiaji wa mzizi wa 'kuja' unaakisi muundo wa Kigiriki na unasikika kwa kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili 'ndugu' ni neno la kawaida la kuwaita waamini wenza na linaweza kuwahusu wanaume na wanawake bila kulazimisha jinsia isiyobainishwa na muktadha.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: kwa maneno ya fahari au hekima
  rationale: '''Maneno ya fahari'' yanaonyesha usemi ulioinuliwa au wa kujionyesha, huku ''hekima'' ikihifadhi neno la msingi na tofauti anayoijenga Paulo.'
- source_word: καταγγέλλων
  choice: nikiwatangazia
  rationale: Umbo la hali endelevu linaonyesha tendo lililoambatana na kuja kwake, na 'kutangaza' huhifadhi maana ya kutoa ujumbe hadharani.
- source_word: μαρτύριον
  choice: ushuhuda
  rationale: Hufuata usomaji wa SBLGNT μαρτύριον na kuhifadhi uzito wa neno hilo bila kulibana kuwa ujumbe wa aina moja tu.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo wa 'wa Mungu' huhifadhi uwezekano kwamba ni ushuhuda unaotoka kwa Mungu au unaomhusu Mungu, badala ya kuamua maana moja.
theological_decisions:
- issue: Tofauti ya maandishi katika μαρτύριον
  choice: ushuhuda wa Mungu
  alternative: siri ya Mungu
  rationale: Maandishi msingi ya SBLGNT yana μαρτύριον ('ushuhuda'); usomaji μυστήριον ('siri') ni tofauti muhimu ya hati na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha urudiaji wa 'kuja,' tofauti kati ya usemi na hekima, pamoja na utata wa kirai 'wa Mungu.' Alama zote za tanbihi zimewekwa katika maandishi makuu karibu na vipengele vinavyohusika.
