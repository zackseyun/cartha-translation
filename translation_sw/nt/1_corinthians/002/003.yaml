  text: Nami nilikuwa pamoja nanyi katika udhaifu[a], katika hofu na katika kutetemeka sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliwajia katika udhaifu, katika hofu na katika kutetemeka sana.”
    reason: Kifungu ἐγενόμην πρὸς ὑμᾶς kinaweza kueleweka kuwa hali ya Paulo alipokuwa pamoja nao au hali ambayo alikuja nayo kwao.
lexical_decisions:
- source_word: κἀγώ
  choice: Nami
  rationale: Huendeleza uhusiano na sentensi iliyotangulia na kudumisha rejeo la Paulo kwake mwenyewe kwa Kiswahili cha kawaida.
- source_word: ἐν ἀσθενείᾳ
  choice: katika udhaifu
  rationale: Neno hili linaweza kumaanisha udhaifu au hali ya kutokuwa na nguvu; ‘udhaifu’ huhifadhi upana wake bila kuufafanua kupita kiasi.
- source_word: ἐν φόβῳ
  choice: katika hofu
  rationale: Hutoa maana ya moja kwa moja ya hali aliyoitaja Paulo bila kuipunguza kuwa tahadhari au uchaji tu.
- source_word: ἐν τρόμῳ πολλῷ
  choice: katika kutetemeka sana
  rationale: ‘Kutetemeka’ hutafsiri τρόμος, na ‘sana’ hudumisha nguvu ya πολλῷ kwa Kiswahili cha asili.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: nilikuwa pamoja nanyi
  rationale: Katika muktadha wa karibu, kifungu hiki kinaeleza hali ya Paulo alipokuwa miongoni mwa Wakorintho. Maana inayowezekana ya kuja kwao imehifadhiwa katika tanbihi.
