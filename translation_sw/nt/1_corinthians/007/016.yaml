  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: sw
  text: Kwa maana, mke, wajuaje kama utamwokoa mume wako? Au, mume, wajuaje kama utamwokoa mke wako?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Kwa maana ... wajuaje
  rationale: “Wajuaje” ni njia ya kawaida na yenye hadhi ya kuwasilisha swali la balagha τί ... οἶδας, huku “kwa maana” ikihifadhi nguvu ya γάρ ya kutoa msingi au maelezo yanayohusiana na yaliyotangulia.
- source_word: γύναι
  choice: wewe mke
  rationale: Katika muktadha wa ndoa, γυνή humaanisha mke, si mwanamke kwa ujumla. “Wewe” huonyesha wazi mwito wa moja kwa moja.
- source_word: ἄνερ
  choice: wewe mume
  rationale: Katika muktadha huu wa ndoa, vocative ἄνερ humaanisha mume. “Wewe” huhifadhi uzito wa mwito wa moja kwa moja kwa namna ya asili katika Kiswahili.
- source_word: σώσεις
  choice: utamwokoa
  rationale: Wakati ujao wa kitenzi umehifadhiwa kwa “uta-”. Katika swali lisilo la moja kwa moja lenye maana ya “kama,” kauli hii haithibitishi matokeo bali huacha uwezekano unaoulizwa.
- source_word: τὸν ἄνδρα
  choice: mume wako
  rationale: Ingawa Kigiriki kina nomino yenye kibainishi, uhusiano wa ndoa unaelezwa kwa Kiswahili cha kawaida kwa kiwakilishi milikishi “wako.”
- source_word: τὴν γυναῖκα
  choice: mke wako
  rationale: Kiwakilishi milikishi “wako” kinaeleza kwa kawaida mwenzi anayerejelewa katika mwito huu wa moja kwa moja.
- source_word: ἢ
  choice: Au
  rationale: “Au” huhifadhi kwa urahisi muundo wa maswali mawili yanayolingana.
theological_decisions:
- issue: Maana ya σώσεις katika muktadha wa ndoa
  choice: utamwokoa
  alternative: utamleta kwenye wokovu; utaihifadhi ndoa
  rationale: “Kuokoa” huhifadhi uzito wa maana ya wokovu ya σῴζω bila kuipunguza kuwa tu kumleta mtu kwenye imani au kuihifadhi ndoa. Pia huacha mvutano wa kifundisho na uwezekano wa matokeo kama ulivyo katika sentensi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa “wewe mke/mume” unaweka wazi miito ya moja kwa moja, na “wajuaje” ni matumizi mafupi ya kibiblia yanayoendelea kuwa wazi kwa wasomaji wa kisasa.
