  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: sw
  text: Lakini ikiwa hawawezi kujizuia, na wafunge ndoa; kwa maana ni afadhali kufunga ndoa kuliko kuwaka kwa tamaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuliko kuwaka.” Usemi wa Kigiriki haubainishi wazi kile kinachowaka, lakini katika muktadha huu huenda unamaanisha kuwaka kwa tamaa ya kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: hawawezi kujizuia
  rationale: Katika muktadha wa useja, ndoa, na mahusiano ya kingono, kitenzi hiki kinaonyesha kushindwa kujitawala. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: γαμησάτωσαν
  choice: na wafunge ndoa
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu wingi kwa namna ya Kiswahili yenye hadhi na ya asili.
- source_word: κρεῖττον
  choice: ni afadhali
  rationale: Hutoa maana ya ulinganisho wa jambo linalofaa zaidi kwa Kiswahili cha kawaida.
- source_word: γαμῆσαι
  choice: kufunga ndoa
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kitenzi-jina kinacholingana na amri iliyotangulia.
- source_word: πυροῦσθαι
  choice: kuwaka tamaa
  rationale: Huhifadhi sitiari ya kuwaka huku ikibainisha maana inayodokezwa sana na muktadha wa kujizuia na kufunga ndoa; tanbihi huhifadhi uwezekano wa usemi wa Kigiriki kubaki bila ubainisho huo.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofautishaji mpole na kauli iliyotangulia.
theological_decisions:
- issue: Maana ya πυροῦσθαι katika muktadha
  choice: kuwaka tamaa
  alternative: kuwaka
  rationale: Muktadha wa karibu unahusu kujizuia, useja, na ndoa, hivyo tamaa ya kingono ndiyo maana inayowezekana zaidi. Hata hivyo, kwa kuwa Kigiriki hakitaji neno 'tamaa' waziwazi, tanbihi inahifadhi tafsiri isiyoibainisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kufunga ndoa” limetumiwa badala ya “kuoa” ili kuwahusu wote bila kulazimisha jinsia ambayo umbo la Kigiriki la wingi halibainishi.
