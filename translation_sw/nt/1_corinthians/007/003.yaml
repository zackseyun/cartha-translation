translation:
  language: sw
  text: Mume ampe mkewe haki yake ya ndoa[a], na vivyo hivyo mke ampe mumewe haki yake ya ndoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haki anayostahili”; kwa maana halisi zaidi, “deni/wajibu.” Katika muktadha huu, neno hilo linahusu wajibu wa kimwili ambao wanandoa wanadaiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: mkewe
  rationale: Katika muktadha huu wa maagizo kuhusu ndoa, γυνή humaanisha mke, si mwanamke kwa ujumla.
- source_word: ἀνήρ
  choice: mume
  rationale: Katika ulinganifu huu wa kindoa na γυνή, ἀνήρ humaanisha mume.
- source_word: ὀφειλήν
  choice: haki yake ya ndoa
  rationale: Neno hili kimsingi humaanisha deni au wajibu unaodaiwa. Muktadha wa mistari 2, 4–5 unaonyesha kuwa hapa linahusu wajibu wa kimwili kati ya wanandoa; msemo huu ni wa kawaida na pia unaonyesha kile anachostahili mwenzi, bila kufafanua kupita kiasi.
- source_word: ἀποδιδότω
  choice: na ampe
  rationale: Kauli ya amri ya wakati uliopo inadai utekelezaji wa wajibu unaoendelea; 'na ampe' ni amri ya Kiswahili iliyo wazi, ya asili, na yenye heshima.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Huonyesha usawa na uwiano wa wajibu kati ya mume na mke.
- source_word: δὲ καὶ
  choice: na
  rationale: Kiunganishi hiki kinaongeza kwa mkazo kifungu cha pili; pamoja na 'vivyo hivyo,' tafsiri hii huepuka uradidi usio wa kawaida.
theological_decisions:
- issue: Kiwango cha uwazi katika kutafsiri wajibu unaoonyeshwa na ὀφειλή
  choice: haki yake ya ndoa
  alternative: wajibu anaodaiwa; deni lake; wajibu wa kindoa
  rationale: Muktadha unahusu mahusiano ya kimwili ndani ya ndoa, lakini nomino yenyewe ni pana kuliko maelezo ya moja kwa moja ya tendo la ndoa. 'Haki yake ya ndoa' huhifadhi maana ya kitu kinachodaiwa na kusisitiza wajibu wa pande zote bila kuifanya aya iwe ya kisheria au ya maelezo kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaolingana wa vifungu viwili umehifadhiwa ili kuonyesha wazi usawa wa wajibu wa mume na mke.
