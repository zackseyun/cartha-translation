id: 1CO.7.18
reference: 1 Corinthians 7:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: sw
  text: Je, mtu aliitwa akiwa ametahiriwa? Asijaribu kuficha alama za tohara yake[a]. Je, mtu aliitwa akiwa hajatahiriwa? Asitahiriwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “Asijifanye kuwa hajatohiriwa”—yaani, asijaribu kuficha alama za tohara yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: akiwa ametahiriwa
  rationale: Kauli timilifu inaonyesha hali inayotokana na tendo lililokamilika; Kiswahili hiki kinaeleza hali ya mtu wakati alipoitwa.
- source_word: ἐκλήθη / κέκληταί
  choice: aliitwa
  rationale: Katika muktadha huu, kitenzi kinaelekea kumaanisha kuitwa na Mungu, lakini tafsiri inadumisha neno ‘aliitwa’ badala ya kufafanua kupita kiasi.
- source_word: ἐπισπάσθω
  choice: asijaribu kuondoa alama za tohara
  rationale: Kitenzi kinarejelea jaribio la kuficha au kugeuza kimwili hali ya kutahiriwa; usemi huu unaeleweka kwa msomaji wa sasa huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: ἐν ἀκροβυστίᾳ
  choice: akiwa hajatahiriwa
  rationale: Kirai hiki kinaonyesha hali ya mtu alipokuwa akiitwa; huu ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: περιτεμνέσθω
  choice: asitahiriwe
  rationale: Amri ya wakati uliopo yenye μή ni katazo; ‘asitahiriwe’ inadumisha nguvu yake kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ‘aliitwa’ katika vifungu vyote viwili
  choice: Aliitwa na Mungu akiwa katika hali fulani ya kijamii na kidini
  alternative: Aliitwa kwa maana ya kawaida tu
  rationale: Katika muktadha wa 1 Wakorintho 7, Paulo anazungumzia hali ya mtu wakati Mungu alipomwita. Tafsiri inadumisha uwezekano wa maana katika neno ‘aliitwa’ bila kulibadili kuwa ‘aliongoka’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali mawili yanayolingana umehifadhiwa.
