source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: sw
  text: Lakini, kwa sababu ya matendo ya uasherati[a], kila mwanamume na awe na mke wake mwenyewe, na kila mwanamke na awe na mume wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya uasherati.” Kigiriki kinatumia wingi, unaoweza kurejelea matendo au visa vya uasherati.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Lakini kwa sababu ya
  rationale: διά pamoja na hali ya akusativi huonyesha sababu, na δέ huleta tofauti nyepesi au hatua mpya katika hoja. Tafsiri hii inahifadhi maana zote mbili.
- source_word: τὰς πορνείας
  choice: uasherati wa aina mbalimbali
  rationale: πορνεία humaanisha mwenendo mpotovu wa kingono. Muundo wa wingi wa Kigiriki umeonyeshwa kwa maneno ya kawaida ya Kiswahili ‘wa aina mbalimbali,’ badala ya kutumia wingi usio wa kawaida wa ‘uasherati.’
- source_word: ἕκαστος
  choice: kila mwanamume
  rationale: Umoja wa kiume, ukiwa sambamba na ἑκάστη na maneno γυναῖκα/ἄνδρα, unamlenga mwanamume hapa.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: mke wake mwenyewe
  rationale: γυνή yaweza kuwa ‘mwanamke’ au ‘mke’; katika ulinganifu huu wa kindoa maana ya ‘mke’ ndiyo ya kawaida. ἑαυτοῦ inasisitiza kuwa ni wake mwenyewe.
- source_word: ἐχέτω
  choice: na awe na
  rationale: Amri ya nafsi ya tatu imewasilishwa kwa muundo wa Kiswahili ‘na awe na,’ unaohifadhi nguvu ya agizo bila kuibadili kuwa kitenzi cha wazi cha kuoa au kuolewa.
- source_word: καὶ ἑκάστη
  choice: na kila mwanamke
  rationale: Umoja wa kike wa mgawanyo unasawazisha kishazi cha kwanza na kudumisha ulinganifu wa wanaume na wanawake.
- source_word: τὸν ἴδιον ἄνδρα
  choice: mume wake mwenyewe
  rationale: ἀνήρ hapa humaanisha ‘mume’ kutokana na muktadha wa ndoa na ulinganifu wake na γυναῖκα. ἴδιον inasisitiza kuwa ni wake mwenyewe.
theological_decisions:
- issue: Je, mstari utafsiriwe kuwa ruhusa ya kufunga ndoa ili kuepuka dhambi ya kingono, au kuwa agizo kuhusu uhusiano wa kindoa?
  choice: Kuhifadhi moja kwa moja maneno ‘kila mwanamume na awe na mke wake mwenyewe, na kila mwanamke na awe na mume wake mwenyewe.’
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa ‘kila mmoja anapaswa kuoa au kuolewa,’ au kuwa agizo la kutimiza wajibu wa kindoa.
  rationale: Kigiriki kinatumia ἐχέτω (‘na awe na’), si kitenzi cha wazi cha kuoa/kuolewa wala cha mahusiano ya kindoa. Hivyo tafsiri haipaswi kutatua kimya-kimya mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa ‘na awe na’ umetumiwa kwa amri ya nafsi ya tatu, na ulinganifu wa mwanamume/mwanamke pamoja na mke/mume umehifadhiwa.
