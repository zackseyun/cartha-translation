id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: sw
  text: na wale wanaolia, kama wasiolia[a]; na wale wanaofurahi, kama wasiofurahi; na wale wanaonunua, kama wasiomiliki;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kana kwamba hawalii … kana kwamba hawafurahi … kana kwamba hawamiliki.” Kigiriki kinarudia usemi “kama si” ili kuonyesha namna ya kuishi, si kukana kwamba mambo hayo yanatokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: wanaolia
  rationale: Kitenzi ‘kulia’ kinawakilisha moja kwa moja tendo halisi la kutoa machozi na hakiongezi maana finyu ya kuomboleza.
- source_word: ὡς μὴ κλαίοντες
  choice: kama wasio lia
  rationale: Muundo huu unahifadhi usemi mfupi wa Kigiriki ‘kama si’ na unaeleza namna ya kuishi, bila kukana kwamba kweli wanalia.
- source_word: χαίροντες
  choice: wanaofurahi
  rationale: ‘Kufurahi’ ni neno la kawaida, lenye heshima, linalowasilisha χαίρω kwa uwazi katika muktadha huu.
- source_word: ὡς μὴ χαίροντες
  choice: kama wasio furahi
  rationale: Uamuzi huu unadumisha ulinganifu wa vifungu na mvutano wa usemi wa Paulo bila kuugeuza kuwa katazo la furaha.
- source_word: ἀγοράζοντες
  choice: wanaonunua
  rationale: ‘Kununua’ ndilo neno la kawaida na la moja kwa moja kwa shughuli ya kupata kitu kwa malipo.
- source_word: κατέχοντες
  choice: wasiomiliki
  rationale: Katika mlinganisho na kununua, ‘kumiliki’ huonyesha kuwa na kitu kama mali, huku maana pana za kushika au kuhifadhi zikibaki uwezekano wa kileksika.
- source_word: καὶ
  choice: na
  rationale: Kurudia ‘na’ kunahifadhi mwendo wa mkusanyiko na ulinganifu wa sentensi ya Kigiriki.
theological_decisions:
- issue: Nguvu ya usemi unaorudiwa wa ὡς μὴ pamoja na vitenzi shirikishi
  choice: Kutafsiri kama mwito wa kushughulika na huzuni, furaha na mali bila kuvifanya kuwa mambo ya mwisho au ya kudumu.
  alternative: Kuuelewa kama katazo la kujieleza kwa hisia au la kununua na kumiliki mali.
  rationale: ὡς μὴ inaeleza namna au msimamo wa kuishi, si kukana uhalisi wa kulia, kufurahi au kununua. Muktadha wa 1 Wakorintho 7:26–31 unaweka kauli hii katika hali ya sasa na kupita kwa mfumo wa ulimwengu, lakini tafsiri haifafanui zaidi ya maneno yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Ulinganifu wa vifungu na kurudiwa kwa ‘na’ na ‘kama’ umehifadhiwa. Miundo ‘wasio lia’ na ‘wasio furahi’ imeandikwa kwa kutenganisha kiwakilishi cha uhusiano na kitenzi ili kuepuka maumbo yasiyo ya kawaida, huku ‘wasiomiliki’ likibaki neno moja kwa mujibu wa muundo wa kawaida wa kitenzi.
