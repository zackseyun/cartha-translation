source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: sw
  text: Lakini hata ukioa, hujatenda dhambi; na bikira akiolewa, hajatenda dhambi. Hata hivyo, watu kama hao watapata dhiki katika mwili[a], nami nawahurumia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watapata taabu katika maisha yao ya kimwili.” Usemi huu yaelekea unahusu shida za kidunia au za kimwili zinazohusiana na ndoa, si hasa “asili ya dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nawaepusha.” Paulo anaeleza kusudi lake la kichungaji la kuwaonya ili kuwalinda na dhiki hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: ukioa
  rationale: Katika muktadha wa karibu Paulo anamwelekeza mwanamume kuhusu kutafuta mke; kwa hiyo ‘ukioa’ ni ya kawaida na huhifadhi sharti la wakati ujao.
- source_word: ἥμαρτες
  choice: hujatenda dhambi
  rationale: Kauli hii inakanusha kwamba kuoa ni tendo la dhambi; wakati timilifu wa Kiswahili unaonyesha tathmini hiyo ya kimaadili kwa njia ya kawaida.
- source_word: ἡ παρθένος
  choice: bikira
  rationale: Neno παρθένος linamaanisha kihalisi bikira. Uchaguzi huu unahifadhi hali ya kijinsia iliyotajwa badala ya kuipanua kuwa ‘mwanamke asiyeolewa.’
- source_word: γήμῃ
  choice: akiolewa
  rationale: Kwa bikira wa kike, ‘akiolewa’ ni usemi wa kawaida wa Kiswahili unaowasilisha tendo la kuingia katika ndoa na nguvu ya sharti.
- source_word: θλῖψιν
  choice: dhiki
  rationale: ‘Dhiki’ huweza kuonyesha mashinikizo, taabu, au mateso bila kulazimisha maana maalumu ya dhiki ya nyakati za mwisho.
- source_word: τῇ σαρκὶ
  choice: katika mwili
  rationale: Tafsiri ya karibu inahifadhi neno σάρξ na utata wake, huku tanbihi ikieleza kuwa hapa yaelekea linahusu taabu za maisha ya kimwili au ya duniani, si ‘asili ya dhambi.’
- source_word: οἱ τοιοῦτοι
  choice: watu kama hao
  rationale: Ni Kiswahili cha kawaida kinachorejelea watu wa aina iliyotajwa, yaani wale wanaofunga ndoa, bila kufafanua zaidi ya maandishi.
- source_word: φείδομαι
  choice: ninataka kuwaepusha na hayo
  rationale: Katika muktadha huu kitenzi kinaonyesha kusudi la kichungaji la Paulo la kuwakinga wasipatwe na dhiki hizo. ‘Na hayo’ huweka wazi rejeo linaloeleweka kutokana na sentensi iliyotangulia.
theological_decisions:
- issue: Maana ya σάρξ katika τῇ σαρκί
  choice: ‘katika mwili,’ likirejelea hali halisi ya maisha ya kimwili au ya duniani
  alternative: ‘katika maisha haya’ au ‘katika asili ya dhambi’
  rationale: Muktadha ni onyo kuhusu taabu zinazoweza kuambatana na ndoa, si fundisho kuhusu asili yenye dhambi. Tafsiri ya karibu pamoja na tanbihi huhifadhi usemi wa Paulo bila kuingiza maana ya kimadhehebu.
- issue: Nguvu ya φείδομαι
  choice: ninataka kuwaepusha na hayo
  alternative: ninawaepusha na hayo
  rationale: Kauli inaweza kusomwa kama tendo la sasa au kusudi la Paulo. Tafsiri kuu inawasilisha nia yake ya kichungaji, na tanbihi inahifadhi uwezekano wa kauli ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masharti na urudiaji wa ‘hajatenda dhambi’ umehifadhiwa. ‘Ukioa’ na ‘akiolewa’ ni miundo ya kawaida inayolingana na wahusika wa kiume na wa kike katika muktadha.
