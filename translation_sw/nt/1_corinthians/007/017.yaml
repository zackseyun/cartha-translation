id: 1CO.7.17
reference: 1 Corinthians 7:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: sw
  text: Ila kila mmoja na aishi[b] kulingana na fungu ambalo Bwana amemgawia[a], na kulingana na jinsi Mungu alivyomwita. Hivyo ndivyo ninavyoagiza katika makanisa yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alimwekea sehemu” au “alimpa fungu.” Kitenzi cha Kigiriki kinaweza kumaanisha kugawa, kumpa mtu sehemu, au kumwekea jambo fulani.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “na atembee.” Katika Biblia, “kutembea” hutumiwa mara nyingi kama sitiari ya namna mtu anavyoishi au kuendesha maisha yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Ila
  rationale: Katika muktadha huu ni kiunganishi cha kuweka kanuni yenye ukomo baada ya mjadala uliotangulia, si sentensi sharti ya moja kwa moja. “Ila” ni ya kawaida na huhifadhi nguvu ya ‘isipokuwa/lakini’ bila kufanya Kiswahili kuwa kizito.
- source_word: ἑκάστῳ / ἕκαστον
  choice: kila mmoja ... [aliyemgawia / alivyomwita]
  rationale: “Kila mmoja” huhifadhi msisitizo wa matumizi kwa mtu mmoja mmoja; viambishi vya umoja katika vitenzi vinaendeleza rejeo hilo kwa Kiswahili cha kawaida.
- source_word: ἐμέρισεν
  choice: amemgawia fungu
  rationale: “Amemgawia” huonyesha kitendo cha kumpa mtu sehemu au hali yake. Nomino “fungu” inafanya kirai kisomeke kwa kawaida kwa Kiswahili bila kufafanua kwa undani fungu hilo ni nini.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Hili ni neno la kawaida la Kiswahili kwa κύριος katika matumizi ya Paulo, na linahifadhi cheo tofauti na “Mungu” katika kishazi kinachofuata.
- source_word: κέκληκεν
  choice: alivyomwita
  rationale: Kitenzi “mwita” kinahifadhi maana ya mwito wa Mungu. Muundo huu wa Kiswahili huwasilisha mwito uliotokea ambao bado una umuhimu kwa maisha ya mtu.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya θεός.
- source_word: οὕτως ... οὕτως
  choice: kulingana na ... Hivyo ndivyo
  rationale: Miundo hii inawasilisha namna ya kuishi na pia kurudia kwa οὕτως katika hitimisho, huku ikibaki ya kawaida katika Kiswahili.
- source_word: περιπατείτω
  choice: na aishi
  rationale: Katika muktadha huu “kutembea” ni sitiari ya mwenendo mzima wa maisha. “Na aishi” huwasilisha maana hiyo wazi kwa msomaji wa kawaida; tanbihi huhifadhi sitiari halisi.
- source_word: διατάσσομαι
  choice: ninavyoagiza
  rationale: “Kuagiza” huonyesha mamlaka ya Paulo ya kuweka utaratibu bila kuongeza ukali usiolazimu wa neno kama “kuamuru.”
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: katika makanisa yote
  rationale: “Makanisa” ni neno lililozoeleka kwa jumuiya za waamini za mahali mbalimbali katika muktadha wa Paulo.
theological_decisions:
- issue: Tofauti ya rejeo kati ya “Bwana” na “Mungu”
  choice: 'Kuhifadhi vyeo vyote viwili tofauti: “Bwana amemgawia ... Mungu alivyomwita”'
  alternative: Kuvichukulia vyeo hivyo kama namna mbili za kumrejelea mhusika yuleyule na kuvisawazisha katika tafsiri
  rationale: Kigiriki kimetumia majina mawili tofauti katika vifungu vinavyolingana. Tafsiri haivichanganyi wala kuamua zaidi ya matini uhusiano wa warejelewa hao.
- issue: Sitiari ya kimaadili katika περιπατείτω
  choice: Kutafsiri maana katika matini kama “na aishi,” huku tanbihi ikihifadhi “atembee”
  alternative: Kutumia “na atembee” moja kwa moja katika matini kuu
  rationale: Kwa Kiswahili cha sasa, “aishi” huwasilisha kwa uwazi mwenendo wa maisha unaokusudiwa; tanbihi inaonyesha picha halisi ya Kigiriki bila kuifanya sentensi kuu ionekane kuwa inazungumzia mwendo wa miguu.
- issue: Maana ya fungu alilogawiwa mtu
  choice: Kuacha “fungu” bila kulitambulisha kuwa hali fulani maalumu ya kijamii au ya ndoa
  alternative: Kulifafanua kuwa cheo, hali ya maisha, au mazingira ya kijamii
  rationale: Matini haitaji wazi kilichogawiwa. Kutokulifafanua kunahifadhi upana na mvutano wa kifungu badala ya kuingiza hitimisho la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku marudio, mamlaka ya agizo, tofauti ya “Bwana/Mungu,” na kutotajwa wazi kwa aina ya fungu vikihifadhiwa.
