  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: sw
  text: 'Ninawaambia wale wasio katika ndoa[a] na wanawake wajane: ni vema kwao wakibaki kama nilivyo mimi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume wasiooa”; neno la Kigiriki hapa lina umbo la kiume wingi, ingawa linaweza kutumiwa kwa uwakilishi mpana.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kama nilivyo mimi pia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Nawaambia
  rationale: Kitenzi cha usemi kimetafsiriwa moja kwa moja. δέ hapa ni kiunganishi hafifu cha kuendeleza hoja; hakihitaji kutafsiriwa kwa neno kama “lakini,” ambalo lingeongeza nguvu ya upinzani.
- source_word: τοῖς ἀγάμοις
  choice: wasio katika ndoa
  rationale: ἄγαμος humaanisha mtu asiye katika ndoa. Usemi huu wa Kiswahili ni wa kawaida na unaacha wazi ikiwa kundi hilo ni wanaume pekee au watu wote wasio katika ndoa; umbo la Kigiriki ni la kiume wingi, jambo lililoelezwa katika tanbihi.
- source_word: ταῖς χήραις
  choice: wajane
  rationale: χήρα humaanisha mjane wa kike. Kiswahili “wajane” kinaweza kutumiwa kwa upana zaidi katika matumizi ya sasa, lakini katika muktadha huu linarejelea wanawake waliofiwa na waume zao, kama linavyoelekezwa na umbo la Kigiriki la kike.
- source_word: καλὸν
  choice: ni vema
  rationale: καλόν hapa hueleza jambo lililo jema au linalofaa, si lazima jambo lililo bora kuliko jingine. “Ni vema” huhifadhi upana huo bila kuingiza ulinganisho.
- source_word: αὐτοῖς
  choice: kwao
  rationale: Kiambishi cha yambwa katika αὐτοῖς baada ya καλόν kinatolewa kwa kawaida kwa “kwao.”
- source_word: ἐὰν μείνωσιν
  choice: wakibaki
  rationale: μένω ni kubaki au kuendelea katika hali fulani. “Wakibaki” linaeleweka hapa kuwa kuendelea bila kuwa katika ndoa.
- source_word: ὡς κἀγώ
  choice: kama nilivyo mimi
  rationale: κἀγώ ni muungano wa καὶ ἐγώ, yaani kwa maana halisi “mimi pia.” Kiswahili “kama nilivyo mimi” ni cha asili na huonyesha kwamba Paulo anarejelea hali yake mwenyewe bila kulazimisha maana zaidi.
theological_decisions:
- issue: Upeo wa ἀγάμοις kuhusiana na wajane
  choice: “Wasio katika ndoa” limetumiwa kama kundi pana, huku wajane wakitajwa kando kama katika chanzo.
  alternative: “Wanaume wasiooa,” kwa kufuata umbo la Kigiriki la kiume wingi.
  rationale: Umbo la kiume linaweza kueleweka kuwa wanaume hasa au kutumiwa kwa uwakilishi mpana. Tafsiri kuu haiamui utata huo kimyakimya; uwezekano wa maana ya wanaume pekee umewekwa katika tanbihi.
- issue: Nguvu ya καλὸν katika shauri la Paulo
  choice: “Ni vema”
  alternative: “Ni bora” au “inafaa”
  rationale: Kivumishi cha Kigiriki si cha ulinganisho. “Ni bora” kingeongeza dai la kulinganisha ambalo halijaonyeshwa wazi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Ni vema” na “wakibaki” huhifadhi ushauri wa kifungu bila kuufanya kuwa amri au ulinganisho. Alama zote za tanbihi zimewekwa katika matini kuu.
