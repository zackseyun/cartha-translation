  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kigiriki: Δοῦλος ni “mtumwa”; ἐκλήθης ni “uliitwa”; μή σοι μελέτω inaelezwa kwa kawaida kama kutosumbuliwa; na ἐλεύθερος γενέσθαι ni “kuwa huru.” “Tumia nafasi hiyo” hufanya kitu kisichotajwa cha χρῆσαι kieleweke kutokana na kishazi kilichotangulia, huku tanbihi ikihifadhi kwa usahihi utata wa kisarufi na wa kihistoria wa μᾶλλον χρῆσαι.'
