  terminology: “Mtumwa” ni chaguo sahihi kwa δοῦλος katika muktadha unaotaja uwezekano wa kupewa au kupata uhuru. “Huru” na “nafasi hiyo” vinaeleweka vizuri. Tanbihi inatumia istilahi wazi na haikulazimishi usomaji mmoja wa kifungu chenye utata.
