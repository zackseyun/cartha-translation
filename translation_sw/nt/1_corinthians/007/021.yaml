  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: sw
  text: Je, uliitwa ukiwa mtumwa? Usisumbuke kwa sababu hiyo. Lakini ikiwa kweli unaweza kuwa huru, tumia nafasi hiyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “endelea kuitumia hali yako ya sasa,” yaani, baki kama ulivyo. Katika Kigiriki, kitu kinachopaswa ‘kutumiwa’ hakitajwi wazi, hivyo maneno hayo yameeleweka kwa njia zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha hali ya mtu aliyefungwa katika utumwa, si mtumishi wa kawaida; muktadha wa uwezekano wa kuwa huru unathibitisha maana hiyo.
- source_word: ἐκλήθης
  choice: uliitwa
  rationale: Limedumisha usemi wa Kigiriki bila kuongeza wazi ‘na Mungu’ au ‘kuja katika imani,’ ingawa muktadha wa Paulo unaashiria mwito wa Mungu.
- source_word: μή σοι μελέτω
  choice: Usisumbuke kwa sababu hiyo
  rationale: Usemi huu unakataza hali hiyo kuwa chanzo cha hangaiko; tafsiri hii ni ya kawaida na yenye sauti ya kichungaji katika Kiswahili.
- source_word: ἐλεύθερος γενέσθαι
  choice: kuwa huru
  rationale: Inaonyesha kubadilika kutoka hali ya utumwa hadi uhuru kwa lugha ya moja kwa moja na ya asili.
- source_word: μᾶλλον χρῆσαι
  choice: tumia nafasi hiyo
  rationale: Kitenzi kinamaanisha ‘tumia’ lakini kitu kinachotumiwa hakitajwi. Katika matini kuu, ‘nafasi hiyo’ inaelekezwa kwa uwezekano wa kupata uhuru uliotajwa mara moja kabla; utata halisi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Utata wa μᾶλλον χρῆσαι
  choice: Paulo anamhimiza mtumwa kutumia nafasi ya kuwa huru ikiwa inapatikana.
  alternative: Paulo anamwambia aitumie hali yake ya sasa, yaani aendelee kuwa mtumwa.
  rationale: Muundo wa karibu zaidi unaelekeza kwenye uwezekano wa kuwa huru, lakini Kigiriki hakitaji kitu cha kitenzi ‘tumia.’ Kwa hiyo usomaji mkuu umetolewa katika matini na usomaji mwingine wenye ushahidi wa kihistoria umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mtumwa’ limetumiwa badala ya ‘mtumishi’ ili kuonyesha wazi hali ya utumwa inayokabiliwa na uwezekano wa kupata uhuru.
