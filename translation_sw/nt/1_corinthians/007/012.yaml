base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: sw
  text: Lakini kwa wale wengine nasema mimi—si Bwana—ikiwa ndugu yeyote ana mke asiyeamini, na mke huyo anakubali kuishi naye, asimwache[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asimfukuze.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kihalisi kuwa “kumwacha” au “kumfukuza,” lakini hapa kinahusu kuvunja ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Lakini kwa wale wengine
  rationale: Neno δέ linaonyesha mpito wenye tofauti ndogo, na λοιποί ni wale waliobaki ambao hali yao haikushughulikiwa katika maagizo yaliyotangulia.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: nasema mimi—si Bwana—
  rationale: Kiwakilishi ἐγώ chenye mkazo kimeonyeshwa wazi kwa “mimi.” Muundo huu unadumisha tofauti kati ya agizo la Paulo na neno la moja kwa moja la Bwana bila kudokeza kuwa agizo hilo halina mamlaka.
- source_word: ἀδελφὸς
  choice: ndugu yeyote
  rationale: Katika sentensi hii nomino ya kiume inamtaja hasa mwanamume mwamini, kwa kuwa inalinganishwa na “mke.” “Ndugu” ni istilahi ya kawaida ya Kikristo na inadumisha jinsia ya rejeleo.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: ana mke asiyeamini
  rationale: ἔχει γυναῖκα ni usemi wa uhusiano wa ndoa. “Mke asiyeamini” huonyesha kwamba ἄπιστον hapa ni kutokuwa na imani ya Kikristo, si kutokuwa mwaminifu katika ndoa.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: naye anakubali
  rationale: συνευδοκέω huonyesha kukubali kwa hiari au kuridhia hali inayopendekezwa; “anakubali” ni ya sasa, ya kawaida, na wazi.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: kuishi pamoja naye
  rationale: Kitenzi οἰκέω pamoja na μετά kinamaanisha kuendelea kushiriki maisha ya nyumbani; “kuishi pamoja naye” ni Kiswahili cha kawaida na sahihi.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: asimwache
  rationale: ἀφίημι inaweza kumaanisha kumwacha au kumfukuza mwenzi, na katika muktadha huu inahusu kuvunja ndoa. “Asimwache” inadumisha upana wa kitenzi cha Kigiriki, huku tanbihi ikifafanua maana yake ya kindoa.
theological_decisions:
- issue: Kauli ya Paulo “mimi—si Bwana”
  choice: Kudumisha tofauti kati ya agizo la Paulo na neno la moja kwa moja la Bwana
  alternative: Kuifanya ionekane kuwa ni maoni binafsi ya Paulo yasiyo na mamlaka
  rationale: Muktadha unatofautisha mafundisho ya Yesu yaliyotolewa moja kwa moja na matumizi ya kitume kwa hali ambayo Yesu hakuitaja wazi. Tafsiri haiongezi ufafanuzi wa kimadhehebu wala kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “nasema mimi—si Bwana—” umehifadhi mkazo na hali ya kishazi cha katikati; “asimwache” ni wa kawaida kwa wasomaji huku tanbihi ikizuia kueleweka kama kuondoka kwa muda tu.
