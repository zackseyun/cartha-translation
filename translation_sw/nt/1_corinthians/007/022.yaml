  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: sw
  text: Kwa maana yule aliyeitwa katika Bwana akiwa mtumwa ni mtu wa Bwana aliyeachiliwa huru[a]; vivyo hivyo, yule aliyeitwa akiwa mtu huru ni mtumwa wa Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huru wa Bwana.” Neno la Kigiriki humaanisha hasa mtu aliyeachiliwa kutoka utumwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha hali halisi ya utumwa, ambayo ni muhimu kwa mlinganisho wa Paulo kati ya mtumwa aliyewekwa huru na mtu huru aliye mtumwa wa Masihi.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Muundo huu unahifadhi wazo la Paulo la kuitwa katika uhusiano au umoja na Bwana bila kulifafanua kupita kiasi.
- source_word: κληθεὶς
  choice: aliyeitwa
  rationale: Huhifadhi maana ya tendo la kuitwa lililompata mtu na pia huleta Kiswahili cha kawaida katika sentensi ya uhusiano.
- source_word: ἀπελεύθερος
  choice: mtu aliyewekwa huru
  rationale: Neno la Kigiriki humaanisha hasa mtu aliyeachiliwa kutoka utumwani; usemi huu wa Kiswahili ni wazi na wa sasa kuliko istilahi adimu ya kisheria.
- source_word: κυρίου
  choice: na Bwana
  rationale: Katika Kiswahili, ‘aliyewekwa huru na Bwana’ huonyesha kwa kawaida kwamba Bwana ndiye aliyemweka huru; tanbihi inataja uwezekano wa kuelewa genitivi kama uhusiano wa kuwa mali ya Bwana.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Huhifadhi uwiano wa kimantiki na wa kibalagha kati ya sehemu mbili za aya.
- source_word: ἐλεύθερος
  choice: mtu huru
  rationale: Hutoa kwa uwazi hadhi ya kijamii inayotofautishwa na utumwa huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta; ‘Masihi’ huhifadhi wazi maana hiyo katika Kiswahili.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi cheo chenye uzito wa kiteolojia badala ya kukipunguza kuwa uhusiano wa kawaida wa bwana na mtumwa.
theological_decisions:
- issue: Mkinzano wa hadhi ya kijamii na uhusiano wa kiroho
  choice: Kudumisha maneno makali ‘mtumwa,’ ‘aliyewekwa huru,’ na ‘mtumwa wa Masihi.’
  alternative: Kutumia ‘mtumishi’ au kusema kwa jumla ‘mtu huru.’
  rationale: Paulo anakusudia kuonyesha kwamba hadhi ya kidunia inageuzwa kimtazamo na uhusiano wa mtu na Bwana; kulainisha maneno kungepunguza nguvu ya mkinzano huo.
- issue: Maana ya genitivi κυρίου pamoja na ἀπελεύθερος
  choice: Katika matini, ‘aliyewekwa huru na Bwana,’ huku tanbihi ikihifadhi ‘mtu huru wa Bwana.’
  alternative: ‘Mtu huru wa Bwana’ katika matini kuu.
  rationale: Genitivi inaweza kueleweka kuwa Bwana ndiye aliyemweka huru au kwamba mtu huyo ni mwachwa huru anayehusiana na Bwana. Kiswahili cha matini kuu kinasomeka kwa kawaida, na tanbihi inalinda utata halisi.
- issue: Tafsiri ya cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huonyesha wazi kuwa neno hili ni cheo cha Mtiwa-Mafuta, bila kulichukulia tu kama jina.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa aya unadumisha uwiano wa sehemu mbili na mkinzano wa Paulo bila kutumia istilahi nzito zisizoeleweka kwa wasomaji wa kawaida.
