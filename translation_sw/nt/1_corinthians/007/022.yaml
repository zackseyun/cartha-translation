- from: Kwa maana yule aliyeitwa katika Bwana akiwa mtumwa ni mtu aliyewekwa huru na Bwana[a]; vivyo hivyo, yule aliyeitwa akiwa mtu huru ni mtumwa wa Masihi.
  to: Kwa maana yule aliyeitwa katika Bwana akiwa mtumwa ni mtu wa Bwana aliyeachiliwa huru[a]; vivyo hivyo, yule aliyeitwa akiwa mtu huru ni mtumwa wa Masihi.
  rationale: The revision preserves the lexical specificity of ἀπελεύθερος while representing κυρίου as a possessive/relational genitive rather than explicitly as the agent of release. The verse’s deliberate reversal between a socially enslaved person who is free in relation to the Lord and a socially free person who belongs as Messiah’s slave remains clear.
