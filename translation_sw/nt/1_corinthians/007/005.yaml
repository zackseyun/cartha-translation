id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: sw
  text: Msinyimane[a], isipokuwa labda kwa makubaliano ya wote wawili kwa muda, ili mjitoe kwa sala. Kisha muwe pamoja tena[b], ili Shetani asiwajaribu kwa sababu ya kushindwa kwenu kujizuia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msizuiliane.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “muwe pamoja tena”; katika muktadha, kirai hiki kinaelekea kurejelea kurejea umoja wa maisha ya mume na mke, huenda kutia ndani mahusiano ya kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: msinyimane
  rationale: Katika muktadha wa ndoa, kitenzi hiki kinamaanisha kumnyima mwenzi kile kinachomstahili. “Msinyimane” ni cha asili, kinaonyesha tendo la pande zote, na kinahifadhi uzito wa maadili wa agizo bila kuingiza maana ya kibiashara.
- source_word: ἀλλήλους
  choice: -nyimane
  rationale: Umbo la kutendeana katika “msinyimane” linawasilisha maana ya “ninyi kwa ninyi” kwa Kiswahili cha kawaida bila kurudia maneno yasiyohitajika.
- source_word: εἰ μήτι ἂν
  choice: isipokuwa labda
  rationale: Maneno haya yanaanzisha uwezekano wa hali ya pekee kwa namna yenye tahadhari. “Isipokuwa labda” kinahifadhi nguvu hiyo badala ya kufanya ruhusa iwe ya moja kwa moja kabisa.
- source_word: ἐκ συμφώνου
  choice: kwa makubaliano ya wote wawili
  rationale: Kirai hiki kinahitaji ridhaa ya pamoja ya wanandoa. “Ya wote wawili” kinaweka wazi kwamba uamuzi haupaswi kufanywa na upande mmoja.
- source_word: πρὸς καιρόν
  choice: kwa muda
  rationale: Kinamaanisha kipindi chenye kikomo; “kwa muda” ni cha sasa, cha kawaida, na hakidokezi kutengana kwa kudumu.
- source_word: σχολάσητε
  choice: mjitoe
  rationale: Hapa kitenzi kinamaanisha kuweka nafasi na kujishughulisha kwa makusudi na jambo fulani. “Mjitoe” huonyesha kujielekeza kwa dhati bila tafsiri ngumu ya neno kwa neno.
- source_word: τῇ προσευχῇ
  choice: kwa sala
  rationale: Nomino ya umoja inarejelea shughuli ya kusali kwa ujumla. “Kwa sala” inaungana kwa kawaida na “mjitoe.”
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: muwe pamoja tena
  rationale: Kirai hiki kinamaanisha kurudia umoja wa maisha ya ndoa, na katika muktadha kinahusisha mahusiano ya kimwili. Tafsiri hii inadumisha usemi wa staha na kutotaja wazi zaidi kuliko Kigiriki.
- source_word: πειράζῃ
  choice: asiwajaribu
  rationale: Kwa kuwa mtendaji ni Shetani na muktadha ni hatari ya dhambi, maana hapa ni kushawishi kutenda dhambi, si kupima kwa hali isiyoegemea upande wowote.
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili cha Biblia na linadumisha rejeo kwa nafsi binafsi.
- source_word: ἀκρασίαν
  choice: kushindwa kwenu kujizuia
  rationale: Nomino inaonyesha kutokuwa na uwezo wa kutawala tamaa. Usemi huu ni wazi katika Kiswahili cha sasa na unafaa muktadha wa ngono kuliko maneno ya kitabibu au ya kizamani.
theological_decisions:
- issue: Iwapo πάλιν ἐπὶ τὸ αὐτὸ ἦτε itajwe wazi kuwa kurudia mahusiano ya ngono au ibaki kuwa kurudi pamoja
  choice: muwe pamoja tena
  alternative: muanze tena mahusiano ya kimwili
  rationale: Muktadha unaelekeza kwenye kurudia mahusiano ya ndoa, labda hasa tendo la ndoa, lakini Kigiriki kinatumia usemi wa staha usio wa moja kwa moja. Tafsiri inadumisha staha na upana huo.
- issue: Iwapo ὁ Σατανᾶς itafsiriwe kama jina la nafsi binafsi au kama jina la jumla “mpinzani”
  choice: Shetani
  alternative: mpinzani
  rationale: Katika matumizi haya ya Paulo, Σατανᾶς ni jina la kiumbe binafsi, si nguvu ya upinzani isiyo na nafsi. Umbo la kawaida “Shetani” linahifadhi rejeo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Usemi ni wa moja kwa moja lakini unadumisha kutotaja wazi mambo ya kimwili kama ilivyo katika Kigiriki. Sentensi imegawanywa baada ya “sala” ili isomeke kwa urahisi bila kubadili uhusiano wa kimantiki.
