  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: sw
  text: na wale wanaotumia ulimwengu, kama wasiou­tumia kikamilifu[a]; kwa maana sura ya sasa[b] ya ulimwengu huu inapita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kana kwamba hawautumii kwa ukamilifu”; kitenzi hiki kinaweza pia kumaanisha “kutumia vibaya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hali ya nje” au “mtindo” wa ulimwengu huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: wanaoutumia
  rationale: Kitenzi hiki kwa kawaida humaanisha ‘kutumia’ au ‘kufanya matumizi ya.’ Tafsiri hii ni ya moja kwa moja na inaendeleza mchezo wa maneno unaofuata.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Hapa neno hili linahusu ulimwengu katika mpangilio wake wa sasa wa kijamii na wa kimwili. ‘Ulimwengu’ ni tafsiri ya moja kwa moja isiyoongeza ufafanuzi usio katika matini.
- source_word: ὡς μὴ καταχρώμενοι
  choice: wawe kama wasioutumia kikamilifu
  rationale: καταχράομαι inaweza kumaanisha kutumia kikamilifu, kutumia kupita kiasi, au kutumia vibaya. ‘Kutumia kikamilifu’ huhifadhi nguvu ya kitenzi ikilinganishwa na χράομαι bila kuamua kwamba maana kuu hapa ni matumizi mabaya.
- source_word: παράγει
  choice: inapita
  rationale: Wakati wa sasa wa kitenzi unaonyesha tendo linaloendelea; ‘inapita’ huonyesha kwamba hali hii si ya kudumu.
- source_word: τὸ σχῆμα
  choice: sura ya sasa
  rationale: σχῆμα huonyesha sura, hali ya nje, au mpangilio uliopo. ‘Sura ya sasa’ ni Kiswahili cha kawaida na hudokeza hali ya mpito bila kudai kuwa ni asili ya ulimwengu yenyewe.
- source_word: τοῦ κόσμου τούτου
  choice: ya ulimwengu huu
  rationale: Kiwakilishi τούτου kimehifadhiwa kwa ‘huu,’ kikisisitiza ulimwengu katika hali yake ya sasa.
theological_decisions:
- issue: Maana ya καταχρώμενοι kwa kulinganisha na χρώμενοι
  choice: Waumini wautumie ulimwengu bila kuutumia kikamilifu kana kwamba ndio kitu chao cha mwisho.
  alternative: Waumini wasiutumie vibaya ulimwengu; au wawe kana kwamba hawautumii kabisa.
  rationale: Jozi χρώμενοι/καταχρώμενοι ina mchezo wa maneno kati ya ‘kutumia’ na ‘kutumia kikamilifu.’ Tafsiri kuu huhifadhi tofauti hiyo, huku tanbihi ikitaja maana nyingine halali.
- issue: Maana ya σχῆμα
  choice: Sura au mpangilio wa sasa wa ulimwengu ni wa mpito.
  alternative: Ni mwonekano wa nje pekee unaopita; au asili yenyewe ya ulimwengu ndiyo inayopita.
  rationale: σχῆμα huelekea kumaanisha hali, sura, au mpangilio unaoonekana, si lazima asili ya kitu. ‘Sura ya sasa’ huhifadhi upeo huo bila kutatua mvutano wa kitheolojia kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘wawe kama’ unaendeleza mfululizo wa mahimizo katika muktadha, huku ‘kikamilifu’ na tanbihi vikihifadhi utata wa καταχράομαι.
