  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: sw
  text: 'Kwa wale walio katika ndoa ninawaagiza—si mimi[a], bali Bwana: mke asitengane na mume wake—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asitalikiane na mume wake.” Kitenzi cha Kigiriki kinaweza kueleweka kuwa kutengana katika ndoa, ambako katika muktadha huu kinaweza kujumuisha talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Lakini wale walio katika ndoa
  rationale: Kirai hiki kinawataja watu walio katika hali ya ndoa. “Wale walio katika ndoa” ni Kiswahili cha kawaida na chenye heshima; δέ imetafsiriwa “Lakini” ili kuonyesha mpito wenye utofautishaji katika hoja.
- source_word: παραγγέλλω
  choice: ninawaagiza
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “ninawaagiza” ni cha moja kwa moja na cha asili.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: si mimi, bali Bwana
  rationale: Huhifadhi msisitizo na utofautishaji wa Kigiriki bila kuongeza ufafanuzi kuhusu asili ya mamlaka ya Paulo.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: mke ... na mume wake
  rationale: Katika muktadha wa ndoa, γυνή na ἀνήρ humaanisha mke na mume. Umilikishi “wake” huonyesha uhusiano kwa Kiswahili cha kawaida.
- source_word: μὴ χωρισθῆναι
  choice: asitengane
  rationale: “Asitengane” huhifadhi wazo pana la kutengana kwa wanandoa bila kulibana kuwa talaka ya kisheria pekee.
theological_decisions:
- issue: Maana ya “si mimi, bali Bwana”
  choice: Kauli imeachwa kwa namna ya moja kwa moja, ikitofautisha agizo la Bwana na maneno ya Paulo.
  alternative: Kuifafanua kama tofauti kati ya maneno yenye uvuvio na yasiyo na uvuvio.
  rationale: Andiko lenyewe halisemi kwamba Paulo hana mamlaka; tafsiri haipaswi kuingiza hitimisho hilo wala kuondoa mvutano wa kauli.
- issue: Upeo wa χωρισθῆναι katika ndoa
  choice: asitengane
  alternative: asimpe talaka
  rationale: Neno la Kigiriki linaweza kuhusisha kutengana na, katika muktadha fulani, talaka. “Asitengane” huhifadhi upana wa maana na kuendana na mwendelezo wa mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mstari unaishia kwa kistari kirefu kwa sababu sentensi inaendelea katika mstari wa 11.
