id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: sw
  text: Mke hana mamlaka juu ya mwili wake mwenyewe[a], bali mumewe ndiye aliye nayo; vivyo hivyo, mume hana mamlaka juu ya mwili wake mwenyewe, bali mkewe ndiye aliye nayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatumii mamlaka juu ya.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwa na mamlaka au kuitumia; hapa mamlaka hiyo inaelezwa kwa usawa kati ya wanandoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mke
  rationale: Katika muktadha wa ndoa katika 1 Wakorintho 7, neno hili linamtaja mwanamke aliyeolewa, kwa hiyo “mke” ni sahihi kuliko “mwanamke” kwa ujumla.
- source_word: ἀνήρ
  choice: mume
  rationale: Kwa kuwa limeoanishwa na γυνή katika muktadha wa ndoa, hapa linamaanisha “mume,” si “mwanamume” kwa ujumla.
- source_word: ἰδίου σώματος
  choice: mwili wake mwenyewe
  rationale: Huhifadhi mkazo wa ἴδιος juu ya kile kilicho cha mtu mwenyewe na ni usemi wa kawaida wa Kiswahili.
- source_word: ἐξουσιάζει
  choice: hana mamlaka juu ya
  rationale: Kitenzi kinaweza kumaanisha kuwa na mamlaka au kuitumia. Usemi huu huhifadhi maana ya moja kwa moja na uwiano wa mamlaka kati ya wanandoa bila kuongeza wazo la mabavu.
- source_word: ἀλλά
  choice: bali
  rationale: “Bali” huonyesha kwa uwazi tofauti kati ya mtu kutokuwa na mamlaka juu ya mwili wake mwenyewe na mwenzi wake kuwa nayo.
- source_word: ὁμοίως δὲ καὶ
  choice: vivyo hivyo
  rationale: Usemi huu wa asili unaanzisha kauli sambamba inayosisitiza kwamba jambo hilo linawahusu wanandoa wote kwa usawa; “vivyo hivyo” ni ya asili na inatosha katika Kiswahili.
theological_decisions:
- issue: Asili ya mamlaka ya kindoa katika mstari huu
  choice: Kauli imetafsiriwa kwa lugha ya mamlaka ya pande zote mbili, huku muundo sambamba wa mstari ukihifadhiwa.
  alternative: Kutafsiri kwa udhaifu zaidi kuwa mwili “si mali yake,” au kwa nguvu zaidi kuwa mwenzi “ana udhibiti” wa mwili wa mwenzake.
  rationale: 'Maneno ya Paulo yanasisitiza hali ya pande mbili: kila mwenzi hana mamlaka juu ya mwili wake mwenyewe, bali mwenzake anayo. Tafsiri haiongezi utawala wa upande mmoja wala wazo la kulazimisha ambalo halijasemwa katika maandishi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mumewe” na “mkewe” zinaonyesha wazi uhusiano wa ndoa; “ndiye aliye nayo” huepuka kurudia neno “mamlaka” huku ikihifadhi ulinganifu wa sentensi.
