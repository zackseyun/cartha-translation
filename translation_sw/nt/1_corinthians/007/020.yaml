  text: Kila mmoja na abaki katika wito ule aliokuwa nao alipoitwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hali,” “mazingira,” au “nafasi maishani.” Kigiriki kinasema “wito,” likirudia mzizi uleule unaopatikana katika “alipoitwa” katika mstari huohuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Kila mmoja
  rationale: 'Inahifadhi maana ya mgawanyo ya umoja: agizo linamhusu kila mwamini mmoja mmoja.'
- source_word: κλήσει
  choice: wito
  rationale: Neno hili linatafsiriwa kwa maana yake ya msingi ili kuhifadhi mwangwi wa kimakusudi na kitenzi ἐκλήθη (‘aliitwa’). Katika muktadha linaweza pia kuelekeza kwenye hali au nafasi ya mtu maishani.
- source_word: ᾗ ἐκλήθη
  choice: ule alioitiwa
  rationale: Muundo huu unahifadhi uhusiano kati ya ‘wito’ na ‘aliitiwa’ bila kumtaja wazi Mungu, ambaye anaeleweka kuwa ndiye mwitaji katika kauli hii tendwa.
- source_word: ἐν ταύτῃ
  choice: katika wito ule
  rationale: Kiwakilishi elekezi kinarejelea wito uliotajwa; Kiswahili kinahitaji kurejesha nomino ili sentensi iwe wazi na ya kawaida.
- source_word: μενέτω
  choice: na abaki
  rationale: Huwakilisha amri ya wakati uliopo yenye wazo la kuendelea kukaa katika hali hiyo, kwa mtindo wenye heshima na unaoeleweka.
theological_decisions:
- issue: Maana ya κλῆσις katika muktadha
  choice: Kuhifadhi ‘wito’ katika maandishi makuu
  alternative: hali, mazingira, au nafasi maishani
  rationale: Muktadha unahusu hali kama tohara na utumwa, lakini Paulo ameunganisha kwa makusudi κλήσει na ἐκλήθη. ‘Wito’ huhifadhi mvutano kati ya mwito wa Mungu na hali ya maisha ambamo mtu aliitwa.
- issue: Umoja wa kiume katika Kigiriki
  choice: Kutumia ‘kila mmoja’ kwa maana jumuishi
  alternative: kila mtu
  rationale: Kigiriki kina umbo la umoja wa kiume linalotumiwa kwa uwakilishi. Kiswahili hakilazimishi kiwakilishi cha jinsia hapa; ‘kila mmoja’ huhifadhi umoja wa mgawanyo bila kuzuia matumizi yake kwa waamini wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘na abaki’ una nguvu ya agizo bila kuwa mkali kupita kiasi; uradidi wa ‘wito/aliitiwa’ umehifadhiwa kwa sababu ni sehemu ya hoja ya Kigiriki.
