  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: sw
  text: Kwa hiyo, yule anayemwoza bikira wake[a] anafanya vema, naye yule asiyemwoza atafanya vizuri zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayemwoa mchumba wake ambaye ni bikira anafanya vema, naye yule asiyemwoa atafanya vizuri zaidi.” Tafsiri nyingine ya kawaida ni “binti yake bikira.” Kitenzi cha Kigiriki hapa kwa kawaida zaidi humaanisha “kumwoza”; kwa hiyo, maandishi makuu yanahifadhi maana hiyo bila kutaja kwa uhakika uhusiano maalumu kati yake na bikira huyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa lugha ya kawaida na yenye heshima.
- source_word: γαμίζων
  choice: anayemwoza
  rationale: Kitenzi γαμίζω kina maana ya kisababishi, yaani kumpa mtu aolewe, tofauti na maana rahisi ya kuoa; ‘kumwoza’ ni kitenzi cha kawaida cha Kiswahili kinachohifadhi maana hiyo.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: bikira aliye chini ya mamlaka yake
  rationale: παρθένος ni ‘bikira,’ huku ἑαυτοῦ ikionyesha uhusiano wake na mwanamume huyo. Kiswahili hakiwezi kusema kwa kawaida ‘bikira wake mwenyewe’ bila kudokeza mke au mchumba; ufafanuzi huu unaacha uhusiano mahsusi wazi huku ukionyesha jukumu linalodhaniwa na kitendo cha kumwoza.
- source_word: καλῶς ποιεῖ
  choice: anafanya vema
  rationale: Huhifadhi tathmini chanya ya Kigiriki bila kuifanya kuwa amri kamili.
- source_word: μὴ γαμίζων
  choice: asiyemwoza
  rationale: Inadumisha maana ileile ya kisababishi na kurejelea bikira aliyetajwa katika kishazi cha kwanza.
- source_word: κρεῖσσον ποιήσει
  choice: atafanya vizuri zaidi
  rationale: κρεῖσσον ni hali ya kulinganisha, si kiwango cha juu kabisa; ‘vizuri zaidi’ huhifadhi ulinganisho huo.
theological_decisions:
- issue: Utambulisho wa τὴν παρθένον ἑαυτοῦ na maana ya γαμίζω
  choice: Maandishi makuu yanahifadhi maana ya ‘kumwoza’ na hayasemi wazi kuwa bikira huyo ni binti, mleziwaji, au mchumba.
  alternative: ‘anayemwoa mchumba wake bikira’; au ‘anayemwoza binti yake bikira’
  rationale: γaμίζω kwa kawaida huunga mkono maana ya kisababishi ‘kumpa aolewe,’ lakini uhusiano halisi wa bikira huyo na mwanamume unajadiliwa. Tafsiri haipaswi kuamua kimya-kimya suala ambalo Kigiriki hakiliweki wazi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kumwoza’ ni neno la kawaida na sahihi kwa kumpa mwanamke aolewe. Kirai ‘aliye chini ya mamlaka yake’ kinatumika kwa tahadhari ili kuepuka Kiswahili kisicho cha kawaida ‘bikira wake’ na kutotaja moja kwa moja kuwa ni binti au mchumba.
