  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: sw
  text: Lakini mwanamume aliyeoa hushughulika na mambo ya ulimwengu[a], jinsi ya kumpendeza mke wake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo ya maisha ya kawaida” au “shughuli za ulimwengu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Lakini mwanamume aliyeoa
  rationale: Kirai hiki cha Kiyunani kinamtaja mwanamume aliye katika ndoa na kumtofautisha na asiyeoa katika muktadha. ‘Mwanamume aliyeoa’ ni Kiswahili cha kawaida na huhifadhi umoja na jinsia ya kisarufi.
- source_word: μεριμνᾷ
  choice: hushughulika na
  rationale: Kitenzi kinaweza kumaanisha kuwa na wasiwasi, kujali, au kushughulika na jambo. Hapa kinaeleza mahangaiko au majukumu ya ndoa bila kudokeza lazima wasiwasi wenye dhambi.
- source_word: τὰ τοῦ κόσμου
  choice: mambo ya ulimwengu
  rationale: Kirai kinarejelea mambo ya maisha ya kawaida katika ulimwengu. Tafsiri hii ni ya asili katika Kiswahili na haiyafanyi mambo hayo yaonekane kuwa maovu yenyewe.
- source_word: πῶς ἀρέσῃ
  choice: jinsi ya kumpendeza
  rationale: 'Kirai kinaonyesha jambo linalomshughulisha: namna ya kumpendeza mke wake. ‘Jinsi ya’ ni ya kawaida na huhifadhi wazo la namna au njia.'
- source_word: τῇ γυναικί
  choice: mke wake
  rationale: Katika muktadha wa ndoa, γυνή humaanisha ‘mke.’ Kiwakilishi ‘wake’ huweka wazi uhusiano unaoeleweka katika Kiyunani na ni cha asili katika Kiswahili.
theological_decisions:
- issue: Iwapo κόσμος hapa ina maana hasi ya kimaadili
  choice: Imetafsiriwa kwa maana isiyoegemea upande wa kimaadili kuwa ‘mambo ya ulimwengu.’
  alternative: ‘Mambo ya kidunia,’ ambayo yanaweza kusikika kama lawama ya kimaadili.
  rationale: Katika muktadha Paulo anatofautisha majukumu ya maisha ya ndoa na kujitoa kwa Bwana bila kugawanyika; hailazimu kwamba analaani ndoa au majukumu ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hushughulika na’ huepuka kuingiza lawama kali ya wasiwasi, huku ‘mambo ya ulimwengu’ kikihifadhi upana na mvutano wa usemi wa Kiyunani.
