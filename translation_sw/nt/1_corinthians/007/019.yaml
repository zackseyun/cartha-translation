id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: sw
  text: Kutahiriwa si kitu[a], na kutotahiriwa si kitu, bali kushika amri za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna maana yoyote,” hapa na katika sehemu ya pili yenye maneno “si kitu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: kutahiriwa
  rationale: Nomino ya kitenzi ni ya asili na wazi katika Kiswahili, nayo inadumisha wazo la hali ya kuwa umetahiriwa katika ulinganisho wa Paulo.
- source_word: οὐδέν ἐστιν
  choice: si kitu
  rationale: Kauli hii fupi na yenye mkazo inafuata muundo wa Kigiriki na inadumishwa katika sehemu zote mbili; maana mbadala ya kimuktadha imewekwa katika tanbihi.
- source_word: ἀκροβυστία
  choice: kutotahiriwa
  rationale: Hili ni kinyume cha moja kwa moja cha “kutahiriwa” na linahifadhi ulinganifu wa kisanaa wa sentensi.
- source_word: ἀλλά
  choice: bali
  rationale: “Bali” linaonyesha kwa kawaida utofautishaji wenye nguvu kati ya hali hizo mbili na jambo linalopewa uzito.
- source_word: τήρησις
  choice: kushika
  rationale: “Kushika amri” ni usemi wa kawaida wa kibiblia na wa Kiswahili unaowasilisha maana ya kuzifuata au kuzitii bila kuigeuza nomino hii kuwa maelezo mapana zaidi.
- source_word: ἐντολῶν θεοῦ
  choice: amri za Mungu
  rationale: Huhifadhi wingi halisi wa “amri” na uhusiano wa umilikaji unaoonyeshwa na θεοῦ kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Tathmini ya Paulo kuhusu kutahiriwa na kutotahiriwa
  choice: Mstari huu unasema kwamba kutahiriwa na kutotahiriwa si mambo yenye uzito katika ulinganisho huu, bali kushika amri za Mungu ndiko kunakotofautishwa navyo.
  alternative: Kueleza kwamba tohara haina umuhimu wowote wa kimaadili katika kila maana na kila mazingira.
  rationale: Kigiriki kinaita hali zote mbili “si kitu” kisha kinazitofautisha na kushika amri za Mungu. Tafsiri inadumisha mkazo na mvutano huo bila kuingiza hitimisho pana kuliko mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye hadhi. Ulinganifu wa vifungu viwili vya kwanza na ukali wa kauli ya Kigiriki umehifadhiwa.
