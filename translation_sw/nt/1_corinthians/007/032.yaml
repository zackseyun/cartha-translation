  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: sw
  text: Lakini nataka msiwe na mahangaiko. Mwanamume ambaye hajaoa[a] anahangaikia mambo ya Bwana, jinsi atakavyompendeza Bwana;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu asiye katika ndoa.” Kigiriki kimetumia umoja wa kiume (“mwanamume ambaye hajaoa”), ingawa katika muktadha unaozunguka Paulo anazungumzia kwa upana hali za watu wasio katika ndoa na walio katika ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Lakini nataka
  rationale: θέλω huonyesha nia au tamaa, na δέ hapa inaashiria tofauti nyepesi na maelezo yaliyotangulia; “Lakini nataka” ni ya kawaida na wazi.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: msiwe na mahangaiko
  rationale: ἀμέριμνος humaanisha kutokuwa na wasiwasi au mahangaiko yanayolemea. Kauli hii ya Kiswahili ni ya asili na haimaanishi kutokuwa na wajibu wowote.
- source_word: ὁ ἄγαμος
  choice: Mwanamume ambaye hajaoa
  rationale: Muundo wa Kigiriki ni wa kiume, umoja. “Mwanamume ambaye hajaoa” huhifadhi jinsia na hali ya kutokuwa katika ndoa kwa uwazi katika muktadha huu.
- source_word: μεριμνᾷ
  choice: anajishughulisha na
  rationale: Kitenzi kinaweza kumaanisha kuhangaikia, kujali, au kushughulika na jambo. Hapa kinaeleza uangalifu unaoelekezwa kwa mambo ya Bwana bila kudokeza lazima wasiwasi mbaya.
- source_word: τὰ τοῦ κυρίου
  choice: mambo ya Bwana
  rationale: Nahau hii pana inahusu mambo yanayomhusu au yaliyo ya Bwana. “Mambo ya Bwana” huhifadhi upana huo kwa Kiswahili cha kawaida.
- source_word: κυρίου / κυρίῳ
  choice: Bwana
  rationale: κύριος hapa ni cheo cha Kikristo chenye rejeo la kiibada; “Bwana” ndilo chaguo la kawaida na lenye uzito unaofaa.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: jinsi atakavyompendeza Bwana
  rationale: πῶς hutambulisha namna au lengo linalokusudiwa. “Jinsi atakavyompendeza Bwana” ni ya asili katika Kiswahili na huonyesha jambo analolenga kufanya.
theological_decisions:
- issue: Rejeo la umoja wa kiume katika utofautishaji wa Paulo kati ya walio katika ndoa na wasio katika ndoa
  choice: 'Kudumisha umoja wa kiume katika matini kuu: “Mwanamume ambaye hajaoa”'
  alternative: “Mtu ambaye hajaoa au kuolewa” au “Mtu asiye katika ndoa”
  rationale: Kigiriki kimetumia umbo la kiume la umoja, na mistari inayozunguka inazungumzia kwa zamu hali ya mwanamume na ya mwanamke. Tanbihi inaeleza kwamba muktadha mpana unawahusu wote bila kuondoa umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mahangaiko” huepuka wazo la kutojali kabisa; “anajishughulisha na” huhifadhi uhusiano wa kimaana na mzizi wa μεριμνάω bila kuifanya shughuli ya kumhudumia Bwana ionekane kuwa wasiwasi mbaya.
