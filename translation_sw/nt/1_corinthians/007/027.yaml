  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: sw
  text: Je, umefungwa kwa mke? Usitafute kufunguliwa[a]. Je, umefunguliwa kutoka kwa mke? Usitafute mke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri yenye kufafanua zaidi: “Je, umeoa? Usitafute talaka. Je, umeachana na mke? Usitafute mke.” Kiyunani husema kihalisi zaidi kuhusu “kufungwa” na “kufunguliwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: umefungwa
  rationale: Huhifadhi sitiari ya hali ya kufungwa na muundo wa wakati timilifu, huku ikilingana na maneno ya kufunguliwa katika vifungu vinavyofuata.
- source_word: γυναικί
  choice: kwa mke
  rationale: Katika muktadha huu wa ndoa, γυνή humaanisha mke; kihusishi cha Kiswahili 'kwa' kinaonyesha mtu ambaye mhusika amefungwa kwake.
- source_word: ζήτει
  choice: tafuta
  rationale: '''Tafuta'' ni tafsiri ya kawaida na ya asili ya ζητέω, na huhifadhi nguvu ya amri.'
- source_word: λύσιν
  choice: kufunguliwa
  rationale: Huhifadhi wazo la kulegezwa au kuachiliwa na uhusiano wa kileksia na λέλυσαι, bila kulazimisha maana finyu ya talaka.
- source_word: λέλυσαι
  choice: umefunguliwa
  rationale: Huhifadhi ulinganifu wa sitiari kati ya kufungwa na kufunguliwa, na haikati mapema kwamba hali inayotajwa ni talaka, ujane, au hali nyingine ya kutokuwa na mwenzi.
- source_word: ἀπὸ γυναικός
  choice: kutoka kwa mke
  rationale: Katika muktadha wa ndoa γυνή ni 'mke,' na ἀπό inaelezwa moja kwa moja kwa 'kutoka kwa.'
- source_word: γυναῖκα
  choice: mke
  rationale: Muktadha unaonyesha wazi kutafuta kuoa, kwa hiyo 'mke' ni sahihi kuliko 'mwanamke.'
theological_decisions:
- issue: Iwapo kutafsiri kwa istilahi wazi za ndoa na talaka au kuhifadhi sitiari ya Paulo ya kufungwa na kufunguliwa.
  choice: Kuhifadhi katika maandishi makuu sitiari ya 'umefungwa' na 'umefunguliwa.'
  alternative: Je, umeoa? Usitafute talaka. Je, umeachana na mke? Usitafute mke.
  rationale: Kiyunani kinatumia lugha ya δέω/λύω badala ya istilahi zilizo wazi zaidi za kuoa na kutaliki. Kuhifadhi sitiari kunaonyesha maandishi kwa uwazi zaidi na huepuka kuamua kwamba kinachomaanishwa ni talaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili sambamba umehifadhiwa; sitiari ya kufungwa na kufunguliwa imeachwa katika maandishi makuu, huku maana ya ndoa na talaka ikifafanuliwa katika tanbihi.
