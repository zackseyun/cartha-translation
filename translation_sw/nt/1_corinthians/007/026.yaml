  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: sw
  text: 'Kwa hiyo, naona hili ni jema kwa sababu ya dhiki ya sasa[a]: ni jema kwa mtu[b] kubaki alivyo[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya ulazima wa sasa”; au, “kwa sababu ya mgogoro unaokaribia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mwanadamu.” Neno la Kigiriki linaweza kutumiwa kwa maana ya jumla.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kuwa hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: nadhani
  rationale: Inaonyesha hukumu ya Paulo mwenyewe iliyofikiriwa, si amri kamili; ni usemi wa kawaida na wa heshima katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: jambo hili ni jema
  rationale: Muundo wa Kigiriki wenye kitenzi-jina umetafsiriwa kwa sentensi asilia ya Kiswahili, huku maana ya καλόν ya kuwa jema au kufaa ikihifadhiwa.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: kwa sababu ya dhiki iliyopo sasa
  rationale: ἀνάγκη hapa inaweza kumaanisha hali ya shinikizo au taabu, na ἐνεστῶσαν inaelekeza kwenye hali iliyopo; tanbihi huhifadhi uwezekano wa maana nyingine.
- source_word: ὅτι
  choice: ':'
  rationale: Katika Kiswahili, nukta mbili zinaunganisha kwa kawaida hukumu ya kwanza na maelezo ya yaliyomo katika hukumu hiyo, bila kulazimisha maana ya kisababishi.
- source_word: καλὸν
  choice: ni vema
  rationale: Inahifadhi kurudiwa kwa tathmini chanya ya καλόν, huku mabadiliko madogo ya kiswahili kati ya 'jema' na 'vema' yakifanya sentensi iwe ya kawaida.
- source_word: ἀνθρώπῳ
  choice: kwa mwanamume
  rationale: Inahifadhi umbo la kiume la tafsiri ya muktadha huu, ingawa ἄνθρωπος pia inaweza kutumiwa kwa maana ya jumla; uwezekano huo umewekwa katika tanbihi.
- source_word: τὸ οὕτως εἶναι
  choice: kubaki alivyo
  rationale: Kihalisi ni 'kuwa hivyo.' Katika muktadha, usemi huu unaelekeza kwenye kuendelea katika hali aliyo nayo mtu; tanbihi inahifadhi umbo la karibu zaidi na neno kwa neno.
theological_decisions:
- issue: Tabia ya kauli ya Paulo
  choice: Kauli imetafsiriwa kama hukumu ya Paulo inayohusishwa na dhiki iliyopo sasa.
  alternative: Kuifanya kuwa katazo la ndoa la kudumu na la jumla.
  rationale: Maneno 'nadhani' na 'kwa sababu ya dhiki iliyopo sasa' yanaonyesha ushauri unaotegemea hali fulani; tafsiri haiongezi katazo ambalo andiko halisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku tanbihi zikihifadhi utata wa ἀνάγκη, upeo wa ἀνθρώπῳ, na usemi halisi τὸ οὕτως εἶναι.
