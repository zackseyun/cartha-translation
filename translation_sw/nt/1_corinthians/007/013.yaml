reference: 1 Corinthians 7:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: sw
  text: Na mwanamke akiwa na mume asiyeamini, naye anakubali kuishi pamoja naye, asimwache mume wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asitalikiane na mume wake.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kihalisi kuwa “kuacha” au “kumwondoa”; hapa kinahusu kuvunja uhusiano wa ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mwanamke
  rationale: Neno linaweza kumaanisha ‘mwanamke’ au ‘mke’; hapa muktadha wa ndoa unawekwa wazi na ‘mume,’ na muundo ‘mwanamke akiwa na mume’ ni wa kawaida katika Kiswahili.
- source_word: εἴ τις ἔχει
  choice: akiwa na
  rationale: Huwasilisha sharti la jumla kwa Kiswahili cha kawaida bila kulazimisha neno ‘yeyote.’
- source_word: ἄνδρα ἄπιστον
  choice: mume asiyeamini
  rationale: Katika muktadha huu ἀνήρ ni ‘mume,’ na ἄπιστος humaanisha mtu asiye na imani ya Kikristo, si mume asiye mwaminifu katika ndoa.
- source_word: οὗτος συνευδοκεῖ
  choice: naye anakubali
  rationale: Kiwakilishi kinamrejelea mume, na συνευδοκεῖ huonyesha kukubali kwa hiari; ‘naye anakubali’ ni wazi na ya asili.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: kuishi pamoja naye
  rationale: Hueleza kuendelea kwa maisha ya pamoja ya nyumbani; ‘pamoja’ huweka wazi zaidi maana ya ushirika wa makazi.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: asimwache mume wake
  rationale: ἀφίημι inaweza kumaanisha kuacha au kumwondoa mwenzi; katika muktadha wa ndoa inahusu kuvunja uhusiano, lakini ‘asimwache’ huhifadhi upana wa kitenzi bila kukifinyanga kuwa istilahi ya kisheria pekee.
theological_decisions:
- issue: Nguvu ya ἀφιέτω katika agizo kuhusu ndoa ya waamini na wasioamini
  choice: asimwache mume wake
  alternative: asitalikiane na mume wake
  rationale: Tafsiri iliyochaguliwa huhifadhi maana ya msingi ya ‘kuacha’ na pia muktadha wa kuvunja ndoa, bila kuamua kimya kimya kwamba kitenzi kinamaanisha hatua rasmi ya talaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni rahisi kwa msomaji wa kawaida, huku ukihifadhi sharti la jumla na utata halisi wa ἀφίημι katika muktadha wa ndoa.
