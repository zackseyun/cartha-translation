  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: sw
  text: Mlinunuliwa kwa bei; msiwe watumwa wa wanadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: kwa thamani
  rationale: Hali ya umilikishi pamoja na ἀγοράζω huonyesha gharama ya ununuzi. “Kwa thamani” ni Kiswahili cha kawaida kinachodumisha wazo la gharama bila kutaja kiasi.
- source_word: ἠγοράσθητε
  choice: mlinunuliwa
  rationale: Ni kitenzi cha wakati uliopita timilifu kwa maana, katika hali ya kutendwa, nafsi ya pili wingi. “Mlinunuliwa” huhifadhi sitiari ya biashara na ukombozi.
- source_word: μὴ γίνεσθε
  choice: msiwe
  rationale: Ingawa γίνομαι kwa msingi ni “kuwa/kufanyika,” hapa katazo la sasa linaeleweka kwa kawaida katika Kiswahili kama “msiwe,” likikataza kuingia au kudumu katika hali hiyo.
- source_word: δοῦλοι
  choice: watumwa
  rationale: “Watumwa” huhifadhi wazo kuu la kuwa chini ya umiliki na mamlaka ya mwingine, ambalo ni muhimu katika mlinganisho huu.
- source_word: ἀνθρώπων
  choice: wa wanadamu
  rationale: “Wanadamu” ni neno jumuishi linalolingana na ἀνθρώπων hapa, ambapo watu wanatofautishwa na Bwana; halimaanishi wanaume pekee.
theological_decisions:
- issue: Maana ya δοῦλοι ἀνθρώπων katika sitiari ya ununuzi na utii
  choice: watumwa wa wanadamu
  alternative: watumishi wa watu
  rationale: '“Watumwa” hudumisha mvutano wa umiliki na utii: wale walionunuliwa kwa thamani hawapaswi kujiweka chini ya mamlaka kuu ya wanadamu. “Watumishi” ingedhoofisha nguvu ya sitiari.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kifupi, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi inayohitajika kwa sababu “wanadamu” tayari huwasilisha maana jumuishi ya ἀνθρώπων.
