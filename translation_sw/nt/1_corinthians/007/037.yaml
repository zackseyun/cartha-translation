id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: sw
  text: Lakini mtu ambaye amesimama imara moyoni mwake, bila kuwa na ulazima[a], bali ana mamlaka juu ya utashi wake mwenyewe, na ameamua jambo hili moyoni mwake—kumhifadhi bikira wake[b]—atafanya vema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kushurutishwa.”
    reason: lexical_alternative
  - marker: b
    text: “Bikira wake” huenda ikamaanisha ama binti yake aliye bikira au mchumba wake aliye bikira; mrejeo wa usemi wa Kigiriki unabishaniwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: amesimama imara
  rationale: Muunganiko huu unaonyesha msimamo thabiti uliokwisha kuamuliwa; ‘amesimama imara’ ni wa kawaida na huhifadhi picha ya Kigiriki.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: moyoni mwake
  rationale: καρδία hapa ni utu wa ndani, hasa mahali pa azimio na uamuzi; msemo wa Kiswahili huhifadhi nahau ya kibiblia.
- source_word: μὴ ἔχων ἀνάγκην
  choice: bila kuwa chini ya ulazima
  rationale: ἀνάγκη inaweza kumaanisha ulazima, shinikizo, au kushurutishwa. Tafsiri hii inabaki karibu na chanzo, huku maana mbadala ikiwekwa katika tanbihi.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: ana mamlaka juu ya utashi wake mwenyewe
  rationale: ἐξουσία ni mamlaka au haki, na θέλημα ni utashi, nia, au mapenzi. ‘Utashi’ huepuka maana ya kimapenzi inayoweza kusikika katika ‘mapenzi’ na huhifadhi wazo la kujiamulia.
- source_word: κέκρικεν
  choice: ameamua
  rationale: Kauli ya wakati timilifu inaonyesha uamuzi uliokwisha kufanywa na ambao bado umesimama.
- source_word: τηρεῖν
  choice: kumhifadhi
  rationale: τηρέω humaanisha kutunza, kuhifadhi, au kudumisha. ‘Kumhifadhi’ huhifadhi maana ya msingi bila kuongeza waziwazi ‘asibaki ameolewa,’ jambo ambalo halijaandikwa moja kwa moja.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: bikira wake
  rationale: Usemi mfupi huhifadhi kwa kadiri iwezekanavyo utata wa chanzo kuhusu kama anayelengwa ni binti bikira au mchumba bikira; tanbihi inaeleza chaguo hizo.
- source_word: καλῶς ποιήσει
  choice: atafanya vema
  rationale: Hii ni nahau inayosema kwamba mtu atatenda kwa njia inayostahili pongezi; ‘atafanya vema’ ni ya kawaida, yenye heshima, na karibu na Kigiriki.
theological_decisions:
- issue: Anayelengwa na usemi τὴν ἑαυτοῦ παρθένον
  choice: Kudumisha usemi wenye utata ‘bikira wake’ katika matini kuu.
  alternative: ‘binti yake bikira’ au ‘mchumba wake bikira’
  rationale: Kigiriki hakiamui wazi ikiwa Paulo anazungumzia baba au mlezi anayefanya uamuzi kuhusu binti yake, au mwanamume anayefanya uamuzi kuhusu mchumba wake. Kutaja mmoja wao katika matini kuu kungetatua mapema mvutano halisi wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau ‘moyoni mwake’ imedumishwa, na urudiaji wake umeachwa kama katika chanzo. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
