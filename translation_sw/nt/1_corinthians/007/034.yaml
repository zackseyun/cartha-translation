id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: sw
  text: Naye amegawanyika. Mwanamke ambaye hajaolewa, yaani bikira,[a] hujishughulisha na mambo ya Bwana, ili awe mtakatifu katika mwili na katika roho pia. Lakini mwanamke aliyeolewa hujishughulisha na mambo ya ulimwengu, jinsi ya kumpendeza mume wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanamke ambaye hajaolewa na bikira hujishughulisha na mambo ya Bwana.” Kigiriki kinaweza kueleweka kuwa kinataja makundi mawili badala ya kusema kwamba mwanamke ambaye hajaolewa ndiye bikira.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: amegawanyika
  rationale: Huhifadhi hali ya matokeo ya kitenzi timilifu cha kutendwa na sitiari ya masilahi yaliyogawanyika, bila kuifasiri moja kwa moja kuwa wasiwasi.
- source_word: γυνὴ ἡ ἄγαμος
  choice: mwanamke ambaye hajaolewa
  rationale: Ni Kiswahili cha kawaida na wazi kinachotofautisha hali yake na ya mwanamke aliyeolewa.
- source_word: παρθένος
  choice: bikira
  rationale: Huhifadhi maana mahususi ya neno la Kigiriki badala ya kulifanya liwe neno la jumla kama msichana.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: mwanamke ambaye hajaolewa, yaani bikira
  rationale: Usomaji wa ufafanuzi unaendana vizuri na kitenzi cha umoja μεριμνᾷ; uwezekano wa makundi mawili umehifadhiwa katika tanbihi.
- source_word: μεριμνᾷ
  choice: hujishughulisha na
  rationale: Hueleza kujali na kuelekeza fikira bila kulazimisha maana hasi ya kuwa na wasiwasi.
- source_word: τὰ τοῦ κυρίου
  choice: mambo ya Bwana
  rationale: Huhifadhi muundo na ulinganifu wa kauli dhidi ya 'mambo ya ulimwengu' kwa Kiswahili cha asili.
- source_word: ἵνα ᾖ ἁγία
  choice: ili awe mtakatifu
  rationale: Huhifadhi kusudi au matokeo yanayoonyeshwa na ἵνα pamoja na lugha ya utakatifu.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: katika mwili na katika roho pia
  rationale: Hueleza nyanja zote mbili za utakatifu bila kusisitiza kupita kiasi mgawanyo wa kianthropolojia.
- source_word: ἡ δὲ γαμήσασα
  choice: mwanamke aliyeolewa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mwanamke aliye katika hali ya ndoa na unaweka wazi tofauti inayokusudiwa.
- source_word: τὰ τοῦ κόσμου
  choice: mambo ya ulimwengu
  rationale: Hulingana kimuundo na 'mambo ya Bwana' bila kuongeza dhana ya uovu ambayo muktadha haulazimishi.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: jinsi ya kumpendeza mume wake
  rationale: Katika muktadha wa ndoa, ἀνήρ ni mume; tafsiri hii ni ya kawaida na wazi.
theological_decisions:
- issue: Ikiwa 'mwanamke ambaye hajaolewa' na 'bikira' ni makundi mawili au maelezo mawili ya mhusika mmoja
  choice: 'Usomaji wa ufafanuzi: “mwanamke ambaye hajaolewa, yaani bikira”'
  alternative: 'Usomaji wa uratibu: “mwanamke ambaye hajaolewa na bikira”'
  rationale: Sintaksia ya Kigiriki imebanwa na inaweza kueleweka kwa njia zote mbili. Kitenzi cha umoja kinaunga mkono usomaji wa ufafanuzi, lakini usomaji wa makundi mawili unabaki halali na kwa hiyo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa ulinganifu wa karibu na Kigiriki lakini umetolewa kwa mtiririko wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
