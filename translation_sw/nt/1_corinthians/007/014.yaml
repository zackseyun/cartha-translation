  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: sw
  text: Kwa maana mume asiyeamini ametakaswa katika uhusiano wake na mke wake, na mke asiyeamini ametakaswa katika uhusiano wake na ndugu[a]; la sivyo, watoto wenu ni najisi, lakini kwa hali ilivyo sasa, wao ni watakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ndugu mwamini; katika muktadha huu inaelekea kumaanisha mume mwamini.
    reason: lexical_alternative
  - marker: b
    text: Hapa “ametakaswa” na “watakatifu” zinaeleza hali ya utakaso au kutengwa katika uhusiano wa ndoa na familia; maneno hayo yenyewe hayamaanishi kwa lazima kwamba mwenzi asiyeamini ameokolewa binafsi.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: ametakaswa
  rationale: Kitenzi cha wakati timilifu katika kauli ya kutendwa kinaonyesha tendo lililotokea na hali yake inayoendelea. ‘Ametakaswa’ huhifadhi uhusiano wa kimatamshi na ‘watakatifu’ bila kudai moja kwa moja wokovu binafsi.
- source_word: ἄπιστος
  choice: asiyeamini
  rationale: Katika muktadha huu neno linaeleza mwenzi ambaye si mwamini, wala si mtu asiye mwaminifu katika tabia.
- source_word: ἐν
  choice: katika uhusiano wake na
  rationale: Ingawa maana ya msingi ni ‘katika,’ hapa usemi unaeleza hali inayotokana na uhusiano wa ndoa. Tafsiri hii ni ya kawaida katika Kiswahili na haibani maana kuwa chombo pekee.
- source_word: ἀνήρ / γυνή
  choice: mume / mke
  rationale: Muktadha wa karibu unahusu ndoa, hivyo maana mahususi za mume na mke zinafaa.
- source_word: ἀδελφῷ
  choice: huyo ndugu
  rationale: Huhifadhi neno la Kigiriki ‘ndugu,’ ambalo Paulo hutumia kwa mwamini mwenzake; ‘huyo’ huonyesha mtu aliyetajwa kimuktadha bila kulibadili kuwa ‘mume’ katika matini kuu.
- source_word: ἐπεὶ ἄρα
  choice: la sivyo
  rationale: Huwasilisha kwa kawaida matokeo ambayo yangefuata kama kauli iliyotangulia haingekuwa kweli.
- source_word: ἀκάθαρτα
  choice: najisi
  rationale: ‘Najisi’ huhifadhi mwangwi wa kidini na kiibada wa neno, kuliko ‘wachafu,’ ambalo linaweza kueleweka kimwili tu.
- source_word: νῦν δὲ
  choice: lakini kwa hali ilivyo sasa
  rationale: Hutofautisha hali halisi ya sasa na matokeo ya kudhaniwa yaliyotangulia.
- source_word: ἅγια
  choice: watakatifu
  rationale: Huhifadhi istilahi ya utakatifu na uhusiano wa kileksia na ‘ametakaswa.’
theological_decisions:
- issue: Maana ya mwenzi asiyeamini ‘ametakaswa’
  choice: Kudumisha lugha ya utakaso huku ikielezwa kuwa ni hali katika uhusiano wa ndoa na familia.
  alternative: Kuitafsiri kuwa mwenzi huyo ameokolewa moja kwa moja, au kwamba ndoa ni halali tu kingono.
  rationale: Hoja ya Paulo inaunganisha hali ya mwenzi na hali ya watoto, lakini mstari wenyewe hausemi wazi kuwa mwenzi asiyeamini amepokea wokovu binafsi. Tafsiri inahifadhi mvutano huo.
- issue: Mrejelewa wa ἀδελφῷ
  choice: ‘huyo ndugu’ katika matini kuu, akieleweka kuwa mume mwamini.
  alternative: ‘mume mwamini’ au ‘mwenzi mwamini.’
  rationale: Neno la chanzo ni ‘ndugu,’ si ‘mume.’ Kulihifadhi huonyesha lugha ya Paulo kuhusu familia ya waamini, huku tanbihi ikifafanua mrejelewa unaowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ na ‘watakatifu’ zimedumishwa kwa sababu ya uzito wa kidini wa maneno ya chanzo. Usemi ‘katika uhusiano wake na’ huepuka ugumu wa tafsiri halisi ‘katika mke/ndugu’ na pia huepuka kufunga ἐν katika maana ya chombo pekee.
