  source_fidelity: 'Tafsiri inahifadhi vipengele vya msingi vya Kigiriki: usambazaji wa ἕκαστος (''kila mmoja''), agizo la kuendelea la μενέτω (''na abaki''), hali/mazingira ambamo mtu aliitwa, na kauli ya kutendwa ya ''alipoitwa'' bila kumtaja mtendaji. ''Mbele za Mungu'' ni utoaji unaokubalika wa παρὰ θεῷ, na tanbihi huhifadhi uwezekano wa ''pamoja na Mungu'' na ''katika uwepo wa Mungu.'''
  naturalness: Sentensi ni Kiswahili Sanifu cha Afrika Mashariki, ina mtiririko wa kawaida, na register yake inafaa kwa maandishi ya Biblia. 'Hali ile aliyokuwa nayo alipoitwa' hueleweka kwa urahisi kama hali ya maisha wakati wa wito; ingawa ina maneno ya ufafanuzi yasiyo dhahiri moja kwa moja katika Kigiriki, ni usemi wa kawaida unaowasilisha maana ya kirai bila kubadili hoja.
  terminology: '''Ndugu'' ni mwito wa kawaida kwa kusanyiko na tanbihi inaeleza kwa usahihi kwamba unajumuisha wanawake. ''Mungu,'' ''wito/aliitwa,'' na ''hali'' zimetumiwa kwa uthabiti na kwa register inayofaa. Tanbihi zote zina alama zinazolingana na sehemu zake katika maandishi.'
