id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: sw
  text: Ndugu[a], kila mmoja na abaki katika hali ile aliyokuwa nayo alipoitwa, mbele za Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa ni mwito kwa kusanyiko lote, wakiwemo wanawake.
    reason: cultural_note
  - marker: b
    text: Au, “pamoja na Mungu” au “katika uwepo wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya mgawanyo kwa watu mmoja mmoja na kusisitiza kwamba agizo linamhusu kila mtu binafsi.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: katika hali ile aliyokuwa nayo
  rationale: Kirai hiki kinaelekeza kwenye hali au mazingira ya maisha ya mtu, kama inavyoonekana katika mjadala unaozunguka mstari huu, wala si mahali pa kimwili tu.
- source_word: ἐκλήθη
  choice: alipoitwa
  rationale: Huhifadhi kauli ya kutendwa bila kuongeza wazi mtendaji ambaye Kigiriki hakumtaji, ingawa muktadha unaashiria wito wa Mungu.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: Ni mwito wa kawaida, wenye heshima, kwa kusanyiko. Katika Kiswahili neno hili halibainishi jinsia, na katika muktadha huu linawahusu waumini wote.
- source_word: μενέτω
  choice: na abaki
  rationale: Huonyesha agizo la kuendelea katika hali iliyotajwa na kuendana na dhamira inayorudiwa katika kifungu hiki.
- source_word: παρὰ θεῷ
  choice: mbele za Mungu
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuishi katika uwepo na uhusiano na Mungu. Kwa kuwa παρά pamoja na hali ya dative inaweza pia kueleweka kuwa ‘pamoja na Mungu,’ uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kumtaja Mungu wazi kuwa mtendaji wa ‘alipoitwa’
  choice: Kudumisha kauli ya kutendwa ‘alipoitwa’ bila kuongeza ‘na Mungu’
  alternative: alipoitwa na Mungu
  rationale: Muktadha wa Paulo unaashiria sana kwamba Mungu ndiye anayeita, lakini sentensi ya Kigiriki haimtaji mtendaji wazi; tafsiri haiongezi maneno hayo.
- issue: Maana ya παρὰ θεῷ
  choice: mbele za Mungu
  alternative: pamoja na Mungu
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kusisitiza uwepo wa Mungu au uhusiano naye. Maandishi makuu yanatumia Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Wanaohusishwa na ἀδελφοί
  choice: Ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki lina umbo la kiume lakini hapa ni mwito kwa kusanyiko zima. ‘Ndugu’ ni la kawaida na lisilobainisha jinsia katika Kiswahili; tanbihi inaweka wazi upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio unafuata kwa ukaribu urudiaji wa wazo la hali katika Kigiriki bila kufanya sentensi kuwa ngumu.
