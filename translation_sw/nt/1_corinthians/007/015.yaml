  naturalness: The revised wording is standard, current East African Swahili. “Ndugu wa kiume au wa kike” is clearer and more idiomatic than repeating “ndugu mwanamume ... ndugu mwanamke,” while retaining the explicit male/female pairing.
  terminology: “Yule asiyeamini” appropriately preserves the substantival expression without inserting “spouse.” “Kutengana” maintains the lexical repetition and does not prejudge legal divorce. “Hajafanywa mtumwa” preserves the salient δουλόω slave-language without treating it as a technical ruling about remarriage.
  issues:
