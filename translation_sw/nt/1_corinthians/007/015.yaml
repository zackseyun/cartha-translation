- from: Lakini ikiwa yule asiyeamini anataka kutengana[a], na atengane. Ndugu mwanamume au ndugu mwanamke hafanywi mtumwa katika hali kama hizo[b][c]; bali Mungu ametuita tuishi kwa amani.
  to: Lakini kama yule asiyeamini akitengana[a], na atengane. Ndugu wa kiume au wa kike hajafanywa mtumwa katika hali kama hizo[b]; bali Mungu ametuita katika amani[c].
  rationale: The revision removes additions not present in the Greek, preserves the repeated separation verb with “akitengana ... atengane,” renders the perfect passive slave metaphor more closely, and restores “katika amani” as the direct equivalent of ἐν εἰρήνῃ. It also relocates the textual-variant anchor to the words it concerns. No interpretation concerning dissolution of marriage or remarriage is added.
