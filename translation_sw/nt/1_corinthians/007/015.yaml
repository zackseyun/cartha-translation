  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: sw
  text: Lakini kama yule asiyeamini akitengana[a], na atengane. Ndugu wa kiume au wa kike hajafanywa mtumwa katika hali kama hizo[b]; bali Mungu ametuita katika amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaondoka.” Katika muktadha huu anayezungumziwa ni mwenzi wa ndoa asiyeamini.
    reason: lexical_alternative
  - marker: b
    text: Au, “hafungwi.” Hata hivyo, kitenzi cha Kigiriki kinatokana na δουλόω, yaani “kufanya mtumwa,” si kitenzi cha kawaida cha “kufunga.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati zina “amewaita ninyi” badala ya “ametuita sisi.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: yule asiyeamini
  rationale: Ni usemi wa kivumishi kilichotumiwa kama nomino. Katika muktadha unamaanisha mwenzi wa ndoa asiyeamini, lakini tafsiri hii haiongezi neno ‘mwenzi’ katika matini.
- source_word: χωρίζεται / χωριζέσθω
  choice: anataka kutengana / na atengane
  rationale: ‘Kutengana’ huhifadhi wazo la kuondoka au kuvunja kuishi pamoja bila kuamua kimya kimya kama ni talaka ya kisheria. Muundo ‘anataka kutengana’ hutoa kwa Kiswahili maana ya kitendo kinachoendelea au kinachokusudiwa katika muktadha huu, na ‘na atengane’ ni ruhusa au kukubali hali hiyo, si amri ya kuanzisha talaka.
- source_word: οὐ δεδούλωται
  choice: hafanywi mtumwa
  rationale: Kitenzi δουλόω kinahusu kumfanya mtu mtumwa, si kitenzi cha kawaida cha ‘kufunga.’ Tafsiri hii huhifadhi sitiari yenye nguvu bila kuamua upeo wote wa uhuru unaotajwa.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: ndugu mwanamume au ndugu mwanamke
  rationale: Huhifadhi majina yote mawili na lugha ya kindugu kwa waamini, huku ikionyesha wazi jinsia kwa Kiswahili cha kawaida.
- source_word: ἐν τοῖς τοιούτοις
  choice: katika hali kama hizo
  rationale: Ni usemi wa kawaida unaorejelea mazingira ya aina iliyotajwa, si ‘vitu’ halisi.
- source_word: ἐν δὲ εἰρήνῃ
  choice: tuishi kwa amani
  rationale: Kirai cha Kigiriki kinaweza kueleza mazingira au namna ya mwito. Kuongeza ‘tuishi’ kunafanya Kiswahili kiwe cha kawaida huku kikihifadhi wazo la mwito unaohusiana na amani.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Mungu ametuita
  rationale: Wakati timilifu unaonyesha mwito uliotolewa wenye matokeo yanayoendelea; ‘ametuita’ huwasilisha hilo vizuri. Matini ya SBLGNT ina ‘sisi,’ si ‘ninyi.’
theological_decisions:
- issue: Maana ya οὐ δεδούλωται kuhusu kuvunjika kwa ndoa na kuoa au kuolewa tena
  choice: Imetafsiriwa kwa ukaribu kama ‘hafanywi mtumwa,’ bila kufafanua kwamba ni ruhusa kamili ya kuoa au kuolewa tena.
  alternative: ‘Hafungwi’ kama kauli ya kiufundi inayoruhusu ndoa nyingine, au ‘hafanywi mtumwa’ ikimaanisha tu kutolazimika kumfuatilia mwenzi anayeondoka.
  rationale: Mstari haufafanui kwa uwazi upeo wote wa kutokuwa mtumwa. Tafsiri inahifadhi mvutano huo badala ya kuingiza hitimisho la kimadhehebu.
- issue: Anayerejelewa na ὁ ἄπιστος
  choice: ‘Yule asiyeamini’ katika matini kuu, akieleweka kutokana na muktadha kuwa mwenzi wa ndoa asiyeamini.
  alternative: ‘Mtu asiyeamini’ au ‘mwenzi asiyeamini.’
  rationale: Muktadha wa ndoa unaweka wazi anayelengwa, lakini Kigiriki hakitumii nomino ya ‘mwenzi’; tafsiri haifanyi maana iliyodokezwa kuwa ya moja kwa moja kuliko chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndugu mwanamume au ndugu mwanamke’ ni wazi kwa wasomaji wa kawaida na huhifadhi ulinganifu wa Kigiriki. Mpangilio wa alama [b][c] umewekwa kulingana na mahali maelezo yanapohusika: [b] baada ya usemi wa utumwa, na [c] baada ya tofauti ya hati inayohusu ‘sisi/ninyi.’'
