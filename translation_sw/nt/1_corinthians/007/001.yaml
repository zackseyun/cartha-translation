  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: sw
  text: 'Kuhusu mambo mliyoandika: ni vizuri mwanamume asimguse mwanamke.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni vizuri mwanamume asifanye ngono na mwanamke.” Usemi wa Kigiriki “kumgusa mwanamke” unaweza kuwa sitiari ya mahusiano ya kingono. Huenda pia maneno haya yakawa nukuu kutoka katika barua ya Wakorintho.
    reason: Hufafanua maana inayowezekana ya sitiari na kutaja utata wa iwapo Paulo ananukuu kauli ya Wakorintho, bila kuamua masuala hayo katika matini kuu.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Kuhusu mambo mliyoandika
  rationale: Huwasilisha mabadiliko ya mada yanayoletwa na δέ pamoja na maana ya ujumla ya ὧν, bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: καλόν
  choice: ni vizuri
  rationale: Ni usemi wa kawaida na wenye heshima unaohifadhi tathmini chanya ya neno la Kigiriki.
- source_word: ἀνθρώπῳ
  choice: mwanamume
  rationale: Katika muktadha huu wa uhusiano na γυναικός, neno linamtaja mwanamume, si binadamu kwa ujumla.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: asimguse mwanamke
  rationale: Huhifadhi sitiari ya chanzo kwa lugha ya asili ya Kiswahili; katika muktadha inaweza kumaanisha kuepuka mahusiano ya kingono, lakini tafsiri kuu haifafanui zaidi ya Kigiriki.
theological_decisions:
- issue: Je, kauli ni ya Paulo mwenyewe au nukuu kutoka barua ya Wakorintho?
  choice: Haijawekewa alama za kunukuu
  alternative: “Ni vizuri mwanamume asimguse mwanamke.”
  rationale: Maandishi ya Kigiriki hayana alama za kutatua suala hili; kutoweka alama za nukuu kunahifadhi uwezekano wa kisarufi na mvutano wa kifasiri.
- issue: Maana ya ‘kumgusa mwanamke’
  choice: Sitiari imehifadhiwa katika matini
  alternative: ‘asifanye ngono na mwanamke’ au ‘asioe’
  rationale: ἅπτεσθαι ni usemi unaoweza kuwa na maana ya kingono katika muktadha, lakini kuufafanua moja kwa moja kungeondoa utata halisi na huenda kungepanua au kupunguza maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama chanzo; ‘mliyoandika’ huonyesha wazi wingi wa wapokeaji, na ‘asimguse’ ni usemi wa kawaida unaohifadhi sitiari.
