  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: sw
  text: Kuhusu mabikira[a], sina amri kutoka kwa Bwana, lakini natoa maoni yangu[b] kama mtu ambaye Bwana amemwonyesha rehema, ili awe wa kuaminika[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanawake ambao hawajaolewa,” au, kulingana na baadhi ya maelezo ya muktadha, “binti mabikira.” Kigiriki kinasema “mabikira.”
    reason: lexical_alternative
  - marker: b
    text: Au “shauri langu” au “uamuzi wangu.” Paulo anatofautisha maoni yake yaliyofikiriwa kwa makini na “amri kutoka kwa Bwana.”
    reason: alternative_reading
  - marker: c
    text: Au “kuwa mwaminifu.” Neno la Kigiriki linaweza kumaanisha “mwaminifu” au “wa kuaminika”; hapa huenda maana ni kwamba Paulo, kwa kuwa Bwana amemwonyesha rehema, ni mtu wa kuaminika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Hutanguliza mada mpya. Kiswahili hakihitaji kuongeza neno la wakati kama “sasa,” ambalo halipo wazi katika Kigiriki.
- source_word: τῶν παρθένων
  choice: mabikira
  rationale: Hili ndilo maana ya msingi ya παρθένος na linaacha wazi utambulisho wao mahususi badala ya kuamua kwamba ni wanawake wasioolewa au binti mabikira.
- source_word: ἐπιταγὴν κυρίου
  choice: amri kutoka kwa Bwana
  rationale: ἐπιταγή ni agizo au amri; “kutoka kwa Bwana” huonyesha wazi chanzo cha amri.
- source_word: γνώμην δὲ δίδωμι
  choice: lakini natoa maoni yangu
  rationale: γνώμη hapa ni maoni au shauri lililofikiriwa kwa makini, tofauti na amri ya moja kwa moja. “Natoa maoni yangu” ni Kiswahili cha kawaida na hakifanyi kauli hiyo kuwa amri.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: kwa rehema ya Bwana
  rationale: Huwasilisha kwa ufupi kwamba hadhi ya Paulo inatokana na kupewa rehema na Bwana.
- source_word: πιστὸς εἶναι
  choice: anastahili kuaminiwa
  rationale: πιστός inaweza kumaanisha mwaminifu au wa kuaminika. Katika muktadha huu Paulo anaeleza kwa nini maoni yake yanaweza kutegemewa, huku tanbihi ikihifadhi maana nyingine inayowezekana.
theological_decisions:
- issue: Mamlaka ya maoni ya Paulo yakilinganishwa na amri ya Bwana
  choice: Tafsiri inatofautisha kutokuwapo kwa amri ya moja kwa moja kutoka kwa Bwana na maoni ya Paulo yanayostahili kuaminiwa kwa sababu ya rehema ya Bwana.
  alternative: Kauli hii ni maoni binafsi yasiyo na uzito wowote wa kitume, au ni amri ya Yesu iliyotolewa kwa njia isiyo ya moja kwa moja.
  rationale: Tofauti kati ya ἐπιταγή na γνώμη inapaswa kubaki bila kupunguza maoni ya Paulo kuwa kauli ya kawaida tu wala kuyainua kuwa amri ya moja kwa moja ya Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wazi bila kufuta utata wa παρθένος na πιστός.
