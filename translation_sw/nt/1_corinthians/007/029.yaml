  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: sw
  text: 'Lakini nasema hivi, ndugu[b]: wakati umefupishwa[a], ili tangu sasa hata wale walio na wake wawe kana kwamba hawana wake,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati uliowekwa umekuwa mfupi.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ἀδελφοί lina umbo la wingi wa kiume, lakini katika muktadha huu linaweza kuelekeza kwa kundi la waamini wa kiume na wa kike.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Lakini nasema hivi
  rationale: Huhifadhi kiunganishi δέ na fomula ya Paulo ya kuanzisha ufafanuzi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida linaloweza kuelekeza kwa waamini wa kiume na wa kike, hivyo linafaa kwa kundi linaloambiwa bila kulazimisha jinsia isiyotajwa wazi katika muktadha.
- source_word: ὁ καιρός
  choice: wakati
  rationale: “Wakati” ni tafsiri ya asili inayoweza kubeba maana ya kipindi muhimu au kilichowekwa bila kuongeza ufafanuzi usiotamkwa moja kwa moja.
- source_word: συνεσταλμένος ἐστίν
  choice: umepunguzwa
  rationale: Huhifadhi hali ya sasa inayotokana na kufupishwa au kubanwa, kama inavyoonyeshwa na muundo wa timilifu wa Kigiriki.
- source_word: τὸ λοιπὸν
  choice: tangu sasa
  rationale: Huwasilisha kwa uwazi athari ya muda kwa maisha yatakayofuata.
- source_word: ἵνα
  choice: ili
  rationale: Huhifadhi uhusiano wa kusudi au matokeo bila kuamua kabisa ni upande upi unaokusudiwa.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: wale walio na wake
  rationale: Hufuata kwa karibu usemi wa Kigiriki; katika muktadha huu γυναῖκας humaanisha wake, si wanawake kwa ujumla.
- source_word: ὡς μὴ ἔχοντες
  choice: kana kwamba hawana
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi ukali wa ulinganisho bila kurudia neno “wake” isivyo lazima.
theological_decisions:
- issue: Nguvu ya kichungaji na kiteolojia ya agizo kuhusu ndoa
  choice: 'Kauli imetafsiriwa moja kwa moja: walio na wake wawe kana kwamba hawana.'
  alternative: Kufafanua kuwa waishi bila kushikamana sana na ndoa, au kupunguza mvutano kwa kurejelea wajibu wa ndoa.
  rationale: Andiko linaweka hali za kawaida za kijamii chini ya uharaka unaohusiana na wakati. Tafsiri inapaswa kuhifadhi mvutano huo badala ya kuutatua kwa ufafanuzi wa kimadhehebu.
- issue: Uhusiano unaoonyeshwa na ἵνα
  choice: ili
  alternative: kwa hiyo
  rationale: “Ili” hudumisha uwezekano wa kusudi au matokeo uliomo katika muundo wa Kigiriki; “kwa hiyo” ungeelekeza zaidi kwenye hitimisho la kimantiki pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa karibu na maneno yanayohusika, na sentensi imeachwa wazi mwishoni kwa kuwa mstari unaendelea katika kifungu kinachofuata.
