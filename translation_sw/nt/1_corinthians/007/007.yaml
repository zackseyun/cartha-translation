  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: sw
  text: Lakini nataka watu wote wawe kama mimi nilivyo. Hata hivyo, kila mmoja ana karama yake mwenyewe kutoka kwa Mungu, mmoja kwa namna hii na mwingine kwa namna ile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: nataka
  rationale: Huwasilisha moja kwa moja nia au tamanio la Paulo bila kulifanya kuwa amri.
- source_word: πάντας ἀνθρώπους
  choice: watu wote
  rationale: Katika Kigiriki, ἀνθρώπους hapa inaweza kutumiwa kwa watu kwa ujumla; “watu wote” ni Kiswahili cha kawaida na hakibani maana kwa wanaume pekee bila ushahidi wa lazima katika muktadha.
- source_word: ὡς καὶ ἐμαυτόν
  choice: kama mimi nilivyo
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi ulinganisho na hali ya Paulo bila kutaja wazi hali hiyo, kama ilivyo katika chanzo.
- source_word: χάρισμα
  choice: karama
  rationale: “Karama” ni istilahi iliyozoeleka kwa kipawa kinachotolewa kwa neema na Mungu, na inafaa katika muktadha wa hali tofauti za maisha.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: mmoja ya namna hii na mwingine ya namna ile
  rationale: Huhifadhi utofautishaji wa Kigiriki kwa mtindo wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Maana ya kuwa “kama mimi”
  choice: Kuacha hali mahususi bila kutajwa wazi
  alternative: Kufafanua kuwa Paulo alikuwa mseja au alikuwa na karama ya kujizuia
  rationale: Aya yenyewe haitaji kwa jina hali ya Paulo; muktadha unaielekeza, lakini tafsiri haipaswi kuondoa udokezo au kulazimisha ufafanuzi mmoja.
- issue: Asili na utofauti wa karama
  choice: Kusema kila mmoja ana karama yake mwenyewe kutoka kwa Mungu
  alternative: Kufanya useja pekee kuwa karama inayotajwa
  rationale: Muundo wa chanzo unahusisha kila mtu na karama kutoka kwa Mungu na kutofautisha “namna hii” na “namna ile,” hivyo unaacha aina hizo katika mvutano wake wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Sentensi inadumisha tofauti kati ya tamanio la Paulo na mgawanyo wa karama za Mungu.
