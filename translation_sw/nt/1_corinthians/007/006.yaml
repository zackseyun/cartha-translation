translation:
  language: sw
  text: Lakini nasema haya kwa ruhusa, si kwa amri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa njia ya ruhusa” au “kama jambo linaloruhusiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hivi
  rationale: Kielezi hiki kinaelekeza kwenye jambo linalohusika katika muktadha bila kulazimisha kama Paulo anarejelea maneno yaliyotangulia au yanayofuata.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti nyepesi au mpito; “Lakini” linaweka wazi utofauti kati ya ruhusa na amri.
- source_word: λέγω
  choice: nasema
  rationale: Wakati wa sasa wa Kigiriki umetafsiriwa kwa wakati wa sasa wa Kiswahili kwa mtindo wa kawaida na wa moja kwa moja.
- source_word: κατὰ συγγνώμην
  choice: kama ruhusa
  rationale: Katika muktadha huu kirai hiki kinaonyesha jambo linaloruhusiwa, si wajibu; “kama ruhusa” ni wazi na kinatofautiana vizuri na “kama amri.”
- source_word: οὐ
  choice: si
  rationale: Huu ni ukanushi wa kawaida unaolingana kiasili na muundo “kama ruhusa, si kama amri.”
- source_word: κατ’ ἐπιταγήν
  choice: kama amri
  rationale: Kirai hiki kinamaanisha agizo lenye mamlaka; “kama amri” ni tafsiri ya moja kwa moja na inayoeleweka.
theological_decisions:
- issue: Kama kauli ya Paulo ni ruhusa binafsi au amri ya kimungu yenye kiwango cha chini
  choice: Kauli imewasilishwa wazi kuwa ruhusa, si amri inayowafunga wasomaji.
  alternative: Ushauri huo bado unaweza kubeba mamlaka ya kitume kwa njia isiyo ya moja kwa moja.
  rationale: Mstari wenyewe unatofautisha ruhusa na amri. Tafsiri inadumisha tofauti hiyo bila kutoa uamuzi wa ziada kuhusu upeo wa mamlaka ya Paulo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida, huku tofauti ya msingi kati ya ruhusa na amri ikihifadhiwa.
