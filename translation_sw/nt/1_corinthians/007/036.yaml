source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: sw
  text: Lakini mtu yeyote akidhani kwamba anamtendea isivyofaa bikira wake[a], ikiwa umri wake wa ujana umepita na ni lazima iwe hivyo, afanye atakavyo; hatendi dhambi. Wafunge ndoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mchumba wake bikira”; katika tafsiri ya mapokeo, pia imeeleweka kuwa “binti yake bikira.” Kigiriki kina utata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: anamtendea isivyofaa
  rationale: Kitenzi hiki kinaonyesha kumtendea mtu kwa namna isiyofaa au isiyo na heshima; tafsiri hii ni ya kawaida na haiingizi uzito wa ziada wa kimaadili.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: bikira wake
  rationale: παρθένος ni “bikira,” huku uhusiano unaoonyeshwa na αὐτοῦ ukiwa na utata katika muktadha huu. “Bikira wake” huhifadhi uwezekano wa mchumba au binti bikira bila kuamua tafsiri katika matini kuu.
- source_word: ὑπέρακμος
  choice: amepita ujana wake
  rationale: Neno hili humaanisha kuwa amevuka kilele au kipindi bora cha ujana. Usemi huu wa Kiswahili ni wa asili kiasi na hauweki umri maalumu wa kisasa.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: na inapaswa kuwa hivyo
  rationale: ὀφείλει huonyesha ulazima au wajibu, na γίνεσθαι ni pana. Tafsiri hii inadumisha ujumla wa Kigiriki bila kutaja sababu ambayo matini haitaji waziwazi.
- source_word: ὃ θέλει ποιείτω
  choice: na afanye analotaka
  rationale: Huhifadhi nguvu ya amri ya kuruhusu kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: οὐχ ἁμαρτάνει
  choice: hatendi dhambi
  rationale: Hutoa maana ya ruhusa ya kimaadili kwa njia ya kawaida na ya moja kwa moja.
- source_word: γαμείτωσαν
  choice: Na wafunge ndoa
  rationale: Amri ya nafsi ya tatu wingi inawahusu wahusika wawili. “Wafunge ndoa” ni wazi na ya heshima, na huhifadhi nguvu ya amri.
theological_decisions:
- issue: Utambulisho wa “bikira wake” (παρθένον αὐτοῦ)
  choice: Matini kuu inadumisha utata kwa kusema “bikira wake.”
  alternative: Inaweza kumaanisha mchumba wake bikira, au binti yake bikira aliye chini ya uangalizi wake.
  rationale: Usemi wa Kigiriki una utata wa kweli, na muktadha umefasiriwa kwa njia zote mbili. Tanbihi inataja uwezekano mkuu bila kulazimisha mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unalenga uwiano bora huku ukidumisha utata wa chanzo.
