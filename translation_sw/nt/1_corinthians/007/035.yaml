  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: sw
  text: Ninasema hivi kwa faida yenu wenyewe, si ili niwatie kitanzi, bali kwa ajili ya mwenendo unaofaa na kujitoa kwa Bwana bila kukengeushwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: faida
  rationale: Huwasilisha jambo lenye manufaa kwa wasomaji katika Kiswahili cha kawaida na chenye hadhi.
- source_word: βρόχον
  choice: kitanzi
  rationale: Hudumisha taswira halisi ya mtego au kitanzi, badala ya kuilegeza kuwa amri au kizuizi tu.
- source_word: εὔσχημον
  choice: mwenendo unaofaa
  rationale: Katika muktadha wa mashauri kuhusu hali ya maisha na kujitoa kwa Bwana, neno hili linaelekea kwenye jambo la heshima na linalofaa; 'mwenendo unaofaa' ni asilia zaidi kuliko nomino dhahania pekee.
- source_word: εὐπάρεδρον τῷ κυρίῳ
  choice: kumhudumia Bwana
  rationale: Kirai kina wazo la kukaa karibu na Bwana kwa kujitoa au kumtumikia kwa uaminifu. 'Kumhudumia' hutoa Kiswahili cha kawaida bila kulazimisha taswira ya kuketi.
- source_word: ἀπερισπάστως
  choice: bila kukengeushwa
  rationale: Huhifadhi maana ya kutovutwa huku na huku au kutatizwa na mambo mengine.
theological_decisions:
- issue: Aina ya kujitoa kwa Bwana katika εὐπάρεδρον τῷ κυρίῳ
  choice: kumhudumia Bwana
  alternative: kujitoa kwa Bwana
  rationale: Chaguo hili linaendeleza maana ya kuwa tayari mbele za Bwana kwa huduma ya kudumu, bila kuifanya kauli kuwa istilahi maalumu ya kidhehebu. Hata hivyo, halidai kwamba huduma rasmi pekee ndiyo inayokusudiwa.
- issue: Nguvu ya sitiari βρόχον
  choice: kitanzi
  alternative: kizuizi
  rationale: Maandishi ya Kigiriki yanatumia sitiari kali ya kitanzi; kuihifadhi kunaonyesha kwamba Paulo hataki kuwafunga au kuwanasa wasomaji kwa shauri lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa sentensi unahifadhi tofauti kati ya faida ya wasomaji, kutowafunga kwa kitanzi, mwenendo unaofaa, na huduma kwa Bwana isiyokengeushwa.
