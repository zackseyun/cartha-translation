  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: sw
  text: Lakini ikiwa atatengana naye[a], na abaki bila kuolewa, au apatanishwe na mume wake—wala mume asimpe talaka[b] mke wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini hata ikiwa atatengana naye.” Kigiriki kinaweza kuwa na maana kidogo ya kukubali hali hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “asimwache mke wake.” Kitenzi hicho kinaweza kumaanisha kihalisi kumwacha au kumfukuza, lakini katika muktadha huu wa ndoa kwa kawaida hurejelea talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Lakini ikiwa
  rationale: Huanzisha sharti lenye uwezekano wa maana ya kukubali hali fulani; tafsiri kuu ni ya asili, huku maana ya “hata ikiwa” ikihifadhiwa katika tanbihi.
- source_word: χωρισθῇ
  choice: atatengana naye
  rationale: Kitenzi χωρίζω hapa kinahusu kutengana kwa wanandoa bila kukifanya kiwe lazima talaka ya kisheria. “Naye” huweka wazi uhusiano unaoeleweka katika muktadha.
- source_word: μενέτω ἄγαμος
  choice: na aendelee kuwa bila kuolewa
  rationale: Huhifadhi nguvu ya agizo la μενέτω na hali mahususi ya kutokuwa katika ndoa iliyo katika ἄγαμος. “Bila kuolewa” ni Kiswahili cha kawaida na kinachomrejelea mwanamke katika muktadha.
- source_word: καταλλαγήτω
  choice: apatanishwe
  rationale: Kauli ya kutendwa na hali ya agizo zimehifadhiwa; neno hilo linaeleza kurejeshwa kwa uhusiano bila kuongeza namna au masharti ya upatanisho.
- source_word: τῷ ἀνδρὶ
  choice: na mume wake
  rationale: ἀνήρ katika muktadha wa ndoa humaanisha mume, si mwanamume kwa ujumla.
- source_word: ἄνδρα
  choice: mume
  rationale: Muktadha wa maelekezo yanayolingana kwa wanandoa unahitaji maana ya “mume.”
- source_word: γυναῖκα
  choice: mke wake
  rationale: γυνή hapa humaanisha mke; kiwakilishi “wake” huonyesha uhusiano wa ndoa kwa Kiswahili cha kawaida.
- source_word: μὴ ἀφιέναι
  choice: asimpe talaka
  rationale: Katika muktadha huu ἀφίημι ina nguvu ya kumwacha au kumfukuza mwenzi wa ndoa, yaani kumpa talaka. Muundo wa “asi-” unatoa katazo la moja kwa moja na la kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo χωρισθῇ na ἀφιέναι zitafsiriwe kwa neno lilelile
  choice: χωρισθῇ imetafsiriwa “atatengana naye,” na ἀφιέναι “asimpe talaka.”
  alternative: Kutafsiri vyote viwili kama talaka, au vyote kama kutengana/kuachana.
  rationale: Paulo ametumia vitenzi viwili tofauti. Kutunza tofauti hiyo hakulazimishi χωρισθῇ kuwa talaka rasmi, huku kukitambua nguvu ya ἀφιέναι katika muktadha wa ndoa.
- issue: Nguvu ya καί katika ἐὰν δὲ καὶ
  choice: Maandishi makuu yanasema “Lakini ikiwa,” huku uwezekano wa “hata ikiwa” ukiwekwa katika tanbihi.
  alternative: Lakini hata ikiwa atatengana naye.
  rationale: Kigiriki kinaweza kuwa na maana kidogo ya kukubali hali inayotajwa, lakini si lazima maana hiyo itamkwe wazi; tanbihi huhifadhi utata huo.
- issue: Hali ya mwanamke baada ya kutengana
  choice: “aendelee kuwa bila kuolewa”
  alternative: Aendelee kuwa peke yake / asiingie katika ndoa nyingine.
  rationale: Tafsiri hii inafuata ἄγαμος bila kufafanua zaidi aina au uhalali wa ndoa nyingine, hivyo haiongezi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo umewekwa wazi bila kutumia istilahi nzito za kisheria. Alama zote za tanbihi zimewekwa katika maandishi makuu.
