  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: sw
  text: Lakini atakuwa na furaha zaidi ikiwa atabaki jinsi alivyo[a], kwa maoni yangu—nami nadhani kwamba mimi pia nina Roho wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amebarikiwa zaidi.” Neno la Kigiriki μακαριωτέρα linaweza kueleza hali ya kuwa na baraka zaidi pamoja na kuwa na furaha zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: mwenye furaha zaidi
  rationale: Huu ni ulinganisho wa μακάριος. Katika ushauri huu wa kichungaji, “mwenye furaha zaidi” ni Kiswahili cha kawaida kinachoeleza hali iliyo bora kwa mhusika bila kulazimisha maana ya kidini ya “aliyebarikiwa zaidi,” ingawa maana hiyo pia inawezekana.
- source_word: ἐὰν οὕτως μείνῃ
  choice: akibaki jinsi alivyo
  rationale: Kitenzi μένω humaanisha kubaki au kuendelea katika hali fulani, na οὕτως hurejelea hali yake ya sasa ya kutokuwa na mume. Tafsiri hii inadumisha rejeo hilo bila kuongeza maelezo yasiyotajwa wazi katika mstari.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: kwa maoni yangu
  rationale: γνώμη hapa ni maoni au uamuzi uliofikiwa baada ya kufikiri. “Kwa maoni yangu” ni lugha ya sasa na ya heshima, na hudumisha tofauti kati ya ushauri wa Paulo na amri ya moja kwa moja ya Bwana iliyotajwa katika muktadha.
- source_word: δοκῶ
  choice: nadhani
  rationale: δοκέω hapa huwasilisha dai kwa unyenyekevu wa kimatamshi. “Nadhani” hudumisha namna hiyo ya kusema bila kugeuza kauli kuwa shaka tupu.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Crasis hii ina maana ya “na mimi pia.” Kutaja “mimi” pamoja na “pia” kunadumisha mkazo wa nyongeza, huenda kwa kulinganisha kwa ndani na watu wengine waliodai kuwa na mamlaka ya kiroho.
- source_word: πνεῦμα θεοῦ
  choice: Roho wa Mungu
  rationale: Katika matumizi ya Paulo, kifungu hiki hapa kwa kawaida humrejelea Roho wa Mungu, si tabia ya kiroho kwa ujumla. Herufi kubwa katika “Roho” inaonyesha rejeo hilo la kibinafsi bila kuongeza neno “Mtakatifu,” ambalo halimo katika kifungu cha Kigiriki.
- source_word: ἔχειν
  choice: nina
  rationale: Hiki ni kitenzi-jina kinachokamilisha δοκῶ na maana yake ya kawaida ni kuwa na. “Nina” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
theological_decisions:
- issue: Ikiwa πνεῦμα θεοῦ humaanisha Roho Mtakatifu au mwelekeo wa kiroho kwa ujumla
  choice: Kifungu kimetafsiriwa “Roho wa Mungu,” kikimrejelea Roho wa Mungu mwenyewe.
  alternative: roho kutoka kwa Mungu; ufahamu wa kiroho unaotoka kwa Mungu
  rationale: Matumizi ya kawaida ya Paulo na hoja ya muktadha vinaonyesha kwamba Paulo anatetea uhalali wa kiroho wa ushauri wake. Tafsiri haigeuzi ushauri huo kuwa amri ya moja kwa moja ya Bwana, lakini pia haipunguzi dai lake kuwa mtazamo wa kibinadamu tu.
- issue: Nguvu ya kauli δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: Kauli ya unyenyekevu wa kimatamshi ambayo bado ni dai halisi la kuongozwa na Roho
  alternative: Paulo hana uhakika kama ana Roho; kauli ni kejeli dhidi ya wapinzani
  rationale: “Nadhani kwamba mimi pia nina” hudumisha sauti ya Paulo yenye kiasi na pia dai lake la kweli. Haiongezi uhakika mkali kuliko Kigiriki wala kuitafsiri kama mashaka ya kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “akibaki jinsi alivyo” ni wa asili na hudumisha kutotajwa wazi kwa hali inayorejelewa; muktadha ndio unaoonyesha kwamba ni hali ya kutokuwa na mume. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
