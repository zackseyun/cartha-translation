reference: 1 Corinthians 7:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: sw
  text: Mke amefungwa maadamu mume wake yu hai; lakini mume wake akifa[a], yuko huru kuolewa na yeyote amtakaye, ila tu katika Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “akilala.” Kigiriki hutumia “kulala” kama tasfida iliyozoeleka ya kufa.'
    reason: lexical_alternative
  - marker: b
    text: “Katika Bwana” kwa kawaida hueleweka kuwa kuolewa na mtu aliye wa Bwana, yaani mwamini mwenzake; usemi huo pia unaweza kusisitiza kutenda kwa uaminifu kwa Bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Mke
  rationale: Katika muktadha huu wa ndoa, neno hili humaanisha mke, si mwanamke kwa ujumla.
- source_word: δέδεται
  choice: amefungwa
  rationale: Kauli timilifu ya kutendwa inaonyesha hali ya kufungwa inayoendelea, huku ikihifadhi uzito wa kisheria na wa uhusiano.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: maadamu ... yu hai
  rationale: Hii ni tafsiri ya kawaida na yenye hadhi ya usemi unaoonyesha muda wote ambao mume anaishi.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: mume wake
  rationale: Katika muktadha wa ndoa, ἀνήρ humaanisha mume.
- source_word: κοιμηθῇ
  choice: akifa
  rationale: Kitenzi cha Kigiriki, kwa maana halisi 'akilala,' ni tasfida iliyozoeleka ya kifo. Kiswahili 'akifa' huwasilisha maana yake kwa uwazi; sitiari ya chanzo imeelezwa katika tanbihi.
- source_word: ἐλευθέρα ἐστίν
  choice: yuko huru
  rationale: Hueleza kuachiliwa kutoka kifungo cha ndoa ya awali kwa Kiswahili cha kawaida.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: kuolewa na yeyote amtakaye
  rationale: Huhifadhi uhuru wa uchaguzi wa mwenzi na pia mwelekeo wa kitenzi cha kutendwa, kwa Kiswahili asilia.
- source_word: μόνον ἐν κυρίῳ
  choice: ila tu katika Bwana
  rationale: Huhifadhi nguvu ya sharti la μόνον na usemi wa Paulo uliofupishwa bila kuupanua kimafundisho.
theological_decisions:
- issue: Maana ya “katika Bwana” katika maagizo kuhusu kuolewa tena
  choice: ila tu katika Bwana
  alternative: ila tu na mtu aliye wa Bwana, yaani mwamini mwenzake
  rationale: Usemi wa Kigiriki ni mfupi na unaweza kuonyesha ndoa ndani ya uaminifu kwa Bwana. Tafsiri ya moja kwa moja huhifadhi mvutano wake wa kiteolojia; maana ya kawaida imewekwa tanbihini bila kuifunga sentensi kuu kwa fasiri moja.
- issue: Tasfida ya kifo katika κοιμηθῇ
  choice: akifa katika matini kuu, huku tanbihi ikitaja maana halisi “akilala”
  alternative: akilala
  rationale: Katika Kiswahili cha sasa, 'akilala' peke yake inaweza kueleweka kama usingizi wa kawaida na hivyo kuficha maana. 'Akifa' huwasilisha maana ya tasfida kwa uwazi, huku tanbihi ikihifadhi sitiari ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maadamu” na “yu hai” vinaweka sentensi fupi na ya asili; “amefungwa” huhifadhi taswira ya chanzo, na “katika Bwana” huhifadhi usemi wa Paulo bila kuufafanua kupita kiasi.
