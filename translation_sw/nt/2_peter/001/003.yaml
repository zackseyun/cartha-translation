  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: sw
  text: Kwa kuwa nguvu yake ya kimungu imetujalia yote yanayohusu uzima na uchaji wa Mungu, kwa kumjua yeye aliyetuita kwa utukufu wake mwenyewe na ubora wake[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “aliyetuita kwenye utukufu wake mwenyewe na ubora wake.” Kirai cha Kigiriki kilicho katika hali ya dativu kinaweza kueleweka kwa namna tofauti.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Kwa kuwa
  rationale: Katika muundo huu neno hilo linatanguliza msingi wa himizo linalofuata. “Kwa kuwa” ni Kiswahili cha kawaida kinachoonyesha uhusiano huo wa kisababu.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: uweza wake wa kimungu
  rationale: “Uweza” huonyesha nguvu yenye uwezo wa kutenda, na “wa kimungu” huhifadhi maana ya θείας bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: δεδωρημένης
  choice: umetujalia
  rationale: Kitenzi hiki kinaonyesha kutoa kwa neema na tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: kila kitu kwa ajili ya uzima na uchaji wa Mungu
  rationale: Huhifadhi upeo wa πάντα na maana ya mambo yanayohusu au kutumika kwa uzima na maisha yanayomwelekea Mungu.
- source_word: ζωὴν
  choice: uzima
  rationale: “Uzima” huacha maana pana ya ζωὴ, ikijumuisha maisha ya sasa na maana ya mwisho wa nyakati bila kuibana.
- source_word: εὐσέβειαν
  choice: uchaji wa Mungu
  rationale: Ni usemi wa sasa na unaoeleweka unaoonyesha heshima na mwenendo unaomwelekea Mungu; haumaanishi uchaji wa woga tu.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: kwa njia ya kumjua
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la ujuzi wa mtu binafsi bila kulazimisha maana ya kitaalamu ya “ujuzi kamili.”
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: yeye aliyetuita
  rationale: Huhifadhi matumizi ya kishirikishi kama jina la mtu na tendo la kuita.
- source_word: ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: kwa utukufu na ubora wake mwenyewe
  rationale: “Kwa” huwasilisha dativu kama njia au msingi wa kuitwa; “wake mwenyewe” huhifadhi msisitizo wa umilikaji, na “ubora” hufaa kwa ἀρετή inaposemwa kuhusu Mungu.
theological_decisions:
- issue: Maana ya dativu katika ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: kwa utukufu na ubora wake mwenyewe
  alternative: kwenye utukufu na ubora wake mwenyewe
  rationale: Kwa usomaji wa SBLGNT, dativu inaweza kueleweka kuwa njia au msingi ambao mwitaji anatumia. Hata hivyo, inaweza pia kueleweka kuwa lengo la mwito; uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa msomaji wa kawaida. Mstari umeachwa na koma kwa kuwa sentensi ya Kigiriki inaendelea katika mistari inayofuata.
