  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: sw
  text: Kwa maana kwa njia hii mtajaliwa kwa wingi kuingia[a] katika ufalme wa milele wa Bwana na Mwokozi wetu, Yesu Masihi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafasi ya kuingia.” Neno la Kigiriki εἴσοδος linaweza kumaanisha tendo la kuingia au njia ya kuingilia.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “Yesu Kristo.” Hapa cheo cha Kigiriki Χριστός kimetafsiriwa “Masihi” ili maana yake ibaki wazi.'
    reason: alternative_reading
  - marker: c
    text: 'Kwa kufuata mpangilio wa Kigiriki kwa karibu zaidi: “kuingia katika ufalme wa milele wa Bwana na Mwokozi wetu, Yesu Masihi, kutatolewa kwa ajili yenu kwa wingi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: οὕτως
  choice: kwa njia hii
  rationale: Hurejelea namna ya maisha iliyoelezwa katika muktadha unaotangulia na kuhifadhi nguvu ya kiashiria cha Kigiriki.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha kuwa mstari huu unatoa sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: πλουσίως
  choice: kwa ukarimu
  rationale: Huwasilisha wazo la kutolewa kwa wingi na kwa namna isiyo na ubahili, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐπιχορηγηθήσεται
  choice: mtajaliwa
  rationale: Kitenzi hiki cha kutendwa huonyesha kwamba kuingia huko kutatolewa kwa wasomaji; ‘mtajaliwa’ ni usemi wa asili wa Kiswahili unaohifadhi wazo la kupewa kwa neema bila kumtaja wazi mtoaji.
- source_word: ὑμῖν
  choice: mta- katika ‘mtajaliwa’
  rationale: Kiambishi cha nafsi ya pili wingi kinawakilisha wale wanaopewa fadhila hiyo kwa njia ya kawaida katika Kiswahili.
- source_word: ἡ εἴσοδος
  choice: kuingia
  rationale: Nomino ya Kigiriki imewasilishwa kwa kitenzi-jina cha Kiswahili, ambacho kwa kawaida huonyesha tendo la kuingia bila kuongeza dhana ya ruhusa au lango.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: katika ufalme wa milele
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali panakoingiwa na sifa ya kudumu milele.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: wa Bwana na Mwokozi wetu
  rationale: Huhifadhi vyeo vyote viwili na kuviunganisha kwa namna inayoonyesha kwamba vinamhusu mtu yuleyule.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός limetafsiriwa kama cheo ‘Masihi’ badala ya kuachwa katika umbo la kimapokeo ‘Kristo’; ‘Yesu Masihi’ ni mpangilio wa kawaida wa cheo hicho katika Kiswahili.
theological_decisions:
- issue: Mhusika wa vyeo ‘Bwana na Mwokozi wetu’
  choice: Vyeo vyote viwili vinamhusu mtu mmoja, Yesu Masihi.
  alternative: Vyeo vinaweza kueleweka kwa uhuru zaidi kana kwamba havina mhusika mmoja.
  rationale: Kifungu cha Kigiriki kina kibainishi kimoja kinachotawala nomino mbili za mtu, za umoja, zilizounganishwa kwa καί; muundo huo unaonyesha kwa nguvu kwamba vyeo vyote vinamhusu Yesu Masihi.
- issue: Namna ya kuwasilisha ἐπιχορηγηθήσεται na εἴσοδος
  choice: ‘mtajaliwa kwa ukarimu kuingia’
  alternative: ‘kuingia ... kutatolewa kwenu kwa wingi’
  rationale: Chaguo kuu huhifadhi hali ya kutendwa na wazo la kupewa kwa wingi, huku likitoa Kiswahili cha asili. Chaguo la karibu zaidi na mpangilio wa Kigiriki ni zito na lisilo la kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtajaliwa kwa ukarimu kuingia’ ni usemi unaoeleweka kwa wasomaji wa kawaida na huepuka sentensi nzito ya kuifanya ‘kuingia’ kuwa kiima cha ‘kutatolewa.’ Koma kabla ya ‘Yesu Masihi’ inaonyesha kwamba jina hilo linamtambulisha ‘Bwana na Mwokozi wetu’ yuleyule.
