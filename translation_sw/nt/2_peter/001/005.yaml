  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: sw
  text: Na kwa sababu hiyo hasa, kwa kutumia bidii yote, katika imani yenu ongezeni[c] wema[b], na katika wema huo maarifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “ubora wa kimaadili.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “toeni” au “ongezeni,” kikiwa na wazo la kutoa kwa ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Na kwa sababu hiyo hasa
  rationale: Kauli hii inaunganisha agizo na yale yaliyotangulia na kulitia mkazo; “kwa sababu hiyo hasa” ni Kiswahili cha kawaida kinachobeba nguvu hiyo.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: mkifanya bidii yote
  rationale: 'Kirai hiki kinaonyesha kitendo kinachoandamana na agizo kuu: waumini wanapaswa kutumia juhudi kamili katika kutekeleza agizo.'
- source_word: ἐπιχορηγήσατε
  choice: ongezeni
  rationale: Kitenzi kina maana ya kutoa au kuandaa kwa ukarimu. Katika mfululizo huu wa sifa, “ongezeni” huwasilisha kwa uwazi na kwa Kiswahili cha kawaida wazo la kuambatanisha sifa moja na nyingine; maana pana zaidi imehifadhiwa katika tanbihi.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: katika imani yenu
  rationale: “Katika” huhifadhi muundo wa ἐν pamoja na hali ya utoaji na uhusiano wake na sifa inayofuata, bila kuufanya uhusiano huo kuwa wa nyongeza pekee.
- source_word: πίστει
  choice: imani
  rationale: “Imani” ndiyo maana ya msingi inayofaa hapa; uwezekano wa “uaminifu” au “kutumaini” umeonyeshwa katika tanbihi.
- source_word: ἀρετήν
  choice: wema
  rationale: Katika muktadha huu ἀρετή ni ubora wa tabia au wema wa kimaadili. “Wema” ni neno la sasa, rahisi kueleweka, na lenye hadhi katika Kiswahili.
- source_word: γνῶσιν
  choice: maarifa
  rationale: “Maarifa” huhifadhi maana ya msingi ya γνῶσις bila kuibana kuwa utambuzi au ufahamu wa aina fulani.
theological_decisions:
- issue: Maana ya πίστις katika orodha ya sifa
  choice: imani
  alternative: uaminifu au kutumaini
  rationale: Muktadha unaruhusu “imani” kama maana ya moja kwa moja, lakini upeo wa neno la Kigiriki unaweza kugusa uaminifu au kutumaini; uwezekano huo haujaondolewa kimya kimya.
- issue: Uhusiano unaoonyeshwa na ἐν kati ya sifa
  choice: katika imani yenu … katika wema huo
  alternative: iongezeeni imani yenu wema, na wema maarifa
  rationale: Muundo wa “katika” huhifadhi kwa karibu mnyororo wa Kigiriki na kutoamua kupita kiasi iwapo sifa hizo ni nyongeza, msingi, au mazingira ambamo nyingine inatolewa. Mpangilio wa Kiswahili umefanywa uwe wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mfululizo wa sifa wa Kigiriki huku mpangilio ukifanywa usomeke kwa kawaida. “Wema huo” huzuia utata wa kisarufi kuhusu rejeo la “wema” katika sehemu ya pili.
