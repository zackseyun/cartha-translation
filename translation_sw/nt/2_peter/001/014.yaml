  to: nikijua kwamba kuweka kando hema langu kumekaribia[a], kama vile Bwana wetu Yesu Masihi alivyonijulisha.
  rationale: The revision corrects the final verb clause and more closely preserves the active ‘putting off/laying aside’ image of the Greek, while retaining the source text’s metaphor and the title “Masihi.”
