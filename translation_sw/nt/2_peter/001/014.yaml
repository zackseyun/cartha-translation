    text: Yaani, Petro anatumia hema kama sitiari ya mwili wake wa muda na anarejelea kifo chake kinachokaribia. Pia yaweza kutafsiriwa, “kuweka kando hema langu kutatokea upesi.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the final verb clause and more closely preserves the active ‘putting off/laying aside’ image of the Greek, while retaining the source text’s metaphor and the title “Masihi.”
