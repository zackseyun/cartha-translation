review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the participial connection, the imminence of Peter’s death, and the tent metaphor. However, “alivyoniweka wazi” does not mean “made [it] clear to me”; it is grammatically and semantically misformed in this context. “Kuondolewa” also shifts the verbal image toward a passive removal, whereas ἀπόθεσις denotes laying aside/putting off.
  naturalness: “Nikijua kwamba ... kumekaribia” is natural as a dependent continuation from the preceding verse. “Bwana wetu Yesu Masihi” is suitably formal. Replacing the final clause with “alivyonijulisha” gives idiomatic, clear Standard East African Swahili.
  terminology: “Bwana,” “Masihi,” and “hema” appropriately represent κύριος, Χριστός, and σκηνώματι. “Kuweka kando hema langu” preserves the source metaphor better than an explicit reference to death or a passive removal.
  issues:
  - severity: high
    issue: “alivyoniweka wazi” is not an appropriate rendering of ἐδήλωσέν μοι.
    rationale: The form suggests that Peter himself was made clear, rather than that the Lord made the matter known to him. “alivyonijulisha” accurately conveys ‘made known to me.’
  - severity: medium
    issue: “kuondolewa kwa hema langu” weakens the lexical image of ἀπόθεσις.
    rationale: The Greek noun conveys putting off or laying aside. “Kuweka kando hema langu” preserves this image without resolving it into death.
  revised_text: nikijua kwamba kuweka kando hema langu kumekaribia[a], kama vile Bwana wetu Yesu Masihi alivyonijulisha.
  revised_footnotes:
