  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: sw
  text: nikijua kwamba kuweka kando hema langu kumekaribia[a], kama vile Bwana wetu Yesu Masihi alivyonijulisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Petro anatumia hema kama sitiari ya mwili wake wa muda na anarejelea kifo chake kinachokaribia. Pia yaweza kutafsiriwa, “kuweka kando hema langu kutatokea upesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: nikijua
  rationale: Kitenzi kishirikishi kinahifadhi uhusiano na sentensi iliyotangulia bila kuufanya wazi kuwa wa sababu.
- source_word: ταχινή
  choice: kumekaribia
  rationale: Katika muktadha huu neno linaonyesha ukaribu wa tukio. Kiswahili hiki ni cha kawaida na hakilazimishi maana yenye nguvu zaidi ya kwamba tukio ni la ghafla.
- source_word: ἀπόθεσις
  choice: kuondolewa
  rationale: Linahifadhi wazo la kuondoa au kuweka kando bila kulifasiri moja kwa moja kuwa kifo.
- source_word: σκηνώματός
  choice: hema langu
  rationale: Neno linamaanisha hema au makao ya muda. ‘Hema langu’ linahifadhi sitiari ya mwili kama makao ya muda.
- source_word: καθὼς καὶ
  choice: kama vile
  rationale: Ni ulinganisho wa kawaida na wa asili katika Kiswahili.
- source_word: κύριος
  choice: Bwana
  rationale: Hiki ndicho cheo cha kawaida cha κύριος katika muktadha huu wa Kikristo.
- source_word: Ἰησοῦς Χριστὸς
  choice: Yesu Masihi
  rationale: Χριστός linaeleweka hapa kama cheo chenye maana ya Masihi, si jina la ukoo.
- source_word: ἐδήλωσέν
  choice: alivyoniweka wazi
  rationale: Usemi huu unaonyesha kufanya jambo lieleweke au lijulikane bila kuongeza dhana maalumu ya ufunuo.
- source_word: μοι
  choice: -ni-
  rationale: Kiambishi cha yambwa ‘-ni-’ katika ‘alivyoniweka’ kinawakilisha dative ya mtu ambaye jambo liliwekwa wazi kwake.
theological_decisions:
- issue: Sitiari ya kifo cha Petro kilichokuwa karibu
  choice: kuondolewa kwa hema langu
  alternative: nitakufa hivi karibuni
  rationale: Tafsiri inahifadhi picha ya mwili kama hema la muda badala ya kuitatua moja kwa moja kuwa ‘kifo.’
- issue: Tafsiri ya Χριστός katika Ἰησοῦς Χριστός
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: ‘Masihi’ huwasilisha maana ya cheo cha Χριστός katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa ‘nikijua’ umeachwa utegemee mstari uliotangulia, kama ilivyo katika Kigiriki.
