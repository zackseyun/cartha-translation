id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: sw
  text: Nasi tunalo neno la kinabii lililo thabiti zaidi[a]. Mnafanya vema kulizingatia kama taa inayong’aa mahali penye giza, mpaka siku itakapopambazuka na nyota ya asubuhi[b] itakapochomoza mioyoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nasi tunalo neno la kinabii lililo hakika zaidi.” Kigiriki kinaweza kueleweka ama kuwa ushuhuda wa mitume unalithibitisha neno la kinabii, ama kuwa unasisitiza uhakika wa neno hilo lenyewe.
    reason: alternative_reading
  - marker: b
    text: “Nyota ya asubuhi” huenda ikawa na mwangwi wa taswira ya Kimasihi; linganisha Ufunuo 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: lililo thabiti zaidi
  rationale: Huhifadhi hali ya ulinganisho ya kivumishi bila kuamua wazi ikiwa ushuhuda wa mitume umelithibitisha neno la kinabii au ikiwa msisitizo ni uthabiti wake wenyewe.
- source_word: προφητικὸν λόγον
  choice: neno la kinabii
  rationale: Ni tafsiri ya kawaida na yenye hadhi inayohifadhi wazo la λόγος na sifa ya kinabii.
- source_word: ᾧ ... προσέχοντες
  choice: Mnafanya vema kulizingatia
  rationale: Hutoa maana ya kuuelekeza ujumbe huo uangalifu mkubwa kwa Kiswahili cha sasa na cha asili.
- source_word: λύχνῳ φαίνοντι
  choice: taa inayong’aa
  rationale: Huhifadhi tashbihi na hali endelevu ya kitenzi-shirikishi cha Kigiriki.
- source_word: αὐχμηρῷ τόπῳ
  choice: mahali penye giza
  rationale: Inafaa kwa taswira ya taa na huwasilisha kwa uwazi maana ya mahali palipo na giza au palipo hafifu.
- source_word: ἡμέρα διαυγάσῃ
  choice: siku itakapopambazuka
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira ya siku kuanza kutoa nuru.
- source_word: φωσφόρος
  choice: nyota ya asubuhi
  rationale: Huwasilisha taswira ya nyota inayoonekana kabla ya mapambazuko bila kuingiza utambulisho wa kitheolojia moja kwa moja katika matini.
- source_word: ἀνατείλῃ
  choice: itakapochomoza
  rationale: Kuchomoza ni kitenzi cha kawaida kwa nyota na hudumisha taswira ya angani.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; inaacha ‘moyo’ kubeba maana pana ya utu wa ndani.
theological_decisions:
- issue: Maana ya βεβαιότερον kuhusiana na ushuhuda wa mitume na neno la kinabii
  choice: neno la kinabii lililo thabiti zaidi
  alternative: neno la kinabii ambalo limethibitishwa zaidi
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa neno la kinabii limethibitishwa na ushuhuda wa mitume, au kuwa unausisitiza uthabiti wake. Tafsiri kuu na tanbihi zinahifadhi uwezekano huo bila kuufunga kwa upande mmoja.
- issue: Utambulisho wa ‘nyota ya asubuhi’
  choice: Taswira imeachwa bila kumtaja mhusika moja kwa moja katika matini kuu.
  alternative: Kuitafsiri wazi kuwa Kristo au kuwa nuru ya mwisho wa nyakati
  rationale: Muktadha mpana wa Biblia unaweza kuipa taswira hii mwangwi wa Kimasihi, lakini aya yenyewe haitaji utambulisho huo wazi. Taswira imehifadhiwa, na tanbihi inaelekeza kwenye rejeo linalohusiana bila kulazimisha hitimisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya kishazi cha kwanza ili isomeke kwa urahisi bila kuvunja uhusiano wa maana. Alama za tanbihi zimewekwa mara baada ya maneno yanayohusika.
