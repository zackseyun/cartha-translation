  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: sw
  text: Nami nitajitahidi pia ili, baada ya kuondoka kwangu[a], mweze kuyakumbuka mambo haya wakati wowote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi, “baada ya kifo changu.” Kigiriki kinasema “baada ya kuondoka kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: nitafanya kila niwezalo
  rationale: Huwasilisha juhudi ya dhati inayodokezwa na kitenzi cha wakati ujao σπουδάσω kwa Kiswahili cha kawaida na chenye uzito.
- source_word: δὲ
  choice: Nami
  rationale: Hapa δέ inaendeleza wazo la mstari uliotangulia badala ya kuonyesha upinzani mkali; “Nami” huunganisha mtiririko kwa kawaida.
- source_word: καὶ
  choice: ili
  rationale: Katika muundo huu, καί inaunga kusudi la juhudi za Petro; “ili” hulieleza kusudi hilo kwa Kiswahili sanifu bila tafsiri ngumu ya neno kwa neno.
- source_word: ἑκάστοτε
  choice: kila wakati
  rationale: Neno hilo lina maana ya kila mara au kila nafasi inapohitajika; “kila wakati” huhifadhi upana huo.
- source_word: ἔχειν ὑμᾶς
  choice: mweze
  rationale: Muundo huu unaonyesha uwezo au fursa; “mweze” ni wa asili katika Kiswahili na huwasilisha maana hiyo.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: baada ya kuondoka kwangu
  rationale: “Kuondoka” huhifadhi sitiari ya ἔξοδος bila kuifafanua kimya kimya kuwa kifo; tanbihi inaeleza maana yake katika muktadha.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: kuyakumbuka mambo haya
  rationale: Huu ni msemo wenye maana ya kukumbuka au kuleta akilini; tafsiri hii ni ya kawaida na wazi.
- source_word: τούτων
  choice: mambo haya
  rationale: Inarejelea mambo ambayo Petro amekuwa akisisitiza katika muktadha wa karibu; “mambo haya” ni ya moja kwa moja.
theological_decisions:
- issue: Maana ya ἔξοδος kuhusu mwisho unaomkaribia Petro
  choice: kuondoka
  alternative: kifo
  rationale: Matini hutumia sitiari kwa kifo kinachomkaribia Petro. Matini kuu inahifadhi sitiari hiyo, huku tanbihi ikitoa maana iliyo wazi zaidi bila kuongeza maana ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida huku sitiari na lengo la muundo wa Kigiriki vikihifadhiwa.
