  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana, mambo hayo yakiwapo kwenu na yakiongezeka[a], yanawafanya msiwe wasio na matokeo wala wasiozaa matunda katika kumjua[b] Bwana wetu Yesu Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa tele.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kumjua kikamilifu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: “Yesu Kristo”; hapa cheo hicho kimetafsiriwa “Yesu Masihi” ili kuhifadhi maana yake.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki kinarejelea mambo yaliyotajwa katika mistari 5–7. “Mambo hayo” huhifadhi rejeo hilo bila kuongeza ufafanuzi wa “sifa.”
- source_word: ὑμῖν ὑπάρχοντα
  choice: yakiwa ndani yenu
  rationale: Muungano wa kihusishi cha udativu na ὑπάρχοντα unaonyesha mambo hayo kuwapo kwa wasomaji au ndani yao. Kiswahili hiki ni cha kawaida na kinafaa kwa sifa zinazodhihirika katika maisha yao.
- source_word: πλεονάζοντα
  choice: kuzidi
  rationale: Neno linaweza kumaanisha kuongezeka au kuwa tele. “Kuzidi” huhifadhi wazo la ukuaji unaoendelea katika muktadha huu.
- source_word: ἀργούς
  choice: wasio na matokeo
  rationale: Katika muktadha huu neno linaonyesha kutokuwa na ufanisi au tija, si uvivu tu. Kauli hii inaeleweka kwa urahisi na inalingana na tofauti inayofuata ya kutokuzaa matunda.
- source_word: ἀκάρπους
  choice: wasiozaa matunda
  rationale: Huhifadhi sitiari ya Kigiriki ya kukosa matunda na huleta Kiswahili cha asili.
- source_word: καθίστησιν
  choice: yatawazuia msiwe
  rationale: 'Kitenzi pamoja na ukanushi maradufu kinaeleza matokeo: mambo hayo huwafanya wasomaji wasiwe wasio na matokeo wala wasiozaa matunda. Muundo huu huepuka tafsiri ngumu ya neno kwa neno.'
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: katika kumjua
  rationale: Muundo huu unaonyesha eneo au uhusiano ambamo ufanisi na kuzaa matunda hutokea. “Katika kumjua” ni Kiswahili cha kawaida na chenye maana wazi.
- source_word: ἐπίγνωσιν
  choice: kumjua
  rationale: Nomino hii humaanisha ujuzi au utambuzi, mara nyingine ikiwa na wazo la maarifa kamili. Kwa kuwa mhusika ni Yesu, “kumjua” ni ya asili kuliko “maarifa ya,” huku uwezekano wa maana yenye nguvu zaidi ukihifadhiwa katika tanbihi.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida na inayofaa ya cheo κύριος katika muktadha wa Kikristo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta au Masihi. “Yesu Masihi” huhifadhi maana ya cheo hicho kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukinakili tu. “Kristo” ni umbo la kawaida la kimapokeo na limetajwa kama mbadala bila kubadili dai la kifungu.
- issue: Nguvu ya maana ya ἐπίγνωσις
  choice: kumjua
  alternative: kumjua kikamilifu
  rationale: Neno linaweza kudokeza ujuzi kamili au wa kina, lakini si lazima nguvu hiyo iongezwe katika matini kuu. Tanbihi huhifadhi uwezekano huo bila kuamua zaidi ya ushahidi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi huhifadhi mantiki ya Kigiriki, sitiari ya kuzaa matunda, na uwezekano wa maana tofauti katika πλεονάζω na ἐπίγνωσις.
