  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: sw
  text: Kwa maana mtu asiye na mambo haya[a] ni kipofu, akiona yaliyo karibu tu[b], akiwa amesahau kutakaswa kwake kutoka katika dhambi zake za zamani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sifa hizi.” Maneno haya yanarejelea sifa zilizotajwa katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “akiwa haoni mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: mtu asiye
  rationale: Kiwakilishi hiki kinamtaja mtu yeyote kwa maana ya jumla; muundo huu ni wa kawaida katika Kiswahili na haulazimishi jinsia.
- source_word: μὴ πάρεστιν ταῦτα
  choice: asiye na mambo haya
  rationale: Muundo huu unaonyesha kwamba mambo yaliyotajwa katika mistari iliyotangulia hayamo ndani ya mtu huyo. “Mambo haya” linaacha rejeo lake pana kama lilivyo katika Kigiriki.
- source_word: τυφλός
  choice: kipofu
  rationale: Hili ni tafsiri ya moja kwa moja inayohifadhi sitiari ya kutokuona.
- source_word: μυωπάζων
  choice: akiona yaliyo karibu tu
  rationale: Huhifadhi picha ya mtu asiyeona mbali na nguvu ya kitenzi kishirikishi, huku likiwa wazi kwa wasomaji wa kawaida.
- source_word: λήθην λαβὼν
  choice: akiwa amesahau
  rationale: Nahau ya Kigiriki, kihalisi “akiwa amepokea usahaulifu,” inatolewa kwa Kiswahili cha kawaida bila kupoteza maana.
- source_word: καθαρισμοῦ
  choice: kutakaswa kwake
  rationale: Nomino hii inahusu kuondolewa kwa unajisi wa dhambi; “kutakaswa” ni neno la kawaida na linalofaa muktadha wa kiroho.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: kutoka katika dhambi zake za zamani
  rationale: “Za zamani” huhifadhi rejeo la dhambi za wakati uliopita, na “kutoka katika” huonyesha kwa kawaida kwamba hizo ndizo dhambi ambazo mtu alitakaswa nazo.
theological_decisions:
- issue: Uhusiano kati ya kuwa kipofu na kuona yaliyo karibu tu
  choice: ni kipofu, akiona yaliyo karibu tu
  alternative: ni kipofu asiyeona mbali
  rationale: Kigiriki kinaweka picha za upofu na kuona kwa karibu pamoja. Tafsiri imehifadhi mvutano huo badala ya kuufanya kuwa kauli moja iliyorahisishwa.
- issue: Rejeo la kiwakilishi αὐτοῦ
  choice: dhambi zake
  alternative: dhambi zao
  rationale: Kigiriki kinamtaja mtu mmoja wa mfano. Kiswahili “zake” huhifadhi umoja bila kudai kwamba kauli hiyo inawahusu wanaume pekee.
- issue: Maana ya utakaso wa dhambi za zamani
  choice: kutakaswa kwake kutoka katika dhambi zake za zamani
  alternative: kutakaswa kwa dhambi zake za zamani
  rationale: Chaguo hili linaonyesha kuwa mtu ndiye aliyetakaswa kutoka katika dhambi, bila kuongeza maelezo ya kimadhehebu kuhusu namna au wakati wa utakaso huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mfululizo wa maelezo ya Kigiriki bila kuwa mzito kupita kiasi.
