  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: sw
  text: Kwa njia ya hayo ametujalia ahadi za thamani na kuu mno, ili kwa njia ya ahadi hizo mpate kufanyika washiriki wa asili ya kimungu[a], mkiisha kuuepuka uharibifu uliomo duniani kwa sababu ya tamaa mbaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye kushiriki asili ya kimungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya tamaa” au “kwa tamaa.” Neno la Kigiriki linaweza kumaanisha tamaa kwa ujumla, lakini hapa lina maana mbaya ya kimaadili kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Kwa njia ya hayo
  rationale: διά pamoja na jenitivi huonyesha njia au chombo. Kiwakilishi kinaendeleza rejeo la mstari uliotangulia bila kulibainisha kupita kiasi.
- source_word: τίμια καὶ μέγιστα
  choice: za thamani na kuu mno
  rationale: “Za thamani” huwasilisha τίμια kwa lugha ya kawaida, na “kuu mno” huonyesha nguvu ya umbo la kiwango cha juu μέγιστα bila kufanya Kiswahili kisikike cha kulazimishwa.
- source_word: ἡμῖν ... δεδώρηται
  choice: ametujalia
  rationale: “Ametujalia” hujumuisha mpokeaji “sisi” na wazo la kutoa kwa neema, huku wakati timilifu ukidokeza tendo lililofanyika lenye matokeo yanayoendelea.
- source_word: ἐπαγγέλματα
  choice: ahadi
  rationale: “Ahadi” ni neno la kawaida na sahihi kwa dhamana au mambo ambayo Mungu ameahidi.
- source_word: διὰ τούτων
  choice: kwa njia ya ahadi hizo
  rationale: Kirejeo “hizo” kwa kawaida kinazielekea ahadi zilizotajwa mara moja kabla; kutaja “ahadi” tena hufanya Kiswahili kiwe wazi bila kubadili maana.
- source_word: γένησθε
  choice: mpate kuwa
  rationale: Huhifadhi wazo la kuja kuwa au kufanyika, wala si hali tuli tu.
- source_word: θείας κοινωνοὶ φύσεως
  choice: washiriki wa asili ya kimungu
  rationale: “Washiriki” huonyesha kushiriki kwa kweli, na “asili ya kimungu” huhifadhi uzito na upana wa usemi wa Kigiriki bila kuuingiza katika mfumo maalumu wa kimafundisho.
- source_word: ἀποφυγόντες
  choice: mkiisha kuuepuka
  rationale: Muundo huu huonyesha tendo lililotangulia au linaloambatana na kuwa washiriki, kama ilivyo kwa kitenzi-shirikishi cha aoristi.
- source_word: φθορᾶς
  choice: uharibifu
  rationale: Katika muktadha huu neno linahusu kuharibika kimaadili na kiroho, ingawa linaweza pia kubeba wazo la kuoza au kuangamia.
- source_word: ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ
  choice: uliomo duniani kwa sababu ya tamaa mbaya
  rationale: “Uliomo duniani” huonyesha kuwa kirai kinaufafanua uharibifu. “Tamaa mbaya” huwasilisha nguvu hasi ya ἐπιθυμία katika muktadha, na “kwa sababu ya” huonyesha uhusiano wake na uharibifu.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως na ushiriki katika asili ya kimungu
  choice: washiriki wa asili ya kimungu
  alternative: wenye kushiriki asili ya kimungu
  rationale: Usemi wenye nguvu wa andiko umehifadhiwa bila kudhoofishwa wala kufafanuliwa kuwa waumini wanakuwa Mungu kwa asili. Maelezo ya tanbihi yanazuia uelewaji huo bila kuingiza fundisho maalumu katika matini.
- issue: Nguvu hasi ya kimaadili ya ἐπιθυμία
  choice: tamaa mbaya
  alternative: tamaa; ashiki
  rationale: Neno lenyewe linaweza kumaanisha tamaa kwa ujumla, lakini hapa linahusishwa na uharibifu wa duniani. “Mbaya” huweka wazi nguvu ya muktadha bila kulifungia neno katika tamaa ya kingono pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. “Ametujalia” na “kuu mno” huhifadhi uzito wa kifungu bila kutumia lugha ya kizamani; sentensi inadumisha uhusiano wa hoja na mstari uliotangulia.
