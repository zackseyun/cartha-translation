  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: sw
  text: 'Simeoni Petro, mtumwa na mtume wa Yesu Masihi, kwa wale waliopokea imani yenye thamani sawa na yetu[a] katika[b] haki ya Mungu wetu na Mwokozi, Yesu Masihi[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imani yenye hadhi sawa na yetu.” Kivumishi cha Kigiriki kinaweza kusisitiza usawa wa thamani, heshima, au fursa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa haki” au “kwa njia ya haki.” Kihusishi cha Kigiriki kinaweza kuonyesha mazingira au njia.
    reason: lexical_alternative
  - marker: c
    text: Kwa uwezekano mkubwa, Kigiriki humtaja Yesu Masihi kuwa “Mungu wetu na Mwokozi.” Usomaji mwingine, ingawa una uwezekano mdogo, ni “haki ya Mungu wetu na ya Mwokozi Yesu Masihi,” ukirejelea watu wawili.
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simeoni Petro
  rationale: “Simeoni” huakisi moja kwa moja umbo la Kigiriki Συμεών badala ya Σίμων; “Petro” ndilo umbo la kawaida la jina Πέτρος katika Kiswahili.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha kuwa Petro ni mali ya Yesu kabisa na yuko chini ya mamlaka yake, si kwamba anatoa huduma kwa hiari tu.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Hili ndilo neno la Kiswahili lililozoeleka kwa mtu aliyetumwa rasmi akiwa na mamlaka ya utume.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya “Masihi”; umbo hili ni la asili na lenye kueleweka katika Kiswahili.
- source_word: τοῖς ... λαχοῦσιν
  choice: kwa wale waliopokea
  rationale: Hueleza kwamba imani waliipokea, si kwamba waliipata kwa juhudi au kustahili kwao; haikulazimishi taswira halisi ya kupigiwa kura.
- source_word: ἰσότιμον ... πίστιν
  choice: imani yenye thamani sawa na yetu
  rationale: Huhifadhi wazo la usawa wa thamani, heshima, au fursa kati ya imani ya wasomaji na ya waandishi bila kudokeza kuwa imani yao ni ya daraja la chini.
- source_word: πίστιν
  choice: imani
  rationale: Katika muktadha huu neno linamaanisha imani inayoshirikiwa na waamini, na “imani” ndilo neno la kawaida na sahihi la Kiswahili.
- source_word: ἐν δικαιοσύνῃ
  choice: katika haki
  rationale: Tafsiri hii inabaki karibu na muundo wa Kigiriki na kuhifadhi uwezekano kwamba ἐν inaonyesha mazingira au njia; maana ya “kwa njia ya haki” imewekwa katika tanbihi.
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: “Haki” ni tafsiri ya kawaida ya δικαιοσύνη katika Kiswahili na inafaa katika muktadha huu kuliko maelezo marefu yanayoweza kufunga maana.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: ya Mungu na Mwokozi wetu, Yesu Masihi
  rationale: Muundo huu wa Kiswahili, pamoja na kibainishi “Yesu Masihi,” unaonyesha kwa njia ya asili kwamba mtu mmoja ndiye anayeitwa Mungu na Mwokozi, sawa na usomaji unaowezekana zaidi wa sarufi ya Kigiriki.
theological_decisions:
- issue: Ikiwa “Mungu na Mwokozi wetu, Yesu Masihi” humrejelea mtu mmoja au watu wawili
  choice: 'Mtu mmoja: Yesu anaitwa Mungu na Mwokozi wetu.'
  alternative: 'Watu wawili: “Mungu wetu” na “Mwokozi Yesu Masihi.”'
  rationale: Katika Kigiriki, nomino mbili za umoja zinazomtaja mtu, θεοῦ na σωτῆρος, zimeunganishwa kwa καί na kutawaliwa na kibainishi kimoja. Muundo huo unaunga mkono sana kwamba zote mbili zinamtaja Yesu. Kwa kuwa usomaji wa watu wawili umewahi kupendekezwa na una uzito wa kiteolojia, umehifadhiwa katika tanbihi.
- issue: Jukumu la ἐν katika kirai ἐν δικαιοσύνῃ
  choice: “katika haki,” bila kuamua kabisa kama ni mazingira au njia
  alternative: “kwa haki” au “kwa njia ya haki”
  rationale: Kihusishi ἐν pamoja na hali ya dative kinaweza kueleza mazingira ambamo imani imepokelewa au njia ambayo kwayo imepokelewa. Matini kuu inadumisha mvutano huo, na tanbihi inaeleza uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. “Mtumwa” huhifadhi nguvu ya δοῦλος, huku “imani yenye thamani sawa na yetu” ikiwa ya asili kuliko tafsiri ya neno kwa neno. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
