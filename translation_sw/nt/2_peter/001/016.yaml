id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: sw
  text: Kwa maana hatukuwajulisha kuhusu nguvu na kuja[a] kwa Bwana wetu Yesu Masihi[b] kwa kufuata ngano zilizotungwa kwa ujanja, bali kwa kuwa mashahidi wa kujionea ukuu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwapo” au “kuwasili.” Neno la Kigiriki παρουσία linaweza kumaanisha kuwapo, kuwasili, au, katika miktadha mingi ya Agano Jipya, kuja kwa Masihi.
    reason: alternative_reading
  - marker: b
    text: Kigiriki “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu neno Χριστός linatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: ngano zilizotungwa kwa ujanja
  rationale: “Ngano” linaonyesha simulizi zisizo na msingi wa kweli katika muktadha huu, huku “zilizotungwa kwa ujanja” likihifadhi wazo la simulizi zilizobuniwa kwa ustadi wa kupotosha.
- source_word: ἐξακολουθήσαντες
  choice: kwa kufuata
  rationale: 'Hili linaonyesha njia iliyokanushwa na kudumisha ulinganifu wa sentensi: si kwa kufuata ngano, bali kwa kuwa mashahidi.'
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: hatukuwajulisha kuhusu
  rationale: Kauli hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kufanya jambo lijulikane kwa wasomaji.
- source_word: δύναμιν
  choice: nguvu
  rationale: “Nguvu” ndilo neno la moja kwa moja na la kawaida kwa δύναμις katika muktadha huu.
- source_word: παρουσίαν
  choice: kuja
  rationale: Katika muktadha unaomhusu Yesu, παρουσία mara nyingi huelekea kumaanisha kuja kwake, ingawa maana za “kuwapo” na “kuwasili” zinawezekana na zimehifadhiwa katika tanbihi.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo κύριος kinapotumiwa kumhusu Yesu.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; “Masihi” huwasilisha maana yake badala ya kuitumia tu kama jina lililohamishwa kifonolojia.
- source_word: ἐπόπται γενηθέντες
  choice: kwa kuwa mashahidi waliojionea wenyewe
  rationale: Kauli hii inasisitiza ushuhuda wa kuona moja kwa moja na kuhifadhi tofauti kati ya ngano zilizotungwa na jambo lililoshuhudiwa.
- source_word: μεγαλειότητος
  choice: ukuu
  rationale: “Ukuu” ni neno la asili na lenye hadhi linalowasilisha uzuri mkuu na utukufu unaodokezwa na μεγαλειότης.
- source_word: ἐκείνου
  choice: wake
  rationale: Kiwakilishi hiki kinamrejelea Bwana Yesu Masihi kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya παρουσία katika muktadha wa Kikristo
  choice: kuja
  alternative: kuwapo au kuwasili
  rationale: Matumizi mengi ya Agano Jipya yanapotaja Yesu yanaipa παρουσία maana ya kuja kwake. Hata hivyo, kwa kuwa neno lenyewe pia linaweza kumaanisha kuwapo au kuwasili, uwezekano huo haujafutwa bali umeandikwa katika tanbihi.
- issue: Kutafsiri Χριστοῦ kama cheo au umbo la jina
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki Χριστός bado ina nguvu ya cheo cha Yesu; kwa hiyo “Masihi” linaonyesha maana ya cheo hicho waziwazi, huku “Kristo” likitajwa kama umbo jingine linalotumiwa sana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa “si kwa kufuata … bali kwa kuwa mashahidi” umehifadhi tofauti ya msingi ya Kigiriki bila kuondoa uwezekano wa maana katika παρουσία.
