  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: sw
  text: Kwa maana unabii haukuletwa kamwe kwa mapenzi ya mwanadamu,[a] bali wanadamu walisema kutoka kwa Mungu, wakiongozwa na Roho Mtakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haukuanzishwa kwa mapenzi ya kibinadamu.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa na kinahusiana na kitenzi kinachotafsiriwa “wakiongozwa” baadaye katika mstari.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kwa uhalisi zaidi ni “wakibebwa na Roho Mtakatifu,” kikisisitiza uongozi hai wa Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: kwa mapenzi ya mwanadamu
  rationale: 'Kirai hiki kinahifadhi umoja wa ἀνθρώπου na maana ya chombo au chanzo cha msukumo: unabii haukutokana na uamuzi wa kibinadamu.'
- source_word: ἠνέχθη
  choice: haukuletwa
  rationale: Kitenzi cha kutendwa kinahifadhi wazo la unabii kuletwa au kutokezwa, na kina uhusiano wa kimsamiati na φερόμενοι baadaye katika mstari.
- source_word: προφητεία
  choice: unabii
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa ujumbe au usemi wa kinabii katika muktadha huu.
- source_word: ποτέ
  choice: kamwe
  rationale: Pamoja na οὐ, neno hili linasisitiza kwamba jambo hilo halikutokea wakati wowote.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: na Roho Mtakatifu
  rationale: Muundo wa Kigiriki unaonyesha Roho Mtakatifu kuwa mtendaji anayewaongoza wasemaji.
- source_word: φερόμενοι
  choice: huku wakiongozwa
  rationale: Tafsiri hii ya Kiswahili ni ya asili na inaonyesha msukumo na uongozi hai wa Roho, bila kudokeza udiktishaji wa kimashine; tanbihi inahifadhi taswira halisi ya 'kubebwa'.
- source_word: ἐλάλησαν
  choice: walisema
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kusema.
- source_word: ἀπὸ θεοῦ
  choice: yaliyotoka kwa Mungu
  rationale: Muundo huu unahifadhi maana ya Mungu kuwa chanzo cha yale yaliyosemwa, na kuutofautisha na uongozi wa Roho unaoonyeshwa kwa ὑπό.
- source_word: ἄνθρωποι
  choice: wanadamu
  rationale: Neno hili linaonyesha watu waliozungumza na linahifadhi tofauti kati ya watendaji wa kibinadamu na chanzo cha kimungu bila kuweka jinsia isiyodaiwa na muktadha.
theological_decisions:
- issue: Uhusiano wa utendaji wa Mungu na wa wanadamu katika unabii
  choice: Wanadamu wenyewe walisema, lakini yaliyosemwa yalitoka kwa Mungu nao waliongozwa na Roho Mtakatifu.
  alternative: Kusema kwamba Roho aliwadiktia maneno kimashine, au kwamba unabii ulitokana kwa sehemu na mpango huru wa wanadamu.
  rationale: Kigiriki kinadumisha kwa pamoja usemi halisi wa wanadamu (ἐλάλησαν ἄνθρωποι), chanzo cha kimungu (ἀπὸ θεοῦ), na uongozi thabiti wa Roho (ὑπὸ πνεύματος ἁγίου φερόμενοι). Tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wanadamu” limetumiwa katika maana ya uwakilishi wa kibinadamu; “huku wakiongozwa” ni la asili zaidi kuliko “huku wakibebwa,” huku tanbihi ikihifadhi taswira ya Kigiriki.
