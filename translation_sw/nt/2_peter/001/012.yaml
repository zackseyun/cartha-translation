  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: sw
  text: Kwa hiyo, sikuzote nitakuwa tayari kuwakumbusha mambo haya, ingawa mnayajua na mmeimarishwa katika kweli iliyopo sasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kweli mliyo nayo sasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni cha kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: μελλήσω
  choice: nitakuwa tayari
  rationale: Hapa kitenzi hiki pamoja na kitenzi-jina kinadokeza utayari au azimio la wakati ujao, si tendo linalokaribia tu kutokea.
- source_word: ἀεὶ
  choice: sikuzote
  rationale: Neno hili linaonyesha tendo la kuendelea au kurudiwa mara kwa mara; “sikuzote” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὑπομιμνῄσκειν
  choice: kuwakumbusha
  rationale: Kitenzi hiki humaanisha kumfanya mtu akumbuke; kiambishi “-wa-” kinaonyesha wazi walengwa wa ukumbusho.
- source_word: περὶ τούτων
  choice: mambo haya
  rationale: περί pamoja na umilikishi humaanisha kuhusu jambo fulani; katika Kiswahili, “kuwakumbusha mambo haya” ni muundo wa kawaida usiohitaji “kuhusu.”
- source_word: καίπερ
  choice: ingawa
  rationale: “Ingawa” huonyesha kwa uwazi maana ya kukubali jambo linaloweza kuonekana kuwa kinyume na tendo kuu.
- source_word: εἰδότας
  choice: mnayajua
  rationale: Hali ya kujua inaelekezwa kwa wasomaji, na kiambishi “-ya-” kinarejelea wazi “mambo haya.”
- source_word: ἐστηριγμένους
  choice: mmeimarishwa
  rationale: Kauli timilifu tendwa inaonyesha kwamba walitiwa nguvu au kuthibitishwa hapo awali na sasa wako katika hali thabiti; “mmeimarishwa” huhifadhi kauli tendwa na matokeo yanayoendelea.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: katika kweli iliyopo sasa
  rationale: Tafsiri hii huhifadhi maana ya msingi ya παρούσῃ kama kitu kilichopo sasa bila kuifanya kuwa istilahi maalumu ya mfumo fulani wa mafundisho.
theological_decisions:
- issue: Maana ya “kweli iliyopo sasa”
  choice: katika kweli iliyopo sasa
  alternative: katika kweli mliyo nayo sasa
  rationale: Kigiriki kinaweza kurejelea kweli iliyopo kati ya wasomaji au waliyo nayo wakati huu. Tafsiri kuu inahifadhi usemi huo usio wa kawaida na haudokezi kipindi maalumu cha kimafundisho; tanbihi inaonyesha maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mantiki ya kifungu, hali ya kukubali inayotambulishwa na καίπερ, na utata halisi wa παρούσῃ ἀληθείᾳ.
