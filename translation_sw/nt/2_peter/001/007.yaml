  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: sw
  text: na katika uchaji kwa Mungu, ongezeni upendo wa kindugu; na katika upendo wa kindugu, ongezeni upendo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: uchaji kwa Mungu
  rationale: Neno hili huonyesha kujitoa kwa Mungu kwa heshima kunakodhihirika katika mwenendo; “uchaji kwa Mungu” huhifadhi mwelekeo kwa Mungu na upande wa kimaadili kwa Kiswahili cha kawaida.
- source_word: φιλαδελφίαν
  choice: upendo wa kindugu
  rationale: Neno hili humaanisha upendo wenye ukaribu wa kifamilia, hasa miongoni mwa waamini. “Upendo wa kindugu” ni usemi wa asili na hutofautishwa na ἀγάπη kwa kibainishi “wa kindugu.”
- source_word: ἀγάπην
  choice: upendo
  rationale: “Upendo” ni tafsiri pana na ya kawaida ya ἀγάπη; hapa unafikia kilele cha mfululizo baada ya upendo wa kindugu bila kuongeza ufafanuzi usio katika Kigiriki.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: na katika ..., ongezeni ...
  rationale: Muundo unaorudiwa wa “na katika” huhifadhi uhusiano wa vipengele katika mfululizo. Kitenzi “ongezeni” kinachukuliwa kutoka mstari wa 5, ambako ndiko mfululizo huu unategemea kisarufi, na kinafanya Kiswahili kieleweke.
- source_word: δέ
  choice: na
  rationale: Hapa δέ ni kiunganishi cha kuendeleza orodha, si cha kuonyesha upinzani.
theological_decisions:
- issue: Kutofautisha φιλαδελφία na ἀγάπη katika mfululizo wa sifa
  choice: φιλαδελφία limetafsiriwa “upendo wa kindugu,” na ἀγάπη “upendo.”
  alternative: Kutumia “mapenzi ya kindugu” kwa φιλαδελφία na “upendo” kwa ἀγάπη.
  rationale: Maneno ya Kigiriki yanahusiana lakini si sawa. Kibainishi “wa kindugu” kinahifadhi upeo maalumu wa φιλαδελφία, huku “upendo” pekee ukihifadhi upeo mpana wa ἀγάπη bila kuingiza fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “upendo” yamehifadhiwa kwa sababu yanaakisi maneno mawili yanayohusiana katika Kigiriki; tofauti inaonyeshwa kwa “wa kindugu.”
