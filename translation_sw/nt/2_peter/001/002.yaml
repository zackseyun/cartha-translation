    reason: alternative_reading
  - marker: b
    text: Au, “katika kumjua Mungu na Yesu, Bwana wetu, kikamilifu.” Neno la Kigiriki linaweza kuwa na maana ya ujuzi ulio kamili zaidi au wa kina zaidi.
    reason: lexical_alternative
