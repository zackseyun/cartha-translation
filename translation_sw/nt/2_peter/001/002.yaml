base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: sw
  text: Neema na amani na zizidishwe kwenu katika kumjua Mungu na Yesu, Bwana wetu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kumjua Mungu na Yesu, Bwana wetu.” Kihusishi cha Kigiriki kinaweza kuonyesha mazingira (“katika”) au njia (“kwa”).
    reason: alternative_reading
  - marker: b
    text: Au, “katika kumjua Mungu na Yesu, Bwana wetu, kikamilifu.” Neno la Kigiriki linaweza kuwa na maana ya ujuzi ulio kamili zaidi au wa kina zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Ni istilahi ya kawaida katika baraka za barua za Agano Jipya, na inadumisha maana ya kibali cha Mungu.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni tafsiri ya kawaida yenye uzito wa kiteolojia na mwangwi wa ustawi mzima.
- source_word: πληθυνθείη
  choice: na vizidishwe
  rationale: Muundo huu wa ombi/baraka unadumisha hali ya kutendwa ya kitenzi cha Kigiriki na kwa Kiswahili unarejelea kwa kawaida neema na amani kwa pamoja.
- source_word: ἐν
  choice: katika
  rationale: Inadumisha kwanza maana ya kuwa ndani ya eneo au mazingira fulani bila kufunga uwezekano wa maana ya njia au chombo.
- source_word: ἐπιγνώσει
  choice: kumjua
  rationale: Kwa Kiswahili, kitenzi-nomino hiki ni cha asili zaidi kuliko 'maarifa ya' na kinafaa kwa kumjua mtu; uwezekano wa maana iliyoimarishwa umewekwa katika tanbihi.
- source_word: θεοῦ
  choice: Mungu
  rationale: Ni tegemezi la ἐπιγνώσει na linamtaja Mungu kama anayejulikana.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri sanifu ya κύριος na inadumisha uzito wa cheo hiki kwa Kristo.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Mungu na Yesu Bwana wetu
  rationale: Muundo huu unawaweka Mungu na Yesu Bwana wetu wote wawili kama wanaohusika katika 'kumjua,' bila kuongeza kiunganishi kisichohitajika.
theological_decisions:
- issue: Dokezo la ἐπίγνωσις katika muktadha wa kiroho
  choice: kumjua
  alternative: kumjua kikamilifu / kuwa na ujuzi kamili juu ya
  rationale: Tafsiri kuu ni ya kawaida na ya uhusiano katika Kiswahili; haigeuzi neno hili moja kwa moja kuwa istilahi maalumu ya kiteolojia, huku tanbihi ikihifadhi uwezekano wa msisitizo wa ujuzi ulio kamili zaidi.
- issue: Nguvu ya ἐν pamoja na ἐπιγνώσει
  choice: katika kumjua Mungu na Yesu Bwana wetu
  alternative: kwa kumjua Mungu na Yesu Bwana wetu
  rationale: Kigiriki kinaweza kuonyesha eneo/mazingira au njia. 'Katika' inadumisha uwazi huo kwa kiwango kikubwa zaidi katika matini kuu, na maana ya njia imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo 'na vizidishwe kwenu' huhifadhi sauti ya baraka na hali ya kutendwa; 'kumjua' ni ya kawaida na ya kiuhusiano kuliko 'maarifa' katika sentensi hii.
