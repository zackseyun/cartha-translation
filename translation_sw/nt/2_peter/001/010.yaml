  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: sw
  text: Kwa hiyo, ndugu[a], jitahidini zaidi kuufanya mwito wenu uwe imara na kuchaguliwa kwenu kuwe imara; kwa maana mkifanya mambo hayo, hakika hamtajikwaa kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki liko katika umbo la “ndugu wa kiume,” lakini katika maamkizi au mawaidha kwa waumini linaweza kuwajumuisha ndugu wa kiume na wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na himizo lililotangulia na kudumisha uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: μᾶλλον
  choice: zaidi
  rationale: Inaongeza nguvu ya amri σπουδάσατε; pamoja na “jitahidini” huleta maana ya kufanya bidii hata zaidi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya kawaida ya wingi wa ἀδελφός na katika Kiswahili inaweza kutumiwa kwa jumuiya nzima bila kubainisha jinsia; tanbihi inaeleza matumizi jumuishi katika muktadha.
- source_word: σπουδάσατε
  choice: jitahidini
  rationale: Kitenzi hiki cha amri kinadai bidii na juhudi ya dhati; “jitahidini” ni cha sasa, cha asili, na chenye hadhi.
- source_word: βεβαίαν
  choice: kuwa hakika
  rationale: Huonyesha hali ya kuthibitishwa au kuimarishwa. “Kuwa hakika” hudumisha maana bila kudokeza kwamba wanadamu ndio wanaoanzisha mwito au uchaguzi wa Mungu.
- source_word: κλῆσιν
  choice: mwito
  rationale: Ni istilahi ya kawaida ya kibiblia kwa wito wa Mungu na hudumisha uzito wa kiteolojia wa neno.
- source_word: ἐκλογὴν
  choice: kuchaguliwa
  rationale: Nomino ya kitendo inaelezwa kwa Kiswahili cha kawaida na kinachoeleweka; inahifadhi wazo la kuwa wamechaguliwa bila kuingiza mfumo maalumu wa kimadhehebu.
- source_word: ποιεῖσθαι
  choice: kufanya
  rationale: Pamoja na βεβαίαν, ina maana ya kufanya mwito na kuchaguliwa viwe hakika au vimethibitishwa; tafsiri ya moja kwa moja inaacha mvutano wa kifungu bila kuufafanua kupita kiasi.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Hurejelea sifa na matendo yaliyotajwa katika muktadha uliotangulia.
- source_word: ποιοῦντες
  choice: mkifanya
  rationale: 'Huwasilisha kishirikishi kama hali yenye nguvu ya sharti kwa Kiswahili cha asili: “mkifanya mambo hayo.”'
- source_word: οὐ μὴ
  choice: hakika ... kamwe
  rationale: Mchanganyiko huu unawakilisha ukanushi wenye mkazo mkubwa wa Kigiriki.
- source_word: πταίσητέ
  choice: mtajikwaa
  rationale: Inahifadhi taswira ya kujikwaa na haifanyi dai hilo kuwa kutotenda dhambi kabisa wala kulifunga moja kwa moja na mfumo fulani wa kuanguka mwisho.
theological_decisions:
- issue: Maana ya “kufanya mwito wenu na kuchaguliwa kwenu kuwa hakika”
  choice: Himizo la kuthibitisha au kuimarisha uhalisi wa mwito na kuchaguliwa kwa kuendelea katika fadhila zilizotajwa.
  alternative: Kudai kwamba juhudi za mwanadamu ndizo zinazoanzisha au kuamua uchaguzi wa Mungu.
  rationale: Muundo wa ποιεῖσθαι pamoja na βεβαίαν unaelekea kwenye kufanya kuwa imara au kuthibitisha. Tafsiri inadumisha himizo halisi na wakati huohuo haisemi zaidi ya maandishi kuhusu uhusiano kati ya juhudi ya mwanadamu na tendo la Mungu.
- issue: Nguvu ya “hakika hamtajikwaa kamwe”
  choice: Ahadi yenye mkazo ya kutokujikwaa wanapoendelea kuyatenda mambo hayo.
  alternative: Dai la kutotenda dhambi yoyote kabisa, au ufafanuzi maalumu kwamba haiwezekani kuanguka mwisho.
  rationale: πταίω huhifadhi taswira ya kujikwaa au kushindwa. Maandishi hayafafanui hapa kwa namna inayolazimisha mojawapo ya mifumo hiyo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini wa asili; maneno “mwito,” “kuchaguliwa,” na “kujikwaa” yanadumisha istilahi na taswira za chanzo bila kuingiza msimamo wa kimadhehebu.
