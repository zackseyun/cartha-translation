  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: sw
  text: na katika maarifa, kujitawala; na katika kujitawala, uvumilivu[a]; na katika uvumilivu, utauwa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ustahimilivu,” “kudumu,” au “uvumilivu wenye subira” kwa neno la Kigiriki ὑπομονή.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kimetumia muundo uliofupishwa, kikiendeleza mlolongo wa sifa kutoka mstari uliotangulia: kila sifa inaongezewa inayofuata.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: maarifa
  rationale: “Maarifa” ni tafsiri ya moja kwa moja na ya kawaida ya γνῶσις katika orodha hii ya sifa, bila kuibana maana kuwa ufahamu wa kiakili pekee.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: kujitawala
  rationale: ἐγκράτεια ni uwezo wa kudhibiti tamaa na misukumo ya mtu. “Kujitawala” ni lugha ya sasa na inaonyesha kujidhibiti kwa upana kuliko “kiasi,” ambalo linaweza kueleweka kama kutofanya jambo kupita kiasi tu.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: uvumilivu
  rationale: ὑπομονή humaanisha kudumu kwa uthabiti chini ya shida. “Uvumilivu” ni neno la kawaida na linaloeleweka katika Kiswahili, huku tanbihi ikihifadhi vivuli vya maana vya ustahimilivu na kudumu.
- source_word: εὐσέβειαν
  choice: utauwa
  rationale: εὐσέβεια hapa ni uchaji na kujitoa kwa Mungu kunakoonekana katika maisha. “Utauwa” ni nomino fupi inayofaa muundo wa orodha na haiongezi maneno yasiyotajwa wazi katika Kigiriki.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: na katika ..., ...
  rationale: Muundo huu unahifadhi ufupisho wa Kigiriki na unaendeleza mlolongo wa sifa kutoka mstari uliotangulia bila kuingiza kitenzi kisichotajwa tena hapa.
- source_word: δέ
  choice: na
  rationale: δέ inaunganisha vipengele vya mlolongo huu kwa nyongeza, wala haionyeshi utofautishaji mkali.
theological_decisions:
- issue: Muundo uliofupishwa wa mlolongo wa sifa
  choice: Kuhifadhi muundo “na katika ..., ...” bila kurudia kitenzi kilichoelezwa katika mstari uliotangulia.
  alternative: “na katika maarifa yenu ongezeni kujitawala; katika kujitawala ongezeni uvumilivu...”
  rationale: Kigiriki kinaendeleza kwa ufupisho agizo la mstari uliotangulia. Kuhifadhi ufupisho huo huepuka kufanya uhusiano wa sifa hizi kuwa wazi zaidi kuliko maandishi yenyewe.
- issue: Maana ya εὐσέβεια
  choice: utauwa
  alternative: uchaji wa Mungu
  rationale: “Utauwa” huhifadhi dhana ya maisha yenye uchaji bila kuipanua sentensi kwa kumtaja Mungu moja kwa moja mahali ambapo nomino ya Kigiriki yenyewe haifanyi hivyo, ingawa mwelekeo wake kwa Mungu umo katika maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umeachwa mfupi kwa kufuata orodha ya Kigiriki; “kujitawala” limetumiwa badala ya “kiasi” ili maana ya udhibiti wa nafsi ieleweke wazi kwa msomaji wa kawaida.
