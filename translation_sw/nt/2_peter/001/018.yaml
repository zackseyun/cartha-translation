  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: sw
  text: Nasi wenyewe tuliisikia sauti hii ikiletwa kutoka mbinguni tulipokuwa pamoja naye juu ya mlima mtakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikibebwa kutoka mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: sauti hii
  rationale: φωνή inarejelea tamko la Mungu katika mstari uliotangulia; “sauti” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ἡμεῖς
  choice: nasi wenyewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo; “nasi wenyewe” kinahifadhi msisitizo wa ushuhuda wa waliosikia.
- source_word: ἠκούσαμεν
  choice: tuliisikia
  rationale: Kitenzi cha wakati uliopita kinaeleza tukio la kuisikia sauti; kiambishi cha yambwa “-i-” kinarejelea sauti kwa njia ya kawaida ya Kiswahili.
- source_word: ἐξ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi chanzo cha sauti kilichoelezwa katika Kigiriki.
- source_word: ἐνεχθεῖσαν
  choice: ikiletwa
  rationale: Kauli ya kutendwa ya φέρω imehifadhiwa. “Ikiletwa” inaeleweka kwa urahisi na haibadili picha ya sauti iliyofikishwa kutoka mbinguni.
- source_word: σὺν αὐτῷ ὄντες
  choice: tulipokuwa pamoja naye
  rationale: Muundo wa kishiriki umetafsiriwa kwa uhusiano wa wakati kwa Kiswahili cha asili, huku “naye” ikidumisha rejeo la muktadha kwa Yesu.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: juu ya mlima mtakatifu
  rationale: “Juu ya mlima” ni matumizi ya kawaida ya Kiswahili kwa mahali walipokuwa, na “mtakatifu” huhifadhi maana ya ἅγιος bila kuutaja mlima.
theological_decisions:
- issue: Mlima unaoitwa “mtakatifu” ni mlima gani
  choice: Kuueleza tu kuwa mlima wa tukio la Yesu kubadilika sura, bila kuupa jina maalumu
  alternative: Kuutambulisha wazi kuwa Mlima Tabori au Mlima Hermoni
  rationale: Matini ya Kigiriki inasema “mlima mtakatifu” lakini haiutaji kwa jina. Tafsiri haiongezi utambulisho unaotokana na mapokeo au makisio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “nasi wenyewe” unaleta mkazo wa mashahidi, na “ikiletwa” huhifadhi kauli ya kutendwa na picha ya Kigiriki bila kuwa wa kizamani.
