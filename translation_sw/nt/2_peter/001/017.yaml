  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: sw
  text: 'Kwa maana alipokea heshima na utukufu kutoka kwa Mungu Baba, wakati sauti ya namna hii ilipoletwa kwake kutoka kwa Utukufu Mkuu[a]: “Huyu ndiye Mwanangu, Mpendwa wangu[b], ambaye nimependezwa naye[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Utukufu Mkuu.” Neno la Kigiriki ὑπό linaweza kuonyesha mtendaji; “kutoka kwa” hukazia chanzo cha sauti kwa Kiswahili cha kawaida.
    reason: lexical_alternative
  - marker: b
    text: 'Au “Huyu ndiye Mwanangu mpendwa.” Kigiriki kinafuata kwa karibu muundo: “Huyu ndiye Mwanangu, Mpendwa wangu.”'
    reason: lexical_alternative
  - marker: c
    text: Au “ninayependezwa naye” au “niliyefurahia.” Kigiriki kina εὐδόκησα katika aoristi, na usemi huo una mwangwi wa masimulizi ya ubatizo na kugeuka sura kwa Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: Kwa maana alipokea ... kutoka kwa Mungu Baba
  rationale: Kirai cha wakati kinatafsiriwa kwa sentensi ya Kiswahili yenye mtiririko wa kawaida; παρά pamoja na hali ya umilikishi huonyesha chanzo.
- source_word: τιμὴν καὶ δόξαν
  choice: heshima na utukufu
  rationale: Nomino zote mbili zinahifadhiwa zikiwa tofauti, kwa lugha ya kawaida na yenye hadhi.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: sauti ... ikaletwa kwake
  rationale: Huhifadhi hali ya kutendwa ya ἐνεχθείσης na uhusiano wake na αὐτῷ bila kufanya usemi kuwa mzito kupita kiasi.
- source_word: τοιᾶσδε
  choice: kama hii
  rationale: Huelekeza mbele kwenye maneno yatakayonukuliwa na ni usemi wa kawaida wa Kiswahili.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: kutoka kwa Utukufu Mkuu
  rationale: Ingawa ὑπό inaweza kuonyesha mtendaji, hapa ‘kutoka kwa’ huonyesha kwa kawaida chanzo cha sauti; herufi kubwa huonyesha kuwa ni namna ya heshima ya kumrejelea Mungu.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Huyu ndiye Mwanangu, Mpendwa wangu
  rationale: Muundo wa ufafanuzi wa Kigiriki na kurudiwa kwa μου unahifadhiwa badala ya kuunganisha kuwa tu ‘Mwanangu mpendwa.’
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: ambaye nimependezwa naye
  rationale: Hii ni Kiswahili asilia kinachoendeleza maana ya kuridhika au kufurahia; hali timilifu ‘nimependezwa’ huhifadhi kwa kiasi thamani ya aoristi bila kulazimisha tukio la zamani lililokwisha.
theological_decisions:
- issue: Usemi wa heshima τῆς μεγαλοπρεποῦς δόξης
  choice: Utukufu Mkuu
  alternative: utukufu wenye adhama; Fahari Kuu
  rationale: Huhifadhi usemi wa kumrejelea Mungu kwa heshima bila kuongeza ufafanuzi wa kiteolojia usio katika Kigiriki.
- issue: Muundo wa tamko la Baba kumhusu Mwana
  choice: Huyu ndiye Mwanangu, Mpendwa wangu
  alternative: Huyu ndiye Mwanangu mpendwa
  rationale: Chaguo kuu huhifadhi vipashio viwili vya Kigiriki vilivyowekwa sambamba na kurudiwa kwa ‘wangu,’ huku chaguo jingine likiwa Kiswahili cha kimapokeo lakini likisawazisha muundo huo.
- issue: Thamani ya wakati katika εὐδόκησα
  choice: nimependezwa naye
  alternative: ninapendezwa naye; nilipendezwa naye
  rationale: Timilifu ya Kiswahili huacha wazi uhusiano kati ya tendo la kupendezwa na hali inayoendelea, hivyo haibadili aoristi moja kwa moja kuwa sasa wala zamani iliyofungwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwanangu’ na ‘Mpendwa wangu’ hutumia herufi kubwa ndani ya tamko la Mungu kwa uwazi wa marejeo, bila kuongeza cheo kisichokuwapo katika chanzo. Alama ya mwisho ya mstari mrefu huhifadhi mwendelezo wa sentensi kuelekea aya inayofuata.
