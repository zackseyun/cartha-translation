  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: sw
  text: Lakini ninaona kuwa inafaa, maadamu ningali katika hema hili[a], kuwachochea kwa kuwakumbusha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makao haya” au “mwili huu”; Kigiriki ni “hema,” sitiari ya mwili wa Petro unaokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: inafaa
  rationale: Katika muundo huu pamoja na ἡγοῦμαι, neno hili linaonyesha jambo linalofaa au lililo sahihi kufanywa. “Inafaa” ni Kiswahili cha kawaida na huepuka kulifanya neno hili lisikike kana kwamba linahusu haki ya kisheria pekee.
- source_word: δὲ
  choice: Nami
  rationale: δέ hapa ni kiunganishi chepesi kinachoendeleza hoja kutoka mstari uliotangulia. “Nami” linaonyesha mwendelezo huo bila kuweka ukinzani mkali usio lazima.
- source_word: ἡγοῦμαι
  choice: ninaona
  rationale: Kitenzi hiki kinaeleza uamuzi au tathmini iliyofikiriwa. “Ninaona” ni usemi wa kawaida wa Kiswahili unaobeba maana ya kuamua au kuhesabu jambo kuwa la namna fulani.
- source_word: ἐφ’ ὅσον
  choice: maadamu
  rationale: 'Pamoja na εἰμί, kirai hiki kina maana ya muda: kwa kipindi chote ambacho hali hiyo inaendelea. “Maadamu” huwasilisha maana hiyo kwa ufupi na kwa kawaida.'
- source_word: σκηνώματι
  choice: hema
  rationale: Neno hili humaanisha makao ya muda yaliyo kama hema, na hapa limetumiwa kisitiari kuhusu maisha ya sasa ya Petro katika mwili. “Hema” huhifadhi taswira ya Kigiriki na uhusiano wake na mstari unaofuata.
- source_word: διεγείρειν
  choice: kuwachochea
  rationale: Kitenzi hiki kina maana ya kuwaamsha au kuwafanya wawe makini na watende. “Kuwachochea” huleta maana ya kuwasukuma kiakili na kiroho bila kudokeza kwamba walikuwa wamelala kihalisi.
- source_word: ἐν ὑπομνήσει
  choice: kwa kuwakumbusha
  rationale: Kirai hiki kinaonyesha njia ambayo Petro anawachochea wasomaji wake. “Kwa kuwakumbusha” ni cha asili katika Kiswahili na kinawasilisha wazi uhusiano wa njia.
theological_decisions:
- issue: Maana ya kisitiari ya “hema hili”
  choice: Kuhifadhi sitiari moja kwa moja kama “hema hili.”
  alternative: “mwili huu” au “makao haya”
  rationale: Kigiriki kinatumia taswira ya makao ya muda kwa maisha ya sasa katika mwili. Kuhifadhi “hema” kunatunza taswira ya mwandishi na maana ya muda mfupi inayoendelea katika mstari unaofuata, bila kuingiza ufafanuzi wa kitheolojia ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi sitiari kuu ya Kigiriki na mwendelezo wa sentensi.
