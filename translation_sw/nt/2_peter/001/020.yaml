translation:
  language: sw
  text: 'Mkijua hili kwanza: kwamba kila unabii wa Maandiko hautokani na tafsiri ya mtu mwenyewe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Mkijua hili kwanza
  rationale: Huhifadhi muundo wa kishiriki na msisitizo wa πρῶτον kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: πᾶσα προφητεία γραφῆς
  choice: kila unabii wa Maandiko
  rationale: Huwakilisha πᾶσα kwa ‘kila’ bila kuibadili kuwa ‘hakuna’; ‘Maandiko’ ni istilahi ya kawaida kwa γραφή katika muktadha huu.
- source_word: ἰδίας ἐπιλύσεως
  choice: tafsiri ya mtu mwenyewe
  rationale: ἰδίας ina wazo la kilicho cha mtu mwenyewe, na ἐπίλυσις hapa inaweza kumaanisha tafsiri au ufafanuzi; ‘tafsiri’ huhifadhi mkazo wa matini bila kubainisha mhusika zaidi ya ilivyo katika Kigiriki.
- source_word: οὐ γίνεται
  choice: hautokani na
  rationale: γίνεται pamoja na kiima ‘unabii’ na chanzo kilicho katika usemi wa genitivi huwasilishwa kwa Kiswahili asilia kama ‘hautokani na’; haibadilishwi kuwa dai kuhusu ruhusa ya msomaji kutafsiri.
theological_decisions:
- issue: Ikiwa mstari unazungumzia asili ya unabii au haki ya kuufasiri
  choice: ‘hautokani na tafsiri ya mtu mwenyewe’
  alternative: ‘hautafsiriwi na mtu apendavyo mwenyewe’
  rationale: Muundo οὐ γίνεται unaelekea kueleza jinsi unabii unavyotokea au chanzo chake, hasa kwa kuzingatia mstari unaofuata; tafsiri mbadala ingehamisha kauli moja kwa moja kwenye mamlaka au mbinu ya msomaji.
- issue: Upeo wa πᾶσα pamoja na ukanushi
  choice: ‘kila unabii ... hautokani’
  alternative: ‘hakuna unabii ... unaotokana’
  rationale: Chaguo hili huhifadhi kwa ukaribu mpangilio wa Kigiriki na marekebisho yaliyothibitishwa, huku maana ya jumla ya ukanushi ikibaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi utata halisi wa ‘tafsiri’ bila kuingiza msimamo wa dhehebu; ‘Mkijua’ inaunganisha mstari huu kiasili na muktadha wa sentensi.
