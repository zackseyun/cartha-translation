id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: sw
  text: Kwa maana ingekuwa afadhali kwao wasiwe wameijua njia ya haki[a] kuliko, baada ya kuijua, kurudi nyuma kutoka katika amri takatifu waliyopewa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia ya uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kugeuka na kuiacha amri takatifu waliyopewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: afadhali
  rationale: Katika muundo huu wa ulinganisho, ‘afadhali’ ni Kiswahili cha kawaida kinachoonyesha jambo ambalo lingekuwa bora zaidi.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: wameijua / kuijua
  rationale: Kurudia kitenzi kilekile kunahifadhi ulinganifu wa Kigiriki. ‘Kuijua’ ni ya asili na haiongezi wazo la ‘kuijua kikamilifu’ ambalo lingeweza kuzidisha maana.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: njia ya uadilifu
  rationale: ‘Njia’ inahifadhi sitiari ya mwenendo au mtindo wa maisha; ‘uadilifu’ hapa unaonyesha hali na mwenendo ulio sawa mbele za Mungu.
- source_word: ὑποστρέψαι ἐκ
  choice: kugeuka na kuiacha
  rationale: Muunganiko huu unaonyesha kugeuka nyuma na kujitenga na amri. Kiswahili ‘kugeuka na kuiacha’ huwasilisha dhana zote mbili kwa uwazi.
- source_word: παραδοθείσης
  choice: waliyokabidhiwa
  rationale: ‘Kukabidhiwa’ huonyesha kwamba amri ilitolewa na kufikishwa kwao bila kulazimisha wazo mahususi la mapokeo ya vizazi.
- source_word: ἁγίας ἐντολῆς
  choice: amri takatifu
  rationale: Inahifadhi umoja wa ἐντολή na uzito wa kidini na kimaadili wa ἁγίας.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: ἦν
  choice: ingekuwa
  rationale: Ingawa ni wakati usiotimilifu kwa umbo, muktadha wa ulinganisho usiotokea unahitaji ‘ingekuwa afadhali’ katika Kiswahili.
theological_decisions:
- issue: Iwapo tafsiri iamue mjadala wa kitheolojia kuhusu uasi dhidi ya imani au ungamo lisilokuwa la kweli
  choice: Kusema wazi kwamba waliijua njia hiyo na baadaye wakageuka na kuiacha amri, bila kuamua hali yao ya mwisho ya wokovu.
  alternative: Kutumia maneno makali zaidi yanayodokeza kupoteza wokovu, au maneno hafifu yanayodokeza walikuwa wameisikia tu bila kuijua kweli.
  rationale: Kigiriki kinaeleza ujuzi halisi kwa maneno yake na kugeuka baadaye, lakini hakitatui moja kwa moja mjadala mpana wa kimadhehebu kuhusu kudumu katika wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili kwa Kiswahili huku ulinganifu, marudio ya ‘kujua,’ na mvutano wa kitheolojia wa chanzo vikihifadhiwa.
