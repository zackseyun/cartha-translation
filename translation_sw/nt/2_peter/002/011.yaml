  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: sw
  text: Lakini malaika, ingawa wana nguvu na uwezo zaidi, hawatoi hukumu ya kukashifu[a] dhidi yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumu ya kutukana” au “hukumu ya kashfa.” Kivumishi cha Kigiriki kinaweza kumaanisha usemi wa kukashifu, kutukana, au kusingizia.
    reason: lexical_alternative
  - marker: b
    text: “Yao” huenda inawarejelea “wenye utukufu” wa mstari uliotangulia, lakini maandishi hayawatambui kwa uwazi zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: lakini
  rationale: Katika muktadha huu neno hilo linaunganisha sentensi kwa kuonyesha tofauti na tabia ya watu waliotajwa katika mstari uliotangulia; “lakini” ni ya kawaida na wazi kwa Kiswahili.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Muktadha unaonyesha viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: nguvu na uwezo
  rationale: Maneno haya yanahifadhi jozi ya maneno ya Kigiriki yanayokaribiana kimaana na kueleza mambo ambayo malaika ni wakuu zaidi ndani yake.
- source_word: μείζονες ὄντες
  choice: ingawa wana ... mkuu zaidi
  rationale: 'Kirai shirikishi kina maana ya kukubali jambo linalofanya tofauti ionekane: licha ya ukuu wao, malaika hawatoi hukumu hiyo.'
- source_word: οὐ φέρουσιν
  choice: hawaleti
  rationale: Kitenzi pamoja na κρίσιν kina maana ya kuleta au kutoa hukumu; “hawaleti” huhifadhi taswira ya chanzo huku kikieleweka kwa Kiswahili.
- source_word: κατ’ αὐτῶν
  choice: dhidi yao
  rationale: Kiwakilishi kimeachwa bila kumtaja mhusika kwa uwazi, kama ilivyo katika Kigiriki.
- source_word: βλάσφημον
  choice: ya kashfa
  rationale: Hapa kivumishi kinaweza kumaanisha usemi wa kutukana, kukashifu, au kuchongea; “ya kashfa” hueleza tabia ya hukumu bila kuifanya ihusu Mungu pekee.
- source_word: κρίσιν
  choice: hukumu
  rationale: Neno hili linataja tathmini au uamuzi wa kimahakama; “hukumu” ni pana na wazi.
theological_decisions:
- issue: Marejeo ya αὐτῶν (“yao”)
  choice: Kiwakilishi “yao” kimehifadhiwa bila kutaja wazi kinachorejelewa.
  alternative: Viumbe wa kiroho walioanguka, wenye utukufu, au watawala wa kibinadamu.
  rationale: Mstari huu haumtambui mhusika kwa uwazi zaidi ya muktadha wa mstari uliotangulia; kutaja kundi fulani kungeondoa utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umefanywa wa kawaida kwa wasomaji wa leo, huku tofauti ya hoja, jozi ya maneno “nguvu na uwezo,” na utata wa kiwakilishi vikihifadhiwa.
