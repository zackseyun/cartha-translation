  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: sw
  text: Kwa maana, wakitamka maneno ya kujigamba yaliyo matupu[a], huwashawishi kwa tamaa za mwili[b] na uasherati[d] wale ambao wanaponyoka kwa shida tu[c] kutoka kwa watu wanaoishi katika udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno makubwa yaliyo matupu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa tamaa za asili ya kimwili.” Neno la Kigiriki σάρξ, “mwili,” limetumiwa hapa kwa maana ya sitiari katika muktadha wa kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au, “wale ambao ndio tu wanaanza kuponyoka.” Baadhi ya hati za Kigiriki husoma “wale ambao kwa kweli wanaponyoka.”
    reason: alternative_reading
  - marker: d
    text: Au, “kwa tamaa za mwili, kwa matendo yasiyo na kiasi.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὑπέρογκα … ματαιότητος
  choice: maneno ya kujigamba yaliyo matupu
  rationale: Kirai hiki kinaonyesha maneno yaliyokuzwa kwa majivuno lakini yasiyo na kiini au faida. Neno “maneno” limeongezwa kwa kawaida ya Kiswahili kwa sababu kivumishi hicho ni yambwa la kitenzi “wakitamka.”
- source_word: φθεγγόμενοι
  choice: wakitamka
  rationale: Huhifadhi hali ya tendo linaloandamana na ushawishi wao na inasikika kwa heshima na kwa kawaida katika Kiswahili.
- source_word: δελεάζουσιν
  choice: huwashawishi
  rationale: Kitenzi kina wazo la kuvuta au kunasa kwa chambo; “huwashawishi” linaonyesha mvuto wa udanganyifu bila kulazimisha taswira ya moja kwa moja ya uvuvi.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: kwa tamaa za mwili
  rationale: “Kwa” linaonyesha njia wanayotumia kushawishi. “Mwili” linahifadhi sitiari ya σάρξ bila kuifasiri moja kwa moja kuwa “asili ya dhambi.”
- source_word: ἀσελγείαις
  choice: na mwenendo wa uasherati
  rationale: Neno la Kigiriki linaonyesha mwenendo wa kimwili usio na kiasi wala haya. Kirai hiki ni cha kawaida na kinabainisha muktadha wa kingono bila kupunguza neno hilo kuwa hisia tu.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: wanaoponyoka kwa shida tu
  rationale: Huwasilisha tendo linaloendelea na hali yake ya kuwa karibu kushindwa; haisemi kwamba tayari wamekamilisha kuponyoka.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: watu wanaoishi katika upotovu
  rationale: ἀναστρεφομένους linahusu mwenendo au namna ya maisha, na πλάνη linaweza kumaanisha kosa, udanganyifu, au upotovu. “Kuishi katika upotovu” huhifadhi maana pana ya kimaadili na kiroho.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa kimaadili
  choice: tamaa za mwili
  alternative: tamaa za asili ya dhambi
  rationale: “Mwili” huhifadhi sitiari ya Kigiriki na mvutano wake wa kitheolojia bila kuingiza dhana ya kimfumo ambayo haikutajwa wazi katika mstari.
- issue: Hali ya wale wanaoshawishiwa
  choice: wale ambao wanaponyoka kwa shida tu
  alternative: wale ambao tayari wameponyoka kabisa
  rationale: Kauli ya wakati wa sasa na kielezi ὀλίγως huonyesha hali ya kuponyoka inayoendelea na iliyo hatarini; tafsiri haipaswi kuamua kama kuponyoka kwao ni kamili au kuna maana maalumu ya wokovu.
- issue: Wale wanaoepukwa
  choice: kutoka kwa watu wanaoishi katika upotovu
  alternative: kuponyoka kutoka katika upotovu wenyewe
  rationale: Muundo wa sentensi unalitaja kundi la watu kama wale ambao wanaepukwa, huku ukibakiza “upotovu” kuwa hali ya maisha yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili kwa Kiswahili huku uhusiano wa kisababishi, njia ya ushawishi, na hali isiyokamilika ya kuponyoka vikihifadhiwa.
