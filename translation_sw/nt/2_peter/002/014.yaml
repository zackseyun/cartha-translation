id: 2PE.2.14
reference: 2 Peter 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: sw
  text: Wana macho yaliyojaa mwanamke mzinzi[a], nao hawaachi kutenda dhambi[b]; huwashawishi watu wasio imara; wana moyo uliozoezwa katika uchoyo; ni watoto wa laana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua zaidi, “yaliyojaa uzinzi” au “yaliyojaa tamaa ya uzinzi.” Kigiriki kinasema kihalisi “yaliyojaa mwanamke mzinzi,” usemi wenye taswira kali.
    reason: lexical_alternative
  - marker: b
    text: Au “wasio na kikomo katika dhambi” au “wasioacha kutenda dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: yaliyojaa mwanamke mzinzi
  rationale: Huhifadhi taswira halisi na kali ya Kigiriki, ‘yaliyojaa mwanamke mzinzi,’ badala ya kuifasiri moja kwa moja kuwa uzinzi au tamaa ya uzinzi. Tanbihi inaeleza maana hizo mbadala kwa kuwa usemi huu si wa kawaida katika Kiswahili.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: yasiyokoma kutenda dhambi
  rationale: Hufuata kwa karibu wazo la kutoweza au kutokoma kutenda dhambi na huhifadhi uhusiano wa kisarufi na ‘macho,’ bila kuingiza wazo la kutosheka ambalo halisemwi wazi katika Kigiriki.
- source_word: δελεάζοντες
  choice: huwashawishi
  rationale: Kitenzi hiki kina maana ya kuvutia au kunasa kwa chambo. ‘Huwashawishi’ ni cha kawaida na kinaonyesha ushawishi wenye kusudi baya katika muktadha huu.
- source_word: ψυχὰς ἀστηρίκτους
  choice: watu wasio imara
  rationale: ψυχαί hapa humaanisha watu wenyewe, si sehemu isiyo ya mwili pekee. ‘Watu wasio imara’ ni wazi na huonyesha hali yao ya kutokuwa wameimarishwa.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: moyo uliozoezwa katika tamaa ya mali
  rationale: γεγυμνασμένην huleta picha ya moyo uliofanyiwa mazoezi, nayo πλεονεξία hapa ni tamaa ya kujipatia zaidi, hasa mali. Usemi huu ni wa kawaida na una nguvu ya kimaadili.
- source_word: κατάρας τέκνα
  choice: watoto wa laana
  rationale: Huhifadhi muundo na taswira ya Kigiriki badala ya kuibadili tu kuwa kivumishi kama ‘waliolaaniwa.’ Ni usemi unaowatambulisha kuwa watu walio chini ya laana au wenye sifa inayostahili laana.
- source_word: ἔχοντες ... ἔχοντες
  choice: wana ... wana
  rationale: Kurudia ‘wana’ kunadumisha kwa kiasi fulani mlundikano wa shutuma katika sentensi ya Kigiriki huku Kiswahili kikibaki cha kawaida.
theological_decisions:
- issue: Iwapo taswira ya kingono katika μοιχαλίδος ilainishwe
  choice: Kuhifadhi taswira halisi ‘mwanamke mzinzi’ katika matini kuu
  alternative: Kutafsiri moja kwa moja kuwa ‘uzinzi’ au ‘tamaa ya uzinzi’
  rationale: Kigiriki kina nomino ya umoja inayomaanisha mwanamke mzinzi. Kuhifadhi taswira hiyo huepuka kufuta ukali na upekee wa usemi, huku tanbihi ikisaidia msomaji kuelewa maana yake ya kimuktadha.
- issue: Iwapo πλεονεξία itafsiriwe kama uchoyo, tamaa, au tamaa ya mali
  choice: tamaa ya mali
  alternative: uchoyo; tamaa ya kupata zaidi
  rationale: ‘Uchoyo’ unaweza kueleweka hasa kama kutotaka kutoa, ilhali neno la Kigiriki linasisitiza hamu ya kupata zaidi. ‘Tamaa ya mali’ ni wazi kwa wasomaji wa sasa bila kuingiza fundisho maalumu la kidhehebu.
- issue: Iwapo κατάρας τέκνα ielezwe moja kwa moja kuwa ‘waliolaaniwa’
  choice: watoto wa laana
  alternative: waliolaaniwa; watu walio chini ya laana
  rationale: Muundo wa picha umehifadhiwa ili kutoamua kimya kimya iwapo mkazo uko katika tabia yao, hali yao chini ya laana, au mwisho unaowangoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa shutuma umehifadhiwa kwa vipashio vinavyofuatana na nusu-koloni. ‘Watu’ limetumiwa badala ya ‘roho’ kwa ψυχαί ili maana ya watu wenyewe iwe wazi. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
