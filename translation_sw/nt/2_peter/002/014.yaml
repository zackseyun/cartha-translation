review_pass:
  verdict: revise
  source_fidelity: The draft rightly preserves the concrete singular image in μεστοὺς μοιχαλίδος and accurately conveys the luring of unestablished persons and the curse idiom. However, tamaa ya mali narrows πλεονεξία to desire for material wealth, whereas the Greek denotes greed/covetous acquisitiveness more broadly. The construction yasiyokoma kutenda dhambi also makes the eyes themselves the direct agents of committing sin in a way that is less natural in Swahili than the Greek idiom.
  naturalness: The register is generally clear Standard East African Swahili. Recasting the cessation-of-sin clause with the implied people as subject is more idiomatic while retaining the force of the Greek expression. Keeping the participial denunciation as linked clauses retains the rhetorical accumulation.
  terminology: 'Use uchoyo for πλεονεξία: it is a direct, contemporary term for greed and does not unnecessarily restrict the vice to money or property. Retain mwanamke mzinzi, watu wasio imara, and watoto wa laana, with the explanatory note for the deliberately vivid first expression.'
  issues:
  - severity: medium
    issue: “tamaa ya mali” is overly narrow for πλεονεξίας.
    rationale: πλεονεξία signifies greed or covetous acquisitiveness generally; it is not confined to desire for material possessions.
  - severity: low
    issue: “macho ... yasiyokoma kutenda dhambi” is awkwardly agentive in Swahili.
    rationale: Although the Greek vividly attributes unceasing sin to the eyes, Swahili reads more naturally if the implied false teachers are said not to cease sinning, while their eyes remain the vehicle of the preceding image.
