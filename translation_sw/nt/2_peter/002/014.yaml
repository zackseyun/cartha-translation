revisions:
- from: Wana macho yaliyojaa mwanamke mzinzi[a] na yasiyokoma kutenda dhambi[b]; huwashawishi watu wasio imara; wana moyo uliozoezwa katika tamaa ya mali. Wao ni watoto wa laana.
  to: Wana macho yaliyojaa mwanamke mzinzi[a], nao hawaachi kutenda dhambi[b]; huwashawishi watu wasio imara; wana moyo uliozoezwa katika uchoyo; ni watoto wa laana.
  rationale: The revision replaces the overly specific “tamaa ya mali” with “uchoyo,” preserving the broader sense of πλεονεξία. It also makes the unceasing-sin expression idiomatic in Swahili by supplying the people implied by the Greek participial description, without weakening its accusation. The concrete image, the rhetorical sequence, and both lexical-alternative footnote anchors are retained.
