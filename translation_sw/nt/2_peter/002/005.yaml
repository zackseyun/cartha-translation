  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: sw
  text: tena ikiwa hakuuacha ulimwengu wa kale bila kuuhukumu, bali alimhifadhi Noa, mmoja wa wale wanane,[a] mtangazaji wa haki,[b] alipoleta gharika juu ya ulimwengu wa watu wasiomcha Mungu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Noa, wa nane.” Usemi wa Kigiriki umebanwa na unaweza kumaanisha kwamba Noa alihifadhiwa pamoja na watu wengine saba.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtangazaji wa uadilifu”; neno la Kigiriki δικαιοσύνη linaweza kumaanisha haki au uadilifu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: ulimwengu wa kale
  rationale: Kirai hiki kinamaanisha ulimwengu wa zamani, hasa ule wa kabla ya gharika. ‘Ulimwengu wa kale’ ni Kiswahili cha sasa na chenye heshima.
- source_word: οὐκ ἐφείσατο
  choice: hakuuacha ... bila kuuhukumu
  rationale: Katika muktadha huu φείδομαι ina maana ya kutosamehe au kutokwepa kutoa hukumu. Muundo huu wa Kiswahili huonyesha nguvu ya kimahakama bila kudokeza kwamba ulimwengu uliangamizwa kabisa kwa kila hali.
- source_word: ὄγδοον Νῶε
  choice: Noa, mmoja wa wale wanane
  rationale: Usemi wa Kigiriki ni mfupi na wa kinahau; unaweza kueleweka kuwa Noa alikuwa wa nane au mmoja kati ya watu wanane waliohifadhiwa. Chaguo hili ni la kawaida na wazi katika Kiswahili, huku tanbihi ikihifadhi umbo mbadala la karibu zaidi na Kigiriki.
- source_word: δικαιοσύνης κήρυκα
  choice: mtangazaji wa haki
  rationale: κήρυξ ni mtangazaji wa hadharani. ‘Haki’ ni neno la kawaida la Kiswahili kwa δικαιοσύνη na hapa linaweza kujumuisha uadilifu wa kimaadili na utaratibu ulio sawa mbele za Mungu.
- source_word: ἐφύλαξεν
  choice: alimhifadhi
  rationale: φυλάσσω hapa humaanisha kumweka salama au kumhifadhi katikati ya hukumu; ‘alimhifadhi’ huonyesha matokeo hayo vizuri.
- source_word: κατακλυσμὸν
  choice: gharika
  rationale: κατακλυσμός ni mafuriko makubwa; ‘gharika’ ni neno la kawaida la kibiblia na la sasa kwa tukio la siku za Noa.
- source_word: κόσμῳ ἀσεβῶν
  choice: ulimwengu wa watu wasiomcha Mungu
  rationale: Genitivi inaeleza ulimwengu uliokuwa na watu wasiomcha Mungu au uliotawaliwa na hali hiyo. Tafsiri hii huhifadhi rejeo kwa watu badala ya kufanya ‘ulimwengu’ wenyewe kuwa mhusika wa kimaadili.
- source_word: ἐπάξας
  choice: alipoleta
  rationale: Kauli ya kushiriki ya aoristi inaonyesha tendo linalohusiana kwa karibu na tendo kuu; ‘alipoleta’ hutoa uhusiano wa wakati kwa Kiswahili cha asili.
theological_decisions:
- issue: Tafsiri ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ ndilo neno pana na la kawaida la Kiswahili linaloweza kubeba maana ya hali iliyo sawa mbele za Mungu na mwenendo mwadilifu. ‘Uadilifu’ unaweza kusisitiza zaidi tabia ya kimaadili, kwa hiyo umehifadhiwa kama ufafanuzi mbadala katika tanbihi.
- issue: Maana ya ὄγδοον Νῶε
  choice: Noa, mmoja wa wale wanane
  alternative: Noa, wa nane
  rationale: Kigiriki kina usemi uliobanwa ambao unaweza kumweka Noa kama wa nane au kuonyesha kwamba alihifadhiwa pamoja na wengine saba. Tafsiri kuu inaleta maana inayowezekana kwa uwazi, na tanbihi inahifadhi usemi wa kiordino.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Aya ni sehemu ya sentensi ya masharti inayoendelea kutoka muktadha, kwa hiyo imeanza na ‘tena ikiwa’ na kuishia kwa koma. Tanbihi zote zimewekewa alama katika matini kuu.
