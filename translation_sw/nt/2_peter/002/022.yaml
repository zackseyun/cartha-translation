base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: sw
  text: 'Yaliyosemwa katika methali ya kweli yamewatokea: “Mbwa hurudia matapishi yake mwenyewe,”[a] na, “Nguruwe jike aliyeoshwa hurudi kujiviringisha katika matope.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “Mbwa, baada ya kurudi kwenye matapishi yake mwenyewe; na nguruwe jike aliyeoshwa, kwenye kujiviringisha katika matope.” Kigiriki hutumia vipashio vya kishiriki, na kitenzi katika sehemu ya pili hakikutajwa wazi. Sehemu ya kwanza inaakisi Mithali 26:11.'
    reason: Huhifadhi muundo wa kishiriki wa Kigiriki na hufafanua kwa nini vitenzi vya “hurudia” na “hurudi” vimetolewa katika tafsiri ya kawaida.
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: yamewatokea
  rationale: Kauli hii ya Kiswahili inaonyesha kwamba yaliyotajwa katika methali yametimia katika hali yao, huku ikidumisha matokeo ya sasa ya wakati timilifu wa Kigiriki.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: yale yaliyosemwa na methali ya kweli
  rationale: Muundo wa Kigiriki umefupishwa na una utata fulani; tafsiri hii ya kawaida inaeleza kwamba maudhui ya methali ndiyo yaliyowatokea bila kuongeza ufafanuzi wa kiteolojia.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Mbwa hurudia matapishi yake mwenyewe
  rationale: Kauli ya kimethali yenye wakati wa mazoea ni ya asili katika Kiswahili na inadumisha maana ya kurudi pamoja na msisitizo wa ‘yake mwenyewe’; pia inaakisi Mithali 26:11.
- source_word: Ὗς λουσαμένη
  choice: Nguruwe jike aliyeoshwa
  rationale: ‘Nguruwe jike’ inadumisha jinsia ya nomino ya Kigiriki, na ‘aliyeoshwa’ haikatui bila sababu utata wa umbo la kati/tendwa kuwa lazima alijiosha mwenyewe.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: hurudi kujiviringisha matopeni
  rationale: ‘Kujiviringisha matopeni’ ni taswira ya kawaida na wazi kwa κυλισμός na βόρβορος; kitenzi ‘hurudi’ kimewekwa wazi kwa ukamilifu wa sentensi ya Kiswahili.
theological_decisions:
- issue: Nguvu ya nukuu ya kimethali iliyofupishwa
  choice: Maudhui ya methali yamewatokea watu hao.
  alternative: Neno la methali ya kweli limewatokea.
  rationale: Tafsiri iliyochaguliwa inadumisha onyo kuhusu kurudia hali ya zamani bila kuamua zaidi kuhusu hali yao ya kiroho au kuingiza fundisho lisilotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Matapishi’ na ‘matopeni’ ni maneno ya kawaida na yenye taswira wazi; ‘nguruwe jike’ ni sahihi zaidi kuliko ‘nguruwe’ pekee kwa Ὗς.
