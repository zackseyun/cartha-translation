base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: sw
  text: wakipokea malipo ya udhalimu[a]. Wao huhesabu kujifurahisha mchana kuwa raha. Ni madoa na dosari, wakijiachia katika udanganyifu wao[b] wakila karamu pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malipo kwa kutenda maovu.”
    reason: lexical_alternative
  - marker: b
    text: 'Baadhi ya hati zina “karamu zao za upendo” badala ya “udanganyifu wao”: “wakijiachia katika karamu zao za upendo wakila karamu pamoja nanyi.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: wakipokea malipo ya udhalimu
  rationale: Kirai hiki katika muktadha kinaeleza kupokea matokeo au adhabu ya matendo maovu. “Malipo ya udhalimu” huhifadhi taswira ya μισθός na uzito wa kimaadili wa ἀδικία bila kudai kwamba wengine wanawatendea isivyo haki.
- source_word: ἡδονὴν ἡγούμενοι
  choice: huona ... kuwa raha
  rationale: Muundo huu una maana ya kuhesabu au kuona jambo kuwa raha; tafsiri hii ni ya kawaida na iliyo karibu na Kigiriki.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: anasa za mchana
  rationale: τρυφή hueleza maisha ya anasa na kujifurahisha kupita kiasi, huku ἐν ἡμέρᾳ ikisisitiza kwamba yanafanywa mchana, jambo linalodokeza kutokuwa na aibu.
- source_word: σπίλοι καὶ μῶμοι
  choice: madoa na dosari
  rationale: Maneno haya mawili yanaonyesha uchafu na kasoro za kimaadili. “Madoa na dosari” huhifadhi taswira mbili na ni Kiswahili cha kawaida.
- source_word: ἐντρυφῶντες
  choice: hujifurahisha
  rationale: Kitenzi kinaendeleza wazo la kujiachia katika anasa. “Hujifurahisha” ni cha asili katika Kiswahili na kinafaa katika muundo huu.
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: katika udanganyifu wao
  rationale: Matini ya SBLGNT ina ἀπάταις, yaani udanganyifu au hila. Tafsiri hii inaendana na muktadha wa walimu wa uongo.
- source_word: συνευωχούμενοι ὑμῖν
  choice: wanapokula karamu pamoja nanyi
  rationale: Kitenzi humaanisha kushiriki karamu pamoja. Tafsiri hii huhifadhi mazingira ya mlo wa pamoja bila kuamua karamu hiyo ilikuwa ya aina gani.
theological_decisions:
- issue: Tofauti ya matini kati ya ἀπάταις na ἀγάπαις
  choice: 'ἀπάταις: “udanganyifu wao” katika matini kuu'
  alternative: 'ἀγάπαις: “karamu zenu za upendo”'
  rationale: SBLGNT iliyotolewa inasoma ἀπάταις, nayo inafaa katika muktadha wa walimu wadanganyifu. Usomaji ἀγάπαις una ushahidi wa hati na umuhimu wa kufasiri, kwa hiyo umehifadhiwa katika tanbihi.
- issue: Maana ya μισθὸν ἀδικίας
  choice: “malipo ya udhalimu”
  alternative: “malipo kwa kutenda maovu”
  rationale: Chaguo kuu huhifadhi muundo na taswira ya Kigiriki, huku tanbihi ikitoa maana iliyo wazi zaidi bila kufunga uhusiano wa nomino kwa namna moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa usomaji wa kawaida, huku taswira za malipo, madoa, dosari na karamu zikihifadhiwa. Viashiria [a] na [b] vimewekwa katika matini kuu na kuambatanishwa na tanbihi zake.
