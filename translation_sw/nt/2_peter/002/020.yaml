id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: sw
  text: Kwa maana ikiwa, baada ya kuziepuka najisi za ulimwengu kwa kumjua Bwana na Mwokozi Yesu Kristo[a], wananaswa tena na mambo hayo na wanashindwa, hali yao ya mwisho imekuwa mbaya kuliko ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Yesu Masihi.” Neno la Kigiriki Christos ni cheo chenye maana ya “Masihi,” yaani Mpakwa-Mafuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: baada ya kuziepuka
  rationale: Kauli hii ya wakati uliopita inaonyesha tendo lililotangulia kunaswa tena; muundo huu unaweka uhusiano huo wazi kwa Kiswahili cha kawaida.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: najisi za ulimwengu
  rationale: “Najisi” huhifadhi wazo la uchafu unaonajisi kimaadili, bila kulifanya kuwa uchafu wa kimwili tu.
- source_word: ἐν ἐπιγνώσει
  choice: kwa kumjua
  rationale: Hapa ἐν inaonyesha njia au namna ya kuepuka. “Kumjua” ni ya asili kwa Kiswahili na haibainishi kimadhehebu aina ya ujuzi unaokusudiwa.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: Bwana na Mwokozi
  rationale: Huhifadhi vyeo viwili vinavyomhusu Yesu na kuonyesha kuwa nomino zote mbili zina rejeleo moja.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: “Yesu Kristo” ndiyo namna ya kawaida, yenye hadhi, na inayoeleweka katika Kiswahili; tanbihi inaonyesha maana ya cheo cha Χριστός.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: wananaswa tena na mambo hayo
  rationale: Huhifadhi taswira ya kuingia tena katika mtego na kurejelea wazi najisi zilizotajwa.
- source_word: ἡττῶνται
  choice: kushindwa
  rationale: Kitenzi kina maana ya kutiishwa au kuzidiwa; “kushindwa” ni wazi na cha kawaida katika muktadha huu.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: hali yao ya mwisho imekuwa mbaya kuliko ya kwanza
  rationale: Hii ni tafsiri ya kawaida ya usemi unaolinganisha hali ya baadaye na hali ya awali, bila kuingiza maana maalumu ya kieskatolojia.
theological_decisions:
- issue: Aina ya kumjua Yesu na uhusiano wake na uasi
  choice: kwa kumjua
  alternative: kwa kuwa na ujuzi kamili wa; kwa kumfahamu kwa nje tu
  rationale: ἐπίγνωσις yenyewe haisuluhishi mjadala wa kama watu hawa walikuwa wameokoka kweli. Tafsiri haiongezi hitimisho la kimadhehebu.
- issue: Maana ya Χριστός
  choice: Yesu Kristo, huku tanbihi ikieleza “Masihi”
  alternative: Yesu Masihi
  rationale: Katika Kiswahili sanifu cha Biblia, “Kristo” ni ya asili na yenye hadhi, lakini maana ya cheo “Masihi” inapaswa kubaki wazi kwa tanbihi.
- issue: Rejeleo la κύριος καὶ σωτήρ
  choice: Bwana na Mwokozi Yesu Kristo
  alternative: Bwana wetu na Mwokozi Yesu Kristo
  rationale: Nakala ya Kigiriki haina kiwakilishi “wetu”; kwa hiyo hakijaongezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Najisi” huhifadhi uzito wa kimaadili wa μίασμα, na “hali yao ya mwisho” hufanya usemi wa Kigiriki ueleweke bila kuufafanua kupita kiasi.
