  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: sw
  text: Wakiwaahidi uhuru, wao wenyewe ni watumwa wa uharibifu; kwa maana mtu akishindwa na kitu, amefanywa pia mtumwa wa kitu hicho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: uhuru
  rationale: Neno hili ni la kawaida na la asili katika Kiswahili kwa maana ya hali ya kutokuwa chini ya utumwa au mamlaka inayofunga; pia linaendeleza tofauti kuu kati ya uhuru unaoahidiwa na utumwa halisi.
- source_word: ἐπαγγελλόμενοι
  choice: Wakiwaahidi
  rationale: Kitenzi hiki kinadumisha maana ya kutoa ahadi na, kwa muundo wa hali ya kuendelea, kinaonyesha kwamba tendo hilo linafanyika wakati wao wenyewe wakiwa watumwa.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Hapa hali ya kufungwa na kutawaliwa ndiyo kiini cha hoja. “Watumwa” lina nguvu inayohitajika na linapingana wazi na “uhuru.”
- source_word: φθορᾶς
  choice: uharibifu
  rationale: “Uharibifu” linahifadhi upana wa neno la Kigiriki, ambalo linaweza kuhusisha kuharibika kwa maadili na matokeo ya kuangamia, bila kulifanya limaanishe ufisadi wa kijamii pekee.
- source_word: ᾧ γάρ τις ἥττηται
  choice: kwa maana chochote kinachomshinda mtu
  rationale: Muundo huu wa Kiswahili unaeleza kanuni ya jumla kwa njia ya kawaida, huku “kinachomshinda” kikidumisha wazo la mtu kushindwa au kutawaliwa na kitu.
- source_word: τούτῳ καὶ δεδούλωται
  choice: humfanya pia kuwa mtumwa wake
  rationale: 'Usemi huu unaonyesha matokeo ya kudumu ya kushindwa: kitu kilichomshinda mtu kinamtawala kama bwana. “Pia” linawakilisha καί ya maandishi yaliyotolewa.'
theological_decisions:
- issue: Tofauti kati ya ahadi ya uhuru na hali halisi ya utumwa katika δοῦλοι/δεδούλωται
  choice: Kutumia “watumwa” na “humfanya ... kuwa mtumwa wake”
  alternative: Kutumia “watumishi” au “huwa chini ya mamlaka yake”
  rationale: 'Maneno yenye nguvu ya utumwa yanahifadhi kejeli na hoja ya mstari huu: wanaoahidi uhuru wenyewe wametawaliwa na uharibifu. Maneno mepesi yangefifisha uhusiano wa moja kwa moja kati ya kushindwa na kuwa mtumwa.'
- issue: Upeo wa maana ya φθορά
  choice: uharibifu
  alternative: ufisadi, uozo, au maangamizi
  rationale: Muktadha unaruhusu wazo la upotovu wa maadili pamoja na matokeo yake ya kuharibu. “Uharibifu” halifungi neno katika upande mmoja tu wa maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa kwa mtiririko wa kawaida wa Kiswahili, huku tofauti ya “uhuru” na “watumwa” na kanuni ya jumla katika nusu ya pili zikibaki wazi.
