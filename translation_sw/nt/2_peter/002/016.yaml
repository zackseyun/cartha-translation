  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: sw
  text: 'Lakini alipokea karipio kwa ajili ya uasi wake mwenyewe: mnyama wa kubeba mizigo asiyeweza kusema[a], akisema kwa sauti ya binadamu[b], aliuzuia wazimu wa nabii.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mnyama wa kubeba mizigo”; anayerejelewa ni punda wa Balaamu (Hesabu 22:28–30).
    reason: cross_reference
  - marker: b
    text: Au “kwa sauti ya mtu.” Kigiriki huenda kinamaanisha “kwa sauti ya binadamu,” kikimtofautisha mnyama huyo na mtu anayesema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: alikemewa
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba alipokea karipio, kwa lugha ya kawaida na yenye hadhi.
- source_word: ἰδίας παρανομίας
  choice: kwa ajili ya uasi wake mwenyewe
  rationale: “Uasi” huhifadhi uzito wa παρανομία kama mwenendo unaokiuka yaliyo halali, na “wake mwenyewe” hukazia uwajibikaji binafsi.
- source_word: ὑποζύγιον
  choice: mnyama wa kubeba mizigo
  rationale: Huhifadhi maana pana ya mnyama wa kubeba mzigo bila kumtaja moja kwa moja kuwa punda, ingawa muktadha wa Hesabu 22 humtambua hivyo.
- source_word: ἄφωνον
  choice: asiyeweza kusema
  rationale: Hueleza kutokuwa na uwezo wa kusema na kudumisha kinaya cha mnyama huyo kusema kwa sauti ya binadamu.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: kwa sauti ya binadamu
  rationale: Hutoa tofauti iliyokusudiwa kati ya sauti ya mnyama na usemi wa kibinadamu bila kuifanya ihusu jinsia ya kiume.
- source_word: φθεγξάμενον
  choice: akisema
  rationale: Ni tafsiri ya asili ya tamko lenye kueleweka katika muktadha huu.
- source_word: ἐκώλυσεν
  choice: aliuzuia
  rationale: Huwasilisha tendo la kuzuia au kusimamisha mwenendo huo bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: παραφρονίαν
  choice: wazimu
  rationale: Huhifadhi nguvu ya neno linalomaanisha hali au mwenendo usio na akili, badala ya kulidhoofisha kuwa upumbavu tu.
- source_word: τοῦ προφήτου
  choice: wa nabii
  rationale: Huhifadhi utambulisho wa Balaamu kama nabii katika muundo wa umilikaji wa Kiswahili bila kuhalalisha mwenendo wake.
theological_decisions:
- issue: Iwapo ὑποζύγιον itajwe moja kwa moja kuwa punda kwa kuzingatia simulizi la Balaamu
  choice: mnyama wa kubeba mizigo katika matini kuu
  alternative: punda
  rationale: Matini ya Kigiriki imetumia neno pana, si neno maalumu la punda; utambulisho mahsusi unawekwa katika tanbihi.
- issue: Maana ya ἀνθρώπου katika ἐν ἀνθρώπου φωνῇ
  choice: binadamu
  alternative: mwanamume
  rationale: Hapa tofauti ni kati ya sauti ya kibinadamu na mnyama asiyeweza kusema, si kati ya mwanamume na mwanamke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi uzito wa lawama, kinaya cha mnyama asiyeweza kusema kunena, na neno pana la Kigiriki kwa mnyama huyo.
