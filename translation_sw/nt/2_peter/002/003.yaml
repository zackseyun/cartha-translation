  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: sw
  text: Nao, kwa tamaa yao, watawanyonya kwa maneno ya kutungwa. Hukumu yao ya tangu zamani haijakaa bure[a], wala maangamizi yao hayasinzii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haikawii.” Kigiriki husema hasa kwamba hukumu si bure wala haiko bila kutenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: kwa tamaa yao
  rationale: Kirai hiki kinaonyesha msukumo wa walimu hao wa uongo. Katika muktadha huu, “tamaa” inaeleweka kuwa tamaa ya kupata faida na ni ya kawaida katika Kiswahili cha sasa.
- source_word: πλαστοῖς λόγοις
  choice: kwa maneno ya kutungwa
  rationale: πλαστός huonyesha jambo lililofinyangwa au kubuniwa; “maneno ya kutungwa” huhifadhi wazo la kauli zilizotengenezwa kwa hila, si uongo wa jumla tu.
- source_word: ἐμπορεύσονται
  choice: watawanyonya
  rationale: Kitenzi kina sitiari ya kibiashara ya kuwafanya watu chanzo cha faida. “Watawanyonya” huwasilisha unyonyaji huo kwa Kiswahili cha kawaida bila kuifanya sentensi kuu kuwa ngumu.
- source_word: κρίμα
  choice: hukumu
  rationale: “Hukumu” huhifadhi maana pana ya uamuzi wa kimahakama bila kufafanua kupita kiasi namna ya adhabu.
- source_word: ἔκπαλαι
  choice: iliyowekwa tangu zamani
  rationale: Hufikisha kwamba hukumu hii si mpya bali imekwisha kuwekwa tangu zamani; neno “iliyowekwa” husaidia kuunganisha kielezi hicho na hukumu kwa Kiswahili asilia.
- source_word: οὐκ ἀργεῖ
  choice: haikawii
  rationale: Ingawa ἀργέω inaweza kumaanisha kutokuwa na shughuli au kutotenda, katika muktadha wa hukumu inayokuja “haikawii” hutoa maana wazi kwamba hukumu haijalegea wala haitachelewa kutekelezwa. Tanbihi huhifadhi sitiari halisi zaidi.
- source_word: ἀπώλεια
  choice: maangamizi
  rationale: “Maangamizi” huonyesha uharibifu au uangamivu unaowangoja bila kuamua hapa kuhusu namna au muda wake wa mwisho.
- source_word: οὐ νυστάζει
  choice: hayasinzii
  rationale: “Hayasinzii” huhifadhi taswira hai ya νυστάζω, inayoyafanya maangamizi yaonekane kama yasiyolegea au kulala usingizi.
theological_decisions:
- issue: Asili ya adhabu inayotangazwa
  choice: Kutafsiri moja kwa moja kuwa hukumu na maangamizi yanayowajia walimu wa uongo, bila kuyafungamanisha na mfumo fulani wa mafundisho.
  alternative: Kufasiri “maangamizi” kuwa kufutwa kabisa kwa uhai, au kuwa uharibifu usiohusisha hukumu ya mwisho.
  rationale: Aya inathibitisha uhakika wa hukumu, lakini haielezi hapa namna yake wala muda wake. Tafsiri inadumisha onyo na mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watawanyonya” ni neno linaloeleweka kwa urahisi na huhifadhi maana ya sitiari ya kibiashara; mpangilio wa sentensi unadumisha usambamba wa hukumu na maangamizi.
