base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: sw
  text: Hawa ni chemchemi zisizo na maji na ukungu[a] unaopeperushwa na dhoruba. Kwa ajili yao, giza jeusi limehifadhiwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawingu yanayopeperushwa na dhoruba.” Neno la Kigiriki humaanisha kwa usahihi zaidi “ukungu,” ingawa tafsiri nyingine hulitafsiri kwa maana pana zaidi kuwa “mawingu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “weusi wa giza umetengewa kwa ajili yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: chemchemi zisizo na maji
  rationale: πηγή ni chemchemi au chanzo cha maji, si kisima kilichochimbwa; usemi huu unadumisha taswira ya kitu kinachotarajiwa kutoa maji lakini hakina maji.
- source_word: ὁμίχλαι
  choice: ukungu
  rationale: ὁμίχλη humaanisha ukungu; Kiswahili kwa kawaida hutumia nomino hii kama nomino ya jumla, hata pale ambapo Kigiriki kina wingi.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: una opeperushwa na dhoruba
  rationale: λαῖλαψ ni dhoruba kali ya upepo, na ἐλαύνω hapa ni kusukuma au kuendesha; ‘kupeperushwa na dhoruba’ ni ya asili na inadumisha hali ya kutendwa.
- source_word: οἷς
  choice: kwa ajili yao
  rationale: Kiwakilishi hiki kinawarejelea walimu wa uongo, si chemchemi au ukungu kama vitu; ‘yao’ huonyesha wazi kuwa hukumu hiyo ni kwa watu hao.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: giza jeusi
  rationale: Usemi huu unakusanya ζόφος, yaani weusi au utusitusi mzito, na σκότος, yaani giza. ‘Giza jeusi’ inadumisha msisitizo wa taswira hizo mbili bila kuufafanua kupita maandishi.
- source_word: τετήρηται
  choice: limehifadhiwa
  rationale: Kauli timilifu ya kutendwa huonyesha kuwa jambo hilo limewekwa au limetengewa na bado lipo hivyo; ‘limehifadhiwa’ inadumisha maana hiyo bila kumtaja mtendaji.
theological_decisions:
- issue: Kauli ya mwisho kama lugha ya hukumu
  choice: Kutumia kauli ya kutendwa bila kumtaja anayehifadhi giza hilo.
  alternative: Kuongeza wazi ‘na Mungu’.
  rationale: Kigiriki kinadokeza hukumu ya Mungu lakini hakimtaji mtendaji; tafsiri haipaswi kuongeza jina ambalo halipo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ukungu’ umetumiwa kwa umoja kama nomino ya jumla kwa ufasaha wa Kiswahili. Sentensi imegawanywa mara mbili ili kuepuka kishazi rejeshi kisicho cha asili huku uhusiano wa hukumu na watu hao ukibaki wazi.
