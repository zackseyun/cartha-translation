lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni kielezi cha kawaida cha idadi, na “wengi” ni tafsiri ya asili na yenye uzito unaofaa katika Kiswahili.
- source_word: ἐξακολουθήσουσιν
  choice: watafuata
  rationale: Kitenzi hiki cha wakati ujao humaanisha kuwafuata wengine au kwenda katika njia yao; “watafuata” huhifadhi nguvu ya utabiri bila maelezo ya ziada.
- source_word: αὐτῶν
  choice: wao
  rationale: Kiwakilishi hiki kinawarejelea walimu wa uongo katika muktadha na kwa kawaida kinaunganishwa na mwenendo unaotajwa.
- source_word: ταῖς ἀσελγείαις
  choice: mwenendo wao wa uasherati usio na aibu
  rationale: ἀσέλγεια hueleza tabia isiyo na aibu wala kujizuia, mara nyingi ikiwa na maana ya kingono. Kauli hii ya Kiswahili ni wazi kwa wasomaji wa sasa na bado inadokeza upana wa tabia hiyo; wingi wa Kigiriki unaeleweka kwa jina la jumla “mwenendo.”
- source_word: δι’ οὓς
  choice: kwa sababu yao
  rationale: 'διά pamoja na hali ya accusative hapa huonyesha sababu: hao watu watasababisha njia ya kweli itukanwe.'
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: njia ya kweli
  rationale: Huhifadhi sitiari ya “njia” na uhusiano wake na kweli kwa Kiswahili cha kawaida. Kauli hii ya Kikristo ya awali yaelekea kutaja imani na mwenendo unaolingana na kweli.
- source_word: βλασφημηθήσεται
  choice: itatukanwa
  rationale: Kitenzi hiki cha wakati ujao, katika kauli tendwa, humaanisha kunenewa vibaya, kushutumiwa, au kutukanwa. “Itatukanwa” ni nzito na ya asili bila kudokeza kwamba ni Mungu peke yake anayetukanwa.
theological_decisions:
- issue: Maana ya “njia ya kweli”
  choice: Imetafsiriwa kama usemi wa Kikristo wa awali unaoelekeza kwenye imani na mwenendo wa kweli, huku sitiari ya njia ikihifadhiwa.
  alternative: “njia ya ukweli” au “njia iliyo ya kweli”
  rationale: “Njia ya kweli” ni ya asili katika Kiswahili na haiifungi kauli hiyo kwenye fundisho moja maalumu; inahifadhi uwezekano wa kurejelea ujumbe na namna ya maisha.
- issue: Upeo wa kimaadili wa ἀσέλγεια
  choice: “mwenendo wao wa uasherati usio na aibu”
  alternative: “matendo yao ya ufisadi,” “upotovu wao,” au “matendo yao machafu yasiyo na aibu”
  rationale: Neno la Kigiriki linaweza kuhusisha ukosefu mpana wa kiasi na aibu, mara nyingi likiwa na vidokezo vya kingono. Tafsiri iliyochaguliwa inaonyesha nguvu hiyo, huku tanbihi ikihifadhi upeo mpana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa Kigiriki umehifadhiwa inapowezekana, lakini sentensi imefanywa ya asili katika Kiswahili. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu karibu na maneno yanayohusika.
