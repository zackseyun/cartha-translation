  text: Na wengi watafuata ufisadi wao[a], na kwa sababu yao njia ya kweli[b] itatukanwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo yao machafu yasiyo na aibu,” “maisha yao yasiyo na kiasi,” au “uasherati wao.” Neno la Kigiriki linamaanisha mwenendo wa ufisadi usio na aibu wala kujizuia, mara nyingi ukiwa na vidokezo vya kingono.
