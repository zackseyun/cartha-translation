id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: sw
  text: Wameiacha njia iliyonyooka, wakapotea kwa kuifuata njia ya Balaamu mwana wa Bosori,[a] ambaye alipenda ujira wa udhalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosori ndilo umbo la jina lililo katika matini ya Kigiriki; katika Agano la Kale Balaamu kwa kawaida huitwa mwana wa Beori.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: Wameiacha
  rationale: Kitenzi hiki huonyesha tendo lililotangulia tendo kuu; “wameiacha” ni Kiswahili cha kawaida kinachoonyesha kuondoka kwa makusudi bila kuongeza wazo lisilo katika Kigiriki.
- source_word: εὐθεῖαν ὁδὸν
  choice: njia iliyonyooka
  rationale: Huhifadhi picha halisi ya njia na sitiari ya kimaadili ya maandiko, badala ya kuifafanua tu kuwa “njia iliyo sawa.”
- source_word: ἐπλανήθησαν
  choice: wakapotea
  rationale: Huwasilisha maana ya kwenda kombo au kupotea kimaadili bila kudokeza wazi kwamba wakala fulani wa nje ndiye aliyewapotosha.
- source_word: ἐξακολουθήσαντες
  choice: kwa kuifuata
  rationale: Katika muktadha huu kishirikishi kinaweza kueleza njia au sababu ya kupotea kwao; muundo huu ni wa asili katika Kiswahili na huhifadhi uhusiano huo.
- source_word: τῇ ὁδῷ
  choice: njia
  rationale: Hudumisha marudio ya sitiari ya ὁδός iliyotumiwa mapema katika mstari.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: Balaamu mwana wa Bosori
  rationale: Majina yametoholewa kwa namna inayosomeka katika Kiswahili, na muundo wa jenitivi wa pili umeelezwa kwa kawaida kama ukoo.
- source_word: μισθὸν ἀδικίας
  choice: ujira wa udhalimu
  rationale: “Ujira” huhifadhi wazo la malipo, huku “udhalimu” ukibeba uzito wa kimaadili wa ἀδικία bila kufanya malipo hayo yasikike kuwa mema.
- source_word: ἠγάπησεν
  choice: alipenda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya aoristi ya ἀγαπάω.
theological_decisions:
- issue: Sitiari ya kimaadili katika εὐθεῖαν ὁδὸν / τῇ ὁδῷ
  choice: Kudumisha lugha ya “njia” katika sehemu zote mbili.
  alternative: njia iliyo sahihi / mwenendo wa kweli
  rationale: Kigiriki kinarudia ὁδός na kutumia picha ya njia; kuitunza huepuka kuingiza ufafanuzi wa kitheolojia ulio finyu zaidi.
- issue: Utambulisho wa Βοσόρ
  choice: Bosori katika matini kuu, Beori katika tanbihi.
  alternative: Beori katika matini kuu
  rationale: SBLGNT ina Βοσόρ, kwa hiyo matini kuu hufuata ushahidi wa Kigiriki; tanbihi humsaidia msomaji kuunganisha jina hilo na umbo linalopatikana kwa kawaida katika Agano la Kale.
- issue: Uhusiano wa ἐξακολουθήσαντες na ἐπλανήθησαν
  choice: “wakapotea kwa kuifuata”
  alternative: “wakapotea, wakiifuata”
  rationale: Kishirikishi kinaweza kuwa cha tendo linaloandamana au kueleza jinsi walivyopotea. “Kwa kuifuata” ni ya asili na inaonyesha uhusiano unaowezekana bila kuongeza wakala wa nje.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kibiblia lakini kinachoeleweka kwa urahisi. Sitiari ya “njia” na marudio yake yamehifadhiwa; majina yametoholewa kwa tahajia inayofaa Kiswahili.
