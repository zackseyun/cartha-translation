  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: sw
  text: akamwokoa Loti mwenye haki, ambaye alikuwa akiteswa[a] kwa sababu ya mwenendo wa watu wasio na sheria, uliojaa tamaa zisizo na haya[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa akidhulumiwa” au “aliyekuwa akisumbuliwa sana.”
    reason: lexical_alternative
  - marker: b
    text: “Tamaa zisizo na haya” pia zinaweza kutafsiriwa “ufisadi wa tamaa,” “mwenendo wa uasherati usio na haya,” au “upotovu wa kimaadili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: mwenye haki
  rationale: Huhifadhi tathmini ya wazi ya Kigiriki kuhusu hali ya kimaadili ya Loti kwa Kiswahili cha kawaida na cha kibiblia.
- source_word: Λὼτ
  choice: Loti
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: καταπονούμενον
  choice: aliyekuwa akiteseka
  rationale: Huonyesha tendo endelevu la kuumizwa sana au kusumbuliwa, bila kulazimisha maana kuwa mateso ya kimwili pekee.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: kwa sababu ya mwenendo
  rationale: Huonyesha mwenendo kuwa chanzo cha mateso ya Loti; ‘mwenendo’ ni tafsiri ya asili na pana ya ἀναστροφή.
- source_word: τῶν ἀθέσμων
  choice: wa watu wasioheshimu sheria
  rationale: Huonyesha watu wanaopuuza sheria au yaliyo halali, kwa lugha inayoeleweka kuliko nomino ya kimuktadha ‘waasi wa sheria’.
- source_word: ἐν ἀσελγείᾳ
  choice: wa ufisadi
  rationale: ‘Ufisadi’ hapa huonyesha mwenendo wa aibu na kupita kiasi kimaadili; tanbihi huhifadhi uwezekano wa maana mahsusi ya uasherati au upotovu wa tamaa.
- source_word: ἐρρύσατο
  choice: akamwokoa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumtoa mtu katika hatari.
- source_word: καὶ
  choice: aka-
  rationale: Kwa kuwa mstari unaendeleza sentensi ya awali, kiunganishi kimeunganishwa kiasili katika kitenzi cha Kiswahili.
theological_decisions:
- issue: Maelezo ya kimaadili kuhusu Loti yakilinganishwa na simulizi la Mwanzo
  choice: Kudumisha wazi ‘Loti mwenye haki’
  alternative: Kulainisha au kuondoa tathmini hiyo kwa sababu ya matendo ya Loti katika Mwanzo
  rationale: Kigiriki kinamwita Loti δίκαιος waziwazi; tafsiri inapaswa kuhifadhi tathmini ya andiko bila kuitatua kwa kuoanisha na maswali yanayotokana na Mwanzo.
- issue: Upeo wa ἀσέλγεια
  choice: ‘ufisadi’ katika maandishi, huku tanbihi ikieleza maana ya ufisadi wa tamaa na mwenendo usio na haya
  alternative: ‘uasherati’ au ‘ufisadi wa kingono’ pekee
  rationale: Neno linaweza kuhusisha tamaa mbaya na ufisadi wa kingono, lakini pia hubeba wazo pana la mwenendo wa kupita kiasi usio na haya; tafsiri kuu haipaswi kulifinyaza bila ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa ukiendelea kwa alama ya em dash kwa sababu ni sehemu ya sentensi inayoanzia mstari uliotangulia.
