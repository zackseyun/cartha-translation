source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: sw
  text: Kwa maana, ikiwa Mungu hakuwasamehe malaika walipotenda dhambi, bali aliwatupa katika Tartaro[a], akawatia katika minyororo ya giza zito[b] ili wahifadhiwe kwa ajili ya hukumu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “aliwatupa kuzimu.” Kitenzi cha Kigiriki kinamaanisha hasa kuwatia katika Tartaro; kwa hiyo, maandishi makuu yanahifadhi istilahi hiyo iliyo mahususi zaidi.'
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale zina “mashimo ya giza zito” badala ya “minyororo ya giza zito.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: hakuwasamehe
  rationale: Katika muktadha wa adhabu, kitenzi hiki kinaonyesha kwamba Mungu hakujizuia kuwaadhibu. ‘Hakuwasamehe’ ni usemi wa kawaida wa Kiswahili unaodumisha wazo la kutowaepusha na adhabu.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: malaika walipotenda dhambi
  rationale: Kishazi cha wakati kinaonyesha tendo lililotokea bila kufanya Kiswahili kuwa kizito; pia kinadumisha nguvu ya kishirikishi cha wakati uliopita.
- source_word: ταρταρώσας
  choice: aliwatupa katika Tartaro
  rationale: Kitenzi cha Kigiriki kinamaanisha hasa kuwatia Tartaro. Jina ‘Tartaro’ linahifadhi taswira mahususi ya chanzo badala ya kuipanua kuwa dhana ya jumla ya kuzimu.
- source_word: παρέδωκεν
  choice: kuwakabidhi
  rationale: Katika muktadha wa hukumu, neno hili lina maana ya kuwatia chini ya ulinzi au kifungo; ‘kuwakabidhi’ linafaa pamoja na minyororo na hukumu inayokuja.
- source_word: σειραῖς ζόφου
  choice: katika minyororo ya giza zito
  rationale: ‘Minyororo’ linawakilisha σειραῖς, na ‘giza zito’ linadumisha hali nzito, ya kutisha na yenye huzuni ya ζόφος bila kuifanya kuwa giza la kawaida tu.
- source_word: εἰς κρίσιν
  choice: kwa ajili ya hukumu
  rationale: κρίσις hapa ni hukumu inayowangojea, si lazima uamuzi wa hatia pekee.
- source_word: τηρουμένους
  choice: ili wahifadhiwe
  rationale: Kauli tendwa inadumishwa, na muundo huu unaonyesha kusudi au matokeo ya kukabidhiwa kwao chini ya ulinzi hadi hukumu.
theological_decisions:
- issue: Jinsi ya kutafsiri ταρταρώσας bila kuingiza ufafanuzi wa baadaye wa kimafundisho
  choice: aliwatupa katika Tartaro
  alternative: aliwatupa kuzimu
  rationale: Neno la Kigiriki linarejelea mahususi kutiwa Tartaro. Kulihifadhi kama ‘Tartaro’ kunadumisha taswira ya kifungu na kuepuka kulisawazisha moja kwa moja na istilahi nyingine za mahali pa adhabu.
- issue: Uhusiano wa Tartaro, minyororo ya giza zito, na kuhifadhiwa kwa ajili ya hukumu
  choice: aliwatupa katika Tartaro na kuwakabidhi katika minyororo ya giza zito, ili wahifadhiwe kwa ajili ya hukumu
  alternative: aliwatupa katika Tartaro wakiwa wamefungwa kwa minyororo ya giza zito hadi hukumu
  rationale: Muundo uliochaguliwa unahifadhi vipengele vyote vya Kigiriki bila kuamua kimya kimya kama minyororo hiyo ni chombo, mahali, au taswira ya kifungo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumishwa kama kishazi cha masharti kinachoendelea katika mstari unaofuata. ‘Tartaro’ limeandikwa kama jina maalumu lisilo la kawaida na limefafanuliwa katika tanbihi.
