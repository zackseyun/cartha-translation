lexical_decisions:
- source_word: μάλιστα
  choice: hasa
  rationale: Huonyesha msisitizo maalumu ndani ya hukumu inayotajwa katika mstari uliotangulia.
- source_word: ὀπίσω σαρκὸς
  choice: wanaoufuata mwili
  rationale: Huhifadhi picha ya Kigiriki ya kuufuata mwili bila kuifasiri moja kwa moja kuwa ‘asili ya dhambi.’
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: kwa tamaa inayotia unajisi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha tamaa haramu na matokeo yake ya kunajisi, bila kupunguza uzito wa maadili wa maneno hayo.
- source_word: κυριότητος
  choice: utawala
  rationale: Neno hili linaweza kumaanisha mamlaka, ubwana, au utawala. ‘Utawala’ ni wazi huku likiacha mhusika au aina yake bila kubainishwa kupita kiasi.
- source_word: καταφρονοῦντας
  choice: kuudharau
  rationale: Huonyesha dharau ya makusudi na yenye nguvu.
- source_word: Τολμηταί
  choice: Wenye kuthubutu
  rationale: Huhifadhi wazo la ujasiri wa kupita kiasi katika muktadha wa lawama.
- source_word: αὐθάδεις
  choice: wakaidi
  rationale: Huonyesha watu wanaoshikilia mapenzi yao wenyewe na wasiotaka kuongozwa; ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: δόξας
  choice: wenye utukufu
  rationale: Huelekea kumaanisha viumbe wenye utukufu, lakini haitaji wazi kuwa ni malaika; tafsiri hii huhifadhi utata huo.
- source_word: οὐ τρέμουσιν
  choice: hawatetemeki
  rationale: Huhifadhi picha halisi ya kutetemeka kwa hofu au kicho.
- source_word: βλασφημοῦντες
  choice: wanapowatukana
  rationale: Katika muktadha wa maneno mabaya dhidi ya viumbe wenye utukufu, ‘kutukana’ ni ya kawaida kuliko ‘kukufuru’ na haifanyi tendo hilo lionekane lazima limeelekezwa kwa Mungu.
theological_decisions:
- issue: Mhusika anayerejelewa na κυριότητος
  choice: utawala kwa maana pana
  alternative: ubwana wa Bwana au mamlaka ya viumbe wa mbinguni
  rationale: Mstari haubainishi wazi ni utawala wa nani. Tafsiri kuu haitaji Kristo wala malaika moja kwa moja, hivyo huhifadhi mvutano wa kitheolojia.
- issue: Mhusika anayerejelewa na δόξας
  choice: wenye utukufu, bila kuwabainisha
  alternative: malaika au viumbe wa mbinguni wenye utukufu
  rationale: Mstari unaofuata unataja malaika, jambo linalounga mkono rejeo la viumbe wa mbinguni, lakini δόξας lenyewe halisemi ‘malaika.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi fupi ‘Wenye kuthubutu na wakaidi’ huhifadhi kasi na ukali wa lawama katika Kigiriki. Koma ya mwisho imehifadhiwa kwa sababu mstari unaendelea moja kwa moja katika 2 Petro 2:11.
