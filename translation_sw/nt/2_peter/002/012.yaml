    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: wanyama wasio na akili
  rationale: Kirai hiki kinamaanisha wanyama wasiokuwa na uwezo wa kufikiri kwa akili; tafsiri hii ni ya kawaida na inaendeleza tofauti ya kimaadili iliyomo katika muktadha.
- source_word: γεγεννημένα φυσικὰ
  choice: ambao kwa kuzaliwa kwao huongozwa na silika
  rationale: Kigiriki kimebana wazo la kuzaliwa na la kuongozwa na maumbile. Kiswahili hiki kinahifadhi picha ya kuzaliwa huku kikieleza kwa kawaida maana ya φυσικά.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: ili wakamatwe na kuangamizwa
  rationale: εἰς hapa huonyesha kusudi au matokeo; vitenzi vya kutendwa vinaeleza kwa uwazi kukamatwa na kuharibiwa kwa wanyama hao.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: mambo wasiyoyaelewa
  rationale: Kiwakilishi cha Kigiriki ni cha wingi na kisicho na jinsia, hivyo kinaelekea kutaja mambo au masuala, bila kubainisha kitu zaidi ya maandishi.
- source_word: βλασφημοῦντες
  choice: wanakufuru
  rationale: Kitenzi hiki kinaweza kumaanisha kusema vibaya au kutukana, lakini “kukufuru” kinadumisha uzito wa neno na hakibainishi kimya kimya kile kinacholengwa.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: nao pia wataangamizwa katika maangamizi yao
  rationale: Maneno yanayotokana na mzizi mmoja yamewakilishwa kwa “wataangamizwa/maangamizi,” ili kudumisha marudio na mchezo wa maneno wa Kigiriki.
theological_decisions:
- issue: Maana ya βλασφημοῦντες katika muktadha
  choice: wanakufuru
  alternative: wanasema vibaya; wanatukana
  rationale: Uchaguzi huu haudhoofishi uzito wa shutuma, lakini pia haubainishi kuwa walengwa ni Mungu, viumbe wa mbinguni, au mambo matakatifu wakati mstari wenyewe hauyasemi wazi.
- issue: Maana ya φθορά / φθαρήσονται
  choice: maangamizi / wataangamizwa
  alternative: uharibifu / wataharibika; maanguko / wataangamia
  rationale: Taswira ya viumbe wanaokamatwa na kuangamizwa inaelekeza kwenye hukumu na maangamizi. Kutumia maneno yenye mzizi mmoja kunahifadhi uhusiano wa maneno bila kuongeza dai maalumu la kimafundisho.
- issue: Uhusiano wa εἰς ἅλωσιν καὶ φθοράν na wanyama
  choice: ili wakamatwe na kuangamizwa
  alternative: kwa ajili ya kukamatwa na kuangamizwa
  rationale: “Ili” huacha wazi kiwango ambacho kirai kinaonyesha kusudi au matokeo, na hakiongezi maelezo kuhusu aliyekusudia mwisho huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umegawanywa mara mbili ili kupunguza uzito wa kishazi kirefu cha Kigiriki. “Silika” ni neno la sasa na linaloeleweka, huku tanbihi ikihifadhi usemi halisi zaidi wa chanzo.
