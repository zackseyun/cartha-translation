id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: sw
  text: Lakini manabii wa uongo walitokea pia miongoni mwa watu, kama vile walimu wa uongo watakavyokuwapo pia miongoni mwenu. Wataingiza kwa siri mafundisho potovu yanayoleta maangamizi[a], huku wakimkana Bwana aliyewanunua[b], na kujiletea wenyewe maangamizi ya haraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi yenye kuleta maangamizi.” Neno la Kigiriki linaweza kumaanisha makundi au madhehebu, lakini hapa huenda linarejelea mafundisho au mikondo inayoongoza kwenye maangamizi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Bwana aliyewakomboa.” Kigiriki kinasema kihalisi “Bwana aliyewanunua,” na hivyo huhifadhi sitiari ya ununuzi bila kutatua mijadala mipana ya kiteolojia kuhusu upeo wake.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: walitokea
  rationale: Kitenzi hiki kinaonyesha kujitokeza kwa manabii wa uongo katika historia; “walitokea” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: ψευδοπροφῆται
  choice: manabii wa uongo
  rationale: Ni tafsiri ya moja kwa moja, iliyo wazi na inayotumika kwa kawaida.
- source_word: ἐν τῷ λαῷ
  choice: miongoni mwa watu
  rationale: Huhifadhi usemi wa Kigiriki bila kutaja Israeli moja kwa moja, ingawa muktadha unaelekea kwa watu wa agano katika historia.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: kama vile walimu wa uongo watakavyokuwapo pia miongoni mwenu
  rationale: Huhifadhi ulinganisho kati ya manabii wa uongo wa zamani na walimu wa uongo watakaotokea ndani ya jumuiya ya wasomaji.
- source_word: ψευδοδιδάσκαλοι
  choice: walimu wa uongo
  rationale: Ni tafsiri ya moja kwa moja na hudumisha ulinganifu na “manabii wa uongo.”
- source_word: παρεισάξουσιν
  choice: wataingiza kwa siri
  rationale: Huhifadhi wazo la kuingiza jambo kwa hila au kisiri, bila kutumia lugha ya mitaani.
- source_word: αἱρέσεις ἀπωλείας
  choice: mafundisho potovu yanayoleta maangamizi
  rationale: Katika muktadha huu neno linahusu mafundisho au mikondo yenye kupotosha inayofungamana na kumkana Bwana Mkuu; kirai hiki pia huonyesha matokeo yake ya maangamizi.
- source_word: τὸν ... δεσπότην
  choice: Bwana Mkuu
  rationale: “Bwana Mkuu” huonyesha mamlaka ya δεσπότης na kwa kiasi fulani huitofautisha na κύριος, huku ikibaki lugha ya kawaida na yenye heshima.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: aliyewanunua
  rationale: Huhifadhi sitiari ya kununua iliyo katika ἀγοράζω, badala ya kuibadili moja kwa moja kuwa istilahi pana zaidi ya kiteolojia kama “aliyewakomboa.”
- source_word: ἀρνούμενοι
  choice: wakimkana
  rationale: Hutoa maana ya kukataa au kutomtambua Bwana Mkuu na huhifadhi uzito wa kitendo hicho.
- source_word: ἐπάγοντες ἑαυτοῖς
  choice: huku wakijiletea wenyewe
  rationale: 'Huhifadhi nguvu ya kujirejelea: matendo yao yanawaletea wao wenyewe matokeo hayo.'
- source_word: ταχινὴν ἀπώλειαν
  choice: maangamizi ya haraka
  rationale: Ni tafsiri wazi ya sifa ya kasi au upesi wa maangamizi yanayokuja.
theological_decisions:
- issue: Maana ya αἱρέσεις katika muktadha huu
  choice: mafundisho potovu
  alternative: makundi yenye kuleta maangamizi; madhehebu yenye kuleta maangamizi
  rationale: Neno linaweza kumaanisha kundi au dhehebu, lakini hapa kuingizwa kwa siri na kumkana Bwana Mkuu kunakazia mafundisho au mikondo yenye kupotosha. Tanbihi huhifadhi uwezekano wa maana ya kimakundi.
- issue: Nguvu na rejeleo la τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: Bwana Mkuu aliyewanunua
  alternative: Bwana aliyewakomboa; Mtawala Mkuu aliyewanunua
  rationale: Tafsiri inahifadhi dai la wazi la maandiko pamoja na sitiari ya ununuzi, bila kutatua kimya kimya mjadala wa kiteolojia kuhusu asili au upeo wa kununuliwa huko.
- issue: Kutofautisha δεσπότης na κύριος
  choice: Bwana Mkuu
  alternative: Bwana; Mtawala Mkuu; Mmiliki
  rationale: “Bwana Mkuu” huwasilisha mamlaka na umiliki unaodokezwa na δεσπότης bila kuifanya iwe sawa kabisa na tafsiri ya kawaida ya κύριος.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili uwe wazi, huku ulinganifu, usiri wa tendo, sitiari ya kununua, na mvutano wa kiteolojia wa kifungu vikihifadhiwa. Alama [a] imewekwa baada ya kirai kinachohusu αἱρέσεις, ambacho ndicho tanbihi yake inachofafanua.
