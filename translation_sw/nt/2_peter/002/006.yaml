  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: sw
  text: na ikiwa, akiisha kuifanya miji ya Sodoma na Gomora kuwa majivu, alizihukumu ziangamizwe[a], akiwa amezifanya kuwa mfano kwa wale ambao wangeishi bila kumcha Mungu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alizihukumu zipinduliwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa amezifanya kuwa mfano kwa watu wasiomcha Mungu wa wakati ujao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: akiisha kuifanya ... kuwa majivu
  rationale: Kitenzi hiki kinamaanisha kugeuza au kupunguza kitu kikawa majivu. Usemi huu unaonyesha matokeo yaliyokusudiwa, si kuchoma tu.
- source_word: καταστροφῇ κατέκρινεν
  choice: aliihukumu iangamizwe
  rationale: 'Muundo huu unadumisha maana ya kimahakama ya κατέκρινεν na kuchukulia καταστροφῇ kuwa matokeo ya hukumu: kuangamizwa.'
- source_word: ὑπόδειγμα
  choice: mfano
  rationale: Neno hili linaweza kumaanisha mfano au kielelezo; katika muktadha wa hukumu, mfano huo pia una nguvu ya onyo bila kulazimika kuongeza neno hilo katika matini.
- source_word: μελλόντων ἀσεβέσιν
  choice: kwa wale ambao wangeishi bila kumcha Mungu
  rationale: Usemi huu unaonyesha wakati ujao kwa mtazamo wa tukio la Sodoma na Gomora na unawasilisha kwa Kiswahili cha kawaida maana ya watu wasiomcha Mungu.
- source_word: τεθεικώς
  choice: akiwa ameifanya
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililoweka miji hiyo katika hali ya kudumu kuwa mfano.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: miji ya Sodoma na Gomora
  rationale: Hii ni tafsiri ya kawaida ya muundo wa umilikaji na inadumisha wingi wa neno ‘miji.’
theological_decisions:
- issue: Kiima kisichotajwa wazi katika kifungu
  choice: kiima cha nafsi ya tatu katika ‘aliihukumu’ bila kuongeza jina
  alternative: Mungu aliihukumu; Bwana aliihukumu
  rationale: Kiyunani kinaendeleza kiima kinachoeleweka kutokana na muktadha. Kiswahili kinaweza kukihifadhi katika kiambishi cha kitenzi bila kuingiza cheo au jina lisilotajwa katika kifungu hiki.
- issue: Maana ya ἀσεβέσιν
  choice: wale ambao wangeishi bila kumcha Mungu
  alternative: waovu; watu wasiomcha Mungu wa wakati ujao
  rationale: Tafsiri hii inahifadhi maana ya kutomcha Mungu na pia hali ya wakati ujao, bila kuifanya dhana hiyo kuwa uovu wa kijumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘na ikiwa’ na koma ya mwisho umehifadhiwa kwa sababu mstari huu ni sehemu ya sentensi ndefu inayoendelea katika muktadha.
