  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: sw
  text: kwa maana, kwa kuona na kusikia, mtu huyo mwadilifu, akiishi kati yao, siku baada ya siku alikuwa akiitesa nafsi yake yenye uadilifu kwa matendo yao ya kuasi sheria—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: kutokana na yale aliyoyaona na kuyasikia
  rationale: Nomino hizi katika hali ya dative zinaeleza njia au sababu ya mateso ya ndani ya Loti. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi kuona na kusikia bila kuzifanya kuwa hisia zisizo na maudhui.
- source_word: ὁ δίκαιος
  choice: mtu huyo mwadilifu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na kinamrejelea Loti wa mstari uliotangulia. Neno “huyo” linaonyesha rejeo hilo, na “mwadilifu” linahifadhi maana ya kimaadili ya δίκαιος.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: alipokuwa akiishi kati yao
  rationale: Kauli hii inaonyesha makao ya kudumu miongoni mwa watu hao. Muundo wa Kiswahili unaonyesha kwamba hali hiyo iliendelea wakati wa tukio kuu.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: siku baada ya siku
  rationale: Huu ni usemi wa kurudia na kuendelea; “siku baada ya siku” ni wa asili na unaonyesha mkusanyiko wa mateso ya kila mara.
- source_word: ψυχὴν δικαίαν
  choice: nafsi yake yenye uadilifu
  rationale: ψυχή hapa ni utu wa ndani au nafsi ya Loti, si taarifa ya kinadharia kuhusu mgawanyo wa mwili na roho. “Yake” imetolewa na muktadha, huku “yenye uadilifu” ikihifadhi kurudiwa kwa mzizi δίκαιος.
- source_word: ἀνόμοις ἔργοις
  choice: matendo yao ya kuasi sheria
  rationale: Usemi huu unahifadhi nguvu ya kimaadili na kisheria ya ἄνομος kwa Kiswahili cha kawaida. “Yao” linafafanua kwa muktadha kuwa matendo ni ya watu ambao Loti aliishi kati yao.
- source_word: ἐβασάνιζεν
  choice: alikuwa akiitesa
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea zamani, na kitenzi βασανίζω kina nguvu kuliko kuhuzunika tu. Kauli tendaji ya Kigiriki imehifadhiwa, huku kiambishi cha yambwa “-i-” kikirejelea nafsi yake.
theological_decisions:
- issue: Maana ya ψυχή katika mtazamo wa mwanadamu
  choice: “nafsi” kwa maana isiyo ya kinadharia, ikirejelea utu wa ndani wa Loti
  alternative: “utu wake wa ndani” au “mwenyewe”
  rationale: Mstari unaeleza uchungu wa ndani wa kimaadili, si kufafanua kwa kina uhusiano wa mwili na nafsi. “Nafsi” ni sawa ya moja kwa moja na yenye hadhi bila kuingiza mfumo maalumu wa kimadhehebu.
- issue: Kauli tendaji ya ἐβασάνιζεν
  choice: “alikuwa akiitesa nafsi yake”
  alternative: “nafsi yake ilikuwa ikiteseka” au “alikuwa akijitesa moyoni”
  rationale: Kigiriki kinamtaja mtu mwadilifu kuwa mtendaji na nafsi yenye uadilifu kuwa yambwa. Tafsiri inahifadhi mvutano huo badala ya kuugeuza kimya kimya kuwa kauli ya hali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku ukihifadhi marudio ya “mwadilifu/uadilifu,” nguvu ya kitenzi “kutesa,” na utata halisi wa uhusiano kati ya kuona, kusikia, na matendo ya uasi.
