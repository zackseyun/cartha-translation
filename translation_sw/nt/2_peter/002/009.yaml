  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: sw
  text: Basi, Bwana anajua jinsi ya kuwaokoa watu wanaomcha Mungu kutoka katika jaribu[a], na kuwaweka wasio waadilifu chini ya adhabu mpaka siku ya hukumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika kishawishi.” Neno la Kiyunani linaweza kumaanisha kishawishi au jaribu/kujaribiwa; hapa muktadha unapendelea kuokolewa kutoka katika jaribu.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuwahifadhi wasio waadilifu ili waadhibiwe siku ya hukumu.” Kitenzi-ushiriki cha Kiyunani kinaweza kueleweka kuwa kinaeleza adhabu inayoendelea au adhabu inayohusishwa na hukumu ijayo.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: anajua jinsi ya
  rationale: Pamoja na vitenzi visoukomo, οἶδεν inaeleza ujuzi au uwezo wa kutenda; “anajua jinsi ya” ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa κύριος katika muktadha huu.
- source_word: εὐσεβεῖς
  choice: watu wanaomcha Mungu
  rationale: Kivumishi hiki kilichotumiwa kama nomino humaanisha watu wenye uchaji na uaminifu kwa Mungu; usemi huu ni wa kawaida na unaeleweka wazi.
- source_word: ἐκ πειρασμοῦ
  choice: kutoka katika jaribu
  rationale: πειρασμός inaweza kumaanisha jaribu, majaribu, au kujaribiwa. Muktadha wa Nuhu na Loti unapendelea hali ya kujaribiwa au taabu, bila kuondoa uwezekano mwingine.
- source_word: ῥύεσθαι
  choice: kuwaokoa
  rationale: ῥύομαι hueleza kuokoa au kukomboa kutoka hatarini; “kuwaokoa” ni ya asili na inafaa muktadha.
- source_word: ἀδίκους
  choice: wasio waadilifu
  rationale: Huhifadhi maana ya kimaadili na ya kimahakama ya ἄδικος bila kuibana kuwa aina fulani tu ya watenda mabaya.
- source_word: εἰς ἡμέραν κρίσεως
  choice: mpaka siku ya hukumu
  rationale: Pamoja na τηρεῖν, kifungu hiki kinaelekeza kwenye siku ijayo ya hukumu; “mpaka” huonyesha muda huo wa kuhifadhiwa kwa Kiswahili cha kawaida.
- source_word: κολαζομένους
  choice: chini ya adhabu
  rationale: Kirai hiki kinawakilisha hali endelevu inayoweza kuonyeshwa na kitenzi-ushiriki cha wakati wa sasa, huku tanbihi ikihifadhi uwezekano wa adhabu inayohusishwa na siku ijayo.
- source_word: τηρεῖν
  choice: kuwaweka
  rationale: τηρέω hapa ni kuwaweka au kuwahifadhi katika hali fulani; “kuwaweka” huungana kwa kawaida na “chini ya adhabu.”
theological_decisions:
- issue: Maana ya πειρασμός katika muktadha
  choice: jaribu kwa maana ya hali ya kujaribiwa au taabu
  alternative: kishawishi cha kutenda dhambi
  rationale: Muktadha uliotangulia unahusu kuokolewa kwa Nuhu na Loti katikati ya hukumu na mazingira ya uovu. “Jaribu” huhifadhi upana wa neno bila kulifunga kwa kishawishi cha ndani pekee.
- issue: Nguvu ya κολαζομένους
  choice: wasio waadilifu wako chini ya adhabu huku wakihifadhiwa mpaka siku ya hukumu
  alternative: wanahifadhiwa kwa ajili ya kuadhibiwa siku ya hukumu
  rationale: Kitenzi-ushiriki cha wakati wa sasa kinaweza kueleza adhabu inayoendelea, lakini muundo wa Kiyunani pia umeruhusu tafsiri inayohusisha adhabu na hukumu ijayo. Tanbihi huhifadhi mvutano huu bila kulazimisha mpangilio kamili wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Watu wanaomcha Mungu” ni wazi zaidi kuliko nomino ya kidhahania, na tanbihi huhifadhi utata halisi wa πειρασμός na κολαζομένους.
