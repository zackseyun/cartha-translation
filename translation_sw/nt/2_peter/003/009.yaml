id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: sw
  text: Bwana hakawii kutimiza ahadi, kama wengine wanavyodhani kwamba anakawia,[a] bali ana subira kwenu,[b][c] wala hataki yeyote aangamie, bali wote wafikie toba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama wengine wanavyohesabu jambo hilo kuwa ni kukawia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anawavumilia.”
    reason: lexical_alternative
  - marker: c
    text: Upeo wa maneno “yeyote” na “wote” umeachwa kama ulivyo katika Kigiriki; wafafanuzi hutofautiana kuhusu kama Petro anawarejelea hasa wasomaji wake au wanadamu kwa upana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Hutafsiri cheo cha kimungu kwa njia ya kawaida, yenye heshima, na inayoeleweka katika Kiswahili.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: hakawii kuhusu ahadi yake
  rationale: ‘Hakawii’ huonyesha kuchelewa na kudumisha uhusiano wa kileksika na βραδύτητα; ‘kuhusu’ huwasilisha uhusiano wa genitivi bila kuongeza wazi wazo la ‘kutimiza,’ ingawa ‘yake’ huweka ahadi katika uhusiano wa asili na Bwana.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: kama wengine wanavyodhani kuwa anakawia
  rationale: Kiswahili cha asili huhitaji kueleza wazo la nomino βραδύτητα kwa kishazi; ‘wanavyodhani’ huwasilisha ἡγοῦνται kama kuhesabu au kuona jambo kwa namna fulani.
- source_word: μακροθυμεῖ
  choice: anawavumilia
  rationale: Huwasilisha subira ya muda mrefu na kujizuia, si uvumilivu wa hali tu.
- source_word: εἰς ὑμᾶς
  choice: ninyi
  rationale: Kiambishi cha yambwa katika ‘anawavumilia’ pamoja na ‘ninyi’ hudumisha rejeo la wazi kwa wasomaji; tanbihi huhifadhi uwezekano wa ‘ana subira kwenu.’
- source_word: μὴ βουλόμενός
  choice: kwa kuwa hataki
  rationale: Huwasilisha nia au tamaa bila kuingiza istilahi maalumu za kimfumo kuhusu mapenzi ya Mungu; ‘kwa kuwa’ huonyesha uhusiano wa kimaana wa kishiriki.
- source_word: τινας ἀπολέσθαι
  choice: yeyote aangamie
  rationale: ‘Aangamie’ ni kitenzi kizito na cha kawaida kwa maana ya kupotea au kuangamia, bila kulazimisha mtendaji wa nje.
- source_word: πάντας
  choice: wote
  rationale: Hudumisha ulinganifu mfupi na ‘yeyote’ bila kufafanua upeo ambao Kigiriki hakijaueleza wazi.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: wafikie toba
  rationale: ‘Wafikie’ huhifadhi kwa kiasi taswira ya kufika katika hali fulani, huku ‘toba’ ikiwa istilahi ya kawaida na sahihi kwa μετάνοια.
theological_decisions:
- issue: Upeo wa ‘ninyi,’ ‘yeyote,’ na ‘wote’ kuhusu subira ya Mungu na wokovu
  choice: 'Maneno yameachwa kwa upana wake wa moja kwa moja: ‘anawavumilia ninyi ... hataki yeyote aangamie, bali wote wafikie toba.’'
  alternative: Kuyafanya ‘yeyote’ na ‘wote’ yahusu waamini/wateule pekee, au kuyapanua wazi kuwa wanadamu wote.
  rationale: Kigiriki hakitoi hapa ufafanuzi wa moja kwa moja wa upeo huo. Tafsiri haipaswi kutatua mvutano wa kitheolojia kwa kuongeza kizuizi au upanuzi wa kimadhehebu.
- issue: Nguvu ya βουλόμενός katika kusema mapenzi ya Mungu
  choice: hataki
  alternative: ‘hajaazimia,’ ‘hajaamuru,’ au istilahi nyingine ya kimfumo
  rationale: ‘Hataki’ hudumisha maana ya hiari au tamaa bila kuamua tofauti za baadaye za kitheolojia kuhusu aina za mapenzi ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi marudio ya wazo la kukawia, rejeo la wazi kwa ‘ninyi,’ na mvutano wa kitheolojia wa ‘yeyote/wote.’
