  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: sw
  text: wakisema, “Iko wapi ahadi ya kuja kwake[a]? Kwa maana tangu mababu walipolala usingizi[b], vitu vyote vinaendelea vilevile tangu mwanzo wa uumbaji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwapo kwake” au “kuwasili kwake.” Katika muktadha huu, neno la Kigiriki παρουσία linarejelea kuja kwa Kristo kunakotarajiwa wakati ujao.
    reason: lexical_alternative
  - marker: b
    text: “Kulala usingizi” ni lugha ya upole ya Kigiriki inayomaanisha kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi-endelezi hiki kinaendeleza maelezo ya wenye dhihaka katika mstari uliotangulia bila kukibadili kuwa sentensi mpya.
- source_word: ἐπαγγελία
  choice: ahadi
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa ἐπαγγελία, likirejelea uhakikisho unaodhihakiwa kuhusu kuja kwake.
- source_word: παρουσίας
  choice: kuja
  rationale: Katika muktadha huu wa wakati ujao, παρουσία humaanisha kuwasili au kuja kwa Kristo; “kuja” ni wazi na ya kawaida kwa Kiswahili.
- source_word: ἀφ’ ἧς
  choice: tangu
  rationale: Kirai hiki huonyesha muda unaoendelea kutoka tukio fulani la zamani.
- source_word: οἱ πατέρες
  choice: mababu
  rationale: Neno hili linarejelea vizazi vilivyotangulia; “mababu” ni la asili katika Kiswahili na haliongezi kimilikishi ambacho hakipo katika Kigiriki.
- source_word: ἐκοιμήθησαν
  choice: walipolala usingizi
  rationale: Huhifadhi sitiari ya Kigiriki ya kulala kama lugha ya upole kuhusu kufa.
- source_word: πάντα
  choice: vitu vyote
  rationale: Huwakilisha wigo mpana wa usemi wa Kigiriki.
- source_word: οὕτως διαμένει
  choice: vinaendelea vilevile
  rationale: Hutoa kwa Kiswahili cha kawaida hoja kwamba hali ya vitu haijabadilika.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: tangu mwanzo wa uumbaji
  rationale: Huwasilisha kwa uwazi mwanzo wa kipindi kinachodaiwa, kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya παρουσία katika muktadha wa mambo ya mwisho
  choice: kuja kwake
  alternative: kuwapo kwake; kuwasili kwake
  rationale: Muktadha ni dhihaka kuhusu kutotimia bado kwa matarajio ya kurudi kwa Kristo. “Kuja kwake” huwasilisha maana hiyo huku tanbihi ikihifadhi uwezekano wa kimsamiati wa “kuwapo” au “kuwasili.”
- issue: Uwasilishaji wa lugha ya upole ἐκοιμήθησαν kuhusu kifo
  choice: walipolala usingizi
  alternative: walipokufa
  rationale: Kigiriki kinatumia sitiari badala ya neno la moja kwa moja la kifo; kuitunza huhifadhi mtindo wa chanzo bila kulazimisha dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza sentensi ya mstari uliotangulia, na sitiari pamoja na mvutano wa hoja ya wenye dhihaka vimehifadhiwa.
