- from: mkiingojea na kuharakisha kuja kwa siku ya Mungu[a], ambayo kwa sababu yake mbingu zitateketezwa kwa moto na kuvunjwa, na elementi zitaungua[b] na kuyeyuka.
  to: mkiingojea na kuharakisha kuja kwa siku ya Mungu[a], kwa sababu ya siku hiyo mbingu zitakapowashwa moto zitafumuliwa, na elementi, zikiungua[b], zitayeyuka.
