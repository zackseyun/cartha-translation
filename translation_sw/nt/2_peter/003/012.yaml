id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: sw
  text: mkiingojea na kuharakisha kuja kwa siku ya Mungu[a], kwa sababu ya siku hiyo mbingu zitakapowashwa moto zitafumuliwa, na elementi, zikiungua[b], zitayeyuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkiingojea kwa hamu kuja kwa siku ya Mungu.” Kitenzi cha Kigiriki kinaweza kumaanisha ama “kuharakisha” au “kutazamia kwa hamu.”
    reason: alternative_reading
  - marker: b
    text: “Elementi” zinaweza kuwa viambajengo vya msingi vya ulimwengu, au huenda vitu vya angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: mkiingojea
  rationale: Kitenzi kishirikishi kinaendeleza himizo la mstari uliotangulia na kueleza kungoja kwa matarajio.
- source_word: σπεύδοντας
  choice: kuharakisha
  rationale: Huhifadhi maana ya moja kwa moja ya kuharakisha ujio, huku maana nyingine ya kutazamia kwa hamu ikiwekwa katika tanbihi.
- source_word: παρουσίαν
  choice: kuja
  rationale: Katika muktadha wa matukio ya mwisho, ‘kuja’ ni ya kawaida na wazi kuliko tafsiri halisi ya kuwapo.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: siku ya Mungu
  rationale: Huhifadhi usemi usio wa kawaida wa Kigiriki na kuutofautisha na usemi unaopatikana mara nyingi zaidi, ‘siku ya Bwana.’
- source_word: δι’ ἣν
  choice: ambayo kwa sababu yake
  rationale: διά pamoja na hali ya accusative inaonyesha sababu hapa; muundo huu unaunganisha siku hiyo na kuvunjika kwa ulimwengu.
- source_word: οὐρανοὶ
  choice: mbingu
  rationale: Neno la Kiswahili linafaa kwa wingi wa Kigiriki na muktadha wa ulimwengu mzima.
- source_word: πυρούμενοι
  choice: zitateketezwa kwa moto
  rationale: Hueleza hali ya mbingu kukumbwa na moto, huku muundo wa kutendwa ukihifadhiwa.
- source_word: λυθήσονται
  choice: kuvunjwa
  rationale: Maana hapa ni kufumuliwa au kutenganishwa, si lazima kuangamizwa kabisa; ‘kuvunjwa’ ni wazi kwa msomaji wa kawaida.
- source_word: στοιχεῖα
  choice: elementi
  rationale: Neno hili pana huhifadhi utata kati ya viambajengo vya msingi vya ulimwengu na vitu vya angani.
- source_word: καυσούμενα
  choice: zitaungua
  rationale: Huonyesha kwamba elementi zitakumbwa na joto au moto kwa lugha ya kawaida ya Kiswahili.
- source_word: τήκεται
  choice: kuyeyuka
  rationale: Kitenzi kinamaanisha kuyeyuka kwa joto; wakati ujao umetumiwa kwa upatanifu wa asili wa Kiswahili na vitenzi vinavyozunguka.
theological_decisions:
- issue: Maana ya σπεύδοντας τὴν παρουσίαν
  choice: kuharakisha kuja
  alternative: kutazamia kwa hamu kuja
  rationale: Kigiriki kinaweza kumaanisha ama kuharakisha kufika kwa siku hiyo ama kuitazamia kwa hamu. Maana ya kwanza imewekwa katika matini, na ya pili katika tanbihi ili kutatua utata huo kimabavu.
- issue: Kirejelewa cha στοιχεῖα
  choice: elementi
  alternative: vitu vya angani
  rationale: Neno hilo linajadiliwa katika vifungu vya matukio ya mwisho. Tafsiri pana huepuka kulazimisha mtazamo fulani wa muundo wa ulimwengu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha mwendelezo wa himizo kutoka mstari uliotangulia. ‘Elementi’ ni istilahi pana inayohitaji tanbihi lakini ndiyo inayohifadhi vizuri zaidi utata wa neno la Kigiriki.
