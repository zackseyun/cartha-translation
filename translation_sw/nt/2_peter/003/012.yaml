review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two participles governing the exhortation, the distinctive phrase “siku ya Mungu,” and the broad referent of στοιχεῖα. However, “zitateketezwa kwa moto” is stronger than πυρούμενοι (“being set ablaze/on fire”) and obscures its participial relationship to “zitafumuliwa.” The causal link expressed by δι’ ἣν is more clearly conveyed by explicitly referring back to the day.
  naturalness: The revision uses clear, contemporary Standard East African Swahili. “Kwa sababu ya siku hiyo” is more idiomatic and less cumbersome than “ambayo kwa sababu yake,” while “zitakapowashwa moto” naturally represents the Greek passive participle.
  terminology: “Kuja kwa siku ya Mungu” appropriately preserves παρουσία and the unusual “day of God.” “Elementi” is retained as a deliberately broad technical term, with a footnote preserving the principal lexical alternatives. “Zitafumuliwa” better conveys λύω in this cosmic context than the more general “kuvunjwa.”
  issues:
  - severity: medium
    issue: “Zitateketezwa kwa moto” overstates πυρούμενοι.
    rationale: The Greek participle means being set on fire or set ablaze; it does not itself say that the heavens are consumed or destroyed. The main verb λυθήσονται supplies the resulting dissolution.
  - severity: low
    issue: The causal relative clause is awkward in Swahili.
    rationale: “Ambayo kwa sababu yake” is understandable but stilted and may momentarily leave the referent unclear. “Kwa sababu ya siku hiyo” clearly maintains the causal connection to the day of God.
  - severity: low
    issue: The two Greek participles are better represented as subordinate circumstances rather than simply coordinated future verbs.
    rationale: Using temporal/subordinate forms preserves the relation of the heavens being set ablaze before dissolution and the elements burning as they melt.
