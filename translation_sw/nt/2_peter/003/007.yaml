  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: sw
  text: Lakini mbingu za sasa na dunia zimewekwa akiba kwa neno hilohilo, zikihifadhiwa kwa ajili ya moto mpaka siku ya hukumu na maangamizi ya watu wasiomcha Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Lakini mbingu za sasa na dunia
  rationale: δέ inaonyesha utofautishaji na ulimwengu wa zamani uliotajwa katika muktadha, hivyo imetafsiriwa “Lakini.” νῦν inaonyesha utaratibu wa uumbaji uliopo sasa. Wingi wa οὐρανοί umehifadhiwa katika “mbingu.”
- source_word: τῷ αὐτῷ λόγῳ
  choice: kwa neno hilohilo
  rationale: 'Hali ya dative inaeleweka kama chombo: neno la Mungu ndilo linalotekeleza tendo hilo. “Hilohilo” huhifadhi rejeo la αὐτῷ kwa neno lililotajwa katika muktadha uliotangulia.'
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: zimewekwa akiba
  rationale: Muundo wa perfect wa kuzunguka unaonyesha tendo lililokamilika lenye hali inayoendelea sasa. “Zimewekwa akiba” huwasilisha hali hiyo kwa Kiswahili cha kawaida bila kuchanganya kitenzi hiki na τηρούμενοι kinachofuata.
- source_word: πυρὶ τηρούμενοι
  choice: zikihifadhiwa kwa ajili ya moto
  rationale: τηρέω ni kuhifadhi au kuweka kwa kusudi fulani; πυρί hapa inaonyesha lengo au kusudi. “Kwa ajili ya moto” huhifadhi usemi usio na kibainishi na hauongezi maelezo kuhusu namna hasa moto huo utakavyotenda.
- source_word: εἰς ἡμέραν κρίσεως
  choice: mpaka siku ya hukumu
  rationale: εἰς ina nguvu ya kuelekea kikomo cha wakati katika muktadha huu. “Mpaka” ni njia ya kawaida na wazi ya kuonyesha kuwa kuhifadhiwa kunaendelea hadi siku hiyo.
- source_word: καὶ ἀπωλείας
  choice: na kuangamizwa
  rationale: ἀπώλεια humaanisha maangamizi au uharibifu. Nomino-tendo “kuangamizwa” inaonyesha wazi kuwa watu wasiomcha Mungu ndio wanaopatwa na maangamizi, bila kuingiza maana maalumu ya kimadhehebu.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: kwa watu wasiomcha Mungu
  rationale: ἀσεβής humtaja asiye na uchaji kwa Mungu. “Watu wasiomcha Mungu” ni usemi wa asili na wenye heshima katika Kiswahili, na “watu” huwakilisha wanadamu kwa ujumla kama ἄνθρωποι inavyoweza kufanya hapa.
theological_decisions:
- issue: Asili ya mwisho ujao unaohusishwa na moto
  choice: Aya inasema kwamba mbingu za sasa na dunia zinahifadhiwa kwa ajili ya moto wa wakati ujao, na kwamba watu wasiomcha Mungu watahukumiwa na kuangamizwa.
  alternative: Kusema wazi kwamba ulimwengu utaondolewa kabisa, au kwamba moto utautakasa na kuubadilisha tu.
  rationale: Kisintaksia, “kuangamizwa” kunahusishwa moja kwa moja na watu wasiomcha Mungu. Aya hii haisemi kwa uwazi ikiwa moto utaangamiza kabisa mbingu na dunia au utazibadilisha. Tafsiri kwa hiyo haiamui mjadala huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umehifadhi tofauti kati ya “zimewekwa akiba” na “zikihifadhiwa,” huku sentensi ikibaki ya asili kwa msomaji wa kawaida.
