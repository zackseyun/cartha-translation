  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: sw
  text: 'mkijua jambo hili kwanza: kwamba katika siku za mwisho wadhihaki watakuja kwa dhihaka, wakifuata tamaa zao wenyewe[b],[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “watu wenye dhihaka watakuja kwa dhihaka.” Kigiriki kinatumia maneno yenye mzizi mmoja ili kutia msisitizo: “wadhihaki” na “dhihaka.”'
    reason: lexical_alternative
  - marker: b
    text: “Tamaa” hapa inaweza kumaanisha hamu kali za aina mbalimbali, si tamaa ya kingono pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: mkijua hili kwanza
  rationale: Muundo wa kisifa umehifadhiwa badala ya kugeuzwa kuwa amri; “kwanza” inadumisha nguvu ya πρῶτον.
- source_word: ἐλεύσονται
  choice: watakuja
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha wakati ujao ἐλεύσονται.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: katika siku za mwisho
  rationale: Huu ni usemi wa kawaida wa Kieskatolojia, nao hauingizi mpangilio maalumu wa kimadhehebu kuhusu nyakati za mwisho.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: wadhihaki, wakidhihaki
  rationale: Kurudiwa kwa mzizi “dhihaki” kunawakilisha msisitizo wa maneno ya Kigiriki yenye asili moja huku Kiswahili kikibaki cha asili.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: kufuata tamaa zao wenyewe
  rationale: “Tamaa” huonyesha hamu kali yenye mwelekeo hasi katika muktadha huu bila kuifanya iwe ya kingono tu; “zao wenyewe” huhifadhi msisitizo wa umilikaji.
- source_word: πορευόμενοι
  choice: kufuata
  rationale: Katika muktadha huu kitenzi kinaeleza mwenendo wa maisha. “Kufuata” ni Kiswahili cha kawaida kinachoonyesha kwamba tamaa zao zinaongoza mwenendo wao.
theological_decisions:
- issue: Maana ya kieskatolojia ya ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: katika siku za mwisho
  alternative: mwishoni mwa siku
  rationale: Tafsiri hii huhifadhi usemi mpana wa maandiko kuhusu siku za mwisho bila kuamua mfumo fulani wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unaendeleza kisifa cha Kigiriki, na urudiaji wa mzizi “dhihaki” umehifadhiwa kwa sababu ni wa kimakusudi katika chanzo.
