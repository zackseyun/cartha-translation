  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: sw
  text: 'Lakini msikose kutambua jambo hili moja[a], wapendwa: kwa Bwana, siku moja ni kama miaka elfu moja[c][b], na miaka elfu moja ni kama siku moja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msilipuuzie jambo hili moja.”
    reason: lexical_alternative
  - marker: b
    text: Neno “kama” linaonyesha ulinganisho, si kwamba siku moja ni sawa kihalisi na miaka elfu moja.
    reason: cultural_note
  - marker: c
    text: Maneno haya yanaakisi Zaburi 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: jambo hili moja
  rationale: Muundo wa umoja unasisitiza jambo moja mahususi; tafsiri hii inahifadhi nguvu ya kiashiria τοῦτο na msisitizo wa Ἓν.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: msikose kutambua
  rationale: λανθάνω hapa hueleza jambo kutotambuliwa au kupita bila kuonwa. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi nguvu ya agizo bila kudokeza kwa lazima kupuuza kwa makusudi.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wenye upendo kwa waamini wenzake; “wapendwa” ni wa heshima, wa asili, na unafaa katika muktadha wa jumuiya ya imani.
- source_word: παρὰ κυρίῳ
  choice: kwa Bwana
  rationale: παρά pamoja na hali ya dative hapa inaweza kuonyesha uwepo au mtazamo. “Kwa Bwana” ni fupi na ya kawaida, huku ikiacha wazi wazo la jinsi muda ulivyo mbele za Bwana.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: siku moja ni kama miaka elfu moja
  rationale: ὡς huonyesha ulinganisho, si usawa halisi. “Ni kama” huwasilisha tashbihi hiyo wazi katika Kiswahili cha sasa.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: na miaka elfu moja ni kama siku moja
  rationale: Kurudia “ni kama” kunafanya vipande viwili vya ulinganisho viwe wazi na sawia kwa msomaji wa Kiswahili.
- source_word: χίλια ἔτη
  choice: miaka elfu moja
  rationale: Hii ni namna sanifu ya kutaja idadi hiyo kwa Kiswahili, bila kuipa maana ya mfano ndani ya tafsiri yenyewe.
theological_decisions:
- issue: Asili ya ulinganisho wa wakati
  choice: Kauli imetafsiriwa kama ulinganisho kuhusu wakati kwa mtazamo wa Bwana, si kama usawa halisi wala kanuni ya kubadili vipindi vya unabii.
  alternative: Kutafsiri siku moja kuwa sawa kihalisi na miaka elfu moja, au kutumia mstari huu kama kanuni ya kuhesabu ratiba ya matukio ya mwisho.
  rationale: Neno ὡς limerudiwa na maana yake ni “kama,” jambo linaloonyesha ulinganisho. Tafsiri inahifadhi tashbihi hiyo bila kuingiza mfumo fulani wa mafundisho au kuondoa mvutano wa kitheolojia wa andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wapendwa” inadumisha sauti ya upendo ya mwito, na urari wa vifungu viwili vya ulinganisho umehifadhiwa.
