  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: sw
  text: Kwa hiyo, ninyi wapendwa, kwa kuwa mnajua haya mapema, jilindeni ili msije, mkichukuliwa pamoja na upotovu wa watu wasiotii sheria, mkaanguka[b] kutoka katika uthabiti wenu wenyewe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msimamo wenu imara.” Neno la Kigiriki στηριγμός linaweza kumaanisha uimara, uthabiti, au hali ya kusimama imara.
    reason: lexical_alternative
  - marker: b
    text: “Kuanguka kutoka” pia kunaweza kutafsiriwa “kuanguka mbali na,” lakini tafsiri kuu haifanyi onyo hili liwe mahususi zaidi kitheolojia kuliko Kigiriki kinavyodai.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Kwa hiyo, ninyi
  rationale: “Kwa hiyo” huhifadhi uhusiano wa hitimisho na yaliyotangulia, huku “ninyi” ikidumisha msisitizo wa kiwakilishi katika Kigiriki.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wa upendo wenye hadhi unaofaa barua na unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: προγινώσκοντες
  choice: kwa kuwa mnajua haya mapema
  rationale: Huhifadhi maana ya kujua kabla au kuonywa mapema; “haya” hutolewa na muktadha.
- source_word: φυλάσσεσθε
  choice: jilindeni
  rationale: Huhifadhi amri ya kuendelea kuwa macho pamoja na nguvu ya kujirejelea ya kauli ya kati.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: upotovu wa watu wasiojali sheria
  rationale: “Upotovu” huwasilisha kosa linalopotosha, na “watu wasiojali sheria” huonyesha kutoheshimu kanuni za maadili bila kudokeza sheria za kiraia pekee.
- source_word: συναπαχθέντες
  choice: mkachukuliwa pamoja na
  rationale: Huhifadhi hali ya kutendwa na wazo la kuvutwa au kuchukuliwa pamoja na wengine au pamoja na upotovu wao.
- source_word: ἐκπέσητε
  choice: mkaanguka kutoka
  rationale: Huhifadhi sitiari ya kuanguka kutoka mahali pa uthabiti bila kuifanya iwe tamko mahususi kuhusu uasi-imani.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: katika uthabiti wenu wenyewe
  rationale: “Uthabiti” huonyesha hali ya kuwa imara, na “wenu wenyewe” huhifadhi msisitizo wa ἰδίου.
theological_decisions:
- issue: Ikiwa ἐκπέσητε humaanisha kupoteza wokovu au kuanguka kwa ujumla kutoka katika hali ya kuwa imara
  choice: mkaanguka kutoka katika uthabiti wenu wenyewe
  alternative: mkaiacha imani yenu thabiti
  rationale: Kigiriki kinaonya kuhusu kuanguka kutoka katika hali imara, lakini hakilazimishi hitimisho mahususi la kimadhehebu kuhusu kupoteza wokovu au uasi-imani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya barua ya kichungaji lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi msisitizo wa “ninyi” na onyo lenye nguvu bila kutatua mvutano wa kitheolojia uliopo katika ἐκπέσητε.
