  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: sw
  text: Kwa maana kwa makusudi wanapuuza jambo hili:[a] kwamba mbingu zilikuwepo tangu zamani, na dunia ilifanyizwa kutoka katika maji na kupitia maji kwa neno la Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hili linawafichika kwa hiari yao,” au “kwa hiari wanalipuuza jambo hili.” Usemi wa Kigiriki unaunganisha kutotambua jambo na nia ya kutolitambua au kutolikubali.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa amri ya Mungu.” Tafsiri ya karibu zaidi ya maneno ya Kigiriki ni “kwa neno la Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Kwa maana kwa makusudi wanapuuza jambo hili
  rationale: Muundo huu unaunganisha kutotambua au kutokubali jambo na nia ya hiari. ‘Kwa makusudi wanapuuza’ huonyesha nguvu ya kiakili na ya kimakusudi kwa Kiswahili cha kawaida.
- source_word: οὐρανοὶ
  choice: mbingu
  rationale: ‘Mbingu’ ni nomino ya Kiswahili inayotumika kwa maana hii ya wingi na inafaa katika lugha ya uumbaji.
- source_word: ἔκπαλαι
  choice: tangu zamani
  rationale: Hutoa maana ya kuwepo kwa muda mrefu uliopita kwa lugha ya sasa na iliyo wazi.
- source_word: γῆ
  choice: dunia
  rationale: Katika muktadha huu wa uumbaji, ‘dunia’ hurejelea ulimwengu wa nchi kavu bila kulazimisha tafsiri ya ‘ardhi’ kama eneo dogo. Kiswahili hakihitaji kuakisi kutokuwapo kwa kibainishi cha Kigiriki kwa kutumia muundo usio wa kawaida.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: kutoka katika maji na kupitia maji
  rationale: Huhifadhi tofauti kati ya ἐκ, ‘kutoka katika,’ na διά, ‘kupitia/kwa njia ya,’ bila kufuta utata wa jukumu la maji.
- source_word: συνεστῶσα
  choice: ilifanyizwa
  rationale: Kitenzi hiki kinaonyesha dunia kusimamishwa au kuundwa katika muktadha wa uumbaji; ‘ilifanyizwa’ ni cha kawaida na hakiamui kwa undani namna ya uundaji.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: kwa neno la Mungu
  rationale: Huhifadhi ‘neno’ kwa λόγος na matumizi ya nyenzo katika dative, bila kulifanya moja kwa moja kuwa ‘amri’ wala cheo binafsi cha Logos.
theological_decisions:
- issue: Ikiwa λόγῳ itafsiriwe kwa namna inayoashiria Logos aliye nafsi
  choice: kwa neno la Mungu
  alternative: kwa amri ya Mungu
  rationale: Muktadha unaelekea kwenye neno la Mungu lenye nguvu katika uumbaji, lakini mstari wenyewe hautaji wazi Mwana kama cheo. Tafsiri ya ‘neno’ huhifadhi usemi na mvutano huo.
- issue: Jukumu la maji katika kuumbwa kwa dunia
  choice: kutoka katika maji na kupitia maji
  alternative: kutoka katika maji na kwa njia ya maji
  rationale: Maneno ya Kigiriki yanaweza kueleza chanzo, mazingira, au njia. Usemi ulioteuliwa huhifadhi tofauti ya vihusishi bila kuamua mfumo maalumu wa kikosmolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mbingu’ na ‘dunia’ ni maneno ya kawaida katika simulizi la uumbaji; mpangilio wa sentensi umewekwa wazi bila kuondoa utata wa vihusishi vya Kigiriki.
