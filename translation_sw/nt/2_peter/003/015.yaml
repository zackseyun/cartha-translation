base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: sw
  text: Na hesabuni uvumilivu wa Bwana wetu kuwa wokovu[a], kama vile ndugu yetu mpendwa Paulo pia alivyowaandikia kulingana na hekima aliyopewa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “subira”; maana ni kwamba kuchelewa kwa Bwana kunalenga wokovu, wala si kutojali.
    reason: lexical_alternative
  - marker: b
    text: Usemi “hekima aliyopewa” huenda unamaanisha hekima aliyopewa na Mungu, ingawa Kigiriki hakimtaji wazi mtoaji.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: uvumilivu
  rationale: Neno hili linaonyesha kujizuia kwa subira, hasa kuchelewa kutoa hukumu. “Uvumilivu” ni la kawaida na la heshima katika Kiswahili, nalo linafaa katika muktadha wa kuchelewa kwa kuja kwa Bwana.
- source_word: σωτηρίαν
  choice: wokovu
  rationale: Katika muktadha huu wa mwisho wa nyakati, neno hili linaonyesha kusudi la Mungu la kuokoa kupitia kucheleweshwa kwa hukumu; “wokovu” huhifadhi uzito wake wa kiteolojia.
- source_word: ἡγεῖσθε
  choice: hesabuni ... kuwa
  rationale: Amri hii inawataka wasomaji wakadirie au waone jambo kwa namna fulani. Muundo “hesabuni ... kuwa” unaonyesha wazi uhusiano wa kihabari kati ya uvumilivu na wokovu.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ni jina la heshima linalomrejelea Yesu katika muktadha huu; “Bwana wetu” huhifadhi maana na uzito wa cheo hicho.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: ndugu yetu mpendwa
  rationale: Muundo huu unaonyesha upendo wa karibu kwa Paulo na kudumisha maana ya ἀγαπητός kwa Kiswahili cha asili.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: kwa hekima aliyopewa
  rationale: κατά hapa huonyesha kwamba kuandika kwa Paulo kulipatana na hekima aliyopewa. Kauli tendwa imehifadhiwa bila kumtaja wazi mtoaji, kama ilivyo katika Kigiriki.
- source_word: ἔγραψεν ὑμῖν
  choice: alivyowaandikia
  rationale: Kitenzi cha wakati uliopita kimetafsiriwa kwa wakati uliopita, na kiambishi “-wa-” kinaonyesha kwamba Paulo aliwaandikia wasomaji hao.
- source_word: καθὼς καὶ
  choice: kama vile ... pia
  rationale: Muundo huu huhifadhi ulinganisho pamoja na maana ya nyongeza iliyomo katika καθὼς καὶ.
theological_decisions:
- issue: Mtendaji asiyetajwa katika usemi “hekima aliyopewa”
  choice: Kudumisha kauli tendwa “aliyopewa” bila kuongeza “na Mungu” katika matini kuu.
  alternative: kwa hekima ambayo Mungu alimpa
  rationale: Muktadha huenda unadokeza kwamba Mungu ndiye mtoaji, lakini Kigiriki hakimtaji wazi; hivyo tafsiri haifafanui kimadhehebu au kiufafanuzi jambo lililoachwa bila kutajwa.
- issue: Maana ya kuchelewa kwa hatua ya Bwana
  choice: Kutafsiri μακροθυμία kama “uvumilivu” na σωτηρία kama “wokovu,” na kuhifadhi usemi wa moja kwa moja “kuwa wokovu.”
  alternative: ustahimilivu ... nafasi ya kupata wokovu
  rationale: Mstari hautaji tu fursa ya wokovu bali unawaagiza wasomaji waione subira ya Bwana kwa uhusiano wa moja kwa moja na wokovu. Tafsiri haipanui maana hiyo kwa maelezo yasiyomo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hesabuni ... kuwa” ni muundo wa kibiblia unaoeleweka na unaohifadhi uhusiano wa moja kwa moja katika Kigiriki; “uvumilivu” na “wokovu” ni maneno ya kawaida yenye uzito unaofaa. Alama zote za tanbihi zimewekwa katika matini kuu.
