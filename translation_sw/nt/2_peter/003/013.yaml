  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: sw
  text: Lakini, kulingana na ahadi yake, tunangojea mbingu mpya na dunia mpya, ambamo uadilifu[a] unakaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “haki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: mbingu mpya na dunia mpya
  rationale: «Mpya» huhifadhi maana ya καινός bila kuamua kimbele ikiwa uumbaji utabadilishwa kabisa au utafanywa upya. «Mbingu» na «dunia» huhifadhi lugha ya kibiblia yenye upeo wa uumbaji wote.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti nyepesi kati ya kuangamia kwa hali ya sasa iliyotajwa kabla na tumaini linalofuata.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: kulingana na ahadi yake
  rationale: κατά pamoja na hali ya kushutumiwa huonyesha kupatana na jambo fulani; kirai hiki cha Kiswahili ni cha kawaida na kinahifadhi wazi rejeo la ahadi ya Mungu.
- source_word: προσδοκῶμεν
  choice: tunazingojea
  rationale: Wakati wa sasa unaonyesha kungoja kunakoendelea kwa matarajio. Kiambishi «-zi-» kinarejelea kwa pamoja mbingu mpya na dunia mpya.
- source_word: ἐν οἷς
  choice: ambamo
  rationale: Neno hili linarejelea makao mapya yanayoundwa na mbingu mpya na dunia mpya kwa pamoja, bila kulazimisha upatanisho wa idadi usio wa kawaida katika Kiswahili.
- source_word: δικαιοσύνη
  choice: uadilifu
  rationale: «Uadilifu» huhifadhi maana pana ya kuwa sawa kimaadili na mbele za Mungu. «Haki» pia inawezekana, hasa kwa maana ya utendaji wa haki, na imehifadhiwa katika tanbihi.
- source_word: κατοικεῖ
  choice: unakaa
  rationale: «Unakaa» hutoa picha ya kudumu ya κατοικέω kwa lugha rahisi na yenye heshima, badala ya kueleza tu kuwa uadilifu upo.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika uumbaji mpya
  choice: uadilifu
  alternative: haki
  rationale: «Uadilifu» hudumisha upana wa hali na mwenendo ulio sawa mbele za Mungu, huku «haki» ikiweza kusisitiza zaidi hukumu au mpangilio wa kijamii ulio sawa. Tanbihi inahifadhi uwezekano huo wa pili bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi taswira ya kibiblia ya mbingu na dunia mpya. Alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja.
