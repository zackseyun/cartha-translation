id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: sw
  text: Wapendwa, hii ndiyo barua ya pili ninayowaandikia sasa. Katika barua zote mbili[a], ninaamsha fikira zenu zilizo nyofu[b] kwa kuwakumbusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hizo”; Kigiriki ni cha wingi na kwa kawaida zaidi kinarejelea barua zote mbili.
    reason: alternative_reading
  - marker: b
    text: Au, “fikira zenu safi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Wapendwa
  rationale: Neno hili la kuwaita wasomaji linaonyesha upendo wa karibu na uzito wa kiroho, huku likibaki la kawaida na lenye heshima katika Kiswahili.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: hii sasa ni barua ya pili
  rationale: Muundo huu wa Kiswahili ni wa asili na unadumisha msisitizo kwamba maandishi haya ndiyo barua ya pili kwa wasomaji.
- source_word: γράφω
  choice: ninayowaandikia
  rationale: Kauli ya sasa inaonyesha kitendo cha mwandishi kinachoendelea, na kiambishi -wa- kinawakilisha wazi wapokeaji.
- source_word: ἐν αἷς
  choice: Katika barua zote mbili
  rationale: Kiwakilishi cha Kigiriki ni cha wingi wa kike na kwa kawaida kinarejelea barua hizo mbili; kutaja barua zote mbili kunafanya uhusiano huo uwe wazi katika Kiswahili.
- source_word: διεγείρω
  choice: ninaziamsha
  rationale: Kitenzi hiki hubeba picha ya kuamsha au kuchochea kutoka hali ya kutotenda; “ninaziamsha” kinahifadhi sitiari hiyo bila kuongeza maana nyingine.
- source_word: ἐν ὑπομνήσει
  choice: kwa kuwakumbusha
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha kwamba ukumbusho ndio njia ambayo mwandishi anatumia kuziamsha akili zao.
- source_word: εἰλικρινῆ διάνοιαν
  choice: akili zenu zilizo nyofu
  rationale: “Akili” linaonyesha uwezo wa kufikiri, na “zilizo nyofu” linadumisha wazo la uaminifu, usafi, au kutokuwa na hila bila kulifafanua kupita kiasi.
- source_word: ὑμῶν
  choice: zenu
  rationale: Kiwakilishi hiki cha umilikishi kinaonyesha kwamba akili zinazotajwa ni za wasomaji walio wengi.
theological_decisions:
- issue: Kirejeleo cha kiwakilishi cha wingi ἐν αἷς
  choice: Kinarejelea barua zote mbili ambazo Petro amewaandikia wasomaji.
  alternative: Huenda kikarejelea barua ya sasa peke yake kwa matumizi yasiyo makali ya wingi.
  rationale: Sarufi ya kawaida zaidi inaunganisha kiwakilishi hiki cha wingi na barua mbili zinazotajwa. Tafsiri kuu inafuata maana hiyo huku tanbihi ikihifadhi umbo la karibu zaidi na Kigiriki.
- issue: Maana ya εἰλικρινῆ katika εἰλικρινῆ διάνοιαν
  choice: nyofu
  alternative: safi
  rationale: Neno la Kigiriki linaweza kueleza unyofu au usafi. “Nyofu” linafaa kwa hali ya kweli ya kufikiri, huku “safi” likihifadhiwa katika tanbihi kama uwezekano halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa kwa mtiririko wa asili wa Kiswahili, bila kupoteza uhusiano wa kimantiki wa sentensi moja ya Kigiriki.
