  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: sw
  text: Kwa hiyo, wapendwa, kwa kuwa mnangojea mambo haya, fanyeni bidii ili mpatikane na yeye bila doa wala lawama, katika amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpatikane mbele zake bila doa wala lawama, katika amani.” Katika Kigiriki, dative hapa inaweza kueleweka kuwa ya mtendaji (“na yeye”) au ya rejeleo/uwepo (“mbele zake”).
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho kutokana na maelezo yaliyotangulia kuhusu siku ya Bwana na mbingu mpya na dunia mpya.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wa upendo kwa wingi, unaohifadhi ukaribu na hadhi ya lugha ya waraka.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Hurejelea mambo ya wakati ujao yaliyoelezwa kabla bila kuyafafanua kupita kiasi.
- source_word: προσδοκῶντες
  choice: kwa kuwa mnangojea
  rationale: Huwasilisha matarajio yanayoendelea na uhusiano wake wa kimantiki na agizo linalofuata.
- source_word: σπουδάσατε
  choice: jitahidini sana
  rationale: Hutoa maana ya kufanya juhudi kwa bidii, kwa lugha ya kawaida na yenye nguvu.
- source_word: ἄσπιλοι
  choice: bila doa
  rationale: Hudumisha taswira ya kutokuwa na waa au uchafu wa kimaadili.
- source_word: ἀμώμητοι
  choice: bila lawama
  rationale: Huonyesha uadilifu usiotoa msingi wa kulaumiwa, huku ukitofautishwa kwa kiasi na taswira ya 'bila doa.'
- source_word: αὐτῷ
  choice: naye
  rationale: Katika muundo 'mkutwe naye,' kiwakilishi kinaweza kueleweka kuwa ndiye anayewakuta au kuwachunguza; mhusika wa kimungu habainishwi zaidi ya Kigiriki.
- source_word: εὑρεθῆναι
  choice: ili mkutwe
  rationale: Huhifadhi hali ya kutendwa na lengo la juhudi hizo katika tathmini inayotarajiwa.
- source_word: ἐν εἰρήνῃ
  choice: katika amani
  rationale: Ni tafsiri iliyo karibu na Kigiriki na huacha wazi ikiwa amani hiyo ni hali ya ndani, uhusiano uliopatanishwa, au amani ya kijumuiya.
theological_decisions:
- issue: Maana ya dative αὐτῷ katika mazingira ya mwisho wa nyakati
  choice: mkutwe naye
  alternative: mkutwe mbele zake
  rationale: Dative inaweza kuonyesha mtendaji, yaani 'naye,' au rejeleo/uwepo, yaani 'mbele zake.' Maandishi makuu yanachagua uwezekano wa mtendaji, huku tanbihi ikihifadhi utata halisi.
- issue: Mhusika anayerejelewa na αὐτῷ
  choice: Kiwakilishi 'naye' kimeachwa bila kutaja jina
  alternative: mkutwe na Bwana / na Mungu
  rationale: Muktadha unaelekeza kwa mhusika wa kimungu, lakini mstari wenyewe haurudii nomino; hivyo tafsiri haiongezi utambulisho ulio wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wapendwa' hudumisha sauti ya kichungaji; 'jitahidini sana' ni wazi kwa wasomaji wa kawaida. Koma kabla ya 'katika amani' husaidia kuonyesha kuwa kirai hicho kinaweza kueleza hali ya jumla ambamo waumini wakutwe, bila kukifungamanisha kwa lazima na 'bila lawama' pekee.
