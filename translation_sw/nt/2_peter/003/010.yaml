  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: sw
  text: Lakini siku ya Bwana itakuja kama mwizi; siku hiyo mbingu zitapita kwa mngurumo, nazo elementi[a], zikiungua, zitasambaratishwa; dunia na kazi zilizomo ndani yake zitapatikana[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miili ya mbinguni.” Neno la Kigiriki στοιχεῖα linaweza kumaanisha kwa namna maalumu zaidi vijenzi vya ulimwengu katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Wengine huelewa “zitapatikana” kuwa na maana ya “zitafichuliwa” au “zitawekwa wazi.”
    reason: alternative_reading
  - marker: c
    text: Nakala nyingi za kale zinasema “zitateketezwa kabisa” badala ya “zitapatikana.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: itakuja
  rationale: Kitenzi cha wakati ujao kina maana ya kuja au kufika; “itakuja” ni lugha ya kawaida na inafaa kwa “siku ya Bwana.”
- source_word: ἡμέρα κυρίου
  choice: siku ya Bwana
  rationale: Hili ni tamko la kieskatolojia linalotumiwa katika unabii na maandiko ya mitume, wala si jina la siku ya ibada ya kila juma.
- source_word: κλέπτης
  choice: mwizi
  rationale: Taswira inasisitiza kuja kusikotarajiwa; “mwizi” ndilo neno la kawaida na lenye mwangwi wa kibiblia.
- source_word: ἐν ᾗ
  choice: Katika siku hiyo
  rationale: Usemi huu unaunganisha matukio ya ulimwengu na siku iliyotajwa; umbo hili ni la asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: οἱ οὐρανοὶ
  choice: mbingu
  rationale: “Mbingu” huhifadhi wigo wa ulimwengu mzima na matumizi ya wingi yaliyomo katika Kigiriki.
- source_word: ῥοιζηδόν
  choice: kwa mngurumo
  rationale: Kielezi hiki huonyesha sauti kubwa ya kuvuma, kukimbia kwa kasi, au kunguruma; “kwa mngurumo” ni fasaha na yenye uzito unaofaa.
- source_word: παρελεύσονται
  choice: zitapita
  rationale: Katika muktadha huu kitenzi kina maana ya kupita au kutoweka; “zitapita” huhifadhi picha na mwangwi wa maandiko mengine bila kuifafanua kupita kiasi.
- source_word: στοιχεῖα
  choice: elementi
  rationale: Neno linaweza kumaanisha vijenzi vya msingi vya ulimwengu au miili ya mbinguni. “Elementi” hudumisha upana huo, huku uwezekano maalumu ukielezwa katika tanbihi.
- source_word: καυσούμενα
  choice: zikiungua
  rationale: Hii huonyesha hali au mchakato wa kuungua unaoandamana na kusambaratishwa, bila kutaja mtendaji ambaye Kigiriki hakimsemi.
- source_word: λυθήσεται
  choice: zitasambaratishwa
  rationale: Hapa λύω ina wazo la kufunguliwa, kuvunjika, au kutenganishwa vipande. “Zitasambaratishwa” huepuka wazo finyu la kuyeyuka pekee na pia haiongezi maana pana ya kuangamizwa kabisa.
- source_word: γῆ
  choice: dunia
  rationale: Kwa kuwa muktadha unahusu mbingu na elementi, “dunia” inafaa kuliko “nchi” au eneo maalumu.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: kazi zilizomo ndani yake
  rationale: “Kazi” huacha wazi ikiwa rejeo ni matendo ya wanadamu au yale yaliyofanyika na yaliyopo duniani, kama ilivyo katika usemi wa Kigiriki.
- source_word: εὑρεθήσεται
  choice: zitapatikana
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi katika maandishi yaliyotolewa. Tafsiri hii huhifadhi ugumu wa kishazi badala ya kuamua kimya-kimya kwamba kinamaanisha kufichuliwa au kuteketezwa.
theological_decisions:
- issue: Maana ya kishazi cha mwisho καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: “dunia na kazi zilizomo ndani yake zitapatikana” imehifadhiwa katika matini kuu.
  alternative: “zitafichuliwa” au “zitateketezwa kabisa”
  rationale: Maandishi yaliyotolewa yana εὑρεθήσεται, ambayo kwa maana ya moja kwa moja ni “itapatikana/zitapatikana.” Kwa kuwa kishazi hiki kina utata wa kimatini na wa kifasiri, tafsiri haiingizi suluhisho la kiteolojia lisilo wazi.
- issue: Rejeo la στοιχεῖα
  choice: elementi
  alternative: miili ya mbinguni; vijenzi vya msingi vya ulimwengu
  rationale: Muktadha hauthibitishi bila shaka iwapo neno linamaanisha miili ya mbinguni au vijenzi vya msingi vya ulimwengu. Neno pana limehifadhiwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Mngurumo” hudumisha nguvu ya taswira; “zitasambaratishwa” huwasilisha kuvunjwa kwa vijenzi bila kuifanya tafsiri iwe ya kisayansi kupita kiasi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
