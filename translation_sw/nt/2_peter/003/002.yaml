  terminology: «Manabii watakatifu», «amri», «Bwana», na «Mwokozi» zinafaa kwa rejista ya maandiko na ni thabiti kwa istilahi za kifungu. Hakuna haja ya kuongeza «wetu» au jina lisilopo katika maandishi ya Kigiriki.
