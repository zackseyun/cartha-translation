id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: sw
  text: mpate kukumbuka maneno yaliyosemwa hapo awali na manabii watakatifu, na amri ya Bwana na Mwokozi iliyotolewa kupitia mitume wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na amri ya mitume wenu kutoka kwa Bwana na Mwokozi.” Muundo wa vimilikishi katika Kigiriki unaweza kuwakilishwa kwa zaidi ya njia moja ya asili katika Kiswahili.
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: mpate kukumbuka
  rationale: Infinitivu hii inaendeleza kusudi lililoanza katika mstari wa 1. Kiswahili hutumia kwa asili kishazi cha kusudi, “mpate kukumbuka,” badala ya infinitivu iliyotengwa.
- source_word: προειρημένων ῥημάτων
  choice: maneno yaliyosemwa hapo awali
  rationale: Huhifadhi wazo la maneno kusemwa kabla bila kuyafanya lazima kuwa unabii wa matukio yajayo.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: na manabii watakatifu
  rationale: Katika kishazi tendwa, “na” hutambulisha watendaji kwa Kiswahili cha kawaida; “manabii watakatifu” huhifadhi sifa yao.
- source_word: ἐντολῆς
  choice: amri
  rationale: “Amri” ni neno la kawaida, lenye mamlaka, na huhifadhi umoja wa nomino ya Kigiriki.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: kupitia mitume wenu
  rationale: Huhifadhi uhusiano wa ὑμῶν na mitume na kueleza kwa Kiswahili asilia jukumu lao la kuifikisha amri.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: ya Bwana na Mwokozi
  rationale: Genitivi imeunganishwa na “amri,” ikionyesha kuwa amri hiyo inatoka kwa au ni ya Bwana na Mwokozi; vyeo vyote viwili vinahifadhiwa bila kuongeza “wetu.”
theological_decisions:
- issue: Uhusiano wa ὑμῶν katika τῶν ἀποστόλων ὑμῶν
  choice: “wenu” inafafanua “mitume”
  alternative: “amri mliyopewa na mitume”
  rationale: Mpangilio wa Kigiriki unaunganisha ὑμῶν kwa kawaida na ἀποστόλων. Tafsiri “mitume wenu” huhifadhi uhusiano huo bila kudokeza umiliki halisi.
- issue: Uhusiano wa τοῦ κυρίου καὶ σωτῆρος
  choice: Amri ni ya/inatoka kwa Bwana na Mwokozi na imefikishwa kupitia mitume
  alternative: Mitume wanaelezwa kuwa wa Bwana na Mwokozi
  rationale: 'Kuunganisha genitivi hii na ἐντολῆς kunatoa mfuatano wenye maana: maneno ya manabii na amri ya Bwana na Mwokozi iliyofikishwa na mitume. Hata hivyo, muundo wa Kigiriki unaweza kuwakilishwa kwa namna nyingine, kwa hiyo dokezo linahifadhi utata huo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hapo awali” huepuka maana finyu ya kutabiri. Dokezo moja tu limetumika kwa sababu mbadala wa kileksika unaweza kuwakilishwa moja kwa moja na maandishi bila kuhitaji dokezo tofauti.
