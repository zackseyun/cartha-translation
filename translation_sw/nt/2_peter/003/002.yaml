  source_fidelity: Tafsiri inawakilisha vizuri kusudi la μνησθῆναι, kipaumbele cha wakati katika προειρημένων, umoja wenye mamlaka wa ἐντολῆς, na vyeo «Bwana na Mwokozi». Hata hivyo, «iliyowafikia kupitia mitume wenu» huongeza wazo la amri kuwafikia wasomaji na huifanya mitume hasa wapokezi/wapitishaji wa tukio hilo; Kigiriki kinawaweka katika uhusiano wa kijeni na amri. «Iliyotolewa kupitia mitume wenu» huwasilisha kwa uwazi zaidi upatanishi wa kitume unaodokezwa na uchanganuzi uliokusudiwa, bila kudokeza kwamba amri iliwafikia wasomaji kwa tukio fulani.
