  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: sw
  text: Kwa kuwa vitu hivi vyote vinavunjwa kwa namna hii[a], mnapaswa kuwa watu wa namna gani katika mwenendo mtakatifu na uchaji wa Mungu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vinaangamizwa”; Kigiriki kwa maana ya karibu zaidi husema kwamba vitu hivi “vinavunjwa” au “vinatenguliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: vitu hivi vyote
  rationale: Kirai hiki kinarejelea vitu vya uumbaji vilivyotajwa katika muktadha uliotangulia. Neno “vitu” linaweka wazi rejeleo linalodokezwa katika Kigiriki.
- source_word: οὕτως
  choice: kwa namna hii
  rationale: Tafsiri hii inaonyesha jinsi kuvunjwa huko kunavyotokea na ni ya kawaida katika Kiswahili cha sasa.
- source_word: λυομένων
  choice: vinavunjwa
  rationale: Kitenzi λύω hapa kina wazo la kulegezwa, kutenganishwa, au kuvunjwa kwa utaratibu uliopo. “Vinavunjwa” kinahifadhi picha hiyo bila kutumia moja kwa moja neno lenye nguvu zaidi, “vinaangamizwa.”
- source_word: ποταποὺς
  choice: watu wa namna gani
  rationale: Katika swali hili la balagha, neno hilo linauliza kuhusu sifa au aina ya watu wanaopaswa kuwa.
- source_word: δεῖ
  choice: mnapaswa
  rationale: Neno hili linaeleza ulazima wa kimaadili. “Mnapaswa” ni la kawaida na lenye uzito unaofaa katika himizo.
- source_word: ὑπάρχειν
  choice: kuwa
  rationale: Pamoja na δεῖ na ὑμᾶς, kitenzi hiki kinaeleza hali au tabia wanayopaswa kuwa nayo; “kuwa” ni tafsiri ya asili katika Kiswahili.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: katika mwenendo mtakatifu
  rationale: ἀναστροφή hueleza mwenendo au namna ya kuishi. Umoja wa ujumla “mwenendo” ni wa asili katika Kiswahili huku ukihifadhi msisitizo wa kimaadili.
- source_word: εὐσεβείαις
  choice: uchaji wa Mungu
  rationale: εὐσέβεια hueleza kumheshimu Mungu kwa moyo na kwa maisha. “Uchaji wa Mungu” ni wazi, wa heshima, na unaeleweka kwa wasomaji wa kawaida.
theological_decisions:
- issue: Maelezo ya hatima ya ulimwengu wakati wa mwisho
  choice: vinavunjwa
  alternative: vinaangamizwa
  rationale: Kigiriki kinaeleza kulegezwa au kuvunjwa kwa vitu hivi. Tafsiri haiongezi wazo la kuangamizwa kabisa ambalo neno lenyewe halilazimishi, hivyo inaacha wazi upeo kamili wa tukio hilo.
- issue: Nguvu ya swali la balagha
  choice: Alama ya mshangao baada ya “watu wa namna gani” na maelezo yanayofuata
  alternative: Alama ya kuuliza
  rationale: Muundo wa Kigiriki ni swali la balagha lenye nguvu ya himizo. Alama ya mshangao huonyesha uzito wa mwito huo bila kubadili maana yake kuwa kauli ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa swali la balagha umehifadhiwa, na msamiati hauegemei istilahi za dhehebu fulani.
