id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: sw
  text: Lakini endeleeni kukua katika neema na katika kumjua Bwana na Mwokozi wetu Yesu Masihi.[a] Utukufu ni wake sasa na hata siku ya milele.[b] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna iliyozoeleka, “Yesu Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au “sasa na milele.” Kigiriki kinasema kihalisi zaidi, “sasa na hata siku ya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: kueni
  rationale: Kitenzi cha kuamuru katika wakati wa sasa, wingi; “kueni” ni cha asili katika Kiswahili na katika muktadha kinaonyesha mwendelezo wa kukua bila kuongeza ufafanuzi usiokuwamo.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofautishaji mpole na maonyo yaliyotangulia; “Lakini” huhifadhi uhusiano huo.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: katika neema na katika kumjua
  rationale: “Katika” huonyesha eneo au hali ambamo ukuaji unatokea. Kurudia kihusishi kunafanya uhusiano wa vipengele viwili uwe wazi na wa kawaida kwa Kiswahili.
- source_word: χάριτι
  choice: neema
  rationale: “Neema” ni istilahi ya kawaida, sahihi, na inayoeleweka kwa maana ya χάρις katika Agano Jipya.
- source_word: γνώσει
  choice: kumjua
  rationale: Kwa kuwa kirai cha Kigiriki kinaelekezwa kwa mtu, Yesu, “kumjua” ni cha kawaida zaidi kuliko nomino “maarifa” na huhifadhi maana ya ujuzi unaomhusu yeye bila kuufanya kuwa habari za kiakili tu.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Bwana na Mwokozi wetu Yesu, Masihi
  rationale: Kifungu kimoja cha Kigiriki kinaunganisha vyeo vyote viwili kwa mtu mmoja. “Bwana” na “Mwokozi” ni tafsiri za kawaida; “Masihi” hutafsiri cheo Χριστός badala ya kukinakili tu.
- source_word: αὐτῷ ἡ δόξα
  choice: Utukufu ni wake
  rationale: Kigiriki hakitaji kitenzi; sentensi hii ya Kiswahili ni ya asili na yenye hadhi, na huhifadhi tamko la kwamba utukufu ni wake.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: sasa na hata siku ya milele
  rationale: “Sasa” huakisi νῦν, na “siku ya milele” huhifadhi neno lisilo la kawaida ἡμέραν pamoja na αἰῶνος badala ya kulisawazisha moja kwa moja kuwa “milele.” “Hata” huwasilisha mwendo wa kufikia wakati huo.
- source_word: ἀμήν
  choice: Amina
  rationale: Hii ndiyo namna iliyozoeleka ya neno hili katika Kiswahili cha kibiblia na cha ibada.
theological_decisions:
- issue: Maana ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu, Masihi
  alternative: Yesu Kristo
  rationale: Χριστός ni cheo chenye maana ya Masihi. Tafsiri kuu huonyesha maana ya cheo hicho; namna ya jadi “Yesu Kristo” imewekwa katika tanbihi.
- issue: Marejeo ya “Bwana na Mwokozi wetu”
  choice: Vyeo vyote viwili vinamhusu mtu mmoja, Yesu, Masihi
  alternative: Kutoa maneno hayo kwa namna isiyoonyesha wazi kama yana rejeo moja
  rationale: Kifungu kimoja cha Kigiriki kinatawala κύριος na σωτήρ, hivyo kwa kawaida vyeo vyote viwili humrejelea mtu yuleyule.
- issue: Utukufu unaotajwa katika doksolojia
  choice: Utukufu unasemwa kuwa wa Yesu, Masihi
  alternative: Kuacha kiwakilishi bila kurejelea wazi kilichotangulia
  rationale: αὐτῷ humrejelea kwa kawaida mtu aliyetajwa mara moja kabla, Yesu Kristo; tafsiri haisemi zaidi ya uhusiano huo wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kueni” na “kumjua” ni vya asili kuliko miundo mizito ya kinomino; “siku ya milele” imehifadhiwa kwa sababu ya upekee wa usemi wa Kigiriki.
