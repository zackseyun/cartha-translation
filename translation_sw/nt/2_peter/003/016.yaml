  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: sw
  text: Kama asemavyo pia katika barua zake zote, akizungumzia humo mambo haya. Katika barua hizo kuna mambo fulani yaliyo magumu kuelewa. Watu wasio na ujuzi[a] na wasio imara huyapotosha[b], kama wanavyoyapotosha pia Maandiko mengine[c], na hivyo kujiletea wenyewe maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiofundishwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “huyapinda.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Maandiko yaliyobaki.” Neno la Kigiriki linaweza kumaanisha Maandiko “mengine” au “yaliyobaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: barua
  rationale: ‘Barua’ ni neno la kawaida na la sasa kwa mawasiliano yaliyoandikwa, bila kutumia istilahi ya kale isiyo ya lazima.
- source_word: λαλῶν
  choice: akizungumzia
  rationale: Katika muktadha wa barua, kitenzi hiki kinaeleza Paulo anavyonena kuhusu mambo hayo kupitia maandishi yake; ‘akizungumzia’ ni cha asili katika Kiswahili bila kubadili wazo kuwa ‘akiandika.’
- source_word: περὶ τούτων
  choice: mambo haya
  rationale: Huhifadhi rejeo la moja kwa moja kwa mambo yaliyotangulia kutajwa katika muktadha.
- source_word: δυσνόητά τινα
  choice: mambo fulani yaliyo magumu kuelewa
  rationale: Huhifadhi maana ya kutokutajwa kwa uhakika katika τινα na ugumu wa kuelewa katika δυσνόητα kwa lugha wazi.
- source_word: ἀμαθεῖς
  choice: wasio na ujuzi
  rationale: Hueleza ukosefu wa maarifa au ufahamu bila kudokeza moja kwa moja kwamba watu hao hawajui kusoma na kuandika; ‘wasiofundishwa’ pia inawezekana.
- source_word: ἀστήρικτοι
  choice: wasio imara
  rationale: Huwasilisha hali ya kutokuwa thabiti au kutokuthibitishwa, bila kuibana maana kuwa ya kiakili au kimaadili pekee.
- source_word: στρεβλοῦσιν
  choice: huyapotosha
  rationale: Neno hili la kawaida linaonyesha kuyageuza mambo kutoka maana au umbo lake sahihi; ‘huyapinda’ lingehifadhi zaidi taswira halisi.
- source_word: τὰς λοιπὰς γραφὰς
  choice: Maandiko mengine
  rationale: ‘Maandiko’ huhifadhi matumizi ya γραφαί kwa maandiko matakatifu, na ‘mengine’ huacha wazi wigo wa λοιπάς huku ikidumisha ulinganisho na barua za Paulo.
- source_word: ἀπώλειαν
  choice: maangamizi
  rationale: Huwasilisha matokeo mazito ya ἀπώλεια bila kuingiza istilahi maalumu ya kimadhehebu.
theological_decisions:
- issue: Dokezo la hadhi ya Maandiko katika τὰς λοιπὰς γραφὰς
  choice: Maandiko mengine
  alternative: maandishi mengine
  rationale: Katika Agano Jipya, γραφαί kwa kawaida humaanisha Maandiko matakatifu, si maandishi ya kawaida. Tafsiri hii huhifadhi ulinganisho wa barua za Paulo na Maandiko mengine bila kuongeza dai la kiteolojia lisilosemwa na kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Sentensi ndefu ya Kigiriki imegawanywa ili iwe rahisi kusomeka, huku uhusiano wa mawazo na uzito wa onyo vikihifadhiwa.
