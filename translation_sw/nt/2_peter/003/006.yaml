translation:
  language: sw
  text: Kwa hayo[a], ulimwengu wa wakati huo uligharikishwa kwa maji, ukaangamia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa njia ya hayo”; wingi wa “hayo” unarejelea njia zilizotajwa katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “ukaharibiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Kwa njia ya hayo
  rationale: διά pamoja na umilikishi huonyesha njia au chombo. Kiwakilishi cha wingi “hayo” kinadumisha wingi wa Kigiriki na kuacha wazi kwa kiasi fulani kinachorejelewa katika mstari uliotangulia.
- source_word: ὁ τότε κόσμος
  choice: ulimwengu wa wakati ule
  rationale: Usemi huu unaonyesha ulimwengu kama ulivyokuwako wakati huo na kuutofautisha na ulimwengu wa sasa katika muktadha. Tafsiri hii ni ya kawaida na haisemi kwamba ni sayari peke yake.
- source_word: ὕδατι
  choice: kwa maji
  rationale: Hali ya utoaji katika Kigiriki hapa inaonyesha chombo au njia ambayo gharika ilitokea. “Kwa maji” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: κατακλυσθεὶς
  choice: uligharikishwa
  rationale: Kitenzi hiki ni kauli tendwa na kinaonyesha kufunikwa au kugubikwa na gharika. Muundo wa Kiswahili unahifadhi kwamba ulimwengu ulipatwa na tendo hilo kabla ya matokeo yanayotajwa na kitenzi kikuu.
- source_word: ἀπώλετο
  choice: ukaangamia
  rationale: Kitenzi kinaweza kumaanisha kuangamia au kuharibiwa. “Ukaangamia” kinahifadhi nguvu ya kauli isiyoelekeza tendo kwa kitu na hakilazimishi wazo la kufutwa kabisa.
theological_decisions:
- issue: Asili ya hukumu ya gharika
  choice: ukaangamia
  alternative: ukaharibiwa
  rationale: Kigiriki kinaeleza hukumu kubwa juu ya ulimwengu wa wakati wa Noa bila kulazimisha dai la kuondolewa kabisa kwa kila kitu. “Ukaangamia” kinadumisha uzito wa hukumu na pia upana wa maana ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Uligharikishwa” ni neno la kibiblia linalotambulika na linaonyesha wazi tendo la kufunikwa na maji; “ukaangamia” huendeleza mfuatano wa matukio kwa njia ya kawaida ya Kiswahili.
