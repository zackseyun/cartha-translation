id: MAT.21.35
reference: Matthew 21:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
translation:
  language: sw
  text: Nao wale wakulima wapangaji wakawakamata watumwa wake[a]; mmoja wakampiga, mwingine wakamuua, na mwingine wakampiga kwa mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi.” Neno la Kigiriki douloi linaweza kumaanisha “watumwa” au “watumishi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: wakulima wapangaji
  rationale: Katika muktadha wa mfano, hawa ni wakulima waliokodishwa kulilima shamba la mwenye mali. Kauli hii inaonyesha kazi yao ya kilimo pamoja na uhusiano wao wa upangaji.
- source_word: λαβόντες
  choice: wakawakamata
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia matendo mengine. “Wakawakamata” ni Kiswahili cha kawaida na kinaonyesha kuwachukua kwa nguvu katika muktadha huu bila kuongeza maelezo yasiyokuwamo.
- source_word: δούλους
  choice: watumwa
  rationale: “Watumwa” hudumisha maana ya msingi ya δοῦλοι na hali yao ya kuwa chini ya mamlaka ya mwenye shamba. Uwezekano wa kutafsiri “watumishi” umehifadhiwa katika tanbihi.
- source_word: ἔδειραν
  choice: wakampiga
  rationale: Neno hilo lina maana ya kupiga au kuchapa. “Wakampiga” ni la kawaida na halibainishi isivyofaa njia maalumu ya kipigo.
- source_word: ἀπέκτειναν
  choice: wakamuua
  rationale: Hii inatoa moja kwa moja maana ya kumuua bila kuongeza wazo mahususi la hukumu rasmi au istilahi ya kisheria.
- source_word: ἐλιθοβόλησαν
  choice: wakampiga kwa mawe
  rationale: Kiswahili hiki kinaeleza wazi shambulio la kutumia mawe na ni cha kawaida kuliko muundo unaoweza kusikika kuwa wa kizamani.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: mmoja ... mwingine ... mwingine
  rationale: Muundo huu wa kugawanya unaonyesha wazi kwamba kila mtumwa alitendewa kwa njia tofauti.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika simulizi la mfano
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” huhifadhi hadhi ya kuwa chini ya mamlaka ya mwenye shamba, ilhali “watumishi” ni tafsiri halali inayoweza kufaa kwa kuzingatia kazi yao kama wajumbe. Tanbihi inalinda upana huu wa maana bila kuficha chaguo la matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi wenye kiambishi “waka-” unasimulia matendo kwa mtiririko wa kawaida, huku urudiaji wa “mmoja ... mwingine ... mwingine” ukihifadhi mpangilio wa Kigiriki.
