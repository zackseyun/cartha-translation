  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: sw
  text: Makuhani wakuu na Mafarisayo waliposikia mifano yake, walitambua kwamba alikuwa akisema kuwahusu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akisema juu yao.” Maana ni kwamba walitambua kuwa mifano hiyo iliwalenga. Tafsiri nyingine hufasiri kwa nguvu zaidi, “alikuwa akisema dhidi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Kirai cha wakati kinaonyesha tendo lililotangulia tendo kuu; ‘waliposikia’ ni Kiswahili cha kawaida na huhifadhi mfuatano huo.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wakuu wa kikuhani; halidokezi kwamba wote walikuwa wanashikilia cheo cha kuhani mkuu mmoja kwa wakati mmoja.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Jina la kundi la Kiyahudi limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: παραβολὰς
  choice: mifano
  rationale: ‘Mifano’ ni istilahi ya Kiswahili iliyozoeleka kwa mafundisho ya Yesu ya kifumbo na yenye ulinganisho.
- source_word: ἔγνωσαν
  choice: walitambua
  rationale: Katika muktadha huu kitenzi kinaeleza kufikia ufahamu au kutambua maana iliyowalenga, si kuwa na maarifa tu.
- source_word: περὶ αὐτῶν
  choice: habari zao
  rationale: Huhifadhi maana ya msingi ya ‘kuwahusu’ bila kuongeza maana yenye nguvu zaidi ya ‘dhidi yao.’
- source_word: λέγει
  choice: alikuwa akisema
  rationale: Kauli endelevu ya wakati uliopita ni ya asili katika taarifa isiyo ya moja kwa moja na huwasilisha vizuri hali ya kitenzi cha wakati wa sasa katika Kigiriki.
theological_decisions:
- issue: Iwapo kuweka wazi kwamba mifano ya Yesu ilikuwa ya kuwalaumu viongozi hao
  choice: alikuwa akisema habari zao
  alternative: alikuwa akisema dhidi yao
  rationale: Kigiriki kinasema kwamba Yesu alikuwa akisema ‘kuwahusu.’ Muktadha unaonyesha ukosoaji, lakini tafsiri kuu haipaswi kuingiza maana ya upinzani ambayo kihusishi chenyewe hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili huku ukihifadhi uhusiano wa wakati na kutokuweka wazi zaidi ya Kigiriki kuhusu ukali wa kauli.
