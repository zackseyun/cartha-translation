  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: sw
  text: 'Yesu akawaambia, “Je, hamjawahi kusoma katika Maandiko: ‘Jiwe walilolikataa waashi, hilo limekuwa jiwe kuu la pembe[a]. Hili limetoka kwa Bwana[b], nalo ni la ajabu machoni petu’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jiwe la kilele”; kihalisi, “kichwa cha pembe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “kutoka kwa Bwana”; chanzo cha Kiebrania cha nukuu hii kina “kutoka kwa BWANA” (YHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawaambia
  rationale: Ingawa Λέγει ni wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita; “akawaambia” ni ya asili na inaendeleza simulizi.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Je, hamjawahi kusoma
  rationale: Muundo huu unaonyesha swali la balagha lenye mkazo wa “kamwe,” na “hamjawahi” ni Kiswahili cha kawaida na cha wazi.
- source_word: ἐν ταῖς γραφαῖς
  choice: katika Maandiko
  rationale: Katika muktadha huu γραφαί ni maandiko matakatifu ya Israeli; “Maandiko” ni istilahi iliyo wazi na yenye hadhi.
- source_word: Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες
  choice: Jiwe walilolikataa waashi
  rationale: “Waashi” hutaja kwa ufupi watu wanaojenga kwa mawe, huku “walilolikataa” ikihifadhi wazo la kuliona jiwe kuwa halifai.
- source_word: οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: hilo limekuwa jiwe kuu la pembeni
  rationale: “Hilo” linahifadhi mkazo wa οὗτος, na “jiwe kuu la pembeni” linaeleza nafasi kuu ya jiwe bila kuamua kabisa kama ni jiwe la msingi au la juu.
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: Hili limetoka kwa Bwana
  rationale: παρά pamoja na jenitifu huonyesha chanzo; “limetoka kwa Bwana” hulihifadhi jambo hilo moja kwa moja badala ya kulibadili kuwa kauli ya mtendaji.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: ni la ajabu machoni petu
  rationale: Kauli hii ni ya asili katika Kiswahili, inadumisha taswira ya macho, na kuhifadhi hadhi ya nukuu ya Zaburi.
theological_decisions:
- issue: Utafsiri wa κύριος katika nukuu ya Zaburi
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κυρίου, kwa hiyo “Bwana” ndilo chaguo la moja kwa moja. Chanzo cha Kiebrania kina jina la Mungu YHWH; jambo hilo linaonyeshwa katika tanbihi bila kulazimisha tofauti ya chanzo kwenye matini kuu.
- issue: Matumizi ya kimasiha ya mfano wa jiwe
  choice: Kuacha mfano wa jiwe kama ulivyo bila ufafanuzi wa kitafsiri
  alternative: Kumtaja wazi Masihi kuwa ndiye jiwe
  rationale: Muktadha unaonyesha Yesu anavyotumia nukuu hiyo, lakini mstari wenyewe hautoi ufafanuzi wa moja kwa moja. Kutodokeza utambulisho ndani ya tafsiri kunahifadhi mvutano wa matini.
- issue: Maana ya κεφαλὴ γωνίας
  choice: jiwe kuu la pembeni
  alternative: jiwe la juu la pembeni
  rationale: Kirai kinaweza kueleweka kuhusu jiwe kuu la pembe na kimejadiliwa pia kama jiwe la juu. Matini kuu hutumia neno pana kiasi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo wa nukuu umehifadhiwa kwa mtiririko wa kawaida wa Kiswahili; taswira za jiwe, pembeni na macho hazijafafanuliwa kupita matini.
