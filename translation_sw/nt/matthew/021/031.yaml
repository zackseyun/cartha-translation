id: MAT.21.31
reference: Matthew 21:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: sw
  text: Ni yupi kati ya hao wawili aliyefanya mapenzi ya baba? Wakasema, “Yule wa kwanza.” Yesu akawaambia, “Kweli ninawaambia, watoza ushuru na makahaba wanawatangulia ninyi kuingia katika ufalme wa Mungu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaingia katika ufalme wa Mungu kabla yenu.” Kigiriki kinasema “wanawatangulia ninyi,” kikisisitiza kwamba wanawatangulia bila kulazimisha maana kwamba ninyi mtazuiwa kabisa kuingia.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Ni yupi kati ya hao wawili
  rationale: Usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuchagua mmoja kati ya wawili.
- source_word: ἐποίησεν
  choice: aliyefanya
  rationale: ‘Kufanya mapenzi’ ni muundo unaoeleweka na unaolingana kwa karibu na kitenzi ποιέω katika muktadha huu.
- source_word: τὸ θέλημα τοῦ πατρός
  choice: mapenzi ya baba
  rationale: Unahifadhi muundo wa Kigiriki na kumrejelea baba wa mfano bila kumtambulisha moja kwa moja kuwa Mungu wala kuongeza kimilikishi kisichotajwa wazi.
- source_word: Ὁ πρῶτος
  choice: Yule wa kwanza
  rationale: Jibu fupi na la kawaida linalokamilisha kwa uwazi usemi wa Kigiriki ulioacha nomino ikieleweka.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli ninawaambia
  rationale: Unawasilisha uzito wa kauli hii maalumu ya Yesu kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: τελῶναι
  choice: watoza ushuru
  rationale: Ni istilahi ya kawaida na sahihi kwa mawakala wa ukusanyaji wa kodi waliodharauliwa kijamii katika mazingira ya Injili.
- source_word: πόρναι
  choice: makahaba
  rationale: Ni neno mahususi, la kawaida na lisilo la kizamani kwa wanawake waliokuwa wakifanya ukahaba.
- source_word: προάγουσιν ὑμᾶς
  choice: wanakwenda mbele yenu
  rationale: Unahifadhi taswira ya kutangulia pamoja na hali ya sasa ya kitenzi, bila kutamka kwamba wasikilizaji wamefungiwa kabisa nje.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: kuingia katika ufalme wa Mungu
  rationale: ‘Kuingia katika’ huwasilisha mwelekeo wa εἰς kwa Kiswahili cha kawaida, huku ‘ufalme wa Mungu’ ukihifadhi istilahi kamili ya kiteolojia.
theological_decisions:
- issue: Nguvu ya προάγουσιν ὑμᾶς kuhusiana na kuingia katika ufalme
  choice: wanakwenda mbele yenu kuingia katika ufalme wa Mungu
  alternative: wanaingia katika ufalme wa Mungu kabla yenu
  rationale: Chaguo kuu linahifadhi taswira ya kutangulia na onyo kali la Yesu bila kuongeza dai kwamba viongozi hao wametengwa kabisa na ufalme. Chaguo mbadala linaeleza kwa uwazi zaidi wazo la kuingia kabla yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na taswira ya Kigiriki zimehifadhiwa pale zinapobaki za kawaida katika Kiswahili.
