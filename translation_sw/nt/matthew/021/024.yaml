base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: sw
  text: Lakini Yesu akawajibu, “Mimi pia nitawauliza swali moja. Mkinijibu, mimi pia nitawaambia ni kwa mamlaka gani ninafanya mambo haya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawajibu
  rationale: Muundo wa Kigiriki wenye kitenzi shirikishi ἀποκριθείς na εἶπεν ni njia ya kawaida ya kuanzisha jibu. Kiswahili cha masimulizi ‘akawajibu’ huunganisha maana hizo kwa ufasaha, huku ‘Lakini’ ikionyesha tofauti nyepesi katika majibizano.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα
  choice: Mimi pia nitawauliza swali moja
  rationale: Katika muktadha huu λόγον ἕνα inaashiria jambo moja la kuulizwa, yaani swali moja, wala si lazima ‘neno moja.’ ‘Mimi pia’ huhifadhi msisitizo wa κἀγώ na hali ya Yesu kujibu swali lao kwa swali.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Mkiniambia jibu lake
  rationale: Kigiriki kinasema kwa karibu zaidi ‘ambalo mkiniambia,’ lakini Kiswahili huhitaji kutaja ‘jibu lake’ ili uhusiano na ‘swali’ uwe wazi na wa kawaida. Sharti la ἐάν limehifadhiwa katika ‘Mki-’.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: mimi pia nitawaambia
  rationale: Chaguo hili linahifadhi ulinganifu wa κἀγώ katika sehemu zote mbili na makubaliano ya kurudishiana jibu.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ni kwa mamlaka gani
  rationale: ‘Kwa mamlaka gani’ ni Kiswahili cha kawaida kinachoeleza msingi au idhini ambayo mtu anatenda kwa kuitumia.
- source_word: ταῦτα ποιῶ
  choice: ninafanya mambo haya
  rationale: ‘Mambo haya’ huhifadhi wingi wa ταῦτα na kurejelea matendo ya Yesu yaliyokuwa yanahojiwa; wakati uliopo wa ποιῶ umeonyeshwa kwa ‘ninafanya.’
