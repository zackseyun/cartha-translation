  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: sw
  text: Wakamwambia, “Je, unasikia wanayoyasema hawa?” Yesu akawaambia, “Ndiyo. Je, hamjawahi kusoma, ‘Kutoka katika vinywa vya watoto wachanga na wanaonyonya umeandaa sifa’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesu ananukuu Zaburi 8:2 kulingana na mapokeo ya Maandiko ya Kigiriki. Maandishi ya Kiebrania kwa kawaida hutafsiriwa, “Kutoka katika vinywa vya watoto wachanga na wanaonyonya umeweka imara nguvu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: unasikia
  rationale: Kitenzi cha wakati uliopo katika swali la moja kwa moja; ‘unasikia’ ni Kiswahili cha kawaida na kinadumisha changamoto wanayomwelekezea Yesu.
- source_word: τί οὗτοι λέγουσιν
  choice: mambo ambayo hawa wanasema
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unadumisha matumizi ya ‘hawa’ bila kuongeza wazi nomino ambayo haimo katika Kigiriki.
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha masimulizi kwa kawaida hutumia mfuatano wa ‘ka-’; pia kiwakilishi cha wingi katika αὐτοῖς kinaonyeshwa.
- source_word: Ναί
  choice: Ndiyo
  rationale: Jibu rahisi la kukubali, la moja kwa moja na la kawaida.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: hamjawahi kusoma
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza swali la balagha kuhusu kufahamu Maandiko, huku ikidumisha sauti ya kukemea.
- source_word: Ἐκ στόματος
  choice: Kutoka katika vinywa vya
  rationale: Wingi ‘vinywa’ unalingana kiasili na watoto wengi wanaofuata, ingawa Kigiriki kina umoja wa kijumla ‘kinywa’.
- source_word: νηπίων
  choice: watoto wachanga
  rationale: Neno hilo humaanisha watoto wadogo sana; ‘watoto wachanga’ linatofautishwa na kirai kinachofuata kuhusu wanaonyonya.
- source_word: θηλαζόντων
  choice: wanaonyonya
  rationale: Kirai hiki kinadumisha picha halisi ya watoto ambao bado wananyonya bila kutumia lugha ya kizamani.
- source_word: κατηρτίσω
  choice: umeandaa
  rationale: Linawasilisha maana ya kuandaa au kuweka tayari katika nukuu ya Kigiriki, bila kuingiza maana maalumu zaidi ya ‘kuamuru’.
- source_word: αἶνον
  choice: sifa
  rationale: Nomino hii humaanisha sifa; Kiswahili hutumia ‘sifa’ kwa kawaida kama dhana ya kumsifu Mungu.
theological_decisions:
- issue: Namna ya kutafsiri nukuu ya Zaburi 8:2 katika hoja ya Yesu
  choice: Kutumia katika andiko kuu maneno ya Kigiriki ya Mathayo, ‘umeandaa sifa’
  alternative: Maneno yanayotegemea Kiebrania, ‘umeweka imara nguvu,’ yaelezwe katika tanbihi
  rationale: Mathayo anawasilisha nukuu kulingana na mapokeo ya Maandiko ya Kigiriki. Tafsiri haipaswi kuilinganisha kimya kimya na maandishi ya Kiebrania; tofauti halisi inahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetolewa kwa lugha ya kawaida, huku swali la balagha na tofauti kati ya maandishi ya Kigiriki na Kiebrania zikihifadhiwa.
