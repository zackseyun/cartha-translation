  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: sw
  text: Lakini majira ya mavuno yalipokaribia, aliwatuma watumishi wake kwa wakulima wapangaji[a] ili wakachukue mazao yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakulima,” “wapangaji,” au “walimaji wa mizabibu.” Neno la Kigiriki linamaanisha watu wanaolima; katika muktadha wa mfano huu walikuwa wakilima shamba la mtu mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... yalipokaribia
  rationale: ὅτε huanzisha kishazi cha wakati, na δέ ni kiunganishi hafifu chenye mpito au utofautishaji mdogo; “Lakini ... yalipokaribia” ni ya kawaida katika simulizi la Kiswahili.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: majira ya mavuno yalipokaribia
  rationale: καιρός katika muktadha wa kilimo ni majira yanayofaa, na τῶν καρπῶν huonyesha wakati wa kupata mazao. “Majira ya mavuno” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza kwamba uvunaji wenyewe tayari ulikuwa umeanza.
- source_word: τοὺς δούλους αὐτοῦ
  choice: watumishi wake
  rationale: δοῦλος inaweza kumaanisha mtumwa au mtumishi. Hapa jukumu lao kama wajumbe wa mwenye shamba ndilo linalosisitizwa; “watumishi” linafaa katika muktadha, huku uwezekano wa “watumwa” ukibainishwa katika tanbihi.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: kwa wakulima wapangaji
  rationale: γεωργός ni mkulima au mtunza shamba. Katika mfano huu wao hulima shamba la mtu mwingine, kwa hiyo “wakulima wapangaji” huweka wazi uhusiano huo unaotokana na muktadha.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: ili wakapokee sehemu yake ya mazao
  rationale: λαβεῖν ni kupata, kupokea, au kuchukua; καρπούς ni matunda au mazao. Kimuktadha mwenye shamba anadai mazao yanayomstahili. “Sehemu yake ya mazao” hueleza kwa kawaida αὐτοῦ bila kudai kwamba alimiliki kila zao lililovunwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye staha. “Majira ya mavuno” ni ya asili zaidi kuliko tafsiri ya neno kwa neno ya “wakati wa matunda.” Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
