  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: sw
  text: Alipoona mtini mmoja kando ya njia, aliuendea, akakuta hakuna kitu chochote juu yake isipokuwa majani tu. Akauambia, “Tunda lisitoke kwako tena kamwe.”[a] Mara moja mtini huo ukanyauka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa Kiswahili cha kawaida zaidi, “Usizae matunda tena kamwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συκῆν μίαν
  choice: mtini mmoja
  rationale: Neno μίαν limetafsiriwa wazi kuwa “mmoja”; Kiswahili hutumia muundo huu kwa kawaida kumtambulisha mtu au kitu fulani katika simulizi.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: kando ya njia
  rationale: Hueleza mahali ulipokuwa mti. “Kando ya njia” ni ya kawaida na haidokezi kwamba mti ulikuwa katikati ya njia.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: aliuendea
  rationale: Kitenzi hiki kinaonyesha kumkaribia mti kwa kusudi, si kufika tu mahali ulipo.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: hakukuta kitu chochote juu yake isipokuwa majani tu
  rationale: “Juu yake” ni usemi wa kawaida kuhusu vitu vilivyo kwenye mti, na “majani tu” huhifadhi mkazo wa μόνον.
- source_word: λέγει αὐτῇ
  choice: Akauambia
  rationale: Wakati uliopo wa kihistoria umewasilishwa kwa wakati wa simulizi wa Kiswahili. Kiambishi cha ngeli -u- kinamrejelea mtini.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Tunda lisitoke kwako tena kamwe
  rationale: Muundo huu huhifadhi taswira ya tunda kutoka kwa mti, pamoja na maana ya kukoma kabisa inayotokana na Μηκέτι na εἰς τὸν αἰῶνα.
- source_word: ἐξηράνθη παραχρῆμα
  choice: Mara moja mtini huo ukanyauka
  rationale: “Ukanyauka” ni kitenzi cha kawaida kwa mti unaokauka, na “mara moja” huhifadhi maana ya tukio kutokea papo hapo.
theological_decisions:
- issue: Nguvu ya tamko la Yesu kwa mtini
  choice: Tunda lisitoke kwako tena kamwe
  alternative: Usizae matunda tena kamwe
  rationale: Muundo wa utegemezi “lisitoke” unawasilisha tamko la kukomesha kuzaa bila kulifanya kuwa utabiri wa kawaida. Pia unahifadhi taswira halisi ya καρπὸς ... ἐκ σοῦ badala ya kuifasiri kwa kitenzi “kuzaa.” Hakuna ufafanuzi wa kiishara ulioingizwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida huku ikihifadhi mkazo, taswira, na uzito wa tamko la Kigiriki.
