review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the fig tree, its roadside location, Jesus’ approach, the finding of leaves only, the imprecatory pronouncement, and the tree’s immediate withering. However, “lakini” (“but”) adds a contrast not present in the Greek, which simply continues the narrative with καί (“and”).
  naturalness: The Swahili is clear, current Standard East African usage, and appropriately dignified. “Majani tu,” “Tunda lisitoke kwako tena kamwe,” and “Mara moja ... ukanyauka” are natural. Removing the unnecessary adversative improves the narrative flow.
  terminology: “Mtini,” “tunda,” and “ukanyauka” are suitable and accurate biblical vocabulary. The retained wording of the pronouncement preserves the Greek image of fruit coming from the tree without importing an interpretation.
  issues:
  - severity: low
    issue: 'Unwarranted adversative conjunction: “lakini hakukuta.”'
    rationale: The source has καὶ ... καὶ (“and ... and”) and does not explicitly mark Jesus’ failure to find fruit as a contrast with his approaching the tree. “Lakini” adds a discourse relation beyond the source; simple coordination is both faithful and idiomatic in Swahili.
  revised_text: Alipoona mtini mmoja kando ya njia, aliuendea, akakuta hakuna kitu chochote juu yake isipokuwa majani tu. Akauambia, “Tunda lisitoke kwako tena kamwe.”[a] Mara moja mtini huo ukanyauka.
