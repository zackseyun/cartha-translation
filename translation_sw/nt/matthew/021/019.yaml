  to: Alipoona mtini mmoja kando ya njia, aliuendea, akakuta hakuna kitu chochote juu yake isipokuwa majani tu. Akauambia, “Tunda lisitoke kwako tena kamwe.”[a] Mara moja mtini huo ukanyauka.
