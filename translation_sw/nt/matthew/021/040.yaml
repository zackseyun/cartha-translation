  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: sw
  text: Kwa hiyo, mwenye[a] shamba la mizabibu atakapokuja, atawatendea nini wale wakulima[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wa shamba la mizabibu.” Neno la Kigiriki ni kyrios, ambalo mara nyingi hutafsiriwa “Bwana,” lakini hapa linamtaja mwenye shamba katika mfano huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakulima wapangaji.” Muktadha mpana wa mfano unaonyesha kwamba wakulima hawa walikuwa wapangaji wa shamba hilo, ingawa neno la Kigiriki lenyewe humaanisha kwa upana zaidi “wakulima” au “walimaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: atakapokuja
  rationale: Pamoja na kitenzi cha hali tegemezi ἔλθῃ, neno hili linaonyesha wakati unaotarajiwa katika simulizi. Muundo wa Kiswahili “atakapokuja” unaonyesha kwa kawaida tukio hilo la wakati ujao.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au swali linalotokana na matukio yaliyotangulia katika mfano, si mfuatano wa wakati tu.
- source_word: ἔλθῃ
  choice: atakapokuja
  rationale: Ni hali tegemezi ya aoristi baada ya ὅταν; Kiswahili huiwasilisha kwa kawaida kwa muundo wa wakati ujao “-takapo-” katika kishazi cha wakati.
- source_word: κύριος
  choice: mwenye
  rationale: Katika mfano huu neno linamtaja mmiliki wa shamba, wala halitumiki moja kwa moja kama cheo cha “Bwana.” “Mwenye shamba” ni ya asili na wazi katika Kiswahili.
- source_word: ἀμπελῶνος
  choice: shamba la mizabibu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa shamba linalolimwa mizabibu.
- source_word: τί ποιήσει
  choice: atawatendea nini
  rationale: Swali linauliza hatua ambayo mwenye shamba atachukua kuwaelekea wakulima. “Atawatendea nini” ni ya asili na huhifadhi mwelekeo huo bila kutaja adhabu moja kwa moja.
- source_word: γεωργοῖς
  choice: wakulima
  rationale: Neno la Kigiriki humaanisha kwa upana wakulima au walimaji. Ingawa muktadha unaonyesha kuwa ni wakulima wapangaji, wazo la upangaji halimo wazi katika neno lenyewe.
- source_word: ἐκείνοις
  choice: wale
  rationale: Kiwakilishi hiki cha kuonyesha kinabainisha na kwa kiasi fulani kuwaweka mbali wakulima wanaozungumziwa; “wale” huhifadhi maana hiyo.
theological_decisions:
- issue: Tafsiri ya κύριος katika muktadha wa mfano
  choice: mwenye
  alternative: bwana
  rationale: Hapa κύριος anamrejelea mwenye shamba ndani ya simulizi. “Mwenye” huepuka kulifanya kimakusudi kuwa cheo cha kimungu, huku tanbihi ikihifadhi tafsiri ya karibu zaidi “bwana wa shamba.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa wa asili kwa Kiswahili huku nguvu ya hitimisho ya οὖν, tukio linalotarajiwa, na swali la hukumu vikihifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
