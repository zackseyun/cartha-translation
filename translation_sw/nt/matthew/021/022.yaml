  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: sw
  text: Na yote mtakayoomba katika sala[a], mkiamini[b], mtapokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnaposali.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkitumaini”; neno la Kigiriki linaonyesha kuamini kunakoandamana na kuomba.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: yote mtakayoomba
  rationale: Muunganiko huu ni usemi mpana unaomaanisha ‘chochote’ au ‘yote ambayo.’ Muundo ‘yote mtakayoomba’ ni wa kawaida katika Kiswahili na unadumisha upeo wa usemi wa Kigiriki.
- source_word: ἂν αἰτήσητε
  choice: mtakayoomba
  rationale: ἄν pamoja na hali tegemezi huunda kishazi rejeshi kisichobainisha kitu fulani. Kiswahili hutumia kwa kawaida muundo wa ‘-takayo-’ ndani ya usemi ‘yote mtakayoomba,’ bila kulazimisha maana ya uwezekano.
- source_word: ἐν τῇ προσευχῇ
  choice: katika sala
  rationale: Hii inawakilisha kirai nomino cha Kigiriki kwa njia ya asili na yenye hadhi; ‘mnaposali’ ingewezekana, lakini ingebadili nomino kuwa kitenzi.
- source_word: πιστεύοντες
  choice: mkiamini
  rationale: Muundo wa ‘mki-’ unaonyesha tendo linaloandamana na kuomba na unakaribia matumizi ya hali ya kushiriki katika Kigiriki, bila kulifanya waziwazi kuwa sharti lenye ‘ikiwa.’
- source_word: λήμψεσθε
  choice: mtapokea
  rationale: Hii ni tafsiri ya kawaida na yenye hadhi ya wakati ujao wa λαμβάνω; ‘mtapata’ lingeweza kueleweka lakini halilingani kwa usahihi sawa na wazo la kupokea.
theological_decisions:
- issue: Uhusiano wa imani na kujibiwa kwa sala
  choice: mkiamini
  alternative: ikiwa mnaamini
  rationale: Kigiriki hutumia hali ya kushiriki, si kishazi cha sharti kilicho wazi. ‘Mkiamini’ inaunganisha kuomba na kuamini huku ikihifadhi mvutano wa kiteolojia bila kufafanua zaidi utaratibu au mipaka ya kujibiwa kwa sala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sala’ limechaguliwa kwa kuwa linaeleweka kwa mapana na linafaa kwa sajili ya kibiblia; sentensi imehifadhi muundo mfupi na msisitizo wa maandiko asili.
