  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: sw
  text: Watu wengi katika umati[a] wakatandaza mavazi yao[b] njiani, na wengine walikuwa wakikata matawi kutoka kwenye miti na kuyatandaza njiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sehemu kubwa ya umati.”
    reason: πλεῖστος pamoja na ὄχλος inaweza kutafsiriwa kwa msemo unaosisitiza kwamba wengi, yaani sehemu iliyo kubwa zaidi, walihusika.
  - marker: b
    text: Au, “mavazi yao ya nje.”
    reason: ἱμάτια ni neno pana kwa mavazi, lakini mara nyingi hurejelea hasa vazi la nje.
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Sehemu kubwa ya umati
  rationale: πλεῖστος pamoja na nomino ya mkusanyiko inaweza kumaanisha sehemu iliyo kubwa zaidi, yaani watu wengi kuliko waliobaki. Tafsiri hii pia huepuka kugeuza δέ kuwa neno la wakati lisilokuwapo katika chanzo.
- source_word: ἔστρωσαν
  choice: ikatandaza
  rationale: Kitenzi στρώννυμι hapa kinaeleza kutandaza au kuweka kitu juu ya njia. Kauli ya usimulizi ya Kiswahili inaakisi aoristi kwa kawaida.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: mavazi yao
  rationale: ἱμάτια ni mavazi, hasa mavazi ya nje; kiwakilishi ἑαυτῶν kinaonyesha kwamba mavazi hayo yalikuwa yao wenyewe, jambo linalowasilishwa kwa kawaida na “yao.”
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Katika muktadha huu ὁδός ni njia halisi waliyokuwa wakipitia, na “njiani” ni Kiswahili cha kawaida kwa vitu vilivyowekwa juu ya njia hiyo.
- source_word: ἄλλοι δὲ
  choice: na wengine
  rationale: δέ hapa linaongeza kundi jingine katika tukio, wala halionyeshi upinzani mkali; “na wengine” ni mtiririko wa kawaida wa simulizi.
- source_word: ἔκοπτον
  choice: walikuwa wakikata
  rationale: Imperfekti inaonyesha tendo lililokuwa likiendelea katika tukio, jambo linalohifadhiwa na muundo “walikuwa wakikata.”
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: matawi kutoka kwenye miti
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya matawi yaliyokatwa kutoka kwa miti.
- source_word: καὶ ἐστρώννυον
  choice: na kuyatandaza
  rationale: Imperfekti ya pili inaendeleza picha ya tendo lililokuwa likifanyika; umbo “kuyatandaza” linaunganisha matendo hayo kwa Kiswahili fasaha bila kurudia muundo mzito.
