base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: sw
  text: Basi, wanafunzi wakaenda na kufanya kama Yesu alivyowaagiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyowaamuru.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa amri au maagizo; hapa muktadha unaelekea kwenye “maagizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: wakaenda
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia au kuandamana na tendo kuu; katika simulizi la Kiswahili, “wakaenda” huendeleza matukio kwa njia ya kawaida.
- source_word: δὲ
  choice: Basi
  rationale: Hutambulisha mwendelezo wa simulizi na mwitikio kwa maagizo yaliyotangulia; “Basi” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Injili kwa wafuasi wanaojifunza kutoka kwa Yesu.
- source_word: ποιήσαντες
  choice: na kufanya
  rationale: Huwasilisha tendo la pili lililoratibiwa na kwenda, bila kulazimisha muundo mzito wa kishirikishi katika Kiswahili.
- source_word: καθὼς
  choice: kama ... alivyowaagiza
  rationale: Muundo huu unaonyesha kuwa walitenda kwa kufuata maagizo ya Yesu, kwa Kiswahili cha asili na wazi.
- source_word: συνέταξεν
  choice: alivyowaagiza
  rationale: Kitenzi συντάσσω kinaweza kumaanisha kutoa maagizo au amri. “Waagiza” linafaa kwa muktadha wa maelekezo ya Yesu, huku tanbihi ikihifadhi uwezekano wa maana yenye nguvu zaidi ya kuamuru.
- source_word: αὐτοῖς
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “alivyowaagiza” kinawakilisha “wao” kwa njia ya kawaida ya Kiswahili.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina la mhusika limetolewa kwa namna yake ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “wakaenda na kufanya” unafaa simulizi, na “waagiza” huhifadhi maana ya maelekezo bila kuifanya iwe kali kupita muktadha.
