base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: sw
  text: Naye akajibu, “Sitaki.” Lakini baadaye akabadili nia yake[a], akaenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajuta” au “akaghairi.” Neno la Kigiriki linaweza kumaanisha majuto yanayomfanya mtu abadili alichokusudia kufanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: akajibu
  rationale: Hii ni kauli ya kawaida ya kisimulizi yenye maana ya kujibu; muundo wa Kiswahili wenye kitenzi kikuu ni wa kawaida na unahifadhi maana.
- source_word: Οὐ θέλω
  choice: Sitaki
  rationale: θέλω hapa inaeleza kutotaka au kutokuwa tayari kwa mwana. “Sitaki” ni jibu la moja kwa moja na la kawaida, bila kulifanya kuwa kiapo kisichoweza kubadilika.
- source_word: ὕστερον
  choice: baadaye
  rationale: Kielezi hiki kinaonyesha kwamba hatua iliyofuata ilitokea baada ya muda.
- source_word: μεταμεληθεὶς
  choice: akabadili nia yake
  rationale: Kitenzi hiki kinaweza kuonyesha kubadili nia kwa sababu ya majuto. Katika muktadha huu, badiliko hilo linaonekana katika uamuzi wa kwenda; tafsiri hii inahifadhi msisitizo wa mgeuko wa uamuzi bila kulazimisha maana maalumu ya kitheolojia.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Katika muktadha wa mfano huu, mwana alienda kutekeleza alichoagizwa. “Akaenda” ni fupi, ya kawaida, na inatosheleza maana hiyo.
theological_decisions:
- issue: Maana ya μεταμεληθεὶς katika mfano
  choice: akabadili nia yake
  alternative: akajuta; akalegeza msimamo wake
  rationale: Andiko linaonyesha mgeuko kutoka kukataa hadi kutii. “Akatubu” lingeweza kuingiza maana mahsusi ya kitheolojia ambayo neno hili si lazima liwe nayo hapa. “Akabadili nia yake” linaacha uwezekano wa majuto huku likisisitiza mgeuko unaoonekana katika tendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi “akabadili … akaenda” unasomeka kwa urahisi katika simulizi na unaonyesha kwamba badiliko la nia lilifuatiwa na tendo.
