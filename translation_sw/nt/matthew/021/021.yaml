id: MAT.21.21
reference: Matthew 21:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: sw
  text: Lakini Yesu akawajibu, “Kweli nawaambia, mkiwa na imani na msione shaka,[a] hamtafanya tu kile kilichotendeka kwa mtini, bali hata mkiuambia mlima huu, ‘Inuliwa na utupwe baharini,’ itatendeka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msisitasite” au “msiwe na nia mbili.”
    reason: Kitenzi διακρίνω katika muktadha huu kinaweza kueleza kuwa na shaka, kusitasita, au kuwa na nia iliyogawanyika.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawajibu
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi mwitikio wa ἀποκριθείς na mpito wa δέ bila kurudia kitenzi cha kusema kwa namna isiyo ya kawaida.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Huwasilisha uzito na mamlaka ya kauli ya Yesu kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἐὰν ἔχητε πίστιν
  choice: mkiwa na imani
  rationale: Imani hapa inaeleza kumtegemea Mungu kwa uhakika, si sifa ya uaminifu.
- source_word: μὴ διακριθῆτε
  choice: bila kuwa na shaka
  rationale: Katika muktadha huu kitenzi kinaonyesha kutokuwa na uhakika au kusitasita moyoni; maana nyingine iliyo karibu imehifadhiwa katika tanbihi.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: hamtafanya tu kile kilichotendeka kwa mtini
  rationale: Kirai cha Kigiriki kimefupishwa; tafsiri hii inaweka wazi rejeo lake kwa tukio la mtini huku ikidumisha wazo la kufanya jambo hilo.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: bali hata mkiuambia mlima huu
  rationale: ‘Hata’ huhifadhi msisitizo wa κἄν na hatua kutoka mfano wa mtini kwenda mfano mkubwa zaidi.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Ng’oka, ukatupwe baharini
  rationale: ‘Ng’oka’ ni amri ya asili kwa mlima kuondolewa mahali pake, nayo ‘ukatupwe’ huhifadhi taswira na hali tendwa ya kitenzi cha pili.
- source_word: γενήσεται
  choice: itatendeka
  rationale: Hurejelea kutimia kwa jambo lililoamriwa na inapatana na ‘kilichotendeka’ katika sehemu ya awali.
theological_decisions:
- issue: Maana ya πίστις katika kauli kuhusu tendo la ajabu
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unaelekeza kwenye kumtegemea Mungu kwa uhakika, si uaminifu kama tabia.
- issue: Asili ya kauli ya Yesu kuhusu kuhamisha mlima
  choice: Kuhifadhi taswira yenye nguvu bila kuamua ikiwa ni ahadi ya kimuujiza iliyo halisi tu au sitiari tu
  alternative: Ahadi ya kuhamisha mlima kihalisi pekee; sitiari tu ya kushinda matatizo
  rationale: Tafsiri inadumisha mvutano na nguvu ya taswira ya maandiko bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ng’oka’ ni amri fupi na yenye nguvu inayoeleweka kwa wasomaji wa kawaida; taswira ya mlima na bahari imeachwa bila kuifafanua kitheolojia.
