  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: sw
  text: Nao makutano walikuwa wakisema, “Huyu ndiye nabii[a] Yesu, kutoka Nazareti katika Galilaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina “yule nabii” (kwa kibainishi cha uhakika); huenda ikimaanisha nabii anayetambuliwa, si nabii mmoja tu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Nao umati
  rationale: δέ ni kiunganishi chepesi cha simulizi, kilichowakilishwa kwa ‘Nao’. Ingawa ὄχλοι ni wingi katika Kigiriki, ‘umati’ ni namna ya kawaida na ya asili ya Kiswahili ya kutaja makundi ya watu kwa pamoja.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huhifadhi hali endelevu au ya kurudiwa ya wakati usiotimilifu wa Kigiriki bila kuongeza msisitizo usio lazima.
- source_word: Οὗτός ἐστιν
  choice: Huyu ndiye
  rationale: Ni utambulisho wa moja kwa moja na wa kawaida katika Kiswahili; ‘ndiye’ inaonyesha kwamba mtu huyu ndiye anayetambulishwa.
- source_word: ὁ προφήτης
  choice: nabii
  rationale: Kiswahili kwa kawaida hakina kibainishi maalumu kinacholingana moja kwa moja na ‘the’. Muundo ‘Huyu ndiye nabii Yesu’ unaweza kuhifadhi utambulisho mahususi unaodokezwa na kibainishi cha Kigiriki bila kuufanya useme zaidi ya chanzo.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Jina hili limetoholewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: kutoka Nazareti ya Galilaya
  rationale: Huwasilisha asili ya Yesu na uhusiano wa kijiografia kati ya Nazareti na Galilaya kwa Kiswahili cha kawaida na kifupi.
theological_decisions:
- issue: Iwapo ὁ προφήτης itafsiriwe kwa maana mahususi au isiyo mahususi
  choice: nabii katika muundo ‘Huyu ndiye nabii Yesu’
  alternative: nabii mmoja / nabii fulani
  rationale: Kibainishi kipo katika Kigiriki na kinaweza kumtambulisha Yesu kama yule nabii anayetambuliwa na umati. Muundo wa Kiswahili pamoja na ‘ndiye’ huhifadhi uwezekano huo bila kuongeza wazi cheo cha ‘yule Nabii’ au kuondoa utata uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mtiririko wa simulizi na hali endelevu ya kitenzi zimehifadhiwa; hakuna alama ya tanbihi kwa sababu tafsiri kuu haidai mbadala wa lazima katika Kiswahili.
