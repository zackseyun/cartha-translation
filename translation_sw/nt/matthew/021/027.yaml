id: MAT.21.27
reference: Matthew 21:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: sw
  text: Nao wakamjibu Yesu, “Hatujui.” Naye akawaambia, “Wala mimi siwaambii ni kwa mamlaka gani ninafanya mambo haya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: wakamjibu
  rationale: Kirai kishirikishi kinatanguliza jibu lao; kitenzi cha Kiswahili chenye kiambishi cha yambwa ‘-mjibu’ kinaeleza kwa kawaida kwamba walimjibu Yesu.
- source_word: Οὐκ οἴδαμεν
  choice: Hatujui
  rationale: Ni kauli ya moja kwa moja inayokanusha kujua, na ‘Hatujui’ ni Kiswahili sanifu na cha kawaida.
- source_word: ἔφη αὐτοῖς καὶ αὐτός
  choice: Naye akawaambia
  rationale: ‘Naye’ linaonyesha kwamba Yesu naye anajibu kwa upande wake, huku ‘akawaambia’ likitoa kwa kawaida maana ya kusema jambo kwao.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Wala mimi siwaambii
  rationale: ‘Wala mimi’ linahifadhi ulinganifu wa jibu la Yesu; wakati uliopo wa λέγω umehifadhiwa kwa ‘siwaambii’ bila kulazimisha wakati ujao.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ni kwa mamlaka gani
  rationale: ‘Kwa mamlaka gani’ linaeleza msingi au uhalali wa kutenda na kuhifadhi nguvu ya ἐξουσία katika mzozo huu.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea matendo ya Yesu yaliyokuwa yakahojiwa.
- source_word: ποιῶ
  choice: ninafanya
  rationale: Wakati uliopo endelevu ni wa asili katika Kiswahili hapa na unaonyesha matendo anayoyafanya Yesu katika muktadha huu.
theological_decisions:
- issue: Maana ya ἐξουσία katika jibu la Yesu
  choice: mamlaka
  alternative: haki; uwezo
  rationale: Katika mzozo huu viongozi wanauliza kuhusu uhalali na chanzo cha matendo ya Yesu. ‘Mamlaka’ huhifadhi maana hiyo bila kuipunguza kuwa uwezo tu au kuifasiri kama haki pekee.
- issue: Wakati na nguvu ya Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Wala mimi siwaambii
  alternative: Wala mimi sitawaambia
  rationale: λέγω ni wakati uliopo. Tafsiri ya wakati uliopo huhifadhi umbo la Kigiriki na bado huwasilisha kukataa kwa Yesu kutoa habari hiyo; wakati ujao pia ungewezekana kimuktadha lakini ungefafanua zaidi ya umbo la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida katika masimulizi ya Biblia bila kuwa wa kizamani; ‘mamlaka’ ni wazi kwa wasomaji wa kawaida na linafaa katika mazingira ya mabishano kuhusu uhalali wa matendo ya Yesu.
