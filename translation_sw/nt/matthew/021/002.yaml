  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: sw
  text: akiwaambia, “Nendeni katika kijiji kilicho mkabala yenu[a]. Mara moja mtamkuta punda jike amefungwa, na mwana-punda pamoja naye[b]. Wafungueni, kisha mniwalete kwangu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilicho mbele yenu.”
    reason: lexical_alternative
  - marker: b
    text: “Mwana-punda” hapa ni punda mchanga, kama muktadha unavyoonyesha.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kina kitenzi kishirikishi, “baada ya kuwafungua,” kikifuatiwa na amri, “waleteni kwangu.” Kiswahili cha kawaida huwasilisha vitendo hivyo kama amri zinazofuatana.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: akiwaambia
  rationale: Kitenzi kishirikishi kinaendeleza simulizi na kutambulisha maneno ya Yesu; “akiwaambia” ni Kiswahili cha kawaida na huhifadhi uhusiano wake na sentensi iliyotangulia.
- source_word: Πορεύεσθε
  choice: Nendeni
  rationale: Ni amri ya wingi; “Nendeni” ni ya moja kwa moja na ya asili katika muktadha huu.
- source_word: κώμην
  choice: kijiji
  rationale: Neno hili kwa kawaida hutaja makazi madogo kuliko mji; “kijiji” ndilo neno wazi na la kawaida.
- source_word: κατέναντι ὑμῶν
  choice: kilicho mbele yenu
  rationale: Huhifadhi maana ya mahali palipo mkabala au mbele ya wanafunzi kwa lugha inayoeleweka kwa urahisi.
- source_word: εὐθέως
  choice: Mara
  rationale: “Mara” huonyesha kwamba wangewakuta bila kuchelewa na inafaa mtindo wa simulizi wa Kiswahili.
- source_word: ὄνον δεδεμένην
  choice: punda jike amefungwa
  rationale: Muundo wa Kigiriki ni wa umoja wa kike na unaonyesha punda akiwa bado katika hali ya kufungwa; kutaja “jike” hufanya rejeo la αὐτῆς liwe wazi kwa Kiswahili.
- source_word: πῶλον
  choice: mwana-punda
  rationale: Katika muktadha huu ni mtoto wa punda, si mtoto wa farasi; “mwana-punda” ni wazi na huepuka utata.
- source_word: μετ’ αὐτῆς
  choice: pamoja naye
  rationale: Kiwakilishi cha kike cha umoja kinamrejelea punda jike; “pamoja naye” ni cha asili kwa mnyama aliye hai.
- source_word: λύσαντες
  choice: Wafungueni
  rationale: Ingawa Kigiriki kina kitenzi kishirikishi, hapa kinaonyesha kitendo kinachotangulia amri inayofuata; amri iliyoratibiwa ni ya asili kwa Kiswahili.
- source_word: ἀγάγετέ μοι
  choice: kisha mniletee
  rationale: Amri ni ya wingi na vitu vinavyoletwa vinaeleweka kuwa wanyama wote wawili; “kisha” huonyesha mfuatano wa kufungua na kuleta bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. “Punda jike” na “mwana-punda” vinaweka wazi uhusiano wa wanyama wawili, huku “mbele yenu” ikihifadhi uwezekano wa maana ya “mkabala nanyi.”
