review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the command, the village, the tied female donkey, the colt with her, and the sequence of untying and bringing. However, “Mara” alone can also function temporally as “once/when”; “Mara moja” more clearly conveys εὐθέως (“immediately”). “Mkabala yenu” is a closer and still natural rendering of κατέναντι ὑμῶν than “mbele yenu.” The final command should explicitly retain the plural direct object, since both animals are to be brought.
  naturalness: The narration is otherwise natural Standard East African Swahili. “Wafungueni, kisha mniwalete kwangu” is clear, idiomatic, and explicitly refers to both animals. “Punda jike” and “mwana-punda” are natural and suitably precise in context.
  terminology: “Punda jike” appropriately reflects the feminine singular participle and supports the feminine reference in “pamoja naye.” “Mwana-punda” correctly identifies πῶλος in this context as a young donkey. No theological terminology is involved.
  issues:
  - severity: medium
    issue: “Mara” may be less explicit than the Greek adverb εὐθέως.
    rationale: Using “Mara moja” clearly communicates “immediately/at once,” without introducing another temporal nuance.
  - severity: low
    issue: “Kilicho mbele yenu” is somewhat broader than κατέναντι ὑμῶν.
    rationale: “Kilicho mkabala yenu” preserves the sense of a village opposite/facing them more directly; “mbele yenu” can be retained as a footnoted alternative.
  - severity: medium
    issue: “Kisha mniletee” leaves the plural direct object unexpressed and the footnote's quoted imperative is correspondingly imprecise.
    rationale: The Greek plural participle and the two animals in context support explicitly stating “mniwalete.” The revised note accurately explains the participle-plus-imperative construction.
  revised_text: akiwaambia, “Nendeni katika kijiji kilicho mkabala yenu[a]. Mara moja mtamkuta punda jike amefungwa, na mwana-punda pamoja naye[b]. Wafungueni, kisha mniwalete kwangu[c].”
