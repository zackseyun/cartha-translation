base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: sw
  text: “Lakini mnaonaje? Mtu alikuwa na watoto wawili.[a] Akamwendea wa kwanza na kumwambia, ‘Mwanangu, nenda ukafanye kazi leo katika shamba la mizabibu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wawili wa kiume.” Tafsiri nyingi hutumia “wana,” lakini neno la Kigiriki hapa (τέκνα) linamaanisha “watoto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Lakini mnaonaje?
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwaomba wasikilizaji watoe maoni au hukumu yao; “Lakini” inadumisha nguvu nyepesi ya kiunganishi δὲ.
- source_word: ἄνθρωπος
  choice: Mtu mmoja
  rationale: Katika simulizi hili neno linamtaja mwanamume mwenye watoto; “mtu mmoja” ni utangulizi wa kawaida wa mhusika katika masimulizi ya Kiswahili bila kuongeza maana ya “fulani” isiyolazimishwa na Kigiriki.
- source_word: τέκνα δύο
  choice: watoto wawili
  rationale: τέκνα ni neno la jumla linalomaanisha watoto, si wana wa kiume kwa lazima; tafsiri hii inadumisha upana wa neno la Kigiriki.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Akamwendea wa kwanza
  rationale: Muundo huu wa kisimulizi unaonyesha kwamba mtu huyo alimkaribia mtoto wa kwanza kisha akasema naye; “akamwendea” ni ya asili na fasaha katika Kiswahili.
- source_word: Τέκνον
  choice: Mwanangu
  rationale: τέκνον ni namna ya kumwita mtoto isiyobainisha jinsia. “Mwanangu” ndiyo namna ya kawaida na yenye heshima ya mzazi kumwita mtoto wake kwa Kiswahili, ingawa umbo la Kigiriki halina kiwakilishi tofauti cha umilikaji.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: nenda ukafanye kazi leo
  rationale: Mfuatano “nenda ukafanye” unawakilisha kwa Kiswahili cha kawaida amri ya kwenda na kufanya kazi; “leo” inadumisha msisitizo wa wakati wa σήμερον.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: katika shamba la mizabibu
  rationale: Hii inadumisha mazingira ya kilimo na maana ya kufanya kazi ndani ya shamba la mizabibu.
theological_decisions:
- issue: Iwapo τέκνα/τέκνον yatafsiriwe kwa maneno yanayobainisha wana wa kiume kulingana na mapokeo ya tafsiri nyingi
  choice: watoto / Mwanangu
  alternative: wana / Mwanangu
  rationale: Kigiriki cha aya hii kimetumia τέκνα na τέκνον, maneno mapana yasiyobainisha jinsia, badala ya υἱοί/υἱέ. Kwa hiyo tafsiri haifupishi maana kuwa wana wa kiume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na kinachoeleweka kwa wasomaji wa kawaida. “Mwanangu” limetumiwa kama mwito wa kawaida wa mzazi kwa mtoto, bila kubainisha jinsia; “shamba la mizabibu” ni msemo unaoeleweka zaidi kuliko neno la kiufundi.
