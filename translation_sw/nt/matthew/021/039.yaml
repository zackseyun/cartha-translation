  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: sw
  text: Wakamchukua, wakamtupa[a] nje ya shamba la mizabibu, wakamuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamtimua nje ya shamba la mizabibu.”
    reason: Njia nyingine ya kutafsiri ἐξέβαλον, yenye maana ya kumfukuza au kumtoa mtu nje.
lexical_decisions:
- source_word: λαβόντες
  choice: wakamshika
  rationale: Kitenzi hiki ni kauli ya kushiriki ya wakati uliopita kutoka λαμβάνω. “Wakamshika” ni Kiswahili cha kawaida kinachoonyesha kwamba walimtwaa kwa mikono bila kuongeza kwa lazima wazo mahususi la kukamata rasmi au kutumia nguvu.
- source_word: ἐξέβαλον
  choice: wakamtupa nje
  rationale: ἐκβάλλω hapa inaonyesha kumwondoa mtu kwa nguvu kutoka mahali fulani. “Wakamtupa nje” ni usemi wa asili na wa moja kwa moja unaohifadhi uzito wa tendo hilo.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: nje ya shamba la mizabibu
  rationale: Kirai hiki kinaonyesha mwendo kutoka ndani hadi nje ya shamba la mizabibu. Tafsiri hii inaungana kwa kawaida na “wakamtupa nje.”
- source_word: ἀμπελῶνος
  choice: shamba la mizabibu
  rationale: ἀμπελών humaanisha eneo lililopandwa mizabibu. “Shamba la mizabibu” ni tafsiri sahihi na inayoeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: ἀπέκτειναν
  choice: wakamuua
  rationale: ἀποκτείνω humaanisha kuua. “Wakamuua” ni tafsiri ya moja kwa moja isiyoongeza tafsiri ya kimaadili kama vile “walimwua kikatili” au “walimnyonga.”
theological_decisions:
- issue: Mpangilio wa kumtupa mwana nje na kumuua ukilinganishwa na masimulizi sambamba
  choice: Tendo la kumtupa nje ya shamba la mizabibu linatangulia tendo la kumuua.
  alternative: Kudokeza kwamba walimuua kwanza, kisha wakamtupa nje ili kupatanisha simulizi hili na Marko au Luka.
  rationale: 'Mpangilio wa Kigiriki katika Mathayo uko wazi: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. Tafsiri inahifadhi mpangilio wa Mathayo bila kuupatanisha kimyakimya na masimulizi sambamba.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi “wakamshika, wakamtupa ... na wakamuua” unadumisha mwendo wa haraka wa simulizi la Kigiriki.
