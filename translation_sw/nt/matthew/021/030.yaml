base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: sw
  text: Kisha akamwendea mwana wa pili na kumwambia jambo lilelile. Naye akajibu, “Nitakwenda[a], bwana[b],” lakini hakwenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, Kigiriki kinasema, “Mimi, bwana”—jibu fupi linalomaanisha “Nitakwenda.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki κύριε linaweza pia kutafsiriwa “Bwana” au kumaanisha bwana mwenye mamlaka; hapa limetumiwa kama neno la heshima kwa baba wa kibinadamu.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Kisha akamwendea
  rationale: Kirai hiki kinaendeleza simulizi na kuonyesha baba akimsogelea mwana wa pili; “akamwendea” ni Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: τῷ δευτέρῳ
  choice: wa pili
  rationale: Kigiriki kinasema tu “wa pili”; neno “mwana” linaeleweka kutokana na muktadha, kwa hiyo ufupi wa chanzo umehifadhiwa.
- source_word: εἶπεν ὡσαύτως
  choice: kumwambia vivyo hivyo
  rationale: ὡσαύτως hurejelea agizo lilelile alilopewa mwana wa kwanza. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Muundo wa Kigiriki, kwa maana halisi “akijibu alisema,” unatolewa kwa usemi wa kawaida wa Kiswahili bila kurudia kitenzi kisivyo lazima.
- source_word: Ἐγώ
  choice: Nitakwenda
  rationale: Kigiriki kina kiwakilishi cha msisitizo “Mimi” pekee, lakini ni jibu lililodondosha kitenzi kinachoeleweka kutokana na agizo. “Nitakwenda” huwasilisha ukubali huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi.
- source_word: κύριε
  choice: bwana
  rationale: Hapa ni neno la heshima analotumia mwana kumwambia baba yake. “Bwana” linafaa katika Kiswahili na halihitaji kumfanya baba huyu kuwa mhusika wa kiungu.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: lakini hakwenda
  rationale: Ingawa καί kwa kawaida ni “na,” hapa tofauti kati ya ahadi na tendo hutolewa kwa kawaida zaidi kwa “lakini.”
theological_decisions:
- issue: Maana ya κύριε katika kauli inayomwelekea baba
  choice: bwana
  alternative: Bwana; mkuu
  rationale: Muktadha ni wa mwana anayemjibu baba yake kwa heshima, si wa cheo cha kimungu au cha Kimasihi. Herufi ndogo na muktadha huonyesha matumizi ya kawaida ya heshima, huku maana pana ya neno ikielezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. “Akamwendea,” “vivyo hivyo,” na “hakwenda” ni maneno rahisi kueleweka. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
