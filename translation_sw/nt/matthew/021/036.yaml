base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: sw
  text: Akatuma tena watumishi wengine[a], wengi kuliko wale wa kwanza; wakulima wakawatendea vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa wengine.” Neno la Kigiriki linaweza kumaanisha watumishi au watumwa, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinaonyesha kurudiwa kwa tendo; “tena” ni kifupi na cha kawaida katika simulizi la Kiswahili.
- source_word: ἀπέστειλεν
  choice: akatuma
  rationale: Kitenzi cha wakati uliopita katika mfululizo wa simulizi; “akatuma” huendeleza matukio kwa njia ya kawaida katika Kiswahili.
- source_word: ἄλλους δούλους
  choice: watumishi wengine[a]
  rationale: Katika muktadha huu, watu hao wanasisitizwa kuwa wajumbe wa mwenye shamba. “Watumishi” ni lugha ya kawaida na yenye heshima, huku tanbihi ikihifadhi maana mbadala ya hali ya utumwa.
- source_word: πλείονας τῶν πρώτων
  choice: wengi kuliko wale wa kwanza
  rationale: Muundo huu unalinganisha idadi na kuonyesha kwamba kundi la pili lilikuwa kubwa zaidi kuliko la kwanza.
- source_word: ἐποίησαν αὐτοῖς
  choice: wakawatendea
  rationale: ποιέω pamoja na kiwakilishi cha yambwa hapa humaanisha kuwatendea watu kwa namna fulani; “wakawatendea” ni ya asili katika Kiswahili.
- source_word: ὡσαύτως
  choice: vivyo hivyo
  rationale: Hurejelea namna watumishi wa kwanza walivyotendewa katika mstari uliotangulia na huhifadhi rejeo hilo bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano
  choice: watumishi
  alternative: watumwa
  rationale: Mkazo wa simulizi ni jukumu lao kama waliotumwa na mwenye shamba na jinsi walivyotendewa, si hadhi yao ya kisheria. “Watumishi” inafaa kwa Kiswahili cha sasa, huku “watumwa” ikiwekwa katika tanbihi ili kuhifadhi upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa simulizi umetumia viambishi vya mfululizo “aka-/waka-”. Nusu-koloni inatenganisha kitendo cha kutuma na mwitikio wa wakulima bila kuvunja mshikamano wa sentensi.
