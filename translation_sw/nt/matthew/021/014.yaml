  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: sw
  text: Vipofu na vilema wakamjia katika hekalu[a], naye akawaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo lote la hekalu pamoja na nyua zake, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: wakamjia
  rationale: Kitenzi “wakamjia” kinaeleza kwa kawaida mwendo wa watu kuelekea kwa Yesu, huku kiambishi “-m-” kikirejelea yeye.
- source_word: τυφλοὶ
  choice: vipofu
  rationale: Kivumishi hiki kimetumiwa kama nomino ya wingi, kikimaanisha watu wasioona; “vipofu” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: χωλοὶ
  choice: vilema
  rationale: Neno hili linarejelea watu wasioweza kutembea kawaida; “vilema” linaendeleza muundo mfupi wa Kigiriki na linaoana na “vipofu.”
- source_word: ἐν τῷ ἱερῷ
  choice: katika hekalu
  rationale: “Katika hekalu” ni usemi wa kawaida wa Kiswahili. Tanbihi inafafanua kwamba ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee.
- source_word: ἐθεράπευσεν αὐτούς
  choice: akawaponya
  rationale: Katika masimulizi ya miujiza ya Injili, θεραπεύω humaanisha kuponya; kiambishi “-wa-” kinawarejelea vipofu na vilema.
theological_decisions:
- issue: Mahali pa uponyaji kulingana na maana ya ἱερόν
  choice: Yesu aliwaponya katika eneo la hekalu kwa maana pana.
  alternative: Yesu aliwaponya katika nyua za hekalu.
  rationale: Neno ἱερόν kwa kawaida humaanisha jengo lote la hekalu pamoja na maeneo yake, wala si patakatifu pa ndani (ναός). Tafsiri ya kawaida “katika hekalu” imehifadhiwa, na tanbihi inaweka wazi maana pana ya mahali hapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Muundo “wakamjia ... naye akawaponya” unaendeleza uhusiano wa matendo katika sentensi bila kuwa mzito.
