  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: sw
  text: Naye akawaambia, “Imeandikwa, ‘Nyumba yangu itaitwa nyumba ya sala,’ lakini ninyi mnaifanya kuwa pango la wanyang’anyi[b].”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesu anaunganisha Isaya 56:7 na Yeremia 7:11.
    reason: cross_reference
  - marker: b
    text: Au, “majambazi.” Neno la Kigiriki linaweza kumaanisha wanyang’anyi au majambazi wanaotumia nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kisimulizi, wakati uliopita wa kisimulizi ni wa kawaida na wa asili zaidi katika Kiswahili, bila kupoteza uhai wa simulizi.
- source_word: Γέγραπται
  choice: Imeandikwa
  rationale: Hii ni kauli ya kawaida ya Kiswahili ya kutambulisha nukuu ya Maandiko, nayo inaonyesha kuwa yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: οἶκός μου
  choice: Nyumba yangu
  rationale: Tafsiri halisi ya ‘nyumba’ inadumisha lugha ya nukuu ya Isaya na haibadilishi neno hilo kimafafanuzi kuwa ‘hekalu.’
- source_word: οἶκος προσευχῆς
  choice: nyumba ya sala
  rationale: Ni muundo wa Kiswahili ulio wazi na wa asili unaohifadhi usemi wa kinabii.
- source_word: κληθήσεται
  choice: itaitwa
  rationale: Inawakilisha kwa uwazi hali ya wakati ujao na kauli tendwa ya Kigiriki.
- source_word: ποιεῖτε
  choice: mnaifanya kuwa
  rationale: Wakati wa sasa unaonyesha tendo linaloendelea; ‘kuwa’ huweka wazi matokeo ya tendo hilo kwa Kiswahili cha kawaida.
- source_word: σπήλαιον
  choice: pango
  rationale: ‘Pango’ ni maana ya msingi ya neno hilo na katika muktadha huu pia hudokeza maficho ya wanyang’anyi.
- source_word: λῃστῶν
  choice: wanyang’anyi
  rationale: Neno hili linafaa kwa watu wanaopora na linadumisha shtaka la kinabii; ‘majambazi’ pia linawezekana ikiwa msisitizo ni juu ya magenge yenye kutumia nguvu.
theological_decisions:
- issue: Nukuu na dokezo la Agano la Kale
  choice: Kuhifadhi maneno yanayotambulika ya Isaya 56:7 (‘Nyumba yangu itaitwa nyumba ya sala’) na Yeremia 7:11 (‘pango la wanyang’anyi’).
  alternative: Kutumia maneno huru zaidi ya kisasa ambayo yangeficha uhusiano na vifungu hivyo.
  rationale: Kauli ya Yesu imejengwa kwa nukuu na dokezo la Maandiko; kuyahifadhi kunafanya msingi wake wa kimaandiko uonekane bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ‘nyumba ya sala’ na ‘pango la wanyang’anyi’ unadumisha mwangwi wa kinabii huku ukieleweka kwa urahisi. Alama [b] imewekwa moja kwa moja baada ya neno linalohusika, na [a] baada ya kauli nzima inayounganisha vifungu viwili.
