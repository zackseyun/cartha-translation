  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: sw
  text: Wanafunzi walipoona jambo hilo, walistaajabu wakisema, “Imekuwaje mtini umenyauka mara moja[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haraka hivyo.”
    reason: Mbadala huu huwasilisha παραχρῆμα kwa namna inayosisitiza mshangao wa wanafunzi, huku ‘mara moja’ ikifuata moja kwa moja zaidi maana ya kutokea bila kuchelewa.
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona jambo hilo
  rationale: Kirai cha wakati ‘walipoona’ kinawasilisha kitenzi-shirikishi cha wakati uliopita kwa Kiswahili cha kawaida. ‘Jambo hilo’ limeongezwa kutokana na muktadha, kwa kuwa Kigiriki hakitaji wazi kitu kilichoonekana.
- source_word: ἐθαύμασαν
  choice: walistaajabu
  rationale: ‘Walistaajabu’ huonyesha mshangao mkubwa unaokusudiwa na θαυμάζω, kwa lugha ya kawaida yenye hadhi.
- source_word: λέγοντες
  choice: wakisema
  rationale: ‘Wakisema’ huhifadhi mtiririko wa kitenzi-shirikishi na kuunganisha mshangao wao na maneno yanayofuata.
- source_word: Πῶς
  choice: Imekuwaje
  rationale: Katika swali hili, ‘Imekuwaje’ ni usemi wa asili unaouliza jinsi tukio hilo lilivyotokea bila kuongeza maelezo ya sababu.
- source_word: παραχρῆμα
  choice: mara moja
  rationale: ‘Mara moja’ huwasilisha maana ya kutokea papo hapo au bila kuchelewa. ‘Haraka hivyo’ ni mbadala wa kimuktadha unaosisitiza mshangao wao.
- source_word: ἐξηράνθη
  choice: umenyauka
  rationale: Kwa mti, ‘umenyauka’ ni kitenzi cha kawaida cha Kiswahili kinachoeleza hali ya kukauka na kufa; umbo hili halilazimishi kutaja mtendaji ambaye Kigiriki pia hamtaji.
- source_word: ἡ συκῆ
  choice: mtini
  rationale: ‘Mtini’ ni neno sanifu la Kiswahili kwa mti wa tini, na kiambishi cha kiima katika ‘umenyauka’ kinakubaliana nalo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia miundo ya kawaida ya simulizi (‘walipoona … walistaajabu wakisema’) na haiongezi ufafanuzi wa kiteolojia usiokuwamo katika chanzo.
