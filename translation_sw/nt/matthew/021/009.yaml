reference: Matthew 21:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: sw
  text: Makundi ya watu yaliyokuwa yakimtangulia na yale yaliyokuwa yakimfuata walikuwa wakipaza sauti wakisema, “Hosana[a] kwa Mwana wa Daudi![b] Amebarikiwa yule anayekuja kwa jina la Bwana![c] Hosana juu kabisa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” ni mwito uliotokana na Kiebrania, wenye maana kama “okoa, tafadhali” au “okoa sasa”; katika muktadha huu hutumika pia kama mwito wa sifa.
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Daudi” ni cheo cha kifalme cha Kimasihi.
    reason: cultural_note
  - marker: c
    text: Maneno haya yanarejelea Zaburi 118:26; neno “Bwana” hapa linawakilisha jina la Mungu, YHWH, katika matini ya Kiebrania.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: umati
  rationale: ‘Umati’ ni neno la kawaida na lenye heshima kwa kundi kubwa la watu; katika Kiswahili umoja wa kimkusanyiko unasomeka kwa ufasaha hapa.
- source_word: προάγοντες αὐτόν
  choice: waliokuwa ukimtangulia
  rationale: Hueleza sehemu ya umati iliyokuwa ikienda mbele ya Yesu bila kudokeza kuwa ilikuwa ikimwongoza rasmi.
- source_word: ἀκολουθοῦντες
  choice: waliokuwa wakimfuata
  rationale: Ni tafsiri ya moja kwa moja inayodumisha picha ya maandamano na uwiano na waliokuwa mbele.
- source_word: ἔκραζον λέγοντες
  choice: waliendelea kupaza sauti wakisema
  rationale: ‘Waliendelea’ huonyesha tendo lililoendelea la wakati usiotimilifu, na ‘kupaza sauti’ ni Kiswahili cha asili kinachofaa kwa mwito mkubwa wa hadharani.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Umbo hili la kutoholewa linahifadhi mwangwi wa kiliturujia na wa Maandiko; maana yake ya asili inaelezwa katika tanbihi.
- source_word: τῷ υἱῷ Δαυίδ
  choice: kwa Mwana wa Daudi
  rationale: ‘Kwa’ huwasilisha dative katika mwito huu kwa Kiswahili cha kawaida, huku ‘Mwana wa Daudi’ ikihifadhi cheo cha kifalme cha Kimasihi.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Amebarikiwa yeye anayekuja
  rationale: Huhifadhi muundo wa baraka na umoja wa mrejelewa kwa lugha ya sasa, iliyo wazi.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi lugha ya kibiblia ya kuja kwa mamlaka na uwakilishi wa Bwana.
- source_word: κυρίου
  choice: Bwana
  rationale: Hutafsiri neno la Kigiriki κύριος moja kwa moja; msingi wa jina la Mungu katika Zaburi unaelezwa katika tanbihi.
- source_word: ἐν τοῖς ὑψίστοις
  choice: huko juu kabisa
  rationale: Huhifadhi maana ya eneo la juu zaidi bila kulazimisha tafsiri mahsusi ya ‘mbinguni,’ na ni mwito wa asili katika Kiswahili.
theological_decisions:
- issue: Cheo cha Kimasihi cha kifalme katika τῷ υἱῷ Δαυίδ
  choice: Kuhifadhi ‘Mwana wa Daudi’ kama cheo katika matini kuu.
  alternative: Masihi
  rationale: Kigiriki chenyewe kinatumia cheo kinachohusiana na Daudi; kukihifadhi kunadumisha historia na mvutano wa kitheolojia bila kukibadilisha kuwa ufafanuzi.
- issue: Tafsiri ya Ὡσαννά
  choice: Kutumia ‘Hosana’ katika matini kuu na kueleza maana yake ya asili katika tanbihi.
  alternative: Tuokoe, tafadhali / Okoa sasa
  rationale: Katika muktadha huu neno ni mwito wa shangwe na sifa wenye asili ya ombi la wokovu; kulitohowa huhifadhi kazi zake zote mbili bila kuamua moja pekee.
- issue: Mrejelewa wa κυρίου katika dondoo la Zaburi
  choice: Kutafsiri ‘Bwana’ kulingana na Kigiriki na kueleza msingi wa Kiebrania katika tanbihi.
  alternative: YHWH / BWANA
  rationale: Matini ya Agano Jipya inasema κύριος, lakini mwangwi wa Zaburi 118:26 unatokana na mahali ambapo Kiebrania kina jina la Mungu; tanbihi huhifadhi viwango vyote vya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maandamano na mwito wa hadharani umehifadhiwa; lugha ya kiliturujia haijafanywa kuwa ya kizamani.
