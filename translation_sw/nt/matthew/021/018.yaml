  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: sw
  text: Asubuhi na mapema, alipokuwa akirudi mjini, akapata njaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Asubuhi na mapema
  rationale: Hutaja sehemu ya mapema ya siku; usemi huu ni wa kawaida katika Kiswahili na unadumisha mkazo wa wakati.
- source_word: δὲ
  choice: imewasilishwa kwa mtiririko wa sentensi bila neno la pekee
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi, si alama ya ulinganisho mkali. Kiswahili hakihitaji kuongeza “basi” au “lakini” katika muktadha huu.
- source_word: ἐπανάγων
  choice: alipokuwa akirudi
  rationale: Kauli endelevu inaonyesha tendo lililokuwa likiendelea wakati njaa ilipotokea; “ak系rudi” pia huhifadhi maana ya kwenda tena kuelekea mahali pa awali.
- source_word: εἰς τὴν πόλιν
  choice: mjini
  rationale: Hutoa kwa kawaida wazo la kuelekea au kuingia katika mji bila kudai kwamba alikuwa tayari amefika ndani yake.
- source_word: ἐπείνασεν
  choice: akapata njaa
  rationale: Huhifadhi nguvu ya kitendo cha wakati uliopita inayoweza kuonyesha kuanza kwa hali ya njaa, na ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja isiyo ya asili.
theological_decisions:
- issue: Maana ya kikristo ya njaa ya Yesu
  choice: Kauli imetafsiriwa moja kwa moja kuwa Yesu alipata njaa halisi.
  alternative: Kupunguza kauli hiyo kuwa hisia ya mfano au kuiongezea ufafanuzi wa kimafundisho.
  rationale: Simulizi linataja wazi uzoefu halisi wa kibinadamu wa Yesu. Tafsiri ya moja kwa moja hudumisha ushuhuda huo bila kuongeza hitimisho la kimadhehebu au maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo “Asubuhi na mapema” ni wa kawaida, na “akapata njaa” unaonyesha kwa ufupi kuanza kwa njaa.
