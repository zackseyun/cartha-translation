  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: sw
  text: Lakini tukisema, ‘Ilitoka kwa wanadamu[a],’ tunauogopa umati, kwa maana wote wanamwona Yohana kuwa nabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ilikuwa ya asili ya kibinadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Lakini tukisema
  rationale: Muundo wa ‘tuki-’ unaonyesha uwezekano wa sharti katika mjadala wao, kwa Kiswahili cha kawaida na cha asili.
- source_word: Ἐξ ἀνθρώπων
  choice: Ilitoka kwa wanadamu
  rationale: Kirai hiki kinajibu kwa ufupi swali la awali kuhusu chanzo cha ubatizo wa Yohana. ‘Wanadamu’ hapa ni watu kwa ujumla, si wanaume pekee, na kinadumisha utofauti kati ya chanzo cha mbinguni na cha kibinadamu.
- source_word: φοβούμεθα
  choice: tunauogopa
  rationale: Kitenzi cha wakati uliopo kinaonyesha hofu yao ya sasa; kiambishi ‘-u-’ kinarejelea umati.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: ‘Umati’ ni neno la kawaida na mahususi kwa kundi kubwa la watu waliokusanyika.
- source_word: πάντες
  choice: wote
  rationale: Neno hili linaonyesha kwamba watu wa umati huo kwa ujumla walikuwa na mtazamo huo.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: wanamwona Yohana kuwa nabii
  rationale: Hii ni tafsiri ya asili ya nahau inayomaanisha kumhesabu au kumchukulia mtu kuwa kitu fulani, bila kuongeza madai zaidi ya simulizi.
theological_decisions:
- issue: Utofauti kati ya chanzo cha mbinguni na chanzo cha kibinadamu katika ἐξ ἀνθρώπων
  choice: Ilitoka kwa wanadamu
  alternative: Ilikuwa ya asili ya kibinadamu
  rationale: Tafsiri iliyochaguliwa inadumisha picha ya ‘kutoka’ na utofauti wa moja kwa moja na ‘kutoka mbinguni,’ huku ‘wanadamu’ ikieleweka kwa maana jumuishi.
- issue: Mtazamo wa umati kuhusu Yohana
  choice: wote wanamwona Yohana kuwa nabii
  alternative: wote wanamhesabu Yohana kuwa nabii
  rationale: Tafsiri hii inaripoti mtazamo wa umati bila kuufafanua zaidi kitheolojia au kuingiza hitimisho lisilosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kueleweka kwa wasomaji wa kawaida; ‘wanadamu’ huepuka maana ya wanaume pekee, na ‘wanamwona ... kuwa’ ni nahau ya kawaida ya kutathmini hadhi ya mtu.
