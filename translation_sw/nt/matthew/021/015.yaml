  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: sw
  text: Lakini makuhani wakuu na walimu wa sheria walipoona mambo ya ajabu aliyofanya, na watoto waliokuwa wakipaza sauti hekaluni[a] wakisema, “Hosana kwa Mwana wa Daudi!”[b] walikasirika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki hapa linamaanisha eneo lote la hekalu, pamoja na nyua zake, si sehemu takatifu ya ndani pekee.
    reason: cultural_note
  - marker: b
    text: “Hosana” linatokana na Kiebrania na maana yake ni kama “Tuokoe, tafadhali” au “Tuokoe sasa”; kufikia wakati huu lilitumiwa pia kama mwito wa sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha mazingira ya kitendo kikuu; “walipoona” ni ya kawaida katika Kiswahili na huhifadhi maana ya wakati.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha ugeuko wenye utofautishaji mdogo na tukio lililotangulia.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Ni viongozi wa kikuhani kwa wingi, si kuhani mkuu mmoja.
- source_word: γραμματεῖς
  choice: walimu wa sheria
  rationale: Katika muktadha huu ni wataalamu na wafundishaji wa Sheria; tafsiri hii inaeleweka vizuri zaidi kwa msomaji wa sasa kuliko “waandishi,” ambalo linaweza kumaanisha watunzi wa maandishi.
- source_word: τὰ θαυμάσια
  choice: mambo ya ajabu
  rationale: Hurejelea matendo ya kushangaza kwa upana bila kuyafafanua yote moja kwa moja kuwa miujiza.
- source_word: ἐποίησεν
  choice: aliyofanya
  rationale: Huhifadhi kitenzi cha jumla “kufanya” kinacholingana na “mambo ya ajabu.”
- source_word: παῖδας
  choice: watoto
  rationale: Hii ndiyo maana inayofaa zaidi katika muktadha; “watumishi” haiendani na tukio, na “wavulana” ingepunguza maana bila sababu.
- source_word: κράζοντας
  choice: waliokuwa wakipaza sauti
  rationale: Huonyesha mwito wa hadharani wenye sauti kubwa bila kuudokeza kuwa wa uhasama.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Ni Kiswahili cha kawaida; tanbihi inafafanua kwamba neno la Kigiriki linahusu eneo lote la hekalu, si patakatifu pa ndani pekee.
- source_word: λέγοντας
  choice: wakisema
  rationale: Hukiunganisha kwa kawaida na kitendo cha watoto cha kupaza sauti.
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: Neno limehamishwa kwa matamshi kwa sababu hapa ni mwito maalumu wenye maana ya ombi la wokovu na pia sifa; tanbihi inahifadhi upana huo.
- source_word: τῷ υἱῷ Δαυίδ
  choice: kwa Mwana wa Daudi
  rationale: Huhifadhi muundo wa mwito unaoelekezwa kwa Mwana wa Daudi na kutunza cheo hicho cha Kimasihi.
- source_word: ἠγανάκτησαν
  choice: walikasirika
  rationale: Hutoa kwa lugha ya kawaida hisia ya hasira na kukerwa inayoonyeshwa na kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya Kimasihi ya “Mwana wa Daudi”
  choice: Mwana wa Daudi
  alternative: mrithi wa Daudi
  rationale: Tafsiri ya moja kwa moja huhifadhi cheo kinachotambulika kuwa cha Kimasihi katika simulizi la Mathayo bila kukifafanua kupita kiasi.
- issue: Uwasilishaji wa Ὡσαννά
  choice: Hosana katika andiko kuu, pamoja na ufafanuzi katika tanbihi
  alternative: Tuokoe, tafadhali / Tuokoe sasa
  rationale: Katika muktadha huu neno linabeba kwa pamoja asili yake kama ombi la kuokolewa na matumizi yake kama mwito wa sifa; kulihamisha kwa matamshi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walimu wa sheria” limetumiwa badala ya “waandishi” ili kazi ya γραμματεῖς ieleweke kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi mfuatano wa kuona, kusikia mwito wa watoto, na kisha kukasirika.
