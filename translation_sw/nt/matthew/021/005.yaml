base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: sw
  text: Mwambieni binti Sayuni, “Tazama, mfalme wako anakuja kwako, akiwa mpole[a] na amepanda punda, na mwana-punda[b], mwana wa mnyama wa kubeba mizigo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyenyekevu.” Neno la Kigiriki πραΰς linaweza kumaanisha “mpole,” “mwenye upole,” au “mnyenyekevu”; matumizi yake hapa yanaakisi Zekaria 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Mathayo anahifadhi maneno ya unabii yenye maelezo mawili yaliyounganishwa kuhusu wanyama: “punda, na mwana-punda, mwana wa mnyama wa kubeba mizigo.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Mwambieni
  rationale: Kitenzi cha amri kwa wingi kimetafsiriwa kwa njia ya kawaida ya Kiswahili, kikielekeza ujumbe usemwe kwa binti Sayuni.
- source_word: τῇ θυγατρὶ Σιών
  choice: binti Sayuni
  rationale: Inahifadhi uhuishaji wa kinabii wa Sayuni badala ya kuufafanua moja kwa moja kuwa watu wa Sayuni au Yerusalemu.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni mwito wa kuzingatia unaofaa katika lugha ya heshima ya kinabii bila kuwa mgumu kueleweka.
- source_word: ὁ βασιλεύς σου
  choice: Mfalme wako
  rationale: Inahifadhi umilikaji na uzito wa kifalme wa kauli ya Kigiriki.
- source_word: ἔρχεταί σοι
  choice: anakuja kwako
  rationale: Inawasilisha ujio wenye uhalisia wa sasa na kuelekea kwa mhusika anayesemeshwa.
- source_word: πραῢς
  choice: mpole
  rationale: Neno hili linaweza kumaanisha mpole, mwenye upole, au mnyenyekevu. “Mpole” ni la kawaida na linahifadhi tabia isiyo ya mabavu, huku uwezekano wa “mnyenyekevu” ukitajwa katika tanbihi.
- source_word: ἐπιβεβηκὼς
  choice: amepanda
  rationale: Hali timilifu ya kitenzi inaonyesha kuwa mfalme yuko juu ya mnyama baada ya kumpanda; “amepanda” ni Kiswahili cha kawaida na wazi.
- source_word: ἐπὶ ὄνον
  choice: punda
  rationale: Ni tafsiri ya moja kwa moja ya ὄνος katika muktadha wa mnyama anayepandwa.
- source_word: πῶλον
  choice: mwana-punda
  rationale: πῶλος humaanisha mnyama mchanga; muktadha na kirai kinachofuata vinaonyesha mwana wa punda au wa mnyama wa kubeba mizigo.
- source_word: υἱὸν ὑποζυγίου
  choice: mtoto wa mnyama wa kubeba mizigo
  rationale: Inatoa maana ya kirai cha Kisemiti kwa Kiswahili cha kawaida bila kutafsiri υἱός kwa ukavu kuwa “mwana,” na inahifadhi taswira ya mnyama wa kazi.
theological_decisions:
- issue: Nukuu ya kinabii ya Zekaria 9:9 na iwapo maneno ya Mathayo yapatanishwe na tafsiri ya Agano la Kale
  choice: 'Kuhifadhi maneno ya Kigiriki ya Mathayo: “akiwa mpole ... amepanda punda, na mwana-punda, mtoto wa mnyama wa kubeba mizigo.”'
  alternative: Kutumia “mnyenyekevu” ili kufanana wazi zaidi na baadhi ya tafsiri za Zekaria 9:9, au kuunganisha maelezo ya wanyama yawe rejeo moja lisilo na urudiaji.
  rationale: Mathayo anatumia nukuu hii kwa maana ya kinabii na ya Kimasihi, lakini tafsiri inapaswa kuwakilisha maandishi yake ya Kigiriki badala ya kuyapatanisha kimya na tafsiri nyingine. Miundo miwili iliyounganishwa kuhusu wanyama imehifadhiwa kwa sababu iko katika maandishi na ina uzito wa kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Tazama” na “binti Sayuni” zinadumisha sauti ya kinabii, huku “amepanda” na “mnyama wa kubeba mizigo” zikiweka sentensi katika lugha ya kawaida inayoeleweka.
