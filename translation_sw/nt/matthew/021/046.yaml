  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: sw
  text: Ingawa walikuwa wakitafuta kumkamata, waliogopa umati wa watu, kwa sababu umati huo ulimwona kuwa nabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimhesabu kuwa nabii,” au “ulimchukulia kuwa nabii.”
    reason: Mbadala hizi zinaonyesha maana ya usemi wa Kigiriki εἰς προφήτην αὐτὸν εἶχον.
lexical_decisions:
- source_word: ζητοῦντες
  choice: ingawa walitaka
  rationale: 'Kitenzi-shirikishi cha wakati uliopo kinaonyesha nia iliyokuwa ikiendelea. Muktadha unaonyesha uhusiano wa kiukinzani na kitenzi kikuu: walitaka kumkamata, lakini hofu yao kwa umati ikawazuia.'
- source_word: κρατῆσαι
  choice: kumkamata
  rationale: Katika muktadha huu wa uhasama, neno hili linamaanisha kumtia mtu mikononi au chini ya udhibiti; “kumkamata” ni Kiswahili cha kawaida kinachoeleza hatua hiyo bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐφοβήθησαν
  choice: waliwaogopa
  rationale: Huwakilisha moja kwa moja kitenzi cha wakati uliopita na yambwa wake, yaani umati wa watu, bila kulazimisha wazo la kuanza kuogopa.
- source_word: τοὺς ὄχλους
  choice: umati wa watu
  rationale: Ni usemi wa kawaida na unaoeleweka kwa watu wengi kwa ajili ya watu wengi waliokusanyika. Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia jina la mkusanyiko katika umoja.
- source_word: ἐπεὶ
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya wao kuuogopa umati.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: walimwona kuwa nabii
  rationale: Huu ni usemi wenye maana ya kumhesabu au kumchukulia mtu kuwa wa aina fulani. “Walimwona kuwa nabii” ni wa kawaida na huhifadhi mtazamo wa umati kuhusu Yesu.
- source_word: προφήτην
  choice: nabii
  rationale: Nomino isiyo na kibainishi humweka Yesu katika kundi la manabii kwa mtazamo wa umati; Kiswahili hakihitaji kibainishi kinacholingana na neno la Kiingereza “a”.
theological_decisions:
- issue: Jinsi ya kueleza mtazamo wa umati kwamba Yesu alikuwa προφήτην bila kuongeza au kupunguza madai ya Kikristo kumhusu
  choice: walimwona kuwa nabii
  alternative: walimhesabu kuwa nabii; walimchukulia kuwa nabii
  rationale: Aya inaripoti mtazamo wa umati, si kutoa ufafanuzi kamili wa utambulisho wa Yesu. Tafsiri hii haiashirii kwamba alikuwa nabii tu, wala haibadili mtazamo wa wahusika kuwa tamko kamili la mwandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Umati wa watu” ni wa kawaida zaidi kuliko “makutano,” huku “walimwona kuwa nabii” ikisomeka kwa urahisi bila kuondoa utata wa kimuktadha.
