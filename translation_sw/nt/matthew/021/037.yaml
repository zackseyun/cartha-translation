  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: sw
  text: Lakini baadaye akamtuma mwanawe kwao, akisema, “Watamheshimu mwanangu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watamstahi mwanangu.” Kitenzi cha Kigiriki kinaweza kumaanisha kumwonyesha mtu heshima au staha; katika miktadha mingine kinaweza pia kumaanisha “kuwa na haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: baadaye
  rationale: Kielezi hiki huonyesha wakati wa baadaye katika mfuatano wa matukio. “Baadaye” ni Kiswahili cha kawaida na hakiongezi maana yenye nguvu zaidi ya “hatimaye.”
- source_word: δὲ
  choice: Lakini
  rationale: δέ huonyesha badiliko au utofautishaji wa kiasi. “Lakini” linafaa hapa kwa kuwa kutumwa kwa mwana ni hatua tofauti na kutumwa kwa watumishi waliotangulia.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: akamtuma ... kwao
  rationale: ἀποστέλλω ni “kutuma,” na πρός pamoja na hali ya kushutumiwa huonyesha mwelekeo kwa watu. “Akamtuma ... kwao” ni usemi wa kawaida wa Kiswahili.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: mwanawe
  rationale: Hutambulisha mwana wa mwenye shamba kwa lugha ya kawaida, bila kuongeza “mpendwa” au kumpa cheo ambacho hakijaelezwa moja kwa moja katika Kigiriki.
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-shirikishi hiki kinatanguliza maneno ya mwenye shamba; “akisema” hudumisha mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: Ἐντραπήσονται
  choice: Watamheshimu
  rationale: Katika muundo huu wenye yambwa ya moja kwa moja, kitenzi kina maana ya kumwonyesha mtu heshima au staha. “Watamheshimu” ni wazi na cha sasa; tanbihi huhifadhi maana mbadala ya kuwa na haya mbele ya mtu.
- source_word: τὸν υἱόν μου
  choice: mwanangu
  rationale: Huhifadhi uhusiano wa karibu na wa kibinafsi unaoonyeshwa na “mwana wangu,” kwa umbo la kawaida na fasaha la Kiswahili.
theological_decisions:
- issue: Kumrejelea mwana katika mfano bila kuingiza ufafanuzi wa Kikristo ndani ya maneno yenyewe
  choice: mwanawe / mwanangu
  alternative: Mwanawe mpendwa / Mwana
  rationale: Mfano unaelekeza kwa Yesu, lakini mstari wenyewe umetumia υἱός ya kawaida bila ἀγαπητός (“mpendwa”). Tafsiri hii hudumisha umbo la simulizi na kuacha maana ya Kikristo ionekane katika muktadha.
- issue: Maana ya ἐντρέπομαι katika matarajio ya mwenye shamba
  choice: watamheshimu
  alternative: watamstahi / watakuwa na haya mbele ya
  rationale: Yambwa ya moja kwa moja “mwanangu” inaunga mkono maana ya kuonyesha heshima au staha. Hata hivyo, upeo wa kimaana unaohusisha haya hauondolewi, bali umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na kinachoeleweka kwa urahisi. Muundo “akamtuma mwanawe kwao” ni wa kawaida na huhifadhi mwelekeo wa tendo; “heshimu” ni wazi zaidi kwa wasomaji wa leo kuliko maneno yenye ladha ya kale au yanayoweza kudokeza ibada.
