id: MAT.21.25
reference: Matthew 21:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: sw
  text: Ubatizo wa Yohana ulitoka wapi? Ulitoka mbinguni[a] au kwa wanadamu[b]? Wakawa wakijadiliana wao kwa wao, wakisema, “Tukisema, ‘Ulitoka mbinguni,’ atatuambia, ‘Basi kwa nini hamkumwamini?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Mungu”; kwa Kigiriki, “mbinguni” ni njia ya heshima ya kurejelea chanzo cha kimungu.
    reason: lexical_alternative
  - marker: b
    text: “Kwa wanadamu” humaanisha chanzo cha kibinadamu, kinyume na chanzo cha mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ubatizo
  rationale: Neno hili linamaanisha desturi au huduma ya kubatiza; ‘ubatizo’ ni istilahi ya kawaida na inayofahamika katika Kiswahili.
- source_word: τὸ Ἰωάννου
  choice: wa Yohana
  rationale: Muundo wa umilikishi unaonyesha ubatizo uliohusishwa na Yohana.
- source_word: πόθεν
  choice: ulitoka wapi
  rationale: Huuliza chanzo au asili; kauli hii ni ya asili katika Kiswahili na inaendeleza swali kuhusu chanzo.
- source_word: ἐξ οὐρανοῦ
  choice: ulitoka mbinguni
  rationale: Inahifadhi neno halisi ‘mbinguni’ pamoja na matumizi yake ya heshima yanayoashiria chanzo au mamlaka ya Mungu.
- source_word: ἐξ ἀνθρώπων
  choice: kwa wanadamu
  rationale: ‘Wanadamu’ inaonyesha asili ya kibinadamu kwa ujumla, si wanaume pekee, na kutofautisha chanzo hicho na cha mbinguni.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: wakajadiliana wao kwa wao
  rationale: Inawasilisha mashauriano yao ya pamoja kwa Kiswahili cha kawaida; muktadha unaonyesha walikuwa wakipima jibu lao.
- source_word: Ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Ni uwasilishaji wa kawaida wa sharti hili katika Kiswahili.
- source_word: ἐρεῖ ἡμῖν
  choice: atatuuliza
  rationale: Ingawa kitenzi cha Kigiriki kwa msingi ni ‘atasema nasi,’ maneno yanayofuata ni swali; ‘atatuuliza’ ni Kiswahili cha asili na kinadumisha kazi ya usemi huo.
- source_word: Διὰ τί οὖν
  choice: Basi kwa nini
  rationale: ‘Basi’ inadumisha nguvu ya hitimisho au hoja inayotokana na jibu lao la kudhaniwa.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: hamkumwamini
  rationale: Muundo huu unamaanisha kutokubali au kutokuamini ujumbe na mamlaka ya Yohana.
theological_decisions:
- issue: Maana ya ‘kutoka mbinguni’
  choice: Kudumisha ‘mbinguni’ katika matini kuu.
  alternative: kutoka kwa Mungu
  rationale: Kigiriki kinataja mbingu kwa namna ya heshima inayomaanisha asili au idhini ya Mungu. Tafsiri ya moja kwa moja inadumisha taswira na mvutano wa swali.
- issue: Tofauti kati ya chanzo cha mbinguni na cha kibinadamu
  choice: kwa wanadamu
  alternative: kwa watu
  rationale: ‘Wanadamu’ inaweka wazi kuwa suala ni chanzo cha kibinadamu kwa ujumla, wala si jinsia ya kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali na mazungumzo umefanywa kuwa wa asili bila kuondoa tofauti kati ya asili ya kimungu na ya kibinadamu.
