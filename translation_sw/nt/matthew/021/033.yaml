  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: sw
  text: 'Sikilizeni mfano mwingine: Kulikuwa na mwenye shamba aliyepanda shamba la mizabibu, akalizungushia uzio[b], akachimba ndani yake mahali pa kukamulia zabibu, na akajenga mnara[a]. Kisha akalikodisha kwa wakulima[c], akaenda zake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taswira ya kupanda shamba la mizabibu, kulizungushia uzio, kuchimba mahali pa kukamulia zabibu, na kujenga mnara inadokeza Isaya 5:1–2.
    reason: cross_reference
  - marker: b
    text: Au, “akalizungushia ua.” Neno la Kigiriki linaweza kumaanisha kizuizi kinachozunguka eneo, kama uzio au ua.
    reason: lexical_alternative
  - marker: c
    text: Au, “akawapa wakulima shamba hilo kwa upangaji.” Maneno haya yanamaanisha kwamba aliwakodishia wakulima shamba hilo ili walilime.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Sikilizeni mfano mwingine
  rationale: Kitenzi ni amri kwa wingi; “Sikilizeni” ni mwito wa moja kwa moja na wa kawaida, huku “mfano” likiwa neno la kawaida kwa παραβολή katika mafundisho ya Yesu.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Kulikuwa na mwenye shamba
  rationale: Katika mazingira haya ya kilimo, οἰκοδεσπότης ni mwenye mali au shamba. Kauli hii ni ya asili zaidi kwa Kiswahili kuliko tafsiri sisisi ya “bwana wa nyumba.”
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: aliyepanda shamba la mizabibu
  rationale: Inahifadhi tendo halisi la kupanda na picha ya kilimo inayodokeza Isaya 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: akalizungushia uzio
  rationale: φραγμός ni kizuizi kinachozunguka eneo, kama uzio au ua; “uzio” ni wazi bila kubainisha isivyofaa nyenzo iliyotumiwa.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: akachimba ndani yake shinikizo la kukamulia zabibu
  rationale: ληνός ni mahali au kifaa cha kukamulia zabibu ili kupata divai. “Shinikizo la kukamulia zabibu” linaeleweka kwa wasomaji wa sasa na kuonyesha matumizi yake.
- source_word: ᾠκοδόμησεν πύργον
  choice: akajenga mnara
  rationale: πύργος ni “mnara.” Kazi yake kama mnara wa ulinzi inawezekana, lakini haijaelezwa wazi katika Kigiriki.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: akalikodisha kwa wakulima
  rationale: Kitenzi cha kati hapa humaanisha kukodisha mali, na γεωργοί ni wakulima waliokabidhiwa kulilima; Kiswahili hakihitaji kurudia dhana ya upangaji ndani ya nomino.
- source_word: ἀπεδήμησεν
  choice: akaenda safari
  rationale: ἀποδημέω humaanisha kuondoka nyumbani au kwenda mbali. “Akaenda safari” ni ya asili na haiongezi nchi au mahali ambako hakukutajwa.
theological_decisions:
- issue: Taswira ya shamba la mizabibu inayodokeza Isaya 5
  choice: Kuhifadhi picha halisi za shamba la mizabibu katika matini na kueleza mwangwi wa Isaya 5 katika tanbihi.
  alternative: Kutumia maneno ya kimapokeo zaidi ili kufanya dokezo la Isaya lionekane wazi zaidi ndani ya matini.
  rationale: Matini ya Mathayo inadokeza Isaya 5:1–2 kwa nguvu, lakini haitaji Isaya moja kwa moja. Tafsiri haipaswi kugeuza dokezo hilo kuwa maelezo ya wazi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi wenye “aka-” umehifadhi mtiririko wa simulizi. Alama zote za tanbihi zimewekwa baada ya kirai husika.
