lexical_decisions:
- source_word: Τοῦτο
  choice: Jambo hili
  rationale: Kiwakilishi cha pekee cha jinsia ya kati kinarejelea tukio lililotangulia kwa ujumla; “jambo hili” ni Kiswahili cha kawaida na wazi.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki ni cha kuendeleza simulizi bila kuonyesha upinzani mkubwa. Hakikutafsiriwa kwa neno tofauti kwa kuwa mtiririko huo unaeleweka kiasili katika Kiswahili, bila kuongeza neno la wakati lisilokuwamo katika chanzo.
- source_word: γέγονεν
  choice: lilitukia
  rationale: Wakati timilifu wa γίνομαι katika kauli hii ya utimilifu unaeleza kutokea kwa tukio; wakati uliopita ni wa kawaida katika simulizi la Kiswahili.
- source_word: ἵνα πληρωθῇ
  choice: ili litimie
  rationale: “Ili” huhifadhi maana ya kusudi au matokeo, na “litimie” huonyesha hali tegemezi na sauti ya kitendwa kwa njia ya kawaida katika Kiswahili.
- source_word: τὸ ῥηθὲν
  choice: lile lililonenwa
  rationale: Kirai cha kisifa kilichotumika kama nomino kinawakilishwa kwa muundo wa Kiswahili unaohifadhi maana ya jambo lililosemwa na sauti ya kitendwa.
- source_word: διὰ τοῦ προφήτου
  choice: kwa njia ya nabii
  rationale: διά pamoja na umilikishi huonyesha uwakala au njia ya upitishaji. “Kwa njia ya nabii” huhifadhi wazo la ujumbe kupitishwa kupitia nabii.
- source_word: λέγοντος
  choice: aliyesema
  rationale: Kisifa hiki kinamhusu nabii na kinaanzisha maneno yanayonukuliwa; “aliyesema” ni wazi na cha kawaida katika Kiswahili.
theological_decisions:
- issue: Utimilifu na uwakala wa kinabii
  choice: lile lililonenwa kwa njia ya nabii
  alternative: lile lililonenwa na nabii
  rationale: Chaguo hili huhifadhi dokezo la Kigiriki kwamba ujumbe ulipitishwa kupitia nabii, bila kuufanya uwe tu usemi uliotokana na nabii mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Jambo hili lilitukia” linaepuka mtindo wa kizamani wa “ikawa,” huku “kwa njia ya nabii” kikihifadhi uwakala uliopatanishwa.
