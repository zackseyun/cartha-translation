id: MAT.21.32
reference: Matthew 21:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: sw
  text: Kwa maana Yohana alikuja kwenu katika njia ya haki[a], nanyi hamkumwamini; lakini watoza ushuru na makahaba walimwamini. Lakini ninyi, baada ya kuyaona hayo, hamkubadili hata nia zenu baadaye[c] ili kumwamini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa namna ya haki,” au “katika njia ya uadilifu.” Maneno ya Kigiriki yanaweza kueleza mwenendo na huduma ya Yohana au njia ya haki aliyotangaza.
    reason: lexical_alternative
  - marker: b
    text: Au, “kumtumaini.” Kitenzi cha Kigiriki kinaweza kumaanisha kumwamini mtu au kumtumaini.
    reason: lexical_alternative
  - marker: c
    text: Au, “hamkutubu baadaye ili kumwamini.” Kitenzi kilichotumika hapa si μετανοέω, ambacho hutumiwa zaidi kumaanisha kutubu, bali ni μεταμέλομαι, ambacho hasa hudokeza kubadili nia au kujuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Kwa maana ... alikuja
  rationale: “Kwa maana” preserves the explanatory force of γάρ, while “alikuja” is the natural narrative equivalent of ἦλθεν.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: This directly expresses movement toward the addressed group and is idiomatic in Standard East African Swahili.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: katika njia ya haki
  rationale: This retains the source metaphor of a ‘way/path’ and leaves open whether the phrase chiefly describes John’s conduct, ministry, or proclaimed way.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: hamkumwamini / walimwamini
  rationale: With the dative αὐτῷ, πιστεύω here naturally means believing or trusting John; the repeated Swahili wording preserves the contrast.
- source_word: τελῶναι
  choice: watoza ushuru
  rationale: This is the standard, clear modern Swahili term for tax collectors.
- source_word: πόρναι
  choice: makahaba
  rationale: This is the direct and widely understood Swahili equivalent, preserving the social and moral force of the source term.
- source_word: ἰδόντες
  choice: baada ya kuona hayo
  rationale: The temporal rendering fits the aorist participle, while “hayo” makes explicit that they witnessed the response just described.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: hamkubadili nia zenu baadaye
  rationale: This conveys a later change of mind without automatically equating μεταμέλομαι with the more common repentance verb μετανοέω.
theological_decisions:
- issue: Sense of δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: “Haki” is the established broad biblical term in Swahili and preserves the moral-covenantal force, while the footnote retains the possible adverbial sense of righteous conduct.
- issue: Sense of πιστεύω with αὐτῷ
  choice: kumwamini
  alternative: kumtumaini
  rationale: “Kumwamini” directly conveys accepting John and his message as true without importing a more developed formula of believing ‘in’ him.
- issue: Sense of μεταμέλομαι
  choice: kubadili nia
  alternative: kutubu
  rationale: “Kubadili nia” preserves the specific nuance of reconsideration or regret and avoids silently collapsing μεταμέλομαι into μετανοέω; the traditional repentance rendering is retained in a footnote.
translation_notes:
  register: Standard East African Swahili; current, dignified, and accessible. The translation retains the ‘way’ metaphor, the emphatic contrast in “Lakini ninyi,” and the distinction between believing John and changing one’s mind.
