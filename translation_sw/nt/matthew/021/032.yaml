  to: Kwa maana Yohana alikuja kwenu katika njia ya haki[a], nanyi hamkumwamini; lakini watoza ushuru na makahaba walimwamini. Lakini ninyi, baada ya kuyaona hayo, hamkubadili hata nia zenu baadaye[c] ili kumwamini.[b]
