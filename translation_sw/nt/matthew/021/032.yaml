review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory γάρ, John's coming to the audience, the metaphor ‘way of righteousness,’ the repeated πιστεύω with John as its object, and the contrast with tax collectors and prostitutes. The final clause correctly distinguishes μεταμέλομαι from μετανοέω by using ‘kubadili nia.’ A small wording adjustment places ‘hata’ directly with the negated change of mind, better reflecting οὐδὲ.
  naturalness: The Swahili is dignified and readily understandable. ‘Hamkubadili hata nia zenu baadaye’ is slightly more natural and gives the emphatic ‘not even’ its proper scope. ‘Baada ya kuyaona hayo’ makes the plural demonstrative object explicit and fluent.
  terminology: ‘Njia ya haki,’ ‘watoza ushuru,’ ‘makahaba,’ and ‘kumwamini’ are suitable Standard East African Swahili renderings. The first footnote's proposed alternative ‘njia inayoelekea kwenye haki’ adds a directional sense not expressed by the Greek and should be replaced with a faithful alternative.
  issues:
  - severity: low
    issue: Footnote a gives ‘katika njia inayoelekea kwenye haki’ as an alternative.
    rationale: This means ‘on a path leading toward righteousness,’ whereas ἐν ὁδῷ δικαιοσύνης is ‘in the way/path of righteousness.’ The alternative introduces an unwarranted directional nuance.
  - severity: low
    issue: The emphasis of οὐδέ is not positioned as directly as possible in the final Swahili clause.
    rationale: Moving ‘hata’ to modify ‘kubadili nia zenu’ preserves ‘not even ... later changed your minds’ more transparently.
  revised_text: Kwa maana Yohana alikuja kwenu katika njia ya haki[a], nanyi hamkumwamini; lakini watoza ushuru na makahaba walimwamini. Lakini ninyi, baada ya kuyaona hayo, hamkubadili hata nia zenu baadaye[c] ili kumwamini.[b]
