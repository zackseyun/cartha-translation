base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: sw
  text: Kisha akawaacha, akatoka nje ya mji kwenda Bethania, akakaa huko usiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalala huko” au “akapitisha usiku huko.”
    reason: Msemo wa Kigiriki unaweza kumaanisha kukaa, kulala, au kupitisha usiku mahali hapo.
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: akawaacha
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aliwaacha wale waliotajwa katika muktadha kabla ya kutoka; umbo la Kiswahili lenye mfululizo wa matendo ni la kawaida na haliongezi utambulisho wao.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: akatoka nje ya mji
  rationale: Kirai hiki kinahifadhi msisitizo wa kutoka mpaka nje ya mji kwa Kiswahili cha kawaida.
- source_word: εἰς Βηθανίαν
  choice: kwenda Bethania
  rationale: Hii inaonyesha kwa kawaida mwelekeo wa safari kuelekea mahali paitwapo Bethania.
- source_word: ηὐλίσθη ἐκεῖ
  choice: akakaa huko usiku
  rationale: αὐλίζομαι hapa humaanisha kukaa au kulala mahali usiku. Chaguo hili linaeleza wazi muda bila kudai hasa kwamba alikuwa amelala.
