id: MAT.21.12
reference: Matthew 21:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: sw
  text: Yesu akaingia katika eneo la Hekalu, akawafukuza wote waliokuwa wakiuza na kununua katika eneo hilo[a], akazipindua meza za wabadilishaji fedha na viti vya waliokuwa wakiuza njiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hekalu” au “nyua za Hekalu”; neno la Kigiriki linarejelea eneo pana la Hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: eneo la Hekalu
  rationale: Neno hili linarejelea jengo lote la Hekalu pamoja na nyua zake, si patakatifu pa ndani pekee. ‘Eneo la Hekalu’ ni la asili katika Kiswahili na linaonyesha mahali pana ambapo biashara hiyo ilifanyika.
- source_word: ἐξέβαλεν
  choice: akawafukuza
  rationale: Kitenzi hiki kinaonyesha kuwaondoa watu kwa nguvu na kwa uamuzi; ‘akawafukuza’ ni wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: πάντας
  choice: wote
  rationale: Neno hili linahifadhi wazi upeo wa kauli ya Kigiriki kuhusu waliokuwa wakifanya biashara humo.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: waliokuwa wakiuza na kununua
  rationale: Muundo huu unaonyesha watu waliokuwa wakishughulika na vitendo hivyo wakati huo na unasomeka kwa kawaida katika Kiswahili.
- source_word: τράπεζας
  choice: meza
  rationale: Hili ndilo neno la kawaida na la moja kwa moja; muktadha unaonyesha kwamba meza hizo zilitumiwa kubadili fedha.
- source_word: κολλυβιστῶν
  choice: wabadili fedha
  rationale: Neno hili linamaanisha watu waliobadili sarafu; ‘wabadili fedha’ linaeleweka kwa urahisi na linafaa katika muktadha wa Hekalu.
- source_word: κατέστρεψεν
  choice: akazipindua
  rationale: Katika muktadha huu kitenzi kinaeleza kugeuza meza na kuziangusha, bila kulazimisha maana ya kuziharibu kabisa.
- source_word: καθέδρας
  choice: viti
  rationale: Neno la Kigiriki linamaanisha viti au mahali pa kuketi; ‘viti’ ni tafsiri ya kawaida na sahihi.
- source_word: περιστεράς
  choice: njiwa
  rationale: Neno hili linaweza kumaanisha aina za njiwa; ‘njiwa’ ni neno pana, la kawaida, na linafaa katika muktadha wa wanyama wa dhabihu.
theological_decisions:
- issue: Upeo wa ἱερόν kuhusiana na mahali Yesu alipoingia
  choice: Yesu aliingia katika eneo pana la Hekalu, si lazima patakatifu pa ndani.
  alternative: Kutafsiri kwa jumla ‘Hekalu’ bila kufafanua eneo lake.
  rationale: Tofauti ya ἱερόν na ναός ni muhimu kihistoria na kijiografia. ‘Eneo la Hekalu’ linahifadhi maana pana bila kudokeza kwamba Yesu aliingia patakatifu pa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa vitenzi vya masimulizi (‘aka-’) unahifadhi kasi ya simulizi, huku sentensi mbili zikisaidia usomaji wazi bila kubadili uhusiano wa matendo.
