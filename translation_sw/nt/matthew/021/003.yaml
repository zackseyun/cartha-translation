base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: sw
  text: Na mtu yeyote akiwaambia jambo lolote, mtasema, “Bwana[a] anawahitaji,” naye atawatuma mara moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno «Bwana» pia linaweza kumaanisha bwana au mwenye mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Mhusika wa «atawatuma» hajatajwa wazi katika Kigiriki; inaelekea zaidi kuwa ni mtu aliyesema nao, ambaye angewatuma wanyama hao.
    reason: ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: mtu yeyote akiwaambia jambo lolote
  rationale: Muundo huu unaendeleza sharti lisilo na mhusika maalumu. “Akiwaambia jambo lolote” ni Kiswahili cha kawaida kinachohifadhi upana wa λέγω pamoja na τι bila kuibana maana kuwa kuuliza tu.
- source_word: ἐρεῖτε
  choice: mtasema
  rationale: Wakati ujao wa Kigiriki una nguvu ya agizo hapa. “Mtasema” huhifadhi umbo hilo na katika muktadha hueleweka kama maagizo kwa wanafunzi.
- source_word: Ὁ κύριος
  choice: Bwana
  rationale: “Bwana” huhifadhi uzito wa κύριος kama jina la mamlaka na uwezekano wa rejeo kwa Yesu, bila kuamua kabisa dhidi ya maana ya kawaida ya mwenye mamlaka.
- source_word: αὐτῶν χρείαν ἔχει
  choice: anawahitaji
  rationale: Kiswahili cha asili hutumia kitenzi “kuhitaji” badala ya kuiga moja kwa moja nahau ya Kigiriki “ana uhitaji wao.” Kiambishi “-wa-” kinarejelea wanyama wawili waliotajwa katika muktadha.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Hueleza tendo la haraka kwa lugha ya kawaida na yenye heshima.
- source_word: ἀποστελεῖ αὐτούς
  choice: atawatuma
  rationale: Huhifadhi maana ya msingi ya “kuwatuma” na haiongezi wazo la kuwarudisha, ambalo halijaelezwa wazi katika Kigiriki.
theological_decisions:
- issue: Rejeo na nguvu ya Ὁ κύριος
  choice: Bwana
  alternative: bwana wao / mwenyewe
  rationale: “Bwana” huhifadhi maana ya cheo chenye mamlaka na uwezekano wa uzito wa kikristolojia katika kauli ya Yesu. Tafsiri ya “mwenyewe” ingeelekeza sana kwa mmiliki wa kawaida wa wanyama.
- issue: Mhusika wa ἀποστελεῖ
  choice: naye atawatuma
  alternative: Bwana atawatuma
  rationale: Kitenzi cha Kigiriki hakimtaji mhusika kwa jina. Mhusika anayeeleweka kwa kawaida ni mtu aliyewaambia wanafunzi, lakini sarufi inaweza kusomwa kwa njia nyingine; kwa hiyo tafsiri na tanbihi vinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jambo lolote” huepuka kufasiri usemi huo kama swali pekee, na “mara moja” ni wazi kwa wasomaji wa kawaida.
