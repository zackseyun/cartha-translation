  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: sw
  text: Wakawaleta punda jike na mwana-punda, wakaweka nguo zao za nje juu yao, naye akaketi juu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaketi juu ya nguo” zilizokuwa zimewekwa juu ya wanyama.
    reason: Kiwakilishi cha wingi katika Kigiriki kinaweza kurejelea nguo badala ya wanyama.
lexical_decisions:
- source_word: ἤγαγον
  choice: Wakawaleta
  rationale: Kitenzi ἄγω kinaweza kumaanisha kuleta au kuongoza. Katika simulizi hili, “wakawaleta” kinaeleza kwa kawaida kwamba wanafunzi waliwafikisha wanyama kwa Yesu.
- source_word: τὴν ὄνον
  choice: punda
  rationale: ὄνος humaanisha punda; ingawa kifungu cha Kigiriki kinaonyesha jinsia ya kike kisarufi na muktadha unaonyesha ni punda jike, “punda” ni neno la kawaida na la asili katika Kiswahili bila kuongeza ufafanuzi usio lazima hapa.
- source_word: τὸν πῶλον
  choice: mwana-punda
  rationale: πῶλος ni mnyama mchanga, na katika muktadha huu ni mwana wa punda. “Mwana-punda” ni wazi zaidi kwa msomaji wa Kiswahili kuliko neno linaloweza kueleweka kama mtoto wa farasi.
- source_word: τὰ ἱμάτια
  choice: nguo zao za nje
  rationale: ἱμάτια ni mavazi ya nje. “Nguo zao za nje” ni Kiswahili cha kawaida na kinaonyesha kwa uwazi aina ya mavazi yaliyowekwa juu ya wanyama; “zao” hutokana na muktadha wa wanafunzi.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν
  choice: wakaweka ... juu yao
  rationale: Tafsiri hii inadumisha tendo la kuweka na kiwakilishi cha wingi kinachowarejelea punda na mwana-punda.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: naye akaketi juu yao
  rationale: Kigiriki kina kiwakilishi cha wingi ambacho kinaweza kuwarejelea wanyama au nguo. Kauli “juu yao” inadumisha wingi na kutatua maana kwa kiwango kidogo iwezekanavyo; tanbihi inaonyesha uwezekano wa nguo kuwa rejeleo.
theological_decisions:
- issue: Rejeleo la kiwakilishi cha mwisho αὐτῶν katika ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Kudumisha wingi kwa kusema “akaketi juu yao” bila kuamua wazi kama rejeleo ni wanyama au nguo.
  alternative: “Akaketi juu ya nguo” zilizowekwa juu ya wanyama.
  rationale: Utata huu ni wa kisarufi na kisimulizi, si fundisho maalumu. Matini kuu inadumisha mvutano wa Kigiriki, na tanbihi inaeleza tafsiri nyingine ya kawaida bila kuifanya kuwa ndiyo maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Mwana-punda” huepuka utata wa “mwana” pekee, na “nguo za nje” ni rahisi kueleweka kuliko istilahi nzito ya mavazi. Muundo wa mwisho umeachwa na kiwango fulani cha utata ili kuakisi matini ya Kigiriki.
