id: MAT.21.23
reference: Matthew 21:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: sw
  text: Yesu alipoingia katika eneo la Hekalu[a], makuhani wakuu na wazee wa watu walimjia alipokuwa akifundisha, wakamuuliza, “Unafanya mambo haya kwa mamlaka gani? Na ni nani aliyekupa mamlaka hii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha eneo lote la Hekalu, si jengo la patakatifu pa ndani pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Yesu alipoingia
  rationale: Muundo wa genitivi huru una maana ya wakati. Kutaja Yesu kwa jina ni jambo la kawaida katika Kiswahili na huondoa utata wa kiwakilishi bila kuongeza maana mpya.
- source_word: ἱερὸν
  choice: eneo la Hekalu
  rationale: ἱερόν humaanisha eneo zima la Hekalu, si patakatifu pa ndani pekee; tafsiri hii inaweka wazi tofauti hiyo kwa lugha ya kawaida.
- source_word: προσῆλθον αὐτῷ
  choice: walimjia
  rationale: Kitenzi hiki kinaonyesha kwamba viongozi walimsogelea Yesu; “walimjia” ni kifupi na cha asili katika simulizi la Kiswahili.
- source_word: διδάσκοντι
  choice: alipokuwa akifundisha
  rationale: Kauli endelevu inaonyesha kuwa kumjia kwao kulitokea wakati Yesu akiendelea kufundisha.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Wingi huu unawataja viongozi wa ukuhani, wala si watu kadhaa wenye cheo kimoja cha kuhani mkuu.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: wazee wa watu
  rationale: Hawa ni viongozi waliotambuliwa miongoni mwa watu; tafsiri inafuata muundo na maana ya Kigiriki kwa uwazi.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: kwa mamlaka gani
  rationale: Kirai hiki kinahoji msingi au idhini halali ya matendo ya Yesu.
- source_word: ταῦτα ποιεῖς
  choice: unafanya mambo haya
  rationale: Wakati uliopo wa Kigiriki unafaa kutafsiriwa kama tendo la sasa katika changamoto hii ya moja kwa moja.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: ni nani aliyekupa mamlaka hii
  rationale: Huhifadhi swali kuhusu mtu aliyempa Yesu mamlaka na huwakilisha kwa kawaida tendo la kutoa lililo katika aoristi.
theological_decisions:
- issue: Maana ya ἐξουσία katika changamoto ya viongozi
  choice: mamlaka
  alternative: haki; uwezo
  rationale: Muktadha unahusu idhini halali ya Yesu ya kutenda na kufundisha, si nguvu au uwezo peke yake. “Mamlaka” huhifadhi uzito wa kitaasisi na wa kitheolojia bila kuamua kimbele chanzo chake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hekalu” limeandikwa kwa herufi kubwa kwa kuwa linarejelea Hekalu la Yerusalemu; “eneo la Hekalu” huwasilisha kwa uwazi maana pana ya ἱερόν.
