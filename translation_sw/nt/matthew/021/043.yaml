  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: sw
  text: 'Kwa hiyo, ninawaambia: Ufalme wa Mungu utaondolewa kwenu na kupewa taifa[a] litakalozaa matunda ya ufalme huo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu.” Neno la Kigiriki ἔθνει linaweza kumaanisha taifa au kundi la watu. Hapa linataja jumuiya inayotambulishwa kwa kuzaa matunda, bila kubainisha zaidi ni nani anayekusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na mfano na nukuu iliyotangulia, kwa Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni usemi wa moja kwa moja unaohifadhi nafsi ya kwanza na wingi wa wanaoambiwa.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: utaondolewa kwenu
  rationale: Huhifadhi hali ya kutendwa, wakati ujao, na wazo la kutenganishwa na waliokuwa nao.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ufalme wa Mungu
  rationale: Huhifadhi upana wa maana ya βασιλεία, yaani utawala na milki, bila kuifupisha kuwa dhana moja tu.
- source_word: δοθήσεται
  choice: na kupewa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha pili huku ikisomeka kwa ufasaha katika Kiswahili.
- source_word: ἔθνει
  choice: taifa
  rationale: Ni kisawe cha moja kwa moja cha kikundi cha watu kilichotajwa kwa umoja; hakibainishi kimbele kuwa ni Mataifa, kanisa, au kundi jingine maalumu.
- source_word: ποιοῦντι
  choice: linalozaa
  rationale: Katika sitiari ya matunda, ‘kuzaa’ ni Kiswahili cha kawaida na huonyesha tendo endelevu la kutoa matokeo.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: matunda yake
  rationale: Huhifadhi wingi wa καρπούς na kiwakilishi ambacho kwa kawaida humrejelea Ufalme wa Mungu, bila kufafanua matunda hayo kwa njia finyu.
theological_decisions:
- issue: Kirejelewa cha ἔθνει
  choice: taifa
  alternative: watu; kanisa; Mataifa; watu wa Mungu waliofanywa upya
  rationale: Neno la Kigiriki humtaja mpokeaji wa kijumuiya anayetambulishwa kwa kuzaa matunda, lakini halilazimishi tafsiri kutaja kundi fulani la baadaye. Tafsiri pana huhifadhi mvutano wa kifungu na huepuka kuingiza hitimisho la kimadhehebu.
- issue: Maana ya ‘Ufalme wa Mungu’ katika tamko hili la hukumu
  choice: Ufalme wa Mungu
  alternative: utawala wa Mungu; fursa za kuwa watu wa Mungu
  rationale: Usemi wa asili umehifadhiwa ili kuacha wigo wake kamili wa kitheolojia badala ya kuufasiri kwa maana moja tu.
- issue: Kirejelewa cha ‘yake’ katika ‘matunda yake’
  choice: Kiwakilishi kimehifadhiwa bila ufafanuzi wa ziada
  alternative: matunda ya Ufalme; matunda ya taifa
  rationale: Kwa sarufi ya Kigiriki, αὐτῆς kwa kawaida humrejelea βασιλεία, yaani Ufalme; hata hivyo, Kiswahili cha ‘matunda yake’ huhifadhi muundo wa chanzo bila kuongeza ufafanuzi usio katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa moja kwa moja na sitiari ya kuzaa matunda imehifadhiwa.
