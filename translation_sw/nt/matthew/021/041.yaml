  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: sw
  text: Wakamwambia, “Atawaangamiza vibaya watu hao waovu[a], kisha atalikodisha shamba la mizabibu kwa wakulima wengine[b], ambao watampa mazao kwa nyakati zinazofaa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kwa msisitizo, kwa namna ya mchezo wa maneno, “waovu atawaangamiza vibaya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atalipangisha shamba la mizabibu kwa wapangaji wengine.”
    reason: lexical_alternative
  - marker: c
    text: Au, “watampa mavuno kwa majira yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Ingawa kitenzi cha Kigiriki kiko katika wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi unasikika wa kawaida katika Kiswahili na unaendeleza mtiririko wa simulizi.
- source_word: Κακοὺς κακῶς
  choice: vibaya sana watu hao waovu
  rationale: Kigiriki kinarudia mzizi mmoja katika kivumishi na kielezi ili kusisitiza ubaya wao na ukali wa hukumu. Kiswahili hiki kinawasilisha msisitizo huo kwa lugha ya kawaida, huku tanbihi ikionyesha mchezo wa maneno wa asili.
- source_word: ἀπολέσει
  choice: atawaangamiza
  rationale: Neno hili linaonyesha hukumu ya kuharibu kabisa bila kulazimisha namna mahususi ya kifo au adhabu.
- source_word: τὸν ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hili ni neno la kawaida na lililo wazi kwa vineyard, nalo linahifadhi taswira ya kilimo ya mfano.
- source_word: ἐκδώσεται
  choice: atalikodisha
  rationale: Katika muktadha huu neno linamaanisha kulitoa shamba kwa wapangaji ili walilime kwa makubaliano ya kodi.
- source_word: ἄλλοις γεωργοῖς
  choice: kwa wakulima wengine
  rationale: γεωργοί ni walimaji wa shamba; ‘wakulima’ ni Kiswahili cha kawaida, huku wazo la upangaji likibebwa na ‘atalikodisha.’
- source_word: οἵτινες
  choice: ambao
  rationale: Kiwakilishi hiki kinaunganisha wakulima hao na sifa yao ya kutoa mazao yanayodaiwa, bila kuongeza uzito usio wa kawaida katika Kiswahili.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: watampa
  rationale: Hapa ἀποδίδωμι ni kutoa kile kinachomstahili mwenye shamba; ‘watampa’ ni wazi na ya kawaida bila kuifanya lazima kuwa malipo ya fedha.
- source_word: τοὺς καρποὺς
  choice: mazao
  rationale: Katika muktadha wa shamba la mizabibu, ‘mazao’ huonyesha vizuri mavuno yanayodaiwa, huku ikidumisha uwezekano wa maana ya kimfano.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: kwa majira yake
  rationale: καιροί ni nyakati au majira yanayofaa. Usemi huu unadumisha taswira ya kilimo na wazo la kutoa mazao kwa wakati wake.
theological_decisions:
- issue: Ukali na namna ya hukumu katika jibu la wasikilizaji
  choice: Atawaangamiza vibaya sana watu hao waovu
  alternative: Atawafikisha watu hao waovu kwenye mwisho mbaya
  rationale: Tafsiri inadumisha ukali wa hukumu na mwangwi wa maneno ya Kigiriki, lakini haibainishi namna ya maangamizi au kuingiza fundisho mahususi kuhusu adhabu ambalo mstari wenyewe haulitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Shamba la mizabibu,’ ‘wakulima,’ na ‘mazao’ hudumisha mazingira ya kilimo, huku tanbihi zikihifadhi mchezo wa maneno na maana mbadala za upangaji na wakati wa mavuno.
