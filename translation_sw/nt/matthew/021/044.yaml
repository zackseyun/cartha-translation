  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: sw
  text: Na yeyote anayeanguka juu ya jiwe hili atavunjika vipande-vipande; lakini jiwe hilo likimwangukia mtu yeyote, litamponda kabisa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa taswira dhahiri zaidi, “litamsaga kuwa unga” au “litamtawanya kama makapi.”
    reason: lexical_alternative
  - marker: b
    text: Mstari huu haupo katika baadhi ya hati za kale za Mathayo, ingawa una kifungu kinacholingana katika Luka 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: yeyote anayeanguka
  rationale: Kirai nomino chenye kitenzi-shirikishi humrejelea mtu kwa ujumla; ‘yeyote anayeanguka’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya kimethali.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: juu ya jiwe hili
  rationale: Tafsiri ya moja kwa moja ya uhusiano wa mahali, ikihifadhi ‘jiwe’ na muunganiko wake na picha ya jiwe katika muktadha.
- source_word: συνθλασθήσεται
  choice: atavunjika vipandevipande
  rationale: Kauli tendwa ya wakati ujao inaonyesha kuvunjwa vibaya; usemi huu ni wazi na unatofautishwa na tendo kali zaidi la λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: lakini jiwe hilo likimwangukia mtu yeyote
  rationale: 'Muundo huu unaonyesha mwelekeo uliogeuzwa: sasa jiwe ndilo linaloanguka. ‘Likimwangukia mtu yeyote’ huwasilisha hali isiyo na mhusika maalumu kwa Kiswahili asilia.'
- source_word: λικμήσει
  choice: litamponda kabisa
  rationale: Kitenzi kinaweza kumaanisha kuponda hadi kuwa unga au kutawanya kama makapi; ‘kuponda kabisa’ ni chenye nguvu, kinaeleweka, na hakifungi maana katika picha moja tu.
- source_word: αὐτόν
  choice: -m- katika ‘litamponda’
  rationale: Kiambishi cha yambwa cha umoja humrejelea mtu aliyetajwa bila kulazimisha jinsia ambayo sarufi ya Kiswahili haihitaji.
theological_decisions:
- issue: Picha ya jiwe na sitiari ya hukumu
  choice: Kuhifadhi lugha halisi ya ‘jiwe’ na matokeo mawili tofauti bila ufafanuzi wa kitheolojia ndani ya andiko.
  alternative: Kulitambulisha jiwe waziwazi kuwa Masihi/Yesu, au kuunganisha vitenzi viwili kuwa wazo moja la kuangamiza.
  rationale: Muktadha unaelekeza utambulisho wa jiwe, lakini mstari wenyewe una usemi wa kimethali. Tafsiri huhifadhi ukali na mvutano wa picha bila kuongeza ufafanuzi.
- issue: Rejeo la mtu wa kijumla
  choice: Kutumia ‘mtu yeyote’ pamoja na kiambishi cha umoja ‘-m-’.
  alternative: Kutumia wingi au kuongeza neno lenye jinsia ya kiume.
  rationale: Kigiriki kina umoja wa kiume wa kijumla, lakini Kiswahili huonyesha umoja wa mtu bila kuweka jinsia; hivyo idadi na urejeo wa kijumla huhifadhiwa kwa njia ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vipandevipande’ na ‘kuponda kabisa’ vinaeleweka kwa wasomaji wa kawaida na huhifadhi tofauti kati ya vitenzi viwili. Alama [b] imewekwa baada ya kishazi kinachohusika na tofauti ya hati, na [a] baada ya kitenzi ambacho maelezo yake yanatoa maana mbadala.
