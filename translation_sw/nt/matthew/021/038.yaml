  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: sw
  text: Lakini wakulima wapangaji walipomwona mwana, wakaambiana, “Huyu ndiye mrithi. Njooni, tumuue na tuchukue urithi wake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “tuwe na urithi wake”; katika muktadha maana ni kuuchukua uwe milki yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: wakulima wapangaji
  rationale: Katika muktadha wa mfano, hawa ni wakulima waliokabidhiwa shamba la mizabibu na mwenyewe, si wafanyakazi wa kawaida tu. “Wakulima wapangaji” huonyesha kwa ufupi jukumu lao la kulima mali ya mtu mwingine.
- source_word: ἰδόντες
  choice: walipomwona
  rationale: Kauli ya wakati huwasilisha kwa Kiswahili cha kawaida tendo lililotangulia mazungumzo yao.
- source_word: τὸν υἱόν
  choice: mwana
  rationale: Kigiriki kinasema “mwana” bila kiwakilishi cha umilikaji katika mstari huu. Muktadha tayari unaonyesha kuwa ni mwana wa mwenye shamba.
- source_word: ἐν ἑαυτοῖς
  choice: wakaambiana
  rationale: Kifungu hiki kinaonyesha kuwa walizungumza wao kwa wao ndani ya kundi lao. “Wakaambiana” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo ya pamoja.
- source_word: κληρονόμος
  choice: mrithi
  rationale: “Mrithi” ni neno la kawaida na sahihi lenye maana ya kisheria ya mtu anayepokea urithi.
- source_word: δεῦτε
  choice: Njooni
  rationale: Huu ni mwito wa kuwataka washiriki katika tendo linalopendekezwa. Wingi “Njooni” unalingana na kundi linalosemezana.
- source_word: ἀποκτείνωμεν
  choice: tumuue
  rationale: Hali ya kuhimiza tendo la pamoja inawasilishwa kwa kawaida kwa “tumuue,” bila kuongeza wazo la hukumu rasmi au neno lenye tafsiri ya ziada kama “tumwue kikatili.”
- source_word: σχῶμεν
  choice: tuchukue
  rationale: Kimsingi kitenzi kinaweza kumaanisha “tuwe na,” lakini katika mpango wa kumuua mrithi ili kupata mali yake, “tuchukue” huwasilisha kwa kawaida kujipatia au kutwaa milki hiyo. Tanbihi inahifadhi tafsiri ya moja kwa moja zaidi.
- source_word: κληρονομίαν αὐτοῦ
  choice: urithi wake
  rationale: “Urithi” ni kisawe cha moja kwa moja cha κληρονομία, na “wake” huonyesha wazi αὐτοῦ pamoja na mantiki ya mpango wao.
theological_decisions:
- issue: Rejeo la kimfano la mwana
  choice: Kutafsiri υἱός kwa “mwana” bila kutaja moja kwa moja kwamba anamwakilisha Yesu
  alternative: Kutafsiri kwa namna ya kifafanuzi inayomtambulisha mwana kuwa Yesu
  rationale: Katika simulizi la Mathayo mfano huu unaelekea kwa Yesu, lakini mstari wenyewe unabaki katika kiwango cha hadithi. “Mwana” huhifadhi taswira ya mfano na mvutano wake wa kiteolojia bila kuingiza ufafanuzi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Wakaambiana” na “Njooni, tumuue” huleta mazungumzo ya moja kwa moja kwa lugha inayoeleweka, huku “wakulima wapangaji,” “mrithi,” na “urithi” zikihifadhi mahusiano ya kijamii na kisheria ya matini.
