  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: sw
  text: Walipokaribia Yerusalemu na kufika Bethfage[a], kwenye Mlima wa Mizeituni, ndipo Yesu akawatuma wanafunzi wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walipokaribia Yerusalemu na kufika Bethfage, kuelekea Mlima wa Mizeituni.”
    reason: Huhifadhi uwezekano wa kuelewa εἰς kwa maana ya mwelekeo badala ya mahali Bethfage ilipokuwa.
lexical_decisions:
- source_word: ἤγγισαν
  choice: walipokaribia
  rationale: Kitenzi hiki kinaonyesha kusogea karibu na mahali; “walipokaribia” ni Kiswahili cha kawaida na huhifadhi tendo la kuelekea Yerusalemu.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἦλθον
  choice: kufika
  rationale: Katika mfululizo huu wa safari, “kufika” hutofautisha kwa kawaida hatua ya kufikia Bethfage na hatua ya kwanza ya kukaribia Yerusalemu.
- source_word: Βηθφαγὴ
  choice: Bethfage
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: kwenye Mlima wa Mizeituni
  rationale: Kirai hiki kinaweka Bethfage katika eneo la Mlima wa Mizeituni; “kwenye” ni cha kawaida na hakidokezi kuingia ndani ya mlima.
- source_word: τότε
  choice: ndipo
  rationale: “Ndipo” huonyesha kwa ufupi na kwa kawaida hatua inayofuata katika simulizi.
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Hiki ni kitenzi cha kawaida cha Kiswahili kwa kumwagiza mtu aende kutekeleza jambo; kiambishi “-wa-” kinaonyesha wanafunzi wawili kama watendewa.
- source_word: δύο μαθητὰς
  choice: wanafunzi wawili
  rationale: “Wanafunzi” ni tafsiri ya kawaida ya μαθηταί katika simulizi za Injili, na mpangilio wa nomino kisha idadi ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Mtendaji wa vitenzi vya wingi kabla Yesu hajatajwa kwa jina
  choice: Kutumia “walipokaribia ... na kufika” bila kuongeza “Yesu na wanafunzi wake,” kisha kumtaja Yesu pale Kigiriki kinapomtaja.
  alternative: “Yesu na wanafunzi wake walipokaribia ...”
  rationale: Vitenzi vya Kigiriki vina mtendaji wa wingi anayeeleweka kutokana na muktadha, lakini mstari huu haumtajii wazi kuwa “Yesu na wanafunzi wake.” Tafsiri haiongezi maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa kiasili bila kuondoa mpangilio wa matukio katika Kigiriki.
