  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: sw
  text: Alipoingia Yerusalemu, mji mzima ulisisimka, ukisema, “Huyu ni nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Alipoingia
  rationale: Kirai huru cha hali ya wakati katika Kigiriki kimetafsiriwa kwa kishazi cha wakati cha Kiswahili. “Alipoingia” ni cha kawaida na hakilazimishi maana ya kwamba tukio lilitokea baada ya kuingia kwake kukamilika.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika matumizi ya Biblia ya Kiswahili.
- source_word: ἐσείσθη
  choice: ulisisimka
  rationale: Kitenzi σείω kimsingi huhusu kutikisa, lakini hapa kinaeleza msukosuko au taharuki ya watu wa mjini walipoitikia kuingia kwa Yesu. “Ulisisimka” ni usemi wa asili unaoweza kueleza mji mzima kuingiwa na taharuki bila kudokeza lazima tetemeko halisi.
- source_word: πᾶσα ἡ πόλις
  choice: mji wote
  rationale: Ni tafsiri ya kawaida na wazi ya usemi wa Kigiriki unaowakilisha wakazi wote wa mji kwa kutaja mji wenyewe.
- source_word: λέγουσα
  choice: na kusema
  rationale: Ingawa umbo la Kigiriki ni kishiriki kinachopatana na “mji,” Kiswahili cha kawaida hutumia kitenzi sambamba. “Kusema” huhifadhi muundo wa chanzo bila kufasiri swali moja kwa moja kuwa “kuuliza.”
- source_word: Τίς ἐστιν οὗτος;
  choice: Huyu ni nani?
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida; haiongezi neno “mtu,” ambalo halipo wazi katika Kigiriki.
theological_decisions:
- issue: Maana halisi au ya kitamathali ya mwitikio wa mji
  choice: Kutafsiri ἐσείσθη kwa maana ya kitamathali kuwa “ulisisimka.”
  alternative: “ulitikisika” au “ulikuwa katika taharuki”
  rationale: Muktadha unaeleza mwitikio wa pamoja wa wakazi kwa kuingia kwa Yesu, si lazima tetemeko la ardhi. Tafsiri kuu inaeleza msukosuko huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa asili, huku tashihisi ya “mji” ukisema ikihifadhiwa kama ilivyo katika chanzo.
