  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: sw
  text: Wala usiape kwa kichwa chako, kwa sababu huwezi kufanya hata unywele mmoja kuwa mweupe au mweusi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Wala usi-
  rationale: Inaendeleza mfululizo wa makatazo yaliyotangulia; “wala” huunganisha katazo hili kwa njia ya kawaida katika Kiswahili.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: kwa kichwa chako
  rationale: Pamoja na ὀμόσῃς, kirai hiki hutaja kitu kinachoapiwa; “kuapa kwa kichwa chako” huhifadhi maana hiyo moja kwa moja.
- source_word: ὀμόσῃς
  choice: usiape
  rationale: Kauli tegemezi ya wakati uliopita baada ya μήτε inatoa katazo; “usiape” ni ya moja kwa moja, ya sasa, na yenye hadhi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huanzisha sababu ya katazo kwa uwazi.
- source_word: οὐ δύνασαι
  choice: huwezi
  rationale: Hueleza kutokuwa na uwezo kwa Kiswahili cha kawaida bila kupunguza mkazo wa maandishi.
- source_word: μίαν τρίχα
  choice: hata unywele mmoja
  rationale: “Unywele mmoja” huhifadhi umoja na mkazo wa μίαν; “hata” huonyesha kwamba uwezo huo haupo hata kwa kitu hiki kidogo.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: mweupe au mweusi
  rationale: Huhifadhi maneno ya msingi ya rangi na utofautishaji wake wa moja kwa moja.
- source_word: ποιῆσαι
  choice: kufanya ... kuwa
  rationale: Katika muktadha huu ποιέω humaanisha kusababisha kitu kiwe katika hali fulani; muundo huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Upeo wa katazo kuhusu kuapa
  choice: Kauli imetafsiriwa kama katazo la moja kwa moja la kuapa kwa kichwa cha mtu.
  alternative: Kupanua mstari huu uwe katazo kamili la kila aina ya kiapo, au kuufanya uhusu tu viapo vya hila.
  rationale: Mstari wenyewe unataja kuapa kwa kichwa na kutoa sababu ya kutokuwa na uwezo kwa mwanadamu. Tafsiri haipaswi kuamua mjadala mpana wa kitheolojia ambao mstari huu peke yake hauuelezi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. “Unywele” limetumiwa badala ya “nywele” ili kuonyesha wazi unywele mmoja.
