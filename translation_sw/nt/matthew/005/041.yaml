  text: Na mtu yeyote akikulazimisha kwenda maili moja[a][b], nenda pamoja naye maili mbili.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kumaanisha kumshurutisha mtu kutoa huduma kwa amri ya mamlaka; huenda kikirejelea huduma ya kulazimishwa katika utawala wa Kirumi.
