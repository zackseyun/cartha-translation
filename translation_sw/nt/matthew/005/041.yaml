lexical_decisions:
- source_word: ὅστις
  choice: mtu yeyote
  rationale: Kiwakilishi hiki cha uhusiano kisicho maalumu kinaonyesha hali ya jumla; “mtu yeyote” ni Kiswahili cha kawaida na huhifadhi upana huo.
- source_word: ἀγγαρεύσει
  choice: akikulazimisha kwenda
  rationale: Kitenzi hiki humaanisha kumshurutisha mtu afanye huduma, hasa kwa amri ya mamlaka. Tafsiri hii inaonyesha wazi kulazimishwa, huku wazo la kwenda likitokana na kipimo cha umbali kinachofuata.
- source_word: μίλιον ἕν
  choice: maili moja
  rationale: Hii ni maili ya Kirumi. “Maili moja” huhifadhi kipimo halisi na mpangilio wa namba na nomino.
- source_word: ὕπαγε
  choice: nenda
  rationale: Amri hii ina maana ya kwenda au kuendelea; “nenda” ni ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: μετά pamoja na hali ya umilikishi huonyesha kuandamana; “pamoja naye” ni tafsiri ya asili na iliyo wazi.
- source_word: δύο
  choice: maili mbili
  rationale: Katika Kigiriki nomino “maili” imeachwa lakini inaeleweka kutokana na kishazi kilichotangulia. Kuirejesha katika Kiswahili hufanya sentensi iwe ya kawaida bila kuongeza maana mpya.
theological_decisions:
- issue: Muktadha wa kihistoria wa huduma ya kulazimishwa na mamlaka
  choice: Kutafsiri kauli kama sharti la kulazimishwa bila kuwataja askari Waroma katika matini kuu.
  alternative: Kueleza moja kwa moja kuwa anayelazimisha ni askari Mroma.
  rationale: Kitenzi ἀγγαρεύω na kipimo cha maili vinaweza kukumbusha desturi ya mamlaka ya Kirumi ya kuwalazimisha watu kutoa huduma, lakini matini yenyewe haiwataji askari. Tafsiri huhifadhi hali ya kulazimishwa bila kuingiza mhusika ambaye hajatajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akikulazimisha kwenda” ni wazi kwa msomaji wa kawaida, na “pamoja naye” husikika kwa urahisi zaidi kuliko muundo wa kale au mgumu.
