  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: sw
  text: “Mmesikia kwamba ilisemwa, ‘Usizini.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Mmesikia
  rationale: Kauli hii ya utangulizi hurejelea jambo ambalo wasikilizaji walilisikia zamani na ambalo bado wanalifahamu; wakati timilifu wa Kiswahili unawasilisha nguvu hiyo kwa njia ya kawaida.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha maudhui ya jambo lililosikiwa.
- source_word: ἐρρέθη
  choice: ilisemwa
  rationale: Kauli tendwa isiyo na mtendaji aliyetajwa inalingana kwa karibu na muundo wa Kigiriki bila kumtaja msemaji ambaye matini haimtaji.
- source_word: Οὐ μοιχεύσεις
  choice: Usizini
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili, huku likihifadhi maana sahihi ya amri dhidi ya uzinzi na mwangwi wa Amri Kumi.
theological_decisions:
- issue: Uhusiano na nukuu ya Amri Kumi
  choice: Usizini.
  alternative: Usifanye uzinzi.
  rationale: “Usizini” ni muundo mfupi wa amri unaoeleweka kwa urahisi na unaohifadhi mwangwi wa katazo la Amri Kumi bila kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo tendwa “ilisemwa” umehifadhiwa kwa sababu Kigiriki hakimtaji msemaji.
