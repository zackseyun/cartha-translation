  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: sw
  text: Lakini mimi nawaambia kwamba kila mtu anayemtazama mwanamke kwa kusudi la kumtamani, tayari amefanya uzinzi naye moyoni mwake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “anayemtazama mwanamke ili kumtamani.”'
    reason: Njia nyingine ya kuonyesha maana ya kusudi katika πρὸς τὸ ἐπιθυμῆσαι.
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “mwanamke” linaweza pia kumaanisha “mke,” kutegemea muktadha.
    reason: Huhifadhi uwezekano wa kileksika wa γυνή bila kuubana mstari mkuu.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Lakini mimi nawaambia
  rationale: “Lakini” huhifadhi utofautishaji wa δέ, na kiwakilishi “mimi” huonyesha msisitizo wa ἐγώ. “Nawaambia” ni Kiswahili cha kawaida na chenye hadhi kwa λέγω ὑμῖν.
- source_word: πᾶς ὁ βλέπων
  choice: kila mtu anayemtazama
  rationale: Huwasilisha maana ya jumla ya πᾶς na tendo lenye mwelekeo la βλέπων bila kulifanya kuwa kutazama kwa bahati tu.
- source_word: γυναῖκα
  choice: mwanamke
  rationale: γυνή yaweza kumaanisha mwanamke au mke kutegemea muktadha. Kauli hii ya jumla haitaji wazi hali ya ndoa, kwa hiyo “mwanamke” inaepuka kuibana maana.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτήν
  choice: kwa kusudi la kumtamani
  rationale: “Kwa kusudi la” huhifadhi wazi dhana ya kusudi au nia katika πρὸς pamoja na infinitivu yenye kibainishi. “Kumtamani” ni ya kawaida katika Kiswahili na katika muktadha huu inaonyesha tamaa ya kingono isiyofaa.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: tayari amefanya uzinzi naye
  rationale: “Tayari” hulingana na ἤδη. Kiswahili cha kawaida husema “kufanya uzinzi na” badala ya kuunda kitenzi kisicho cha kawaida chenye yambwa wa moja kwa moja.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: moyoni mwake
  rationale: Huhifadhi taswira ya kibiblia ya καρδία kama kitovu cha mawazo, nia, na tamaa, huku ikiwa usemi wa asili wa Kiswahili.
theological_decisions:
- issue: Iwapo γυνή itafsiriwe “mwanamke” au “mke” katika kauli kuhusu uzinzi
  choice: mwanamke
  alternative: mke
  rationale: Neno la Kigiriki halibainishi wazi hali ya ndoa. “Mwanamke” huhifadhi upana wa chanzo, huku muktadha wa uzinzi ukiendelea kuonyesha uzito wa kimaadili.
- issue: Iwapo ἐπιθυμέω itafsiriwe kwa neno la jumla “kutamani” au kwa usemi unaosisitiza tamaa ya kingono
  choice: kumtamani
  alternative: kumwangalia kwa tamaa
  rationale: Kitenzi cha Kigiriki kina wigo mpana, lakini hapa muktadha unahusu tamaa ya kingono isiyofaa. “Kumtamani” huhifadhi uwazi wa kileksika bila kuondoa maana inayotolewa na muktadha.
- issue: Iwapo πρὸς τὸ ἐπιθυμῆσαι inaonyesha kusudi la kutazama au matokeo ya kutazama
  choice: kwa kusudi la kumtamani
  alternative: hata akamtamani
  rationale: Muundo wa πρὸς pamoja na infinitivu yenye kibainishi kwa kawaida unaonyesha kusudi au nia. Tafsiri haipaswi kugeuza kauli kuwa hukumu ya mtazamo wowote unaofuatwa tu na hisia isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Usemi “kwa kusudi la” umetumiwa ili kuhifadhi kipengele muhimu cha nia katika Kigiriki; “moyoni mwake” hudumisha nahau ya kibiblia iliyozoeleka.
