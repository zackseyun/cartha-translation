  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: sw
  text: 'Lakini mimi nawaambia: Wapendeni adui zenu, na waombeeni wale wanaowatesa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Lakini mimi nawaambia
  rationale: “Lakini” linahifadhi tofauti inayotambulishwa na δέ, huku “mimi” likionyesha msisitizo wa ἐγώ. “Nawaambia” ni Kiswahili cha kawaida na chenye hadhi kwa λέγω ὑμῖν.
- source_word: ἀγαπᾶτε
  choice: Wapendeni
  rationale: Hili ni agizo la moja kwa moja linalohifadhi maana ya kawaida ya ἀγαπάω bila kuongeza namna mahususi ya kuonyesha upendo.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: adui zenu
  rationale: Usemi huu ni wa moja kwa moja na wa kawaida, nao haupunguzi uhasama wa kimahusiano unaomaanishwa na ἐχθρός.
- source_word: προσεύχεσθε
  choice: waombeeni
  rationale: Katika muktadha huu, kitenzi cha Kiswahili “waombeeni” huwasilisha kwa kawaida tendo la kusali kwa ajili ya watu wanaotajwa.
- source_word: ὑπὲρ
  choice: -eni katika “waombeeni”
  rationale: Kiambishi tamati cha kutendea kinaeleza kwa Kiswahili maana ya ὑπέρ, yaani kusali kwa ajili au kwa manufaa ya mtu, bila kufanya sentensi kuwa nzito.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: wale wanaowatesa
  rationale: Muundo huu unahifadhi maana ya kishiriki cha wakati wa sasa ya watu wanaoendelea kuwatendea wasikilizaji mateso, na ni wa asili katika Kiswahili cha sasa.
theological_decisions:
- issue: Upeo wa agizo kuhusu adui
  choice: Kutafsiri maagizo yote mawili moja kwa moja bila kufafanua aina ya upendo au lengo mahususi la sala.
  alternative: Kupanua “wapendeni” kuwa matendo ya kuwafanyia mema pekee, au kutaja kwamba sala iwe kwa ajili ya baraka, toba, au wokovu wao.
  rationale: Aya inaagiza kuwapenda adui na kuwaombea wanaotesa, lakini haielezi hapa matokeo yote ya kivitendo wala ombi mahususi. Tafsiri inahifadhi nguvu na mvutano wa agizo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo “Lakini mimi nawaambia” huhifadhi msisitizo wa msemaji; “wapendeni adui zenu” na “waombeeni wale wanaowatesa” ni wa kawaida na unaoeleweka kwa wasomaji wengi.
