base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: sw
  text: Mmesikia kwamba ilisemwa[a], “Mpende jirani yako na umchukie adui yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kishazi cha kwanza kina mwangwi wa Mambo ya Walawi 19:18; kishazi cha pili (“na umchukie adui yako”) si dondoo la moja kwa moja kutoka Agano la Kale, bali kinaonyesha fundisho lililopokewa ambalo Yesu analisahihisha.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Mmesikia
  rationale: Wakati uliopita wa Kigiriki katika utangulizi huu wa mafundisho hutafsiriwa kwa Kiswahili sanifu kwa hali timilifu, ikionyesha kwamba wasikilizaji wamepokea fundisho hilo hapo awali.
- source_word: ἐρρέθη
  choice: ilisemwa
  rationale: Kauli tendwa isiyotaja msemaji inahifadhiwa bila kubainisha nani aliyesema.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Wakati ujao wa Kigiriki una nguvu ya amri katika dondoo hili; kauli ya kuamuru ni ya kawaida na wazi katika Kiswahili.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: Katika muktadha huu wa maadili na mwangwi wa Mambo ya Walawi 19:18, “jirani yako” ni tafsiri iliyo wazi na ya kawaida.
- source_word: μισήσεις
  choice: umchukie
  rationale: Wakati ujao una nguvu ya amri kama katika kishazi kilichotangulia; umbo hili huendeleza kauli ya kuamuru kwa Kiswahili cha kawaida.
- source_word: τὸν ἐχθρόν σου
  choice: adui yako
  rationale: Hili ni neno la moja kwa moja na la kawaida kwa mtu mwenye uadui katika utofautishaji huu wa kimaadili.
theological_decisions:
- issue: Hadhi ya kishazi “na umchukie adui yako”
  choice: Kimetafsiriwa kama sehemu ya usemi ambao Yesu anasema wasikilizaji wake walikuwa wameusikia, bila kudokeza kwamba sehemu yote ni dondoo la moja kwa moja kutoka Agano la Kale.
  alternative: Kutenda kana kwamba mstari wote umenukuliwa moja kwa moja kutoka Maandiko, au kutaja katika matini kuu kwamba kishazi cha pili ni mapokeo ya ufafanuzi.
  rationale: Kigiriki kinatoa usemi mmoja ulioripotiwa baada ya “mmesikia kwamba ilisemwa.” Tanbihi inafafanua kwamba kishazi cha kwanza kina mwangwi wa Mambo ya Walawi 19:18, lakini cha pili si dondoo la moja kwa moja la Agano la Kale; hivyo mvutano wa matini unahifadhiwa bila kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mmesikia” ni ya kawaida kwa kundi la wasikilizaji; “ilisemwa” huhifadhi kauli tendwa isiyotaja msemaji. Amri “Mpende … umchukie” ni wazi, fupi, na ya asili.
