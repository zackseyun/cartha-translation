base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: sw
  text: Iache hapo sadaka yako mbele ya madhabahu, kisha nenda; kwanza upatane na ndugu yako[a], halafu uje uitoe sadaka yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina neno la umoja wa kiume, “ndugu”; katika muktadha huu kanuni ya kupatana inaweza kutumika kwa mahusiano kwa upana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: iache
  rationale: Katika muktadha huu kitenzi kinaamuru sadaka iachwe mahali ilipo, si kusamehewa wala kuruhusiwa.
- source_word: ἐκεῖ
  choice: hapo
  rationale: Hudumisha msisitizo wa mahali maalumu karibu na madhabahu kwa Kiswahili cha kawaida.
- source_word: τὸ δῶρόν σου
  choice: sadaka yako
  rationale: δῶρον ni kitu kinacholetwa kwa Mungu; katika mazingira ya madhabahu, “sadaka” ni ya asili na wazi zaidi kuliko “zawadi.”
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: mbele ya madhabahu
  rationale: Huwakilisha moja kwa moja uhusiano wa mahali unaoelezwa katika Kigiriki.
- source_word: ὕπαγε
  choice: uende
  rationale: Ni amri ya kwenda na inaingia kwa kawaida katika mfuatano wa maagizo.
- source_word: πρῶτον
  choice: Kwanza
  rationale: Hudumisha kipaumbele cha kupatana kabla ya kutoa sadaka.
- source_word: διαλλάγηθι
  choice: upatane
  rationale: “Patana” ni usemi wa sasa na wa kawaida unaoonyesha kurejeshwa kwa uhusiano bila kuamua kimya kimya ni upande gani unaopaswa kuanzisha au kukamilisha maridhiano.
- source_word: τῷ ἀδελφῷ σου
  choice: na ndugu yako
  rationale: Kiambishi cha udativu pamoja na διαλλάγηθι kinaelezwa kwa Kiswahili cha asili kama “patana na”; “ndugu” huhifadhi neno la uhusiano bila kulazimisha maana ya ndugu wa tumbo pekee.
- source_word: τότε
  choice: halafu
  rationale: Huonyesha wazi mfuatano wa wakati baada ya kupatana.
- source_word: ἐλθὼν
  choice: urudi
  rationale: Kwa kuwa sadaka imeachwa mbele ya madhabahu na mhusika ameagizwa aende, kurudi kunaeleza kwa asili mwendo unaodokezwa na muktadha.
- source_word: πρόσφερε
  choice: kuitoa
  rationale: Katika muktadha wa ibada, “kutoa sadaka” ni Kiswahili cha kawaida kwa kuwasilisha sadaka mbele za Mungu.
theological_decisions:
- issue: Maana na upeo wa ἀδελφός katika maadili ya mahusiano
  choice: ndugu yako
  alternative: ndugu yako wa kiume; mwamini mwenzako
  rationale: Neno la Kigiriki ni la umoja wa kiume, lakini Kiswahili “ndugu” halionyeshi jinsia bila nyongeza na linaweza kumaanisha ndugu wa jamaa au mtu wa uhusiano wa karibu. Maelezo ya chini yanahifadhi umbo la Kigiriki na uwezekano wa matumizi mapana bila kuingiza dhehebu fulani.
- issue: Nguvu ya διαλλάγηθι
  choice: upatane na
  alternative: upatanishwe na
  rationale: Umbo la Kigiriki ni amri ya kauli tendwa, lakini Kiswahili “upatanishwe” linaweza kudokeza lazima kuwe na mpatanishi wa tatu. “Upatane na” huhifadhi lengo la kurejesha uhusiano kwa lugha ya kawaida, huku pasipo kubainisha lawama au mhusika wa kwanza kuchukua hatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zinahifadhi msisitizo na mfuatano wa maagizo. “Madhabahu” na “sadaka” ni istilahi zinazotambulika kwa urahisi katika mazingira ya ibada.
