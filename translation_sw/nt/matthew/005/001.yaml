id: MAT.5.1
reference: Matthew 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: sw
  text: Alipoyaona makundi ya watu, alipanda mlimani; naye alipoketi, wanafunzi wake wakamjia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Alipoyaona
  rationale: Kirai cha wakati kinatafsiri kihusishi cha wakati uliopita kwa Kiswahili cha kawaida bila kusisitiza kwamba kuona kulikamilika muda mrefu kabla ya tendo kuu.
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi hafifu cha mpito; hakihitaji kutafsiriwa wazi katika Kiswahili, kwa kuwa ‘lakini’ kingeongeza utofautishaji usiokusudiwa.
- source_word: τοὺς ὄχλους
  choice: makundi ya watu
  rationale: Wingi wa ὄχλους umehifadhiwa. ‘Makundi ya watu’ ni wazi na wa kawaida kuliko ‘makutano,’ na haugeuzi wingi kuwa kundi moja.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: alipanda mlimani
  rationale: Huwasilisha mwendo wa kuelekea juu na kufika eneo la mlima kwa lugha ya kawaida. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na άρθρο ya Kigiriki.
- source_word: τὸ ὄρος
  choice: mlimani
  rationale: ὄρος inaweza kumaanisha mlima au eneo la kilima; ‘mlimani’ huhifadhi taswira ya mlima bila kudai jina au utambulisho wake.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: naye alipoketi
  rationale: Muundo wa genitive absolute unaonyesha mazingira ya wakati. ‘Alipoketi’ ni wa asili na haukazi mlolongo kuwa ‘baada ya kuketi’ kuliko Kigiriki kinavyolazimu.
- source_word: προσῆλθαν αὐτῷ
  choice: wakamjia
  rationale: Kitenzi hiki huonyesha kwamba walikuja kwake au wakamkaribia; ‘wakamjia’ ni kifupi, cha kawaida, na kinadumisha mtiririko wa simulizi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hili ndilo neno la kawaida la Kibiblia na la Kiswahili kwa wafuasi walio katika uhusiano wa kujifunza kutoka kwa mwalimu.
theological_decisions:
- issue: Kibainishi katika τὸ ὄρος
  choice: mlimani
  alternative: kwenye mlima ule
  rationale: Kigiriki kina kibainishi, lakini Kiswahili mara nyingi hakitumii neno kama ‘ule’ bila mlima uliotajwa au unaotambulika wazi. ‘Mlimani’ huhifadhi mazingira bila kuingiza utambulisho maalumu usiotolewa na muktadha huu.
- issue: Uhusiano wa wakati katika καθίσαντος αὐτοῦ
  choice: alipoketi
  alternative: baada ya kuketi
  rationale: Muundo unaonyesha uhusiano wa wakati au mazingira, lakini haulazimishi msisitizo mkali wa mfuatano. ‘Alipoketi’ huhifadhi upana huo na haiongezi maana ya kiibada kuhusu kuketi kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘makundi ya watu’ kuhifadhi wingi wa Kigiriki na ‘mlimani’ kwa usemi wa asili. Hakuna tanbihi iliyohitajika kwa sababu mbadala za kisarufi zinaweza kuhifadhiwa katika maamuzi ya tafsiri bila kulemea mstari.
