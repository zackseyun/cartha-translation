  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: Ἰδών imetolewa kwa kirai cha wakati “Alipoyaona”; wingi wa τοὺς ὄχλους umehifadhiwa katika “makundi ya watu”; ἀνέβη εἰς τὸ ὄρος imetolewa kiasili kwa “alipanda mlimani”; na genitive absolute καθίσαντος αὐτοῦ imetolewa bila kulazimisha mpangilio mkali kwa “alipoketi.” “Wanafunzi wake wakamjia” huwasilisha προσῆλθαν αὐτῷ kwa usahihi.'
