  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: sw
  text: Kwa hiyo, ninyi iweni wakamilifu[a], kama Baba yenu wa mbinguni alivyo mkamilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watimilifu,” “kamili,” au “wakomavu.” Neno la Kigiriki τέλειος linaweza kumaanisha utimilifu, ukamilifu, au ukomavu, pamoja na maana ya “kamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: iweni
  rationale: Ingawa ni kitenzi cha wakati ujao katika Kiyunani, hapa kimetumiwa kwa nguvu ya amri au himizo. Katika Kiswahili, “iweni” huwasilisha kusudi hilo kwa kawaida zaidi kuliko “mtakuwa,” ambalo lingeweza kueleweka kama utabiri tu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na mafundisho yaliyotangulia, hasa kuhusu kuwapenda adui.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kimetajwa wazi katika Kiyunani kwa msisitizo; “ninyi” kinahifadhi msisitizo huo katika Kiswahili.
- source_word: τέλειοι / τέλειός
  choice: wakamilifu / mkamilifu
  rationale: “Kamilifu” ni tafsiri ya moja kwa moja inayohifadhi urudiaji na nguvu ya ulinganisho. Tanbihi inaonyesha kwamba neno hilo pia linaweza kumaanisha ukamilifu wa utimilifu, uadilifu usiogawanyika, au ukomavu.
- source_word: ὡς
  choice: kama ... alivyo
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida ulinganisho kati ya wanafunzi na Baba.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yenu wa mbinguni
  rationale: Ni tafsiri ya kawaida na yenye heshima ya kirai kinachomtaja Mungu kuwa Baba yao aliye wa mbinguni.
theological_decisions:
- issue: Maana ya τέλειος katika himizo la kimaadili
  choice: Kutumia “kamilifu” katika matini kuu na kueleza upana wa maana katika tanbihi.
  alternative: timilifu, wenye ukamilifu usiogawanyika, au waliokomaa
  rationale: Tafsiri hii inadumisha nguvu kubwa ya himizo na ulinganisho na Baba, bila kuamua kimya kimya kwamba neno hilo humaanisha kutokuwa na dhambi kabisa. Muktadha wa Mathayo 5:43–47 unaelekeza hasa kwenye upendo ulio kamili na usiogawanyika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ninyi iweni” umetumiwa kuhifadhi msisitizo wa kiwakilishi cha Kiyunani, huku “iweni” ikiwasilisha nguvu ya himizo ya kitenzi cha wakati ujao.
