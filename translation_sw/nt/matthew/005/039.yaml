  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: sw
  text: 'Lakini mimi ninawaambia: msimpinge mtu mwovu.[a] Badala yake, mtu yeyote akikupiga kofi kwenye shavu lako la kulia, mgeuzie shavu lako lingine pia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiupinge uovu”; pia yawezekana, “msimpinge Yule Mwovu.”
    reason: alternative_reading
  - marker: b
    text: 'Kwa kufuata mpangilio wa maneno kwa karibu zaidi: “mgeuzie pia lile lingine.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Lakini mimi ninawaambia
  rationale: Neno “lakini” linaendeleza utofautishaji wa δέ, huku “mimi” likihifadhi mkazo wa ἐγώ na kauli yenye mamlaka ya Yesu.
- source_word: μὴ ἀντιστῆναι
  choice: msimpinge
  rationale: Kitenzi hiki humaanisha kusimama dhidi ya au kupinga. “Msimpinge” kinahifadhi maana pana ya asili bila kuifupisha kuwa kulipiza kisasi pekee.
- source_word: τῷ πονηρῷ
  choice: mtu mwovu
  rationale: Kivumishi chenye kibainishi kinaweza kumaanisha uovu, mtu mwovu, au yule Mwovu. Mfano unaofuata wa mtu anayepiga kofi unaunga mkono rejeo la mtu katika matini kuu.
- source_word: ὅστις σε ῥαπίζει
  choice: mtu yeyote akikupiga kofi
  rationale: “Mtu yeyote” linaonyesha kutokutajwa kwa mtu maalumu, na “kupiga kofi” linafaa kwa pigo la mkono kwenye shavu pamoja na dhana ya kudhalilisha.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: kwenye shavu lako la kulia
  rationale: σιαγών inaweza kuwa taya au shavu; katika muktadha wa kofi, “shavu” ni Kiswahili cha kawaida na cha asili.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: mgeuzie shavu lako lingine pia
  rationale: Kauli hii inahifadhi tendo la kugeuza na maana ya “jingine pia,” huku ikifanya kile kinachoeleweka katika Kigiriki—yaani shavu—kuwa wazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya τῷ πονηρῷ
  choice: mtu mwovu
  alternative: uovu; au yule Mwovu
  rationale: Sarufi ya Kigiriki haiondoi uwezekano wa maana ya uovu kwa ujumla au yule Mwovu. Hata hivyo, mfano unaofuata unamhusu mkosaji wa kibinadamu, kwa hiyo “mtu mwovu” linafaa katika matini kuu, huku utata wa kweli ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, lakini unadumisha mkazo wa “mimi,” amri ya wingi, na utata wa τῷ πονηρῷ kupitia tanbihi.
