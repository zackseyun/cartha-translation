lexical_decisions:
- source_word: Μακάριοι
  choice: Heri
  rationale: “Heri” ni usemi wa kawaida wa Kiswahili katika kauli za baraka na unaonyesha hali yenye kibali cha Mungu, si hisia ya furaha pekee.
- source_word: οἱ πτωχοὶ
  choice: walio maskini
  rationale: Huhifadhi maana ya watu wenye umaskini au uhitaji na nguvu ya kivumishi kilichotumiwa kama nomino, bila kuibana kuwa “waombaji.”
- source_word: τῷ πνεύματι
  choice: wa roho
  rationale: Usemi “maskini wa roho” ni mfupi na wa asili katika Kiswahili cha kibiblia, huku ukihifadhi uwazi wa kimakusudi wa Kigiriki kuliko ufafanuzi kama “wanaotambua uhitaji wao wa kiroho.”
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha wazi kuwa sehemu inayofuata ndiyo sababu ya kutangazwa kwao kuwa wenye heri.
- source_word: αὐτῶν ἐστιν
  choice: ni wao
  rationale: Huhifadhi wakati wa sasa na wazo la umiliki, bila kuugeuza kuwa ahadi ya wakati ujao.
- source_word: ἡ βασιλεία
  choice: ufalme
  rationale: “Ufalme” ni neno linaloeleweka kwa urahisi na linaweza kujumuisha mamlaka ya kifalme pamoja na eneo linalotawaliwa.
- source_word: τῶν οὐρανῶν
  choice: wa mbinguni
  rationale: Huu ndio usemi wa kawaida na wa asili wa Kiswahili kwa nahau maalumu ya Mathayo; ingawa Kigiriki kina umbo la wingi, tafsiri ya Kiswahili haihitaji kuonyesha wingi huo kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Maana ya “maskini wa roho”
  choice: Kudumisha usemi “maskini wa roho” bila kuufafanua ndani ya mstari.
  alternative: “walio maskini kiroho,” “wanyenyekevu,” au “wanaotambua uhitaji wao wa kiroho”
  rationale: Kigiriki kina usemi wenye maana pana na mvutano wa kitheolojia. Ufafanuzi katika matini kuu ungechagua maana moja ambayo chanzo hakisemi wazi.
- issue: Wakati wa sasa wa umiliki wa ufalme
  choice: “ufalme wa mbinguni ni wao”
  alternative: “ufalme wa mbinguni utakuwa wao” au “wataupokea ufalme wa mbinguni”
  rationale: Kitenzi cha Kigiriki kiko katika wakati wa sasa; tafsiri haipaswi kuhamisha umiliki huo kuwa wa wakati ujao pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Heri” na “ufalme wa mbinguni” hudumisha mtindo unaotambulika wa kauli za baraka, huku “kwa sababu” ikitoa uhusiano wa kisababishi kwa uwazi wa kisasa.
