  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: sw
  text: Heri wenye upole[b], kwa sababu wao watairithi dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Huenda maneno haya yakawa mwangwi wa Zaburi 37:11, ambako ahadi inaweza kueleweka kwa maana ya nchi katika muktadha wa agano, na pia kwa maana pana zaidi.
    reason: alternative_reading
  - marker: b
    text: Au “wapole” au “wanyenyekevu.” Hapa upole haumaanishi udhaifu, bali tabia ya upole wenye unyenyekevu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Ni kauli ya kawaida na yenye hadhi katika Kiswahili kwa makar_? beatitudes; inaonyesha hali ya kibali na ustawi utokao kwa Mungu bila kuifanya kuwa hisia ya furaha tu.
- source_word: οἱ πραεῖς
  choice: wenye upole
  rationale: πραεῖς humaanisha watu wapole na wanyenyekevu, si dhaifu au waoga. 'Wenye upole' ni Kiswahili cha kawaida na huhifadhi sifa ya tabia inayokusudiwa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha msingi wa kauli ya heri kwa lugha ya Kiswahili iliyo wazi na ya sasa.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi cha Kigiriki kimetiliwa mkazo; 'wao' huhifadhi mkazo huo kwa kawaida katika Kiswahili.
- source_word: κληρονομήσουσι
  choice: watairithi
  rationale: Huhifadhi moja kwa moja wazo la kupokea urithi na mwangwi unaowezekana wa lugha ya ahadi.
- source_word: τὴν γῆν
  choice: dunia
  rationale: γῆ inaweza kumaanisha 'dunia' au 'nchi.' 'Dunia' huwasilisha vyema upeo mpana wa ahadi, huku tanbihi ikihifadhi uwezekano wa maana ya nchi katika mwangwi wa Zaburi 37:11.
theological_decisions:
- issue: Upeo wa τὴν γῆν
  choice: dunia
  alternative: nchi
  rationale: Neno la Kigiriki linaweza kueleweka kwa maana ya dunia yote au nchi ya ahadi. Matini kuu inatumia 'dunia' lakini tanbihi inahifadhi mvutano huo na mwangwi unaowezekana wa Zaburi 37:11.
- issue: Maana ya πραεῖς
  choice: wenye upole
  alternative: wapole; wanyenyekevu
  rationale: Ufafanuzi huu haumaanishi udhaifu, bali upole wa unyenyekevu. Tanbihi huzuia maana potovu bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kauli ya heri umehifadhiwa. 'Heri' ni wa kawaida katika lugha ya kibiblia lakini bado unaeleweka kwa wasomaji wa leo; 'wenye upole' ni wa asili zaidi kuliko nomino nzito au kauli inayoweza kudokeza uoga.
