base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: sw
  text: Tena, mmesikia kwamba ilisemwa kwa watu wa kale, “Usiape kwa uongo[a], bali utimize viapo vyako kwa Bwana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usivunje kiapo”; kitenzi hiki kinaweza kumaanisha kuapa kwa uongo au kukiuka kiapo.
    reason: lexical_alternative
  - marker: b
    text: Au “BWANA,” kwa kuwa mafundisho haya yanarejelea maandiko ya Agano la Kale ambamo jina la agano la Mungu hutumiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Tena
  rationale: Neno hili linaendeleza mfululizo wa mifano mingine katika mafundisho ya Yesu kwa Kiswahili cha kawaida.
- source_word: ἠκούσατε
  choice: mmesikia
  rationale: Kauli hii ya Kiswahili huonyesha jambo walilolisikia zamani ambalo bado lina umuhimu katika mazungumzo ya sasa.
- source_word: ἐρρέθη τοῖς ἀρχαίοις
  choice: watu wa zamani waliambiwa
  rationale: Muundo huu ni wa asili katika Kiswahili, unadumisha hali ya kutomtaja msemaji, na unaonyesha vizazi vya kale badala ya watu wenye umri mkubwa tu.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Usiape kwa uongo
  rationale: Hii inadumisha maana kuu ya kuapa kwa uongo bila kuifanya kuwa istilahi finyu ya kisheria; maana ya kuvunja kiapo imehifadhiwa katika tanbihi.
- source_word: ἀποδώσεις
  choice: umtimizie
  rationale: Katika muktadha wa viapo, kitenzi kinamaanisha kutekeleza wajibu ulioahidiwa; ‘umtimizie’ huwasilisha kwa kawaida tendo linaloelekezwa kwa Bwana.
- source_word: τῷ κυρίῳ
  choice: Bwana
  rationale: Neno la Kigiriki ni κύριος na hapa linamtaja Mungu; ‘Bwana’ ni tafsiri ya kawaida na yenye heshima.
- source_word: τοὺς ὅρκους σου
  choice: viapo vyako
  rationale: Tafsiri hii ni fupi, wazi, na inadumisha maana mahsusi ya ὅρκος kuwa kiapo.
theological_decisions:
- issue: Jinsi ya kutafsiri κύριος katika muhtasari unaorejelea Maandiko ya Israeli
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κυρίῳ, kwa hiyo ‘Bwana’ ndiyo tafsiri ya moja kwa moja. Hata hivyo, msingi wa Agano la Kale unaweza kurejelea jina la agano la Mungu, hivyo ‘BWANA’ imehifadhiwa kama uwezekano katika tanbihi.
- issue: Upeo wa maana ya ἐπιορκέω
  choice: usiape kwa uongo
  alternative: usivunje kiapo
  rationale: Kitenzi kinaweza kumaanisha kuapa kwa uongo au kukiuka kiapo. Maandishi makuu yanatumia maana ya kwanza huku tanbihi ikihifadhi maana nyingine bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘watu wa zamani waliambiwa’ huepuka Kiswahili kigumu cha tafsiri neno kwa neno, huku ‘umtimizie Bwana viapo vyako’ ukidumisha mwelekeo wa viapo kwa Mungu.
