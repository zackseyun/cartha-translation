base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: sw
  text: 'Lakini mimi ninawaambia: Msiape kabisa, wala kwa mbingu, kwa sababu ni kiti cha enzi cha Mungu;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Lakini mimi ninawaambia
  rationale: Huhifadhi utofautishaji wenye msisitizo wa ἐγώ pamoja na δέ, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Msiape kabisa
  rationale: 'ὀμόσαι hapa ni kuapa au kufanya kiapo, na ὅλως huonyesha katazo kamili: “kabisa.”'
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: wala kwa mbingu
  rationale: Katika muktadha wa viapo, ἐν hutaja kitu ambacho mtu anaapia; “kwa mbingu” ni usemi wa asili wa Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huwasilisha wazi sababu inayofuata bila kubadili uhusiano wa kimantiki wa sentensi.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: ni kiti cha enzi cha Mungu
  rationale: “Kiti cha enzi” ni tafsiri iliyo wazi na yenye hadhi ya θρόνος, huku genitivi τοῦ θεοῦ ikihifadhiwa kwa “cha Mungu.”
theological_decisions:
- issue: Upeo wa katazo la kuapa
  choice: Msiape kabisa
  alternative: Msifanye kiapo cha uongo hata kidogo
  rationale: Chanzo hakitaji uongo katika mstari huu; tafsiri haiongezi sharti hilo wala kutatua kimya kimya mvutano kuhusu upeo wa katazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa mstari umehifadhiwa ili uendelee kwa kawaida katika mstari unaofuata.
