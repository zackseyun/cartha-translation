id: MAT.5.30
reference: Matthew 5:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: sw
  text: Na ikiwa mkono wako wa kulia unakufanya ujikwae,[a] ukate, kisha uutupilie mbali. Kwa maana ni afadhali kwako kiungo kimoja cha mwili wako kipotee kuliko mwili wako wote uende Gehena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, unakusababisha utende dhambi.
    reason: lexical_alternative
  - marker: b
    text: Au, “jehanamu.” Gehena ni jina linalotokana na Bonde la Hinomu na hapa linatumika kuhusu hukumu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: mkono wako wa kulia
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kutaja mkono wa upande wa kulia katika Kiswahili, huku ikihifadhi umahususi wa mfano wa mwili.
- source_word: σκανδαλίζει
  choice: unakufanya ujikwae
  rationale: Inahifadhi sitiari ya Kigiriki ya kumfanya mtu ajikwae, ambayo katika muktadha huu inaelekea kwenye kuanguka katika dhambi; ufafanuzi huo umetolewa katika tanbihi bila kuondoa sitiari katika matini.
- source_word: ἔκκοψον
  choice: ukate
  rationale: Amri hii fupi na ya moja kwa moja inaonyesha hatua kali na ya uamuzi; kiwakilishi cha kitu kinaeleweka kutokana na ‘mkono’ uliotangulia.
- source_word: βάλε ἀπὸ σοῦ
  choice: uutupilie mbali
  rationale: ‘Kutupilia mbali’ huwasilisha kwa Kiswahili cha kawaida tendo la kuondoa na kukataa kabisa, bila ulazima wa kuongeza maneno yasiyo ya asili kama ‘kutoka kwako.’
- source_word: συμφέρει γάρ σοι
  choice: Kwa maana ni afadhali kwako
  rationale: Huwasilisha ulinganisho wa faida au ubora katika muktadha huu kwa lugha ya kawaida, bila kuleta wazo la faida ya kifedha.
- source_word: ἵνα ἀπόληται
  choice: kipotee
  rationale: Huhifadhi wazo la kupotea au kuangamia kwa kiungo kimoja na uzito wa utofautishaji wake na hatima ya mwili wote.
- source_word: ἓν τῶν μελῶν σου
  choice: kiungo kimoja cha mwili wako
  rationale: ‘Kiungo’ ni pana kuliko ‘mguu au mkono’ na kinafaa kwa μέλος, huku nyongeza ‘cha mwili wako’ ikifanya maana iwe wazi kwa msomaji wa kawaida.
- source_word: ὅλον τὸ σῶμά σου
  choice: mwili wako wote
  rationale: Ni Kiswahili cha asili kinachohifadhi utofautishaji kati ya kiungo kimoja na mwili mzima.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: uende Gehena
  rationale: Hufuata wazo la kitenzi ‘kwenda’ pamoja na mwelekeo wake na kuhifadhi jina la kihistoria na kiteolojia ‘Gehena’ badala ya kulisawazisha moja kwa moja na dhana zote zinazoweza kuhusishwa na ‘jehanamu.’
theological_decisions:
- issue: Uwasilishaji wa γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: ‘Gehena’ huhifadhi istilahi ya Kigiriki iliyotokana na Bonde la Hinomu na matumizi yake kuhusu hukumu ya mwisho. ‘Jehanamu’ ni ufafanuzi unaoeleweka, lakini unaweza kuingiza mapema maana pana za kiteolojia; kwa hiyo umewekwa katika tanbihi.
- issue: Maana ya σκανδαλίζει
  choice: unakufanya ujikwae
  alternative: unakusababisha utende dhambi
  rationale: Matini kuu inahifadhi sitiari halisi ya kujikwaa, huku tanbihi ikieleza maana yake ya kimaadili katika muktadha bila kufuta mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa wazi na kwa mpangilio wa asili wa Kiswahili, huku ukali wa amri, sitiari ya kujikwaa, na utofautishaji wa kiungo kimoja na mwili wote vikihifadhiwa.
