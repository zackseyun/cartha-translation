id: MAT.5.37
reference: Matthew 5:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: sw
  text: Lakini kauli yenu iwe, ‘Ndiyo, ndiyo,’ au ‘Hapana, hapana.’ Chochote kinachozidi hayo hutoka kwa yule mwovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutokana na uovu.” Maneno ya Kigiriki τοῦ πονηροῦ yanaweza kueleweka kuwa yanamrejelea “yule mwovu” au “uovu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: iwe
  rationale: Ni amri ya nafsi ya tatu ya εἰμί; ‘iwe’ ni himizo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: λόγος
  choice: kauli
  rationale: Katika muktadha huu neno hilo linamaanisha jambo analosema mtu; ‘kauli’ ni ya asili katika Kiswahili na huhifadhi uzito wa usemi huu mfupi kuliko ‘neno’ peke yake.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Ndiyo, ndiyo,’ au ‘Hapana, hapana’
  rationale: Kurudia maneno kunahifadhi msisitizo na mdundo wa Kigiriki; ‘au’ huonyesha wazi utofauti wa majibu hayo mawili.
- source_word: περισσὸν
  choice: Chochote kinachozidi
  rationale: Kivumishi hiki kilichotumiwa kama nomino kinarejelea jambo lolote linalopita kauli rahisi ya ndiyo au hapana.
- source_word: τούτων
  choice: hayo
  rationale: Kiwakilishi hiki kinarejelea majibu mawili yaliyotangulia; ‘hayo’ ni marejeo ya kawaida na mafupi katika Kiswahili.
- source_word: ἐκ
  choice: hutoka kwa
  rationale: Kihusishi hiki huonyesha chanzo au asili; kwa chanzo chenye nafsi, ‘hutoka kwa’ ni Kiswahili cha kawaida.
- source_word: τοῦ πονηροῦ
  choice: yule mwovu
  rationale: Muundo wenye kibainishi unaweza kumaanisha ‘yule mwovu’ au ‘uovu.’ Katika Mathayo mara nyingi una nguvu ya kibinafsi, hivyo tafsiri kuu inatumia ‘yule mwovu’ huku maana nyingine ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo τοῦ πονηροῦ inamaanisha kwa namna isiyo ya kibinafsi (‘uovu’) au ya kibinafsi (‘yule mwovu’)
  choice: yule mwovu
  alternative: uovu
  rationale: Kisarufi, maneno hayo yanaweza kueleweka kwa njia zote mbili, lakini matumizi ya Mathayo mara nyingi yanaelekea kwa mhusika mwovu. Tafsiri kuu inachagua maana hiyo inayowezekana zaidi bila kufuta utata halisi; maana ya ‘uovu’ imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kimethali na urudiaji wa ‘Ndiyo, ndiyo’ na ‘Hapana, hapana’ umehifadhiwa; tanbihi inaonyesha utata wa kweli wa chanzo.
