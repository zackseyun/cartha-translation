  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: sw
  text: Ninyi ni nuru ya ulimwengu. Mji ulioko juu ya mlima hauwezi kufichwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi na kina mkazo katika Kigiriki; “Ninyi” hudumisha usemi wa moja kwa moja na mkazo huo kwa Kiswahili cha kawaida.
- source_word: τὸ φῶς
  choice: nuru
  rationale: “Nuru” ni neno la kawaida, lenye hadhi, na linalofaa kwa sitiari hii; kiarifu katika Kiswahili hakihitaji kuonyesha kibainishi cha Kigiriki kwa neno tofauti.
- source_word: τοῦ κόσμου
  choice: ya ulimwengu
  rationale: Huhifadhi uhusiano wa umilikaji wa Kigiriki na maana pana ya κόσμος bila kuufasiri zaidi kuwa “kwa ajili ya ulimwengu.”
- source_word: οὐ δύναται
  choice: hauwezi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kutowezekana kwa jambo hilo.
- source_word: πόλις
  choice: Mji
  rationale: “Mji” ndiyo tafsiri ya kawaida ya πόλις na inafaa kwa makazi yanayoonekana katika mfano huu.
- source_word: κρυβῆναι
  choice: kufichwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki kwa lugha ya asili ya Kiswahili.
- source_word: ἐπάνω ὄρους
  choice: juu ya mlima
  rationale: Hufuata kwa karibu maana ya maneno ya Kigiriki na kuacha ὄρος ikiwa “mlima,” bila kuipunguza kimakusudi kuwa kilima.
- source_word: κειμένη
  choice: ulioko
  rationale: Kishiriki hiki kina maana ya kuwa mahali au kuwekwa; “ulioko” ni usemi wa asili kwa mji uliopo mahali fulani bila kudokeza kwa lazima kwamba mtu fulani aliuweka huko.
theological_decisions:
- issue: Utambulisho wa kisitiari wa wanafunzi kuwa nuru
  choice: Ninyi ni nuru ya ulimwengu
  alternative: Ninyi ni nuru kwa ulimwengu
  rationale: Tafsiri inadumisha sitiari ya moja kwa moja na muundo wa “ya ulimwengu,” bila kuongeza maelezo ya kiteolojia au kuibadili kuwa kauli ya kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; “ulioko juu ya mlima” ni ya kawaida na pia ni karibu na ushahidi wa Kigiriki.
