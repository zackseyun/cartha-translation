  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: sw
  text: Kwa hiyo, ikiwa unatoa zawadi yako kwenye madhabahu, na huko ukikumbuka kwamba ndugu yako ana jambo dhidi yako,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la umoja wa kiume. Katika muktadha huu linaweza kutumiwa kiwakilishi na kurejelea ndugu wa kiume au wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, ikiwa
  rationale: “Kwa hiyo” huhifadhi hitimisho linalotokana na mafundisho yaliyotangulia, na “ikiwa” huanzisha sharti.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: unatoa zawadi yako
  rationale: “Unatoa” linafaa kwa tendo la kuwasilisha kitu kwa Mungu, huku “zawadi” likihifadhi maana ya msingi ya δῶρον bila kuifanya moja kwa moja kuwa aina maalumu ya sadaka.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: juu ya madhabahu
  rationale: Huhifadhi maana ya ἐπί pamoja na hali ya kuwasilisha zawadi juu ya madhabahu.
- source_word: κἀκεῖ μνησθῇς
  choice: na hapo ukakumbuka
  rationale: “Hapo” huhifadhi msisitizo wa mahali, na “ukakumbuka” hutoa kwa kawaida tendo la kukumbuka ndani ya sentensi ya sharti.
- source_word: ὁ ἀδελφός σου
  choice: ndugu yako
  rationale: “Ndugu” ndilo neno la kawaida la Kiswahili linalolingana na uhusiano unaotajwa; kwa kuwa halibainishi jinsia lenyewe, tanbihi inaeleza umbo la Kigiriki.
- source_word: ἔχει τι κατὰ σοῦ
  choice: ana jambo dhidi yako
  rationale: Huhifadhi kutokubainishwa kwa τι (“jambo fulani”) na maana ya kuwa na malalamiko au kinyongo dhidi ya mtu bila kutaja kosa mahsusi.
theological_decisions:
- issue: Neno la kindugu lenye umbo la kiume ἀδελφός
  choice: ndugu yako
  alternative: ndugu yako wa kiume au wa kike
  rationale: Kigiriki kina nomino ya umoja yenye umbo la kiume, lakini “ndugu” la Kiswahili kwa kawaida halibainishi jinsia. Tafsiri kuu haitanui maneno ya chanzo, nayo tanbihi inaweka wazi umbo na uwezekano wa matumizi ya uwakilishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi uhusiano wa kimantiki, hali ya sharti, mahali pa tendo, na kutokubainishwa kwa malalamiko.
