  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: sw
  text: Uwe na nia njema kwa mshtaki wako bila kukawia[a], wakati bado mko pamoja njiani, asije akakukabidhi kwa hakimu, naye hakimu akukabidhi kwa afisa wa mahakama, ukatupwa gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi unaoeleza zaidi muktadha wa kisheria, “Patana upesi na mshtaki wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Uwe na nia njema kwa
  rationale: Huhifadhi maana ya msingi ya kuwa na mwelekeo mwema kwa mtu, bila kuifanya moja kwa moja kuwa amri ya kufikia suluhu ya kisheria. Kiswahili hiki ni wazi na cha kawaida, ingawa dokezo la kupatana linaelezwa katika tanbihi.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: mshtaki
  rationale: Muktadha wa hakimu, afisa wa mahakama na gereza unaonyesha mpinzani katika shauri la kisheria; “mshtaki” huwasilisha maana hiyo kwa uwazi.
- source_word: ταχὺ
  choice: bila kukawia
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi msisitizo wa kutenda haraka.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: wakati bado mko pamoja njiani
  rationale: Huhifadhi picha halisi ya wahusika kuwa njiani pamoja, bila kuongeza wazi kwamba wanakwenda mahakamani.
- source_word: μήποτέ
  choice: asije
  rationale: Muundo huu wa Kiswahili unaonyesha onyo na uwezekano unaopaswa kuzuiwa.
- source_word: παραδῷ
  choice: akukabidhi
  rationale: “Kukabidhi” huonyesha uhamisho wa mtu chini ya mamlaka nyingine katika mfululizo wa kisheria.
- source_word: κριτῇ / κριτὴς
  choice: hakimu
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa mwamuzi mwenye mamlaka katika shauri la kisheria.
- source_word: ὑπηρέτῃ
  choice: afisa wa mahakama
  rationale: Muktadha unaonyesha mtumishi rasmi anayetekeleza amri ya hakimu. Tafsiri hii iko wazi zaidi kuliko “mtumishi” na si finyu kiutamaduni kama cheo mahususi.
- source_word: εἰς φυλακὴν
  choice: gerezani
  rationale: Ni tafsiri ya kawaida na yenye uzito unaofaa kwa kifungo.
- source_word: βληθήσῃ
  choice: ukatupwa
  rationale: Huhifadhi nguvu ya kitenzi cha Kigiriki kuliko usemi laini kama “ukawekwa.”
theological_decisions:
- issue: Ikiwa amri ya mwanzo itafsiriwe kama kufikia suluhu ya kisheria au kama kuwa na mwelekeo mwema kwa mpinzani
  choice: Uwe na nia njema kwa mshtaki wako
  alternative: Patana upesi na mshtaki wako
  rationale: Muktadha wa kisheria unaunga mkono maana ya kupatana, lakini kitenzi εὐνοέω kimsingi hueleza kuwa na mwelekeo au nia njema. Matini kuu huhifadhi maana hiyo, huku tanbihi ikitoa tafsiri ya kimuktadha bila kufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi hudumisha picha ya kuwa njiani na mfululizo wa kukabidhiwa kwa mamlaka, huku “afisa wa mahakama” ikifafanua kazi ya ὑπηρέτης kwa msomaji wa kawaida.
