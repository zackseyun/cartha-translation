id: MAT.5.4
reference: Matthew 5:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: sw
  text: Heri wale wanaoomboleza[a], kwa sababu watafarijiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘wale walio na huzuni.’ Neno la Kigiriki lina maana pana na halitaji sababu ya maombolezo hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Neno hili linahifadhi muundo wa kawaida wa heri na maana ya kutangazwa kuwa katika hali yenye kibali, bila kulifanya liwe hisia ya furaha tu.
- source_word: οἱ πενθοῦντες
  choice: wale wanaoomboleza
  rationale: Kivumishi-tendo chenye kibainishi kimetafsiriwa kwa wingi kwa Kiswahili cha kawaida. ‘Wanaoomboleza’ linaweza kueleza huzuni nzito kutokana na msiba, mateso, dhambi, au sababu nyingine bila kutaja chanzo chake.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha sababu au msingi wa tamko la heri kwa lugha wazi ya Kiswahili cha sasa.
- source_word: αὐτοὶ
  choice: wao (imewakilishwa katika kiambishi wa- cha ‘watafarijiwa’)
  rationale: Kiswahili huonyesha nafsi ya wingi katika kitenzi. Kutaja ‘wao wenyewe’ kungesisitiza kupita kiasi, huku muundo wa sentensi ukihifadhi uhusiano wa wale wanaoomboleza na ahadi.
- source_word: παρακληθήσονται
  choice: watafarijiwa
  rationale: Linahifadhi wakati ujao na hali ya kutendwa, na linaeleza kwa kawaida kupokea faraja.
theological_decisions:
- issue: Upeo wa maombolezo katika heri hii
  choice: Kutafsiri kwa upana kuwa ‘wale wanaoomboleza’ bila kutaja sababu ya maombolezo hayo.
  alternative: Wale wanaoomboleza dhambi; wale wanaohuzunika kwa jumla; au wale wanaolilia hali ya Israeli.
  rationale: Maandishi ya Kigiriki hayataji kitu au sababu ya maombolezo. Tafsiri pana inahifadhi uwazi wa kiteolojia na kichungaji wa kauli hii badala ya kuingiza fasiri finyu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Heri’ hudumisha mtindo unaotambulika wa kauli za heri, na ‘wanaoomboleza’ huepuka kufinya sababu ya huzuni.
