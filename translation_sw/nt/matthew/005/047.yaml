  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: sw
  text: Na ikiwa mnawasalimu ndugu zenu tu[a], mnafanya jambo gani la ziada[b]? Je, hata watu wa mataifa[c] hawafanyi vivyo hivyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “ndugu” liko katika wingi wa kiume, lakini hapa linaweza kurejelea ndugu wa kiume na wa kike au, kwa upana zaidi, watu wa kundi lenu wenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “mnafanya nini zaidi?”
    reason: lexical_alternative
  - marker: c
    text: Yaani, watu wasio Wayahudi; tafsiri nyingine ni “wapagani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: mnawasalimu
  rationale: Kitenzi hiki humaanisha kutoa salamu. ‘Kuwasalimu’ ni Kiswahili cha kawaida na hakiongezi wazo la ukarimu au mapokezi ambalo halijasemwa wazi.
- source_word: ἀδελφοὺς
  choice: ndugu zenu
  rationale: ‘Ndugu’ huhifadhi maana ya uhusiano wa kindugu na katika Kiswahili inaweza pia kurejelea washiriki wa kundi moja. Uwezekano wa maana pana unaelezwa katika tanbihi.
- source_word: μόνον
  choice: tu
  rationale: ‘Tu’ huonyesha wazi kwamba salamu hizo zimewekewa mipaka kwa kundi hilo pekee.
- source_word: τί περισσὸν ποιεῖτε
  choice: mnafanya jambo gani lililo la ziada
  rationale: ‘La ziada’ huwasilisha maana ya περισσόν kama jambo linalozidi yaliyo ya kawaida, huku ikihifadhi kwa kiasi kikubwa muundo na swali la Kigiriki.
- source_word: ἐθνικοὶ
  choice: watu wa mataifa
  rationale: Neno hili hapa linarejelea wasio Wayahudi. ‘Watu wa mataifa’ huhifadhi tofauti ya kikabila na ya kijamii bila kuongeza hukumu kali ya kidini inayoweza kuletwa na ‘wapagani.’
- source_word: τὸ αὐτὸ
  choice: vivyo hivyo
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kusema kwamba watu hao hufanya tendo lilelile.
theological_decisions:
- issue: Upeo wa ἀδελφοὺς katika fundisho hili la maadili
  choice: ‘Ndugu zenu’ katika matini kuu, likiwa neno la Kiswahili linaloweza kujumuisha watu wa jinsia zote na pia washiriki wa kundi moja kulingana na muktadha.
  alternative: ‘Ndugu zenu wa kiume’ au ‘ndugu zenu wa kiume na wa kike.’
  rationale: Kigiriki kina nomino ya wingi ya kiume, lakini muktadha unaweza kurejelea watu wa kundi la mtu kwa upana. ‘Ndugu’ huhifadhi utata huo wa kweli vizuri katika Kiswahili; tanbihi inaeleza upeo unaowezekana bila kuubana.
- issue: Maana ya ἐθνικοὶ
  choice: ‘Watu wa mataifa,’ yaani wasio Wayahudi.
  alternative: ‘Wapagani.’
  rationale: Maana ya msingi hapa ni watu wasio Wayahudi. Chaguo hili huhifadhi tofauti ya kikabila na ya jamii ya agano bila kulazimisha maana yenye hukumu kali zaidi ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali mawili ya balagha yamehifadhiwa. ‘Jambo gani lililo la ziada’ ni la kawaida kiasi na linaonyesha mwenendo unaozidi kiwango cha kawaida bila kupoteza utata wa περισσόν.
