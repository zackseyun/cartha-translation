  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: sw
  text: Msidhani kwamba nilikuja kuibatilisha Sheria au Manabii;[a] sikuja kuibatilisha, bali kuitimiza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimekuja” katika sehemu ya kwanza, na “sijaja” katika sehemu inayofuata.
    reason: lexical_alternative
  - marker: b
    text: “Kuitimiza” pia inaweza kueleweka kuwa “kuikamilisha,” “kuifikisha kwenye utimilifu,” au “kuidhihirisha kikamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Msidhani
  rationale: Ni katazo la moja kwa moja linaloelekezwa kwa wingi; ‘msidhani’ ni Kiswahili cha kawaida na huhifadhi maana ya kutokufikiri au kutokudhani hivyo.
- source_word: ἦλθον
  choice: nilikuja / sikuja
  rationale: Wakati uliopita wa Kigiriki umetafsiriwa kwa wakati uliopita katika Kiswahili, huku marudio chanya na hasi yakihifadhiwa.
- source_word: καταλῦσαι
  choice: kuibatilisha
  rationale: Katika muktadha wa Sheria na Manabii, neno hili lina maana ya kuondoa nguvu au uhalali, si kuharibu kitu kimwili. ‘Kubatilisha’ huonyesha maana hiyo wazi.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: Sheria au Manabii
  rationale: Herufi kubwa zinaonyesha kwamba huu ni usemi unaorejelea sehemu zinazotambulika za Maandiko ya Israeli, si sheria kwa ujumla wala manabii kama watu mmoja mmoja tu.
- source_word: ἀλλὰ πληρῶσαι
  choice: bali kuitimiza
  rationale: '‘Kuitimiza’ huhifadhi upana wa πληρόω: kutekeleza, kuifikisha kwenye ukamilifu, au kuonyesha maana yake kamili, bila kulazimisha fasiri moja ya kiteolojia. Kiwakilishi cha umoja ‘i-’ kinafuata kisarufi usemi wa karibu ‘Sheria au Manabii’ unaotazamwa kama ujumla wa Maandiko.'
theological_decisions:
- issue: Maana ya uhusiano wa Yesu na ‘Sheria au Manabii’ katika πληρῶσαι
  choice: kuitimiza
  alternative: kuikamilisha; kuileta kwenye utimilifu; kuidhihirisha kikamilifu
  rationale: ‘Kuitimiza’ ni neno pana na linalotambulika katika muktadha wa Maandiko. Linahifadhi mvutano wa kiteolojia kuhusu namna Yesu anavyoitimiza Sheria na Manabii badala ya kuamua fasiri moja katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inasomeka kwa urahisi; ‘Sheria’ na ‘Manabii’ zimeandikwa kwa herufi kubwa kuonyesha matumizi yake kama majina ya sehemu za Maandiko.
