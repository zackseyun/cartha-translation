  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: sw
  text: Mmesikia kwamba watu wa zamani waliambiwa[a], ‘Usifanye mauaji[b]; na yeyote anayefanya mauaji atawajibika kwa hukumu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa watu wa zamani.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya karibu zaidi, “Usiue mtu kinyume cha sheria”; neno la Kigiriki linahusu mauaji, wala si kila tendo la kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Mmesikia
  rationale: Kauli hii ya hotuba inaeleza mafundisho ambayo wasikilizaji wamekwisha kuyapokea; wakati timilifu wa Kiswahili ni wa asili na unaendeleza umuhimu wake wa sasa.
- source_word: ἐρρέθη
  choice: waliambiwa
  rationale: Kauli tendwa inahifadhi kutotajwa kwa msemaji bila kuamua kimya kimya kwamba ni Mungu au mtu mwingine aliyesema.
- source_word: τοῖς ἀρχαίοις
  choice: watu wa zamani
  rationale: Hurejelea watu wa nyakati za kale kama wapokeaji wa yaliyosemwa; ni wazi na ya kawaida zaidi kwa Kiswahili cha sasa kuliko ‘watu wa kale’ katika muktadha huu.
- source_word: Οὐ φονεύσεις
  choice: Usiue
  rationale: Katika matumizi ya Kiswahili, ‘kuua’ ndilo neno la kawaida katika amri hii; maana mahsusi ya φονεύω kwamba ni kuua mtu kinyume cha sheria inaelezwa katika tanbihi ili kuepuka kudai kwamba tendo lolote la kuua ndilo linalokusudiwa.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: na yeyote anayeua
  rationale: Muundo huu unaonyesha sharti la jumla lisilo na mhusika maalumu; ‘yeyote anayeua’ ni Kiswahili cha asili.
- source_word: ἔνοχος ἔσται
  choice: atawajibika
  rationale: ἔνοχος pamoja na dative huonyesha kuwajibika au kuwa chini ya hatua ya kisheria, si kutajwa tu kuwa na hatia kwa maana ya jumla.
- source_word: τῇ κρίσει
  choice: mbele ya hukumu
  rationale: ‘Hukumu’ inadumisha maana ya kisheria ya κρίσις bila kubainisha isivyofaa kama ni baraza fulani, mahakama maalumu, au hukumu ya mwisho.
theological_decisions:
- issue: Maana ya amri ya sita
  choice: Usiue, pamoja na tanbihi inayobainisha mauaji ya mtu kinyume cha sheria
  alternative: Usifanye mauaji
  rationale: φονεύω ni mahsusi zaidi kuliko kuua kwa ujumla. ‘Usiue’ ni ya kawaida na yenye heshima katika Kiswahili, lakini tanbihi inalinda upeo wa neno la Kigiriki bila kuingiza dai kwamba kila aina ya kuua inakatazwa hapa.
- issue: Utambulisho wa aliyesema
  choice: Kauli tendwa isiyomtaja msemaji
  alternative: Mungu aliwaambia
  rationale: ἐρρέθη haitaji wazi msemaji; tafsiri haipaswi kuondoa hali hiyo ya kutobainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mmesikia kwamba’ ni mtiririko wa asili wa mazungumzo; nuktamkato inadumisha muungano wa amri na matokeo yake ya kisheria kama kifungu kimoja cha mafundisho yaliyopokewa.
