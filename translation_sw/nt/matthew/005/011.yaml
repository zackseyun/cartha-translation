  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: sw
  text: Heri ninyi wanapowatukana[a], wanapowatesa, na wanaposema kwa uongo mambo maovu ya kila namna dhidi yenu[b] kwa sababu yangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanapowadhihaki.”
    reason: lexical_alternative
  - marker: b
    text: Au “kusema kila jambo ovu dhidi yenu.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa ajili yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Heri ninyi
  rationale: Inahifadhi muundo wa heri na uzito wake wa kitheolojia kwa Kiswahili cha kawaida cha Biblia bila kuifanya iwe kauli ya bahati tu.
- source_word: ὅταν
  choice: watu wanapo-
  rationale: Muundo wa “wanapo-” unaeleza hali ya jumla inayoweza kutokea, na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: ὀνειδίσωσιν
  choice: wanapowatukana
  rationale: “Kutukana” linaeleza wazi matumizi ya maneno ya kudhalilisha; “kushutumu” linawezekana lakini linaweza pia kueleweka kama kulaumu.
- source_word: διώξωσιν
  choice: wanapowatesa
  rationale: “Kutesa” hapa linaonyesha kuwatendea watu vibaya kwa uadui kwa sababu ya uhusiano wao na Yesu, bila kuzuia maana kwenye mateso ya kimwili pekee.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: kusema ... mambo maovu ya kila namna dhidi yenu
  rationale: Usemi huu wa asili katika Kiswahili unadumisha upana wa πᾶν πονηρόν na mwelekeo wa κατά, yaani maneno hayo yanasemwa dhidi yao.
- source_word: ψευδόμενοι
  choice: kwa uongo
  rationale: Kirai cha kielezi kinaonyesha kwa kawaida kwamba mambo maovu yanayosemwa si ya kweli.
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa sababu yangu
  rationale: Kinaeleza moja kwa moja kuwa uhusiano na Yesu ndio sababu ya upinzani; “kwa ajili yangu” pia linawezekana.
theological_decisions:
- issue: Aina ya upinzani unaoelezwa
  choice: Mstari unahusu matusi, mateso, na maneno maovu ya uongo yanayosemwa dhidi ya wafuasi kwa sababu ya Yesu, bila kubainisha mateso hayo kuwa ya kisheria, kimwili, au kijamii pekee.
  alternative: Kuyafanya mateso yamaanishe ukatili wa kimwili pekee, au kuifanya kauli nzima ihusu kashfa pekee.
  rationale: Vitenzi vitatu vilivyounganishwa vinaonyesha aina pana za uadui. Tafsiri haipunguzi upana huo wala kuufanya uwe aina moja tu ya mateso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Muundo tendaji wa Kigiriki umehifadhiwa kwa kutumia “watu” kama kiima kisichotajwa kwa jina. Alama zote za tanbihi zimewekwa katika matini kuu.
