  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: sw
  text: “Mmesikia kwamba ilisemwa, ‘Jicho kwa jicho na jino kwa jino.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Mmesikia
  rationale: Kauli hii ya utangulizi inaeleza mapokeo ambayo wasikilizaji wameyasikia na bado wanayafahamu; wakati timilifu wa Kiswahili ni wa kawaida na wenye maana hiyo.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha yaliyomo katika jambo lililosikiwa.
- source_word: ἐρρέθη
  choice: ilisemwa
  rationale: Huhifadhi hali ya kutendwa na namna isiyotaja msemaji moja kwa moja.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Jicho kwa jicho
  rationale: Ni usemi wa kisheria unaoeleweka kwa kawaida katika Kiswahili na unaodumisha wazo la ulinganifu au badala.
- source_word: καὶ
  choice: na
  rationale: Huunganisha vipashio viwili sambamba.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: jino kwa jino
  rationale: Hudumisha usambamba na mpangilio mfupi wa kanuni ya kisheria.
theological_decisions:
- issue: Namna ya kutafsiri kanuni ya kisheria iliyonukuliwa na Yesu
  choice: Jicho kwa jicho na jino kwa jino
  alternative: Jicho badala ya jicho na jino badala ya jino
  rationale: Tafsiri hii inahifadhi kanuni inayotambulika ya ulipizaji wenye ulinganifu bila kuamua kimya kimya ikiwa inadai kisasi halisi au kikomo cha uwiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “Mmesikia kwamba ilisemwa” ni wa kawaida, huku nukuu ikidumisha ufupi na usambamba wa kanuni ya kisheria.
