base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: sw
  text: Mpe yule anayekuomba, wala usimgeuzie mgongo yule anayetaka kukopa kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala usimkatae yule anayetaka kukopa kwako.”
    reason: 'Tofauti halali ya kileksika: “usimkatae” huonyesha maana ya kimuktadha ya μὴ ἀποστραφῇς, huku matini kuu ikihifadhi taswira ya kugeuzia mtu mgongo.'
lexical_decisions:
- source_word: αἰτοῦντί
  choice: yule anayekuomba
  rationale: Kirai cha kisifa chenye kibainishi kinamtaja kwa ujumla mtu anayeomba. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya tendo linalomtambulisha mtu huyo.
- source_word: δός
  choice: Mpe
  rationale: Ni amri ya moja kwa moja kutoka kwa δίδωμι. “Mpe” inawasilisha amri hiyo kwa ufupi bila kuongeza sharti au maelezo yasiyomo katika Kigiriki.
- source_word: θέλοντα
  choice: yule anayetaka
  rationale: Kirai hiki kinamtaja mtu mwenye nia ya kufanya jambo. “Anayetaka” ni tafsiri ya kawaida na ya sasa ya θέλω katika muktadha huu.
- source_word: ἀπὸ σοῦ
  choice: kwako
  rationale: Katika muktadha wa kukopa, “kwako” huonyesha kwa kawaida chanzo cha kile kinachokopwa na ni Kiswahili asilia kuliko muundo wa moja kwa moja “kutoka kwako.”
- source_word: δανίσασθαι
  choice: kukopa
  rationale: Kitenzi hiki humaanisha kukopa katika muktadha huu. Hakuna kitu maalumu kilichotajwa, kwa hiyo tafsiri haiongezi “fedha” au “mkopo.”
- source_word: μὴ ἀποστραφῇς
  choice: usimgeuzie mgongo
  rationale: Hii ni katazo. Usemi “usimgeuzie mgongo” unahifadhi taswira ya kugeuka na pia unasikika kwa kawaida katika Kiswahili, bila kuibadili moja kwa moja kuwa tafsiri fafanuzi ya “usimkatae.”
theological_decisions:
- issue: Upeo na nguvu ya amri ya kimaadili ya Yesu
  choice: Kutafsiri kama amri ya moja kwa moja na ya jumla bila kuilegeza au kuwekea mipaka isiyotajwa.
  alternative: Kuifanya ihusu waombaji wanaostahili tu, au kuifafanua moja kwa moja kuwa “usimkatae.”
  rationale: Kigiriki kinatoa amri mbili za moja kwa moja katika Mahubiri ya Mlimani. Tafsiri inapaswa kuhifadhi nguvu na upana wake bila kuingiza masharti ya baadaye yasiyosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Usimgeuzie mgongo” ni usemi asilia unaohifadhi taswira ya Kigiriki; “kwako” ni muundo wa kawaida katika usemi wa kukopa.
