id: MAT.5.19
reference: Matthew 5:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: sw
  text: Kwa hiyo, yeyote atakayolegeza[a] moja ya amri hizi zilizo ndogo zaidi na kuwafundisha watu kufanya hivyo, ataitwa mdogo zaidi katika ufalme wa mbinguni; lakini yeyote atakayezitenda na kuzifundisha, huyo ataitwa mkuu katika ufalme wa mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atakayeiweka kando” au “atakayevunja.” Kitenzi cha Kigiriki kwa maana halisi ni “kufungua”; hapa kinamaanisha kudhoofisha uzito wa amri au kuitendea kana kwamba hailazimishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu kudumu kwa Sheria.
- source_word: λύσῃ
  choice: atakayolegeza
  rationale: Kitenzi λύω kimsingi ni ‘kufungua’; hapa kina maana ya kudhoofisha uzito wa amri au kuitendea kana kwamba hailazimishi. ‘Kulegeza’ huhifadhi sitiari hiyo bila kuibana kuwa kuvunja tu.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: hata moja ya amri hizi zilizo ndogo zaidi
  rationale: Huhifadhi wazo la amri moja iliyo miongoni mwa zile zinazohesabiwa kuwa ndogo zaidi; ‘hata’ ni ya asili katika Kiswahili na hukazia kuwa moja tu inahusika.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: kuwafundisha watu kufanya hivyo
  rationale: ‘Watu’ huwasilisha maana ya jumla ya ἀνθρώπους kwa Kiswahili cha kawaida, na ‘kufanya hivyo’ hurejelea kwa wazi kule kulegeza amri.
- source_word: ἐλάχιστος κληθήσεται
  choice: ataitwa mdogo zaidi
  rationale: Hufuata maana ya moja kwa moja ya kaλέω katika hali tendwa na kudumisha ulinganisho bila kudai kuwa mtu huyo ametengwa na ufalme.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: Ni usemi wa kawaida, wenye heshima, wa Kiswahili kwa msemo mahsusi wa Mathayo.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: atakayezitenda na kuzifundisha
  rationale: Viambishi vya yambwa hurejelea amri; ‘kutenda’ huonyesha kuzifanya au kuzitekeleza bila kuongeza tafsiri ya ‘kuzishika.’
- source_word: οὗτος
  choice: huyo
  rationale: Kiwakilishi hiki huhifadhi mkazo na utofautishaji wa demonstrative ya Kigiriki.
- source_word: μέγας
  choice: mkuu
  rationale: ‘Mkuu’ ni kinyume cha asili cha ‘mdogo zaidi’ katika muktadha wa hadhi na huhifadhi maana ya μέγας bila kuifanya ‘mkuu kuliko wote.’
theological_decisions:
- issue: Hadhi ya ‘mdogo zaidi’ au ‘mkuu’ katika ufalme
  choice: Kauli imewasilishwa kama hadhi ndani ya ufalme bila kueleza kuwa ‘mdogo zaidi’ ametengwa wala kuwa ‘mkuu’ ni cheo maalumu cha thawabu.
  alternative: Kutafsiri ‘mdogo zaidi’ kuwa nje ya ufalme, au ‘mkuu’ kuwa daraja maalumu la thawabu ya mbinguni.
  rationale: Kigiriki kinasema ‘katika ufalme wa mbinguni’; tafsiri inadumisha mvutano huo wa kiteolojia bila kuutatua kimadhehebu.
- issue: Rejeo la jumla la ἀνθρώπους
  choice: watu
  alternative: wanaume / wengine
  rationale: Katika muktadha huu neno la Kigiriki linawahusu wanadamu kwa jumla. Kiswahili ‘watu’ ni sahihi, la asili, na halipotezi taarifa ya maana inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi huhifadhi ulinganifu wa vifungu viwili na mkazo wa ‘huyo,’ huku ‘watu’ na viambishi vya yambwa vikifanya maana iwe wazi kwa msomaji wa kawaida.
