id: MAT.5.7
reference: Matthew 5:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: sw
  text: Heri wenye rehema, kwa maana wao watarehemiwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Neno “heri” ni la kawaida katika kauli za heri za Biblia na linaonyesha hali ya kupata kibali na mema, si furaha ya hisia tu.
- source_word: οἱ ἐλεήμονες
  choice: wenye rehema
  rationale: Kivumishi chenye kiambishi cha utambulisho kimetumiwa kama nomino ya kundi. “Wenye rehema” ni usemi mfupi na wa asili unaohifadhi uhusiano wa kimsamiati na “watarehemiwa.”
- source_word: ὅτι
  choice: kwa maana
  rationale: Hapa ὅτι inaanzisha msingi au sababu ya kutangazwa kwa heri; “kwa maana” inadumisha mtindo wa kauli hii kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kutaja “wao” wazi kunahifadhi mkazo wa kiwakilishi cha Kigiriki bila kuongeza wazo la kuwatenga wengine kwa kusema “wao ndio.”
- source_word: ἐλεηθήσονται
  choice: watarehemiwa
  rationale: Hii ni kauli ya wakati ujao katika hali ya kutendwa. “Watarehemiwa” ni fupi, ya asili, na inaacha mtendaji bila kutajwa huku ikirudia mzizi wa maana ya rehema.
theological_decisions:
- issue: Mtendaji wa rehema iliyoahidiwa
  choice: 'Kuacha mtendaji bila kutajwa: “watarehemiwa.”'
  alternative: “Mungu atawarehemu” au “wataonyeshwa rehema na wengine.”
  rationale: Kitenzi cha Kigiriki ni cha kutendwa na hakimtaji mtendaji. Ingawa muktadha unaashiria sana Mungu, tafsiri haipaswi kuongeza jina lake wala kuelekeza ahadi hiyo kwa wanadamu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi, wenye hadhi, na wa kawaida katika kauli za heri. Muundo unahifadhi urari wa kishairi na urudiaji wa wazo la rehema.
