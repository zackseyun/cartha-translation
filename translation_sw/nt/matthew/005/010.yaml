base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: sw
  text: Heri wale ambao wameteswa kwa sababu ya uadilifu[a], kwa maana ufalme wa mbinguni ni wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya haki.” Neno la Kigiriki linaweza kubeba maana ya uadilifu wa kimaadili na pia maana ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Neno la kawaida na lenye hadhi katika kauli za heri; linaonyesha hali ya kibali na baraka, si hisia ya furaha tu.
- source_word: οἱ δεδιωγμένοι
  choice: wale ambao wameteswa
  rationale: 'Muundo huu unaakisi nomino ya kitendo pamoja na hali timilifu ya kitenzi tendwa: wameteswa na wako katika hali inayotokana na mateso hayo.'
- source_word: ἕνεκεν
  choice: kwa sababu ya
  rationale: Linaeleza wazi sababu inayowafanya wateswe, kwa Kiswahili cha kawaida.
- source_word: δικαιοσύνης
  choice: uadilifu
  rationale: Huwasilisha maisha na mwenendo unaopatana na mapenzi yaliyo sawa ya Mungu; maana inayoweza kuelekea haki imehifadhiwa katika tanbihi.
- source_word: ὅτι
  choice: kwa maana
  rationale: Linaanzisha sababu inayothibitisha kauli ya heri kwa mtindo wa asili wa Kiswahili.
- source_word: αὐτῶν
  choice: ni wao
  rationale: Ni usemi wa Kiswahili unaoonyesha umilikaji kwa mkazo bila kuufanya mstari kuwa mzito.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Ni tafsiri ya kawaida na ya asili ya usemi bainifu wa Mathayo unaorejelea utawala wa Mungu wa mbinguni.
theological_decisions:
- issue: Tafsiri ya δικαιοσύνη
  choice: uadilifu
  alternative: haki
  rationale: Katika muktadha huu, neno linaweza kumaanisha mwenendo ulio sawa mbele za Mungu na pia haki. Uadilifu unafaa katika matini kuu bila kufuta maana halisi mbadala, ambayo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kauli ya heri na mvutano wa maana kati ya uadilifu na haki umehifadhiwa.
