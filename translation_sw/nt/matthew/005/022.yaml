id: MAT.5.22
reference: Matthew 5:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: sw
  text: Lakini mimi nawaambia kwamba kila mtu anayemkasirikia ndugu yake[a][b] atastahili hukumu; na yeyote anayemwambia ndugu yake, “Raka!”[c] atastahili kufikishwa mbele ya baraza[d]; na yeyote anayesema, “Mpumbavu!” atastahili Gehena ya moto.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati huongeza “bila sababu” baada ya “anayemkasirikia ndugu yake.” Hati za mapema na zenye ushahidi bora zaidi hazina maneno hayo.
    reason: textual_variant
  - marker: b
    text: Neno “ndugu” hapa linatafsiri neno la umoja wa kiume ambalo linaweza kutumiwa kwa uwakilishi; fundisho hili halihusu ndugu wa kiume pekee.
    reason: lexical_alternative
  - marker: c
    text: “Raka” ni neno la dharau la Kiaramu, lenye maana inayokaribia “kichwa tupu” au “mtu asiyefaa kitu.”
    reason: cultural_note
  - marker: d
    text: Au “Sanhedrini,” yaani baraza kuu la utawala la Wayahudi.
    reason: alternative_reading
  - marker: e
    text: Au “jehanamu ya moto.” “Gehena” huhifadhi neno mahsusi alilotumia Yesu, lililotokana na taswira ya Bonde la Hinomu iliyohusishwa na hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Lakini mimi nawaambia
  rationale: “Lakini” huhifadhi utofautishaji wa δέ, na “mimi” hudumisha msisitizo wa ἐγώ; “nawaambia” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: kila mtu anayemkasirikia
  rationale: Huwasilisha kauli ya jumla ya kishiriki cha wakati uliopo bila kuifanya iwe tukio la mara moja tu.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: “Ndugu” huhifadhi uhusiano unaotajwa na ἀδελφός na katika Kiswahili inaweza kueleweka kwa upana; tanbihi inaeleza matumizi yake wakilishi.
- source_word: ἔνοχος ἔσται
  choice: atawajibika
  rationale: Kitenzi hiki kinaonyesha kwamba mtu atapaswa kujibu na yuko katika hatari ya adhabu ya kisheria; “atawajibika” hudumisha taswira hiyo bila kuamua mapema aina kamili ya hatia.
- source_word: τῇ κρίσει
  choice: kwa hukumu
  rationale: “Hukumu” huhifadhi uwezekano wa maana ya uamuzi au mchakato wa kimahakama bila kuibana kuwa mahakama fulani ya eneo.
- source_word: Ῥακά
  choice: Raka
  rationale: Tusi hili la Kiaramu limetoholewa badala ya kufutwa upekee wake; maana yake ya dharau imeelezwa katika tanbihi.
- source_word: τῷ συνεδρίῳ
  choice: mbele ya baraza
  rationale: “Baraza” hutafsiri συνέδριον bila kulazimisha kwamba hapa lazima pawe jina rasmi la Sanhedrini; uwezekano huo umetajwa katika tanbihi.
- source_word: Μωρέ
  choice: Mpumbavu!
  rationale: Ni tusi la moja kwa moja linalowasilisha nguvu ya mwito μωρέ kwa Kiswahili cha sasa bila kutumia lugha isiyo na uzito wa kimaadili.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: kuingia katika Gehena ya moto
  rationale: “Gehena” huhifadhi istilahi mahsusi na historia yake ya Kiyahudi; “ya moto” hudumisha taswira ya genitivi τοῦ πυρός.
theological_decisions:
- issue: Tafsiri ya γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: “Gehena” huhifadhi istilahi mahsusi aliyotumia Yesu na mandhari ya Bonde la Hinomu, bila kuingiza kimyakimya maana zote za baadaye zinazoweza kuhusishwa na “jehanamu.”
- issue: Maana ya ἀδελφός
  choice: ndugu
  alternative: ndugu wa kiume; ndugu katika imani
  rationale: Neno la Kigiriki ni la umoja wa kiume, lakini linaweza kutumika kwa uwakilishi. Kiswahili “ndugu” ni cha asili na kinaweza kujumuisha zaidi ya ndugu wa tumbo bila kulazimisha kwamba anayelengwa ni muumini pekee.
- issue: Kiwango cha hukumu katika τῇ κρίσει
  choice: hukumu
  alternative: mahakama
  rationale: Muktadha una taswira ya kisheria, lakini neno lenyewe linaweza kuashiria hukumu au chombo cha kuhukumu. Tafsiri haifungi maana kwenye mahakama maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi mfululizo wa maonyo matatu na ongezeko la taswira ya hukumu. “Raka” na “Gehena” zimehifadhiwa kama istilahi za kihistoria na kufafanuliwa kwa tanbihi; lugha ya kisheria imewekwa wazi bila kuondoa utata halisi wa κρίσις na συνέδριον.
