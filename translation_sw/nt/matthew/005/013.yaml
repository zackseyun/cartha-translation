id: MAT.5.13
reference: Matthew 5:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: sw
  text: Ninyi ni chumvi ya dunia. Lakini chumvi ikipoteza ladha yake, itatiwa chumvi kwa kitu gani? Haifai tena kwa lolote ila kutupwa nje na kukanyagwa na watu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo; “Ninyi” kinaonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: τὸ ἅλας τῆς γῆς
  choice: chumvi ya dunia
  rationale: γῆ inaweza kumaanisha dunia, nchi, au ardhi; hapa “dunia” linafaa kwa upeo mpana wa sitiari na ni usemi wa kawaida wa Kiswahili.
- source_word: μωρανθῇ
  choice: ikipoteza ladha yake
  rationale: Ingawa kitenzi hiki kinahusiana kimsingi na kuwa mpumbavu, kinapotumiwa kuhusu chumvi humaanisha kupoteza ladha au ukali wake. Tafsiri hii ni wazi na inadumisha sitiari.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: itatiwa chumvi kwa kitu gani?
  rationale: Muundo wa wakati ujao wa kutendwa unauliza ni kwa njia au kitu gani chumvi hiyo inaweza kutiwa chumvi tena; tafsiri hii inafuata muundo huo bila kuufafanua kupita kiasi.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Haifai tena kwa lolote
  rationale: Katika muktadha huu ἰσχύει huonyesha kufaa au kuwa na manufaa, si nguvu ya kimwili.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: ila kutupwa nje
  rationale: Huhifadhi maana ya kuondolewa na pia mwelekeo wa ἔξω, huku ikiwa usemi wa asili wa Kiswahili.
- source_word: καταπατεῖσθαι
  choice: kukanyagwa
  rationale: Kitenzi hiki humaanisha kukanyaga au kuponda kwa miguu; “kukanyagwa” ni tafsiri fupi na dhahiri.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: na watu
  rationale: ἀνθρώπων humaanisha wanadamu kwa ujumla. “Watu” huwasilisha maana hiyo ya jumla kiasili bila kuifanya ihusu wanaume pekee.
theological_decisions:
- issue: Upeo wa ὑπὸ τῶν ἀνθρώπων
  choice: na watu
  alternative: na wanadamu
  rationale: Neno la Kigiriki linawarejelea binadamu kwa ujumla, si wanaume pekee. Kiswahili “watu” kinahifadhi upeo huo bila kuingiza tofauti ya kijinsia ambayo haikusudiwi.
- issue: Maana ya μωρανθῇ katika sitiari ya chumvi
  choice: ikipoteza ladha yake
  alternative: ikiharibika
  rationale: Muktadha wa chumvi unaelekeza kwenye kupotea kwa ladha au sifa ya chumvi. Haijatafsiriwa “ikiwa mpumbavu,” kwa kuwa hilo lingehamisha sitiari na kuleta maana isiyo ya kawaida kwa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; swali na mvutano wa sitiari ya chumvi inayohitaji kutiwa chumvi vimehifadhiwa badala ya kufafanuliwa ndani ya matini.
