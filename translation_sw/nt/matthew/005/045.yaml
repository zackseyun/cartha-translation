id: MAT.5.45
reference: Matthew 5:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: sw
  text: ili mpate kuwa wana[a] wa Baba yenu aliye mbinguni[b], kwa sababu yeye hufanya jua lake liwachomozee waovu na wema, na huwanyeshea mvua wenye haki na wasio na haki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “wana.” Neno hili la uana limehifadhiwa; katika muktadha linawahusu wanafunzi wa Yesu kwa ujumla.'
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kwa neno: “aliye katika mbingu.” “Aliye mbinguni” ni usemi wa kawaida wa Kiswahili.'
    reason: lexical_alternative
  - marker: c
    text: Au, “na hunyesha mvua juu ya wenye haki na wasio na haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayokusudiwa; “ili” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: γένησθε
  choice: mpate kuwa
  rationale: Huhifadhi wazo la kuja kuwa au kudhihirika kuwa, bila kulifanya kuwa kauli tuli ya “mwe.”
- source_word: υἱοὶ
  choice: wana
  rationale: “Wana” huhifadhi lugha ya uhusiano wa kifamilia na Baba, na katika Kiswahili inaweza kutumiwa kwa watoto au wazao bila kulazimisha neno lisilo la asili kama “wana wa kiume” katika muktadha huu.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: wa Baba yenu
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha umilikaji na huhifadhi “Baba” kama jina la uhusiano.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: aliye mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa makao ya Mungu; wingi wa Kigiriki “mbingu” haudai usemi usio wa kawaida katika tafsiri.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha sababu inayoeleza himizo lililotangulia kwa uwazi katika Kiswahili cha sasa.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: jua lake
  rationale: Huhifadhi kiwakilishi cha umilikaji kilicho wazi katika Kigiriki na kuonyesha mamlaka ya Mungu juu ya uumbaji.
- source_word: ἀνατέλλει
  choice: hufanya ... liwachomozee
  rationale: Muundo huu wa kisababishi unaonyesha kwamba Mungu ndiye anayelifanya jua lake lichomoze, huku “-chomozea” ikitoa maana ya kuwafikia wale wanaotajwa.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: waovu na wema
  rationale: Vivumishi vya Kigiriki vinatumika kama nomino; Kiswahili pia huweza kuvitumia hivyo kwa ufupi na kwa ulinganifu.
- source_word: βρέχει
  choice: huwanyeshea mvua
  rationale: Ni Kiswahili cha asili kinachohifadhi Mungu kama mtendaji na wale wanaotajwa kama wapokeaji wa mvua.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: wenye haki na wasio na haki
  rationale: Jozi hii ya kimaadili ni wazi katika Kiswahili na huhifadhi upinzani wa δίκαιος na ἄδικος.
theological_decisions:
- issue: Lugha ya uana yenye umbo la kiume katika Kigiriki
  choice: wana wa Baba yenu
  alternative: watoto wa Baba yenu; wana wa kiume wa Baba yenu
  rationale: Kigiriki kina υἱοί, “wana.” Neno la Kiswahili “wana” huhifadhi uana na uhusiano na Baba kwa lugha ya asili; tanbihi inaeleza umbo la Kigiriki bila kudokeza kwamba wanafunzi wa kike wametengwa.
- issue: Nguvu ya γένησθε kuhusiana na uana kwa Mungu
  choice: mpate kuwa
  alternative: mwe; mpate kuthibitika kuwa
  rationale: “Mpate kuwa” huhifadhi nguvu ya kitenzi cha kuja kuwa, lakini mstari wenyewe unaelekeza kwenye kufanana kimaadili na ukarimu wa Baba; tafsiri haiongezi maelezo kuhusu utaratibu wa wokovu ambayo hayajasemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi wa jozi “waovu na wema” na “wenye haki na wasio na haki” umehifadhiwa. Vitenzi “hufanya ... liwachomozee” na “huwanyeshea” vinadumisha utendaji wa Mungu kwa lugha ya kawaida.
