id: MAT.5.29
reference: Matthew 5:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: sw
  text: Lakini ikiwa jicho lako la kulia linakukwaza[a], ling'oe, kisha litupe mbali nawe. Kwa maana ni afadhali kwako kiungo chako kimoja kipotee kuliko mwili wako wote utupwe katika Gehena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “linakusababisha kutenda dhambi.”'
    reason: lexical_alternative
  - marker: b
    text: Gehena ni umbo la Kigiriki la jina linalohusishwa na Bonde la Hinomu; kwa kawaida limetafsiriwa “kuzimu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: linakukwaza
  rationale: Huhifadhi sitiari ya kujikwaa au kuanguka bila kuifupisha moja kwa moja kuwa ‘linakusababisha kutenda dhambi’; katika muktadha, kukwazwa huku kunahusu kuanguka katika dhambi.
- source_word: ἔξελε
  choice: ling'oe
  rationale: Amri hii ni kali na ya haraka; ‘ng'oa’ huwasilisha nguvu ya kuondoa jicho, si kuliondoa kwa upole.
- source_word: βάλε ἀπὸ σοῦ
  choice: ulitupe mbali nawe
  rationale: Huhifadhi nguvu ya ‘tupa’ pamoja na wazo la kulitenga kabisa na mtu.
- source_word: συμφέρει
  choice: ni afadhali kwako
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha manufaa katika ulinganisho bila ladha ya kibiashara.
- source_word: ἀπόληται
  choice: kipotee
  rationale: Huwasilisha kupotea kwa kiungo kimoja kwa uzito unaofaa bila kulazimisha maana finyu ya kuangamizwa kabisa.
- source_word: μέλος
  choice: kiungo
  rationale: ‘Kiungo’ ni neno la kawaida kwa sehemu ya mwili na linafaa kwa jicho, tofauti na ‘mguu au mkono’.
- source_word: βληθῇ
  choice: utupwe
  rationale: Huhifadhi hali ya kutendwa na nguvu ya kitenzi βάλλω.
- source_word: γέενναν
  choice: Gehena
  rationale: Huhifadhi jina mahususi la Kigiriki badala ya kulisawazisha moja kwa moja na istilahi pana ya ‘kuzimu’; ufafanuzi umetolewa katika tanbihi.
- source_word: ὁ δεξιὸς
  choice: la kulia
  rationale: Huhifadhi wazi maelezo ya upande wa kulia yaliyomo katika chanzo.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mwendelezo wenye utofauti mdogo na kauli iliyotangulia.
theological_decisions:
- issue: Tafsiri ya γέεννα
  choice: Gehena
  alternative: kuzimu
  rationale: Jina mahususi limehifadhiwa ili kutoingiza moja kwa moja miungano yote ya baadaye ya kiteolojia; tanbihi inaeleza asili yake na tafsiri iliyozoeleka.
- issue: Nguvu ya kisitiari ya σκανδαλίζω
  choice: linakukwaza
  alternative: linakusababisha kutenda dhambi
  rationale: Matini kuu huhifadhi picha ya kukwazwa iliyo katika Kigiriki, huku tanbihi ikifafanua maana inayokusudiwa katika muktadha wa dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari kali ya mstari na istilahi mahususi ‘Gehena’ zikihifadhiwa.
