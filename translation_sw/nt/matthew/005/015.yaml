  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: sw
  text: Wala watu hawawashi taa na kuiweka chini ya chombo cha kupimia[a], bali huiweka juu ya kinara cha taa, nayo huwaangazia wote waliomo ndani ya nyumba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya chombo cha kipimo kiitwacho modio.” Neno la Kigiriki μόδιος linamaanisha kipimo cha vitu vikavu na pia chombo kilichotumiwa kupimia.
    reason: lexical_alternative
  - marker: b
    text: Au, “nayo huangaza kwa ajili ya wote waliomo ndani ya nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala
  rationale: Huendeleza mfano mwingine hasi unaohusiana na kauli iliyotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: καίουσιν λύχνον
  choice: watu hawawashi taa
  rationale: Kitenzi cha wingi kisicho na kiima wazi katika Kigiriki kina maana ya watu kwa ujumla. ‘Kuwasha taa’ ni usemi wa kawaida na hudumisha picha halisi ya taa.
- source_word: τιθέασιν αὐτόν
  choice: kuiweka
  rationale: Kiwakilishi cha yambwa ‘-i-’ kinarejelea taa kwa uwazi, na ‘kuweka’ ni kitenzi cha kawaida kinacholingana na tendo linaloelezwa.
- source_word: ὑπὸ τὸν μόδιον
  choice: chini ya chombo cha kupimia
  rationale: μόδιος ni kipimo cha vitu vikavu na pia chombo kilichotumiwa kupimia. ‘Chombo cha kupimia’ huwasilisha maana hiyo bila kudai kwa uhakika kuwa kilitengenezwa kama kikapu, wala kutumia neno la kale lisiloeleweka kwa urahisi.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: bali huiweka juu ya kinara cha taa
  rationale: λυχνία ni kitu cha kuwekea taa. Kurudia ‘huiweka’ kunafanya ulinganifu wa matendo uwe wazi na wa kawaida katika Kiswahili.
- source_word: λάμπει
  choice: huwaangazia
  rationale: Ingawa kimsingi kitenzi kina maana ya ‘kung’aa,’ hapa kinaeleza nuru ya taa inayowafikia watu wengine. ‘Huwaangazia’ huonyesha kazi hiyo kwa lugha ya kawaida huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na muundo wa Kigiriki.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: wote waliomo ndani ya nyumba
  rationale: Huhifadhi upeo wa πᾶσιν na maana ya mahali ya οἰκίᾳ; ‘ndani ya nyumba’ ni wazi kuliko ‘nyumbani’ ikiwa lengo ni kusisitiza watu waliomo humo.
theological_decisions:
- issue: Kiima cha wingi cha jumla hakijaelezwa wazi katika Kigiriki
  choice: watu hawawashi taa
  alternative: mtu hawashi taa; wao hawawashi taa
  rationale: ‘Watu’ hudumisha wingi wa kitenzi na maana ya methali inayohusu watu kwa ujumla, bila kuingiza kiima maalumu kisichotajwa.
- issue: Uhusiano wa λάμπει na πᾶσιν
  choice: nayo huwaangazia wote
  alternative: nayo huangaza kwa ajili ya wote
  rationale: Tafsiri kuu inaeleza kwa kawaida matokeo ya nuru kwa watu waliomo ndani, lakini tanbihi inahifadhi uwezekano wa kutafsiri muundo huo kwa ‘huangaza kwa ajili ya wote.’ Hakuna maana ya kiteolojia ya ziada inayoingizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Chombo cha kupimia’ kimetumiwa badala ya ‘pishi’ ili kuepuka neno la kale au lisiloeleweka kwa urahisi; ‘kinara cha taa’ hudumisha picha ya kitu ambacho taa huwekwa juu yake.
