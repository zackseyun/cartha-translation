id: MAT.5.16
reference: Matthew 5:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: sw
  text: Vivyo hivyo, nuru yenu na iangaze mbele ya watu, ili wayaone matendo yenu mema na wamtukuze Baba yenu aliye katika mbingu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye mbinguni.” Kigiriki kina wingi, “katika mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Inaunganisha agizo hili na mfano uliotangulia wa taa na nuru, huku ikionyesha namna jambo hilo linavyopaswa kutendeka.
- source_word: λαμψάτω
  choice: na iangaze
  rationale: Huwasilisha kwa Kiswahili cha kawaida nguvu ya amri ya nafsi ya tatu, ikirejelea nomino ya umoja “nuru.”
- source_word: τὸ φῶς ὑμῶν
  choice: nuru yenu
  rationale: Ni umbo la kawaida la umilikaji na linadumisha umoja wa “nuru,” unaowakilisha kwa pamoja ushuhuda unaoonekana wa wanafunzi.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: Neno ἀνθρώπων hapa linamaanisha wanadamu kwa ujumla; “watu” ni sahihi, jumuishi, na la kawaida katika Kiswahili.
- source_word: ὅπως
  choice: ili
  rationale: Huonyesha kusudi la kuangaza kwa nuru kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἴδωσιν
  choice: wayaone
  rationale: Huhifadhi utegemezi wa kitenzi baada ya kishazi cha kusudi na kukirejelea kwa uwazi kirai “matendo yenu mema.”
- source_word: τὰ καλὰ ἔργα
  choice: matendo yenu mema
  rationale: “Matendo mema” ni tafsiri ya kawaida na iliyo wazi ya έργα καλὰ; mpangilio huu wa Kiswahili pia huwasilisha umilikaji wa ὑμῶν.
- source_word: δοξάσωσιν
  choice: wamtukuze
  rationale: “Kumtukuza” ni neno la kawaida la kibiblia na la sasa kwa kumpa Mungu utukufu, bila kupunguza uzito wa δοξάζω.
- source_word: τὸν πατέρα ὑμῶν
  choice: Baba yenu
  rationale: Huhifadhi lugha ya uhusiano na umilikaji iliyo katika chanzo kwa Kiswahili cha kawaida.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: aliye katika mbingu
  rationale: Huhifadhi wingi wa οὐρανοῖς kwa uwazi zaidi kuliko usemi wa kawaida “aliye mbinguni,” huku ikiendelea kueleweka vizuri.
theological_decisions:
- issue: Maana ya kijumla ya ἀνθρώπων
  choice: mbele ya watu
  alternative: mbele ya wanadamu
  rationale: Katika muktadha huu neno hilo halimaanishi wanaume pekee. “Watu” huwasilisha maana ya kijumla kwa usahihi na kwa lugha ya kawaida bila kuhitaji ufafanuzi wa ziada.
- issue: Wingi wa οὐρανοῖς
  choice: aliye katika mbingu
  alternative: aliye mbinguni
  rationale: Uwingi wa Kigiriki umehifadhiwa katika matini kuu. Tanbihi inataja usemi mwingine wa kawaida wa Kiswahili bila kudai tofauti ya maana ya kiteolojia.
- issue: Uhusiano kati ya matendo ya wanafunzi na utukufu wa Baba
  choice: ili wayaone matendo yenu mema na wamtukuze Baba yenu
  alternative: ili, watakapoona matendo yenu mema, wamtukuze Baba yenu
  rationale: Muundo uliochaguliwa unafuata kwa karibu vitenzi viwili tegemezi vya Kigiriki chini ya ὅπως na unaacha wazi mvutano wa matendo kuonekana huku utukufu ukielekezwa kwa Baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekewa mtiririko wa kawaida wa Kiswahili huku ikihifadhi taswira ya nuru, nguvu ya agizo, kusudi la matendo kuonekana, na wingi wa neno la Kigiriki linalomaanisha “mbingu.”
