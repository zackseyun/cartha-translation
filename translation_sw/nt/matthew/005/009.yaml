  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: sw
  text: Heri wanaoleta amani, kwa sababu wao wataitwa wana wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Mungu.” Kigiriki kinasema “wana wa Mungu,” kikitumia nomino ya kiume ya wingi kwa maana inayowakilisha wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Neno la kawaida na lenye hadhi katika kauli za heri; linaonyesha hali ya kupendelewa na Mungu, si hisia ya furaha tu.
- source_word: εἰρηνοποιοί
  choice: wanaoleta amani
  rationale: Linaonyesha watu wanaotenda kwa bidii ili amani ipatikane, na hivyo kuhifadhi maana ya mtendaji iliyo katika nomino ambatani ya Kigiriki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Linaonyesha wazi sababu au msingi wa kauli ya heri.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi hiki kinahifadhi mkazo wa Kigiriki kwa njia ya kawaida katika Kiswahili.
- source_word: υἱοὶ θεοῦ
  choice: wana wa Mungu
  rationale: Ni usemi wa kifamilia wenye hadhi unaofuata muundo wa chanzo. Katika Kiswahili, “wana” ni wa asili na unaweza kuwa na maana wakilishi; tanbihi inaeleza kuwa Kigiriki kimetumia nomino ya kiume ya wingi.
- source_word: κληθήσονται
  choice: wataitwa
  rationale: Linatafsiri moja kwa moja kitenzi cha wakati ujao katika hali ya kutendwa bila kukifasiri zaidi kuwa kutambuliwa na watu tu.
theological_decisions:
- issue: Lugha ya kifamilia yenye jinsia katika υἱοὶ θεοῦ
  choice: wana wa Mungu
  alternative: watoto wa Mungu
  rationale: “Wana wa Mungu” hudumisha kwa kadiri ya kawaida muundo na uzito wa lugha ya kifamilia ya chanzo, huku tanbihi ikibainisha maana jumuishi inayowezekana bila kufuta umbo la kiume la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wanaoleta amani” ni wazi kwa msomaji wa kawaida na hukazia hatua ya kuifanya amani ipatikane; “wana wa Mungu” huhifadhi mvutano wa lugha ya chanzo bila kulazimisha tafsiri ya kimadhehebu.
