  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: sw
  text: Furahini na shangilieni sana, kwa sababu thawabu yenu ni kubwa mbinguni[a]; kwa maana ndivyo walivyowatesa manabii waliowatangulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mbingu.” Mathayo mara nyingi hutumia umbo la wingi mahali ambapo Kiswahili kwa kawaida husema “mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Furahini
  rationale: Kitenzi cha kuamuru katika wingi kinatoa mwito wa kufurahi kwa dhati; ‘Furahini’ ni Kiswahili cha kawaida, wazi na chenye hadhi.
- source_word: ἀγαλλιᾶσθε
  choice: mshangilie sana
  rationale: Kitenzi hiki kinaonyesha furaha kubwa na ya wazi zaidi kuliko χαίρετε. ‘Mshangilie sana’ huhifadhi ongezeko hilo la nguvu kwa lugha inayoeleweka.
- source_word: μισθὸς
  choice: thawabu
  rationale: Katika muktadha wa malipo ya Mungu kwa wanaoteswa, ‘thawabu’ ni ya kawaida kuliko ‘mshahara’ na haileti maana finyu ya shughuli ya kibiashara.
- source_word: πολὺς
  choice: kubwa
  rationale: Kivumishi hiki kinaeleza ukubwa wa thawabu; ‘thawabu ... kubwa’ ni usemi wa asili katika Kiswahili.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni[a]
  rationale: ‘Mbinguni’ ni namna ya kawaida ya Kiswahili ya kutaja makao ya mbinguni. Tanbihi inaonyesha kwamba Kigiriki kimetumia umbo la wingi.
- source_word: οὕτως
  choice: ndivyo
  rationale: 'Neno hili linaonyesha ulinganifu wa namna: mateso ya wanafunzi yanafanana na yale waliyopata manabii.'
- source_word: ἐδίωξαν
  choice: walivyowatesa
  rationale: Katika muktadha huu διώκω ina maana ya kutenda kwa uhasama au kuwatesa, si kufuatilia tu.
- source_word: προφήτας
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watu wa Mungu waliotoa ujumbe wa kinabii.
- source_word: τοὺς πρὸ ὑμῶν
  choice: waliowatangulia
  rationale: Usemi huu unaonyesha kwamba manabii waliishi kabla ya wasikilizaji; ‘waliowatangulia’ ni mfupi na wa asili.
theological_decisions:
- issue: Maana ya ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  alternative: katika mbingu
  rationale: Uamuzi huu ni wa lugha, si wa kutatua hoja ya kimafundisho. ‘Mbinguni’ humwelekeza msomaji kwenye ulimwengu wa mbinguni ambako thawabu iko, huku tanbihi ikihifadhi taarifa kwamba maandishi ya Kigiriki yana umbo la wingi.
- issue: Uhusiano kati ya mateso ya wanafunzi na ya manabii
  choice: ndivyo walivyowatesa
  alternative: vivyo hivyo waliwatesa
  rationale: ‘Ndivyo’ huhifadhi nguvu ya οὕτως kama rejeo la namna ya mateso, bila kudai kwamba kila jambo lililotokea kwa makundi hayo lilikuwa sawa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri mbili zimehifadhiwa, huku ‘sana’ ikionyesha nguvu zaidi ya kitenzi cha pili. ‘Waliowatangulia’ huwasilisha utangulizi wa kihistoria kwa ufupi na kwa lugha ya kawaida.
