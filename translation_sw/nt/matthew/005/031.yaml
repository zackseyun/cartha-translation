base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: sw
  text: Lakini ilisemwa, “Mtu yeyote anayempa mke wake talaka[a], na ampe hati ya talaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu yeyote anayemwacha mke wake, na ampe hati ya talaka.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumwacha” au “kumfukuza,” lakini hapa, katika muktadha wa kisheria wa ndoa, kinarejelea talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: ilisemwa
  rationale: Kauli tendwa ya wakati uliopita katika mtindo huu wa Mathayo hutambulisha nukuu; “ilisemwa” ni ya kawaida, wazi, na inadumisha muundo wa chanzo.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi hiki kinaashiria mpito wenye utofautishaji katika mfululizo wa mafundisho; “Lakini” kinafaa katika muktadha huu.
- source_word: Ὃς ἂν
  choice: Yeyote anaye-
  rationale: Muundo huu unaonyesha sharti la jumla lisilomhusu mtu mmoja maalumu; “Yeyote anaye-” ni Kiswahili cha asili na sahihi.
- source_word: ἀπολύσῃ
  choice: anayempa talaka
  rationale: Ingawa kitenzi kinaweza kumaanisha kumwacha au kumfukuza, katika muktadha huu wa ndoa na hati ya talaka kinamaanisha kuvunja ndoa kisheria.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: mke wake
  rationale: γυνή hapa ni “mke,” si “mwanamke,” kwa sababu ya kimilikishi na muktadha wa talaka.
- source_word: δότω
  choice: na ampe
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu kwa mtindo wa kawaida wa Kiswahili katika kauli hii ya kisheria.
- source_word: αὐτῇ
  choice: ampe
  rationale: Kiambishi cha yambwa “-m-” ndani ya kitenzi “ampe” huwasilisha kwa kawaida maana ya “amkabidhi yeye.”
- source_word: ἀποστάσιον
  choice: hati ya talaka
  rationale: Neno hili linamaanisha hati iliyoandikwa ya kuthibitisha talaka; “hati ya talaka” ni wazi, fupi, na lina uzito wa kisheria.
theological_decisions:
- issue: Uhusiano wa maneno ya Yesu na agizo la talaka katika Sheria ya Musa
  choice: Kauli imetafsiriwa kama nukuu ya tamko la kisheria bila kuingiza ndani ya aya hii kibali au lawama.
  alternative: Kuitafsiri kwa ufafanuzi zaidi kana kwamba aya yenyewe inaidhinisha talaka, au kana kwamba inaeleza tu desturi ya kawaida.
  rationale: Aya hii inatanguliza tamko ambalo Yesu atalijadili katika aya inayofuata; tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia bila kuutatua mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi mtindo wa nukuu ya kisheria na hali ya masharti ya jumla.
