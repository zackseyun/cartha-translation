id: MAT.5.32
reference: Matthew 5:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: sw
  text: Lakini mimi nawaambia kwamba kila mtu anayempa talaka mke wake, isipokuwa kwa sababu ya uasherati[a], anamfanya azini[b]; na yeyote anayemwoa mwanamke aliyepewa talaka anazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uasherati” hutafsiri neno la Kigiriki porneia, ambalo lina maana pana ya mwenendo wa kingono usio halali; wengine hulitafsiri “ukahaba” au “uchafu wa kingono.”
    reason: lexical_alternative
  - marker: b
    text: Au kwa tafsiri iliyo karibu zaidi na umbo la Kigiriki, “anamfanya kuwa mzinzi”; kitenzi cha Kigiriki kina umbo la kutendwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: anayempa talaka / aliyepewa talaka
  rationale: Katika muktadha wa ndoa, ἀπολύω humaanisha kuvunja ndoa kwa talaka, si kuondoa au kuachilia kwa maana ya jumla. Lugha ya “kumpa talaka” inaeleza maana hiyo ya kisheria na kindoa kwa Kiswahili cha sasa.
- source_word: γυναῖκα
  choice: mke
  rationale: γυνή inaweza kumaanisha mwanamke au mke; hapa kiwakilishi cha umilikaji αὐτοῦ na muktadha wa talaka vinahitaji “mke.”
- source_word: παρεκτὸς λόγου πορνείας
  choice: isipokuwa kwa sababu ya uasherati
  rationale: παρεκτός huleta hali ya pekee, na λόγου hapa ni sababu au msingi. “Uasherati” ni neno linaloeleweka na lenye upana wa kutosha kuwakilisha πορνεία bila kulifinya kuwa uzinzi wa mtu aliye katika ndoa pekee.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: anamfanya azini
  rationale: Muundo wa ποιέω pamoja na kitenzi-jina una maana ya kusababisha. Tafsiri hii ni ya kawaida na wazi katika Kiswahili, huku tanbihi ikihifadhi ukweli kwamba μοιχευθῆναι ina umbo la kutendwa na inaweza kueleweka kwa namna ya matokeo.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: yeyote anayemwoa
  rationale: Kishazi hiki cha Kigiriki huonyesha hali ya jumla isiyomhusu mtu maalumu; “yeyote anayemwoa” ni fupi na ya kawaida.
- source_word: μοιχᾶται
  choice: anazini
  rationale: Katika muktadha huu μοιχᾶται inaeleza kutenda uzinzi. “Anazini” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: πᾶς ὁ ἀπολύων
  choice: kila mtu anayempa talaka
  rationale: Muundo wa Kigiriki ni wa jumla. “Kila mtu” huhifadhi ujumla huo, huku “mke wake” ikibakiza mazingira ya kijamii yaliyoelezwa katika sentensi.
theological_decisions:
- issue: Maana ya kishazi cha pekee παρεκτὸς λόγου πορνείας
  choice: isipokuwa kwa sababu ya uasherati
  alternative: isipokuwa katika habari ya uasherati; isipokuwa ikiwa ndoa si halali
  rationale: Kigiriki kinaonyesha wazi hali ya pekee, kwa hiyo tafsiri haipaswi kuificha. Hata hivyo, “uasherati” hauamui kwa niaba ya msomaji mipaka kamili ya πορνεία, hivyo mvutano wa kitheolojia unabaki.
- issue: Nguvu ya μοιχευθῆναι baada ya ποιεῖ
  choice: anamfanya azini
  alternative: anamfanya kuwa mzinzi; anasababisha uzinzi utendwe dhidi yake
  rationale: Tafsiri kuu inatanguliza Kiswahili cha kawaida, lakini tanbihi inaonyesha umbo la kutendwa la Kigiriki ili kutotatua kimya kimya utata kati ya tendo na hali au matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kumpa talaka” limetumiwa badala ya “kumwacha” ili maana ya kuvunja ndoa iwe wazi; “uasherati” na “uzinzi” zimetofautishwa ili kuhifadhi tofauti kati ya πορνεία na μοιχεία.
