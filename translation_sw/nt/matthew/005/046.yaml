id: MAT.5.46
reference: Matthew 5:46
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: sw
  text: Kwa maana, ikiwa mnawapenda wale wanaowapenda ninyi, mna thawabu gani?[a] Je, hata watoza ushuru hawafanyi vivyo hivyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mna ujira gani?” Neno la Kigiriki linaweza kumaanisha “ujira” au “thawabu”; hapa linahusu malipo katika muktadha wa mafundisho ya Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Kwa maana, ikiwa
  rationale: “Kwa maana” linaendeleza hoja iliyotangulia, huku “ikiwa” likihifadhi sharti la ἐάν kwa Kiswahili cha kawaida.
- source_word: ἀγαπήσητε
  choice: mnawapenda
  rationale: Wakati wa sasa katika kisharti unaeleza hali ya jumla kwa ufasaha bila kulazimisha dhana maalumu ya hali ya tendo la Kigiriki.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: wale wanaowapenda ninyi
  rationale: “Wale wanao-” linawakilisha kundi linalofafanuliwa na tendo lao; kurudia mzizi “-penda” kunahifadhi ulinganifu wa maneno ya Kigiriki.
- source_word: τίνα μισθὸν ἔχετε
  choice: mna thawabu gani
  rationale: μισθός inaweza kumaanisha ujira au thawabu. Katika mafundisho haya ya kimaadili, “thawabu” ni ya asili na haifanyi wazo kuwa malipo ya kimkataba.
- source_word: οὐχὶ καὶ
  choice: Je, hata ... hawa-
  rationale: Muundo huu wa swali unatarajia jibu la ndiyo, na “hata” linahifadhi mkazo wa καί.
- source_word: οἱ τελῶναι
  choice: watoza ushuru
  rationale: Ni neno wazi na la kawaida kwa watu waliokusanya kodi au ushuru katika mazingira ya Injili.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: hawafanyi vivyo hivyo
  rationale: “Kufanya vivyo hivyo” ni Kiswahili cha asili kinachowasilisha kwa usahihi maana ya kufanya jambo lilelile.
theological_decisions:
- issue: Maana ya μισθός katika mafundisho ya Yesu kuhusu maadili
  choice: thawabu
  alternative: ujira; malipo
  rationale: “Thawabu” huhifadhi wazo la malipo au jibu linalostahili katika muktadha bila kuingiza fundisho la kwamba kibali cha Mungu hununuliwa kwa matendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Ninyi” limetumiwa kwa mkazo na uwazi baada ya kiambishi cha yambwa; swali la mwisho limeundwa kwa “Je ...?” ili kuhifadhi nguvu ya swali la balagha.
