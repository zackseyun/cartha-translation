  source_fidelity: “Kwa maana, ikiwa” accurately represents the connective γάρ and conditional ἐάν. The reciprocal wording “mnawapenda wale wanaowapenda ninyi” preserves the parallel use of ἀγαπάω. “Mna thawabu gani?” appropriately renders τίνα μισθὸν ἔχετε, and the final rhetorical question correctly conveys οὐχὶ καὶ οἱ τελῶναι τὸ αὐτὸ ποιοῦσιν.
  naturalness: The wording is fluent, modern Standard East African Swahili. The explicit “ninyi” provides acceptable contrastive emphasis, and “Je, hata watoza ushuru hawafanyi vivyo hivyo?” is an idiomatic negative rhetorical question expecting agreement.
  terminology: “Thawabu” is suitable for μισθός in this ethical context, without importing a particular doctrine of merit. “Watoza ushuru” is clear, standard, and historically appropriate for τελῶναι. The footnote’s alternative “ujira” responsibly reflects the lexical range.
