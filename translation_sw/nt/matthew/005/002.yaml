lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Inahifadhi kiunganishi rahisi cha simulizi bila kuongeza maana ya wazi ya wakati ambayo haimo katika καί.
- source_word: ἀνοίξας
  choice: akafungua
  rationale: Inawakilisha kishirikishi cha aoristi kwa tendo lililotangulia tendo kuu, kwa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: τὸ στόμα αὐτοῦ
  choice: kinywa chake
  rationale: Inahifadhi tamathali rasmi ya chanzo, ‘akafungua kinywa chake,’ badala ya kuifupisha kuwa ‘akaanza kusema.’
- source_word: ἐδίδασκεν
  choice: akawafundisha
  rationale: Ni usemi wa kawaida wa kisimulizi kwa wakati uliopita; muktadha wa hotuba inayofuata unaonyesha tendo la kufundisha lililoendelea bila kulazimisha tafsiri ya ‘akaanza.’
- source_word: αὐτοὺς
  choice: -wa-
  rationale: Kiambishi cha yambwa katika ‘akawafundisha’ kinahifadhi kiwakilishi kisichowataja kwa namna nyembamba zaidi kuwa wanafunzi au watu.
- source_word: λέγων
  choice: akisema
  rationale: Inahifadhi kishirikishi kinachoanzisha maneno yenyewe ya mafundisho.
