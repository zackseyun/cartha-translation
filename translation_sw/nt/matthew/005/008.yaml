lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Kauli ya kawaida na yenye hadhi katika tafsiri za Heri; inaonyesha hali yenye kibali na baraka, si hisia ya furaha tu.
- source_word: καθαροὶ
  choice: safi
  rationale: Huwasilisha usafi wa ndani na wa kimaadili katika muktadha huu; pia inaweza kutafsiriwa ‘wasio na unajisi.’
- source_word: τῇ καρδίᾳ
  choice: walio na moyo safi
  rationale: Muundo huu ni wa asili katika Kiswahili na unaelekeza usafi huo kwa utu wa ndani, si hisia peke yake.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu au msingi wa kutangazwa kwao kuwa wenye heri.
- source_word: αὐτοὶ
  choice: wao
  rationale: Kiwakilishi hiki kinahifadhi msisitizo wa Kigiriki kwamba watu hao hao ndio watakaopokea ahadi.
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya kitenzi ‘watamwona’ na hutafsiriwa kwa kawaida kuwa ‘Mungu.’
- source_word: ὄψονται
  choice: watamwona
  rationale: Huhifadhi ahadi ya wakati ujao kwa lugha ya sasa na ya kawaida ya Kiswahili bila kuipanua kiufafanuzi.
theological_decisions:
- issue: Maana ya ‘watamwona Mungu’
  choice: Imehifadhiwa moja kwa moja kama ‘watamwona Mungu.’
  alternative: ‘watauhisi uwepo wa Mungu’ au ‘watamtazama Mungu katika utimilifu wa mwisho’
  rationale: Kigiriki ni kifupi na kina kina cha kitheolojia ambacho kinaweza kuhusisha kuingia moja kwa moja katika uwepo wa Mungu, pamoja na utimilifu wake wa wakati ujao. Tafsiri haifungi maana hiyo katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Heri’ linafaa kwa mtindo wa semi hizi, na ‘moyo safi’ ni usemi wa kawaida unaoeleweka kama usafi wa utu wa ndani.
