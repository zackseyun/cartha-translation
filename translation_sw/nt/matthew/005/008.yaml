  text: Heri wenye moyo safi,[a] kwa sababu wao watamwona Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio safi moyoni.”
    reason: lexical_alternative
  - marker: b
    text: Ahadi ya “watamwona Mungu” inaweza kurejelea kuingia moja kwa moja katika uwepo wa Mungu, ikiwemo katika utimilifu wa wakati ujao; tafsiri imehifadhi maneno yenyewe bila kuifungia maana katika tafsiri moja.
