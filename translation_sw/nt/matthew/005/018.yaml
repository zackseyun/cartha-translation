  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: sw
  text: 'Kwa maana, kweli, ninawaambia: mpaka mbingu na dunia zitakapopita, hata herufi moja ndogo kabisa[a], wala alama moja ndogo katika herufi[b], haitaondoka kamwe kutoka katika Sheria, mpaka mambo yote yatakapotokea.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiyunani: “yota moja”; yota ni jina la herufi ndogo zaidi.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kistari kimoja”; yaani, alama ndogo sana inayosaidia kutofautisha herufi.'
    reason: lexical_alternative
  - marker: c
    text: 'Au: “mpaka yote yatimie” / “mpaka kila kitu kitakapofanyika.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: kweli
  rationale: Katika maneno ya Yesu, neno hili linatanguliza kauli nzito na yenye mamlaka. “Kweli” ni Kiswahili cha sasa kinachoeleweka na kuhifadhi nguvu ya uthibitisho huo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli hii inaeleza au kuunga mkono yaliyotangulia; “kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili inayohifadhi sauti ya Yesu yenye mamlaka.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: mpaka mbingu na dunia zitakapopita
  rationale: “Kupita” huhifadhi taswira ya παρέρχομαι na hali ya baadaye iliyo katika muundo wa Kiyunani.
- source_word: ἰῶτα ἓν
  choice: herufi moja ndogo kabisa
  rationale: Ἰῶτα ni jina la herufi ndogo sana. Tafsiri hii inawasilisha maana yake kwa wasomaji wa kawaida, huku jina halisi la herufi likihifadhiwa katika tanbihi.
- source_word: μία κεραία
  choice: alama moja ndogo ya maandishi
  rationale: Κεραία ni kistari au sehemu ndogo sana ya umbo la herufi. Kauli hii ni ya kawaida na inaeleweka bila kutumia neno la kizamani.
- source_word: οὐ μὴ παρέλθῃ
  choice: haitapita kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi tegemezi ni kanusho lenye mkazo mkubwa; “haitapita kamwe” huhifadhi msisitizo huo.
- source_word: ἀπὸ τοῦ νόμου
  choice: kutoka katika sheria
  rationale: Tafsiri hii inafuata muundo wa Kiyunani na kuacha muktadha uonyeshe kuwa ni sheria ya Mungu iliyo katika Maandiko, bila kuipanua waziwazi kuwa Maandiko yote.
- source_word: ἕως ἂν πάντα γένηται
  choice: mpaka mambo yote yatakapotokea
  rationale: Γίνομαι inaweza kumaanisha kutokea, kuwa, au kufanyika. “Yatakapotokea” huhifadhi maana pana bila kuamua kimbele ikiwa mkazo ni utimilifu, utekelezaji, au kutokea kwa matukio.
theological_decisions:
- issue: Maana ya νόμος katika kauli ya Yesu
  choice: sheria ya Mungu iliyo katika Maandiko
  alternative: Torati hasa, au kwa upana Agano la Kale lote
  rationale: Muktadha wa Mathayo 5:17–19 unataja “Sheria na Manabii,” lakini neno lenyewe hapa ni νόμος. Matini kuu inasema tu “sheria” ili kuepuka kufunga maana kwenye upeo mmoja wa kitheolojia.
- issue: Nguvu ya πάντα γένηται
  choice: mpaka mambo yote yatakapotokea
  alternative: mpaka yote yatimie; mpaka kila kitu kitakapofanyika
  rationale: Kirai kinaweza kueleza kutokea au kutimizwa kwa yote yaliyokusudiwa. Tafsiri kuu inabaki pana, na tanbihi inaonyesha uwezekano wa maana ya utimilifu bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha urudiaji wa “mpaka” katika Kiyunani na msisitizo wa kanusho, huku istilahi za kitaalamu za uandishi zikielezwa kwa lugha ya kawaida na katika tanbihi.
