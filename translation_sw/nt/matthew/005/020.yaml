id: MAT.5.20
reference: Matthew 5:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: sw
  text: Kwa maana nawaambia kwamba haki yenu[a] isipozidi ile ya walimu wa sheria na Mafarisayo, hakika hamtaingia katika ufalme wa mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.” Neno la Kigiriki linaweza kuhusisha kuwa sawa mbele za Mungu na kutenda yaliyo ya haki; hapa “haki” linafaa zaidi katika muktadha wa Mathayo 5.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana nawaambia
  rationale: “Kwa maana” inaonyesha kwamba kauli hii inafafanua yaliyotangulia, na “nawaambia” ni usemi wa moja kwa moja na wa kawaida katika Kiswahili cha sasa.
- source_word: ἐὰν μὴ
  choice: isipo-
  rationale: Muundo wa sharti hasi “isipo-” unawasilisha kwa ufupi na kwa kawaida maana ya “isipokuwa ikiwa” katika sentensi hii.
- source_word: περισσεύσῃ ... πλεῖον
  choice: isipozidi ile ya
  rationale: Kitenzi “zidi” kinahifadhi ulinganisho wa kiasi au kiwango, huku “ile ya” kikionyesha wazi kwamba haki yao inalinganishwa na haki ya makundi yaliyotajwa.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: haki yenu
  rationale: “Haki” ni neno la kawaida la kibiblia katika Kiswahili kwa hali na mwenendo unaopatana na mapenzi ya Mungu; pia linahifadhi upana wa δικαιοσύνη bila kuufupisha kuwa wazo moja tu.
- source_word: γραμματέων
  choice: walimu wa sheria
  rationale: Katika muktadha wa Injili, neno hili linataja wataalamu waliotambuliwa katika Sheria. “Walimu wa sheria” linaeleweka wazi zaidi kwa msomaji wa sasa kuliko “waandishi,” ambalo leo kwa kawaida humaanisha watu wanaoandika vitabu au habari.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la Kiyahudi.
- source_word: οὐ μὴ εἰσέλθητε
  choice: hakika hamtaingia
  rationale: “Hakika” linahifadhi msisitizo mkubwa wa ukanushaji wa Kigiriki οὐ μή, bila kutumia lugha ya kizamani.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida na unaoeleweka wa Kiswahili kwa msemo maalumu unaotumiwa na Mathayo.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika muktadha wa Mathayo 5
  choice: haki
  alternative: uadilifu
  rationale: Muktadha unahusu maisha yanayopatana kwa kweli na mapenzi ya Mungu, si hadhi ya kisheria pekee wala haki ya kijamii pekee. “Haki” linadumisha upana huo na ni neno lililozoeleka katika lugha ya kibiblia ya Kiswahili; tanbihi inahifadhi uwezekano wa “uadilifu.”
- issue: Kitu kinacholinganishwa katika πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: haki yenu ... ile ya walimu wa sheria na Mafarisayo
  alternative: haki yenu ... walimu wa sheria na Mafarisayo
  rationale: Kigiriki kina ulinganisho wenye ufupisho wa kisarufi. Kuongeza “ile ya” katika Kiswahili kunaweka wazi kwamba kinacholinganishwa ni haki yao, si kwamba wanafunzi wanapaswa kuwazidi watu hao kwa namna isiyoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walimu wa sheria” limetumiwa badala ya “waandishi” ili kazi ya kundi hilo ieleweke kwa wasomaji wa kawaida. Sentensi inadumisha sharti hasi na msisitizo mkali wa hitimisho.
