  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: sw
  text: Na mtu anayetaka kukupeleka mahakamani[a] ili achukue vazi lako la ndani, mwachie pia vazi lako la nje.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukushitaki.” Neno la Kigiriki kihalisi linahusu kuhukumiwa katika mazingira ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: “Vazi la ndani” hutafsiri χιτών, na “vazi la nje” hutafsiri ἱμάτιον.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: yeyote anayetaka
  rationale: Kirai hiki cha kisifa chenye kibainishi kinamtaja mtu yeyote kwa ujumla; “anayetaka” kinahifadhi maana ya nia kwa Kiswahili cha kawaida.
- source_word: σοι κριθῆναι
  choice: kukushitaki
  rationale: Ingawa kitenzi hiki kihalisi huhusu kuhukumiwa au kwenda mahakamani, katika muktadha huu kinaonyesha hatua ya kisheria dhidi ya msikilizaji. “Kukushitaki” ni kifupi na cha kawaida, huku tanbihi ikihifadhi namna pana zaidi ya kueleza jambo hilo.
- source_word: χιτῶνά
  choice: kanzu
  rationale: Neno hili linamaanisha vazi la ndani lililovaliwa mwilini. “Kanzu” linafaa kwa vazi refu la wakati huo na linadumisha tofauti yake na joho, ingawa tanbihi inafafanua tofauti hiyo ya kitamaduni.
- source_word: λαβεῖν
  choice: kuchukua
  rationale: Katika muktadha wa madai ya kisheria, neno hili linamaanisha kupata au kuchukua umiliki; “kuchukua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἄφες
  choice: mwachie
  rationale: Amri hii ina maana ya kuachilia au kumruhusu mwingine awe na kitu hicho. “Mwachie” huhifadhi nguvu ya amri bila kuongeza wazo la utaratibu rasmi wa kukabidhi.
- source_word: ἱμάτιον
  choice: joho
  rationale: Neno hili linataja vazi la nje, tofauti na χιτών. “Joho” linaonyesha vazi la nje la wakati huo kwa lugha inayoeleweka.
- source_word: καὶ ... καὶ
  choice: Na ... pia
  rationale: “Na” linaunganisha kauli hii na iliyotangulia, na “pia” linaonyesha nyongeza yenye mkazo ya kutoa hata vazi la nje.
theological_decisions:
- issue: Nguvu ya kimaadili ya agizo la Yesu katika mgogoro wa kisheria
  choice: Agizo la moja kwa moja la kutolipiza kisasi na kuachilia kwa ukarimu mkubwa
  alternative: Kulieleza kwa ujumla tu kama kanuni ya kuachilia haki binafsi
  rationale: Amri ἄφες na mfano mahsusi wa mavazi hudumisha ukali wa fundisho la Yesu. Tafsiri haipunguzi agizo kuwa sitiari wala kuliingiza katika mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yeyote” linaonyesha mtu wa aina yoyote, na mpangilio wa sentensi unahifadhi agizo kali na nyongeza ya “pia” bila kuwa mzito.
