id: MAT.5.35
reference: Matthew 5:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: sw
  text: wala kwa dunia, kwa sababu ni kiti cha kuwekea miguu yake[a]; wala kwa Yerusalemu[b], kwa sababu ni mji wa Mfalme mkuu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dokezo la Isaya 66:1: “Dunia ni kiti cha kuwekea miguu yangu.”'
    reason: cross_reference
  - marker: b
    text: Kigiriki hutumia kihusishi ambacho kwa maana ya moja kwa moja ni “kuelekea/kuingia Yerusalemu,” lakini hapa huenda kimetumiwa kiidioma katika lugha ya kiapo kwa maana ya “kwa Yerusalemu.”
    reason: lexical_alternative
  - marker: c
    text: Dokezo la Zaburi 48:2, ambako Yerusalemu huitwa “mji wa Mfalme mkuu.”
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: wala
  rationale: Katika mfululizo huu wa makatazo, “wala” huendeleza kwa kawaida muundo ulioanza katika mstari uliotangulia.
- source_word: ἐν τῇ γῇ
  choice: kwa dunia
  rationale: Ingawa ἐν kwa kawaida humaanisha “katika,” hapa iko katika lugha ya kiapo na maana yake ni kuapa kwa kutaja dunia.
- source_word: γῇ
  choice: dunia
  rationale: Muktadha unatofautisha dunia na mbingu na Yerusalemu; hivyo neno hili halimaanishi nchi fulani.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Neno hili linatoa sababu ya kila katazo kwa lugha ya kawaida na iliyo wazi.
- source_word: ὑποπόδιόν
  choice: kiti cha kuwekea miguu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kitu cha kuegemezea au kuwekea miguu na kuhifadhi taswira ya maandiko yanayodokezwa.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: miguu yake
  rationale: Huhifadhi uhusiano wa umilikaji katika Kigiriki bila kumtaja Mungu moja kwa moja mahali ambapo chanzo kinatumia kiwakilishi.
- source_word: εἰς Ἱεροσόλυμα
  choice: kwa Yerusalemu
  rationale: Katika muktadha wa viapo, εἰς hufanya kazi kiidioma kwa maana ya kuapa “kwa” Yerusalemu. Tafsiri hii ni ya asili katika Kiswahili, huku umbo la moja kwa moja la kihusishi likielezwa katika tanbihi.
- source_word: πόλις
  choice: mji
  rationale: “Mji” ni neno la kawaida na sahihi kwa πόλις katika muktadha huu.
- source_word: τοῦ μεγάλου βασιλέως
  choice: wa Mfalme mkuu
  rationale: Huhifadhi uhusiano wa umilikaji na hadhi ya juu ya usemi unaodokeza Zaburi 48:2.
theological_decisions:
- issue: Anayerejelewa na “yake” katika “miguu yake”
  choice: Kutumia “yake” bila kuongeza jina “Mungu”
  alternative: Kutafsiri “miguu ya Mungu” ili kumtaja anayerejelewa waziwazi
  rationale: Kiwakilishi αὐτοῦ hakimtaji Mungu moja kwa moja, ingawa muktadha na dokezo la Isaya 66:1 vinaelekeza kwake. Kutumia kiwakilishi huhifadhi namna chanzo kilivyojieleza bila kuficha maana.
- issue: Utambulisho wa “Mfalme mkuu”
  choice: Kuhifadhi cheo “Mfalme mkuu” bila kuongeza “Mungu”
  alternative: “Mungu, Mfalme mkuu”
  rationale: Chanzo kinasema τοῦ μεγάλου βασιλέως tu. Cheo hiki na dokezo la Zaburi vinaelekeza kwa Mungu, lakini si lazima kuongeza jina ambalo halipo katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “wala … wala …” unahifadhi mwendelezo wa katazo, na “kwa Yerusalemu” ni wa kawaida zaidi katika lugha ya kiapo kuliko tafsiri ya moja kwa moja “kuelekea Yerusalemu.”
