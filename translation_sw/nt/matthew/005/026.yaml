  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: sw
  text: Kwa kweli ninakuambia, hakika hutatoka humo mpaka utakapolipa kodranti ya mwisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kodranti ilikuwa sarafu ndogo ya Kirumi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν λέγω σοι
  choice: Kwa kweli ninakuambia
  rationale: Kauli hii ya utangulizi ni uthibitisho mzito wenye mamlaka. “Kwa kweli ninakuambia” huwasilisha nguvu yake kwa Kiswahili cha kawaida bila kutumia “Amina” kama neno lisilotafsiriwa.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: hakika hutatoka
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi ni kanusho lenye mkazo mkubwa. “Hakika hutatoka” huhifadhi uhakika huo kwa lugha ya sasa, bila kudokeza kwamba kutoka hakutawezekana milele bila kujali kisharti kinachofuata.
- source_word: ἐκεῖθεν
  choice: humo
  rationale: Neno hili huonyesha kuondoka mahali pale. Katika muktadha wa kufungiwa, “kutoka humo” ni usemi wa asili wa Kiswahili unaobeba maana ya kutoka ndani ya mahali hapo.
- source_word: ἕως ἂν ἀποδῷς
  choice: mpaka utakapolipa
  rationale: Muundo huu unaonyesha tukio la baadaye litakalokomesha hali iliyotajwa kabla yake. “Mpaka utakapolipa” ni wa asili na huhifadhi wazo la malipo yanayodaiwa.
- source_word: τὸν ἔσχατον κοδράντην
  choice: kodranti ya mwisho
  rationale: ἔσχατον ni kiasi cha mwisho kabisa, na κοδράντης ni sarafu maalumu ya Kirumi. Jina “kodranti” limehifadhiwa ili kuepuka kulibadilisha kwa sarafu ya kisasa au ya utamaduni mwingine; tanbihi inalifafanua.
theological_decisions:
- issue: Iwapo kifungu kifasiriwe wazi kuwa hukumu ya mwisho, utakaso baada ya kifo, au hali halisi ya kisheria na kifungo
  choice: Taswira halisi ya kufungiwa mpaka deni lote lilipwe imehifadhiwa bila kuitaja kuwa fundisho fulani la kiitikadi.
  alternative: Kuitafsiri wazi kuwa hukumu ya Mungu au utakaso baada ya kifo.
  rationale: Kigiriki chenyewe kinasema tu kwamba mtu hatatoka mpaka kiasi cha mwisho kilipwe. Muktadha unahusu onyo na upatanisho, lakini tafsiri haipaswi kuamua maana ya kiitikadi ambayo mstari huu hauitaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mkazo wa kanusho umehifadhiwa kwa “hakika,” na jina la sarafu limeandikwa kwa mwandiko wa Kiswahili.
