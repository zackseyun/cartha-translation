id: MAT.5.6
reference: Matthew 5:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: sw
  text: Heri wenye njaa na kiu ya haki[a], kwa maana watashibishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu” au “lililo sawa mbele za Mungu.” Neno la Kigiriki linaweza kumaanisha uadilifu, haki, au jambo lililo sawa mbele za Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Heri
  rationale: Neno la kawaida na lenye hadhi katika kauli za heri; linaonyesha hali ya kibali na baraka, si hisia ya furaha tu.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: wenye njaa na kiu
  rationale: Usemi wa asili wa Kiswahili unaodumisha picha ya njaa na kiu pamoja na hamu inayoendelea.
- source_word: τὴν δικαιοσύνην
  choice: ya haki
  rationale: “Haki” ni neno pana la Kiswahili linaloweza kumaanisha uadilifu, jambo lililo sawa, au haki mbele za Mungu; tanbihi inahifadhi upana huo wa maana.
- source_word: ὅτι
  choice: kwa maana
  rationale: Inaingiza sababu ya kauli ya heri kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: αὐτοὶ
  choice: wao (imewakilishwa katika kiambishi “wa-”)
  rationale: Kiambishi cha nafsi katika “watashibishwa” kinawataja haohao kwa kawaida; kuongeza “wao wenyewe” kungefanya sentensi kuwa nzito bila ulazima.
- source_word: χορτασθήσονται
  choice: watashibishwa
  rationale: Inadumisha hali ya wakati ujao, kauli tendwa, na picha ya kupewa chakula mpaka kushiba.
theological_decisions:
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu; lililo sawa mbele za Mungu
  rationale: δικαιοσύνη lina wigo unaohusisha mwenendo mwadilifu, utendaji wa haki, na hali ya kuwa sawa mbele za Mungu. “Haki” ndilo chaguo pana na la kawaida katika maandishi ya kibiblia ya Kiswahili, huku tanbihi ikizuia maana hiyo isifinywe upande mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kauli ya heri umehifadhiwa, pamoja na sitiari ya njaa, kiu, na kushibishwa.
