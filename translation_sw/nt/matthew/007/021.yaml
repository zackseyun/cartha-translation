id: MAT.7.21
reference: Matthew 7:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: sw
  text: Si kila mtu anayeniambia, “Bwana, Bwana,” ataingia katika ufalme wa mbinguni[a], bali ni yule anayefanya mapenzi ya Baba yangu aliye mbinguni ndiye atakayeingia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kihalisi, “ufalme wa mbingu.” Mathayo hutumia usemi huu mara nyingi mahali ambapo miktadha mingine husema “ufalme wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Si kila mtu anayeniambia
  rationale: Οὐ pamoja na πᾶς huleta ukanushi wa sehemu, yaani “si kila mtu,” si “hakuna mtu.” Kishiriki cha wakati uliopo λέγων kimetafsiriwa kwa kishazi cha kawaida cha Kiswahili.
- source_word: Κύριε κύριε
  choice: Bwana, Bwana
  rationale: “Bwana” ni tafsiri ya kawaida na yenye hadhi ya κύριος katika kumwita Yesu; urudiaji umehifadhiwa kwa sababu unasisitiza mwito huo.
- source_word: εἰσελεύσεται
  choice: ataingia
  rationale: Wakati ujao wa εἰσέρχομαι umetafsiriwa kwa namna ya kawaida ya Kiswahili kama “ataingia.”
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: βασιλεία limetafsiriwa “ufalme,” na usemi wa Mathayo τῶν οὐρανῶν umetolewa kwa Kiswahili cha kawaida kama “wa mbinguni,” badala ya tafsiri ngumu ya wingi halisi.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: bali ni yule anayefanya
  rationale: Kishiriki chenye kibainishi kimetafsiriwa kama mtu mmoja wa aina hiyo, na “bali” linahifadhi tofauti kali kati ya kusema na kufanya.
- source_word: τὸ θέλημα
  choice: mapenzi
  rationale: “Mapenzi” ni neno la kawaida la Kibiblia na la Kiswahili sanifu kwa θέλημα likimaanisha nia, matakwa, au kusudi la Baba katika muktadha huu.
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: ya Baba yangu aliye mbinguni
  rationale: Muundo huu unahifadhi uhusiano wa “Baba yangu” na unaonyesha kwamba kishazi cha mahali kinamfafanua Baba.
theological_decisions:
- issue: Kuingia katika ufalme kwa kuhusiana na kumkiri Yesu kwa maneno na kutii
  choice: Aya inatofautisha kumwita Yesu “Bwana” kwa maneno tu na kufanya mapenzi ya Baba, bila kuingiza ndani ya aya hii mfumo mpana wa mafundisho kuhusu wokovu.
  alternative: Kuitafsiri kama fundisho kwamba matendo yenyewe yanastahilisha wokovu, au kwamba kukiri kwa maneno pekee kunatosha.
  rationale: Kigiriki kinaweka wazi tofauti kati ya kusema na kufanya, lakini aya hii peke yake haifafanui kikamilifu uhusiano wa imani, matendo, na kuhesabiwa haki. Tafsiri inadumisha onyo na mvutano huo.
- issue: Kitenzi kilichodokezwa katika kishazi cha pili
  choice: ndiye atakayeingia
  alternative: Kuishia na “anayefanya mapenzi ya Baba yangu aliye mbinguni” bila kurudia kitenzi
  rationale: Ingawa Kigiriki hakirudii εἰσελεύσεται, maana yake inaeleweka katika kishazi cha pili. Kukitaja tena kwa Kiswahili kunakamilisha sentensi na kuweka tofauti wazi bila kuongeza dai jipya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Si kila mtu,” “anayeniambia,” na “ndiye atakayeingia” ni miundo ya kawaida na inayoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya usemi unaohusika.
