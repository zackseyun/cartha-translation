  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: sw
  text: Mtawatambua kwa matunda yao.[a] Je, watu huchuma zabibu kwenye vichaka vya miiba, au tini kwenye magugu yenye miiba?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtawajua kwa matunda yao.”
    reason: lexical_alternative
  - marker: b
    text: 'Swali hili linatarajia jibu la kukataa: watu hawachumi zabibu kwenye vichaka vya miiba wala tini kwenye magugu yenye miiba.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: matunda
  rationale: Wingi wa Kigiriki umehifadhiwa. Neno hili linadumisha picha halisi ya kilimo na maana yake ya sitiari kuhusu matokeo yanayoonekana.
- source_word: ἐπιγνώσεσθε
  choice: mtawatambua
  rationale: Kitenzi hiki hapa kinaonyesha kuwafahamu au kuwatambua watu kwa kuchunguza ushahidi unaoonekana; “mtawatambua” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: μήτι
  choice: Kwani watu ...?
  rationale: μήτι huanzisha swali linalotarajia jibu la kukataa. “Kwani” hufanya swali hilo la balagha lisikike kwa kawaida katika Kiswahili.
- source_word: συλλέγουσιν
  choice: huchuma
  rationale: Katika muktadha wa zabibu na tini, “huchuma” ni neno la kawaida kwa kuvuna tunda moja moja kutoka kwenye mmea.
- source_word: ἀκανθῶν
  choice: vichaka vya miiba
  rationale: Neno linaweza kumaanisha miiba au mimea yenye miiba. “Vichaka vya miiba” huonyesha wazi kwamba kinachozungumziwa ni mimea, si miiba iliyokatwa.
- source_word: σταφυλάς
  choice: zabibu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa matunda haya, na linaonyesha wingi kwa mujibu wa muktadha.
- source_word: τριβόλων
  choice: magugu yenye miiba
  rationale: τρίβολος ni aina ya mmea au gugu lenye miiba. Tafsiri hii inaeleweka kwa urahisi katika Kiswahili cha sasa bila kudai aina mahususi ya mmea isiyo hakika.
- source_word: σῦκα
  choice: tini
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa matunda haya.
- source_word: αὐτῶν / αὐτούς
  choice: yao / wa- katika mtawatambua
  rationale: 'Viambishi hivi vinadumisha rejeo la watu waliotajwa katika muktadha: matunda yao ndiyo yanayotumiwa kuwatambua.'
theological_decisions:
- issue: Maana ya sitiari ya “matunda” katika kuwatambua watu
  choice: Kudumisha sitiari “matunda” bila kuifafanua kuwa matendo au matokeo
  alternative: Mtawatambua kwa matendo yao / kwa matokeo wanayoleta
  rationale: Yesu anatumia picha ya kilimo inayounganisha sentensi hii na swali linalofuata. Kudumisha “matunda” huhifadhi upana na mvutano wa sitiari bila kuifungia katika fasiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Mtawatambua kwa matunda yao” ni wa moja kwa moja na wa kawaida. “Vichaka vya miiba” na “magugu yenye miiba” vinatofautisha mimea hiyo miwili huku vikiepuka majina ya kibotania yasiyoeleweka kwa wasomaji wengi.
