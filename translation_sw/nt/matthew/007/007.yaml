base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: sw
  text: Ombeni[a], mtapewa; tafuteni, mtapata; bisheni, mtafunguliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Amri hizi za Kigiriki zinaweza pia kueleweka kuwa na maana ya kuendelea: “Endeleeni kuomba ... endeleeni kutafuta ... endeleeni kubisha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Ombeni
  rationale: Ni amri ya nafsi ya pili wingi. “Ombeni” ni ya kawaida na yenye hadhi katika Kiswahili, na inaweza kumaanisha kuomba kitu bila kulazimisha maana ya mwendelezo katika matini kuu.
- source_word: δοθήσεται ὑμῖν
  choice: nanyi mtapewa
  rationale: Huhifadhi kauli tendwa ya Kigiriki na uhusiano wa mpokeaji, huku ikimwacha mtoaji bila kutajwa kama ilivyo katika chanzo.
- source_word: ζητεῖτε
  choice: tafuteni
  rationale: Hutoa amri ya nafsi ya pili wingi kwa Kiswahili cha kawaida na huhifadhi maana pana ya kutafuta.
- source_word: εὑρήσετε
  choice: nanyi mtapata
  rationale: “Mtapata” ni tamko la wakati ujao la kawaida linalolingana na εὑρήσετε; linaweza pia kueleweka kama kupata kile kinachotafutwa.
- source_word: κρούετε
  choice: bisheni
  rationale: “Bisheni” ndiyo amri ya kawaida ya kubisha mlango na huhifadhi taswira ya chanzo.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: nanyi mtafunguliwa
  rationale: Huhifadhi kauli tendwa na wazo la kufunguliwa kwa ajili yenu, bila kuongeza nomino “mlango” ambayo haipo wazi katika Kigiriki.
- source_word: καὶ
  choice: nanyi
  rationale: Katika kila jozi, “nanyi” huunganisha amri na ahadi kwa mtiririko wa asili wa Kiswahili, bila kuongeza maana ya matokeo ya wazi kama “ndipo.”
theological_decisions:
- issue: Hali-aspekti ya amri tatu za wakati wa sasa
  choice: Kutumia amri rahisi “Ombeni ... tafuteni ... bisheni” na kueleza uwezekano wa maana endelevu katika tanbihi.
  alternative: “Endeleeni kuomba ... endeleeni kutafuta ... endeleeni kubisha.”
  rationale: Maumbo ya amri ya sasa yanaweza kuwasilisha tendo linaloendelea au linalorudiwa, lakini hayalazimishi kuongeza “endeleeni” katika matini kuu. Uamuzi huu huhifadhi amri kwa lugha ya asili huku ukiacha mvutano wa kiaspekti wazi katika tanbihi.
- issue: Kauli tendwa na mtendaji asiyeelezwa
  choice: “mtapewa ... mtafunguliwa,” bila kumtaja anayetoa au anayefungua.
  alternative: Kumtaja Mungu wazi kuwa ndiye anayetoa na kufungua.
  rationale: Muktadha unaweza kuelekeza kwa Mungu, lakini Kigiriki kinatumia kauli tendwa bila kumtaja mtendaji. Tafsiri haipaswi kufanya kilicho kidokezo kuwa tamko la wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa vifungu vitatu na kauli tendwa umehifadhiwa. “Nanyi” hutoa mdundo wa kawaida wa Kiswahili; “mtafunguliwa” huepuka kuongeza “mlango,” ingawa mlango unadokezwa na kitendo cha kubisha.
