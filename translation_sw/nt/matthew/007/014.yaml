id: MAT.7.14
reference: Matthew 7:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: sw
  text: Kwa maana lango ni jembamba, na njia inayoelekea uzimani ni ngumu, nao ni wachache wanaoipata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: jembamba
  rationale: Huwasilisha kwa kawaida na kwa usahihi wazo la lango lenye upana mdogo.
- source_word: τεθλιμμένη
  choice: ngumu
  rationale: Katika muktadha huu neno linaonyesha njia yenye dhiki au mashaka; “ngumu” ni Kiswahili cha kawaida kinachobeba maana hiyo bila kufanya taswira iwe ya kijiografia tu.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: inayoelekea uzimani
  rationale: Huhifadhi dhana ya njia inayofikisha kwenye uzima; “uzimani” ni usemi wa asili na wenye hadhi katika muktadha huu.
- source_word: εὑρίσκοντες αὐτήν
  choice: wanaoipata
  rationale: Kiwakilishi cha Kigiriki kinarejelea njia; ngeli ya Kiswahili inahitaji “-i-” katika “wanaoipata”.
theological_decisions:
- issue: Maana ya ζωή
  choice: uzima
  alternative: uzima wa milele
  rationale: Chanzo kinasema tu “uzima”; kutaja “wa milele” kungefafanua maana inayodokezwa lakini isiyotamkwa wazi katika mstari huu.
- issue: Nguvu ya τεθλιμμένη
  choice: ngumu
  alternative: yenye dhiki / iliyobanwa
  rationale: “Ngumu” huhifadhi wazo la ugumu wa njia bila kulazimisha maana moja tu kati ya kubanwa na kuteseka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa “lango ... na njia ...” umehifadhiwa.
