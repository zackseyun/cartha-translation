id: MAT.7.6
reference: Matthew 7:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: sw
  text: Msiwape mbwa kilicho kitakatifu[a], wala msitupe lulu zenu mbele ya nguruwe, wasije wakazikanyaga chini ya miguu yao, kisha wageuke na kuwararua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu kitakatifu” au “kilichowekwa wakfu.” Usemi wa Kigiriki una maana pana.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwararua vipande vipande.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: kilicho kitakatifu
  rationale: Kivumishi cha Kigiriki cha hali ya kati, umoja, kimetumiwa kama nomino kwa maana pana. Tafsiri hii haibainishi isivyohitajika ikiwa kinachokusudiwa ni mafundisho matakatifu, kitu kilichowekwa wakfu, au jambo jingine takatifu.
- source_word: τοῖς κυσίν
  choice: mbwa
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi ukali wa sitiari bila kuilegeza au kuifafanua kuwa kundi fulani la watu.
- source_word: βάλητε
  choice: msitupe
  rationale: Kutupa ni neno la kawaida na la sasa linalowasilisha vizuri tendo la βάλλω katika muktadha huu.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: lulu zenu
  rationale: Maana ya kawaida ya μαργαρίτας imehifadhiwa pamoja na umilikaji wa nafsi ya pili wingi.
- source_word: τῶν χοίρων
  choice: nguruwe
  rationale: Neno la kawaida la Kiswahili linahifadhi picha ya asili bila kutumia ufafanuzi wa kiishara.
- source_word: μήποτε
  choice: wasije
  rationale: Muundo huu wa Kiswahili unaonyesha onyo kuhusu matokeo yanayoweza kutokea, kama μήποτε katika sentensi hii.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: wakazikanyaga chini ya miguu yao
  rationale: Kiambishi 'zi' kinarejelea lulu, na usemi mzima unahifadhi wazi picha ya kuzikanyaga chini ya miguu.
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: wageuke na kuwararua
  rationale: Tafsiri hii inadumisha mfuatano wa matendo—kugeuka kisha kurarua—na nguvu ya kitenzi ῥήγνυμι; 'wa-' katika 'kuwararua' inaonyesha kuwa wanaosemewa ni wengi.
theological_decisions:
- issue: Maana ya sitiari za kilicho kitakatifu, mbwa, lulu, na nguruwe
  choice: Kuhifadhi sitiari bila kuzifafanua ndani ya tafsiri
  alternative: Kusema wazi kwamba kilicho kitakatifu au lulu ni mafundisho matakatifu au ujumbe wa ufalme, na kwamba mbwa na nguruwe ni watu waovu au wanaoupinga ujumbe
  rationale: Aya yenyewe haitoi utambulisho mahususi wa kila picha. Kuzihifadhi sitiari kunatunza upana na mvutano wa maana ya matini bila kuingiza tafsiri finyu ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wingi umehifadhiwa katika vitenzi. Maneno ya kawaida “mbwa,” “lulu,” na “nguruwe” yametumiwa, huku ukali na kutofafanuliwa kwa sitiari vikidumishwa.
