  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: sw
  text: Au utamwambiaje ndugu yako[a], ‘Acha nikitoe kibanzi[b] katika jicho lako,’ na tazama, boriti[c] iko katika jicho lako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “ndugu yako” katika umoja wa kiume; umoja huo unaweza kutumiwa kwa maana ya kiwakilishi.
    reason: cultural_note
  - marker: b
    text: Au “kipande kidogo cha kijiti”; Kigiriki κάρφος humaanisha kipande kidogo cha kitu kikavu.
    reason: lexical_alternative
  - marker: c
    text: Au “gogo”; Kigiriki δοκός humaanisha kipande kikubwa cha mbao, hasa boriti ya ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Inaendeleza hoja kwa kuweka swali jingine la balagha, kama ilivyo katika Kigiriki.
- source_word: πῶς ἐρεῖς
  choice: utamwambiaje
  rationale: Muundo huu ni wa kawaida katika Kiswahili, huhifadhi wakati ujao wa ἐρεῖς na nguvu ya swali la balagha la πῶς.
- source_word: τῷ ἀδελφῷ σου
  choice: ndugu yako
  rationale: ‘Ndugu’ ni tafsiri ya asili ya ἀδελφός na inaweza kumaanisha ndugu wa ukoo au mshirika wa jumuiya kulingana na muktadha.
- source_word: Ἄφες ἐκβάλω
  choice: Acha nikitoe
  rationale: Ἄφες hapa ni ombi la ruhusa, nalo linaungana kwa kawaida na tendo la kukitoa kitu katika jicho.
- source_word: τὸ κάρφος
  choice: kibanzi
  rationale: ‘Kibanzi’ huonyesha kipande kidogo cha kitu kikavu na huhifadhi tofauti kubwa na boriti.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: katika jicho lako
  rationale: Katika Kiswahili, ‘kutoa kitu katika jicho’ ni usemi wa kawaida unaowasilisha wazo la kukiondoa kutoka ndani ya jicho.
- source_word: καὶ ἰδοὺ
  choice: na kumbe
  rationale: ‘Kumbe’ ni kiashiria cha mshangao na ugunduzi katika Kiswahili cha sasa; huhifadhi nguvu ya ἰδού bila kutumia usemi mgumu au wa kizamani.
- source_word: ἡ δοκὸς
  choice: boriti
  rationale: ‘Boriti’ ni kipande kikubwa cha mbao cha kujengea na ndiyo tafsiri sahihi ya δοκός katika taswira hii.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: imo katika jicho lako mwenyewe
  rationale: ‘Imo’ huonyesha kuwamo ndani, na ‘mwenyewe’ huweka wazi mkazo wa tofauti kati ya jicho la ndugu na jicho la msemaji.
theological_decisions:
- issue: Upeo wa maana ya ἀδελφῷ
  choice: ndugu yako
  alternative: mwenzako anayeamini
  rationale: Tafsiri inahifadhi neno la kifamilia la chanzo bila kulifungia kimadhehebu; tanbihi inaeleza kuwa umoja wa kiume unaweza kutumiwa kiwakilishi.
- issue: Taswira yenye kutia chumvi ya κάρφος na δοκός
  choice: kibanzi / boriti
  alternative: chembe / gogo
  rationale: Jozi hii huhifadhi tofauti kubwa kwa makusudi kati ya kitu kidogo sana na mbao kubwa ya ujenzi, bila kupunguza ukali wa onyo la Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. ‘Na kumbe’ imetumiwa kama kiashiria cha mshangao kinachofaa kwa mazungumzo ya kawaida yenye hadhi, huku ‘boriti’ ikihifadhi taswira halisi ya ujenzi.
