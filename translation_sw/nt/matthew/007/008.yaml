id: MAT.7.8
reference: Matthew 7:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: sw
  text: Kwa maana kila anayeomba hupokea, anayetafuta hupata, na anayebisha atafunguliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji waziwazi “mlango”; mlango unaeleweka kutokana na mfano wa kubisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: kila
  rationale: Ikiwa na kirai cha kishiriki chenye kibainishi, neno hili linarejelea kila mtu katika kundi hilo; “kila anayeomba” ni Kiswahili cha kawaida na hudumisha upeo wa jumla.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hudumisha nguvu ya kueleza sababu inayounganisha mstari huu na himizo lililotangulia.
- source_word: ὁ αἰτῶν
  choice: anayeomba
  rationale: Huwakilisha kishiriki cha wakati uliopo kinachotumika kama nomino, huku kikidumisha tendo la kawaida au linaloendelea.
- source_word: λαμβάνει
  choice: hupokea
  rationale: “Kupokea” ndilo chaguo la kawaida hapa; hali ya mazoea ya “hu-” inafaa kauli hii ya jumla na usambamba wake.
- source_word: ὁ ζητῶν
  choice: anayetafuta
  rationale: Ni tafsiri ya kawaida inayodumisha usambamba na “anayeomba” na “anayebisha.”
- source_word: εὑρίσκει
  choice: hupata
  rationale: Ni neno rahisi na la kawaida linalodumisha ufupi na urahisi wa kukumbuka wa usemi wa Kigiriki.
- source_word: τῷ κρούοντι
  choice: anayebisha
  rationale: Kiswahili cha asili hakihitaji kurudia kihusishi cha dative hapa; muundo huu unaunganika kawaida na kitenzi cha kutendwa “atafunguliwa.”
- source_word: ἀνοιγήσεται
  choice: atafunguliwa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa bila kuongeza waziwazi nomino “mlango,” ambayo haimo katika Kigiriki.
theological_decisions:
- issue: Upeo na nguvu ya ahadi
  choice: Kauli ya jumla yenye lugha inayomhusisha kila anayeomba, bila kuweka katika tafsiri masharti yasiyotajwa wala kuifanya ihakikishe kwamba kila ombi mahususi litatimizwa sawasawa na lilivyoombwa bila kuzingatia muktadha.
  alternative: Kuitafsiri ama kama dhamana isiyo na masharti kwamba kila ombi hupewa sawasawa, au kama ahadi iliyowekewa wazi mipaka ya maombi fulani ya kiroho pekee.
  rationale: Kigiriki kinatumia lugha ya jumla na pana. Tafsiri inapaswa kuiwasilisha moja kwa moja huku ikiacha mvutano wa kitheolojia uamuliwe na muktadha badala ya kuutatua ndani ya maneno ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa vipashio vitatu umehifadhiwa kwa “anayeomba … anayetafuta … anayebisha,” na hali ya mazoea katika “hupokea” na “hupata” inawasilisha ukweli wa jumla.
