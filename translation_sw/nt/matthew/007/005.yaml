id: MAT.7.5
reference: Matthew 7:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: sw
  text: Mnafiki! Kwanza ondoa boriti katika jicho lako; ndipo utaona wazi ili uondoe kibanzi katika jicho la ndugu yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: Mnafiki
  rationale: Nomino ya kumwita mtu moja kwa moja kwa ukali; “Mnafiki” ni ya kawaida, wazi, na huhifadhi nguvu ya karipio.
- source_word: ἔκβαλε
  choice: ondoa
  rationale: Amri ya tendo la mara moja; “ondoa” ni ya asili katika Kiswahili na inafaa kwa taswira ya kitu kilicho jichoni.
- source_word: πρῶτον
  choice: kwanza
  rationale: Huonyesha kipaumbele katika mfuatano wa matendo.
- source_word: δοκόν
  choice: boriti
  rationale: Neno hili humaanisha kipande kikubwa cha mbao cha ujenzi; “boriti” huhifadhi vizuri uzidishaji wa kimakusudi na utofauti wake na kibanzi.
- source_word: ὀφθαλμοῦ
  choice: jicho
  rationale: Hili ndilo neno la kawaida la kiungo hicho na linafaa moja kwa moja katika sitiari.
- source_word: διαβλέψεις
  choice: utaona wazi
  rationale: Huhifadhi maana iliyotiliwa nguvu ya kuona kwa uwazi, badala ya kusema tu “utaona.”
- source_word: ἐκβαλεῖν
  choice: jinsi ya kuondoa
  rationale: Infinitivu inahusiana na kuona wazi kwa kusudi au uwezo wa kufanya tendo; muundo huu ni wa asili katika Kiswahili bila kuamua zaidi ya inavyohitajika kama ni uwezo au namna.
- source_word: κάρφος
  choice: kibanzi
  rationale: Hurejelea chembe ndogo kavu, kijiti, au kipande kidogo cha mbao; “kibanzi” huleta taswira halisi na utofauti mkali na boriti.
- source_word: ἀδελφοῦ
  choice: ndugu yako
  rationale: “Ndugu” ni tafsiri ya kawaida ya ἀδελφός na katika Kiswahili inaweza kurejelea ndugu wa kiume au mshirika wa jumuiya bila kulazimisha ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Uhusiano unaoelezwa na ἀδελφοῦ
  choice: ndugu yako
  alternative: mwenzako
  rationale: “Ndugu yako” hubaki karibu na neno la Kigiriki na huhifadhi mazingira ya uhusiano wa kijumuiya; “mwenzako” ungepanua maana kwa kuondoa taswira ya undugu.
- issue: Nguvu ya διαβλέψεις pamoja na ἐκβαλεῖν
  choice: ndipo utaona wazi jinsi ya kuondoa
  alternative: ndipo utaweza kuona wazi na kuondoa
  rationale: Uteuzi huu huhifadhi uhusiano wa karibu kati ya kuona wazi na kuondoa bila kuifanya kauli kuwa ahadi ya uwezo peke yake; Kigiriki kinaweza kusikika kama kuona wazi ili au namna ya kuondoa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi huhifadhi karipio kali, mpangilio wa “kwanza… ndipo,” na tofauti ya kimakusudi kati ya boriti kubwa na kibanzi kidogo. Hakuna tanbihi inayohitajika kwa kuwa “boriti” na “kibanzi” zinaeleweka na zinaakisi vizuri taswira ya Kigiriki.
