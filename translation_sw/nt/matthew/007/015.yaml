  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: sw
  text: Jihadharini na manabii wa uongo[a], ambao huja kwenu wakiwa wamevaa mavazi ya kondoo[b], lakini kwa ndani wao ni mbwa-mwitu wakali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jilindeni dhidi ya manabii wa uongo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “katika mavazi ya kondoo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mbwa-mwitu wanyang’anyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Jihadharini na
  rationale: Kitenzi cha amri katika wakati wa sasa kinatoa wito wa kuendelea kuwa macho dhidi yao. Muundo huu ni wa kawaida katika Kiswahili na una nguvu ya onyo.
- source_word: ψευδοπροφητῶν
  choice: manabii wa uongo
  rationale: Huwataja watu wanaodai kwa uongo kuwa na mamlaka ya kinabii au wanaosema uongo kama manabii, bila kuingiza makundi ya kidini ya baadaye.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: ambao huja kwenu
  rationale: Hutoa kwa lugha ya kawaida maelezo ya sifa kuhusu aina ya watu wanaotajwa na kitendo chao cha kuwajia wasikilizaji.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: wakiwa wamevaa mavazi ya kondoo
  rationale: Huhifadhi mfano wa sura yao ya nje yenye kudanganya na maana ya msingi ya ἐνδύματα kuwa mavazi, bila kubadili mavazi hayo kimyakimya kuwa ngozi.
- source_word: ἔσωθεν δέ
  choice: lakini kwa ndani wao
  rationale: Huonyesha wazi tofauti kali kati ya sura ya nje na hali yao halisi ya ndani.
- source_word: λύκοι ἅρπαγες
  choice: mbwa-mwitu walafi
  rationale: Neno 'walafi' linaonyesha tabia ya wanyama wanaotamani kunyakua na kuteketeza mawindo; ni usemi wa asili na wenye nguvu katika Kiswahili.
theological_decisions:
- issue: Asili ya onyo dhidi ya viongozi wa kidini wadanganyifu
  choice: Taswira imetafsiriwa moja kwa moja kama onyo la kimaadili na kiroho kuhusu manabii wa uongo.
  alternative: Kufanya mstari uwalenge hasa walimu wazushi kwa maana ya mafundisho au taasisi za kidini za baadaye.
  rationale: Kigiriki kinaonya kuhusu manabii wa uongo kwa kulinganisha sura yao ya nje na hali yao ya ndani. Tafsiri haipaswi kulibana onyo hilo kwa kundi la baadaye lisilotajwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Taswira ya kondoo na mbwa-mwitu imehifadhiwa, pamoja na mvutano kati ya mwonekano wa nje na uhalisi wa ndani.
