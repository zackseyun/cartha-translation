translation:
  language: sw
  text: Msihukumu[a], ili msihukumiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msitoe hukumu ya hatia, ili msihukumiwe kuwa na hatia.” Kitenzi cha Kigiriki katika baadhi ya miktadha kinaweza kumaanisha kutoa hukumu ya hatia, lakini “hukumu” kina maana pana zaidi na kinahifadhi urudiaji wa neno katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: Msihukumu
  rationale: Μή pamoja na kitenzi cha amri katika nafsi ya pili wingi huunda katazo. “Msihukumu” ni Kiswahili cha kawaida, chenye heshima, na kinadumisha wingi wa wanaoambiwa.
- source_word: κρίνετε
  choice: hukumu
  rationale: Kitenzi κρίνω kina maana pana inayoweza kujumuisha kupima, kutoa hukumu, au kuhukumu kwa hatia. “Hukumu” kinahifadhi upana huo vizuri kuliko “laani,” na pia kinadumisha urudiaji wa mzizi unaopatikana katika κριθῆτε.
- source_word: ἵνα μὴ
  choice: ili msi-
  rationale: Ἵνα pamoja na kitenzi tegemezi kilichokanushwa huonyesha kusudi au matokeo yanayokusudiwa. “Ili msi-” ni muundo wa asili wa Kiswahili unaohifadhi uhusiano huo bila kuamua kupita kiasi kati ya kusudi na matokeo.
- source_word: κριθῆτε
  choice: msihukumiwe
  rationale: Hii ni aoristi tegemezi tendwa. “Msihukumiwe” huonyesha hali ya kutendwa na kurudia mzizi “hukumu,” kama Kigiriki kinavyorudia κρίνω.
theological_decisions:
- issue: Upeo wa maana ya κρίνω katika katazo la Yesu
  choice: Kutumia neno pana “hukumu” badala ya kulifanya kuwa “tia hatiani.”
  alternative: Msiwahukumu kuwa na hatia, ili nanyi msihukumiwe kuwa na hatia.
  rationale: Mstari huu pekee hauainishi kila mpaka wa kutathmini maadili; muktadha unaofuata unafafanua aina ya kuhukumu inayokatazwa. Neno pana linahifadhi mvutano huo na halilazimishi maana ya hukumu ya hatia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa nafsi ya pili umehifadhiwa katika “msihukumu/msihukumiwe.” Muundo ni mfupi na wa moja kwa moja kama chanzo cha Kigiriki.
