  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: sw
  text: Ndipo nitawaambia wazi, ‘Sikuwahi kuwajua ninyi[a]. Ondokeni kwangu, ninyi mtendao uasi dhidi ya sheria[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikuwahi kuwatambua.” Neno la Kigiriki linalotafsiriwa “kuwajua” linaweza kumaanisha utambuzi wa kiuhusiano, si kuwa na habari juu yao tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ninyi mtendao maasi” au “ninyi mtendao uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano unaotokana na muktadha uliotangulia kwa Kiswahili cha kawaida na chenye uzito.
- source_word: ὁμολογήσω
  choice: nitawaambia wazi
  rationale: Katika mazingira haya ya hukumu, kitenzi kina maana ya kutamka jambo waziwazi, si kuungama kosa.
- source_word: Οὐδέποτε ἔγνων ὑμᾶς
  choice: Sikuwahi kuwajua ninyi
  rationale: Huhifadhi msisitizo wa ukanushaji wa wakati wote na lugha ya uhusiano iliyomo katika γινώσκω bila kuifasiri kuwa ‘sikuwakubali.’ Kiwakilishi ‘ninyi’ kinaendeleza msisitizo wa ὑμᾶς.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: Ondokeni kwangu
  rationale: Ni amri ya kuwafukuza iliyo wazi, ya heshima na yenye uzito unaofaa muktadha.
- source_word: οἱ ἐργαζόμενοι τὴν ἀνομίαν
  choice: ninyi mtendao uasi dhidi ya sheria
  rationale: ‘Mtendao’ huonyesha mwenendo unaowatambulisha, huku ‘uasi dhidi ya sheria’ ikihifadhi nguvu ya kimaadili na kisheria ya ἀνομία kwa lugha inayoeleweka.
theological_decisions:
- issue: Maana ya ‘Sikuwahi kuwajua ninyi’
  choice: Imeachwa kama lugha ya kujua katika uhusiano, bila ufafanuzi wa kimafundisho.
  alternative: Sikuwahi kuwatambua / Sikuwahi kuwakubali
  rationale: Matini ya Kigiriki hutumia ‘kujua’ kwa namna inayoweza kubeba maana ya uhusiano au utambuzi wa kimahakama. Tafsiri kuu huhifadhi mvutano huo badala ya kuutatua.
- issue: Nguvu ya ἀνομία
  choice: uasi dhidi ya sheria
  alternative: uovu / maasi
  rationale: Huhifadhi wazo la kuvunja au kupuuza sheria bila kulipanua kuwa neno la jumla tu la uovu wala kuingiza fundisho maalumu la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na uzito wa hukumu. ‘Ndipo’ na ‘mtendao’ ni miundo ya kifasihi inayofahamika na inayofaa sajili ya Biblia bila kuwa ya kizamani kupita kiasi.
