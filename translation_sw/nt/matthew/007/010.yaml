  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: sw
  text: Au, mwanawe akiomba samaki, hatampa nyoka, sivyo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Au
  rationale: Inaendeleza mfano wa pili katika mfululizo wa maswali mawili. Katika Kiswahili, “Au” pekee ni ya asili na haitafsiri καί kupita kiasi.
- source_word: ἰχθὺν
  choice: samaki
  rationale: Ni maana ya kawaida ya nomino hii na inafaa katika muktadha wa chakula cha nyumbani.
- source_word: αἰτήσει
  choice: akiomba
  rationale: Wakati ujao wa Kigiriki unatumika katika mfano wa hali ya kawaida; muundo wa Kiswahili wenye “-ki-” unatoa hali hiyo kwa njia ya asili.
- source_word: μὴ
  choice: hatampa ... sivyo?
  rationale: μή hutanguliza swali linalotarajia jibu la kukataa. Kauli hasi yenye kiambishi “sivyo?” huhifadhi nguvu hiyo ya balagha.
- source_word: ὄφιν
  choice: nyoka
  rationale: Hili ndilo neno la kawaida na la sasa la Kiswahili kwa mnyama anayelengwa; haliongezi maana ya kitamaduni au ya kitheolojia isiyokuwamo hapa.
- source_word: ἐπιδώσει
  choice: atampa
  rationale: Katika muktadha huu kitenzi kinamaanisha kumpa mtu kitu. “Atampa” ni tafsiri wazi na ya asili.
- source_word: αὐτῷ
  choice: -m- katika “atampa”
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja kinaonyeshwa kwa kawaida ndani ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Nguvu ya swali la balagha
  choice: “hatampa nyoka, sivyo?”
  alternative: “je, atampa nyoka?”
  rationale: Muundo uliochaguliwa unaonyesha wazi kwamba swali linatarajia jibu la kukataa, kama inavyodokezwa na μή, bila kuugeuza mfano kuwa taarifa tambarare.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Mstari mrefu wa katikati unaonyesha mpito mkali kutoka hali iliyotajwa kwenda swali la balagha.
