source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: sw
  text: Wengi wataniambia siku ile, ‘Bwana, Bwana, je, hatukutabiri kwa jina lako, na hatukutoa pepo kwa jina lako, na hatukufanya miujiza mingi[a] kwa jina lako?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo mengi ya nguvu.” Neno la Kigiriki kwa maana halisi ni “nguvu” kwa wingi, na katika Injili mara nyingi humaanisha matendo ya kimiujiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Wengi
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino. “Wengi” ni Kiswahili cha kawaida na hakiongezi neno ambalo halipo wazi katika Kigiriki.
- source_word: ἐροῦσίν μοι
  choice: wataniambia
  rationale: 'Huwasilisha moja kwa moja wakati ujao wa λέγω pamoja na kiwakilishi cha yambwa: “watasema kwangu.” Katika Kiswahili, “wataniambia” ni ya asili zaidi.'
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku ile
  rationale: Ni usemi wa wakati wenye maana ya kieskatolojia katika muktadha. Tafsiri haiongezi “siku ya hukumu,” kwa kuwa Kigiriki kinasema tu “siku ile.”
- source_word: Κύριε κύριε
  choice: Bwana, Bwana
  rationale: Kurudiwa kwa wito kumehifadhiwa ili kuonyesha msisitizo na ombi la dhati. “Bwana” hubeba maana ya kawaida ya cheo hiki na uzito wake wa kikristolojia.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: je, hatukutabiri
  rationale: Swali hasi linatarajia jibu la kukubali. “Je” huweka wazi muundo wa swali, na “kutabiri” ni kitenzi kinachotambulika kwa προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: kwa jina lako
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tendo linalofanywa kwa mamlaka au kwa kutaja jina la mtu. Kurudiwa kwake mara tatu kumehifadhiwa kwa nguvu ya balagha.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: kutoa pepo
  rationale: ἐκβάλλω pamoja na δαιμόνια humaanisha kuwafukuza pepo. “Kutoa pepo” ni usemi mfupi na unaoeleweka katika Kiswahili cha kawaida; “wachafu” haijaongezwa kwa kuwa haipo katika mstari huu.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: kufanya miujiza mingi
  rationale: Katika Injili, δύναμις kwa wingi hutumiwa kwa matendo ya nguvu, mara nyingi miujiza. “Miujiza mingi” ni ya asili na wazi kwa msomaji wa Kiswahili, huku tanbihi ikihifadhi maana halisi ya “nguvu.”
theological_decisions:
- issue: Tafsiri ya κύριος katika wito unaoelekezwa kwa Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi maana ya kawaida ya cheo hiki pamoja na uzito wake wa kikristolojia bila kuongeza dai lisilotamkwa wazi katika mstari.
- issue: Maana ya kieskatolojia ya ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku ile
  alternative: siku ya hukumu
  rationale: Muktadha unaelekeza kwenye hukumu ya mwisho, lakini chanzo kinasema tu “siku ile.” Tafsiri imehifadhi usemi huo na kutofafanua kimya kimya jambo lililoachwa kuwa la kidokezo.
- issue: Maana ya δυνάμεις kama matendo ya kimiujiza
  choice: miujiza mingi
  alternative: matendo mengi ya nguvu
  rationale: “Miujiza” huwasilisha matumizi ya kawaida ya neno hilo katika Injili, lakini tanbihi inaonyesha kwamba Kigiriki chenyewe kinataja “nguvu,” hivyo haifichi upana wa neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “kwa jina lako” na “Bwana, Bwana” yamehifadhiwa kwa sababu ni sehemu muhimu ya msisitizo wa mstari.
