base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: sw
  text: Hivyo[a], kila mti mzuri huzaa matunda mazuri, lakini mti mbovu[b] huzaa matunda mabaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa njia hiyo” au “Vivyo hivyo.”
    reason: lexical_alternative
  - marker: b
    text: “Mbovu” hutafsiri neno la Kigiriki ambalo pia linaweza kumaanisha “uliooza,” “ulioharibika,” au “usiofaa.”
    reason: lexical_alternative
  - marker: c
    text: “Matunda mabaya” pia yanaweza kutafsiriwa “matunda maovu”; usemi “mabaya” unafaa kwa mfano wa kilimo huku ukiendelea kubeba maana hasi ya kimaadili katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Hivyo
  rationale: Neno hili linaonyesha hitimisho au ulinganisho unaotokana na mfano uliotangulia; “Hivyo” ni la kawaida na huhifadhi nguvu hiyo.
- source_word: πᾶν δένδρον
  choice: kila mti
  rationale: πᾶν pamoja na nomino ya umoja ina maana ya kila mmoja katika kundi, kwa hiyo “kila mti” huhifadhi kauli ya jumla ya kimethali.
- source_word: ἀγαθὸν
  choice: mzuri
  rationale: Katika mfano huu neno linaeleza ubora wa mti; “mzuri” ni la asili na linaendana na “matunda mazuri.”
- source_word: καρποὺς καλοὺς
  choice: matunda mazuri
  rationale: καλός inaweza kumaanisha mazuri, bora, au yenye kuvutia; hapa “matunda mazuri” ndiyo usemi wa kawaida unaofaa kwa matokeo yanayotathminiwa.
- source_word: ποιεῖ
  choice: huzaa
  rationale: Ingawa ποιέω kimsingi ni “kufanya/kutokeza,” kuhusu mti na matunda Kiswahili cha kawaida hutumia “kuzaa.” Hali ya mazoea ya kitenzi inaonyeshwa na “hu-.”
- source_word: τὸ δὲ
  choice: lakini mti
  rationale: δέ inaonyesha tofauti kati ya aina mbili za miti, hivyo “lakini” inafaa.
- source_word: σαπρὸν
  choice: mbovu
  rationale: σαπρός huonyesha kitu kilichooza, kuharibika, au kutofaa. “Mbovu” ni ya asili kwa mti na ni mahususi zaidi kuliko kurudia tu “mbaya.”
- source_word: καρποὺς πονηροὺς
  choice: matunda mabaya
  rationale: πονηρός inaweza kumaanisha mabaya au maovu. Katika taswira ya kilimo, “matunda mabaya” ni ya kawaida huku muktadha ukiendelea kuruhusu maana ya kimaadili.
theological_decisions:
- issue: Nguvu ya kimaadili dhidi ya maana ya kilimo tu katika taswira
  choice: Kudumisha mfano halisi wa mti na matunda bila kueleza moja kwa moja matumizi yake ya kimaadili.
  alternative: Kutafsiri kwa maneno ya ufafanuzi kama “mti mwadilifu huzaa matendo mema” au kutumia “matunda maovu” katika maandishi makuu.
  rationale: Katika muktadha Yesu anaonya kuhusu manabii wa uongo, lakini mstari wenyewe unatoa mfano badala ya kuufafanua. Tafsiri inaacha muktadha utoe maana ya kimaadili na hivyo kuhifadhi mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Huzaa” ni usemi wa kawaida kwa mti kutoa matunda, na muundo mfupi huhifadhi tabia ya kimethali ya sentensi.
