base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: sw
  text: Kwa hiyo, kila mtu anayesikia maneno yangu haya na kuyatenda atafananishwa na mwanamume mwenye hekima aliyejenga nyumba yake juu ya mwamba.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuwa kama” au “atalinganishwa na.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “mwanamume mwenye hekima”; neno lililotumiwa kwa mhusika katika mfano humaanisha mtu wa kiume.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Kwa hiyo, kila mtu anaye
  rationale: Πᾶς pamoja na ὅστις ina maana ya jumla inayomhusu kila mmoja; “kila mtu anaye” ni ya asili katika Kiswahili. οὖν ni kiunganishi cha hitimisho, hivyo “Kwa hiyo” kinahifadhi uhusiano na mafundisho yaliyotangulia.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: anayesikia maneno yangu haya
  rationale: ἀκούει ni “anasikia,” na λόγους ni “maneno” au “semi.” Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi maana ya μου na τούτους.
- source_word: καὶ ποιεῖ αὐτούς
  choice: na kuyatenda
  rationale: ποιεῖ hapa ni kutekeleza yale yaliyosikiwa. “Kuyatenda” hudumisha uhusiano wa moja kwa moja na “maneno” bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: ὁμοιωθήσεται
  choice: atafananishwa na
  rationale: Umbo la wakati ujao la kutendwa limehifadhiwa moja kwa moja. Kitenzi kinaweza pia kueleweka kwa maana ya “atakuwa kama,” lakini “atafananishwa na” kinaakisi vizuri zaidi umbo la Kigiriki.
- source_word: ἀνδρὶ φρονίμῳ
  choice: mtu mwenye hekima
  rationale: ἀνήρ humaanisha mwanamume, lakini katika Kiswahili “mtu mwenye hekima” ni usemi wa kawaida wa kuanzisha mhusika wa mfano bila kufanya sentensi kuwa nzito. Dokezo linaeleza jinsia ya kisarufi na kileksia katika chanzo.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: aliyejenga nyumba yake
  rationale: Tafsiri hii inahifadhi tendo la kujenga na umilikaji wa nyumba kwa lugha ya kawaida na wazi.
- source_word: ἐπὶ τὴν πέτραν
  choice: juu ya mwamba
  rationale: πέτρα ni mwamba imara; “juu ya mwamba” huhifadhi taswira bila kuibainisha zaidi kuwa tabaka la mwamba.
theological_decisions:
- issue: Lugha ya jinsia katika mhusika wa mfano
  choice: mtu mwenye hekima
  alternative: mwanamume mwenye hekima
  rationale: Kigiriki ἀνήρ humtaja mtu wa kiume, lakini Kiswahili cha kawaida hutumia “mtu” kwa mhusika wa mfano. Ili kutopoteza ushahidi wa chanzo, dokezo [b] linaeleza wazi kwamba neno la Kigiriki humaanisha mwanamume.
- issue: Nguvu ya ὁμοιωθήσεται
  choice: atafananishwa na
  alternative: atakuwa kama
  rationale: Chaguo kuu linahifadhi umbo la kutendwa na kutatua kwa kiwango kidogo tu utata wa iwapo maana ni kulinganishwa au kufanana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “kuyatenda” ili kuhifadhi ulinganifu wa kusikia na kutenda, na “mwamba” ili kudumisha taswira halisi ya msingi imara.
