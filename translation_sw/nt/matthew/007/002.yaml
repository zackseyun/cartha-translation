id: MAT.7.2
reference: Matthew 7:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: sw
  text: Kwa maana, kwa hukumu mnayohukumu, mtahukumiwa; na kwa kipimo mnachopimia, mtapimiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtapimiwa kwa kipimo hicho hicho.” Kigiriki hakisemi wazi “hicho hicho,” ingawa maana ya kupimiwa kwa namna inayolingana inadokezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι
  choice: hukumu
  rationale: ‘Hukumu’ ni neno la kawaida na lenye uzito unaofaa katika muktadha huu; pia linahifadhi uhusiano wa kimsamiati na vitenzi ‘mnayohukumu’ na ‘mtahukumiwa.’
- source_word: κρίνετε
  choice: mnayohukumu
  rationale: Kitenzi ‘kuhukumu’ kinahifadhi maana pana ya κρίνω bila kuibana iwe ‘kuhukumu kuwa na hatia’ au ‘kulaani.’
- source_word: κριθήσεσθε
  choice: mtahukumiwa
  rationale: Kauli ya kutendwa ya wakati ujao inadumishwa, na mtendaji wa hukumu hatajwi, kama ilivyo katika Kigiriki.
- source_word: μέτρῳ
  choice: kipimo
  rationale: ‘Kipimo’ kinaeleza kiwango kinachotumiwa kwa wengine na kinahifadhi mchezo wa maneno pamoja na ‘mnachopimia’ na ‘mtapimiwa.’
- source_word: μετρεῖτε
  choice: mnachopimia
  rationale: ‘Kupimia’ ni usemi wa asili katika Kiswahili kwa kutumia kipimo fulani kwa mtu au jambo, na hudumisha taswira ya kupima.
- source_word: μετρηθήσεται ὑμῖν
  choice: mtapimiwa
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba kipimo kitatumika kwao bila kuongeza wazi wazo la ‘kurudishiwa,’ ambalo linadokezwa lakini halijaandikwa moja kwa moja katika Kigiriki.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: kwa ... mnayo- / kwa ... mnacho-
  rationale: ‘Kwa’ linaonyesha chombo au kiwango kinachotumiwa na kuhifadhi ulinganifu wa vifungu viwili kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: ‘Kwa maana’ linaunganisha mstari huu na onyo lililotangulia na kuonyesha kwamba mstari huu unatoa sababu yake.
theological_decisions:
- issue: Asili na mtendaji wa hukumu inayolingana
  choice: Kauli ya kutendwa ‘mtahukumiwa’ imeachwa bila kumtaja mtendaji.
  alternative: Kutaja wazi kwamba Mungu atawahukumu, au kwamba watu wengine watawahukumu.
  rationale: Kigiriki hakimtaji mtendaji. Tafsiri hii inadumisha uwezekano wa hukumu ya Mungu au kanuni pana ya matokeo yanayolingana bila kuamua jambo ambalo matini haijaamua wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa ‘hukumu—mnayohukumu—mtahukumiwa’ na ‘kipimo—mnachopimia—mtapimiwa’ umehifadhiwa ili kudumisha mtindo wa kimethali wa mstari.
