id: MAT.7.12
reference: Matthew 7:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: sw
  text: Kwa hiyo, katika mambo yote mnayotaka watu wawatendee, nanyi watendeeni vivyo hivyo; kwa maana hii ndiyo Sheria na Manabii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Kwa hiyo, mambo yote
  rationale: “Kwa hiyo” linaonyesha hitimisho linalotokana na mafundisho yaliyotangulia, na “mambo yote” linahifadhi upeo mpana wa Πάντα ὅσα kwa Kiswahili cha kawaida.
- source_word: ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν
  choice: mnayotaka watu wawatendee
  rationale: Muundo huu unaeleza matendo ambayo wasikilizaji wangependa wafanyiwe. Kitenzi “wawatendee” kinaonyesha kwamba matendo hayo yanaelekezwa kwa manufaa au kwa upande wao bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Neno la Kigiriki limetumiwa hapa kwa maana ya wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri ya asili na sahihi kwa Kiswahili.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: nanyi watendeeni vivyo hivyo
  rationale: “Nanyi” linahifadhi msisitizo wa καὶ ὑμεῖς, “vivyo hivyo” linaonyesha ulinganifu wa οὕτως, na umbo la amri “watendeeni” linafikisha wito wa kuendelea kuishi kwa namna hiyo.
- source_word: οὗτος γάρ ἐστιν
  choice: kwa maana hii ndiyo
  rationale: “Kwa maana” linaonyesha kazi ya ufafanuzi ya γάρ, huku “hii ndiyo” likihifadhi kauli ya moja kwa moja ya utambulisho bila kuigeuza kuwa maelezo mapana.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Sheria na Manabii
  rationale: Huu ni usemi unaotambulika unaorejelea sehemu kuu za Maandiko ya Kiyahudi. Herufi kubwa zinasaidia kuonyesha rejeleo hilo badala ya sheria kwa ujumla au manabii wasiotajwa.
theological_decisions:
- issue: Maana ya kijumla ya οἱ ἄνθρωποι
  choice: watu
  alternative: wanaume
  rationale: Kanuni hii inahusu mahusiano ya wanadamu wote. “Watu” linahifadhi maana ya kijumla bila kuifanya amri ionekane kuwahusu wanaume pekee.
- issue: Upeo wa usemi “Sheria na Manabii”
  choice: Usemi umehifadhiwa kama muhtasari wa kimaandiko
  alternative: kiini cha mafundisho yote ya Maandiko
  rationale: Chanzo kinatumia usemi maalumu wa Kiyahudi na wa Mathayo. Kuuhifadhi huepuka kuingiza ufafanuzi wa kitheolojia ndani ya matini na hudumisha mwangwi wake wa kimaandiko.
- issue: Nguvu ya ποιεῖτε kama amri ya wakati uliopo
  choice: watendeeni
  alternative: fanyeni jambo hilo mara moja
  rationale: Amri imetafsiriwa kama mwenendo unaotakiwa kwa wasikilizaji, bila kuibana kuwa tendo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa nafsi ya pili katika “mnayotaka,” “wawatendee,” na “nanyi” umehifadhiwa. Hakuna tanbihi iliyoongezwa kwa οἱ ἄνθρωποι kwa sababu “watu” tayari linaeleza wazi maana yake ya kijumla kwa Kiswahili.
