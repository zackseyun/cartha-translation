  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: sw
  text: Kila mti usiozaa matunda mazuri hukatwa na kutupwa motoni.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiotoa matunda mazuri.”
    reason: lexical_alternative
  - marker: b
    text: “Moto” ni picha ya hukumu; aya yenyewe haibainishi kwa usahihi zaidi ikiwa mkazo ni juu ya hukumu katika wakati huu, hukumu ya mwisho, au zote mbili.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Kila mti
  rationale: πᾶν pamoja na nomino ya umoja ina maana ya kugawa kwa kila mmoja; “kila mti” ni Kiswahili cha kawaida na kinadumisha uzito wa usemi huu.
- source_word: μὴ ποιοῦν
  choice: usiozaa
  rationale: Ingawa ποιέω kwa msingi ni “kufanya/kutokeza,” kwa mti na matunda Kiswahili cha asili hutumia “kuzaa.” Umbo hili pia linaonyesha tabia inayoendelea ya mti kutotoa matunda.
- source_word: καρπὸν καλὸν
  choice: matunda mazuri
  rationale: “Matunda mazuri” ni usemi wa kawaida unaohifadhi tathmini ya καλός kuwa mema, bora, au yanayofaa. Wingi wa “matunda” ni wa asili zaidi katika Kiswahili bila kubadili maana ya jumla ya καρπόν.
- source_word: ἐκκόπτεται
  choice: hukatwa
  rationale: Kitenzi cha hali ya kutendwa chenye wakati wa sasa kinaeleza kinachofanywa kwa mti wa aina hiyo. “Hukatwa” ni cha kawaida na katika muktadha huu humaanisha kukatwa chini.
- source_word: εἰς πῦρ βάλλεται
  choice: kutupwa motoni
  rationale: “Kutupiwa/kutupwa motoni” huonyesha mwendo wa kuingia ndani ya moto kama εἰς πῦρ. “Motoni” ni Kiswahili fasaha na hakilazimishi maelezo mahususi ya moto huo.
theological_decisions:
- issue: Picha ya hukumu inayowakilishwa na moto
  choice: Kudumisha mfano wa mti kukatwa na kutupwa motoni bila kubainisha moto huo kwa usahihi zaidi.
  alternative: Hukumu ya wakati huu; hukumu ya mwisho; au jehanamu.
  rationale: Aya inaonya wazi kuhusu hukumu kwa kutumia picha ya kilimo, lakini yenyewe haitaji kwa usahihi wakati au upeo wa hukumu hiyo. Tafsiri haiongezi hitimisho finyu la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Usiozaa matunda” ni usemi wa kawaida kwa mti; “motoni” ni mfupi, wa asili, na huhifadhi picha pamoja na utata wa chanzo.
