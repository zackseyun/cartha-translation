  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: sw
  text: Ingieni kupitia lango jembamba. Kwa maana lango ni pana, na njia ni pana[a] inayoelekea kwenye maangamizi[b], na wengi ndio wanaoingia kupitia lango hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia ina nafasi tele.” Neno la Kigiriki linaweza kumaanisha pana au yenye nafasi nyingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “uharibifu” au “kupotea.” Neno la Kigiriki linaweza kuonyesha maangamizi, uharibifu, au kupotea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Ingieni
  rationale: Kitenzi hiki ni amri ya nafsi ya pili wingi; “Ingieni” ni agizo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: διὰ τῆς στενῆς πύλης
  choice: kupitia lango jembamba
  rationale: διά pamoja na uhusiano huu huonyesha mwendo wa kupitia mahali; “lango jembamba” hudumisha picha halisi na utofauti wake na lango pana.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hutambulisha sababu au ufafanuzi wa agizo lililotangulia kwa mtiririko wa kawaida wa Kiswahili.
- source_word: πλατεῖα ἡ πύλη
  choice: lango ni pana
  rationale: “Pana” ndiyo sifa ya kawaida ya nafasi inayolingana na πλατεῖα na inapingana wazi na “jembamba.”
- source_word: εὐρύχωρος ἡ ὁδός
  choice: njia ni pana
  rationale: εὐρύχωρος huonyesha kitu chenye nafasi nyingi, kipana au kisichobana. “Njia ni pana” ni Kiswahili cha kawaida na hudumisha picha ya safari; uwezekano wa “yenye nafasi tele” umewekwa katika tanbihi.
- source_word: ἡ ἀπάγουσα
  choice: inayoelekea
  rationale: Hueleza mwelekeo wa njia na matokeo yake kwa lugha ya kawaida bila kuongeza wazo lisilokuwamo.
- source_word: εἰς τὴν ἀπώλειαν
  choice: kwenye maangamizi
  rationale: ἀπώλεια inaweza kumaanisha uharibifu, maangamizi, au kupotea. “Maangamizi” huhifadhi uzito wa onyo bila kufafanua kupita kiasi hali ya mwisho inayokusudiwa.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: wengi ndio wanaoingia kupitia lango hilo
  rationale: Muundo huu unatilia mkazo “wengi.” Kisarufi, αὐτῆς inaweza kurejelea “lango” au “njia,” kwa kuwa nomino zote mbili ni za kike katika Kigiriki; “lango hilo” limechaguliwa kwa sababu kitendo cha kuingia kupitia lango kinaendana moja kwa moja na agizo la mwanzo, huku uwezekano mwingine ukitajwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἀπώλεια katika onyo la Yesu
  choice: maangamizi
  alternative: uharibifu; kupotea
  rationale: Aya inaonya kuhusu mwisho mbaya sana lakini haifafanui kikamilifu hali ya mwisho huo. “Maangamizi” hudumisha uzito na mvutano wa kitheolojia bila kuingiza ufafanuzi mwembamba wa kimadhehebu.
- issue: Kirejeleo cha αὐτῆς katika kifungu cha mwisho
  choice: lango hilo
  alternative: njia hiyo
  rationale: Kigiriki kina utata wa kweli kwa sababu πύλη na ὁδός zote ni nomino za kike. Muktadha wa “kuingia kupitia” na agizo la mwanzo unaunga mkono “lango,” lakini tanbihi inahifadhi uwezekano wa kurejelea “njia.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa msomaji wa kawaida. Kurudiwa kwa “pana” kumehifadhiwa kwa uwazi na kwa athari ya kimtindo ya ulinganifu.
