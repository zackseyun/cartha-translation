  rationale: The revision replaces the singular collective with the natural plural “makutano,” preserving οἱ ὄχλοι. It retains the source's broad reference to the completed words rather than adding an interpretive label, and uses an idiomatic Swahili expression for the crowds' strong astonishment. The footnote is adjusted to agree with “maneno haya.”
