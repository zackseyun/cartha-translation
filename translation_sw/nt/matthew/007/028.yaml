  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: sw
  text: Ikawa Yesu alipomaliza maneno haya,[a] makutano wakashangaa sana mafundisho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “semi hizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Ikawa ... alipo-
  rationale: Huu ni mfumo wa kisimulizi unaoonyesha mpito na wakati. “Ikawa ... alipo-” hudumisha muundo na hadhi ya Kigiriki huku ikiwa ya kawaida katika Kiswahili cha Biblia.
- source_word: ἐτέλεσεν
  choice: alipomaliza kusema
  rationale: Kitenzi kinaonyesha kwamba Yesu alifikisha hotuba yake mwisho. Kuongeza “kusema” kunafanya uhusiano wake na “maneno hayo” uwe wa asili katika Kiswahili bila kuongeza wazo jipya.
- source_word: τοὺς λόγους τούτους
  choice: maneno hayo
  rationale: “Maneno” ni tafsiri pana na ya moja kwa moja ya λόγους; “hayo” hudumisha rejeleo la mafundisho yaliyotangulia bila kuyawekea jina la kitheolojia.
- source_word: ἐξεπλήσσοντο
  choice: ulishangazwa sana
  rationale: Kitenzi hiki kinaonyesha mshangao mkubwa. “Sana” hudhihirisha nguvu yake, na umoja wa kisarufi unapatana na nomino ya mkusanyiko “umati.”
- source_word: οἱ ὄχλοι
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, Kiswahili cha kawaida hutumia “umati wa watu” kama nomino ya mkusanyiko; maana ya kundi kubwa la wasikilizaji inabaki wazi.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: na mafundisho yake
  rationale: Katika muktadha wa ἐξεπλήσσοντο, ἐπί pamoja na hali ya dative huonyesha msingi au sababu ya mshangao. “Kushangazwa ... na” ni muundo wa asili wa Kiswahili.
theological_decisions:
- issue: Rejeleo la maneno ya Yesu
  choice: “maneno hayo” yanarejelea mafundisho yaliyotangulia mara moja
  alternative: “semi hizo” au “hotuba hii”
  rationale: Tafsiri inabaki na usemi mpana wa Kigiriki na haiingizi jina kama “Mahubiri ya Mlimani,” ambalo halimo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ikawa ... alipo-” una ladha ya kisimulizi cha Biblia bila kutumia lugha ngumu; “umati wa watu” ni wa kawaida zaidi kuliko kulazimisha wingi wa Kigiriki.
