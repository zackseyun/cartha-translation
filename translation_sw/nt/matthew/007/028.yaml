  naturalness: “Ikawa Yesu alipomaliza ...” is a natural, dignified biblical narrative construction. “Makutano wakashangaa sana” is idiomatic modern Standard East African Swahili and expresses the strong reaction conveyed by ἐξεπλήσσοντο.
  terminology: “Maneno haya” is a suitable direct rendering of τοὺς λόγους τούτους, and “mafundisho yake” accurately renders τῇ διδαχῇ αὐτοῦ. The alternative footnote is retained but aligned with the demonstrative in the revised text.
