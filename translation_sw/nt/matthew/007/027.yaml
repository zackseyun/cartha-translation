base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: sw
  text: Mvua ikashuka, mito ikaja[a], pepo zikavuma na zikaipiga nyumba ile; nayo ikaanguka, na anguko lake lilikuwa kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafuriko yakaja.” Neno la Kigiriki kwa maana ya kawaida zaidi ni “mito,” lakini katika muktadha huu linaweza kuashiria maji ya mafuriko.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mvua ikashuka
  rationale: ‘Ikashuka’ huhifadhi mwendo wa kuelekea chini uliomo katika καταβαίνω, huku ikiwa usemi wa kawaida na unaoeleweka kuhusu mvua.
- source_word: ἦλθον οἱ ποταμοί
  choice: mito ikaja
  rationale: ποταμοί kwa kawaida humaanisha ‘mito.’ Tafsiri hii inafuata neno la chanzo, huku tanbihi ikionyesha maana inayowezekana ya maji ya mafuriko katika muktadha wa dhoruba.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: pepo zikavuma
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye kudumisha wingi wa ‘pepo.’
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: kuipiga nyumba ile
  rationale: Katika muktadha huu προσκόπτω ina maana ya kugonga au kupiga. ‘Kuipiga’ huonyesha nguvu ya pepo juu ya nyumba bila kuingiza wazo lisilokusudiwa la kujikwaa.
- source_word: ἔπεσεν
  choice: ikaanguka
  rationale: ‘Ikaanguka’ hufuata maana ya msingi ya πίπτω na kudumisha urahisi na ukali wa simulizi.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: anguko lake lilikuwa kubwa
  rationale: ‘Anguko’ huhifadhi uhusiano wa kileksika na ‘ikaanguka,’ na ‘lilikuwa kubwa’ hufuata kirai cha Kigiriki bila kuongeza maelezo ya tafsiri.
theological_decisions:
- issue: Ukali wa taswira ya hukumu katika hitimisho la mfano
  choice: anguko lake lilikuwa kubwa
  alternative: maangamizi yake yalikuwa makubwa sana
  rationale: Kigiriki kinasema tu kwamba anguko la nyumba lilikuwa kubwa. Tafsiri inadumisha uzito wa onyo bila kulipanua waziwazi kuwa hukumu ya mwisho au kuongeza maangamizi yasiyotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi vya -ka- unadumisha mwendo wa simulizi, na msamiati unabaki rahisi kwa wasomaji wa kawaida.
