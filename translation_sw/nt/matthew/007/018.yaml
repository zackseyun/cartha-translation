id: MAT.7.18
reference: Matthew 7:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: sw
  text: Mti mzuri hauwezi kuzaa matunda mabaya, wala mti uliooza hauwezi kuzaa matunda mazuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: mti mzuri
  rationale: Neno ἀγαθός kwa kawaida humaanisha ‘mzuri’ au ‘mwema.’ Katika mfano huu, ‘mti mzuri’ ni usemi wa kawaida wa Kiswahili na unadumisha picha halisi pamoja na maana ya kutathmini tabia yake.
- source_word: δύναται ... ποιεῖν
  choice: hauwezi kuzaa
  rationale: δύναται huonyesha kutoweza, na ποιεῖν pamoja na καρπούς hapa humaanisha kutoa au kuzaa matunda. ‘Hauwezi kuzaa’ ni usemi wa kawaida wa Kiswahili kuhusu mti na unahifadhi kauli ya kutowezekana.
- source_word: καρποὺς πονηρούς
  choice: matunda mabaya
  rationale: πονηρός inaweza kumaanisha mabaya, maovu, au yasiyofaa. ‘Matunda mabaya’ ni ya asili katika picha ya mti na pia inabaki na upana wa maana ya tathmini bila kuifanya iwe ya kidhahania kupita kiasi.
- source_word: οὐδέ
  choice: wala
  rationale: οὐδέ huunganisha kishazi cha pili kama ukanushaji unaolingana na wa kwanza. ‘Wala’ hudumisha uwiano huo kwa Kiswahili fasaha.
- source_word: δένδρον σαπρόν
  choice: mti uliooza
  rationale: σαπρός hueleza kitu kilichooza au kuharibika. ‘Mti uliooza’ ni wazi na halisi, na huhifadhi nguvu ya picha kuliko ‘mti mbaya.’
- source_word: καρποὺς καλούς
  choice: matunda mazuri
  rationale: καλός hapa hueleza matunda yenye ubora mzuri. ‘Matunda mazuri’ ni tafsiri ya kawaida na huleta ulinganifu wa wazi na ‘matunda mabaya.’
theological_decisions:
- issue: Asili ya kutowezekana katika mfano
  choice: 'Kauli imetafsiriwa kama kutoweza kabisa: ‘hauwezi.’'
  alternative: ‘Kwa kawaida hauzai’ au ‘hapaswi kuzaa.’
  rationale: δύναται ikiwa imekanushwa inasema wazi kutoweza, si uwezekano mdogo wala wajibu wa kimaadili. Tafsiri inadumisha nguvu ya kauli ya Yesu bila kuongeza hitimisho jingine la kimafundisho nje ya mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni mfupi na sawia; ‘kuzaa matunda’ ni usemi wa kawaida kwa mti. Hakuna tanbihi iliyohitajika kwa sababu chaguo kuu zinaeleweka na tofauti za kileksika hazibadili maana kwa kiwango kinacholazimu tanbihi.
