translation:
  language: sw
  text: Kwa maana alikuwa akiwafundisha kama mtu mwenye mamlaka[a], wala si kama waandishi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “kwa mamlaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: kwa maana alikuwa akiwafundisha
  rationale: Muundo wa ἦν pamoja na kitenzi-shirikishi unaonyesha tendo lililokuwa likiendelea wakati uliopita. “Kwa maana” inadumisha kazi ya γάρ ya kueleza sababu ya umati kushangazwa katika mstari uliotangulia.
- source_word: αὐτούς
  choice: -wa- katika “akiwafundisha”
  rationale: Kiwakilishi hiki kinawarejelea wasikilizaji; Kiswahili hukitia kwa kawaida ndani ya kitenzi kama kiambishi cha yambwa.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: kama mtu mwenye mamlaka
  rationale: Tafsiri hii inadumisha muundo wa kulinganisha na kumwonyesha Yesu kama mwenye mamlaka, bila kuifanya mamlaka kuwa ujasiri wa kusema tu.
- source_word: καὶ οὐχ ὡς
  choice: wala si kama
  rationale: “Wala si kama” ni njia ya kawaida na yenye hadhi katika Kiswahili ya kuonyesha ulinganisho wa kinyume uliomo katika Kigiriki.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: walimu wao wa Sheria
  rationale: Katika muktadha huu γραμματεῖς ni wataalamu na wafafanuzi wanaotambulika wa Sheria, si waandishi kwa maana ya kisasa. “Wao” inadumisha αὐτῶν.
theological_decisions:
- issue: Asili ya mamlaka ya Yesu katika kufundisha
  choice: 'Kueleza jinsi alivyofundisha: “kama mtu mwenye mamlaka.”'
  alternative: Kupanua maneno ili kutaja wazi mamlaka ya kimungu, au kuyapunguza yawe ujasiri au ustadi wa usemi tu.
  rationale: Mstari unadai kwamba Yesu alikuwa na mamlaka halisi na unamtofautisha na walimu wa Sheria, lakini hapa hauelezi kikamilifu chanzo cha mamlaka hiyo. Tafsiri haiongezi ufafanuzi wa kimadhehebu wala kupunguza uzito wa dai hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “alikuwa akiwafundisha” unaonyesha tendo endelevu, na “walimu wa Sheria” unaeleweka kwa urahisi zaidi leo kuliko “waandishi” huku ukidumisha jukumu la γραμματεῖς katika muktadha.
