  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: sw
  text: Na kila anayesikia maneno yangu haya na asiyeyatenda atafananishwa na mwanamume mpumbavu[a], ambaye alijenga nyumba yake juu ya mchanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mpumbavu.” Kigiriki kinasema “mwanamume mpumbavu,” neno hilo likitumiwa katika mfano unaowahusu watu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: kila anayesikia
  rationale: Kirai hiki cha Kigiriki kinamtaja kwa ujumla kila mtu anayesikia. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: μου τοὺς λόγους τούτους
  choice: maneno yangu haya
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa kiashiria ‘haya’ pamoja na umilikaji ‘yangu.’
- source_word: μὴ ποιῶν αὐτούς
  choice: asiyeyatenda
  rationale: Kitenzi ποιέω hapa kinamaanisha kuyafanya au kuyatekeleza maneno yaliyosikiwa. ‘Asiyeyatenda’ huhifadhi uhusiano wa moja kwa moja na ‘maneno’ na uwiano na mstari uliotangulia.
- source_word: ὁμοιωθήσεται
  choice: atafananishwa na
  rationale: Hii inahifadhi hali ya kutendwa na wakati ujao wa kitenzi cha Kigiriki huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: ἀνδρὶ μωρῷ
  choice: mwanamume mpumbavu
  rationale: ἀνήρ humaanisha mwanamume, si mtu bila kubainisha jinsia; μωρός hapa inafaa kutafsiriwa ‘mpumbavu.’ Tafsiri inahifadhi taswira ya kiume ya mfano bila kudai kwamba matumizi yake yanaishia kwa wanaume.
- source_word: ὅστις
  choice: ambaye
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu mwanamume katika mfano; ‘ambaye’ ni cha kawaida na sahihi katika Kiswahili.
- source_word: ᾠκοδόμησεν
  choice: alijenga
  rationale: Kitenzi hiki hueleza moja kwa moja tendo lililokamilika la kujenga.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: nyumba yake
  rationale: οἰκία hapa ni jengo halisi katika mfano, hivyo ‘nyumba’ linafaa kuliko neno linalosisitiza makazi au familia.
- source_word: ἐπὶ τὴν ἄμμον
  choice: juu ya mchanga
  rationale: Kirai hiki kinaonyesha msingi au sehemu ambayo nyumba ilijengwa; ‘juu ya mchanga’ ni wazi na ya kawaida.
theological_decisions:
- issue: Lugha ya kiume inayotumika kwa uwakilishi katika mfano
  choice: mwanamume mpumbavu
  alternative: mtu mpumbavu
  rationale: Kigiriki kinatumia ἀνήρ, nomino inayomtaja mwanamume. Tafsiri inahifadhi jambo hilo la matini, huku tanbihi ikieleza kwamba mwanamume huyo ni mhusika wa mfano unaotumika kwa kila anayesikia bila kutenda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘anayesikia ... na asiyeyatenda’ unahifadhi urudiaji na ulinganifu wa vitenzi vya Kigiriki bila kuwa mzito.
