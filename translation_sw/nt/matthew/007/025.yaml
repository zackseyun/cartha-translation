  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: sw
  text: Mvua ikashuka, mito[a] ikaja, pepo zikavuma na kuipiga[b] nyumba ile, na haikuanguka, kwa maana msingi wake ulikuwa umewekwa juu ya mwamba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafuriko”; neno la Kigiriki kwa kawaida humaanisha “mito.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuiangukia” au “kuigonga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mvua ikashuka
  rationale: Huhifadhi wazo la mvua kuja chini kwa lugha ya kawaida na yenye hadhi, bila kuongeza dhana ya dhoruba.
- source_word: οἱ ποταμοί
  choice: mito
  rationale: Maana ya kawaida ya ποταμοί ni “mito.” Ingawa muktadha unaweza kudokeza maji ya mafuriko, tafsiri hii huhifadhi taswira halisi ya Kigiriki.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: pepo zikavuma
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha pepo katika Kiswahili.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: kuipiga nyumba ile
  rationale: Katika muktadha wa dhoruba, “kuipiga” huwasilisha kwa kawaida nguvu iliyoelekezwa dhidi ya nyumba, huku tanbihi ikihifadhi maana mbadala za karibu zaidi na umbo la kitenzi cha Kigiriki.
- source_word: οὐκ ἔπεσεν
  choice: haikuanguka
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi, bila kutumia “haikubomoka,” ambalo lingeongeza ufafanuzi wenye nguvu zaidi.
- source_word: τεθεμελίωτο
  choice: ilikuwa imewekewa msingi
  rationale: Huhifadhi hali ya tendo lililokuwa limekamilika kabla ya dhoruba pamoja na taswira ya msingi.
- source_word: ἐπὶ τὴν πέτραν
  choice: juu ya mwamba
  rationale: Huhifadhi taswira ya mwamba bila kuifanya iwe mahususi zaidi kama “mwamba wa chini ya ardhi.”
theological_decisions:
- issue: Taswira ya msingi katika mfano
  choice: juu ya mwamba
  alternative: juu ya mwamba wa chini ya ardhi
  rationale: Aya yenyewe haitambulishi mwamba moja kwa moja kwa maana ya kiteolojia. Tafsiri rahisi huhifadhi taswira na mvutano wa mfano bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vyenye kiambishi -ka unaendeleza kasi ya simulizi. “Nyumba ile” ni ya kimaumbile katika mfano, si jamaa au kaya.
