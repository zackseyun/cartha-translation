  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: sw
  text: Lakini kwa nini unaona kibanzi kilicho katika jicho la ndugu yako,[a] ilhali huitambui boriti iliyo katika jicho lako mwenyewe?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unyasi” au “chembe ya makapi” kwa neno la Kigiriki κάρφος.
    reason: lexical_alternative
  - marker: b
    text: Au “gogo” au “ubao” kwa neno la Kigiriki δοκός; neno hilo humaanisha boriti kubwa ya ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: kwa nini
  rationale: Katika muundo huu wa swali pamoja na βλέπεις, τί ina maana ya kiutendaji ya kuuliza sababu, hivyo “kwa nini” inaleta nguvu ya swali la balagha kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ inaonyesha utofautishaji wa kiasi na mafundisho yaliyotangulia; “Lakini” hudumisha mpito huo wa kimantiki.
- source_word: βλέπεις
  choice: unakiona
  rationale: Kitenzi hiki kwa kawaida humaanisha kuona. “Unakiona” huhifadhi taswira halisi ya jicho na kutofautishwa na κατανοεῖς.
- source_word: κάρφος
  choice: kibanzi
  rationale: κάρφος ni kipande kidogo kikavu, kama kibanzi, unyasi, au chembe ya makapi. “Kibanzi” ni neno la kawaida linalofaa kwa kitu kidogo kinachoweza kuingia jichoni na linatofautiana wazi na boriti.
- source_word: ἀδελφοῦ
  choice: ndugu yako
  rationale: “Ndugu” ni tafsiri ya kawaida na yenye hadhi ya ἀδελφός katika muktadha huu. Kiswahili hakilazimishi kubainisha jinsia kwa neno hili, kwa hiyo hakiongezi wala kuondoa jinsia isiyowekwa wazi na umbo la kawaida la Kiswahili.
- source_word: τῷ σῷ ὀφθαλμῷ
  choice: jicho lako mwenyewe
  rationale: “Lako mwenyewe” huonyesha msisitizo wa σῷ na kuimarisha utofautishaji na jicho la ndugu.
- source_word: δοκόν
  choice: boriti
  rationale: δοκός ni boriti kubwa ya ujenzi. “Boriti” huhifadhi maana ya usanifu na ukinzani wa kutia chumvi kati ya kitu kidogo na kitu kikubwa.
- source_word: οὐ κατανοεῖς
  choice: hulitambui
  rationale: κατανοέω hapa ni kutambua au kuzingatia kwa makini. “Hulitambui” ni ya asili na hudumisha tofauti ya kimatamshi na “unakiona,” pamoja na kinaya cha swali.
- source_word: ὀφθαλμῷ
  choice: jicho
  rationale: “Jicho” ndiyo tafsiri ya moja kwa moja na ya kawaida ya ὀφθαλμός katika taswira hii.
theological_decisions:
- issue: Neno la uhusiano ἀδελφοῦ
  choice: ndugu yako
  alternative: ndugu yako wa kiume
  rationale: Kiswahili sanifu hutumia “ndugu” bila kuweka jinsia wazi. Kuongeza “wa kiume” kungefanya sentensi kuwa nzito na kungeingiza ubainishaji usio wa lazima katika Kiswahili, huku “ndugu yako” ikidumisha uhusiano wa karibu wa neno la Kigiriki bila kulibadilisha kuwa “jirani” au “mwenzako.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na ukinzani kati ya kibanzi na boriti umehifadhiwa; “hulitambui” huepuka kurudia kitenzi cha kuona na kuakisi tofauti ya vitenzi vya Kigiriki.
