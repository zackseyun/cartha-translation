  text: So then[a], you will recognize them by their fruits.
translation:
  language: sw
  text: Kwa hiyo[a], mtawatambua kwa matunda yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi kwa hakika, kutokana na matunda yao mtawajua.”
    reason: Mbadala huu unaonyesha kwa uwazi zaidi msisitizo wa ἄρα γε na tafsiri halisi zaidi ya ἀπὸ pamoja na ἐπιγνώσεσθε.
lexical_decisions:
- source_word: ἄρα γε
  choice: Kwa hiyo
  rationale: Kirai hiki kinatoa hitimisho lenye msisitizo wa kiasi. ‘Kwa hiyo’ ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha uhusiano wa kimantiki na yaliyotangulia.
- source_word: ἀπὸ
  choice: kwa
  rationale: Pamoja na kitenzi ἐπιγινώσκω na kirai cha ‘matunda yao,’ kihusishi hiki kinaonyesha msingi wa kuwatambua; ‘kwa’ ni usemi wa asili katika Kiswahili.
- source_word: καρπῶν
  choice: matunda
  rationale: Neno la Kigiriki liko katika wingi. ‘Matunda’ huhifadhi sitiari ya matokeo yanayoonekana bila kuifafanua kupita kiasi.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki kinamilikisha ‘matunda’ kwa watu wanaozungumziwa na kinatafsiriwa kwa kawaida kuwa ‘yao.’
- source_word: ἐπιγνώσεσθε
  choice: mtawatambua
  rationale: Kitenzi hiki ni cha wakati ujao, nafsi ya pili wingi, na katika muktadha kinamaanisha kuwabaini watu kwa ushahidi unaoonekana. ‘Mtawatambua’ huwasilisha maana hiyo kwa usahihi.
- source_word: αὐτούς
  choice: -wa- katika ‘mtawatambua’
  rationale: Kiwakilishi cha yambwa kinawarejelea watu wanaozungumziwa; katika Kiswahili kinaunganishwa kwa kawaida ndani ya kitenzi kama kiambishi ‘-wa-.’
theological_decisions:
- issue: Matumizi ya kisitiari ya ‘matunda’ katika kuwatathmini watu
  choice: Kuhifadhi sitiari ‘matunda’
  alternative: matendo yao; matokeo yao
  rationale: Andiko linatumia matunda kama ishara ya mambo yanayoonekana yanayotokana na mtu. Kuhifadhi sitiari kunaendeleza mshikamano na muktadha wa karibu na huepuka kuingiza tafsiri finyu ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Muundo ‘mtawatambua’ ni wa asili na hujumuisha yambwa wa watu; wingi ‘matunda’ umehifadhiwa.
