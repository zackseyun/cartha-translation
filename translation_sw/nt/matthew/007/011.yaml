reference: Matthew 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: sw
  text: Basi, ikiwa ninyi mlio waovu mnajua kuwapa watoto wenu zawadi nzuri, je, Baba yenu aliye katika mbingu[a] hatawapa zaidi sana mema[b] wale wanaomwomba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa usemi uliozoeleka zaidi, “aliye mbinguni.” Kigiriki kina umbo la wingi: “katika mbingu.”'
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri zinasema “zawadi nzuri” katika kishazi hiki cha pili, lakini Kigiriki kinasema tu “mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: mlio waovu
  rationale: Muundo huu unahifadhi maelezo ya moja kwa moja kwamba wasikilizaji ni waovu, bila kuyapanua kuwa fundisho kamili zaidi kuhusu hali ya mwanadamu wala kuyapunguza kuwa udhaifu tu.
- source_word: οἴδατε ... διδόναι
  choice: mnajua kuwapa
  rationale: Kiswahili hiki huonyesha maarifa au uwezo wa kutenda unaoelezwa na kitenzi-jina cha Kigiriki.
- source_word: δόματα ἀγαθὰ
  choice: zawadi nzuri
  rationale: “Zawadi” ni maana ya kawaida ya δόματα, na “nzuri” inatafsiri ἀγαθὰ kama kivumishi chake.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: watoto wenu
  rationale: τέκνα inawahusu watoto bila kubainisha jinsia; “watoto wenu” ni sahihi na ya kawaida.
- source_word: πόσῳ μᾶλλον
  choice: si zaidi sana ...?
  rationale: Huu ni usemi wa kawaida wa Kiswahili katika swali la kulinganisha linalojenga hoja kutoka jambo dogo kwenda jambo kubwa zaidi.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Baba yenu aliye katika mbingu
  rationale: Tafsiri hii inadumisha muundo wa mahali na pia wingi wa οὐρανοῖς kwa kutumia “mbingu,” badala ya kuugeuza kuwa tu cheo cha kivumishi.
- source_word: δώσει ἀγαθὰ
  choice: atawapa mambo mema
  rationale: Katika kishazi hiki δόματα halijarudiwa; “mambo mema” linaonyesha kwamba ἀγαθὰ limetumiwa kama nomino bila kuingiza tena neno “zawadi.”
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: wale wanaomwomba
  rationale: Usemi huu wa kawaida unawakilisha kundi la watu wanaomwomba yeye, kama ilivyo katika kauli ya Kigiriki.
theological_decisions:
- issue: Uzito wa maelezo “πονηροὶ ὄντες” kuhusu hali ya mwanadamu
  choice: mlio waovu
  alternative: ingawa ninyi ni wenye dhambi; licha ya mapungufu yenu
  rationale: Tafsiri inabaki na maelezo makali ya Yesu na tofauti kati ya wanadamu waovu na Baba, bila kuingiza ufafanuzi mpana wa kimadhehebu au kuyapunguza maneno hayo.
- issue: Namna ya kutafsiri “ὁ ἐν τοῖς οὐρανοῖς”
  choice: aliye katika mbingu
  alternative: aliye mbinguni; Baba yenu wa mbinguni
  rationale: Chaguo hili linaonyesha wazi kishazi cha mahali na wingi wa Kigiriki, huku likibaki lenye kueleweka katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali “si zaidi sana ...?” unadumisha hoja ya kulinganisha; “aliye katika mbingu” ni rasmi kidogo lakini hufanya wingi wa chanzo uonekane wazi.
