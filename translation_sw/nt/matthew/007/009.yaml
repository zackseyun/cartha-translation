  source_fidelity: 'Tafsiri inahifadhi muundo wa swali la balagha: kiunganishi «Au», mtu kutoka miongoni mwa wasikilizaji, mwana anayemwomba baba mkate, na jibu lisilotarajiwa la kupewa jiwe. Muundo wa «mwanawe akimwomba» unaeleza kwa kawaida hali ya jumla inayokusudiwa katika Kigiriki.'
