  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: sw
  text: Au kuna mtu gani kati yenu ambaye mwanawe akimwomba mkate, atampa jiwe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Inaunganisha mfano huu wa balagha na hoja iliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: kuna mtu gani kati yenu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi swali la balagha na maana ya mtu mmoja kutoka miongoni mwa wasikilizaji.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: ambaye mwanawe akimwomba
  rationale: Muundo wa 'aki-' unaeleza hali ya jumla kwa ufasaha; 'mwanawe' linadumisha uhusiano uliotajwa na υἱός bila kufanya sentensi kuwa nzito.
- source_word: ἄρτον
  choice: mkate
  rationale: Hili ndilo neno la moja kwa moja na linalofaa katika mlinganisho huu; 'chakula' lingekuwa pana mno.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: atampa jiwe?
  rationale: Swali lenye μὴ linatarajia jibu la kukataa. Katika Kiswahili, muktadha na kiimbo cha swali vinaonyesha wazi matarajio hayo bila kuongeza 'si' au 'je, atampa'.
theological_decisions:
- issue: Lugha wakilishi inayohusu jinsia
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa ἄνθρωπος iko katika umbo la kisarufi la kiume, kwa kawaida humaanisha binadamu au mtu kwa uwakilishi. 'Mtu' ni tafsiri sahihi na ya kawaida ya Kiswahili bila kuingiza dai kwamba jinsia ndiyo kiini cha mfano.
- issue: Utambulisho wa υἱός
  choice: mwanawe
  alternative: mtoto wake wa kiume
  rationale: '''Mwanawe'' ni neno la kawaida na lenye hadhi linalolingana na υἱός katika muktadha wa kifamilia; ufafanuzi ''mtoto wake wa kiume'' ungekuwa mzito isivyo lazima.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida kwa wasomaji wengi na unadumisha nguvu ya balagha ya sentensi ya Kigiriki.
