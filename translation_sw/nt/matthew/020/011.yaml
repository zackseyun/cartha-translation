translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kunung’unika” ni neno linaloeleweka na linalohifadhi hisia ya malalamiko ya chini kwa chini; “mwenye shamba” linafaa mazingira ya mfano kuliko “mwenye nyumba” katika matini kuu.
