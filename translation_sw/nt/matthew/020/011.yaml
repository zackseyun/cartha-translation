  text: Nao, baada ya kuipokea[a], wakaanza kumnung’unikia mwenye shamba,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walipoipokea, walikuwa wakimnung’unikia mwenye nyumba.”
    reason: Huhifadhi uwezekano wa kutafsiri λαβόντες kwa kishazi cha wakati, ἐγόγγυζον kama tendo lililokuwa likiendelea, na οἰκοδεσπότης kwa maana yake ya karibu zaidi ya ‘mwenye nyumba.’
lexical_decisions:
- source_word: λαβόντες
  choice: baada ya kuipokea
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu. Kiwakilishi “-i-” kinarejelea dinari iliyotajwa katika muktadha, ingawa yambwa haikutajwa wazi katika Kigiriki.
- source_word: δὲ
  choice: Nao
  rationale: Hiki ni kiunganishi chepesi kinachoendeleza simulizi; “Nao” kinaunganisha sentensi hii na iliyotangulia bila kuingiza utofautishaji mkali.
- source_word: ἐγόγγυζον
  choice: wakaanza kumnung’unikia
  rationale: Wakati usiotimilifu unaweza kuonyesha tendo lililoanza au lililokuwa likiendelea. “Wakaanza kumnung’unikia” linaonyesha mwanzo wa manung’uniko baada ya malipo na kuhifadhi wazo la kutoridhika kwa sauti ya chini.
- source_word: κατὰ
  choice: kumnung’unikia
  rationale: Katika muundo huu, κατά pamoja na uhusika milikishi huonyesha kuwa manung’uniko yalielekezwa dhidi ya mtu. Kiambishi cha yambwa katika “kumnung’unikia” kinaeleza uelekeo huo kwa Kiswahili cha kawaida.
- source_word: τοῦ οἰκοδεσπότου
  choice: mwenye shamba
  rationale: Neno hili humaanisha mkuu wa nyumba au mali. Katika muktadha wa mfano wa wafanyakazi wa shambani, “mwenye shamba” ni la asili na wazi, huku footnote ikihifadhi maana ya karibu zaidi ya muundo wa neno la Kigiriki.
