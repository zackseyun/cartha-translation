  rationale: Pamoja na kitenzi “waliwakasirikia,” kirai hiki hutolewa kama walengwa wa hasira. Ingawa περί kwa umbo lake ni “kuhusu,” katika muktadha huu muundo wa Kiswahili “kuwakasirikia” ni wa asili na hauondoi wazo kwamba ndugu hao ndio waliohusika.
