  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: sw
  text: Chukua kilicho chako, kisha uende. Lakini nataka kumpa huyu wa mwisho kama nilivyokupa wewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini nataka kumpa huyu wa mwisho kilekile nilichokupa wewe.”
    reason: Mbadala huu hufanya wazi kitu kilekile kinachodokezwa katika ulinganisho mfupi wa Kigiriki ὡς καὶ σοί.
lexical_decisions:
- source_word: ἆρον
  choice: Chukua
  rationale: Amri hii ya kitenzi αἴρω hapa inamaanisha kuchukua kitu kinachomhusu mtu. “Chukua” ni ya kawaida, ya moja kwa moja, na haiongezi wazo la kupokea ambalo halijasemwa wazi.
- source_word: τὸ σὸν
  choice: kilicho chako
  rationale: Kirai hiki kwa maana halisi ni kitu ambacho ni chake. “Kilicho chako” kinahifadhi upana huo bila kuongeza neno “ujira,” ingawa muktadha unahusu malipo.
- source_word: ὕπαγε
  choice: uende
  rationale: Kitenzi hiki ni amri ya kuondoka. “Uende” ni Kiswahili cha kawaida na hakifanyi sauti ya msemaji ionekane kali kuliko ilivyo katika Kigiriki.
- source_word: θέλω δὲ
  choice: Lakini nataka
  rationale: θέλω huonyesha nia au hiari ya msemaji, na δέ huleta utofautishaji wa kiasi. “Lakini nataka” ni ya wazi na ya sasa.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: huyu wa mwisho
  rationale: Kirai hiki humtaja mfanyakazi mmoja aliyekuwa wa mwisho. Kiswahili “huyu wa mwisho” humrejelea mtu huyo kwa kawaida bila kulazimika kuongeza nomino isiyokuwapo wazi katika matini.
- source_word: δοῦναι
  choice: kumpa
  rationale: δίδωμι maana yake ya msingi ni “kupa.” Ingawa muktadha ni wa kulipa ujira, “kumpa” huhifadhi uchaguzi mpana wa neno la Kigiriki na kusisitiza uhuru wa mwenye shamba kutoa.
- source_word: ὡς καὶ σοί
  choice: kiasi kilekile nilichokupa wewe
  rationale: Kirai cha Kigiriki ni cha ulinganisho na kinaacha kitenzi kinachoeleweka kutokana na muktadha. Tafsiri hii inaeleza usawa wa kiasi kwa Kiswahili cha kawaida huku ikihifadhi wazo la kumpa.
theological_decisions:
- issue: Namna ya kumrejelea mfanyakazi mmoja wa mwisho
  choice: huyu wa mwisho
  alternative: mwanamume huyu wa mwisho
  rationale: Maumbo ya Kigiriki ni ya umoja wa kiume na katika muktadha yanamrejelea mfanyakazi mmoja. Hata hivyo, kiwakilishi cha Kiswahili “huyu” tayari ni cha mtu na hakifichi kwamba anarejelewa mtu mahususi; kuongeza “mwanamume” kungefanya jinsia iwe dhahiri zaidi kuliko inavyohitajika kwa Kiswahili asilia.
- issue: Usawa wa kile alichopewa mfanyakazi wa mwisho
  choice: kiasi kilekile nilichokupa wewe
  alternative: kama nilivyokupa wewe pia
  rationale: Kigiriki ὡς καὶ σοί kina muundo mfupi unaoonyesha ulinganisho. Chaguo kuu linaweka wazi kwamba kiasi kilikuwa sawa, jambo linalodokezwa na muktadha, bila kueleza sababu ya kitheolojia ya ukarimu wa mwenye shamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Amri zimebaki za moja kwa moja, na sentensi haijaongezewa ukali wala maelezo ya kimadhehebu.
