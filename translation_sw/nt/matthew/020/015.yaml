  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: sw
  text: Je, siruhusiwi kufanya nitakavyo na mali yangu? Au jicho lako ni ovu kwa sababu mimi ni mwema?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Je, una wivu kwa sababu mimi ni mwema?” Usemi “jicho lako ni ovu” ni nahau ya Kigiriki inayoweza kumaanisha kuwa na wivu au kinyongo kwa sababu ya mema anayopata mwingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: siruhusiwi
  rationale: Kitenzi hiki huonyesha jambo linaloruhusiwa au lililo halali. Muundo wa swali la kukanusha ‘siruhusiwi’ unasikika kwa kawaida katika Kiswahili na kuhifadhi hoja ya mwenye shamba kuhusu haki yake.
- source_word: ὃ θέλω ποιῆσαι
  choice: kufanya nitakavyo
  rationale: Kauli hii inaonyesha hiari ya mtu. ‘Nitakavyo’ ni ya sasa, ya kawaida, na inaakisi θέλω bila kuongeza maana nyingine.
- source_word: ἐν τοῖς ἐμοῖς
  choice: na mali yangu
  rationale: Katika muktadha wa mfano, maneno haya yanarejelea vitu au mali ya mwenye shamba. ‘Na mali yangu’ huonyesha wazi kuwa anauliza kuhusu matumizi ya kile kilicho chake.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: jicho lako ni ovu
  rationale: Tafsiri hii huhifadhi taswira halisi ya nahau ya Kigiriki na tofauti yake na wema wa mwenye shamba. Maana inayowezekana ya wivu inaelezwa katika tanbihi.
- source_word: ἀγαθός
  choice: mwema
  rationale: Kivumishi hiki humaanisha ‘mwema.’ Ingawa katika muktadha wema huo unaonekana katika ukarimu, ‘mwema’ huhifadhi upana wa neno la Kigiriki na ulinganifu wake na ‘jicho ... ovu.’
theological_decisions:
- issue: Iwapo nahau ὁ ὀφθαλμός σου πονηρός ifasiriwe moja kwa moja katika matini kuu
  choice: Kuhifadhi nahau ‘jicho lako ni ovu’ katika matini kuu
  alternative: Je, una wivu kwa sababu mimi ni mwema?
  rationale: Kuhifadhi taswira ya jicho ovu huendeleza tofauti iliyomo katika chanzo kati ya mtazamo wa mfanyakazi na wema wa mwenye shamba, bila kuifungia nahau hiyo katika tafsiri moja tu. Tanbihi humsaidia msomaji kuelewa maana yake inayowezekana ya wivu au kinyongo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘siruhusiwi’ ni wa kawaida kuliko ‘si halali kwangu,’ huku ‘mali yangu’ ikiwasilisha umiliki kwa uwazi. Nahau isiyo ya kawaida ‘jicho lako ni ovu’ imehifadhiwa kwa uaminifu na kufafanuliwa katika tanbihi.
