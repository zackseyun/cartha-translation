  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: sw
  text: Lakini Yesu akajibu, akasema, “Hamjui mnachoomba. Je, mnaweza kunywa kikombe[a] ambacho ninakaribia kunywa?” Wakamwambia, “Tunaweza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi, “kikombe cha mateso ambacho ninakaribia kunywa.” Kigiriki kinadumisha istiari ya “kikombe,” taswira ya kawaida ya kibiblia ya fungu la mtu, hasa mateso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Lakini Yesu akajibu, akasema
  rationale: “Lakini” linaonyesha tofauti nyepesi ya δέ katika muktadha huu, huku “akajibu, akasema” likiwakilisha kitenzi kishirikishi ἀποκριθείς na kitenzi kikuu εἶπεν bila kupoteza muundo wa masimulizi.
- source_word: Οὐκ οἴδατε
  choice: Hamjui
  rationale: Linadumisha maana ya msingi ya οἶδα, yaani kujua, bila kuifasiri moja kwa moja kuwa kuelewa.
- source_word: τί αἰτεῖσθε
  choice: mnachoomba
  rationale: Ni Kiswahili cha kawaida kinachoeleza jambo wanaloliomba; kinaendeleza nguvu ya ombi la sasa katika muktadha.
- source_word: δύνασθε
  choice: mnaweza
  rationale: Linaonyesha uwezo au uweza kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: πιεῖν
  choice: kunywa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi hiki.
- source_word: τὸ ποτήριον
  choice: kikombe
  rationale: Linadumisha istiari ya Kigiriki na picha pana ya kibiblia badala ya kuibadili moja kwa moja kuwa “mateso.”
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: ambacho ninakaribia kunywa
  rationale: “Ninakaribia” linaonyesha tendo la wakati ujao lililo mbele karibu, huku istiari ya kunywa ikidumishwa.
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa masimulizi ulio wa kawaida katika Kiswahili; kiambishi “-mw-” kinawakilisha “kwake.”
- source_word: Δυνάμεθα
  choice: Tunaweza
  rationale: Linarudia kwa ulinganifu neno lililotumiwa katika swali na kudumisha mkazo juu ya uwezo.
theological_decisions:
- issue: Nguvu ya kiistiari ya “kikombe”
  choice: Kudumisha “kikombe” katika matini kuu bila kukifafanua kuwa mateso au kifo.
  alternative: “mateso ninayokaribia kupitia” au “kikombe cha mateso ninachokaribia kunywa”
  rationale: Istiari hii ni muhimu kiteolojia na inabaki wazi kimakusudi ndani ya simulizi. Inaelekeza kwa mateso ya Yesu yanayokuja bila kuifungia picha hiyo katika ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na inayoeleweka kwa msomaji wa kawaida, huku muundo wa jibu na istiari kuu ya Kigiriki vikidumishwa.
