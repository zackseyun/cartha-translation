id: MAT.20.2
reference: Matthew 20:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: sw
  text: Baada ya kukubaliana na wafanyakazi kuwalipa dinari moja kwa siku[a], aliwatuma katika shamba lake la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa ujira wa kawaida wa mfanyakazi kwa siku moja.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Baada ya kukubaliana
  rationale: Kirai hiki cha kitenzi katika wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; tafsiri hii ni ya kawaida na huhifadhi mpangilio huo.
- source_word: δὲ
  choice: —
  rationale: Hapa ni kiunganishi hafifu cha masimulizi; hakihitaji kutafsiriwa moja kwa moja kwa kuwa kirai cha mwanzo tayari kinaunganisha sentensi kwa ufasaha.
- source_word: ἐργατῶν
  choice: wafanyakazi
  rationale: Ni neno la Kiswahili cha sasa linaloeleweka vizuri katika muktadha wa watu walioajiriwa kufanya kazi shambani.
- source_word: ἐκ δηναρίου
  choice: kuwalipa dinari moja
  rationale: Muundo huu unaonyesha kiasi cha ujira kilichokubaliwa. Kuongeza kitenzi 'kuwalipa' huifanya maana hiyo iwe wazi katika Kiswahili bila kubadili thamani ya fedha ya kale.
- source_word: τὴν ἡμέραν
  choice: kwa siku
  rationale: Huonyesha muda unaohusiana na ujira na kwa kawaida humaanisha ujira wa kazi ya siku hiyo, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἀπέστειλεν
  choice: aliwatuma
  rationale: Ni tafsiri ya kawaida na sahihi ya kitenzi cha masimulizi, huku kiambishi cha yambwa kikirejelea wafanyakazi.
- source_word: ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa eneo ambako mizabibu hulimwa.
- source_word: αὐτοῦ
  choice: lake
  rationale: Kiwakilishi hiki kinaonyesha kuwa shamba la mizabibu lilikuwa la mwenye shamba aliyetajwa katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'Baada ya kukubaliana' ni wa asili, na 'dinari' huhifadhi jina la sarafu ya kale huku tanbihi ikieleza thamani yake ya kijamii.
