  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: sw
  text: “Tazama[a], tunapanda kuelekea Yerusalemu, na Mwana wa Adamu[b] atakabidhiwa[c] mikononi mwa makuhani wakuu na waandishi wa sheria, nao watamhukumu kifo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalia.”
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Adamu” ni jina ambalo Yesu alilitumia mara nyingi kujitaja mwenyewe; huenda likawa na mwangwi wa Danieli 7:13–14.
    reason: cross_reference
  - marker: c
    text: “Atakabidhiwa” pia inaweza kutafsiriwa “atatiwa mikononi mwa”; katika muktadha mwembamba zaidi, kitenzi hiki kinaweza kumaanisha “atasalitiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu linalohifadhi msisitizo wa usemi wa Kigiriki; katika Kiswahili cha sasa lina hadhi ya kifasihi lakini bado linaeleweka kwa urahisi.
- source_word: ἀναβαίνομεν
  choice: tunapanda kwenda
  rationale: Linahifadhi wakati wa sasa na wazo la kupanda kuelekea Yerusalemu, bila kulifanya kuwa safari ya kawaida tu.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya cheo hiki katika Injili na inadumisha mwangwi unaowezekana wa Danieli 7 bila kuufanya usemi kuwa jina la jumla la mwanadamu.
- source_word: παραδοθήσεται
  choice: atakabidhiwa mikononi mwa
  rationale: Huhifadhi hali ya kutendwa na maana pana ya kutiwa chini ya mamlaka ya wengine; haipunguzi maana kuwa usaliti wa Yuda pekee.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: makuhani wakuu
  rationale: Ni tafsiri ya kawaida ya viongozi wa kikuhani wanaotajwa kwa wingi, si kuhani mkuu mmoja tu.
- source_word: γραμματεῦσιν
  choice: waandishi wa sheria
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba hawa ni wataalamu na walimu wa sheria ya dini, badala ya kuwafanya waonekane kama waandishi wa kawaida.
- source_word: κατακρινοῦσιν
  choice: watamhukumu
  rationale: Huwasilisha tendo la kimahakama la kutoa hukumu dhidi yake.
- source_word: θανάτῳ
  choice: adhabu ya kifo
  rationale: Ni usemi wa kawaida wa Kiswahili kwa hukumu ambayo adhabu yake ni kifo.
theological_decisions:
- issue: Tafsiri ya cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: Inahifadhi cheo cha Yesu kilichozoeleka na uwezekano wa dokezo la Danieli 7:13–14, bila kukigeuza kuwa maelezo ya kawaida ya ubinadamu.
- issue: Upeo wa maana ya παραδοθήσεται
  choice: atakabidhiwa mikononi mwa
  alternative: atasalitiwa
  rationale: Kitenzi katika mstari huu kinaeleza kukabidhiwa chini ya mamlaka ya wengine; ‘atasalitiwa’ ni maana nyembamba zaidi ambayo ingeweka wazi namna au mhusika wa tendo kuliko mstari wenyewe unavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Tazama’ na ‘Mwana wa Adamu’ zinadumisha uzito wa kifungu, huku ‘waandishi wa sheria’ ikisaidia wasomaji wa kawaida kuelewa kazi ya γραμματεῖς.
