base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: sw
  text: Lakini umati ukawakemea ili wanyamaze. Hata hivyo, wao wakapaza sauti zaidi[a], wakisema, “Bwana, Mwana wa Daudi, utuhurumie!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakazidi kupaza sauti.” Neno la Kigiriki la ulinganisho linaweza kusisitiza ama kuongezeka kwa nguvu kwa ujumla (“zaidi”) au ukubwa wa sauti hasa.
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Daudi” ni cheo cha kimasihi, si taarifa ya ukoo tu.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: umati
  rationale: “Umati” ni neno la kawaida na lenye heshima kwa kundi kubwa la watu katika mazingira haya ya simulizi.
- source_word: ἐπετίμησεν
  choice: ukawakemea
  rationale: Kitenzi hiki kinaonyesha kuwakataza kwa ukali au kuwasuta, si kuwaonya tu.
- source_word: ἵνα σιωπήσωσιν
  choice: ili wanyamaze
  rationale: 'Muundo huu unaonyesha kusudi la umati: ulitaka wale watu waache kupaza sauti.'
- source_word: μεῖζον
  choice: wakazidi
  rationale: Huhifadhi nguvu ya ulinganisho bila kuamua kabisa ikiwa waliongeza hasa ukubwa wa sauti au msisitizo wa kilio chao kwa ujumla.
- source_word: ἔκραξαν
  choice: kupaza sauti
  rationale: “Kupaza sauti” huonyesha kilio kikubwa na cha dharura kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya heshima katika kumwita Yesu na pia uwezekano wa uzito wa kikristo ulio katika κύριος.
- source_word: ἐλέησον ἡμᾶς
  choice: utuhurumie
  rationale: Hili ni ombi la moja kwa moja na la kawaida la kuonyeshwa huruma, lenye nguvu inayofaa kwa hali yao.
- source_word: υἱὸς Δαυίδ
  choice: Mwana wa Daudi
  rationale: Tafsiri halisi huhifadhi cheo cha Kimasihi na cha kifalme badala ya kukifanya kuwa taarifa ya ukoo tu.
theological_decisions:
- issue: Cheo cha Kimasihi kinachotumiwa kwa Yesu
  choice: Mwana wa Daudi
  alternative: mzao wa Daudi
  rationale: Katika Mathayo, usemi huu ni cheo chenye maana ya Kimasihi, si maelezo ya nasaba pekee; “Mwana wa Daudi” huhifadhi uzito huo bila kuongeza ufafanuzi ndani ya andiko.
- issue: Tafsiri ya κύριος katika kumwita Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: “Bwana” inaweza kuonyesha heshima na pia kubeba uzito wa kikristo; kwa hiyo haiufungi usemi katika maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hata hivyo” huonyesha tofauti kati ya jaribio la umati la kuwanyamazisha na jibu lao. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
