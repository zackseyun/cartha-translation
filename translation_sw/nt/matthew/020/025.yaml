reference: Matthew 20:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: sw
  text: Lakini Yesu akawaita kwake, akasema, “Mnajua kwamba watawala wa mataifa[a] huwatawala kwa mabavu, na wakuu wao[b] hutumia mamlaka juu yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watawala wa watu wasio Wayahudi.”
    reason: Neno la Kigiriki linaweza kumaanisha mataifa kwa ujumla au, katika muktadha wa Kiyahudi, watu wasio Wayahudi.
  - marker: b
    text: Au, “watu wao mashuhuri” au “maofisa wao wa ngazi za juu.”
    reason: Kauli ya Kigiriki inamaanisha watu wakubwa kwa hadhi au mamlaka bila kutaja cheo maalumu.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita kwake
  rationale: Kitenzi hiki cha kati kinaonyesha kwamba Yesu aliwaita wanafunzi wamjie; kauli hii ni ya kawaida na inahifadhi wazo la kuwaita kwake.
- source_word: Οἴδατε
  choice: Mnajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, maana yake hapa ni ya wakati uliopo; “Mnajua” ni Kiswahili cha kawaida na sahihi.
- source_word: ἄρχοντες
  choice: watawala
  rationale: Neno hili linamaanisha wenye kutawala au kuongoza katika mazingira ya kisiasa; “watawala” ni pana na wazi.
- source_word: τῶν ἐθνῶν
  choice: wa watu wa mataifa mengine
  rationale: Katika muktadha wa Kiyahudi, neno hili linaelekea kumaanisha watu wasio Wayahudi. Kauli hii inaeleweka kwa urahisi katika Kiswahili, huku tanbihi ikihifadhi maana mbadala ya “mataifa.”
- source_word: κατακυριεύουσιν
  choice: huwatawala kwa mabavu
  rationale: Kitenzi hiki kina nguvu hasi ya kutawala kwa njia ya kuonea au kwa kujifanya bwana juu ya wengine; “kwa mabavu” inahifadhi nguvu hiyo kwa Kiswahili cha asili.
- source_word: οἱ μεγάλοι
  choice: wakuu wao
  rationale: Kivumishi kilichotumiwa kama nomino kinarejelea watu wenye cheo, ushawishi, au mamlaka. “Wakuu wao” ni kifupi na cha kawaida, bila kuamua kwa lazima kama ni maofisa rasmi.
- source_word: κατεξουσιάζουσιν
  choice: hutumia mamlaka juu yao
  rationale: Kauli hii inawasilisha maana ya kutumia mamlaka dhidi ya au juu ya wengine, huku muktadha sambamba ukionyesha ladha yake ya uonevu.
- source_word: αὐτῶν
  choice: wao / yao
  rationale: Viwakilishi hivi vinarejelea watu wa mataifa mengine wanaotawaliwa; Kiswahili hutumia viwakilishi vya ngeli ya watu kwa kawaida.
theological_decisions:
- issue: Maana ya ἐθνῶν katika kauli yenye muktadha wa Kiyahudi
  choice: watu wa mataifa mengine
  alternative: mataifa
  rationale: Maana inayokusudiwa inaelekea kuwa watu wasio Wayahudi, lakini neno la Kigiriki linaweza pia kumaanisha mataifa kwa ujumla. Tafsiri kuu inaweka wazi muktadha huo, na tanbihi inadumisha uwezekano wa maana pana.
- issue: Utambulisho wa οἱ μεγάλοι
  choice: wakuu wao
  alternative: watu wao mashuhuri; maofisa wao wa ngazi za juu
  rationale: Kigiriki kinataja walio “wakubwa” kwa hadhi au uwezo bila kufafanua ofisi yao. “Wakuu wao” huhifadhi upana huo na tanbihi inaonyesha njia nyingine halali za kuelewa cheo chao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa mabavu” ni kauli inayoeleweka kwa wasomaji wa kawaida na inahifadhi hisia hasi ya κατακυριεύουσιν. Muundo wa sentensi unabaki karibu na mpangilio wa Kigiriki bila kuwa mzito.
