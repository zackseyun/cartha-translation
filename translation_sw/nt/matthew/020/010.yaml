  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: sw
  text: Wale walioajiriwa kwanza walipofika, walidhani kwamba wangepokea zaidi; lakini wao pia wakapokea dinari moja kila mmoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa malipo ya kawaida ya mfanyakazi kwa siku moja.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: walipofika
  rationale: 'Kirai cha wakati kinaonyesha mfuatano wa simulizi kwa Kiswahili cha kawaida: “walipofika.”'
- source_word: οἱ πρῶτοι
  choice: wale walioajiriwa kwanza
  rationale: Katika muktadha, neno hili linawarejelea wafanyakazi walioajiriwa kwanza; kuongeza “walioajiriwa” huondoa utata wa kirejeleo bila kubadili maana.
- source_word: ἐνόμισαν
  choice: walidhani
  rationale: Huwasilisha dhana au matarajio yao bila kudokeza uhakika.
- source_word: πλεῖον
  choice: zaidi
  rationale: Ni tafsiri fupi na ya kawaida ya kiasi kikubwa zaidi cha malipo.
- source_word: λήμψονται
  choice: wangepokea
  rationale: Huwakilisha wakati ujao unaotazamwa kutoka kwenye kitenzi cha wakati uliopita cha kufikiri.
- source_word: τὸ ἀνὰ δηνάριον
  choice: dinari moja kila mmoja
  rationale: ἀνά ina maana ya ugawaji, yaani kiasi hicho kwa kila mtu.
- source_word: καὶ αὐτοί
  choice: wao pia
  rationale: Huhifadhi msisitizo kwamba kundi hili nalo lilipokea kiasi kilekile.
