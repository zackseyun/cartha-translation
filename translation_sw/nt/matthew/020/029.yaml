  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: sw
  text: Nao walipokuwa wakitoka[a] Yeriko, umati mkubwa ulimfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walipoondoka Yeriko.”
    reason: Mbadala huu unaonyesha kwamba ἐκπορεύομαι inaweza kutafsiriwa kwa maana ya kuondoka, ingawa “walipokuwa wakitoka” huhifadhi vizuri zaidi hali ya tendo linaloendelea.
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: Walipokuwa wakitoka
  rationale: Kirai cha wakati chenye hali ya tendo linaloendelea kinaonyesha kwamba walikuwa katika mchakato wa kutoka; Kiswahili hiki ni cha kawaida na kinahifadhi wingi wa αὐτῶν.
- source_word: ἀπὸ Ἰεριχὼ
  choice: Yeriko
  rationale: Pamoja na kitenzi ‘kutoka,’ jina la mahali bila kihusishi kingine linaonyesha kwa kawaida mahali walikotoka; ‘kutoka Yeriko’ ni Kiswahili fasaha.
- source_word: ἠκολούθησεν
  choice: ulimfuata
  rationale: Kitenzi ‘kufuata’ kinaonyesha mwendo nyuma ya mtu au kwenda pamoja naye kwa kumwandama, na kinafaa katika muktadha huu.
- source_word: αὐτῷ
  choice: -m- (ulimfuata)
  rationale: Kiambishi cha yambwa cha umoja kinamrejelea Yesu, huku mabadiliko kutoka ‘wa-’ ya wingi katika kishazi cha kwanza hadi umoja yakihifadhiwa.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: Neno ‘umati’ linaonyesha kundi kubwa la watu, na ‘mkubwa’ hapa linaeleza wingi wake kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi cha umoja αὐτῷ baada ya kishazi chenye kiwakilishi cha wingi
  choice: Umati ulimfuata Yesu (‘ulimfuata’).
  alternative: Umati uliwafuata wote waliokuwa wakitoka (‘uliwafuata’).
  rationale: Kigiriki kinabadilika wazi kutoka wingi, ‘walipokuwa wakitoka,’ hadi umoja, ‘ulimfuata.’ Muktadha unamtambulisha Yesu kuwa mrejelewa wa kawaida zaidi; tafsiri haiyasawazishi maumbo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Muundo ni wa asili bila kuondoa badiliko la Kigiriki kutoka mhusika wa wingi hadi yambwa wa umoja.
