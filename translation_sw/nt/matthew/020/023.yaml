  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: sw
  text: Akawaambia, “Ni kweli mtakunywa kikombe changu,[a] lakini nafasi za kuketi upande wangu wa kulia na upande wangu wa kushoto si juu yangu mimi kuzitoa;[b] bali ni kwa wale ambao Baba yangu amewaandalia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kikombe” ni taswira ya mateso au hatima aliyowekewa Yesu, ambayo wanafunzi wake pia watashiriki.
    reason: cross_reference
  - marker: b
    text: 'Kwa neno: “si yangu kutoa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Akawaambia
  rationale: Wakati uliopita wa usimulizi unasikika kwa kawaida katika Kiswahili, ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Ni kweli mtakinywea kikombe changu
  rationale: Muundo huu unahifadhi picha ya ‘kikombe’ bila kuifafanua ndani ya matini, huku ‘ni kweli’ ikionyesha uthibitisho unaotangulia tofauti inayoletwa na δέ.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: nafasi za kuketi upande wangu wa kulia na upande wangu wa kushoto
  rationale: ‘Upande wangu wa kulia ... wa kushoto’ ni Kiswahili cha kawaida kinachoonyesha nafasi za heshima kando ya Yesu. Neno ‘nafasi’ limewekwa wazi ili sentensi iwe ya asili katika Kiswahili.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: si juu yangu mimi kuzitoa
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kusema kwamba utoaji wa nafasi hizo si jambo la Yesu kuamua au kutoa, bila kuongeza ufafanuzi wa kimafundisho.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: bali ni kwa ajili ya wale ambao ... amewaandalia
  rationale: Kigiriki kina usemi uliofupishwa baada ya ἀλλά. Kiswahili kinakamilisha wazo kwa kawaida, huku kitenzi cha wakati timilifu kikionyesha maandalizi yaliyokwisha kufanywa na yenye matokeo yanayoendelea.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Baba yangu
  rationale: Baba ametajwa kama mtendaji wa maandalizi katika muundo tendaji wa Kiswahili; hakuna neno ‘pekee’ lililoongezwa kwa kuwa halipo wazi katika Kigiriki.
theological_decisions:
- issue: Kauli ya Yesu kwamba nafasi hizo ‘si juu yangu mimi kuzitoa’
  choice: Kauli imetafsiriwa moja kwa moja bila nyongeza inayopunguza au kueleza mamlaka ya Yesu.
  alternative: Kuongeza maelezo kama ‘bila Baba’ au kufafanua uhusiano wa mamlaka kati ya Yesu na Baba.
  rationale: Chanzo chenyewe kinaacha mvutano wa kikristo na wa kitheolojia; tafsiri haiupaswi kuutatua kwa kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku picha ya ‘kikombe’ na mvutano wa kauli kuhusu utoaji wa nafasi vikihifadhiwa.
