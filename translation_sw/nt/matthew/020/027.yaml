  text: And whoever wants to be first among you will be your slave[a].
translation:
  language: sw
  text: Na yeyote anayetaka kuwa wa kwanza miongoni mwenu atakuwa mtumwa wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi.” Neno la Kigiriki ni doulos, neno lenye nguvu kuliko lile lililotumiwa katika mstari uliotangulia, na mara nyingi humaanisha mtumwa au mtumishi mwenye wajibu wa kifungo kwa bwana wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: yeyote anayetaka
  rationale: Muundo wa kiwakilishi pamoja na ἄν na hali tegemezi unaonyesha sharti la jumla lisilomhusu mtu maalumu; “yeyote anayetaka” ni Kiswahili cha kawaida na huhifadhi maana ya nia.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Katika muktadha wa cheo ndani ya jumuiya, msemo huu unaonyesha nafasi kati ya wengine, si mahali tu.
- source_word: εἶναι πρῶτος
  choice: kuwa wa kwanza
  rationale: Hutafsiri moja kwa moja tamaa ya kuwa na nafasi au cheo cha juu zaidi.
- source_word: ἔσται
  choice: atakuwa
  rationale: Huhifadhi umbo la wakati ujao la Kigiriki huku muktadha ukibeba nguvu ya kanuni au wajibu bila kulibadili waziwazi kuwa “lazima awe.”
- source_word: ὑμῶν
  choice: wenu
  rationale: 'Hueleza uhusiano na kundi zima: mtu huyo atakuwa mtumwa wa wengine miongoni mwao.'
- source_word: δοῦλος
  choice: mtumwa
  rationale: Ni neno lenye nguvu kuliko διάκονος katika mstari uliotangulia; “mtumwa” huhifadhi uzito wa hali ya kuwa chini ya mamlaka na mkazo wa usemi wa Yesu.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika kauli kuhusu uanafunzi
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unapinganisha kutafuta cheo na kujishusha kabisa kwa ajili ya wengine. Kwa kuwa mstari uliotangulia umetumia neno tofauti la huduma, “mtumwa” huhifadhi ongezeko la nguvu katika usemi bila kulainisha mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Miongoni mwenu” ni ya kawaida katika sajili ya kibiblia bila kuwa ya kizamani; “mtumwa” inadumisha tofauti ya kileksika na mstari uliotangulia.
