  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: sw
  text: Ndipo mama wa wana wa Zebedayo akamjia pamoja na wanawe, akimsujudia[a] na kumwomba kitu fulani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akainama mbele yake,” “akimtolea heshima,” au “akamwabudu”; kitenzi cha Kigiriki kinaweza kumaanisha kusujudu kwa heshima, kumtolea heshima, au kuabudu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Kiunganishi cha wakati kinachoendeleza mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: προσῆλθεν αὐτῷ
  choice: akamjia
  rationale: Hueleza kusogea na kufika kwa mtu; umbo hili ni la asili katika masimulizi ya Kiswahili.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: mama yao wana wa Zebedayo
  rationale: Huhifadhi namna ya Kigiriki ya kumtambulisha mwanamke kwa uhusiano wake na wana wa Zebedayo, bila kuongeza jina lisilotajwa.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: pamoja na wanawe
  rationale: μετά pamoja na jenitivi huonyesha kuandamana; tafsiri hii ni sahihi na ya kawaida.
- source_word: προσκυνοῦσα
  choice: akamsujudia
  rationale: Kitenzi hiki kinaweza kueleza kuinama au kujitupa chini kwa heshima, kutoa heshima kuu, au kuabudu. 'Kusujudia' huhifadhi tendo la nje na uwezekano wa heshima ya kidini bila kuamua maana kuwa ibada pekee.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: na kumwomba jambo fulani
  rationale: αἰτέω ni kuomba au kutaka, τι ni kitu kisichobainishwa, na παρά humtaja yeye kama chanzo cha kile kinachoombwa.
theological_decisions:
- issue: Maana ya προσκυνοῦσα kuhusiana na Yesu
  choice: akamsujudia
  alternative: akainama mbele yake; akamwabudu
  rationale: Neno la Kigiriki linaweza kumaanisha tendo la kusujudu kwa heshima au kuabudu. Matini kuu inatumia neno lenye upana wa maana, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine bila kutatua kimyakimya mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi umetumia viambishi vya mfululizo (-ka-) kwa mtiririko wa kawaida. Jina 'Zebedayo' linafuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
