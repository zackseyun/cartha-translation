  source_fidelity: The draft correctly represents the temporal sequence, the mother’s approach with her sons, and the two participial actions. However, the phrase identifying her as the mother of Zebedee’s sons is grammatically malformed in Swahili and requires correction. The request is retained naturally as asking him for an unspecified thing.
  naturalness: The narrative flow and use of -ka- are natural Standard East African Swahili. “Mama yao wana wa Zebedayo” is not idiomatic or grammatically correct; “mama wa wana wa Zebedayo” is required. “Kitu fulani” is more natural than “jambo fulani” for the indefinite object of kumwomba in this context.
  terminology: “Zebedayo” is an established Swahili biblical form. “Akimsujudia” appropriately conveys the outward reverential act of προσκυνέω without deciding that it must mean worship. The footnote preserves the broader semantic range, including worship.
