  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: sw
  text: Ilipofika jioni, mwenye shamba la mizabibu akamwambia msimamizi wake, ‘Waita wafanyakazi, uwalipe ujira wao, ukianzia kwa wale wa mwisho hadi wale wa kwanza.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Ilipofika jioni
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi kuwasili kwa wakati wa jioni.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: mwenye shamba la mizabibu
  rationale: Katika muktadha huu κύριος humaanisha mwenye shamba, na ἀμπελών ni shamba la mizabibu.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: msimamizi wake
  rationale: ἐπίτροπος hapa ni mtu aliyepewa jukumu la kusimamia shughuli na malipo ya shamba.
- source_word: τοὺς ἐργάτας
  choice: wafanyakazi
  rationale: Neno hili la kawaida linawakilisha watu walioajiriwa kufanya kazi shambani.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: uwalipe ujira wao
  rationale: ἀποδίδωμι katika muktadha wa μισθός ni kutoa malipo yanayodaiwa; ‘ujira’ ni neno sahihi na lenye hadhi kwa malipo ya kazi.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: ukianzia na wale wa mwisho hadi wale wa kwanza
  rationale: Inadumisha mpangilio wa makundi na mvutano wa simulizi bila kufafanua zaidi ya chanzo.
theological_decisions:
- issue: Wakati wa kitenzi λέγει katika simulizi
  choice: akamwambia
  alternative: anasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, Kiswahili cha simulizi hutumia kwa kawaida ‘akamwambia’; maana ya tukio haibadilishwi wala fundisho la mfano halifasiriwi.
- issue: Utambulisho wa κύριος
  choice: mwenye shamba la mizabibu
  alternative: bwana wa shamba la mizabibu
  rationale: Muktadha wa moja kwa moja unaonyesha umiliki wa shamba. Tafsiri hii haigeuzi kimakusudi mhusika kuwa cheo cha kiungu wala kuzuia maana ya mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima, na inayoeleweka kwa urahisi. Muundo wa amri umehifadhiwa kwa kauli ya moja kwa moja, bila kuongeza maelezo yasiyokuwapo katika chanzo.
