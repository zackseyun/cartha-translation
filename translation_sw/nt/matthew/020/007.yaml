  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: sw
  text: Wakamwambia[a], “Kwa sababu hakuna mtu aliyetuajiri.” Akawaambia, “Ninyi pia nendeni katika shamba la mizabibu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kimetumia wakati wa sasa wa kihistoria katika vitenzi vyote viwili: “Wanamwambia ... Anawaambia.” Kiswahili kimetumia wakati uliopita ili masimulizi yatiririke kwa kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν ... λέγει
  choice: Wakamwambia ... Akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria katika vitenzi vyote viwili, masimulizi ya kawaida ya Kiswahili hutumia wakati uliopita kwa mfululizo wa matukio. Muundo huu unasomeka kwa ufasaha bila kubadili maana ya mazungumzo.
- source_word: Ὅτι
  choice: Kwa sababu
  rationale: Hapa ὅτι inaanzisha sababu inayojibu kwa nini bado wamesimama bila kazi; “Kwa sababu” huonyesha wazi nguvu hiyo ya ufafanuzi.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya ukanushi unaomhusu mtu yeyote.
- source_word: ἐμισθώσατο
  choice: aliyetuajiri
  rationale: Kitenzi kinamaanisha kuwaajiri watu wafanye kazi. Wakati wa kitenzi katika Kiswahili unaonyesha kitendo ambacho hakikufanywa hadi wakati wa mazungumzo.
- source_word: Ὑπάγετε
  choice: nendeni
  rationale: Amri ya wingi inawaagiza waende mahali pa kazi; “nendeni” ni ya kawaida, sahihi, na ya moja kwa moja.
- source_word: καὶ ὑμεῖς
  choice: Ninyi pia
  rationale: Kiwakilishi kilichotajwa wazi pamoja na καί kinakazia kwamba kundi hili nalo linajumuishwa pamoja na makundi yaliyotumwa kabla.
- source_word: ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa shamba linalolimwa mizabibu, na unaeleweka kwa wasomaji wa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Ninyi pia” imetumiwa kudumisha mkazo wa kiwakilishi cha Kigiriki, na alama ya tanbihi [a] imewekwa katika matini.
