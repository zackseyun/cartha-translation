  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: sw
  text: Wakamwambia, “Bwana[a], macho yetu yafumbuliwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Kauli ya sasa katika simulizi la Kigiriki imetafsiriwa kwa wakati wa masimulizi wa Kiswahili; kiambishi -m- kinawasilisha αὐτῷ kwa kawaida na kwa ufupi.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni mwito wa heshima unaoelekezwa kwa Yesu. “Bwana” huhifadhi uzito wa κύριος, huku tanbihi ikionyesha maana nyingine inayowezekana ya “Mheshimiwa.”
- source_word: ἵνα ἀνοιγῶσιν
  choice: yafumbuliwe
  rationale: Umbo la kutendwa na hali ya ombi vimehifadhiwa kwa kitenzi cha kutendwa chenye maana ya matamanio/ombi; macho ndiyo yanayopokea tendo.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: macho yetu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiwakilishi kimilikishi.
theological_decisions:
- issue: Maana ya κύριος katika mwito kwa Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi uwezekano wa kutambua mamlaka ya Yesu bila kulazimisha dai kamili zaidi kuliko muktadha unavyothibitisha; “Mheshimiwa” hubaki kuwa maana halali ya heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi fupi ya ombi imehifadhiwa bila kuongeza kitenzi kama “tunataka,” ambacho hakipo wazi katika Kigiriki.
