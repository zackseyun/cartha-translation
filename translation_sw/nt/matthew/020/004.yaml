  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: sw
  text: Akawaambia, ‘Ninyi pia nendeni katika shamba la mizabibu, nami nitawapa chochote kilicho cha haki.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chochote kinachostahili” au “chochote kilicho sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: akawaambia
  rationale: Kiambishi cha yambwa -wa- katika ‘akawaambia’ kinawakilisha kihusishi cha wingi ‘kwao’ kwa Kiswahili cha kawaida, bila kurudia nomino inayofahamika katika muktadha.
- source_word: εἶπεν
  choice: akawaambia
  rationale: Katika utangulizi wa usemi wa moja kwa moja, ‘akawaambia’ ni simulizi la kawaida na linaonyesha wazi kwamba aliwaelekea watu hao.
- source_word: Ὑπάγετε
  choice: nendeni
  rationale: Amri ya wingi inawakilishwa kwa kawaida na kwa usahihi na ‘nendeni.’
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: Kiwakilishi wazi ‘ninyi’ kinahifadhi msisitizo wa ὑμεῖς, huku ‘pia’ kikihifadhi maana ya kuwajumuisha pamoja na waliotangulia.
- source_word: ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Hii ni istilahi ya kawaida ya Kiswahili kwa eneo linalolimwa mizabibu.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: chochote kilicho cha haki
  rationale: Usemi huu unahifadhi upana wa kishazi cha Kigiriki na maana ya kimaadili ya δίκαιον bila kuibana iwe tu malipo yanayoonekana kuwa sawa.
- source_word: δώσω ὑμῖν
  choice: nitawapa
  rationale: ‘Nitawapa’ hufuata kitenzi cha jumla δίδωμι (‘kutoa/kupa’) badala ya kuingiza moja kwa moja kitenzi ‘kulipa,’ ingawa muktadha ni wa ujira.
theological_decisions:
- issue: Maana ya δίκαιον katika muktadha wa kuamua ujira
  choice: cha haki
  alternative: kinachostahili; kilicho sawa
  rationale: ‘Cha haki’ kinahifadhi wazo la jambo linalopatana na haki au uadilifu, bila kulifanya kuwa istilahi ya kisheria pekee wala kulipunguza kuwa hisia ya usawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ni wa kawaida, na ‘ninyi pia’ huhifadhi msisitizo wa maandishi asilia. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusu mbadala wa δίκαιον.
