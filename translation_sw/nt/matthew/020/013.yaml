  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: sw
  text: Lakini akamjibu mmoja wao, “Rafiki, sikutendei isivyo haki.[a] Je, hukukubaliana nami kwa dinari moja?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikudhulumii.”
    reason: lexical_alternative
  - marker: b
    text: Dinari ilikuwa sarafu ya fedha ya Waroma; kwa kawaida, dinari moja ilieleweka kuwa ujira wa siku moja wa mfanyakazi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: akamjibu
  rationale: Muundo huu unatoa jibu la mwenye shamba. Kiswahili cha kawaida hutumia kitenzi kimoja ‘akamjibu’ badala ya kurudia ‘akajibu, akasema,’ huku maana yote ya Kigiriki ikihifadhiwa.
- source_word: ἑνὶ αὐτῶν
  choice: mmoja wao
  rationale: Huhifadhi umoja wa anayezungumziwa na maana ya kwamba alikuwa mmoja katika kundi hilo.
- source_word: Ἑταῖρε
  choice: Rafiki
  rationale: Ni mwito wa kawaida na unaoeleweka; katika muktadha huu unaweza kuwa wa kujizuia au kuweka umbali, si lazima uonyeshe urafiki wa karibu.
- source_word: οὐκ ἀδικῶ σε
  choice: sikufanyii jambo lisilo la haki
  rationale: Hueleza wazi tendo la kutomtendea mtu isivyo haki na kudumisha nguvu ya wakati wa sasa; ‘sikudhulumu’ imetolewa kama mbadala mfupi katika tanbihi.
- source_word: οὐχὶ
  choice: Je, huku-
  rationale: Muundo wa swali hasi unatarajia jibu la kukubali, sawa na nguvu ya swali la Kigiriki.
- source_word: δηναρίου
  choice: kwa dinari moja
  rationale: Huhifadhi sarafu ya kihistoria na kuitafsiri kama bei au ujira waliokubaliana, bila kuibadili moja kwa moja kuwa ‘mshahara wa siku.’
- source_word: συνεφώνησάς μοι
  choice: hukukubaliana nami
  rationale: Ni usemi wa asili wa Kiswahili unaorejelea makubaliano yaliyofanywa wakati wa kuajiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imerahisisha muundo wa kishiriki wa Kigiriki kuwa ‘akamjibu’ ili isomeke kwa ufasaha bila kupoteza maana. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
