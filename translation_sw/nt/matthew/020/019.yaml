base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: sw
  text: Nao watamkabidhi kwa watu wasio Wayahudi ili wamdhihaki, wampige kwa mijeledi, na wamsulubishe; na siku ya tatu atafufuliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafufuka.” Kitenzi cha Kigiriki kiko katika kauli tendwa (“atafufuliwa”), usemi wa kawaida kuhusu ufufuo ambao unaweza kudokeza tendo la Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: watamkabidhi
  rationale: Kitenzi hiki kinaonyesha kumtia mtu mikononi au chini ya mamlaka ya wengine; “watamkabidhi” ni Kiswahili cha kawaida na hakiongezi wazo mahususi la usaliti.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa mataifa
  rationale: Katika muktadha huu wa mateso, neno hili linarejelea watu wasio Wayahudi, hasa mamlaka zao; “watu wa mataifa” ni wazi na huepuka maana ya mataifa kama nchi pekee.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: ili wamdhihaki
  rationale: Muundo huu unaonyesha kusudi au matokeo; “ili wamdhihaki” ni wa asili na huhifadhi nguvu ya kitenzi.
- source_word: μαστιγῶσαι
  choice: wampige mijeledi
  rationale: Hii inaeleza adhabu ya kumpiga mtu kwa mijeledi, kwa usahihi zaidi kuliko neno la jumla “wampige.”
- source_word: σταυρῶσαι
  choice: wamsulubishe
  rationale: Kitenzi hiki humaanisha kumuua kwa kumsulubisha; kiambishi cha yambwa kinaendeleza kwa uwazi yule anayefanyiwa vitendo vyote vitatu.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowakilisha kirai cha wakati kwa usahihi.
- source_word: ἐγερθήσεται
  choice: atafufuliwa
  rationale: Umbo la wakati ujao katika kauli tendwa linahifadhiwa na “atafufuliwa,” na katika muktadha wa ufufuo linaweza kudokeza tendo la Mungu bila kulitamka moja kwa moja.
theological_decisions:
- issue: Kauli ya kitenzi cha ufufuo
  choice: atafufuliwa
  alternative: atafufuka
  rationale: Kigiriki kina kauli tendwa ya wakati ujao. Tafsiri ya “atafufuliwa” huhifadhi umbo hilo na uwezekano wa kudokeza tendo la Mungu, bila kufuta mafundisho mengine kuhusu utendaji wa Kristo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Watu wa mataifa” kinaeleweka kwa wasomaji wa kawaida na kinafaa kwa muktadha wa Wayahudi na wasio Wayahudi; “kupiga mijeledi” ni wazi bila kuwa cha kizamani.
