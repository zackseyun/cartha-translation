  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: sw
  text: Hivyo[a] walio wa mwisho watakuwa wa kwanza, na walio wa kwanza watakuwa wa mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa njia hiyo.”
    reason: οὕτως linaweza kueleweka kama hitimisho (“hivyo”) au kama maelezo ya namna (“kwa njia hiyo”).
lexical_decisions:
- source_word: οὕτως
  choice: Hivyo
  rationale: Neno hili linaweza kuonyesha hitimisho au namna jambo linavyotokea. “Hivyo” ni la kawaida na fasaha, na linaunganisha msemo huu na mfano uliotangulia bila kulazimisha maana moja pekee.
- source_word: ἔσονται
  choice: watakuwa
  rationale: Hii ni tafsiri ya moja kwa moja ya wakati ujao wa εἰμί, na inasikika kwa kawaida katika Kiswahili.
- source_word: οἱ ἔσχατοι
  choice: walio wa mwisho
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino. “Walio wa mwisho” ni wazi na huhifadhi wazo la nafasi au mpangilio bila kuligeuza kuwa “walio duni.”
- source_word: πρῶτοι
  choice: wa kwanza
  rationale: Tafsiri hii huhifadhi ulinganifu mfupi na wa kimtindo kati ya “wa mwisho” na “wa kwanza.”
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki ni cha kuunganisha kwa kawaida; “na” hakiongezi maana ya upinzani ambayo haijawekwa wazi katika Kigiriki.
- source_word: οἱ πρῶτοι
  choice: walio wa kwanza
  rationale: Muundo huu unalingana na “walio wa mwisho” na kuhifadhi uwiano wa msemo wa kugeuzwa kwa nafasi.
- source_word: ἔσχατοι
  choice: wa mwisho
  rationale: Hukamilisha ugeuzaji wa msemo na kuhifadhi ulinganifu wa moja kwa moja na “wa kwanza.”
theological_decisions:
- issue: Maana mahususi ya kugeuzwa kwa walio wa mwisho na walio wa kwanza
  choice: Msemo umetafsiriwa kwa ufupi bila kubainisha kama unahusu wakati, hadhi ya kijamii, thawabu, au wokovu.
  alternative: Kuufafanua moja kwa moja kuwa ugeuzaji wa hadhi, thawabu za uanafunzi, au mpangilio wa wokovu.
  rationale: Kigiriki chenyewe hakibainishi upeo huo katika sentensi hii. Tafsiri inapaswa kuhifadhi mvutano na upana wa maana badala ya kuamua tafsiri ya kitheolojia kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa kurudiwa umehifadhiwa ili kuonyesha mkazo na uwiano wa msemo wa Kigiriki.
