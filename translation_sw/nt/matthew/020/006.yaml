  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: sw
  text: Karibu saa kumi na moja[a], akatoka na kuwakuta wengine wamesimama pale, naye anawaambia[b], “Kwa nini mmesimama hapa siku nzima bila kufanya kazi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu na saa ya kumi na moja ya siku kwa namna ya kuhesabu saa iliyotumiwa wakati huo.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “akawaambia.” Kigiriki kinatumia wakati wa sasa wa kihistoria: “anawaambia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Karibu saa kumi na moja
  rationale: περί pamoja na hali ya accusative huonyesha makadirio. Tafsiri hii inadumisha namna ya kuhesabu saa katika mfano bila kuibadili kimya kimya kuwa mfumo mwingine.
- source_word: ἐξελθὼν
  choice: akatoka
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia εὗρεν; mfululizo wa vitenzi vya masimulizi katika Kiswahili unaonyesha hatua hiyo kwa kawaida na kwa ufupi.
- source_word: εὗρεν ἄλλους
  choice: kuwakuta wengine
  rationale: εὗρεν hapa ni kuwakuta, na ἄλλους ni kivumishi kilichotumika kama nomino; ‘wengine’ hakiongezi jinsia ambayo haikutajwa wazi katika kirai hiki.
- source_word: ἑστῶτας
  choice: wamesimama pale
  rationale: Hali timilifu ya ἵστημι inaonyesha kwamba walikuwa katika hali ya kusimama; ‘wamesimama pale’ ni ya asili katika Kiswahili.
- source_word: καὶ λέγει αὐτοῖς
  choice: naye anawaambia
  rationale: λέγει ni wakati wa sasa wa kihistoria. ‘Anawaambia’ inadumisha uhai wa masimulizi ya Kigiriki.
- source_word: Τί ὧδε ἑστήκατε
  choice: Kwa nini mmesimama hapa
  rationale: Τί katika swali hili humaanisha ‘kwa nini’; umbo timilifu ἑστήκατε linaeleza hali iliyoendelea hadi wakati wa swali.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: siku nzima bila kufanya kazi
  rationale: ἀργοί humaanisha kutokuwa katika shughuli au kazi. ‘Bila kufanya kazi’ ni wazi na ya kawaida kuliko ‘wavivu,’ ambalo lingeweza kuongeza hukumu ya kitabia isiyolazimishwa na neno la Kigiriki.
