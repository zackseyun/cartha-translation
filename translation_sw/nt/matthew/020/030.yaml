reference: Matthew 20:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: sw
  text: Tazama, vipofu wawili waliokuwa wameketi kando ya barabara waliposikia kwamba Yesu alikuwa akipita, wakapaza sauti wakisema, “Bwana, utuhurumie, Mwana wa Daudi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi kazi ya neno hili ya kuvuta usikivu na kuupa usimulizi uhai, kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: δύο τυφλοὶ
  choice: vipofu wawili
  rationale: Nomino ya Kiswahili ‘vipofu’ pamoja na ‘wawili’ inawataja kwa kawaida watu wawili wasioona; muktadha unawatambulisha kuwa wanaume bila kulazimisha usemi mzito.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: waliokuwa wameketi kando ya barabara
  rationale: Inatoa hali na mahali pao kwa Kiswahili cha kawaida huku ikihifadhi uhusiano wa kishiriki na nomino iliyotangulia.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: waliposikia kwamba Yesu alikuwa akipita
  rationale: Kishiriki cha aoristi kimetafsiriwa kama tendo la wakati lililotangulia kupaza sauti; ‘alikuwa akipita’ linaonyesha tendo lililokuwa likiendelea wakati huo.
- source_word: ἔκραξαν
  choice: wakapaza sauti
  rationale: Usemi huu unahifadhi nguvu ya κράζω na unasikika wa kawaida na wenye hadhi katika Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida ya κύριος na hapa inafaa uzito wa heshima na wa Kimasihi unaoambatana na ‘Mwana wa Daudi.’
- source_word: ἐλέησον ἡμᾶς
  choice: utuhurumie
  rationale: Ni ombi la moja kwa moja na la kawaida la Kiswahili la kuonyeshwa huruma na kusaidiwa.
- source_word: υἱὸς Δαυίδ
  choice: Mwana wa Daudi
  rationale: Inahifadhi kwa karibu cheo cha Kimasihi na mwangwi wake wa kifalme badala ya kukifanya maelezo ya ukoo tu.
theological_decisions:
- issue: Maana ya κύριος katika kumwita Yesu moja kwa moja
  choice: Bwana
  alternative: Mheshimiwa
  rationale: Ikiunganishwa na ‘Mwana wa Daudi,’ ‘Bwana’ huhifadhi heshima na uwezekano wa uzito wa Kikristo bila kuamua zaidi ya maandishi.
- issue: Nguvu ya Kimasihi ya υἱὸς Δαυίδ
  choice: Mwana wa Daudi
  alternative: mzao wa Daudi
  rationale: Tafsiri ya cheo kama ‘Mwana wa Daudi’ huhifadhi matumizi yake maalumu katika Mathayo na maana ya kifalme ya Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa usomaji wa hadhara; ‘Tazama’ huhifadhi alama ya kuvuta usikivu bila kuongeza maelezo, na alama ya mshangao huakisi nguvu ya kilio chao.
