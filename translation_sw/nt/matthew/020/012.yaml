  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: sw
  text: wakisema, “Hawa wa mwisho walifanya kazi kwa saa moja, nawe umewafanya kuwa sawa nasi tuliobeba mzigo wa siku na kustahimili joto kali.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kirai kishirikishi cha wakati uliopo kinaendeleza mtiririko wa simulizi kutoka mstari uliotangulia; “wakisema” ni cha asili katika Kiswahili.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Hawa wa mwisho
  rationale: Kinawarejelea wafanyakazi walioajiriwa mwisho na kuhifadhi utofautishaji wa Kigiriki kwa ufupi.
- source_word: μίαν ὥραν ἐποίησαν
  choice: walifanya kazi kwa saa moja tu
  rationale: ποιέω pamoja na kipimo cha muda hapa humaanisha kufanya kazi kwa muda huo. “Tu” huonyesha kwa kawaida msisitizo wa malalamiko juu ya saa moja bila kubadili maana.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: umewafanya kuwa sawa nasi
  rationale: Huhifadhi moja kwa moja wazo la kuwafanya wawe sawa na wasemaji na nguvu ya malalamiko yao.
- source_word: τοῖς βαστάσασι
  choice: tuliobeba ... na kustahimili
  rationale: βαστάζω ina wigo wa kubeba na kuvumilia; muundo huu wa Kiswahili unaonyesha mzigo wa kazi pamoja na taabu ya joto bila kufanya tafsiri ya kiteolojia.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: mzigo wa siku nzima
  rationale: “Mzigo” huhifadhi taswira ya βάρος, na “siku nzima” huweka wazi kuwa malalamiko yanahusu kazi ya siku kamili.
- source_word: τὸν καύσωνα
  choice: joto kali
  rationale: καύσων humaanisha joto lenye kuchoma au kuumiza; “joto kali” ni usemi wa kawaida, wa heshima, na unaoeleweka katika Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Malalamiko ya mfano kuhusu usawa na haki
  choice: Kutoa malalamiko ya wafanyakazi moja kwa moja bila kuyafasiri kama kauli kuhusu haki au kutokuwa na haki kwa Mungu.
  alternative: Kutumia maneno yanayosema wazi kwamba mwenye shamba aliwatendea isivyo haki.
  rationale: Mstari unanukuu mtazamo wa wafanyakazi ndani ya mfano. Tafsiri inapaswa kuhifadhi nguvu na mvutano wa malalamiko yao bila kuamua mapema hoja pana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inadumisha sauti ya malalamiko ya wafanyakazi na mtiririko wa simulizi.
