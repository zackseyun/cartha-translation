id: MAT.20.1
reference: Matthew 20:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: sw
  text: Kwa maana ufalme wa mbinguni ni kama mtu mwenye nyumba, aliyetoka asubuhi na mapema kuajiri wafanyakazi kwa ajili ya shamba lake la mizabibu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Hii ni tafsiri ya kawaida na ya asili katika Kiswahili kwa usemi wa Mathayo unaomaanisha utawala wa mbinguni.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: mtu mwenye nyumba
  rationale: Inahifadhi neno ἀνθρώπῳ pamoja na jukumu la οἰκοδεσπότῃ bila kuongeza wazo lisilo katika chanzo; katika muktadha huu mwenye nyumba pia anasimamia shamba.
- source_word: ἅμα πρωῒ
  choice: asubuhi na mapema
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kutoka mapema wakati wa asubuhi.
- source_word: μισθώσασθαι ἐργάτας
  choice: kuajiri wafanyakazi
  rationale: Kitenzi kinaeleza kuwakodisha au kuwaajiri watu wafanye kazi kwa malipo; ‘kuajiri wafanyakazi’ ni wazi na cha sasa.
- source_word: ἀμπελῶνα
  choice: shamba la mizabibu
  rationale: Ni usemi unaoeleweka kwa urahisi kuliko neno la kiufundi pekee na unaonyesha kwamba ni eneo linalolimwa mizabibu.
theological_decisions:
- issue: Kulinganisha ufalme wa mbinguni
  choice: ufalme wa mbinguni ni kama mtu mwenye nyumba
  alternative: ufalme wa mbinguni ni kama shamba la mizabibu au utaratibu wa malipo
  rationale: Muundo wa Kigiriki unaunganisha ulinganisho moja kwa moja na ἀνθρώπῳ οἰκοδεσπότῃ; tafsiri haifafanui mapema kipengele cha mfano kinachowakilisha ufalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi ‘Kwa maana’ ili kuonyesha uhusiano wa γάρ na yaliyotangulia.
