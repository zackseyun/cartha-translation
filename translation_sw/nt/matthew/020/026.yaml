  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: sw
  text: Haitakuwa hivyo miongoni mwenu.[a] Badala yake, yeyote anayetaka kuwa mkuu miongoni mwenu atakuwa mtumishi wenu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sivyo ilivyo miongoni mwenu.” Kigiriki kinatumia kitenzi cha wakati ujao (“haitakuwa”), ambacho kinaweza kueleza jinsi mambo yasivyopaswa kuwa miongoni mwa wafuasi wa Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Lakini haitakuwa hivyo miongoni mwenu
  rationale: Wakati ujao wa ἔσται umehifadhiwa kwa ‘haitakuwa,’ ukibeba nguvu ya agizo kuhusu jinsi mambo yanavyopaswa kuwa katika jumuiya ya wafuasi wa Yesu. ‘Miongoni mwenu’ ni tafsiri ya kawaida ya ἐν ὑμῖν katika muktadha huu wa kijamii.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Badala yake, yeyote anayetaka
  rationale: ὃς ἂν pamoja na hali tegemezi huonyesha sharti lisilomhusu mtu mmoja maalumu; ‘yeyote’ hulifikisha kwa kawaida. θέλῃ ni nia au kutaka, hivyo ‘anayetaka’ ni wazi na ya sasa.
- source_word: μέγας γενέσθαι
  choice: kuwa mkuu
  rationale: Katika Kiswahili ‘kuwa mkuu’ kwa kawaida huweza kueleza kufikia hadhi ya ukuu katika muktadha huu; ‘kuwa mkubwa’ ingeweza kueleweka kama ukubwa wa mwili, na ‘kuja kuwa mkuu’ ingekuwa nzito isivyo lazima.
- source_word: διάκονος
  choice: mtumishi
  rationale: διάκονος humaanisha mtu anayehudumia wengine. ‘Mtumishi’ ni neno la kawaida na linalofaa hapa; ‘shemasi’ lingeingiza cheo cha baadaye cha kanisa, na ‘mhudumu’ lingeweza kusikika kama nafasi rasmi.
- source_word: ὑμῶν
  choice: wenu
  rationale: 'Kiwakilishi milikishi ‘wenu’ kinawasilisha kwa kawaida uhusiano unaoonyeshwa na hali ya umilikaji katika ὑμῶν: ‘mtumishi wenu.’'
theological_decisions:
- issue: Asili ya ukuu katika jumuiya ya wafuasi wa Yesu
  choice: Kauli imetafsiriwa kama ugeuzaji wa kimakusudi wa ngazi za mamlaka ya kidunia, huku lugha halisi ya utumishi ikihifadhiwa.
  alternative: Kutafsiri διάκονος kama cheo cha kanisa, ‘shemasi,’ au kuifanya kuwa wazo la jumla tu la unyenyekevu.
  rationale: Muktadha unatofautisha utawala wa wakuu wa mataifa na kiwango cha Yesu kwa wanafunzi wake. ‘Mtumishi’ huhifadhi utofauti huo bila kuingiza miundo ya baadaye ya kikanisa wala kufifisha picha ya kuhudumia wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Lakini’ mwanzoni huhifadhi uendelevu wa hoja kutoka mstari uliotangulia, huku ‘Badala yake’ ikiweka wazi utofauti wa ἀλλά ya pili bila kurudia ‘lakini’ kwa namna nzito.
