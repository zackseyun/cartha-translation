  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: sw
  text: Naye alipotoka yapata saa tatu[a], aliwaona wengine wamesimama sokoni bila kazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu saa 9:00 asubuhi katika mfumo wa saa 24. Usemi “saa tatu” hapa unafuata hesabu ya saa za mchana kuanzia macheo.
    reason: cultural_note
  - marker: b
    text: Au, “wakiwa hawafanyi kazi.” Kigiriki husema “bila kazi,” likieleza kwamba wakati huo hawakuwa wakifanya kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: alipotoka
  rationale: Kishiriki cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati kinachoonyesha kwamba kuona kulifuata kutoka kwake, kwa Kiswahili cha kawaida.
- source_word: περὶ τρίτην ὥραν
  choice: yapata saa tatu
  rationale: Huhifadhi namna ya kale ya kutaja wakati. Katika hesabu ya saa iliyoanzia macheo, saa tatu ni karibu saa tisa asubuhi kwa mfumo wa kimataifa; ‘yapata’ huonyesha ukadiriaji wa περὶ.
- source_word: εἶδεν
  choice: aliwaona
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kuona, huku kiambishi cha yambwa kikirejelea ‘wengine.’
- source_word: ἄλλους
  choice: wengine
  rationale: Kivumishi hiki kimetumiwa kama nomino; ‘wengine’ ni cha kawaida na hakiongezi jinsia ambayo Kigiriki hakuitaji hapa.
- source_word: ἑστῶτας
  choice: wamesimama
  rationale: 'Huwasilisha hali endelevu ya kishiriki timilifu: aliwakuta katika hali ya kusimama.'
- source_word: ἀγορᾷ
  choice: sokoni
  rationale: Hutaja eneo la soko au uwanja wa umma ambako watu, kutia ndani vibarua, wangekusanyika; ‘sokoni’ ni fupi na ya kawaida katika Kiswahili.
- source_word: ἀργούς
  choice: bila kazi
  rationale: Hueleza kwamba wakati huo hawakuwa wakifanya kazi, bila kuwapa lazima hadhi rasmi ya kisasa ya ‘wasio na ajira’ wala lawama ya uvivu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘yapata saa tatu’ una ladha inayofaa simulizi la Biblia na pia unaeleweka kwa wasomaji wa kawaida; tanbihi huzuia mkanganyiko kuhusu mfumo wa saa. ‘Bila kazi’ huepuka neno ‘wavivu,’ ambalo lingeongeza hukumu ya kimaadili isiyolazimishwa na muktadha.
