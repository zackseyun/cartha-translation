  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: sw
  text: Naye akamwambia, “Unataka nini?” Akamjibu, “Sema[a] kwamba hawa wanangu wawili wakae, mmoja kuliani kwako na mmoja kushotoni kwako, katika ufalme[b] wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki ni “sema.” Katika muktadha huu kinaweza pia kutafsiriwa “agiza,” lakini tafsiri hiyo huonyesha kwa uwazi zaidi mamlaka inayodokezwa na ombi.
    reason: lexical_alternative
  - marker: b
    text: Neno “ufalme” linaweza pia kumaanisha “utawala” au “mamlaka ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Unataka nini?
  rationale: Ni swali la moja kwa moja kuhusu ombi analotaka kutoa; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: Εἰπὲ
  choice: Agiza[a]
  rationale: Kitenzi chenyewe ni ‘sema,’ lakini katika muktadha huu mama anamwomba Yesu atoe tamko lenye mamlaka kuhusu viti vya wanawe. ‘Agiza’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kufasiri kuwa tayari amelikubali ombi.
- source_word: ἵνα καθίσωσιν
  choice: kwamba ... waketi
  rationale: Muundo huu unaonyesha jambo analoomba liamuliwe na unadumisha kitendo cha kuketi badala ya kukifanya kuwa hali tendwa.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: hawa wanangu wawili
  rationale: ‘Hawa’ huhifadhi kiwakilishi kionyeshi, na ‘wanangu wawili’ ni mpangilio wa kawaida wa Kiswahili unaoonyesha uhusiano wake binafsi nao.
- source_word: εἷς ἐκ δεξιῶν σου ... εἷς ἐξ εὐωνύμων σου
  choice: mmoja upande wako wa kulia na mwingine upande wako wa kushoto
  rationale: Huu ni usemi wazi na wa kawaida wa Kiswahili kwa nafasi mbili za heshima zilizo pande za Yesu; ‘mwingine’ huepuka urudiaji usio wa lazima huku ikihifadhi ulinganifu.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: katika ufalme[b] wako
  rationale: ‘Ufalme’ ni tafsiri ya kawaida inayoweza kujumuisha eneo la kifalme na utawala wa mfalme bila kuamua hapa awamu au hali ya ufalme huo.
theological_decisions:
- issue: Maana ya kuketi kulia na kushoto kwa Yesu katika ufalme wake
  choice: Imetafsiriwa kama ombi la nafasi za heshima katika ufalme wa Yesu bila kubainisha kama ufalme huo ni wa duniani au wa mbinguni.
  alternative: Kufafanua moja kwa moja kuwa ni ufalme wa Kimasihi duniani au ufalme wa mwisho mbinguni.
  rationale: Kigiriki hakibainishi mpangilio maalumu wa nyakati za mwisho; tafsiri inadumisha maana ya kifalme na mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo ni ya moja kwa moja na rahisi kueleweka; lugha ya kifalme imehifadhiwa bila kuingiza ufafanuzi wa dhehebu.
