base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: sw
  text: Basi wakaenda. Alipotoka tena karibu saa sita na saa tisa[a], alifanya vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, karibu saa sita mchana na saa tisa alasiri kwa hesabu ya Kiyahudi.
