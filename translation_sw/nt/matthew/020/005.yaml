lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Basi wakaenda
  rationale: Kiwakilishi cha wingi kinawarejelea wafanyakazi waliotajwa kabla; δέ ni kiunganishi chepesi cha simulizi, na ἀπῆλθον hapa ni ‘wakaenda.’
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa tendo kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἐξελθὼν
  choice: Alipotoka
  rationale: Muundo wa ‘alipotoka’ unaonyesha tendo linalotangulia tendo kuu kwa mtiririko wa kawaida wa simulizi bila kuongeza maelezo yasiyokuwamo.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: karibu saa sita na saa tisa
  rationale: ‘Karibu’ huwakilisha περὶ. Kutaja saa ya sita na ya tisa huhifadhi namna ya kuhesabu wakati katika mazingira ya chanzo; tanbihi inafafanua nyakati hizo. ‘Saa sita’ na ‘saa tisa’ hapa ni majina ya saa kwa hesabu ya Kiyahudi, si hesabu ya saa inayotumiwa kawaida Afrika Mashariki.
- source_word: ἐποίησεν ὡσαύτως
  choice: alifanya vivyo hivyo
  rationale: Usemi huu wa asili unamaanisha kwamba alitenda kwa namna ileile kama hapo awali; ‘alifanya vivyo hivyo’ ni wa asili, wazi, na mfupi katika Kiswahili.
