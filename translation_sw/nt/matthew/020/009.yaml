  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: sw
  text: Nao wale waliokuja yapata saa kumi na moja jioni wakapokea dinari moja kila mmoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari ilikuwa sarafu ya fedha ya Roma, ambayo kwa kawaida ilionwa kuwa ujira wa kawaida wa mfanyakazi kwa siku moja.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida bila kuongeza maana mpya ya wakati.
- source_word: ἐλθόντες
  choice: waliokuja
  rationale: Huwasilisha kitenzi-shirikishi cha wakati uliopita kwa Kiswahili cha kawaida huku kikilihusisha tendo hilo na kundi linalotajwa.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: wale waliokuja karibu saa kumi na moja
  rationale: Neno περὶ lenye maana ya wakati linadumishwa kwa “karibu,” na “waliokuja” huepuka kuongeza wazo la kuajiriwa ambalo linaeleweka kutokana na muktadha lakini halijasemwa hapa moja kwa moja. “Saa kumi na moja” hufuata mfumo wa saa wa maandishi ya kale, yaani karibu saa kumi na moja jioni kwa hesabu ya kawaida ya Kiswahili.
- source_word: ἔλαβον
  choice: wakapokea
  rationale: Katika muktadha wa kulipwa ujira, “kupokea” ni la kawaida na sahihi kuliko “kuchukua”; kiambishi “-ka-” kinaendeleza mfuatano wa simulizi.
- source_word: ἀνὰ
  choice: kila mmoja
  rationale: Hutoa wazi maana ya ugawaji kwamba kila mtu alipokea kiasi hicho.
- source_word: δηνάριον
  choice: dinari moja
  rationale: Huhifadhi jina la kihistoria la sarafu badala ya kulibadili kuwa thamani iliyokadiriwa; “moja” huonyesha kwa uwazi kiasi kilichogawiwa kwa kila mtu.
