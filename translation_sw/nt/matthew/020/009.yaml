  source_fidelity: Tafsiri inahifadhi kwa usahihi kiunganishi cha simulizi, kundi la wale waliokuja karibu na saa ya kumi na moja, kupokea, na mgawanyo wa dinari moja kwa kila mtu. Hata hivyo, katika Kiswahili Sanifu, “saa kumi na moja” bila kubainishwa inaweza kutatanisha; saa ya kumi na moja katika mpangilio wa simulizi hili ni takriban saa kumi na moja jioni (karibu 5:00 jioni).
  naturalness: Muundo ni wa kawaida na wenye kusomeka. “Yapata” ni namna ya asili ya kueleza περὶ katika matumizi ya wakati, na kuongeza “jioni” huondoa utata wa saa bila kufanya sentensi iwe nzito.
  terminology: “Dinari” ni istilahi sahihi ya kihistoria kwa δηνάριον, na tanbihi inaeleza sarafu hiyo kwa uangalifu bila kuibadilisha katika tafsiri kuwa ujira wa siku.
