  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: sw
  text: Yesu akawahurumia, akagusa macho yao, na mara moja wakapata kuona[a] na wakamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaona tena.” Kitenzi cha Kigiriki kinaweza kumaanisha kurudishiwa uwezo wa kuona au, kwa maana ya moja kwa moja zaidi, kutazama juu; katika muktadha huu kinahusu kupata uwezo wa kuona.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: akawahurumia
  rationale: Kitenzi hiki kinaonyesha huruma ya ndani na yenye nguvu. “Akawahurumia” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha hisia hiyo bila kuongeza maelezo yasiyokuwamo.
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno mahususi)
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa Kiswahili hauhitaji neno tofauti katika nafasi hii.
- source_word: ἥψατο
  choice: akagusa
  rationale: Katika muktadha huu wa uponyaji, neno hili linamaanisha kugusa kimwili.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: macho yao
  rationale: Hii ndiyo njia ya kawaida na ya wazi ya kuonyesha kiungo kilichoguswa katika Kiswahili.
- source_word: εὐθέως
  choice: mara moja
  rationale: Usemi huu unaonyesha kwamba matokeo yalitokea papo hapo, kwa lugha ya asili ya Kiswahili.
- source_word: ἀνέβλεψαν
  choice: wakapata kuona
  rationale: Katika muktadha wa kuponywa kwa vipofu, kitenzi hiki kinaeleza kupata au kurudishiwa uwezo wa kuona. Tafsiri hii ni wazi huku tanbihi ikihifadhi maana mbadala ya kileksia.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  rationale: Huhifadhi maana ya kwenda nyuma ya Yesu na mwangwi unaowezekana wa ufuasi bila kudai wazi kwamba walikuwa wanafunzi wake kwa maana kamili.
theological_decisions:
- issue: Aina ya matokeo ya uponyaji katika ἀνέβλεψαν
  choice: Walipata uwezo wa kuona mara moja
  alternative: Waliona tena au waliinua macho
  rationale: Muktadha wa muujiza pamoja na εὐθέως unaonyesha uponyaji halisi uliotokea papo hapo, lakini tanbihi inahifadhi upana wa maana ya kitenzi cha Kigiriki.
- issue: Maana ya ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  alternative: wakawa wanafunzi wake
  rationale: Aya inasema walimfuata Yesu, lakini haifafanui kina au muda wa ufuasi huo. Tafsiri haiongezi dai la kitheolojia lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa sentensi umehifadhi mwendo wa haraka wa simulizi bila kuwa mgumu au wa kizamani.
