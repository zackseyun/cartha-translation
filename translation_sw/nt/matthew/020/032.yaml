  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: sw
  text: Yesu akasimama[a], akawaita, akasema, “Mnataka niwafanyie nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasimama tuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: akasimama
  rationale: Katika muktadha huu, kitenzi hiki kinaonyesha kwamba Yesu alisitisha mwendo wake. “Akasimama” ni usemi wa kawaida wa Kiswahili unaoweza kuonyesha kusimama baada ya kuwa akienda.
- source_word: ἐφώνησεν
  choice: akawaita
  rationale: Kitenzi φωνέω hapa kinamaanisha kuwaita watu hao ili awaambie jambo. “Akawaita” ni kifupi, cha kawaida, na kinafaa muktadha.
- source_word: αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” katika “akawaita” kinawarejelea wale vipofu wawili waliotajwa katika muktadha wa karibu.
- source_word: Τί θέλετε
  choice: Mnataka ... nini?
  rationale: Muundo huu ni wa moja kwa moja na wa kawaida katika Kiswahili cha sasa, huku ukihifadhi swali la Yesu bila kulifanya liwe rasmi kupita kiasi.
- source_word: ποιήσω ὑμῖν
  choice: niwafanyie
  rationale: 'Hali tegemezi “niwafanyie” inawakilisha ποιήσω na kiambishi cha kutendea kinaonyesha maana ya dative ὑμῖν: kufanya jambo kwa faida yao.'
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa pamoja na jina la mtu.
theological_decisions:
- issue: Sauti na uzito wa swali la Yesu
  choice: “Mnataka niwafanyie nini?”
  alternative: “Mnataka niwatendee nini?”
  rationale: Tafsiri iliyochaguliwa inadumisha mwaliko wa moja kwa moja na wa huruma bila kuongeza wazo la kiteolojia lisilokuwamo katika Kigiriki. Muundo mbadala unawezekana, lakini “niwafanyie” ni wa kawaida zaidi katika mazungumzo ya sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vyenye “aka-” unahifadhi mwendo wa simulizi la Kigiriki kwa njia ya kawaida ya Kiswahili.
