id: MAT.20.28
reference: Matthew 20:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: sw
  text: Kama vile Mwana wa Adamu hakuja kutumikiwa, bali kutumikia na kutoa uhai wake kuwa fidia kwa ajili ya wengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “kuwa fidia badala ya wengi.”
    reason: Mbadala huu unaonyesha kwa uwazi zaidi maana ya ἀντί ya kuwa mahali pa au badala ya wengine.
lexical_decisions:
- source_word: ὥσπερ
  choice: Kama vile
  rationale: Huendeleza ulinganisho na mafundisho yaliyotangulia kwa Kiswahili cha kawaida na chenye nguvu ya kulinganisha.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya cheo hiki na huhifadhi mwangwi wake wa kibiblia, hasa uhusiano wake na Danieli.
- source_word: οὐκ ἦλθεν
  choice: hakuja
  rationale: Hutoa hali ya wakati uliopita ya aoristi kwa ufupi bila kuongeza mahali au hali ya tendo isiyokuwapo katika Kigiriki.
- source_word: διακονηθῆναι
  choice: kutumikiwa
  rationale: Huhifadhi kauli ya kutendwa na kuunda utofautishaji wa moja kwa moja na ‘kutumikia’.
- source_word: ἀλλὰ διακονῆσαι
  choice: bali kutumikia
  rationale: ‘Bali’ huonyesha tofauti iliyo wazi, na ‘kutumikia’ ni lugha ya kawaida isiyofungiwa kwenye huduma ya kikanisa.
- source_word: καὶ δοῦναι
  choice: na kutoa
  rationale: Huhifadhi uratibu wa vitenzi na maana ya kawaida ya kutoa bila kuongeza ufafanuzi wa kiteolojia.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: uhai wake
  rationale: Katika muktadha huu ψυχή ni uhai unaotolewa hadi kufa, si nafsi isiyo ya mwili pekee.
- source_word: λύτρον
  choice: fidia
  rationale: ‘Fidia’ ni neno la kawaida la Kiswahili kwa malipo yanayoleta kuachiliwa, na huhifadhi maana ya ukombozi.
- source_word: ἀντὶ πολλῶν
  choice: kwa ajili ya wengi
  rationale: Ni usemi wa asili katika Kiswahili; tanbihi huhifadhi kwa uwazi zaidi wazo la ἀντί la kuchukua nafasi.
theological_decisions:
- issue: Nguvu ya ἀντί katika kauli kuhusu fidia
  choice: kwa ajili ya wengi
  alternative: badala ya wengi
  rationale: Matini kuu inatumia Kiswahili cha kawaida bila kukataa maana ya uwakilishi au ubadala; tanbihi inaonyesha wazi zaidi uwezekano wa maana ya kubadilishana au kuchukua nafasi uliomo katika ἀντί.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaweka ulinganifu wa ‘kutumikiwa/kutumikia’ na huepuka lugha nzito ya kikanisa. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
