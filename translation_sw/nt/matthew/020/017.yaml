  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: sw
  text: Yesu alipokuwa akipanda kwenda Yerusalemu, aliwachukua wale wanafunzi kumi na wawili kando, na njiani akawaambia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: alipokuwa akipanda kwenda
  rationale: Huonyesha tendo lililokuwa likiendelea wakati Yesu aliwachukua wanafunzi. ‘Kupanda kwenda’ huhifadhi wazo la kuelekea juu kwenda Yerusalemu na ni lugha ya kawaida ya Kiswahili.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Baada ya ‘kwenda,’ jina la mahali linaonyesha wazi mahali walipoelekea bila kuhitaji kihusishi kingine.
- source_word: παρέλαβεν
  choice: aliwachukua
  rationale: Huwakilisha maana ya kuchukua watu pamoja naye; wazo la kuwatenga na wengine linaonyeshwa na ‘kando.’
- source_word: τοὺς δώδεκα μαθητὰς
  choice: wale wanafunzi kumi na wawili
  rationale: Huhifadhi neno μαθητάς na idadi ya kundi maalumu. ‘Wale’ hulitambulisha kundi linalojulikana katika simulizi.
- source_word: κατ’ ἰδίαν
  choice: kando
  rationale: Hueleza kwamba Yesu aliwatenga na wengine ili kusema nao faraghani, kwa lugha fupi na ya kawaida.
- source_word: ἐν τῇ ὁδῷ
  choice: Walipokuwa njiani
  rationale: Huhifadhi mazingira ya safari na huunganisha kwa kawaida kauli inayofuata katika Kiswahili.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni tafsiri ya kawaida ya kusema kwa watu fulani na huandaa kwa maudhui yanayofuata katika mstari unaofuata.
