id: MAT.13.35
reference: Matthew 13:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: sw
  text: 'ili litimie neno lililonenwa kwa njia ya nabii aliyesema:


    “Nitafungua kinywa changu kwa mifano;

    nitatamka mambo yaliyofichwa tangu kuwekwa msingi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinaongeza “wa ulimwengu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ili litimie
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kusudi au matokeo na kuhifadhi kauli ya Mathayo kuhusu kutimia kwa Maandiko.
- source_word: τὸ ῥηθὲν
  choice: neno lililonenwa
  rationale: Huwasilisha kisahili kirai nomino cha Kigiriki kwa lugha ya heshima na inayoeleweka, bila kuongeza maelezo yasiyokuwamo.
- source_word: διὰ τοῦ προφήτου λέγοντος
  choice: kwa njia ya nabii aliyesema
  rationale: ‘Kwa njia ya’ huhifadhi wazo la nabii kuwa chombo cha ujumbe, na ‘aliyesema’ humtambulisha nabii kama msemaji wa nukuu.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Nitafungua kinywa changu kwa mifano
  rationale: Huhifadhi taswira ya kishairi ya kufungua kinywa na istilahi ya Mathayo ya ‘mifano’; ‘kwa mifano’ ni Kiswahili cha asili kuliko tafsiri ya kimofimu ‘katika mifano.’
- source_word: ἐρεύξομαι
  choice: nitatamka
  rationale: Kitenzi hiki huonyesha kutoa au kunena jambo kwa sauti. ‘Nitatamka’ ni cha heshima na cha sasa bila kuwa cha kizamani.
- source_word: κεκρυμμένα
  choice: mambo yaliyofichwa
  rationale: Huhifadhi hali ya kutendwa na matokeo yanayoendelea ya participio ya wakati timilifu, badala ya kuitafsiri kwa ufafanuzi zaidi kama ‘siri.’
- source_word: ἀπὸ καταβολῆς
  choice: tangu kuwekwa msingi
  rationale: Hufuata matini iliyotolewa, ambayo haina nomino dhahiri ‘ulimwengu,’ na kuhifadhi taswira ya kuwekwa kwa msingi pamoja na kutokamilishwa kwake kimakusudi katika ushahidi huu wa matini.
theological_decisions:
- issue: Utambulisho wa nabii katika fomula ya nukuu
  choice: nabii
  alternative: Asafu nabii
  rationale: Matini ya SBLGNT inasema tu ‘nabii.’ Tafsiri haiongezi jina la mwandishi wa Zaburi 78 wala kuoanisha nukuu na mapokeo mengine.
- issue: Upeo wa kirai ἀπὸ καταβολῆς
  choice: tangu kuwekwa msingi
  alternative: tangu kuwekwa msingi wa ulimwengu
  rationale: Matini kuu iliyotolewa haina κόσμου (‘wa ulimwengu’). Kutotaja msingi wa nini kunaacha wazi kwa kiwango kilekile ambacho Kigiriki kinaacha wazi, huku usomaji mpana zaidi ukiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa nukuu ya kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unahifadhi umbo la kishairi la nukuu.
