translation:
  language: sw
  text: Mbegu nyingine zilianguka katikati ya miiba[a]; miiba ikamea, ikazisonga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kihalisi: “juu ya miiba”; hapa imetafsiriwa “katikati ya miiba” kulingana na mazingira ya kilimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Mbegu nyingine
  rationale: Kivumishi cha wingi cha jinsi isiyo na uhai kimetumiwa kama nomino na kinarejelea mbegu zilizotajwa katika muktadha; kutaja “mbegu” huweka maana wazi kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: ;
  rationale: δέ hapa ni kiunganishi hafifu kinachoendeleza simulizi. Alama ya nusu koloni inaunganisha hatua hizi kwa njia ya asili bila kuleta utofautishaji mkali.
- source_word: ἔπεσεν
  choice: zilianguka
  rationale: Kitenzi πίπτω kinamaanisha moja kwa moja “kuanguka”; hakijatafsiriwa kuwa “zilipandwa,” kwa kuwa hilo lingebadili kitenzi cha Kigiriki.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: katikati ya miiba[a]
  rationale: Ingawa ἐπί pamoja na hali ya kuelekea inaweza kuwa “juu ya,” katika mazingira ya upandaji usemi wa asili ni mbegu kuanguka katikati ya mimea yenye miiba.
- source_word: ἀκάνθας / ἄκανθαι
  choice: miiba
  rationale: “Miiba” ni neno la kawaida na lenye hadhi linaloweza kurejelea mimea yenye miiba katika mfano huu.
- source_word: ἀνέβησαν
  choice: ikamea
  rationale: Katika muktadha wa mimea, ἀναβαίνω inaeleza kuchipuka au kuinuka kwa mimea; “ikamea” ni Kiswahili cha asili kinachohifadhi picha ya ukuaji.
- source_word: ἔπνιξαν
  choice: kuzisonga
  rationale: πνίγω humaanisha kusonga au kunyonga. “Kuzisonga” huhifadhi sitiari yenye nguvu ya miiba kuzuia ukuaji wa mbegu.
- source_word: αὐτά
  choice: -zi-
  rationale: Kiambishi cha yambwa cha wingi “-zi-” katika “kuzisonga” kinarejelea mbegu bila kuzirudia kwa jina, kama kiwakilishi cha Kigiriki.
