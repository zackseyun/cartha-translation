id: MAT.13.48
reference: Matthew 13:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: sw
  text: Lilipojaa, walilivuta hadi ufuoni, wakaketi, wakakusanya samaki wazuri katika vyombo[a], lakini wale waliooza[b] wakawatupa nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyombo vya kuhifadhia.” Neno la Kigiriki ni la jumla kwa vyombo, wala halimaanishi vikapu tu.
    reason: lexical_alternative
  - marker: b
    text: Au “walioharibika” au “wasiofaa.” Neno la Kigiriki linaweza kumaanisha waliooza, walioharibika, au kwa ujumla wasio na faida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Lilipojaa
  rationale: Kiwakilishi cha ngeli ya LI-YA kinarejelea wavu uliotajwa katika mstari uliotangulia. Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba wavu ulijaa.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: walilivuta hadi ufuoni
  rationale: Kitenzi kinaonyesha kuutoa wavu majini na kuufikisha nchi kavu; “hadi ufuoni” hakulazimishi ufuo kuwa wa mchanga.
- source_word: καθίσαντες
  choice: wakaketi
  rationale: Muundo wa “waka-” unaonyesha hatua iliyofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: συνέλεξαν τὰ καλά
  choice: wakakusanya samaki wazuri
  rationale: Neno “samaki” linaeleweka kutokana na mazingira na limetajwa wazi kwa uwazi wa Kiswahili; τὰ καλά inaeleza wale walio wazuri au wanaofaa.
- source_word: εἰς ἄγγη
  choice: katika vyombo[a]
  rationale: ἄγγη ni neno la jumla kwa vyombo vya kuhifadhia; “vyombo” huepuka kulitaja kwa usahihi usiohakikishwa kama vikapu.
- source_word: τὰ δὲ σαπρά
  choice: lakini wale waliooza[b]
  rationale: σαπρά inaweza kumaanisha waliooza, walioharibika, au wasiofaa. “Waliooza” inadumisha picha halisi na nguvu ya tathmini ya neno.
- source_word: ἔξω ἔβαλον
  choice: wakawatupa nje
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaodumisha nguvu ya kitendo cha kuwatenga na kuwatupa.
theological_decisions:
- issue: Maana ya upangaji wa samaki katika mfano
  choice: Mstari umetafsiriwa kama tukio halisi la uvuvi bila kuingiza mapema maana ya hukumu ya mwisho.
  alternative: Kutumia maneno ya kiufafanuzi yanayotanguliza maelezo ya mfano yaliyo katika mistari inayofuata.
  rationale: Mstari huu wenyewe unasimulia picha ya mfano; maelezo yake ya kitheolojia yanafuata baadaye. Kutodokeza maelezo hayo hapa kunadumisha mpangilio na mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; simulizi ni la kawaida, la sasa, na lenye hadhi. Mfululizo wa vitenzi vya “waka-” unadumisha mwendo wa matendo, huku istilahi pana “vyombo” ikihifadhi kutobainishwa kwa aina ya chombo katika Kigiriki.
