id: MAT.13.12
reference: Matthew 13:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: sw
  text: Kwa maana yeyote aliye nacho[a] atapewa, naye atakuwa na tele[b]; lakini yeyote asiye nacho, hata kile alicho nacho kitachukuliwa kutoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji kile ambacho mtu huyo anacho; maana yake imeachwa wazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “naye atazidishiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: yeyote
  rationale: Kiwakilishi hiki cha uhusiano kisicho bainifu kinaweka kanuni ya jumla. “Yeyote” ni Kiswahili cha kawaida na huhifadhi maana ya kila mtu mmoja mmoja.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huunganisha kauli hii na yaliyotangulia kwa kutoa maelezo au sababu.
- source_word: ἔχει / οὐκ ἔχει
  choice: aliye na kitu / asiye na kitu
  rationale: Kigiriki kinaacha kitu kinachomilikiwa bila kutajwa. Kiswahili cha kawaida huhitaji kijalizo hapa; “kitu” kimetumiwa kwa maana isiyo bainifu bila kukifasiri kuwa ufahamu, imani, au maarifa pekee.
- source_word: δοθήσεται αὐτῷ
  choice: atapewa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na yule anayepokea, bila kuongeza neno “zaidi,” ambalo halipo wazi katika Kigiriki.
- source_word: περισσευθήσεται
  choice: atazidishiwa
  rationale: Huwasilisha hali ya kutendwa na wazo la kuongezewa kwa wingi. Pia ni tamko fupi na la kawaida katika Kiswahili.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha wazi ulinganisho wenye kupingana kati ya mwenye kitu na asiye na kitu.
- source_word: καὶ ὃ ἔχει
  choice: hata kile alicho nacho
  rationale: Hapa καί ina nguvu ya kusisitiza jambo la kushangaza; “hata” huiwasilisha vizuri.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: kitachukuliwa kutoka kwake
  rationale: Huhifadhi hali ya kutendwa na wazo la kuondolewa kwa kitu kutoka kwa mtu huyo.
theological_decisions:
- issue: Kitu kinachomaanishwa na ‘kuwa na’
  choice: Kimeachwa bila kufafanuliwa, kwa kutumia neno la jumla “kitu.”
  alternative: Kukitaja kuwa ufahamu, usikivu, imani, au ujuzi wa siri za ufalme.
  rationale: Muktadha unahusu jinsi watu wanavyopokea mafundisho ya Yesu na siri za ufalme, lakini Kigiriki hakitaji kijalizo. Tafsiri haipaswi kufunga maana katika ufafanuzi mmoja.
- issue: Umoja wa kiume wenye maana ya jumla
  choice: Imetafsiriwa kwa “yeyote” na “kwake,” ambazo katika Kiswahili zinaweza kumhusu mtu wa jinsia yoyote.
  alternative: Kutumia wingi ili kuepuka umoja wa kiume wa Kigiriki.
  rationale: Kiswahili hakilazimishi kuonyesha jinsia katika maneno haya. Umoja na maana ya uwakilishi wa Kigiriki vimehifadhiwa bila kuingiza jinsia isiyohitajika.
- issue: Maana ya περισσευθήσεται
  choice: atazidishiwa
  alternative: atakuwa na tele
  rationale: Umbo la Kigiriki ni la kutendwa na linaweza kueleza kuongezewa au kufanywa kuwa na wingi. “Atazidishiwa” huhifadhi kwa karibu zaidi umbo hilo, huku tanbihi ikionyesha namna nyingine ya kueleza matokeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Sentensi imehifadhi muundo wa kimethali na ulinganisho wa vifungu viwili. Neno “kitu” linatimiza hitaji la kawaida la kisarufi na kimatamshi la Kiswahili, huku tanbihi ikieleza kwamba halipo wazi katika Kigiriki.
