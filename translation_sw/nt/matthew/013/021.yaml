base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: sw
  text: Lakini hana mzizi ndani yake, bali hudumu kwa muda tu. Dhiki au mateso yanapotokea kwa sababu ya neno, mara moja hujikwaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukwaa,” “hukwazika,” au “huanguka.” Kitenzi cha Kigiriki kinaweza kumaanisha kujikwaa, kukwazika, au kuanguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: mzizi
  rationale: Inahifadhi sitiari ya kilimo iliyo msingi wa mfano huu.
- source_word: ἐν ἑαυτῷ
  choice: ndani yake
  rationale: Inawasilisha maana ya ndani ya mtu bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: πρόσκαιρός
  choice: hudumu kwa muda tu
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwamba hali yake ni ya muda mfupi; tafsiri ya moja kwa moja kama 'ni wa muda' ingekuwa kavu na isiyo ya kawaida hapa.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: Dhiki au mateso yanapotokea
  rationale: Muundo wa Kigiriki unaonyesha wakati ambapo dhiki au mateso yanatokea; sentensi hii ni wazi na ya asili kwa Kiswahili.
- source_word: θλίψεως
  choice: dhiki
  rationale: Neno hili linaonyesha shinikizo, taabu, au hali ngumu kwa uzito unaofaa muktadha.
- source_word: διωγμοῦ
  choice: mateso
  rationale: Ni neno la kawaida la kibiblia na la sasa kwa uadui unaomkumba mtu kwa sababu ya kushikamana na ujumbe.
- source_word: διὰ τὸν λόγον
  choice: kwa sababu ya neno
  rationale: Inahifadhi kiungo cha kileksia cha λόγος na 'neno' lililotajwa katika mfano, bila kulifafanua kupita kiasi kuwa fundisho au imani.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Inaonyesha upesi unaosisitizwa katika simulizi.
- source_word: σκανδαλίζεται
  choice: huanguka
  rationale: Katika muktadha, inaeleza kushindwa kudumu wakati wa shinikizo. 'Huanguka' ni ya kueleweka na haifungi maana kwenye kukasirika tu; maana nyingine za sitiari zimewekwa katika tanbihi.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha wazi utofauti na kupokea neno kwa furaha kunakotajwa katika mstari uliotangulia.
theological_decisions:
- issue: Maana ya σκανδαλίζεται katika muktadha wa ufuasi
  choice: huanguka
  alternative: hujikwaa; hukwazika
  rationale: Muktadha unaonyesha mtu asiyedumu chini ya dhiki, lakini kitenzi cha Kigiriki kina upana wa maana. Tafsiri kuu inaonyesha matokeo bila kuingiza mfumo maalumu wa mafundisho kuhusu kuasi, na tanbihi inadumisha utata wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa kwa mtiririko wa kawaida, huku uhusiano wa kimantiki ukihifadhiwa. 'Neno' limedumishwa kama istilahi ya mfano, na 'hudumu kwa muda tu' huepuka usemi mgumu wa moja kwa moja.
