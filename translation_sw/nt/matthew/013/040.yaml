  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: sw
  text: Kwa hiyo, kama vile magugu[a] yanavyokusanywa na kuchomwa kwa moto, ndivyo itakavyokuwa mwishoni mwa enzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha magugu yenye madhara, huenda aina ya magugu yanayofanana na ngano (darnel).
    reason: lexical_alternative
  - marker: b
    text: Au, “mwisho wa ulimwengu”; kwa Kigiriki, “mwisho wa enzi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Kwa hiyo, kama vile
  rationale: ‘Kwa hiyo’ huhifadhi uhusiano wa kimantiki unaoonyeshwa na οὖν, na ‘kama vile’ huanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: συλλέγεται
  choice: yanavyokusanywa
  rationale: Kauli ya kutendwa inahifadhiwa, na muundo wa ‘kama vile ... yanavyo-’ unaunganisha kwa ufasaha sehemu ya kwanza ya ulinganisho.
- source_word: τὰ ζιζάνια
  choice: magugu
  rationale: ‘Magugu’ ni neno la sasa na linaloeleweka kwa mimea yenye madhara; neno la Kigiriki huenda linamaanisha aina iitwayo darnel, lakini kulibainisha hivyo katika mstari kungekuwa mahususi kupita ushahidi wa kifungu.
- source_word: πυρὶ καίεται
  choice: na kuchomwa kwa moto
  rationale: ‘Kuchomwa’ huonyesha maana rahisi ya καίεται, na ‘kwa moto’ huhifadhi wazi πῦρ pamoja na hali yake ya kifaa.
- source_word: οὕτως ἔσται
  choice: ndivyo itakavyokuwa
  rationale: Huu ni usemi wa asili wa Kiswahili unaokamilisha ulinganisho na kuhifadhi hali ya wakati ujao.
- source_word: ἐν τῇ συντελείᾳ
  choice: wakati wa mwisho
  rationale: Muundo huu unaeleweka kwa urahisi na huwasilisha kilele au ukomo unaomaanishwa na συντέλεια bila kutumia istilahi nzito.
- source_word: τοῦ αἰῶνος
  choice: wa enzi
  rationale: ‘Enzi’ huhifadhi maana ya kipindi cha wakati ya αἰών na huepuka kuifanya iwe ‘ulimwengu,’ ambayo inaweza kueleweka kama anga au dunia yenyewe.
theological_decisions:
- issue: Usemi wa kieskatolojia τοῦ αἰῶνος
  choice: wa enzi
  alternative: wa ulimwengu
  rationale: ‘Enzi’ huhifadhi maana ya wakati na ukomo wa kipindi bila kuamua kwamba kinachokusudiwa hasa ni kuangamizwa kwa ulimwengu wa kimaumbile au kuingiza mpangilio fulani wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘kama vile ... ndivyo’ huhifadhi ulinganisho wa Kigiriki kwa ufasaha; alama zote za tanbihi zimewekwa katika matini.
