  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: sw
  text: Siku ile[a] Yesu alitoka katika nyumba, akaketi kando ya bahari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siku hiyo hiyo,” ikiwa maneno haya yanaeleweka kusisitiza kuendelea kwa matukio ya muktadha uliotangulia, badala ya kutaja wakati tu.
    reason: alternative_reading
  - marker: b
    text: Au, “karibu na bahari.” Usemi wa Kigiriki unaonyesha mahali palipo karibu na bahari bila kutaja umbali kamili kutoka ufukoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Siku ile
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili, unaorejelea siku iliyotajwa katika muktadha bila kuongeza wazi wazo la “hiyo hiyo,” ambalo halijaandikwa moja kwa moja katika Kigiriki.
- source_word: ἐξελθὼν
  choice: alitoka
  rationale: Kirai shiriki cha wakati uliopita kinaonyesha kitendo kilichotangulia tendo kuu. Kitenzi kamili “alitoka” ni cha asili katika Kiswahili na, pamoja na “akaketi,” huhifadhi mfuatano wa matendo.
- source_word: τῆς οἰκίας
  choice: nyumbani
  rationale: Pamoja na kitenzi cha kutoka, umbo la Kigiriki linataja mahali Yesu alipotoka. “Alitoka nyumbani” ni Kiswahili cha kawaida; hapa “nyumbani” humaanisha ndani ya nyumba iliyopo katika muktadha, bila kulazimisha tofauti kati ya ‘nyumba’ na ‘makao.’
- source_word: ἐκάθητο
  choice: akaketi
  rationale: Kitenzi hiki kinaonyesha Yesu akiwa ameketi katika mandhari inayofuata. “Akaketi” ni simulizi la asili la Kiswahili linalounganisha kitendo hiki na kutoka kwake, bila kutumia muundo mzito wa “alikuwa akiketi.”
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya bahari
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha mahali karibu na bahari. “Kando ya bahari” huhifadhi ukaribu huo bila kudai kwamba Yesu alikuwa moja kwa moja kwenye ufuo.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina la mtu limetoholewa kwa umbo lake la kawaida katika Kiswahili.
