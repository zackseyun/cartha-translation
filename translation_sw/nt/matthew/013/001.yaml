translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Muundo wa masimulizi “alitoka … akaketi” ni wa kawaida na unaeleweka kwa urahisi. Neno “bahari” limehifadhiwa badala ya kufafanua kimuktadha kuwa ziwa, ili kutafsiri θάλασσα bila kuliondolea upana wake wa kileksika.
