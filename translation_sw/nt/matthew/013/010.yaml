base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: sw
  text: Kisha wanafunzi wakamkaribia na kumwambia[a], “Kwa nini unasema nao kwa mifano?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamwendea na kumwambia”; neno la Kigiriki linasisitiza kwamba wanafunzi walimkaribia Yesu kabla ya kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Katika muktadha huu kiunganishi kinaendeleza simulizi; “Kisha” ni mtiririko wa kawaida wa Kiswahili bila kuongeza maana mpya.
- source_word: προσελθόντες
  choice: wakamkaribia
  rationale: Kitenzi hiki kinaonyesha kwamba wanafunzi walimwendea Yesu na kufika karibu naye kabla ya kusema.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Nomino yenye kibainishi inarejelea kundi linalojulikana katika muktadha; Kiswahili hakihitaji kuongeza “wake,” ambalo halijaandikwa wazi katika Kigiriki.
- source_word: εἶπαν αὐτῷ
  choice: kumwambia
  rationale: Huhifadhi maana ya msingi ya kusema kwa mtu, ingawa maneno yanayofuata yana umbo la swali.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Kihusishi kinaonyesha namna au njia ya kusema. “Kwa mifano” ni usemi wa kawaida wa kibiblia na wa Kiswahili kwa mafundisho ya kimfano.
- source_word: λαλεῖς
  choice: unasema
  rationale: Wakati uliopo na nafsi ya pili umoja vinawakilishwa kwa kawaida na kwa uwazi.
- source_word: αὐτοῖς
  choice: nao
  rationale: Katika Kiswahili, “kusema nao” hutaja kwa kawaida watu wanaoelekezewa maneno; “wao” ni kundi la wasikilizaji katika muktadha.
