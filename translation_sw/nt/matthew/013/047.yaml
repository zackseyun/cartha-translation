base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: sw
  text: Tena, ufalme wa mbinguni ni kama juya[a] lililotupwa baharini, likakusanya samaki wa kila aina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wavu”; neno la Kigiriki linamaanisha hasa wavu mkubwa wa kuvulia unaovutwa majini.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu, “na ambalo lilikusanya kutoka kila aina”; yambwa haikutajwa katika Kigiriki. Neno “samaki” limedokezwa na picha ya uvuvi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Tena
  rationale: Inaonyesha kwamba Yesu anatoa mfano mwingine katika mfululizo; ni fupi na ya kawaida katika Kiswahili.
- source_word: ὁμοία ἐστὶν
  choice: ni kama
  rationale: Ni njia ya kawaida na ya asili ya kuwasilisha ulinganisho katika Kiswahili.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Inahifadhi msemo maalumu wa Mathayo bila kuubadili kuwa ‘ufalme wa Mungu’ au kuufasiri zaidi.
- source_word: σαγήνῃ
  choice: juya
  rationale: Juya ni wavu mkubwa wa kuvulia unaovutwa majini, hivyo linaonyesha aina maalumu ya wavu inayomaanishwa na neno la Kigiriki.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: lililotupwa baharini
  rationale: Inawasilisha kauli tendwa ya kirai cha Kigiriki na kuhifadhi neno ‘bahari’ badala ya kulibadili kuwa ‘ziwa.’
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: na kukusanya samaki wa kila aina
  rationale: ‘Samaki’ limetajwa kwa ajili ya Kiswahili cha asili na wazi, ingawa kitu kinachokusanywa hakikutajwa moja kwa moja katika Kigiriki; picha ya uvuvi inakidokeza wazi.
theological_decisions:
- issue: Maana ya ‘ufalme wa mbinguni’
  choice: Kuhifadhi msemo wa Mathayo ‘ufalme wa mbinguni.’
  alternative: ufalme wa Mungu; utawala wa mbinguni
  rationale: Tafsiri haibadili usemi wa chanzo wala kuamua mapema ikiwa ‘ufalme’ hapa unasisitiza eneo au utawala.
- issue: Kitu kinachokusanywa na juya
  choice: Kutaja ‘samaki’ katika matini huku kuweka tanbihi kwamba neno hilo limedokezwa.
  alternative: na kukusanya vya kila aina
  rationale: Kigiriki kinaacha yambwa bila kutajwa, lakini Kiswahili hicho mbadala kingekuwa kisicho cha kawaida na kisicho wazi; ‘samaki’ hutokana moja kwa moja na picha ya uvuvi bila kuongeza fundisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Juya’ ni neno sahihi la uvuvi lakini huenda lisijulikane kwa kila msomaji, kwa hiyo limefafanuliwa katika tanbihi. Muundo umewekwa rahisi na wa simulizi.
