  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: sw
  text: Akajibu, “Anayepanda mbegu nzuri ni Mwana wa Adamu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yule Mwanadamu.” Jina la cheo la Kigiriki “Mwana wa Adamu” lina mwangwi wa Danieli 7, na limehifadhiwa hapa kwa sababu ya matumizi yake yaliyozoeleka katika Injili na uzito wake wa kiteolojia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Akajibu
  rationale: Kirai cha Kigiriki kina maana ya kawaida ya kuitikia kwa kusema. Kiswahili cha “Akajibu” huunganisha kitenzi-shirikishi na kitenzi kikuu kwa njia ya asili bila urudiaji usio wa lazima wa “akijibu, alisema.”
- source_word: Ὁ σπείρων
  choice: Anayepanda
  rationale: Kitenzi-shirikishi chenye kibainishi kinamtambulisha mhusika kwa tendo lake. “Anayepanda” ni cha asili na huhifadhi maana ya mtu anayefanya tendo hilo.
- source_word: τὸ καλὸν σπέρμα
  choice: mbegu nzuri
  rationale: καλός hapa hueleza mbegu iliyo nzuri au inayofaa, si uzuri wa kuonekana tu. “Mbegu” linaweza kutumiwa kwa maana ya jumla kama ilivyo katika Kigiriki.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo analotumia Yesu kujitaja katika Injili. Tafsiri iliyozoeleka ya “Mwana wa Adamu” huhifadhi mwangwi wa Danieli 7 na uzito wa kiteolojia wa kirai hicho.
theological_decisions:
- issue: Tafsiri ya jina la cheo la Kikristo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” hulihifadhi kama jina la cheo lenye mwangwi wa kiapokaliptiki na wa Kimasihi, badala ya kulifanya lionekane kuwa rejeo la kawaida tu kwa binadamu. Tanbihi inaonyesha mbadala unaowezekana bila kuondoa mvutano wa kirai cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Akajibu” linafaa katika masimulizi yanayoendelea, na “Mwana wa Adamu” limehifadhiwa kama jina la cheo lililozoeleka.
