  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: sw
  text: Naye aliyepandwa kwenye ardhi yenye miamba[a] ni yule anayelisikia neno na kulipokea mara moja kwa furaha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “mahali penye miamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Naye aliyepandwa kwenye ardhi yenye miamba
  rationale: Kirai hiki cha kisifa chenye kibainishi kinatumika kama nomino na kurejelea picha ya mbegu na udongo, huku kikimtambulisha mtu anayewakilishwa. “Naye” linaonyesha mpito mpole wa δέ, na “aliyepandwa” linadumisha sitiari iliyobanwa ya Kigiriki.
- source_word: πετρώδη
  choice: ardhi yenye miamba
  rationale: Neno hili linaonyesha eneo lenye miamba au mawe. Usemi huu ni wa kawaida katika Kiswahili cha sasa na unahifadhi picha ya ardhi katika mfano.
- source_word: σπαρείς
  choice: aliyepandwa
  rationale: Ni kitenzi-jina cha wakati uliopita, hali tendwa, kutoka σπείρω. Tafsiri hii inahifadhi hali tendwa na sitiari ya kupanda bila kuipanua kwa ufafanuzi.
- source_word: οὗτός ἐστιν
  choice: ni yule
  rationale: Hiki ni kishazi cha utambulisho. “Ni yule” ni cha asili katika Kiswahili na hakiongezi ufafanuzi wa “anawakilisha,” ambao hauko wazi katika Kigiriki.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: anayelisikia neno
  rationale: Kitenzi-jina cha wakati wa sasa kimetafsiriwa kwa kishazi tegemezi cha kawaida. “Neno” linadumishwa badala ya kufafanuliwa kuwa “ujumbe,” ili kuhifadhi istilahi na mwangwi wake katika Mathayo.
- source_word: εὐθὺς
  choice: mara moja
  rationale: Hili ni neno la kawaida na wazi linaloonyesha mwitikio wa haraka.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Usemi huu wa kawaida unahifadhi maana ya nomino χαρά na kueleza namna ya kulipokea neno.
- source_word: λαμβάνων αὐτόν
  choice: kulipokea
  rationale: λαμβάνω hapa lina maana ya kupokea au kukubali. Kiambishi “-li-” kinarejelea “neno” kwa upatanisho wa Kiswahili, huku “kupokea” kikibaki karibu na usemi wa chanzo.
theological_decisions:
- issue: Kirejelewa cha aliyepandwa katika ufafanuzi wa mfano
  choice: Kudumisha sitiari kama “aliyepandwa kwenye ardhi yenye miamba,” kisha kumtambulisha kuwa ndiye anayelisikia neno.
  alternative: “Mbegu iliyopandwa kwenye ardhi yenye miamba inamwakilisha mtu ambaye...”
  rationale: Kigiriki kinaibana sitiari kwa kusema kuhusu “aliyepandwa” na baadaye kumtambulisha kama msikiaji. Tafsiri inadumisha mvutano huo badala ya kuutatua kwa ufafanuzi mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi lakini unadumisha sitiari iliyobanwa ya maandishi ya Kigiriki. Alama ya tanbihi [a] imewekwa katika matini.
