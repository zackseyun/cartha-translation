source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: sw
  text: Lakini watu walipokuwa wamelala, adui yake akaja, akapanda magugu katikati ya ngano, kisha akaondoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: Katika muktadha huu neno hili linawataja watu waliokuwapo, bila kulazimisha jinsia ambayo si muhimu kwa maana ya mfano.
- source_word: ζιζάνια
  choice: magugu
  rationale: Ni mimea yenye madhara iliyopandwa katikati ya ngano; 'magugu' ni neno la kawaida na linaloeleweka, huku aina mahususi ya mmea ikiwa haijathibitishwa kwa uhakika.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: katikati ya ngano
  rationale: Huhifadhi picha ya magugu yaliyotawanywa ndani ya zao la ngano, si pembeni yake.
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Hutoa kwa kawaida tendo la adui kuondoka baada ya kupanda.
theological_decisions:
- issue: Utambulisho wa waliolala
  choice: watu
  alternative: wanaume
  rationale: ἀνθρώπους inaweza kutumiwa kwa watu kwa ujumla; mstari wenyewe hauhitaji kusisitiza jinsia, hivyo tafsiri haiongezi dai la kiteolojia au kijamii lisilo la lazima.
- issue: Aina ya ζιζάνια
  choice: magugu
  alternative: magugu aina ya darneli
  rationale: Neno huenda likamaanisha darneli inayofanana na ngano, lakini utambulisho huo wa kibotania si hakika kiasi cha kuingizwa moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kawaida, yenye heshima na mtiririko wa masimulizi. Mfululizo wa vitenzi 'akaja, akapanda, ... akaondoka' unaakisi mwendo wa simulizi la Kigiriki kwa Kiswahili cha asili.
