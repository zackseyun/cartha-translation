  source_fidelity: 'Tafsiri inafuata Kigiriki kwa uaminifu: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους imetolewa kwa kawaida kama “watu walipokuwa wamelala”; αὐτοῦ ὁ ἐχθρός ni “adui yake”; ζιζάνια ni “magugu”; na ἀνὰ μέσον τοῦ σίτου ni “katikati ya ngano.” Mlolongo wa vitendo—kuja, kupanda, na kuondoka—umehifadhiwa. Ingawa mkondo wa Kiingereza una “men,” τοὺς ἀνθρώπους hapa haikulazimishi jinsia ya kiume, na “watu” ni sahihi zaidi kwa maana pana ya neno la Kigiriki.'
