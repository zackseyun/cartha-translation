  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: sw
  text: Akawajibu, “Ninyi mmepewa kuzijua siri[a] za ufalme wa mbinguni, lakini wao hawajapewa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo ya siri.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “mmepewa” na “hawajapewa” hayamtaji mtoaji wazi; maana inayodokezwa ni kwamba Mungu ndiye anayetoa ujuzi huu.
    reason: implicit_divine_agent
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Akawajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi kikuu ni nahau ya Kigiriki yenye maana ya kujibu; Kiswahili cha kawaida na chenye heshima hakihitaji kurudia ‘akajibu akasema.’ Kiambishi ‘-wa-’ kinawakilisha αὐτοῖς.
- source_word: Ὅτι
  choice: imewasilishwa kwa kuanza moja kwa moja na ‘Ninyi’
  rationale: Katika muktadha huu ὅτι huanzisha maudhui ya jibu. Kiswahili hakihitaji ‘kwamba’ baada ya ‘akawajibu,’ na ‘kwa sababu’ hapa kingesikika kana kwamba sentensi inategemea swali lililotangulia kwa namna isiyo ya lazima.
- source_word: ὑμῖν δέδοται
  choice: Ninyi mmejaliwa
  rationale: ‘Mmejaliwa’ ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba jambo limepewa au kuruhusiwa kwa neema bila kumtaja mtoaji; pia huhifadhi hali ya sasa inayotokana na tendo lililotangulia.
- source_word: γνῶναι
  choice: kuzijua
  rationale: Huhifadhi maana ya msingi ya ‘kujua’ badala ya kuibana kuwa ‘kuelewa.’ Kiambishi ‘-zi-’ kinarejelea siri.
- source_word: τὰ μυστήρια
  choice: siri
  rationale: Katika Kiswahili cha sasa, ‘siri’ huwasilisha kwa kawaida kweli za Mungu zilizokuwa zimefichwa na sasa zinafunuliwa. ‘Mafumbo’ lingeweza kueleweka kama vitendawili au mambo yasiyoeleweka tu.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: za ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida na ulio wazi wa Kiswahili kwa istilahi ya Mathayo, huku ‘mbinguni’ ikihifadhi uhusiano wake na makao au mamlaka ya mbinguni.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: lakini wao hawajajaliwa
  rationale: ‘Wao’ huonyesha tofauti yenye mkazo kati ya wanafunzi na kundi jingine. Kurudia ‘hawajajaliwa’ huhifadhi uwiano wa vifungu na kutomtaja mtoaji.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika kauli tendwa δέδοται
  choice: Kutomtaja Mungu moja kwa moja; kutumia ‘mmejaliwa/hawajajaliwa’
  alternative: Mungu amewapa / Mungu hakuwapa
  rationale: Ingawa Mungu anaeleweka kuwa mtoaji, Kigiriki hakimsemi wazi. Tafsiri inadumisha udokezi huo na mvutano wa kiteolojia badala ya kuufafanua kimyakimya.
- issue: Maana ya μυστήρια katika muktadha wa ufalme
  choice: siri
  alternative: mafumbo / mambo ya siri / kweli zilizofichwa
  rationale: ‘Siri’ huhifadhi wazo la mambo ya Mungu yaliyofichwa na kufunuliwa bila kuingiza mfumo maalumu wa kiteolojia. Tanbihi inaonyesha mbadala wa karibu ‘mafumbo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mmejaliwa’ ni cha kawaida na hudumisha mtendaji asiyetajwa, huku mpangilio ‘Ninyi … lakini wao’ ukionyesha utofauti wa Kigiriki kwa uwazi.
