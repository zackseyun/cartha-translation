review_pass:
  verdict: revise
  source_fidelity: ‘Mmejaliwa’ communicates privileged favor but is less direct than the Greek perfect passive δέδοται (‘has been given’). ‘Mmepewa/hawajapewa’ more precisely preserves the repeated passive-gift construction and its balanced contrast while still leaving the giver unstated.
  naturalness: The sentence is natural Standard East African Swahili. ‘Akawajibu’ idiomatically renders the Greek answer formula, and the explicit contrast ‘Ninyi ... lakini wao’ is clear.
  terminology: ‘Siri za ufalme wa mbinguni’ is an established, comprehensible rendering of τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν. The alternative ‘mafumbo’ can suggest riddles or parables, so ‘mambo ya siri’ is a safer lexical alternative.
  issues:
  - severity: low
    issue: ‘Mmejaliwa/hawajajaliwa’ is somewhat interpretive.
    rationale: The terms emphasize being favored or fortunate, whereas δέδοται specifically repeats ‘has been given’ in both clauses. ‘Mmepewa/hawajapewa’ retains the passive wording and rhetorical parallel more closely.
  - severity: low
    issue: The footnote alternative ‘mafumbo’ is potentially misleading.
    rationale: In modern Swahili, ‘mafumbo’ readily denotes riddles, puzzles, or obscure sayings. μυστήρια here refers to divine realities disclosed, for which ‘mambo ya siri’ is less liable to mislead.
  revised_text: Akawajibu, “Ninyi mmepewa kuzijua siri[a] za ufalme wa mbinguni, lakini wao hawajapewa.”[b]
