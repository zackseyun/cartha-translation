id: MAT.13.56
reference: Matthew 13:56
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: sw
  text: Na je, dada zake wote hawako pamoja nasi? Basi, mtu huyu alipata wapi mambo haya yote?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa zake wa kike.” Hapa neno la Kigiriki kwa kawaida humaanisha “dada,” lakini wengine hulielewa kwa maana pana zaidi kutokana na mijadala ya kiteolojia ya baadaye.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: dada zake
  rationale: Maana ya kawaida ya kifamilia inafaa katika muktadha unaozungumzia watu wa nyumbani kwa Yesu; “dada zake” ni tafsiri ya moja kwa moja na ya asili.
- source_word: οὐχὶ πᾶσαι
  choice: je, ... wote hawako
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la kukubali; “wote” inadumisha mkazo wa kuwahusisha dada hao kwa ujumla.
- source_word: πρὸς ἡμᾶς
  choice: pamoja nasi
  rationale: Kirai hiki kinaonyesha kuwapo au kushirikiana na jamii; “pamoja nasi” ni Kiswahili cha kawaida na hakiongezi ufafanuzi usio katika matini.
- source_word: πόθεν
  choice: alipata wapi
  rationale: Neno hili linauliza chanzo; “alipata wapi” linaeleza swali hilo kwa Kiswahili cha asili bila kulibadili kuwa swali la namna.
- source_word: οὖν
  choice: Basi
  rationale: “Basi” linaonyesha hitimisho linalotokana na hoja ya wasemaji na linafaa katika mtiririko wa swali.
- source_word: τούτῳ
  choice: mtu huyu
  rationale: Kiwakilishi hiki kinamrejelea Yesu kwa namna yenye umbali na huenda dharau kidogo; “mtu huyu” inadumisha toni hiyo kuliko kutumia “yeye” tu.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Kirai hiki kinarejelea kwa upana hekima na matendo yenye nguvu yaliyotajwa katika muktadha; tafsiri hii inadumisha wingi na ukamilifu wake.
theological_decisions:
- issue: Maana ya kutajwa kwa dada za Yesu
  choice: Kutafsiri ἀδελφαὶ kwa maana yake ya kawaida kuwa “dada zake,” bila kuingiza maelezo ya kimadhehebu kuhusu undugu mpana.
  alternative: Jamaa zake wa kike/binamu zake
  rationale: Maana ya moja kwa moja ya neno la Kigiriki katika muktadha ni “dada.” Tafsiri haipaswi kutatua mijadala ya baadaye ya kiteolojia kwa kubadili maana ya kawaida, ingawa uwezekano wa tafsiri pana unaweza kutajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha na toni ya wasemaji vimedumishwa bila kuingiza msimamo wa kimadhehebu.
