  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: sw
  text: Ndipo wenye haki watang'aa[a] kama jua katika ufalme wa Baba yao. Mwenye masikio, na asikie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watatoa mwanga.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina mwito wa umoja wenye maana wakilishi: “Mwenye masikio, na asikie.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Inaonyesha mfuatano wa wakati unaotokana na maelezo yaliyotangulia, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: οἱ δίκαιοι
  choice: wenye haki
  rationale: Ni usemi wa kawaida wa kibiblia unaowataja watu walio na hali ya haki bila kuibana maana kuwa uadilifu wa kitabia pekee.
- source_word: ἐκλάμψουσιν
  choice: watang'aa
  rationale: Kitenzi hiki kina maana ya kung'aa au kutoa mwanga; 'watang'aa' ni cha asili na kinaendana na mfano wa jua.
- source_word: ὡς ὁ ἥλιος
  choice: kama jua
  rationale: Huhifadhi wazi ulinganisho wa Kigiriki kwa Kiswahili cha sasa.
- source_word: ἐν τῇ βασιλείᾳ
  choice: katika ufalme
  rationale: Muundo huu una maana ya mahali au eneo; 'ufalme' huhifadhi pia wazo la utawala bila kulazimisha maana moja tu.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: wa Baba yao
  rationale: Hufuata kwa karibu uhusiano wa Kigiriki bila kuongeza neno 'wa mbinguni,' ambalo halipo katika mstari huu.
- source_word: ὁ ἔχων ὦτα
  choice: Mwenye masikio
  rationale: Ni usemi wa umoja wenye maana wakilishi na ni wa asili zaidi katika Kiswahili kuliko kutaja jinsia isiyowekwa wazi na sarufi ya Kiswahili.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Huhifadhi amri ya nafsi ya tatu na zaidi ya kusikia sauti tu hudokeza kuitikia kwa makini, bila kuongeza maelezo katika matini.
theological_decisions:
- issue: Umoja wakilishi katika mwito wa mwisho
  choice: Mwenye masikio, na asikie
  alternative: Yeyote aliye na masikio na asikie
  rationale: Huhifadhi umoja na nguvu ya mwito wa Kigiriki. Kiswahili hakihitaji kiwakilishi cha kiume hapa, hivyo maana wakilishi inabaki bila kubadili idadi.
- issue: Maana ya βασιλεία katika muktadha huu
  choice: ufalme
  alternative: utawala
  rationale: Kirai 'katika ufalme wa Baba yao' ni cha kimahali katika muktadha huu; 'ufalme' hufaa zaidi huku kikiwa hakiondoi dhana ya kutawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo 'na asikie' umetumiwa kama amri ya nafsi ya tatu yenye uzito wa kibiblia bila kuwa wa kizamani kupita kiasi.
