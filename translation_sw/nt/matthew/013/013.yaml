  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: sw
  text: Ndiyo sababu ninazungumza nao kwa mifano, kwa kuwa wakiona hawaoni, na wakisikia hawasikii wala hawaelewi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ingawa wanaona, hawaoni; na ingawa wanasikia, hawasikii wala hawaelewi.”
    reason: Tafsiri mbadala inayoweka wazi maana ya hali ya kupingana inayoweza kubebwa na vihusishi vya Kigiriki.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Ndiyo sababu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya sababu inayoanzisha maelezo ya Yesu bila kuifanya kuwa hitimisho kali.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Katika muktadha huu, “mifano” ni neno la kawaida la Kiswahili kwa παραβολαί, na “kwa” huonyesha njia au namna ya kusema.
- source_word: αὐτοῖς λαλῶ
  choice: ninazungumza nao
  rationale: Huwasilisha usemi wa wakati uliopo na walengwa wa maneno kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Huonyesha wazi kwamba sehemu inayofuata inatoa sababu, huku ikiepuka kurudia “sababu” mara moja tena.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: wakitazama hawaoni
  rationale: Huhifadhi kwa ufupi urudiaji wa kitenzi na fumbo la kuwa na uwezo wa kuona lakini kutokuona, bila kulazimisha wazi maana ya concessive.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: wakisikia hawasikii
  rationale: Hufuata muundo sambamba wa Kigiriki na kuhifadhi tofauti kati ya kusikia kwa nje na kutopokea maana.
- source_word: οὐδὲ συνίουσιν
  choice: wala hawaelewi
  rationale: “Wala” huendeleza mfululizo wa ukanushi, na “hawaelewi” huonyesha kutofahamu maana bila kuongeza dai la kiteolojia lisilosemwa moja kwa moja.
theological_decisions:
- issue: Nguvu ya vihusishi βλέποντες na ἀκούοντες
  choice: “wakitazama” na “wakisikia,” bila kuongeza wazi “ingawa” katika matini kuu
  alternative: “ingawa wanatazama” na “ingawa wanasikia”
  rationale: Vihusishi vya Kigiriki vinaweza kueleweka kwa maana ya hali inayoleta tofauti, lakini muundo wa “waki-” huhifadhi kwa kiasi kikubwa utata huo na fumbo la kuona bila kuona na kusikia bila kusikia. Tanbihi inaonyesha tafsiri ya maana ya concessive.
- issue: Maana ya συνίουσιν
  choice: “hawaelewi”
  alternative: “hawafahamu”
  rationale: “Kuelewa” ni neno la sasa na la kawaida linaloonyesha kutopata maana, bila kuamua zaidi kiwango cha kiroho, kiakili, au kimaadili cha kushindwa huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba na urudiaji wa “kutazama/kuona” na “kusikia/kusikia” umehifadhiwa kwa sababu ni sehemu muhimu ya msisitizo wa mstari.
