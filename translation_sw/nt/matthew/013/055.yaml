  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: sw
  text: Je, huyu si mwana wa seremala? Je, mama yake si aitwaye Maria, na ndugu zake[a] si Yakobo, Yosefu[b], Simoni na Yuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki kwa kawaida humaanisha “ndugu wa kiume,” lakini katika muktadha huu wengine hulielewa kwa maana pana ya “jamaa.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “Yose” badala ya “Yosefu.”
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: seremala
  rationale: Neno la Kigiriki linaweza kumaanisha fundi anayefanya kazi ya ujenzi au ya mbao. “Seremala” ni tafsiri ya kawaida na inayoeleweka vizuri katika muktadha huu, ingawa maana ya Kigiriki ni pana kidogo.
- source_word: υἱός
  choice: mwana
  rationale: Muktadha wa familia unaonyesha wazi uhusiano wa mwana; “mwana” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: λέγεται
  choice: anaitwa
  rationale: Kauli hii ya kutendwa katika Kigiriki ina maana ya kuitwa au kuwa na jina fulani; “anaitwa” ni ya asili katika Kiswahili.
- source_word: Μαριὰμ
  choice: Maria
  rationale: “Maria” ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἀδελφοὶ
  choice: ndugu zake
  rationale: Kwa kawaida neno la Kigiriki humaanisha ndugu wa kiume. Kiswahili “ndugu” ni cha kawaida na pia huhifadhi uwezekano wa maana pana ya uhusiano wa kifamilia bila kuamua mjadala wa kitheolojia.
- source_word: Ἰάκωβος
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Agano Jipya la Kiswahili.
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: Hili ndilo umbo la kawaida la Ἰωσήφ katika Kiswahili; tofauti ya hati inayosema “Yose” imewekwa katika tanbihi.
- source_word: Σίμων
  choice: Simoni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: Ἰούδας
  choice: Yuda
  rationale: “Yuda” ni umbo la kawaida la jina la Kigiriki Ἰούδας katika Kiswahili.
- source_word: οὐχ ... ;
  choice: Je, ... si ...?
  rationale: Muundo huu huanzisha maswali ya balagha yanayotarajia jibu la kukubali. Kiswahili “Je, ... si ...?” huhifadhi nguvu na muundo huo kwa njia ya asili.
theological_decisions:
- issue: Maana ya ἀδελφοὶ αὐτοῦ kuhusu uhusiano wa kifamilia wa Yesu
  choice: Kutumia “ndugu zake” katika maandishi makuu
  alternative: “ndugu zake wa kiume” kwa maana ya kaka na wadogo zake, au “jamaa zake” kwa maana pana
  rationale: Neno la Kigiriki kwa kawaida humaanisha ndugu wa kiume, lakini limetafsiriwa kwa namna pana katika muktadha huu na baadhi ya wasomaji. “Ndugu zake” ni usemi wa kawaida wa Kiswahili unaohifadhi mvutano huo bila kuamua kama walikuwa ndugu wa tumbo moja, ndugu wa aina nyingine, au jamaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali ya balagha yamehifadhiwa, majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili, na sentensi imewekwa kwa mtiririko wa kawaida bila kuondoa utata halisi wa “ndugu.”
