base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: sw
  text: Lakini akasema, “Hapana, msije mkang'oa ngano pamoja na magugu[a] wakati mkiyakusanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magugu yanayofanana na ngano”; huenda hasa aina ya gugu iitwayo darnel, ambayo katika hatua zake za mwanzo inaweza kufanana na ngano.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: Οὔ
  choice: Hapana
  rationale: Ni jibu la moja kwa moja la kukataa, linaloeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: μήποτε
  choice: msije
  rationale: Muundo huu wa Kiswahili unaonyesha onyo kuhusu matokeo yasiyotakiwa yanayoweza kutokea.
- source_word: συλλέγοντες
  choice: wakati mkiyakusanya
  rationale: Unaonyesha kwamba kukusanya magugu kungefanyika wakati uleule ambao ngano ingeweza kung'olewa.
- source_word: ζιζάνια
  choice: magugu
  rationale: Ni neno la kawaida na linaloeleweka; utambulisho wa mmea kwa usahihi zaidi umehifadhiwa katika tanbihi.
- source_word: ἐκριζώσητε
  choice: mkang'oa
  rationale: Kitenzi hiki huonyesha kuondoa mmea pamoja na mizizi yake; 'kung'oa' ni chaguo la asili na sahihi katika muktadha huu.
- source_word: ἅμα αὐτοῖς
  choice: pamoja na magugu
  rationale: Kurudia nomino badala ya kutumia kiwakilishi kunaondoa utata wa marejeleo na kueleza kwamba ngano inaweza kuondolewa pamoja na magugu.
- source_word: σῖτον
  choice: ngano
  rationale: Katika muktadha huu wa kilimo na kwa kulinganishwa na ζιζάνια, neno hili linarejelea ngano kuliko nafaka kwa ujumla.
theological_decisions:
- issue: Tafsiri ya ζιζάνια katika mfano unaojulikana
  choice: magugu
  alternative: magugu yanayofanana na ngano (huenda dudumizi/darnel)
  rationale: Maana kuu ya mfano haihitaji utambulisho kamili wa kibotania. 'Magugu' ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi uwezekano kwamba ni aina maalumu inayofanana na ngano ikiwa michanga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo “msije mkang'oa” huhifadhi nguvu ya onyo la μήποτε, na “wakati mkiyakusanya” huhifadhi uhusiano wa wakati wa participio ya Kigiriki.
