  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: sw
  text: Shamba ni ulimwengu, na mbegu nzuri ni wana wa ufalme[a]; magugu[b] nayo ni wana wa yule Mwovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wa ufalme” ni usemi wa uhusiano unaomaanisha watu walio wa ufalme, wanawake na wanaume.
    reason: cultural_note
  - marker: b
    text: Au kwa umahususi zaidi, “magugu aina ya darnel,” mmea unaofanana na ngano ukiwa mchanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: shamba
  rationale: Katika mfano huu wa kilimo, “shamba” ni neno la kawaida na la wazi linalohifadhi taswira ya mahali palipopandwa.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Neno hili linarejelea kwa upana ulimwengu kama eneo ambamo upandaji katika mfano unatokea.
- source_word: καλὸν σπέρμα
  choice: mbegu nzuri
  rationale: Huhifadhi taswira halisi ya kilimo na utofautishaji wake na magugu.
- source_word: υἱοὶ τῆς βασιλείας
  choice: wana wa ufalme
  rationale: “Wana wa” huhifadhi usemi wa uhusiano na kumilikiwa, huku “ufalme” likiwa neno la kawaida katika lugha ya Mathayo kuhusu βασιλεία.
- source_word: ζιζάνια
  choice: magugu
  rationale: “Magugu” linaeleweka kwa urahisi katika Kiswahili cha sasa; utambulisho mahsusi zaidi wa mmea umewekwa katika tanbihi.
- source_word: υἱοὶ τοῦ πονηροῦ
  choice: wana wa yule Mwovu
  rationale: 'Muundo wa Kigiriki una kifungu bainishi na kivumishi cha umoja kinachotumiwa kama nomino, hivyo unaunga mkono rejeo la nafsi: “yule Mwovu.”'
theological_decisions:
- issue: Ikiwa τοῦ πονηροῦ inamaanisha uovu usio na nafsi au yule Mwovu kama nafsi
  choice: yule Mwovu
  alternative: uovu; yule mwenye uovu
  rationale: Kifungu bainishi pamoja na umoja wa kiume, hasa baada ya “wana wa,” kinaelekea kumtaja mhusika binafsi bila kumtambulisha zaidi ya yanavyofanya maandiko haya.
- issue: Jinsi ya kuwasilisha υἱοὶ katika usemi wa uhusiano
  choice: wana
  alternative: watoto
  rationale: “Wana wa” ni usemi wa asili wa Kiswahili unaohifadhi uhusiano wa asili ya kiroho au kumilikiwa; hapa unawahusu watu wanaohusiana na ufalme au yule Mwovu, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vifungu vitatu sambamba umehifadhiwa kwa alama ya nukta mkato na kiunganishi “nayo.” Herufi kubwa katika “Mwovu” inaonyesha rejeo la nafsi bila kuongeza jina ambalo halipo katika Kigiriki.
