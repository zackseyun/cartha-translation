reference: Matthew 13:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: sw
  text: Hiyo kwa kweli ni ndogo kuliko mbegu zote, lakini ikishakua, ni kubwa kuliko mimea ya bustani na huwa mti, hivi kwamba ndege wa angani[a] huja na kukaa katika matawi yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndege wa hewani,” tafsiri ya jadi ya τὰ πετεινὰ τοῦ οὐρανοῦ.
    reason: lexical_alternative
  - marker: b
    text: Taswira ya ndege wanaofanya makao katika matawi huenda ikadokeza picha za Agano la Kale za mti mkubwa wa ufalme (kwa mfano, Ezekieli 17:23; Danieli 4:12), lakini mstari huu hauelezi ishara hiyo waziwazi.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον
  choice: ndogo kuliko
  rationale: Ni umbo la kulinganisha, si la kiwango cha juu kabisa; tafsiri hii inadumisha ulinganisho wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: πάντων τῶν σπερμάτων
  choice: mbegu zote
  rationale: Inahifadhi wingi na upeo wa usemi wa Kigiriki bila kuubana kuwa aina fulani za mbegu za kilimo.
- source_word: μέν ... δέ
  choice: kwa kweli ... lakini
  rationale: Inaonyesha wazi tofauti kati ya mwanzo mdogo wa mbegu na ukubwa wake baada ya kukua.
- source_word: ὅταν ... αὐξηθῇ
  choice: inapokuwa imekua
  rationale: Inaonyesha ukuaji uliotimia kabla ya hali inayotajwa katika kishazi kinachofuata.
- source_word: μεῖζον τῶν λαχάνων
  choice: kubwa kuliko mimea ya bustani
  rationale: λάχανα ni mimea inayolimwa bustanini; usemi huu ni mpana na wa kawaida kuliko kuibana kuwa mboga au mimea ya viungo pekee.
- source_word: γίνεται δένδρον
  choice: kuwa mti
  rationale: Inadumisha taswira ya moja kwa moja ya Kigiriki bila kuipunguza kuwa ‘kama mti.’
- source_word: ὥστε ἐλθεῖν
  choice: hata ... huja
  rationale: Katika muktadha huu, ‘hata’ linaonyesha matokeo ya ukuaji huo kwa njia ya asili katika Kiswahili.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: ‘Angani’ linaonyesha οὐρανός kama anga katika muktadha wa ndege na ni usemi wa kawaida wa Kiswahili.
- source_word: κατασκηνοῦν
  choice: kujenga viota
  rationale: Kwa ndege waliomo katika matawi, kitenzi hiki cha kukaa au kufanya makao kinaelezwa kwa Kiswahili cha kawaida kama kujenga viota.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: katika matawi yake
  rationale: Ni tafsiri ya moja kwa moja ya mahali, na ‘yake’ inarejelea mti.
theological_decisions:
- issue: Taswira inayoweza kudokeza ndege wanaokaa katika mti mkubwa wa ufalme
  choice: Taswira imetafsiriwa moja kwa moja bila kuitafsiri kiishara katika andiko kuu.
  alternative: Kuwataja ndege waziwazi kuwa mataifa au watu wanaopata hifadhi katika ufalme wa Mungu.
  rationale: Huenda taswira hii ikarejelea picha za Agano la Kale za mti mkubwa wa ufalme, lakini mstari wenyewe hauelezi maana yake kiishara. Tafsiri inadumisha mwangwi huo bila kulazimisha hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganisho wa mbegu ndogo na mmea mkubwa umehifadhiwa kwa lugha ya asili, na taswira ya mti na ndege haijafasiriwa kimadhehebu.
