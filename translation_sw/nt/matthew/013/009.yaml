  text: The one who has ears[a], let him hear.
translation:
  language: sw
  text: Mwenye masikio na asikie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Mwenye
  rationale: Kirai cha Kiyunani chenye kibainishi na kitenzi-shirikishi kinamtaja kwa ujumla mtu yeyote aliye na sifa hiyo. “Mwenye” ni kifupi, cha kawaida, na kinahifadhi umoja bila kuingiza jinsia isiyohitajika katika Kiswahili.
- source_word: ὦτα
  choice: masikio
  rationale: Neno la Kiyunani liko katika wingi; “masikio” linaakisi idadi hiyo na linafaa katika msemo huu.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Hii ni amri ya nafsi ya tatu umoja. “Na asikie” inatoa mwito wenye nguvu wa kusikia kwa makini na kupokea ujumbe, huku ikihifadhi uhusiano wa moja kwa moja na maana ya ἀκούω.
theological_decisions:
- issue: Umoja wa kiwakilishi chenye maana ya jumla
  choice: Mwenye masikio na asikie.
  alternative: Yeyote aliye na masikio, na asikie.
  rationale: Kiyunani kinatumia umoja wenye maana ya jumla. Kiswahili “mwenye” kinahifadhi umoja huo kwa njia ya asili na isiyo na alama ya jinsia, hivyo hakuna haja ya tanbihi kuhusu lugha jumuishi.
translation_notes:
  register: Lugha ni fupi, yenye hadhi, na ya kawaida katika Kiswahili Sanifu cha Afrika Mashariki. Muundo “na asikie” una sauti ya mausia inayofaa kwa kauli ya Yesu.
