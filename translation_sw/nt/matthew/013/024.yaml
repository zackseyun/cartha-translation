base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: sw
  text: Akawawekea mfano mwingine, akisema, “Ufalme wa mbinguni unafanana[a] na mtu aliyepanda mbegu nzuri katika shamba lake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umefananishwa.” Kitenzi cha Kigiriki kiko katika kauli tendwa, lakini katika utangulizi huu wa mfano kinaweza kutafsiriwa kwa kawaida kuwa “unafanana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: mfano mwingine
  rationale: Hutambulisha mfano wa ziada katika mfululizo; mpangilio huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: παρέθηκεν αὐτοῖς
  choice: akawatolea
  rationale: Kitenzi παρατίθημι hapa kina maana ya kuweka au kuwasilisha jambo mbele ya watu. ‘Akawatolea’ ni Kiswahili cha asili kinachofaa kwa kuwasilisha mfano wa kufundishia.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kisarufi kati ya utangulizi wa simulizi na maneno yanayonukuliwa.
- source_word: Ὡμοιώθη
  choice: unafanana
  rationale: Katika kaida ya Mathayo ya kutambulisha mifano ya ufalme, kauli hii ya Kigiriki hutenda kama ulinganisho. ‘Unafanana’ ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa tafsiri rasmi zaidi ya kauli tendwa.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kaida maalumu ya Mathayo na unaeleweka kuwa utawala wa Mungu, si eneo la kijiografia pekee.
- source_word: ἀνθρώπῳ
  choice: mtu
  rationale: ‘Mtu’ ni tafsiri ya moja kwa moja na ya asili; muktadha unaonyesha mhusika mmoja bila kulazimisha maelezo yasiyosemwa na chanzo.
- source_word: σπείραντι
  choice: aliyepanda
  rationale: Kishiriki cha aoristi kinachomfafanua mtu kinatolewa kwa kishazi rejeshi cha Kiswahili kinachoonyesha tendo lililotimizwa.
- source_word: καλὸν σπέρμα
  choice: mbegu nzuri
  rationale: Hueleza mbegu yenye ubora mzuri na kutayarisha utofauti wake na magugu katika muktadha unaofuata.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: katika shamba lake
  rationale: Ni tafsiri ya moja kwa moja na ya asili; kiwakilishi cha umilikaji kinamhusu mtu katika mfano.
theological_decisions:
- issue: Kaida ya Mathayo kuhusu ufalme
  choice: Ufalme wa mbinguni
  alternative: Ufalme wa mbingu
  rationale: ‘Ufalme wa mbinguni’ ni usemi wa kawaida wa Kiswahili unaohifadhi namna ya Mathayo ya kuzungumzia utawala wa Mungu bila kuufanya ufalme uwe mahali tu.
- issue: Nguvu ya Ὡμοιώθη katika utangulizi wa mfano
  choice: unafanana
  alternative: umefananishwa
  rationale: Katika kaida hii ya kimfano, ‘unafanana’ huwasilisha ulinganisho kwa Kiswahili cha kawaida bila kudai kwamba asili ya ufalme ilibadilika. Tanbihi inahifadhi umbo la kauli tendwa la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi tofauti halisi ya kisarufi katika Ὡμοιώθη.
