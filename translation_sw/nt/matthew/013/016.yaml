  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: sw
  text: Lakini heri macho yenu[a], kwa sababu yanaona, na masikio yenu, kwa sababu yanasikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maana yanaona ... maana yanasikia.” Kiunganishi cha Kigiriki hapa kinaweza kutafsiriwa kuwa “kwa sababu” au “maana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti na hali ya wale wanaotazama lakini hawaoni na wanaosikia lakini hawasikii katika muktadha uliotangulia.
- source_word: μακάριοι
  choice: heri
  rationale: Ni usemi wa kawaida na wenye hadhi katika kauli za baraka, ukidokeza hali ya kupendelewa na Mungu badala ya furaha ya kihisia tu.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: macho yenu
  rationale: Ni mpangilio wa asili wa Kiswahili na unadumisha msisitizo kwamba macho ya wanafunzi ndiyo yanayoitwa yenye heri.
- source_word: ὅτι βλέπουσιν
  choice: kwa sababu yanaona
  rationale: ὅτι hapa inaeleweka vizuri kama kiunganishi cha sababu; tafsiri hii inaeleza sababu ya macho kuitwa yenye heri bila kuongeza ufafanuzi wa kiroho.
- source_word: τὰ ὦτα ὑμῶν
  choice: masikio yenu
  rationale: Ni Kiswahili cha kawaida na kinadumisha usambamba na “macho yenu.”
- source_word: ὅτι ἀκούουσιν
  choice: kwa sababu yanasikia
  rationale: Inadumisha maana ya sababu na usambamba wa kisarufi na kishairi wa sentensi.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: yanaona / yanasikia
  rationale: Vitenzi vya kawaida vya hisi vinahifadhi urahisi wa Kigiriki na kuacha muktadha utoe maana pana ya kiroho bila kuiingiza moja kwa moja katika tafsiri.
theological_decisions:
- issue: Iwapo kuona na kusikia kufanywe kuwa vya kiroho waziwazi katika tafsiri
  choice: Kudumisha lugha halisi ya hisi, “yanaona” na “yanasikia,” bila kuongeza “yanaelewa” au “yanatambua.”
  alternative: “Lakini heri macho yenu kwa sababu yanatambua, na masikio yenu kwa sababu yanaelewa.”
  rationale: Katika muktadha, Yesu anawatofautisha wanafunzi na wale wanaoona na kusikia bila kuelewa; hata hivyo, mstari huu wenyewe unasema tu kuwa macho yao yanaona na masikio yao yanasikia. Lugha halisi inadumisha mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Heri” inadumisha mtindo wa kauli ya baraka; “kwa sababu” ni wazi na ya asili, huku tanbihi ikihifadhi uwezekano wa “maana.”
