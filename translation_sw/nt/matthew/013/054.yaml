source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: sw
  text: Alipofika katika mji wake, alikuwa akiwafundisha katika sinagogi lao, hata wakastaajabu na kusema, “Huyu amepata wapi hekima hii na matendo haya ya nguvu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miujiza”; yaani, matendo yanayodhihirisha nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: mji wa kwao
  rationale: Katika muktadha huu neno hili linamaanisha mahali Yesu alikokulia na kujulikana na wenyeji, si taifa au nchi kwa maana pana. “Mji wa kwao” ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya mahali pa asili.
- source_word: ἐδίδασκεν
  choice: alikuwa akiwafundisha
  rationale: Hali ya kitenzi cha Kigiriki inaonyesha tendo lililokuwa likiendelea wakati uliopita; muundo huu wa Kiswahili unadumisha maana hiyo.
- source_word: συναγωγῇ
  choice: sinagogi
  rationale: Katika mazingira haya ya Kiyahudi, neno hilo linarejelea mahali na taasisi ya ibada ya Kiyahudi; “sinagogi” ni tafsiri iliyo wazi na inayotambulika.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Kwa hiyo wakastaajabu na kusema
  rationale: ὥστε inaonyesha matokeo ya mafundisho yake. “Wakastaajabu” huonyesha mshangao mkubwa, huku vitenzi vya Kiswahili vikitoa mfuatano wa matokeo kwa njia ya kawaida.
- source_word: Πόθεν τούτῳ
  choice: Huyu amepata wapi
  rationale: Πόθεν huuliza chanzo, na τούτῳ ina sauti kiasi ya kumweka anayezungumziwa mbali. “Huyu amepata wapi” ni ya kawaida na inadumisha sauti hiyo.
- source_word: σοφία
  choice: hekima
  rationale: “Hekima” ni tafsiri ya kawaida na sahihi ya σοφία katika muktadha wa ufahamu na mafundisho ya ajabu.
- source_word: δυνάμεις
  choice: matendo ya nguvu
  rationale: Katika Injili neno hili linaweza kumaanisha nguvu zinazoonekana katika matendo ya ajabu. “Matendo ya nguvu” huhifadhi dhana ya nguvu huku kikieleweka kwa Kiswahili kuliko “nguvu” peke yake; tanbihi inaonyesha uwezekano wa “miujiza” bila kuufanya kuwa tafsiri pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri δυνάμεις kuhusu matendo ya ajabu ya Yesu
  choice: matendo ya nguvu
  alternative: miujiza
  rationale: Tafsiri hii inadumisha uhusiano wa neno la Kigiriki na “nguvu” na pia inaonyesha kwamba nguvu hizo zilidhihirika katika matendo. Haifanyi neno hilo kuwa istilahi finyu ya kiteolojia, huku tanbihi ikieleza maana inayokusudiwa mara nyingi katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni za kawaida kwa wasomaji wengi; “mji wa kwao” huepuka tafsiri pana ya “nchi ya kwao,” na “matendo ya nguvu” huhifadhi upeo wa maana ya neno la Kigiriki.
