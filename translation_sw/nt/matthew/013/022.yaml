id: MAT.13.22
reference: Matthew 13:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: sw
  text: Naye aliyepandwa kati ya miiba ni yule anayelisikia neno, lakini mahangaiko ya zama hizi[a] na udanganyifu wa utajiri[b] hulisonga neno, naye huwa asiyezaa matunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahangaiko ya ulimwengu huu.” Kigiriki kwa maana ya karibu zaidi ni “mahangaiko ya zama hizi.”
    reason: alternative_reading
  - marker: b
    text: Au, “udanganyifu wa mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Naye aliyepandwa kati ya miiba
  rationale: Muundo huu unadumisha sitiari ya kupandwa na pia rejeleo la mtu lililo katika umbo la kiume la Kigiriki. “Kati ya miiba” ni Kiswahili cha kawaida kinachowasilisha maana ya εἰς katika picha hii.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: yule anayelisikia neno
  rationale: Kirai tegemezi ni cha asili katika Kiswahili na kinahifadhi tendo la kusikia pamoja na “neno” kama ujumbe unaotangazwa.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: mahangaiko ya zama hizi
  rationale: “Mahangaiko” yanaonyesha wasiwasi na shughuli zinazolemea; “zama hizi” inadumisha maana ya wakati au enzi katika αἰών bila kuigeuza moja kwa moja kuwa ulimwengu wa kimwili.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: udanganyifu wa utajiri
  rationale: Tafsiri hii inaonyesha tabia ya utajiri ya kupotosha au kutoa ahadi za uongo, huku ikihifadhi muundo wa kirai cha Kigiriki.
- source_word: συμπνίγει
  choice: hulikaba
  rationale: “Kulikaba” ni taswira hai na ya kawaida kwa mimea inayozongwa na miiba hadi ishindwe kukua na kuzaa.
- source_word: ἄκαρπος γίνεται
  choice: huwa hazai matunda
  rationale: Kauli hii ya asili katika Kiswahili inamrejelea msikiaji na kuhifadhi taswira ya kutokuwa na matunda, bila kudokeza kwamba neno lenyewe ndilo lenye kasoro.
theological_decisions:
- issue: Maana ya αἰών
  choice: zama hizi
  alternative: ulimwengu huu
  rationale: αἰών kimsingi huonyesha zama au enzi. “Zama hizi” inadumisha tofauti ya wakati na hali ya kimaadili iliyo katika matumizi ya Agano Jipya; tafsiri iliyozoeleka ya “ulimwengu huu” imewekwa katika tanbihi.
- issue: Rejeleo la mtu au la kitu katika ufafanuzi wa mfano
  choice: naye huwa hazai matunda
  alternative: nalo huwa halizai matunda
  rationale: Ufafanuzi unamtambulisha aliyepandwa kuwa “yule anayelisikia neno.” Kwa hiyo mwisho unaendelea kumrejelea mtu na kuepuka wazo kwamba neno lenyewe halina uwezo wa kuzaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Lugha ni rahisi kusomeka kwa watu wa kawaida, huku taswira ya kupanda, miiba, kukaba na kuzaa matunda ikidumishwa.
