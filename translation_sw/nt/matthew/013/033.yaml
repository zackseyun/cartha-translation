base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: sw
  text: 'Akawaambia tena mfano mwingine: “Ufalme wa mbinguni ni kama chachu[a] ambayo mwanamke aliichukua na kuificha[c] katika vipimo vitatu vya unga[b], mpaka unga wote ukachachuka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hamira.” Neno la Kigiriki linamaanisha kiambato kinachotumiwa kuchachusha unga.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “sata tatu za unga.” Sata ilikuwa kipimo cha kale cha vitu vikavu; sata tatu zilikuwa kiasi kikubwa cha unga.'
    reason: cultural_note
  - marker: c
    text: Au “kuichanganya ndani ya” au “kuikanda ndani ya.” Kigiriki kwa maana halisi ni “kuificha ndani ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Akawaambia mfano mwingine
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwamba Yesu aliwasimulia mfano wa ziada, huku ἐλάλησεν αὐτοῖς ikiwakilishwa kwa kitenzi cha mawasiliano kinachofaa katika utangulizi wa mfano.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  rationale: Ni usemi wa kawaida na unaoeleweka katika Kiswahili kwa tamathali hii ya Mathayo; hautafsiri wingi wa Kigiriki οὐρανῶν kwa namna isiyo ya kawaida.
- source_word: ζύμῃ
  choice: chachu
  rationale: Katika Kiswahili, “chachu” ni kiambato kinachochachusha unga na hudumisha picha ya kitu kidogo kinachoenea katika donge lote.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: ambayo mwanamke mmoja aliichukua
  rationale: Huhifadhi mtiririko wa tendo la kishirikishi λαβοῦσα kwa Kiswahili asilia. “Mmoja” hapa ni kiwakilishi kisicho bainishi, si nyongeza ya mkazo wa kihesabu.
- source_word: ἐνέκρυψεν εἰς
  choice: kuificha katika
  rationale: Huhifadhi maana halisi ya ἐγκρύπτω, “kuficha ndani ya,” bila kuamua kimyakimya kwamba tendo lilikuwa tu kuchanganya au kukanda.
- source_word: ἀλεύρου σάτα τρία
  choice: vipimo vitatu vya unga
  rationale: Huwasilisha kipimo cha ujazo kwa lugha inayoeleweka; jina la kale “sata” na ukubwa wa kiasi vinaelezwa katika tanbihi.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: mpaka unga wote ukachachuka
  rationale: Huwakilisha hali tendwa ya Kigiriki kwa matokeo ya asili katika Kiswahili na hufanya rejeo la ὅλον lieleweke bila kuongeza wazo la “donge” ambalo halijatajwa wazi.
theological_decisions:
- issue: Maana chanya au hasi ya ζύμη katika mfano wa ufalme
  choice: Kutumia “chachu” bila kuipa tathmini ya kimaadili katika tafsiri
  alternative: Kutafsiri kwa maneno yanayoonyesha kwamba chachu ni ishara hasi, au kuieleza wazi kuwa ishara chanya ya ukuaji
  rationale: Mstari unalinganisha ufalme na chachu lakini hautamki moja kwa moja tathmini yake ya kimaadili. Tafsiri inapaswa kuhifadhi picha ya kuenea kwa siri bila kutatua mjadala wa kitheolojia kwa niaba ya msomaji.
- issue: Nguvu ya ἐνέκρυψεν, “alificha”
  choice: Kuhifadhi “kuificha” katika maandishi makuu
  alternative: “Kuchanganya ndani ya” au “kukanda ndani ya”
  rationale: Maana halisi ya kitenzi inaweza kuchangia picha ya kazi iliyofichika ya ufalme. Visawe vya kawaida vya upishi vinawekwa tanbihini ili kutofuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Muundo “Akawaambia mfano mwingine” ni wa masimulizi ya kibiblia bila kuwa wa kizamani kupita kiasi. Viambishi vya ngeli vimewekwa kwa “chachu” kama nomino ya ngeli ya 9, na “unga wote ukachachuka” hutoa mwisho wa sentensi kwa uwazi wa kawaida.
