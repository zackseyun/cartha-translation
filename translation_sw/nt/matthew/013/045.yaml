  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: sw
  text: Tena, ufalme wa mbinguni ni kama mfanyabiashara[a] anayetafuta lulu nzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “ufalme wa mbinguni ni kama mtu, mfanyabiashara, anayetafuta lulu nzuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Tena
  rationale: Neno hili linaanzisha mfano mwingine katika mfululizo wa mifano ya ufalme; “Tena” ni la kawaida na linahifadhi mtiririko wa habari.
- source_word: ὁμοία ἐστὶν
  choice: ni kama
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa muundo wa ulinganisho katika mfano.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Hili ni tamko la Mathayo lililozoeleka katika Kiswahili na linawasilisha maana ya kifungu bila kutumia muundo usio wa kawaida wa “mbingu.”
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: mfanyabiashara
  rationale: ἔμπορος humtambulisha mtu huyo kuwa mfanyabiashara, kwa hiyo si lazima kurudia “mtu, mfanyabiashara” katika matini kuu.
- source_word: ζητοῦντι
  choice: aliyekuwa akitafuta
  rationale: Muundo huu unaonyesha shughuli inayoendelea ya mfanyabiashara, kama inavyodokezwa na participio ya wakati wa sasa.
- source_word: καλοὺς μαργαρίτας
  choice: lulu nzuri
  rationale: καλός hapa inaonyesha ubora; “lulu nzuri” ni Kiswahili cha asili kinachoweza kumaanisha lulu zenye ubora, bila kulazimisha wazo la thamani ambalo halikutajwa wazi.
theological_decisions:
- issue: Upeo wa ulinganisho katika kauli ya mfano
  choice: Ufalme unalinganishwa moja kwa moja na mfanyabiashara.
  alternative: Ufalme ni kama hali nzima inayomhusu mfanyabiashara anayetafuta lulu nzuri.
  rationale: Muundo wa Kigiriki ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ humweka mfanyabiashara kama kiini cha karibu cha ulinganisho. Tafsiri haifafanui zaidi maana ya sitiari, hivyo inadumisha mvutano wa mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Mfanyabiashara” ni neno la kawaida kuliko istilahi za kizamani, na “aliyekuwa akitafuta” hudumisha hali ya tendo linaloendelea.
