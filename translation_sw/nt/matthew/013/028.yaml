  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: mwenye shamba anasema kwamba adui ndiye aliyetenda jambo hili, kisha watumwa wanamuuliza kama anataka waende wakusanye magugu. “Watumwa wake” hutoa kwa kawaida uhusiano unaoeleweka wa δοῦλοι αὐτῷ, na “twende tukayakusanye” huhifadhi mfuatano wa kwenda na kukusanya, pamoja na kiwakilishi cha wingi kinachorejelea magugu ya muktadha.'
