  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: sw
  text: Akawaambia, “Adui ndiye aliyefanya hivi.” Basi watumwa[a] wake wakamwambia, “Je, unataka twende tukayakusanye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.” Neno la Kigiriki linaweza kumaanisha “watumwa” au “watumishi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Akawaambia
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuwasilisha kitenzi cha kusema pamoja na walengwa wake katika simulizi.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: Adui
  rationale: Ingawa kirai hicho kwa muundo ni ‘mtu adui,’ neno ἄνθρωπος linamtambulisha adui kama mtu binafsi; ‘adui’ pekee ni Kiswahili cha asili bila kupoteza maana hiyo.
- source_word: τοῦτο ἐποίησεν
  choice: ndiye aliyefanya hivi
  rationale: Muundo huu unadumisha msisitizo wa kumtambua aliyesababisha jambo hilo na kutoa kwa kawaida tendo lililokamilika.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Katika mazingira ya kaya na shamba la bwana, neno hili linaonyesha watu waliokuwa chini ya mamlaka yake kwa hali ya utumwa. ‘Watumwa’ linahifadhi wazi uhalisi huo wa kijamii; ‘watumishi’ limetolewa kama tafsiri mbadala katika tanbihi.
- source_word: οὖν
  choice: Basi
  rationale: Hapa neno hilo linaendeleza mazungumzo na kuonyesha hatua inayofuata kutokana na jibu la bwana; ‘Basi’ linafanya hivyo kwa kawaida.
- source_word: Θέλεις
  choice: unataka
  rationale: Hii ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka ya kitenzi kinachoonyesha kutaka au kuwa na nia.
- source_word: ἀπελθόντες συλλέξωμεν αὐτά
  choice: twende tukayakusanye
  rationale: Vitenzi vinavyofuatana vinahifadhi kwanza kwenda na kisha kukusanya. Kiambishi ‘-ya-’ kinarejelea magugu yaliyotajwa katika muktadha, bila kurudia nomino hapa.
theological_decisions:
- issue: Tafsiri ya δοῦλοι katika mfano
  choice: watumwa
  alternative: watumishi
  rationale: ‘Watumwa’ linaonyesha kwa uwazi hadhi ya utegemezi na mamlaka iliyokuwapo katika ulimwengu wa mfano. Kwa kuwa neno la Kigiriki pia linaweza kutafsiriwa ‘watumishi’ kulingana na muktadha, mbadala huo umehifadhiwa katika tanbihi bila kufanya hoja ya kiteolojia itegemee uchaguzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia viunganishi vya kawaida (‘Aka-’, ‘Basi’) bila kuwa wa kale kupita kiasi. Swali limeundwa kwa uwazi huku mpangilio wa kwenda kisha kukusanya ukihifadhiwa.
