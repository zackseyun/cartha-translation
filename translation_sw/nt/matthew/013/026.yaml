base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: sw
  text: Lakini mimea ilipochipua na kutoa nafaka, ndipo magugu[a] nayo yalipoonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ikawa aina mahususi ya magugu yanayofanana na ngano; wakati mwingine huitwa darnel au tares.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini ... ilipo-
  rationale: ὅτε inaanzisha kishazi cha wakati, na δέ ni kiunganishi chepesi chenye hali ya utofautishaji. Muundo huu wa Kiswahili unaonyesha wakati na tofauti hiyo kwa kawaida.
- source_word: ἐβλάστησεν
  choice: ilipoota
  rationale: Kitenzi βλαστάνω humaanisha kuchipua au kuota. ‘Ilipoota’ ni lugha ya kawaida katika muktadha wa mimea na pia inaunganisha vizuri mfuatano wa matukio.
- source_word: ὁ χόρτος
  choice: mimea
  rationale: χόρτος hapa ni jina la ujumla linalorejelea mimea ya shambani iliyokuwa ikikua, si nyasi za kawaida. ‘Mimea’ haisisitizi aina yake kabla ya kutajwa kwa nafaka.
- source_word: καρπὸν ἐποίησεν
  choice: kuzaa nafaka
  rationale: Kirai hiki kwa maana halisi ni ‘kutoa/kuzaa mazao.’ Kwa kuwa muktadha ni shamba la ngano, ‘nafaka’ huwasilisha maana ya zao linalokusudiwa kwa uwazi na kwa lugha ya kawaida.
- source_word: τότε
  choice: ndipo
  rationale: τότε huonyesha hatua inayofuata katika mfuatano wa wakati. ‘Ndipo’ inafaa katika ujenzi wa Kiswahili ‘ndipo ... yalipoonekana.’
- source_word: ἐφάνη
  choice: yalipoonekana
  rationale: Hapa φαίνω ina maana ya kuwa wazi au kuonekana. ‘Yalipoonekana’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: καὶ τὰ ζιζάνια
  choice: magugu nayo
  rationale: ζιζάνια ni magugu ya shambani, labda aina mahususi inayofanana na ngano. ‘Magugu’ linaeleweka kwa urahisi, na ‘nayo’ linawakilisha nguvu ya nyongeza ya καί.
theological_decisions:
- issue: Utambulisho mahususi wa ζιζάνια
  choice: Neno la jumla ‘magugu’ limetumiwa katika matini kuu.
  alternative: Aina mahususi ya gugu linalofanana na ngano, ambalo wakati mwingine huitwa darnel au tares.
  rationale: Neno la Kigiriki linaweza kutaja gugu mahususi, lakini mstari wenyewe haulazimishi utambulisho sahihi wa kibotania. Tafsiri ya jumla huhifadhi uhakika wa matini bila kuingiza utambulisho usio na uhakika; uwezekano mahususi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘ndipo ... yalipoonekana’ unatoa mfuatano wa simulizi kwa kawaida. Alama ya tanbihi imewekwa baada ya ‘magugu,’ neno linalohusika na mbadala wa kileksia.
