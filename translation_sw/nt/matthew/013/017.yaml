  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: sw
  text: Kwa maana, nawaambia kweli kwamba manabii wengi na waadilifu[a] walitamani kuona yale mnayoyaona, na hawakuyaona; na kusikia yale mnayoyasikia, na hawakuyasikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wenye haki.” Kigiriki kinatumia kivumishi cha wingi kama nomino, kikimaanisha watu waadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: kweli
  rationale: Katika kauli ἀμὴν λέγω ὑμῖν, “kweli” huwasilisha uthibitisho mzito na wa dhati kwa Kiswahili cha kawaida bila kulazimika kunukuu neno “amina.”
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaeleza na kuunga mkono kauli iliyotangulia; “kwa maana” kinaonyesha uhusiano huo kwa uwazi.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni kauli ya moja kwa moja na ya kawaida katika Kiswahili, huku ikihifadhi maana ya msemaji kuwaambia wasikilizaji wake.
- source_word: πολλοὶ προφῆται
  choice: manabii wengi
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya wingi na kundi linalotajwa.
- source_word: δίκαιοι
  choice: watu wenye haki
  rationale: Kivumishi hiki kimetumiwa kama nomino ya watu. “Watu wenye haki” kinaeleweka wazi na hakipunguzi maana kuwa uadilifu wa kijamii pekee.
- source_word: ἐπεθύμησαν
  choice: walitamani
  rationale: Kitenzi kinaonyesha tamaa yenye nguvu; “walitamani” ni cha kawaida na kinafaa katika muktadha huu bila kuleta dhana ya tamaa mbaya.
- source_word: ἰδεῖν ἃ βλέπετε
  choice: kuona mnayoyaona
  rationale: Muundo huu wa Kiswahili ni wa asili na unadumisha uhusiano kati ya shauku yao ya kuona na mambo ambayo wanafunzi wanayaona sasa.
- source_word: οὐκ εἶδαν
  choice: hawakuyaona
  rationale: Kiambishi “-ya-” kinarejelea mambo yanayoonekana na kuwasilisha wazi kwamba hawakupata kuyaona.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: kusikia mnayoyasikia
  rationale: Tafsiri hii inahifadhi usambamba na sehemu ya kuona pamoja na hali ya sasa ya kusikia kwa wasikilizaji.
- source_word: οὐκ ἤκουσαν
  choice: hawakuyasikia
  rationale: Hii inaeleza ukweli wa kihistoria kwamba hawakupata kusikia yale ambayo wanafunzi wanasikia.
theological_decisions:
- issue: Upeo wa δίκαιοι
  choice: watu wenye haki
  alternative: wenye haki
  rationale: Kigiriki kina kivumishi cha wingi kilichotumiwa kama nomino. Tafsiri hii inalitaja kundi la watu kwa uwazi bila kulifanya kuwa sawa na manabii pekee.
- issue: Ni nini kilichoonekana na kusikiwa
  choice: 'Mambo hayo yameachwa bila kutajwa moja kwa moja: “mnayoyaona” na “mnayoyasikia.”'
  alternative: Kutaja kwa ufafanuzi “Masihi,” “Yesu,” au “siri za ufalme.”
  rationale: Muktadha unahusisha ufunuo wa ufalme katika huduma ya Yesu, lakini mstari wenyewe hautaji vitu hivyo kwa majina. Tafsiri inadumisha upana na mvutano wa kauli ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa “kuona/kusikia” na “hawakuyaona/hawakuyasikia” umehifadhiwa, na vitu vinavyoonekana na kusikiwa havijafafanuliwa zaidi ya maandishi ya asili.
