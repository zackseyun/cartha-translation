  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Viwakilishi vya ngeli ya 9 vinadumisha rejeo la umoja lililodokezwa katika Kigiriki. Alama ya tanbihi imewekwa baada ya neno linalohusika, “ikanyauka,” kwa kuwa mbadala huo unahusu ἐξηράνθη.
