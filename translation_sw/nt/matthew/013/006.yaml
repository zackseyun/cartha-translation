base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: sw
  text: Lakini jua lilipochomoza, iliunguzwa na joto; na kwa sababu haikuwa na mzizi, ikanyauka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikakauka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Lakini jua lilipochomoza
  rationale: Muundo huu wa Kigiriki unaonyesha wakati, huku δέ ikileta mwendelezo wenye utofautishaji mdogo. “Jua lilipochomoza” ni Kiswahili cha kawaida na cha wazi.
- source_word: ἐκαυματίσθη
  choice: iliunguzwa na joto
  rationale: Kitenzi hiki cha hali ya kutendwa kinaeleza kuathiriwa kwa mmea na ukali wa joto. Chaguo hili linahifadhi taswira ya mmea bila kudokeza kwamba uliteketezwa kabisa.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: kwa sababu haikuwa na
  rationale: διά pamoja na kitenzi-jina chenye kiambishi cha ukanushi huonyesha sababu; kishazi hiki cha Kiswahili kinatoa sababu hiyo wazi na kwa njia ya asili.
- source_word: ῥίζαν
  choice: mzizi
  rationale: Neno la Kigiriki liko katika umoja, na “mzizi” linaendeleza umoja huo kwa Kiswahili cha kawaida.
- source_word: ἐξηράνθη
  choice: ikanyauka
  rationale: Katika muktadha wa mmea, kitenzi hiki humaanisha kunyauka au kukauka. “Ikanyauka” ni cha asili na kinabainisha matokeo kwa usahihi.
theological_decisions: []
