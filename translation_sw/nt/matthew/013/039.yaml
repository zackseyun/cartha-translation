base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: sw
  text: Adui aliyepanda magugu hayo ni Ibilisi; mavuno ni mwisho wa zama[a], na wavunaji ni malaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utimilifu wa zama”; kwa mapokeo, “mwisho wa ulimwengu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: adui
  rationale: Ni neno la kawaida na la wazi linalohifadhi wazo la mpinzani binafsi katika maelezo ya mfano.
- source_word: ὁ σπείρας αὐτά
  choice: aliyepanda magugu hayo
  rationale: Kitenzi 'alipanda' kinadumisha taswira ya kilimo; 'magugu hayo' hufafanua rejeo la kiwakilishi αὐτά kwa kile kilichotajwa katika muktadha.
- source_word: διάβολος
  choice: Ibilisi
  rationale: Hapa ni jina linalomtambulisha yule mpinzani wa kiroho, si maelezo ya jumla kama 'mchongezi'.
- source_word: θερισμός
  choice: mavuno
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa tendo na wakati wa kuvuna, na inadumisha taswira ya mfano.
- source_word: συντέλεια αἰῶνός
  choice: mwisho wa nyakati hizi
  rationale: '''Nyakati hizi'' huwasilisha maana ya kipindi cha sasa cha historia bila kudokeza moja kwa moja kuangamizwa kwa ulimwengu wa vitu; ''mwisho'' ni ya asili na inaeleweka kwa urahisi.'
- source_word: θερισταί
  choice: wavunaji
  rationale: Ni jina la kawaida kwa watu wanaovuna na linahifadhi sitiari ya kilimo.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Muktadha wa mwisho wa nyakati unaonyesha viumbe wa mbinguni, wala si wajumbe wa kibinadamu.
- source_word: δέ
  choice: naye / na
  rationale: Viunganishi hivyo vinaonyesha mwendelezo wa maelezo kwa Kiswahili cha asili bila kulazimisha maana ya upinzani.
theological_decisions:
- issue: Maana ya αἰών katika συντέλεια αἰῶνός
  choice: mwisho wa nyakati hizi
  alternative: mwisho wa ulimwengu; utimilifu wa kipindi hiki
  rationale: Uamuzi huu huhifadhi maana ya kipindi au zama ya αἰών na huepuka kuifanya kauli iseme kwa lazima mwisho wa ulimwengu wa vitu. Tanbihi inadumisha maana ya kilele au utimilifu iliyomo katika συντέλεια.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Magugu hayo' limetumiwa badala ya kiwakilishi pekee ili rejeo liwe wazi kwa msomaji, huku taswira ya mfano ikidumishwa.
