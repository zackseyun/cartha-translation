id: MAT.13.44
reference: Matthew 13:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: sw
  text: Ufalme wa mbinguni ni kama hazina iliyofichwa shambani, ambayo mtu mmoja aliipata na kuificha. Kwa furaha yake, anaenda na kuuza kila kitu alicho nacho, kisha analinunua shamba lile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: ni kama
  rationale: Hii ni kauli ya kawaida na ya asili ya Kiswahili ya kuanzisha mlinganisho katika mfano.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  rationale: Huhifadhi usemi maalumu wa Mathayo na maana pana ya βασιλεία bila kuibana iwe eneo pekee au tendo la kutawala pekee.
- source_word: θησαυρῷ
  choice: hazina
  rationale: Neno hili ni la kawaida, lenye heshima, na linaweza kumaanisha mali ya thamani iliyohifadhiwa; Kiswahili hakihitaji kibainishi kinacholingana na neno la Kiingereza 'a'.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: iliyofichwa shambani
  rationale: Huonyesha hali inayoendelea iliyotokana na kufichwa, kama participio timilifu ya Kiyunani, kwa Kiswahili cha kawaida.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: ambayo mtu mmoja aliipata
  rationale: Kiwakilishi 'ambayo' kinarejelea wazi hazina, na 'mtu mmoja' humtambulisha mhusika wa mfano bila kumfanya kuwa mtu maalumu anayejulikana.
- source_word: ἔκρυψεν
  choice: na kuificha
  rationale: Huhifadhi tendo la pili la kuficha hazina bila kuongeza wazi neno 'tena,' ambalo halipo katika matini ingawa linaweza kudokezwa na muktadha.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: Kwa furaha yake
  rationale: Usemi huu wa asili unabeba hali ya furaha na nguvu yake ya kumsukuma kutenda, bila kulazimisha ufafanuzi mwembamba zaidi.
- source_word: ὑπάγει καὶ πωλεῖ
  choice: anaenda na kuuza
  rationale: Wakati wa sasa umehifadhiwa ili kuonyesha usimulizi hai wa Kiyunani, huku muundo ukibaki wa kawaida katika Kiswahili.
- source_word: πάντα ὅσα ἔχει
  choice: kila kitu alicho nacho
  rationale: Hutoa kwa uwazi wazo la jumla lisiloacha chochote, kwa lugha ya kawaida ya kisasa.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: analinunua shamba lile
  rationale: Kiambishi 'li-' kinaonyesha shamba kuwa kitu kinachonunuliwa, na 'lile' huhifadhi msisitizo wa demonstrativi ἐκεῖνον kwa shamba hususa.
theological_decisions:
- issue: Maana ya βασιλεία
  choice: Ufalme
  alternative: Utawala
  rationale: βασιλεία inaweza kuhusisha kutawala na milki; 'ufalme' ni tafsiri pana na iliyozoeleka ambayo haiiondoi maana ya utawala wa Mungu.
- issue: Utambulisho wa ἄνθρωπος
  choice: mtu mmoja
  alternative: mwanamume mmoja
  rationale: Katika Kiyunani ἄνθρωπος hapa humtambulisha binadamu asiyeainishwa; tofauti na ἀνήρ, neno lenyewe halilazimishi jinsia ya kiume. 'Mtu mmoja' huhifadhi hali yake ya mhusika mwakilishi bila kuongeza jambo lisilosemwa wazi.
- issue: Sababu na hali katika ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: Kwa furaha yake
  alternative: Kwa sababu ya furaha yake
  rationale: Tafsiri iliyochaguliwa hudumisha kwa pamoja hali ya kihisia na msukumo wa kitendo, badala ya kuamua kwamba kishazi kinaeleza sababu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku wakati wa sasa wa usimulizi katika ὑπάγει, πωλεῖ na ἀγοράζει ukihifadhiwa. Hakuna tanbihi iliyoongezwa kwa tofauti ya kibainishi katika θησαυρῷ kwa sababu Kiswahili hakina vibainishi vinavyolingana na 'a/the,' hivyo tofauti hiyo haiwezi kuwakilishwa kwa njia ya kawaida.
