  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: sw
  text: Yesu aliwaambia watu waliokusanyika mambo haya yote kwa mifano, wala hakuwaambia jambo lolote bila mfano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hakuwa akisema nao bila mfano.” Kitenzi cha Kigiriki kinaweza kuonyesha jambo alilokuwa akifanya kwa kawaida au kusimulia tu jambo la wakati uliopita.
    reason: Tofauti hii huhifadhi uwezekano wa kuelewa wakati usiotimilifu wa Kigiriki kama wa desturi/kuendelea au kama wakati uliopita wa kawaida, huku ikidumisha “bila mfano.”
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: mambo haya yote
  rationale: Huhifadhi nguvu ya kiashiria ‘haya’ pamoja na maana jumuishi ya ‘yote’ kwa Kiswahili cha kawaida.
- source_word: ἐλάλησεν
  choice: aliwaambia
  rationale: Kitenzi hiki kinafupisha tendo la Yesu la kuzungumza na watu; ‘aliwaambia’ ni cha asili kwa kuwa walengwa wametajwa wazi.
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: ‘Kwa’ huonyesha namna au njia ya kusema, huku ‘mifano’ likiwa neno la kawaida la kibiblia kwa παραβολαί.
- source_word: τοῖς ὄχλοις
  choice: watu waliokusanyika
  rationale: Huwasilisha kwa lugha ya sasa umati uliokuwa umekusanyika bila kutumia ‘makutano,’ ambalo linaweza kueleweka kama kusanyiko la kidini.
- source_word: χωρὶς παραβολῆς
  choice: bila mfano
  rationale: Huhifadhi maana ya ‘pasipo/bila’ na umoja wa παραβολῆς kwa Kiswahili kifupi na cha asili.
- source_word: οὐδὲν ἐλάλει
  choice: hakuwaambia jambo lolote
  rationale: Muundo huu unaonyesha desturi au hali iliyoendelea ya kutowaambia jambo pasipo mfano, na unasomeka kwa kawaida kuliko tafsiri ya neno kwa neno.
- source_word: αὐτοῖς
  choice: -wa- katika ‘hakuwaambia’
  rationale: Kiambishi cha yambwa ‘-wa-’ kinawarejelea watu waliokusanyika bila kurudia nomino.
theological_decisions:
- issue: Msisitizo wa hali ya kitenzi ἐλάλει katika kishazi cha pili
  choice: hakuwaambia jambo lolote
  alternative: hakusema nao jambo lolote
  rationale: Wakati usiotimilifu wa Kigiriki unaweza kuonyesha namna ya kawaida au iliyoendelea ya Yesu kusema na watu katika mazingira haya. Tafsiri kuu inadokeza hali hiyo bila kuifanya kuwa dai la jumla kuhusu kila tukio, huku tanbihi ikihifadhi uwezekano wa kusimulia kwa wakati uliopita tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watu waliokusanyika’ limechaguliwa badala ya ‘makutano’ ili kuepuka ladha ya kizamani au maana maalumu ya kidini; ‘mfano’ linadumisha istilahi ya kawaida ya Biblia.
