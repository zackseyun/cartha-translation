  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwenye udongo” ni ya kawaida na inayoeleweka kwa urahisi; muundo wa “zikawa zikizaa” umetumiwa ili kuonyesha tendo linaloendelea bila kupoteza taswira ya kilimo.
