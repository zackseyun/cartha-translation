  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: sw
  text: 'Lakini mbegu nyingine zilianguka kwenye udongo mzuri na zikatoa mazao: nyingine mara mia, nyingine mara sitini, na nyingine mara thelathini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moja mara mia, nyingine mara sitini, na nyingine mara thelathini.” Muundo wa Kigiriki wa kugawanya unaweza kuwakilishwa kwa “nyingine ... nyingine ... nyingine” au kwa “moja ... nyingine ... nyingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: mbegu nyingine
  rationale: Kivumishi cha wingi kisicho na nomino kinarejelea mbegu zilizotajwa katika muktadha; neno “mbegu” limeongezwa kwa uwazi, huku upatanisho wa “zilianguka” ukionyesha wingi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya matokeo haya na yale ya mbegu zilizotangulia.
- source_word: ἔπεσεν
  choice: zilianguka
  rationale: Huhifadhi picha halisi ya mbegu kuanguka, badala ya kubadili kitenzi kuwa “zilipandwa.”
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: kwenye udongo mzuri
  rationale: Katika muktadha wa kilimo, “udongo” ni tafsiri ya kawaida na sahihi ya γῆ, na “mzuri” hapa hudokeza udongo unaofaa na wenye rutuba.
- source_word: ἐδίδου καρπόν
  choice: zikawa zikizaa matunda
  rationale: Muundo huu unaonyesha tendo lililoendelea la kitenzi cha wakati usiotimilika ἐδίδου na kuhifadhi taswira ya “matunda.”
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: nyingine mara mia, nyingine mara sitini, na nyingine mara thelathini
  rationale: Huwakilisha mgawanyo wa mavuno tofauti na kufanya wazi kwamba namba zinaonyesha kiwango cha ongezeko la mazao.
