  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: sw
  text: 'Na kwao unabii wa Isaya unatimia[a], usemao:


    “Hakika mtasikia, lakini hamtaelewa kamwe;

    na mtatazama sana, lakini hamtatambua kamwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “Kwa kusikia mtasikia ... na mkitazama mtatazama.” Huu ni usemi wa mtindo wa Kiebrania wa kusisitiza, uliowasilishwa katika Kigiriki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: unatimia
  rationale: Kitenzi cha wakati uliopo na hali ya kutendwa kinaonyesha kwamba unabii unatimizwa kwao. Kiswahili cha kawaida hutumia ‘unatimia’ kwa hali hii bila kulazimisha maana yenye nguvu zaidi ya ‘unatimizwa kikamilifu.’
- source_word: αὐτοῖς
  choice: kwao
  rationale: Hutoa kwa Kiswahili cha kawaida maana kwamba unabii huo unatimia katika hali ya watu hao, bila kufanya usemi usio wa kawaida wa ‘ndani yao.’
- source_word: προφητεία Ἠσαΐου
  choice: unabii wa Isaya
  rationale: Ni tafsiri ya kawaida na ya karibu ya muundo wa Kigiriki wa umilikaji.
- source_word: ἡ λέγουσα
  choice: usemao
  rationale: Kivumishi hiki cha kitenzi kinatanguliza maneno yaliyonukuliwa; ‘usemao’ ni fasaha na hulingana na nomino ‘unabii.’
- source_word: Ἀκοῇ ἀκούσετε
  choice: Hakika mtasikia
  rationale: Muundo unaorudia mzizi wa kitenzi ni njia ya Kisemiti ya kusisitiza. ‘Hakika’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida; muundo halisi zaidi umeelezwa katika tanbihi.
- source_word: οὐ μὴ συνῆτε
  choice: lakini hamtaelewa kamwe
  rationale: οὐ μή ni ukanushi wenye nguvu. ‘Kamwe’ huhifadhi nguvu hiyo, na ‘lakini’ huonyesha wazi tofauti iliyomo katika muktadha.
- source_word: βλέποντες βλέψετε
  choice: na hakika mtatazama
  rationale: ‘Hakika’ huhifadhi msisitizo wa marudio ya Kigiriki. ‘Kutazama’ pia hutofautisha tendo la kutumia macho na ufahamu wa ndani unaokanushwa katika kishazi kinachofuata.
- source_word: οὐ μὴ ἴδητε
  choice: lakini hamtaona kamwe
  rationale: Hapa ‘kuona’ huweza kumaanisha kufahamu au kutambua kile kinachoonekana. Ukanushi ‘kamwe’ huhifadhi nguvu ya οὐ μή bila kuondoa mvutano kati ya kuona kwa macho na kuona kwa ufahamu.
theological_decisions:
- issue: Maana ya kutimia kwa unabii
  choice: Unabii wa Isaya unatimia kwa watu hawa
  alternative: Unabii unaonyeshwa tu kwa mfano kwao, au unakamilishwa kwao kwa maana pana zaidi
  rationale: ‘Unatimia’ huhifadhi kauli ya maandiko bila kuamua kimbele namna ya kitheolojia ambayo kutosikia kwao kunahusiana na ugumu wa moyo, uamuzi wa Mungu, au wajibu wa binadamu.
- issue: Uhusiano kati ya kuona na kufahamu
  choice: Kutazama kwa macho kunatofautishwa na kuona kwa maana ya kutambua
  alternative: Kutumia ‘kuona’ kwa vitenzi vyote viwili
  rationale: Tofauti hii huonyesha mabadiliko ya vitenzi vya Kigiriki (βλέπω na ὁράω) huku ikiendeleza mvutano wa maandishi kati ya kupokea hisi na kufahamu, bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa kishairi wa nukuu umehifadhi usambamba wa vipashio viwili.
