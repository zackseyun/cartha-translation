  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: sw
  text: Kila mtu anaposikia neno la ufalme na asipolielewa, yule Mwovu[a] huja na kunyakua kile kilichopandwa moyoni mwake. Huyu ndiye aliyepandwa kando ya njia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule mwovu.”
    reason: Tofauti ya uandishi kwa herufi kubwa au ndogo inaweza kuonyesha jina la cheo au maelezo ya tabia; Kigiriki chenyewe hakitofautishi kwa herufi kubwa kama Kiswahili cha kisasa.
  - marker: b
    text: Au, “aliyepandwa kando ya barabara.”
    reason: ὁδός inaweza kumaanisha njia, kijia, au barabara kulingana na mazingira; Kigiriki kinadumisha taswira ya kupanda kando yake.
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Kila mtu anapolisikia
  rationale: Muundo wa Kigiriki unaeleza hali inayomhusu mtu yeyote anayesikia. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kila mmoja bila kuwa na ugumu wa tafsiri ya neno kwa neno.
- source_word: λόγον τῆς βασιλείας
  choice: neno la ufalme
  rationale: “Neno” linahifadhi taswira inayounganisha ujumbe na mbegu katika mfano, huku “la ufalme” likifuata uhusiano wa maneno ya Kigiriki bila kuufafanua kupita kiasi.
- source_word: μὴ συνιέντος
  choice: lakini halielewi
  rationale: Kitenzi kinamaanisha kutoelewa au kutambua maana. Kiambishi “li-” kinarejelea “neno” kwa Kiswahili cha kawaida.
- source_word: ὁ πονηρὸς
  choice: yule Mwovu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama jina la mhusika binafsi. “Yule Mwovu” kinaonyesha mhusika huyo bila kumtaja kwa jina ambalo mstari wenyewe hautoi.
- source_word: ἁρπάζει
  choice: hunyakua
  rationale: “Kunyakua” huonyesha tendo la ghafla na la nguvu la kuondoa kitu, kama ilivyo katika kitenzi cha Kigiriki.
- source_word: τὸ ἐσπαρμένον
  choice: kile kilichopandwa
  rationale: Muundo huu unahifadhi hali ya kutendwa na hauongezi wazi kwamba kinachopandwa ni mbegu, ingawa taswira hiyo iko katika mfano.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: moyoni mwake
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi istilahi ya kibiblia “moyo” bila kuibadili kuwa maelezo ya ndani ya mtu.
- source_word: οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Huyu ndiye aliyepandwa kando ya njia
  rationale: Tafsiri hii inahifadhi utambulisho wa kimajazi kati ya msikilizaji na kile kilichopandwa, badala ya kuufafanua au kuusawazisha kimyakimya.
theological_decisions:
- issue: Utambulisho wa ὁ πονηρὸς
  choice: mhusika binafsi, “yule Mwovu”
  alternative: uovu kama nguvu isiyo ya kibinafsi
  rationale: Muktadha unamwonyesha akija na kunyakua kilichopandwa, hivyo matumizi ya kibinafsi yanafaa zaidi. Hata hivyo, tafsiri haiongezi jina maalumu lisilopo katika mstari.
- issue: Utambulisho wa mtu na kilichopandwa katika οὗτός ... σπαρείς
  choice: “Huyu ndiye aliyepandwa”
  alternative: “Hii ndiyo mbegu iliyopandwa” au “Huyu ni mtu anayefananishwa na mbegu iliyopandwa”
  rationale: Kigiriki kinatumia umoja wa kiume na kumtambulisha mtu kwa taswira ya kilichopandwa. Tafsiri inadumisha mvutano huo wa kimajazi bila kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Hunyakua” huhifadhi uhai wa taswira, na “moyoni mwake” ni usemi wa kawaida wa kibiblia na wa kisasa. Alama za tanbihi zimewekwa karibu na maneno yanayohusika moja kwa moja.
