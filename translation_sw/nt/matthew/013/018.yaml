  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: sw
  text: Basi ninyi, sikilizeni mfano wa yule aliyepanda mbegu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kimetajwa wazi na kina mkazo katika Kigiriki; “ninyi” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: basi
  rationale: “Basi” linaonyesha mpito au hitimisho kutokana na yaliyotangulia bila kufanya uhusiano huo uwe wa kimantiki kupita kiasi.
- source_word: ἀκούσατε
  choice: sikilizeni
  rationale: Ni amri ya nafsi ya pili wingi. Katika muktadha wa mafundisho, “sikilizeni” ni ya kawaida na huhifadhi wito wa kutega sikio bila kuingiza moja kwa moja maana ya “eleweni.”
- source_word: παραβολὴν
  choice: mfano
  rationale: “Mfano” ni neno la kawaida na linaloeleweka kwa παραβολή katika mapokeo ya Kiswahili, likimaanisha simulizi la kufundishia katika muktadha huu.
- source_word: τοῦ σπείραντος
  choice: wa yule aliyepanda mbegu
  rationale: Huhifadhi muundo wa kisifa wa kishiriki cha wakati uliopita, “yule aliyepanda,” badala ya kukifanya cheo maalumu; “mbegu” imewekwa wazi ili kitenzi “panda” kisieleweke kama kupanda juu.
theological_decisions:
- issue: Kiwango cha maana katika ἀκούσατε
  choice: sikilizeni
  alternative: eleweni
  rationale: “Eleweni” lingeweza kuendana na kusudi la muktadha, lakini lingefasiri zaidi ya kitenzi ἀκούω. Tafsiri imehifadhi amri ya kusikiliza na kuacha uhusiano wake na kuelewa uendelee kutokana na muktadha.
- issue: Utambulisho wa τοῦ σπείραντος
  choice: yule aliyepanda mbegu
  alternative: mpanzi
  rationale: Kigiriki kina kishiriki chenye kibainishi, si lazima cheo maalumu. Uchaguzi huu unahifadhi tendo lililokamilika na huepuka kulazimisha “Mpanzi” kuwa jina au cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Basi ninyi” huhifadhi mkazo wa kiwakilishi bila kuwa mzito; “aliyepanda mbegu” ni wazi na wa kawaida.
