base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: sw
  text: Watumwa wa bwana wa nyumba wakamjia, wakamwambia, “Bwana, hukupanda mbegu nzuri katika shamba lako? Basi magugu[a] yametoka wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magugu ya darneli”; neno la Kigiriki huenda linamaanisha gugu linalofanana na ngano katika hatua za mwanzo za ukuaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: wakamjia
  rationale: Kitenzi hiki kinaonyesha kuwa walimsogelea mwenye nyumba kabla ya kusema; “wakamjia” ni cha kawaida katika Kiswahili na kinaunganisha tendo hilo na “wakamwambia” kwa mtiririko wa simulizi.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linaonyesha watu walio chini ya mamlaka ya bwana wao kwa hali ya utumwa, si wafanyakazi wa hiari tu. “Watumwa” linahifadhi wazi uhusiano huo wa kijamii katika mfano.
- source_word: οἰκοδεσπότου
  choice: mwenye nyumba
  rationale: Neno la Kigiriki humaanisha mkuu au mwenye mamlaka ya nyumba. “Mwenye nyumba” ni usemi wa kawaida na wenye staha unaofaa muktadha huu wa kaya na shamba.
- source_word: Κύριε
  choice: Bwana
  rationale: Hapa ni namna ya heshima ya kumwita mwenye nyumba. “Bwana” huhifadhi maana ya mamlaka ya κύριος bila kudai kwamba katika mazungumzo haya neno lenyewe ni tamko la moja kwa moja kuhusu utambulisho wa Kristo.
- source_word: οὐχὶ
  choice: huku-
  rationale: Muundo wa swali “hukupanda...?” unatarajia jibu la kukubali na hivyo unaonyesha nguvu ya οὐχί kwa Kiswahili cha kawaida.
- source_word: καλὸν σπέρμα
  choice: mbegu nzuri
  rationale: Hii ndiyo maana ya kawaida ya kilimo na inasikika kwa urahisi katika Kiswahili.
- source_word: ἔσπειρας
  choice: kupanda
  rationale: Katika Kiswahili, “kupanda mbegu” ni usemi wa kawaida wa tendo la kutia mbegu shambani, hivyo unawasilisha kwa usahihi maana ya σπείρω.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: katika shamba lako
  rationale: Tafsiri hii inahifadhi mahali na umilikaji ulioonyeshwa na Kigiriki.
- source_word: πόθεν οὖν
  choice: Basi ... yametoka wapi
  rationale: “Yametoka wapi” linauliza chanzo au asili kama πόθεν, huku “Basi” likionyesha hitimisho au mshangao unaotokana na swali la kwanza kama οὖν.
- source_word: ἔχει ζιζάνια
  choice: magugu yametoka wapi
  rationale: Ingawa Kigiriki kwa muundo wa ndani husema shamba “lina” magugu, swali linahusu chanzo chake. Muundo huu ni wa asili zaidi katika Kiswahili na unahifadhi hoja ya swali bila kulazimisha usemi usio wa kawaida.
- source_word: ζιζάνια
  choice: magugu
  rationale: “Magugu” ni neno wazi na la kawaida. Neno la Kigiriki huenda linataja hasa darneli, lakini usahihi huo wa kibotania hauhakikishwi kabisa na umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya δοῦλοι katika mazingira ya kaya ya mfano
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” halainishi hadhi ya watu hawa chini ya mwenye nyumba. Hata hivyo, aya yenyewe haisemi kwamba utumwa unaidhinishwa; inasimulia tu uhusiano wa wahusika katika mfano.
- issue: Tafsiri ya κύριε katika mazungumzo ya mfano
  choice: Bwana
  alternative: Mheshimiwa; mkuu wangu
  rationale: “Bwana” ni tafsiri ya kawaida na yenye heshima ya κύριε. Katika muktadha huu ni namna ya kumwita mwenye nyumba, huku uwezekano wa mwangwi mpana wa neno “Bwana” ukiendelea bila kugeuzwa kuwa dai la wazi la kikristo katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vitenzi mfululizo “wakamjia na kumwambia” unaendeleza simulizi kwa kawaida. “Basi magugu yametoka wapi?” ni swali la asili linalohifadhi mkazo juu ya chanzo cha magugu.
