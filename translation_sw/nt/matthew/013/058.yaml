  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: sw
  text: Naye hakufanya miujiza mingi huko kwa sababu ya kutokuamini kwao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo mengi ya nguvu.” Neno la Kigiriki linamaanisha matendo yanayodhihirisha nguvu, na katika muktadha huu linarejelea miujiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Naye hakufanya
  rationale: Καί inaendeleza simulizi, na οὐκ inakanusha tendo la ἐποίησεν. “Hakufanya” huonyesha kutotenda, si kutoweza, huku “naye” ikiunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea mahali alikokuwa, yaani eneo la kwao katika muktadha uliotangulia.
- source_word: δυνάμεις πολλὰς
  choice: miujiza mingi
  rationale: Katika masimulizi ya Injili, δύναμις hutaja tendo linalodhihirisha nguvu, hasa tendo la kimiujiza. “Miujiza mingi” ni usemi wa asili na unaoeleweka wazi katika Kiswahili; tanbihi inadumisha maana ya msingi ya nguvu.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: kwa sababu ya kutokuamini kwao
  rationale: Διά pamoja na hali ya kushutumiwa huonyesha sababu. Ἀπιστία hapa ni kutokuamini au ukosefu wa imani; “kutokuamini kwao” inadumisha nguvu hasi ya nomino na muktadha wa kumkataa Yesu.
theological_decisions:
- issue: Ikiwa aya inamaanisha Yesu hakuweza kufanya miujiza au hakufanya miujiza mingi
  choice: hakufanya miujiza mingi
  alternative: hakuweza kufanya miujiza mingi
  rationale: Mathayo anatumia οὐκ ἐποίησεν, “hakufanya,” wala si kitenzi kinachoonyesha kutoweza. Tafsiri inadumisha kauli kuhusu tendo bila kuingiza dai lenye nguvu zaidi kuhusu uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Miujiza” imetumiwa katika matini kuu kwa ufasaha, huku tanbihi ikihifadhi uhusiano wa neno la Kigiriki na dhana ya nguvu.
