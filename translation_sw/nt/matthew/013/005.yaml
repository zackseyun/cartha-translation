  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: sw
  text: Mbegu nyingine zilianguka mahali penye miamba[a], ambapo hapakuwa na udongo mwingi, nazo zikaota mara moja kwa sababu udongo haukuwa na kina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “sehemu zenye miamba”; yaani, sehemu zenye udongo mwembamba juu ya mwamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Mbegu nyingine
  rationale: Kivumishi cha wingi cha jinsia ya kati kinarejelea kwa ufupisho mbegu zilizotajwa katika mstari uliotangulia; ‘mbegu’ imeongezwa kwa uwazi wa Kiswahili.
- source_word: ἔπεσεν
  choice: zilianguka
  rationale: Kitenzi humaanisha moja kwa moja ‘zilianguka’; hakibadilishwi kuwa ‘zilipandwa,’ jambo ambalo lingeongeza maana isiyotamkwa.
- source_word: ἐπὶ τὰ πετρώδη
  choice: mahali penye miamba
  rationale: Kirai hiki ni ‘sehemu zenye miamba’; hapa kinaashiria udongo mwembamba ulio juu ya mwamba, si udongo wenye kokoto nyingi tu.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: ambapo hapakuwa na udongo mwingi
  rationale: Muundo huu ni wa kawaida na wazi kwa Kiswahili, huku ukihifadhi wazo la kiasi kidogo cha udongo mahali hapo.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: nazo zikaota mara moja
  rationale: ἐξανέτειλεν katika muktadha wa kilimo ni kuota au kuchipuka, na εὐθέως huonyesha kwamba jambo hilo lilitokea mara moja.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: kwa sababu udongo haukuwa na kina
  rationale: διά pamoja na kitenzi-jina hutoa sababu; tafsiri hii huhifadhi picha ya udongo usio na kina.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Wingi umetumiwa kwa ‘mbegu’ na vitenzi vyake kwa kuwa Kiswahili kwa kawaida huchukulia mbegu zinazotawanyika kama vitu vingi, ingawa Kigiriki kina kitenzi cha umoja baada ya nomino ya wingi ya jinsia ya kati.
