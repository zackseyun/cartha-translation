  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: sw
  text: Akawawekea mfano mwingine, akisema, “Ufalme wa mbinguni ni kama mbegu ya haradali ambayo mtu aliichukua na kuipanda katika shamba lake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: akawawekea
  rationale: Kitenzi hiki huleta picha ya kuweka au kuwasilisha jambo mbele ya wasikilizaji. ‘Akawawekea mfano’ ni Kiswahili cha asili kinachodumisha picha hiyo bila kutumia maelezo marefu.
- source_word: παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ndilo neno la kawaida na linaloeleweka katika Kiswahili cha Biblia kwa simulizi linganishi la mafundisho; muktadha unatofautisha maana hii na mfano wa kawaida.
- source_word: Ὁμοία ἐστὶν
  choice: ni kama
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kauli ya ulinganisho.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  rationale: Usemi huu uliokita katika Kiswahili unahifadhi istilahi maalumu ya Mathayo na kuacha maana pana ya utawala na milki ya Mungu bila kuibana.
- source_word: κόκκῳ σινάπεως
  choice: mbegu ya haradali
  rationale: ‘Mbegu ya haradali’ ni usemi wazi na wa kawaida kwa κόκκος σινάπεως katika picha hii ya kilimo.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ambayo mtu aliichukua
  rationale: ‘Mtu’ humwakilisha mhusika mmoja bila kulazimisha jinsia ambayo neno ἄνθρωπος lenyewe halidai hapa; ‘aliichukua’ hudumisha dhana ya λαβών.
- source_word: ἔσπειρεν
  choice: kuipanda
  rationale: Ingawa σπείρω kwa usahihi ni ‘kupanda kwa kutawanya mbegu,’ katika Kiswahili ‘kupanda mbegu’ ni usemi wa kawaida na sahihi zaidi kuliko ‘kusia’ kwa wasomaji wengi wa leo.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: katika shamba lake
  rationale: ‘Shamba lake’ huwasilisha kwa uwazi mazingira ya kilimo na umilikaji unaoonyeshwa na αὐτοῦ.
theological_decisions:
- issue: Tafsiri ya usemi wa Mathayo βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  alternative: Utawala wa mbinguni
  rationale: ‘Ufalme wa mbinguni’ huhifadhi usemi maalumu wa Mathayo na haifungi maana katika tendo la kutawala pekee; hivyo mvutano kati ya utawala na milki unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata kwa karibu mtiririko wa Kigiriki huku ukibaki wa asili katika Kiswahili.
