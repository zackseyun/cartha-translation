source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: sw
  text: Kisha akawaambia, “Kwa hiyo, kila mwandishi wa sheria aliyefundishwa kwa ajili ya ufalme wa mbinguni[a] ni kama mwenye nyumba[b] anayetoa kutoka katika hazina yake[c] vitu vipya na vya zamani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyefanywa mwanafunzi wa ufalme wa mbinguni.” Kitenzi cha Kigiriki kinaweza kumaanisha kufanywa mwanafunzi na pia kufundishwa au kupewa mafunzo.
    reason: alternative_reading
  - marker: b
    text: Au, “mkuu wa nyumba” au “mkuu wa kaya.”
    reason: lexical_alternative
  - marker: c
    text: “Hazina” hapa inaweza pia kumaanisha chumba au ghala ambamo vitu vya thamani huhifadhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na mazungumzo yaliyotangulia, kwa Kiswahili cha kawaida na bila kuongeza sababu isiyotajwa.
- source_word: πᾶς γραμματεὺς
  choice: kila mwandishi wa sheria
  rationale: Neno γραμματεύς kimsingi humaanisha mwandishi, na katika mazingira ya Kiyahudi humtaja mtaalamu wa Maandiko au sheria. “Mwandishi wa sheria” huhifadhi picha ya msingi huku likifafanua kazi yake kwa msomaji wa sasa.
- source_word: μαθητευθεὶς
  choice: aliyefundishwa
  rationale: Kauli tendwa ya kitenzi hiki ina wazo la mtu kufanywa mwanafunzi au kupewa mafunzo. “Aliyefundishwa” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana mbadala ya kufanywa mwanafunzi.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: kuhusu ufalme wa mbinguni
  rationale: Dativu hapa ina uhusiano usio wa kawaida na μαθητευθεὶς. “Kuhusu” huonyesha eneo au lengo la mafunzo bila kuamua kwa nguvu kuwa ni “katika” au “kwa ajili ya” ufalme.
- source_word: ὅμοιός ἐστιν
  choice: ni kama
  rationale: Hii ndiyo namna ya kawaida na wazi ya kuanzisha ulinganisho katika Kiswahili.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: mwenye nyumba
  rationale: οἰκοδεσπότης ni mwenye mamlaka au mkuu wa nyumba. “Mwenye nyumba” ni usemi mfupi na wa kawaida unaofaa picha hii, ingawa unaweza pia kueleweka kama mmiliki; tanbihi inaeleza mbadala.
- source_word: ἐκβάλλει
  choice: anayetoa
  rationale: Ingawa kitenzi hiki mara nyingi humaanisha kutoa au kutupa nje kwa nguvu, hapa kinamaanisha kuvitoa vitu mahali vilipohifadhiwa. “Anayetoa” ni sahihi kwa muktadha huu.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: katika hazina yake
  rationale: θησαυρός inaweza kumaanisha mali yenye thamani au mahali pa kuihifadhi. “Hazina” huhifadhi maana zote mbili kwa kiasi kikubwa, na tanbihi inaonyesha uwezekano wa chumba cha kuhifadhia.
- source_word: καινὰ καὶ παλαιά
  choice: vitu vipya na vya zamani
  rationale: Vivumishi vya wingi visivyo na nomino dhahiri vinahitaji “vitu” katika Kiswahili. Mpangilio wa vipya kabla ya vya zamani unafuata Kigiriki.
theological_decisions:
- issue: Maana ya μαθητευθεὶς kuhusiana na mwandishi wa sheria na ufalme
  choice: mwandishi wa sheria aliyefundishwa kuhusu ufalme wa mbinguni
  alternative: mwandishi wa sheria aliyefanywa mwanafunzi wa ufalme wa mbinguni
  rationale: Tafsiri kuu inawasilisha kufundishwa au kuandaliwa, lakini tanbihi inalinda maana halisi inayowezekana ya kufanywa mwanafunzi. Hivyo haibani kifungu kuwa habari ya kuongoka pekee wala mafunzo rasmi pekee.
- issue: Uhusiano wa dativu τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: kuhusu ufalme wa mbinguni
  alternative: kwa ajili ya ufalme wa mbinguni; katika ufalme wa mbinguni
  rationale: Muundo wa Kigiriki unaweza kuonyesha mwelekeo, uhusiano, au eneo la mafunzo. “Kuhusu” ni wazi kwa msomaji wa Kiswahili na huepuka kulazimisha mojawapo ya mahusiano hayo kuwa pekee.
- issue: Taswira ya οἰκοδεσπότης
  choice: mwenye nyumba
  alternative: mkuu wa nyumba; mkuu wa kaya
  rationale: Chaguo hili linadumisha taswira ya mtu mwenye usimamizi wa nyumba bila kuingiza madai ya kiteolojia au kijamii yasiyokuwamo katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa nyepesi kwa usomaji wa kawaida, huku istilahi “ufalme wa mbinguni” na mpangilio “vipya na vya zamani” vikihifadhiwa. Tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
