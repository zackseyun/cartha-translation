  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: sw
  text: Nao watawatupa katika tanuru la moto. Huko kutakuwa na kilio na kusaga meno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinahifadhi mwendelezo wa sentensi iliyotangulia; “Nao” ni cha asili katika Kiswahili na kinaonyesha kuwa watendaji waliotajwa kabla ndio wanaotenda.
- source_word: βαλοῦσιν
  choice: watawatupa
  rationale: Kitenzi cha wakati ujao kinaonyesha tendo la kuwatupa kwa nguvu, bila kulainisha picha ya hukumu.
- source_word: αὐτοὺς
  choice: -wa- katika “watawatupa”
  rationale: Kiwakilishi cha wingi kinarejelea watu waliotajwa katika muktadha uliotangulia bila kurudia jina lao.
- source_word: κάμινον τοῦ πυρός
  choice: tanuru la moto
  rationale: Muundo huu unafuata kwa karibu kirai cha Kigiriki na kuhifadhi picha halisi ya tanuru na moto; “tanuru lenye moto mkali” lingeongeza ufafanuzi usiotajwa wazi.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Neno hili linaonyesha mahali palipotajwa mara moja kabla na linaweka msisitizo wa kimaeneo kwa Kiswahili cha kawaida.
- source_word: κλαυθμός
  choice: kilio
  rationale: “Kilio” ni tafsiri ya kawaida na pana inayowasilisha huzuni au maumivu makali bila kuongeza nguvu isiyolazimishwa na nomino yenyewe.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Hiki ni kirai cha asili na kinachoeleweka katika Kiswahili, kikihifadhi picha ya Kigiriki bila kuamua ikiwa kinaonyesha huzuni, maumivu, au hasira.
theological_decisions:
- issue: Picha ya hukumu katika “tanuru la moto”
  choice: Kuhifadhi sitiari halisi ya tanuru la moto
  alternative: Kutafsiri kwa neno la kimafundisho kama “moto wa jehanamu”
  rationale: Kigiriki kinatumia picha maalumu ya tanuru la moto. Tafsiri haiibadili kuwa istilahi pana ya kimafundisho wala haipunguzi ukali wake.
- issue: Maana ya “kilio na kusaga meno”
  choice: Kuhifadhi kirai bila kufafanua aina moja tu ya dhiki
  alternative: Kukifasiri kuwa huzuni pekee au hasira pekee
  rationale: Kirai kinaonyesha dhiki kali katika hukumu, lakini hakilazimishi hapa iwe huzuni tu au hasira tu; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja na unahifadhi picha na mpangilio wa msingi wa Kigiriki.
