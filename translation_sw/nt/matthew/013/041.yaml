  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: sw
  text: Mwana wa Adamu atawatuma malaika wake, nao watakusanya kutoka katika ufalme wake vikwazo vyote vya dhambi[a], pamoja na wale wanaotenda uasi dhidi ya sheria[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vyote vinavyosababisha watu wajikwae.” Neno la Kigiriki linaweza kumaanisha mambo, ushawishi, au watu wanaowasababisha wengine watende dhambi au waache imani.
    reason: lexical_alternative
  - marker: b
    text: Au, “wale wanaotenda maasi.” Maneno haya yanakazia mwenendo wa uasi unaoendelea na ambao umekuwa tabia ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: atawatuma
  rationale: Kitenzi cha wakati ujao kinaonyesha kuwa Mwana wa Adamu atawatuma malaika wake kwa kazi maalumu; “atawatuma” ni ya kawaida na ya wazi katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Kiswahili, na linahifadhi mwangwi wa maono ya Danieli bila kulifafanua kupita kiasi.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: malaika wake
  rationale: Katika muktadha huu wa hukumu ya mwisho, ἄγγελοι ni viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: συλλέξουσιν
  choice: watakusanya
  rationale: Neno hili linadumisha taswira ya kukusanya mavuno iliyomo katika mfano na maelezo yake.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: kutoka katika ufalme wake
  rationale: Muundo huu unaonyesha kuondolewa kutoka ndani ya eneo la ufalme wake, kama inavyodokezwa na ἐκ.
- source_word: πάντα τὰ σκάνδαλα
  choice: vitu vyote vinavyosababisha watu waanguke katika dhambi
  rationale: Tafsiri hii inaonyesha maana tendaji ya σκάνδαλα—vitu, vishawishi, au hata watu wanaowafanya wengine watende dhambi au waache imani—badala ya maana ya kukera kihisia tu.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: wale wanaotenda uasi dhidi ya sheria
  rationale: Kishiriki cha wakati uliopo kinaelekea kuonyesha mwenendo unaoendelea au wa kawaida. “Kutenda uasi dhidi ya sheria” kinahifadhi uhusiano wa ἀνομία na sheria bila kupanua maana kuwa uovu kwa ujumla.
theological_decisions:
- issue: Tafsiri ya jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” linahifadhi jina la cheo la Yesu na mwangwi wake wa kiapokaliptiki, hasa uhusiano unaowezekana na Danieli 7; “Mwanadamu” lingeweza kuficha umuhimu huo.
- issue: Upeo wa maana ya σκάνδαλα katika muktadha wa hukumu
  choice: vitu vyote vinavyosababisha watu waanguke katika dhambi
  alternative: vikwazo vyote
  rationale: Neno la Kigiriki linaweza kuhusisha vitu, ushawishi, au watu wanaosababisha wengine watende dhambi au waache imani. Tafsiri kuu inaweka maana hiyo wazi bila kuibana iwe kukerwa kihisia.
- issue: Maana ya ἀνομία
  choice: uasi dhidi ya sheria
  alternative: maasi
  rationale: Tafsiri iliyochaguliwa inadumisha wazo la kutokujali au kwenda kinyume na sheria, lakini haiongezi moja kwa moja neno “Mungu,” ambalo halipo wazi katika sentensi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Waanguke katika dhambi” linafafanua sitiari bila kuondoa kabisa wazo la kuanguka. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
