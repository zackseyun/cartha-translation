  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: sw
  text: “Je, mmeyaelewa mambo haya yote?”[a] Wakamwambia, “Ndiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, mnaelewa mambo haya yote?”
    reason: Kitenzi cha Kigiriki chaweza kutafsiriwa kwa swali linalosisitiza hali ya sasa ya kuelewa, ingawa umbo la aoristi linaunga mkono “mmeyaelewa.”
lexical_decisions:
- source_word: Συνήκατε
  choice: mmeyaelewa
  rationale: Kitenzi cha Kigiriki ni aoristi, nafsi ya pili wingi, katika swali. Kauli “mmeyaelewa” inaonyesha uelewa ambao umefikiwa kufikia wakati huu, huku ikibaki ya kawaida katika Kiswahili.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Huwakilisha wazi kiwakilishi cha kuonyesha cha wingi pamoja na maana ya “yote,” kikirejelea mafundisho na mifano iliyotangulia.
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita wa mfululizo. Kiambishi “-mw-” kinahifadhi maana ya αὐτῷ, “kwake.”
- source_word: Ναί
  choice: Ndiyo
  rationale: Hili ni jibu la kukubali lililo la kawaida na linalolingana moja kwa moja na ναί; hakuna cheo kinachoongezwa.
theological_decisions:
- issue: Iwapo jibu la wanafunzi liongezwe cheo cha heshima
  choice: Kubaki na jibu rahisi, “Ndiyo.”
  alternative: “Ndiyo, Bwana.”
  rationale: SBLGNT ina ναί pekee. Kuongeza “Bwana” kungeingiza katika mstari huu maudhui ya ibada au ya kitheolojia ambayo hayapo katika ushahidi huu wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Je” huweka wazi kuwa ni swali, na “mambo haya yote” huhifadhi uwazi wa muundo wa Kigiriki bila kuwa mzito.
