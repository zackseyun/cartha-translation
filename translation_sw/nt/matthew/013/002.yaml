  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: sw
  text: Makutano mengi yakakusanyika kwake, hata akaingia katika mashua akaketi; nao umati wote ukasimama ufukoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: Umati mkubwa ukakusanyika kwake
  rationale: Kiswahili cha kawaida hutumia umoja wa jumla “umati mkubwa” kueleza watu wengi waliokusanyika; “kwake” huhifadhi wazo la kuelekea kwa Yesu bila kuongeza tafsiri ya kwamba walimzunguka.
- source_word: ὥστε
  choice: hata
  rationale: 'Katika mtiririko huu, “hata” huonyesha matokeo kwa lugha ya simulizi ya Kiswahili: umati ulikuwa mkubwa kiasi kwamba Yesu akaingia mashuani.'
- source_word: εἰς πλοῖον ἐμβάντα
  choice: akaingia katika mashua
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kuingia au kupanda chombo; “mashua” inafaa kwa πλοῖον bila kubainisha ukubwa usiotajwa.
- source_word: καθῆσθαι
  choice: na kuketi
  rationale: “Kuketi” ni ya heshima na ya kawaida, na huonyesha tendo la kuchukua nafasi ya kukaa bila kuongeza maana nyingine.
- source_word: πᾶς ὁ ὄχλος
  choice: umati wote
  rationale: Huhifadhi matumizi ya umoja wa kijumla katika Kigiriki baada ya kutajwa kwa makundi mengi ya watu.
- source_word: ἐπὶ τὸν αἰγιαλὸν
  choice: ufukoni
  rationale: “Ufukoni” ni neno la kawaida na pana kwa ukingo wa bahari au ziwa; halilazimishi picha maalumu ya ufuo wa mchanga.
- source_word: εἱστήκει
  choice: ukasimama
  rationale: Hueleza hali ya umati kuwa umesimama ufuoni katika mtiririko wa simulizi wa Kiswahili, bila kufanya umbo la wakati wa Kigiriki kuwa zito.
