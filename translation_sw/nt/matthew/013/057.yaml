base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: sw
  text: Nao wakachukizwa naye.[a] Lakini Yesu akawaambia, “Nabii hakosi heshima isipokuwa katika mji wake wa nyumbani[b] na katika nyumba yake mwenyewe.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakwazika kwa sababu yake”; kihalisi, “walikwazwa ndani yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali pake pa asili” au “nchi yake.”
    reason: lexical_alternative
  - marker: c
    text: Au, “miongoni mwa watu wa nyumba yake” au “katika familia yake.” Neno la Kigiriki linaweza kumaanisha nyumba yenyewe au watu wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: wakachukizwa naye
  rationale: Katika muktadha huu, kitenzi hiki kinamaanisha kumwona Yesu kuwa sababu ya kukwazika au kuchukizwa, si kujikwaa kimwili. Kauli hii ni ya kawaida katika Kiswahili na huhifadhi uhusiano wa tendo hilo na Yesu.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawaambia
  rationale: δέ inaonyesha tofauti ndogo kati ya kuchukizwa kwao na jibu la Yesu; “Lakini” huonyesha mgeuko huo wa mazungumzo.
- source_word: προφήτης
  choice: nabii
  rationale: Hili ndilo neno la kawaida na linalotambulika moja kwa moja kwa προφήτης.
- source_word: ἄτιμος
  choice: hakosi heshima
  rationale: Muundo hasi huhifadhi umbo la kimethali la Kigiriki, οὐκ ἔστιν ... ἄτιμος, pamoja na wazo la heshima na aibu.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika muundo huu wa kuonyesha sehemu iliyo tofauti na nyingine, “isipokuwa” ni sawa ya kawaida na ya wazi.
- source_word: πατρίδι
  choice: mji wake wa nyumbani
  rationale: Katika simulizi hili neno linarejelea mahali alikokulia au kwao, yaani Nazareti, si lazima taifa au nchi nzima. Tanbihi inadumisha upana wa maana wa neno la Kigiriki.
- source_word: οἰκίᾳ αὐτοῦ
  choice: nyumba yake mwenyewe
  rationale: οἰκία linaweza kumaanisha nyumba, watu wa nyumbani, au familia. Tafsiri ya moja kwa moja “nyumba yake mwenyewe” hudumisha utata huo kwa kadiri inayowezekana, huku tanbihi ikifafanua maana mbadala.
theological_decisions:
- issue: Upeo wa methali ya Yesu kuhusu kukataliwa
  choice: Kauli imetafsiriwa kama methali ya jumla kuhusu nabii kukosa heshima katika mazingira ya kwao.
  alternative: Kuifafanua moja kwa moja kuwa inahusu hasa kutokuamini kwa jamaa zake.
  rationale: Kigiriki kinatoa methali ambayo Yesu anaitumia kwa hali iliyopo. Tafsiri inadumisha mvutano wa heshima na kukataliwa kwa mtu katika mazingira yake bila kuongeza dai pana la kimafundisho au kuifanya ihusu familia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Muundo wa methali umehifadhiwa bila kuwa mgumu kupita kiasi. Alama zote za tanbihi zimewekwa mara tu baada ya kirai kinachohusika.
