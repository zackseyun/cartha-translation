id: MAT.13.15
reference: Matthew 13:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: sw
  text: Kwa maana moyo wa watu hawa umekuwa butu[a]; kwa masikio yao wamesikia kwa shida, nao wamefumba macho yao, wasije wakaona kwa macho yao, wakasikia kwa masikio yao, wakaelewa kwa moyo wao, wakageuka[b], na nitawaponya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, ‘umenenepa’ au ‘umekuwa mnene’; hapa maana yake ni kuwa butu, usio na hisia au ufahamu.
    reason: lexical_alternative
  - marker: b
    text: Au ‘wakarudi.’
    reason: lexical_alternative
  - marker: c
    text: Dondoo kutoka Isaya 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: umekuwa mzito
  rationale: Kitenzi hiki kihalisi hudokeza kuwa mnene au mzito; kinapotumiwa kuhusu moyo hapa kinaonyesha hali ya kutokuwa na hisia au ufahamu. ‘Umekuwa mzito’ huhifadhi sitiari bila kuifafanua kupita kiasi.
- source_word: καρδία
  choice: moyo
  rationale: ‘Moyo’ ni tafsiri ya kawaida ya kitovu cha ufahamu na mwelekeo wa ndani, na kifungu chenyewe kinauhusianisha moyo na kuelewa.
- source_word: λαοῦ τούτου
  choice: wa watu hawa
  rationale: Huhifadhi umoja wa ‘moyo’ pamoja na msisitizo wa kiashiria ‘hawa’ kwa Kiswahili cha kawaida.
- source_word: βαρέως ἤκουσαν
  choice: wamesikia kwa shida
  rationale: Huwasilisha wazo la kusikia kwa uzito au kwa taabu kwa lugha ya asili ya Kiswahili, bila kuligeuza moja kwa moja kuwa kutotaka kusikia.
- source_word: ἐκάμμυσαν
  choice: wamefumba
  rationale: Huhifadhi tendo la makusudi la watu wenyewe kufumba macho yao na matokeo yake yanayoendelea.
- source_word: μήποτε
  choice: wasije
  rationale: Huhifadhi nguvu ya tahadhari au kusudi hasi ya μήποτε na mvutano uliomo katika dondoo hili.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν ... ἐπιστρέψωσιν
  choice: wakaona ... wakasikia ... wakaelewa ... wakageuka
  rationale: Mfululizo wa vitenzi vya Kiswahili baada ya ‘wasije’ huhifadhi mpangilio na uhusiano wa matendo katika Kigiriki.
- source_word: ἐπιστρέψωσιν
  choice: wakageuka
  rationale: ‘Kugeuka’ huhifadhi maana ya kugeuka au kurudi bila kuongeza wazi kitu au mtu wanayemgeukia, ambacho hakitajwi katika Kigiriki.
- source_word: ἰάσομαι
  choice: nitawaponya
  rationale: Hii ni tafsiri ya moja kwa moja ya wakati ujao na huhifadhi ahadi ya uponyaji bila kuibadili kuwa hali ya masharti.
theological_decisions:
- issue: Kuhifadhi mvutano kati ya hukumu ya Mungu na wajibu wa binadamu katika kishazi cha μήποτε
  choice: wasije wakaona ... wakaelewa ... wakageuka, nami nitawaponya
  alternative: la sivyo wangeona ... wangeelewa ... wangerudi, nami ningewaponya
  rationale: Tafsiri iliyochaguliwa hudumisha nguvu ya juu ya μήποτε na pia hudumisha tendo la watu la kufumba macho yao, bila kuamua kimya kimya kama kifungu kinaeleza kusudi, matokeo, au maelezo ya kinaya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa dondoo umehifadhiwa kwa mfululizo wa vitenzi, huku misemo isiyo ya kawaida ikifanywa kuwa ya asili bila kuondoa sitiari au mvutano wa kiteolojia.
