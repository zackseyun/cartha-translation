review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek sequence, the active closing of the eyes, the μήποτε ('wasije') clause, and the future 'nitawaponya' well. However, 'moyo ... umekuwa mzito' most readily denotes an emotionally burdened or sad heart in contemporary Standard East African Swahili, rather than the dull, calloused insensibility conveyed by ἐπαχύνθη.
  naturalness: The verse is generally clear and maintains an appropriate scriptural register. Replacing 'mzito' with 'butu' gives the intended figurative sense more naturally and directly. The rest of the syntax, including 'kwa masikio yao wamesikia kwa shida' and the serial verbs after 'wasije,' is acceptable.
  terminology: '''Moyo,'' ''macho ... wameyafumba,'' ''wakageuka,'' and ''nitawaponya'' are appropriate. ''Butu'' accurately expresses diminished perception without imposing the stronger theological notion of deliberate hardening. The alternative ''wakarudi'' remains a suitable note for ''wakageuka.'''
  issues:
  - severity: medium
    issue: ‘Umekuwa mzito’ is semantically misleading for ἐπαχύνθη in this context.
    rationale: In current Swahili, a 'heavy heart' commonly suggests sorrow, worry, or emotional burden. The Greek idiom describes a heart rendered dull or insensitive. ‘Umekuwa butu’ conveys this perceptual and moral dullness while retaining the figurative expression.
  revised_text: Kwa maana moyo wa watu hawa umekuwa butu[a]; kwa masikio yao wamesikia kwa shida, nao wamefumba macho yao, wasije wakaona kwa macho yao, wakasikia kwa masikio yao, wakaelewa kwa moyo wao, wakageuka[b], na nitawaponya.[c]
