reference: Matthew 13:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: sw
  text: Kisha, baada ya kuwaacha umati wa watu, aliingia ndani ya nyumba. Wanafunzi wake wakamjia na kusema, “Tufafanulie mfano wa magugu ya shambani.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfano wa magugu aina ya darnel shambani”; neno la Kigiriki huenda likamaanisha hasa darnel, gugu linalofanana na ngano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Ni kiashiria cha wakati kinachoendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: baada ya kuwaacha umati wa watu
  rationale: Kifungu hiki huonyesha tendo lililotangulia kuingia kwake nyumbani; ‘umati wa watu’ ni usemi wa kawaida unaowakilisha wingi wa watu waliokusanyika.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: aliingia ndani ya nyumba
  rationale: Katika muktadha huu mwendo unaelekea kutoka mahali pa wazi hadi ndani ya nyumba; tafsiri hii ni ya asili na huhifadhi umaalumu wa nyumba inayotajwa.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Wanafunzi wake wakamjia
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya wanafunzi wake kumsogelea.
- source_word: λέγοντες
  choice: na kusema
  rationale: Huunganisha kwa njia ya asili kitendo cha kumjia na maneno yao.
- source_word: Διασάφησον ἡμῖν
  choice: Tufafanulie
  rationale: Kitenzi hiki huomba jambo liwekwe wazi au lielezwe; umbo hili linaingiza kwa kawaida yule anayepokea ufafanuzi.
- source_word: τὴν παραβολὴν
  choice: mfano
  rationale: ‘Mfano’ ni istilahi ya kawaida ya kibiblia kwa παραβολή katika Kiswahili na inaeleweka kwa wasomaji wa sasa.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: wa magugu ya shambani
  rationale: ‘Magugu’ ni neno pana na linaloeleweka; umbo ‘ya shambani’ linaonyesha uhusiano wa magugu hayo na shamba bila kulazimisha utambulisho mahususi wa mmea.
