id: MAT.13.30
reference: Matthew 13:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: sw
  text: Vyaacheni vyote viwili vikue pamoja mpaka mavuno; wakati wa mavuno nitawaambia wavunaji, ‘Kwanza kusanyeni magugu[a] na myafunge katika mafungu ili myachome; lakini kusanyeni ngano katika ghala langu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “magugu ya darneli”; kwa mapokeo, “tares.”
    reason: Neno la Kigiriki ζιζάνια linaweza kurejelea darneli; “magugu” limechaguliwa katika maandishi makuu kwa sababu linaeleweka kwa urahisi.
lexical_decisions:
- source_word: ἄφετε
  choice: Viacheni
  rationale: Amri hii ina maana ya kuruhusu vitu vilivyotajwa viendelee kukua; “viacheni” ni ya kawaida na huhifadhi nguvu ya amri ya kuruhusu.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: vyote viwili vikue pamoja
  rationale: Tafsiri hii huhifadhi wazo la mazao hayo mawili kukua pamoja bila kuamua mapema hatima yake.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: mpaka wakati wa mavuno
  rationale: “Wakati wa mavuno” huonyesha tukio maalumu linalotarajiwa katika mfano na ni Kiswahili cha kawaida.
- source_word: θερισταῖς
  choice: wavunaji
  rationale: Ni neno la kawaida na sahihi kwa watu wanaofanya kazi ya kuvuna.
- source_word: τὰ ζιζάνια
  choice: magugu
  rationale: “Magugu” linaeleweka kwa urahisi; utambulisho maalumu unaowezekana wa mmea huo umehifadhiwa katika tanbihi.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: kuyafunga mafungu
  rationale: Usemi huu unaonyesha kwa kawaida tendo la kuyakusanya na kuyafunga kuwa mafungu.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: ili yachomwe moto
  rationale: Muundo huu huhifadhi kusudi la kufungwa kwa magugu na maana ya kuteketezwa kwa moto bila kuongeza ufafanuzi wa kitheolojia.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: lakini kusanyeni ngano ghalani mwangu
  rationale: “Ghala” ni mahali pa kuhifadhi nafaka; tafsiri huhifadhi tofauti kati ya magugu na ngano pamoja na amri ya kuikusanya.
theological_decisions:
- issue: Taswira ya kimfano ya kutenganishwa kwa mwisho
  choice: Kuhifadhi taswira ya kilimo kama ilivyosemwa katika mfano
  alternative: Kueleza wazi hapa kwamba kuchomwa kunamaanisha hukumu ya mwisho
  rationale: Ufafanuzi wa mfano unatolewa baadaye katika sura; mstari huu unapaswa kubaki katika lugha ya mfano bila kuingiza mapema maana yake ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inafaa kwa usemi wa kimfano. Alama ya tanbihi imewekwa baada ya neno “magugu,” ambalo ndilo linalofafanuliwa.
