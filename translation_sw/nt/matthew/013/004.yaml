  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: sw
  text: Alipokuwa akipanda[a], baadhi ya mbegu zilianguka kando ya njia; ndege wakaja wakazila kabisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa maana halisi, “baadhi ya vitu vilianguka kando ya njia”; neno “mbegu” limeongezwa kutokana na muktadha wa mpanzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Alipokuwa akipanda
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi unaonyesha matukio yanayotokea kwa wakati mmoja. Kiswahili hiki ni cha kawaida na kinaendeleza tendo la kupanda.
- source_word: ἃ μὲν
  choice: mbegu nyingine
  rationale: Kiwakilishi cha Kigiriki ni cha wingi wa jinsia ya kati, kihalisi ‘vitu vingine,’ lakini katika muktadha kinarejelea mbegu anazopanda mpanzi. Kutaja ‘mbegu’ kunafanya maana iwe wazi kwa Kiswahili.
- source_word: ἔπεσεν
  choice: zilianguka
  rationale: Wakati timilifu wa simulizi wa Kigiriki unafaa kutafsiriwa kwa wakati uliopita wa Kiswahili; upatanisho wa wingi unafuata ‘mbegu nyingine.’
- source_word: παρὰ τὴν ὁδόν
  choice: kando ya njia
  rationale: παρά pamoja na hali ya kushutumiwa hapa huonyesha mahali pembeni mwa njia. ‘Kando ya njia’ ni ya kawaida na inafaa mazingira ya kilimo.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: ndege wakaja
  rationale: Kishiriki cha aoristi kinatolewa kwa kawaida kama kitenzi kinachofuata katika simulizi. πετεινά ni ‘ndege’ bila kirai cha ziada ‘wa angani.’
- source_word: κατέφαγεν
  choice: wakazila kabisa
  rationale: Kitenzi κατεσθίω kina nguvu ya kula na kumaliza. ‘Wakazila kabisa’ huwasilisha uzito huo kwa Kiswahili cha kawaida kuliko ‘wakazila’ peke yake.
- source_word: αὐτά
  choice: -zi- katika ‘wakazila’
  rationale: Kiwakilishi kinarejelea mbegu zilizoanguka; kiambishi cha yambwa ‘-zi-’ kinadumisha rejeleo hilo kwa ufupi na kwa upatanisho sahihi.
