translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi ‘wakaja wakazila’ huhifadhi mfuatano wa simulizi; ‘kabisa’ huonyesha nguvu ya κατέφαγεν bila kutumia msamiati mzito usio wa kawaida.
