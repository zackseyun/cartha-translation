  text: Yesu alipomaliza mifano hii, aliondoka kutoka huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa ukaribu zaidi na muundo wa Kigiriki: “Ikawa, Yesu alipomaliza mifano hii, aliondoka kutoka huko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Baada ya
  rationale: Fungu hili ni mpito wa kisimulizi unaoonyesha kwamba tendo la kuondoka lilifuata kukamilika kwa mifano. Kiswahili cha kawaida hutumia “Baada ya” kwa uhusiano huo wa wakati bila kulazimisha nahau ya Kigiriki kuwa sentensi tofauti.
- source_word: ἐτέλεσεν
  choice: kumaliza
  rationale: Kitenzi τελέω hapa humaanisha kufikisha jambo mwisho; “kumaliza” ni cha kawaida na huonyesha kwamba mafundisho ya mifano yalikuwa yamekamilika kabla ya kuondoka.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa namna yake iliyozoeleka katika Kiswahili cha Biblia.
- source_word: τὰς παραβολὰς ταύτας
  choice: mifano hiyo
  rationale: “Mifano” ni istilahi ya kawaida kwa παραβολαί katika mafundisho ya Yesu. “Hiyo” hurejelea mkusanyo wa mifano uliotangulia mara moja na ni rejeleo la kawaida katika Kiswahili.
- source_word: μετῆρεν
  choice: aliondoka
  rationale: μεταίρω humaanisha kuondoka au kuhama kutoka mahali; “aliondoka” ni wazi, asilia, na haiongezi maelezo kuhusu namna au mahali alikokwenda.
- source_word: ἐκεῖθεν
  choice: mahali pale
  rationale: Hutoa maana ya ‘kutoka huko/mahali hapo’ kwa Kiswahili asilia; wazo la kutoka limekwisha kuwamo katika “aliondoka.”
