  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: sw
  text: 'Lakini yule aliyepandwa kwenye udongo mzuri[a] ni yule anayelisikia neno na kulielewa; yeye kwa hakika huzaa matunda na hutoa mavuno: mmoja mia, mwingine sitini, na mwingine thelathini.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «ardhi nzuri».
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi, «mmoja mia, mwingine sitini, na mwingine thelathini»; maana yake ni viwango tofauti vya mavuno. Tafsiri nyingine husema «mara mia ... sitini ... thelathini».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: kwenye udongo mzuri
  rationale: Katika mazingira ya kilimo, γῆ hapa ni udongo unaopokea mbegu. «Mzuri» huonyesha udongo unaofaa na wenye rutuba, si sifa ya kimaadili.
- source_word: σπαρείς
  choice: aliyepandwa
  rationale: Kauli hii inadumisha umbo la kutendwa na sitiari ya mbegu, huku ikimrejelea mtu anayewakilishwa na mbegu.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: yule anayelisikia neno
  rationale: Kauli ya wakati wa sasa inaonyesha tendo linalomtambulisha mtu huyo. «Neno» linahifadhi istilahi ya Injili na bado linaeleweka kwa urahisi.
- source_word: συνιείς
  choice: na kulielewa
  rationale: Kitenzi kinaonyesha kuelewa maana ya neno lililosikiwa; kiambishi «-li-» kinarejelea wazi neno.
- source_word: δὴ
  choice: kwa hakika
  rationale: Usemi huu unawakilisha mkazo wa chembe δή bila kuutia uzito usio wa lazima.
- source_word: καρποφορεῖ
  choice: huzaa matunda
  rationale: Huhifadhi taswira ya kilimo na matumizi yake ya kisitiari kuhusu mwitikio wa msikilizaji.
- source_word: ποιεῖ
  choice: na kutoa mavuno
  rationale: Katika muktadha huu ποιεῖ ni kuzalisha mazao. Kutafsiri kwa kitenzi tofauti kunahifadhi vitenzi viwili vya Kigiriki badala ya kuvifupisha kuwa kimoja.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: mmoja mara mia, mwingine mara sitini, na mwingine mara thelathini
  rationale: Muundo huu unaonyesha viwango tofauti vya mavuno. «Mara» linafanya maana ya uwiano wa mavuno iwe wazi katika Kiswahili cha kawaida, ingawa neno hilo halijaandikwa wazi katika Kigiriki.
theological_decisions:
- issue: Hali ya mwitikio kwa neno katika mfano
  choice: Mtu anayefananishwa na udongo mzuri anasikia, anaelewa, na kuzaa matunda kwa viwango vinavyotofautiana.
  alternative: Tafsiri ya kifafanuzi zaidi ingeweza kutaja wazi uvumilivu au uongofu wa kweli.
  rationale: Kigiriki kinataja kusikia, kuelewa, na kuzaa matunda, lakini hakitaji moja kwa moja mifumo ya baadaye ya kimafundisho. Tafsiri inahifadhi makundi ya maandiko yenyewe bila kuingiza hitimisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. «Aliyepandwa» inadumisha sitiari yenye mvutano ya mtu kuwakilishwa na mbegu; «udongo mzuri» ni usemi wa kawaida wa kilimo; na alama ya mkato mrefu inaweka wazi kwamba viwango vinavyofuata vinafafanua mavuno.
