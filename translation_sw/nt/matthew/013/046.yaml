  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: sw
  text: Naye, baada ya kupata lulu moja ya thamani kubwa[a], aliondoka, akauza kila kitu alichokuwa nacho, akainunua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lulu moja yenye thamani kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Naye alipopata
  rationale: Muundo huu unaonyesha kwamba kuipata lulu kulitangulia matendo makuu yaliyofuata. Kiunganishi δέ kimetafsiriwa kwa “Naye,” ambacho kinaendeleza simulizi bila kuweka upinzani mkali.
- source_word: ἕνα
  choice: moja
  rationale: Namba iliyotajwa wazi katika Kigiriki imehifadhiwa ili kusisitiza lulu moja pekee yenye thamani ya kipekee.
- source_word: πολύτιμον
  choice: ya thamani kubwa
  rationale: Hili ni tamko la kawaida na wazi katika Kiswahili cha sasa linalowasilisha thamani ya juu sana bila kupunguza uzito wa neno la asili.
- source_word: μαργαρίτην
  choice: lulu
  rationale: Hii ndiyo maana ya kawaida ya neno hilo katika muktadha huu.
- source_word: ἀπελθὼν
  choice: alikwenda
  rationale: Kitenzi kishirikishi kimetolewa kama kitenzi kamili ili Kiswahili kiwe cha asili na mlolongo wa matendo ubaki wazi.
- source_word: πέπρακεν
  choice: akauza
  rationale: Ingawa Kigiriki kina hali timilifu, katika mfuatano huu wa kisimulizi Kiswahili hutumia kwa kawaida wakati uliopita wa mfululizo; tendo lililokamilika linaeleweka wazi.
- source_word: πάντα ὅσα εἶχεν
  choice: kila kitu alichokuwa nacho
  rationale: Tamko hili la asili katika Kiswahili linahifadhi ukamilifu unaosisitizwa na πάντα pamoja na kishazi husika.
- source_word: ἠγόρασεν
  choice: akainunua
  rationale: “Kununua” ni kisawe cha kawaida na kinachoeleweka, huku kiambishi “ka” kikionyesha tendo lililofuata kuuza.
- source_word: αὐτόν
  choice: -i- katika “akainunua”
  rationale: Kiwakilishi hiki kinarejelea lulu. Kiambishi cha ngeli ya lulu katika Kiswahili kinaiwakilisha kwa kawaida bila kuiga jinsia ya kisarufi ya Kigiriki.
