  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: sw
  text: Nao watawatupa ndani ya tanuru la moto[a]. Huko kutakuwa na kilio na kusaga meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo wa kawaida zaidi, “tanuru linalowaka moto.” Kigiriki kinasema kihalisi “tanuru la moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: watawatupa
  rationale: Kitenzi cha wakati ujao kina maana ya kutupa kwa nguvu; “watawatupa” ni cha kawaida na kinaendeleza kiwakilishi cha watendwa.
- source_word: αὐτοὺς
  choice: -wa-
  rationale: Kiwakilishi cha yambwa cha wingi kinawarejelea waovu waliotajwa katika muktadha uliotangulia.
- source_word: κάμινον τοῦ πυρός
  choice: tanuru la moto
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kigiriki na kuhifadhi picha halisi ya hukumu.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Neno hili linaonyesha mahali kwa msisitizo kwa namna ya asili katika Kiswahili.
- source_word: ἔσται
  choice: kutakuwa na
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kuwepo kwa mambo yanayofuata katika wakati ujao.
- source_word: ὁ κλαυθμὸς
  choice: kilio
  rationale: “Kilio” linaonyesha kulia kwa huzuni bila kuongeza kwa lazima dhana maalumu zaidi ya kuomboleza kwa sauti.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Hii ni njia ya kawaida na inayoeleweka ya kuwasilisha msemo wa kusaga au kugandamiza meno kwa maumivu makali.
theological_decisions:
- issue: Picha ya hukumu katika muktadha wa mambo ya mwisho
  choice: Kuhifadhi maneno halisi “tanuru la moto,” “kilio,” na “kusaga meno” bila kuyapunguza makali wala kuyafafanua zaidi.
  alternative: Kutumia “tanuru lenye moto” au kufafanua kuwa watu watalia na kusaga meno kwa uchungu.
  rationale: Kauli ya Yesu inatoa picha nzito ya hukumu. Tafsiri inahifadhi sitiari na mvutano wake wa kitheolojia bila kuamua zaidi asili ya tanuru au hisia mahususi zinazoonyeshwa na kusaga meno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Nao” linaunganisha sentensi na hatua iliyotangulia; “Huko” huhifadhi msisitizo wa mahali.
