base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: sw
  text: 'Ndivyo itakavyokuwa wakati wa mwisho wa enzi: malaika watatoka na kuwatenga waovu kutoka miongoni mwa wenye haki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa ukamilisho wa enzi.” Kigiriki kina αἰών, “enzi,” wala si “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Ndivyo itakavyokuwa
  rationale: Kauli hii ya Kiswahili ni ya kawaida na yenye hadhi, nayo inaonyesha kuwa Yesu anaeleza jinsi mambo yatakavyokuwa kulingana na mfano.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: wakati wa mwisho wa enzi hii
  rationale: “Mwisho” huwasilisha kukamilika kwa kipindi, na “enzi hii” humaanisha kipindi au mpangilio wa sasa badala ya ulimwengu wa kimwili. Neno “hii” limewekwa wazi kwa njia ya kawaida katika muktadha wa Kieskatolojia wa Kiswahili.
- source_word: ἐξελεύσονται
  choice: watatoka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kutoka ili kutekeleza kazi inayofuata.
- source_word: οἱ ἄγγελοι
  choice: malaika
  rationale: Katika muktadha huu wa hukumu ya mwisho, neno linawahusu viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἀφοριοῦσιν
  choice: kuwatenga
  rationale: Kitenzi hiki huonyesha kuwa kundi moja linaondolewa au linawekwa kando kutoka ndani ya kundi jingine.
- source_word: τοὺς πονηροὺς
  choice: waovu
  rationale: Kivumishi kilichotumika kama nomino kinamaanisha watu waovu; “waovu” ni tafsiri wazi na ya kawaida.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: kutoka miongoni mwa wenye haki
  rationale: Kauli hii huhifadhi wazo la kuwaondoa waovu kutoka ndani ya kundi lililochanganyika, huku “wenye haki” ikiwa Kiswahili cha kawaida kwa watu wanaotajwa kuwa waadilifu mbele za Mungu.
theological_decisions:
- issue: Maana ya αἰών katika kauli ya Kieskatolojia
  choice: enzi hii
  alternative: ulimwengu
  rationale: αἰών humaanisha enzi au kipindi, si lazima ulimwengu wa kimwili. Tafsiri hii haiongezi dai kwamba uumbaji wa kimwili utaangamizwa, jambo ambalo maneno yenyewe hayasemi.
- issue: Utambulisho wa οἱ ἄγγελοι
  choice: malaika wa mbinguni
  alternative: wajumbe
  rationale: Muktadha wa maelezo ya Yesu kuhusu hukumu ya mwisho unaonyesha kuwa hawa ni malaika, si wajumbe wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo “Ndivyo itakavyokuwa” ni wa kawaida bila kuwa wa kizamani; “enzi hii” huhifadhi tofauti ya Kigiriki kati ya αἰών (enzi) na κόσμος (ulimwengu).
