  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: sw
  text: Na kama siku hizo zisingalifupishwa[a], hakuna mwanadamu[b] ambaye angeokolewa; lakini kwa ajili ya wateule, siku hizo zitafupishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zisingalikatizwa ... zitakatizwa.” Kitenzi cha Kigiriki kinaweza kuonyesha kufupishwa au kukatizwa kwa muda huo.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kila mwili”; hii ni nahau inayowarejelea wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: zisingalifupishwa / zitafupishwa
  rationale: Kitenzi κολοβόω kina maana ya kufupisha au kukatiza. “Kufupishwa” ni Kiswahili cha kawaida kinachoonyesha kwamba muda wa siku hizo unapunguzwa, huku kauli ya kutendwa na nyakati za vitenzi vya Kigiriki zikihifadhiwa.
- source_word: οὐκ ἂν ἐσώθη
  choice: hakuna ... ambaye angeokolewa
  rationale: Muundo huu unaonyesha matokeo yasiyotokea katika hali inayodhaniwa kuwa kinyume na uhalisi. “Angeokolewa” huhifadhi kauli ya kutendwa na upana wa maana ya σῴζω, ambayo hapa inaweza kuhusisha kuhifadhiwa hai bila kuzuia mwangwi mpana wa neno “kuokoa.”
- source_word: πᾶσα σάρξ
  choice: hakuna mwanadamu
  rationale: Kwa kuwa kauli imekanushwa, nahau “kila mwili” humaanisha kwamba hakuna mwanadamu. Tafsiri hii ni ya asili katika Kiswahili na haichukulii σάρξ kuwa “asili ya dhambi.”
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: lakini kwa ajili ya wateule
  rationale: “Kwa ajili ya” huwasilisha sababu au manufaa yanayoonyeshwa na διά pamoja na hali ya kushutumiwa. “Wateule” huhifadhi jina la kundi hilo bila kufafanua utambulisho wake zaidi ya mstari wenyewe.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: siku hizo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha kuonyesha siku zinazorejelewa.
- source_word: καὶ εἰ μὴ
  choice: Na kama ... zisingali-
  rationale: Muundo huu huhifadhi kiunganishi cha mwanzo na sharti hasi la Kigiriki kwa Kiswahili fasaha.
theological_decisions:
- issue: Utambulisho wa τοὺς ἐκλεκτούς katika hotuba kuhusu mambo ya mwisho
  choice: wateule
  alternative: watu waliochaguliwa na Mungu; waamini; mabaki waaminifu
  rationale: Mstari unalitaja kundi hili lakini haufafanui hapa upeo kamili wa utambulisho wake. “Wateule” hudumisha mvutano huo bila kuamua kati ya mifumo tofauti ya kitheolojia.
- issue: Maana ya σῴζω katika muktadha huu
  choice: angeokolewa
  alternative: angeendelea kuwa hai; angenusurika
  rationale: Muktadha unahusu kuhifadhiwa wakati wa dhiki, lakini “angenusurika” ingefinya maana ya kitenzi kuwa ya kimwili pekee. “Angeokolewa” huhifadhi upana wa neno la Kigiriki bila kulifanya limaanishe wokovu wa kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa masharti “zisingalifupishwa ... angeokolewa” huhifadhi hali ya jambo lisilotokea, na “wateule” hutumiwa kama istilahi fupi bila nyongeza ya kimadhehebu.
