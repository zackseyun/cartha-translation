base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: sw
  text: Naye atawatuma malaika wake kwa tarumbeta yenye sauti kubwa[a], nao watawakusanya wale aliowachagua[b] kutoka pepo nne[c], kutoka mwisho mmoja wa mbingu hadi mwisho mwingine[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kwa tarumbeta kubwa” au “kwa mlio wa tarumbeta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “wateule wake.”'
    reason: lexical_alternative
  - marker: c
    text: Usemi “pepo nne” humaanisha sehemu zilizo mbali zaidi katika kila upande.
    reason: cultural_note
  - marker: d
    text: 'Kigiriki: “kutoka miisho ya mbingu hadi miisho yake,” usemi unaomaanisha kutoka ukingo mmoja hadi mwingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: atawatuma
  rationale: Kitenzi cha wakati ujao kina maana ya kutuma au kupeleka kwa kusudi fulani. “Atawatuma” ni Kiswahili cha kawaida na chenye hadhi, huku kiambishi cha yambwa kikiwaelekeza wazi malaika.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika muktadha huu wa mwisho wa nyakati, neno linawahusu viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: kwa sauti kubwa ya tarumbeta
  rationale: μετά pamoja na hali ya umilikishi huonyesha uambatanisho. Tafsiri hii ni ya asili kwa Kiswahili na inaonyesha kwamba ukubwa unahusiana na sauti ya tarumbeta, huku tanbihi ikihifadhi uwezekano wa kuelewa “tarumbeta kubwa.”
- source_word: ἐπισυνάξουσιν
  choice: watawakusanya
  rationale: Kitenzi kinaonyesha kuwakusanya pamoja. “Watawakusanya” kinatosha kuwasilisha maana hiyo, na kiambishi cha yambwa kinarejelea watu waliochaguliwa.
- source_word: ἐκλεκτούς
  choice: watu wake waliochaguliwa
  rationale: Huwasilisha maana ya waliochaguliwa kwa lugha inayoeleweka sasa bila kulazimisha istilahi nzito ya kimadhehebu. “Wake” huhifadhi αὐτοῦ.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: kutoka pande nne za upepo
  rationale: Tafsiri inahifadhi taswira ya kibiblia ya pepo nne badala ya kuibadili kabisa kuwa “kila upande,” huku tanbihi ikifafanua matumizi yake ya kinahau.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: kutoka mwisho mmoja wa mbingu hadi mwisho mwingine
  rationale: Ni usemi unaoonyesha eneo lote kutoka ukingo mmoja hadi mwingine. Kiswahili hiki ni cha asili na huhifadhi taswira pana ya mbingu bila kuibana kuwa jiografia ya dunia pekee.
theological_decisions:
- issue: Uwasilishaji wa ἐκλεκτούς katika muktadha wa mwisho wa nyakati
  choice: watu wake waliochaguliwa
  alternative: wateule wake
  rationale: Andiko linawatambulisha kama watu wa Mwana wa Adamu waliochaguliwa, lakini halifafanui hapa mfumo wa kiteolojia wa namna walivyochaguliwa. Tafsiri kuu huhifadhi maana bila kuingiza ufafanuzi wa kimadhehebu; istilahi ya jadi imewekwa katika tanbihi.
- issue: Upeo wa taswira ya kukusanywa
  choice: kutoka pande nne za upepo, kutoka mwisho mmoja wa mbingu hadi mwisho mwingine
  alternative: kutoka pande zote za dunia
  rationale: Tafsiri kuu inahifadhi taswira pana na ya ulimwengu mzima iliyo katika Kigiriki badala ya kuifasiri kwa namna finyu kuwa maeneo ya dunia tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mwendelezo wa matendo mawili ya wakati ujao, na taswira za tarumbeta, pepo nne na miisho ya mbingu zimeachwa wazi bila kupunguzwa kuwa maelezo ya kimadhehebu.
