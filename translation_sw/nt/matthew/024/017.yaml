  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: sw
  text: Aliye juu ya paa[a] asishuke kuchukua vitu kutoka katika nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paa za nyumba katika eneo hilo mara nyingi zilikuwa tambarare na zilitumiwa na watu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Aliye juu ya paa
  rationale: Kirai chenye kibainishi kinatumika kama nomino, yaani mtu aliye juu ya paa. Muundo huu ni wa asili katika Kiswahili na haumwekei mhusika jinsia ambayo Kiswahili haihitaji hapa.
- source_word: δώματος
  choice: paa
  rationale: Neno hili linamaanisha sehemu ya juu ya nyumba, ambayo katika mazingira ya wakati huo mara nyingi ilikuwa tambarare na ilitumika na watu. 'Paa' ni neno la kawaida na wazi katika Kiswahili.
- source_word: μὴ καταβάτω
  choice: asishuke
  rationale: Huu ni ukatazo wenye nguvu ya amri. 'Asishuke' huwasilisha agizo la haraka kwa njia fupi na ya kawaida.
- source_word: ἆραι
  choice: kuchukua
  rationale: 'Kitenzi-jina hiki kinaonyesha kusudi la kushuka: kuchukua au kuondoa vitu. ''Kuchukua'' ni sahihi na hakiongezi maelezo yasiyokuwamo.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: vitu vilivyo nyumbani mwake
  rationale: Muundo wa Kigiriki ni wa mkato na unarejelea vitu kutoka ndani ya nyumba yake. Kiswahili cha asili hutaja vitu hivyo kuwa 'vilivyo nyumbani mwake'; neno 'vitu' linahifadhi ujumla bila kuvifasiri moja kwa moja kuwa mali.
- source_word: οἰκίας
  choice: nyumbani
  rationale: Katika kirai hiki, 'nyumbani' hueleza kwa kawaida mahali vilipo vitu, huku muktadha wa paa ukidumisha maana halisi ya nyumba, si hisia za kifamilia pekee.
- source_word: αὐτοῦ
  choice: mwake
  rationale: Kiambishi cha umilikaji cha nafsi ya tatu umoja kinahifadhi rejeo la umoja. Kiswahili hakilazimishi kubainisha jinsia ya mhusika.
theological_decisions:
- issue: Rejeo la umoja lenye jinsia ya kiume katika Kigiriki
  choice: 'Kutumia umoja usiobainisha jinsia: ''Aliye ... mwake'''
  alternative: Kutaja 'mtu huyo ... nyumba yake' au kuweka jinsia ya kiume wazi
  rationale: Kigiriki kinatumia muundo wa umoja wa kiume kwa maana ya uwakilishi, bila hoja ya kitheolojia kuhusu jinsia. Kiswahili huwasilisha kwa usahihi umoja huo kwa viambishi visivyobainisha jinsia, hivyo hakuna haja ya kuongeza 'mwanamume'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, yenye hadhi na ya kawaida. 'Asishuke' linadumisha dharura ya agizo, na tanbihi inaeleza mazingira ya paa tambarare bila kuyapachika katika matini kuu.
