review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the person on the roof, the prohibition against descending, and the purpose of taking items. However, “vitu vilivyo nyumbani mwake” means “things that are in his home,” whereas τὰ ἐκ τῆς οἰκίας αὐτοῦ specifically presents the items as being taken from/out of his house.
  naturalness: “Aliye juu ya paa asishuke...” is clear, idiomatic Standard East African Swahili. “Kutoka katika nyumba yake” naturally and explicitly conveys the source-direction expressed by ἐκ.
  terminology: “Paa” is an appropriate rendering of δῶμα. The cultural footnote accurately explains the likely flat, usable house roof without making that explanation part of the main text.
  issues:
  - severity: medium
    issue: The phrase “vitu vilivyo nyumbani mwake” does not represent ἐκ (“from/out of”).
    rationale: It locates the things in the house but does not state that the person would go down in order to take them from the house. Replacing it with “vitu kutoka katika nyumba yake” preserves the Greek directional sense.
  revised_text: Aliye juu ya paa[a] asishuke kuchukua vitu kutoka katika nyumba yake.
