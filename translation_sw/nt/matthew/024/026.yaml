  source_fidelity: Tafsiri inahifadhi muundo wa masharti na hitimisho la οὖν, mtenda wa wingi usiotajwa, madai mawili sambamba yanayoanzishwa kwa Ἰδοὺ, na makatazo yote mawili. “Yuko” hudumisha rejeleo la muktadha lisilotajwa kwa jina katika Kigiriki, bila kuongeza cheo au jina.
