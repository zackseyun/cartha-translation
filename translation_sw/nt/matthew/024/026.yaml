id: MAT.24.26
reference: Matthew 24:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: sw
  text: Kwa hiyo, ikiwa watawaambia, “Tazama, yuko nyikani[a],” msitoke; “Tazama, yuko katika vyumba vya ndani[b],” msiamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jangwani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika maghala” au “katika vyumba vya faragha.” Neno la Kigiriki linaweza kumaanisha vyumba vya ndani, maghala, au vyumba vya faragha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, ikiwa
  rationale: ‘Kwa hiyo’ huhifadhi uhusiano wa kimantiki na onyo lililotangulia, na ‘ikiwa’ huonyesha hali ya masharti.
- source_word: εἴπωσιν ὑμῖν
  choice: watawaambia
  rationale: Kiambishi ‘wa-’ huhifadhi nafsi ya tatu wingi isiyotaja kundi maalumu; wakati ujao unasikika kwa kawaida katika sentensi hii ya masharti ya Kiswahili.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni mwito wa moja kwa moja wa kuvuta uangalifu, wenye heshima na unaoeleweka katika Kiswahili cha sasa.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: ‘Nyika’ inaweza kumaanisha eneo lisilokaliwa au la porini bila kulifanya lazima kuwa jangwa la mchanga; ‘jangwani’ limehifadhiwa kama uwezekano katika tanbihi.
- source_word: ἐστίν
  choice: yuko
  rationale: Kiswahili huhitaji upatanisho unaofaa kwa mtu; ‘yuko’ huonyesha mahali bila kuongeza jina au cheo kisichotajwa wazi katika kishazi.
- source_word: μὴ ἐξέλθητε
  choice: msitoke
  rationale: Huhifadhi katazo la moja kwa moja na wazo la kwenda nje kuelekea mahali panapodaiwa.
- source_word: ἐν τοῖς ταμείοις
  choice: katika vyumba vya ndani
  rationale: Huwasilisha vyumba vya ndani au vya faragha bila kusisitiza mno kwamba ni vya siri au ni maghala pekee.
- source_word: μὴ πιστεύσητε
  choice: msiamini
  rationale: Kiswahili kinaweza kuacha yambwa likieleweka kutokana na dai lililonukuliwa, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Rejeleo lisilotajwa wazi la ἐστίν
  choice: yuko
  alternative: Masihi yuko; Yesu yuko huko
  rationale: Muktadha huonyesha kwamba dai linamhusu Yesu/Masihi, lakini kifungu hiki hakitaji jina wala cheo. ‘Yuko’ hutoa kiima kinachoeleweka kisarufi bila kutatua kwa nyongeza jambo ambalo Kigiriki huliacha kwa muktadha.
- issue: Muundo wa madai mawili yanayofuatana
  choice: Kuhifadhi madai mawili sambamba bila kuongeza ‘au’
  alternative: Kuunganisha kwa ‘au’
  rationale: Kigiriki hurudia Ἰδοὺ bila kiunganishi cha kutenganisha. Nukta mkato huhifadhi usambamba na mtiririko wa sentensi moja ya masharti bila kuongeza uhusiano ambao haukutajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja, na nukta mkato huhifadhi usambamba wa maonyo mawili. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
