  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: sw
  text: Nao hawakujua mpaka gharika ilipokuja na kuwafagilia mbali wote; ndivyo itakavyokuwa pia kuja kwa Mwana wa Adamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: hawakutambua
  rationale: Katika muktadha huu, maana ni kwamba watu hawakuelewa au hawakutambua kilichokuwa karibu kutokea; Kiswahili hiki ni cha kawaida na hakiongezi wazo lisilokuwamo katika chanzo.
- source_word: κατακλυσμός
  choice: gharika
  rationale: Neno la kawaida la kibiblia na la Kiswahili Sanifu kwa mafuriko makubwa ya wakati wa Noa.
- source_word: ἦρεν ἅπαντας
  choice: kuwafagilia mbali wote
  rationale: Kitenzi αἴρω hapa kina maana ya kuwaondoa au kuwachukua kwa nguvu ya gharika. Usemi huu unaonyesha maangamizi ya ghafla bila kudokeza kuokolewa au kunyakuliwa.
- source_word: παρουσία
  choice: kuja
  rationale: Katika muktadha huu neno linarejelea kuwasili au kuja kwa Mwana wa Adamu; 'kuja' ni wazi na asili kwa wasomaji wa kawaida.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hifadhi ya cheo cha Kimesiya kilichozoeleka katika tafsiri za Biblia za Kiswahili.
theological_decisions:
- issue: Maana ya watu kuchukuliwa na gharika
  choice: kuwafagilia mbali wote
  alternative: kuwachukua wote
  rationale: Chaguo hili linaweka wazi kwamba gharika iliwaondoa katika hukumu, bila kuingiza maana ya kiitikadi kwamba walichukuliwa kwenda mahali pa usalama.
- issue: Ulinganisho na kuja kwa Mwana wa Adamu
  choice: ndivyo pia kutakavyokuwa kuja kwa Mwana wa Adamu
  alternative: ndivyo kutakavyokuwa kuja kwa Mwana wa Adamu
  rationale: Neno 'pia' linawakilisha καί ya matini ya SBLGNT na kuhifadhi ulinganisho wa moja kwa moja kati ya siku za Noa na kuja kwa Mwana wa Adamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo unaendeleza sentensi iliyotangulia, kama inavyoashiriwa na 'Nao'.
