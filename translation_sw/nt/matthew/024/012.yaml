  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: sw
  text: Na kwa sababu maasi yataongezeka,[a] upendo wa wengi utapoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu uvunjaji wa sheria utaongezeka”; au, “kwa sababu ya kuongezeka kwa maasi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “upendo wa watu wengi utapoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: kwa sababu ... utaongezeka
  rationale: διά pamoja na kitenzi-jina chenye kibainishi huonyesha sababu. Ingawa πληθυνθῆναι ina umbo la kutendwa, Kiswahili cha kawaida huwasilisha wazo hili kwa hali isiyotendea, ‘utaongezeka,’ bila kupoteza maana ya kuenea au kuwa mwingi.
- source_word: ἀνομίαν
  choice: uasi
  rationale: ἀνομία ni hali ya kupuuza au kuvunja sheria, hasa sheria ya Mungu. ‘Uasi’ ni neno la kawaida na lenye uzito unaofaa; tanbihi inadokeza tafsiri ya moja kwa moja zaidi, ‘uvunjaji wa sheria.’
- source_word: ψυγήσεται
  choice: utapoa
  rationale: Kitenzi hiki kinatumia sitiari ya kuwa baridi kueleza kudhoofika kwa upendo. ‘Utapoa’ ni Kiswahili cha asili kinachohifadhi sitiari hiyo.
- source_word: ἀγάπη
  choice: upendo
  rationale: ‘Upendo’ ni tafsiri ya kawaida, sahihi, na isiyobana maana ya ἀγάπη katika muktadha huu.
- source_word: τῶν πολλῶν
  choice: wa wengi
  rationale: Huhifadhi wigo mpana lakini usioainishwa wa Kigiriki bila kuugeuza kuwa dai la kitakwimu kama ‘wa watu wengi zaidi.’
theological_decisions:
- issue: Wigo wa ‘upendo wa wengi’
  choice: wa wengi
  alternative: wa wale wengi; wa waumini wengi; wa watu wengi
  rationale: Kigiriki hakisemi wazi kama kundi hilo ni wanadamu kwa ujumla, wanafunzi wanaojidai, au kundi mchanganyiko. Tafsiri haiongezi utambulisho ambao matini haubainishi.
- issue: Kiini cha ἀνομία
  choice: uasi
  alternative: uvunjaji wa sheria; uovu
  rationale: ‘Uasi’ huonyesha kukataa mamlaka na sheria bila kuingiza dai la kimadhehebu kuhusu aina maalumu ya sheria. ‘Uovu’ ni mpana zaidi, na ‘uvunjaji wa sheria’ ni wa moja kwa moja zaidi lakini mzito kidogo katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi huhifadhi uhusiano wa sababu, sitiari ya upendo kupoa, na kutobainishwa kwa kundi linaloitwa ‘wengi.’
