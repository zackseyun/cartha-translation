base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: sw
  text: Na aliye shambani asirudi nyuma kuchukua vazi lake la nje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho lake” au “vazi lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: aliye shambani
  rationale: Kirai chenye kibainishi kinamtaja mtu kwa hali ya kuwa shambani. Kiswahili hiki ni cha kawaida, kinadumisha umoja, na hakibainishi jinsia isiyolazimishwa na muktadha.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: asirudi nyuma
  rationale: Amri kanushi inaonyesha katazo la haraka. ‘Asirudi nyuma’ ni Kiswahili cha asili kinachohifadhi nguvu ya katazo na maana ya kurejea.
- source_word: ἆραι
  choice: kuchukua
  rationale: Kitenzi-jina kinaonyesha kusudi la kurudi; ‘kuchukua’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: vazi lake la nje
  rationale: ἱμάτιον kwa kawaida ni vazi la nje au joho. ‘Vazi lake la nje’ linaeleweka kwa urahisi katika Kiswahili cha sasa bila kulazimisha umbo maalumu la vazi.
theological_decisions:
- issue: Uwakilishi wa kijinsia katika kibainishi cha kiume kilichotumika kama nomino
  choice: aliye shambani
  alternative: mwanamume aliye shambani
  rationale: Umbo la Kigiriki ni la kiume kisarufi, lakini katika onyo hili linawakilisha mtu yeyote. ‘Aliye shambani’ halipunguzi maana kwa wanaume pekee na linahifadhi umoja wa mhusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa dharura kama ulivyo katika chanzo; ‘asirudi nyuma’ ni wa kawaida zaidi kuliko tafsiri yenye kufuata mpangilio wa Kigiriki neno kwa neno.
