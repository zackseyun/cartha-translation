id: MAT.24.5
reference: Matthew 24:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: sw
  text: Kwa maana wengi watakuja kwa jina langu, wakisema, “Mimi ndiye Masihi[a],” nao watawapotosha wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki ni ὁ χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya wingi wa watu bila kuongeza kiwango kisichotajwa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inaeleza sababu ya onyo lililotangulia; haijaachwa kama inavyoweza kutokea katika tafsiri huru zaidi.
- source_word: ἐλεύσονται
  choice: watakuja
  rationale: Wakati ujao wa ἔρχομαι umetafsiriwa kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Usemi huu wa kawaida unahifadhi wazo la kutumia au kudai jina, mamlaka, au utambulisho wa Yesu bila kulifafanua kupita kiasi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi-tegemezi kinaunganisha kuja kwao na maneno watakayosema, bila kuongeza hukumu kama vile ‘wakidai.’
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Mimi ndiye Masihi
  rationale: ὁ χριστός ni cheo chenye maana ya Mpakwa Mafuta; katika dai hili la utambulisho, ‘Masihi’ linaonyesha wazi kuwa ni cheo, si sehemu ya jina.
- source_word: πλανήσουσιν
  choice: watawapotosha
  rationale: ‘Kupotosha’ hubeba maana ya kuwadanganya watu na kuwaongoza waache njia iliyo sawa, hivyo linaakisi upana wa πλανάω.
- source_word: πολλοὺς
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa maana ya watu wengi; Kiswahili kinaweza kufanya hivyo kwa kawaida bila kuongeza ‘watu.’
theological_decisions:
- issue: Tafsiri ya Χριστός katika dai la mtu kujitambulisha
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unahusu watu wanaodai cheo na utambulisho wa Kimasihi. ‘Masihi’ huonyesha wazi maana ya cheo cha ὁ χριστός, huku ‘Kristo’ ikitolewa katika tanbihi kama tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘Mimi ndiye’ unatoa msisitizo wa Ἐγώ na kuwasilisha dai la utambulisho kwa ufasaha. ‘Nao’ linaendeleza uhusiano wa kishazi cha mwisho bila kufanya sentensi kuwa nzito.
