  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: sw
  text: Yesu alitoka katika eneo la hekalu[a], naye alipokuwa akiondoka, wanafunzi wake wakamjia ili kumwonyesha majengo ya hekalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ἱερόν humaanisha eneo lote la hekalu au viwanja vyake, si jengo la patakatifu pa ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: alipotoka
  rationale: 'Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu: Yesu alitoka, kisha alikuwa akiondoka. Muundo wa “alipotoka” ni wa kawaida na huhifadhi mpangilio huo.'
- source_word: ἱεροῦ
  choice: eneo la hekalu
  rationale: ἱερόν humaanisha eneo lote la hekalu pamoja na nyua na majengo yake, si patakatifu pa ndani pekee. “Eneo la hekalu” huweka maana hii wazi kwa Kiswahili cha kawaida.
- source_word: ἐπορεύετο
  choice: alikuwa akiondoka
  rationale: Wakati usiotimilika unaonyesha mwendo uliokuwa ukiendelea; muundo huu unahifadhi hali hiyo kuliko “aliondoka” pekee.
- source_word: προσῆλθον
  choice: wakamjia
  rationale: Neno hilo lina maana ya kuja au kukaribia mtu. “Wakamjia” ni la kawaida katika simulizi na linaonyesha kuwa walimkaribia Yesu.
- source_word: ἐπιδεῖξαι
  choice: ili kumwonyesha
  rationale: Kitenzi-jina kinaonyesha kusudi la wanafunzi kumjia Yesu.
- source_word: οἰκοδομὰς
  choice: majengo
  rationale: Katika muktadha huu neno linarejelea majengo au miundo iliyojengwa; “majengo” ni wazi na la kawaida.
- source_word: τοῦ ἱεροῦ
  choice: ya hekalu
  rationale: Hiki ni kielezi cha umilikaji kinachobainisha kuwa majengo hayo ni sehemu ya eneo la hekalu.
theological_decisions:
- issue: Kutofautisha ἱερόν na ναός
  choice: eneo la hekalu katika kutajwa kwa kwanza, na hekalu katika kutajwa kwa pili
  alternative: hekalu katika sehemu zote mbili
  rationale: ἱερόν hapa hurejelea eneo pana la hekalu, si patakatifu pa ndani pekee. Kutaja “eneo la hekalu” mara ya kwanza huzuia maana finyu, huku “majengo ya hekalu” ikiwa ya asili na tayari inaonyesha mkusanyiko wa majengo. Hakuna tofauti ya kimadhehebu inayoingizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi; “alikuwa akiondoka” huhifadhi mwendelezo wa tendo katika Kigiriki.
