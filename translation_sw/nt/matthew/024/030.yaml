id: MAT.24.30
reference: Matthew 24:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: sw
  text: Ndipo ishara ya Mwana wa Adamu itaonekana mbinguni[a]. Ndipo makabila yote ya dunia yataomboleza[b], nao watamwona Mwana wa Adamu akija juu ya mawingu ya mbinguni[c], akiwa na nguvu na utukufu mwingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “angani.” Neno la Kigiriki οὐρανός linaweza kumaanisha “mbingu” au “anga,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “makabila yote ya nchi.” Neno la Kigiriki γῆ linaweza kumaanisha “dunia” au “nchi.”
    reason: alternative_reading
  - marker: c
    text: Maneno “akija juu ya mawingu ya mbinguni” yana mwangwi wa Danieli 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: itaonekana
  rationale: Kitenzi hiki katika muktadha huu kina maana ya kujitokeza au kuonekana wazi; “itaonekana” ni Kiswahili cha kawaida na huhifadhi wazo la udhihirisho unaoonekana.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” ndiyo tafsiri ya kawaida na ya moja kwa moja, bila kulazimisha maana mahususi ya dalili ya maafa au alama.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ya Mwana wa Adamu
  rationale: Muundo huu wa umilikishi huhifadhi utata wa Kigiriki kuhusu kama ishara inahusiana na Mwana wa Adamu au kama Mwana wa Adamu mwenyewe ndiye ishara.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: “Mbinguni” huhifadhi sajili ya juu ya kiapokaliptiki; “angani” pia inawezekana kwa kuwa οὐρανός inaweza kumaanisha mbingu au anga.
- source_word: κόψονται
  choice: wataomboleza
  rationale: Katika matumizi haya, kitenzi humaanisha kuomboleza au kulia kwa huzuni. “Wataomboleza” ni wazi na chenye hadhi bila kuingiza tendo maalumu la kujipiga kifua.
- source_word: φυλαὶ
  choice: makabila
  rationale: “Makabila” ndiyo maana ya moja kwa moja ya φυλαί na huhifadhi mwangwi wa lugha ya kinabii na kiapokaliptiki.
- source_word: τῆς γῆς
  choice: ya dunia
  rationale: Muktadha wa ulimwengu na mawingu ya mbinguni unaunga mkono maana pana ya “dunia”; maana mbadala ya “nchi” imehifadhiwa katika tanbihi.
- source_word: ὄψονται
  choice: watamwona
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kuona, huku kiambishi cha yambwa kikimrejelea Mwana wa Adamu kwa uwazi wa kisarufi.
- source_word: ἐρχόμενον
  choice: akija
  rationale: “Akija” huwakilisha vizuri kishirikishi kinachoeleza Mwana wa Adamu akiwa katika tendo la kuja.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: juu ya mawingu ya mbinguni
  rationale: Tafsiri hii ni ya moja kwa moja na huhifadhi mwangwi mkubwa wa Danieli 7:13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: akiwa na nguvu na utukufu mwingi
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kuwa πολλῆς inahusiana moja kwa moja na “utukufu,” bila kuhamishia kivumishi hicho kwa “nguvu.”
theological_decisions:
- issue: Maana ya “ishara ya Mwana wa Adamu”
  choice: Utata wa muundo wa umilikishi umehifadhiwa kwa kusema “ishara ya Mwana wa Adamu.”
  alternative: “ishara inayomhusu Mwana wa Adamu” au “ishara, yaani Mwana wa Adamu mwenyewe”
  rationale: Kigiriki hakilazimishi uamuzi mmoja kuhusu uhusiano wa ishara na Mwana wa Adamu; tafsiri haipaswi kutatua kimya-kimya hoja hii ya kieskatolojia.
- issue: Upeo wa γῆ katika “makabila yote ya dunia”
  choice: γῆ imetafsiriwa “dunia” katika matini kuu.
  alternative: “nchi”
  rationale: Muktadha wa kiulimwengu na wa kiapokaliptiki unapendelea maana pana, lakini neno hilo linaweza pia kumaanisha nchi, hasa kwa kuzingatia miangwi ya kinabii; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Mwangwi wa Danieli 7:13
  choice: Maneno “akija juu ya mawingu ya mbinguni” yamehifadhiwa karibu na muundo wa chanzo.
  alternative: Tafsiri huru isiyotaja wazi “juu ya mawingu”
  rationale: Muundo huu una mwangwi muhimu wa Danieli 7:13, hivyo unapaswa kubaki dhahiri bila kuongezewa ufafanuzi wa kimadhehebu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo” huwasilisha τότε kwa ufupi na kwa mtiririko wa kinabii. Mpangilio wa tanbihi umewekwa kwenye vipashio vinavyohusika moja kwa moja: [a] baada ya “mbinguni,” [b] baada ya “yataomboleza” kwa kishazi “makabila yote ya dunia,” na [c] baada ya rejeo la mawingu.'
