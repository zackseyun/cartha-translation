reference: Matthew 24:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: sw
  text: Na hii habari njema ya ufalme itatangazwa katika ulimwengu wote[a] kuwa ushuhuda kwa mataifa yote[b], ndipo mwisho utakapokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ulimwengu wote unaokaliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa makundi yote ya watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: itatangazwa
  rationale: Kitenzi cha wakati ujao katika kauli ya kutendwa kinaonyesha kutolewa kwa ujumbe hadharani. “Itatangazwa” ni Kiswahili cha kawaida kinachohifadhi wazo la tangazo la wazi bila kulifanya neno hilo kuwa la matumizi ya kanisani pekee.
- source_word: εὐαγγέλιον
  choice: habari njema
  rationale: Hili ndilo maana ya msingi ya neno la Kigiriki na linaeleweka kwa urahisi katika Kiswahili cha sasa. Pia huepuka kutegemea tu istilahi ya kanisani “injili,” ingawa dhana yake ya kitheolojia inabaki katika muktadha.
- source_word: τῆς βασιλείας
  choice: ya ufalme
  rationale: Muundo huu unafuata kwa karibu uhusiano wa kimilikishi katika Kigiriki na kuhifadhi usemi “habari njema ya ufalme” bila kuufafanua zaidi kuwa “kuhusu ufalme.”
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: katika ulimwengu wote
  rationale: Usemi huu ni wa kawaida na wa asili katika Kiswahili, huku ukibeba wigo mpana wa ulimwengu unaokaliwa na wanadamu. Tanbihi inadumisha uwezekano wa tafsiri iliyo rasmi zaidi.
- source_word: εἰς μαρτύριον
  choice: kuwa ushuhuda
  rationale: 'Huhifadhi wazo la kusudi au matokeo: kutangazwa huko kunatumika kama ushuhuda. Tafsiri hii haiamui kimya kimya kama ushuhuda huo ni kwa ajili ya wasikilizaji au dhidi yao.'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: kwa mataifa yote
  rationale: “Mataifa” huhifadhi maana pana na mwangwi wa kibiblia wa ἔθνη bila kuibana kwa “Watu wa Mataifa” kinyume na Wayahudi. Tanbihi inaonyesha uwezekano wa kuelewa makundi ya watu.
- source_word: ἥξει
  choice: utakapokuja
  rationale: “Kuja” ni tafsiri ya kawaida na ya asili ya ἥκω katika muktadha huu. Muundo wa “ndipo ... utakapokuja” unaonyesha kwa uwazi mfuatano unaowasilishwa na καὶ τότε.
- source_word: τὸ τέλος
  choice: mwisho
  rationale: “Mwisho” ni tafsiri ya moja kwa moja na yenye uzito wa kutosha; haiongezi mfumo maalumu wa nyakati za mwisho ambao haujaelezwa wazi katika mstari.
theological_decisions:
- issue: Wigo wa οἰκουμένη na ἔθνη katika kauli kuhusu mwisho
  choice: Kutumia lugha yenye wigo wa ulimwengu mzima—“katika ulimwengu wote” na “kwa mataifa yote”—bila kuifungamanisha na ufafanuzi maalumu wa ratiba ya mwisho.
  alternative: “Katika ulimwengu wote unaokaliwa” na “kwa makundi yote ya watu,” au kuuelekeza usemi hasa kwa ulimwengu wa Dola ya Roma.
  rationale: Mstari unaonyesha kuenea kwa tangazo kwa upana kabla ya “mwisho.” Tafsiri inapaswa kuhifadhi upana huo na mvutano wa kitheolojia bila kuamua mjadala kuhusu utimilifu wa kihistoria, jiografia mahsusi, au mpangilio wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Habari njema” imechaguliwa badala ya istilahi ya kanisani “injili”; “itatangazwa” inadumisha wazo la tangazo la hadharani. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
