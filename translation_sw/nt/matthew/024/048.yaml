lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Lakini ikiwa
  rationale: “Ikiwa” huhifadhi hali ya sharti inayoletwa na ἐὰν, na “lakini” huonyesha utofautishaji wa kiasi unaoletwa na δέ.
- source_word: εἴπῃ
  choice: atasema
  rationale: Wakati ujao baada ya “ikiwa” ni muundo wa kawaida wa Kiswahili wa kueleza jambo linalowezekana, huku ukihifadhi maana ya sharti ya kitenzi tegemezi cha Kigiriki.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: mtumishi yule mwovu
  rationale: “Mtumishi” linafaa kwa jukumu la mhusika katika nyumba ya mfano, huku “yule mwovu” likihifadhi msisitizo wa kiwakilishi ἐκεῖνος na hukumu ya kimaadili ya κακός.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: moyoni mwake
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi sitiari ya moyo kuwa mahali pa mawazo ya ndani.
- source_word: Χρονίζει
  choice: anakawia
  rationale: “Anakawia” huonyesha hali inayoendelea ya kuchelewa au kuchukua muda mrefu, kama wakati uliopo wa Kigiriki.
- source_word: μου ὁ κύριος
  choice: Bwana wangu
  rationale: “Bwana” linaweza kueleza mkuu wa mtumishi katika mazingira ya nyumba na pia kudumisha mwangwi mpana wa κύριος; “wangu” huhifadhi kiwakilishi milikishi μου.
theological_decisions:
- issue: Maana ya κύριος katika mfano wa nyumba
  choice: Bwana
  alternative: mkuu wa nyumba
  rationale: Katika kiwango cha simulizi, neno linamtaja mkuu wa mtumishi, lakini “Bwana” ni la kawaida na lenye heshima katika Kiswahili na halifuti uwezekano wa wasomaji kuona maana pana katika muktadha wa kurudi kwa Mwana wa Adamu. Tanbihi inaeleza mazingira bila kulazimisha tafsiri ya kiteolojia.
- issue: Maana ya δοῦλος katika mstari huu
  choice: mtumishi
  alternative: mtumwa
  rationale: Mkazo wa mfano uko katika jukumu alilokabidhiwa mtu huyo na mwenendo wake nyumbani, si hasa hali yake ya kisheria. Hata hivyo, “mtumwa” ni maana halali ya δοῦλος na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Moyoni mwake” huhifadhi ladha ya kibiblia bila kuwa ya kizamani, na “anakawia” huwasilisha kuchelewa kunakoendelea.
