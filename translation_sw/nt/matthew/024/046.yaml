  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: sw
  text: Heri mtumishi yule ambaye bwana wake, atakapokuja, atamkuta akifanya hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Heri
  rationale: Neno la kawaida na lenye hadhi kwa tamko la baraka au hali yenye kibali.
- source_word: δοῦλος
  choice: mtumishi
  rationale: Katika muktadha huu wa mwenye nyumba na wajibu uliokabidhiwa, “mtumishi” ni ya asili katika Kiswahili; ingawa neno la Kigiriki linaweza pia kumaanisha “mtumwa”.
- source_word: κύριος
  choice: bwana
  rationale: Huhifadhi maana ya mwenye mamlaka juu ya mtumishi na pia mwangwi wa cheo “Bwana” katika muktadha mpana, bila kulazimisha herufi kubwa hapa.
- source_word: ἐλθὼν ... εὑρήσει
  choice: atakapokuja, atamkuta
  rationale: Huwasilisha kwa Kiswahili cha kawaida uhusiano wa wakati kati ya kuja kwa bwana na kumkuta mtumishi.
- source_word: οὕτως ποιοῦντα
  choice: akifanya hivyo
  rationale: Huhifadhi rejeo la nyuma lenye ufupi la Kigiriki kwa tendo lililoelezwa katika mstari uliotangulia.
theological_decisions:
- issue: κύριος kama bwana wa mtumishi na mwangwi wa cheo cha Kristo
  choice: bwana wake
  alternative: mwajiri wake / mkuu wake
  rationale: “Bwana” huhifadhi wigo wa neno la Kigiriki na uzito wa mfano bila kupunguza maana kuwa uhusiano wa ajira pekee.
- issue: δοῦλος na hadhi ya mhusika
  choice: mtumishi
  alternative: mtumwa
  rationale: “Mtumishi” ni chaguo linalosomeka kwa kawaida katika mfano huu, lakini halibadili uhusiano wa mamlaka unaoonyeshwa na “bwana wake”.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye hadhi. Mpangilio umewekwa wa asili: tamko la heri, mhusika, kisha hali ya kuja kwa bwana na tendo analomkuta akifanya.'
