  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: sw
  text: Popote palipo na mzoga, huko tai wala mizoga[a] watakusanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tai.” Neno la Kigiriki linaweza pia kumaanisha tai (eagles), lakini katika muktadha wa ndege wanaokusanyika kwenye mzoga, “tai wala mizoga” hufaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Popote ulipo
  rationale: Muundo wenye ἐάν na hali tegemezi una maana isiyofungamana na mahali maalumu; “popote ulipo” ni Kiswahili cha kawaida kinachohifadhi maana ya “mahali popote ambapo ... upo.”
- source_word: πτῶμα
  choice: mzoga
  rationale: Neno hilo humaanisha mwili uliokufa. Katika taswira ya ndege wala mizoga, “mzoga” ni la asili na linafaa bila kuamua kama mwili huo ni wa mwanadamu au mnyama.
- source_word: συναχθήσονται
  choice: watakusanyika
  rationale: 'Ingawa umbo la Kigiriki ni la wakati ujao katika kauli ya kutendwa, katika muktadha huu linaelezwa kwa kawaida kwa kitenzi kisichohitaji mtendaji aliyetajwa: ndege watakusanyika mahali hapo.'
- source_word: ἀετοί
  choice: tai
  rationale: “Tai” katika matumizi ya Kiswahili inaweza kurejelea ndege wakubwa wa kuwinda au kula mizoga, na inafaa kwa taswira ya ndege wanaokusanyika kwenye mzoga. Hata hivyo, neno la Kigiriki mara nyingi humaanisha tai aina ya eagle; uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana pana ya mfano huu katika mafundisho kuhusu mambo ya mwisho
  choice: Kuacha methali kama taswira ya moja kwa moja bila kutaja mzoga na ndege wanawakilisha nini
  alternative: Kuifafanua kama hukumu isiyoepukika, kuonekana kwa kuja kwa Mwana wa Adamu, kuharibiwa kwa Yerusalemu, au majeshi ya Roma
  rationale: Kigiriki hakitambulishi wazi mzoga wala ndege kama alama za kitu fulani. Tafsiri inapaswa kuhifadhi utata na mvutano wa kitheolojia badala ya kuingiza ufafanuzi mmoja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Mpangilio “Popote ulipo ... huko ...” unahifadhi muundo na mkazo wa sentensi ya Kigiriki.
