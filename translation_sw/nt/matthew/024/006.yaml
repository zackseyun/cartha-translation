id: MAT.24.6
reference: Matthew 24:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: sw
  text: Nanyi mtasikia kuhusu vita na taarifa za vita.[a] Angalieni msifadhaike, kwa maana ni lazima hayo yatokee, lakini mwisho bado haujafika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvumi wa vita.” Neno la Kigiriki linaweza kumaanisha taarifa, habari, au uvumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: mtasikia
  rationale: Wakati ujao wa μέλλω pamoja na kitenzi-jina huonyesha jambo linalotarajiwa kutokea. Katika Kiswahili, wakati ujao wa kawaida ni wa asili na hautilii mkazo usio wa lazima juu ya ukaribu wa tukio.
- source_word: ἀκούειν
  choice: kusikia habari za
  rationale: Katika muktadha huu maana ni kupokea habari kuhusu vita, si kusikia sauti za mapigano moja kwa moja.
- source_word: πολέμους
  choice: vita
  rationale: πόλεμος kwa kawaida humaanisha vita, wala si pambano moja tu.
- source_word: ἀκοὰς πολέμων
  choice: taarifa za vita
  rationale: ἀκοή inaweza kumaanisha taarifa, habari, au uvumi. “Taarifa” ni pana na haidokezi kwamba habari hizo ni za uongo.
- source_word: ὁρᾶτε
  choice: Angalieni
  rationale: Amri hii inaanzisha onyo lenye maana ya kuwa waangalifu ili jambo linalofuata lisitokee.
- source_word: μὴ θροεῖσθε
  choice: msifadhaike
  rationale: θροέομαι humaanisha kushtushwa, kuvurugika, au kuingiwa na hofu; “msifadhaike” ni ya kawaida na haiongezi kiwango cha hofu kuliko kilicho katika Kigiriki.
- source_word: δεῖ γὰρ γενέσθαι
  choice: kwa maana ni lazima hayo yatokee
  rationale: δεῖ huonyesha ulazima, na γενέσθαι hapa ni “kutokea.” “Hayo” hurejelea vita na taarifa zilizotajwa bila kuingiza mpangilio maalumu wa matukio.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: lakini mwisho bado
  rationale: Kauli hii fupi na ya kawaida hudumisha maana kwamba mwisho haujafika bado, huku ikiacha “mwisho” ukiwa mpana kama katika Kigiriki.
theological_decisions:
- issue: Maana ya kieskatolojia ya τὸ τέλος
  choice: mwisho
  alternative: ukamilisho wa mambo yote
  rationale: “Mwisho” hudumisha upana wa neno la Kigiriki bila kulifungamanisha na mpangilio fulani wa kimadhehebu kuhusu matukio ya mwisho.
- issue: Ulazima katika δεῖ
  choice: ni lazima hayo yatokee
  alternative: hayo yatatokea
  rationale: Tafsiri inahifadhi dhana ya ulazima iliyo wazi katika δεῖ bila kueleza chanzo au mfumo wa ulazima huo zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nanyi” huendeleza kiunganishi δέ, na “Angalieni msifadhaike” ni onyo linaloeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
