  to: Nanyi mtasikia kuhusu vita na taarifa za vita.[a] Angalieni msifadhaike, kwa maana ni lazima hayo yatokee, lakini mwisho bado haujafika.
  rationale: The revision distinguishes wars from reports of wars in idiomatic Swahili, clarifies that the end has not yet arrived, and moves the footnote marker to its precise lexical anchor. It does not narrow the eschatological sense of “mwisho” or explain the source of the necessity expressed by δεῖ.
