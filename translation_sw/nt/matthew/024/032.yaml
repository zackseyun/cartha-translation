  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: sw
  text: 'Jifunzeni mfano[a] kutoka kwa mtini: mara tu tawi lake linapokuwa laini na kutoa majani[b], mnajua kwamba majira ya joto[c] yamekaribia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fundisho” au “mfano wa kulinganisha.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuchipusha majani.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki θέρος linaweza kumaanisha “majira ya joto” na, katika baadhi ya miktadha, majira ya mavuno; hapa maana ya msimu inafaa zaidi kwa taswira ya mtini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: kutokana na mtini
  rationale: Kirai ἀπό pamoja na hali ya umilikishi huonyesha chanzo cha jambo linalofunzwa. “Kutokana na mtini” ni Kiswahili cha kawaida kinachohifadhi wazo hilo. δέ ni kiunganishi hafifu cha muktadha, hivyo hakikulazimishwa kuwa “lakini” au “sasa,” maneno ambayo yangeongeza mkazo usio dhahiri hapa.
- source_word: μάθετε
  choice: jifunzeni
  rationale: Ni amri ya nafsi ya pili wingi. “Jifunzeni” huhifadhi mwito wa moja kwa moja wa kupata fundisho, bila kuubadili kuwa matokeo tu ya kuelewa.
- source_word: τὴν παραβολήν
  choice: mfano
  rationale: παραβολή hapa ni ulinganisho wenye kufundisha. “Mfano” ni neno la kawaida na lenye hadhi katika Kiswahili, huku tanbihi ikitaja uwezekano wa “fundisho” au “mfano wa kulinganisha.”
- source_word: ὅταν ἤδη
  choice: mara tu
  rationale: ὅταν huanzisha hali ya wakati inayojirudia au ya kawaida, na ἤδη huonyesha kwamba dalili imeanza kuonekana. “Mara tu” huwasilisha mwanzo huo kwa Kiswahili cha asili.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: tawi lake linapokuwa laini
  rationale: γένηται huonyesha kuingia katika hali fulani, na ἁπαλός hueleza ulaini wa chipukizi jipya. “Linapokuwa laini” huhifadhi taswira ya mimea bila ufafanuzi wa ziada.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: na kutoa majani
  rationale: ἐκφύῃ huonyesha kuchipusha au kutoa. “Kutoa majani” ni usemi wa kawaida wa Kiswahili kwa ukuaji wa mmea; “kuchipusha majani” limetolewa kama badala katika tanbihi.
- source_word: γινώσκετε
  choice: mnajua
  rationale: Ni kitenzi cha nafsi ya pili wingi katika hali ya taarifa, kikieleza utambuzi wa kawaida. “Mnajua” hakikibadili kimakosa kuwa amri.
- source_word: ἐγγὺς τὸ θέρος
  choice: kiangazi kimekaribia
  rationale: θέρος hapa kwa kawaida hurejelea msimu wa joto/kiangazi, na ἐγγύς huonyesha ukaribu. “Kiangazi kimekaribia” ni Kiswahili cha kawaida cha Afrika Mashariki na kinaendana na dalili ya mtini.
theological_decisions:
- issue: Maana ya taswira ya mtini
  choice: Mtini umetafsiriwa kama taswira ya msimu bila kuutambulisha moja kwa moja na Israeli.
  alternative: Kuufanya mtini katika tafsiri yenyewe kuwa ishara ya Israeli, au kusisitiza kwamba ni mfano wa kawaida tu wa kimaumbile.
  rationale: Aya yenyewe inatoa ulinganisho wa kutambua ukaribu kwa kuangalia dalili. Tafsiri inadumisha taswira hiyo bila kuamua mabishano mapana ya kieskatolojia ambayo hayajasemwa wazi katika aya hii.
- issue: Maana ya θέρος
  choice: kiangazi
  alternative: mavuno
  rationale: Neno linaweza kuhusishwa na majira ya mavuno katika baadhi ya miktadha, lakini hapa dalili ya majani ya mtini inaunga mkono maana ya msimu. Tanbihi inahifadhi uwezekano mwingine bila kuuingiza katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na rahisi kueleweka; “mtini,” “tawi,” na “kiangazi” huhifadhi taswira halisi ya aya. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
