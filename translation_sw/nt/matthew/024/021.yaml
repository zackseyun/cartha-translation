  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: sw
  text: Kwa maana wakati huo kutakuwa na dhiki kuu[a], ambayo haijapata kutokea tangu mwanzo wa ulimwengu mpaka sasa, wala haitatokea tena kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu kubwa” au “mateso makali.” Neno la Kigiriki linaweza kumaanisha taabu kali, shinikizo, mateso, au kukandamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Kwa maana wakati huo
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kueleza sababu inayounganisha mstari huu na onyo lililotangulia, na “wakati huo” hutafsiri τότε kwa Kiswahili cha kawaida.
- source_word: ἔσται
  choice: kutakuwa na
  rationale: Muundo huu wa uwepo ni wa asili katika Kiswahili na unamweka “dhiki kuu” kama jambo litakalokuwapo.
- source_word: θλῖψις μεγάλη
  choice: dhiki kuu
  rationale: “Dhiki” huweza kumaanisha taabu, mateso, au hali nzito ya kukandamizwa; “kuu” huhifadhi uzito wa μεγάλη na mwangwi wa muktadha wa matukio ya mwisho bila kuongeza fundisho maalumu.
- source_word: οἵα
  choice: ambayo
  rationale: Katika kishazi kizima, “ambayo haijapata kutokea” huwasilisha ulinganisho wa aina na ukubwa usio na mfano kwa Kiswahili cha asili.
- source_word: οὐ γέγονεν
  choice: haijapata kutokea
  rationale: Kauli hii huonyesha kwamba tukio la namna hiyo halijawahi kutokea hadi wakati unaotajwa, huku ikihifadhi maana ya kitukio ya γίνομαι.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: tangu mwanzo wa ulimwengu
  rationale: “Ulimwengu” hutafsiri κόσμος moja kwa moja bila kupanua neno hilo kuwa “uumbaji,” na “tangu” huonyesha mwanzo wa kipindi cha wakati.
- source_word: ἕως τοῦ νῦν
  choice: mpaka sasa
  rationale: Ni tafsiri fupi na ya kawaida ya kishazi hiki cha wakati.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: wala haitatokea tena kamwe
  rationale: “Wala” huendeleza ukanushaji, na “haitatokea tena kamwe” huwasilisha kwa nguvu ukanushaji wa wakati ujao wa οὐ μή pamoja na ulinganisho unaodokezwa.
theological_decisions:
- issue: Tafsiri ya θλῖψις yenye uzito wa kieskatolojia
  choice: dhiki kuu
  alternative: taabu kubwa; mateso makali
  rationale: “Dhiki kuu” huhifadhi uzito na mwangwi wa neno katika hotuba ya Yesu kuhusu wakati ujao, lakini hailifanyi kuwa istilahi ya mfumo fulani wa mafundisho.
- issue: Nguvu ya ukanushaji wa wakati ujao
  choice: wala haitatokea tena kamwe
  alternative: wala haitatokea
  rationale: Neno “kamwe” huonyesha msisitizo wa οὐ μή; “tena” huendeleza ulinganisho na historia yote iliyotajwa bila kufafanua zaidi namna au muda wa utimilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhiki kuu” inaeleweka kwa wasomaji wa kawaida na pia huhifadhi uzito wa kifungu. Muundo umeepuka lugha ya dhehebu au ufafanuzi unaobainisha ratiba maalumu ya matukio ya mwisho.
