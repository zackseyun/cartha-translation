base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: sw
  text: Lakini ole wao walio wajawazito na wanaonyonyesha watoto katika siku hizo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: ole wao
  rationale: Inahifadhi nguvu ya tamko la kinabii linaloonyesha huzuni na dhiki inayokuja; katika Kiswahili, “ole wao” ni tamko la kawaida na lenye hadhi.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofautishaji wa kiasi kutoka onyo lililotangulia bila kuufanya utofautishaji huo kuwa mkali kupita kiasi.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: walio wajawazito
  rationale: Ni tafsiri ya asili ya nahau ἐν γαστρὶ ἔχω, yaani kuwa mjamzito, huku ikifuata ujenzi wa Kigiriki unaowarejelea watu walio katika hali hiyo.
- source_word: ταῖς θηλαζούσαις
  choice: wanaonyonyesha
  rationale: Kitenzi hiki hueleza kuwanyonyesha watoto; Kiswahili kinaweza kuacha yambwa likieleweka kwa kawaida kama ilivyo katika Kigiriki.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: katika siku hizo
  rationale: Ni usemi wa wakati ulio wazi, wa kawaida, na unaolingana moja kwa moja na chanzo.
theological_decisions:
- issue: Wanaorejelewa na vivumishi-jina vya kike katika Kigiriki
  choice: walio wajawazito na wanaonyonyesha
  alternative: wanawake wajawazito na wanawake wanaonyonyesha watoto
  rationale: Maumbo ya Kigiriki ni ya kike, lakini Kiswahili huonyesha maana hiyo kiasili kupitia hali ya ujauzito na tendo la kunyonyesha bila kulazimika kuongeza nomino “wanawake.” Hivyo mkazo unabaki juu ya mazingira yao magumu katika siku hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Hakuna tanbihi iliyoongezwa kwa kuwa mbadala wa Kiingereza unaosema “wanawake” hauleti tofauti ya maana inayohitaji kuelezwa katika Kiswahili.
