  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: sw
  text: Lakini kuhusu siku ile na saa ile, hakuna anayejua—hata malaika wa mbinguni, wala Mwana[a]—isipokuwa Baba peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati hazina maneno “wala Mwana.” Maandishi makuu yanafuata usomaji wa SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Lakini kuhusu
  rationale: περί pamoja na nomino katika hali ya umilikishi huanzisha mada, nayo δέ huonyesha mpito wenye tofauti ndogo na yaliyotangulia. “Lakini kuhusu” huhifadhi kazi zote mbili kwa Kiswahili cha kawaida.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: siku ile na saa ile
  rationale: Kirai hiki kinataja wakati maalumu. Kurudia “ile” ni njia ya asili na iliyo wazi katika Kiswahili ya kuonyesha kwamba siku na saa zote mbili ndizo zinazorejelewa, bila kubadili “na” kuwa “au.”
- source_word: οὐδεὶς οἶδεν
  choice: hakuna anayejua
  rationale: οὐδείς ni ukanushaji unaomhusisha kila mtu, na οἶδεν hapa ina maana ya hali ya sasa ya kujua. “Hakuna anayejua” ni wazi na ya sasa.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: hata malaika wa mbinguni
  rationale: οὐδέ huongeza kundi jingine kwa msisitizo; “hata” huleta vizuri maana ya “si hata.” “Malaika wa mbinguni” ni Kiswahili cha asili kwa genitivi hiyo.
- source_word: οὐδὲ ὁ υἱός
  choice: wala Mwana
  rationale: “Wala” huunganisha kipengele hiki na ukanushaji uliotangulia. “Mwana” linahifadhi jina la cheo linalotambulika katika muktadha bila kulainisha dai la kutokujua.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Baada ya kauli iliyokanushwa, εἰ μή inaonyesha jambo la pekee lisilohusishwa katika ukanushaji, hivyo “isipokuwa” inafaa kuliko maana ya masharti.
- source_word: ὁ πατὴρ μόνος
  choice: Baba peke yake
  rationale: μόνος hufanya maarifa hayo yawe ya Baba tu. “Baba peke yake” ni ya asili na huhifadhi upekee huo.
theological_decisions:
- issue: Maana ya kikristolojia ya “wala Mwana”
  choice: Maneno “wala Mwana” yamehifadhiwa katika maandishi makuu bila kupunguzwa au kufafanuliwa kwa nyongeza.
  alternative: Kuyaacha kwa kufuata baadhi ya hati, au kuyafafanua kwa namna inayopunguza mvutano kuhusu uungu wa Mwana.
  rationale: SBLGNT ina οὐδὲ ὁ υἱός. Tafsiri inahifadhi wazi dai la mstari kuhusu Mwana kutokujua siku na saa hiyo, bila kujaribu kutatua mvutano wa kiteolojia ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Alama za vistari virefu zinaweka vipengele vya “hata malaika… wala Mwana” kama msisitizo wa kauli kuu bila kubadili uhusiano wa kisarufi.
