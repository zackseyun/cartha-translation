  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: sw
  text: Kwa maana watatokea masihi wa uongo[a] na manabii wa uongo, nao watafanya ishara kubwa na maajabu ili kuwapotosha[b], ikiwezekana[c], hata wateule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “makristo wa uongo.” Neno la Kigiriki hutumia cheo Christos; hapa limetafsiriwa “masihi” kwa sababu linatumika kama cheo. Maana ni watu wanaodai kwa uongo kuwa Masihi.
    reason: alternative_reading
  - marker: b
    text: Au, “kuwadanganya.” Kitenzi kinaweza kumaanisha kumfanya mtu apotee au aende njia isiyo sahihi; ndiyo maana kimetafsiriwa “kuwapotosha.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kama ingewezekana.” Kigiriki kinasema kwa ufupi “ikiwezekana,” bila kueleza wazi maana yake pana ya kitheolojia.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: watatokea
  rationale: Katika muktadha huu kitenzi hiki kinamaanisha kujitokeza au kuonekana hadharani, wala si kufufuliwa.
- source_word: ψευδόχριστοι
  choice: masihi wa uongo
  rationale: Χριστός hapa ni cheo; “masihi” huhifadhi maana hiyo, huku ψευδο- ikitafsiriwa kwa “wa uongo.”
- source_word: ψευδοπροφῆται
  choice: manabii wa uongo
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida na inayoeleweka ya nomino ambatani.
- source_word: δώσουσιν
  choice: watafanya
  rationale: Ingawa maana ya msingi ni “watatoa,” inapohusishwa na ishara na maajabu Kiswahili cha kawaida husema “kufanya.”
- source_word: σημεῖα μεγάλα
  choice: ishara kubwa
  rationale: “Ishara” huhifadhi wazo la matendo yenye umuhimu wa kuthibitisha au kuashiria, bila kuyafanya yawe “miujiza” tu.
- source_word: τέρατα
  choice: maajabu
  rationale: “Maajabu” huwasilisha tabia ya matendo yanayostaajabisha na ni ya kawaida katika jozi “ishara na maajabu.”
- source_word: ὥστε πλανῆσαι
  choice: ili kuwapotosha
  rationale: Muundo huu wa Kiswahili ni wa kawaida na huhifadhi uwezekano wa kusudi au matokeo yanayokusudiwa bila kulazimisha utofautishaji mkali.
- source_word: πλανῆσαι
  choice: kuwapotosha
  rationale: “Kupotosha” hujumuisha kuwafanya watu waende njia isiyo sahihi, si kusema uongo kwao tu.
- source_word: εἰ δυνατὸν
  choice: ikiwezekana
  rationale: Hii hufuata ufupi wa Kigiriki na haiongezi maana ya kinyume na uhalisi ambayo haijaelezwa wazi.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: hata wateule
  rationale: καί ina nguvu ya kupandisha uzito hapa, hivyo “hata”; “wateule” ni istilahi sahihi na ya kawaida kwa ἐκλεκτούς.
theological_decisions:
- issue: Tafsiri ya ψευδόχριστοι wakati Χριστός ni cheo
  choice: masihi wa uongo
  alternative: wakristo wa uongo / Kristo wa uongo
  rationale: “Masihi” huonyesha kuwa wanaodaiwa ni watu wanaojifanya kuwa Masihi. “Wakristo wa uongo” ingebadili maana kuwa wafuasi bandia, na “Kristo wa uongo” si ya kawaida kwa wingi katika Kiswahili.
- issue: Nguvu ya εἰ δυνατὸν kuhusu wateule
  choice: ikiwezekana
  alternative: kama ingewezekana
  rationale: Kigiriki kinasema tu “ikiwa inawezekana.” Tafsiri hii huhifadhi hali ya masharti bila kuamua kimbele mjadala wa kitheolojia kuhusu uwezekano wa wateule kupotoshwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida. “Masihi,” “manabii,” “ishara na maajabu,” na “wateule” huhifadhi istilahi za kibiblia bila kuwa nzito kupita kiasi.
