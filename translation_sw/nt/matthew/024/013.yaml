lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na maonyo yaliyotangulia kuhusu kuanguka; “Lakini” huonyesha utofauti huo kwa kawaida katika Kiswahili.
- source_word: ὁ ... ὑπομείνας
  choice: atakayevumilia
  rationale: Kifungu chenye kibainishi na kitenzi-shirikishi kinamtaja mtu anayestahimili. Umbo la Kiswahili “atakayevumilia” ni la kawaida, halibainishi jinsia, na linafaa kwa mwelekeo wa sentensi unaotazama mwisho.
- source_word: ὑπομείνας (ὑπομένω)
  choice: vumilia
  rationale: “Kuvumilia” huwasilisha maana ya kudumu chini ya mateso au majaribu bila kuongeza maana mahsusi ya kiteolojia.
- source_word: εἰς τέλος
  choice: mpaka mwisho
  rationale: Kifungu hiki kinaonyesha kuendelea hadi kufikia kikomo. “Mpaka mwisho” ni sahihi na cha kawaida katika Kiswahili; “hadi mwisho” pia kinawezekana.
- source_word: οὗτος
  choice: ndiye
  rationale: “Ndiye” kinahifadhi msisitizo wa kiwakilishi cha Kigiriki kinachomrejelea tena mtu aliyetajwa, huku sentensi ikibaki ya asili katika Kiswahili.
- source_word: σωθήσεται
  choice: atayeokolewa
  rationale: Kitenzi hiki cha wakati ujao na kauli tendwa kinaweza kumaanisha kuokolewa au kukombolewa kutoka hatarini. “Ataokolewa” huhifadhi maana pana ya wokovu bila kuibana kuwa kupona kwa muda tu.
theological_decisions:
- issue: Maana ya σωθήσεται katika muktadha wa kuvumilia hadi mwisho
  choice: atayeokolewa
  alternative: atakayekombolewa / atakayeponywa kutoka hatarini
  rationale: Mstari haubainishi wazi ikiwa unaongelea wokovu wa mwisho, kukombolewa katika dhiki, au yote mawili. Tafsiri pana “ataokolewa” inahifadhi mvutano huo bila kuingiza hitimisho la dhehebu kuhusu uvumilivu au aina kamili ya wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “ndiye atakayeokolewa” huhifadhi msisitizo wa οὗτος kwa njia ya kawaida na inayoeleweka.
