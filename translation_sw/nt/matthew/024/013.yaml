translation:
  language: sw
  text: Lakini atakayevumilia mpaka mwisho ndiye atakayeokolewa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi mwisho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atakayekombolewa.” Neno la Kigiriki linaweza kumaanisha kuokolewa au kukombolewa kutoka hatarini; tafsiri pana imetumiwa hapa kwa sababu muktadha haulazimishi maana moja tu.
