  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: sw
  text: Kwa maana taifa litainuka dhidi ya taifa[a], na ufalme dhidi ya ufalme, na kutakuwa na njaa na matetemeko ya ardhi mahali mbalimbali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “litasimama dhidi ya taifa.” Msemo wa Kigiriki unaonyesha kuzuka kwa uhasama kati ya mataifa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika sehemu tofauti” au “kutoka mahali hadi mahali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: litasimama
  rationale: Katika muundo huu kitenzi kinaeleza taifa kuinuka au kusimama kwa uhasama dhidi ya jingine. “Litasimama dhidi ya” ni Kiswahili cha kawaida kinachodumisha wazo la kuzuka kwa mapambano bila kuongeza kwamba Mungu ndiye anayelisababisha.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inafafanua yaliyotangulia; “Kwa maana” hudumisha uhusiano huo wa kimantiki kwa Kiswahili sanifu.
- source_word: ἔθνος
  choice: taifa
  rationale: Hapa neno linamaanisha jamii kubwa ya kisiasa au kikabila na linalingana sambamba na “ufalme.” “Taifa” linadumisha maana hiyo bila kulifanya limaanishe hasa watu wa Mataifa.
- source_word: ἐπὶ ἔθνος
  choice: dhidi ya taifa
  rationale: ἐπί pamoja na hali ya kushutumiwa katika msemo huu huonyesha uhasama; “dhidi ya” ni tafsiri ya kawaida kuliko tafsiri halisi ya “juu ya.”
- source_word: βασιλεία
  choice: ufalme
  rationale: Katika muktadha huu ni eneo au dola inayotawaliwa na mfalme, sambamba na “taifa”; “ufalme” huhifadhi uzito wa kisiasa wa neno.
- source_word: ἔσονται
  choice: kutakuwa na
  rationale: Huu ni matumizi ya kitenzi cha kuwapo, na “kutakuwa na” ni namna ya asili ya kukieleza kwa Kiswahili.
- source_word: λιμοὶ
  choice: njaa
  rationale: Neno la Kigiriki ni wingi na humaanisha vipindi vya upungufu mkubwa wa chakula. Kwa Kiswahili, “njaa” kwa kawaida linaweza kutaja matukio hayo kwa maana ya jumla bila kulazimisha umbo lisilo la kawaida la wingi.
- source_word: σεισμοὶ
  choice: matetemeko ya ardhi
  rationale: Hii ndiyo maana ya neno katika muktadha huu na ndiyo istilahi wazi, ya kawaida, na sanifu ya Kiswahili.
- source_word: κατὰ τόπους
  choice: mahali mbalimbali
  rationale: Msemo una nguvu ya mgawanyo, yaani matukio yatatokea katika maeneo tofauti; “mahali mbalimbali” huwasilisha maana hiyo kwa kawaida.
theological_decisions:
- issue: Upeo wa ἔθνος katika kauli kuhusu migogoro ya wakati ujao
  choice: taifa
  alternative: jamii ya watu
  rationale: Ulinganifu na “ufalme dhidi ya ufalme” unaelekeza kwenye makundi makubwa ya kisiasa au kijamii. “Taifa” huepuka kuingiza maana finyu ya kabila pekee au maana maalumu ya watu wasio Wayahudi.
- issue: Nguvu ya umbo ἐγερθήσεται
  choice: litasimama dhidi ya
  alternative: litainuka dhidi ya; litainuliwa dhidi ya
  rationale: Kauli inaeleza kuzuka kwa uhasama. Tafsiri iliyochaguliwa haiufanyi usemi huu kuwa kauli ya kwamba taifa litainuliwa na Mungu, jambo ambalo halijaelezwa wazi na umbo hili katika msemo huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia “taifa dhidi ya taifa” na “ufalme dhidi ya ufalme” umehifadhiwa. Alama [b] imewekwa baada ya “mahali mbalimbali,” kwa kuwa tanbihi hiyo inahusu κατὰ τόπους.
