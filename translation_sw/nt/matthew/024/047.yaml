  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: sw
  text: Kweli nawaambia kwamba atamweka asimamie mali yote ya bwana wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vyote alivyo navyo bwana wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Hutanguliza tamko zito lenye mamlaka; “Kweli” ni Kiswahili cha kawaida na chenye heshima kuliko kunukuu “Amina” katika muktadha huu.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha moja kwa moja kitenzi cha kusema na kiwakilishi cha wingi, huku ukihifadhi uzito wa fomula ya Yesu.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha wazi kishazi kinachoeleza maudhui ya tamko.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: asimamie mali zake zote
  rationale: “Asimamie” huonyesha mamlaka na wajibu juu ya eneo alilokabidhiwa, na “mali zake zote” huwasilisha kwa ufupi vitu vyote alivyo navyo bwana.
- source_word: καταστήσει
  choice: atamweka
  rationale: Katika muundo “atamweka asimamie,” neno hili lina maana ya kumteua au kumpa nafasi ya usimamizi, si kumweka mahali kimwili tu.
- source_word: αὐτόν
  choice: -m- (katika “atamweka”)
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea mtumishi mwaminifu na mwenye busara wa muktadha uliotangulia.
theological_decisions:
- issue: Asili ya thawabu au dhamana anayopewa mtumishi na bwana
  choice: Tamko limetafsiriwa moja kwa moja kuwa kuwekwa kusimamia mali zote za bwana ndani ya mantiki ya mfano.
  alternative: Kulifasiri wazi kuwa mamlaka ya kanisa au thawabu ya mbinguni ya wakati wa mwisho.
  rationale: Mstari wenyewe unaeleza kupandishwa hadi usimamizi mpana zaidi; tafsiri haipaswi kuingiza hitimisho maalumu la kieklesia au kieskatolojia ambalo halijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “atamweka asimamie” ni wa asili na huhifadhi maana ya kuteuliwa kwa jukumu la usimamizi.
