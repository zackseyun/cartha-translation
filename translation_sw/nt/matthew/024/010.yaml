id: MAT.24.10
reference: Matthew 24:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: sw
  text: Ndipo wengi wataanguka[a], nao watasalitiana[b] na kuchukiana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakwazwa” au “watachukizwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “watakabidhiana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ndipo
  rationale: Huonyesha wakati na mfuatano wa matukio katika hotuba ya Yesu; “ndipo” ni ya kawaida na huunganisha mstari huu na yaliyotangulia.
- source_word: σκανδαλισθήσονται
  choice: wataanguka
  rationale: Katika muktadha wa mateso, kitenzi hiki kinaonyesha kukwazwa kunakoleta kuacha msimamo au imani. “Wataanguka” huhifadhi uzito huo bila kufafanua kupita kiasi aina ya kuanguka.
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni kivumishi cha idadi kilichotumiwa kama nomino; “wengi” ni tafsiri ya moja kwa moja na ya asili.
- source_word: ἀλλήλους
  choice: -ana- katika “watasalitiana” na “kuchukiana”
  rationale: Kiambishi cha kutendeana huonyesha wazi kwamba matendo hayo yanafanywa wao kwa wao.
- source_word: παραδώσουσιν
  choice: watasalitiana
  rationale: Ingawa maana ya msingi ni kukabidhi au kutia mikononi mwa mwingine, katika muktadha huu wa mateso na uhasama kitendo hicho ni usaliti. “Watasalitiana” ni Kiswahili cha asili kinachobeba nguvu hiyo.
- source_word: μισήσουσιν
  choice: kuchukiana
  rationale: Hutoa maana ya uhasama wa μισέω na, kwa umbo la kutendeana, huhifadhi ἀλλήλους.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Ndipo ... nao ... na ...
  rationale: Muundo huu huhifadhi mfuatano na mrundikano wa matendo huku ukisomeka kwa ufasaha katika Kiswahili.
theological_decisions:
- issue: Maana ya σκανδαλισθήσονται katika muktadha wa mateso ya nyakati za mwisho
  choice: wataanguka
  alternative: watakwazwa; watachukizwa
  rationale: “Wataanguka” huonyesha kuvunjika kwa msimamo au kuiacha njia chini ya shinikizo, sawasawa na mfululizo wa usaliti na chuki katika mstari huu. Hata hivyo, tanbihi huhifadhi uwezekano wa maana halisi zaidi ya kukwazwa au kuchukizwa.
- issue: Nguvu ya παραδώσουσιν
  choice: watasalitiana
  alternative: watakabidhiana
  rationale: Muktadha wa mateso unaifanya kukabidhiana huku kuwa usaliti, lakini tanbihi huhifadhi maana pana na halisi zaidi ya kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya asili; maumbo ya kutendeana yanahifadhi maana ya ἀλλήλους bila kurudia “wao kwa wao.”
