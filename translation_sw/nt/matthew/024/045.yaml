review_pass:
  verdict: revise
  source_fidelity: The central household-management imagery and lexical choices are well preserved. However, in the present Swahili syntax, “ili awape” can most naturally be read as having “bwana wake” as its subject, whereas the Greek purpose clause identifies the slave as the one who gives the food. The subject must be made explicit.
  naturalness: The wording is generally clear and appropriately formal. “Basi, ni nani aliye mtumwa...” is acceptable, though placing “basi” after the interrogative is more idiomatic in this rhetorical question. “Kusimamia” is a natural expression for appointment over household members.
  terminology: “Mtumwa,” “mwaminifu,” “mwenye busara,” and lowercase “bwana” appropriately convey the parable’s social setting. The alternative renderings in the footnotes are valid and do not impose a theological interpretation.
  issues:
  - severity: high
    issue: Ambiguous subject in the purpose clause “ili awape chakula chao.”
    rationale: The immediately preceding grammatical subject is “bwana wake,” so the clause may state that the master gives the food. Greek τοῦ δοῦναι αὐτοῖς assigns the food-giving task to the appointed slave. Explicitly naming “mtumwa huyo” resolves this without adding meaning.
  - severity: low
    issue: Placement of “Basi” is slightly less idiomatic at the beginning.
    rationale: “Ni nani basi...” more naturally reflects the inferential force of Τίς ἄρα in Standard East African Swahili.
