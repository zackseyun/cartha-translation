id: MAT.24.45
reference: Matthew 24:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: sw
  text: Ni nani basi aliye mtumwa[a] mwaminifu na mwenye busara, ambaye bwana[b] wake amemweka asimamie watu wa nyumbani mwake, ili mtumwa huyo awape chakula chao kwa wakati unaofaa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi.” Neno la Kigiriki linaweza kumaanisha mtumwa au mtumishi kulingana na muktadha; hapa “mtumwa” huhifadhi kwa uwazi zaidi wazo la mtu aliye chini ya mamlaka ya bwana.
    reason: lexical_alternative
  - marker: b
    text: Au, “Bwana.” Katika picha hii ya kaya, “bwana” limetumiwa kuonyesha uhusiano wa mtumwa na mwenye mamlaka juu yake.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Basi, ni nani
  rationale: Muundo huu unaendeleza hoja iliyotangulia na kuanzisha swali la balagha kwa Kiswahili cha kawaida.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Neno hili linaonyesha mtu anayetegemeka na anayetimiza wajibu aliopewa.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika picha ya mtu aliye chini ya mamlaka ya bwana, “mtumwa” huhifadhi uzito wa hali ya δοῦλος kuliko “mtumishi”; mbadala umetajwa katika tanbihi.
- source_word: φρόνιμος
  choice: mwenye busara
  rationale: Huwasilisha hekima ya vitendo na uangalifu katika kutekeleza wajibu kwa lugha ya asili ya Kiswahili.
- source_word: κατέστησεν
  choice: amemweka juu ya
  rationale: Hueleza kwamba bwana alimpa mtu huyo nafasi na mamlaka ya kusimamia wengine.
- source_word: κύριος
  choice: bwana
  rationale: Katika mazingira ya nyumba na mtumwa, “bwana” huonyesha mwenye mamlaka juu ya mtumwa bila kuondoa uwezekano wa maana ya “Bwana” katika matumizi mapana.
- source_word: οἰκετείας
  choice: watu wa nyumbani mwake
  rationale: Neno la Kigiriki linarejelea watu wa kaya au watumishi wa nyumbani, si jengo pekee; tafsiri hii pia inaweka wazi warejelewa wa kiwakilishi cha wingi “wao.”
- source_word: τοῦ δοῦναι
  choice: ili awape
  rationale: Muundo huu unaonyesha kusudi la kuwekwa kwake juu ya watu wa nyumbani.
- source_word: τροφὴν
  choice: chakula chao
  rationale: Hutoa maana ya chakula au mahitaji ya lishe yanayotolewa kwa watu wa nyumbani bila kuongeza wazo mahususi la mgao.
- source_word: ἐν καιρῷ
  choice: kwa wakati unaofaa
  rationale: Huhifadhi maana ya wakati ufaao au uliopangwa, badala ya wakati kwa maana ya saa tu.
theological_decisions:
- issue: Tafsiri ya κύριος katika mfano wa usimamizi wa nyumba
  choice: bwana
  alternative: Bwana
  rationale: Maana ya moja kwa moja katika picha hii ni mwenye mamlaka juu ya mtumwa na nyumba. Herufi ndogo huhifadhi uso wa mfano bila kulazimisha cheo cha kiungu, huku tanbihi ikihifadhi uwezekano wa “Bwana.”
- issue: Nguvu ya hali inayodokezwa na δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: “Mtumwa” huhifadhi kwa uwazi hali ya mtu aliye chini ya mamlaka ya bwana katika ulimwengu wa kijamii wa mfano. “Mtumishi” ni mbadala halali lakini laini zaidi, hivyo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi swali la balagha, picha ya nyumba, mamlaka iliyokabidhiwa, na kusudi la kutoa chakula kwa wakati ufaao. Tanbihi zote zimewekewa viashiria katika matini kuu.
