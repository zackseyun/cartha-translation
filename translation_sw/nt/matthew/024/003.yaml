id: MAT.24.3
reference: Matthew 24:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: sw
  text: Alipokuwa ameketi kwenye Mlima wa Mizeituni, wanafunzi walimjia faraghani, wakisema, “Tuambie, mambo haya yatatokea lini, na ishara ya kuja kwako[a] na ya mwisho wa enzi[b] itakuwa nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwapo kwako” au “kuwasili kwako.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukamilisho wa enzi”; tafsiri ya kimapokeo ni “mwisho wa dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου
  choice: Alipokuwa ameketi
  rationale: Kirai tegemezi cha wakati kinaonyesha tendo lililokuwa likiendelea; tafsiri hii ni ya kawaida na inadumisha hali hiyo.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: Mlima wa Mizeituni
  rationale: Hili ndilo jina la mahali linalotambulika katika Kiswahili na linaakisi maana halisi ya Kigiriki.
- source_word: προσῆλθον αὐτῷ
  choice: walimjia
  rationale: Kitenzi hiki kinaonyesha kusogea na kumfikia; “walimjia” ni simulizi la kawaida na fasaha.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Huonyesha kwamba walizungumza naye wakiwa kando na wengine; “faraghani” ni fupi na wazi.
- source_word: Εἰπὸν ἡμῖν
  choice: Tuambie
  rationale: Ni ombi la moja kwa moja na ndiyo namna ya kawaida ya kulieleza kwa Kiswahili.
- source_word: πότε ταῦτα ἔσται
  choice: mambo haya yatatokea lini
  rationale: Ingawa ἔσται kihalisi ni “yatakuwa,” katika swali kuhusu matukio yajayo “yatatokea” ni Kiswahili cha asili bila kufinya maana.
- source_word: σημεῖον
  choice: ishara
  rationale: Ni neno la kawaida kwa alama inayoonyesha au kuthibitisha jambo, nalo linafaa katika muktadha huu.
- source_word: παρουσίας
  choice: kuja
  rationale: Katika swali hili linalotazamia wakati ujao, “kuja” huwasilisha vizuri wazo la kufika au kuwapo baada ya kufika; uwezekano wa “kuwapo” umehifadhiwa katika tanbihi.
- source_word: συντελείας
  choice: mwisho
  rationale: Neno linaweza kumaanisha kufikia kikomo au ukamilisho; “mwisho” ni wazi na wa kawaida, huku “ukamilisho” ukihifadhiwa katika tanbihi.
- source_word: αἰῶνος
  choice: enzi
  rationale: αἰών hapa ni kipindi au enzi, si lazima ulimwengu wa kimaumbile; “enzi” huepuka kuongeza dai lisilosemwa moja kwa moja.
theological_decisions:
- issue: Maana ya παρουσία katika mazungumzo kuhusu mambo ya mwisho
  choice: kuja kwako
  alternative: kuwapo kwako; kuwasili kwako
  rationale: “Kuja” ni ya asili katika swali linalotazamia tukio la baadaye, lakini neno la Kigiriki pia linaweza kusisitiza kuwasili au kuwapo. Tanbihi inadumisha upana huo bila kuamua masuala ya mpangilio wa nyakati.
- issue: Maana ya συντελείας τοῦ αἰῶνος
  choice: mwisho wa enzi
  alternative: ukamilisho wa enzi; mwisho wa dunia
  rationale: Kigiriki kinataja kufikia kikomo kwa enzi, si moja kwa moja kuangamizwa kwa ulimwengu wa kimaumbile. Tafsiri kuu inadumisha tofauti hiyo, na tanbihi inahifadhi maana ya ukamilisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa swali umefanywa wa kawaida kwa Kiswahili, huku umoja wa “ishara” na uhusiano wake na “kuja” pamoja na “mwisho wa enzi” ukidumishwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
