- source_word: ἀρχὴ
  choice: mwanzo
  rationale: Huonyesha hatua ya kwanza ya mchakato, bila kudokeza kwamba matukio hayo ndiyo mwisho.
- source_word: ὠδίνων
  choice: uchungu wa kuzaa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wazi taswira ya maumivu ya uzazi.
theological_decisions:
- issue: Nguvu ya kisitiari ya ὠδίνων
  choice: Kuhifadhi sitiari ya uzazi kwa “uchungu wa kuzaa.”
  alternative: mateso; taabu; maumivu ya utungu
  rationale: Chanzo kinaonyesha matukio yaliyotangulia kuwa hatua ya mwanzo ya dhiki inayokuja. Sitiari imehifadhiwa bila kuingiza mpangilio maalumu wa kimafundisho ambao mstari wenyewe hautaji.
translation_notes:
