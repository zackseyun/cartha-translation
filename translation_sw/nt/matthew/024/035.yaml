  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: sw
  text: Mbingu na dunia zitapita, lakini maneno yangu hakika hayatapita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Mbingu
  rationale: Katika jozi ya kieskatolojia pamoja na γῆ, neno hili linarejelea mbingu kama sehemu ya uumbaji, si anga linaloonekana tu. “Mbingu na dunia” ni usemi wa kawaida wa Kiswahili wenye upeo wa ulimwengu mzima ulioumbwa.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Katika usemi “mbingu na dunia,” γῆ humaanisha dunia, wala si nchi au eneo fulani.
- source_word: παρελεύσεται
  choice: zitapita
  rationale: Kitenzi hiki hapa kinaeleza kutoweka au kufikia mwisho kwa utaratibu wa sasa wa uumbaji. “Zitapita” ni cha asili, kifupi, na hudumisha taswira ya Kigiriki bila kueleza kwa ziada namna jambo hilo litakavyotokea.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti iliyo wazi kati ya kupita kwa mbingu na dunia na kutopita kwa maneno ya Yesu.
- source_word: οἱ λόγοι μου
  choice: maneno yangu
  rationale: λόγοι hapa inahusu yale ambayo Yesu amesema, pamoja na mafundisho na matamko yake. “Maneno yangu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: οὐ μὴ παρέλθωσιν
  choice: hakika hayatapita
  rationale: Muundo οὐ μή pamoja na aoristi tegemezi ni ukanushaji wenye msisitizo mkubwa. “Hakika hayatapita” huwasilisha uhakika huo kwa Kiswahili cha sasa bila kutumia maneno mazito yasiyo ya lazima.
theological_decisions:
- issue: Nguvu ya dai la Yesu kuhusu kudumu kwa maneno yake
  choice: Kauli imetafsiriwa kama tofauti yenye msisitizo kati ya uumbaji unaopita na maneno ya Yesu ambayo hakika hayatapita.
  alternative: Kutafsiri kwa maelezo zaidi ili kutaja moja kwa moja matokeo ya kimafundisho kuhusu mamlaka ya kiungu.
  rationale: Aya yenyewe inatoa dai zito kuhusu uhakika na kudumu kwa maneno ya Yesu. Tafsiri inadumisha uzito huo bila kuongeza hitimisho la kimafundisho ambalo halijasemwa wazi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa sentensi ni rahisi kueleweka huku ukihifadhi ulinganifu wa kishairi na msisitizo wa matini ya Kigiriki.
