base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: sw
  text: Kwa hiyo, endeleeni kukesha[a], kwa sababu hamjui ni siku gani[b] Bwana wenu anakuja[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kesheni,” “mwe macho,” au “mwe waangalifu.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri nyingine ya karibu: “siku ipi.”'
    reason: lexical_alternative
  - marker: c
    text: Au “atakuja.” Kigiriki kinatumia umbo la wakati uliopo.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: endeleeni kukesha
  rationale: Kitenzi cha amri katika wakati uliopo kinawataka watu wengi waendelee kuwa macho na waangalifu. ‘Endeleeni kukesha’ huhifadhi sitiari ya kutolala na pia maana ya kuendelea kuwa tayari.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na mafundisho yaliyotangulia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huanzisha sababu ya amri hiyo kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kujua kilichokanushwa na kinachowaelekea watu wengi.
- source_word: ποίᾳ ἡμέρᾳ
  choice: ni siku gani
  rationale: Hutoa kwa Kiswahili cha asili kishazi cha wakati kinachosisitiza kwamba siku hususa haijulikani.
- source_word: ὁ κύριος ὑμῶν
  choice: Bwana wenu
  rationale: Huhifadhi cheo κύριος na umilikaji wa nafsi ya pili wingi kwa muundo wa kawaida wa Kiswahili.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Huhifadhi umbo la wakati uliopo la Kigiriki na uhai wake katika muktadha wa ujio wa wakati ujao bila kulazimisha ratiba hususa.
theological_decisions:
- issue: Nguvu ya kieskatolojia ya wakati uliopo katika ἔρχεται
  choice: anakuja
  alternative: atakuja
  rationale: ‘Anakuja’ huhifadhi wakati uliopo wa Kigiriki, pamoja na hisia ya matarajio na uharaka, bila kudai kwa uhakika zaidi ya yale maandishi yanayosema.
- issue: Maana ya γρηγορεῖτε kama sitiari ya utayari
  choice: endeleeni kukesha
  alternative: kesheni / muwe macho / muwe waangalifu
  rationale: Chaguo hili huhifadhi picha ya kukesha huku likionyesha amri endelevu; halipunguzi kauli hiyo kuwa fundisho maalumu la namna moja tu ya kuwa tayari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; ‘Bwana’ limeandikwa kwa herufi kubwa kwa kuwa hapa linamtaja Yesu kama cheo, bila kuongeza ufafanuzi wa kimadhehebu.
