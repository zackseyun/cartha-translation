base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: sw
  text: Kwa kweli ninawaambia, kizazi hiki hakitapita kamwe mpaka mambo haya yote yatokee[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu hawa” au “uzao huu.” Neno la Kigiriki linaweza kueleweka kwa maana pana zaidi, lakini “kizazi” ndiyo tafsiri ya moja kwa moja zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Kwa kweli
  rationale: Katika kauli ya kusisitiza ἀμὴν λέγω ὑμῖν, “Kwa kweli ninawaambia” ni Kiswahili cha sasa, cha asili na chenye uzito; kinahifadhi uthibitisho makini wa Yesu bila kutumia unukuzi “Amina” katika usemi wa kawaida.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya usemi kwa watu wengi, huku ikihifadhi nafsi ya kwanza na waelekezwa wa kauli.
- source_word: ὅτι
  choice: —
  rationale: Kiunganishi hiki hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili baada ya “ninawaambia”; kuacha “kwamba” kunafanya sentensi isikike kwa ufasaha bila kupoteza uhusiano wa kishazi.
- source_word: οὐ μὴ παρέλθῃ
  choice: hakitapita kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi tegemezi unaonyesha ukanushaji wenye mkazo. “Hakitapita kamwe” huhifadhi mkazo huo kwa Kiswahili wazi na cha sasa.
- source_word: ἡ γενεὰ αὕτη
  choice: kizazi hiki
  rationale: “Kizazi” ndiyo maana ya kawaida na ya moja kwa moja ya γενεά katika muktadha huu, na haiondoi mvutano wa kitafsiri uliopo katika hotuba hii.
- source_word: ἕως ἂν
  choice: mpaka
  rationale: “Mpaka” huonyesha kikomo kinachohusishwa na kutokea kwa jambo la wakati ujao, sawa na matumizi ya ἕως ἄν hapa.
- source_word: πάντα ταῦτα
  choice: mambo haya yote
  rationale: Tafsiri hii inawakilisha wazi wingi wa Kigiriki na kurejelea matukio yaliyotajwa katika hotuba.
- source_word: γένηται
  choice: yatokee
  rationale: Katika muktadha huu γίνομαι hueleza matukio kutokea. “Yatokee” ni ya kawaida na inalingana kisarufi na “mambo haya yote.”
theological_decisions:
- issue: Maana ya “kizazi hiki” (ἡ γενεὰ αὕτη) katika hotuba kuhusu mambo ya mwisho
  choice: Kutafsiri moja kwa moja kuwa “kizazi hiki” bila ufafanuzi wa kiitikadi ndani ya andiko.
  alternative: “watu hawa” au “jamii hii”
  rationale: “Kizazi hiki” ndiyo tafsiri ya kawaida zaidi ya Kigiriki na huhifadhi mvutano wa ufasiri badala ya kuamua kimya-kimya mfumo fulani wa mafundisho kuhusu mambo ya mwisho. Maana pana zaidi zinaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Usemi “Kwa kweli ninawaambia” ni wa asili katika hotuba, na “hakitapita kamwe” huhifadhi ukanushaji wenye mkazo wa Kigiriki.
