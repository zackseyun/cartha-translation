base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: sw
  text: Ndipo wanaume wawili watakapokuwa shambani; mmoja atachukuliwa[a], na mwingine ataachwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atapelekwa pamoja.” Kitenzi chenyewe hakibainishi ikiwa kuchukuliwa huko ni kwa ajili ya kuokolewa au kuhukumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kielezi hiki cha wakati kinaunganisha kauli na mazingira ya mwisho wa nyakati yaliyotangulia. “Ndipo” ni cha kawaida na hudumisha uhusiano wa wakati.
- source_word: δύο ἔσονται
  choice: wanaume wawili watakapokuwa
  rationale: Ingawa δύο yenyewe humaanisha “wawili,” matumizi ya εἷς ... εἷς katika jinsia ya kiume, pamoja na mfano wa wanawake katika mstari unaofuata, yanaonyesha kuwa hapa wanaume ndio wanaorejelewa.
- source_word: ἐν τῷ ἀγρῷ
  choice: shambani
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya mahali, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: εἷς ... εἷς
  choice: mmoja ... mwingine
  rationale: Kiswahili cha kawaida hutumia “mmoja ... mwingine” kuonyesha tofauti kati ya watu wawili kwa ufasaha, huku kikidumisha ulinganifu wa Kigiriki.
- source_word: παραλαμβάνεται
  choice: atachukuliwa
  rationale: Kauli tendwa ya wakati uliopo iko katika tukio linalotazamiwa wakati ujao. “Atachukuliwa” ni ya asili katika Kiswahili na haiamui ikiwa kuchukuliwa huko ni kwa ajili ya kuokolewa au kuhukumiwa.
- source_word: ἀφίεται
  choice: ataachwa
  rationale: Katika muktadha huu, “ataachwa” hutoa maana ya moja kwa moja bila kuongeza dhana ya kuachwa nyuma au kutelekezwa kabisa.
theological_decisions:
- issue: Ikiwa παραλαμβάνεται inadokeza kuokolewa au kuhukumiwa
  choice: Kudumisha tafsiri isiyoamua, “atachukuliwa”
  alternative: “Atachukuliwa” kwa hukumu, au “atachukuliwa” kwenda mahali pa usalama
  rationale: Muktadha, hasa ulinganisho na siku za Nuhu, umeruhusu mitazamo tofauti. Tafsiri haipaswi kutatua mvutano huo kwa kuingiza mfumo fulani wa mafundisho ya nyakati za mwisho.
- issue: Ikiwa warejelewa wa kiume watajwe wazi
  choice: wanaume wawili
  alternative: watu wawili; wawili
  rationale: εἷς ... εἷς ni maumbo ya kiume, na mfano sambamba wa wanawake katika mstari unaofuata unaunga mkono tukio linalowahusu wanaume hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Ndipo ... watakapokuwa” ni wa asili; wakati ujao katika vitenzi vya mwisho huweka tukio zima katika mazingira ya wakati ujao bila kubadili utata wa kitheolojia.
