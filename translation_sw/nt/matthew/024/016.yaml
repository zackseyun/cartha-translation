lexical_decisions:
- source_word: τότε
  choice: basi
  rationale: Katika mfululizo wa maelekezo ya Yesu, “basi” huonyesha hatua inayofuata kwa njia ya asili katika Kiswahili; pia ina nguvu ya “wakati huo.”
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: wale walio Yudea
  rationale: Kirai chenye kibainishi kinarejelea watu walioko katika eneo hilo bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: Ἰουδαίᾳ
  choice: Yudea
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la eneo la kihistoria la Judea.
- source_word: φευγέτωσαν
  choice: wakimbilie
  rationale: Hii ni amri ya nafsi ya tatu, wingi. “Wakimbilie” ni ya sasa, ya kawaida, na hudumisha dharura ya kuondoka kwa kukimbia kuelekea mahali pa usalama.
- source_word: ἐπὶ τὰ ὄρη
  choice: milimani
  rationale: Kwa kitenzi cha mwendo, kirai hiki kinaonyesha mahali wanakopaswa kuelekea. “Milimani” ni tafsiri ya asili na sahihi ya Kiswahili bila kudhoofisha ὄρη kuwa vilima.
theological_decisions:
- issue: Nguvu ya amri katika onyo kuhusu wakati ujao
  choice: Imetafsiriwa kwa amri ya moja kwa moja, “wakimbilie.”
  alternative: “ni lazima wakimbilie”
  rationale: Umbo la amri katika Kigiriki linapaswa kubaki agizo lenye dharura. Amri ya moja kwa moja ni ya asili katika Kiswahili na haiingizi msimamo maalumu kuhusu mpangilio wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye heshima, na inaakisi dharura ya onyo. Alama ya tanbihi [a] imewekwa katika matini kuu.
