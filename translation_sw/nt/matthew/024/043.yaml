  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: sw
  text: 'Lakini fahamuni jambo hili: Kama mwenye nyumba angejua ni zamu ipi ya usiku ambayo mwizi angekuja[a], angekesha wala hangeruhusu nyumba yake ivunjwe na kuingiwa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, katika kipindi kipi cha zamu ambacho usiku uligawanywa kwa ajili ya ulinzi.
    reason: cultural_note
  - marker: b
    text: Kihalisi, “ichimbwe kupitia,” ikirejelea kuvunja au kuchimba kupitia ukuta wa nyumba za kale ili kuingia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Lakini fahamuni jambo hili
  rationale: Kauli hii inaendeleza mabadiliko ya hoja yanayoonyeshwa na δέ na kudumisha agizo la moja kwa moja la γινώσκετε kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οἰκοδεσπότης
  choice: mwenye nyumba
  rationale: Hili ni neno la kawaida la Kiswahili kwa mtu mwenye mamlaka juu ya nyumba; halilazimishi dhana ya kisasa ya umiliki wa kisheria.
- source_word: ποίᾳ φυλακῇ
  choice: katika zamu ipi ya usiku
  rationale: φυλακή hapa ni kipindi maalumu ambacho usiku uligawanywa kwa ajili ya ulinzi. Kutaja 'ya usiku' huifanya taswira ya kitamaduni ieleweke bila kuiondoa.
- source_word: ὁ κλέπτης ἔρχεται
  choice: mwizi angekuja
  rationale: Katika sharti lisilotimia, umbo hili ni la asili kwa Kiswahili na linaonyesha kuja kwa mwizi kulikodhaniwa, bila kubadili jambo hilo kuwa tendo lililokamilika.
- source_word: ἐγρηγόρησεν ἂν
  choice: angekesha
  rationale: ‘Kukesha’ huwasilisha maana ya kubaki macho na kuwa tayari wakati wa usiku, inayofaa kabisa katika mfano wa mwizi.
- source_word: οὐκ ἂν εἴασεν
  choice: hangeruhusu
  rationale: Neno hili linawasilisha wazi maana ya kutokubali jambo litokee katika sharti lisilotimia.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: nyumba yake ivunjwe na kuingiwa
  rationale: Hii ni namna ya kawaida ya kueleza uvamizi wa mwizi kwa Kiswahili. Maana halisi ya kuchimba na kupenya imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya οἰκοδεσπότης
  choice: mwenye nyumba
  alternative: mkuu wa nyumba
  rationale: Mfano huu haumlazimishi msomaji kutambua cheo maalumu cha kiteolojia. ‘Mwenye nyumba’ ni wazi na huhifadhi jukumu la mtu mwenye mamlaka juu ya nyumba.
- issue: Taswira ya kale ya mwizi kupenya nyumba
  choice: nyumba yake ivunjwe na kuingiwa
  alternative: nyumba yake ichimbwe na kupenywa
  rationale: Matini kuu inatoa maana ya kitendo kwa lugha ya asili ya Kiswahili, huku tanbihi ikihifadhi picha halisi ya διορύσσω na mazingira ya nyumba za kale.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti umetumiwa kwa njia ya asili, na taswira ya zamu za usiku imehifadhiwa na kufafanuliwa kwa ufupi.
