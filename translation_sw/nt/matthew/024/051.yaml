  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: sw
  text: naye atamkata vipande viwili[a] na kumgawia fungu lake pamoja na wanafiki[b]. Huko kutakuwa na kilio na kusaga meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kiidioma zaidi, “atamwadhibu vikali.” Kitenzi cha Kigiriki kihalisi humaanisha “atamkata vipande viwili.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ataweka fungu lake pamoja na wanafiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: atamkata vipande viwili
  rationale: Kitenzi hiki kimsingi humaanisha kukata mara mbili au kukata vipande viwili. Tafsiri hii inadumisha taswira kali ya Kigiriki bila kuibadili kimya kimya kuwa adhabu kali kwa ujumla.
- source_word: μέρος
  choice: fungu
  rationale: Neno hili humaanisha sehemu, fungu, au sehemu anayopewa mtu. Katika muktadha huu, 'fungu lake' linadumisha wazo la hatima aliyotengewa bila kulifanya kuwa mahali tu.
- source_word: ὑποκριτῶν
  choice: wanafiki
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa wale wanaojionyesha kuwa tofauti na walivyo; pia linadumisha matumizi ya mada hii katika Mathayo.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Kielezi hiki kinaelekeza kwenye hali au mahali pa hukumu iliyotajwa katika sentensi iliyotangulia. 'Huko' ni kifupi, cha kawaida, na cha asili katika Kiswahili.
- source_word: κλαυθμὸς
  choice: kilio
  rationale: Neno hili linaonyesha kulia kwa huzuni na linafaa katika kauli hii inayorudiwa katika Mathayo.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayowasilisha tendo la meno kusuguana kwa nguvu na kudumisha taswira ya Kigiriki.
theological_decisions:
- issue: Iwapo διχοτομήσει ilainishwe kuwa kauli ya jumla kuhusu adhabu
  choice: Kudumisha maana halisi ya 'atamkata vipande viwili' katika matini kuu
  alternative: atamwadhibu vikali
  rationale: Maana halisi ya kitenzi ni kali lakini wazi. Kuidumisha huepuka kuamua kwamba taswira hiyo ni ya kimajazi pekee, huku tanbihi ikitoa uwezekano wa usemi wa kiidioma.
- issue: Jinsi ya kueleza τὸ μέρος αὐτοῦ ... θήσει
  choice: kumwekea fungu lake pamoja na wanafiki
  alternative: kumweka pamoja na wanafiki
  rationale: Neno 'fungu' linadumisha wazo la sehemu au hatima aliyogawiwa, bila kuamua kupita kiasi kama ni eneo, urithi, au aina maalumu ya adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wenye uzito wa onyo; 'vipande viwili,' 'fungu,' 'wanafiki,' na 'kusaga meno' vinaeleweka kwa wasomaji wa kawaida bila kufifisha taswira ya chanzo.
