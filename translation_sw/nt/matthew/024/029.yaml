id: MAT.24.29
reference: Matthew 24:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: sw
  text: Lakini mara tu baada ya dhiki ya siku hizo, jua litatiwa giza, mwezi hautatoa nuru yake, nyota zitaanguka kutoka mbinguni[a], na nguvu za mbingu[b] zitatikiswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka angani.”
    reason: lexical_alternative
  - marker: b
    text: “Nguvu za mbingu” zinaweza kumaanisha nguvu za ulimwengu, miili ya angani, au mamlaka za mbinguni; usemi wa Kigiriki una maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Lakini mara tu
  rationale: “Mara tu” hudumisha maana yenye nguvu ya wakati ya Εὐθέως, huku “Lakini” ikionyesha mpito wenye tofauti ndogo unaoletwa na δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: baada ya dhiki ya siku hizo
  rationale: “Dhiki” ni neno la kawaida na lenye uzito linaloweza kuwakilisha θλῖψις kama taabu, mateso, au shida kali; “ya siku hizo” hudumisha uhusiano wa kisarufi wa Kigiriki.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: jua litatiwa giza
  rationale: Huwakilisha hali ya kutendwa ya kitenzi cha wakati ujao na kudumisha mtindo mzito wa kinabii.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: mwezi hautatoa nuru yake
  rationale: Tafsiri ya karibu na asili inayohifadhi picha ya mwezi kutotoa nuru yake, huku ikibaki ya kawaida katika Kiswahili.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: nyota zitaanguka kutoka mbinguni
  rationale: “Zitaanguka” hutoa wakati ujao kwa uwazi; “mbinguni” hudumisha sajili ya kibiblia, huku tanbihi ikitaja uwezekano wa maana ya anga.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: nguvu za mbingu
  rationale: Usemi huu wa karibu na Kigiriki unahifadhi upana wa maana ya δυνάμεις na hauamui kama ni nguvu za ulimwengu, miili ya angani, au mamlaka za mbinguni.
- source_word: σαλευθήσονται
  choice: zitatikiswa
  rationale: Huwakilisha kitenzi cha wakati ujao katika hali ya kutendwa na kuacha wazi kama kutikiswa huko kunaeleweka kihalisi au kiishara.
theological_decisions:
- issue: Asili ya ishara za ulimwengu katika lugha ya kiapokaliptiki
  choice: Taswira imetafsiriwa moja kwa moja bila kuamua ikiwa ni matukio halisi ya angani, lugha ya kinabii yenye ishara, au yote mawili.
  alternative: Kuzitafsiri ishara hizo ama kama kuvurugika halisi kwa ulimwengu pekee, ama kama ishara za misukosuko ya kisiasa na hukumu pekee.
  rationale: Andiko linatumia taswira ya kinabii na kiapokaliptiki; tafsiri inapaswa kuhifadhi mvutano na upana huo badala ya kuingiza mfumo fulani wa eskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na sauti ya kinabii. Muundo ni wa karibu na chanzo lakini unasomeka kwa urahisi. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
