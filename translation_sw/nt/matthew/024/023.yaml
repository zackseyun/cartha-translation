base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: sw
  text: Wakati huo, mtu yeyote akiwaambia, “Tazama, Masihi[a] yuko hapa!” au, “Yuko hapa!”[b] msiamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo.”'
    reason: alternative_reading
  - marker: b
    text: 'Kihalisi: “au, ‘Hapa!’” Kigiriki kinaacha maneno yanayoeleweka kutokana na muktadha.'
    reason: source_ellipsis
lexical_decisions:
- source_word: τότε
  choice: Wakati huo
  rationale: Inaonyesha wakati na kuunganisha onyo hili na maelezo yaliyotangulia, kwa Kiswahili cha kawaida.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: mtu yeyote akiwaambia
  rationale: Muundo huu unadumisha sharti lenye mhusika asiyeainishwa na unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta uangalifu linalofaa katika lugha yenye hadhi bila kuwa la kizamani kupita kiasi.
- source_word: ὧδε
  choice: hapa
  rationale: Neno hili ni kielezi cha mahali kinachomaanisha ‘hapa’; limetafsiriwa vivyo hivyo katika sehemu zote mbili.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Katika muktadha huu Χριστός ni cheo cha mkombozi aliyetiwa mafuta, si jina tu; ‘Masihi’ hudumisha maana hiyo.
- source_word: ἤ· Ὧδε
  choice: au, “Yuko hapa!”
  rationale: Kiswahili kinahitaji kwa kawaida kukamilisha usemi mfupi wa Kigiriki kwa kitenzi na kiwakilishi kinachoeleweka kutokana na muktadha. Tanbihi inahifadhi muundo halisi uliofupishwa.
- source_word: μὴ πιστεύσητε
  choice: msiamini
  rationale: Katazo la Kigiriki halitaji yambwa. Kiswahili pia kinaweza kuacha yambwa bila kulazimisha kama kinachokataliwa ni mtu au dai lake.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi na muktadha wa madai kuhusu utambulisho na mahali alipo mkombozi vinaonyesha matumizi ya cheo. ‘Kristo’ limehifadhiwa katika tanbihi kama tafsiri ya jadi.
- issue: Yambwa la μὴ πιστεύσητε
  choice: msiamini
  alternative: msiyaamini maneno hayo / msimwamini
  rationale: Kutotaja yambwa kunahifadhi kutokuwa bayana kwa Kigiriki kuhusu kama katazo linalenga dai, msemaji, au mtu anayedaiwa kuwa Masihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Marudio ya ‘hapa’ yamehifadhiwa kwa sababu neno lilelile la Kigiriki limetumiwa mara mbili, badala ya kuingiza tofauti ya ‘hapa/pale’ ambayo haimo wazi katika chanzo.
