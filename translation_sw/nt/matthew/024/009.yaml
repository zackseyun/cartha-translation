  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: sw
  text: Ndipo watawakabidhi katika dhiki[a] na kuwaua; nanyi mtachukiwa na mataifa yote[b] kwa sababu ya jina langu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mateso,” “taabu,” au “shida kubwa.” Neno la Kigiriki linaweza kumaanisha hali ya kusongwa, kuteswa au kupata dhiki.
    reason: lexical_alternative
  - marker: b
    text: Au “na watu wote wa mataifa”; katika muktadha huu, tafsiri ya “na watu wote wasio Wayahudi” inawezekana lakini si yenye uwezekano mkubwa.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa sababu ya jina langu”; yaani, kwa sababu ya uaminifu wao kwa Yesu na kwa yale ambayo jina lake linawakilisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Huonyesha hatua inayofuata katika mfululizo wa hotuba ya Yesu na ni ya asili katika Kiswahili sanifu.
- source_word: παραδώσουσιν ὑμᾶς
  choice: watakapowakabidhi
  rationale: Kitenzi παραδίδωμι hapa ni kuwatia watu mikononi au chini ya mamlaka ya wengine; “kuwakabidhi” huhifadhi maana hiyo bila kuongeza wazo mahususi la kusaliti.
- source_word: εἰς θλῖψιν
  choice: ili mpate dhiki
  rationale: “Dhiki” huweza kumaanisha mateso, shida kubwa au taabu, na pia huhifadhi uzito wa muktadha wa mambo ya mwisho. Muundo wenye “ili mpate” unaeleza kwa Kiswahili cha kawaida matokeo ya kukabidhiwa huku bila kulazimisha kusudi la ndani la wahusika.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: na kuwaua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi chenye maana ya kuua, bila kuongeza dhana ya hukumu rasmi au mauaji haramu.
- source_word: ἔσεσθε μισούμενοι
  choice: mtachukiwa
  rationale: Hutoa kwa ufupi na kwa kawaida hali ya wakati ujao katika kauli tendwa.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: na mataifa yote
  rationale: Katika kauli tendwa, “na” huonyesha watendaji; “mataifa yote” huhifadhi upeo wa ulimwengu mzima bila kuifanya ἔθνη imaanishe hasa watu wasio Wayahudi.
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa sababu ya jina langu
  rationale: Huhifadhi kwa uwazi sababu inayoonyeshwa na διά pamoja na dhana ya kibiblia ya jina linalowakilisha nafsi na mamlaka ya Yesu.
theological_decisions:
- issue: Maana ya θλῖψις katika hotuba kuhusu mambo yajayo
  choice: dhiki
  alternative: mateso; taabu; shida kubwa
  rationale: “Dhiki” inaweza kueleza mateso ya kawaida na pia kubeba uzito wa mambo ya mwisho, hivyo haiamui kimyakimya kama neno hili ni istilahi ya mfumo fulani wa nyakati za mwisho.
- issue: Maana ya ἔθνη
  choice: mataifa yote
  alternative: watu wote wasio Wayahudi
  rationale: Muktadha unaelekea kuonyesha upinzani wenye upeo wa ulimwengu mzima. Tafsiri hii haileti utofautishaji finyu wa Wayahudi na watu wa mataifa ambao kifungu hiki hakiulazimishi.
- issue: Maana ya “kwa sababu ya jina langu”
  choice: kudumisha usemi wa “jina” katika aya
  alternative: kwa sababu ya kuwa wafuasi wangu
  rationale: Usemi halisi huhifadhi dhana pana ya jina la Yesu—nafsi yake, mamlaka yake na uaminifu kwake—bila kuibana kuwa maelezo moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ndipo” hudumisha mwendo wa kinabii wa hotuba; “dhiki” huhifadhi uzito na upana wa neno la asili. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
