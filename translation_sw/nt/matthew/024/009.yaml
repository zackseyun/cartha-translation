  verdict: revise
  source_fidelity: The draft accurately represents the sequence, killing, future passive hatred, universal scope of ἔθνη, and causal phrase about Jesus' name. However, “ili mpate dhiki” casts εἰς θλῖψιν as the persecutors’ purpose and is less direct than the Greek directional/result expression.
  naturalness: The verse is generally clear and appropriately formal. Replacing “ili mpate dhiki” with “katika dhiki” removes an awkward purposive construction while retaining concise, standard East African Swahili.
  terminology: “Dhiki,” “mataifa yote,” and “kwa sababu ya jina langu” are sound choices. “Dhiki” preserves the breadth of θλῖψις without imposing a technical eschatological sense.
  issues:
  - severity: medium
    issue: “ili mpate dhiki” introduces a purposive clause for εἰς θλῖψιν.
    rationale: The Greek says that the disciples will be handed over into affliction, not explicitly that the agents act with the stated purpose. “Katika dhiki” more closely retains the directional/result relationship and avoids implying motive.
