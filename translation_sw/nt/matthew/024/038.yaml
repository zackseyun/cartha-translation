  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: sw
  text: Kwa maana, kama vile katika siku za kabla ya gharika walivyokuwa wakila na kunywa, wakioa na kuwaoza[a], mpaka siku ile Nuhu alipoingia ndani ya safina,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakioa na kuolewa.” Kigiriki hutofautisha γαμοῦντες na γαμίζοντες; neno la pili linaweza kumaanisha kumtoa mtu katika ndoa au, katika matumizi mengine, kutolewa katika ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Kwa maana kama vile
  rationale: Huhifadhi nguvu ya γάρ ya kutoa maelezo na maana ya ὡς ya kulinganisha, kwa Kiswahili cha kawaida.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: watu walivyokuwa wakila na kunywa
  rationale: Muundo wa kitenzi pamoja na vivumishi-tendo unaonyesha shughuli zilizokuwa zikiendelea. Kiswahili kinahitaji kutaja wahusika kwa uwazi; “watu” haibadili maana katika muktadha.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: katika siku zilizotangulia gharika
  rationale: Ni usemi wa wakati ulio wazi; “gharika” ni neno la kawaida la kibiblia linalotambulisha mafuriko ya wakati wa Nuhu.
- source_word: τρώγοντες καὶ πίνοντες
  choice: wakila na kunywa
  rationale: Huwasilisha shughuli za kawaida zinazoendelea bila kuingiza wazo lisilotajwa la ulafi au ulevi.
- source_word: γαμοῦντες καὶ γαμίζοντες
  choice: wakioa na kuwaoza
  rationale: “Wakioa” na “kuwaoza” hudumisha tofauti ya kileksika kati ya kuingia katika ndoa na kuwapa wengine katika ndoa, ingawa γαμίζοντες inaweza pia kueleweka kwa namna nyingine.
- source_word: ἄχρι ἧς ἡμέρας
  choice: mpaka siku ile
  rationale: Huonyesha kikomo cha shughuli zilizokuwa zikiendelea na ni usemi wa asili katika Kiswahili.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nuhu alipoingia ndani ya safina
  rationale: Huwasilisha tukio maalumu lililofikia mwisho wa kipindi hicho; “safina” huhifadhi uhusiano unaotambulika na simulizi la Nuhu.
theological_decisions:
- issue: Iwapo shughuli zilizoorodheshwa zionyeshwe kama anasa za dhambi au maisha ya kawaida yaliyokuwa yakiendelea kabla ya hukumu
  choice: Shughuli zimetafsiriwa kwa lugha isiyoziwekea hukumu ya kimaadili
  alternative: Kutumia maneno yanayodokeza ulafi, ulevi, au uzembe wa kimaadili
  rationale: Vishirikishi vya Kigiriki vinataja kula, kunywa, kuoa, na kuoza bila vivumishi vya kulaani. Muktadha unasisitiza hali ya kawaida kabla ya hukumu ya ghafla, hivyo tafsiri haiongezi lawama ambayo haijaelezwa.
- issue: Maana ya γαμίζοντες
  choice: kuwaoza
  alternative: kuolewa / kuozwa
  rationale: Kitenzi kinaweza kumaanisha kuwapa wengine katika ndoa, na kwa baadhi ya matumizi kinaweza kueleweka kama kutolewa katika ndoa. Maandishi makuu yanahifadhi tofauti na γαμοῦντες, huku tanbihi ikitaja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Gharika” na “safina” huhifadhi msamiati unaotambulika wa simulizi la Nuhu, huku sentensi ikibaki rahisi kueleweka.
