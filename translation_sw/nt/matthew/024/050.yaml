  text: bwana[a] wa mtumwa[b] huyo atakuja siku asiyoitarajia na saa asiyoijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye nyumba.” Neno la Kigiriki κύριος linaweza kumaanisha “Bwana” au bwana mwenye mamlaka; hapa linamtaja bwana wa kibinadamu katika mfano.
    reason: lexical_alternative
  - marker: b
    text: Au “mtumishi.” Neno la Kigiriki δοῦλος humaanisha mtu aliye katika hali ya utumwa au utumishi wa kufungwa; “mtumwa” limetumiwa hapa kwa sababu hali hiyo imejitokeza wazi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: atakuja
  rationale: Wakati ujao wa ἥκω unaonyesha kuja au kuwasili; “atakuja” ni ya kawaida na inafaa kwa kurudi kwa bwana kusikotarajiwa.
- source_word: ὁ κύριος
  choice: bwana
  rationale: Katika muktadha wa mfano, κύριος ni mkuu wa kibinadamu mwenye mamlaka juu ya mtumwa. “Bwana” huhifadhi uhusiano huo bila kulazimisha hapa kuwa jina rasmi la Mungu.
- source_word: τοῦ δούλου
  choice: wa mtumwa
  rationale: δοῦλος humaanisha mtu aliye katika hali ya utumwa au utumishi wa kufungwa. Katika mazingira haya ya bwana na mtumwa, “mtumwa” huhifadhi wazi hali hiyo.
- source_word: ἐκείνου
  choice: huyo
  rationale: Kiwakilishi hiki kinaelekeza kwa mtumwa maalumu aliyetajwa katika muktadha; “huyo” ni cha kawaida na sahihi.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: siku asiyoitarajia
  rationale: Kauli hii huhifadhi kutokujua wakati wa kuja kwake na kutobainishwa kwa siku hiyo. Muundo wa Kiswahili unaonyesha kwamba mtumwa ndiye asiyetarajia siku hiyo.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: saa asiyoijua
  rationale: “Saa” huhifadhi ulinganifu wa siku na saa katika Kigiriki, na “asiyoijua” hutoa maana ya moja kwa moja ya kutokujua.
theological_decisions:
- issue: Maana ya κύριος katika mazingira ya nyumba ya mfano
  choice: bwana
  alternative: Bwana; mwenye nyumba
  rationale: Neno linamtaja mkuu wa kibinadamu katika simulizi, ingawa mfano una uzito wa kieskatolojia. Herufi ndogo na tanbihi huzuia kulifanya moja kwa moja kuwa jina rasmi la Mungu bila kufuta maana pana inayoweza kusikika katika mfano.
- issue: Maana ya δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: Uhusiano wa mamlaka kati ya κύριος na δοῦλος umejitokeza wazi, kwa hiyo “mtumwa” huhifadhi hali ya kufungwa iliyo katika taswira ya kijamii kuliko neno laini zaidi “mtumishi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “siku” na “saa” na nguvu ya tahadhari kuhusu kuja kusikotarajiwa.
