base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: sw
  text: Naye akajibu, akawaambia, “Je, hamyaoni haya yote? Kweli ninawaambia, halitaachwa hapa jiwe juu ya jiwe ambalo halitaangushwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “litaharibiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kubomoa jengo au muundo; “halitaangushwa” huhifadhi picha ya jiwe kuondolewa kutoka mahali pake katika ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu, akawaambia
  rationale: Muundo huu unawakilisha vitenzi vyote viwili vya Kigiriki kwa Kiswahili cha kawaida, bila kuwa mgumu kupita kiasi.
- source_word: Οὐ βλέπετε
  choice: Je, hamyaoni
  rationale: Swali hili la balagha linatarajia kukubaliwa na linaonyesha kuona kwa macho katika muktadha huu.
- source_word: ταῦτα πάντα
  choice: haya yote
  rationale: Kiwakilishi hiki kinarejelea majengo ya hekalu yaliyotajwa katika muktadha uliotangulia.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Kweli ninawaambia
  rationale: Huu ni usemi wa asili na wenye hadhi unaowasilisha msisitizo wa dhati wa ἀμήν.
- source_word: οὐ μὴ ἀφεθῇ
  choice: halitaachwa
  rationale: Hali ya kukana yenye nguvu katika Kigiriki imewasilishwa kama utabiri wa uhakika; umoja wa kitenzi unapatana na ‘jiwe.’
- source_word: ὧδε
  choice: hapa
  rationale: Neno hili linaonyesha mahali walipokuwa, yaani eneo la hekalu.
- source_word: λίθος ἐπὶ λίθον
  choice: jiwe juu ya jiwe
  rationale: Usemi huu wa picha umehifadhiwa moja kwa moja na kwa namna inayoeleweka katika Kiswahili.
- source_word: καταλυθήσεται
  choice: halitaangushwa
  rationale: Chaguo hili linahifadhi picha halisi ya mawe kuondolewa mahali pake wakati jengo linapoharibiwa; ‘halitabomolewa’ ni tafsiri nyingine inayowezekana.
theological_decisions:
- issue: Upeo na nguvu ya utabiri wa Yesu kuhusu hekalu
  choice: Maneno yametafsiriwa kama utabiri halisi wa kuangushwa kabisa kwa jengo.
  alternative: Kuyafanya hasa kuwa kauli ya kiishara kuhusu hukumu au kuyaunganisha wazi na mfumo fulani wa matukio ya mwisho.
  rationale: Picha ya jiwe kutobaki juu ya jiwe ni halisi na inahusu jengo. Tafsiri haiingizi maelezo ya kiteolojia yasiyosemwa katika aya yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi ukali wa utabiri na picha ya jiwe juu ya jiwe bila kuongeza mfumo maalumu wa kieskatolojia.
