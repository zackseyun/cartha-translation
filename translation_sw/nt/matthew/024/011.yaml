  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: sw
  text: Na manabii wengi wa uongo watatokea[b] na watawapotosha watu wengi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwadanganya watu wengi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watainuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni kivumishi cha kawaida cha idadi, na “wengi” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: ψευδοπροφῆται
  choice: manabii wa uongo
  rationale: Hueleza manabii ambao ni wa uongo au wadanganyifu; usemi huu ni wa kawaida, unaeleweka, na unadumisha mwangwi wa lugha ya Biblia.
- source_word: ἐγερθήσονται
  choice: watatokea
  rationale: Katika muktadha huu kitenzi kinaeleza kujitokeza kwa watu hao. “Watatokea” ni cha asili na hakidokezi ufufuo, huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi ya hali tendwa.
- source_word: πλανήσουσιν
  choice: kuwapotosha
  rationale: “Kupotosha” huhifadhi wazo pana la kuwaongoza watu waache njia iliyo sawa, bila kulifunga kwa udanganyifu wa kimafundisho, kimaadili, au wa aina nyingine pekee.
- source_word: πολλούς
  choice: watu wengi
  rationale: Nomino inayodokezwa imewekwa wazi kwa “watu” ili sentensi iwe ya kawaida na isiyo na utata katika Kiswahili.
- source_word: καὶ ... καὶ
  choice: Na ... na
  rationale: Viunganishi vinaendeleza onyo la muktadha na kuunganisha matukio hayo mawili kwa urahisi.
theological_decisions:
- issue: Aina ya upotoshaji unaoelezwa na πλανήσουσιν
  choice: Mstari unaonya kwamba manabii wa uongo watawapotosha watu wengi bila kubainisha njia au kiwango cha upotoshaji huo.
  alternative: Upotoshaji huo ni hasa wa kimafundisho, wa kimaadili, au wa kieskatolojia.
  rationale: Kitenzi πλανάω kina upana unaoweza kujumuisha upotoshaji wa kimafundisho, kimaadili, na kiroho; tafsiri haibani maana kwenye aina moja.
- issue: Hali ya kitenzi ἐγερθήσονται
  choice: “Watatokea” imetumiwa kama maana ya kimuktadha ya kujitokeza kwa manabii wa uongo.
  alternative: “Watainuliwa” huhifadhi kwa uwazi zaidi hali tendwa ya umbo la Kigiriki.
  rationale: Muktadha hauitaji kueleza ni nani anayewainua, na “watatokea” huepuka dokezo lisilokusudiwa la ufufuo. Tanbihi inadumisha uwezekano wa tafsiri ya hali tendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio ni wa asili katika Kiswahili huku ukihifadhi urudiaji wa “wengi” katika Kigiriki. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
