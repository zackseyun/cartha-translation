  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: sw
  text: Kwa hiyo, mtakapoona chukizo la ukiwa lililonenwa kupitia nabii Danieli limesimama mahali patakatifu[a]—asomaye na afahamu—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pale patakatifu.”
    reason: alternative_reading
  - marker: b
    text: “Chukizo la ukiwa” pia linaweza kutafsiriwa “chukizo liletalo ukiwa” au “chukizo linalosababisha ukiwa,” likitoa mwangwi wa Danieli.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Kwa hiyo, mtakapoona
  rationale: “Kwa hiyo” huhifadhi uhusiano wa kimantiki na mazungumzo yaliyotangulia; muundo wa “mtakapoona” unaonyesha tukio la wakati ujao linalotarajiwa katika muktadha huu.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: chukizo la ukiwa
  rationale: Muundo huu unafuata kwa karibu kirai cha Kigiriki na kudumisha mwangwi wake wa kitabu cha Danieli bila kuamua kimya-kimya kama chukizo hilo linasababisha ukiwa au lina sifa ya kuleta ukiwa.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: lililonenwa kupitia nabii Danieli
  rationale: “Lililonenwa” linaonyesha tamko la kinabii, na “kupitia” huhifadhi maana ya Danieli kuwa njia ambayo ujumbe ulitolewa.
- source_word: ἑστὸς
  choice: limesimama
  rationale: Hii ni tafsiri ya moja kwa moja ya participio ya ἵστημι na haiingizi wazo la ziada la kitu “kuwekwa” hapo.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: mahali patakatifu
  rationale: Kiswahili hakilazimishi tofauti ya kibainishi sawa na Kiingereza; kirai hiki ni cha kawaida na kinaacha wazi ikiwa mahali hapo ni mahali fulani patakatifu au mahali patakatifu panapojulikana kutokana na muktadha.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: anayesoma na aelewe
  rationale: Huhifadhi himizo la moja kwa moja kwa msomaji na ni usemi wa asili, ulio wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Umaalumu wa τόπῳ ἁγίῳ na uwezekano wa kumaanisha hekalu
  choice: mahali patakatifu
  alternative: mahali pale patakatifu / Patakatifu
  rationale: Kigiriki hakina kibainishi hapa. Tafsiri kuu kwa hiyo haifungi rejeo hilo kuwa sehemu maalumu ya hekalu, ingawa muktadha unaweza kuielekeza hivyo.
- issue: Maana ya kirai cha Danieli βδέλυγμα τῆς ἐρημώσεως
  choice: chukizo la ukiwa
  alternative: chukizo liletalo ukiwa / chukizo linalosababisha ukiwa
  rationale: Kirai rasmi kinahifadhi utata wa uhusiano wa nomino hizo na mwangwi wa Danieli; njia mbadala zinafafanua uwezekano kwamba chukizo hilo husababisha ukiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za kunukuu zinaonyesha kirai maarufu cha kinabii kutoka Danieli; vistari vinatenga himizo la mzazi kwa msomaji.
