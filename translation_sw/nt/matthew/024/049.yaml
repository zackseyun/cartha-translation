lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: kuanza kuwapiga
  rationale: Muundo wa ἄρξηται pamoja na kitenzi-jina τύπτειν unaonyesha mwanzo wa tendo. “Kuwapiga” linaweza pia kudokeza tendo linalorudiwa la kuwatesa kwa vipigo katika muktadha huu.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: watumwa wenzake
  rationale: σύνδουλος humaanisha mtumwa mwenza chini ya bwana yuleyule. “Watumwa wenzake” ni Kiswahili cha kawaida kinachohifadhi hadhi yao ya pamoja chini ya bwana mmoja.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: na kula na kunywa
  rationale: Vitenzi vya wakati uliopo vinaonyesha mwenendo unaoendelea au wa kawaida; tafsiri hii inahifadhi jozi ya matendo bila kuongeza wazo la karamu lisilotajwa wazi.
- source_word: μετὰ τῶν μεθυόντων
  choice: pamoja na wale wanaolewa
  rationale: Kivumishi-tendo cha wakati uliopo kinaweza kueleza watu wanaojihusisha na ulevi au wenye tabia ya kulewa. “Wale wanaolewa” huhifadhi muundo huo bila kuwapa tu jina la kudumu.
theological_decisions:
- issue: Jinsi ya kutafsiri neno la jamii ya δοῦλος katika συνδούλους
  choice: watumwa wenzake
  alternative: watumishi wenzake
  rationale: Katika mfano huu wa nyumba yenye bwana, hadhi ya kuwa chini ya mamlaka ya bwana mmoja ni sehemu muhimu ya picha. “Watumwa wenzake” huihifadhi kwa uwazi, huku tanbihi ikitoa tafsiri mbadala iliyo laini zaidi.
- issue: Maana ya τῶν μεθυόντων
  choice: wale wanaolewa
  alternative: walevi
  rationale: Muundo wa Kigiriki ni wa kivumishi-tendo na unaweza kuonyesha watu wanaojulikana kwa kulewa. Tafsiri kuu huhifadhi muundo wa kitendo, na tanbihi inaonyesha uwezekano wa neno la sifa “walevi.”
