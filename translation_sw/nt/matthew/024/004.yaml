  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: sw
  text: Yesu akawajibu, “Jihadharini, mtu yeyote asiwapotoshe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: akawajibu
  rationale: Muundo huu wa Kigiriki una maana ya kawaida ya ‘akawajibu’ au ‘akajibu akawaambia.’ Kiswahili cha sasa hakihitaji uradidi wa ‘akajibu akawaambia’; ‘akawajibu’ huhifadhi maana ya kuitikia na kuelekeza jibu kwao.
- source_word: Βλέπετε
  choice: Jihadharini
  rationale: Amri hii ya wingi katika muktadha huu inawataka wasikilizaji wawe macho na wajilinde. ‘Jihadharini’ ni Kiswahili cha kawaida na chenye hadhi kwa maana hii, bila kulazimisha sitiari ya kuona.
- source_word: μή τις
  choice: mtu yeyote asi-
  rationale: Baada ya amri ya kujihadhari, μή pamoja na hali tegemezi huonyesha jambo la kuzuia. Muundo ‘mtu yeyote asiwapotoshe’ huwasilisha kwa kawaida kusudi hilo la tahadhari.
- source_word: πλανήσῃ
  choice: asiwapotoshe
  rationale: πλανάω inaweza kumaanisha kumfanya mtu apotee njia, kumdanganya, au kumwelekeza vibaya. ‘Kupotosha’ huhifadhi kwa upana wazo la udanganyifu na kuondolewa katika njia iliyo sawa.
theological_decisions:
- issue: Upeo wa onyo katika πλανήσῃ
  choice: asiwapotoshe
  alternative: asiwadanganye
  rationale: ‘Kupotosha’ huhifadhi onyo pana dhidi ya kudanganywa na kuongozwa mbali na njia iliyo sawa, bila kulifanya lihusu udanganyifu wa kiakili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akawajibu’ inaleta mtiririko wa kawaida wa simulizi, na ‘Jihadharini’ ni amri ya wingi inayoeleweka kwa urahisi.
