base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: sw
  text: Kwa maana, kama zilivyokuwa siku za Nuhu, ndivyo itakavyokuwa katika kuja[a] kwa Mwana wa Adamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwepo.” Neno la Kigiriki linaweza kumaanisha uwepo au kuwasili, lakini hapa linahusu kuja kwa Mwana wa Adamu wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: kama vile
  rationale: Hutanguliza ulinganisho na, pamoja na “ndivyo,” huhifadhi muundo wa Kigiriki wa “kama vile ... ndivyo ...” kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huhifadhi kiunganishi cha ufafanuzi kinachounganisha kauli hii na muktadha uliotangulia.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: siku za Nuhu zilivyokuwa
  rationale: Kigiriki hakina kiarifu kilicho wazi katika sehemu ya kwanza ya ulinganisho. “Zilivyokuwa” hukamilisha sentensi kwa Kiswahili bila kuongeza ufafanuzi wa kimawazo.
- source_word: Νῶε
  choice: Nuhu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: οὕτως
  choice: ndivyo
  rationale: Hulingana kiasili na “kama vile” na kudumisha ulinganisho wa sehemu mbili.
- source_word: ἔσται
  choice: kutakavyokuwa
  rationale: Huwakilisha wakati ujao wa kitenzi εἰμί na kupatana kisarufi na nomino “kuja.”
- source_word: παρουσία
  choice: kuja
  rationale: Katika muktadha huu wa wakati ujao, neno hilo linaonyesha ujio wa Mwana wa Adamu. “Kuja” ni wazi na la kawaida, huku maana mbadala ya “kuwapo” ikihifadhiwa katika tanbihi.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Huhifadhi cheo kilichozoeleka cha Yesu na mwangwi wake wa kimaandiko bila kukitafsiri kwa ufafanuzi zaidi.
theological_decisions:
- issue: Tafsiri ya παρουσία katika kauli kuhusu mambo ya mwisho
  choice: kuja
  alternative: kuwapo
  rationale: Muktadha unaelekeza kwenye ujio wa Mwana wa Adamu wa wakati ujao, hivyo “kuja” huwasilisha vizuri nguvu ya tukio. Hata hivyo, kwa kuwa παρουσία pia linaweza kumaanisha “kuwapo,” uwezekano huo umewekwa katika tanbihi ili kutoficha upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa “kama vile ... ndivyo ...” huhifadhi ulinganisho wa asili bila kuwa mgumu.
