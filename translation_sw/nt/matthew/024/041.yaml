  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: sw
  text: Wanawake wawili watakuwa wakisaga kwenye kinu[a][b]; mmoja atachukuliwa, na mwingine ataachwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wawili watakuwa wakisaga.” Kishiriki cha Kigiriki kiko katika wingi wa kike, kwa hiyo wahusika ni wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa jiwe la kusagia” au “kwa kifaa cha kusagia”; neno la Kigiriki linaweza kumaanisha kinu au jiwe lake.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema tu kwamba mmoja anachukuliwa na mwingine anaachwa; hapa hakisemi wazi ikiwa kuchukuliwa ni kwa wokovu au kwa hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο
  choice: wawili
  rationale: Ni nambari ya idadi inayoonyesha jozi; upatanisho wa ngeli unaendana na wanawake wanaodhihirishwa na umbo la kike la kishiriki kinachofuata.
- source_word: ἀλήθουσαι
  choice: wanawake ... watakuwa wakisaga
  rationale: Kishiriki hiki ni cha wakati wa sasa, hali ya kutenda, wingi wa kike. Kiswahili cha kawaida kinahitaji kutaja wahusika, hivyo ‘wanawake’ huonyesha kwa usahihi umbo la kike, na ‘watakuwa wakisaga’ huwasilisha tendo linaloendelea katika tukio la wakati ujao.
- source_word: ἐν τῷ μύλῳ
  choice: kwa jiwe la kusagia
  rationale: μύλος inaweza kumaanisha kinu, kifaa cha kusagia, au jiwe la kusagia. Katika mazingira ya kazi ya nyumbani ya wanawake wawili, ‘kwa jiwe la kusagia’ ni ya kawaida na haisemi zaidi ya ushahidi wa chanzo.
- source_word: μία ... μία
  choice: mmoja ... mwingine
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa uwazi mgawanyo wa wanawake hao wawili, huku ukidumisha jinsia ya kike ya wahusika.
- source_word: παραλαμβάνεται
  choice: atachukuliwa
  rationale: Kauli ya kutendwa imedumishwa. ‘Atachukuliwa’ ni fupi na haifafanui ikiwa kuchukuliwa huko ni kwa wokovu au hukumu.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida ‘na’ kinaakisi καὶ bila kuongeza wazo la upinzani ambalo halijaelezwa wazi.
- source_word: ἀφίεται
  choice: ataachwa
  rationale: Kauli ya kutendwa imedumishwa kwa maana ya moja kwa moja. ‘Ataachwa’ huepuka nguvu ya ziada ambayo ingeingizwa na ‘atatelekezwa’ au maana maalumu ya ‘ataachwa nyuma.’
theological_decisions:
- issue: Ikiwa wahusika wa kike wanaodokezwa na kishiriki watajwe wazi
  choice: Kutaja ‘wanawake’ wazi
  alternative: ‘Wawili watakuwa wakisaga’
  rationale: Umbo la ἀλήθουσαι ni wingi wa kike, kwa hiyo wahusika ni wanawake. Kutaja ‘wanawake’ huwasilisha taarifa hiyo ya kisarufi badala ya kuifanya isiwe na jinsia.
- issue: Ikiwa παραλαμβάνεται na ἀφίεται zifafanuliwe kuwa wokovu au hukumu
  choice: 'Kudumisha maneno yasiyoamua: ‘atachukuliwa’ na ‘ataachwa’'
  alternative: ‘Mmoja atachukuliwa kwa hukumu na mwingine ataokolewa,’ au ‘mmoja atachukuliwa kwa wokovu na mwingine ataachwa kwa hukumu’
  rationale: Mstari wenyewe unaeleza kutenganishwa kwa hao wawili lakini hausemi wazi maana ya kila tendo kuhusu wokovu au hukumu. Tafsiri inadumisha mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Wakati ujao unaolingana na muktadha umetumiwa katika sentensi kuu, huku maelezo ya tanbihi yakihifadhi hali ya moja kwa moja ya Kigiriki.
