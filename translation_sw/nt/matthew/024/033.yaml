  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: sw
  text: Vivyo hivyo nanyi, mtakapoona mambo haya yote, jueni kwamba ni karibu[a]—milangoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye yuko karibu.” Kigiriki hakitaji kiima wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Vivyo hivyo nanyi
  rationale: “Vivyo hivyo” huendeleza ulinganisho na mfano wa mtini uliotangulia, huku “nanyi” ikisisitiza wanafunzi kama watazamaji wanaolinganishwa.
- source_word: ὅταν ἴδητε
  choice: mtakapoona
  rationale: Muundo huu wa wakati ujao unaelezwa kwa Kiswahili cha kawaida na cha moja kwa moja kwa “mtakapoona,” bila kuleta wazo la tukio linalojirudia-rudia.
- source_word: πάντα ταῦτα
  choice: mambo haya yote
  rationale: Huhifadhi wingi na ujumla wa maneno ya Kigiriki bila kufafanua zaidi kwamba ni matukio ya aina gani.
- source_word: γινώσκετε
  choice: jueni
  rationale: Huhifadhi nguvu ya amri ya kitenzi cha Kigiriki na ni usemi wa kawaida, wenye hadhi katika Kiswahili.
- source_word: ἐγγύς
  choice: karibu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wazo la ukaribu.
- source_word: ἐπὶ θύραις
  choice: milangoni
  rationale: Huhifadhi wingi wa θύραις na nahau ya kuwa karibu sana, kwa muundo mfupi na wa asili wa Kiswahili.
- source_word: ἐγγύς ἐστιν
  choice: ni karibu
  rationale: Muundo wa Kiswahili wenye “ni” hauitaji kutaja wazi kiima, hivyo unahifadhi kwa kadiri iwezekanavyo utata wa Kigiriki kuhusu kama anayekaribia ni mtu au kinachokaribia ni tukio.
theological_decisions:
- issue: Kiima kisichotajwa cha ἐγγύς ἐστιν
  choice: ni karibu
  alternative: yeye yuko karibu
  rationale: Kigiriki hakitaji kiima wazi. “Ni karibu” huepuka kuamua kimya kimya kama kinachorejelewa ni Mwana wa Adamu mwenyewe, tukio la hukumu, ufalme, au utimilifu wa mambo hayo; uwezekano wa maana ya mtu unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida; alama ya mkato kabla ya “milangoni” inaonyesha msisitizo wa nahau ya Kigiriki bila kuongeza ufafanuzi wa kimadhehebu.
