  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: sw
  text: Kwa maana kama vile umeme unavyotokea mashariki na kuonekana mpaka magharibi, ndivyo kuja[a] kwa Mwana wa Adamu kutakavyokuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwapo.” Neno la Kigiriki παρουσία linaweza kumaanisha “kuwapo” au “kuwasili,” lakini hapa katika muktadha linarejelea kuja kwa Mwana wa Adamu wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” inahifadhi kiunganishi cha maelezo γάρ, na “kama vile” linaanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ἡ ἀστραπή
  choice: umeme
  rationale: Katika muktadha huu neno hilo linamaanisha mwanga wa radi unaoonekana angani; “umeme” ndilo neno la kawaida na fasaha katika Kiswahili.
- source_word: ἐξέρχεται ἀπὸ ἀνατολῶν
  choice: unavyotokea mashariki
  rationale: Kitenzi ἐξέρχεται kina wazo la kutokea au kutoka, na ἀνατολῶν katika ulinganisho huu wa pande za dunia humaanisha mashariki.
- source_word: φαίνεται ἕως δυσμῶν
  choice: na kuonekana mpaka magharibi
  rationale: “Kuonekana” huhifadhi hali ya wazi ya φαίνεται, huku “mpaka magharibi” ikionyesha upeo unaokusudiwa na ἕως δυσμῶν.
- source_word: οὕτως ἔσται
  choice: ndivyo ... kutakavyokuwa
  rationale: Muundo huu wa Kiswahili unahifadhi ulinganisho pamoja na wakati ujao wa ἔσται.
- source_word: ἡ παρουσία
  choice: kuja
  rationale: Ingawa παρουσία linaweza kumaanisha kuwapo au kuwasili, katika kauli hii ya wakati ujao “kuja” linaeleza vizuri tukio linalokusudiwa bila kuficha maana nyingine ya kileksika, ambayo imewekwa katika tanbihi.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: kwa Mwana wa Adamu
  rationale: “Mwana wa Adamu” ni tafsiri iliyozoeleka ya jina hili la cheo na inadumisha mwangwi wake wa kimaandiko, hasa wa Danieli 7.
theological_decisions:
- issue: Maana ya παρουσία katika kauli kuhusu wakati ujao
  choice: kuja
  alternative: kuwapo; kuwasili
  rationale: Muktadha unalinganisha tukio la wazi na linaloonekana la umeme na παρουσία ya Mwana wa Adamu. “Kuja” huwasilisha maana ya tukio la wakati ujao bila kuingiza mpangilio maalumu wa kimafundisho; uwezekano wa maana “kuwapo” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa “kama vile ... ndivyo ...” unadumisha ulinganisho wa chanzo kwa njia ya kawaida ya Kiswahili.
