  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: sw
  text: Kwa hiyo, ninyi pia iweni tayari, kwa maana Mwana wa Adamu anakuja saa msiyotarajia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “saa msiyodhani.” Kitenzi cha Kigiriki kinaweza kumaanisha “kufikiri,” “kudhani,” au, kulingana na muktadha, “kutarajia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinarejelea onyo lililotangulia na kuonyesha msingi wa hitimisho au amri inayofuata.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: Kiwakilishi kilichotajwa wazi pamoja na καί kinasisitiza kwamba wasikilizaji pia wanahusika.
- source_word: γίνεσθε ἕτοιμοι
  choice: iweni tayari
  rationale: Amri ya wakati uliopo inataka hali endelevu ya utayari; ‘iweni tayari’ ni Kiswahili cha kawaida na hudumisha nguvu ya amri bila kuifanya iwe ya kuanza tu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa neno hili linatoa sababu ya amri ya kuwa tayari.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: saa msiyotarajia
  rationale: Ni msemo wa wakati unaomaanisha ‘katika saa ambayo’; katika muktadha huu δοκεῖτε linaweza kueleza kutarajia, ingawa maana ya ‘kudhani’ pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika Biblia ya Kiswahili; linahifadhi muundo wa Kigiriki, usuli wake wa Kisemiti, na uzito wake wa kikristo.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki una nguvu ya wakati ujao na uhalisia ulio wazi; ‘anakuja’ huhifadhi hali hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: ‘Mwana wa Adamu’ ni tafsiri ya kijadi iliyo thabiti katika matumizi ya Biblia ya Kiswahili na inahifadhi mwangwi wa Kisemiti na wa Danieli bila kufafanua jina hilo kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; ‘ninyi pia’ huhifadhi msisitizo wa kiwakilishi, na tanbihi huhifadhi upana wa maana ya δοκεῖτε.
