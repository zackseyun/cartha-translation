  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: sw
  text: Lakini ombeni kwamba kukimbia kwenu kusitokee wakati wa majira ya baridi wala siku ya Sabato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ombeni
  rationale: Ni amri ya nafsi ya pili wingi. “Ombeni” ni Kiswahili cha kawaida na cha moja kwa moja; hali ya sasa ya Kigiriki inaweza kudokeza kuendelea kuomba, lakini muktadha hauhitaji kuongeza neno hilo wazi.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye utofautishaji mdogo kutoka onyo lililotangulia; “Lakini” linaendeleza mkondo huo kwa ufupi.
- source_word: ἵνα μὴ γένηται
  choice: kwamba ... kusitokee
  rationale: Baada ya “ombeni,” muundo huu unaonyesha jambo linaloombewa. “Kusitokee” ni wa asili na huhifadhi maana ya tukio kutofanyika.
- source_word: ἡ φυγὴ ὑμῶν
  choice: kukimbia kwenu
  rationale: φυγή humaanisha kukimbia au kutoroka. “Kukimbia kwenu” ni wazi na haliongezi dhana kwamba kutoroka huko kutafanikiwa.
- source_word: χειμῶνος
  choice: wakati wa majira ya baridi
  rationale: Hii ni kauli ya wakati au majira. “Wakati wa majira ya baridi” ni Kiswahili sanifu kinachoeleweka na kinafaa kwa hali ya safari ngumu.
- source_word: μηδὲ σαββάτῳ
  choice: wala siku ya Sabato
  rationale: μηδέ huunganisha hali ya pili iliyo hasi. “Siku ya Sabato” hutaja wazi siku inayokusudiwa; Kiswahili hakina vibainishi vinavyolingana moja kwa moja na tofauti ya Kiingereza kati ya “a” na “the.”
theological_decisions:
- issue: Iwapo σαββάτῳ itafsiriwe kama Sabato isiyo maalumu au Sabato maalumu
  choice: siku ya Sabato
  alternative: Sabato fulani / siku ya Sabato hiyo
  rationale: Nomino ya Kigiriki haina kibainishi, lakini hali hiyo peke yake hailazimishi maana ya “Sabato fulani.” Kiswahili hakina vibainishi vya aina ya “a” na “the,” hivyo “siku ya Sabato” huhifadhi maana bila kulazimisha umaalumu au kutokuwa maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha ufupi wa Kigiriki na haitatui kimyakimya utata wa umaalumu wa “Sabato,” kwa kuwa Kiswahili chenyewe hakihitaji kibainishi.
