  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: sw
  text: Akaugusa mkono wake, homa ikamwacha, naye akainuka, akamhudumia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥψατο
  choice: akaugusa
  rationale: Kitenzi hiki hapa humaanisha kugusa au kuwasiliana kwa mguso; “akaugusa” ni Kiswahili cha kawaida na hakiongezi wazo la kuushika.
- source_word: τῆς χειρὸς αὐτῆς
  choice: mkono wake
  rationale: χείρ kwa kawaida ni “mkono”; umilikaji wa Kigiriki umeelezwa kwa njia ya kawaida ya Kiswahili.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: homa ikamwacha
  rationale: Huhifadhi usemi wa Kigiriki unaoifanya homa kuwa mtendaji, huku ukiwa wa asili katika Kiswahili.
- source_word: πυρετός
  choice: homa
  rationale: Nomino hii humaanisha homa moja kwa moja, bila kuhitaji ufafanuzi wa ziada.
- source_word: ἠγέρθη
  choice: akaamka
  rationale: Katika muktadha huu inaeleza kuinuka kwake baada ya kuponywa; “akaamka” ni usemi wa kawaida wa simulizi na hauingizi maana ya ufufuo isiyodaiwa hapa.
- source_word: διηκόνει αὐτῷ
  choice: akaanza kumhudumia
  rationale: διακονέω humaanisha kuhudumia au kutumikia; katika mazingira haya ya nyumbani, “kumhudumia” ni ya asili. “Akaanza” huonyesha uwezekano wa nguvu ya kuanza/kuendelea ya wakati usiotimilika, huku tanbihi ikihifadhi tafsiri rahisi.
theological_decisions:
- issue: Uwezekano wa kuipa ἠγέρθη maana ya kitheolojia ya ufufuo
  choice: akaamka
  alternative: akainuliwa; akafufuka
  rationale: Muktadha wa karibu unaeleza tu kwamba mwanamke huyo aliinuka baada ya homa kumwacha; tafsiri haipaswi kuingiza wazo la ufufuo lisilohitajika na simulizi.
- issue: Nguvu ya wakati usiotimilika katika διηκόνει
  choice: akaanza kumhudumia
  alternative: akamhudumia
  rationale: Wakati usiotimilika unaweza kuonyesha tendo lililoanza au lililoendelea, lakini si lazima. Maandishi yanatumia usemi wa kuanza, na tanbihi inadumisha uwezekano halisi wa tafsiri rahisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo wa vitenzi vinavyofuatana kwa “ka-” unahifadhi mwendo wa haraka wa matukio katika Kigiriki.
