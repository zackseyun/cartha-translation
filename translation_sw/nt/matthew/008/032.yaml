  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: sw
  text: Akawaambia, “Nendeni.” Nao wakatoka, wakaingia ndani ya nguruwe. Na tazama, kundi lote la nguruwe likateremka kwa kasi kwenye mteremko mkali[a] hadi baharini, nao wakafa majini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwenye genge. Neno la Kigiriki linaweza kumaanisha mteremko mkali, ukingo mkali, au genge.
    reason: lexical_alternative
  - marker: b
    text: Au, wakafa kwa kuzama majini. Kigiriki kinasema kwa ukaribu zaidi, “wakafa majini.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Nendeni
  rationale: Amri hii fupi ya wingi inalingana moja kwa moja na kauli ya Yesu na ni ya kawaida katika Kiswahili cha sasa.
- source_word: ἐξελθόντες
  choice: wakatoka
  rationale: Inawasilisha kitendo cha kutoka kwa pepo kabla ya kuingia kwao ndani ya nguruwe, huku ikidumisha mtiririko wa simulizi.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: wakaingia ndani ya nguruwe
  rationale: Muktadha unaonyesha mwendo wa pepo kuingia ndani ya wanyama; kauli hii ni wazi na ya asili katika Kiswahili.
- source_word: χοίρους
  choice: nguruwe
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa wanyama wanaotajwa.
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi ishara ya kisimulizi inayovuta fikira kwa tukio la ghafla linalofuata.
- source_word: πᾶσα ἡ ἀγέλη
  choice: kundi lote la nguruwe
  rationale: “Kundi lote” linahifadhi maana ya ujumla, na kutaja nguruwe kunasaidia uwazi wa kisarufi na kisimulizi.
- source_word: ὥρμησεν
  choice: likakimbia kwa kasi
  rationale: Kauli hii inaonyesha mwendo wa ghafla na wenye nguvu bila kuongeza kwamba kundi lilijitupa kwa makusudi.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: kuteremka ule mteremko mkali
  rationale: κρημνός inaweza kumaanisha mteremko mkali, ukingo, au genge; tafsiri hii ni wazi bila kudai kwamba palikuwa jabali lililonyooka kabisa.
- source_word: θάλασσαν
  choice: baharini
  rationale: Inafuata neno la Kigiriki θάλασσα badala ya kulibadili kuwa “ziwa,” ingawa eneo hilo linajulikana pia kama Bahari ya Galilaya.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: wakafa majini
  rationale: Inafuata kwa karibu kauli ya Kigiriki kwamba walikufa majini, bila kuongeza moja kwa moja kwamba walikufa kwa kuzama.
theological_decisions:
- issue: Kiwango cha ufafanuzi kuhusu jinsi nguruwe walivyokufa
  choice: wakafa majini
  alternative: wakafa kwa kuzama majini
  rationale: Muktadha unaelekeza kwenye kuzama, lakini Kigiriki kinasema tu kwamba walikufa majini. Tafsiri kuu inadumisha kauli ya chanzo bila kufanya dokezo hilo kuwa tamko la wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Na tazama” imetumiwa kuhifadhi msisitizo wa kisimulizi wa ἰδοὺ. Viwakilishi vya wingi mwishoni vinawarejelea nguruwe, huku “kundi” likibaki katika umoja wa kisarufi.
