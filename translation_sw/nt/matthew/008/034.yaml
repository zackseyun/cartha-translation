id: MAT.8.34
reference: Matthew 8:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: sw
  text: Na tazama, mji wote ukatoka kwenda kumlaki Yesu; nao walipomwona, wakamsihi aondoke katika eneo lao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nchi yao”; kwa maana halisi zaidi, “kutoka katika mipaka yao.”
    reason: Neno la Kigiriki linaweza kutaja mipaka yenyewe au eneo lililo ndani ya mipaka hiyo.
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inadumisha kazi ya neno hili ya kuvuta fikira na kuupa usimulizi uhai, kwa lugha ya heshima inayoeleweka.
- source_word: πᾶσα ἡ πόλις
  choice: mji wote
  rationale: Inahifadhi tamathali ya Kigiriki inayotaja mji kwa maana ya wakazi wake kwa ujumla, bila kudai lazima kwamba kila mtu mmoja mmoja alitoka.
- source_word: ἐξῆλθεν
  choice: ukatoka
  rationale: Inawakilisha moja kwa moja tendo la kutoka mjini; umoja wake unapatana na nomino ya pamoja “mji.”
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: kwenda kumlaki Yesu
  rationale: “Kumlaki” linaonyesha kwa kawaida kutoka kwa kusudi la kukutana na mtu anayekuja.
- source_word: ἰδόντες αὐτὸν
  choice: walipomwona
  rationale: Muundo wa wakati unaonyesha kwa Kiswahili sanifu kwamba ombi lao lilifuata baada ya kumwona.
- source_word: παρεκάλεσαν
  choice: wakamsihi
  rationale: “Kusihi” linaonyesha ombi la dhati na lenye nguvu kuliko kuuliza tu, bila kuongeza sababu ambayo haikutajwa.
- source_word: ὅπως μεταβῇ
  choice: aondoke
  rationale: Linatoa kwa ufupi maudhui ya ombi lao kwamba Yesu aende zake kutoka mahali hapo.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: katika eneo lao
  rationale: Ingawa ὅρια kwa msingi ni mipaka, hapa linaashiria nchi au eneo lililo ndani ya mipaka hiyo; “eneo lao” ni la kawaida na wazi kwa msomaji wa sasa.
theological_decisions:
- issue: Sababu ya wakazi wa mji kumsihi Yesu aondoke
  choice: Sababu haijatajwa; aya inasema tu kwamba walimsihi aondoke.
  alternative: Hofu ya nguvu za Yesu, hasira kwa kupoteza nguruwe, au mshtuko wa jumla kutokana na tukio hilo.
  rationale: Nakala ya Kigiriki haielezi nia yao. Tafsiri haiongezi ufafanuzi wa kitheolojia au kisaikolojia ambao ungeondoa mvutano wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na tazama” huhifadhi alama ya kisimulizi; “kumlaki” na “wakamsihi” ni maneno yanayoeleweka na yana uzito unaofaa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
