  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: sw
  text: Yesu alipoona makundi mengi ya watu yakimzunguka, aliamuru waende ng’ambo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: umati mkubwa
  rationale: Ingawa Kigiriki kina wingi halisi, usemi huu kwa muktadha unaonyesha watu wengi waliokusanyika; ‘umati mkubwa’ ni Kiswahili cha kawaida na huepuka wingi usio wa asili wa ‘makutano mengi.’
- source_word: ἐκέλευσεν
  choice: aliamuru
  rationale: Kitenzi kina maana ya kutoa agizo lenye mamlaka, hivyo ‘aliamuru’ kinahifadhi nguvu yake.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: waende ng’ambo
  rationale: ‘Ng’ambo’ kwa kawaida humaanisha upande wa pili wa eneo la maji; umbo ‘waende’ linaacha kundi linaloagizwa lieleweke kutokana na muktadha, kama ilivyo katika infinitivu ya Kigiriki.
- source_word: περὶ αὐτόν
  choice: umemzunguka
  rationale: Huwasilisha kwa Kiswahili cha asili kwamba umati ulikuwa pande zote karibu naye.
theological_decisions:
- issue: Wahusika wa amri hawakutajwa wazi katika mstari huu
  choice: aliamuru waende
  alternative: aliwaamuru wanafunzi wake waende
  rationale: Kigiriki hakitaji ‘wanafunzi wake’ hapa; kutowaongeza kunahifadhi ufupi na kiwango cha uwazi cha chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida bila kupunguza mamlaka ya amri ya Yesu.
