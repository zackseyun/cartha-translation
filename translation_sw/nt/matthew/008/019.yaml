  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: sw
  text: Mwalimu mmoja wa sheria akamkaribia Yesu na kumwambia, “Mwalimu, nitakufuata popote uendapo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “popote uondokako” au “popote uendako.” Kitenzi cha Kigiriki kinaweza kusisitiza kuondoka au kwenda zake, ingawa hapa kwa kawaida humaanisha “kwenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akamkaribia
  rationale: Kitenzi hiki kinaonyesha kwamba mtu huyo alimwendea Yesu kabla ya kusema; “akamkaribia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: εἷς γραμματεὺς
  choice: mwalimu mmoja wa sheria
  rationale: Katika muktadha wa Injili, γραμματεύς humaanisha mtu aliyefundishwa katika Sheria na mwenye jukumu la kuifundisha. “Mwalimu wa sheria” inaeleweka wazi zaidi katika Kiswahili cha sasa kuliko “mwandishi,” ambalo linaweza kueleweka kama mwandishi wa kawaida; “mmoja” inahifadhi εἷς.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hii ndiyo maana ya moja kwa moja ya διδάσκαλος na inahifadhi heshima ya namna alivyomwita Yesu bila kuongeza uzito wa cheo usiotajwa wazi.
- source_word: ἀκολουθήσω
  choice: nitakufuata
  rationale: Wakati ujao unaonyesha azimio la mtu huyo. “Nitakufuata” huhifadhi pia uwezekano wa maana halisi ya kuandamana na Yesu na maana ya kuwa mfuasi wake.
- source_word: ὅπου ἐὰν
  choice: popote
  rationale: Muundo huu unaonyesha mahali pasipoainishwa na upeo usio na kikomo; “popote” ni wa kawaida na sahihi.
- source_word: ἀπέρχῃ
  choice: uendapo
  rationale: Ingawa ἀπέρχομαι inaweza kusisitiza kuondoka au kwenda zake, hapa “uendapo” ni usemi wa asili unaoeleza kwenda kwa Yesu mahali popote.
theological_decisions:
- issue: Cheo διδάσκαλος anachotumiwa Yesu
  choice: Mwalimu
  alternative: Bwana Mkuu; Rabi
  rationale: “Mwalimu” hutafsiri maana ya neno la Kigiriki bila kulifanya cheo hiki kuwa tamko la juu zaidi la kikristo kuliko mstari wenyewe unavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa kawaida na hadhi inayofaa maandiko. Jina “Yesu” limetumiwa badala ya kiwakilishi ili rejeo la αὐτῷ liwe wazi katika mstari unaosomwa peke yake.
