  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: sw
  text: Nao pepo hao waliendelea kumsihi wakisema, “Ikiwa unatufukuza, tutume kwenye kundi la nguruwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: Nao pepo hao
  rationale: “Pepo” ni neno la kawaida na linaloeleweka katika Kiswahili kwa viumbe waovu wa kiroho katika muktadha huu. “Nao” linaendeleza simulizi bila kuongeza mkazo wa utofautishaji usiokuwapo.
- source_word: παρεκάλουν
  choice: waliendelea kumsihi
  rationale: Kauli ya wakati usiotimilika katika Kigiriki inadokeza tendo lililoendelea au lililorudiwa; “waliendelea kumsihi” linawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi kinachotanguliza maneno ya moja kwa moja kinatafsiriwa kwa kawaida na kwa ufasaha kuwa “wakisema.”
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Ikiwa unatufukuza
  rationale: “Ikiwa” linadumisha sharti lililo katika chanzo, na “unatufukuza” linaonyesha kuwa wanatolewa kwa nguvu bila kuongeza maelezo ya kimadhehebu.
- source_word: ἀπόστειλον ἡμᾶς
  choice: tutume
  rationale: Amri hii inaomba hatua ya moja kwa moja; “tutume” ni fupi, ya asili, na sahihi.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: kwenye kundi la nguruwe
  rationale: “Kundi la nguruwe” ni usemi wa kawaida wa Kiswahili kwa mkusanyiko wa wanyama hao, na “kwenye” linaonyesha mahali walipoomba kutumwa.
theological_decisions:
- issue: Utambulisho wa δαίμονες kama viumbe waovu wa kiroho
  choice: pepo
  alternative: roho waovu
  rationale: “Pepo” linadumisha madai ya simulizi kwamba hawa ni viumbe binafsi wa kiroho wanaozungumza na Yesu. Haliongezi kivumishi kisichotajwa wazi katika mstari huu.
- issue: Nguvu ya sharti Εἰ
  choice: Ikiwa unatufukuza
  alternative: Kwa kuwa unatufukuza
  rationale: Tafsiri ya “ikiwa” inahifadhi muundo na mvutano wa sharti katika Kigiriki badala ya kuligeuza kuwa dai la uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na rahisi kusomwa; nguvu ya tendo linaloendelea katika παρεκάλουν imewasilishwa moja kwa moja katika matini, hivyo tanbihi haikuhitajika.
