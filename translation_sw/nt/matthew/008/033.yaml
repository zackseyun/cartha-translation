  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: sw
  text: Wale waliokuwa wakichunga nguruwe wakakimbia, wakaenda mjini na kutoa habari za kila kitu, pamoja na mambo yaliyowahusu wale waliokuwa wamepagawa na pepo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi, “na mambo ya wale waliokuwa wamepagawa na pepo”; inaweza pia kueleweka kuwa “pamoja na yaliyowapata wale waliokuwa wamepagawa na pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Wale waliokuwa wakichunga nguruwe
  rationale: Kirai hiki kwa maana ya moja kwa moja ni ‘wale waliokuwa wakilisha/kuchunga.’ ‘Nguruwe’ imetajwa kutokana na muktadha wa karibu, na usemi huu ni wa kawaida na wazi zaidi kuliko nomino inayoweza kudhaniwa kuwa inahusu wachungaji wa kondoo.
- source_word: ἔφυγον
  choice: wakakimbia
  rationale: Kitenzi φεύγω hapa kinaonyesha kukimbia kutoka mahali kwa haraka; ‘wakakimbia’ ni simulizi la kawaida na lenye nguvu katika Kiswahili.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: wakaenda mjini
  rationale: Muundo wa mfululizo wenye ‘waka-’ unaonyesha tendo lililofuata la kwenda mjini, kwa Kiswahili cha asili, bila kuufanya usemi wa Kigiriki kuwa mzito.
- source_word: ἀπήγγειλαν πάντα
  choice: kutoa habari za kila kitu
  rationale: ἀπαγγέλλω ni kutoa au kuripoti habari, na πάντα hudumisha wazo la ujumla wa taarifa yao.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: pamoja na mambo yaliyowahusu wale waliokuwa wamepagawa na pepo
  rationale: Huhifadhi usemi mpana wa Kigiriki, ‘mambo ya/yanayowahusu wale waliopagawa na pepo,’ badala ya kuamua kimya kimya kwamba unamaanisha tu yaliyowapata.
- source_word: δαιμονιζομένων
  choice: waliokuwa wamepagawa na pepo
  rationale: Huu ni usemi wa kawaida unaoonyesha kuwa watu hao walikuwa chini ya nguvu za pepo, bila kuongeza ufafanuzi wa kimafundisho ambao neno lenyewe halitoi.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμονιζομένων bila kuongeza utofautishaji wa kimafundisho
  choice: waliokuwa wamepagawa na pepo
  alternative: walioteswa na pepo
  rationale: ‘Wamepagawa na pepo’ linaonyesha hali halisi inayosimuliwa na Mathayo na ni usemi unaoeleweka kwa wasomaji wengi. Halijaribu kufafanua kwa undani kiwango au namna ya mamlaka ya pepo zaidi ya ushahidi wa matini.
- issue: Maana ya τὰ τῶν δαιμονιζομένων
  choice: mambo yaliyowahusu wale waliokuwa wamepagawa na pepo
  alternative: yaliyowapata wale waliokuwa wamepagawa na pepo
  rationale: Uhusiano unaoonyeshwa na kiwakilishi cha umilikaji katika Kigiriki ni mpana. Tafsiri iliyochaguliwa inadumisha uwezekano kwamba habari zilihusu hali yao au yaliyotokea kwao, badala ya kuchagua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya ‘waka-’ unafaa simulizi na unaweka matendo kwa mpangilio wazi. Usemi ‘wakichunga nguruwe’ unaepuka utata wa ‘wachungaji’ huku ukitegemea muktadha wa karibu.
