  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: sw
  text: Yesu alipoingia nyumbani mwa Petro, alimwona mama mkwe wa Petro akiwa amelala[a], naye alikuwa na homa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amelazwa.” Kiyunani kinaeleza hali yake ya kuwa amelazwa au amelala; hakisemi wazi kwamba alikuwa kitandani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: alipoingia
  rationale: Kirai cha wakati kinaonyesha Yesu kufika na kuingia katika nyumba; ‘alipoingia’ ni cha asili katika Kiswahili na kinaendana na εἰς τὴν οἰκίαν.
- source_word: οἰκίαν Πέτρου
  choice: nyumbani mwa Petro
  rationale: Hutoa kwa kawaida maana ya nyumba au makao ya Petro, huku ikihifadhi uhusiano wa umilikaji.
- source_word: πενθερὰν αὐτοῦ
  choice: mama mkwe wa Petro
  rationale: πενθερά humaanisha ‘mama mkwe.’ Kurudia jina Petro kunaondoa utata unaoweza kutokea kwa kutumia ‘wake,’ bila kubadili rejeo la kiwakilishi.
- source_word: βεβλημένην
  choice: akiwa amelala
  rationale: Hii ni hali ya kuwa amelazwa au amelala. Tafsiri haiongezi ‘kitandani,’ jambo linalodokezwa na muktadha lakini halijasemwa wazi.
- source_word: πυρέσσουσαν
  choice: na ana homa
  rationale: Kitenzi-shirikishi kinaeleza hali ya homa inayoendelea; usemi huu ni wa moja kwa moja na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Rejeo la αὐτοῦ katika ‘mama mkwe wake’
  choice: Kiwakilishi kinamhusu Petro; kwa hiyo imetafsiriwa ‘mama mkwe wa Petro.’
  alternative: ‘mama mkwe wake,’ ambalo linaweza kueleweka kimakosa kuwa linamhusu Yesu.
  rationale: Muundo wa Kiyunani na muktadha huunganisha mwanamke huyo na Petro. Kutaja Petro wazi kunazuia utata bila kutoa hitimisho lolote la ziada la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumbani mwa Petro’ ni usemi wa kawaida zaidi kuliko ‘katika nyumba ya Petro,’ na kurudia ‘Petro’ kunafanya rejeo la mama mkwe liwe wazi.
