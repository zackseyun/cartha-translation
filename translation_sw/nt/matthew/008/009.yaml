reference: Matthew 8:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: sw
  text: Kwa maana mimi pia ni mtu chini ya mamlaka, nami nina askari walio chini yangu. Ninamwambia huyu, ‘Nenda,’ naye huenda; na mwingine, ‘Njoo,’ naye huja; na mtumishi wangu[a], ‘Fanya hivi,’ naye hufanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mtumwa” badala ya “mtumishi” (Kigiriki: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa akida anatoa msingi wa maelezo yake; ‘Kwa maana’ ni ya kawaida na huhifadhi nguvu ya ufafanuzi ya γάρ.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: mimi pia ni mtu
  rationale: Kiwakilishi kilicho wazi na καὶ vinaonyesha ulinganisho wa akida na Yesu; ‘mimi pia’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ὑπὸ ἐξουσίαν
  choice: aliye chini ya mamlaka
  rationale: Huhifadhi dhana ya kuwa chini ya amri au mamlaka iliyokabidhiwa bila kutaja wazi mwenye mamlaka huyo.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: nami nina askari walio chini yangu
  rationale: 'Huwasilisha kwa uwazi nafasi mbili za akida: yuko chini ya mamlaka na ana askari walio chini yake.'
- source_word: λέγω τούτῳ
  choice: Ninamwambia huyu
  rationale: ‘Huyu’ huhifadhi hali ya kiwakilishi cha kuonyesha na mtiririko wa mifano ya mtu mmoja mmoja.
- source_word: Πορεύθητι / Ἔρχου
  choice: Nenda / Njoo
  rationale: Amri hizi fupi ni za moja kwa moja, za kawaida, na zinalingana na Kigiriki.
- source_word: πορεύεται / ἔρχεται / ποιεῖ
  choice: huenda / huja / hufanya
  rationale: Hali ya mazoea ya Kiswahili huonyesha kanuni ya utiifu wa mara kwa mara katika mfano wa akida, si tukio moja tu.
- source_word: δοῦλος
  choice: mtumishi
  rationale: Katika muktadha huu hoja kuu ni utii chini ya mamlaka. ‘Mtumishi’ ni ya asili na yenye heshima katika Kiswahili, huku maana mbadala ya kihistoria ‘mtumwa’ ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya δοῦλος katika mfano wa akida
  choice: mtumishi
  alternative: mtumwa
  rationale: Neno la Kigiriki linaweza kumaanisha mtumwa au mtumishi kulingana na muktadha. Hapa mkazo uko katika mamlaka na utiifu; maandishi makuu yanatumia ‘mtumishi,’ lakini tanbihi inahifadhi uwezekano wa ‘mtumwa’ bila kuficha hali ya kijamii inayoweza kudokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri na mwitikio umehifadhiwa kwa urari na uwazi; ‘hu-’ hutumika kuonyesha utiifu wa kawaida katika mfano.
