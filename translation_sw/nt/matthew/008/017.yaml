id: MAT.8.17
reference: Matthew 8:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: sw
  text: 'ili litimie neno lililosemwa kwa njia ya nabii Isaya, akisema: “Yeye mwenyewe aliyachukua magonjwa yetu[a] na kuyabeba[b] maradhi yetu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “udhaifu wetu.” Neno la Kigiriki ἀσθενείας linaweza kumaanisha udhaifu, hali za ulegevu, au magonjwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kuyachukua juu yake.” “Kuyabeba” huhifadhi uhusiano wa karibu na Isaya 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Hutambulisha kusudi au matokeo katika kauli ya Mathayo kuhusu kutimia kwa unabii; “ili” ni ya kawaida na huhifadhi maana hiyo.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Huhifadhi wazo kuu la kutimia kwa neno la kinabii kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸ ῥηθὲν
  choice: lile lililosemwa
  rationale: Muundo huu unarejelea kwa uwazi neno lililosemwa, huku ukipatana kisarufi na kitenzi “litimie.”
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: kupitia nabii Isaya
  rationale: “Kupitia” huhifadhi maana ya Isaya kuwa njia au chombo ambacho ujumbe ulisemwa.
- source_word: λέγοντος
  choice: akisema
  rationale: Ni utangulizi mfupi na wa kawaida wa maneno yaliyonukuliwa.
- source_word: Αὐτὸς
  choice: Yeye mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: ἀσθενείας
  choice: magonjwa
  rationale: Katika muktadha wa karibu wa uponyaji, neno hili linaeleweka kwa kawaida kama maradhi au udhaifu wa kimwili; tanbihi huhifadhi upana wa maana yake.
- source_word: ἔλαβεν
  choice: aliyachukua
  rationale: Ni tafsiri ya moja kwa moja ya λαμβάνω bila kuongeza kwa lazima wazo la ‘kuondoa.’
- source_word: νόσους
  choice: maradhi
  rationale: Hueleza magonjwa kwa usahihi na husaidia kutofautisha kwa mtindo maneno mawili yanayokaribiana katika nukuu.
- source_word: ἐβάστασεν
  choice: kuyabeba
  rationale: Huhifadhi maana halisi ya kubeba na mwangwi wa Isaya 53:4 bila kuamua kikamilifu namna ya kitheolojia ya kubeba huko.
theological_decisions:
- issue: Namna ya kutafsiri nukuu ya Isaya 53:4 katika muktadha wa uponyaji
  choice: 'Kutumia maneno yanayoonyesha mateso ya kimwili: “magonjwa” na “maradhi.”'
  alternative: “udhaifu” na “magonjwa,” au maneno yenye mwangwi mpana zaidi wa huzuni na maumivu.
  rationale: Muktadha wa Mathayo unahusisha moja kwa moja nukuu hii na huduma ya Yesu ya kuponya. Tafsiri hiyo haipaswi kuingiza peke yake ufafanuzi maalumu wa upatanisho, lakini kitenzi “kubeba” na tanbihi huhifadhi mwangwi na mvutano wa kitheolojia wa Isaya 53.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. Alama zote za tanbihi zimewekwa katika matini karibu na maneno yanayohusika.
