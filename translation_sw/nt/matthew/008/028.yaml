  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: sw
  text: Alipofika ng’ambo, katika eneo la Wagadarene[a], wanaume wawili waliopagawa na pepo walikutana naye, waliokuwa wakitoka makaburini. Walikuwa wakali sana[b], hivi kwamba hakuna mtu aliyeweza kupita kwenye njia ile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala husoma “Wagergesi” au “Wagerasi” badala ya “Wagadarene.”
    reason: textual_variant
  - marker: b
    text: Au, “hatari sana.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kupitia njia ile.”
    reason: translation_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Alipofika
  rationale: Kauli tegemezi ya wakati inatafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha kwamba tukio hili lilitokea alipowasili.
- source_word: τὸ πέραν
  choice: ng’ambo
  rationale: Katika muktadha huu neno hilo linamaanisha upande mwingine wa ziwa; “ng’ambo” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: eneo la Wagadara
  rationale: χώρα hapa ni eneo au nchi, na “Wagadara” linafuata jina la watu katika usomaji wa SBLGNT, Γαδαρηνῶν.
- source_word: δύο δαιμονιζόμενοι
  choice: watu wawili waliopagawa na pepo
  rationale: Usemi huu unaeleza watu waliokuwa chini ya nguvu ya pepo; tafsiri hii ni ya kawaida na wazi bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: Walikuwa wakitoka makaburini
  rationale: μνημεῖα hapa ni makaburi, na umbo endelevu linaonyesha walikuwa wakitoka humo walipokutana naye.
- source_word: χαλεποὶ λίαν
  choice: wakali sana
  rationale: χαλεπός inaweza kumaanisha mkali, hatari, au mwenye kutisha. “Wakali sana” huhifadhi upana huo kuliko kuamua kwamba walifanya vurugu za kimwili hasa.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: hivi kwamba hakuna mtu aliyeweza kupita
  rationale: ὥστε inaonyesha matokeo, na ἰσχύειν hapa inaeleza uwezo wa kupita, si lazima nguvu za mwili.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: katika njia ile
  rationale: διὰ pamoja na hali ya umilikishi inaonyesha njia iliyotumiwa kupita. “Katika njia ile” ni wazi na ya asili.
theological_decisions:
- issue: Lugha ya hali inayosababishwa na pepo
  choice: waliopagawa na pepo
  alternative: waliokuwa chini ya nguvu za pepo
  rationale: Tafsiri iliyochaguliwa inatambua utendaji halisi wa pepo unaodokezwa na δαιμονιζόμενοι bila kufafanua kwa namna ya dhehebu kiwango au utaratibu wa utawala huo.
- issue: Tofauti ya maandishi katika jina la mahali
  choice: Wagadara
  alternative: Wagergesa au Wagerasa
  rationale: Maandishi ya SBLGNT yana Γαδαρηνῶν, kwa hiyo matini kuu inafuata “Wagadara”; namna nyingine zinazoshuhudiwa na hati fulani zimehifadhiwa katika tanbihi.
- issue: Maana ya χαλεποὶ
  choice: wakali sana
  alternative: hatari sana
  rationale: Neno la Kigiriki linaweza kueleza ukali, hatari, au tabia ya kutisha. Matini kuu haibani maana kuwa vurugu za kimwili pekee, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kigiriki imegawanywa kwa kiasi ili iwe ya asili katika Kiswahili bila kupoteza uhusiano wa matukio.
