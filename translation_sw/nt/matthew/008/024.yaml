base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: sw
  text: Tazama[a], dhoruba kali[b] ikatokea baharini, hata mawimbi yakawa yanaifunika mashua; lakini yeye alikuwa amelala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiyunani hapa ni kiashiria cha kuvuta usikivu, yaani “tazama” au “angalia.”
    reason: discourse_marker
  - marker: b
    text: Neno la Kiyunani linalotafsiriwa “dhoruba” mara nyingi humaanisha “tetemeko” au “mtikisiko”; hapa muktadha unaonyesha msukosuko mkali wa baharini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi kazi ya kiashiria cha mazungumzo kinachovuta usikivu na kuleta tukio kwa ghafla mbele ya msomaji.
- source_word: σεισμὸς μέγας
  choice: dhoruba kali
  rationale: Ingawa σεισμός mara nyingi humaanisha tetemeko au mtikisiko, muktadha wa bahari, mashua na mawimbi unaonyesha msukosuko mkali wa baharini. 'Dhoruba kali' ni ya asili na inaeleweka bila kuleta picha isiyofaa ya tetemeko la nchi kavu.
- source_word: ἐγένετο
  choice: ikatokea
  rationale: Kitenzi hiki kinaeleza kuanza au kutokea kwa tukio; 'ikatokea' ni Kiswahili cha kawaida na chenye mtiririko mzuri katika simulizi.
- source_word: ἐν τῇ θαλάσσῃ
  choice: baharini
  rationale: Kinahifadhi neno la chanzo 'bahari' na kueleza mahali tukio lilipotokea kwa Kiswahili cha kawaida.
- source_word: ὥστε
  choice: hata
  rationale: Katika muundo huu 'hata' huonyesha matokeo ya ukali wa dhoruba kwa njia fupi na ya asili.
- source_word: τὸ πλοῖον
  choice: mashua
  rationale: Katika mazingira ya Bahari ya Galilaya, 'mashua' ni neno la kawaida na sahihi zaidi kuliko 'meli'.
- source_word: καλύπτεσθαι
  choice: ikawa inafunikwa
  rationale: Inahifadhi maana ya msingi ya kufunikwa na hali inayoendelea ya infinitivu ya wakati wa sasa ya Kiyunani, bila kuongeza moja kwa moja wazo la kuzama.
- source_word: ὑπὸ τῶν κυμάτων
  choice: na mawimbi
  rationale: Katika sentensi tendwa, 'na mawimbi' huonyesha kwa kawaida kile kilichokuwa kinaifunika mashua.
- source_word: αὐτὸς δὲ
  choice: lakini yeye
  rationale: Inahifadhi tofauti ya wazi kati ya vurugu ya dhoruba na hali ya Yesu; kiwakilishi 'yeye' pia hubeba kiasi cha msisitizo wa αὐτός.
- source_word: ἐκάθευδεν
  choice: alikuwa amelala
  rationale: Huwasilisha hali iliyoendelea wakati wa tukio na ni usemi wa kawaida wa Kiswahili kwa mtu aliyekuwa usingizini.
theological_decisions:
- issue: Aina ya tukio linaloelezwa na σεισμός
  choice: dhoruba kali
  alternative: tetemeko kubwa au mtikisiko mkubwa
  rationale: Huu ni uamuzi wa kileksika unaotegemea muktadha, si utatuzi wa fundisho. Picha ya bahari, mashua na mawimbi inaelekeza kwenye msukosuko mkali wa baharini, huku tanbihi ikihifadhi upana wa maana ya neno la Kiyunani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia viambishi vya mfuatano ('ikatokea', 'ikawa') kwa mtiririko wa kawaida. 'Tazama' limehifadhiwa kwa nguvu ya ghafla ya ἰδοὺ, na tanbihi zinaeleza maana pana ya σεισμός pamoja na uwezekano wa tafsiri ya καλύπτεσθαι.
