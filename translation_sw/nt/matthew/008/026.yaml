  source_fidelity: 'Tafsiri inafuata Kigiriki kwa uaminifu: swali la Yesu, wito «enyi wenye imani ndogo», tendo la kukemea pepo na bahari, na matokeo ya utulivu mkubwa vyote vimehifadhiwa. «Akawaambia» ni matumizi yanayokubalika ya wakati wa simulizi kwa λέγει, na «akainuka» huwasilisha ἐγερθείς bila kuongeza maana.'
