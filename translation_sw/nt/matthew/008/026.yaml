  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: sw
  text: Akawaambia, “Kwa nini mna hofu, enyi wenye imani ndogo?” Kisha akainuka, akazikemea pepo na bahari, kukawa na utulivu mkubwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: mna hofu
  rationale: Huwasilisha hali ya kuwa waoga au wenye hofu kwa Kiswahili cha kawaida, huku swali likibaki la moja kwa moja.
- source_word: ὀλιγόπιστοι
  choice: wenye imani ndogo
  rationale: Huhifadhi maana ya moja kwa moja ya neno la Kigiriki bila kufafanua zaidi kiwango au aina ya upungufu wa imani.
- source_word: ἐπετίμησεν
  choice: akazikemea
  rationale: ‘Kukemea’ linafaa kwa amri kali inayoelekezwa kwa pepo na bahari na ni istilahi ya kawaida ya kibiblia.
- source_word: γαλήνη μεγάλη
  choice: utulivu mkubwa
  rationale: Huwakilisha kutulia kabisa kwa hali ya bahari kwa lugha ya asili na inayoeleweka.
theological_decisions:
- issue: Uhusiano kati ya hofu na imani ndogo
  choice: Maneno yote mawili yamehifadhiwa bila kueleza kwamba moja ndilo sababu ya jingine.
  alternative: Kwa nini mnaogopa kwa sababu ya imani yenu ndogo?
  rationale: Kigiriki kina swali linalofuatwa na namna ya kuwaita wanafunzi; hakisemi wazi uhusiano wa kisababishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umewekwa kwa mtiririko wa asili wa Kiswahili.
