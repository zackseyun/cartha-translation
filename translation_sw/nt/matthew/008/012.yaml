id: MAT.8.12
reference: Matthew 8:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: sw
  text: Lakini wana wa ufalme watatupwa nje katika giza la nje.[a] Huko kutakuwa na kilio na kusaga meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, wale waliohesabiwa kuwa warithi halali au washiriki waliotazamiwa wa ufalme. Kigiriki: “wana wa ufalme”; pia yaweza kutafsiriwa “watoto wa ufalme.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Lakini wana wa ufalme
  rationale: '“Lakini” inaonyesha utofauti na mstari uliotangulia. “Wana wa ufalme” inahifadhi nahau ya Kigiriki na kejeli yake: wale waliodhaniwa kuwa washiriki halali wa ufalme ndio wanaotengwa.'
- source_word: ἐκβληθήσονται
  choice: watatupwa nje
  rationale: Kitenzi cha wakati ujao katika hali tendwa kinaonyesha kufukuzwa kwa nguvu; “watatupwa nje” ni Kiswahili cha sasa, wazi, na chenye uzito unaofaa.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: giza la nje
  rationale: Tafsiri hii inahifadhi taswira ya Mathayo ya giza lililo nje bila kuibadili kuwa istilahi ya kimafundisho isiyotajwa moja kwa moja.
- source_word: κλαυθμός
  choice: kilio
  rationale: “Kilio” ni neno la kawaida na lenye heshima linaloeleza maombolezo bila kuongeza kiwango cha hisia kisicholazimishwa na neno lenyewe.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Hii ni njia ya kawaida na inayoeleweka katika Kiswahili ya kueleza tendo la meno kukwaruzana kwa uchungu au hasira.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Kuweka “Huko” mwanzoni mwa sentensi ya pili kunadumisha msisitizo wa mahali ulio katika Kigiriki.
theological_decisions:
- issue: Taswira ya kutengwa na hukumu
  choice: Kuhifadhi taswira halisi ya kutupwa nje katika “giza la nje,” pamoja na “kilio na kusaga meno.”
  alternative: Kutafsiri kwa ufafanuzi kama “jehanamu” au “adhabu ya milele.”
  rationale: Andiko linaonyesha kutengwa na mateso makali, lakini halitumii hapa istilahi hizo za kimfumo. Kuhifadhi taswira yake huepuka kuongeza madai yaliyo nje ya maneno ya mstari.
- issue: Tafsiri ya υἱοὶ katika nahau υἱοὶ τῆς βασιλείας
  choice: wana wa ufalme
  alternative: watoto wa ufalme; warithi wa ufalme
  rationale: “Wana” inafuata umbo la kiume la Kigiriki na kuhifadhi nahau ya wale waliotazamiwa kuwa washiriki au warithi wa ufalme, bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na chanzo lakini unasomeka kwa kawaida; taswira na mvutano wa kitheolojia vimehifadhiwa.
