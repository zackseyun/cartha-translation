  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: sw
  text: Alipoingia Kapernaumu, afisa wa jeshi aliyekuwa mkuu wa askari mia moja alimjia na kumsihi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Alipoingia
  rationale: Kirai huru cha uhusika milikishi chenye kitenzi-jina cha wakati uliopita kimetafsiriwa kama kishazi cha wakati. Hili linaonyesha mfuatano wa simulizi bila kuamua kwa nguvu kama tukio lilitokea wakati huohuo au mara baada ya kuingia.
- source_word: εἰς Καφαρναοὺμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia inayotumika sana katika Biblia za Kiswahili; maana ya kihusishi imejumuishwa kwa kawaida katika kitenzi “kuingia.”
- source_word: προσῆλθεν αὐτῷ
  choice: alimjia
  rationale: “Alimjia” ni Kiswahili cha kawaida na sahihi kwa maana ya kuja karibu na mtu au kumkaribia katika simulizi.
- source_word: ἑκατόνταρχος
  choice: ofisa wa jeshi aliyekuwa mkuu wa askari mia moja
  rationale: Tafsiri hii inaeleza cheo maalumu cha kijeshi badala ya kutumia neno la mkopo lisiloeleweka kwa urahisi kwa wasomaji wote. Haiongezi wazi utaifa ambao haujatajwa katika mstari huu.
- source_word: παρακαλῶν αὐτὸν
  choice: na kumsihi
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha ombi la dhati. “Kumsihi” huhifadhi uzito wa ombi bila kulifanya lazima kuwa kuomba kwa kujishusha kupita kiasi; “na” linaonyesha tendo lililoambatana na kumjia.
theological_decisions:
- issue: Utaifa wa mkuu wa askari mia moja
  choice: Hajaitwa “Mroma” katika matini kuu.
  alternative: ofisa Mroma
  rationale: Ingawa cheo hicho kilihusishwa na jeshi la Roma, ἑκατόνταρχος yenyewe hutaja cheo, si utaifa. Tafsiri haipaswi kuongeza utambulisho ambao mstari huu hauusemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi rahisi; cheo cha kijeshi kimefafanuliwa kwa uwazi kwa msomaji wa kawaida. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
