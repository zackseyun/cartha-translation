id: MAT.8.11
reference: Matthew 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: sw
  text: Lakini ninawaambia kwamba wengi watakuja kutoka mashariki na magharibi, nao wataketi mezani[a] pamoja na Abrahamu, Isaka na Yakobo katika ufalme wa mbinguni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “watajiegemeza”; msemo huu unahusu kukaa mahali pa mtu kwenye meza ya karamu kulingana na desturi ya wakati huo.
    reason: cultural_note
  - marker: b
    text: “Kutoka mashariki na magharibi” huenda kunamaanisha watu wanaokuja kutoka maeneo ya mbali, kutia ndani walio nje ya Israeli.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: δέ inaonyesha badiliko au utofautishaji wa kiasi katika hoja; “Lakini” linaonyesha hilo kwa Kiswahili cha kawaida, na λέγω ὑμῖν ni “ninawaambia.”
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino. “Wengi” ni cha asili na hakiongezi utambulisho ambao Kigiriki hakijautaja.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: kutoka mashariki na magharibi
  rationale: Wingi wa maneno ya Kigiriki una maana ya maeneo au pande; msemo huu wa Kiswahili huhifadhi upana wa kijiografia bila kuwataja wazi watu wa mataifa mengine.
- source_word: ἥξουσιν
  choice: watakuja
  rationale: Kitenzi kina maana ya kuja au kuwasili; “watakuja” ni cha kawaida na kinafaa katika muktadha huu.
- source_word: ἀνακλιθήσονται
  choice: wataketi mezani
  rationale: Kitenzi kinamaanisha kujiegemeza wakati wa kula kulingana na desturi ya kale. “Wataketi mezani” huwasilisha kwa msomaji wa sasa tendo la kushiriki karamu, huku tanbihi ikihifadhi picha halisi ya kujiegemeza.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: pamoja na Abrahamu, Isaka na Yakobo
  rationale: μετά pamoja na hali ya umilikaji huonyesha ushirika; hapa ni ushirika wa mezani. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: Huu ni msemo bainifu wa Mathayo. “Ufalme wa mbinguni” ni tafsiri ya Kiswahili iliyo ya asili na sahihi kuliko kufuata wingi wa Kigiriki kihalisi.
theological_decisions:
- issue: Picha ya karamu na ushirika wa wakati ujao
  choice: Kuhifadhi mazingira ya chakula kwa “wataketi mezani,” pamoja na tanbihi kuhusu maana halisi ya kujiegemeza.
  alternative: wataketi pamoja na Abrahamu, Isaka na Yakobo
  rationale: Mstari unaonyesha ushirika wa karamu, si kuwapo mahali pamoja tu. Tafsiri hii inadumisha nguvu ya picha hiyo bila kuongeza maelezo ya kimafundisho yasiyotajwa.
- issue: Wanaohusika katika “wengi” watokao mashariki na magharibi
  choice: Kutafsiri maelezo ya kijiografia na kutowaweka wazi kama watu wa mataifa mengine katika matini kuu.
  alternative: watu wengi wa mataifa mengine watakuja kutoka mashariki na magharibi
  rationale: Muktadha unaweza kudokeza kujumuishwa kwa walio nje ya Israeli, lakini Kigiriki kinasema tu “wengi.” Tafsiri inahifadhi dokezo hilo bila kulifanya tamko la wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wataketi mezani” ni ya asili kwa wasomaji wa sasa; tanbihi inaeleza desturi ya kale. Alama zote za tanbihi zimewekwa katika matini kuu.
