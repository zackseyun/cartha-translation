  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: sw
  text: Watu hao wakashangaa, wakisema, “Huyu ni mtu wa namna gani[a], hata pepo na bahari zinamtii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huyu ni mtu wa aina gani?” Usemi wa Kigiriki unauliza mtu huyo ni wa aina gani au ana sifa gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Watu hao
  rationale: Hurejelea watu waliokuwa ndani ya mashua. Kiswahili cha kawaida hutumia “watu” kwa kundi hili; “hao” hudumisha rejeleo la moja kwa moja bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἐθαύμασαν
  choice: wakashangaa
  rationale: Huonyesha mshangao mkubwa katika tukio lililopita, kwa lugha ya sasa na ya kawaida ya simulizi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hudumisha uhusiano wa kitenzi-shirikishi na mshangao wao kwa mtiririko wa kawaida wa simulizi ya Kiswahili.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Huyu ni mtu wa namna gani
  rationale: “Wa namna gani” huuliza aina au sifa ya mtu huyo na kudumisha mshangao wa swali. Neno “mtu” limewekwa wazi kwa sababu Kiswahili huhitaji usemi kamili na wa asili katika muktadha huu.
- source_word: ὅτι
  choice: hata
  rationale: Katika muundo wa swali hili, “hata” huunganisha msingi wa mshangao na jambo lisilotarajiwa linalofuata kwa Kiswahili cha asili.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: hata pepo na bahari
  rationale: “Hata” huonyesha mkazo wa καί, huku “pepo” ikihifadhi wingi wa οἱ ἄνεμοι na “bahari” ikifuata umoja wa ἡ θάλασσα.
- source_word: αὐτῷ ὑπακούουσιν
  choice: vinamtii
  rationale: “Kumtii” huonyesha kwamba pepo na bahari zinaitikia mamlaka yake, si kwamba zinasikia tu. Upatanisho wa “vi-” ni wa kawaida kwa vitu visivyo na uhai vilivyounganishwa.
theological_decisions:
- issue: Uzito wa swali kuhusu utambulisho na mamlaka ya Yesu
  choice: Swali limetafsiriwa moja kwa moja, likiacha mamlaka ya Yesu juu ya uumbaji ionekane kwa njia ya simulizi bila kuongezwa hitimisho la kimafundisho.
  alternative: Kupanua swali kwa maneno kama “Huyu anawezaje kuwa mtu wa aina gani?” au kutaja wazi utambulisho wake wa kimungu.
  rationale: Kigiriki kinaonyesha mshangao kuhusu mtu wa namna gani aliye na mamlaka ambayo hata pepo na bahari zinaitikia. Tafsiri inadumisha uzito huo wa Kikristo bila kutatua kimyakimya mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Wakashangaa” na “wa namna gani” zinafaa kwa simulizi bila kuwa za kizamani. Alama ya tanbihi [a] imewekwa baada ya kirai kinachofafanuliwa.
