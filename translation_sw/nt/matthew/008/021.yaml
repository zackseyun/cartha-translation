  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: sw
  text: Kisha mwanafunzi mwingine akamwambia, “Bwana, niruhusu kwanza niende nikamzike baba yangu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ombi hili linaweza kumaanisha kumzika baba yake mara moja, au kwa upana zaidi kutimiza wajibu kwa baba yake hadi atakapokufa; Kigiriki hakibainishi.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: Kisha mwanafunzi mwingine
  rationale: Kifungu hiki kinamtambulisha msemaji kuwa mwanafunzi mwingine tofauti na msemaji aliyetangulia; ‘kisha’ linaendeleza simulizi bila kuweka utofautishaji mkali.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa kitendo cha kumwambia Yesu.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi heshima ya kumwita Yesu na pia uzito wa kitheolojia unaowezekana wa κύριε.
- source_word: ἐπίτρεψόν μοι πρῶτον
  choice: niruhusu kwanza
  rationale: Huhifadhi ombi la ruhusa pamoja na kipaumbele kinachoonyeshwa na πρῶτον, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἀπελθεῖν καὶ θάψαι
  choice: niende nikamzike
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwenda kutoka mahali pa sasa kwa kusudi la kumzika mtu.
- source_word: τὸν πατέρα μου
  choice: baba yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai hiki.
theological_decisions:
- issue: Maana na wakati wa ombi la kumzika baba
  choice: Kauli imetafsiriwa moja kwa moja kama ombi la ruhusa ya kwenda kumzika baba, bila kubainisha ikiwa baba alikuwa tayari amekufa.
  alternative: Kauli inaweza kueleweka kuwa mazishi yalikuwa ya mara moja, au kuwa mwanafunzi alitaka kwanza kubaki nyumbani kutimiza wajibu kwa baba yake hadi afe.
  rationale: Kigiriki hakibainishi wakati wa kifo wala muda wa wajibu huo; kwa hiyo tafsiri kuu inadumisha utata huo badala ya kuamua tafsiri mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Niruhusu’ ni cha kawaida lakini cha heshima; ‘niende nikamzike’ ni muundo wa asili unaoonyesha kwenda kwa kusudi la kumzika. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
