  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: sw
  text: Lakini Yesu anamwambia, “Nifuate, uwaache wafu[a] wazike wafu wao wenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wafu” wa kwanza mara nyingi hueleweka kwa njia ya mfano kuwa watu wasioitikia kiroho, ilhali “wafu” wa pili ni wale waliokufa kimwili.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti nyepesi kati ya ombi lililotangulia na jibu la Yesu, bila kutia mkazo kupita kiasi.
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati uliopo wa Kigiriki umetumiwa kama wakati uliopo wa kihistoria; “anamwambia” huhifadhi uhai wa usimulizi na pia huonyesha wazi anayelengwa.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Ni amri ya moja kwa moja inayoeleza kumfuata Yesu, kwa maana ya kawaida na ya kuwa mwanafunzi wake.
- source_word: ἄφες
  choice: uwaache
  rationale: Hutoa wazo la kuacha jukumu hilo kwa wengine, si kutoa ruhusa tu.
- source_word: νεκρούς ... νεκρούς
  choice: wafu ... wafu
  rationale: Hurudia neno lilelile kama Kigiriki, hivyo kuhifadhi mchezo wa maneno na mvutano kati ya maana inayoweza kuwa ya mfano katika matumizi ya kwanza na maana halisi katika matumizi ya pili.
- source_word: θάψαι
  choice: wazike
  rationale: Muundo wa Kiswahili baada ya “uwaache” unaeleza kwa kawaida na kwa uwazi tendo la kuzika.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: wafu wao wenyewe
  rationale: “Wao wenyewe” huhifadhi msisitizo wa umilikaji uliomo katika kiwakilishi cha kujirejelea ἑαυτῶν.
theological_decisions:
- issue: Maana ya “wafu” katika usemi wa Yesu
  choice: Matini kuu inadumisha “wafu ... wafu wao wenyewe” bila kuongeza “kiroho” katika matumizi ya kwanza.
  alternative: Kutafsiri matumizi ya kwanza kuwa “waliokufa kiroho” na la pili kuwa wafu wa kimwili.
  rationale: Kigiriki kinatumia neno lilelile mara zote mbili, na usemi huo kwa makusudi una mchezo wa maneno na mvutano wa kiteolojia. Kuongeza “kiroho” katika matini kuu kungeamua maana ambayo chanzo hakuitaji wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Anamwambia” huhifadhi wakati uliopo wa kihistoria wa chanzo; “wafu wao wenyewe” hudumisha msisitizo bila kufanya sentensi kuwa nzito.
