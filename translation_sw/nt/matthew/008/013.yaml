  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: sw
  text: Yesu akamwambia jemadari, “Nenda; na itendeke kwako kama ulivyoamini.” Naye mtumishi[a] akaponywa saa hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana” au “mtoto”; neno la Kigiriki παῖς linaweza kumaanisha mtumishi au mtu mwenye umri mdogo. Katika muktadha huu, “mtumishi” linafaa zaidi kwa mtu aliyekuwa chini ya mamlaka ya jemadari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: jemadari
  rationale: Katika matumizi ya Biblia ya Kiswahili, “jemadari” ni jina linaloeleweka la afisa wa jeshi la Roma aliyekuwa na mamlaka juu ya takribani askari mia moja.
- source_word: Ὕπαγε
  choice: Nenda
  rationale: Amri fupi na ya moja kwa moja inayowasilisha tendo la kuondoka bila kuongeza maana isiyomo katika Kigiriki.
- source_word: ὡς ἐπίστευσας
  choice: kama ulivyoamini
  rationale: Inahifadhi muundo wa kitenzi na tendo binafsi la kuamini, bila kulibadili kuwa nomino kama “kulingana na imani yako.”
- source_word: γενηθήτω σοι
  choice: na itendeke kwako
  rationale: Inawasilisha nguvu ya amri ya nafsi ya tatu ya Kigiriki kwa Kiswahili cha asili na chenye hadhi, huku ikihifadhi wazo la jambo kutokea kwa ajili yake.
- source_word: παῖς
  choice: mtumishi
  rationale: Katika muktadha wa jemadari na mtu aliye chini ya mamlaka yake, “mtumishi” linafaa zaidi; hata hivyo, neno la Kigiriki linaweza pia kumaanisha kijana au mtoto, hivyo uwezekano huo umewekwa katika tanbihi.
- source_word: ἰάθη
  choice: akaponywa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kurejeshwa kwa afya; “akaponywa” ni tafsiri ya kawaida na wazi.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: saa ileile
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo wa wakati huo bila kulazimisha maana ya sekunde hiyo hiyo.
theological_decisions:
- issue: Tafsiri ya lugha ya πιστεύω/πίστις
  choice: ulivyoamini
  alternative: ulivyotumaini; kulingana na imani yako
  rationale: “Kuamini” inahifadhi umbo la kitenzi πιστεύω na uhusiano wa moja kwa moja kati ya tendo la jemadari la kuamini na kauli ya Yesu, bila kuamua zaidi kuhusu namna ya imani hiyo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa usawa bora: unaifuata Kigiriki kwa karibu huku ukitumia kauli za kawaida kama “saa ileile.” Tanbihi imewekwa baada ya “mtumishi,” neno linalohusika moja kwa moja, ingawa safu ya Kiingereza ilikuwa na alama baada ya “centurion.”'
