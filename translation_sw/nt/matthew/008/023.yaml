  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: sw
  text: Alipoingia mashuani, wanafunzi wake wakamfuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: alipoingia
  rationale: Kitenzi hiki cha wakati uliopita katika umbo la participle kinaonyesha tendo linalohusiana kwa wakati na tendo kuu. “Alipoingia” ni Kiswahili cha kawaida kinachoweza kuwasilisha maana ya “wakati alipoingia” bila kulazimisha utofauti mkali kati ya wakati huo huo na mara baada ya kuingia.
- source_word: πλοῖον
  choice: mashuani
  rationale: Katika mazingira ya Bahari ya Galilaya, “mashua” ni neno la kawaida na linalofaa kuliko “meli.” Kiambishi cha mahali katika “mashuani” huwasilisha kwa kawaida kuingia ndani ya mashua. Kiswahili hakihitaji kubainisha hapa kama ni “mashua fulani” au “mashua moja,” hivyo ukosefu wa kibainishi katika Kigiriki unabaki bila kulazimishwa.
- source_word: ἠκολούθησαν
  choice: wakamfuata
  rationale: “Kumfuata” huonyesha mwendo wa kimwili nyuma yake na pia huhifadhi mwangwi unaowezekana wa uanafunzi. Kiambishi “-ka-” kinaendeleza mfuatano wa simulizi na kwa njia ya kawaida kuakisi uhusiano unaoanzishwa na Καὶ.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: “Wanafunzi” ndilo neno sanifu la Injili kwa μαθηταί na huonyesha uhusiano wao na Yesu bila kulipunguza kuwa elimu ya darasani pekee.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: a- / -m- / wake
  rationale: Viambishi vya nafsi katika “alipoingia” na “wakamfuata,” pamoja na “wake,” hurejelea Yesu kwa njia ya kawaida ya Kiswahili bila kuongeza jina ambalo halipo katika mstari wa Kigiriki.
theological_decisions:
- issue: Mwangwi wa uanafunzi katika ἀκολουθέω
  choice: wakamfuata
  alternative: wakaenda pamoja naye
  rationale: Mstari unasimulia wanafunzi wakimfuata Yesu kimwili, lakini matumizi ya kitenzi hiki katika Mathayo yanaweza pia kugusa uhusiano wa uanafunzi. “Wakamfuata” huhifadhi maana zote mbili bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi. Hakuna tanbihi inayohitajika: “mashuani” hailazimishi utofauti wa kibainishi kati ya “a boat” na “the boat,” na “alipoingia” huhifadhi uhusiano mpana wa wakati wa participle ya Kigiriki.'
