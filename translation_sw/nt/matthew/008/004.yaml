base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: sw
  text: Yesu akamwambia, “Hakikisha kwamba humwambii mtu yeyote. Lakini nenda, ukajionyeshe kwa kuhani, kisha utoe sadaka aliyoamuru Musa[b], ili iwe ushuhuda kwao[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ushuhuda kwao.” Maneno haya yanaweza kumaanisha ushahidi unaowasilishwa kwa makuhani; wengine huyafahamu kuwa ushuhuda wa kuwatia hatiani wale ambao hawangeamini.
    reason: alternative_reading
  - marker: b
    text: Agizo hili linarejelea utaratibu wa Sheria ya Musa kwa mtu aliyetakaswa kutokana na ukoma; tazama Mambo ya Walawi 14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Hakikisha humwambii mtu yeyote
  rationale: Ὅρα hapa ni agizo la tahadhari, na likifuatwa na μηδενὶ εἴπῃς linatoa katazo. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi uzito wa agizo.
- source_word: ὕπαγε
  choice: nenda
  rationale: Ni amri rahisi ya kuondoka au kwenda, na “nenda” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: ukajionyeshe kwa kuhani
  rationale: Inahifadhi muundo wa kujirejelea na inadokeza uchunguzi wa mtu aliyetakaswa kama ulivyoagizwa katika Sheria.
- source_word: ἱερεῖ
  choice: kuhani
  rationale: Neno hilo linamtaja kuhani anayehusika na utaratibu wa Musa. Kiswahili hakihitaji kibainishi tofauti ili kuwasilisha maana hiyo.
- source_word: προσένεγκον τὸ δῶρον
  choice: utoe sadaka
  rationale: Katika muktadha wa ibada, προσένεγκον ni kutoa au kuwasilisha, na δῶρον ni zawadi ya sadaka. “Utoe sadaka” ni ya asili zaidi na inaonyesha wazi muktadha wa ibada bila kuongeza aina ya sadaka.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: aliyoamuru Musa
  rationale: “Aliyoamuru” inawasilisha mamlaka ya agizo la Musa kwa njia ya moja kwa moja.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: iwe ushuhuda kwao
  rationale: Kauli hii inahifadhi maana ya kusudi au matokeo na haibainishi watu wanaorejelewa na αὐτοῖς wala kama ushuhuda huo ni wa kuwadhibitishia au dhidi yao.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, “akamwambia” ni mtiririko wa kawaida wa simulizi la Kiswahili na huunganisha tendo hili na yaliyotangulia.
theological_decisions:
- issue: Wanaorejelewa na maana ya εἰς μαρτύριον αὐτοῖς
  choice: iwe ushuhuda kwao
  alternative: iwe ushahidi kwa makuhani; iwe ushuhuda dhidi yao
  rationale: Kiwakilishi αὐτοῖς hakitaji wazi wanaorejelewa, na μαρτύριον linaweza kumaanisha ushuhuda au ushahidi bila kuamua kama ni uthibitisho chanya au ushuhuda wa kuwatia hatiani. Tafsiri imehifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zimetumiwa ili agizo la Yesu lisomeke kwa uwazi. “Sadaka” imechaguliwa badala ya “zawadi” kwa sababu ya muktadha wa ibada, huku “ushuhuda kwao” ikihifadhi utata wa Kigiriki.
