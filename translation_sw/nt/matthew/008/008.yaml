source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: sw
  text: Yule jemadari wa askari mia akajibu, “Bwana, mimi sistahili uingie chini ya paa langu. Lakini sema neno tu[a], naye mtumishi wangu[b] ataponywa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “toa amri tu.” Kigiriki kihalisi kina wazo la “sema neno.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mvulana wangu” au “mtoto wangu.” Neno la Kigiriki linaweza kumaanisha mtoto, kijana, au mtumishi kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: akajibu
  rationale: Muundo huu wa Kigiriki unaunganisha kitenzi-shirikishi cha kujibu na kitenzi cha kusema. Kiswahili cha kawaida huyawakilisha kwa kitenzi kimoja, “akajibu,” bila urudiaji usio wa lazima.
- source_word: ἑκατόνταρχος
  choice: jemadari wa askari mia
  rationale: Hili linaeleza kwa usahihi cheo cha afisa aliyekuwa msimamizi wa kikosi cha takribani askari mia, na linaeleweka kwa urahisi kuliko kutumia neno la kigeni.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na hapa inadumisha heshima anayompa Yesu pamoja na uwezekano wa uzito zaidi wa kitheolojia.
- source_word: ἱκανὸς
  choice: sistahili
  rationale: Katika muktadha huu neno linaonyesha kutokujiona anafaa au anastahili, wala si kukosa uwezo tu.
- source_word: ὑπὸ τὴν στέγην
  choice: chini ya paa langu
  rationale: Tafsiri hii inadumisha picha halisi ya Kigiriki ya kuwa chini ya paa la mwenye nyumba, huku ikibaki wazi na ya kawaida kwa Kiswahili.
- source_word: μόνον εἰπὲ λόγῳ
  choice: sema neno tu
  rationale: Hii inadumisha nguvu ya μόνον (“tu”) na wazo kwamba neno la Yesu pekee linatosha, kwa muundo wa Kiswahili ulio wa asili.
- source_word: ἰαθήσεται
  choice: ataponywa
  rationale: Wakati ujao wa hali ya kutendwa unaonyesha kwamba uponyaji utampata mtumishi; “ataponywa” ni tafsiri wazi na ya kawaida katika simulizi la muujiza.
- source_word: παῖς
  choice: mtumishi
  rationale: παῖς linaweza kumaanisha mtoto, kijana, au mtumishi. Muktadha wa jemadari na simulizi sambamba unaunga mkono “mtumishi,” huku maana nyingine zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya κύριος anapotumiwa kumwambia Yesu
  choice: Bwana
  alternative: mheshimiwa; bwana mkubwa
  rationale: “Bwana” huhifadhi maana ya msingi ya neno na uwezekano wa uzito wa kikristolojia bila kulazimisha kwamba hapa ni cheo cha kiungu pekee.
- issue: Utambulisho wa παῖς
  choice: mtumishi
  alternative: mvulana; mtoto
  rationale: Muktadha unapendelea “mtumishi,” lakini neno la Kigiriki lina utata halisi wa kileksika. Tanbihi inadumisha uwezekano wa kwamba anayezungumziwa ni mvulana au mtoto.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Jemadari wa askari mia” huepuka neno la kigeni na kufafanua cheo; “chini ya paa langu” huhifadhi picha ya lugha chanzi. Viambishi vya usimulizi “akajibu” na “ataponywa” vinaifanya sentensi iwe ya kawaida na fasaha.
