  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: sw
  text: Kundi kubwa la nguruwe lilikuwa likila kwa umbali fulani kutoka kwao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali nao.”
