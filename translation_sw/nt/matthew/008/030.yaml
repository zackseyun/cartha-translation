lexical_decisions:
- source_word: ἦν δὲ
  choice: lilikuwa
  rationale: ἦν inaeleza hali iliyokuwapo, na lilikuwa inapatana kisarufi na kundi. δέ ni kiunganishi hafifu cha kuendeleza simulizi; hakihitaji kutafsiriwa kwa neno tofauti katika sentensi hii.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: umbali fulani kutoka kwao
  rationale: Kirai hiki kinaonyesha kutengana kwa mahali. Tafsiri hii ni ya kawaida katika Kiswahili na haikazii umbali mkubwa kuliko unaohitajika na muktadha; maana ya 'mbali nao' imehifadhiwa katika tanbihi.
- source_word: ἀγέλη
  choice: kundi
  rationale: Kundi ni neno la kawaida na linaloeleweka kwa mkusanyiko wa wanyama kama nguruwe.
- source_word: χοίρων
  choice: la nguruwe
  rationale: Nguruwe ni neno la kawaida la Kiswahili kwa χοῖρος, na umbo lake halibadiliki katika wingi.
- source_word: πολλῶν
  choice: kubwa
  rationale: Ingawa neno la Kigiriki lina maana ya 'wengi,' katika Kiswahili kundi kubwa ni njia ya asili ya kuonyesha kwamba kundi hilo lilikuwa na nguruwe wengi.
- source_word: βοσκομένη
  choice: likila
  rationale: Kitenzi hiki kinaonyesha wanyama waliokuwa wakijipatia chakula. Likila ni cha kawaida kwa nguruwe na hakiongezi wazo la kwamba walikuwa wakichungwa na mtu.
