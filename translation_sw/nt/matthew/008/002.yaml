base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: sw
  text: Na tazama, mtu mwenye ukoma akamjia, akamsujudia[a] akisema, “Bwana, ikiwa unataka, unaweza kunitakasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamwabudu”; kitenzi cha Kigiriki kinaweza kumaanisha kusujudu kwa heshima, kutoa heshima kuu, au kuabudu, kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi nguvu ya chembe ya kisimulizi inayovuta usikivu na kuleta uhai katika tukio.
- source_word: λεπρὸς
  choice: mtu mwenye ukoma
  rationale: Inamtaja mtu kwa heshima bila kumfanya ugonjwa wake kuwa utambulisho wake, huku ikihifadhi istilahi ya kawaida ya kibiblia kwa ugonjwa huu wa ngozi.
- source_word: προσελθὼν
  choice: akaja
  rationale: Inaeleza kwa ufupi na kwa Kiswahili cha kawaida kwamba mtu huyo alimkaribia Yesu.
- source_word: προσεκύνει
  choice: akamsujudia
  rationale: Kitenzi hiki kinaonyesha kuinama au kujitupa chini kwa heshima, na kulingana na muktadha kinaweza pia kumaanisha kuabudu. ‘Akamsujudia’ huhifadhi tendo la kimwili na heshima bila kulazimisha maana moja pekee.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi heshima na mamlaka katika namna Yesu anavyoitwa, pamoja na uwezekano wa uzito wa kikristo wa cheo hiki.
- source_word: ἐὰν θέλῃς
  choice: ikiwa unataka
  rationale: Ni usemi wa asili katika Kiswahili cha sasa unaohifadhi sharti linalohusu nia ya Yesu.
- source_word: δύνασαί
  choice: unaweza
  rationale: Inaeleza wazi uwezo au nguvu aliyo nayo Yesu.
- source_word: καθαρίσαι
  choice: kunitakasa
  rationale: Inahifadhi wazo la usafi wa kimwili na wa kidini linalohusiana na ukoma, badala ya kulifanya kuwa uponyaji wa jumla tu.
theological_decisions:
- issue: Maana ya προσκυνέω inapomhusu Yesu
  choice: akamsujudia
  alternative: akamwabudu
  rationale: Neno la Kigiriki linaweza kumaanisha kusujudu kwa heshima, kutoa heshima kuu, au kuabudu. Tafsiri kuu huhifadhi tendo na uzito wake wa heshima bila kuondoa mapema uwezekano wa maana ya kuabudu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; ‘mtu mwenye ukoma’ ni wa heshima zaidi kwa mtu, na ‘kunitakasa’ huhifadhi mwangwi wa kimwili na wa kidini wa chanzo.
