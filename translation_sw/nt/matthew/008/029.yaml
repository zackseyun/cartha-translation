  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: sw
  text: Na tazama, wakapaza sauti wakisema, “Tuna nini nawe[a], Mwana wa Mungu? Je, umekuja hapa kututesa kabla ya wakati uliowekwa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Tuna uhusiano gani nawe?” au “Unataka nini kwetu?”
    reason: lexical_alternative
  - marker: b
    text: Au, “kabla ya wakati.” Neno la Kigiriki linaweza kumaanisha wakati maalumu uliowekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiashiria cha simulizi kinachovuta fikira na kuonyesha tukio la ghafla bila kukifanya kuwa maelezo ya kawaida tu.
- source_word: ἔκραξαν λέγοντες
  choice: wakapaza sauti wakisema
  rationale: ‘Wakapaza sauti’ huonyesha kilio kikubwa cha κράζω, na ‘wakisema’ huhifadhi wazo la participio λέγοντες kwa Kiswahili cha asili.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Tuna nini nawe
  rationale: Inafuata kwa karibu nahau ya Kigiriki yenye maana ya kujitenga au kupinga, huku ikibaki sentensi inayoeleweka katika Kiswahili. Tanbihi inaeleza maana yake ya kimuktadha.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya cheo ambacho wahusika wanatumia kumwita Yesu.
- source_word: ἦλθες ὧδε
  choice: umekuja hapa
  rationale: Wakati timilifu wa Kiswahili unafaa kwa swali linalohusu kuwasili kwake na kusudi lake la sasa; ‘hapa’ huhifadhi maana ya ὧδε.
- source_word: πρὸ καιροῦ
  choice: kabla ya wakati uliowekwa
  rationale: καιρός inaweza kumaanisha wakati maalumu au ulioteuliwa; tafsiri hii huhifadhi dokezo hilo bila kufafanua ni nani aliyeuweka ndani ya matini kuu.
- source_word: βασανίσαι
  choice: kututesa
  rationale: ‘Kutesa’ ni neno la kawaida na lenye uzito linalofaa kwa mateso makali yanayodokezwa katika muktadha wa hukumu.
- source_word: ἡμᾶς
  choice: -tu-
  rationale: Kiambishi cha yambwa katika ‘kututesa’ huwakilisha wingi wa nafsi ya kwanza kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Utambuzi wa utambulisho wa Yesu unaotamkwa na pepo
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Matini inatoa cheo hiki moja kwa moja katika usemi wa kumwita Yesu; herufi kubwa huonyesha matumizi yake kama cheo bila kuongeza maelezo ya kimafundisho.
- issue: Dokezo la kieskatolojia la καιρός
  choice: wakati uliowekwa
  alternative: wakati
  rationale: Usemi unaashiria wakati maalumu wa mateso au hukumu. ‘Uliowekwa’ huhifadhi uwezekano wa wakati ulioteuliwa na Mungu bila kuingiza mpangilio wa kina ambao mstari hautaji.
- issue: Nahau Τί ἡμῖν καὶ σοί
  choice: Tuna nini nawe
  alternative: Unataka nini kwetu?
  rationale: Tafsiri iliyochaguliwa huhifadhi mvutano na hali ya kujitenga ya nahau ya chanzo. Tanbihi hutoa maana ya kimuktadha bila kuamua kwa nguvu zaidi kusudi la swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Na tazama’ lina ladha ya kibiblia lakini linaeleweka; ‘wakapaza sauti’ ni la asili kuliko tafsiri ya neno kwa neno. Muundo ‘Tuna nini nawe’ umehifadhiwa kwa ukaribu na chanzo na kufafanuliwa katika tanbihi.
