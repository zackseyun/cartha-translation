  text: Aliposhuka kutoka mlimani, makundi makubwa ya watu yakamfuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Aliposhuka
  rationale: Muundo wa genitivi huru wenye kitenzi-shirikishi cha wakati uliopita unaelezwa kwa kawaida kwa kishazi cha wakati. “Aliposhuka” ni Kiswahili cha kawaida na kinaonyesha mfuatano wa matukio bila kubainisha muda kupita kiasi; δέ ni kiunganishi hafifu kisichohitaji kutafsiriwa peke yake hapa.
- source_word: ἀπὸ τοῦ ὄρους
  choice: kutoka mlimani
  rationale: ὄρος inaweza kumaanisha mlima au kilima. “Mlimani” ni ya kawaida katika muktadha huu na inaunganisha mstari huu na mahali palipotajwa katika simulizi lililotangulia.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ukamfuata
  rationale: ἀκολουθέω pamoja na yambwa yake humaanisha kumfuata mtu. Kiambishi “-ka-” kinaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, na “-m-” inawakilisha αὐτῷ.
- source_word: ὄχλοι πολλοί
  choice: umati mkubwa wa watu
  rationale: Kigiriki kina wingi wa “umati/makundi ya watu” pamoja na πολλοί. Kiswahili cha sasa hueleza idadi kubwa ya watu kwa ufasaha zaidi kwa “umati mkubwa wa watu,” huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na wingi wa kisarufi wa Kigiriki.
