id: MAT.8.16
reference: Matthew 8:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: sw
  text: Kulipokuwa jioni, walimletea watu wengi waliopagawa na pepo[a]. Akazifukuza roho hizo kwa neno, na kuwaponya wote waliokuwa wagonjwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wengi walioteswa na pepo.” Kirai cha Kigiriki kinawahusu watu waliokuwa chini ya ushawishi au nguvu za pepo; “waliopagawa na pepo” ni tafsiri fupi iliyozoeleka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Kulipokuwa jioni
  rationale: Huwasilisha kishazi huru cha wakati kwa Kiswahili cha kawaida na kuhifadhi maana ya kuingia kwa wakati wa jioni.
- source_word: προσήνεγκαν αὐτῷ
  choice: walimletea
  rationale: Kitenzi hiki hapa kinaeleza kuwapeleka watu kwa Yesu; “walimletea” ni cha asili na kinaonyesha wazi kuwa yeye ndiye aliyelengwa.
- source_word: δαιμονιζομένους πολλούς
  choice: watu wengi waliopagawa na pepo
  rationale: “Kupagawa na pepo” ni usemi mfupi unaoeleweka katika Kiswahili kwa watu walio chini ya nguvu au ushawishi wa pepo, bila kugeuza hali hiyo kuwa ugonjwa wa akili.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: akazifukuza roho hizo
  rationale: “Kufukuza” huonyesha kitendo cha kuzitoa kwa mamlaka, huku “roho” ikifuata nomino ya Kigiriki moja kwa moja; “hizo” inaunganisha roho hizo na pepo waliotajwa katika muktadha.
- source_word: λόγῳ
  choice: kwa neno
  rationale: Huhifadhi hali ya chombo ya nomino ya Kigiriki na kusisitiza kwamba amri moja ya Yesu ilitosha, bila kuongeza “lake,” ambalo halijaandikwa wazi.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: wote waliokuwa wagonjwa
  rationale: Usemi wa Kigiriki humaanisha kuwa mgonjwa; tafsiri hii ni wazi, ya kawaida, na inafaa katika muktadha wa uponyaji.
- source_word: ἐθεράπευσεν
  choice: kuwaponya
  rationale: “Kuponya” ndilo neno la kawaida katika masimulizi ya uponyaji na linahifadhi maana ya kurejesha afya.
theological_decisions:
- issue: Maana ya δαιμονιζομένους na τὰ πνεύματα
  choice: 'Hali ya pepo imetafsiriwa kama jambo halisi: “waliopagawa na pepo” na “roho hizo.”'
  alternative: “watu wengi walioteswa na pepo” au kuieleza kama ugonjwa wa akili
  rationale: Aya yenyewe hutofautisha kufukuzwa kwa roho na kuponywa kwa wagonjwa. Tafsiri inahifadhi makundi hayo ya simulizi bila kuyafanya yote kuwa matatizo ya kisaikolojia, huku tanbihi ikitaja tafsiri mbadala isiyodokeza umiliki kamili.
- issue: Nguvu ya λόγῳ
  choice: “kwa neno”
  alternative: “kwa neno lake” au “kwa kusema tu”
  rationale: Tafsiri hii inaonyesha mamlaka ya amri ya Yesu bila kuongeza kiwakilishi kisichotajwa wazi wala ufafanuzi wa kiteolojia unaozidi maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye “aka-” umetumiwa kuonyesha mfuatano wa matendo. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, si baada ya kishazi cha wakati.
