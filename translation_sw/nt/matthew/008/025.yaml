  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: sw
  text: Nao wakamwendea, wakamwamsha, wakisema, “Bwana, tuokoe![a] Tunaangamia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha kuondolewa mara moja katika hatari, na pia kuokolewa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: wakamwendea
  rationale: Kitenzi hiki kinaonyesha kwamba wanafunzi walisogea walipokuwa Yesu kabla ya kumwamsha. “Wakamwendea” ni Kiswahili cha kawaida kinachodumisha mfuatano huo bila kuongeza maelezo yasiyokuwamo.
- source_word: ἤγειραν
  choice: wakamwamsha
  rationale: Katika muktadha huu ἐγείρω humaanisha kumwamsha mtu aliyelala, wala si kumwinua au kumfufua.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha moja kwa moja maneno waliyosema bila kuongeza wazo la kupiga kelele, ambalo halijaelezwa wazi katika neno la Kigiriki.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni namna ya kawaida na yenye heshima ya kutafsiri κύριος inapokuwa cheo anachoelekezewa Yesu, huku ikihifadhi uwezekano wa uzito wake mpana wa Kikristo.
- source_word: σῶσον
  choice: tuokoe
  rationale: Ni ombi la haraka la kuondolewa katika hatari. Kiambishi “tu-” kinaonyesha wahusika wanaoombewa, kama inavyodhihirishwa na kauli inayofuata, “Tunaangamia.”
- source_word: ἀπολλύμεθα
  choice: Tunaangamia
  rationale: Huhifadhi hali inayoendelea na hatari ya mauti iliyo karibu, bila kuifanya iwe tu kauli ya kwamba wanakufa.
theological_decisions:
- issue: Cheo κύριος kinapotumiwa kumwita Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: “Bwana” huhifadhi maana ya kawaida ya cheo hicho pamoja na uwezekano wa uzito wake wa Kikristo; “Mwalimu Mkuu” ingeipunguza kuwa cheo cha kiutendaji zaidi.
- issue: Kuweka wazi wahusika wa ombi σῶσον
  choice: tuokoe
  alternative: okoa
  rationale: Ingawa yambwa haijaandikwa kama neno tofauti katika Kigiriki, “Tunaangamia” huonyesha wazi kwamba wanafunzi wanamwomba Yesu awaokoe wao. Kiswahili huhitaji maana hiyo ionyeshwe kwa kiambishi “tu-” katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “wakamwendea, wakamwamsha, wakisema” unaakisi hatua za simulizi la Kigiriki, na mshangao unahifadhi haraka ya ombi lao.
