id: MAT.8.10
reference: Matthew 8:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: sw
  text: Yesu aliposikia hayo, alistaajabu, akawaambia wale waliokuwa wakimfuata, “Kweli nawaambia, sijapata imani kubwa namna hii kwa mtu yeyote katika Israeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kirai cha wakati kinaonyesha kwamba maneno ya yule jemadari yaliyotangulia ndiyo yaliyosababisha mwitikio wa Yesu. ‘Hayo’ huongezwa kwa uwazi wa kawaida wa Kiswahili bila kubadili rejeo la muktadha.
- source_word: ἐθαύμασεν
  choice: alistaajabu
  rationale: Neno hili linaonyesha mshangao mkubwa wa Yesu kwa alichosikia; ‘alistaajabu’ ni la asili, lenye heshima, na halidokezi kutokujua au kukosea.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: wale waliokuwa wakimfuata
  rationale: Kauli hii inawahusu watu waliokuwa wakiandamana na Yesu wakati huo, bila kuwalazimisha waeleweke kama kundi rasmi la wanafunzi.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hii ni kauli nzito ya Yesu inayosisitiza ukweli na mamlaka ya yale yanayofuata. Tafsiri hii ni ya kawaida na yenye uzito katika Kiswahili cha sasa.
- source_word: παρ’ οὐδενὶ
  choice: kwa mtu yeyote
  rationale: Pamoja na ukanushi wa kitenzi, kirai hiki humaanisha kwamba Yesu hakupata imani hiyo kwa mtu hata mmoja. Muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: τοσαύτην πίστιν
  choice: imani kubwa namna hii
  rationale: τοσαύτην husisitiza kiwango au ukubwa. ‘Imani kubwa namna hii’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ Ἰσραήλ
  choice: katika Israeli
  rationale: Kirai hiki kinaweza kuonyesha eneo na pia watu wa Israeli kwa maana ya kijamii; ‘katika Israeli’ huhifadhi upana huo.
- source_word: εὗρον
  choice: sijapata
  rationale: Ingawa kitenzi cha Kigiriki ni cha wakati uliopita, kauli ya Kiswahili ‘sijapata’ huonyesha kwa kawaida uzoefu wa Yesu hadi wakati huo na kuendana na nguvu ya kauli yake.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini; utegemezi wenye kuamini
  rationale: Muktadha unaonyesha imani ya jemadari katika mamlaka ya Yesu. ‘Imani’ ni tafsiri pana na ya kawaida ambayo haiingizi kwa lazima maana finyu ya dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa asili kwa msomaji wa kawaida huku ukihifadhi msisitizo wa Yesu kuhusu ukubwa wa imani na ulinganisho wake na watu wote katika Israeli.
