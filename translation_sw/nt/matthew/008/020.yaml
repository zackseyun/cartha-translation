  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: sw
  text: Yesu akamwambia, “Mbweha wana mashimo[a], na ndege wa angani[b] wana viota[c], lakini Mwana wa Adamu[d] hana mahali pa kulaza kichwa chake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapango.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja zaidi, “ndege wa mbinguni”; kwa desturi pia “ndege wa hewani.”
    reason: lexical_alternative
  - marker: c
    text: Au “mahali pa kupumzikia.”
    reason: lexical_alternative
  - marker: d
    text: “Mwana wa Adamu” ni jina ambalo Yesu anajitumia; wengine hutafsiri “Mwanadamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida “akamwambia”; hivyo usemi unasikika wa asili bila kubadili tukio.
- source_word: ἀλώπεκες
  choice: mbweha
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wanyama hawa, likiwa katika wingi kama ilivyo katika chanzo.
- source_word: φωλεοὺς
  choice: mashimo
  rationale: “Mashimo” huonyesha kwa lugha ya kawaida makao ya mbweha; “mapango” pia yanawezekana lakini yanaweza kudokeza nafasi kubwa zaidi.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi picha ya ndege walio juu angani; “ndege wa mbinguni” ungeweza kueleweka kama ndege wa makao ya Mungu.
- source_word: κατασκηνώσεις
  choice: viota
  rationale: Katika muktadha wa ndege, “viota” ni tafsiri ya kawaida na inayoeleweka ya mahali pao pa kukaa, ingawa neno la Kigiriki linaweza kumaanisha kwa upana mahali pa kupumzikia au kukaa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Usemi huu uliozoeleka katika tafsiri za Kiswahili huhifadhi cheo ambacho Yesu anajitumia pamoja na mwangwi wake wa kimaandiko, bila kukifafanua kupita chanzo.
- source_word: ποῦ
  choice: mahali pa
  rationale: Pamoja na “hana,” huu ndio muundo wa asili wa Kiswahili wa kueleza kwamba hakuna mahali ambapo tendo linalofuata linaweza kufanyika.
- source_word: κλίνῃ
  choice: kulaza
  rationale: “Kulaza kichwa chake” huhifadhi picha halisi ya kukiweka kichwa chini ili kupumzika na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la kujitambulisha kwa Yesu, ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi muundo wa cheo, matumizi yake yaliyozoeleka katika Maandiko, na uwezekano wa mwangwi wa Danieli 7. “Mwanadamu” ni fupi na ya asili zaidi katika baadhi ya miktadha, lakini inaweza kufifisha hadhi ya usemi huu kama jina ambalo Yesu anajitumia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa Maandiko. Wakati uliopo wa kihistoria wa Kigiriki umewasilishwa kwa mfululizo wa kisimulizi “akamwambia,” ambao ni wa asili zaidi katika Kiswahili. Alama zote za tanbihi zimewekwa mara moja katika sehemu zinazohusika.
