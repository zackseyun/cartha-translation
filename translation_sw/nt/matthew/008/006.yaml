id: MAT.8.6
reference: Matthew 8:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: sw
  text: akisema, “Bwana, mtumishi wangu[a] amelala nyumbani akiwa amepooza, akiteseka sana.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wangu” au “mtoto wangu”; neno la Kigiriki linaweza kumaanisha mtumishi au mtoto, ingawa “mtumishi” linafaa zaidi katika muktadha wa mkuu wa askari.
    reason: lexical_alternative
  - marker: b
    text: Au “akiteswa vikali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: akisema
  rationale: Kirai hiki ni kiunganishi cha kisimulizi chenye kitenzi kishirikishi cha wakati uliopo. “Akisema” kinaendeleza sentensi iliyotangulia kwa Kiswahili cha kawaida; kiunganishi καί hakihitaji kutafsiriwa kwa “na” hapa.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” linaweza kuwa namna ya heshima ya kumwita Yesu au cheo chenye maana ya juu zaidi, hivyo linahifadhi uwazi wa neno la Kigiriki.
- source_word: ὁ παῖς μου
  choice: mtumishi wangu
  rationale: παῖς linaweza kumaanisha mtumishi, kijana, au mtoto. Katika muktadha wa mkuu wa askari, “mtumishi wangu” linafaa zaidi, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: amelala nyumbani
  rationale: Wakati timilifu wa βέβληται unaeleza hali iliyotokana na kulazwa au kuanguka. “Amelala nyumbani” ni Kiswahili cha kawaida kinachoonyesha hali hiyo bila kudokeza kwamba mtu fulani alimlaza kwa makusudi.
- source_word: παραλυτικός
  choice: akiwa amepooza
  rationale: Tafsiri hii inaeleza hali ya kupooza kwa lugha ya sasa na inaunganika kiasili na “amelala nyumbani.”
- source_word: δεινῶς βασανιζόμενος
  choice: akiteseka sana
  rationale: Kirai hiki kinaonyesha maumivu au mateso makali. “Akiteseka sana” ni wazi na cha kawaida bila kupunguza uzito wa hali hiyo; maana yenye nguvu zaidi ya “kuteswa vikali” imewekwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya Κύριε anapotumiwa Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi uwezekano wa kuwa heshima ya kawaida na pia wa kuwa utambuzi wenye maana ya juu zaidi, bila kulazimisha mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akiwa amepooza, akiteseka sana” ni wa kawaida na unaendeleza uhusiano wa vishazi vya Kigiriki bila kuwa mgumu.
