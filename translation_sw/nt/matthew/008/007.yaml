lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa urahisi; “Naye” pia humrejelea mhusika anayeanza kusema bila kuongeza maana ya wakati au hitimisho.
- source_word: λέγει
  choice: anamwambia
  rationale: Wakati uliopo wa kisimulizi umehifadhiwa kwa “anamwambia,” ambao ni wa kawaida katika masimulizi ya Kiswahili na hudumisha uhai wa tendo.
- source_word: αὐτῷ
  choice: -mw- katika “anamwambia”
  rationale: Yambwa isiyo ya moja kwa moja imewasilishwa kwa kiambishi cha Kiswahili ndani ya kitenzi.
- source_word: Ἐγὼ
  choice: Ni- katika “Nitakuja”
  rationale: Kiswahili huonyesha nafsi katika kitenzi. Kutumia “Mimi” kungeongeza mkazo kuliko unaohitajika katika muktadha huu, ingawa kiwakilishi cha Kigiriki kimetajwa wazi.
- source_word: ἐλθὼν
  choice: nitakuja na
  rationale: Kirai hiki kinawasilisha kwa Kiswahili cha kawaida tendo linaloambatana na linalotangulia uponyaji, bila tafsiri ngumu ya neno kwa neno.
- source_word: θεραπεύσω
  choice: kumponya
  rationale: Katika muktadha wa ugonjwa, “ponya” ndiyo kitenzi cha kawaida na sahihi.
- source_word: αὐτόν
  choice: -m- katika “kumponya”
  rationale: Yambwa wa kiume anayerejelewa ameonyeshwa kwa kiambishi cha yambwa cha Kiswahili ndani ya kitenzi.
theological_decisions:
- issue: Ikiwa maneno ya Yesu yatafsiriwe kama taarifa au swali
  choice: 'Taarifa: “Nitakuja na kumponya.”'
  alternative: 'Swali: “Je, nije nikamponye?”'
  rationale: Kigiriki hakina kiashiria cha swali, na muundo wake unasomeka kwa kawaida kama taarifa. Hata hivyo, muktadha umewafanya baadhi ya watafsiri kuyaelewa kama swali; uwezekano huo umehifadhiwa katika tanbihi bila kuufanya kuwa tafsiri kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wakati uliopo wa kisimulizi umehifadhiwa katika “anamwambia,” na usemi wa moja kwa moja umetolewa kwa mtiririko wa kawaida.
