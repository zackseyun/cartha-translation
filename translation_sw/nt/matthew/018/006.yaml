  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: sw
  text: Lakini yeyote anayemsababisha mmoja wa hawa wadogo wanaoniamini ajikwae,[a] ingekuwa afadhali kwake jiwe kubwa la kinu linalozungushwa na punda[b] lifungwe shingoni mwake, naye azamishwe katika bahari ya wazi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atende dhambi” au “aanguke kiroho.” Kitenzi cha Kigiriki kinaweza kumaanisha kumsababisha mtu ajikwae, atende dhambi, au aache imani.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “jiwe la kinu la punda,” yaani jiwe kubwa la kinu lililozungushwa na punda.
    reason: cultural_note
  - marker: c
    text: Au “katika kilindi cha bahari.” Neno la Kigiriki linaelekeza hasa kwenye bahari ya wazi, mbali na ufuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: anayemsababisha ... ajikwae
  rationale: Huhifadhi sitiari ya kujikwaa huku ikiacha wazi maana pana ya kusababisha dhambi, kuanguka kiroho, au kuacha imani; tanbihi inaeleza upana huo.
- source_word: μικρῶν τούτων
  choice: hawa wadogo
  rationale: Haihusu watoto pekee kwa lazima; inahifadhi uwezekano wa kumaanisha waamini walio wanyenyekevu, dhaifu, au wasio na hadhi.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: wanaoniamini
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kwa imani au kumtumaini Yesu.
- source_word: συμφέρει αὐτῷ
  choice: ingekuwa afadhali kwake
  rationale: Hutoa kwa kawaida wazo la faida ya kulinganisha katika onyo hili kali.
- source_word: μύλος ὀνικὸς
  choice: jiwe kubwa la kusagia linalozungushwa na punda
  rationale: Hufafanua kwamba ni jiwe kubwa la kinu cha kuzungushwa na punda, si jiwe dogo la kusagia kwa mkono.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: lifungwe shingoni mwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wazi picha ya jiwe kuning'inizwa au kufungwa shingoni.
- source_word: καταποντισθῇ
  choice: azamishwe
  rationale: Huhifadhi hali tendwa na wazo la kuzamishwa majini; katika muktadha matokeo yake ni kufa maji.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: katika bahari ya wazi
  rationale: πέλαγος huelekeza kwenye eneo la bahari lililo mbali na ufuo; tafsiri hii ni mahususi kuliko kusema tu 'kilindini'.
theological_decisions:
- issue: Wanaorejelewa na ‘hawa wadogo’
  choice: Maneno yameachwa kuwa ‘hawa wadogo wanaoniamini,’ yakiruhusu kurejelea waamini walio wanyenyekevu au dhaifu, bila kuwaondoa watoto.
  alternative: ‘watoto hawa wanaoniamini’
  rationale: Mtoto yupo katika muktadha wa karibu, lakini kirai ‘wanaoniamini’ kinaweza kupanua rejeo kwa wanafunzi wanaojiona wadogo. Tafsiri haifungi maana kwa kundi moja tu.
- issue: Upana wa σκανδαλίζω
  choice: ‘ajikwae’ limetumika, huku maana pana ikielezwa katika tanbihi.
  alternative: ‘atende dhambi’ au ‘aache imani’
  rationale: Kitenzi kinaweza kuhusisha dhambi, kuanguka kiroho, au kuacha imani. Kuchagua maana moja pekee katika matini kungepunguza kwa lazima mvutano wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Jiwe kubwa la kusagia linalozungushwa na punda’ limetumiwa ili picha ya kitamaduni ieleweke bila kupoteza maelezo ya Kigiriki. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kwa mpangilio unaolingana na maelezo yake.
