  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: sw
  text: Naye akasema, “Kweli nawaambia, msipogeuka[a] na kuwa kama watoto, hakika hamtaingia katika ufalme wa mbinguni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msipogeuzwa.” Katika mapokeo ya zamani, pia limetafsiriwa “msipoongoka.”
    reason: alternative_reading
  - marker: b
    text: Au, “hamtaingia kamwe.” Kigiriki kina kanusho lenye msisitizo mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Kweli
  rationale: Katika kauli hii ya utangulizi, neno hili linasisitiza ukweli na mamlaka ya maneno yanayofuata. “Kweli” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: στραφῆτε
  choice: msipogeuka
  rationale: Umbo hili linaweza kueleweka kwa maana ya kujigeuza au kugeuzwa. “Geuka” ni la asili katika Kiswahili na linaacha wazi kwa kiasi fulani suala la mtendaji huku likionyesha mwelekeo mpya wa uamuzi.
- source_word: γένησθε
  choice: kuwa
  rationale: Hapa γίνομαι huonyesha kuingia katika hali mpya. Katika muundo “geuka na kuwa,” kitenzi “kuwa” ni cha kawaida na huwasilisha badiliko hilo kwa uwazi.
- source_word: ὡς τὰ παιδία
  choice: kama watoto
  rationale: Usemi huu unalinganisha wanafunzi na watoto bila kutaja sifa mahususi kama kutokuwa na hatia au unyenyekevu. Kiswahili cha kawaida hakihitaji kuonyesha artikeli ya Kigiriki kwa “wale watoto.”
- source_word: οὐ μὴ εἰσέλθητε
  choice: hakika hamtaingia
  rationale: Muungano wa οὐ μή na subjunktivu ni kanusho lenye msisitizo mkubwa. “Hakika hamtaingia” huhifadhi msisitizo huo kwa lugha ya sasa.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi mahususi wa Mathayo. “Ufalme wa mbinguni” ni tafsiri ya Kiswahili iliyo wazi na ya kawaida.
theological_decisions:
- issue: Lugha inayofanana na wongofu katika στραφῆτε
  choice: geuka
  alternative: geuzwa; ongoka
  rationale: “Geuka” huhifadhi wito wa mabadiliko ya mwelekeo bila kuingiza istilahi ya kiufundi ya kimadhehebu. Tanbihi inaonyesha kwamba umbo la Kigiriki linaweza pia kueleweka “kugeuzwa.”
- issue: Sifa zinazokusudiwa katika kulinganishwa na watoto
  choice: kama watoto
  alternative: kama watoto wanyenyekevu; kama watoto wasio na hatia
  rationale: Mstari huu hautaji wazi ni sifa zipi za watoto zinazolengwa. Tafsiri haipaswi kuamua jambo hilo kimafundisho kwa kuongeza sifa ambayo haipo katika matini.
- issue: Nguvu ya kanusho οὐ μή
  choice: hakika hamtaingia
  alternative: hamtaingia kamwe
  rationale: Chaguo kuu linaonyesha kwa wazi uhakika wa kanusho bila kubadili kauli kuwa ufafanuzi wa kitheolojia. Tanbihi inatoa njia nyingine ya kawaida ya kuonyesha msisitizo huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Kweli nawaambia” unahifadhi uzito wa kauli bila kutumia “Amina” kama neno lisilotafsiriwa. “Naye” huunganisha mstari na muktadha uliotangulia.
