  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: sw
  text: “Kweli nawaambia, chochote mtakachofunga duniani kitakuwa kimefungwa mbinguni, na chochote mtakachofungua duniani kitakuwa kimefunguliwa mbinguni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kimapokeo zaidi, “kitafungwa mbinguni ... kitafunguliwa mbinguni.” Muundo wa Kigiriki unaweza kutafsiriwa hivyo, lakini maneno yaliyotumiwa hapa yanaakisi kitenzi cha wakati ujao pamoja na kitenzi-kivumishi cha wakati timilifu katika hali ya kutendwa, ambacho kinaweza kuonyesha hali iliyokwisha kuwekwa mbinguni.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Katika nafasi hii neno hilo linaanzisha tamko zito lenye mamlaka. “Kweli” huwasilisha maana hiyo kwa Kiswahili cha kawaida na chenye hadhi kuliko kuacha “Amina” kama neno la ibada.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaodumisha nafsi ya kwanza, wingi wa wanaoambiwa, na uzito wa tamko.
- source_word: ὅσα ἐὰν
  choice: chochote mtakacho-
  rationale: Muundo huu wa Kiswahili unaonyesha sharti la jumla lisilo na kikomo maalumu. Umoja wa ngeli ya KI hutumiwa kwa maana ya jumla bila kubadili upeo wa wingi wa Kigiriki.
- source_word: δήσητε
  choice: mtakachofunga
  rationale: “Kufunga” huhifadhi sitiari ya msingi ya δέω na haipunguzi maana yake mapema kuwa “kukataza” pekee.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Ni usemi wa kawaida wa Kiswahili unaotofautisha eneo la duniani na la mbinguni.
- source_word: ἔσται δεδεμένα
  choice: kitakuwa kimefungwa
  rationale: Muundo wa “kitakuwa kimefungwa” huonyesha hali ya wakati ujao inayotokana na tendo lililokwisha kufanyika, na hivyo huakisi ἔσται pamoja na kitenzi-shirikishi timilifu cha kutendwa.
- source_word: ἐν οὐρανῷ
  choice: mbinguni
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja eneo la kimungu linalokusudiwa hapa.
- source_word: λύσητε
  choice: mtakachofungua
  rationale: “Kufungua” hudumisha ulinganifu wa kisitiari na “kufunga” na huepuka kuamua mapema kwamba maana ni “kuruhusu” pekee.
- source_word: ἔσται λελυμένα
  choice: kitakuwa kimefunguliwa
  rationale: Muundo huu unalingana na “kitakuwa kimefungwa” na huwakilisha hali ya wakati ujao iliyo na matokeo ya tendo lililokamilika.
theological_decisions:
- issue: Nguvu ya wakati na maana ya kitheolojia katika kauli ya kufunga na kufungua
  choice: kitakuwa kimefungwa/kimefunguliwa mbinguni
  alternative: kitafungwa/kitafunguliwa mbinguni
  rationale: Muundo wa Kigiriki ἔσται pamoja na kitenzi-shirikishi timilifu cha kutendwa unaweza kuonyesha hali itakayokuwapo kutokana na tendo lililotangulia. Tafsiri iliyochaguliwa huhifadhi uwezekano kwamba uamuzi wa duniani unalingana na hali iliyokwisha kuwekwa mbinguni, bila kulazimisha nadharia fulani ya kimadhehebu kuhusu mamlaka ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Jozi “kufunga/kufungua” imehifadhiwa ili kudumisha sitiari na upana wa maana wa maneno ya Kigiriki. Muundo “kitakuwa kime-” ni rasmi kidogo lakini unaeleweka na unahitajika ili kuonyesha kwa usahihi zaidi hali timilifu ya wakati ujao.
