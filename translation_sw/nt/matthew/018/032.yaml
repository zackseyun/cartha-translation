  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: sw
  text: Ndipo bwana wake akamwita na kumwambia, “Mtumwa mwovu[b], nilikusamehe deni lile lote[a] kwa sababu ulinisihi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikufutia deni lile lote.” Kitenzi cha Kigiriki kinaweza kumaanisha kufuta au kuondolea deni, na pia kusamehe.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumishi.” Neno la Kigiriki δοῦλος linaweza kumaanisha mtumishi au mtumwa; hapa “mtumwa” limetumiwa kwa sababu uhusiano wake wa kuwa chini ya mamlaka ya bwana ni muhimu katika mfano huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa simulizi kwa njia ya asili na kuonyesha kwamba jambo hili lilifuata yaliyotangulia.
- source_word: προσκαλεσάμενος
  choice: akamwita
  rationale: Kitenzi kina maana ya kumwita mtu aje mbele yake; katika muktadha huu mamlaka ya bwana inaeleweka bila kulazimisha neno zito lisilo la lazima.
- source_word: ὁ κύριος αὐτοῦ
  choice: bwana wake
  rationale: Hapa κύριος humtaja mwenye mamlaka juu ya mtumwa katika mfano, si cheo cha kimungu.
- source_word: λέγει αὐτῷ
  choice: na kumwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa namna ya kawaida ya kusimulia kwa Kiswahili, huku uhusiano na kitendo cha kumwita ukihifadhiwa.
- source_word: Δοῦλε
  choice: mtumwa
  rationale: δοῦλος hapa humaanisha mtu aliye chini ya umiliki na mamlaka ya bwana; hali hiyo ya utegemezi ni muhimu katika mfano huu.
- source_word: πονηρέ
  choice: mwovu
  rationale: Neno hili ni hukumu ya maadili juu ya tabia ya mtumwa; “mwovu” ni la sasa, wazi, na lenye uzito unaofaa.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: deni lile lote
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unaonyesha wazi kwamba deni zima lilihusika.
- source_word: ἀφῆκά σοι
  choice: nilikusamehe
  rationale: Katika muktadha wa deni kitenzi kinaweza kumaanisha kufuta au kuondolea deni, lakini “nilikusamehe” huhifadhi pia mwangwi wa msamaha ambao ni muhimu katika Mathayo.
- source_word: ἐπεὶ
  choice: kwa sababu
  rationale: Huonyesha sababu ya kitendo cha bwana kwa uwazi katika Kiswahili cha kawaida.
- source_word: παρεκάλεσάς με
  choice: ulinisihi
  rationale: “Ulinisihi” huonyesha ombi la dhati na la unyenyekevu bila kuongeza maana isiyokuwamo katika Kigiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri δοῦλος katika uhusiano wa bwana na mtumwa ndani ya mfano
  choice: mtumwa
  alternative: mtumishi
  rationale: Uhusiano wa kisheria na wa mamlaka kati ya mtu huyu na bwana wake ni sehemu muhimu ya nguvu ya mfano. “Mtumwa” huonyesha hali hiyo wazi zaidi kuliko “mtumishi,” bila kuingiza fundisho la dhehebu.
- issue: Jinsi ya kutafsiri ἀφίημι katika muktadha wa deni
  choice: nilikusamehe
  alternative: nilikufutia deni
  rationale: Maana ya moja kwa moja ni kuondoa deni, lakini msamiati huo pia unaunganisha picha ya deni na msamaha wa kimaadili na kiroho katika Mathayo. Tafsiri kuu huhifadhi mvutano huo, na tanbihi hutoa maana ya kifedha iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida wa simulizi; “bwana wake” inaonyesha uhusiano wa kijamii katika mfano, na “ulinisihi” huwasilisha uzito wa ombi bila kuwa ya kizamani.
