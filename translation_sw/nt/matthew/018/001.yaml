id: MAT.18.1
reference: Matthew 18:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: sw
  text: Wakati huo wanafunzi walimwendea Yesu, wakisema, “Basi, ni nani aliye mkuu zaidi katika ufalme wa mbinguni?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Wakati huo
  rationale: Usemi wa kawaida na wa moja kwa moja unaowasilisha wakati unaorejelewa bila kufanya Kiswahili kuwa kizito.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: walimwendea Yesu
  rationale: Kitenzi kinaonyesha kuja au kumkaribia mtu; “walimwendea” ni cha asili katika muktadha huu.
- source_word: λέγοντες
  choice: na kumuuliza
  rationale: Ingawa maana ya msingi ni “wakisema,” maneno yanayofuata ni swali la moja kwa moja; “kumuuliza” huwasilisha tendo hilo kwa Kiswahili cha asili bila kubadili yaliyosemwa.
- source_word: Τίς ἄρα
  choice: Basi, ni nani
  rationale: “Basi” linawakilisha nguvu ya kimantiki ya ἄρα, yaani hitimisho au swali linalotokana na muktadha.
- source_word: μείζων
  choice: aliye mkuu zaidi
  rationale: Ni umbo la kulinganisha, “greater,” si kwa lazima umbo la kilele “greatest”; “mkuu zaidi” huhifadhi hali hiyo huku likisikika kawaida katika swali la Kiswahili.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida wa Mathayo; “ufalme wa mbinguni” ni tafsiri iliyo wazi na yenye hadhi.
theological_decisions:
- issue: Kulinganisha hadhi katika ufalme
  choice: aliye mkuu zaidi
  alternative: aliye mkuu kuliko wote
  rationale: Nakala ya Kigiriki ina μίζων, umbo la kulinganisha. Tafsiri haibadili kimyakimya kuwa umbo la kilele, hivyo inadumisha mvutano na upeo wa swali la wanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Hakuna alama za tanbihi zinazohitajika.
