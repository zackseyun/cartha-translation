  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: sw
  text: Kisha Petro akamwambia, “Bwana, ndugu yangu atanikosea mara ngapi, nami nitamsamehe? Hata mara saba?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Petro akamkaribia na kusema
  rationale: Muundo huu wa mfululizo unaonyesha kwa kawaida kwamba Petro alimkaribia Yesu kabla ya kusema; “kusema” hudumisha kitenzi cha jumla cha usemi cha Kigiriki.
- source_word: Κύριε
  choice: Bwana
  rationale: Neno la kawaida la heshima kwa κύριος linapomwelekea Yesu, huku likihifadhi pia uzito wake wa kitheolojia.
- source_word: ποσάκις
  choice: mara ngapi
  rationale: Huuliza idadi ya matukio na kuandaa jibu linalopendekezwa la “mara saba.”
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: akinikosea
  rationale: Katika uhusiano wa watu, “kunikosea” ni Kiswahili cha asili kinachoeleza dhambi au kosa linaloelekezwa dhidi ya msemaji; muundo wa masharti huwasilisha hali inayorudiwa kwa ufasaha kuliko wakati ujao wa moja kwa moja.
- source_word: ὁ ἀδελφός μου
  choice: ndugu yangu
  rationale: “Ndugu” ndilo neno la kawaida la Kiswahili linaloweza kumaanisha ndugu wa kiume au mshiriki wa jumuiya; tanbihi huhifadhi kwamba Kigiriki kina umoja wa kiume.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: nimsamehe
  rationale: Kitenzi “kusamehe” kinafaa katika muktadha wa kosa; tegemezi “ni-” huunda swali la kawaida la Kiswahili kuhusu wajibu au kitendo kinachotarajiwa.
- source_word: ἕως ἑπτάκις
  choice: Hata mara saba?
  rationale: “Hata” kwa kawaida huonyesha kiwango cha juu kinachopendekezwa na Petro, bila kudokeza kwamba mara saba tayari zimefikiwa.
theological_decisions:
- issue: Upeo wa ἀδελφός katika muktadha
  choice: Neno “ndugu yangu” limetumiwa katika maandishi makuu.
  alternative: ndugu yangu wa kiume; mwanafunzi mwenzangu
  rationale: Kigiriki ni umoja wa kiume, lakini katika muktadha kinaweza kumaanisha kwa upana mwanafunzi mwenzake. Kiswahili “ndugu” hudumisha maana ya uhusiano wa karibu bila kulazimisha jinsia, na tanbihi inaeleza umbo la chanzo.
- issue: Uhusiano wa vitenzi ἁμαρτήσει na ἀφήσω
  choice: “akinikosea, nimsamehe”
  alternative: “atanikosea, nami nitamsamehe”
  rationale: Kigiriki hutumia vitenzi vya wakati ujao, lakini maana yake hapa ni hali inayoweza kurudiwa na swali kuhusu kiwango cha kusamehe. Muundo wa Kiswahili uliochaguliwa ni wa asili na hauondoi mvutano kati ya kosa na wajibu wa kusamehe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa wa asili kwa usemi wa Kiswahili, huku swali la Petro na kikomo anachopendekeza vikihifadhiwa.
