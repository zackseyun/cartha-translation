base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: sw
  text: Na ikitokea kwamba amempata[a], kweli nawaambia, anamfurahia huyo kuliko wale tisini na tisa ambao hawajapotea njia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo rasmi zaidi, “ikiwa itatukia kwamba amempata.”
    reason: lexical_alternative
  - marker: b
    text: Au “ambao hawakutangatanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kimehifadhiwa ili kuendeleza mtiririko wa mfano wa Yesu.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: ikitokea akampata
  rationale: Muundo huu unaonyesha uwezekano wa jambo kutukia, si tu tendo la kumpata. Kiswahili hiki kinahifadhi wazo la tukio lenye masharti bila kuwa kizito kupita kiasi.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: kweli nawaambia
  rationale: Hii ni kauli nzito ya uthibitisho katika maneno ya Yesu. ‘Kweli nawaambia’ ni ya kawaida, yenye heshima, na ina nguvu ya msisitizo wa ἀμήν.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: anamfurahia huyo
  rationale: χαίρω huonyesha furaha. Kiwakilishi cha ngeli ya viumbe hai kimetumiwa kwa kondoo, na ‘anamfurahia’ huonyesha wazi anayelengwa na furaha hiyo.
- source_word: μᾶλλον ἢ
  choice: kuliko
  rationale: Muundo wa ulinganisho umetafsiriwa moja kwa moja bila kuugeuza kuwa uchaguzi unaowatenga wale tisini na tisa.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: wale tisini na tisa
  rationale: Neno ‘kondoo’ linaeleweka kutokana na muktadha na halijarudiwa katika Kigiriki; kiwakilishi ‘wale’ kinadumisha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: ambao hawajapotea
  rationale: Kauli hii inawataja wale ambao hawajatoka njia na kubaki katika hali ya kupotea. ‘Hawajapotea’ ni ya asili katika Kiswahili na inafaa kwa picha ya kondoo.
theological_decisions:
- issue: Nguvu ya ulinganisho wa furaha ya mchungaji
  choice: Mchungaji anamfurahia kondoo aliyepatikana kuliko wale tisini na tisa ambao hawajapotea.
  alternative: Kulainisha ulinganisho ili usionekane kama upendeleo, au kuudokeza kuwa wale tisini na tisa wana thamani ndogo.
  rationale: Kigiriki μᾶλλον ἢ kinaweka ulinganisho halisi. Tafsiri inadumisha mvutano wa kauli bila kudai kwamba mchungaji hawajali wale tisini na tisa au kwamba wao wana thamani ndogo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Huyo’ na viambishi vya ngeli ya viumbe hai vinarejelea kondoo mmoja kwa namna ya asili katika Kiswahili.
