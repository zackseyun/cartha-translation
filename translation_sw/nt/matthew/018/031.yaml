  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: sw
  text: Basi watumwa wenzake[a] walipoona yaliyotokea, walihuzunika sana; wakamwendea bwana wao[b] na kumweleza yote yaliyotokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wenzake.” Neno la Kigiriki σύνδουλοι kihalisi humaanisha watumwa au watumishi walio chini ya bwana mmoja; hapa “watumwa” limetumiwa kwa sababu hali yao ya kuwa chini ya bwana huyo ni muhimu katika mfano.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkuu wao.” Neno la Kigiriki κύριος linaweza kutafsiriwa “bwana” au “mkuu” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wenye matokeo kutoka katika tendo lililotangulia; “Basi” ni kiunganishi cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: σύνδουλοι
  choice: watumwa wenzake
  rationale: Neno hili linamaanisha watu wenye hali moja ya utumwa chini ya bwana yuleyule. “Watumwa wenzake” huhifadhi wazi uhusiano huo muhimu katika mfano huu.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: yaliyotokea / yote yaliyotokea
  rationale: Hii ni tafsiri ya kawaida ya kirai cha Kigiriki kinachorejelea matukio. Katika mara ya pili, πάντα imehifadhiwa kwa “yote.”
- source_word: ἐλυπήθησαν σφόδρα
  choice: walihuzunika sana
  rationale: Kitenzi kinaonyesha huzuni au masikitiko, na σφόδρα hukazia kiwango chake; “walihuzunika sana” ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: ἐλθόντες
  choice: wakamwendea
  rationale: Kirai hiki hutangulia tendo kuu na kuonyesha kuwa walienda walikokuwa bwana wao. “Wakamwendea” huwasilisha mfuatano huo kwa Kiswahili cha simulizi.
- source_word: διεσάφησαν
  choice: kumweleza
  rationale: Kitenzi hiki kina maana ya kutoa taarifa au kueleza kwa wazi. “Kumweleza” kinafaa katika muktadha, huku ukamilifu wa taarifa ukionyeshwa na “yote.”
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: bwana wao
  rationale: κύριος hapa ni mkuu wa kibinadamu katika mfano. “Bwana wao” ni tafsiri ya moja kwa moja na ya kawaida isiyodokeza kuwa anatajwa Mungu moja kwa moja.
theological_decisions:
- issue: Tafsiri ya neno la jamii ya δοῦλος katika mazingira ya kijamii ya mfano
  choice: watumwa wenzake
  alternative: watumishi wenzao
  rationale: σύνδουλοι huonyesha wazi hali ya pamoja ya kuwa watumwa chini ya bwana mmoja. Kwa kuwa hali hiyo ni muhimu kwa mantiki ya mfano, “watumwa” imechaguliwa badala ya kuipunguza kuwa “watumishi.”
- issue: Tafsiri ya κύριος inapomtaja mkuu wa kibinadamu
  choice: bwana wao
  alternative: mkuu wao
  rationale: Katika muktadha huu κύριος humtaja mwenye mamlaka juu ya watumwa katika mfano. Herufi ndogo na muktadha huonyesha kuwa hapa si jina la cheo la Mungu, huku “bwana” ikihifadhi uhusiano wa mamlaka uliomo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “walipoona … walihuzunika … wakamwendea” unaendeleza simulizi kwa urahisi, na alama ya nusu-koloni inatenganisha kuona na kuhuzunika na tendo lao la kwenda kutoa taarifa.
