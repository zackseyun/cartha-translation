id: MAT.18.25
reference: Matthew 18:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: sw
  text: Lakini kwa kuwa hakuwa na cha kulipa, bwana wake[a] akaamuru auzwe pamoja na mke wake, watoto wake na kila kitu alichokuwa nacho[b], na malipo yafanywe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mkuu wa mtumishi katika mfano huu. Neno la Kigiriki κύριος linaweza kumaanisha “bwana” au “mkuu” kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, yeye na familia yake wangeuzwa, na mali zake pia zingeuzwa, ili malipo ya deni yapatikane.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Lakini kwa kuwa hakuwa na cha kulipa
  rationale: 'Muundo wa genitivi huru unaeleza sababu au hali: hakuwa na uwezo au mali ya kutosha kulipa deni. ‘Hakuwa na cha kulipa’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kudai kwamba hakuwa na mali yoyote kabisa.'
- source_word: ὁ κύριος
  choice: bwana wake
  rationale: Katika muktadha wa mfano, κύριος ni mkuu wa kibinadamu wa mtumishi, si jina la moja kwa moja la Mungu. ‘Bwana wake’ ni ya asili katika Kiswahili na huonyesha uhusiano unaoeleweka katika muktadha, ingawa Kigiriki kina kibainishi wala si kimilikishi wazi.
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: κελεύω humaanisha kutoa agizo lenye mamlaka; ‘akaamuru’ ni fasaha na inafaa muktadha wa simulizi.
- source_word: πραθῆναι
  choice: auzwe
  rationale: Kitenzi cha kutendwa kutoka πιπράσκω humaanisha kwamba mdaiwa angeuzwa. ‘Auzwe’ huhifadhi kwa ufupi agizo hilo.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: pamoja na mke wake, watoto wake
  rationale: Vibainishi vya Kigiriki vinarejelea jamaa za mdaiwa; viwakilishi milikishi ni vya kawaida na wazi katika Kiswahili.
- source_word: πάντα ὅσα ἔχει
  choice: kila kitu alichokuwa nacho
  rationale: Hii huwasilisha jumla ya mali zake kwa Kiswahili cha kawaida bila kuifanya kuwa istilahi maalumu ya kisheria.
- source_word: καὶ ἀποδοθῆναι
  choice: na malipo yafanywe
  rationale: Kitenzi cha kutendwa kinarudia wazo la kulipa deni. Tafsiri hii haiongezi neno ‘deni’ ambalo limeachwa likieleweka katika Kigiriki.
theological_decisions:
- issue: Maana ya κύριος ndani ya mfano
  choice: bwana wake
  alternative: yule bwana; mkuu wake
  rationale: Neno hapa linamtaja mwenye mamlaka juu ya mtumishi katika simulizi. Herufi ndogo na muktadha huepusha kulifanya jina la moja kwa moja la Mungu, huku ‘bwana’ ikihifadhi upana wa maana ya κύριος.
- issue: Hali ya mdaiwa katika μὴ ἔχοντος ... ἀποδοῦναι
  choice: hakuwa na cha kulipa
  alternative: hakuwa na uwezo wa kulipa
  rationale: Chaguo hili huhifadhi taswira halisi ya kutokuwa na kitu cha kutolea malipo, lakini halifungi maana kwa kutokuwa na fedha pekee. Njia mbadala inaeleza maana kwa ujumla zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida na hadhi inayofaa maandiko. Muundo ‘auzwe pamoja na’ huhifadhi agizo la kuuza mdaiwa, familia yake na mali yake bila kuongeza maelezo yasiyokuwapo katika mstari.
