  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: sw
  text: Vivyo hivyo, si mapenzi ya Baba yenu aliye mbinguni kwamba hata mmoja wa wadogo hawa aangamie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “apotee.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuangamia” au “kupotea”; muktadha wa karibu wa kondoo aliyepotea unaunga mkono maana hii ya pili.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Huunganisha kauli hii na mfano uliotangulia na kuonyesha wazi ulinganisho wake kwa Kiswahili cha kawaida.
- source_word: θέλημα
  choice: mapenzi
  rationale: Ni neno la kawaida na lenye heshima kwa kusudi au jambo analolitaka mtu katika muktadha huu.
- source_word: ἔμπροσθεν τοῦ πατρός
  choice: ya Baba
  rationale: Ingawa ἔμπροσθεν kwa msingi humaanisha ‘mbele ya,’ katika muundo huu inaeleza jambo lililo mapenzi machoni pa Baba; ‘mapenzi ya Baba’ ni Kiswahili cha asili kisichobadili maana.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Baba yenu aliye mbinguni
  rationale: Huhifadhi nafsi ya pili wingi na maelezo ya mahali kwa lugha ya sasa, ya wazi na yenye heshima.
- source_word: ἵνα ἀπόληται
  choice: kwamba ... aangamie
  rationale: ἀπόλλυμι inaweza kumaanisha kuangamia au kupotea. ‘Aangamie’ hudumisha uzito wa matokeo mabaya, huku maana ya ‘apotee’ ikihifadhiwa katika tanbihi kutokana na mfano wa kondoo aliyepotea.
- source_word: ἓν
  choice: hata mmoja
  rationale: ‘Hata’ huonyesha mkazo wa muktadha kwamba si mmoja hata kidogo, bila kubadili rejeo la umoja.
- source_word: τῶν μικρῶν τούτων
  choice: wa hawa walio wadogo
  rationale: Haifungi maana kwa watoto wadogo pekee; huhifadhi uwezekano kwamba kauli inawahusu walio wadogo au wasio na cheo miongoni mwa wanafunzi.
theological_decisions:
- issue: Maana ya ἀπόληται kwa kuhusiana na mfano wa kondoo aliyepotea
  choice: aangamie
  alternative: apotee
  rationale: Kitenzi kinaweza kuashiria maangamizi au kupotea/kupotezwa. Matini kuu hudumisha uzito wa onyo kwa ‘aangamie,’ na tanbihi huhifadhi mwangwi wa kondoo aliyepotea bila kutatua kimya kimya mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa kawaida, huku ukihifadhi uhusiano na mfano uliotangulia na kuepuka kueleza ‘walio wadogo’ kuwa watoto pekee.
