id: MAT.18.9
reference: Matthew 18:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: sw
  text: Na kama jicho lako linakufanya ujikwae[a], ling'oe na ulitupe mbali nawe. Ni afadhali kwako kuingia katika uzima ukiwa na jicho moja kuliko kuwa na macho mawili na kutupwa katika Gehena ya moto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “linakufanya utende dhambi.” Kitenzi cha Kigiriki kinaweza kumaanisha kusababisha mtu ajikwae, aanguke, au atende dhambi.
    reason: lexical_alternative
  - marker: b
    text: “Gehena” ni mahali pa hukumu ya mwisho; kwa kawaida hutafsiriwa “jehanamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: linakufanya ujikwae
  rationale: Huhifadhi taswira ya Kigiriki ya kusababisha mtu ajikwae au aanguke, huku muktadha ukiruhusu pia maana ya kuingia dhambini.
- source_word: ἔξελε
  choice: ling'oe
  rationale: Amri hii ni kali na ya haraka; ‘ng'oa’ huhifadhi taswira yenye nguvu ya kuondoa jicho kabisa.
- source_word: βάλε ἀπὸ σοῦ
  choice: ulitupe mbali nawe
  rationale: Hueleza kuondolewa kwa uamuzi na kutengwa kabisa na mtu.
- source_word: καλόν σοί ἐστιν
  choice: Ni afadhali kwako
  rationale: Katika ulinganisho huu, καλόν huonyesha jambo linalofaa au bora zaidi kuliko lile linalofuata.
- source_word: μονόφθαλμον
  choice: ukiwa na jicho moja
  rationale: Ni Kiswahili cha kawaida na wazi kwa maana ya kuwa mwenye jicho moja.
- source_word: εἰς τὴν ζωὴν
  choice: kuingia katika uzima
  rationale: Huhifadhi ‘uzima’ bila kuongeza kivumishi ‘wa milele,’ ambacho hakipo wazi katika Kigiriki.
- source_word: βληθῆναι
  choice: kutupwa
  rationale: Huhifadhi kauli tendwa na nguvu ya kitenzi βάλλω.
- source_word: γέενναν
  choice: Gehena
  rationale: Huhifadhi istilahi mahususi ya Kigiriki yenye historia ya Kiyahudi na maana ya hukumu ya mwisho, badala ya kuibadilisha moja kwa moja kuwa istilahi pana zaidi.
- source_word: τοῦ πυρός
  choice: ya moto
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuhifadhi taswira yake ya wazi.
theological_decisions:
- issue: Tafsiri ya γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: Maandishi yanatumia jina mahususi γέεννα. Kulihifadhi kama ‘Gehena’ huepuka kulifanya sawa moja kwa moja na istilahi pana ya kitheolojia, huku tanbihi ikifafanua maana yake.
- issue: Tafsiri ya εἰς τὴν ζωὴν
  choice: katika uzima
  alternative: katika uzima wa milele
  rationale: Ingawa muktadha unaelekea kwenye uzima wa wakati ujao, neno ‘wa milele’ halipo katika fungu hili; kutoliongeza huhifadhi mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; taswira kali ya aya na istilahi ‘Gehena’ zimehifadhiwa, huku tanbihi zikieleza utata wa kimsamiati.
