id: MAT.18.12
reference: Matthew 18:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: sw
  text: Mnaonaje? Ikiwa mtu ana kondoo mia moja, na mmoja wao akapotea njia[a], je, hatawaacha wale tisini na tisa milimani[b] na kwenda kumtafuta yule anayepotea njia[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatangatanga,” au “akapotoshwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kupotea njia, kutangatanga, au katika baadhi ya mazingira kupotoshwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye vilima.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu, “yule anayepotea njia”; kimapokeo, “yule aliyepotea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Mnaonaje?
  rationale: Ni swali la kawaida na la moja kwa moja linalowaalika wasikilizaji watoe uamuzi wao; umbo la wingi katika kitenzi linahifadhi ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Ikiwa mtu ana
  rationale: Muundo wa γίνομαι pamoja na hali ya kutoa hapa unaeleza kuwa na kitu. “Mtu” ni Kiswahili cha kawaida kwa ἄνθρωπος yenye matumizi ya kiujumla bila kulazimisha jinsia ya kiume isiyosisitizwa na muktadha.
- source_word: ἑκατὸν πρόβατα
  choice: kondoo mia moja
  rationale: Hili ni tamko la moja kwa moja na la kawaida la idadi na nomino katika Kiswahili.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: mmoja wao akapotea njia
  rationale: “Kupotea njia” huhifadhi wazo la kondoo kwenda kombo bila kuamua kama alijitenga mwenyewe au alipotoshwa na mwingine.
- source_word: οὐχὶ ἀφήσει
  choice: je, hatawaacha
  rationale: “Je” pamoja na umbo hasi la wakati ujao huonyesha kwamba swali linatarajia jibu la ndiyo. “Kuwaacha” haiongezi maana kali ya kuwatelekeza kabisa.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: wale tisini na tisa
  rationale: Kiwakilishi “wale” kinarejelea kwa kawaida kondoo waliotajwa tayari, na idadi imetolewa moja kwa moja.
- source_word: ἐπὶ τὰ ὄρη
  choice: milimani
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha mahali penye milima; inaweza pia kueleweka kuwa eneo la vilima kulingana na mazingira.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: aende kumtafuta
  rationale: Kishiriki πορευθείς na kitenzi ζητεῖ vimetolewa kwa mfuatano wa kusudi unaosikika kwa kawaida katika Kiswahili huku matendo yote mawili yakibaki wazi.
- source_word: τὸ πλανώμενον
  choice: yule anayepotea njia
  rationale: Umbo la wakati unaoendelea linahifadhi kishiriki cha sasa na kurudia mzizi wa maana uliotumiwa mapema, badala ya kubadilisha moja kwa moja kuwa “aliyepotea.”
theological_decisions:
- issue: Matumizi ya kiujumla ya ἀνθρώπῳ
  choice: mtu
  alternative: mwanamume
  rationale: ἄνθρωπος hapa humtaja mtu kwa ujumla katika mfano; “mtu” ni sawia na ya kawaida katika Kiswahili na haibadili mfano kuwa dai maalumu kuhusu jinsia.
- issue: Nuansi ya πλανάω katika mfano wa kondoo
  choice: akapotea njia / anayepotea njia
  alternative: akatangatanga mbali / akapotoshwa / aliyepotea
  rationale: Chaguo hili linahifadhi maana ya kwenda kombo na mwangwi wake wa kimafumbo bila kuamua kimya kimya kuhusu hatia, wakala wa nje, au hali ya kupotea kabisa.
- issue: Nguvu ya ἀφήσει
  choice: hatawaacha
  alternative: hatawatelekeza
  rationale: “Kuwaacha” inafaa kwa kuondoka kwa muda ili kumtafuta kondoo mwingine; “kuwatelekeza” kungeingiza maana kali zaidi isiyolazimishwa na kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Swali la mwanzo ni la moja kwa moja, na sentensi kuu imetungwa kwa mtiririko wa kawaida wa simulizi. Alama zote za tanbihi zimewekwa mara moja katika sehemu zinazohusika.
