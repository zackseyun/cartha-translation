  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: sw
  text: Kwa hiyo, yeyote anayejinyenyekeza kama mtoto huyu, huyo ndiye aliye mkuu zaidi katika ufalme wa mbinguni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: anayejinyenyekeza
  rationale: Kitenzi cha kujirejelea kinaonyesha mtu kujishusha au kujifanya mnyenyekevu; ‘kujinyenyekeza’ ni usemi wa kawaida, wenye heshima, unaodumisha maana hiyo.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: kama mtoto huyu
  rationale: Tafsiri ya moja kwa moja na ya asili inayohifadhi mfano mahsusi wa mtoto aliyekuwa mbele yao.
- source_word: ὁ μείζων
  choice: aliye mkuu zaidi
  rationale: Umbo la kulinganisha limetumika kwa maana ya cheo cha juu zaidi katika muktadha huu; ‘mkuu zaidi’ huhifadhi ulinganisho huo.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida wa Mathayo; ‘ufalme wa mbinguni’ ni wa asili katika Kiswahili na hauubadili kuwa maelezo ya mahali pekee.
theological_decisions:
- issue: Msisitizo wa kiwakilishi katika οὗτός ἐστιν
  choice: huyo ndiye aliye mkuu zaidi
  alternative: ndiye aliye mkuu zaidi
  rationale: ‘Huyo ndiye’ huhifadhi msisitizo wa Kigiriki na marudio ya mhusika bila kuongeza dai la kitheolojia.
- issue: Maana ya kujinyenyekeza kama mtoto
  choice: Imeachwa kama kauli ya Yesu bila kufafanua sifa mahususi ya mtoto
  alternative: anayekuwa mnyenyekevu kama mtoto huyu
  rationale: Andiko halielezi hapa ni sifa gani hasa ya mtoto inayokusudiwa; tafsiri haipaswi kuondoa mvutano huo kwa kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘huyo ndiye’ umetumiwa kudumisha msisitizo wa chanzo huku sentensi ikibaki wazi kwa msomaji wa kawaida.
