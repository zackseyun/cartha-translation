  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: sw
  text: Na yeyote anayempokea mtoto mmoja kama huyu kwa jina langu, ananipokea mimi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemkaribisha.” Kitenzi cha Kigiriki kinaweza kumaanisha “kupokea,” “kukaribisha,” au “kukubali.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mtoto mmoja kama huyu”; Kigiriki hakina kivumishi “mdogo” katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: yeyote anaye-
  rationale: 'Muundo huu wa Kiswahili unaonyesha sharti la jumla lisilomhusu mtu maalumu: mtu yeyote afanyaye jambo hilo.'
- source_word: δέξηται / δέχεται
  choice: anayempokea / ananipokea
  rationale: Kitenzi “kupokea” kinaweza kumaanisha kumpokea, kumkaribisha, au kumkubali mtu. Kurudia kitenzi kilekile kunahifadhi ulinganifu wa Kigiriki kati ya kumpokea mtoto na kumpokea Yesu.
- source_word: ἓν παιδίον τοιοῦτο
  choice: mtoto mmoja kama huyu
  rationale: Tafsiri hii inarejelea mtoto ambaye Yesu alikuwa amemweka mbele yao, bila kuongeza kivumishi “mdogo,” ambacho hakipo katika mstari huu wa Kigiriki.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Usemi huu wa kawaida wa Kiswahili unadumisha maana ya kufanya jambo kwa kurejelea jina, mamlaka, au uhusiano na Yesu bila kuchagua maana moja pekee.
- source_word: ἐμὲ
  choice: mimi
  rationale: Kiwakilishi “mimi” baada ya kiambishi cha yambwa katika “ananipokea” kinahifadhi msisitizo wa kiwakilishi cha Kigiriki na kuonyesha wazi ulinganifu na Yesu mwenyewe.
theological_decisions:
- issue: Uwakilishi unaomtambulisha mtoto na Yesu
  choice: Kumpokea mtoto wa namna hii kwa jina la Yesu ni kumpokea Yesu mwenyewe.
  alternative: Kumpokea mtoto huyo ni njia tu ya kumheshimu Yesu.
  rationale: Kurudiwa kwa kitenzi δέχομαι na kubadilishwa kwa yambwa kutoka kwa mtoto hadi kwa “mimi” kunaonyesha uhusiano wa moja kwa moja wa kiuwakilishi. Tafsiri haipunguzi kauli hiyo wala kuongeza maana za kisakramenti au za kikanisa ambazo mstari hauzitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo “ananipokea mimi” unatumiwa kimakusudi kuhifadhi msisitizo wa ἐμὲ, ingawa “ananipokea” peke yake pia ni sahihi kisarufi.
