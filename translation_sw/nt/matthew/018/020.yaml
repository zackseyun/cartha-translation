  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: sw
  text: Kwa maana, mahali ambapo wawili au watatu wamekusanyika kwa jina langu, hapo mimi niko katikati yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: mahali
  rationale: Huanzisha kishazi cha mahali na kuhusiana kwa kawaida na ἐκεῖ, ‘hapo.’ ‘Mahali’ ni wazi na ya asili katika Kiswahili.
- source_word: γάρ
  choice: kwa maana
  rationale: Huhifadhi uhusiano wa maelezo na muktadha uliotangulia bila kuufanya kuwa sababu yenye nguvu kuliko Kigiriki kinavyodai.
- source_word: δύο ἢ τρεῖς
  choice: wawili au watatu
  rationale: Ni uhamishaji wa moja kwa moja wa hesabu, huku upatanisho wa ngeli ukiwa wa watu.
- source_word: συνηγμένοι
  choice: wamekusanyika
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali inayotokana na kukusanyika. Ingawa umbo la Kigiriki ni timilifu tendwa, Kiswahili hakihitaji kulazimisha utendaji wa nje usiotajwa.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: kwa jina langu
  rationale: Ni nahau ya kawaida ya Kiswahili inayoacha wazi mkusanyiko wenye kumrejelea Yesu, mamlaka yake, au uaminifu kwake, bila kuibana kwa tafsiri moja tu.
- source_word: ἐκεῖ
  choice: hapo
  rationale: Hulingana na ‘mahali’ na kuhifadhi muundo wa Kigiriki, ‘mahali ... hapo.’
- source_word: εἰμι
  choice: mimi niko
  rationale: Huhifadhi usemi wa moja kwa moja wa kuwapo. Kiwakilishi ‘mimi’ kinawakilisha mkazo wa ἐγώ ulio ndani ya umbo la kitenzi εἰμι na hufanya sentensi iwe ya asili.
- source_word: ἐν μέσῳ αὐτῶν
  choice: katikati yao
  rationale: Huhifadhi taswira ya mahali ya Kigiriki na ni usemi wa kawaida, wazi, na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Maana ya kikristo ya kuwapo kwa Yesu kati ya wanafunzi waliokusanyika
  choice: Kauli imetafsiriwa moja kwa moja kuwa ‘mimi niko katikati yao,’ bila kufafanua namna ya kuwapo huko.
  alternative: ‘Mimi nipo pamoja nao,’ au tafsiri inayohusisha kauli hiyo moja kwa moja na fundisho maalumu la kisakramenti au la kikanisa.
  rationale: Aya inathibitisha kuwapo kwa Yesu, lakini haielezi hali ya kimetafizikia ya kuwapo huko. Tafsiri inadumisha dai hilo bila kuingiza itikadi ya dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wamekusanyika’ na ‘katikati yao’ vinaeleweka kwa wasomaji wa kawaida huku vikibaki karibu na muundo na taswira ya Kigiriki.
