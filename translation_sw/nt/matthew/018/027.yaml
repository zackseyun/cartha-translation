  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: sw
  text: Basi bwana[a] wa mtumwa huyo akamhurumia, akamwachilia, na akamsamehe deni[b] hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, bwana wa kibinadamu wa mtumwa katika mfano huu; hapa “bwana” halimtaji Mungu moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkopo”; neno la Kigiriki linamaanisha hasa mkopo au kitu kilichotolewa kwa mkopo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: akamhurumia
  rationale: Kitenzi hiki kinaonyesha huruma ya ndani na yenye nguvu. “Akamhurumia” ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha hisia hiyo bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi na kuonyesha hatua inayofuata. “Basi” linafaa katika mtiririko wa mfano huu kuliko tafsiri ya kimitambo ya “lakini.”
- source_word: κύριος
  choice: bwana
  rationale: Katika muktadha huu neno linamtaja bwana wa kibinadamu wa mtumwa katika mfano. Herufi ndogo na tanbihi huzuia lisieleweke moja kwa moja kama cheo cha Mungu.
- source_word: δοῦλου
  choice: mtumwa
  rationale: “Mtumwa” linahifadhi wazi hali ya utegemezi na mamlaka iliyomo katika δοῦλος; “mtumishi” lingeweza kulainisha mno uhusiano huo.
- source_word: ἀπέλυσεν αὐτόν
  choice: akamwachilia
  rationale: ἀπολύω hapa ni kumruhusu aende na kumwondoa katika hali ya kushikiliwa kwa sababu ya deni. “Akamwachilia” ni ya asili na haidai kwamba utumwa wake wenyewe ulikomeshwa.
- source_word: τὸ δάνειον
  choice: deni hilo
  rationale: Ingawa δάνειον kihalisia ni mkopo au kitu kilichokopeshwa, katika muktadha wa kusamehewa wajibu wa kulipa, “deni hilo” ndilo tamko la kawaida na wazi kwa msomaji wa Kiswahili. Tanbihi inadumisha maana mahususi ya mkopo.
- source_word: ἀφῆκεν αὐτῷ
  choice: kumsamehe
  rationale: ἀφίημι inaweza kumaanisha kuachilia, kufuta, au kusamehe. Pamoja na “deni,” “kumsamehe deni” linaeleza kwa kawaida kwamba wajibu wa kulipa ulifutwa na pia linahifadhi mwangwi wa msamaha katika Mathayo.
theological_decisions:
- issue: Uwezekano wa kuelewa κύριος kama cheo cha Mungu
  choice: “bwana” kwa herufi ndogo, akimaanisha bwana wa kibinadamu katika mfano
  alternative: “Bwana” kama cheo cha Mungu, au “mkuu”
  rationale: Mhusika wa moja kwa moja katika simulizi ni bwana wa mtumwa. Tafsiri haipaswi kugeuza kwa siri mhusika huyo kuwa Mungu, ingawa maana pana ya mfano inaweza kuonyesha ulinganisho wa kitheolojia.
- issue: Kuwasilisha hadhi ya δοῦλος kwa uwazi
  choice: mtumwa
  alternative: mtumishi
  rationale: Uhusiano wa mamlaka na utegemezi ni muhimu katika mfano huu wa deni kubwa. “Mtumwa” huhifadhi uzito wa kijamii wa neno la Kigiriki bila kuuficha.
- issue: Uhusiano kati ya mkopo na deni katika τὸ δάνειον
  choice: deni hilo katika matini, huku “mkopo” ukitajwa katika tanbihi
  alternative: mkopo huo
  rationale: Neno la Kigiriki linataja hasa mkopo, lakini hapa jambo linalosamehewa ni wajibu unaotokana nao. “Deni” ni la asili katika Kiswahili na tanbihi inalinda umahususi wa neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi inadumisha mwendo wa simulizi; “akamhurumia, akamwachilia, na kumsamehe” ni mfuatano wa kawaida unaohifadhi matendo matatu ya Kigiriki. Hakuna istilahi ya dhehebu iliyoingizwa.
