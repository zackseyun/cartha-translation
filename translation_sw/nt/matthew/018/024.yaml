base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: sw
  text: Alipoanza kufanya hesabu, aliletewa mdaiwa mmoja aliyekuwa na deni la talanta elfu kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo cha zamani cha fedha chenye thamani kubwa sana; katika mfano huu, “talanta elfu kumi” ni deni kubwa mno lisiloweza kulipika.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Alipoanza
  rationale: Muundo huu unaonyesha wakati au mazingira ya tendo kuu. “Alipoanza” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuamua kwamba tendo la kuhesabu lilikuwa limekamilika.
- source_word: συναίρειν
  choice: kufanya hesabu
  rationale: Katika muktadha huu wa madeni, kitenzi kinamaanisha kupitia na kusawazisha hesabu. “Kufanya hesabu” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili.
- source_word: προσηνέχθη αὐτῷ
  choice: aliletewa
  rationale: Kauli tendwa ya Kigiriki inaonyesha kwamba wengine walimleta mdaiwa huyo kwake. “Aliletewa” huhifadhi kauli hiyo na dative αὐτῷ kwa ufupi na kwa ufasaha.
- source_word: εἷς ὀφειλέτης
  choice: mdaiwa mmoja
  rationale: “Mmoja” huhifadhi wazi namba εἷς, huku “mdaiwa” ikitoa maana ya mtu mwenye deni.
- source_word: μυρίων ταλάντων
  choice: talanta elfu kumi
  rationale: μύριοι hapa inataja elfu kumi, na talanta imehifadhiwa kama kipimo cha kihistoria badala ya kubadilishwa kuwa fedha za kisasa zenye thamani isiyo hakika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku ikihifadhi kauli tendwa, namba iliyo wazi, na taswira ya kihistoria ya deni.
