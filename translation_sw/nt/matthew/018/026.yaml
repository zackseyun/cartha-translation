  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: sw
  text: Basi yule mtumwa akaanguka chini na kumsujudia[a], akisema, “Uwe na subira nami, nami nitakulipa yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akainama mbele yake.” Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “akamwabudu” katika miktadha mingine, lakini hapa kinaonyesha kujitupa chini kwa heshima mbele ya bwana wa kibinadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: akaanguka chini
  rationale: Kitenzi hiki kinaonyesha tendo halisi la kuanguka chini, likitangulia kujinyenyekeza na ombi la mtumwa.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha tendo la mtumwa na hukumu iliyotangulia kama matokeo yake, kwa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika mfano huu, hali ya kuwa chini ya mamlaka kamili ya bwana na wajibu mkubwa wa deni ni muhimu; kwa hiyo ‘mtumwa’ linaakisi hali hiyo kuliko ‘mtumishi’.
- source_word: προσεκύνει
  choice: kumsujudia
  rationale: Katika muktadha huu neno linaonyesha kujitupa chini kwa heshima na unyenyekevu mbele ya bwana wa kibinadamu. ‘Kumsujudia’ huhifadhi tendo hilo, huku tanbihi ikizuia lisieleweke lazima kuwa ibada ya kidini.
- source_word: λέγων
  choice: akisema
  rationale: Kirai hiki kinatanguliza moja kwa moja maneno ya ombi la mtumwa.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Nivumilie
  rationale: Ombi ni la bwana kuwa na subira na kuahirisha hatua dhidi yake; ‘Nivumilie’ ni ombi fupi na la kawaida katika Kiswahili.
- source_word: πάντα
  choice: yote
  rationale: Neno hili linarejelea kwa ujumla kiasi chote anachodaiwa katika muktadha wa deni.
- source_word: ἀποδώσω σοι
  choice: nitakulipa
  rationale: Katika muktadha wa deni, kitenzi kinamaanisha kumrudishia mdai kile anachodaiwa; ‘nitakulipa’ ni usemi wa kawaida na wazi.
theological_decisions:
- issue: Maana ya προσκυνέω inapomlenga bwana wa kibinadamu
  choice: Imetafsiriwa kuwa tendo la kusujudu kwa heshima na unyenyekevu
  alternative: akamwabudu
  rationale: Ndani ya mfano, tendo hili linaeleweka kwanza kama kujinyenyekeza mbele ya mfalme au bwana wa kibinadamu. ‘Akamwabudu’ lingeweza kulazimisha maana ya ibada ya kidini ambayo muktadha haulazimishi, lakini tanbihi inahifadhi upana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfululizo wa matendo katika Kigiriki na kutumia ‘mtumwa’ ili kuonyesha wazi hali ya kijamii inayohusika.
