base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: sw
  text: Lakini yeye hakutaka[a]. Badala yake, akaondoka, akamtupa gerezani[b] mpaka atakapolipa kile alichodaiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alikataa”; Kigiriki kihalisi ni “hakutaka.”
    reason: lexical_alternative
  - marker: b
    text: Au “akamtia gerezani”; kitenzi cha Kigiriki kina nguvu zaidi, kihalisi “akamtupa gerezani.”
    reason: lexical_alternative
  - marker: c
    text: Au “kiasi alichodaiwa” au “deni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini yeye
  rationale: Kifungu hiki kinamrejelea mtumishi wa kwanza na kuonyesha tofauti kati ya ombi la mwenzake na jibu lake. “Lakini yeye” ni wazi na ya kawaida katika Kiswahili.
- source_word: οὐκ ἤθελεν
  choice: hakutaka
  rationale: Kitenzi θέλω huonyesha nia au utashi. “Hakutaka” kinahifadhi maana hiyo bila kuongeza moja kwa moja wazo lenye nguvu zaidi la kukataa.
- source_word: ἀλλὰ
  choice: Badala yake
  rationale: Neno hili linaonyesha tofauti kali na ombi lililotangulia; “Badala yake” linaeleza kwa kawaida hatua iliyo kinyume na rehema iliyoombwa.
- source_word: ἀπελθὼν
  choice: akaondoka
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kitenzi kinachoendeleza mfuatano wa simulizi, huku kikihifadhi wazo la kuondoka.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: akamtupa gerezani
  rationale: “Akamtupa” kinahifadhi ukali wa βάλλω kuliko kauli isiyo na nguvu ya “akamtia gerezani,” na kinafaa katika muktadha wa tendo la kikatili.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Kiunganishi hiki kinaweka kikomo cha muda wa kifungo; “mpaka” ni sahihi na cha kawaida katika Kiswahili.
- source_word: ἀποδῷ
  choice: atakapolipa
  rationale: Muundo huu unaonyesha malipo yaliyotarajiwa kuwa kikomo cha kifungo. “Atakapolipa” unawasilisha uhusiano wa wakati na tendo linalotarajiwa bila kudai kwamba malipo hayo yalitokea.
- source_word: τὸ ὀφειλόμενον
  choice: kile alichodaiwa
  rationale: Kivumishi-partisipio hiki kimetumika kama nomino, yaani, “kitu kilichodaiwa.” Tafsiri hii inabaki karibu na usemi wa Kigiriki bila kuubana kuwa kiasi fulani au neno “deni” pekee.
