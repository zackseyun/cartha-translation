  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: sw
  text: Angalieni kwamba msimdharau mmoja wa hawa wadogo[a], kwa maana ninawaambia kwamba malaika wao walio mbinguni[b] daima huona uso wa Baba yangu aliye mbinguni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msimtazame kwa dharau mmoja wa hawa wadogo.” Usemi “hawa wadogo” unaweza kurejelea watoto na pia watu wanyenyekevu au wanaoonekana kuwa wadogo kwa hadhi.
    reason: lexical_alternative
  - marker: b
    text: “Malaika wao” huenda likamaanisha malaika wanaohusishwa na hawa wadogo au wanaowawakilisha; mstari huu peke yake hauamui kikamilifu fundisho la malaika walinzi binafsi.
    reason: alternative_reading
  - marker: c
    text: Kigiriki kina “katika mbingu” / “aliye katika mbingu”; “mbinguni” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Angalieni msimdharau
  rationale: 'Muundo huu unatoa onyo lenye nguvu: wawe macho ili wasimdharau yeyote. “Dharau” huhifadhi maana ya kumwona mtu kuwa hafai au asiye na umuhimu.'
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: hata mmoja wa hawa wadogo
  rationale: “Hawa wadogo” huhifadhi upana wa μικρῶν, ambao unaweza kuhusisha watoto na watu walio wanyenyekevu au wanaoonekana kuwa wadogo kwa hadhi. “Hata” huleta kwa kawaida msisitizo wa ἑνός katika Kiswahili.
- source_word: λέγω γὰρ ὑμῖν
  choice: kwa maana ninawaambia
  rationale: Huhifadhi kazi ya γάρ ya kutoa sababu na usemi wa Yesu unaoelekezwa kwa wasikilizaji wengi.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: malaika wao
  rationale: Huhifadhi uhusiano wa kimilikishi ulio katika Kigiriki bila kufafanua kama kila mmoja ana malaika mmoja maalumu.
- source_word: ἐν οὐρανοῖς
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa wingi wa Kigiriki οὐρανοῖς katika muktadha huu.
- source_word: διὰ παντὸς
  choice: daima
  rationale: Hutoa maana ya wakati wote au kwa kuendelea kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: huuona uso
  rationale: Huhifadhi taswira ya moja kwa moja ya kuuona uso, ambayo inaweza kudokeza nafasi ya kukaribia na kuwa mbele za Mungu.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: wa Baba yangu aliye mbinguni
  rationale: Huhifadhi lugha ya Yesu ya “Baba yangu” na kishazi kinachoeleza mahali, bila kuongeza kivumishi kisichokuwapo.
theological_decisions:
- issue: Maana ya “malaika wao”
  choice: Kubakiza usemi “malaika wao” bila kuufanya fundisho kamili la malaika walinzi wa kila mtu.
  alternative: Kutafsiri wazi kuwa kila mtoto au mwamini ana malaika mlinzi binafsi, au kuwa ni malaika wanaowawakilisha au kuwahudumia kwa ujumla.
  rationale: Kigiriki kinaonyesha uhusiano kati ya malaika na hawa wadogo, lakini mstari wenyewe haufafanui aina kamili ya uhusiano huo. Tafsiri inahifadhi utata huo wa kweli.
- issue: Wanaorejelewa na “hawa wadogo”
  choice: Kutumia “hawa wadogo” bila kuwekea kikomo maana kuwa watoto pekee.
  alternative: Kutafsiri “watoto hawa wadogo” au “waamini hawa wanyenyekevu.”
  rationale: Muktadha wa Mathayo 18 unahusisha mtoto halisi na pia unapanua mfano kuelekea unyenyekevu na wanaomwamini Yesu; usemi mpana huepuka kufunga rejeo mapema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Angalieni” linafaa kwa onyo la makini; “msimdharau” ni la kawaida na zito bila kuwa la kizamani. Muundo umewekwa wazi kwa msomaji wa kawaida huku taswira na utata wa Kigiriki vikihifadhiwa.
