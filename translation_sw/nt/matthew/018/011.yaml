  source_fidelity: 'Tafsiri inafuata kwa uaminifu maandishi ya Robinson-Pierpont: γάρ ni “Kwa maana,” cheo ὁ υἱὸς τοῦ ἀνθρώπου ni “Mwana wa Adamu,” na kusudi la ἦλθεν ... σῶσαι linatolewa kwa “alikuja kukiokoa.” “Kilichopotea” huhifadhi kwa uzuri umoja wa kati wa τὸ ἀπολωλός na kutobainisha kimakusudi ikiwa rejeo ni mtu mmoja, kundi, au kilichopotea kwa ujumla.'
