base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu alikuja kukiokoa kilichopotea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupatikani katika hati za kale zaidi za Kigiriki (kutia ndani Sinaiticus na Vaticanus za karne ya nne) wala katika tafsiri za kale za Kikopti. Hata hivyo, unapatikana katika Codex Bezae ya karne ya tano, mapokeo ya hati nyingi za Kibizanti, na Vulgata ya Kilatini. Huenda waandishi wa baadaye waliuongeza ili kuoanisha kifungu hiki na Luka 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: kukiokoa
  rationale: Kitenzi “kuokoa” ni tafsiri ya kawaida na ya wazi ya σῴζω katika muktadha wa kumwondoa mtu au kitu katika hatari na upotevu; kiambishi “-ki-” kinarejelea “kilichopotea.”
- source_word: τὸ ἀπολωλός
  choice: kilichopotea
  rationale: Kirai hiki ni kivumishi-tendaji cha wakati timilifu, umoja wa ngeli isiyo na jinsi, kilichotumiwa kama nomino. “Kilichopotea” huhifadhi umoja na kutobainishwa kwa mhusika katika Kigiriki, bila kukibadili waziwazi kuwa wingi wa watu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Biblia za Kiswahili na linaakisi kwa karibu muundo wa Kigiriki.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi hii inatoa msingi au maelezo yanayohusiana na kauli iliyotangulia.
theological_decisions:
- issue: Rejeo la τὸ ἀπολωλός
  choice: kilichopotea
  alternative: waliopotea
  rationale: Kigiriki kina umoja wa ngeli isiyo na jinsi. Tafsiri iliyochaguliwa huhifadhi umbo hilo na mvutano wake wa maana, badala ya kutaja moja kwa moja kwamba ni watu wengi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili lakini unafuata kwa karibu mantiki na maumbo muhimu ya Kigiriki; alama ya tanbihi imewekwa baada ya sentensi.
