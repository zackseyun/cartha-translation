review_pass:
  verdict: revise
  source_fidelity: 'The narrative actions and monetary amount are accurately conveyed. However, “chochote unachonidai” reverses the debt relation: in ordinary Swahili it means “whatever you demand from me,” whereas the Greek has the aggressor demanding repayment from the fellow slave.'
  naturalness: The narration is fluent, modern Standard East African Swahili. “Nilipe deni lolote ulilo nalo kwangu” is idiomatic and makes the intended creditor–debtor relationship explicit in the direct demand.
  terminology: “Mtumwa,” “watumwa wenzake,” and “dinari” are appropriate and consistent with the social setting and the source. “Kumnyonga” fittingly conveys the violent choking action.
  issues:
  - severity: high
    issue: The demand “Nilipe chochote unachonidai” has the debt direction reversed.
    rationale: The relative clause unachonidai means “which you demand/claim from me.” Greek εἴ τι ὀφείλεις means “if you owe anything,” with the fellow slave as debtor to the speaker. The revision uses “ulilo nalo kwangu” to preserve this relationship and the indefinite force.
  revised_text: Lakini mtumwa huyo alipotoka, alimkuta mmoja wa watumwa wenzake aliyekuwa na deni kwake la dinari mia moja.[a] Akamkamata na kuanza kumnyonga, akisema, “Nilipe deni lolote ulilo nalo kwangu.”[b]
