id: MAT.18.28
reference: Matthew 18:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: sw
  text: Lakini mtumwa huyo alipotoka, alimkuta mmoja wa watumwa wenzake aliyekuwa na deni kwake la dinari mia moja.[a] Akamkamata na kuanza kumnyonga, akisema, “Nilipe deni lolote ulilo nalo kwangu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari moja ilikuwa malipo ya kawaida ya siku moja kwa mfanyakazi au mwanajeshi.
    reason: cultural_note
  - marker: b
    text: Kwa tafsiri halisi zaidi, “Nilipe ikiwa una deni lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Hali ya kuwa chini ya mamlaka ya bwana na nguvu ya kulazimisha ni muhimu katika mfano huu; ‘mtumwa’ inaonyesha hali hiyo kwa uwazi kuliko ‘mtumishi’.
- source_word: ἐξελθὼν δὲ
  choice: Lakini ... alipotoka
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida mpito wa simulizi wenye δέ pamoja na uhusiano wa wakati wa kitenzi-shirikishi.
- source_word: συνδούλων
  choice: watumwa wenzake
  rationale: Inahifadhi maana ya σύν-, yaani mtu mwenye hali ileile ya utumwa, na inaafikiana na tafsiri ya δοῦλος.
- source_word: ὤφειλεν αὐτῷ
  choice: aliyekuwa na deni kwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wazi kuwa mtumwa mwenzake ndiye aliyekuwa mdaiwa na mtumwa wa kwanza ndiye aliyekuwa akidai.
- source_word: ἑκατὸν δηνάρια
  choice: dinari mia moja
  rationale: Inahifadhi jina la kihistoria la fedha na tofauti yake na deni kubwa sana lililotajwa mapema katika mfano.
- source_word: κρατήσας αὐτὸν
  choice: Akamkamata
  rationale: ‘Kumkamata’ linaonyesha tendo la kimwili la kumshika kwa nguvu katika muktadha huu.
- source_word: ἔπνιγεν
  choice: kuanza kumnyonga
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililoendelea au lililoanza; ‘kuanza kumnyonga’ huwasilisha mwanzo wa shambulio hilo kwa Kiswahili cha kawaida.
- source_word: Ἀπόδος
  choice: Nilipe
  rationale: Katika muktadha wa deni, ‘nilipe’ ni amri kali na ya kawaida ya kutaka malipo ya deni.
- source_word: εἴ τι ὀφείλεις
  choice: chochote unachonidai
  rationale: Inahifadhi hali isiyo bayana ya εἴ τι (‘ikiwa ni chochote/chochote’) bila kuifanya kuwa kiasi maalumu, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika simulizi la mfano
  choice: mtumwa / watumwa wenzake
  alternative: mtumishi / watumishi wenzake
  rationale: Mfano unahusu watu walio chini ya bwana pamoja na matumizi ya mamlaka ya kulazimisha. ‘Mtumwa’ huonyesha uhalisi huo wa kijamii bila kuupunguza.
- issue: Ubayana wa εἴ τι ὀφείλεις
  choice: chochote unachonidai
  alternative: deni unalonidai; ikiwa una deni lolote
  rationale: Kifungu cha Kigiriki kinaweza kueleweka kama usemi usio bayana, ‘chochote unachodaiwa,’ au kwa uhalisia zaidi, ‘ikiwa unadaiwa chochote.’ Tafsiri kuu inahifadhi hali hiyo isiyo bayana, na tafsiri halisi zaidi imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa simulizi kwa vitenzi vinavyofuatana (‘akamkamata ... kuanza ... akisema’) na huepuka lugha ya kimadhehebu. Alama za tanbihi zimewekwa moja kwa moja baada ya sehemu zinazofafanuliwa.
