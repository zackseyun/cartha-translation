  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: sw
  text: Lakini asipokusikiliza, chukua pamoja nawe mtu mmoja au wawili wengine, ili kwa ushuhuda wa mashahidi wawili au watatu kila jambo lithibitishwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hili linadokeza Kumbukumbu la Torati 19:15, ambako jambo huthibitishwa kwa ushuhuda wa mashahidi wawili au watatu. Kwa tafsiri ya karibu zaidi na muundo wa maneno ya awali: “kwa kinywa cha mashahidi wawili au watatu.”'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀκούσῃ
  choice: asipokusikiliza
  rationale: Katika muktadha huu kitenzi kinamaanisha kusikia kwa kuitikia au kutii, si kupokea sauti tu; “kusikiliza” huonyesha kukataa kuzingatia.
- source_word: παράλαβε μετὰ σοῦ
  choice: chukua pamoja nawe
  rationale: Huhifadhi nguvu ya amri na maana ya kuandamana iliyomo katika μετὰ σοῦ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἔτι ἕνα ἢ δύο
  choice: mtu mmoja au wawili zaidi
  rationale: Neno ἔτι linaonyesha nyongeza; “zaidi” linaweka wazi kuwa hawa wanaongezwa kwa yule anayekwenda kuzungumza naye.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa ufupi na kwa Kiswahili cha asili.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: kwa ushahidi wa mashahidi wawili au watatu
  rationale: Nahau ya Kisemiti “kwa kinywa cha” ina maana ya ushahidi katika matumizi ya kisheria. Kiswahili “kwa ushahidi wa” ni wazi na huhifadhi kazi ya mashahidi.
- source_word: σταθῇ
  choice: lithibitishwe
  rationale: Katika muktadha wa kisheria, kitenzi hiki kina maana ya jambo kuthibitishwa au kuimarishwa kuwa halali.
- source_word: πᾶν ῥῆμα
  choice: kila jambo
  rationale: Ingawa kwa umbo inaweza kuwa “kila neno,” katika dondoo la kisheria kutoka Kumbukumbu la Torati inarejelea jambo linalochunguzwa; “kila jambo” huhifadhi upana huo bila kulifinya kuwa shtaka pekee.
theological_decisions:
- issue: Dondoo la sheria ya Agano la Kale katika muktadha wa nidhamu ya jumuiya
  choice: Kutumia lugha wazi ya ushahidi wa kisheria huku dondoo la Kumbukumbu la Torati 19:15 likibainishwa katika tanbihi.
  alternative: “ili kila neno lisimame kwa kinywa cha mashahidi wawili au watatu”
  rationale: Chaguo hili linadumisha kanuni ya kuthibitisha jambo kwa mashahidi bila kuifanya nahau ya kale isieleweke au kuifasiri kwa namna finyu kuwa shtaka tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Asipokusikiliza” ni cha kawaida kuliko “asipokusikia” kwa maana ya kutokuitikia maonyo. “Chukua pamoja nawe” hudumisha amri bila kuwa nzito. Nahau ya Kigiriki/Kisemiti imetafsiriwa kwa maana yake ya wazi, huku umbo lake rasmi likihifadhiwa katika tanbihi.
