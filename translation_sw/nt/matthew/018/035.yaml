  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: sw
  text: Ndivyo Baba yangu wa mbinguni atakavyowatendea, ikiwa kila mmoja wenu hatamsamehe ndugu yake[a] kutoka mioyoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu yake” hutafsiri umbo la kiume katika Kigiriki; katika muktadha huu humwakilisha kila ndugu mwenzake katika jumuiya ya waamini, awe mwanamume au mwanamke.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Vivyo hivyo
  rationale: Kifungu hiki kinaunganisha onyo na mfano uliotangulia kwa kuonyesha kwamba Baba atatenda kwa namna inayolingana na tendo la bwana katika mfano.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Baba yangu wa mbinguni
  rationale: Ni usemi wa kawaida na wenye heshima unaohifadhi umilikaji wa “yangu” na sifa ya οὐράνιος, “wa mbinguni.”
- source_word: ποιήσει ὑμῖν
  choice: atawatendea ninyi
  rationale: Huhifadhi upana wa kitenzi ποιέω na kurejelea bila kufafanua kupita kiasi tendo la hukumu lililo katika mfano uliotangulia.
- source_word: ἐὰν μὴ
  choice: ikiwa ... hata-
  rationale: Muundo huu unaonyesha sharti hasi moja kwa moja; “ikiwa ... hata-” ni wa asili katika Kiswahili na haupunguzi uzito wa onyo.
- source_word: ἀφῆτε
  choice: hatamsamehe
  rationale: Katika muktadha wa kosa na mfano wa deni, ἀφίημι humaanisha kusamehe, si kuachilia tu.
- source_word: ἕκαστος
  choice: kila mmoja wenu
  rationale: Hufanya wazi kwamba wajibu unamhusu kila mtu mmoja mmoja katika kundi linalosemewa.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: Huhifadhi umbo la Kigiriki la kiume na la umoja. Maana yake ya kumwakilisha mwanafunzi au mwamini mwenzao imefafanuliwa katika tanbihi.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: kutoka moyoni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha msamaha wa ndani na wa kweli. Umoja wa kimatumizi unaendana na “kila mmoja,” huku umbo halisi la wingi la Kigiriki likihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo na uzito wa onyo
  choice: Kauli imeachwa kuwa onyo la moja kwa moja kwamba Baba atawatendea wasiosamehe kama bwana alivyomtendea mtumishi katika mfano.
  alternative: Kulainisha kuwa “atawashughulikia kwa namna hiyo,” au kuongeza kwamba hukumu hii ni hukumu ya milele au kupoteza thawabu.
  rationale: Aya yenyewe inatoa onyo zito lenye sharti, lakini haitaji kwa wazi nafasi kamili ya hukumu hiyo katika mfumo wa mafundisho. Tafsiri haiongezi uamuzi wa kitheolojia ambao haujaelezwa hapa.
- issue: Lugha ya kijinsia katika ἀδελφῷ
  choice: ndugu yake
  alternative: ndugu yake wa kiume au wa kike; mwamini mwenzake
  rationale: Kigiriki kina nomino ya kiume katika umoja. Maandishi makuu yanahifadhi umbo hilo, huku tanbihi ikieleza matumizi yake ya uwakilishi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vivyo hivyo” na “Baba yangu wa mbinguni” ni vya kawaida katika mtindo wa kibiblia bila kuwa vya kizamani. “Kutoka moyoni” ni usemi unaoeleweka kwa urahisi na unaobeba msisitizo wa msamaha wa kweli wa ndani.
