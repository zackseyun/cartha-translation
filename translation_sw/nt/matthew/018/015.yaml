  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: sw
  text: Lakini ndugu yako[c] akitenda dhambi dhidi yako[a], nenda ukamwonyeshe kosa lake[b], mkiwa ninyi wawili tu. Akikusikiliza, umempata ndugu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati hazina maneno “dhidi yako,” na hivyo zinasomeka, “Ndugu yako akitenda dhambi, nenda ukamwonyeshe kosa lake, mkiwa ninyi wawili tu.”
    reason: textual_variant
  - marker: b
    text: Au “umwonye.”
    reason: lexical_alternative
  - marker: c
    text: Neno “ndugu” katika Kigiriki lina umbo la kiume, umoja; katika muktadha huu linaweza kurejelea mwanafunzi mwenza kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: akitenda dhambi
  rationale: Huhifadhi maana ya kimaadili na kidini ya ἁμαρτάνω; muundo wa ki- baada ya sharti unatoa hali ya jumla kwa Kiswahili cha kawaida.
- source_word: εἰς σέ
  choice: dhidi yako
  rationale: Hueleza wazi kwamba kosa limemlenga anayesemeshwa, kulingana na εἰς pamoja na hali ya kushutumiwa.
- source_word: ἀδελφός σου
  choice: ndugu yako
  rationale: Hufuata umbo la Kigiriki la nomino ya kiume, umoja, huku ‘ndugu’ ikiwa pia neno la kawaida katika jumuiya ya wanafunzi.
- source_word: ὕπαγε
  choice: nenda
  rationale: Ni amri fupi, ya kawaida na ya moja kwa moja inayolingana na ὕπαγε katika muktadha huu.
- source_word: ἔλεγξον
  choice: ukamwonyeshe kosa lake
  rationale: Huwasilisha wazo la kuweka kosa wazi kwa mhusika bila kutumia neno linaloweza kudokeza ukali kupita kiasi.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: mkiwa ninyi wawili tu
  rationale: Ni Kiswahili cha asili kinachohifadhi mkazo wa faragha na kutokuwapo kwa mtu mwingine.
- source_word: ἀκούσῃ
  choice: akikusikiliza
  rationale: Hujumuisha kusikia kwa kuitikia bila kulazimisha maana kali zaidi ya kutii.
- source_word: ἐκέρδησας
  choice: umempata
  rationale: Huhifadhi sitiari ya κερδαίνω ya kupata au kujipatia, bila kuongeza wazi wazo la kumrudisha ambalo halimo katika kitenzi chenyewe.
theological_decisions:
- issue: Iwapo ἀδελφός itafsiriwe kwa lugha jumuishi katika matini kuu
  choice: ndugu yako
  alternative: ndugu yako wa kiume au wa kike; mwamini mwenzako
  rationale: Matini kuu inafuata umbo la kiume, umoja, la Kigiriki. Uwezekano wa kutumiwa kwa maana pana kwa mwanafunzi mwenza unaelezwa katika tanbihi bila kubadili umbo la chanzo.
- issue: Hali ya tofauti ya matini katika εἰς σέ
  choice: kujumuisha ‘dhidi yako’ katika matini kuu
  alternative: 'kuacha maneno hayo: ‘ndugu yako akitenda dhambi’'
  rationale: SBLGNT iliyotolewa ina εἰς σέ. Kwa kuwa baadhi ya hati hazina maneno hayo na tofauti hiyo huathiri upeo wa agizo, usomaji mfupi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkiwa ninyi wawili tu’ hutiririka kwa kawaida kuliko tafsiri ya neno kwa neno ya ‘kati yako na yeye peke yake,’ huku ikidumisha faragha inayosisitizwa na chanzo.
