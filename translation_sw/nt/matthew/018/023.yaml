  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
translation:
  language: sw
  text: Kwa sababu hiyo, ufalme wa mbinguni umefananishwa na mfalme aliyetaka kufanya hesabu na watumwa wake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi”; Kigiriki δοῦλοι, ikisisitiza hali yao ya utumwa chini ya mfalme.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “ulifananishwa na” au “ulinganishwa na.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaonyesha uhusiano wa sababu na mafundisho yaliyotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: ὡμοιώθη
  choice: umefananishwa na
  rationale: Inahifadhi hali ya kutendwa ya kitenzi cha Kigiriki na wazo la kulinganisha; wakati timilifu unafaa katika Kiswahili huku dokezo la tendo lililofanyika likibaki.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Hili ni tamko la kawaida la Mathayo kuhusu utawala wa Mungu na ni la asili katika Kiswahili sanifu.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: mfalme
  rationale: βασιλεῖ inabainisha mtu anayezungumziwa; Kiswahili kwa kawaida husema kwa ufupi ‘mfalme’ bila kupoteza maana.
- source_word: ἠθέλησεν
  choice: aliyetaka
  rationale: Linatoa kwa uwazi wazo la nia au utashi wa mfalme.
- source_word: συνᾶραι λόγον
  choice: kufanya hesabu
  rationale: Ni usemi wa Kiswahili unaoeleweka kwa kuchunguza na kusawazisha madai ya kifedha, bila kuufanya kuwa ukaguzi wa kisasa tu.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: na watumwa wake
  rationale: ‘Watumwa’ linaweka wazi hadhi ya kufungwa chini ya mamlaka ya mfalme katika muktadha huu wa kifalme na wa deni; ‘watumishi’ limetolewa katika tanbihi kama uwezekano wa kileksia.
theological_decisions:
- issue: Utafsiri wa δοῦλος katika mfano wenye mazingira ya kifalme na kifedha
  choice: watumwa
  alternative: watumishi au watumwa waliofungwa katika utumishi
  rationale: Mamlaka ya mfalme, deni, na uwezekano wa kuuzwa katika mstari unaofuata hufanya hadhi ya utumwa ionekane wazi. Hata hivyo, neno la Kigiriki linaweza kutafsiriwa ‘watumishi’ kulingana na muktadha, kwa hiyo uwezekano huo haujafichwa.
- issue: Hali ya kutendwa katika ὡμοιώθη
  choice: umefananishwa na
  alternative: ni kama
  rationale: ‘Umefananishwa na’ inahifadhi kwa karibu zaidi hali ya kutendwa na tendo la kulinganisha, badala ya kuligeuza tu kuwa kauli ya hali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘umefananishwa na’ umetumiwa kuhifadhi hali ya kutendwa ya Kigiriki; tanbihi zimewekwa baada ya kishazi husika, huku kila alama ikionekana katika matini kuu.
