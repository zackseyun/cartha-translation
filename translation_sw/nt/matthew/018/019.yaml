source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: sw
  text: 'Tena, kwa kweli ninawaambia: ikiwa wawili kati yenu watakubaliana[a] duniani kuhusu jambo lolote watakaloomba[c], watatendewa na Baba yangu aliye mbinguni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikiwa wawili miongoni mwenu watakuwa na makubaliano.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “katika mbingu”; hapa imetafsiriwa kwa usemi wa kawaida, “mbinguni.”'
    reason: lexical_alternative
  - marker: c
    text: Katika muktadha, kauli hii inafuata mafundisho ya Yesu kuhusu mamlaka na nidhamu ya jumuiya (18:15–18), ingawa maneno ya mstari huu yenyewe yanazungumzia kwa upana jambo lolote watakaloliomba.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: Tena
  rationale: Huonyesha kauli nyingine yenye uzito inayohusiana na mafundisho yaliyotangulia; ni ya kawaida na ya asili katika Kiswahili.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: kwa kweli ninawaambia
  rationale: Huwasilisha kwa Kiswahili cha sasa uzito na msisitizo wa kauli ya Yesu bila kulazimisha unukuzi wa neno ἀμήν.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: ikiwa wawili kati yenu watakubaliana
  rationale: συμφωνέω hapa ina maana ya kuwa na makubaliano; “wawili kati yenu” huwakilisha kwa usahihi ἐξ ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: hapa duniani
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi tofauti kati ya mazingira ya duniani na Baba aliye mbinguni.
- source_word: περὶ παντὸς πράγματος
  choice: kuhusu jambo lolote
  rationale: πρᾶγμα ni neno pana linaloweza kumaanisha jambo, kitu, au suala; tafsiri hii huhifadhi upana huo.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: watakaloomba
  rationale: Hutoa kwa ufupi na kwa ufasaha muundo wa Kigiriki unaorejelea jambo lolote ambalo hao wawili wataomba.
- source_word: γενήσεται αὐτοῖς
  choice: watatendewa jambo hilo
  rationale: Huhifadhi maana ya kwamba jambo waliloomba litafanywa kwa ajili yao, huku ikitoa sentensi ya Kiswahili iliyo wazi.
- source_word: παρὰ τοῦ πατρός μου
  choice: na Baba yangu
  rationale: Katika muundo huu παρά pamoja na hali ya umilikishi huonyesha chanzo au mtendaji; “na” humtambulisha Baba kuwa mtendaji.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: aliye mbinguni
  rationale: Ingawa Kigiriki kina wingi, “mbinguni” ni usemi wa kawaida wa Kiswahili unaowasilisha mahali pa kimbingu bila kuwa mzito.
theological_decisions:
- issue: Upeo wa ahadi katika muktadha
  choice: Kauli imetafsiriwa kwa upana wake wa moja kwa moja bila kuongeza masharti kuhusu maombi, nidhamu ya jumuiya, au mapenzi ya Mungu.
  alternative: Kuweka wazi kwamba ahadi inahusu tu maamuzi ya nidhamu ya kanisa, au kuipanua kuwa ahadi isiyo na masharti kuhusu kila ombi la maombi.
  rationale: Muktadha wa karibu unahusu nidhamu na mamlaka ya jumuiya, na αἰτέω hudokeza kuomba. Hata hivyo, mstari wenyewe hauongezi masharti ya kimafundisho; tafsiri imehifadhi upana wa maneno na mvutano wake wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Watatendewa jambo hilo” huepuka usemi mzito sana huku ikidumisha Baba kama mtendaji. Alama zote za tanbihi zimewekwa karibu na vifungu vinavyohusika.
