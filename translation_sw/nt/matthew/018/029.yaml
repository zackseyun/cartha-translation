base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: sw
  text: Basi yule mtumwa mwenzake akaanguka chini, akamsihi akisema, ‘Nivumilie, nami nitakulipa.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: mtumwa mwenzake
  rationale: Neno hili humaanisha mtumwa anayeshiriki bwana yuleyule na mwingine. Katika mfano huu, hali ya kuwa chini ya mamlaka ya bwana na deni ni muhimu; kwa hiyo “mtumwa mwenzake” ni sahihi kuliko “mtumishi mwenzake.”
- source_word: παρεκάλει
  choice: akamsihi
  rationale: Katika muktadha wa ombi la dhati la kuhurumiwa kwa sababu ya deni, “akamsihi” huonyesha uzito wa ombi kwa Kiswahili cha kawaida na chenye heshima.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Nivumilie
  rationale: Kauli hii ni ombi la kupewa muda na kuonyeshwa subira. “Nivumilie” ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuwa na subira kwa mtu.
- source_word: ἀποδώσω
  choice: nitakulipa
  rationale: Katika muktadha wa deni, “nitakulipa” huwasilisha wazi ahadi ya kulipa deni analodaiwa.
- source_word: πεσὼν
  choice: akaanguka chini
  rationale: Huhifadhi tendo halisi la kuanguka chini kama ishara ya kujishusha na kusihi.
- source_word: οὖν
  choice: Basi
  rationale: “Basi” huendeleza simulizi na pia kuonyesha uhusiano na lililotangulia bila kufanya mtindo uwe mzito.
theological_decisions:
- issue: Tafsiri ya lugha ya δοῦλος katika σύνδουλος
  choice: Kutumia “mtumwa mwenzake” katika matini kuu
  alternative: mtumishi mwenzake
  rationale: Mfano unahusu mfalme, madeni, na watu walio chini ya mamlaka yake. Neno “mtumwa” linaonyesha kwa uwazi zaidi uhusiano wa kufungwa chini ya bwana unaodokezwa na neno la Kigiriki, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Muundo wa simulizi umetumia viambishi vya mfululizo “aka-”; usemi wa moja kwa moja ni wa kawaida na wa dhati.
