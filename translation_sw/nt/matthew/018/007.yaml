  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: sw
  text: Ole kwa ulimwengu kwa sababu ya makwazo[a]! Kwa maana ni lazima makwazo yaje; lakini ole kwa mtu[b] ambaye kupitia kwake kikwazo huja!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yanayowakwaza watu,” “vishawishi vya kutenda dhambi,” au “mitego.” Neno la Kigiriki linaweza kumaanisha kitu kinachomfanya mtu ajikwae, kwa kumchukiza, kumshawishi, au kumpa nafasi ya kutenda dhambi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki hapa ni la umoja na kisarufi lina umbo la kiume, lakini katika muktadha huu linamwakilisha mtu yeyote ambaye kupitia kwake kikwazo huja.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Ole
  rationale: Neno hili linadumisha nguvu ya onyo na hukumu ya kinabii, na limerudiwa katika sehemu zote mbili kama ilivyo katika Kigiriki.
- source_word: κόσμῳ
  choice: kwa ulimwengu
  rationale: Hurejelea kwa upana ulimwengu wa wanadamu unaoathiriwa na dhambi, bila kuufanya uwe tu uumbaji wa kimwili au mfumo fulani uliofafanuliwa zaidi.
- source_word: ἀπὸ
  choice: kwa sababu ya
  rationale: Katika muktadha huu kihusishi kinaonyesha sababu ya ole; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: σκάνδαλα / σκάνδαλον
  choice: makwazo / kikwazo
  rationale: Huhifadhi taswira ya kitu kinachomfanya mtu ajikwae na pia upana wa maana unaoweza kujumuisha kishawishi, mtego, au sababu ya kutenda dhambi. Tofauti ya wingi na umoja imedumishwa.
- source_word: ἀνάγκη
  choice: ni lazima
  rationale: Huhifadhi kauli ya ulazima bila kueleza ikiwa msingi wake ni mpango wa Mungu, hali ya ulimwengu, au kutokwepeka kwa jambo hilo.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi inayofuata inaeleza sababu ya ole iliyotangulia.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: yaje ... huja
  rationale: Huhifadhi urudiaji wa kitenzi cha kuja katika Kigiriki badala ya kutumia maneno ya kufasiri zaidi kama kutokea.
- source_word: πλήν
  choice: lakini
  rationale: Huonyesha wazi ugeukaji kutoka kwa ulazima wa jumla hadi onyo la hukumu kwa mhusika binafsi.
- source_word: ἀνθρώπῳ
  choice: mtu
  rationale: Kiswahili 'mtu' ni umoja na kwa kawaida halibainishi jinsia ya kisarufi; linawasilisha mhusika mmoja wa kibinadamu kwa usahihi bila kuongeza jinsia ambayo sarufi ya Kiswahili haihitaji.
- source_word: δι’ οὗ
  choice: ambaye ... kupitia kwake
  rationale: Huhifadhi wazo la mtu kuwa njia au mhusika ambaye kupitia kwake kikwazo kinakuja.
theological_decisions:
- issue: Asili ya ulazima katika ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Imetafsiriwa kuwa “ni lazima makwazo yaje,” huku msingi wa ulazima huo ukiachwa bila kuelezwa.
  alternative: “Makwazo hayana budi kuja” au tafsiri inayohusisha moja kwa moja agizo la Mungu.
  rationale: Kigiriki kinathibitisha ulazima lakini hakisemi wazi chanzo chake. Tafsiri inadumisha mvutano huo bila kudokeza kwamba Mungu ndiye anayesababisha makwazo moja kwa moja.
- issue: Nguvu wakilishi ya ἀνθρώπῳ
  choice: Imetafsiriwa “mtu,” ikimaanisha mtu mmoja yeyote ambaye kikwazo kinakuja kupitia kwake.
  alternative: “mwanamume” au “yeyote.”
  rationale: Ingawa umbo la Kigiriki ni la kiume na umoja, nomino ya kawaida ya Kiswahili “mtu” haina alama ya jinsia na ndiyo inayowasilisha kwa kawaida rejeleo hili la jumla kwa mtu binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Makwazo” huhifadhi sitiari ya kujikwaa, huku tanbihi ikifafanua upana wake. Muundo wa mshangao na urudiaji wa “ole” unadumisha nguvu ya usemi wa asili.
