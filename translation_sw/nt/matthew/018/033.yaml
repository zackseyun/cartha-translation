translation:
  language: sw
  text: Je, nawe haikukupasa kumrehemu mtumwa mwenzako[a], kama mimi nilivyokurehemu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi mwenzako.” Neno la Kigiriki σύνδουλος humaanisha mtumwa mwenzake, yaani mtu aliye chini ya bwana yuleyule; “mtumwa mwenzako” limetumiwa hapa ili kuhifadhi wazo la hali yao ya utumwa katika mfano huu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Je, haikukupasa
  rationale: Muundo huu wa swali la kukemea unaonyesha wajibu wa kimaadili uliomo katika ἔδει, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: καὶ σὲ
  choice: nawe
  rationale: “Nawe” linaonyesha kwamba tendo lilelile la rehema lililotendwa na mfalme lilitarajiwa pia kutoka kwa mtumwa.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: kumhurumia / nilivyokuhurumia
  rationale: Kitenzi kilekile “hurumia” kimetumiwa mara zote mbili ili kuhifadhi urudiaji wa ἐλεάω na ulinganifu wa sentensi.
- source_word: τὸν σύνδουλόν σου
  choice: mtumwa mwenzako[a]
  rationale: σύνδουλος humaanisha mtumwa mwenzake, yaani mtu aliye chini ya bwana yuleyule. “Mtumwa mwenzako” linahifadhi hali ya utumwa iliyo muhimu katika mfano huu.
- source_word: ὡς κἀγὼ
  choice: kama mimi
  rationale: “Kama” linaonyesha ulinganisho wa moja kwa moja kati ya rehema aliyopokea mtumwa na rehema aliyopaswa kumwonyesha mwenzake; nafsi “mimi” inabaki wazi kwa ajili ya msisitizo.
theological_decisions:
- issue: Tafsiri ya neno la jamii ya δοῦλος katika σύνδουλος
  choice: mtumwa mwenzako
  alternative: mtumishi mwenzako
  rationale: Katika mfano huu kuna mfalme mwenye mamlaka juu ya watumwa wake, hivyo hali ya kuwa chini ya mamlaka na utumwa ni muhimu. “Mtumwa” halififishi maana hiyo, huku tanbihi ikihifadhi tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la “Je, haikukupasa...” linadumisha sauti ya kukemea bila kuwa gumu, na “nawe” pamoja na “kama mimi” linaweka wazi ulinganifu wa kimaadili.
