base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: sw
  text: Yesu akamwambia, “Sikuambii, hadi mara saba, bali hadi mara sabini na saba[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sabini mara saba.”
    reason: Usemi wa Kigiriki unaweza kumaanisha mara 77 au sabini mara saba.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, muundo wa simulizi wa Kiswahili ‘akamwambia’ ni wa kawaida, wazi, na unadumisha kitendo cha Yesu kumjibu mhusika aliyetajwa katika muktadha bila kubadili kiwakilishi kuwa jina lake.
- source_word: Οὐ λέγω σοι
  choice: Sikuambii
  rationale: Huu ni usemi wa moja kwa moja na wa asili wa Kiswahili unaowasilisha kukanusha kwa ‘ninakuambia’; hauongezi kitenzi ‘kusamehe,’ ambacho kinaeleweka kutokana na muktadha lakini hakipo katika maneno haya ya Kigiriki.
- source_word: ἕως ἑπτάκις
  choice: Hadi mara saba
  rationale: ‘Hadi’ linaonyesha kikomo cha idadi, na ‘mara saba’ linaeleza wazi marudio yanayokusudiwa na kielezi cha Kigiriki.
- source_word: ἀλλὰ
  choice: bali
  rationale: ‘Bali’ linaonyesha kwa heshima na kwa uwazi tofauti kati ya kikomo kilichopendekezwa na jibu la Yesu.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: Hadi mara sabini na saba
  rationale: Hili ni chaguo la Kiswahili linalosomeka kwa kawaida kama mara 77. Kwa kuwa muundo wa Kigiriki unaweza pia kueleweka kuwa sabini mara saba, maana hiyo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Usemi wa namba wenye utata katika fundisho la Yesu kuhusu kusamehe
  choice: mara sabini na saba
  alternative: mara sabini mara saba
  rationale: Muundo ἑβδομηκοντάκις ἑπτά unaweza kueleweka kuwa mara 77 au sabini mara saba. Maandishi makuu yanachagua usomaji wa mara 77 unaokubalika kisarufi na unaotiririka vizuri kwa Kiswahili, huku tanbihi ikihifadhi usomaji mwingine bila kuamua kimadhehebu maana ya kiwango hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nukuu fupi za ndani zinahifadhi muundo wenye maana iliyodokezwa wa chanzo bila kuongeza neno ‘kusamehe’ kutoka muktadha.
