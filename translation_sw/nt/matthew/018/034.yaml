  language: sw
  text: Yule bwana wake[a] akakasirika, akamkabidhi kwa watesaji[b] mpaka atakapolipa kila alichodaiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Bwana”: Neno la Kigiriki kyrios linaweza kutafsiriwa “Bwana.” Hapa linamtaja bwana wa mtumishi ndani ya mfano.'
    reason: alternative_reading
  - marker: b
    text: Au “wanaomtesa”; kwa maana dhaifu zaidi, “walinzi wa gereza.” Neno la Kigiriki linawataja watu wanaotesa, si walinzi wa kawaida tu.
