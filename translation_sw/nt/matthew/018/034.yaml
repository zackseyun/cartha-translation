lexical_decisions:
- source_word: ὀργισθεὶς
  choice: akakasirika
  rationale: Kitenzi hiki huonyesha kwamba bwana huyo alikasirika kabla ya kumkabidhi mtumishi; muundo wa Kiswahili wenye viambishi vya usimulizi unaonyesha mfuatano huo kwa kawaida.
- source_word: κύριος
  choice: Bwana wake
  rationale: Katika mfano huu neno hili linamtaja mwenye mamlaka juu ya mtumishi. “Bwana wake” ni Kiswahili cha kawaida katika uhusiano huo na bado huhifadhi upana wa maana wa kyrios.
- source_word: παρέδωκεν
  choice: akamkabidhi
  rationale: “Kumkabidhi” huonyesha kumtia mtu chini ya mamlaka au udhibiti wa wengine, sawasawa na maana ya kimahakama ya παραδίδωμι hapa.
- source_word: βασανισταῖς
  choice: kwa watesaji
  rationale: Neno βασανιστής humaanisha mtu anayetesha, si mlinzi wa gereza tu. “Watesaji” huhifadhi ukali wa onyo la mfano bila kuongeza maelezo yasiyokuwamo.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Huu ni muundo wa muda unaoonyesha kikomo kinachotarajiwa; “mpaka” ni tafsiri fupi na ya kawaida.
- source_word: ἀποδῷ
  choice: atakapolipa
  rationale: Hali tegemezi baada ya ἕως οὗ inaelekeza kwenye tendo linalotarajiwa baadaye. “Atakapolipa” huonyesha maana hiyo kwa Kiswahili cha kawaida.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: kiasi chote alichokuwa anadaiwa
  rationale: Kirai hiki humaanisha kitu au kiasi chote kilichodaiwa. Tafsiri hii inaeleza kwa kawaida kwamba mtumishi ndiye aliyekuwa na wajibu wa kulipa bila kulazimisha nomino “deni” ndani ya matini.
theological_decisions:
- issue: Iwapo κύριος itafsiriwe kwa maana ya cheo cha kiungu
  choice: Bwana wake
  alternative: Mkuu wake
  rationale: Muktadha wa mfano unamhusu bwana wa mtumishi, si matumizi ya moja kwa moja ya cheo cha Mungu au Kristo. Hata hivyo, “bwana” ni neno la kawaida kwa mwenye mamlaka na halifuti mwangwi mpana wa kyrios.
- issue: Ukali wa βασανισταῖς katika muktadha wa adhabu
  choice: watesaji
  alternative: walinzi wa gereza
  rationale: Neno la Kigiriki linawataja wanaosababisha mateso, hivyo “walinzi wa gereza” lingepunguza ukali wake. “Watesaji” huhifadhi onyo la mfano bila kuamua masuala mapana kuhusu hukumu ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “aka-” unafaa usimulizi wa mfano, huku “atakapolipa” ikihifadhi kikomo cha wakati kinachotarajiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
