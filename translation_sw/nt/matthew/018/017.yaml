  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: sw
  text: Lakini akikataa kuwasikiliza, liambie kusanyiko[a]. Na kama akikataa kulisikiliza kusanyiko pia, na awe kwako kama mtu wa mataifa na mtoza ushuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kanisa” au “jumuiya” kwa “kusanyiko” (Kigiriki: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: akikataa kuwasikiliza / akikataa kulisikiliza
  rationale: Katika muktadha huu wa kurekebisha kosa, kitenzi hiki hakimaanishi tu kutosikia, bali kukataa kusikiliza au kuzingatia. Usemi huu unaonyesha hiari ya kukataa bila kuongeza maana nzito zaidi ya kutotii.
- source_word: εἰπὸν
  choice: liambie
  rationale: Amri hii inahusu kuliambia kusanyiko jambo hilo linaloeleweka kutokana na muktadha. Kiwakilishi cha ngeli ya ji-/ma- kinarejelea jambo bila kuongeza maelezo yasiyokuwamo wazi katika Kigiriki.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: kusanyiko
  rationale: Neno hili humaanisha jumuiya iliyokusanyika. “Kusanyiko” linaepuka kuingiza moja kwa moja dhana za kitaasisi za baadaye, huku “kanisa” na “mkutano” yakitajwa katika tanbihi kama tafsiri zinazowezekana.
- source_word: ἔστω σοι
  choice: kwako na awe
  rationale: Huhifadhi nguvu ya amri katika ἔστω na maana ya dative σοι kwa Kiswahili cha heshima na kinachoeleweka, bila kufasiri moja kwa moja kuwa “mhesabu kuwa.”
- source_word: ὥσπερ
  choice: kama
  rationale: Ni ulinganisho wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: ὁ ἐθνικὸς
  choice: mtu wa mataifa
  rationale: Katika muktadha wa Kiyahudi, neno hili humtaja mtu asiye wa jamii ya agano, yaani mtu wa mataifa. Tafsiri hii huepuka kuongeza dhana ya kidini iliyopo katika “mpagani.”
- source_word: ὁ τελώνης
  choice: mtoza ushuru
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya τελώνης katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya ἐκκλησία katika maagizo haya ya kinidhamu
  choice: kusanyiko
  alternative: kanisa au mkutano
  rationale: “Kusanyiko” linaonyesha jumuiya iliyokusanyika bila kuamua mapema muundo wa kitaasisi au wa kidhehebu. Tafsiri za jadi na zinazowezekana zimehifadhiwa katika tanbihi.
- issue: Nguvu ya kumwona mtu asiyetaka kusikiliza kuwa wa nje
  choice: kwako na awe kama mtu wa mataifa na mtoza ushuru
  alternative: mtendee kama mtu wa mataifa na mtoza ushuru; mhesabu kuwa mtu wa nje
  rationale: Tafsiri inadumisha ulinganisho wa Kigiriki na haubadilishi mstari kuwa utaratibu uliofafanuliwa zaidi wa kumtenga mtu. Hivyo mvutano na upeo wa maneno yenyewe vinahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwako na awe” ni muundo wa kibiblia lakini bado unaeleweka, nao huhifadhi kwa karibu ἔστω σοι. Alama ya tanbihi [a] imewekwa mara moja baada ya “kusanyiko” katika kutajwa kwake kwa kwanza.
