reference: Matthew 18:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: sw
  text: Na ikiwa mkono wako au mguu wako unakusababisha ujikwae[a], ukate na kuutupa mbali nawe. Ni afadhali kwako kuingia katika uzima ukiwa umepungukiwa na kiungo au ukiwa kilema, kuliko kuwa na mikono miwili au miguu miwili na kutupwa katika moto wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unakukosesha,” yaani, unakufanya utende dhambi. Maana halisi ya kitenzi cha Kigiriki ni “kusababisha ujikwae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: unakukosesha
  rationale: Kitenzi hiki huonyesha kusababisha mtu ajikwae na, katika muktadha huu, aanguke katika dhambi. ‘Kukosesha’ ni usemi wa kawaida wa Kiswahili unaowasilisha athari ya kimaadili; tanbihi inahifadhi taswira halisi ya kujikwaa.
- source_word: ἔκκοψον
  choice: ukate
  rationale: Amri hii ni kali na halisi, ikimaanisha kukata mkono au mguu; ‘ukate’ ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: βάλε ἀπὸ σοῦ
  choice: kuutupa mbali nawe
  rationale: Usemi huu unaonyesha kuondoa kwa nguvu na kuweka mbali; kiambishi ‘u-’ kinarejelea mkono au mguu katika muundo huu wa jozi.
- source_word: καλόν σοί ἐστιν
  choice: Ni afadhali kwako
  rationale: Ingawa καλόν kimsingi ni ‘jema,’ muundo wa kulinganisha unaofuatwa na ἢ unahitaji maana ya ‘afadhali.’
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: kuingia katika uzima
  rationale: ‘Uzima’ huhifadhi neno la chanzo bila kuongeza ‘wa milele,’ huku muktadha ukionyesha uzima wa kieskatolojia.
- source_word: κυλλὸν
  choice: ukiwa umepungukiwa na kiungo
  rationale: Neno hili humaanisha kuwa umeharibika mwili au umepoteza kiungo. Ufafanuzi huu ni wa heshima, wazi, na unafaa muktadha wa kukatwa mkono.
- source_word: χωλόν
  choice: ukiwa kilema
  rationale: χωλός humaanisha hasa kuwa na ulemavu wa kutembea unaohusiana na mguu; ‘kilema’ ni neno la moja kwa moja katika muktadha huu.
- source_word: ἔχοντα
  choice: kuwa na
  rationale: Kitenzi-shirikishi hiki kinawasilishwa wazi ili kudumisha ulinganifu wa kuwa na mikono miwili au miguu miwili.
- source_word: βληθῆναι
  choice: kutupwa
  rationale: Hii ni hali ya kutendwa ya βάλλω na inatafsiriwa kwa kawaida na moja kwa moja kuwa ‘kutupwa.’
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: moto wa milele
  rationale: Katika muktadha huu wa hukumu, αἰώνιος kwa kawaida humaanisha ‘wa milele’; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo σκανδαλίζει itafsiriwe kwa taswira ya kujikwaa au kwa maana ya kusababisha dhambi
  choice: unakukosesha, huku taswira ya ‘kukufanya ujikwae’ ikitolewa katika tanbihi
  alternative: unakufanya ujikwae
  rationale: ‘Unakukosesha’ huwasilisha maana ya kimaadili kwa msomaji wa kawaida, lakini tanbihi huhifadhi sitiari halisi na utata wa kitenzi cha Kigiriki.
- issue: Maana ya ‘uzima’ katika εἰς τὴν ζωὴν
  choice: kuhifadhi ‘uzima’ bila kuufafanua kuwa ‘uzima wa milele’
  alternative: kuingia katika uzima wa milele
  rationale: Nakala ya Kigiriki inasema tu ‘uzima.’ Muktadha na tofauti yake na moto wa milele vinaonyesha uzito wa kieskatolojia bila kuongeza neno lisilokuwamo.
- issue: Asili ya onyo kuhusu kukata kiungo cha mwili
  choice: kuhifadhi amri kali jinsi ilivyo bila kusema wazi kuwa ni tashbihi ya kupindukia
  alternative: kuifafanua kama mwito wa mfano wa kuondoa chanzo cha dhambi
  rationale: Nakala yenyewe hutumia amri ya moja kwa moja. Tafsiri haipaswi kupunguza ukali wake wala kutatua katika matini kuu jinsi taswira hiyo inavyopaswa kueleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka. Muundo mkali wa onyo umehifadhiwa; ‘uzima’ na ‘moto wa milele’ zimeachwa katika mvutano wa matini ya chanzo.
