  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: sw
  text: Jioni ilipofika, wanafunzi wakamjia na kusema, “Mahali hapa ni pa ukiwa[a], na muda umesonga sana[b]. Waache makutano waondoke, ili waende vijijini wakajinunulie chakula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mahali hapa ni pa faragha.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “saa tayari imepita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Jioni ilipofika
  rationale: Kirai huru cha hali ya wakati kinaanzisha tukio la jioni. Kiswahili hiki ni cha kawaida na kinaonyesha mpito wa wakati; δέ halihitaji kutafsiriwa kwa kiunganishi tofauti hapa.
- source_word: προσῆλθον αὐτῷ
  choice: wakamjia
  rationale: Kitenzi hiki huonyesha kuwakaribia au kuwaendea watu. “Wakamjia” ni fasaha katika simulizi na kinahifadhi mwelekeo wa tendo kwa Yesu.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Neno hili linaitaja kundi linalojulikana katika muktadha. Kiswahili hakihitaji kuongeza “wake,” ambalo halipo wazi katika kirai hiki cha Kigiriki.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Mahali hapa ni pasipo na watu
  rationale: ἔρημος hapa panaeleza eneo lisilokaliwa au lililo mbali na makazi, si lazima jangwa la kijiografia. Tafsiri hii ni wazi na ya kawaida.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: muda umesonga sana
  rationale: Maana ya moja kwa moja ni kwamba saa au wakati tayari umepita; katika muktadha ni njia ya kusema kuwa kumekuwa kuchelewa. “Muda umesonga sana” ni ya asili huku tanbihi ikihifadhi umbo la moja kwa moja.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Waache watu waondoke
  rationale: ἀπολύω hapa ni kuwaruhusu au kuwaondosha watu waliokusanyika. Uundaji huu wa Kiswahili unaeleza ombi la kuwatawanya bila kutumia “waage,” ambalo kwa wasomaji wengi hasa humaanisha kuwaambia kwaheri.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: ili waende vijijini
  rationale: Muundo wa kishirikishi pamoja na ἵνα unaonyesha kusudi. Kiswahili huwasilisha kwa kawaida mfuatano huo kwa kishazi kimoja cha kusudi.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: kujinunulia chakula
  rationale: “Kujinunulia” kinahifadhi maana ya kujirejelea ya ἑαυτοῖς, na “chakula” ni tafsiri wazi ya βρώματα.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia mtiririko wa kawaida wa simulizi bila kuongeza kiashiria cha mazungumzo kisichokuwapo wazi. Alama za tanbihi zimewekwa kwenye virai vinavyohusika; katika data ya Kiingereza, maelezo ya tanbihi yalionekana kuambatanishwa na alama zilizowekwa baada ya virai visivyolingana.
