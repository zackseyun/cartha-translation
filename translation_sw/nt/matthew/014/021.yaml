  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: sw
  text: Waliokula walikuwa wanaume wapatao elfu tano, bila kuhesabu wanawake na watoto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kando na wanawake na watoto.
    reason: Njia nyingine ya kutafsiri χωρὶς; usemi mkuu “bila kuhesabu” unaweka wazi zaidi kwamba hawakujumuishwa katika hesabu.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Waliokula
  rationale: Kirai chenye kibainishi na kitenzi-jina kinawarejelea wale walioshiriki kula. “Waliokula” ni Kiswahili cha kawaida na hakiongezi neno la wakati lisilokuwamo katika chanzo; δέ hapa ni kiunganishi hafifu ambacho si lazima kitafsiriwe kwa neno tofauti.
- source_word: ἦσαν
  choice: walikuwa
  rationale: Ni kauli rahisi ya kutaja idadi, nayo inatafsiriwa kwa kawaida kwa “walikuwa.”
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno hili linamaanisha watu wa kiume, si watu kwa ujumla; wanawake na watoto wanatajwa kando katika mstari huohuo.
- source_word: ὡσεὶ
  choice: wapatao
  rationale: Huonyesha makadirio. “Wapatao” ni neno la kawaida, lenye heshima, linalolingana kisarufi na “wanaume.”
- source_word: πεντακισχίλιοι
  choice: elfu tano
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi iliyotajwa.
- source_word: χωρὶς
  choice: bila kuhesabu
  rationale: Pamoja na hali ya umilikishi inayofuata, neno hili linaonyesha kwamba wanawake na watoto hawakujumuishwa katika hesabu ya wanaume elfu tano. Usemi huu unaeleza maana hiyo wazi katika Kiswahili cha sasa.
- source_word: γυναικῶν
  choice: wanawake
  rationale: Katika muktadha huu hakuna uhusiano wa ndoa unaokusudiwa, kwa hiyo “wanawake” inafaa kuliko “wake.”
- source_word: παιδίων
  choice: watoto
  rationale: Ni tafsiri ya kawaida ya wingi wa παιδίον bila kuifanya maana iwe finyu zaidi kwa kusema watoto wadogo sana.
theological_decisions:
- issue: Neno maalumu la kijinsia katika hesabu ya umati wenye wanaume, wanawake na watoto
  choice: Kutafsiri ἄνδρες kuwa “wanaume” na kusema wazi kwamba wanawake na watoto hawakuhesabiwa katika idadi hiyo.
  alternative: Kutafsiri ἄνδρες kuwa “watu” au “wanadamu.”
  rationale: Chanzo cha Kigiriki kinahesabu watu wa kiume hasa, kisha kinawataja wanawake na watoto kando. “Watu” kingefuta utofauti huu wa kimsamiati na kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili na wazi kwa wasomaji wa kawaida, huku ukihifadhi makadirio ya idadi na utofauti wa wanaume, wanawake na watoto uliomo katika Kigiriki.
