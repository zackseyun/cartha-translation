  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: sw
  text: Lakini wanafunzi walipomwona akitembea juu ya bahari, waliingiwa na hofu, wakisema, “Ni mzuka[a]!” Nao wakapiga kelele kwa hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kivuli kinachoonekana” au “umbo la kutokea.”
    reason: Neno la Kigiriki φάντασμα linaweza kumaanisha mzuka, mwonekano wa kivuli, au umbo la kutokea.
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mgeuko mdogo wa simulizi kuelekea mwitikio wa wanafunzi wenye hofu.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: Nomino yenye kibainishi inarejelea kundi linalojulikana katika muktadha, yaani wanafunzi wa Yesu.
- source_word: ἰδόντες αὐτὸν
  choice: walipomwona
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati ili kuonyesha kwa Kiswahili cha kawaida kwamba hofu ilifuata baada ya kumwona.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: akitembea juu ya bahari
  rationale: Huhifadhi wazo la kutembea juu ya uso wa bahari bila kulibadili kuwa maelezo mapana zaidi.
- source_word: ἐταράχθησαν
  choice: waliingiwa na hofu
  rationale: Katika muktadha huu ταράσσω inaonyesha kufadhaika sana kwa sababu ya hofu; usemi huu ni wa kawaida na unaonyesha uzito wa mwitikio wao.
- source_word: λέγοντες
  choice: wakisema
  rationale: Inaonyesha kwamba maneno yao yalitolewa wakati uleule walipokuwa wameingiwa na hofu.
- source_word: Φάντασμά ἐστιν
  choice: Ni mzuka[a]!
  rationale: Mzuka ni neno linaloeleweka kwa urahisi kwa kitu kinachoonekana kama roho au umbo lisilo la kawaida; linaonyesha dhana ya wanafunzi wenye hofu, si tamko la msimulizi kuhusu asili ya Yesu.
- source_word: ἀπὸ τοῦ φόβου
  choice: kwa hofu
  rationale: Hapa ἀπό inaonyesha sababu au chanzo cha kupiga kwao kelele.
- source_word: ἔκραξαν
  choice: wakapiga kelele
  rationale: Kitenzi κράζω kinaonyesha kutoa sauti kubwa; usemi huu ni wa kawaida na hauongezi maelezo yasiyokuwapo katika Kigiriki.
theological_decisions:
- issue: Asili ya φάντασμα katika mshangao wa wanafunzi
  choice: Mzuka katika matini kuu
  alternative: Kivuli au kitu kilichotokea kwa macho
  rationale: Mstari unasimulia walichodhani wanafunzi kwa hofu, wala hautoi fundisho la moja kwa moja kuhusu kuwapo au asili ya roho za wafu. Tafsiri inadumisha mtazamo wao uliokosea bila kuufanya kuwa dai la msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku marudio ya ‘hofu’ yakihifadhi msisitizo wa chanzo cha Kigiriki. Alama [a] imewekwa baada ya ‘mzuka,’ neno linalohusika na tanbihi.
