lexical_decisions:
- source_word: ἐπιγνόντες
  choice: walipomtambua
  rationale: Kitenzi hiki hapa humaanisha kumtambua Yesu walipomwona, si kuanza kumjua kwa maana pana ya uhusiano.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: wanaume wa mahali pale
  rationale: ἀνήρ humaanisha wanaume hasa, na τόπος hapa ni mahali walipofika; tafsiri hii inahifadhi maana zote mbili.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: walituma habari katika eneo lote lililozunguka
  rationale: Kigiriki hakitaji kitu kilichotumwa, lakini muktadha unaonyesha kwamba habari au wajumbe walitumwa. Kiswahili cha kawaida huhitaji kukamilisha wazo; “habari” linaeleza maana bila kubainisha namna ujumbe ulivyofikishwa.
- source_word: προσήνεγκαν αὐτῷ
  choice: wakamletea
  rationale: Katika simulizi hili προσφέρω humaanisha kuwaleta watu kwa Yesu, wala si kutoa dhabihu.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: wote waliokuwa wagonjwa
  rationale: Kirai κακῶς ἔχειν ni nahau ya kuwa mgonjwa au kutokuwa na afya; “waliokuwa wagonjwa” ni Kiswahili cha kawaida na sahihi.
