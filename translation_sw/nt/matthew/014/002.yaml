  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: sw
  text: Akasema kwa watumishi wake, “Huyu ni Yohana Mbatizaji. Amefufuliwa kutoka kwa wafu, na ndiyo maana nguvu[a] zinafanya kazi ndani yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu za kutenda miujiza”; kwa tafsiri ya kimaana zaidi, “miujiza.” Kigiriki kinasema “nguvu,” kikirejelea nguvu isiyo ya kawaida inayodhihirika katika matendo makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: watumishi
  rationale: Katika muktadha huu παῖς inawahusu watu wa nyumba au ikulu ya Herode wanaomtumikia. “Watumishi” linaonyesha uhusiano huo bila kuwafanya wawe watoto wala kubainisha cheo kisichotajwa.
- source_word: ὁ βαπτιστής
  choice: Mbatizaji
  rationale: “Mbatizaji” ni jina la kazi linaloeleza wazi maana ya βαπτιστής na ni la kawaida katika Kiswahili cha Biblia.
- source_word: ἠγέρθη
  choice: amefufuliwa
  rationale: Kauli hii inadumisha hali ya kutendwa ya kitenzi cha Kigiriki, bila kudokeza kwamba Yohana alijifufua mwenyewe.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: kutoka kwa wafu
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kueleza kufufuliwa kutoka miongoni mwa waliokufa.
- source_word: διὰ τοῦτο
  choice: ndiyo maana
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha uhusiano wa sababu na matokeo uliomo katika Kigiriki.
- source_word: αἱ δυνάμεις
  choice: nguvu hizi
  rationale: “Nguvu” inadumisha nomino ya Kigiriki bila kuibadili moja kwa moja kuwa “miujiza.” “Hizi” huelekeza kwa kawaida kwenye matendo yenye nguvu yaliyokuwa yakizungumziwa katika muktadha.
- source_word: ἐνεργοῦσιν
  choice: zinatenda kazi
  rationale: Usemi huu unaonyesha nguvu hizo kuwa hai na zenye matokeo, kama kitenzi cha Kigiriki kinavyodokeza.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Hii inadumisha maana ya moja kwa moja ya ἐν, badala ya kutumia “kupitia kwake,” ambalo lingekuwa fasiri pana zaidi.
theological_decisions:
- issue: Namna Yohana alivyorudi kutoka kwa wafu
  choice: amefufuliwa kutoka kwa wafu
  alternative: amefuka kutoka kwa wafu
  rationale: Kigiriki kimetumia hali ya kutendwa, kwa hiyo tafsiri inadumisha hilo bila kufanya dai la ziada kuhusu mtendaji wa ufufuo katika kauli ya Herode.
- issue: Maana ya δυνάμεις katika muktadha
  choice: nguvu hizi zinatenda kazi ndani yake
  alternative: nguvu hizi za kutenda miujiza zinatenda kazi ndani yake; miujiza hii inatendeka kupitia kwake
  rationale: Neno hilo linaelekea kurejelea nguvu isiyo ya kawaida inayodhihirika katika matendo makuu, lakini “nguvu” inadumisha upana wa neno la Kigiriki na haibadili nguvu yenyewe kuwa matokeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida huku ikidumisha hali ya kutendwa katika “amefufuliwa” na utata wa kimakusudi wa “nguvu.”
