  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: sw
  text: Lakini ilipofika sherehe ya siku ya kuzaliwa kwa Herode[a], binti wa Herodia akacheza katikati[b] na akampendeza Herode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilipofika siku ya kuzaliwa kwa Herode” au “wakati wa sherehe ya siku ya kuzaliwa kwa Herode.” Kigiriki kinarejelea tukio la kuadhimisha siku yake ya kuzaliwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katikati.” Huenda maana yake ni kwamba alicheza katikati ya watu waliokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ilipofika sherehe ya siku ya kuzaliwa kwa Herode
  rationale: Kirai hiki kinaonyesha wakati wa kuadhimishwa kwa siku ya kuzaliwa, si tarehe pekee. Tafsiri hii ni ya kawaida kwa Kiswahili na inaweka wazi mazingira ya sherehe.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaendeleza simulizi huku likidokeza badiliko au utofauti mdogo na yaliyotangulia.
- source_word: ὠρχήσατο
  choice: akacheza
  rationale: Kitenzi hiki humaanisha kucheza dansi; ‘akacheza’ ni tafsiri fupi na ya kawaida bila kuongeza maelezo yasiyomo.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: binti wa Herodia
  rationale: Huhifadhi uhusiano uliotajwa katika Kigiriki bila kumtambulisha binti huyo kwa jina ambalo kifungu hakitaji.
- source_word: ἐν τῷ μέσῳ
  choice: katikati ya waliohudhuria
  rationale: Maana ya msingi ni ‘katikati’; kutaja waliohudhuria kunafanya kirai kiwe cha kawaida katika Kiswahili na kueleza mazingira yanayodokezwa na simulizi bila kubadili tendo.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: akampendeza Herode
  rationale: Hii inaonyesha moja kwa moja kwamba dansi yake ilimpendeza Herode, kulingana na kitenzi ἀρέσκω pamoja na yambwa katika hali ya dative.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herode
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
