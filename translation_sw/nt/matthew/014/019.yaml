id: MAT.14.19
reference: Matthew 14:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: sw
  text: Baada ya kuwaagiza umati waketi kwa mkao wa kuegemea kwenye nyasi[a], akachukua mikate mitano na samaki wawili, akatazama juu mbinguni, akabariki, kisha akaimega mikate na kuwapa wanafunzi; nao wanafunzi wakawapa umati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akambariki Mungu” au “akasema baraka.” Kigiriki kinasema tu “akabariki,” bila kutaja wazi yambwa wa kitenzi hicho.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: akawaagiza
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; “akawaagiza” ni cha asili katika Kiswahili na kinadumisha nguvu hiyo.
- source_word: τοὺς ὄχλους
  choice: umati
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia nomino ya jamii “umati” kwa watu wengi waliokusanyika.
- source_word: ἀνακλιθῆναι
  choice: wakae kwa kuegemea
  rationale: Huhifadhi maana ya kukaa kwa kuegemea wakati wa kula, badala ya “kuketi” pekee, ambayo ingeondoa kidokezo hicho.
- source_word: ἐπὶ τοῦ χόρτου
  choice: juu ya majani
  rationale: Ni tafsiri ya moja kwa moja ya mahali bila kuongeza wazo la rangi ya kijani lisilokuwapo katika Mathayo.
- source_word: λαβὼν
  choice: akaitwaa
  rationale: “Kutwaa” ni neno la heshima na linaloeleweka kwa tendo la kuichukua mikate pamoja na samaki.
- source_word: τοὺς πέντε ἄρτους
  choice: ile mikate mitano
  rationale: “Mikate” ni namna ya kawaida ya kutaja vipande kamili vya mkate katika Kiswahili; “ile” inaonyesha vitu vilivyotajwa katika muktadha.
- source_word: τοὺς δύο ἰχθύας
  choice: wale samaki wawili
  rationale: Upatanisho wa kisarufi wa Kiswahili kwa viumbe hai unahitaji “wale” na “wawili.”
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: akatazama juu mbinguni
  rationale: Ni usemi wa asili unaohifadhi mwelekeo wa kutazama na maana ya οὐρανός katika muktadha huu.
- source_word: εὐλόγησεν
  choice: akabariki
  rationale: Kigiriki hakitaji yambwa; tafsiri pia haiongezi ikiwa alibariki Mungu, chakula, au alisema baraka.
- source_word: κλάσας
  choice: akaimega mikate
  rationale: “Kumega” ni kitenzi cha kawaida cha kuvunja mkate kwa kugawa; yambwa “mikate” hutolewa na muktadha.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: kuwapa wanafunzi
  rationale: Muktadha unaonyesha kuwa kilichotolewa ni mikate iliyomegwa; muundo huu ni mwepesi na wa asili.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: nao wanafunzi wakawapa umati
  rationale: Kigiriki kinaacha kitenzi cha pili kieleweke, lakini Kiswahili cha kawaida hukirudia ili sentensi iwe wazi.
theological_decisions:
- issue: Yambwa la εὐλόγησεν (“alibariki”)
  choice: 'Kuacha yambwa bila kutajwa: “akabariki”'
  alternative: “Akambariki Mungu,” “akabariki chakula,” au “akasema baraka”
  rationale: Maandishi ya Kigiriki hayataji yambwa. Kuacha kitenzi bila yambwa kunahifadhi utata halisi na huepuka kuamua kimafundisho kile ambacho kifungu hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vifungu mfululizo unadumisha mwendo wa simulizi; “wakae kwa kuegemea” hufafanua desturi ya kula bila kutumia lugha ya kizamani.
