  text: Naye akatuma, akamkata Yohana kichwa gerezani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Naye, baada ya kutuma, alimkata Yohana kichwa gerezani.” Kigiriki kina kitenzi-shirikishi cha aoristi kinachofuatwa na kitenzi kikuu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Basi
  rationale: Kiunganishi kinaendeleza simulizi. “Basi” ni cha kawaida katika masimulizi ya Kiswahili na hapa kinaonyesha mwendelezo bila kuongeza sababu isiyokuwamo.
- source_word: πέμψας
  choice: akatuma watu
  rationale: Kitenzi-shirikishi cha aoristi cha πέμπω kinaonyesha tendo lililotangulia tendo kuu. Nyongeza ya “watu” inaweka wazi kwa Kiswahili kwamba alituma mawakala, bila kudai kwamba Herode mwenyewe ndiye aliyefanya tendo hilo.
- source_word: ἀπεκεφάλισεν
  choice: nao wakamkata ... kichwa
  rationale: ἀποκεφαλίζω humaanisha kukata kichwa. Muundo huu wa Kiswahili unahifadhi maana mahususi na utekelezaji kupitia wale waliotumwa, ingawa Kigiriki kinahusisha tendo hilo moja kwa moja na mtendaji mkuu wa sentensi.
- source_word: τὸν Ἰωάννην
  choice: Yohana
  rationale: Jina pekee ndilo lililo katika chanzo, na muktadha tayari unamtambulisha; hivyo “Yohana Mbatizaji” lingeongeza maneno yasiyokuwamo katika aya.
- source_word: ἐν τῇ φυλακῇ
  choice: gerezani
  rationale: φυλακή hapa ni mahali pa kifungo. “Gerezani” ni usemi wa kawaida na sahihi wa Kiswahili kwa eneo hilo.
theological_decisions:
- issue: Uwajibikaji wa Herode dhidi ya utekelezaji kupitia mawakala
  choice: “akatuma watu, nao wakamkata”
  alternative: “akatuma watu akamkata Yohana kichwa”
  rationale: Kigiriki kinamhusisha Herode kisarufi na tendo kuu huku kitenzi-shirikishi kikidokeza kuwa alituma watu. Kiswahili cha kawaida kinahitaji kuweka wazi zaidi utekelezaji kupitia mawakala, bila kuondoa uwajibikaji wake kama mwenye kuanzisha tendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi “akatuma ... nao wakamkata” ni wa asili na unaonyesha kwa uwazi kuwa tendo lilitekelezwa na wajumbe.
