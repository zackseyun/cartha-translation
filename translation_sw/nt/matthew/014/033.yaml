  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: sw
  text: Basi wale waliokuwa ndani ya mashua wakamwabudu[a], wakisema, “Kweli wewe ni Mwana wa Mungu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamsujudia” au “wakamwinamia kwa heshima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuonyesha heshima kwa kupiga magoti, kusujudu, au kujilaza kifudifudi; hapa muktadha unaunga mkono maana ya “wakamwabudu.”
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kigiriki hakina kibainishi kabla ya neno “Mungu,” lakini katika muktadha huu “Mwana wa Mungu” ni cheo; hakimaanishi tu kwamba yeye ni mwana wa Mungu miongoni mwa wengine.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐν τῷ πλοίῳ
  choice: Basi wale waliokuwa ndani ya mashua
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi; “Basi” kinaonyesha mwendelezo bila kusisitiza tofauti. Kirai hiki kinawataja watu waliokuwa ndani ya mashua.
- source_word: προσεκύνησαν αὐτῷ
  choice: wakamwabudu
  rationale: προσκυνέω inaweza kumaanisha kusujudu, kutoa heshima, au kuabudu. Katika muktadha wa mamlaka ya Yesu juu ya bahari na ungamo linalofuata, “wakamwabudu” ndilo chaguo linalofaa zaidi, huku maana ya tendo la kusujudu ikitajwa katika tanbihi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi kwa njia ya kawaida muundo wa kitenzi-shirikishi cha Kigiriki na kuunganisha tendo la kuabudu na ungamo lao.
- source_word: Ἀληθῶς
  choice: Kweli
  rationale: Neno hili linaonyesha uthibitisho thabiti; “Kweli” ni la kawaida, lenye uzito, na linafaa kwa ungamo hili.
- source_word: θεοῦ υἱὸς
  choice: Mwana wa Mungu
  rationale: Katika muktadha huu kirai kinafanya kazi kama cheo, si kama dai kwamba Yesu ni mmoja tu kati ya wana wengi wa Mungu. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the’ za Kiingereza.
- source_word: εἶ
  choice: wewe ni
  rationale: “Wewe ni” huwasilisha wazi kitenzi na msisitizo wa kiwakilishi uliomo katika muundo wa ungamo hilo.
theological_decisions:
- issue: Maana ya προσκυνέω inapomhusu Yesu
  choice: wakamwabudu
  alternative: wakamsujudia / wakamwinamia kwa heshima
  rationale: Muktadha wa Mathayo—baada ya Yesu kuonyesha mamlaka juu ya bahari na kabla ya kuitwa Mwana wa Mungu—unaunga mkono maana ya kuabudu. Tanbihi inahifadhi pia maana pana ya neno la Kigiriki inayoweza kueleza tendo la kusujudu.
- issue: Udhahiri wa θεοῦ υἱὸς
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Kutokuwapo kwa kibainishi kabla ya θεοῦ hakufanyi kirai hiki kiwe na maana ya ‘mwana mmoja wa Mungu.’ Katika ungamo hili la Mathayo kinatumika kama cheo. Kiswahili hakiwezi kuonyesha tofauti hiyo kwa vibainishi kama Kigiriki au Kiingereza, hivyo tanbihi inaeleza suala hilo bila kulazimisha muundo usio wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mashua” ni neno la kawaida na linaloeleweka; “Basi” linaendeleza simulizi kwa ulaini. Muundo “wakisema” unahifadhi ukaribu na Kigiriki bila kufanya sentensi iwe ngumu.
