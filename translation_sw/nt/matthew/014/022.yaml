base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: sw
  text: Mara moja Yesu akawashurutisha wanafunzi wapande mashua na wamtangulie kwenda ng’ambo, mpaka atakapowaaga makutano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka atakapowatawanya makutano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Mara moja
  rationale: Huwasilisha uharaka wa tendo na mpito wa ghafla katika simulizi kwa Kiswahili cha kawaida.
- source_word: ἠνάγκασεν
  choice: akawashurutisha
  rationale: Kitenzi hiki huhifadhi wazo la msisitizo au ulazima wenye nguvu bila kudokeza lazima matumizi ya nguvu za kimwili.
- source_word: τοὺς μαθητάς
  choice: wanafunzi
  rationale: Muktadha unalitambulisha kundi linalojulikana; Kiswahili hakihitaji kibainishi kinacholingana na artikeli ya Kigiriki.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: waingie mashuani
  rationale: Ni usemi wa asili wa Kiswahili kwa tendo la kupanda au kuingia katika chombo hicho.
- source_word: πλοῖον
  choice: mashuani
  rationale: Muktadha unaonyesha mashua maalumu inayojulikana, jambo linalowasilishwa kiasili kwa ngeli na hali ya mahali.
- source_word: προάγειν αὐτόν
  choice: watangulie
  rationale: Kitenzi ‘kutangulia’ kinawasilisha kwa ufupi na kwa kawaida maana ya kwenda mbele yake; anayelengwa anaeleweka kuwa Yesu.
- source_word: εἰς τὸ πέραν
  choice: kwenda ng’ambo
  rationale: ‘Ng’ambo’ ni tafsiri ya kawaida na iliyo wazi ya upande wa pili wa maji.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: huku yeye akiwaaga
  rationale: Muundo huu unaonyesha kwamba Yesu alibaki ili kuwaondoa makutano, ingawa hauakisi kwa ukakamavu muundo wa mpaka wa wakati wa Kigiriki.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: akiwaaga makutano
  rationale: ‘Kuwaaga’ ni lugha ya asili kwa kuwapa ruhusa waondoke; tanbihi huhifadhi mbadala ulio wazi zaidi wa ‘kuwatawanya/kuwaondoa.’
- source_word: ὄχλους
  choice: makutano
  rationale: ‘Makutano’ ni neno la heshima na linalotambulika katika sajili ya Biblia, huku likiweka wazo la umati mkubwa; idadi ya makundi haionekani wazi kimofolojia katika Kiswahili.
