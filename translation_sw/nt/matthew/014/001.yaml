lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili, unaowasilisha maana ya kishazi cha Kigiriki bila kufuata muundo wake kwa ugumu.
- source_word: ἤκουσεν
  choice: alisikia
  rationale: Kitenzi hiki kwa maana yake ya moja kwa moja ni ‘alisikia’; tafsiri kama ‘alipata kujua’ ingeongeza ufafanuzi usio lazima.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Hili ndilo umbo la kawaida la jina hilo katika tafsiri za Biblia za Kiswahili.
- source_word: ὁ τετραάρχης
  choice: mtawala wa robo
  rationale: Cheo hiki kihistoria kilimhusu mtawala wa sehemu ya eneo; tafsiri hii inaeleweka kuliko mkopo adimu ‘tetrarki’ huku ikihifadhi wazo la cheo hicho.
- source_word: τὴν ἀκοὴν
  choice: habari
  rationale: Katika muktadha huu neno linamaanisha jambo lililosikiwa, yaani habari au taarifa, si uwezo wa kusikia.
- source_word: Ἰησοῦ
  choice: kuhusu Yesu
  rationale: Huwasilisha kwa Kiswahili cha kawaida uhusiano wa genitivi unaoonyesha habari hizo zilimhusu Yesu.
