  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: sw
  text: Kwa maana Herode alikuwa amemkamata Yohana[a], akamfunga na kumweka gerezani kwa sababu ya Herodia, mke wa Filipo, ndugu yake Herode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akiisha kumkamata Yohana, alimfunga na kumweka gerezani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza kazi ya neno hilo ya kutoa sababu au ufafanuzi unaounganisha mstari huu na yaliyotangulia.
- source_word: κρατήσας
  choice: alikuwa amemkamata
  rationale: Kauli ya kushiriki iliyotangulia vitenzi vikuu inaonyesha tendo lililotokea kwanza; ‘kumkamata’ linafaa katika muktadha wa kumweka mtu chini ya ulinzi.
- source_word: ἔδησεν
  choice: akamfunga
  rationale: Inahifadhi maana halisi ya kumfunga bila kubainisha isivyohitajika kama alifungwa kwa kamba au minyororo.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: kumweka gerezani
  rationale: Ni Kiswahili cha kawaida na wazi kwa kitendo cha kumtia mtu katika kifungo cha gereza.
- source_word: διὰ Ἡρῳδιάδα
  choice: kwa sababu ya Herodia
  rationale: διά pamoja na hali ya kushutumu hapa huonyesha sababu au chanzo cha hatua hiyo.
- source_word: γυναῖκα
  choice: mke
  rationale: Katika uhusiano huu wa kifamilia, γυνή humaanisha mke, si mwanamke kwa ujumla.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: wa Filipo ndugu yake
  rationale: Inahifadhi uhusiano wa maelezo katika Kigiriki na kuonyesha kwamba Filipo alikuwa ndugu ya Herode, huku ikisalia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kueleza kihistoria na kimaadili uhusiano wa Herodia na Filipo
  choice: Herodia, mke wa Filipo ndugu yake
  alternative: Herodia, mke wa ndugu yake Filipo
  rationale: Mstari huu unamtambulisha Herodia kwa uhusiano wake na Filipo bila kutamka moja kwa moja hapa kwamba uhusiano mwingine ulikuwa kinyume cha sheria; hukumu hiyo haipaswi kutangulizwa kutoka mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa vitenzi umewekwa kwa namna ya kawaida ya Kiswahili huku tendo la kukamatwa likionyeshwa kuwa lilitangulia kufungwa na kuwekwa gerezani.
