  text: Nao walipoingia katika mashua[a], upepo ukakoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi na Kigiriki, “baada ya kupanda kuingia katika mashua.”
