lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza masimulizi kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἀναβάντων αὐτῶν
  choice: walipopanda
  rationale: Muundo huu wa Kigiriki unaonyesha wakati; katika Kiswahili, 'walipopanda' ni wa asili na huhifadhi wazo la kupanda na kuingia katika chombo.
- source_word: εἰς τὸ πλοῖον
  choice: mashuani
  rationale: Katika mazingira ya Ziwa la Galilaya, πλοῖον ni chombo kidogo cha uvuvi; 'mashua' linafaa zaidi kuliko 'meli'. Muundo wa mahali 'mashuani' unasomeka kwa urahisi.
- source_word: ἐκόπασεν
  choice: ukatulia
  rationale: Kitenzi kina maana ya kukoma au kupungua, hasa kuhusu upepo. 'Ukatulia' ni usemi wa kawaida wa Kiswahili usiodokeza mchakato zaidi ya tukio lenyewe.
- source_word: ὁ ἄνεμος
  choice: upepo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino hiyo katika muktadha.
theological_decisions:
- issue: Dokezo la mamlaka ya Yesu juu ya maumbile
  choice: Tukio limesimuliwa wazi bila kuongeza maelezo ya kitheolojia.
  alternative: Kuongeza maneno yanayosisitiza kwamba kutulia kwa upepo kulikuwa tendo la kimiujiza la Yesu.
  rationale: Muktadha unaonyesha umuhimu wa kitheolojia, lakini mstari wenyewe unasema tu kwamba walipopanda mashuani upepo ulitulia; tafsiri haipaswi kuongeza maelezo yasiyomo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mashua' limetumiwa badala ya 'meli' ili kuonyesha chombo cha uvuvi kinachofaa mazingira ya simulizi.
