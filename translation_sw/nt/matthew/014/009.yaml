  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: sw
  text: Ingawa mfalme alihuzunika, kwa sababu ya viapo vyake na wale waliokula pamoja naye[a], aliamuru apewe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliokuwa wameegemea mezani pamoja naye.” Kigiriki kinaonyesha mkao uliokuwa wa kawaida wakati wa kula katika kipindi hicho.
    reason: cultural_note
  - marker: b
    text: Kigiriki hakitaji wazi kitu kilichoamriwa kitolewe; kinarejelea ombi lililotajwa katika muktadha uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Ingawa ... alihuzunika
  rationale: Kirai cha kitenzi cha wakati uliopita kinaonyesha kwamba mfalme alipatwa na huzuni. Muundo wa ‘Ingawa’ unaonyesha mvutano wa kimuktadha kati ya huzuni yake na amri aliyotoa baadaye.
- source_word: ὁ βασιλεὺς
  choice: mfalme
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili kwa βασιλεύς, na linahifadhi cheo kilichotumiwa katika simulizi.
- source_word: διὰ τοὺς ὅρκους
  choice: kwa sababu ya viapo vyake
  rationale: 'διά pamoja na hali ya kushutumiwa huonyesha sababu. Kivumishi ‘vyake’ kinatokana wazi na muktadha: viapo hivyo vilikuwa vya mfalme.'
- source_word: τοὺς συνανακειμένους
  choice: wale waliokula pamoja naye
  rationale: Neno hilo linawahusu waliokuwa wameegemea mezani pamoja naye wakati wa chakula. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na inahifadhi maana ya kushiriki mlo bila kulazimisha picha ya mkao wa kale katika matini kuu.
- source_word: ἐκέλευσεν
  choice: aliamuru
  rationale: κελεύω humaanisha kuamuru au kutoa agizo; ‘aliamuru’ ni fupi, wazi, na inafaa usimulizi wenye hadhi.
- source_word: δοθῆναι
  choice: apewe
  rationale: Kitenzi-jina hiki ni cha kutendwa na humaanisha ‘kupewa/kutolewa.’ ‘Apewe’ ni muundo wa kawaida wa Kiswahili unaoacha kitu kinachotolewa bila kutajwa, kama ilivyo katika Kigiriki, huku muktadha ukionyesha mpokeaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaeleweka kwa wasomaji wa kawaida, huku ukihifadhi maana iliyodokezwa badala ya kutaja wazi kitu kilichoombwa.
