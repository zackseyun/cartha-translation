id: MAT.14.8
reference: Matthew 14:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: sw
  text: Naye, akiwa ameshawishiwa na mama yake, anasema, “Nipe hapa kwenye sinia kichwa cha Yohana Mbatizaji.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: akiwa ameshawishiwa
  rationale: Huwasilisha ushawishi wa awali wa mama kwa lugha ya kawaida, huku hali ya kutendwa katika kitenzi cha Kigiriki ikihifadhiwa.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: na mama yake
  rationale: Katika muundo wa kutendwa, kirai hiki humtaja mama kuwa mtendaji wa ushawishi huo.
- source_word: Δός μοι
  choice: Nipe
  rationale: Ni amri ya moja kwa moja na ndiyo namna ya kawaida ya kusema ‘nipe’ katika Kiswahili.
- source_word: φησίν
  choice: anasema
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umehifadhiwa ili kudumisha uhai wa simulizi.
- source_word: ὧδε
  choice: hapa
  rationale: Huhifadhi rejeo la moja kwa moja la mahali, na huenda pia likadokeza kutakiwa jambo hilo litimizwe papo hapo.
- source_word: ἐπὶ πίνακι
  choice: kwenye sinia
  rationale: ‘Sinia’ linafaa kwa chombo cha kuwekea na kuandalia chakula katika mazingira ya karamu; ‘kwenye’ ni ya asili zaidi kuliko tafsiri ngumu ya kihusishi.
- source_word: τὴν κεφαλὴν
  choice: kichwa
  rationale: Huhifadhi waziwazi maelezo makali yaliyomo katika simulizi.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohana Mbatizaji
  rationale: ‘Mbatizaji’ ni jina la cheo linaloeleza kazi ya Yohana na ni Kiswahili sanifu kinachoeleweka.
theological_decisions:
- issue: Tafsiri ya cheo βαπτιστής cha Yohana
  choice: Yohana Mbatizaji
  alternative: Yohana Mbatiza
  rationale: ‘Mbatizaji’ huhifadhi maana ya nomino ya mtendaji katika Kigiriki, ni ya kawaida katika Kiswahili cha Biblia, na haibadili cheo hicho kuwa jina lisiloeleza kazi yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akiwa ameshawishiwa’ ni wa asili huku ukihifadhi hali ya kutendwa; ‘anasema’ inadumisha wakati uliopo wa kihistoria wa chanzo.
