  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: sw
  text: Lakini mara moja Yesu akawaambia, “Jipeni moyo; ni mimi.[a] Msiogope.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi ndiye.” Kigiriki kinaweza kuwa njia ya kawaida ya kujitambulisha hapa, ingawa baadhi ya wasomaji husikia mwangwi unaowezekana wa jinsi Mungu anavyojitambulisha.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: mara moja
  rationale: Huwasilisha wazi maana ya wakati ya tendo kutokea bila kuchelewa kwa Kiswahili cha sasa.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha geuko lenye utofautishaji mdogo kutoka kwa hofu ya wanafunzi katika mstari uliotangulia.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Yesu akasema nao
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha tendo la Yesu kuzungumza nao bila kurudia kwa uzito ‘akizungumza, akisema.’
- source_word: Θαρσεῖτε
  choice: Jipeni moyo
  rationale: Amri ya wingi inayowataka wawe na ujasiri; usemi huu ni wa kawaida, unaeleweka, na una sauti ya kutia moyo.
- source_word: ἐγώ εἰμι
  choice: ni mimi
  rationale: Katika muktadha wa karibu Yesu anajitambulisha kwa wanafunzi walioingiwa na hofu. Tafsiri hii ni ya kawaida katika Kiswahili, huku tafsiri halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: μὴ φοβεῖσθε
  choice: Msiogope
  rationale: Ni amri ya wingi ya kawaida na ya moja kwa moja inayokataza hofu bila kubainisha kupita kiasi hali ya tendo.
theological_decisions:
- issue: Iwapo ἐγώ εἰμι itafsiriwe kama kujitambulisha kwa kawaida au kama mwangwi wa wazi wa kauli ya Mungu ya kujitambulisha
  choice: Katika matini kuu imetafsiriwa “ni mimi,” kulingana na maana ya moja kwa moja ya simulizi.
  alternative: “Mimi niko” ni tafsiri halisi zaidi, ambayo baadhi ya wasomaji wanaweza kuisikia kuwa mwangwi wa jinsi Mungu anavyojitambulisha.
  rationale: Muktadha wa karibu unaonyesha Yesu akiwatuliza wanafunzi kwa kujitambulisha. Tanbihi inahifadhi muundo halisi na uwezekano wa mwangwi wa kiteolojia bila kuulazimisha katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jipeni moyo” ni himizo la kawaida na linaloeleweka; “Msiogope” huhifadhi wingi unaowalenga wanafunzi. Alama ya tanbihi imewekwa mara tu baada ya “ni mimi” ili ionyeshe wazi maneno yanayofafanuliwa.
