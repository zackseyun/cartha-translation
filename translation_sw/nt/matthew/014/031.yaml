id: MAT.14.31
reference: Matthew 14:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: sw
  text: Mara Yesu akanyosha mkono wake, akamshika, akamwambia, “Wewe mwenye imani haba, kwa nini uliona shaka?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulisita?” Kitenzi cha Kigiriki kinaweza kumaanisha kusita au kuyumba, na pia kuwa na shaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Mara
  rationale: Neno hili linaonyesha kwamba Yesu alitenda bila kuchelewa na linadumisha kasi ya simulizi kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki ni cha mpito na kinaweza kuwa na tofauti ndogo ya kimawazo; hakihitaji kutafsiriwa wazi hapa kwa sababu mtiririko wa simulizi unatosha.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: akanyosha mkono wake
  rationale: Tafsiri hii inadumisha picha halisi ya Yesu kuunyosha mkono na inaingia kwa kawaida katika mfuatano wa vitenzi vya simulizi.
- source_word: ἐπελάβετο αὐτοῦ
  choice: akamshika
  rationale: Inaeleza tendo la kumkamata au kumshikilia Petro bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, mfululizo wa wakati uliopita kwa kiambishi -ka- ni wa kawaida na wenye uhai katika simulizi la Kiswahili.
- source_word: Ὀλιγόπιστε
  choice: Wewe mwenye imani haba
  rationale: Inasema kwamba imani ya Petro ilikuwa pungufu, si kwamba hakuwa na imani kabisa; pia inadumisha namna ya moja kwa moja ya kumsemesha.
- source_word: εἰς τί
  choice: kwa nini
  rationale: Hii ndiyo namna ya kawaida na wazi ya kuuliza sababu katika Kiswahili.
- source_word: ἐδίστασας
  choice: uliona shaka
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayowasilisha maana ya kuwa na shaka, huku tanbihi ikihifadhi maana nyingine inayowezekana ya kusita au kuyumba.
theological_decisions:
- issue: Maana ya Ὀλιγόπιστε kuhusiana na πίστις
  choice: Wewe mwenye imani haba
  alternative: Wewe uliye na imani kidogo
  rationale: Chaguo hili linadumisha msisitizo wa imani iliyopungua bila kuifanya lawama hiyo imaanishe kutokuwa na imani kabisa.
- issue: Wigo wa maana ya ἐδίστασας
  choice: uliona shaka
  alternative: ulisita / uliyumba
  rationale: “Uliona shaka” ni wazi na ya kawaida, lakini kitenzi cha Kigiriki pia kinaweza kueleza kusita au kuyumba; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mfululizo wa vitenzi wenye kiambishi -ka- umetumiwa ili simulizi lisikike la kawaida na lenye mwendo.
