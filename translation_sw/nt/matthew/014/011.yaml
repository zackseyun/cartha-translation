  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vinavyofuatana kwa “-ka-” unatoa mtiririko wa kawaida wa kisimulizi huku ukihifadhi hali ya kutendwa katika vitenzi viwili vya kwanza.
