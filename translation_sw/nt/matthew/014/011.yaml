  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: sw
  text: Kichwa chake kikaletwa juu ya sinia[a] na kikapewa yule msichana, naye akakipeleka kwa mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya sahani kubwa ya kuandalia chakula.” Neno la Kigiriki πίναξ humaanisha sinia au sahani kubwa ya kuandalia au kubebea chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: kikaletwa
  rationale: Kitenzi hiki ni aoristi tendwa cha φέρω. “Kikaletwa” kinahifadhi hali ya kutendwa na kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: κεφαλὴ αὐτοῦ
  choice: kichwa chake
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha Kigiriki; hakuna sababu ya kutumia lugha ya kuficha ukali wa tukio.
- source_word: ἐπὶ πίνακι
  choice: juu ya sinia
  rationale: πίναξ hapa ni chombo kipana cha kuandalia au kubebea chakula. “Sinia” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: ἐδόθη
  choice: kikapewa
  rationale: Kitenzi hiki ni aoristi tendwa cha δίδωμι. “Kikapewa” kinadumisha hali ya kutendwa na kinaonyesha mfuatano wa matukio.
- source_word: τῷ κορασίῳ
  choice: yule msichana
  rationale: κοράσιον humaanisha msichana. “Yule msichana” ni ya asili katika muktadha huu na huepuka neno la kizamani.
- source_word: ἤνεγκεν
  choice: akakipeleka
  rationale: Aoristi tendaji ya φέρω inaeleza kwamba msichana alikichukua kichwa hicho hadi kwa mama yake. “Akakipeleka” ni ya kawaida kwa Kiswahili na kiambishi “-ki-” kinaweka wazi kitu kinachorejelewa.
- source_word: τῇ μητρὶ αὐτῆς
  choice: kwa mama yake
  rationale: Kirai hiki cha dativu kinamrejelea mama wa msichana kwa njia iliyo wazi na ya kawaida katika Kiswahili.
theological_decisions: []
