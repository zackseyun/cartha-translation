  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: sw
  text: Wote wakala wakashiba. Kisha wakaokota vikapu kumi na viwili vilivyojaa vipande vilivyobaki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vipande vilivyovunjika.” Neno la Kigiriki linaweza kumaanisha vipande vilivyobaki baada ya mlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: wakala
  rationale: Kauli ya wakati uliopita katika simulizi; “wakala” ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kula.
- source_word: πάντες
  choice: wote
  rationale: Hudumisha maana ya kuwahusisha watu wote waliokula bila kuongezea ufafanuzi usio katika Kigiriki.
- source_word: ἐχορτάσθησαν
  choice: wakashiba
  rationale: Kitenzi hiki hapa humaanisha kula mpaka kutosheka. “Wakashiba” ni Kiswahili cha kawaida, sahihi, na huonyesha utoshelevu kamili.
- source_word: ἦραν
  choice: wakaokota
  rationale: Katika muktadha wa kukusanya masalio baada ya chakula, “wakaokota” huwasilisha kwa kawaida wazo la kuinua au kuchukua vipande vilivyokuwa vimebaki.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: vipande vilivyobaki
  rationale: Huunganisha kwa Kiswahili cha kawaida kile kilichozidi na vipande vya chakula. Maana ya vipande vilivyomegwa au kuvunjwa imeelezwa katika tanbihi bila kulazimisha usemi mzito katika matini kuu.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: vikajaa vikapu kumi na viwili
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba vipande vilivyokusanywa vilitosha kujaza vikapu kumi na viwili, huku ukihifadhi idadi na hali ya vikapu kuwa vimejaa.
theological_decisions:
- issue: Muujiza wa kulisha watu unaelezwa kwa lugha ya kawaida ya kushiba
  choice: wakashiba
  alternative: wakajaa
  rationale: “Wakashiba” huhifadhi maana ya watu kula hadi kutosheka bila kuongeza maelezo ya kitheolojia au kupunguza ukubwa wa utoaji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Mfuatano wa “wakala wakashiba, kisha wakaokota” unasomeka kwa urahisi katika simulizi, na “vikajaa vikapu” huepuka usemi usio wa kawaida wa kuokota vikapu badala ya vipande.
