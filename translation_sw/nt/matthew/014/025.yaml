base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: sw
  text: Wakati wa zamu ya nne ya usiku,[a] Yesu akawajia, akitembea juu ya bahari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Zamu ya nne ya usiku” ilikuwa zamu ya mwisho ya usiku, takribani kati ya saa tisa usiku na saa kumi na mbili asubuhi (3:00–6:00 alfajiri) katika mfumo wa Kirumi.
    reason: cultural_note
  - marker: b
    text: Kirai hiki humaanisha kutembea juu ya uso wa maji. Wengine wamependekeza maana ya “akitembea kando ya bahari,” lakini muktadha unaunga mkono kwa nguvu kutembea juu ya maji yenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: Wakati wa zamu ya nne ya usiku
  rationale: Kirai cha wakati kinaonyesha tendo lilitokea lini. “Zamu” ni neno la kawaida la Kiswahili linalodumisha mfumo wa kale wa kugawa usiku katika vipindi vya ulinzi.
- source_word: δὲ
  choice: (imewakilishwa na mtiririko wa simulizi)
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi; Kiswahili cha kawaida hakihitaji kila mara kiunganishi cha wazi katika nafasi hii.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Yesu akawajia
  rationale: Kitenzi “akawajia” kinaonyesha kwa ufupi na kwa kawaida mwendo ulioelekezwa kwao. Jina “Yesu” limetumiwa badala ya kiwakilishi ili kurejesha mhusika kwa uwazi katika mstari unaosimama peke yake.
- source_word: περιπατῶν
  choice: akitembea
  rationale: Umbo endelevu linaonyesha tendo lililokuwa likifanyika wakati uleule alipowajia.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: juu ya bahari
  rationale: Katika muktadha huu kirai kinaonyesha kutembea juu ya uso wa maji. “Bahari” huhifadhi maana ya kawaida ya θάλασσα katika simulizi, bila kuibadili kuwa “ziwa.”
theological_decisions:
- issue: Maelezo ya mwendo wa Yesu juu ya maji
  choice: akitembea juu ya bahari
  alternative: akitembea kando ya bahari
  rationale: Muundo wa Kigiriki na muktadha unaunga mkono kwa nguvu mwendo juu ya maji, si kutembea ufukweni. Tafsiri inadumisha maana hiyo bila kupunguza wala kuongeza hali yake ya kimiujiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa, lugha ya kawaida lakini yenye hadhi. “Zamu” imechaguliwa badala ya istilahi nzito zaidi ya kijeshi; maelezo ya saa yamewekwa katika tanbihi.
