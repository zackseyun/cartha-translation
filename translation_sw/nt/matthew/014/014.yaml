  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: sw
  text: Aliposhuka mashuani[a], aliona umati mkubwa, akawahurumia na kuwaponya wagonjwa wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “alipotoka” au “alipokwenda nje.” Katika muktadha huu, inaelekea kwamba alishuka kutoka chomboni mpaka ufukweni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Aliposhuka kutoka mashuani
  rationale: Kitenzi kishirikishi humaanisha kihalisi ‘alipotoka,’ lakini muktadha wa kuwasili kwa mashua unaonyesha kutoka mashuani. Hii ni Kiswahili cha kawaida kinachoeleza tendo kwa uwazi bila kulifanya jambo lisilotajwa moja kwa moja kuwa sehemu ya matini bila tanbihi.
- source_word: εἶδεν
  choice: aliona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kuona.
- source_word: πολὺν ὄχλον
  choice: umati mkubwa
  rationale: ‘Umati’ huwakilisha mkusanyiko mkubwa wa watu, na ‘mkubwa’ huhifadhi nguvu ya πο بص?λύς kwa Kiswahili cha kawaida.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: akawahurumia
  rationale: Kitenzi hiki huonyesha huruma ya ndani na yenye nguvu. ‘Akawahurumia’ ni kauli ya asili, fupi, na yenye heshima katika Kiswahili, bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐθεράπευσεν
  choice: kuwaponya
  rationale: Katika muktadha huu θεραπεύω inahusu kuondoa ugonjwa; ‘kuwaponya’ ndiyo tafsiri ya kawaida na wazi.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: wagonjwa wao
  rationale: Huhifadhi kwa ufupi kivumishi kilichotumika kama nomino pamoja na kiwakilishi αὐτῶν, yaani watu wagonjwa waliokuwa miongoni mwao.
theological_decisions:
- issue: Namna ya kueleza mwitikio wa kihisia wa Yesu
  choice: akawahurumia
  alternative: moyo wake ukajaa huruma kwa ajili yao
  rationale: Chaguo hili huhifadhi msisitizo wa matini juu ya huruma ya Yesu kama inayoongoza kwenye uponyaji, lakini haliongezi taswira au kiwango cha hisia kisichoelezwa wazi na kitenzi chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni mfupi na wa kisimulizi. ‘Umati mkubwa,’ ‘akawahurumia,’ na ‘wagonjwa wao’ ni maneno yanayoeleweka kwa urahisi bila kuwa ya mazungumzo kupita kiasi.
