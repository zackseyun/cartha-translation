  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: sw
  text: Petro akamjibu, “Bwana, ikiwa ni wewe, niamuru nije kwako juu ya maji.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Petro akamjibu
  rationale: Muundo huu wa kawaida wa masimulizi unaelezwa kwa Kiswahili cha asili kwa ‘Petro akamjibu.’ Kiambishi ‘-ka-’ kinaendeleza simulizi, na ‘-m-’ kinawakilisha αὐτῷ bila kurudia kitenzi ‘akasema’ kisicho cha lazima katika Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida la Kiswahili kwa κύριος katika kumwita Yesu; linahifadhi heshima na uzito unaowezekana wa kikristolojia bila kuufafanua kupita maandishi.
- source_word: εἰ σὺ εἶ
  choice: ikiwa ni wewe
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kuthibitisha utambulisho wa mtu katika muktadha huu.
- source_word: κέλευσόν με
  choice: niamuru
  rationale: Kitenzi ‘amuru’ kinahifadhi nguvu ya agizo lenye mamlaka katika κελεύω, huku kiambishi ‘ni-’ kikionyesha kwamba Petro ndiye anayeomba kuagizwa.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: nije kwako
  rationale: ‘Nije kwako’ ni Kiswahili cha asili kwa mwendo unaomwelekea anayesemeshwa na huhifadhi mtazamo wa Petro akiwa mbali na Yesu.
- source_word: ἐπὶ τὰ ὕδατα
  choice: juu ya maji
  rationale: Kwa Kiswahili, ‘maji’ tayari ni nomino ya wingi/kusanyiko na ni tafsiri ya kawaida ya ὕδατα; ‘juu ya maji’ linaeleza kwa usahihi mwendo juu ya uso wa maji.
theological_decisions:
- issue: Uzito wa κύριε Petro anapomwita Yesu
  choice: Bwana
  alternative: Mwalimu; Mheshimiwa
  rationale: ‘Bwana’ huhifadhi uwezekano wa maana inayozidi heshima ya kawaida katika Injili ya Mathayo, bila kulazimisha hitimisho mahususi la kikristolojia katika mstari huu.
- issue: Maana ya εἰ σὺ εἶ
  choice: ikiwa ni wewe
  alternative: kama wewe ndiye
  rationale: ‘Ikiwa ni wewe’ huhifadhi umbo la sharti na suala la utambulisho bila kudokeza kwamba Petro anamkana Yesu au kwamba tayari ana uhakika kamili.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa simulizi wenye ‘akamjibu’ unasomeka kwa urahisi. Hakuna tanbihi inayohitajika: tofauti ya umoja/wingi ya ‘water/waters’ haiwezi kuhamishwa moja kwa moja kwa Kiswahili kwa sababu ‘maji’ kwa kawaida ni nomino ya wingi/kusanyiko.'
