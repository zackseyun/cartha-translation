  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: sw
  text: Wanafunzi wake wakaja, wakauchukua mwili[a] na kumzika; kisha wakaenda wakamjulisha Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maiti.” Neno la Kigiriki linamaanisha mwili wa mtu aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: wakaja
  rationale: Kitenzi hiki hapa kinaanzisha tendo la wanafunzi baada ya kifo cha Yohana. “Wakaja” ni cha kawaida na cha asili katika simulizi la Kiswahili; wazo la kukaribia linaeleweka katika muktadha.
- source_word: μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hawa ni wanafunzi wa Yohana Mbatizaji kulingana na muktadha. “Wanafunzi” linadumisha maana ya watu wanaojifunza na kumfuata mwalimu.
- source_word: ἦραν
  choice: wakauchukua
  rationale: αἴρω inaweza kumaanisha kuinua au kuchukua. Katika muktadha wa maziko, “wakauchukua” ni ya asili bila kuongeza maelezo yasiyotajwa.
- source_word: πτῶμα
  choice: mwili
  rationale: Neno hili linamaanisha mwili wa mtu aliyekufa. “Mwili” linafaa kwa simulizi lenye heshima, huku tanbihi ikibainisha maana ya moja kwa moja kuwa maiti.
- source_word: ἔθαψαν αὐτόν
  choice: kumzika
  rationale: θάπτω humaanisha kuzika. Kiambishi cha mtu katika “kumzika” kinadumisha kwamba walimzika yeye, bila kuongeza habari ya kaburi isiyomo katika mstari.
- source_word: ἐλθόντες
  choice: kisha wakaenda
  rationale: Kirai hiki kinaonyesha hatua iliyofuata na mwendo wao. Kiswahili cha simulizi hutumia kwa ufasaha “kisha wakaenda.”
- source_word: ἀπήγγειλαν
  choice: wakamweleza
  rationale: Kitenzi hiki humaanisha kutoa taarifa au kueleza habari. “Wakamweleza” ni cha kawaida katika Kiswahili na kinaacha yaliyosemwa yaeleweke kutokana na muktadha, kama ilivyo katika Kigiriki.
- source_word: τῷ Ἰησοῦ
  choice: Yesu
  rationale: “Yesu” ndilo umbo sanifu la jina Ἰησοῦς katika Kiswahili.
theological_decisions:
- issue: Wanaotajwa kwa maneno “wanafunzi wake” ni akina nani?
  choice: Maneno yameachwa kuwa “wanafunzi wake,” yakimaanisha wanafunzi wa Yohana Mbatizaji katika muktadha.
  alternative: Kuwataja wazi kuwa “wanafunzi wa Yohana,” au kuyafasiri kuwa wanafunzi wa Yesu.
  rationale: Kiima kinachorejelewa kwa karibu ni Yohana Mbatizaji, ambaye kifo chake kinasimuliwa katika mistari iliyotangulia. Hata hivyo, tafsiri inadumisha muundo wa Kigiriki badala ya kuweka jina lisilotajwa katika mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfululizo wa vitenzi vya “waka-” unadumisha mwendo wa simulizi; nukta mkato inatenganisha maziko na hatua ya kwenda kumpa Yesu habari.
