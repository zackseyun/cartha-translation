  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: sw
  text: Kwa hiyo, kwa kiapo akaahidi kumpa chochote atakachoomba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote ambacho angeomba.” Kigiriki kina kirai cha kiwakilishi kisichobainisha (ὃ ἐὰν αἰτήσηται), kinachoonyesha ombi lolote la baadaye lisilowekewa mipaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo au hitimisho linalotokana na yaliyotangulia; “Kwa hiyo” ni cha kawaida na kinahifadhi nguvu hiyo.
- source_word: μετὰ ὅρκου
  choice: kwa kiapo
  rationale: Kirai hiki kinaonyesha kwamba ahadi ilithibitishwa kwa kuapa; “kwa kiapo” ni cha asili, kifupi, na chenye hadhi katika Kiswahili.
- source_word: ὡμολόγησεν
  choice: akaahidi
  rationale: Katika muktadha huu kitenzi kina maana ya kutoa ahadi thabiti, si kukiri. Umbo la masimulizi “akaahidi” linaendeleza mtiririko wa simulizi.
- source_word: αὐτῇ δοῦναι
  choice: kumpa
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja pamoja na kitenzi-jina cha kutoa vinaweza kutafsiriwa kwa kawaida kwa neno moja “kumpa,” huku mhusika wa kike akibaki wazi kutokana na muktadha.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: chochote ambacho angeomba
  rationale: Muundo wa kiwakilishi kisichobainisha pamoja na ἐάν na hali tegemezi unaeleza ombi la baadaye lisilo na mipaka iliyowekwa; “angeomba” huhifadhi uwezekano huo bila kuufanya ombi kuwa tayari limetolewa.
