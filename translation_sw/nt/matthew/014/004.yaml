  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: sw
  text: Kwa maana Yohana alikuwa akimwambia, “Si halali[a] kwako kuwa naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huruhusiwi kuwa naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akimwambia
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au lililorudiwa; muundo huu wa Kiswahili unawasilisha nguvu hiyo kwa njia ya kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa maelezo ya msingi kuhusu yaliyotangulia, na ‘Kwa maana’ kinahifadhi uhusiano huo.
- source_word: αὐτῷ
  choice: -mw- katika ‘akimwambia’
  rationale: Kiambishi cha yambwa kinawasilisha kwa kawaida maana ya ‘kumwambia yeye’ bila kulazimisha kiwakilishi tofauti.
- source_word: ὁ Ἰωάννης
  choice: Yohana
  rationale: Chanzo kinamtaja kwa jina tu, na muktadha wa karibu tayari unamtambulisha.
- source_word: Οὐκ ἔξεστίν
  choice: Si halali
  rationale: Usemi huu unaonyesha kutoruhusiwa kwa msingi wa sheria au maadili; ‘Si halali’ huhifadhi uzito huo kuliko usemi wa jumla kama ‘Si sawa.’
- source_word: σοι
  choice: kwako
  rationale: Pamoja na usemi usio na nafsi ‘Si halali,’ ‘kwako’ huonyesha kwa kawaida mtu ambaye jambo hilo haliruhusiwi kwake.
- source_word: ἔχειν
  choice: kuwa na
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwa na mwanamke katika uhusiano wa kindoa, lakini tafsiri hii inadumisha namna fupi ya chanzo bila kuongeza wazi ‘kama mke.’
- source_word: αὐτήν
  choice: -ye katika ‘naye’
  rationale: Kiwakilishi hiki kinamrejelea moja kwa moja Herodia; ‘naye’ ni njia ya kawaida ya Kiswahili ya kusema ‘kuwa na yeye.’
theological_decisions:
- issue: Asili ya karipio la Yohana
  choice: “Si halali kwako kuwa naye” kama katazo lenye nguvu ya kisheria na kimaadili.
  alternative: “Si sawa kwako kuwa naye” au “Huruhusiwi kuwa naye.”
  rationale: ἔξεστιν inahusu jambo linaloruhusiwa au lililo halali. Muktadha unaonyesha Yohana anakemea uhusiano wa Herode kwa msingi wa sheria ya maadili; ‘Si halali’ huhifadhi nguvu hiyo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘alikuwa akimwambia’ ni wa kawaida na unaonyesha tendo lililoendelea au kurudiwa; ‘kuwa naye’ huhifadhi ufupi na kiwango cha kutobainisha wazi kilicho katika Kigiriki.
