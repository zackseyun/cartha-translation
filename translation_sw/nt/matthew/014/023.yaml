  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: sw
  text: Baada ya kuwaaga makutano, alipanda mlimani akiwa peke yake ili kusali. Ilipofika jioni, alikuwa huko peke yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας
  choice: Baada ya kuwaaga
  rationale: Kitenzi kishirikishi cha wakati uliopita kinatangulia tendo kuu na hapa kina maana ya wakati. Katika muktadha huu, “kuwaaga” huonyesha kwamba Yesu aliwaruhusu makutano waondoke bila kuongeza wazo la kuwafukuza.
- source_word: τοὺς ὄχλους
  choice: makutano
  rationale: Neno hili humaanisha vikundi vya watu waliokusanyika. “Makutano” ni neno la kawaida na lenye heshima katika Kiswahili cha Biblia, huku likibeba maana ya mkusanyiko mkubwa.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: alipanda mlimani
  rationale: Usemi huu unaonyesha kwenda juu kuelekea eneo la mlima. “Alipanda mlimani” ni wa asili katika Kiswahili na hauongezi madai kwamba alifika kileleni.
- source_word: κατ’ ἰδίαν
  choice: akiwa peke yake
  rationale: Kirai kinaweza kumaanisha faraghani au bila wengine. Hapa “akiwa peke yake” linaendana na muktadha na linatofautishwa kwa kawaida na μόνος katika sentensi inayofuata.
- source_word: προσεύξασθαι
  choice: ili kusali
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kupanda kwake. “Ili kusali” hutoa kusudi hilo kwa uwazi na lugha ya kawaida.
- source_word: ὀψίας δὲ γενομένης
  choice: Ilipofika jioni
  rationale: Muundo huu wa Kigiriki unaonyesha hali ya wakati. “Ilipofika jioni” ni usemi wa kawaida wa Kiswahili unaohifadhi mpito wa wakati.
- source_word: μόνος ἦν ἐκεῖ
  choice: alikuwa huko peke yake
  rationale: “Peke yake” huhifadhi msisitizo wa μόνος juu ya upweke wake, na “huko” huwakilisha ἐκεῖ kwa mpangilio wa asili wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Tafsiri imehifadhi marudio ya “peke yake,” ambayo katika Kigiriki yanatokana na maneno mawili yanayokaribiana kimaana, bila kulainisha msisitizo wa Yesu kuwa mbali na wengine.
