  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: sw
  text: Naye akasema, “Njoo.” Basi Petro akashuka kutoka kwenye mashua, akatembea juu ya maji, akamwendea Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaja kwa Yesu.” Neno la Kigiriki huonyesha mwendo kuelekea kwa Yesu, bila kusisitiza lazima kwamba Petro alimfikia.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Njoo
  rationale: Ni amri ya moja kwa moja ya ἔρχομαι. “Njoo” ni Kiswahili cha kawaida na chenye nguvu inayofaa bila kuongeza maneno.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: akashuka kutoka kwenye mashua
  rationale: Kirai hiki kinaonyesha Petro akitoka kwa kushuka kutoka mashuani kabla ya kutembea. Muundo wa masimulizi wenye “aka-” unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: πλοίου
  choice: mashua
  rationale: Katika mazingira ya Ziwa Galilaya, “mashua” ni neno la kisasa na linalofaa zaidi kuliko “meli.”
- source_word: περιεπάτησεν
  choice: akatembea
  rationale: Kitenzi hiki hapa kina maana ya kawaida ya kutembea; hakuna sababu ya kuongeza wazo la kuanza kutembea au kutembea huku na huko.
- source_word: ἐπὶ τὰ ὕδατα
  choice: juu ya maji
  rationale: Usemi huu unaonyesha kutembea juu ya uso wa maji. “Juu ya maji” ni usemi wa kawaida wa Kiswahili na huhifadhi tendo la kimiujiza.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: akamwendea Yesu
  rationale: “Akamwendea” huonyesha mwendo ulioelekezwa kwa Yesu bila kulazimisha hitimisho kwamba Petro tayari alimfikia.
- source_word: δὲ
  choice: Naye
  rationale: δέ ni kiunganishi hafifu cha masimulizi hapa. “Naye” huendeleza simulizi kwa kawaida bila kuingiza utofautishaji mkali.
theological_decisions:
- issue: Maelezo ya mwendo wa Petro kwa Yesu
  choice: akamwendea Yesu
  alternative: akamfikia Yesu
  rationale: πρός huonyesha mwendo ulioelekezwa kwa Yesu, lakini katika muktadha huu haidai kwa lazima kwamba Petro alimfikia. Tafsiri kuu inadumisha hali hiyo ya kutokuwa bayana badala ya kuamua mwisho wa mwendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya “aka-” unafaa kwa simulizi na unaonyesha hatua zinazofuatana kwa uwazi. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
