base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: sw
  text: Nao wakamsihi wapate kugusa tu upindo wa vazi lake[a]; na wote waliougusa wakaponywa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukingo” au “kishada”; neno la Kigiriki linaweza kumaanisha ukingo au upindo wa vazi, huenda likijumuisha kishada chake.
    reason: lexical_alternative
  - marker: b
    text: Au “wakawa wazima”; kitenzi cha Kigiriki kinaweza kumaanisha “kuponywa,” “kurejeshwa,” au kwa maana pana zaidi “kuokolewa,” lakini hapa muktadha ni uponyaji wa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: wakamsihi
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha kusihi kulikokuwa kukiendelea au kurudiwa; “wakamsihi” linaonyesha ombi la dhati bila kuwa dhaifu kama “wakamwomba” tu.
- source_word: ἵνα μόνον ἅψωνται
  choice: wapate kugusa tu
  rationale: “Wapate kugusa” linaeleza yaliyomo katika ombi lao, huku “tu” likihifadhi msisitizo wa μόνον kwamba walitaka hata mguso pekee.
- source_word: τοῦ κρασπέδου
  choice: upindo
  rationale: κράσπεδον inaweza kumaanisha ukingo, upindo, au kishada cha vazi. “Upindo” ni neno la kawaida na pana lisilobainisha kupita kiasi ikiwa ilikuwa kishada maalumu.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: wa vazi lake
  rationale: ἱμάτιον ni vazi kwa maana pana, mara nyingi vazi la nje; “vazi” huepuka kulifanya kuwa joho au koti kwa uhakika usiomo katika maandishi.
- source_word: ὅσοι ἥψαντο
  choice: wote waliougusa
  rationale: “Wote” linawasilisha maana ya kijumla ya ὅσοι, na kiambishi “-u-” kinarejelea kwa kawaida upindo uliotajwa.
- source_word: διεσώθησαν
  choice: wakaponywa
  rationale: Ingawa διασῴζω inaweza kumaanisha kuokoa au kufikisha salama, katika muktadha huu wa magonjwa maana ya moja kwa moja ni kuponywa kimwili.
theological_decisions:
- issue: Maana ya διεσώθησαν katika muktadha wa uponyaji wa kimiujiza
  choice: wakaponywa
  alternative: wakaokolewa / wakawa wazima
  rationale: Muktadha wa karibu unahusu wagonjwa wanaomgusa Yesu na kupona. “Wakaponywa” linaweka wazi maana hiyo ya kimwili bila kuingiza moja kwa moja fundisho pana la wokovu; tanbihi huhifadhi upana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “wakamsihi wapate kugusa tu” ni wa kawaida na unahifadhi dhati ya ombi pamoja na msisitizo wa mguso pekee. “Upindo wa vazi” unaeleweka kwa wasomaji wa kawaida na pia huhifadhi uwezekano wa ukingo au kishada bila kuamua kupita maandishi ya Kigiriki.
