  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: sw
  text: Nao walipokwisha kuvuka[a], wakafika nchi ya Genesareti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokwisha kuvuka, wakafika kwenye ardhi katika eneo la Genesareti.” Kigiriki kinaunganisha maneno “kwenye ardhi” na “katika Genesareti,” kikieleza kuwasili kwenye ardhi au ufukwe wa eneo la Genesareti.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: walipokwisha kuvuka
  rationale: Kitenzi hiki cha Kigiriki ni participio ya aoristi inayotangulia tendo kuu; muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kuvuka kulitokea kabla ya kufika, bila kutaja chombo cha usafiri.
- source_word: ἦλθον
  choice: wakafika
  rationale: Katika muktadha wa kuelekea mahali fulani, ‘wakafika’ ni Kiswahili cha kawaida na huonyesha kuwasili kwa wazi.
- source_word: ἐπὶ τὴν γῆν
  choice: nchi
  rationale: γῆ humaanisha ardhi au nchi. Hapa ‘nchi’ inafaa kwa eneo walilowasili kutoka majini, huku tanbihi ikihifadhi uwezekano wa kuelewa walifika kwenye ardhi au ufukwe.
- source_word: εἰς Γεννησαρέτ
  choice: ya Genesareti
  rationale: Mchanganyiko wa ἐπὶ τὴν γῆν na εἰς Γεννησαρέτ unaonyesha kuwasili katika nchi au eneo la Genesareti; ‘nchi ya Genesareti’ ni ya asili na inafuata muundo wa chanzo kwa karibu.
- source_word: Γεννησαρέτ
  choice: Genesareti
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
theological_decisions: []
