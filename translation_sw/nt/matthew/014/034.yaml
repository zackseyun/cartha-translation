  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Nao ... wakafika’ huendeleza simulizi kwa lugha ya kawaida na yenye hadhi.
