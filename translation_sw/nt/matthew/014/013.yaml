  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: sw
  text: Yesu aliposikia hayo, alijiondoa pale kwa mashua, akaenda mahali pasipo na watu[a] akiwa peke yake. Lakini makundi ya watu yaliposikia, yalimfuata kwa miguu kutoka mijini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali palipojitenga” au “mahali pa ukiwa.” Neno la Kigiriki linaeleza eneo lililo mbali au lisilokaliwa na watu, si lazima jangwa la mchanga.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka katika majiji.” Neno la Kigiriki linaweza kutaja makazi makubwa au madogo kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Yesu aliposikia hayo
  rationale: Kirai tegemezi cha wakati ‘aliposikia’ kinawakilisha kiambishi cha wakati cha Kigiriki kwa Kiswahili cha kawaida. ‘Hayo’ huonyesha jambo lililotangulia katika simulizi bila kuongeza maelezo ya sababu ambayo andiko halitaji wazi; δέ hapa ni mpito wa simulizi na haihitaji kiunganishi kizito.
- source_word: ἀνεχώρησεν ἐκεῖθεν
  choice: alijiondoa pale
  rationale: ‘Alijiondoa’ huhifadhi wazo la kuondoka au kujitenga kwa makusudi lililo katika ἀναχωρέω, huku ‘pale’ ikiwakilisha ἐκεῖθεν kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἐν πλοίῳ
  choice: kwa mashua
  rationale: Hii ni njia ya kawaida na wazi ya kueleza chombo kilichotumiwa kusafiria.
- source_word: εἰς ἔρημον τόπον
  choice: akaenda mahali pasipo na watu
  rationale: ἔρημος hapa hueleza eneo lililo tupu au lisilokaliwa na watu, si lazima jangwa la mchanga. Tafsiri hii inaepuka kuainisha mandhari kupita ushahidi wa matini.
- source_word: κατ’ ἰδίαν
  choice: akiwa peke yake
  rationale: Kirai hiki kina maana ya kuwa faraghani au kando na wengine; ‘akiwa peke yake’ ni cha asili na chenye kueleweka katika muktadha huu.
- source_word: οἱ ὄχλοι
  choice: makundi ya watu
  rationale: Huhifadhi wingi wa οἱ ὄχλοι na kutumia lugha ya sasa kuliko ‘makutano’.
- source_word: ἀκούσαντες
  choice: yaliposikia habari hiyo
  rationale: Kigiriki hakitaji wazi walichosikia. Kiswahili cha kawaida hunufaika na kijalizo ‘habari hiyo,’ ambacho kinarejelea habari inayodokezwa na muktadha bila kuifafanua zaidi.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: yalimfuata kwa miguu
  rationale: Huhifadhi tendo halisi la kumfuata Yesu na tofauti kati ya safari yao ya nchi kavu na safari yake kwa mashua.
- source_word: ἀπὸ τῶν πόλεων
  choice: kutoka mijini
  rationale: πόλις inaweza kumaanisha mji wa ukubwa mbalimbali. ‘Mijini’ ni istilahi pana na ya kawaida inayofaa makazi hayo ya Galilaya bila kulazimisha ukubwa maalumu.
theological_decisions:
- issue: Sababu ya Yesu kujiondoa
  choice: Kutaja tu kwamba alijiondoa baada ya kusikia habari
  alternative: Kusema alikimbia kwa usalama, alienda kuomboleza, au alienda kuomba
  rationale: Mfuatano wa simulizi unaonyesha kuwa aliondoka baada ya kusikia, lakini mstari huu hautaji wazi kusudi lake. Tafsiri haifanyi mojawapo ya maelezo hayo kuwa sehemu ya andiko.
- issue: Maana ya watu kumfuata
  choice: Kueleza tendo halisi la kumfuata kwa miguu
  alternative: Kukipa kitendo hicho maana maalumu ya uanafunzi wa kiroho
  rationale: Katika muktadha huu ἀκολουθέω hueleza mwendo wao wa kumfuata Yesu. Tafsiri haiongezi dai la kitheolojia kuhusu hali ya kila mtu katika makundi hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mashua,’ ‘mahali pasipo na watu,’ na ‘makundi ya watu’ vinaeleweka kwa wasomaji wa kawaida; tafsiri inaepuka msamiati wa kale na haiongezi sababu ya kitheolojia isiyotajwa na mstari.
