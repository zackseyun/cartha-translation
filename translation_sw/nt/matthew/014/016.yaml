  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Hawana haja ya kuondoka. Ninyi wenyewe wapeni chakula.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti wa kiasi na pendekezo la wanafunzi kwamba umati uondoke.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni utangulizi wa kawaida na wa asili wa usemi katika masimulizi ya Kiswahili.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Hawana haja
  rationale: Inahifadhi maana na muundo wa nahau ya Kigiriki ἔχω χρείαν kwa Kiswahili cha kawaida.
- source_word: ἀπελθεῖν
  choice: kuondoka
  rationale: Inafaa katika muktadha wa umati kuondoka mahali pale bila kuongeza wazo lisilokuwamo.
- source_word: δότε αὐτοῖς
  choice: wapeni
  rationale: Kitenzi cha amri cha wingi kinaelekezwa kwa wanafunzi na kinamtaja mpokeaji kwa kiambishi wa-.
- source_word: ὑμεῖς
  choice: Ninyi wenyewe
  rationale: Inahifadhi msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki.
- source_word: φαγεῖν
  choice: chakula
  rationale: Katika muundo huu, maana ya asili ya Kiswahili ni kuwapa chakula ili wale; 'chakula' huwasilisha kitu kinachodokezwa na kauli ya Kigiriki bila tafsiri ngumu ya neno kwa neno.
theological_decisions:
- issue: Msisitizo juu ya wajibu wa wanafunzi katika amri ya Yesu
  choice: Ninyi wenyewe wapeni chakula
  alternative: Wapeni chakula
  rationale: Kiwakilishi ὑμεῖς kina msisitizo katika Kigiriki; kutaja 'Ninyi wenyewe' hudumisha changamoto ya moja kwa moja kwa wanafunzi bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Sentensi mbili katika usemi wa Yesu huleta mtiririko wa asili huku zikihifadhi uhusiano wa mawazo ya chanzo.
