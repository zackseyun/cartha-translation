  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: sw
  text: Naye, akitaka kumuua[a], aliogopa umati, kwa sababu walimwona kuwa nabii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuonyesha ukinzani unaodokezwa na muktadha: “Ingawa alitaka kumuua, aliogopa umati.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “walimhesabu kuwa nabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: ingawa alitaka
  rationale: Kivumishi-ushiriki hiki kinaonyesha nia yake, lakini katika muktadha nia hiyo inakinzana na hofu iliyomzuia. “Ingawa alitaka” huonyesha uhusiano huo kwa Kiswahili cha kawaida bila kubadili maana ya msingi.
- source_word: ἀποκτεῖναι
  choice: kumuua
  rationale: Kitenzi hiki humaanisha kuua au kutia mtu kifo. “Kumuua” ni tafsiri ya moja kwa moja; “kumwua kwa jinai” ingeongeza hukumu ya kimaadili isiyotajwa wazi katika neno lenyewe.
- source_word: ἐφοβήθη
  choice: aliogopa
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kueleza hofu katika simulizi la Kiswahili.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: ὄχλος humaanisha kundi kubwa la watu. “Umati” ni neno la kawaida, fupi, na linalofaa katika muktadha huu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι hutambulisha sababu ya hofu yake.
- source_word: ὡς προφήτην
  choice: kuwa nabii
  rationale: Muundo huu unaeleza jinsi umati ulivyomtambua au kumhesabu Yohana, si kwamba alifanana tu na nabii.
- source_word: αὐτὸν εἶχον
  choice: walimwona kuwa
  rationale: ἔχω pamoja na kiarifu cha yambwa hapa ni nahau yenye maana ya kumhesabu au kumtambua mtu kuwa kitu fulani. “Walimwona kuwa” ni Kiswahili cha asili kinachohifadhi maana hiyo.
theological_decisions:
- issue: Utambulisho wa mtendaji na mtendewa umeachwa kwa viwakilishi katika Kigiriki
  choice: Kuhifadhi viwakilishi katika “alitaka kumuua” bila kuongeza majina
  alternative: Ingawa Herode alitaka kumuua Yohana, aliogopa umati...
  rationale: Kigiriki kinatumia viwakilishi, huku muktadha wa karibu ukitambulisha Herode na Yohana. Kutotaja majina hapa huhifadhi namna ya chanzo na hakulazimishi ufafanuzi usio katika mstari wenyewe.
- issue: Uhusiano wa θέλων na ἐφοβήθη
  choice: 'Kutafsiri kwa namna ya ukinzani: “ingawa alitaka ... aliogopa”'
  alternative: Akitaka kumuua, aliogopa umati
  rationale: Kiswahili cha “ingawa” huonyesha wazi mvutano wa kimuktadha kati ya nia ya kumuua na hofu ya umati, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. “Naye” huendeleza simulizi, “umati” huepuka mtindo wa kizamani, na viwakilishi vimehifadhiwa kwa kufuata chanzo.
