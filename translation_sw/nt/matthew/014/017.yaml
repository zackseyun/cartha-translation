base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: sw
  text: Lakini wakamwambia, “Hatuna kitu hapa isipokuwa mikate mitano na samaki wawili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lakini waka-
  rationale: Kiima kinarejelea wanafunzi waliotajwa katika muktadha. δέ inaonyesha utofauti mdogo na agizo la Yesu lililotangulia, hivyo ‘Lakini’ ni ya asili na wazi.
- source_word: λέγουσιν αὐτῷ
  choice: wakamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, Kiswahili cha masimulizi kwa kawaida hutumia wakati uliopita; ‘-mwambia’ pia huwasilisha kwa kawaida maana ya kusema kwa mtu.
- source_word: Οὐκ ἔχομεν
  choice: Hatuna kitu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha kwa mkazo kutokuwa na chochote kabla ya kutaja kinachoondolewa katika kauli hiyo.
- source_word: ὧδε
  choice: hapa
  rationale: Kielezi hiki cha mahali humaanisha ‘hapa,’ nalo ndilo chaguo la moja kwa moja na la kawaida.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Baada ya kauli iliyokanushwa, kirai hiki kina maana ya kuondoa kitu katika jumla—‘isipokuwa’—wala si sharti la ‘kama si.’
- source_word: πέντε ἄρτους
  choice: mikate mitano
  rationale: ἄρτος hapa ni mikate inayoweza kuhesabiwa; ‘mikate mitano’ ni tafsiri ya kawaida na inayofaa katika simulizi hili.
- source_word: δύο ἰχθύας
  choice: samaki wawili
  rationale: ἰχθύας ni wingi wa ‘samaki.’ Kiswahili sanifu hutumia upatanisho wa ngeli ya viumbe hai, hivyo ‘samaki wawili.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili katika masimulizi huku ukihifadhi utofauti wa δέ na nguvu ya kauli ya Οὐκ ἔχομεν ... εἰ μὴ.
