  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: sw
  text: Lakini alipoona upepo mkali[a], akaogopa; naye alipoanza kuzama, akapaza sauti akisema, “Bwana, niokoe!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upepo wenye nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, “niokoe katika hatari hii.” Kitenzi cha Kigiriki kinaweza kumaanisha kuondoa mtu katika hatari ya papo hapo na pia kuokoa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: alipoona
  rationale: Muundo huu wa wakati unaonyesha kwamba kuona upepo ndiko kulikofuata kwa karibu na kuingiwa na hofu; ni wa kawaida na wazi katika simulizi la Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mgeuko wa kinyume baada ya Petro kufanikiwa kutembea juu ya maji.
- source_word: ἄνεμον ἰσχυρόν
  choice: upepo mkali
  rationale: “Upepo mkali” ni usemi wa kawaida wa Kiswahili unaowasilisha nguvu ya upepo bila kutia chumvi.
- source_word: ἐφοβήθη
  choice: akaogopa
  rationale: Kitenzi hiki kinaonyesha kuanza kwa hofu kama hatua inayofuata katika simulizi.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: alipoanza kuzama
  rationale: Huhifadhi wazo la mwanzo wa kuzama bila kudokeza kwamba tayari alikuwa amezama kabisa au kufa maji.
- source_word: ἔκραξεν
  choice: akapaza sauti
  rationale: Huonyesha mwito mkubwa na wa haraka kwa Kiswahili cha kawaida chenye hadhi.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa kishiriki unaotambulisha maneno ya moja kwa moja.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika kumwambia Yesu moja kwa moja na huhifadhi uzito unaowezekana wa jina hilo.
- source_word: σῶσόν με
  choice: niokoe
  rationale: Ni ombi la haraka la kuondolewa katika hatari; pia huhifadhi upana wa maana wa σῴζω kuliko tafsiri nyembamba zaidi.
theological_decisions:
- issue: Tafsiri ya κύριος katika kumwambia Yesu moja kwa moja
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: “Bwana” ni ya kawaida, inafaa katika muktadha, na huhifadhi uzito wa kikristo wa neno bila kulazimisha maana zaidi ya matini.
- issue: Tafsiri ya σῴζω katika hatari ya papo hapo
  choice: niokoe
  alternative: niokolee
  rationale: “Niokoe” inafaa kwa hatari ya kimwili ya wakati huo na bado huhifadhi mwangwi mpana wa kuokoa unaoweza kuwamo katika kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi la Biblia lenye hadhi lakini linaloeleweka kwa urahisi. Mfuatano wa “aka-” unadumisha kasi ya simulizi, huku “alipoanza” ukiweka wazi kuwa kuzama kulikuwa kumeanza tu.
