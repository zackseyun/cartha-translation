base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: sw
  text: Lakini mashua ilikuwa tayari umbali wa stadia nyingi[b] kutoka nchi kavu[a], ikipigwa kwa nguvu na mawimbi[c], kwa maana upepo ulikuwa wa kinyume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka ufukweni.” Kigiriki kinasema “kutoka nchi kavu.”
    reason: lexical_alternative
  - marker: b
    text: Stadion moja ilikuwa kipimo cha kale cha umbali, karibu mita 185.
    reason: cultural_note
  - marker: c
    text: Au “ikichapwa na mawimbi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: mashua
  rationale: Katika mazingira ya kuvuka Ziwa la Galilaya, “mashua” ni neno la kawaida na linalofaa kuliko “meli,” ambalo lingeweza kudokeza chombo kikubwa zaidi.
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili linaonyesha kwamba hali hiyo ilikuwa imeshatokea kufikia hatua hii ya simulizi.
- source_word: σταδίους πολλοὺς
  choice: umbali wa stadia nyingi
  rationale: Kipimo cha kale kimehifadhiwa kwa uwazi kuhusu matini ya asili; neno “umbali” linafanya muundo huo uwe wa kawaida katika Kiswahili.
- source_word: ἀπὸ τῆς γῆς
  choice: kutoka nchi kavu
  rationale: γῆ hapa inatofautisha nchi kavu na maji. “Ufukwe” inawezekana kimuktadha, lakini “nchi kavu” inafuata maana ya Kigiriki kwa ukaribu zaidi.
- source_word: ἀπεῖχεν
  choice: ilikuwa ... umbali ... kutoka
  rationale: Muundo huu unaeleza umbali wa mahali kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: βασανιζόμενον
  choice: ikipigwa sana
  rationale: Kitenzi kinaonyesha dhiki au mashambulizi makali; hapa mawimbi yanaipiga mashua kwa nguvu. Tafsiri hii inawasilisha nguvu ya tukio bila kuipa mashua hisia za kibinadamu.
- source_word: ὑπὸ τῶν κυμάτων
  choice: na mawimbi
  rationale: Hiki ni kirai kinachoonyesha yaliyokuwa yakiipiga mashua; “mawimbi” ndiyo neno la kawaida na la moja kwa moja.
- source_word: ἐναντίος
  choice: kinyume chake
  rationale: Hii inaonyesha kwamba upepo ulikuwa ukipinga mwendo wa mashua. Kiwakilishi “-ke” kinarejelea mashua kutokana na muktadha.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautishaji kutoka kwa Yesu aliyekuwa nchi kavu kwenda kwenye hali ngumu ya mashua.
- source_word: γάρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu ya mashua kupigwa na mawimbi.
