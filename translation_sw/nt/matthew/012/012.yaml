reference: Matthew 12:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: sw
  text: Basi, mwanadamu ana thamani zaidi kuliko kondoo kwa kiasi gani! Kwa hiyo, ni halali kutenda mema siku za Sabato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa usemi wa kawaida zaidi, “siku ya Sabato.” Kigiriki kinatumia wingi, “siku za Sabato,” ambao ni usemi wa kawaida kuhusu kuadhimisha Sabato.
    reason: Mbadala wa usemi unaoeleza wingi wa Kigiriki na namna yake ya kawaida katika tafsiri.
lexical_decisions:
- source_word: πόσῳ
  choice: kubwa zaidi sana
  rationale: Katika muundo huu neno hilo linatilia mkazo hoja ya kutoka lililo dogo kwenda lililo kubwa. Usemi huu wa Kiswahili unawasilisha nguvu ya mshangao wa ‘kwa kiasi gani zaidi’ kwa njia ya kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Linaonyesha hitimisho linalotokana na mfano uliotangulia wa kumwokoa kondoo siku ya Sabato.
- source_word: διαφέρει
  choice: ana thamani kubwa zaidi
  rationale: Katika muktadha huu kitenzi kinahusu tofauti ya thamani, si tofauti ya kawaida tu.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: Ni neno la umoja linalomwakilisha binadamu kwa ujumla katika ulinganisho na kondoo; ‘mwanadamu’ ni sahihi na la heshima katika Kiswahili.
- source_word: προβάτου
  choice: kuliko kondoo
  rationale: 'Hali ya umilikishi baada ya kitenzi cha kulinganisha inaonyesha kiwango cha ulinganisho: mwanadamu analinganishwa na kondoo.'
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Linaanzisha hitimisho la hoja iliyotangulia.
- source_word: ἔξεστιν
  choice: ni halali
  rationale: Muktadha unahusu uhalali chini ya sheria ya Sabato, si ruhusa ya kawaida tu.
- source_word: τοῖς σάββασιν
  choice: siku za Sabato
  rationale: Kigiriki kina wingi; tafsiri hii inauhifadhi huku ikibaki wazi katika Kiswahili. Umoja wa kawaida zaidi umeonyeshwa katika tanbihi.
- source_word: καλῶς ποιεῖν
  choice: kutenda mema
  rationale: Ni usemi wa kawaida unaomaanisha kufanya yaliyo mema au yenye kuwafaidi wengine; ‘kutenda mema’ ni wa asili na wenye hadhi.
theological_decisions:
- issue: Uwakilishi wa jumla wa ἄνθρωπος
  choice: mwanadamu
  alternative: mtu
  rationale: ‘Mwanadamu’ huonyesha wazi kwamba kanuni hii inamhusu binadamu kwa ujumla bila kuongeza maana isiyokuwamo katika chanzo.
- issue: Usemi wa wingi kuhusu Sabato
  choice: siku za Sabato
  alternative: siku ya Sabato
  rationale: Wingi wa Kigiriki umehifadhiwa katika matini kwa uwazi wa chanzo, lakini tanbihi inaonyesha kwamba wingi huo unaweza kutumika kama usemi wa kawaida wa kuadhimisha Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mshangao umehifadhiwa ili kuonyesha nguvu ya hoja ya Yesu, na istilahi ‘ni halali’ inadumisha muktadha wa mjadala kuhusu sheria ya Sabato.
