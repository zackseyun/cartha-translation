review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comparison of human worth with a sheep and the conclusion that doing good is lawful on the Sabbath. However, “ana thamani kubwa zaidi sana” shifts the explicit rhetorical ποσῳ (“how much more/by how much”) into a generalized and somewhat over-intensified assertion.
  naturalness: “Basi, mwanadamu ana thamani zaidi kuliko kondoo kwa kiasi gani!” is a more natural and idiomatic Swahili rhetorical exclamation than “ana thamani kubwa zaidi sana kuliko kondoo.” “Kutenda mema siku za Sabato” is clear and suitably formal.
  terminology: “Mwanadamu,” “kondoo,” “ni halali,” “kutenda mema,” and “Sabato” are appropriate Standard East African Swahili terms. The footnote accurately explains the Greek plural idiom without treating it as a different meaning.
  issues:
  - severity: medium
    issue: The rendering of πόσῳ as “kubwa zaidi sana” does not retain the explicit comparative-question/rhetorical measure.
    rationale: πόσῳ with διαφέρει asks rhetorically “by how much/how much more.” “Zaidi sana” intensifies the comparison, but does not represent that rhetorical formulation and is less precise in this context.
  revised_text: Basi, mwanadamu ana thamani zaidi kuliko kondoo kwa kiasi gani! Kwa hiyo, ni halali kutenda mema siku za Sabato.[a]
  revised_footnotes:
