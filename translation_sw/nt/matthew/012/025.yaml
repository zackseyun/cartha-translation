review_pass:
  verdict: revise
  source_fidelity: 'Draft faithfully conveys the proverb’s overall sense, Jesus’ knowledge of their inward thoughts without explaining its means, and the future sense of οὐ σταθήσεται. However, “uliogawanyika na kujipinga wenyewe” adds a second coordinated action and has an agreement/naturalness problem; the Greek has one participial idea: being divided against itself.'
  naturalness: “Lakini akijua mawazo yao, aliwaambia” is natural Standard East African Swahili. “Uliogawanyika wenyewe kwa wenyewe” and its corresponding form for “mji au nyumba” are more idiomatic ways to express internal division than the draft’s “na kujipinga.”
  terminology: “Mawazo,” “ufalme,” “mji,” “nyumba,” “ukiwa,” and “haitasimama” are suitable, clear choices. The note on nyumba appropriately retains the possible household sense of οἰκία.
  issues:
  - severity: medium
    issue: The phrase “uliogawanyika na kujipinga wenyewe” treats internal opposition as an additional coordinated predicate and is not idiomatic in this singular construction.
    rationale: μερισθεῖσα καθ’ ἑαυτῆς is a single phrase meaning “divided against itself.” “Uliogawanyika wenyewe kwa wenyewe” directly conveys reciprocal internal division without unnecessarily adding a separate action.
  revised_text: Lakini akijua mawazo yao[a], aliwaambia, “Kila ufalme uliogawanyika wenyewe kwa wenyewe huachwa ukiwa[b]; na kila mji au nyumba[c] iliyogawanyika yenyewe kwa yenyewe haitasimama.”
