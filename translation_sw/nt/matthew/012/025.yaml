- from: Lakini akijua mawazo yao[a], aliwaambia, “Kila ufalme uliogawanyika na kujipinga wenyewe huachwa ukiwa[b]; na kila mji au nyumba[c] iliyogawanyika na kujipinga yenyewe haitasimama.”
  to: Lakini akijua mawazo yao[a], aliwaambia, “Kila ufalme uliogawanyika wenyewe kwa wenyewe huachwa ukiwa[b]; na kila mji au nyumba[c] iliyogawanyika yenyewe kwa yenyewe haitasimama.”
  rationale: The revision replaces the less natural and structurally expanded “uliogawanyika na kujipinga wenyewe” with an idiomatic reciprocal expression for division within a kingdom, city, or house. It preserves the Greek’s proverbial present for ἐρημοῦται, its future “will not stand,” and the textual ambiguity concerning how Jesus knew their thoughts.
