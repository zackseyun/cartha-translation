id: MAT.12.25
reference: Matthew 12:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: sw
  text: Lakini akijua mawazo yao[a], aliwaambia, “Kila ufalme uliogawanyika wenyewe kwa wenyewe huachwa ukiwa[b]; na kila mji au nyumba[c] iliyogawanyika yenyewe kwa yenyewe haitasimama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fikira zao,” “hoja zao za moyoni,” au “makusudi yao.”
    reason: lexical_alternative
  - marker: b
    text: Au “huangamizwa,” “hufanywa ukiwa,” au “huwa ukiwa.”
    reason: lexical_alternative
  - marker: c
    text: Hapa “nyumba” inaweza pia kumaanisha jamaa au watu wa nyumba moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Kitenzi hiki kinaeleza ufahamu au ujuzi wa Yesu na kinahifadhi uhusiano wa kishiriki na kitenzi kikuu bila kueleza jinsi alivyoyajua.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha mpito wenye utofautishaji mdogo katika hoja; “Lakini” linafaa katika muktadha huu.
- source_word: ἐνθυμήσεις
  choice: mawazo
  rationale: “Mawazo” ni neno la kawaida na linaloeleweka, huku likibaki pana vya kutosha kujumuisha fikira, hoja za moyoni, au makusudi.
- source_word: Πᾶσα βασιλεία
  choice: Kila ufalme
  rationale: Huhifadhi kauli ya jumla inayohusu ufalme wowote.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: uliogawanyika na kujipinga wenyewe
  rationale: Usemi huu wa asili unaonyesha si mgawanyiko tu bali mgawanyiko wa ndani unaoufanya ufalme ujipinge; Kiswahili hiki ni cha kawaida kuliko tafsiri sisisi “dhidi yake wenyewe.”
- source_word: ἐρημοῦται
  choice: huachwa ukiwa
  rationale: Huhifadhi picha ya kuwa ukiwa au kuharibiwa, pamoja na hali ya jumla inayoonyeshwa na wakati wa sasa katika methali hii.
- source_word: πόλις ἢ οἰκία
  choice: mji au nyumba
  rationale: “Mji” ni maana ya kawaida ya πόλις, na “nyumba” huhifadhi upana wa οἰκία, ambalo linaweza pia kumaanisha watu wa nyumba au jamaa.
- source_word: οὐ σταθήσεται
  choice: haitasimama
  rationale: Ni usemi mfupi na wa kawaida unaoweza kumaanisha kutobaki imara au kutodumu, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Namna Yesu alivyojua mawazo yao
  choice: Kauli inasema tu kwamba Yesu aliyajua mawazo yao, bila kufafanua chanzo au namna ya ujuzi huo.
  alternative: Kusema wazi kwamba aliyajua kwa uwezo wa kimungu, kwa ufunuo wa kinabii, au kwa kuyatambua kutokana na mazingira.
  rationale: Aya inathibitisha ujuzi wake lakini haielezi jinsi alivyoupata; tafsiri haipaswi kutatua jambo ambalo matini imelihifadhi wazi.
- issue: Maana ya “nyumba” katika mfano
  choice: Kutumia “nyumba” katika matini na kueleza katika tanbihi kwamba inaweza pia kumaanisha jamaa au watu wa nyumba.
  alternative: Kutafsiri moja kwa moja “jamaa” au “watu wa nyumba.”
  rationale: οἰκία inaweza kuonyesha jengo au kaya; “nyumba” pamoja na tanbihi huhifadhi upana huo bila kulazimisha maana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa methali umehifadhiwa, huku “kujipinga” likifanya maana ya mgawanyiko wa ndani iwe wazi kwa msomaji wa kawaida. Kiima cha Yesu hakijaongezwa kwa jina kwa sababu kiko wazi katika muktadha na Kigiriki kina kiwakilishi fiche.
