id: MAT.12.15
reference: Matthew 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: sw
  text: Lakini Yesu, alipojua hayo,[a] akaondoka mahali pale. Watu wengi wakamfuata, naye akawaponya wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu, alipojua, akaondoka mahali pale.” Kigiriki hakitaji wazi kile alichojua; muktadha unakionyesha kutokana na mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: alipojua hayo
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kwamba Yesu alijua jambo hilo kabla ya kuondoka. Neno “hayo” linaelekeza kwa kawaida kwenye shauri la Mafarisayo katika mstari uliotangulia, bila kulifafanua kupita kiasi.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: Katika muktadha huu neno lina maana ya kuondoka mahali hapo kwa sababu ya upinzani. “Akaondoka” ni Kiswahili cha kawaida na chenye hadhi; muktadha wenyewe unaonyesha kuwa huku hakukuwa kuondoka kwa kawaida tu.
- source_word: ἐκεῖθεν
  choice: mahali pale
  rationale: Hutoa kwa ufupi maana ya mwendo wa kuondoka kutoka eneo lililotajwa katika simulizi.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Watu wengi wakamfuata
  rationale: πολλοί humaanisha “wengi” bila kutaja wazi umati; kuongeza “watu” kunafanya sentensi iwe ya kawaida na wazi katika Kiswahili.
- source_word: ἐθεράπευσεν
  choice: akawaponya
  rationale: θεραπεύω katika masimulizi ya Injili hueleza kuponya magonjwa; “kuponya” ndiyo tafsiri ya kawaida na iliyo wazi.
- source_word: αὐτοὺς πάντας
  choice: akawaponya wote
  rationale: “Wote” huhifadhi maana ya πάντας kwamba aliwaponya kila mmoja wao.
theological_decisions:
- issue: Yambwa isiyotajwa wazi ya γνοὺς
  choice: alipojua hayo
  alternative: alipojua
  rationale: Kigiriki hakitaji yambwa, lakini muktadha wa mstari uliotangulia unaonyesha kwamba Yesu alijua shauri lao dhidi yake. “Hayo” hudumisha uhusiano huo huku tanbihi ikihifadhi uwazi kuhusu muundo wa Kigiriki.
- issue: Maana ya kuondoka kwa Yesu
  choice: akaondoka
  alternative: akajiondoa
  rationale: “Akaondoka” ni ya asili zaidi katika Kiswahili na haidokezi woga. Muktadha unaendelea kuhifadhi wazo la kuondoka kwa makusudi kwa sababu ya upinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye “aka-” na “waka-” huunganisha matendo kwa mtiririko wa kawaida bila kuongeza maelezo yasiyomo katika chanzo.
