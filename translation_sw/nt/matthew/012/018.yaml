  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: sw
  text: '“Tazama, mtumishi wangu niliyemchagua,

    mpendwa wangu ambaye nafsi yangu imependezwa naye.

    Nitaweka Roho yangu juu yake,

    naye atawatangazia mataifa[a] haki[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasio Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Linadumisha mwito wa kinabii unaovuta usikivu, kwa lugha ya heshima na inayoeleweka katika Kiswahili cha sasa.
- source_word: παῖς
  choice: mtumishi
  rationale: Katika dondoo hili kutoka Isaya kuhusu mtumishi wa Mungu, maana ya kimuktadha ni ‘mtumishi,’ si tu ‘mtoto’ au ‘mwana.’
- source_word: ᾑρέτισα
  choice: niliyemchagua
  rationale: Linawasilisha uchaguzi wa Mungu uliokamilika kwa muundo wa kawaida na wa asili wa Kiswahili.
- source_word: ὁ ἀγαπητός μου
  choice: mpendwa wangu
  rationale: Linahifadhi upendo na hadhi inayodhihirishwa na ἀγαπητός bila kuongeza wazo lisilo wazi katika neno lenyewe.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: nafsi yangu imependezwa naye
  rationale: Linahifadhi wazi nomino ψυχή, ‘nafsi,’ na maana ya furaha au ridhaa ya Mungu, badala ya kuifupisha kuwa ‘nimependezwa naye.’
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Nitaweka Roho wangu juu yake
  rationale: Linadumisha taswira ya Roho wa Mungu kuwekwa juu ya mtumishi kwa ajili ya utume wake wa kinabii.
- source_word: τοῖς ἔθνεσιν
  choice: mataifa
  rationale: ‘Mataifa’ linaonyesha upeo mpana wa unabii; neno la Kigiriki pia linaweza kumaanisha watu wasio Wayahudi, jambo lililowekwa katika tanbihi.
- source_word: κρίσιν
  choice: haki
  rationale: Katika muktadha wa utume wa mtumishi kwa mataifa, ‘haki’ huonyesha utaratibu wa Mungu ulio sawa; uwezekano wa ‘hukumu’ umehifadhiwa katika tanbihi.
- source_word: ἀπαγγελεῖ
  choice: atawatangazia
  rationale: Kitenzi hiki kinaonyesha tangazo la wazi na la hadharani, na kiambishi cha watendewa kinaonyesha kuwa mataifa ndiyo yatakayopokea tangazo.
theological_decisions:
- issue: Utambulisho wa mtumishi katika παῖς
  choice: Neno limetafsiriwa ‘mtumishi’ kulingana na dondoo la Isaya kuhusu mtumishi wa Mungu.
  alternative: mtoto; mwana
  rationale: Uchaguzi huu unahifadhi muktadha wa Agano la Kale na kazi ya kimasiya inayoelezwa hapa, bila kuingiza katika neno hili pekee maana ya kimwana ambayo halisemi wazi.
- issue: Maana ya κρίσις katika utume kwa mataifa
  choice: Neno limetafsiriwa ‘haki’ katika andiko kuu.
  alternative: hukumu
  rationale: ‘Haki’ linafaa kwa ahadi ya kupeleka utaratibu mwadilifu wa Mungu kwa mataifa, lakini ‘hukumu’ ni maana halisi inayowezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya dondoo la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unadumisha muundo wa kishairi wa dondoo. ‘Nafsi yangu’ imehifadhiwa ili kutopunguza usemi wa Kigiriki, na ‘Roho’ imeandikwa kwa herufi kubwa kwa kuwa inamtaja Roho wa Mungu.
