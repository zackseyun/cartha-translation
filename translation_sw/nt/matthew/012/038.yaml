  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: sw
  text: Ndipo baadhi ya waandishi na Mafarisayo wakamjibu, wakisema, “Mwalimu, tunataka kuona ishara[a] kutoka kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara ya kimiujiza.” Neno la Kigiriki linaweza kumaanisha ishara yenye maana ya kimiujiza, lakini matini kuu inadumisha neno pana zaidi, “ishara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Huendeleza mfuatano wa simulizi kwa namna ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: wakamjibu
  rationale: Kitenzi cha Kiswahili kinajumuisha kwa kawaida tendo la kujibu na yule anayejibiwa, huku kikihifadhi nahau ya Kigiriki ingawa hakuna swali la moja kwa moja katika mstari huu.
- source_word: τινες τῶν γραμματέων
  choice: baadhi ya waandishi
  rationale: “Baadhi” huonyesha kuwa ni sehemu tu ya kundi, na “waandishi” huhifadhi jina la kihistoria la γραμματεῖς bila kulipanua kiufafanuzi kuwa walimu au wataalamu wa sheria.
- source_word: καὶ Φαρισαίων
  choice: na Mafarisayo
  rationale: Ni jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi muundo wa kishirikishi unaoanzisha maneno ya moja kwa moja na unasikika kwa kawaida katika simulizi la Kiswahili.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hutoa maana ya moja kwa moja ya cheo hiki bila kuongeza dhana yenye nguvu zaidi ya “Bwana” au “Mkuu.”
- source_word: θέλομεν
  choice: tunataka
  rationale: Ni usemi wa sasa, wa moja kwa moja, unaoeleweka kwa urahisi na unaowasilisha nia yao.
- source_word: σημεῖον
  choice: ishara
  rationale: Huhifadhi upana wa neno la Kigiriki; muktadha unaweza kuipa ishara hiyo umuhimu wa kimiujiza bila kuingiza ufafanuzi huo moja kwa moja katika matini.
- source_word: ἀπὸ σοῦ
  choice: kutoka kwako
  rationale: Huonyesha chanzo cha ishara kwa uwazi, kama ilivyo katika kihusishi cha Kigiriki.
- source_word: ἰδεῖν
  choice: kuona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, bila kuongeza wazo la kushuhudia tukio ambalo halijaelezwa wazi na kitenzi chenyewe.
theological_decisions:
- issue: Asili ya σημεῖον katika muktadha
  choice: ishara
  alternative: ishara ya kimiujiza
  rationale: Ombi lao katika muktadha linaweza kumaanisha uthibitisho wa kimiujiza kutoka kwa Yesu, lakini neno la Kigiriki lenyewe ni pana zaidi. Matini kuu inalinda upana huo, na tanbihi inaonyesha maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wakamjibu, wakisema” unakaribia sintaksia ya chanzo bila kuwa mzito; “waandishi” limetumiwa kama jina la kihistoria badala ya ufafanuzi mpana zaidi.
