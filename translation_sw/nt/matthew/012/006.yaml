  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: sw
  text: Lakini ninawaambia kwamba kilicho kikuu kuliko hekalu kipo hapa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu aliye mkuu kuliko hekalu yuko hapa,” au “aliye mkuu kuliko hekalu yuko hapa.” Kiyunani kinatumia umbo la kati (neuter) la “kikuu,” bila kutaja wazi kinachorejelewa.
    reason: alternative_reading
  - marker: b
    text: Au, “mahali hapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: Kauli hii ya moja kwa moja inatafsiri λέγω pamoja na ὑμῖν kwa Kiswahili cha kawaida. Neno δέ linaonyesha tofauti nyepesi na hoja iliyotangulia, hivyo “Lakini” linafaa katika muktadha huu.
- source_word: ὅτι
  choice: kwamba
  rationale: Linaanzisha maudhui ya kauli ya Yesu na kuweka muundo wa sentensi wazi kwa Kiswahili.
- source_word: τοῦ ἱεροῦ
  choice: kuliko hekalu
  rationale: ἱερόν kwa kawaida hurejelea hekalu kwa upana, yaani eneo lote la hekalu, si hasa patakatifu pa ndani kama ναός. “Hekalu” ni neno la kawaida na linalofaa hapa.
- source_word: μεῖζόν
  choice: kitu kikubwa
  rationale: μεῖζόν ni kivumishi linganishi cha umoja katika jinsi isiyo ya kiume wala ya kike, kilichotumiwa kama nomino bila kutaja wazi kinachorejelewa. Kiswahili huhitaji ngeli inayodhihirika; “kitu kikubwa” kinahifadhi kutotajwa kwa mtu moja kwa moja bila kumtambulisha wazi Yesu katika matini kuu.
- source_word: ἐστιν
  choice: kiko
  rationale: Ni kitenzi cha hali ya sasa; upatanisho wa ngeli ya KI-VI unafuata nomino “kitu.”
- source_word: ὧδε
  choice: hapa
  rationale: Ni kielezi cha mahali chenye maana ya “hapa” au “mahali hapa.” “Hapa” ni kifupi na cha kawaida.
theological_decisions:
- issue: Utambulisho wa kinachorejelewa bila kutajwa katika μεῖζόν
  choice: Kitu kikubwa kuliko hekalu kiko hapa
  alternative: Mtu aliye mkuu kuliko hekalu yuko hapa; au, aliye mkuu kuliko hekalu yuko hapa
  rationale: Kiyunani kinatumia umbo lisilo la kiume wala la kike, wala hakimtaji mhusika wazi. Ingawa muktadha unaelekeza kwa Yesu na mamlaka yake, matini kuu haipaswi kubainisha zaidi ya chanzo. Tanbihi inahifadhi uwezekano wa kuelewa kauli hiyo kuwa inamhusu mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo unafuata chanzo kwa karibu huku ukibaki wa kawaida katika Kiswahili. “Kitu kikubwa” linaweza pia kudokeza ukubwa wa kimwili, lakini hapa muktadha na ulinganisho na hekalu huwasilisha maana pana ya ukuu; tanbihi inaonyesha usomaji unaomhusu mtu bila kuufanya kuwa tafsiri pekee.
