  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: sw
  text: Mtu ambaye hayuko pamoja nami yuko dhidi yangu, na mtu ambaye hakusanyi pamoja nami hutawanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: Mtu ambaye hayuko
  rationale: Kirai chenye kibainishi na participio kinamtaja mtu yeyote mwenye sifa ya kutokuwa pamoja na Yesu. Muundo huu ni wa kawaida na wenye heshima katika Kiswahili cha sasa.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: μετά pamoja na genitivi huonyesha ushirika au kuwa upande mmoja; “pamoja nami” huhifadhi maana hiyo ya uhusiano bila kuifafanua kupita kiasi.
- source_word: κατ’ ἐμοῦ
  choice: dhidi yangu
  rationale: κατά pamoja na genitivi hapa huonyesha upinzani. “Dhidi yangu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: συνάγων
  choice: hakusanyi
  rationale: Kitenzi hiki humaanisha kukusanya au kuleta pamoja. “Kukusanya” huhifadhi taswira iliyo wazi katika chanzo bila kuibainisha kuwa ya mavuno au uchungaji pekee.
- source_word: σκορπίζει
  choice: hutawanya
  rationale: Kitenzi hiki humaanisha kutawanya au kusambaza pande mbalimbali. “Hutawanya” huleta ulinganifu wa wazi na “hakusanyi” na huhifadhi usemi wa jumla.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaongeza kauli ya pili iliyo sambamba na ya kwanza; “na” huhifadhi uratibu wa Kigiriki bila kuleta utofauti usiotajwa.
theological_decisions:
- issue: Uzito wa mgawanyiko kamili katika kauli ya Yesu
  choice: Kauli imetafsiriwa kama tamko lisilolegeza tofauti kati ya kuwa pamoja na Yesu na kuwa dhidi yake.
  alternative: Kutumia tafsiri huru inayopunguza ukali wa mgawanyiko huo.
  rationale: Kigiriki kinaweka vifungu viwili sambamba na vya moja kwa moja bila maneno ya kupunguza ukali. Tafsiri huhifadhi mvutano na madai hayo bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “mtu ambaye” yamehifadhiwa ili kuonyesha miundo miwili sambamba ya Kigiriki; “hu-” katika “hutawanya” huonyesha tendo la kawaida linalomtambulisha mtu huyo.
