  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: sw
  text: 'ili litimie neno lililonenwa kupitia[a] nabii Isaya, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililonenwa na nabii Isaya.” Kigiriki kwa maana ya moja kwa moja zaidi kinasema “kupitia,” kikisisitiza kwamba ujumbe ulipitishwa kwa njia ya nabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kishazi cha kusudi au matokeo bila kulazimisha kutenganisha maana hizo mbili.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Huhifadhi kauli ya kutimizwa inayotumiwa mara nyingi na Mathayo; muundo wa Kiswahili baada ya “ili” unaonyesha hali inayokusudiwa au kutokea.
- source_word: τὸ ῥηθὲν
  choice: neno lililonenwa
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha kirai nomino na hali ya kutendwa ya Kigiriki.
- source_word: διὰ
  choice: kupitia
  rationale: 'Pamoja na hali ya genitivi, neno hili linaonyesha uhusika wa kati: ujumbe ulitolewa kupitia Isaya, bila kumtaja Isaya kuwa chanzo cha mwisho.'
- source_word: Ἠσαΐου
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: τοῦ προφήτου
  choice: nabii
  rationale: Huhifadhi utambulisho wa Isaya uliotajwa wazi katika maandishi ya Kigiriki, huku Kiswahili kisihitaji kibainishi cha “the.”
- source_word: λέγοντος
  choice: akisema
  rationale: Huhifadhi kishiriki kinachomhusu Isaya na kuunganisha sentensi hii moja kwa moja na nukuu inayofuata.
theological_decisions:
- issue: Uhusika wa nabii katika kauli ya utimilifu
  choice: kupitia nabii Isaya
  alternative: na nabii Isaya
  rationale: “Kupitia” hudumisha maana ya διά pamoja na genitivi, yaani nabii ni mjumbe au chombo cha ujumbe, bila kuamua kimadhehebu zaidi ya kile kinachosemwa na maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Neno lililonenwa” ni wazi kwa wasomaji wa kawaida, na “akisema” huacha sentensi wazi kwa ajili ya nukuu katika mstari unaofuata.
