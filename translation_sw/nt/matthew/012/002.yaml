id: MAT.12.2
reference: Matthew 12:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: sw
  text: Lakini Mafarisayo walipoona hayo, wakamwambia, “Tazama, wanafunzi wako wanafanya jambo ambalo si halali[a] kufanywa siku ya Sabato.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambalo haliruhusiwi kufanywa siku ya Sabato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti kati ya tendo la wanafunzi katika mstari uliotangulia na pingamizi la Mafarisayo.
- source_word: ἰδόντες
  choice: walipoona hayo
  rationale: Kauli ya kushiriki ya wakati uliopita imetafsiriwa kwa muundo wa wakati ulio wa kawaida katika Kiswahili; “hayo” yanaelekeza kwa matendo ya wanafunzi yaliyotajwa katika muktadha.
- source_word: εἶπαν αὐτῷ
  choice: wakamwambia
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili unaowasilisha mfuatano wa simulizi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Inadumisha nguvu ya neno la kuvuta fikira katika shtaka bila kutumia lugha ya kizamani kupita kiasi.
- source_word: μαθηταί
  choice: wanafunzi
  rationale: Ni istilahi iliyozoeleka katika Injili na inadumisha uhusiano wa mwalimu na wanafunzi wake.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: wanafanya ... kufanywa
  rationale: Inahifadhi urudiaji wa kitenzi ποιέω kwa namna ya Kiswahili iliyo wazi na ya asili.
- source_word: ὃ οὐκ ἔξεστιν
  choice: jambo ambalo si halali
  rationale: Inaonyesha pingamizi la kisheria au la ruhusa bila kuamua kama msingi wake ulikuwa sheria ya Maandiko au mapokeo ya Mafarisayo.
- source_word: ἐν σαββάτῳ
  choice: siku ya Sabato
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja wakati wa Sabato kama siku inayozungumziwa.
theological_decisions:
- issue: Asili ya pingamizi la Mafarisayo
  choice: “si halali” limetumiwa kama lugha ya kisheria na ya ruhusa bila kutaja chanzo mahususi cha katazo.
  alternative: “hairuhusiwi” au “ni kinyume cha sheria”
  rationale: Mstari unaripoti shtaka lao lakini hauamui usahihi wake wala kama lilitegemea sheria ya Maandiko au mapokeo; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. “Tazama” limetumiwa kuhifadhi mkazo wa shtaka, na “Sabato” kudumisha istilahi ya kibiblia iliyozoeleka.
