  text: Kwa maana, kwa maneno yako utahesabiwa haki[a], na kwa maneno yako utahukumiwa kuwa na hatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utathibitishwa kuwa mwenye haki” au “utaachiliwa huru.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kimahakama ya kutangazwa kuwa mwenye haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: kwa
  rationale: Pamoja na hali ya umilikishi, hapa ἐκ inaonyesha msingi au ushahidi wa hukumu. Kiswahili “kwa” huwasilisha maana ya kuhukumiwa kwa msingi wa maneno ya mtu.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu au ufafanuzi wa onyo lililotangulia kuhusu usemi.
- source_word: λόγων
  choice: maneno
  rationale: Katika muktadha huu wingi wa λόγος unamaanisha matamshi ya mtu. “Maneno” ni tafsiri ya moja kwa moja na hudumisha urudiaji wa kimakusudi katika vifungu vyote viwili.
- source_word: σου
  choice: yako
  rationale: Kiwakilishi hiki cha umilikishi kinahusiana moja kwa moja na “maneno” katika vifungu vyote viwili.
- source_word: δικαιωθήσῃ
  choice: utahesabiwa kuwa mwenye haki
  rationale: Hii ni kauli ya wakati ujao katika hali tendwa, na katika muktadha wa hukumu ina maana ya kimahakama ya kutangazwa kuwa upande wa haki. Chaguo hili ni la kawaida na linaeleweka katika Kiswahili huku likihifadhi hali tendwa na kutoamua kupita kiasi kati ya kupewa haki, kuachiliwa, na kuthibitishwa kuwa sawa.
- source_word: καταδικασθήσῃ
  choice: utahukumiwa kuwa na hatia
  rationale: Kitenzi hiki kina maana ya kimahakama na kinasimama kinyume kwa makusudi na δικαιωθήσῃ. Tafsiri hii huonyesha wazi hukumu ya hatia na kuhifadhi hali tendwa.
theological_decisions:
- issue: Maana ya kimahakama ya δικαιόω kuhusu maneno na hukumu
  choice: utahesabiwa kuwa mwenye haki
  alternative: utathibitishwa kuwa uko upande wa haki; utaachiliwa kuwa huna hatia
  rationale: Ulinganifu wa moja kwa moja na “utahukumiwa kuwa na hatia” unaonyesha mazingira ya kimahakama. Tafsiri iliyochaguliwa huhifadhi maana pana ya kutangazwa kuwa mwenye haki bila kuingiza mfumo maalumu wa kimadhehebu kuhusu kuhesabiwa haki au kudai kwamba maneno yenyewe ndiyo chanzo cha wokovu badala ya msingi wa ushahidi katika hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa sentensi ya Kigiriki umehifadhiwa kwa kurudia “kwa maneno yako.”
