  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: sw
  text: Mtu mwema hutoa mambo mema[a] kutoka katika hazina yake njema, naye mtu mwovu hutoa mambo maovu kutoka katika hazina yake ya uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha wa karibu, “mambo mema” na “mambo maovu” yanaweza hasa kumaanisha maneno.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: mwema / mambo mema
  rationale: Huhifadhi urudiaji na ulinganifu wa kimaadili wa mzizi uleule katika Kigiriki, huku Kiswahili cha kawaida kikihitaji upatanisho wa ngeli.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: “Mtu” ni tafsiri ya kawaida ya ἄνθρωπος na hapa humaanisha mtu yeyote kwa namna ya kimethali; haihitaji kuweka jinsia ya kiume isiyosisitizwa na maana.
- source_word: θησαυροῦ
  choice: hazina
  rationale: “Hazina” huhifadhi sitiari ya akiba yenye thamani iliyokusanywa ndani, ambako mambo yanatolewa.
- source_word: ἐκβάλλει
  choice: hutoa
  rationale: “Hutoa” ni ya asili katika Kiswahili na hudumisha wazo la kutoa kitu kutoka ndani bila kuongeza nguvu isiyokusudiwa kama “hutupa nje.”
- source_word: πονηρὸς / πονηρά
  choice: mwovu / mambo maovu
  rationale: “Mwovu” na “maovu” hudumisha uzito wa kimaadili na ulinganifu wa sentensi kuliko “mbaya,” ambalo linaweza kuwa dhaifu zaidi.
- source_word: ἐκ
  choice: kutoka katika
  rationale: Hueleza kwa kawaida chanzo ambako mambo mema au maovu hutolewa.
theological_decisions:
- issue: Je, mambo yanayotolewa ni maneno pekee au matendo na maneno kwa upana?
  choice: mambo mema / mambo maovu
  alternative: maneno mema / maneno maovu
  rationale: Muktadha wa karibu unahusu usemi, lakini Kigiriki kina vivumishi vilivyotumiwa kama nomino bila kutaja “maneno.” Tafsiri pana huhifadhi utata huo huku tanbihi ikionyesha mkazo wa muktadha.
- issue: Sitiari ya hazina ya ndani
  choice: hazina yake njema / hazina yake ya uovu
  alternative: akiba yake njema / akiba yake mbaya
  rationale: “Hazina” huhifadhi sitiari ya θησαυρός. Kirai “ya uovu” ni cha asili zaidi kuliko “hazina ovu” na bado huonyesha tabia ya kimaadili ya chanzo bila kuingiza mfumo mpana wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kimethali na ulinganifu wa pande mbili umehifadhiwa; “naye” huunganisha pande hizo kwa mtiririko wa kawaida.
