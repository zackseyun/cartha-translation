  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: sw
  text: 'Kwa hiyo ninawaambia: Watu watasamehewa kila dhambi na kila kufuru, lakini kufuru dhidi ya Roho[a] haitasamehewa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Roho Mtakatifu. Mstari huu wenyewe unasema tu “Roho,” lakini muktadha unaonyesha kuwa anayerejelewa ni Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na muktadha uliotangulia na ni kiunganishi cha kawaida katika Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi usemi wa moja kwa moja na uzito wa kauli kwa lugha ya kawaida na yenye hadhi.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: kila dhambi na kila kufuru
  rationale: Kurudia “kila” kunadhihirisha vizuri nguvu ya ugawaji ya πᾶσα katika Kiswahili na huepuka kueleweka kana kwamba maneno hayo mawili yanaunda aina moja tu.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: Watu watasamehewa
  rationale: Dative τοῖς ἀνθρώποις huonyesha wanaopokea msamaha. Muundo wa kuwafanya “watu” kuwa kiima ni wa asili katika Kiswahili huku maana ya kauli tendwa ikihifadhiwa.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: lakini kufuru dhidi ya Roho
  rationale: Genitive τοῦ πνεύματος inaeleweka kimuktadha kuwa Roho ndiye anayelengwa na kufuru. “Dhidi ya” huweka wazi uhusiano huo bila kuongeza neno “Mtakatifu,” ambalo halipo katika mstari huu.
- source_word: οὐκ ἀφεθήσεται
  choice: haitasamehewa
  rationale: Huhifadhi wakati ujao, kauli tendwa, na ukanushi wa Kigiriki kwa njia ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Iwapo πνεύματος itafsiriwe “Roho” au “Roho Mtakatifu” katika matini kuu
  choice: Roho
  alternative: Roho Mtakatifu
  rationale: Mstari huu unasema tu τοῦ πνεύματος, yaani “Roho,” bila ἁγίου. Muktadha unaonyesha kuwa anayerejelewa ni Roho Mtakatifu, lakini matini kuu haiongezi neno lisilokuwapo; ufafanuzi huo umewekwa katika tanbihi.
- issue: Uhusiano wa genitive katika τοῦ πνεύματος βλασφημία
  choice: kufuru dhidi ya Roho
  alternative: kufuru ya Roho
  rationale: Muktadha unaonyesha kuwa Roho ndiye anayelengwa na kufuru, si kwamba kufuru hiyo inatoka kwa Roho. Tafsiri ya “dhidi ya” huwasilisha maana hii bila kuondoa uzito wa onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Mpangilio “Watu watasamehewa kila…” umetumiwa kwa uasilia wa Kiswahili, huku utofauti na kifungu cha pili ukihifadhiwa. “Kufuru” ni neno la kidini linaloeleweka na linafaa kwa usemi au tendo la kumvunjia Mungu heshima.
