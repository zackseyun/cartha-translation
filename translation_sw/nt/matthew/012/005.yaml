  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: sw
  text: Au hamjasoma katika Sheria kwamba siku za Sabato makuhani hekaluni huinajisi Sabato, na hawana hatia?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huivunja Sabato.” Kitenzi cha Kigiriki kina maana ya kukifanya kilicho kitakatifu kuwa cha kawaida au najisi.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “siku za Sabato,” kwa wingi; huenda kinarejelea siku za Sabato zinazojirudia, si tukio moja tu.'
    reason: lexical_alternative
  - marker: c
    text: “Sheria” hapa ni Sheria ya Musa katika Maandiko, huenda ikijumuisha maagizo kuhusu huduma ya makuhani siku ya Sabato (taz. Hes. 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Hutanguliza hoja nyingine ya Maandiko katika jibu la Yesu na kuhifadhi mtiririko wa swali la balagha.
- source_word: οὐκ ἀνέγνωτε
  choice: hamjasoma
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili katika swali la balagha kuhusu kuyafahamu Maandiko.
- source_word: ἐν τῷ νόμῳ
  choice: katika Sheria
  rationale: Herufi kubwa inaonyesha Sheria ya Musa kama sehemu ya Maandiko, si sheria kwa maana ya jumla.
- source_word: τοῖς σάββασιν
  choice: siku za Sabato
  rationale: Huhifadhi wingi wa Kigiriki na kueleza kwa Kiswahili cha kawaida matukio ya Sabato yanayojirudia.
- source_word: οἱ ἱερεῖς
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya makuhani waliohudumu katika hekalu.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Ni Kiswahili cha asili kinachorejelea eneo la hekalu bila kulazimisha maana finyu ya patakatifu pa ndani.
- source_word: τὸ σάββατον
  choice: Sabato
  rationale: Huhifadhi umoja unaorejelea siku au taasisi ya Sabato kama kitu kinachonajisiwa.
- source_word: βεβηλοῦσιν
  choice: huinajisi
  rationale: Huhifadhi maana yenye nguvu ya kukifanya kitu kitakatifu kuwa cha kawaida au najisi, badala ya kuipunguza kuwa kufanya kazi tu.
- source_word: ἀναίτιοί εἰσιν
  choice: hawana hatia
  rationale: Hutoa wazi maana ya kutokuwa na kosa linalostahili hukumu katika muktadha wa kisheria na wa hoja.
theological_decisions:
- issue: Iwapo kauli kuhusu makuhani ipunguzwe nguvu ili isidokeze kuinajisi Sabato kwa namna yoyote
  choice: Kuhifadhi usemi wenye nguvu “huinajisi Sabato” pamoja na “hawana hatia”
  alternative: “huivunja Sabato lakini hawana kosa” au “hufanya kazi siku ya Sabato lakini hawana hatia”
  rationale: 'Kigiriki hudumisha mvutano wa makusudi: huduma ya makuhani inaweza kuelezwa kwa kitenzi chenye maana ya kunajisi, lakini hawahesabiwi kuwa na hatia. Tafsiri haipaswi kuutatua mvutano huo kimya kimya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hamjasoma” na “hekaluni” ni miundo ya kawaida na inayoeleweka; “huinajisi” huhifadhi uzito na mvutano wa hoja ya asili.
