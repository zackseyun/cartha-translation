base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: sw
  text: Ama fanyeni[a] mti uwe mzuri na matunda yake yawe mazuri, ama fanyeni mti uwe mbovu na matunda yake yawe mabovu[b]; kwa maana mti hutambuliwa kwa matunda yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kigiriki ni amri, “fanyeni,” lakini hapa inaweza kutumiwa kwa balagha kwa maana ya “uchukulieni” au “uonyesheni kuwa.”
    reason: alternative_reading
  - marker: b
    text: Au “uliooza” na “yaliyooza”; neno la Kigiriki linaweza kumaanisha kilichooza, kilichoharibika, au kisichofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: ufanyeni ... kuwa
  rationale: Huhifadhi hali ya amri ya kitenzi cha Kigiriki na usambamba wa kauli zote mbili. Katika muktadha huu inaweza pia kuwa changamoto ya kimantiki ya kuuchukulia au kuuonyesha mti kuwa wa aina fulani, jambo linaloelezwa katika tanbihi bila kubadili umbo la matini.
- source_word: δένδρον
  choice: mti
  rationale: Ni kisawe cha kawaida na cha moja kwa moja kinachohifadhi picha kuu ya sitiari.
- source_word: καλός
  choice: mzuri / mazuri
  rationale: Neno hili huhifadhi maana ya ubora na pia mwangwi wa kimaadili bila kuibana maana iwe afya ya kimwili pekee.
- source_word: καρπός
  choice: matunda
  rationale: Ni usemi wa kawaida wa Kiswahili katika picha hii. Wingi wa kawaida wa Kiswahili umetumiwa ingawa Kigiriki kina umoja wa kijumla.
- source_word: σαπρός
  choice: mbovu / mabovu
  rationale: “Mbovu” linaweza kueleza kitu kilichoharibika, kilichooza, au kisichofaa, na linaendana kwa kawaida na mti pamoja na matunda. Tanbihi huhifadhi uwezekano wa tafsiri yenye picha dhahiri zaidi, “uliooza/yaliyooza.”
- source_word: Ἢ ... ἢ
  choice: Ama ... ama
  rationale: Huwasilisha kwa wazi uchaguzi wa pande mbili na kuhifadhi usambamba wa sentensi ya Kigiriki.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: kwa maana ... kwa matunda yake
  rationale: “Kwa maana” huonyesha uhusiano wa ufafanuzi wa γάρ, na “kwa matunda yake” ni njia ya kawaida ya Kiswahili ya kueleza msingi ambao mti hutambuliwa.
- source_word: γινώσκεται
  choice: hutambuliwa
  rationale: Huhifadhi maana ya hali tendwa ya wakati wa sasa na wazo la kutambua tabia ya mti kutokana na matunda yake.
theological_decisions:
- issue: Nguvu ya kauli za amri katika sitiari ya Yesu
  choice: 'Kauli za amri zimehifadhiwa: “ufanyeni ... kuwa.”'
  alternative: “uchukulieni mti kuwa ...” au “uonyesheni mti kuwa ...”
  rationale: Kigiriki kina kauli mbili za amri za moja kwa moja, ingawa huenda zimetumiwa kwa nguvu ya balagha. Kuzihifadhi huepuka kutatua kimyakimya mvutano wa iwapo Yesu anaamuru badiliko au anadai msimamo wenye uthabiti.
- issue: Maana ya maadili katika καλός na σαπρός
  choice: “mzuri” na “mbovu”
  alternative: “wenye afya” na “uliooza”
  rationale: Chaguo hili hudumisha pamoja picha ya mti na matunda na uzito wa kimaadili wa muktadha, bila kuifanya sitiari ihusu afya ya mmea pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ama ... ama” huhifadhi muundo wa pande mbili; “matunda” ni wingi wa kawaida wa kijumla katika Kiswahili. Usambamba na ukali wa kauli ya Yesu umehifadhiwa bila kuingiza ufafanuzi wa kimadhehebu.
