id: MAT.12.45
reference: Matthew 12:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: sw
  text: Kisha huenda na kuchukua pamoja naye roho saba nyingine zilizo mbaya kuliko yeye[a]. Nao huingia na kukaa humo; na hali ya mwisho ya mtu huyo huwa mbaya kuliko ya kwanza[b]. Ndivyo itakavyokuwa pia kwa kizazi hiki kiovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho saba tofauti, zilizo mbaya kuliko yeye.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, “mambo ya mwisho ya mtu huyo huwa mabaya kuliko ya kwanza,” nahau yenye maana kwamba hali yake ya mwisho huwa mbaya kuliko hali yake ya awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Huonyesha hatua inayofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: πορεύεται
  choice: huenda
  rationale: Wakati uliopo wa kisimulizi umetafsiriwa kwa mazoea ya Kiswahili yanayoonyesha kitendo cha kawaida katika mfano huu.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: kuchukua pamoja naye
  rationale: Huwasilisha maana ya kwenda na wengine kama waandamani wake; kiwakilishi cha ngeli ya roho kwa mtu mmoja ni cha kawaida na wazi katika Kiswahili.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: roho wengine saba
  rationale: ἕτερα inaonyesha roho wengine wanaoongezwa kwa yule wa kwanza, bila kulazimisha tofauti ya aina.
- source_word: πονηρότερα ἑαυτοῦ
  choice: walio waovu kuliko yeye
  rationale: Huhifadhi ulinganisho wa kiwango kikubwa zaidi cha uovu kwa lugha ya kawaida na yenye hadhi.
- source_word: εἰσελθόντα
  choice: Nao huingia
  rationale: Kitenzi kishirikishi cha Kigiriki kimewasilishwa kama kitenzi kamili ili mfuatano wa vitendo uwe wa asili kwa Kiswahili.
- source_word: κατοικεῖ ἐκεῖ
  choice: na kukaa humo
  rationale: Kukaa humo huonyesha kufanya mahali hapo kuwa makao, bila kutumia lugha ngumu isiyo ya lazima.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: hali ya mwisho ya mtu huyo huwa
  rationale: Ni tafsiri ya maana ya nahau inayohusu hali ya mtu mwishoni, huku tanbihi ikihifadhi umbo halisi zaidi.
- source_word: χείρονα τῶν πρώτων
  choice: mbaya kuliko ya kwanza
  rationale: Huhifadhi ulinganisho kati ya hali ya mwisho na hali ya awali kwa ufupi wa asili.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Ndivyo itakavyokuwa pia kwa kizazi hiki kiovu
  rationale: Huhifadhi matumizi ya mfano kwa kizazi kinachozungumziwa na tathmini yake ya kimaadili.
theological_decisions:
- issue: Maana ya πνεύματα katika muktadha wa pepo
  choice: roho
  alternative: pepo
  rationale: Neno la Kigiriki ni 'roho'; muktadha tayari unaonyesha kuwa ni roho wachafu, hivyo 'roho' huhifadhi msamiati wa chanzo bila kuongeza neno mahususi zaidi.
- issue: Uwasilishaji wa ἀνθρώπου
  choice: mtu huyo
  alternative: mwanamume huyo
  rationale: Katika Kiswahili, mtu ndilo neno la kawaida na sahihi la ἄνθρωπος kwa mwanadamu mmoja wa mfano; jinsia ya kisarufi ya Kigiriki hailazimishi maana ya mwanamume hapa.
- issue: Umoja wa κατοικεῖ baada ya kiima cha wingi
  choice: Nao huingia na kukaa humo
  alternative: naye hukaa humo
  rationale: Muktadha unaelekeza kwa roho wote kuingia na kufanya makao humo. Tafsiri haijengi fundisho juu ya kutopatana kwa umbo la kitenzi katika maandishi yaliyochapishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa mazoea 'hu-' unafaa simulizi la mfano huu; 'humo' hurejelea mahali palepale, yaani nyumba iliyotajwa katika muktadha.
