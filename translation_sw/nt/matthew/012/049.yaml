  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: sw
  text: Naye, akiunyosha mkono wake kuelekea wanafunzi wake, akasema, “Tazama, hawa ndio mama yangu na ndugu zangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: akiunyosha
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililoambatana na kusema; “akiunyosha” ni ya asili katika Kiswahili na huhifadhi ishara halisi.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: mkono wake
  rationale: “Mkono” ndilo neno la kawaida kwa χείρ katika muktadha huu wa kuashiria.
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: kuelekea wanafunzi wake
  rationale: Pamoja na hali ya kushutumiwa, ἐπί hapa huonyesha mwelekeo wa ishara, si mahali juu ya wanafunzi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno hili linavuta usikivu kwa msisitizo; “Tazama” ni la sasa, lenye hadhi, na linalofaa katika usemi wa moja kwa moja.
- source_word: ἡ μήτηρ μου
  choice: mama yangu
  rationale: Huhifadhi moja kwa moja neno halisi la undugu wa kifamilia.
- source_word: οἱ ἀδελφοί μου
  choice: ndugu zangu wa kiume
  rationale: “Ndugu” peke yake halibainishi jinsia katika Kiswahili, na “kaka” hudokeza hasa ndugu wa kiume aliye mkubwa. Ongezeko la “wa kiume” linawakilisha wazi umbo la kiume la Kigiriki bila kuingiza dada.
theological_decisions:
- issue: Lugha ya kifamilia katika kauli ya Yesu kuhusu uhusiano na wanafunzi wake
  choice: Kuhifadhi maneno halisi “mama yangu” na “ndugu zangu wa kiume”
  alternative: Kutumia maneno mapana kama “familia yangu” au “ndugu zangu” bila kubainisha jinsia
  rationale: Kauli hutumia mahusiano mahususi ya kifamilia ili kuwatambulisha wanafunzi kama jamaa wa Yesu. “Familia” ingepunguza nguvu ya usemi, na “ndugu” peke yake ingeficha umbo la kiume lililo katika maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “mama yangu na ndugu zangu wa kiume ndio hawa” ni wa asili na unaonyesha kwamba Yesu anawaelekezea wanafunzi wake kwa ishara. Hakuna tanbihi iliyohitajika.
