  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: sw
  text: Enyi uzao wa nyoka wenye sumu,[a] mnawezaje kusema mema, hali ninyi ni waovu? Kwa maana kinywa hunena kutokana na wingi wa yaliyomo moyoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Enyi watoto wa nyoka wenye sumu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kwa maana kinywa hunena kutokana na wingi wa moyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: uzao wa nyoka wenye sumu
  rationale: “Uzao” huhifadhi wazo la kile kilichozaliwa au kutokezwa, na “nyoka wenye sumu” huwasilisha kwa uwazi picha kali ya ἐχιδνῶν katika Kiswahili cha kawaida.
- source_word: πῶς δύνασθε
  choice: mnawezaje
  rationale: Hii ni njia ya kawaida na yenye nguvu ya kuuliza swali la kukemea linalodokeza kutowezekana au kutokuwa na uwezo.
- source_word: ἀγαθὰ λαλεῖν
  choice: kusema mambo mema
  rationale: Inahifadhi maana ya wingi ya ἀγαθά na maana ya kawaida ya λαλεῖν bila kuongeza ufafanuzi.
- source_word: πονηροὶ ὄντες
  choice: hali ninyi ni waovu
  rationale: “Hali” huonyesha mazingira au hali inayotajwa na kirai cha Kigiriki, huku “waovu” ikihifadhi uzito wa hukumu ya kimaadili.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Kwa maana ... yale yanayofurika kutoka moyoni
  rationale: “Yanayofurika” huonyesha kwa lugha ya kawaida picha ya wingi unaozidi na kutoka nje; “moyo” huhifadhi istilahi ya kibiblia kwa utu wa ndani.
- source_word: τὸ στόμα λαλεῖ
  choice: kinywa hunena
  rationale: Tafsiri hii ni ya moja kwa moja, yenye hadhi, na hudumisha uhusiano wa kisitiari kati ya moyo na kinywa.
theological_decisions:
- issue: Nguvu ya kisitiari ya “moyo”
  choice: Kuhifadhi “moyo” kama kituo cha utu wa ndani
  alternative: nafsi ya ndani; akili
  rationale: καρδία haimaanishi hisia pekee wala akili pekee; “moyo” huhifadhi upana na mvutano wa picha ya kibiblia bila kuifasiri kupita kiasi.
- issue: Sifa ya kimaadili katika πονηροὶ ὄντες
  choice: waovu
  alternative: wabaya
  rationale: “Waovu” hudumisha uzito wa hukumu ya kimaadili katika kukemea huku, ilhali “wabaya” ingeweza kusikika dhaifu au ya jumla zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Enyi” na “hunena” vinafaa kwa karipio la moja kwa moja na mtindo wa maandiko bila kuwa vya kizamani kupita kiasi.
