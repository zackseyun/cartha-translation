lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi; “Naye” ni cha kawaida katika simulizi la Kiswahili na kinaunganisha tendo hili na muktadha uliotangulia.
- source_word: ἐπετίμησεν
  choice: akawaonya vikali
  rationale: Kitenzi kinaweza kumaanisha kukemea, kuonya kwa ukali, au kutoa agizo kali. Katika muktadha huu, kishazi kinachofuata kinaonyesha katazo lenye msisitizo; “akawaonya vikali” linaonyesha uzito wake bila kudokeza moja kwa moja kwamba waliokuwa wakisemeshwa walikuwa na kosa la kimaadili.
- source_word: αὐτοῖς
  choice: -wa- katika “akawaonya”
  rationale: Kiwakilishi cha wingi cha yambwa kisicho cha moja kwa moja kimewasilishwa kiasili kwa kiambishi cha yambwa “-wa-” katika kitenzi cha Kiswahili.
- source_word: ἵνα μὴ
  choice: wasim-
  rationale: Muundo wa ἵνα pamoja na μή baada ya kitenzi cha kuonya unaonyesha maudhui ya katazo; hali ya utegemezi ya Kiswahili katika “wasimjulishe” inaleta maana hiyo kwa ufasaha.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: wasimjulishe kwa watu
  rationale: Nahau hiyo inamaanisha kumfanya ajulikane au kumtangaza hadharani. “Kumjulisha kwa watu” ni usemi wa sasa na unaoeleweka, huku ukihifadhi yambwa ya kibinafsi “yeye” katika kiambishi “-m-” na wazo la kufichua kwa wengine.
theological_decisions:
- issue: Asili ya kauli ya Yesu kuhusu kutangazwa kwake
  choice: Onyo kali la kutomjulisha kwa watu
  alternative: Kuwakemea waliokuwa wakisemeshwa, au kuwapa amri rasmi
  rationale: Kigiriki kinaonyesha katazo lenye nguvu, lakini hakitaji sababu yake ya kiteolojia. Tafsiri inaacha mvutano huo wazi na haiingizi maelezo kuhusu kwa nini Yesu hakutaka ajulikane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Akawaonya vikali” hudumisha nguvu ya ἐπετίμησεν; tanbihi huhifadhi uwezekano wa maana ya katazo au amri.
