  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: sw
  text: Lakini kama mngejua maana ya maneno haya,[a] ‘Ninataka rehema, wala si dhabihu,’ msingewatia hatiani wale wasio na hatia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesu ananukuu Hosea 6:6.
    reason: cross_reference
  - marker: b
    text: Au, “wasio na kosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: mngejua
  rationale: Katika sentensi hii ya sharti lisilotimia, ‘mngejua’ huonyesha kwamba walipaswa kuwa wameelewa hapo awali, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: τί ἐστιν
  choice: maana ya maneno haya
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuingiza ufafanuzi wa nukuu ya Maandiko; ‘maneno haya’ huweka wazi kuwa Yesu anarejelea nukuu inayofuata bila kubadili maana.
- source_word: Ἔλεος
  choice: rehema
  rationale: ‘Rehema’ ni neno la kawaida na lenye hadhi linalowasilisha huruma inayotakiwa na Mungu katika nukuu hii.
- source_word: θέλω
  choice: Ninataka
  rationale: ‘Ninataka’ ni tafsiri ya moja kwa moja na ya sasa ya θέλω; pamoja na muktadha wa Mungu anayesema, ina uzito unaofaa bila lugha ya kizamani.
- source_word: θυσίαν
  choice: dhabihu
  rationale: ‘Dhabihu’ ni neno sanifu la Kiswahili kwa sadaka inayotolewa kwa ibada na linahifadhi umoja wa neno la Kigiriki.
- source_word: κατεδικάσατε
  choice: msingewahukumu
  rationale: Muundo huu huonyesha matokeo yasiyotokea ya sharti na huhifadhi nguvu ya kimahakama ya kitenzi, yaani kuwahesabu au kuwatangaza kuwa na hatia.
- source_word: ἀναιτίους
  choice: wale wasio na hatia
  rationale: Kauli hii ya kawaida na iliyo wazi huhifadhi maana ya kimahakama ya ἀναίτιος na uhusiano wake na ‘kuhukumu.’
theological_decisions:
- issue: Kuhifadhi mkazo wa kinabii wa Hosea 6:6 bila kudai kwamba dhabihu zote zimebatilishwa
  choice: ‘Ninataka rehema, wala si dhabihu’
  alternative: ‘Ninataka rehema kuliko dhabihu’
  rationale: Kigiriki kina kiunganishi cha wazi ‘na si,’ hivyo tafsiri inadumisha utofautishaji mkali wa nukuu. Haiongezi ‘kuliko,’ ambalo lingeweza kupunguza mvutano wa maneno, wala haifafanui zaidi kana kwamba Yesu anatangaza hapa kufutwa kwa kila dhabihu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti ‘kama mngejua … msingewahukumu’ ni wa asili na unaonyesha hali isiyotimia. ‘Wala si’ hudumisha uzito wa nukuu ya kinabii.
