source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: sw
  text: Lakini akawaambia, “Ni mtu gani miongoni mwenu ambaye, akiwa na kondoo mmoja, kondoo huyo akianguka shimoni siku ya Sabato[a], hatamshika na kumwinua kutoka humo[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani kina usemi wa wingi, “siku za Sabato,” ambao hapa ni namna ya kusema “siku ya Sabato.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kumshika na kumwinua?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Ni mtu gani miongoni mwenu ambaye
  rationale: Muundo huu unawasilisha swali la balagha linalotarajia jibu chanya. ‘Mtu’ ni tafsiri ya kawaida ya ἄνθρωπος katika mfano huu na haisisitizi jinsia kuliko neno la Kiyunani linavyohitaji.
- source_word: ἕξει πρόβατον ἕν
  choice: akiwa na kondoo mmoja
  rationale: Ingawa ἕξει ni kitenzi cha wakati ujao kwa umbo, hapa ni sehemu ya hali ya kudhaniwa. ‘Akiwa na’ ni Kiswahili cha kawaida na huhifadhi msisitizo wa kondoo mmoja.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: kondoo huyo akianguka
  rationale: Kurudia ‘kondoo huyo’ kunafanya rejeo la τοῦτο liwe wazi na la kawaida kwa Kiswahili kuliko kutumia kiwakilishi kisicho na rejeo dhahiri.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Wingi wa Kiyunani ni matumizi ya kinahau yanayoweza kumaanisha siku ya Sabato; umoja ni wa kawaida na wazi katika Kiswahili.
- source_word: εἰς βόθυνον
  choice: shimoni
  rationale: βόθυνος ni shimo au bonde lililochimbika. ‘Shimoni’ ni neno pana, la kawaida, lisilobainisha aina ya shimo bila ushahidi.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: hatamshika
  rationale: οὐχί huanzisha swali linalotarajia jibu la kukubali. ‘Hatamshika’ huwasilisha matarajio hayo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: καὶ ἐγερεῖ
  choice: na kumwinua kutoka humo
  rationale: ἐγείρω humaanisha kuinua; katika muktadha wa kondoo aliye shimoni, ‘kutoka humo’ huweka wazi mwelekeo unaodokezwa bila kubadili tendo kuu la kumwinua.
theological_decisions:
- issue: Lugha wakilishi ya ἄνθρωπος
  choice: mtu
  alternative: mwanamume
  rationale: ἄνθρωπος hapa humaanisha mtu katika mfano wa jumla, si lazima mwanamume kwa maana ya jinsia. ‘Mtu’ huhifadhi upana halisi wa neno na ni ya kawaida katika swali hili.
- issue: Umoja au wingi wa σάββασιν
  choice: siku ya Sabato
  alternative: siku za Sabato
  rationale: Wingi wa Kiyunani ni wa kinahau katika mazingira haya. Umoja unaonyesha siku ya Sabato inayohusika katika hoja kuhusu yanayoruhusiwa siku hiyo bila kudokeza matukio kadhaa.
- issue: Maana ya ἐγερεῖ katika mfano
  choice: kumwinua kutoka humo
  alternative: kumwinua
  rationale: Tafsiri kuu inaeleza mwelekeo unaodokezwa na shimo, lakini tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la Kiyunani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kwa wasomaji wa leo. Swali la balagha na jibu chanya linalotarajiwa vimehifadhiwa. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
