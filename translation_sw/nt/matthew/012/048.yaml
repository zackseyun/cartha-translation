base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: sw
  text: Lakini akamjibu yule aliyekuwa akisema naye[a], “Mama yangu ni nani, na ndugu zangu wa kiume ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “Lakini akajibu, akamwambia yule aliyekuwa akisema naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Lakini akamjibu
  rationale: Muundo wa Kigiriki ‘alijibu akasema’ ni nahau yenye athari ya Kisemiti. Kiswahili cha kawaida huwasilisha maana hiyo kwa ‘akamjibu’ bila uradidi usio wa lazima; ‘Lakini’ linawakilisha δέ na mgeuko wa mazungumzo.
- source_word: τῷ λέγοντι αὐτῷ
  choice: yule aliyekuwa akisema naye
  rationale: Kirai hiki ni kishiriki cha wakati uliopo kilichotumika kama nomino katika hali ya dative, kikimtaja mtu aliyekuwa akizungumza na Yesu. ‘Aliyekuwa akisema naye’ huhifadhi tendo linaloendelea na uhusiano wa mazungumzo.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Mama yangu ni nani
  rationale: Hili ni swali la utambulisho. Mpangilio huu ni wa asili katika Kiswahili na unahifadhi maana ya moja kwa moja.
- source_word: καὶ τίνες εἰσὶν
  choice: na ... ni nani
  rationale: Ingawa τίνες ni wingi, Kiswahili hutumia ‘nani’ kwa umoja na wingi kulingana na muktadha; kirai hiki hudumisha ulinganifu wa maswali mawili.
- source_word: οἱ ἀδελφοί μου
  choice: ndugu zangu wa kiume
  rationale: ἀδελφοί hapa ni nomino ya udugu ya jinsia ya kiume na inarejelea kaka/ndugu wa Yesu katika simulizi. ‘Ndugu zangu wa kiume’ huepuka utata wa ‘ndugu’ peke yake, ambalo katika Kiswahili linaweza kujumuisha wanawake au jamaa kwa upana.
theological_decisions:
- issue: Uwezekano wa kulainisha swali la balagha la Yesu kuhusu utambulisho wa familia
  choice: Kuhifadhi maswali ya moja kwa moja bila ufafanuzi wa ziada
  alternative: Ni nani anayehesabiwa kuwa mama yangu, na ni nani wanaohesabiwa kuwa ndugu zangu wa kiume?
  rationale: Muktadha unaofuata unaeleza upya uhusiano wa kifamilia, lakini mstari huu wenyewe haupaswi kuingiza maelezo hayo. Tafsiri ya moja kwa moja huhifadhi mvutano wa simulizi na wa kiteolojia.
- issue: Uwasilishaji wa jinsia katika ἀδελφοί
  choice: ndugu zangu wa kiume
  alternative: ndugu zangu; kaka zangu; ndugu zangu wa kiume na wa kike
  rationale: Rejeleo la karibu ni wanafamilia wa Yesu waliotajwa katika tukio, na neno la chanzo ni la kiume. ‘Ndugu zangu wa kiume’ huhifadhi jinsia hiyo bila kupanua maana kuwa kundi mchanganyiko; pia ni pana kidogo kuliko ‘kaka’ kwa kuwa ἀδελφός haibainishi kwa lazima ndugu mkubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamjibu’ ni cha kawaida na fasaha; tanbihi huhifadhi muundo rasmi zaidi wa ἀποκριθεὶς εἶπεν. ‘Ndugu zangu wa kiume’ limetumiwa kwa usahihi wa jinsia licha ya kuwa zito kidogo kuliko ‘ndugu zangu’.
