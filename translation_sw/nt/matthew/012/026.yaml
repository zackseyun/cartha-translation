  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: sw
  text: Na ikiwa Shetani anamfukuza Shetani[a], amegawanyika dhidi yake mwenyewe[b]. Basi ufalme wake utasimamaje?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anamtoa Shetani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aligawanywa dhidi yake mwenyewe.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Basi ufalme wake utawezaje kusimama?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi καί na sharti εἰ, na kuendeleza mtiririko wa hoja kutoka muktadha uliotangulia.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina au cheo hiki katika Kiswahili cha Biblia.
- source_word: ἐκβάλλει
  choice: anamfukuza
  rationale: Katika muktadha wa kutoa pepo, ‘kumfukuza’ ni usemi wa kawaida na huonyesha kwa usahihi tendo la kumtoa kwa nguvu.
- source_word: ἐφ’ ἑαυτὸν
  choice: dhidi yake mwenyewe
  rationale: Inahifadhi maana ya upinzani wa ndani iliyo katika ἐπί pamoja na kiwakilishi jirejeshi.
- source_word: ἐμερίσθη
  choice: amegawanyika
  rationale: Kauli hii inaonyesha hali iliyotokana na tendo la kudhaniwa; wakati timilifu wa Kiswahili huwasilisha vizuri matokeo ya aoristi tendwa hapa bila kulazimisha mtendaji wa nje.
- source_word: πῶς οὖν
  choice: Basi ... -je?
  rationale: ‘Basi’ linabeba hitimisho la οὖν, huku muundo wa swali wenye ‘-je’ ukitoa maana ya πῶς kwa Kiswahili cha kawaida.
- source_word: σταθήσεται
  choice: utasimamaje
  rationale: Inadumisha sitiari ya ‘kusimama’ kwa maana ya kuendelea kuwapo au kudumu.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ufalme wake
  rationale: ‘Ufalme’ linafaa kwa taswira ya mamlaka iliyogawanyika na haliondoi uwezekano wa βασιλεία kumaanisha eneo au utawala.
theological_decisions:
- issue: Maana na nguvu ya Shetani kujigawa mwenyewe
  choice: 'Kauli imetafsiriwa kama hoja ya kuonyesha kutowezekana: ikiwa Shetani anamfukuza Shetani, ufalme wake unakuwa na mgawanyiko wa ndani na hauwezi kusimama.'
  alternative: Tafsiri ya ufafanuzi zaidi ingeweza kuingiza wazi taswira ya nyumba iliyogawanyika kutoka muktadha mpana.
  rationale: Kigiriki chenyewe kinataja mgawanyiko na swali la kusimama kwa ufalme bila kusema ‘nyumba’ katika aya hii; tafsiri haiongezi taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; ‘Shetani,’ ‘ufalme,’ na sitiari ya ‘kusimama’ zimehifadhiwa kwa sababu ni istilahi na taswira asilia za aya.
