  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu ndiye Bwana wa Sabato.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwana wa Adamu ana mamlaka juu ya Sabato.”
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Adamu” ni namna ya Yesu kujitaja inayojirudia katika Injili; kwa maana ya kijumla zaidi, maneno hayo yanaweza kutafsiriwa “mwanadamu,” ingawa tafsiri hiyo hudhoofisha maana yake inayowezekana kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya maelezo ya kauli hii, ikiunganisha na hoja iliyotangulia.
- source_word: κύριος
  choice: Bwana
  rationale: Inahifadhi maana ya mamlaka pamoja na uzito wa cheo hiki katika muktadha wa Kikristo; “mtawala” au “mwenye mamlaka” kungekuwa ufafanuzi zaidi kuliko muundo wa Kigiriki.
- source_word: τοῦ σαββάτου
  choice: wa Sabato
  rationale: Hufuata kwa kawaida uhusiano wa kimilikishi baada ya κύριος na kurejelea siku na taasisi takatifu ya Kiyahudi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni namna ya Yesu ya kujitaja inayotambulika katika Injili na inahifadhi mwangwi unaowezekana wa Danieli 7; tafsiri ya kijumla kama “mwanadamu” ingeufifisha uzito huo.
- source_word: ἐστιν
  choice: ndiye
  rationale: Kiswahili cha “ndiye” kinatoa kiunganishi cha sasa kwa njia ya asili na kusisitiza kiima kilichowekwa mwishoni katika Kigiriki bila kuongeza wazo jipya.
theological_decisions:
- issue: Nguvu ya Kikristo ya κύριος ... τοῦ σαββάτου
  choice: Mwana wa Adamu ndiye Bwana wa Sabato
  alternative: Mwana wa Adamu ana mamlaka juu ya Sabato
  rationale: “Bwana” inahifadhi dai lenye nguvu la mamlaka bila kulipanua zaidi ya matini, huku mbadala ukieleza maana kwa uwazi zaidi lakini ukipunguza uzito wa cheo.
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: mwanadamu
  rationale: Tafsiri ya kichwa cha heshima inahifadhi namna maalumu ya Yesu ya kujitaja na mvutano wake wa kimuktadha na wa kimaandiko, badala ya kuifanya kuwa kauli ya kijumla kuhusu binadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “ndiye Bwana” ni wa asili na unahifadhi msisitizo wa sentensi ya Kigiriki. “Sabato” imeandikwa kwa herufi kubwa kwa kuwa hapa ni siku na taasisi maalumu ya Kiyahudi.
