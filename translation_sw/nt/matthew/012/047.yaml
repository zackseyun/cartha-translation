  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: sw
  text: Kisha mtu mmoja akamwambia[a], “Tazama, mama yako na ndugu zako wa kiume wamesimama nje, wakitaka kusema nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina mstari huu.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Kisha mtu mmoja akamwambia
  rationale: δέ ni kiunganishi chepesi cha simulizi, na “kisha” kinaendeleza tukio kwa kawaida bila kuonyesha utofauti mkali. τις ni mtu asiyeainishwa, hivyo “mtu mmoja” ni Kiswahili cha asili.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta fikira; “Tazama” linahifadhi nguvu yake ya kuelekeza uangalifu kwa lugha yenye heshima na inayoeleweka.
- source_word: ἡ μήτηρ σου
  choice: mama yako
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya nomino pamoja na kiwakilishi cha umilikaji.
- source_word: οἱ ἀδελφοί σου
  choice: ndugu zako wa kiume
  rationale: ἀδελφοί katika muktadha huu inarejelea ndugu wa kiume. Ufafanuzi “wa kiume” unaepusha utata wa neno la Kiswahili “ndugu,” ambalo pekee linaweza kumaanisha jamaa au ndugu wa jinsia yoyote.
- source_word: ἔξω ἑστήκασιν
  choice: wamesimama nje
  rationale: Kauli timilifu ya ἵστημι inaonyesha hali ya sasa iliyotokana na kusimama; “wamesimama nje” huhifadhi hali hiyo na neno ἔξω.
- source_word: ζητοῦντες
  choice: wakitaka
  rationale: Katika muktadha huu ζητέω pamoja na kitenzi-jina huonyesha nia au kusudi la kujaribu kupata nafasi ya kusema. “Wakitaka” ni ya asili zaidi katika Kiswahili kuliko “wakitafuta kusema,” huku ikihifadhi kusudi bila kuongeza sababu.
- source_word: σοι λαλῆσαι
  choice: kusema nawe
  rationale: Dativo σοι na kitenzi-jina λαλῆσαι huwasilishwa kwa kawaida kama “kusema nawe,” ambayo inaonyesha mawasiliano yaliyoelekezwa kwake.
theological_decisions:
- issue: Hali ya kimaandishi ya Mathayo 12:47
  choice: Kulijumuisha fungu katika maandishi makuu na kuweka alama ya tanbihi baada ya “akamwambia.”
  alternative: Kuliondoa fungu kwa sababu halipo katika baadhi ya hati za kale.
  rationale: SBLGNT iliyotolewa inalionesha fungu hili likiwa limewekewa mabano ya uhakiki wa maandishi. Kulitafsiri na kutaja tofauti hiyo katika tanbihi huhifadhi ushahidi uliotolewa bila kuficha tofauti muhimu ya hati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” limetumiwa kama neno la kuvuta fikira; “ndugu zako wa kiume” linaweka wazi maana ya kijinsia ya ἀδελφοί; na “wakitaka kusema nawe” ni mtiririko wa kawaida wa Kiswahili.
