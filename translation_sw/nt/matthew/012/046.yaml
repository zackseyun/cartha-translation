  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: sw
  text: Alipokuwa bado akizungumza na makundi ya watu, tazama, mama yake na ndugu zake wa kiume[a] walikuwa wamesimama nje, wakitaka kuzungumza naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu zake,” ikiwa ἀδελφοί linaeleweka kwa maana pana ya jamaa wa karibu. Neno la Kigiriki hapa ni la wingi wa kiume; mstari huu wenyewe hauelezi uhusiano wao mahususi na Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Alipokuwa bado akizungumza
  rationale: Muundo huu unaonyesha kwamba kitendo cha kuzungumza kilikuwa kikiendelea huku tukio jipya likitokea; δέ ni kiunganishi hafifu cha simulizi ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: τοῖς ὄχλοις
  choice: na makundi ya watu
  rationale: Huhifadhi wingi wa ὄχλοις kwa Kiswahili cha kawaida na kinachoeleweka, badala ya kuifanya kuwa umati mmoja.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni alama ya usemi inayovuta fikira kwenye tukio jipya; “tazama” huhifadhi msisitizo na uchangamfu wa simulizi.
- source_word: ἡ μήτηρ
  choice: mama yake
  rationale: Kiswahili huhitaji uhusiano huo kusemwa wazi kwa kawaida; “yake” inaeleweka kutokana na αὐτοῦ katika rejeleo la familia.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ndugu zake wa kiume
  rationale: ἀδελφοί ni nomino ya wingi wa kiume. Tafsiri hii inaonyesha jinsia ya kundi bila kuamua kama walikuwa ndugu wa tumbo moja, ndugu wa ukoo, au jamaa wengine wa karibu.
- source_word: εἱστήκεισαν ἔξω
  choice: walikuwa wamesimama nje
  rationale: Huwasilisha hali endelevu ya kitenzi cha pluperfect pamoja na maana ya ἔξω bila kuongeza mahali kama “nje ya nyumba,” pasipotajwa katika mstari huu.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: wakitaka kuzungumza naye
  rationale: Katika muktadha huu ζητέω huonyesha kusudi au nia ya kupata nafasi ya kuzungumza. Kiswahili “wakitaka” ni cha kawaida na hakidokezi kwamba walikuwa wakimtafuta mahali fulani.
theological_decisions:
- issue: Utambulisho na uhusiano wa οἱ ἀδελφοὶ αὐτοῦ na Yesu
  choice: ndugu zake wa kiume
  alternative: ndugu zake; kaka na ndugu zake wengine wa kiume; jamaa zake wa karibu
  rationale: Maandishi ya Kigiriki yana wingi wa kiume, lakini neno ἀδελφοί lenyewe halisuluhishi mijadala ya baadaye kuhusu uhusiano wao mahususi na Yesu. Matini kuu huonyesha jinsia ya kisarufi na dokezo la kawaida, huku tanbihi ikihifadhi uwezekano mpana wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” huhifadhi alama ya simulizi ya ἰδού. “Makundi ya watu” hutunza wingi wa Kigiriki, na “walikuwa wamesimama” hutunza hali inayoendelea bila kuwa ngumu kupita kiasi.
