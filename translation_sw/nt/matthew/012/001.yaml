id: MAT.12.1
reference: Matthew 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: sw
  text: Wakati huo Yesu alipita katika mashamba ya nafaka siku ya Sabato[a]. Wanafunzi wake wakawa na njaa, wakaanza kuchuma masuke na kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “siku za Sabato”; hapa wingi huo ni nahau yenye maana ya “siku ya Sabato.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Wakati huo
  rationale: Kirai hiki kinaonyesha wakati au tukio katika mtiririko wa simulizi, si saa kamili. “Wakati huo” ni Kiswahili cha kawaida na cha heshima.
- source_word: ἐπορεύθη
  choice: alipita
  rationale: Kitenzi hiki humaanisha kwenda au kusafiri; pamoja na διὰ, “alipita katikati ya” kinaeleza mwendo kupitia mashamba kwa Kiswahili cha asili.
- source_word: τοῖς σάββασιν
  choice: siku ya Sabato
  rationale: Ingawa umbo la Kigiriki ni la wingi, hapa ni matumizi ya kawaida ya lugha yanayorejelea siku ya Sabato; umoja unaeleza maana bila kupotosha.
- source_word: διὰ τῶν σπορίμων
  choice: katikati ya mashamba ya nafaka
  rationale: σπόριμος hurejelea mashamba yaliyopandwa, hasa ya nafaka. Usemi huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Wanafunzi wake
  rationale: δέ hapa ni kiunganishi hafifu cha kuendeleza simulizi, si lazima kiwe na maana kali ya kupinga. Kugawa sentensi kunaleta mtiririko wa asili.
- source_word: ἐπείνασαν
  choice: wakawa na njaa
  rationale: Aoristi inaweza kuonyesha kuanza kwa hali ya njaa. “Wakawa na njaa” huwasilisha kuingia katika hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἤρξαντο
  choice: wakaanza
  rationale: Kitenzi hiki kinaonyesha mwanzo wa kitendo, na “wakaanza” huhifadhi maana hiyo wazi.
- source_word: τίλλειν
  choice: kuchuma
  rationale: τίλλω ni kung’oa au kuchuma kwa mkono. “Kuchuma” ndilo neno la kawaida na sahihi kwa kuondoa masuke kwenye mimea.
- source_word: στάχυας
  choice: masuke
  rationale: στάχυς ni suke la nafaka. “Masuke” ni neno sahihi, fupi, na linaloeleweka katika Kiswahili sanifu.
- source_word: καὶ ἐσθίειν
  choice: na kula
  rationale: Kitenzi-jina hiki kinaratibiwa na τίλλειν baada ya ἤρξαντο; “wakaanza kuchuma masuke na kula” ni muundo wa asili unaohifadhi uratibu huo.
theological_decisions:
- issue: Tafsiri ya τοῖς σάββασιν
  choice: siku ya Sabato
  alternative: siku za Sabato
  rationale: Umbo la Kigiriki ni la wingi, lakini katika matumizi haya ni nahau inayorejelea siku ya Sabato. Umoja huepuka kutoa dhana isiyokusudiwa kwamba matukio yalitokea katika Sabato kadhaa, huku tanbihi ikihifadhi taarifa ya umbo la asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mashamba ya nafaka,” “wakawa na njaa,” na “kuchuma masuke” ni misemo ya kawaida na inayoeleweka. Sentensi imegawanywa mara mbili ili simulizi lisomeke kwa urahisi bila kubadili uhusiano wa vishazi vya Kigiriki.
