  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: sw
  text: Naye akaondoka hapo, akaingia katika sinagogi lao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya asili katika Kiswahili bila kuongeza maana mahsusi ya wakati.
- source_word: μεταβὰς ἐκεῖθεν
  choice: akaondoka hapo
  rationale: Huwasilisha mwendo kutoka mahali palipotajwa awali kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: ἦλθεν
  choice: akaingia
  rationale: Katika muundo huu, kitenzi cha mwendo pamoja na εἰς kinaeleza kufika na kuingia ndani; Kiswahili 'akaingia' huwasilisha mwelekeo huo kwa kawaida.
- source_word: εἰς τὴν συναγωγὴν
  choice: katika sinagogi
  rationale: ‘Katika’ pamoja na ‘akaingia’ huonyesha mwendo wa kuingia ndani, si kufika karibu tu.
- source_word: συναγωγὴν
  choice: sinagogi
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa mahali pa Wayahudi pa kukusanyika na kuabudu.
- source_word: αὐτῶν
  choice: lao
  rationale: Huhifadhi kiwakilishi cha umilikaji cha wingi bila kubainisha zaidi watu wanaorejelewa kuliko Kigiriki kinavyofanya.
theological_decisions:
- issue: Wanaorejelewa na ‘sinagogi lao’
  choice: sinagogi lao
  alternative: mahali pao pa kukutania
  rationale: Kigiriki hakibainishi zaidi kundi linalorejelewa wala hakiongezi dhana ya uhasama; tafsiri inadumisha usemi huo usioegemea upande.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vinavyofuatana—‘akaondoka ... akaingia’—unatoa simulizi la asili huku ukihifadhi mpito wa mahali katika Kigiriki.
