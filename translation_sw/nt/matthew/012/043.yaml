  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: sw
  text: Roho mchafu anapomtoka mtu, hupitia maeneo yasiyo na maji[a] akitafuta pumziko, na haipati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo makavu.” Kigiriki ni, kwa maana halisi, “maeneo yasiyo na maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: anapo-
  rationale: Muundo huu unaonyesha hali ya wakati inayoweza kutokea kwa ujumla. Kiunganishi δέ ni mpito hafifu wa mazungumzo; hakihitaji neno tofauti hapa kwa sababu kuongeza “basi” kungefanya mpito huo kuwa mzito kuliko ulivyo katika muktadha huu.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: roho mchafu
  rationale: Hili ni neno la kawaida na wazi katika masimulizi ya kufukuza pepo, nalo linadumisha maana ya uchafu badala ya kubadili neno la chanzo kuwa “pepo.”
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: anapomtoka mtu
  rationale: Kiswahili cha kawaida hutumia “-mtoka mtu” kueleza roho inayotoka ndani au kwa mtu. “Mtu” linafaa katika mfano huu wa jumla bila kulazimisha jinsia ambayo ἄνθρωπος yenyewe haihitaji hapa.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: hupitia maeneo yasiyo na maji
  rationale: “Hupitia” linaonyesha mwendo kupitia sehemu mbalimbali, na “maeneo yasiyo na maji” linadumisha taswira halisi ya ἄνυδρος na wingi wa τόπων.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: akitafuta pumziko
  rationale: Muundo wa “akitafuta” unaonyesha tendo linaloendelea wakati roho inapitia maeneo hayo; “pumziko” ni tafsiri ya moja kwa moja isiyoongeza wazo maalumu la mahali pa kupumzikia.
- source_word: καὶ οὐχ εὑρίσκει
  choice: lakini halipati
  rationale: Katika Kiswahili, “lakini” huonyesha kwa kawaida matokeo yaliyotarajiwa kutotokea. Kitu kinachotafutwa—pumziko—kinaeleweka bila kurudiwa.
theological_decisions:
- issue: Tafsiri ya πνεῦμα katika muktadha wa kufukuza pepo
  choice: roho
  alternative: pepo
  rationale: Ingawa muktadha unaonyesha kiumbe waovu wa kiroho, maandishi yanasema πνεῦμα, si δαιμόνιον. “Roho mchafu” inadumisha istilahi na mvutano wa maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Upatanisho wa kisarufi unaomrejelea roho kama kiumbe hai umetumiwa katika “anapomtoka,” “hupitia,” na “halipati.” Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “maeneo yasiyo na maji.”
