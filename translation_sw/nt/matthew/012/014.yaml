  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: sw
  text: Lakini Mafarisayo walitoka, wakapanga njama dhidi yake, jinsi ya kumwangamiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumuua” au “kumwondolea uhai.” Kigiriki kinasema “kumwangamiza,” neno ambalo katika muktadha huu linaweza kujumuisha nia ya kumuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: walitoka
  rationale: Kauli ya wakati uliopita yenye uhusiano wa mfuatano; “walitoka” ni ya kawaida na inahifadhi tendo la kuondoka kabla ya kupanga njama.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha geuko lenye utofautishaji kutoka tendo la Yesu kwenda jibu la uhasama la Mafarisayo.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hilo la Kiyahudi.
- source_word: συμβούλιον ἔλαβον
  choice: wakapanga njama
  rationale: Nahau hiyo kihalisi ni “walifanya shauri,” lakini katika muktadha huu inaonyesha kupanga kwa makusudi jambo la uhasama. “Wakapanga njama” ni Kiswahili cha kawaida na hakizidi kusudi linaloelezwa baadaye.
- source_word: κατ’ αὐτοῦ
  choice: dhidi yake
  rationale: κατά pamoja na umilikishi ina maana ya uhasama hapa.
- source_word: ὅπως
  choice: kuhusu jinsi ya
  rationale: Inatambulisha yaliyomo katika mpango wao pamoja na kusudi lake; usemi huu unahifadhi wazo la kutafuta namna ya kutekeleza njama.
- source_word: ἀπολέσωσιν
  choice: kumwangamiza
  rationale: ἀπόλλυμι inaweza kumaanisha kuangamiza au kuua. “Kumwangamiza” huhifadhi upana wa kitenzi cha Kigiriki huku muktadha ukidokeza wazi nia inayoweza kuwa ya kumuua.
theological_decisions:
- issue: Kiwango cha umahususi katika kutafsiri ἀπολέσωσιν
  choice: kumwangamiza
  alternative: kumuua; kumwondolea uhai
  rationale: Muktadha unaonyesha nia kali ya uhasama, huenda ya kumuua, lakini kitenzi cha Kigiriki ni kipana kuliko kitenzi kinachosema wazi “kuua.” Matini kuu inahifadhi upana huo, na tanbihi inatoa maana mahususi inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wakapanga njama” ni ya asili zaidi kuliko tafsiri ya neno kwa neno “wakafanya shauri,” huku “kuhusu jinsi ya” ikihifadhi kipengele cha kupanga namna ya kutekeleza kusudi lao.
