  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: sw
  text: Lakini ninawaambia kwamba kila neno la ovyo[a] ambalo watu watasema, watatoa hesabu kwa ajili yake siku ya hukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno lisilo na manufaa.” Neno la Kigiriki linaweza kumaanisha lisilo na kazi, lisilo na matokeo, au la kizembe.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: Kitenzi cha wakati uliopo na kiwakilishi cha moja kwa moja vimehifadhiwa. δέ hapa inaonyesha tofauti ya onyo hili na yaliyotangulia, hivyo “Lakini” inafaa katika muktadha.
- source_word: πᾶν ῥῆμα
  choice: kila neno
  rationale: πᾶν pamoja na nomino ya umoja ina maana ya mgawanyo, “kila”; ῥῆμα hapa ni neno au tamko linalosemwa.
- source_word: ἀργὸν
  choice: la ovyo
  rationale: Kauli hii ya kawaida ya Kiswahili huonyesha neno lisilofikiriwa vizuri, lisilo na faida, au lililotamkwa bila uwajibikaji. Inabeba uzito wa kimaadili wa muktadha bila kulifanya kuwa lazima neno la uovu wa makusudi.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: ambalo watu watasema
  rationale: Wakati ujao wa λαλήσουσιν umehifadhiwa, na οἱ ἄνθρωποι imetafsiriwa kwa maana yake jumuishi ya wanadamu kwa neno la kawaida “watu.”
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: watalitolea hesabu
  rationale: Hii ni tafsiri ya asili ya nahau ya kutoa hesabu kuhusu jambo fulani. Kiambishi “-li-” kinarejelea wazi kila neno, bila urudiaji mzito.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: siku ya hukumu
  rationale: Kirai hiki kinaonyesha wakati wa hukumu ya kimahakama; “siku ya hukumu” ni Kiswahili wazi na kilichozoeleka.
theological_decisions:
- issue: Uzito wa kimaadili wa ἀργόν
  choice: neno la ovyo
  alternative: neno lisilo na maana; neno lisilo na manufaa
  rationale: Onyo linahusu uwajibikaji katika hukumu, kwa hiyo tafsiri inapaswa kuonyesha usemi wa kizembe au usio na uwajibikaji, lakini isiweke maana finyu ya neno ovu au la kudhuru kwa makusudi.
- issue: Maana jumuishi ya οἱ ἄνθρωποι
  choice: watu
  alternative: wanadamu
  rationale: Neno la Kigiriki linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni sahihi na la kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “La ovyo” ni usemi wa kawaida lakini si wa kiholela, na tanbihi inalinda upana wa maana ya neno la Kigiriki.
