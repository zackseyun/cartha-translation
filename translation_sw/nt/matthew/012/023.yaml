  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: sw
  text: Makutano yote yakastaajabu, yakasema[b], “Je, inawezekana huyu ndiye Mwana wa Daudi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa Daudi” ni cheo cha Kimasihi kinachomhusu mkombozi wa kifalme aliyeahidiwa kutoka ukoo wa Daudi.
    reason: cross_reference
  - marker: b
    text: 'Au, kwa kuonyesha kwa karibu zaidi mwelekeo wa swali: “Je, huyu si Mwana wa Daudi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: wakashangaa sana
  rationale: Kitenzi hiki kinaonyesha mshangao mkubwa uliowapata watu. ‘Wakashangaa sana’ ni Kiswahili cha kawaida na chenye nguvu bila kuleta maana isiyokusudiwa ya kupoteza akili.
- source_word: πάντες οἱ ὄχλοι
  choice: umati wote
  rationale: Ingawa Kigiriki kina wingi wa ‘makutano,’ katika Kiswahili ‘umati wote’ ni ya asili zaidi na bado huonyesha kwamba watu wote waliokuwapo walishangaa.
- source_word: ἔλεγον
  choice: na kusema
  rationale: Kauli ya wakati usiotimilika inaweza kudokeza kusema kulikoendelea au kurudiwa. Katika simulizi hili, ‘na kusema’ hutambulisha kwa kawaida itikio lao la pamoja bila kulazimisha wazo la kurudia-rudia.
- source_word: Μήτι
  choice: Je, huyu yawezekana ndiye
  rationale: Μήτι kwa kawaida huanzisha swali linalotarajia jibu hasi au linaloonyesha kusita. Muundo huu wa Kiswahili unahifadhi mshangao na uwezekano unaochunguzwa bila kuufanya kuwa ukanushaji wa moja kwa moja.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Mwana wa Daudi
  rationale: Hifadhi ya usemi wa moja kwa moja inadumisha cheo chenye maana ya Kimasihi na uhusiano wake na ukoo wa kifalme wa Daudi.
theological_decisions:
- issue: Maana ya Kimasihi ya ‘Mwana wa Daudi’
  choice: Kuhifadhi cheo ‘Mwana wa Daudi’ katika matini kuu.
  alternative: Masihi; mrithi aliyeahidiwa wa Daudi
  rationale: Kigiriki kinatumia cheo chenyewe. Kukihifadhi huepuka kufafanua kimadhehebu au kuondoa uzito wake wa kihistoria na kitheolojia; tanbihi inaeleza maana yake.
- issue: Mwelekeo wa swali linaloanzishwa na Μήτι
  choice: 'Kutumia swali la kusita: ‘Je, huyu yawezekana ndiye...?’'
  alternative: ‘Hakika huyu si Mwana wa Daudi, sivyo?’
  rationale: Kihisishi hicho mara nyingi hutarajia jibu hasi, lakini katika muktadha huu kinaweza kueleza mshangao wenye kusita. Matini kuu inahifadhi uwezekano huo, huku tanbihi ikitoa muundo hasi ulio karibu zaidi na nguvu ya kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Umati wote’ huchaguliwa badala ya ‘makutano yote’ kwa uasilia, na ‘yawezekana’ huhifadhi hali ya kusita katika swali.
