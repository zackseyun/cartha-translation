  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: sw
  text: Mwanzi uliopondeka hatauvunja, wala utambi unaofuka moshi[a] hatauzima, mpaka atakapoileta haki kwenye ushindi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya msingi, “kitani kinachofuka moshi.” Hapa kitani kinarejelea utambi wa taa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka atakapoileta hukumu kwenye ushindi.”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: mwanzi
  rationale: Neno hili humaanisha mwanzi au shina lake; “mwanzi” ni neno la kawaida la Kiswahili na linahifadhi taswira ya kinabii.
- source_word: συντετριμμένον
  choice: uliopondeka
  rationale: Hueleza kitu kilichochubuka au kuharibika kwa kupondwa bila kudokeza kwamba tayari kimevunjika kabisa; hivyo linaendana na tendo linalofuata la kutokuvunja.
- source_word: κατεάξει
  choice: hatauvunja
  rationale: Kitenzi hiki humaanisha kuvunja au kukata kwa kuvunja; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: λίνον
  choice: utambi
  rationale: Ingawa neno la Kigiriki kihalisi ni kitani, hapa linarejelea kitani kilichotumiwa kama utambi wa taa. “Utambi” huwasilisha kitu kinachokusudiwa kwa msomaji wa sasa.
- source_word: τυφόμενον
  choice: unaofuka moshi
  rationale: Kirai hiki kinaeleza utambi wenye mwako hafifu unaotoa moshi na ambao unakaribia kuzimika.
- source_word: σβέσει
  choice: hatauzima
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuuzima mwali au utambi.
- source_word: ἕως ἂν
  choice: mpaka atakapo-
  rationale: Muundo huu unaonyesha hatua ya wakati ujao ambayo tendo linalotajwa litafikia.
- source_word: ἐκβάλῃ εἰς νῖκος τὴν κρίσιν
  choice: atakapoifanya haki ishinde
  rationale: 'Tafsiri hii ya Kiswahili huwasilisha kwa kawaida matokeo ya mwisho ya kirai: haki kuletwa kwenye ushindi, huku ikihifadhi mkazo wa kufanikiwa kwake.'
theological_decisions:
- issue: Maana ya κρίσις katika nukuu kuhusu Mtumishi wa Isaya
  choice: haki
  alternative: hukumu
  rationale: Katika muktadha huu neno linahusu kuanzishwa kwa utaratibu wa haki, si kutolewa kwa hukumu pekee. Hata hivyo, “hukumu” ni maana halali ya neno hilo na imehifadhiwa katika tanbihi.
- issue: Kiwango cha uhalisia katika taswira ya taa
  choice: utambi ... hatauzima
  alternative: kitani ... hatauzima
  rationale: Neno la Kigiriki linataja kitani, lakini katika taswira hii kitani hicho hutumika kama utambi wa taa. “Utambi” hufanya taswira ieleweke mara moja, na maana halisi ya “kitani” imehifadhiwa katika tanbihi.
- issue: Uhusiano wa haki na ushindi katika εἰς νῖκος
  choice: atakapoifanya haki ishinde
  alternative: atakapoifikisha hukumu kwenye ushindi
  rationale: Muundo wa Kiswahili uliochaguliwa ni wa kawaida na unaonyesha wazi kuwa haki itafikia matokeo ya ushindi, bila kuficha uwezekano wa kutafsiri κρίσις kuwa “hukumu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni rahisi kusomeka kwa sauti, huku taswira ya kinabii na mvutano wa maana kati ya “haki” na “hukumu” vikihifadhiwa.
