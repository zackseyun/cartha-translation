source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: sw
  text: Na yeyote atakayesema neno dhidi ya Mwana wa Adamu[a], atasamehewa; lakini yeyote atakayesema dhidi ya Roho Mtakatifu hatasamehewa katika enzi hii[b] wala katika ile inayokuja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “atakayenena neno dhidi ya Mwana wa Adamu.”'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki αἰών hapa linamaanisha “enzi” au “kipindi”; kwa desturi nyingine limetafsiriwa “ulimwengu.”
    reason: lexical_alternative
  - marker: c
    text: 'Au kwa uwazi zaidi: “wala katika enzi itakayokuja.” Kigiriki kinasema kihalisi “wala katika ile inayokuja,” huku neno “enzi” likieleweka kutokana na kishazi kilichotangulia.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: yeyote atakaye... lakini yeyote atakaye
  rationale: Muundo huu huonyesha sharti la jumla lisilomhusu mtu maalumu. “Yeyote atakaye” ni Kiswahili cha kawaida kinachohifadhi maana hiyo wazi.
- source_word: εἴπῃ λόγον
  choice: atasema neno
  rationale: Tafsiri hii inahifadhi kuwapo kwa λόγον (“neno”) na inaendana na uzito wa onyo bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: κατὰ
  choice: dhidi ya
  rationale: Katika muktadha huu κατά pamoja na jenitivi huonyesha maneno ya upinzani yanayoelekezwa kwa mtu; “dhidi ya” ni sahihi na ya kawaida katika vifungu vyote viwili.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo linalotambulika na linalohifadhi muundo wa Kigiriki pamoja na maana zake za Kimasihi na kieskatolojia.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: atasamehewa / hatasamehewa
  rationale: Kiswahili hutumia hali ya kutendwa kwa kawaida kwa kusema mtu atasamehewa. Hii huhifadhi ulinganifu wa vifungu viwili na kuepuka mtendaji ambaye Kigiriki hakumtaji wazi.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida, la sasa na lenye heshima katika Kiswahili sanifu.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: wala katika enzi hii
  rationale: αἰών hapa ni kipindi au enzi, si ulimwengu kama mahali, kwa sababu inalinganishwa na enzi inayokuja.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: wala katika ile inayokuja
  rationale: Kigiriki kina kivumishi kilichotumiwa kama nomino na kinaacha “enzi” ieleweke kutoka kishazi kilichotangulia. “Ile inayokuja” huhifadhi udondoshaji huo kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Tofauti ya nyakati katika αἰών / μέλλων
  choice: wala katika enzi hii wala katika ile inayokuja
  alternative: wala katika enzi hii wala katika enzi itakayokuja; wala katika ulimwengu huu wala katika ule ujao
  rationale: Andiko linatofautisha enzi ya sasa na enzi ya baadaye, wala si ulimwengu mbili kama mahali. Tafsiri inahifadhi mtazamo huo wa kieskatolojia bila kuingiza mfumo fulani wa mafundisho.
- issue: Asili ya kosa lisilosamehewa
  choice: Kuacha onyo kama lilivyo bila kulifafanua zaidi katika matini
  alternative: Kulieleza kuwa tukio maalumu la kihistoria au kuwa kutotubu mpaka mwisho
  rationale: Aya inataja kusema dhidi ya Roho Mtakatifu na matokeo yake, lakini hapa haitoi ufafanuzi kamili wa baadaye wa kitheolojia. Tafsiri haipaswi kuamua jambo ambalo aya yenyewe imel оставia wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Dhidi ya,” “Roho Mtakatifu,” na “enzi” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi usahihi wa matini. Muundo wa sentensi umehifadhi ulinganifu mkali wa onyo la Kigiriki.
