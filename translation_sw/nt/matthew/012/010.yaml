base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: sw
  text: Na tazama, kulikuwa na mtu mwenye mkono uliokuwa umenyauka. Nao wakamwuliza wakisema, “Je, ni halali kuponya siku za Sabato[a]?” ili wapate kumshtaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “siku ya Sabato.” Kigiriki kina wingi, “siku za Sabato,” ambao ni njia ya kawaida ya kurejelea siku za Sabato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Linadumisha nguvu ya kiashirio cha kisimulizi kinachovuta fikira za msomaji kwenye tukio, bila kutumia lugha ya kizamani.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu neno hilo linamtaja mtu mmoja wa kiume; Kiswahili cha kawaida hutumia “mtu” kwa namna ya asili bila kupoteza maana inayotolewa na muktadha.
- source_word: χεῖρα ἔχων ξηράν
  choice: mwenye mkono uliokuwa umenyauka
  rationale: Muundo wa kishirikishi umetafsiriwa kwa Kiswahili cha kawaida. “Umenyauka” hudumisha wazo la kiungo kilichokauka au kudhoofika bila kubainisha kimakosa kwamba hali hiyo ilikuwa kupooza tu.
- source_word: ἐπηρώτησαν αὐτόν
  choice: wakamwuliza
  rationale: Ni tafsiri ya moja kwa moja na ya asili katika mtiririko wa simulizi; nia yao ya uhasama inaelezwa wazi mwishoni mwa aya.
- source_word: λέγοντες
  choice: wakamwuliza, “Je…?”
  rationale: Kishirikishi cha Kigiriki kimeingizwa kwa njia ya asili katika usemi wa moja kwa moja badala ya kurudia “wakamwuliza wakisema,” ambako kungekuwa na uzito usio wa lazima kwa Kiswahili.
- source_word: ἔξεστι
  choice: ni halali
  rationale: Kauli hii inaonyesha swali la kile kinachoruhusiwa kwa mujibu wa sheria ya Sabato, si ruhusa ya kijamii tu.
- source_word: τοῖς σάββασιν
  choice: siku za Sabato
  rationale: Inadumisha wingi wa Kigiriki kwa Kiswahili kinachoeleweka, huku umoja wa kawaida zaidi ukitajwa katika tanbihi.
- source_word: θεραπεύειν
  choice: kuponya
  rationale: Ni kitenzi cha kawaida na kinachofaa kwa tendo la kurejesha afya katika simulizi za uponyaji.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ili wapate kumshtaki
  rationale: “Ili” linaonyesha kusudi, na “kumshtaki” linadumisha maana ya tuhuma yenye mwelekeo wa kisheria.
theological_decisions:
- issue: Usemi wa Sabato katika muktadha wa mabishano kuhusu sheria
  choice: siku za Sabato
  alternative: siku ya Sabato
  rationale: Wingi wa Kigiriki τοῖς σάββασιν umehifadhiwa katika matini kwa uwazi kwa chanzo. Kwa kuwa umoja pia ni usemi wa kawaida wa kurejelea Sabato kwa ujumla, umetolewa katika tanbihi bila kufuta wingi wa matini chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Na tazama” limetumiwa kudumisha msisitizo wa kisimulizi, na “Waliuliza hivyo” linafanya kusudi la swali lisikike kwa uwazi bila kuathiri maana ya Kigiriki.
