  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: sw
  text: Kwa maana kama vile Yona alivyokuwa katika tumbo la kiumbe kikubwa cha baharini[a] kwa siku tatu na usiku tatu[c], ndivyo Mwana wa Adamu atakavyokuwa katika moyo wa nchi[b] kwa siku tatu na usiku tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “samaki mkubwa.” Neno la Kigiriki humaanisha kiumbe kikubwa cha baharini na halibainishi aina fulani ya mnyama.
    reason: lexical_alternative
  - marker: b
    text: “Moyo wa nchi” unaweza kumaanisha maziko, kaburi, vilindi vya nchi, au makao ya wafu; matini kuu imehifadhi sitiari ya Kigiriki.
    reason: alternative_reading
  - marker: c
    text: “Siku tatu na usiku tatu” wakati mwingine hueleweka kama usemi unaohusisha hata sehemu za siku tatu, ingawa wengine huuelewa kwa ukali zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: ‘Kwa maana’ linaonyesha nguvu ya ufafanuzi ya γάρ, na ‘kama vile’ linaanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: Ἰωνᾶς
  choice: Yona
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἐν τῇ κοιλίᾳ
  choice: katika tumbo
  rationale: κοιλία hapa humaanisha tumbo; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: τοῦ κήτους
  choice: la kiumbe mkubwa wa baharini
  rationale: κῆτος humaanisha kiumbe mkubwa wa baharini na si lazima aina mahususi ya samaki. ‘Kiumbe mkubwa wa baharini’ huhifadhi upana huo wa maana kwa lugha inayoeleweka.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: kwa siku tatu na usiku tatu
  rationale: Huhifadhi usemi kamili wa wakati uliorudiwa katika Kigiriki. ‘Kwa’ huleta Kiswahili cha asili kinapoeleza muda.
- source_word: οὕτως
  choice: ndivyo
  rationale: ‘Ndivyo’ hukamilisha muundo wa ulinganisho ‘kama vile ... ndivyo’ kwa Kiswahili cha kawaida.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni istilahi ya kibiblia iliyozoeleka katika Kiswahili kwa jina hili la cheo, na huhifadhi mwangwi wake wa kimaandiko.
- source_word: ἔσται
  choice: atakavyokuwa
  rationale: Hutoa wakati ujao wa εἰμί bila kuongeza dhana ya ‘kubaki’ ambayo haijaelezwa wazi katika kitenzi.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: katika moyo wa nchi
  rationale: Huhifadhi sitiari ya καρδία badala ya kuifafanua moja kwa moja kuwa kaburi, vilindi, au makao ya wafu. ‘Nchi’ hapa ni neno la asili kwa γῆ na huacha upeo wa sitiari wazi.
theological_decisions:
- issue: Maana ya ‘katika moyo wa nchi’
  choice: Sitiari imehifadhiwa bila kubainishwa kuwa maziko, kaburi, vilindi vya nchi, au makao ya wafu.
  alternative: katika kaburi; katika vilindi vya nchi; katika makao ya wafu
  rationale: Kigiriki hakilazimishi ufafanuzi mmoja kati ya hayo. Kutafsiri sitiari moja kwa moja huhifadhi utata na mvutano wa kiteolojia wa andiko.
- issue: Nguvu ya ‘siku tatu na usiku tatu’
  choice: Usemi kamili wa wakati umehifadhiwa katika matini kuu.
  alternative: Usemi wa Kisemiti unaoweza kuhusisha sehemu za siku tatu; kipindi kamili cha saa sabini na mbili
  rationale: Andiko lenyewe linasema ‘siku tatu na usiku tatu.’ Tafsiri haipaswi kuamua mjadala wa kihistoria au wa mpangilio wa nyakati ambao maneno yenyewe hayauamui wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kama vile ... ndivyo’ hutoa ulinganisho kwa mtiririko wa kawaida. Matini inaepuka istilahi finyu ya kizioolojia na pia haifafanui kimadhehebu ‘moyo wa nchi.’
