base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: sw
  text: Ndipo husema, “Nitarudi katika nyumba yangu niliyotoka.” Ikifika, huikuta ikiwa tupu[a], imefagiliwa na iliyopangwa kwa utaratibu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, haikaliwi.
    reason: lexical_alternative
  - marker: b
    text: Au, imepambwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha hatua inayofuata katika simulizi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: λέγει
  choice: husema
  rationale: Wakati uliopo wa Kigiriki unaendeleza usemi kwa uhai; kiima, yaani roho mchafu iliyotajwa katika muktadha, kinaeleweka bila kutajwa tena.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Nitarudi nyumbani kwangu
  rationale: Huhifadhi maana ya kurudi, mwelekeo wa kwenda nyumbani, na dai la roho kwamba nyumba ni yake.
- source_word: ὅθεν ἐξῆλθον
  choice: nilikotoka
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi wazo la kutoka mahali pale bila kuongeza maelezo.
- source_word: ἐλθὸν
  choice: inapofika
  rationale: Kishirikishi cha aoristi kinaonyesha kitendo kinachotangulia kupata; kishazi cha wakati ni cha kawaida na hudumisha mfuatano huo.
- source_word: εὑρίσκει
  choice: huikuta
  rationale: Huwasilisha wakati uliopo wa simulizi na huifanya nyumba iliyodokezwa kuwa yambwa wazi kwa Kiswahili cha kawaida.
- source_word: σχολάζοντα
  choice: ikiwa tupu
  rationale: Neno linaweza kumaanisha kuwa tupu au kutokaliwa. “Tupu” ni fupi, la asili katika taswira ya nyumba, na halibainishi zaidi ya chanzo.
- source_word: σεσαρωμένον
  choice: imefagiliwa
  rationale: Huhifadhi hali iliyotokana na kitendo kilichokamilika cha kufagia.
- source_word: κεκοσμημένον
  choice: kupangwa vizuri
  rationale: κοσμέω hapa inaweza kumaanisha kupanga kwa utaratibu au kupamba. Chaguo hili linasisitiza hali ya utaratibu bila kulazimisha wazo la mapambo.
theological_decisions:
- issue: Maana ya kisitiari ya “nyumba” katika habari ya kurudi kwa roho mchafu
  choice: Kudumisha neno “nyumba” katika matini bila kulifafanua kuwa mtu au maisha yake.
  alternative: “Nitarudi kwa mtu niliyemtoka.”
  rationale: Chanzo kinatumia taswira halisi ya nyumba. Kuidumisha huepuka kufafanua sitiari ndani ya tafsiri na huhifadhi mvutano wa usemi wa Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo,” “nyumbani kwangu,” na “inapofika” ni miundo ya kawaida inayoendeleza simulizi kwa uwazi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
