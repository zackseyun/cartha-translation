  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: sw
  text: Hatabishana wala kupiga kelele[a], wala hakuna mtu atakayeisikia sauti yake barabarani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatagombana wala kupaza sauti, wala hakuna mtu atakayeisikia sauti yake katika barabara pana za umma.”
    reason: Mbadala huu unaonyesha maana nyingine zinazowezekana za ἐρίσει, κραυγάσει, na πλατείαις.
lexical_decisions:
- source_word: ἐρίσει
  choice: hatabishana
  rationale: Kitenzi hiki humaanisha kuingia katika mabishano au ugomvi. “Hatabishana” ni Kiswahili cha kawaida kinachoonyesha tabia isiyo ya ugomvi bila kudokeza kwamba hatasema chochote hadharani.
- source_word: κραυγάσει
  choice: wala kupiga kelele
  rationale: κραυγάζω hueleza kupaza kilio au sauti kwa nguvu. “Kupiga kelele” linaeleweka kwa urahisi na linahifadhi wazo la sauti kubwa ya hadharani.
- source_word: ἀκούσει τις
  choice: wala hakuna mtu atakayeisikia
  rationale: Muundo wa Kigiriki unaendeleza mfululizo wa ukanushaji. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kwamba hakuna yeyote atakayeisikia.
- source_word: ἐν ταῖς πλατείαις
  choice: barabarani
  rationale: πλατεῖαι ni barabara pana au maeneo ya wazi ya umma. “Barabarani” ni tafsiri fupi na ya kawaida inayoonyesha mazingira ya hadharani; maana pana zaidi imewekwa katika tanbihi.
- source_word: φωνὴν αὐτοῦ
  choice: sauti yake
  rationale: φωνή hapa humaanisha sauti ya mtu, na “sauti yake” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: hata… wala… wala hakuna…
  rationale: Mfululizo wa ukanushaji umehifadhiwa kwa sintaksia ya Kiswahili inayosomeka kwa urahisi na kuonyesha nguvu yake ya kujumuisha vipengele vyote vitatu.
theological_decisions:
- issue: Uhusiano na nukuu kuhusu Mtumishi katika Isaya na namna Masihi anavyoelezwa
  choice: Mstari unaonyesha kwamba Masihi si mwenye mabishano wala mwenye kujitangaza kwa makelele hadharani.
  alternative: Maneno yanaweza kutafsiriwa kwa muundo rasmi zaidi kuwa “hatashindana wala kupaza sauti.”
  rationale: Kigiriki kinaeleza upole na kutokuwa na ugomvi kwa Mtumishi, lakini hakifundishi kwamba hatasema kamwe hadharani au kwamba atakuwa mnyamavu kabisa. Tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi mfululizo wa ukanushaji wa Kigiriki bila kuwa mgumu.
