  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: sw
  text: na mataifa yatatumaini katika jina lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa mataifa mengine watatumaini katika jina lake.”
    reason: Neno la Kigiriki ἔθνη linaweza kumaanisha “mataifa” au watu wasio Wayahudi.
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki cha kawaida kinahifadhi uhusiano wa sentensi hii na sehemu iliyotangulia ya nukuu.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: katika jina lake
  rationale: Muundo huu unaendana kwa kawaida na kitenzi cha kutumaini. Pia unahifadhi maana pana ya jina kama linalomwakilisha mtu na mamlaka yake bila kuifafanua kupita kiasi.
- source_word: ἔθνη
  choice: mataifa
  rationale: Neno hili linaweza kumaanisha mataifa kwa ujumla au watu wasio Wayahudi. Katika nukuu hii ya Isaya, “mataifa” huhifadhi upeo mpana wa ahadi bila kufuta maana inayoweza kuwarejelea watu wa mataifa mengine.
- source_word: ἐλπιοῦσιν
  choice: yatatumaini
  rationale: Hii ni kauli ya wakati ujao; “yatatumaini” inaakisi moja kwa moja maana ya kitenzi na kudumisha mwelekeo wa ahadi ya wakati ujao.
theological_decisions:
- issue: Tafsiri ya ἔθνη katika nukuu kuhusu Masihi
  choice: mataifa
  alternative: watu wa mataifa mengine
  rationale: “Mataifa” huhifadhi upeo wa nukuu ya Isaya kwa watu mbalimbali, huku tafsiri mbadala ikionyesha maana inayowezekana ya watu wasio Wayahudi. Utata huo haujaondolewa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “katika jina lake” umechaguliwa kwa uwazi na mwangwi wa lugha ya Biblia; “yatatumaini” hulingana kisarufi na “mataifa.”
