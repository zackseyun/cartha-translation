  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: sw
  text: Ndipo akamwambia yule mtu, “Nyosha mkono wako.” Akaunyosha, nao ukarejeshwa ukiwa mzima kama ule mwingine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukaponywa”; kitenzi cha Kigiriki kinakazia kurejeshwa katika hali inayofaa, huku “ule mwingine” ikimaanisha mkono mwingine wa mtu huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kisimulizi, umbo la Kiswahili la “akamwambia” huendeleza mfuatano wa simulizi kwa uasilia bila kubadili maana.
- source_word: τῷ ἀνθρώπῳ
  choice: yule mtu
  rationale: Muktadha unamtaja mwanamume fulani anayejulikana katika tukio hili; “yule mtu” ni wazi na ya kawaida.
- source_word: Ἔκτεινόν
  choice: Nyosha
  rationale: Ni amri ya moja kwa moja na ndiyo njia ya kawaida ya kueleza kitendo hiki kwa Kiswahili.
- source_word: σου τὴν χεῖρα
  choice: mkono wako
  rationale: χείρ hapa humaanisha mkono, kama inavyothibitishwa na kulinganishwa kwake na mkono mwingine.
- source_word: ἐξέτεινεν
  choice: Akaunyosha
  rationale: Inadumisha marudio ya kitenzi kati ya amri na utekelezaji, huku kiwakilishi “u” kikirejelea mkono kwa uwazi.
- source_word: ἀπεκατεστάθη
  choice: ukarudishwa
  rationale: Kitenzi hiki kinasisitiza kurejeshwa kwa kitu katika hali yake inayofaa, si tu taarifa ya jumla kwamba kiliponywa.
- source_word: ὑγιὴς
  choice: kuwa mzima
  rationale: Hueleza hali ya afya na utimilifu wa mkono kwa lugha ya kawaida ya Kiswahili.
- source_word: ὡς ἡ ἄλλη
  choice: kama ule mwingine
  rationale: Umbo la kike katika Kigiriki linadokeza mkono mwingine; Kiswahili hutumia “ule” kulingana na ngeli ya “mkono” bila kulazimika kurudia nomino.
theological_decisions:
- issue: Namna muujiza wa uponyaji unavyoelezwa
  choice: Mkono ulirudishwa kuwa mzima
  alternative: Mkono uliponywa / ulifanywa mzima
  rationale: “Ukarudishwa” huhifadhi wazo la ἀποκαθίστημι la kurejeshwa katika hali inayofaa, bila kuongeza ufafanuzi wa kiteolojia usiomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “akamwambia” umetumiwa badala ya wakati uliopo wa kisimulizi wa Kigiriki ili kudumisha mtiririko wa kawaida wa simulizi la Kiswahili. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
