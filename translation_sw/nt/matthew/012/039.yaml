  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: sw
  text: Naye akawajibu, akasema, “Kizazi kiovu na cha uzinzi[a] kinatafuta ishara, wala hakitapewa ishara isipokuwa ishara ya Yona nabii[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cha uzinzi” huenda kikaibua pia picha ya kinabii ya kutokuwa mwaminifu kwa agano, pamoja na uzinzi katika maana yake ya kawaida.
    reason: cross_reference
  - marker: b
    text: Au, “ishara ya nabii Yona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: akajibu, akawaambia
  rationale: Muundo huu unahifadhi vipengele vyote viwili vya usemi wa Kigiriki—kujibu na kusema kwao—kwa Kiswahili cha kawaida na cha kisimulizi.
- source_word: Γενεὰ
  choice: Kizazi
  rationale: Neno hili linaonyesha kundi la watu wa wakati mmoja linalotajwa kwa sifa yake ya kimaadili, na linadumisha nguvu ya jina la umoja.
- source_word: πονηρὰ
  choice: kiovu
  rationale: “Kiovu” ni neno la wazi na lenye uzito unaofaa kwa hukumu ya kimaadili katika muktadha huu.
- source_word: μοιχαλὶς
  choice: cha uzinzi
  rationale: Tafsiri hii inadumisha picha kali ya uzinzi badala ya kuifafanua tu kuwa kutokuwa waaminifu; hivyo inaweza kuhusisha uzinzi wa kawaida na pia kutokuwa mwaminifu kwa Mungu katika lugha ya kinabii.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” ni pana kama neno la Kigiriki na hailazimishi maana ya “muujiza” ambayo haikutajwa wazi.
- source_word: ἐπιζητεῖ
  choice: kinatafuta
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida; muktadha wenyewe unaonyesha mtazamo usiofaa wa wanaoitafuta.
- source_word: δοθήσεται
  choice: hakitapewa
  rationale: Hii inawakilisha kwa kawaida kauli tendwa ya wakati ujao na inarejelea “kizazi.”
- source_word: αὐτῇ
  choice: hakitapewa
  rationale: Kiambishi cha ngeli katika kitenzi kinarejelea moja kwa moja “kizazi” bila kulazimika kurudia jina hilo.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika sentensi hii yenye ukanushi, “isipokuwa” linaonyesha kwa uwazi upekee wa ishara inayotajwa.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: ishara ya Yona nabii
  rationale: Tafsiri hii inafuata kwa karibu mpangilio wa Kigiriki huku ikiacha muktadha unaofuata ueleze ishara hiyo ni nini.
theological_decisions:
- issue: Maana ya “cha uzinzi” katika lawama ya Yesu
  choice: Kudumisha picha ya uzinzi katika matini kuu.
  alternative: kisicho mwaminifu
  rationale: Neno la Kigiriki linaweza kuibua lugha ya kinabii kuhusu kutokuwa mwaminifu kwa agano, bila kuondoa kabisa maana yake ya kawaida ya kimaadili. Tafsiri haipaswi kuamua kimya kimya kwamba ni maana moja tu iliyokusudiwa.
- issue: Asili ya “ishara ya Yona nabii”
  choice: Kuacha kirai hicho bila maelezo ya ziada katika matini kuu.
  alternative: ishara inayofanana na yaliyompata Yona
  rationale: Aya hii haitaji wazi ishara hiyo ni nini; muktadha unaofuata ndio unaoifafanua. Kuongeza ufafanuzi hapa kungetanguliza tafsiri fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akajibu, akawaambia” ni cha kisimulizi na cha kawaida; “cha uzinzi” kinadumisha ukali na mvutano wa sitiari ya Kigiriki bila kuufafanua kupita kiasi.
