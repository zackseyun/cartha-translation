  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: sw
  text: Kisha akaletewa mtu aliyepagawa na pepo, aliyekuwa kipofu na asiyeweza kusema[a]. Naye akamponya, hata mtu huyo akaweza kusema na kuona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kiziwi. Neno la Kigiriki linaweza kumaanisha mtu asiyeweza kusikia au asiyeweza kusema; hapa muktadha unapendelea “asiyeweza kusema,” kwa kuwa baada ya kuponywa alisema na kuona.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa matukio kwa lugha ya kawaida na ya sasa.
- source_word: προσηνέχθη αὐτῷ
  choice: akaletewa
  rationale: Huhifadhi hali ya kutendwa na kutotajwa kwa waliomleta, huku ikionyesha wazi kwamba mtu huyo aliletwa kwake.
- source_word: δαιμονιζόμενος
  choice: aliyepagawa na pepo
  rationale: Huhifadhi wazi maelezo ya Kigiriki kuhusu ushawishi wa pepo bila kuyageuza kuwa hali ya kitabibu au maelezo yasiyo mahususi.
- source_word: τυφλὸς
  choice: kipofu
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika Kiswahili Sanifu.
- source_word: κωφός
  choice: asiyeweza kusema
  rationale: Neno hilo linaweza kumaanisha kutosikia au kutoweza kusema, lakini kishazi cha matokeo kinataja kwamba mtu huyo alisema; hivyo muktadha unapendelea kutoweza kusema.
- source_word: ἐθεράπευσεν αὐτόν
  choice: akamponya
  rationale: Hutoa kwa ufupi na kwa kawaida tendo la uponyaji katika simulizi la muujiza.
- source_word: ὥστε
  choice: hata
  rationale: Katika muundo huu, “hata” hutambulisha kwa kawaida matokeo yaliyotokana na uponyaji.
- source_word: λαλεῖν καὶ βλέπειν
  choice: akaweza kusema na kuona
  rationale: Hueleza matokeo ya kurejeshwa kwa uwezo wa kusema na kuona kwa Kiswahili cha kawaida, bila kuongeza kwamba alianza kusema.
theological_decisions:
- issue: Maelezo ya hali inayohusishwa na pepo
  choice: aliyepagawa na pepo
  alternative: aliyeteseka; aliyekuwa na ugonjwa wa akili
  rationale: Chanzo kinahusisha hali ya mtu huyo waziwazi na pepo; tafsiri haipaswi kuondoa dai hilo au kulibadilisha kuwa utambuzi wa kitabibu.
- issue: Maana ya κωφός katika muktadha huu
  choice: asiyeweza kusema
  alternative: kiziwi; kiziwi na bubu
  rationale: Ingawa neno la Kigiriki linaweza kuwa na maana ya kutosikia au kutoweza kusema, matokeo yaliyotajwa ni kwamba mtu huyo alisema na kuona. Tafsiri haiongezi uziwi usiotajwa katika kishazi hicho cha matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “akaletewa” unahifadhi kutotajwa kwa waliomleta. Kauli “asiyeweza kusema” imechaguliwa badala ya “bubu” kwa uwazi na heshima, huku tanbihi ikihifadhi uwezekano halisi wa maana nyingine ya κωφός.
