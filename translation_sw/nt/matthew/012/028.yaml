  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: sw
  text: Lakini ikiwa mimi ninawafukuza pepo kwa Roho wa Mungu[a], basi ufalme wa Mungu umewafikia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho wa Mungu.” Kirai cha Kigiriki kinaweza kuonyesha kuwa tendo linafanywa kwa njia ya Roho au kwa utendaji wa Roho; hapa kimetafsiriwa kwa maana ya njia au utendaji.
    reason: lexical_alternative
  - marker: b
    text: Au, “umewajia” au “umewapata.” Kitenzi cha Kigiriki kinakazia kwamba ufalme wa Mungu umekwisha kufika kwao kupitia matendo ya Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti pamoja na tofauti ndogo inayounganisha hoja hii na maneno yaliyotangulia.
- source_word: ἐν πνεύματι θεοῦ
  choice: kwa Roho wa Mungu
  rationale: Katika muktadha huu, ἐν pamoja na hali ya dative inaweza kuonyesha njia au mtendaji; “kwa” ni Kiswahili cha kawaida kinachoonyesha kwamba Roho wa Mungu ndiye anayemwezesha Yesu.
- source_word: ἐγὼ
  choice: mimi
  rationale: 'Kiwakilishi kilicho wazi katika Kigiriki kimehifadhiwa ili kuonyesha mkazo wa hoja: ni Yesu mwenyewe anayewafukuza pepo.'
- source_word: ἐκβάλλω
  choice: ninawafukuza
  rationale: “Kufukuza” ni usemi wa sasa, wazi na wa kawaida kwa kumtoa pepo kwa nguvu; hali ya wakati wa sasa ya kitenzi imehifadhiwa.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: “Pepo” ni neno la kawaida la Kiswahili kwa viumbe waovu wa kiroho katika muktadha wa kufukuzwa, bila kuongeza kivumishi kisichopo katika Kigiriki.
- source_word: ἄρα
  choice: basi
  rationale: Inaonyesha hitimisho linalotokana na sharti lililotangulia kwa njia ya asili katika Kiswahili.
- source_word: ἔφθασεν
  choice: umewafikia
  rationale: Kitenzi hiki hapa kina maana ya kufika au kumfikia mtu. Kauli timilifu ya Kiswahili inaonyesha kwamba ufalme umefika na kwamba kufika huko kuna umuhimu wa sasa.
- source_word: ἐφ’ ὑμᾶς
  choice: -wafikia
  rationale: Kiambishi cha yambwa -wa- kinawakilisha “ninyi” walio wengi, na “kuwafikia” huhifadhi wazo la ufalme kufika kwao au juu yao bila kulifafanua kupita kiasi.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri iliyo wazi na iliyozoeleka, inayoweza kujumuisha utawala wa kifalme wa Mungu na eneo linalotawaliwa bila kuibana maana katika upande mmoja tu.
theological_decisions:
- issue: Maana ya kufika kwa ufalme wa Mungu kuhusiana na kufukuzwa kwa pepo
  choice: Maneno “umewafikia” yanaonyesha kuwa kufukuzwa kwa pepo kwa Roho ni ushahidi wa kufika halisi kwa ufalme wa Mungu kwa wasikilizaji wa Yesu.
  alternative: Ufalme umekaribia tu lakini bado haujafika, au mstari huu unahusu tu utimilifu wake wa wakati ujao.
  rationale: ἔφθασεν inaonyesha kufika au kufikia. Tafsiri inadumisha uhalisi wa sasa wa kufika huko bila kutoa kauli kuhusu ukamilifu wote wa ufalme katika wakati ujao.
- issue: Rejeo la “Roho wa Mungu”
  choice: Maneno haya yametafsiriwa kama rejeo kwa Roho wa Mungu, mtendaji wa kimungu katika kufukuzwa kwa pepo.
  alternative: Nguvu ya Mungu isiyo ya kibinafsi kwa ujumla.
  rationale: πνεύματι θεοῦ humtaja Roho wa Mungu katika muktadha huu. Herufi kubwa katika “Roho” hufuata matumizi ya kawaida ya Kiswahili inapokuwa jina maalumu, bila kuongeza maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka wazi mkazo wa “mimi,” imetumia “kwa” kwa maana ya njia au mtendaji, na imehifadhi wazo lenye nguvu la ufalme kuwafikia wasikilizaji. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
