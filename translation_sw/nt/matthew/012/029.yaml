id: MAT.12.29
reference: Matthew 12:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: sw
  text: Au mtu anawezaje kuingia katika nyumba ya mtu mwenye nguvu na kunyakua mali zake[a], isipokuwa amfunge kwanza huyo mtu mwenye nguvu? Ndipo atakapoipora nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vyake.” Neno la Kigiriki linaweza kumaanisha kihalisi vyombo, au kwa upana zaidi mali ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huanzisha mfano mwingine wa kufafanua hoja iliyotangulia na kudumisha muunganiko wa sentensi.
- source_word: δύναταί τις
  choice: mtu anawezaje
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unadumisha swali la balagha pamoja na maana ya mtu yeyote kwa ujumla.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: kuingia katika nyumba
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi ya kitendo cha kuingia ndani ya nyumba.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: mtu mwenye nguvu
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino; usemi huu unadumisha picha halisi ya mwanamume mwenye nguvu katika mfano.
- source_word: τὰ σκεύη αὐτοῦ
  choice: mali zake
  rationale: Ingawa σκεύη inaweza kumaanisha vyombo au vifaa, katika mfano wa kuingia na kupora nyumba inahusu kwa upana vitu vinavyomilikiwa.
- source_word: ἁρπάσαι
  choice: kunyakua
  rationale: Huwasilisha tendo la kuchukua kwa nguvu bila kulifanya sawa kabisa na tendo pana zaidi la kupora linalotajwa baadaye.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: isipokuwa amfunge kwanza
  rationale: Huhifadhi sharti pamoja na mpangilio unaoonyeshwa na πρῶτον; ‘amfunge’ inaweza kueleweka kuwa kumzuia kwa kumfunga.
- source_word: καὶ τότε
  choice: Ndipo
  rationale: Huonyesha kwamba uporaji wa nyumba unafuata baada ya mwenye nguvu kufungwa, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: διαρπάσει
  choice: atakapoipora
  rationale: Kitenzi hiki kina nguvu pana kuliko ἁρπάσαι na kinaonyesha kuchukua mali ya nyumba kwa uporaji.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: nyumba yake
  rationale: Hudumisha picha halisi ya nyumba katika mfano bila kuingiza ufafanuzi wa kiistiari ndani ya matini.
theological_decisions:
- issue: Lugha ya kiume katika mfano
  choice: mtu mwenye nguvu
  alternative: mwenye nguvu
  rationale: Kigiriki kinatumia umbo la kiume ndani ya mfano halisi. Tafsiri inadumisha picha hiyo badala ya kuifanya dhahania.
- issue: Upeo wa kiistiari wa ‘nyumba’ na ‘mali’
  choice: Kudumisha mfano halisi wa kuingia nyumba, kumfunga mwenye nguvu na kupora
  alternative: Kutafsiri kwa ufafanuzi kama utawala na vilivyo chini yake
  rationale: Muktadha mpana unahusu mamlaka juu ya nguvu za pepo, lakini mstari wenyewe unatoa mfano. Ufafanuzi kamili wa mfano haujaingizwa katika maneno ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na picha halisi ya uporaji wa nyumba vimedumishwa; msamiati umechaguliwa ili ueleweke kwa wasomaji wa kawaida bila kuingiza ufafanuzi wa kimadhehebu.
