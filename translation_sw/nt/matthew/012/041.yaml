id: MAT.12.41
reference: Matthew 12:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: sw
  text: Wanaume wa Ninawi watainuka katika hukumu pamoja na kizazi hiki na watakihukumu kuwa na hatia, kwa sababu walitubu kwa kuitikia tangazo la Yona[a]. Na tazama, kilicho kikubwa kuliko Yona kiko hapa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walitubu kwa sababu ya tangazo la Yona.”
    reason: lexical_alternative
  - marker: b
    text: Au “aliye mkuu kuliko Yona yuko hapa.” Kigiriki kimetumia usemi wa kati, ambao kihalisi ni “kilicho kikubwa kuliko Yona”; huenda ukasisitiza uhalisi mkuu uliopo katika Yesu, wala si kulinganisha watu wawili tu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Wanaume wa Ninawi
  rationale: Neno ἄνδρες linataja wanaume waziwazi, na Νινευῖται linawatambulisha kuwa watu wa Ninawi. Tafsiri hii ni ya kawaida na inahifadhi jinsia iliyo katika Kigiriki.
- source_word: ἀναστήσονται
  choice: watasimama
  rationale: Katika muktadha wa hukumu, kitenzi hiki kinaweza kumaanisha kuinuka au kusimama mbele ya mahakama. “Watasimama” ni ya asili katika Kiswahili na haiondoi kabisa taswira ya kufufuliwa na kuonekana hukumuni.
- source_word: ἐν τῇ κρίσει
  choice: katika hukumu
  rationale: Kirai hiki kinarejelea tukio la hukumu, nalo limehifadhiwa bila kulifanya moja kwa moja kuwa hukumu ya hatia.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pamoja na kizazi hiki
  rationale: μετά pamoja na hali ya genitivi humaanisha “pamoja na.” Upinzani unaonekana katika kauli inayofuata kuhusu kukihukumu.
- source_word: κατακρινοῦσιν αὐτήν
  choice: kukihukumu kuwa na hatia
  rationale: κατακρίνω ni kuhukumu kwa kutoa hukumu ya hatia. Kiambishi “-ki-” kinarejelea wazi kizazi hiki.
- source_word: μετενόησαν
  choice: walitubu
  rationale: Katika muktadha wa kuitikia ujumbe wa kinabii, μετανοέω humaanisha kutubu, si kubadili mawazo tu.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: waliposikia tangazo la Yona
  rationale: κήρυγμα ni ujumbe uliotangazwa. Muundo huu wa Kiswahili unaonyesha kuwa walitubu kwa kuitikia tangazo hilo; tanbihi inatoa tafsiri ya karibu zaidi ya uhusiano huo.
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: ἰδού huvuta fikira kwa msisitizo. “Tazama” inahifadhi uzito huo wa usemi.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: kilicho kikuu kuliko Yona kiko hapa
  rationale: πλεῖον ni umbo la kati, si la kiume. “Kilicho kikuu” huhifadhi usemi huo usiotaja moja kwa moja mtu pekee, huku ukielekeza kwa uhalisi mkuu uliopo hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri πλεῖον Ἰωνᾶ kama rejeleo la Yesu
  choice: kilicho kikuu kuliko Yona kiko hapa
  alternative: aliye mkuu kuliko Yona yuko hapa
  rationale: Kigiriki kimetumia umbo la kati πλεῖον badala ya umbo linalomtaja mtu wa kiume moja kwa moja. Tafsiri kuu inahifadhi mvutano huo na inaweza kuhusisha Yesu pamoja na huduma na uhalisi unaopatikana ndani yake.
- issue: Jinsia katika ἄνδρες
  choice: wanaume
  alternative: watu
  rationale: Neno la Kigiriki linataja wanaume waziwazi; kwa hiyo halijafanywa kuwa neno la kijumla lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Tangazo” limetumiwa badala ya istilahi nzito zaidi, na “kukihukumu kuwa na hatia” linaweka wazi nguvu ya κατακρίνω.
