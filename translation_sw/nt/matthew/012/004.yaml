  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: sw
  text: jinsi alivyoingia katika nyumba ya Mungu, nao wakala[a] mikate iliyowekwa mbele ya Mungu[b], ambayo haikuwa halali kwake kula, wala kwa wale waliokuwa pamoja naye, isipokuwa kwa makuhani peke yao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati au mapokeo ya maandishi yana “naye akala” badala ya “nao wakala.”
    reason: textual_variant
  - marker: b
    text: Au, “mikate ya onyesho,” istilahi ya kimapokeo kwa mikate iliyowekwa wakfu mbele ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: jinsi
  rationale: Katika muktadha huu neno hilo linaanzisha maelezo ya simulizi kuhusu Daudi; “jinsi” ni ya kawaida na linaunganika vizuri na swali lililoanza katika mstari uliotangulia.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: alivyoingia katika nyumba ya Mungu
  rationale: Huhifadhi tendo la kuingia na usemi halisi “nyumba ya Mungu” bila kuubadili kimuktadha kuwa hema au mahali patakatifu.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: mikate iliyowekwa mbele za Mungu
  rationale: πρόθεσις hapa ni neno la ibada kuhusu mikate iliyowekwa mbele za Mungu. Tafsiri hii inaeleza maana kwa Kiswahili cha sasa bila kutumia istilahi ya kimapokeo isiyoeleweka kwa urahisi.
- source_word: ἔφαγον
  choice: nao wakaila
  rationale: Nakala iliyotolewa ya SBLGNT ina kitenzi cha wingi, hivyo “nao wakaila” humhusisha Daudi pamoja na waliokuwa naye. Kiambishi cha yambwa cha umoja katika “wakaila” kinarejelea mikate kama chakula cha aina moja kwa ujumla.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: ambayo haikuwa halali kwake kuila
  rationale: “Haikuwa halali” huhifadhi uzito wa kisheria na wa kiibada wa ἐξόν kuliko usemi dhaifu wa ruhusa ya kawaida.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: wala kwa wale waliokuwa pamoja naye
  rationale: Ni tafsiri ya karibu na ya kawaida ambayo haitambui watu hao kwa maelezo yasiyosemwa moja kwa moja katika Kigiriki.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: isipokuwa kwa makuhani peke yao
  rationale: “Isipokuwa” huonyesha ubaguzi unaoletwa na εἰ μή, na “peke yao” huhifadhi msisitizo wa μόνοις.
theological_decisions:
- issue: Uzito wa kisheria na kiibada wa ἐξόν
  choice: haikuwa halali
  alternative: hakuruhusiwa
  rationale: Hoja inahusu kizuizi kilichotambuliwa katika utaratibu mtakatifu, si ruhusa ya kawaida tu; “halali” huhifadhi uzito huo bila kuongeza dai la kimadhehebu.
- issue: Mtendaji wa ἔφαγον
  choice: nao wakaila
  alternative: naye akaila
  rationale: Maandishi yaliyotolewa yana kitenzi cha wingi ἔφαγον. Tofauti ya nakala yenye umoja imehifadhiwa katika tanbihi badala ya kusuluhishwa kimya kimya.
- issue: Maana ya kitamaduni ya τῆς προθέσεως
  choice: mikate iliyowekwa mbele za Mungu
  alternative: mikate ya Wonyesho
  rationale: Chaguo kuu linaonyesha kusudi na mahali pa mikate katika ibada kwa lugha inayoeleweka, huku istilahi ya kimapokeo ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umeachwa wazi kwa kuwa mstari huu unaendeleza swali lililoanza katika muktadha uliotangulia. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
