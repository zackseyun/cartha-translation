  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: sw
  text: Na ikiwa mimi ninatoa pepo kwa nguvu za Beelzebuli[a], wana wenu wanawatoa kwa nguvu za nani? Kwa hiyo wao watakuwa waamuzi wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Beelzebul”; tafsiri nyingi za Kiingereza hutumia “Beelzebubu.”'
    reason: Inaonyesha umbo la jina katika matini ya Kigiriki na umbo jingine lililozoeleka katika mapokeo ya tafsiri.
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: kwa nguvu za Beelzebuli
  rationale: Katika muktadha huu ἐν ina maana ya chombo au wakala. Kiswahili cha kawaida huhitaji kirai kama “kwa nguvu za” ili kuonyesha maana hiyo kwa uwazi, huku jina Βεελζεβούλ likitoholewa kuwa “Beelzebuli.”
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ninatoa pepo
  rationale: Kitenzi ἐκβάλλω katika muktadha wa kutoa pepo kina maana ya kuwatoa au kuwafukuza. “Kutoa pepo” ni usemi wa kawaida na unaoeleweka katika Kiswahili, nao unadumisha wazo la kuwaondoa kwa nguvu.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: wana wenu
  rationale: Tafsiri hii inadumisha neno halisi la kindugu υἱοί bila kulifafanua kimya kimya kuwa “wafuasi wenu” au “watu wenu.” Hivyo utata halisi kuhusu iwapo ni wana, wanafunzi, au watu wa kundi lao unabaki.
- source_word: ἐν τίνι
  choice: kwa nguvu za nani
  rationale: Kama ilivyo katika ἐν Βεελζεβούλ, ἐν hapa ina maana ya chombo au wakala. “Kwa nguvu za nani” ni swali la asili katika Kiswahili na linadumisha ulinganifu wa hoja.
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Kirai hiki kinaanzisha hitimisho linalotokana na swali la balagha; “Kwa hiyo” kinaonyesha uhusiano huo kwa ufupi na kwa kawaida.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: wao watakuwa waamuzi wenu
  rationale: Muundo huu unadumisha wakati ujao na nomino κριταί badala ya kuibadili kuwa kitenzi “watawahukumu,” huku ukibaki wa kawaida katika Kiswahili.
theological_decisions:
- issue: Utambulisho na tahajia ya Βεελζεβούλ
  choice: Beelzebuli
  alternative: Beelzebubu
  rationale: Jina linafuata umbo la Kigiriki lililochapishwa katika SBLGNT, Βεελζεβούλ, badala ya kupatanishwa na umbo la mapokeo “Beelzebubu.” Huu ni uamuzi wa umbo la jina, si ufafanuzi wa kimadhehebu.
- issue: Maana ya “wana wenu” katika hoja ya Yesu
  choice: Kudumisha “wana wenu”
  alternative: wafuasi wenu / watu wenu
  rationale: Kigiriki kinatumia wazi neno la kindugu υἱοί. Tafsiri haibainishi zaidi utambulisho wao, hivyo inadumisha mvutano wa hoja kwamba watu wanaohusishwa na wasikilizaji wenyewe pia hutoa pepo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku “wana wenu” na “waamuzi wenu” vikidumisha maneno na mvutano wa matini chanzi.
