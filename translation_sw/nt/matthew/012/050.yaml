  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: sw
  text: Kwa maana yeyote anayefanya mapenzi ya Baba yangu aliye mbinguni, huyo[a] ni ndugu yangu wa kiume, ndugu yangu wa kike, na mama yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hutumia hapa umbo la umoja wa kiume kisarufi kwa maana ya jumla: “mtu huyo.” Kauli hiyo inamhusu mtu yeyote anayefanya mapenzi ya Baba.'
    reason: Kufafanua kwamba umbo la kisarufi la chanzo halipunguzi kauli kwa wanaume pekee, na kwamba “huyo” linahifadhi msisitizo wa αὐτός.
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: yeyote anayefanya
  rationale: Muundo huu wa kiwakilishi cha uhusiano pamoja na ἄν unaonyesha sharti la jumla lililo wazi kwa mtu yeyote; “yeyote anaye…” ni Kiswahili cha kawaida na cha asili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa ufafanuzi na maneno yaliyotangulia katika muktadha.
- source_word: ποιήσῃ
  choice: anayefanya
  rationale: Huhifadhi maana ya kutenda au kufanya mapenzi hayo bila kuibana kuwa “kutii” pekee.
- source_word: τὸ θέλημα
  choice: mapenzi
  rationale: “Mapenzi ya Mungu/Baba” ni usemi wa Kiswahili uliozoeleka kwa nia na kusudi lake, na huhifadhi uzito wa kiteolojia wa neno la Kigiriki.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: ya Baba yangu aliye mbinguni
  rationale: Ni tafsiri ya asili inayohifadhi uhusiano wa “Baba yangu” na maelezo kwamba yuko mbinguni.
- source_word: αὐτός
  choice: huyo
  rationale: 'Kiwakilishi hiki kinamrejelea kwa msisitizo mtu aliyetajwa katika sharti: huyo hasa ndiye wa familia ya Yesu.'
- source_word: ἀδελφὸς
  choice: ndugu yangu wa kiume
  rationale: Kiswahili “ndugu” peke yake hakionyeshi jinsia; kuongeza “wa kiume” huhifadhi tofauti ya wazi kati ya ἀδελφός na ἀδελφή bila kutumia “kaka,” ambalo mara nyingi hudokeza ndugu mkubwa.
- source_word: ἀδελφὴ
  choice: ndugu yangu wa kike
  rationale: Huhifadhi kwa uwazi neno la pekee “dada/ndugu wa kike” katika orodha ya Kigiriki bila kuingiza dhana ya umri inayoweza kuambatana na “dada.”
- source_word: μήτηρ
  choice: mama yangu
  rationale: Ni kisawe cha moja kwa moja, cha asili, na cha umoja.
- source_word: ἐστίν
  choice: ni
  rationale: Huhifadhi kitenzi kishirikishi cha wakati wa sasa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kauli ya jumla yenye umbo la umoja wa kiume katika Kigiriki
  choice: yeyote ... huyo
  alternative: mtu yeyote ... mtu huyo
  rationale: Kigiriki hutumia umoja wa kiume kisarufi kwa maana ya jumla. Katika Kiswahili, “yeyote” na “huyo” humrejelea mtu wa jinsia yoyote kwa kawaida, huku orodha yenyewe ikitaja ndugu wa kiume, ndugu wa kike, na mama. Hivyo tafsiri haipunguzi upeo wa kauli wala kulazimisha jinsia isiyobainishwa na maana ya muundo huo.
- issue: Uhusiano wa kiroho unaoelezwa kwa lugha ya familia
  choice: ni ndugu yangu wa kiume, ndugu yangu wa kike, na mama yangu
  alternative: ni kama ndugu yangu wa kiume, ndugu yangu wa kike, na mama yangu
  rationale: Nakala haisemi “ni kama”; inatumia kishirikishi cha moja kwa moja. Tafsiri inadumisha nguvu na mvutano wa kauli ya Yesu bila kuifanya tashbihi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa maana” linafaa kwa mtindo wa Maandiko bila kuwa la kizamani. “Ndugu wa kiume/wa kike” limetumiwa badala ya “kaka/dada” ili kuepuka kuingiza tofauti ya umri ambayo haipo katika Kigiriki.
