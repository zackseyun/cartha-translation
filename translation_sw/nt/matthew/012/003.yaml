  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: sw
  text: Lakini akawaambia, “Je, hamjasoma alichofanya Daudi alipokuwa na njaa, yeye na wale waliokuwa pamoja naye?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, hamjasoma alichofanya Daudi wakati yeye na wale waliokuwa pamoja naye walipokuwa na njaa?” Kigiriki kinaweza kueleweka kuwa Daudi na wale waliokuwa naye wote walikuwa na njaa, ingawa kitenzi cha umoja kinamtaja Daudi waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini aka-
  rationale: δέ ni kiunganishi chepesi kinachoonyesha jibu lenye utofauti na shtaka lililotangulia. “Lakini” linafaa katika mtiririko huu, na “aka-” linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Muundo huu ni wa kawaida na wa asili kwa λέγω pamoja na αὐτοῖς, bila kuongeza maana zaidi ya kusema kwao.
- source_word: Οὐκ ἀνέγνωτε
  choice: Je, hamjasoma
  rationale: Swali hili la balagha linawakumbusha wasikilizaji jambo walilopaswa kulijua kutokana na Maandiko. Wakati timilifu wa Kiswahili unawasilisha nguvu hiyo kwa kawaida.
- source_word: τί ἐποίησεν
  choice: alichofanya
  rationale: ποιέω hapa humaanisha tu “kufanya”; “alichofanya” ni fupi, wazi, na ya asili.
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: ὅτε ἐπείνασεν
  choice: wakati ... walipokuwa na njaa
  rationale: πεινάω humaanisha kuwa na njaa. Kiswahili “kuwa na njaa” ni cha sasa na cha kawaida; wingi umetumiwa katika maandishi makuu ili kuonyesha usomaji unaowaunganisha Daudi na wale waliokuwa naye, huku tanbihi ikihifadhi ukweli kwamba kitenzi cha Kigiriki kiko katika umoja.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: yeye na wale waliokuwa pamoja naye
  rationale: Kirai hiki kihalisi ni “na wale waliokuwa naye.” Kutaja “yeye na” huunda sentensi kamili na ya asili kwa Kiswahili huku “wale waliokuwa pamoja naye” kikibaki karibu na muundo wa Kigiriki.
theological_decisions:
- issue: Je, kuwa na njaa kunamhusu Daudi peke yake kwa sarufi, au Daudi pamoja na wale waliokuwa naye?
  choice: Maandishi makuu yanaeleza kwamba Daudi na wale waliokuwa naye walikuwa na njaa.
  alternative: “alichofanya Daudi alipokuwa na njaa, pamoja na wale waliokuwa naye”
  rationale: Kitenzi ἐπείνασεν kiko katika umoja na kinamtaja Daudi waziwazi, lakini καὶ οἱ μετ’ αὐτοῦ kinaweza kueleweka kuwaongeza wale waliokuwa naye katika hali hiyo. Usomaji wa pamoja ni wa asili zaidi katika Kiswahili, lakini tanbihi inahifadhi utata halisi wa kisarufi bila kuufanya uamuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Swali la balagha limehifadhiwa, na tanbihi inaonyesha utata wa kisarufi kuhusu wale waliokuwa pamoja na Daudi.
