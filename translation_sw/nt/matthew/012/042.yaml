id: MAT.12.42
reference: Matthew 12:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: sw
  text: Malkia wa Kusini[b] atafufuliwa katika hukumu pamoja na kizazi hiki, naye atakihukumu kuwa na hatia, kwa sababu alikuja kutoka pande za mbali za dunia ili kusikiliza hekima ya Sulemani. Na tazama, kitu kikubwa kuliko Sulemani kiko hapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye mkuu kuliko Sulemani yuko hapa.” Kigiriki kinatumia umbo la jinsia ya kati (“kitu kikubwa”), ambalo huenda likasisitiza ukuu unaopita ule wa Sulemani, uliopo katika Yesu na huduma yake.
    reason: alternative_reading
  - marker: b
    text: “Malkia wa Kusini” anamrejelea malkia wa Sheba (1 Wafalme 10:1–13; 2 Mambo ya Nyakati 9:1–12), ingawa maandishi ya Kigiriki hayataji Sheba waziwazi.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Malkia wa Kusini
  rationale: Hufuata muundo wa Kigiriki wa ‘malkia wa Kusini’ bila kuongeza jina la Sheba, ambalo linatokana na muktadha wa Agano la Kale lakini halitajwi wazi hapa.
- source_word: ἐγερθήσεται
  choice: atafufuliwa
  rationale: Kauli ya kutendwa ya wakati ujao huhifadhi wazo la kuinuliwa kutoka kwa wafu katika mazingira ya hukumu, badala ya kuifanya iwe tu kusimama mahakamani.
- source_word: ἐν τῇ κρίσει
  choice: wakati wa hukumu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha hukumu maalumu inayotarajiwa bila kupunguza uzito wake wa nyakati za mwisho.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pamoja na kizazi hiki
  rationale: Huhifadhi maana ya kawaida ya μετά pamoja na uhusiano wake wa kijinsia; upinzani unaonyeshwa na kitendo kinachofuata cha kukihukumu.
- source_word: κατακρινεῖ αὐτήν
  choice: atakihukumu kuwa na hatia
  rationale: Hutoa wazi maana ya κατακρίνω ya kutoa hukumu ya hatia, huku kiwakilishi ‘-ki-’ kikirejelea ‘kizazi hiki.’
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: kutoka miisho ya dunia
  rationale: Huhifadhi nahau ya umbali mkubwa sana kwa lugha inayoeleweka na yenye hadhi.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ili kusikiliza hekima ya Sulemani
  rationale: ‘Ili’ huonyesha kusudi la kuja kwake, na ‘kusikiliza’ ni ya asili zaidi katika Kiswahili kwa kupokea mafundisho yenye hekima.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni alama ya usemi inayovuta fikira kwa msisitizo na inadumisha uzito wa kauli.
- source_word: πλεῖον Σολομῶνος
  choice: kitu kikuu kuliko Sulemani
  rationale: Huhifadhi umbo lisilo la kiume la πλεῖον na hivyo kutoamua kimya kimya kwamba usemi huo lazima utafsiriwe ‘aliye mkuu,’ ingawa katika muktadha unamhusu Yesu na huduma yake.
- source_word: ὧδε
  choice: kiko hapa
  rationale: Hutoa kwa kawaida maana ya mahali ya ὧδε na kupatanisha kisarufi na ‘kitu.’
theological_decisions:
- issue: Jinsi ya kutafsiri πλεῖον ya jinsia ya kati inapolinganishwa na Sulemani
  choice: kitu kikuu kuliko Sulemani
  alternative: aliye mkuu kuliko Sulemani
  rationale: Chaguo kuu huhifadhi mvutano wa kisarufi wa Kigiriki, unaoweza kuelekeza kwa ukuu uliopo katika Yesu na huduma yake, bila kukataa kwamba Yesu mwenyewe ndiye anayelengwa. Chaguo la ‘aliye mkuu’ ni la asili na la kweli kimuktadha, lakini linafafanua zaidi kuliko umbo la Kigiriki.
- issue: Maana ya ἐγερθήσεται katika mazingira ya hukumu
  choice: atafufuliwa
  alternative: atasimama
  rationale: ‘Atafufuliwa’ huhifadhi sauti ya kutendwa na dokezo la ufufuo katika hukumu ya mwisho. ‘Atasimama’ lingeonyesha vizuri picha ya shahidi au mshutaki mahakamani, lakini lingeweza kuficha dokezo la ufufuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ hudumisha msisitizo wa kifasihi bila kuwa cha kizamani kupita kiasi. Muundo ‘atakihukumu kuwa na hatia’ unaeleweka kwa wasomaji wa kawaida na ni sahihi zaidi kuliko ‘atakilaani,’ ambalo lingeweza kupanua maana.
