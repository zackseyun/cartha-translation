  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: malkia atafufuliwa katika hukumu pamoja na kizazi hiki, atakihukumu kuwa na hatia, na alikuja kwa kusudi la kusikia hekima ya Sulemani. Hata hivyo, «kitu kikuu» si sawa kabisa na πλεῖον katika mlinganisho huu; «kitu kikubwa kuliko» huwasilisha kwa usahihi zaidi maana ya ‘something greater than’ bila kubadilisha umbo la kati kuwa la mtu.'
