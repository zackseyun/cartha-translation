revisions:
- from: Malkia wa Kusini[a] atafufuliwa wakati wa hukumu pamoja na kizazi hiki, naye atakihukumu kuwa na hatia, kwa sababu alikuja kutoka miisho ya dunia ili kusikiliza hekima ya Sulemani. Na tazama, kitu kikuu kuliko Sulemani kiko hapa.[b]
  to: Malkia wa Kusini[b] atafufuliwa katika hukumu pamoja na kizazi hiki, naye atakihukumu kuwa na hatia, kwa sababu alikuja kutoka pande za mbali za dunia ili kusikiliza hekima ya Sulemani. Na tazama, kitu kikubwa kuliko Sulemani kiko hapa.[a]
  rationale: Marekebisho yanaboresha usahihi wa kilinganishi πλεῖον kwa «kitu kikubwa kuliko», yanatumia nahau ya Kiswahili iliyo laini kwa umbali mkubwa, na yanaweka kila tanbihi kwenye sehemu yake inayohusika sambamba na mkondo wa ukaguzi wa Kiingereza. Maana, utata wa umbo la kati, na rejesta ya kifasihi vimehifadhiwa.
