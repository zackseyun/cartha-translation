  terminology: «Malkia wa Kusini», «hukumu», «kizazi hiki», «Sulemani», na «tazama» zinafaa. «Atafufuliwa» ni chaguo salama kwa ἐγερθήσεται katika muktadha wa hukumu, likihifadhi dokezo la ufufuo bila kulazimisha uchambuzi wa kiteolojia.
