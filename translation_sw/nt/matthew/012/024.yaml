  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: sw
  text: Lakini Mafarisayo waliposikia hayo, wakasema, “Huyu hatoi pepo isipokuwa kwa Beelzebuli[a], mkuu wa pepo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebuli: kwa desturi pia huitwa “Beelzebubu.”'
    reason: Inaonyesha umbo la jadi la jina bila kulibadilisha umbo la Βεελζεβούλ lililo katika matini ya Kigiriki.
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya mwitikio mzuri uliotangulia na shtaka la Mafarisayo.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kauli ya wakati inawasilisha kwa Kiswahili cha kawaida tendo lililotangulia kusema kwao; “hayo” linarejelea jambo lililotokea katika muktadha.
- source_word: Οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki kinadumisha sauti ya dharau ya Mafarisayo bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: hatoi pepo
  rationale: Ni usemi mfupi na unaoeleweka wa kufukuza pepo, huku wingi wa jumla wa δαιμόνια ukidumishwa kwa nomino “pepo.”
- source_word: εἰ μὴ
  choice: ila
  rationale: Hapa kinaonyesha njia pekee ambayo Mafarisayo walidai kuwa ndiyo iliyotumiwa.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: kwa nguvu za Beelzebuli
  rationale: ἐν hapa ina maana ya njia au nguvu inayotumika; kauli hii inaeleza shtaka hilo kwa Kiswahili cha asili bila kulifanya Beelzebuli kuwa mtendaji wa moja kwa moja.
- source_word: Βεελζεβοὺλ
  choice: Beelzebuli
  rationale: Jina limetoholewa kutoka umbo la Kigiriki Βεελζεβούλ na kupewa irabu ya mwisho ili litamkike kwa urahisi katika Kiswahili.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: mkuu wa pepo
  rationale: “Mkuu” huwasilisha mamlaka au cheo cha ἄρχων kwa lugha ya kawaida na yenye hadhi.
theological_decisions:
- issue: Sauti ya kiwakilishi Οὗτος
  choice: Huyu
  alternative: Yeye
  rationale: “Huyu” hudumisha namna ya kumtaja Yesu kwa dharau katika shtaka hili, ilhali “yeye” ingepunguza nguvu hiyo.
- issue: Namna ya jina Βεελζεβούλ
  choice: Beelzebuli
  alternative: Beelzebubu
  rationale: Matini kuu inafuata umbo la jina katika SBLGNT; umbo la jadi linawekwa katika tanbihi ili lisichukue nafasi ya ushahidi wa chanzo.
- issue: Maana ya ἐν katika shtaka
  choice: kwa nguvu za Beelzebuli
  alternative: kwa Beelzebuli
  rationale: Chaguo hili linaonyesha maana ya njia au nguvu bila kuamua zaidi ya matini kuhusu namna hasa ya uhusiano unaodaiwa kati ya Yesu na Beelzebuli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka shtaka kwa lugha rahisi, imedumisha sauti ya dharau katika “Huyu,” na haijaongeza uamuzi wa kimadhehebu.
