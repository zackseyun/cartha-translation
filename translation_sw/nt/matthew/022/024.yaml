base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: sw
  text: wakisema, “Mwalimu, Mose alisema, ‘Mwanamume akifa bila watoto, ndugu yake atamwoa[a] mjane wa ndugu yake na kumwinulia ndugu yake uzao.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa usemi wa kirasmi zaidi: “ndugu yake atatimiza wajibu wa ndugu wa mume kwa mjane.” Kitenzi cha Kigiriki kinarejelea hasa ndoa ya ndugu wa marehemu na mjane wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni namna ya moja kwa moja na ya kawaida ya kumwita Yesu kama mfundishaji, bila maana nyingine zinazoweza kuambatana na ‘Bwana’.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Mtu akifa
  rationale: ‘Mtu’ ni ya asili katika Kiswahili; muktadha wa sheria, pamoja na kutajwa kwa ndugu na mke wake, unaonyesha wazi kuwa anayezungumziwa ni mwanamume.
- source_word: μὴ ἔχων τέκνα
  choice: bila kuwa na watoto
  rationale: Huhifadhi maana pana ya τέκνα kuwa watoto, si wana pekee, na huakisi hali ya kutokuwa na watoto.
- source_word: ἐπιγαμβρεύσει
  choice: atamwoa mjane huyo
  rationale: Kitenzi kinahusu ndoa ya kumrithi mjane wa ndugu. ‘Atamwoa’ hutoa maana kuu kwa lugha ya kawaida, huku ‘mjane huyo’ ikifafanua rejeleo la mke wa marehemu; maana maalumu ya wajibu huo imewekwa katika tanbihi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: mjane huyo
  rationale: Baada ya kifo, mke wa mwanamume huyo ni mjane; usemi huu ni wazi na wa asili katika Kiswahili bila kubadili rejeleo.
- source_word: ἀναστήσει σπέρμα
  choice: kumzalia ... uzao
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kusudi la kupata uzao utakaohesabiwa kwa marehemu, huku ukihifadhi dhana ya kifamilia na uzazi ya σπέρμα.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: Katika muundo ‘kumzalia ndugu yake uzao,’ yule ndugu aliyekufa ndiye anayenufaika au anayehesabiwa uzao huo, kulingana na matumizi ya dativu.
theological_decisions:
- issue: Jinsia katika mfano wa kisheria
  choice: Kuhifadhi wazi majukumu ya mwanamume, ndugu yake, na mjane katika muundo wa sentensi
  alternative: Kutumia lugha isiyoonyesha jinsia, kama ‘mtu fulani ... ndugu wa mtu huyo’
  rationale: Sheria inayotajwa inahusu ndoa ya kumrithi mjane na imeundwa kwa majukumu mahususi ya kifamilia. Kiswahili ‘mtu’ hakionyeshi jinsia kisarufi, lakini muktadha wa ‘mjane’ na ‘ndugu yake’ unahifadhi maana ya kisheria bila kuongeza neno lisilohitajika.
- issue: Uzao kuhesabiwa kwa ndugu aliyekufa
  choice: ‘kumzalia ndugu yake uzao’
  alternative: ‘kupata watoto pamoja naye’
  rationale: 'Chaguo lililotumiwa huhifadhi mvutano muhimu wa kisheria na kifamilia: uzao unatokana na ndoa hiyo lakini unainuliwa au kuhesabiwa kwa ajili ya ndugu aliyekufa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Atamwoa mjane huyo’ ni wazi kwa msomaji wa kawaida; tanbihi huhifadhi maana maalumu ya kisheria ya ἐπιγαμβρεύσει. Alama [a] imewekwa baada ya ‘wakisema’ ili kuandamana na safu ya mashauriano, ingawa tanbihi yenyewe inafafanua kitenzi cha ndoa katika nukuu inayofuata.
