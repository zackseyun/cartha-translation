base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: sw
  text: 'Na ya pili inafanana nayo: “Mpende jirani yako kama unavyojipenda mwenyewe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na amri ya pili inafanana nayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δευτέρα
  choice: ya pili
  rationale: Kivumishi hiki cha mpangilio kimetumiwa kama nomino na kwa muktadha kinamaanisha amri ya pili. Kiswahili cha kawaida hutumia “ya pili” bila kulazimika kuongeza nomino.
- source_word: δὲ
  choice: Na
  rationale: Hapa ni kiunganishi hafifu kinachoendeleza maelezo, wala si alama ya upinzani mkali.
- source_word: ὁμοία αὐτῇ
  choice: inafanana nayo
  rationale: Muundo huu unaonyesha kwamba amri ya pili inalingana au inafanana na ile ya kwanza, bila kusema kwamba ni amri ileile.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Ingawa Kigiriki kina kitenzi cha wakati ujao chenye nguvu ya amri katika nukuu hii, amri ya moja kwa moja ni njia ya asili na yenye hadhi ya kuwasilisha maana hiyo katika Kiswahili.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: Huu ni usemi wa kawaida unaomaanisha mtu aliye jirani na mhusika, na “jirani yako” ndio tafsiri iliyo wazi na ya kawaida.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kigiriki kihalisi ni “kama wewe mwenyewe,” lakini Kiswahili cha kawaida huhitaji kurudia wazo la kupenda ili kiwango cha ulinganisho kiwe wazi; “mwenyewe” huhifadhi msisitizo wa kiwakilishi rejelezi.
theological_decisions:
- issue: Uhusiano wa amri ya pili na ya kwanza
  choice: ya pili inafanana nayo
  alternative: amri ya pili ni kama hiyo
  rationale: Tafsiri hii huhifadhi ulinganisho wa Kigiriki kati ya amri hizo mbili bila kuziunganisha kuwa amri moja wala kueleza kwa ziada aina au kiwango cha kufanana kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “Mpende jirani yako kama unavyojipenda mwenyewe” ni wa kawaida na unaeleweka kwa urahisi, huku “inafanana nayo” ikihifadhi rejeo kwa amri ya kwanza.
