  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: sw
  text: Siku hiyo, Masadukayo walimjia[a], wakisema kwamba hakuna ufufuo, wakamuuliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwazi zaidi: “Masadukayo, ambao husema kwamba hakuna ufufuo, walimjia na kumuuliza.”'
    reason: Njia nyingine ya kuonyesha kwamba maneno hayo yanaweza kueleza msimamo unaojulikana wa Masadukayo, si lazima kauli waliyotamka wakati huo.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili na unadumisha rejeo la siku iliyotajwa katika simulizi.
- source_word: προσῆλθον αὐτῷ
  choice: walimjia
  rationale: Kitenzi hiki cha Kiswahili kwa kawaida humaanisha kumkaribia au kumwendea mtu, huku kiambishi -m- kikihifadhi kiwakilishi ‘yeye’ kinachomrejelea Yesu.
- source_word: Σαδδουκαῖοι
  choice: Masadukayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili la Kiyahudi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Inadumisha muundo wa hali ya kushiriki wa Kigiriki na pia huacha wazi kama ni kauli yao wakati huo au maelezo ya msimamo wao unaojulikana.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: kwamba hakuna ufufuo
  rationale: Ni Kiswahili cha asili kinachoeleza moja kwa moja jambo walilodai bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: ‘Ufufuo’ ni istilahi ya kawaida na yenye uzito ufaao kwa ἀνάστασις katika muktadha huu.
- source_word: ἐπηρώτησαν αὐτόν
  choice: wakamuuliza
  rationale: Hutoa kwa ufasaha tendo la kumwuliza Yesu; muktadha unaonyesha kwamba swali lenyewe linafuata katika mstari unaofuata.
theological_decisions:
- issue: Namna ya kueleza msimamo wa Masadukayo kuhusu ufufuo
  choice: wakisema kwamba hakuna ufufuo
  alternative: ambao husema kwamba hakuna ufufuo
  rationale: Muundo mkuu unafuata kwa karibu kishirikishi λέγοντες na hauwasilishi dai lao kama ukweli wa msimulizi. Tanbihi inaonyesha uwezekano wa kulielewa kama maelezo ya imani ya kudumu ya kundi hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka, huku ukidumisha utata wa kishirikishi cha Kigiriki kuhusu kama Masadukayo walikuwa wakitamka dai hilo wakati huo au walitambulishwa kwa imani yao.
