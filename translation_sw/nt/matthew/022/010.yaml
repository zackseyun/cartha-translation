base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those slaves went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: sw
  text: Watumwa hao wakaenda kwenye njia za umma, wakawakusanya wote waliowapata, waovu na wema; na ukumbi wa harusi[a] ukajaa wageni walioketi kula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “harusi”; hapa neno hilo huenda likimaanisha karamu ya harusi au ukumbi wake, kwa kuwa inasemwa kuwa ulijaa watu waliokuwa wakila.'
    reason: lexical_alternative
  - marker: b
    text: Katika desturi ya wakati huo, watu walikula katika karamu rasmi wakiwa wameegama mezani.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linahifadhi hali yao ya kuwa chini ya mamlaka na umiliki wa mfalme, bila kulainishwa kuwa watumishi tu.
- source_word: ὁδοὺς
  choice: barabarani
  rationale: Hurejelea njia za umma ambako watu wangeweza kupatikana; umbo hili ni la kawaida na la asili katika Kiswahili.
- source_word: συνήγαγον
  choice: wakawakusanya
  rationale: Linatoa moja kwa moja wazo la kuwakusanya na kuwaleta pamoja.
- source_word: πάντας οὓς εὗρον
  choice: wote waliowapata
  rationale: Linahifadhi upeo jumuishi wa πάντας pamoja na kishazi cha uhusiano.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: waovu kwa wema
  rationale: Linadumisha tofauti kali ya kimaadili iliyomo katika Kigiriki na kueleza kwamba makundi yote mawili yalikusanywa.
- source_word: γάμος
  choice: ukumbi wa harusi
  rationale: Ingawa γάμος kwa kawaida ni harusi au karamu ya harusi, kitenzi 'ukajaa' pamoja na wale walioketi kula kinaelekeza hapa kwenye mahali pa karamu; tanbihi inahifadhi maana pana ya neno.
- source_word: ἐπλήσθη
  choice: ukajaa
  rationale: Ni njia ya asili ya Kiswahili ya kueleza kwamba mahali hapo pakawa pamejaa.
- source_word: ἀνακειμένων
  choice: wageni waliokuwa wameketi kula
  rationale: Kigiriki hueleza watu waliokuwa wameegama mezani kwa ajili ya mlo; Kiswahili cha kawaida hutumia kuketi kula, huku tanbihi ikieleza desturi ya kale.
theological_decisions:
- issue: Sifa ya kimaadili ya waliokusanywa
  choice: waovu kwa wema
  alternative: wabaya kwa wema
  rationale: ‘Waovu’ linahifadhi uzito wa kimaadili wa πονηρούς bila kuamua maana ya baadaye ya mfano au kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la kawaida; ‘watumwa’ huhifadhi uhalisia wa kijamii wa δοῦλοι, na ‘waovu kwa wema’ huhifadhi mkazo na mvutano wa kimaadili wa maandishi.
