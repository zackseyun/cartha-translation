  source_fidelity: 'Rasimu inafuata kwa karibu maana ya Kigiriki: watumwa wanatoka kwenda njia za umma, wanawakusanya wote waliowapata—waovu na wema—na karamu/ukumbi wa harusi unajaa watu wa mlo. Hata hivyo, “waovu kwa wema” si uunganisho sahihi wa makundi mawili katika Kiswahili; “waovu na wema” huhifadhi τε καί kwa uaminifu. Pia ἀνακειμένων hurejelea hasa wageni walioketi kwa mlo, kwa hiyo “walioketi kula” ni sahihi na ya kawaida, huku tanbihi ikifafanua mkao wa kihistoria.'
