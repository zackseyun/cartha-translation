  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: sw
  text: 'Yesu akawajibu, akawaambia tena kwa mifano[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu akaitikia, akawaambia tena kwa mifano.” Kigiriki hutumia usemi wa kawaida wa kisimulizi unaomaanisha “alijibu,” hata kama hakuna swali la moja kwa moja lililotajwa mara moja kabla yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaendeleza mtiririko wa simulizi kwa kawaida katika Kiswahili bila kuongeza msisitizo usio katika Kigiriki.
- source_word: ἀποκριθεὶς
  choice: akawajibu
  rationale: Kitenzi hiki kwa kawaida humaanisha “kujibu,” hata pale ambapo hakuna swali la moja kwa moja lililotangulia; kiambishi “-wa-” kinaonyesha wale aliowajibu.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Kiswahili, bila kutafsiri kibainishi cha Kigiriki.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” huonyesha kurudiwa kwa tendo na ni sawasawa ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: εἶπεν
  choice: akasema nao
  rationale: “Akasema nao” huonyesha kuwa maneno yalielekezwa kwao na huepuka uradidi usio wa kawaida wa “akasema ... akisema.”
- source_word: ἐν παραβολαῖς
  choice: kwa mifano
  rationale: Kihusishi ἐν hapa kinaonyesha namna au njia ya kusema; “kwa mifano” ni usemi wa asili wa Kiswahili unaohifadhi wingi wa παραβολαῖς.
- source_word: αὐτοῖς
  choice: nao / -wa-
  rationale: Kiwakilishi cha Kigiriki kinamtaja hadhira; katika Kiswahili maana hiyo imewakilishwa kwa “nao” na pia katika “akawajibu.”
- source_word: λέγων
  choice: ':'
  rationale: Kirai hiki kinatanguliza yaliyosemwa. Katika Kiswahili cha kawaida, alama ya nukta mbili hutimiza kazi hiyo kwa ufasaha bila kuongeza neno lenye kurudia “akasema.”
theological_decisions:
- issue: Maana ya kimazoea ya ἀποκριθεὶς wakati hakuna swali la moja kwa moja lililotajwa mara moja kabla yake
  choice: Kuhifadhi “akawajibu”
  alternative: “akaitikia” au kuacha kabisa wazo la kujibu
  rationale: Huu ni mtindo wa kawaida wa usimulizi wa Kigiriki, wala si dai maalumu la kiteolojia. “Akawajibu” huhifadhi neno la chanzo na mwendelezo wa mazungumzo bila kubuni swali lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa “aka-” unafaa mtiririko wa simulizi; “kwa mifano” ni wa asili kuliko tafsiri sisisi ya “ndani ya mifano.”
