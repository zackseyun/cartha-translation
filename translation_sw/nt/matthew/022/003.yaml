  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: sw
  text: Naye akawatuma watumishi[a] wake wawaite wale waliokuwa wamealikwa[b] kwenye karamu ya harusi[c], nao hawakutaka kuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa.” Neno la Kigiriki linaweza kumaanisha watumishi au watumwa; hapa “watumishi” limetumiwa kwa sababu mfano unakazia kazi yao kama wajumbe wa mfalme kuliko hali yao ya utumwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wale waliokuwa wameitwa.” Kigiriki kinarudia mzizi uleule wa kitenzi kilichotafsiriwa “wawaite,” lakini hapa kinarejelea watu waliokuwa wamekwisha alikwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye sherehe ya harusi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Kitenzi hiki kinaeleza moja kwa moja kwamba aliwatuma waende kutekeleza kusudi fulani; ‘akawatuma’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: δούλους
  choice: watumishi
  rationale: Neno la Kigiriki linaweza kumaanisha watumwa au watumishi. Katika mfano huu mkazo uko katika kazi yao kama wajumbe wa mfalme, hivyo ‘watumishi’ linafaa kimuktadha huku mbadala ukibainishwa katika tanbihi.
- source_word: καλέσαι
  choice: wawaite
  rationale: Infinitivu inaonyesha kusudi la kuwatuma. ‘Wawaite’ ni ya asili katika Kiswahili na kwa kiasi fulani huhifadhi uhusiano wa kitenzi na wale waliokuwa tayari wameitwa au wamealikwa.
- source_word: κεκλημένους
  choice: wale waliokuwa wamealikwa
  rationale: Umbo timilifu tendwa linaonyesha watu waliokuwa wamekwisha kupokea mwaliko. ‘Waliokuwa wamealikwa’ huwasilisha maana hiyo wazi katika muktadha wa karamu.
- source_word: εἰς τοὺς γάμους
  choice: kwenye karamu ya harusi
  rationale: Katika muktadha huu wingi γάμοι unarejelea sherehe au karamu ya harusi, si tendo la kufunga ndoa pekee.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: hawakutaka kuja
  rationale: Hii huhifadhi mkazo wa Kigiriki juu ya kutotaka kwao bila kuongeza nguvu ya maana kama ‘walikataa,’ ambayo inaweza kudokeza tamko la kukataa waziwazi.
theological_decisions:
- issue: Maana ya δοῦλος katika mfano
  choice: watumishi
  alternative: watumwa
  rationale: Hadithi inasisitiza wajibu wao kama wajumbe wa mfalme kuliko hali yao ya kisheria au kijamii. ‘Watumishi’ kwa hiyo linafaa, huku uwezekano wa ‘watumwa’ ukihifadhiwa katika tanbihi.
- issue: Uhusiano kati ya καλέσαι na κεκλημένους
  choice: wawaite wale waliokuwa wamealikwa
  alternative: wawaite wale waliokuwa wameitwa
  rationale: Tafsiri hii inafanya hali ya mwaliko wa awali iwe wazi kwa msomaji wa kawaida. Mbadala wa ‘walioitwa’ huhifadhi marudio ya mzizi wa Kigiriki kwa karibu zaidi na umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘hawakutaka kuja’ ni wa kawaida na huhifadhi maana ya hiari iliyomo katika Kigiriki. Alama zote za tanbihi zimewekwa baada ya sentensi kwa mpangilio unaolingana na maelezo yake.
