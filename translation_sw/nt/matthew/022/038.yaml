  text: This is the great and first commandment[a].
translation:
  language: sw
  text: Hii ndiyo amri kuu na ya kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hii ndiyo amri ya kwanza kwa umuhimu.” Kigiriki, kwa tafsiri ya moja kwa moja zaidi, kina sifa mbili: “amri kuu na ya kwanza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Hii
  rationale: Kiwakilishi hiki kinarejelea amri iliyonukuliwa katika mstari wa 37. Katika Kiswahili, “hii” inapatana na nomino “amri” na kudumisha rejeo hilo kwa lugha ya kawaida.
- source_word: ἐστὶν
  choice: ndiyo
  rationale: Muundo “Hii ndiyo” ni njia ya kawaida na yenye mkazo unaofaa ya kueleza kiunganishi hiki katika Kiswahili.
- source_word: μεγάλη
  choice: kuu
  rationale: Katika muktadha huu, neno hilo linaonyesha ukubwa wa umuhimu au hadhi, si ukubwa wa kimwili. “Kuu” hudumisha hali chanya ya kivumishi bila kukifanya kiwe cha kiwango cha juu kuliko vyote.
- source_word: πρώτη
  choice: ya kwanza
  rationale: Huwasilisha moja kwa moja wazo la kuwa ya kwanza kwa mpangilio au cheo, huku ikibaki kivumishi tofauti na “kuu.”
- source_word: ἐντολή
  choice: amri
  rationale: “Amri” ni neno la kawaida, lenye heshima, na linalofaa katika muktadha wa sheria na maagizo ya Maandiko.
theological_decisions:
- issue: Uhusiano wa μεγάλη na πρώτη katika kuieleza amri
  choice: 'Kudumisha vivumishi vyote viwili kwa uratibu: “amri kuu na ya kwanza.”'
  alternative: “amri iliyo ya kwanza kwa umuhimu”
  rationale: Kigiriki kina vivumishi viwili vya hali chanya vinavyoratibiwa na vyote vinaieleza ἐντολή. Kuvitafsiri vyote huepuka kuvifanya kimyakimya kuwa wazo moja la kiwango cha juu na huhifadhi mvutano kati ya ukuu na nafasi ya kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo “Hii ndiyo” ni wa asili, na “kuu na ya kwanza” huhifadhi uratibu wa maneno ya Kigiriki.
