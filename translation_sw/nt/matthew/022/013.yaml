id: MAT.22.13
reference: Matthew 22:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: sw
  text: Ndipo mfalme akawaambia wahudumu[a], “Mfunge miguu na mikono yake, mkamtupe katika giza la nje. Huko kutakuwa na kilio na kusaga meno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.”
    reason: διάκονοι inaweza kumaanisha wahudumu au watumishi katika mazingira haya; ‘wahudumu’ inafaa zaidi kwa wanaohudumia kwenye karamu, huku ‘watumishi’ ikiwa tafsiri halali pia.
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na kuonyesha tukio linalofuata.
- source_word: ὁ βασιλεὺς
  choice: mfalme
  rationale: Huhifadhi wazi taswira ya kifalme katika mfano.
- source_word: τοῖς διακόνοις
  choice: wahudumu
  rationale: Katika mazingira ya karamu, neno hili linamaanisha wanaomhudumia mfalme; ‘wahudumu’ huepuka maana mahsusi ya cheo cha kanisa.
- source_word: Δήσαντες
  choice: Mfungeni
  rationale: Huwasilisha tendo la δέω kama amri inayotangulia amri kuu, kwa namna ya asili katika Kiswahili.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: miguu na mikono
  rationale: Hufuata mpangilio wa Kigiriki, ‘miguu na mikono,’ bila kuubadili kuwa msemo uliozoeleka zaidi.
- source_word: ἐκβάλετε αὐτὸν
  choice: mkamtupe
  rationale: Huonyesha kufukuzwa kwa nguvu na kuunganisha kwa kawaida tendo hili na amri iliyotangulia.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: katika giza la nje
  rationale: Huhifadhi usemi halisi wa Mathayo na taswira yake bila kuufasiri zaidi.
- source_word: ἐκεῖ
  choice: Huko
  rationale: Ni kielezi cha mahali cha asili kinachorejelea giza la nje.
- source_word: ἔσται
  choice: kutakuwa na
  rationale: Ni uwasilishaji wa kawaida wa wakati ujao wa εἰμί katika muundo huu.
- source_word: ὁ κλαυθμὸς
  choice: kilio
  rationale: Huonyesha kulia kwa majonzi bila kuongeza kiwango cha maana kisichotajwa.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Ni usemi wa Kiswahili unaowasilisha taswira ya kusaga au kukwaruza meno kwa uchungu au hasira bila kuamua hisia ipi pekee inayokusudiwa.
theological_decisions:
- issue: Maana ya taswira ya kutengwa katika mfano
  choice: Kuhifadhi taswira halisi ya kutupwa katika ‘giza la nje’ bila kuitambulisha moja kwa moja kuwa jehanamu, hukumu ya mwisho, au aibu ya kijamii tu.
  alternative: Kuitafsiri wazi kuwa adhabu ya jehanamu, au kuipunguza iwe kufukuzwa karamuni tu.
  rationale: Mstari unatumia taswira kali ya hukumu ndani ya mfano; tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia bila kuufafanua kwa namna finyu kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku ukihifadhi mpangilio wa ‘miguu na mikono,’ ukali wa amri, na taswira ya hukumu bila maelezo ya kimadhehebu.
