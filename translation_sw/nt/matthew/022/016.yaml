  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: sw
  text: Nao wakawatuma kwake wanafunzi wao pamoja na Maherode, wakisema, “Mwalimu, tunajua kwamba wewe ni mkweli na kwamba unaifundisha njia ya Mungu kwa kweli. Wala hujali mtu yeyote ni nani, kwa maana huna upendeleo kwa watu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi na maneno ya Kigiriki, “hutazami uso wa watu”; yaani, humhukumu mtu kwa sura au hadhi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: wakawatuma
  rationale: Wakati uliopita wa kisimulizi ni wa kawaida na wa asili katika Kiswahili; unasampaikan tendo la kihistoria ingawa Kigiriki kimetumia wakati uliopo wa kisimulizi.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: wanafunzi wao
  rationale: “Wanafunzi” ni neno la kawaida la Injili kwa wafuasi wanaojifunza chini ya mwalimu.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: pamoja na wafuasi wa Herode
  rationale: Hueleza kwa uwazi kundi linalohusishwa na Herode bila kuunda jina la kundi lisiloeleweka kwa urahisi.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni namna ya kawaida na yenye heshima ya kumwita anayefundisha.
- source_word: ἀληθὴς εἶ
  choice: wewe ni mkweli
  rationale: Katika muktadha huu neno linaeleza tabia ya Yesu ya kusema na kutenda kwa ukweli; “mkweli” ni Kiswahili cha asili kuliko “wa kweli” kwa mtu.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: njia ya Mungu
  rationale: Inahifadhi sitiari ya njia, ambayo inaweza kumaanisha mapenzi, mwenendo, au mafundisho ya Mungu bila kuibana kwa maana moja.
- source_word: ἐν ἀληθείᾳ
  choice: kwa kweli
  rationale: Inahifadhi msisitizo wa kufundisha kwa kupatana na ukweli na pia mwangwi wa ἀληθής uliotangulia.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: hujali mtu yeyote ni nani
  rationale: Huepuka maana potovu kwamba Yesu hawajali watu, na badala yake huonyesha kwamba hadhi au utambulisho wa mtu haumshawishi.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: kwa maana huna upendeleo kwa watu
  rationale: Hutoa maana ya nahau ya Kigiriki kwa Kiswahili cha kawaida; tafsiri ya karibu zaidi ya maneno imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nahau kuhusu kutazama uso wa watu
  choice: huna upendeleo kwa watu
  alternative: hutazami uso wa watu
  rationale: Nahau hiyo inamaanisha kutokupendelea kwa sababu ya hadhi au sura ya nje. Tafsiri ya maana katika matini kuu huepuka kumfanya msomaji aifikirie kama tendo halisi la kutazama uso, huku tanbihi ikihifadhi muundo wa chanzo.
- issue: Maana ya kutomjali mtu yeyote
  choice: hujali mtu yeyote ni nani
  alternative: humjali mtu yeyote
  rationale: Usemi huo katika muktadha unahusu kutoshawishiwa na cheo au maoni ya watu, si ukosefu wa huruma kwao. Nyongeza ya “ni nani” huwasilisha nguvu ya muktadha bila kuingiza wazo la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi huhifadhi marudio ya dhana ya ukweli na sitiari ya “njia ya Mungu,” lakini nahau mbili za Kigiriki zimetolewa kwa Kiswahili kinachoeleweka bila kupotosha maana.
