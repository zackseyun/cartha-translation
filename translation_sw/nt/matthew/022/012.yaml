  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: sw
  text: Akamwambia, “Rafiki, uliingiaje humu bila vazi la harusi?” Lakini yule mtu akakosa la kusema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akanyamazishwa.” Kihalisi, kitenzi cha Kigiriki kinaweza kumaanisha “alifungwa mdomo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Rafiki
  rationale: Ni mwito wa moja kwa moja wenye adabu lakini pia unaoweka umbali katika muktadha huu. “Rafiki” ni Kiswahili cha kawaida na huhifadhi ukarimu wa nje pamoja na karipio linalodokezwa.
- source_word: πῶς
  choice: uliingiaje
  rationale: Kiambishi “-je” kinauliza jinsi au namna alivyoingia, bila kubadili swali liwe la sababu (“kwa nini”).
- source_word: εἰσῆλθες ὧδε
  choice: uliingiaje humu
  rationale: Wakati uliopita unaonyesha tendo lililokamilika la kuingia, na “humu” hurejelea kwa kawaida mahali walipo ndani.
- source_word: μὴ ἔχων
  choice: bila
  rationale: “Bila” ni njia ya kawaida na fupi ya kueleza hali ya kutokuwa na vazi hilo.
- source_word: ἔνδυμα γάμου
  choice: vazi la arusi
  rationale: Huhifadhi umoja wa ἔνδυμα na uhusiano wake na arusi bila kubainisha isivyohitajika aina hususa ya vazi.
- source_word: ἐφιμώθη
  choice: akakosa la kusema
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba mtu huyo hakuweza kutoa jibu. Maana halisi zaidi ya kutendwa ya kitenzi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Sauti ya mwenyeji anapomwita mgeni asiyevaa vazi linalofaa
  choice: “Rafiki,” mwito wenye adabu lakini unaokaripia kwa kudokeza
  alternative: “Mwenzangu,” ambalo lingeweza kusisitiza zaidi umbali
  rationale: “Rafiki” huhifadhi mvutano wa simulizi bila kuongeza uhasama wala ukaribu ambao neno la Kigiriki halilazimishi.
- issue: Maana ya ἐφιμώθη
  choice: Matokeo yameelezwa kama “akakosa la kusema”
  alternative: “akanyamazishwa” au, kihalisi zaidi, “alifungwa mdomo”
  rationale: Muktadha unaonyesha kwamba hakuwa na jibu. Tafsiri kuu ni ya kawaida na inayoeleweka, huku tanbihi ikihifadhi umbo la kutendwa na picha kali ya kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vazi la arusi” ni wazi bila kubainisha aina ya vazi, na “akakosa la kusema” ni usemi wa kawaida unaoonyesha kwamba mtu huyo hakuwa na jibu.
