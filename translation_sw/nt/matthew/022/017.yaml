base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: sw
  text: Basi, tuambieni, wewe unaonaje? Je, ni halali kumpa Kaisari kodi ya kichwa, au la?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: unaonaje?
  rationale: Ni usemi wa kawaida wa Kiswahili unaouliza maoni ya mhusika, huku ukihifadhi maana ya ‘wewe unaonaje?’
- source_word: ἔξεστιν
  choice: ni halali
  rationale: Huonyesha swali kuhusu kile kinachoruhusiwa au kuwa sawa chini ya sheria, bila kuamua mapema kama sheria inayokusudiwa ni ya kidini au ya kiraia.
- source_word: δοῦναι
  choice: kumpa
  rationale: Hutafsiri kitenzi halisi ‘kutoa/kumpa’ badala ya kukibadili moja kwa moja kuwa ‘kulipa,’ na hivyo kufuata msisitizo wa matini chanzi.
- source_word: κῆνσον
  choice: kodi ya kichwa
  rationale: Ni kodi iliyotozwa mtu mmoja mmoja; ‘kodi ya kichwa’ ni fasili fupi na inayoeleweka inayotofautisha kodi hii na kodi kwa ujumla.
- source_word: Καίσαρι
  choice: Kaisari
  rationale: Hili ndilo umbo la kawaida la jina/cheo Caesar katika Biblia ya Kiswahili.
theological_decisions:
- issue: Chanzo cha uhalali kinachoulizwa
  choice: ‘ni halali’ bila kutaja sheria ya Mungu au ya serikali
  alternative: ‘inaruhusiwa kwa mujibu wa sheria’
  rationale: Matini ya Kigiriki haibainishi wazi ni mfumo gani wa sheria unaorejelewa; tafsiri inahifadhi mvutano huo.
- issue: Kutoa dhidi ya kulipa kodi
  choice: ‘kumpa Kaisari’
  alternative: ‘kumlipia Kaisari’ au ‘kulipa kwa Kaisari’
  rationale: ‘Kumpa’ hudumisha δοῦναι na swali lenye uzito kuhusu kile anachodaiwa Kaisari, bila kulifanya kuwa shughuli ya kawaida tu ya malipo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa mazungumzo ya moja kwa moja na unaeleweka kwa wasomaji wa kawaida.
