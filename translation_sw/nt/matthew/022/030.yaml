id: MAT.22.30
reference: Matthew 22:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: sw
  text: Kwa maana katika ufufuo[a] watu hawaoi wala hawaolewi, bali wako kama malaika wa Mungu mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa ufufuo.”
    reason: Kihusishi ἐν kinaweza kueleweka kuwa kinarejelea hali ya ufufuo au wakati ambapo ufufuo unatokea.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: katika ufufuo
  rationale: Huhifadhi muundo wa kihusishi wa Kigiriki na inaweza kuelekeza ama kwenye wakati wa ufufuo ama hali ya maisha baada ya kufufuliwa, bila kulazimisha maana moja.
- source_word: γαμοῦσιν
  choice: hawaoi
  rationale: Kitenzi hiki kinaeleza kuingia katika ndoa; “kuoa” ni usemi wa kawaida wa Kiswahili na hapa huendana na kitenzi tofauti kinachofuata.
- source_word: γαμίζονται
  choice: hawaolewi
  rationale: Kauli ya kutendwa inadumisha tofauti na γαμοῦσιν. Jozi ya kawaida ya Kiswahili “hawaoi wala hawaolewi” huwasilisha pande zote za kuingia katika ndoa bila usemi mzito wa “kutolewa katika ndoa.”
- source_word: ὡς
  choice: kama
  rationale: Inaonyesha ulinganisho, si kwamba waliofufuliwa hugeuka na kuwa malaika.
- source_word: ἄγγελοι θεοῦ
  choice: malaika wa Mungu
  rationale: Inawakilisha wazi jina θεοῦ lililo katika matini na ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Katika muktadha huu οὐρανός ni makao ya mbinguni, si anga linaloonekana; “mbinguni” ni tafsiri ya asili ya Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa sababu au ufafanuzi wa kauli iliyotangulia.
theological_decisions:
- issue: Asili ya ulinganisho na malaika
  choice: Waliofufuliwa wako kama malaika kuhusiana na kutooa wala kuolewa.
  alternative: Ulinganisho unaweza kueleweka kwa upana zaidi kana kwamba waliofufuliwa hugeuka kuwa malaika au wanafanana nao katika kila jambo.
  rationale: ὡς huanzisha ulinganisho, na muktadha wa karibu unaunganisha ulinganisho huo na kutokuwapo kwa ndoa. “Kama” huhifadhi ufanano bila kudai mabadiliko ya asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “hawaoi wala hawaolewi” ni wa kawaida na unaeleweka kwa urahisi; “wako kama” huhifadhi ulinganisho bila kuufanya utambulisho.
