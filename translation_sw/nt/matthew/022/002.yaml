  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: sw
  text: Ufalme wa mbinguni ulifananishwa[a] na mfalme mmoja aliyemwandalia mwanawe karamu ya arusi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaweza kufananishwa.” Kitenzi cha Kigiriki hapa kwa maana halisi ni “ulifananishwa” au “ulifanywa kuwa kama,” ingawa katika utangulizi wa mifano kinaweza kutafsiriwa kwa namna hii nyingine.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki ni “arusi” katika wingi; hapa ni nahau inayomaanisha sherehe za arusi au karamu ya arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: ulifananishwa
  rationale: Ni kitenzi cha wakati uliopita katika kauli ya kutendwa. “Ulifananishwa” huhifadhi umbo hilo bila kuongeza maana ya uwezekano ambayo haijaelezwa wazi.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ufalme wa mbinguni
  rationale: Hili ndilo tamko la kawaida la Mathayo; linahifadhi “mbinguni” badala ya kulisawazisha na “Mungu,” na “ufalme” linaweza kuhusisha utawala na eneo linalotawaliwa.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: mfalme mmoja
  rationale: Katika muktadha huu, muundo wa Kigiriki humtambulisha mtu huyo kuwa mfalme. Kiswahili cha kawaida hakihitaji usemi mzito “mtu, mfalme”; “mfalme mmoja” huwasilisha maana kwa ufasaha bila kudokeza mfalme fulani anayejulikana.
- source_word: ὅστις
  choice: aliye-
  rationale: Kiambishi cha uhusiano kinaunganisha kwa kawaida utambulisho wa mfalme na tendo lake bila kutia mkazo usiokuwapo.
- source_word: ἐποίησεν
  choice: alimwandalia
  rationale: Pamoja na γάμους, ποιέω humaanisha kufanya au kuandaa sherehe. “Alimwandalia” ni ya kawaida katika Kiswahili na pia huonyesha kwamba sherehe ilikuwa kwa ajili ya mwanawe.
- source_word: γάμους
  choice: karamu ya arusi
  rationale: Wingi wa Kigiriki ni nahau inayoweza kumaanisha sherehe za arusi au karamu ya arusi. Muktadha unaofuata unahusu wageni na chakula, hivyo “karamu ya arusi” ni wazi na ya asili.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: mwanawe
  rationale: Umbo hili fupi na la kawaida la Kiswahili linaonyesha kwamba mfalme alimwandalia mwana wake karamu hiyo.
theological_decisions:
- issue: Maana ya usemi “ufalme wa mbinguni”
  choice: Kuhifadhi “Ufalme wa mbinguni” kama usemi maalumu wa Mathayo.
  alternative: Ufalme wa Mungu; utawala wa mbinguni
  rationale: Tafsiri haibadilishi usemi wa Mathayo kwa ufafanuzi wa kitheolojia, wala hailazimishi kuchagua kati ya maana za eneo la kifalme na utawala.
- issue: Nguvu ya kitenzi cha kufananisha
  choice: Kutumia kauli ya kutendwa “ulifananishwa.”
  alternative: Unaweza kufananishwa; unafanana na
  rationale: Kauli ya kutendwa na wakati uliopita huhifadhiwa, huku tanbihi ikionyesha namna nyingine ya kawaida ya kueleza fomula ya mfano bila kuifanya ndiyo tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya lugha ya Maandiko. “Mfalme mmoja” na “alimwandalia mwanawe” ni rahisi kueleweka kwa wasomaji wa leo; tanbihi zinahifadhi tofauti halisi za kileksika katika Kigiriki.
