  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: sw
  text: Kulikuwa na ndugu saba miongoni mwetu. Wa kwanza alioa, akafa bila kuwa na uzao[a], akamwachia ndugu yake mke wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “bila kuwa na mbegu.” Hapa “mbegu” inamaanisha uzao au wazao.
    reason: lexical_alternative
  - marker: b
    text: Hii inarejelea desturi ambayo ndugu wa mwanamume aliyekufa alitarajiwa kumwoa mjane wake ili kumzalia marehemu uzao; tazama Kumbukumbu la Torati 25:5.
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: miongoni mwetu
  rationale: Kirai hiki kinaonyesha kuwapo au kuhusiana na kundi la wasemaji. “Miongoni mwetu” ni Kiswahili cha kawaida na hakiongezi kiashiria cha wakati kisichokuwamo katika Kigiriki.
- source_word: ἑπτὰ ἀδελφοί
  choice: ndugu saba
  rationale: Katika kisa hiki cha ndoa ya kurithi mjane, ἀδελφοί inamaanisha ndugu wa kiume wa familia moja; muktadha unaweka maana hiyo wazi.
- source_word: ὁ πρῶτος
  choice: wa kwanza
  rationale: πρῶτος inaonyesha mpangilio katika kundi, si lazima kwamba alikuwa mkubwa kuliko wote.
- source_word: γήμας
  choice: alioa
  rationale: Kitenzi hiki kinamhusu mwanamume aliyeingia katika ndoa. Muundo wa Kiswahili unaonyesha kwamba ndoa ilitangulia kifo.
- source_word: ἐτελεύτησεν
  choice: akafa
  rationale: Tafsiri hii ni ya moja kwa moja na wazi kwa maana ya kufikia mwisho wa maisha.
- source_word: μὴ ἔχων σπέρμα
  choice: bila kuwa na uzao
  rationale: Ingawa σπέρμα kihalisi ni “mbegu,” hapa inamaanisha watoto au wazao katika muktadha wa kifamilia na kisheria. “Uzao” huhifadhi upana huo kuliko “watoto.”
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: akamwachia ... mke wake
  rationale: ἀφίημι hapa ni kumwacha mtu baada ya kufa, si kumtaliki au kumtelekeza. “Akamwachia” pia huunganisha kiasili yule aliyebaki na mpokeaji anayetajwa kwa hali ya kutoa.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ndugu yake
  rationale: Hali ya kutoa katika Kigiriki inamtaja ndugu aliyebaki kuwa yule ambaye mjane aliachiwa. Tafsiri haiongezi wazi maneno “ili amwoe,” ambayo hayamo katika mstari.
theological_decisions:
- issue: Iwapo desturi ya ndugu kumwoa mjane wa ndugu yake ifafanuliwe moja kwa moja katika andiko kuu
  choice: Kuacha maana hiyo ikiwa imedokezwa, kama ilivyo katika Kigiriki, na kuifafanua katika tanbihi.
  alternative: “akamwachia ndugu yake mke wake ili amwoe”
  rationale: Muktadha wa Kumbukumbu la Torati 25:5 unadokezwa wazi, lakini maneno “ili amwoe” hayajaandikwa katika mstari huu. Kutoyaongeza kunahifadhi ufupi na mvutano wa matini asilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku “uzao” ikihifadhi maana ya kifamilia na kisheria. Mpangilio “akamwachia ndugu yake mke wake” unaweka uhusiano wa dative wazi bila kuongeza tendo la ndoa ambalo Kigiriki hakilitaji moja kwa moja.
