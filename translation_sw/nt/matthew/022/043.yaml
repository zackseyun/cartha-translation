- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: mkuu au mwenye mamlaka
  rationale: “Bwana” huhifadhi maana ya kawaida ya cheo hicho na uhusiano wake muhimu na nukuu ya Zaburi 110 bila kufafanua kimadhehebu utambulisho unaojadiliwa.
