- source_word: καλεῖ αὐτὸν κύριον
  choice: anamwita ‘Bwana’
  rationale: “Bwana” ndilo neno la kawaida kwa κύριος na huhifadhi uzito wa cheo hicho katika hoja inayotegemea Zaburi 110.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi kirai cha kushiriki kinachoingiza nukuu inayofuata kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Anayelengwa na πνεύματι
  choice: Roho Mtakatifu
  alternative: roho ya Daudi mwenyewe au hali yake ya kiroho
