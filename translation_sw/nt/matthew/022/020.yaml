  text: Akawaambia, “Picha hii na maandishi haya ni vya nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: akawauliza
  rationale: Ingawa kitenzi cha Kigiriki ni cha wakati uliopo wa kisimulizi, Kiswahili cha kawaida hutumia wakati uliopita katika masimulizi. ‘Akawauliza’ linaeleza kwa ufasaha kwamba maneno yanayofuata ni swali alilowauliza.
- source_word: αὐτοῖς
  choice: -wa- katika ‘akawauliza’
  rationale: Kiwakilishi cha wingi katika hali ya dative kimewakilishwa kiasili ndani ya kitenzi cha Kiswahili kama watendewa wa swali.
- source_word: Τίνος
  choice: ni vya nani
  rationale: Hili linahifadhi swali la Kigiriki kuhusu umiliki au uhusiano bila kuamua zaidi ya maandishi yenyewe.
- source_word: εἰκών
  choice: sura
  rationale: Katika muktadha wa sarafu, ‘sura’ ni neno la kawaida na linaloeleweka kwa picha au mfano wa mtu uliochapishwa juu yake.
- source_word: αὕτη
  choice: hii
  rationale: Kionyeshi hiki kinarejelea sura iliyo kwenye sarafu inayoshikwa au kuonyeshwa.
- source_word: ἐπιγραφή
  choice: maandishi
  rationale: Neno hili linamaanisha maandishi yaliyoandikwa au kuchongwa kwenye sarafu; ‘maandishi’ ni la sasa, wazi, na la kawaida.
- source_word: καὶ
  choice: na
  rationale: 'Kiunganishi hiki kinaunganisha vipengele viwili vinavyouliziwa: sura na maandishi.'
