base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: sw
  text: Lakini wao hawakujali[a], wakaenda zao; mmoja akaenda kwenye shamba lake, na mwingine akaenda kwenye biashara yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapuuza” au “hawakutilia maanani.” Kitu kinachorejelewa hakitajwi wazi katika Kigiriki, lakini muktadha unaonyesha kuwa ni mwaliko wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: hawakujali
  rationale: Kitenzi hiki kinaonyesha kutokujali au kupuuza. “Hawakujali” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika muktadha, huku kitu walichopuuza kikibaki kudokezwa na muktadha.
- source_word: ἀπῆλθον
  choice: wakaenda zao
  rationale: Usemi huu wa kawaida unaonyesha kwamba waliondoka na kushughulikia mambo yao badala ya kuitikia mwaliko.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: mmoja ... na mwingine
  rationale: Muundo huu unasawazisha mgawanyo wa watu wawili na kuhifadhi utofautishaji wa μέν ... δέ kwa Kiswahili cha asili.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: shambani kwake mwenyewe
  rationale: “Shambani” huwasilisha ἀγρός kama shamba au eneo la kilimo, na “kwake mwenyewe” huhifadhi msisitizo wa ἴδιον juu ya mali au shughuli yake binafsi.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: kwenye biashara yake
  rationale: ἐμπορία humaanisha biashara au shughuli za kibiashara. “Biashara yake” ni tafsiri ya kawaida na ya sasa, inayotofautisha shughuli hii na kazi ya shambani.
theological_decisions:
- issue: Kitu kisichotajwa wazi cha ἀμελήσαντες
  choice: Kudumisha kitu hicho kama kinachodokezwa kwa kutafsiri “hawakujali.”
  alternative: “Wakaupuuza mwaliko” au “hawakuujali mwaliko.”
  rationale: Kigiriki hakitaji kitu cha kitenzi waziwazi, ingawa muktadha unaonyesha mwaliko wa mfalme. Tafsiri kuu inalinda udokezi huo bila kuongeza maelezo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakaenda zao” ni usemi wa kawaida unaofaa simulizi; “shambani kwake mwenyewe” na “kwenye biashara yake” ni wazi kwa wasomaji wa kawaida.
