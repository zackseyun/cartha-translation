id: MAT.22.4
reference: Matthew 22:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other slaves[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: sw
  text: Akawatuma tena watumwa wengine[a], akisema, “Waambieni wale walioalikwa, ‘Tazameni, nimeandaa chakula changu; mafahali wangu na ng’ombe waliononeshwa wamekwisha kuchinjwa, na kila kitu kiko tayari. Njooni kwenye karamu ya arusi[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wengine.” Neno la Kigiriki doulous linaweza kumaanisha watumwa au watumishi kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye arusi.” Wingi wa Kigiriki unaweza kurejelea sherehe zote za arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa tendo na ni ya kawaida katika masimulizi ya Kiswahili.
- source_word: ἀπέστειλεν
  choice: akawatuma
  rationale: Hutoa kwa kawaida maana ya kitendo cha kuwatuma watu, huku kiambishi cha kiima kikidumisha mtiririko wa simulizi.
- source_word: ἄλλους δούλους
  choice: watumwa wengine
  rationale: Katika mazingira ya nyumba ya kifalme, δοῦλοι huonyesha watu walio chini ya mamlaka ya bwana, si wafanyakazi walioajiriwa tu. Tanbihi inataja tafsiri mbadala ya 'watumishi'.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha kwa njia ya asili maneno ya ujumbe unaofuata.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Waambieni wale walioalikwa
  rationale: Muundo huu ni wa kawaida katika Kiswahili, na 'walioalikwa' huhifadhi hali ya watu ambao mwaliko wao tayari umetolewa.
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni mwito wa kuvuta fikira unaoeleweka na wenye hadhi bila kutumia lugha ya kizamani.
- source_word: τὸ ἄριστόν μου
  choice: chakula changu
  rationale: ἄριστον ni mlo uliotayarishwa, mara nyingi wa mapema; 'chakula' huepuka kubana maana kuwa wakati maalumu wa siku au kuichanganya moja kwa moja na karamu yote ya arusi.
- source_word: ἡτοίμακα
  choice: nimeandaa
  rationale: Huhifadhi matokeo ya sasa ya tendo lililokamilika yanayoonyeshwa na wakati timilifu wa Kigiriki.
- source_word: οἱ ταῦροί μου
  choice: mafahali wangu
  rationale: ταῦροι humaanisha ng’ombe dume; 'mafahali' ni sahihi na ya kawaida katika muktadha huu.
- source_word: τὰ σιτιστὰ
  choice: ng’ombe waliononeshwa
  rationale: Kivumishi hiki humaanisha wanyama waliolishwa maalumu ili wanene. 'Ng’ombe' inafaa kwa muktadha wa wanyama wa kuchinjwa bila kubainisha kwamba ni ndama.
- source_word: τεθυμένα
  choice: wamekwisha kuchinjwa
  rationale: Katika muktadha wa mlo, kitenzi kinahusu kuchinja wanyama, si lazima dhabihu ya kidini; 'wamekwisha' huonyesha tendo lililokamilika na matokeo yake yaliyopo.
- source_word: καὶ πάντα ἕτοιμα
  choice: na kila kitu kiko tayari
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi upeo mpana wa πάντα.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Njooni kwenye karamu ya arusi
  rationale: Wingi γάμους unaweza kurejelea sherehe za arusi kwa ujumla; katika muktadha wa mlo ulioandaliwa, 'karamu ya arusi' huwasilisha mwaliko huo kwa uwazi.
theological_decisions:
- issue: Tafsiri ya δοῦλοι katika mfano wa nyumba ya kifalme
  choice: watumwa
  alternative: watumishi
  rationale: Neno 'watumwa' huhifadhi hali ya kijamii ya watu walio chini ya mamlaka ya mfalme katika nyumba yake. Tanbihi huhifadhi uwezekano wa 'watumishi' bila kuingiza fundisho la dhehebu.
- issue: Upeo wa τοὺς γάμους
  choice: karamu ya arusi
  alternative: arusi/sherehe za arusi
  rationale: Wingi wa Kigiriki unaweza kumaanisha sherehe za arusi kwa ujumla. Muktadha wa chakula unafanya 'karamu ya arusi' kuwa ya asili, huku tanbihi ikihifadhi maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kisimulizi na unaosomeka kwa urahisi; maneno ya kijamii na upana wa sherehe yamefafanuliwa kwa tanbihi bila kuondoa utata halisi wa Kigiriki.
