  text: Mwishowe, yule mwanamke akafa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Baadaye, yule mwanamke akafa.” Kigiriki: “Mwishowe/baada ya wote, yule mwanamke akafa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Mwisho
  rationale: Pamoja na πάντων, neno hili linaonyesha hatua ya mwisho katika mfuatano; “Mwisho wa wote” ni usemi wa kawaida unaohifadhi maana ya “hatimaye/baada ya wote.”
- source_word: δὲ
  choice: haijatafsiriwa kwa kiunganishi tofauti
  rationale: Ni kiunganishi hafifu ambacho nguvu yake imeingizwa kwa kawaida katika usemi wa kimfuatano “Mwisho wa wote,” bila kulazimisha “lakini” au “kisha.”
- source_word: πάντων
  choice: wa wote
  rationale: Hukamilisha usemi ὕστερον πάντων na kurejelea watu wote waliotangulia kufa katika simulizi.
- source_word: ἀπέθανεν
  choice: akafa
  rationale: Ni kauli ya moja kwa moja ya tukio la kifo; “akafa” huhifadhi urahisi na uwazi wa kitenzi cha Kigiriki bila kutumia tasfida.
- source_word: ἡ γυνή
  choice: yule mwanamke
  rationale: γυνή inaweza kumaanisha mwanamke au mke. Katika kisa hiki cha mwanamke aliyeolewa kwa ndugu kadhaa kwa mfululizo, “yule mwanamke” hudumisha marejeo bila kumhusianisha na mume mmoja pekee.
