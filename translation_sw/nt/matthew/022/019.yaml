  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: sw
  text: “Nionyesheni sarafu ya kulipia kodi[a].” Nao wakamletea dinari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kodi ya kichwa” au “kodi ya sensa”; κῆνσος ilikuwa kodi ya Dola ya Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Nionyesheni
  rationale: Ni amri kwa watu wengi na huhifadhi maana ya kuonyesha kitu ili kichunguzwe; ni ya asili na wazi katika Kiswahili.
- source_word: νόμισμα
  choice: sarafu
  rationale: Neno hili humaanisha sarafu au fedha inayotumika; “sarafu” linafaa kwa kuwa sentensi inayofuata inataja dinari mahsusi.
- source_word: τοῦ κήνσου
  choice: ya kulipia kodi
  rationale: κῆνσος ni neno la mkopo kutoka Kilatini linalorejelea kodi ya utawala wa Roma. Usemi huu unaonyesha kwamba Yesu aliomba sarafu iliyotumiwa kulipa kodi bila kufafanua kupita kiasi aina yake katika matini kuu.
- source_word: προσήνεγκαν
  choice: wakamletea
  rationale: Katika simulizi, kitenzi hiki kinaeleza kwa kawaida kwamba walileta sarafu kwake; kiambishi “-m-” kinaonyesha kuwa walimletea Yesu.
- source_word: δηνάριον
  choice: dinari
  rationale: Hili ni jina la sarafu mahususi ya kihistoria, hivyo kulitohoa kunahifadhi umahususi wa matini ya Kigiriki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Nao wakamletea” hudumisha mtiririko wa kisimulizi, na “dinari” huhifadhi mazingira ya kihistoria.
