  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: sw
  text: Sheria yote na Manabii hutegemea amri hizi mbili.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Sheria yote na Manabii huning’inia katika amri hizi mbili.”
    reason: lexical_alternative
  - marker: b
    text: “Sheria na Manabii” ni usemi unaorejelea ushuhuda wa Maandiko kwa ujumla.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: amri hizi mbili
  rationale: Kirai hiki kinaonyesha msingi ambao Sheria na Manabii vinategemea. Kiswahili huonyesha uhusiano huo kwa kitenzi “hutegemea” bila kulazimisha tafsiri isiyo ya kawaida ya kihusishi ἐν.
- source_word: ὅλος ὁ νόμος
  choice: Sheria yote
  rationale: “Yote” inadumisha mkazo wa ὅλος juu ya ukamilifu. Herufi kubwa katika “Sheria” inaonyesha kuwa hapa inarejelewa Torati, si sheria kwa ujumla.
- source_word: κρέμαται
  choice: hutegemea
  rationale: Kitenzi cha Kigiriki kwa maana halisi ni “huning’inia,” lakini katika muktadha huu sitiari yake ni kuwa na msingi au kutegemea kitu. “Hutegemea” ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kuifafanua kupita kiasi.
- source_word: καὶ οἱ προφῆται
  choice: na Manabii
  rationale: Hiki ni kipengele cha usemi uliozoeleka “Sheria na Manabii,” unaorejelea ushuhuda wa Maandiko. Herufi kubwa inaonyesha rejeo hilo la kim Maandiko badala ya manabii kama watu peke yao.
theological_decisions:
- issue: Maana ya usemi “Sheria na Manabii”
  choice: Usemi wa Maandiko unaoonyesha kwamba ushuhuda wake wote unategemea amri hizi mbili
  alternative: Rejeo finyu kwa mafundisho ya kimaadili tu yaliyo katika Sheria na maandishi ya manabii
  rationale: Katika Mathayo, “Sheria na Manabii” ni usemi unaotambulika kwa Maandiko yenye mamlaka au ujumbe wake kwa jumla. Tafsiri inadumisha usemi huo badala ya kuubadili kuwa “Maandiko yote,” hivyo haifuti mwangwi wake wa asili wala kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida kwa wasomaji wengi. “Hutegemea” huwasilisha sitiari ya Kigiriki kwa ufasaha, huku tanbihi ikihifadhi picha yake halisi.
