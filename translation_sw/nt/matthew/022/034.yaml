  text: Lakini Mafarisayo waliposikia kwamba alikuwa amewanyamazisha Masadukayo[a], walikusanyika pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “alikuwa amewafunga vinywa Masadukayo.” Kitenzi cha Kigiriki kinaweza kumaanisha kufunga au kuziba kinywa, kama kumtia mnyama kifunga-kinywa; hapa kimetumiwa kwa njia ya mfano kumaanisha kuwanyamazisha katika mjadala.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha mpito wenye utofauti mdogo na tukio lililotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: ἀκούσαντες
  choice: waliposikia
  rationale: Kauli ya kushiriki ya wakati uliopita inaelezwa kwa kishazi cha wakati cha Kiswahili, ikihifadhi uhusiano wa matukio.
- source_word: ἐφίμωσεν
  choice: alikuwa amewanyamazisha
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwafanya washindwe kujibu katika mjadala; wakati timilifu unaonyesha kuwa hilo lilikuwa limetokea kabla ya Mafarisayo kukusanyika.
- source_word: Σαδδουκαίους
  choice: Masadukayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: συνήχθησαν
  choice: walikusanyika
  rationale: Hutoa maana ya kundi kujileta pamoja kwa Kiswahili cha kawaida na wazi.
- source_word: ἐπὶ τὸ αὐτό
  choice: pamoja
  rationale: Nahau hii inaweza kumaanisha kuwa pamoja au mahali pamoja; hapa “pamoja” huhifadhi maana bila kubainisha mahali au kusudi kupita kiasi.
