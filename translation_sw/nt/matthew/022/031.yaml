  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: sw
  text: 'Na kuhusu ufufuo wa wafu, je, hamjasoma yale mliyoambiwa na Mungu[a], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale Mungu aliyowaambia, akisema:”
    reason: Njia nyingine ya kutafsiri muundo wa kutendwa wa Kigiriki kwa muundo wa kutenda ulio wa kawaida zaidi katika Kiswahili.
lexical_decisions:
- source_word: περὶ δὲ
  choice: Lakini kuhusu
  rationale: περί pamoja na nomino katika hali ya genitivi huanzisha mada (‘kuhusu’), na δέ huonyesha mpito wenye tofauti ndogo na hoja iliyotangulia. ‘Lakini kuhusu’ ni ya kawaida katika Kiswahili na haiingizi wazo la wakati.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: ufufuo wa wafu
  rationale: ἀνάστασις hapa ni kufufuliwa kwa wale waliokufa, jambo lililokuwa likibishaniwa na Masadukayo. ‘Ufufuo wa wafu’ ni usemi wa moja kwa moja na unaoeleweka vizuri.
- source_word: οὐκ ἀνέγνωτε
  choice: je, hamjasoma
  rationale: Swali hasi ni changamoto ya balagha kuhusu ujuzi wao wa Maandiko. Wakati timilifu wa Kiswahili (‘hamjasoma’) huonyesha kwamba jambo hilo lililoandikwa bado linawahusu.
- source_word: τὸ ῥηθὲν ὑμῖν
  choice: yale mliyoambiwa
  rationale: Kirai hiki ni cha kutendwa na kinamaanisha ‘yale yaliyosemwa kwenu.’ ‘Mliyoambiwa’ ni Kiswahili cha kawaida kinachohifadhi wazo la ujumbe ulioelekezwa kwa wasikilizaji.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: na Mungu
  rationale: ὑπό pamoja na genitivi humtaja mtendaji katika sentensi ya kutendwa. Katika ‘mliyoambiwa na Mungu,’ Kiswahili hutumia ‘na’ kumtaja Mungu kuwa ndiye aliyesema.
- source_word: λέγοντος
  choice: akisema
  rationale: Kishirikishi hiki kinamrejelea Mungu na kuanzisha maneno ya kunukuliwa katika mstari unaofuata. ‘Akisema’ huhifadhi uhusiano huo bila kuongeza maelezo.
theological_decisions:
- issue: Mungu kuwa msemaji na Maandiko kuwa ujumbe unaowaelekea wasikilizaji
  choice: yale mliyoambiwa na Mungu
  alternative: yale Mungu aliyowaambia
  rationale: Muundo wa kutendwa unafuata kwa karibu Kigiriki na kuhifadhi kwa pamoja kwamba Mungu ndiye msemaji na kwamba maneno hayo yaliwaelekea wasikilizaji wa Yesu, bila kuongeza nadharia yoyote kuhusu uvuvio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa usomaji wa hadhara. ‘Ufufuo wa wafu’ huhifadhi istilahi ya kawaida ya kibiblia, huku ‘je, hamjasoma’ ikiwasilisha kwa uwazi swali la balagha.
