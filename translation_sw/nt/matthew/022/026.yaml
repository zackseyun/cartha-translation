  yaml_path: translation/nt/matthew/022/026.yaml
  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: sw
  text: Vivyo hivyo pia wa pili na wa tatu, hadi wote saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “hadi wale saba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Kielezi hiki kinaunganisha yaliyowapata wanaofuata na yaliyomtokea ndugu wa kwanza katika mstari uliotangulia.
- source_word: καὶ
  choice: pia / na
  rationale: Neno la kwanza limetafsiriwa “pia” baada ya “Vivyo hivyo,” na linalounganisha wa pili na wa tatu limetafsiriwa “na,” ili kudumisha msisitizo na mfuatano kwa Kiswahili cha kawaida.
- source_word: ὁ δεύτερος
  choice: wa pili
  rationale: Namba ya mpangilio yenye kibainishi imetumiwa kama nomino. “Ndugu” inaeleweka kutokana na muktadha lakini haijaongezwa, ili kuhifadhi udondoshaji wa maneno uliopo katika Kigiriki.
- source_word: ὁ τρίτος
  choice: wa tatu
  rationale: Kama ilivyo kwa “wa pili,” namba hii ya mpangilio inasimama badala ya nomino inayofahamika kutokana na muktadha.
- source_word: ἕως τῶν ἑπτά
  choice: hadi wote saba
  rationale: Kirai hiki kinaonyesha kuwa jambo hilo liliendelea na kuwafikia ndugu wote saba. “Wote saba” ni Kiswahili cha asili kinachoeleza wazi kundi zima bila kubadili maana.
