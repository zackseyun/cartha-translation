  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa mstari umehifadhiwa kwa sababu unategemea tendo lililotajwa katika mstari uliotangulia; neno “ndugu” halijaongezwa katika matini kuu.
