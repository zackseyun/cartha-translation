  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: sw
  text: Kwa hiyo, nendeni kwenye njia panda[a], na waalikeni kwenye karamu ya harusi[b] watu wote mtakaowakuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye makutano ya barabara” au “kwenye sehemu za kutokea za barabara”; Kigiriki kinarejelea sehemu ambako barabara hukutana au hutengana.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “kwenye harusi,” usemi unaomaanisha sherehe au karamu ya harusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: nendeni
  rationale: Kitenzi hiki ni amri kwa wingi; “nendeni” ni Kiswahili cha kawaida kinachowasilisha agizo moja kwa moja.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Huonyesha hitimisho au matokeo yanayotokana na maagizo yaliyotangulia; “kwa hiyo” huhifadhi uhusiano huo wa kimantiki.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: kwenye njia panda
  rationale: Kirai hiki hurejelea sehemu ambako barabara hutengana au kukutana. “Njia panda” ni usemi wa kawaida na wazi wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa kuelewa kama matokeo au miisho ya barabara.
- source_word: ὅσους ἐὰν εὕρητε
  choice: wote mtakaowakuta
  rationale: Huhifadhi wazo la upeo usio na kikomo—kuwaalika watu wote watakaopatikana—kwa Kiswahili cha asili.
- source_word: καλέσατε
  choice: waalikeni
  rationale: Katika muktadha wa karamu, καλέω humaanisha kutoa mwaliko, si kuita tu; “waalikeni” huwasilisha tendo hilo kwa usahihi.
- source_word: εἰς τοὺς γάμους
  choice: kwenye karamu ya harusi
  rationale: Wingi wa Kigiriki γάμους hapa ni matumizi ya kawaida yanayorejelea sherehe au karamu ya harusi, wala si harusi nyingi.
