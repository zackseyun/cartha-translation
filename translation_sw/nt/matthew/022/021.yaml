- from: Wakamwambia, “Ni ya Kaisari.” Ndipo akawaambia, “Basi, mpeni[a] Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.”
  to: Wakamwambia, “Ni ya Kaisari.” Ndipo akawaambia, “Basi, mpatieni[a] Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.”
  rationale: The revision clarifies the recipient construction in the plural imperative without adding interpretive content. It maintains the Greek parallelism, the distinction between Caesar and God, and the deliberately broad scope of the saying. The footnote now cleanly records relevant lexical alternatives for Ἀπόδοτε.
