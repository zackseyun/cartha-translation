base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: sw
  text: Wakamwambia, “Ni ya Kaisari.” Ndipo akawaambia, “Basi, mpatieni[a] Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mrudishieni” au “mlipeni.” Kitenzi cha Kigiriki kinaweza kumaanisha kurudisha, kulipa, au kutoa kile kinachostahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Kauli ya sasa ya kihistoria imetafsiriwa kwa wakati uliopita ili simulizi la Kiswahili lisomeke kwa kawaida; kiwakilishi cha yambwa ‘-mw-’ kinawakilisha αὐτῷ.
- source_word: Καίσαρος
  choice: Ni ya Kaisari
  rationale: Hii ni jibu la kifupi linaloonyesha kuwa picha na maandishi yaliyotajwa katika muktadha ni ya Kaisari. ‘Ni ya Kaisari’ ni jibu kamili na la kawaida katika Kiswahili.
- source_word: τότε λέγει αὐτοῖς
  choice: Ndipo akawaambia
  rationale: ‘Ndipo’ huonyesha hatua inayofuata katika mazungumzo, na wakati uliopita unawakilisha kauli nyingine ya sasa ya kihistoria kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Ἀπόδοτε
  choice: mpeni
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa, kurudisha, au kulipa kinachodaiwa. ‘Mpeni’ ni cha kawaida na huacha upeo wa amri wazi, huku tanbihi ikihifadhi maana nyingine za kileksia.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ huonyesha hitimisho linalotokana na jibu lao kuhusu umiliki wa sarafu.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: Kaisari yaliyo ya Kaisari
  rationale: Muundo huu wa Kiswahili unahifadhi urudiaji wa ‘Kaisari’ na uwiano wa kisanaa wa kauli ya Kigiriki bila kuufanya uwe nadharia pana ya kisiasa.
- source_word: καὶ τὰ τοῦ θεοῦ τῷ θεῷ
  choice: na Mungu yaliyo ya Mungu
  rationale: Tafsiri hii inalingana kwa muundo na sehemu inayomhusu Kaisari na kuhifadhi tofauti kati ya madai ya Kaisari na yale ya Mungu.
theological_decisions:
- issue: Nguvu na upeo wa amri kuhusu wajibu kwa mamlaka ya kiraia na kwa Mungu
  choice: 'Kauli sambamba imehifadhiwa bila kufafanuliwa zaidi: ‘Kaisari yaliyo ya Kaisari, na Mungu yaliyo ya Mungu.’'
  alternative: Kuitafsiri kama amri inayohusu kodi pekee, au kama idhini ya mamlaka ya serikali isiyo na mipaka.
  rationale: Kigiriki kinatofautisha madai ya Kaisari na madai ya Mungu lakini hakielezi hapa mipaka yake yote. Tafsiri inapaswa kuhifadhi mvutano huo na ukuu wa dai la Mungu bila kuingiza mfumo wa kisiasa au wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa kawaida na wenye heshima. ‘Ndipo’ na ‘basi’ huendeleza hoja kwa uwazi; urudiaji wa Kaisari na Mungu umehifadhiwa kwa ajili ya uwiano wa usemi wa asili.
