translation:
  language: sw
  text: Makutano waliposikia hayo,[a] walishangazwa na mafundisho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kusikia hayo”; kwa karibu zaidi, “wakiwa wamesikia.”
