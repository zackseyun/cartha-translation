lexical_decisions:
- source_word: καὶ
  choice: (haijatafsiriwa kwa neno la pekee)
  rationale: Kiunganishi hiki kinaendeleza simulizi. Katika Kiswahili, mwendelezo huo unaeleweka kwa kuanza moja kwa moja na kishazi cha wakati, hivyo kuacha “na” kunaleta lugha ya kawaida bila kupoteza uhusiano na yaliyotangulia.
- source_word: ἀκούσαντες
  choice: uliposikia hayo
  rationale: Kirai cha wakati kinawasilisha kwa kawaida uhusiano wa kitenzi-shirikishi cha aoristi na tendo kuu. “Hayo” linaonyesha jibu la Yesu lililotangulia bila kulifanya kuwa kitu kisichotajwa wazi katika Kigiriki.
- source_word: οἱ ὄχλοι
  choice: umati
  rationale: Ingawa Kigiriki ni wingi, Kiswahili cha kawaida hutumia nomino ya jamii “umati” kumaanisha watu wengi waliokusanyika; “makutano” pia linawezekana lakini si la kawaida sana katika matumizi ya sasa.
- source_word: ἐξεπλήσσοντο
  choice: ulishangazwa
  rationale: Kitenzi hiki kinaonyesha mwitikio mkubwa wa mshangao. Muundo wa hali ya kutendwa ni wa asili na wenye hadhi katika Kiswahili, bila kuzidisha nguvu ya neno.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: na mafundisho yake
  rationale: “Na” hapa huonyesha sababu au msingi wa mshangao kwa Kiswahili cha kawaida. “Mafundisho” linafaa zaidi kuliko “fundisho” kwa kurejelea namna na yaliyomo katika kufundisha kwake.
