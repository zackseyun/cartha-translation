id: MAT.22.7
reference: Matthew 22:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: sw
  text: Lakini mfalme akakasirika, akatuma majeshi yake, akawaangamiza wauaji hao na kuuteketeza mji wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: akakasirika
  rationale: Huwasilisha kwa lugha ya kawaida na yenye hadhi hali ya mfalme kuingiwa na hasira.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: majeshi yake
  rationale: Neno la Kigiriki ni la wingi na hapa linarejelea vikosi vya kijeshi vya mfalme; “majeshi yake” ni tafsiri ya moja kwa moja na ya asili.
- source_word: ἀπώλεσεν
  choice: akawaangamiza
  rationale: Huhifadhi nguvu ya kitenzi kinachoonyesha kuwaangamiza kabisa wauaji, bila kupunguza maana kuwa kuwashinda tu.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: wauaji hao
  rationale: Hutafsiri kihalisi wahusika walioua watumishi waliotajwa katika muktadha.
- source_word: ἐνέπρησεν
  choice: kuuteketeza
  rationale: Hutoa maana ya kuunguza kwa moto hadi kuharibu, inayofaa kwa mji.
theological_decisions:
- issue: Uhusiano wa matendo ya mfalme na maana ya mfano
  choice: Kudumisha simulizi moja kwa moja bila kutaja kinachowakilishwa na mfalme, majeshi, au mji
  alternative: Kufafanua ndani ya mstari kwamba matendo haya ni hukumu ya Mungu au yanarejelea tukio fulani la kihistoria
  rationale: Mstari wenyewe ni sehemu ya mfano na hautoi ufafanuzi huo waziwazi; tafsiri haipaswi kusuluhisha kimadhehebu au kihistoria jambo linalobaki la kufasiriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Mfuatano wa vitenzi “akakasirika, akatuma, akawaangamiza ... na kuuteketeza” ni wa asili katika masimulizi ya Kiswahili na unahifadhi mtiririko wa Kigiriki.
