  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: sw
  text: Katika ufufuo basi, atakuwa mke wa nani miongoni mwa wale saba? Kwa maana wote walimwoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia usemi unaomaanisha kwa karibu, “kwa maana wote walikuwa naye.” Katika muktadha huu, maana yake ni kwamba wote saba walimwoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: ufufuo
  rationale: Katika muktadha huu ἀνάστασις humaanisha ufufuo wa wafu wa wakati ujao; muundo ἐν τῇ ἀναστάσει unaonyesha hali au wakati, ‘katika ufufuo.’
- source_word: οὖν
  choice: basi
  rationale: Neno hili linaendeleza hitimisho la hoja na linafaa kwa kawaida katika swali la Kiswahili.
- source_word: τίνος τῶν ἑπτὰ
  choice: wa nani kati ya wale saba
  rationale: Huu ni uhusiano wa umilikaji/ndoa na pia uteuzi kutoka katika kundi la ndugu saba.
- source_word: γυνή
  choice: mke
  rationale: Ingawa γυνή pia linaweza kumaanisha ‘mwanamke,’ muktadha wa ndoa unahitaji ‘mke.’
- source_word: πάντες
  choice: wote
  rationale: Linawarejelea kwa pamoja wale ndugu saba.
- source_word: γὰρ
  choice: kwa maana
  rationale: Linaanzisha sababu inayounga mkono swali lililotangulia.
- source_word: ἔσχον αὐτήν
  choice: walikuwa wamemwoa
  rationale: Kwa neno kwa neno ni ‘walikuwa naye/walimkuwa naye,’ lakini katika simulizi hili usemi huo unamaanisha kwamba kila mmoja alimwoa. Kiswahili cha kawaida kinahitaji maana hiyo iwe wazi, huku tanbihi ikihifadhi usemi halisi.
theological_decisions:
- issue: Maana ya ἀνάστασις katika changamoto ya Masadukayo
  choice: Ufufuo wa wafu wa wakati ujao
  alternative: Maisha baada ya kifo kwa maana isiyo maalumu
  rationale: Muktadha unahusu kwa wazi ubishi wa Masadukayo dhidi ya ufufuo, na jibu la Yesu linaendelea kujadili jambo hilohilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ‘mke wa nani kati ya wale saba’ ni wa kawaida na unaweka wazi kundi linaloulizwa. Kiashiria cha tanbihi kimewekwa baada ya kishazi kinachofafanuliwa.
