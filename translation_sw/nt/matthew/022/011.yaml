  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: sw
  text: Lakini mfalme alipoingia kuwatazama wageni waliokuwa wameketi mezani[a], alimwona humo mtu ambaye hakuwa amevaa vazi la arusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “wale waliokuwa wameegama,” yaani mkao uliokuwa wa kawaida wakati wa kula katika karamu rasmi.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Lakini ... alipoingia
  rationale: Muundo huu unaonyesha tendo la kuingia lililotangulia tendo kuu, huku δέ ikileta hatua mpya yenye mvutano katika simulizi.
- source_word: ὁ βασιλεὺς
  choice: mfalme
  rationale: Hili ndilo neno la kawaida na sahihi kwa βασιλεύς katika mfano unaohusu karamu ya kifalme.
- source_word: θεάσασθαι
  choice: kuwatazama
  rationale: Kitenzi-jina kinaonyesha kusudi la kuingia kwake. ‘Kuwatazama’ ni Kiswahili cha kawaida na hakiongezi kwa lazima wazo la ukaguzi rasmi.
- source_word: τοὺς ἀνακειμένους
  choice: wageni waliokuwa wameketi mezani
  rationale: Katika muktadha wa karamu, neno hili linawahusu washiriki wa chakula waliokuwa wameegama kwa desturi ya wakati huo. Tafsiri kuu inaweka wazi kwamba ni wageni wa karamu, na tanbihi inahifadhi maelezo ya mkao wa kale.
- source_word: εἶδεν ἐκεῖ
  choice: alimwona humo
  rationale: ‘Alimwona’ hutafsiri moja kwa moja εἶδεν, na ‘humo’ huonyesha mahali ndani ya ukumbi wa karamu kwa Kiswahili cha asili.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Katika Kiswahili, ‘mtu’ ndilo neno la kawaida kwa mwanadamu mmoja na halifuti jinsia ya mhusika, ambayo baadaye inaonyeshwa na upatanisho wa kisarufi wa ‘ambaye ... amevaa’ bila kulazimisha neno ‘mwanamume’ lisilohitajika kimuktadha.
- source_word: οὐκ ἐνδεδυμένον
  choice: ambaye hakuwa amevaa
  rationale: Muundo huu unaeleza hali ya mtu wakati mfalme alipomwona na ni wa kawaida katika Kiswahili cha sasa.
- source_word: ἔνδυμα γάμου
  choice: vazi la arusi
  rationale: Unahifadhi umoja wa ἔνδυμα na maana ya vazi linalofaa kwa sherehe ya arusi, bila kueleza zaidi ya maandishi ya Kigiriki.
theological_decisions:
- issue: Mkao wa wageni katika karamu
  choice: Kutumia ‘wageni waliokuwa wameketi mezani’ katika matini na kueleza katika tanbihi kuwa Kigiriki kinasema walikuwa wameegama.
  alternative: ‘wale waliokuwa wameegama’
  rationale: Tafsiri kuu inaeleweka mara moja kwa wasomaji wa sasa, ilhali tanbihi inalinda mandhari ya kihistoria bila kufanya Kiswahili kisikike kana kwamba wageni walikuwa wameinama juu ya meza.
- issue: Maana ya vazi la arusi katika mfano
  choice: Kutafsiri kwa unyofu ‘vazi la arusi’ bila kueleza ishara yake ndani ya mstari.
  alternative: Kuongeza maelezo kama ‘vazi linalofaa kwa arusi’ au kufafanua maana yake ya kiroho.
  rationale: Matini yenyewe haifafanui hapa ishara ya vazi hilo. Tafsiri inapaswa kuhifadhi nafasi ya mfano na mvutano wake bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alimwona humo’ ni ya asili zaidi kuliko kurudia ‘pale,’ na ‘vazi la arusi’ huhifadhi umoja wa neno la Kigiriki huku likieleweka kwa urahisi.
