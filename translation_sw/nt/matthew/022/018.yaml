id: MAT.22.18
reference: Matthew 22:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: sw
  text: Lakini Yesu, akijua nia yao mbaya[a], akasema, “Kwa nini mnanijaribu[b], enyi wanafiki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wao” au “hila yao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mnanishawishi.” Kitenzi cha Kigiriki kinaweza kumaanisha kujaribu, kupima, au kushawishi mtu atende mabaya, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: akijua
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha kwamba Yesu alitambua nia yao kabla ya kusema; “akijua” ni ya kawaida na huonyesha hali hiyo kwa ufupi.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaonyesha tofauti ndogo kati ya maneno yao ya kujipendekeza na ufahamu wa Yesu kuhusu nia yao halisi.
- source_word: πονηρίαν
  choice: nia yao mbaya
  rationale: Neno hili linaweza kumaanisha uovu, ubaya, au nia yenye madhara. Katika muktadha huu linaelekeza hasa kwenye kusudi ovu lililofichwa nyuma ya swali lao.
- source_word: εἶπεν
  choice: akasema
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha simulizi, na kiambishi “aka-” kinaendeleza mfuatano wa matukio kwa Kiswahili cha asili.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu τί huuliza sababu; “Kwa nini” ndiyo kauli ya kawaida ya Kiswahili.
- source_word: πειράζετε
  choice: mnanijaribu
  rationale: πειράζω inaweza kumaanisha kujaribu, kupima, au kushawishi mtu atende mabaya. “Mnanijaribu” huhifadhi upana huo, huku muktadha ukionyesha jaribio la kumnasa Yesu.
- source_word: ὑποκριταί
  choice: enyi wanafiki
  rationale: “Wanafiki” ni neno la kawaida kwa watu wanaojifanya wanyoofu huku wakificha nia tofauti; “enyi” huonyesha wazi kwamba Yesu anawahutubia moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri utambuzi wa Yesu kuhusu nia ya wapinzani wake
  choice: Yesu anajua nia yao mbaya.
  alternative: Yesu anatambua uovu wao au hila yao.
  rationale: Tafsiri inathibitisha ufahamu sahihi wa Yesu kuhusu tabia ya swali lao bila kupanua mstari kuwa tamko pana la kimafundisho lisilosemwa moja kwa moja hapa.
- issue: Maana ya πειράζετε katika swali la Yesu
  choice: mnanijaribu
  alternative: mnanishawishi au mnanitega
  rationale: “Mnanijaribu” huhifadhi uwezekano wa maana za kupima na kujaribu kwa nia mbaya. Muktadha unaonyesha kwamba walitaka kumnasa, lakini tafsiri haibadili kitenzi kuwa maelezo ya hila hiyo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kawaida kwa wasomaji wengi; “nia yao mbaya” inaeleza muktadha wazi, huku tanbihi ikihifadhi upana wa πονηρία. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
