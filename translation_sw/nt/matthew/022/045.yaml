  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: sw
  text: Basi, ikiwa Daudi anamwita “Bwana,” yeye anawezaje kuwa mwana wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza wazi zaidi kutokana na muktadha: “Basi, ikiwa Daudi anamwita Masihi ‘Bwana,’ Masihi anawezaje kuwa mwana wake?”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Basi, ikiwa
  rationale: Huhifadhi nguvu ya sharti ya εἰ na hitimisho la hoja linaloonyeshwa na οὖν, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: καλεῖ
  choice: anamwita
  rationale: Hutoa maana ya kumwita au kumpa cheo fulani, badala ya maana pana zaidi ya kusema.
- source_word: αὐτὸν
  choice: yeye / -mw-
  rationale: Kiwakilishi kinamrejelea yule aliyetajwa katika muktadha uliotangulia; Kiswahili hukionyesha katika kiambishi cha kitenzi, huku “yeye” katika swali ikisaidia uwazi wa rejeo.
- source_word: κύριον
  choice: “Bwana”
  rationale: Huhifadhi cheo cha heshima na mwangwi wake wa Zaburi 110:1 bila kukipunguza kuwa “mkuu” au “bwana mkubwa.”
- source_word: πῶς
  choice: anawezaje
  rationale: Katika swali hili la kimantiki, “anawezaje kuwa” ni Kiswahili cha kawaida kinachowasilisha maana ya “jinsi gani” bila kueleza suluhisho la mvutano.
- source_word: υἱὸς αὐτοῦ
  choice: mwana wake
  rationale: Huhifadhi lugha ya uhusiano wa kifamilia na kifalme ya Kigiriki; “mzao wake” ingekuwa pana zaidi na ingelegeza mvutano uliokusudiwa.
- source_word: ἐστιν
  choice: kuwa
  rationale: Kopula ya wakati uliopo imewasilishwa kwa muundo wa kawaida wa Kiswahili “anawezaje kuwa.”
theological_decisions:
- issue: Nguvu ya Kimasihi na Kikristo ya Daudi kumwita huyo “Bwana”
  choice: Kudumisha maneno “Bwana” na “mwana wake” bila kuongeza “Masihi” katika maandishi makuu.
  alternative: Ikiwa Daudi anamwita Masihi “Bwana,” Masihi anawezaje kuwa mwana wake?
  rationale: Kigiriki kina kiwakilishi αὐτόν, si nomino “Masihi,” kwa kuwa rejeo linatokana na muktadha uliotangulia. Tafsiri inadumisha mvutano kati ya kuwa mwana wa Daudi na kuwa Bwana wake bila kuutatua kwa ufafanuzi wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Basi, ikiwa” unasikika wa kawaida kuliko “ikiwa basi,” na alama za kunukuu zinaonyesha kuwa “Bwana” ndilo jina au cheo anachotumia Daudi.
