  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: sw
  text: Naye akamwambia, “Mpende Bwana Mungu wako kwa moyo wako wote, kwa nafsi yako yote, na kwa akili yako yote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Naye
  rationale: Katika muktadha huu δέ ni kiunganishi hafifu kinachoendeleza mazungumzo; “Naye” huendeleza simulizi kwa Kiswahili cha kawaida bila kuingiza upinzani mkali.
- source_word: ἔφη αὐτῷ
  choice: akamwambia
  rationale: Kitenzi φημί kinaanzisha usemi wa moja kwa moja, na pamoja na αὐτῷ, “akamwambia” ni tafsiri ya asili na sahihi bila kuongeza wazo la kujibu ambalo halimo wazi katika kitenzi.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Ingawa ni umbo la wakati ujao, hapa hutumika kama amri katika nukuu ya Kumbukumbu la Torati. Kiswahili huwasilisha nguvu hiyo kwa kawaida zaidi kwa amri “Mpende.”
- source_word: κύριον τὸν θεόν σου
  choice: Bwana Mungu wako
  rationale: “Bwana” huhifadhi maana ya κύριος na mwangwi wa jina la agano katika nukuu hii; muundo “Bwana Mungu wako” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: kwa moyo wako wote
  rationale: Ingawa ἐν kimsingi ni “katika,” katika muundo huu huonyesha namna au utimilifu wa upendo. “Kwa moyo wako wote” ni Kiswahili cha asili na huhifadhi wazo la kujitoa kikamilifu.
- source_word: ψυχῇ
  choice: nafsi
  rationale: ψυχή linaweza kumaanisha uhai, nafsi, au mtu mwenyewe. “Nafsi” huhifadhi istilahi tofauti katika mfululizo huu bila kuibana maana kuwa hisia pekee.
- source_word: διανοίᾳ
  choice: akili
  rationale: διάνοια hurejelea uwezo wa kufikiri na kuelewa. “Akili” ni neno la kawaida la Kiswahili linalohifadhi upande wa kiakili wa amri.
theological_decisions:
- issue: Namna ya kuwasilisha nukuu ya amri kuu kutoka Kumbukumbu la Torati
  choice: Kuhifadhi utatu wa “moyo ... nafsi ... akili” kwa muundo wa amri wa kawaida katika Kiswahili
  alternative: Kutumia “uelewa” badala ya “akili,” au kutafsiri ἐν moja kwa moja kuwa “katika”
  rationale: Uamuzi huu huhifadhi tofauti za maneno καρδία, ψυχή, na διάνοια na wito wa kumpenda Mungu kwa ukamilifu, bila kuyafanya kuwa sehemu zilizotenganishwa za asili ya mwanadamu wala kutatua zaidi ya kile Kigiriki kinachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa amri “Mpende” ni wa kawaida zaidi kuliko uigaji wa wakati ujao, huku marudio ya “wako wote/yako yote” yakihifadhi msisitizo wa maandishi ya chanzo.
