  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: sw
  text: Kwa maana walioitwa[a] ni wengi, lakini waliochaguliwa[b] ni wachache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioalikwa”; katika muktadha huu neno hilo linaweza kuwa na maana ya kualikwa kwenye karamu.
    reason: lexical_alternative
  - marker: b
    text: Au “wateule.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ni wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinaonyesha watu wengi; “ni wengi” ni Kiswahili cha kawaida na kinadumisha utofautishaji na ὀλίγοι.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli inayotangulia. “Kwa maana” kinaonyesha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: εἰσιν
  choice: ni
  rationale: Ni umbo la wakati uliopo la kitenzi εἰμί. Katika muundo wa Kiswahili “walioitwa ni wengi,” maana yake inawakilishwa kwa “ni.”
- source_word: κλητοὶ
  choice: walioitwa
  rationale: Neno linaweza kumaanisha walioitwa au walioalikwa. “Walioitwa” linahifadhi upana wa maana na mwangwi wa kitheolojia, huku maana ya mwaliko wa karamu ikitajwa katika tanbihi.
- source_word: ὀλίγοι
  choice: ni wachache
  rationale: Hili ni kinyume cha πολλοί. “Ni wachache” ni la kawaida na linadumisha mtindo mfupi wa kimethali.
- source_word: δὲ
  choice: lakini
  rationale: δέ linaonyesha utofautishaji kati ya makundi mawili; “lakini” linawakilisha vizuri nguvu hiyo ya upinzani.
- source_word: ἐκλεκτοί
  choice: waliochaguliwa
  rationale: Maana ya moja kwa moja ni waliochaguliwa au wateule. “Waliochaguliwa” ni wazi kwa msomaji wa sasa na halilazimishi mfumo fulani wa baadaye wa kitheolojia.
theological_decisions:
- issue: Tafsiri ya ἐκλεκτοί katika mstari unaotumiwa katika mijadala kuhusu uchaguzi na mwito
  choice: waliochaguliwa
  alternative: wateule
  rationale: Maneno yote mawili yanawezekana, lakini “waliochaguliwa” yanaonyesha maana ya wazi ya neno la Kigiriki bila kuipa kauli mapema maana maalumu ya kimadhehebu. “Wateule” limedumishwa katika tanbihi.
- issue: Tafsiri ya κλητοί katika muktadha wa mfano wa karamu ya harusi
  choice: walioitwa
  alternative: walioalikwa
  rationale: Katika muktadha wa karamu, “walioalikwa” linafaa sana; hata hivyo, “walioitwa” linahifadhi maana pana ya neno na utofautishaji wake na ἐκλεκτοί. Tanbihi inaonyesha maana halali ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walioitwa ni wengi ... waliochaguliwa ni wachache” ni mfupi, wa asili, na unadumisha usawa na utofautishaji wa kauli ya Kigiriki.
