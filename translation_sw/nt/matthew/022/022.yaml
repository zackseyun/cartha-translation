  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: sw
  text: Waliposikia hayo[a], walistaajabu; kisha wakamwacha, wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya kusikia, walistaajabu; wakamwacha, wakaondoka.”
    reason: Mbadala huu unaonyesha kwa karibu zaidi muundo wa vishirikishi vya Kigiriki bila yambwa iliyotajwa wazi.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Waliposikia hayo
  rationale: Kirai hiki cha wakati kinaonyesha kwamba kusikia kulitokea kabla ya tendo kuu. Neno “hayo” linarejelea jibu la Yesu lililotangulia, ingawa yambwa haijatajwa wazi katika Kigiriki.
- source_word: ἐθαύμασαν
  choice: walistaajabu
  rationale: Kitenzi hiki huonyesha mshangao au kustaajabu; “walistaajabu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀφέντες αὐτὸν
  choice: wakamwacha
  rationale: Hapa ἀφίημι ina maana ya kumwacha mtu na kuondoka kwake, bila kuongeza wazo lisilo wazi la kumwacha akiwa peke yake.
- source_word: ἀπῆλθαν
  choice: wakaondoka
  rationale: Huwasilisha kwa kawaida tendo la kwenda zao au kuondoka.
- source_word: καὶ ... καὶ
  choice: ; kisha ... waka-
  rationale: Muundo wa Kiswahili wenye mfuatano wa vitenzi unaonyesha uhusiano wa matendo yaliyounganishwa na καί na kudumisha mwendo wa haraka wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. “Waliposikia hayo” ni ya asili zaidi kuliko tafsiri ya neno kwa neno, huku tanbihi ikihifadhi uwezekano wa muundo rasmi zaidi.
