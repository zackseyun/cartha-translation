  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: sw
  text: Wala hakuna mtu aliyeweza kumjibu hata neno moja; wala tangu siku hiyo hakuna mtu aliyethubutu tena kumwuliza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Hutoa maana ya kiwakilishi hasi kinachosema kwamba hapakuwa na mtu yeyote aliyeweza kujibu; ni Kiswahili cha kawaida na wazi.
- source_word: ἐδύνατο
  choice: aliyeweza
  rationale: Huhifadhi wazi wazo la uwezo katika wakati uliopita ndani ya muundo wa Kiswahili unaosikika kwa kawaida.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: kumjibu hata neno moja
  rationale: Nahau ya Kigiriki ina neno λόγον, ‘neno.’ Kauli ‘hata neno moja’ huwasilisha kwa Kiswahili cha kawaida msisitizo kwamba hawakuweza kutoa jibu lolote, bila kutumia tafsiri neno kwa neno isiyo ya kawaida.
- source_word: οὐδὲ
  choice: wala ... na
  rationale: ‘Wala’ huendeleza ukanushi wa kishazi kilichotangulia; kishazi cha pili kimeunganishwa kwa ‘na’ katika muundo wa Kiswahili unaoeleweka vizuri.
- source_word: ἐτόλμησέν τις
  choice: hakuna mtu aliyethubutu
  rationale: Hutoa tendo la kuthubutu au kujipa moyo kufanya jambo, huku ukanushi ukihifadhiwa kwa uwazi.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: tangu siku hiyo
  rationale: Huonyesha siku hiyo kuwa mwanzo wa hali iliyoendelea baadaye; ‘tangu’ ni usemi wa kawaida wa Kiswahili kwa maana hii.
- source_word: ἐπερωτῆσαι
  choice: kumuuliza maswali
  rationale: Katika muktadha huu si ombi moja tu la habari bali ni kumwekea Yesu maswali katika mabishano; wingi ‘maswali’ huwasilisha kitendo hicho kwa kawaida bila ukali wa ‘kumhoji.’
- source_word: οὐκέτι
  choice: tena
  rationale: Huonyesha kwamba tendo hilo lilikoma kuanzia wakati huo na halikuendelea.
theological_decisions:
- issue: Nguvu ya kisimulizi ya kunyamaza kwa wapinzani baada ya jibu la Yesu
  choice: Kauli ya kihistoria kwamba hawakuweza kumjibu na hawakuthubutu kuendelea kumuuliza maswali
  alternative: Kuweka wazi katika tafsiri kwamba Yesu aliwashinda kwa hekima au mamlaka
  rationale: Muktadha unaonyesha ushindi wa Yesu katika mabishano, lakini mstari wenyewe unasema tu kwamba hakuna aliyeweza kujibu na hakuna aliyethubutu kuuliza tena. Tafsiri haiongezi dai la kitheolojia lisilotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. ‘Hata neno moja’ ni ya asili zaidi kuliko ‘kumjibu neno’ na huhifadhi msisitizo wa nahau ya Kigiriki. Hakuna tanbihi inayohitajika kwa sababu maana hiyo imewasilishwa wazi katika matini.
