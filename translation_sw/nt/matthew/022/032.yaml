  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: sw
  text: ‘Mimi ni Mungu wa Abrahamu, na Mungu wa Isaka, na Mungu wa Yakobo.’ Yeye si Mungu wa wafu, bali wa walio hai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mimi ni
  rationale: Huhifadhi utambulisho wa moja kwa moja katika wakati wa sasa, ambao ni muhimu kwa hoja ya Yesu, kwa Kiswahili cha kawaida na chenye mkazo unaofaa.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: Mungu wa Abrahamu, na Mungu wa Isaka, na Mungu wa Yakobo
  rationale: Kurudia neno “Mungu” huhifadhi muundo na uzito wa balagha wa Kigiriki badala ya kufupisha orodha hiyo.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Yeye si Mungu
  rationale: Kiwakilishi “Yeye” kinamrejelea Mungu aliyetajwa katika nukuu na kutoa Kiswahili cha asili bila kurudia kwa namna nzito.
- source_word: νεκρῶν
  choice: wafu
  rationale: Kivumishi cha wingi kilichotumika kama nomino kinatafsiriwa kwa ufupi na kwa kawaida kuwa “wafu.”
- source_word: ζώντων
  choice: walio hai
  rationale: Huhifadhi utofautishaji mfupi na “wafu” huku kikisikika kwa kawaida zaidi katika Kiswahili cha sasa kuliko matumizi ya “wahai.”
theological_decisions:
- issue: Maana ya kuendelea kuwa hai kwa mababu mbele za Mungu katika hoja ya Yesu kuhusu ufufuo
  choice: Kauli imetafsiriwa moja kwa moja bila kuongezwa maelezo kuhusu hali ya kati au namna ya ufufuo.
  alternative: Yeye si Mungu wa watu waliokufa, bali wa watu ambao bado wako hai kwake.
  rationale: Maneno ya aya yanaunga mkono hoja ya Yesu, lakini tafsiri haipaswi kufafanua zaidi ya maandishi yenyewe wala kutatua mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Marudio ya “Mungu” katika orodha yamehifadhiwa kwa uzito wa balagha; katika sentensi inayofuata “Yeye” limetumiwa kwa mtiririko wa kawaida wa Kiswahili.
