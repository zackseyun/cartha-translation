  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: sw
  text: akisema, “Mnaonaje kuhusu Masihi[a]? Yeye ni mwana wa nani?” Wakamwambia, “Wa Daudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός (Christos) hapa limetumika kama cheo cha Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinatanguliza maneno ya Yesu; “akisema” kinadumisha muundo na mtiririko wa simulizi bila kuongeza wazo la kuuliza ambalo halimo wazi katika kitenzi chenyewe.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Mnaonaje
  rationale: Hii ni njia ya kawaida na ya sasa ya Kiswahili ya kuuliza maoni au hukumu ya wasikilizaji.
- source_word: περὶ τοῦ χριστοῦ
  choice: kuhusu Masihi[a]
  rationale: Χριστός hapa ni cheo katika mjadala wa Kiyahudi kuhusu mfalme aliyeahidiwa, hivyo “Masihi” linaonyesha matumizi hayo ya kicheo; tanbihi inahifadhi tafsiri mbadala “Kristo.”
- source_word: τίνος υἱός ἐστιν
  choice: Yeye ni mwana wa nani?
  rationale: Swali linahusu ukoo au nasaba ya Masihi. Kiwakilishi “Yeye” kinarejelea Masihi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetolewa kwa wakati wa simulizi wa Kiswahili; “-mwambia” pia inadumisha yambwa αὐτῷ.
- source_word: Τοῦ Δαυίδ
  choice: Wa Daudi
  rationale: Jibu la Kigiriki ni la mkato na linaacha kurudia neno “mwana”; Kiswahili “Wa Daudi” kinahifadhi ufupi huo huku maana ikieleweka kutokana na swali.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linatumika wazi kama cheo kinachohusu matarajio ya Kimasihi, si kama jina la kawaida. “Masihi” huweka wazi maana hiyo bila kuondoa uwezekano wa tafsiri ya jadi “Kristo,” ambayo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni wa kawaida kwa wasomaji wengi, huku jibu fupi “Wa Daudi” likihifadhi udondoshaji uliopo katika Kigiriki.
