lexical_decisions:
- source_word: Συνηγμένων
  choice: walipokuwa wamekusanyika
  rationale: Kirai tegemezi hiki kinaonyesha mazingira ya wakati ambapo tendo kuu lilifanyika. Tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kuwa wamekusanyika pamoja.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi, si cha kuonyesha upinzani. Mtiririko wa sentensi ya Kiswahili unawasilisha mpito huo bila kuhitaji neno kama “basi” au “lakini”.
- source_word: τῶν Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili; linatumika kama kiima cha kirai cha mazingira.
- source_word: ἐπηρώτησεν
  choice: aliwauliza
  rationale: Kitenzi hiki kinatanguliza swali ambalo Yesu aliwaelekezea Mafarisayo. “Aliwauliza” ni tafsiri ya kawaida na ya sasa bila kuongeza dhana ya uhasama.
- source_word: αὐτοὺς
  choice: -wa- katika “aliwauliza”
  rationale: Kiwakilishi cha yambwa kinarejelea Mafarisayo na huwasilishwa kiasili kwa kiambishi cha yambwa katika kitenzi cha Kiswahili.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina hili ndilo kiima cha kitenzi kikuu; Kiswahili hakihitaji kutafsiri kibainishi kilicho mbele ya jina la mtu.
