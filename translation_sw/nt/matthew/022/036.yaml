  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: sw
  text: “Mwalimu, ni amri ipi iliyo kuu[a] katika Sheria?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyo kuu zaidi.”
    reason: Tafsiri hii mbadala inaonyesha maana ya kiwango cha juu inayoweza kudokezwa na muktadha, ingawa neno la Kigiriki lenyewe liko katika kiwango cha kawaida.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni nomino ya kumwita Yesu moja kwa moja; “Mwalimu” ni maana ya kawaida na ya wazi ya διδάσκαλος katika muktadha huu.
- source_word: ποία
  choice: ipi
  rationale: Kivumishi hiki cha kuuliza kinataka kutambulisha amri moja kati ya amri zilizomo katika Sheria; “ipi” ni ya kawaida na sahihi katika Kiswahili.
- source_word: ἐντολὴ
  choice: amri
  rationale: “Amri” ni neno la kawaida la Kiswahili kwa agizo lenye mamlaka na linafaa katika muktadha wa Sheria ya Musa.
- source_word: μεγάλη
  choice: iliyo kuu
  rationale: Kigiriki kimetumia kivumishi cha kiwango cha kawaida, si umbo la wazi la kiwango cha juu. “Iliyo kuu” hudumisha muundo huo huku ikieleza uzito au ukuu wa amri kwa Kiswahili cha asili.
- source_word: ἐν τῷ νόμῳ
  choice: katika Sheria
  rationale: Hapa νόμος inarejelea Sheria ya Kiyahudi, yaani Torati. Herufi kubwa katika “Sheria” inaonyesha kuwa ni rejeo mahususi la Maandiko bila kutumia istilahi isiyoeleweka kwa urahisi kwa kila msomaji.
theological_decisions:
- issue: Ikiwa μεγάλη litafsiriwe kwa kiwango cha juu, yaani “kuu zaidi”
  choice: iliyo kuu
  alternative: iliyo kuu zaidi
  rationale: Umbo la Kigiriki ni chanya (“kuu”), ingawa swali katika muktadha linaweza kueleweka kuwa linatafuta amri iliyo ya kwanza kwa ukuu. Matini kuu inadumisha umbo la chanzo, na tanbihi inahifadhi tafsiri ya kawaida ya kimuktadha bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa “ni amri ipi iliyo kuu” ni wa kawaida na unaeleweka kwa urahisi. “Sheria” imeandikwa kwa herufi kubwa kwa kuwa inarejelea Torati kama mkusanyo mahususi wa Maandiko.
