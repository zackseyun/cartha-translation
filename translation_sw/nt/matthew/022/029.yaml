  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: sw
  text: Lakini Yesu akawajibu, “Mmekosea[a], kwa sababu hamjui Maandiko wala nguvu za Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mmepotoka” au “Mmedanganyika.”
    reason: Πλανᾶσθε inaweza kumaanisha kuwa katika kosa, kupotoka, au kudanganyika; matini kuu haitaji chanzo cha nje cha udanganyifu.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lakini Yesu akawajibu
  rationale: Muundo huu ni fomula ya Kigiriki ya kutoa jibu. Kiswahili cha masimulizi ‘akawajibu’ huepuka urudiaji usio wa kawaida wa ‘akajibu, akawaambia,’ huku ‘lakini’ ikihifadhi mgeuko wenye utofautishaji wa δέ.
- source_word: Πλανᾶσθε
  choice: Mmekosea
  rationale: Kitenzi hiki hapa kina maana ya kuwa katika kosa au kupotoka katika uelewa. ‘Mmekosea’ ni lugha ya sasa, wazi na yenye uzito unaofaa bila kudai kwamba walidanganywa na mtu mwingine.
- source_word: μὴ εἰδότες
  choice: kwa sababu hamjui
  rationale: Kirai kishirikishi kinaeleza sababu ya kosa lao; ‘kwa sababu’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: τὰς γραφὰς
  choice: Maandiko
  rationale: Katika muktadha huu wingi wa γραφή unarejelea maandiko matakatifu yanayotambuliwa; ‘Maandiko’ ndiyo istilahi ya kawaida na sahihi.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: wala nguvu za Mungu
  rationale: μηδέ inaunganisha jambo la pili lisilojulikana. Katika Kiswahili, ‘nguvu za Mungu’ ni usemi wa kawaida wa uwezo mkuu wa Mungu, ingawa Kigiriki kina nomino ya umoja.
theological_decisions:
- issue: Sababu ya kosa la Masadukayo
  choice: Kauli ya Yesu inaonyesha kuwa wamekosea kwa sababu hawajui Maandiko wala nguvu za Mungu.
  alternative: Kuisoma kama lawama ya jumla kwamba wamepotoshwa, bila kusisitiza sababu.
  rationale: Muundo μὴ εἰδότες pamoja na vitu viwili vinavyounganishwa kwa μηδέ kwa kawaida unaeleza sababu ya kupotoka kwao; tafsiri inahifadhi uhusiano huo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Iwapo Πλανᾶσθε inadokeza udanganyifu wa nje
  choice: Mmekosea
  alternative: Mmedanganywa; mmepotoka
  rationale: Umbo la Kigiriki linaweza kuwasilisha kuwa katika kosa, kupotoka, au kudanganywa. Muktadha hauhitaji kubainisha wakala wa nje, kwa hiyo matini kuu inatumia neno lisilofunga maana hiyo, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi ‘akawajibu’ ni wa kawaida katika simulizi za kibiblia, na sentensi imewekwa wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
