  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his slaves, mistreated them and killed them.
translation:
  language: sw
  text: Lakini wale waliobaki waliwakamata watumwa wake[a], wakawatendea vibaya na kuwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “watumishi wake” (Kigiriki: doulous).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Lakini wale wengine
  rationale: “Wale wengine” hurejelea walioalikwa waliobaki baada ya waliotajwa katika mstari uliotangulia; “lakini” linaonyesha utofauti wa kiasi unaoletwa na δέ.
- source_word: κρατήσαντες
  choice: waliwakamata
  rationale: Kitenzi hiki kinaonyesha kuwashika kwa nguvu kabla ya kuwatendea vibaya na kuwaua. Mfuatano wa vitenzi katika Kiswahili unaeleza uhusiano huo kwa njia ya kawaida.
- source_word: τοὺς δούλους αὐτοῦ
  choice: watumwa wake
  rationale: δοῦλος inaweza kumaanisha mtumwa au mtumishi. “Watumwa” linahifadhi wazi hali yao ya kijamii kama watu walio chini ya mamlaka na umiliki wa mfalme katika mfano; “watumishi” limetolewa kama tafsiri mbadala katika tanbihi.
- source_word: ὕβρισαν
  choice: wakawatendea vibaya
  rationale: ὑβρίζω inahusu kuwatendea watu kwa dharau, aibu, au ukatili, si kuwatukana kwa maneno tu. Usemi huu wa Kiswahili unafikisha upana huo bila kuongeza aina maalumu ya mateso.
- source_word: ἀπέκτειναν
  choice: na kuwaua
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya ἀποκτείνω, bila kuongeza wazo la kisheria linaloweza kuambatana na neno kama “kuwaua kikatili” au “kuwaua kwa makusudi.”
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mfano
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” linahifadhi hali ya kufungwa chini ya mamlaka ya mfalme iliyomo katika neno la Kigiriki, bila kuingiza fundisho la ziada. Kwa kuwa “watumishi” pia linawezekana katika muktadha wa wajumbe wa mfalme, limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mfuatano wa vitenzi ni wa kawaida na unaweka wazi kwamba waliwakamata kwanza, kisha wakawatendea vibaya na kuwaua.
