  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: sw
  text: Ndipo Mafarisayo wakaenda, wakashauriana jinsi ya kumnasa kwa maneno yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipanga jinsi ya kumnasa kwa yale atakayosema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Inaonyesha mfuatano wa matukio kwa ufupi na kwa mtindo wa kawaida wa masimulizi ya Kiswahili.
- source_word: πορευθέντες
  choice: wakaenda
  rationale: Kitenzi hiki cha hali ya kushiriki hutangulia tendo kuu; “wakaenda” kinaonyesha mwendo na mfuatano wake kwa Kiswahili cha kawaida.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi linalotajwa.
- source_word: συμβούλιον ἔλαβον
  choice: wakashauriana
  rationale: Nahau hii ina maana ya kufanya shauri au kupanga kwa pamoja. “Wakashauriana” ni ya asili katika Kiswahili na haiongezi uadui zaidi ya ule unaoelezwa wazi katika kusudi lao.
- source_word: ὅπως
  choice: jinsi ya
  rationale: Inaunganisha shauri lao na kusudi lake kwa njia ya kawaida katika Kiswahili, huku ikihifadhi wazo la kutafuta namna ya kutekeleza mpango.
- source_word: αὐτὸν
  choice: kum-
  rationale: Kiambishi cha yambwa katika “kumnasa” kinamrejelea Yesu moja kwa moja.
- source_word: παγιδεύσωσιν
  choice: kumnasa
  rationale: Linahifadhi taswira ya kumkamata mtu kwa mtego na linaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἐν λόγῳ
  choice: kwa maneno yake
  rationale: Katika muktadha huu λόγος inahusu usemi; kifungu hiki kinaonyesha kwamba walitaka kutumia maneno ambayo angesema ili kumnasa. Wingi wa “maneno” ni wa asili zaidi katika nahau ya Kiswahili kuliko umoja wa Kigiriki.
theological_decisions:
- issue: Kiwango cha uadui kinachoonyeshwa na συμβούλιον ἔλαβον
  choice: Kutafsiri kwa neno lisiloegemea sana upande mmoja, “wakashauriana,” na kuacha kusudi la “kumnasa” lionyeshe nia yao mbaya.
  alternative: “Walipanga njama”
  rationale: Mstari unaonyesha wazi nia ya uadui kupitia kitenzi “kumnasa.” Kutumia “wakashauriana” hakiongezi maana ya njama ndani ya kifungu cha kwanza, ingawa muktadha mzima unabaki wenye uadui.
- issue: Maana ya ἐν λόγῳ
  choice: “kwa maneno yake”
  alternative: “kwa yale atakayosema”
  rationale: Chaguo kuu linadumisha kwa kiasi taswira na ufupi wa Kigiriki, huku mbadala ukieleza wazi zaidi kwamba mtego ungetokana na kauli ya Yesu. Utata mdogo wa muundo umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “wakaenda, wakashauriana” unafaa masimulizi ya Kiswahili; koma husaidia kutenganisha mwendo na tendo kuu.
