  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: sw
  text: Kisha anawaambia watumishi wake, “Karamu ya harusi iko tayari, lakini wale walioalikwa[a] hawakustahili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioitwa.” Katika muktadha huu wa karamu, neno la Kigiriki linamaanisha wale walioalikwa kwenye karamu ya harusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida na cha asili.
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kudumisha uhai wa simulizi; kiambishi cha yambwa kinaonyesha kuwa anasema kwa watumishi wake.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: watumishi wake
  rationale: Katika muktadha huu wa mfano wa kifalme, ‘watumishi’ ni tafsiri ya asili; hali yao ya kisheria kama watumwa si jambo linalosisitizwa hapa.
- source_word: Ὁ μὲν γάμος
  choice: Karamu ya harusi
  rationale: Katika muktadha wa chakula kilichoandaliwa, γάμος inarejelea sherehe au karamu ya harusi, si tendo la kufunga ndoa pekee.
- source_word: ἕτοιμός ἐστιν
  choice: iko tayari
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kivumishi pamoja na kitenzi kishirikishi.
- source_word: οἱ δὲ κεκλημένοι
  choice: wale walioalikwa
  rationale: Katika muktadha wa karamu, kauli tendwa ya καλέω inawahusu wageni walioalikwa; maana halisi zaidi ya ‘walioitwa’ imehifadhiwa katika tanbihi.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: hawakustahili
  rationale: Inahifadhi tathmini ya ἄξιος bila kueleza zaidi sababu ya kutostahili kwao.
theological_decisions:
- issue: Dokezo la kitheolojia linaloweza kuhusishwa na κεκλημένοι (‘walioitwa’)
  choice: wale walioalikwa
  alternative: wale walioitwa
  rationale: Muktadha wa karibu unawahusu wazi wageni wa harusi waliokuwa wamealikwa. ‘Walioalikwa’ huepuka kuingiza kwa nguvu dhana maalumu ya kitheolojia ya mwito, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Karamu ya harusi’ hufafanua maana ya γάμος katika muktadha, na wakati uliopo wa kihistoria umehifadhiwa katika ‘anawaambia.’
