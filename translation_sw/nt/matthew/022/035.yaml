  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: sw
  text: Mmoja wao, mtaalamu wa Sheria, akamwuliza swali ili kumjaribu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: aka-
  rationale: Kiambishi cha masimulizi “aka-” kinaunganisha tendo hili kwa kawaida na muktadha uliotangulia bila kuongeza msisitizo usiokuwamo katika Kigiriki.
- source_word: ἐπηρώτησεν
  choice: akamwuliza swali
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuuliza au kuhoji, bila kuingiza ukali wa mahojiano rasmi.
- source_word: εἷς ἐξ αὐτῶν
  choice: Mmoja wao
  rationale: Ni usemi wa kawaida unaohifadhi maana kwamba mtu huyo alikuwa mmoja wa kundi lililotajwa.
- source_word: νομικὸς
  choice: mtaalamu wa Sheria
  rationale: Katika muktadha huu neno humaanisha mtaalamu wa Sheria ya Kiyahudi, si mwanasheria wa mahakama kwa maana ya kisasa. Herufi kubwa katika “Sheria” huonyesha sheria ya kidini inayorejelewa katika muktadha.
- source_word: πειράζων
  choice: ili kumjaribu
  rationale: Kishiriki hiki kinaonyesha kusudi la swali. “Kumjaribu” huhifadhi wazo la kumpima au kumwekea changamoto bila kulifungia neno katika maana ya kumshawishi atende dhambi.
- source_word: αὐτόν
  choice: -mw- / -m-
  rationale: Viwakilishi vya yambwa katika “akamwuliza” na “kumjaribu” vinamrejelea Yesu kwa njia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Maana ya πειράζων kuhusiana na Yesu
  choice: ili kumjaribu
  alternative: huku akimjaribu; ili kumpima
  rationale: Neno la Kigiriki linaweza kumaanisha kujaribu, kupima, au kushawishi. Katika simulizi hili linaelekea kuonyesha uchunguzi wenye nia ya kumpa changamoto; “kumjaribu” huhifadhi upana huo bila kudai moja kwa moja kwamba alikuwa akimshawishi Yesu atende uovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mtaalamu wa Sheria” huepuka mkanganyiko wa “mwanasheria,” ambalo kwa wasomaji wa leo kwa kawaida humaanisha mtaalamu wa sheria za kiraia au mahakama.
