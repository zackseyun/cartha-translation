id: MAT.22.44
reference: Matthew 22:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: sw
  text: “Bwana alimwambia Bwana wangu, ‘Keti upande wangu wa kulia mpaka nitakapowaweka adui zako chini ya miguu yako[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata nahau ya Kiebrania katika Zaburi 110:1, “niwafanye adui zako kuwa kiti cha kuwekea miguu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Neno lilelile limetumiwa kwa wahusika wote wawili katika Kigiriki. “Bwana” linahifadhi cheo hicho na tofauti ya uhusiano inaonyeshwa na “Bwana wangu,” bila kuingiza utofautishaji usio wazi katika matini ya Kigiriki.
- source_word: Εἶπεν ... τῷ κυρίῳ μου
  choice: alimwambia ... Bwana wangu
  rationale: Muundo wa Kiswahili “alimwambia” unaonyesha kwa kawaida kwamba kauli ilielekezwa kwa mtu fulani, sawa na dativu ya Kigiriki.
- source_word: Κάθου
  choice: Keti
  rationale: Amri hii ni fupi, ya kawaida, na inafaa katika muktadha wa kuketi mahali pa heshima na utawala.
- source_word: ἐκ δεξιῶν μου
  choice: upande wangu wa kulia
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa nafasi ya heshima iliyo upande wa kulia; inaepuka usemi usio wa kawaida “mkono wangu wa kulia” kwa maana ya mahali.
- source_word: ἕως ἂν θῶ
  choice: mpaka nitakapowaweka
  rationale: “Mpaka nitakapo-” linaonyesha tendo la baadaye linalotarajiwa, na kiambishi “-wa-” kinawarejelea adui kwa uwazi.
- source_word: τοὺς ἐχθρούς σου
  choice: adui zako
  rationale: Hili ni neno la kawaida na wazi la Kiswahili kwa watu wanaompinga mhusika anayesemeshwa.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: chini ya miguu yako
  rationale: Hii inafuata moja kwa moja maneno ya Kigiriki na kuhifadhi picha ya kutiishwa kwa adui bila kuongeza “kiti cha kuwekea miguu” katika matini kuu.
theological_decisions:
- issue: Matumizi mawili ya κύριος katika dondoo la Zaburi 110:1
  choice: Bwana alimwambia Bwana wangu
  alternative: BWANA alimwambia Bwana wangu; au Bwana alimwambia mkuu wangu
  rationale: Matini ya Kigiriki inatumia κύριος katika sehemu zote mbili. Kutafsiri zote kwa “Bwana” kunahifadhi mfanano huo na uzito wa hoja ya Yesu kuhusu hadhi ya Masihi. “BWANA” ingeonyesha jina la Mungu lililo nyuma ya dondoo la Kiebrania, lakini utofautishaji huo haujaandikwa wazi katika Kigiriki; “mkuu wangu” ingepunguza nguvu ya cheo hicho.
- issue: Taswira ya kutiishwa kwa adui
  choice: chini ya miguu yako
  alternative: kuwa kiti cha kuwekea miguu yako
  rationale: Kigiriki cha Mathayo kinasema moja kwa moja “chini ya miguu yako.” Taswira ya kiti cha miguu inayojulikana kutoka Kiebrania cha Zaburi imehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali na dondoo umehifadhiwa. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua, yaani “chini ya miguu yako.”
