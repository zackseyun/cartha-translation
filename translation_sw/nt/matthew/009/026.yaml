  text: And this report went out into all that region[a].
translation:
  language: sw
  text: Habari hii ikaenea katika eneo lile lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi ile yote” au “katika wilaya ile yote.” Neno la Kigiriki γῆ linaweza kumaanisha nchi, eneo, au sehemu; hapa yaelekea linamaanisha sehemu iliyozunguka tukio, wala si dunia nzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ika-
  rationale: Kiunganishi cha usimulizi καί kimewakilishwa kwa kiambishi cha mfululizo wa matukio “ika-,” ambacho ni cha asili katika Kiswahili na huhifadhi mwendelezo bila kuongeza maana.
- source_word: ἐξῆλθεν
  choice: ikaenea
  rationale: Ingawa maana ya msingi ni “ikatoka,” habari inayotoka kwenda eneo lote husemwa kwa Kiswahili cha kawaida kuwa “inaenea.” Hili linawasilisha sitiari hiyo kwa lugha ya asili bila kubadili matokeo yaliyokusudiwa.
- source_word: ἡ φήμη αὕτη
  choice: habari hii
  rationale: “Habari” huonyesha taarifa iliyosambaa bila kidokezo cha kutokuwa ya kweli kinachoweza kuambatana na “uvumi”; “hii” huhifadhi kiashiria αὕτη.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: katika eneo lile lote
  rationale: Katika muktadha huu γῆ inaonyesha sehemu inayozunguka tukio, si dunia nzima. “Eneo lile lote” ni ya kawaida na huhifadhi ukamilifu wa ὅλην pamoja na kiashiria ἐκείνην.
