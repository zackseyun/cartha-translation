  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: sw
  text: Lakini umati ulipokwisha kutolewa nje, aliingia, akamshika mkono, naye msichana akainuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msichana alifufuliwa.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa njia zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Lakini baada ya
  rationale: ὅτε huanzisha kishazi cha wakati, na δέ ni kiunganishi hafifu cha mpito. “Lakini baada ya” huonyesha mpito wa simulizi na kwamba kuingia kulitokea baada ya umati kuondolewa.
- source_word: ἐξεβλήθη
  choice: kutolewa nje
  rationale: Hii ni kauli tendwa ya ἐκβάλλω. Katika muktadha huu inamaanisha kuwaondoa watu mahali walipokuwa, bila kuashiria kwa lazima kufukuzwa kwa nguvu.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: ὄχλος humaanisha kundi kubwa la watu; “umati” ni neno la kawaida na linalofaa katika simulizi hili.
- source_word: εἰσελθὼν
  choice: aliingia
  rationale: Kirai-shirikishi cha Kigiriki kinaonyesha tendo lililotangulia tendo kuu. Kitenzi kamili “aliingia” ni cha asili katika Kiswahili.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: akamshika msichana huyo mkono
  rationale: κρατέω pamoja na hali ya umilikishi humaanisha kushika au kukamata. Muundo huu wa Kiswahili unaeleza tendo hilo kwa kawaida na kubainisha kwamba ulikuwa mkono wa msichana.
- source_word: ἠγέρθη
  choice: akainuka
  rationale: Kauli tendwa ya ἐγείρω inaweza kueleza kuinuka au kufufuliwa. “Akainuka” ni ya asili katika simulizi na haibainishi kupita kiasi mtendaji wa tendo; uwezekano wa kauli tendwa umewekwa katika tanbihi.
- source_word: τὸ κοράσιον
  choice: msichana
  rationale: κοράσιον humaanisha mtoto wa kike au msichana mdogo. “Msichana” ni wazi, ya sasa, na inafaa muktadha.
theological_decisions:
- issue: Tafsiri ya ἠγέρθη katika muktadha wa kurudishwa uhai
  choice: akainuka
  alternative: akafufuliwa
  rationale: Kigiriki kina umbo la kauli tendwa, lakini katika masimulizi kitenzi hiki pia huweza kutafsiriwa kwa maana isiyoeleza moja kwa moja mtendaji, kama “akainuka.” Tafsiri kuu inadumisha hali hiyo, huku tanbihi ikihifadhi wazi uwezekano wa kauli tendwa na uzito wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi “aliingia, akamshika … naye … akainuka” unadumisha mwendo wa simulizi bila muundo mgumu wa kishirikishi.
