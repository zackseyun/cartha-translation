  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: sw
  text: Na tazama, mwanamke aliyekuwa akitokwa na damu kwa miaka kumi na miwili akamkaribia kutoka nyuma, akagusa pindo[a][b] la vazi lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kishada” au “ukingo”; neno la Kigiriki linaweza kumaanisha pindo au ukingo wa vazi, na huenda likarejelea kishada kilichokuwa kwenye ukingo wa vazi.
    reason: lexical_alternative
  - marker: b
    text: Tazama Hesabu 15:38 na Kumbukumbu la Torati 22:12 kuhusu mashada kwenye mavazi katika Sheria ya Israeli.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiunganishi na usemi wa kuvuta fikira unaoleta tukio hili kwa msisitizo wa ghafla.
- source_word: γυνὴ αἱμορροοῦσα
  choice: mwanamke aliyekuwa akitokwa na damu
  rationale: Hueleza hali ya kuendelea ya kutoka damu kwa Kiswahili cha kawaida bila kuifanya ionekane lazima kuwa tukio kali la muda mfupi.
- source_word: δώδεκα ἔτη
  choice: kwa miaka kumi na miwili
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda ambao hali hiyo iliendelea.
- source_word: προσελθοῦσα ὄπισθεν
  choice: akaja kwa nyuma yake
  rationale: Huhifadhi mwendo wa kumkaribia Yesu kutoka upande wa nyuma.
- source_word: ἥψατο
  choice: akagusa
  rationale: Katika muktadha huu kitenzi kina maana ya kugusa, bila kulazimisha wazo la kushika kwa nguvu.
- source_word: τοῦ κρασπέδου
  choice: kishada
  rationale: Neno la Kigiriki linaweza kumaanisha kishada, upindo, au ukingo wa vazi. 'Kishada' huonyesha vizuri uwezekano wa mapambo ya nyuzi kwenye vazi la Kiyahudi, huku tanbihi ikihifadhi maana nyingine.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: cha vazi lake
  rationale: '''Vazi'' ni neno pana na sahihi, bila kulifanya ἱμάτιον kuwa joho au koti kwa ulazima.'
theological_decisions:
- issue: Maana ya Kiyahudi inayowezekana ya κράσπεδον kama kishada au ukingo wa vazi
  choice: Kutumia 'kishada' katika matini kuu na kutaja 'upindo' au 'ukingo' katika tanbihi
  alternative: Kutumia 'upindo' katika matini kuu ili kusisitiza ukingo wa vazi
  rationale: Muktadha wa mavazi ya Kiyahudi unaifanya 'kishada' iwezekane sana, lakini neno la Kigiriki lina upana wa maana. Tanbihi inazuia tafsiri kuu isifiche utata huo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia vitenzi vinavyofuatana kwa -ka ili sentensi isomeke kwa urahisi huku ikihifadhi mpangilio wa matendo katika Kigiriki.
