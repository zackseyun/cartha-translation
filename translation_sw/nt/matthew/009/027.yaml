  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: sw
  text: Yesu alipokuwa akiondoka huko, vipofu wawili wakamfuata huku wakipaza sauti na kusema, “Utuhurumie, Mwana wa Daudi!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa Daudi” ni cheo cha kifalme na Kimasihi, kinachomtambulisha Yesu kuwa mrithi aliyeahidiwa wa ukoo wa Daudi.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: alipokuwa akiondoka mahali hapo
  rationale: Kirai cha wakati chenye kitenzi endelevu kinaonyesha kwamba tukio lilitokea Yesu alipokuwa akitoka hapo na kuendelea na safari; tafsiri hii ni ya kawaida katika Kiswahili bila kudokeza kwamba alikuwa akiwapita vipofu tu.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  rationale: Hapa ἀκολουθέω ina maana ya kawaida ya kumfuata mtu kimwili katika simulizi.
- source_word: δύο τυφλοὶ
  choice: watu wawili vipofu
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na kiko katika wingi wa kiume; Kiswahili cha sasa hutumia kwa heshima na uwazi ‘watu wawili vipofu’ badala ya kuwafanya watu watambulike kwa hali yao pekee.
- source_word: κράζοντες καὶ λέγοντες
  choice: wakipaza sauti wakisema
  rationale: κράζω huonyesha mwito wa sauti kubwa na wa dharura. Muundo huu huhifadhi vitendo vyote viwili vya Kigiriki kwa Kiswahili cha asili.
- source_word: Ἐλέησον ἡμᾶς
  choice: Utuhurumie
  rationale: Ni ombi la moja kwa moja la kutendewa kwa huruma; ‘Utuhurumie’ ni fupi, ya kawaida, na yenye uzito unaofaa.
- source_word: υἱὲ Δαυίδ
  choice: Mwana wa Daudi
  rationale: Huhifadhi jina la cheo la kifalme na la Kimasihi badala ya kulirahisisha kuwa maelezo ya ukoo tu.
theological_decisions:
- issue: Maana ya Kimasihi ya ‘Mwana wa Daudi’
  choice: Kutumia jina la cheo ‘Mwana wa Daudi’ katika matini kuu
  alternative: ‘Mzao wa Daudi’ au maelezo yaliyopanuliwa kama ‘Masiya, Mwana wa Daudi’
  rationale: Kigiriki kinatoa jina la cheo la jadi bila kulifafanua. Kulihifadhi kunabaki na maana zake za kifalme na Kimasihi bila kuongeza ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakapaza sauti’ huepukwa hapa kwa sababu vitenzi shiriki vya Kigiriki vinaeleza namna walivyomfuata; ‘wakipaza sauti wakisema’ huhifadhi uhusiano huo. Alama ya tanbihi imewekwa baada ya ‘Mwana wa Daudi,’ ambako maelezo yake yanahusika moja kwa moja.
