  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: sw
  text: Lakini Mafarisayo walikuwa wakisema, “Anawafukuza pepo kwa njia ya mtawala[a] wa pepo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu.”
    reason: Neno la Kigiriki ἄρχων linaweza kumaanisha mtawala, mkuu, au kiongozi mwenye mamlaka.
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya mshangao wa umati katika mstari uliotangulia na shtaka la Mafarisayo.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida na linalotambulika katika Kiswahili kwa kundi hili la Kiyahudi.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu unahifadhi hali ya tendo linaloendelea au linalorudiwa inayodokezwa na wakati usiotimilifu wa Kigiriki.
- source_word: Ἐν τῷ ἄρχοντι
  choice: kwa mamlaka ya mtawala
  rationale: ἐν pamoja na hali ya dative hapa inaonyesha chombo au chanzo cha uwezo. Kiswahili cha asili huhitaji kutaja 'mamlaka' ili shtaka kwamba anatumia uwezo wa mtawala huyo lieleweke wazi.
- source_word: ἄρχοντι
  choice: mtawala
  rationale: Neno hili linaonyesha mwenye mamlaka au kiongozi mkuu bila kuingiza wazo la cheo cha kifalme lisilolazimishwa na Kigiriki.
- source_word: τῶν δαιμονίων
  choice: wa pepo
  rationale: Hii inamtambulisha mtawala anayedaiwa kuwa juu ya pepo.
- source_word: ἐκβάλλει
  choice: anawafukuza
  rationale: Kitenzi hiki ni cha kawaida na wazi katika Kiswahili kwa tendo la kuwatoa pepo kwa nguvu.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: Neno 'pepo' linawakilisha δαιμόνια moja kwa moja katika muktadha wa kutoa pepo, bila kulibadilisha kuwa neno pana zaidi la 'roho'.
theological_decisions:
- issue: Maana ya δαιμόνια katika muktadha wa kutoa pepo
  choice: pepo
  alternative: roho waovu
  rationale: Kigiriki kimetumia δαιμόνια, si neno la jumla πνεύματα. 'Pepo' linahifadhi dai mahususi la nguvu za kiroho lililomo katika maandishi.
- issue: Chanzo cha uwezo kinachodaiwa katika ἐν τῷ ἄρχοντι
  choice: kwa mamlaka ya mtawala
  alternative: kwa njia ya mtawala
  rationale: Tafsiri hii inaonyesha shtaka la Mafarisayo kwamba uwezo wa Yesu wa kufukuza pepo unatokana na mtawala wa pepo, bila kuthibitisha shtaka hilo kuwa la kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'walikuwa wakisema' umehifadhi hali endelevu ya kitenzi, huku 'anawafukuza pepo' ikiwa lugha ya kawaida na inayoeleweka katika muktadha huu.
