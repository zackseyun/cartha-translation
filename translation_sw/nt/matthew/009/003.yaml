  text: Na tazama, baadhi ya waandishi wa sheria wakasema mioyoni mwao,[a] “Mtu huyu anakufuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walisema wao kwa wao.” Usemi wa Kigiriki unaweza kumaanisha kusema kwa siri au kuwaza moyoni.
