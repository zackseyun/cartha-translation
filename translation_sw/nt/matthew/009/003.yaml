lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinachodumisha mwendelezo wa simulizi.
- source_word: ἰδού
  choice: tazama
  rationale: Kinahifadhi kazi ya kuelekeza usikivu na uhai wa simulizi kwa Kiswahili kinachoeleweka.
- source_word: τινες τῶν γραμματέων
  choice: baadhi ya waandishi wa sheria
  rationale: ‘Baadhi ya’ huonyesha kundi lisilotajwa kwa ukamilifu; ‘waandishi wa sheria’ huwasilisha kazi ya γραμματεῖς katika muktadha wa Injili kwa uwazi zaidi kuliko ‘waandishi’ peke yake.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: wakasema mioyoni mwao
  rationale: Usemi huu unahifadhi kitenzi ‘walisema’ huku ukionyesha mazungumzo ya ndani; tanbihi inadumisha uwezekano wa kuelewa kuwa walisemezana faraghani.
- source_word: Οὗτος
  choice: Mtu huyu
  rationale: Ni marejeo ya kawaida na ya moja kwa moja, yenye uwezo wa kubeba sauti ya dharau ya muktadha bila kuiongeza kupita kiasi.
- source_word: βλασφημεῖ
  choice: anakufuru
  rationale: Kitenzi cha wakati wa sasa kinawasilisha moja kwa moja shtaka la kusema jambo linalomvunjia Mungu heshima.
theological_decisions:
- issue: Shtaka la waandishi wa sheria dhidi ya Yesu
  choice: Mtu huyu anakufuru
  alternative: Huyu anasema maneno ya kufuru
  rationale: Tafsiri inadumisha uzito wa shtaka na mvutano wa simulizi bila kueleza mapema kama shtaka hilo ni la kweli au la uongo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ ni rasmi kiasi lakini inafaa kama kiashiria cha simulizi; ‘mioyoni mwao’ ni usemi wa kawaida wa kibiblia unaoeleweka kwa urahisi.
