  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: sw
  text: Lakini aliposikia hayo, alisema, “Wenye afya[a] hawahitaji daktari, bali wagonjwa wanamhitaji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maana ya msingi: “wenye nguvu.” Katika muktadha huu, neno hilo linamaanisha walio na afya njema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kirai cha wakati kinaonyesha tendo lililotangulia kauli. Neno “hayo” linawakilisha kwa kawaida katika Kiswahili yale aliyoyasikia katika muktadha uliotangulia, ingawa yambwa halijaandikwa wazi katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: 'δὲ hapa inaonyesha badiliko lenye utofautishaji mdogo: Yesu anajibu malalamiko yaliyotangulia.'
- source_word: εἶπεν
  choice: alisema
  rationale: Hii inafuata kitenzi cha kawaida cha kusema bila kukifanya kiwe “alijibu,” jambo ambalo Kigiriki hakisemi wazi.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: hawahitaji
  rationale: Hii ndiyo njia ya kawaida na iliyo wazi katika Kiswahili ya kueleza msemo wa Kigiriki unaomaanisha kutokuwa na uhitaji.
- source_word: οἱ ἰσχύοντες
  choice: wenye afya
  rationale: Ingawa ἰσχύω kimsingi inaweza kumaanisha kuwa na nguvu, katika utofautishaji huu wa kitabibu dhidi ya wagonjwa maana ya kawaida ni wale walio na afya njema.
- source_word: ἰατροῦ
  choice: daktari
  rationale: “Daktari” ni neno la kawaida, la sasa, na lenye heshima katika Kiswahili kwa ἰατρός katika picha hii ya kitabibu.
- source_word: οἱ κακῶς ἔχοντες
  choice: wagonjwa
  rationale: Msemo κακῶς ἔχω katika muktadha wa afya humaanisha kuwa mgonjwa; “wagonjwa” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya kimfano dhidi ya maana ya kimwili tu ya methali
  choice: Kauli imetafsiriwa kwa lugha ya kawaida ya kitabibu, huku muktadha ukiachwa uonyeshe matumizi yake ya kiroho.
  alternative: Kuitafsiri kwa ufafanuzi unaowataja moja kwa moja wenye dhambi na uhitaji wao wa kiroho.
  rationale: Maneno ya Kigiriki yenyewe yanatumia picha ya daktari, wenye afya, na wagonjwa. Kuitunza picha hiyo huepuka kuingiza ufafanuzi wa kitheolojia ndani ya kauli na huhifadhi nguvu yake katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo, na “ndio wanaomhitaji” huweka wazi utofautishaji uliomo katika Kigiriki bila kuongeza matumizi ya kiroho yasiyotajwa moja kwa moja.
