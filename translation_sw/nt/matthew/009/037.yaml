  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: sw
  text: Ndipo anawaambia wanafunzi wake, “Mavuno ni mengi, lakini wafanyakazi ni wachache.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha hatua inayofuata katika simulizi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: λέγει
  choice: anawaambia
  rationale: Ingawa Kigiriki kimetumia wakati uliopo wa kihistoria, wakati uliopita ni wa asili zaidi katika simulizi la Kiswahili; kiambishi -wa- kinaonyesha wazi kuwa anawaambia wanafunzi.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: Huhifadhi nomino ya kawaida ya μαθηταί pamoja na umilikaji ulio wazi katika αὐτοῦ.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: '... lakini ...'
  rationale: Muundo μέν...δέ unaweka ulinganifu wenye tofauti; katika Kiswahili, “lakini” huwasilisha tofauti hiyo kwa kawaida bila kuongeza uzito usio wa lazima.
- source_word: θερισμός
  choice: mavuno
  rationale: Ni neno la kawaida la Kiswahili kwa zao linalovunwa au tendo la kuvuna, na linahifadhi sitiari ya kilimo.
- source_word: πολύς
  choice: ni mengi
  rationale: Hukubaliana kisarufi na “mavuno” na kuonyesha wingi bila kufafanua sitiari kupita maandishi ya chanzo.
- source_word: ἐργάται
  choice: wafanyakazi
  rationale: Ni neno la sasa, wazi, na pana kwa watu wanaofanya kazi; linafaa pia ndani ya picha ya mavuno.
- source_word: ὀλίγοι
  choice: ni wachache
  rationale: Ni ulinganifu wa moja kwa moja na “mengi” na hudumisha tofauti iliyomo katika chanzo.
theological_decisions:
- issue: Nguvu ya kisitiari ya kauli kuhusu mavuno
  choice: Kuhifadhi sitiari ya kilimo bila kueleza wazi kuwa mavuno yanawakilisha watu au kazi ya utume.
  alternative: Kufafanua katika tafsiri kwamba mavuno ni watu walio tayari kupokea huduma ya Yesu.
  rationale: Mstari wenyewe unatoa sitiari bila kuifafanua kikamilifu; kuiacha hivyo huhifadhi nafasi ya muktadha kuelekeza maana yake bila kuingiza tafsiri ya kitheolojia katika matini.
- issue: Wakati uliopo wa kihistoria katika λέγει
  choice: Kutumia wakati uliopita wa simulizi, “anawaambia.”
  alternative: Kutumia wakati uliopo, “anawaambia” katika simulizi lililo wakati uliopo au “awaambia,” ili kuakisi moja kwa moja wakati uliopo wa Kigiriki.
  rationale: Wakati uliopo wa kihistoria ni mbinu ya kawaida ya simulizi la Kigiriki; Kiswahili cha kawaida husimulia tukio hili kwa wakati uliopita. Chaguo hili halibadili wakati wa tukio wala maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa urahisi. Sentensi ni fupi na huhifadhi sitiari ya mavuno. Hakuna tanbihi inayohitajika kwa mstari huu; maelezo ya Kiingereza yaliyotolewa yanaonekana kuwa na alama zake [a] na [b] zilizobadilishana na maudhui ya tanbihi, hivyo hayajaigwa.
