id: MAT.9.9
reference: Matthew 9:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: sw
  text: Yesu alipokuwa akipita kutoka hapo, alimwona mtu mmoja aitwaye Mathayo[a], akiwa ameketi mahali pa kukusanyia ushuru. Akamwambia[b], “Nifuate.” Naye akasimama[c], akamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeitwa Mathayo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “anamwambia”; Kigiriki kinatumia wakati wa sasa wa kihistoria ili kuipa simulizi uhai.
    reason: lexical_alternative
  - marker: c
    text: Au, “akainuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: alipokuwa akiondoka hapo
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea la Yesu kuondoka mahali hapo; ni wa asili katika Kiswahili na unahifadhi maana ya mwendo kutoka eneo lililotajwa.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Katika muktadha jina Mathayo linamtambulisha mwanamume husika; neno la kawaida la Kiswahili 'mtu' linatafsiri ἄνθρωπον kwa usahihi bila kuongeza maelezo yasiyokuwamo.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: ameketi katika kituo cha ushuru
  rationale: Kifungu kinaonyesha Mathayo akiwa mahali pa kukusanyia ushuru. 'Kituo cha ushuru' ni wazi kwa msomaji wa kisasa na hakidokezi jengo kubwa la kiofisi.
- source_word: Μαθθαῖον λεγόμενον
  choice: aitwaye Mathayo
  rationale: '''Aitwaye'' huonyesha kwa kawaida jina ambalo mtu anajulikana nalo na kutunza maana ya λεγόμενον.'
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, mfululizo wa 'aka-' ni njia ya kawaida na yenye uhai ya kusimulia matukio yaliyofuatana katika Kiswahili. Tanbihi inaonyesha umbo halisi la Kigiriki.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Amri hii fupi na ya moja kwa moja huhifadhi mwito wa Yesu bila kuupanua kwa maneno ya ufafanuzi kama 'uwe mwanafunzi wangu.'
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Inawakilisha tendo la Mathayo kuinuka kabla ya kumfuata Yesu na kuhifadhi mfuatano wa simulizi.
- source_word: ἠκολούθησεν αὐτῷ
  choice: akamfuata
  rationale: Huhifadhi tendo halisi la kumfuata Yesu pamoja na maana yake ya uanafunzi bila kuifafanua kupita maandishi ya chanzo.
theological_decisions:
- issue: Asili ya mwito wa Yesu kwa Mathayo
  choice: Nifuate
  alternative: Njoo uwe mwanafunzi wangu
  rationale: Maandishi yanaashiria wazi mwito wa uanafunzi, lakini tafsiri fupi inahifadhi amri yenyewe bila kuingiza ufafanuzi wa kitheolojia usiotajwa moja kwa moja.
- issue: Uhusiano kati ya kuinuka na kumfuata Yesu
  choice: Naye akasimama, akamfuata
  alternative: Naye akaondoka akawa mfuasi wake
  rationale: Chaguo hili linaacha matendo mawili ya chanzo yaonekane na halibadili tendo la kumfuata kuwa maelezo ya hadhi ya uanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kisasa, wazi na yenye heshima. Mfululizo wa vitenzi vya 'aka-' umetumiwa kwa simulizi la matendo yanayofuatana; msamiati wa dhehebu maalumu umeepukwa.
