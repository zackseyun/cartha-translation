  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: sw
  text: Wala watu hawatii divai mpya katika viriba vya ngozi vya zamani. La sivyo, viriba hupasuka, divai humwagika, na viriba huharibika. Badala yake, hutia divai mpya katika viriba vya ngozi vipya[a], na vyote viwili huhifadhiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hutumia maneno mawili tofauti: νέος kwa divai “mpya” na καινός kwa viriba “vipya,” yaani vilivyo vipya kwa hali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala
  rationale: Inaendeleza mfano mwingine wa kukanusha unaohusiana na msemo uliotangulia.
- source_word: βάλλουσιν
  choice: watu hawatii / hutia
  rationale: Kitenzi “tia” ni cha kawaida na cha asili kwa kuweka kioevu ndani ya chombo; “watu” huonyesha mtenda wa jumla aliyedokezwa na nafsi ya tatu wingi katika Kigiriki.
- source_word: οἶνον νέον
  choice: divai mpya
  rationale: Ni tafsiri ya kawaida ya divai iliyotengenezwa karibuni na inadumisha utofautishaji wake na viriba vya zamani.
- source_word: ἀσκούς
  choice: viriba vya kuhifadhia divai
  rationale: “Kiriba” ni chombo cha ngozi, lakini ufafanuzi “vya kuhifadhia divai” huwasaidia wasomaji wa kisasa kutambua matumizi yake bila kubadili picha ya kihistoria.
- source_word: παλαιούς
  choice: vya zamani
  rationale: Inaonyesha umri na hali ya viriba, kinyume na viriba vipya vinavyofaa kwa divai mpya.
- source_word: εἰ δὲ μή γε
  choice: Wakifanya hivyo
  rationale: Katika muktadha huu, kisharti kinaeleza matokeo ya kufanya jambo lililokataliwa, yaani kutia divai mpya katika viriba vya zamani.
- source_word: ῥήγνυνται
  choice: hupasuka
  rationale: Huonyesha kwa uwazi viriba kupasuka kwa shinikizo.
- source_word: ἐκχεῖται
  choice: humwagika
  rationale: Huonyesha divai kupotea baada ya viriba kupasuka.
- source_word: ἀπόλλυνται
  choice: huharibika
  rationale: Katika muktadha huu viriba vinakuwa visivyofaa kutumiwa; “huharibika” huwasilisha maana hiyo bila kuzidisha.
- source_word: ἀλλὰ
  choice: Badala yake
  rationale: Inaonyesha tendo sahihi linalowekwa kinyume na tendo lisilofaa lililotajwa.
- source_word: καινούς
  choice: vipya
  rationale: Ni Kiswahili cha asili kwa viriba vipya kwa hali na vinavyofaa kutumiwa; tanbihi inaeleza tofauti ya vivumishi vya Kigiriki.
- source_word: ἀμφότεροι συντηροῦνται
  choice: vyote viwili huhifadhiwa
  rationale: Hurejelea divai na viriba kama vitu viwili vinavyolindwa visiharibike wala kupotea.
theological_decisions:
- issue: Tofauti kati ya νέος na καινός katika mstari mmoja
  choice: Kutafsiri οἶνον νέον kuwa “divai mpya” na ἀσκοὺς καινούς kuwa “viriba vipya,” kisha kueleza tofauti hiyo katika tanbihi
  alternative: Kutumia maneno tofauti katika maandishi, kama “divai changa” na “viriba vipya”
  rationale: “Divai mpya” na “viriba vipya” ni Kiswahili cha kawaida na wazi. Tanbihi inadumisha tofauti halisi ya Kigiriki bila kulazimisha usemi usio wa kawaida au kudokeza maana ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Viriba vya kuhifadhia divai” kinafafanua chombo cha ngozi kwa msomaji wa kawaida, huku marudio yanayotumika baadaye yakibaki mafupi. Sentensi ya masharti imewasilishwa kwa mtiririko wa kawaida wa Kiswahili.
