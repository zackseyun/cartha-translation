base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: sw
  text: Ikawa Yesu alipokuwa ameketi mezani ndani ya nyumba[a], tazama, watoza ushuru wengi na wenye dhambi wakaja, wakawa wameketi mezani pamoja na Yesu na wanafunzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema kwa undani zaidi kwamba Yesu alikuwa amejilaza kwa mlo mezani, mkao uliokuwa wa kawaida wa kula wakati huo. Aya hii haisemi wazi nyumba hiyo ilikuwa ya nani.
    reason: lexical_alternative_and_preserved_ambiguity
lexical_decisions:
- source_word: ἐγένετο
  choice: Ikawa
  rationale: Ni kiunganishi cha kisimulizi kinachohifadhi mwendo wa simulizi bila kulazimisha maana nzito ya 'ilitokea kwamba'.
- source_word: ἀνακειμένου
  choice: alipokuwa ameketi mezani akila
  rationale: Katika muktadha wa chakula, neno hili humaanisha kuwa katika mkao wa kula mezani. Kiswahili cha kawaida hakisemi kwa urahisi 'aliegemea mezani'; tafsiri hii inaweka wazi tendo la kula huku tanbihi ikihifadhi desturi ya kuegemea.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ndani ya nyumba
  rationale: Huhifadhi mahali palipotajwa bila kubainisha nyumba ilikuwa ya nani.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi alama ya kisimulizi inayomvuta msomaji aangalie jambo linalofuata.
- source_word: τελῶναι
  choice: watoza ushuru
  rationale: Ni istilahi ya kawaida na wazi kwa mawakala waliokusanya ushuru, huku ikiacha muktadha uonyeshe hadhi yao ya kijamii.
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Huwakilisha kivumishi kilichotumika kama nomino na kuhifadhi uainishaji wa kidini na kijamii wa watu hao.
- source_word: ἐλθόντες
  choice: walikuja
  rationale: Hugeuza kihusishi cha wakati uliopita kuwa kitenzi cha Kiswahili kinachoendeleza mfuatano wa matendo kwa njia ya kawaida.
- source_word: συνανέκειντο
  choice: wakaketi mezani pamoja na
  rationale: Hueleza kushiriki mlo na ushirika wa mezani kwa Kiswahili cha kawaida; tanbihi inaeleza mkao mahsusi wa zamani.
- source_word: τῷ Ἰησοῦ
  choice: pamoja na Yesu
  rationale: Hutumia umbo la jina lililozoeleka katika Kiswahili na kuonyesha wazi ushirika wa mezani.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: Ni tafsiri iliyozoeleka inayohifadhi uhusiano wa mwalimu na wale wanaojifunza kwake.
theological_decisions:
- issue: Mkao wa kula na ushirika wa mezani
  choice: Kutumia 'ameketi mezani akila' na 'wakaketi mezani pamoja na' katika matini, huku tanbihi ikitaja mkao wa kuegemea.
  alternative: Kuegemea mezani
  rationale: Kitenzi cha Kigiriki hutaja mkao wa kawaida wa kula wa wakati huo na pia ushirika wa mlo. Tafsiri ya Kiswahili inalenga kueleweka kiasili bila kuficha undani huo, ambao umehifadhiwa katika tanbihi.
- issue: Utambulisho wa nyumba
  choice: Kutaja tu 'ndani ya nyumba'.
  alternative: Nyumbani kwake; ndani ya nyumba ya Mathayo
  rationale: Kigiriki hakisemi wazi katika aya hii nyumba hiyo ilikuwa ya nani; hivyo tafsiri haipaswi kuingiza hitimisho la kimuktadha katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Tazama' huhifadhi msisitizo wa kisimulizi; 'watoza ushuru' na 'wanafunzi' ni maneno yanayoeleweka kwa urahisi. Muundo umeepuka kubainisha mwenye nyumba na umetumia lugha ya kawaida ya kula mezani huku undani wa mkao wa kale ukielezwa katika tanbihi.
