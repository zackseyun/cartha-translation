base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: sw
  text: Mafarisayo walipoona hayo[a], wakawaambia wanafunzi wake, “Kwa nini mwalimu wenu anakula pamoja na watoza ushuru na wenye dhambi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa namna rasmi zaidi, “Mafarisayo walipoona, wakawaambia wanafunzi wake…” Kigiriki hakitaji wazi kitu walichokiona; muktadha unaonyesha kuwa ni tukio la kula pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona hayo
  rationale: Kirai cha wakati kinawasilisha kiasili tendo la kuona lililotangulia. Neno “hayo” limetolewa na muktadha—yaani tukio la kula pamoja—ingawa kitu kilichoonekana hakitajwi wazi katika Kigiriki.
- source_word: ἔλεγον
  choice: wakawa wakiwauliza
  rationale: Muundo huu unadokeza hali endelevu ya kitenzi cha wakati uliopita. Kwa kuwa maneno yanayofuata ni swali, “wakiwauliza” ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno ya “wakiwaambia.”
- source_word: μαθηταῖς
  choice: wanafunzi
  rationale: “Wanafunzi” ni neno la kawaida linalohifadhi uhusiano kati ya mwalimu na wale wanaojifunza kwake.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo namna fupi na ya kawaida ya kuuliza sababu katika Kiswahili.
- source_word: τελωνῶν
  choice: watoza ushuru
  rationale: Neno hili linaeleweka kwa urahisi na linawakilisha kazi iliyodharauliwa kijamii katika muktadha huo bila kuongeza maelezo ya kiufundi.
- source_word: ἁμαρτωλῶν
  choice: wenye dhambi
  rationale: Tafsiri hii ya moja kwa moja huhifadhi namna kundi hili linavyotajwa kijamii na kimaadili katika simulizi bila kufafanua zaidi ya Kigiriki.
- source_word: ἐσθίει
  choice: anakula
  rationale: Wakati wa sasa katika swali umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: διδάσκαλος
  choice: mwalimu
  rationale: Hii ndiyo maana ya wazi ya cheo hiki na inahifadhi uhusiano wake na “wanafunzi.”
theological_decisions:
- issue: Kama kitu kilichoonekana kitajwe wazi
  choice: Kutumia “hayo” na kuweka tanbihi
  alternative: “Walipoona” bila kutaja kitu kilichoonekana
  rationale: Kigiriki kinaacha kitu cha kitenzi “kuona” bila kutajwa, lakini Kiswahili cha kawaida hapa hunufaika kwa kurejelea hali iliyotangulia. “Hayo” yanaelekeza kwenye tukio la chakula bila kuongeza hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakawa wakiwauliza” huhifadhi kwa kiasi hali endelevu ya ἔλεγον, huku “anakula pamoja na” ikieleza kwa uwazi ushirika wa mezani bila kutumia lugha nzito.
