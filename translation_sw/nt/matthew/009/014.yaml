  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: sw
  text: Ndipo wanafunzi wa Yohana wakamjia, wakisema, “Kwa nini sisi na Mafarisayo tunafunga mara nyingi[a], lakini wanafunzi wako hawafungi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunafunga sana” au “tunafunga mara nyingi mno”; neno la Kigiriki πολλά linapotumiwa pamoja na “kufunga” linaeleza desturi inayofanywa mara nyingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachounganisha tukio hili na lililotangulia; “ndipo” ni cha asili na chenye hadhi katika simulizi la Kiswahili.
- source_word: προσέρχονται αὐτῷ
  choice: wakamjia
  rationale: Kitenzi kinaonyesha kusogea na kuja kwa Yesu. “Wakamjia” kinawasilisha mwendo huo kwa Kiswahili cha kawaida na kuendeleza mfuatano wa simulizi.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: wanafunzi wa Yohana
  rationale: Huu ni uwasilishaji wa kawaida na wazi wa uhusiano wa kiwakilishi katika Kiswahili.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi wazo la tendo la kusema linaloandamana na kuja kwao, huku sentensi ikitiririka kiasili kwa Kiswahili.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Ni njia ya kawaida ya Kiswahili ya kuuliza sababu.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: sisi na Mafarisayo
  rationale: Huhifadhi msisitizo wa kiwakilishi “sisi” na kulinganisha makundi hayo mawili bila kuondoa utofauti uliomo katika chanzo.
- source_word: νηστεύομεν
  choice: tunafunga
  rationale: “Kufunga” ndilo neno la kawaida la kidini kwa kujizuia kula kwa kusudi la ibada.
- source_word: πολλά
  choice: mara nyingi
  rationale: Neno hili limetumiwa kiadverbia pamoja na “kufunga” na katika muktadha huu linaeleza desturi inayorudiwa mara kwa mara.
- source_word: οἱ δὲ μαθηταί σου
  choice: lakini wanafunzi wako
  rationale: “Lakini” linaonyesha wazi ulinganisho wenye utofauti unaoletwa na δέ.
- source_word: οὐ νηστεύουσιν
  choice: hawafungi
  rationale: Wakati uliopo hapa unaeleza desturi ya kawaida, si lazima tendo linaloendelea katika dakika hiyo; “hawafungi” huhifadhi maana hiyo.
theological_decisions:
- issue: Asili ya swali kuhusu kufunga
  choice: Swali limewasilishwa kama ulinganisho wa desturi ya kawaida ya kufunga.
  alternative: Kulifanya kuwa shtaka kwamba wanafunzi wa Yesu wanakiuka wajibu fulani, au kulihusisha na siku moja tu ya kufunga.
  rationale: Vitenzi vya wakati uliopo na πολλά vinaonyesha mtindo wa kawaida wa kufunga. Tafsiri haiongezi hukumu ya kimafundisho wala kuondoa mvutano wa swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakamjia” na “wakisema” hudumisha mtiririko wa simulizi bila kuwa rasmi kupita kiasi. Alama ya tanbihi imewekwa baada ya “mara nyingi,” ambako ufafanuzi wake unahusika.
