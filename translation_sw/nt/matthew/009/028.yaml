  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: sw
  text: Alipoingia ndani ya nyumba, wale wanaume vipofu wakamkaribia. Yesu akawaambia, “Je, mnaamini kwamba ninaweza kufanya jambo hili?” Wakamwambia, “Ndiyo, Bwana[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana.” Neno la Kigiriki κύριε linaweza kutumiwa kama mwito wa heshima, lakini “Bwana” pia huhifadhi uwezekano kwamba wanatambua mamlaka ya Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Alipoingia ndani ya nyumba
  rationale: Kishiriki cha aoristi pamoja na δέ kinaanzisha tukio linalofuata. Muundo huu wa Kiswahili unaonyesha wakati na kuingia ndani kwa njia ya kawaida bila kulazimisha tafsiri ya neno kwa neno.
- source_word: προσῆλθον αὐτῷ
  choice: wakamkaribia
  rationale: Kitenzi προσέρχομαι hapa humaanisha kuja karibu na mtu au kumkaribia. ‘Wakamkaribia’ ni kifupi, cha kawaida, na kinatofautisha tendo hili na kuingia kwa Yesu.
- source_word: οἱ τυφλοί
  choice: wale watu vipofu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na kinarejelea wanaume vipofu waliotajwa katika muktadha. ‘Wale watu vipofu’ ni lugha ya sasa yenye heshima na bado inaonyesha wazi hali yao.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawauliza
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, mfululizo wa vitenzi vya Kiswahili kwa kiambishi -ka- unasimulia tukio kwa uhai na kwa mtiririko wa kawaida. ‘Akawauliza’ pia huwasilisha wazi kwamba maneno yanayofuata ni swali.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Je, mnaamini kwamba ninaweza kufanya jambo hili?
  rationale: ‘Mnaamini’ hudumisha maana ya kuamini uwezo wa Yesu, na ‘ninaweza’ ni Kiswahili cha kawaida kinachoakisi δύναμαι bila kuongeza ufafanuzi wa uponyaji ambao haujatajwa moja kwa moja katika sentensi.
- source_word: λέγουσιν αὐτῷ
  choice: Wakamjibu
  rationale: Jibu lao linafuata swali moja kwa moja. ‘Wakamjibu’ ni usemi wa asili wa Kiswahili unaowasilisha kazi ya kitenzi katika muktadha, huku -ka- ikidumisha mwendelezo wa simulizi.
- source_word: Ναί
  choice: Ndiyo
  rationale: Hili ndilo jibu la kawaida na la moja kwa moja la kukubali katika Kiswahili Sanifu.
- source_word: κύριε
  choice: Bwana
  rationale: ‘Bwana’ hudumisha uwezekano wa kutambua mamlaka ya Yesu. Kwa kuwa κύριε pia inaweza kuwa namna ya heshima sawa na ‘bwana,’ uwezekano huo umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Maana ya κύριε wanapomwita Yesu
  choice: Bwana
  alternative: bwana
  rationale: Herufi kubwa katika ‘Bwana’ hudumisha uwezekano wa kwamba watu hao wanatambua mamlaka ya Yesu, bila kudai kwamba kauli yao lazima iwe ungamo kamili la kiungu. Maana ya kawaida ya heshima imehifadhiwa katika tanbihi.
- issue: Wakati uliopo wa kihistoria katika λέγει na λέγουσιν
  choice: 'Mfululizo wa simulizi wenye -ka-: ‘akawauliza’ na ‘wakamjibu’'
  alternative: 'Wakati uliopo wa moja kwa moja: ‘anawauliza’ na ‘wanamwambia’'
  rationale: Kiswahili kwa kawaida husimulia matukio yanayofuatana kwa muundo wa -ka-. Chaguo hili huhifadhi uhai na mwendelezo wa simulizi bila kutokeza mabadiliko yasiyo ya kawaida ya wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na lugha yenye heshima. ‘Wale watu vipofu’ imetumiwa badala ya kuwatambulisha watu hao kwa hali yao pekee. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linalohusika.
