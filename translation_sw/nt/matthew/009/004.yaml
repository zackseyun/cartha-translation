  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: sw
  text: Naye Yesu, akijua[a] mawazo yao, akasema, “Kwa nini mnawaza maovu mioyoni mwenu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akitambua mawazo yao.”
    reason: Neno la Kigiriki linaweza kueleza kujua au kutambua mawazo ya ndani.
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu alikuwa na ufahamu wa mawazo yao ya ndani. ‘Akijua’ ni tafsiri ya kawaida na ya moja kwa moja, huku ‘akitambua’ likibaki chaguo linalowezekana.
- source_word: ἐνθυμήσεις
  choice: mawazo
  rationale: Neno hili linamaanisha fikira au tafakari za ndani; ‘mawazo’ ni Kiswahili cha kawaida kinachofaa katika muktadha huu.
- source_word: Ἱνατί
  choice: Kwa nini
  rationale: Hili ni swali kuhusu sababu au nia, na ‘Kwa nini’ ndilo neno la kawaida na wazi katika Kiswahili.
- source_word: ἐνθυμεῖσθε
  choice: mnawaza
  rationale: Wakati wa sasa unaonyesha tendo la kufikiri linaloendelea. ‘Mnawaza’ pia huhifadhi uhusiano wa kimatamshi na ‘mawazo’ yaliyotajwa awali.
- source_word: πονηρὰ
  choice: maovu
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino, yaani mambo au mawazo maovu. ‘Maovu’ huhifadhi ufupi na kutotaja wazi zaidi ya inavyosema matini.
- source_word: καρδίαις
  choice: mioyoni
  rationale: ‘Mioyoni’ huhifadhi sitiari ya chanzo kuhusu utu wa ndani, fikira, na nia badala ya kuibana maana kuwa akili pekee.
theological_decisions:
- issue: Ufahamu wa Yesu kuhusu mawazo yasiyotamkwa
  choice: Yesu, akijua mawazo yao
  alternative: Yesu, akitambua mawazo yao
  rationale: Matini inamwonyesha Yesu akiwa na ufahamu wa mawazo yao ya ndani. Tafsiri hii inadumisha dai hilo bila kulipanua kuwa tamko la kimafundisho lisilosemwa wazi katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mnawaza maovu mioyoni mwenu’ ni cha asili, huhifadhi taswira ya moyo, na hakiongezi nomino ambayo haikutajwa wazi katika Kigiriki.
