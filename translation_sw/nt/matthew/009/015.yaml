  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: sw
  text: Yesu akawaambia[a], “Je, waandamani wa bwana arusi hawawezi kuomboleza maadamu bwana arusi yuko pamoja nao? Lakini siku zitakuja ambapo bwana arusi ataondolewa kutoka kwao[b], na ndipo watakapofunga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “wana wa chumba cha arusi”; ni nahau inayomaanisha waandamani au watu wa sherehe ya arusi wanaohusishwa na bwana arusi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakapochukuliwa kutoka kwao.” Kauli tendwa inaweza kudokeza zaidi ya kuondoka kwa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: wasaidizi wa bwana arusi
  rationale: Hii ni nahau inayowataja washiriki wa karibu wa bwana arusi katika sherehe ya arusi. Tafsiri hii inaeleza jukumu lao kwa Kiswahili cha kawaida bila kubeba kihalisi usemi usio wa kawaida ‘wana wa chumba cha arusi.’
- source_word: πενθεῖν
  choice: kuomboleza
  rationale: Kitenzi hiki humaanisha kuomboleza au kuhuzunika sana; ‘kuomboleza’ hudumisha mgongano wake na kufunga.
- source_word: ἐφ’ ὅσον
  choice: maadamu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kipindi chote ambacho hali fulani inaendelea.
- source_word: νυμφίος
  choice: bwana arusi
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili, na linadumisha taswira ya arusi.
- source_word: ἀπαρθῇ
  choice: ataondolewa
  rationale: Kauli tendwa inadumishwa, nayo inaweza kudokeza kuondolewa kwa nguvu badala ya kuondoka kwa kawaida, bila kuongeza ufafanuzi usiotajwa.
- source_word: νηστεύσουσιν
  choice: watakapofunga
  rationale: Hutoa kwa uwazi tendo la kufunga na kulihusianisha kwa kawaida na wakati unaotajwa na ‘ndipo.’
- source_word: Μὴ δύνανται ... ;
  choice: hawawezi ... sivyo?
  rationale: Swali lenye μή linatarajia jibu hasi; swali la mkia ‘sivyo?’ linadumisha nguvu hiyo ya balagha katika Kiswahili.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Lakini siku zitakuja
  rationale: Ni usemi wa kawaida wa wakati ujao, huku ‘Lakini’ ikionyesha utofauti mpole wa δέ.
theological_decisions:
- issue: Maana ya kikristo inayoweza kuwamo katika taswira ya bwana arusi
  choice: Kudumisha ‘bwana arusi’ kama sitiari bila kumtambulisha Yesu waziwazi ndani ya tafsiri.
  alternative: Kuongeza kwa ufafanuzi kwamba Yesu ndiye bwana arusi wa Kimasihi.
  rationale: Aya yenyewe inaacha wasikilizaji watambue maana ya taswira hiyo. Tafsiri haipaswi kutatua kimafundisho kile ambacho matini imekiacha katika sitiari.
- issue: Dokezo la kuondolewa kwa bwana arusi
  choice: Kutumia kauli tendwa ‘ataondolewa.’
  alternative: Kutafsiri ‘ataondoka.’
  rationale: Kauli tendwa ya Kigiriki inadokeza zaidi ya safari au kuondoka kwa kawaida na inaweza kuelekeza kwenye kifo cha Yesu, lakini tafsiri haifafanui dokezo hilo moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Bwana arusi’ ni usemi unaoeleweka kwa upana; ‘wasaidizi wa bwana arusi’ huepuka nahau ya Kigiriki isiyoeleweka kwa Kiswahili. Muundo wa swali la balagha na kauli tendwa umehifadhiwa.
