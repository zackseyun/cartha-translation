base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: sw
  text: Kisha akagusa macho yao, akisema, “Iwe kwenu kulingana na imani yenu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki pistis, lililotafsiriwa “imani,” katika muktadha huu linaweza pia kueleweka kuwa kumtumaini; katika miktadha mingine linaweza kumaanisha “uaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kielezi hiki kinaonyesha tukio linalofuata katika mfululizo wa simulizi; “Kisha” ni cha asili na kifupi katika Kiswahili.
- source_word: ἥψατο
  choice: akagusa
  rationale: Katika muktadha huu kitenzi ἅπτω kinamaanisha kugusa kimwili; “akagusa” kinatoa maana ya moja kwa moja bila kuongeza maelezo.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: macho yao
  rationale: Hiki ndicho Kiswahili cha kawaida kwa kitu kilichoguswa, badala ya kuiga muundo wa umilikishi wa Kigiriki.
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha kusema kulikofanyika pamoja na kugusa; “akisema” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Κατὰ
  choice: kulingana na
  rationale: κατά pamoja na hali ya accusative hapa huonyesha uwiano au kipimo; “kulingana na” huepuka kuifanya imani kuwa sababu ya moja kwa moja kuliko Kigiriki kinavyosema.
- source_word: τὴν πίστιν ὑμῶν
  choice: imani yenu
  rationale: “Imani” ndilo neno la kawaida la Kiswahili kwa πίστις; katika muktadha huu linahusu kumwamini Yesu na uwezo wake wa kuponya.
- source_word: γενηθήτω
  choice: na iwe
  rationale: Hii ni amri ya nafsi ya tatu katika hali ya kutendwa, inayotumiwa kama tamko lenye kutekeleza jambo. “Na iwe” huhifadhi nguvu ya tamko hilo bila kulazimisha kitenzi “fanywa,” ambacho si cha kawaida sana hapa.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Dative hapa inaonyesha jambo linalowatokea au kuwafaa wao; “kwenu” ni la asili katika muundo “na iwe kwenu.”
theological_decisions:
- issue: Jinsi ya kutafsiri πίστις katika tamko la uponyaji
  choice: imani
  alternative: tumaini; kumwamini
  rationale: Katika muktadha, neno linamaanisha hasa kumwamini Yesu na uwezo wake wa kuponya, lakini “imani” huhifadhi istilahi pana ya πίστις na mvutano wake wa kitheolojia. Maana ya “kumwamini” imewekwa katika tanbihi kama ufafanuzi mbadala.
- issue: Uhusiano kati ya imani na uponyaji katika Κατὰ τὴν πίστιν ὑμῶν
  choice: kulingana na imani yenu
  alternative: kwa sababu ya imani yenu; kwa kadiri ya imani yenu
  rationale: “Kulingana na” huhifadhi maana ya uwiano au kipimo bila kutamka wazi kwamba imani ndiyo sababu inayostahili au nguvu inayozalisha uponyaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Na iwe kwenu” una sauti ya tamko lenye mamlaka huku ukibaki wazi kuhusu namna jambo hilo linavyotendeka. Alama ya tanbihi [a] imewekwa baada ya “macho yao” kwa kufuata mpangilio wa data iliyotolewa, ingawa tanbihi yenyewe inafafanua maneno yanayofuata kuhusu imani.
