  verdict: revise
  source_fidelity: The main rendering accurately conveys the sequence (τότε), physical touch, the participial speech, and the proportional sense of κατὰ τὴν πίστιν ὑμῶν. “Iwe kwenu kulingana na imani yenu” preserves the Greek’s declarative/imperatival pronouncement without overstating faith as an efficient cause. The existing footnote, however, introduces an explicit object (“me”) not present in the Greek and its anchor is attached to “macho yao,” although it concerns πίστις.
  naturalness: The revised wording is clear, modern Standard East African Swahili and retains an appropriately solemn narrative register. Omitting the initial “Na” in the quotation makes the saying slightly more direct while retaining its force.
  terminology: “Imani” is the established and natural rendering for πίστις here. Its contextual sense includes trust, but “kumwamini” should not replace it in the main text, since that would make explicit an object not stated in this verse. “Kulingana na” appropriately renders κατά as correspondence/measure.
