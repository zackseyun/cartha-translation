base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: sw
  text: Lakini Yesu, akigeuka na kumwona[d], alisema, “Jipe moyo[b], binti; imani yako[c] imekuokoa[a].” Naye mwanamke akapona tangu saa ile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imekuponya” au “imekufanya uwe mzima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuokoa, kuponya, au kufanya mtu awe mzima; maandishi makuu yanahifadhi maana pana zaidi katika maneno ya Yesu.
    reason: lexical_alternative
  - marker: b
    text: Au “Uwe na ujasiri.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki πίστις linaweza pia kueleweka hapa kuwa “kumwamini.”
    reason: alternative_reading
  - marker: d
    text: Au “aligeuka na kumwona.”
    reason: previous_rendering
lexical_decisions:
- source_word: στραφεὶς
  choice: akigeuka
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetumiwa kwa maana isiyo ya kutendwa hapa. ‘Akigeuka’ kinaonyesha tendo la Yesu bila kuongeza kwamba aligeuka kabisa au kuelekea upande fulani.
- source_word: ἰδὼν
  choice: na kumwona
  rationale: Muundo huu unaunganisha tendo la kuona na la kugeuka, huku ukihifadhi mtiririko wa vitenzi vishirikishi vya Kigiriki kwa Kiswahili cha kawaida.
- source_word: Θάρσει
  choice: Jipe moyo
  rationale: Amri hii inamtaka awe na ujasiri au matumaini. ‘Jipe moyo’ ni usemi wa kawaida na wenye heshima katika Kiswahili cha Afrika Mashariki.
- source_word: θύγατερ
  choice: binti
  rationale: Hifadhi namna ya upole ya kumwita mwanamke huyo kama mwana wa kike bila kuongeza ‘yangu,’ ambalo halipo wazi katika Kigiriki.
- source_word: πίστις
  choice: imani
  rationale: ‘Imani’ ndiyo tafsiri ya kawaida na pana ya πίστις hapa; katika muktadha huu inahusisha kumwamini Yesu.
- source_word: σέσωκέν σε
  choice: imekuokoa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa, kuponya, au kufanya mtu awe mzima. ‘Imekuokoa’ kinahifadhi upana huo katika maneno ya Yesu.
- source_word: ἐσώθη
  choice: akapona
  rationale: Katika hitimisho la simulizi, muktadha unaeleza wazi matokeo ya kimwili, kwa hiyo ‘akapona’ ni ya asili na sahihi.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: tangu saa ile
  rationale: Tafsiri hii inahifadhi neno ὥρα na maana ya kwamba uponyaji ulianza wakati huo na ukaendelea.
- source_word: γυνή
  choice: mwanamke
  rationale: Ni tafsiri ya kawaida ya γυνή katika muktadha huu na inamrejelea mwanamke aliyetajwa katika simulizi.
theological_decisions:
- issue: Tafsiri ya πίστις
  choice: imani
  alternative: tumaini; kumwamini
  rationale: ‘Imani’ huhifadhi istilahi pana ya πίστις, huku tanbihi ikionyesha kwamba hapa inaweza kueleweka kama kumwamini Yesu.
- issue: Tafsiri ya σῴζω katika maneno ya Yesu na katika hitimisho la msimulizi
  choice: ‘imekuokoa’ katika maneno ya Yesu, na ‘akapona’ katika hitimisho
  alternative: ‘imekuponya’ katika sehemu zote mbili; ‘imekufanya mzima’ katika sehemu zote mbili
  rationale: Kigiriki kinatumia mzizi uleule katika sehemu zote mbili, ukiwa na mwangwi wa kuokoa na kuponya. ‘Imekuokoa’ huhifadhi upana wa maneno ya Yesu, na ‘akapona’ huweka wazi matokeo ya kimwili katika simulizi bila kufuta mvutano huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi ‘akigeuka na kumwona’ unasomeka kwa urahisi huku ukibaki karibu na participles za Kigiriki; ‘tangu saa ile’ huhifadhi uzito wa alama ya wakati katika chanzo.
