  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: sw
  text: Lakini ili mjue kwamba Mwana wa Adamu ana mamlaka duniani ya kusamehe dhambi—kisha anamwambia aliyepooza[a], “Simama, chukua kitanda chako[b], nenda nyumbani kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu aliyepooza.”
    reason: lexical_alternative
  - marker: b
    text: Au “godoro lako.” Neno la Kigiriki linaweza kumaanisha kitanda, kochi, au godoro/jamvi la kulalia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Lakini ili mjue
  rationale: “Lakini” linaonyesha badiliko lenye utofautishaji wa kiasi, na “ili mjue” linahifadhi wazo la kusudi katika ἵνα.
- source_word: ἐξουσίαν ἔχει
  choice: ana mamlaka
  rationale: ἐξουσία hapa ni mamlaka au haki halali ya kusamehe, si uwezo wa kutenda tu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Kiswahili na linadumisha mwangwi unaowezekana wa Danieli 7.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Linataja eneo ambamo mamlaka hayo yanatenda na ni usemi wa kawaida wa Kiswahili.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ya kusamehe dhambi
  rationale: Katika muktadha huu ἀφίημι humaanisha kuondolea au kusamehe dhambi.
- source_word: τότε λέγει
  choice: kisha anamwambia
  rationale: Wakati uliopo wa kihistoria umehifadhiwa kwa “anamwambia,” huku “kisha” likionyesha mwendelezo wa tukio.
- source_word: τῷ παραλυτικῷ
  choice: aliyepooza
  rationale: Kivumishi cha Kigiriki kimetumika kama nomino; “aliyepooza” ni cha kawaida na hakiongezi jinsia ambayo haijarudiwa wazi hapa.
- source_word: Ἐγερθεὶς
  choice: Simama
  rationale: Ingawa kimuundo ni kitenzi-shirikishi, hapa kina nguvu ya amri katika mfuatano wa maagizo.
- source_word: ἆρόν
  choice: chukua
  rationale: Hapa αἴρω ni kuinua na kwenda nacho; “chukua” ni wazi na ya kawaida katika Kiswahili.
- source_word: κλίνην
  choice: kitanda
  rationale: κλίνη linaweza kuwa kitanda, kochi, au godoro/jamvi la kulalia; “kitanda” ndilo neno pana na la kawaida.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: uende nyumbani kwako
  rationale: Muundo wa Kiswahili “uende” unafuata kwa kawaida amri zilizotangulia, na “nyumbani kwako” huwasilisha οἶκος kwa maana ya mahali anapoishi.
theological_decisions:
- issue: Jina la Kikristo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” linahifadhi jina la cheo la Yesu na mvutano wake wa kimuktadha, kutia ndani mwangwi unaowezekana wa Danieli 7, bila kulifafanua kupita kiasi.
- issue: Maana ya ἐξουσία katika kusamehe dhambi
  choice: mamlaka
  alternative: uwezo
  rationale: Muktadha unasisitiza haki na mamlaka halali ya kusamehe dhambi, si nguvu au uwezo wa kufanya muujiza peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi uliokatizwa umehifadhiwa kwa alama ya kufunga usemi baada ya “dhambi,” kisha simulizi linaendelea kabla ya maneno ya Yesu kwa aliyepooza.
