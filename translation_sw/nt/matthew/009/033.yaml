  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: sw
  text: Baada ya pepo kufukuzwa, mtu huyo bubu[a] alisema. Umati wa watu ukashangaa, ukisema, “Kamwe jambo kama hili halijapata kuonekana katika Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiziwi.” Neno la Kigiriki linaweza kumaanisha “kiziwi” au “bubu”; hapa muktadha unapendelea “bubu” kwa sababu msisitizo ni kwamba alisema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: Baada ya ... kutolewa
  rationale: Kauli ya wakati uliopita katika muundo wa genitive absolute inaonyesha kwamba kutolewa kwa pepo kulitangulia kusema kwa mtu huyo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: δαιμονίου
  choice: pepo
  rationale: Katika masimulizi ya Injili kuhusu utoaji wa pepo, neno hili linamaanisha kiumbe cha kiroho kiovu. “Pepo” ni istilahi ya kawaida ya Kiswahili na haiongezi sifa isiyotajwa hapa.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Kitenzi kinaeleza tendo la kusema bila kutaja wazi mwanzo au mwendelezo wake; kwa hiyo hakijaongezewa maana ya “akaanza kusema.”
- source_word: ὁ κωφός
  choice: mtu huyo bubu
  rationale: κωφός linaweza kumaanisha kiziwi au bubu, lakini hapa matokeo yanayotajwa mara moja ni kwamba mtu huyo alisema. “Mtu huyo” pia humtambulisha kwa kawaida kama mtu wa mstari uliotangulia.
- source_word: ἐθαύμασαν
  choice: ukashangaa
  rationale: Kitenzi kinaonyesha mshangao mkubwa. “Kushangaa” ni cha sasa, cha kawaida, na kinaeleweka kwa urahisi.
- source_word: οἱ ὄχλοι
  choice: umati wa watu
  rationale: Ingawa Kigiriki kina wingi, Kiswahili hutumia kwa kawaida nomino ya mkusanyiko “umati wa watu” kumaanisha watu wengi waliokusanyika.
- source_word: Οὐδέποτε
  choice: Kamwe ... halijapata
  rationale: Muundo huu unaonyesha kwa mkazo kwamba jambo la aina hiyo halikuwa limetokea wakati wowote hapo kabla.
- source_word: ἐφάνη
  choice: halijapata kuonekana
  rationale: Kauli hii inaweza kumaanisha “kuonekana” au “kutokea wazi.” Muundo wa kutendwa ni wa asili katika Kiswahili na unabaki karibu na hali ya kitenzi cha Kigiriki.
- source_word: οὕτως
  choice: jambo kama hili
  rationale: Kiswahili huhitaji hapa kirai kinachorejelea aina ya tukio lililoshuhudiwa; “jambo kama hili” huwasilisha maana hiyo kwa kawaida.
- source_word: ἐν τῷ Ἰσραήλ
  choice: katika Israeli
  rationale: Huhifadhi kwa ufupi wazo la ndani ya Israeli au miongoni mwa watu wa Israeli bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya κωφός katika muktadha wa uponyaji na utoaji wa pepo
  choice: bubu
  alternative: kiziwi
  rationale: Neno linaweza kuwa na maana yoyote kati ya hizi mbili, lakini kauli inayofuata, “alisema,” inaonyesha kwamba kutoweza kusema ndilo tatizo linalosisitizwa hapa. Uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa simulizi umetumia “baada ya” kuonyesha wazi mpangilio wa matendo, huku tanbihi ikihifadhi utata halisi wa κωφός.
