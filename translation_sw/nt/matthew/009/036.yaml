  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: sw
  text: Naye alipoyaona makundi ya watu, aliwahurumia, kwa sababu walikuwa wamesumbuliwa na wametupwa chini[a], kama kondoo wasio na mchungaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamesumbuliwa na wasiojiweza.” Maneno ya Kigiriki yanaweza pia kueleweka kwa ufafanuzi zaidi kuwa yanaeleza makundi ya watu walioelemewa na wasioweza kujitunza.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: alipoyaona
  rationale: 'Kirai cha wakati kinawasilisha kitenzi-jina cha wakati uliopita kwa Kiswahili cha kawaida: Yesu aliwahurumia alipoyaona makundi hayo.'
- source_word: δὲ
  choice: Naye
  rationale: Hiki ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani.
- source_word: τοὺς ὄχλους
  choice: makundi ya watu
  rationale: Wingi wa ὄχλοι unaonyesha mikusanyiko ya watu; usemi huu ni wa kawaida na unaepuka neno lenye maana finyu ya kusanyiko rasmi.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: aliwahurumia
  rationale: Kitenzi hiki kinaonyesha huruma ya ndani na yenye nguvu. ‘Aliwahurumia’ ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Yesu kuwahurumia.
- source_word: ἦσαν ἐσκυλμένοι
  choice: walikuwa wamesumbuliwa
  rationale: Muundo huu unaonyesha hali iliyotokana na kusumbuliwa au kutendewa vibaya; tafsiri hii inadumisha wazo hilo bila kulifafanua kupita kiasi.
- source_word: καὶ ἐρριμμένοι
  choice: na kutupwa chini
  rationale: Tafsiri hii inadumisha taswira halisi ya ῥίπτω ya watu waliotupwa chini, badala ya kuibadili moja kwa moja kuwa hali ya kutojiweza.
- source_word: ὡσεὶ πρόβατα
  choice: kama kondoo
  rationale: Huu ni ulinganisho wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: μὴ ἔχοντα ποιμένα
  choice: wasio na mchungaji
  rationale: Usemi huu ni wa asili na unadumisha mfano wa kondoo walio hatarini kwa kukosa mchungaji.
theological_decisions:
- issue: Lugha ya huruma ya Yesu
  choice: aliwahurumia
  alternative: aliguswa na huruma kwa ajili yao
  rationale: Chaguo hili linawasilisha huruma kuu ya Yesu kwa lugha ya kawaida bila kufanya msemo wa Kigiriki kuwa mgumu au wa kale.
- issue: Hali ya makundi ya watu
  choice: wamesumbuliwa na kutupwa chini
  alternative: wamesumbuliwa na wasiojiweza
  rationale: Chaguo kuu linadumisha taswira ya vitenzi vya Kigiriki kwamba watu walikuwa wametendewa vibaya na kutupwa chini. Chaguo mbadala linaeleza zaidi matokeo ya hali hiyo, lakini linaacha sehemu ya taswira halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘makundi ya watu’ unadumisha wingi wa Kigiriki, huku ‘kutupwa chini’ ikihifadhi taswira yenye nguvu ya chanzo.
