  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: sw
  text: 'Kwa maana, lipi ni rahisi zaidi: kusema, ‘Dhambi zako zimesamehewa,’[a] au kusema, ‘Inuka utembee’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umesamehewa dhambi zako.” Wakati uliopo wa kauli tendwa katika Kigiriki unaweza kueleweka kuwa unaonyesha hali iliyotokana na tendo lililotimia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Kwa maana, lipi ni rahisi zaidi
  rationale: τί pamoja na kivumishi cha kulinganisha εὐκοπώτερον huuliza uchaguzi kati ya mambo mawili. ‘Lipi’ ni ya kawaida katika Kiswahili, na ‘kwa maana’ huhifadhi uhusiano wa maelezo unaoletwa na γάρ.
- source_word: εἰπεῖν
  choice: kusema
  rationale: Kitenzi hiki hapa kinamaanisha tendo la kawaida la kunena; ‘kusema’ kimetumiwa katika sehemu zote mbili kwa uwazi na ulinganifu.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Umesamehewa dhambi zako
  rationale: Ingawa αἱ ἁμαρτίαι ndiyo kiima cha kisarufi katika Kigiriki, Kiswahili cha kawaida na cha moja kwa moja humwelekeza anayesamehewa kwa muundo ‘umesamehewa dhambi zako.’ Muundo huu huhifadhi hali ya sasa ya msamaha bila kuifanya iwe tendo linaloendelea.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: ‘Dhambi’ ndilo neno sanifu la Kiswahili na hakuna sababu ya kupanua maana kwa sitiari ya madeni hapa.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Amri hii katika muktadha wa uponyaji humtaka mtu ainuke; ‘inuka’ ni ya kawaida, wazi na yenye heshima.
- source_word: καὶ περιπάτει
  choice: utembee
  rationale: Baada ya amri ‘inuka,’ Kiswahili kwa kawaida hutumia umbo tegemezi ‘utembee.’ Hili linaonyesha tendo linalofuata bila kulazimisha maana ya kutembea huku na huku.
- source_word: σου
  choice: zako / u-
  rationale: Nafsi ya pili umoja imehifadhiwa katika ‘dhambi zako’ na katika kitenzi ‘umesamehewa.’
theological_decisions:
- issue: Namna ya kutafsiri tangazo la Yesu kuhusu msamaha
  choice: Umesamehewa dhambi zako
  alternative: Dhambi zako zimesamehewa
  rationale: Chaguo kuu ni Kiswahili cha asili kinachohifadhi kauli tendwa na hali ya msamaha bila kuingiza hitimisho la ziada kuhusu wakati au utaratibu wake. Mbadala wa tanbihi hufuata kwa karibu zaidi kiima cha kisarufi cha Kigiriki na huhifadhi uwezekano wa kuelewa hali inayotokana na tendo lililotimia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa swali na ulinganifu wa ‘kusema ... au kusema’ umehifadhiwa; alama ya tanbihi imewekwa mara tu baada ya kauli inayohusika.
