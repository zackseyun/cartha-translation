  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: sw
  text: Lakini walipotoka, wakaeneza habari zake katika eneo lile lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nchi ile yote.” Neno la Kigiriki γῆ linaweza kumaanisha “nchi,” “ardhi,” au “eneo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na agizo la Yesu katika mstari uliotangulia kwamba wasimwambie mtu; “Lakini” linaonyesha vizuri mgeuko huo wa simulizi.
- source_word: ἐξελθόντες
  choice: walipotoka
  rationale: Kirai hiki cha wakati kinaonyesha tendo lililotangulia tendo kuu. “Walipotoka” ni Kiswahili cha kawaida kinachodumisha mfuatano huo bila kufanya sentensi kuwa nzito.
- source_word: διεφήμισαν
  choice: wakaeneza habari
  rationale: Kitenzi hiki humaanisha kutangaza au kueneza habari kwa upana. “Wakaeneza habari” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha sasa.
- source_word: αὐτὸν
  choice: kumhusu
  rationale: Ingawa Kigiriki kina kiwakilishi kama yambwa ya moja kwa moja, katika Kiswahili “habari kumhusu” huonyesha kwa kawaida kwamba yeye ndiye habari zilimhusu.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: katika eneo lile lote
  rationale: Katika muktadha huu γῆ linaelekea kumaanisha eneo au sehemu ya nchi ambako matukio hayo yalitokea. “Eneo lile lote” linaonyesha usambazaji mpana wa habari bila kuzidisha upeo wa kijiografia.
theological_decisions:
- issue: Upeo wa kijiografia wa γῆ
  choice: eneo
  alternative: nchi
  rationale: Simulizi linaeleza kuenea kwa habari katika sehemu iliyowazunguka, si lazima nchi nzima. “Eneo” linahifadhi maana hiyo ya mahali bila kufanya dai la upeo mkubwa zaidi; tanbihi inadumisha uwezekano wa tafsiri “nchi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walipotoka, wakaeneza” ni wa asili katika simulizi, huku “habari kumhusu” ukiepuka usemi usio wa kawaida wa kutafsiri yambwa ya Kigiriki neno kwa neno.
