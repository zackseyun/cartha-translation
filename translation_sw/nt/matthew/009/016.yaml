  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: sw
  text: Lakini hakuna mtu anayeweka kiraka cha kitambaa ambacho hakijasinyaa[a] kwenye vazi kuukuu, kwa maana kiraka hicho hujiondoa kwenye vazi, na mpasuko huwa mbaya zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitambaa ambacho hakijafuliwa.” Kigiriki hueleza kitambaa ambacho hakijafanyiwa usindikaji wa kufuliwa; kwa hiyo bado kinaweza kusinyaa na kujiondoa kwenye vazi kuukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Huwasilisha kwa kawaida katika Kiswahili kauli hasi ya jumla bila kuingiza jinsia.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti au mpito wa kiasi kutoka mfano uliotangulia.
- source_word: ἐπιβάλλει
  choice: anaweka
  rationale: Hufuata maana ya msingi ya kuweka au kubandika juu ya kitu; kushona kunaeleweka katika muktadha lakini hakutajwi wazi na kitenzi.
- source_word: ἐπίβλημα
  choice: kiraka
  rationale: Ni neno la kawaida na sahihi kwa kipande kinachowekwa kwenye vazi lililochanika.
- source_word: ῥάκους ἀγνάφου
  choice: cha kitambaa ambacho hakijafuliwa
  rationale: ἄγναφος hueleza kitambaa ambacho hakijakamilishwa kwa mchakato wa kufua/kukifanyia matayarisho, hivyo kinaweza kusinyaa na kulivuta vazi kuukuu. Tanbihi inaeleza maana hii.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: kwenye vazi kuukuu
  rationale: ἱμάτιον ni vazi kwa ujumla, na παλαιός hapa ni kuukuu, si tu lenye umri.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: hulivuta vazi na kujitenga nalo
  rationale: Katika muktadha, kiraka hulivuta vazi na kutengana nalo; usemi huu unaonyesha mvutano na utengano bila kuficha taswira.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: kiraka hicho
  rationale: Ingawa kihalisi ni kile kinachojaza au kufunika sehemu hiyo, muktadha unaonyesha kuwa rejeo ni kiraka.
- source_word: χεῖρον σχίσμα γίνεται
  choice: mpasuko huwa mbaya zaidi
  rationale: Huhifadhi ulinganisho χεῖρον na matokeo yanayoonyeshwa na γίνεται kwa Kiswahili cha kawaida.
