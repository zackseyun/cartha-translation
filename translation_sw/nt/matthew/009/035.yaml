id: MAT.9.35
reference: Matthew 9:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: sw
  text: Yesu alikuwa akizunguka katika miji yote na vijiji vyote, akifundisha katika masinagogi yao, akitangaza habari njema ya ufalme[a], na kuponya kila ugonjwa na kila udhaifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili ya ufalme.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kila ugonjwa na kila maradhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: alikuwa akizunguka
  rationale: Hali ya kitenzi cha wakati uliopita usiotimilika inaonyesha shughuli iliyoendelea au iliyorudiwa; usemi huu unaonyesha Yesu akisafiri sehemu mbalimbali.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: miji yote na vijiji vyote
  rationale: Inadumisha tofauti kati ya makazi makubwa na madogo, huku ikionyesha upana wa safari yake.
- source_word: διδάσκων
  choice: akifundisha
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja inayodumisha tendo linaloendelea sambamba na kutangaza na kuponya.
- source_word: συναγωγαῖς αὐτῶν
  choice: masinagogi yao
  rationale: Neno la kihistoria na kidini ‘masinagogi’ linadumishwa, na kiwakilishi ‘yao’ kinawakilisha αὐτῶν.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: Linaonyesha tendo la kutoa ujumbe hadharani bila kulifanya liwe istilahi ya dhehebu.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: habari njema za ufalme
  rationale: ‘Habari njema’ linaeleza maana ya εὐαγγέλιον kwa lugha inayoeleweka, na ‘za ufalme’ linadumisha uhusiano wa maneno ya Kigiriki bila kuufafanua kupita kiasi.
- source_word: θεραπεύων
  choice: kuponya
  rationale: Ni neno la kawaida na linalofaa kwa matendo ya Yesu ya kuondoa magonjwa katika muktadha huu.
- source_word: πᾶσαν νόσον
  choice: kila ugonjwa
  rationale: Linadumisha msisitizo wa πᾶσαν na maana ya kawaida ya νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: kila udhaifu
  rationale: μαλακία linaweza kumaanisha udhaifu, maradhi, au hali ya kutokuwa na nguvu; ‘udhaifu’ linadumisha tofauti fulani na νόσος bila kubana maana.
theological_decisions:
- issue: Tafsiri ya εὐαγγέλιον
  choice: habari njema
  alternative: injili
  rationale: ‘Habari njema’ linaweka wazi maana ya neno la Kigiriki kwa msomaji wa sasa, huku ‘injili’ likibaki badala halali ya kimapokeo.
- issue: Upeo wa πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: kila ugonjwa na kila udhaifu
  alternative: kila ugonjwa na kila maradhi
  rationale: Kurudia ‘kila’ kunadumisha msisitizo mpana wa maandishi ya Kigiriki. ‘Udhaifu’ pia huhifadhi uwezekano wa μαλακία kumaanisha hali ya kutokuwa na nguvu, si ugonjwa pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘alikuwa akizunguka’ unaonyesha tendo lililoendelea, na vitenzi vinavyofuata vinaonyesha shughuli tatu sambamba: kufundisha, kutangaza, na kuponya.'
