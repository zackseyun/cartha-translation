  text: Naye akainuka, akaenda nyumbani kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaondoka kwenda nyumbani kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa urahisi, huku kiwakilishi cha nafsi kikiwekwa wazi kwa Kiswahili cha kawaida.
- source_word: ἐγερθεὶς
  choice: akaondoka
  rationale: Katika muktadha wa mtu aliyekuwa amelala kitandani, kitenzi hiki kina maana ya kuinuka; ‘akaondoka’ ni cha asili katika mtiririko wa Kiswahili na kinaunganisha kuinuka kwake na hatua iliyofuata.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Kitenzi kinaonyesha kuondoka mahali alipokuwa na kwenda kwingine. ‘Akaenda’ ni cha kawaida na wazi, huku maana ya kuondoka ikisaidiwa na muktadha na kitenzi kilichotangulia.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nyumbani kwake
  rationale: Kirai hiki kinaonyesha mwendo kuelekea makao yake mwenyewe. ‘Nyumbani kwake’ ni Kiswahili cha kawaida na chenye hadhi, na kinawasilisha maana ya dwelling bila kudai kwamba ni jengo alilomiliki.
theological_decisions: []
