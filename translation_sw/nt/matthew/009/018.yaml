id: MAT.9.18
reference: Matthew 9:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: sw
  text: Alipokuwa akisema mambo haya kwao, tazama, kiongozi mmoja akaja, akamsujudia na kusema, “Binti yangu amekufa sasa hivi. Lakini njoo, uweke mkono wako juu yake, naye ataishi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Kihisishi hiki huvuta usikivu wa msomaji kwa tukio la ghafla; “tazama” ni tafsiri fupi, yenye hadhi na iliyozoeleka katika simulizi la Biblia.
- source_word: ἄρχων
  choice: kiongozi
  rationale: Neno la Kigiriki lina maana pana ya mtu mwenye mamlaka au cheo; “kiongozi” huhifadhi upana huo bila kuingiza cheo maalumu kisichotajwa na Mathayo.
- source_word: προσεκύνει
  choice: akamsujudia
  rationale: Hueleza tendo la kuinama au kujilaza mbele ya mwingine kwa heshima kuu; “akamsujudia” huhifadhi tendo hilo bila kuamua kimya kimya kiwango cha maana yake ya kiibada.
- source_word: ἄρτι ἐτελεύτησεν
  choice: amekufa sasa hivi
  rationale: Huonyesha kwamba kifo kimetokea muda mfupi uliopita; usemi huu ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ζήσεται
  choice: ataishi
  rationale: Wakati ujao wa kitenzi “kuishi” umetafsiriwa moja kwa moja, ukihifadhi uhakika ulio katika kauli ya baba.
theological_decisions:
- issue: Maana ya προσκυνέω katika tendo la kiongozi
  choice: akamsujudia
  alternative: akamwabudu
  rationale: Katika muktadha huu neno linaweza kueleza heshima kuu kwa kuinama bila kulazimisha hitimisho kwamba tendo hilo limefafanuliwa wazi kuwa ibada. Tafsiri iliyochaguliwa huhifadhi mvutano huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umewekwa wa asili bila kuwa mgumu: kauli ya utangulizi, kishawishi “tazama,” kisha ombi la kiongozi.'
