  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: sw
  text: Macho yao yakafumbuka. Yesu akawaonya kwa ukali[a], akisema, “Msiruhusu mtu yeyote ajue[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaagiza kwa ukali” au “akawakanya vikali.” Kitenzi cha Kigiriki kinaonyesha hisia nzito na nguvu katika onyo hilo.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “Angalieni, mtu yeyote asijue.” Kitu ambacho hakipaswi kujulikana hakitajwi wazi katika Kigiriki; kinaeleweka kutokana na muktadha wa uponyaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: yakafumbuka
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali ya kutendwa, msemo wa kawaida wa Kiswahili kuhusu kipofu kuanza kuona ni ‘macho yakafumbuka.’ Hii inaeleza kurejeshwa kwa uwezo wa kuona bila kuongeza wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: οἱ ὀφθαλμοί
  choice: Macho yao
  rationale: Hili linafuata maana ya Kigiriki kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: ἐνεβριμήθη
  choice: akawaonya kwa ukali
  rationale: Kitenzi hiki huonyesha hisia nzito na onyo au agizo lenye nguvu. ‘Akawaonya kwa ukali’ huhifadhi uzito huo bila kudokeza sababu ya Yesu kutoa agizo hilo.
- source_word: λέγων
  choice: akisema
  rationale: Umbile hili linaunganisha onyo moja kwa moja na maneno yanayofuata, kama ilivyo katika Kigiriki.
- source_word: Ὁρᾶτε μηδεὶς γινωσκέτω
  choice: Msiruhusu mtu yeyote ajue
  rationale: 'Amri ya wingi Ὁρᾶτε pamoja na katazo la nafsi ya tatu inatoa tahadhari yenye nguvu: wahakikishe kwamba hakuna mtu anayepata kujua. Kiswahili hiki ni cha kawaida na huhifadhi katazo bila kutaja wazi kitu kinachopaswa kujulikana.'
theological_decisions:
- issue: Nguvu na kusudi la agizo la Yesu baada ya uponyaji
  choice: Yesu anatoa onyo kali lisilowaruhusu watu wengine wajue, bila kueleza sababu yake.
  alternative: Yesu aliwakemea; au Yesu aliwaamuru kwa ukali.
  rationale: Kifungu kinaonyesha wazi nguvu ya agizo, lakini hakielezi nia ya Yesu. Tafsiri haiongezi maelezo ya kiteolojia kuhusu sababu ya kutaka jambo hilo lisijulikane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Yakafumbuka’ ni msemo wa kawaida kuhusu kuanza kuona, na ‘Msiruhusu mtu yeyote ajue’ huwasilisha kwa uwazi amri iliyoelekezwa kwa watu wengi huku ukiacha kitu kinachojulikana kuwa cha kudokezwa kama katika chanzo.
