  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: sw
  text: Kwa hiyo, mwombeni kwa bidii Bwana wa mavuno awapeleke wafanyakazi katika mavuno yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awasukume wafanyakazi waende”; kitenzi cha Kigiriki kina nguvu kuliko kusema tu “awapeleke,” ingawa hapa kinamaanisha kuwapeleka wafanyakazi katika mavuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: mwombeni kwa bidii
  rationale: Kitenzi hiki ni agizo la kuomba kwa dhati na kwa hisia ya uhitaji. ‘Mwombeni kwa bidii’ ni Kiswahili cha kawaida kinachohifadhi wazo la dua yenye uzito kuliko ‘ombeni’ peke yake.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu mavuno mengi na wafanyakazi wachache.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi maana ya mamlaka ya mwenye mavuno pamoja na matumizi yake ya kawaida katika lugha ya Biblia, bila kumtambulisha kwa namna finyu zaidi ya maandishi.
- source_word: θερισμοῦ
  choice: mavuno
  rationale: Ni maana ya kawaida ya neno hili na inadumisha sitiari ya kukusanya mavuno badala ya kuifafanua kwa maneno mengine.
- source_word: ὅπως
  choice: a-
  rationale: Katika muundo wa Kiswahili, kiima cha ombi kinafuatwa kwa kawaida na kitenzi cha hali tegemezi, ‘awapeleke,’ ambacho huwasilisha yaliyomo au kusudi la ombi.
- source_word: ἐκβάλῃ
  choice: awapeleke
  rationale: Katika muktadha huu neno linamaanisha kuwapeleka wafanyakazi kwenye mavuno. Tafsiri hii ni ya kawaida kwa Kiswahili, huku kidokezo kikihifadhi nguvu ya kitenzi cha Kigiriki.
- source_word: ἐργάτας
  choice: wafanyakazi
  rationale: Ni neno wazi na la sasa kwa watu wanaofanya kazi ya mavuno.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: katika mavuno yake
  rationale: Huhifadhi sitiari na umilikaji wa mavuno. ‘Katika’ hutoa kwa kawaida wazo la kuingia na kushiriki katika kazi hiyo bila kuongeza ‘shamba,’ ambalo halitajwi wazi katika Kigiriki.
theological_decisions:
- issue: Utambulisho wa ‘Bwana wa mavuno’
  choice: Bwana wa mavuno
  alternative: Baba hasa; Yesu hasa
  rationale: Aya yenyewe haitaji wazi anayerejelewa zaidi ya cheo hiki. Tafsiri inaacha utambulisho huo wazi na hivyo haiingizi hitimisho finyu la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘mwombeni ... awapeleke’ ni wa asili katika Kiswahili; sitiari ya mavuno imehifadhiwa.
