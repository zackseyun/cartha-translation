base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: sw
  text: Alikuwa akisema, “Ondokeni, kwa maana msichana hajafa, bali amelala.” Nao walikuwa wakimcheka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakimdhihaki.” Kitenzi cha Kigiriki kinaweza kumaanisha kumcheka mtu kwa dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Alikuwa akiwaambia
  rationale: Kauli ya wakati usiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa; Kiswahili hiki kinahifadhi hali hiyo na pia huonyesha kwamba alikuwa akiuambia umati.
- source_word: Ἀναχωρεῖτε
  choice: Ondokeni
  rationale: Amri ya wingi inawataka waliokuwapo waondoke; “Ondokeni” ni ya kawaida, wazi, na yenye nguvu inayofaa.
- source_word: οὐ γὰρ
  choice: kwa maana ... haja-
  rationale: γάρ inatoa sababu ya amri; “kwa maana” huunganisha hoja hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀπέθανεν
  choice: hajafa
  rationale: Kauli ya aoristi inataja tukio la kufa; “hajafa” ni usemi wa asili unaolingana vizuri na hali ya sasa ya “amelala.”
- source_word: τὸ κοράσιον
  choice: msichana
  rationale: κοράσιον humaanisha mtoto au kijana wa kike; “msichana” ni tafsiri ya kawaida bila kuongeza msisitizo wa udogo usio lazima katika mstari huu.
- source_word: ἀλλὰ καθεύδει
  choice: bali amelala
  rationale: “Bali” huhifadhi utofautishaji wenye nguvu wa ἀλλά, na “amelala” hudumisha taswira halisi bila kuifafanua kimafundisho.
- source_word: κατεγέλων αὐτοῦ
  choice: wakamcheka
  rationale: Kitenzi kina maana ya kumcheka mtu kwa dhihaka. “Wakamcheka” huhifadhi picha ya kicheko, huku tanbihi ikifafanua maana ya dhihaka; muundo wa simulizi wa Kiswahili ni wa asili katika muktadha huu.
theological_decisions:
- issue: Kauli ya Yesu kwamba msichana hajafa bali amelala
  choice: Kudumisha neno la moja kwa moja “amelala” bila ufafanuzi ndani ya matini
  alternative: Kutafsiri “amelala tu” au kueleza wazi kwamba usingizi ni sitiari ya kifo
  rationale: Chanzo kinaacha kauli hiyo ikiwa na mvutano wa kimsimulizi na kitheolojia. Kuacha “amelala” kunahifadhi uwezekano wa lugha ya sitiari, mtazamo wa Yesu kuhusu hali ya msichana, au kauli inayotazamia kufufuliwa, bila kulazimisha uamuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi; tanbihi hudumisha maana ya dhihaka iliyo katika kitenzi cha Kigiriki.
