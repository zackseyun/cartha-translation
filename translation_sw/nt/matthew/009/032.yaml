base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: sw
  text: Walipokuwa wakitoka, tazama, wakamletea mtu bubu[a] aliyepagawa na pepo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiziwi.” Neno la Kigiriki linaweza kumaanisha “bubu” au “kiziwi” kulingana na muktadha. Hapa, taarifa ya mstari unaofuata kwamba mtu huyo alinena inaunga mkono “bubu.”
    reason: lexical_alternative
  - marker: b
    text: Au “aliyekuwa chini ya nguvu za pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Walipokuwa wakitoka
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea wakati tukio jingine lilipotokea; δέ hapa ni kiunganishi cha mpito wa simulizi na si lazima kitafsiriwe kwa neno tofauti.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linadumisha mwito wa msimulizi wa kuelekeza fikira kwenye tukio jipya kwa lugha ya heshima inayofahamika katika simulizi la Biblia.
- source_word: προσήνεγκαν αὐτῷ
  choice: wakamletea
  rationale: Kitenzi cha Kiswahili chenye kiambishi cha mtendewa kinaonyesha kwa ufupi na kwa kawaida kwamba walimleta mtu huyo kwa Yesu.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ‘Mtu’ ni tafsiri ya kawaida ya ἄνθρωπος hapa; jinsia ya mtu huyo haijaonyeshwa kisarufi katika Kiswahili bila kuongeza neno lisilohitajika.
- source_word: κωφὸν
  choice: bubu
  rationale: Ingawa κωφός inaweza kumaanisha kiziwi au bubu kulingana na muktadha, mstari unaofuata unasema kwamba mtu huyo alinena, hivyo ‘bubu’ inafaa zaidi hapa.
- source_word: δαιμονιζόμενον
  choice: aliyepagawa na pepo
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaoeleza hali inayotajwa na δαιμονίζομαι bila kuongeza maelezo kuhusu namna au kiwango cha nguvu ya pepo.
theological_decisions:
- issue: Jinsi ya kutafsiri hali ya kuathiriwa na pepo
  choice: aliyepagawa na pepo
  alternative: aliyekuwa chini ya nguvu za pepo
  rationale: Simulizi linataja wazi hali inayohusishwa na pepo, lakini halifafanui kwa undani namna hali hiyo ilivyofanya kazi. Tafsiri iliyochaguliwa inadumisha dai hilo bila kulipanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tazama’ limetumiwa kuhifadhi msisitizo wa kisimulizi wa ἰδού, huku ‘wakamletea’ likiweka mtiririko wa sentensi kuwa wa kawaida na wazi.
