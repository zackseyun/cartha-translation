  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: sw
  text: Kwa maana alikuwa akisema moyoni mwake, “Nikigusa tu vazi lake, nitaokolewa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaponywa” au “nitakuwa mzima.” Kigiriki kinasema “nitaokolewa,” kikitumia kitenzi ambacho katika muktadha huu kinaweza pia kumaanisha kuponywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi wa ndani uliokuwa ukiendelea au kurudiwa; muundo huu wa Kiswahili huhifadhi hali hiyo kwa kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au ufafanuzi wa simulizi linalotangulia.
- source_word: ἐν ἑαυτῇ
  choice: moyoni mwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba alikuwa akijisemea au kufikiri kimoyomoyo, bila kudai kwamba alisema kwa sauti.
- source_word: Ἐὰν μόνον
  choice: Nikigusa tu
  rationale: Muundo wa masharti pamoja na “tu” unaonyesha kwamba kugusa pekee kulionekana kuwa sharti la kutosha.
- source_word: ἅψωμαι
  choice: Nikigusa
  rationale: Kitenzi kinamaanisha kugusa katika muktadha huu, si lazima kushika; umbo la masharti la Kiswahili linaonyesha jambo linalotarajiwa baadaye kwa kawaida.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: vazi lake
  rationale: ἱμάτιον ni vazi, hasa vazi la nje; “vazi” huepuka kulibainisha zaidi ya ushahidi wa maandishi.
- source_word: σωθήσομαι
  choice: nitaokolewa
  rationale: σῴζω inaweza kumaanisha kuokoa na, katika muktadha wa ugonjwa, kuponya au kufanya mtu awe mzima. Tafsiri kuu huhifadhi upana wa kitenzi cha Kigiriki, huku tanbihi ikifafanua maana ya kimuktadha.
theological_decisions:
- issue: Tafsiri ya σωθήσομαι katika muktadha wa uponyaji
  choice: nitaokolewa
  alternative: nitaponywa / nitakuwa mzima
  rationale: Muktadha unahusu kuponywa kwa mwili, lakini Kigiriki kimetumia kitenzi chenye maana pana ya kuokoa. Kuhifadhi “nitaokolewa” katika maandishi makuu hudumisha upana na mvutano wa kileksika bila kulazimisha maana moja; tanbihi inaonyesha maana ya uponyaji katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Moyoni mwake” ni usemi wa kawaida wa mawazo ya ndani; “vazi” ni neno wazi lisilobainisha aina ya vazi kupita kiasi.
