  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: sw
  text: Baada ya kuingia katika mashua, alivuka na akafika katika mji wake mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji wake wa nyumbani.” Kigiriki kinasema “mji wake mwenyewe”; huenda ikimaanisha mji uliohusishwa naye katika hatua hii ya simulizi, yaelekea Kapernaumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: baada ya kuingia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kwamba kuingia mashuani kulitokea kabla ya kuvuka; muundo huu ni wa kawaida katika Kiswahili na unadumisha mfuatano huo.
- source_word: πλοῖον
  choice: mashuani
  rationale: Neno hili kwa ujumla humaanisha chombo cha majini; katika mazingira ya Bahari ya Galilaya, “mashua” linafaa zaidi kuliko “meli.” Hali ya mahali “mashuani” inaendana kwa kawaida na kitenzi “kuingia.”
- source_word: διεπέρασεν
  choice: alivuka
  rationale: διαπεράω humaanisha kuvuka kutoka upande mmoja hadi mwingine, hasa kwa kupitia maji; “alivuka” linatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἦλθεν
  choice: kufika
  rationale: Ingawa ἔρχομαι kwa msingi inaweza kuwa “kuja” au “kwenda,” katika mfuatano huu “kufika” huonyesha kwa kawaida kuwasili kwake katika mji bila kubadili maana ya simulizi.
- source_word: ἰδίαν πόλιν
  choice: mji wake mwenyewe
  rationale: Tafsiri hii inadumisha wazo la umiliki au uhusiano lililo katika ἴδιος bila kuamua kwamba lazima ulikuwa mji alikozaliwa.
- source_word: Καὶ ... καὶ
  choice: Baada ya ... na
  rationale: Kiunganishi cha mwanzo kimewasilishwa kwa muundo wa wakati unaofaa kwa Kiswahili, huku “na” likidumisha uhusiano wa matendo yanayofuatana.
theological_decisions:
- issue: Mji unaorejelewa na “mji wake mwenyewe”
  choice: Jina la mji halikutajwa katika matini kuu.
  alternative: Kutaja Kapernaumu au kueleza moja kwa moja kuwa ni mji wake wa nyumbani.
  rationale: Kigiriki hakitaji jina la mji. Muktadha huenda unaelekeza kwa Kapernaumu, lakini tafsiri inadumisha kutotajwa huko badala ya kuingiza utambulisho usio wazi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baada ya kuingia mashuani” ni cha asili zaidi kuliko muundo mgumu wa kishirikishi, na “mji wake mwenyewe” hudumisha msisitizo na utata wa Kigiriki.
