  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: sw
  text: Lakini nendeni mkajifunze maana ya jambo hili:[a] ‘Ninataka rehema, wala si dhabihu.’[b] Kwa maana sikuja kuwaita wenye haki,[c] bali wenye dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na maneno yenyewe: “Nendeni mkajifunze hii ina maana gani.”'
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yamenukuliwa kutoka Hosea 6:6.
    reason: cross_reference
  - marker: c
    text: Inawezekana pia kuwa maana ni “wale wanaojiona kuwa wenye haki”; Kigiriki kinasema tu “wenye haki.”
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: nendeni
  rationale: Kirai hiki cha wakati uliopita kinatumika pamoja na amri inayofuata; “nendeni mkajifunze” kinaonyesha nguvu ya amri hiyo kwa Kiswahili cha kawaida bila kutafsiri kwa ugumu kuwa “baada ya kwenda.”
- source_word: μάθετε
  choice: mkajifunze
  rationale: Kitenzi hiki ni amri ya kutaka wasikilizaji wapate fundisho na kuelewa; “mkajifunze” kinahifadhi sauti ya kukemea na kuagiza.
- source_word: τί ἐστιν
  choice: maana ya jambo hili
  rationale: Hiki ni kirai kinachotanguliza ufafanuzi wa maana ya nukuu. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi namna ya karibu zaidi na maneno ya Kigiriki.
- source_word: Ἔλεος
  choice: rehema
  rationale: “Rehema” ni neno la kawaida na lenye hadhi linalohifadhi maana ya huruma pamoja na mwangwi wa uaminifu wa agano katika nukuu ya Hosea.
- source_word: θέλω
  choice: Ninataka
  rationale: “Ninataka” linaonyesha wazi mapenzi ya msemaji bila kudhoofisha ukinzani wa kinabii; linafaa pia katika nukuu ya Maandiko.
- source_word: θυσίαν
  choice: dhabihu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka inayotolewa kwa ibada, na umoja wa chanzo umehifadhiwa.
- source_word: ἦλθον
  choice: sikuja
  rationale: Wakati uliopita unaeleza kusudi la kuja kwa Yesu kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: καλέσαι
  choice: kuwaita
  rationale: “Kuwaita” huhifadhi upana wa maana ya mwito, ambao unaweza kuwa mwaliko au agizo, bila kuufafanua kupita maandishi.
- source_word: δικαίους
  choice: wenye haki
  rationale: Kivumishi kilichotumiwa kama nomino kimetafsiriwa kama kundi la watu, bila kuongeza kwamba ni watu wanaojiona wenye haki.
- source_word: ἁμαρτωλούς
  choice: wenye dhambi
  rationale: Tafsiri hii ni ya moja kwa moja na inaendeleza ukinzani mkali kati ya wenye haki na wenye dhambi bila maelezo ya ziada.
theological_decisions:
- issue: Nguvu ya nukuu ya Hosea 6:6
  choice: “Ninataka rehema, wala si dhabihu”
  alternative: Kutafsiri kwa namna inayodai kwamba Mungu anakataa dhabihu zote, au kwa namna inayopunguza kauli kuwa mapendeleo ya hali hii pekee
  rationale: Maneno hayo yanaweka rehema na dhabihu katika ukinzani wa kinabii. Tafsiri inahifadhi mvutano huo bila kuamua kwamba kila dhabihu imebatilishwa au kwamba kauli haina maana pana.
- issue: Wanaorejelewa na “wenye haki”
  choice: Kuhifadhi “wenye haki” bila ufafanuzi katika matini kuu
  alternative: “Wanaojiona kuwa wenye haki” au “wenye kujihesabia haki”
  rationale: Muktadha unaweza kuruhusu maana ya kinaya, lakini Kigiriki hakisemi wazi kwamba ni watu wanaojiona wenye haki. Kwa hiyo utata wa kweli umehifadhiwa, na uwezekano huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “nendeni mkajifunze” ni wa asili na huhifadhi amri ya Kigiriki. Maneno ya kidini yaliyozoeleka, “rehema” na “dhabihu,” yametumiwa bila kufafanua zaidi ya chanzo.
