id: MAT.9.2
reference: Matthew 9:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: sw
  text: Na tazama, walikuwa wakimletea mtu aliyepooza, akiwa amelala kitandani. Yesu alipoiona imani yao[a], akamwambia yule aliyepooza, “Jipe moyo, mwanangu; dhambi zako zimesamehewa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “imani yao.” Wingi huo unaweza kuwahusu yule aliyepooza pamoja na wale waliomleta, au wale waliomleta kama kundi.'
    reason: alternative_reading
  - marker: b
    text: Au “dhambi zako zinasamehewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi nguvu ya kiashiria cha simulizi kinachoelekeza usikivu, kwa Kiswahili cha sasa na chenye hadhi.
- source_word: προσέφερον
  choice: wakamletea
  rationale: Katika mfuatano huu wa kisimulizi, wakati usiotimilifu wa Kigiriki unaweza kutafsiriwa kwa tendo lililosogeza simulizi mbele; ‘wakamletea’ ni ya kawaida na haiingizi namna mahususi ya kumbeba.
- source_word: παραλυτικὸν
  choice: mtu aliyepooza
  rationale: Ni tafsiri ya kawaida na wazi kwa msomaji wa sasa; ‘mtu’ haibainishi jinsia, ambayo kivumishi cha Kigiriki chenyewe hakitaji wazi.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: akiwa amelala kitandani
  rationale: Inaeleza hali na nafasi ya mtu huyo kwa lugha asilia bila kulazimisha maana ya ‘mkeka’ ambayo κλίνη haihitaji hapa.
- source_word: πίστιν
  choice: imani
  rationale: Ni ulinganifu wa kawaida wa πίστις na hapa unadokeza tumaini lililodhihirishwa kwa tendo.
- source_word: Θάρσει
  choice: Jipe moyo
  rationale: Ni amri ya kutia moyo iliyo ya kawaida katika Kiswahili cha Afrika Mashariki na inahifadhi maana ya faraja na ujasiri.
- source_word: τέκνον
  choice: mwanangu
  rationale: Katika usemi wa moja kwa moja, ‘mwanangu’ huwasilisha kwa kawaida wito wa upendo wa τέκνον bila kuhitaji kumtaja kwa lugha ngumu kama ‘mtoto.’
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: dhambi zako zimesamehewa
  rationale: Kauli tendwa inadumisha mtendaji asiyeelezwa. Kiswahili cha wakati timilifu hutoa tangazo la sasa kuhusu hali ya kusamehewa bila kutaja mtendaji.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: Ni tafsiri sanifu inayohifadhi wingi wa makosa bila ufafanuzi wa ziada.
theological_decisions:
- issue: Maana ya τὴν πίστιν αὐτῶν
  choice: Kudumisha ‘imani yao’ bila kuamua wazi kama aliyepooza alihesabiwa miongoni mwao.
  alternative: Kuitaja kuwa imani ya waliombeba peke yao, au imani ya aliyepooza peke yake.
  rationale: Kiwakilishi cha wingi kinarejelea zaidi ya mtu mmoja, lakini maandishi hayalazimishi kumjumuisha wala kumwondoa aliyepooza.
- issue: Nguvu ya tangazo la msamaha
  choice: ‘Dhambi zako zimesamehewa,’ katika kauli tendwa isiyomtaja mtendaji.
  alternative: Kutafsiri kwa namna inayosisitiza moja kwa moja tendo la papo hapo la Mungu au mamlaka ya Yesu.
  rationale: Kauli tendwa ya Kigiriki inaacha mtendaji bila kutajwa huku ikitangaza msamaha; tafsiri inadumisha mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. ‘Tazama’ huhifadhi mtindo hai wa Mathayo; ‘Jipe moyo’ ni faraja ya kawaida; kauli tendwa inadumisha utata halisi kuhusu mtendaji wa msamaha.
