  source_fidelity: The draft accurately renders Jesus' rising and following the ruler, and correctly identifies the ruler as the referent of the object marker in “akamfuata.” The final coordinated clause, however, leaves the verbal action unexpressed in a way that is less complete and less idiomatic in this Swahili narrative context.
  naturalness: “Yesu akasimama, akamfuata” is natural Standard East African Swahili. “Na wanafunzi wake pia” is intelligible, but it sounds fragmentary after the preceding finite verbs. Repeating the verb gives a smooth, clear coordinated narrative clause.
