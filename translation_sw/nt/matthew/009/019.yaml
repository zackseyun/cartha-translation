  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: sw
  text: Yesu akasimama, akamfuata, na wanafunzi wake wakamfuata pia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: akasimama
  rationale: Kirai hiki cha wakati uliopita kinatanguliza tendo linalofuata. “Akasimama” ni Kiswahili cha kawaida na chenye heshima kinachoonyesha Yesu kuinuka kutoka mahali alipokuwa kabla ya kuondoka.
- source_word: ἠκολούθει
  choice: akamfuata
  rationale: Kitenzi hiki kina hali ya tendo lililoendelea, lakini katika simulizi la Kiswahili mfululizo wa “akasimama, akamfuata” huwasilisha tukio hilo kwa kawaida. Pia kinadumisha maana ya kwenda nyuma au pamoja na mtu anayeelekeza njia.
- source_word: αὐτῷ
  choice: -m- katika “akamfuata”
  rationale: Kiwakilishi cha Kigiriki kinamrejelea kiongozi aliyetajwa katika mstari uliotangulia. Katika Kiswahili huingizwa kwa kawaida kama kiambishi cha yambwa ndani ya kitenzi.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: “Wanafunzi” ndilo neno la kawaida la Kibiblia kwa μαθηταί na linahifadhi uhusiano wa mwalimu na wale wanaojifunza kwake na kumfuata.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: na wanafunzi wake pia
  rationale: Kigiriki hakirudii kitenzi baada ya kiunganishi. Kiswahili kinaweza kuhifadhi udondoshaji huo kwa kawaida kwa “pia,” huku “wake” ikimrejelea Yesu.
