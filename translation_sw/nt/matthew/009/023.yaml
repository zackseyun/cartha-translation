  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: sw
  text: Yesu alipofika katika nyumba ya yule mkuu[a], aliwaona wapiga zumari[b] na umati uliokuwa ukifanya kelele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “afisa”; kwa kulinganisha na masimulizi sambamba, huenda alikuwa “mkuu wa sinagogi.” Hapa Mathayo anasema tu “mkuu.”
    reason: alternative_reading
  - marker: b
    text: Yaani, waombolezaji wa kulipwa walikuwa tayari wamefika, wakiwemo wapiga zumari waliokuwa sehemu ya desturi za mazishi.
    reason: cultural_note
  - marker: c
    text: Au “katika ghasia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: alipofika
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha mfuatano wa wakati; “alipofika” ni Kiswahili cha kawaida na kinaendeleza maana ya “baada/wakati wa kufika.”
- source_word: οἰκίαν
  choice: nyumba
  rationale: Hii ndiyo maana ya moja kwa moja katika mazingira haya ya simulizi bila kuongeza wazo la kihisia la makazi ya kifamilia.
- source_word: ἄρχοντος
  choice: mkuu
  rationale: Neno hili linaendeleza upana wa ἄρχων, yaani mtu mwenye mamlaka au cheo, bila kulifanya mahsusi kuwa “mkuu wa sinagogi” kutokana na masimulizi sambamba.
- source_word: ἰδὼν
  choice: aliwaona
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa kitendo cha kuona katika simulizi.
- source_word: αὐλητὰς
  choice: wapiga filimbi
  rationale: Humaanisha watu waliopiga filimbi au zumari; “wapiga filimbi” inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ὄχλον
  choice: umati
  rationale: Ni tafsiri ya kawaida ya ὄχλος na inafaa kwa kundi kubwa la watu katika simulizi.
- source_word: θορυβούμενον
  choice: ukifanya kelele nyingi
  rationale: Kitenzi hiki kinaonyesha hali ya makelele na msukosuko. Usemi huu ni wa asili katika Kiswahili na haubainishi zaidi ya maandishi kuhusu hisia zao.
theological_decisions:
- issue: Utambulisho wa mwenye nyumba
  choice: mkuu
  alternative: afisa; mkuu wa sinagogi
  rationale: Mathayo ametumia tu ἄρχων, neno lenye maana pana ya mtu mwenye mamlaka. Tafsiri haiongezi utambulisho mahsusi unaotokana na masimulizi sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Mkuu” limechaguliwa badala ya neno mahsusi zaidi ili kuhifadhi upana wa maandishi ya Kigiriki; maelezo ya utamaduni wa maombolezo yamewekwa katika tanbihi badala ya kuongezwa katika mstari.
