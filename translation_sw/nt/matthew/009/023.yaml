  source_fidelity: 'Tafsiri inafuata vizuri muundo na maana ya Kigiriki: Yesu anaingia nyumbani kwa ἄρχων, anaona wapiga vyombo na umati wenye makelele. “Mkuu” huhifadhi utambulisho mpana wa ἄρχων bila kuingiza ‘mkuu wa sinagogi’ katika maandishi. Marekebisho yanahitajika kwa αὐλητάς, ambayo hurejelea wapiga filimbi/pipe; katika Kiswahili sanifu ‘zumari’ ni sahihi zaidi kuliko ‘filimbi,’ ambalo kwa kawaida humaanisha mluzi/whistle.'
  naturalness: Sentensi ni ya asili na yenye mtiririko mzuri. “Umati ukifanya kelele nyingi” inaeleweka, lakini “umati uliokuwa ukifanya kelele” huonyesha kwa uwazi zaidi hali endelevu ya kishirikishi θορυβούμενον. Tanbihi c ya rasimu haikuwa usemi kamili wa kawaida; imerekebishwa.
  terminology: “Mkuu” ni chaguo linalofaa kwa ἄρχων katika muktadha huu. “Wapiga zumari” ni istilahi iliyo wazi na inayolingana vizuri na αὐλητάς. Tanbihi ya kitamaduni imehifadhiwa bila kuifanya tafsiri kuu ieleze zaidi ya maandishi.
