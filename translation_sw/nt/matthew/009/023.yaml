    rationale: Katika Kiswahili sanifu, ‘filimbi’ kwa kawaida ni mluzi/whistle; αὐλητάς ni wapiga aulos, yaani chombo cha aina ya filimbi au zumari. ‘Wapiga zumari’ huepuka taswira isiyo sahihi ya watu wanaopuliza mluzi.
  - severity: low
    issue: 'Tanbihi c: “ukiwa katika vurugu”'
    rationale: Kifungu hiki hakitoi mbadala kamili wa kawaida kwa hali ya umati. ‘Katika ghasia’ ni mbadala mfupi na wa kawaida wa ‘wakifanya kelele.’
  - severity: low
    issue: Uwakilishi wa θορυβούμενον
    rationale: ‘Umati uliokuwa ukifanya kelele’ hudumisha hali inayoendelea ya kishirikishi cha sasa kwa uwazi zaidi kuliko ‘umati ukifanya kelele nyingi.’
