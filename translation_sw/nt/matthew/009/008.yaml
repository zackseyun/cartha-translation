  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: sw
  text: Lakini makundi ya watu yalipoyaona hayo, yaliogopa[a] na kumtukuza Mungu, aliyewapa wanadamu[b] mamlaka ya namna hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yalijawa na hofu yenye mshangao.” Kitenzi cha Kigiriki humaanisha hasa “kuogopa,” lakini hapa hofu hiyo inaweza kuhusisha mshangao wenye heshima.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu.” Kigiriki kina neno linaloweza kumaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: yalipoyaona hayo
  rationale: Kirai tegemezi cha wakati kinaifanya kauli ya Kigiriki iwe ya kawaida katika Kiswahili. “Hayo” linaonyesha tukio lililotangulia bila kulifafanua kupita kiasi.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha mpito wenye tofauti kati ya tendo lililotangulia na mwitikio wa makundi ya watu.
- source_word: οἱ ὄχλοι
  choice: makundi ya watu
  rationale: Huhifadhi wingi wa οἱ ὄχλοι kwa Kiswahili cha sasa na cha kawaida kuliko kutumia nomino ya umoja.
- source_word: ἐφοβήθησαν
  choice: yaliogopa
  rationale: Huhifadhi maana ya msingi ya φοβέομαι, yaani kuogopa, bila kuibadili kimafasiri kuwa mshangao wa heshima pekee.
- source_word: ἐδόξασαν
  choice: kumtukuza
  rationale: “Kumtukuza” huhifadhi uzito wa kiteolojia wa δοξάζω na ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya kitenzi “kumtukuza” na tafsiri yake ya kawaida ni “Mungu.”
- source_word: τὸν δόντα
  choice: aliyewapa
  rationale: Kauli ya uhusiano inatafsiri kwa kawaida kiambishi cha Kigiriki chenye kibainishi na inaonyesha kwamba Mungu ndiye aliyetoa mamlaka.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: “Mamlaka” huonyesha haki au uwezo halali wa kutenda, si nguvu tupu.
- source_word: τοιαύτην
  choice: ya namna hiyo
  rationale: Usemi huu ni wa kawaida katika Kiswahili na unaonyesha aina ya mamlaka iliyodhihirishwa katika tukio.
- source_word: τοῖς ἀνθρώποις
  choice: wanadamu
  rationale: “Wanadamu” huonyesha kwa usahihi watu wa jamii ya kibinadamu na huhifadhi wingi bila kudokeza kwamba wanaume pekee ndio waliokusudiwa.
theological_decisions:
- issue: Ikiwa mwitikio wa makundi ya watu uwe hofu au mshangao wenye heshima
  choice: yaliogopa
  alternative: yalijawa na hofu yenye mshangao
  rationale: Kitenzi cha Kigiriki kwa msingi humaanisha kuogopa. Muktadha unaweza kujumuisha heshima na mshangao, lakini matini kuu haipaswi kuondoa mvutano huo.
- issue: Maana ya τοῖς ἀνθρώποις
  choice: wanadamu
  alternative: watu
  rationale: Nomino ya Kigiriki inaweza kutumiwa kwa wanadamu kwa ujumla. “Wanadamu” huhifadhi maana hiyo na pia mvutano wa simulizi kwamba umati unaona mamlaka hiyo kuwa imetolewa kwa wanadamu baada ya Yesu kuitumia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Makundi ya watu” limetumiwa kuhifadhi wingi wa Kigiriki; “mamlaka ya namna hiyo” ni la kawaida na linaeleweka kwa urahisi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
