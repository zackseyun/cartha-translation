  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: sw
  text: Kisha wanafunzi wakamjia na kumwambia, “Je, unajua kwamba Mafarisayo walipolisikia neno hilo walikwazika?[a]”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walichukizwa”; kwa maana halisi zaidi, “walisababishwa kujikwaa.”
    reason: lexical_alternative
  - marker: b
    text: “Neno hilo” linarejelea kauli ya Yesu iliyotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: προσελθόντες
  choice: wakamjia
  rationale: Huonyesha kwamba wanafunzi walimkaribia Yesu; muundo wa ‘waka-’ unaunganisha tendo hili kwa kawaida na tendo la kusema.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Nomino yenye uainisho katika muktadha; Kiswahili hakihitaji kuongeza ‘wake,’ ambayo haimo wazi katika Kigiriki.
- source_word: λέγουσιν αὐτῷ
  choice: na kumwambia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa katika mtiririko wa simulizi uliopita; umoja ‘kumwambia’ ni wa kawaida kwa kikundi kinachosema ujumbe mmoja.
- source_word: Οἶδας
  choice: Je, unajua
  rationale: Tafsiri ya moja kwa moja na ya asili ya swali hilo bila kuongeza wazo la ‘kutambua.’
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Jina la kundi linalotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: ἀκούσαντες τὸν λόγον
  choice: walipolisikia neno hilo
  rationale: ‘Neno hilo’ linadumisha ukaribu na λόγον huku likirejelea kwa kawaida kauli ya Yesu iliyotangulia.
- source_word: ἐσκανδαλίσθησαν
  choice: walikwazika
  rationale: Katika muktadha huu linaonyesha mwitikio hasi wa kuchukizwa au kuudhika, huku ‘kukwazika’ pia likihifadhi taswira ya msingi ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya σκανδαλίζω katika mwitikio wa Mafarisayo
  choice: walikwazika
  alternative: walichukizwa; waliudhika; walisababishwa kujikwaa
  rationale: ‘Walikwazika’ ni lugha ya kawaida ya kibiblia na ya sasa inayoweza kumaanisha kuudhika, huku ikihifadhi kiasi fulani cha wigo na mvutano wa neno la Kigiriki bila kuufanya mstari useme wazi kuhusu uasi wa kiroho au dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa asili; ‘neno hilo’ na ‘walikwazika’ vinahifadhi ukaribu na Kigiriki pamoja na ufafanuzi wa tanbihi.
