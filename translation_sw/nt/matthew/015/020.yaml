  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: sw
  text: Mambo hayo ndiyo yanayomtia mtu unajisi[a][b], lakini kula kwa mikono isiyonawa hakumtii mtu unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yanayomfanya mtu kuwa najisi.” Kitenzi cha Kigiriki kinaweza kumaanisha kumfanya mtu asiwe safi kidini; hapa “kumtia unajisi” pia hudumisha maana pana ya kuchafuliwa kwa ndani.
    reason: lexical_alternative
  - marker: b
    text: Neno “mtu” liko katika umoja lakini linawakilisha mwanadamu yeyote kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: yanayomtia / hakumtii mtu unajisi
  rationale: Usemi “kumtia mtu unajisi” ni wa kawaida katika Kiswahili cha Biblia na unadumisha usuli wa usafi wa kidini pamoja na maana pana ya kuchafuliwa kimaadili katika mafundisho ya Yesu.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: “Mtu” huhifadhi umoja wa kiwakilishi wa Kigiriki na kwa kawaida katika Kiswahili humaanisha mwanadamu yeyote bila kulazimisha jinsia ya kiume.
- source_word: ἀνίπτοις χερσὶν
  choice: kwa mikono isiyonawiwa
  rationale: Huu ni usemi wa asili na wazi unaoeleza mikono ambayo haikuoshwa, huku muktadha ukionyesha kuwa mjadala unahusu desturi ya kunawa mikono.
- source_word: φαγεῖν
  choice: kula
  rationale: Nomino-kitenzi cha Kigiriki kinawakilishwa kwa ufupi na kwa ufasaha kwa “kula” katika muundo huu.
- source_word: ταῦτά ἐστιν τὰ
  choice: Mambo hayo ndiyo yanayo-
  rationale: Muundo huu unadumisha msisitizo wa kiashiria “hayo” na kurejelea mambo yaliyotajwa katika mstari uliotangulia.
- source_word: δέ
  choice: lakini
  rationale: “Lakini” huonyesha wazi tofauti kati ya mambo yanayotia unajisi na kula bila kunawa mikono.
theological_decisions:
- issue: Maana ya κοινόω katika mjadala kuhusu usafi wa kidini
  choice: kumtia mtu unajisi
  alternative: kumfanya mtu kuwa najisi / kumchafua mtu
  rationale: “Kumtia unajisi” hudumisha maana ya kutokuwa safi kidini bila kuondoa uzito mpana wa uchafu wa ndani au wa kimaadili katika hoja ya Yesu.
- issue: Umoja wa kiwakilishi katika ἄνθρωπον
  choice: mtu
  alternative: mwanadamu / mtu huyo
  rationale: Kigiriki kina umoja wenye maana ya jumla. Kiswahili “mtu” hudumisha umoja huo na huwasilisha ukweli unaomhusu mwanadamu yeyote; “mtu huyo” ingeweza kudokeza mtu maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mikono isiyonawiwa” ni fasaha na inafaa katika muktadha wa desturi ya kunawa; sentensi inadumisha urudiaji wa “kumtia mtu unajisi” uliopo katika Kigiriki ili tofauti ya Yesu ibaki wazi.
