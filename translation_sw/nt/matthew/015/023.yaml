  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: sw
  text: Lakini yeye hakumjibu hata neno. Wanafunzi wake wakamjia, wakaendelea kumwomba wakisema, “Mwache aende zake[a], kwa maana anapaza sauti nyuma yetu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwondoe.” Maneno ya wanafunzi hayasemi wazi kama walimaanisha, “Timiza ombi lake kisha mwache aende,” au tu, “Mwondoe kutoka karibu nasi.”
    reason: alternative_reading
  - marker: b
    text: Au “akitufuata.” Neno la Kigiriki linaweza kueleza mahali (“nyuma yetu”) au kuwafuata (“akitufuata”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: hakumjibu hata neno
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi msisitizo wa Kigiriki kwamba Yesu hakumpa jibu lolote.
- source_word: προσελθόντες
  choice: wakamjia
  rationale: Inaonyesha kwamba wanafunzi walimsogelea Yesu, kwa mtindo mfupi na wa kawaida wa usimulizi wa Kiswahili.
- source_word: ἠρώτουν
  choice: wakaendelea kumwomba
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha ombi lililoendelea au lililorudiwa; “wakaendelea kumwomba” huonyesha hali hiyo bila kuongeza nguvu ya maana ya kusihi sana.
- source_word: Ἀπόλυσον αὐτήν
  choice: Mwache aende zake
  rationale: Kauli hii ni ya kawaida katika Kiswahili na haifanyi “kufukuza” kuwa maana pekee; hivyo inadumisha uwezekano wa kumruhusu aondoke baada ya kusaidiwa au wa kumwondosha tu.
- source_word: κράζει
  choice: anapaza sauti
  rationale: Huwasilisha mwito wa sauti kubwa bila kupunguza kauli kuwa kelele zisizo na maana.
- source_word: ὄπισθεν ἡμῶν
  choice: nyuma yetu
  rationale: Ni maana ya moja kwa moja ya mahali, huku uwezekano wa maana ya kuwafuata ukielezwa katika tanbihi.
theological_decisions:
- issue: Kusudi la wanafunzi katika Ἀπόλυσον αὐτήν
  choice: Mwache aende zake
  alternative: Mpe anachoomba kisha mwache aende; au mfukuze tu
  rationale: Amri ya Kigiriki haisemi wazi kama wanafunzi walitaka Yesu atimize ombi lake ndipo aondoke au wamwondoshe bila kumsaidia. Tafsiri kuu na tanbihi zinadumisha mvutano huo wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hakumjibu hata neno” ni wa asili na wenye msisitizo; “anapaza sauti” huepuka dharau isiyolazimishwa na neno la Kigiriki.
