id: MAT.15.28
reference: Matthew 15:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: sw
  text: Ndipo Yesu akamjibu, “Ee mwanamke, imani yako ni kubwa[a]! Na iwe kwako kama unavyotaka.” Binti yake akaponywa tangu saa ile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki πίστις linaweza pia kuwasilisha wazo la kumwamini au kumtegemea mtu; hapa “imani” ndiyo tafsiri ya msingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “tangu wakati huo.” Kigiriki kinasema kihalisi “tangu saa ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha wakati kinachounganisha jibu la Yesu na mazungumzo yaliyotangulia; “ndipo” ni ya kawaida na yenye mtiririko mzuri katika simulizi.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: akamjibu
  rationale: Muundo huu wa Kigiriki hutumika kama utangulizi mmoja wa maneno ya msemaji. “Akamjibu” unaunganisha vitenzi hivyo kwa Kiswahili cha kawaida na kuhifadhi kwamba Yesu alimjibu mwanamke huyo.
- source_word: Ὦ γύναι
  choice: Ee mwanamke
  rationale: “Ee” huhifadhi msisitizo wa moja kwa moja wa Ὦ, na “mwanamke” ni maana ya wazi ya γύναι. Katika muktadha huu ni namna ya kumsemesha, si tusi.
- source_word: μεγάλη σου ἡ πίστις
  choice: imani yako ni kubwa
  rationale: Huhifadhi msisitizo wa Yesu juu ya ukubwa wa imani ya mwanamke kwa Kiswahili cha asili na kinachoeleweka.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu neno linaeleza jinsi mwanamke alivyomwamini Yesu na kumtegemea. “Imani” ndiyo tafsiri ya msingi, huku wazo la kumwamini likifafanuliwa katika tanbihi.
- source_word: γενηθήτω σοι
  choice: Na iwe kwako
  rationale: Huhifadhi nguvu ya amri au tamko la utendaji katika hali ya kutendwa, bila kuongeza mtendaji ambaye Kigiriki hakimtaji.
- source_word: ὡς θέλεις
  choice: kama unavyotaka
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya nia au tamaa ya mwanamke bila kuipa tafsiri nzito kupita kiasi.
- source_word: ἰάθη
  choice: akaponywa
  rationale: Ni kitenzi cha hali ya kutendwa kinachoeleza wazi uponyaji wa binti huyo katika simulizi la muujiza.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: tangu saa ile
  rationale: Hufuata kwa karibu usemi halisi wa Kigiriki, huku maana ya kawaida “tangu wakati huo” ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις katika sifa ya Yesu
  choice: imani
  alternative: kumwamini au kumtegemea
  rationale: Muktadha unaonyesha tegemeo lenye imani la mwanamke kwa Yesu. “Imani” huhifadhi istilahi kuu ya kifungu bila kuamua kimadhehebu jinsi imani hiyo inavyopaswa kufafanuliwa.
- issue: Nguvu ya γενηθήτω katika tamko la Yesu
  choice: Na iwe kwako
  alternative: Na itendeke kwako
  rationale: “Na iwe kwako” huhifadhi hali ya kutendwa na nguvu ya tamko la Yesu, huku ikiepuka kutaja wazi mtendaji ambaye maandishi ya Kigiriki hayamtaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa kwa maneno ya Yesu. “Ee mwanamke” limehifadhiwa kama usemi wa moja kwa moja wenye msisitizo, bila kulifanya liwe kali au kulainisha maana yake kupita maandishi ya Kigiriki.
