  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: sw
  text: hana haja kabisa ya kumheshimu baba yake[b]. Nanyi mmelibatilisha neno la Mungu[a] kwa sababu ya mapokeo yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “amri ya Mungu” badala ya “neno la Mungu.”
    reason: textual_variant
  - marker: b
    text: Hapa “kumheshimu” huenda kunajumuisha wajibu wa kumsaidia mzazi kwa mahitaji yake, si kumstahi kwa maneno na mwenendo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: hana haja kabisa
  rationale: Kikanushi hiki chenye mkazo kinaonyesha kwamba, kwa mujibu wa mapokeo yaliyotajwa, mtu huyo hahesabiwi tena kuwa na wajibu huo. ‘Kabisa’ huhifadhi mkazo wa οὐ μή bila kukifanya kifungu kuwa utabiri tu.
- source_word: τιμήσει
  choice: kumheshimu
  rationale: Kitenzi τιμάω kwa kawaida humaanisha ‘heshimu.’ Katika muktadha huu heshima hiyo inahusisha pia kuwasaidia wazazi kwa mahitaji yao, lakini maana hiyo ya vitendo imewekwa katika tanbihi ili kudumisha uhusiano wa moja kwa moja na amri iliyonukuliwa.
- source_word: πατέρα αὐτοῦ
  choice: baba yake
  rationale: Maandishi ya Kiyunani hapa yanamtaja baba kwa umoja. Tafsiri haiongezi ‘mama’ kutoka muktadha mpana.
- source_word: ἠκυρώσατε
  choice: mmelibatilisha
  rationale: ἀκυρόω humaanisha kufanya jambo lisiwe na nguvu au uhalali. ‘Mmelibatilisha’ linaonyesha uzito wa shtaka kwamba mapokeo yao yameondoa nguvu ya neno la Mungu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hufuata usomaji wa SBLGNT, λόγον (‘neno’), huku usomaji mbadala ‘amri’ ukihifadhiwa katika tanbihi.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: kwa sababu ya mapokeo yenu
  rationale: διά pamoja na hali ya accusative hapa huonyesha sababu. ‘Mapokeo’ yanafaa kwa παράδοσις, yaani mafundisho au desturi zilizopokelewa na kurithishwa.
theological_decisions:
- issue: Iwapo kufanya wazi kwamba ‘kumheshimu’ kunajumuisha msaada wa mahitaji ya wazazi
  choice: Kudumisha ‘kumheshimu’ katika matini kuu na kueleza maana yake ya vitendo katika tanbihi.
  alternative: Kutafsiri ‘kumtunza’ au ‘kumsaidia kwa mahitaji yake.’
  rationale: Mjadala unahusu wajibu wa vitendo kwa wazazi, lakini kitenzi cha Kiyunani ni τιμάω, neno linalounganisha kauli hii na amri ya kuwaheshimu wazazi. Tafsiri pana zaidi ingefinya maana isivyo lazima.
- issue: Iwapo kuoanisha kifungu na muktadha au tofauti za hati
  choice: Kutafsiri ‘baba yake’ na ‘neno la Mungu’ kama yalivyo katika matini iliyotolewa.
  alternative: Kuandika ‘baba yake au mama yake’ na ‘amri ya Mungu.’
  rationale: Ushahidi wa matini iliyotolewa una ‘baba’ kwa umoja na ‘neno la Mungu.’ Usomaji muhimu wa ‘amri ya Mungu’ umeonyeshwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mapokeo’ limetumiwa kwa mafundisho na desturi zilizopokelewa na kurithishwa; ‘mmelibatilisha’ huhifadhi uzito wa shtaka. Kifungu kimeachwa kuanza kwa herufi ndogo kwa sababu katika muktadha wake ni mwendelezo wa kauli iliyoanza katika mstari uliotangulia.
