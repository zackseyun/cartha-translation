source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: sw
  text: Je, hamwelewi kwamba kila kinachoingia kinywani huenda tumboni, kisha hutolewa chooni?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote kinachoingia kinywani ... hutupwa katika latrini.”
    reason: Mbadala huu unaonyesha maana ya jumla ya πᾶν τὸ εἰσπορευόμενον na tafsiri ya moja kwa moja zaidi ya ἀφεδρών pamoja na ἐκβάλλεται.
lexical_decisions:
- source_word: νοεῖτε
  choice: mnaelewa
  rationale: Kitenzi hiki kinahusu kufahamu hoja ya Yesu kiakili; “kuelewa” ni lugha ya kawaida na inafaa katika swali la kukemea.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: kila kinachoingia
  rationale: Muundo huu wa Kigiriki una maana ya jumla, ukirejelea chochote kinachoingia kwa kuliwa; tafsiri hii ni ya asili na huhifadhi upana huo.
- source_word: εἰς τὸ στόμα
  choice: kinywani
  rationale: Hueleza mwendo wa kuingia ndani ya kinywa; umbo la mahali “kinywani” ni la kawaida katika Kiswahili.
- source_word: κοιλίαν
  choice: tumboni
  rationale: Katika muktadha wa usagaji wa chakula neno hili hurejelea tumbo, si tumbo la uzazi wala kiwiliwili kwa jumla.
- source_word: χωρεῖ
  choice: huenda
  rationale: Katika muktadha huu linaeleza chakula kuendelea au kupita hadi tumboni; “huenda” ni wazi na ya asili.
- source_word: ἀφεδρῶνα
  choice: chooni
  rationale: Neno hili humaanisha mahali pa kujisaidia, yaani choo au latrini; “chooni” ni sahihi, ya sasa, na yenye staha katika Kiswahili sanifu.
- source_word: ἐκβάλλεται
  choice: hutolewa
  rationale: Kauli ya kutendwa inaeleza kutolewa kwa chakula mwilini baada ya usagaji; “hutolewa” huhifadhi maana bila kuwa lugha chafu.
theological_decisions:
- issue: Uhusiano wa kauli ya Yesu na sheria za utakaso wa kidini
  choice: Kauli ya kifiziolojia imetafsiriwa moja kwa moja bila kuongeza tamko kwamba vyakula vyote ni safi.
  alternative: Kuipanua tafsiri ili iseme wazi kwamba kwa hiyo vyakula vyote vilitangazwa kuwa safi.
  rationale: Mstari huu unaeleza mchakato wa chakula mwilini katika hoja ya Yesu kuhusu kinachomtia mtu unajisi, lakini hauna maelezo ya ziada yanayopatikana katika Marko 7:19. Kutoyaongeza kunahifadhi mipaka na mvutano wa maandishi yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Je, hamwelewi” hudumisha swali la kukemea; “tumboni” na “chooni” ni maumbo ya mahali yaliyo ya kawaida. Alama ya tanbihi [a] imewekwa katika matini kuu.
