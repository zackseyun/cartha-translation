lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza simulizi; “Kisha” ni cha kawaida katika Kiswahili na hakiongezi uhusiano mzito wa kimantiki.
- source_word: προσκαλεσάμενος
  choice: akauita ... uje kwake
  rationale: Kitenzi hiki humaanisha kuita au kuagiza mtu aje karibu na msemaji. Muundo huu unaonyesha kwa Kiswahili cha kawaida nguvu ya kuelekeza kwa nafsi iliyomo katika kitenzi cha Kigiriki.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: “Umati” humaanisha kundi kubwa la watu waliokusanyika na linafaa kwa mazingira haya ya simulizi.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Huu ni usemi wa kawaida na wenye heshima unaowasilisha maana ya kusema jambo kwao.
- source_word: Ἀκούετε
  choice: Sikilizeni
  rationale: Amri ya wingi hapa inawataka watu wazingatie wanachosikia, si kusikia sauti tu. “Sikilizeni” ni ya asili katika Kiswahili cha sasa.
- source_word: συνίετε
  choice: kuelewa
  rationale: Neno hili linataka wasikilizaji wafahamu maana ya mafundisho; “kuelewa” linahifadhi tofauti kati ya kusikiliza na kufahamu.
