  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: sw
  text: Akauita umati umjie kwake, akawaambia, “Sikilizeni[a] na eleweni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikieni na eleweni.”
