  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: sw
  text: Kisha Yesu akatoka huko, akajiondoa kwenda katika sehemu za Tiro na Sidoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaondoka kwenda katika sehemu za Tiro na Sidoni.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa namna hii isiyo na dokezo mahsusi la kujiondoa, lakini “akajiondoa” kinaakisi matumizi yake yanayojirudia katika Mathayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa Kiswahili cha kawaida bila kuongeza mkazo usiokuwapo katika Kigiriki.
- source_word: ἐξελθὼν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha tendo la kutoka lililotangulia tendo kuu; “akaondoka” ni la asili katika mtiririko wa simulizi ya Kiswahili.
- source_word: ἐκεῖθεν
  choice: huko
  rationale: Kielezi hiki kinarejelea mahali Yesu alipokuwa kabla ya kuondoka.
- source_word: ἀνεχώρησεν
  choice: akajiondoa
  rationale: “Akajiondoa” kinahifadhi wazo la kuondoka au kujiondoa lililo katika matumizi ya Mathayo, bila kudai kwamba Yesu alikimbia au kueleza sababu yake.
- source_word: εἰς τὰ μέρη
  choice: kuelekea eneo
  rationale: Usemi huu unaonyesha mwendo kuelekea sehemu pana inayohusishwa na miji hiyo, si lazima kuingia ndani ya miji yenyewe.
- source_word: Τύρου καὶ Σιδῶνος
  choice: la Tiro na Sidoni
  rationale: Majina ya mahali yametolewa kwa namna inayotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
theological_decisions:
- issue: Dokezo la mwendo wa Yesu kuelekea eneo lililohusishwa na watu wa mataifa
  choice: Kutafsiri ἀνεχώρησεν kuwa “akajiondoa” bila kutaja sababu ya kuondoka kwake.
  alternative: Kutafsiri kwa namna isiyo na dokezo hilo kuwa “akaenda” au kwa nguvu zaidi kuwa “akarudi nyuma.”
  rationale: Kifungu kinaweza kudokeza kujiondoa kwa kusudi fulani, lakini hakisemi sababu. Tafsiri inadumisha dokezo hilo bila kuingiza nia ya kisaikolojia au fundisho lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa dhana za kuondoka na kujiondoa kumehifadhiwa kwa sababu kunaakisi muundo na dokezo la vitenzi viwili vya Kigiriki.
