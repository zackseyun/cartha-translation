  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: sw
  text: Na tazama, mwanamke Mkanaani kutoka maeneo yale akatokea, naye alikuwa akipaza sauti akisema, “Nihurumie, Bwana, Mwana wa Daudi! Binti yangu amepagawa sana na pepo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anateswa sana na pepo” au “yuko chini ya nguvu za pepo.”
    reason: Mbadala wa kileksika unaohifadhi upana wa maana ya δαιμονίζεται bila kufafanua kupita kiasi aina ya ushawishi wa pepo.
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi dhima ya chembe ya kuelekeza usikivu na uhai wa simulizi bila kuiondoa.
- source_word: Χαναναία
  choice: Mkanaani
  rationale: Mathayo anatumia wazi jina la kihistoria ‘Mkanaani’; halibadilishwi kuwa ‘Mshirofoinike,’ ambalo linapatikana katika simulizi sambamba la Marko.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: kutoka maeneo yale
  rationale: ὅρια hapa hurejelea maeneo au wilaya za upande huo; tafsiri hii ni ya kawaida na inadumisha wingi wa neno la Kigiriki.
- source_word: ἐξελθοῦσα
  choice: akatokea
  rationale: Kitenzi-shirikishi cha aoristi kimetolewa kwa kitenzi cha mfululizo kinachofaa simulizi la Kiswahili, kikionyesha mwanamke akitoka na kuingia katika tukio.
- source_word: ἔκραζεν
  choice: alikuwa akipaza sauti
  rationale: Muundo wa wakati usiotimilifu unaonyesha tendo lililoendelea au kurudiwa, si kilio kimoja tu.
- source_word: Ἐλέησόν με
  choice: Nihurumie
  rationale: Ni ombi la moja kwa moja na la dharura linalohifadhi maana ya rehema ya ἐλεάω kwa Kiswahili cha kawaida.
- source_word: κύριε
  choice: Bwana
  rationale: Katika mwito unaoambatana na ‘Mwana wa Daudi,’ ‘Bwana’ huhifadhi heshima na uwezekano wa uzito wa Kimasihi kuliko ‘bwana’ kwa maana ya heshima ya kawaida tu.
- source_word: υἱὸς Δαυίδ
  choice: Mwana wa Daudi
  rationale: Tafsiri ya moja kwa moja inahifadhi cheo cha Kimasihi chenye uhusiano na ufalme wa Daudi.
- source_word: κακῶς
  choice: vibaya
  rationale: Kielezi hiki kinatilia nguvu ukali wa hali ya binti kwa lugha rahisi na ya asili.
- source_word: δαιμονίζεται
  choice: amepagawa ... na pepo
  rationale: Ni usemi unaoeleweka wa Kiswahili kwa hali ya kuwa chini ya nguvu za pepo, huku tanbihi ikihifadhi uwezekano wa tafsiri isiyobainisha kiwango cha umiliki kwa ukali uleule.
theological_decisions:
- issue: Tafsiri ya κύριε katika mwito wenye cheo cha Kimasihi
  choice: Bwana
  alternative: bwana / mheshimiwa
  rationale: Kuunganishwa kwake na ‘Mwana wa Daudi’ kunaweza kuonyesha zaidi ya heshima ya kawaida. ‘Bwana’ huhifadhi uzito huo bila kudai kwamba mwanamke tayari anatoa ungamo la kiteolojia lililokamilika.
- issue: Tafsiri ya δαιμονίζεται
  choice: amepagawa na pepo
  alternative: anateswa sana na pepo / yuko chini ya nguvu za pepo
  rationale: Andiko linahusisha hali ya binti na pepo waziwazi, lakini kitenzi cha Kigiriki hakielezi kwa usahihi aina au kiwango cha udhibiti huo. Tafsiri ya kawaida imetumiwa katika andiko, na uwezekano mpana zaidi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘alikuwa akipaza sauti’ unahifadhi mwendelezo wa tendo, na alama ya tanbihi imewekwa moja kwa moja baada ya kirai kinachohusika.
