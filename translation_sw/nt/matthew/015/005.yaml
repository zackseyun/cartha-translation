  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: sw
  text: Lakini ninyi mnasema, ‘Yeyote anayemwambia baba yake au mama yake, “Chochote ambacho ungefaidika nacho kutoka kwangu ni zawadi[a],”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka.” Maana yake ni kwamba kile ambacho kingeweza kutumiwa kuwasaidia wazazi kinatangazwa kuwa kimewekwa wakfu kwa Mungu; linganisha Marko 7:11, anapotumia neno “Korban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Lakini ninyi mnasema
  rationale: “Lakini” huhifadhi utofautishaji wa δὲ na amri iliyotajwa kabla, huku “ninyi” ikionyesha msisitizo uliomo katika kiwakilishi ὑμεῖς.
- source_word: Ὃς ἂν εἴπῃ
  choice: Yeyote anayemwambia
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya jumla isiyomhusu mtu mmoja maalumu; kiambishi cha yambwa katika “anayemwambia” kinaendana kwa kawaida na baba au mama.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: baba yake au mama yake
  rationale: Hutafsiri yambwa isiyo ya moja kwa moja kwa Kiswahili cha kawaida na kuhifadhi uhusiano wa kifamilia unaodokezwa na muktadha.
- source_word: Δῶρον
  choice: zawadi
  rationale: “Zawadi” ni maana ya moja kwa moja ya δῶρον. Maana ya kitu kilichowekwa wakfu kwa Mungu inaelezwa katika tanbihi bila kuingiza neno “Korban,” ambalo halipo katika maandishi ya Mathayo.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Chochote ambacho ungefaidika nacho kutoka kwangu
  rationale: “Ungefaidika nacho” huhifadhi wazo la mzazi kupata manufaa, na “kutoka kwangu” huwakilisha wazi ἐξ ἐμοῦ bila kuamua aina mahususi ya msaada.
theological_decisions:
- issue: Iwapo neno la kiufundi “Korban” liingizwe katika maandishi ya Mathayo
  choice: Kutumia “zawadi” katika maandishi makuu
  alternative: “Korban” au “sadaka iliyowekwa wakfu kwa Mungu”
  rationale: Mathayo ametumia δῶρον, si κορβᾶν kama ilivyo katika Marko 7:11. Tafsiri inahifadhi neno la Mathayo, huku tanbihi ikifafanua maana yake katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ungefaidika nacho” ni wa kawaida na unaeleweka, nao huhifadhi kwa kadiri inayowezekana hali ya kutotimizwa kwa manufaa hayo. Kifungu kimeachwa kikiwa kinaendelea kisarufi kwa sababu sentensi inaendelezwa katika mstari unaofuata.
