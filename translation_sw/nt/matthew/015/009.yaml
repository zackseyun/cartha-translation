  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: sw
  text: Lakini wananiabudu bure, wakifundisha maagizo ya wanadamu kama mafundisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakifundisha mafundisho, yaani maagizo ya wanadamu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: bure
  rationale: Hueleza jambo lisilo na matokeo au lisilo na maana; “bure” ni Kiswahili cha kawaida na chenye nguvu ya kukemea katika muktadha huu.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha mwendelezo wenye utofautishaji wa kiasi; “Lakini” linafaa kwa nguvu ya kukemea katika muktadha.
- source_word: σέβονταί με
  choice: wananiabudu
  rationale: Kitenzi kinaonyesha kumcha au kumwabudu Mungu, na kiwakilishi cha yambwa “me” kimeunganishwa kwa njia ya asili katika kitenzi cha Kiswahili.
- source_word: διδάσκοντες
  choice: wakifundisha
  rationale: Huhifadhi uhusiano wa kishiriki unaoonyesha hali au namna inayoandamana na ibada yao, bila kuamua kupita kiasi kama ni wakati au sababu.
- source_word: διδασκαλίας
  choice: kuwa mafundisho
  rationale: Katika muundo huu wa Kigiriki, maagizo ya wanadamu yanafundishwa yakiwa na hadhi ya mafundisho; “kuwa mafundisho” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἐντάλματα
  choice: maagizo
  rationale: Neno hili hurejelea amri au masharti yaliyowekwa; “maagizo” ni la asili na linafaa katika muktadha wa kidini.
- source_word: ἀνθρώπων
  choice: ya wanadamu
  rationale: Ni neno la jumla linalohusu binadamu, si wanaume pekee, na hapa linatofautisha chanzo cha kibinadamu na kile cha Mungu.
theological_decisions:
- issue: Muundo wa διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: wakifundisha maagizo ya wanadamu kuwa mafundisho
  alternative: wakifundisha mafundisho ambayo ni maagizo ya wanadamu
  rationale: Kigiriki kimebanwa na kinaweza kueleweka kama maagizo ya kibinadamu yanayopewa hadhi ya mafundisho. Tafsiri kuu inaweka maana hiyo wazi bila kuongeza madai ya kimadhehebu; tanbihi huhifadhi muundo mwingine unaowezekana.
- issue: Maana ya jumla ya ἀνθρώπων
  choice: wanadamu
  alternative: watu
  rationale: “Wanadamu” huonyesha wazi tofauti kati ya yaliyo na asili ya kibinadamu na yaliyo ya Mungu, bila kudokeza jinsia ya kiume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi sauti ya kinabii na ya kukemea, huku “wanadamu” ikibeba maana jumuishi ya neno la Kigiriki.
