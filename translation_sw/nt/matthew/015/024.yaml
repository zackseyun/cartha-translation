  text: Lakini akajibu, “Sikutumwa[a] isipokuwa kwa kondoo waliopotea wa nyumba ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa muundo chanya wa kawaida zaidi wa Kiswahili: “Nilitumwa tu kwa kondoo waliopotea wa nyumba ya Israeli.”'
    reason: Toleo la matini kuu huhifadhi kwa ukaribu muundo hasi wa Kigiriki, Οὐκ ... εἰ μὴ; tanbihi inatoa muundo chanya wa Kiswahili wenye maana ileile.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Muundo wa participio pamoja na kitenzi cha kusema unatolewa kwa Kiswahili cha kawaida kwa kitenzi kimoja, “akajibu,” bila kupoteza maana.
- source_word: Οὐκ ἀπεστάλην
  choice: Sikutumwa
  rationale: Kauli tendwa ya wakati uliopita inaeleza kutumwa kwa agizo au utume; “sikutumwa” ni ya asili na sahihi katika muktadha huu.
- source_word: εἰ μὴ
  choice: isipokuwa kwa
  rationale: Kirai hiki kinaonyesha mpaka wa wazi wa utume. “Isipokuwa kwa” huhifadhi muundo hasi na nguvu ya kizuizi ya Kigiriki.
- source_word: πρόβατα
  choice: kondoo
  rationale: Taswira halisi ya kondoo inadumishwa badala ya kufafanuliwa kuwa watu.
- source_word: ἀπολωλότα
  choice: waliopotea
  rationale: Katika taswira ya kondoo, neno hili lina maana ya kupotea au kwenda njia isiyofaa; “waliopotea” huepuka kudokeza kwamba tayari wameangamia kabisa.
- source_word: οἴκου Ἰσραήλ
  choice: nyumba ya Israeli
  rationale: Huhifadhi nahau ya kibiblia yenye maana ya taifa au watu wa Israeli na mwangwi wake wa agano.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko lenye ukinzani wa kiasi katika simulizi na jibu la Yesu kwa ombi lililotangulia.
theological_decisions:
- issue: Upeo wa utume wa Yesu katika kauli hii
  choice: 'Kauli imetafsiriwa kama kikomo cha wazi katika muktadha huu: “Sikutumwa isipokuwa kwa...”'
  alternative: “Nilitumwa hasa kwa...” au tafsiri nyingine inayodokeza kipaumbele tu badala ya kikomo.
  rationale: Muundo Οὐκ ... εἰ μὴ ni wa kizuizi cha wazi. Tafsiri inadumisha mvutano wa simulizi bila kuingiza mapema utume wa baadaye kwa mataifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyumba ya Israeli” imehifadhiwa kama nahau ya kibiblia; “kondoo waliopotea” inadumisha sitiari ya chanzo.
