  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: sw
  text: Akachukua mikate ile saba na samaki, na baada ya kushukuru[a], akavimega; akaendelea kuwapa wanafunzi, nao wanafunzi wakawapa makutano ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiisha kushukuru.”
    reason: Njia nyingine iliyo rasmi zaidi ya kutafsiri hali ya kitenzi cha Kigiriki huku ikihifadhi kwamba kushukuru kulitangulia kumega.
lexical_decisions:
- source_word: ἔλαβεν
  choice: akaichukua
  rationale: Katika mfuatano huu wa matendo, λαμβάνω humaanisha Yesu kuichukua mikate kabla ya kushukuru na kuigawa. Kiambishi cha yambwa “-i-” kinarejelea mikate inayotajwa.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ile mikate saba
  rationale: ἄρτος hapa ni mikate halisi ya kugawanywa, si dhana ya jumla ya chakula. “Ile” inaonyesha mikate iliyokwisha tajwa katika simulizi.
- source_word: τοὺς ἰχθύας
  choice: samaki
  rationale: “Samaki” ndilo neno la kawaida la Kiswahili kwa umoja na wingi; muktadha unaonyesha kuwa ni wale waliokwisha tajwa.
- source_word: εὐχαριστήσας
  choice: baada ya kushukuru
  rationale: Kirai hiki kinaonyesha wazi kwamba kushukuru kulitangulia tendo la kumega, bila kuongeza yambwa kama “Mungu,” ambalo halikutajwa wazi katika Kigiriki.
- source_word: ἔκλασεν
  choice: akaimega
  rationale: κλάω katika simulizi la kulisha watu huelekea kumaanisha kuimega mikate ili igawanywe. “Kumega” ni neno la kawaida na sahihi kuliko “kuvunja” kwa mkate.
- source_word: ἐδίδου
  choice: akaendelea kuwapa
  rationale: Kauli ya wakati uliopita usiotimilika katika Kigiriki inaonyesha utoaji ulioendelea au uliorudiwa; “akaendelea kuwapa” huhifadhi maana hiyo.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: Hawa ndio waliopokea chakula kutoka kwa Yesu. “Wake” haijaongezwa kwa kuwa haimo wazi katika Kigiriki.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: nao wanafunzi wakawapa makundi ya watu
  rationale: Kigiriki kinaacha kitenzi katika sehemu ya pili, lakini Kiswahili cha kawaida hukirudia ili maana iwe wazi. Wingi wa ὄχλοι umehifadhiwa kwa “makundi ya watu.”
theological_decisions:
- issue: Dokezo linalowezekana la Meza ya Bwana katika εὐχαριστήσας
  choice: baada ya kushukuru
  alternative: kutumia lugha ya kiliturujia inayosisitiza maana ya Meza ya Bwana
  rationale: Aya inasimulia tendo la kawaida la kushukuru kabla ya kugawa chakula. Ingawa wasomaji wanaweza kuona mwangwi wa Meza ya Bwana, tafsiri haiongezi ufafanuzi wa kisakramenti usiotamkwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi inadumisha mfuatano wa matendo, hali endelevu ya ἐδίδου, na wingi wa makundi ya watu bila kuongeza mafundisho ya dhehebu.
