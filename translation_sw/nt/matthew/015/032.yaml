  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: sw
  text: Kisha Yesu akawaita wanafunzi wake waje kwake, akasema, “Ninauhurumia umati huu,[a] kwa sababu tayari wamekaa nami kwa siku tatu[b] na hawana chakula. Sitaki kuwaacha waende bila kula,[c] wasije wakazimia njiani.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninasukumwa na huruma kwa ajili ya umati huu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wameendelea kukaa nami kwa siku tatu.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki lina maana halisi ya “wakiwa wamefunga” au “bila chakula”; hapa linamaanisha kwamba hawajala, si kwamba wanafanya mfungo wa kidini.
    reason: lexical_alternative
  - marker: d
    text: Au, “wasije wakadhoofika njiani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita wanafunzi wake waje kwake
  rationale: Huhifadhi wazo la Yesu kuwaita wanafunzi wamkaribie, kwa Kiswahili cha kawaida na cha wazi.
- source_word: Σπλαγχνίζομαι
  choice: Ninauonea huruma
  rationale: Huonyesha huruma ya ndani na yenye nguvu bila kutumia lugha nzito isiyo ya kawaida.
- source_word: ὄχλον
  choice: umati huu
  rationale: “Umati” ni neno la kawaida kwa kundi kubwa la watu; kiwakilishi “huu” ni cha kimaana katika muktadha wa kauli ya Yesu.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: tayari wamekaa nami kwa siku tatu
  rationale: Huwasilisha hali ya kuendelea kukaa pamoja na Yesu na muda wa siku tatu kwa Kiswahili asilia.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: hawana chakula
  rationale: Hii ni njia fupi na ya kawaida ya kueleza kwamba hawana chochote cha kula.
- source_word: ἀπολῦσαι
  choice: kuwaacha waende
  rationale: Katika muktadha wa kuvunja mkusanyiko, maana ni kuwaruhusu au kuwaagiza waondoke.
- source_word: νήστεις
  choice: bila kula
  rationale: Huhifadhi maana ya kutokuwa na chakula bila kudokeza lazima mfungo wa kidini.
- source_word: μήποτε ἐκλυθῶσιν
  choice: wasije wakazimia
  rationale: Huwasilisha matokeo yanayohofiwa, yaani kudhoofika sana au kuzimia njiani.
- source_word: ἐν τῇ ὁδῷ
  choice: njiani
  rationale: Ni Kiswahili cha kawaida kinachoeleza wakati wa safari yao.
