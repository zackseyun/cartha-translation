lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofautishaji wa kiasi kutoka katika jibu lililotangulia na kusisitiza kwamba mwanamke aliendelea kusihi.
- source_word: ἐλθοῦσα
  choice: akaja
  rationale: Kitenzi-shirikishi cha wakati uliopita kimetafsiriwa kwa kitenzi kamili kinachounganishwa kwa mtiririko wa kawaida wa Kiswahili, huku kikihifadhi tendo la kumkaribia Yesu.
- source_word: προσεκύνει αὐτῷ
  choice: akapiga magoti mbele yake
  rationale: Kitenzi προσκυνέω kinaweza kumaanisha kusujudu kwa heshima, kutoa heshima kuu, au kuabudu. Tafsiri hii inaonyesha tendo la mwili na heshima bila kuamua kupita kiasi jinsi mwanamke mwenyewe alivyomwelewa Yesu.
- source_word: λέγουσα
  choice: na kusema
  rationale: Kitenzi-shirikishi kinaanzisha maneno yake ya moja kwa moja; muundo huu ni wa asili katika Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: Hili ni neno la kawaida, lenye uzito unaofaa, la kumwita Yesu kwa heshima katika muktadha huu.
- source_word: βοήθει μοι
  choice: nisaidie
  rationale: Kauli ya amri ya wakati uliopo ni ombi fupi na la haraka; “nisaidie” huhifadhi urahisi na dharura yake.
theological_decisions:
- issue: Tafsiri ya προσκυνέω inapomhusu Yesu
  choice: akapiga magoti mbele yake
  alternative: akamwabudu
  rationale: Neno la Kigiriki linaweza kueleza tendo la kusujudu au kutoa heshima, na pia kuabudu, kutegemea muktadha. Maandishi makuu yanaonyesha tendo linaloonekana bila kufunga maana ya kitheolojia; tanbihi inahifadhi uwezekano halali wa “akamwabudu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo mfupi unadumisha msisitizo na dharura ya ombi la mwanamke.
