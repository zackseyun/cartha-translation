  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: sw
  text: “Kwa nini wanafunzi wako wanakiuka mapokeo ya wazee? Kwa maana hawanawi mikono wanapokula mkate[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, desturi ya kunawa mikono iliyotakiwa na mapokeo ya wazee, wala si suala la usafi wa kawaida tu.
    reason: cultural_note
  - marker: b
    text: Au, “wanapokula mlo”; neno la Kigiriki linalomaanisha “mkate” wakati mwingine linaweza kuwakilisha chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili cha sasa.
- source_word: οἱ μαθηταί σου
  choice: wanafunzi wako
  rationale: Huwakilisha kwa kawaida uhusiano wa μαθηταί na kiwakilishi cha umilikaji σου.
- source_word: παραβαίνουσιν
  choice: wanakiuka
  rationale: Kitenzi hiki huonyesha kwenda kinyume na jambo lenye mamlaka au kulivunja; ‘wanakiuka’ kinafaa kwa mapokeo bila kulifanya kuwa sheria iliyoandikwa.
- source_word: τὴν παράδοσιν
  choice: mapokeo
  rationale: ‘Mapokeo’ yanaonyesha mafundisho au desturi zilizopokelewa na kupitishwa kutoka kwa waliotangulia, na yanahifadhi uzito wa neno la Kigiriki.
- source_word: τῶν πρεσβυτέρων
  choice: ya wazee
  rationale: Katika muktadha huu ni viongozi au waliotangulia wenye mamlaka katika mapokeo ya Kiyahudi, si watu wazee kwa umri tu.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: Kwa maana hawanawi mikono
  rationale: ‘Kunawa mikono’ ni usemi wa asili wa Kiswahili kwa kuosha sehemu hii ya mwili. Umilikaji wa ‘yao’ hauhitajiki kwa kuwa muktadha unaonyesha wazi ni mikono yao.
- source_word: ὅταν
  choice: wanapo-
  rationale: Muundo ‘wanapokula’ unaonyesha tukio la kawaida au linalorudiwa kwa Kiswahili cha kawaida.
- source_word: ἄρτον
  choice: mkate
  rationale: Neno la Kigiriki linamaanisha kihalisi ‘mkate’; maana pana ya mlo imehifadhiwa katika tanbihi badala ya kubadilisha maandishi makuu.
- source_word: ἐσθίωσιν
  choice: wanakula
  rationale: Hutoa kwa kawaida maana ya tendo la desturi katika kishazi cha wakati pamoja na ὅταν.
theological_decisions:
- issue: Asili ya kunawa mikono kunakotajwa
  choice: Maandishi makuu yanaonyesha tu kuwa ni suala la mapokeo ya wazee.
  alternative: Kusema moja kwa moja kuwa ni kunawa kwa kiibada, au kuwa ni usafi wa kawaida.
  rationale: Mstari wenyewe unahusianisha tendo hilo na mapokeo ya wazee lakini haufafanui moja kwa moja aina yake. Tanbihi hutoa muktadha bila kufunga zaidi ya ushahidi wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mapokeo’ huhifadhi wazo la urithi wenye mamlaka; ‘wanakiuka’ ni wazi bila kuwa la kitaalamu kupita kiasi. Tanbihi zote zimewekewa viashiria [a] na [b] katika maandishi makuu.
