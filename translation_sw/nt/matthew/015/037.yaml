  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: sw
  text: Nao wote wakala wakashiba; wakakusanya vipande vilivyobaki, vikapu saba vilivyojaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: wakala
  rationale: Kitenzi hiki cha wakati uliopita humaanisha moja kwa moja kwamba walikula; hakuna yambwa iliyotajwa katika Kigiriki.
- source_word: πάντες
  choice: wote
  rationale: Hudumisha maana kwamba kila mmoja katika umati alikula.
- source_word: ἐχορτάσθησαν
  choice: wakashiba
  rationale: χορτάζω hapa humaanisha kula mpaka kupata chakula cha kutosha; ‘wakashiba’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: τὸ περισσεῦον
  choice: vilivyobaki
  rationale: Kirai hiki humaanisha kile kilichosalia baada ya watu kula; kimetafsiriwa pamoja na ‘vipande’ kwa mtiririko wa kawaida wa Kiswahili.
- source_word: κλασμάτων
  choice: vipande
  rationale: κλάσματα ni vipande vya chakula, hasa mkate, vilivyobaki; ‘vipande’ ni neno la kawaida lisiloongeza yambwa ambayo haikutajwa wazi.
- source_word: ἦραν
  choice: wakakusanya
  rationale: Katika muktadha huu αἴρω ina maana ya kuokota au kukusanya vipande vilivyobaki.
- source_word: ἑπτὰ
  choice: saba
  rationale: Namba ya Kigiriki imetafsiriwa moja kwa moja.
- source_word: σπυρίδας
  choice: vikapu
  rationale: σπυρίς humaanisha kikapu na huenda ikawa aina kubwa ya kikapu; maana ya ukubwa imehifadhiwa katika tanbihi bila kuilazimisha katika matini kuu.
- source_word: πλήρεις
  choice: vilivyojaa
  rationale: Kivumishi hiki kinaeleza kwamba vikapu vyote saba vilikuwa vimejaa.
