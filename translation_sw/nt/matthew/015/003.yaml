source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: sw
  text: Naye akajibu, akawaambia, “Kwa nini ninyi pia mnakiuka amri ya Mungu kwa sababu ya mapokeo yenu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mapokeo yenu.”
    reason: Mbadala huu unaonyesha uwezekano wa kuelewa διά kama kufanya jambo kwa ajili ya au kwa kuunga mkono mapokeo yao, badala ya kusisitiza sababu tu.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Lakini yeye akajibu, akawaambia
  rationale: Muundo huu unawakilisha kitenzi kishirikishi ἀποκριθείς pamoja na εἶπεν, huku ukitoa Kiswahili cha kawaida na chenye uzito wa kisimulizi. Kiwakilishi “yeye” kinaendeleza utofautishaji unaoletwa na δέ.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hili ndilo swali la kawaida la Kiswahili linalouliza sababu.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: “Pia” inadumisha uhusiano na shtaka lililotolewa kuhusu wanafunzi, na “ninyi” inasisitiza wahusika bila kuongeza maana isiyokuwapo.
- source_word: παραβαίνετε
  choice: mnakiuka
  rationale: “Kukiuka” hueleza kuvunja au kwenda kinyume cha amri kwa Kiswahili cha sasa, kwa usahihi na hadhi inayofaa.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: amri ya Mungu
  rationale: “Amri” ni neno wazi na la kawaida kwa ἐντολή, nalo linahifadhi mamlaka ya Mungu katika utofautishaji wa mstari huu.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: kwa sababu ya mapokeo yenu
  rationale: διά pamoja na hali ya kushutumiwa hapa inaeleza sababu au msingi. “Mapokeo” huhifadhi wazo la jambo lililopokezwa bila kulipanua kuwa desturi zote kwa ujumla.
theological_decisions:
- issue: Utofautishaji kati ya amri ya Mungu na mapokeo ya wanadamu
  choice: amri ya Mungu … mapokeo yenu
  alternative: agizo la Mungu … desturi zenu
  rationale: Maneno yaliyochaguliwa yanadumisha utofautishaji wa moja kwa moja kati ya mamlaka ya Mungu na mapokeo mahususi ya wapinzani. Hayafanyi mstari huu kuwa hukumu dhidi ya mapokeo yote.
- issue: Nguvu ya kisababishi katika διὰ τὴν παράδοσιν ὑμῶν
  choice: kwa sababu ya mapokeo yenu
  alternative: kwa ajili ya mapokeo yenu
  rationale: Tafsiri kuu inaonyesha kwamba mapokeo yao ndiyo sababu au msingi wa ukiukaji. Tafsiri mbadala imewekwa katika tanbihi kwa kuwa inaweza kusisitiza kuyatetea au kuyapendelea mapokeo, lakini pia inaweza kueleweka kimakusudi zaidi kuliko Kigiriki kinavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mnakiuka” ni wazi kwa wasomaji wa kawaida, na “mapokeo” hudumisha sajili ya kibiblia bila kuwa ya kale kupita kiasi.
