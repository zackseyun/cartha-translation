base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: sw
  text: Baada ya kuwaaga makutano, alipanda mashua, akafika katika eneo la Magadan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Magdala” badala ya “Magadan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Baada ya kuwaruhusu ... waende
  rationale: Kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu. Usemi huu wa Kiswahili unaeleza wazi kuwa Yesu aliwaondosha watu bila kuongeza wazo la kuwafukuza kwa ukali.
- source_word: τοὺς ὄχλους
  choice: makutano
  rationale: Neno hili la Kiswahili linafaa kwa makundi ya watu waliokusanyika na linahifadhi wingi wa neno la Kigiriki.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: alipanda mashua
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili kwa tendo la kuingia ndani ya chombo ili kusafiri majini.
- source_word: ἦλθεν
  choice: akafika
  rationale: Katika simulizi la safari, ‘akafika’ huwasilisha kwa Kiswahili kwa ufasaha kufika mahali kunakolengwa, ambako kitenzi cha Kigiriki ἔρχομαι kinaelekea hapa.
- source_word: τὰ ὅρια
  choice: eneo
  rationale: Ingawa maana ya msingi ni mipaka, wingi huu unatumiwa kijiografia kumaanisha eneo au sehemu inayozunguka mahali fulani; ‘eneo’ huepuka wazo lisilo sahihi la mstari wa mpaka pekee.
- source_word: Μαγαδάν
  choice: Magadani
  rationale: Matini ya SBLGNT ina Μαγαδάν. ‘Magadani’ ni umbo la jina hilo linalolingana na utamkaji na uandishi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Umbo la jina la mahali mwishoni mwa mstari
  choice: Magadani
  alternative: Magdala
  rationale: Hili ni suala la tofauti ya matini na jina la mahali, si fundisho la kitheolojia. Tafsiri inafuata Μαγαδάν katika matini iliyotolewa, huku tofauti inayojulikana ya ‘Magdala’ ikitajwa katika tanbihi kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi ni wa asili katika masimulizi. Jina ‘Yesu’ limewekwa wazi badala ya kiwakilishi pekee ili mstari unaosomwa peke yake ueleweke mara moja. Alama ya tanbihi imewekwa baada ya ‘Magadani,’ ambako tofauti ya matini inahusika.
