id: MAT.15.14
reference: Matthew 15:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: sw
  text: Waacheni; wao ni viongozi vipofu wa vipofu. Lakini kipofu akimwongoza kipofu, wote wawili wataanguka shimoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaroni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Waacheni
  rationale: Kitenzi cha amri hapa kina maana ya kuwaacha au kutowashughulikia, si kuwasamehe. “Waacheni” ni fupi, ya kawaida, na ina nguvu ya amri iliyomo katika Kigiriki.
- source_word: τυφλοί
  choice: vipofu
  rationale: Inahifadhi sitiari ya kutoweza kuona au kutambua kiroho bila kuifafanua kupita matini.
- source_word: ὁδηγοὶ τυφλῶν
  choice: viongozi vipofu wa vipofu
  rationale: “Viongozi” hapa hueleweka kwa maana ya wanaowaongoza wengine na hudumisha picha inayorudiwa katika kishazi kinachofuata. Muundo “wa vipofu” unawakilisha genitivi ya Kigiriki kwa ufupi.
- source_word: τυφλὸς ... τυφλὸν
  choice: kipofu ... kipofu
  rationale: Kiswahili hutumia nomino ya ngeli ya KI-VI bila kuweka jinsia ya mtu; usemi huu wa umoja unabaki wa kimethali na wenye matumizi ya jumla.
- source_word: ἐὰν ὁδηγῇ
  choice: akimwongoza
  rationale: Muundo wa -ki- unatoa sharti la jumla kwa Kiswahili cha kawaida, huku “mwongoza” ikidumisha uhusiano wa kileksia na viongozi.
- source_word: ἀμφότεροι
  choice: wote wawili
  rationale: Hii ni tafsiri ya kawaida na wazi ya kuwa matokeo yanawahusu wote wawili.
- source_word: εἰς βόθυνον
  choice: shimoni
  rationale: βόθυνος inaweza kuwa shimo au mtaro. “Shimoni” ni pana, ya asili, na inadumisha picha ya kuanguka ndani ya sehemu iliyochimbika.
- source_word: πεσοῦνται
  choice: wataanguka
  rationale: Inatoa kwa kawaida matokeo ya wakati ujao katika sentensi ya sharti.
theological_decisions:
- issue: Nguvu ya kisitiari ya “vipofu”
  choice: Kudumisha “vipofu” kama sitiari bila kuongeza “kiroho” katika matini kuu.
  alternative: viongozi wasio na utambuzi wa kiroho
  rationale: Kigiriki kinatumia sitiari moja kwa moja; kuifafanua kungepunguza nguvu ya methali na kuamua maana ambayo matini yenyewe haijaieleza wazi.
- issue: Jinsia katika methali ya umoja
  choice: Kutumia “kipofu ... kipofu,” ambayo katika Kiswahili haibainishi jinsia.
  alternative: mwanamume kipofu ... mwanamume kipofu
  rationale: Ingawa maumbo ya Kigiriki ni ya kiume kisarufi, methali ni wakilishi na inatumika kwa jumla. Kiswahili cha kawaida hakihitaji kuingiza jinsia katika nomino “kipofu”; kuongeza “mwanamume” kungebana maana isivyohitajika.
- issue: Uhusiano kati ya viongozi na vipofu
  choice: “viongozi vipofu wa vipofu”
  alternative: “viongozi vipofu” pekee
  rationale: Usomaji wa SBLGNT uliotolewa una τυφλῶν (“wa vipofu”), hivyo maneno hayo yanapaswa kuhifadhiwa katika matini kuu badala ya kuhamishwa kwenye tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha ufupi na ukali wa methali. Alama ya tanbihi [a] imewekwa baada ya “shimoni,” ambako mbadala wake wa kileksia unahusika.
