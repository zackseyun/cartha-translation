  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: sw
  text: Kwa maana Mungu alisema, “Mheshimu baba yako na mama yako,” na, “Yeyote anayesema mabaya juu ya baba yake au mama yake lazima afe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote anayemlaani baba yake au mama yake lazima afe.”
    reason: 'Mbadala wa kileksia: κακολογέω inaweza kumaanisha kusema mabaya dhidi ya, kutukana, au kulaani.'
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Kwa maana Mungu
  rationale: γάρ inaeleza msingi wa hoja ya Yesu; “Kwa maana” huhifadhi nguvu hiyo ya kutoa sababu kwa Kiswahili cha kawaida.
- source_word: εἶπεν
  choice: alisema
  rationale: λέγω hapa inaanzisha nukuu ya Maandiko. “Alisema” hudumisha maana ya moja kwa moja bila kuongeza wazo la “aliamuru.”
- source_word: Τίμα
  choice: Mheshimu
  rationale: τιμάω inadai kumpa mzazi heshima inayomstahili; “mheshimu” ni ya asili na ina uzito unaofaa wa amri.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: baba yako na mama yako
  rationale: Vimilikishi vinaeleweka katika amri iliyonukuliwa na hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: Ὁ κακολογῶν
  choice: Yeyote anayemlaani
  rationale: κακολογέω inaweza kumaanisha kusema mabaya dhidi ya mtu, kumtukana, au kumlaani. Katika muktadha wa sheria iliyonukuliwa, “kumlaani” huwasilisha uzito wa tendo bila kuwa ndefu.
- source_word: πατέρα ἢ μητέρα
  choice: baba au mama yake
  rationale: Kiambishi “yake” kinahitajika kwa Kiswahili cha asili ili kuonyesha uhusiano wa mhusika na wazazi wanaotajwa.
- source_word: θανάτῳ τελευτάτω
  choice: lazima auawe
  rationale: Hii ni fomula ya kisheria ya adhabu ya kifo. Ingawa Kigiriki hakitumii kitenzi mahususi cha kutekeleza hukumu, muktadha wa sheria na msingi wake wa Kiebrania unaonyesha kuuawa, si kufa tu kwa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri fomula ya adhabu ya kifo θανάτῳ τελευτάτω
  choice: lazima auawe
  alternative: lazima afe kabisa
  rationale: “Lazima auawe” huonyesha kwa Kiswahili cha kawaida kuwa hii ni hukumu ya kisheria ya kifo. “Lazima afe kabisa” ingefuata zaidi muundo wa msemo wa Kisemiti, lakini inaweza kueleweka kama kifo cha kawaida na hivyo kuficha nguvu ya kisheria.
- issue: Maana ya κακολογῶν katika sheria iliyonukuliwa
  choice: anayemlaani
  alternative: anayesema mabaya juu ya
  rationale: Neno lina wigo unaojumuisha kutukana na kusema mabaya, lakini katika nukuu hii ya sheria “kumlaani” huhifadhi uzito wa kosa na uhusiano wake na adhabu kali bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa hoja unaoanza na “Kwa maana,” na nukuu mbili zimetolewa kwa uwazi. Hakuna tanbihi iliyoongezwa kwa sababu usomaji mkuu unaweza kuwasilisha maana ya kisheria kwa njia ya moja kwa moja.
