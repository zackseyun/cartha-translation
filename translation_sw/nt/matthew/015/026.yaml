  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: sw
  text: Lakini akajibu, “Haifai kuchukua mkate wa watoto na kuutupa kwa mbwa wadogo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbwa wa nyumbani” au “vitoto vya mbwa”; Kigiriki kinatumia umbo la udogo, ambalo linaweza kudokeza mbwa wadogo au wa nyumbani badala ya mbwa wanaozurura mitaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Muundo huu wa Kigiriki, wenye kitenzi-shirikishi pamoja na kitenzi kikuu, kwa Kiswahili cha kawaida huelezwa kwa kitenzi kimoja. “Akajibu” huhifadhi maana ya kuitikia bila kufanya sentensi kuwa nzito.
- source_word: καλὸν
  choice: haifai
  rationale: Katika msemo huu neno hilo linahusu jambo linalofaa au linalostahili kufanywa, si wema wa kimaadili pekee. “Haifai” ni ya asili katika Kiswahili na huhifadhi maana hiyo.
- source_word: λαβεῖν
  choice: kuchukua
  rationale: Hapa kitenzi hiki kina maana ya kuchukua kitu; “kuchukua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἄρτον
  choice: mkate
  rationale: “Mkate” huhifadhi picha halisi ya sitiari badala ya kuipanua kiufafanuzi kuwa “chakula.”
- source_word: τέκνων
  choice: wa watoto
  rationale: τέκνα ni neno jumuishi kwa watoto, wala halimaanishi wana wa kiume pekee. Muundo “mkate wa watoto” unaonyesha uhusiano wa kimilikishi kwa Kiswahili cha kawaida.
- source_word: βαλεῖν
  choice: kuwatupia
  rationale: Kitenzi βάλλω kina maana ya kutupa. “Kuwatupia” huhifadhi nguvu ya picha na pia huonyesha kwamba mbwa ndio wanaopokea mkate huo.
- source_word: κυναρίοις
  choice: mbwa wadogo
  rationale: Umbo la udogo katika Kigiriki linaweza kudokeza mbwa wadogo au mbwa wa nyumbani. “Mbwa wadogo” huhifadhi kidokezo hicho bila kuamua kwa uhakika aina ya mbwa inayokusudiwa.
theological_decisions:
- issue: Kuhifadhi sitiari ya watoto na mbwa bila kuingiza maelezo ya ziada kuhusu utambulisho wa wanaowakilishwa au sauti ya msemaji.
  choice: Sitiari imehifadhiwa moja kwa moja kama “mkate wa watoto” na “mbwa wadogo.”
  alternative: “Haifai kuchukua chakula cha watoto na kuwapa watu wengine,” au “Haifai kuchukua mkate wa watoto na kuwatupia mbwa wa nyumbani.”
  rationale: Mstari wenyewe hautaji wazi wale wanaowakilishwa na watoto na mbwa. Tafsiri ya moja kwa moja huhifadhi picha, ukali, na mvutano wa kauli ili muktadha ndio uongoze uelewaji wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Haifai” ni ya kawaida na fasaha, huku “kuwatupia” ikihifadhi uhai wa picha ya Kigiriki. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “mbwa wadogo.”
