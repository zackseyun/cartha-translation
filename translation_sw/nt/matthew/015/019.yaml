  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: sw
  text: Kwa maana moyoni hutoka mawazo maovu, mauaji, uzinzi, uasherati, wizi, ushahidi wa uongo na matukano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, makufuru. Neno la Kigiriki linaweza kumaanisha matukano dhidi ya watu au maneno ya kumkufuru Mungu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Kwa maana moyoni
  rationale: γάρ ina nguvu ya kutoa sababu au maelezo, huku ἐκ ikionyesha chanzo. ‘Moyoni’ huhifadhi istiari ya moyo kama utu wa ndani na chanzo cha matendo.
- source_word: ἐξέρχονται
  choice: hutoka
  rationale: Huwasilisha kwa kawaida tendo la kutoka au kuanzia katika chanzo; hali ya mazoea ya ‘hu-’ inafaa kwa kauli hii ya jumla.
- source_word: διαλογισμοὶ πονηροί
  choice: mawazo maovu
  rationale: Ni tafsiri ya kawaida na wazi inayohifadhi wigo wa mawazo, tafakari na makusudio bila kuifanya iwe mipango mahsusi tu.
- source_word: φόνοι
  choice: uuaji
  rationale: ‘Uuaji’ hubeba uzito wa kuondoa uhai kinyume cha haki kuliko neno pana zaidi ‘mauaji’; umoja wa dhana ni wa kawaida katika orodha ya maovu kwa Kiswahili.
- source_word: μοιχεῖαι
  choice: uzinzi
  rationale: Neno hili humaanisha mahusiano ya kingono yanayovunja uaminifu wa ndoa na linatofautishwa na neno pana linalofuata.
- source_word: πορνεῖαι
  choice: uasherati
  rationale: ‘Uasherati’ ni neno pana la mwenendo haramu wa kingono na linafaa kwa wingi wa maana wa πορνεῖαι.
- source_word: κλοπαί
  choice: wizi
  rationale: Ni nomino ya kawaida na fupi kwa matendo ya kuiba, inayofaa katika mtindo wa orodha.
- source_word: ψευδομαρτυρίαι
  choice: ushahidi wa uongo
  rationale: Huhifadhi maana ya kutoa ushuhuda usio wa kweli, pamoja na ladha yake ya kimahakama au ya kuthibitisha jambo.
- source_word: βλασφημίαι
  choice: uchongezi[a]
  rationale: Katika orodha hii ya jumla, neno la Kigiriki linaweza kumaanisha maneno ya kumharibia mtu sifa; ‘uchongezi’ ni la kawaida na wazi. Alama ya tanbihi huhifadhi uwezekano wa maana ya makufuru dhidi ya Mungu.
theological_decisions:
- issue: Wigo wa βλασφημίαι katika orodha ya maovu
  choice: uchongezi
  alternative: makufuru
  rationale: Muktadha hautaji wazi mlengwa wa maneno hayo. Tafsiri kuu inaonyesha madhara ya usemi dhidi ya watu, huku tanbihi ikihifadhi uwezekano wa usemi wa kumkufuru Mungu bila kuondoa utata wa neno la asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetumia nomino za dhana zilizo za kawaida kwa Kiswahili badala ya kulazimisha wingi wa kisarufi wa Kigiriki. ‘Moyoni’ huhifadhi istiari ya kibiblia kwa lugha nyepesi.
