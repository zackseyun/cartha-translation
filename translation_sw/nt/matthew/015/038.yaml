  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: sw
  text: Waliokula walikuwa wanaume elfu nne, bila kuhesabu wanawake na watoto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Waliokula
  rationale: δέ ni kiunganishi hafifu; katika Kiswahili mtiririko ni wa kawaida bila kukitafsiri kwa neno la ziada. Kifungu chenye nomino iliyodokezwa kinaunganishwa na kitenzi kishirikishi kuwa “waliokula.”
- source_word: ἐσθίοντες
  choice: waliokula
  rationale: Ingawa ni kitenzi kishirikishi cha wakati wa sasa kwa umbo, katika muktadha kinarejelea kundi lililokuwa limekula chakula kilichomalizika; “waliokula” ni ya asili na huhifadhi maana hiyo.
- source_word: ἦσαν
  choice: walikuwa
  rationale: Ni kitenzi kishirikishi rahisi kinachotanguliza idadi.
- source_word: τετρακισχίλιοι
  choice: elfu nne
  rationale: Ni tafsiri ya moja kwa moja ya idadi.
- source_word: ἄνδρες
  choice: wanaume
  rationale: Neno hili linawataja wanaume hasa, si watu kwa ujumla; tofauti hiyo ni muhimu kwa kuwa wanawake na watoto wanatajwa kando.
- source_word: χωρὶς
  choice: bila kuhesabu
  rationale: Katika muktadha huu linaonyesha kwamba wanawake na watoto hawakujumuishwa katika idadi ya elfu nne. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: γυναικῶν
  choice: wanawake
  rationale: Maana ya jumla “wanawake” inafaa hapa kuliko “wake,” ambayo ingewahusu walioolewa tu.
- source_word: καὶ παιδίων
  choice: na watoto
  rationale: “Watoto” ni tafsiri wazi isiyobana umri zaidi ya inavyodai muktadha.
theological_decisions:
- issue: Idadi inayowataja wanaume kwa namna mahususi
  choice: Kuhifadhi “wanaume” na kutaja wanawake na watoto kuwa hawakuhesabiwa katika elfu nne.
  alternative: Kutumia “watu” kwa maana jumuishi.
  rationale: Kigiriki kinatumia ἄνδρες, yaani “wanaume,” kisha kinawataja wanawake na watoto kando. “Watu” ingeondoa tofauti halisi ya kileksia katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Bila kuhesabu” hutoa wazi kazi ya χωρίς bila kuhitaji tanbihi ya mbadala.
