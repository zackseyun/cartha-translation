id: MAT.15.11
reference: Matthew 15:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: sw
  text: Si kile kinachoingia kinywani kinachomtia mtu unajisi,[a] bali kile kinachotoka kinywani—hicho ndicho kinachomtia mtu unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachomfanya mtu kuwa najisi.” Kitenzi cha Kigiriki kinaweza kumaanisha kumweka mtu katika hali ya kutokuwa safi kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: kinachomtia mtu unajisi
  rationale: Katika muktadha wa usafi wa kidini, κοινόω humaanisha kumfanya mtu awe najisi. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili, nao huhifadhi maana ya kidini na ya kimaadili bila kuigeuza kuwa suala la uchafu wa kawaida tu.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: kile kinachoingia kinywani
  rationale: Nomino ya kishiriki imetafsiriwa kwa njia ya kawaida kama “kile kinachoingia.” “Kinywani” huwasilisha kwa ufupi na kwa ufasaha wazo la εἰς τὸ στόμα.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: kile kinachotoka kinywani
  rationale: Tafsiri hii ya kawaida huhifadhi picha halisi ya kitu kinachotoka mdomoni bila kutumia maneno mazito yasiyo ya lazima.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ni umoja, ἄνθρωπος hapa humwakilisha mwanadamu yeyote, si mwanamume pekee. “Mtu” ni neno la moja kwa moja, sahihi, na la kawaida katika Kiswahili.
- source_word: τοῦτο
  choice: hicho ndicho
  rationale: 'Muundo huu unaonyesha mkazo wa kiwakilishi cha Kigiriki: hicho, tofauti na kile kinachoingia, ndicho kinachomtia mtu unajisi.'
- source_word: οὐ ... ἀλλὰ
  choice: Si ... bali ...
  rationale: Huu ni muundo wa asili wa Kiswahili unaohifadhi wazi upinzani wa kauli ya Kigiriki.
theological_decisions:
- issue: Lugha ya usafi katika κοινόω
  choice: kumtia mtu unajisi
  alternative: kumfanya mtu kuwa najisi
  rationale: “Kumtia unajisi” huhifadhi mwangwi wa hali ya kutokuwa safi kidini pamoja na uzito wa kimaadili, bila kuifungia kauli kwenye ibada pekee au usafi wa kimwili.
- issue: Nguvu ya uwakilishi ya ἄνθρωπον
  choice: mtu
  alternative: mwanadamu
  rationale: Katika muktadha huu umoja unamhusu mtu yeyote kwa ujumla. “Mtu” huhifadhi umoja na maana jumuishi ya neno la Kigiriki kwa Kiswahili cha kawaida, bila kuongeza tofauti ya kijinsia isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Marudio ya “kinachomtia mtu unajisi” yamehifadhiwa ili kuendeleza ulinganifu na mkazo wa sentensi ya Kigiriki.
