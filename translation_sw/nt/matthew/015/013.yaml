  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: sw
  text: Lakini akajibu, akasema[a], “Kila mmea ambao Baba yangu wa mbinguni hakupanda utang’olewa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kila kilichopandwa ambacho Baba yangu wa mbinguni hakupanda kitang’olewa.”
    reason: Neno la Kigiriki φυτεία linaweza kumaanisha mmea au kitu kilichopandwa.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu, akasema
  rationale: Muundo huu unahifadhi vitenzi vyote vya fomula ya kisimulizi yenye athari ya Kisemiti, huku ukibaki wa kawaida na kueleweka katika Kiswahili.
- source_word: Πᾶσα
  choice: Kila
  rationale: ‘Kila’ huwasilisha vizuri maana ya kugawa mmoja mmoja na kupatana na nomino ya umoja inayofuata.
- source_word: φυτεία
  choice: mmea
  rationale: Neno hilo linaweza kumaanisha kitu kilichopandwa au tendo/zao la kupanda. ‘Mmea’ ni la kawaida katika muktadha huu na linaendana vizuri na kitendo cha kung’olewa; uwezekano wa ‘pandikizo’ umewekwa katika tanbihi.
- source_word: ἐφύτευσεν
  choice: hakupanda
  rationale: Tafsiri ya moja kwa moja inadumisha istiari ya kilimo na uhusiano wa kimsamiati na mmea.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Baba yangu wa mbinguni
  rationale: Huu ni usemi wa asili na wenye heshima katika Kiswahili unaohifadhi umilikaji na sifa ya kuwa wa mbinguni.
- source_word: ἐκριζωθήσεται
  choice: utang’olewa
  rationale: Kitenzi hiki cha wakati ujao na kauli tendwa kinaeleza kuondolewa kwa kuvutwa kutoka mizizini; ‘utang’olewa’ ni wazi na hudumisha taswira ya kilimo na hukumu.
theological_decisions:
- issue: Kirejelewa cha kiistiari cha ‘kila mmea’
  choice: Kudumisha istiara kama ‘Kila mmea’ bila kubainisha ikiwa inarejelea mafundisho, mapokeo, au watu.
  alternative: Kila fundisho; kila pokeo; kila mtu ambaye hakupandwa na Baba.
  rationale: Kigiriki hakibainishi moja kwa moja kirejelewa cha istiara katika muktadha huu. Kudumisha taswira huepuka kuingiza hitimisho la kiufafanuzi na huhifadhi mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Koma kati ya ‘akajibu’ na ‘akasema’ husaidia fomula yenye vitenzi viwili isikike kwa kawaida. Alama ya tanbihi [a] imewekwa katika matini kuu.
