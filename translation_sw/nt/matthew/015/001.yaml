  text: 'Kisha, Mafarisayo na waandishi wa sheria kutoka Yerusalemu wakamjia Yesu, wakisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Ni kiashiria cha wakati kinachoendeleza simulizi kwa lugha ya kawaida na yenye hadhi.
- source_word: προσέρχονται τῷ Ἰησοῦ
  choice: wakamjia Yesu
  rationale: Kitenzi kinaonyesha kwenda karibu na mtu au kumfikia; ‘wakamjia Yesu’ ni Kiswahili asilia na huhifadhi mwelekeo wa tendo.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: kutoka Yerusalemu
  rationale: ἀπό huonyesha asili au mahali walikotoka bila kudokeza zaidi ya maandishi.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Jina la kawaida la Kiswahili kwa kundi hili la kihistoria la Kiyahudi.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika muktadha huu neno linawahusu wataalamu wa maandiko na sheria, si waandishi kwa maana ya jumla; tafsiri hii inaeleweka kwa msomaji wa sasa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha maneno ya moja kwa moja yanayofuata na kudumisha uhusiano wa kishiriki na kitenzi kikuu.
theological_decisions:
- issue: Wakati uliopo wa kihistoria katika simulizi
  choice: Kutumia mfululizo wa simulizi wa Kiswahili (‘wakamjia … wakisema’)
  alternative: Kudumisha wakati uliopo moja kwa moja (‘wanamjia … wakisema’)
  rationale: Ingawa Kigiriki hutumia wakati uliopo wa kihistoria, mfululizo wa ‘waka-’ ni njia ya kawaida na hai ya kusimulia kwa Kiswahili, bila kubadili mpangilio au maana ya matukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waandishi wa sheria’ hutumiwa ili kuonyesha kazi ya γραμματεῖς katika muktadha huu; sentensi inaachwa ikielekea kwenye usemi wa mstari unaofuata.
