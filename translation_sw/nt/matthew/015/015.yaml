  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo mrefu wa Kigiriki ‘akajibu akamwambia’ umefupishwa kuwa ‘akamjibu’ kwa uasilia bila kupoteza maana. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
