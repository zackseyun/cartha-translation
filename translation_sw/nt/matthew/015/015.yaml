lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Lakini Petro akamjibu
  rationale: Muundo wa Kigiriki una maana ya Petro kuitikia kwa kusema. Kiswahili cha sasa hutumia kwa kawaida ‘akamjibu’ badala ya kurudia kwa namna isiyo ya asili ‘akajibu akamwambia.’ ‘Lakini’ linaonyesha badiliko au utofauti mdogo unaoletwa na δέ.
- source_word: Φράσον
  choice: Tufafanulie
  rationale: Kitenzi hiki kinaomba jambo lielezwe au liwekwe wazi. ‘Tufafanulie’ ni ombi la kawaida na linaloeleweka, huku likihifadhi maana ya kumwezesha msikilizaji kuelewa.
- source_word: ἡμῖν
  choice: tu-…-lie
  rationale: Yambwa ‘kwetu’ imewakilishwa kiasili katika muundo wa kitenzi cha Kiswahili ‘tufafanulie.’
- source_word: τὴν παραβολὴν ταύτην
  choice: mfano huu
  rationale: ‘Mfano’ ni neno la kawaida la kibiblia kwa παραβολή katika Kiswahili, na ‘huu’ linaelekeza kwenye usemi uliotangulia mara moja.
theological_decisions: []
