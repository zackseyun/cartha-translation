  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: sw
  text: Lakini Petro akamjibu, “Tufafanulie mfano huu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tuambie maana ya mfano huu” au “Tuwekee wazi mfano huu.”
