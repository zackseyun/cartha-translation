  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: sw
  text: Naye akasema, “Ndiyo, Bwana,[b] kwa maana hata mbwa wadogo[a] hula makombo yanayoanguka kutoka kwenye meza ya mabwana wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbwa,” “mbwa wa nyumbani,” au “watoto wa mbwa”; Kigiriki kinatumia umbo la kudunisha, linaloweza kudokeza mbwa wadogo wa nyumbani.
    reason: lexical_alternative
  - marker: b
    text: “Bwana” hapa linaweza pia kumaanisha “bwana” kama anwani ya heshima, lakini tafsiri inadumisha namna ya kawaida ya kutafsiri κύριος katika Injili.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Ndiyo
  rationale: Ni jibu la kawaida na la moja kwa moja la kukubali, linalohifadhi mwitikio wa mwanamke kwa maneno ya Yesu.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος katika kumwambia Yesu; pia inaweza kuwa namna ya heshima ya kusema “bwana,” hivyo inahifadhi upana wa maana wa neno hilo.
- source_word: καὶ γὰρ
  choice: kwa maana hata
  rationale: '“Kwa maana” linaonyesha hoja ya ufafanuzi, na “hata” linahifadhi nguvu ya kuongeza: mwanamke anakubali mfano huo na kuupanua.'
- source_word: κυνάρια
  choice: mbwa wadogo
  rationale: Nomino ya Kigiriki iko katika umbo la kudunisha, linaloweza kudokeza mbwa wadogo au wa nyumbani. “Mbwa wadogo” linahifadhi dokezo hilo bila kulifanya kuwa “watoto wa mbwa” bila ulazima.
- source_word: ἐσθίει
  choice: hula
  rationale: Wakati wa sasa hapa unaeleza jambo la kawaida. “Hula” ni Kiswahili cha asili kinachofaa kwa tabia ya kawaida ya mbwa.
- source_word: ψιχίων
  choice: makombo
  rationale: “Makombo” ni neno sahihi na la kawaida kwa vipande vidogo vya chakula vinavyoanguka mezani.
- source_word: τῶν πιπτόντων
  choice: yanayoanguka
  rationale: Kishazi hiki kinarekebisha “makombo” na kuhifadhi maana ya kitendo kinachoendelea au kinachotokea kwa kawaida.
- source_word: τραπέζης
  choice: meza
  rationale: Hii ndiyo maana ya kawaida ya neno hilo na inadumisha taswira ya nyumbani katika mfano.
- source_word: τῶν κυρίων αὐτῶν
  choice: mabwana wao
  rationale: Katika mfano huu κύριος inawahusu wenye mamlaka juu ya mbwa. “Mabwana wao” linahifadhi uhusiano huo vizuri kuliko “wamiliki wao,” ingawa kwa Kiswahili linaweza pia kueleweka kuwa wenye mbwa.
theological_decisions:
- issue: Tafsiri ya κύριε katika kumwambia Yesu moja kwa moja
  choice: Bwana
  alternative: bwana (jina la heshima, sawa na “sir”)
  rationale: “Bwana” linadumisha tafsiri ya kawaida ya κύριος katika Injili na uwezekano wa kutambua mamlaka ya Yesu, huku tanbihi ikionyesha kwamba linaweza pia kuwa jina la heshima.
- issue: Kuhifadhi nguvu ya umbo la kudunisha katika κυνάρια
  choice: mbwa wadogo
  alternative: mbwa; mbwa wa nyumbani; watoto wa mbwa
  rationale: Chaguo hili linahifadhi dokezo la umbo la Kigiriki bila kuondoa ukali wa mfano wala kuufanya mkali kuliko ulivyo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hula” limetumiwa kwa maana ya tendo la kawaida, na “kutoka kwenye meza” ni usemi wa kawaida unaohifadhi taswira ya chanzo cha makombo. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
