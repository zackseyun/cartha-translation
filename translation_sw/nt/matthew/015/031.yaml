base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: sw
  text: Kwa hiyo umati ukastaajabu ulipowaona mabubu[a] wakisema, wenye viungo vilivyolemaa[b] wakiwa wamepona, viwete wakitembea, na vipofu wakiona; nao wakamtukuza Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viziwi.” Neno la Kigiriki linaweza kumaanisha watu wasiosikia au wasioweza kusema; hapa “mabubu” imechaguliwa kwa sababu msisitizo wa karibu ni kwamba walikuwa wakisema.
    reason: lexical_alternative
  - marker: b
    text: Au, “wenye viungo vilivyoharibika.” Neno la Kigiriki linaeleza watu wenye viungo vilivyolemaa au kuharibika ambao waliponywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo ya uponyaji uliotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: τὸν ὄχλον
  choice: umati
  rationale: Ni neno la kawaida la Kiswahili kwa kundi kubwa la watu katika mazingira haya ya simulizi.
- source_word: θαυμάσαι
  choice: ukastaajabu
  rationale: Linawasilisha mshangao mkubwa uliotokana na yale ambayo umati uliona.
- source_word: βλέποντας
  choice: ulipowaona
  rationale: Kirai hiki kinaonyesha kwamba kuona miujiza ndiko kulikosababisha umati kustaajabu.
- source_word: κωφοὺς
  choice: mabubu
  rationale: Ingawa κωφός inaweza kumaanisha viziwi au mabubu, neno linalofuata, λαλοῦντας, linaelekeza hasa kwa watu ambao hawakuweza kusema.
- source_word: λαλοῦντας
  choice: wakisema
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uwezo wao wa kusema baada ya kuponywa.
- source_word: κυλλοὺς
  choice: wenye viungo vilivyolemaa
  rationale: Inaeleza kwa uwazi watu waliokuwa na viungo vilivyoharibika au visivyofanya kazi vizuri bila kuchanganya kundi hili na χωλοί.
- source_word: ὑγιεῖς
  choice: wakiwa wazima
  rationale: 'Inahifadhi hali inayoelezwa na kivumishi cha Kigiriki: viungo vyao vilikuwa vimepona na kuwa salama.'
- source_word: χωλοὺς
  choice: viwete
  rationale: Ni neno fupi na linaloeleweka kwa watu ambao hawakuweza kutembea vizuri.
- source_word: περιπατοῦντας
  choice: wakitembea
  rationale: Katika orodha hii ya uponyaji, maana halisi ya kutembea ndiyo inayokusudiwa.
- source_word: τυφλοὺς βλέποντας
  choice: vipofu wakiona
  rationale: Inafuata kwa ukaribu utofautishaji wa Kigiriki kati ya upofu wa awali na uwezo wa kuona uliorejeshwa.
- source_word: ἐδόξασαν
  choice: wakamtukuza
  rationale: Linabeba maana ya kumpa Mungu utukufu na heshima kwa sababu ya matendo waliyoona.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Mungu wa Israeli
  rationale: Inahifadhi kwa usahihi utambulisho wa Mungu katika matini ya Kigiriki.
theological_decisions:
- issue: Maana ya κωφοὺς katika kirai κωφοὺς λαλοῦντας
  choice: mabubu wakisema
  alternative: viziwi wakisema
  rationale: κωφός inaweza kutaja mtu asiyeweza kusikia au asiyeweza kusema. Kwa kuwa msisitizo wa karibu ni kwamba walikuwa wakisema, tafsiri kuu inachagua “mabubu,” huku maana nyingine ikihifadhiwa katika tanbihi.
- issue: Maana ya δοξάζω kuhusu mwitikio kwa Mungu
  choice: wakamtukuza Mungu wa Israeli
  alternative: wakamsifu Mungu wa Israeli
  rationale: “Wakamtukuza” inahifadhi wazo pana la kumpa Mungu utukufu na heshima, si sifa ya maneno pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki karibu na mfuatano wa Kigiriki, lakini umetengenezwa kuwa wa kawaida katika Kiswahili. Utata halisi wa κωφός umehifadhiwa kwa tanbihi.
