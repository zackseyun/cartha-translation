  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: sw
  text: 'Enyi wanafiki, Isaya alitabiri kwa usahihi kuhusu ninyi[a], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitabiri vyema kuhusu ninyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Enyi wanafiki
  rationale: Nomino ya wingi katika hali ya mwito; “Enyi wanafiki” ni karipio la moja kwa moja na lenye nguvu katika Kiswahili cha kawaida.
- source_word: καλῶς
  choice: kwa usahihi
  rationale: Kielezi hiki kinaonyesha kwamba unabii wa Isaya uliwahusu kwa kufaa na kwa kweli. “Kwa usahihi” ni wazi zaidi katika Kiswahili cha sasa kuliko “vyema,” ambalo linaweza kueleweka kama sifa ya namna alivyotabiri.
- source_word: ἐπροφήτευσεν
  choice: alitabiri
  rationale: Ni kitenzi cha wakati uliopita kinachohifadhi maana ya kusema kama nabii na uhusiano wa Isaya na huduma ya kinabii.
- source_word: περὶ ὑμῶν
  choice: kuhusu ninyi
  rationale: “Kuhusu” huwasilisha kwa kawaida maana ya περί pamoja na hali ya umilikaji, huku “ninyi” ikidumisha wingi wa nafsi ya pili.
- source_word: Ἠσαΐας
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: λέγων
  choice: 'akisema:'
  rationale: Kishiriki hiki kinatanguliza dondoo linalofuata; “akisema:” ni fupi, cha asili, na huonyesha wazi mwanzo wa maneno yaliyonukuliwa.
theological_decisions:
- issue: Uzito wa mwito wa Yesu kwa Mafarisayo na waandishi
  choice: 'Karipio la moja kwa moja: “Enyi wanafiki”'
  alternative: Maneno yaliyopunguzwa makali kama “Enyi wanaojifanya”
  rationale: ὑποκριταί ni shtaka kali la kimaadili na kidini katika muktadha huu. Kulainisha neno hilo kungepunguza uzito wa hukumu ya Yesu na uhusiano wake na dondoo la Isaya.
- issue: Maana ya καλῶς kuhusiana na unabii wa Isaya
  choice: “kwa usahihi”
  alternative: “vyema” au “kwa kufaa”
  rationale: Tafsiri hii inaonyesha kwamba unabii huo ulikuwa wa kweli na uliwalenga kwa usahihi, bila kuufanya uwe tu maoni kuhusu ustadi wa Isaya. Tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha ukali wa karipio, mtiririko wa asili wa Kiswahili, na alama ya nukuu inayofuata.
