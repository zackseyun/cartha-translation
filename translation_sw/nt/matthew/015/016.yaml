  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: sw
  text: Naye akasema, “Je, hata ninyi bado hamwelewi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Naye akasema
  rationale: Kifungu hiki kinamtaja Yesu kwa kurejelea muktadha na kuanzisha jibu lake. “Naye” ni simulizi la kawaida la Kiswahili linalowasilisha mpito au utofautishaji mdogo wa δέ bila kuufanya kuwa mkali kupita kiasi.
- source_word: Ἀκμὴν
  choice: bado
  rationale: Hapa neno hili linaonyesha kwamba ukosefu wa kuelewa unaendelea mpaka wakati huo. “Bado” linawasilisha maana hiyo kwa Kiswahili cha kawaida bila kurudia wazo la wakati.
- source_word: καὶ ὑμεῖς
  choice: hata ninyi
  rationale: καί pamoja na kiwakilishi kilichosisitizwa ὑμεῖς inawaingiza wanafunzi wenyewe katika karipio. “Hata ninyi” linahifadhi msisitizo huo kwa ufasaha.
- source_word: ἀσύνετοί ἐστε
  choice: hamwelewi
  rationale: Usemi huu unaonyesha kukosa ufahamu au utambuzi. “Hamwelewi” ni wa moja kwa moja na wa kawaida katika Kiswahili, na haubadilishi karipio hilo kuwa hukumu kali zaidi ya upumbavu wa kimaadili.
theological_decisions:
- issue: Ukali wa karipio la Yesu kwa wanafunzi
  choice: Swali lenye karipio kuhusu kuendelea kwao kutokuelewa
  alternative: Je, hata ninyi bado hamna ufahamu?
  rationale: Tafsiri inadumisha mshangao na karipio la Yesu, lakini haiingizi lugha kali zaidi kama “wapumbavu,” ambayo ingeweza kueleweka kuwa hukumu ya kimaadili badala ya ukosefu wa utambuzi katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Je, hata ninyi bado hamwelewi?” ni wa kawaida, wazi, na unaendeleza msisitizo wa swali la Kigiriki.
