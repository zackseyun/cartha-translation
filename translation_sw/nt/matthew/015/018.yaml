  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: sw
  text: Lakini mambo yanayotoka kinywani hutoka moyoni, na hayo humtia mwanadamu unajisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humfanya mwanadamu kuwa najisi.” Kigiriki kinatumia umoja wenye maana ya kumwakilisha binadamu yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: mambo yanayotoka
  rationale: Kirai hiki ni kivumishi-endelevu cha wingi kinachotumiwa kama nomino. ‘Mambo yanayotoka’ huhifadhi wingi na picha ya kitu kutoka ndani huku kikisikika kwa kawaida katika Kiswahili.
- source_word: στόματος
  choice: kinywani
  rationale: Huhifadhi picha halisi ya kinywa na inafaa katika muktadha wa maneno yanayotamkwa.
- source_word: καρδίας
  choice: moyoni
  rationale: Katika mtazamo wa kibiblia, moyo ni utu wa ndani, kutia ndani mawazo na makusudi ya kimaadili. ‘Moyoni’ huhifadhi taswira hiyo bila kuifafanua kupita maandishi.
- source_word: ἐξέρχεται
  choice: hutoka
  rationale: Kitenzi hiki kinaonyesha chanzo. Kiswahili hutumia kwa kawaida ‘hutoka moyoni,’ na umbo hili pia linaonyesha jambo linalotokea kwa ujumla.
- source_word: κἀκεῖνα
  choice: nayo
  rationale: Neno hili linarejelea mambo yaliyotajwa ambayo hutoka kinywani; ‘nayo’ ni rejeleo fupi na la kawaida la Kiswahili.
- source_word: κοινοῖ
  choice: humtia ... unajisi
  rationale: Katika muktadha wa usafi na unajisi, κοινόω humaanisha kumfanya mtu kuwa najisi. ‘Humtia unajisi’ huhifadhi maana hiyo kwa lugha ya sasa na yenye hadhi.
- source_word: ἄνθρωπον
  choice: mwanadamu
  rationale: Umoja huu unamwakilisha binadamu yeyote, wala haumkusudii mwanamume peke yake. ‘Mwanadamu’ huhifadhi umoja na maana pana ya kibinadamu.
theological_decisions:
- issue: Chanzo cha ndani cha unajisi wa kimaadili
  choice: Mambo yanayotoka kinywani yanaelezwa kuwa yanatoka moyoni na ndiyo yanayomtia mwanadamu unajisi.
  alternative: Kuelewa kauli hii kuwa inahusu tu unajisi wa kiibada unaosababishwa na maneno.
  rationale: Muktadha unatofautisha chakula kinachoingia kinywani na mambo yanayotoka ndani. Tafsiri huhifadhi ‘moyo’ na ‘unajisi,’ hivyo haipunguzi kauli iwe ya taratibu za ibada pekee wala kuipanua zaidi ya maandishi.
- issue: Umoja wa kiwakilishi katika ἄνθρωπον
  choice: mwanadamu
  alternative: mtu
  rationale: ‘Mwanadamu’ huhifadhi umoja wa Kigiriki na maana yake ya kumwakilisha yeyote, bila kuifanya kauli ionekane kuwa inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Marudio ya ‘yanayotoka ... hutoka’ yanahifadhi msisitizo na taswira ya maandishi ya Kigiriki bila kuwa mazito.
