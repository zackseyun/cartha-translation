source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: sw
  text: Makutano mengi yakamjia, yakiwaleta watu wasiosema[a], vipofu, viwete, wenye ulemavu wa viungo[b], na wengine wengi. Yakawaweka miguuni pake, naye akawaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasiosikia.” Neno la Kigiriki linaweza kumaanisha watu wasiosikia, wasiosema, au wenye hali zote mbili, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, watu wenye viungo vilivyolemaa, vilivyoharibika, au visivyokuwa kamili.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: ukamjia
  rationale: Kitenzi hiki kina maana ya kumwendea au kumkaribia mtu. “Ukamjia” ni simulizi la kawaida na fasaha katika Kiswahili.
- source_word: ὄχλοι πολλοὶ
  choice: umati mkubwa
  rationale: Ingawa Kigiriki kina wingi wa “makutano,” Kiswahili cha kawaida hutumia “umati mkubwa” kwa mkusanyiko mkubwa wa watu bila kupotosha maana.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: ukiwaleta
  rationale: Kwa muktadha, umati ulikuwa nao watu hao kwa kuwa uliwaleta kwa Yesu; tafsiri hii huonyesha wazi nguvu ya kishirikishi.
- source_word: κωφούς
  choice: watu wasiosema
  rationale: κωφός inaweza kumaanisha mtu asiyeweza kusikia, kusema, au yote mawili. Maana ya kutosema imewekwa katika matini, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: τυφλούς
  choice: vipofu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa watu wasioona.
- source_word: χωλούς
  choice: viwete
  rationale: Neno hili linaonyesha watu wenye tatizo la kutembea na linaendana kwa ufupi na χωλούς katika orodha.
- source_word: κυλλούς
  choice: wenye ulemavu wa viungo
  rationale: κυλλός hurejelea viungo vilivyolemaa, kuharibika, au kutokuwa kamili. Usemi huu ni mpana, wazi, na wenye heshima katika Kiswahili cha sasa.
- source_word: ἑτέρους πολλούς
  choice: wengine wengi
  rationale: Tafsiri ya moja kwa moja na ya kawaida kwa watu wengine wengi ambao hawakutajwa katika orodha.
- source_word: ἔρριψαν
  choice: wakawaweka
  rationale: Ingawa kitenzi kinaweza kumaanisha “kutupa,” katika muktadha huu kinaeleza kuwaweka wagonjwa mbele ya Yesu. “Wakawaweka” huepuka kudokeza ukatili usiolazimishwa na muktadha.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: miguuni pake
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya kuwaweka karibu sana na miguu ya Yesu.
- source_word: ἐθεράπευσεν αὐτούς
  choice: akawaponya
  rationale: “Kuponya” ni tafsiri ya kawaida ya θεραπεύω katika masimulizi ya uponyaji na kiambishi “-wa-” huonyesha wazi kuwa aliwaponya watu hao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Orodha imetumia majina ya kawaida ya hali za ulemavu, huku “wenye ulemavu wa viungo” ikiepuka neno lenye ukali na kuhifadhi upana wa κυλλούς.
