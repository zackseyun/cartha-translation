  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: sw
  text: Wanafunzi wakamwambia, “Tutapata wapi, mahali hapa pasipo na watu, mikate mingi kiasi hiki ya kuushibisha umati mkubwa kiasi hiki?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: wakamwambia
  rationale: Wakati uliopo wa kihistoria katika simulizi la Kigiriki umetafsiriwa kwa wakati uliopita wa kisimulizi katika Kiswahili; kiambishi cha umoja kinarejelea Yesu.
- source_word: οἱ μαθηταί
  choice: Wanafunzi
  rationale: Kundi hilo tayari linajulikana katika muktadha; Kiswahili hakihitaji kuongeza ‘wake,’ ambalo halipo wazi katika chanzo.
- source_word: Πόθεν ἡμῖν
  choice: Tutapata wapi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza chanzo cha kile ambacho wanafunzi wangekuwa nacho, bila kuongeza chanzo kisichotajwa.
- source_word: ἐν ἐρημίᾳ
  choice: katika eneo hili lisilo na watu
  rationale: ἐρημία hapa ni eneo la upweke au lisilokaliwa; tafsiri hii inaepuka kudokeza lazima jangwa la mchanga na inaeleza mazingira kwa Kiswahili cha kawaida.
- source_word: ἄρτοι τοσοῦτοι
  choice: mikate mingi namna hii
  rationale: Nomino iko katika wingi na τοσοῦτοι inasisitiza kiasi; ‘mikate mingi namna hii’ huhifadhi umbo hilo badala ya kulifanya tu ‘chakula cha kutosha.’
- source_word: ὥστε χορτάσαι
  choice: hata kuushibisha
  rationale: Muundo huu unaeleza matokeo au uwezo unaokusudiwa, na χορτάσαι humaanisha kulisha mpaka kushiba.
- source_word: ὄχλον τοσοῦτον
  choice: umati mkubwa namna hii
  rationale: Huhifadhi nomino ya umoja ya mkusanyiko na msisitizo wa ukubwa unaotolewa na τοσοῦτον.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Eneo hili lisilo na watu’ ni wazi kwa msomaji wa kawaida na halibani maana ya ἐρημία kuwa jangwa la aina fulani.
