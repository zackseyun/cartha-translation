  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: sw
  text: ‘Watu hawa huniheshimu kwa midomo yao, lakini moyo wao[a] uko mbali nami.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mioyo yao.” Kigiriki kina “moyo” katika umoja; yaelekea limetumiwa kwa maana ya pamoja kuhusu watu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Watu hawa
  rationale: Neno λαός linamaanisha watu kama kundi, na hawa linahifadhi nguvu ya kiashiria οὗτος kwa Kiswahili cha kawaida.
- source_word: τοῖς χείλεσίν
  choice: kwa midomo yao
  rationale: Dativu inaonyesha chombo; kauli hii inadumisha taswira halisi ya midomo badala ya kuibadili kuwa maneno au usemi.
- source_word: με
  choice: ni-
  rationale: Kiwakilishi cha nafsi ya kwanza kama yambwa kimeunganishwa kiasili katika kitenzi cha Kiswahili huniheshimu.
- source_word: τιμᾷ
  choice: huniheshimu
  rationale: Kitenzi τιμάω hapa ni kumpa mtu heshima. Hali ya mazoea huwasilisha tabia inayokosolewa katika muktadha.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: lakini moyo wao
  rationale: Moyo umeachwa katika umoja kama ilivyo καρδία ya Kigiriki, huku wao ikionyesha kuwa ni moyo wa watu hao kwa maana ya pamoja.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: uko mbali nami
  rationale: Hii ni kauli ya kawaida na ya asili ya Kiswahili inayoonyesha umbali wa kimahusiano bila kuongeza maana ya kujitenga kwa hiari.
theological_decisions:
- issue: Umoja wa pamoja wa ‘moyo’ dhidi ya wingi unaogawa kwa watu mmoja mmoja
  choice: moyo wao
  alternative: mioyo yao
  rationale: Umoja καρδία unawasilisha watu kama kundi lenye msimamo mmoja wa ndani. Kuudumisha kunahifadhi mvutano na nguvu ya nukuu bila kuisawazisha kwa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa kishairi wa nukuu na taswira ya ‘midomo’ dhidi ya ‘moyo’ vimedumishwa.
