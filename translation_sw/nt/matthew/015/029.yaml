  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: sw
  text: Baada ya kuondoka huko, Yesu akaenda kandokando ya Bahari ya Galilaya[a]; na baada ya kupanda mlimani, alikuwa ameketi huko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafika kando ya Bahari ya Galilaya.” Kihusishi cha Kigiriki kinaweza kuonyesha mwendo kandokando ya ufuo au kufika mahali karibu na ufuo.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaketi huko.” Wakati usiotimilifu wa Kigiriki unaweza kutafsiriwa kwa urahisi zaidi, lakini “alikuwa ameketi” huonyesha vizuri hali iliyoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: akaondoka huko
  rationale: Muundo huu wa masimulizi unaonyesha Yesu akiondoka mahali alipokuwa na kuendelea na safari, huku ukidumisha mfuatano wa tendo la awali kabla ya kufika baharini.
- source_word: ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: akaenda kandokando ya Bahari ya Galilaya
  rationale: Kitenzi cha mwendo pamoja na παρά yenye hali ya kushutumiwa kinaweza kueleza mwendo kandokando ya ufuo au kufika karibu nao. Tafsiri kuu inaonyesha mwendo kandokando, na tanbihi inadumisha uwezekano wa maana ya kufika kando ya bahari.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: akapanda mlimani
  rationale: Hii ni Kiswahili cha kawaida na cha moja kwa moja kwa kupanda kwenda kwenye mlima au mteremko wake; kiambishi -ni kinawasilisha mahali pa kwenda bila kulazimisha kwamba mlima huo ulikuwa na jina maalumu.
- source_word: ἐκάθητο ἐκεῖ
  choice: kuketi huko
  rationale: ‘Kuketi’ huonyesha hali ya kuwa katika nafasi ya kukaa. Muundo wa sentensi unaendeleza masimulizi kwa Kiswahili cha asili, huku tanbihi ikibainisha kwamba njeo ya Kigiriki inaweza kusisitiza hali iliyoendelea.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi mapana ya Kikristo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. ‘Kandokando ya’ ni ya kawaida na inaeleweka kwa wasomaji wengi; ‘mlimani’ ni ya asili zaidi kuliko tafsiri ngumu ya neno kwa neno.
