  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: sw
  text: Yesu akawaambia, “Mna mikate mingapi?” Wakasema, “Saba, na samaki wadogo wachache.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita. Kitenzi “akawaambia” pia kinajumuisha kiwakilishi αὐτοῖς kwa njia ya kawaida na ya wazi.
- source_word: Πόσους ἄρτους
  choice: mikate mingapi
  rationale: ἄρτους ni wingi wa kitu kinachohesabika; “mikate mingapi” ni Kiswahili cha kawaida na huhifadhi swali la idadi.
- source_word: ἔχετε
  choice: mna
  rationale: “Mna” ni usemi mfupi na wa kawaida wa kuuliza kile walicho nacho katika wakati huo.
- source_word: οἱ δὲ εἶπαν
  choice: Wakasema
  rationale: δέ hapa inaendeleza simulizi bila kuonyesha upinzani mkali; “wakasema” huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: Ἑπτά
  choice: Saba
  rationale: Ni tafsiri ya moja kwa moja ya namba hiyo, huku nomino “mikate” ikieleweka kutokana na swali lililotangulia.
- source_word: ὀλίγα ἰχθύδια
  choice: samaki wadogo wachache
  rationale: ὀλίγα huonyesha idadi ndogo, na umbo la udogo ἰχθύδια linaweza kuwasilishwa kwa kawaida kama “samaki wadogo.”
