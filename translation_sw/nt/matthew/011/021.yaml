  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: sw
  text: Ole wako, Korazini! Ole wako, Bethsaida! Kwa maana, kama matendo ya nguvu[a] yaliyofanyika miongoni mwenu yangalifanyika katika Tiro na Sidoni, watu wa huko wangalitubu zamani kwa kuvaa nguo za magunia na kujipaka majivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza”; Kigiriki kina maana ya “matendo ya nguvu” au “matendo yenye nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ole wako
  rationale: Kauli hii ya moja kwa moja inahifadhi uzito wa onyo la kinabii pamoja na huzuni yake; umoja wa σοι umehifadhiwa kwa kuwa kila mji unaambiwa mmoja mmoja.
- source_word: Χοραζίν
  choice: Korazini
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: Βηθσαϊδά
  choice: Bethsaida
  rationale: Jina la mahali limeandikwa kwa umbo linalotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: αἱ δυνάμεις
  choice: matendo ya nguvu
  rationale: Hili linahifadhi maana ya matendo yanayoonyesha nguvu za Mungu bila kuibana mapema kuwa neno la kiufundi ‘miujiza’; mbadala huo umeelezwa katika tanbihi.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Wingi wa ὑμῖν unawahusu watu wa miji hiyo, na kifungu hiki huonyesha matendo yaliyotendeka katikati yao, si ndani yao binafsi.
- source_word: πάλαι
  choice: zamani
  rationale: Neno hili linaonyesha kwamba toba hiyo ingalitokea muda mrefu kabla ya wakati wa usemi.
- source_word: μετενόησαν
  choice: wangalitubu
  rationale: Hili ni neno la kawaida na sahihi la Kiswahili kwa kugeuka kwa toba; umbo la masharti linaakisi kauli ya hali isiyotokea.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: wakiwa katika nguo za magunia na majivu
  rationale: Taswira ya kitamaduni ya maombolezo na toba imehifadhiwa bila kuongeza kitendo maalumu kisichotajwa, kama kuketi au kujipaka majivu.
theological_decisions:
- issue: Asili ya ulinganisho wa Yesu kuhusu Tiro na Sidoni
  choice: Kauli halisi ya kuonyesha hatia kubwa zaidi ya miji iliyoona matendo ya nguvu lakini haikutubu
  alternative: Kutafsiri kauli hiyo kama kutia chumvi kwa balagha tu bila hukumu ya kulinganisha
  rationale: Muundo wa masharti usiotokea unaonyesha kwamba watu wa Tiro na Sidoni wangalitubu katika hali hiyo. Tafsiri inahifadhi dai hilo na uzito wa hukumu bila kuongeza hitimisho la kimadhehebu.
- issue: Wanaorejelewa na wingi katika ‘wangalitubu’
  choice: watu wa huko
  alternative: kuacha kiwakilishi pekee bila kutaja wanaorejelewa
  rationale: Katika Kigiriki, miji ya Tiro na Sidoni inasimama kwa niaba ya wakazi wake. ‘Watu wa huko’ huweka rejeo hilo wazi kwa Kiswahili cha kawaida bila kubadili maana ya kitamathali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Miundo ‘yangalifanyika’ na ‘wangalitubu’ imetumiwa kuhifadhi hali ya masharti isiyotokea; majina Korazini, Bethsaida, Tiro na Sidoni yamefuata maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili.
