  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: sw
  text: Na ikiwa mko tayari kulikubali,[a] yeye ndiye Eliya atakayekuja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mko tayari kulipokea.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Yohana Mbatizaji anatambulishwa kuwa mtangulizi aliyeahidiwa, mwenye huduma kama ya Eliya; linganisha Malaki 4:5 na Mathayo 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: ikiwa mko tayari kulikubali jambo hili
  rationale: Muundo huu unaonyesha utayari wa wasikilizaji kupokea kauli ya Yesu, si tamaa tu. Kirai “jambo hili” kinawekwa wazi kwa njia ya kawaida katika Kiswahili ingawa yambwa limeachwa kudokezwa katika Kigiriki.
- source_word: αὐτός
  choice: yeye ndiye
  rationale: Kiwakilishi kinamrejelea Yohana Mbatizaji. “Yeye ndiye” ni cha kawaida katika Kiswahili na kinahifadhi mkazo wa utambulisho unaowezekana katika αὐτός.
- source_word: ἐστιν Ἠλίας
  choice: ndiye Eliya
  rationale: Tafsiri hii inahifadhi utambulisho wa moja kwa moja uliopo katika Kigiriki bila kuupunguza kuwa kufanana tu au kutekeleza jukumu fulani.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: atakayekuja
  rationale: Kirai hiki kinahifadhi matarajio ya wakati ujao yanayotokana na unabii na kinamtambulisha Eliya kama yule aliyekuwa ametazamiwa kuja, bila kuongeza ufafanuzi ndani ya andiko.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinahifadhi uhusiano wa sentensi hii na yaliyotangulia bila kufasiri zaidi aina ya uhusiano huo.
theological_decisions:
- issue: Kutambulishwa kwa Yohana Mbatizaji kuwa Eliya
  choice: Kauli imetafsiriwa moja kwa moja kuwa “yeye ndiye Eliya atakayekuja,” pamoja na sharti “ikiwa mko tayari kulikubali jambo hili.”
  alternative: “Yeye anatimiza jukumu la Eliya” au “yeye ni kama Eliya.”
  rationale: Kigiriki kinatoa utambulisho wa moja kwa moja, lakini Yesu anauweka pamoja na mwito wenye sharti kuhusu kuukubali. Tafsiri inahifadhi nguvu ya utambulisho huo na pia mvutano wa kitafsiri bila kueleza kikamilifu jinsi unavyohusiana na unabii wa Malaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. “Mko tayari” ni ya kawaida kuliko tafsiri ya neno kwa neno ya kutaka, na “jambo hili” husaidia sentensi kuwa wazi bila kuondoa uwezekano wa “kulipokea” ulioonyeshwa katika tanbihi.
