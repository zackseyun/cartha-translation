  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: sw
  text: Lakini mlitoka kwenda kuona nini? Mtu aliyevaa mavazi laini?[a] Tazama, wale wanaovaa mavazi laini wako katika nyumba za wafalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyevaa mavazi ya fahari.” Kigiriki kinasema kihalisi “mavazi laini,” kwa maana ya mavazi maridadi au ya anasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wako katika majumba ya kifalme.” Kigiriki kinasema kihalisi “katika nyumba za wafalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza utofautishaji wa maswali ya balagha ya Yesu kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: mlitoka kwenda kuona nini
  rationale: Muundo huu unaonyesha kusudi la kutoka na kuhifadhi swali la moja kwa moja linaloulizwa kwa kutumia τί, ‘nini.’
- source_word: ἄνθρωπον
  choice: Mtu
  rationale: Nomino hii inamtaja mtu mmoja, na katika muktadha inamhusu Yohana. ‘Mtu’ ni tafsiri ya kawaida ya Kiswahili bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: aliyevaa mavazi laini
  rationale: Kitenzi kishirikishi kina maana ya kuwa amevikwa au amevaa, huku μαλακοῖς ikimaanisha kihalisi vitu au mavazi laini. Usemi huu unahifadhi picha halisi na dokezo la mavazi ya fahari linafafanuliwa katika tanbihi.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili linavuta usikivu wa wasikilizaji na kuhifadhi nguvu ya balagha bila kutumia lugha ya kizamani.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: wale wanaovaa mavazi laini
  rationale: φοροῦντες hudokeza desturi ya kuvaa. Kurudia ‘mavazi laini’ kunahifadhi urudiaji wa λεksimu μαλακός katika Kigiriki.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: wako katika nyumba za wafalme
  rationale: Tafsiri hii inahifadhi wingi wa ‘nyumba’ na ‘wafalme’ kama ulivyo katika Kigiriki, huku ikibaki wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Urudiaji wa ‘mavazi laini’ na usemi ‘nyumba za wafalme’ umehifadhiwa ili kuakisi muundo wa Kigiriki; tanbihi zinatoa misemo ya Kiswahili inayoweka wazi dokezo la anasa na mazingira ya kifalme.
