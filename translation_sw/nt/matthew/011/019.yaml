  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: sw
  text: Mwana wa Adamu alikuja akila na kunywa, nao wanasema, “Tazama, mlafi na mlevi, rafiki wa watoza ushuru na wenye dhambi!” Na hekima ilithibitishwa kuwa sahihi[a] kwa matendo yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekima ilionyeshwa kuwa sahihi kwa matendo yake.”
    reason: lexical_alternative
  - marker: b
    text: 'Baadhi ya hati zina “watoto” badala ya “matendo”: “hekima ilithibitishwa kuwa sahihi kwa watoto wake.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri ya kawaida ya cheo hiki cha kujirejelea, inayohifadhi usuli wake wa Kisemiti na uzito wake wa kimasihi bila kukifafanua kupita maandishi.
- source_word: ἐσθίων καὶ πίνων
  choice: akila na kunywa
  rationale: Hutoa kwa lugha ya kawaida shughuli zinazotajwa na vihusishi hivi na kuhifadhi tofauti na maisha ya kujinyima ya Yohana katika muktadha.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi nguvu ya mshangao na ya kuvuta fikira katika shutuma ya hadharani kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: φάγος
  choice: mlafi
  rationale: Ni nomino ya dharau inayodokeza ulaji wa kupindukia, si maelezo yasiyoegemea upande wowote.
- source_word: οἰνοπότης
  choice: mlevi
  rationale: Huhifadhi shutuma ya unywaji wa kupindukia badala ya kuitafsiri kwa maana isiyo na lawama kama mtu anayekunywa divai.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: rafiki wa watoza ushuru na wenye dhambi
  rationale: Huhifadhi muundo na uzito wa kijamii na kidini wa majina haya; “wenye dhambi” ni Kiswahili cha kawaida na chenye heshima zaidi kuliko kuwatambulisha watu moja kwa moja kama “wadhambi.”
- source_word: ἐδικαιώθη
  choice: ilithibitishwa kuwa ya haki
  rationale: Katika muktadha huu kitenzi kina maana ya kuonyeshwa au kuthibitishwa kuwa sahihi/haki. Tafsiri hii ni ya asili kwa Kiswahili huku ikidumisha wazo la δικαιόω.
- source_word: ἡ σοφία
  choice: hekima
  rationale: Neno limehifadhiwa bila kulifafanua kuwa Yesu, mpango wa Mungu, au dhana nyingine maalumu.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: kwa matendo yake
  rationale: Hutoa maana ya kwamba matendo ndiyo yanayoonyesha hekima kuwa ya haki, huku ikihifadhi uhusishaji wa hekima kama mhusika.
theological_decisions:
- issue: Maana ya “hekima” katika kishazi cha mwisho
  choice: Kuhifadhi usemi “hekima” bila kuitambulisha wazi kuwa Yesu, hekima ya Mungu, au mpango wa Mungu.
  alternative: Kuitafsiri hekima kuwa Yesu mwenyewe au mpango wa Mungu wa wokovu.
  rationale: Maandishi yana usemi unaoipa hekima sifa za mhusika; kuuhifadhi hudumisha mvutano wa kifasihi na kiteolojia bila kulazimisha fasiri finyu.
- issue: Namna ya maandishi katika kishazi cha mwisho
  choice: Kufuata usomaji wa SBLGNT, “matendo” (ἔργων), katika maandishi makuu.
  alternative: “Watoto” (τέκνων), kama katika Luka 7:35 na baadhi ya mashahidi wa Mathayo.
  rationale: Chanzo kilichotolewa kinasoma ἔργων; tofauti muhimu ya “watoto” imehifadhiwa katika tanbihi kwa uwazi wa kiuhakiki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” huhifadhi nguvu ya Ἰδοὺ bila kuwa cha kizamani kupita kiasi. Alama zote za tanbihi zimewekwa katika maandishi makuu kwenye kishazi kinachohusika.
