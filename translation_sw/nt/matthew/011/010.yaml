id: MAT.11.10
reference: Matthew 11:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: sw
  text: 'Huyu ndiye yule ambaye imeandikwa kumhusu: “Tazama, ninamtuma mjumbe wangu mbele ya uso wako[a], atakayeitayarisha njia yako mbele yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kawaida zaidi, “mbele yako.” Kigiriki kinahifadhi usemi halisi zaidi, “mbele ya uso wako,” kutoka katika nukuu ya Maandiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Huyu ndiye
  rationale: Muundo huu unatambulisha mtu kwa msisitizo na kwa Kiswahili cha kawaida chenye hadhi.
- source_word: περὶ οὗ γέγραπται
  choice: ambaye habari zake zimeandikwa
  rationale: Unahifadhi maana ya ‘ambaye imeandikwa kumhusu’ kwa Kiswahili sanifu na cha asili, huku kauli ya kunukuu Maandiko ikibaki wazi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno hili linafaa kwa mwito wa kuzingatia jambo katika nukuu ya kinabii na halisikiki la mazungumzo mno.
- source_word: ἀποστέλλω
  choice: ninamtuma
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa kwa namna ya sasa yenye nguvu ya tukio linalofanyika au lililo karibu.
- source_word: ἄγγελόν
  choice: mjumbe
  rationale: Katika muktadha huu neno linamhusu Yohana Mbatizaji kama mtangulizi wa kibinadamu, si lazima kiumbe wa mbinguni.
- source_word: πρὸ προσώπου σου
  choice: mbele ya uso wako
  rationale: Unahifadhi taswira halisi ya Kigiriki na lugha ya nukuu ya Maandiko, ingawa Kiswahili cha kawaida kingesema ‘mbele yako.’
- source_word: κατασκευάσει
  choice: atakayeitayarisha
  rationale: Kitenzi hiki kinaonyesha kwamba mjumbe huyo atafanya njia iwe tayari; umbo la uhusiano linaonyesha wazi mhusika.
- source_word: τὴν ὁδόν σου
  choice: njia yako
  rationale: ‘Njia’ huhifadhi maana ya barabara au njia pamoja na mwangwi wake wa kitamathali.
- source_word: ἔμπροσθέν σου
  choice: mbele yako
  rationale: Hii ni tafsiri ya asili ya mahali au kutangulia, na inadumisha sehemu ya pili ya urudiaji katika nukuu.
theological_decisions:
- issue: Urudiaji wa vifungu viwili vinavyoonyesha kuwa mbele
  choice: Kuhifadhi ‘mbele ya uso wako’ na ‘mbele yako’ katika andiko kuu
  alternative: Kuvifupisha kuwa usemi mmoja kama ‘akikutangulia’
  rationale: Kigiriki kina vifungu vyote viwili, πρὸ προσώπου σου na ἔμπροσθέν σου. Kuvihifadhi kunadumisha muundo na msisitizo wa nukuu bila kuondoa urudiaji wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ na muundo wa nukuu huhifadhi sauti ya kinabii, huku sentensi nyingine ikibaki wazi kwa msomaji wa kawaida.
