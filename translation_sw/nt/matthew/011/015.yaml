id: MAT.11.15
reference: Matthew 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: sw
  text: Mwenye masikio[a], na asikie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote aliye na masikio, na asikie.” Kigiriki kinatumia usemi wa umoja wenye maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Mwenye
  rationale: Kifungu chenye kibainishi na kitenzi-shirikishi kinatumika kama nomino na humrejelea kwa ujumla mtu yeyote mwenye sifa hiyo. “Mwenye” ni ya asili katika Kiswahili na huhifadhi maana hiyo ya jumla bila kulazimisha kiwakilishi cha jinsia.
- source_word: ὦτα
  choice: masikio
  rationale: Neno la Kigiriki liko katika wingi, na “masikio” ni tafsiri ya kawaida na sahihi; pia huhifadhi nahau ya mwito wa kusikia kwa makini na kuitikia.
- source_word: ἀκουέτω
  choice: na asikie
  rationale: Hii ni amri ya nafsi ya tatu, umoja, wakati uliopo. “Na asikie” huiwakilisha kwa njia ya asili na yenye hadhi katika Kiswahili, huku “kusikia” kikiweza kujumuisha kuelewa na kutii bila kuifinya maana kuwa “kusikiliza” tu.
theological_decisions:
- issue: Usemi wa jumla wa umoja wa kiume katika Kigiriki
  choice: Mwenye masikio, na asikie.
  alternative: Yeyote aliye na masikio, na asikie.
  rationale: Muundo wa Kigiriki ni wa umoja na una maana ya jumla. Kiswahili hakihitaji kuonyesha jinsia hapa; “mwenye” huhifadhi umoja na upeo wa jumla bila kuingiza tofauti ya jinsia ambayo muundo wa Kiswahili hauhitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kifupi, cha sasa na chenye hadhi. Muundo “na asikie” huhifadhi nguvu ya amri ya Kigiriki na mwangwi wa usemi wa kibiblia bila kuwa wa kizamani kupita kiasi.
