base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: sw
  text: Lakini nawaambia kwamba siku ya hukumu itakuwa rahisi zaidi kwa nchi ya Sodoma kuliko kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya hukumu itastahimilika zaidi kwa nchi ya Sodoma kuliko kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Katika muktadha huu neno hili linaanzisha tofauti yenye mkazo; “Lakini” ni ya kawaida na ya asili katika Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: ninakuambia
  rationale: Ingawa ὑμῖν ni wingi, muktadha wa karibu unaelekeza kauli kwa Kapernaumu kama mji uliobinafsishwa; Kiswahili hutumia umoja “ninakuambia” kudumisha mwendelezo huo wa moja kwa moja.
- source_word: γῇ Σοδόμων
  choice: nchi ya Sodoma
  rationale: Huhifadhi nomino γῇ, yaani nchi au eneo, badala ya kutaja Sodoma pekee.
- source_word: ἀνεκτότερον
  choice: itavumiliwa kwa urahisi zaidi
  rationale: Muundo huu unaonyesha ulinganisho wa jambo kuwa rahisi zaidi kustahimili katika hukumu, kwa Kiswahili cha asili.
- source_word: ἔσται
  choice: itavumiliwa
  rationale: Maana ya wakati ujao imejumuishwa katika kitenzi cha Kiswahili chenye kiambishi -ta-.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: katika siku ya hukumu
  rationale: Ni tafsiri ya karibu ya muundo wa Kigiriki na inaeleza wazi wakati wa hukumu.
- source_word: ἢ σοί
  choice: kuliko wewe
  rationale: Huhifadhi kiwakilishi cha umoja σοί na namna ya kumsemesha mji moja kwa moja bila kuongeza maelezo ya kiufafanuzi.
theological_decisions:
- issue: Mhusika anayerejelewa kwa σοί ya umoja
  choice: “wewe” ya umoja, ikirejelea Kapernaumu kama mji uliobinafsishwa
  alternative: “ninyi” au “watu wako”
  rationale: Kigiriki kina umoja na kinaendeleza tamko la kinabii kwa mji katika muktadha; umoja huhifadhi nguvu ya usemi bila kuingiza ufafanuzi wa ziada.
- issue: Jinsi ya kueleza tofauti ya hukumu
  choice: “itavumiliwa kwa urahisi zaidi”
  alternative: “itakuwa afadhali zaidi”
  rationale: Chaguo hili huhifadhi wazo la ἀνεκτότερον kwamba hali ya Sodoma itakuwa rahisi zaidi kustahimili, bila kufafanua kiwango au asili ya hukumu kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha usemi wa moja kwa moja kwa mji uliobinafsishwa na tofauti nzito ya siku ya hukumu.
