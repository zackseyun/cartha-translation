review_pass:
  verdict: revise
  source_fidelity: The draft faithfully represents the passive entrustment, the balanced exclusive knowledge clauses, and the Son's volitional revelation. However, the final Swahili verb form leaves the thing/person revealed unexpressed; the Greek context supplies the Father as the object of ἀποκαλύψαι.
  naturalness: The sentence is clear and suitably formal in Standard East African Swahili. Supplying “Baba” after “kumfunulia” makes the final clause complete and unambiguous in natural Swahili.
  terminology: “Baba” and “Mwana” appropriately preserve the reciprocal titular language. “Anachagua” is a sound modern rendering of βούληται. “Kumjua” avoids overstating a lexical intensification that is disputed in this context.
  issues:
  - severity: medium
    issue: The final clause omits the explicit referent of what the Son reveals.
    rationale: In “yeyote ambaye Mwana anachagua kumfunulia,” the object marker in kumfunulia identifies the recipient, but Swahili normally needs the revealed person/content to be stated or otherwise clearly supplied. Adding “Baba” reflects the immediate Greek antecedent τὸν πατέρα and prevents an incomplete or misleading reading.
  revised_text: Nimekabidhiwa vitu vyote na Baba yangu, na hakuna mtu anayemjua Mwana isipokuwa Baba; wala hakuna mtu anayemjua Baba isipokuwa Mwana na yeyote ambaye Mwana anachagua kumfunulia Baba.
