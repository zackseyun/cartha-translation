id: MAT.11.27
reference: Matthew 11:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: sw
  text: Nimekabidhiwa vitu vyote na Baba yangu, na hakuna mtu anayemjua Mwana isipokuwa Baba; wala hakuna mtu anayemjua Baba isipokuwa Mwana na yeyote ambaye Mwana anachagua kumfunulia Baba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: vitu vyote
  rationale: Kiambishi cha wingi kisicho na jinsia kina maana pana; “vitu vyote” kinahifadhi upeo huo bila kutaja eneo mahususi.
- source_word: παρεδόθη
  choice: nimekabidhiwa
  rationale: Kauli tendwa ya wakati uliopita inaonyesha kuwa Baba alimkabidhi Mwana vitu vyote; umbo hili la Kiswahili linaeleza tendo lililotimia na hali yake inayoendelea.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: na Baba yangu
  rationale: Katika kauli tendwa, “na” humtambulisha mtendaji kwa Kiswahili cha kawaida; “Baba” ni cheo cha kimahusiano kinachomrejelea Mungu.
- source_word: ἐπιγινώσκει
  choice: anayemjua
  rationale: Katika muktadha huu kitenzi kinaeleza ujuzi wa kibinafsi na wa kipekee. “Anayemjua” ni cha asili na hakiongezi kwa lazima kiimarishi kisicho wazi katika kitenzi chenyewe.
- source_word: τὸν υἱὸν
  choice: Mwana
  rationale: Ni cheo cha Kristo kinacholingana kimahusiano na “Baba.”
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hutoa ubaguzi baada ya kauli hasi kwa njia ya kawaida na sahihi katika Kiswahili.
- source_word: οὐδὲ τὸν πατέρα τις ἐπιγινώσκει
  choice: wala hakuna mtu anayemjua Baba
  rationale: “Wala” linahifadhi urari wa vifungu viwili hasi kuhusu kumjua Mwana na kumjua Baba.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: yeyote ambaye Mwana anachagua kumfunulia
  rationale: “Anachagua” linaonyesha hiari na uamuzi wa Mwana, huku “kumfunulia” likimrejelea Baba kama kile kinachofunuliwa kwa mtu huyo.
- source_word: ἀποκαλύψαι
  choice: kumfunulia
  rationale: Kitenzi hiki kinahifadhi wazo la kufichua au kumwezesha mtu amjue Baba bila upanuzi wa ufafanuzi.
theological_decisions:
- issue: Nguvu ya ἐπιγινώσκω katika kauli za kujuana kwa Baba na Mwana
  choice: anayemjua
  alternative: anayemjua kikamilifu
  rationale: Ingawa ἐπιγινώσκω inaweza katika baadhi ya miktadha kudokeza utambuzi kamili au wa ndani, hapa “kumjua” kinahifadhi maana ya msingi na upekee unaoonyeshwa tayari na “hakuna mtu ... isipokuwa,” bila kuamua kimya kimya kiwango ambacho kitenzi hakitaji wazi.
- issue: Lugha ya hiari katika βούληται
  choice: anachagua
  alternative: anataka
  rationale: “Anachagua” linaonyesha kwamba ufunuo hutokana na uamuzi wa Mwana, bila kuugeuza kuwa tamaa tu wala kuingiza mfumo wa kidhehebu.
- issue: Kirejeleo cha kitu kinachofunuliwa katika ἀποκαλύψαι
  choice: kumfunulia
  alternative: kumfunulia huyo
  rationale: Kiambishi “m-” katika “kumfunulia” kinamrejelea Baba aliyetajwa mara moja kabla, kama muktadha wa Kigiriki unavyoonyesha, bila kuongeza nomino nyingine katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi ulinganifu wa Baba na Mwana na upekee wa ufunuo, huku ukisomeka kwa kawaida kwa wasomaji wa leo.
