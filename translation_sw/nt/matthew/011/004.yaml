  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: sw
  text: Naye Yesu akawajibu[a], “Nendeni mkamweleze Yohana mambo mnayosikia na kuyaona:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kigiriki kwa karibu zaidi, “Naye Yesu akijibu akawaambia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumweka Yesu kuwa mhusika wa hatua inayofuata; “Naye” ni Kiswahili cha kawaida na chenye mtiririko mzuri hapa.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: akawajibu
  rationale: Muundo wa Kigiriki “akijibu ... akawaambia” ni fomula ya kisimulizi. “Akawajibu” huhifadhi kazi yake ya kujibu na kwa kawaida huanzisha maneno yanayofuata bila kurudia kitenzi cha kusema.
- source_word: Πορευθέντες
  choice: Nendeni
  rationale: Kivumishi-tendo hiki kinachotangulia amri kina nguvu ya kiamri na kinaonyesha hatua ya kwenda kabla ya kutoa taarifa.
- source_word: ἀπαγγείλατε
  choice: mkamweleze
  rationale: Kitenzi hiki kinamaanisha kupeleka au kurudisha taarifa. Muundo “mkamweleze” unaonyesha kusudi linalofuata baada ya kwenda na unamtaja Yohana kama mpokeaji.
- source_word: Ἰωάννῃ
  choice: Yohana
  rationale: Ni yambwa tendewa katika hali ya dative; kiambishi “-m-” katika “mkamweleze” tayari kinaonyesha maana ya “kwa Yohana,” huku jina likibainisha mpokeaji.
- source_word: ἃ
  choice: mambo
  rationale: Kiwakilishi cha uhusiano cha wingi kisicho na jinsia kinarejelea yale wanayoyashuhudia. “Mambo” ni tafsiri ya asili katika Kiswahili na huepuka muundo mzito wa “vitu ambavyo.”
- source_word: ἀκούετε
  choice: mnayosikia
  rationale: Wakati wa sasa unaonyesha mambo wanayosikia sasa; muundo wa uhusiano unaunganisha kwa kawaida na “mambo.”
- source_word: βλέπετε
  choice: kuyaona
  rationale: Kitenzi hiki kimeunganishwa na “mnayosikia” chini ya “mambo”; kiwakilishi “-ya-” hurejelea mambo hayo na huhifadhi maana ya kuona kwao wenyewe.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa.
theological_decisions:
- issue: Uwasilishaji wa fomula ἀποκριθεὶς ... εἶπεν
  choice: Naye Yesu akawajibu
  alternative: Naye Yesu akijibu akawaambia
  rationale: Chaguo kuu ni la asili katika Kiswahili na linahifadhi kwamba Yesu alitoa jibu. Chaguo la pili linafuata umbo la Kigiriki kwa karibu zaidi lakini ni lenye urudiaji wa kimtindo. Hakuna tofauti ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Nendeni mkamweleze” ni muundo wa kawaida unaohifadhi mfuatano wa kwenda kisha kutoa taarifa.
