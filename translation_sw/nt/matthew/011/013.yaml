  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: sw
  text: Kwa maana manabii wote na Torati walitabiri mpaka wakati wa Yohana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka Yohana.” Kirai hiki kinaweza kumwonyesha Yohana kuwa kilele cha ushuhuda wa kinabii au kuwa mpaka unaoashiria mpito wake.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Linaelezea kundi zima la manabii kwa ujumla, na “wote” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa lugha ya kawaida yenye hadhi.
- source_word: οἱ προφῆται
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watu wanaotoa ujumbe wa kinabii kwa niaba ya Mungu.
- source_word: ὁ νόμος
  choice: Torati
  rationale: Katika muunganiko huu na manabii, neno hilo linarejelea maandiko ya Musa kama sehemu inayotambulika ya Maandiko, si sheria kwa maana ya jumla. “Torati” huwasilisha rejeo hilo kwa uwazi katika Kiswahili.
- source_word: ἕως Ἰωάννου
  choice: mpaka Yohana
  rationale: Kirai hiki kinaweka kikomo cha wakati. “Mpaka Yohana” ni kifupi na cha kawaida huku kikihifadhi utata wa ikiwa Yohana anahesabiwa kuwa kilele cha ushuhuda wa kinabii au mpaka wa mpito wake.
- source_word: ἐπροφήτευσαν
  choice: walitoa unabii
  rationale: Kitenzi hiki kinawahusu kwa pamoja manabii na Torati. “Walitoa unabii” kinahifadhi dai la kwamba Torati yenyewe ilitoa ushuhuda wa kinabii, bila kulainisha uhuishaji huo.
theological_decisions:
- issue: Ikiwa ὁ νόμος itafsiriwe kama sheria kwa ujumla au kama jina la sehemu ya Maandiko
  choice: Torati
  alternative: Sheria
  rationale: Muktadha unarejelea ushuhuda wa Maandiko ya Israeli—manabii na Torati—wala si kanuni za sheria kwa ujumla. “Torati” ni jina linaloeleweka katika Kiswahili na haliongezi wazo lisilokuwamo katika Kigiriki.
- issue: Ikiwa ἕως Ἰωάννου inamjumuisha Yohana katika kipindi cha kinabii au inamweka kama mwisho wake
  choice: mpaka Yohana
  alternative: hadi wakati wa Yohana
  rationale: Kigiriki hakiamui wazi ikiwa Yohana ndiye kilele kinachojumuishwa katika ushuhuda huo au mpaka unaoashiria mpito. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaonyesha uwezekano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Torati” limetumiwa kutambulisha sehemu ya Maandiko; “walitoa unabii” linahifadhi muundo ambapo manabii na Torati kwa pamoja ni watendaji wa kitenzi.
