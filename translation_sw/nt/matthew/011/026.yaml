lexical_decisions:
- source_word: ναί
  choice: Ndiyo
  rationale: Ni jibu la kukubali au kuthibitisha; “Ndiyo” ni la kawaida na la moja kwa moja katika muktadha huu wa sala.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Nomino yenye kibainishi imetumiwa kama mwito. “Baba” ni mwito wa asili na wenye heshima katika Kiswahili cha sasa.
- source_word: ὅτι
  choice: kwa maana
  rationale: Hapa inaelekea kutaja msingi wa kauli ya kukubali. “Kwa maana” linaonyesha uhusiano huo bila kufanya sentensi kuwa nzito.
- source_word: οὕτως
  choice: ndivyo
  rationale: Inarejelea namna ya tendo la Baba lililotajwa katika mstari uliotangulia. “Ndivyo” ni muundo wa kawaida wa Kiswahili unaohifadhi maana ya “hivyo/namna hiyo.”
- source_word: εὐδοκία ἐγένετο
  choice: ilivyokupendeza
  rationale: Muundo huu unaonyesha kwamba jambo hilo lilikuwa la kumpendeza Baba. Kitenzi cha Kiswahili kinatoa maana hiyo kwa kawaida bila kuingiza kwa lazima wazo lenye nguvu zaidi la amri au kusudi lililokwisha kuamuliwa.
- source_word: ἔμπροσθέν σου
  choice: -ku- katika “ilivyokupendeza”
  rationale: Kirai kina maana ya “mbele zako” au “machoni pako.” Katika Kiswahili, mtendewa “-ku-” ndani ya “kukupendeza” huwasilisha kwa kawaida kwamba jambo hilo lilipendeza mbele za Baba; tafsiri ya wazi zaidi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo εὐδοκία litafsiriwe kwa namna inayodokeza kusudi/amri ya Mungu au ridhaa na kupendezwa kwake
  choice: “ndivyo ilivyokupendeza,” likisisitiza kwamba namna hiyo ya kutenda ilimpendeza Baba
  alternative: “ndivyo yalivyokuwa mapenzi yako mema” au “hili lilipendeza machoni pako”
  rationale: Neno hilo linaweza kueleza kupendezwa au mapenzi mema, lakini hapa tafsiri haipaswi kulazimisha maana mahsusi ya agizo la kimungu. Muundo uliochaguliwa huhifadhi ridhaa ya Baba na kuacha upana wa kiteolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Ndiyo” limetumiwa badala ya “Naam” kwa kuwa ni la kawaida zaidi leo; “ndivyo ilivyokupendeza” ni fasaha na linaunganisha οὕτως na εὐδοκία ἐγένετο bila kuifanya sentensi kuwa ngumu.
