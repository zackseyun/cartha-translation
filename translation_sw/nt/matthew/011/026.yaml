  text: Ndiyo[a], Baba, kwa maana ndivyo ilivyokupendeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana hayo ndiyo yaliyokuwa mapenzi yako mema,” au “kwa maana hili lilipendeza machoni pako.”
