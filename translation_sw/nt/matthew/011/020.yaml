  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: sw
  text: Kisha akaanza kuilaumu miji ambamo sehemu kubwa ya matendo yake ya nguvu yalikuwa yamefanyika, kwa sababu wakazi wa miji hiyo hawakutubu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “miujiza” au “matendo yenye nguvu” kwa “matendo ya nguvu” (Kigiriki: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Ni kiashiria cha wakati kinachoendeleza simulizi kwa lugha ya kawaida na ya asili.
- source_word: ἤρξατο ὀνειδίζειν
  choice: akaanza kuikemea
  rationale: “Akaanza” huhifadhi maana ya kuanza kwa tendo; “kuikemea” huwasilisha lawama kali bila kuongeza wazo la hukumu rasmi.
- source_word: τὰς πόλεις ἐν αἷς
  choice: miji ambamo
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi uhusiano wa mahali katika sentensi ya Kigiriki.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: matendo yake mengi ya nguvu yalikuwa yamefanyika
  rationale: “Matendo ya nguvu” huhifadhi uhusiano wa δυνάμεις na nguvu, na “yalikuwa yamefanyika” huonyesha kuwa matendo hayo yalitangulia kukemea kwake. Katika muktadha huu πλεῖσται inaweza kueleweka kama mengi sana au mengi zaidi; “mengi” ni ya kawaida bila kulazimisha ulinganisho usiotajwa wazi.
- source_word: ὅτι οὐ μετενόησαν
  choice: kwa sababu watu wake hawakutubu
  rationale: “Kwa sababu” hutaja sababu ya kukemewa. Kiswahili huhitaji kiwakilishi chenye rejeleo lililo wazi zaidi; “watu wake” hurejelea wakazi wa miji hiyo, ambao ndio wanaoweza kutubu. “Hawakutubu” huhifadhi uzito wa kimaadili na kiroho wa μετανοέω.
theological_decisions:
- issue: Maana ya δυνάμεις katika muktadha wa miujiza
  choice: matendo ya nguvu
  alternative: miujiza
  rationale: “Matendo ya nguvu” hudumisha msisitizo wa neno la Kigiriki juu ya nguvu bila kulifungia katika istilahi nyembamba zaidi ya “miujiza”; tanbihi inatoa mbadala huo halali.
- issue: Maana ya μετενόησαν
  choice: hawakutubu
  alternative: hawakugeuka
  rationale: “Kutubu” ni neno la kawaida na sahihi kwa mwitikio wa kimaadili na kiroho unaodaiwa hapa, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Mhusika wa tendo la kutotubu
  choice: watu wake
  alternative: hazikutubu
  rationale: Kigiriki hutumia wingi unaoweza kurejelea miji kwa njia ya kuwawakilisha wakazi wake. Kiswahili cha asili kinamtaja wazi mhusika mwenye uwezo wa kutubu, yaani watu wa miji hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa msomaji wa leo huku ukihifadhi mwendo wa simulizi, ukali wa kukemea, na maana ya kitheolojia ya kutubu.
