  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: sw
  text: Kwa maana nira yangu ni njema, na mzigo wangu ni mwepesi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: nira
  rationale: Neno hili hudumisha sitiari ya kifaa cha kubebea au kuvutia mzigo, na kwa Kiswahili linaweza pia kueleweka kwa maana ya utawala au wajibu unaowekwa juu ya mtu.
- source_word: χρηστός
  choice: njema
  rationale: χρηστός hapa inaweza kumaanisha yenye wema, inayofaa, au isiyoumiza. “Njema” huhifadhi wazo la tabia ya nira hiyo bila kuibana maana kuwa “rahisi” pekee.
- source_word: φορτίον
  choice: mzigo
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa kitu kinachobebwa, huku likihifadhi pia maana ya wajibu.
- source_word: ἐλαφρόν
  choice: mwepesi
  rationale: “Mwepesi” huwasilisha kwa kawaida kinyume cha mzigo mzito na kuendana moja kwa moja na sitiari ya kubeba.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari unaeleza sababu ya kauli iliyotangulia.
theological_decisions:
- issue: Maana ya χρηστός kuhusu nira ya Yesu
  choice: ni njema
  alternative: ni rahisi
  rationale: “Njema” huhifadhi wigo wa maana wa χρηστός—wema, kufaa, na kutokuwa kali—bila kudai kwamba ufuasi hauna ugumu wowote. Pia inalingana na ushahidi wa chanzo na safu ya ushauri ya POB.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya “nira” imehifadhiwa badala ya kufafanuliwa ndani ya mstari.
