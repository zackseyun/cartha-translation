  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: sw
  text: Lakini ninawaambia, siku ya hukumu itakuwa rahisi zaidi kustahimili[a] kwa Tiro na Sidoni kuliko kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya kuvumilika zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Neno hili linaonyesha utofautishaji wenye mkazo na maneno yaliyotangulia; “Lakini” ni la kawaida na lenye uzito unaofaa katika Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi usemi wa moja kwa moja na mkazo wa Yesu kwa watu wengi anaowahutubia.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: kwa Tiro na Sidoni
  rationale: Kihusishi “kwa” kinawakilisha vizuri dative inayotaja wale ambao hali hiyo itakuwa ya kuvumilika zaidi.
- source_word: ἀνεκτότερον
  choice: ya kuvumilika zaidi
  rationale: Huhifadhi maana linganishi ya jambo linaloweza kustahimiliwa bila kubadili waziwazi neno hilo kuwa kiwango cha adhabu.
- source_word: ἔσται
  choice: itakuwa
  rationale: Ni tafsiri ya kawaida ya kitenzi cha wakati ujao katika muundo huu.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: siku ya hukumu
  rationale: Ni usemi wa asili wa Kiswahili unaotaja wakati wa hukumu huku ukihifadhi maana ya kifungu cha Kigiriki.
- source_word: κρίσεως
  choice: hukumu
  rationale: “Hukumu” huhifadhi maana pana ya tendo au tukio la kimahakama, badala ya kuibana kuwa hukumu ya adhabu pekee.
- source_word: ἢ ὑμῖν
  choice: kuliko kwenu
  rationale: Hukamilisha ulinganisho na kuhifadhi wingi wa watu wanaosemeshwa bila kuongeza maneno yasiyokuwamo katika chanzo.
theological_decisions:
- issue: Asili ya hukumu inayokuja
  choice: siku ya hukumu
  alternative: siku moja ya hukumu
  rationale: Ingawa Kigiriki hakina kibainishi katika kifungu hiki, muktadha wa Mathayo unaelekeza kwenye siku inayotambuliwa ya hukumu. Tafsiri hii haitoi maelezo ya ziada kuhusu namna au matokeo yake.
- issue: Kitu kinachosemekana kuvumilika zaidi
  choice: itakuwa ya kuvumilika zaidi kwa Tiro na Sidoni
  alternative: hukumu itakuwa nyepesi zaidi kwa Tiro na Sidoni
  rationale: Muundo uliochaguliwa huhifadhi usemi usio na mtendaji wa wazi wa Kigiriki na hauingizi moja kwa moja wazo kwamba sentensi inalinganisha tu ukali wa adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ya kuvumilika zaidi” umechaguliwa ili kudumisha maana ya ἀνεκτότερον na uzito wa muktadha wa hukumu.
