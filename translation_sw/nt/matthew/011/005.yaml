id: MAT.11.5
reference: Matthew 11:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: sw
  text: Vipofu wanapata kuona, viwete wanatembea, wenye ukoma wanatakaswa, viziwi wanasikia, wafu wanafufuliwa, na maskini wanatangaziwa habari njema.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “wanahubiriwa injili.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa: maskini ndio wanaoletewa habari njema.'
    reason: lexical_alternative
  - marker: b
    text: Orodha hii ina mwangwi wa Isaya 35:5–6 na 61:1, ikionyesha ishara zinazohusishwa na kazi ya Masihi.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: vipofu
  rationale: Nomino ya kundi inayotaja watu wasioona; ni fupi, ya kawaida, na inalingana na mtindo wa orodha ya Kigiriki.
- source_word: ἀναβλέπουσιν
  choice: wanapata kuona
  rationale: Katika muktadha wa uponyaji, kitenzi hiki humaanisha kupata au kurudishiwa uwezo wa kuona, si kutazama juu tu.
- source_word: χωλοὶ
  choice: viwete
  rationale: Neno hili linawataja watu wasioweza kutembea kawaida; ‘viwete’ ni tafsiri fupi na inayotambulika katika Kiswahili sanifu.
- source_word: περιπατοῦσιν
  choice: wanatembea
  rationale: Wakati wa sasa na mtindo sahili wa orodha ya matendo umehifadhiwa.
- source_word: λεπροὶ
  choice: wenye ukoma
  rationale: Kauli hii ni ya heshima na ya kawaida kuliko kuwatambulisha watu moja kwa moja kwa ugonjwa wao, huku ikihifadhi rejeo la hali iliyoitwa ukoma katika ulimwengu wa kale.
- source_word: καθαρίζονται
  choice: wanatakaswa
  rationale: Huhifadhi maana pana ya kufanywa safi, inayoweza kuhusisha kuondolewa kwa uchafu wa kimwili na wa kiibada, badala ya kuibana kuwa uponyaji tu.
- source_word: κωφοὶ
  choice: viziwi
  rationale: Ingawa κωφός wakati mwingine inaweza kumaanisha bubu, kuunganishwa kwake hapa na ‘wanasikia’ kunaonyesha wazi maana ya watu wasiosikia.
- source_word: ἀκούουσιν
  choice: wanasikia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kusikia lililorejeshwa.
- source_word: νεκροὶ
  choice: wafu
  rationale: Huhifadhi usemi mfupi na wenye uzito wa Kigiriki unaowataja watu waliokufa kama kundi.
- source_word: ἐγείρονται
  choice: wanafufuliwa
  rationale: Muundo wa kutendwa umehifadhiwa, ukionyesha kwamba wafu wanatendewa tendo la kurejeshwa kwenye uhai.
- source_word: πτωχοὶ
  choice: maskini
  rationale: Ni tafsiri ya kawaida inayohifadhi maana ya kijamii na kiuchumi pamoja na mwangwi wa Isaya bila kuufafanua kupita kiasi.
- source_word: εὐαγγελίζονται
  choice: wanatangaziwa habari njema
  rationale: 'Muundo wa kutendwa umehifadhiwa: maskini ndio wapokeaji wa tangazo la habari njema. Usemi huu ni wa kawaida na haubani kitenzi katika istilahi ya baadaye ya kanisa.'
theological_decisions:
- issue: Tafsiri ya εὐαγγελίζονται na istilahi ya injili
  choice: wanatangaziwa habari njema
  alternative: wanahubiriwa injili
  rationale: Chaguo hili linahifadhi maana ya habari njema na muundo wa kutendwa, huku likiepuka kuingiza katika matini kuu istilahi ya kiufundi ya kanisa ambayo inaweza kuifanya maana iwe finyu zaidi.
- issue: Orodha ya miujiza kama ushahidi wa kazi ya Masihi
  choice: Kutaja matendo yenyewe bila kuongeza wazi kwamba yanatimiza unabii
  alternative: Kuongeza kwamba ishara hizi zinatimiza unabii wa Isaya
  rationale: Matini ina mwangwi mkubwa wa Isaya 35:5–6 na 61:1, lakini haisemi moja kwa moja hapa ‘ili kutimiza.’ Tafsiri inaacha mwangwi huo ubaki bila kugeuza ufafanuzi kuwa sehemu ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi mtindo mfupi wa orodha ya Kigiriki. ‘Wenye ukoma’ imetumiwa kwa lugha ya heshima; ‘wanatangaziwa habari njema’ ni ya asili katika Kiswahili na huhifadhi hali ya kutendwa.
