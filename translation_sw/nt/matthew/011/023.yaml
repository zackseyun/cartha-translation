id: MAT.11.23
reference: Matthew 11:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: sw
  text: Nawe, Kapernaumu, je, utainuliwa mpaka mbinguni? Utashuka mpaka Hadesi.[a] Kwa maana, kama matendo ya nguvu yaliyotendeka kwako yangalitendeka katika Sodoma, Sodoma ingalikuwapo mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, makao ya wafu. Kigiriki ni “Hadesi,” si Gehena.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: je, utainuliwa mpaka mbinguni?
  rationale: μή pamoja na kitenzi cha wakati ujao imeeleweka kama swali la balagha linalotarajia jibu la kukataa; muundo wa kutendwa na taswira ya kuelekea mbinguni zimehifadhiwa.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Utashuka mpaka Kuzimu
  rationale: ‘Utashuka’ huakisi καταβήσῃ moja kwa moja, na ‘Kuzimu’ ni istilahi ya Kiswahili kwa makao ya wafu, bila kuichanganya na Gehena.
- source_word: δυνάμεις
  choice: matendo ya nguvu
  rationale: Huhifadhi maana ya matendo halisi yanayodhihirisha nguvu bila kuibana neno hilo kwenye dhana ya kisasa ya ‘miujiza’ pekee.
- source_word: γενόμεναι ἐν σοί
  choice: yaliyotendeka kwako
  rationale: Huwasilisha matukio yaliyofanyika katika mji unaosemeshwa; ‘kwako’ ni ya kawaida zaidi katika Kiswahili kwa mji unaoelekezewa maneno.
- source_word: ἐγενήθησαν
  choice: yangalitendeka
  rationale: Umbo la masharti lisilotimia linaonyesha tukio la kudhaniwa ambalo halikutokea.
- source_word: ἔμεινεν ἂν
  choice: mji huo ungalikuwapo
  rationale: Kitenzi cha umoja kinarejelea Sodoma kama mji; ‘ungalikuwa umesalia’ lingeweza kudokeza mabaki tu, ilhali ‘ungalikuwapo’ huonyesha kuendelea kuwepo.
- source_word: μέχρι τῆς σήμερον
  choice: mpaka leo
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili unaohifadhi kikomo cha wakati.
theological_decisions:
- issue: Tafsiri ya ᾅδης
  choice: Kuzimu
  alternative: makao ya wafu; Hadesi; jehanamu
  rationale: ‘Kuzimu’ hutaja ulimwengu au makao ya wafu katika Kiswahili na huepuka kuifanya ᾅδης kuwa sawa moja kwa moja na Gehena au hukumu ya mwisho. Tanbihi inaweka wazi tofauti hiyo.
- issue: Swali la balagha katika μὴ ἕως οὐρανοῦ ὑψωθήσῃ
  choice: je, utainuliwa mpaka mbinguni?
  alternative: hutainuliwa mpaka mbinguni
  rationale: Muundo wa swali umehifadhiwa kwa sababu μή inaweza kuanzisha swali linalotarajia jibu la kukataa; tafsiri haifuti nguvu ya balagha kwa kuligeuza kimya kimya kuwa taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya ‘yangali-/ungali-’ imetumiwa kuonyesha kwa usahihi sharti lisilotimia, huku ‘matendo ya nguvu’ ikihifadhi upana wa δυνάμεις. Alama [a] imewekwa mara tu baada ya ‘Kuzimu,’ neno linalofafanuliwa.
