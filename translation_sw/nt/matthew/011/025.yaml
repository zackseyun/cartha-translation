  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: sw
  text: Wakati huo Yesu akajibu akasema,[a] “Ninakusifu, Baba, Bwana wa mbingu na dunia, kwa sababu uliwaficha wenye hekima na ufahamu mambo haya, ukawafunulia watoto wadogo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida, “akajibu akasema.” Usemi wa Kigiriki huhifadhi vitenzi vyote viwili hata kama hakuna swali lililotajwa wazi katika muktadha wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watoto wachanga.” Hapa huenda “watoto wadogo” inatumiwa kimfano kwa watu wanyenyekevu au wanaopokea kwa moyo kama wa mtoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Wakati huo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi mazingira ya wakati katika simulizi bila kudokeza kwamba ilikuwa lazima iwe papo hapo.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: akajibu akasema
  rationale: Inahifadhi vitenzi vyote vya fomula ya kisimulizi yenye athari ya Kisemiti. Ingawa hakuna swali lililotajwa moja kwa moja, usemi huu unaweza kuonyesha jibu kwa hali au mambo yaliyotangulia.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ninakusifu
  rationale: Katika hotuba hii kwa Baba, kitenzi kina maana ya kukiri au kutangaza wazi kwa sifa na shukrani. ‘Ninakusifu’ linafaa kwa sauti ya sifa bila kudokeza kuungama dhambi.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Baba, Bwana wa mbingu na dunia
  rationale: Inahifadhi mfululizo wa miito na mamlaka ya Baba juu ya mbingu na dunia kwa lugha ya kawaida ya kibiblia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Inaonyesha msingi wa sifa ya Yesu kwa uwazi na kuhifadhi nguvu ya kisababishi katika muktadha.
- source_word: ἔκρυψας
  choice: uliwaficha ... mambo haya
  rationale: Kiswahili kwa kawaida hutaja watu kama yambwa wa kufichwa jambo. Muundo huu ni wa asili huku ukiendeleza tendo la moja kwa moja la Baba na maana ya kwamba mambo haya hayakufunuliwa kwa kundi hilo.
- source_word: ταῦτα ... αὐτά
  choice: mambo haya ... ukawafunulia
  rationale: ‘Mambo haya’ huhifadhi rejeleo lililo wazi la Kigiriki. Katika sehemu ya pili, kitu hicho kinaeleweka katika kitenzi bila kulazimika kurudia kiwakilishi.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: wenye hekima na ufahamu
  rationale: 'Inahifadhi jozi ya sifa zinazotumiwa kama nomino: hekima na uwezo wa kuelewa au kutambua. Haiongezi maelezo ya watu hawa zaidi ya chanzo.'
- source_word: ἀπεκάλυψας
  choice: ukawafunulia
  rationale: Ni neno la kawaida la Kiswahili kwa kufichua au kufanya jambo lijulikane, na linahifadhi maana ya ufunuo wa Mungu.
- source_word: νηπίοις
  choice: watoto wadogo
  rationale: Inahifadhi picha halisi ya watoto, ambayo katika muktadha inaweza kutumiwa kimfano, bila kuibadilisha moja kwa moja kuwa dhana ya ‘wanyenyekevu.’
theological_decisions:
- issue: Tendo la Mungu katika kuficha na kufunua
  choice: 'Kuhifadhi uhusishaji wa moja kwa moja kwa Baba: “uliwaficha ... ukawafunulia”'
  alternative: Kulainisha kuwa “uliruhusu mambo haya yafichike”
  rationale: Vitenzi vya Kigiriki ni vya kutenda na Baba ndiye mtendaji. Tafsiri inahifadhi mvutano huo wa kiteolojia bila kuufafanua kwa fundisho la ziada.
- issue: Maana ya νηπίοις
  choice: watoto wadogo
  alternative: watoto wachanga; wanyenyekevu
  rationale: Neno linaweza kumaanisha watoto wachanga na hapa huenda lina maana ya kimfano. ‘Watoto wadogo’ huhifadhi picha na uwezekano huo bila kubadili sitiari kuwa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi marudio ya kisimulizi, picha ya watoto, na tendo la moja kwa moja la Baba. Alama zote za tanbihi zimewekwa katika matini kuu.
