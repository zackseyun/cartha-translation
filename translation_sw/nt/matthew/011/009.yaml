reference: Matthew 11:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: sw
  text: Lakini mlitoka kuona nini? Nabii? Ndiyo, ninawaambia, na zaidi ya nabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu aliye mkuu kuliko nabii.” Kigiriki, kwa tafsiri ya karibu zaidi, ni “zaidi ya nabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti na mfululizo wa maswali ya balagha yaliyotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: τί ἐξήλθατε
  choice: mlitoka kwenda kuona nini
  rationale: τί hapa ni ‘nini,’ si ‘kwa nini’; swali linahusu kile walichotoka ili wakione.
- source_word: ἰδεῖν
  choice: kwenda kuona
  rationale: Kitenzi-jina kinaonyesha kusudi la kutoka; ‘kwenda kuona’ ni usemi wa kawaida wa Kiswahili unaowasilisha kusudi hilo wazi.
- source_word: προφήτην
  choice: Nabii
  rationale: Nomino isiyo na kibainishi inatumika kama jibu linalopendekezwa katika swali la balagha; Kiswahili hakihitaji kibainishi kisicho dhahiri.
- source_word: ναί
  choice: Ndiyo
  rationale: Ni jibu la moja kwa moja na la kawaida linalothibitisha swali lililotangulia.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Inahifadhi kauli ya moja kwa moja ya Yesu kwa lugha ya sasa na ya asili.
- source_word: καὶ περισσότερον προφήτου
  choice: na zaidi ya nabii
  rationale: Inahifadhi ulinganisho wa Kigiriki na udondoshaji wake bila kuongeza wazi ‘yeye ni’ au kueleza ni kwa njia gani Yohana ni zaidi ya nabii.
theological_decisions:
- issue: Utambulisho na hadhi ya Yohana Mbatizaji katika kauli ya Yesu
  choice: zaidi ya nabii
  alternative: mtu aliye mkuu kuliko nabii
  rationale: Kauli inamweka Yohana juu ya kundi la manabii bila kueleza hapa kwa namna gani. Tafsiri iliyochaguliwa inadumisha mkazo na mvutano huo bila kuingiza maelezo ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa mwisho umeachwa kwa makusudi ili kuhifadhi udondoshaji na ukaribu wa kauli ya Kigiriki.
