  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: sw
  text: Amin, nawaambia, kati ya wale waliozaliwa na wanawake[a], hajatokea aliye mkuu kuliko Yohana Mbatizaji[b]. Lakini aliye mdogo zaidi[c] katika ufalme wa mbinguni ni mkuu kuliko yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wale waliozaliwa na wanawake” ni msemo wa Kisemiti unaomaanisha wanadamu.
    reason: cultural_note
  - marker: b
    text: Au “hajainuliwa aliye mkuu kuliko Yohana Mbatizaji.” Kitenzi cha Kigiriki kinaweza kumaanisha “ametokea” au “ameinuliwa”; hapa huenda kinarejelea kutokea katika historia, si kufufuliwa.
    reason: lexical_alternative
  - marker: c
    text: Au “aliye wa chini zaidi” au “aliye mdogo.” Kigiriki hutumia umbo la ulinganisho, lakini hapa huenda maana ni mwenye cheo au hadhi ya chini zaidi katika ufalme wa mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amin, nawaambia
  rationale: “Amin” linahifadhi uzito wa tamko la mamlaka la Yesu na ni neno linalotambulika katika Kiswahili cha Biblia; “nawaambia” ni usemi wa kawaida na wa moja kwa moja.
- source_word: οὐκ ἐγήγερται
  choice: hajatokea
  rationale: Katika muktadha huu kitenzi kinaelekea kumaanisha kutokea katika historia, si kufufuliwa. “Hajatokea” ni cha asili katika Kiswahili na huepuka dhana isiyokusudiwa ya ufufuo.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: kati ya wale waliozaliwa na wanawake
  rationale: Tafsiri hii inahifadhi tamathali ya Kisemiti inayowarejelea wanadamu bila kuibadili moja kwa moja kuwa ufafanuzi.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: mtu mkuu kuliko Yohana Mbatizaji
  rationale: “Mtu” huweka wazi mhusika anayelinganishwa, na “mkuu kuliko” huwasilisha ulinganisho wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: τοῦ βαπτιστοῦ
  choice: Mbatizaji
  rationale: “Mbatizaji” ni cheo kinachoeleweka na kinachoonyesha kazi ya Yohana ya kubatiza.
- source_word: ὁ δὲ μικρότερος
  choice: Lakini aliye mdogo zaidi
  rationale: Ingawa Kigiriki kina umbo la ulinganisho, katika muktadha huu humaanisha mwenye cheo au nafasi ya chini zaidi. “Aliye mdogo zaidi” huhifadhi wazo hilo na ulinganisho wa kimakusudi.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: katika ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida wa Mathayo na tafsiri iliyo wazi katika Kiswahili, bila kulazimisha wingi halisi wa “mbingu” wa Kigiriki.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ni mkuu kuliko yeye
  rationale: Huhifadhi dai la kulinganisha moja kwa moja bila kueleza kwa nini aliye mdogo zaidi katika ufalme ni mkuu kuliko Yohana.
theological_decisions:
- issue: Ukuu wa Yohana ukilinganishwa na walio katika ufalme
  choice: Tamko limetafsiriwa moja kwa moja bila kufafanua namna aliye mdogo zaidi katika ufalme alivyo mkuu kuliko Yohana.
  alternative: Kulieleza kuwa tofauti ya vipindi vya historia ya wokovu, mapendeleo ya agano jipya, au utakatifu binafsi.
  rationale: Mstari wenyewe unaacha ulinganisho huu ukiwa na mvutano wa kitheolojia na hauelezi msingi wake; tafsiri haipaswi kuamua maana ambayo matini haijaweka wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kibiblia “waliozaliwa na wanawake” umehifadhiwa na kufafanuliwa katika tanbihi. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
