  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: sw
  text: Yohana, alipokuwa gerezani, aliposikia habari za matendo ya Masihi[a], alituma ujumbe kupitia wanafunzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo ya Kristo.”
    reason: Tafsiri mbadala ya Χριστός, ambalo linaweza kutolewa kama cheo “Masihi” au kwa namna ya jadi “Kristo.”
lexical_decisions:
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Kiunganishi hiki kinaonyesha mpito wa simulizi. Kiswahili hakihitaji kiunganishi cha ziada hapa, na kukiacha kunatoa sentensi ya kawaida bila kuingiza maana ya wakati isiyokuwapo wazi.
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Umbo la kitenzi kishirikishi cha wakati uliopita linaonyesha tendo lililotangulia; kishazi cha wakati ni cha kawaida na wazi katika Kiswahili.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: alipokuwa gerezani
  rationale: Kauli hii ya Kiswahili inaonyesha wazi kwamba Yohana alikuwa kifungoni wakati aliposikia habari hizo.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: “Matendo” yanahifadhi maana pana ya ἔργα, ikijumuisha mambo yenye nguvu na shughuli nyingine za huduma.
- source_word: τοῦ χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo cha Mtiwa-Mafuta, si kama jina tu; “Masihi” ni neno la kawaida la Kiswahili linalohifadhi asili yake ya Kiyahudi.
- source_word: πέμψας
  choice: alituma ujumbe
  rationale: Kitu kilichotumwa hakitajwi moja kwa moja katika mstari huu lakini kinaeleweka kutokana na swali linalofuata; “ujumbe” hufanya sentensi iwe ya kawaida bila kubadili tendo la kutuma kupitia wajumbe.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: kupitia wanafunzi wake
  rationale: διά pamoja na hali ya genitivi huonyesha watu waliotumiwa kama njia au wajumbe wa kufikisha ujumbe.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo ni cheo kinachoeleza utambulisho na kazi ya yule aliyetiwa mafuta. “Kristo” limehifadhiwa katika tanbihi kama tafsiri mbadala ya jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku “matendo” na “Masihi” vikihifadhi uhusiano muhimu wa kileksia na kiteolojia wa matini chanzi.
