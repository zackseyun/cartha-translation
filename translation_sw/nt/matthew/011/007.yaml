  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: sw
  text: 'Watu hao walipokuwa wakiondoka, Yesu alianza kuwaambia makutano kuhusu Yohana: “Mlitoka kwenda nyikani kutazama nini?[a] Mwanzi unaotikiswa na upepo?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mlitoka kwenda nyikani kuona nini?”
    reason: θεάομαι inaweza kutafsiriwa “kutazama” au “kuona.”
  - marker: b
    text: Picha ya mwanzi unaotikiswa na upepo inadokeza kutokuwa thabiti au kuyumbayumba; swali la Yesu linatarajia jibu la hapana kumhusu Yohana.
    reason: Maelezo ya picha ya kitamaduni na nguvu ya swali la balagha.
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Watu hao walipokuwa wakiondoka
  rationale: Muundo wa genitivi huru unaonyesha tendo lililokuwa likiendelea wakati Yesu alianza kusema. “Watu hao” inawarejelea kwa kawaida wanafunzi wa Yohana waliotajwa katika muktadha uliotangulia.
- source_word: ἤρξατο ... λέγειν
  choice: alianza kuwaambia
  rationale: Muundo ἄρχομαι pamoja na kitenzi-jina humaanisha kuanza kufanya jambo. “Kuwaambia” ni Kiswahili cha kawaida kinachofaa kwa hotuba iliyoelekezwa kwa makutano.
- source_word: τοῖς ὄχλοις
  choice: makutano
  rationale: Neno la Kigiriki liko katika wingi na linamaanisha vikundi vya watu waliokusanyika; “makutano” ni usemi wa Kiswahili unaoeleweka na wenye hadhi.
- source_word: περὶ Ἰωάννου
  choice: kuhusu Yohana
  rationale: περί pamoja na genitivi huonyesha mada inayozungumziwa.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Mlitoka kwenda nyikani kutazama nini?
  rationale: τί inauliza “nini?” wala si “kwa nini?”; θεάομαι hapa hubeba wazo la kwenda kutazama kwa makusudi, na ἔρημος katika mazingira haya ni eneo la nyika.
- source_word: κάλαμον
  choice: mwanzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mmea unaokusudiwa na κάλαμος, huku umoja ukihifadhiwa.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: unaotikiswa na upepo
  rationale: Uhusiano wa kutendwa katika kishirikishi umehifadhiwa, na “unaotikiswa” huonyesha mwendo unaoendelea bila kuifanya picha kuwa maelezo ya moja kwa moja.
theological_decisions:
- issue: Anayerejelewa na Τούτων (“hao”)
  choice: Watu hao, yaani wanafunzi wa Yohana katika muktadha wa karibu
  alternative: Kuandika tu “walipokuwa wakiondoka” bila kutaja anayerejelewa
  rationale: Ufafanuzi huu wa kimuktadha huwezesha Kiswahili cha kawaida bila kuongeza dai la kiteolojia.
- issue: Maana ya picha ya mwanzi unaotikiswa na upepo
  choice: Kuhifadhi picha yenyewe katika andiko na kueleza kidokezo chake katika tanbihi
  alternative: Kutafsiri picha moja kwa moja kuwa mtu asiye thabiti
  rationale: Andiko la Kigiriki linatoa swali la kisitiari; kulihifadhi huepuka kufunga maana yake ndani ya ufafanuzi mmoja, huku tanbihi ikisaidia msomaji kuelewa nguvu ya swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyikani” na “makutano” ni maneno yanayoeleweka katika usomaji wa Biblia bila kuwa ya kale kupita kiasi. Muundo wa swali umehifadhiwa ili kudumisha nguvu ya balagha ya Kigiriki.
