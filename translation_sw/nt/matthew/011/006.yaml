  text: And blessed is the one who is not offended by me[a].
translation:
  language: sw
  text: Na heri ni mtu yeyote asiyejikwaa kwa sababu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiyekwazika kwa sababu yangu” au “asiyechukizwa nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Huunganisha tamko hili na muktadha uliotangulia; katika Kiswahili, “Naye” huendeleza usemi kwa ufasaha huku ikimrejelea mtu anayetajwa.
- source_word: μακάριος
  choice: heri
  rationale: “Heri” ni neno la kawaida katika matamko ya baraka na huhifadhi uzito wa kidini wa μακάριος kuliko maneno yanayolenga hisia tu kama “mwenye furaha.”
- source_word: ὃς ἐὰν μὴ
  choice: mtu yeyote asiye
  rationale: Huwakilisha mtu wa aina yoyote chini ya sharti, kwa Kiswahili cha kawaida na bila kuufanya usemi kuwa wa jinsia fulani.
- source_word: σκανδαλισθῇ
  choice: asiyejikwaa
  rationale: Huhifadhi sitiari ya kujikwaa na maana pana inayoweza kujumuisha kuchukizwa, kukataa, au kuyumba kwa sababu ya Yesu, badala ya kuibana kuwa hisia ya kukerwa pekee.
- source_word: ἐν ἐμοί
  choice: kwa sababu yangu
  rationale: Katika muundo huu, Yesu ndiye sababu au tukio linaloweza kumfanya mtu ajikwae. Kiswahili “kwa sababu yangu” ni cha asili na huhifadhi uhusiano huo bila kudai kwamba Yesu anamwangusha mtu moja kwa moja.
theological_decisions:
- issue: Nguvu ya σκανδαλισθῇ kuhusiana na Yesu
  choice: asiyejikwaa kwa sababu yangu
  alternative: asiyekwazika nami / asiyechukizwa kwa sababu yangu
  rationale: Chaguo kuu huhifadhi picha ya kujikwaa na mvutano wa mtu kuyumba au kukataa kwa sababu ya Yesu. Njia mbadala zinafaa kisarufi lakini zinaweza kueleweka kama hisia ya kuudhika tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Heri” hudumisha mtindo wa tamko la baraka; “mtu yeyote” ni wazi kwa msomaji wa kawaida; na “kujikwaa” huhifadhi sitiari ya Kigiriki.
