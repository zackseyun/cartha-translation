  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: sw
  text: Ikawa Yesu alipomaliza kuwaagiza wanafunzi wake kumi na wawili[a], akaondoka hapo kwenda kufundisha na kuhubiri katika miji yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwaamuru wanafunzi wake kumi na wawili.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “miji yao” hauelezi wazi katika Kigiriki ni miji ya nani; huenda ni miji ya wanafunzi au, kwa ujumla zaidi, miji ya watu wa eneo hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Ikawa ... alipo-
  rationale: Huu ni mtindo wa simulizi unaotambulisha hatua inayofuata. “Ikawa” huhifadhi kiunganishi cha kisimulizi, huku “alipomaliza” ikionyesha wakati kwa Kiswahili cha kawaida.
- source_word: ἐτέλεσεν
  choice: alipomaliza
  rationale: Kitenzi kinaonyesha kwamba tendo la kuwaagiza lilikuwa limekamilika kabla ya Yesu kuondoka.
- source_word: διατάσσων
  choice: kuwaagiza
  rationale: Neno hili linamaanisha kutoa maagizo yenye mamlaka. “Kuwaagiza” ni la kawaida na lenye uzito ufaao; “kuwaamuru” pia linawezekana lakini linaweza kusikika kali zaidi.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: wanafunzi wake kumi na wawili
  rationale: “Wanafunzi” ndilo neno lililozoeleka katika muktadha wa Injili, na idadi ya kumi na wawili imehifadhiwa wazi.
- source_word: μετέβη ἐκεῖθεν
  choice: akaondoka hapo
  rationale: Husema kusonga kutoka mahali palipotajwa kwenda pengine; muundo huu ni wa kawaida katika simulizi la Kiswahili.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: kwenda kufundisha na kuhubiri
  rationale: Muundo wa Kigiriki unaonyesha kusudi. Tafsiri hii huhifadhi tofauti kati ya kufundisha na kutangaza ujumbe hadharani.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: katika miji yao
  rationale: Tafsiri hii ya karibu huhifadhi kiwakilishi “yao” bila kuamua kinawarejelea nani. “Miji” inaweza kujumuisha miji midogo kulingana na mazingira.
theological_decisions:
- issue: Mrejeleo wa αὐτῶν katika “ἐν ταῖς πόλεσιν αὐτῶν”
  choice: Kuhifadhi usemi “miji yao” bila kutaja ni ya nani
  alternative: miji ya wanafunzi; miji ya Wayahudi; miji ya eneo hilo
  rationale: Kiwakilishi cha Kigiriki hakitaji wazi mrejeleo wake. Kwa hiyo tafsiri haipaswi kuondoa utata ambao matini yenyewe imeuacha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. “Ikawa” huhifadhi mtindo wa mpito wa Mathayo bila kufanya sentensi kuwa nzito; “akaondoka hapo” na “kwenda kufundisha na kuhubiri” ni miundo ya kawaida na inayoeleweka.
