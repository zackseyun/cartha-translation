  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: sw
  text: Kwa maana Yohana alikuja bila kula wala kunywa, nao wanasema, “Ana pepo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amepagawa na pepo.” Kigiriki ni kihalisi, “Ana pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: alikuja
  rationale: Wakati uliopita wa ἔρχομαι unaeleza kuja kwa Yohana na kuonekana kwake hadharani; “alikuja” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inatoa sababu au maelezo ya kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili, likimaanisha Yohana Mbatizaji katika muktadha huu.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: akiwa hali wala hanywi
  rationale: Muundo wa μήτε…μήτε unaeleza maisha ya Yohana ya kujinyima. Tafsiri hii haiingizi “mkate” wala “divai,” ambazo hazitajwi katika aya hii, na “akiwa” inaunganisha virai tegemezi na kitenzi kikuu kwa Kiswahili cha asili.
- source_word: καὶ λέγουσιν
  choice: nao wanasema
  rationale: Wakati uliopo wa λέγουσιν una nguvu ya usemi wa wazi na wa kijumla. “Nao” huhifadhi mtendaji asiyeainishwa bila kuongeza utambulisho wake.
- source_word: Δαιμόνιον ἔχει
  choice: Ana pepo
  rationale: Hii inafuata kwa karibu maana ya kihalisi ya Kigiriki, “ana pepo,” huku ikibaki ya kawaida katika Kiswahili. “Pepo” humaanisha roho mwovu katika muktadha huu, si Ibilisi mwenyewe.
theological_decisions:
- issue: Jinsi ya kutafsiri shtaka lenye δαιμόνιον
  choice: Ana pepo
  alternative: Amepagawa na pepo
  rationale: Aya inaripoti shtaka la watu dhidi ya Yohana, wala si uthibitisho wa msimulizi. “Ana pepo” huhifadhi nahau ya Kigiriki na hali yake ya moja kwa moja bila kufafanua zaidi kiwango au namna ya ushawishi wa pepo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akiwa hali wala hanywi” ni mfupi na wa kawaida, huku usemi wa moja kwa moja “Ana pepo” ukihifadhi ukali wa shtaka la chanzo.
