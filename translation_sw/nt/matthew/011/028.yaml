  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: sw
  text: Njooni kwangu, ninyi nyote mnaofanya kazi kwa taabu na mmelemewa[a], nami nitawapa pumziko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmebebeshwa mizigo.” Neno la Kigiriki ni kauli ya kutendwa katika wakati timilifu, likionyesha watu waliowekewa mzigo na wanaoendelea kuwa katika hali hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitawaburudisha.” Kitenzi hiki kinaweza kumaanisha kumsababisha mtu apumzike au kumletea nafuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Njooni
  rationale: Ni mwaliko wa moja kwa moja unaoelekezwa kwa watu wengi; wingi wa amri umehifadhiwa.
- source_word: πρός με
  choice: kwangu
  rationale: Pamoja na kitenzi cha mwendo, usemi huu unaonyesha kuja kwa mtu; “kwangu” ni Kiswahili cha kawaida na cha asili.
- source_word: πάντες
  choice: ninyi nyote
  rationale: Huhifadhi upeo mpana wa mwaliko na kuweka wazi kuwa Yesu anawahutubia watu wengi.
- source_word: οἱ κοπιῶντες
  choice: mnaotaabika
  rationale: Huwasilisha hali ya kufanya juhudi kwa taabu na kuchoka, huku ikibaki fupi na ya kawaida katika Kiswahili cha sasa.
- source_word: πεφορτισμένοι
  choice: mmelemewa
  rationale: Kauli hii inaonyesha kwamba watu waliwekewa mzigo na bado wako katika hali ya kulemewa; wakati timilifu wa Kiswahili unaakisi matokeo yanayoendelea.
- source_word: κἀγὼ
  choice: nami
  rationale: Huhifadhi kiunganishi pamoja na msisitizo wa kiasi juu ya msemaji bila kuutia chumvi.
- source_word: ἀναπαύσω
  choice: nitawapa pumziko
  rationale: Ni usemi wa asili unaohifadhi maana pana ya kusababisha mtu apumzike au kupata nafuu, bila kuibana kuwa pumziko la aina moja tu.
- source_word: ὑμᾶς
  choice: -wa- katika “nitawapa”
  rationale: Kiambishi cha yambwa cha wingi kinawakilisha kwa usahihi watu wote walioalikwa.
theological_decisions:
- issue: Aina ya pumziko linaloahidiwa katika ἀναπαύσω
  choice: nitawapa pumziko
  alternative: nitawaburudisha
  rationale: Mstari wenyewe haufafanui kama pumziko hili ni la kiroho, la mwisho wa nyakati, la kihisia, au la kimwili. Tafsiri pana inalinda utajiri na mvutano huo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Njooni” na “ninyi nyote” huhifadhi wingi wa mwaliko; “mmelemewa” huepuka lugha ya kizamani huku ikidumisha hali endelevu iliyotokana na kubebeshwa mzigo.
