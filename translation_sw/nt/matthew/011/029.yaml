  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: sw
  text: Jitieni nira yangu na mjifunze kutoka kwangu, kwa maana mimi ni mpole na mnyenyekevu wa moyo, nanyi mtapata pumziko kwa nafsi zenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε
  choice: Jitieni
  rationale: Katika msemo unaohusu nira, kitenzi hiki kinaeleza kujitwika au kukubali nira. “Jitieni” ni agizo la wingi lenye Kiswahili cha kawaida na linaendana na “juu yenu” iliyomo katika wazo la Kigiriki.
- source_word: τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: nira yangu
  rationale: “Nira” inadumisha taswira halisi na sitiari ya kujisalimisha kwa mafundisho au mamlaka. Muundo “jitieni nira yangu” unawasilisha pia maana ya ἐφ’ ὑμᾶς bila kuongeza maneno yasiyo ya lazima.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: mjifunze kutoka kwangu
  rationale: Hutoa agizo la kujifunza kwa Yesu moja kwa moja na ni usemi wa sasa, wazi, na wa kawaida katika Kiswahili.
- source_word: ὅτι
  choice: kwa maana
  rationale: Hutambulisha sababu au maelezo yanayoonyesha kwa nini Yesu anafaa kuwa mwalimu wao, huku ikidumisha mtiririko wenye hadhi.
- source_word: πραΰς
  choice: mpole
  rationale: “Mpole” huonyesha upole usio mkali bila kudokeza udhaifu, na ni neno la kawaida katika Kiswahili sanifu.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: mnyenyekevu wa moyo
  rationale: Huhifadhi unyenyekevu kama tabia ya ndani. “Wa moyo” ni muundo wa Kiswahili ulio wazi na wenye hadhi.
- source_word: εὑρήσετε
  choice: mtapata
  rationale: Huwakilisha kwa uwazi kauli elekezi ya wakati ujao kama ahadi.
- source_word: ἀνάπαυσιν
  choice: pumziko
  rationale: Ni tafsiri ya moja kwa moja inayodumisha mwangwi wa kibiblia wa kustarehe au kupumzishwa bila kufupisha maana kuwa faraja pekee.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: kwa ajili ya nafsi zenu
  rationale: Huwasilisha dhima ya dative kwa Kiswahili kinachoeleweka na kudumisha “nafsi” kama maisha ya ndani au mtu mzima, bila kuibana kuwa akili au hisia pekee.
theological_decisions:
- issue: Maelezo ya tabia ya Yesu katika πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: mimi ni mpole na mnyenyekevu wa moyo
  alternative: mimi ni mpole na wa hali ya chini moyoni
  rationale: Chaguo hili huhifadhi kauli ya Yesu kuhusu tabia yake mwenyewe na kuwasilisha upole pamoja na unyenyekevu wa ndani kwa lugha ya sasa, bila kuingiza maana ya udhaifu au msimamo wa dhehebu.
- issue: Maana ya ψυχή katika ahadi ya pumziko
  choice: nafsi zenu
  alternative: maisha yenu ya ndani
  rationale: “Nafsi” hudumisha upana wa neno la Kigiriki na usemi wa kibiblia bila kuamua kimbele kama rejeo ni sehemu isiyo ya kimwili pekee au mtu mzima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira kuu ya nira imehifadhiwa. Muundo wa wingi umetumika katika maagizo na ahadi kwa kuzingatia ὑμᾶς na maumbo ya vitenzi vya wingi. Hakuna tanbihi iliyoongezwa kwa kuwa mbadala wa Kiingereza ‘meek and lowly in heart’ unaweza kuwasilishwa moja kwa moja kwa uchaguzi wa maneno wa Kiswahili bila hitaji la alama ya tanbihi.
