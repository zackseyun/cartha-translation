    issue: “tumngojee” narrows προσδοκῶμεν.
    rationale: Kungoja emphasizes waiting, whereas προσδοκάω in this question is ‘expect/look for.’ “Tumtarajie” communicates the expected-person sense more directly.
  - severity: low
    issue: Internal capitalization in “Yule Ajaye” is not natural Swahili orthography.
    rationale: The Greek may be title-like, but capitalization is not needed to convey this in Swahili and can look like an imported English title convention.
