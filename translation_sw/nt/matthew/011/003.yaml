  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: sw
  text: akamwambia, “Je, wewe ndiye yule ajaye,[a] au tumtarajie mwingine?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yule anayekuja” au “yule atakayekuja.” Kirai cha Kigiriki kinaweza kutumiwa kama cheo cha kimasihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Kitenzi cha wakati uliopita εἶπεν na kiwakilishi αὐτῷ vinaelezwa kwa kawaida katika Kiswahili kwa “akamwambia.” Kiunganishi cha simulizi “aka-” kinaendeleza tukio kutoka mstari uliotangulia bila kuongeza “na” isiyo ya lazima.
- source_word: Σὺ εἶ
  choice: Je, wewe ndiye
  rationale: Kiwakilishi cha wazi σύ kinapewa uzito kwa “wewe,” huku “ndiye” kikitambulisha mtu anayeuliziwa kwa Kiswahili cha kawaida.
- source_word: ὁ ἐρχόμενος
  choice: Yule Ajaye
  rationale: Kirai hiki ni kivumishi-jina chenye kibainishi na kinaweza kufanya kazi kama jina la cheo la yule aliyekuwa akitarajiwa. “Yule Ajaye” huhifadhi maana ya kuja na pia nguvu ya kimasiha bila kutafsiri moja kwa moja kuwa “Masihi.”
- source_word: ἢ
  choice: au
  rationale: Hiki ni kiunganishi cha kawaida kinacholeta chaguo jingine katika swali.
- source_word: ἕτερον
  choice: mwingine
  rationale: Neno hili humaanisha mtu mwingine au tofauti; “mwingine” ni tafsiri fupi na ya kawaida katika muktadha huu.
- source_word: προσδοκῶμεν
  choice: tumngojee
  rationale: Katika swali la kutafakari hatua inayofaa, hali ya utegemezi “tumngojee” ni ya kawaida katika Kiswahili na hubeba wazo la kungojea kwa matarajio.
theological_decisions:
- issue: Nguvu ya kimasiha au ya cheo katika ὁ ἐρχόμενος
  choice: Yule Ajaye
  alternative: yule anayekuja; yule atakayekuja; Masihi
  rationale: Muktadha unaonyesha swali kuhusu mtu aliyekuwa akitarajiwa, lakini Kigiriki hakisemi wazi “Masihi.” Tafsiri iliyochaguliwa huhifadhi uwezekano wa cheo cha kimasiha pamoja na maana halisi ya yule anayekuja, bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yule Ajaye” limetumiwa kama jina la cheo, huku tanbihi ikihifadhi namna nyingine halali za kuelewa kirai hicho.
