  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: sw
  text: Lakini tangu siku za Yohana Mbatizaji mpaka sasa, ufalme wa mbinguni unafanyiwa vurugu,[a] na wanaume wenye vurugu wanaunyakua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufalme wa mbinguni unasonga mbele kwa nguvu, na wanaume wenye nguvu wanaukamata kwa nguvu.” Kitenzi cha Kigiriki kilichotafsiriwa “unafanyiwa vurugu” kinaweza pia kueleweka kwa maana ya kati.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Lakini tangu
  rationale: ἀπό huonyesha mwanzo wa kipindi, na δέ huleta badiliko dogo katika mtiririko. “Lakini tangu” ni ya asili katika Kiswahili na haitilii mkazo kupita kiasi tofauti iliyopo.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: siku za Yohana Mbatizaji
  rationale: Huhifadhi nahau ya Kigiriki ya “siku” kwa lugha ya Kiswahili iliyo wazi na yenye heshima.
- source_word: ἕως ἄρτι
  choice: mpaka sasa
  rationale: Ni usemi wa kawaida unaoonyesha mwendelezo kutoka siku za Yohana hadi wakati wa Yesu kusema.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Ni tafsiri ya kawaida ya usemi maalumu wa Mathayo, ikidumisha wazo la ufalme au utawala unaohusishwa na mbingu.
- source_word: βιάζεται
  choice: unafanyiwa vurugu
  rationale: 'Umbo hili linaweza kueleweka kwa maana ya kutendwa: ufalme unatendewa kwa nguvu au vurugu. Chaguo hili linaendana na βιασταί na ἁρπάζουσιν zinazofuata, huku maana ya kati ikihifadhiwa katika tanbihi.'
- source_word: βιασταὶ
  choice: watu wenye vurugu
  rationale: Neno hilo humaanisha watu wanaotumia nguvu au vurugu. Kiswahili hakilazimishi kutaja jinsia hapa, na “watu wenye vurugu” huwasilisha maana bila kuongeza dai kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: ἁρπάζουσιν αὐτήν
  choice: wanaunyakua
  rationale: “Kunyakua” huonyesha kuchukua kwa nguvu au ghafla na pia huhifadhi kiwakilishi kinachorejelea “ufalme.”
theological_decisions:
- issue: Maana ya βιάζεται kuhusiana na ufalme
  choice: 'Maana ya kutendwa katika matini kuu: “ufalme wa mbinguni unafanyiwa vurugu”'
  alternative: 'Maana ya kati/isiyotendwa: “ufalme wa mbinguni unasonga mbele kwa nguvu”'
  rationale: Kigiriki kina utata halisi. Maana ya kutendwa inapatana vizuri na kutajwa kwa watu wenye vurugu wanaounyakua, lakini maana ya ufalme kusonga mbele kwa nguvu pia ina msingi wa kiisimu. Tanbihi huhifadhi uwezekano huo bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Matini kuu imedumisha picha kali ya vurugu na kunyakua; tanbihi imehifadhi maana nyingine inayowezekana ya kitenzi.
