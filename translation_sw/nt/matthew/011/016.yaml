  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: sw
  text: Lakini nitakifananisha kizazi hiki na nini? Kinafanana na watoto walioketi katika viwanja vya masoko[a], wakiwaita wale wengine[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maeneo ya masoko.” Neno la Kigiriki linamaanisha maeneo ya umma ambako watu walifanya biashara na kukusanyika.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakiwaita watoto wengine.” Kigiriki kinasema “wale wengine”; muktadha wa mfano unaashiria kwamba ni watoto wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: Lakini nitakifananisha ... na nini?
  rationale: Muundo huu wa Kiswahili unaonyesha swali la balagha kuhusu kitu cha kulinganishia; δέ imetafsiriwa “Lakini” ili kuonyesha mpito wenye utofautishaji wa kiasi.
- source_word: τὴν γενεὰν ταύτην
  choice: kizazi hiki
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya watu wa wakati mmoja wanaotazamwa kama kundi.
- source_word: ὁμοία ἐστὶν
  choice: Kinafanana na
  rationale: Kauli rahisi na ya asili ya Kiswahili inayohifadhi wazo la ufananisho.
- source_word: παιδίοις
  choice: watoto
  rationale: Neno hili linamaanisha watoto; muktadha haulazimishi kuongeza “wadogo.”
- source_word: καθημένοις
  choice: walioketi
  rationale: Inawasilisha hali ya watoto kuwa wamekaa katika eneo hilo.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: katika viwanja vya masoko
  rationale: ἀγορά ni eneo la wazi la umma ambako biashara na mikusanyiko ilifanyika; “viwanja vya masoko” huepuka picha finyu ya maduka pekee.
- source_word: ἃ προσφωνοῦντα
  choice: wakiwaita
  rationale: Kitenzi kinaonyesha kuwa watoto wanawaelekea wengine kwa sauti; “wakiwaita” ni cha kawaida na kinadumisha tendo linaloendelea.
- source_word: τοῖς ἑτέροις
  choice: wale wengine
  rationale: Huhifadhi kutotajwa wazi kwa utambulisho wao katika Kigiriki, ingawa muktadha unaashiria watoto wengine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nitakifananisha ... na nini?” ni muundo wa asili wa Kiswahili, huku “viwanja vya masoko” kikihifadhi mazingira ya hadhara ya ἀγοραί. Alama zote za tanbihi zimewekwa katika matini.
