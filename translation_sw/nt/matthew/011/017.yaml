  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: sw
  text: Wanasema, ‘Tuliwapigia filimbi, lakini hamkucheza; tuliimba wimbo wa maombolezo, lakini hamkujipiga vifua kwa huzuni.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamkuomboleza.” Maneno ya Kigiriki yanarejelea desturi ya waombolezaji kujipiga mwili, hasa kifua, kwa huzuni.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Wanasema
  rationale: Wakati uliopo unadumisha uhai wa tukio na kutambulisha moja kwa moja malalamiko ya watoto.
- source_word: Ηὐλήσαμεν
  choice: Tuliwapigia filimbi
  rationale: Kitenzi αὐλέω kinataja hasa kupiga filimbi au zumari; ‘kuwapigia filimbi’ ni Kiswahili cha kawaida na kinaonyesha kwamba muziki ulielekezwa kwao.
- source_word: ὑμῖν
  choice: -wa- katika ‘tuliwapigia’
  rationale: Kiambishi cha yambwa kinaonyesha kwamba watoto waliwapigia wengine filimbi, kwa maana ya kutumbuiza kwa ajili yao.
- source_word: ὠρχήσασθε
  choice: hamkucheza
  rationale: Hutoa kwa lugha ya kawaida maana ya kucheza ngoma bila kuingiza maana ya kujirejelea isiyohitajika.
- source_word: ἐθρηνήσαμεν
  choice: tuliimba wimbo wa maombolezo
  rationale: θρηνέω huelekea kumaanisha kuomboleza kwa namna ya wimbo, hasa katika mazingira ya msiba; tafsiri hii pia inadumisha ulinganifu na kupiga filimbi.
- source_word: ἐκόψασθε
  choice: hamkujipiga vifua kwa huzuni
  rationale: Katika muktadha wa maombolezo, κόπτω ya kati hurejelea ishara ya kujipiga mwili, hasa kifua. Tafsiri hii inahifadhi taswira halisi na kufanya kusudi lake lieleweke.
