  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi mbili zinazolingana umehifadhiwa. ‘Filimbi’ limechaguliwa kama jina linaloeleweka kwa ala ndogo ya kupuliza; maelezo ya desturi ya maombolezo yamewekwa katika tanbihi.
