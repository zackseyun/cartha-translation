  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: sw
  text: Baada ya Yesu kubatizwa, mara akapanda kutoka majini. Na tazama, mbingu zikafunguliwa, naye akamwona Roho wa Mungu akishuka kama njiwa na kumjia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Baada ya Yesu kubatizwa
  rationale: Kirai cha wakati chenye kitenzi tegemezi cha aoristi katika hali ya kutendwa kinaonyesha tendo lililotangulia tendo kuu; Kiswahili hiki ni cha kawaida na kinadumisha hali ya kutendwa.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: mara akapanda kutoka majini
  rationale: “Mara” hudumisha mfuatano wa haraka wa εὐθύς; “akapanda kutoka majini” huonyesha mwendo wa kwenda juu kutoka kwenye maji bila kuongeza kwa lazima wazo la kuzamishwa.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni kiashiria cha simulizi kinachoelekeza usikivu kwa tukio la kushangaza na kinaeleweka katika Kiswahili cha hadhi.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: mbingu zikafunguliwa
  rationale: “Mbingu” hudumisha usemi wa Kigiriki wa wingi, huku muundo wa kutendwa ukibaki wazi.
- source_word: πνεῦμα θεοῦ
  choice: Roho wa Mungu
  rationale: Hudumisha uhusiano wa maneno ya Kigiriki bila kubadili moja kwa moja kuwa jina lenye ufafanuzi zaidi “Roho Mtakatifu.”
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: akishuka kama njiwa
  rationale: “Kama” hudumisha ulinganisho wa ὡσεὶ bila kusema kwamba Roho alikuwa njiwa kihalisi.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: na kuja juu yake
  rationale: Hufuata maana ya msingi ya ἔρχομαι, “kuja,” pamoja na ἐπί, bila kuongeza tafsiri maalumu ya “kutua.”
theological_decisions:
- issue: Iwapo πνεῦμα θεοῦ litafsiriwe kwa ujumla au kama rejeo la Roho Mtakatifu
  choice: Roho wa Mungu
  alternative: roho kutoka kwa Mungu; Roho Mtakatifu
  rationale: Muktadha unaelekeza kwa Roho Mtakatifu, lakini tafsiri inadumisha usemi halisi “Roho wa Mungu” na haiongezi zaidi ya Kigiriki.
- issue: Iwapo ὡσεὶ περιστερὰν humtambulisha Roho kuwa njiwa au huonyesha ulinganisho
  choice: kama njiwa
  alternative: akiwa njiwa
  rationale: Neno ὡσεὶ ni la ulinganisho; kwa hiyo tafsiri haidai kwamba Roho alikuwa njiwa kihalisi.
- issue: Mhusika wa εἶδεν
  choice: naye akamwona
  alternative: na akaonekana
  rationale: Kigiriki kina kitenzi cha kutenda “aliona”; kiwakilishi chake kwa kawaida humrejelea Yesu, huku tafsiri ikiacha muundo wa simulizi uonyeshe rejeo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Mara,” “tazama,” na “mbingu zikafunguliwa” hudumisha msisitizo wa kifungu bila kuwa cha kizamani kupita kiasi. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti za kileksia zinaweza kudumishwa ipasavyo katika matini kuu.
