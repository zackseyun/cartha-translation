id: MAT.3.14
reference: Matthew 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: sw
  text: Lakini Yohana aliendelea kujaribu kumzuia[a], akisema, “Mimi ninahitaji kubatizwa na wewe, na wewe unakuja kwangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana alijaribu kumzuia.” Kitenzi cha Kigiriki kinaweza kuonyesha tendo lililorudiwa au lililoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: aliendelea kujaribu kumzuia
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha tendo lililoendelea au lililorudiwa. Kauli hii inaleta maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba Yohana alifanikiwa kumzuia Yesu.
- source_word: λέγων
  choice: akisema
  rationale: Kauli ya kutenda inaunganisha maneno ya Yohana moja kwa moja na jitihada yake ya kumzuia Yesu.
- source_word: χρείαν ἔχω
  choice: ninahitaji
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya nahau yenye maana ya kuwa na uhitaji.
- source_word: ὑπὸ σοῦ
  choice: na wewe
  rationale: Pamoja na kitenzi cha kutendwa, muundo huu unamtaja Yesu kuwa mtendaji wa ubatizo. Kiswahili hutumia ‘na’ kumtaja mtendaji katika sentensi ya namna hii.
- source_word: βαπτισθῆναι
  choice: kubatizwa
  rationale: Inahifadhi hali ya kutendwa na istilahi ya kawaida ya kibiblia bila kubainisha zaidi namna ya ubatizo kuliko inavyohitajika hapa.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: na wewe unakuja kwangu?
  rationale: Inahifadhi swali la mshangao na utofauti uliopo katika Kigiriki bila kuongeza neno la kufafanua kama ‘hata hivyo.’
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofauti kati ya kuja kwa Yesu kwa Yohana na jitihada ya Yohana ya kumzuia.
theological_decisions:
- issue: Pingamizi la Yohana kuhusu kumbatiza Yesu
  choice: Maneno ya Yohana yametafsiriwa moja kwa moja, yakionyesha kwamba yeye mwenyewe anahitaji kubatizwa na Yesu.
  alternative: Kueleza wazi kwamba pingamizi hilo linahusu hasa kutokuwa na dhambi kwa Yesu au cheo na mamlaka yake.
  rationale: Mstari unaonyesha ukuu wa Yesu na uhitaji wa Yohana, lakini hauelezi kikamilifu msingi wa kitheolojia wa pingamizi hilo. Tafsiri haipaswi kutatua mvutano huo kwa kuongeza maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘aliendelea kujaribu’ umetumiwa kuwasilisha nguvu ya wakati usiotimilika wa Kigiriki.
