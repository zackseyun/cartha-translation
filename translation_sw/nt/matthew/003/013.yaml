  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: sw
  text: Ndipo Yesu akaja[a] kutoka Galilaya hadi Yordani kwa Yohana, ili abatizwe naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia wakati wa sasa wa kihistoria, “anakuja,” ili kufanya simulizi liwe hai zaidi. Inaweza pia kutafsiriwa “akafika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: παραγίνεται
  choice: akaja
  rationale: Kitenzi hiki kinaeleza kuja au kufika. Kiswahili cha simulizi hutumia kwa kawaida wakati uliopita; tanbihi inaonyesha kuwa Kigiriki kimetumia wakati wa sasa wa kihistoria.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: kutoka Galilaya
  rationale: ἀπό inaonyesha mahali safari ilipoanzia.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: hadi Yordani
  rationale: ἐπί pamoja na hali ya accusative hapa inaonyesha mwendo kuelekea mahali. Jina Yordani linatosha katika muktadha bila kuongeza neno lisilokuwapo katika mstari huu.
- source_word: πρὸς τὸν Ἰωάννην
  choice: kwa Yohana
  rationale: πρός hapa inaonyesha kwamba Yohana ndiye mtu ambaye Yesu alimwendea; kichwa ‘Mbatizaji’ hakijaongezwa kwa kuwa hakipo katika mstari.
- source_word: τοῦ βαπτισθῆναι
  choice: ili abatizwe
  rationale: Infinitive yenye kibainishi inaonyesha kusudi; ‘ili’ hulieleza wazi na kwa kawaida katika Kiswahili.
- source_word: ὑπ’ αὐτοῦ
  choice: naye
  rationale: ὑπό pamoja na genitive inaonyesha mtendaji. ‘Naye’ humrejelea Yohana bila kurudia jina lake.
theological_decisions:
- issue: Wakati wa kitenzi παραγίνεται
  choice: Wakati uliopita wa simulizi, ‘akaja,’ huku wakati wa sasa wa Kigiriki ukielezwa katika tanbihi
  alternative: ‘anakuja,’ kwa kuhifadhi moja kwa moja wakati wa sasa wa kihistoria
  rationale: ‘Akaja’ ni mtiririko wa kawaida na wenye hadhi katika simulizi la Kiswahili. Tanbihi huhifadhi taarifa ya kisarufi na athari ya uhai wa simulizi bila kutoa sentensi isiyo ya kawaida.
- issue: Jinsi ya kumtaja Yohana
  choice: ‘Yohana’ pekee
  alternative: ‘Yohana Mbatizaji’
  rationale: Mstari wa Kigiriki unasema Yohana tu; kutoongeza cheo chake huepuka kuingiza maneno kutoka muktadha katika mstari wenyewe.
- issue: Kauli ya ubatizo na mtendaji wake
  choice: ‘ili abatizwe naye’
  alternative: ‘ili Yohana ambatize’
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa, na ‘naye’ humtaja Yohana kuwa mtendaji bila kubadili sentensi kuwa kauli tendi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku tanbihi ikihifadhi sifa ya wakati wa sasa wa kihistoria katika Kigiriki.
