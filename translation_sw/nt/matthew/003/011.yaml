id: MAT.3.11
reference: Matthew 3:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: sw
  text: “Mimi ninawabatiza kwa maji[a] kwa ajili ya toba[b], lakini yule anayekuja baada yangu ana nguvu kuliko mimi; sistahili kubeba sandali zake. Yeye mwenyewe atawabatiza kwa Roho Mtakatifu na kwa moto[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya maji”; kihusishi cha Kigiriki ἐν kinaweza kutafsiriwa “kwa” au “katika” hapa na pia katika sehemu ya mwisho ya aya.
    reason: lexical_alternative
  - marker: b
    text: “Kwa ajili ya toba” pia inaweza kueleweka kwa maana ya “kuelekea kwenye toba”; usemi wa Kigiriki una mwelekeo bila kubainisha kama toba inatangulia ubatizo au inaonyeshwa nao.
    reason: lexical_alternative
  - marker: c
    text: “Moto” unaweza kueleweka kuwa taswira ya utakaso au ya hukumu; Kigiriki kinaacha maana hiyo wazi hapa, na muktadha unaozunguka unapaswa kuongoza uelewaji.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω
  choice: ninawabatiza
  rationale: Neno lililozoeleka la Kikristo ‘batiza’ linahifadhi maana ya ubatizo wa kidini bila kuamua kimakusudi namna yake kuwa kuzamisha pekee.
- source_word: ἐν ὕδατι
  choice: kwa maji
  rationale: ‘Kwa maji’ ni Kiswahili cha kawaida kinachoonyesha kipengele au njia inayotumika katika ubatizo; tanbihi inahifadhi uwezekano wa kutafsiri ἐν kwa maana ya ‘katika.’
- source_word: εἰς μετάνοιαν
  choice: kwa ajili ya toba
  rationale: Tafsiri hii ni fupi na ya asili, huku ikihifadhi uhusiano wenye mwelekeo au kusudi kati ya ubatizo na toba bila kubainisha zaidi mpangilio wake.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: lakini yule anayekuja baada yangu
  rationale: Inawasilisha kwa kawaida tofauti na mfuatano uliomo katika kishiriki cha Kigiriki.
- source_word: ἰσχυρότερός μού
  choice: ana nguvu kuliko mimi
  rationale: Ni tafsiri wazi ya ulinganisho wa nguvu, isiyotumia lugha ya kizamani.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: sistahili
  rationale: Katika kauli hii ya unyenyekevu, ‘sistahili’ inawasilisha nguvu ya kimuktadha ya ἱκανός kuliko tafsiri ya uwezo wa kimwili tu.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: kubeba sandali zake
  rationale: βαστάσαι ni ‘kubeba,’ si ‘kuvua’; ‘sandali’ inaonyesha kwa usahihi aina ya viatu inayokusudiwa.
- source_word: αὐτὸς
  choice: Yeye mwenyewe
  rationale: Inahifadhi msisitizo wa kiwakilishi na tofauti kati ya tendo la Yohana na tendo la yule ajaye.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: kwa Roho Mtakatifu
  rationale: Jina ‘Roho Mtakatifu’ linamtaja mhusika binafsi katika muktadha huu; ‘kwa’ ni ya kawaida katika Kiswahili, huku tanbihi ikitaja uwezekano wa ‘katika.’
- source_word: καὶ πυρί
  choice: na kwa moto
  rationale: Inahifadhi taswira ya moto bila kuifafanua kuwa utakaso au hukumu.
theological_decisions:
- issue: Maana ya ‘Roho Mtakatifu na moto’
  choice: Kuhifadhi maneno ‘kwa Roho Mtakatifu na kwa moto’ bila ufafanuzi ndani ya aya.
  alternative: ‘kwa Roho Mtakatifu na moto wa kutakasa’ au ‘kwa Roho Mtakatifu na moto wa hukumu’
  rationale: Kigiriki hakiamui wazi hapa kama moto unaonyesha utakaso au hukumu; muktadha unaofuata unapaswa kumwongoza msomaji.
- issue: Mhusika anayerejelewa na πνεύματι ἁγίῳ
  choice: Roho Mtakatifu
  alternative: roho takatifu au nguvu takatifu
  rationale: Katika muktadha wa Mathayo, usemi huu unaeleweka vizuri zaidi kuwa unamtaja Roho Mtakatifu, bila kuongeza maelezo ya kimafundisho yasiyomo katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku msisitizo wa ‘Yeye mwenyewe’ na utata halisi wa ἐν, εἰς μετάνοιαν, na taswira ya moto vikihifadhiwa.
