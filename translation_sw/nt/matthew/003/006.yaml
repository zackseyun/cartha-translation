  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: sw
  text: Nao walikuwa wakibatizwa naye katika Mto Yordani[a], huku wakiziungama dhambi zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “walibatizwa”; wakati wa kitenzi cha Kigiriki unaweza kusisitiza tendo lililokuwa likiendelea au kurudiwa: “walikuwa wakibatizwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: walikuwa wakibatizwa
  rationale: Kauli ya wakati uliopita usiotimilika na hali ya kutendwa inaonyesha tendo lililokuwa likiendelea au kurudiwa. Neno la kawaida la ibada, “kubatizwa,” linahifadhiwa bila kubainisha namna ya ubatizo.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: katika Mto Yordani
  rationale: Kirai kinaonyesha mahali, na ποταμῷ humtaja Yordani waziwazi kuwa mto. “Mto Yordani” ni mpangilio wa kawaida katika Kiswahili.
- source_word: ὑπ’ αὐτοῦ
  choice: naye
  rationale: ὑπό pamoja na uhusika milikishi humtaja mtendaji binafsi. “Naye” huhifadhi kiwakilishi cha Kigiriki, ambacho katika muktadha kinamrejelea Yohana, bila kuingiza jina lake katika mstari huu.
- source_word: ἐξομολογούμενοι
  choice: huku wakiziungama
  rationale: Kitenzi-shirikishi kinaonyesha tendo lililoenda sambamba na kubatizwa. “Kuungama” ni neno la moja kwa moja na la kawaida kwa kukiri makosa katika muktadha wa toba.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: dhambi zao
  rationale: Tafsiri hii huhifadhi wingi wa “dhambi” na umilikishi wa nafsi ya tatu.
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi kinaendeleza simulizi kutoka mstari uliotangulia; “Nao” huunganisha kwa kawaida huku kikirejelea watu waliotajwa katika muktadha.
theological_decisions:
- issue: Istilahi na namna ya ubatizo
  choice: kubatizwa
  alternative: kuzamishwa; kuoshwa
  rationale: Mstari unasema watu walibatizwa katika Yordani na Yohana lakini haufafanui wazi namna ya tendo hilo. “Kubatizwa” huhifadhi istilahi ya maandiko bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “huku wakiziungama” unaonyesha matendo yanayotokea kwa wakati mmoja; kiambishi “-zi-” kinarejelea dhambi zilizo katika wingi.
