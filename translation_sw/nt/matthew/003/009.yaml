  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: sw
  text: Wala msidhani kusema ninyi kwa ninyi[a], ‘Baba yetu ni Abrahamu.’ Kwa maana ninawaambia kwamba Mungu anaweza kumwinulia watoto Abrahamu kutoka katika mawe haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujisema moyoni.” Maneno ya Kigiriki yanaweza kumaanisha kujisemea ndani ya nafsi au kusema ninyi kwa ninyi kama kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: msidhani kwamba mnaweza
  rationale: Katazo hili linaonya wasijipe moyo kwa kudhani wanaweza kutegemea dai linalofuata; Kiswahili hiki kinaonyesha dhana ya kujiamini bila msingi, bila kuifanya kitenzi kimaanishe tu ‘kufikiri.’
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: kuambiana
  rationale: Kiwakilishi cha wingi kinaweza kuelekeza kwenye maneno yanayosemwa miongoni mwa kundi; ‘kuambiana’ ni cha kawaida na kinaacha maana ya dai la pamoja. Tanbihi inahifadhi uwezekano wa kujisemea moyoni.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Baba yetu ni Abrahamu
  rationale: Hii ni kauli ya asili na yenye mkazo kuhusu ukoo, bila kuongeza madai mengine ya kiteolojia.
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: Inahifadhi γάρ kama kiunganishi cha maelezo na kutumia mtindo wa heshima ulio wa kawaida.
- source_word: δύναται
  choice: anaweza
  rationale: Inaeleza uwezo wa Mungu kwa Kiswahili cha sasa na cha kawaida.
- source_word: ἐκ τῶν λίθων τούτων
  choice: kutoka katika mawe haya
  rationale: Inahifadhi picha halisi ya chanzo kilichoonyeshwa na ἐκ.
- source_word: ἐγεῖραι
  choice: kumwinulia
  rationale: Katika muktadha huu kitenzi kinamaanisha kumtokezea au kumpatia Abrahamu wazao, si lazima ufufuo; ‘kumwinulia’ huhifadhi nguvu na mwangwi wa usemi wa kibiblia.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno lisilobagua jinsia na linaweza kumaanisha watoto au wazao katika uhusiano na Abrahamu.
- source_word: τῷ Ἀβραάμ
  choice: Abrahamu
  rationale: Kiambishi cha mtendewa katika ‘kumwinulia Abrahamu’ huonyesha watoto wanaohusishwa naye kama wazao.
theological_decisions:
- issue: Maana ya kuwa wazao wa Abrahamu katika onyo la Yohana
  choice: Aya inakataa kutegemea ukoo wa kimwili kutoka kwa Abrahamu kuwa msingi wa usalama mbele za Mungu, bila kukana kwamba Abrahamu ni baba wa kihistoria wa Israeli.
  alternative: Kuichukulia kauli kuwa kutia chumvi tu bila kuikosoa imani katika upendeleo wa ukoo, au kuifanya itangaze kwamba Israeli ya kikabila imebadilishwa kabisa.
  rationale: Maneno yanakemea wazi kujiamini kwa sababu ya ukoo, lakini aya yenyewe haitoi mfumo mpana zaidi kuhusu nafasi ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kueleweka kwa wasomaji wa kawaida huku ukihifadhi uwezekano wa maana mbili katika λέγειν ἐν ἑαυτοῖς kupitia tanbihi.
