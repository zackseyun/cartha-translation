base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: sw
  text: Lakini Yesu akamjibu, “Ruhusu iwe hivyo kwa sasa, kwa maana kwa njia hii inatupasa kutimiza haki yote.[a]” Ndipo Yohana akamruhusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linalotafsiriwa “haki” linaweza pia kumaanisha “uadilifu.” Hapa linahusu kutenda yale yanayolingana na mapenzi ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Lakini Yesu akamjibu
  rationale: Muundo wa Kigiriki una maana ya kawaida ya ‘akajibu na kusema.’ ‘Akamjibu’ ni Kiswahili cha asili, na ‘Lakini’ linaonyesha tofauti kati ya jibu la Yesu na pingamizi la Yohana katika mstari uliotangulia.
- source_word: Ἄφες ἄρτι
  choice: Kubali iwe hivi kwa sasa
  rationale: Hapa ἀφίημι humaanisha kuruhusu jambo lifanyike, si kusamehe; ἄρτι huonyesha wakati huu wa sasa. Kauli hii inamwomba Yohana aendelee na ubatizo.
- source_word: οὕτως γὰρ
  choice: kwa maana kwa njia hii
  rationale: οὕτως hurejelea namna iliyotajwa katika muktadha, yaani Yohana kumbatiza Yesu; ‘kwa njia hii’ huhifadhi maana hiyo kwa uwazi.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: inatupasa
  rationale: Neno hili linaeleza jambo linalofaa au linalostahili kufanywa. ‘Inatupasa’ ni kauli ya kawaida na yenye hadhi, bila kulifanya kuwa amri ya kisheria pekee.
- source_word: πληρῶσαι
  choice: kutimiza
  rationale: ‘Kutimiza’ huhifadhi mwangwi wa matumizi ya πληρόω katika Mathayo kuhusu kutekelezwa kwa kusudi la Mungu.
- source_word: πᾶσαν δικαιοσύνην
  choice: haki yote
  rationale: ‘Haki’ huhifadhi upana wa δικαιοσύνη, unaoweza kujumuisha uadilifu na kutenda yanayolingana na mapenzi ya Mungu, bila kuufupisha kuwa sharti la sheria tu.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Ndipo akamkubalia
  rationale: Kitenzi cha Kigiriki kiko katika wakati wa sasa wa kisimulizi, lakini wakati uliopita wa kisimulizi ni wa asili katika Kiswahili. ‘Akamkubalia’ huonyesha kwamba Yohana alikubali ombi la Yesu na akaendelea, si kwamba alimwacha.
theological_decisions:
- issue: Maana ya ‘haki yote’
  choice: Kauli pana kuhusu kutimiza jambo linalofaa kulingana na mapenzi ya Mungu kwa Yesu kubatizwa na Yohana
  alternative: Kutimizwa kwa kila takwa la sheria, au msisitizo mwembamba juu ya haki ya kijamii pekee
  rationale: Muktadha unaunganisha maneno haya na ubatizo huu mahususi, huku δικαιοσύνη ikibaki pana. Tafsiri haipaswi kuifanya kuwa mfumo wa mafundisho ambao mstari wenyewe hauuelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kubali iwe hivi kwa sasa’ ni ombi la wazi la kuendelea na tendo lililokuwa limepingwa; ‘akamkubalia’ huepuka kuongeza maelezo yasiyosemwa moja kwa moja katika Kigiriki.
