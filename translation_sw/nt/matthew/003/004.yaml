id: MAT.3.4
reference: Matthew 3:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: sw
  text: Yohana mwenyewe alivaa vazi la singa za ngamia[b][c] na mshipi wa ngozi kiunoni[a], na chakula chake kilikuwa nzige na asali ya mwituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mavazi ya Yohana yanakumbusha jinsi nabii Eliya alivyoonekana katika 2 Wafalme 1:8, jambo muhimu katika jinsi Mathayo anavyomwasilisha Yohana.
    reason: cross_reference
  - marker: b
    text: Au, “vazi lake lilikuwa la singa za ngamia.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “alikuwa na vazi lake la singa za ngamia.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Yohana mwenyewe
  rationale: αὐτός ina mkazo, unaohifadhiwa kwa “mwenyewe”; δέ ni kiunganishi hafifu ambacho si lazima kitafsiriwe kwa neno tofauti katika Kiswahili.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: alivaa vazi
  rationale: Ingawa εἶχεν kwa msingi ni “alikuwa na,” katika muktadha huu inaeleza vazi alilovaa; “alivaa” ni ya asili na huepuka dhana ya kwamba aliagiza vazi litengenezwe.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: la singa za ngamia
  rationale: ἀπό hapa huonyesha kitu ambacho vazi lilitengenezwa nacho. “Singa” hueleza nywele ndefu na ngumu za mnyama kwa usahihi.
- source_word: ζώνην δερματίνην
  choice: mshipi wa ngozi
  rationale: ζώνη ni mshipi au mkanda wa kuzungushwa mwilini, na δερματίνην huonyesha kuwa ulitengenezwa kwa ngozi.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: kiunoni
  rationale: Hii ni tafsiri ya kawaida na ya sasa ya eneo linalozunguka ὀσφύς, bila kutumia lugha ya kizamani.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: na chakula chake kilikuwa
  rationale: τροφὴ ni chakula au lishe; muundo huu wa Kiswahili unaendeleza maelezo kwa uwazi.
- source_word: ἀκρίδες
  choice: nzige
  rationale: Maana ya kawaida ya neno hili ni wadudu wanaoitwa nzige; hakuna msingi wa kimuktadha wa kuligeuza kuwa aina ya mmea.
- source_word: μέλι ἄγριον
  choice: asali ya mwituni
  rationale: ἄγριον huonyesha asali iliyopatikana porini, si zao linalofugwa au kuzalishwa nyumbani.
theological_decisions:
- issue: Maelezo yanayomkumbusha msomaji nabii Eliya
  choice: Maelezo yametafsiriwa moja kwa moja, huku uhusiano na Eliya ukiwekwa katika tanbihi.
  alternative: Kutumia maneno katika andiko kuu yanayomtaja Eliya waziwazi.
  rationale: Andiko lenyewe linaeleza mavazi na chakula cha Yohana bila kumtaja Eliya. Tafsiri haipaswi kuingiza ufafanuzi huo ndani ya simulizi, ingawa 2 Wafalme 1:8 ni msingi muhimu wa kuelewa maelezo haya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vazi,” “mshipi,” “kiunoni,” na “asali ya mwituni” ni maneno yanayoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika andiko kuu karibu na vifungu vinavyohusika.
