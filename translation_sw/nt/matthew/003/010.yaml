  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: sw
  text: Na tayari shoka limewekwa kwenye mzizi wa miti.[a] Kwa hiyo, kila mti usiozaa matunda mazuri unakatwa na kutupwa motoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shoka tayari liko kwenye mzizi wa miti.”
    reason: Njia nyingine ya kutafsiri κεῖται kwa maana ya ‘liko’ badala ya kusisitiza kuwa limewekwa.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Na sasa hivi
  rationale: Huhifadhi kiunganishi chepesi cha δέ pamoja na dharura ya wakati katika ἤδη kwa Kiswahili cha kawaida.
- source_word: ἡ ἀξίνη
  choice: shoka
  rationale: Ni neno la kawaida la Kiswahili kwa chombo cha kukatia katika mfano huu.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: limekwisha kuwekwa kwenye mizizi ya miti
  rationale: Huwasilisha hali ya shoka kuwa tayari limewekwa mahali pa kukatia; wingi 'mizizi' ni wa asili zaidi katika Kiswahili kwa miti mingi.
- source_word: πᾶν οὖν δένδρον
  choice: Kwa hiyo, kila mti
  rationale: Kwa hiyo huonyesha hitimisho linalotokana na picha iliyotangulia.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: usiozaa matunda mazuri
  rationale: Kwa mti, 'kuzaa matunda' ni usemi wa kawaida na wazi; wingi 'matunda' ni wa asili katika Kiswahili huku ukihifadhi maana ya sitiari.
- source_word: ἐκκόπτεται
  choice: unakatwa
  rationale: Katika muktadha wa mti, huonyesha kukatwa kwake bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: εἰς πῦρ βάλλεται
  choice: kutupwa motoni
  rationale: Ni Kiswahili cha asili kinachohifadhi nguvu ya kitendo na picha ya moto.
theological_decisions:
- issue: Asili ya picha ya moto
  choice: motoni, bila ufafanuzi wa ziada
  alternative: hukumu ya mwisho; hukumu ya wakati huo; moto wa jehanamu
  rationale: Mstari unaonyesha hukumu, lakini hautaji kwa wazi aina yake; tafsiri inaacha picha hiyo bila kuibana katika fundisho mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida, huku ukihifadhi haraka ya onyo, sitiari ya miti, na kutobainishwa kwa aina ya moto.
