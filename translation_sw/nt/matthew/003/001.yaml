lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Katika siku hizo
  rationale: Kirai hiki kinaonyesha wakati. Kiunganishi δέ ni chepesi na si lazima kitafsiriwe kwa neno tofauti katika Kiswahili, kwa kuwa mwanzo huu tayari unaonyesha mpito wa simulizi.
- source_word: παραγίνεται
  choice: alitokea
  rationale: Kitenzi hiki kinaweza kumaanisha kuja au kutokea mbele ya watu. Ingawa kiko katika wakati wa sasa wa kihistoria, wakati uliopita ni wa kawaida na wazi katika simulizi la Kiswahili.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Yohana Mbatizaji
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili, na Mbatizaji linawakilisha kwa uwazi cheo kinachotokana na kazi ya kubatiza bila kuingiza maana ya dhehebu la baadaye.
- source_word: κηρύσσων
  choice: akihubiri
  rationale: Umbo la kitenzi linaonyesha tendo lililokuwa likifanyika pamoja na kutokea kwake; “akihubiri” ni la asili na linafaa kwa kutangaza ujumbe hadharani.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: nyikani mwa Yudea
  rationale: ἔρημος ni eneo lisilokaliwa sana au la ukiwa, si lazima jangwa la mchanga. “Nyikani” huhifadhi maana hiyo, na “Yudea” hutaja eneo la kijiografia la wakati huo.
theological_decisions:
- issue: Cheo βαπτιστής cha Yohana
  choice: Mbatizaji
  alternative: Yohana aliyekuwa akibatiza
  rationale: “Mbatizaji” ni cheo kifupi, cha kawaida, na kinachoonyesha kazi inayotajwa na neno la Kigiriki; hakihusishwi hapa na jina la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Nyikani” imechaguliwa badala ya “jangwani” ili kuepuka kudokeza bila lazima jangwa la mchanga.
