  text: Katika siku hizo, Yohana Mbatizaji alitokea[a], akihubiri nyikani mwa Yudea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kiko katika wakati wa sasa wa kihistoria unaosimulia tukio la zamani. Pia inaweza kutafsiriwa “alikuja.”
