  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: sw
  text: Ndipo watu wa Yerusalemu, wa Yudea yote, na wa eneo lote la kandokando ya Mto Yordani walikuwa wakimwendea Yohana[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliendelea kumwendea Yohana.” Wakati usiotimilika wa kitenzi cha Kigiriki unaonyesha tendo lililoendelea au lililorudiwa.
    reason: lexical_alternative
  - marker: b
    text: “Yudea yote” na “eneo lote la kandokando ya Mto Yordani” ni misemo mipana ya kijiografia inayoonyesha jinsi watu wengi walivyomwitikia Yohana; si lazima imaanishe kila mtu mmoja mmoja.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Wakati huo
  rationale: Ni kiashirio cha wakati kinachounganisha mwitikio huu na huduma ya Yohana iliyoelezwa kabla; ni cha kawaida na wazi katika Kiswahili.
- source_word: ἐξεπορεύετο
  choice: walikuwa wakimwendea
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea au lililorudiwa. Muundo huu wa Kiswahili unaonyesha hali hiyo bila kufanya sentensi kuwa nzito.
- source_word: πρὸς αὐτόν
  choice: wakimwendea Yohana
  rationale: πρός pamoja na kitenzi cha mwendo huonyesha kuelekea kwa mtu. Kutaja Yohana kwa jina kunafanya rejeo la kiwakilishi liwe wazi na la kawaida katika Kiswahili.
- source_word: Ἱεροσόλυμα
  choice: watu kutoka Yerusalemu
  rationale: Nakala ya Kigiriki hutumia jina la mji kwa maana ya wakazi wake. Kiswahili cha kawaida huhitaji kuweka wazi kwamba ni watu waliokuwa wakimwendea Yohana.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: Yudea yote
  rationale: Huhifadhi usemi mpana wa kijiografia unaoliona eneo lote kwa ujumla, bila kulazimisha maana ya kila mkazi mmoja mmoja.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: eneo lote linalozunguka Mto Yordani
  rationale: περίχωρος ni eneo au wilaya inayozunguka mahali fulani. Kutaja 'Mto Yordani' kunaweka wazi rejeo la kijiografia kwa msomaji wa kawaida.
- source_word: καὶ ... καὶ
  choice: '..., ... na ...'
  rationale: Orodha ya Kiswahili huunganisha kwa kawaida vipashio vya mwanzo kwa koma na cha mwisho kwa 'na', huku ikihifadhi mkusanyiko wa maeneo matatu.
theological_decisions:
- issue: Upeo wa misemo ya jumla kuhusu maeneo
  choice: Kuhifadhi 'Yudea yote' na 'eneo lote' kama misemo mipana ya kijiografia
  alternative: Kufafanua kuwa ni watu wengi tu kutoka maeneo hayo
  rationale: Misemo hiyo inaeleza kuenea sana kwa mwitikio kwa huduma ya Yohana, lakini si lazima imaanishe kwamba kila mkazi bila ubaguzi alimwendea. Tafsiri inahifadhi nguvu ya lugha ya chanzo, na tanbihi inaeleza matumizi yake ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Watu kutoka' hutafsiri matumizi ya majina ya maeneo kwa wakazi wake kwa njia ya kawaida. Sentensi inaepuka tafsiri ya neno kwa neno inayoweza kufanya maeneo yenyewe yaonekane kama ndiyo yaliyotembea.
