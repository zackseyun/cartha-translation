  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: sw
  text: Pepeo yake iko mkononi mwake[a], naye atasafisha kabisa uwanja wake wa kupuria na kukusanya ngano yake katika ghala lake[b], lakini makapi atayateketeza kwa moto usiozimika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “koleo la kupepetea.”
    reason: lexical_alternative
  - marker: b
    text: Au “bohari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pepeto
  rationale: Ni chombo cha kilimo kinachotumiwa kurusha nafaka hewani ili kuitenga na makapi. “Pepeto” ni neno la Kiswahili linalofaa kwa chombo hicho; tanbihi inafafanua umbo linalowezekana.
- source_word: διακαθαριεῖ
  choice: atasafisha kabisa
  rationale: Kitenzi cha Kiyunani kinasisitiza kusafisha kikamilifu; “atasafisha kabisa” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἅλωνα
  choice: uwanja wake wa kupuria
  rationale: Hutaja mahali pa kupuria na kupepeta nafaka. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: σῖτον
  choice: ngano
  rationale: Ingawa neno linaweza kumaanisha nafaka kwa upana, katika taswira ya kupepeta na kutenganisha makapi, “ngano” ni tafsiri asilia na mahususi.
- source_word: ἀποθήκην
  choice: ghalani
  rationale: Neno la Kiyunani humaanisha mahali pa kuhifadhia. “Ghala” ni neno la kawaida la Kiswahili kwa jengo au sehemu ya kuhifadhia nafaka.
- source_word: ἄχυρον
  choice: makapi
  rationale: Katika muktadha wa kupepeta, “makapi” hutaja sehemu zisizofaa zinazotenganishwa na nafaka.
- source_word: κατακαύσει
  choice: atayateketeza
  rationale: Kitenzi hiki hudokeza kuchoma kabisa. “Atayateketeza” huhifadhi nguvu hiyo kuliko “atayachoma” pekee.
- source_word: πυρὶ ἀσβέστῳ
  choice: kwa moto usiozimika
  rationale: Huhifadhi maana ya moto ambao hauwezi kuzimwa na pia matumizi ya moto kama njia ya kuteketeza.
- source_word: οὗ
  choice: yake / mwake
  rationale: Kiwakilishi husianisha chombo na yule ajaye aliyetajwa katika mstari uliotangulia. Kiswahili cha asili hutumia viambishi vya umilikaji badala ya kuanza na muundo wa moja kwa moja wa “ambaye...”.
theological_decisions:
- issue: Taswira ya hukumu ya kutenganisha ngano na makapi
  choice: Taswira halisi ya kilimo na lugha ya wakati ujao zimehifadhiwa bila kufafanua moja kwa moja ngano na makapi ni nani.
  alternative: Kufafanua katika matini kwamba ngano ni wenye haki na makapi ni waovu.
  rationale: Mstari wenyewe unatoa sitiari na matokeo yake makali bila kutaja wazi wanaowakilishwa. Tafsiri inapaswa kuhifadhi uzito na mvutano huo wa kitheolojia bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msamiati wa jadi wa kilimo umetumiwa pale ulipo sahihi, huku tanbihi zikisaidia kwa maneno yanayoweza kutofahamika kwa baadhi ya wasomaji.
