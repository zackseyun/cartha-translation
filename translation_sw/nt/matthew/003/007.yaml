language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: sw
  text: Lakini alipowaona wengi miongoni mwa Mafarisayo na Masadukayo wakija kwenye ubatizo wake, aliwaambia, “Enyi wazao wa nyoka wenye sumu![a] Ni nani aliyewaonya kuikimbia ghadhabu inayokuja?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa namna nyingine: “Enyi kizazi cha nyoka wenye sumu!”'
    reason: Mbadala huu unawakilisha maana ya Γεννήματα kama kundi au kizazi kilichotokana na nyoka, huku “wazao” katika maandishi makuu likifuata kwa karibu zaidi wazo la waliozaliwa.
  - marker: b
    text: 'Kwa namna nyingine: “ghadhabu iliyo karibu kuja.”'
    reason: μελλούσης linaweza kusisitiza kwamba ghadhabu hiyo inakaribia kutokea, si tu kwamba itakuja wakati fulani ujao.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Lakini alipowaona
  rationale: Kishirikishi cha wakati uliopita pamoja na δέ kimetafsiriwa kama kishazi cha wakati chenye utofautishaji mdogo, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: wengi miongoni mwa Mafarisayo na Masadukayo
  rationale: Muundo wa Kigiriki unaonyesha wengi kutoka katika makundi hayo, si lazima wanachama wao wote.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: wakija kwenye ubatizo wake
  rationale: Kauli hii inaonyesha kuwa walikuwa wakielekea kwenye ubatizo wa Yohana bila kuongeza kwa uhakika kwamba walikuja ili wabatizwe au kwamba walibatizwa.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Enyi wazao wa nyoka wenye sumu
  rationale: “Wazao” linaakisi wazo la waliozaliwa au waliotokana na, na “nyoka wenye sumu” linafikisha maana ya ἐχιδνῶν kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Ni nani aliyewaonya
  rationale: Katika muktadha wa kuikimbia ghadhabu, kitenzi hiki kina maana ya kuonyesha hatari au kuonya, si kutoa habari tu.
- source_word: φυγεῖν ἀπὸ
  choice: kuikimbia
  rationale: Kitenzi hiki kinadumisha taswira ya kuondoka kwa haraka ili kuepuka hatari; kiambishi cha yambwa kinaunganisha moja kwa moja na ghadhabu.
- source_word: τῆς μελλούσης ὀργῆς
  choice: ghadhabu inayokuja
  rationale: “Ghadhabu” inadumisha uzito wa ὀργή, na “inayokuja” inaonyesha jambo linalotarajiwa au lililo karibu kutokea bila kuligeuza kuwa “hukumu” au “adhabu.”
theological_decisions:
- issue: Wanaolengwa katika makundi hayo
  choice: Yohana anawakemea wengi miongoni mwa Mafarisayo na Masadukayo waliokuwa wakija, bila kudai kwamba kila Mfarisayo na kila Msadukayo alikuwapo au alihusika kwa kiwango kilekile.
  alternative: Kuyataja makundi yote kwa jumla kana kwamba kila mwanachama anashutumiwa moja kwa moja.
  rationale: Muundo wa sehemu, πολλοὺς τῶν, unaunga mkono maana ya “wengi miongoni mwao” na unazuia ujanibishaji unaozidi maandishi.
- issue: Nguvu ya kieskatolojia ya ὀργή
  choice: ghadhabu
  alternative: hukumu; adhabu
  rationale: “Ghadhabu” inadumisha mvutano na uzito wa kitheolojia wa neno la chanzo bila kulainisha kuwa matokeo au adhabu pekee.
- issue: Kusudi la kuja kwao kwenye ubatizo
  choice: wakija kwenye ubatizo wake
  alternative: wakija ili Yohana awabatize
  rationale: Andiko linasema walikuwa wakija kwenye ubatizo wa Yohana, lakini katika mstari huu halisemi wazi kwamba wote walikusudia kubatizwa au walibatizwa; tafsiri inadumisha nafasi hiyo ya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku “ghadhabu” na mwito “Enyi” vikidumisha uzito wa ukemeo wa kinabii. Alama za tanbihi [a] na [b] zimewekwa katika maandishi makuu mahali zinapohusika.
