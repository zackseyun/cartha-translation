  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: sw
  text: Na tazama, sauti kutoka mbinguni[a] ikasema, “Huyu ni Mwanangu mpendwa, ambaye nimependezwa naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika mbingu.” Kigiriki kina umbo la wingi, “mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Na tazama
  rationale: “Tazama” linaendeleza kazi ya ἰδού kama kiashiria cha kuvuta fikira kwenye tukio muhimu, huku likibaki la kawaida na lenye hadhi katika Kiswahili.
- source_word: φωνὴ
  choice: sauti
  rationale: Katika muktadha huu φωνή ni sauti inayosema maneno yanayoeleweka, si kelele tu.
- source_word: ἐκ τῶν οὐρανῶν
  choice: kutoka mbinguni
  rationale: Ingawa Kigiriki kina umbo la wingi, “mbinguni” ndiyo nahau ya kawaida ya Kiswahili kwa eneo la mbingu na haikulazimishi tafsiri isiyo ya kawaida.
- source_word: λέγουσα
  choice: ikasema
  rationale: Kirai tegemezi cha Kigiriki kinachoitambulisha kauli ya moja kwa moja kimetafsiriwa kwa kitenzi kikamilifu kinachotiririka kiasili katika Kiswahili.
- source_word: Οὗτός ἐστιν
  choice: Huyu ni
  rationale: Hii inahifadhi utambulisho wa moja kwa moja unaoonyeshwa na kiwakilishi cha Kigiriki pamoja na kitenzi kishirikishi.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Mwanangu mpendwa
  rationale: “Mwanangu” huunganisha kwa kawaida “Mwana wangu,” na “mpendwa” huonyesha maana ya ἀγαπητός bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: ἐν ᾧ
  choice: ambaye ... naye
  rationale: Muundo huu ni nahau ya Kiswahili inayowasilisha uhusiano wa ἐν ᾧ na εὐδόκησα kwa uwazi na kwa kawaida.
- source_word: εὐδόκησα
  choice: ninapendezwa
  rationale: Wakati uliopo wa Kiswahili unafaa kwa tamko hili la kibali na furaha ya Mungu; huepuka kulifanya kuwa tukio la zamani tu.
theological_decisions:
- issue: Tamko la Mungu kuhusu uana wa Yesu
  choice: Mwanangu mpendwa
  alternative: Mwanangu ninayempenda
  rationale: Tafsiri inadumisha wazi uana na upendo unaotamkwa katika Kigiriki bila kuingiza maelezo kuhusu namna au wakati wa uana huo.
- issue: Umbo la wingi la οὐρανῶν
  choice: kutoka mbinguni
  alternative: kutoka katika mbingu
  rationale: Kiswahili hutumia “mbinguni” kiasili kwa wazo hili; tofauti ya kimaumbo kati ya umoja na wingi wa Kigiriki haipaswi kulazimishwa mahali ambapo Kiswahili hakuitoi kwa njia ileile.
- issue: Nahau ἐν ᾧ εὐδόκησα
  choice: ambaye ninapendezwa naye
  alternative: ambaye nimependezwa ndani yake
  rationale: Chaguo kuu linawasilisha kibali cha Mungu kwa Kiswahili cha kawaida. Chaguo la neno kwa neno “ndani yake” si la kawaida na linaweza kupotosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Na tazama” huhifadhi msisitizo wa simulizi; “Mwanangu mpendwa” hudumisha uzito wa tamko bila kuwa la kizamani.
