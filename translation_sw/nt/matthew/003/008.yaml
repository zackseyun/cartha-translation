  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: sw
  text: Kwa hiyo, zaeni matunda yanayolingana na toba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matunda yapasayo toba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: zaeni
  rationale: Ingawa kitenzi hiki kwa kawaida humaanisha ‘fanyeni’ au ‘zalisheni,’ katika taswira ya matunda Kiswahili cha kawaida hutumia ‘zaeni matunda.’ Hali ya amri imehifadhiwa na inawaita wasikilizaji wengi wachukue hatua.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na onyo na mwito uliotangulia; ‘Kwa hiyo’ ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: καρπὸν
  choice: matunda
  rationale: Ni taswira ya matokeo yanayoonekana katika mwenendo. Kiswahili hutumia wingi ‘matunda’ kwa kawaida katika usemi huu, ingawa Kigiriki kina umoja wa kijumla.
- source_word: ἄξιον
  choice: yanayolingana na
  rationale: Pamoja na nomino katika hali ya genitivi, neno hili hapa linaonyesha ufaafu au ulinganifu. ‘Yanayolingana na’ huepuka wazo lisilokusudiwa kwamba matendo yanastahili au yananunua toba.
- source_word: μετανοίας
  choice: toba
  rationale: ‘Toba’ ni neno la kawaida na lililoeleweka katika Kiswahili kwa kubadili moyo na mwelekeo na kumrudia Mungu; halipunguzi maana iwe badiliko la mawazo pekee.
theological_decisions:
- issue: Maana ya καρπὸν ἄξιον τῆς μετανοίας
  choice: Amri ya kuonyesha kwa mwenendo matokeo yanayolingana na toba ya kweli
  alternative: Matunda yanayoistahili toba au yanayoipata kwa matendo
  rationale: Muundo unaonyesha ulinganifu au ufaafu, si kustahili kwa matendo. Tafsiri inadumisha dai la kimaadili kwamba toba iwe na matokeo yanayoonekana bila kusema matendo ndiyo hununua au kusababisha toba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Zaeni matunda’ ni tamathali ya asili katika Kiswahili; ‘yanayolingana na toba’ ni wazi kwa msomaji wa kawaida huku kikihifadhi maana ya ufaafu.
