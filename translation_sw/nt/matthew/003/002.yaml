  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: sw
  text: akisema, “Tubuni[a], kwa maana ufalme wa mbinguni[b] umekaribia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Badilini nia na mwelekeo wenu.” Kitenzi cha Kigiriki kinaeleza mabadiliko ya msingi katika namna ya kufikiri na kuelekeza maisha, si kuhisi hatia tu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri iliyo karibu zaidi na umbo la Kigiriki, “ufalme wa mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: akisema
  rationale: Katika muktadha unaoendelea kutoka mstari uliotangulia, umbo hili la Kiswahili linaunganisha kitenzi-shirikishi λέγων kwa kawaida na kitendo cha Yohana bila kuongeza maana mahsusi ya ‘kuhubiri’ au ‘kutangaza.’ καὶ hapa inaweza kuachwa ndani ya muundo wa kitenzi ‘akisema’ bila kupoteza mwendelezo wa simulizi.
- source_word: Μετανοεῖτε
  choice: Tubuni
  rationale: Ni amri kwa watu wengi na ndiyo njia ya kawaida, ya heshima, na inayoeleweka ya kutafsiri μετανοέω katika Kiswahili. Hapa kutubu hakumaanishi kuhuzunika tu, bali kubadili nia, fikra, na mwelekeo wa maisha kwa kuitikia utawala wa Mungu unaokaribia.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaonyesha sababu ya amri iliyotangulia kwa mtindo wa kawaida wa Kiswahili.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha kwamba ufalme umekuja karibu na sasa uko karibu; ‘umekaribia’ huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἡ βασιλεία
  choice: ufalme
  rationale: ‘Ufalme’ huhifadhi upana wa βασιλεία, ambao unaweza kuhusisha utawala wa kifalme pamoja na eneo au hali inayotawaliwa.
- source_word: τῶν οὐρανῶν
  choice: wa mbinguni
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa usemi wa Mathayo, huku wingi halisi wa Kigiriki, ‘mbingu,’ ukielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya wito Μετανοεῖτε
  choice: Tubuni
  alternative: Badilini nia na mwelekeo wenu
  rationale: ‘Tubuni’ ni neno la kawaida la kibiblia na la Kiswahili linaloweza kubeba mabadiliko ya ndani na ya mwenendo. Tanbihi inalinda upana wa Kigiriki dhidi ya kueleweka kuwa hisia ya hatia pekee.
- issue: Maana ya ‘ufalme wa mbinguni’
  choice: Kuhifadhi usemi ‘ufalme wa mbinguni’
  alternative: utawala wa Mungu
  rationale: Usemi wa Mathayo umehifadhiwa bila kuufafanua moja kwa moja kuwa dhana moja tu. Hivyo ‘ufalme’ unaweza kuhusisha utawala wa Mungu na yale yanayotawaliwa naye, huku ‘mbinguni’ ikidumisha namna Mathayo anavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo ‘akisema’ unaonyesha kuwa mstari huu unaendelea kisarufi kutoka Mathayo 3:1.
