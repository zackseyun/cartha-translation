source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: sw
  text: 'Kwa maana huyu ndiye aliyenenwa kwa njia ya nabii Isaya, aliyesema: “Sauti ya mtu anayepaza sauti nyikani[a]: ‘Itayarisheni njia ya Bwana[b]; yanyoosheni mapito yake.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Sauti ya mtu anayepaza sauti: ‘Nyikani itayarisheni njia ya Bwana; yanyoosheni mapito yake.’”'
    reason: Uakifishaji wa maandishi ya Kigiriki unaweza kuhusisha ‘nyikani’ ama na mtu anayepaza sauti ama na amri ya kuitayarisha njia.
  - marker: b
    text: Au, “BWANA”; nukuu hii inarudia Isaya 40:3, ambapo maandishi ya Kiebrania yana jina la Mungu YHWH.
    reason: Tanbihi inaonyesha msingi wa jina la Mungu katika chanzo cha Kiebrania huku matini kuu ikifuata κύριος ya Kigiriki.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν ὁ ῥηθεὶς
  choice: Kwa maana huyu ndiye aliyenenwa
  rationale: Muundo huu unamhusu Yohana Mbatizaji katika muktadha uliotangulia, unahifadhi nguvu ya kiwakilishi cha kuonyesha οὗτος na kazi ya γάρ ya kutoa sababu au maelezo.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου λέγοντος
  choice: kwa njia ya nabii Isaya, aliyesema
  rationale: ‘Kwa njia ya’ inahifadhi wazo la Isaya kuwa njia au chombo cha ujumbe wa kinabii, badala ya kulirahisisha kuwa tendo la Isaya peke yake. ‘Aliyesema’ linaanzisha nukuu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Φωνὴ βοῶντος
  choice: Sauti ya mtu anayepaza sauti
  rationale: Hii inahifadhi muundo wa nomino pamoja na kishiriki cha hali ya umilikishi. ‘Kupaza sauti’ huonyesha mwito mkubwa wa hadharani bila kudokeza lazima kilio cha huzuni.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: ‘Nyikani’ hueleza eneo lisilokaliwa au la porini linalohusishwa na huduma ya Yohana na mwangwi wa Isaya 40:3; pia huepuka kulifanya eneo hilo kuwa jangwa la mchanga tu.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Itayarisheni njia ya Bwana
  rationale: Amri ya wingi imehifadhiwa katika ‘-eni’; ‘njia’ inafaa kwa maana halisi na ya kimfano, na ‘Bwana’ ndilo neno la kawaida la Kiswahili kwa κύριος.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: yanyoosheni mapito yake
  rationale: ‘Yanyoosheni’ inawasilisha amri ya kuyafanya yawe manyoofu, huku ‘mapito’ yakidumisha taswira ya kishairi na kiwakilishi ‘yake’ kikihifadhi mhusika binafsi.
theological_decisions:
- issue: Tafsiri ya κυρίου katika nukuu ya Isaya 40:3, ambapo maandishi ya Kiebrania yana jina la Mungu YHWH
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki ya Mathayo yana κυρίου, kwa hiyo matini kuu inatafsiri neno hilo moja kwa moja kuwa ‘Bwana.’ Tanbihi inaeleza msingi wa Kiebrania bila kuficha uhusiano wa nukuu hiyo na jina la Mungu.
- issue: Uhusiano wa ἐν τῇ ἐρήμῳ na ‘anayepaza sauti’ au na amri ‘itayarisheni’
  choice: ‘anayepaza sauti nyikani’
  alternative: '‘anayepaza sauti: Nyikani itayarisheni’'
  rationale: Kwa kuwa maandishi ya kale hayakuwa na uakifishaji wa kisasa, kirai hicho kinaweza kuhusishwa na mpazaji sauti au na mahali pa kuitayarisha njia. Muktadha wa Mathayo kuhusu huduma ya Yohana unaunga mkono matini kuu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nyikani’ limetumiwa badala ya ‘jangwani’ ili kuwasilisha eneo la porini bila kulibana kuwa jangwa la mchanga. Uakifishaji unaonyesha wazi kwamba sauti inaanza kutoa ujumbe, huku tanbihi ikihifadhi uwezekano mwingine wa kisintaksia.
