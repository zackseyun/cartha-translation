  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: sw
  text: Lakini hata nywele zote za vichwa vyenu zimehesabiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zimekwisha kuhesabiwa.” Muundo wa Kigiriki unasisitiza tendo lililokamilika ambalo matokeo yake yanaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: vyenu
  rationale: Ni kiwakilishi cha umilikishi cha nafsi ya pili wingi; katika Kiswahili kinaambatana kwa kawaida na “vichwa” ili kuonyesha kwamba Yesu anazungumza na watu wengi.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofautishaji wa kiasi katika mfululizo wa hoja na kudumisha uhusiano na uhakikisho uliotangulia.
- source_word: καὶ
  choice: hata
  rationale: 'Hapa kina nguvu ya kusisitiza: hata kitu kidogo kama nywele kinahesabiwa.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: nywele ... za vichwa vyenu
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaohifadhi picha halisi ya nywele za kichwa na wingi wa watu wanaosemewa.
- source_word: πᾶσαι
  choice: zote
  rationale: Linadumisha msisitizo wa jumla bila kuacha hata nywele moja.
- source_word: ἠριθμημέναι εἰσίν
  choice: zimehesabiwa
  rationale: Kauli tendwa ya wakati timilifu katika Kiswahili inaeleza tendo lililokamilika pamoja na hali yake inayoendelea, kwa mtindo wa kawaida na wenye hadhi.
theological_decisions:
- issue: Upeo wa ujuzi na utunzaji wa Mungu unaodokezwa
  choice: Kudumisha kauli halisi kwamba nywele zote zimehesabiwa
  alternative: Kufafanua moja kwa moja kwamba Mungu anajua au anatawala kila jambo
  rationale: Matini yenyewe inatoa picha halisi ya nywele zilizohesabiwa. Tafsiri haiongezi ufafanuzi wa kimafundisho, bali inaacha maana kuhusu ujuzi na utunzaji wa Mungu ijitokeze katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vichwa vyenu” ni wingi wa kawaida unaolingana na wasikilizaji wengi, huku “zimehesabiwa” ikihifadhi hali ya kauli tendwa na maana ya wakati timilifu.
