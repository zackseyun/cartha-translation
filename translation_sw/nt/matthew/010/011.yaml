  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: sw
  text: Mkiingia katika mji wowote au kijiji chochote, chunguzeni[a] ni nani humo anayestahili[b], kisha kaeni huko mpaka mtakapoondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulizeni kwa makini” au “tafuteni mjue.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “anayestahili” huenda ikamaanisha mtu anayefaa au aliye tayari kuwapokea wajumbe, si mtu aliyejipatia kibali cha Mungu kwa matendo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Mkiingia katika mji wowote au kijiji chochote
  rationale: Muundo huu unaonyesha mahali popote ambapo wanafunzi wataingia. “Mkiingia” ni Kiswahili cha kawaida kwa sharti hili, na “wowote/chochote” huhifadhi kutokutajwa kwa mahali maalumu.
- source_word: ἐξετάσατε
  choice: chunguzeni
  rationale: Kitenzi hiki kina maana ya kufanya uchunguzi au kuuliza kwa makini ili kupata habari. “Chunguzeni” ni agizo lililo wazi na huhifadhi uzito wa jitihada inayokusudiwa kuliko “jueni” peke yake.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: ni nani humo anayestahili
  rationale: “Humo” hurejelea mji au kijiji kilichotajwa. “Anayestahili” huhifadhi maana ya tathmini ya ἄξιος bila kuamua kimya-kimya kwamba ni suala la ustahili wa kiroho, maadili, au ufaafu wa kumpokea mjumbe.
- source_word: κἀκεῖ μείνατε
  choice: kisha kaeni huko
  rationale: “Huko” huhifadhi rejeo la mahali la ἐκεῖ bila kuongeza wazi “nyumbani kwake,” jambo ambalo halijasemwa moja kwa moja katika mstari huu. “Kaeni” ni agizo la kawaida na la asili.
- source_word: ἕως ἂν ἐξέλθητε
  choice: mpaka mtakapoondoka
  rationale: Tafsiri hii huonyesha kikomo cha kukaa hadi wakati wa kuondoka, na ni Kiswahili cha kawaida kinachoeleweka vizuri.
theological_decisions:
- issue: Maana ya ἄξιος (“anayestahili”) katika maagizo ya utume
  choice: Neno “anayestahili” limehifadhiwa katika maandishi, huku tanbihi ikieleza uwezekano wa maana ya mtu anayefaa au aliye tayari kuwapokea wajumbe.
  alternative: Kutafsiri moja kwa moja “anayefaa kuwapokea” au kuelewa kuwa anastahili kwa wema wake wa kimaadili.
  rationale: Muktadha unaelekea kwenye ufaafu wa mwenyeji wa kuwapokea wajumbe, lakini neno la Kigiriki lina maana pana ya tathmini. Maandishi makuu yanahifadhi mvutano huo bila kulifanya fundisho kuhusu kustahili wokovu au kuwa bora kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika muundo wa agizo unaosomeka kwa urahisi. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
