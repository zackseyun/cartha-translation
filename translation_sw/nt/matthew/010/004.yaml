id: MAT.10.4
reference: Matthew 10:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: sw
  text: Simoni Mkananayo[a], na Yuda Iskariote, ambaye pia alimsaliti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simoni Mwenye Juhudi.” Kigiriki hapa kinasema “Mkananayo,” huenda likiwa jina la cheo lenye asili ya Kiaramu au Kiebrania ambalo kwa kawaida limeeleweka kumaanisha “Mwenye Juhudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alimkabidhi.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumkabidhi,” ingawa katika habari ya Yuda “alimsaliti” linafaa kwa muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Mkananayo
  rationale: Uhamishaji wa sauti wa cheo cha Kigiriki chenye asili ya Kiaramu/Kiebrania unahifadhi umbo la chanzo bila kukiweka moja kwa moja kuwa ‘Mwenye Juhudi’; maana hiyo ya kawaida imeonyeshwa katika tanbihi.
- source_word: Ἰσκαριώτης
  choice: Iskariote
  rationale: Hili ni umbo la kawaida la Kiswahili la jina au lakabu hiyo, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: παραδοὺς
  choice: alimsaliti
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘kumkabidhi,’ katika muktadha wa Yuda kinadokeza kumtoa Yesu kwa hila kwa adui zake; ‘alimsaliti’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: ambaye pia alimsaliti
  rationale: Kishiriki chenye kibainishi kinamtambulisha Yuda kwa tendo lake; kishazi rejeshi ni cha asili katika Kiswahili, na ‘pia’ kinahifadhi καί.
theological_decisions:
- issue: Ikiwa παραδοὺς itafsiriwe kwa usemi usioegemea upande wowote ‘alimkabidhi’ au kwa usemi wenye uzito wa kimuktadha ‘alimsaliti’
  choice: alimsaliti
  alternative: alimkabidhi
  rationale: Katika orodha hii Yuda anatambulishwa kwa tendo linalojulikana katika simulizi la Injili. ‘Alimsaliti’ huonyesha uzito wa kimahusiano na kimaadili wa muktadha bila kuongeza fundisho; tanbihi inahifadhi upana wa kimsingi wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa orodha umehifadhiwa, majina yametoholewa kwa maumbo yanayoeleweka, na tanbihi zinaonyesha kwa uwazi tafsiri mbadala bila kuondoa mvutano wa kileksika.
