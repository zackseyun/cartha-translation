  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: sw
  text: Kwa hiyo, msiogope; ninyi ni wa thamani kuliko shomoro wengi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Kwa hiyo, msi-
  rationale: οὖν inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu utunzaji wa Baba, na μὴ pamoja na amri ya wakati wa sasa hutoa katazo. “Kwa hiyo, msiogope” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: φοβεῖσθε
  choice: ogope
  rationale: Kitenzi φοβέομαι hapa ni amri ya wingi yenye maana ya kuwa na hofu; “msiogope” ni katazo la kawaida na la moja kwa moja kwa Kiswahili.
- source_word: πολλῶν στρουθίων
  choice: shomoro wengi
  rationale: Katika muktadha wa karibu, στρουθίον inarejelea shomoro, ndege wadogo waliotajwa katika mstari wa 29. Muundo huu unakamilisha ulinganisho unaoletwa na διαφέρετε.
- source_word: διαφέρετε
  choice: ni wa thamani kuliko
  rationale: Katika muktadha huu διαφέρω ina maana ya kuzidi kwa thamani au umuhimu, si kutofautiana tu. “Ni wa thamani kuliko” ni usemi wa asili unaohifadhi ulinganisho huo bila kudokeza thamani ya kibiashara pekee.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo. “Ninyi” kinahifadhi mkazo na utofautishaji kati ya wanafunzi na shomoro.
theological_decisions:
- issue: Thamani ya wanadamu ikilinganishwa na shomoro katika mafundisho ya Yesu
  choice: ninyi ni wa thamani kuliko shomoro wengi
  alternative: ninyi mnawazidi shomoro wengi
  rationale: Tafsiri hii huhifadhi maana ya ulinganisho wa διαφέρετε katika muktadha wa utunzaji wa Mungu. Inafundisha kwamba wanafunzi wana thamani kubwa zaidi bila kukanusha kwamba Mungu huwajali wanyama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi na wa moja kwa moja unaendana na kauli ya Yesu; “ninyi” imetumiwa kwa mkazo wa kiwakilishi cha Kigiriki.
