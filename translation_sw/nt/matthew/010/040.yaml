  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: sw
  text: Anayewapokea ninyi ananipokea mimi[a], na anayenipokea mimi anampokea yule aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ananikaribisha”; kitenzi cha Kigiriki kinaweza kumaanisha kupokea, kukubali, au kukaribisha, hasa katika maana ya kumpokea mjumbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Anayewapokea
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo kimetafsiriwa kwa muundo wa jumla wa Kiswahili, “anayewapokea.” Kiambishi “-wa-” kinaonyesha wazi kwamba “ninyi” ni wingi.
- source_word: δέχομαι / δέχεται
  choice: -pokea
  rationale: 'Kitenzi “-pokea” kinaweza kumaanisha kumpokea, kumkaribisha, au kumkubali mtu. Kurudia kitenzi hicho kunahifadhi mnyororo wa makusudi uliopo katika Kigiriki: kuwapokea wanafunzi ni kumpokea Yesu, na kumpokea Yesu ni kumpokea aliyemtuma.'
- source_word: ὑμᾶς
  choice: ninyi
  rationale: Ni kiwakilishi cha nafsi ya pili wingi kinachowarejelea wanafunzi wa Yesu. Kutaja “ninyi” kunasisitiza walengwa na kuondoa uwezekano wa kukichukulia kama umoja.
- source_word: ἐμέ
  choice: mimi
  rationale: Ni kiwakilishi cha nafsi ya kwanza umoja kinachomrejelea Yesu. Kutaja “mimi” kunahifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: τὸν ἀποστείλαντά με
  choice: yule aliyenituma
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili, nao unahifadhi rejeo la mtu bila kuongeza wazi kwamba ni Baba, jambo ambalo halijasemwa moja kwa moja katika maneno ya Kigiriki.
theological_decisions:
- issue: Utambulisho wa aliyemtuma Yesu
  choice: yule aliyenituma
  alternative: Baba aliyenituma
  rationale: Muktadha na teolojia ya Mathayo zinaonyesha kwamba anayekusudiwa ni Baba, lakini maandishi ya Kigiriki yanasema tu “aliyenituma.” Tafsiri haiongezi utambulisho huo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Kurudiwa kwa “-pokea” na kwa viwakilishi “ninyi/mimi” kumedumishwa ili kuhifadhi msisitizo na mnyororo wa utambulisho wa sentensi ya Kigiriki.
