id: MAT.10.26
reference: Matthew 10:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: sw
  text: Kwa hiyo, msiwaogope, kwa maana hakuna kilichofunikwa ambacho hakitafunuliwa, wala kilichofichwa ambacho hakitajulikana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Kwa hiyo, msiwaogope
  rationale: “Kwa hiyo” inaonyesha uhusiano wa hitimisho wa οὖν na muktadha; “msiwaogope” huhifadhi katazo la wingi na kiwakilishi αὐτούς.
- source_word: κεκαλυμμένον
  choice: kilichofunikwa
  rationale: Huhifadhi taswira halisi ya kitu kufunikwa badala ya kukibadili tu kuwa ‘siri’ au ‘kilichofichwa.’
- source_word: ἀποκαλυφθήσεται
  choice: kitafunuliwa
  rationale: Kitenzi hiki kinawasilisha kufunuliwa au kuondolewa kwa kifuniko, sambamba na κεκαλυμμένον.
- source_word: κρυπτὸν
  choice: kilichofichwa
  rationale: Hutofautisha jambo lililofichwa na jambo lililofunikwa katika kishazi cha kwanza.
- source_word: γνωσθήσεται
  choice: kitajulikana
  rationale: Hutoa maana ya kawaida ya kauli tendwa ya ‘kujua/kufahamu’ bila kuongeza mhusika anayelifanya lijulikane.
theological_decisions:
- issue: Upeo wa kauli ‘hakuna ... ambacho hakita...’
  choice: Muundo wa jumla umehifadhiwa bila kueleza ni nani atakayefunua au kufanya lijulikane.
  alternative: Kutaja wazi kwamba Mungu ndiye atakayefunua kila kitu.
  rationale: Nakala ya Kigiriki haitaji mtendaji; kauli tendwa inaweza kuwa na maana ya kimungu katika muktadha, lakini tafsiri haipaswi kuondoa uwezekano mwingine kwa kuongeza jina lisilokuwapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Usambamba wa vifungu viwili umehifadhiwa kwa ‘kilichofunikwa/kitafunuliwa’ na ‘kilichofichwa/kitajulikana.’
