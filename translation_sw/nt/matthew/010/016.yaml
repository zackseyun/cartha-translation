id: MAT.10.16
reference: Matthew 10:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: sw
  text: Angalieni, ninawatuma kama kondoo katikati ya mbwa mwitu. Kwa hiyo, iweni wenye busara kama nyoka na wasio na hila kama njiwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Angalieni
  rationale: Wito wa kuvuta makini kwa wasikilizaji wengi; ni wa asili na wenye hadhi katika Kiswahili.
- source_word: ἀποστέλλω
  choice: ninawatuma
  rationale: Huwasilisha tendo la Yesu la kuwatuma wanafunzi kwa utume bila kuongeza maana isiyokuwapo.
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: kama kondoo katikati ya mbwa mwitu
  rationale: Huhifadhi taswira ya udhaifu na hatari iliyo katika Kigiriki.
- source_word: φρόνιμοι
  choice: wenye busara
  rationale: Hujumuisha hekima ya vitendo na tahadhari, si ujanja wa udanganyifu.
- source_word: οἱ ὄφεις
  choice: nyoka
  rationale: Neno la kawaida la Kiswahili linalolingana na taswira ya Kigiriki; matumizi ya jumla hayahitaji kiainishi.
- source_word: ἀκέραιοι
  choice: wasio na hila
  rationale: Katika muktadha huu linaonyesha kutokuwa na ubaya au udanganyifu; pia huunda utofautishaji wa wazi na busara ya nyoka.
- source_word: αἱ περιστεραί
  choice: njiwa
  rationale: Neno la kawaida na la moja kwa moja kwa taswira ya Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya busara ya nyoka na kutokuwa na hila kwa njiwa
  choice: wenye busara kama nyoka na wasio na hila kama njiwa
  alternative: werevu kama nyoka na wapole kama njiwa
  rationale: 'Huhifadhi mvutano wa maadili wa sentensi: wanafunzi wawe na busara ya vitendo lakini bila udanganyifu. ‘Wapole’ ingehamisha ἀκέραιοι kuelekea tabia ya upole, ambayo si maana yake kuu hapa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Muundo umehifadhi taswira na ulinganifu wa sentensi ya Kigiriki bila kuwa mgumu.
