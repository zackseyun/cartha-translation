lexical_decisions:
- source_word: πορεύεσθε
  choice: waende
  rationale: Ni amri kwa wingi; “waende” ni ya kawaida na inafaa katika agizo la kuwatuma wanafunzi.
- source_word: δὲ μᾶλλον
  choice: bali ... badala yake
  rationale: Muungano huu unaonyesha tofauti na kuelekeza wanafunzi kwenye mahali pengine tofauti na palipokatazwa katika mstari uliotangulia.
- source_word: πρὸς
  choice: kwa
  rationale: Pamoja na kitenzi cha mwendo, “kwa” huonyesha kuelekea walengwa kwa Kiswahili cha kawaida.
- source_word: τὰ πρόβατα
  choice: kondoo
  rationale: Inahifadhi sitiari iliyo wazi katika Kigiriki na mwangwi wake wa kibiblia.
- source_word: τὰ ἀπολωλότα
  choice: waliopotea
  rationale: Kishiriki hiki kinaeleza hali ya kondoo hao; “waliopotea” linafaa katika sitiari ya kichungaji bila kulifanya kuwa uharibifu wa kimwili.
- source_word: οἴκου Ἰσραήλ
  choice: wa nyumba ya Israeli
  rationale: Inahifadhi usemi wa kibiblia wenye maana ya kijumuiya na ya agano, bila kuufafanua kuwa “watu wa Israeli.”
theological_decisions:
- issue: Maelezo ya kisitiari kuhusu Israeli
  choice: kondoo waliopotea wa nyumba ya Israeli
  alternative: Waisraeli waliopotoka
  rationale: Kigiriki kinatumia sitiari ya kondoo moja kwa moja. Kuihifadhi kunadumisha mwangwi wa Maandiko na mvutano wa kiteolojia bila kuongeza ufafanuzi.
- issue: Uhusiano wa “waliopotea” na “nyumba ya Israeli”
  choice: Maandishi makuu yanafuata uelewa wa kawaida kwamba kondoo waliopotea ni wa nyumba ya Israeli
  alternative: kondoo waliopotea kutoka katika nyumba ya Israeli
  rationale: Muundo wa Kigiriki unaweza kusikika ama kama kondoo walio sehemu ya nyumba ya Israeli ama waliopotea kutoka humo; tanbihi huhifadhi uwezekano wa pili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya “kondoo” na usemi wa kibiblia “nyumba ya Israeli” vimehifadhiwa. Umbo la wingi la amri limetumika kwa kuwa Yesu anawaambia wanafunzi wengi.
