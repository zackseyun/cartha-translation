  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: sw
  text: Lakini jihadharini na watu, kwa maana watawakabidhi kwa mabaraza, na katika masinagogi yao watawapiga kwa mijeledi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: jihadharini
  rationale: Kitenzi cha kuamuru kwa wingi kinatoa onyo la kuwa macho dhidi ya hatari; “jihadharini” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofautishaji mdogo kutoka maagizo yaliyotangulia kwenda kwenye onyo.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: na watu
  rationale: Baada ya προσέχω, ἀπό huonyesha chanzo cha hatari. “Watu” lina maana ya jumla hapa, bila kudokeza kwamba wapinzani ni wanaume pekee.
- source_word: παραδώσουσιν
  choice: watawakabidhi
  rationale: Neno hili linaeleza kuwatia mikononi mwa wenye mamlaka; “kuwakabidhi” huhifadhi maana ya kisheria bila kuongeza wazo la usaliti wa mtu wa karibu.
- source_word: συνέδρια
  choice: mabaraza
  rationale: Wingi huu unarejelea mabaraza ya eneo yenye kazi ya utawala au hukumu, si lazima Sanhedrini ya Yerusalemu pekee.
- source_word: συναγωγαῖς
  choice: masinagogi
  rationale: Neno linarejelea mahali pa mikutano na ibada ya Wayahudi; “masinagogi” ni istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki kinahusisha masinagogi na wale watu waliotajwa.
- source_word: μαστιγώσουσιν
  choice: watawapiga mijeledi
  rationale: Kitenzi kinaeleza adhabu ya kupigwa kwa mjeledi. Usemi huu ni wa sasa, wazi, na unaonyesha uzito wa adhabu hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jinsia katika ἀνθρώπων
  choice: watu
  alternative: wanaume
  rationale: Ingawa umbo la Kigiriki ni wingi wa kiume kisarufi, maana yake hapa ni ya jumla kwa wanadamu wanaowapinga wanafunzi. “Watu” huwasilisha maana hiyo bila kuifanya iwe ya wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi mfululizo wa onyo, sababu, kukabidhiwa kwa mabaraza, na kupigwa katika masinagogi. Hakuna tanbihi iliyohitajika kwa kuwa “watu” tayari huwasilisha kwa kawaida maana ya jumla ya ἀνθρώπων katika Kiswahili.
