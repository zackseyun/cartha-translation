id: MAT.10.28
reference: Matthew 10:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: sw
  text: Msiwaogope wale wanaouua mwili lakini hawawezi kuua nafsi. Badala yake, mwogopeni zaidi yule anayeweza kuangamiza nafsi na mwili katika Gehena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika jehanamu.” Kigiriki: “katika Gehena,” jina linalotokana na Bonde la Hinomu na kutumiwa kurejelea mahali pa hukumu ya mwisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: msiwaogope / mwogopeni
  rationale: Kitenzi kimerudiwa katika ulinganisho wa kimkinzano. Mzizi uleule wa Kiswahili, ‘-ogopa,’ unadumisha nguvu na ulinganifu wa kauli zote mbili.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: wale wanaouua
  rationale: Kivumishi-neno chenye kibainishi kinarejelea kundi kwa ujumla; ‘wale wanaouua’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: σῶμα
  choice: mwili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwili wa kibinadamu.
- source_word: ψυχήν
  choice: nafsi
  rationale: Katika utofautishaji huu na ‘mwili,’ ‘nafsi’ huhifadhi kipengele cha mtu ambacho hakiwezi kuuawa na wanadamu, bila kukipunguza kuwa uhai wa duniani pekee.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: hawawezi kuua
  rationale: Kauli hii ni ya asili katika Kiswahili na inaeleza wazi kutokuwa na uwezo kunakosisitizwa na Kigiriki.
- source_word: μᾶλλον
  choice: badala yake ... zaidi
  rationale: ‘Badala yake’ huonyesha ugeuzi wa mwelekeo wa hofu, huku ‘zaidi’ ikihifadhi nguvu ya ulinganisho wa μᾶλλον.
- source_word: τὸν δυνάμενον
  choice: yule anayeweza
  rationale: Huhifadhi usemi wa Kigiriki bila kumtaja wazi anayerejelewa, na ni muundo wa kawaida wa Kiswahili.
- source_word: ἀπολέσαι
  choice: kuangamiza
  rationale: ‘Kuangamiza’ huwasilisha uzito wa uharibifu au hukumu ya mwisho bila kufafanua kupita kiasi namna yake ya kimetafizikia.
- source_word: ἐν γεέννῃ
  choice: katika Gehena
  rationale: Unukuzi ‘Gehena’ huhifadhi istilahi mahsusi ya Kigiriki na historia yake ya Kiyahudi; maana inayojulikana zaidi inaelezwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa ‘yule anayeweza kuangamiza nafsi na mwili katika Gehena’
  choice: Yule anayeweza
  alternative: Mungu; Shetani
  rationale: Muktadha unaelekea kumrejelea Mungu mwenye mamlaka ya hukumu ya mwisho, lakini usemi wa Kigiriki haumtambui kwa jina. Tafsiri haiongezi utambulisho usiotajwa wazi.
- issue: Tafsiri ya γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: ‘Gehena’ hudumisha istilahi ya chanzo na msingi wake katika Bonde la Hinomu. ‘Jehanamu’ ni kisawe cha kiufafanuzi kinachotolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; marudio ya mzizi ‘-ogopa’ na utofautishaji wa ‘mwili’ na ‘nafsi’ yamehifadhiwa.
