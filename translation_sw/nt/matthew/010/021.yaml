  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: sw
  text: Kaka atamkabidhi kaka yake ili auawe, na baba atamkabidhi mtoto wake ili auawe; watoto watawainukia wazazi wao na kuwaua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kaka atamsaliti kaka yake.” Kitenzi kinaweza pia kumaanisha “kumkabidhi”; katika muktadha wa hila kinaweza kuwa na maana ya “kusaliti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: atamkabidhi
  rationale: Kitenzi hiki kinaonyesha kumtia mtu mikononi mwa wenye mamlaka au maadui. “Atamkabidhi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulazimisha wazo la usaliti, ingawa muktadha wa kifamilia unaweza kulidokeza.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: Ndugu ... ndugu yake
  rationale: “Ndugu” ni tafsiri ya kawaida ya ἀδελφός katika Kiswahili. Kiwakilishi “yake” kinaweka wazi uhusiano wa kifamilia unaodokezwa na muundo wa Kigiriki.
- source_word: εἰς θάνατον
  choice: auawe
  rationale: Kirai hiki kinaonyesha lengo au matokeo ya kukabidhiwa, yaani kuuawa. “Auawe” ni usemi mfupi na wa asili unaoonyesha kwamba mtu anakabidhiwa ili auawe.
- source_word: πατὴρ τέκνον
  choice: baba ... mtoto wake
  rationale: τέκνον humaanisha mtoto bila kubainisha jinsia. “Mtoto wake” ni Kiswahili cha kawaida na huweka wazi uhusiano unaodokezwa katika Kigiriki.
- source_word: ἐπαναστήσονται
  choice: watawainukia
  rationale: Neno hili lina maana ya kuinuka dhidi ya mtu kwa upinzani wenye uhasama. “Watawainukia” huhifadhi picha hai ya Kigiriki na ni usemi unaoeleweka katika Kiswahili sanifu.
- source_word: τέκνα
  choice: watoto
  rationale: τέκνα ni neno jumuishi lisilobainisha jinsia; “watoto” lina upeo huohuo.
- source_word: ἐπὶ γονεῖς
  choice: wazazi wao
  rationale: Katika muktadha wa uhasama, ἐπί ina maana ya “dhidi ya.” Maana hiyo imebeba katika kitenzi “watawainukia,” na “wao” huonyesha kwa kawaida kwamba ni wazazi wa watoto hao.
- source_word: θανατώσουσιν αὐτούς
  choice: kuwaua
  rationale: θανατόω humaanisha kusababisha mtu afe, wakati mwingine katika mazingira ya hukumu au hatua ya makusudi. “Kuwaua” ni ya asili na wazi; kiambishi “wa-” kinawarejelea wazazi.
theological_decisions:
- issue: Istilahi za kifamilia na jinsia
  choice: Kutumia “ndugu” kwa ἀδελφός na “watoto/wazazi” kwa istilahi pana
  alternative: Kutumia “kaka” kwa ἀδελφός ili kubainisha jinsia ya kiume
  rationale: Katika Kiswahili, “ndugu” ndiyo tafsiri ya kawaida na yenye heshima ya ἀδελφός, lakini inaweza kuwa pana kuliko neno la Kigiriki katika muktadha huu. “Watoto” na “wazazi” huhifadhi kwa usahihi upeo jumuishi wa τέκνα na γονεῖς bila kuongeza jinsia ambayo chanzo hakibainishi.
- issue: Namna ya kifo kinachotajwa
  choice: Kutafsiri kwa “auawe” na “kuwaua” bila kutaja hukumu rasmi
  alternative: Kutumia “watiwe kifo” au “wauawe kwa hukumu”
  rationale: Chanzo kinaonyesha kukabidhiwa hadi kufa na kusababisha kifo, lakini hakibainishi wazi utaratibu wa kisheria. Tafsiri haipaswi kuongeza maelezo ya hukumu rasmi yasiyosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kwa uelewekaji wa kawaida huku ukihifadhi mfululizo mkali wa mahusiano ya kifamilia na matokeo ya kifo.
