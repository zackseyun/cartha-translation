base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: sw
  text: Kwa maana nilikuja kumweka mwanamume dhidi ya baba yake,[a] na binti dhidi ya mama yake, na binti-mkwe dhidi ya mama-mkwe wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kugawanya”; kitenzi cha Kigiriki kinaweza kumaanisha kugawanya au kusababisha mgawanyiko, lakini virai vinavyorudiwa vya “dhidi ya” vinaweka wazi upinzani wa kimahusiano hapa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki νύμφη linaweza kumaanisha “bibi arusi” katika baadhi ya miktadha; hapa linamaanisha “binti-mkwe” kwa sababu limewekwa sambamba na “mama-mkwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: nilikuja
  rationale: Kauli ya wakati uliopita ya ἔρχομαι hapa inaeleza kuja na utume wa Yesu; “nilikuja” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli hii inaeleza sababu ya kauli iliyotangulia.
- source_word: διχάσαι
  choice: kumweka ... dhidi ya
  rationale: Kitenzi hiki humaanisha kugawanya au kusababisha utengano; virai vinavyofuata vya κατά pamoja na jenitivi vinaonyesha wazi upinzani wa kimahusiano, hivyo muundo huu unadumisha ukali wa kauli.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος linaweza kumaanisha mwanadamu au mtu; hapa “mtu” ni ya asili katika Kiswahili, huku muktadha wa “baba yake” ukidumisha uhusiano unaotajwa bila kuongeza neno lisilo la lazima.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: dhidi ya baba yake
  rationale: κατά pamoja na jenitivi linaonyesha upinzani; “dhidi ya” linawasilisha maana hiyo wazi.
- source_word: θυγατέρα
  choice: binti
  rationale: Hili ni neno la kawaida, la heshima, na la moja kwa moja kwa θυγάτηρ katika uhusiano wa kifamilia.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: dhidi ya mama yake
  rationale: Linadumisha muundo unaorudiwa wa upinzani katika Kigiriki.
- source_word: νύμφην
  choice: mkwe
  rationale: νύμφη linaweza kumaanisha bibi arusi au binti-mkwe; kuunganishwa kwake na πενθερά kunahitaji maana ya binti-mkwe. Katika Kiswahili sanifu “mkwe” hutumika kwa uhusiano huu, ingawa linaweza kuwa pana zaidi.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: dhidi ya mama mkwe wake
  rationale: “Mama mkwe” ni istilahi ya kawaida ya Kiswahili kwa πενθερά na inadumisha upinzani wa kifamilia unaotajwa.
theological_decisions:
- issue: Asili ya kusudi la kuja kwa Yesu katika kauli hii
  choice: Kudumisha kauli kali kwamba kuja kwake kunamweka mwanafamilia dhidi ya mwingine, bila kueleza ndani ya mstari kwamba uhasama huo ni matokeo ya mwitikio wa watu kwake.
  alternative: Kutafsiri kwa ufafanuzi kuwa uaminifu kwa Yesu husababisha mateso au migawanyiko ya kifamilia.
  rationale: Kigiriki chenyewe kinaeleza kugawanywa au kuwekwa kwa wanafamilia dhidi ya wenzao. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia bila kuugeuza kuwa fundisho lililofafanuliwa zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wenye kurudia “dhidi ya” umehifadhiwa ili kuonyesha sambamba na ukali wa Kigiriki. “Mkwe” ni neno la kawaida lakini pana katika Kiswahili; tanbihi inaweka wazi kuwa hapa ni binti-mkwe.
