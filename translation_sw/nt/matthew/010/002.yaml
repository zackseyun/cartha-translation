  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: sw
  text: 'Haya ndiyo majina ya wale mitume kumi na wawili: wa kwanza[a] ni Simoni aitwaye Petro, na Andrea ndugu yake; Yakobo mwana wa Zebedayo, na Yohana ndugu yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au usemi “wa kwanza” unaweza kudokeza kuwa Simoni alikuwa mashuhuri kati ya wale kumi na wawili, wala si kwamba ametajwa wa kwanza tu katika orodha.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: (hakuna kiunganishi cha wazi)
  rationale: δέ ni kiunganishi hafifu cha mpito. Katika Kiswahili, mtiririko ni wa kawaida bila kuongeza neno la wakati kama “sasa,” ambalo halipo wazi katika chanzo.
- source_word: δώδεκα ἀποστόλων
  choice: wale mitume kumi na wawili
  rationale: “Mitume” ndilo neno la kawaida na linalotambulika katika Kiswahili kwa kundi hili lililotumwa na Yesu; “wale” linaonyesha kundi maalumu lililotajwa katika muktadha.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Haya ndiyo majina
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa kiashiria “haya.”
- source_word: πρῶτος
  choice: wa kwanza
  rationale: Neno hili kwa kawaida linaonyesha nafasi ya kwanza katika orodha, bila kulazimisha dai la mamlaka au ukuu.
- source_word: ὁ λεγόμενος
  choice: aitwaye
  rationale: “Aitwaye” ni tafsiri fupi, ya asili, na yenye hadhi ya kishirikishi kinachomtambulisha Simoni kwa jina Petro.
- source_word: Πέτρος
  choice: Petro
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: ndugu yake
  rationale: Katika muktadha huu ἀδελφός ni ndugu wa kiume wa familia; Kiswahili hutumia kwa kawaida “ndugu yake,” huku marejeo yakieleweka kutokana na mpangilio.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: mwana wa Zebedayo
  rationale: Muundo wa Kigiriki unamtambulisha Yakobo kwa nasaba yake; “mwana wa Zebedayo” huweka maana hiyo wazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya πρῶτος kuhusu Simoni/Petro
  choice: wa kwanza katika orodha, huku uwezekano wa maana ya umaarufu ukihifadhiwa katika tanbihi
  alternative: mkuu au mashuhuri zaidi kati ya wale kumi na wawili
  rationale: πρῶτος inaweza kutaja nafasi ya kwanza katika mfuatano na wakati mwingine umaarufu. Aya hii inaanza orodha, kwa hiyo matini kuu haitoi dai maalumu la kimadhehebu kuhusu ukuu wa mamlaka; tanbihi inahifadhi uwezekano mwingine wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa uwazi wa orodha; majina yametumia maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
