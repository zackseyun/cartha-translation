id: MAT.10.22
reference: Matthew 10:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: sw
  text: Nanyi mtachukiwa na watu wote kwa sababu ya jina langu.[a] Lakini atakayevumilia mpaka mwisho[b] ataokolewa.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya jina langu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atakayestahimili mpaka mwisho.”
    reason: lexical_alternative
  - marker: c
    text: “Ataokolewa” pia yaweza kueleweka kuwa “atanusuriwa” au “atakombolewa,” kutegemea jinsi muktadha unavyoeleweka.
    reason: alternative_reading
  - marker: d
    text: Au, “Yule atakayevumilia mpaka mwisho, huyo ataokolewa.”
    reason: previous_rendering
lexical_decisions:
- source_word: μισούμενοι
  choice: mtachukiwa
  rationale: Huwasilisha hali ya wakati ujao ya kuchukiwa kwa lugha ya kawaida na yenye hadhi, huku ikidumisha kauli ya kutendwa.
- source_word: ὑπὸ πάντων
  choice: na watu wote
  rationale: ὑπό pamoja na hali ya kutendwa hutaja watendaji; 'watu wote' huweka wazi kwamba πάντων inawahusu watu na huhifadhi wazo lake pana.
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa sababu ya jina langu
  rationale: διά pamoja na accusative huonyesha sababu. 'Jina langu' linadumisha lugha ya chanzo na linaweza kuwakilisha nafsi, mamlaka na utii kwa Yesu bila kulifafanua kupita kiasi.
- source_word: ὁ δὲ ὑπομείνας
  choice: Lakini atakayevumilia
  rationale: Kirai cha participle chenye article humaanisha mtu anayevumilia. 'Atakayevumilia' ni Kiswahili cha kawaida na kinafaa katika muktadha wa mateso.
- source_word: εἰς τέλος
  choice: mpaka mwisho
  rationale: Hueleza kuendelea kuvumilia hadi kufikia kikomo, bila kubainisha hapa mwisho huo ni upi.
- source_word: οὗτος
  choice: imewakilishwa kwa mkazo wa muundo wa sentensi bila neno tofauti
  rationale: οὗτος ni ya kurejelea na kusisitiza mtu aliyetajwa. Kiswahili cha kawaida hakihitaji 'huyo' katika sentensi kuu; dokezo [d] linahifadhi uwezekano wa muundo wenye mkazo wa wazi.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Kauli ya kutendwa hudumishwa, na neno hili linaacha wazi upana wa maana ya kuokolewa, kukombolewa au kunusuriwa kulingana na muktadha.
theological_decisions:
- issue: Maana ya wokovu wa mwisho kuhusiana na kuvumilia
  choice: ataokolewa
  alternative: atanusuriwa; atakombolewa; au ufafanuzi mahsusi wa wokovu wa mwisho
  rationale: Tafsiri inadumisha uhusiano ambao mstari unaweka kati ya kuvumilia mateso na kuokolewa, lakini haiamui kama mkazo ni kunusuriwa kimwili, wokovu wa kieskatolojia, au mfumo fulani wa mafundisho kuhusu kudumu katika imani.
- issue: Mkazo wa οὗτος
  choice: Kutotumia kiwakilishi tofauti katika matini kuu
  alternative: Yule atakayevumilia mpaka mwisho, huyo ataokolewa
  rationale: Muundo wenye 'huyo' unaonyesha mkazo wa Kigiriki lakini unaweza kuwa mzito zaidi. Matini kuu ni ya asili katika Kiswahili, huku dokezo likihifadhi muundo wa karibu zaidi na chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. 'Nanyi' huunganisha mstari na muktadha uliotangulia; 'watu wote' huepuka utata wa 'wote' peke yake. Alama zote za tanbihi [a]–[d] zimo katika matini kuu karibu na maneno yanayohusika.
