  text: And a man's enemies will be those of his own household[a].
translation:
  language: sw
  text: Na maadui wa mtu watakuwa watu wa nyumbani mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “washiriki wa kaya yake.” Kigiriki kinamaanisha watu wa nyumbani au wa kaya yake, si nyumba yenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza moja kwa moja kauli iliyotangulia bila kuongeza maana ya sababu au msisitizo.
- source_word: ἐχθροὶ
  choice: maadui
  rationale: Nomino hii inawataja walio na uadui; “maadui” ni tafsiri ya kawaida, wazi, na yenye nguvu inayolingana na Kigiriki.
- source_word: τοῦ ἀνθρώπου
  choice: wa mtu
  rationale: Muundo wa umilikaji unaonyesha kwamba ni maadui wa mtu huyo. “Mtu” katika Kiswahili ni ya kawaida na inaweza kutumiwa kiwakilishi kwa mwanadamu yeyote bila kupoteza umoja wa Kigiriki.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: watu wa nyumbani mwake
  rationale: οἰκιακοί humaanisha watu wanaohusika na nyumba au kaya ya mtu, si jengo lenyewe. Usemi huu ni wa asili katika Kiswahili na unadumisha uhusiano wa karibu unaosisitizwa na αὐτοῦ.
theological_decisions:
- issue: Matumizi wakilishi ya ἀνθρώπου katika umoja
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa nomino ya Kigiriki iko katika umoja na ina umbo la kisarufi la kiume, hapa imetumiwa kiwakilishi katika methali kumaanisha mwanadamu. Kiswahili “mtu” huhifadhi umoja na maana hiyo ya kiwakilishi bila kuifanya kauli ihusu wanaume pekee.
- issue: Upeo wa οἰκιακοί
  choice: watu wa nyumbani mwake
  alternative: jamaa zake
  rationale: Neno la Kigiriki linaweza kujumuisha washiriki wa kaya, si lazima ndugu wa damu pekee. Kwa hiyo “watu wa nyumbani mwake” huhifadhi upana huo na mvutano wa kuwa maadui kutoka katika kaya yake mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na rahisi kueleweka. “Watu wa nyumbani mwake” ni ya asili kuliko tafsiri ya neno kwa neno, huku ikihifadhi maana pana ya kaya.
