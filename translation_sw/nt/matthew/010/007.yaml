lexical_decisions:
- source_word: πορευόμενοι
  choice: mnapoenda
  rationale: 'Kirai cha wakati kinaonyesha tendo linaloandamana na amri kuu: wanapoendelea na safari yao.'
- source_word: δὲ
  choice: Nanyi
  rationale: Kiunganishi hafifu kinaendeleza maagizo yaliyotangulia; hapa ‘Nanyi’ huunganisha kwa kawaida na wanafunzi wanaoagizwa.
- source_word: κηρύσσετε
  choice: tangazeni
  rationale: Kitenzi cha amri humaanisha kutoa habari hadharani kama mjumbe; ‘tangazeni’ ni cha kawaida na hakina maana finyu ya mahubiri ya kanisani.
- source_word: λέγοντες
  choice: mkisema
  rationale: Kivumishi-tendo kinafafanua maneno yaliyomo katika tangazo na kinahifadhi muundo wa Kigiriki bila kuwa kizito katika Kiswahili.
- source_word: ὅτι
  choice: “
  rationale: Hutambulisha yaliyomo katika tangazo; nukuu ya moja kwa moja ni njia ya kawaida ya kuwasilisha maana hiyo katika Kiswahili.
- source_word: Ἤγγικεν
  choice: umekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha ukaribu ambao umefikiwa na bado una athari; ‘umekaribia’ huhifadhi hali hiyo kuliko ‘uko karibu’ pekee.
- source_word: ἡ βασιλεία
  choice: Ufalme
  rationale: ‘Ufalme’ ni istilahi ya kawaida inayoweza kujumuisha utawala wa mfalme na eneo lake bila kupunguza upana wa maana.
- source_word: τῶν οὐρανῶν
  choice: wa mbinguni
  rationale: Huhifadhi usemi bainifu wa Mathayo kwa Kiswahili cha kawaida badala ya kuulinganisha kimakusudi na ‘ufalme wa Mungu.’
theological_decisions:
- issue: Maana ya ‘ufalme wa mbinguni’
  choice: Ufalme wa mbinguni
  alternative: utawala wa Mungu
  rationale: Usemi bainifu wa Mathayo umehifadhiwa; ‘ufalme’ huacha wazi pande za utawala na milki bila kuingiza ufafanuzi wa dhehebu.
- issue: Hali ya Ἤγγικεν
  choice: umekaribia
  alternative: uko karibu
  rationale: Utoaji huu unahifadhi maana ya tendo lililofikia hali ya ukaribu yenye matokeo yanayoendelea, bila kuamua zaidi ya kile kitenzi kinachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tangazeni mkisema’ huhifadhi vipengele vyote viwili vya Kigiriki, ingawa Kiswahili cha kifupi kingeweza kusema ‘tangazeni:’. Muundo wa nukuu umewekwa wazi na wa kawaida.
