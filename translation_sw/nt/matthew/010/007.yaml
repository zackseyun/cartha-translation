  text: 'Mkienda, tangazeni, mkisema: “Ufalme wa mbinguni umekaribia.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umekuja karibu” au “uko karibu.” Kitenzi cha Kigiriki katika wakati timilifu kinakazia hali ya kuwa karibu iliyokwisha kufikiwa na inayoendelea kuwa na athari.
