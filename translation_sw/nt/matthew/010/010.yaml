id: MAT.10.10
reference: Matthew 10:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: sw
  text: Msichukue mfuko wa safari, wala kanzu mbili, wala viatu, wala fimbo[a]; kwa maana mfanyakazi anastahili chakula chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wasomaji huelewa “wala fimbo” kuwa katazo la kuchukua fimbo ya ziada, hasa kwa kuzingatia Marko 6:8, ambayo inaruhusu kuchukua fimbo.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: mfuko wa safari
  rationale: Neno πήρα humaanisha mfuko wa kubebea mahitaji safarini; “mfuko wa safari” ni wazi na wa kawaida katika Kiswahili.
- source_word: εἰς ὁδὸν
  choice: kwa ajili ya njiani
  rationale: Kirai hiki kinaonyesha kitu kinachochukuliwa kwa matumizi ya safari; tafsiri hii huhifadhi maana hiyo kwa lugha ya kawaida.
- source_word: δύο χιτῶνας
  choice: kanzu mbili
  rationale: χιτών ni vazi la msingi lililovaliwa mwilini. “Kanzu” inaeleweka katika mazingira ya Afrika Mashariki na ni mahususi zaidi kuliko “mavazi,” bila kulifanya kuwa shati la kisasa.
- source_word: ὑποδήματα
  choice: viatu
  rationale: ὑπόδημα ni kitu kinachofungwa chini ya mguu. “Viatu” ni neno la kawaida na pana linalofaa; “sandali” lingekuwa bainifu zaidi kuliko neno lenyewe linavyolazimisha.
- source_word: ῥάβδον
  choice: fimbo
  rationale: Katika muktadha huu ῥάβδος ni fimbo ya kutembelea. “Fimbo” ni tafsiri fupi na ya kawaida, huku tofauti na Marko 6:8 ikihifadhiwa badala ya kusawazishwa.
- source_word: ἄξιος
  choice: anastahili
  rationale: ἄξιος huonyesha kustahili au kuwa na haki inayofaa; “anastahili” ni Kiswahili cha asili na huhifadhi tathmini hiyo.
- source_word: ὁ ἐργάτης
  choice: mfanyakazi
  rationale: ἐργάτης ni mtu anayefanya kazi. “Mfanyakazi” ni wazi, ya sasa, na haiingizi cheo maalumu cha kidini.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: chakula chake
  rationale: τροφή humaanisha moja kwa moja chakula au lishe. “Chakula chake” huhifadhi maana halisi kuliko tafsiri pana kama “matunzo yake.”
theological_decisions:
- issue: Uwezekano wa kusawazisha maagizo ya vifaa vya safari na Marko 6:8
  choice: Kuhifadhi katazo la Mathayo, “wala fimbo,” katika matini kuu.
  alternative: Kulielewa kama katazo la fimbo ya ziada, au kulitafsiri kwa upana ili lipatane na Marko 6:8.
  rationale: Matini ya Kigiriki ya Mathayo inaitaja ῥάβδον moja kwa moja miongoni mwa vitu vilivyokatazwa. Tofauti inayoweza kuonekana na Marko imehifadhiwa na kutajwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha na sababu inayofuata umehifadhiwa; istilahi zimechaguliwa ili ziwe wazi kwa msomaji wa kawaida bila kuondoa mazingira ya karne ya kwanza.
