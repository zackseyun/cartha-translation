  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: sw
  text: Lakini wakati wowote watakapowatesa katika mji huu, kimbilieni mji mwingine.[a] Kwa maana kweli ninawaambia, kwa hakika hamtamaliza kupitia miji ya Israeli[b] mpaka Mwana wa Adamu atakapokuja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kimbilieni mji unaofuata.” Kigiriki husema kihalisi “mwingine/yule mwingine,” huku neno “mji” likieleweka kutokana na kishazi kilichotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “hamtamaliza miji ya Israeli.” Neno “kupitia” huweka wazi safari ya kuzunguka miji kwa ajili ya utume, ambayo inadokezwa na muktadha.
    reason: lexical_alternative
  - marker: c
    text: Maneno “mpaka Mwana wa Adamu atakapokuja” yameachwa wazi kwa makusudi. Wafafanuzi hutofautiana kuhusu kama yanarejelea kuthibitishwa kwa Yesu, kuja katika hukumu, au kurudi kwake kwa mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: wakati wowote watakapo-
  rationale: Muundo huu unaonyesha wakati usiojulikana mapema na hali inayoweza kutokea mara kwa mara, hivyo unahifadhi maana ya ὅταν kuliko kutumia tu “wakati”.
- source_word: διώκωσιν
  choice: watakapowatesa
  rationale: Katika muktadha wa kutumwa kwa wanafunzi, kitenzi hiki kinamaanisha mateso ya uadui, si kufuatwa tu.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: katika mji huu
  rationale: “Huu” huhifadhi nguvu ya kiashiria cha karibu ταύτῃ na uwazi wa agizo.
- source_word: φεύγετε
  choice: kimbilieni
  rationale: Kitenzi cha agizo kinaonyesha kuondoka kwa haraka ili kuepuka mateso; “kimbilieni” ni cha kawaida, wazi, na chenye nguvu katika Kiswahili.
- source_word: εἰς τὴν ἑτέραν
  choice: mji mwingine
  rationale: Neno “mji” linaeleweka kutokana na kishazi kilichotangulia. “Mji mwingine” ni tafsiri ya asili ya ἑτέραν bila kulazimisha kwamba lazima uwe mji wa karibu zaidi.
- source_word: ἀμὴν
  choice: kweli
  rationale: Hapa ἀμήν ni fomula ya kusisitiza ukweli na mamlaka ya kauli; “kweli ninawaambia” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: οὐ μὴ τελέσητε
  choice: kwa hakika hamtamaliza kuipitia
  rationale: “Kwa hakika hamta-” huwasilisha ukanushi wenye mkazo wa οὐ μή. “Kuipitia” huweka wazi shughuli inayodokezwa na muktadha, huku “kumaliza” ikihifadhi maana ya τελέω.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: miji ya Israeli
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa usemi wa Kigiriki unaotaja miji iliyo katika Israeli au miongoni mwa watu wa Israeli.
- source_word: ἕως ἂν ἔλθῃ
  choice: mpaka ... atakapokuja
  rationale: Muundo huu wa Kiswahili unahifadhi kikomo cha wakati cha baadaye bila kufafanua aina ya kuja inayokusudiwa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika tafsiri za Biblia za Kiswahili na linahifadhi usemi halisi pamoja na mwangwi wake wa kitheolojia.
theological_decisions:
- issue: Maana ya kuja kwa Mwana wa Adamu katika muktadha huu
  choice: Kuhifadhi maneno “mpaka Mwana wa Adamu atakapokuja” bila kubainisha tukio linalorejelewa
  alternative: Kuyafasiri kuwa kufufuka na kuthibitishwa kwa Yesu, kuja kwake katika hukumu juu ya Yerusalemu, au kurudi kwake kwa mwisho
  rationale: Kigiriki hakibainishi wazi ni tukio gani linalokusudiwa. Tafsiri kuu inaacha mvutano huo wa kitheolojia wazi badala ya kuingiza mtazamo fulani wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “wakati wowote” kuonyesha hali inayoweza kujirudia, “kimbilieni” kwa agizo la haraka, na “kwa hakika” kuhifadhi mkazo wa ukanushi wa Kigiriki. Maneno ya ziada “kuipitia” yamewekewa tanbihi kwa sababu shughuli hiyo inadokezwa badala ya kutajwa moja kwa moja katika Kigiriki.
