lexical_decisions:
- source_word: Φίλιππος
  choice: Filipo
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia, lenye kutambulika kwa urahisi.
- source_word: Βαρθολομαῖος
  choice: Bartholomayo
  rationale: Uhawilishaji wa kawaida wa jina hili kwa Kiswahili.
- source_word: Θωμᾶς
  choice: Tomaso
  rationale: Umbo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: Μαθθαῖος
  choice: Mathayo
  rationale: Umbo la kawaida na linalotambulika la jina hili kwa Kiswahili.
- source_word: ὁ τελώνης
  choice: mtoza ushuru
  rationale: Hueleza kwa lugha ya sasa mtu aliyekusanya kodi au ushuru; ni wazi na ya kawaida kuliko istilahi za kizamani.
- source_word: Ἰάκωβος
  choice: Yakobo
  rationale: Ni uhawilishaji wa kawaida wa Ἰάκωβος katika Kiswahili na huhifadhi uhusiano wake wa kihistoria na jina la Kiebrania.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: mwana wa Alfayo
  rationale: Muundo wa jenitivi unaonyesha nasaba; kuifanya wazi kuwa 'mwana wa' ni Kiswahili cha asili na kinachoeleweka.
- source_word: Ἁλφαίου
  choice: Alfayo
  rationale: Uhawilishaji wa kawaida wa jina Ἁλφαῖος kwa Kiswahili.
- source_word: Θαδδαῖος
  choice: Thadayo
  rationale: Hufuata moja kwa moja usomaji Θαδδαῖος wa SBLGNT kwa umbo la Kiswahili.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida cha Kiswahili kinachohifadhi mpangilio sahili wa orodha ya Kigiriki.
theological_decisions:
- issue: Utambulisho wa mtume wa mwisho katika sehemu hii ya orodha
  choice: Thadayo
  alternative: Lebayo; au Yuda mwana wa Yakobo katika orodha sambamba za Luka
  rationale: Matini ya msingi iliyotolewa inasoma Θαδδαῖος, hivyo jina Thadayo linawekwa katika matini kuu. Tofauti za hati na orodha sambamba hazipatanishwi kimya kimya, bali zinaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa jozi za majina na viunganishi vya Kigiriki umehifadhiwa kadiri unavyosikika kwa kawaida katika Kiswahili.
