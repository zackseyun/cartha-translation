  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: sw
  text: 'Yesu aliwatuma hawa kumi na wawili, akiwaagiza hivi: “Msiende katika njia ya watu wa mataifa[a], wala msiingie katika mji wa Wasamaria[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea eneo la watu wa mataifa.” Kigiriki kinatumia lugha ya njia kwa ukaribu zaidi; huenda usemi huo unamaanisha kuelekea eneo la watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mji wa Kisamaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: hawa kumi na wawili
  rationale: Inadumisha kiashiria na idadi ya Kigiriki bila kuongeza neno ‘wanafunzi,’ ambalo linaeleweka kutokana na muktadha lakini halipo katika kishazi hiki.
- source_word: ἀπέστειλεν
  choice: aliwatuma
  rationale: Kitenzi hiki kina maana ya kuwatuma kwa kusudi fulani; ‘aliwatuma’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: akiwaagiza hivi
  rationale: ‘Akiwaagiza’ inadumisha nguvu ya maelekezo ya παραγγείλας, na ‘hivi’ linaingiza maneno ya moja kwa moja kwa Kiswahili cha asili bila kurudia ‘akisema.’
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: kwenye njia inayoelekea kwa watu wa mataifa
  rationale: Inahifadhi taswira ya njia huku ikieleza maana inayowezekana ya kuelekea eneo la watu wasio Wayahudi. Tanbihi inadumisha tafsiri ya karibu zaidi na muundo wa Kigiriki.
- source_word: ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno linarejelea watu wasio Wayahudi. ‘Watu wa mataifa’ ni usemi unaoeleweka na unaofaa kwa lugha ya Biblia bila kutumia neno lenye dharau.
- source_word: μὴ ἀπέλθητε
  choice: msiende
  rationale: Ni katazo la moja kwa moja na la kawaida linalowakilisha vizuri muundo wa μή pamoja na aorist subjunctive.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: katika mji wa Wasamaria
  rationale: ‘Mji’ linaweza kutaja city au town kulingana na ukubwa, na ‘wa Wasamaria’ inadumisha muundo wa umilikishi wa Kigiriki.
- source_word: μὴ εἰσέλθητε
  choice: wala msiingie
  rationale: ‘Msiingie’ ni tafsiri ya moja kwa moja ya katazo, na ‘wala’ huunganisha makatazo mawili kwa Kiswahili cha asili.
theological_decisions:
- issue: Upeo na muda wa katazo kuhusu watu wa mataifa na Wasamaria
  choice: Agizo limetafsiriwa kama katazo thabiti katika utume huu maalumu, bila kuongeza kwamba ni katazo la kudumu.
  alternative: Kutumia maneno yanayoweza kudokeza kwamba watu wa mataifa na Wasamaria wametengwa daima.
  rationale: Mstari wenyewe unatoa maelekezo kwa kutumwa huku kwa wale kumi na wawili. Tafsiri inadumisha nguvu yake bila kutatua kimya kimya mvutano wake na sehemu nyingine za simulizi la Mathayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo mzito wa virai viwili vya Kigiriki umefanywa wa asili kwa ‘akiwaagiza hivi,’ huku makatazo na taswira ya njia vikidumishwa.
