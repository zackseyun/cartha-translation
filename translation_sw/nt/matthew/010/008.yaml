id: MAT.10.8
reference: Matthew 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: sw
  text: Waponyeni wagonjwa, wafufueni wafu, watakaseni wenye ukoma[a], wafukuzeni pepo. Mmepokea bure; toeni bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye ugonjwa wa ngozi.” Neno la kibiblia linalotafsiriwa kwa kawaida kuwa “ukoma” linaweza kurejelea kwa upana zaidi magonjwa makali ya ngozi, si ugonjwa wa Hansen unaoitwa ukoma leo pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: wagonjwa
  rationale: Katika muktadha huu neno hili linamaanisha watu walio wagonjwa; ‘wagonjwa’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: θεραπεύετε
  choice: Waponyeni
  rationale: Kitenzi hiki hapa kinaamuru kuponya katika huduma ya miujiza; ‘waponyeni’ ni cha asili kuliko usemi wa kitabibu zaidi.
- source_word: νεκροὺς
  choice: wafu
  rationale: Neno hili linarejelea watu waliokufa na ni yambwa ya amri inayofuata.
- source_word: ἐγείρετε
  choice: wafufueni
  rationale: Katika muktadha wa wafu, maana ni kuwarudisha kwenye uhai; ‘wafufueni’ huwasilisha hilo wazi kwa Kiswahili.
- source_word: λεπροὺς
  choice: wenye ukoma
  rationale: Hili ni chaguo la kawaida na lenye heshima, lakini tanbihi inaeleza kuwa istilahi ya kibiblia inaweza kujumuisha magonjwa makali ya ngozi kwa upana zaidi.
- source_word: καθαρίζετε
  choice: watakaseni
  rationale: ‘Watakaseni’ huhifadhi maana za kuondoa unajisi na kurejesha hali ya usafi, badala ya kupunguza jambo hilo kuwa uponyaji wa kimwili pekee.
- source_word: δαιμόνια
  choice: pepo
  rationale: ‘Pepo’ ni istilahi ya kawaida ya Kiswahili kwa viumbe hawa wa kiroho katika muktadha wa Agano Jipya.
- source_word: ἐκβάλλετε
  choice: wafukuzeni
  rationale: Katika muktadha wa kutoa pepo, ‘wafukuzeni’ huonyesha kwa kawaida tendo la kuwatoa kwa nguvu.
- source_word: δωρεὰν
  choice: bure
  rationale: ‘Bure’ hapa humaanisha bila malipo na huhifadhi urudiaji na uwiano wa kishairi wa vifungu viwili.
- source_word: ἐλάβετε
  choice: mmepokea
  rationale: Kauli hii inarejelea kile wanafunzi walichokwisha kupokea; wakati timilifu wa Kiswahili ni wa asili na unaunganisha tendo hilo na wajibu wao wa sasa.
- source_word: δότε
  choice: toeni
  rationale: Amri ‘toeni’ ni ya moja kwa moja; kielezi ‘bure’ kinabainisha namna ya kutoa.
theological_decisions:
- issue: Upeo wa amri za miujiza
  choice: Amri zimetafsiriwa moja kwa moja kama maagizo kwa wale Kumi na Wawili katika hotuba hii ya utume.
  alternative: Kufasiri baadhi ya matendo kama mafumbo au kama desturi za baadaye za kanisa pekee.
  rationale: Kiyunani kina amri za moja kwa moja za wingi katika orodha ya matendo halisi ya huduma. Tafsiri haiwekei mipaka wala kupanua matumizi yake zaidi ya yale ambayo kifungu chenyewe kinasema.
- issue: Maana ya καθαρίζετε kwa wenye ukoma
  choice: watakaseni
  alternative: waponyeni
  rationale: ‘Watakaseni’ huhifadhi kwa pamoja hali ya kimwili na maana ya usafi wa kidini iliyomo katika kitenzi, bila kuamua kuwa ni uponyaji wa kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mfuatano wa amri na uwiano wa ‘mmepokea bure; toeni bure’ umehifadhiwa.
