id: MAT.10.29
reference: Matthew 10:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: sw
  text: Je, shomoro wawili hawauzwi kwa asario?[b] Na hata mmoja wao hataanguka chini pasipo Baba yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila Baba yenu.” Maneno haya yanaweza kumaanisha kwamba jambo hilo halitokei bila Baba yenu kujua, kujali, au kutaka, lakini Kigiriki hakisemi ni maana ipi hasa inayokusudiwa.
    reason: alternative_reading
  - marker: b
    text: Asario ilikuwa sarafu ndogo ya shaba ya Kirumi yenye thamani ndogo sana.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: shomoro
  rationale: Katika muktadha huu neno hilo kwa kawaida humaanisha shomoro; tafsiri hii ni mahususi na ya kawaida kuliko ‘ndege wadogo’.
- source_word: ἀσσαρίου
  choice: asario moja
  rationale: Asario ilikuwa sarafu mahususi ya Kirumi. Kulihifadhi jina lake kunatunza mazingira ya kihistoria, huku tanbihi ikieleza thamani yake ndogo.
- source_word: πωλεῖται
  choice: hawauzwi
  rationale: Kauli ya kutendwa ya wakati uliopo imetafsiriwa kwa Kiswahili cha kawaida, ndani ya swali linalotarajia jibu la kukubali.
- source_word: ἓν ἐξ αὐτῶν
  choice: hata mmoja wao
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya usemi unaomaanisha mmoja kutoka miongoni mwao; ‘hata’ pia huonyesha mkazo wa muktadha.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: atakayeanguka chini
  rationale: Usemi huu unaonyesha kuanguka mpaka chini na unasikika kwa kawaida katika Kiswahili.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: pasipo Baba yenu
  rationale: ‘Pasipo’ hudumisha upana wa ἄνευ bila kuongeza kwamba jambo hilo ni pasipo kujua, kutaka, au kuruhusu kwa Baba.
- source_word: οὐχὶ ... ;
  choice: Je, ... hawauzwi ...?
  rationale: Muundo wa ‘Je’ pamoja na ukanushi unahifadhi swali la balagha linalotarajia jibu la ndiyo.
- source_word: καὶ
  choice: Lakini
  rationale: 'Katika muktadha huu kiunganishi kinaonyesha tofauti: licha ya thamani yao ndogo, hakuna hata mmoja anayemwangukia Baba bila uhusiano naye.'
theological_decisions:
- issue: Maana ya ‘pasipo Baba yenu’ kuhusiana na majaliwa ya Mungu
  choice: Maneno yenye upana ‘pasipo Baba yenu’ yamedumishwa bila kufafanua namna hususa ya uhusiano wa Baba na tukio hilo.
  alternative: ‘Baba yenu asijue’ au ‘bila mapenzi ya Baba yenu’
  rationale: Kigiriki hakitaji wazi kama kinachokusudiwa ni ujuzi, utunzaji, ruhusa, au mapenzi ya Baba. Tafsiri haipaswi kuamua jambo ambalo matini yenyewe imelidumisha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Shomoro’ na ‘asario’ huhifadhi umahususi wa kihistoria, na tanbihi zinafafanua bila kulemea matini kuu.
