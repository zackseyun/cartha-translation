  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: sw
  text: Msijipatie dhahabu, wala fedha, wala shaba[a] ili kuziweka katika mikanda yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shaba ya bati.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, pesa zilizowekwa ndani ya mikanda au katika vifuko vya pesa vilivyovaliwa kiunoni.
