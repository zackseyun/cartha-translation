lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Msijipatie
  rationale: Kitenzi κτάομαι humaanisha kujipatia au kupata. “Msijipatie” huhifadhi wazo la kutafuta au kujipatia kwa ajili yenu, badala ya kudokeza tu kutobeba.
- source_word: χρυσὸν
  choice: dhahabu
  rationale: Ni tafsiri ya moja kwa moja ya nyenzo hii; katika muktadha huu inarejelea fedha ya thamani iliyotengenezwa kwa dhahabu.
- source_word: ἄργυρον
  choice: fedha
  rationale: Neno “fedha” kwa kawaida humaanisha silver na pia pesa katika Kiswahili; hapa orodha ya metali inaonyesha hasa fedha kama metali iliyotumiwa kwa sarafu.
- source_word: χαλκὸν
  choice: shaba
  rationale: χαλκός inaweza kumaanisha copper au bronze. “Shaba” ni neno la kawaida na linaloeleweka katika Kiswahili kwa metali ya sarafu zenye thamani ndogo, huku uwezekano wa bronze ukihifadhiwa katika tanbihi.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: za kuweka katika mikanda yenu
  rationale: εἰς pamoja na ζώνας inaonyesha pesa iliyowekwa mikandani. Kauli hii ni ya asili katika Kiswahili na huepuka dhana potovu ya kwamba metali hizo zilikuwa kwa ajili ya kutengeneza mikanda.
