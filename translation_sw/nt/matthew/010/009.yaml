translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Msijipatie” hudumisha maana ya katazo la kujipatia mahitaji ya safari; “za kuweka katika mikanda yenu” hufafanua uhusiano wa metali hizo na mikanda bila kuingiza ufafanuzi wote wa kitamaduni katika matini kuu.
