  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: sw
  text: Nanyi mtapelekwa mbele ya watawala na wafalme kwa sababu yangu, ili uwe ushuhuda kwao[b] na kwa Mataifa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “kwao” pia inaweza kueleweka kuwa “dhidi yao,” ingawa dative ya Kigiriki haisemi hivyo waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: mbele ya watawala na wafalme
  rationale: Baada ya kitenzi cha kupelekwa, ἐπί pamoja na hali ya accusative inaonyesha kufikishwa mbele ya wenye mamlaka. “Watawala” ni neno la kawaida na pana linalofaa kwa ἡγεμόνας, huku “wafalme” likitafsiri βασιλεῖς moja kwa moja.
- source_word: ἀχθήσεσθε
  choice: mtapelekwa
  rationale: Ni future passive ya ἄγω. “Mtapelekwa” ni Kiswahili cha kawaida kinachofaa katika mazingira ya kusimamishwa mbele ya mamlaka bila kuongeza wazo la kukokotwa kwa nguvu ambalo halijaelezwa wazi.
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa sababu yangu
  rationale: Kirai hiki kinaonyesha sababu. Tafsiri hii ni ya sasa, wazi, na inadumisha rejeo la moja kwa moja kwa Yesu.
- source_word: εἰς μαρτύριον
  choice: ili iwe ushuhuda
  rationale: εἰς hapa inaweza kueleza kusudi au matokeo. “Ili iwe ushuhuda” ni ya asili katika Kiswahili na inadumisha nomino μαρτύριον bila kulazimisha kama ushuhuda huo ni wa mwaliko au wa hukumu.
- source_word: αὐτοῖς
  choice: kwao
  rationale: Kiwakilishi hiki cha dative kwa kawaida kinawarejelea watawala na wafalme. “Kwao” kinadumisha kutokubainishwa kwa Kigiriki ikiwa ushuhuda huo ni kwa ajili yao au dhidi yao.
- source_word: τοῖς ἔθνεσιν
  choice: kwa watu wa mataifa
  rationale: Katika Mathayo, ἔθνη mara nyingi humaanisha watu wasio Wayahudi. “Watu wa mataifa” ni wazi kwa wasomaji wa kawaida, huepuka neno lisiloeleweka kwa urahisi “Mataifa” likisimama peke yake, na bado hudumisha uwezekano wa maana ya “mataifa.”
theological_decisions:
- issue: Maana ya μαρτύριον αὐτοῖς
  choice: ushuhuda kwao
  alternative: ushuhuda dhidi yao
  rationale: 'Dative αὐτοῖς yenyewe haionyeshi wazi upinzani au hukumu. Tafsiri isiyoegemea upande mmoja inadumisha mvutano wa kitheolojia: ushuhuda unaweza kuwa ujumbe unaowafikia au kuwa ushahidi dhidi yao kulingana na mwitikio wao.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nanyi” linaunganisha sentensi na muktadha uliotangulia; “mbele ya” linaweka wazi mazingira ya mamlaka au mahakama. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
