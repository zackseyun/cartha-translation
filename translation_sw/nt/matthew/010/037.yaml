  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: sw
  text: Yeyote anayempenda baba au mama kuliko mimi hanistahili; na yeyote anayempenda mwana au binti kuliko mimi hanistahili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: yeyote anayempenda
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo humaanisha mtu anayejulikana kwa tendo hilo. “Yeyote anayempenda” ni Kiswahili cha kawaida na huhifadhi maana ya jumla.
- source_word: πατέρα ἢ μητέρα
  choice: baba au mama
  rationale: Nomino hizi za uhusiano zimetafsiriwa moja kwa moja bila kuongeza “yake,” ambalo halipo wazi katika Kigiriki.
- source_word: ὑπὲρ ἐμέ
  choice: kuliko mimi
  rationale: Katika muktadha huu wa ulinganisho, ὑπέρ huonyesha kumpenda mtu kwa kiwango kinachozidi upendo kwa Yesu au kumpa nafasi ya kwanza kuliko Yesu. “Kuliko mimi” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: hanistahili
  rationale: Kitenzi “-stahili” kinaweza kuchukua yambwa moja kwa moja katika Kiswahili. “Hanistahili” huhifadhi kauli kali ya Kigiriki bila kuongeza maelezo kama kuwa mfuasi au kuwa mali ya Yesu.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi huhifadhi muundo sambamba wa vifungu viwili.
- source_word: υἱὸν ἢ θυγατέρα
  choice: mwana au binti
  rationale: “Mwana” hapa humaanisha mtoto wa kiume, kwa ulinganifu na “binti.” Nomino zimetolewa bila kuongeza kiwakilishi cha umilikaji kisichotajwa wazi katika Kigiriki.
theological_decisions:
- issue: Dai la Yesu kuhusu upendo na uaminifu kwa familia
  choice: Yesu apewe nafasi ya juu kuliko hata mahusiano ya karibu zaidi ya kifamilia.
  alternative: Kulainisha kauli kuwa mtu anapaswa kumpenda Yesu kwa kiwango sawa, au kuipanua kana kwamba Yesu anakataza upendo kwa familia.
  rationale: ὑπὲρ ἐμέ huweka ulinganisho wa wazi, huku οὐκ ἔστιν μου ἄξιος ikihifadhi hukumu kali. Tafsiri haidharau upendo wa kifamilia wala kuingiza wazo la kuwachukia jamaa; inahifadhi dai la Yesu la kuwa na nafasi ya kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “yeyote anayempenda” na “hanistahili” umehifadhiwa ili kuonyesha usambamba na mkazo wa maandishi ya Kigiriki.
