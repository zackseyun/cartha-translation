  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: sw
  text: Naye akawaita wanafunzi wake kumi na wawili waje kwake, akawapa mamlaka juu ya roho wachafu, ili wawafukuze na kuponya kila ugonjwa na kila maradhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila ugonjwa na kila udhaifu.” Neno la pili la Kigiriki linaweza kumaanisha maradhi, udhaifu, au hali ya mwili kudhoofika.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: akawaita ... waje kwake
  rationale: Kitenzi hiki cha kati kina maana ya kuwaita watu waje kwa msemaji; usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo la kuwaita kwake.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: wanafunzi wake kumi na wawili
  rationale: “Wanafunzi” ni neno la kawaida na linaloeleweka kwa μαθηταί, huku “wake” ikihifadhi umilikaji wa αὐτοῦ.
- source_word: ἔδωκεν
  choice: akawapa
  rationale: Hili linawakilisha moja kwa moja maana ya “aliwapa” na linaunganisha kwa kawaida tendo hili na tendo la kuwaita.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha haki au uwezo ulioidhinishwa wa kutenda, si nguvu ghafi tu.
- source_word: πνευμάτων ἀκαθάρτων
  choice: juu ya roho wachafu
  rationale: “Juu ya” huonyesha mamlaka inayotumiwa dhidi ya roho hao, na “roho wachafu” ni usemi sahihi na uliozoeleka katika Injili.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: ili wawatoe
  rationale: “Ili” huwasilisha uhusiano wa kusudi au matokeo bila kuufafanua kupita kiasi; kiambishi “wa-” kinarejelea roho kama viumbe wenye nafsi katika matumizi ya kawaida ya Kiswahili.
- source_word: θεραπεύειν
  choice: kuponya
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwafanya wagonjwa wawe wazima.
- source_word: πᾶσαν νόσον
  choice: kila ugonjwa
  rationale: “Ugonjwa” ni tafsiri ya kawaida ya νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: kila udhaifu
  rationale: “Udhaifu” huhifadhi tofauti ya kimatamshi na νόσος na huakisi maana ya hali ya kudhoofika au ulemavu wa mwili; yaweza pia kueleweka kama maradhi.
theological_decisions:
- issue: Asili ya mamlaka ya wanafunzi
  choice: Yesu aliwapa wale kumi na wawili mamlaka juu ya roho wachafu.
  alternative: Yesu aliwapa nguvu juu ya roho wachafu.
  rationale: ἐξουσία inaelekea kumaanisha mamlaka au haki ya kutenda iliyotolewa; “mamlaka” huhifadhi wazo hilo bila kuongeza dai la kiteolojia lisilosemwa wazi.
- issue: Uhusiano unaoonyeshwa na ὥστε pamoja na vitenzi visivyo na kikomo
  choice: ili wawatoe na kuponya
  alternative: hata wakaweza kuwatoa na kuponya
  rationale: Muundo wa Kigiriki unaweza kugusa kusudi na matokeo; “ili” ni wa kawaida katika Kiswahili na hauhitaji kuamua kwamba ni matokeo yaliyotokea tayari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “akawaita ... akawapa” ni wa kawaida; msamiati wa “mamlaka” na “roho wachafu” unahifadhi maana ya chanzo bila kuingiza msimamo wa dhehebu.
