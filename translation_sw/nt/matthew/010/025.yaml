  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: sw
  text: Inamtosha mwanafunzi kuwa kama mwalimu wake, na mtumwa kuwa kama bwana wake. Ikiwa wamemwita bwana wa nyumba Beelzebuli[a], je, si zaidi sana watawaita hivyo watu wa nyumbani mwake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Beelzebubu,” umbo jingine la jina hili lililozoeleka katika mapokeo fulani.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Yamtosha
  rationale: Kitenzi hiki cha Kiswahili kinaeleza utoshelevu kwa njia ya kawaida na kuhifadhi uhusiano wake na ‘mwanafunzi.’
- source_word: μαθητῇ
  choice: mwanafunzi
  rationale: Neno hili linafaa kwa uhusiano wa anayejifunza chini ya mwalimu, bila kuufanya kuwa wa darasani pekee.
- source_word: ἵνα γένηται ὡς
  choice: kuwa kama
  rationale: Muundo huu wa asili katika Kiswahili unaonyesha hali inayotosha kufikiwa bila kulazimisha tofauti kati ya kusudi na matokeo.
- source_word: διδάσκαλος
  choice: mwalimu
  rationale: Huhifadhi jozi ya mwanafunzi na mwalimu na kulitofautisha neno hili na κύριος.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika ulinganisho huu wa hadhi na κύριος, ‘mtumwa’ huonyesha utegemezi na mamlaka kwa usahihi kuliko ‘mtumishi.’
- source_word: κύριος
  choice: bwana
  rationale: Katika muktadha huu ni mkuu wa mtumwa; ‘bwana’ ni neno la kawaida la Kiswahili kwa uhusiano huo bila kulazimisha hapa kuwa jina la cheo cha Mungu.
- source_word: οἰκοδεσπότην
  choice: mwenye nyumba
  rationale: Hueleza mkuu au mwenye mamlaka katika nyumba na huunganika kwa kawaida na ‘watu wa nyumbani mwake.’
- source_word: Βεελζεβοὺλ
  choice: Beelzebuli
  rationale: Hufuata umbo la jina la Kigiriki Βεελζεβούλ kwa tahajia inayosomeka kwa Kiswahili.
- source_word: ἐπεκάλεσαν
  choice: wamemwita
  rationale: Katika muktadha huu kitenzi kinamaanisha kumpa au kumwita mtu kwa jina fulani.
- source_word: πόσῳ μᾶλλον
  choice: si zaidi sana
  rationale: Hutoa hoja ya kutoka jambo kubwa kwenda lililo la hakika zaidi kwa namna ya swali linaloeleweka katika Kiswahili.
- source_word: οἰκιακοὺς
  choice: watu wa nyumbani mwake
  rationale: Huwajumuisha washiriki wote wa nyumba, si watumwa pekee, na huhifadhi uhusiano wa kisemantiki na ‘mwenye nyumba.’
theological_decisions:
- issue: Maana ya κύριος katika mfano wa nyumba
  choice: bwana
  alternative: Bwana
  rationale: Muktadha unaonyesha uhusiano wa kijamii kati ya mtumwa na mkuu wake, si matumizi ya wazi ya cheo cha kiungu; herufi ndogo huepuka kuingiza msisitizo wa kikristo usiotajwa moja kwa moja katika kishazi.
- issue: Utoaji wa δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: Ulinganifu na κύριος unasisitiza tofauti ya hadhi na hali ya kuwa chini ya mamlaka; ‘mtumwa’ huhifadhi nguvu hiyo.
- issue: Nguvu ya πόσῳ μᾶλλον katika kishazi kisicho na kitenzi
  choice: si zaidi sana watu wa nyumbani mwake?
  alternative: je, watawaitaje vibaya zaidi watu wa nyumbani mwake?
  rationale: Kigiriki kinaacha kitenzi katika sehemu ya pili kieleweke kutoka sehemu ya kwanza. Tafsiri iliyochaguliwa huhifadhi ufupi na utata huo badala ya kuongeza kitendo au kiwango cha ubaya kisichotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Alama ya tanbihi imewekwa baada ya jina linalohusika. Muundo wa mwisho wa swali umehifadhi ufupi wa Kigiriki, ingawa ni wa kimethali zaidi kuliko mazungumzo ya kawaida.
