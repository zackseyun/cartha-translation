  text: As you enter the house[a], greet it.
translation:
  language: sw
  text: Mnapoingia katika nyumba[a], isalimuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasalimuni watu wa nyumba hiyo.” Kigiriki husema “isalimuni,” ikirejelea nyumba; huenda hapa nyumba inawakilisha watu wanaoishi humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Mnapoingia
  rationale: Kitenzi kishirikishi cha wakati uliopo, katika wingi, kinafanya kazi ya kueleza wakati wa agizo; “mnapoingia” ni Kiswahili cha kawaida kinachoonyesha kwamba salamu itolewe wakati wa kuingia.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: δέ ni kiunganishi hafifu. Hapa uhusiano wake na yaliyotangulia unaeleweka bila kuongeza “lakini” au “na,” ambazo zingetia mkazo usiokuwamo katika Kigiriki.
- source_word: οἰκίαν
  choice: nyumba hiyo
  rationale: οἰκία inaweza kumaanisha jengo au watu wa nyumbani. Muktadha wa kuingia unaunga mkono maana halisi ya “nyumba,” huku maana inayowahusu wakaaji ikifafanuliwa katika tanbihi.
- source_word: ἀσπάσασθε
  choice: isalimuni
  rationale: Ni agizo la moja kwa moja kwa watu wengi. “Isalimuni” ni usemi mfupi na wa sasa unaolingana na “salimuni,” huku kiambishi cha yambwa kikidumisha rejeo la nyumba.
- source_word: αὐτήν
  choice: -i- katika “isalimuni”
  rationale: Kiwakilishi hiki cha kike, umoja, kinarejelea οἰκίαν. Katika Kiswahili, kiambishi cha yambwa “-i-” cha ngeli ya nyumba kinahifadhi rejeo hilo la kisarufi bila kulibadili waziwazi kuwa “wakaaji.”
theological_decisions:
- issue: Je, salamu inaelekezwa kwa nyumba au kwa wakaaji wake?
  choice: 'Kudumisha nyumba kama rejeo la moja kwa moja katika matini kuu: “isalimuni”'
  alternative: “wasalimuni watu wa nyumba hiyo”
  rationale: Kigiriki kinatumia kiwakilishi cha umoja kinachorejelea “nyumba.” Huenda nyumba inawakilisha wakaaji wake, lakini kulisema hilo wazi katika matini kuu kungeondoa namna ya usemi na kiwango cha utata cha chanzo; kwa hiyo ufafanuzi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “mnapoingia” ni wa kawaida na unaeleweka kwa urahisi; “isalimuni” kwa makusudi inadumisha usemi wa Kigiriki unaoielekezea nyumba salamu, huku tanbihi ikifafanua maana inayowezekana ya watu wa nyumbani.
