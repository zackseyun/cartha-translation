  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: sw
  text: Lakini yeyote atakayenikana mbele ya watu, mimi pia nitamkana mbele ya Baba yangu aliye mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “aliye katika mbingu”; Kigiriki hutumia umbo la wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Lakini yeyote atakaye-
  rationale: ὅστις pamoja na ἄν na hali ya utegemezi huonyesha sharti la jumla, yaani mtu yeyote ambaye angefanya jambo hilo; δέ huleta utofautishaji na mstari uliotangulia. Muundo wa Kiswahili “yeyote atakaye-” ni wa kawaida na huhifadhi maana hiyo ya jumla.
- source_word: ἀρνήσηταί με
  choice: atakayenikana
  rationale: ἀρνέομαι hapa humaanisha kumkana au kutokiri uhusiano na mtu hadharani. “Atakayenikana” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: ἔμπροσθεν humaanisha mbele ya au katika uwepo wa; ἀνθρώπων hapa ina maana ya jumla ya wanadamu. “Watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya ihusu wanaume pekee.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: mimi pia nitamkana
  rationale: 'κἀγώ hukazia ulinganifu wa tendo: “mimi pia.” Kurudia kitenzi “kumkana” huhifadhi usambamba wenye nguvu kati ya mtu kumkana Yesu na Yesu kumkana mtu huyo.'
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: mbele za Baba yangu
  rationale: Huu ni usemi wa kuwepo mbele ya Baba. “Mbele za” ni Kiswahili cha kawaida, chenye hadhi, na “Baba yangu” huhifadhi jina la uhusiano alilotumia Yesu.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: aliye mbinguni
  rationale: Kigiriki kina umbo la wingi, “aliye katika mbingu,” lakini “aliye mbinguni” ndilo tamko la asili katika Kiswahili na huhifadhi maana bila uzito usio wa lazima.
theological_decisions:
- issue: Ulinganifu wa kumkana Yesu na Yesu kumkana mtu
  choice: atakayenikana ... mimi pia nitamkana
  alternative: atakayenikana ... nami nitamkana
  rationale: Kutumia mzizi uleule wa kitenzi katika sehemu zote mbili huhifadhi ulinganifu wa makusudi na uzito wa kauli bila kuongeza maelezo ya kimadhehebu.
- issue: Rejeo la jumla katika ἀνθρώπων na αὐτόν
  choice: watu ... nitamkana
  alternative: wanadamu ... nitamkana mtu huyo
  rationale: Ingawa Kigiriki hutumia maumbo ya kiume, ἀνθρώπων hapa ni ya jumla. Kiswahili “watu” huonyesha upeo huo kwa kawaida, na kiambishi cha yambwa “-m-” hakilazimishi jinsia ya kiume wala ya kike.
- issue: Umbo la wingi katika οὐρανοῖς
  choice: mbinguni
  alternative: katika mbingu
  rationale: “Mbinguni” ni usemi wa kawaida wa Kiswahili kwa makao ya Baba, huku tanbihi ikihifadhi taarifa kwamba Kigiriki kina umbo la wingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi utofautishaji wa “Lakini,” upeo wa “yeyote,” na usambamba wa kitenzi “kumkana.”
