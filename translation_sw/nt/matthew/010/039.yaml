  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: sw
  text: Yeyote anayeyapata maisha yake[a] atayapoteza, na yeyote anayeyapoteza maisha yake kwa ajili yangu atayapata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi” katika sehemu zote mbili; neno la Kigiriki ψυχή linaweza kumaanisha “maisha” au “nafsi,” lakini hapa “maisha” linafaa zaidi katika muktadha wa kupoteza na kupata maisha katika uanafunzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Yeyote anayeipata
  rationale: Kirai chenye artikeli na kitenzi-jina kinamtaja mtu yeyote kama mfano wa jumla. “Yeyote anaye…” ni Kiswahili cha kawaida na huhifadhi maana hiyo ya jumla.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: maisha yake
  rationale: Katika muktadha huu ψυχή humaanisha uhai au maisha ya mtu anayejitahidi kuyahifadhi au kuyatoa kwa ajili ya Yesu, si lazima nafsi isiyo ya kimwili. Kiswahili hutumia “maisha” kwa kawaida katika fumbo hili.
- source_word: ἀπολέσει
  choice: atayapoteza
  rationale: Hapa ἀπόλλυμι huonyesha kupoteza, na uchaguzi huu huhifadhi ulinganifu wa makusudi kati ya kupata na kupoteza.
- source_word: ὁ ἀπολέσας
  choice: yeyote anayeyapoteza
  rationale: Ingawa kitenzi-jina cha Kigiriki ni cha wakati uliopita, katika msemo huu kina nguvu ya kanuni ya jumla; wakati wa sasa wa Kiswahili unasikika kawaida kabla ya “atayapata.”
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa ajili yangu
  rationale: Kirai hiki huonyesha sababu au nia inayotokana na uaminifu kwa Yesu. “Kwa ajili yangu” ni cha kawaida, kifupi, na chenye hadhi.
- source_word: εὑρήσει
  choice: atayapata
  rationale: “Atayapata” huhifadhi urudiaji wa mzizi wa kupata uliopo katika εὑρὼν na εὑρήσει, pamoja na muundo wa kimafumbo wa msemo.
- source_word: αὐτοῦ / αὐτήν
  choice: yake / -ya-
  rationale: Viwakilishi vya Kiswahili vinapatana na ngeli ya “maisha” na wakati huohuo huacha msemo utumike kwa mtu yeyote bila kuongeza jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
theological_decisions:
- issue: Tafsiri ya ψυχή katika fumbo la uanafunzi
  choice: maisha
  alternative: nafsi
  rationale: Muktadha unahusu mtu kuyahifadhi au kuyatoa maisha yake kwa sababu ya uaminifu kwa Yesu. “Maisha” huhifadhi mvutano wa kujilinda dhidi ya kujitoa, bila kuifanya aya kuwa kauli mahsusi kuhusu tofauti kati ya mwili na nafsi. “Nafsi” inabaki kuwa maana mbadala halali ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiarudia wa “kupata—kupoteza—kupoteza—kupata” umehifadhiwa. “Yeyote” hutoa maana ya jumla kwa njia ya asili katika Kiswahili.
