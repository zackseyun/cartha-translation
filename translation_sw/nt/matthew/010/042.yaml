id: MAT.10.42
reference: Matthew 10:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: sw
  text: Na yeyote atakayempa mmoja wa hawa wadogo[a] hata kikombe kimoja tu cha maji baridi kwa sababu huyo ni mwanafunzi[b], kweli nawaambia, kamwe hatapoteza thawabu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Hawa wadogo’ hapa yaelekea ni wafuasi wa Yesu walio wanyonge au wenye hadhi ya chini, si lazima watoto pekee.
    reason: cross_reference
  - marker: b
    text: Kwa tafsiri rasmi zaidi, ‘kwa jina la mwanafunzi.’ Usemi wa Kigiriki unaonyesha kwamba tendo hilo linafanywa kwa sababu ya utambulisho wa anayepokea kuwa mwanafunzi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: yeyote atakaye-
  rationale: Muundo huu unaonyesha mtu yeyote bila kumwekea mpaka; ‘yeyote atakaye-’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya jumla.
- source_word: ποτίσῃ
  choice: atakayempa
  rationale: Kitenzi humaanisha kumpa mtu kitu anywe. Katika sentensi yenye ‘kikombe cha maji,’ ‘kumpa’ ni ya asili na maana ya kunywesha inaeleweka wazi.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: mmoja wa hawa walio wadogo
  rationale: Neno μικρός linaweza kuonyesha udogo, unyonge, au hadhi ya chini. Tafsiri haifungi maana kwa watoto pekee.
- source_word: ποτήριον ψυχροῦ
  choice: kikombe cha maji baridi
  rationale: Ingawa neno ‘maji’ halijaandikwa moja kwa moja katika Kigiriki, linaeleweka katika usemi huu; hii ndiyo namna ya kawaida ya kusema kwa Kiswahili.
- source_word: μόνον
  choice: hata kikombe tu
  rationale: ‘Hata ... tu’ huonyesha udogo wa msaada unaotolewa bila kupunguza umuhimu wake.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: kwa sababu yeye ni mwanafunzi
  rationale: Usemi unaonyesha kuwa msaada unatolewa kwa kutambua utambulisho wa anayepokea kama mwanafunzi. Tanbihi inahifadhi tafsiri rasmi zaidi.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: kweli nawaambia
  rationale: Huu ni usemi wa kusisitiza tamko lenye mamlaka; ‘kweli nawaambia’ ni wa asili, wenye heshima, na huhifadhi uzito wake.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: kamwe hatapoteza
  rationale: Ukanushaji maradufu wa Kigiriki ni wa msisitizo mkubwa; ‘kamwe hatapoteza’ huwasilisha uhakikisho huo.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: thawabu yake
  rationale: Katika muktadha huu μισθός ni malipo au ujira unaotolewa kama thawabu; ‘thawabu’ ni neno la kawaida na linalofaa.
theological_decisions:
- issue: Rejeo la ‘hawa walio wadogo’
  choice: Usemi umeachwa mpana, ukiweza kurejelea wafuasi wa Yesu walio wanyonge au wenye hadhi ndogo.
  alternative: Watoto halisi pekee, au waamini wapya au dhaifu pekee.
  rationale: Muktadha unahusu kuwapokea wanafunzi kwa sababu ya uhusiano wao na Yesu. Tafsiri haipaswi kubana maana kuliko maandishi yenyewe.
- issue: Maana ya εἰς ὄνομα μαθητοῦ
  choice: ‘kwa sababu yeye ni mwanafunzi,’ yaani kwa kutambua utambulisho wa anayepokea kama mwanafunzi.
  alternative: ‘kwa jina la mwanafunzi.’
  rationale: Tafsiri kuu inaeleza kazi ya nahau kwa Kiswahili cha sasa bila kuingiza maana ya kiibada au kauli maalumu; tafsiri rasmi zaidi imehifadhiwa katika tanbihi.
- issue: Nguvu ya ahadi katika οὐ μὴ ἀπολέσῃ
  choice: ‘kamwe hatapoteza,’ ikihifadhi ukanushaji wenye msisitizo.
  alternative: ‘hatapoteza’ bila neno la msisitizo.
  rationale: Muundo wa Kigiriki unatoa uhakikisho mkubwa, hivyo Kiswahili kinahitaji neno la kusisitiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi upana wa ‘walio wadogo,’ sababu inayohusiana na utambulisho wa mwanafunzi, na nguvu ya ahadi.
