id: MAT.10.27
reference: Matthew 10:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: sw
  text: Ninachowaambia gizani[a], kisemeni nuruni; na mnachosikia sikioni[b], kitangazeni juu ya paa za nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa siri ... waziwazi.” Kigiriki kinahifadhi taswira ya “gizani ... nuruni.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, jambo linalosikiwa faraghani linapaswa kutangazwa hadharani. Nyumba nyingi za kale zilikuwa na paa tambarare, ambazo zilikuwa mahali pa juu na pa wazi pa kutolea matangazo kwa watu.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ninachowaambia
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida ‘kile ninachowaambia’ huku ukihifadhi wazo la Yesu kusema moja kwa moja na wanafunzi wake.
- source_word: ἐν τῇ σκοτίᾳ
  choice: gizani
  rationale: Neno hili linahifadhi taswira ya giza na ulinganifu wake wa moja kwa moja na nuru, badala ya kufafanua taswira hiyo kuwa ‘kwa siri’ katika matini kuu.
- source_word: εἴπατε
  choice: kisemeni
  rationale: Kitenzi cha amri kinawataka waseme kwa dhahiri kile walichoambiwa; kiambishi ‘ki-’ kinarejelea jambo lililotangulia kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ φωτί
  choice: nuruni
  rationale: Linahifadhi taswira na tofauti kati ya giza na nuru, huku maana ya kutangaza wazi ikibaki dhahiri katika muktadha.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: mnachosikia sikioni
  rationale: Tafsiri hii inadumisha taswira hai ya mawasiliano ya faraghani ‘sikioni’ bila kuongeza waziwazi wazo la kunong’ona, ambalo halitajwi moja kwa moja na Kigiriki.
- source_word: κηρύξατε
  choice: kitangazeni
  rationale: ‘Kitangazeni’ linaonyesha utoaji wa ujumbe hadharani na kwa sauti ya wazi, bila kulifanya neno hilo limaanishe mahubiri rasmi pekee.
- source_word: ἐπὶ τῶν δωμάτων
  choice: juu ya paa za nyumba
  rationale: Hii inahifadhi mahali palipotajwa katika taswira ya Kigiriki na inaeleweka vizuri kwa wasomaji wa Kiswahili kuliko neno ‘mapaani’ peke yake.
theological_decisions:
- issue: Iwapo lugha ya giza/nuru na sikio/paa ifafanuliwe moja kwa moja kuwa siri na hadhara
  choice: 'Taswira imehifadhiwa katika matini kuu: ‘gizani ... nuruni ... sikioni ... juu ya paa za nyumba.’'
  alternative: ‘kwa siri ... waziwazi ... mnachonong’onezwa ... kitangazeni hadharani’
  rationale: Maneno ya Yesu yana taswira zenye ulinganifu mkali ambazo zinaonyesha kutoka mawasiliano ya faraghani kwenda tangazo la hadharani. Kuzihifadhi huepuka kufupisha mvutano wa usemi huo kuwa ufafanuzi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa giza/nuru na sikio/paa umehifadhiwa, huku tanbihi zikifafanua maana na mazingira ya kitamaduni.
