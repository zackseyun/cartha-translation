  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na taswira ya Kigiriki: kile kinachosemwa gizani kinapaswa kusemwa nuruni, na kile kinachosikiwa sikioni kinapaswa kutangazwa juu ya paa za nyumba. Amri za wingi ‘kisemeni’ na ‘kitangazeni’ zinawakilisha vizuri εἴπατε na κηρύξατε.'
