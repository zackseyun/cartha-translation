base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: sw
  text: Na yeyote asiyeuchukua msalaba wake[a] na kunifuata hanistahili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki husema “msalaba wake” kwa umoja kwa maana ya jumla: kila mfuasi huchukua msalaba wake mwenyewe.'
    reason: lexical_alternative
  - marker: b
    text: Kwa usemi wa karibu zaidi na Kigiriki, “na kufuata nyuma yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: yeyote
  rationale: Huonyesha maana ya jumla ya mtu yeyote na kuhifadhi uzito wa sharti katika kauli hii.
- source_word: λαμβάνει
  choice: anayeuchukua
  rationale: Pamoja na ‘msalaba,’ kitenzi hiki kinaonyesha mtu kujitwika au kuukubali kwa hiari; ‘kuuchukua’ ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: σταυρὸν
  choice: msalaba
  rationale: Hili ndilo neno la kawaida na sahihi kwa kifaa cha hukumu ya Kirumi, nalo linahifadhi taswira halisi na uzito wake katika wito wa ufuasi.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi cha umoja kinafuata muundo wa Kigiriki na kumrejelea kila mfuasi mmoja mmoja; katika Kiswahili ‘wake’ halibainishi jinsia.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: kufuata nyuma yangu
  rationale: Tafsiri hii inahifadhi kwa uwazi neno ὀπίσω, ‘nyuma,’ badala ya kulirahisisha kuwa ‘kunifuata’ pekee.
- source_word: ἄξιος
  choice: anastahili
  rationale: ‘Kustahili’ hutoa maana ya tathmini ya ἄξιος kwa lugha ya sasa na yenye uzito unaofaa.
- source_word: μου ἄξιος
  choice: anistahili
  rationale: Muundo huu mfupi na wa kawaida huwasilisha ‘kustahili kwangu/mimi’ bila kuongeza maelezo kama ‘kuwa wangu.’
theological_decisions:
- issue: Kauli ya ufuasi kuhusu kuuchukua msalaba
  choice: Kuhifadhi taswira halisi ‘kuuchukua msalaba wake.’
  alternative: Kufafanua kuwa ‘kukubali mateso’ au ‘kujikana mwenyewe.’
  rationale: Maandishi yanatumia msalaba kama taswira halisi yenye maana ya gharama, aibu na uwezekano wa mateso katika kumfuata Yesu; kuibadili kuwa dhana ya jumla kungepunguza mvutano na uzito wake.
- issue: Kiwakilishi cha umoja αὐτοῦ
  choice: Kutumia ‘wake’ kwa maana ya kila mtu mmoja mmoja.
  alternative: Kutumia ufafanuzi ndani ya mstari, kama ‘msalaba wake mwenyewe.’
  rationale: ‘Wake’ huhifadhi umoja wa chanzo bila kuingiza jinsia katika Kiswahili; tanbihi inaeleza maana yake ya jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kufuata nyuma yangu’ umehifadhiwa licha ya kuwa ‘kunifuata’ ni mfupi na wa kawaida zaidi, kwa sababu chanzo kinataja wazi ὀπίσω (‘nyuma’).
