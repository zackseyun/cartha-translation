source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: sw
  text: Anayempokea nabii kwa jina la nabii atapokea thawabu ya nabii[a], na anayempokea mtu mwenye haki kwa jina la mtu mwenye haki atapokea thawabu ya mtu mwenye haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ni nabii” au “kama nabii.” Kwa maana halisi, Kigiriki husema, “kwa jina la nabii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ni mtu mwenye haki” au “kama mtu mwenye haki.” Kwa maana halisi, Kigiriki husema, “kwa jina la mtu mwenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: anayempokea
  rationale: Kirai cha kisifa chenye kibainishi kimetafsiriwa kwa muundo wa Kiswahili unaoeleza mtu yeyote anayefanya tendo hilo kwa maana ya jumla; ‘kumpokea’ pia linaweza kujumuisha kumkaribisha.
- source_word: προφήτην
  choice: nabii
  rationale: Hili ndilo neno la kawaida na linalotambulika kwa nafasi hii ya kidini, bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: εἰς ὄνομα προφήτου
  choice: kwa jina la nabii
  rationale: Tafsiri hii inadumisha muundo na mwangwi wa nahau ya Kigiriki, huku tanbihi ikieleza maana zinazowezekana za kumpokea kwa sababu yeye ni nabii au kama nabii.
- source_word: μισθὸν προφήτου
  choice: thawabu ya nabii
  rationale: Muundo huu wa Kiswahili ni wa asili na unahifadhi utata wa iwapo ni thawabu anayopewa nabii au thawabu inayomhusu anayempokea nabii.
- source_word: λήμψεται
  choice: atapokea
  rationale: Wakati ujao wa kitenzi umetolewa moja kwa moja kwa Kiswahili, huku marudio ya ‘kupokea’ yakihifadhiwa.
- source_word: δίκαιον
  choice: mtu mwenye haki
  rationale: Kivumishi kilichotumiwa kama nomino kimetolewa kwa Kiswahili cha kawaida na chenye heshima. ‘Mtu mwenye haki’ huwasilisha sifa ya uadilifu bila kufanya sentensi kuwa ngumu au kudai zaidi ya Kigiriki.
- source_word: εἰς ὄνομα δικαίου
  choice: kwa jina la mtu mwenye haki
  rationale: Muundo sambamba na kishazi cha kwanza umehifadhiwa; tanbihi inafafanua kwamba nahau inaweza kumaanisha kwa sababu yeye ni mtu mwenye haki au kama mtu mwenye haki.
- source_word: μισθὸν δικαίου
  choice: thawabu ya mtu mwenye haki
  rationale: Huhifadhi usambamba wa sentensi na uhusiano mpana wa nomino tegemezi bila kuamua kwa lazima aina kamili ya thawabu inayokusudiwa.
theological_decisions:
- issue: Maana ya nahau εἰς ὄνομα pamoja na umilikishi
  choice: Kudumisha ‘kwa jina la’ katika matini kuu na kutoa maana zake za kimuktadha katika tanbihi.
  alternative: ‘kwa sababu yeye ni’ au ‘kama’ nabii/mtu mwenye haki
  rationale: Nahau inaonyesha kumpokea mtu kwa msingi wa utambulisho au nafasi yake. Matini kuu inadumisha mtindo na mwangwi wa chanzo, lakini tanbihi huzuia msomaji asiielewe kana kwamba ni kutamka jina tu.
- issue: Utoaji wa δίκαιον / δικαίου
  choice: mtu mwenye haki
  alternative: mwenye haki; mwanamume mwenye haki
  rationale: Kigiriki kina umbo la kiume katika umoja, lakini katika Kiswahili ‘mtu mwenye haki’ ni njia ya kawaida ya kutaja mhusika binafsi na haisuluhishi isivyofaa iwapo usemi wa Kigiriki una nguvu wakilishi. ‘Mwanamume’ ingeweza kusisitiza jinsia kuliko muktadha unavyohitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa vishazi viwili na marudio ya ‘atapokea’ yamedumishwa. ‘Thawabu’ limechaguliwa kwa kuwa ni neno la kawaida katika muktadha huu wa kibiblia; ‘ujira’ lingeweza kudokeza zaidi malipo ya kazi.
