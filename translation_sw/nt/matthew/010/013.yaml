base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: sw
  text: Na ikiwa nyumba hiyo inafaa[a], amani yenu na ije juu yake; lakini ikiwa haifai[b], amani yenu na irudi kwenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumba hiyo” au “nyumbani.” Neno la Kigiriki linalotafsiriwa “nyumba” linaweza kumaanisha jengo na, kwa upanuzi, watu wanaohusishwa nacho.
    reason: lexical_alternative
  - marker: b
    text: “Inafaa” hapa humaanisha kufaa kuwapokea wajumbe na amani yao; haimaanishi kutokuwa na dhambi.
    reason: cultural_note
  - marker: c
    text: Au “amani yenu na igeuke irudi kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: nyumba
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya neno la Kigiriki; katika muktadha inaweza pia kuhusisha watu wa nyumbani humo.
- source_word: ἀξία
  choice: inastahili
  rationale: Inadumisha tathmini iliyo katika neno la Kigiriki bila kuifupisha kuwa kukubali ujumbe tu.
- source_word: ἐλθάτω
  choice: na ije
  rationale: Inaonyesha kwa Kiswahili cha kawaida nguvu ya amri ya nafsi ya tatu.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni kisawe cha kawaida kinachohifadhi pia wazo pana la baraka na hali njema katika muktadha huu.
- source_word: ἐπ’ αὐτήν
  choice: juu yake
  rationale: Inahifadhi taswira ya amani kuja juu ya nyumba.
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: na iwarudie
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha amani ikirudi kwa wale waliyoitamka.
- source_word: μὲν ... δὲ
  choice: ikiwa ...; lakini ikiwa ...
  rationale: Inawasilisha kwa uwazi na kawaida ulinganifu wenye utofautishaji wa masharti mawili.
theological_decisions:
- issue: Maana ya “amani yenu”
  choice: Imeachwa kuwa amani ya wanafunzi inayoweza kuja juu ya nyumba au kuwarudia.
  alternative: salamu yenu ya amani; amani mnayoitamka; baraka ya amani
  rationale: Andiko linaonyesha amani kwa namna halisi inayohusiana na utume wao, lakini halielezi utendaji wake kimetafizikia. Tafsiri inalinda taswira na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “na ije/na iwarudie” ni wa kibiblia lakini bado unaeleweka kwa wasomaji wa kawaida. Viwakilishi vya ngeli ya 9 vinaelekeza kwa “amani,” huku “juu yake” ikielekeza kwa “nyumba.”
