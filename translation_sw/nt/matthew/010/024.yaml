base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: sw
  text: Mwanafunzi si mkuu kuliko mwalimu, wala mtumwa[a] si mkuu kuliko bwana wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi” badala ya “mtumwa”; neno la Kigiriki δοῦλος linaweza kumaanisha mojawapo, kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki κύριος linaweza pia kutafsiriwa “Bwana”; hapa linamrejelea mwenye mamlaka wa kibinadamu katika mlinganisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: mwanafunzi
  rationale: Neno hili linaeleza mtu anayejifunza chini ya mwalimu na, katika muktadha wa Injili, anayemfuata; “mwanafunzi” ni la kawaida na linafaa katika Kiswahili sanifu.
- source_word: ὑπέρ
  choice: mkuu kuliko
  rationale: Likiwa na hali ya accusative hapa, linaonyesha cheo au ukuu juu ya mwingine. “Mkuu kuliko” huwasilisha ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: διδάσκαλος
  choice: mwalimu
  rationale: Hii ndiyo maana ya wazi ya neno hilo na inadumisha ulinganifu wa mwanafunzi na mwalimu.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika jozi hii na κύριος, neno linaonyesha wazi hali ya kuwa chini ya mamlaka na umiliki wa bwana; “mtumwa” huhifadhi nguvu hiyo kuliko “mtumishi.”
- source_word: κύριος
  choice: bwana
  rationale: Katika mlinganisho huu wa kijamii, neno linamaanisha mwenye mamlaka juu ya mtumwa, si lazima cheo cha kimungu. “Bwana” ni la asili katika Kiswahili na huhifadhi upana wa neno la Kigiriki.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi hiki kinaonyesha uhusiano wa mwanafunzi na mwalimu wake, na wa mtumwa na bwana wake; kurudia “wake” kunafanya Kiswahili kiwe wazi na cha asili.
- source_word: οὐδέ
  choice: wala
  rationale: “Wala” huunganisha kwa ufasaha ulinganisho wa pili hasi na wa kwanza.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mlinganisho wa kijamii
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unalinganisha hadhi ya mtumwa na bwana wake, hivyo “mtumwa” hudumisha hali ya utegemezi na mamlaka iliyomo katika δοῦλος. “Mtumishi” imehifadhiwa katika tanbihi kama uwezekano mpana wa kileksika.
- issue: Tafsiri ya κύριος katika muktadha usio wa wazi kuwa wa kimungu
  choice: bwana
  alternative: Bwana
  rationale: Hapa κύριος ni upande wa pili wa jozi mtumwa/bwana na inarejelea mwenye mamlaka wa kibinadamu katika mlinganisho. Herufi ndogo inaepusha kuifanya kimyakimya kuwa cheo cha kimungu, huku “bwana” ikihifadhi maana ya neno.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi mbili sambamba umehifadhiwa. “Si mkuu kuliko” ni wa asili zaidi kuliko tafsiri ya moja kwa moja “hayuko juu ya” na unaonyesha tofauti ya hadhi bila kuongeza ufafanuzi.
