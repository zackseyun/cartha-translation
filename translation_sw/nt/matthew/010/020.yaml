  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: sw
  text: Kwa maana si ninyi mnaosema, bali ni Roho wa Baba yenu anayesema ndani yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia ninyi.” Kigiriki kinasema “ndani yenu,” lakini katika muktadha huu kinaweza pia kumaanisha kwamba Roho anasema kupitia wanafunzi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana si
  rationale: γάρ inaeleza sababu ya uhakikisho uliotangulia; “Kwa maana” huunganisha sentensi kwa kawaida huku ikihifadhi ukanushi.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: ninyi mnaosema
  rationale: Kiwakilishi ὑμεῖς kimetajwa kwa msisitizo, nao muundo wenye kitenzi kishirikishi unaelekeza kwa wale wanaofanya tendo. “Ninyi mnaosema” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: ἀλλὰ
  choice: bali ni
  rationale: ἀλλά huonyesha utofautishaji mkali. “Bali ni” huonyesha kwamba msemaji halisi anatambulishwa kwa kulinganishwa na wanafunzi.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika muktadha huu neno hilo linamtaja Roho wa Mungu, si roho ya mwanadamu wala pumzi; herufi kubwa huonyesha mrejelewa huyo bila kuongeza maudhui.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: wa Baba yenu
  rationale: Genitivi inaonyesha uhusiano wa Roho na Baba wa wanafunzi. “Baba yenu” huhifadhi maneno ya kifungu bila kuongeza “wa mbinguni,” ambacho hakipo hapa.
- source_word: τὸ λαλοῦν
  choice: anayesema
  rationale: Kishirikishi cha wakati wa sasa kinarejelea Roho na kuonyesha tendo linaloendelea; “anayesema” ni wazi na cha kawaida katika Kiswahili.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Maana ya moja kwa moja ya ἐν ni “ndani ya/katika.” “Ndani yenu” huhifadhi usemi wa Kigiriki na kutatua tatizo la kisarufi kwamba “katika yenu” si Kiswahili sanifu.
theological_decisions:
- issue: Iwapo ἐν ὑμῖν itafsiriwe kama uwepo wa ndani au kama utendaji kupitia wanafunzi
  choice: ndani yenu
  alternative: kupitia ninyi
  rationale: Kigiriki kinasema ἐν, ambacho maana yake ya moja kwa moja ni “ndani ya/katika.” Muktadha unaweza kudokeza kwamba Roho anasema kupitia wanafunzi, lakini kuweka hilo katika matini kuu kungeondoa mvutano ambao chanzo kinauacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “si ninyi..., bali ni...” huhifadhi msisitizo wa chanzo bila kuwa mzito. “Kusema” limetumiwa badala ya “kunena” ili matini ieleweke kwa urahisi na wasomaji wa kawaida.
