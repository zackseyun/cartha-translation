  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: sw
  text: Kwa kweli nawaambia, siku ya hukumu itakuwa nafuu zaidi[a] kwa nchi ya Sodoma na Gomora kuliko kwa mji ule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itastahimilika zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kwa kweli
  rationale: Katika kauli ἀμὴν λέγω ὑμῖν, maneno haya yanaonyesha uthibitisho mzito na wa dhati. “Kwa kweli” yanaeleweka kwa urahisi katika Kiswahili cha sasa kuliko unukuzi “Amina.”
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili inayodumisha usemi wa moja kwa moja wa Yesu.
- source_word: ἀνεκτότερον
  choice: itakuwa nafuu zaidi
  rationale: Kivumishi hiki cha kulinganisha humaanisha hali inayoweza kuvumilika zaidi. “Nafuu zaidi” ni usemi wa asili katika muundo huu na hudokeza kwamba hukumu haitakuwa nzito kwa kiwango kilekile, bila kuongeza maelezo yasiyomo katika matini.
- source_word: γῇ
  choice: kwa nchi
  rationale: Hapa γῇ inarejelea eneo la Sodoma na Gomora, si dunia kwa ujumla. “Nchi” inadumisha taswira ya kijiografia ya Kigiriki.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: ya Sodoma na Gomora
  rationale: Haya ndiyo maumbo ya majina ya maeneo hayo yaliyozoeleka katika Kiswahili.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: siku ya hukumu
  rationale: Usemi huu unaelekeza kwenye siku ya hukumu ya Mungu. Tafsiri haiongezi mpangilio wowote wa kimafundisho ambao matini yenyewe hauelezi.
- source_word: πόλει ἐκείνῃ
  choice: kwa mji ule
  rationale: “Mji” linaweza kutaja town au city na linafaa kwa eneo mahususi linalowakataa wajumbe; “ule” hurejelea mji uliotajwa katika muktadha.
theological_decisions:
- issue: Maana ya “siku ya hukumu”
  choice: Imetafsiriwa kama siku ya hukumu ya Mungu bila kufafanua zaidi wakati au mfumo wake wa kimafundisho.
  alternative: Wakati wa hukumu kwa maana ya jumla.
  rationale: Muktadha na usemi wa Kigiriki unaelekea kwenye hukumu ya mwisho, lakini tafsiri inahifadhi kiwango cha maelezo kilichomo katika aya yenyewe.
- issue: Ulinganisho wa hukumu kwa Sodoma na Gomora na mji ule
  choice: “Nafuu zaidi” inadumisha tofauti ya kiwango cha kustahimilika kwa hukumu.
  alternative: “Yenye kuvumilika zaidi.”
  rationale: Matini inalinganisha uzito wa hali katika siku ya hukumu bila kueleza kwa kina msingi au namna ya viwango hivyo; tafsiri haiongezi maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi umewekwa wa asili katika Kiswahili huku ukidumisha “nchi ya Sodoma na Gomora” na ulinganisho wa Kigiriki.
