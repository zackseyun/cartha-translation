  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: sw
  text: Lakini watakapowakabidhi[a], msiwe na wasiwasi kuhusu jinsi au nini mtakachosema; kwa maana mtapewa mtakachosema wakati huo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watakapowakabidhi kwa wenye mamlaka.
    reason: Ufafanuzi wa maana ya παραδῶσιν katika mazingira haya ya kukamatwa na kupelekwa mbele ya watawala.
  - marker: b
    text: Muundo wa tendwa ‘mtapewa’ haumtajii mtoaji wazi hapa; mstari unaofuata unamtaja Roho kuwa ndiye anayesema kupitia kwao.
    reason: Kudumisha muundo tendwa wa Kigiriki huku ukionyesha ufafanuzi unaotolewa na muktadha wa karibu.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Lakini watakapo-
  rationale: ὅταν inaonyesha tukio la wakati ujao lisilo na wakati maalumu (‘watakapo-/wakati wowote watakapo-’), na δέ hapa ni kiunganishi chepesi cha mpito kinachofaa kutafsiriwa ‘Lakini.’
- source_word: παραδῶσιν ὑμᾶς
  choice: watakapowakabidhi
  rationale: παραδίδωμι hapa ina maana ya kuwakabidhi wengine, hasa wenye mamlaka, si lazima kuwasaliti. ‘Kuwakabidhi’ ni ya kawaida na inadumisha maana ya mazingira ya kisheria yenye uhasama.
- source_word: μὴ μεριμνήσητε
  choice: msihangaike
  rationale: μεριμνάω hapa inakataza wasiwasi kuhusu ushuhuda wao ujao. ‘Msihangaike’ ni Kiswahili cha sasa, cha kawaida na kinachoeleweka.
- source_word: πῶς ἢ τί λαλήσητε
  choice: kuhusu jinsi mtakavyosema au jambo mtakalosema
  rationale: Tafsiri hii inadumisha tofauti kati ya namna ya kusema (πῶς) na yaliyomo katika maneno (τί), pamoja na kiunganishi ‘au’ cha ἤ.
- source_word: δοθήσεται γὰρ ὑμῖν
  choice: kwa maana ... mtapewa
  rationale: Muundo tendwa wa wakati ujao unadumishwa bila kumtaja mtoaji ambaye hajatajwa wazi katika mstari huu.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: wakati huo
  rationale: Ingawa kwa neno moja moja ni ‘katika saa ile,’ hapa ὥρα humaanisha wakati unaohusika. ‘Wakati huo’ ni ya asili katika Kiswahili na inadumisha ahadi ya msaada kwa wakati unaohitajika.
- source_word: τί λαλήσητε
  choice: jambo la kusema
  rationale: Usemi huu wa kawaida unawasilisha wazi kwamba watapewa maudhui ya kusema, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
theological_decisions:
- issue: Mtendaji asiyetajwa katika muundo tendwa δοθήσεται
  choice: Kudumisha ‘mtapewa’ bila kumtaja Mungu au Roho katika matini kuu.
  alternative: ‘Mungu atawapa’ au ‘Roho atawapa.’
  rationale: Kigiriki hakimtaji mtoaji katika mstari huu. Mstari unaofuata unamtambulisha Roho kuwa ndiye anayesema kupitia kwao, kwa hiyo tafsiri haipaswi kutanguliza ufafanuzi huo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msihangaike’ ni ya kawaida kuliko ‘msiwe na wasiwasi’ katika muundo huu, na ‘wakati huo’ ni ya asili zaidi kuliko tafsiri ya moja kwa moja ‘katika saa ile.’
