  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: sw
  text: Kwa hiyo, kila mtu atakayenikiri mbele ya watu, mimi pia nitamkiri[a] mbele ya Baba yangu aliye mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, Kigiriki kinasema, “nami pia nitakiri katika yeye,” au “kwa habari yake.” Hapa limetafsiriwa kwa Kiswahili cha kawaida kuwa “nitamkiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Kwa hiyo, kila mtu atakaye-
  rationale: Muundo huu una maana ya ujumla inayojumuisha kila mtu; “Kwa hiyo” inadumisha uhusiano wa kimantiki na maneno yaliyotangulia.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: atakayenikiri
  rationale: 'Kitenzi ὁμολογέω katika muktadha huu kina maana ya kumkiri au kumtambua Yesu waziwazi. Ingawa Kigiriki kina kihusishi ἐν, Kiswahili cha asili hutumia yambwa moja kwa moja: “kunikiri.”'
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: ἀνθρώπων hapa linawarejelea wanadamu kwa ujumla. “Watu” ni tafsiri sahihi na ya kawaida ya Kiswahili bila kupunguza maana ya rejeleo la Kigiriki.
- source_word: ὁμολογήσω κἀγὼ
  choice: mimi pia nitamkiri
  rationale: Kurudia “kiri” kunahifadhi ulinganifu wa makusudi kati ya kitendo cha mtu na jibu la Yesu; “mimi pia” linaonyesha msisitizo wa κἀγώ.
- source_word: ἐν αὐτῷ
  choice: nitamkiri
  rationale: Kiswahili kinahitaji yambwa moja kwa moja katika usemi huu. Hata hivyo, kihusishi cha Kigiriki ni cha pekee, hivyo maana yake ya karibu zaidi imeonyeshwa katika tanbihi.
- source_word: ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: mbele za Baba yangu aliye mbinguni
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili unaomaanisha kuwa katika uwepo wa mtu. “Aliye mbinguni” linatoa kwa lugha ya kawaida usemi wa Mathayo, ingawa οὐρανοῖς ni wingi katika Kigiriki.
theological_decisions:
- issue: Kumkiri Yesu hadharani na Yesu kumkiri mtu huyo kwa Baba
  choice: Kauli imetafsiriwa kama ahadi ya Yesu ya kumkiri mtu anayemkiri yeye, bila kuongeza wakati au mfumo maalumu wa kiteolojia.
  alternative: Kuitafsiri waziwazi kuwa tukio la hukumu ya mwisho, au kuwa kauli inayohusu tu ufuasi wa sasa.
  rationale: Aya yenyewe inasema kwamba Yesu atamkiri mtu huyo mbele za Baba, lakini haitaji wazi wakati wa tukio hilo wala kueleza utaratibu mpana wa wokovu au hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kumkiri” limehifadhiwa katika sehemu zote mbili ili kuonyesha uwiano wa kauli ya Kigiriki; “watu” linaonyesha rejeleo la jumla la ἀνθρώπων.
