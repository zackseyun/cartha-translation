source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: sw
  text: “Msidhani kwamba nilikuja kuleta amani duniani[a]. Sikuja kuleta amani, bali upanga[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimekuja” badala ya “nilikuja.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “upanga”; katika muktadha, picha hii inaelekeza kwenye mgawanyiko unaotokea, wala si kuhimiza matumizi ya nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Msidhani
  rationale: Muundo wa μή pamoja na kitenzi cha hali tegemezi una nguvu ya katazo. ‘Msidhani’ ni Kiswahili cha kawaida, cha moja kwa moja, na kinaelekezwa kwa wingi kama ilivyo katika Kigiriki.
- source_word: ἦλθον
  choice: nilikuja / Sikuja
  rationale: Wakati uliopita wa Kigiriki hapa unaeleza kuja kwa Yesu kwa kusudi fulani. ‘Nilikuja’ na ukanushi wake ‘Sikuja’ ni wa kawaida na huhifadhi usambamba wa sentensi.
- source_word: βαλεῖν
  choice: kuleta
  rationale: Ingawa maana ya msingi ya βάλλω ni ‘kutupa,’ katika muundo huu unaohusu amani na upanga, ‘kuleta’ huwasilisha kwa kawaida wazo la matokeo au kusudi bila kuleta picha isiyokusudiwa.
- source_word: εἰρήνην
  choice: amani
  rationale: ‘Amani’ ni kisawe cha kawaida na sahihi cha εἰρήνη katika muktadha huu.
- source_word: ἐπὶ τὴν γῆν
  choice: duniani
  rationale: γῆ hapa ina maana pana ya dunia, si lazima eneo maalumu la ardhi. ‘Duniani’ ni usemi wa asili katika Kiswahili na huhifadhi upeo huo mpana.
- source_word: ἀλλὰ
  choice: bali
  rationale: ‘Bali’ huonyesha kwa wazi pingamizi kali kati ya amani na upanga katika mtindo wenye heshima.
- source_word: μάχαιραν
  choice: upanga
  rationale: Neno μάχαιρα linamaanisha upanga au silaha fupi yenye makali. ‘Upanga’ huhifadhi picha halisi ya chanzo badala ya kuitafsiri moja kwa moja kuwa ‘mgawanyiko.’
theological_decisions:
- issue: Ikiwa picha ya ‘upanga’ ilainishwe kuwa ‘mgawanyiko’ katika matini kuu
  choice: Kuhifadhi ‘upanga’ katika matini kuu
  alternative: mgawanyiko
  rationale: Kigiriki kinasema wazi μάχαιραν, ‘upanga.’ Muktadha unaofuata unaonyesha athari ya mgawanyiko, lakini tafsiri haipaswi kuondoa picha hiyo wala kutatua mvutano wa kitheolojia ndani ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msidhani,’ ‘duniani,’ na ‘bali upanga’ ni maneno yanayoeleweka kwa urahisi huku yakihifadhi usambamba, ukali, na picha ya matini ya Kigiriki.
