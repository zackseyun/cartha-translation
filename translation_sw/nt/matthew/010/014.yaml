  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: sw
  text: Na yeyote asiyewapokea wala kusikiliza maneno yenu,[a] mnapotoka katika nyumba hiyo au mji huo,[b] yakung'uteni mavumbi kutoka miguuni mwenu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala kusikia maneno yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nyumba hiyo au jiji hilo.”
    reason: lexical_alternative
  - marker: c
    text: Kukung'uta mavumbi kutoka miguuni kulikuwa tendo la kiishara la kujitenga na pia la hukumu dhidi ya walioukataa ujumbe.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: yeyote asiye-
  rationale: Muundo huu una maana ya jumla isiyobainisha mtu fulani, yaani ‘yeyote ambaye hata-’; Kiswahili ‘yeyote asiye-’ huwasilisha maana hiyo kwa kawaida.
- source_word: δέξηται ὑμᾶς
  choice: asiyewapokea
  rationale: ‘Kupokea’ huhifadhi upana wa δέχομαι, unaoweza kujumuisha kuwakaribisha wajumbe na kuukubali utume wao bila kufafanua kupita kiasi.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: wala kusikiliza maneno yenu
  rationale: ‘Kusikiliza’ hapa ni ya kawaida kuliko ‘kusikia’ kwa kuwa muktadha unahusu kuitikia ujumbe; ‘maneno yenu’ huhifadhi λόγους ὑμῶν bila kuongeza wazo la kutii.
- source_word: ἐξερχόμενοι ἔξω
  choice: mtakapotoka
  rationale: 'Kitenzi hiki huonyesha kitendo kinachoambatana na amri kuu: watoke mahali hapo kisha wafanye ishara iliyoamriwa. ‘Mtakapotoka’ ni fasaha na cha kawaida.'
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: katika nyumba hiyo au mji huo
  rationale: ‘Nyumba hiyo au mji huo’ huhifadhi rejeo mahususi la ἐκείνης. ‘Mji’ linaweza kutaja makazi ya ukubwa mbalimbali na halilazimishi maana ya jiji kubwa.
- source_word: ἐκτινάξατε
  choice: yakung'uteni
  rationale: ‘Kukung'uta’ huwasilisha kuondoa mavumbi kwa kuyatikisa, na hivyo kuhifadhi tendo halisi na lenye nguvu la amri ya Kigiriki.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: mavumbi kutoka miguuni mwenu
  rationale: ‘Mavumbi’ ni kisawe mahususi cha κονιορτός, na ‘kutoka miguuni mwenu’ huonyesha chanzo ambako yanaondolewa.
theological_decisions:
- issue: Ishara ya hukumu dhidi ya wanaowakataa wanafunzi na ujumbe wao
  choice: Kudumisha amri halisi ‘yakung'uteni mavumbi kutoka miguuni mwenu’ katika matini kuu
  alternative: Kuongeza ‘kuwa ushuhuda dhidi yao’ au kufasiri moja kwa moja kuwa ‘waacheni chini ya hukumu’
  rationale: Aya yenyewe inatoa tendo la kiishara bila kulifafanua wazi. Tafsiri haiongezi maneno kutoka simulizi sambamba wala kuondoa mvutano wa kitheolojia; ufafanuzi mfupi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Na yeyote’ huhifadhi καί na nguvu ya jumla ya ὃς ἂν; ‘wala’ huonyesha uhusiano hasi wa μηδέ. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vipengele vinavyohusika.
