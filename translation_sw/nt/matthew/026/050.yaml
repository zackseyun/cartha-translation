  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: sw
  text: Lakini Yesu akamwambia, “Rafiki, fanya ulilokuja kufanya.”[a] Kisha wale watu wakamkaribia Yesu, wakamtia Yesu mikono, wakamkamata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rafiki, umekuja kwa ajili ya nini?” Maneno ya Kigiriki ni mafupi na yanaweza kueleweka kama swali.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Rafiki
  rationale: Ni neno la kumwita Yuda moja kwa moja. “Rafiki” ni la kawaida na lenye staha katika Kiswahili, lakini katika muktadha huu halilazimishi maana ya urafiki wa karibu.
- source_word: ἐφ’ ὃ πάρει
  choice: fanya ulilokuja kufanya
  rationale: Kirai cha Kigiriki kimefupishwa sana na kinaweza kueleweka kama kauli yenye nguvu ya ruhusa/amri au kama swali. Tafsiri kuu inaonyesha kusudi la kuja kwa Yuda bila kulifafanua kupita kiasi; uwezekano wa swali umehifadhiwa katika tanbihi.
- source_word: προσελθόντες
  choice: wakamkaribia Yesu
  rationale: Kitenzi hiki kinaonyesha wale waliokuja kumkamata wakisogea karibu na Yesu; muundo huu ni wa kawaida katika simulizi la Kiswahili.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: wakamkamata
  rationale: Nahau hii inaonyesha kumwekea mtu mikono kwa nguvu ili kumtia chini ya mamlaka yao. “Wakamkamata” huwasilisha tendo hilo kwa Kiswahili cha kawaida bila kutegemea nahau isiyo ya asili.
- source_word: ἐκράτησαν αὐτόν
  choice: kumshikilia
  rationale: κρατέω hapa ina maana ya kumshika kwa nguvu na kutomwachilia. “Kumshikilia” hutofautisha tendo hili na hatua iliyotangulia ya kumkamata na huepuka kuongeza waziwazi maana ya kisheria ya ‘kumtia mbaroni.’
- source_word: δὲ
  choice: Lakini
  rationale: δέ huleta badiliko au utofauti mdogo kati ya tendo la Yuda na jibu la Yesu; “Lakini” linafaa katika mtiririko huu.
theological_decisions:
- issue: Maana ya maneno ya Yesu kwa Yuda
  choice: “Rafiki, fanya ulilokuja kufanya.”
  alternative: “Rafiki, umekuja kwa ajili ya nini?”
  rationale: Maneno ya Kigiriki ni mafupi na yana utata halisi wa kisarufi. Tafsiri kuu inadumisha mvutano wa jibu la Yesu bila kulifanya la upole kupita kiasi wala la hukumu kupita kiasi, huku tanbihi ikihifadhi uwezekano wa kuyasoma kama swali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vitenzi vya simulizi kwa ‘-ka-’ umechaguliwa ili kutoa mfululizo wa matendo kwa njia ya asili. Tanbihi imewekwa mara tu baada ya maneno ya Yesu, ambako utata wa chanzo unatokea.
