  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: sw
  text: Petro akamwambia, “Hata ikinibidi kufa pamoja nawe, sitakukana kamwe[a].” Wanafunzi wote pia wakasema vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika sitakukana.” Kigiriki kimetumia kanusho lenye mkazo mkubwa (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa λέγει ni wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida umbo la mfululizo la wakati uliopita. Kiambishi -mw- kinawakilisha αὐτῷ kwa njia ya kawaida na fasaha.
- source_word: Κἂν δέῃ με
  choice: Hata ikinibidi
  rationale: κἄν inaleta sharti la kukubali uwezekano, na δέῃ huonyesha ulazima. ‘Hata ikinibidi’ ni usemi wa kawaida unaohifadhi maana zote mbili.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: kufa pamoja nawe
  rationale: ‘Pamoja nawe’ huonyesha wazi kuandamana kunakodokezwa na σύν bila kuongeza maana nyingine.
- source_word: οὐ μή σε ἀπαρνήσομαι
  choice: sitakukana kamwe
  rationale: οὐ μή ni kanusho lenye mkazo mkubwa. ‘Kamwe’ pamoja na umbo hasi la kitenzi huhifadhi msisitizo huo; ‘kukana’ linafaa katika muktadha wa Petro kukataa uhusiano wake na Yesu.
- source_word: ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν
  choice: Wanafunzi wote pia wakasema vivyo hivyo
  rationale: ‘Vivyo hivyo’ huwakilisha ὁμοίως, ‘pia’ huonyesha καί, na ‘wanafunzi wote’ hudumisha πάντες οἱ μαθηταί bila kuongeza kimilikishi kisichotajwa wazi.
theological_decisions:
- issue: Nguvu ya kauli ya Petro kwamba hatamkana Yesu
  choice: sitakukana kamwe
  alternative: hakika sitakukana
  rationale: Muundo οὐ μή unaonyesha kanusho la baadaye lenye mkazo. Tafsiri kuu inahifadhi uhakika mkubwa wa Petro bila kueleza au kupunguza mvutano kati ya kauli yake na kukana kwake baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Umbo la masimulizi ‘akamwambia’ na ‘wakasema’ linafuata mtiririko wa kawaida wa Kiswahili, huku msisitizo wa Kigiriki ukihifadhiwa kwa ‘kamwe’.
