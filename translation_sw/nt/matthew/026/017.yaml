  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: sw
  text: Siku ya kwanza ya Sikukuu ya Mikate Isiyotiwa Chachu[a], wanafunzi walimjia Yesu wakisema, “Unataka tukuandalie wapi ili ule Pasaka[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yanafuata moja kwa moja usemi wa Kiyunani, “siku ya kwanza ya Mikate Isiyotiwa Chachu.” Masuala ya mpangilio wa matukio ya Pasaka hayapaswi kuamuliwa kwa tafsiri pekee.
    reason: cultural_note
  - marker: b
    text: Au, kwa uwazi zaidi, “mlo wa Pasaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Siku ya kwanza ya Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Kirai cha wakati Τῇ πρώτῃ kimetafsiriwa kwa kawaida kama “Siku ya kwanza.” τῶν ἀζύμων ni jina la kipindi cha sikukuu; kuongeza “Sikukuu” kunafanya rejeo hilo lieleweke kwa Kiswahili bila kubadili mpangilio wa wakati wa Kiyunani. δέ ni kiunganishi hafifu, na hakihitaji neno tofauti katika sentensi hii ya Kiswahili.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: wanafunzi walimjia Yesu
  rationale: προσέρχομαι humaanisha kumjia au kumkaribia mtu. “Walimjia Yesu” ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa tendo, huku “wanafunzi” ikitafsiri οἱ μαθηταί bila kuongeza kimilikishi kisichotajwa wazi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Umbo la kushiriki linaonyesha kitendo kinachoandamana na kumjia Yesu. “Wakisema” huhifadhi uhusiano huo bila kulifafanua zaidi kama “wakamwuliza.”
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Unataka tukuandalie wapi
  rationale: θέλεις huonyesha kutaka; subjunktivi ya nafsi ya kwanza wingi ἑτοιμάσωμεν ni swali la mashauriano. “Tukuandalie” pia huhifadhi σοι, yaani maandalizi yanayofanywa kwa ajili ya Yesu.
- source_word: φαγεῖν τὸ πάσχα
  choice: ili ule Pasaka
  rationale: φαγεῖν ni kusudi la maandalizi, nalo limeonyeshwa kwa “ili ule.” πάσχα inaweza kurejelea sikukuu au mlo wake; “Pasaka” huhifadhi upana huo, na muktadha wa kula unaonyesha kwamba mlo unahusika.
theological_decisions:
- issue: Kauli ya wakati kuhusu siku ya kwanza ya Mikate Isiyotiwa Chachu na mlo wa Pasaka
  choice: Kuhifadhi moja kwa moja kauli “Siku ya kwanza ya Sikukuu ya Mikate Isiyotiwa Chachu.”
  alternative: Kufafanua kama “siku iliyotangulia Sikukuu ya Mikate Isiyotiwa Chachu” au “siku ya kwanza ya Pasaka.”
  rationale: Kiyunani chenyewe kinasema “siku ya kwanza ya [Mikate] Isiyotiwa Chachu.” Tafsiri haipaswi kutatua kwa ulinganishaji mjadala wa mpangilio wa matukio ya Pasaka katika Injili.
- issue: Maana ya τὸ πάσχα katika muktadha wa kula
  choice: Kutumia “Pasaka” katika matini na kueleza uwezekano wa “mlo wa Pasaka” katika tanbihi.
  alternative: Kutafsiri moja kwa moja “mlo wa Pasaka.”
  rationale: Muktadha unaelekeza kwenye mlo, lakini neno πάσχα lenyewe linaweza kutaja Pasaka kwa mapana zaidi. Matini kuu inahifadhi utata huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Walimjia Yesu wakisema” huhifadhi mtiririko wa Kiyunani kwa lugha ya kawaida; “tukuandalie” ni muundo mfupi na wa asili unaobeba maana ya kufanya maandalizi kwa ajili ya Yesu.
