  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: sw
  text: Ndipo akawaambia, “Nafsi yangu ina huzuni nyingi[a] kiasi cha kufa.[b] Kaeni hapa na mkeshe pamoja nami.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imehuzunika sana” au “imelemewa sana na huzuni.”
    reason: lexical_alternative
  - marker: b
    text: Au “hata kufa” au “hadi kufa.”
    reason: lexical_alternative
  - marker: c
    text: Au “mkae macho pamoja nami.” Neno la Kigiriki linaweza kumaanisha kutolala na pia kukaa macho na kuwa waangalifu.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiunganishi hiki kinaonyesha hatua inayofuata katika simulizi; “ndipo” ni cha kawaida na chenye mtiririko mzuri katika Kiswahili.
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati wa simulizi wa Kiswahili unasomeka kwa uasilia zaidi kwa “akawaambia” bila kubadili mpangilio wa tukio.
- source_word: Περίλυπός
  choice: imehuzunika sana
  rationale: Neno hili linaonyesha huzuni nzito sana au dhiki ya ndani. Kauli hii ni ya sasa, wazi, na yenye uzito bila kuongeza maana isiyokuwamo.
- source_word: ἡ ψυχή μου
  choice: Nafsi yangu
  rationale: “Nafsi” linahifadhi nomino ya Kigiriki ψυχή na kueleza mateso ya ndani ya Yesu bila kuifanya sentensi kuwa dai maalumu kuhusu muundo wa mwanadamu.
- source_word: ἕως θανάτου
  choice: kiasi cha kufa
  rationale: Kauli hii inaonyesha ukali wa huzuni unaofikia mpaka wa kifo; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha nguvu ya msemo.
- source_word: μείνατε ὧδε
  choice: Kaeni hapa
  rationale: Amri inawataka wanafunzi wabaki mahali hapo. “Kaeni hapa” ni ya asili zaidi katika muktadha huu kuliko “bakieni hapa,” huku maana ikihifadhiwa.
- source_word: γρηγορεῖτε
  choice: mkeshe
  rationale: “Kukesha” kunaweza kumaanisha kutolala na pia kuendelea kuwa macho na waangalifu; hivyo kunafaa muktadha wa Gethsemane.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Kauli hii inaonyesha kuandamana na Yesu, na “pamoja nami” ni ya asili na yenye uzito unaofaa.
theological_decisions:
- issue: Tafsiri ya ψυχή katika kauli ya Yesu
  choice: Nafsi yangu
  alternative: Nimehuzunika sana
  rationale: Nomino iliyo wazi katika Kigiriki imehifadhiwa ili kuonyesha undani wa mateso ya ndani ya Yesu, bila kulazimisha fundisho maalumu kuhusu nafsi na mwili.
- issue: Nguvu ya γρηγορεῖτε katika muktadha
  choice: mkeshe
  alternative: mkae macho; muwe waangalifu
  rationale: Amri hii inaweza kuhusisha kutolala na kuwa macho kiroho. “Mkeshe” inahifadhi maana zote kwa kiwango kizuri, huku tanbihi ikibainisha uwezekano huo.
- issue: Maana ya ἕως θανάτου
  choice: kiasi cha kufa
  alternative: hata kufa
  rationale: Tafsiri kuu inahifadhi wazo la huzuni iliyofikia kiwango cha kifo bila kuamua kama msemo huo unamaanisha chanzo cha kifo au ukomo wa ukali wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ina mtiririko wa kawaida wa simulizi; “nafsi,” “kiasi cha kufa,” na “mkeshe” zinadumisha uzito wa kauli bila kuwa za kizamani kupita kiasi.
