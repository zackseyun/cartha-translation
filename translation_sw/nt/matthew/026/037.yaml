  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: sw
  text: Akawachukua Petro na wana wawili wa Zebedayo pamoja naye, akaanza kuhuzunika na kufadhaika sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kuwa na huzuni na kuwa na dhiki sana.”
    reason: Mbadala wa kileksika wa λυπεῖσθαι na ἀδημονεῖν; huhifadhi tofauti kati ya huzuni na dhiki kali ya ndani.
lexical_decisions:
- source_word: παραλαβὼν
  choice: Akawachukua ... aende nao
  rationale: Kirai hiki kinaonyesha kwamba Yesu aliwachukua hawa wanafunzi waliochaguliwa ili waende pamoja naye. ‘Aende nao’ huifanya maana hiyo iwe wazi na ya kawaida katika Kiswahili bila kubadili mhusika au tendo.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: wale wana wawili wa Zebedayo
  rationale: Huhifadhi utambulisho uliotolewa moja kwa moja katika Kigiriki bila kuongeza majina ya Yakobo na Yohana, ambayo hayatajwi katika mstari huu.
- source_word: ἤρξατο
  choice: akaanza
  rationale: Huhifadhi wazi maana ya kuanza kwa hali iliyoelezwa na vitenzi vinavyofuata.
- source_word: λυπεῖσθαι
  choice: kuhuzunika
  rationale: Kitenzi hiki kinaeleza kupata huzuni au majonzi. ‘Kuhuzunika’ ni cha kawaida, chenye uzito unaofaa, na hakipunguzi uhalisi wa mateso ya Yesu.
- source_word: ἀδημονεῖν
  choice: kufadhaika sana
  rationale: Neno hili linaonyesha dhiki kali ya ndani au mfadhaiko mkubwa. ‘Kufadhaika sana’ hutofautisha nguvu yake na ‘kuhuzunika’ bila kuongeza wazo la kukata tamaa ambalo haliko wazi katika Kigiriki.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Viunganishi vinaendeleza mkusanyiko wa watu na wa hali mbili za kihisia kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Hali ya kihisia ya Yesu kwa kuzingatia elimu kuhusu Kristo
  choice: Kutafsiri vitenzi vyote viwili kama huzuni na mfadhaiko halisi wa kibinadamu
  alternative: Kupunguza ukali wa maneno ili kuficha udhaifu wa kihisia, au kuyaongeza hadi kumaanisha hofu kuu au kukata tamaa
  rationale: Kigiriki kinaonyesha wazi mateso halisi ya kihisia ya Yesu. Tafsiri inahifadhi ubinadamu wake kamili na uzito wa tukio bila kupunguza maneno wala kuyafanya yadokeze kukata tamaa kusikothibitishwa na matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye ‘aka-’ unafaa mfululizo wa matendo, na ‘wana wawili wa Zebedayo’ huhifadhi usemi wa chanzo badala ya kuongeza majina yasiyokuwamo katika mstari.
