base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: sw
  text: Ndipo Yuda, yule aliyekuwa akimsaliti, akajibu akasema, “Hakika si mimi, Rabi?” Yesu akamwambia, “Wewe mwenyewe umesema hivyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδιδοὺς
  choice: aliyekuwa akimsaliti
  rationale: Katika muktadha huu kitenzi kinamaanisha kumkabidhi Yesu kwa maadui zake kwa usaliti; hali ya kuendelea inaakisiwa kwa ‘aliyekuwa akimsaliti.’
- source_word: Μήτι ἐγώ εἰμι
  choice: Hakika si mimi
  rationale: Μήτι huanzisha swali linalotarajia jibu la kukataa; Kiswahili hiki kinaonyesha matarajio hayo bila kuondoa hali ya swali.
- source_word: ῥαββί
  choice: Rabi
  rationale: Cheo cha Kiyahudi kinahifadhiwa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: Σὺ εἶπας
  choice: Wewe mwenyewe umesema hivyo
  rationale: Huhifadhi jibu la kifumbo la Kigiriki, ambalo linamrudishia msemaji maneno yake bila kulibadili kuwa kauli ya moja kwa moja zaidi.
theological_decisions:
- issue: Nguvu ya jibu la Yesu, Σὺ εἶπας
  choice: Wewe mwenyewe umesema hivyo
  alternative: Ndiyo, ni wewe
  rationale: Matini ya Kigiriki haitumii jibu la moja kwa moja ‘ndiyo’; tafsiri iliyochaguliwa huhifadhi mkazo na mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Akamwambia’ imetumiwa badala ya tafsiri ngumu ya kihalisi ya wakati wa sasa wa kihistoria λέγει.
