  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: sw
  text: Baada ya muda mfupi, wale waliokuwa wamesimama hapo wakamkaribia Petro na kumwambia, “Hakika wewe pia ni mmoja wao, maana hata namna yako ya kusema inakutambulisha.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lafudhi yako inakuweka wazi.” Neno la Kigiriki λαλιά linaweza kumaanisha usemi, namna ya kusema, au lafudhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Baada ya muda mfupi
  rationale: Ni usemi wa kawaida wa wakati unaoonyesha kwamba kipindi kifupi kilipita kabla ya tukio lililofuata.
- source_word: δὲ
  choice: —
  rationale: Hapa ni kiunganishi hafifu kinachoendeleza simulizi; mtiririko wa Kiswahili hauhitaji neno tofauti kukiwakilisha.
- source_word: προσελθόντες
  choice: wakamkaribia
  rationale: Inaonyesha watu hao wakisogea kuelekea kwa Petro; muundo wa mfululizo wenye ‘waka-’ ni wa asili katika simulizi la Kiswahili.
- source_word: οἱ ἑστῶτες
  choice: wale waliokuwa wamesimama hapo
  rationale: Inahifadhi maana ya moja kwa moja ya watu waliokuwa wamesimama karibu bila kuwaletea utambulisho usiotajwa wazi.
- source_word: εἶπον τῷ Πέτρῳ
  choice: kumwambia Petro
  rationale: Ni tafsiri ya kawaida na ya wazi ya kitenzi cha kusema pamoja na mtendewa.
- source_word: Ἀληθῶς
  choice: Hakika
  rationale: Inaonyesha uthibitisho wenye nguvu katika shtaka lao na ni ya asili katika Kiswahili sanifu.
- source_word: καὶ σὺ
  choice: wewe pia
  rationale: Inahifadhi msisitizo kwamba Petro anahusishwa pamoja na wale wengine.
- source_word: ἐξ αὐτῶν
  choice: mmoja wao
  rationale: Ni Kiswahili cha asili kinachoonyesha kuwa mtu ni wa kundi hilo.
- source_word: καὶ γὰρ
  choice: maana hata
  rationale: ‘Maana’ inatoa sababu ya dai lao, huku ‘hata’ ikihifadhi nguvu ya καί inayotilia mkazo ushahidi wa namna yake ya kusema.
- source_word: ἡ λαλιά σου
  choice: namna yako ya kusema
  rationale: Neno λαλιά linaweza kurejelea usemi, namna ya kusema, au lafudhi. Chaguo hili ni la asili na linahifadhi upana huo kuliko kulibana kuwa ‘lafudhi’ pekee.
- source_word: δῆλόν σε ποιεῖ
  choice: inakutambulisha
  rationale: Katika muktadha, namna Petro anavyosema inamfanya atambulike kuwa wa kundi hilo. Tafsiri hii ni ya asili bila kuongeza maelezo kuhusu asili yake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa maandiko. ‘Namna yako ya kusema’ imetumiwa katika matini kuu ili kuhifadhi upeo wa λαλιά; mbadala wenye ‘lafudhi’ umetolewa katika tanbihi.
