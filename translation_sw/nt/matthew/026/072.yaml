  text: 'Akakana tena kwa kiapo: “Simjui mtu huyo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi cha masimulizi kinaunganisha tendo hili na lililotangulia kwa mtiririko wa kawaida wa Kiswahili bila kuongeza uzito usio katika Kigiriki.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa tendo la Petro la kukana, kwa lugha ya kawaida na ya moja kwa moja.
- source_word: ἠρνήσατο
  choice: akakana
  rationale: Kitenzi hiki humaanisha kukana au kutambua kuwa jambo si kweli. Kiswahili kinaweza kuacha yambwa kwa kawaida kwa kuwa yaliyokanwa yanafuata kama usemi wa moja kwa moja.
- source_word: μετὰ ὅρκου
  choice: kwa kiapo
  rationale: Huonyesha kwamba kukana kwake kuliambatana na kiapo. Usemi huu huepuka kudokeza mazingira rasmi ya mahakama.
- source_word: ὅτι
  choice: akisema,
  rationale: Neno hili linatanguliza yaliyomo katika kukana. Katika Kiswahili, “akisema” huingiza kwa uwazi na kawaida usemi wa moja kwa moja.
- source_word: Οὐκ οἶδα
  choice: Simjui
  rationale: Ni tafsiri ya kawaida ya kauli hasi kuhusu kumfahamu mtu, ikihifadhi nafsi ya kwanza na wakati uliopo.
- source_word: τὸν ἄνθρωπον
  choice: mtu huyo
  rationale: Katika muktadha huu ἄνθρωπος humrejelea mwanamume fulani. “Mtu huyo” ni usemi wa kawaida wa Kiswahili na huhifadhi lugha ya Petro ya kujitenga bila kuweka jina la Yesu.
theological_decisions:
- issue: Mrejelewa wa “τὸν ἄνθρωπον” katika kukana kwa Petro
  choice: Kudumisha usemi “mtu huyo” badala ya “yeye” au “Yesu.”
  alternative: “yeye” au “Yesu”
  rationale: Kigiriki kinatumia wazi neno “mtu,” ambalo linaonyesha lugha ya Petro ya kujitenga katika wakati wa kukana. Kuweka “Yesu” kungeingiza ufafanuzi katika matini na kupunguza nguvu ya kimtindo ya kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Akakana tena kwa kiapo” ni wa masimulizi na unasomeka kwa urahisi; “Simjui mtu huyo” ni wa kawaida bila kuwa wa mazungumzo kupita kiasi. Hakuna tanbihi iliyohitajika kwa sababu Kiswahili hakilazimishi kuongeza yambwa kama Kiingereza “it,” hivyo utata wa kimuundo uliotajwa katika tanbihi ya Kiingereza haujitokezi kwa namna ileile.
