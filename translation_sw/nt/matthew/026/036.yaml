  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: sw
  text: Kisha Yesu akafika pamoja nao mahali palipoitwa Gethsemane, akawaambia wanafunzi wake, “Kaeni hapa wakati ninapoenda kule kusali.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἔρχεται
  choice: akaja
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili bila kupoteza mfuatano wa tukio.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: Huonyesha moja kwa moja kwamba Yesu aliandamana nao.
- source_word: χωρίον
  choice: mahali
  rationale: Neno hili linaweza kumaanisha eneo au sehemu ya ardhi; “mahali” huhifadhi upana wake bila kuingiza wazo la bustani kutoka Injili nyingine.
- source_word: λεγόμενον Γεθσημανί
  choice: palipoitwa Gethsemane
  rationale: Muundo wa kawaida na wa asili wa Kiswahili wa kutaja jina la mahali.
- source_word: λέγει τοῖς μαθηταῖς
  choice: akawaambia wanafunzi wake
  rationale: Wakati uliopita wa kisimulizi unasomeka kwa kawaida; “wake” hufafanua kwa asili kundi linalorejelewa na kibainishi cha Kigiriki katika muktadha.
- source_word: Καθίσατε αὐτοῦ
  choice: Kaeni hapa
  rationale: Wingi wa amri umehifadhiwa, na αὐτοῦ imetafsiriwa kwa maana yake ya mahali, “hapa.”
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Huhifadhi moja kwa moja maana ya kikomo cha muda ya usemi wa Kigiriki, na ni ya asili pia katika Kiswahili.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: niende kule kusali
  rationale: Muundo wa Kiswahili huwasilisha hatua ya kwenda na kusudi la kusali kwa urahisi, huku “kule” ikitofautishwa na “hapa.”
theological_decisions:
- issue: Asili ya Gethsemane
  choice: χωρίον limetafsiriwa “mahali.”
  alternative: “bustani”
  rationale: Mathayo anataja eneo au mahali tu; “bustani” lingeingiza maelezo yanayotolewa katika Yohana 18:1 badala ya kuhifadhi maneno ya Mathayo mwenyewe.
- issue: Uhusiano wa ἕως οὗ na kitendo kinachofuata
  choice: “mpaka niende kule kusali”
  alternative: “wakati ninapoenda kule kusali”
  rationale: “Mpaka” huhifadhi kwa karibu zaidi usemi wa Kigiriki wenye wazo la kikomo cha muda. Katika Kiswahili sentensi hiyo ni ya kawaida, hivyo hakuna haja ya kuibadili kuwa “wakati.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Simulizi limetumia wakati uliopita wa kawaida badala ya kuiga wakati wa sasa wa kihistoria wa Kigiriki. Hakuna alama za tanbihi kwa kuwa tafsiri kuu ya “mpaka” tayari huhifadhi tofauti ya kimsamiati iliyohitaji tanbihi katika Kiingereza.
