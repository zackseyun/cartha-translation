translation:
  language: sw
  text: Baada ya kuimba sifa[a], wakatoka kuelekea Mlima wa Mizeituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuimba wimbo wa sifa.” Kitenzi cha Kigiriki kinaweza kumaanisha kuimba sifa kwa ujumla; pia kinaweza kurejelea kuimba wimbo wa sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: baada ya kuimba wimbo wa sifa
  rationale: Kirai hiki kinawasilisha tendo lililotangulia tendo kuu na maana ya kitenzi ὑμνέω ya kuimba sifa au nyimbo za sifa. ‘Wimbo wa sifa’ ni Kiswahili cha kawaida na chenye heshima, huku tanbihi ikihifadhi upana wa maana ya Kigiriki.
- source_word: ἐξῆλθον
  choice: wakatoka kwenda
  rationale: Kitenzi hiki humaanisha kutoka au kuondoka. ‘Wakatoka kwenda’ ni cha asili katika simulizi la Kiswahili na kinaonyesha kutoka mahali walipokuwa kuelekea mahali palipotajwa.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: kwenda kwenye Mlima wa Mizeituni
  rationale: Hili ni jina la mahali linalotambulika kwa Kiswahili. ‘Kwenye’ linaonyesha mwelekeo kuelekea eneo la mlima bila kulifanya jina hilo kuwa maelezo ya kawaida tu.
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi. ‘Nao’ huunganisha sentensi kwa njia ya asili na kuwarejelea wahusika bila kuongeza maana ya wakati isiyokuwamo wazi katika neno la Kigiriki.
