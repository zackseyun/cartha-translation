  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: sw
  text: Yesu alipokuwa bado akisema, tazama, Yuda, mmoja wa wale kumi na wawili, akaja, na pamoja naye umati mkubwa wenye panga na marungu[b], kutoka kwa makuhani wakuu na wazee wa watu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliotumwa na makuhani wakuu na wazee wa watu.” Kigiriki kinasema kihalisi zaidi, “kutoka kwa makuhani wakuu na wazee wa watu.”
    reason: alternative_reading
  - marker: b
    text: Au, “vijiti.” Neno la Kigiriki humaanisha kihalisi vipande vya mti, ambavyo hapa huenda vilitumika kama marungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Yesu alipokuwa bado anasema
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tendo jingine lilipotokea. Jina “Yesu” linaweka wazi rejeo la kiwakilishi bila kubadili maana.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni kiashiria cha kisimulizi kinachovuta fikira na kuhifadhi msisitizo na uhai wa tukio.
- source_word: Ἰούδας
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: εἷς τῶν δώδεκα
  choice: mmoja wa wale kumi na wawili
  rationale: Huhifadhi usemi wa sehemu ya kundi na kuonyesha kwamba ni wale wanafunzi kumi na wawili waliotajwa tayari.
- source_word: ἦλθεν
  choice: akaja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika mtiririko wa kisimulizi.
- source_word: ὄχλος πολὺς
  choice: umati mkubwa
  rationale: Huhifadhi maana ya wingi bila kuongeza wazi dhana ya fujo ambayo haimo katika nomino yenyewe.
- source_word: μετὰ μαχαιρῶν
  choice: wenye panga
  rationale: “Panga” ni neno pana na linaloeleweka kwa silaha zinazomaanishwa na μάχαιρα katika muktadha huu.
- source_word: καὶ ξύλων
  choice: na marungu
  rationale: Ingawa ξύλον kimsingi ni kipande cha mti au kuni, katika muktadha wa silaha wingi wake unaelekea kumaanisha marungu; tanbihi huhifadhi maana halisi zaidi.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: kutoka kwa makuhani wakuu na wazee wa watu
  rationale: Huhifadhi wazo la chanzo lililo katika ἀπό bila kuongeza kitenzi cha kutumwa, huku “makuhani wakuu” na “wazee wa watu” zikitoa vyeo na uhusiano wa kisarufi kwa uwazi.
theological_decisions:
- issue: Ikiwa itasemwa wazi kwamba umati ulikuwa umetumwa rasmi na viongozi
  choice: kutoka kwa makuhani wakuu na wazee wa watu
  alternative: uliotumwa na makuhani wakuu na wazee wa watu
  rationale: Muktadha unaashiria mamlaka au utume wao, lakini ἀπό yenyewe hutaja chanzo na haitumii kitenzi cha kutuma. Tafsiri kuu inahifadhi upeo huo wa maana, na tanbihi inatoa uwezekano wa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa ili mtiririko uwe wa kawaida kwa msomaji wa leo. “Tazama” limehifadhiwa kama kiashiria cha msisitizo wa kisimulizi. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika.
