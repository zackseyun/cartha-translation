  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: sw
  text: Mwana wa Adamu anaenda kama ilivyoandikwa kumhusu; lakini ole wake mtu yule ambaye Mwana wa Adamu anasalitiwa kupitia kwake.[a] Ingekuwa afadhali kwake kama mtu huyo asingalizaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anakabidhiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kusaliti” au, kwa maana ya moja kwa moja zaidi, “kukabidhi.” Hapa “anasalitiwa” limetumiwa kwa sababu muktadha unahusu hiana ya Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Inahifadhi jina la cheo lililozoeleka katika Biblia. Tofauti inayoletwa na μὲν...δέ inaonyeshwa kwa muundo wa kishazi cha kwanza ukifuatwa na ‘lakini’ katika kishazi cha pili, bila kuongeza neno lisilo la lazima.
- source_word: ὑπάγει
  choice: anaenda
  rationale: Inahifadhi hali ya wakati wa sasa na kutatua kwa kiasi kidogo iwezekanavyo maana ya kuondoka au kufa, ingawa muktadha unaelekea kwenye mateso na kifo cha Yesu.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: kama ilivyoandikwa kumhusu
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi maana ya jambo lililoandikwa na linalobaki kuwa na mamlaka.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: lakini ole wake mtu yule
  rationale: ‘Lakini’ inahifadhi utofautishaji wa δέ, na ‘ole wake’ inaleta uzito wa onyo na hukumu wa οὐαί. ‘Mtu yule’ inahifadhi rejeo maalumu na msisitizo wa ἐκεῖνος.
- source_word: δι’ οὗ
  choice: ambaye kwa njia yake
  rationale: Inawasilisha uhusika au njia bila kufanya Yuda kuwa sababu pekee ya matukio yote yanayofuata.
- source_word: παραδίδοται
  choice: anasalitiwa
  rationale: Katika muktadha wa kitendo cha Yuda, neno hili linaonyesha usaliti wa kimahusiano. Maana ya msingi ya ‘kutiwa mikononi’ imehifadhiwa katika tanbihi ili kutoficha upana wa kitenzi cha Kigiriki.
- source_word: καλὸν ἦν αὐτῷ
  choice: Ingekuwa afadhali kwake
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha jambo ambalo lingekuwa bora kwa mtu huyo katika hali ya kinyume na uhalisi.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: kama mtu huyo asingalizaliwa
  rationale: Inahifadhi hali ya kinyume na uhalisi pamoja na kurudiwa kwa ‘mtu huyo,’ bila kuongeza hitimisho la kiteolojia lisilotajwa na mstari.
theological_decisions:
- issue: Uhusiano kati ya kutimizwa kwa Maandiko na kuwajibika kwa msaliti
  choice: Tafsiri inahifadhi kwamba njia ya Mwana wa Adamu inalingana na yaliyoandikwa, huku msaliti akibaki chini ya tamko la ole.
  alternative: Kusisitiza mapenzi ya Mungu kwa namna inayopunguza uwajibikaji wa Yuda, au kusisitiza tendo la Yuda kwa namna inayodhoofisha kutimizwa kwa Maandiko.
  rationale: Kigiriki kinaweka kweli hizi mbili pamoja; tafsiri haiondoi mvutano huo wala kuufafanua kupita maandishi.
- issue: Uzito wa kauli kuhusu kutokuzaliwa
  choice: Kauli imetafsiriwa kama hukumu kali bila kuipanua kuwa fundisho maalumu kuhusu hatima ya mwisho ya Yuda.
  alternative: Kuichukulia kama kutia chumvi tu, au kuitumia kuthibitisha fundisho mahususi ambalo mstari hautamki moja kwa moja.
  rationale: Maneno ya Yesu yanahifadhiwa kwa uzito wake kamili, lakini tafsiri haiongezi hitimisho la kimfumo lisilosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ni wa asili bila kuondoa urudiaji, uzito wa hukumu, au mvutano wa kiteolojia uliomo katika Kigiriki.
