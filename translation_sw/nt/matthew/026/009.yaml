lexical_decisions:
- source_word: ἐδύνατο
  choice: kingeweza
  rationale: Kitenzi cha wakati uliopita pamoja na vitenzi visoukomo kinaonyesha uwezekano wa jambo ambalo halikutokea; hali ya masharti ya Kiswahili inatoa maana hiyo kwa kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza sababu inayoeleza malalamiko yaliyotangulia.
- source_word: τοῦτο
  choice: hiki
  rationale: Kiwakilishi cha kuonyesha kinarejelea kitu kilichotajwa kabla bila kuingiza nomino isiyopo katika mstari huu.
- source_word: πραθῆναι
  choice: kuuzwa
  rationale: Kitenzi kisoukomo cha kauli tendwa kina maana ya kitu kuuzwa.
- source_word: πολλοῦ
  choice: kwa bei kubwa
  rationale: Hii ni hali ya umilikishi inayotaja thamani au bei; tafsiri hii ni ya kawaida na haibainishi kiasi kisichotajwa.
- source_word: δοθῆναι
  choice: fedha hizo wakapewa
  rationale: Kwa kuwa kitu chenyewe hakiwezi kutolewa baada ya kuuzwa, Kiswahili cha kawaida hubainisha kwa usahihi kuwa mapato ya mauzo ndiyo ambayo yangetolewa; kauli tendwa inadumishwa katika 'wakapewa'.
- source_word: πτωχοῖς
  choice: maskini
  rationale: Kivumishi kilichotumika kama nomino kinamaanisha watu maskini kwa ujumla.
