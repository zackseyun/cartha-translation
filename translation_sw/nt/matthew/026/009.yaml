  text: Kwa maana hiki kingeweza kuuzwa kwa bei kubwa, na fedha zake zingepewa maskini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa fedha nyingi” au “kwa thamani kubwa.” Kigiriki kinatumia umilikishi wa bei.
