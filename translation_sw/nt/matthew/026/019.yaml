  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: sw
  text: Wanafunzi wakafanya kama Yesu alivyowaagiza, nao wakaandaa Pasaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlo wa Pasaka.” Neno la Kigiriki linalotafsiriwa “Pasaka” linaweza kutaja maadhimisho ya Pasaka kwa upana, kutia ndani mlo ulioandaliwa kwa ajili yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: wakafanya
  rationale: Pamoja na ὡς συνέταξεν, kitenzi hiki humaanisha kutenda kulingana na maagizo; “wakafanya” ni tafsiri ya kawaida na ya asili.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa μαθηταί katika Injili, likionyesha wale waliokuwa wakijifunza kutoka kwa Yesu na kumfuata.
- source_word: ὡς
  choice: kama
  rationale: 'Huonyesha ulinganifu wa kitendo chao na maagizo ya Yesu: walifanya kama alivyoagiza.'
- source_word: συνέταξεν
  choice: alivyowaagiza
  rationale: συντάσσω inaweza kumaanisha kuagiza au kuelekeza. “Alivyowaagiza” huhifadhi mamlaka ya Yesu na kufaa kwa muktadha wa maagizo yaliyotangulia bila kuongeza ukali usio lazima.
- source_word: ἡτοίμασαν
  choice: wakaandaa
  rationale: “Kuandaa” ni tafsiri ya moja kwa moja na ya kawaida ya ἑτοιμάζω katika muktadha wa kufanya matayarisho.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: πάσχα inaweza kutaja Pasaka kwa upana, pamoja na mlo wake. “Pasaka” huhifadhi upana wa neno la Kigiriki bila kulifanya mahsusi kuwa mlo au mwana-kondoo.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Maana pana ya τὸ πάσχα
  choice: Pasaka
  alternative: mlo wa Pasaka; mwana-kondoo wa Pasaka
  rationale: Katika muktadha, wanafunzi wanafanya matayarisho yanayohusiana na mlo, lakini Kigiriki hakibainishi kwa namna finyu kwamba ni mlo au mwana-kondoo. Tafsiri kuu huhifadhi upana huo, huku tanbihi ikifafanua uwezekano wa maana ya mlo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “wakafanya kama Yesu alivyowaagiza” ni wa asili na wazi; “nao wakaandaa” huendeleza mtiririko wa simulizi bila uzito usio wa lazima.
