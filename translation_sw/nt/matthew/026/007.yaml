translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Alabasta” limehifadhiwa kama jina la nyenzo ya chombo, huku tanbihi ikifafanua utofauti wa maana ya μύρον. Mfuatano wa vitenzi “akamjia … akayamimina” unafaa usimulizi wa Kiswahili na huhifadhi mwendo wa tukio.
