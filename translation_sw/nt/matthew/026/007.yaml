base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: sw
  text: Mwanamke mmoja akamjia akiwa ameshika chupa ya alabasta yenye mafuta ya kunukia ya thamani kubwa sana[a]. Akayamimina juu ya kichwa chake alipokuwa ameketi kwa kuegemea wakati wa kula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chupa ya alabasta yenye manukato ya bei ghali sana.” Neno la Kigiriki μύρον linaweza kumaanisha mafuta yenye harufu nzuri au marhamu, si manukato ya kisasa pekee.
    reason: lexical_alternative
  - marker: b
    text: Yaani, alikuwa katika mkao wa kawaida wa wakati huo wa kuegemea wakati wa kula.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: akamjia
  rationale: Huonyesha mwanamke akielekea kwa Yesu na kumfikia; “akamjia” ni usemi wa kawaida na wenye mwelekeo huo katika Kiswahili.
- source_word: γυνή
  choice: mwanamke mmoja
  rationale: Nomino haina kibainishi wala maelezo ya kumtambulisha; “mmoja” huonyesha kwamba anatajwa kwa mara ya kwanza bila kumwekea utambulisho usiotolewa na maandishi.
- source_word: ἔχουσα
  choice: akiwa ameshika
  rationale: Hueleza kwamba mwanamke alikuwa na chombo hicho mkononi au katika umiliki wake; katika tukio hili “ameshika” ni halisi na ya kawaida kuliko tafsiri kavu ya “akiwa na.”
- source_word: ἀλάβαστρον μύρου
  choice: chupa ya alabasta yenye mafuta ya kunukia
  rationale: ἀλάβαστρον ni chombo, mara nyingi chupa, kilichohusishwa na alabasta; μύρον ni mafuta yenye harufu nzuri au marhamu, si lazima manukato ya kisasa yaliyo kimiminika.
- source_word: βαρυτίμου
  choice: ya thamani kubwa sana
  rationale: Huhifadhi mkazo wa thamani ya juu sana, si maelezo hafifu ya kwamba kitu kilikuwa ghali tu.
- source_word: κατέχεεν
  choice: akayamimina
  rationale: Kitenzi kinaeleza kumimina kitu juu ya kingine; kiambishi “-ya-” kinarejelea mafuta.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: juu ya kichwa chake
  rationale: Hutoa wazi mahali mafuta yalipomiminwa na huhifadhi maana ya ἐπί pamoja na genitivi katika muktadha huu.
- source_word: ἀνακειμένου
  choice: alipokuwa amejiegemeza kula
  rationale: Kitenzi hiki kinaonyesha mkao wa kujiegemeza uliotumiwa wakati wa kula, wala si kuketi kwa namna ya kisasa kwenye kiti mezani.
