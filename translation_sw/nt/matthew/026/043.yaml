  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: sw
  text: Alipokuja tena, aliwakuta wamelala, kwa maana macho yao yalikuwa yamelemewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “macho yao yalikuwa mazito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Aliporudi tena
  rationale: Kirai hiki kinaonyesha kwamba Yesu alikuja kwao mara nyingine. Katika muktadha huu, “aliporudi tena” ni Kiswahili cha kawaida na huhifadhi mtiririko wa kisimulizi.
- source_word: εὗρεν αὐτοὺς
  choice: aliwakuta
  rationale: “Aliwakuta” huwasilisha maana ya εὗρεν katika matumizi ya kisimulizi na kuonyesha kwamba aliwakuta katika hali iliyofuata.
- source_word: καθεύδοντας
  choice: wamelala
  rationale: Huonyesha hali yao iliyokuwa ikiendelea Yesu alipowakuta, kwa lugha ya kawaida na ya sasa.
- source_word: ἦσαν γὰρ
  choice: kwa maana ... yalikuwa
  rationale: '“Kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ: uzito wa macho yao unaeleza kwa nini walikuwa wamelala.'
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: macho yao
  rationale: Hii ndiyo namna ya kawaida ya kuwasilisha umilikaji huu kwa Kiswahili.
- source_word: βεβαρημένοι
  choice: yalikuwa yamelemewa
  rationale: Huhifadhi hali iliyotokana na tendo inayoonyeshwa na kitenzi kishirikishi timilifu cha kutendwa, pamoja na taswira ya macho kulemewa na usingizi.
