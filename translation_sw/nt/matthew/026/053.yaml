  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: sw
  text: Au unafikiri kwamba siwezi kumwomba Baba yangu[a], naye mara moja atanipatia legioni zaidi ya kumi na mbili za malaika[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwita Baba yangu” au “kumsihi Baba yangu.”
    reason: lexical_alternative
  - marker: b
    text: Legioni ilikuwa kitengo kikubwa cha jeshi la Kiroma. Kauli hii inasisitiza nguvu kubwa mno ya mbinguni.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huendeleza karipio kwa kutoa changamoto mbadala ya kimantiki, kama ilivyo katika Kigiriki.
- source_word: δοκεῖς
  choice: unafikiri
  rationale: Ni usemi wa kawaida na wa moja kwa moja kwa swali hili la balagha.
- source_word: οὐ δύναμαι
  choice: siwezi
  rationale: Hueleza uwezo, si ruhusa wala utayari.
- source_word: παρακαλέσαι
  choice: kumwomba
  rationale: Katika muktadha huu ni kutoa ombi la msaada kwa Baba; neno hili ni la asili na halipunguzi maana kuwa mwito tu.
- source_word: τὸν πατέρα μου
  choice: Baba yangu
  rationale: Huhifadhi uhusiano wa Yesu na Baba katika rejeo la kimungu.
- source_word: παραστήσει μοι
  choice: ataniletea
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuwaleta na kuwaweka karibu naye ili wawe tayari kumsaidia; tanbihi inadokeza taswira halisi.
- source_word: ἄρτι
  choice: mara moja
  rationale: Huhifadhi msisitizo wa msaada kupatikana bila kuchelewa.
- source_word: πλείω δώδεκα
  choice: zaidi ya ... kumi na mawili
  rationale: Huhifadhi ulinganisho wa kiasi kinachozidi kumi na mbili.
- source_word: λεγιῶνας
  choice: majeshi
  rationale: Neno linaloeleweka kwa wasomaji wa kawaida; tanbihi inaeleza kwamba chanzo kinatumia kitengo kikubwa cha kijeshi cha Kiroma.
- source_word: ἀγγέλων
  choice: ya malaika
  rationale: Muktadha unahusu viumbe wa mbinguni, si wajumbe wa kibinadamu.
theological_decisions:
- issue: Kauli ya Yesu inahusu kutokuwa na uwezo, kutokuwa na ruhusa, au kutokuwa tayari kuomba msaada
  choice: siwezi kumwomba Baba yangu
  alternative: sitaki kumwomba Baba yangu
  rationale: δύναμαι hueleza uwezo. Tafsiri inadumisha kwamba Yesu alikuwa na uwezo wa kuomba msaada mkubwa wa mbinguni bila kudai kwamba alikuwa tayari kufanya hivyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Majeshi” ni wazi zaidi kuliko “legioni” katika matini kuu, huku tanbihi ikihifadhi taswira mahususi ya kijeshi ya Kirumi. Alama zote za tanbihi zimewekwa katika matini.
