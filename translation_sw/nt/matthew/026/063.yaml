  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: sw
  text: 'Lakini Yesu akaendelea kuwa kimya. Kuhani mkuu akamwambia, “Ninakuapisha kwa Mungu aliye hai[a]: tuambie kama wewe ndiye Masihi[b], Mwana wa Mungu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakuagiza kwa kiapo mbele za Mungu aliye hai.” Kigiriki kina kauli nzito ya kiapo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo.” Neno la Kigiriki Christos hapa linatumika kama cheo, yaani Mtiwa-Mafuta.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: akaendelea kuwa kimya
  rationale: Kauli ya wakati usiotimilika inaonyesha kwamba Yesu aliendelea kunyamaza; tafsiri hii inawasilisha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa cheo hicho cha juu cha ukuhani wa Kiyahudi katika muktadha huu wa mashtaka.
- source_word: Ἐξορκίζω σε
  choice: Ninakuapisha
  rationale: Katika muktadha huu kitenzi kina maana ya kumweka mtu chini ya kiapo au kumtaka ajibu kwa kiapo, si kutoa pepo. ‘Ninakuapisha’ ni fasaha, wazi, na huhifadhi uzito wa kauli hiyo.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: kwa Mungu aliye hai
  rationale: Kirai hiki kinamtaja Mungu kuwa msingi na shahidi wa kiapo; muundo huu ni wa kawaida katika Kiswahili na huhifadhi uzito wa ombi hilo.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: tuambie
  rationale: Baada ya kauli ya kuapisha, kirai hiki kinaeleza jambo linalodaiwa; ‘tuambie’ ni cha moja kwa moja na cha asili.
- source_word: ὁ χριστὸς
  choice: Masihi
  rationale: Hapa neno hilo linatumika kama cheo cha mtiwa-mafuta aliyetazamiwa, si kama jina la kawaida. ‘Masihi’ hudumisha muktadha wa matarajio ya Kiyahudi.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Tafsiri ya moja kwa moja huhifadhi dai la kikristolojia bila kulipanua au kulidhoofisha.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Lakini Yesu
  rationale: Kiunganishi δέ kinaonyesha utofauti mdogo kati ya mashitaka yaliyotangulia na ukimya wa Yesu; ‘Lakini’ huwasilisha mgeuko huo kwa uwazi.
theological_decisions:
- issue: Tafsiri ya Χριστός katika swali la moja kwa moja kuhusu utambulisho wa Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Kwa kuwa ὁ χριστός hapa ni cheo cha mtiwa-mafuta aliyetazamiwa, ‘Masihi’ linaweka wazi kazi yake kama cheo. ‘Kristo’ limehifadhiwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- issue: Nguvu ya kauli Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Kauli nzito ya kumwapisha mtu kwa kumwita Mungu aliye hai kuwa shahidi
  alternative: Amri ya kawaida isiyo na nguvu ya kiapo
  rationale: Maneno ya Kigiriki yanamtaja Mungu rasmi na yana uzito wa kimahakama. ‘Ninakuapisha kwa Mungu aliye hai’ huhifadhi nguvu hiyo bila kuongeza istilahi za kisheria zisizokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, huku uzito wa mazingira ya mahakama na maana ya vyeo vya kikristolojia vikihifadhiwa.
