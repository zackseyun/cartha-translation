- from: Kisha akachukua kikombe, akashukuru, akawapa akisema, “Nyweni kutoka katika hiki, ninyi nyote.”
  to: Kisha akachukua kikombe, akashukuru, akawapa akisema, “Nyweni kutoka humo, ninyi nyote.”
  rationale: The revision changes only the awkward rendering of ἐξ αὐτοῦ. “Kutoka humo” is idiomatic Standard East African Swahili for drinking from the previously mentioned cup, while retaining the source’s reference and avoiding sacramental interpretation. No footnote is needed because the Swahili wording clearly marks “ninyi nyote” as the addressees of the command.
