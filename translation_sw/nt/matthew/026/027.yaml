  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: sw
  text: Kisha akachukua kikombe, akashukuru, akawapa akisema, “Nyweni kutoka humo, ninyi nyote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: akachukua
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu; mfululizo wa vitenzi katika Kiswahili unasomeka kwa kawaida huku ukidumisha mpangilio wa matendo.
- source_word: ποτήριον
  choice: kikombe
  rationale: Nomino ya Kigiriki haina kibainishi. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the’, hivyo ‘kikombe’ hudumisha kutokubainishwa huko bila kulazimisha maana.
- source_word: εὐχαριστήσας
  choice: akashukuru
  rationale: Hutoa maana ya kawaida ya kutoa shukrani na huepuka kuingiza istilahi za kisakramenti zisizotajwa wazi.
- source_word: ἔδωκεν αὐτοῖς
  choice: akawapa
  rationale: Kiambishi ‘-wa-’ kinarejelea wanafunzi, na kitu kinachotolewa—kikombe—kinaeleweka kutokana na muktadha.
- source_word: λέγων
  choice: akisema
  rationale: Hudumisha kazi ya kitenzi kishirikishi kinachoanzisha maneno ya moja kwa moja kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Πίετε
  choice: Nyweni
  rationale: Ni amri ya wingi ya kawaida na ya moja kwa moja, inayolingana na amri ya aoristi ya Kigiriki bila kuongeza wazo la kumaliza yaliyomo.
- source_word: ἐξ αὐτοῦ
  choice: kutoka katika hiki
  rationale: Huonyesha chanzo kwa uwazi. ‘Hiki’ kinarejelea kikombe, kama kiwakilishi cha ngeli ya ki-/vi-.
- source_word: πάντες
  choice: ninyi nyote
  rationale: Huonyesha wazi kwamba amri inawaelekea watu wote katika kundi, wala si kwamba wanapaswa kunywa kiasi chote kilichomo.
theological_decisions:
- issue: Madokezo ya Ekaristi au sakramenti katika εὐχαριστήσας
  choice: akashukuru
  alternative: akakibariki; akatoa sala ya shukrani
  rationale: Kitenzi εὐχαριστέω kimsingi humaanisha kutoa shukrani. Tafsiri hii hudumisha maana ya kileksika bila kuamua mapema tafsiri ya baadaye ya kisakramenti.
- issue: Upeo wa πάντες katika amri
  choice: ninyi nyote
  alternative: wote; nyweni vyote
  rationale: Muundo wa Kigiriki unaelekeza πάντες kwa wahusika wa amri, yaani kundi lote, si kwa kiasi cha kinywaji. Hili haliongezi dai la kimadhehebu kuhusu utaratibu wa ushirika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo unatoa simulizi la kawaida na wazi. Hakuna tanbihi iliyohitajika, kwa kuwa Kiswahili hakilazimishi tofauti ya ‘a cup/the cup’, na ‘ninyi nyote’ huondoa utata wa upeo wa πάντες.
