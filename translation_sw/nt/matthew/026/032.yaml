  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: sw
  text: Lakini baada ya kufufuliwa kwangu[a], nitawatangulia kwenda Galilaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kufufuka kwangu.” Kigiriki kimetumia kauli ya kutendwa inayomaanisha kwa halisi zaidi “baada ya kufufuliwa kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Lakini baada ya
  rationale: μετά pamoja na kitenzi-jina chenye kibainishi huonyesha mfuatano wa wakati, ‘baada ya’; δέ hapa huleta utofautishaji mdogo na habari iliyotangulia kuhusu wanafunzi kukwazika.
- source_word: τὸ ἐγερθῆναί με
  choice: baada ya kufufuliwa kwangu
  rationale: Muundo huu ni kitenzi-jina cha aoristi katika kauli ya kutendwa, huku με ikiwa mtendwa wa kisarufi. ‘Kufufuliwa kwangu’ huhifadhi kauli ya kutendwa na inadokeza bila kutaja wazi kwamba mwingine ndiye anayefufua.
- source_word: προάξω ὑμᾶς
  choice: nitawatangulia kwenda
  rationale: προάγω hapa humaanisha kwenda mbele au kutangulia watu wengine. ‘Nitawatangulia kwenda’ ni Kiswahili cha kawaida kinachohifadhi wazo la Yesu kwenda kabla yao bila kulazimisha maana ya kuwaongoza.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: εἰς huonyesha mwendo kuelekea mahali. Katika Kiswahili, jina la mahali baada ya ‘kwenda’ halihitaji kihusishi cha ziada; hivyo ‘kwenda Galilaya’ ni la asili na linabeba maana ya kuelekea huko.
theological_decisions:
- issue: Kauli ya kutendwa katika ἐγερθῆναί kuhusu ufufuo
  choice: baada ya kufufuliwa kwangu
  alternative: baada ya kufufuka kwangu
  rationale: Tafsiri kuu huhifadhi kauli ya kutendwa ya Kigiriki badala ya kuibadili kuwa ‘kufufuka,’ hivyo inadumisha namna ya usemi na uwezekano wa mtendaji wa kimungu bila kumtaja moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nitawatangulia kwenda’ ni cha kawaida na huweka wazi kuwa ‘wa-’ ni wingi. ‘Galilaya’ limetumiwa kwa umbo linalozoeleka katika tafsiri za Biblia za Kiswahili.
