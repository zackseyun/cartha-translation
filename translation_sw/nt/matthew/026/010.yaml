  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: sw
  text: Lakini Yesu, akitambua jambo hilo, akawaambia, “Kwa nini mnamsumbua mwanamke huyo?[a] Kwa maana amenifanyia jambo zuri.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa nini mnamletea mwanamke huyo taabu?”
    reason: lexical_alternative
  - marker: b
    text: Au “Kwa maana amenitendea tendo jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: akitambua jambo hilo
  rationale: Kirai hiki cha hali kinaonyesha kwamba Yesu alifahamu ukosoaji wao kabla ya kusema. ‘Jambo hilo’ linaweka wazi rejeo linalodokezwa na muktadha bila kuongeza maelezo yasiyokuwamo.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ hapa inaonyesha utofauti wa kiasi kati ya malalamiko ya wanafunzi na jibu la Yesu.
- source_word: Τί κόπους παρέχετε
  choice: Kwa nini mnamsumbua
  rationale: Muundo huu ni nahau yenye maana ya kumsababishia mtu taabu au usumbufu. ‘Mnamsumbua’ ni Kiswahili cha kawaida na chenye nguvu ya karipio iliyomo katika swali.
- source_word: τῇ γυναικί
  choice: mwanamke huyo
  rationale: Dativu inamtaja mwanamke anayeathiriwa na usumbufu. ‘Huyo’ humrejelea kwa kawaida mwanamke aliyetajwa katika muktadha.
- source_word: ἔργον καλὸν
  choice: jambo zuri
  rationale: καλός hapa huonyesha tendo linalostahili sifa, lenye uzuri na wema. ‘Jambo zuri’ ni la asili kwa Kiswahili na halipunguzi maana kuwa kazi ya kawaida tu.
- source_word: ἠργάσατο
  choice: amenifanyia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo umuhimu wake bado upo katika mazungumzo haya.
- source_word: εἰς ἐμέ
  choice: amenifanyia
  rationale: εἰς ἐμέ inaonyesha kwamba tendo lilielekezwa kwa Yesu au lilifanywa kwa ajili yake. Kiambishi ‘-ni-’ pamoja na ‘-fanyia’ kinawasilisha uhusiano huo kwa Kiswahili cha asili.
theological_decisions:
- issue: Tathmini ya tendo la mwanamke
  choice: jambo zuri
  alternative: tendo jema
  rationale: ‘Jambo zuri’ huhifadhi sifa chanya na upeo wa καλός bila kuingiza fundisho la ziada kuhusu sifa za kidini au sakramenti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘mnamsumbua’ na ‘amenifanyia jambo zuri’ ili iwe wazi kwa wasomaji wa kawaida huku ikihifadhi nguvu ya karipio na sifa ya tendo la mwanamke.
