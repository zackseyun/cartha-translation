  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: sw
  text: Lakini yeye akakana mbele ya wote, akisema, “Sijui unachosema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: akakana
  rationale: Kitenzi ‘kukana’ kinaonyesha kwamba Petro alikataa dai lililotangulia bila kuongeza kitu mahsusi kisichotajwa wazi katika Kigiriki. Kiswahili hakihitaji kuongeza kiwakilishi cha yambwa hapa.
- source_word: ἔμπροσθεν πάντων
  choice: mbele ya wote
  rationale: Huhifadhi maana ya tendo kufanyika hadharani, mbele ya watu wote waliokuwapo.
- source_word: λέγων
  choice: akisema
  rationale: Huonyesha tendo linaloandamana na kukana na kudumisha mtiririko wa kishiriki cha Kigiriki kwa Kiswahili cha kawaida.
- source_word: Οὐκ οἶδα
  choice: Sijui
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya usemi uliokanushwa wa kujua.
- source_word: τί λέγεις
  choice: unachosema
  rationale: Ni tafsiri ya karibu na ya kawaida ya τί λέγεις, bila kuibadili kuwa ‘unachomaanisha’ au kuongeza ufafanuzi.
theological_decisions:
- issue: Asili ya kukana kwa Petro
  choice: Petro anakataa dai lililotolewa, bila kutaja yambwa waziwazi.
  alternative: Kusema wazi kwamba alimkana Yesu au alikana kumjua kijakazi.
  rationale: Kigiriki kinasema tu ‘alikana’ katika kuitikia shtaka lililotangulia. Kiswahili ‘akakana’ huhifadhi kutotajwa huko kwa yambwa na hakiongezi maelezo ya kiteolojia au kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo ni wa karibu na chanzo lakini unasomeka kwa kawaida.
