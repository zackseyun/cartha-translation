  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: sw
  text: Lakini Petro alipotoka hadi langoni, mwanamke mwingine alimwona, akawaambia waliokuwa pale, “Huyu alikuwa pamoja na Yesu Mnazareti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: lango
  rationale: Katika muktadha huu ni eneo la lango la kuingilia au kutoka katika ua; “lango” ni neno la kawaida na la asili kwa Kiswahili.
- source_word: ἄλλη
  choice: mwanamke mwingine
  rationale: Jinsia ya kivumishi cha Kigiriki inaonyesha mwanamke mwingine; nomino imewekwa wazi kwa Kiswahili.
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati uliopo wa kihistoria katika simulizi umetafsiriwa kwa wakati wa masimulizi wa Kiswahili, unaosikika wa kawaida bila kubadili maana.
- source_word: τοῦ Ναζωραίου
  choice: Mnazareti
  rationale: Hutambulisha Yesu kwa asili au uhusiano wake na Nazareti; “Mnazareti” ni tafsiri fupi na inayotambulika.
