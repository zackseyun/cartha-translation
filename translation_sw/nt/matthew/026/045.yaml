  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: sw
  text: Kisha anawajia wanafunzi na kuwaambia, “Endeleeni kulala sasa na kupumzika.[a] Tazama, saa imekaribia,[b] na Mwana wa Adamu anakabidhiwa mikononi mwa wenye dhambi.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, bado mnalala na kupumzika?” Maneno ya Kigiriki yanaweza kueleweka kama swali la balagha; matini kuu huhifadhi uwezekano wa kejeli katika kauli hiyo.
    reason: alternative_reading
  - marker: b
    text: Au, “saa imefika” au “saa iko karibu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “anasalitiwa.” Neno la Kigiriki lina maana pana zaidi ya “kusalitiwa” na linaweza kutafsiriwa “anakabidhiwa” au “anatolewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kiunganishi cha kawaida kinachoonyesha tukio linalofuata katika mfululizo wa simulizi.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: anawajia wanafunzi
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kudumisha uhai wa simulizi; kiambishi -ji- kinaonyesha mwendo kuelekea kwao.
- source_word: λέγει αὐτοῖς
  choice: kuwaambia
  rationale: Ni usemi wa kawaida na wa asili unaowasilisha kusema kwao bila uzito usiohitajika.
- source_word: Καθεύδετε τὸ λοιπὸν
  choice: Endeleeni kulala sasa
  rationale: Huhifadhi sura ya agizo pamoja na nguvu yake inayoweza kuwa ya kejeli au ruhusa, bila kuigeuza waziwazi kuwa swali.
- source_word: ἀναπαύεσθε
  choice: na kupumzika
  rationale: Kiswahili cha kawaida kinachoendana kwa ulinganifu na kulala.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Mwito wa heshima na unaoeleweka wa kuzingatia tangazo zito linalofuata.
- source_word: ἤγγικεν ἡ ὥρα
  choice: saa imekaribia
  rationale: Huhifadhi maana ya ukaribu uliotimia katika wakati uliopo bila kuamua kwa lazima kuwa saa hiyo tayari imewasili kabisa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Jina la kujitambulisha lenye umuhimu katika muktadha limehifadhiwa badala ya kufafanuliwa kwa maneno mengine.
- source_word: παραδίδοται
  choice: anakabidhiwa
  rationale: Huhifadhi maana pana ya kutolewa au kuwekwa chini ya mamlaka ya wengine, badala ya kuibana iwe usaliti wa Yuda pekee.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: mikononi mwa wenye dhambi
  rationale: Taswira halisi ya mikono imehifadhiwa kwa kuwa ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Nguvu ya Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Imetafsiriwa kama kauli/agizo lenye uwezekano wa kejeli au ruhusa: “Endeleeni kulala sasa na kupumzika.”'
  alternative: “Je, bado mnalala na kupumzika?”
  rationale: Muundo wa Kigiriki na muktadha unaweza kueleweka kama swali la balagha au agizo la kejeli. Matini kuu huhifadhi mvutano huo kadiri Kiswahili kinavyoruhusu, na tanbihi inataja usomaji wa swali.
- issue: Maana ya παραδίδοται katika simulizi la mateso
  choice: anakabidhiwa
  alternative: anasalitiwa
  rationale: Neno la Kigiriki lina maana pana kuliko kusalitiwa pekee. “Anakabidhiwa” huhifadhi tendo la kuwekwa mikononi mwa wengine bila kufunga rejeo kwa tendo la Yuda tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Wakati uliopo wa kihistoria umehifadhiwa. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
