  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: sw
  text: “Mnaonaje?” Wakajibu[a], “Anastahili kifo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ana hatia inayostahili adhabu ya kifo,” au, “Anastahili hukumu ya kifo.” Usemi wa Kigiriki ni hukumu ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Mnaonaje?
  rationale: Ni usemi wa kawaida unaowauliza wasikilizaji maoni au hukumu yao; ‘Mnaonaje?’ ni Kiswahili cha asili na huhifadhi nguvu ya swali la moja kwa moja.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Wakajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi cha kusema unawasilishwa kwa kitenzi kimoja cha simulizi. Kiambishi ‘waka-’ kinaendeleza mtiririko bila kuipa δέ uzito wa upinzani usiokusudiwa.
- source_word: Ἔνοχος
  choice: Anastahili
  rationale: Katika muktadha huu wa kimahakama, neno linaonyesha kuwajibika kwa adhabu au kuhukumiwa kuwa anastahili adhabu hiyo. ‘Anastahili’ ni la kawaida na linaeleza hukumu yao wazi.
- source_word: θανάτου
  choice: kifo
  rationale: Hutaja adhabu ambayo mtu huyo ametangazwa kustahili. ‘Kifo’ huhifadhi usemi mfupi wa Kigiriki; maana ya hukumu ya kifo inaelezwa katika tanbihi.
- source_word: ἐστίν
  choice: Ana-
  rationale: Kopula ya Kigiriki inawakilishwa kiasili katika Kiswahili ndani ya kitenzi ‘anastahili,’ huku kiambishi cha nafsi ‘a-’ kikionyesha mhusika wa umoja.
theological_decisions:
- issue: Nguvu ya kimahakama ya hukumu ya baraza
  choice: Anastahili kifo
  alternative: Ana hatia inayostahili kifo; anawajibika kuhukumiwa kifo
  rationale: Tafsiri inaonyesha kwamba haya ni maneno ya hukumu ya baraza juu ya Yesu, bila kuyageuza kuwa tamko la msimulizi kuhusu hatia yake mbele za Mungu. Tanbihi huhifadhi uwezekano wa kueleza usemi huo kwa istilahi za kisheria zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnaonaje?’ na ‘Wakajibu’ ni vya asili katika simulizi; ‘Anastahili kifo’ ni wazi kwa msomaji wa kawaida huku tanbihi ikibainisha maana ya kisheria.
