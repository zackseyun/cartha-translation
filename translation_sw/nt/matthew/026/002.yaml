id: MAT.26.2
reference: Matthew 26:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: sw
  text: Mnajua kwamba baada ya siku mbili Pasaka itafanyika, na Mwana wa Adamu anakabidhiwa ili asulubiwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anasalitiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kusalitiwa, lakini kwa maana pana zaidi humaanisha “kukabidhiwa” au “kutiwa mikononi mwa wengine.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Mnajua
  rationale: Kitenzi hiki ni nafsi ya pili wingi na kina maana ya hali ya sasa; “mnajua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: μετὰ δύο ἡμέρας
  choice: baada ya siku mbili
  rationale: μετά pamoja na hali ya kushutumiwa hapa inaonyesha wakati, yaani “baada ya siku mbili,” na huhifadhi muundo wa Kigiriki.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: πάσχα ni Pasaka; hakuna haja ya kuongeza neno “sikukuu,” ambalo halijaandikwa wazi katika chanzo.
- source_word: γίνεται
  choice: itafanyika
  rationale: γίνομαι hapa inaeleza kutokea au kufanyika kwa Pasaka. Wakati ujao ni wa asili katika Kiswahili kwa tukio linalotarajiwa baada ya siku mbili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo la kibiblia linalotumiwa na Yesu kujitaja; tafsiri hii huhifadhi mwangwi wake wa kimaandiko na kitheolojia.
- source_word: παραδίδοται
  choice: anakabidhiwa
  rationale: Kauli ya kutendwa ya wakati wa sasa inaweza kueleza tukio lililo karibu na lililo hakika. “Anakabidhiwa” huhifadhi maana pana ya kukabidhi au kutiwa mikononi mwa wengine bila kuifupisha kuwa usaliti pekee.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ili asulubiwe
  rationale: Muundo huu unaonyesha kusudi au matokeo; “ili asulubiwe” ni Kiswahili cha wazi kinachohifadhi uhusiano huo.
theological_decisions:
- issue: Tafsiri ya παραδίδοται katika utabiri wa mateso
  choice: anakabidhiwa
  alternative: anasalitiwa
  rationale: Muktadha unahusisha usaliti wa Yuda, lakini kitenzi cha Kigiriki kina maana pana zaidi ya kukabidhi au kutia mikononi mwa wengine. “Anakabidhiwa” huhifadhi mvutano kati ya usaliti wa kibinadamu na tendo pana la kukabidhiwa bila kuamua maana hiyo kwa ufafanuzi mwembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo unafuata chanzo kwa karibu huku ukitumia wakati na sintaksia ya asili ya Kiswahili.
