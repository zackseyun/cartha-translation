id: MAT.26.69
reference: Matthew 26:69
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: sw
  text: Petro alikuwa ameketi nje katika ua, na kijakazi mmoja[a] akamjia na kusema, “Wewe pia ulikuwa pamoja na Yesu Mgalilaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msichana mtumishi” au “msichana mtumwa.” Neno la Kigiriki παιδίσκη linaweza kumaanisha msichana au mwanamke kijana mtumishi, wakati mwingine akiwa mtumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: na
  rationale: Ni kiunganishi chepesi cha kusogeza simulizi mbele; ‘na’ kinaendeleza masimulizi bila kuongeza wazo la wakati lisilomo wazi katika Kigiriki.
- source_word: ἐκάθητο ἔξω
  choice: alikuwa ameketi nje
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha hali iliyokuwa ikiendelea; ‘alikuwa ameketi’ huiwasilisha kwa Kiswahili cha kawaida.
- source_word: αὐλή
  choice: ua
  rationale: Katika muktadha huu ni eneo la wazi lililozungukwa na majengo katika makao ya kuhani mkuu; ‘ua’ ni neno la kawaida na sahihi.
- source_word: προσῆλθεν αὐτῷ
  choice: akamjia
  rationale: Kitenzi kinaonyesha kumkaribia Petro; ‘akamjia’ ni cha asili katika mtiririko wa simulizi.
- source_word: μία παιδίσκη
  choice: kijakazi mmoja
  rationale: παιδίσκη humaanisha msichana au mwanamke kijana mtumishi, wakati mwingine akiwa mtumwa. ‘Kijakazi’ hudumisha wajibu wake wa kijamii, na ‘mmoja’ huakisi μία.
- source_word: λέγουσα
  choice: na kusema
  rationale: Kirai hiki kinawakilisha hali ya kushiriki ya Kigiriki kwa Kiswahili cha asili bila kubadili maana.
- source_word: Καὶ σὺ
  choice: Wewe pia
  rationale: καί pamoja na kiwakilishi chenye msisitizo σὺ humtaja Petro kuwa naye ni mmoja wa waliokuwa pamoja na Yesu.
- source_word: ἦσθα μετὰ
  choice: ulikuwa pamoja na
  rationale: Hii ni tafsiri ya moja kwa moja ya uhusiano unaoelezwa, bila kuongeza kwamba alikuwa mfuasi.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Yesu Mgalilaya
  rationale: Γαλιλαίου ni jina la kumtambulisha Yesu kwa asili yake; ‘Mgalilaya’ huhifadhi namna hiyo ya kumweleza.
