id: MAT.26.34
reference: Matthew 26:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: sw
  text: Yesu akamwambia, “Kweli ninakuambia, usiku huu huu[a], kabla jogoo hajawika[b], utanikana mara tatu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “leo usiku.” Kigiriki ni “katika usiku huu,” huku neno “huu” likitilia mkazo usiku huo wenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au “kabla yule jogoo hajawika.” Kigiriki hakina kibainishi kinacholazimisha mojawapo ya namna hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Muundo huu ni wa kawaida na wa asili katika simulizi la Kiswahili, huku ukihifadhi mhusika, kitendo cha kusema, na anayesemewa.
- source_word: Ἀμὴν λέγω σοι
  choice: Kweli ninakuambia
  rationale: “Kweli” huwasilisha uthibitisho mzito wa Ἀμήν unaotanguliza kauli ya Yesu, na “ninakuambia” huhifadhi usemi wa moja kwa moja kwa Petro kwa Kiswahili cha sasa.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: usiku huu huu
  rationale: 'Urudiaji wa “huu” ni njia ya asili ya Kiswahili ya kusisitiza demonstrativi ταύτῃ: ni usiku huu wenyewe, si usiku mwingine.'
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: kabla jogoo hajawika
  rationale: Kiswahili hutumia kitenzi “wika” kwa sauti ya jogoo. Nomino ya Kigiriki haina kibainishi, hivyo “jogoo” bila “yule” au maelezo mengine huhifadhi kutobainishwa huko.
- source_word: τρὶς
  choice: mara tatu
  rationale: Hii ndiyo tafsiri wazi na ya kawaida ya idadi ya matukio katika Kiswahili cha sasa.
- source_word: ἀπαρνήσῃ με
  choice: utanikana
  rationale: “Kunikana” huonyesha kukataa kumtambua au kuwa na uhusiano na Yesu, na ndiyo kauli fupi ya kawaida katika muktadha huu bila kuongeza ufafanuzi usio katika maandishi.
theological_decisions:
- issue: Kauli ya utangulizi Ἀμὴν λέγω σοι
  choice: Kweli ninakuambia
  alternative: Amina, ninakuambia
  rationale: Chaguo hili huhifadhi uzito na mamlaka ya kauli ya Yesu kwa lugha inayoeleweka moja kwa moja, bila kuingiza katika maandishi makuu maana za matumizi ya kiliturujia ya “Amina.”
- issue: Maana ya ἀπαρνήσῃ με
  choice: utanikana
  alternative: utakataa kuwa unanijua
  rationale: “Utanikana” huhifadhi ufupi na mvutano wa neno la Kigiriki, ambalo katika muktadha linahusu kukataa uhusiano au kumtambua Yesu. Mbadala unaeleza zaidi lakini unaweza kufinya wigo wa kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Usiku huu huu” huhifadhi msisitizo wa asili kwa namna ya Kiswahili, na “jogoo hajawika” ni usemi wa kawaida usio wa kitaaluma.
