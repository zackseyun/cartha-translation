  - marker: a
    text: Baadhi ya hati za kale husoma “pamoja na wale kumi na wawili” badala ya “pamoja na wanafunzi kumi na wawili.” Kwa desturi ya wakati huo, walaji mara nyingi walikuwa wakiegemea karibu na meza.
