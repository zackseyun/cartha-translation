lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ilipofika jioni
  rationale: Kirai hiki hutoa mazingira ya wakati. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na inadumisha maana ya tukio kutokea jioni.
- source_word: ἀνέκειτο
  choice: aliketi kula
  rationale: Kitenzi hiki humaanisha kuegemea wakati wa kula kulingana na desturi ya wakati huo. Kiswahili kwa kawaida hakisemi mtu 'aliegemea mezani' kwa mlo; 'aliketi kula' huwasilisha kwa uwazi tendo la kushiriki mlo bila kupotosha maana.
- source_word: μετὰ
  choice: pamoja na
  rationale: Hii inawasilisha moja kwa moja maana ya kuwa katika ushirika au kundi moja na wengine.
- source_word: τῶν δώδεκα μαθητῶν
  choice: wale wanafunzi kumi na wawili
  rationale: Neno μαθητῶν lipo katika matini ya SBLGNT na limetafsiriwa kuwa 'wanafunzi.' 'Wale' huonyesha kundi maalumu linalojulikana la wanafunzi kumi na wawili.
