  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: sw
  text: Lakini wanafunzi walipoona hayo, walikasirika na kusema, “Kwa nini ufujaji huu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ufujaji huu ni wa nini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: walipoona hayo
  rationale: Kauli ya wakati inawasilisha kiambishi cha aoristi kwa Kiswahili cha kawaida. “Hayo” limeongezwa kutokana na muktadha, likirejelea kitendo cha mwanamke cha kumtia Yesu mafuta, kwa kuwa Kigiriki kimeacha yambwa bila kutajwa.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye utofauti mdogo kati ya kitendo kilichotangulia na mwitikio hasi wa wanafunzi.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida katika masimulizi ya Injili; “wake” halijaongezwa kwa kuwa halipo wazi katika Kigiriki.
- source_word: ἠγανάκτησαν
  choice: walikasirika
  rationale: Kitenzi kinaonyesha kutofurahishwa sana au ghadhabu. “Walikasirika” ni lugha ya kawaida na ya sasa inayoeleweka kwa urahisi, bila kupunguza uzito wa mwitikio wao.
- source_word: λέγοντες
  choice: na kusema
  rationale: Muundo huu ni wa asili katika Kiswahili na unaunganisha hasira yao na maneno yao, huku ukiwasilisha kazi ya kauli ya Kigiriki.
- source_word: Εἰς τί
  choice: Kwa nini
  rationale: Ni usemi wa kawaida wa Kiswahili unaobeba maana ya swali la kusudi, yaani, “kwa madhumuni gani?”
- source_word: ἡ ἀπώλεια αὕτη
  choice: upotevu huu
  rationale: Katika muktadha wa mafuta ya thamani yaliyomiminwa, neno hili linaashiria kitu ambacho wanafunzi walikiona kuwa kimetumiwa bure. “Upotevu” huhifadhi kwa kiasi fulani upana wa maana ya hasara au kuharibu, ingawa “ufujaji” ni tafsiri ya kimuktadha iliyo wazi zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walikasirika” ni cha kawaida zaidi kuliko “walighadhibika,” na “upotevu” huhifadhi upana wa ἀπώλεια. Alama ya tanbihi imewekwa baada ya swali linalohusika.
