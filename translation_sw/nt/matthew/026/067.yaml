  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: sw
  text: Ndipo wakamtemea mate usoni na kumpiga kwa ngumi, na wengine wakampiga makofi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na wengine wakampiga kwa mikono wazi.” Kitenzi cha Kigiriki mara nyingi humaanisha kumpiga mtu kofi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha tukio linalofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: wakamtemea mate usoni
  rationale: Kirai hiki kinaeleza kumtemea Yesu moja kwa moja usoni kama tendo la dharau; Kiswahili hiki ni cha asili na huhifadhi uzito wa tendo hilo.
- source_word: ἐκολάφισαν αὐτόν
  choice: kumpiga kwa ngumi
  rationale: Kitenzi κολαφίζω kinaashiria kumpiga mtu kwa ngumi, hivyo tafsiri mahususi inapendelewa kuliko neno la jumla kama 'kumpiga' pekee.
- source_word: οἱ δὲ ἐράπισαν
  choice: na wengine wakampiga makofi
  rationale: Nomino inayodokezwa na οἱ hutofautisha kundi jingine, na ῥαπίζω kwa kawaida huonyesha kipigo cha kiganja au kofi. Yambwa 'm-' imejazwa kutokana na muktadha.
- source_word: δέ
  choice: na
  rationale: Hapa huendeleza simulizi na kutaja tendo la wengine bila kuonyesha upinzani mkali.
theological_decisions:
- issue: Maelezo ya kudhalilishwa na kupigwa kwa Yesu mbele ya baraza
  choice: Kutaja wazi kutemewa mate, kupigwa kwa ngumi, na kupigwa makofi.
  alternative: Kutumia maelezo ya jumla kama 'walimtesa' au 'walimpiga.'
  rationale: Matendo mahususi katika Kigiriki yanapaswa kuhifadhiwa bila kupunguza ukali wake wala kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa vitenzi vya mfululizo huhifadhi mtiririko wa haraka wa simulizi.
