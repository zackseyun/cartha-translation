base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: sw
  text: Walipokuwa wakila[a], Yesu alichukua mkate, na baada ya kuubariki[b], akaumega, akawapa wanafunzi, akasema, “Chukueni, mle[c]; huu ni mwili wangu[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati walipokuwa wakila.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akiisha kuubariki”; baadhi huelewa tendo hili kuwa kutoa shukrani juu ya mkate.
    reason: lexical_alternative
  - marker: c
    text: Au, “Chukueni na mle.”
    reason: lexical_alternative
  - marker: d
    text: Kigiriki kinasema moja kwa moja, “huu ni mwili wangu.” Baadhi hufasiri maana yake kuwa “huu unamaanisha/unaashiria mwili wangu,” lakini tafsiri hii inahifadhi maneno ya chanzo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Walipokuwa wakila
  rationale: Muundo huu unaweka mazingira ya wakati na kuonyesha tendo lililokuwa likiendelea. δέ ni kiunganishi chepesi, hivyo si lazima litafsiriwe kwa neno lenye maana ya kupingana.
- source_word: λαβὼν
  choice: alichukua
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kama tendo linalofuata katika masimulizi, kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἄρτον
  choice: mkate
  rationale: ἄρτος humaanisha kwa kawaida mkate; muktadha unaweza kudokeza mkate mzima, lakini ‘mkate’ ni sahihi bila kuongeza maelezo yasiyo wazi katika chanzo.
- source_word: εὐλογήσας
  choice: baada ya kuubariki
  rationale: εὐλογέω hapa kwa kawaida hurejelea kutamka baraka juu ya mkate au chakula. Tafsiri hii haitoi maana hiyo na kuiweka tu kuwa ‘kutoa shukrani,’ ingawa dhana hizo zinahusiana katika masimulizi sambamba.
- source_word: ἔκλασεν
  choice: akaumega
  rationale: Kitenzi kina maana ya kuumega mkate. Kiambishi cha yambwa ‘-u-’ kinarejelea mkate kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: akawapa wanafunzi
  rationale: Kitenzi kishirikishi kimetolewa kama tendo linalofuata ili masimulizi yawe ya asili kwa Kiswahili. ‘Wanafunzi’ linahifadhi kundi linalojulikana bila kuongeza ‘wake,’ ambalo halijaandikwa wazi katika Kigiriki.
- source_word: Λάβετε φάγετε
  choice: Chukueni, mle
  rationale: Vitenzi viwili vya amri katika wingi vimehifadhiwa bila kuingiza kiunganishi, hivyo mkazo na mpangilio wa chanzo unabaki.
- source_word: τοῦτό ἐστιν
  choice: huu ni
  rationale: ἐστιν ni kitenzi cha kawaida cha kuwa. ‘Huu ni’ kinarejelea mkate na hakibadili kauli kuwa ‘huu unamaanisha’ au ‘huu unaashiria.’
- source_word: τὸ σῶμά μου
  choice: mwili wangu
  rationale: σῶμα ni neno la kawaida kwa ‘mwili,’ na umilikaji umetafsiriwa moja kwa moja.
theological_decisions:
- issue: Maneno ya Yesu kuhusu mkate katika mlo huu
  choice: huu ni mwili wangu
  alternative: huu unamaanisha/unaashiria mwili wangu
  rationale: Kigiriki kinatumia kitenzi cha kawaida ἐστιν, ‘ni.’ Tafsiri inahifadhi maneno ya chanzo na mvutano wake wa kitheolojia bila kuamua kwa niaba ya tafsiri fulani ya kisakramenti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya masimulizi umetolewa kwa viambishi vya ‘aka-’ ili sentensi itiririke kwa asili, huku kauli kuu ya Yesu ikihifadhiwa bila ufafanuzi wa kimadhehebu.
