base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: sw
  text: Wale waliomkamata Yesu walimpeleka kwa Kayafa, kuhani mkuu, mahali ambapo waandishi na wazee walikuwa wamekusanyika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wamekusanywa.” Kitenzi cha Kigiriki kina umbo la kutendwa, lakini katika muktadha huu pia kinaweza kutafsiriwa “walikuwa wamekusanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Wale
  rationale: Kifungu chenye kibainishi na kitenzi-jina kimetafsiriwa kama kundi la watu, ‘Wale’; δέ ni kiunganishi hafifu cha kuendeleza simulizi na hakihitaji neno tofauti katika Kiswahili hapa.
- source_word: κρατήσαντες
  choice: waliomkamata
  rationale: Kitenzi hiki kinaonyesha kuwashika na kuwaweka chini ya mamlaka. ‘Kumkamata’ ni cha kawaida na kinafaa katika muktadha huu bila kusisitiza utaratibu rasmi wa kisheria kuliko Kigiriki.
- source_word: ἀπήγαγον
  choice: walimpeleka
  rationale: ἀπάγω humaanisha kuongoza au kupeleka mbali. ‘Walimpeleka’ ni Kiswahili cha kawaida kinachoonyesha mwendo wa Yesu akiwa chini ya ulinzi wao.
- source_word: πρὸς Καϊάφαν
  choice: kwa Kayafa
  rationale: πρός pamoja na hali ya kushutumiwa inaonyesha mwendo kuelekea kwa mtu. ‘Kwa Kayafa’ haiongezi wazo la nyumba yake wala la kusimama rasmi mbele yake.
- source_word: τὸν ἀρχιερέα
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida na sahihi la cheo cha ἀρχιερεύς katika umoja.
- source_word: ὅπου
  choice: mahali ambapo
  rationale: Usemi huu wa mahali ni wazi na wa asili katika sentensi hii ya Kiswahili.
- source_word: οἱ γραμματεῖς
  choice: waandishi
  rationale: ‘Waandishi’ ni tafsiri ya karibu na iliyozoeleka ya γραμματεῖς kwa viongozi hawa wenye utaalamu wa maandiko; haiongezi ufafanuzi usiotajwa moja kwa moja.
- source_word: οἱ πρεσβύτεροι
  choice: wazee
  rationale: ‘Wazee’ ni tafsiri sahihi na iliyozoeleka kwa viongozi waliotambuliwa katika mazingira haya.
- source_word: συνήχθησαν
  choice: walikuwa wamekusanyika
  rationale: Muundo huu unaonyesha kwamba walikuwa tayari pamoja Yesu alipopelekwa kwa Kayafa, huku ukisomeka kwa kawaida katika Kiswahili.
