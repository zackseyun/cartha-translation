  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: sw
  text: 'wakisema, “Tutabirie, ewe Masihi[a]: ni nani aliyekupiga?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός limetumiwa hapa kama cheo, si kama jina.
