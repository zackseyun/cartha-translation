lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati wa sasa kinaanzisha maneno ya wale waliokuwa wakimdhihaki; “wakisema” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: Προφήτευσον
  choice: Tutabirie
  rationale: Hali ya kuamuru imetumiwa kwa dhihaka, wakimtaka atambue kwa uwezo wa kinabii aliyempiga. “Tutabirie” inadumisha wazo la kutoa ujumbe au maarifa ya kinabii bila kulifafanua kupita kiasi.
- source_word: ἡμῖν
  choice: tu-
  rationale: Kiwakilishi cha yambwa katika “tutabirie” kinaonyesha kwamba unabii huo ulitakiwa kutolewa kwao.
- source_word: χριστέ
  choice: ewe Masihi
  rationale: Ni jina la cheo katika hali ya mwito. “Masihi” huwasilisha maana ya cheo hicho na “ewe” huonyesha wazi kwamba Yesu anaambiwa moja kwa moja.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: ni nani aliyekupiga?
  rationale: Muundo huu wa Kiswahili unauliza utambulisho wa mtu aliyefanya tendo hilo na kuhifadhi tendo halisi la kumpiga Yesu.
theological_decisions:
- issue: Tafsiri ya Χριστός kama jina la cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno liko katika hali ya mwito na linatumiwa wazi kama jina la cheo katika dhihaka. “Masihi” huonyesha cheo hicho badala ya kukifanya kionekane kama jina la mtu; “Kristo” imewekwa katika tanbihi kama namna nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ni mfupi na wa moja kwa moja, huku sauti ya dhihaka katika amri ikidumishwa.
