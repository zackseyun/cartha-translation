base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: sw
  text: Lakini ninawaambia, tangu sasa hakika sitakunywa tena zao hili la mzabibu mpaka siku ile nitakapolinywa likiwa jipya[a] pamoja nanyi katika ufalme wa Baba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upya” au “kwa namna mpya.” Kivumishi cha Kigiriki kinaweza kumaanisha upya wa aina au sifa, na usemi huu unaweza kudokeza kulinywa kwa namna mpya katika ufalme ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: δέ inaonyesha mpito wenye utofautishaji wa kiasi; “Lakini ninawaambia” ni ya kawaida na haiutilii mkazo kupita kiasi.
- source_word: οὐ μὴ πίω
  choice: sitakunywa tena kamwe
  rationale: οὐ μή pamoja na kitenzi tegemezi huleta ukanushaji wa wakati ujao wenye mkazo; “tena kamwe” huonyesha kuwa kuanzia sasa hatakunywa hadi wakati uliotajwa.
- source_word: ἀπ’ ἄρτι
  choice: tangu sasa
  rationale: Hutaja mwanzo wa kipindi kuanzia wakati huu na kuendelea.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: matunda haya ya mzabibu
  rationale: Huhifadhi tamathali ya Kigiriki ya “zao/tunda la mzabibu” badala ya kuifafanua moja kwa moja kuwa divai; wingi unapatana kiasili na matumizi ya Kiswahili ya “matunda,” ingawa kinachorejelewa ni kilichomo kikombeni.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: mpaka siku ile
  rationale: Huhifadhi kiashiria ἐκείνης kinachoelekeza kwenye siku fulani ya baadaye.
- source_word: ὅταν αὐτὸ πίνω
  choice: nitakapoyanywa
  rationale: ὅταν pamoja na kitenzi tegemezi huelekeza kwenye tukio la baadaye; kiambishi -ya- hurejelea matunda ya mzabibu yaliyotajwa.
- source_word: καινὸν
  choice: yakiwa mapya
  rationale: καινόν hueleza upya wa aina au sifa na kisarufi huelezea kile kinachonywewa; tafsiri hii huhifadhi “mapya” bila kuamua kimya kimya kuwa maana ni “upya” au “kwa namna mpya.”
- source_word: μεθ’ ὑμῶν
  choice: pamoja nanyi
  rationale: Huwasilisha wazi ushirika au uandamani unaoonyeshwa na μετά.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: katika ufalme wa Baba yangu
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuhifadhi uzito wa rejeo la Yesu kwa Baba yake.
theological_decisions:
- issue: Iwapo yaliyomo kikombeni yataitwa moja kwa moja “divai”
  choice: Kuhifadhi usemi “matunda haya ya mzabibu” katika matini
  alternative: divai hii
  rationale: Kigiriki kinasema “zao/tunda la mzabibu,” si οἶνος (“divai”). Kuhifadhi usemi huo huepuka kuingiza ufafanuzi wa kisakramenti au wa kiishara usiotamkwa moja kwa moja.
- issue: Maana ya καινὸν katika karamu ya ufalme ujao
  choice: “mapya” katika matini, huku uwezekano wa “upya/kwa namna mpya” ukielezwa katika tanbihi
  alternative: upya; kwa namna mpya
  rationale: Kivumishi kinaweza kuonyesha upya wa aina au sifa, lakini mstari hauamui kikamilifu ikiwa ni kinywaji kipya au tendo la kunywa kwa hali mpya. Tafsiri huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na chanzo lakini unasomeka kwa kawaida. “Pamoja nanyi” limetumiwa badala ya “nanyi” pekee kwa uwazi wa ushirika; “matunda ya mzabibu” huhifadhi usemi wa chanzo.
