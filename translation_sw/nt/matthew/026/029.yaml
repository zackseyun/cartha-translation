  to: Lakini ninawaambia, tangu sasa hakika sitakunywa tena zao hili la mzabibu mpaka siku ile nitakapolinywa likiwa jipya[a] pamoja nanyi katika ufalme wa Baba yangu.
  rationale: Marekebisho huondoa “kamwe,” ambayo huongeza maana ya kutotokea kabisa kinyume na kikomo cha “mpaka siku ile,” huku yakihifadhi msisitizo wa οὐ μή kwa “hakika.” Pia hubadilisha wingi wa “matunda” kuwa umoja “zao” ili kuwakilisha γένημα na kuruhusu kiambishi cha umoja katika kitenzi na kivumishi. Utata wa καινόν unabaki katika matini na tanbihi bila ufafanuzi wa kidhehebu.
