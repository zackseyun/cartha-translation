reference: Matthew 26:55
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: sw
  text: Wakati huo Yesu akawaambia makundi ya watu, “Je, mmekuja na panga na marungu kunikamata kana kwamba mimi ni mnyang’anyi?[a] Kila siku nilikuwa nikiketi hekaluni nikifundisha, nanyi hamkunikamata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambazi” au “mwasi mwenye silaha.” Neno la Kigiriki linaweza kumaanisha mnyang’anyi wa kutumia nguvu, na katika baadhi ya miktadha mwasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Wakati huo
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha wakati ule ule bila kufanya usemi kuwa mgumu.
- source_word: τοῖς ὄχλοις
  choice: makundi ya watu
  rationale: Huhifadhi wingi wa ὄχλοις na kueleza kwa kawaida kwamba Yesu alizungumza na watu waliokusanyika.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: kana kwamba mimi ni mnyang’anyi
  rationale: Hutoa kwa Kiswahili cha asili nguvu ya swali la balagha; λῃστής linaweza kumaanisha mnyang’anyi wa kutumia nguvu, jambazi, au katika mazingira fulani mwasi mwenye silaha.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: na panga na marungu
  rationale: “Panga” ni neno linaloeleweka kwa silaha zenye makali hapa, na “marungu” huonyesha kwamba ξύλα ni vipande vya miti vilivyotumiwa kama silaha.
- source_word: συλλαβεῖν με
  choice: kunikamata
  rationale: Katika muktadha huu kitenzi kinaeleza kumtia Yesu chini ya ulinzi kwa nguvu; “kunikamata” ni cha kawaida na sahihi.
- source_word: καθ’ ἡμέραν
  choice: Kila siku
  rationale: Huwakilisha moja kwa moja tendo la kila siku na msisitizo wa Yesu kwamba alikuwa akifundisha hadharani.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hurejelea eneo zima la hekalu, na katika Kiswahili “hekaluni” ni kifupi na cha kawaida bila kudai kwamba Yesu alikuwa katika patakatifu pa ndani.
- source_word: ἐκαθεζόμην διδάσκων
  choice: nilikuwa nikiketi hekaluni nikifundisha
  rationale: Muundo wenye “nilikuwa niki-” huhifadhi hali endelevu/ya mazoea ya imperfect na tendo linaloambatana la kufundisha.
- source_word: οὐκ ἐκρατήσατέ με
  choice: nanyi hamkunikamata
  rationale: κρατέω hapa ni kumkamata au kumshika mtu. Kurudia “kunikamata” ni kwa kawaida katika Kiswahili na hudumisha hoja ya kutokumkamata Yesu alipokuwa wazi hadharani.
theological_decisions:
- issue: Maana pana ya λῃστής katika swali la Yesu
  choice: mnyang’anyi
  alternative: jambazi; mwasi mwenye silaha
  rationale: Neno linaweza kumaanisha zaidi ya mwizi wa kawaida, hasa mtu anayepora kwa nguvu, na wakati mwingine linaweza kuwa na wazo la uasi. “Mnyang’anyi” ni chaguo pana na linaloeleweka; tanbihi huhifadhi uwezekano mwingine bila kulazimisha maana ya kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limewekwa kwa mtiririko wa asili, huku wingi wa “makundi” na hali endelevu ya tendo la Yesu vikihifadhiwa.
