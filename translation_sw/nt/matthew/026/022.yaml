lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: Wakahuzunika sana
  rationale: Kirai hiki kinaonyesha huzuni yao kubwa iliyoendelea; “kuhuzunika sana” ni Kiswahili cha kawaida na chenye hadhi kinachobeba nguvu ya kielezi σφόδρα.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: wakaanza kumwambia
  rationale: Huhifadhi maana ya kuanza kusema, huku “kumwambia” ikiwa njia ya asili ya Kiswahili ya kueleza kusema maneno kwa mtu.
- source_word: εἷς ἕκαστος
  choice: mmoja baada ya mwingine
  rationale: Huwasilisha msisitizo wa mgawanyo, yaani kila mmoja aliuliza kwa zamu.
- source_word: Μήτι ἐγώ εἰμι
  choice: Hakika si mimi
  rationale: Μήτι huanzisha swali linalotarajia jibu la kukataa; muundo huu unahifadhi matarajio hayo bila kubadili swali kuwa kauli.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριε kwa Yesu na huhifadhi uzito wa cheo hicho katika simulizi.
theological_decisions:
- issue: Tafsiri ya κύριε katika kumwambia Yesu
  choice: Bwana
  alternative: bwana / mheshimiwa
  rationale: “Bwana” huhifadhi uwezekano wa uzito wa kimamlaka na kitheolojia wa anwani hii katika Mathayo, bila kuipunguza kuwa heshima ya kawaida tu.
- issue: Nguvu ya swali lenye μήτι
  choice: Hakika si mimi, Bwana?
  alternative: Je, ni mimi, Bwana?
  rationale: Chaguo lililotumiwa linaonyesha kwamba msemaji anatarajia jibu la kukataa, ilhali mbadala ungeacha matarajio hayo yasijulikane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye “waka-” unaendana na mtiririko wa simulizi la Injili. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
