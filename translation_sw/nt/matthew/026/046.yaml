  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: sw
  text: Inukeni, twende. Tazama, anayenisaliti[a] amekaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “yule anayenikabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Inukeni
  rationale: Kitenzi ni amri ya wingi kwa wanafunzi. “Inukeni” ni ya moja kwa moja, ya kawaida, na hudokeza kuinuka kutoka walipokuwa.
- source_word: ἄγωμεν
  choice: twende
  rationale: Hali tegemezi ya nafsi ya kwanza wingi ina nguvu ya kuhimiza; “twende” ndiyo namna ya kawaida ya Kiswahili ya kutoa mwito huo wa pamoja.
- source_word: ἰδού
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye jambo la haraka linalotokea. “Tazama” linahifadhi msisitizo wake bila kuwa la kizamani kupita kiasi.
- source_word: ἤγγικεν
  choice: amekaribia
  rationale: Wakati timilifu unaonyesha kwamba kukaribia kumetokea na hali hiyo ni muhimu sasa; “amekaribia” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: ὁ παραδιδούς με
  choice: anayenisaliti
  rationale: Kirai cha kivumishi-itenzi kinamtambulisha mtu kwa tendo analofanya. Katika muktadha huu, kumkabidhi Yesu kwa maadui ni kumsaliti; tanbihi inahifadhi maana halisi zaidi ya kumkabidhi.
theological_decisions:
- issue: Tafsiri ya παραδιδούς katika simulizi la mateso
  choice: anayenisaliti
  alternative: anayenikabidhi
  rationale: Kitenzi kinaeleza kwa uhalisi mtu anayemkabidhi Yesu, na katika muktadha huu tendo hilo ni usaliti. Matini kuu inatumia usemi wa kawaida wa kimahusiano, huku tanbihi ikihifadhi tendo halisi la kumkabidhi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na amri zimehifadhi uharaka wa maneno ya Yesu.
