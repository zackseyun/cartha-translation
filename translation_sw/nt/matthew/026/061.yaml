  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: sw
  text: Wakasema, “Mtu huyu alisema, ‘Ninaweza kulibomoa hekalu la Mungu na kulijenga ndani ya siku tatu[a].’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika muda wa siku tatu.” Usemi wa Kigiriki unaweza kumaanisha kukamilisha jambo ndani ya kipindi hicho.
    reason: lexical_alternative
  - marker: b
    text: Yohana 2:19–21 inaeleza kwamba Yesu aliposema kuhusu hekalu alikuwa akiuzungumzia mwili wake.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Wakasema
  rationale: Kauli ya wakati uliopita inasimulia shtaka la mashahidi kama tukio kamili; “Wakasema” ni ya kawaida katika masimulizi ya Kiswahili.
- source_word: Οὗτος
  choice: Mtu huyu
  rationale: Katika shtaka la moja kwa moja, “Mtu huyu” huhifadhi nguvu ya kumwonyesha anayeshtakiwa na ni ya kawaida zaidi kuliko “Huyu mmoja.”
- source_word: ἔφη
  choice: alisema
  rationale: Kitenzi hiki kinaripoti tu maneno yanayodaiwa kusemwa bila kuongeza maana ya kutangaza au kudai.
- source_word: Δύναμαι
  choice: Ninaweza
  rationale: Hueleza uwezo na ni Kiswahili cha kawaida, wazi na sahihi.
- source_word: καταλῦσαι
  choice: kulibomoa
  rationale: Kwa jengo, kitenzi hiki kina maana ya kubomoa au kuangusha; “kulibomoa” kinafaa kwa hekalu na kuhifadhi sura ya shtaka.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: hekalu la Mungu
  rationale: “Hekalu” ni neno la kawaida na linaloeleweka kwa ναός katika muktadha huu; muundo “la Mungu” unahifadhi uhusiano wa Kigiriki bila kuufafanua zaidi.
- source_word: διὰ τριῶν ἡμερῶν
  choice: kwa siku tatu
  rationale: Kirai kinaonyesha kipindi cha siku tatu ambamo ujenzi ungekamilishwa. Tafsiri hii ni fupi na huhifadhi kiasi fulani cha uwazi wa usemi wa Kigiriki; njia ya kusema wazi zaidi “katika muda wa siku tatu” imewekwa katika tanbihi.
- source_word: οἰκοδομῆσαι
  choice: kulijenga
  rationale: Kiwakilishi cha ngeli “li” kinarejelea hekalu kwa kawaida katika Kiswahili. “Kulijenga” ni karibu zaidi na Kigiriki kuliko “kulijenga upya,” ingawa kujenga upya kunadokezwa na muktadha.
theological_decisions:
- issue: Kitu kinachorejelewa na “hekalu la Mungu” katika shtaka
  choice: Shtaka limetafsiriwa kwa maana yake ya moja kwa moja kuhusu hekalu, bila kuingiza katika matini kuu ufafanuzi kwamba hekalu ni mwili wa Yesu.
  alternative: Kutafsiri usemi huo moja kwa moja kama rejeo la mwili wa Yesu na ufufuo wake.
  rationale: Mathayo anasimulia maneno ya mashahidi katika kesi. Tafsiri inapaswa kuonyesha walichodai Yesu alisema, huku uhusiano na Yohana 2:19–21 ukitajwa katika tanbihi badala ya kutawala matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kama shtaka la mahakamani lakini inabaki rahisi kueleweka. Alama [a] imewekwa baada ya kirai cha siku tatu kinachohusika nayo, na [b] baada ya nukuu nzima kwa kuwa ni tanbihi ya ufafanuzi wa usemi.
