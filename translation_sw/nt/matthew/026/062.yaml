  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: sw
  text: Kuhani mkuu akasimama, akamwambia, “Hujibu chochote? Watu hawa wanashuhudia nini dhidi yako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: akasimama
  rationale: Kitenzi hiki kinaonyesha tendo la kuhani mkuu kuinuka na kusimama kabla ya kusema; “akasimama” ni lugha ya kawaida na huhifadhi mfuatano wa matendo.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida na sahihi la cheo hiki cha ukuhani wa Kiyahudi katika muktadha huu.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Huhifadhi kiwakilishi cha Kigiriki na kwa Kiswahili huunganisha kwa kawaida maana ya ‘alisema kwake.’
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Hujibu chochote?
  rationale: Huhifadhi muundo wa swali na uzito wa kutokutoa jibu, huku ikiwa Kiswahili cha kawaida na wazi.
- source_word: τί
  choice: nini
  rationale: Kiwakilishi cha kuuliza kimetafsiriwa moja kwa moja bila kuongeza ufafanuzi usiokuwamo katika chanzo.
- source_word: οὗτοί
  choice: watu hawa
  rationale: Kiashiria hiki kinawarejelea mashahidi waliokuwapo; “watu hawa” ni wazi na ya kawaida bila kulazimisha jinsia katika Kiswahili.
- source_word: σου
  choice: dhidi yako
  rationale: Pamoja na καταμαρτυροῦσιν, kiwakilishi hiki kinaonyesha ushahidi unaotolewa dhidi ya mshtakiwa, si habari za kawaida tu kumhusu.
- source_word: καταμαρτυροῦσιν
  choice: wanashuhudia
  rationale: Huhifadhi maana ya kutoa ushahidi katika mazingira ya kisheria na hali ya tendo linaloendelea, huku “dhidi yako” ikionyesha nguvu ya kiambishi κατά.
