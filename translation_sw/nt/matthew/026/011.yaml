  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: sw
  text: Kwa maana siku zote mnao maskini pamoja nanyi,[a] lakini mimi hamnami siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu maskini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sikuzote
  rationale: Kielezi hiki kinaonyesha kuwapo au kupatikana daima; “sikuzote” ni Kiswahili cha kawaida na pia kinahifadhi urudiaji wake katika vifungu vyote viwili.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; “kwa maana” kinaonyesha uhusiano huo wa maelezo kwa uwazi.
- source_word: τοὺς πτωχοὺς
  choice: maskini
  rationale: Nomino iliyotokana na kivumishi hiki inawarejelea watu maskini kwa ujumla. “Maskini” ni fupi, ya kawaida, na haihitaji kuongeza neno “watu,” ingawa hilo pia linawezekana.
- source_word: ἔχετε
  choice: mnao / hamnami
  rationale: Kitenzi hapa hakimaanishi umiliki, bali kuwapo kwa watu hao pamoja na wanafunzi. Miundo “mnao pamoja nanyi” na “hamnami” ni ya asili katika Kiswahili na inaonyesha kuwapo au kupatikana.
- source_word: μεθ’ ἑαυτῶν
  choice: pamoja nanyi
  rationale: Kirai hiki kinaonyesha kuwapo kwa maskini katikati au pamoja na wanafunzi. “Pamoja nanyi” ni cha kawaida kuliko tafsiri ya neno kwa neno “pamoja na nafsi zenu.”
- source_word: ἐμὲ
  choice: mimi
  rationale: Kiwakilishi hiki kinamrejelea Yesu mwenyewe; “mimi” kinadumisha msisitizo wa umbo la Kigiriki.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaweka tofauti kati ya kuwapo kwa maskini sikuzote na kipindi kifupi cha kuwapo kwa Yesu pamoja nao; “lakini” kinaonyesha tofauti hiyo wazi.
- source_word: οὐ πάντοτε
  choice: si... sikuzote
  rationale: Ukanushi huu unatofautishwa moja kwa moja na πάντοτε ya kwanza. “Hamnami sikuzote” ni kauli ya asili inayohifadhi tofauti hiyo.
theological_decisions:
- issue: Maana ya kuwapo kwa Yesu
  choice: Aya inalinganisha kuwapo kwa maskini kunakoendelea na kipindi kifupi cha kuwapo kwa Yesu kimwili pamoja na wanafunzi.
  alternative: Aya inaweza kufasiriwa kana kwamba inapunguza wajibu wa kuwajali maskini.
  rationale: Kigiriki kinaweka tofauti ya wakati, wala hakisemi kuwa maskini hawana thamani. Tafsiri inadumisha uzito wa wakati wa pekee kabla ya kifo cha Yesu bila kuongeza dai linalopuuza huruma kwa maskini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mnao pamoja nanyi” unaepuka wazo la umiliki katika ἔχετε, huku “hamnami” ukiwasilisha kwa kawaida maana ya kutokuwa pamoja nao. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
