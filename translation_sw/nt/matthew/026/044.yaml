base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: sw
  text: Akawaacha tena, akaenda zake, akasali mara ya tatu, akisema kauli ileile tena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: Akawaacha
  rationale: Kitenzi hiki hapa kina maana ya kuwaacha wanafunzi na kuondoka kwao; muundo wa masimulizi wenye “aka-” unaonyesha mfuatano wa matendo kwa Kiswahili cha kawaida.
- source_word: πάλιν ἀπελθὼν
  choice: tena, akaenda
  rationale: πάλιν inaonyesha kurudiwa kwa tendo, na ἀπελθών inaonyesha kwenda mbali na wanafunzi. “Akaenda” ni ya asili katika simulizi na haiongezi mahali pasipotajwa.
- source_word: προσηύξατο
  choice: kusali
  rationale: Neno hili humaanisha kusali; “kusali” ni neno la kawaida, wazi, na la heshima katika Kiswahili sanifu.
- source_word: ἐκ τρίτου
  choice: mara ya tatu
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza kwamba tendo lilifanyika kwa tukio la tatu.
- source_word: τὸν αὐτὸν λόγον
  choice: maneno yaleyale
  rationale: Ingawa λόγον iko katika umoja, hapa inahusu kauli au yaliyosemwa katika sala. “Maneno yaleyale” ni ya asili kwa Kiswahili na huhifadhi wazo la kurudia yaliyosemwa bila kufafanua zaidi ya matini.
- source_word: εἰπὼν πάλιν
  choice: akisema ... tena
  rationale: Muundo huu huhifadhi kishirikishi cha kusema pamoja na πάλιν ya pili, hivyo kusisitiza kurudiwa kwa maudhui ya sala.
theological_decisions:
- issue: Kurudiwa kwa sala
  choice: Kuhifadhi kwamba Yesu alisali mara ya tatu na kusema tena maneno yaleyale.
  alternative: Kuacha “tena” ya mwisho ili sentensi iwe nyepesi zaidi.
  rationale: Matini ya SBLGNT ina πάλιν mara mbili. Kuzitafsiri zote mbili huhifadhi msisitizo wa simulizi bila kuingiza tafsiri ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. Marudio ya “tena” yamehifadhiwa kwa sababu yanatokana na matini ya Kigiriki, si kwa uzembe wa kimtindo.
