  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: sw
  text: Kwa maana, mwanamke huyu alipomimina manukato haya juu ya mwili wangu, alifanya hivyo kuniandaa kwa mazishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mazishi yangu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuandaa mwili kwa mazishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: alipomimina
  rationale: Ingawa βάλλω mara nyingi humaanisha kutupa au kuweka, katika muktadha huu inamaanisha kumimina au kupaka manukato. Muundo wa “alipomimina” unaonyesha kwa Kiswahili cha kawaida uhusiano wa tendo hilo na kitenzi kikuu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inatanguliza maelezo ya Yesu kuhusu maana ya tendo la mwanamke.
- source_word: αὕτη
  choice: mwanamke huyu
  rationale: Kiwakilishi cha kuonyesha αὕτη kinamtaja mwanamke aliyekuwa akizungumziwa. “Mwanamke huyu” huhifadhi msisitizo wake kwa njia iliyo wazi na ya kawaida.
- source_word: μύρον
  choice: manukato
  rationale: μύρον ni mafuta au marhamu yenye harufu nzuri yaliyotumiwa kupaka mwili. “Manukato” ni neno la kawaida linalofaa katika muktadha huu.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: juu ya mwili wangu
  rationale: ἐπί pamoja na hali ya umilikaji hapa huonyesha mahali ambapo manukato yaliwekwa.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: kuniandaa kwa mazishi
  rationale: πρός pamoja na kitenzi-jina huonyesha kusudi, na ἐνταφιάζω inaweza kumaanisha kuandaa mwili kwa mazishi, si kuuzika tu.
- source_word: ἐποίησεν
  choice: alifanya hivyo
  rationale: ποιέω hapa hurejelea tendo lililoelezwa katika kishazi kilichotangulia. “Alifanya hivyo” huepuka kurudia maneno bila kupoteza uhusiano huo.
theological_decisions:
- issue: Maana ya ἐνταφιάζω kuhusiana na kifo cha Yesu
  choice: Tendo la mwanamke linaelezwa kuwa maandalizi kwa ajili ya mazishi ya Yesu.
  alternative: Tendo hilo lilikuwa tu “kwa ajili ya mazishi yangu,” bila kutaja wazi maandalizi.
  rationale: Maana ya kitenzi ἐνταφιάζω inahusisha kuandaa mwili kwa mazishi. Tafsiri hii huhifadhi namna Yesu anavyolitafsiri tendo hilo mapema bila kuongeza dai jingine la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mwanamke huyu” huhifadhi nguvu ya kiwakilishi cha kuonyesha, huku “alipomimina” na “alifanya hivyo” zikitoa mtiririko wa kawaida wa Kiswahili.
