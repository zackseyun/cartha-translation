lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Yesu alipokuwa
  rationale: Muundo huu wa genitivi huru unaweka mazingira ya wakati. “Yesu alipokuwa” ni Kiswahili cha kawaida kinachohifadhi maana ya kimazingira bila kutafsiri γίνομαι kwa namna ya neno kwa neno.
- source_word: δὲ
  choice: haikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha mpito wa simulizi, si alama ya upinzani. Mtiririko wa sentensi ya Kiswahili unaonyesha mpito huo bila kuhitaji “basi” au “lakini.”
- source_word: ἐν Βηθανίᾳ
  choice: Bethania
  rationale: Matumizi ya mahali ya ἐν pamoja na jina la eneo yanaelezwa kwa Kiswahili kwa kuwa mtu “Bethania,” bila kulazimika kuongeza “katika.”
- source_word: ἐν οἰκίᾳ
  choice: katika nyumba
  rationale: οἰκία hapa inaelekeza kwenye mahali halisi, hivyo “nyumba” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: Σίμωνος
  choice: ya Simoni
  rationale: Hali ya umilikaji inatambulisha nyumba kuwa ya Simoni.
- source_word: τοῦ λεπροῦ
  choice: mwenye ukoma
  rationale: Hifadhi utambulisho mfupi unaotolewa na maandishi ya Kigiriki. “Ukoma” ni istilahi inayotambulika katika mapokeo ya Biblia, ingawa λεπρός inaweza kurejelea hali mbalimbali za ngozi na haithibitishi utambuzi wa kisasa wa kitabibu.
theological_decisions:
- issue: Iwapo jina la utambulisho la Simoni linaonyesha kwamba bado alikuwa na ukoma
  choice: Simoni mwenye ukoma
  alternative: Simoni aliyekuwa na ukoma; Simoni mwenye ugonjwa wa ngozi
  rationale: Kigiriki kinatumia tu sifa ya kumtambulisha Simoni; hakisemi wazi kama hali hiyo ilikuwa bado ipo au ilikuwa ya zamani. Tafsiri haiongezi simulizi la kuponywa wala utambuzi mahususi wa kitabibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa urahisi wa simulizi; istilahi “mwenye ukoma” imehifadhiwa kwa utambuzi wa kibiblia huku tanbihi ikizuia madai yasiyotolewa na Kigiriki kuhusu hali ya sasa, uponyaji wa zamani, au utambuzi wa kisasa wa kitabibu.
