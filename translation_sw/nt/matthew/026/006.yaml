  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: sw
  text: Yesu alipokuwa Bethania[a], katika nyumba ya Simoni mwenye ukoma[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muundo wa Kigiriki unaweka mazingira ya wakati; pia unaweza kueleweka, “wakati Yesu akiwa Bethania.”
    reason: lexical_alternative
  - marker: b
    text: “Mwenye ukoma” linaakisi neno la Kigiriki lililotumiwa kama sifa ya kumtambulisha Simoni. Neno hilo linaweza kurejelea magonjwa mbalimbali ya ngozi, wala sentensi hii haisemi ikiwa wakati huo bado alikuwa na hali hiyo au alikuwa nayo zamani.
