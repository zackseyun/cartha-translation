  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: sw
  text: Na tazama, mmoja wa wale waliokuwa pamoja na Yesu akanyosha mkono wake, akauchomoa upanga wake, akampiga mtumwa wa kuhani mkuu, akamkata sikio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi msisitizo na hali ya ghafla ya kiashiria hiki cha kisimulizi kwa lugha inayoeleweka.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: mmoja wa wale waliokuwa pamoja na Yesu
  rationale: Inawakilisha muundo wa sehemu bila kumtambulisha mtu huyo zaidi ya maandishi ya Kigiriki.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: akanyosha mkono
  rationale: Ni usemi wa kawaida unaohifadhi tendo lililotangulia kuchomolewa kwa upanga.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: akauchomoa upanga wake
  rationale: ‘Kuchomoa upanga’ ni Kiswahili cha kawaida kwa kuutoa ulipowekwa, na kinahifadhi maana ya tendo hilo.
- source_word: μάχαιραν
  choice: upanga
  rationale: Ni neno pana na la kawaida; ‘kisu kikubwa’ au ‘upanga mfupi’ kungeongeza umahususi usiolazimishwa na muktadha.
- source_word: πατάξας
  choice: akampiga
  rationale: Inatoa kwa uwazi pigo la nguvu bila kutumia lugha ya kizamani.
- source_word: δοῦλον
  choice: mtumwa
  rationale: Inahifadhi hadhi ya kijamii ya mtu aliyekuwa chini ya mamlaka na umiliki wa kuhani mkuu, badala ya kuilainisha kuwa ‘mtumishi’.
- source_word: ἀρχιερέως
  choice: kuhani mkuu
  rationale: Hili ndilo neno sanifu la cheo hiki katika muktadha wa Agano Jipya.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: na kumkata sikio
  rationale: Inaeleza kwa kawaida matokeo ya pigo la upanga na kudumisha kitenzi kikuu cha Kigiriki kama tendo linalofuata.
- source_word: ὠτίον
  choice: sikio
  rationale: Umbo la Kigiriki linaweza kuwa la udogo, lakini ‘sikio’ ndilo neno la kawaida; ‘ndewe’ lingeongeza umahususi usio hakika.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika simulizi lenye hali halisi ya kijamii
  choice: mtumwa
  alternative: mtumishi
  rationale: ‘Mtumwa’ inaonyesha kwa usahihi zaidi hadhi ya kijamii iliyoashiriwa na δοῦλος; ‘mtumishi’ inaweza kuficha hali hiyo, ingawa ndiyo tafsiri mbadala inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya ‘aka-’ unatoa mwendo wa haraka wa simulizi. Alama [a] imewekwa baada ya ‘sikio,’ neno linalohusika moja kwa moja na tanbihi.
