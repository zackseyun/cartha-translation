lexical_decisions:
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno maalumu)
  rationale: Ni kiunganishi hafifu cha kusogeza simulizi mbele; katika Kiswahili mtiririko wa sentensi ni wa asili bila kuongeza ‘basi’ au ‘lakini,’ ambazo zingeweza kuzidisha nguvu yake.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni neno la kawaida na sahihi kwa viongozi wa juu wa kikuhani, bila kudokeza kwamba wote walikuwa wanashikilia cheo kimoja cha kuhani mkuu kwa wakati mmoja.
- source_word: συνέδριον ὅλον
  choice: baraza lote
  rationale: ‘Baraza’ linaeleweka kwa wasomaji wa kawaida, nalo ‘lote’ linaakisi ὅλον na kusisitiza baraza kama chombo kizima.
- source_word: ἐζήτουν
  choice: walikuwa wakitafuta
  rationale: Muundo endelevu unaonyesha juhudi iliyokuwa ikiendelea, kwa kufuata hali isiyotimilika ya kitenzi cha Kigiriki.
- source_word: ψευδομαρτυρίαν
  choice: ushahidi wa uongo
  rationale: Katika muktadha wa kisheria, kifungu hiki kinaeleza ushahidi au ushuhuda wa uongo kwa lugha ya sasa na iliyo wazi; neno la Kigiriki linaweza pia kueleweka kama ‘ushuhuda wa uongo.’
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: dhidi ya Yesu
  rationale: Huwasilisha upinzani ulioelekezwa kwa Yesu katika shauri la hukumu.
- source_word: ὅπως
  choice: ili
  rationale: Huonyesha wazi kusudi la utafutaji wao kwa Kiswahili cha kawaida.
- source_word: αὐτὸν θανατώσωσιν
  choice: wapate kumuua
  rationale: Huhifadhi kusudi la kumsababishia Yesu kifo bila kuongeza wazo mahususi zaidi la utaratibu wa kunyongwa au kuuawa rasmi.
theological_decisions:
- issue: Dhamira ya viongozi katika shauri la hukumu
  choice: Sentensi inaonyesha utafutaji endelevu wa ushahidi wa uongo kwa kusudi la kumuua Yesu.
  alternative: Inaweza kufupishwa kuwa ‘walitafuta ushuhuda wa uongo ili wamuue Yesu.’
  rationale: Hali isiyotimilika ya ἐζήτουν pamoja na kishazi cha kusudi ὅπως...θανατώσωσιν huonyesha njama ya makusudi iliyokuwa ikiendelea, bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka. Muundo ‘walikuwa wakitafuta’ huhifadhi tendo endelevu, na ‘baraza lote’ huepuka kutegemea istilahi ya kigeni katika maandishi makuu.
