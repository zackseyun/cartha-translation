translation:
  language: sw
  text: Makuhani wakuu na baraza lote[b] walikuwa wakitafuta ushuhuda wa uongo[a] dhidi ya Yesu ili wamuue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushahidi wa uongo.” Neno la Kigiriki humaanisha ushuhuda wa uongo katika muktadha wa kisheria.
