id: MAT.26.39
reference: Matthew 26:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: sw
  text: Akaenda mbele kidogo, akaanguka chini kifudifudi[a], akaomba akisema, “Baba yangu, ikiwezekana, kikombe hiki[b] kiniepuke; hata hivyo, si kama nitakavyo mimi, bali kama utakavyo wewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, akaanguka chini uso wake ukielekea ardhini.
    reason: lexical_alternative
  - marker: b
    text: Katika Biblia, “kikombe” ni taswira ya sehemu iliyowekwa kwa mtu, hasa mateso; linganisha Mathayo 20:22 na 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: akaenda mbele kidogo
  rationale: Kauli hii inaonyesha kwenda umbali mfupi zaidi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mwendo wa simulizi.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: akaanguka chini kifudifudi
  rationale: Hii inaeleza kujitupa chini uso ukielekea ardhini, yaani mkao wa kujinyenyekeza katika sala. ‘Kifudifudi’ ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: προσευχόμενος καὶ λέγων
  choice: akaomba akisema
  rationale: Vitenzi hivi vinaonyesha kwamba maneno yanayofuata ndiyo yaliyokuwa sala yake. Muundo huu ni wa asili katika masimulizi ya Kiswahili.
- source_word: Πάτερ μου
  choice: Baba yangu
  rationale: Inahifadhi ukaribu na heshima ya mwito wa moja kwa moja bila kuongeza hisia zisizotajwa katika Kigiriki.
- source_word: εἰ δυνατόν ἐστιν
  choice: ikiwezekana
  rationale: Ni usemi mfupi na wa asili unaowakilisha sharti la Kigiriki bila kuongeza kiwakilishi kisichokuwapo katika matini.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: kiniepuke
  rationale: Katika muktadha wa ‘kikombe,’ kitenzi hiki kinaeleza ombi kwamba sehemu hiyo isimpate Yesu. Kinadumisha taswira bila kuifafanua kuwa mateso moja kwa moja.
- source_word: τὸ ποτήριον τοῦτο
  choice: kikombe hiki
  rationale: Tafsiri halisi inadumisha taswira muhimu ya kibiblia ya sehemu iliyowekwa kwa mtu, hasa mateso, bila kuamua maana yote katika matini kuu.
- source_word: πλὴν
  choice: hata hivyo
  rationale: Inaonyesha kwa wazi ugeuzi wenye nguvu kutoka katika ombi la kwanza kwenda katika kujisalimisha kwa mapenzi ya Baba.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: si kama nitakavyo mimi, bali kama utakavyo wewe
  rationale: Inahifadhi tofauti kati ya mapenzi ya Yesu na ya Baba. Kurudia kitenzi katika kipashio cha pili hufanya maana iliyodokezwa katika Kigiriki iwe wazi kwa Kiswahili.
theological_decisions:
- issue: Taswira ya ‘kikombe’ katika sala ya Yesu
  choice: Taswira halisi ‘kikombe hiki’ imedumishwa katika matini kuu.
  alternative: mateso haya; sehemu hii niliyowekewa
  rationale: ποτήριον ni kikombe kwa maana halisi, lakini hapa kimetumiwa kama taswira ya sehemu iliyowekwa, hasa mateso. Kudumisha taswira kunahifadhi uhusiano wake na matumizi mengine ya kibiblia na kuepuka kuifasiri kupita kiasi.
- issue: Mapenzi ya Yesu yakilinganishwa na mapenzi ya Baba
  choice: si kama nitakavyo mimi, bali kama utakavyo wewe
  alternative: si kama ninavyotaka mimi, bali kama unavyotaka wewe
  rationale: '‘Nitakavyo’ inadumisha uzito wa wazo la nia au mapenzi na pia mvutano wa matini: Yesu anaeleza ombi lake la kweli huku akijisalimisha kwa mapenzi ya Baba.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. ‘Kifudifudi’ na ‘kikombe’ zinadumisha picha halisi za matini, huku ‘hata hivyo’ ikionyesha wazi tofauti kuu katika sala.
