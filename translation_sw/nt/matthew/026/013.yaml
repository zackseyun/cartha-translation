id: MAT.26.13
reference: Matthew 26:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: sw
  text: Kweli ninawaambia, popote habari njema hii[a] itakapohubiriwa ulimwenguni kote, jambo alilofanya mwanamke huyu pia litasimuliwa kwa ukumbusho wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Injili hii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “pia litazungumziwa ili akumbukwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Katika kauli za Yesu neno hili huanzisha uthibitisho mzito. “Kweli” ni Kiswahili cha kawaida na chenye hadhi, na huhifadhi nguvu ya kauli bila kulazimisha unukuzi “Amina”.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi nafsi ya kwanza na maelekezo ya moja kwa moja kwa wasikilizaji kwa Kiswahili cha kawaida.
- source_word: ὅπου ἐὰν
  choice: popote
  rationale: Muunganiko huu una maana ya mahali pasipoainishwa; “popote” huutoa kwa ufupi na kwa kawaida.
- source_word: κηρυχθῇ
  choice: itakapohubiriwa
  rationale: Kitenzi hiki ni cha kutendwa na kina maana ya kutangaza hadharani kama mjumbe. “Kuhubiriwa” ni cha kawaida katika muktadha wa kutangaza habari njema na huhifadhi dhana hiyo.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: habari njema hii
  rationale: “Habari njema” huwasilisha maana ya msingi ya εὐαγγέλιον kwa lugha inayoeleweka; “Injili hii” imehifadhiwa kama mbadala wa kimapokeo katika tanbihi.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: ulimwenguni kote
  rationale: Hutoa kwa kawaida wigo mpana wa mahali unaoonyeshwa na kirai cha Kigiriki.
- source_word: λαληθήσεται
  choice: litasimuliwa
  rationale: Kwa kuwa kinachozungumziwa ni tendo la mwanamke, “litasimuliwa” ni Kiswahili cha kawaida kinachoonyesha kwamba tendo hilo litaelezwa, huku hali ya kutendwa ikihifadhiwa.
- source_word: ὃ ἐποίησεν αὕτη
  choice: jambo alilofanya mwanamke huyu
  rationale: Kiwakilishi cha Kigiriki hurejelea tendo, na αὕτη humrejelea mwanamke wa muktadha. Kutaja “jambo” na “mwanamke” huweka rejeo wazi bila kuongeza wazo jipya.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: kwa ukumbusho wake
  rationale: Huhifadhi muundo wa ukumbusho na nguvu ya kumkumbuka mwanamke huyo bila kuamua zaidi kama kirai kinaeleza kusudi au namna ya kusimulia.
theological_decisions:
- issue: Utoaji wa εὐαγγέλιον
  choice: habari njema
  alternative: Injili
  rationale: Hili hasa ni chaguo la kileksika lenye athari ya rejesta ya kitheolojia. “Habari njema” huonyesha maana ya neno la Kigiriki kwa uwazi, huku “Injili” ikibaki mbadala halali wa kimapokeo.
- issue: Uhusiano wa εἰς μνημόσυνον αὐτῆς na kusimuliwa kwa tendo
  choice: kwa ukumbusho wake
  alternative: ili akumbukwe
  rationale: Muundo wa nomino umehifadhiwa ili kutofafanua kimya kimya kirai hicho kuwa cha kusudi pekee; tafsiri ya kusudi ni halali lakini inaeleza zaidi kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “Kweli ninawaambia” badala ya unukuzi “Amina,” na “ulimwenguni kote” kwa mtiririko wa kawaida. “Habari njema hii” imeandikwa kwa herufi ndogo kama kirai cha kawaida; tanbihi inahifadhi istilahi ya kimapokeo “Injili.”
