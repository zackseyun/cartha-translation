base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: sw
  text: Ndipo makuhani wakuu na wazee wa watu wakakusanyika katika ua[a] wa kuhani mkuu, aliyeitwa Kayafa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikulu ya kuhani mkuu.” Neno la Kigiriki linaweza kumaanisha ua au makao makubwa yenye ua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfuatano wa matukio kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: συνήχθησαν
  choice: wakakusanyika
  rationale: Kitenzi hiki huonyesha kwamba kundi lilikusanyika mahali pamoja. Ingawa Kigiriki kina umbo la kutendwa, Kiswahili hutumia umbo hili la kutenda kwa uasilia bila kubadili maana ya tukio.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni neno la kawaida kwa viongozi wa juu wa kikuhani, si watu wengi waliokuwa kila mmoja na cheo cha kuhani mkuu.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: wazee wa watu
  rationale: Huhifadhi uhusiano wa maneno ya Kigiriki na kutaja viongozi waliotambuliwa miongoni mwa watu.
- source_word: εἰς τὴν αὐλὴν
  choice: katika ua
  rationale: Pamoja na kitenzi cha kukusanyika, Kiswahili hutaja kwa uasilia mahali walipokusanyika. αὐλή hapa yaweza kumaanisha ua wa makao makubwa.
- source_word: τοῦ ἀρχιερέως
  choice: wa kuhani mkuu
  rationale: Hutaja kwa usahihi mwenye cheo hicho katika umoja.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: aliyeitwa Kayafa
  rationale: Hufuata kirai cha Kigiriki kinachomtambulisha kuhani mkuu kwa jina, huku jina likiandikwa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions: []
