  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: sw
  text: Kisha mmoja wa wale kumi na wawili[a], aliyeitwa Yuda Iskariote, akaenda kwa makuhani wakuu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja wa wale Kumi na Wawili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi; “Kisha” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: πορευθεὶς
  choice: akaenda
  rationale: Ingawa kwa umbo ni participio ya aoristi, hapa inaeleza kitendo kinachotangulia na kuelekea kwa makuhani wakuu; “akaenda” huwasilisha kwa ufasaha mfuatano huo wa simulizi.
- source_word: εἷς τῶν δώδεκα
  choice: mmoja wa wale kumi na wawili
  rationale: Huhifadhi muundo wa sehemu ya kundi na kubainisha kuwa ni wale kumi na wawili wanaojulikana katika simulizi, bila kutegemea herufi kubwa kama alama ya jina la kundi.
- source_word: ὁ λεγόμενος
  choice: aliyeitwa
  rationale: Huwasilisha utambulisho wa kiambatisho kwa Kiswahili cha asili; inaweza pia kueleweka “aliyejulikana kama.”
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Yuda Iskariote
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: kwa makuhani wakuu
  rationale: πρός pamoja na hali ya accusative huonyesha mwendo kuelekea kwa watu hao. “Makuhani wakuu” ni istilahi ya kawaida kwa viongozi wa juu wa kikuhani, si makuhani wote wala kuhani mkuu mmoja tu.
theological_decisions:
- issue: Namna ya kutaja kundi τῶν δώδεκα
  choice: mmoja wa wale kumi na wawili
  alternative: mmoja wa wale Kumi na Wawili
  rationale: Kigiriki hakionyeshi tofauti ya herufi kubwa na ndogo. Maandishi makuu yanatumia maelezo ya kawaida ya kundi, huku tanbihi ikihifadhi uwezekano wa kuliona kama jina maalumu la kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “akaenda” unaendeleza simulizi kwa kawaida; “wale kumi na wawili” ni wazi kwa msomaji wa kawaida. Koma ya mwisho imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
