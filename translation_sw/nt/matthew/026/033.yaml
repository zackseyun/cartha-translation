  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: sw
  text: Lakini Petro akamjibu, “Hata kama wote wataanguka kwa sababu yako, mimi sitaanguka kamwe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watajikwaa” au “watakwazwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kujikwaa, kuchukizwa, au kuanguka na kuacha uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Lakini Petro akamjibu
  rationale: Muundo wa Kigiriki wenye kitenzi-shirikishi na kitenzi cha kusema ni tamathali ya kawaida ya simulizi, ‘akajibu akamwambia.’ Kiswahili cha kawaida huuwasilisha kwa ufupi kama ‘akamjibu,’ huku δέ ikionyesha tofauti ndogo na maneno ya Yesu yaliyotangulia.
- source_word: Εἰ πάντες
  choice: Hata kama wote
  rationale: Ingawa εἰ kimsingi ni ‘kama,’ hapa sentensi ina nguvu ya kukubali jambo kwa hoja ili Petro ajitofautishe na wengine; ‘hata kama’ huwasilisha maana hiyo kwa kawaida.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: wataanguka / sitaanguka
  rationale: Katika muktadha huu kitenzi kinamaanisha kukwazwa hadi kushindwa katika uaminifu au kumwacha Yesu. ‘Kuanguka’ ni ya asili na yenye upana wa kutosha kwa Kiswahili, bila kulazimisha wazo la uasi wa mwisho.
- source_word: ἐν σοί
  choice: kwa sababu yako
  rationale: Kirai hiki, kikihusishwa na σκανδαλίζω, kinaonyesha kwamba Yesu ndiye sababu au kiini cha kukwazwa kwao; ‘kwa sababu yako’ ni Kiswahili wazi na cha kawaida.
- source_word: ἐγὼ οὐδέποτε
  choice: mimi ... kamwe
  rationale: Kiwakilishi ἐγώ kimetajwa kwa msisitizo ili kumtofautisha Petro na ‘wote,’ na οὐδέποτε ni kanusho la nguvu la wakati. ‘Mimi ... kamwe’ huhifadhi misisitizo yote miwili.
theological_decisions:
- issue: Maana ya σκανδαλίζω katika muktadha wa kushindwa kwa wanafunzi
  choice: kuanguka
  alternative: kukwazika; kuacha uaminifu
  rationale: ‘Kuanguka’ huonyesha kushindwa kwa uzito katika ufuasi na uaminifu, lakini haifafanui kimadhehebu kama ni uasi wa mwisho. Tanbihi huhifadhi upana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamjibu’ ni mtiririko wa kawaida wa simulizi; ‘mimi ... kamwe’ huhifadhi msisitizo wa Petro. Alama ya tanbihi imewekwa baada ya nukuu nzima ili kueleza matumizi yote mawili ya kitenzi katika mstari.
