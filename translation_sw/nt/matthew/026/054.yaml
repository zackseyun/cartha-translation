  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: sw
  text: Basi, Maandiko yangetimizwaje[a] kwamba ni lazima iwe hivi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, Maandiko yangewezaje kutimizwa, kwamba ni lazima iwe hivyo?”
    reason: Mbadala huu unaweka wazi zaidi wazo la uwezekano katika πληρωθῶσιν na kutafsiri οὕτως kwa “hivyo.”
lexical_decisions:
- source_word: πῶς
  choice: -vipi / -waje
  rationale: Kielezi cha kuuliza kinaanzisha swali la balagha. Muundo “yangetimizwaje” ni wa asili katika Kiswahili na unahifadhi nguvu ya swali.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu kutotumia upinzani wa nguvu.
- source_word: πληρωθῶσιν
  choice: yangetimizwaje
  rationale: 'Kauli tendwa tegemezi katika swali la balagha inaonyesha uwezekano wenye hali ya masharti: kama mambo yangeenda tofauti, Maandiko yasingetimizwa.'
- source_word: αἱ γραφαὶ
  choice: Maandiko
  rationale: Wingi wa γραφή hapa unarejelea maandiko matakatifu ya Israeli; “Maandiko” ni istilahi ya kawaida na yenye heshima.
- source_word: ὅτι
  choice: kwamba
  rationale: Inaingiza maudhui yanayoelezwa na Maandiko, yaani kwamba matukio hayo lazima yawe kwa namna hii.
- source_word: οὕτως
  choice: hivi
  rationale: Inarejelea namna ambayo kukamatwa na mateso ya Yesu yanaendelea; “hivi” ni fupi na ya asili.
- source_word: δεῖ
  choice: ni lazima
  rationale: Inahifadhi wazo la ulazima bila kuongeza maelezo yasiyotajwa wazi kuhusu chanzo au mpango wa ulazima huo.
- source_word: γενέσθαι
  choice: iwe
  rationale: Katika muundo “ni lazima iwe hivi,” kitenzi hiki kinaeleza kutokea kwa mambo kwa namna hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Aina ya ulazima unaoonyeshwa na δεῖ
  choice: ni lazima iwe hivi
  alternative: ni lazima yatukie hivi kulingana na mpango wa Mungu
  rationale: Utimizo wa Maandiko unaashiria ulazima wa kimungu, lakini Kigiriki hakiongezi wazi maneno “kulingana na mpango wa Mungu.” Tafsiri haiongezi ufafanuzi wa kiteolojia.
- issue: Uhusiano wa ὅτι na swali kuu
  choice: kwamba ni lazima iwe hivi
  alternative: kwa kuwa ni lazima iwe hivi
  rationale: “Kwamba” inahifadhi uwezekano kwamba ὅτι inaanzisha maudhui ya Maandiko, badala ya kuamua bila shaka kwamba ni sababu ya swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kigiriki, huku swali la balagha na hali ya masharti vikihifadhiwa.
