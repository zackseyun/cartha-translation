base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: sw
  text: Tena, akaenda zake kwa mara ya pili, akasali akisema, “Baba yangu, ikiwa hiki[a] hakiwezi kupita nisipokinywa, mapenzi yako yatimizwe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hiki” na kiambishi “-ki-” katika “nisipokinywa” vinarejelea kikombe cha mateso kilichotajwa katika mstari uliotangulia; Kigiriki hapa hakirudii neno “kikombe,” bali hutumia demonstrativi na kiwakilishi.
    reason: cross_reference
  - marker: b
    text: 'Au: “ikiwa hiki hakiwezi kupita isipokuwa nikinywe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Tena, ... mara ya pili
  rationale: Maneno haya yanahifadhi vipengele vyote viwili vya Kigiriki vinavyoonyesha kurudiwa kwa tendo, bila kuvifupisha kuwa usemi mmoja.
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: akaenda ... akasali akisema
  rationale: Mfuatano wa vitenzi vya usimulizi ni wa kawaida katika Kiswahili na unaonyesha kwamba aliondoka, kisha akasali kwa maneno yanayofuata.
- source_word: Πάτερ μου
  choice: Baba yangu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya wito wa Yesu kwa Baba.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: ikiwa hiki hakiwezi kupita
  rationale: Huhifadhi maana ya kutowezekana pamoja na kitenzi ‘kupita,’ bila kuongeza wazi nomino ‘kikombe’ ambayo haijarudiwa katika mstari huu. Ngeli ya ‘hiki’ inaunganisha rejeo hili na ‘kikombe’ katika muktadha uliotangulia.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: nisipokinywa
  rationale: Muundo huu wa Kiswahili unatoa maana ya ‘isipokuwa nikinywe’ kwa ufupi na kwa kawaida, huku kiambishi ‘-ki-’ kikirejelea kile kilichotajwa katika muktadha.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: mapenzi yako yatimizwe
  rationale: Huhifadhi ombi la kujisalimisha kwa mapenzi ya Mungu na nguvu ya kauli ya ombi, kwa lugha yenye hadhi na iliyozoeleka.
theological_decisions:
- issue: Iwapo kutaja ‘kikombe’ wazi katika matini kuu kwa τοῦτο / αὐτό
  choice: Kutumia ‘hiki’ na ‘-ki-’ bila kurudia nomino ‘kikombe’
  alternative: ‘ikiwa kikombe hiki hakiwezi kupita nisipokinywa’
  rationale: Muktadha wa Mathayo 26:39 unaonyesha kuwa Yesu anazungumzia kikombe cha mateso, lakini mstari huu haurudii neno ποτήριον. Kiswahili huhitaji upatanisho wa ngeli, hivyo ngeli ya kikombe inahifadhi rejeo la muktadha bila kuongeza nomino yenyewe.
- issue: Namna ya kutafsiri ombi la Yesu la kujisalimisha
  choice: mapenzi yako yatimizwe
  alternative: mapenzi yako yafanyike
  rationale: Usemi huu unaonyesha wazi kutimizwa kwa mapenzi ya Baba na kuhifadhi uzito wa kitheolojia wa kujisalimisha, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa usimulizi na hadhi inayofaa kwa sala. Kurudiwa kwa ‘tena’ na ‘mara ya pili’ kumehifadhiwa kwa sababu vyote vipo katika Kigiriki. Upatanisho wa ngeli ya KI-VI umetumika kudokeza rejeo la kikombe bila kuingiza nomino hiyo katika matini kuu.
