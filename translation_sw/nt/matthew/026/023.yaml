  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: sw
  text: Akajibu, “Yule aliyechovya mkono wake pamoja nami katika bakuli[a] ndiye atakayenisaliti[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika sahani.”
    reason: lexical_alternative
  - marker: b
    text: Au “atakayenikabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Akajibu
  rationale: Muundo huu wa kishiriki pamoja na kitenzi kikuu kwa kawaida una maana ya ‘akajibu’; kutafsiri vitenzi vyote viwili kungefanya Kiswahili kisikike kizito bila kuongeza maana.
- source_word: ἐμβάψας
  choice: aliyechovya
  rationale: Kishiriki cha wakati uliopita kinaonyesha tendo lililofanyika la kuingiza mkono katika chakula; ‘aliyechovya’ ni Kiswahili cha kawaida na huhifadhi wakati wa tendo hilo.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Huwakilisha wazi wazo la kuandamana au kufanya tendo kwa pamoja.
- source_word: τὴν χεῖρα
  choice: mkono wake
  rationale: Ingawa Kigiriki hutumia kibainishi, Kiswahili kwa kawaida hutumia umilikishi hapa ili kuonyesha kuwa ni mkono wa mtu huyo mwenyewe.
- source_word: ἐν τῷ τρυβλίῳ
  choice: katika bakuli
  rationale: τρύβλιον ni chombo cha chakula kinachoweza kuitwa bakuli au sahani; ‘bakuli’ ni neno la kawaida na linaloeleweka, huku ‘sahani’ ikihifadhiwa katika tanbihi.
- source_word: οὗτός
  choice: ndiye
  rationale: ‘Ndiye’ huhifadhi msisitizo wa kiwakilishi elekezi cha Kigiriki kwa njia ya asili katika Kiswahili.
- source_word: παραδώσει
  choice: atakayenisaliti
  rationale: Katika muktadha wa Yuda kumkabidhi Yesu kwa hila, ‘kusaliti’ huwasilisha maana ya kimuktadha; maana ya moja kwa moja zaidi, ‘kunikabidhi,’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya παραδίδωμι katika muktadha wa Yuda
  choice: atakayenisaliti
  alternative: atakayenikabidhi
  rationale: Kitenzi kinaweza kumaanisha ‘kukabidhi,’ lakini muktadha wa uhusiano na tendo la Yuda unaipa maana ya usaliti. ‘Atakayenisaliti’ huonyesha maana hiyo bila kuongeza fundisho la dhehebu, na tafsiri ya moja kwa moja zaidi imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘ndiye atakayenisaliti’ huhifadhi msisitizo wa οὗτός bila kuwa mgumu.
