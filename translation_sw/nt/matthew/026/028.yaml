source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: sw
  text: Kwa maana hii ni damu yangu ya agano[a], inayomwagwa kwa ajili ya wengi[b] kwa msamaha wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasema, “damu yangu ya agano jipya.”
    reason: textual_variant
  - marker: b
    text: Au, “kwa niaba ya wengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hii
  rationale: Kiwakilishi hiki kinarejelea kile ambacho Yesu anawapa katika mlo. Kigiriki kinasema tu “hii”; hakitaji “kikombe” katika kishazi hiki.
- source_word: γάρ
  choice: kwa maana
  rationale: Inaonyesha maelezo yanayounga kauli hii na agizo lililotangulia la kunywa, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸ αἷμά μου
  choice: damu yangu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana ya dhabihu na agano bila kuifafanua kupita maandishi.
- source_word: τῆς διαθήκης
  choice: ya agano
  rationale: SBLGNT inasema “ya agano” bila neno “jipya.” Tofauti yenye “jipya” imehifadhiwa katika tanbihi.
- source_word: περὶ πολλῶν
  choice: kwa ajili ya wengi
  rationale: Katika muktadha huu wa dhabihu, περί pamoja na hali ya umilikishi huonyesha manufaa au kutenda kwa niaba ya wengine. Tafsiri hii ni ya kawaida na haiamui mjadala wa kitheolojia kuhusu upeo wa upatanisho.
- source_word: ἐκχυννόμενον
  choice: inayomwagwa
  rationale: Huhifadhi taswira ya damu kumwagwa na kutafsiri kihusishi tendwa cha wakati uliopo kwa namna ya asili katika Kiswahili.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: kwa msamaha wa dhambi
  rationale: Ni usemi wazi na wa kawaida unaohifadhi uhusiano wa kusudi au matokeo bila kuamua zaidi ya inavyosema Kigiriki.
theological_decisions:
- issue: Iwapo neno “jipya” liongezwe kabla ya “agano”
  choice: ya agano
  alternative: ya agano jipya
  rationale: Maandishi ya msingi yaliyotolewa hayana καινῆς (“jipya”). Kwa hiyo neno hilo halijaingizwa katika matini kuu, lakini usomaji wake katika baadhi ya hati umeonyeshwa katika tanbihi.
- issue: Maana ya “kwa ajili ya wengi” katika lugha ya upatanisho
  choice: kwa ajili ya wengi
  alternative: kwa ajili ya wote
  rationale: Kigiriki kinasema πολλῶν, yaani “wengi.” Tafsiri inahifadhi usemi huo bila kuamua mjadala mpana wa kitheolojia kuhusu upeo wa upatanisho.
- issue: Nguvu ya εἰς katika “kwa msamaha wa dhambi”
  choice: kwa msamaha wa dhambi
  alternative: ili dhambi zisamehewe
  rationale: Usemi wa nomino unafuata muundo wa Kigiriki kwa karibu na unaweza kubeba wazo la kusudi au matokeo bila kulazimisha tofauti ambayo muktadha hauitatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “hii ni damu yangu” ni wa moja kwa moja; “inayomwagwa” huhifadhi taswira ya dhabihu, na tanbihi zote zimewekewa alama katika matini kuu.
