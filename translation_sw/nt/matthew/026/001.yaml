lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Yesu alipomaliza
  rationale: Muundo huu wa simulizi una ladha ya Kisemiti na huanzisha kishazi cha wakati. Kiswahili cha kawaida hutumia “alipomaliza” kwa ufasaha, bila kauli nzito “ikawa kwamba.”
- source_word: ἐτέλεσεν
  choice: alipomaliza kusema
  rationale: Kitenzi kinaonyesha kwamba tendo lilikuwa limekamilika kabla ya Yesu kusema na wanafunzi. Neno “kusema” limeongezwa kwa uwazi wa kawaida wa Kiswahili kwa sababu kinachomalizika ni hotuba inayotajwa kama “maneno.”
- source_word: πάντας τοὺς λόγους τούτους
  choice: maneno haya yote
  rationale: Huhifadhi maana ya moja kwa moja ya λόγους na pia huonyesha kufungwa kwa sehemu ya hotuba katika Mathayo.
- source_word: εἶπεν
  choice: aliwaambia
  rationale: Katika Kiswahili, “aliwaambia” ni njia ya kawaida ya kuwasilisha kusema kunakoelekezwa kwa watu; haiongezi maudhui zaidi ya yaliyo katika Kigiriki.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: Huhifadhi nomino “wanafunzi” na kiwakilishi cha umilikaji kilicho wazi katika αὐτοῦ.
