id: MAT.26.48
reference: Matthew 26:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: sw
  text: Yule aliyekuwa akimsaliti[a] alikuwa amewapa ishara[b], akisema, “Yule nitakayembusu ndiye huyo; mkamateni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyekuwa akimkabidhi.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumkabidhi,” lakini katika muktadha huu kinarejelea usaliti wa Yuda.
    reason: lexical_alternative
  - marker: b
    text: Au “alama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: aliyekuwa akimsaliti
  rationale: Katika muktadha wa mateso ya Yesu, kitenzi hiki hakimaanishi tu kumkabidhi mtu, bali tendo la Yuda la kumsaliti. Muundo huu pia unaonyesha tendo linalohusika wakati huo.
- source_word: σημεῖον
  choice: ishara
  rationale: Neno hili hapa ni alama iliyopangwa mapema ili kumtambua Yesu; “ishara” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: Ὃν ἂν φιλήσω
  choice: Yule nitakayembusu
  rationale: Muundo huu unahifadhi maana ya kishazi cha uhusiano kisichomtaja mtu mapema na unasikika kwa kawaida katika Kiswahili.
- source_word: φιλήσω
  choice: nitakayembusu
  rationale: Kitenzi kinamaanisha kumbusu; hakuna haja ya kuongeza wazo la kumsalimu kwa busu, ambalo halijaelezwa wazi katika Kigiriki.
- source_word: αὐτός ἐστιν
  choice: ndiye huyo
  rationale: Usemi huu unamtambulisha Yesu kwa mkazo na kwa ufupi, kama ilivyo katika Kigiriki.
- source_word: κρατήσατε
  choice: mkamateni
  rationale: Katika mazingira haya ya kukamatwa kwa nguvu, “mkamateni” huwasilisha tendo la kumshika na kumzuia bila kulazimisha istilahi ya kiutaratibu wa kisheria.
theological_decisions:
- issue: Uzito wa kimaadili wa παραδιδοὺς inapomtaja Yuda
  choice: aliyekuwa akimsaliti
  alternative: aliyekuwa akimkabidhi
  rationale: Muktadha wa simulizi unaonyesha kuwa kumkabidhi Yesu kulikuwa usaliti. Tafsiri hii inadhihirisha maana ya muktadha bila kuongeza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi ufupi, mkazo, na maana ya chanzo cha Kigiriki. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
