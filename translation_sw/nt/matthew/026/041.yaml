source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: sw
  text: Kesheni na ombeni, ili msiingie katika majaribu.[a] Kwa kweli roho iko tayari, lakini mwili ni dhaifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jaribio” au “hali ya kujaribiwa.” Neno la Kigiriki linaweza kumaanisha kushawishiwa kutenda dhambi au kupitia jaribio gumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Kesheni
  rationale: Kitenzi cha amri kwa wingi kinamaanisha kuwa macho au kukesha. Katika mazingira ya Gethsemane, “Kesheni” kinahifadhi maana halisi ya kutolala pamoja na wazo la kuwa waangalifu kiroho.
- source_word: προσεύχεσθε
  choice: kuomba
  rationale: Hii ni amri ya kuendelea kusali; baada ya “Kesheni na,” umbo “kuomba” ni la kawaida na wazi katika Kiswahili.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: ili msiingie
  rationale: Kinahifadhi kishazi cha kusudi au kuzuia na pia sitiari ya kuingia, badala ya kukifasiri kuwa “msianguke.”
- source_word: πειρασμόν
  choice: majaribu
  rationale: “Majaribu” ni neno la kawaida linaloweza kumaanisha vishawishi vya kutenda dhambi au hali ya kujaribiwa; upana huo wa maana unaelezwa katika tanbihi.
- source_word: τὸ μὲν πνεῦμα
  choice: Kwa kweli roho
  rationale: “Roho” hapa inaeleweka kwa kawaida kuwa nia ya ndani ya mwanadamu. “Kwa kweli” huleta nguvu ya μέν katika utofautishaji unaofuatwa na “lakini.”
- source_word: πρόθυμον
  choice: iko tayari
  rationale: “Tayari” huwasilisha utayari au nia ya dhati bila kuongeza hisia kali ya shauku.
- source_word: ἡ δὲ σὰρξ
  choice: lakini mwili
  rationale: Katika Kiswahili cha kawaida, “mwili” huwasilisha udhaifu wa kibinadamu unaohusishwa na σάρξ hapa kwa uwazi zaidi kuliko “nyama,” bila kuingiza dhana ya “asili ya dhambi.”
- source_word: ἀσθενής
  choice: ni dhaifu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya udhaifu unaotofautishwa na utayari wa roho.
theological_decisions:
- issue: Kirejelewa cha πνεῦμα
  choice: roho ya mwanadamu au nia yake ya ndani
  alternative: Roho Mtakatifu
  rationale: Utofautishaji na mwili, pamoja na muktadha wa nia njema ya wanafunzi na kushindwa kwao, unaelekea kumaanisha roho ya mwanadamu. Herufi ndogo huepuka kuingiza dai la moja kwa moja kuhusu Roho Mtakatifu.
- issue: Tafsiri ya σάρξ
  choice: mwili
  alternative: nyama; asili ya dhambi
  rationale: Hapa neno linahusu udhaifu wa kibinadamu wa kiumbe mwenye mwili, si lazima dhana maalumu ya asili yenye dhambi. “Mwili” ni ya asili katika Kiswahili na haifafanui kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kesheni” kinafaa kwa mazingira ya wanafunzi waliolala na pia hudokeza uangalifu wa kiroho. “Mwili” limetumiwa badala ya “nyama” kwa kuwa ni la kawaida zaidi katika msemo huu na huepuka maana isiyokusudiwa ya nyama halisi.
