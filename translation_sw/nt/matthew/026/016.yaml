  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: sw
  text: Tangu wakati huo, alikuwa akitafuta nafasi ya kumkabidhi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumsaliti.” Kitenzi cha Kigiriki kina maana ya msingi ya “kumkabidhi” au “kumtia mikononi mwa wengine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Tangu wakati huo
  rationale: Huwasilisha mwanzo wa kipindi kinachoendelea, kama inavyoonyeshwa na ἀπό pamoja na τότε, kwa Kiswahili cha kawaida.
- source_word: ἐζήτει
  choice: alianza kutafuta
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililoendelea kuanzia wakati huo; muundo huu unaunganika kwa kawaida na “Tangu wakati huo” na kuhifadhi wazo la kutafuta kwa kuendelea.
- source_word: εὐκαιρίαν
  choice: nafasi
  rationale: Katika muktadha huu, “nafasi” ni fursa au wakati unaofaa wa kutenda, na ni usemi wa kawaida wa Kiswahili.
- source_word: ἵνα
  choice: ya
  rationale: Kiunganishi hiki katika “nafasi ya kumkabidhi” huonyesha kusudi kwa ufupi na kwa Kiswahili cha asili.
- source_word: αὐτὸν
  choice: m- katika kumkabidhi
  rationale: Kiambishi cha yambwa “m-” kinamrejelea Yesu kulingana na muktadha.
- source_word: παραδῷ
  choice: kumkabidhi
  rationale: “Kumkabidhi” huhifadhi maana ya msingi ya παραδίδωμι, yaani kumtia mtu mikononi au chini ya mamlaka ya wengine, bila kuifanya maana maalumu ya usaliti kuwa tafsiri pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri παραδῷ katika muktadha wa Yuda
  choice: kumkabidhi
  alternative: kumsaliti
  rationale: Tendo la Yuda kwa hakika ni usaliti katika muktadha, lakini kitenzi cha Kigiriki kina maana pana zaidi ya kumkabidhi mtu. Matini kuu inadumisha upana huo, huku tanbihi ikitoa tafsiri ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tangu wakati huo” na “nafasi” ni wazi kwa wasomaji wa kawaida; tanbihi inalinda tofauti kati ya maana ya msingi ya kitenzi na maana yake ya kimuktadha.
