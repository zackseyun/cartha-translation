  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: sw
  text: Mara moja akamwendea Yesu, akasema, “Salamu[a], Rabi,” kisha akambusu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi ya neno lenyewe: “Furahi.” Hapa lilitumika kama salamu.'
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi hiki kinaweza kudokeza busu lililosisitizwa au lililorudiwa: “akambusu sana” au “akambusu tena na tena.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Mara moja
  rationale: Inaonyesha kwamba tendo lilifanyika bila kuchelewa na inadumisha kasi ya simulizi kwa Kiswahili cha kawaida.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: akamwendea Yesu
  rationale: Kitenzi kinaonyesha kumkaribia au kumjia mtu. “Akamwendea Yesu” ni cha asili katika mfuatano wa simulizi na kinaonyesha mwendo wa Yuda kuelekea kwa Yesu.
- source_word: εἶπεν
  choice: na kusema
  rationale: Inawakilisha kwa urahisi kitenzi cha kusema, huku ikikiunganisha kwa kawaida na tendo la kumwendea Yesu.
- source_word: Χαῖρε
  choice: Salamu
  rationale: Hapa neno hilo linatumika kama salamu ya kawaida. “Salamu” ni ya sasa, yenye heshima, na haiongezi maana ya kiibada.
- source_word: ῥαββί
  choice: Rabi
  rationale: Kigiriki kimehifadhi cheo hiki cha Kisemiti kwa kunukuu sauti zake. “Rabi” linatambulika katika Kiswahili cha Biblia na halififishi namna Yuda alivyomwita Yesu.
- source_word: κατεφίλησεν
  choice: akambusu
  rationale: Kitenzi kinaweza kuwa na nguvu ya busu la kusisitiza au kurudiwa, lakini “akambusu” ni wazi na cha asili katika matini kuu; uwezekano wa maana iliyosisitizwa umehifadhiwa katika tanbihi.
- source_word: αὐτόν
  choice: -m- katika “akambusu”
  rationale: Kiambishi cha yambwa kinamrejelea Yesu kwa njia ya kawaida ya sarufi ya Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri salamu Χαῖρε ya Yuda
  choice: Salamu
  alternative: Furahi
  rationale: Katika muktadha huu ni namna ya kawaida ya kusalimu, si kauli ya kitheolojia. Tafsiri kuu inaacha kejeli ya usaliti ionekane kutokana na simulizi lenyewe, huku maana ya neno kwa ukaribu zaidi ikitajwa katika tanbihi.
- issue: Nguvu ya kitenzi κατεφίλησεν
  choice: akambusu
  alternative: akambusu sana / akambusu tena na tena
  rationale: Umbo la kitenzi linaweza kudokeza busu lililosisitizwa au kurudiwa, lakini halilazimishi kuchagua kati ya maana hizo. Matini kuu haitatui utata huo kimya kimya; tanbihi inauhifadhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa simulizi umetumia “akam-” kwa mfuatano wa vitendo. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
