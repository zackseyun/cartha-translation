  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: sw
  text: 'Akasema, “Nendeni mjini kwa mtu fulani[a], mkamwambie, ‘Mwalimu anasema: Wakati wangu umekaribia. Nitaadhimisha Pasaka[b] kwako[c] pamoja na wanafunzi wangu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa fulani.” Kigiriki humaanisha mtu maalumu ambaye hakutajwa jina.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “Nitafanya Pasaka.” Hii ni nahau ya Kigiriki yenye maana ya kuadhimisha, kushika, au kutunza Pasaka.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “kwako”; katika muktadha inaweza kumaanisha “mahali pako” au “nyumbani kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Nendeni
  rationale: Amri ya kwenda imetafsiriwa kwa namna ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: πρὸς τὸν δεῖνα
  choice: kwa mtu fulani
  rationale: Kirai hiki humtaja mtu maalumu ambaye jina lake halikutajwa; ‘mtu fulani’ ni cha kawaida na chenye heshima.
- source_word: Ὁ διδάσκαλος
  choice: Mwalimu
  rationale: Huhifadhi maana ya cheo cha Yesu kama mwalimu bila kukichanganya na neno la ‘Bwana’.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Wakati wangu umekaribia
  rationale: Huhifadhi upana wa καιρός na wazo la ukaribu bila kuamua ikiwa hasa ni wakati wa kifo, mlo wa Pasaka, au utimilifu mpana wa kazi yake.
- source_word: πρὸς σὲ
  choice: kwako
  rationale: Ni tafsiri ya karibu ya kirai cha Kigiriki na katika muktadha inaweza kumaanisha mahali au nyumbani kwa mtu huyo bila kuongeza wazi neno ‘nyumbani’.
- source_word: ποιῶ τὸ πάσχα
  choice: Nitafanya Pasaka
  rationale: Kitenzi cha wakati wa sasa kinaweza kuwa na nguvu ya tendo lililokusudiwa na lililo karibu; ‘nitafanya Pasaka’ huhifadhi kwa kiasi nahau ya Kigiriki, ingawa maana yake ni kuiadhimisha.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: Hili ndilo jina la kawaida la sikukuu ya Kiyahudi katika Kiswahili cha Biblia.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pamoja na wanafunzi wangu
  rationale: ‘Wanafunzi’ huhifadhi uhusiano wa μαθηταί na Yesu; ‘pamoja na’ ni Kiswahili cha asili.
theological_decisions:
- issue: Maana ya wakati wa Yesu unaokaribia
  choice: Wakati wangu umekaribia
  alternative: Wakati wangu uliowekwa umekaribia; Saa yangu imekaribia
  rationale: καιρός haitaji kwa uwazi katika mstari huu ikiwa ni kifo cha Yesu, Pasaka, au kilele kipana cha utume wake; tafsiri haifungi maana hiyo.
- issue: Maana ya ποιῶ τὸ πάσχα
  choice: Nitafanya Pasaka
  alternative: Nitaadhimisha Pasaka; Nitaiweka Pasaka
  rationale: Tafsiri inahifadhi nahau ya chanzo huku tanbihi ikieleza maana ya kuadhimisha; pia wakati ujao wa Kiswahili unaonyesha kusudi lililo karibu bila kubadili dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ujumbe ndani ya usemi umewekwa wazi, na tanbihi zinaeleza maneno yenye uwezekano zaidi ya mmoja.
