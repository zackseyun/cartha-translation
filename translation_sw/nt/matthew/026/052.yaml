  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: sw
  text: Ndipo Yesu akamwambia, “Rudisha upanga wako mahali pake, kwa maana wote wanaochukua upanga[a] wataangamia kwa upanga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaotumia upanga”; msemo huu huenda unamaanisha kuamua kutumia nguvu ya vurugu, wala si kushika silaha tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaendeleza mfululizo wa matukio kwa njia ya kawaida na yenye hadhi katika masimulizi ya Kiswahili.
- source_word: λέγει αὐτῷ
  choice: Yesu akamwambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili; kiambishi cha mtendewa kinaonyesha maana ya ‘akamwambia yeye’ kwa kawaida.
- source_word: Ἀπόστρεψον
  choice: Rudisha
  rationale: Amri hii inataka tendo la mara moja la kuurudisha upanga ulikokuwa; ‘rudisha’ ni wazi na ya kawaida katika muktadha huu.
- source_word: τὴν μάχαιράν σου
  choice: upanga wako
  rationale: μάχαιρα inaweza kuwa kisu kikubwa au upanga mfupi, lakini ‘upanga’ ndiyo istilahi ya kawaida na inaendeleza urudiaji wa kimethali katika sentensi.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: mahali pake
  rationale: Huhifadhi maana ya kuurudisha upanga mahali unapopaswa kuwekwa bila kuongeza ‘ala’ ambayo haikutajwa wazi katika chanzo.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: kwa maana wote wanaouchukua upanga
  rationale: Muundo wa Kigiriki unatoa kanuni ya jumla. ‘Wanaouchukua upanga’ huhifadhi picha ya chanzo na pia inaweza kumaanisha kuamua kutumia nguvu ya silaha; tanbihi inaeleza upeo huo wa msemo.
- source_word: ἐν μαχαίρῃ
  choice: kwa upanga
  rationale: Huwakilisha matumizi ya ala katika Kigiriki na kuhifadhi urudiaji wa neno ‘upanga’.
- source_word: ἀπολοῦνται
  choice: wataangamia
  rationale: Huhifadhi uzito na upeo wa ἀπόλλυμι, ambayo hapa inaelekea kwenye maangamizi au kifo, bila kuibana kuwa maelezo ya namna fulani tu ya kufa.
theological_decisions:
- issue: Upeo wa kauli ya Yesu kuhusu upanga
  choice: 'Kauli imetafsiriwa kama kanuni ya jumla: ‘wote wanaouchukua upanga wataangamia kwa upanga.’'
  alternative: Kuifanya iwe marufuku kamili ya kila matumizi ya nguvu, au kuitaja kuwa unabii unaomhusu mwanafunzi huyo katika tukio hili pekee.
  rationale: Muundo wa Kigiriki ni wa jumla na wa kimethali. Tafsiri inadumisha upana na mvutano wa kauli bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa masimulizi, huku urudiaji wa ‘upanga’ na uzito wa kauli ya kimethali ukihifadhiwa.
