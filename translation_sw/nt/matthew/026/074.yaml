  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: sw
  text: Ndipo akaanza kulaani na kuapa[a], “Simjui mtu huyo.” Mara jogoo akawika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri iliyo karibu zaidi na maneno ya Kigiriki, “akaanza kutamka laana na kuapa.” Huenda maana yake ni kwamba aliomba laana zimshukie mwenyewe ili kuthibitisha kukana kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiunganishi hiki kinaonyesha hatua inayofuata katika simulizi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: ἤρξατο
  choice: akaanza
  rationale: Inahifadhi maana ya kuanza kwa hatua mpya na kali zaidi katika kukana kwa Petro.
- source_word: καταθεματίζειν
  choice: kulaani
  rationale: Kitenzi kinamaanisha kutamka au kuomba laana katika muktadha wa kiapo; tafsiri kuu fupi inaepuka kuamua kimya kimya laana zilielekezwa kwa nani, huku tanbihi ikifafanua maana inayowezekana zaidi.
- source_word: ὀμνύειν
  choice: kuapa
  rationale: Ni neno la kawaida na lenye hadhi kwa kutoa kiapo, si kutumia lugha chafu.
- source_word: ὅτι
  choice: alama za usemi wa moja kwa moja
  rationale: Hutambulisha yaliyomo katika kiapo; usemi wa moja kwa moja ni wa asili katika Kiswahili.
- source_word: Οὐκ οἶδα
  choice: Simjui
  rationale: Hueleza moja kwa moja kukataa kumfahamu mtu huyo.
- source_word: τὸν ἄνθρωπον
  choice: mtu huyo
  rationale: Katika Kiswahili, 'mtu huyo' humrejelea kwa kawaida mtu ambaye tayari anazungumziwa, bila kuongeza dharau isiyomo katika Kigiriki.
- source_word: καὶ εὐθέως
  choice: Mara
  rationale: Hutoa maana ya tukio kutokea papo hapo na hudumisha kasi ya simulizi kwa Kiswahili cha asili.
- source_word: ἀλέκτωρ
  choice: jogoo
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa ndege huyu; Kigiriki hakina kibainishi hapa, na Kiswahili hakihitaji kibainishi kisicho dhahiri.
- source_word: ἐφώνησεν
  choice: akawika
  rationale: '''Kuwika'' ndicho kitenzi mahususi na cha kawaida kwa sauti ya jogoo.'
theological_decisions:
- issue: Maana ya καταθεματίζειν katika kukana kwa Petro
  choice: Nakala kuu inasema 'kulaani,' huku tanbihi ikieleza uwezekano kwamba Petro aliomba laana zimshukie mwenyewe ili kuthibitisha kiapo chake.
  alternative: Kusema wazi katika nakala kuu kwamba Petro alijilaani, au kwamba alimlaani Yesu.
  rationale: Muunganiko na 'kuapa' unaunga mkono laana ya kujitakia kama sehemu ya kiapo, lakini kiwakilishi 'mwenyewe' hakijaandikwa wazi katika Kigiriki. Njia hii inalinda uzito wa tukio bila kudai kwamba Petro alimlaani Yesu wala kufuta utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni mfupi na wa haraka; 'Simjui mtu huyo' ni wa asili bila kulegeza uzito wa kauli.
