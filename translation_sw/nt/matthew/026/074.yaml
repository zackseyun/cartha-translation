  verdict: approve
  source_fidelity: 'Tafsiri inafuata kwa uaminifu mpangilio na maana ya Kigiriki: τότε ... ἤρξατο huhifadhiwa na “Ndipo akaanza”; καταθεματίζειν na ὀμνύειν hutolewa kwa “kulaani na kuapa”; kauli ya kukana, uharaka wa tukio, na kuwika kwa jogoo vyote vimehifadhiwa. “Mtu huyo” ni uwasilishaji wa kawaida wa τὸν ἄνθρωπον katika muktadha huu, bila kuongeza dharau au kutambulisha mhusika kwa namna isiyomo katika kauli yenyewe.'
  naturalness: Kiswahili ni sanifu, kifupi, na chenye mwendo wa simulizi unaofaa. “Simjui mtu huyo” na “Mara jogoo akawika” ni misemo ya asili na iliyo wazi. “Kulaani na kuapa” husikika kwa kawaida katika muktadha wa kiapo cha kusisitiza.
  terminology: “Kuapa” ni sahihi kwa ὀμνύειν, na “kuwika” ni kitenzi mahsusi kwa sauti ya jogoo. Tafsiri kuu ya “kulaani” haidai bila ushahidi wa kisarufi kwamba laana ilielekezwa kwa Petro mwenyewe au kwa Yesu; tanbihi inaeleza kwa uangalifu maana ya kimuktadha inayowezekana zaidi.
