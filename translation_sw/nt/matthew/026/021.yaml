  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: sw
  text: Walipokuwa wakila, akasema, “Kweli, ninawaambia, mmoja wenu atanisaliti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na neno la asili, “atanikabidhi” au “atanitia mikononi mwa wengine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Walipokuwa wakila
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati Yesu aliposema; tafsiri hii ni ya asili katika Kiswahili na inadumisha uhusiano wa wakati.
- source_word: Ἀμὴν
  choice: Kweli
  rationale: Hapa neno hili linaanzisha tamko zito na la hakika la Yesu; “Kweli” huwasilisha dhima hiyo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Hii ni kauli ya moja kwa moja kwa kundi la wanafunzi na ni ya asili katika Kiswahili.
- source_word: εἷς ἐξ ὑμῶν
  choice: mmoja wenu
  rationale: Hii inawasilisha kwa uwazi maana ya mmoja kutoka miongoni mwao.
- source_word: παραδώσει
  choice: atanisaliti
  rationale: Ingawa kitenzi hiki kimsingi kinaweza kumaanisha kumkabidhi mtu, katika muktadha huu kinahusu tendo la usaliti la mmoja wa wanafunzi. “Atanisaliti” huwasilisha maana ya kimuktadha kwa Kiswahili cha asili, huku tanbihi ikihifadhi maana pana zaidi ya neno la Kigiriki.
- source_word: με
  choice: -ni- katika “atanisaliti”
  rationale: Kiambishi cha yambwa “-ni-” kinamrejelea Yesu na kutafsiri kiwakilishi cha moja kwa moja “me”.
theological_decisions:
- issue: Tafsiri ya παραδώσει katika simulizi la mateso ya Yesu
  choice: atanisaliti
  alternative: atanikabidhi
  rationale: Kitenzi cha Kigiriki ni kipana kuliko “kusaliti,” lakini hapa mmoja wa wafuasi wa karibu wa Yesu ndiye atakayemkabidhi kwa maadui zake. Tafsiri kuu inaonyesha usaliti huo bila kuongeza fundisho la dhehebu, na tanbihi inadumisha uwezekano wa tafsiri iliyo halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Mpangilio wa sentensi ni wa asili, na uzito wa tamko la Yesu umehifadhiwa.
