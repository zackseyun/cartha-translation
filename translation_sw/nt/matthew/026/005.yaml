base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: sw
  text: Lakini walikuwa wakisema, “Siyo wakati wa sikukuu, ili kusiwe na ghasia miongoni mwa watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea katika mashauriano yao, badala ya tukio la kusema mara moja tu.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha badiliko lenye utofauti mdogo kutoka mpango uliotajwa katika mstari uliotangulia hadi tahadhari yao kuhusu wakati.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Si wakati wa sikukuu
  rationale: Muundo huu mfupi wa Kiswahili unahifadhi usemi wa kimkato wa Kigiriki unaokataa kutekeleza mpango huo wakati wa sikukuu; ἐν ina maana ya wakati hapa.
- source_word: ἵνα μὴ
  choice: ili ... isi-
  rationale: Muundo wa kawaida wa Kiswahili unaonyesha kusudi la kuzuia jambo lisitokee bila kupoteza maana ya tahadhari iliyomo katika Kigiriki.
- source_word: θόρυβος
  choice: ghasia
  rationale: Neno hili linaweza kumaanisha vurugu au fujo ya hadharani. “Ghasia” linaonyesha uzito wa machafuko ya umati bila kulazimisha maana mahsusi zaidi ya uasi.
- source_word: γένηται
  choice: isitokee
  rationale: Katika muundo huu γίνομαι humaanisha kutokea au kuanza kuwapo; “isitokee” ni ya kawaida na inafaa pamoja na “ghasia.”
- source_word: ἐν τῷ λαῷ
  choice: miongoni mwa watu
  rationale: Tafsiri hii inaonyesha kwamba machafuko yangezuka katikati ya watu waliokusanyika, huku ikidumisha maana pana ya λαός.
