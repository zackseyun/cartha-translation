  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: sw
  text: Kisha kuhani mkuu akararua mavazi yake[a], akisema, “Amekufuru! Bado tuna haja gani ya mashahidi? Tazama, sasa mmesikia kufuru hiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kurarua mavazi hadharani kulikuwa ishara ya mshtuko, huzuni, au ghadhabu.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kiunganishi cha wakati kinachoendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Jina la kawaida na sahihi la mwenye cheo hiki katika uongozi wa kidini wa Kiyahudi.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: akararua mavazi yake
  rationale: Huhifadhi kitendo cha kurarua na maana pana ya ἱμάτια bila kudhania kwamba yalikuwa majoho maalumu.
- source_word: λέγων
  choice: akisema
  rationale: Huhifadhi uhusiano wa wakati mmoja kati ya kurarua mavazi na kusema.
- source_word: Ἐβλασφήμησεν
  choice: Amekufuru
  rationale: Kauli ya wakati timilifu inafikisha nguvu ya shtaka la mara hiyo; 'kukufuru' ni istilahi ya kidini na kisheria inayolingana na βλασφημέω.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Bado tuna haja gani ya mashahidi?
  rationale: Hufuata muundo na msisitizo wa Kigiriki huku ikibaki ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἴδε νῦν
  choice: Tazama, sasa
  rationale: '''Tazama'' hutenda kama tamko la kuvuta fikira, na ''sasa'' huhifadhi msisitizo wa νῦν.'
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: mmesikia kufuru hiyo
  rationale: Wakati timilifu unaonyesha ushahidi walioukusikia muda huo; 'hiyo' hurejelea wazi maneno yaliyotajwa kuwa kufuru.
theological_decisions:
- issue: Shtaka la βλασφημέω / βλασφημία
  choice: Amekufuru / kufuru hiyo
  alternative: Amesema maneno ya kumkosea Mungu
  rationale: Istilahi ya 'kufuru' huhifadhi uzito wa kidini na kisheria wa shtaka. Muktadha unaonyesha kuwa hii ni hukumu ya kuhani mkuu, wala tafsiri haisemi kwamba msimulizi anaikubali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku istilahi 'kuhani mkuu,' 'mashahidi,' na 'kufuru' zikihifadhi uzito wa mazingira ya kidini na kisheria. Dokezo la kitamaduni limewekwa baada ya 'mavazi yake,' mahali linapohusika moja kwa moja; mkanganyiko wa alama katika safu ya mashauriano ya Kiingereza haujafuatwa.
