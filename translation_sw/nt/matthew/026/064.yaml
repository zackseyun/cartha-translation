  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: sw
  text: Yesu akamwambia[a], “Wewe mwenyewe umesema hivyo. Lakini nawaambia, tangu sasa mtamwona Mwana wa Adamu ameketi mkono wa kuume wa Uweza[c], akija juu ya mawingu ya mbinguni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe ndiye uliyesema.” Maneno ya Kigiriki ni jibu la kiidiomu lenye maana ya kukubali.
    reason: lexical_alternative
  - marker: b
    text: Hii inadokeza Danieli 7:13 na Zaburi 110:1.
    reason: cross_reference
  - marker: c
    text: “Uweza” ni namna ya heshima ya kumrejelea Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Wewe mwenyewe umesema hivyo
  rationale: Ni jibu la kiidiomu lenye maana ya kukubali, lakini linahifadhi namna ya usemi wa Kigiriki badala ya kuufanya kuwa ‘Ndiyo’ isiyo na mpaka.
- source_word: πλὴν
  choice: Lakini
  rationale: Inaonyesha mpito wenye msisitizo kuelekea tamko linalofuata kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἀπ’ ἄρτι
  choice: tangu sasa
  rationale: Inaonyesha mwanzo wa hali mpya kuanzia wakati huu na kuendelea, bila kuibana iwe tukio la papo hapo tu.
- source_word: ὄψεσθε
  choice: mtamwona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha wakati ujao; wingi wake unawahusu waliokuwa wakimsikiliza.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Inahifadhi cheo kilichozoeleka katika Biblia na mwangwi wake wa Danieli 7.
- source_word: καθήμενον
  choice: ameketi
  rationale: Inaeleza hali ya kuketi katika nafasi ya heshima na mamlaka bila kuongeza maelezo yasiyomo katika matini.
- source_word: ἐκ δεξιῶν
  choice: upande wa kulia wa
  rationale: Ni usemi wa Kiswahili unaoeleweka kwa nafasi ya heshima, mamlaka, na ukaribu.
- source_word: τῆς δυνάμεως
  choice: Uweza
  rationale: Inahifadhi usemi wa heshima unaomrejelea Mungu bila kulibadili neno hilo moja kwa moja kuwa ‘Mungu’; herufi kubwa inaashiria matumizi yake kama jina la heshima.
- source_word: ἐρχόμενον
  choice: akija
  rationale: Inahifadhi tendo linaloendelea na mwangwi wa Danieli 7 bila kuamua kimbele mpangilio wake wa kieskatolojia.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: juu ya mawingu ya mbinguni
  rationale: Ni tafsiri wazi ya kirai cha Kigiriki na inadumisha picha ya Danieli 7:13.
theological_decisions:
- issue: Nguvu ya jibu Σὺ εἶπας kwa kuhani mkuu
  choice: 'Jibu la kukubali lenye tahadhari: “Wewe mwenyewe umesema hivyo.”'
  alternative: “Ndiyo” moja kwa moja, au jibu la kukwepa
  rationale: Usemi huo ni wa kukubali, lakini ‘Ndiyo’ ingeondoa namna halisi ya jibu, ilhali kuuchukulia kama kukwepa kungepunguza uzito wa muktadha.
- issue: Anayerejelewa na τῆς δυνάμεως
  choice: Usemi wa heshima kwa Mungu, uliotafsiriwa “Uweza”
  alternative: “Mungu” au “Mwenye Uweza”
  rationale: Matini inatumia jina la heshima lisilo la moja kwa moja; kulitaja wazi kuwa ‘Mungu’ kungeenda zaidi ya maneno ya chanzo.
- issue: Upeo wa “mtamwona” kuhusu kuketi na kuja
  choice: Kauli inayaunganisha kutawazwa na kuja bila kulazimisha ratiba moja ya utimilifu
  alternative: Kutimizwa kote mara moja, au kurejelea kuja kwa pili pekee
  rationale: Vishiriki vyote viwili vinategemea ‘mtamwona’; tafsiri inadumisha pamoja hali ya kutukuzwa na kuja juu ya mawingu, pamoja na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwana wa Adamu” na “mawingu ya mbinguni” vinahifadhi mwangwi wa maandiko; “Uweza” linaendeleza usemi wa heshima wa chanzo. Viashiria vyote vya tanbihi vimewekwa katika matini.
