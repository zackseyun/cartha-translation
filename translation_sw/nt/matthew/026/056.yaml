id: MAT.26.56
reference: Matthew 26:56
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: sw
  text: Lakini haya yote yametukia ili Maandiko ya manabii yatimizwe. Ndipo wanafunzi wote wakamwacha[a] na kukimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wakamtelekeza.
    reason: Kitenzi ἀφέντες kinaweza kuwa na maana kali zaidi ya kumwacha kabisa au kumtelekeza katika muktadha huu.
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Lakini haya yote
  rationale: Kirai hiki kinarejelea matukio yote yaliyotangulia; “lakini” huhifadhi kiunganishi δέ kwa mtiririko wa kawaida wa Kiswahili.
- source_word: γέγονεν
  choice: yametukia
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo lililotokea na lenye umuhimu katika hali ya sasa; “yametukia” ni ya asili na yenye hadhi.
- source_word: ἵνα πληρωθῶσιν
  choice: ili ... yatimizwe
  rationale: Muundo huu huhifadhi wazo la kusudi au matokeo bila kulazimisha uamuzi kati ya pande hizo mbili.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Maandiko ya manabii
  rationale: “Maandiko” hapa humaanisha maandishi matakatifu, huku umilikishi “ya manabii” ukihifadhi ufupi na uwezekano wa maana uliopo katika Kigiriki.
- source_word: τότε
  choice: Ndipo
  rationale: “Ndipo” huonyesha hatua inayofuata katika mfululizo wa simulizi na kuleta matokeo ya mara moja.
- source_word: οἱ μαθηταὶ πάντες
  choice: wanafunzi wote
  rationale: Huhifadhi msisitizo kwamba kila mmoja wa wanafunzi alifanya hivyo, bila kuongeza neno lisilokuwapo wazi katika Kigiriki.
- source_word: ἀφέντες αὐτὸν
  choice: wakamwacha
  rationale: Kitenzi ἀφίημι katika muktadha huu kina maana ya kumwacha mtu nyuma; “wakamwacha” ni fasaha, huku maana kali zaidi ya kumtelekeza ikibainishwa katika tanbihi.
- source_word: ἔφυγον
  choice: kukimbia
  rationale: Katika muundo “wakamwacha na kukimbia,” neno hili linaonyesha wazi kuwa walikimbia kutoka mahali hapo; ni Kiswahili cha kawaida chenye uzito unaofaa simulizi.
theological_decisions:
- issue: Kutimizwa kwa Maandiko ya kinabii
  choice: ili Maandiko ya manabii yatimizwe
  alternative: ili yale yaliyoandikwa na manabii yatokee
  rationale: Tafsiri inahifadhi wazi lugha ya “kutimizwa” iliyo muhimu katika simulizi la Mathayo, bila kufafanua zaidi uhusiano wa manabii na Maandiko kuliko unavyosema umilikishi wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa wasomaji wa kawaida; “Maandiko” na “yatimizwe” huhifadhi istilahi muhimu za kibiblia bila kuwa nzito isivyo lazima.
