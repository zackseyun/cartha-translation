  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: sw
  text: 'Ndipo Petro akalikumbuka neno ambalo Yesu alikuwa amesema: “Kabla jogoo hajawika[a], utanikana mara tatu.” Kisha akatoka nje, akalia kwa uchungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kabla ya jogoo kuwika.” Kigiriki hakimtambulishi jogoo fulani; katika Kiswahili miundo yote miwili inaweza kueleza tukio la kuwika kwa jogoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: akalikumbuka
  rationale: Kitenzi hiki kinaonyesha Petro alifikia hatua ya kukumbuka. ‘Akalikumbuka’ ni Kiswahili cha kawaida na huhifadhi msukumo wa simulizi.
- source_word: ῥήματος
  choice: neno
  rationale: ῥῆμα hapa ni jambo lililonenwa. ‘Neno’ linafaa kwa kuwa kishazi kinachofuata kinaeleza kwamba Yesu alikuwa amesema.
- source_word: εἰρηκότος
  choice: alikuwa amesema
  rationale: Kauli hii ilitamkwa kabla na bado ina umuhimu wakati Petro anapoikumbuka; ‘alikuwa amesema’ huonyesha utangulizi huo kwa kawaida.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Kabla jogoo hajawika
  rationale: Muundo huu wa wakati unatafsiriwa kwa Kiswahili cha kawaida kama kishazi chenye ‘kabla’. Nomino isiyo na kibainishi haimlazimishi mtafsiri kuchagua kati ya ‘jogoo’ na ‘yule jogoo’; ‘jogoo’ ni ya asili na haitaji ndege fulani aliyetambulishwa.
- source_word: τρὶς
  choice: mara tatu
  rationale: Hii ndiyo namna ya kawaida na wazi ya kusema tendo lililotokea mara tatu.
- source_word: ἀπαρνήσῃ
  choice: utanikana
  rationale: ‘Kunikana’ hueleza kukataa kumtambua Yesu au kuwa na uhusiano naye na huhifadhi uzito wa kitendo cha Petro.
- source_word: ἐξελθὼν ἔξω
  choice: akatoka nje
  rationale: ‘Akatoka nje’ huhifadhi kitenzi pamoja na msisitizo wa kuelekea nje bila uradidi usio wa kawaida katika Kiswahili.
- source_word: ἔκλαυσεν πικρῶς
  choice: akalia kwa uchungu
  rationale: Usemi huu wa kawaida unaonyesha kilio cha huzuni kali bila kuongeza kwa wazi sababu au hali ya ndani ambayo matini haikutaja.
theological_decisions:
- issue: Kumtaja Yesu kwa jina bila cheo
  choice: Yesu
  alternative: Bwana Yesu
  rationale: Matini ya Kigiriki ina jina Ἰησοῦ pekee; hakuna cheo kinachopaswa kuongezwa.
- issue: Maana ya Petro kumkana Yesu
  choice: utanikana
  alternative: utakataa kuwa unanijua
  rationale: ‘Utanikana’ huhifadhi upana na uzito wa ἀπαρνήσῃ bila kuifafanua kwa namna finyu kuwa kukataa tu kwamba anamjua Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Viunganishi ‘Ndipo’ na ‘Kisha’ vinaendeleza mtiririko wa simulizi; kauli ya moja kwa moja imehifadhiwa kwa uwazi.
