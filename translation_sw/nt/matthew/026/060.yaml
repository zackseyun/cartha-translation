  text: na hawakupata ushahidi wowote[a], ingawa mashahidi wengi wa uongo walikuwa wamejitokeza. Lakini baadaye wawili walijitokeza
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakupata chochote”; Kigiriki hakitaji wazi kitu kilichotafutwa, lakini muktadha unaelekeza kwenye ushahidi au shtaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: hawakupata ushahidi wowote
  rationale: Kitenzi kina yambwa iliyodokezwa na muktadha wa mstari wa 59, yaani ushahidi au shtaka lililokuwa likitafutwa dhidi ya Yesu. Kutaja “ushahidi” kunafanya Kiswahili kiwe wazi na cha kawaida, huku tanbihi ikihifadhi udhahiri mdogo wa Kigiriki.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: ingawa mashahidi wengi wa uongo walikuwa wamejitokeza
  rationale: 'Muundo wa genitivi huru una maana ya kukubali hali inayokinzana: licha ya mashahidi wengi kutokea, hawakupata ushahidi walioutafuta. “Mashahidi wa uongo” huhifadhi mazingira ya kisheria.'
- source_word: ὕστερον δὲ
  choice: Lakini baadaye
  rationale: “Baadaye” huonyesha hatua iliyofuata katika mchakato, na “lakini” huhifadhi mpito wenye ukinzani mdogo wa δέ.
- source_word: προσελθόντες δύο
  choice: wawili walijitokeza
  rationale: Katika mazingira ya kutoa ushahidi, “walijitokeza” ni Kiswahili cha kawaida kuliko tafsiri ya kimahali kama “walikaribia,” na huhifadhi mkazo kwa idadi ya watu wawili.
