base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: sw
  text: Akasema, “Mko tayari kunipa nini, nami nitamtia mikononi mwenu[a]?” Nao wakampimia vipande thelathini vya fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitamsaliti.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumkabidhi,” “kumtia mikononi mwa,” au, katika muktadha huu, “kumsaliti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Mko tayari kunipa nini
  rationale: Kitenzi θέλω kinaweza kuonyesha kutaka au kuwa tayari. Katika mazungumzo haya ya kupanga malipo, ‘mko tayari kunipa nini’ linaonyesha hiari yao kwa Kiswahili cha kawaida bila kuongeza maana.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: nami nitamtia mikononi mwenu
  rationale: παραδίδωμι lina maana pana ya kumkabidhi au kumtia mtu mikononi mwa wengine. Usemi huu ni wa asili katika Kiswahili na hauingizi moja kwa moja tathmini ya kimaadili iliyomo katika ‘kumsaliti,’ ingawa muktadha unaonyesha usaliti.
- source_word: οἱ δὲ
  choice: Nao
  rationale: δέ ni kiunganishi chepesi cha simulizi; ‘Nao’ kinaendeleza mtiririko bila kusisitiza upinzani usio lazima.
- source_word: ἔστησαν αὐτῷ
  choice: wakampimia
  rationale: Katika muktadha wa malipo ya fedha, usemi huu unaashiria kuweka au kupima kiasi alichopewa. ‘Wakampimia’ huhifadhi picha halisi ya fedha iliyopimwa kuliko ‘wakamlipa,’ ambalo ni neno la jumla zaidi.
- source_word: τριάκοντα ἀργύρια
  choice: vipande thelathini vya fedha
  rationale: ἀργύρια ni fedha au vipande vya fedha. Tafsiri hii haitaji aina maalumu ya sarafu ambayo maandishi ya Kigiriki hayakutaja.
theological_decisions:
- issue: Tafsiri ya παραδώσω katika pendekezo la Yuda
  choice: nitamtia mikononi mwenu
  alternative: nitamsaliti kwenu; nitawakabidhi yeye
  rationale: Chaguo kuu linahifadhi upana wa kitenzi cha Kigiriki na mvutano kati ya tendo la kumkabidhi na tabia yake ya usaliti. Tanbihi inaonyesha maana ya ‘kumsaliti’ inayotokana na muktadha bila kuifanya kuwa maana pekee ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mko tayari kunipa nini’ ni lugha ya kawaida ya kujadiliana, na ‘kumtia mikononi mwenu’ huhifadhi maana pana ya kumkabidhi mtu bila kuficha kwamba tendo hilo ni usaliti.
