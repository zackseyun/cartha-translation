reference: Matthew 26:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: sw
  text: Kisha anawajia wanafunzi na kuwakuta wamelala, naye anamwambia Petro, “Basi, hamkuweza kukesha[a] pamoja nami kwa saa moja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kubaki macho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: anawajia wanafunzi
  rationale: Kitenzi cha wakati wa sasa kinahifadhiwa kama wakati wa sasa wa kisimulizi; “kuwajia” ni Kiswahili cha kawaida kwa mwendo unaoelekezwa kwa watu.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: kuwakuta wamelala
  rationale: Hutoa kwa kawaida hali aliyowakuta nayo, huku ikidumisha tofauti ya wazi kati ya kulala na kukesha.
- source_word: λέγει τῷ Πέτρῳ
  choice: anamwambia Petro
  rationale: Wakati wa sasa wa kisimulizi umehifadhiwa, na Petro anabaki kuwa mtu mmoja anayetajwa kuwa anaambiwa.
- source_word: Οὕτως
  choice: Basi
  rationale: Hapa neno hilo linaanzisha mshangao au karipio la upole; “Basi” linafanya kazi hiyo kwa kawaida bila kulipanua kupita kiasi.
- source_word: οὐκ ἰσχύσατε
  choice: hamkuweza
  rationale: Maana katika muktadha ni uwezo; kiambishi cha nafsi ya pili wingi “ham-” kinahifadhi kwamba karipio linawahusu zaidi ya Petro peke yake.
- source_word: μίαν ὥραν
  choice: kwa saa moja
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha muda uliokusudiwa.
- source_word: γρηγορῆσαι
  choice: kukesha
  rationale: Katika mazingira haya ya usiku na tofauti na kulala, “kukesha” linaonyesha kubaki macho na pia linaweza kubeba wazo la kuwa macho kwa uangalifu.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Linaonyesha kuandamana kwa wazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Yesu anamwambia Petro mmoja, lakini ἰσχύσατε ni kitenzi cha nafsi ya pili wingi
  choice: Kudumisha Petro kama anayeambiwa moja kwa moja na kutumia wingi “hamkuweza” katika swali
  alternative: Kutumia umoja “hukuweza” ili swali lielekezwe kwa Petro peke yake
  rationale: Nakala ya Kigiriki inamtaja Petro kama anayeambiwa, lakini kitenzi chake ni cha wingi. Tafsiri inahifadhi mvutano huo badala ya kufafanua kwamba Petro anawakilisha kundi au kubadili swali liwe la umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wakati wa sasa wa kisimulizi umehifadhiwa. “Kukesha” ni la kawaida katika mazingira ya kutolala usiku; tanbihi inadumisha maana mbadala iliyo wazi zaidi ya kubaki macho.
