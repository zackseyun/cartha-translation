  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: sw
  text: 'Kisha Yesu akawaambia, “Ninyi nyote mtaniacha kwa sababu yangu[a] usiku huu,[b] kwa maana imeandikwa: ‘Nitampiga mchungaji, na kondoo wa kundi watatawanyika.’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtajikwaa kwa sababu yangu,” “mtakwazika kwa sababu yangu,” au “mtachukizwa nami.” Kitenzi cha Kigiriki kina maana mbalimbali; hapa muktadha unaelekeza kwenye wanafunzi kumwacha Yesu.
    reason: lexical_alternative
  - marker: b
    text: Au, “leo usiku.”
    reason: lexical_alternative
  - marker: c
    text: Nukuu kutoka Zekaria 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Kisha Yesu akawaambia
  rationale: ‘Kisha’ linaendeleza mfuatano wa simulizi. Muundo ‘akawaambia’ ni wa kawaida katika simulizi la Kiswahili na unawasilisha kihistoria λέγει αὐτοῖς bila usemi usio wa asili.
- source_word: Πάντες ὑμεῖς
  choice: Ninyi nyote
  rationale: Huhifadhi msisitizo wa kiwakilishi na neno linalojumuisha wote.
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: mtaniacha kwa sababu yangu
  rationale: Katika muktadha, kitenzi kinatabiri wanafunzi kumwacha Yesu. ‘Mtaniacha’ ni Kiswahili cha kawaida na hakidai kwamba walifanya uasi wa mwisho usioweza kubadilishwa.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: usiku huu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kipindi kinachotajwa; ‘leo usiku’ pia inawezekana.
- source_word: γέγραπται γάρ
  choice: kwa maana imeandikwa
  rationale: Huhifadhi fomula ya kawaida ya kutambulisha nukuu ya Maandiko na uhusiano wa kutoa sababu.
- source_word: Πατάξω τὸν ποιμένα
  choice: Nitampiga mchungaji
  rationale: Huhifadhi nafsi ya kwanza, wakati ujao, na taswira ya mchungaji bila kuongeza matokeo kama vile kumuua.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: kondoo wa kundi watatawanyika
  rationale: Huhifadhi kondoo na kundi kama zilivyo katika maandishi ya Kigiriki, pamoja na wazo la kutawanyika.
theological_decisions:
- issue: Maana ya σκανδαλισθήσεσθε kuhusiana na Yesu
  choice: Wanafunzi watamwacha Yesu kwa sababu ya yatakayompata usiku huo.
  alternative: Watajikwaa, watakwazika, au watachukizwa kwa sababu yake.
  rationale: Muktadha wa mchungaji kupigwa na kondoo kutawanyika unaelekeza kwenye kuachwa kwa Yesu. Tafsiri haifanyi tukio hilo kuwa uasi wa mwisho wala haifuti upana wa kitenzi cha Kigiriki, ambao umeonyeshwa katika tanbihi.
- issue: λέγει kama wakati wa sasa wa kihistoria
  choice: akawaambia
  alternative: anawaambia
  rationale: Kiswahili kwa kawaida hutumia mfuatano wa wakati wa simulizi. Hii inawasilisha tendo hilo kwa ufasaha bila kubadili maana ya wakati wa sasa wa kihistoria wa Kigiriki.
- issue: Utambulisho wa mchungaji na kondoo
  choice: Taswira imeachwa kama ilivyo katika nukuu.
  alternative: Kumtaja mchungaji moja kwa moja kuwa Yesu na kondoo kuwa wanafunzi.
  rationale: Muktadha unaonyesha matumizi hayo, lakini tafsiri haipaswi kuingiza ufafanuzi ndani ya maneno ya nukuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mtaniacha’ ni ya asili zaidi kuliko tafsiri ya kimuundo kama ‘mtakwazishwa ndani yangu’; tanbihi huhifadhi uwezekano mpana wa neno la Kigiriki.
