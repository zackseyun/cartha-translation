  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: sw
  text: Lakini Petro alikuwa akimfuata kwa mbali hadi ua wa kuhani mkuu. Baada ya kuingia ndani, alikuwa ameketi pamoja na watumishi[a] ili aone mwisho wa mambo hayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maofisa,” “wahudumu,” au “walinzi.” Neno la Kigiriki linaweza kumaanisha watumishi au maafisa wa ngazi ya chini; maana mahususi hutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwisho.” Katika muktadha huu huenda ikimaanisha matokeo ya yaliyokuwa yakitendeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: alikuwa akimfuata
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kulingana na hali ya wakati usiotimilifu wa Kigiriki.
- source_word: ἀπὸ μακρόθεν
  choice: kwa mbali
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza umbali wa kimwili bila lugha ya kizamani.
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: mpaka ua wa kuhani mkuu
  rationale: “Mpaka” huhifadhi wazo la kufikia kikomo fulani, na “ua” hapa ni eneo la wazi lililozungukwa ndani ya makao.
- source_word: εἰσελθὼν ἔσω
  choice: baada ya kuingia ndani
  rationale: 'Huhifadhi mfuatano wa matendo: Petro aliingia kwanza, kisha akaketi.'
- source_word: ἐκάθητο
  choice: alikaa
  rationale: Kitenzi ni cha wakati usiotimilifu na kinaweza kueleza hali iliyoendelea; “alikaa” ni Kiswahili cha kawaida na, katika muktadha huu, kinaweza kumaanisha kuketi na kubaki hapo.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: pamoja na watumishi
  rationale: ὑπηρέται ni watu waliokuwa chini ya mamlaka na waliotekeleza huduma au majukumu rasmi. “Watumishi” hudumisha upana huo bila kuwabainisha kupita kiasi kuwa walinzi au maofisa.
- source_word: ἰδεῖν τὸ τέλος
  choice: ili aone mwisho wa mambo hayo
  rationale: Infinitivu inaonyesha kusudi. “Mwisho wa mambo hayo” huhifadhi neno halisi τέλος na wakati huohuo hueleweka kama matokeo ya yaliyokuwa yakitendeka.
