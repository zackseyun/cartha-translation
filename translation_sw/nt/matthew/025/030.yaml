  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless slave into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: sw
  text: Na huyo mtumwa[a] asiyefaa kitu, mtupeni katika giza la nje. Huko kutakuwa na kilio na kusaga meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi”; hapa “mtumwa” limetumiwa kwa sababu hali ya utumwa na uhusiano wake wa kufungamana na bwana vinaonekana wazi katika mazingira ya mfano huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: asiyefaa kitu
  rationale: Kauli hii ya kawaida na yenye uzito inaonyesha kwamba, kwa tathmini ya bwana wake, mtumwa huyo hana manufaa; haipunguzi ukali wa hukumu wala kuifunga maana katika faida ya kifedha pekee.
- source_word: δοῦλον
  choice: mtumwa
  rationale: Katika mazingira ya mfano huu, uhusiano wa bwana na mtu aliye chini ya mamlaka yake ni dhahiri. “Mtumwa” huonyesha hali hiyo kwa usahihi zaidi kuliko “mtumishi,” huku tanbihi ikitaja uwezekano wa tafsiri hiyo nyingine.
- source_word: ἐκβάλετε
  choice: mtupeni
  rationale: Kitenzi hiki cha amri kina nguvu na kinaonyesha kufukuzwa kwa ghafla; “mtupeni” ni Kiswahili cha sasa, wazi na chenye ukali unaolingana na chanzo.
- source_word: σκότος τὸ ἐξώτερον
  choice: giza la nje
  rationale: Hii ni tafsiri ya moja kwa moja na inayoeleweka ya usemi wa Mathayo, ikidumisha picha ya kutengwa bila kuongeza ufafanuzi wa kiteolojia.
- source_word: ἐκεῖ
  choice: Huko
  rationale: “Huko” hurejelea kwa wazi mahali palipotajwa, yaani katika giza la nje, na ni usemi wa kawaida wa Kiswahili.
- source_word: κλαυθμὸς
  choice: kilio
  rationale: “Kilio” huwasilisha huzuni na maumivu katika usemi huu unaorudiwa katika Mathayo bila kuongeza kiwango cha maombolezo kisichobainishwa na neno lenyewe.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kusaga meno
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya maumivu makali na/au hasira bila kuamua ni hisia ipi pekee inayokusudiwa.
theological_decisions:
- issue: Asili ya picha ya hukumu katika mfano
  choice: Kudumisha picha ya kutupwa katika giza la nje, kilio na kusaga meno bila kuitaja moja kwa moja kuwa jehanamu au kuifafanua zaidi.
  alternative: Kuitafsiri wazi kuwa jehanamu, hukumu ya mwisho, au adhabu ya muda tu.
  rationale: Maneno haya yana uzito wa hukumu katika Mathayo, lakini mstari wenyewe unatoa picha bila ufafanuzi kamili wa kimafundisho. Tafsiri inahifadhi mvutano huo na haiongezi hitimisho lisilotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na wenye nguvu, bila kutumia maneno ya kizamani. Tanbihi imewekwa baada ya “mtumwa,” neno ambalo inaeleza.
