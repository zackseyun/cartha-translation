translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mkato wa Kigiriki umehifadhiwa kwa kadiri inayowezekana, huku tanbihi ikitoa namna iliyo wazi zaidi kimuktadha.
