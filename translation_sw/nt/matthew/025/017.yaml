  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: sw
  text: Vivyo hivyo[a], yule aliyekuwa na mbili alipata nyingine mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa njia hiyo hiyo, yule aliyekuwa amepokea mbili alipata nyingine mbili.”
    reason: Mbadala huu unaeleza kwa uwazi zaidi kwamba mbili hizo zilikuwa zimepokelewa, jambo linaloeleweka kutokana na muktadha ingawa halijasemwa wazi katika Kigiriki cha mstari huu.
lexical_decisions:
- source_word: ὡσαύτως
  choice: Vivyo hivyo
  rationale: Kielezi hiki kinaunganisha tendo la mtumishi huyu na tendo la mtumishi aliyetangulia katika mstari wa 16, huku kikidumisha maana ya ulinganisho kwa Kiswahili cha kawaida.
- source_word: ὁ τὰ δύο
  choice: yule aliyekuwa na mbili
  rationale: Kirai cha Kigiriki ni cha mkato na kinamtaja mtumishi kwa zile mbili zilizotajwa katika muktadha. Tafsiri hii inadumisha ufupi huo bila kuongeza wazi neno ‘talanta’ lisilomo katika mstari huu.
- source_word: ἐκέρδησεν
  choice: alipata
  rationale: Katika muktadha huu wa fedha, kitenzi kinaonyesha kupata kiasi cha ziada kwa shughuli yenye mafanikio. ‘Alipata’ ni ya kawaida na haidokezi moja kwa moja malipo ya kazi kama ‘alichuma’ yanavyoweza kudokeza.
- source_word: ἄλλα δύο
  choice: nyingine mbili
  rationale: Kirai hiki kinaonyesha mbili za ziada za aina ileile; ‘nyingine mbili’ ni usemi wa kawaida na ulio wazi katika Kiswahili.
