  text: Kesheni basi[a], kwa kuwa hamjui siku wala saa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaeni macho” au “muwe waangalifu.” Kitenzi cha Kigiriki ni amri kwa wingi; katika muktadha huu kinahimiza kukesha na kuwa tayari.
