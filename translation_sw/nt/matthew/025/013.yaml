lexical_decisions:
- source_word: γρηγορεῖτε
  choice: endeleeni kuwa macho
  rationale: Amri ya wakati uliopo kwa wingi inaonyesha kuwa hali ya kukesha na kuwa tayari inapaswa kuendelea. Usemi huu ni wa asili katika Kiswahili na unahifadhi picha ya kutolala katika muktadha wa mfano.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na mfano uliotangulia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huanzisha sababu ya amri kwa lugha ya kawaida na iliyo wazi.
- source_word: οὐκ οἴδατε
  choice: hamjui
  rationale: Huwakilisha moja kwa moja kitenzi kilichokanushwa katika nafsi ya pili wingi bila kuongeza maana isiyokuwamo.
- source_word: τὴν ἡμέραν
  choice: siku
  rationale: Katika muundo wa Kiswahili, 'siku' baada ya 'hamjui' huwasilisha rejeo maalumu la Kigiriki kwa kawaida bila kulazimisha neno la ziada.
- source_word: οὐδὲ τὴν ὥραν
  choice: wala saa
  rationale: '''Wala'' huunganisha kipengele cha pili kilichokanushwa kwa njia ya kawaida na yenye heshima katika Kiswahili.'
theological_decisions:
- issue: Taswira ya amri ya kuwa macho
  choice: endeleeni kuwa macho
  alternative: kesheni; endeleeni kukesha; iweni waangalifu
  rationale: Inahifadhi taswira ya mfano na maana ya uangalifu unaoendelea, bila kuibana kuwa mfumo fulani wa kieskatolojia.
- issue: Maana inayolengwa na 'siku wala saa'
  choice: kuacha usemi huo bila ufafanuzi wa ziada
  alternative: siku wala saa ya kuja kwa Mwana wa Adamu; wakati uliowekwa
  rationale: Ingawa muktadha mpana unahusu hukumu na kuja kwa Mwana wa Adamu, mstari wenyewe hautaji hayo wazi; tafsiri haiongezi maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, wazi na yenye heshima. Wingi wa amri umehifadhiwa katika 'endeleeni,' na 'kuwa macho' ni nahau inayoeleweka kwa urahisi huku ikidumisha taswira ya mfano.
