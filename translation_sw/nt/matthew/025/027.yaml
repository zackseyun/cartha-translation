  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: sw
  text: Kwa hiyo, ilikupasa kuweka fedha zangu kwa wanabenki, nami nilipokuja ningalipokea mali yangu pamoja na riba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδει
  choice: ilikupasa
  rationale: Kauli hii inaonyesha jambo lililomtaka au lililomfaa mtumwa kufanya zamani, huku ikidumisha nguvu ya lawama kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na shtaka lililotangulia.
- source_word: βαλεῖν
  choice: kuweka
  rationale: Katika muktadha wa fedha na wanabenki, kitenzi hiki humaanisha kukabidhi au kuweka fedha kwao; ‘kuweka’ ni cha kawaida na hakiongezi maelezo yasiyo wazi katika chanzo.
- source_word: τὰ ἀργύριά μου
  choice: fedha yangu
  rationale: ἀργύρια inaweza kumaanisha fedha kama metali au pesa; hapa mazingira ya kibiashara yanaunga mkono maana ya pesa, na ‘fedha’ huhifadhi kiasi fulani cha upana huo.
- source_word: τραπεζίταις
  choice: wanabenki
  rationale: Neno humaanisha watu wanaoshughulika na shughuli za benki au kubadilisha fedha; kutajwa kwa riba kunafanya ‘wanabenki’ kufaa zaidi hapa.
- source_word: ἐλθὼν ἐγὼ
  choice: nami nilipokuja
  rationale: 'Kirai shirikishi kinaonyesha wakati: baada ya bwana kuja ndipo angepokea mali yake.'
- source_word: ἐκομισάμην ἂν
  choice: ningalipokea
  rationale: Muundo wenye ἄν unaonyesha matokeo ambayo yangalitokea lakini hayakutokea; ‘ningalipokea’ hudumisha hali hiyo ya kinyume na uhalisi.
- source_word: τὸ ἐμὸν
  choice: mali yangu
  rationale: Kivumishi milikishi kilichotumika kama nomino kinasisitiza kilichokuwa cha bwana; ‘mali yangu’ ni wazi na cha asili katika muktadha.
- source_word: σὺν τόκῳ
  choice: pamoja na riba
  rationale: τόκος hapa ni ongezeko la fedha lilipwalo juu ya amana au mkopo; ‘riba’ ndiyo istilahi ya kawaida na isiyoingiza hukumu ya kimaadili.
theological_decisions:
- issue: Lugha ya kifedha katika mfano na uwezekano wa kuiona kama hukumu ya kimaadili kuhusu riba
  choice: Kutafsiri istilahi za kifedha moja kwa moja na kwa upande wowote kama taswira ya mfano.
  alternative: Kutumia neno lenye maana ya riba haramu au ya unyonyaji.
  rationale: Aya inatumia shughuli za kifedha katika hoja ya mfano, lakini haitoi hapa hukumu ya jumla ya kuhalalisha au kukataza riba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ilikupasa’ na ‘ningalipokea’ hudumisha lawama na hali ya jambo ambalo halikutokea bila kufanya sentensi kuwa nzito. Hakuna tanbihi iliyoongezwa kwa kuwa ‘fedha’ hubeba kwa kawaida maana ya pesa na pia huhusiana na maana ya msingi ya silver.
