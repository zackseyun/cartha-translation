  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: sw
  text: Akamkabidhi mmoja talanta tano[a], mwingine mbili, na mwingine talanta moja, kila mmoja kwa kadiri ya uwezo wake; na akaondoka mara moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo kikubwa cha uzito au thamani ya fedha; hapa haimaanishi kipawa au uwezo wa asili.
    reason: lexical_alternative
  - marker: b
    text: Au “akaondoka. Mara moja yule aliyepokea talanta tano ...” Kielezi “mara moja” kinaweza kuhusishwa na tendo linalofuata katika mstari wa 16.
    reason: textual_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talanta
  rationale: Neno la kihistoria linahifadhi kipimo kikubwa cha fedha kilichotajwa katika mfano bila kukibadili kuwa sarafu ya kisasa; tanbihi inaondoa uwezekano wa kulielewa kama kipawa cha asili.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: mmoja ... mwingine ... na mwingine
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha mgawanyo tofauti kwa watumishi watatu na kuhifadhi mfuatano wa kulinganisha wa Kigiriki.
- source_word: ἕν
  choice: moja
  rationale: Nomino “talanta” inaeleweka kutokana na orodha iliyotangulia, hivyo si lazima irudiwe.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: kila mmoja kwa kadiri ya uwezo wake
  rationale: Huhifadhi maana ya mgawanyo kwa mtu mmoja mmoja na kueleza δύναμις kama uwezo wa kutekeleza wajibu, si nguvu ya kimiujiza.
- source_word: ἀπεδήμησεν
  choice: akaondoka
  rationale: Kitenzi kina maana ya kwenda mbali au kusafiri; “akaondoka” ni kifupi, cha asili, na kinafaa katika muktadha.
- source_word: εὐθέως
  choice: mara moja
  rationale: Hii ni tafsiri ya kawaida ya kielezi hicho. Kimeunganishwa na kuondoka katika matini kuu, huku tanbihi ikihifadhi uwezekano wa kukiunganisha na tendo linalofuata.
theological_decisions:
- issue: Maana ya τάλαντα katika mfano
  choice: talanta kama vipimo vikubwa vya fedha
  alternative: vipawa au uwezo wa asili
  rationale: Muktadha unahusu mali aliyowakabidhi watumishi; maana ya kisasa ya “talanta” kama kipawa inaweza kupotosha, kwa hiyo tanbihi inafafanua maana ya kifedha.
- issue: Uhusiano wa εὐθέως na sentensi inayotangulia au inayofuata
  choice: akaondoka mara moja
  alternative: “Mara moja” ianze tendo la mtumishi katika mstari unaofuata
  rationale: Mpangilio wa maneno unaruhusu kuhusishwa na kuondoka, kama katika matini ya mashauriano, lakini alama za uakifishaji za wahariri wa Kigiriki na mtiririko wa simulizi pia huunga mkono kuihusisha na tendo linalofuata; tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “mmoja ... mwingine” ni wa kawaida na wazi; “uwezo wake” ni wa umoja na haubainishi jinsia, kama ilivyo kawaida katika Kiswahili.
