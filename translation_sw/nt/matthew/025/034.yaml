id: MAT.25.34
reference: Matthew 25:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: sw
  text: Ndipo Mfalme atakapowaambia walio upande wake wa kulia, “Njooni, ninyi mliobarikiwa na Baba yangu; urithini ufalme ulioandaliwa kwa ajili yenu tangu kuwekwa msingi wa ulimwengu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu kuumbwa kwa ulimwengu.”
    reason: Kifungu cha Kigiriki kina maana ya tangu kuanzishwa au kuumbwa kwa ulimwengu; maandishi makuu yanahifadhi taswira halisi ya kuwekwa msingi.
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano wa matukio katika tukio la hukumu na ni usemi wa kawaida, wenye uzito unaofaa katika Kiswahili.
- source_word: ἐρεῖ
  choice: atakapowaambia
  rationale: Wakati ujao umeunganishwa kwa kawaida na “ndipo”; kiambishi cha yambwa kinaonyesha wazi kwamba maneno yanaelekezwa kwa kundi lililo upande wa kulia.
- source_word: ὁ βασιλεὺς
  choice: Mfalme
  rationale: Ni cheo mahususi cha mhukumu katika muktadha huu, si rejeo la jumla kwa mfalme yeyote.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: walio upande wake wa kulia
  rationale: Huhifadhi mahali pa kundi hilo upande wa kulia wa Mfalme kwa lugha ya kawaida ya Kiswahili, bila kuongeza neno “mkono” ambalo halipo wazi katika Kigiriki.
- source_word: Δεῦτε
  choice: Njooni
  rationale: Ni mwito wa moja kwa moja kwa watu wengi na unalingana na wingi wa wanaoambiwa.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: ninyi mliobarikiwa na Baba yangu
  rationale: Huhifadhi hali ya kupokea baraka na kueleza kwa Kiswahili cha kawaida kwamba Baba ndiye chanzo au mtendaji wa baraka hizo.
- source_word: κληρονομήσατε
  choice: urithini
  rationale: Kitenzi hiki huhifadhi maana ya kupokea kama urithi, pamoja na dhana yake ya kifamilia, badala ya kusema tu “pokeeni.”
- source_word: τὴν ... βασιλείαν
  choice: ufalme
  rationale: Katika muktadha wa kitu kinachorithiwa na kilichoandaliwa, “ufalme” huwasilisha vizuri zaidi milki ya mwisho, huku pia ukidokeza utawala wa kifalme.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: ulioandaliwa kwa ajili yenu
  rationale: Huonyesha maandalizi yaliyokamilishwa na yanayowahusu wale wanaoalikwa; “kwa ajili yenu” ni ya kawaida na wazi.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuwekwa msingi wa ulimwengu
  rationale: Huhifadhi taswira ya Kigiriki ya kuwekwa msingi na maana ya wakati unaoanzia mwanzo wa ulimwengu.
theological_decisions:
- issue: Uhusiano wa τοῦ πατρός μου na οἱ εὐλογημένοι
  choice: mliobarikiwa na Baba yangu
  alternative: mliobarikiwa wa Baba yangu
  rationale: Kimilikishi cha Kigiriki kinaweza kuwasilisha chanzo au mtendaji. Kiswahili “na Baba yangu” huonyesha hilo kwa uwazi bila kuingiza fundisho la ziada.
- issue: Maana ya βασιλεία katika urithi wa mwisho
  choice: ufalme
  alternative: utawala
  rationale: Kwa kuwa ufalme huu unaandaliwa na kurithiwa, “ufalme” hudumisha vizuri wazo la milki inayopokelewa, bila kuondoa kabisa dhana ya utawala wa kifalme.
- issue: Uhusiano wa ἀπὸ καταβολῆς κόσμου na sentensi
  choice: Kifungu hicho kinahusishwa na “ulioandaliwa kwa ajili yenu.”
  alternative: Kukihusisha kwa upana na mwito mzima
  rationale: Kisarufi, kifungu hicho kiko karibu zaidi na kishiriki “ulioandaliwa,” hivyo maana ya moja kwa moja ni kwamba ufalme uliandaliwa tangu mwanzo wa ulimwengu. Tafsiri haipanui kauli hiyo kuwa mfumo maalumu wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo ... atakapowaambia” ni muundo wa kawaida wa kusimulia mfuatano. “Urithini” hudumisha uzito wa mwito bila kuwa wa kizamani kupita kiasi. Alama [a] imo katika maandishi makuu na inalingana na tanbihi yake.
