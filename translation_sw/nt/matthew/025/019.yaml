  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those slaves comes and settles accounts with them.
translation:
  language: sw
  text: Baada ya muda mrefu, bwana wa watumwa wale[a] anakuja na kufanya hesabu nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wa watumishi wale.” Neno la Kigiriki κύριος linaweza kutafsiriwa “bwana,” na δοῦλοι linaweza kutafsiriwa “watumwa” au “watumishi”; hapa matini kuu inasisitiza wazi zaidi uhusiano wa kijamii na kiuchumi katika mfano.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Baada ya muda mrefu
  rationale: μετά pamoja na χρόνον katika hali ya accusative huonyesha wakati unaofuata, yaani “baada ya.” δέ ni kiunganishi hafifu; mtiririko wa Kiswahili unaeleweka bila kuongeza “basi” au “lakini.”
- source_word: ἔρχεται
  choice: anakuja
  rationale: Kitenzi cha Kigiriki kiko katika wakati wa sasa wa kisimulizi. “Anakuja” kinadumisha uhai huo wa simulizi bila kuongeza wazo la kurudi ambalo halijasemwa moja kwa moja katika kitenzi.
- source_word: ὁ κύριος
  choice: bwana
  rationale: Katika muktadha huu κύριος ni mwenye mamlaka juu ya watumwa wa nyumba. “Bwana” ni neno la kawaida na lenye heshima katika Kiswahili kwa uhusiano huo, huku muktadha ukitofautisha matumizi haya na cheo cha moja kwa moja cha Mungu.
- source_word: τῶν δούλων ἐκείνων
  choice: wa watumwa wale
  rationale: δοῦλοι hapa inaonyesha wazi hali ya watu walio chini ya bwana katika mpangilio wa kiuchumi wa mfano; “watumwa” huhifadhi hali hiyo kuliko “watumishi.” “Wale” huwakilisha ἐκείνων.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: na kufanya hesabu nao
  rationale: Kirai hiki ni nahau ya kuhesabu au kusawazisha hesabu na mtu. “Kufanya hesabu nao” ni Kiswahili cha kawaida kinachobeba maana ya uwajibikaji wa kifedha katika mfano.
theological_decisions:
- issue: Maana ya κύριος katika mfano
  choice: bwana
  alternative: Bwana; mkuu
  rationale: Neno hilo hapa humtaja mwenye mamlaka katika hadithi, si lazima cheo cha moja kwa moja cha Kikristo. “Bwana” huhifadhi upana wa κύριος na hufanya kazi kwa kawaida katika Kiswahili, bila kulazimisha tafsiri ya kiteolojia.
- issue: Maana ya δοῦλος
  choice: watumwa
  alternative: watumishi
  rationale: Uhusiano wa kumilikiwa na kuwajibika chini ya bwana ni muhimu katika mazingira ya mfano. “Watumwa” huonyesha hali hiyo wazi; “watumishi” linaweza kuififisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wakati wa sasa “anakuja” umetumiwa kwa makusudi ili kuhifadhi wakati wa sasa wa kisimulizi wa Kigiriki. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
