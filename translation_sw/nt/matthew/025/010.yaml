  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: sw
  text: Lakini walipokuwa wakiondoka kwenda kununua, bwana arusi akaja, na wale waliokuwa tayari wakaingia pamoja naye katika karamu ya arusi[a], na mlango ukafungwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe ya arusi,” au kwa ufupi “arusini.” Neno la Kigiriki lililo katika wingi linaweza kurejelea sherehe nzima ya arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων ... αὐτῶν
  choice: walipokuwa wakienda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tendo jingine lilipotokea, na unadumisha wazo la wao kuondoka na kwenda bila kulieleza kupita kiasi.
- source_word: ἀγοράσαι
  choice: kununua
  rationale: Kitenzi-jina hiki kinaonyesha kusudi. “Kununua” ni Kiswahili cha kawaida; kitu walichokwenda kununua hakijaongezwa kwa kuwa hakitajwi wazi katika mstari huu.
- source_word: νυμφίος
  choice: bwana arusi
  rationale: Hili ni neno la kawaida na lenye heshima kwa mwanamume anayeoa, na linahifadhi taswira ya arusi katika mfano huu.
- source_word: αἱ ἕτοιμοι
  choice: wale waliokuwa tayari
  rationale: Kivumishi cha wingi wa kike kimetumiwa kama nomino na kinawarejelea mabikira waliokuwa tayari. Tafsiri hii ni ya asili na haiingizi maelezo yasiyosemwa.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: wakaingia pamoja naye
  rationale: Hii inawasilisha kwa uwazi mwendo wa simulizi na ushirika wao na bwana arusi.
- source_word: εἰς τοὺς γάμους
  choice: kwenye karamu ya arusi[a]
  rationale: Ingawa neno la Kigiriki liko katika wingi, linaweza kumaanisha sherehe ya arusi kwa ujumla. “Karamu ya arusi” linafaa katika muktadha huu, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- source_word: ἐκλείσθη ἡ θύρα
  choice: mlango ukafungwa
  rationale: Muundo wa kutendwa umehifadhiwa, na usemi huu mfupi unaonyesha ukomo na uzito wa tukio.
theological_decisions:
- issue: Taswira ya arusi katika mfano
  choice: Kudumisha “bwana arusi” na “karamu ya arusi” kama taswira ya kawaida ya simulizi bila kumtambulisha bwana arusi waziwazi kwa tafsiri ya kitheolojia.
  alternative: Kufafanua ndani ya mstari kwamba bwana arusi anamwakilisha Kristo.
  rationale: Maana ya kitheolojia inapaswa kujitokeza kupitia mfano na muktadha wake, si kwa kuongeza ufafanuzi ambao hauko wazi katika maneno ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Mfuatano wa “akaja … wakaingia … ukafungwa” unatunza mwendo wa simulizi na uzito wa mwisho wa mlango kufungwa.
