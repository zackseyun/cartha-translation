  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: sw
  text: Lakini bwana arusi alipokawia[a], wote wakasinzia, wakalala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipochukua muda mrefu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wote wakaanza kusinzia na wakawa wamelala.” Kigiriki kinatofautisha kuanza kusinzia (ἐνύσταξαν) na kuwa katika hali ya kulala (ἐκάθευδον).
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: alipokawia
  rationale: Kitenzi “kukawia” kinaonyesha kwamba bwana arusi alichukua muda mrefu kuliko ilivyotarajiwa. Muundo wa “alipokawia” unawasilisha kwa kawaida uhusiano wa wakati unaoonyeshwa na genitivi huru ya Kigiriki bila kuongeza wazi kwamba alikuwa njiani.
- source_word: δὲ
  choice: Lakini
  rationale: “Lakini” linaonyesha badiliko dogo la simulizi na tofauti kati ya matarajio ya wasichana na kukawia kwa bwana arusi.
- source_word: νυμφίου
  choice: bwana arusi
  rationale: “Bwana arusi” ni neno la kawaida na lenye hadhi katika Kiswahili kwa mwanamume anayefunga ndoa, na linahifadhi taswira ya harusi iliyo katika mfano.
- source_word: ἐνύσταξαν
  choice: wakasinzia
  rationale: “Kusinzia” huonyesha kuingiwa na usingizi au kuwa katika hali ya usingizi mzito unaotangulia kulala, hivyo linahifadhi hatua ya kwanza kabla ya kulala kabisa.
- source_word: πᾶσαι
  choice: wote
  rationale: “Wote” linarejelea wasichana wote waliotajwa katika muktadha na kudumisha msisitizo kwamba hakuna aliyebaki macho.
- source_word: ἐκάθευδον
  choice: wakalala
  rationale: “Wakalala” linaeleza hatua inayofuata baada ya kusinzia kwa Kiswahili cha kawaida. Ingawa kitenzi cha Kigiriki kiko katika wakati usiotimilifu na kinaweza kuonyesha hali iliyoendelea, mfuatano huu wa Kiswahili unawasilisha kwa urahisi kutoka kusinzia hadi kulala.
theological_decisions:
- issue: Taswira ya kimfano ya bwana arusi
  choice: Kudumisha “bwana arusi” kama mhusika wa mfano bila kumtambulisha wazi kuwa ni Kristo ndani ya tafsiri ya aya hii.
  alternative: Kutumia neno la jumla zaidi au kuongeza utambulisho wa Kikristo wa bwana arusi.
  rationale: Muktadha mpana wa Mathayo unaweza kuipa taswira hii maana ya kiteolojia, lakini aya yenyewe inaendelea na simulizi la mfano. Tafsiri inapaswa kuhifadhi taswira na mvutano wake bila kuingiza ufafanuzi wa kiimani katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kisimulizi; “wakasinzia, wakalala” inadumisha hatua mbili tofauti za Kigiriki bila kutumia lugha nzito au ya kizamani.
