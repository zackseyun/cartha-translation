lexical_decisions:
- source_word: ἐπείνασα
  choice: nilikuwa na njaa
  rationale: Hueleza hali ya njaa iliyompata msemaji wakati uliopita kwa Kiswahili cha kawaida na cha sasa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa maneno haya yanatoa sababu ya hukumu iliyotajwa katika muktadha.
- source_word: καὶ
  choice: nanyi
  rationale: Kiunganishi kimetolewa kwa namna ya asili katika Kiswahili, huku kikisisitiza wale walioacha kumsaidia msemaji.
- source_word: οὐκ ἐδώκατέ μοι φαγεῖν
  choice: hamkunipa chakula
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kutompa msemaji kitu cha kula, huku kiwakilishi μοι kikidokezwa wazi katika kiambishi -ni- cha kitenzi.
- source_word: ἐδίψησα
  choice: nilikuwa na kiu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi hali ya kiu na usambamba wake na “nilikuwa na njaa.”
- source_word: οὐκ ἐποτίσατέ με
  choice: hamkunipa kitu cha kunywa
  rationale: Huwasilisha kwa uwazi kutompatia msemaji kinywaji, huhifadhi kiambishi cha yambwa -ni-, na huepuka kudhania kuwa kilichokusudiwa ni maji pekee.
theological_decisions:
- issue: Kiwango cha uhalisia katika vifungu vinavyokanusha kumpa chakula na kinywaji
  choice: Kutumia “hamkunipa chakula ... hamkunipa kitu cha kunywa” katika maandishi makuu.
  alternative: “Hamkunipa nile ... hamkuninywesha.”
  rationale: Chaguo kuu ni la asili na wazi kwa wasomaji wa sasa, huku likihifadhi mkazo juu ya kutomsaidia Yesu binafsi. Tanbihi inahifadhi muundo wa karibu zaidi na Kigiriki bila kuamua upya uzito wa kitheolojia wa tendo hilo katika hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Usambamba wa njaa na kiu umehifadhiwa, pamoja na mkazo wa viambishi vya yambwa vinavyorejelea “mimi.”
