translation:
  language: sw
  text: Kwa maana nilikuwa na njaa, nanyi hamkunipa chakula[a]; nilikuwa na kiu, nanyi hamkunipa kitu cha kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kigiriki, “hamkunipa kitu cha kula ... hamkuninywesha.”
