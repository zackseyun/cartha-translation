  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: sw
  text: Na ni lini tulikuona ukiwa mgonjwa au gerezani, na tukaja kwako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukakutembelea.” Kigiriki kinasema kihalisi zaidi, “tukaja kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: ni lini
  rationale: Ni namna ya kawaida ya kuuliza wakati katika Kiswahili, na inadumisha swali la moja kwa moja.
- source_word: δέ
  choice: na
  rationale: Hapa ni kiunganishi chepesi kinachoendeleza mfululizo wa maswali; ‘na’ ni ya asili kuliko kiunganishi chenye nguvu ya upinzani.
- source_word: εἴδομεν
  choice: tulipokuona
  rationale: Muundo huu unaonyesha tendo la kuona lililotokea wakati uliopita na unaunganika kwa kawaida na swali ‘ni lini’.
- source_word: ἀσθενοῦντα
  choice: ukiwa mgonjwa
  rationale: Katika muktadha huu neno linamaanisha hali ya ugonjwa wa mwili; ‘ukiwa mgonjwa’ ni wazi na ya kawaida.
- source_word: ἐν φυλακῇ
  choice: gerezani
  rationale: Neno linamaanisha mahali pa kifungo; ‘gerezani’ ni tafsiri ya kawaida, fasaha, na isiyoweka tofauti za kisasa za kisheria ambazo hazipo katika Kigiriki.
- source_word: ἤλθομεν πρός σε
  choice: tukaja kwako
  rationale: Hii inadumisha maana ya moja kwa moja ya mwendo kuelekea kwa mtu. ‘Tukakutembelea’ inawezekana kimuktadha lakini ni fafanuzi zaidi kuliko maneno ya Kigiriki.
theological_decisions:
- issue: Iwapo ἤλθομεν πρός σε itafsiriwe kwa namna ya kimuktadha kama ‘tukakutembelea’ au moja kwa moja zaidi kama ‘tukaja kwako’
  choice: tukaja kwako
  alternative: tukakutembelea
  rationale: Kifungu kinahusu tendo la huruma kwa Mwana wa Adamu, lakini maneno yenyewe yanaeleza kuja kwa mtu bila kutumia kitenzi maalumu cha kumtembelea. Tafsiri kuu haiongezi maana hiyo, huku tanbihi ikihifadhi uwezekano wa usemi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali umehifadhiwa bila kuongeza maelezo ya kimadhehebu.
