id: MAT.25.43
reference: Matthew 25:43
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: sw
  text: Nilikuwa mgeni, nanyi hamkunikaribisha[a]; nilikuwa uchi, nanyi hamkunivisha; nilikuwa mgonjwa na gerezani, nanyi hamkunitembelea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hamkunipokea” au “hamkunipa mahali pa kukaa.” Kitenzi cha Kigiriki humaanisha kihalisi “kukusanya,” lakini hapa kinahusu kumpokea mgeni kwa ukarimu.
    reason: lexical_alternative
  - marker: b
    text: “Kunitembelea” hapa kunaweza pia kuwa na maana ya “kunijali” au “kunitunza,” si kufanya ziara ya kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: mgeni
  rationale: Katika orodha hii ya matendo ya huruma yaliyopuuzwa, neno hili humaanisha mtu aliye nje ya kaya au jamii na anayehitaji kupokewa. “Mgeni” ni la kawaida na halibani maana kuwa mtu wa taifa jingine pekee.
- source_word: συνηγάγετέ
  choice: karibisha
  rationale: Ingawa kitenzi συνάγω kwa msingi humaanisha kukusanya, hapa pamoja na ξένος kinamaanisha kumpokea mtu kwa ukarimu. “Karibisha” ni Kiswahili cha asili kinachoonyesha mapokezi hayo.
- source_word: γυμνός
  choice: uchi
  rationale: Neno linaweza kumaanisha kutokuwa na nguo kabisa au kutokuwa na mavazi ya kutosha. “Uchi” huhifadhi nguvu ya usemi wa Kigiriki, huku kitendo kinachofuata cha kumvika kikifafanua uhitaji.
- source_word: περιεβάλετέ
  choice: visha
  rationale: Kitenzi hiki kihalisi huhusu kuweka kitu kuzunguka mtu, na katika muktadha huu ni kumpa au kumvalisha nguo. “Visha” ni fupi, wazi, na ya kawaida.
- source_word: ἀσθενής
  choice: mgonjwa
  rationale: Ingawa linaweza pia kumaanisha dhaifu, katika orodha hii ya wenye uhitaji maana ya ugonjwa ndiyo inayofaa zaidi.
- source_word: ἐν φυλακῇ
  choice: gerezani
  rationale: Hapa φυλακή humaanisha hali au mahali pa kifungo. “Gerezani” ni tafsiri ya kawaida na yenye kueleweka katika Kiswahili cha Afrika Mashariki.
- source_word: ἐπεσκέψασθέ
  choice: tembelea
  rationale: Kitenzi kinaonyesha kumwendea mtu kwa kujali, si ziara ya kijamii tu. “Tembelea” huhifadhi tendo halisi linalotajwa, na kidokezo kinaeleza maana ya utunzaji iliyomo.
theological_decisions:
- issue: Maana ya tendo la huruma katika ἐπεσκέψασθέ με
  choice: hamkunitembelea
  alternative: hamkunijali / hamkunihudumia
  rationale: “Kunitembelea” huhifadhi tendo halisi la kumwendea mgonjwa au mfungwa bila kulifanya kuwa fundisho pana kuliko maandishi. Hata hivyo, kitenzi cha Kigiriki kinadokeza kumwangalia na kumjali mtu, jambo linaloelezwa katika kidokezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza marudio ya Kigiriki (“nilikuwa… nanyi hamku…”) kwa uwazi na uzito wa hukumu. Alama zote za vidokezo zimewekwa moja kwa moja baada ya maneno yanayohusika.
