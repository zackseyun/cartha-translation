  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: sw
  text: Kwa maana wale wapumbavu walipochukua taa zao[a], hawakuchukua mafuta pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mienge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unafafanua kauli iliyotangulia, huku ikiunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: μωραὶ
  choice: wale wapumbavu
  rationale: Kivumishi hiki cha kike katika wingi kinawarejelea wanawali waliotajwa katika muktadha; ‘wale wapumbavu’ huhifadhi sifa hiyo bila kurudia nomino.
- source_word: λαβοῦσαι
  choice: walipochukua
  rationale: Kauli ya wakati huwasilisha kwa ufasaha tendo la kitenzi-shirikishi cha wakati uliopita lililotangulia au kuambatana na tendo kuu.
- source_word: λαμπάδας
  choice: taa
  rationale: ‘Taa’ ni tafsiri ya kawaida na inafaa katika muktadha wa mafuta, ingawa neno la Kigiriki linaweza pia kumaanisha mienge.
- source_word: οὐκ ἔλαβον
  choice: hawakuchukua
  rationale: 'Inahifadhi urudiaji wa kitenzi kilekile katika Kigiriki: walichukua taa lakini hawakuchukua mafuta.'
- source_word: μεθ’ ἑαυτῶν
  choice: pamoja nao
  rationale: Ni namna ya asili ya Kiswahili ya kueleza kuwa hawakuwa na mafuta ya ziada waliyobeba.
- source_word: ἔλαιον
  choice: mafuta
  rationale: Ni tafsiri ya moja kwa moja; katika muktadha huu ni mafuta ya kuwashia taa au mienge.
