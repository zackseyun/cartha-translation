  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: sw
  text: Bwana wake akamwambia, “Vema, mtumishi[a] mwema na mwaminifu! Ulikuwa mwaminifu katika mambo machache; nitakuweka usimamie mambo mengi. Ingia katika furaha ya bwana wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumwa.” Neno la Kigiriki δοῦλος linaweza kumaanisha mtumishi au mtumwa kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: akamwambia
  rationale: Katika usimulizi wa Kiswahili, muundo huu unaunganisha kwa kawaida tendo la kusema na anayeelekezewa maneno hayo.
- source_word: κύριος
  choice: bwana
  rationale: Katika mazingira ya mfano huu, neno hili humaanisha mkuu au mwenye mamlaka juu ya mtumishi. “Bwana” ni neno la kawaida na lenye hadhi katika Kiswahili, bila kulazimisha hapa liwe cheo cha moja kwa moja cha kimungu.
- source_word: δοῦλε
  choice: mtumishi
  rationale: Neno la Kigiriki linaweza kumaanisha mtumwa au mtumishi kulingana na muktadha. Hapa mkazo uko katika uwakili na uaminifu wake; maana yenye nguvu zaidi ya “mtumwa” imehifadhiwa katika tanbihi.
- source_word: Εὖ
  choice: Vema
  rationale: Ni kauli fupi na ya asili ya kuonyesha pongezi au kukubali kwamba jambo limefanywa vizuri.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: mwema na mwaminifu
  rationale: Tafsiri hii inadumisha sifa zote mbili na pia uhusiano wa πιστέ na πιστός inayotokea baadaye katika aya.
- source_word: ἐπὶ ὀλίγα
  choice: katika mambo machache
  rationale: Huwasilisha eneo dogo la wajibu alilokabidhiwa mtumishi bila kufanya Kiswahili kisikike cha kulazimishwa.
- source_word: πιστός
  choice: mwaminifu
  rationale: Inadumisha urudiaji wa wazo lilelile la uaminifu lililo katika sifa ya awali.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: nitakuweka usimamie mambo mengi
  rationale: Hueleza wazi wazo la kumteua mtu kuwa na mamlaka au wajibu juu ya mambo mengi, kwa Kiswahili cha asili.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Ingia katika furaha
  rationale: Inahifadhi taswira ya kuingia ndani ya furaha badala ya kuifafanua tu kuwa kushiriki.
- source_word: τοῦ κυρίου σου
  choice: ya bwana wako
  rationale: Inadumisha maana na istilahi ileile ya uhusiano uliopo ndani ya mfano.
theological_decisions:
- issue: Maana ya κύριος katika mfano wenye mkuu wa kibinadamu
  choice: bwana
  alternative: Bwana kama cheo cha kimungu; au mkuu
  rationale: Mhusika wa moja kwa moja ndani ya simulizi ni bwana wa mtumishi. Herufi ndogo na muktadha vinaacha umuhimu mpana wa mfano ujitokeze bila kugeuza neno hilo kimyakimya kuwa cheo cha moja kwa moja cha Mungu au Masihi.
- issue: Maana ya δοῦλος katika muktadha huu
  choice: mtumishi
  alternative: mtumwa
  rationale: Muktadha unasisitiza uaminifu katika wajibu aliokabidhiwa. “Mtumishi” ni ya asili na inaonyesha uhusiano wa chini ya mamlaka, huku “mtumwa” ikihifadhiwa katika tanbihi kwa sababu ni maana halisi inayowezekana ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Akamwambia” linafaa katika mtiririko wa usimulizi; “nitakuweka usimamie” ni la asili zaidi kuliko tafsiri ya neno kwa neno ya kishazi cha Kigiriki.
