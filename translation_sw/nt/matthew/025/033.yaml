  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: sw
  text: Naye atawaweka kondoo upande wake wa kulia[b], lakini mbuzi upande wa kushoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbuzi wadogo” au “mbuzi wachanga”; neno la Kiyunani ἐρίφια linaweza kumaanisha mbuzi wachanga.
    reason: lexical_alternative
  - marker: b
    text: Kiyunani kihalisi, “kutoka upande wake wa kulia ... kutoka upande wa kushoto”; hii ni nahau ya mahali, ikimaanisha upande wa kulia na upande wa kushoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: atawaweka
  rationale: Kitenzi hiki cha wakati ujao chenye yambwa kinamaanisha kusababisha wasimame au kuwaweka mahali fulani. ‘Atawaweka’ ni Kiswahili cha kawaida na cha moja kwa moja katika tukio hili.
- source_word: πρόβατα
  choice: kondoo
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa πρόβατα, na muktadha tayari umelitambulisha kundi hili.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: upande wake wa kulia
  rationale: Muundo huu wa Kiyunani ni nahau ya kuonyesha mahali upande wa kulia wa mtu. Tafsiri hii inaeleza nafasi bila kuongeza maana ya kiishara.
- source_word: ἐρίφια
  choice: mbuzi
  rationale: Neno la Kiyunani linaweza kumaanisha hasa mbuzi wadogo, lakini ‘mbuzi’ ni neno la kawaida na linaloweka wazi tofauti kuu na kondoo. Maana mahsusi zaidi imehifadhiwa katika tanbihi.
- source_word: ἐξ εὐωνύμων
  choice: upande wa kushoto
  rationale: Hii ni nahau inayomaanisha kuwa upande wa kushoto. Kiwakilishi ‘wake’ hakirudiwi katika Kiyunani, na kwa Kiswahili kinaeleweka kutokana na kifungu kilichotangulia.
- source_word: μὲν ... δὲ
  choice: lakini
  rationale: Jozi hii inaonyesha utofautishaji wa makundi mawili; ‘lakini’ inawasilisha tofauti hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuhifadhi au kufafanua maana za kiishara za kulia na kushoto
  choice: 'Kutafsiri kama nafasi tu: ‘upande wake wa kulia ... upande wa kushoto’'
  alternative: Kupanua kuwa ‘mahali pa kibali’ na ‘mahali pa kutokubaliwa’
  rationale: Mstari wenyewe unaeleza upangaji wa makundi katika tukio la hukumu. Ingawa muktadha unaweza kuzipa pande hizo maana ya kutathmini, kuiongeza moja kwa moja kungevuka yaliyoandikwa katika Kiyunani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaosomeka kwa urahisi huku ukihifadhi utofautishaji wa makundi na nahau ya nafasi.
