  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: sw
  text: Naye Mfalme atawajibu, “Kweli[a] nawaambia, kwa kadiri mlivyomtendea mmoja wa hawa ndugu zangu[b] walio wadogo kabisa, mlinitendea mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno yenyewe kwa karibu zaidi, “Amina, nawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Kirai “hawa ndugu zangu” kinaweza kuwarejelea hasa wanafunzi wa Yesu, waumini kwa ujumla, au kwa maana pana zaidi watu walio dhaifu na wenye mahitaji. Tafsiri imehifadhi maneno ya chanzo bila kuamua mjadala huo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: atawajibu
  rationale: Kirai hiki chenye umbo la kushiriki na kitenzi cha wakati ujao kwa pamoja kina maana ya kujibu na kusema. “Atawajibu” ni Kiswahili cha kawaida kinachohifadhi wazo la kutoa jibu bila kurudia maneno yasiyo ya lazima.
- source_word: ὁ βασιλεὺς
  choice: Mfalme
  rationale: Neno hilo ni cheo dhahiri katika Kigiriki. Herufi kubwa inaonyesha kuwa katika muktadha wa mfano huyu ndiye Mfalme anayehukumu, bila kuondoa cheo chenyewe.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Hili ni tamko la kusisitiza kwa dhati. “Kweli nawaambia” ni la asili na lenye heshima katika Kiswahili cha sasa; tanbihi inahifadhi uwezekano wa kutafsiri Ἀμήν moja kwa moja kuwa “Amina.”
- source_word: ἐφ’ ὅσον
  choice: kwa kadiri
  rationale: Kirai hiki huonyesha kiwango au kiasi. “Kwa kadiri” kinahifadhi maana hiyo na uhusiano wa moja kwa moja kati ya walichowatendea hao ndugu na walichomtendea Mfalme.
- source_word: ἐποιήσατε
  choice: mlivyomtendea … mlinitendea
  rationale: Katika muktadha huu, ποιέω pamoja na mtu katika hali ya dative huelezeka kiasili kwa “kumtendea.” Kurudia kitenzi kunahifadhi ulinganifu wa sentensi ya Kigiriki.
- source_word: ἑνὶ τούτων
  choice: mmoja wa hawa
  rationale: “Mmoja” huhifadhi msisitizo wa mtu mmoja, na “wa hawa” huonyesha kundi linalotajwa kwa ukaribu.
- source_word: τῶν ἀδελφῶν μου
  choice: ndugu zangu
  rationale: “Ndugu” ndilo neno la kawaida la Kiswahili kwa uhusiano wa kindugu na linaweza kutumiwa kwa kundi linaloitwa ndugu. Tafsiri haiongezi utambulisho maalumu ambao mstari wenyewe haujaueleza.
- source_word: τῶν ἐλαχίστων
  choice: walio wadogo kabisa
  rationale: Hii huhifadhi umbo la kiwango cha juu la ἐλάχιστος na uwazi wake kuhusu udogo au hadhi ya chini, bila kulifasiri moja kwa moja kuwa umaskini, unyonge, au kutokuwa muhimu.
- source_word: ἐμοὶ
  choice: mimi
  rationale: “Mlinitendea mimi” ni muundo wa asili wa Kiswahili unaohifadhi msisitizo wa kiwakilishi ἐμοί na utambulisho kati ya tendo kwa ndugu hao na tendo kwa Mfalme.
theological_decisions:
- issue: Wanaorejelewa na maneno “hawa ndugu zangu”
  choice: Maneno hayo yamehifadhiwa bila kubainisha kundi linalokusudiwa.
  alternative: Kuwataja wazi kuwa wanafunzi au wajumbe wa Yesu, waumini wote, au wahitaji na walio hatarini kwa ujumla.
  rationale: Mstari wenyewe hautatui wazi mjadala kuhusu kundi linalorejelewa. Kuhifadhi maneno ya chanzo kunaacha mvutano huo wa kitafsiri bila kuingiza msimamo wa dhehebu.
- issue: Jinsi ya kuwasilisha ἀδελφῶν, nomino ya wingi wa kiume
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume; kaka zangu; ndugu zangu wa kiume na wa kike
  rationale: Katika Kiswahili sanifu, “ndugu” ndilo neno la kawaida na halina tofauti ya lazima ya jinsia katika umbo lake. “Kaka” lingedokeza ndugu wa kiume wa kuzaliwa kwa namna nyembamba zaidi, huku kuongeza “wa kiume na wa kike” kungepanua wazi zaidi ya umbo la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku ulinganifu wa sentensi, msisitizo wa “mimi,” na utata halisi wa “hawa ndugu zangu walio wadogo kabisa” vikihifadhiwa.
