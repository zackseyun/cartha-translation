base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: sw
  text: Ndipo atawajibu, akisema, “Kweli nawaambia[a], kadiri ambavyo hamkumfanyia mmoja wa hawa walio wadogo zaidi[b], wala hamkunifanyia mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo rasmi zaidi, “Amina, nawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “hawa walio wadogo zaidi” yanaweza kueleweka hasa kuwa wanafunzi wa Yesu, au kwa upana zaidi kuwa watu wa hali ya chini na wenye mahitaji; tafsiri imeacha kirai hicho kama kilivyo katika andiko.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha mfuatano wa matukio katika tukio la hukumu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: atawajibu atasema
  rationale: Inahifadhi maana ya kujibu na tendo la kusema bila kulifanya jibu kuwa maelezo yasiyo katika chanzo.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Ni usemi wa asili na mzito katika Kiswahili unaowasilisha uthibitisho wa Ἀμήν bila kuacha neno lisiloeleweka kwa urahisi.
- source_word: ἐφ’ ὅσον
  choice: kwa kadiri ambavyo
  rationale: Inahifadhi wazo la kiwango au uwiano lililo katika kirai cha Kigiriki badala ya kulirahisisha kuwa sababu tu.
- source_word: οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων
  choice: hamkumtendea mmoja wa hawa walio wadogo kabisa
  rationale: Kitenzi 'kumtendea' kinatoa kwa kawaida maana ya kufanya jambo kwa ajili ya mtu iliyodokezwa na muktadha; 'mmoja' na wingi wa kundi vinahifadhiwa.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: hamkunitendea mimi pia
  rationale: Inahifadhi ulinganifu wa kauli hasi na msisitizo wa kiwakilishi ἐμοί; 'pia' hapa ina maana ya kwamba kutowatendea hao ni kutomtendea Yesu.
theological_decisions:
- issue: Utambulisho wa Yesu na ‘hawa walio wadogo kabisa’
  choice: Maneno yanaachwa bila kubainisha kundi hilo zaidi ya aya yenyewe.
  alternative: Kuyatafsiri waziwazi kuwa wanafunzi au wajumbe wa Yesu pekee, au kuwa wahitaji wote kwa ujumla.
  rationale: Aya inalinganisha moja kwa moja kutomtendea mmoja wao na kutomtendea Yesu, lakini haitoshi peke yake kumaliza mjadala kuhusu kundi linalokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini; [a] imewekwa mwishoni mwa nukuu kwa kuwa inahusu usemi “Kweli nawaambia,” na [b] imewekwa baada ya kirai husika.
