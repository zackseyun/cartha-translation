  terminology: ‘Walio wadogo kabisa’ inaeleweka, lakini ‘walio wadogo zaidi’ ni usemi wa kawaida zaidi wa Kiswahili kwa superlative ἐλαχίστων katika muktadha huu. Tanbihi inaendelea kuacha utambulisho wa kundi wazi bila kuingiza tafsiri ya kimadhehebu.
