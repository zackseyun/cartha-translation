  source_fidelity: Msingi wa maana umehifadhiwa, ikiwemo wakati ujao, kauli ya uthibitisho, kipimo cha ἐφ’ ὅσον, umoja wa ‘mmoja,’ na ulinganifu wa kutowatendea hao na kutomtendea Yesu. Hata hivyo, ‘hamkumtendea’ ni pungufu na inaweza kueleweka kama kumtendea mtu jambo baya; ‘hamkumfanyia’ huwasilisha vyema tendo linalodokezwa katika muktadha. ‘pia’ si ulinganifu sahihi wa οὐδέ, ambayo hapa ni ‘wala.’
