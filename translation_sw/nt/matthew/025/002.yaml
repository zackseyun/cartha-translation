  text: And five of them were foolish, and five were wise.
translation:
  language: sw
  text: Watano wao walikuwa wapumbavu, na watano walikuwa wenye busara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: watano
  rationale: Namba ya msingi imetafsiriwa kwa umbo la ngeli linalorejelea wanawali waliotajwa katika muktadha. Kurudiwa kwake kunahifadhi uwiano na ulinganisho wa Kigiriki.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi, si kinyume chenye mkazo; “na” ni ya kawaida na haiongezi uzito usiokuwapo.
- source_word: ἐξ αὐτῶν
  choice: kati yao
  rationale: Kirai hiki ni cha sehemu ya kundi na kinaonyesha kwamba watano hao walitoka katika kundi lililotangulia kutajwa.
- source_word: ἦσαν
  choice: walikuwa
  rationale: Kitenzi hiki cha wakati uliopita kinatumika kama kishirikishi katika maelezo ya hali yao.
- source_word: μωραὶ
  choice: wapumbavu
  rationale: Neno hili linaonyesha ukosefu wa akili au uamuzi mzuri; “wapumbavu” linaweka wazi sifa ya watu hao na kuhifadhi utofauti na wenye busara.
- source_word: καὶ πέντε φρόνιμοι
  choice: na watano walikuwa wenye busara
  rationale: φρόνιμοι humaanisha wenye busara, wenye tahadhari, au wenye uamuzi mzuri. “Wenye busara” ni Kiswahili cha kawaida na chenye hadhi katika ulinganisho huu; “walikuwa” imerudiwa kwa uwazi wa sentensi.
