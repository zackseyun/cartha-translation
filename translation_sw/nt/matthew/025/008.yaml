id: MAT.25.8
reference: Matthew 25:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: sw
  text: Lakini wale wapumbavu wakawaambia wale wenye busara, “Tupeni kiasi cha mafuta yenu, kwa maana taa zetu zinazimika.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mienge” badala ya “taa” (Kigiriki λαμπάδες); neno hili linaweza kumaanisha kifaa cha mwanga kinachowaka na kubebwa mkononi, na watafsiri hutofautiana kulingana na jinsi wanavyoelewa tukio hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: wale wapumbavu
  rationale: Kivumishi hiki kimetumiwa kama nomino kurejelea kundi la wanawali katika mfano. “Wale wapumbavu” kinadumisha utofauti wa wazi na wenye busara bila kuongeza maelezo yasiyomo.
- source_word: φρονίμοις
  choice: wale wenye busara
  rationale: Neno hili linaonyesha busara ya kimatendo na utayari. “Wenye busara” ni Kiswahili cha kawaida na chenye heshima kinachofaa katika muktadha huu.
- source_word: Δότε
  choice: Tupeni
  rationale: Ni amri/ombi la moja kwa moja kwa watu wengi. “Tupeni” linaonyesha kwa kawaida kwamba mafuta yaombwayo yatolewe kwa kundi la wasemaji.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: kiasi cha mafuta yenu
  rationale: Muundo wa ἐκ pamoja na hali ya umilikishi una maana ya sehemu ya akiba yao. “Kiasi cha mafuta yenu” ni usemi wa asili unaohifadhi maana hiyo ya sehemu.
- source_word: λαμπάδες
  choice: taa
  rationale: λαμπάς inaweza kumaanisha taa au mwenge. “Taa” inafaa kwa muktadha wa mafuta na ni neno linaloeleweka kwa urahisi, huku uwezekano wa “mienge” ukihifadhiwa katika tanbihi.
- source_word: σβέννυνται
  choice: zinazimika
  rationale: 'Wakati wa sasa unaonyesha tendo linaloendelea: miali iko katika hatua ya kuzimika. “Zinazimika” ni ya asili na haidokezi lazima kwamba mtu mwingine ndiye anayeizima.'
- source_word: ὅτι
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi. “Kwa maana” ni usemi wa sasa wenye hadhi unaodumisha uhusiano wa kisababishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha utofauti wa kimfano kati ya wapumbavu na wenye busara, pamoja na hali inayoendelea ya taa kuzimika.
