translation:
  language: sw
  text: Basi, chukueni talanta hiyo kutoka kwake, kisha mpeni yule aliye na talanta kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo kikubwa cha uzito na, kwa matumizi, kiasi cha fedha.
