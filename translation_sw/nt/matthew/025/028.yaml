lexical_decisions:
- source_word: ἄρατε
  choice: mnyang’anyeni
  rationale: Kitenzi hiki ni amri ya wingi na katika muktadha huu kina maana ya kuondoa kitu alicho nacho mtu. “Mnyang’anyeni” ni Kiswahili cha kawaida kinachoonyesha wazi kuchukuliwa kwake kutoka kwake.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hukumu iliyotangulia katika mfano.
- source_word: ἀπ’ αὐτοῦ
  choice: -nyang’anyeni
  rationale: Kiambishi cha mtendwa katika “mnyang’anyeni” pamoja na maana ya kitenzi kinaonyesha kwamba talanta inaondolewa kutoka kwake bila kurudia maneno yasiyo ya lazima.
- source_word: τὸ τάλαντον
  choice: talanta hiyo
  rationale: “Talanta” huhifadhi kipimo cha kihistoria cha uzito na fedha; “hiyo” huonyesha talanta maalumu iliyokwisha tajwa.
- source_word: δότε
  choice: kumpa
  rationale: Huhifadhi amri ya kutoa kitu kwa mtu, huku ikiunganishwa kwa kawaida na amri ya kwanza katika Kiswahili.
- source_word: τῷ ἔχοντι
  choice: yule aliye na
  rationale: Ni tafsiri ya kawaida ya kishiriki chenye kibainishi, bila kuongeza kwamba mhusika ni mwanamume.
- source_word: τὰ δέκα τάλαντα
  choice: talanta kumi
  rationale: Hurejelea kiasi maalumu kilichotajwa tayari; katika Kiswahili umaalumu huo unaeleweka kutokana na “yule” na muktadha.
theological_decisions:
- issue: Maana ya τάλαντον katika mfano
  choice: Imetafsiriwa kwa neno la kihistoria “talanta,” si kama kipawa cha asili.
  alternative: fedha nyingi; kiasi cha fedha
  rationale: Mfano unahusu mali iliyokabidhiwa na uwajibikaji. Neno “talanta” huhifadhi mazingira ya kihistoria, huku tanbihi ikizuia kuchanganywa na maana ya kisasa ya kipawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mnyang’anyeni” ni wazi na asilia zaidi kuliko muundo mrefu “chukueni kutoka kwake.” Tanbihi moja tu imehitajika; tofauti ya “chukua/chukua kutoka” imewakilishwa moja kwa moja na kitenzi kilichochaguliwa.
