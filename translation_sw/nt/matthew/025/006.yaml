  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: sw
  text: 'Lakini usiku wa manane, kilio kikuu kikasikika: “Tazama, bwana arusi! Tokeni mkutane naye.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Lakini usiku wa manane
  rationale: Kirai cha Kigiriki kinaonyesha wakati, ‘usiku wa manane’; δέ hapa ni kiunganishi chepesi chenye ladha ya utofautishaji, kinachowakilishwa kwa ‘Lakini.’
- source_word: κραυγὴ γέγονεν
  choice: sauti ya kilio ikasikika
  rationale: Kirai hiki kinatangaza kutokea kwa kilio au mwito kwa ghafla. ‘Sauti ya kilio ikasikika’ ni Kiswahili cha kawaida na huhifadhi nguvu ya tangazo bila tafsiri isiyo ya kawaida kama ‘kilio kilitokea.’
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu. ‘Tazama’ ni la heshima, linaeleweka katika Kiswahili sanifu, na huhifadhi nguvu ya tangazo.
- source_word: ὁ νυμφίος
  choice: bwana arusi
  rationale: Neno νυμφίος humaanisha mwanamume anayefunga ndoa. ‘Bwana arusi’ ndilo neno la kawaida la Kiswahili katika mazingira ya harusi.
- source_word: ἐξέρχεσθε
  choice: Tokeni
  rationale: Amri hii ina maana ya kutoka nje. ‘Tokeni’ ni wingi unaofaa kwa wanaoitwa na haiongezi kwa lazima mtazamo wa ‘kuja’ au ‘kwenda’ ambao Kigiriki kinaweza kuacha wazi.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: mkamlaki
  rationale: Kirai hiki humaanisha kwenda kukutana na mtu anayewasili, mara nyingi kwa lengo la kumpokea. Kitenzi ‘kulaki’ kinafaa kwa muktadha wa msafara wa harusi na ni kifupi na cha asili.
theological_decisions:
- issue: Mhusika anayewakilishwa na νυμφίος katika mfano
  choice: bwana arusi
  alternative: Bwana Arusi
  rationale: Herufi ndogo huhifadhi kiwango cha simulizi la mfano. Ingawa katika muktadha mpana bwana arusi anaweza kueleweka kuwa anamwakilisha Yesu, mstari wenyewe haumtambui moja kwa moja kwa jina wala cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumiwa kwa ‘ikasikika,’ na ‘mkamlaki’ huhifadhi picha ya kwenda kumpokea anayewasili. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
