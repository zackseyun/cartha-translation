  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: sw
  text: Ndipo wanawali wote wale wakaamka, wakazitayarisha taa zao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mienge” badala ya “taa” (Kigiriki λαμπάδας); neno hilo linaweza kumaanisha kifaa cha mwanga kinachobebwa mkononi, na muktadha wa mafuta na matayarisho unaruhusu tafsiri zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha tukio linalofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: ἠγέρθησαν
  choice: wakaamka
  rationale: Katika muktadha wa usingizi, kitenzi hiki humaanisha kuamka na kuinuka; “wakaamka” ni cha kawaida na wazi.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: wanawali wote wale
  rationale: “Wanawali” huhifadhi maana ya wanawake ambao hawajaolewa katika mazingira ya harusi, bila kutumia lugha ya kizamani.
- source_word: ἐκόσμησαν
  choice: wakazitayarisha
  rationale: Kitenzi humaanisha kupanga au kuweka tayari. Kwa taa, kinahusu kuzitengeneza ili zitumike, huenda kwa kurekebisha utambi na mafuta; “kuzitayarisha” ni asilia na hakiongezi maelezo yasiyotajwa wazi.
- source_word: λαμπάδας
  choice: taa
  rationale: Neno la Kigiriki linaweza kumaanisha taa au mienge. Kutajwa kwa mafuta na kuzitayarisha kunafanya “taa” kuwa tafsiri inayofaa, huku uwezekano wa “mienge” ukihifadhiwa katika tanbihi.
- source_word: ἑαυτῶν
  choice: zao
  rationale: Kiwakilishi rejeshi kinaonyesha kuwa taa zilikuwa za wanawali wenyewe; Kiswahili huonyesha umilikaji huo kwa kawaida kwa “zao” bila mkazo wa ziada.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakazitayarisha taa zao” ni wazi zaidi kwa wasomaji wa kawaida kuliko usemi wa kiufundi wa kukata au kurekebisha tambi, na huhifadhi upana wa ἐκόσμησαν.
