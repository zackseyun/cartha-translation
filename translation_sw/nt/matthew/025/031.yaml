  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: sw
  text: Lakini Mwana wa Adamu atakapokuja katika utukufu wake, na malaika wote pamoja naye, ndipo atakapoketi juu ya kiti cha enzi cha utukufu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Lakini ... atakapokuja
  rationale: “Lakini” linaonyesha mpito wenye utofauti mdogo katika hotuba, na muundo wa wakati wa Kiswahili “atakapokuja” unaeleza tukio moja la wakati ujao kwa kawaida.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni jina la cheo lililozoeleka katika Biblia ya Kiswahili na linahifadhi mwangwi wa Danieli pamoja na uzito wake wa Kikristo bila kulifafanua kupita kiasi.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: katika utukufu wake
  rationale: “Utukufu” huhifadhi maana ya fahari na ukuu unaodhihirishwa, pamoja na mwangwi wa matumizi ya kibiblia.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: pamoja na malaika wote
  rationale: Hutoa maana ya kuandamana kwa lugha ya kawaida na haiongezi kimilikishi “wake,” ambacho hakipo wazi katika maandishi ya Kigiriki.
- source_word: τότε καθίσει
  choice: ndipo atakapoketi
  rationale: “Ndipo” linaonyesha mfuatano wa matukio, na “atakapoketi” ni tafsiri ya moja kwa moja na ya asili ya tendo la wakati ujao.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: juu ya kiti chake cha enzi chenye utukufu
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba kiti cha enzi kinahusishwa na utukufu wake, huku tafsiri iliyo karibu zaidi na muundo wa Kigiriki ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” linahifadhi jina la cheo la Yesu na uhusiano wake na Danieli 7; “Mwanadamu” lingeweza kufifisha uzito huo wa Kimasihi na wa hukumu.
- issue: Maana ya θρόνου δόξης αὐτοῦ
  choice: kiti chake cha enzi chenye utukufu
  alternative: kiti cha enzi cha utukufu wake
  rationale: Chaguo kuu ni la asili kwa msomaji wa kisasa, lakini haliondoi uhusiano wa kiti cha enzi na utukufu wa Mwana wa Adamu. Muundo wa karibu zaidi na Kigiriki umetolewa katika tanbihi ili kuhifadhi uwazi wa kifasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Biblia lakini kinachoeleweka kwa urahisi. “Kiti cha enzi” limetumiwa badala ya neno la kale au lisilo la kawaida, na muundo wa “ndipo atakapoketi” unadumisha mfuatano wa sentensi kwa ufasaha.
