  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: sw
  text: Lakini wale wenye busara wakajibu, “La, tusije tukawa na mafuta yasiyotosha sisi na ninyi.[a] Badala yake, nendeni kwa wale wanaouza, mnunue kwa ajili yenu wenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa muundo wa karibu zaidi, “yasije yakatutosha sisi na ninyi.” Kigiriki kina usemi wa tahadhari unaoonyesha hofu kwamba mafuta hayangetosha. Baadhi ya nakala huongeza ukanushi wa mkazo, unaoweza kueleweka “yasitoshe kabisa”; katika SBLGNT maneno hayo yamewekwa katika mabano kuonyesha kutokuwa na uhakika wa ushahidi wa nakala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: wakajibu
  rationale: Kitenzi hiki ni cha kawaida katika masimulizi ya mazungumzo na kinahifadhi wazo la kutoa jibu.
- source_word: αἱ φρόνιμοι
  choice: wale wenye busara
  rationale: φρόνιμος hapa huonyesha busara ya vitendo katika kujitayarisha. Muundo huu pia unahifadhi kivumishi kilichotumiwa kama nomino bila kuongeza ‘wanawali’ katika aya hii.
- source_word: λέγουσαι
  choice: (imewakilishwa katika usemi wa moja kwa moja baada ya ‘wakajibu’)
  rationale: Kutafsiri ‘wakijibu wakisema’ kungekuwa na urudiaji usio wa lazima katika Kiswahili; usemi wa moja kwa moja unaonyesha wazi tendo la kusema.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: La, isije ikawa hayatutoshi
  rationale: ‘La’ huweka wazi uk拒aji unaodokezwa na muktadha, huku ‘isije ikawa hayatutoshi’ ikihifadhi hofu ya uwezekano wa kutotosha badala ya kuigeuza kuwa taarifa ya uhakika.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: sisi na ninyi
  rationale: Katika muktadha wa kitenzi ‘kututosha,’ viwakilishi hivi vinaeleza kwa kawaida makundi yote mawili ambayo mafuta yangepaswa kuwatosha.
- source_word: πορεύεσθε μᾶλλον
  choice: Badala yake, nendeni
  rationale: ‘Badala yake’ huonyesha kwamba tendo linalofuata ndilo chaguo linalopendekezwa; ‘nendeni’ ni amri ya kawaida na ya moja kwa moja.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: kwa wale wanaouza
  rationale: Huhifadhi kishiriki cha Kigiriki kilichotumiwa kama nomino bila kuongeza kitu kinachouzwa, ingawa mafuta yanaeleweka kutokana na muktadha.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: mnunue kwa ajili yenu wenyewe
  rationale: ‘Mnunue’ ni amri ya kawaida, na ‘kwa ajili yenu wenyewe’ huonyesha wazi maana ya kiwakilishi jirejeshi cha Kigiriki.
theological_decisions:
- issue: Kiwango cha uhakika katika kauli kuhusu mafuta kutotosha
  choice: isije ikawa hayatutoshi
  alternative: hakika hayatatutosha
  rationale: Kigiriki kinaonyesha hofu kubwa kwamba mafuta hayatatosha, lakini hakilazimishi kuifanya kauli hiyo unabii au uhakika kamili. Tafsiri iliyochaguliwa inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wenye busara’ ni wazi kwa wasomaji wa kawaida na hudokeza busara ya vitendo. Muundo wa usemi umeepuka urudiaji mzito wa ‘wakajibu wakisema,’ huku ukihifadhi mazungumzo ya moja kwa moja.
