  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: sw
  text: Nilikuwa uchi, mkanivika nguo; nilikuwa mgonjwa, mkanitembelea[a]; nilikuwa gerezani, mkaja kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkanitunza.” Kitenzi cha Kigiriki kinaweza kumaanisha kumtembelea mtu kwa kujali hali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: uchi
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili kwa hali ya kutokuwa na nguo; katika muktadha linaweza pia kudokeza kutokuwa na mavazi ya kutosha.
- source_word: περιεβάλετέ
  choice: mkanivika nguo
  rationale: Kitenzi περιβάλλω hapa kina maana ya kumwekea mtu mavazi. Kauli hii ni ya kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: ἠσθένησα
  choice: nilikuwa mgonjwa
  rationale: Ingawa kitenzi kinaweza kumaanisha kuwa dhaifu, katika muktadha huu wa matendo ya huruma maana inayofaa zaidi ni kuwa mgonjwa.
- source_word: ἐπεσκέψασθέ
  choice: mkanitembelea
  rationale: ἐπισκέπτομαι humaanisha kumtembelea mtu, mara nyingi kwa kujali hali yake. “Mkanitembelea” huhifadhi tendo lililotajwa bila kulipanua kupita kiasi; kidokezo cha kujali kinaelezwa katika tanbihi.
- source_word: φυλακῇ
  choice: gerezani
  rationale: φυλακή hapa ni mahali pa kifungo. “Gerezani” ni usemi wa kawaida na mpana katika Kiswahili.
- source_word: ἤλθατε πρός με
  choice: mkaja kwangu
  rationale: Hii inafuata kwa karibu kauli rahisi ya Kigiriki na haiongezi wazo la kutembelea, ambalo tayari limetajwa katika kishazi kilichotangulia.
theological_decisions:
- issue: Kiwango cha upanuzi wa maana katika matendo ya huruma
  choice: Kuhifadhi matendo halisi ya kumvika, kumtembelea na kuja kwake bila kuyaeleza kwa maneno mengi zaidi.
  alternative: Kutafsiri ἐπεσκέψασθέ με kuwa “mkanitunza” au ἤλθατε πρός με kuwa “mkaja kunitembelea.”
  rationale: Maneno ya Kigiriki ni ya moja kwa moja. Tafsiri hii inaacha matendo ya huruma yajieleze yenyewe bila kuongeza maana ya kichungaji au ya kimadhehebu isiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo “mkanivika,” “mkanitembelea,” na “mkaja” inaendeleza mfululizo wa matendo kwa lugha ya kawaida na yenye usomaji mzuri.
