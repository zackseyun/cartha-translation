  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: sw
  text: Ndipo wenye haki watamjibu wakisema, “Bwana, ni lini tulikuona una njaa tukakulisha, au una kiu tukakunywesha?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi na inaungana kiasili na umbo la ‘watakapomjibu’ katika Kiswahili.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: watakapomjibu
  rationale: Kitenzi hiki kina maana tendaji ya kujibu; kiambishi ‘-m-’ kinawakilisha kwa uwazi yule wanayemjibu.
- source_word: οἱ δίκαιοι
  choice: wenye haki
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya kivumishi kilichotumiwa kama nomino, bila kuongeza maelezo yasiyomo katika matini.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kinahifadhi kishiriki kinachoanzisha maneno ya moja kwa moja kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni namna ya kawaida ya kumwita κύριος na inadumisha heshima pamoja na uzito wa cheo hicho katika muktadha.
- source_word: πεινῶντα
  choice: ukiwa na njaa
  rationale: Inaeleza hali ya mtu aliyeonekana kwa Kiswahili cha kawaida na cha wazi.
- source_word: ἐθρέψαμεν
  choice: tukakulisha
  rationale: Inatoa maana halisi ya kumpa mwenye njaa chakula kwa kauli fupi na ya kawaida.
- source_word: διψῶντα
  choice: ukiwa na kiu
  rationale: Inadumisha ulinganifu na ‘ukiwa na njaa’ na kueleza hali inayoendelea wakati wa kuonekana.
- source_word: ἐποτίσαμεν
  choice: tukakunywesha
  rationale: Kitenzi ‘kunywesha’ humaanisha kumpa mtu kitu cha kunywa na kinaakisi kwa usahihi tendo linalotajwa na Kigiriki.
theological_decisions:
- issue: Tafsiri ya κύριος katika maneno ya moja kwa moja yanayomwelekea Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: ‘Bwana’ huhifadhi namna ya heshima ya kumwita Yesu na uwezekano wa uzito wa kikristo wa cheo hicho bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ‘Ndipo ... watakapomjibu’ ni wa asili na huhifadhi uhusiano wa wakati uliomo katika τότε.
