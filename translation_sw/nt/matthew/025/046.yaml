base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: sw
  text: Nao hawa wataondoka kwenda katika adhabu ya milele[a], lakini wenye haki wataenda katika uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adhabu ya zama” ... “uzima wa zama.” Maana ya kivumishi αἰώνιος hujadiliwa katika baadhi ya miktadha, lakini hapa neno lilelile linafafanua “adhabu” na “uzima”; kwa hiyo tafsiri inahifadhi ulinganifu kwa kutumia “ya milele” katika vifungu vyote viwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: wataondoka kwenda
  rationale: Kitenzi hiki cha wakati ujao kinaonyesha kuondoka au kwenda mahali pengine. “Wataondoka kwenda” ni Kiswahili cha kawaida kinachohifadhi wazo la kuondoka pamoja na mwelekeo unaofuata.
- source_word: οὗτοι
  choice: hawa
  rationale: Kiwakilishi hiki elekezi kinarejelea kundi lililotajwa katika muktadha uliotangulia na kudumisha utofautishaji wake na “wenye haki.”
- source_word: κόλασιν
  choice: adhabu
  rationale: Katika muktadha huu wa hukumu, neno hili linamaanisha matokeo ya kuadhibiwa. “Adhabu” ni neno wazi na la kawaida bila kuongeza maelezo ya kimadhehebu.
- source_word: αἰώνιον
  choice: ya milele
  rationale: Kivumishi kilekile kinatumika kwa “adhabu” na “uzima.” Kutumia “ya milele” katika vifungu vyote viwili kunahifadhi ulinganifu wa Kigiriki na ni usemi wa kawaida katika Kiswahili sanifu.
- source_word: δίκαιοι
  choice: wenye haki
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa watu wanaotambulika kuwa waadilifu au wenye haki. “Wenye haki” ni usemi wa kawaida wa kibiblia na wa Kiswahili cha sasa.
- source_word: ζωὴν
  choice: uzima
  rationale: “Uzima” linafaa katika muktadha wa kibiblia unaohusu hatima ya mwisho na linatofautisha maana hiyo na hali ya kawaida ya kuwa hai.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya makundi hayo mawili na hatima zao.
theological_decisions:
- issue: Tafsiri ya αἰώνιον katika vifungu sambamba κόλασιν αἰώνιον na ζωὴν αἰώνιον
  choice: Kutafsiri αἰώνιον kuwa “ya milele” katika vifungu vyote viwili
  alternative: “inayodumu kwa enzi” katika vifungu vyote viwili
  rationale: Kivumishi kilekile kinafafanua “adhabu” na “uzima,” kwa hiyo tafsiri haipaswi kutofautisha muda au sifa zao kimyakimya. “Ya milele” ni tafsiri ya kawaida na inayofaa katika muktadha huu; tafsiri mbadala inayohusisha enzi imetajwa katika tanbihi ili kuhifadhi mjadala wa kimsamiati.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. Kitenzi “wataenda” katika kifungu cha pili kimewekwa wazi kwa sababu udondoshaji wa kitenzi kama ulivyo katika Kigiriki ungekuwa mgumu katika Kiswahili; hakiongezi dai jipya la kitheolojia.
