id: MAT.25.29
reference: Matthew 25:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: sw
  text: Kwa maana kila aliye nacho atapewa, naye atakuwa na tele[a]; lakini yule asiye nacho, hata kile alicho nacho kitachukuliwa kutoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye atakuwa na ziada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Kwa maana kila aliye nacho
  rationale: 'γάρ linaonyesha sababu au ufafanuzi wa kauli iliyotangulia, hivyo limetafsiriwa ‘Kwa maana.’ Muundo wa kivumishi-tendo chenye kibainishi pamoja na παντί una maana ya mgawanyo: ‘kila aliye nacho.’ ‘Nacho’ ni usemi wa kawaida wa Kiswahili unaohifadhi kutotajwa wazi kwa kitu kinachomilikiwa.'
- source_word: δοθήσεται
  choice: atapewa
  rationale: Hili ni kitenzi cha wakati ujao katika kauli ya kutendwa. ‘Atapewa’ huhifadhi kauli hiyo bila kumtaja mtoaji ambaye hakutajwa katika Kigiriki.
- source_word: καὶ περισσευθήσεται
  choice: naye atakuwa na tele
  rationale: Katika muktadha huu περισσεύω huonyesha hali ya kuwa na wingi au zaidi ya kutosha. ‘Atakuwa na tele’ ni Kiswahili cha kawaida na chenye hadhi kinachoeleza matokeo hayo.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: lakini yule asiye nacho
  rationale: Muundo huu unamtaja mtu mmoja kwa maana ya jumla na unatofautisha hali yake na ya ‘kila aliye nacho.’ ‘Lakini yule asiye nacho’ huhifadhi tofauti hiyo na umoja wa uwakilishi.
- source_word: καὶ ὃ ἔχει
  choice: hata kile alicho nacho
  rationale: καί lina nguvu ya kupandisha mkazo hapa, kwa hiyo ‘hata’ huonyesha vizuri mshangao wa kwamba kile alicho nacho pia kitaondolewa.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: kitachukuliwa kutoka kwake
  rationale: Wakati ujao wa kauli ya kutendwa na ἀπό ya utengano vimehifadhiwa kwa ‘kitachukuliwa kutoka kwake,’ usemi unaoonyesha kuondolewa kwa kile alicho nacho.
theological_decisions:
- issue: Umoja wa uwakilishi katika miundo ya vivumishi-tendo vya kiume
  choice: Kutumia ‘kila aliye nacho’ na ‘yule asiye nacho’ katika umoja
  alternative: 'Kutumia wingi: ‘wote walio nacho ... wale wasio nacho’'
  rationale: Kigiriki kinatumia miundo ya umoja yenye maana ya jumla. Kiswahili hakihitaji kuingiza kiwakilishi cha jinsia hapa, na umoja unaweza kuhifadhiwa kiasili bila kubadili maana kuwa wingi.
- issue: Kitu kinachomilikiwa hakijatajwa wazi
  choice: Kutumia ‘nacho’ bila kuongeza nomino mahsusi
  alternative: Kutumia ‘aliye na kitu’ au kutaja ‘talanta’
  rationale: Chanzo hakitaji kitu hicho moja kwa moja katika mstari huu. ‘Nacho’ huhifadhi utegemezi wa muktadha na kuepuka kufunga maana kwa ufafanuzi ulioongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa kulinganisha wa chanzo, kauli za kutendwa, na umoja wa uwakilishi; ‘tele’ ni neno linaloeleweka kwa urahisi na linafaa katika sajili ya kibiblia bila kuwa la kizamani.
