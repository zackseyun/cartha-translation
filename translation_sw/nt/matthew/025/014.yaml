  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own slaves and entrusted his possessions to them.
translation:
  language: sw
  text: Kwa maana ni kama mtu aliyekuwa akienda safarini, akawaita watumwa wake mwenyewe[a] na kuwakabidhi mali yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wake mwenyewe.” Neno la Kigiriki doulos linaweza kumaanisha mtumishi au mtumwa, kutegemea muktadha; hapa “watumwa” limetumiwa kwa sababu kifungu hiki kinasisitiza umiliki na mamlaka ya bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Kwa maana ni kama
  rationale: Kifungu hiki kinaanzisha ulinganisho unaoeleza yaliyotangulia. Maneno “ni kama” yanakamilisha kwa Kiswahili ulinganisho ambao umeachwa bila kiarifu wazi katika Kigiriki.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu ni mhusika wa kiume, lakini neno la kawaida la Kiswahili “mtu” ni la asili na halibadili utambulisho unaoonekana katika simulizi.
- source_word: ἀποδημῶν
  choice: aliyekuwa akienda safari
  rationale: Kitenzi hiki huonyesha kuondoka kwenda mahali pengine. Tafsiri hii ni ya kawaida na haiongezi wazo maalumu la kwenda nchi ya nje.
- source_word: ἐκάλεσεν
  choice: aliwaita
  rationale: Hii ndiyo maana ya moja kwa moja katika muktadha wa bwana anayewaita walio chini ya mamlaka yake.
- source_word: τοὺς ἰδίους δούλους
  choice: watumwa wake mwenyewe
  rationale: “Watumwa” huhifadhi hali ya kutokuwa huru na mamlaka ya bwana iliyo dhahiri katika mfano huu; “wake mwenyewe” huonyesha msisitizo wa ἰδίους.
- source_word: παρέδωκεν
  choice: kuwakabidhi
  rationale: Katika muktadha wa usimamizi wa mali, “kuwakabidhi” huonyesha kukabidhi kitu pamoja na wajibu wa kukitunza au kukisimamia.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: mali yake
  rationale: Kifungu hiki kinamaanisha vitu vilivyokuwa mali ya mtu huyo. “Mali yake” ni wazi, sahili, na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mazingira ya nyumba ndani ya mfano
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” halainishi hali ya kijamii inayodokezwa na δοῦλος na inafaa kwa sababu umiliki na mamlaka ya bwana vinaonekana wazi. Tanbihi inataja tafsiri mbadala inayowezekana kulingana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa urahisi. Muundo wa sentensi unahifadhi ulinganisho wa Kigiriki huku ukikamilishwa kwa namna ya kawaida katika Kiswahili.
