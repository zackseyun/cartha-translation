  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: sw
  text: Lakini yeye akawajibu, “Kweli nawaambia, siwajui.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siwatambui.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi, “siwajui,” ambayo katika muktadha inaweza kumaanisha kutowatambua kwa upande wa uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Lakini yeye akawajibu
  rationale: Muundo wa Kigiriki wa ‘akajibu akasema’ ni fomula ya kisimulizi; ‘akawajibu’ ni Kiswahili cha asili kinachohifadhi maana, huku ‘Lakini’ ikionyesha tofauti na ombi lililotangulia.
- source_word: Ἀμὴν
  choice: Kweli
  rationale: Katika kauli ya Yesu Ἀμὴν λέγω ὑμῖν, ‘Kweli’ huwasilisha uthibitisho wenye uzito kwa lugha ya sasa na inayoeleweka kuliko kuacha ‘Amina’.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya anwani ya moja kwa moja kwa kundi; kiambishi -wa- pia huhifadhi wingi wa ὑμῖν.
- source_word: οὐκ οἶδα ὑμᾶς
  choice: siwajui
  rationale: ‘Siwajui’ huhifadhi maana ya msingi ya οἶδα na wingi wa ὑμᾶς bila kufafanua kupita kiasi hali ya uhusiano inayodokezwa katika muktadha.
theological_decisions:
- issue: Uzito wa kauli ‘siwajui’ katika mfano
  choice: Kudumisha maneno rahisi lakini yenye uzito wa kimahusiano, ‘siwajui.’
  alternative: ‘Siwatambui’ au ‘sina uhusiano nanyi.’
  rationale: Muktadha unadokeza kutotambuliwa na kukataliwa kimahusiano, lakini aya yenyewe haisemi wazi zaidi ya ‘siwajui’; tafsiri haipaswi kuingiza hitimisho pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Nawaambia’ na ‘siwajui’ huonyesha wazi kwamba ‘ninyi’ ni wengi.
