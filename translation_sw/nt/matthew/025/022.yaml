  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: sw
  text: Kisha yule aliyekuwa amepokea talanta mbili naye akamkaribia na kusema, “Bwana[a], ulinikabidhi talanta mbili[b]. Tazama, nimepata talanta nyingine mbili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki kyrios, ambalo kwa kawaida hutafsiriwa “Bwana,” katika mfano huu linaweza pia kutumiwa kama wito wa heshima kwa bwana.
    reason: alternative_reading
  - marker: b
    text: Talanta ilikuwa kipimo kikubwa cha uzito na thamani ya fedha, wala si kipawa cha asili.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: akaja
  rationale: Kitenzi hiki kinaonyesha kuwa mtumishi alimkaribia bwana wake ili kutoa taarifa. “Akaja” ni ya kawaida na ya asili katika mfululizo huu wa masimulizi.
- source_word: δὲ καὶ
  choice: Kisha ... naye
  rationale: “Kisha” kinaendeleza mfululizo wa taarifa, na “naye” kinaonyesha kwamba huyu pia alifanya kama mtumishi aliyetangulia.
- source_word: ὁ τὰ δύο τάλαντα
  choice: yule aliyekuwa amepokea talanta mbili
  rationale: Kirai cha Kigiriki kinamtambulisha mtumishi kwa talanta mbili alizokuwa nazo; “aliyekuwa amepokea” linawekwa wazi kutokana na muktadha wa mfano.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya heshima ya κύριος na pia utata wake wa kumaanisha Bwana au bwana mwenye watumishi katika mfano huu.
- source_word: παρέδωκας
  choice: ulinikabidhi
  rationale: Hutoa maana ya kukabidhi kitu mikononi mwa mtu na, katika muktadha huu, kumwekea dhamana ya kukitunza na kukitumia.
- source_word: ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira kwenye matokeo; “Tazama” ni neno la sasa, lenye heshima na linalofaa katika simulizi.
- source_word: ἄλλα δύο τάλαντα
  choice: talanta nyingine mbili
  rationale: Huonyesha kiasi kingine cha talanta mbili, yaani nyongeza iliyo sawa na kiasi cha kwanza.
- source_word: ἐκέρδησα
  choice: nimepata
  rationale: Huwasilisha maana ya kupata au kuchuma faida bila kuongeza maelezo yasiyotajwa kuhusu njia iliyotumiwa.
- source_word: τάλαντα
  choice: talanta
  rationale: Neno la jadi “talanta” linahifadhi kipimo cha fedha cha ulimwengu wa kale; tanbihi inaondoa uwezekano wa kulielewa kama kipawa cha asili.
theological_decisions:
- issue: Tafsiri ya κύριος katika namna ya kumwita mhusika wa mfano
  choice: Bwana
  alternative: bwana mwenye watumishi
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na hapa pia linaweza kuwa neno la heshima kwa bwana mwenye watumishi. Uchaguzi huu unahifadhi uwezekano huo wa maana mbili bila kulazimisha dai la ziada la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Naye” hudumisha ulinganifu na mtumishi aliyetangulia, na “Tazama” hudumisha nguvu ya mwito wa Kigiriki bila kutumia lugha ngumu.
