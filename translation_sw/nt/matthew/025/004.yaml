  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: sw
  text: Lakini wale wenye busara walichukua mafuta katika vyombo, pamoja na taa zao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mienge” badala ya “taa” (Kigiriki λαμπάδας); neno hilo linaweza kumaanisha mwenge au taa kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: wenye busara
  rationale: Neno hili linaonyesha hekima ya vitendo au uangalifu. “Wenye busara” ni Kiswahili cha kawaida kinachohifadhi utofauti na wanawali wapumbavu bila kulifasiri kuwa “waliojiandaa” tu.
- source_word: ἔλαβον
  choice: walichukua
  rationale: Katika simulizi hili, kitenzi kina maana ya kuchukua au kwenda na kitu, si kupokea.
- source_word: ἔλαιον
  choice: mafuta
  rationale: Neno la Kigiriki humaanisha mafuta, mara nyingi mafuta ya zeituni, lakini kifungu hakihitaji aina hiyo itajwe wazi.
- source_word: ἀγγείοις
  choice: vyombo vyao
  rationale: ἀγγεῖον ni neno la jumla kwa chombo cha kubebea au kuhifadhia kitu; “vyombo” halibainishi umbo wala nyenzo ambazo hazikutajwa. Kiwakilishi “vyao” kinaeleza kwa kawaida kwamba vyombo vilikuwa vya wale wenye busara.
- source_word: λαμπάδων
  choice: taa
  rationale: λαμπάς linaweza kumaanisha taa au mwenge kutegemea muktadha. “Taa” ni neno la kawaida na linaendana vizuri na mafuta ya ziada; maana nyingine imehifadhiwa katika tanbihi.
- source_word: ἑαυτῶν
  choice: zao
  rationale: Kiwakilishi rejeshi kinaonyesha umiliki wa wahusika wenyewe. Katika Kiswahili, “zao” huwasilisha maana hiyo kwa kawaida bila kulazimisha msisitizo wa ziada.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: pamoja na taa zao
  rationale: μετά pamoja na hali ya genitive huonyesha uandamani; “pamoja na taa zao” huweka wazi kwamba mafuta yalichukuliwa sambamba na taa.
