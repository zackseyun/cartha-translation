base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: sw
  text: bwana wake akamwambia, “Umefanya vyema, mtumishi mwema na mwaminifu.[a] Ulikuwa mwaminifu katika mambo machache; nitakuweka usimamie mambo mengi. Ingia katika furaha ya bwana wako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumwa mwema na mwaminifu.” Neno la Kigiriki doulos linaweza kumaanisha “mtumishi” au “mtumwa,” kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki kyrios linaweza pia kutafsiriwa “Bwana.” Hapa “bwana” linaonyesha uhusiano wake na mtumishi katika mfano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ κύριος αὐτοῦ
  choice: Bwana wake akamwambia
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili, unamtaja msemaji na mpokeaji wa maneno waziwazi, na unadumisha uhusiano wa mamlaka unaoonyeshwa na κύριος.
- source_word: Εὖ
  choice: Umefanya vyema
  rationale: Ni pongezi ya kawaida na ya asili katika Kiswahili, inayowasilisha maana ya εὖ katika muktadha huu kuliko tafsiri ya neno moja kama ‘Vyema!’.
- source_word: δοῦλε
  choice: mtumishi
  rationale: Katika mfano huu ‘mtumishi’ ni Kiswahili cha kawaida na chenye heshima, huku uhusiano wa chini ya mamlaka ya bwana ukibaki wazi. Maana mbadala ya ‘mtumwa’ imehifadhiwa katika tanbihi.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: mwema na mwaminifu
  rationale: Tafsiri hii ya moja kwa moja inahifadhi sifa mbili tofauti na pia marudio ya mzizi wa πιστός baadaye katika mstari.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Ulikuwa mwaminifu katika mambo machache
  rationale: ‘Katika’ huonyesha eneo la wajibu kwa Kiswahili cha asili bila kudai wazi zaidi kuliko Kigiriki kwamba vitu hivyo vilikuwa chini ya usimamizi wake.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: nitakuweka usimamie mambo mengi
  rationale: καθίστημι hapa ina maana ya kumweka mtu katika nafasi ya wajibu; ‘nitakuweka usimamie’ ni wazi na ya kawaida, na inadumisha ulinganifu wa mambo machache na mambo mengi.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Ingia katika furaha
  rationale: Inahifadhi taswira ya kuingia iliyomo katika kitenzi na kihusishi, badala ya kuifasiri moja kwa moja kuwa kushiriki.
- source_word: τοῦ κυρίου σου
  choice: ya bwana wako
  rationale: ‘Bwana’ linafaa kwa mwenye mamlaka juu ya mtumishi katika mfano na pia linahifadhi uwezekano wa mwangwi wa kitheolojia bila kuufanya wazi kupita chanzo.
theological_decisions:
- issue: Maana ya κύριος ndani ya mfano ambao mhusika wake anaweza kumwakilisha Mungu au Kristo
  choice: bwana
  alternative: Bwana; mkuu
  rationale: ‘Bwana’ linaonyesha uhusiano wa mhusika mwenye mamlaka na mtumishi katika simulizi, huku herufi ndogo ikiepuka kulazimisha jina la kitheolojia katika kiwango cha moja kwa moja cha mfano. Hata hivyo, neno hilo halizuii msomaji kuona maana pana ya mfano.
- issue: Jinsi ya kutafsiri δοῦλος katika mazingira haya
  choice: mtumishi
  alternative: mtumwa
  rationale: ‘Mtumishi’ ni la kawaida katika Kiswahili cha kisasa na linafaa katika kauli ya pongezi, lakini δοῦλος linaweza pia kuonyesha hali ya utumwa. Uwezekano huo umeonyeshwa katika tanbihi badala ya kufichwa.
- issue: Maana ya χαρά ya bwana
  choice: furaha ya bwana wako
  alternative: shiriki furaha ya bwana wako
  rationale: 'Tafsiri hii inahifadhi utata wa kirai cha Kigiriki: inaweza kumaanisha kuingia katika sherehe au kushiriki furaha ya bwana. Haitambi tafsiri moja pekee kwa kuongeza kitenzi ‘shiriki’ katika maandishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Masimulizi yametumia ‘akamwambia,’ na maneno ya bwana yamewekwa kwa mtiririko rahisi. ‘Umefanya vyema’ ni pongezi ya asili; ‘nitakuweka usimamie’ linaeleza wajibu bila kuwa la kitaalamu. Alama zote za tanbihi zimewekwa katika maandishi.
