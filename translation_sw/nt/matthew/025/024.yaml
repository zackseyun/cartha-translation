source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: sw
  text: Kisha yule aliyepokea talanta moja naye akaja akasema, “Bwana, nilijua kwamba wewe ni mtu mgumu[a], unavuna mahali ambapo hukupanda na unakusanya kutoka mahali ambapo hukutawanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mkali.” Neno la Kigiriki σκληρός linaweza kumaanisha mgumu, mkali, au mkali sana.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kukusanya kutoka mahali ambapo hukutawanya.” Katika taswira hii ya kilimo, kitu kilichotawanywa, kama vile mbegu, hakitajwi wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akaja
  rationale: Kitenzi hiki kinaanzisha tendo la mtumishi kabla ya kusema. “Akaja” ni cha kawaida na cha asili katika usimulizi wa Kiswahili.
- source_word: δὲ καὶ
  choice: Kisha ... naye
  rationale: “Kisha” kinaendeleza mfululizo wa simulizi, na “naye” kinaonyesha kwamba mtumishi huyu pia alifika kama wale waliotangulia.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: yule aliyekuwa amepokea talanta moja
  rationale: Muundo huu unamtambulisha mtumishi kwa kile alichopokea. “Alikuwa amepokea” kinaonyesha tendo lililokamilika kabla ya wakati huu huku matokeo yake yakiendelea kuwa muhimu.
- source_word: τάλαντον
  choice: talanta
  rationale: “Talanta” huhifadhi jina la kipimo kikubwa cha fedha katika mfano bila kukisia aina fulani ya sarafu au mali.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni neno la heshima analotumia mtumishi kumwambia mwenye mamlaka juu yake; “Bwana” ni tafsiri ya kawaida na yenye hadhi ya κύριος.
- source_word: ἔγνων σε ὅτι
  choice: nilijua kwamba wewe ni
  rationale: Katika muktadha huu mtumishi anadai kuijua tabia ya bwana wake. Muundo huu ni wa asili katika Kiswahili na unaelekeza moja kwa moja kwenye maelezo yanayofuata.
- source_word: σκληρὸς ἄνθρωπος
  choice: mtu mgumu
  rationale: “Mgumu” huhifadhi wazo la ugumu au ukali bila kuamua kwa nguvu zaidi kama maana ni “mkali” au “mkatili.”
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: unavuna mahali ambapo hukupanda
  rationale: “Kuvuna” na “kupanda” vinahifadhi taswira na ulinganifu wa kilimo uliomo katika Kigiriki.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: kukusanya kutoka mahali ambapo hukutawanya
  rationale: Tafsiri hii inadumisha maana ya “kutoka mahali” ya ὅθεν na haiingizi kitu kisichotajwa wazi kuwa ndicho kilichotawanywa.
theological_decisions:
- issue: Tafsiri ya κύριος katika maneno ya mfano
  choice: Bwana
  alternative: Mkuu wangu
  rationale: “Bwana” inadumisha maana ya heshima na mamlaka bila kuondoa uwezekano wa mwangwi mpana wa neno κύριος.
- issue: Maelezo ya tabia ya bwana katika madai ya mtumishi
  choice: Madai yameripotiwa kama mtazamo wa mtumishi bila kupunguzwa wala kuthibitishwa
  alternative: Kutafsiri σκληρός kwa “mkali” au “mkatili” na hivyo kusisitiza hukumu ya kimaadili
  rationale: Aya inawasilisha madai ya mtumishi. “Mtu mgumu” huhifadhi mvutano kuhusu kama maelezo hayo ni ya kweli na kuhusu kiwango cha ukali kinachodaiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi ni wa asili katika usimulizi, huku taswira ya kilimo na utata wa madai ya mtumishi vikihifadhiwa.
