review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the master-servant relation, moral rebuke, agricultural imagery, and the disputed/question-like force of the final words. However, the coordinated predicate should explicitly preserve the second finite Greek verb: ‘ninavuna ... na ninakusanya ...,’ rather than mixing ‘ninavuna’ with the infinitive ‘kukusanya.’'
  naturalness: ‘Bwana wake akamjibu’ is natural Standard East African Swahili. Removing the unnecessary emphatic vocative pronoun ‘Wewe’ makes the rebuke more idiomatic while retaining its direct force. Repeating ‘nina-’ in the two coordinated verbs is both grammatical and natural.
  terminology: ‘Bwana,’ ‘mtumishi,’ ‘mwovu,’ and ‘mvivu’ are suitable in this parabolic register. The footnote appropriately retains ‘mtumwa’ as a lexical alternative for δοῦλος. ‘Kutawanya’ retains the source’s unexpressed object and does not improperly add ‘mbegu.’
  issues:
  - severity: medium
    issue: The verb coordination reads ‘ninavuna ... na kukusanya.’
    rationale: 'The Greek has two parallel first-person present indicative verbs, θερίζω and συνάγω. In this context Swahili should likewise use two finite verbs: ‘ninavuna ... na ninakusanya ...’.'
  - severity: low
    issue: The vocative begins ‘Wewe mtumishi ...’.
    rationale: Greek uses vocatives without an explicit pronoun. ‘Mtumishi mwovu na mvivu’ is a more idiomatic direct rebuke in Standard East African Swahili and does not reduce the force.
