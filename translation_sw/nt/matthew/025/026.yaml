  rationale: The revision corrects the parallel verbal construction to reflect the two finite Greek predicates and improves the natural Swahili vocative. It otherwise preserves the source wording, the agricultural ambiguity of the unstated object of ‘scatter,’ and the footnoted alternative of reading the final clause as a statement.
