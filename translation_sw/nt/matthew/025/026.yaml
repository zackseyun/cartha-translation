  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: sw
  text: Lakini bwana wake akamjibu, ‘Mtumishi mwovu na mvivu,[a] ulijua kwamba ninavuna mahali ambapo sikupanda, na ninakusanya mahali ambapo sikutawanya?’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtumwa mwovu na mvivu.” Neno la Kigiriki doulos linaweza kumaanisha “mtumishi” au “mtumwa,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Maneno haya yanaweza pia kusomwa kama kauli badala ya swali la balagha: “Ulijua kwamba ninavuna mahali ambapo sikupanda, na ninakusanya mahali ambapo sikutawanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Lakini ... akamjibu
  rationale: Muundo huu wa kawaida wa simulizi unaonyesha jibu pamoja na mpito wenye utofautishaji mdogo; Kiswahili cha ‘Lakini ... akamjibu’ ni cha asili.
- source_word: ὁ κύριος αὐτοῦ
  choice: bwana wake
  rationale: Katika mfano huu κύριος ni bwana wa mtumishi, si lazima iwe jina la cheo la moja kwa moja la Kristo.
- source_word: Πονηρὲ
  choice: mwovu
  rationale: Neno hili lina hukumu ya kimaadili, si maelezo ya ubora duni tu.
- source_word: δοῦλε
  choice: mtumishi
  rationale: ‘Mtumishi’ ni ya kawaida na yenye heshima katika simulizi la Kiswahili, huku ‘mtumwa’ ikibaki tafsiri halali ya hadhi ya kijamii na kutajwa katika tanbihi.
- source_word: ὀκνηρέ
  choice: mvivu
  rationale: Huwasilisha wazi hali ya kutotaka kuchukua hatua au uvivu kwa Kiswahili cha sasa.
- source_word: ᾔδεις ὅτι
  choice: ulijua kwamba
  rationale: Huwasilisha maarifa ambayo bwana anamwekea mtumishi kama msingi wa hoja yake.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: ninavuna mahali ambapo sikupanda
  rationale: Hudumisha taswira ya kilimo na tofauti kati ya kuvuna na kupanda.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: kukusanya mahali ambapo sikutawanya
  rationale: Tafsiri hii inahifadhi kitenzi ‘kutawanya’ bila kuongeza ‘mbegu,’ ambayo haikutajwa wazi katika Kigiriki; muktadha wa kilimo unaacha kitu kilichotawanywa kikiwa kimedokezwa.
theological_decisions:
- issue: Nguvu ya maneno ya mwisho na alama ya uakifishaji
  choice: 'Swali la balagha: ‘ulijua kwamba ...?’'
  alternative: 'Kauli: ‘Ulijua kwamba ninavuna ... na kukusanya ... .’'
  rationale: Kigiriki kinaweza kueleweka kama kauli au swali la balagha. Swali linafaa mtiririko wa hoja, ambapo bwana anageuza madai ya mtumishi dhidi yake; tanbihi inalinda uwezekano wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo ‘bwana wake akamjibu’ ni wa asili; msamiati wa kilimo umehifadhiwa bila kuongeza kitu kisichotajwa wazi katika chanzo.
