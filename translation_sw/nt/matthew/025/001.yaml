  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: sw
  text: Ndipo ufalme wa mbinguni utakapofanana[a] na mabikira kumi, waliotwaa taa[b] zao wakatoka kumlaki bwana harusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakapolinganishwa na” au “utakapofananishwa na.” Kitenzi cha Kigiriki kiko katika kauli ya kutendwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mienge.” Neno la Kigiriki linaweza kumaanisha taa au mwenge unaobebwa mkononi katika msafara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachounganisha mfano huu na muktadha uliotangulia; “ndipo” ni cha asili na chenye uzito unaofaa katika Kiswahili.
- source_word: ὁμοιωθήσεται
  choice: utakapofanana na
  rationale: Muundo huu wa Kiswahili unatoa kwa ufasaha maana ya kulinganishwa iliyo katika kitenzi cha Kigiriki cha wakati ujao na kauli ya kutendwa; kauli ya kutendwa imeelezwa katika tanbihi.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida wa Mathayo, na “mbinguni” ni tafsiri ya asili ya Kiswahili inayohifadhi maana ya usemi wa Kigiriki.
- source_word: δέκα παρθένοις
  choice: mabikira kumi
  rationale: παρθένος hapa humaanisha wanawake vijana ambao hawajaolewa, huku ubikira ukidokezwa wazi na neno lenyewe na mazingira ya harusi; “mabikira” huhifadhi umahususi huo.
- source_word: αἵτινες
  choice: walio
  rationale: Kiwakilishi hiki cha uhusiano kinaanzisha maelezo kuhusu wale mabikira; “walio” ni muundo mfupi na wa kawaida wa Kiswahili.
- source_word: λαβοῦσαι
  choice: waliochukua
  rationale: Kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kwenda kwao; kishazi cha uhusiano ni cha asili katika Kiswahili na huhifadhi mtiririko huo.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: taa zao
  rationale: λαμπάς linaweza kumaanisha taa au mwenge. “Taa” ni neno linaloeleweka kwa urahisi na linalofaa katika simulizi hili, huku “mienge” ikiwekwa katika tanbihi kama uwezekano halisi.
- source_word: ἐξῆλθον
  choice: kwenda
  rationale: Katika muundo “kwenda kumlaki,” kusudi la kutoka linaelezwa kwa Kiswahili cha kawaida bila kuongeza mahali pasipotajwa katika chanzo.
- source_word: εἰς ὑπάντησιν
  choice: kumlaki
  rationale: Usemi huu humaanisha kwenda ili kumpokea au kukutana na mtu anayekuja; “kumlaki” huhifadhi wazo la kutoka kwenda kumpokea.
- source_word: τοῦ νυμφίου
  choice: bwana harusi
  rationale: νυμφίος humtaja mwanamume anayefunga ndoa katika mazingira ya harusi; “bwana harusi” ni istilahi sanifu na wazi ya Kiswahili.
theological_decisions:
- issue: Muundo wa ulinganisho katika mfano
  choice: utakapofanana na
  alternative: utakapolinganishwa na / utakafananishwa na
  rationale: Kigiriki kina kitenzi cha wakati ujao katika kauli ya kutendwa. Matini kuu imetumia usemi wa asili wa Kiswahili bila kuondoa maana ya ulinganisho, na tanbihi imehifadhi wazi uwezekano wa kutafsiri kauli ya kutendwa.
- issue: Tafsiri ya παρθένοις
  choice: mabikira
  alternative: wanawali / wanawake vijana ambao hawajaolewa
  rationale: “Mabikira” huhifadhi maana mahsusi ya neno la chanzo katika mazingira ya harusi, badala ya kuipanua kimya kimya kuwa maelezo ya jumla kuhusu umri au hali ya ndoa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo … utakapofanana” ni muundo wa asili wa simulizi; “mabikira” huhifadhi umahususi wa chanzo, na “kumlaki bwana harusi” huwasilisha kwa ufupi mazingira ya msafara wa harusi.
