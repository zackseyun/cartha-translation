  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: sw
  text: Yule aliyepokea talanta tano[a] akaenda akazifanyisha kazi, akapata talanta nyingine tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo kikubwa cha fedha, si kipawa au uwezo wa asili.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: akaenda
  rationale: 'Kitenzi hiki katika umbo la participio kinaendeleza mfuatano wa simulizi: baada ya kupokea fedha, akaenda akazitumia. Hakuna neno la Kigiriki linalomaanisha wazi ‘mara moja,’ kwa hiyo halikuongezwa.'
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Yule aliyekuwa amepokea talanta tano
  rationale: Muundo wenye participio na kibainishi humtambulisha mhusika kwa kile alichopokea. ‘Aliyekuwa amepokea’ ni Kiswahili cha kawaida kinachoonyesha tendo lililotangulia.
- source_word: τάλαντα
  choice: talanta
  rationale: Talanta hapa ni kipimo kikubwa cha fedha, si kipawa cha asili. Neno la jadi limehifadhiwa na maana yake kufafanuliwa katika tanbihi.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: kuzitumia kufanya kazi
  rationale: Kirai hiki kinaonyesha matumizi hai ya fedha hizo ili kuleta faida, bila kuibana maana kuwa biashara ya aina fulani pekee.
- source_word: ἐκέρδησεν
  choice: akapata
  rationale: Katika muktadha huu kitenzi kina maana ya kupata faida au ongezeko. ‘Akapata’ ni cha kawaida na kinaunganika vizuri na matokeo yaliyotajwa.
- source_word: ἄλλα πέντε
  choice: talanta nyingine tano
  rationale: 'Huwasilisha wazi maana ya nyongeza: talanta tano zaidi ya zile za kwanza.'
