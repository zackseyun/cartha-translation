translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘akaenda ... akapata’ huhifadhi mwendo wa simulizi. Tanbihi imewekwa mara tu baada ya kutajwa kwa talanta kwa mara ya kwanza.
