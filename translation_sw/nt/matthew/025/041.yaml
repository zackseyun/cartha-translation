  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: sw
  text: Kisha atawaambia pia wale walio upande wake wa kushoto, ‘Nendeni mbali na mimi[a], ninyi mliolaaniwa, mkaingie katika moto wa milele uliotayarishwa kwa ajili ya Ibilisi na malaika zake.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ondokeni kwangu.”
    reason: Njia nyingine ya kutafsiri Πορεύεσθε ἀπ’ ἐμοῦ kwa ufupi, ikihifadhi amri ya kuondoka mbele ya msemaji.
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Inaonyesha hatua inayofuata katika tukio la hukumu kwa Kiswahili cha kawaida na cha heshima.
- source_word: ἐρεῖ
  choice: atawaambia
  rationale: Wakati ujao wa λέγω pamoja na walengwa wake huwasilishwa kwa kawaida kwa ‘atawaambia’ bila kuongeza uzito usiokuwapo katika Kigiriki.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: wale walio upande wake wa kushoto
  rationale: Ni usemi wa kimuktadha unaotaja kundi lililowekwa upande wa kushoto wa Mfalme; kiwakilishi ‘wake’ kinaweka wazi uhusiano huo kutokana na muktadha.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Nendeni mbali nami
  rationale: Huonyesha amri ya kuondoka na kutengwa na msemaji kwa Kiswahili cha sasa; ‘nami’ hapa humaanisha ‘na mimi,’ si ‘kwangu.’
- source_word: οἱ κατηραμένοι
  choice: ninyi mliolaaniwa
  rationale: Huhifadhi hali ya kutendwa iliyo katika participio timilifu ya Kigiriki na pia nguvu ya mwito wa moja kwa moja.
- source_word: εἰς τὸ πῦρ
  choice: katika moto
  rationale: Katika mfuatano wa amri ‘Nendeni ... katika,’ neno ‘katika’ linaonyesha mahali wanapoelekezwa bila kulainisha moto kuwa tamathali isiyotajwa na matini.
- source_word: τὸ αἰώνιον
  choice: wa milele
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya αἰώνιος katika muktadha huu wa hukumu ya mwisho, bila kuingiza ufafanuzi wa ziada.
- source_word: τὸ ἡτοιμασμένον
  choice: uliotayarishwa
  rationale: Huhifadhi kauli ya kutendwa na hali inayotokana na matayarisho yaliyofanywa tayari.
- source_word: τῷ διαβόλῳ
  choice: kwa ajili ya Ibilisi
  rationale: διάβολος hapa ni jina maalumu linalotumiwa kumtaja adui huyo wa kiroho, si maelezo ya mchongezi wa kawaida.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: malaika zake
  rationale: Katika muktadha wa hukumu ya mwisho, ἄγγελοι ni viumbe wa kiroho walio upande wa Ibilisi, si wajumbe wa kibinadamu.
theological_decisions:
- issue: Maana ya αἰώνιον katika muktadha wa hukumu
  choice: wa milele
  alternative: wa kudumu daima; wa enzi
  rationale: ‘Wa milele’ huwakilisha matumizi ya kawaida ya neno hili katika muktadha huu na kuhifadhi uzito wa hukumu bila kuamua kwa maelezo ya ziada maswali ya kiteolojia ambayo mstari wenyewe hayafafanui.
- issue: Warejelewa wa διάβολος na ἄγγελοι
  choice: Ibilisi na malaika zake
  alternative: mchongezi na wajumbe wake
  rationale: Muktadha wa hukumu ya mwisho na matumizi yaliyozoeleka ya maneno haya yanaonyesha Ibilisi na viumbe wa kiroho walio upande wake; kuyafanya majina ya jumla kungepunguza maana ya matini.
- issue: Walengwa wa moto uliotayarishwa
  choice: uliotayarishwa kwa ajili ya Ibilisi na malaika zake
  alternative: uliotayarishwa kwa Ibilisi na malaika zake
  rationale: Muundo huu huhifadhi wazi kwamba matini inasema moto huo umetayarishwa kwa ajili yao, bila kuongeza madai kuhusu kusudi la awali kwa wanadamu au mfumo mpana wa hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Nendeni mbali nami’ ni cha kawaida zaidi katika usemi wa moja kwa moja, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya kimapokeo. Herufi kubwa katika ‘Ibilisi’ inaonyesha matumizi yake kama jina maalumu katika muktadha huu.
