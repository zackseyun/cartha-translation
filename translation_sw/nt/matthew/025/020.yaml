  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: sw
  text: Yule aliyekuwa amepokea talanta tano[b] akaja mbele, akaleta talanta nyingine tano, akisema, “Bwana,[a] ulinikabidhi talanta tano. Tazama, nimepata talanta nyingine tano.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Mkuu.” Kigiriki: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: Talanta ilikuwa kipimo kikubwa cha fedha.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: akaja mbele
  rationale: Kitenzi hiki kinaonyesha kuwa mtumishi alimkaribia bwana wake ili kutoa hesabu; “akaja mbele” ni Kiswahili cha kawaida kinachohifadhi mazingira hayo.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Yule aliyekuwa amepokea talanta tano
  rationale: Muundo huu unamtambulisha mtumishi kwa kile alichokuwa amepokea hapo awali. “Aliyekuwa amepokea” huonyesha kwamba kupokea kulitangulia kuja kwake mbele bila kuongeza neno lisilokuwapo kama “mwanamume.”
- source_word: τάλαντα
  choice: talanta
  rationale: Talanta ilikuwa kipimo kikubwa cha uzito na, katika muktadha huu, kiasi kikubwa cha fedha. Kuhifadhi istilahi ya chanzo huepuka kuibana kuwa aina fulani ya sarafu au metali; tanbihi inaeleza maana yake ya kitamaduni.
- source_word: προσήνεγκεν
  choice: akaleta
  rationale: Katika muktadha huu προσφέρω humaanisha kuleta kiasi cha ziada mbele ya bwana; “akaleta” ni wazi na ya kawaida kuliko tafsiri inayoweza kudokeza sadaka ya kidini.
- source_word: ἄλλα πέντε τάλαντα
  choice: talanta nyingine tano
  rationale: ἄλλα pamoja na namba huonyesha kiasi kingine sawa na cha kwanza; “nyingine tano” huhifadhi urudiaji na maana hiyo.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na hapa ni namna ya mtumishi kumwita mwenye mamlaka juu yake, huku ikihifadhi mwangwi mpana wa neno hilo katika Mathayo.
- source_word: παρέδωκας
  choice: ulinikabidhi
  rationale: παραδίδωμι ni kukabidhi au kuweka kitu mikononi mwa mwingine. “Ulinikabidhi” ni ya asili katika Kiswahili na huwasilisha tendo lenyewe bila kulifanya wazi kupita chanzo kuwa amana ya kisheria.
- source_word: ἴδε
  choice: Tazama
  rationale: ἴδε ni neno la kuvuta fikira kwa jambo linaloonyeshwa. “Tazama” ni fupi, lenye hadhi, na linalofaa katika usemi wa moja kwa moja.
- source_word: ἐκέρδησα
  choice: nimepata
  rationale: κερδαίνω humaanisha kupata au kujipatia faida. “Nimepata” huhifadhi maana ya ongezeko lililopatikana na matokeo yake ya sasa bila kuingiza dhana ya mshahara.
theological_decisions:
- issue: Tafsiri ya κύριος katika mazungumzo ya mfano
  choice: Bwana
  alternative: Mkuu
  rationale: Katika simulizi neno hilo humaanisha mwenye mamlaka juu ya mtumishi, lakini “Bwana” hudumisha ulinganifu wa kileksia na uwezekano wa mwangwi wa kiteolojia katika Injili bila kudai kwamba mstari huu peke yake unamtambulisha mhusika moja kwa moja na Kristo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “akaja mbele, akaleta ... na kusema” unasomeka kwa urahisi katika simulizi. Istilahi “talanta” imehifadhiwa kwa sababu ni kipimo cha kale kisicho na thamani moja ya kisasa; tanbihi huzuia msomaji asidhani hapa inamaanisha kipawa au uwezo.
