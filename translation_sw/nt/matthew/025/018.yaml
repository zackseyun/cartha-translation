base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: sw
  text: Lakini yule aliyepokea talanta moja akaenda, akachimba ardhini, akaificha fedha ya bwana wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa maana ya metali: “akaificha fedha ya bwana wake”; neno la Kigiriki linaweza kumaanisha pesa au metali ya fedha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini yule
  rationale: δέ inaonyesha tofauti kati ya mtumishi huyu na wale waliotangulia; “Lakini” huhifadhi utofauti huo, na “yule” huwakilisha kibainishi cha Kigiriki kilichotumiwa kama nomino.
- source_word: τὸ ἓν
  choice: talanta moja
  rationale: Neno linalohesabiwa limeachwa katika Kigiriki lakini linaeleweka kutokana na muktadha wa 25:15 kuwa ni talanta; kulitaja huleta uwazi wa kawaida katika Kiswahili.
- source_word: λαβὼν
  choice: aliyepokea
  rationale: Kitenzi hiki hapa humweleza mtumishi kama mpokeaji wa mali aliyokabidhiwa; umbo la “aliye-” linaunganisha kitendo hicho kwa kawaida na mhusika.
- source_word: ἀπελθὼν
  choice: akaenda
  rationale: Huwasilisha mwendo wa kuondoka na mfuatano wa matendo kwa Kiswahili cha masimulizi bila kuongeza mahali pasipotajwa.
- source_word: ὤρυξεν γῆν
  choice: akachimba ardhini
  rationale: Hii ni tafsiri ya kawaida na ya karibu ya kuchimba katika ardhi, bila kuongeza waziwazi “shimo,” ingawa shimo linaele implied na tendo.
- source_word: ἔκρυψεν
  choice: kuificha
  rationale: “Kuficha” ni kisawe cha kawaida na cha moja kwa moja katika muktadha huu.
- source_word: τὸ ἀργύριον
  choice: fedha
  rationale: “Fedha” kwa Kiswahili inaweza kumaanisha mali ya malipo au metali ya fedha, hivyo huhifadhi vyema upana wa maana wa ἀργύριον katika muktadha huu.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: ya bwana wake
  rationale: Katika ulimwengu wa mfano, κύριος humaanisha mwenye mamlaka juu ya mtumishi; “bwana wake” ni usemi wa kawaida unaohifadhi uhusiano huo bila kuifanya moja kwa moja kuwa cheo cha kimungu.
theological_decisions:
- issue: Tafsiri ya κύριος katika rejeo la kibinadamu ndani ya mfano
  choice: bwana
  alternative: Bwana; mwenyewe
  rationale: Mrejelewa wa moja kwa moja ni mkuu wa mtumishi katika simulizi. Herufi ndogo katika “bwana” huonyesha maana hiyo ya kibinadamu huku ikihifadhi uhusiano wa mamlaka na mwangwi wa neno lilelile la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “aka-” unafaa kwa masimulizi. Alama [a] imewekwa baada ya kirai kinachohusika, na tanbihi huhifadhi maana halisi ya ἀργύριον bila kulazimisha uamuzi kati ya ‘pesa’ na ‘madini ya fedha’ katika mstari mkuu.
