  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: sw
  text: Na mataifa yote yatakusanywa mbele yake[a], naye atawatenganisha mmoja na mwingine, kama vile mchungaji anavyotenganisha kondoo na mbuzi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “watu wa mataifa yote”; Kigiriki: “mataifa yote” (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ἐρίφων linaweza kumaanisha hasa “wana-mbuzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: yatakusanywa
  rationale: Wakati ujao wa kutendwa umehifadhiwa bila kumtaja wazi mtendaji, kama ilivyo katika Kigiriki.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: mbele yake
  rationale: Ni usemi wa kawaida na wenye heshima unaofaa mazingira ya hukumu na unaakisi maana ya kuwa mbele au katika uwepo wake.
- source_word: πάντα τὰ ἔθνη
  choice: mataifa yote
  rationale: Huhifadhi upana wa maana ya ἔθνη bila kuibana kuwa watu wasio Wayahudi wala kuifafanua moja kwa moja kuwa watu wote.
- source_word: ἀφορίσει
  choice: atawatenganisha
  rationale: Kitenzi hiki kinaeleza kugawa kundi moja na jingine; 'kutenganisha' ni wazi na cha moja kwa moja.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: wao kwa wao
  rationale: Usemi huu wa asili katika Kiswahili unaonyesha kuwa waliokusanywa watatenganishwa katika makundi tofauti.
- source_word: ὥσπερ
  choice: kama vile
  rationale: Huanzisha mlinganisho kwa uwazi na kwa mtindo wa kawaida wa Kiswahili.
- source_word: ὁ ποιμὴν
  choice: mchungaji
  rationale: Kiswahili hakihitaji kibainishi kinacholingana na makala ya Kigiriki; nomino hii inatumika kwa maana ya jumla katika mfano.
- source_word: τὰ πρόβατα
  choice: kondoo
  rationale: Huhifadhi taswira halisi ya wanyama badala ya kutumia neno la kijumla kama 'kundi'.
- source_word: τῶν ἐρίφων
  choice: mbuzi
  rationale: Ni neno la kawaida na linaloeleweka katika jozi ya kondoo na mbuzi; maana mahususi zaidi ya wana-mbuzi imebainishwa katika tanbihi.
theological_decisions:
- issue: Upeo wa πάντα τὰ ἔθνη
  choice: mataifa yote
  alternative: watu wote; watu wote wasio Wayahudi
  rationale: Tafsiri inadumisha upana na utata wa kileksia wa kifungu bila kuamua mapema kama kinamaanisha wanadamu wote kwa ujumla au hasa mataifa yasiyo ya Kiyahudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kutendwa na taswira ya kichungaji zimehifadhiwa; koma ya mwisho inadumisha mwendelezo wa sentensi kwenda mstari unaofuata.
