  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: sw
  text: Na ni lini tulipokuona ukiwa mgeni[a] tukakukaribisha[b], au ukiwa uchi[c] tukakuvika?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa nje.” Neno la Kigiriki linaweza kumaanisha mtu asiyejulikana au aliye nje ya kundi fulani; hapa ni mtu anayehitaji kupokewa kwa ukarimu.
    reason: lexical_alternative
  - marker: b
    text: Au “tukakupokea.” Kitenzi cha Kigiriki kwa maana yake ya msingi ni “kukusanya pamoja”; hapa kinamaanisha kumpokea mtu kwa ukarimu.
    reason: lexical_alternative
  - marker: c
    text: Au “mwenye mavazi yasiyotosha.” Neno la Kigiriki linaweza kumaanisha kuwa uchi kabisa au kutokuwa na mavazi ya kutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: ni lini
  rationale: Ni namna ya kawaida ya Kiswahili kuuliza wakati ambapo jambo lilitendeka.
- source_word: δέ
  choice: Na
  rationale: Hapa δέ inaunganisha swali hili kwa upole na swali lililotangulia, bila kuonyesha upinzani mkali.
- source_word: σε
  choice: -ku-
  rationale: Kiambishi cha yambwa cha nafsi ya pili umoja katika “tulipokuona,” “tukakukaribisha,” na “tukakuvika” kinamrejelea mfalme/Mwana wa Adamu.
- source_word: εἴδομεν
  choice: tulipokuona
  rationale: Muundo huu unaonyesha tendo la kuona lililopita na unasikika kwa kawaida ndani ya swali la Kiswahili.
- source_word: ξένον
  choice: ukiwa mgeni
  rationale: “Mgeni” humaanisha mtu asiyejulikana au aliye nje ya kundi na pia huafikiana na muktadha wa kumpa mtu mahali na ukarimu; haifungi maana kwa utaifa pekee.
- source_word: συνηγάγομεν
  choice: tukakukaribisha
  rationale: Ingawa kitenzi kina maana ya msingi ya kukusanya au kupokea ndani, katika muktadha huu kinaeleza kumpokea mtu kwa ukarimu. “Kukukaribisha” ni Kiswahili cha kawaida na wazi.
- source_word: ἢ
  choice: au
  rationale: Huunganisha sehemu ya pili ya swali kama chaguo jingine.
- source_word: γυμνὸν
  choice: ukiwa uchi
  rationale: Huhifadhi maana ya moja kwa moja ya kutokuwa na nguo, huku tanbihi ikitaja uwezekano wa kutokuwa na mavazi ya kutosha.
- source_word: περιεβάλομεν
  choice: tukakuvika
  rationale: Kitenzi hiki hapa humaanisha kumwekea mtu nguo; “kukuvika” ni kifupi, cha kawaida, na sahihi.
theological_decisions:
- issue: Maana ya ξένος katika mfano wa hukumu na matendo ya rehema
  choice: mgeni
  alternative: mtu wa nje
  rationale: “Mgeni” huhifadhi wazo la mtu asiyejulikana au asiye na mwenyeji anayehitaji kupokewa, bila kuingiza lazima tofauti ya taifa au kabila.
- issue: Kiwango cha ukosefu wa mavazi kinachoelezwa na γυμνός
  choice: uchi
  alternative: mwenye mavazi yasiyotosha
  rationale: Maana ya moja kwa moja imehifadhiwa katika maandiko, lakini uwezekano mpana wa kuwa na mavazi yasiyotosha umeelezwa katika tanbihi ili kutatua kimyakimya utata wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “tulipokuona… tukakukaribisha… tukakuvika” ni wa kawaida na unaendeleza mshangao wa swali bila kuwa mgumu au wa kale.
