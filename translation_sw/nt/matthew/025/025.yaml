base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: sw
  text: Niliogopa, nikaenda nikaficha talanta yako[a] ardhini. Tazama, kilicho chako hiki hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kiasi kikubwa cha fedha; talanta ilikuwa kipimo cha fedha chenye thamani kubwa, si kipawa cha asili.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Niliogopa
  rationale: Kitenzi hiki katika umbo la kishiriki kinaeleza hofu kuwa hali au sababu iliyotangulia tendo. Muundo wa Kiswahili wa vitenzi vinavyofuatana unawasilisha maana hiyo kwa kawaida bila kuifanya hofu kuwa kicho cha kidini.
- source_word: ἀπελθὼν
  choice: nikaenda
  rationale: Kishiriki cha wakati uliopita kinaonyesha tendo lililotangulia kuficha. Mfululizo “nikaenda nikaficha” ni wa kawaida katika Kiswahili na huhifadhi mpangilio wa matendo.
- source_word: ἔκρυψα
  choice: nikaficha
  rationale: κρύπτω humaanisha kuficha au kusitiri. “Nikaficha” ni kisawe cha moja kwa moja; wazo la kuzika linaelezwa tayari na “ardhini.”
- source_word: τὸ τάλαντόν σου
  choice: talanta yako
  rationale: τάλαντον ni kipimo kikubwa cha uzito na thamani ya fedha katika ulimwengu wa kale. “Talanta” huhifadhi istilahi ya kihistoria, huku tanbihi ikizuia kueleweka kama kipawa cha asili.
- source_word: ἐν τῇ γῇ
  choice: ardhini
  rationale: γῆ hapa ni ardhi ambamo fedha ilifichwa. “Ardhini” ni fupi, ya kawaida, na inafaa muktadha.
- source_word: ἴδε
  choice: Tazama
  rationale: ἴδε ni neno la kuvuta uangalifu. “Tazama” ni la sasa, lenye hadhi, na linalofaa kauli ya mhusika.
- source_word: ἔχεις τὸ σόν
  choice: kilicho chako hiki hapa
  rationale: Usemi wa Kigiriki ni wa mkato, kihalisi ukiwa na wazo la “una kilicho chako.” Kiswahili hiki cha kawaida huhifadhi msisitizo kwamba mali hiyo ni ya bwana na sasa imewekwa mbele yake.
theological_decisions:
- issue: Maana ya τάλαντον katika mfano ambao mara nyingi huhusishwa na vipawa vya asili
  choice: Kutumia “talanta” kama istilahi ya kihistoria ya fedha na kufafanua maana yake katika tanbihi.
  alternative: Kutafsiri moja kwa moja “kiasi kikubwa cha fedha.”
  rationale: Katika mstari huu neno la Kigiriki linamaanisha mali yenye thamani kubwa, si uwezo au kipawa cha asili. Kuhifadhi “talanta” kunatunza sura ya kihistoria ya mfano, na tanbihi inaondoa utata wa maana yake ya kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa “nika-” umetumiwa kuonyesha matendo yaliyofuatana kwa kawaida. Alama ya tanbihi imewekwa baada ya “talanta yako,” neno linalohitaji ufafanuzi.
