id: MAT.25.11
reference: Matthew 25:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: sw
  text: Baadaye, wale wanawali wengine pia wakaja, wakisema, “Bwana, Bwana, tufungulie!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema tu “tufungulie”; kitu kinachotakiwa kufunguliwa, yaani mlango, kinaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Baadaye
  rationale: Kielezi hiki kinaonyesha tendo linalofuata katika simulizi; “Baadaye” ni Kiswahili cha kawaida na cha asili.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki ni cha mpito usio mkali; mpito wake unaeleweka kwa “Baadaye,” hivyo hakihitaji kutafsiriwa kwa neno tofauti.
- source_word: ἔρχονται
  choice: wakaja
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, wakati uliopita wa kisimulizi unasikika kwa asili zaidi katika Kiswahili bila kubadili mfuatano wa matukio.
- source_word: καὶ
  choice: pia
  rationale: “Pia” inadumisha maana ya kuongeza wanawali waliobaki katika tukio.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: wale wanawali wengine
  rationale: “Wanawali wengine” ni ya asili na inadumisha maana ya wale wengine/waliobaki; “wale” huwarejelea wazi wahusika waliotangulia katika mfano.
- source_word: λέγουσαι
  choice: wakisema
  rationale: Umbo hili la kitenzi linaanzisha maneno ya moja kwa moja; “wakisema” linaunganisha tendo hilo kwa kawaida katika Kiswahili.
- source_word: Κύριε κύριε
  choice: Bwana, Bwana
  rationale: “Bwana” huhifadhi uwezekano wa kuwa heshima ya mazungumzo na pia uzito wa kiteolojia wa κύριος katika Mathayo; urudiaji umehifadhiwa kuonyesha msisitizo na haraka.
- source_word: ἄνοιξον ἡμῖν
  choice: tufungulie
  rationale: Kitenzi hiki cha kuamuru pamoja na kiwakilishi cha walengwa kinaelezwa kwa asili kwa “tufungulie.” Mlango unaeleweka kutokana na muktadha lakini hautajwi wazi katika Kigiriki.
theological_decisions:
- issue: Tafsiri ya κύριος katika mwito wa moja kwa moja
  choice: Bwana
  alternative: Mheshimiwa / Bwana mkubwa
  rationale: “Bwana” huhifadhi mvutano kati ya mwito wa heshima ndani ya mfano na mwangwi wake wa kiteolojia katika Injili ya Mathayo, bila kuufanya uwe wa kijamii tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wanawali” limetumiwa kwa παρθένοι kwa kuwa linafaa katika muktadha wa mfano wa harusi; mpangilio wa sentensi umewekwa wa asili katika simulizi la Kiswahili.
