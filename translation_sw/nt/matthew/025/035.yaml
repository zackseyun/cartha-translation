id: MAT.25.35
reference: Matthew 25:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: sw
  text: Kwa maana nilikuwa na njaa, nanyi mkanipa chakula; nilikuwa na kiu, nanyi mkanipa kinywaji; nilikuwa mgeni, nanyi mkanikaribisha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: nilikuwa na njaa
  rationale: Hueleza hali ya kuwa na njaa katika wakati uliopita kwa Kiswahili cha kawaida na cha wazi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: nanyi mkanipa chakula
  rationale: Muundo wa Kigiriki una maana ya kumpa mtu kitu cha kula; “mkanipa chakula” ni wa asili na unabaki mwaminifu kwa maana hiyo.
- source_word: ἐδίψησα
  choice: nilikuwa na kiu
  rationale: Huwasilisha kwa kawaida hali ya kuona kiu katika wakati uliopita.
- source_word: ἐποτίσατέ με
  choice: nanyi mkanipa kinywaji
  rationale: Kitenzi kina maana ya kumpa mtu anywe; “kinywaji” hakiongezi wazo la maji pekee na kinadumisha usambamba wa sentensi.
- source_word: ξένος
  choice: mgeni
  rationale: Katika muktadha huu humaanisha mtu asiye wa nyumbani au asiyejulikana anayehitaji kupokelewa, bila kuingiza hadhi maalumu ya kisiasa au kisheria.
- source_word: συνηγάγετέ με
  choice: nanyi mkanikaribisha
  rationale: Ingawa maana ya msingi ni kukusanya au kuleta pamoja, hapa pamoja na ξένος kitenzi hueleza kumpokea mgeni kwa ukarimu.
theological_decisions:
- issue: Lugha ya ukarimu katika ξένος ... συνηγάγετέ με
  choice: nilikuwa mgeni, nanyi mkanikaribisha
  alternative: nilikuwa mgeni, nanyi mkanipokea nyumbani
  rationale: “Mkanikaribisha” huhifadhi tendo la kibinafsi la ukarimu bila kuongeza wazi wazo la nyumba ambalo halikutajwa moja kwa moja katika Kigiriki, wala kuingiza makundi ya kisasa ya kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa vifungu sambamba umehifadhiwa; “nanyi” huonyesha kwa uwazi mhusika wa wingi na mwendelezo wa matendo.
source_grounding:
  english_pob_role: consult_only
