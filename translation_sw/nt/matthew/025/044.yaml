  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: sw
  text: Ndipo wao pia watajibu wakisema, “Bwana, ni lini tulikuona ukiwa na njaa au kiu, ukiwa mgeni au uchi, ukiwa mgonjwa au gerezani, na hatukukuhudumia[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatukukutumikia” au “hatukukutunza” (Kigiriki διακονέω).
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano wa matukio katika tukio la hukumu kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: wao pia watajibu wakisema
  rationale: Huhifadhi wakati ujao, msisitizo wa καὶ αὐτοὶ kwamba kundi hili nalo linajibu, na participio inayoanzisha maneno ya moja kwa moja.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo κύριος katika kumwita Yesu, ikihifadhi heshima na uzito wake bila kuongeza maana isiyosemwa.
- source_word: πεινῶντα ἢ διψῶντα
  choice: ukiwa na njaa au kiu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha hali ambazo walimwona akiwa nazo.
- source_word: ξένον
  choice: ukiwa mgeni
  rationale: Mgeni huhifadhi maana ya mtu asiye wa nyumbani au jamii anayehitaji kupokewa, bila kumwekea hasa utaifa wa kigeni.
- source_word: γυμνὸν
  choice: ukiwa uchi
  rationale: Huhifadhi nguvu ya moja kwa moja ya neno la Kigiriki; katika muktadha linaweza pia kudokeza kutokuwa na mavazi ya kutosha.
- source_word: ἀσθενῆ
  choice: ukiwa mgonjwa
  rationale: Katika orodha hii ya mahitaji ya kimwili na kijamii, maana inayofaa zaidi ni ugonjwa kuliko udhaifu wa jumla.
- source_word: ἐν φυλακῇ
  choice: gerezani
  rationale: Ni usemi mfupi na wa kawaida wa Kiswahili kwa kuwa kifungoni.
- source_word: οὐ διηκονήσαμέν σοι
  choice: nasi tusikutumikie
  rationale: Huhifadhi maana pana ya διακονέω ya kutoa huduma kwa vitendo na uhusiano wake na kumtumikia Bwana, bila kuibana kuwa huduma rasmi ya kidini.
theological_decisions:
- issue: Cheo κύριος kinapotumiwa kumwita Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndiyo tafsiri ya kawaida inayohifadhi heshima na mwangwi wa kikristo wa cheo hicho bila kueleza zaidi ya maandishi.
- issue: Nguvu ya διακονέω katika kishazi cha mwisho
  choice: tusikutumikie
  alternative: tusikuhudumie / tusikutunze
  rationale: “Kutumikia” huhifadhi wigo mpana wa huduma ya vitendo na wazo kwamba msaada kwa wenye uhitaji ni huduma kwa mfalme; tanbihi inaonyesha tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umewekwa wa kawaida kwa wasomaji wa leo, huku marudio ya hali mbalimbali na mvutano wa mwisho wa swali yakihifadhiwa.
