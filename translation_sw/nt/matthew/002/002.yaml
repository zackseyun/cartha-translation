id: MAT.2.2
reference: Matthew 2:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: sw
  text: wakisema, “Yuko wapi yule aliyezaliwa mfalme wa Wayahudi? Kwa maana tuliiona nyota yake mashariki[a], nasi tumekuja kumsujudia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilipokuwa ikichomoza.” Kirai cha Kigiriki kinaweza kumaanisha “mashariki” au kueleza kuchomoza kwa nyota.
    reason: alternative_reading
  - marker: b
    text: Au, “kumwabudu.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa heshima kwa mfalme au kuabudu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kivumishi-endelevu hiki kinatanguliza maneno ya wageni; “wakisema” kinafuata muundo wa Kigiriki na ni cha kawaida katika masimulizi ya Kiswahili.
- source_word: Ποῦ ἐστιν
  choice: Yuko wapi
  rationale: Kwa kuwa swali linamhusu mtu, “yuko wapi” ni namna ya kawaida na ya moja kwa moja ya kuuliza mahali alipo.
- source_word: ὁ τεχθεὶς
  choice: yule aliyezaliwa
  rationale: Muundo huu unahifadhi matumizi ya kirai cha kitenzi kama nomino na msisitizo wa kuzaliwa, bila kuongeza wazo la kwamba ni mtoto mchanga kabisa.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: mfalme wa Wayahudi
  rationale: Hiki ni cheo cha kifalme kilicho wazi na cha kawaida, nacho kinahifadhi uzito wake wa kisiasa na wa Kimasihi.
- source_word: εἴδομεν γὰρ
  choice: Kwa maana tuliiona
  rationale: “Kwa maana” linaonyesha sababu ya swali lao, na “tuliiona” linawasilisha kitenzi cha wakati uliopita kwa kawaida katika muktadha huu.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: nyota yake
  rationale: Kiwakilishi cha umilikaji kinatafsiriwa kwa kawaida bila kufafanua zaidi nyota hiyo ilikuwa ya aina gani.
- source_word: ἐν τῇ ἀνατολῇ
  choice: mashariki
  rationale: Hili ni chaguo la kawaida na linalowezekana kimuktadha, huku maana nyingine ya nyota kuchomoza ikihifadhiwa katika tanbihi.
- source_word: ἤλθομεν
  choice: tumekuja
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea wakati wanaposema maneno haya.
- source_word: προσκυνῆσαι αὐτῷ
  choice: kumsujudia
  rationale: “Kumsujudia” linaweza kueleza kuinama kwa heshima mbele ya mfalme na pia ibada; hivyo linahifadhi upana na mvutano wa neno la Kigiriki bila kuamua maana yake kwa haraka.
theological_decisions:
- issue: Maana ya προσκυνῆσαι kuhusiana na mtoto Yesu
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Muktadha wa karibu unamtaja kama mfalme wa Wayahudi, hivyo tendo linaweza kuwa heshima ya kifalme; hata hivyo, kitenzi hicho pia kinaweza kumaanisha ibada. “Kumsujudia” pamoja na tanbihi kinahifadhi uwezekano wote bila kupunguza ushuhuda mpana wa Mathayo kuhusu utambulisho wa Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni ya kawaida kwa wasomaji wengi, huku istilahi “kumsujudia” ikihifadhi kwa ufupi maana ya kuinama kwa heshima na uwezekano wa ibada.
