reference: Matthew 2:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: sw
  text: '“Nawe, Bethlehemu, nchi ya Yuda,

    wewe si wa hadhi ya chini hata kidogo miongoni mwa wakuu wa Yuda;

    kwa maana kutoka kwako atatokea[a] mtawala

    ambaye atawachunga[b] watu wangu, Israeli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atatoka” (kihalisi zaidi, “atatoka nje”).
    reason: lexical_alternative
  - marker: b
    text: “Atawachunga” pia linaweza kuwa na maana ya “atawatawala,” hivyo picha ya utunzaji wa mchungaji inaambatana na uongozi wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: nchi
  rationale: Katika kirai kinachoifafanua Bethlehemu kuwa ya Yuda, neno hili linaonyesha eneo au nchi, si udongo.
- source_word: οὐδαμῶς
  choice: si ... hata kidogo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo mkali wa ukanushaji.
- source_word: ἐλαχίστη
  choice: mdogo
  rationale: Katika muktadha huu neno linahusu udogo wa cheo au umuhimu; “mdogo” ni la kawaida na haliongezi ufafanuzi usiotajwa wazi.
- source_word: ἡγεμόσιν
  choice: watawala
  rationale: Linahifadhi dhana pana ya mamlaka na uongozi bila kulazimisha cheo maalumu kama gavana.
- source_word: ἐξελεύσεται
  choice: atatokea
  rationale: “Atatokea” linaeleza kwa Kiswahili cha kawaida kwamba mtawala huyo atatoka Bethlehemu; maana ya moja kwa moja zaidi imewekwa katika tanbihi.
- source_word: ἡγούμενος
  choice: mtawala
  rationale: Kivumishi-tendo hiki kimetumika kama nomino kumtaja mwenye jukumu la kuongoza au kutawala.
- source_word: ποιμανεῖ
  choice: atawachunga
  rationale: Linahifadhi picha ya mchungaji iliyomo katika kitenzi cha Kigiriki, pamoja na maana yake pana ya uongozi wa kifalme.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: watu wangu Israeli
  rationale: Linahifadhi kwa urahisi na moja kwa moja usemi wa agano na uhusiano wa ufafanuzi wa jina Israeli.
theological_decisions:
- issue: Maana ya kifalme na ya kichungaji katika maelezo ya yule ajaye
  choice: Kutumia “mtawala” kwa ἡγούμενος na “atawachunga” kwa ποιμανεῖ.
  alternative: Kutafsiri maneno yote mawili kwa lugha ya kisiasa, kama “kiongozi” na “atawatawala,” au yote mawili kwa lugha ya kichungaji.
  rationale: Mstari unaunganisha utawala na picha ya uchungaji. Kuhifadhi yote mawili kunazuia kufuta mvutano na utajiri wa picha hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi unafuata muundo wa dondoo bila kuifanya sentensi kuwa ngumu; “si mdogo hata kidogo” ni mkazo wa kawaida na unaoeleweka kwa wasomaji wengi.
