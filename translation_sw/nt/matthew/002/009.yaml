id: MAT.2.9
reference: Matthew 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: sw
  text: Baada ya kumsikia mfalme, wakaendelea na safari yao. Na tazama, ile nyota waliyoiona mashariki[a] ikawatangulia mpaka ikaja ikasimama juu ya mahali alipokuwa mtoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ilipokuwa ikichomoza”; kirai cha Kigiriki kinaweza kumaanisha ama mashariki kama eneo au mwelekeo, ama kuchomoza kwa nyota.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Baada ya kumsikiliza mfalme
  rationale: Kirai cha wakati kinaonyesha kuwa kuondoka kulifuata kumsikiliza mfalme. Kitenzi “kumsikiliza” kinaonyesha hapa kumsikia mtu akisema, bila kuongeza jina la Herode lisilotajwa katika mstari huu.
- source_word: ἐπορεύθησαν
  choice: wakaondoka
  rationale: Katika muktadha huu kinaonyesha kuondoka kwao na kuendelea na safari; “wakaondoka” ni simulizi la kawaida na fasaha la Kiswahili.
- source_word: ἰδοὺ
  choice: Na tazama
  rationale: Kihisishi hiki kinavuta usikivu kwa tukio la ghafla na kuhifadhi uchangamfu wa simulizi.
- source_word: ἀστήρ
  choice: nyota
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya neno la Kigiriki.
- source_word: ὃν εἶδον
  choice: waliyoiona
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba walikuwa wameiona nyota kabla ya tukio linalosimuliwa sasa.
- source_word: ἐν τῇ ἀνατολῇ
  choice: upande wa mashariki
  rationale: Huhifadhi tafsiri ya kijiografia iliyozoeleka; kwa kuwa kirai cha Kigiriki kinaweza pia kumaanisha kuchomoza kwa nyota, maana hiyo imewekwa katika tanbihi.
- source_word: προῆγεν αὐτούς
  choice: ikawatangulia
  rationale: Huhifadhi picha ya nyota kwenda mbele yao bila kufafanua kupita kiasi namna ilivyowaongoza.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: mpaka ikafika na kusimama
  rationale: Huwasilisha kwa Kiswahili cha kawaida mfuatano wa kufika kisha kusimama uliomo katika kishiriki na kitenzi kikuu.
- source_word: ἐπάνω οὗ ἦν
  choice: juu ya mahali alipokuwa
  rationale: Hueleza nafasi ya nyota juu ya eneo alikokuwa mtoto kwa namna iliyo wazi na ya asili.
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza msisitizo wa umri ambao hauhitajiki hapa.
theological_decisions:
- issue: Maana ya ἐν τῇ ἀνατολῇ katika simulizi la nyota
  choice: upande wa mashariki
  alternative: ilipokuwa ikichomoza
  rationale: Kirai kinaweza kueleweka kijiografia kuwa mashariki au kiastronomia kuwa wakati wa kuchomoza kwa nyota. Maandishi makuu yanatumia maana iliyozoeleka na tanbihi inahifadhi uwezekano mwingine bila kutatua kimya kimya utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. “Na tazama” limehifadhiwa kama alama ya kuvuta usikivu, na miundo imewekwa kwa mtiririko wa kawaida bila kuondoa utata halisi wa kirai kuhusu mashariki/kuchomoza.
