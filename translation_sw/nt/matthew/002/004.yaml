  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: sw
  text: Akawakusanya wakuu wote wa makuhani pamoja na waandishi wote wa watu, akawauliza Masihi angezaliwa wapi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγαγὼν
  choice: akawakusanya
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia au kuambatana kwa karibu na tendo kuu; mfuatano wa vitenzi wenye “aka-” ni wa asili katika Kiswahili na unaonyesha mpangilio huo.
- source_word: πάντας
  choice: wote
  rationale: Linahifadhi maana ya ujumla ya neno la Kigiriki bila kuongeza maelezo.
- source_word: ἀρχιερεῖς
  choice: wakuu wa makuhani
  rationale: Hurejelea viongozi wakuu wa ukuhani, si watu kadhaa waliokuwa kila mmoja kuhani mkuu pekee.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni tafsiri ya karibu ya cheo hiki cha kihistoria na imezoeleka katika Kiswahili cha Biblia; “walimu wa sheria” ingekuwa wazi zaidi lakini ni ya kufasiri zaidi.
- source_word: τοῦ λαοῦ
  choice: wa watu
  rationale: Inahifadhi uhusiano wa kisarufi wa asili bila kuongeza waziwazi utambulisho wa kikabila ambao haukutajwa hapa.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: akawauliza
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kuuliza jambo kutoka kwa watu fulani. Muundo wa “aka-” unaendeleza simulizi, ingawa Kiswahili hakionyeshi kwa uzito uleule hali endelevu ya kitenzi cha Kigiriki.
- source_word: ποῦ
  choice: wapi
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha kuuliza mahali.
- source_word: ὁ χριστὸς
  choice: Masihi
  rationale: Hapa ni cheo cha mtawala aliyetiwa mafuta na kutarajiwa katika unabii wa Kiyahudi, si jina la mtu tu.
- source_word: γεννᾶται
  choice: angezaliwa
  rationale: Katika swali lisilo la moja kwa moja lililo ndani ya simulizi la wakati uliopita, Kiswahili hutumia hali ya masharti kueleza kuzaliwa kulikotarajiwa baadaye.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unamhusu mtawala aliyetiwa mafuta aliyekuwa akitarajiwa kutokana na unabii wa Kiyahudi. “Masihi” huweka wazi matumizi hayo ya cheo, huku tanbihi ikihifadhi tafsiri nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “akawakusanya ... akawauliza” ni wa asili katika masimulizi. “Waandishi” limehifadhiwa kama cheo cha kihistoria kilichozoeleka katika tafsiri za Biblia, ingawa kwa wasomaji wengine linaweza kuhitaji ufafanuzi.
