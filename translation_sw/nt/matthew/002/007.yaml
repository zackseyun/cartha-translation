  text: Ndipo Herode akawaita mamajusi[a] kwa siri, akapata kujua kutoka kwao wakati hasa nyota ilipoonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wenye hekima.” Neno la Kigiriki μάγοι humaanisha kwa umahususi zaidi mamajusi, yaani, wasomi wenye elimu ya unajimu kutoka Mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: λάθρᾳ
  choice: kwa siri
  rationale: Hueleza kwamba kitendo kilifanywa bila wengine kujua; ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: καλέσας
  choice: akawaita
  rationale: Kitenzi-shirikishi cha Kigiriki kinaonyesha kitendo kilichotangulia kitendo kikuu. Mfululizo wa vitenzi wenye kiambishi -ka- unawasilisha ufuatano huo kwa Kiswahili cha asili.
- source_word: τοὺς μάγους
  choice: mamajusi[a]
  rationale: “Mamajusi” ni istilahi ya Kiswahili inayohifadhi maana mahususi ya μάγοι kuliko tafsiri pana ya “watu wenye hekima,” bila kuingiza taswira za mapokeo ya baadaye.
- source_word: ἠκρίβωσεν
  choice: akapata kujua ... kwa usahihi
  rationale: Kitenzi hiki humaanisha kuchunguza au kupata habari iliyo sahihi. Usemi huu unaonyesha matokeo ya uchunguzi pamoja na wazo la usahihi.
- source_word: παρ’ αὐτῶν
  choice: kwao
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo cha habari; “kwao” ni usemi mfupi na wa kawaida wa Kiswahili.
- source_word: τὸν χρόνον
  choice: wakati
  rationale: χρόνος hapa ni wakati unaoulizwa; wazo la usahihi tayari limeonyeshwa na tafsiri ya ἠκρίβωσεν.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: wakati nyota ilipotokea
  rationale: Kirai cha Kigiriki cha umilikishi chenye kitenzi-shirikishi kinaweza kutolewa kwa kawaida kama kishazi cha wakati. “Ilipotokea” huonyesha tukio la kuonekana kwa nyota kabla ya uchunguzi wa Herode.
theological_decisions:
- issue: Iwapo μάγοι itafsiriwe kwa istilahi mahususi au kwa maelezo mapana
  choice: mamajusi
  alternative: watu wenye hekima
  rationale: Istilahi mahususi inadumisha mazingira ya kihistoria ya wasomi-wanajimu kutoka Mashariki na haidai kwamba walikuwa wafalme; tafsiri iliyozoeleka zaidi imetolewa katika tanbihi.
- issue: Hali ya wakati katika τοῦ φαινομένου ἀστέρος
  choice: wakati nyota ilipotokea
  alternative: wakati nyota ilipokuwa ikionekana
  rationale: Kitenzi-shirikishi cha wakati uliopo hakibainishi peke yake hali ya kitendo, lakini muktadha wa kuuliza wakati unaelekea kwenye mwanzo au tukio la kuonekana. Tafsiri haiongezi madai kuhusu muda ambao nyota iliendelea kuonekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Ndipo” na mfululizo wa vitenzi vya -ka- huweka ufuatano wazi; “mamajusi” inaelezwa kwa tanbihi kwa wasomaji wa kawaida.
