id: MAT.2.11
reference: Matthew 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: sw
  text: 'Walipoingia ndani ya nyumba, walimwona mtoto pamoja na Maria, mama yake. Wakaanguka chini na kumsujudia[a]. Kisha wakafungua hazina zao na wakamtolea zawadi: dhahabu, ubani na manemane.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwabudu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuabudu au kutoa heshima kuu kwa kusujudu, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: nyumba
  rationale: Neno hili hutaja nyumba au makao; “nyumba” ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi mazingira halisi ya simulizi.
- source_word: παιδίον
  choice: mtoto
  rationale: Neno hili humaanisha mtoto au mtoto mdogo. “Mtoto” ni la kawaida na haliongezi umri au jinsia zaidi ya inavyohitajika hapa.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: pamoja na Maria mama yake
  rationale: Huhifadhi maana ya kuwa mtoto alikuwa pamoja na Maria na humtambulisha Maria kuwa mama yake kwa Kiswahili cha kawaida.
- source_word: πεσόντες
  choice: wakaanguka chini
  rationale: Huhifadhi wazi tendo la mwili lililotangulia kusujudu bila kulifafanua zaidi kuwa ibada.
- source_word: προσεκύνησαν
  choice: kumsujudia
  rationale: “Kumsujudia” linaweza kuonyesha kuinama kwa heshima kuu na pia ibada, hivyo linahifadhi upana na mvutano wa neno la Kigiriki katika muktadha huu.
- source_word: θησαυροὺς
  choice: hazina zao
  rationale: “Hazina” linaweza kumaanisha vitu vya thamani walivyokuwa navyo bila kulazimisha wazo la masanduku ya hazina, ambalo halitajwi wazi katika Kigiriki.
- source_word: προσήνεγκαν
  choice: kumpa
  rationale: Katika muktadha wa kuwasilisha zawadi, “kumpa” ni la asili na linaloeleweka kwa urahisi; maana rasmi ya kutoa inaonyeshwa na nomino “zawadi.”
- source_word: δῶρα
  choice: zawadi
  rationale: Ni tafsiri ya kawaida, wazi, na isiyoingiza mapema maana maalumu ya sadaka.
- source_word: λίβανον
  choice: ubani
  rationale: “Ubani” ni jina la Kiswahili linalotumika kwa resini yenye harufu nzuri inayokusudiwa hapa, hasa frankincense.
- source_word: σμύρναν
  choice: manemane
  rationale: “Manemane” ni istilahi ya Kiswahili iliyozoeleka na sahihi kwa myrrh.
theological_decisions:
- issue: Maana ya προσκυνέω kuhusiana na mtoto Yesu
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Katika simulizi hili tendo linaweza kueleweka kuwa heshima ya hali ya juu kwa mtoto wa kifalme au ibada kwa Yesu. “Kumsujudia” huhifadhi upana huo, huku “kumwabudu” ikiwekwa katika tanbihi kama uwezekano wenye nguvu zaidi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa mtiririko wa asili bila kuondoa mfuatano wa matendo katika Kigiriki. Alama ya tanbihi imewekwa baada ya “kumsujudia,” ambako tofauti ya maana inahusika.
