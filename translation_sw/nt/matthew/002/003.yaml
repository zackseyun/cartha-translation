  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: sw
  text: Mfalme Herode aliposikia hayo, alifadhaika, na Yerusalemu yote pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yerusalemu yote” ni namna ya kulitaja jiji likimaanisha wakazi wake; huenda ni kauli ya jumla au ya kutia mkazo kuhusu kufadhaika kulikoshirikiwa jijini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia hayo
  rationale: Kirai cha kitenzi katika wakati uliopita kinatumika kueleza wakati. Kiswahili cha kawaida hutumia kishazi cha wakati; “hayo” linaonyesha habari iliyotangulia kuhusu kuzaliwa kwa mfalme wa Wayahudi bila kuieleza upya.
- source_word: δὲ
  choice: imewakilishwa katika mtiririko wa kishazi “aliposikia”
  rationale: δὲ ni kiunganishi hafifu cha kuendeleza simulizi; hapa hakihitaji kutafsiriwa kwa neno tofauti, kwa kuwa uhusiano wa simulizi unaelezwa kwa kawaida na kishazi cha wakati.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Mfalme Herode
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo pamoja na jina.
- source_word: ἐταράχθη
  choice: alifadhaika
  rationale: Neno hili linaonyesha kuvurugika moyoni, kushtuka, au kuingiwa na hofu. “Alifadhaika” ni la asili na lenye hadhi bila kubainisha kupita kiasi aina au kiwango cha hisia.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: Yerusalemu yote
  rationale: Tafsiri hii inahifadhi tamathali ya kulitaja jiji likiwakilisha wakazi wake, bila kuibana maana kuwa viongozi pekee au kuongeza “watu” katika matini kuu.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Ni tafsiri ya kawaida ya uhusiano wa kushiriki hali hiyo pamoja na Herode.
theological_decisions:
- issue: Upeo wa πᾶσα Ἱεροσόλυμα
  choice: “Yerusalemu yote” kama rejeo la kijumla kwa jiji na wakazi wake
  alternative: Huenda ni kauli ya jumla au ya kutia mkazo kuhusu wakazi wengi, au hasa walio katika duru za uongozi wa Yerusalemu.
  rationale: Kigiriki kinataja jiji lote kwa njia ya metonimia. Matini kuu inahifadhi usemi huo na tanbihi inaonyesha kwamba haupaswi kulazimishwa kumaanisha kila mtu mmoja mmoja au viongozi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye hadhi. “Alifadhaika” linafikisha msukosuko wa ndani wa ἐταράχθη; tofauti ya karibu kama “alishtuka” haijawekwa katika tanbihi ili kuepuka tanbihi isiyo ya lazima. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachoifafanua.
