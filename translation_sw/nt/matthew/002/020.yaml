  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: sw
  text: akisema, “Ondoka, mchukue mtoto na mama yake, uende katika nchi ya Israeli, kwa maana wale waliokuwa wakitafuta kumwua mtoto wamekufa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata maneno ya Kigiriki kwa karibu zaidi: “wale wanaoutafuta uhai wa mtoto wamekufa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha maneno ya malaika na mstari uliotangulia; “akisema” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Ἐγερθεὶς
  choice: Ondoka
  rationale: Ingawa kwa umbo ni kitenzi kishirikishi, hapa kinatumika kama amri ya kuamka au kuinuka na kuanza kutenda. “Ondoka” ni ya kawaida na inafaa muktadha.
- source_word: παράλαβε
  choice: mchukue
  rationale: Maana hapa ni kumchukua mtu pamoja nawe. Kiambishi cha yambwa cha umoja kinamrejelea mtoto, huku mama yake akiunganishwa kwa “na.”
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: παιδίον humaanisha mtoto; hakuna ulazima wa kuongeza “mdogo,” kwa kuwa Kigiriki hakisisitizi zaidi umri hapa.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mama yake
  rationale: Huhifadhi kwa njia ya kawaida uhusiano wa kimilikishi unaomrejelea mtoto.
- source_word: πορεύου
  choice: uende
  rationale: Amri ya πορεύομαι hapa ni agizo rahisi la kwenda; “uende” ni ya asili katika mfululizo huu wa amri.
- source_word: εἰς γῆν Ἰσραήλ
  choice: katika nchi ya Israeli
  rationale: γῆ Ἰσραήλ hurejelea eneo au nchi ya Israeli. “Katika nchi ya Israeli” huwasilisha mwendo wa kuingia katika eneo hilo kwa Kiswahili sanifu.
- source_word: τεθνήκασιν
  choice: wamekufa
  rationale: Wakati timilifu unaonyesha kifo kilichotokea na hali yake inayoendelea; “wamekufa” huwasilisha vyote kwa kawaida.
- source_word: οἱ ζητοῦντες
  choice: wale waliokuwa wakitafuta
  rationale: Kitenzi kishirikishi kilichotumiwa kama nomino kinarejelea watu waliokuwa katika jitihada ya kumdhuru mtoto. Wakati uliopita katika Kiswahili unaepusha mkanganyiko kwa kuwa sasa wamekufa.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: kumwua mtoto
  rationale: Katika nahau hii, ψυχή ni uhai unaotafutwa ili uondolewe, si “roho.” “Kumwua mtoto” hutoa maana ya tishio la mauti kwa Kiswahili cha asili bila kuingiza dhana ya nafsi isiyo ya kimwili.
theological_decisions:
- issue: Tafsiri ya ψυχή katika muktadha wa tishio la kuuawa
  choice: kumwua mtoto
  alternative: kuutafuta uhai wa mtoto
  rationale: Nahau ya Kigiriki ya “kutafuta ψυχή ya mtu” hapa ina maana ya kutaka kumuua. “Uhai” ni ya karibu zaidi kwa umbo, lakini tungo “kuutafuta uhai” inaweza kueleweka vibaya katika Kiswahili; tafsiri iliyochaguliwa huweka wazi maana ya simulizi bila kuleta wazo la “roho.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Amri zimewekwa kwa mtiririko wa kawaida wa Kiswahili. “Israeli” imetumiwa kama jina la nchi katika Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
