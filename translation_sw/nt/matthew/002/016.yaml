id: MAT.2.16
reference: Matthew 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: sw
  text: Ndipo Herode alipoona kwamba mamajusi[a] walikuwa wamemdanganya[b], akakasirika sana; akatuma watu wakawaua watoto wote wa kiume waliokuwa katika Bethlehemu na katika maeneo yote ya kandokando yake, wenye umri wa miaka miwili na walio chini ya umri huo, kulingana na wakati aliokuwa ameuthibitisha kwa uhakika kutoka kwa mamajusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida huitwa “watu wenye hekima.” Neno la Kigiriki ni magoi, likimaanisha wataalamu wa Mashariki waliohusishwa na unajimu.
    reason: cultural_note
  - marker: b
    text: Au, kwa maana ya karibu zaidi na neno la Kigiriki, “walikuwa wamemdhihaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Kiunganishi hiki cha wakati kinaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἡρῴδης
  choice: Herode
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: ἰδὼν ὅτι
  choice: alipoona kwamba
  rationale: Huonyesha Herode kutambua jambo lililotokea, huku muundo wa wakati ukiwa wa asili katika Kiswahili.
- source_word: ἐνεπαίχθη
  choice: walikuwa wamemdanganya
  rationale: Katika muktadha huu mamajusi hawakurudi kwa Herode, hivyo aliona kwamba walikuwa wamemhadaa au kumfanya mjinga; maana ya moja kwa moja zaidi ya ‘kumdhihaki’ imehifadhiwa katika tanbihi.
- source_word: μάγων
  choice: mamajusi
  rationale: Neno hili lililozoeleka katika Kiswahili huhifadhi utambulisho maalumu wa μάγοι kuliko tafsiri pana kama ‘watu wenye hekima’.
- source_word: ἐθυμώθη λίαν
  choice: akakasirika sana
  rationale: Huwasilisha wazi kuingia katika hali ya hasira pamoja na msisitizo wa λίαν.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Akatuma watu wakawaua
  rationale: Muundo huu huonyesha kwa Kiswahili cha asili kwamba Herode alituma watendaji waliotekeleza mauaji, bila kudai kwamba aliyafanya kwa mikono yake mwenyewe.
- source_word: πάντας τοὺς παῖδας
  choice: watoto wote wa kiume
  rationale: Muktadha unahusu watoto wa kiume; usemi huu ni sahihi zaidi kuliko ‘watoto wote’ na unafaa umri uliotajwa.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: waliokuwa Bethlehemu na katika maeneo yote yaliyoizunguka
  rationale: ὅρια hapa ni eneo au sehemu zinazozunguka mji, si mistari ya mipaka peke yake.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: wenye umri wa miaka miwili na walio chini ya umri huo
  rationale: Huonyesha kwa uwazi kwamba miaka miwili ndiyo kikomo cha juu kinachohesabiwa ndani.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: kulingana na wakati aliokuwa ameujua kwa uhakika kutoka kwa mamajusi
  rationale: Huhifadhi wazo la kupatana na wakati ambao Herode alikuwa ameuchunguza na kuuthibitisha kutokana na habari za mamajusi.
theological_decisions:
- issue: Utafsiri wa μάγοι
  choice: mamajusi
  alternative: watu wenye hekima
  rationale: ‘Mamajusi’ huhifadhi utambulisho wa kihistoria na kitamaduni wa wageni hao bila kuingiza taswira za mapokeo; tanbihi inafafanua maana kwa msomaji wa sasa.
- issue: Utafsiri wa ἐνεπαίχθη
  choice: walikuwa wamemdanganya
  alternative: walikuwa wamemdhihaki
  rationale: ‘Wamemdanganya’ huwasilisha nguvu ya kimuktadha kwamba Herode alifanywa mjinga walipokosa kurudi, huku ‘wamemdhihaki’ ikiwa maana ya karibu zaidi ya neno na imeonyeshwa katika tanbihi.
- issue: Wakala wa mauaji katika ἀποστείλας ἀνεῖλεν
  choice: Akatuma watu wakawaua
  alternative: baada ya kutuma watu, akawaua
  rationale: Uchaguzi huu huweka wazi kwamba watu waliotumwa ndio waliotekeleza amri, bila kubadili wajibu wa Herode kama aliyeanzisha mauaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Sentensi ndefu ya Kigiriki imegawanywa baada ya kutaja hasira ya Herode ili iwe rahisi kueleweka bila kupoteza uhusiano wa matukio. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
