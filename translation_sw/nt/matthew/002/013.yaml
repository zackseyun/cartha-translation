id: MAT.2.13
reference: Matthew 2:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: sw
  text: Baada ya kuondoka kwao, tazama, malaika wa Bwana alimtokea Yosefu katika ndoto, akisema, “Inuka, uwachukue mtoto na mama yake, ukimbilie Misri, ukae huko mpaka nitakapokuambia; kwa maana Herode yuko karibu kumtafuta mtoto ili amwangamize[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amuue.” Kigiriki kinasema “amwangamize,” hapa ikiwa na maana ya kusababisha kifo chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Baada ya wao kuondoka
  rationale: Huwakilisha genitivi huru inayoonyesha tendo lililotangulia; ‘wao’ huwarejelea wageni waliotajwa katika muktadha.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi ishara hai ya kisimulizi inayovuta fikira kwenye kuingilia kati kwa Mungu kwa ghafula.
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Kiswahili kwa kawaida hakilazimishi utofauti wa ‘a/the’; usemi huu unadumisha kutokuwa na kibainishi katika Kigiriki bila kuamua kama ni malaika fulani anayejulikana.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: alimtokea Yosefu katika ndoto
  rationale: Ni usemi wa asili wa Kiswahili kwa kuonekana katika ndoto; wakati uliopita unafaa simulizi ingawa Kigiriki hutumia wakati wa sasa wa kihistoria.
- source_word: Ἐγερθεὶς
  choice: Ondoka
  rationale: Partisipio lina nguvu ya amri katika mfuatano huu; ‘ondoka’ ni ya sasa na yenye hadhi, ikimaanisha kuinuka na kuchukua hatua.
- source_word: παράλαβε
  choice: mchukue
  rationale: Huonyesha kumchukua mtoto pamoja naye; kiambishi cha yambwa humtambulisha mtoto wazi.
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: Ni tafsiri ya kawaida na sahihi ya παιδίον katika muktadha huu.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: ukimbilie Misri
  rationale: ‘Kukimbilia’ huonyesha kutoroka kwa haraka kuelekea mahali pa usalama na kuhifadhi uzito wa φεύγω.
- source_word: ἴσθι ἐκεῖ
  choice: ukae huko
  rationale: Ingawa kihalisi ni ‘uwe huko,’ maana ya kimuktadha ni kuendelea kubaki huko.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: kwa maana Herode anakaribia kumtafuta
  rationale: Huhifadhi wazo la nia au tendo lililo karibu kutokea badala ya kulifanya kuwa kauli rahisi ya wakati ujao.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: ili amwangamize
  rationale: Huhifadhi nguvu ya ἀπόλλυμι (‘kuangamiza’) huku muktadha ukionyesha kuwa kusudi ni kumuua.
theological_decisions:
- issue: Maana ya κύριος katika ἄγγελος κυρίου
  choice: Bwana
  alternative: bwana mkuu
  rationale: ‘Bwana’ ni tafsiri iliyozoeleka ya cheo hiki cha Mungu katika muktadha wa kibiblia, bila kuongeza utambulisho maalumu wa malaika.
- issue: Udhahiri wa ἄγγελος κυρίου
  choice: malaika wa Bwana
  alternative: yule malaika wa Bwana
  rationale: Kigiriki hakina kibainishi kwa ἄγγελος; Kiswahili ‘malaika wa Bwana’ huhifadhi uwezekano huo bila kulazimisha kuwa ni malaika fulani anayejulikana.
- issue: Kusudi la Herode katika ἀπολέσαι
  choice: amwangamize
  alternative: amuue
  rationale: ‘Amwangamize’ hufuata maana pana ya kitenzi cha Kigiriki, huku tanbihi ikibainisha kwamba hapa kinamaanisha kusababisha kifo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili katika simulizi huku ukihifadhi ‘tazama,’ uharaka wa kukimbilia Misri, na wazo kwamba hatua ya Herode iko karibu kutokea. Kiashiria cha tanbihi [a] kimewekwa baada ya neno linalofafanuliwa.
