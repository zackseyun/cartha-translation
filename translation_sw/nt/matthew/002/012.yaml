  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: sw
  text: Nao, baada ya kuonywa[a] katika ndoto kwamba wasirudi kwa Herode, waliondoka kwenda nchi yao kwa njia nyingine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kupewa onyo la Mungu katika ndoto.” Kigiriki kinadokeza kwamba onyo lilitoka kwa Mungu, ingawa Mungu hatajwi wazi katika mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa barabara nyingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: baada ya kuonywa
  rationale: Kitenzi hiki katika hali ya kutendwa kina maana ya kupokea onyo au maagizo, na katika muktadha huu chanzo cha Mungu kinaeleweka bila kutajwa wazi.
- source_word: κατ’ ὄναρ
  choice: katika ndoto
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa Mathayo kuhusu ujumbe uliopokelewa katika ndoto.
- source_word: μὴ ἀνακάμψαι πρὸς Ἡρῴδην
  choice: wasimrudie Herode
  rationale: 'Muundo huu unatoa yaliyomo katika onyo: wasiende tena kwa Herode. ‘Kumrudia’ ni Kiswahili cha kawaida katika muktadha huu.'
- source_word: δι’ ἄλλης ὁδοῦ
  choice: kwa njia nyingine
  rationale: ὁδός hapa ni njia halisi ya safari; usemi huu ni wa asili na unahifadhi upana wa maana ya neno hilo.
- source_word: ἀνεχώρησαν
  choice: walirudi
  rationale: Katika muktadha wa kuelekea nyumbani, kitenzi hiki kinaonyesha kuondoka na kurejea nchini kwao; ‘walirudi’ huunganika kwa ufasaha na mwisho wa sentensi.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: katika nchi yao
  rationale: χώρα humaanisha nchi, eneo, au sehemu; hapa ‘nchi yao’ huonyesha wazi mahali walikokuwa wakirejea bila kuongeza neno ‘wenyewe’ lisilohitajika.
theological_decisions:
- issue: Chanzo cha Mungu kilichodokezwa katika onyo
  choice: baada ya kuonywa
  alternative: baada ya kuonywa na Mungu; baada ya kupewa onyo la Mungu
  rationale: Hali ya kutendwa ya χρηματισθέντες inadokeza kwamba onyo lilitoka kwa Mungu, lakini mstari wenyewe haumtajii Mungu wazi. Tafsiri kuu inadumisha dokezo hilo bila kuongeza mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Herode’ ni umbo lililozoeleka katika tafsiri za Kiswahili; ‘wasimrudie’ huepuka usemi mzito wa ‘wasirudi kwa Herode.’
