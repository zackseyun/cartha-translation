  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: sw
  text: Lakini baada ya Herode kufa, tazama, malaika[a] wa Bwana anamtokea Yosefu katika ndoto huko Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malaika mmoja wa Bwana.” Kigiriki hakina kibainishi kabla ya neno “malaika”; Kiswahili “malaika wa Bwana” kinaweza kubaki bila kubainisha ikiwa ni malaika mmoja asiyeainishwa au malaika anayejulikana.
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: baada ya Herode kufa
  rationale: Kishiriki cha aoristi katika muundo wa genitive absolute kinaonyesha wakati uliotangulia tukio kuu; “baada ya ... kufa” ni Kiswahili cha kawaida na sahihi.
- source_word: δὲ
  choice: Lakini
  rationale: Hutoa mpito wa simulizi wenye utofautishaji mdogo na yaliyotangulia.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi kiashiria cha kusisitiza na kuvuta fikira katika simulizi la Mathayo kwa lugha yenye hadhi.
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/an’ au ‘the’; hivyo usemi huu ni wa kawaida na unahifadhi kutobainishwa kwa Kigiriki bila kulazimisha “mmoja” au umaalumu.
- source_word: φαίνεται
  choice: anamtokea
  rationale: Huhifadhi wakati wa sasa wa kihistoria wa Kigiriki na maana ya kujidhihirisha kwa Yosefu.
- source_word: κατ’ ὄναρ
  choice: katika ndoto
  rationale: Ni tafsiri ya kawaida ya nahau hii ya ufunuo uliopokelewa katika ndoto.
- source_word: τῷ Ἰωσὴφ
  choice: Yosefu
  rationale: Yosefu ni umbo la jina lililozoeleka katika Kiswahili; kiambishi cha yambwa katika “anamtokea” kinaonyesha kwamba malaika anamtokea yeye.
- source_word: ἐν Αἰγύπτῳ
  choice: huko Misri
  rationale: Huonyesha mahali Yosefu alipokuwa; “huko” ni ya kawaida katika simulizi na hufanya eneo hilo liwe wazi.
theological_decisions:
- issue: Tafsiri ya κύριος katika ἄγγελος κυρίου
  choice: Bwana
  alternative: bwana mkuu
  rationale: “Bwana” ni jina la heshima lililozoeleka kwa κύριος katika muktadha huu na haliongezi ufafanuzi wa kimadhehebu.
- issue: Kutokuwapo kwa kibainishi kabla ya ἄγγελος
  choice: malaika wa Bwana
  alternative: malaika mmoja wa Bwana
  rationale: Kwa kuwa Kiswahili hakina vibainishi sawa na vya Kigiriki au Kiingereza, “malaika wa Bwana” huhifadhi vizuri uwezekano wa usemi usiobainishwa. Tanbihi inaonyesha namna ya kuufanya usibainifu huo uwe wazi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wakati wa sasa wa kihistoria katika “anamtokea” umehifadhiwa kwa ajili ya uhai wa simulizi.
