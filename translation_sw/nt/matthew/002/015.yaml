id: MAT.2.15
reference: Matthew 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: sw
  text: Akakaa huko mpaka Herode alipokufa, ili litimie neno lililonenwa na Bwana kupitia nabii, linalosema, “Kutoka Misri nilimwita mwanangu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nukuu hii inatoka Hosea 11:1, ambapo katika muktadha wa awali Mungu anaiita Israeli “mwanangu”; hapa Mathayo anaihusisha na Yesu.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: Akakaa huko
  rationale: Ingawa kwa karibu zaidi ni ‘alikuwa huko,’ katika muktadha huu Kiswahili cha kawaida hutumia ‘akakaa huko’ kueleza kuendelea kuwapo mahali pale bila kuongeza wazo lisilohitajika.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: mpaka Herode alipokufa
  rationale: τελευτή hapa ni mwisho wa maisha, yaani kifo. Muundo wa kitenzi ni wa kawaida na wazi zaidi katika Kiswahili kuliko ‘mpaka kifo cha Herode.’
- source_word: ἵνα πληρωθῇ
  choice: ili litimie
  rationale: Huhifadhi lugha ya Mathayo kuhusu kutimia kwa Maandiko bila kuamua kama ἵνα hapa inasisitiza kusudi au matokeo.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: neno lililonenwa na Bwana kupitia nabii
  rationale: ‘Neno’ linafanya kishiriki chenye kibainishi kiwe cha kawaida katika Kiswahili; ‘na Bwana’ humtaja chanzo mkuu, na ‘kupitia nabii’ huhifadhi uwakala wa kati wa διά pamoja na genitivi.
- source_word: λέγοντος
  choice: linalosema
  rationale: Huu ni utangulizi wa kawaida wa nukuu katika Kiswahili. Unahusisha yaliyosemwa na nukuu inayofuata bila kulazimisha ufafanuzi wa ziada kuhusu mhusika wa kisarufi.
- source_word: Ἐξ Αἰγύπτου
  choice: Kutoka Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ἐξ Αἰγύπτου, huku ikihifadhi mahali pa kwanza pa kirai katika nukuu.
- source_word: ἐκάλεσα
  choice: nilimwita
  rationale: καλέω hapa ni kuita mtu atoke; kiambishi ‘-mw-’ kinaonyesha wazi kwamba anayeitwa ni mwana.
- source_word: τὸν υἱόν μου
  choice: mwanangu
  rationale: Huhifadhi kwa usahihi lugha ya umwana iliyo muhimu katika Hosea 11:1 na matumizi yake katika Mathayo.
theological_decisions:
- issue: Kutimia kwa nukuu ya Hosea 11:1
  choice: Kudumisha dai la Mathayo kwamba tukio hili linatimiza neno la kinabii, bila kufafanua namna ya kutimia ndani ya tafsiri.
  alternative: Kuitafsiri wazi kuwa unabii wa moja kwa moja pekee, au kuwa Yesu anarudia kwa mfano historia ya Israeli.
  rationale: Kitenzi πληρωθῇ kinadai kutimia, lakini mstari wenyewe hauelezi nadharia ya namna kutimia huko kunavyofanya kazi. Tanbihi inaeleza muktadha wa awali bila kuondoa mvutano huo.
- issue: κύριος katika kauli ya kutimia
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κυρίου. ‘Bwana’ hutafsiri neno hilo moja kwa moja bila kuingiza katika matini kuu namna maalumu ya kuwakilisha jina la Mungu kutoka Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akakaa huko’ na ‘mpaka Herode alipokufa’ ni miundo ya kawaida kwa wasomaji wengi. Mpangilio wa ‘Kutoka Misri’ umehifadhiwa ili kubaki karibu na msisitizo wa nukuu ya Kigiriki.
