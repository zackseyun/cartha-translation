  text: 'Ndipo likatimia neno lililonenwa kwa njia ya nabii Yeremia, aliyesema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha mfuatano wa matukio katika simulizi kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: ἐπληρώθη
  choice: likatimia
  rationale: Kitenzi hiki kinahifadhi lugha ya Mathayo kuhusu kutimia kwa unabii, huku ngeli ikipatana na “neno.”
- source_word: τὸ ῥηθὲν
  choice: neno lililonenwa
  rationale: Kirai cha Kigiriki kinatumika kama nomino, yaani “kile kilichonenwa.” Kutaja “neno” hufanya Kiswahili kiwe wazi na cha asili bila kubadili maana.
- source_word: διὰ Ἰερεμίου
  choice: kwa njia ya ... Yeremia
  rationale: διά pamoja na jenitivi humwonyesha Yeremia kuwa mpitishaji wa ujumbe; “kwa njia ya” huhifadhi wazo hilo vizuri kuliko kumtaja tu kama mtendaji wa moja kwa moja.
- source_word: τοῦ προφήτου
  choice: nabii
  rationale: Inamtambulisha Yeremia kwa wajibu wake wa kinabii kwa lugha fupi na ya kawaida.
- source_word: λέγοντος
  choice: aliyesema
  rationale: Kishiriki hiki kiko katika jenitivi ya kiume umoja na kinamhusu Yeremia nabii, huku kikianzisha maneno yatakayonukuliwa katika mstari unaofuata.
theological_decisions:
- issue: Kauli ya Mathayo kuhusu kutimia kwa unabii
  choice: 'Kudumisha wazi lugha ya kutimia: “likatimia”'
  alternative: “likatokea ili kutimiza”
  rationale: Mathayo anasema kwamba neno la kinabii lilitimizwa; tafsiri haipaswi kupunguza wala kupanua dai hilo kwa kuongeza kusudi lisilotajwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ndipo” huendeleza simulizi, na “neno lililonenwa” huepuka muundo mgumu wa “kile kilichonenwa.”
