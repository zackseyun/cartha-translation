  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: sw
  text: '“Sauti ilisikika katika Rama: kilio na maombolezo makubwa[a]. Raheli akiwalilia watoto wake, naye hakutaka kufarijiwa[b], kwa sababu hawapo tena[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilio na maombolezo mengi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alikataa kufarijiwa.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “kwa sababu hawapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: Sauti
  rationale: Neno hili linaweza kumaanisha sauti ya mtu au sauti inayosikika kwa ujumla. “Sauti” ni la kawaida na linadumisha mtindo wa kinabii bila kuamua zaidi aina ya sauti.
- source_word: ἐν Ῥαμὰ
  choice: huko Rama
  rationale: Kihusishi ἐν kinaonyesha mahali. “Huko Rama” ni Kiswahili cha kawaida kinachoonyesha kwamba sauti ilisikika mahali paitwapo Rama.
- source_word: ἠκούσθη
  choice: ilisikika
  rationale: Hii ni kauli tendwa ya wakati uliopita; “ilisikika” inadumisha taarifa isiyomtaja aliyesikia.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: kilio na maombolezo makubwa
  rationale: κλαυθμός ni kilio cha huzuni kinachosikika, na ὀδυρμός ni maombolezo; πολύς inasisitiza ukubwa au wingi wa maombolezo.
- source_word: Ῥαχὴλ
  choice: Raheli
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: κλαίουσα τὰ τέκνα αὐτῆς
  choice: akiwalilia watoto wake
  rationale: Kauli ya kuendelea ya κλαίουσα inaonyesha tendo linaloendelea. “Akiwalilia” ni usemi wa kawaida wa Kiswahili kwa kulia kwa sababu ya kuwapoteza watoto.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: hakutaka kufarijiwa
  rationale: Tafsiri hii inadumisha maana ya kutokuwa tayari au kutotaka kupokea faraja, bila kuitia nguvu zaidi kwa kusema moja kwa moja kwamba alikataa.
- source_word: ὅτι οὐκ εἰσίν
  choice: kwa sababu hawapo tena
  rationale: Kwa neno moja moja ni “kwa sababu hawapo.” “Hawapo tena” linaeleza kwa Kiswahili cha kawaida hali ya kupotea kwao bila kuongeza wazi kwamba wamekufa.
theological_decisions:
- issue: Nafasi ya Raheli katika dondoo la kinabii
  choice: Kumwacha Raheli kama sura ya kimama na ya kinabii bila kufafanua ishara hiyo katika matini kuu.
  alternative: Kumfafanua moja kwa moja kuwa anawakilisha akina mama wa Israeli, au kumchukulia tu kama mama wa kihistoria anayesema.
  rationale: Matini ya Kigiriki inamtaja Raheli tu, huku muktadha wa dondoo kutoka Yeremia ukiruhusu maana ya kiishara. Tafsiri haipaswi kuamua maana hiyo kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kinabii lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi wa dondoo umehifadhiwa, na sentensi haijaongeza ufafanuzi wa kiitikadi usiomo katika Kigiriki.
