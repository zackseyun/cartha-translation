id: MAT.2.22
reference: Matthew 2:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: sw
  text: Lakini aliposikia kwamba Arkelao alikuwa akitawala Uyahudi badala ya baba yake Herode, aliogopa kwenda huko. Baada ya kuonywa[a] katika ndoto, aliondoka akaenda katika maeneo ya Galilaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki mara nyingi humaanisha kupewa onyo au maagizo kutoka kwa Mungu, ingawa anayetoa onyo hatajwi wazi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha jambo lililotangulia tendo kuu; “aliposikia” ni Kiswahili cha kawaida na huhifadhi uhusiano wa wakati.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko lenye ukinzani katika simulizi, kutoka nia ya kwenda Uyahudi hadi kizuizi kipya.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: alikuwa akitawala Uyahudi
  rationale: Muundo huu unaeleza utawala juu ya eneo. “Alikuwa akitawala” ni wa asili katika usemi taarifa na hudokeza utawala wa kifalme katika muktadha.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: badala ya baba yake Herode
  rationale: ἀντί hapa huonyesha kuchukua nafasi ya mtu mwingine; tafsiri hii ni wazi bila kuongeza wazo la urithi ambalo halijasemwa moja kwa moja.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: aliogopa kwenda huko
  rationale: Hutoa kwa lugha ya kawaida hofu yake kuhusu kwenda mahali palipotajwa.
- source_word: χρηματισθεὶς
  choice: Baada ya kuonywa
  rationale: Huhifadhi hali ya kutendwa na kutomwaja wazi aliyetoa onyo, kama ilivyo katika Kigiriki; katika Mathayo kitenzi hiki mara nyingi hudokeza ujumbe wa Mungu.
- source_word: κατ’ ὄναρ
  choice: katika ndoto
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kupokea onyo wakati wa ndoto.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: Katika muktadha huu ni kuondoka kwa makusudi kwa sababu ya hatari. “Akaondoka” ni ya asili katika simulizi na inaunganisha tendo hili na onyo lililotangulia.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: kwenda sehemu za Galilaya
  rationale: “Sehemu za” huhifadhi wingi wa μέρη na kueleza kuelekea eneo pana badala ya sehemu moja mahsusi.
theological_decisions:
- issue: Iwapo chanzo cha onyo katika χρηματισθείς kitajwe wazi kuwa Mungu
  choice: Maandishi yanasema “Baada ya kuonywa” bila kuongeza “na Mungu.”
  alternative: Baada ya kuonywa na Mungu katika ndoto
  rationale: Muktadha wa Mathayo hudokeza onyo la Mungu, lakini mtendaji hajaelezwa wazi katika sentensi ya Kigiriki. Kutomtaja huhifadhi hali hiyo bila kuficha dokezo lake, ambalo linafafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa “aliposikia … aliogopa … akaondoka” ni wa kawaida katika simulizi. Jina “Arkelao” linafuata umbo linalotumika sana katika Biblia za Kiswahili, na “Uyahudi” limetumiwa kwa eneo la Yudea/Judea.
