  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: sw
  text: Walipoiona ile nyota, walifurahi kwa furaha kubwa mno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kwa tafsiri ya karibu kabisa ni, “walifurahi furaha kubwa mno,” usemi wenye mkazo mkubwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Walipoiona
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tukio lililotangulia tendo kuu; muundo wa “walipo-” ni wa asili katika Kiswahili na huhifadhi uhusiano wa wakati.
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno tofauti)
  rationale: Hiki ni kiunganishi chepesi cha kuendeleza simulizi. Katika Kiswahili, uhusiano huo tayari unaeleweka kwa muundo wa sentensi, na kuongeza “na” hapa kungefanya usemi usiwe wa asili.
- source_word: τὸν ἀστέρα
  choice: ile nyota
  rationale: “Nyota” ndiyo maana ya moja kwa moja ya ἀστήρ; “ile” inaonyesha nyota maalumu iliyokwisha tajwa katika muktadha.
- source_word: ἐχάρησαν
  choice: walifurahi
  rationale: Ingawa umbo la Kigiriki ni la kati/tendwa kwa sura, maana yake hapa ni tendaji. “Walifurahi” ni Kiswahili cha kawaida, chenye hadhi, na huhifadhi nguvu ya kitenzi.
- source_word: χαρὰν μεγάλην
  choice: kwa furaha kubwa
  rationale: Huu ni mtindo wa Kigiriki wa kutumia nomino yenye mzizi mmoja na kitenzi ili kusisitiza. Kirai hiki kinahifadhi urudiaji wa “furahi/furaha” na uzito wa usemi.
- source_word: σφόδρα
  choice: mno
  rationale: Neno hili linaongeza mkazo mkubwa kwa usemi mzima. “Mno” ni la asili, lenye hadhi, na lina nguvu kuliko “sana” katika muktadha huu.
theological_decisions: []
