source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: sw
  text: Baada ya kuwatuma Bethlehemu, aliwaambia, “Nendeni mkamtafute kwa makini mtoto. Mtakapompata, nileteeni habari, ili mimi pia nije nimsujudie[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimwabudu” au “niiname mbele yake kwa heshima.” Kitenzi cha Kigiriki kinaweza kumaanisha kuabudu au kusujudu kwa heshima mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: akawatuma
  rationale: Kirai cha aoristi kinatangulia kitenzi kikuu na huonyesha tendo la kutuma lililohusiana moja kwa moja na kusema; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: Πορευθέντες
  choice: Nendeni
  rationale: Kirai hiki kina nguvu ya amri pamoja na ἐξετάσατε; “Nendeni mkamtafute” huwasilisha kwa Kiswahili cha kawaida amri ya kwenda na kutafuta.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: mkamtafute kwa uangalifu
  rationale: Mchanganyiko huu una maana ya kutafuta au kuchunguza kwa makini na kwa usahihi; tafsiri hii inaeleweka vizuri katika muktadha wa kumtafuta mtoto.
- source_word: περὶ τοῦ παιδίου
  choice: huyo mtoto
  rationale: Baada ya kitenzi cha kutafuta, περί huonyesha anayehusika katika uchunguzi; Kiswahili cha asili humweka mtoto kama yambwa wa “kumtafuta.” “Huyo” humrejelea mtoto aliyekwisha tajwa bila kuongeza maana ya neno la Kigiriki.
- source_word: παιδίου
  choice: mtoto
  rationale: παιδίον humaanisha mtoto; “mtoto” ni sahihi, ya kawaida, na hailazimishi umri mahususi zaidi ya chanzo.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Mtakapompata
  rationale: Muundo huu unaonyesha tukio linalotarajiwa lakini lenye kutegemea kupatikana kwake; “mtakapompata” ni wa kawaida na huhifadhi hali hiyo bila kudai uhakika kamili.
- source_word: ἀπαγγείλατέ μοι
  choice: nileteeni habari
  rationale: ἀπαγγέλλω ina wazo la kurudisha taarifa; “nileteeni habari” huhifadhi vizuri zaidi maana ya kutoa taarifa baada ya utafutaji.
- source_word: ὅπως
  choice: ili
  rationale: ὅπως huanzisha kusudi; “ili” ni kiunganishi cha kawaida na sahihi cha kusudi katika Kiswahili.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Muungano huu unasisitiza kwamba Herode anadai kuwa na nia sawa nao; “mimi pia” huhifadhi msisitizo huo.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: nije nimsujudie
  rationale: Kirai shirikishi pamoja na kitenzi tegemezi huwasilishwa kiasili kama matendo yanayofuatana. “Kumsujudia” huhifadhi uwezekano wa ibada au heshima ya kifalme bila kuamua kimya kimya kati ya maana hizo.
theological_decisions:
- issue: Maana ya προσκυνήσω αὐτῷ kuhusu mtoto Yesu
  choice: nimsujudie
  alternative: nije nimwabudu / nije niiname mbele yake kumpa heshima
  rationale: προσκυνέω inaweza kumaanisha kuabudu au kusujudu mbele ya mfalme kwa heshima. “Nimsujudie” huhifadhi kwa matini kuu tendo la kuinama kwa heshima na pia uwezekano wa maana ya ibada; tanbihi inaweka wazi upana huo wa kileksika bila kutatua mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nendeni mkamtafute” na “nileteeni habari” ni miundo ya kawaida kwa wasomaji wengi; “nimsujudie” husaidia kuhifadhi utata halisi wa προσκυνέω. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
