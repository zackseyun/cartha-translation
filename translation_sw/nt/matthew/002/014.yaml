  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: sw
  text: Basi akaamka, akamchukua mtoto na mama yake usiku, akaondoka kwenda Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Basi
  rationale: Ni kiunganishi chepesi kinachoendeleza simulizi na kuonyesha kuwa Yosefu alitenda kulingana na agizo alilopewa.
- source_word: ἐγερθεὶς
  choice: akaamka
  rationale: Katika muktadha wa ndoto, kitenzi hiki kinaonyesha Yosefu aliamka na kuanza kutenda mara moja; “akaamka” ni Kiswahili cha kawaida na cha asili.
- source_word: παρέλαβε
  choice: akamchukua
  rationale: Hapa παραλαμβάνω humaanisha kumchukua mtu pamoja nawe. Kiambishi cha yambwa “-m-” kinarejelea mtoto, huku mama yake akitajwa kama aliyechukuliwa pamoja naye.
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: Hili ndilo neno la kawaida na lisilo na nyongeza kwa παιδίον katika muktadha huu.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mama yake
  rationale: Kiwakilishi αὐτοῦ kinarejelea mtoto. “Mama yake” huhifadhi muundo huo kwa njia ya kawaida katika Kiswahili.
- source_word: νυκτὸς
  choice: usiku
  rationale: Hii ni genitivi ya wakati inayoonyesha kuwa hatua hiyo ilifanyika wakati wa usiku; “usiku” ni wazi na ya asili.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: ἀναχωρέω hapa ina maana ya kuondoka kwenda mahali pengine. “Akaondoka” huhifadhi mwendo wa simulizi bila kuongeza maelezo yasiyotajwa wazi.
- source_word: εἰς Αἴγυπτον
  choice: kwenda Misri
  rationale: εἰς huonyesha mwendo kuelekea mahali palipokusudiwa. “Kwenda Misri” ni muundo wa kawaida wa Kiswahili baada ya “akaondoka.”
