  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: sw
  text: Basi, akaamka, akamchukua mtoto na mama yake, akaingia katika nchi ya Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi bila kuonyesha upinzani mkubwa; “Basi” ni cha kawaida na chenye mtiririko wa asili katika Kiswahili.
- source_word: ἐγερθεὶς
  choice: akaondoka
  rationale: Katika muktadha huu kitenzi kina maana ya kuinuka na kuanza kutenda. “Akaondoka” kinaunganisha kwa kawaida kuinuka kwake na safari inayofuata bila kutumia muundo mzito wa kirai tegemezi.
- source_word: παρέλαβε
  choice: akamchukua ... pamoja na
  rationale: παραλαμβάνω hapa ni kumchukua mtu aende pamoja naye. Muundo huu wa Kiswahili unaonyesha wazi kwamba mtoto na mama yake waliandamana naye.
- source_word: τὸ παιδίον
  choice: mtoto
  rationale: παιδίον humaanisha mtoto; hakuna ulazima wa kuongeza umri maalumu ambao haujaelezwa katika Kigiriki.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mama yake
  rationale: Kiwakilishi αὐτοῦ kwa kawaida kinamrejelea mtoto. “Mama yake” ni usemi mfupi na wa asili wa Kiswahili.
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi hiki humaanisha kuingia au kwenda ndani ya eneo fulani. “Akaingia” huhifadhi maana na mfuatano wa simulizi.
- source_word: εἰς γῆν Ἰσραήλ
  choice: katika nchi ya Israeli
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya eneo la kijiografia na kitaifa ya γῆ Ἰσραήλ.
