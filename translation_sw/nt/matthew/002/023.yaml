  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: sw
  text: 'Akaja akaishi katika mji ulioitwa Nazareti[a], ili litimie lile lililonenwa kupitia kwa manabii: “Ataitwa Mnazareti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mnazorayo.” Chanzo halisi cha kinabii cha maneno “Ataitwa Mnazareti” kinajadiliwa; huenda Mathayo anatoa muhtasari wa mada zinazopatikana kwa manabii badala ya kunukuu kifungu kimoja mahsusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Akaja
  rationale: Kirai tegemezi cha aoristi kinatangulia kitenzi kikuu na kwa Kiswahili cha kawaida kinaweza kutolewa kwa mfululizo wa vitenzi vya ka-, kikihifadhi mpangilio wa matendo.
- source_word: κατῴκησεν
  choice: akakaa
  rationale: Kitenzi hiki humaanisha kuishi au kufanya makao mahali; “akakaa” ni cha kawaida na hakiongezi wazo la kudumu kuliko lililomo katika Kigiriki.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: katika mji ulioitwa Nazareti
  rationale: Pamoja na kitenzi cha kufanya makao, εἰς hutolewa kwa kawaida kama “katika”; “mji” hufuata πόλις, na “ulioitwa” huhifadhi maana ya λεγομένην.
- source_word: ὅπως πληρωθῇ
  choice: ili litimie
  rationale: Huhifadhi muundo wa kusudi/matokeo wa Mathayo na kauli tendwa ya πληρωθῇ kwa Kiswahili cha asili.
- source_word: τὸ ῥηθὲν
  choice: neno lililosemwa
  rationale: Hutoa kwa uwazi usemi wa Mathayo kuhusu yaliyosemwa, bila kulazimisha kwamba ni dondoo moja mahsusi.
- source_word: διὰ τῶν προφητῶν
  choice: kupitia kwa manabii
  rationale: Huhifadhi maana ya wakala au njia iliyo katika διά pamoja na wingi wa “manabii.”
- source_word: Ναζωραῖος
  choice: Mnazareti
  rationale: Ni jina la Kiswahili linaloeleweka la mtu anayehusishwa na Nazareti; halichanganywi na “Mnadhiri,” ambalo lingedokeza nadhiri tofauti.
- source_word: κληθήσεται
  choice: Ataitwa
  rationale: Huhifadhi wakati ujao na kauli tendwa ya καλέω kwa mtindo wa kawaida wa kinabii.
theological_decisions:
- issue: Asili ya utimilifu wa kinabii bila dondoo moja kamili katika Agano la Kale
  choice: Kauli imetafsiriwa kama ushuhuda wa manabii kwa wingi bila kutaja kifungu kimoja mahsusi.
  alternative: Kuifanya kuwa rejeo la moja kwa moja kwa Isaya 11:1 au muhtasari mahsusi wa kudharauliwa kwa Masihi.
  rationale: Kigiriki kinasema wazi “manabii” kwa wingi. Tafsiri inapaswa kuhifadhi usemi huo na kutoamua kwa uhakika chanzo ambacho Mathayo hakitaji.
- issue: Maana ya Ναζωραῖος
  choice: Mnazareti
  alternative: Mnazorayo; Mnadhiri
  rationale: Katika muktadha huu neno linahusishwa na Nazareti. “Mnadhiri” limekataliwa kwa sababu humaanisha mtu mwenye nadhiri ya Unadhiri, jambo lisilosemwa na neno hili la Kigiriki; umbo la karibu zaidi “Mnazorayo” limewekwa katika tanbihi ili kuhifadhi mjadala wa kimsamiati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo “Akaja akakaa” ni wa asili na huhifadhi mpangilio wa Kigiriki. Tanbihi inaeleza utofauti wa kimsamiati na kutokuwa na uhakika kuhusu chanzo cha kinabii bila kuingiza msimamo wa kimadhehebu.
