id: MAT.2.5
reference: Matthew 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: sw
  text: Nao wakamwambia, “Katika Bethlehemu ya Yudea, kwa maana hivi ndivyo ilivyoandikwa[a] kupitia nabii:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imeandikwa.” Kigiriki kina wakati timilifu wa kutendwa, ambao hutumiwa kwa kawaida katika kutanguliza nukuu ya Maandiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Kiwakilishi hiki kinawarejelea wakuu wa makuhani na waandishi wa sheria waliotajwa katika mstari uliotangulia; “nao” huendeleza simulizi kwa kiunganishi chepesi bila kusisitiza upinzani.
- source_word: εἶπαν αὐτῷ
  choice: wakamwambia
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili maana ya kusema jambo kwa mtu, huku umbo la mfululizo “waka-” likiunganisha tendo hili na simulizi lililotangulia.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Katika Bethlehemu ya Yudea
  rationale: “Katika” huonyesha mahali, na “ya Yudea” hutambulisha ni Bethlehemu ipi inayokusudiwa. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: οὕτως γὰρ
  choice: kwa maana hivi ndivyo
  rationale: “Kwa maana” huanzisha sababu ya jibu lao, na “hivi ndivyo” huelekeza mbele kwenye maneno ya unabii yanayofuata.
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Huhifadhi hali ya kutendwa na maana ya maandishi yaliyowekwa na yanayoendelea kuwa na mamlaka, huku ikisikika kwa kawaida katika utangulizi wa nukuu ya Maandiko.
- source_word: διὰ τοῦ προφήτου
  choice: kupitia nabii
  rationale: “Kupitia” huonyesha nabii kuwa njia au mpatanishi wa ujumbe, sawasawa na διά pamoja na hali ya umilikaji, bila kumtaja moja kwa moja chanzo cha mwisho.
theological_decisions:
- issue: Namna ya kueleza upatanishi wa nabii
  choice: kupitia nabii
  alternative: na nabii
  rationale: “Kupitia nabii” huhifadhi dhana ya ujumbe kuwasilishwa kwa njia ya nabii badala ya kumfanya nabii aonekane tu kuwa chanzo chake; pia haiongezi maelezo yasiyosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imedumisha mtiririko wa nukuu unaoendelea hadi mstari unaofuata; koloni huonyesha kuwa maneno ya nabii yatafuata.
