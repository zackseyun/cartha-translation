id: MAT.2.1
reference: Matthew 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: sw
  text: Yesu alipozaliwa Bethlehemu ya Yudea katika siku za Mfalme Herode, tazama, watu wenye hekima[a] kutoka mashariki walifika Yerusalemu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mamajusi.” Neno la Kigiriki linamaanisha watu wasomi kutoka mashariki, ambao huenda walihusishwa na unajimu au hekima ya ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Baada ya Yesu kuzaliwa
  rationale: Muundo huu wa genitivi kamili huweka mazingira ya wakati yaliyotangulia tendo kuu. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha kwamba kuwasili kulifuata kuzaliwa kwa Yesu; δέ halihitaji neno tofauti hapa.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Bethlehemu ya Yudea
  rationale: Majina ya mahali yametoholewa kwa umbo linalotumika katika Kiswahili, na kirai ‘ya Yudea’ kinaitofautisha Bethlehemu hii na maeneo mengine yenye jina hilo.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: katika siku za Mfalme Herode
  rationale: Huhifadhi nahau ya kihistoria ya Kigiriki kwa lugha ya kibiblia iliyo wazi na yenye hadhi, huku cheo cha Herode kikionyeshwa kwa njia ya kawaida ya Kiswahili.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni kiashiria cha kisimulizi kinachovuta uangalifu wa msomaji kwa tukio linalofuata; ‘tazama’ huhifadhi msisitizo huo bila kuufanya kuwa maana ya ‘ghafla.’
- source_word: μάγοι
  choice: watu wenye hekima
  rationale: Ni tafsiri inayoeleweka kwa urahisi na haiongezi mapokeo ya baadaye kwamba walikuwa wafalme au kwamba walikuwa watatu. Neno la kitaalamu ‘mamajusi’ na uhusiano wao unaowezekana na unajimu au hekima ya kifalme vinaelezwa katika tanbihi.
- source_word: ἀπὸ ἀνατολῶν
  choice: kutoka mashariki
  rationale: Ingawa umbo la Kigiriki ni la wingi, kirai hiki cha Kiswahili kwa kawaida hutaja maeneo ya upande wa mashariki kwa maana ya kijumla.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: walifika Yerusalemu
  rationale: Kitenzi kinaonyesha kuja na kufika mahali, na Kiswahili hutumia kwa kawaida ‘walifika Yerusalemu’ bila kihusishi cha ziada.
theological_decisions:
- issue: Kutafsiri μάγοι bila kuingiza mapokeo ya baadaye
  choice: watu wenye hekima
  alternative: mamajusi
  rationale: Neno la Kigiriki linataja watu wasomi kutoka mashariki, huenda waliohusishwa na unajimu au hekima ya ikulu. Tafsiri kuu inaeleza hadhi yao kwa lugha rahisi bila kudai kwamba walikuwa wafalme, wachawi, au idadi fulani; tanbihi inahifadhi istilahi ya karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘katika siku za’ na kiashiria ‘tazama’ huhifadhi ladha ya kisimulizi cha Biblia bila kuwa cha kizamani. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachotafsiri μάγοι.
