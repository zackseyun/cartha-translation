  text: And after laying his hands on them[a], he went on from there.
translation:
  language: sw
  text: Naye, baada ya kuwawekea mikono, akaondoka mahali pale.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi na kumrejelea Yesu kwa njia ya kawaida katika Kiswahili; hakiongezi hitimisho la kiufafanuzi.
- source_word: ἐπιθεὶς
  choice: baada ya kuwawekea
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo lililotangulia kitenzi kikuu. Muundo huu wa Kiswahili unaweka wazi mfuatano huo kwa lugha ya kawaida.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: mikono
  rationale: Katika muundo 'kuwawekea mikono,' kiambishi -wa- kinawakilisha αὐτοῖς, na 'mikono' huhifadhi tendo halisi. Kiswahili hakihitaji kuongeza 'yake' kwa kuwa mtendaji anaeleweka katika muktadha.
- source_word: ἐπορεύθη
  choice: akaondoka
  rationale: Katika muktadha huu πορεύομαι inaeleza kuondoka au kwenda kutoka mahali hapo. 'Akaondoka' ni ya asili na inaunganisha tendo hili na lililotangulia.
- source_word: ἐκεῖθεν
  choice: mahali pale
  rationale: Hutoa kwa kawaida maana ya 'kutoka hapo/mahali pale'; pamoja na 'akaondoka,' chanzo cha mwendo kinaeleweka bila kurudia kihusishi.
theological_decisions:
- issue: Asili ya tendo la Yesu la kuwawekea mikono
  choice: Tendo halisi la kuwawekea mikono limehifadhiwa bila kulibadilisha kuwa 'kuwabariki.'
  alternative: Kusema moja kwa moja kwamba aliwabariki.
  rationale: Kigiriki kinataja wazi tendo la kuwawekea mikono. Ingawa muktadha unaashiria baraka, tafsiri haipaswi kuingiza katika mstari matokeo yanayodokezwa wala lugha ya kisakramenti au ya kuwekwa wakfu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi 'Naye ... akaondoka' ni wa kawaida katika usimulizi wa Biblia bila kuwa wa kizamani.
