base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: sw
  text: Kijana akamwambia, “Haya yote nimeyashika[a]. Ni nini bado ninachokosa?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimeyazingatia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Bado ninapungukiwa na nini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, Kiswahili cha masimulizi kwa kawaida hutumia muundo wa mfululizo wa matukio, ‘akamwambia,’ bila kubadili maana.
- source_word: ὁ νεανίσκος
  choice: Kijana
  rationale: νεανίσκος humaanisha kijana au mwanamume kijana; tafsiri hii haiingizi wazo la kuwa mtawala, ambalo halipo katika mstari huu.
- source_word: Πάντα ταῦτα
  choice: Haya yote
  rationale: Kirai hiki kinarejelea amri zilizotajwa hapo awali; ‘Haya yote’ ni kifupi, wazi, na cha kawaida katika Kiswahili.
- source_word: ἐφύλαξα
  choice: nimeyashika
  rationale: φυλάσσω hapa humaanisha kushika au kuzingatia amri. Wakati timilifu wa Kiswahili unaonyesha matendo ya zamani yenye umuhimu kwa hali ya sasa.
- source_word: τί ἔτι ὑστερῶ
  choice: Bado ninapungukiwa na nini?
  rationale: ὑστερέω inaweza kumaanisha kupungukiwa, kukosa, au kutofikia kiwango fulani. Usemi huu unahifadhi swali kuhusu upungufu uliobaki bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Jinsi kijana anavyojitathmini kuhusu kutii amri
  choice: Kauli yake kwamba ameshika amri imetolewa moja kwa moja bila tafsiri kuithibitisha wala kuonyesha kejeli.
  alternative: Kuashiria kwamba madai yake ni ya kweli, yamekosewa, au yametiwa chumvi.
  rationale: Kigiriki kinawasilisha madai ya kijana bila hukumu ya moja kwa moja. Tafsiri inaacha mvutano huo wa kiteolojia utatuliwe na muktadha mpana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akamwambia’ ni mtindo wa kawaida wa masimulizi; ‘nimeyashika’ inadumisha lugha inayofaa kwa amri huku tanbihi ikitoa mbadala wa kawaida zaidi, ‘nimeyazingatia.’
