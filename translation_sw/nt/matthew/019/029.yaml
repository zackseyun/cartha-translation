id: MAT.19.29
reference: Matthew 19:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: sw
  text: Na kila mtu ambaye ameacha nyumba, au ndugu wa kiume, au dada, au baba, au mama, au mke, au watoto, au mashamba kwa ajili ya jina langu, atapokea mara mia na ataurithi uzima wa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: kila mtu ambaye
  rationale: Muundo huu unaonyesha kwa njia ya kawaida ya Kiswahili kila mtu anayekidhi sharti linalofuata, huku ukihifadhi upeo wa jumla wa Kigiriki.
- source_word: ἀφῆκεν
  choice: ameacha
  rationale: Wakati timilifu wa Kiswahili unaeleza tendo lililokamilika lenye umuhimu unaoendelea. Neno hili haliongezi wazo la kulaumiwa linaloweza kujitokeza katika tafsiri kama ‘ametelekeza.’
- source_word: οἰκίας
  choice: nyumba
  rationale: ‘Nyumba’ linaweza kuwa umoja au wingi kulingana na muktadha; hapa orodha na kitenzi vinaonyesha maana ya wingi, na neno linahifadhi hali halisi ya mali.
- source_word: ἀδελφοὺς
  choice: ndugu wa kiume
  rationale: Kwa kuwa dada wametajwa kando, tafsiri hii inaweka wazi kwamba hapa neno la Kigiriki linarejelea ndugu wa kiume.
- source_word: ἀδελφὰς
  choice: dada
  rationale: Ni neno la kawaida na la sasa la Kiswahili kwa ndugu wa kike, waliotajwa tofauti na ndugu wa kiume.
- source_word: πατέρα
  choice: baba
  rationale: Neno la kawaida la uhusiano wa kifamilia, likihifadhi umoja wa chanzo.
- source_word: μητέρα
  choice: mama
  rationale: Neno la kawaida la uhusiano wa kifamilia, likihifadhi umoja wa chanzo.
- source_word: γυναῖκα
  choice: mke
  rationale: Katika orodha ya mahusiano ya nyumbani, maana inayofaa ni ‘mke,’ si ‘mwanamke’ kwa ujumla.
- source_word: τέκνα
  choice: watoto
  rationale: Tafsiri ya kawaida ya watoto au wazao katika orodha ya familia.
- source_word: ἀγρούς
  choice: mashamba
  rationale: Neno hili linaonyesha mashamba au ardhi ya kilimo na kuhifadhi upande wa mali na uchumi wa orodha.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: kwa ajili ya jina langu
  rationale: Tafsiri hii inahifadhi nahau ya chanzo kuhusu ‘jina,’ inayohusisha mtu, mamlaka, na utambulisho wa Yesu, bila kuifupisha kuwa ‘kwa ajili yangu.’
- source_word: ἑκατονταπλασίονα
  choice: mara mia
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza kiasi kilichozidishwa kwa mia, bila kutumia tamathali isiyo ya kawaida.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: ataurithi uzima wa milele
  rationale: Muundo huu unahifadhi lugha ya urithi na maana ya uzima wa milele bila kuifafanua kupita chanzo.
theological_decisions:
- issue: Maana ya γυνή katika orodha ya yaliyoachwa kwa ajili ya ufuasi
  choice: mke
  alternative: mwanamke
  rationale: Muktadha unataja mahusiano ya familia na mali. ‘Mke’ huhifadhi maana ya uhusiano wa ndoa bila kudokeza kuachwa kwa wanawake kwa ujumla.
- issue: Kuhifadhi nahau ἕνεκεν τοῦ ὀνόματός μου
  choice: kwa ajili ya jina langu
  alternative: kwa ajili yangu
  rationale: Kutaja ‘jina langu’ huhifadhi uzito wa lugha ya chanzo kuhusu utii kwa mtu, mamlaka, na utambulisho wa Yesu, bila kuamua zaidi ya maandishi.
- issue: Nguvu ya ahadi katika ἑκατονταπλασίονα
  choice: mara mia
  alternative: mara mia zaidi
  rationale: ‘Mara mia’ huonyesha kuzidishwa kwa mia. Kuepuka ‘zaidi’ kunazuia uwezekano wa kueleweka kimahesabu kuwa kiasi cha awali pamoja na mara mia nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Virai vya orodha vimeunganishwa kwa ‘au’ ili kufuata muundo wa chanzo na kuonyesha kwamba kila aina ya uhusiano au mali inatajwa kivyake.
