  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: sw
  text: Akawaambia, “Kwa sababu ya ugumu wa mioyo yenu[a], Musa aliwaruhusu kuwapa talaka wake zenu[b], lakini tangu mwanzo haikuwa hivyo.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa mioyo yenu ilikuwa migumu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuwaacha wake zenu”; katika muktadha huu maana yake ni kuwapa talaka.
    reason: lexical_alternative
  - marker: c
    text: Yaani, ruhusa hiyo haikuwakilisha hali ya mwanzo tangu uumbaji.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Akawaambia
  rationale: Ingawa λέγει ni wakati uliopo wa kihistoria, ‘akawaambia’ ni simulizi la kawaida na la asili katika Kiswahili, huku likidumisha maana ya tendo la kusema kwao.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Kwa sababu ya ugumu wa mioyo yenu
  rationale: Kirai hiki kinaonyesha sababu au msingi wa ruhusa hiyo. ‘Ugumu wa mioyo’ huhifadhi taswira ya kibiblia bila kuifafanua kupita kiasi.
- source_word: ἐπέτρεψεν
  choice: aliwaruhusu
  rationale: Kitenzi hiki humaanisha kutoa ruhusa, si kutoa amri wala kuidhinisha jambo kuwa bora.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: kuwapa talaka wake zenu
  rationale: Katika muktadha wa ndoa, ἀπολῦσαι humaanisha kuvunja ndoa kwa talaka, na γυναῖκας humaanisha ‘wake,’ si wanawake kwa ujumla.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Usemi huu ni wa kawaida katika Kiswahili na unadumisha dokezo la mwanzo wa uumbaji katika muktadha.
- source_word: οὐ γέγονεν οὕτως
  choice: haikuwa hivyo
  rationale: Kauli hii huonyesha kwamba hali hiyo haikuwapo katika mpangilio wa mwanzo. Tafsiri hii ni fupi, ya asili, na haiingizi ufafanuzi usiotajwa wazi katika Kigiriki.
theological_decisions:
- issue: Iwapo tendo la Musa lielezwe kama amri, kibali, au ruhusa
  choice: Musa aliwaruhusu
  alternative: Musa aliwaamuru
  rationale: ἐπέτρεψεν hueleza ruhusa au ukubali wa hali fulani, si amri. Hivyo tafsiri inadumisha tofauti kati ya ruhusa ya Musa na hali ya mwanzo inayotajwa na Yesu.
- issue: Iwapo dokezo la uumbaji lifafanuliwe wazi katika matini kuu
  choice: lakini tangu mwanzo haikuwa hivyo
  alternative: lakini tangu mwanzo huo haukuwa mpango wa Mungu
  rationale: Tafsiri iliyochaguliwa inadumisha maneno na mvutano wa kifungu cha Kigiriki bila kuongeza ufafanuzi wa kiteolojia katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Nahau ya kibiblia ‘ugumu wa mioyo’ imehifadhiwa, huku maana ya kisheria ya talaka ikiwekwa wazi.
