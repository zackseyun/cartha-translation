  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: sw
  text: “Mheshimu baba yako na mama yako,[a] na umpende jirani yako kama unavyojipenda mwenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata maumbo ya Kigiriki kwa ukaribu zaidi: “Mheshimu baba yako na mama yako, nawe utampenda jirani yako kama unavyojipenda mwenyewe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Mheshimu
  rationale: Kitenzi hiki kinatoa amri ya kuwapa wazazi heshima inayowastahili, si kuwaona tu kuwa wenye thamani moyoni. Pia kinadumisha uzito wa lugha ya Amri Kumi.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: baba yako na mama yako
  rationale: Ingawa Kigiriki kimetumia vibainishi bila viwakilishi vya umilikaji, muktadha wa amri na usemi wa kawaida wa Kiswahili huhitaji ‘yako’ kwa kila mzazi ili kuonyesha wazi anayelengwa.
- source_word: Ἀγαπήσεις
  choice: umpende
  rationale: Umbo la wakati ujao katika Kigiriki linatumika kwa nguvu ya amri katika nukuu ya Torati. Hali ya kutegemea ‘umpende’ ni ya kawaida na yenye nguvu ya amri katika Kiswahili cha sasa; umbo la moja kwa moja zaidi ‘utampenda’ limehifadhiwa katika tanbihi.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: Katika muktadha huu wa maadili, ‘jirani’ ni neno la kawaida na sahihi kwa mtu mwingine aliye katika uhusiano na mtu, wala si yule aliye karibu kimahali tu.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Huu ni usemi wa asili na ulio wazi katika Kiswahili. Unadhihirisha ulinganisho uliomo katika Kigiriki bila kubadili maana, ingawa kitenzi ‘kupenda’ kinaeleweka tu katika kifungu cha Kigiriki.
theological_decisions:
- issue: Namna ya kutafsiri maumbo ya amri katika nukuu ya maagizo
  choice: 'Kutumia maumbo yenye nguvu ya amri: ‘Mheshimu ... na umpende ...’'
  alternative: ‘Mheshimu ... nawe utampenda ...’
  rationale: Kigiriki kinaunganisha amri ya moja kwa moja (Τίμα) na kitenzi cha wakati ujao (Ἀγαπήσεις), kwa kuwa Yesu ananukuu lugha ya amri ya Torati. Kiswahili cha sasa huwasilisha nguvu ya maagizo yote mawili kwa uwazi zaidi kwa ‘Mheshimu’ na ‘umpende,’ huku tafsiri inayofuata maumbo ya Kigiriki kwa ukaribu zaidi ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mheshimu’ na ‘umpende’ huhifadhi uzito wa amri bila kutumia mtindo mkavu au wa kizamani.
