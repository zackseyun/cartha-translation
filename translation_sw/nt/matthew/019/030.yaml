  text: But many who are first will be last[a], and the last first.
translation:
  language: sw
  text: Lakini wengi walio wa kwanza watakuwa wa mwisho, na walio wa mwisho watakuwa wa kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na ufupi wa Kigiriki: “Lakini wengi wa kwanza watakuwa wa mwisho, na wa mwisho wa kwanza.” Kigiriki kina mtindo mfupi sana wa kimethali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa kundi pana lisilotajwa kwa utambulisho; “wengi” ni kifupi, cha kawaida, na hakiongezi “watu” pasipo lazima.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti ya kiasi na mjadala uliotangulia kuhusu malipo na nafasi; “Lakini” linahifadhi uhusiano huo.
- source_word: ἔσονται
  choice: watakuwa
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha wakati ujao wa kitenzi “kuwa.”
- source_word: πρῶτοι
  choice: wa kwanza
  rationale: Hapa maana ni nafasi au cheo, si lazima mfuatano wa wakati; “wa kwanza” huhifadhi upana na nguvu ya kimethali.
- source_word: ἔσχατοι
  choice: wa mwisho
  rationale: Neno hili linatofautishwa moja kwa moja na “wa kwanza” kwa habari ya nafasi au mpangilio; “wa mwisho” huhifadhi ulinganifu huo.
- source_word: πρῶτοι ἔσχατοι
  choice: walio wa kwanza watakuwa wa mwisho
  rationale: Kiswahili cha kawaida huhitaji kiunganishi cha uhusiano “walio” ili kueleza wazi prediketo iliyodokezwa na usemi mfupi wa Kigiriki.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: na walio wa mwisho watakuwa wa kwanza
  rationale: Kitenzi hakirudiwi katika Kigiriki lakini kinaeleweka kutoka kishazi cha kwanza. Kukirudia katika Kiswahili kunaleta sentensi ya asili na wazi huku kukihifadhi usawaziko wa kimethali.
theological_decisions:
- issue: Asili na upeo wa usemi wa kugeuzwa kwa nafasi
  choice: Usemi umeachwa kuwa kauli ya jumla kuhusu kugeuzwa kwa nafasi au mpangilio.
  alternative: Kuufafanua hasa kuwa kuhusu kuingia katika ufalme, malipo ya wanafunzi, au hadhi ya kijamii.
  rationale: Mstari wenyewe haufafanui upeo wake kwa namna hiyo. Tafsiri pana ya kimethali huhifadhi utata halisi na mvutano wa kiteolojia bila kuingiza hitimisho jembamba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi ufupi mashuhuri wa Kigiriki.
