  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: sw
  text: 'Ninawaambia tena: ni rahisi zaidi kwa ngamia[b] kupita katika tundu la sindano[a] kuliko kwa tajiri kuingia katika ufalme wa Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jicho la sindano.”
    reason: lexical_alternative
  - marker: b
    text: Wengine wamependekeza “kamba” badala ya “ngamia,” lakini matini ya Kigiriki hapa inasema “ngamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Ninawaambia tena
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kurudia lililo katika πάλιν na kauli ya moja kwa moja λέγω ὑμῖν; δέ ni kiunganishi hafifu kisichohitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: εὐκοπώτερόν ἐστιν
  choice: ni rahisi zaidi
  rationale: Hifadhi ulinganisho wa Kigiriki na kutambulisha wazi upande wa kwanza wa tamathali.
- source_word: κάμηλον
  choice: ngamia
  rationale: κάμηλον humaanisha ngamia katika matini hii; pendekezo la ‘kamba’ halina msingi katika usomaji uliotolewa wa SBLGNT.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: kupita katika tundu la sindano
  rationale: Kirai hiki kinamaanisha kupitia uwazi wa sindano ya kushonea; ‘tundu la sindano’ ni usemi wa Kiswahili ulio wazi na wa kawaida.
- source_word: εἰσελθεῖν
  choice: kupita / kuingia
  rationale: 'Kitenzi kilekile cha Kigiriki kimetolewa kulingana na mazingira: ‘kupita’ kwa mwendo kupitia tundu, na ‘kuingia’ kwa kuingia katika ufalme.'
- source_word: ἢ πλούσιον
  choice: kuliko tajiri
  rationale: πλούσιον humaanisha mtu tajiri. Kiswahili kinaweza kutumia nomino ‘tajiri’ bila kulazimika kuongeza ‘mwanamume,’ huku maana ya mtu mmoja ikibaki wazi.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: kuingia katika ufalme wa Mungu
  rationale: Hifadhi dhana ya kuingia na istilahi kuu ya kibiblia ‘ufalme wa Mungu’ kwa lugha ya asili na yenye hadhi.
theological_decisions:
- issue: Maana ya mfano wa ngamia na tundu la sindano
  choice: Kuhifadhi ulinganisho mkali wa ngamia halisi na tundu la sindano kama tamathali ya jambo lisilowezekana kwa uwezo wa kibinadamu.
  alternative: Kuufafanua kama lango fulani la Yerusalemu linaloitwa ‘Tundu la Sindano,’ au kubadili ‘ngamia’ kuwa ‘kamba.’
  rationale: Matini ya Kigiriki inasema ‘ngamia’ na ‘tundu la sindano,’ bila kutaja lango. Kuacha picha hiyo ikiwa kali huhifadhi mvutano wa kauli na muktadha wake bila kuilegeza au kuialegorisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Ninawaambia tena’ ni ya kawaida kuliko mpangilio mzito wa neno kwa neno. ‘Tundu la sindano’ limechaguliwa katika matini kuu kwa uelewekevu, huku ‘jicho la sindano’ likihifadhiwa kama mbadala wa karibu zaidi na nahau inayojulikana.
