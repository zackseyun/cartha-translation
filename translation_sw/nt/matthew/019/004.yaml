  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: sw
  text: Akajibu, “Je, hamjasoma[a] kwamba yule aliyeumba[b] tangu mwanzo aliwafanya mwanamume na mwanamke?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, hamkusoma…?”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, “yule aliyeumba”; pia inaweza kutafsiriwa “Muumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Akajibu
  rationale: Muundo wa Kigiriki wenye kitenzi-jina na kitenzi kamili una maana ya jibu; Kiswahili cha kawaida huutoa kwa kitenzi kimoja bila kupoteza maana.
- source_word: Οὐκ ἀνέγνωτε
  choice: Je, hamjasoma
  rationale: Kauli hii ni swali la changamoto linalorejelea Maandiko ambayo wasikilizaji walipaswa kuyajua. Wakati timilifu wa Kiswahili unaonyesha tendo la kusoma lenye umuhimu hadi sasa.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha yaliyomo katika kile walichopaswa kusoma.
- source_word: ὁ κτίσας
  choice: yule aliyeumba
  rationale: Huhifadhi umbo la Kigiriki la kishiriki chenye kibainishi bila kulifanya moja kwa moja kuwa cheo ‘Muumba.’ Hakuna kiwakilishi cha ‘wao’ baada ya κτίσας katika matini ya Kigiriki, kwa hiyo hakijaongezwa hapa.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi mwangwi wa simulizi la uumbaji katika Mwanzo na uhusiano wake wa karibu na kitendo cha kuumba.
- source_word: ἄρσεν καὶ θῆλυ
  choice: mwanamume na mwanamke
  rationale: Maneno haya yanawakilisha jozi ya kijinsia katika uumbaji na yanaeleweka kwa urahisi katika Kiswahili cha kawaida. ‘Wa kiume na wa kike’ ni ya karibu zaidi kimofolojia lakini si ya kawaida sana inapowarejelea wanadamu katika sentensi hii.
- source_word: ἐποίησεν αὐτούς
  choice: aliwafanya
  rationale: ‘Aliwafanya’ huhifadhi tofauti kati ya ποιέω na κτίζω na kiambishi ‘-wa-’ kinawakilisha αὐτούς (‘wao’). Kamilisho ‘mwanamume na mwanamke’ linaeleza jinsi alivyowafanya.
theological_decisions:
- issue: Kauli ya uumbaji kuhusiana na Mwanzo 1:27
  choice: mwanamume na mwanamke
  alternative: wa kiume na wa kike
  rationale: Tafsiri inahifadhi jozi ya uumbaji inayotajwa na Yesu bila kuifafanua kwa hitimisho la kimadhehebu au kuongeza madai yasiyosemwa katika mstari huu.
- issue: Uhusiano wa ‘tangu mwanzo’ na kishazi
  choice: yule aliyeumba tangu mwanzo
  alternative: kwamba tangu mwanzo yule aliyeumba
  rationale: Mpangilio huu unafuata kwa karibu Kigiriki na kuonyesha kwamba ‘tangu mwanzo’ inahusiana moja kwa moja na kitendo cha kuumba, huku ukiacha mvutano wa kisarufi wa kifungu bila maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Akajibu’ ni mtindo wa kawaida wa masimulizi ya Biblia; ‘Je’ huonyesha wazi swali la changamoto. Maneno ya kiufundi au ya kimadhehebu yameepukwa.
