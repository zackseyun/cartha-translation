id: MAT.19.28
reference: Matthew 19:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: sw
  text: 'Yesu akawaambia, “Kweli ninawaambia ninyi mlionifuata: wakati wa kufanywa upya[a], Mwana wa Adamu atakapoketi kwenye kiti cha enzi cha utukufu wake, ninyi pia mtaketi kwenye viti kumi na viwili vya enzi, mkiyahukumu[b] makabila kumi na mawili ya Israeli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa kuzaliwa upya,” “katika ulimwengu mpya,” au “wakati wa kuzaliwa tena.” Hapa usemi huu unaelekea kurejelea kufanywa upya kwa wakati ujao kunakohusishwa na utawala wa Mwana wa Adamu, si kuzaliwa upya kwa mtu binafsi.
    reason: lexical_alternative
  - marker: b
    text: “Kuhukumu” hapa kunaweza pia kuwa na maana ya kutawala au kuongoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Kweli
  rationale: Ni utangulizi wa kauli nzito na yenye mamlaka; “Kweli ninawaambia” ni Kiswahili cha kawaida kinachohifadhi nguvu ya usemi huo.
- source_word: ἀκολουθήσαντές μοι
  choice: ninyi mlionifuata
  rationale: Huwatambulisha wanaosemeshwa kwa tendo lao la kumfuata Yesu, huku kiwakilishi cha nafsi “-ni-” kikihifadhi “mimi” ya Kigiriki.
- source_word: παλιγγενεσίᾳ
  choice: wakati wa kufanywa upya kwa vitu vyote
  rationale: Katika muktadha huu neno linahusu kufanywa upya kwa wakati ujao kunakohusishwa na kutawazwa kwa Mwana wa Adamu, si kuzaliwa upya kwa mtu binafsi. Nyongeza “kwa vitu vyote” huweka wazi maana ya kimuktadha bila kuingiza mpango maalumu wa kimadhehebu.
- source_word: ὅταν καθίσῃ
  choice: atakapoketi
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida tukio la wakati ujao linalotambulishwa na kishazi cha wakati.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri iliyozoeleka ya cheo hiki na huhifadhi mwangwi wake wa Kidanieli na Kimasihi.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: kwenye kiti chake cha enzi chenye utukufu
  rationale: Ni usemi wa asili na wenye hadhi katika Kiswahili, unaohifadhi uhusiano kati ya kiti cha enzi na utukufu wake.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: ninyi pia mtaketi
  rationale: “Pia” huhifadhi καί, na “ninyi” huhifadhi msisitizo unaowalinganisha wanafunzi na kuketi kwa Mwana wa Adamu.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: kwenye viti kumi na viwili vya enzi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali pa kuketi, huku “viti vya enzi” ikitofautisha thronoi na viti vya kawaida.
- source_word: κρίνοντες
  choice: mkiyahukumu
  rationale: Huhifadhi maana ya msingi ya kutoa hukumu; tanbihi inaonyesha kuwa katika muktadha inaweza pia kuhusisha kutawala.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: makabila kumi na mawili ya Israeli
  rationale: Ni usemi wa kawaida na sahihi kwa migawanyo kumi na miwili ya kikabila ya Israeli.
theological_decisions:
- issue: Maana ya παλιγγενεσία katika muktadha huu
  choice: kufanywa upya kwa vitu vyote wakati ujao, kunakohusishwa na kutawazwa kwa Mwana wa Adamu
  alternative: kuzaliwa upya kwa mtu binafsi; ulimwengu mpya; enzi mpya
  rationale: Muktadha wa karibu ni wa kuketi kwa Mwana wa Adamu kwenye kiti cha enzi na wa hukumu ya wakati ujao, si wa wongofu wa mtu binafsi. Tafsiri haibainishi mfumo maalumu wa nyakati za mwisho.
- issue: Upeo wa κρίνοντες
  choice: kuhukumu
  alternative: kutawala; kuongoza
  rationale: Kitenzi kinaweza kuwa na wazo pana la mamlaka ya kutawala, lakini maana yake ya moja kwa moja hapa ni “kuhukumu.” Main text huhifadhi maana hiyo, na tanbihi huhifadhi uwezekano mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wazi ili kishazi cha wakati kimhusu Mwana wa Adamu, huku ahadi ya wanafunzi kuketi na kuhukumu ikisomeka kwa urahisi.
