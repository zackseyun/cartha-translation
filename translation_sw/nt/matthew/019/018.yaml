id: MAT.19.18
reference: Matthew 19:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: sw
  text: 'Akamwuliza, “Zipi?” Yesu akasema, “Hizi: ‘Usiue, usizini, usiibe, usitoe ushahidi wa uongo,’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Zipi?
  rationale: Kiwakilishi cha kuuliza katika wingi kinarejelea amri zilizotajwa katika muktadha; “Zipi?” ni fupi na ya kawaida katika Kiswahili.
- source_word: Τὸ
  choice: 'Hizi:'
  rationale: Kibainishi cha Kigiriki kinaanzisha orodha ya amri. Kiswahili cha kawaida huhitaji kiashiria cha wingi “Hizi” badala ya tafsiri ngumu ya neno kwa neno.
- source_word: Οὐ φονεύσεις
  choice: Usiue
  rationale: φονεύω hapa ni kuua binadamu kinyume cha sheria au maadili; katika mtindo wa amri za Biblia, “Usiue” ni usemi ulio wazi na wa kawaida.
- source_word: Οὐ μοιχεύσεις
  choice: usizini
  rationale: μοιχεύω humaanisha kufanya uzinzi, hasa kuvunja uaminifu wa ndoa; “usizini” huhifadhi maana hiyo kwa ufupi.
- source_word: Οὐ κλέψεις
  choice: usiibe
  rationale: κλέπτω ni kuiba; “usiibe” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: usitoe ushahidi wa uongo
  rationale: Kitenzi hiki kinahusu kutoa ushahidi wa uongo. Usemi huu ni wa asili zaidi katika Kiswahili kuliko muundo mzito wa jina “usishuhudie ushahidi wa uongo.”
theological_decisions:
- issue: Uhusiano wa amri hizi na swali la amri zipi
  choice: Kuhifadhi swali na orodha bila kuongeza maelezo ya kitheolojia
  alternative: Kufafanua kuwa hizi ni amri fulani kati ya Amri Kumi
  rationale: Mstari wenyewe haujaeleza mfumo au madhumuni ya Yesu katika kuchagua amri hizi; ufafanuzi huo ungeenda zaidi ya ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamwuliza” huepuka kurudia kwa namna nzito “Akamwambia,” huku ikiwakilisha tendo la kusema lililo katika swali. Nukuu za amri zimewekwa ndani ya kauli ya Yesu ili orodha isomeke kwa uwazi.
