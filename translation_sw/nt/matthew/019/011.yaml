  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: sw
  text: Lakini akawaambia, “Si wote wanaoweza kulipokea neno hili[a], bali ni wale waliopewa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kauli hii” au “fundisho hili.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki huacha kisemwacho kuwa kimepewa bila kukitaja wazi. Inaelekea kwamba Mungu ndiye mtoaji, lakini Kigiriki hakimtaji waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuwasilisha kitendo cha kusema kwa watu waliotajwa, bila kubadili maana kuwa ‘akajibu’.
- source_word: Οὐ πάντες
  choice: Si wote
  rationale: 'Inahifadhi ukanushaji wa jumla: uwezo huo haupatikani kwa kila mtu.'
- source_word: χωροῦσι
  choice: wanaoweza kulipokea
  rationale: Katika muundo huu, χωρέω ina maana ya kuwa na nafasi au uwezo wa kupokea na kukubali kauli; ‘kulipokea’ ni ya asili na haifungi maana kwenye ufahamu wa kiakili pekee.
- source_word: τὸν λόγον τοῦτον
  choice: neno hili
  rationale: ‘Neno hili’ linaendeleza maana ya λόγος kama kauli au fundisho lililotangulia, huku tanbihi ikionyesha tafsiri nyingine halali.
- source_word: ἀλλ’ οἷς
  choice: ila wale tu
  rationale: ‘Ila’ pamoja na ‘tu’ huonyesha wazi nguvu ya kizuizi katika utofautishaji huu.
- source_word: δέδοται
  choice: waliopewa uwezo huo
  rationale: Kauli tendwa ya wakati timilifu inaonyesha jambo lililotolewa na ambalo matokeo yake yanaendelea. Kuongeza ‘uwezo huo’ kunafanya sentensi iwe ya asili kwa Kiswahili na kubainisha kile kinachoelekezwa na muktadha, bila kumtaja mtoaji.
theological_decisions:
- issue: Utambulisho wa mtoaji aliyedokezwa na kauli tendwa δέδοται
  choice: Kauli tendwa imehifadhiwa bila kumtaja Mungu waziwazi.
  alternative: ila wale tu ambao Mungu amewapa uwezo huo
  rationale: Muktadha unaweza kuashiria kwamba Mungu ndiye mtoaji, lakini Kigiriki hakimtaji. Kutomtaja katika matini kuu kunahifadhi utata na mvutano wa kitheolojia wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kulipokea neno hili’ ni wazi kwa msomaji wa kawaida na pia huhifadhi upana wa maana ya χωρέω na λόγος. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
