  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: sw
  text: Ndipo Yesu akawaambia wanafunzi wake, “Kweli nawaambia[a], mtu tajiri ataingia katika ufalme wa mbinguni kwa shida[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amina, nawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ni vigumu kwa mtu tajiri kuingia katika ufalme wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ndipo
  rationale: Inaonyesha mpito na mwendelezo wa simulizi bila kuiacha kiunganishi cha Kigiriki.
- source_word: εἶπεν τοῖς μαθηταῖς αὐτοῦ
  choice: akawaambia wanafunzi wake
  rationale: Ni Kiswahili cha kawaida na fasaha kinachoonyesha kuwa Yesu alisema jambo hilo kwa wanafunzi wake; kiwakilishi cha umilikaji αὐτοῦ kimehifadhiwa kwa neno “wake.”
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Kinawasilisha uzito na uhakika wa kauli ya Yesu kwa Kiswahili cha sasa, huku “Amina” ikitolewa kama mbadala katika tanbihi.
- source_word: πλούσιος
  choice: mtu tajiri
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa mtu mmoja wa mfano. “Mtu tajiri” ni usemi wa asili wa Kiswahili na hauongezi dai lisilo wazi kuhusu jinsia ya mhusika.
- source_word: δυσκόλως
  choice: kwa shida
  rationale: Kinahifadhi maana ya namna—kuingia kwa ugumu—bila kukifanya kifungu hiki peke yake kiseme wazi kwamba kuingia ni jambo lisilowezekana.
- source_word: εἰσελεύσεται
  choice: ataingia
  rationale: Kinahifadhi wakati ujao wa kitenzi cha Kigiriki na maana ya kuingia.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida wa Mathayo katika Kiswahili; unahifadhi wazo la ufalme na kutoa wingi wa Kigiriki οὐρανῶν kwa namna ya kawaida ya Kiswahili.
theological_decisions:
- issue: Uzito wa kauli Ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  alternative: Amina, nawaambia
  rationale: “Kweli” huwasilisha uthibitisho wenye mamlaka kwa wasomaji wa sasa, lakini “Amina” ni tafsiri ya karibu zaidi kwa umbo la neno la chanzo na imehifadhiwa katika tanbihi.
- issue: Maana ya δυσκόλως kuhusu kuingia kwa tajiri
  choice: ataingia ... kwa shida
  alternative: ni vigumu kwa mtu tajiri kuingia
  rationale: Tafsiri iliyochaguliwa hudumisha muundo wa wakati ujao na haiongezi wala kupunguza mvutano wa kiteolojia wa kauli. Haiamui mapema kama ugumu huo ni karibu kutowezekana; mstari unaofuata unaendeleza hoja hiyo.
- issue: Kivumishi cha kiume cha umoja πλούσιος kilichotumiwa kama nomino
  choice: mtu tajiri
  alternative: mwanamume tajiri
  rationale: Katika muktadha huu umbo la kiume la Kigiriki linaweza kumtaja mtu mmoja wa mfano. Kiswahili “mtu tajiri” huhifadhi umoja na maana kuu bila kuongeza msisitizo wa jinsia ambao si lazima kwa hoja ya kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo “akawaambia” na usemi “kwa shida” ni wa kawaida bila kuwa wa mazungumzo mno; tanbihi zinahifadhi mbadala wa karibu zaidi wa Ἀμὴν na mpangilio mwingine halali wa δυσκόλως.
