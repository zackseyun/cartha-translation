  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: sw
  text: Wanafunzi wake wakamwambia, “Ikiwa ndivyo ilivyo kwa mwanamume na mke wake[a], haifai kuoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa jambo la mwanamume na mke wake liko hivyo.” Kifungu cha Kigiriki ni kifupi, na neno linalotafsiriwa “ilivyo” linaweza pia kumaanisha “jambo” au “mazingira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: wakamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, katika masimulizi ya Kiswahili ‘wakamwambia’ huendeleza matukio kwa njia ya kawaida na ya asili.
- source_word: οἱ μαθηταί
  choice: wanafunzi wake
  rationale: ‘Wanafunzi’ ni istilahi ya kawaida ya Injili kwa wale waliojifunza kutoka kwa Yesu na kumfuata; ‘wake’ huonyesha uhusiano unaodokezwa na muktadha.
- source_word: Εἰ οὕτως ἐστίν
  choice: Ikiwa ... ni hivyo
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi sharti na rejeo la maneno ya Yesu yaliyotangulia.
- source_word: ἡ αἰτία
  choice: hali
  rationale: Hapa αἰτία haimaanishi hasa ‘sababu,’ bali hali, jambo, au mazingira yanayohusika. ‘Hali’ ni wazi na ya kawaida huku ikiacha upana wa maana.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: ya mwanamume na mke wake
  rationale: Muktadha unahusu ndoa, kwa hiyo γυνή lina maana ya ‘mke.’ ‘Mwanamume’ huhifadhi rejeo la kiume la ἀνήρ/ἄνθρωπος katika uhusiano huu, na ‘mke wake’ ni Kiswahili cha asili kwa uhusiano wa ndoa.
- source_word: οὐ συμφέρει
  choice: haifai
  rationale: ‘Haifai’ huwasilisha kwa ufupi wazo la kutokuwa na manufaa au faida katika muktadha huu, bila kutumia lugha nzito au ya kizamani.
- source_word: γαμῆσαι
  choice: kuoa
  rationale: Kwa kuwa kauli inatazama jambo kutoka upande wa mwanamume, ‘kuoa’ ni kitenzi sahihi na cha asili zaidi kuliko ‘kufunga ndoa,’ huku kikihifadhi uelekeo wa kijinsia wa muktadha.
theological_decisions:
- issue: Lugha ya kijinsia katika τοῦ ἀνθρώπου ... τῆς γυναικός
  choice: mwanamume na mke wake
  alternative: mtu na mwenzi wake
  rationale: Muktadha wa karibu unaeleza ndoa kwa maneno ya mwanamume na mwanamke, na γυνή hapa lina maana ya mke. Tafsiri haibadili muundo huo kuwa lugha isiyoonyesha jinsia.
- issue: Nguvu ya οὐ συμφέρει kuhusu ndoa
  choice: haifai kuoa
  alternative: si jambo lenye manufaa kuoa
  rationale: Kauli ya wanafunzi inaonyesha tathmini yao ya manufaa au ufaafu wa kuoa baada ya mafundisho ya Yesu; haifanywi kuwa amri ya jumla dhidi ya ndoa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida. ‘Wakamwambia’ inafaa mtiririko wa masimulizi, na ‘haifai kuoa’ ni ya asili bila kuwa ya mazungumzo kupita kiasi.
