id: MAT.19.1
reference: Matthew 19:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: sw
  text: Ikawa Yesu alipomaliza maneno haya, aliondoka Galilaya, akafika katika eneo la Yudea ng’ambo ya Mto Yordani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wa pili wa Mto Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha masimulizi kinachohifadhi muundo wa Kigiriki bila kutumia lugha ya kale isiyo ya kawaida.
- source_word: ὅτε ἐτέλεσεν
  choice: alipomaliza
  rationale: Muundo huu unaonyesha kwamba Yesu alikamilisha mafundisho yaliyotangulia kabla ya kuondoka.
- source_word: τοὺς λόγους τούτους
  choice: maneno haya
  rationale: Inarejelea mafundisho yaliyotangulia mara moja na kuhifadhi maana pana ya λόγοι kwa Kiswahili cha kawaida.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: aliondoka Galilaya
  rationale: ‘Aliondoka’ huonyesha kuondoka mahali fulani kwa lugha ya masimulizi yenye hadhi na ya kawaida.
- source_word: ἦλθεν εἰς
  choice: akafika katika
  rationale: Huwasilisha mwendo uliofikia eneo jipya kwa Kiswahili cha asili, huku mfuatano wa ‘aka-’ ukiendeleza simulizi.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: eneo la Yudea
  rationale: Katika muktadha wa safari, ὅρια inaeleweka kama eneo au wilaya, si lazima mstari halisi wa mpaka.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Mto Yordani
  rationale: ‘Ng’ambo ya’ huhifadhi maana ya upande wa mbali au upande mwingine; kuongeza ‘Mto’ hufanya jina la kijiografia lieleweke wazi na kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya masimulizi, yenye hadhi na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, ‘ng’ambo ya Mto Yordani.’
