  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: sw
  text: Na tazama, mmoja akamjia, akasema, “Mwalimu, nifanye jambo gani jema[a] ili nipate uzima wa milele?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nifanye tendo gani jema ...?” Kirai cha Kigiriki τί ἀγαθὸν kinaweza kumaanisha “jambo jema” au, kwa kuhusishwa na “kufanya,” “tendo jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Na tazama
  rationale: Inahifadhi kiunganishi καί na mwito wa msimulizi wa kuvuta usikivu katika ἰδού, kwa lugha inayoeleweka na yenye hadhi.
- source_word: εἷς
  choice: mtu mmoja
  rationale: εἷς imetumiwa kama nomino na humaanisha mtu mmoja bila kumtambulisha zaidi. Kiswahili kinahitaji nomino hapa ili usemi uwe wa kawaida; tafsiri haiongezi maelezo ya kwamba alikuwa tajiri au kijana.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: alimjia na kusema
  rationale: Inawasilisha kitendo cha kumjia kabla ya kusema, huku ikibaki ya kawaida katika Kiswahili. Kiambishi -m- katika “alimjia” kinamrejelea Yesu kulingana na muktadha.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida ya cheo Διδάσκαλε.
- source_word: τί ἀγαθὸν
  choice: jambo gani jema
  rationale: Inahifadhi upana wa kirai cha Kigiriki, ambacho kinaweza kumaanisha jambo jema au, kwa kuhusishwa na kitenzi “kufanya,” tendo jema.
- source_word: ποιήσω
  choice: nifanye
  rationale: Huwasilisha swali la kujadiliana lililo katika hali tegemezi bila kuongeza hitimisho la kitheolojia kuhusu matendo au kustahili.
- source_word: ἵνα σχῶ
  choice: ili nipate
  rationale: “Ili” inaonyesha kusudi la ἵνα; “nipate” ni Kiswahili cha kawaida kwa kuwa na au kuupokea uzima unaoulizwa hapa.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni tafsiri iliyozoeleka, wazi, na sahihi ya kirai hiki katika muktadha huu.
theological_decisions:
- issue: Kumtambulisha msemaji kwa maelezo ambayo hayapo katika mstari huu
  choice: mtu mmoja
  alternative: kijana tajiri mmoja
  rationale: Mstari huu unasema εἷς tu. Maelezo ya baadaye au ya masimulizi sambamba hayajaingizwa mapema.
- issue: Nguvu ya swali kuhusu kutenda na uzima wa milele
  choice: nifanye jambo gani jema ili nipate uzima wa milele?
  alternative: nifanye tendo gani jema ili niustahili uzima wa milele?
  rationale: Tafsiri inahifadhi namna ya swali linalolenga tendo bila kuingiza dhana ya kustahili, wala kutatua kimya kimya mvutano wa kitheolojia uliomo katika swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Na tazama” inadumisha uhai wa kisimulizi wa chanzo; “mtu mmoja” ni ya kawaida kisarufi bila kuleta utambulisho wa baadaye; na muundo wa swali unabaki wazi bila ufafanuzi wa kimadhehebu.
