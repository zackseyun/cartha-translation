  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: sw
  text: Lakini yule kijana aliposikia kauli hiyo[a], akaondoka akiwa na huzuni[b], kwa maana alikuwa na mali nyingi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno hilo.” Hapa “kauli” inarejelea jambo ambalo Yesu ametangulia kusema.
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa amehuzunika.” Neno la Kigiriki linaeleza kwamba aliondoka katika hali ya huzuni.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa desturi, “mali kubwa.” Kigiriki kinasisitiza zaidi wingi: “mali nyingi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kirai cha wakati kinatafsiri kihusishi cha aoristi kwa Kiswahili cha kawaida, kikionyesha kwamba kuondoka kwake kulifuata kusikia.
- source_word: δὲ
  choice: Lakini
  rationale: 'Neno hili linaonyesha badiliko lenye utofauti mdogo katika simulizi: kijana anaitikia kauli ya Yesu kwa kuondoka.'
- source_word: ὁ νεανίσκος
  choice: yule kijana
  rationale: νεανίσκος humaanisha kijana; hakuna msingi katika mstari huu wa kuongeza cheo cha 'mtawala' kutoka simulizi sambamba.
- source_word: τὸν λόγον
  choice: kauli hiyo
  rationale: Katika muktadha, λόγος inarejelea jambo ambalo Yesu ametangulia kusema. 'Kauli hiyo' ni ya asili katika Kiswahili na huhifadhi umoja wa neno la Kigiriki.
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kitendo cha kuondoka, na kiambishi 'aka-' kinaendeleza mfuatano wa simulizi.
- source_word: λυπούμενος
  choice: akiwa na huzuni
  rationale: Huhifadhi maana ya kihusishi kinachoeleza hali iliyoambatana na kuondoka kwake, bila kuifanya kuwa kitendo tofauti.
- source_word: ἦν γὰρ ἔχων
  choice: kwa maana alikuwa na
  rationale: Muundo huu unaonyesha hali iliyoendelea ya kumiliki; Kiswahili cha kawaida huieleza kwa 'alikuwa na.'
- source_word: κτήματα πολλά
  choice: mali nyingi
  rationale: κτήματα ni mali au vitu vinavyomilikiwa, na πολλά inasisitiza wingi wake. 'Mali nyingi' ni fupi, wazi, na ya kawaida.
theological_decisions:
- issue: Iwapo kuongeza utambulisho wa 'mtawala' kutoka masimulizi sambamba
  choice: Kutafsiri νεανίσκος kuwa 'kijana' tu
  alternative: kijana mtawala
  rationale: Kigiriki cha Mathayo katika mstari huu humtaja tu kuwa kijana. Kuongeza 'mtawala' kungeoanisha simulizi hili na Luka badala ya kutafsiri ushahidi wa Mathayo wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na unaeleweka kwa urahisi; 'kauli hiyo' huepuka ugumu wa 'neno hilo' huku ukirejelea wazi usemi uliotangulia.
