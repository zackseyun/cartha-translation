  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: sw
  text: Kisha Petro akamjibu, “Tazama, sisi tumeacha kila kitu na tumekufuata. Basi, kutakuwa na nini kwa ajili yetu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Inaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida; hapa inaweza kumaanisha ‘ndipo’ au ‘kisha’.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῷ
  choice: akamjibu
  rationale: Nahau ya Kigiriki yenye maana ya kujibu kwa kusema; Kiswahili huieleza kwa kawaida kwa kitenzi kimoja ‘akamjibu’.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi kishazi cha kuvuta usikivu na kusisitiza alichosema Petro.
- source_word: ἀφήκαμεν πάντα
  choice: tumeacha kila kitu
  rationale: Inawasilisha tendo lililokamilika ambalo matokeo yake yanaendelea kuwa muhimu katika dai la Petro.
- source_word: ἠκολουθήσαμέν σοι
  choice: kukufuata
  rationale: Kitenzi hiki kinadumisha maana ya kuwa mfuasi wa Yesu, huku kikisomeka kwa kawaida baada ya ‘tumeacha’.
- source_word: τί ἄρα ἔσται ἡμῖν;
  choice: Basi, tutapata nini?
  rationale: Maana ya kawaida ya swali hili katika muktadha ni kile kitakachokuwa sehemu yao au watakachopokea; ‘tutapata nini?’ ni Kiswahili cha asili na hakibainishi zawadi fulani.
theological_decisions:
- issue: Je, swali la Petro litafsiriwe kama madai ya thawabu maalumu?
  choice: Basi, tutapata nini?
  alternative: Basi, kutakuwa na nini kwa ajili yetu?
  rationale: Tafsiri iliyochaguliwa inaeleza kwa kawaida maana ya τί ... ἔσται ἡμῖν bila kuongeza aina, msingi, au uhakika wa thawabu; jibu la Yesu katika mistari inayofuata linaachwa lifafanue.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio wa Kigiriki umegeuzwa kidogo ili usemi uwe wa kawaida kwa Kiswahili bila kupoteza msisitizo wa Petro.
