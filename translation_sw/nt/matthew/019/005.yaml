base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: sw
  text: akasema, “Kwa sababu hii, mwanamume atawaacha baba yake na mama yake, ataambatana na mke wake[a], na hao wawili watakuwa mwili mmoja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataunganishwa na” au “atashikamana na mke wake.” Kitenzi cha Kigiriki kinaonyesha kushikamana kwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya sababu na hitimisho inayotanguliza nukuu ya Maandiko.
- source_word: καταλείψει
  choice: atamwacha
  rationale: Wakati ujao umehifadhiwa, na kitenzi hiki kinaeleza kwa kawaida kuondoka katika uhusiano wa awali wa nyumbani bila kuongeza wazo lisilomo katika chanzo.
- source_word: ἄνθρωπος
  choice: mwanamume
  rationale: Katika muktadha huu wa ndoa, nomino ya kiume inamtaja hasa mwenzi wa kiume anayehusishwa na ‘mke wake,’ si binadamu kwa ujumla.
- source_word: κολληθήσεται
  choice: ataambatana na
  rationale: Huwasilisha kushikamana kwa karibu na kwa kudumu kwa lugha ya asili na yenye heshima; tanbihi inadokeza njia nyingine halali za kuonyesha nguvu ya kitenzi hicho.
- source_word: γυναικὶ αὐτοῦ
  choice: mke wake
  rationale: Ingawa γυνή pia inaweza kumaanisha ‘mwanamke,’ muktadha wa ndoa unahitaji maana ya ‘mke.’
- source_word: οἱ δύο
  choice: hao wawili
  rationale: Huhifadhi wazi idadi ya wawili iliyotajwa katika Kigiriki na kuwarejelea mwanamume na mke wake.
- source_word: εἰς σάρκα μίαν
  choice: watakuwa mwili mmoja
  rationale: Ni usemi unaoeleweka na wenye uzito wa kibiblia kwa muungano wa ndoa; ‘mwili’ hapa huepuka maana finyu ya nyama ya kimwili pekee.
theological_decisions:
- issue: Lugha ya kijinsia katika nukuu kuhusu ndoa
  choice: mwanamume … mke wake
  alternative: mtu … mwenzi wake
  rationale: Chanzo kina muundo mahususi wa mwanamume na mke katika nukuu ya Mwanzo; tafsiri isiyoonyesha jinsia ingefifisha jambo hilo.
- issue: Nahau ya muungano wa ndoa
  choice: hao wawili watakuwa mwili mmoja
  alternative: hao wawili watakuwa kitu kimoja
  rationale: ‘Mwili mmoja’ huhifadhi taswira ya σάρξ na mvutano wake wa kimwili na kimahusiano bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu ya Maandiko na wakati ujao umehifadhiwa bila kutumia lugha ya kizamani.
