  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: sw
  text: Wakamwambia, “Kwa nini basi Musa aliamuru kutoa hati ya talaka na kumwacha[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtaliki.” Kitenzi cha Kigiriki kinaweza kumaanisha “kumwacha aende,” na katika muktadha huu kinatumika kuhusu talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wakamwambia
  rationale: Wakati uliopo wa Kigiriki ni wakati wa kihistoria katika simulizi; wakati uliopita wa Kiswahili unatoa mtiririko wa kawaida.
- source_word: Τί οὖν
  choice: Kwa nini basi
  rationale: Katika muktadha huu swali linatoa pingamizi kwa kauli iliyotangulia, hivyo lina nguvu ya ‘kwa nini basi’.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Musa aliamuru
  rationale: Kitenzi kina maana ya kutoa amri. Tafsiri hii inadumisha namna wasemaji walivyowasilisha hoja yao bila kuingiza mapema ufafanuzi wa Yesu katika mstari unaofuata.
- source_word: δοῦναι
  choice: kumpa
  rationale: Ni kitenzi-jina kinachotegemea ‘aliamuru’; kiambishi ‘m-’ kinarejelea mke anayetajwa kwa kiwakilishi cha kike katika Kigiriki.
- source_word: βιβλίον ἀποστασίου
  choice: hati ya talaka
  rationale: Ni istilahi ya hati ya kisheria ya kuvunja ndoa; ‘hati ya talaka’ ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: na kumwacha
  rationale: Katika muktadha wa ndoa, ἀπολύω humaanisha kumwondoa au kumwacha mke, na kwa utendaji ni kumtaliki. ‘Kumwacha’ huhifadhi taswira ya msingi huku muktadha wa ‘hati ya talaka’ ukionyesha maana ya kisheria.
theological_decisions:
- issue: Iwapo maneno ya waulizaji yatafsiriwe kwa namna inayoyapatanisha mapema na marekebisho ya Yesu katika mstari unaofuata
  choice: Kudumisha ‘aliamuru’ katika matini kuu
  alternative: aliruhusu
  rationale: Kigiriki cha mstari huu kinasema wazi ‘aliamuru.’ Mstari huu unapaswa kuhifadhi namna wapinzani walivyounda hoja yao, bila kuingiza mapema jibu la Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakamwambia’ ni muundo wa kawaida wa simulizi; ‘hati ya talaka’ ni wazi kwa msomaji wa kawaida. Kiambishi cha ngeli katika ‘kumpa/kumwacha’ huwakilisha αὐτήν bila kuongeza nomino isiyokuwapo katika Kigiriki.
