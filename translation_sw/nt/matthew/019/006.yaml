id: MAT.19.6
reference: Matthew 19:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: sw
  text: Kwa hiyo, wao si wawili tena, bali ni mwili mmoja. Basi, kile ambacho Mungu amekiunganisha, mwanadamu[a] asikitenganishe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “mwanadamu” hapa lina maana ya jumla; yaani, hakuna binadamu anayepaswa kutenganisha kile ambacho Mungu amekiunganisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo ya kauli iliyotangulia kuhusu wawili kuwa mwili mmoja, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οὐκέτι εἰσὶν δύο
  choice: wao si wawili tena
  rationale: Inahifadhi wazi hali iliyobadilika na utofauti kati ya ‘wawili’ na ‘mmoja.’
- source_word: σὰρξ μία
  choice: mwili mmoja
  rationale: Hii ndiyo nahau ya kawaida ya kibiblia katika Kiswahili kwa lugha ya ndoa inayorejelea Mwanzo; ‘nyama moja’ ingekuwa ya moja kwa moja zaidi lakini si ya asili katika muktadha huu.
- source_word: ὃ οὖν
  choice: Basi, kile ambacho
  rationale: ‘Basi’ inaonyesha hitimisho, na ‘kile ambacho’ inadumisha rejeo lisiloelekezwa moja kwa moja kwa mtu fulani, kama kiwakilishi cha Kigiriki kisicho na jinsia.
- source_word: συνέζευξεν
  choice: amekiunganisha
  rationale: Kitenzi hiki kinaeleza kuunganisha pamoja; wakati timilifu wa Kiswahili unaonyesha tendo lililotimizwa lenye matokeo ya sasa.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: ‘Mwanadamu’ hapa ni nomino ya umoja yenye maana ya jumla, ikimaanisha binadamu yeyote bila kuifanya amri ihusu wanaume pekee.
- source_word: μὴ χωριζέτω
  choice: asikitenganishe
  rationale: Hali tegemezi ya kukataza inawasilisha amri kwa Kiswahili cha asili; kiambishi ‘-ki-’ kinarejelea kile Mungu alichokiunganisha.
theological_decisions:
- issue: Maana ya jumla ya ἄνθρωπος katika katazo kuhusu ndoa
  choice: mwanadamu, likifafanuliwa kuwa binadamu yeyote
  alternative: mtu yeyote; mwanamume
  rationale: Kigiriki kina nomino ya umoja yenye maana ya jumla. ‘Mwanadamu’ huhifadhi umoja na uzito wa kauli bila kudokeza kwamba katazo linawahusu wanaume pekee.
- issue: Lugha ya muungano wa ndoa inayorejelea Mwanzo katika σὰρξ μία
  choice: mwili mmoja
  alternative: nyama moja
  rationale: ‘Mwili mmoja’ ni usemi wa kibiblia unaoeleweka kwa kawaida katika Kiswahili na huhifadhi uhusiano na simulizi la Mwanzo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi hoja ya matokeo na hitimisho la maandiko ya Kigiriki.
