  verdict: approve
  source_fidelity: The draft accurately renders the result clause (ὥστε), the temporal contrast οὐκέτι ... δύο, and the Genesis-derived expression σὰρξ μία as “mwili mmoja.” It also preserves the neuter, non-personal reference of ὃ with “kile ambacho,” the completed divine joining in συνέζευξεν, and the prohibitive imperative μὴ χωριζέτω.
  naturalness: The wording is clear, grammatical Standard East African Swahili with an appropriately dignified biblical register. “Kwa hiyo” and “Basi” suitably represent the two inferential transitions, while “mwanadamu asikitenganishe” is idiomatic and correctly carries the generic prohibition.
  terminology: “Mwili mmoja” is the established and natural biblical Swahili expression for the marriage-union language. “Mwanadamu” appropriately conveys the generic force of ἄνθρωπος without restricting the command to males. The footnote appropriately explains this generic sense.
