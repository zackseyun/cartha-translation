  text: Makutano mengi yakamfuata, naye akawaponya huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: ukamfuata
  rationale: Kitenzi cha Kiswahili “kumfuata” kinatoa kwa kawaida maana ya kusafiri nyuma yake katika simulizi, bila kuongeza moja kwa moja maana maalumu ya kuwa wanafunzi.
- source_word: ὄχλοι πολλοί
  choice: umati mkubwa
  rationale: Kirai cha Kigiriki kina maana halisi ya “makutano mengi.” “Umati mkubwa” ni Kiswahili cha kawaida na fasaha kinachoonyesha idadi kubwa ya watu waliokusanyika.
- source_word: ἐθεράπευσεν αὐτοὺς
  choice: akawaponya
  rationale: “Akawaponya” linaonyesha tendo la Yesu la kuwarejeshea afya na linadumisha kiwakilishi cha wingi kinachorejelea watu katika umati.
- source_word: ἐκεῖ
  choice: huko
  rationale: “Huko” ni kielezi cha mahali kinachorejelea eneo lililotajwa katika muktadha uliotangulia na kuhifadhi maana sahili ya Kigiriki.
- source_word: καὶ ... καὶ
  choice: '... aka- ..., naye aka-'
  rationale: Mfululizo wa vitenzi vya Kiswahili kwa “-ka-” unaendeleza mtiririko wa matukio, huku “naye” likihifadhi uunganisho wa tendo la pili kwa njia ya asili.
