  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: sw
  text: Wanafunzi waliposikia hayo, walishangaa sana, wakasema, “Basi, ni nani anayeweza kuokolewa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kirai cha wakati kinaonyesha jambo lililotangulia tendo kuu. Neno “hayo” linarejelea kwa kawaida maneno ya Yesu yaliyotangulia bila kuongeza wazo jipya.
- source_word: δὲ
  choice: kiunganishi hakijawekwa wazi
  rationale: δέ hapa ni kiunganishi chepesi cha kuendeleza simulizi; muundo wa Kiswahili wenye “waliposikia” tayari unaonyesha mpito kwa ufasaha.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na lililo sahihi katika Injili kwa wale waliokuwa wakimfuata na kufundishwa na Yesu.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: walishangaa sana
  rationale: Tafsiri hii inaonyesha mshangao mkubwa uliosisitizwa na σφόδρα, kwa lugha ya sasa iliyo ya kawaida na yenye heshima.
- source_word: λέγοντες
  choice: wakasema
  rationale: Kirai shirikishi cha usemi kimetafsiriwa kwa kitenzi kinachoendeleza simulizi kwa Kiswahili cha asili.
- source_word: Τίς ἄρα
  choice: Basi, ni nani
  rationale: “Basi” linahifadhi maana ya hitimisho au swali linalotokana na kauli ya Yesu iliyotangulia, huku “ni nani” likirejelea mtu.
- source_word: δύναται
  choice: anayeweza
  rationale: Linaonyesha uwezo bila kuongeza maelezo ya aina ya uwezo unaokusudiwa.
- source_word: σωθῆναι
  choice: kuokolewa
  rationale: Muundo wa kutendwa umehifadhiwa, na “kuokolewa” hubeba maana ya wokovu inayofaa katika muktadha wa kuingia katika ufalme.
theological_decisions:
- issue: Maana ya σωθῆναι katika muktadha
  choice: kuokolewa
  alternative: kuponywa au kunusurika
  rationale: Muktadha unahusu kuingia katika ufalme na swali pana la wokovu, si kuponywa kimwili au kunusurika katika hatari ya muda. Tafsiri haielezi kwa namna ya kimadhehebu jinsi wokovu unavyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. “Walishangaa sana” ni cha kawaida kwa wasomaji wengi na kinahifadhi nguvu ya mshangao; “Basi” linaonyesha hitimisho la wanafunzi kutokana na maneno ya Yesu.
