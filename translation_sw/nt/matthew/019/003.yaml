  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: sw
  text: Mafarisayo wakamjia, wakimjaribu na kumuuliza, “Je, ni halali kwa mwanamume kumtaliki mke wake kwa sababu yoyote[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa msingi wowote” au “kwa kila sababu.” Kirai cha Kigiriki kinaonyesha swali pana la kisheria kuhusu sababu zinazoweza kuruhusu talaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: wakamjia
  rationale: Kitenzi hiki humaanisha kuja au kumkaribia mtu. “Wakamjia” ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa tendo bila kuwa kizito.
- source_word: πειράζοντες
  choice: wakimjaribu
  rationale: Neno linaweza kumaanisha kujaribu, kupima, au kushawishi. “Wakimjaribu” linahifadhi upana wa maana, huku muktadha ukionyesha nia yao ya kumtega.
- source_word: λέγοντες
  choice: na kumuuliza
  rationale: Ingawa maana ya moja kwa moja ni “wakisema,” maneno yanayofuata ni swali. “Kumuuliza” ni ya asili katika Kiswahili na haiibadili dhamira ya usemi.
- source_word: ἔξεστιν
  choice: ni halali
  rationale: Katika mjadala wa kisheria au kidini, neno hili huuliza jambo linaloruhusiwa. “Ni halali” linafaa kwa mazingira hayo.
- source_word: ἀνθρώπῳ
  choice: kwa mwanamume
  rationale: Ingawa neno linaweza kutumiwa kwa maana ya binadamu kwa ujumla, kutajwa kwa “mke wake” kunaonyesha kwamba hapa anayezungumziwa ni mwanamume aliyeoa.
- source_word: ἀπολῦσαι
  choice: kumtaliki
  rationale: Maana ya msingi ni kumwachilia au kumwondoa, lakini katika muktadha wa ndoa hili ni neno la talaka. “Kumtaliki” huwasilisha maana hiyo wazi.
- source_word: γυναῖκα αὐτοῦ
  choice: mke wake
  rationale: γυνή linaweza kumaanisha mwanamke au mke; kiwakilishi cha umilikaji na muktadha wa talaka vinahitaji “mke wake.”
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: kwa sababu yoyote
  rationale: Kirai hiki kinauliza kwa upana kuhusu msingi wowote unaodaiwa kuhalalisha talaka. Tafsiri hii ni ya kawaida na huhifadhi upana wa πᾶσαν.
theological_decisions:
- issue: Kuhifadhi swali la kisheria kuhusu sababu za talaka bila kuingiza msimamo wa kimadhehebu
  choice: Je, ni halali kwa mwanamume kumtaliki mke wake kwa sababu yoyote?
  alternative: Je, mwanamume anaruhusiwa kumwacha mke wake kwa msingi wowote?
  rationale: Aya hii inawasilisha jaribio la kisheria kwa Yesu, si jibu kamili kuhusu talaka. Tafsiri huhifadhi upana wa swali na mvutano wake bila kutanguliza hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakamjia” na “kumuuliza” hufanya simulizi lisomeke kwa kawaida; “ni halali” huhifadhi mazingira ya mjadala wa kisheria. Alama ya tanbihi imewekwa baada ya kirai kinachoelezwa.
