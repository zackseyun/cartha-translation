  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: sw
  text: Yesu akamwambia, “Ukitaka kuwa kamili[a], nenda ukauze mali zako, uwape maskini, nawe utakuwa na hazina mbinguni; kisha njoo unifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkamilifu” au “aliyekomaa.” Neno la Kigiriki linaweza kumaanisha “mkamilifu,” “kamili,” au “aliyekomaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Muundo wa kawaida wa masimulizi ya Kiswahili unaonyesha wazi msemaji na anayeambiwa bila kuongeza namna ya kusema.
- source_word: τέλειος
  choice: kamili
  rationale: Neno hili linaweza kumaanisha aliye kamili, aliyekamilika, au aliyekomaa. Katika muktadha huu, “kamili” huhifadhi wazo la utimilifu na kujitoa kwa moyo wote bila kulifanya kuwa dai lililofafanuliwa tayari kuhusu kutokuwa na dhambi.
- source_word: ὕπαγε πώλησόν σου τὰ ὑπάρχοντα
  choice: nenda ukauze mali zako
  rationale: “Nenda ukauze” ni mfuatano wa amri ulio wa asili katika Kiswahili, na “mali zako” huwakilisha vitu au milki alizonazo mtu.
- source_word: δὸς πτωχοῖς
  choice: uwape maskini
  rationale: Kitenzi kinahitaji kitu kinachotolewa kinachoeleweka kutokana na mali iliyouzwa; Kiswahili cha kawaida huruhusu “uwape maskini” bila kurudia ‘fedha’ ambayo haikutajwa wazi katika Kigiriki.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: utakuwa na hazina mbinguni
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya ahadi; “mbinguni” ni usemi wa asili wa Kiswahili ingawa nomino ya Kigiriki iko katika wingi.
- source_word: δεῦρο ἀκολούθει μοι
  choice: kisha njoo unifuate
  rationale: “Kisha” huonyesha mfuatano unaodokezwa na wito baada ya amri zilizotangulia, huku “unifuate” ikihifadhi lugha ya uanafunzi.
theological_decisions:
- issue: Maana ya τέλειος kuhusu uanafunzi
  choice: kamili
  alternative: mkamilifu; aliyekomaa
  rationale: “Kamili” huhifadhi kwa upana maana ya utimilifu au moyo usiogawanyika katika muktadha huu, bila kulazimisha maana ya ukamilifu usio na dhambi. Maana mbadala halali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri umewekwa wa moja kwa moja, na utata halali wa τέλειος umehifadhiwa kwa tanbihi.
