id: MAT.19.26
reference: Matthew 19:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: sw
  text: Lakini Yesu akawatazama na kuwaambia, “Kwa wanadamu jambo hili haliwezekani, lakini kwa Mungu mambo yote yanawezekana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: akawatazama
  rationale: Kitenzi hiki kinaonyesha Yesu aliwaelekezea macho. ‘Akawatazama’ ni Kiswahili cha kawaida kinachohifadhi tendo hilo bila kuongeza mkazo usio wa lazima kama ‘akawakazia macho.’
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaonyesha tofauti ndogo kati ya hali isiyowezekana kwa wanadamu na jibu la Yesu kuhusu uwezo wa Mungu.
- source_word: εἶπεν αὐτοῖς
  choice: kuwaambia
  rationale: Kiambishi ‘-wa-’ kinahifadhi wazi kwamba Yesu alisema maneno hayo kwao.
- source_word: παρὰ ἀνθρώποις
  choice: Kwa wanadamu
  rationale: παρά pamoja na hali ya dative huonyesha upande au mazingira ambamo jambo linawezekana. ‘Kwa wanadamu’ ni ya kawaida, jumuishi, na inarejelea watu wote bila kubadili maana ya ἀνθρώποις.
- source_word: τοῦτο
  choice: jambo hili
  rationale: ‘Jambo hili’ linaonyesha kwa kawaida jambo lililokuwa likizungumziwa katika muktadha uliotangulia.
- source_word: ἀδύνατόν ἐστιν
  choice: haliwezekani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya Kiswahili ya ‘ni jambo lisilowezekana,’ huku ikipatana na nomino ‘jambo.’
- source_word: παρὰ δὲ θεῷ
  choice: lakini kwa Mungu
  rationale: Muundo huu unadumisha ulinganifu wa kirai ‘kwa wanadamu’ na pia tofauti iliyo katika δέ.
- source_word: πάντα δυνατά
  choice: mambo yote yanawezekana
  rationale: Tafsiri hii inadumisha wingi wa πάντα na kauli pana ya δυνατά katika Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya jumla ya ἀνθρώποις
  choice: wanadamu
  alternative: watu
  rationale: Neno la Kigiriki ni la wingi na linawarejelea wanadamu kwa ujumla. ‘Wanadamu’ linaonyesha wazi tofauti ya kimakusudi kati ya uwezo wa kibinadamu na uwezo wa Mungu bila kuifanya kauli ihusu wanaume pekee.
- issue: Upeo wa πάντα δυνατά
  choice: mambo yote yanawezekana
  alternative: kila jambo linawezekana
  rationale: Tafsiri pana ya maneno ya Kigiriki imehifadhiwa bila kuongeza ufafanuzi wa kimafundisho unaoweza kuzuia au kupanua upeo wake nje ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi unahifadhi tofauti ya balagha kati ya wanadamu na Mungu.
