  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: sw
  text: Lakini Yesu akasema, “Waacheni watoto waje kwangu, wala msiwazuie kuja kwangu, kwa maana ufalme wa mbinguni ni wa watu walio kama hawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄφετε
  choice: Waacheni
  rationale: Katika muktadha huu, kitenzi hiki ni amri ya kuwaruhusu watoto, si kuwaacha kwa maana ya kuondoka. “Waacheni ... waje” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: τὰ παιδία
  choice: watoto
  rationale: Neno hili linamaanisha watoto, mara nyingi watoto wadogo, lakini hapa “watoto” linadumisha upana wa neno bila kuongeza udogo usiolazimishwa na mstari wenyewe.
- source_word: μὴ κωλύετε
  choice: wala msiwazuie
  rationale: κωλύω humaanisha kuzuia, kukwamisha, au kukataza. “Msiwazuie” linaeleza kwa kawaida amri inayohusiana na kuja kwao kwa Yesu; “wala” linaunganisha amri ya pili kwa ufasaha.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: watoto waje kwangu
  rationale: 'Muundo umeunganishwa na amri ya kwanza kwa Kiswahili cha asili: “Waacheni watoto waje kwangu.” Kiwakilishi cha Kigiriki kinaonyeshwa wazi kwa nomino “watoto” ili sentensi iwe nyepesi na isiyo na utata.'
- source_word: τῶν γὰρ τοιούτων
  choice: kwa maana ... ni wa watu walio kama hawa
  rationale: τοιούτων haielekei kwa watoto waliopo tu, bali kwa watu wa namna hiyo. “Watu walio kama hawa” huhifadhi rejeo kwa watoto hao na pia nguvu pana ya uwakilishi bila kufafanua ni sifa gani hasa inayokusudiwa.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida katika Mathayo. “Ufalme wa mbinguni” ni tafsiri iliyo wazi, ya asili, na inayotambulika katika Kiswahili sanifu.
- source_word: ἐστὶν
  choice: ni wa
  rationale: Pamoja na hali-miliki τῶν τοιούτων, “ni wa” huwasilisha kwa Kiswahili fasaha maana ya kuwa mali au sehemu ya watu wa namna hiyo, badala ya muundo mgumu wa neno kwa neno.
theological_decisions:
- issue: Iwapo Yesu anawarejelea watoto halisi pekee au pia watu wenye hali au sifa inayowakilishwa na watoto hao
  choice: “watu walio kama hawa,” ili kudumisha rejeo la moja kwa moja kwa watoto na maana pana ya watu wa namna hiyo
  alternative: “ufalme wa mbinguni ni wa watoto hawa” au “ufalme wa mbinguni ni wa walio na tabia kama ya watoto”
  rationale: Kigiriki τοιούτων kinaonyesha kundi la watu wa namna inayowakilishwa na watoto waliopo, lakini hakitaji sifa hususa inayokusudiwa. Tafsiri hii haifungi maana kwa watoto hao tu wala kuingiza ufafanuzi kama unyenyekevu au kutokuwa na hatia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ni rahisi kueleweka kwa msomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa kuwa maana pana ya τοιούτων imewasilishwa moja kwa moja katika matini bila kuondoa mvutano wake wa kimaana.
