  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: sw
  text: Lakini mimi ninawaambia kwamba mtu yeyote anayemtaliki mke wake, isipokuwa kwa sababu ya uasherati[a], na kuoa mwanamke mwingine, anazini; na yeyote anayemwoa mwanamke aliyepewa talaka anazini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isipokuwa kwa msingi wa uasherati.” Kifungu cha Kigiriki kinaweza pia kutafsiriwa kwa maana nyembamba zaidi kuwa “isipokuwa kwa uasherati kabla ya ndoa,” na wengine hukielewa kuwa “isipokuwa kwa kutokuwa mwaminifu kingono.”
    reason: lexical_alternative
  - marker: b
    text: 'Baadhi ya hati hazina maneno: “na yeyote anayemwoa mwanamke aliyepewa talaka anazini.”'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini mimi ninawaambia
  rationale: δὲ inaonyesha tofauti nyepesi na mazungumzo yaliyotangulia, na kiwakilishi cha wazi ‘mimi’ kinadumisha mkazo wa kauli ya Yesu.
- source_word: ὃς ἂν
  choice: mtu yeyote
  rationale: Muundo huu unaeleza hali ya jumla isiyomhusu mtu mmoja tu; ‘mtu yeyote’ ni Kiswahili cha kawaida na wazi.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: anayemwacha mke wake
  rationale: Katika muktadha wa ndoa, ἀπολύω humaanisha kumwacha au kumpa talaka mwenzi. ‘Anayemwacha mke wake’ ni usemi wa kawaida wa kibiblia na wa sasa, bila kuufanya kuwa tendo la kawaida la kumfukuza tu.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: isipokuwa kwa sababu ya uasherati
  rationale: Kifungu hiki kinaweka hali ya kuondoa kilichosemwa. ‘Uasherati’ hubeba maana pana ya mwenendo wa kingono usio halali bila kuifupisha kuwa uzinzi wa ndoa pekee.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: kisha akamwoa mwingine
  rationale: καί huunganisha tendo la kumwacha na ndoa inayofuata. ‘Mwingine’ humaanisha mwanamke mwingine kwa mujibu wa jinsia ya ἄλλην na kitenzi ‘kumwoa.’
- source_word: μοιχᾶται
  choice: anazini
  rationale: Hili ni neno la kawaida, lenye hadhi na lililo wazi kwa tendo la kuvunja uaminifu wa ndoa.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: na yeyote anayemwoa mwanamke aliyeachwa anazini
  rationale: Muundo wa kirai cha kisifa chenye kibainishi una nguvu ya jumla. ‘Mwanamke aliyeachwa’ hudumisha hali iliyo katika participio timilifu tendwa bila kuongeza sababu ya kuachwa.
theological_decisions:
- issue: Maana ya πορνεία katika kifungu cha hali ya pekee
  choice: uasherati
  alternative: uzinzi; ngono nje ya ndoa; kukosa uaminifu wa kingono
  rationale: πορνεία ina upeo mpana kuliko μοιχεία, yaani uzinzi wa ndoa pekee. ‘Uasherati’ huhifadhi upeo huo na kuepuka kuamua kimya kimya ubishi wa kitheolojia kuhusu hali hii ya pekee.
- issue: Kujumuishwa kwa kifungu cha mwisho καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Kimejumuishwa katika matini kuu na kuwekewa tanbihi ya tofauti ya hati
  alternative: Kukiondoa kwa kuwa hakipo katika baadhi ya hati
  rationale: SBLGNT iliyotolewa inakijumuisha huku ikionyesha tofauti ya kimatini. Kwa hiyo kinatafsiriwa, na ushahidi wa tofauti unawekwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mpangilio na mvutano wa hoja ya Kigiriki, huku ikitumia miundo inayoeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu karibu na sehemu zinazohusika.
