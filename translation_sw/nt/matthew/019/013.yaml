  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: sw
  text: Kisha watoto wakaletwa kwake ili aweke mikono yake juu yao na asali; lakini wanafunzi wakawakemea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiambishi cha yambwa “-wa-” katika “wakawakemea” kinaweza kurejelea watoto au wale waliowaleta.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Inaonyesha mfuatano wa simulizi kwa Kiswahili cha kawaida na kifupi.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: watoto wakaletwa kwake
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na maana ya kuwaleta watoto kwa Yesu bila kuongeza wazo la kuwasilishwa rasmi.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa njia ya kawaida katika Kiswahili sanifu.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: aweke mikono yake juu yao
  rationale: Huhifadhi wingi wa 'mikono' na kitendo cha kuiweka juu ya watoto.
- source_word: προσεύξηται
  choice: kusali
  rationale: Kitenzi cha Kigiriki hakitaji wazi kiambishi cha 'kwa ajili yao'; tafsiri hii haiongezi yambwa lisilotajwa.
- source_word: οἱ δὲ μαθηταὶ
  choice: lakini wanafunzi
  rationale: Neno 'lakini' linaonyesha utofauti kati ya kusudi la kuwaleta watoto na mwitikio wa wanafunzi.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: wakawakemea
  rationale: '''Kukemea'' hudumisha nguvu ya ἐπιτιμάω. Kiambishi -wa- hakibainishi ikiwa waliokemewa ni watoto au waliowaleta, hivyo utata wa Kigiriki unabaki.'
theological_decisions:
- issue: Wanaorejelewa na αὐτοῖς ya mwisho
  choice: wakawakemea
  alternative: wakawakemea watoto / wakawakemea waliowaleta
  rationale: Kiwakilishi cha Kigiriki kinaweza kurejelea watoto au wale waliowaleta. Kiswahili chenye kiambishi -wa- kinahifadhi uwezekano huo badala ya kuamua kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ni wa asili bila kufuta utata halisi wa kiwakilishi cha mwisho.
