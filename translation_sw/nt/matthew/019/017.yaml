  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: sw
  text: Naye akamwambia[a], “Kwa nini unaniuliza kuhusu lililo jema? Mmoja ndiye aliye mwema.[b] Lakini ukitaka kuingia katika uzima, zishike amri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na masimulizi sambamba yanasema, “Kwa nini unaniita mwema? Hakuna aliye mwema isipokuwa mmoja—Mungu.” Lakini matini ya Mathayo katika SBLGNT inasema, “Kwa nini unaniuliza kuhusu lililo jema? Mmoja ndiye aliye mwema.”
    reason: textual_variant
  - marker: b
    text: Au, kwa lugha ya kawaida zaidi, “Yuko mmoja aliye mwema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Kwa nini unaniuliza kuhusu lililo jema?
  rationale: Kirai cha Kigiriki περὶ τοῦ ἀγαθοῦ kinaelekea kurejelea jambo lililo jema, si kumtaja mtu kuwa mwema. Tafsiri hii inafuata sarufi ya Mathayo bila kuilinganisha kimakusudi na masimulizi sambamba ya Marko na Luka.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Mmoja ndiye aliye mwema
  rationale: Muundo huu unahifadhi msisitizo wa εἷς na kivumishi kilichotumika kama nomino, huku ukibaki wa asili na wenye heshima katika Kiswahili. Haiongezi neno ‘Mungu,’ ambalo halipo katika matini hii ya SBLGNT.
- source_word: εἰ δὲ θέλεις
  choice: Lakini ukitaka
  rationale: ‘Ukitaka’ linaonyesha nia au tamaa kwa lugha ya kawaida ya sasa; ‘lakini’ linawakilisha δέ yenye uzito mdogo wa utofautishaji.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: kuingia katika uzima
  rationale: ‘Uzima’ linafaa kwa ζωή katika maana yake pana ya kieskatolojia. Tafsiri haiongezi ‘wa milele,’ kwa kuwa maneno hayo hayapo katika kifungu hiki.
- source_word: τήρησον τὰς ἐντολάς
  choice: zishike amri
  rationale: Katika muktadha wa maagizo ya Mungu, ‘kushika amri’ ni Kiswahili cha kawaida kinachoeleza kuzitii na kuzifuata, si kuzilinda kwa maana ya kimwili.
theological_decisions:
- issue: Uhusiano wa kauli ya Yesu na wema wa Mungu pamoja na Kristolojia
  choice: Kutafsiri maneno ya Mathayo kama swali kuhusu lililo jema na jibu kwamba mmoja ndiye aliye mwema, bila kuongeza kuwa Yesu anakataa kuwa mwema wala kuingiza maneno ya masimulizi sambamba.
  alternative: “Kwa nini unaniita mwema? Hakuna aliye mwema isipokuwa mmoja—Mungu.”
  rationale: Matini ya SBLGNT katika Mathayo ina maneno tofauti na yale ya Marko na Luka. Tafsiri inahifadhi tofauti hiyo na mvutano wake wa kiteolojia bila kukana uungu wa Yesu wala kuuingiza moja kwa moja katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mmoja ndiye aliye mwema’ kinahifadhi muundo wenye msisitizo wa Kigiriki bila kuwa kigumu kupita kiasi. Alama [b] imewekwa baada ya kauli inayohusika nayo, kwa kuwa tanbihi inaeleza namna nyingine ya kutafsiri εἷς ἐστιν ὁ ἀγαθός.
