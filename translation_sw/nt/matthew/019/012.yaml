review_pass:
  verdict: revise
  source_fidelity: 'The threefold repetition of εὐνοῦχοι is appropriately retained as “matowashi,” and the first two categories accurately represent congenital status and being made eunuchs by other people. However, “waliojifanya matowashi” can naturally mean “who pretended to be eunuchs” in Swahili. Adding “kuwa” and “wenyewe” makes the reflexive force of εὐνούχισαν ἑαυτούς explicit without deciding whether the saying is literal or figurative. The final imperative must be subjunctive: “akubali,” not the past-tense form “alikubali.”'
  naturalness: “Anayeweza kulikubali jambo hili, na akubali” is natural, current Standard East African Swahili and carries the exhortational force of the Greek. “Tangu tumboni mwa mama zao” is understandable and idiomatic in context.
  terminology: “Matowashi,” “ufalme wa mbinguni,” and “kwa ajili ya” are suitable and consistent renderings. The note’s “walijihasi” appropriately preserves the anatomically explicit alternative, while the main text remains noncommittal about literal versus figurative interpretation.
  issues:
  - severity: high
    issue: The final verb is “alikubali.”
    rationale: “Alikubali” is past tense (“accepted”), whereas χωρείτω is a present imperative. It must be “akubali” (“let him/her accept”).
  - severity: medium
    issue: “Waliojifanya matowashi” is ambiguous in Swahili.
    rationale: Without “kuwa,” it may mean that they merely presented or pretended themselves to be eunuchs. The Greek explicitly has a reflexive making action; “waliojifanya wenyewe kuwa matowashi” represents this safely.
  revised_text: Kwa maana kuna matowashi waliozaliwa hivyo tangu tumboni mwa mama zao, na kuna matowashi waliofanywa matowashi na watu, na kuna matowashi waliojifanya wenyewe kuwa matowashi kwa ajili ya ufalme wa mbinguni.[a] Anayeweza kulikubali jambo hili, na akubali.[b]
  revised_footnotes:
  - marker: a
    text: Au, “walijihasi.” Wafafanuzi wengi wanaelewa maneno haya kwa njia ya kitamathali kuwa yanamaanisha kuchagua kuishi bila ndoa kwa ajili ya ufalme wa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, “Anayeweza kulipokea jambo hili na alipokee.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the imperative’s tense/mood and removes an unintended Swahili sense of pretending in the third category. It retains the source’s deliberate lexical repetition and its unresolved literal-versus-figurative tension.
