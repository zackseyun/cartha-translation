id: MAT.19.12
reference: Matthew 19:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: sw
  text: Kwa maana kuna matowashi waliozaliwa hivyo tangu tumboni mwa mama zao, na kuna matowashi waliofanywa matowashi na watu, na kuna matowashi waliojifanya wenyewe kuwa matowashi kwa ajili ya ufalme wa mbinguni.[a] Anayeweza kulikubali jambo hili, na akubali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walijihasi.” Wafafanuzi wengi wanaelewa maneno haya kwa njia ya kitamathali kuwa yanamaanisha kuchagua kuishi bila ndoa kwa ajili ya ufalme wa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, “Anayeweza kulipokea jambo hili na alipokee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: matowashi
  rationale: Neno hili linataja matowashi kwa maana yake ya kawaida na linadumisha urudiaji wa neno la Kigiriki katika makundi yote matatu bila kulifasiri mapema kuwa watu waliochagua kutooa au kuolewa.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: waliozaliwa hivyo tangu tumboni mwa mama zao
  rationale: Hii inadumisha taswira ya wazi ya tumbo la mama na maana ya kuwa hivyo tangu kuzaliwa, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: waliofanywa matowashi na watu
  rationale: Tafsiri hii inadumisha uhusiano wa kitenzi na nomino ‘matowashi’ na inatafsiri ἀνθρώπων kwa ‘watu’ bila kuibana kuwa wanaume pekee.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: waliojifanya matowashi
  rationale: Hii inafuata moja kwa moja muundo wa Kigiriki na kuhifadhi utata wa kama kauli hiyo ni halisi, ni chumvi ya usemi, au ni sitiari ya kuchagua kuishi bila ndoa.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: kwa ajili ya ufalme wa mbinguni
  rationale: ‘Kwa ajili ya’ huwasilisha kusudi au sababu inayomsukuma mtu, na ‘ufalme wa mbinguni’ ni usemi wa kawaida na wenye uzito wa kitheolojia katika Mathayo.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Anayeweza kulikubali jambo hili na alikubali
  rationale: ‘Kulikubali’ huwasilisha maana ya kiidioma ya χωρέω ya kulipa nafasi au kulipokea fundisho gumu, na muundo ‘na alikubali’ unahifadhi nguvu ya agizo la nafsi ya tatu.
theological_decisions:
- issue: Kama εὐνούχισαν ἑαυτοὺς ina maana halisi au ya kitamathali
  choice: Kudumisha katika maandishi makuu usemi ‘waliojifanya matowashi’ bila kuufafanua zaidi.
  alternative: ‘walijihasi’ au ‘walichagua kuishi bila ndoa’
  rationale: Aya yenyewe haielezi wazi kama kauli hii inahusu kujihasi kihalisi, ni chumvi ya usemi, au ni sitiari ya kujinyima ndoa kwa hiari. Tafsiri inadumisha mvutano huo, huku tanbihi ikionyesha uwezekano wa uelewaji wa kitamathali.
- issue: Jinsi ya kutafsiri ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Kutumia ‘kulikubali’ katika maandishi makuu.
  alternative: ‘kulipokea’ au ‘kulipa nafasi’
  rationale: ‘Kulikubali’ ni Kiswahili cha sasa kinachoeleza vizuri kupokea na kukubali fundisho lenye kudai mengi; tanbihi inadumisha tafsiri iliyo karibu zaidi na umbo la neno, ‘kulipokea.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Matowashi’ limetumiwa kwa uthabiti ili kuhifadhi urudiaji na ukali wa usemi wa Kigiriki. Viwakilishi vya wingi katika ‘mama zao’ vinaendana kwa kawaida na makundi yanayotajwa; sentensi ya mwisho inadumisha agizo bila kutumia lugha ya kizamani kupita kiasi.
