revisions:
- from: Kwa maana kuna matowashi waliozaliwa hivyo tangu tumboni mwa mama zao, na kuna matowashi waliofanywa matowashi na watu, na kuna matowashi waliojifanya matowashi kwa ajili ya ufalme wa mbinguni.[a] Anayeweza kulikubali jambo hili na alikubali.[b]
  to: Kwa maana kuna matowashi waliozaliwa hivyo tangu tumboni mwa mama zao, na kuna matowashi waliofanywa matowashi na watu, na kuna matowashi waliojifanya wenyewe kuwa matowashi kwa ajili ya ufalme wa mbinguni.[a] Anayeweza kulikubali jambo hili, na akubali.[b]
  rationale: The revision corrects the imperative’s tense/mood and removes an unintended Swahili sense of pretending in the third category. It retains the source’s deliberate lexical repetition and its unresolved literal-versus-figurative tension.
  reviewer_model: gpt-5.6-terra
