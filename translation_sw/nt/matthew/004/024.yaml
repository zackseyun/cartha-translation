source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: sw
  text: Habari zake zikaenea katika Syria yote. Watu wakamletea wote waliokuwa wagonjwa—waliokuwa wakisumbuliwa na magonjwa mbalimbali na maumivu makali, walioteswa na pepo[a], waliokuwa wakipatwa na degedege[b], na waliopooza—naye akawaponya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliopagawa na pepo” au “waliotawaliwa na pepo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: σεληνιαζομένους, kihalisi watu waliofikiriwa kuathiriwa na mwezi; kwa kawaida neno hili limetafsiriwa “wenye kifafa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: Habari zake
  rationale: Katika muktadha huu neno hilo linamaanisha habari zilizosikika kuhusu Yesu, si uwezo wa kusikia. Kauli hii ni ya kawaida na inaeleweka kwa urahisi.
- source_word: ἀπῆλθεν
  choice: zikaenea
  rationale: Ingawa kitenzi kihalisi kina wazo la kuondoka au kwenda nje, kwa habari zinazofika eneo lote Kiswahili cha asili hutumia ‘kuenea’.
- source_word: Συρίαν
  choice: Siria
  rationale: Hili ndilo umbo la kawaida la jina la eneo hilo katika Kiswahili cha kisasa.
- source_word: προσήνεγκαν
  choice: wakamletea
  rationale: Kitenzi hapa kinamaanisha kuwapeleka wagonjwa kwa Yesu; ‘wakamletea’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: κακῶς ἔχοντας
  choice: waliokuwa wagonjwa
  rationale: Hii ni nahau ya Kigiriki inayomaanisha watu waliokuwa katika hali mbaya ya kiafya.
- source_word: ποικίλαις νόσοις
  choice: magonjwa mbalimbali
  rationale: Kauli hii inahifadhi wazo la aina nyingi au tofauti za magonjwa.
- source_word: βασάνοις συνεχομένους
  choice: waliokuwa wakisumbuliwa na ... maumivu makali
  rationale: συνέχω hapa huonyesha kushikwa au kusumbuliwa sana, na βάσανος huonyesha mateso au maumivu makali. Tafsiri hii ni ya kawaida bila kupunguza uzito wa hali zao.
- source_word: δαιμονιζομένους
  choice: walioteswa na pepo
  rationale: Kauli hii inatambua wazi mateso ya kipepo bila kulazimisha kiwango maalumu cha utawala ambacho kitenzi chenyewe hakibainishi kikamilifu.
- source_word: σεληνιαζομένους
  choice: waliopatwa na kifafa
  rationale: Neno hilo lilihusishwa kihistoria na mwezi, lakini katika orodha hii linaelekea kumaanisha watu waliopatwa na mashambulio ya kifafa. Maelezo ya kihalisi yamehifadhiwa katika tanbihi.
- source_word: παραλυτικούς
  choice: waliopooza
  rationale: Hili ni neno la kawaida na lenye heshima kwa watu wenye kupooza.
- source_word: ἐθεράπευσεν
  choice: akawaponya
  rationale: Kitenzi kinamaanisha kuponya au kutibu; ‘akawaponya’ kinafaa zaidi katika simulizi hili.
theological_decisions:
- issue: Jinsi ya kutafsiri δαιμονιζομένους bila kukana hali halisi ya mateso ya kipepo wala kuifanya kuwa istilahi finyu kupita Kigiriki
  choice: walioteswa na pepo
  alternative: waliopagawa na pepo; waliotawaliwa na pepo
  rationale: Tafsiri iliyochaguliwa inahifadhi mhusika wa kiroho na hali halisi ya mateso, huku ikiacha wazi kiwango hususa cha ushawishi au utawala wa pepo.
- issue: Jinsi ya kutafsiri σεληνιαζομένους bila kuthibitisha kwamba mwezi ndio uliosababisha hali hiyo
  choice: waliopatwa na kifafa
  alternative: walioathiriwa na mwezi; wenye kifafa
  rationale: Tafsiri kuu inaeleza hali inayoweza kutambuliwa na msomaji wa sasa, huku tanbihi ikihifadhi uhusiano wa neno la Kigiriki na mwezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye hadhi. Mistari mirefu imetenganishwa kwa alama za mkato ili kuonyesha kwamba makundi yanayofuata yanafafanua wagonjwa walioletwa kwa Yesu. ‘Pepo’ limetumiwa kwa maana ya roho waovu, kama inavyoeleweka katika muktadha wa Biblia.
