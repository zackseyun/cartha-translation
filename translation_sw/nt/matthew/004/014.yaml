  text: 'ili litimie neno lililonenwa kupitia nabii Isaya, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo; “ili” ni ya kawaida katika Kiswahili na inadumisha nguvu ya kishazi bila kuwa nzito.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Kitenzi hiki ni aoristi, kauli tendwa, hali tegemezi. Katika Kiswahili, “litimie” hudumisha wazo la kutimizwa kwa neno la Maandiko na linaendana kiasili na “ili.”
- source_word: τὸ ῥηθὲν
  choice: lile lililonenwa
  rationale: Kifungu hiki ni kivumishi-jina cha hali tendwa. “Lile lililonenwa” kinarejelea kwa kawaida neno au jambo lililotajwa, huku kikitoa rejeleo linalofaa kwa kitenzi cha baadaye “likisema.”
- source_word: διὰ
  choice: kupitia
  rationale: Pamoja na genitivi ya mtu, διά huonyesha uwakala wa kati; “kupitia” hudumisha picha ya Isaya kuwa njia ya ujumbe wa kinabii badala ya chanzo chake cha mwisho.
- source_word: Ἠσαΐου
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii katika Biblia za Kiswahili na matumizi ya Kiswahili cha Afrika Mashariki.
- source_word: τοῦ προφήτου
  choice: nabii
  rationale: Hutambulisha wazi wajibu wa Isaya. Kiswahili hakihitaji kibainishi kinacholingana na ‘the’ hapa.
- source_word: λέγοντος
  choice: 'likisema:'
  rationale: Kivumishi-tendo cha wakati uliopo kinaanzisha nukuu inayofuata. “Likisema:” huunganisha nukuu na lile lililonenwa na kuhifadhi muundo wa chanzo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kauli ya kutimizwa kwa unabii katika Mathayo
  choice: litimie
  alternative: liwe kweli
  rationale: “Litimie” huhifadhi kwa uwazi dhamira ya Mathayo ya Maandiko kutimizwa, bila kuongeza maelezo kuhusu namna au maana ya kitheolojia ya utimilifu huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kwa kuwa mstari huu unaendelea moja kwa moja katika nukuu ya mstari unaofuata. Hakuna tanbihi zinazohitajika.
