  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: sw
  text: Nao mara moja[a] wakaacha mashua na baba yao, wakamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “papo hapo.”
    reason: Njia nyingine ya kutafsiri εὐθέως huku maana ya mwitikio wa haraka ikihifadhiwa.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa upole, nacho kiwakilishi kinawarejelea wale ndugu wawili waliotajwa kabla.
- source_word: εὐθέως
  choice: mara moja
  rationale: Hueleza mwitikio wa haraka na wa papo kwa papo kwa lugha ya kawaida na yenye hadhi.
- source_word: ἀφέντες
  choice: wakaacha
  rationale: Kitenzi hiki kinaonyesha kwamba kuacha kulitangulia tendo kuu la kumfuata; muundo wa Kiswahili wenye vitenzi vinavyofuatana unaonyesha mpangilio huo kwa kawaida bila kuongeza wazo la kuwaacha kabisa milele.
- source_word: τὸ πλοῖον
  choice: mashua
  rationale: Katika mazingira haya ya uvuvi, ‘mashua’ ni sahihi na ya kawaida kuliko ‘meli.’
- source_word: τὸν πατέρα αὐτῶν
  choice: baba yao
  rationale: Tafsiri hii ya moja kwa moja inalinda uzito wa uhusiano wa kifamilia bila kuongeza maelezo yasiyomo katika matini.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  rationale: Huhifadhi maana ya kwenda nyuma yake na pia dokezo la kuwa wanafunzi wake lililopo katika muktadha wa Injili.
theological_decisions:
- issue: Mwitikio wa uanafunzi na kuachana na baba yao
  choice: Kuwaacha mashua na baba yao kunaelezwa kama tendo la haraka na thabiti la kumfuata Yesu.
  alternative: Kutafsiri kwamba walimtelekeza baba yao kabisa na milele, au kwamba waliondoka kwa muda mfupi tu.
  rationale: Matini inasisitiza haraka na uamuzi wao, lakini ἀφέντες peke yake haibainishi muda ambao kuachana huko kulidumu. ‘Wakaacha’ huhifadhi nguvu ya simulizi bila kulazimisha hitimisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya sasa, yenye hadhi, na rahisi kueleweka. ‘Nao’ huendeleza simulizi kwa ulaini, na mfuatano ‘wakaacha … wakamfuata’ huakisi hatua zinazofuatana katika Kigiriki.
