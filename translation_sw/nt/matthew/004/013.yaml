  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: sw
  text: Baada ya kuondoka Nazara[a], alifika Kapernaumu, iliyo kandokando ya bahari, katika eneo la Zabuloni na Naftali, akakaa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Nazara”; tafsiri nyingi zina “Nazareti.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: akaondoka
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kukaa kwake; “akaondoka” ni cha asili katika masimulizi ya Kiswahili na kinaonyesha kuondoka mahali.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Hufuata umbo la jina lililo katika maandishi ya Kigiriki, Ναζαρά; umbo linalofahamika zaidi, “Nazareti,” limetajwa katika tanbihi.
- source_word: ἐλθὼν
  choice: akaenda
  rationale: Katika muktadha wa kuondoka Nazara na kuelekea Kapernaumu, “akaenda” huwasilisha mwendo na mfuatano wa matendo kwa Kiswahili cha kawaida; Kigiriki kimsingi kina maana ya kuja/kwenda kulingana na mtazamo wa kisimulizi.
- source_word: κατῴκησεν
  choice: kukaa
  rationale: Hapa κατοικέω inaonyesha kuanza kuishi au kuweka makao mahali; “kukaa” ni ya kawaida na haidai maelezo yasiyokuwamo wazi katika kitenzi.
- source_word: Καφαρναοὺμ
  choice: Kapernaumu
  rationale: Ni umbo la kawaida la Kiswahili la jina la mahali Kapernaumu.
- source_word: τὴν παραθαλασσίαν
  choice: mji ulio kando ya bahari
  rationale: Kivumishi hiki kinaieleza Kapernaumu kuwa mahali pa kandokando ya bahari; kuongeza “mji” hufanya uhusiano huo uwe wazi na wa asili bila kubadili maana.
- source_word: ἐν ὁρίοις
  choice: katika eneo la
  rationale: ὅρια inaweza kumaanisha mipaka, wilaya, au maeneo; hapa “eneo la” huwasilisha rejeo la kijiografia kwa lugha ya kawaida huku ikiepuka kulazimisha maana finyu ya mpaka.
- source_word: Ζαβουλὼν
  choice: Zabuloni
  rationale: Ni umbo la kawaida la Kiswahili la jina la kabila na eneo la Zabuloni.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Ni umbo la kawaida la Kiswahili la jina la kabila na eneo la Naftali.
theological_decisions: []
