  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “akaondoka, akaenda na kukaa” unafaa mtindo wa simulizi. “Bahari” imehifadhiwa kulingana na θάλασσα ingawa kijiografia ni Ziwa la Galilaya.
