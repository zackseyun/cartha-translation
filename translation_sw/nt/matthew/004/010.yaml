  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: sw
  text: 'Ndipo Yesu akamwambia, “Nenda zako, Shetani! Kwa maana imeandikwa: ‘Mwabudu[a] Bwana Mungu wako, na umtumikie[b] yeye peke yake.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msujudie Bwana Mungu wako.” Kitenzi cha Kigiriki kinaweza kumaanisha kihalisi zaidi kuinama au kujitupa chini kwa heshima.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “umtumikie” kinaweza hasa kumaanisha kumtolea Mungu huduma takatifu au ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐτῷ
  choice: Ndipo Yesu akamwambia
  rationale: “Ndipo” huonyesha mfuatano wa simulizi. Muundo “akamwambia” ni wa kawaida katika simulizi la Kiswahili na huwasilisha wakati wa sasa wa kihistoria wa Kigiriki kwa uhai bila kufanya sentensi isikike isiyo ya kawaida.
- source_word: Ὕπαγε
  choice: Ondoka
  rationale: Amri hii ni ya kumfukuza mtu aende zake. “Ondoka” ni ya sasa, wazi, na yenye nguvu bila kutumia lugha ya kale.
- source_word: Σατανᾶ
  choice: Shetani
  rationale: Hili ni jina au cheo kinachotumiwa kama mwito wa moja kwa moja; “Shetani” ndiyo namna iliyozoeleka katika Kiswahili.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Huu ni usemi wa kawaida unaotambulisha nukuu ya Maandiko na kuhifadhi maana ya hali iliyopo kutokana na kitendo kilichokamilika.
- source_word: Κύριον τὸν θεόν σου
  choice: Bwana Mungu wako
  rationale: Muundo huu wa kawaida na wa heshima unatambulisha Mungu wa Israeli katika nukuu ya Maandiko.
- source_word: προσκυνήσεις
  choice: Mwabudu
  rationale: Katika muktadha wa ibada inayoelekezwa kwa Mungu, “mwabudu” huwasilisha maana kuu kwa Kiswahili cha kawaida. Maana halisi zaidi ya kusujudu au kuinama imehifadhiwa katika tanbihi.
- source_word: αὐτῷ μόνῳ
  choice: yeye peke yake
  rationale: Muundo huu unasisitiza wazi kwamba Mungu ndiye pekee anayepaswa kutumikiwa.
- source_word: λατρεύσεις
  choice: umtumikie
  rationale: “Umtumikie” huhifadhi tofauti kati ya kitenzi hiki na “mwabudu,” huku tanbihi ikieleza kwamba kitenzi cha Kigiriki kinaweza hasa kumaanisha huduma ya kidini au takatifu.
theological_decisions:
- issue: Kutofautisha προσκυνέω na λατρεύω
  choice: Kutafsiri προσκυνήσεις kama “Mwabudu” na λατρεύσεις kama “umtumikie”
  alternative: Kutumia lugha ya kuabudu kwa vitenzi vyote viwili, au kutafsiri προσκυνήσεις kama “Msujudie”
  rationale: Kigiriki kinatumia vitenzi viwili vinavyohusiana lakini visivyo sawa. Kuvitofautisha kunahifadhi wazo kwamba Mungu pekee anastahili kuabudiwa na kutumikiwa, bila kubana au kupanua maana ya kiteolojia kuliko maandishi yenyewe.
- issue: Nguvu ya wakati ujao katika nukuu ya Maandiko
  choice: Kutumia amri “Mwabudu ... umtumikie”
  alternative: “Utamwabudu ... utamtumikia”
  rationale: Vitenzi vya Kigiriki vya wakati ujao katika nukuu hii vina nguvu ya agizo. Kiswahili cha kawaida huwasilisha nguvu hiyo kwa uwazi zaidi kwa hali ya kuamuru.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Ndipo ... akamwambia” ni mtiririko wa asili wa simulizi; nukuu ya Maandiko imepewa uzito wa agizo bila kutumia lugha ya kizamani. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
