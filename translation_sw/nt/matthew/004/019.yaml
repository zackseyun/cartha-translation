  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: sw
  text: Akawaambia, “Njooni mnifuate, nami nitawafanya kuwa wavuvi wa watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kisimulizi, Kiswahili cha kawaida husimulia tendo hili kwa wakati uliopita; ‘akawaambia’ huendeleza simulizi kwa njia ya asili bila kubadili tukio.
- source_word: Δεῦτε ὀπίσω μου
  choice: Njooni mnifuate
  rationale: Δεῦτε ni mwito wa kuja, na ὀπίσω μου kwa muktadha huu ni kuwa mfuasi wa Yesu. Kiswahili ‘njooni mnifuate’ kinahifadhi mwito pamoja na maana ya ufuasi kwa lugha ya kawaida.
- source_word: ποιήσω ὑμᾶς
  choice: nitawafanya kuwa
  rationale: Huhifadhi ahadi ya tendo la Yesu la kuwabadilisha wanaoitwa, huku ‘kuwa’ ikikamilisha sentensi kwa Kiswahili cha asili.
- source_word: ἁλιεῖς
  choice: wavuvi
  rationale: Ni kisawe cha moja kwa moja na cha kawaida cha watu wanaovua samaki, na kinaendeleza taswira ya uvuvi.
- source_word: ἀνθρώπων
  choice: wa watu
  rationale: ἄνθρωπος hapa humaanisha wanadamu kwa ujumla, si wanaume pekee; ‘watu’ huwasilisha maana hiyo kwa usahihi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ἁλιεῖς ἀνθρώπων
  choice: wavuvi wa watu
  alternative: wavuvi wa wanadamu
  rationale: Usemi huo ni sitiari ya kuwaita watu wawe wanafunzi. ‘Watu’ hudumisha maana pana ya ἀνθρώπων bila kuifanya ihusu wanaume pekee, wala kufafanua zaidi namna ‘kuwavua’ kunavyotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Njooni mnifuate’ ni mwito wa asili zaidi kuliko tafsiri sisisi ‘njooni nyuma yangu,’ huku taswira ya ‘wavuvi wa watu’ ikihifadhiwa.
