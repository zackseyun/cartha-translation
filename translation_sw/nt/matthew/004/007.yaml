base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: sw
  text: 'Yesu akamwambia, “Tena imeandikwa: ‘Usimjaribu[a] Bwana, Mungu wako.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usimtie Bwana, Mungu wako, majaribuni.” Kitenzi cha Kigiriki ἐκπειράζω kinaweza kutafsiriwa “kumjaribu” au “kumtia majaribuni.”
    reason: lexical_alternative
  - marker: b
    text: Hii ni nukuu kutoka Kumbukumbu la Torati 6:16. Neno la Kigiriki linalotafsiriwa “Bwana” linafuata Septuajinti, ambayo ilitumia cheo hicho kuwakilisha jina la Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Muundo huu ni utangulizi wa kawaida wa maneno katika simulizi. ‘Akamwambia’ huonyesha kwa njia ya asili kwamba Yesu alisema maneno hayo kwake, bila kuongeza mkazo usiokuwamo katika Kigiriki.
- source_word: Πάλιν
  choice: Tena
  rationale: Neno hili linaanzisha nukuu nyingine ya Maandiko kama jibu kwa nukuu iliyotangulia; ‘tena’ huhifadhi maana yake ya moja kwa moja na mtiririko wa hoja.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Kauli timilifu tendwa ni fomula ya kawaida ya kunukuu Maandiko yenye mamlaka. ‘Imeandikwa’ ni ya kawaida na hudokeza kuwa yaliyoandikwa yanaendelea kuwa na nguvu.
- source_word: Οὐκ ἐκπειράσεις
  choice: Usimjaribu
  rationale: Wakati ujao wa Kigiriki umetumiwa kama katazo. Katika muktadha huu, ‘kumjaribu’ Mungu ni kumweka katika hali ya kuthibitisha uwezo au uaminifu wake; tafsiri hii ni fupi na ya asili katika Kiswahili.
- source_word: κύριον τὸν θεόν σου
  choice: Bwana Mungu wako
  rationale: Huhifadhi ‘Bwana’ kwa κύριος na muundo wa kiagano wa usemi ‘Mungu wako,’ huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Maandiko inayomtaja Mungu wa Israeli
  choice: Bwana
  alternative: BWANA
  rationale: Chanzo cha moja kwa moja cha kifungu hiki ni Kigiriki κύριον, kwa hiyo ‘Bwana’ hufuata maandishi ya Kigiriki. Tanbihi inaeleza kwamba Septuajinti ilitumia κύριος kuwakilisha jina la Mungu katika Kumbukumbu la Torati 6:16.
- issue: Maana ya ἐκπειράζω katika katazo
  choice: kumjaribu
  alternative: kumweka katika jaribu
  rationale: ‘Kumjaribu’ ni usemi wa asili na unaeleweka kwa maana ya kumtaka Mungu athibitishe uwezo au uaminifu wake. Tanbihi huhifadhi uwezekano wa tafsiri iliyo wazi zaidi, ‘kumweka katika jaribu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Yesu akamwambia’ na fomula ‘Tena imeandikwa’ ni wa kawaida katika simulizi na nukuu za Maandiko. Alama zote za tanbihi zimewekwa katika matini kuu.
