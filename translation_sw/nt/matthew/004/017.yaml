base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: sw
  text: Tangu wakati huo Yesu alianza kutangaza akisema, “Tubuni, kwa maana ufalme wa mbinguni umekaribia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umekuja karibu” au “uko karibu.” Kitenzi timilifu cha Kigiriki kinasisitiza kwamba ufalme umekuja karibu na hali hiyo inaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Tangu wakati huo
  rationale: Inaonyesha hatua mpya katika simulizi na kudokeza kwamba huduma hii iliendelea kuanzia hapo.
- source_word: ἤρξατο
  choice: alianza
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi hiki kinapoandamana na vitenzi-jina vinavyofuata.
- source_word: κηρύσσειν καὶ λέγειν
  choice: kutangaza akisema
  rationale: Inahifadhi wazo la tangazo la hadharani huku ‘akisema’ ikitambulisha yaliyomo katika tangazo kwa Kiswahili cha asili.
- source_word: Μετανοεῖτε
  choice: Tubuni
  rationale: Amri ya wingi inawaita wasikilizaji wageuke katika fikra, mwenendo, na mwelekeo wa maisha; ‘tubuni’ ni neno lililozoeleka na lenye uzito unaofaa.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuwa ukaribu huo umefika na hali yake inaendelea; ‘umekaribia’ huhifadhi jambo hili vizuri.
- source_word: βασιλεία
  choice: ufalme
  rationale: Neno linaweza kumaanisha utawala au eneo la kifalme; ‘ufalme’ ni la kawaida na bado linaweza kubeba maana ya utawala wa kifalme.
- source_word: τῶν οὐρανῶν
  choice: wa mbinguni
  rationale: Ingawa Kigiriki kina wingi, usemi wa Kiswahili ‘ufalme wa mbinguni’ ni wa asili na huhifadhi usemi maalumu wa Mathayo bila kuufanya mahali tu.
theological_decisions:
- issue: Maana ya βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  alternative: utawala wa mbinguni
  rationale: Chaguo hili huhifadhi usemi maalumu wa Mathayo na pia huacha wazi kama msisitizo ni juu ya utawala wa Mungu au milki yake, bila kulazimisha tafsiri ya kimadhehebu.
- issue: Nguvu ya Μετανοεῖτε
  choice: Tubuni
  alternative: Geukeni
  rationale: ‘Tubuni’ hujumuisha mabadiliko ya moyo, fikra, na mwenendo, badala ya kuifanya amri kuwa mabadiliko ya mawazo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘kutangaza akisema’ ni wa asili kuliko kurudia ‘kutangaza na kusema,’ lakini bado unaonyesha kwamba maneno yanayonukuliwa ndiyo yaliyomo katika tangazo.
