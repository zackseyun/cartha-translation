id: MAT.4.21
reference: Matthew 4:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: sw
  text: Akaendelea kutoka pale, akawaona ndugu wengine wawili, Yakobo mwana wa Zebedayo na Yohana ndugu yake. Walikuwa katika mashua pamoja na Zebedayo, baba yao, wakirekebisha nyavu zao, naye akawaita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Akaendelea kutoka pale
  rationale: Kirai hiki kinaonyesha Yesu alisonga mbele kutoka mahali palipotajwa awali. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mwendelezo wa mwendo.
- source_word: εἶδεν
  choice: akawaona
  rationale: Kitenzi kina maana ya kawaida ya kuona katika simulizi; hakihitaji kuongezewa wazo la kuwatambua au kuwaona kwa makusudi maalumu.
- source_word: ἄλλους δύο ἀδελφούς
  choice: ndugu wengine wawili
  rationale: Neno ἄλλους linaonyesha kwamba hawa ni jozi nyingine baada ya ndugu waliotajwa katika muktadha uliotangulia.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Yakobo mwana wa Zebedayo
  rationale: Muundo wa Kigiriki unamtambulisha Yakobo kwa jina la baba yake; ‘mwana wa’ hulieleza hilo wazi na kwa kawaida katika Kiswahili.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Yohana ndugu yake
  rationale: Kiwakilishi kinamrejelea Yakobo, hivyo Yohana anatambulishwa kuwa ndugu yake.
- source_word: ἐν τῷ πλοίῳ
  choice: ndani ya mashua
  rationale: Katika mazingira haya πλοῖον ni chombo cha uvuvi; ‘mashua’ ni sahihi kuliko ‘meli’.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: pamoja na Zebedayo baba yao
  rationale: μετά pamoja na hali ya umilikishi huonyesha kuandamana au kuwa pamoja; mpangilio huu pia unabaki karibu na maandishi ya Kigiriki.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: wakitengeneza nyavu zao
  rationale: Katika muktadha wa uvuvi, καταρτίζω humaanisha kuziweka nyavu katika hali inayofaa, ikiwa ni pamoja na kuzirekebisha. ‘Wakitengeneza’ ni ya kawaida na haisemi kwa uhakika zaidi ya chanzo kwamba zilikuwa zimechanika.
- source_word: ἐκάλεσεν αὐτούς
  choice: akawaita
  rationale: Tafsiri rahisi inadumisha wito wa Yesu bila kuongeza maneno ‘wamfuate,’ ambayo hayapo katika mstari huu.
theological_decisions:
- issue: Maana ya wito wa uanafunzi katika ἐκάλεσεν
  choice: akawaita
  alternative: akawaita wamfuate
  rationale: Muktadha unaonyesha kuwa huu ni wito wa kuwa wanafunzi, lakini maandishi ya mstari huu yanasema tu kwamba aliwaita. Tafsiri haiongezi lengo ambalo chanzo hakilitaji wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Sentensi imegawanywa mara mbili ili kuepuka mfuatano mzito wa vishazi huku mahusiano yote ya maandishi ya Kigiriki yakihifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
