source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: sw
  text: Kisha Yesu akaongozwa na Roho kwenda nyikani ili ajaribiwe na Ibilisi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “apimwe.” Kitenzi cha Kigiriki kinaweza kumaanisha kushawishiwa kutenda uovu au kupimwa, ingawa hapa muktadha wa karibu unapendelea maana ya kushawishiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi hiki cha wakati kinaonyesha tukio linalofuata katika simulizi; “Kisha” ni cha kawaida na cha asili katika Kiswahili.
- source_word: ἀνήχθη
  choice: akaongozwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi. Dhana ya kuelekea juu iliyomo katika ἀνάγω haitajwi wazi kwa kuwa “akaongozwa juu kwenda nyikani” si usemi wa asili katika Kiswahili na mwelekeo huo si hoja kuu hapa.
- source_word: εἰς τὴν ἔρημον
  choice: kwenda nyikani
  rationale: “Nyikani” huonyesha eneo lisilokaliwa na lenye ukiwa bila kulibana kuwa jangwa la mchanga.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: na Roho
  rationale: “Na” huonyesha mtendaji katika sentensi ya hali ya kutendwa. Herufi kubwa katika “Roho” inaonyesha kwamba muktadha unamhusu Roho wa Mungu bila kuongeza neno “Mtakatifu,” ambalo halimo katika mstari huu.
- source_word: πειρασθῆναι
  choice: ili ajaribiwe
  rationale: “Ajaribiwe” linafaa kwa kitendo cha Ibilisi katika muktadha huu na pia linaweza kubeba wazo pana la kupimwa. Tanbihi inaweka wazi maana hiyo mbadala.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: na Ibilisi
  rationale: “Ibilisi” ni jina la kawaida la Kiswahili kwa mpinzani huyo binafsi katika muktadha huu, badala ya tafsiri ya moja kwa moja kama “mchongezi.”
theological_decisions:
- issue: Utambulisho wa τοῦ πνεύματος
  choice: “Roho” humaanisha Roho wa Mungu
  alternative: roho fulani au roho ya Yesu mwenyewe
  rationale: Muktadha wa karibu wa ubatizo wa Yesu, ambako Roho anamshukia, unaunga mkono wazi utambulisho huu; tafsiri haiongezi “Mtakatifu,” kwa kuwa neno hilo halipo hapa.
- issue: Maana ya πειρασθῆναι
  choice: “ajaribiwe” katika maana ya kushawishiwa kutenda uovu
  alternative: apimwe
  rationale: Kwa kuwa mtendaji ni Ibilisi na matukio yanayofuata ni vishawishi vya kutenda uovu, maana ya kushawishiwa ndiyo inayotawala hapa. Hata hivyo, kitenzi cha Kigiriki kinaweza pia kumaanisha kupimwa, hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akaongozwa na Roho kwenda nyikani” ni wa asili na unaeleweka kwa urahisi; “Ibilisi” limetumiwa kama jina linalotambulika katika simulizi.
