id: MAT.4.23
reference: Matthew 4:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: sw
  text: Naye alikuwa akizunguka katika Galilaya yote, akifundisha katika masinagogi yao, akitangaza habari njema ya ufalme[a], na akiponya kila ugonjwa na kila udhaifu miongoni mwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili ya ufalme.”
    reason: Mbadala wa kileksika wa ‘habari njema’; ‘injili’ ni istilahi ya jadi iliyozoeleka.
lexical_decisions:
- source_word: περιῆγεν
  choice: alikuwa akizunguka
  rationale: Wakati usiotimilifu unaonyesha shughuli ya kuendelea ya kwenda sehemu mbalimbali; muundo huu wa Kiswahili unaonyesha mwendo huo wa mara kwa mara kwa lugha ya kawaida.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: Galilaya yote
  rationale: Pamoja na kitenzi cha mwendo, kirai hiki kinaonyesha kuzunguka katika eneo lote la Galilaya. Kiswahili hakihitaji kihusishi baada ya ‘kuzunguka’.
- source_word: διδάσκων
  choice: akifundisha
  rationale: Kaambishi ‘aki-’ kinaonyesha tendo lililokuwa likiendelea wakati mmoja na kuzunguka kwake.
- source_word: συναγωγαῖς αὐτῶν
  choice: masinagogi yao
  rationale: ‘Masinagogi’ ni istilahi ya kawaida kwa mahali pa mikutano na ibada ya Wayahudi, na ‘yao’ inahifadhi kiwakilishi cha umilikaji.
- source_word: κηρύσσων
  choice: akitangaza
  rationale: Neno hili linaonyesha kutangaza ujumbe hadharani; ‘akitangaza’ ni la sasa, wazi, na lenye maana pana inayofaa muktadha.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: habari njema ya ufalme
  rationale: ‘Habari njema’ hutoa maana ya moja kwa moja ya εὐαγγέλιον, huku ‘ya ufalme’ ikihifadhi uhusiano mpana wa kirai cha Kigiriki bila kuamua kimya kimya kama maana pekee ni ‘kuhusu ufalme’.
- source_word: θεραπεύων
  choice: kuponya
  rationale: Katika muktadha huu kitenzi kinaeleza kuondoa magonjwa kwa uponyaji halisi.
- source_word: πᾶσαν νόσον
  choice: kila ugonjwa
  rationale: ‘Ugonjwa’ ni tafsiri ya kawaida na inaruhusu kutofautishwa na μαλακία inayofuata.
- source_word: πᾶσαν μαλακίαν
  choice: kila udhaifu
  rationale: ‘Udhaifu’ huhifadhi maana pana ya μαλακία, ambayo inaweza kumaanisha hali ya udhaifu au maradhi, na pia huhifadhi jozi ya maneno tofauti katika Kigiriki.
- source_word: ἐν τῷ λαῷ
  choice: miongoni mwa watu
  rationale: Kirai hiki kinaonyesha kwamba uponyaji ulitendeka kati ya watu; tafsiri hii ni ya kawaida na haisisitizi maana ya kitaalamu isiyolazimishwa na muktadha.
theological_decisions:
- issue: Tafsiri ya εὐαγγέλιον
  choice: habari njema
  alternative: injili
  rationale: ‘Habari njema’ inaweka wazi maana ya neno kwa msomaji wa kawaida bila kupunguza uzito wa ujumbe. Istilahi ya jadi ‘injili’ imehifadhiwa katika tanbihi.
- issue: Uhusiano katika τὸ εὐαγγέλιον τῆς βασιλείας
  choice: habari njema ya ufalme
  alternative: habari njema kuhusu ufalme
  rationale: Muundo ‘ya ufalme’ unabaki karibu na hali halisi ya kirai cha Kigiriki na kuhifadhi upana wake wa maana badala ya kuufanya kwa lazima kuwa wa mada pekee.
- issue: Upeo wa πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: kila ugonjwa na kila udhaifu
  alternative: kila aina ya ugonjwa na maradhi
  rationale: Kurudia ‘kila’ kunahifadhi msisitizo na upeo mpana wa maandishi, huku nomino mbili tofauti zikihifadhiwa bila kuzifanya kuwa dai la kimatibabu lililo nje ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘alikuwa akizunguka … akifundisha … akitangaza’ unaendeleza hali ya shughuli inayoendelea. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, ‘habari njema ya ufalme,’ badala ya baada ya ‘Galilaya,’ kwa kuwa tanbihi inaeleza εὐαγγέλιον.
