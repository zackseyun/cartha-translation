source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: sw
  text: Alipokuwa akitembea kando ya Bahari ya Galilaya, aliwaona ndugu wawili, Simoni aitwaye Petro na Andrea ndugu yake, wakitupa wavu[a] baharini, kwa maana walikuwa wavuvi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linamaanisha wavu unaotupwa majini ili kuvua samaki.
    reason: lexical_clarification
lexical_decisions:
- source_word: Περιπατῶν
  choice: Alipokuwa akitembea
  rationale: Kirai cha wakati kinaonyesha tendo lililokuwa likiendelea wakati tendo kuu la kuona lilipotokea, kwa Kiswahili cha kawaida.
- source_word: παρὰ τὴν θάλασσαν
  choice: kando ya Bahari
  rationale: παρά pamoja na akusativi hapa huonyesha kutembea kandokando ya eneo hilo; “kando ya” ni ya asili na sahihi.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: Bahari ya Galilaya
  rationale: Hili ndilo jina la kawaida la mahali katika Kiswahili cha Biblia, ingawa kijiografia ni ziwa.
- source_word: εἶδεν
  choice: aliwaona
  rationale: Kitenzi hiki rahisi cha simulizi kimetafsiriwa moja kwa moja; kiambishi cha yambwa huonyesha wale ndugu wawili.
- source_word: δύο ἀδελφούς
  choice: ndugu wawili
  rationale: Muktadha unaonyesha wazi kuwa ni wanaume waliozaliwa katika familia moja; “ndugu wawili” ni usemi wa kawaida wa Kiswahili.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simoni aitwaye Petro
  rationale: “Aitwaye” huwasilisha kwa ufupi na kwa kawaida maana ya participio λεγόμενον.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: Andrea ndugu yake
  rationale: Kirai hiki kinamtambulisha Andrea kwa uhusiano wake na Simoni; mpangilio huu ni wa asili katika Kiswahili.
- source_word: βάλλοντας
  choice: wakitupa
  rationale: Participio ya wakati uliopo inaeleza walichokuwa wakifanya walipoonekana; “wakitupa” huonyesha tendo hilo linaloendelea.
- source_word: ἀμφίβληστρον
  choice: wavu wa kutupwa
  rationale: Neno hili linamaanisha hasa wavu wa uvuvi unaotupwa majini; tafsiri maalumu ni wazi na ya kawaida kuliko “wavu” peke yake.
- source_word: εἰς τὴν θάλασσαν
  choice: baharini
  rationale: Huwasilisha kwa kawaida mwendo wa kuutupa wavu ndani ya maji, bila kurudia kwa uzito “ndani ya bahari.”
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: kwa maana walikuwa wavuvi
  rationale: “Kwa maana” huhifadhi uhusiano wa maelezo unaoletwa na γάρ; “wavuvi” ni neno la kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa asili, huku istilahi maalumu ya wavu ikihifadhi maana ya neno la Kigiriki.
