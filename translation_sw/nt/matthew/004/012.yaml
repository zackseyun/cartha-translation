lexical_decisions:
- source_word: Ἀκούσας
  choice: Aliposikia
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha tukio lililotangulia tendo kuu; ‘aliposikia’ ni Kiswahili cha kawaida na huhifadhi uhusiano huo wa wakati.
- source_word: δὲ
  choice: hakutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa sentensi ya Kiswahili unatosha bila kuongeza ‘basi’ au ‘lakini,’ ambazo zingeweza kusisitiza maana isiyokusudiwa.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: παρεδόθη
  choice: alikuwa ametiwa mikononi mwa watu
  rationale: Kauli hii huhifadhi maana pana ya kukabidhiwa au kutiwa mikononi mwa wengine, bila kuibana kuwa istilahi ya kukamatwa pekee. Muundo ‘alikuwa ametiwa’ unaonyesha kwamba hilo lilikuwa limetokea kabla Yesu hajasikia habari hiyo.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: Katika muktadha huu neno lina maana ya kuondoka au kujiondoa kutokana na hali fulani. ‘Akaondoka’ ni ya kawaida na haiongezi dhana ya hofu inayoweza kudokezwa na ‘akarudi nyuma.’
- source_word: εἰς τὴν Γαλιλαίαν
  choice: kwenda Galilaya
  rationale: Huonyesha mwendo kuelekea eneo la Galilaya kwa Kiswahili cha asili; ‘kwenda’ huwasilisha nguvu ya kimwelekeo ya εἰς.
theological_decisions:
- issue: Maana ya παραδίδωμι kuhusu Yohana
  choice: alikuwa ametiwa mikononi mwa watu
  alternative: alikuwa amekamatwa
  rationale: Kitenzi cha Kigiriki ni kipana kuliko neno la kiufundi la kukamatwa na kinaweza kumaanisha kukabidhiwa au kutiwa chini ya mamlaka ya wengine. Tafsiri kuu inalinda upana huo; tanbihi inaonyesha maana mahususi inayofaa muktadha.
- issue: Mtendaji asiyeelezwa wa ἀνεχώρησεν
  choice: Yesu akaondoka
  alternative: akaondoka
  rationale: Kigiriki huacha kiima kieleweke kutokana na muktadha. Kutaja ‘Yesu’ katika Kiswahili huondoa uwezekano wa msomaji kudhani kuwa Yohana ndiye aliyeondoka, bila kubadili rejeleo la kiima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi ‘Aliposikia … akaondoka’ ni wa kawaida; jina ‘Yesu’ limewekwa wazi ili kuepusha utata wa kiima baada ya kutajwa kwa Yohana.
