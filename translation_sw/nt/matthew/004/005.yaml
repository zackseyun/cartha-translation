  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: sw
  text: Kisha Ibilisi akamchukua pamoja naye hadi katika mji mtakatifu[a], akamsimamisha juu ya kilele cha Hekalu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Yerusalemu.
    reason: cross_reference
  - marker: b
    text: Au, bawa la Hekalu; neno la Kigiriki linaweza kumaanisha ukingo uliochomoza au sehemu ya juu zaidi ya eneo la Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Inaonyesha mfuatano wa tukio katika simulizi kwa Kiswahili cha kawaida.
- source_word: παραλαμβάνει
  choice: akamchukua
  rationale: Kitenzi hiki hapa kina maana ya kumchukua mtu pamoja naye. Muundo wa simulizi wenye “aka-” unawasilisha kwa ufasaha hali ya wakati uliopo wa kihistoria wa Kigiriki.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Hapa neno hilo ni jina la cheo la kiumbe binafsi anayemjaribu Yesu; “Ibilisi” ndilo neno lililozoeleka na sahihi katika Kiswahili cha Biblia.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: mpaka mji mtakatifu
  rationale: Kifungu kinaonyesha mwendo kuelekea mahali hapo. “Mji mtakatifu” huhifadhi jina la heshima lililotumiwa katika Kigiriki bila kulibadili moja kwa moja kuwa Yerusalemu.
- source_word: ἔστησεν
  choice: akamweka
  rationale: Kitenzi kimetumiwa kwa maana ya kusababisha asimame au kuwa mahali fulani; “akamweka” ni cha kawaida na huepuka kudokeza kwamba Yesu ndiye aliyejisimamisha hapo.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: juu ya kilele
  rationale: πτερύγιον inaweza kumaanisha sehemu iliyochomoza kama bawa au sehemu ya juu. “Kilele” kinaeleweka kwa urahisi katika muktadha huu, huku kutokuwa na uhakika kwa sehemu hususa ya jengo kukihifadhiwa katika tanbihi.
- source_word: τοῦ ἱεροῦ
  choice: cha Hekalu
  rationale: ἱερόν humaanisha eneo zima la Hekalu, si patakatifu pa ndani pekee. “Hekalu” ni neno fupi na la kawaida, na herufi kubwa inaonyesha Hekalu la Yerusalemu katika muktadha huu.
theological_decisions:
- issue: Utambulisho wa “mji mtakatifu”
  choice: Kuhifadhi “mji mtakatifu” katika matini kuu
  alternative: Yerusalemu
  rationale: Kigiriki kinatumia jina la heshima badala ya jina halisi la mji. Tanbihi inautambulisha mji bila kuondoa namna ya usemi ya chanzo.
- issue: Maana ya πτερύγιον τοῦ ἱεροῦ
  choice: kilele cha Hekalu
  alternative: bawa la Hekalu; sehemu ya juu ya eneo la Hekalu
  rationale: Sehemu halisi ya jengo inayokusudiwa haijulikani kwa uhakika. “Kilele” ni tafsiri ya kawaida na inayowezekana, lakini tanbihi huhifadhi maana halisi ya “bawa” na uwezekano wa sehemu iliyochomoza au ya juu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “aka-” unaendeleza simulizi kwa ufasaha, na maneno ya chanzo pamoja na utata wake wa kimuundo yamehifadhiwa.
