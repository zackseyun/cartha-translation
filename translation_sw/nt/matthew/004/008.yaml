  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: sw
  text: Tena, Ibilisi akamchukua kwenye mlima mrefu sana, akamwonyesha falme zote za ulimwengu na utukufu wa falme hizo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahari ya falme hizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: tena
  rationale: Huonyesha kurudiwa kwa tendo katika mfululizo wa majaribu; “tena” ni ya kawaida na wazi katika Kiswahili.
- source_word: παραλαμβάνει
  choice: akamchukua
  rationale: Kitenzi cha wakati uliopo wa kisimulizi kimetafsiriwa kwa wakati uliopita unaofululiza matukio, ambao ni wa asili katika masimulizi ya Kiswahili. “Akamchukua” hakiongezi maelezo yasiyokuwamo kuhusu namna ya kwenda pamoja.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Katika muktadha huu neno hilo ni jina linalotambulika la adui; “Ibilisi” ni tafsiri sanifu na inayoeleweka katika Kiswahili.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: mpaka kwenye mlima mrefu sana
  rationale: Huhifadhi mwendo kuelekea mahali na msisitizo wa λίαν. “Mlima mrefu sana” ni usemi wa kawaida wa Kiswahili.
- source_word: δείκνυσιν
  choice: akamwonyesha
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza wazo la kuonyesha kwa namna ya pekee.
- source_word: πάσας τὰς βασιλείας
  choice: falme zote
  rationale: Huhifadhi wingi na maana ya kisiasa na kifalme ya βασιλεία.
- source_word: τοῦ κόσμου
  choice: za ulimwengu
  rationale: “Ulimwengu” huwasilisha maana pana ya κόσμος katika muktadha huu kwa Kiswahili cha kawaida.
- source_word: τὴν δόξαν αὐτῶν
  choice: utukufu wake
  rationale: “Utukufu” huhifadhi uhusiano mpana wa kileksika wa δόξα, huku katika muktadha huu ukihusisha fahari inayoonekana. Kiwakilishi cha ngeli “wake” kinarejelea falme zote kwa mujibu wa sarufi ya Kiswahili.
theological_decisions:
- issue: Hali ya tukio la mlimani katika simulizi la jaribu
  choice: Tukio limetafsiriwa moja kwa moja kama linavyosimuliwa bila kueleza namna falme zote zilivyoonyeshwa.
  alternative: Kulieleza kama mwonekano halisi wa kijiografia kutoka mlimani, au kama ufunuo wa maono au wa kimuujiza.
  rationale: Kigiriki kinasema tu kwamba Ibilisi alimchukua Yesu mpaka kwenye mlima mrefu sana na kumwonyesha falme zote za ulimwengu na utukufu wake. Tafsiri haipaswi kuamua jambo ambalo andiko halijabainisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vya -ka- umetumiwa kuonyesha mfuatano wa masimulizi kwa ufasaha. Alama ya tanbihi imewekwa baada ya “utukufu wake,” neno ambalo mbadala wake unafafanuliwa.
