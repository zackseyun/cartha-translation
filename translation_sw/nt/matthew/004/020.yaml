  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: sw
  text: Nao mara moja wakaacha nyavu, wakamfuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi. “Nao” linaunganisha tendo hili na mwito uliotangulia bila kuingiza wazo la upinzani.
- source_word: εὐθέως
  choice: mara moja
  rationale: Kirai hiki cha kawaida katika Kiswahili sanifu kinaonyesha kwamba waliitikia bila kukawia na kuhifadhi mkazo wa εὐθέως.
- source_word: ἀφέντες
  choice: wakaziacha
  rationale: Umbile la kitenzi mfululizo linaonyesha kwamba kuziacha nyavu kulitangulia kumfuata. “Kuziacha” ni la kawaida na haliongezi nguvu ya “kutelekeza,” ambayo ingeweza kuzidisha maana.
- source_word: τὰ δίκτυα
  choice: nyavu
  rationale: Katika muktadha huu δίκτυα ni nyavu za kuvulia samaki. “Nyavu” pekee ni wazi kutokana na muktadha na haliongezi kimyakimya “zao” au “za kuvulia samaki.”
- source_word: ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inahifadhi maana ya kumfuata Yesu kimwili pamoja na dokezo linalochipuka la kuwa wanafunzi wake.
theological_decisions:
- issue: Dokezo la uanafunzi katika ἠκολούθησαν αὐτῷ
  choice: wakamfuata
  alternative: wakaenda nyuma yake
  rationale: “Wakamfuata” linaweza kumaanisha kufuata kwa mwendo na pia kujifungamanisha naye kama wanafunzi. Kwa hiyo linahifadhi upana wa kisimulizi na kiteolojia bila kuufafanua kupita maneno ya aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “wakaziacha … wakamfuata” ni wa asili na unaonyesha wazi mfuatano wa matendo.
