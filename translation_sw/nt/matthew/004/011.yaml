base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: sw
  text: Ndipo Ibilisi akamwacha, na tazama, malaika wakaja wakawa wakimhudumia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa wakimtumikia.” Kitenzi cha Kigiriki kinaweza kutafsiriwa “kuhudumia” au “kutumikia,” na muundo wake unaonyesha tendo lililoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Kiunganishi cha wakati kinachoonyesha hatua inayofuata katika simulizi; “Ndipo” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἀφίησιν
  choice: akamwacha
  rationale: Ingawa Kigiriki kimetumia wakati uliopo wa kisimulizi, wakati uliopita wa Kiswahili unafaa kwa mtiririko wa simulizi na unaonyesha kwamba Ibilisi aliondoka kwa Yesu.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Hapa neno hili ni jina linalomtambulisha Shetani katika simulizi la majaribu; “Ibilisi” linaeleweka wazi katika Kiswahili bila kulibadili kuwa maana ya kijumla ya ‘mchongezi.’
- source_word: ἰδοὺ
  choice: tazama
  rationale: Limehifadhiwa kama neno la kuvuta fikira na kuonyesha jambo la ghafla katika simulizi.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Muktadha unaonyesha wajumbe wa mbinguni, hivyo “malaika” ni sahihi kuliko “wajumbe.”
- source_word: προσῆλθον
  choice: wakaja
  rationale: Ni tafsiri ya kawaida na ya asili ya tendo la kuja au kukaribia katika muktadha huu.
- source_word: διηκόνουν
  choice: wakawa wakimhudumia
  rationale: Muundo huu unaonyesha tendo lililoendelea, kama linavyodokezwa na wakati usiotimilifu wa kitenzi cha Kigiriki, huku “kuhudumia” kikihifadhi maana pana ya kutoa huduma.
- source_word: αὐτῷ
  choice: -m- katika “wakimhudumia”
  rationale: Kiwakilishi cha yambwa kinamtaja Yesu kama aliyepokea huduma ya malaika.
theological_decisions:
- issue: Jinsi ya kutafsiri διάβολος katika simulizi la majaribu
  choice: Ibilisi
  alternative: mchongezi
  rationale: Katika muktadha huu neno hilo linatumika kama utambulisho binafsi wa Shetani. “Ibilisi” hudumisha uwazi wa rejeleo bila kuongeza fundisho lisilokuwamo katika kifungu.
- issue: Maana na hali ya tendo katika διηκόνουν
  choice: wakawa wakimhudumia
  alternative: wakamtumikia
  rationale: Tafsiri iliyochaguliwa inaonyesha huduma iliyoendelea bila kufafanua zaidi aina ya huduma; mbadala unawezekana lakini unaweza kusikika zaidi kama utumishi wa chini ya mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” limehifadhiwa ili kuonyesha msisitizo wa ἰδού, na muundo “wakawa wakimhudumia” umetumiwa kuonyesha tendo endelevu.
