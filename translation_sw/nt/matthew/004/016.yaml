id: MAT.4.16
reference: Matthew 4:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: sw
  text: Watu walioketi gizani waliona nuru kuu, na wale walioketi katika nchi na uvuli wa mauti, nuru iliwazukia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nuru iliwachomozea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: watu
  rationale: ‘Watu’ ni tafsiri ya kawaida na pana ya kundi la wanadamu; ‘taifa’ lingeweza kuleta maana ya kisiasa au kikabila isiyolazimishwa na muktadha.
- source_word: καθήμενος / καθημένοις
  choice: walioketi
  rationale: Inahifadhi picha halisi ya kuketi na usambamba wa kishairi unaotokana na Isaya, bila kuibadili kuwa ‘waliokaa’ kwa maana ya kuishi.
- source_word: σκοτίᾳ
  choice: gizani
  rationale: Ni neno la kawaida linalohifadhi uwezekano wa maana halisi na ya mfano bila kuufafanua kuwa dhambi, ujinga, au hali nyingine pekee.
- source_word: φῶς εἶδεν μέγα
  choice: waliona nuru kuu
  rationale: Wakati uliopita rahisi unafaa kwa dondoo hili la kinabii, na ‘nuru kuu’ ni usemi wa asili unaohifadhi msisitizo wa μέγα.
- source_word: χώρᾳ
  choice: nchi
  rationale: ‘Nchi’ hapa inaweza kumaanisha eneo au ukanda bila lazima kumaanisha dola ya kisasa, na inasikika kwa kawaida katika mtindo wa kibiblia wa Kiswahili.
- source_word: σκιᾷ θανάτου
  choice: uvuli wa mauti
  rationale: Inahifadhi neno la Kigiriki θανάτου (‘mauti’) na mwangwi wa picha inayojulikana katika Maandiko; ‘uvuli’ pia hudumisha sitiari badala ya kuifafanua.
- source_word: ἀνέτειλεν
  choice: iliwazukia
  rationale: Kitenzi hiki huleta picha ya nuru inayochomoza au kutokea kama jua, huku kikiwa cha kawaida na fasaha katika Kiswahili.
- source_word: αὐτοῖς
  choice: -wa- katika ‘iliwazukia’
  rationale: Kiambishi cha yambwa kinawakilisha wazi wapokeaji wa nuru na kutoa Kiswahili cha asili kwa maana ya ‘iliwazukia wao.’
theological_decisions:
- issue: Asili ya picha za giza na nuru
  choice: Picha zimehifadhiwa bila kufafanua giza au nuru kuwa jambo moja mahsusi la kiroho, kimaadili, kisiasa, au la maisha.
  alternative: Kufasiri giza waziwazi kuwa dhambi au ujinga wa Mataifa, na nuru kuwa ufunuo wa wokovu wa Masihi.
  rationale: Ingawa dondoo la Isaya lina uzito wa kitheolojia, kifungu hiki chenyewe hakifungi sitiari hizo katika ufafanuzi mmoja. Tafsiri huhifadhi upana na mvutano wake.
- issue: Maana ya ‘uvuli wa mauti’
  choice: Kuhifadhi ‘mauti’ katika matini kuu.
  alternative: Kutafsiri usemi wote kuwa ‘giza nene.’
  rationale: Kigiriki cha Mathayo kina θανάτου waziwazi, hivyo kutaja mauti huhifadhi umbo la matini na mwangwi wake wa kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Walioketi,’ ‘uvuli wa mauti,’ na usambamba wa sentensi huhifadhi taswira na mwangwi wa kinabii; ‘iliwazukia’ hutoa usemi wa asili bila kufafanua sitiari kupita matini.
