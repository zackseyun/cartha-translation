id: MAT.4.6
reference: Matthew 4:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: sw
  text: 'Naye akamwambia, “Ikiwa wewe ni Mwana wa Mungu, jitupe chini,[a] kwa maana imeandikwa: ‘Atawaamuru malaika wake kuhusu wewe,’ na, ‘Juu ya mikono yao watakuinua,[b] usije ukagonga mguu wako kwenye jiwe.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jirushe chini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Watakubeba juu ya mikono yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida na wa asili katika Kiswahili; kiambishi cha mtendewa kinaonyesha ‘akamwambia yeye.’
- source_word: Εἰ
  choice: Ikiwa
  rationale: Huhifadhi sharti na nguvu ya changamoto bila kulifanya dai hilo kuwa jambo linalokubaliwa waziwazi.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muktadha wa Mathayo, kirai hiki ni cheo kinachomtambulisha Yesu; Kiswahili hakihitaji kibainishi kinacholingana na ‘the.’
- source_word: βάλε σεαυτὸν κάτω
  choice: jitupe chini
  rationale: Ni Kiswahili cha sasa na cha moja kwa moja kinachoonyesha tendo la hiari la kujirusha kutoka mahali pa juu.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Hii ndiyo kauli ya kawaida ya kutanguliza nukuu ya Maandiko, na inadokeza kwamba yaliyoandikwa yanaendelea kuwa na uzito.
- source_word: ἐντελεῖται
  choice: Atawaamuru
  rationale: Huhifadhi maana ya agizo lenye mamlaka pamoja na wakati ujao.
- source_word: περὶ σοῦ
  choice: kuhusu wewe
  rationale: Ni ulinganifu wa moja kwa moja wa περί pamoja na hali ya umilikishi na hauipanui maana kuwa ‘kwa ajili yako.’
- source_word: ἐπὶ χειρῶν ἀροῦσίν σε
  choice: Watakuinua kwa mikono yao
  rationale: Huhifadhi picha ya malaika kumwinua na kumtegemeza kwa mikono yao, kwa Kiswahili kinachoeleweka kwa urahisi.
- source_word: μήποτε προσκόψῃς
  choice: usije ukagonga
  rationale: ‘Usije’ huonyesha kusudi la kuzuia, na ‘ukagonga’ huafikiana na kitendo maalumu cha mguu kugonga jiwe.
- source_word: πρὸς λίθον
  choice: kwenye jiwe
  rationale: Ni usemi wa asili wa Kiswahili kwa mguu kugonga jiwe; ‘jiwe’ linabaki bila kubainishwa, kama katika Kigiriki.
- source_word: τὸν πόδα σου
  choice: mguu wako
  rationale: Huhifadhi umoja wa neno la Kigiriki badala ya kulifanya kuwa wingi.
theological_decisions:
- issue: Nguvu ya kikristo ya kirai ‘Mwana wa Mungu’ katika changamoto ya mjaribu
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu kwa maana isiyo ya cheo
  rationale: Muktadha wa Mathayo unakitumia kama utambulisho maalumu wa Yesu. Herufi kubwa katika ‘Mwana’ huonyesha matumizi ya kicheo bila kuongeza maelezo ya kimadhehebu.
- issue: Ibilisi kunukuu Zaburi 91
  choice: Nukuu imetafsiriwa kama ilivyotamkwa bila maelezo ya kuisahihisha ndani ya aya
  alternative: Kuongeza ufafanuzi ndani ya maandishi kwamba nukuu inatumiwa vibaya
  rationale: Aya yenyewe inaacha mvutano wa mjaribu kutumia Maandiko. Tafsiri haipaswi kuingiza ufafanuzi ambao haupo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kisimulizi ‘Naye akamwambia’ ni wa kawaida katika usimulizi wa Biblia bila kuwa wa kizamani kupita kiasi. Nukuu na ulinganifu wa vifungu vya Zaburi zimehifadhiwa wazi.
