  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: sw
  text: Naye, baada ya kufunga siku arobaini na usiku arobaini,[a] baadaye akaona njaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye, akiisha kufunga siku arobaini na usiku arobaini, baadaye akawa na njaa.”
    reason: Mbadala huu huonyesha kwa karibu zaidi tendo la kufunga lililokamilika kabla ya tendo kuu, na hutumia usemi mwingine wa kawaida kwa hali ya njaa.
lexical_decisions:
- source_word: νηστεύσας
  choice: baada ya kufunga
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha tendo la kufunga lililotangulia njaa. “Baada ya kufunga” ni Kiswahili cha kawaida na kinahifadhi uhusiano huo wa wakati.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: siku arobaini na usiku arobaini
  rationale: Hii ni kauli ya muda unaoendelea. Tafsiri hii inafuata kwa karibu mpangilio wa chanzo na kudumisha msisitizo wa siku pamoja na usiku.
- source_word: ὕστερον
  choice: hatimaye
  rationale: Neno hili huonyesha wakati uliofuata baada ya kufunga. “Hatimaye” ni la asili katika muktadha huu na halirudii kwa uzito neno “baada” lililotumika mwanzoni.
- source_word: ἐπείνασεν
  choice: akaona njaa
  rationale: “Kuona njaa” ni usemi wa kawaida wa Kiswahili unaoeleza hali halisi ya kuwa na njaa; kiambishi “aka-” kinaendeleza simulizi na kuonyesha kilichotokea baadaye.
- source_word: καὶ
  choice: Naye
  rationale: “Naye” linaunganisha mstari huu na simulizi lililotangulia huku likimweka Yesu kuwa mhusika wa tendo bila kuongeza maana mpya.
theological_decisions:
- issue: Msisitizo wa simulizi kuhusu hitaji halisi la kibinadamu la Yesu baada ya kufunga
  choice: akaona njaa
  alternative: akawa na njaa
  rationale: Usemi huu unaonyesha wazi njaa halisi ya Yesu bila kupanua mstari kuwa tamko maalumu la kimafundisho. Pia ni wa kawaida zaidi katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi unalinda mfuatano wa wakati katika Kigiriki bila kuwa mgumu.
