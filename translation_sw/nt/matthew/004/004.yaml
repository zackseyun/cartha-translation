base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: sw
  text: 'Lakini akajibu, “Imeandikwa: ‘Mwanadamu[a] hataishi kwa mkate tu, bali kwa kila neno linalotoka kinywani mwa Mungu[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu.” Neno la Kigiriki ni la umoja wa kiume lakini limetumiwa kwa maana ya uwakilishi, likiwahusu wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kigiriki, kihalisi ni “kupitia kinywa cha Mungu.” Kiswahili «kinywani mwa Mungu» huwasilisha taswira hiyo kwa njia ya asili; tafsiri nyingine zinaweza kusema “kutoka kinywani mwa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akajibu
  rationale: Huu ni usemi wa kisimulizi wenye athari ya Kisemiti; ‘akajibu’ huwasilisha maana yake kwa Kiswahili cha kawaida bila kurudia ‘akajibu akasema.’
- source_word: Γέγραπται
  choice: Imeandikwa
  rationale: Ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko, na hali timilifu ya Kigiriki inaonyesha kwamba yaliyoandikwa yanaendelea kusimama.
- source_word: ἄρτῳ μόνῳ
  choice: kwa mkate tu
  rationale: ‘Mkate’ ni maana ya moja kwa moja katika muktadha huu, na ‘tu’ huonyesha wazi maana ya μόνῳ bila kuipanua kuwa chakula kwa ujumla.
- source_word: ζήσεται
  choice: hataishi
  rationale: Wakati ujao wa Kigiriki unawasilishwa kwa kawaida katika Kiswahili kwa umbo la wakati ujao lenye ukanushi.
- source_word: ὁ ἄνθρωπος
  choice: Mwanadamu
  rationale: Hapa nomino ya umoja inawakilisha wanadamu kwa ujumla, si mwanamume mmoja maalumu; ‘mwanadamu’ huhifadhi umoja na maana jumuishi.
- source_word: παντὶ ῥήματι
  choice: kwa kila neno
  rationale: ῥῆμα hapa ni kile Mungu anachonena; ‘kila neno’ ni la kawaida, sahihi, na linafaa katika nukuu ya Maandiko.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: linalotoka kupitia kinywa cha Mungu
  rationale: Tafsiri hii huhifadhi picha ya neno linalotoka na pia nguvu ya διά, ‘kupitia,’ badala ya kuibadili kimya kuwa ‘kutoka’ pekee.
theological_decisions:
- issue: Maana jumuishi ya ὁ ἄνθρωπος
  choice: Mwanadamu
  alternative: mtu; mwanamume
  rationale: Kauli hii ni kweli ya jumla kuhusu maisha ya binadamu. ‘Mwanadamu’ haifanyi rejeo kuwa la mwanamume mmoja wala kubadili umoja kuwa wingi.
- issue: Nguvu endelevu ya Γέγραπται katika utangulizi wa Maandiko
  choice: Imeandikwa
  alternative: Iliandikwa; inasimama kuwa imeandikwa
  rationale: ‘Imeandikwa’ ni ya asili na hudumisha hali ya sasa inayotokana na tendo lililokamilika, bila kuongeza ufafanuzi wa kimafundisho.
- issue: Taswira ya neno la Mungu kupitia kinywa chake
  choice: linalotoka kupitia kinywa cha Mungu
  alternative: litokalo kinywani mwa Mungu
  rationale: Uchaguzi huu hudumisha kwa uwazi ἐκπορευομένῳ pamoja na διά na hivyo kuhifadhi taswira ya matamshi ya Mungu bila kuamua zaidi ya maneno ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa nukuu ya Maandiko umehifadhiwa, huku ‘akajibu’ ikiepuka urudiaji usio wa lazima na ‘kupitia kinywa’ ikidumisha taswira ya Kigiriki.
