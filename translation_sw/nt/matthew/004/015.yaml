id: MAT.4.15
reference: Matthew 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: sw
  text: “Nchi ya Zabuloni na nchi ya Naftali, njia ya bahari, ng’ambo ya Yordani, Galilaya ya watu wa mataifa[a]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Galilaya ya mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Nchi / nchi
  rationale: Katika dondoo hili neno linataja eneo, si dunia wala udongo; kurudiwa kwake kunahifadhi muundo sambamba wa Kigiriki.
- source_word: Ζαβουλὼν
  choice: Zabuloni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὁδὸν θαλάσσης
  choice: njia ya bahari
  rationale: 'Tafsiri hii inahifadhi mtindo rasmi na utata wa dondoo la Isaya: inaweza kumaanisha njia inayojulikana au eneo linalohusishwa na bahari.'
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Yordani
  rationale: Ni nahau ya kawaida ya kijiografia ambayo haiweki wazi zaidi ya chanzo upande wa mtazamaji.
- source_word: Γαλιλαία
  choice: Galilaya
  rationale: Umbo la kawaida la jina la eneo hili katika Kiswahili.
- source_word: τῶν ἐθνῶν
  choice: ya watu wa Mataifa
  rationale: Katika muktadha huu wa Kiyahudi, neno linadokeza watu wasio Wayahudi. Kauli “watu wa Mataifa” inaeleza maana hiyo huku “mataifa” ikibaki kuwa mbadala halali wa moja kwa moja.
theological_decisions:
- issue: Tafsiri ya ἐθνῶν katika dondoo la Isaya
  choice: watu wa Mataifa
  alternative: mataifa
  rationale: Katika Mathayo, usemi huu unaonyesha uhusiano wa eneo hilo na wakazi wasio Wayahudi. “Watu wa Mataifa” huwasilisha tofauti ya kikabila na kidini inayodokezwa, bila kuingiza tafsiri ya kimadhehebu; mbadala wa “mataifa” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kishairi unaofaa dondoo la kinabii. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Alama ya mwisho inaonyesha sentensi inaendelea katika mstari unaofuata.
