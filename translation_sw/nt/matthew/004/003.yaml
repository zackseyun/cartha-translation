  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: sw
  text: Mjaribu akamkaribia na kumwambia, “Ikiwa wewe ni Mwana wa Mungu[a], yaambie mawe haya yawe mikate[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kuwa wewe ni Mwana wa Mungu.” Sharti la Kigiriki linaweza kutumiwa kama changamoto, si lazima kama usemi wa shaka.
    reason: alternative_reading
  - marker: b
    text: 'Neno la Kigiriki liko katika wingi: “mikate.” Kiswahili hapa pia huhifadhi wingi huo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akamkaribia
  rationale: Kitenzi hiki kinaonyesha kwamba mjaribu alisogea karibu na Yesu kabla ya kusema; “akamkaribia” ni ya asili na huhifadhi wazo la kumwelekea.
- source_word: ὁ πειράζων
  choice: Mjaribu
  rationale: Kirai hiki ni kishiriki kilichotumiwa kama nomino. Katika muktadha huu kinamtaja yule anayemjaribu Yesu, hivyo “Mjaribu” linafaa kuliko “Mwendeshaji wa jaribio.”
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kutafsiri “alisema kwake.”
- source_word: Εἰ
  choice: Ikiwa
  rationale: “Ikiwa” huhifadhi muundo wa sharti wa Kigiriki bila kuamua kimya-kimya kama msemaji ana shaka au anatoa changamoto kwa jambo analolikubali kuwa kweli.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muundo huu na muktadha wa Mathayo, hili ni jina maalumu linalomtambulisha Yesu, si maelezo ya jumla ya kuwa mwana mmoja miongoni mwa wengine.
- source_word: εἰπὲ ἵνα
  choice: yaambie ... yawe
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba maneno yanayoamriwa yalenge mawe yabadilike, bila kuongeza kitenzi chenye nguvu zaidi kama “amuru,” ambacho hakipo wazi katika λέγω.
- source_word: οἱ λίθοι οὗτοι
  choice: mawe haya
  rationale: Tafsiri hii huhifadhi nomino ya kawaida “mawe” na msisitizo wa kiashiria “haya.”
- source_word: ἄρτοι
  choice: mikate
  rationale: Nomino ya Kigiriki iko katika wingi; “mikate” huhifadhi wingi huo kwa Kiswahili cha kawaida.
- source_word: γένωνται
  choice: yawe
  rationale: Katika Kiswahili, “yawe mikate” ni usemi mfupi na wa asili unaowasilisha maana ya mawe kubadilika na kuwa mikate.
theological_decisions:
- issue: Nguvu ya sharti Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: “Ikiwa wewe ni Mwana wa Mungu”
  alternative: “Kwa kuwa wewe ni Mwana wa Mungu”
  rationale: Sharti la Kigiriki linaweza kuwa changamoto ya balagha badala ya kuonyesha shaka ya moja kwa moja. Matini kuu huhifadhi “Ikiwa” ili kutotatua mvutano huo kwa niaba ya msomaji.
- issue: Jina la Kikristo υἱὸς τοῦ θεοῦ
  choice: “Mwana wa Mungu”
  alternative: “mwana mmoja wa Mungu”
  rationale: Muktadha wa Mathayo unaonyesha kuwa hili ni jina linalomtambulisha Yesu kwa namna maalumu. Tafsiri haiongezi maelezo ya kiteolojia yasiyokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa matini ya Biblia. “Akamkaribia na kumwambia” ni wazi kwa wasomaji wa sasa, huku “Ikiwa” ikihifadhi utata halisi wa sharti la asili.
