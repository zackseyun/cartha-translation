  - severity: low
    issue: “vitu hivi vyote”
    rationale: Ingawa inaeleweka, “mambo haya yote” hurejelea kwa kawaida zaidi yale yaliyotajwa katika mstari uliotangulia kuliko “vitu,” ambalo mara nyingi hudokeza vitu vya kimwili.
  - severity: medium
    issue: 'Tanbihi: “kujilaza chini”'
    rationale: Hii si uwasilishaji wa asili wa προσκυνέω hapa. Kitenzi kinaweza kuelekea kusujudu, kuinama mbele ya mtu, au kutoa heshima; muktadha huu unapendelea kuabudu.
