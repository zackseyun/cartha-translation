  source_fidelity: 'Kifungu kinahifadhi kwa ujumla muundo wa Kigiriki: kiunganishi cha usimulizi, viwakilishi visivyotaja majina, ahadi ya kutoa, vitu vyote vinavyoonyeshwa, na sharti. Hata hivyo, “utajitupa chini” huongeza wazo la kujirusha kwa makusudi ambalo halimo wazi katika πεσών; “ukianguka chini” huwakilisha kwa karibu zaidi tendo la ‘fall down.’'
  naturalness: “Mambo haya yote” ni ya kawaida na yanafaa zaidi kuliko “vitu hivi vyote” kwa yale yaliyotajwa katika muktadha wa karibu (falme na utukufu wake). “Ukianguka chini na kuniabudu” ni Kiswahili Sanifu kinachoeleweka na kinatunza matendo mawili ya matini.
  terminology: '“Kuniabudu” ni sahihi katika muktadha huu wenye uzito wa kidini. Tanbihi inahitaji kurekebishwa: “kujilaza chini” si mbadala sahihi wa moja kwa moja wa προσκυνέω katika matumizi haya; “kusujudu” au “kuinama mbele ya” ni sahihi zaidi. “Kunitolea heshima” yahitaji kubaki kama uwezekano wa ‘pay homage,’ bila kupunguza maana kuu ya muktadha.'
