  text: Akamwambia, “Nitakupa mambo haya yote, ikiwa ukiut? ”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida bila kuongeza mkazo usiokuwamo katika kiunganishi cha Kigiriki.
- source_word: εἶπεν αὐτῷ
  choice: Akamwambia
  rationale: Huhifadhi viwakilishi vya kifungu cha Kigiriki bila kuingiza jina la Yesu lisilotajwa hapa.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Nitakupa vitu hivi vyote
  rationale: Huhifadhi ahadi ya wakati ujao, yule anayepokea, wingi wa kiwakilishi, na maana jumuishi ya πάντα kwa mpangilio wa asili wa Kiswahili.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huonyesha sharti waziwazi bila kulipanua kuwa kauli nzito zaidi ya masharti.
- source_word: πεσὼν
  choice: utajitupa chini
  rationale: Huonyesha tendo la makusudi la kushuka chini kabla au pamoja na tendo linalofuata; huepuka maana ya ajali ambayo “utaanguka” inaweza kuwa nayo katika Kiswahili.
- source_word: προσκυνήσῃς μοι
  choice: kuniabudu
  rationale: Katika muktadha wa jaribu hili na jibu la mstari unaofuata, “kuabudu” linaonyesha uzito wa kidini wa ombi hilo; maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya προσκυνέω katika dai la Shetani kwa Yesu
  choice: kuniabudu
  alternative: ukinisujudia; ukinitolea heshima
  rationale: Muktadha wa jaribu na kauli inayofuata kuhusu kumwabudu Mungu pekee unapendelea maana ya ibada, lakini kitenzi chenyewe pia kinaweza kumaanisha kusujudu au kutoa heshima; uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Utajitupa chini” ni lugha ya kawaida inayoonyesha tendo la makusudi, huku “kuniabudu” ikibeba uzito wa muktadha bila kufuta upana wa neno la Kigiriki.
