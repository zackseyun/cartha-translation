  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: sw
  text: Makutano makubwa wakamfuata kutoka Galilaya, Dekapoli, Yerusalemu, Uyahudi, na ng’ambo ya Yordani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka upande wa pili wa Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: ukamfuata
  rationale: Kitenzi hiki ni aoristi tendaji; katika simulizi, “ukamfuata” ni Kiswahili cha kawaida kinachoonyesha kufuata kimwili bila kudai kwamba wote walikuwa tayari wanafunzi waliojitolea.
- source_word: ὄχλοι πολλοὶ
  choice: Umati mkubwa
  rationale: Muundo huu wa Kiswahili ni wa asili na unaonyesha idadi kubwa ya watu; “umati mwingi” si wa kawaida katika Kiswahili sanifu.
- source_word: ἀπὸ
  choice: kutoka
  rationale: Huonyesha chanzo au mahali walikotoka na inatawala orodha nzima ya maeneo.
- source_word: Γαλιλαίας
  choice: Galilaya
  rationale: Hili ndilo umbo la kawaida la jina la eneo hili katika Kiswahili.
- source_word: Δεκαπόλεως
  choice: Dekapoli
  rationale: Jina hili linarejelea eneo la miji kumi; umbo la kutoholewa “Dekapoli” ni fupi na linaeleweka katika muktadha wa kibiblia.
- source_word: Ἱεροσολύμων
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji katika Kiswahili.
- source_word: Ἰουδαίας
  choice: Uyahudi
  rationale: “Uyahudi” ni jina la eneo linalotumika kwa kawaida katika tafsiri za Kiswahili kwa Judea.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Yordani
  rationale: Huhifadhi maana ya eneo lililo upande mwingine wa Mto Yordani bila kulazimisha mtazamo maalumu wa kijiografia.
- source_word: καὶ ... καὶ ... καὶ
  choice: '..., ..., ..., na ...'
  rationale: Kiswahili cha kawaida hutumia koma katika orodha na “na” kabla ya kipengele cha mwisho; hivyo athari ya mkusanyiko wa maeneo inabaki bila kufanya sentensi kuwa nzito.
