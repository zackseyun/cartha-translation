  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: sw
  text: Naye, alipojibu, “Kutoka kwa watu wengine,” Yesu akamwambia, “Basi, wana hao wako huru.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Naye alipojibu
  rationale: Kirai huru cha umilikishi kinaonyesha wakati na δέ huendeleza simulizi. Kwa kuwa maneno hayo ni jibu la Petro kwa swali la mstari uliotangulia, “alipojibu” ni Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Kwa watu wengine
  rationale: Katika muktadha huu neno linawatofautisha wale wasio wa nyumba ya mfalme na wana wake. “Watu wengine” huepuka maana ya kikabila au kitaifa ambayo “wageni” inaweza kudokeza.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Hii ni njia ya kawaida na ya asili katika simulizi la Kiswahili ya kutafsiri kauli ya Yesu iliyoelekezwa kwake.
- source_word: Ἄρα γε
  choice: Basi
  rationale: “Basi” huonyesha hitimisho linalotokana na jibu la Petro bila kutumia lugha nzito kupita kiasi.
- source_word: ἐλεύθεροί
  choice: wako huru
  rationale: Huhifadhi maana ya msingi ya kuwa huru, huku muktadha wa kodi ukidokeza kutowajibika kuilipa; “wamesamehewa kodi” ingefinyaza maana hiyo.
- source_word: οἱ υἱοί
  choice: wana
  rationale: “Wana” huhifadhi maana ya wana wa kiume katika mfano wa mfalme na nyumba yake na pia mwangwi wa uhusiano wa uwana.
theological_decisions:
- issue: Tafsiri ya οἱ υἱοί katika mfano wa mfalme na wale wa nyumba yake
  choice: wana
  alternative: watoto
  rationale: Neno la Kigiriki ni la wana wa kiume kwa wingi, na mfano wa karibu unahusu wana wa mfalme kuhusiana na kodi. “Wana” huhifadhi uwana na tofauti ya kisheria ya walio wa nyumba yake bila kupanua kauli kimya kimya.
- issue: Maana ya uhuru katika ἐλεύθεροί
  choice: wako huru
  alternative: hawalipi kodi / hawawajibiki kuilipa
  rationale: Kauli pana ya chanzo imehifadhiwa. Muktadha unaonyesha msamaha wa wajibu wa kodi, lakini tafsiri haifungi maana ya uhuru katika kodi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “akamwambia” ni wa asili. Hakuna tanbihi iliyohitajika; utata halisi wa ἐλεύθεροί umehifadhiwa katika “wako huru,” na “watu wengine” inaeleweka kwa kulinganisha na wana wa mfalme.
