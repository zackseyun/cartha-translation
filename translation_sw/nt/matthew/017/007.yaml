  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: sw
  text: Yesu akawakaribia[a], akawagusa, akasema, “Inukeni[b], wala msiogope[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawajia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Simameni.” Amri hii inahusu kuinuka kutoka mahali walipokuwa wameanguka.
    reason: lexical_alternative
  - marker: c
    text: Au, “wala msiwe na hofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: akawakaribia
  rationale: Kitenzi προσέρχομαι huonyesha kusogea kuelekea kwa watu fulani. “Akawakaribia” ni Kiswahili cha kawaida kinachohifadhi mwendo wa Yesu kuelekea kwa wanafunzi.
- source_word: ἁψάμενος αὐτῶν
  choice: akawagusa
  rationale: Kirai hiki humaanisha kuwagusa. Muundo wa vitenzi vinavyofuatana ni wa asili katika simulizi la Kiswahili na hauongezi wazo la kuweka mkono juu yao, ambalo halijaelezwa wazi katika Kigiriki.
- source_word: εἶπεν
  choice: akasema
  rationale: “Akasema” ni tafsiri ya moja kwa moja na isiyo na ufafanuzi wa ziada ya λέγω katika muktadha huu.
- source_word: Ἐγέρθητε
  choice: Inukeni
  rationale: Amri hii inawaita wanafunzi kuinuka kutoka mahali walipoanguka kifudifudi. “Inukeni” ni ya kawaida na haiainishi kupita kiasi kwamba lazima wasimame wima.
- source_word: μὴ φοβεῖσθε
  choice: wala msiogope
  rationale: “Msiogope” hutoa kwa kawaida amri ya kutokuwa na hofu. “Wala” huunganisha amri ya pili kwa mtiririko wa asili bila kuongeza maana.
- source_word: καὶ
  choice: aka- / wala
  rationale: Viunganishi vya Kigiriki vinaonyesha mfululizo wa matendo na kuunganisha amri. Katika Kiswahili, kiambishi simulizi “aka-” na “wala” vinatoa mtiririko huo kwa ufasaha.
theological_decisions:
- issue: Kutoa amri ya Yesu ya kutia moyo bila kuongeza ufafanuzi wa kichungaji
  choice: Inukeni, wala msiogope
  alternative: Simameni, na acheni kuogopa
  rationale: Tafsiri inadumisha matendo ya Yesu ya kuwakaribia na kuwagusa pamoja na amri yake ya moja kwa moja, bila kuamua kwamba hali ya kuogopa ilikuwa lazima tayari inaendelea au kwamba walipaswa kusimama wima kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Mfululizo wa “aka-” umetumiwa kuwasilisha vitendo vya simulizi kwa ufasaha.
