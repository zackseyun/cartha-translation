id: MAT.17.2
reference: Matthew 17:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: sw
  text: Akageuka sura mbele yao[a]; uso wake ukang’aa kama jua, na mavazi yake yakawa meupe kama nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akabadilishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: akageuka sura
  rationale: Kitenzi hiki huonyesha badiliko la sura linaloonekana. ‘Akageuka sura’ ni usemi wa kawaida katika Kiswahili cha Biblia na unafaa kwa muktadha wa utukufu unaodhihirika bila kuongeza maelezo yasiyo katika Kigiriki.
- source_word: ἔμπροσθεν αὐτῶν
  choice: mbele yao
  rationale: Hutoa kwa ufupi maana ya tukio kutokea machoni pao na katika uwepo wao.
- source_word: ἔλαμψεν
  choice: ukang’aa
  rationale: Kitenzi ‘kung’aa’ huwasilisha moja kwa moja kutoa mwanga, kama inavyodaiwa na λάμπω hapa.
- source_word: πρόσωπον
  choice: uso
  rationale: Katika muktadha huu πρόσωπον ni uso halisi wa Yesu.
- source_word: ὡς ὁ ἥλιος
  choice: kama jua
  rationale: ‘Kama’ huhifadhi tashbihi iliyoletwa na ὡς kwa Kiswahili cha kawaida.
- source_word: ἱμάτια
  choice: mavazi
  rationale: ‘Mavazi’ ni neno la kawaida, lenye hadhi, na pana kwa nguo alizovaa.
- source_word: ἐγένετο λευκὰ
  choice: yakawa meupe
  rationale: Huhifadhi badiliko la hali lililo katika ἐγένετο pamoja na sifa ya weupe bila kuongeza kiwango cha mng’ao.
- source_word: ὡς τὸ φῶς
  choice: kama nuru
  rationale: ‘Kama nuru’ ni tashbihi ya asili katika Kiswahili na huhifadhi φῶς kama nomino badala ya kuibadili kuwa kivumishi kama ‘angavu.’
theological_decisions:
- issue: Uwasilishaji wa tukio la kugeuka sura
  choice: akageuka sura
  alternative: akabadilishwa
  rationale: ‘Akageuka sura’ hudokeza badiliko la mwonekano lililodhihirika kwa wanafunzi na linafaa kwa muktadha wa uso na mavazi kung’aa; ‘akabadilishwa’ ni pana zaidi na huacha aina ya badiliko bila kubainika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo (‘akageuka… ukang’aa… yakawa’) unasimulia tukio kwa urahisi. Alama [a] imewekwa mara baada ya neno linalohusika.
