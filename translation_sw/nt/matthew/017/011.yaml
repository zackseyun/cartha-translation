translation:
  language: sw
  text: Akajibu, “Eliya kweli anakuja[a] na atarejesha vitu vyote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Eliya huja na atarejesha vitu vyote.” Kitenzi cha Kigiriki kilicho katika wakati wa sasa, “anakuja/huja,” hapa kina maana inayoelekea wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Akajibu
  rationale: Muundo wa kishiriki pamoja na kitenzi ni namna ya kawaida ya Kigiriki iliyoathiriwa na Kisemiti. ‘Akajibu’ ni Kiswahili cha asili kinachohifadhi maana ya kuitikia bila urudiaji usio wa lazima wa ‘akajibu akasema’.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: μέν
  choice: Ni kweli
  rationale: μέν inasisitiza kauli na kutayarisha utofautishaji unaofuata katika mstari unaofuata. ‘Ni kweli’ huhifadhi nguvu hiyo kwa Kiswahili cha kawaida bila kulazimisha muundo wa ‘kwa upande mmoja’.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Ingawa kitenzi kiko katika wakati wa sasa kwa umbo, muktadha wake unaelekea wakati ujao. ‘Anakuja’ huhifadhi umbo hai la sasa pamoja na maana ya matarajio.
- source_word: ἀποκαταστήσει
  choice: atarejesha
  rationale: Kitenzi cha wakati ujao kinaonyesha tendo la baadaye. ‘Atarejesha’ ni tafsiri ya moja kwa moja isiyofafanua kupita kiasi hali ya urejesho huo.
- source_word: πάντα
  choice: vitu vyote
  rationale: Wingi wa kisifa wa jinsia ya kati una maana pana na jumuishi. ‘Vitu vyote’ huhifadhi upana huo bila kutaja vitu ambavyo maandiko hayavitaji.
theological_decisions:
- issue: Asili na upeo wa kazi ya Eliya ya kurejesha
  choice: atarejesha vitu vyote
  alternative: ataweka kila kitu sawa
  rationale: Kigiriki kinaeleza urejesho kwa upana bila kufafanua upeo wake katika mstari huu. Tafsiri hii inadumisha mvutano huo wa kiteolojia bila kuubana kuwa uamsho wa kiroho, mageuzi ya kijamii, au utimilifu wa nyakati za mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili kwa wasomaji wa kawaida huku ikihifadhi msisitizo wa μέν, mwelekeo wa baadaye wa ἔρχεται, na upana wa πάντα.
