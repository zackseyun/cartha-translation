  text: Wanafunzi waliposikia, wakaanguka kifudifudi[b] na wakaogopa sana[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kwa maana ya karibu, “wakaanguka juu ya uso wao,” yaani walianguka huku nyuso zao zikielekea chini.
