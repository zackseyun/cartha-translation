lexical_decisions:
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaelezwa kwa kishazi cha wakati, ambacho ni cha kawaida katika Kiswahili. Neno “hayo” linaelekeza kwa yaliyosikika katika muktadha, yaani sauti ya mstari uliotangulia, ingawa Kigiriki hakitaji yambwa waziwazi.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida katika Injili kwa wale waliomfuata Yesu na kujifunza kwake.
- source_word: ἔπεσαν
  choice: wakaanguka
  rationale: Linadumisha maana ya moja kwa moja ya πίπτω bila kuongeza kwamba walijitupa chini kwa hiari.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: kifudifudi
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuanguka uso ukielekea chini; unahifadhi mkao wa mwili bila kuutafsiri moja kwa moja kuwa tendo la ibada.
- source_word: ἐφοβήθησαν
  choice: wakaogopa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya φοβέομαι, inayoeleza hali yao bila kuamua kama ilikuwa hofu kuu, kicho, au vyote viwili.
- source_word: σφόδρα
  choice: sana
  rationale: Kielezi hiki cha kawaida kinaonyesha wazi kiwango kikubwa cha hofu kilicho katika σφόδρα.
theological_decisions:
- issue: Asili ya mwitikio wa wanafunzi kwa sauti ya Mungu
  choice: Mkao wao wa kifudifudi na hofu yao kubwa vinaelezwa bila kuutaja mwitikio huo moja kwa moja kuwa ibada au hofu ya kutishwa.
  alternative: Kutafsiri kifungu hicho kana kwamba kinamaanisha hasa ibada yenye kicho, au hasa hofu kuu mbele ya ufunuo wa Mungu.
  rationale: Kigiriki kinaeleza mkao wa mwili na kuogopa sana, lakini hakifafanui zaidi maana ya kitheolojia ya mwitikio huo; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kifudifudi” ni neno la kawaida linaloeleweka kwa urahisi; mfuatano wa “waka-” unadumisha mwendo wa simulizi.
