reference: Matthew 17:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: sw
  text: Nao wanafunzi wakamwuliza, “Kwa nini basi waandishi husema kwamba Eliya lazima aje kwanza?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: wakamuuliza
  rationale: Kitenzi hiki kinaanzisha swali la moja kwa moja; “wakamuuliza” ni Kiswahili cha kawaida na huonyesha wazi kwamba walimwuliza Yesu.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Kibainishi cha Kigiriki kinaonyesha kundi linalojulikana tayari katika muktadha. Kiswahili hakihitaji kuongeza “wake,” kwa kuwa neno hilo halipo katika Kigiriki.
- source_word: λέγοντες
  choice: '[imewasilishwa kwa kuanzisha nukuu moja kwa moja]'
  rationale: Kirai halisi “wakisema” kingekuwa kizito baada ya “wakamuuliza.” Nukuu ya moja kwa moja inatimiza kazi ya participio kwa Kiswahili cha asili bila kupoteza maudhui.
- source_word: Τί οὖν
  choice: Kwa nini basi
  rationale: Katika muundo huu, τί huulizia sababu, si kitu; “Kwa nini basi” huwasilisha maana hiyo pamoja na nguvu ya οὖν.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika mazingira ya Injili, hawa ni wataalamu wa kunakili na kufundisha Maandiko na sheria. “Waandishi wa sheria” ni wazi zaidi kwa msomaji wa kawaida kuliko “waandishi” peke yake.
- source_word: λέγουσιν ὅτι
  choice: husema kwamba
  rationale: Wakati wa sasa hapa unaonyesha fundisho au dai lao la kawaida; “husema kwamba” huingiza kishazi cha maudhui kwa njia ya asili.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii Elijah katika matumizi ya Biblia ya Kiswahili.
- source_word: δεῖ ἐλθεῖν
  choice: lazima ... aje
  rationale: “Lazima” huhifadhi wazo la ulazima katika δεῖ, huku “aje” ikiwa muundo wa kawaida wa Kiswahili baada ya lazima.
- source_word: πρῶτον
  choice: kwanza
  rationale: Neno hili hudumisha mpangilio wa matukio unaodokezwa na Kigiriki bila kuongeza ufafanuzi.
theological_decisions:
- issue: Nguvu ya kitafsiri ya swali la wanafunzi kuhusu kuja kwa Eliya
  choice: Swali limetafsiriwa bila kuonyesha mapema kama wanafunzi wanapinga, wanakubali, au wanataka kusahihishiwa fundisho la waandishi wa sheria.
  alternative: Tafsiri ingeweza kudokeza shaka kwa waandishi wa sheria au kuingiza moja kwa moja msingi wa unabii wa Malaki.
  rationale: Kigiriki kinaripoti swali lenyewe, na jibu katika mistari inayofuata ndilo linalofafanua uhusiano wake na kuja kwa Eliya. Tafsiri haipaswi kutatua mapema mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa asili kwa msomaji wa kawaida; hakuna alama za tanbihi zinazohitajika.
