id: MAT.17.5
reference: Matthew 17:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: sw
  text: Alipokuwa bado anasema, tazama, wingu lenye kung’aa likawafunika[a]; na tazama, sauti kutoka katika lile wingu ikasema, “Huyu ni Mwanangu mpendwa, ambaye nimependezwa naye. Msikilizeni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno lililotafsiriwa “likawafunika” linaweza kudokeza lugha ya Biblia kuhusu wingu linaloashiria uwepo wa Mungu.
    reason: cross_reference
  - marker: b
    text: Au “Msikieni.” Amri ya Kigiriki inaweza kumaanisha kusikia kwa maana ya kumsikiliza na kuzingatia asemayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Alipokuwa bado anasema
  rationale: Muundo wa genitivi huru unaonyesha tendo lililokuwa likiendelea wakati jambo jingine lilipotokea; ‘bado’ inadumisha maana ya kukatizwa.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili la kuelekeza usikivu limetafsiriwa katika sehemu zote mbili ili kuhifadhi msisitizo na uhai wa tukio.
- source_word: νεφέλη φωτεινὴ
  choice: wingu lenye kung’aa
  rationale: Hutoa maana ya wingu angavu au linalong’aa bila kufafanua zaidi ishara yake ya kitheolojia.
- source_word: ἐπεσκίασεν
  choice: likawafunika
  rationale: Katika muktadha wa wingu, ‘funika’ ni Kiswahili cha kawaida kinachoweza kueleza wingu kuwafunika, huku dokezo la uwepo wa Mungu likibaki wazi kupitia tanbihi.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: sauti kutoka katika lile wingu ikasema
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha wazi chanzo cha sauti.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Mwanangu mpendwa
  rationale: Huhifadhi utambulisho wa Mwana na maana ya kupendwa katika lugha fupi, ya kawaida na yenye heshima.
- source_word: ἐν ᾧ εὐδόκησα
  choice: ambaye nimependezwa naye
  rationale: Huhifadhi hali ya kitenzi cha Kigiriki na uhusiano unaoelezwa, bila kubadili kauli kuwa fundisho lililopanuliwa.
- source_word: ἀκούετε αὐτοῦ
  choice: Msikilizeni
  rationale: Amri hii inaweza kumaanisha kusikia kwa makini na kutii; ‘msikilizeni’ hubeba nguvu hiyo bila kufafanua moja kwa moja kuwa ‘mtiini.’
theological_decisions:
- issue: Kauli ya Mungu kuhusu utambulisho wa Yesu
  choice: Huyu ni Mwanangu mpendwa, ambaye nimependezwa naye
  alternative: Huyu ni Mwanangu, Mpendwa, ninayependezwa naye
  rationale: Tafsiri inahifadhi kauli ya moja kwa moja kuhusu Yesu kuwa Mwana, pamoja na upendo na kupendezwa, bila kuingiza istilahi za kimadhehebu zisizotajwa katika mstari.
- issue: Nguvu ya ἀκούετε αὐτοῦ
  choice: Msikilizeni
  alternative: Msikieni
  rationale: ‘Msikilizeni’ huonyesha usikivu wenye kuitikia, lakini haifungi kabisa uwezekano wa maana ya msingi ya kusikia.
- issue: Dokezo la kitheofania katika ἐπεσκίασεν
  choice: likawafunika
  alternative: likawatia chini ya uvuli wake
  rationale: Neno la kawaida limewekwa katika matini kuu, na uwezekano wa mwangwi wa lugha ya uwepo wa Mungu umeelezwa katika tanbihi badala ya kuamuliwa ndani ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tazama’ limedumishwa mara mbili ili kuonyesha viashiria vya usikivu vya Kigiriki; ‘lile wingu’ hurejelea kwa uwazi wingu lililotajwa mara moja kabla.
