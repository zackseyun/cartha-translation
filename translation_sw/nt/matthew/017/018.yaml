  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: sw
  text: Yesu akamkemea pepo, naye pepo akamtoka; yule mvulana akapona tangu saa ile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: akamkemea
  rationale: ‘Kukemea’ huwasilisha tendo la kukaripia kwa mamlaka na linafaa katika muktadha wa kumtoa pepo.
- source_word: αὐτῷ
  choice: -m- katika ‘akamkemea’
  rationale: Kiwakilishi cha Kigiriki kinaweza kisarufi kurejelea mvulana au pepo, lakini muktadha wa karibu unaelekeza kwa pepo. Kiswahili hutumia kiambishi cha ngeli ya mtu kwa pepo.
- source_word: τὸ δαιμόνιον
  choice: yule pepo
  rationale: ‘Pepo’ ni neno la kawaida na linaloeleweka kwa δαιμόνιον; ‘yule’ humtambulisha pepo aliyetajwa katika simulizi.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: akamtoka
  rationale: Usemi huu mfupi na wa asili katika Kiswahili unaonyesha wazi kwamba pepo alitoka ndani ya mvulana.
- source_word: ἐθεραπεύθη
  choice: akapona
  rationale: Kitenzi hiki cha hali hutafsiri kwa asili matokeo ya kuponywa bila kulazimisha maelezo ya kitabibu.
- source_word: ὁ παῖς
  choice: yule mvulana
  rationale: Muktadha unamhusu mwana wa kiume wa baba huyo; ‘mvulana’ ni sahihi zaidi kuliko ‘mtoto’ na huepuka maana ya ‘mtumishi’.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: tangu saa ile
  rationale: Huhifadhi kwa ukaribu usemi wa wakati wa Kigiriki na bado ni Kiswahili kinachoeleweka.
theological_decisions:
- issue: Rejeleo la αὐτῷ katika tendo la Yesu kukemea
  choice: Kukemea kunaelekezwa kwa pepo
  alternative: Yesu alimkemea mvulana
  rationale: Kishazi kinachofuata mara moja, kwamba pepo alimtoka mvulana, kinaunga mkono kwa nguvu kwamba aliyekemewa alikuwa pepo. Tafsiri haiongezi nomino ‘pepo’ ndani ya kishazi cha kwanza, hivyo inadumisha kwa kiasi umbo la kiwakilishi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa ‘aka-’ unafaa kwa usimulizi. Hakuna tanbihi inayohitajika; tofauti ya ‘tangu saa ile’ na ‘tangu wakati huo’ ni ya kimtindo zaidi kuliko ya maana.
