  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: sw
  text: Ndipo wanafunzi wakamwendea Yesu faraghani, wakasema, “Kwa nini sisi hatukuweza kumtoa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi cha Kigiriki kinaweza kumrejelea pepo, au kumrejelea mvulana.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Kiunganishi cha wakati kinachoendeleza mfululizo wa matukio kwa lugha ya asili ya simulizi la Kiswahili.
- source_word: προσελθόντες
  choice: wakamwendea
  rationale: Huwasilisha tendo la kuwakaribia au kuwaendea watu, na huunganika kwa kawaida na kitenzi kikuu katika masimulizi ya Kiswahili.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Neno la kawaida na lililoeleweka katika Injili kwa wale waliokuwa wakimfuata na kujifunza kwa Yesu.
- source_word: τῷ Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili; kiambishi cha yambwa katika “wakamwendea” kinaonyesha uhusiano unaobebwa na dativu ya Kigiriki.
- source_word: κατ’ ἰδίαν
  choice: faraghani
  rationale: Hueleza kwamba walizungumza naye pasipo wengine, kwa usemi mfupi, wa sasa, na wenye heshima.
- source_word: εἶπον
  choice: wakasema
  rationale: Hufuata maana ya kawaida ya λέγω, huku swali lenyewe likionyesha kwamba walikuwa wakiuliza.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi huru kinahifadhi mkazo wa kiwakilishi cha Kigiriki, yaani, kwa nini wao hasa hawakuweza.
- source_word: οὐκ ἠδυνήθημεν
  choice: hatukuweza
  rationale: Hutoa kwa kawaida maana ya kutokuwa na uwezo katika tukio hilo la wakati uliopita.
- source_word: ἐκβαλεῖν
  choice: kumtoa
  rationale: Kitenzi “kutoa” kinafaa katika muktadha wa kumtoa pepo, na pamoja na kiambishi cha yambwa kinaweza pia kubaki wazi kuhusu anayerejelewa.
- source_word: αὐτό
  choice: -m- katika “kumtoa”
  rationale: Kiambishi cha yambwa hai katika Kiswahili kinaweza kumrejelea pepo au mvulana, hivyo kinahifadhi kwa kiasi kikubwa uwezekano wa marejeo yote mawili uliopo katika muktadha.
theological_decisions:
- issue: Anayerejelewa na αὐτό katika muktadha wa kutoa pepo
  choice: Tafsiri “kumtoa” imeachwa iweze kumrejelea pepo, ambaye ndiye anayeelekea zaidi kurejelewa katika muktadha.
  alternative: Inaweza pia kueleweka kuwa ni kumtoa mvulana katika hali au mamlaka ya pepo.
  rationale: Muktadha unahusu kushindwa kwa wanafunzi kumtoa pepo, lakini kiwakilishi chenyewe hakimtaji wazi. Kiswahili kinaruhusu tafsiri inayobaki ya kawaida bila kufuta kabisa uwezekano wa kumrejelea mvulana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi lenye hadhi lakini rahisi kueleweka. “Ndipo” na mfululizo wa vitenzi vya “waka-” huleta mwendo wa kawaida wa simulizi; “faraghani” ni rasmi kiasi bila kuwa ya kizamani.
