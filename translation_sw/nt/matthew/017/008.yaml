  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: sw
  text: Nao walipoinua macho yao, hawakuona mtu yeyote ila Yesu peke yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia “isipokuwa,” kiwakilishi cha msisitizo (“yeye”) kabla ya jina Yesu, na “peke yake,” hivyo kikikazia kwamba Yesu ndiye pekee aliyeonekana.
    reason: Ufafanuzi wa msisitizo wa kileksika
lexical_decisions:
- source_word: ἐπάραντες
  choice: walipoinua
  rationale: Kauli ya wakati yenye “-lipo-” huonyesha kwa Kiswahili cha kawaida kwamba kuinua macho kulitokea kabla ya kuona, huku ikihifadhi mtiririko wa kitenzi-shirikishi cha Kigiriki.
- source_word: δὲ
  choice: Nao
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza simulizi; “Nao” kinaunganisha sentensi bila kuingiza upinzani usiokuwapo.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: macho yao
  rationale: Tafsiri hii huhifadhi usemi halisi wa kiungo cha mwili badala ya kuugeuza kuwa dhana ya jumla kama “mtazamo wao.”
- source_word: οὐδένα
  choice: yeyote
  rationale: Baada ya kitenzi hasi “hawakumwona,” “yeyote” ni usemi wa kawaida na wazi wa kumaanisha kwamba hawakumwona mtu mwingine.
- source_word: εἶδον
  choice: hawakumwona
  rationale: Kitenzi rahisi cha kuona kimetafsiriwa moja kwa moja; kiambishi cha ngeli ya mtu kinafaa kwa yule anayeonekana.
- source_word: εἰ μὴ
  choice: ila
  rationale: Baada ya kauli hasi, “ila” hutoa maana ya ubaguzi, yaani “isipokuwa,” kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: αὐτὸν
  choice: yeye
  rationale: Kiwakilishi kimetajwa wazi ili kuhifadhi msisitizo wa Kigiriki kabla ya jina Yesu.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: μόνον
  choice: peke yake
  rationale: Usemi huu huhifadhi msisitizo wa mwisho kwamba Yesu ndiye pekee aliyeonekana.
theological_decisions:
- issue: Msisitizo kwamba Yesu ndiye pekee aliyebaki kuonekana baada ya maono
  choice: ila yeye, Yesu peke yake
  alternative: ila Yesu peke yake
  rationale: 'Kigiriki kinakusanya usemi wa ubaguzi εἰ μὴ, kiwakilishi αὐτὸν, na μόνον. Kutaja “yeye” pamoja na “peke yake” kunahifadhi msisitizo huo bila kudai zaidi ya tukio lenyewe: Musa na Eliya hawakuonekana tena, na Yesu pekee ndiye aliyeonekana.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Muundo “ila yeye, Yesu peke yake” ni wa kimakusudi ili kuhifadhi msisitizo maradufu wa Kigiriki.
