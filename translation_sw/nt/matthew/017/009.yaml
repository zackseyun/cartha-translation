  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: sw
  text: Walipokuwa wakishuka kutoka mlimani, Yesu aliwaamuru akisema, “Msimwambie mtu yeyote kuhusu maono hayo[a] mpaka Mwana wa Adamu atakapofufuliwa kutoka kwa wafu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo mliyoyaona.” Kigiriki kinasema “maono.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa karibu zaidi na Kigiriki, “kutoka miongoni mwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Walipokuwa wakishuka kutoka mlimani
  rationale: Muundo huu unaonyesha kwamba kushuka kulikuwa kukiendelea wakati Yesu alipotoa amri, huku Kiswahili cha kawaida kikiepuka urudiaji usio wa lazima wa ‘chini kutoka.’
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Yesu aliwaamuru akisema
  rationale: ‘Aliwaamuru’ inadumisha uzito wa agizo, na ‘akisema’ inaakisi kishirikishi cha Kigiriki bila kubadili utangulizi wa maneno ya Yesu.
- source_word: Μηδενὶ εἴπητε
  choice: Msimwambie mtu yeyote
  rationale: Hii ni njia ya kawaida na yenye mkazo wa kutosha ya kutoa katazo hili katika Kiswahili.
- source_word: τὸ ὅραμα
  choice: maono haya
  rationale: ‘Maono’ inadumisha maana ya tukio lililoonekana na hali yake ya ufunuo; ‘haya’ huyatambulisha kuwa maono yaliyotajwa katika simulizi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Tafsiri hii ya cheo cha Yesu inadumisha lugha ya chanzo na mwangwi wake wa kimaandiko bila kuifafanua kwa namna ya kimadhehebu.
- source_word: ἐκ νεκρῶν ἐγερθῇ
  choice: atakapofufuliwa kutoka kwa wafu
  rationale: ‘Atakapofufuliwa’ inadumisha kauli tendwa ya Kigiriki, na ‘kutoka kwa wafu’ ni usemi wa kawaida wa Kiswahili kuhusu ufufuo.
theological_decisions:
- issue: Kauli na mtendaji katika ufufuo
  choice: atakapofufuliwa kutoka kwa wafu
  alternative: atakapofufuka kutoka kwa wafu
  rationale: Kigiriki kina kauli tendwa. Tafsiri ya ‘atakapofufuliwa’ inadumisha muundo huo na uwezekano wa tendo la Mungu bila kumtaja mtendaji ambaye mstari wenyewe hamtaji wazi.
- issue: Maana ya ὅραμα
  choice: maono haya
  alternative: mambo mliyoyaona
  rationale: ‘Maono’ huhifadhi maana ya moja kwa moja na uzito wa kiufunuo wa neno la Kigiriki; mbadala ni wa asili zaidi lakini unafafanua neno hilo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mwendo wa simulizi na uzito wa amri bila kuwa ngumu kupita kiasi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika: [a] baada ya ‘maono haya’ na [b] baada ya ‘wafu.’'
