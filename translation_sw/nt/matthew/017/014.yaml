lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka tukio lililotangulia bila kuongeza wazo jipya.
- source_word: ἐλθόντων πρὸς τὸν ὄχλον
  choice: walipoufikia umati
  rationale: Kirai cha wakati chenye kitenzi cha wingi kimetafsiriwa kwa Kiswahili cha kawaida; mhusika wa wingi anaeleweka kutokana na muktadha.
- source_word: προσῆλθεν αὐτῷ
  choice: akamjia
  rationale: Kitenzi kinaonyesha mtu huyo alimkaribia Yesu; ‘akamjia’ ni cha kawaida na huhifadhi mwelekeo wa tendo bila kulazimika kurudia jina lisilomo katika mstari huu.
- source_word: ἄνθρωπος
  choice: mtu mmoja
  rationale: Katika muktadha huu neno linamtaja mtu fulani mmoja. Kiswahili ‘mtu mmoja’ humtambulisha kwa kawaida bila kuingiza madai mapana kuhusu jinsia yasiyohitajika katika sentensi hii.
- source_word: γονυπετῶν αὐτὸν
  choice: akipiga magoti mbele yake
  rationale: Umbo la wakati wa sasa linaonyesha tendo au hali iliyoambatana na kumjia; tafsiri hii inaweka wazi mkao wa mwili na haiongezi kwa lazima maana maalumu ya ibada.
theological_decisions:
- issue: Ikiwa γονυπετῶν itaelezwa moja kwa moja kuwa tendo la ibada
  choice: akipiga magoti mbele yake
  alternative: akimsujudia
  rationale: Chanzo kinaeleza tendo la kupiga magoti mbele ya Yesu, ambalo linaweza kuonyesha heshima au ombi la dhati. ‘Akimsujudia’ lingeweza kufunga mapema maana yake kuwa ibada, hivyo tafsiri imehifadhi mvutano wa muktadha.
- issue: Kutaja jinsia katika ἄνθρωπος
  choice: mtu mmoja
  alternative: mwanamume mmoja
  rationale: ἄνθρωπος hapa humtaja mtu binafsi, na jinsia yake ya kiume inadhihirika zaidi katika simulizi linalofuata. ‘Mtu mmoja’ ni ya asili katika Kiswahili na haibadili utambulisho wake wala kuleta dai la kiteolojia kuhusu wanadamu kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. ‘Umati’ ni neno linaloeleweka kwa urahisi, na mfululizo wa ‘walipoufikia … akamjia … akipiga’ unaonyesha wakati na matendo yanayoambatana kwa ufasaha.
