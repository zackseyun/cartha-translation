  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: sw
  text: nao watamuua, na siku ya tatu atafufuliwa.[a] Nao wakahuzunika sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “atafufuka.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa: “atafufuliwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: watamuua
  rationale: Kitenzi cha wakati ujao pamoja na kiwakilishi cha yambwa kimetafsiriwa kwa njia ya moja kwa moja na ya kawaida; ‘watamuua’ hakiongezi wazo la kisheria au la mauaji ya kukusudia ambalo halijaelezwa wazi na kitenzi chenyewe.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: siku ya tatu
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha wakati maalumu, na inahifadhi usemi wa Kigiriki bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐγερθήσεται
  choice: atafufuliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na ni usemi wa kawaida wa Kiswahili kuhusu kufufuliwa kutoka kwa wafu.
- source_word: ἐλυπήθησαν σφόδρα
  choice: wakahuzunika sana
  rationale: ‘Wakahuzunika’ huonyesha mwitikio wao wa huzuni katika mfululizo wa simulizi, na ‘sana’ huhifadhi nguvu ya kielezi σφόδρα kwa Kiswahili cha kawaida.
- source_word: καὶ ... καὶ ... καὶ
  choice: nao ... na ... Nao
  rationale: Viunganishi vinadumisha mtiririko sahili wa Kigiriki; ‘nao’ pia huweka wazi kuwa wanafunzi waliotajwa katika muktadha uliotangulia ndio waliohuzunika.
theological_decisions:
- issue: Kauli ya kutendwa au kutenda katika utabiri wa ufufuo
  choice: atafufuliwa
  alternative: atafufuka
  rationale: Kigiriki kina kitenzi cha hali ya kutendwa. ‘Atafufuliwa’ huhifadhi umbo hilo na uwezekano wa tendo la Mungu bila kutaja mtendaji moja kwa moja, wala bila kukataa usemi mbadala wa kwamba Yesu atafufuka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia viambishi vya mfululizo kwa mtiririko wa kawaida, huku hali ya kutendwa katika utabiri wa ufufuo ikihifadhiwa.
