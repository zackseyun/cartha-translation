  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: sw
  text: Walipokuwa wakikusanyika katika Galilaya[a], Yesu akawaambia, “Mwana wa Adamu anakaribia kukabidhiwa[b] mikononi mwa watu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokuwa wamekusanyika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutiwa mikononi mwa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: Walipokuwa wakikusanyika pamoja
  rationale: Kirai hiki kinahifadhi maana ya kundi kukusanyika au kuwa pamoja, bila kuongeza wazo lisilo wazi la kusafiri. Umbo la ‘walipokuwa’ pia linaonyesha hali iliyokuwapo Yesu aliposema.
- source_word: δὲ
  choice: Walipokuwa …, Yesu akawaambia
  rationale: Kiunganishi hiki kimewakilishwa kwa mtiririko wa sentensi ya Kiswahili badala ya kutafsiriwa kwa neno tofauti; kinaunganisha mazingira ya Galilaya na kauli ya Yesu.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: huko Galilaya
  rationale: Hii ni tafsiri ya kawaida ya mahali. ‘Huko’ hufanya sentensi isikike ya asili katika Kiswahili bila kubadili maana.
- source_word: εἶπεν αὐτοῖς
  choice: Yesu akawaambia
  rationale: ‘Akawaambia’ ni njia ya kawaida na yenye heshima ya kutafsiri kitendo cha kusema kwa watu fulani.
- source_word: Μέλλει
  choice: yuko karibu
  rationale: Inahifadhi wazo la jambo linalokaribia kutokea bila kuongeza maana yenye nguvu zaidi ya kuamuliwa na hatima.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la kimapokeo katika Kiswahili na linahifadhi umbo la Kigiriki pamoja na mwangwi wake wa kimaandiko na kitheolojia.
- source_word: παραδίδοσθαι
  choice: kukabidhiwa
  rationale: Neno hili linahifadhi hali ya kutendwa na maana pana ya kutiwa chini ya mamlaka ya wengine, bila kuifupisha maana kuwa kusalitiwa na Yuda pekee.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: mikononi mwa watu
  rationale: Nahau ya ‘mikononi mwa’ inahifadhi sitiari ya Kigiriki na inaeleweka wazi katika Kiswahili. ‘Watu’ ni tafsiri ya kawaida na jumuishi ya ἀνθρώπων hapa.
theological_decisions:
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ huhifadhi jina maalumu ambalo Yesu hutumia kujitaja na mahusiano yake ya kimaandiko; ‘Mwanadamu’ lingeweza kufifisha umuhimu huo.
- issue: Maana ya παραδίδοσθαι katika utabiri wa mateso
  choice: kukabidhiwa
  alternative: kutiwa mikononi; kusalitiwa
  rationale: ‘Kukabidhiwa’ huhifadhi hali ya kutendwa na uwezekano wa tabaka mbalimbali za uwakala katika simulizi. ‘Kusalitiwa’ kungeelekeza maana kwa msaliti pekee na hivyo kuibana zaidi ya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida huku ikihifadhi sitiari ya ‘mikononi mwa watu,’ hali ya kutendwa, na mvutano wa kitheolojia wa jina ‘Mwana wa Adamu.’
