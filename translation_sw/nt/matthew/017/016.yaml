  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: sw
  text: Nami nikamleta kwa wanafunzi wako, nao hawakuweza kumponya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: nikamleta kwa
  rationale: Katika muundo huu, kitenzi kina maana ya kumleta mtu kwa mtu mwingine. “Nikamleta kwa” ni Kiswahili cha kawaida na huonyesha kwa wazi yule aliyeletwa na wale alioletwa kwao.
- source_word: μαθηταῖς σου
  choice: wanafunzi wako
  rationale: Katika Injili, μαθητής humaanisha wanafunzi ambao pia ni wafuasi wa mwalimu. “Wanafunzi wako” ni tafsiri iliyo wazi na ya kawaida katika muktadha huu.
- source_word: οὐκ ἠδυνήθησαν
  choice: hawakuweza
  rationale: δύναμαι huonyesha uwezo. “Hawakuweza” hutoa maana hiyo kwa njia ya moja kwa moja na ya asili katika Kiswahili.
- source_word: θεραπεῦσαι
  choice: kumponya
  rationale: θεραπεύω hapa humaanisha kumrudishia mvulana afya. “Kumponya” ni neno la kawaida na linalofaa katika simulizi za uponyaji.
- source_word: καὶ ... καὶ
  choice: Nami ... lakini
  rationale: καί ya kwanza inaendeleza taarifa ya baba, hivyo “Nami” inaunganisha kauli hii na yaliyotangulia. Ingawa καί ya pili kimsingi ni kiunganishi, katika Kiswahili “lakini” huwasilisha kwa kawaida tofauti iliyomo kati ya kumleta kwa wanafunzi na kushindwa kwao, bila kuongeza sababu ya kushindwa.
- source_word: αὐτόν
  choice: -m- katika “nikamleta” na “kumponya”
  rationale: Viwakilishi vya yambwa vya Kiswahili huonyesha kwa kawaida kuwa anayerejelewa ni mvulana wa kiume aliyetajwa katika muktadha.
theological_decisions:
- issue: Asili ya kushindwa kwa wanafunzi
  choice: Kauli imetafsiriwa tu kuwa hawakuweza kumponya, bila kueleza sababu.
  alternative: Kusema wazi kwamba hawakuweza kumtoa pepo au kwamba walishindwa kwa sababu ya kutokuwa na imani.
  rationale: Mstari huu wenyewe unasema tu kwamba hawakuweza kumponya. Maelezo yanayotokana na mistari inayozunguka hayapaswi kuingizwa ndani ya tafsiri ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “Nami nikamleta” unafaa katika usimulizi unaoendelea; “hawakuweza kumponya” ni wa moja kwa moja na wa kawaida.
