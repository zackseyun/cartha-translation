id: MAT.17.1
reference: Matthew 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: sw
  text: Baada ya siku sita, Yesu akawachukua Petro, Yakobo na Yohana ndugu yake, akawapandisha juu ya mlima mrefu, wakiwa peke yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “faraghani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Baada ya siku sita
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati na pia kinadumisha uhusiano wa simulizi na yaliyotangulia.
- source_word: παραλαμβάνει
  choice: akawachukua
  rationale: Kitenzi kina maana ya kuwachukua waandamane naye. Katika simulizi la kawaida la Kiswahili, wakati uliopita wa mfululizo huwasilisha vitenzi vya sasa vya kihistoria vya Kigiriki kwa ufasaha.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petro, Yakobo na Yohana
  rationale: Haya ndiyo maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: Yohana ndugu yake
  rationale: Kirai kinaelekea kumtambulisha Yohana kuwa ndugu ya Yakobo; kiwakilishi “yake” kinahifadhi kwa kiasi muundo na uwezekano wa rejeo wa Kigiriki bila kuongeza jina lisilotajwa wazi.
- source_word: ἀναφέρει
  choice: akawapandisha
  rationale: Hapa kitenzi kinaonyesha kuwapeleka juu. “Kuwapandisha” ni cha asili katika muktadha wa kwenda mlimani na huepuka kurudia “kuwachukua.”
- source_word: εἰς ὄρος ὑψηλὸν
  choice: juu ya mlima mrefu
  rationale: Kirai kinaonyesha mahali pa kuelekea baada ya kupanda; “mlima mrefu” ni usemi wa kawaida wa Kiswahili kwa ὄρος ὑψηλόν.
- source_word: κατ’ ἰδίαν
  choice: wakiwa peke yao
  rationale: Maana ni kuwa Yesu na wale wanafunzi watatu walikuwa kando na wengine. Kauli hii ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Vitenzi vya sasa vya kihistoria katika simulizi la Injili
  choice: 'Kutumia wakati uliopita wa mfululizo: “akawachukua ... akawapandisha”'
  alternative: 'Kudumisha maumbo ya sasa: “anawachukua ... anawapandisha”'
  rationale: Ingawa Kigiriki hutumia wakati wa sasa kwa uchangamfu wa simulizi, Kiswahili sanifu husimulia mfululizo huu kwa kawaida zaidi kwa ka- ya wakati uliopita. Hii huhifadhi mwendo wa simulizi bila kubadili maana ya kitheolojia.
- issue: Rejeo la “ndugu yake”
  choice: Kuhifadhi “Yohana ndugu yake” bila kufafanua jina la mwenye ndugu katika matini kuu
  alternative: “Yohana, ndugu ya Yakobo”
  rationale: Muktadha unaelekeza sana kwa Yakobo, lakini Kigiriki chenyewe kinatumia kiwakilishi. Tafsiri haifanyi ufafanuzi huo kuwa wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matumizi ya “aka-” yanaendeleza mfululizo wa simulizi kwa ufasaha. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
