base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: sw
  text: Lakini ninawaambia kwamba Eliya amekwisha kuja, nao hawakumtambua[a], bali walimtendea mambo yote waliyotaka[b]. Vivyo hivyo, Mwana wa Adamu naye anakaribia kuteswa mikononi mwao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumjua” au “hawakumkubali.” Neno la Kigiriki linaweza kumaanisha kwamba hawakutambua vizuri utambulisho au jukumu lake.
    reason: lexical_alternative
  - marker: b
    text: Au, “walimfanyia yote waliyotaka” au “walimtendea walivyopenda.” Usemi wa Kigiriki unaonyesha kwamba walimtendea mambo yote waliyotaka, bila kizuizi.
    reason: lexical_alternative
  - marker: c
    text: Au, “ataenda kuteswa.” Kigiriki kinasema kwamba mateso ya Mwana wa Adamu yanakaribia kutokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: Kauli hii ya moja kwa moja ni ya asili katika Kiswahili cha sasa, huku “Lakini” ikihifadhi utofautishaji unaoletwa na δέ.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Eliya amekwisha kuja
  rationale: Jina limetolewa kwa umbo lake la kawaida la Kiswahili, na “amekwisha kuja” linaonyesha tendo lililokamilika ambalo lina umuhimu kwa hali ya sasa.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: hawakumtambua
  rationale: Katika muktadha huu ἐπιγινώσκω inahusu kushindwa kutambua utambulisho au jukumu lake, si kutokuwa na maarifa yoyote kumhusu.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: walimtendea chochote walichotaka
  rationale: Tafsiri hii ya kimatamshi inaeleza kwa Kiswahili cha kawaida kwamba walitenda juu yake bila kuzuiwa, kulingana na mapenzi yao.
- source_word: οὕτως καὶ
  choice: Vivyo hivyo ... naye
  rationale: Muundo huu unaonyesha wazi ulinganisho kati ya yaliyompata Eliya na yatakayompata Mwana wa Adamu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika tafsiri za Kiswahili, nalo linahifadhi mwangwi wake wa kibiblia bila kulifafanua kupita maandishi.
- source_word: μέλλει πάσχειν ὑπ’ αὐτῶν
  choice: yuko karibu kuteswa mikononi mwao
  rationale: “Yuko karibu” linaonyesha jambo linalokaribia kutokea bila kuongeza wazo lenye nguvu zaidi la kulazimika; “mikononi mwao” linaonyesha kwamba wao ndio watakaosababisha mateso hayo.
theological_decisions:
- issue: Utambulisho wa kuja kwa Eliya
  choice: Aya inaendelea kumtaja Eliya bila kuingiza jina la Yohana Mbatizaji katika maandishi.
  alternative: Kutaja wazi kwamba Eliya hapa ni Yohana Mbatizaji.
  rationale: Muktadha unaofuata unafafanua jinsi wanafunzi walivyoelewa kauli hiyo, lakini aya hii yenyewe inasema “Eliya”; kwa hiyo tafsiri inaacha utambulisho huo ufafanuliwe na muktadha.
- issue: Nguvu ya μέλλει kuhusu mateso ya Mwana wa Adamu
  choice: yuko karibu kuteswa
  alternative: amekusudiwa kuteswa
  rationale: Neno la Kigiriki linaonyesha mateso yanayokaribia, lakini kifungu hiki chenyewe hakitamki moja kwa moja ulazima wa kimungu; hivyo tafsiri haiongezi madai hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Amekwisha kuja” na “yuko karibu kuteswa” ni miundo inayoeleweka kwa urahisi; “mikononi mwao” huhifadhi uwakala wenye uhasama kwa njia ya kimatamshi.
