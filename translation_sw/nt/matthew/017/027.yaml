id: MAT.17.27
reference: Matthew 17:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: sw
  text: Lakini ili tusiwakwaze[a], nenda baharini, tupa ndoana, kisha mvute samaki wa kwanza atakayenasa. Ukifungua kinywa chake, utapata stateri[b]. Ichukue, uwape kwa ajili yangu na yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tusiwape sababu ya kujikwaa” au “tusiwachukize.”
    reason: lexical_alternative
  - marker: b
    text: Stateri ilikuwa sarafu yenye thamani ya karibu drakma nne, kiasi kilichotosha kulipa kodi ya hekalu kwa watu wawili.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: tusiwakwaze
  rationale: Neno hili linaweza kumaanisha kusababisha mtu ajikwae au kumpa sababu ya kuchukizwa. Katika muktadha huu linadokeza kuepuka kuwachukiza wakusanya kodi isivyo lazima, huku tafsiri ikidumisha mwangwi wa maana pana ya ‘kukwaza.’
- source_word: θάλασσαν
  choice: baharini
  rationale: Neno la Kigiriki ni ‘bahari.’ Ingawa hapa ni Bahari ya Galilaya, ambayo kijiografia ni ziwa, neno la chanzo limehifadhiwa.
- source_word: ἄγκιστρον
  choice: ndoana
  rationale: ‘Ndoana’ ni neno la kawaida na wazi la Kiswahili kwa kifaa kinachotajwa.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: samaki wa kwanza atakayepanda
  rationale: Kauli hii inadumisha taswira ya samaki wa kwanza anayepandishwa au kuja juu kutoka majini bila kuongeza kwamba tayari amenaswa.
- source_word: ἆρον
  choice: umchukue
  rationale: Katika mfululizo huu wa maagizo, kitenzi kinamaanisha kumchukua au kumwondoa samaki baada ya kupanda kutoka majini.
- source_word: στατῆρα
  choice: sarafu ya stateri
  rationale: Jina mahususi la sarafu limehifadhiwa kwa namna inayoweza kutamkwa kwa Kiswahili; thamani yake inaelezwa katika tanbihi.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: kwa ajili yangu na kwa ajili yako
  rationale: Hapa ἀντί huonyesha malipo yanayotolewa kwa niaba ya Yesu na Petro; usemi huu ni wa kawaida na haudokezi zaidi ya muktadha.
- source_word: πορευθεὶς
  choice: nenda
  rationale: Kirai cha kushiriki kina nguvu ya tendo linaloandamana na maagizo yanayofuata; ‘nenda’ ni ya asili katika Kiswahili.
- source_word: δὸς αὐτοῖς
  choice: uwape
  rationale: Kitu kinachotolewa ni sarafu iliyotajwa mara moja kabla; ‘uwape’ ni fupi na wazi, na muktadha unaonyesha kuwa ni malipo.
theological_decisions:
- issue: Maana ya σκανδαλίζω kuhusiana na Yesu kulipa kodi ya hekalu
  choice: Yesu anaagiza malipo yafanywe ili kuepuka kuwakwaza wakusanya kodi isivyo lazima, bila kufuta hoja iliyotangulia kwamba wana wako huru.
  alternative: Yesu analipa kwa sababu ana wajibu kamili wa kodi hiyo, au analipa kwa kusudi la kuonyesha muujiza pekee bila umuhimu wa kimaadili.
  rationale: 'Muktadha wa Mathayo 17:24–26 unasema kwamba wana wako huru, lakini mstari huu unaongeza sababu ya vitendo: ‘ili tusiwakwaze.’ Tafsiri inadumisha mvutano huo bila kuamua dai pana la kimafundisho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Bahari’ na ‘stateri’ zinahifadhi istilahi za chanzo, huku tanbihi zikisaidia pale ambapo ufafanuzi wa kitamaduni au wa kileksika unahitajika.
