id: MAT.17.17
reference: Matthew 17:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: sw
  text: Lakini Yesu akajibu, “Ee kizazi kisichoamini[a] na kilichopotoka[b], nitakuwa pamoja nanyi mpaka lini? Nitawavumilia mpaka lini? Mleteni hapa kwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kisicho na imani” au “kisichoaminifu.” Neno la Kigiriki linaweza kumaanisha kutokuamini au kutokuwa mwaminifu.
    reason: lexical_alternative
  - marker: b
    text: Au “kilichopindika” au “kilichoharibika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Lakini Yesu akajibu
  rationale: Muundo wa Kigiriki una maana ya kawaida ya ‘akajibu’; δέ hapa huonyesha mpito wenye mguso wa upinzani, unaowasilishwa kwa ‘Lakini.’
- source_word: Ὦ γενεὰ
  choice: Ee kizazi
  rationale: ‘Ee’ huhifadhi sauti nzito ya mwito na karipio, huku ‘kizazi’ kikidumisha maana ya kundi la watu wa wakati mmoja na mwangwi wa kinabii.
- source_word: ἄπιστος
  choice: kisichoamini
  rationale: Katika muktadha wa wanafunzi kushindwa kwa sababu ya upungufu wa imani, ‘kisichoamini’ huwasilisha maana kuu bila kuondoa uwezekano wa maana ya kutokuwa na imani.
- source_word: διεστραμμένη
  choice: kilichopotoka
  rationale: Hali timilifu inayoelezwa na neno hili ni ya kupindishwa au kupotoka kimaadili; ‘kilichopotoka’ ni ya asili, yenye uzito, na haifupishi maana kuwa kosa la muda mfupi.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: nitakuwa pamoja nanyi mpaka lini?
  rationale: Huhifadhi wakati ujao, uwepo pamoja nao, na swali la balagha la Kigiriki.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Nitawavumilia mpaka lini?
  rationale: ‘Kuwavumilia’ huonyesha kustahimili watu hao kwa uzito unaofaa, bila kutumia msemo wa mazungumzo mno.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Mleteni hapa kwangu
  rationale: Amri ya wingi φέρετέ inaelekezwa kwa waliopo wa kumleta mvulana kwa Yesu; ‘hapa kwangu’ huwakilisha ὧδε na μοι kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ἄπιστος katika karipio la Yesu
  choice: kisichoamini
  alternative: kisicho na imani / kisichoaminifu
  rationale: Muktadha unasisitiza ukosefu wa imani, lakini neno la Kigiriki linaweza pia kuelekea kwenye kutokuwa na uaminifu. Tafsiri kuu inafuata muktadha, na tanbihi inadumisha upana huo bila kuingiza hukumu pana ya kiagano.
- issue: Walengwa wa karipio ‘kizazi’
  choice: kizazi
  alternative: watu wa kizazi hiki
  rationale: Tafsiri ya moja kwa moja inadumisha kutobainika kwa upeo wa karipio—ikiwa linawalenga wanafunzi, umati, au kizazi kwa mapana—badala ya kuamua jambo ambalo mstari wenyewe haulielezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ee’ hudumisha sauti nzito ya karipio; sentensi za maswali ni wazi kwa msomaji wa kawaida. Viashiria vya tanbihi vimewekwa mara tu baada ya maneno vinayofafanua.
