  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: sw
  text: Walipofika Kapernaumu, watoza kodi ya drakma mbili[a][b] walimwendea Petro wakamwambia, “Je, mwalimu wenu halipi kodi ya drakma mbili?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “didrakma,” yaani kiasi cha drakma mbili; hii ilikuwa kodi ya hekalu.
    reason: cultural_note
  - marker: b
    text: Au, “wakusanyaji wa kodi ya didrakma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Walipofika
  rationale: Muundo huu wa Kigiriki unaonyesha hali ya wakati. “Walipofika” ni Kiswahili cha kawaida na huonyesha wazi kuwa jambo lililofuata lilitokea baada ya wao kufika; δέ haihitaji kutafsiriwa kwa kiunganishi tofauti hapa.
- source_word: Καφαρναοὺμ
  choice: Kapernaumu
  rationale: Jina la mahali limetoholewa kwa tahajia inayotambulika katika matumizi ya Biblia za Kiswahili.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: wale waliokusanya kodi ya drakma mbili
  rationale: Kirai hiki kinawatambulisha watu kwa kazi yao ya kupokea au kukusanya malipo ya didrakma. “Waliokusanya kodi” huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: προσῆλθον ... τῷ Πέτρῳ
  choice: walimwendea Petro
  rationale: Kitenzi kina maana ya kumkaribia au kumwendea mtu. “Walimwendea Petro” ni cha asili na huhifadhi mwendo unaoelekezwa kwake.
- source_word: δίδραχμα
  choice: kodi ya drakma mbili
  rationale: Didrakma ilikuwa kiasi cha drakma mbili. Katika muktadha huu neno linarejelea malipo ya kodi, hivyo tafsiri hii inaonyesha kiasi na kazi yake bila kutumia istilahi ngumu isiyoeleweka kwa urahisi.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: mwalimu wenu
  rationale: διδάσκαλος humaanisha “mwalimu,” na kiwakilishi cha wingi ὑμῶν kimehifadhiwa kwa “wenu.”
- source_word: οὐ τελεῖ
  choice: halipi
  rationale: Katika habari ya kodi, τελέω ina maana ya kulipa wajibu. Muundo hasi wa swali la Kigiriki umehifadhiwa bila kulazimisha jibu linalotarajiwa.
theological_decisions:
- issue: Kutambua δίδραχμα kuwa kodi badala ya sarafu tu
  choice: kodi ya drakma mbili
  alternative: sarafu za drakma mbili; didrakma
  rationale: Mazungumzo yanahusu kama Yesu analipa malipo yaliyodaiwa, si kama anapokea au kutumia sarafu fulani. “Kodi” huweka wazi maana ya kimuktadha bila kuongeza dai la kimadhehebu.
- issue: Aina ya kodi inayokusanywa
  choice: Kutaja “kodi” katika matini na kueleza “kodi ya hekalu” katika tanbihi
  alternative: Kusema moja kwa moja “kodi ya hekalu” katika matini
  rationale: Kigiriki cha aya hii kinasema kihalisi “didrakma” bila kutumia neno “hekalu.” Tanbihi hutoa muktadha wa kitamaduni huku matini ikihifadhi kiwango cha uwazi cha chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walimwendea” na “halipi” ni maneno ya kawaida yanayoeleweka kwa urahisi. Muundo wa swali hasi umehifadhiwa ili kutosuluhisha kimyakimya matarajio yaliyomo katika swali la Kigiriki.
