source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: sw
  text: 'Kisha Petro akajibu, akamwambia Yesu, “Bwana, ni vizuri kwetu kuwa hapa. Ukitaka, nitatengeneza vibanda vitatu[a] hapa: kimoja chako, kimoja cha Musa, na kimoja cha Eliya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahema” au “maskani”; neno la Kigiriki linaweza kumaanisha makao ya muda ya aina hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Kisha ... akajibu, akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa δὲ na kuhifadhi kwa Kiswahili cha kawaida fomula ya Kigiriki ya kusema ‘akajibu, akasema/akamwambia’, bila kudokeza lazima kwamba swali lilikuwa limeulizwa.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida na yenye heshima ya κύριος katika kumwendea Yesu, huku ikihifadhi uwezekano wa uzito wa kitheolojia wa cheo hicho.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ni vizuri sisi kuwa hapa
  rationale: Ni usemi wa asili wa Kiswahili unaofuatilia kwa karibu muundo na maana ya kifungu cha Kigiriki.
- source_word: εἰ θέλεις
  choice: Ukitaka
  rationale: Huwasilisha kwa kawaida maana ya kutaka au kupenda kwa Yesu, katika kauli ya heshima isiyo nzito kupita kiasi.
- source_word: ποιήσω
  choice: nitatengeneza
  rationale: Kitenzi hiki kinafaa kwa kutengeneza miundo ya muda na kinahifadhi upana wa ποιέω kuliko ‘kujenga’, ambalo lingeweza kudokeza majengo ya kudumu.
- source_word: σκηνάς
  choice: vibanda
  rationale: ‘Vibanda’ hueleweka kwa urahisi kama makao au vivuli vya muda. Hakiwekewi maana ya kiibada moja kwa moja, huku tanbihi ikihifadhi tafsiri nyingine zinazowezekana.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: kimoja chako, kimoja cha Musa, na kimoja cha Eliya
  rationale: Kurudiwa kwa ‘kimoja’ kunahifadhi msisitizo wa mgawanyo uliomo katika kurudiwa kwa μίαν katika Kigiriki.
- source_word: ὧδε
  choice: hapa
  rationale: Neno ‘hapa’ ni la kawaida na limerudiwa kama ilivyo katika matini ya Kigiriki.
theological_decisions:
- issue: Tafsiri ya κύριος Yesu anapoambiwa moja kwa moja
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: ‘Bwana’ huhifadhi wigo wa maana wa cheo hiki, kuanzia heshima katika mazungumzo hadi uzito wake wa kitheolojia, bila kuamua mapema nguvu yake katika muktadha.
- issue: Maana ya σκηνάς katika tukio la kubadilika sura
  choice: vibanda
  alternative: mahema; maskani
  rationale: Matini haisemi wazi kuwa Petro anarejelea Sikukuu ya Vibanda. Tafsiri kuu inatumia neno la kawaida kwa miundo ya muda, na tanbihi huhifadhi maneno yanayoweza kuonyesha mwangwi wa kiibada au wa sikukuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia mfuatano wa vitenzi vya wakati uliopita, na maneno rahisi kama ‘Ukitaka’ na ‘vibanda’ yamechaguliwa ili mstari ueleweke kwa msomaji wa kawaida bila kupoteza utata wa asili.
