translation:
  language: sw
  text: Ndipo wanafunzi wakaelewa kwamba alikuwa amesema kwao kuhusu Yohana Mbatizaji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohana Mbatiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha kawaida cha masimulizi kinachoonyesha wakati huo ndipo walipofikia kuelewa.
- source_word: συνῆκαν
  choice: wakaelewa
  rationale: Kitenzi hiki kinaonyesha kwamba wanafunzi walipata maana ya maneno ya Yesu; ‘wakaelewa’ ni cha asili na wazi katika Kiswahili.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida la Injili kwa wafuasi wanaojifunza kutoka kwa Yesu.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa linaanzisha maudhui ya jambo waliloelewa, wala si sababu.
- source_word: περὶ
  choice: kuhusu
  rationale: Pamoja na hali ya umilikishi, neno hili linaonyesha mtu aliyekuwa mada ya maneno ya Yesu.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohana Mbatizaji
  rationale: ‘Mbatizaji’ huwasilisha kazi inayotajwa na βαπτιστής na ni jina la cheo linaloeleweka katika Kiswahili cha Biblia.
- source_word: εἶπεν αὐτοῖς
  choice: alikuwa amewaambia
  rationale: Ingawa Kigiriki kina wakati uliopita sahili, umbo hili la Kiswahili linaonyesha kwa kawaida kwamba Yesu alisema maneno hayo kabla ya wanafunzi kuyaelewa; ‘aliwaambia’ pia linawezekana.
theological_decisions:
- issue: Utambulisho wa anayewakilisha Eliya katika muktadha wa karibu
  choice: Aya inasema wazi kwamba wanafunzi walielewa Yesu kuwa alikuwa akizungumza kuhusu Yohana Mbatizaji.
  alternative: Kuacha mhusika bila kutambuliwa au kuongeza maelezo ya jinsi Yohana anavyohusiana na Eliya.
  rationale: Huu ni utambulisho wa moja kwa moja unaotolewa na msimulizi, si hitimisho la kitheolojia lililoongezwa na mtafsiri; tafsiri haisemi zaidi ya aya yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Ndipo ... wakaelewa’ kina mtiririko wa kawaida wa masimulizi. ‘Yohana Mbatizaji’ limetumika kama cheo kinachotambulika, huku mbadala wa kitenzi ‘Mbatiza’ ukihifadhiwa katika tanbihi.
