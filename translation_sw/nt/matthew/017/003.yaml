base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: sw
  text: Na tazama, Musa na Eliya wakawatokea[a], wakizungumza naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walionekana kwao.” Kitenzi cha Kigiriki kina umbo la kutendwa, lakini “wakawatokea” ni usemi wa kawaida zaidi katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili linaelekeza usikivu wa msomaji kwenye tukio la ghafla na la kushangaza; “tazama” ni la kawaida, lenye hadhi, na linaweka wazi nguvu ya kiashiria hiki cha mazungumzo.
- source_word: ὤφθη
  choice: wakawatokea
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, kitenzi hiki hutumiwa kwa maana ya kuonekana au kujidhihirisha. “Wakawatokea” ni Kiswahili cha asili kinachowasilisha tukio la wao kuonekana mbele ya wanafunzi bila kufafanua namna ya uwepo wao.
- source_word: αὐτοῖς
  choice: -wa- katika “wakawatokea”
  rationale: Yambwa hii inaonyesha wale walioona tukio. Kiambishi “-wa-” kinatoa maana ya “kwao/mbele yao” kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi mapana ya Kiswahili.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili.
- source_word: συλλαλοῦντες
  choice: wakizungumza
  rationale: Kitenzi kishirikishi kinaonyesha kuwa walikuwa wakisema pamoja au kufanya mazungumzo. “Wakizungumza” ni cha asili na kinadokeza mawasiliano ya pande mbili.
- source_word: μετ’ αὐτοῦ
  choice: naye
  rationale: μετά pamoja na hali ya umilikishi huonyesha ushirika. “Naye” huhifadhi kiwakilishi cha Kigiriki; katika muktadha kinamrejelea Yesu.
theological_decisions:
- issue: Anayerejelewa na αὐτοῦ
  choice: Kiwakilishi “naye” kimrejelee Yesu bila kubadili kuwa jina “Yesu”
  alternative: wakizungumza na Yesu
  rationale: Muktadha wa karibu unaonyesha wazi kuwa anayerejelewa ni Yesu, lakini kuhifadhi kiwakilishi kunafuata muundo wa Kigiriki na kuepuka ufafanuzi usio wa lazima.
- issue: Namna ya kueleza tukio la kuonekana
  choice: Musa na Eliya “wakawatokea”
  alternative: Musa na Eliya wakaonekana nao
  rationale: Maandishi yanadai kwamba Musa na Eliya walionekana kwa wanafunzi, lakini hayafafanui namna ya kuwapo kwao. Tafsiri hii huhifadhi dai hilo bila kuingiza maelezo ya kiteolojia kuhusu hali au namna ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Na tazama” huhifadhi msisitizo na ghafla ya ἰδοὺ; “wakawatokea” na “wakizungumza naye” huleta mtiririko wa kawaida bila kupunguza utata halisi wa maandishi.
