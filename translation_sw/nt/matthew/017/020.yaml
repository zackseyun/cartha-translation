id: MAT.17.20
reference: Matthew 17:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: sw
  text: Lakini anawaambia, “Ni kwa sababu ya imani yenu ndogo.[a] Kwa kweli ninawaambia, mkiwa na imani kama punje ya haradali, mtauambia mlima huu, ‘Ondoka hapa uende kule,’ nao utahama; na hakuna jambo litakaloshindikana kwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu imani yenu ni pungufu.” Neno la Kigiriki linaonyesha udogo au upungufu wa imani, si lazima kutokuwa na imani kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umehifadhiwa ili kudumisha uhai wa simulizi la Mathayo.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Ni kwa sababu ya imani yenu ndogo
  rationale: ὀλιγοπιστία inaonyesha imani pungufu au dhaifu, si lazima kutokuwa na imani kabisa. Usemi huu pia unaendana na matumizi yake yanayojirudia katika Mathayo.
- source_word: ἀμὴν
  choice: Kwa kweli
  rationale: Huu ni usemi wa kusisitiza ukweli na uzito wa tamko linalofuata; “Kwa kweli” ni Kiswahili cha sasa na cha kawaida.
- source_word: πίστιν
  choice: imani
  rationale: Katika muktadha huu neno hilo linamaanisha kumtumaini Mungu na uwezo wake; “imani” huhifadhi istilahi pana bila kuingiza tafsiri ya kimadhehebu.
- source_word: ὡς κόκκον σινάπεως
  choice: kama punje ya haradali
  rationale: Tafsiri hii huhifadhi tashbihi ya Kigiriki na picha ya kitu kidogo sana kwa lugha ya kawaida.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Ondoka hapa uende kule
  rationale: Amri hiyo inataka mlima ubadili mahali. Usemi huu ni wa asili katika Kiswahili unapouelekeza mlima.
- source_word: μεταβήσεται
  choice: utahama
  rationale: Kitenzi cha Kigiriki hapa hakihitaji mtendaji mwingine; mlima wenyewe unabadilisha mahali.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: hakuna jambo litakaloshindikana kwenu
  rationale: Huu ni ulinganifu wa asili wa nahau ya Kigiriki kwamba hakuna kitu kitakachokuwa kisichowezekana kwao.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa muujiza
  choice: imani
  alternative: tumaini
  rationale: Muktadha unahusu kutegemea uwezo wa Mungu, lakini “imani” huhifadhi upana wa neno la Kigiriki na haitoi dai mahsusi kuhusu imani iokoayo wala uaminifu.
- issue: Nguvu ya kauli kuhusu mlima na jambo lisilowezekana
  choice: Imehifadhiwa kama kauli ya moja kwa moja bila kuieleza kuwa halisi tu au ya mfano tu
  alternative: Kuifafanua mapema kuwa ni sitiari ya matatizo makubwa
  rationale: Andiko lenyewe linatumia picha ya mlima bila kufafanua mipaka yake; tafsiri haipaswi kuondoa mvutano huo wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Wakati uliopo wa kihistoria umehifadhiwa katika “anawaambia.” “Lakini” inawakilisha δέ, ingawa kiunganishi hicho hapa ni hafifu.
