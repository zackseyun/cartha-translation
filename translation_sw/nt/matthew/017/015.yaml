  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: sw
  text: akisema, “Bwana, umhurumie mwanangu, kwa sababu hupatwa na degedege[a] na anateseka sana; maana mara nyingi huanguka motoni na mara nyingi majini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ana kifafa”; kihalisi, “amepigwa na mwezi.” Neno la Kigiriki linaonyesha nahau ya kale iliyotumiwa kuhusu hali ya mashambulizi yanayofanana na degedege.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: akisema
  rationale: Kirai cha hali ya kuendelea kinaunganisha ombi hili na tendo lililotangulia; ‘akisema’ ni Kiswahili cha asili na huhifadhi uhusiano huo bila kuanzisha sentensi huru isiyokuwamo katika Kigiriki.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni neno la kumwita Yesu kwa heshima; ‘Bwana’ ndilo neno la kawaida, lenye hadhi, kwa κύριος katika muktadha huu.
- source_word: ἐλέησόν
  choice: umhurumie
  rationale: Amri ya ombi linalotaka msaada wa huruma. ‘Umhurumie’ ni ya kawaida na huhifadhi uzito wa kilio cha baba.
- source_word: μου τὸν υἱόν
  choice: mwanangu
  rationale: υἱός humaanisha mwana wa kiume, lakini katika Kiswahili ‘mwanangu’ ndilo tamko la kawaida la mzazi na linafaa katika muktadha; kuongeza ‘wa kiume’ kungekuwa kizito na kisicho cha kawaida hapa.
- source_word: σεληνιάζεται
  choice: ana kifafa[a]
  rationale: Neno hilo la kale linahusishwa kihalisi na mwezi na hutaja hali ya mashambulizi yanayofanana na kifafa. ‘Ana kifafa’ linaeleweka kwa wasomaji wa sasa, huku tanbihi ikihifadhi nahau ya Kigiriki na kuepuka kuthibitisha kwamba mwezi ndio chanzo.
- source_word: κακῶς πάσχει
  choice: anateseka sana
  rationale: κακῶς huongeza ukali wa πάσχει; ‘anateseka sana’ ni Kiswahili cha kawaida kinachoonyesha mateso makali.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Huwasilisha kwa ufupi maana ya kutokea tena na tena na pia huhifadhi urudiaji wa neno hilo katika vifungu viwili sambamba.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: huanguka motoni
  rationale: Ni tafsiri ya asili ya Kiswahili inayoonyesha kuanguka ndani ya moto, bila kulazimisha matumizi yasiyo ya kawaida ya kihusishi.
- source_word: εἰς τὸ ὕδωρ
  choice: majini
  rationale: ‘Majini’ kwa kawaida humaanisha ndani ya maji na huhifadhi usambamba na ‘motoni’.
theological_decisions:
- issue: Maana ya σεληνιάζεται katika muktadha wa uponyaji na kutoa pepo
  choice: ana kifafa, huku nahau halisi ikielezwa katika tanbihi
  alternative: amepigwa na mwezi / hupatwa na degedege
  rationale: Mstari huu unaripoti maelezo ya baba kuhusu hali ya mwanawe, si utambuzi wa kitabibu wala kauli kwamba mwezi uliisababisha. Tafsiri kuu inawasilisha hali inayoeleweka, na tanbihi huhifadhi picha na utata wa usemi wa kale bila kuamua kimyakimya sababu yake ya kitheolojia au kitabibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kusomeka kwa sauti. ‘Mwanangu’ limechaguliwa badala ya ‘mwanangu wa kiume’ kwa kuwa la pili si la kawaida katika ombi la mzazi, ingawa Kigiriki hutaja mwana wa kiume. Alama ya tanbihi imewekwa baada ya neno linalohitaji ufafanuzi.
