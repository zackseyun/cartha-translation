  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: sw
  text: Akasema, “Ndiyo.” Petro alipoingia nyumbani, Yesu akasema naye kwanza, “Unaonaje, Simoni? Wafalme wa dunia hukusanya ushuru wa forodha au kodi ya kichwa kutoka kwa nani—wana wao wenyewe au watu wengine[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nje.” Neno la Kigiriki linamaanisha wale wasio wa familia yao, yaani, walio nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Ndiyo
  rationale: Ni jibu rahisi la kukubali, na “Ndiyo” ni Kiswahili sanifu na cha kawaida.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Petro alipoingia nyumbani
  rationale: Kirai tegemezi cha wakati kinaweka wazi kwamba mtendaji anayeeleweka ni Petro; kutaja jina lake huondoa utata wa viwakilishi katika Kiswahili.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: Yesu akatangulia kusema naye
  rationale: Huwasilisha kwa njia ya asili kwamba Yesu alianza kusema kabla Petro hajasema, bila kutumia sitiari ngumu ya ‘kumwahi.’
- source_word: Τί σοι δοκεῖ
  choice: Unaonaje
  rationale: Ni usemi wa kawaida wa Kiswahili unaomwomba Simoni atoe maoni au hukumu yake.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Huhifadhi maana pana ya γῆ na kutofautisha wafalme wa kidunia bila kuibana kuwa nchi fulani.
- source_word: τέλη
  choice: ushuru wa forodha
  rationale: Hurejelea ushuru usio wa moja kwa moja, kama ada za forodha, na hutofautishwa wazi na κῆνσον.
- source_word: κῆνσον
  choice: kodi ya kichwa
  rationale: Ni kodi inayotozwa kwa mtu mmoja mmoja na inahifadhi tofauti yake na ushuru wa forodha.
- source_word: υἱῶν αὐτῶν
  choice: wana wao wenyewe
  rationale: “Wana” huhifadhi lugha mahususi ya kifamilia na “wao wenyewe” huimarisha utofautishaji na walio nje ya familia.
- source_word: ἀλλοτρίων
  choice: watu wengine
  rationale: Ni tafsiri ya asili inayoonyesha watu wasiokuwa wana wa wafalme; tanbihi inadokeza maana ya ‘watu wa nje.’
theological_decisions:
- issue: Dokezo la kiteolojia la ‘wana’ katika mfano wa Yesu
  choice: Kuhifadhi usemi halisi wa kifamilia ‘wana wao wenyewe’ bila kufafanua maana yake ya kikristolojia katika aya hii.
  alternative: watoto wao; raia wao
  rationale: Hoja ya karibu ni kwamba wana wa mfalme hawatozwi kama watu wa nje, nayo inaandaa dokezo la kiteolojia katika aya inayofuata. “Wana” huhifadhi mvutano huo bila kuutafsiri kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi huku tofauti kati ya ushuru wa forodha na kodi ya kichwa, pamoja na lugha ya kifamilia, ikihifadhiwa.
