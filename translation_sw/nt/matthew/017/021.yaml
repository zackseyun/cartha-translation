  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: sw
  text: Lakini[a] aina hii haitoki isipokuwa kwa sala na kufunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki (zikiwemo Sinaiticus na Vaticanus za karne ya nne), wala katika tafsiri za kale za Kisiria na Kikopti. Hata hivyo, upo katika mapokeo ya hati nyingi za Kibizanti, mapokeo ya Kilatini, na hati nyingi za Kisiria. Huenda uliongezwa na wanakili wa baadaye ili kupatanisha kifungu hiki na Marko 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: aina
  rationale: Katika muktadha huu neno hili linamaanisha kundi au namna fulani ya pepo, si ukoo au taifa; “aina” ni Kiswahili cha kawaida na sahihi.
- source_word: ἐκπορεύεται
  choice: haitoki
  rationale: Kitenzi kinaeleza pepo kutoka ndani ya mtu aliyeteswa; “haitoki” huhifadhi maana ya mwendo wa kutoka kwa lugha ya kawaida.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Kirai hiki kinaweka sharti la kipekee, na “isipokuwa” hukitoa kwa ufupi na kwa kawaida.
- source_word: προσευχῇ
  choice: sala
  rationale: “Sala” ni neno la kawaida, lenye heshima, kwa tendo la kumwomba Mungu.
- source_word: νηστείᾳ
  choice: kufunga
  rationale: Hurejelea kujinyima chakula kwa kusudi la kidini; “kufunga” ndiyo istilahi ya kawaida ya Kiswahili katika muktadha huu.
