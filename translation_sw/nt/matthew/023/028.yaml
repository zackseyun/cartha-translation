id: MAT.23.28
reference: Matthew 23:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: sw
  text: Vivyo hivyo, ninyi pia kwa nje mnaonekana kuwa wenye haki mbele ya watu, lakini kwa ndani mmejaa unafiki na uasi dhidi ya sheria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Inaunganisha mstari huu na mfano uliotangulia wa makaburi yaliyopakwa chokaa na kuhifadhi maana ya ulinganisho.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: kwa nje ... kwa ndani
  rationale: Jozi hii ni ya kawaida katika Kiswahili na inadumisha wazi utofauti wa hali inayoonekana na hali halisi ya ndani.
- source_word: φαίνεσθε
  choice: mnaonekana kuwa
  rationale: Inaeleza mtazamo wanaotoa kwa watazamaji bila kuthibitisha kwamba kwa kweli wao ni wenye haki.
- source_word: τοῖς ἀνθρώποις
  choice: mbele ya watu
  rationale: Hapa dativu inaonyesha jinsi wanavyoonekana machoni pa watu; “watu” ni neno jumuishi na la kawaida.
- source_word: δίκαιοι
  choice: wenye haki
  rationale: Inahifadhi uzito wa kimaadili na kidini wa neno, huku kitenzi “mnaonekana” kikionyesha kuwa haki hiyo ni ya sura tu.
- source_word: μεστοὶ
  choice: mmejaa
  rationale: Ni usemi wa moja kwa moja na wa kawaida kwa hali ya kuwa na kitu kwa wingi.
- source_word: ὑποκρίσεως
  choice: unafiki
  rationale: Ni neno la kawaida na sahihi kwa kujionyesha kuwa mwema ilhali hali ya ndani ni tofauti.
- source_word: ἀνομίας
  choice: uasi wa sheria
  rationale: Inahifadhi uhusiano wa ἀνομία na sheria badala ya kulifanya kuwa uovu wa jumla tu; katika muktadha huu linadokeza kuikataa au kuivunja sheria ya Mungu.
theological_decisions:
- issue: Je, δίκαιοι inaeleza haki halisi au haki inayoonekana tu?
  choice: Haki inayoonekana tu machoni pa watu
  alternative: Haki halisi
  rationale: Muundo “mnaonekana kuwa ... lakini kwa ndani mmejaa” unatofautisha sura ya nje na hali halisi ya ndani, hivyo hautoi uthibitisho wa haki halisi.
- issue: Upeo wa maana ya ἀνομίας
  choice: uasi wa sheria
  alternative: uovu
  rationale: Tafsiri iliyochaguliwa inahifadhi mwelekeo wa neno kwa kutotii sheria, bila kulibana kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyohitajika kwa sababu “watu” tayari huwasilisha maana jumuishi ya ἀνθρώποις.
