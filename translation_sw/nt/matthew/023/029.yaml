  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: sw
  text: Ole wenu, waandishi na Mafarisayo, wanafiki, kwa kuwa mnajenga makaburi ya manabii na kuyapamba makumbusho[a] ya wenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, makaburi ya ukumbusho. Neno la Kigiriki linaweza kumaanisha makaburi au kumbukumbu za waliokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ole wenu
  rationale: Kauli ya kinabii ya kuonya na kutangaza hukumu; “Ole wenu” huhifadhi uzito wake kuliko usemi laini wa huzuni pekee.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi iliyozoeleka kwa wataalamu wa Kiyahudi wa Maandiko na sheria, na inafuata neno la Kigiriki bila kulipanua kiufafanuzi.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Jina la kundi limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Huwasilisha unafiki wa kidini na kujifanya unaoshutumiwa katika muktadha huu.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Huonyesha wazi sababu ya tamko la “Ole wenu” kwa lugha ya sasa yenye hadhi.
- source_word: οἰκοδομεῖτε
  choice: mnajenga
  rationale: Huhifadhi hali ya sasa yenye maana ya tendo la kawaida bila kuongeza dhana ya kujenga upya.
- source_word: τάφους
  choice: makaburi
  rationale: Inafaa kwa sehemu zilizojengwa kwa ajili ya maziko na inaendana na kitenzi “mnajenga.”
- source_word: προφητῶν
  choice: ya manabii
  rationale: Huwakilisha kwa kawaida uhusiano wa umilikaji wa hali ya pili.
- source_word: κοσμεῖτε
  choice: kuyapamba
  rationale: Hutoa maana ya kuyafanya yawe na mapambo au yaonekane vizuri kwa Kiswahili cha kawaida.
- source_word: μνημεῖα
  choice: majengo ya ukumbusho
  rationale: Hutofautisha neno hili na τάφους (“makaburi”) lililotumiwa awali, huku likihifadhi wazo la sehemu au jengo la kumkumbuka aliyekufa.
- source_word: δικαίων
  choice: wenye haki
  rationale: Ni kivumishi kilichotumiwa kama nomino kwa watu waadilifu; “wenye haki” huhifadhi maana ya kimaadili na kitheolojia bila ufafanuzi wa ziada.
theological_decisions:
- issue: Maana ya δικαίων katika muktadha huu
  choice: wenye haki
  alternative: waadilifu
  rationale: “Wenye haki” ni istilahi pana na iliyozoeleka kwa watu wanaotambuliwa kuwa wanyoofu mbele za Mungu; haileti kwa lazima mfumo wa mafundisho usiotajwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unaunganisha moja kwa moja tamko la hukumu na sababu yake; msamiati unatofautisha τάφους na μνημεῖα bila kuficha uwezekano wa neno la pili kumaanisha kaburi.
