reference: Matthew 23:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: sw
  text: Kwa hiyo, yeyote anayeapa kwa madhabahu anaapa kwa madhabahu hiyo na kwa vitu vyote vilivyo juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi wa Kigiriki ni mpana kuliko “sadaka” moja; unahusu vitu vyote vilivyo juu ya madhabahu.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Kwa hiyo, yeyote anayeapa
  rationale: οὖν ni kiunganishi cha hitimisho, nacho kimetafsiriwa “Kwa hiyo.” Kirai chenye participo na kibainishi kinamtaja mtu kwa ujumla; “yeyote anayeapa” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: kwa madhabahu
  rationale: Katika kauli ya kiapo, ἐν pamoja na ὀμνύω ina maana ya kuapa kwa kitu fulani, si kuwa ndani yake. θυσιαστήριον ni “madhabahu.”
- source_word: ὀμνύει ἐν αὐτῷ
  choice: anaapa kwa madhabahu hiyo
  rationale: Wakati uliopo unaonyesha kanuni ya jumla. Nomino “madhabahu” imerudiwa badala ya kutumia “hiyo” peke yake ili kuepuka kuchanganya maana na kiunganishi “Kwa hiyo” kilicho mwanzoni.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: na kwa vitu vyote vilivyo juu yake
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ ni usemi mpana unaomaanisha vitu vyote vilivyo juu ya madhabahu. Tafsiri haijaufupisha kuwa “sadaka,” kwa kuwa Kigiriki hakitumii neno hilo hapa.
theological_decisions:
- issue: Vitu vinavyorejelewa na “vitu vyote vilivyo juu yake”
  choice: Usemi wa jumla kuhusu vitu vyote vilivyo juu ya madhabahu
  alternative: sadaka zote zilizo juu yake
  rationale: Muktadha wa mistari 18–19 unataja sadaka, lakini mstari huu una usemi mpana zaidi. Tafsiri inaacha upana huo bila kuamua kwamba vitu hivyo ni sadaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yeyote anayeapa” unaeleweka kwa urahisi, na kurudiwa kwa “madhabahu” kunazuia utata wa “kwa hiyo.”
