id: MAT.23.23
reference: Matthew 23:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: sw
  text: '“Ole wenu, waandishi na Mafarisayo, wanafiki! Kwa maana mnatoa zaka ya mnanaa, bizari na jira, lakini mmeacha mambo mazito zaidi ya Sheria: haki, rehema na uaminifu.[a] Hayo mliwajibika kuyafanya bila kuyaacha yale mengine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imani.” Neno la Kigiriki linaweza kumaanisha imani, kutumaini, au uaminifu; katika muktadha huu wa kimaadili wengi hulielewa kuwa uaminifu.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ole wenu
  rationale: Huhifadhi nguvu ya tangazo la kinabii la hukumu na karipio, badala ya kuwa kilio chepesi cha huzuni.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi ya kibiblia iliyozoeleka kwa wataalamu wa Maandiko na Sheria katika mazingira ya Injili, na inafuata neno la Kigiriki kwa karibu.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Huwasilisha kwa lugha ya kawaida maana ya kimaadili ya watu wanaojionyesha kuwa kitu ambacho si wao.
- source_word: ἀποδεκατοῦτε
  choice: mnatoa zaka ya
  rationale: Kitenzi hiki humaanisha kutoa sehemu ya kumi; ‘kutoa zaka’ ni usemi wa kawaida unaohifadhi maana ya kidini na kisheria.
- source_word: ἡδύοσμον
  choice: mnanaa
  rationale: Jina la kawaida la Kiswahili la mmea unaoitwa mint.
- source_word: ἄνηθον
  choice: bizari
  rationale: Jina linalotumika katika mapokeo ya Biblia ya Kiswahili kwa mmea wa dill, na linaitofautisha hapa na jira.
- source_word: κύμινον
  choice: jira
  rationale: Jina la kawaida la Kiswahili la kiungo cha cumin.
- source_word: ἀφήκατε
  choice: mmeacha
  rationale: Hutoa maana ya kuacha kando au kutotimiza, huku marudio ya kitenzi mwishoni mwa aya yakibaki dhahiri.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: mambo mazito zaidi ya Sheria
  rationale: Huhifadhi sitiari ya uzito inayomaanisha umuhimu mkubwa, na bado inaeleweka kwa msomaji wa kawaida.
- source_word: κρίσιν
  choice: haki
  rationale: Katika orodha hii ya wajibu wa kimaadili, neno linamaanisha kutenda kwa haki zaidi kuliko tendo la kutoa hukumu tu.
- source_word: ἔλεος
  choice: rehema
  rationale: Ni tafsiri ya kawaida ya kibiblia inayobeba maana ya huruma inayomwelekea mwenye uhitaji.
- source_word: πίστιν
  choice: uaminifu
  rationale: Katika orodha ya matakwa ya kimaadili ya Sheria, ‘uaminifu’ huwasilisha vizuri maana ya kutegemeka au kuwa mwaminifu; uwezekano wa ‘imani’ umehifadhiwa katika tanbihi.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: Hayo mliwajibika kuyafanya bila kuyaacha yale mengine
  rationale: Hutofautisha wazi ‘hayo’—haki, rehema na uaminifu—na ‘yale mengine’—utoaji wa zaka—bila kuondoa wajibu wa upande wowote.
theological_decisions:
- issue: Maana ya πίστιν katika orodha ya wajibu wa kimaadili
  choice: uaminifu
  alternative: imani
  rationale: Neno la Kigiriki linaweza kumaanisha imani, kutumaini, au uaminifu. Mazingira ya mambo muhimu zaidi ya Sheria yanaelekeza kwa uaminifu kama sifa ya kimaadili, lakini utata halisi wa neno umehifadhiwa kwa kutaja ‘imani’ katika tanbihi.
- issue: Uhusiano kati ya mambo mazito zaidi na utoaji wa zaka
  choice: Kauli inasisitiza kutenda haki, rehema na uaminifu bila kuacha utoaji wa zaka uliotajwa
  alternative: Kuitafsiri kauli kama kufuta kabisa wajibu wa mambo madogo
  rationale: Muundo wa Kigiriki unasema wazi kwamba ‘hayo’ yalipaswa kufanywa pasipo ‘yale mengine’ kuachwa; tafsiri haipaswi kufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ole wenu’ hudumisha sauti kali ya kinabii; ‘mambo mazito zaidi’ huhifadhi sitiari ya asili. Majina ya viungo—mnanaa, bizari na jira—yanafuata matumizi yanayotambulika katika Kiswahili cha kibiblia.
