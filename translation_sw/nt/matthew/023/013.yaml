  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: sw
  text: Lakini ole wenu, waandishi wa sheria na Mafarisayo, wanafiki! Kwa maana mnawafungia watu ufalme wa mbinguni[a]. Ninyi wenyewe hamwingii, wala hamwaruhusu wanaoingia[b] waingie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufalme wa mbingu.” Mathayo hutumia mara kwa mara usemi huu mahali ambapo miktadha mingine inaweza kusema “ufalme wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au “wanaojaribu kuingia.” Kitenzi-shirikishi cha Kigiriki kinaweza kumaanisha walio katika hatua ya kuingia au wanaotafuta kuingia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: ole
  rationale: Neno “ole” linadumisha nguvu ya tamko la kinabii la hukumu na maafa, badala ya kulifanya kuwa kilio chepesi cha huzuni.
- source_word: γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika muktadha wa Injili, hawa ni wataalamu na walimu wa Maandiko na sheria; “waandishi wa sheria” ni wazi zaidi kwa msomaji wa sasa kuliko “waandishi” peke yake.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la kidini.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Neno hili linaeleza kujionyesha kwa nje kuwa waadilifu huku hali ya ndani ikiwa tofauti.
- source_word: κλείετε ... ἔμπροσθεν τῶν ἀνθρώπων
  choice: mnawafungia watu
  rationale: Kauli hii ya Kiswahili inadumisha sitiari ya kuwazuia watu wasiingie, bila kutumia usemi usio wa kawaida “mnafunga mbele ya watu.”
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Ni usemi wa kawaida na wenye kueleweka katika Kiswahili kwa kirai bainifu cha Mathayo, huku tanbihi ikitaja wingi halisi wa “mbingu.”
- source_word: εἰσέρχεσθε
  choice: hamwingii
  rationale: Inadumisha moja kwa moja sitiari ya kuingia katika ufalme.
- source_word: τοὺς εἰσερχομένους
  choice: wanaoingia
  rationale: Inahifadhi hali ya tendo linaloendelea katika kitenzi-shirikishi cha wakati uliopo bila kuamua kimya kimya kwamba ni jaribio lisilofanikiwa tu.
- source_word: ἀφίετε ... εἰσελθεῖν
  choice: hamwaruhusu ... waingie
  rationale: Muundo huu unaonyesha wazi maana ya kuruhusu na pia unawakilisha kitenzi cha mwisho εἰσελθεῖν.
theological_decisions:
- issue: Maana ya kirai βασιλεία τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  alternative: ufalme wa mbingu
  rationale: Tafsiri ya kawaida ya Kiswahili imetumiwa bila kudai tofauti ya kiteolojia kati ya “ufalme wa mbinguni” na “ufalme wa Mungu”; wingi wa neno la Kigiriki umehifadhiwa katika tanbihi kama uwezekano wa kimuundo.
- issue: Hali ya τοὺς εἰσερχομένους
  choice: wanaoingia
  alternative: wanaojaribu kuingia
  rationale: Kitenzi-shirikishi cha Kigiriki kinaweza kueleza watu walio katika hatua ya kuingia au wanaotafuta kuingia. Maandishi makuu yanahifadhi hali ya kuendelea, na tanbihi inaonyesha maana nyingine inayowezekana.
- issue: Uhusiano wa ἔμπροσθεν τῶν ἀνθρώπων na κλείετε
  choice: mnawafungia watu ufalme
  alternative: mnaufunga ufalme mbele ya watu
  rationale: Chaguo kuu linaeleza kwa Kiswahili asili matokeo ya kufunga ufalme mbele ya watu—kuwazuia wasiingie—bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Mnawafungia watu” ni usemi wa sasa na wa asili unaohifadhi picha ya kuzuiwa kuingia; marudio “wanaoingia ... waingie” yamedumishwa kwa sababu yanaakisi msisitizo wa Kigiriki.
