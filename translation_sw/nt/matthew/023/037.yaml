id: MAT.23.37
reference: Matthew 23:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: sw
  text: “Yerusalemu, Yerusalemu, wewe unayewaua manabii na kuwapiga mawe wale waliotumwa kwako—ni mara ngapi nilitaka kuwakusanya watoto wako, kama vile kuku jike anavyovikusanya vifaranga vyake chini ya mabawa yake,[a] lakini hamkutaka!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “kuku jike” linaweza kumaanisha “ndege” kwa ujumla, lakini hapa picha ya kukusanya vifaranga chini ya mabawa inaelekeza hasa kwa kuku jike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Yerusalemu, Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili, huku marudio ya msisitizo na maombolezo yakihifadhiwa.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: wewe unayewaua manabii
  rationale: Kirai cha Kiswahili kinatoa wazo la sifa au tendo linalolitambulisha jiji lililofanywa kama mtu, kwa lugha ya kawaida na yenye nguvu.
- source_word: λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: na kuwapiga mawe wale waliotumwa kwako
  rationale: Muundo sambamba na kitenzi cha kwanza umehifadhiwa; 'kwako' hudumisha Yerusalemu kama jiji linalosemeshwa moja kwa moja.
- source_word: ποσάκις ἠθέλησα
  choice: ni mara ngapi nilitaka
  rationale: Hutoa kwa kawaida mshangao wa maombolezo na maana ya nia au tamanio bila kuipa kitenzi nguvu ya kiteolojia isiyomo wazi katika chanzo.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: kuwakusanya watoto wako
  rationale: Huhifadhi sitiari ya watoto wa jiji na wazo la kuwakusanya mahali pamoja bila kubainisha kundi jembamba zaidi.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: kama vile kuku anavyowakusanya vifaranga wake
  rationale: Ingawa ὄρνις inaweza kumaanisha ndege kwa ujumla, mazingira ya mzazi anayekusanya vifaranga chini ya mabawa yanaelekeza kwa kuku; urudiaji wa 'kuwakusanya' unahifadhi ulinganifu wa vitenzi vya Kigiriki.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: chini ya mabawa yake
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi picha ya ulinzi.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: lakini hamkutaka
  rationale: Nafsi ya pili wingi imehifadhiwa ili kuonyesha kuwa usemi unawafikia watoto au watu wa Yerusalemu; 'lakini' huwasilisha tofauti ya wazi kati ya nia ya Yesu na kutokutaka kwao.
theological_decisions:
- issue: Tofauti ya nia kati ya Yesu na Yerusalemu
  choice: nilitaka ... hamkutaka
  alternative: nilidhamiria ... hamkuniruhusu; au lugha ya hisia pekee kama 'nilitamani sana'
  rationale: Chanzo kinatumia kitenzi kilekile θέλω kwa pande zote mbili. Tafsiri inahifadhi mvutano wa nia na uwajibikaji bila kutatua mjadala mpana kuhusu mapenzi ya Mungu, hiari ya mwanadamu, au Kristolojia.
- issue: Utambulisho wa 'watoto wako'
  choice: watoto wako
  alternative: watu wako; wakazi wako
  rationale: Huhifadhi taswira ya Yerusalemu kama mama wa watu wake na huepuka kufafanua zaidi ya maandishi.
- issue: Mabadiliko kutoka umoja kwenda wingi
  choice: wewe ... kwako ... watoto wako ... hamkutaka
  alternative: hukukubali
  rationale: Kigiriki humsemesha Yerusalemu kwa umoja katika sehemu ya kwanza, kisha hutumia wingi ἠθελήσατε kuhusu watu wake. Kiswahili kimehifadhi mabadiliko hayo muhimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maombolezo, urudiaji wa jina, sitiari ya watoto, na tofauti ya umoja na wingi zimehifadhiwa. Alama ya tanbihi [a] imewekwa katika matini kuu.
