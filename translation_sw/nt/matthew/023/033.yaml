  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: sw
  text: Enyi nyoka, wazao wa nyoka wenye sumu! Mtawezaje kuikwepa hukumu ya Gehena?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hukumu ya jehanamu.” Kigiriki: “Gehena.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: nyoka
  rationale: Ni neno la moja kwa moja la kuwakemea; “nyoka” ni la kawaida na linaendeleza taswira ya chanzo.
- source_word: γεννήματα ἐχιδνῶν
  choice: wazao wa nyoka wenye sumu
  rationale: “Wazao” huakisi kile kilichozaliwa, huku “nyoka wenye sumu” ikieleza kwa lugha ya kawaida aina hatari inayokusudiwa na ἐχιδνῶν.
- source_word: πῶς φύγητε
  choice: mtawezaje kuikwepa
  rationale: Huendeleza swali la balagha kuhusu uwezekano wa kuiponyoka hukumu, pamoja na mwelekeo wa wakati ujao.
- source_word: κρίσεως
  choice: hukumu
  rationale: Ni tafsiri pana na ya kawaida ya neno la kimahakama, bila kulifanya moja kwa moja kuwa “adhabu” au “hukumu ya hatia.”
- source_word: γεέννης
  choice: Gehena
  rationale: Huhifadhi istilahi mahususi ya Kigiriki na msingi wake wa Kiyahudi badala ya kuisawazisha moja kwa moja na dhana zote zinazohusishwa na “jehanamu.”
theological_decisions:
- issue: Tafsiri ya γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: “Gehena” huhifadhi umahususi wa istilahi ya chanzo na uhusiano wake wa kihistoria na kieskatolojia; tafsiri iliyozoeleka “jehanamu” imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya kukemea imehifadhiwa kwa nguvu bila kutumia lugha ya kizamani; swali la balagha linasikika kwa kawaida.
